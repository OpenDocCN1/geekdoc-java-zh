    \ mod(BigInteger m) {\n    if (m.signum() <= 0)\n        throw new ArithmeticException(\"\
    Modulus <= \" + m);\n    // ... the computation\n}\n```\n\nNote that the doc comment\
    \ not say \"mod throws NullPointerException\nif m is null\", even though the method\
    \ does exactly, as a byproduct of invoking\nm.signum(). This exception is documented\
    \ in the class-doc comment for the\nenclosing BigInteger class. The class-level\
    \ comment applies to all parameters in\nall the class's public methods. This is\
