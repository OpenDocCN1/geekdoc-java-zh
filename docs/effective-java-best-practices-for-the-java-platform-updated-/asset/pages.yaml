  md: "```\nString favoriteString = f.getFavorite(String.class);\nint favoriteInteger\
    \ = f.getFavorite(Integer.class);\nClass<?> favoriteClass = f.getFavorite(Class.class);\n\
    System.out.printf(\"%s %x %s\\n\", favoriteString,\nfavoriteInteger, favoriteClass.getName());\n\
    \n```\n\nAs you would expect, the program prints Java cafebabe Favorites. Note,\
    \ incidentally, Java's printf method differs from C's in that you should use %n\
    \ where you'd use \\n in C. The %n generates the appropriate platform-specific\
    \ line separator, which is \\n on many but not all platforms.\n\nA Favorites is\
    \ typesafe; it will never return an Integer when you ask for it a String. It is\
    \ also heterogeneous: unlike an ordinary map, all the keys are of different types.\
    \ Therefore, we call Favorites typesafe heterogeneous container.\n\nThe implementation\
    \ of heterogeneous container is surprisingly thin. Here it is, in its entirety:\n\
    \n```\n// Typafe heterogeneous container pattern - implementation\npublic class\
    \ Favorites {\n    private Map<Class<?>, Object> favorites = new HashMap<>();\n\
    \n    public <T> void put(Class<T> type, T instance) {\n        favorites.put(Objects.requireNonNull(type),\
    \ instance);\n    }\n\n    public <T> T get(Class<T> type) {\n        return type.cast(favorites.get(type));\n\
    \    }\n}\n```\n\nThere are a few subtle things going on here. Each Favorites\
    \ instance is backed by a private Map<Class<?>, Object>. You might think that\
    \ you couldn't put anything into this Map because of the unbounded wildcard type,\
    \ but the truth is the opposite. The thing to notice is that the wildcard type\
    \ is nested: it's not the type of the map that's wildcard but the type of its\
    \ keys. This means every key can have a different parameterized type: one can\
    \ be Class<String>, the next Class<Integer>, and so on. That's where the heterogeneity\
    \ comes from.\n\nThe next thing to notice is that the value type of the favorites\
    \ Map is simply Object. In other words, the Map does not guarantee the type relationship\
    \ between keys and values, which is that every value is of the type represented\
    \ by its key."
