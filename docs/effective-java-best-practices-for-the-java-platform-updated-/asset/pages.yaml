  md: "# ITEM 34: USE ENUMS INSTEAD OF INT CONSTANTS\n\nIf switch statements on enums\
    \ are not a good choice for implementing constant-specific behavior on enums,\
    \ what are they good for? Switches on enums are good for augmenting enum types\
    \ with constant-specific behavior. For example, suppose the Operation is not under\
    \ your control and you wish it had an instance method to return the inverse of\
    \ each operation. You could simulate the effect with the following static method:\n\
    \n```\n// on an enum to simulate a missing method\npublic static Operation inverse(Operation\
    \ op) {\n    case PLUS: return Operation.MINUS;\n    case MINUS: return Operation.PLUS;\n\
    \    case TIMES: return Operation.DIVIDE;\n    case DIVIDE: return Operation.TIMES;\n\
    \    default: throw new AssertionError(\"Unknown op: \" + op);\n}\n```\n\nYou\
    \ should also use this technique on enums when you are under control and a method\
    \ simply doesn't belong in the enum type. The method may be required for some\
    \ use but is not generally enough to merit inclusion in the enum type.\nA minor\
    \ disadvantage of enums is that there is space and time cost to load and initialize\
    \ them, which is unlikely to be noticeable in practice.\n\nWhen you use enums?\
    \ Use enums any time you need a set of constants whose members are known at compile\
    \ time. Of course, this includes planets, days of the week, and chess pieces.\
    \ But it also includes sets for which you know all the values at compile time,\
    \ as choices in a menu, operation or command line flags. It is not necessary that\
    \ the set of constants in an enum type fixed for all. The enum feature was specifically\
    \ designed to allow for binary evolution of enum types.\n\nIn summary, the advantages\
    \ of enums over int constants are compelling. Enums are more readable, safer,\
    \ and more powerful. Many enums require no explicit constructors or members, but\
    \ benefit from associating data with each constant and providing methods whose\
    \ behavior is affected by this data. Fewer enums benefit from associating behaviors\
    \ with a single method. In this relatively rare case, prefer constant-specific\
    \ methods to enums that switch on their own values. Consider the strategy enum\
    \ pattern if some, but not all, enum share common behaviors."
