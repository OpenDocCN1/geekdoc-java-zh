  md: '# CHAPTER 9


    # General Programming


    THIS chapter is devoted to the nuts and bolts of the language. It discusses local
    variables, control structures, libraries, data types, and two extralinguistic
    facilities: reflection and native methods. Finally, it discusses optimization
    and naming conventions.


    # Item 57: Minimize the scope of local variables


    This item is similar in nature to Item 15, "Minimize the accessibility of classes
    and members." By minimizing the scope of local variables, you increase the read-ability
    and maintainability of your code and reduce the likelihood of error.


    Older programming languages, such as C, mandated that local variables must be
    declared at the head of a block, and some programmers continue to do this out
    of habit. It is a habit worth breaking. As a gentle reminder, Java lets you declare
    variables anywhere a statement is legal (does C, since C99).


    **The most powerful technique for minimizing the scope of a local variable is
    to declare it where it is used.** If a variable is declared before it is used,
    it''s just clutter—more thing to distract the reader who is trying to figure out
    what the program does. By the time the variable is used, the reader might not
    remember the variable''s type or initial value.


    Declaring a local variable prematurely can cause its scope not only to begin too
    early but also end late. The scope of a local variable extends from the point
    where it is declared to the end of the enclosing block. If a variable is declared
    outside of the block in which it is used, it remains visible after the program
    exits that block. If a variable is used accidentally before or after its region
    of intended use, the consequences can be disastrous.


    **Nearly every local variable declaration should contain an initializer.** If
    you don''t yet have enough information to initialize a variable sensibly, you
    should'
