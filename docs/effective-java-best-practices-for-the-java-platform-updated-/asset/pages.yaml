  md: "# CHAPTER 11 CONCURRENCY\n\nA few more details bear noting. The executor passed\
    \ to the time method must allow for the creation of at least as many threads as\
    \ the concurrency level, or the test will never complete. This is known as a thread\
    \ starvation deadlock [Goetzoc, 8.1.1]. If a worker thread catches an InterruptedException,\
    \ it reinserts the interrupt using the idiom Thread.currentThread().interrupt()\
    \ and returns from its non-blocking method. The executor is used to deal with\
    \ the interrupt it sees fit. Note that System.nanoTime is used to measure time.\
    \ For interval, using System.nanoTime rather than System.currentTimeMillis. System.nanoTime\
    \ is more accurate and precise and is unaffected by adjustments to the system's\
    \ real-time clock. Finally, note that the code in your example will yield accurate\
    \ timing unless action does a fair amount of work, say a second or more. Accurate\
    \ benchmarking is notoriously hard and is best done with the aid of a specialized\
    \ framework such as jMH.\n\nThis item only scratches the surface of what you can\
    \ do with concurrency utilities. For example, the countdown in the previous example\
    \ could be replaced by a CyclicBarrier or Phaser. The resulting code would be\
    \ a bit more concise but perhaps more difficult to understand.\\ While you should\
    \ always use concurrency utilities in preference to wait and notify, you might\
    \ have to maintain legacy code that uses wait and notify. The wait method is used\
    \ to make a thread wait for some condition. The method must be invoked inside\
    \ a synchronized region that locks the object on which it is invoked. Here is\
    \ the standard idiom for using the wait method\n\n```\nsynchronized(obj) {\n \
    \   while (condition does not hold) {\n        obj.wait(); // Releases lock, and\
    \ acquires on wakeup\n    }\n    // Perform action appropriate to condition\n\
    }\n```\n\nAlways use a loop to invoke the wait method; never invoke it outside\
    \ of a lock. The loop serves to test the condition before and after waiting.\n\
    Testing the condition before waiting and skipping the wait if the condition already\
    \ holds is necessary to ensure liveliness. If the condition already holds and\
    \ the notify (or notifyAll) method has already been invoked before a thread waits,\
    \ there is no guarantee that the thread will ever wake from wait.\nTesting the\
    \ condition after waiting and waiting again if the condition does not hold are\
    \ necessary to ensure safety. If the thread proceeds with the action when the\
    \ condition does not hold, it can destroy the invariant guarded by the lock. There\
    \ are several reasons a thread might wake up when the condition does not hold."
