    \ this advice is far less than it once was. This is because there is less reason\
    \ to wait and notify; the platform has provided higher-level concurrency utilities\
    \ that do the sorts of things you formerly had to hand-code wait and notify. **Given\
    \ the difficulty of using wait and notify correctly, you should use the higher-level\
    \ concurrency utilities instead.**\n\nThe higher-level utilities in java.util\
    \ fall into three categories: the Executor Framework, which was covered briefly\
    \ in Item 80; concurrent collections and synchronizers. Concurrent collections\
    \ and synchronizers are covered briefly in this item.\n\nThe concurrent collections\
    \ are high-performance implementations of standard collection interfaces such\
    \ as List, Queue, and Map. To provide high concurrency, these implementations\
    \ manage their own synchronization internally (Item 79). **It is impossible to\
    \ exclude concurrent activity from a concurrent collection unless you lock the\
    \ program.**\n\nBecause you can't exclude concurrent activity on concurrent collections,\
    \ you can't atomically compose method invocations on either. Therefore, concurrent\
    \ collection interfaces were outfitted with state-dependent modify operations,\
    \ which combine several primitives into a single atomic operation. These operations\
    \ proved sufficiently useful on concurrent collections they were added to the\
    \ corresponding collection interfaces in Java 8 (Item 21).\n\nFor example, Map.putAbsent(key,\
