  md: "them with an enum type (Item 34). Otherwise, you should export the constants\
    \ with a noninstantiable utility class (Item 4). Here is a utility class version\
    \ of the PhysicalConstants example shown earlier:\n\n```\n// Constant utility\
    \ class\npackage com.effectivejava.science;\n```\n\n```\npublic class PhysicalConstants\
    \ {\n    private PhysicalConstants() {} // Prevents instantiation\n    public\
    \ static final double AVOGADROS_NUMBER = 6.022_140_8572e-23;\n    public static\
    \ final double BOLTZMANN_CONST = 1.380_648_52e-23;\n    public static final double\
    \ ELECTRON_MASS = 9.109_383_56e-31;\n```\n\nNotably, note the use of the underscore\
    \ character (_) in the numeric literals. Underscores, which have been legal since\
    \ Java 7, have no effect on the values of numeric literals, but can make them\
    \ much easier to read if used with discretion. Consider adding five or more consecutive\
    \ underscores to separate literals, integral or floating point, if they contain\
    \ five consecutive digits. For base ten literals, whether integral or floating\
    \ point, you should use underscores to separate literals into groups of three\
    \ digits indicating positive and negative values of thousand.\n\nNormally a utility\
    \ class requires clients to qualify constant names with a class name, for example,\
    \ PhysicalConstants.AVOGADROS_NUMBER. If you make heavy use of the constants exported\
    \ by this class, you can avoid the need for qualifying the constants with the\
    \ class name by making use of the static import facility:\n\n```\n// Use of static\
    \ import to avoid qualifying constants\nimport static com.effectivejava.science.PhysicalConstants.*;\n\
    ```\n\n```\npublic class Test {\n    double atoms(double moles) {\n        return\
    \ AVOGADROS_NUMBER * moles;\n    }\n```\n\n```\n// Many uses of PhysicalConstants\
    \ justify static import\n```\n\nIn summary, interfaces should be used only to\
    \ define types. They should not be used merely to export constants."
