  md: '# Enums and Annotations


    JAVA supports two special-purpose families of reference types: a kind of class
    called an enum type, and a kind of interface called an annotation type. This chapter
    discusses best practices for using these type families.


    # Item 34: Use enums instead of int constants


    An enumerated type is a type whose legal values consist of a fixed set of constants,
    such as the seasons of the year, the planets in the solar system, or the suits
    in a deck of playing cards. Before enum types were added to the language, a common
    pattern for representing enumerated types was to declare a group of named int
    constants, one for each member of the type:


    ```

    // The int enum pattern is severely!

    public static final int APPLE_FUJI = 0;

    public static final int APPLE_PIPIN = 1;

    public static final int APPLE_GRANNY_SMITH = 2;


    public static final int ORANGE_NAVEL = 0;

    public static final int ORANGE_TEMPLATE = 1;

    public static final int ORANGE_BLOOD = 2;

    ```


    This technique, known as the int enum pattern, has many shortcomings. It provides
    nothing in the way of type safety and little in the way of expressive power. The
    compiler won''t complain if you pass an apple to a method that expects an orange,
    compare apples to oranges with the == operator, or worse:


    ```

    // Tasty citrus applesauce!

    int i = (APPLE_FUJI - ORANGE_TEMPLATE) / APPLE_PIPIN;

    ```


    Note that the name of each apple constant is prefixed with APPLE_, and the name
    of each orange constant is prefixed with ORANGE_. This is because Java'
