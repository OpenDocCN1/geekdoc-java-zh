  md: "# CHAPTER 4 CLASSES AND INTERFACES\n\nThe beauty of skeletal implementation\
    \ classes is that they provide all of the implementation assistance of abstract\
    \ classes without imposing the severe constraints that abstract classes impose\
    \ when they serve as type definitions. For most implementors of an interface with\
    \ a skeletal implementation class, extending this is the obvious choice, but it\
    \ is strictly optional. If a class cannot be made to extend the skeletal implementation,\
    \ it can always implement the interface directly. The class still benefits from\
    \ any default methods present on the interface itself.\n\nFurthermore, the skeletal\
    \ implementation can still aid the implementor's task. The class implementation\
    \ can forward invocations of interface methods to a contained instance of a private\
    \ inner class that extends the skeletal implementation. This technique, known\
    \ as simulated multiple inheritance, is related to the wrapper class discussed\
    \ in Item II. It provides many of the benefits of multiple inheritance, avoiding\
    \ the pitfalls.\n\nWriting a skeletal implementation is a relatively simple, process.\
    \ First, study the interface and decide which methods are the primitives in terms\
    \ of which the others can be implemented. These primitives will benefit from abstract\
    \ methods in your implementation. Next, provide default methods in the interface\
    \ for all of the methods that can be implemented directly any of the primitives\
    \ except methods such as equals and hashCode. If the primitives and provide default\
    \ methods cover the interface, you're done, and have no need for a skeletal implementation\
    \ class. Otherwise, write a class declared to implement the interface, with implementations\
    \ of all of the remaining interface methods. The class may contain any nonpublic\
    \ fields, methods not appropriate to the task.\n\nAs a simple example, consider\
    \ the Map.Entry interface. The primitives are getKey, getValue, and (optionally)\
    \ setValue. The interface specifies the behavior of equals and hashCode, and there\
    \ is an obvious implementation of toString in terms of the primitives. Since you\
    \ are not allowed to provide default implementations for the Object methods, all\
    \ implementations are placed in the skeletal implementation class.\n\n```\n//\
    \ Skeletal implementation class\n```\n\n```\npublic abstract class AbstractMapEntry<K,V>\n\
    \    implements Map.Entry<K,V> {\n    // Entries in a modifiable map must override\
    \ this method\n    @Override public V setValue(V value) {\n        throw new UnsupportedOperationException();\n\
    \    }\n}\n```"
