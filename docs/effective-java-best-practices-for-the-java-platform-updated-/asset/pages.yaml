  md: "# ITEM 47: PREFER COLLECTION TO STREAM AS A RETURN TYPE\n\nThis client code\
    \ works, but it is too noisy and opaque to use in practice. A workaround is to\
    \ use an adapter method. The JDK does not provide such a method, but it's easy\
    \ to write one, using the same technique used in-line in the snippets above. That\
    \ note no case is necessary in the adapter method because Java's type inference\
    \ works perfectly in this context\n\n```\n// Adapter from Stream<E> to Iterable<E>\n\
    public static Iterable<E> iterableOf(Stream<E> stream) {\n    return stream::iterator;\n\
    }\n```\n\nWith this, you can iterate over any stream with a for-each statement:\n\
    \n```\nfor(ProcessHandle p: iterableOf(ProcessHandle.allProcesses())) {\n    //\
    \ Process the process\n}\n```\n\nNote that the stream versions of the Anagram\
    \ program in Item 34 use the Files. Files.lines method to read the dictionary,\
    \ while the iterative version uses a scanner. The Files.lines method is superior\
    \ to a scanner, which silently swallows all exceptions encountered while reading\
    \ the file. Ideally, we would have used Files.lines in the iterative version too.\
    \ This is the sort of compromise that programmers make when an API provides only\
    \ stream access to a sequence and they want to iterate over the sequence with\
    \ a for-each statement\n\nConversely, a programmer who wants to process a sequence\
    \ using a stream pipeline will be justified by using an API that provides only\
    \ Iterable. Again the JDK does not provide an adapter, but it's easy enough to\
    \ write:\n\n```\n// Adapter from Iterable<E> to Stream<E>\npublic static Stream<E>\
    \ streamOf(Iterable<E> iterable) {\n    return StreamSupport.stream(iterable.spliterator(),\
    \ false);\n}\n```\n\nIf you're writing a method that returns a sequence of objects\
    \ and you know that it will only be used in a stream pipeline, then you should\
    \ feel free to return a stream. Similarly, a method returning a sequence that\
    \ will only be used for iteration should return an Iterable. But if you're writing\
    \ a public API that returns a sequence, you should provide for users who want\
    \ to write stream pipelines as well as those who want to write for-each statements,\
    \ unless you have a good reason to believe that most of your users will want to\
    \ use the same mechanism."
