  md: '# CHAPTER 4 CLASSES AND INTERFACES


    But doesn''t violate the dictum that good API documentation should describe what
    a given method does and not how it does? Yes, it does! This is an unfortunate
    consequence of the fact that inheritance violates encapsulation. To document a
    class that it can be safely subclassed, you must describe implementation details
    that would otherwise be left unspecified.


    The removeRange tag was added in Java 8 and used heavily in Java 9. The Javadoc
    utility still ignores it unless you pass the command line switch -tag "note:a:API
    Note":


    Designing for inheritance involves more than just documenting patterns of subclasses.
    To write efficient subclasses without undue pain, a class may provide hooks into
    its internal workings for the judicious choosing protected methods. For example,
    consider the removeRange method of Java.AbstractList:


    ```

    protected void removeRange(int fromIndex, int toIndex)

    ```


    Removes from this list all the elements whose index is between fromIndex, toIndex,
    exclusive. Shifts any succeeding elements to the left (reduces their index). This
    call shortens the list by (toIndex - fromIndex) elements. If toIndex == fromIndex,
    this operation has no effect.


    This method is called by the clear operation on this list and its sublists. Overriding
    this method to take advantage of the internals of the last implementation can
    substantially improve the performance of the clear operation on this list and
    sublists.


    **Implementation Requirements:** This implementation gets a iterator positioned
    before fromIndex and repeatedly calls Iterator.next followed by ListIterator.remove,
    until the entire range is removed. **If ListIterator.remove requires linear time,
    this implementation requires quadratic time.**


    **Parameters:**


    | index | of first element to be removed. |

    | toIndex | after last element to be removed. |


    This method is of no interest to users of a List implementation. It is provided
    solely to make it easy for subclasses to provide a fast clear method on sublists.
    In the absence of the removeRange method, subclasses would have to make do with
    quadratic performance when the clear method was invoked on sublists or rewrite
    the entire sublist mechanism from scratch—not an easy task!'
