    are strictly enforced is when the unexported packages in the Java libraries are
    truly inaccessible outside of their modules.


    Not only is the access protection afforded by modules of limited utility to the
    typical Java programmer, largely advisory in nature; in order to take advantage
    of it, you must group packages into modules, make all of their dependencies explicit
    in declarations, rearrange your source tree, and take special actions to accommodate
    any access to non-modularized packages from your modules [Reinhold, 3]. It is
    too early to say whether modules will achieve widespread use outside of the JDK
    itself. In the meantime, it seems best to avoid them without a compelling need.


