  md: '# Item 86: Implement Serializable with great caution


    Allowing a class''s instances to be serialized can be as simple as adding the
    words implements Serializable to its declaration. Because this is so easy to do,
    there was a common misconception that serialization requires little effort on
    the part of the programmer. The truth is far more complex. While the immediate
    cost to make a class serializable can be negligible, the term costs are often
    substantial.


    A major cost of implementing Serializable is that it decreases the flexibility
    to change a class''s implementation once it has been released. When one implements
    Serializable, its byte-stream encoding (or serialized form) becomes part of its
    exported API. Once you distribute a class, you are generally required to support
    all other serialized form forever. If you do not make the effort to design a custom
    serialized form but merely accept the default, the serialized form will be tied
    to the class''s original internal representation. In other words, if you accept
    the default serialized form, the class''s private and package-private instance
    fields practice of minimizing access to fields (Item 15) loses effectiveness as
    a tool for information hiding.


    If you accept the default serialized form and change a class''s internal representation,
    an incompatible change in the serialized form will result. Clients attempting
    to serialize an instance using an old version of the class and deserializing with
    the new one (or vice versa) will experience program failures. It is possible to
    maintain the original internal representation, while maintaining the original
    serialized form using `readObject`, `writeObject`, `readResolve`, `etc., but it
    can be difficult and leave visible warts in the source code. If you want to make
    a class serializable, you should design a high-quality serialized form that you''re
    willing to live with for the long haul (Items 87-90). Doing so will add to the
    initial cost of development, but it''s worth it. A well-designed serialized form
    places constraints on the evolution of a class; an ill-designed class can be crippling.


    A simple example of the constraints imposed by evolution concerns serial version
    UIDs. Every serializable class has a unique number associated with it. If you
    do not specify this number by declaring a static long field `serialVersionUID`,
    the system automatically generates it at runtime by applying a cryptographic hash
    function (SHA-1) to the structure of the class. This value is affected by the
    names of the fields, the interfaces it implements, and most of its members, including
    synthetic members generated by the compiler. If you change'
