    ```


    The more parameters a method has, however, the more parameter names you choose
    provide useful documentation, making the lambda more readable and maintainable
    than a method reference if the lambda is longer.


    There''s nothing you cannot do with a method reference that you can''t do with
    a lambda (with one obvious exception—see JLS, 9.9-2 if you''re curious). That
    said, method references usually result in shorter, clearer code. They also give
    out if a lambda gets too long or complex: you extract the code from the lambda
    into a new method and replace the lambda with a reference to that method. You
    can give the method a good name and document it to your heart''s content.


