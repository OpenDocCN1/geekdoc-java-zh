    \nIf you're really unlucky and the outer collection is a multiple of the size\
    \ of the inner collection—perhaps they're the same collection—the loop will terminate\
    \ normally, but it won't do what you want. For example, consider this attempt\
    \ to print all the rolls of a pair of dice:\n\n```\n// Same bug, different symptom!\n\
