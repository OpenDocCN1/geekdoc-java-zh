  md: '# ITEM 1 : CONSIDER STATIC FACTORY METHODS INSTEAD OF CONSTRUCTORS


    Prior to Java 8, interfaces couldn''t have static methods. By convention, static
    factory methods for an interface named Type were put in a noninstantiable companion
    class (Item 4) named Types. For example, the Java Collections Framework has forty-five
    utility implementations of its interfaces, providing unmodifiable, synchronized
    collections, and the like. Nearly all of these implementations are exported via
    static factory methods in one noninstantiable class Java, at least Collections.
    The returned objects are all non-public.


    The Collections Framework API is much smaller than it would have been if it exported
    forty-five separate public classes, for each convenience implementation. It is
    not just the bulk of the API that is reduced but the conceptual weight: the number
    and difficulty of the concepts that programmers must master in order to use the
    API. The programmers know that the returned object precisely the API specified
    by this interface, so no need to read additional class documentation for the implementation
    class. Furthermore, using such a static factory method requires the client to
    refer to the returned object by interface rather than implementation class, which
    is generally good practice (Item 64).


    As of Java 8, the restriction that interfaces cannot contain static methods is
    eliminated, so there little reason to provide a noninstantiable companion class
    for an interface. Many public static members that would have been at home in such
    a class should be put in the interface itself. However, however, it may still
    be necessary to put the bulk of the implementation code beyond these static methods
    in a separate package-private class. This is because Java 8 allows private static
    methods of an interface to be public, but static fields and methods are still
    required to be public.


    A advantage of static factories is that the class of the returned object can vary
    from call as a function of the input parameters. Any sub-object of the returned
    type is permissible. The class of the returned object can also vary from release
    to release.


    The EnumSet class (Item 36) has no constructors; return an instance of one of
    two subclasses, depending on the size of the enum type: if it has sixty-four or
    more elements, as most enum types do, the static factories return a RegularEnumSet
    instance, which is backed by a single long; if the enum type has sixty-five or
    more elements, the factories return a JumboEnumSet instance, backed by a long
    array.


    The existence of these two implementation classes is invisible to clients. If
    RegularEnumSet ceased to offer performance advantages for small enum types, it
    could be eliminated from a future release with no effects. Similarly, a future
    release could add a third or fourth implementation of EnumSet if it proved beneficial'
