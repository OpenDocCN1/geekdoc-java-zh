  md: '# Item 70: Use checked exceptions for recoverable conditions and runtime exceptions
    for programming errors


    Java provides three kinds of throwables: checked exceptions, runtime exceptions,
    and errors. There is some confusion among programmers to when it is appropriate
    to use each kind of throwable. While the decision is not always clear-cut, there
    are some general rules that provide strong guidance.


    The cardinal rule in deciding whether to use a checked or an unchecked exception
    is this: use checked exceptions for conditions from which the caller can reasonably
    expected to recover. By throwing a checked exception, you force the caller to
    handle the exception in a catch clause or propagate it outward. Each checked exception
    that a method is declared to throw is therefore a potent indication to the API
    user that the associated condition is a possible outcome of invoking the method.


    By confronting the user with a checked exception, the API designer presents a
    mandate to recover from the condition. The user can disregard the mandate by catching
    the exception and ignoring it, but this is usually a bad idea (item 77).


    There are two kinds of unchecked throwables: runtime exceptions and errors. They
    are identical in their behavior: both are throwables that needn''t, and shouldn''t
    be caught; by default, it is generally the case that recovery from an unchecked
    exception or an error would do more harm than good. If a program does not catch
    such a throwable, it will cause the current thread to halt with an appropriate
    error message.


    Use runtime exceptions to indicate preventable programming errors. The vast majority
    of runtime exceptions indicate precondition violations. A precondition violation
    is simply a failure by the client of the API to adhere to the contract established
    by the API specification. The contract for array access specifies that the array
    index must be between zero and the array length minus one; that this precondition
    was violated.


    ArrayIndexOutOfBoundsException indicates that this precondition was violated.


    One problem with this is that it is not always clear whether you are dealing with
    a recoverable condition or a programming error. For example, consider the case
    of resource exhaustion, which can be caused by a programming error such as allocating
    an unnecessarily large array, or by a genuine shortage of resources. If resource
    exhaustion is caused by a temporary shortage or temporarily heightened demand,
    the condition may be recoverable. It is a matter of judgment on the part of the
    API designer whether given instance of resource exhaustion is likely to allow
    for recovery. If you believe a condition is likely to allow for recovery, use
    a checked exception; if not, use a runtime'
