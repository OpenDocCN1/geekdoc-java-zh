  md: "# CHAPTER 12 SERIALIZATION\n\ncontrol, all instance fields with object reference\
    \ types must be declared transient. Otherwise, it is possible for a determined\
    \ attacker to secure a reference to the deserialized object before its readResolve\
    \ method is run, using a technique that is much similar to the MutablePeriod attack\
    \ in Item 88.\n\nThe attack is a bit complicated, but the underlying idea is simple.\
    \ If a singleton contains a nontransient object reference field, the contents\
    \ of this field will be deserialized before the singleton's readResolve method\
    \ is run. This allows a carefully crafted stream to \"steal\" from the originally\
    \ deserialized singleton at the time of the contents of the object reference field\
    \ are deserialized.\n\nHere's how it works in detail. First, write a \"stealer\"\
    \ class that has both a stealer \"hides.\" In the serialization stream, replace\
    \ the singleton's nontransient field with an instance of the stealer. You now\
    \ have a circularity: the singleton contains the stealer, and the stealer refers\
    \ to the singleton.\n\nBecause the singleton contains the stealer, the stealer's\
