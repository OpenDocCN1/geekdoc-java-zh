    \n## 额外的 JavaFX 控件\n\nJavaFX 提供了比此处涵盖的基础内容更丰富的控件。以下是一些额外的值得关注的控件：\n\n- **滑块 (Sliders)**：允许用户通过可拖动的滑块从连续范围内选择值。\n\
