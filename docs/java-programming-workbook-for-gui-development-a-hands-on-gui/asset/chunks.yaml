  trans: "\n\n- **焦点管理 (Focus Management)**：确保使用 `Tab` 键进行正确的键盘导航，按逻辑顺序在 UI 组件之间移动焦点。依赖屏幕阅读器或键盘导航的用户能够在不依赖鼠标的情况下访问所有功能。\n\
    - **替代文本 (Alternative Text)**：使用 `JLabel` 组件的 `setLabelFor` 方法或组件的 `setAccessibleDescription`\
    \ 方法为图像和文本内容提供替代文本描述。这允许屏幕阅读器向用户传达非文本元素的含义。\n- **色彩对比 (Color Contrast)**：保持文本与其背景之间足够的色彩对比度，以确保视觉障碍用户的可读性。可以使用在线色彩对比度检查工具来验证您的颜色选择。\n\
    - **键盘快捷键 (Keyboard Shortcuts)**：考虑为频繁的操作提供键盘快捷键，以提高主要依赖键盘导航的用户效率。\n- **逻辑布局 (Logical\
    \ Layout)**：以逻辑且一致的方式构建应用程序布局，使用户更容易导航并理解组件之间的关系。\n- **清晰的指令 (Clear Instructions)**：为应用程序的使用提供清晰简洁的指令，特别是在对话框或错误消息中。\n\
    \n### 额外考虑\n\n- **屏幕阅读器兼容性 (Screen Reader Compatibility)**：使用 `JAWS` 或 `NVDA`\
    \ 等流行的屏幕阅读器测试您的应用程序，以识别并解决任何性问题。\n- **辅助技术 (Assistive Technologies)**：考虑与视觉障碍用户可能依赖的屏幕放大器等辅助技术的兼容性。\n\
    - **用户测试 (User Testing)**：让残障用户参与测试过程，以收集反馈并识别应用程序可访问性方面需要改进之处。\n\n### 无障碍应用程序的优势\n\
    \n- **更广泛的用户群 (Wider User Base)**：通过包含残障用户接触更广泛的受众。\n- **提高可用性 (Improved Usability)**：无障碍设计原则通常为所有人带来更友好的体验。\n\
    - **合规性 (Compliance)**：在某些背景下（如政府或教育机构），无障碍标准可能是强制性的。\n\n通过将这些无障碍考虑纳入您的 Swing\
    \ 应用程序的设计和开发过程中，您可以创建服务于广泛用户的包容性应用程序，并履行社会责任。\n\n***\n\n# 第 3 部分：探索 JavaFX\n\n\
    ## 第 8 章：GUI 开发 JavaFX 简介\n\n### JavaFX 的优势与特性\n\nJavaFX 是一个现代且强大的框架，用于构建具有视觉冲击力且交互式用户界面的丰富互联网应用程序\
    \ (RIAs) 和桌面应用程序。它利用 Java 作为核心编程语言，对于 Java 开发者来说是一个熟悉且易于上手的选择。\n\n### JavaFX 相比\
    \ Swing 的优势\n\n虽然 Swing 长期以来一直是 Java GUI 开发的标准，但 JavaFX 提供了许多优势，使其成为现代应用程序极具吸引力的选择：\n\
    \n- **丰富的图形和动画 (Rich Graphics and Animations)**：JavaFX 利用硬件加速和强大的图形渲染流水线，能够创建视觉丰富、平滑动画和动态用户界面，这些在\
    \ Swing 中是难以实现的。\n- **声明式 UI 开发 (Declarative UI Development)**：JavaFX 采用使用 `FXML`\
    \ (FXML 语言) 的声明式 UI 开发方法。`FXML` 允许您在单独的 XML 文件中定义 UI 布局和组件结构，提高了关注点分离并促进更整洁的代码。\n\
    - **CSS 样式 (CSS Styling)**：使用层叠表 (CSS) 为您的 JavaFX 应用程序建模，提供了一种熟悉且强大的方式来控制 UI 组件的外观，而不会让样式逻辑弄乱\
    \ Java 代码。\n- **跨平台兼容性 (Cross-Platform Compatibility)**：JavaFX 应用程序可以部署在各种平台上，包括\
    \ Windows、macOS、Linux 和移动平台（带有 JavaFX Mobile），与 Swing 主要关注桌面相比，提供了更广泛的覆盖和灵活性。\n\
    - **现代 UI 控件 (Modern UI Controls)**：JavaFX 提供了一系列现代 UI 控件，如图表、媒体播放器和 Web 查看，这些在\
    \ Swing 中无法轻易获得，简化了复杂用户交互的开发。\n- **与 Java 技术集成 (Integration with Java Technologies)**：JavaFX\
    \ 与其他 Java 技术（如 `JavaFX` 和 Java 8 特性，例如 `Lambdas`）无缝集成，实现高效流的开发。\n\n### JavaFX\
    \ 的核心特性\n\n- **场景图 (Scene Graph)**：场景图是 JavaFX 中的一个基本概念，它以层次结构组织 UI 元素。这种结构有助于\
    \ UI 组件的高效渲染和操作。\n- **形状与特效 (Shapes and Effects)**：JavaFX 提供了丰富的内置形状（线条、矩形、圆形等）和视觉效果（如投影阴影和模糊），允许创建具有视觉吸引力且动态的\
    \ UI。\n- **媒体支持 (Media Support)**：JavaFX 与媒体播放无缝集成，允许在应用程序中包含音频、视频和图像。\n- **网络与通信\
    \ (Networking and Communication)**：JavaFX 应用程序可以利用网络功能与服务器或其他应用程序进行通信和数据交换。\n\
    - **3D 图形 (3D Graphics)**：虽然不是主要关注，但 JavaFX 提供了基本的 3D 图形能力，用于在应用程序 UI 中创建简单的 3D\
    \ 元素。\n- **属性绑定 (Property Binding)**：JavaFX 支持数据绑定，允许将 UI 组件属性链接到底层数据模型。这简化了数据变化时的\
    \ UI 更新，并促进了具响应性的 UI 体验。\n\n### 何时选择 JavaFX 而非 Swing\n\n以下是 JavaFX 可能比 Swing 更好的选择场景：\n\
    \n- **现代、丰富的 UI**：如果您的应用程序需要具有视觉冲击力、高度交互性且带有动画和效果的用户界面，JavaFX 非常适合。\n- **跨平台兼容性**：如果您的应用程序需要在各种平台（桌面、移动）上运行，与\
    \ Swing 主要关注桌面端相比，JavaFX 了一个了一个更高效的解决方案。\n- **声明式 UI 开发**：如果您倾向于使用使用 `FXML` 的声明式方法进行\
    \ UI 开发，JavaFX 提供了明显的优势。\n- **与现代 Java 特性的集成**：如果您计划大量利用 Java 8 特性（`Lambdas`、`Streams`）或其他现代\
    \ Java 技术，JavaFX 提供了更平滑的集成。\n\n然而，对于简单的应用程序或如果您有需要维护的大现有代码库，Swing 可能仍然是一个很好的选择。\n\
    \n通过理解 JavaFX 的优势和特性，您可以为您的 GUI 开发选择最佳技术。下一章将深入探讨如何开始 JavaFX 应用程序的开发。\n\n### 设置\
    \ JavaFX 开发环境\n\n在探索了 JavaFX 的优势之后，现在让我们设置开发环境来创建第一个 JavaFX 应用程序。您需要：\n\n####\
    \ 前提条件\n\n- **Java 开发工具包 (JDK)**：确保系统上安装了最新版本的 Java 开发工具包 (JDK)。可以从 Java 官方网站下载并安装。\n\
    - **集成开发环境 (IDE)**：虽然可以使用简单的文本编辑器开发 JavaFX 应用程序，但强烈建议使用提供 JavaFX 支持的 IDE。流行的选项包括：\n\
    \    - **IntelliJ IDEA**：一个强大且功能丰富的 IDE，具有出色的 JavaFX 支持和内置工具。它提供的免费社区版具有足够的 JavaFX\
    \ 开发功能。\n\n"
- fmt: "\n- **Eclipse**: Another popular IDE with plugins like the `JavaFX Scene Builder`\
    \ for visual UI design and the `e(fx)clipse` plugin for enhanced JavaFX development\
    \ experience.\n- **NetBeans**: A free and open-source IDE with built-in JavaFX\
    \ support, offering a good balance of features and ease of use.\n\nHere's a general\
    \ guide on setting up your IDE for JavaFX development (using `IntelliJ IDEA` as\
    \ an example):\n\n1. **Download and Install IntelliJ IDEA**: Download the Community\
    \ Edition from the official JetBrains website: [https://www.jetbrains.com/idea/]\n\
    2. **Create a New JavaFX Project**: Launch `IntelliJ IDEA` and select \"Create\
    \ New Project.\" Choose \"JavaFX\" from the left-hand pane and provide a project\
    \ name and location. Click \"Next.\"\n3. **Configure JDK**: Ensure the correct\
    \ `JDK` version is selected (should match your installed `JDK`). Click \"Finish.\"\
    \n\nAdditional Considerations:\n\n- **JavaFX SDK (Optional)**: In older JavaFX\
    \ versions, a separate `JavaFX SDK` might have been required. However, with modern\
    \ Java versions (`JDK 11` and above), JavaFX is bundled within the `JDK`, so you\
    \ typically don't need a separate installation.\n- **JavaFX Version Compatibility**:\
    \ Ensure your chosen IDE version is compatible with the JavaFX version included\
    \ in your installed `JDK`.\n\nOnce you've set up your development environment,\
    \ you're ready to start coding your first JavaFX application! The next chapter\
    \ will guide you through building a simple Hello World application using JavaFX.\n\
    \n# Chapter 9: Building GUIs with JavaFX\n\n## JavaFX Scene Graph and FXML\n\n\
    JavaFX applications rely on two fundamental concepts for building user interfaces:\
    \ the scene graph and FXML. This chapter dives into these essential building blocks:\n\
    \n### The Scene Graph\n\nThe scene graph is a hierarchical data structure that\
    \ represents all the visual elements (nodes) within a JavaFX application. It defines\
    \ the organization and relationships between these elements, forming the foundation\
    \ for rendering the UI on the screen.\n\n- **Nodes**: Every visual element in\
    \ your application, from simple shapes like rectangles to complex layouts and\
    \ even text, is represented by a `node` in the scene graph.\n- **Parent-Child\
    \ Relationships**: `Nodes` can have parent-child relationships. A parent node\
    \ can contain one or more child nodes, forming a hierarchy. The `root node` sits\
    \ at the top of the scene graph and encompasses all other nodes within the application's\
    \ UI.\n- **Properties**: Each `node` has various properties that define its appearance,\
    \ behavior, and interaction within the UI. These properties can be things like\
    \ size, position, color, visibility, and more.\n- **Transformations**: `Nodes`\
    \ can be transformed using various operations like scaling, rotating, or translating.\
    \ This allows for creating dynamic and animated UIs.\n\n#### Benefits of the Scene\
    \ Graph:\n\n- **Efficient Rendering**: The scene graph enables efficient rendering\
    \ by focusing only on the parts of the UI that have changed since the last update.\n\
    - **Organized Structure**: The hierarchical structure of the scene graph promotes\
    \ well-organized and maintainable UI code.\n- **Scalability**: The scene graph\
    \ can handle complex UIs with numerous elements efficiently.\n\n### FXML (FXML\
    \ Language)\n\nFXML (FXML Language) is a declarative language based on XML that\
    \ allows you to define the structure and layout of your JavaFX UI in a separate\
    \ `.fxml` file. This approach offers several advantages:\n\n- **Separation of\
    \ Concerns**: Separating UI definition (FXML) from application logic (Java code)\
    \ improves code readability, maintainability, and promotes a cleaner codebase.\n\
    - **Declarative Syntax**: FXML uses a declarative approach where you describe\
    \ what the UI should look like rather than writing imperative code to create and\
    \ arrange UI elements.\n- **Visual Design Tools**: Several visual design tools\
    \ like `Scene Builder` integrate with FXML, allowing you to visually create your\
    \ UI layout and generate the corresponding FXML code.\n\n#### Structure of an\
    \ FXML File:\n\nAn FXML file typically contains the following elements:\n\n- **Root\
    \ Element**: The root element defines the top-level container for your UI layout.\
    \ It usually corresponds to a JavaFX layout pane like `VBox`, `HBox`, or `GridPane`.\n\
    - **UI Component Tags**: Child elements within the root element represent various\
    \ JavaFX UI components like buttons, labels, text fields, etc. Each tag defines\
    \ the properties of the corresponding UI component.\n- **Event Handlers**: FXML\
    \ allows you to define event handlers directly within the FXML code using attributes\
    \ like `onMouseClicked` or `onKeyPressed`. These attributes reference `methods`\
    \ in your Java code that handle user interactions with the UI elements.\n\n####\
    \ Example FXML Code:\n\n```xml\n<VBox xmlns:fx=\"http://javafx.com/fxml/1\" xmlns=\"\
    http://www.w3.org/1999/xhtml\" fx:controller=\"com.example.mycontroller\">\n \
    \   <Label fx:id=\"welcomeLabel\" text=\"Welcome to JavaFX!\" />\n    <Button\
    \ fx:id=\"clickMeButton\" text=\"Click Me\" onAction=\"handleClick\" />\n</VBox>\n\
    ```\n\n### Creating JavaFX Application with FXML\n\nHere's a basic workflow for\
    \ creating a JavaFX application using FXML:\n\n1. **Design Your UI Layout**: You\
    \ can either use visual design tool like `Scene Builder` or write the FXML code\
    \ manually.\n2. **Develop the Java Class**: Create a Java class that serves as\
    \ the controller for your FXML.\n3. **Load the FXML File**: Within your controller\
    \ class, use `FXLoader` to load the FXML file and associate it with the JavaFX\
    \ scene.\n4. **Access UI Components**: Use `fx:id` attributes defined in your\
    \ FXML to reference UI components within your controller code. You can then manipulate\
    \ these components' properties and handle user interactions.\n\n### Working with\
    \ JavaFX Controls (Buttons, Text Fields, etc.)\n\nJavaFX provides a rich set of\
    \ pre-built UI controls that simplify building interactive and user-friendly applications.\
    \ This section explores some commonly used controls:\n\n- **Buttons**: Create\
    \ buttons using the `Button` class. Buttons can have text labels, icons, and be\
    \ customized with various styles. You can define event handlers like `setOnAction`\
    \ within the FXML or your controller class to handle button clicks.\n- **Text\
    \ Fields**: Utilize the `TextField` class to allow users to enter text. You can\
    \ set properties like `promptText` to provide a hint and control the type of text\
    \ allowed (e.g., numbers only).\n- **Labels**: Display text using the `Label`\
    \ class. Labels are read-only and primarily used for displaying information to\
