    ## 针对不同操作系统的考虑


    上一节涵盖了 JavaFX 应用程序的各种打包和部署策略。本节将深入探讨针对不同操作系统的特定考虑：


    ### 部署到 Windows


    - **用户体验**：Windows 用户可能习惯传统的安装程序格式（EXE）。考虑使用原生打包工具（`jlink` & `jpackage`）或第三方工具如
    `Launch4J` 或 `Inno Setup` 来创建熟悉的安装体验。

    - **Java 运行时环境 (JRE)**：如果不使用原生打包，请确保用户系统中安装了兼容的 JRE 版本。你可以提供下载链接或获取必要 JRE 的说明。

    - **用户账户控制 (UAC)**：Windows 上的 UAC 在启动你的应用程序时可能会提示用户确认。如有必要，你可能需要调整清单文件以请求适当的权限。


    ### 部署到 macOS


    - **应用程序包**：在 macOS 上，将你的应用程序封装为包（带有特定配置的文件夹结构）。这确保了与 macOS 用户界面和文件系统的正确集成。`jpackage`
    等工具可以协助创建这些包。

    - **Gatekeeper（守门员）**：macOS Gatekeeper 可能会警告用户运行身份不明开发者的应用程序。你可以从 Apple 获取开发者
