    fx:controller="com.example.logincontroller">


    <Label text="Username:" />


    <TextField fx:id="usernameField" />


    <Label text="Password:" />


    <PasswordField fx:id="passwordField" />


    <Button text="Login" onAction="handleLogin" />


    </VBox>


    LoginController.java (Controller Class):


    Java


    public class LoginController {


    @FXML


    private TextField usernameField;


    @FXML


    private PasswordField passwordField;


    public void handleLogin() {


    String username = usernameField.getText();


    String password = passwordField.getText();


    // Implement login logic here, e.g., validate credentials and handle successful/failed
    login


    }


    }


    This example demonstrates how FXML defines the UI layout with labels, text fields,
    and a button. The controller class references these UI elements using the fx:id
    attributes and provides an handleLogin method to handle button clicks and implement
    your login logic.


    Additional JavaFX Controls


    JavaFX offers a wider range of controls beyond the basics covered here. Here are
    some additional noteworthy controls:


    ​● ​Sliders: Allow users to select a value from a continuous range using a draggable
    slider.


    ​● ​Choice Boxes and Combo Boxes: Present users with a list of options to choose
    from.


    ​● ​Progress Bars: Visually indicate the progress of an operation.


    ​● ​Menus and Context Menus: Create hierarchical menus for user interaction.


    ​● ​Web Views: Embed web content within your JavaFX application.


    ​● ​List Views and Table Views: Display lists or tabular data for user interaction.


    Exploring the JavaFX documentation will provide you with a comprehensive overview
    of all available controls and their functionalities.


    By effectively utilizing these controls and leveraging FXML for your UI layout,
    you can build visually appealing and user-friendly JavaFX applications.


    ### Animations and Effects in JavaFX Applications


    JavaFX excels at creating dynamic and visually engaging user interfaces through
    animations and effects. This section dives into how to incorporate these elements
    into your applications.


    JavaFX Animation Classes:


    ​● ​Timeline: The fundamental class for creating animations. It defines a timeline
    over which an animation occurs and allows you to specify keyframes that represent
    the animation''s state at different points in time.


    ​● ​KeyFrame: Represents a specific state of the animation at a particular point
    in the timeline. You can define properties of UI elements within keyframes to
    create the animation effect.


    ​● ​Transitions: JavaFX provides pre-built transitions for common animation effects
    like fading, scaling, rotating, and translating UI components. These transitions
    simplify animation creation.


    Types of JavaFX Animations:


    ​● ​Timeline-Based Animations: You can create custom animations using the Timeline
    class, offering full control over the animation''s behavior.


    ​● ​CSS Transitions: Define animations directly within your FXML code using CSS
    transition properties. This approach is simpler for basic animations.


    Example: Fading In a Label


    Here''s an example of fading in a label using a CSS transition within FXML:


    XML


    <Label fx:id="welcomeLabel" text="Welcome!" opacity="0.0">


    <transition:Fade transitionDuration="Fast" />


    </transition:Fade>


    The opacity property is set to 0.0 initially, making the label invisible. The
    transition:Fade element defines a fade-in transition with the Fast duration preset.


    Additional Animation and Effect Techniques:


    ​● ​Path Transitions: Animate UI elements along a defined path for more complex
    movements.


    ​● ​Interpolator: Control the pacing and easing of animation transitions using
    interpolators.


    ​● ​Effects: Apply visual effects like drop shadows, blurs, and color adjustments
    to enhance your UI''s aesthetics.


    Benefits of Animations and Effects:


    ​● ​Improved User Experience: Animations and effects can make your UI more engaging
    and interactive, improving user experience.


    ​● ​Visual Feedback: Animations can provide visual cues to users about actions
    or state changes within the application.


    ​● ​Attention Grabbing: Well-designed animations can effectively draw user attention
    to specific UI elements.


    Remember: Use animations and effects judiciously to avoid overwhelming users or
    hindering performance.


    By understanding these animation concepts and techniques, you can add a touch
    of dynamism and visual interest to your JavaFX applications.


    ## Chapter 10: Event Handling in JavaFX


    Event Handling Mechanisms in JavaFX


    Event handling is a fundamental aspect of creating interactive applications. JavaFX
    provides a robust event handling mechanism that allows your application to respond
    to user interactions and other events within the system. This chapter explores
    the key concepts and techniques for effective event handling in JavaFX.


    Event Model Overview


    JavaFX applications follow an event-driven programming model. This means that
    the application doesn''t continuously check for user input or changes; instead,
    it reacts to events that are triggered by user interactions (e.g., clicking a
    button), system events (e.g., window resizing), or application logic.


    Components of the Event Model:


    ​● ​Events: Represent occurrences of interest within the application. Events encapsulate
    information about what happened, where it happened (source), and when it happened.


    ​● ​Event Sources: The objects that generate events. UI components like buttons,
    text fields, and windows are common event sources.


    ​● ​Event Handlers: Methods within your code that are responsible for handling
    specific events. Event handlers are typically defined within your controller classes.


    ​● ​Event Listeners: Objects that register interest in receiving notifications
    about specific events. Event listeners are attached to event sources and invoke
    the corresponding event handler when the event occurs.


    ​● ​Event Propagation: Events typically propagate through the scene graph hierarchy.
    If an event is not handled by a specific UI component, it may bubble up to its
    parent nodes until reaching the root node or being handled by an intermediate
    listener.


    Attaching Event Listeners in JavaFX


    There are two primary ways to attach event listeners to UI components in JavaFX:


    ​● ​FXML Event Handlers: Within your FXML code, you can directly define event
    handlers for specific UI components using attributes like onMouseClicked or onKeyPressed.
    These attributes reference methods in your controller class that will handle the
    corresponding event.


    XML


    <Button text="Click Me" onAction="handleClick" />


    ​● ​Java Code Event Listeners: Programmatically, you can use methods like setOnAction
    or setOnKeyPressed on UI component objects within your controller class to attach
    event listeners.


    Java


    button.setOnAction(this::handleClick);


    Both approaches achieve the same outcome - registering your event handler method
    to be invoked when the specified event occurs on the UI component.


    Common JavaFX Events


    JavaFX provides a wide range of events that you can handle within your application.
    Here are some commonly used events:


    ​● ​Mouse Events: Events related to mouse interactions like clicking, pressing,
    releasing, hovering, and dragging (e.g., onMouseClicked, onMousePressed).


    ​● ​Keyboard Events: Events triggered by keyboard input like key presses, releases,
    and typed characters (e.g., onKeyPressed, onKeyReleased, onKeyTyped).


    ​● ​Action Events: Fired when a user performs an action on a UI component like
    clicking a button or selecting an item (e.g., setOnAction).


    ​● ​Window Events: Events related to window management like opening, closing,
    resizing, and minimizing (e.g., onShowing, onCloseRequest).


    ​● ​Focus Events: Events related to gaining or losing focus by a UI component
    (e.g., onFocused, onLostFocus).


    ​● ​Drag and Drop Events: Events related to dragging and dropping UI elements
    (e.g., onDragDetected, onDragDropped).'
