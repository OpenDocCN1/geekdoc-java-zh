  trans: "\n\n在你的项目中，创建一个名为 `MyFirstSwingApp` 的 Java 类。该类将作为你应用程序的入口。\n\n### 3. 继承\
    \ `JFrame` 类\n让你的 `MyFirstSwingApp` 类继承 `javax.swing.JFrame` 类。`JFrame` 类代表应用程序的主窗口。\n\
    \n### 4. 定义窗口标题\n在 `MyFirstSwingApp` 构造函数内部，使用 `setTitle` 方法设置应用程序窗口的标题：\n\n```java\n\
    public class MyFirstSwingApp extends JFrame {\n    public MyFirstSwingApp() {\n\
    \        super(\"My First Swing Application\");\n    }\n    // ... other code\
    \ for your application\n}\n```\n\n### 5. 设置窗口大小（可选）\n你可以使用 `setSize` 方法可选地设置应用程序窗口的大小：\n\
    \n```java\npublic class MyFirstSwingApp extends JFrame {\n    public MyFirstSwingApp()\
    \ {\n        super(\"My First Swing Application\");\n        setSize(400, 300);\
    \ // 像素单位宽度和高度\n    }\n    // ... other code for your application\n}\n```\n\n\
    ### 6. 让窗口在退出时关闭\n默认情况下，关闭窗口不会终止应用程序。为了确保正常终止，使用带有 `JFrame.EXIT_ON_CLOSE` 的 `setDefaultCloseOperation`\
    \ 方法：\n\n```java\npublic class MyFirstSwingApp extends JFrame {\n    public MyFirstSwingApp()\
    \ {\n        super(\"My First Swing Application\");\n        setSize(400, 300);\n\
    \        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    }\n    // ... other\
    \ code for your application\n}\n```\n\n### 7. （可选）添加一个简单的标签\n为了向窗口添加一个基础元素，创建一个带有文本的\
    \ `JLabel` 对象，并使用 `add` 方法将其添加到框架的内容窗格中：\n\n```java\npublic class MyFirstSwingApp\
    \ extends JFrame {\n    public MyFirstSwingApp() {\n        super(\"My First Swing\
    \ Application\");\n        setSize(400, 300);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        JLabel label = new JLabel(\"Hello, World!\");\n        add(label);\n\
    \    }\n    // ... other code for your application\n}\n```\n\n### 8. 让窗口可见\n最后，通过在你的\
    \ `JFrame` 对象上调用 `setVisible` 方法使应用程序窗口可见：\n\n```java\npublic class MyFirstSwingApp\
    \ extends JFrame {\n    public MyFirstSwingApp() {\n        super(\"My First Swing\
    \ Application\");\n        setSize(400, 300);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        JLabel label = new JLabel(\"Hello, World!\");\n        add(label);\n\
    \        setVisible(true);\n    }\n    public static void main(String[] args)\
    \ {\n        new MyFirstSwingApp();\n    }\n}\n```\n\n### 9. 运行应用程序\n编译并运行 `MyFirstSwingApp`\
    \ 类。你应该能看到一个标题为“My First Swing Application”且内部显示“Hello, World!”文本的窗口。\n\n恭喜你！你成功使用\
    \ Swing 创建了自己的第一个 Java GUI 应用程序。这只是一个基础示例，但它演示了创建窗口、添加组件和设置应用程序逻辑的核心概念。在后续章节中，我们将深入探讨各种\
    \ Swing 组件、事件处理、布局管理器以及构建丰富交互式 Java GUI 应用程序的更高级的技术。\n\n## 第 3 章：Java GUI 开发的核心概念\n\
    \n### 组件与容器\n本章将深入探讨 Java GUI 应用程序的基础构建模块：组件和容器。理解它们的作用至关重要。\n\n#### 组件\n组件是构成用户界面的单个元素。它们代表按钮、文本字段、标签等。以下是一些关键类型：\n\
    - `Buttons`（按钮）：允许用户触发操作。\n- `TextFields`（文本框）：允许用户输入文本。\n- `Labels`（标签）：显示静态信息。\n\
    - `TextAreas`（文本区域）：提供多行文本编辑。\n- `Panels`（面板）：作为分组其他组件的容器。\n- `Menus`（菜单）：提供下拉选项。\n\
    - `Tables`（表格）：以网格格式显示数据。\n\n#### 容器\n容器用于组织布局。它们将布局责任委托给布局管理器，确保组件定位正确。以下是关于容器你需要了解的：\n\
    - `JFrame`：代表应用程序的主窗口。\n- `JPanel`：用于分组组件的通用容器。\n- `JDialog`：创建模态或非模态对话框。\n- `JTabbedPane`：将内容组织成多个标签页。\n\
    \n**关键操作：**\n- **向容器添加组件**：要向容器添加组件，你使用容器对象的 `add` 方法。\n- **嵌套容器**：容器可以嵌套在其他容器中，以创建复杂的层次结构布局。\n\
    \n### 布局管理器 (FlowLayout, BorderLayout, 等)\n布局管理器是 Java GUI 开发中的基础概念。它们决定了组件在容器内的定位和大小方式。\n\
    \n#### FlowLayout\n- **描述**：`FlowLayout` 布局在容器内从左到右一个接一个排列组件。如果当前行空间不足以容纳组件，它将换行到下一行。\n\
    - **优点**：对于组件较少的简单布局易于使用；允许自动换行。\n\n"
