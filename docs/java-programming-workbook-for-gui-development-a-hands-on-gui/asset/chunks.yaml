    ### 类 (Java): 在 Java 中创建对象的蓝图。它定义了该类对象将拥有的属性（数据）和方法（函数）。


    ### CSS (级联样式表): 一种样式语言，用于定义网页或 JavaFX 应用程序中元素的视觉外观。CSS 允许你对 UI 的字体、颜色、布局和其他视觉方面进行样式化。


    ### 依赖 (Java): 你的 Java 应用程序正常运行所依赖的软件库或模块。依赖通常使用 `Maven` 等构建工具进行管理。


    ### 部署: 将你开发的应用程序提供给用户使用的的过程。这可能涉及打包应用程序、通过选定的渠道进行分发以及提供安装说明。


    ### 事件 (JavaFX): 表示 JavaFX 应用程序内发生用户交互或系统变化的信号。事件通常与 UI 元素相关，并在发生时触发特定的操作。


    ### 垃圾回收 (Java): Java 的自动内存管理系统。它识别未使用的对象并回收其内存以防止内存泄漏。


    ### 继承 (Java): 面向对象编程中的一个概念，子类继承父类的属性和方法。这促进了代码复用并简化了类层次结构。


    ### Java 虚拟机 (JVM): 执行 Java 字节码的软件程序。JVM 是跨平台的，允许 Java 应用程序运行在不同的操作系统上。


    ### 布局 (JavaFX): 容器元素，用于在 JavaFX 应用程序的场景内组织和定位其他 UI 元素。常见的布局类型包括 `HBox`、`VBox`、`GridPane`
    和 `BorderPane`。


    ### 方法 (Java): 类中定义特定功能的代码块。方法可以接受参数并返回值。


    ### 对象 (Java): 类的实例。对象封装了由类定义的数据（属性）和行为（方法）。


    ### 包 (Java): 将 Java 类组织成层级结构的方法。包有助于避免命名冲突并提高代码的可维护性。


    ### 属性 (Java): 参见上一个术语表中的 `Property (JavaFX)`。该术语更泛泛地适用于 Java 编程中与对象相关的数据属性。


    ### 阶段 (JavaFX): 参见上一个术语表中的 `Stage (JavaFX)`。


    ### 子类 (Java): 继承自父类的类。它们可以扩展父类的功能并添加自己的特定行为。


    ### 测试: 参见上一个术语表中的 `Unit Testing`。


    ### 用户界面 (UI): 参见上一个术语表中的 `UI (User Interface)`。


    ### 版本控制系统 (VCS): 参见上一个术语表中的 `Version Control System (VCS)`。


    此扩展术语表为本 JavaFX 桌面应用程序开发指南中会遇到的各种关键术语提供了全面的参考。通过理解这些术语，你将能够胜任 JavaFX 开发工作并创建出出色的桌面应用程序。


    '
