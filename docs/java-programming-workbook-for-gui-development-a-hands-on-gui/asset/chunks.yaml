    \ 组件）提供了预构建的过渡效果。这些过渡简化了动画的创建。\n\n### JavaFX 动画类型：\n\n- **基于时间轴的动画 (Timeline-Based\
    \ Animations)**：你可以使用 `Timeline` 类创建自定义动画，对动画的行为具有完全控制权。\n- **CSS 过渡 (CSS Transitions)**：直接在\
