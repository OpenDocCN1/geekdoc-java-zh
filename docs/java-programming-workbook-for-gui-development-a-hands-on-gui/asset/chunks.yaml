  trans: "\n\n- **Eclipse**: 另一个流行的 IDE，拥有许多插件，如用于视觉化 UI 设计的 `JavaFX Scene Builder`\
    \ 以及用于增强 JavaFX 开发体验的 `e(fx)clipse` 插件。\n- **NetBeans**: 一个免费且开源的 IDE，内置了 JavaFX\
    \ 支持，在功能和易用性之间提供了良好的平衡。\n\n以下是关于为 JavaFX 开发配置 IDE 的通用指南（以 `IntelliJ IDEA` 为例）：\n\
    \n1. **下载并安装 IntelliJ IDEA**: 从 JetBrains 官网下载社区版：[https://www.jetbrains.com/idea/]\n\
    2. **创建新的 JavaFX 项目**: 启动 `IntelliJ IDEA` 并选择“Create New Project”（创建新项目）。在左侧面板中选择“JavaFX”，并提供项目名称和位置。点击“Next”（下一步）。\n\
    3. **配置 JDK**: 确保选择了正确的 `JDK` 版本（应与你安装的 `JDK` 匹配）。点击“Finish”（完成）。\n\n额外考虑：\n\n\
    - **JavaFX SDK（可选）**: 在旧版本的 JavaFX 中，可能需要单独的 `JavaFX SDK`。然而，在现代 Java 版本（`JDK\
    \ 11` 及以上）中，JavaFX 已包含在 `JDK` 中，因此你通常不需要单独安装。\n- **JavaFX 版本兼容性**: 确保你选择的 IDE\
    \ 版本与安装的 `JDK` 中包含的 JavaFX 版本兼容。\n\n一旦设置好开发环境，你就可以开始编写你的第一个 JavaFX 程序了！下一章将引导你如何使用\
    \ JavaFX 构建一个简单的 Hello World 。\n\n# 第 9 章：使用 JavaFX 构建 GUI\n\n## JavaFX 场景图与 FXML\n\
    \nJavaFX 应用依赖两个构建用户界面的基本概念：场景图（Scene Graph）和 FXML。本章将深入探讨这些核心构建模块：\n\n### 场景图\
    \ (Scene Graph)\n\n场景图是一种层次化数据结构，代表 JavaFX 应用中所有的视觉元素（节点）。它定义了这些元素之间的组织结构和关系，为在屏幕上渲染\
    \ UI 基础。\n\n- **节点 (Nodes)**: 应用程序中的每个视觉元素，从简单的矩形形状到复杂的布局甚至是文本，都由场景图中的一个 `node`\
    \ 来表示。\n- **父子关系**: `Nodes` 可以具有父子关系。一个父节点可以包含一个或多个子节点，形成层次结构。`root node` 位于场景图的顶端，包含了应用\
    \ UI 中的所有其他节点。\n- **属性 (Properties)**: 每个 `node` 都有各种属性，定义了它在 UI 中的外观、行为和交互。这些属性可以包括尺寸、位置、颜色、可见性等等。\n\
    - **变换 (Transformations)**: 可以使用缩放、旋转或平移等各种操作对 `Nodes` 进行变换。这允许创建动态和带动画的 UI。\n\
    \n#### 场景图的优势：\n\n- **高效渲染**: 场景图通过仅关注自上次更新以来发生变化的的 UI 部分，实现了高效的渲染。\n- **结构化组织**:\
    \ 场景图的层次结构有助于编写组织良好且易于维护的 UI 代码。\n- **可扩展性**: 场景图可以高效处理包含大量元素的复杂 UI。\n\n### FXML\
    \ (FXML 语言)\n\nFXML（FXML 语言）是一种基于 XML 的声明式语言，允许你在单独的 `.fxml` 文件中定义 JavaFX UI 的结构和布局。这种方法具有若干优势：\n\
    \n- **关注点分离**: 将 UI 定义（FXML）与应用程序逻辑（Java 代码）分离，可以提高代码的可读性和维护性，并促进更整洁的代码库。\n- **声明式语法**:\
    \ FXML 使用声明式方法，你描述 UI 应该看起来什么样，而不是编写命令式代码来创建和排列 UI 元素。\n- **视觉设计工具**: 多个视觉设计工具（如\
    \ `Scene Builder`）与 FXML 集成，允许你视觉化地创建 UI 布局并生成对应的 FXML 代码。\n\n#### FXML 文件的结构：\n\
    \n一个 FXML 文件通常包含以下元素：\n\n- **根元素 (Root Element)**: 根元素定义了 UI 布局的顶层容器。它通常对应于 JavaFX\
    \ 布局面板，如 `VBox`、`HBox` 或 `GridPane`。\n- **UI 组件标签**: 根元素内的子元素代表各种 JavaFX UI 组件，如按钮、标签、文本字段等。每个标签都定义了对应\
    \ UI 组件的属性。\n- **事件处理器 (Event Handlers)**: FXML 允许你通过 `onMouseClicked` 或 `onKeyPressed`\
    \ 等属性直接在 FXML 代码中定义事件处理器。这些属性引用了 Java 代码中的 `methods`，用于处理用户与 UI 元素的交互。\n\n####\
    \ FXML 代码示例：\n\n```xml\n<VBox xmlns:fx=\"http://javafx.com/fxml/1\" xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ fx:controller=\"com.example.mycontroller\">\n    <Label fx:id=\"welcomeLabel\"\
    \ text=\"Welcome to JavaFX!\" />\n    <Button fx:id=\"clickMeButton\" text=\"\
    Click Me\" onAction=\"handleClick\" />\n</VBox>\n```\n\n### 使用 FXML 创建 JavaFX\
    \ 应用\n\n以下是使用 FXML 创建 JavaFX 应用的基本工作流：\n\n1. **设计你的 UI 布局**: 你可以使用视觉化设计工具（如 `Scene\
    \ Builder`），也可以手动编写 FXML 代码。\n2. **开发 Java 类**: 创建一个 Java 类作为你的 FXML 的控制器（controller）。\n\
    3. **加载 FXML 文件**: 在你的控制器类中，使用 `FXLoader` 加载 FXML 文件并与 JavaFX 场景关联。\n4. **访问 UI\
    \ 组件**: 使用 FXML 中定义的 `fx:id` 属性在控制器代码中引用 UI 组件。然后你就可以操作这些组件的属性并处理用户交互。\n\n###\
    \ 使用 JavaFX 控件（按钮、文本字段等）\n\nJavaFX 提供了一系列丰富的预构建 UI 控件，简化了交互性和友好型应用的构建。本节探索一些常用的控件：\n\
    \n- **按钮 (Buttons)**: 使用 `Button` 类创建按钮。按钮可以带有文本标签、图标，并进行各种样式自定义。你可以在 FXML 或控制器类中定义\
    \ `setOnAction` 等事件处理器来处理按钮点击。\n- **文本字段 (Text Fields)**: 利用 `TextField` 类允许用户输入文本。你可以设置\
    \ `promptText` 等属性来提供提示并控制允许的文本类型（例如仅限数字）。\n- **标签 (Labels)**: 使用 `Label` 类显示文本。标签是只读的，主要向用户显示信息。\n\
    - **文本区域 (Text Areas)**: 对于多行文本输入，使用 `TextArea` 类。文本区域为用户提供了更大的可滚动文本输入区域。\n- **复选框和单选按钮**:\
    \ 实现复选框 (`CheckBox`) 和单选按钮 (`RadioButton`)，允许用户选择单个或多个选项。\n- **图像和图标**: 使用 `ImageView`\
    \ 类在你的 UI 中嵌入图像和图标。你可以在 FXML 或控制器类中指定图像路径。\n- **布局 (Layouts)**: JavaFX 提供了各种布局面板，如\
    \ `VBox`（垂直框）、`HBox`（水平框）、`GridPane`（网格布局）和 `BorderPane`（北、南、东、西和中央区域），用于在场景中安排和放置你的\
    \ UI 组件。\n\n#### 示例：构建简单的登录表单\n\n以下是使用 JavaFX 控件和 FXML 构建简单登录表单的示例：\n\n"
- fmt: "\n# login.fxml (FXML File):\n\n```xml\n<VBox xmlns:fx=\"http://javafx.com/fxml/1\"\
    \nxmlns=\"http://www.w3.org/1999/xhtml\"\nfx:controller=\"com.example.logincontroller\"\
    >\n    <Label text=\"Username:\" />\n    <TextField fx:id=\"usernameField\" />\n\
    \    <Label text=\"Password:\" />\n    <PasswordField fx:id=\"passwordField\"\
    \ />\n    <Button text=\"Login\" onAction=\"handleLogin\" />\n</VBox>\n```\n\n\
    ### LoginController.java (Controller Class):\n\n```java\npublic class LoginController\
    \ {\n    @FXML\n    private TextField usernameField;\n    @FXML\n    private PasswordField\
    \ passwordField;\n\n    public void handleLogin() {\n        String username =\
    \ usernameField.getText();\n        String password = passwordField.getText();\n\
    \        // Implement login logic here, e.g., validate credentials and handle\
    \ successful/failed login\n    }\n}\n```\n\nThis example demonstrates how `FXML`\
    \ defines the UI layout with labels, text fields, and a button. The controller\
    \ class references these UI elements using the `fx:id` attributes and provides\
    \ an `handleLogin` method to handle button clicks and implement your login logic.\n\
    \n## Additional JavaFX Controls\n\nJavaFX offers a wider range of controls beyond\
    \ the basics covered here. Here are some additional noteworthy controls:\n\n-\
    \ **Sliders**: Allow users to select a value from a continuous range using a draggable\
    \ slider.\n- **Choice Boxes and Combo Boxes**: Present users with a list of options\
    \ to choose from.\n- **Progress Bars**: Visually indicate the progress of an operation.\n\
    - **Menus and Context Menus**: Create hierarchical menus for user interaction.\n\
    - **Web Views**: Embed web content within your JavaFX application.\n- **List Views\
    \ and Table Views**: Display lists or tabular data for user interaction.\n\nExploring\
    \ the JavaFX documentation will provide you with a comprehensive overview of all\
    \ available controls and their functionalities.\n\nBy effectively utilizing these\
    \ controls and leveraging `FXML` for your UI layout, you can build visually appealing\
    \ and user-friendly JavaFX applications.\n\n## Animations and Effects in JavaFX\
    \ Applications\n\nJavaFX excels at creating dynamic and visually engaging user\
    \ interfaces through animations and effects. This section dives into how to incorporate\
    \ these elements into your applications.\n\n### JavaFX Animation Classes:\n\n\
    - **Timeline**: The fundamental class for creating animations. It defines a timeline\
    \ over which an animation occurs and allows you to specify keyframes that represent\
    \ the animation's state at different points in time.\n- **KeyFrame**: Represents\
    \ a specific state of the animation at a particular point in the timeline. You\
    \ can define properties of UI elements within keyframes to create the animation\
    \ effect.\n- **Transitions**: JavaFX provides pre-built transitions for common\
    \ animation effects like fading, scaling, rotating, and translating UI components.\
    \ These transitions simplify animation creation.\n\n### Types of JavaFX Animations:\n\
    \n- **Timeline-Based Animations**: You can create custom animations using the\
    \ `Timeline` class, offering full control over the animation's behavior.\n- **CSS\
    \ Transitions**: Define animations directly within your `FXML` code using CSS\
    \ transition properties. This approach is simpler for basic animations.\n\n###\
    \ Example: Fading In a Label\n\nHere's an example of fading in a label using a\
    \ CSS transition within `FXML`:\n\n```xml\n<Label fx:id=\"welcomeLabel\" text=\"\
    Welcome!\" opacity=\"0.0\">\n    <transition:Fade transitionDuration=\"Fast\"\
    \ />\n</transition:Fade>\n```\n\nThe `opacity` property is set to 0.0 initially,\
    \ making the label invisible. The `transition:Fade` element defines a fade-in\
    \ transition with the `Fast` duration preset.\n\n### Additional Animation and\
    \ Effect Techniques:\n\n- **Path Transitions**: Animate UI elements along a defined\
    \ path for more complex movements.\n- **Interpolator**: Control the pacing and\
    \ easing of animation transitions using interpolators.\n- **Effects**: Apply visual\
    \ effects like drop shadows, blurs, and color adjustments to enhance your UI's\
    \ aesthetics.\n\n### Benefits of Animations and Effects:\n\n- **Improved User\
    \ Experience**: Animations and effects can make your UI more engaging and interactive,\
    \ improving user experience.\n- **Visual Feedback**: Animations can provide visual\
    \ cues to users about actions or state changes within the application.\n- **Attention\
    \ Grabbing**: Well-designed animations can effectively draw user attention to\
    \ specific UI elements.\n\n**Remember**: Use animations and effects judiciously\
    \ to avoid overwhelming users or hindering performance.\n\nBy understanding these\
    \ animation concepts and techniques, you can add a touch of dynamism and visual\
    \ interest to your JavaFX applications.\n\n## Chapter 10: Event Handling in JavaFX\n\
    \n### Event Handling Mechanisms in JavaFX\n\nEvent handling is a fundamental aspect\
    \ of creating interactive applications. JavaFX provides a robust event handling\
    \ mechanism that allows your application to respond to user interactions and other\
    \ events within the system. This chapter explores the key concepts and techniques\
    \ for effective event handling in JavaFX.\n\n### Event Model Overview\n\nJavaFX\
    \ applications follow an event-driven programming model. This means that the application\
    \ doesn't continuously check for user input or changes; instead, it reacts to\
    \ events that are triggered by user interactions (e.g., clicking a button), system\
    \ events (e.g., window resizing), or application logic.\n\n**Components of the\
    \ Event Model:**\n\n- **Events**: Represent occurrences of interest within the\
    \ application. Events encapsulate information about what happened, where it happened\
    \ (source), and when it happened.\n- **Event Sources**: The objects that generate\
    \ events. UI components like buttons, text fields, and windows are common event\
    \ sources.\n- **Event Handlers**: Methods within your code that are responsible\
    \ for handling specific events. Event handlers are typically defined within your\
    \ controller classes.\n- **Event Listeners**: Objects that register interest in\
    \ receiving notifications about specific events. Event listeners are attached\
    \ to event sources and invoke the corresponding event handler when the event occurs.\n\
    - **Event Propagation**: Events typically propagate through the scene graph hierarchy.\
    \ If an event is not handled by a specific UI component, it may bubble up to its\
    \ parent nodes until reaching the root node or being handled by an intermediate\
    \ listener.\n\n### Attaching Event Listeners in JavaFX\n\nThere are two primary\
    \ ways to attach event listeners to UI components in JavaFX:\n\n- **FXML Event\
    \ Handlers**: Within your `FXML` code, you can directly define event handlers\
    \ for specific UI components using attributes like `onMouseClicked` or `onKeyPressed`.\
    \ These attributes reference methods in your controller class that will handle\
    \ the corresponding event.\n\n```xml\n<Button text=\"Click Me\" onAction=\"handleClick\"\
    \ />\n```\n\n- **Java Code Event Listeners**: Programmatically, you can use methods\
    \ like `setOnAction` or `setOnKeyPressed` on UI component objects within your\
    \ controller class to attach event listeners.\n\n```java\nbutton.setOnAction(this::handleClick);\n\
    ```\n\nBoth approaches achieve the same outcome - registering your event handler\
    \ method to be invoked when the specified event occurs on the UI component.\n\n\
    ### Common JavaFX Events\n\nJavaFX provides a wide range of events that you can\
    \ handle within your application. Here are some commonly used events:\n\n- **Mouse\
    \ Events**: Events related to mouse interactions like clicking, pressing, releasing,\
    \ hovering, and dragging (e.g., `onMouseClicked`, `onMousePressed`).\n- **Keyboard\
    \ Events**: Events triggered by keyboard input like key presses, releases, and\
    \ typed characters (e.g., `onKeyPressed`, `onKeyReleased`, `onKeyTyped`).\n- **Action\
    \ Events**: Fired when a user performs an action on a UI component like clicking\
    \ a button or selecting an item (e.g., `setOnAction`).\n- **Window Events**: Events\
    \ related to window management like opening, closing, resizing, and minimizing\
    \ (e.g., `onShowing`, `onCloseRequest`).\n- **Focus Events**: Events related to\
    \ gaining or losing focus by a UI component (e.g., `onFocused`, `onLostFocus`).\n\
    - **Drag and Drop Events**: Events related to dragging and dropping UI elements\
    \ (e.g., `onDragDetected`, `onDragDropped`).\n"
