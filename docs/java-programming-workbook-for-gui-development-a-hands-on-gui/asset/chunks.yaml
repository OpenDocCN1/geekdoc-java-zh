    ​○ ​setText(String text): Set the initial text displayed in the field.


    ​○ ​getText(): Get the current text entered by the user.


    ​○ ​setColumns(int columns): Set the width of the text field in characters (not
    pixels).


    ​○ ​setFont(Font font): Set the font style and size of the text.


    ​● ​Event Handling:


    ​○ ​Use ActionListener to listen for the actionPerformed event, which is triggered
    when the user presses Enter or clicks outside the field.


    ​○ ​Optionally, use DocumentListener to track changes within the text field as
    the user types.


    2\. Text Areas (JTextArea):


    ​● ​Functionality: Enable users to enter and edit multi-line text.


    ​● ​Properties: Similar to JTextField with additional methods for handling line
    breaks and scrolling.


    ​● ​Event Handling: Similar to JTextField, use ActionListener and potentially
    DocumentListener.


    3\. Buttons (JButton):


    ​● ​Functionality: Initiate actions when clicked.


    ​● ​Properties:


    ​○ ​setText(String text): Set the text displayed on the button.


    ​○ ​setEnabled(boolean enabled): Enable or disable the button for user interaction.


    ​● ​Event Handling: Use ActionListener to listen for the actionPerformed event
