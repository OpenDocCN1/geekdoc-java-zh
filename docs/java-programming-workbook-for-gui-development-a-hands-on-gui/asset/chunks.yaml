  trans: "\n\n# 常见 UI 设计模式示例\n\n这里是一些广泛使用的 UI 设计模式，用于说明它们的应用：\n\n- **导航栏 (Navigation\
    \ Bar)**：水平或垂直的条形，包含菜单、按钮或面包屑导航等导航元素，为用户提供探索应用程序不同部分的清晰方式。\n- **标签页 (Tabs)**：通过带有标签的页将内容组织到不同的区域，允许用户在视图之间高效切换。\n\
    - **搜索栏 (Search Bar)**：允许用户在应用程序内搜索特定信息。\n- **表单布局 (Form Layouts)**：用于用户输入的结构化布局，包括标签、文本字段、复选框和单选按钮，有效引导用户完成数据输入任务。\n\
    - **模态框和对话框 (Modals and Dialogs)**：用于特定交互的覆盖层，如确认提示、错误消息或登录表单，在继续之前需要用户注意。\n-\
    \ **进度条 (Progress Bars)**：视觉化地通信长时间运行操作的状态，让用户了解进度。这些这些只是示例之一，还存在许多其他 UI 设计模式来解决各种设计挑战。\n\
    \n## 选择与应用设计模式\n\n以下是有效利用 UI 设计模式的一些指南：\n\n- **理解问题**：识别你正在尝试解决的特定设计挑战。\n- **研究可用模式**：探索不同的模式及其对你需求的性。\n\
    - **适配而非复制**：不要盲目复制模式；要根据你应用程序的特定上下文和用户需求进行定制。\n- **保持一致性**：一旦采用某种模式，要努力在整个 UI\
    \ 中保持一致使用，以获得统一的用户体验。\n- **优先考虑可用性测试**：即使使用既有模式，可用性测试对于确保你的 UI 直观且易用也是至关重要的。\n\
    \nUI 设计模式是开发者和设计师创建以用户为中心、高效且视觉良好的图形用户界面的价值工具。通过理解设计模式的核心原则及其适当应用，你可以提升 JavaFX\
    \ 应用程序的质量和有效性。\n\n## 流行 UI 设计模式概述 (MVC, MVVM)\n\n虽然上一节介绍了 UI 设计模式的通用概念，但本节将深入两种与\
    \ JavaFX 开发特别相关的流行设计模式：模型-视图-控制器 (`MVC`) 和模型-视图-视图模型 (`MVVM`)。\n\n### 模型-视图-控制器\
    \ (MVC)\n\n`MVC` 是一种广泛使用的架构模式，将应用程序逻辑 (`model`)、数据展示 (`view`) 和用户交互处理 (`controller`)\
    \ 分离到不同的组件中。这有助于更好的代码组织、可维护性和可测试性。\n\n#### MVC 的组件：\n\n- **模型 (Model)**：代表应用程序的数据和业务逻辑。它封装了数据访问和操作。\n\
    - **视图 (View)**：负责向用户显示数据的 UI 组件。视图不应包含任何应用程序逻辑。\n- **控制器 (Controller)**：处理与视图的用户交互，并相应地更新模型。它充当视图和模型之间的中介。\n\
    \n#### MVC 在 JavaFX 中的优势：\n\n- **改进代码分离**：`MVC` 促进了关注点的清晰分离，使代码更具维护性和可测试性。\n-\
    \ **灵活性**：对 UI (`view`) 或数据模型 (`model`) 的更改对其他组件的影响可以降最低。\n- **更清晰的职责**：每个组件（`model`,\
    \ `view`, `controller`）都有定义良好的职责，简化了开发。\n\n#### MVC 在 JavaFX 中的局限性：\n\n- **简单应用程序的复杂性**：对于较小的应用程序，`MVC`\
    \ 可能会引入不必要的开销。\n ** **双向数据流**：更新 UI 通常需要修改控制器，这可能导致组件之间紧密的耦合。\n\n### 模型-视图-视图模型\
    \ (MVVM)\n\n`MVVM` 是一种建立在 `MVC` 之上的架构模式，引入了 `ViewModel` 组件。`ViewModel` 充当视图和模型之间的中介，处理数据准备和展示逻辑。\n\
    \n#### MVVM 的组件：\n\n- **模型 (Model)**：与 `MVC` 类似，模型代表应用程序的数据和业务逻辑。\n- **视图 (View)**：负责显示数据的\
    \ UI 组件。视图保持被动状态，不包含应用程序逻辑。\n- **ViewModel**：位于视图和模型之间的新组件。它为视图准备数据，处理用户交互，并暴露可观察属性，当底层数据更改时会自动会自动更新视图。\n\
    \n#### MVVM 在 JavaFX 中的优势：\n\n- **改进的可测试性**：与 `MVC` 中的控制器相比，`ViewModels` 更容易进行孤立单元测试。\n\
    - **松耦合**：视图和模型通过 `ViewModel` 保持松耦合，促进了更好的维护性。\n- **双向数据绑定**：`MVVM` 允许视图和 `ViewModel`\
    \ 之间进行双向绑定，简化了数据流管理。\n\n**MVVM vs. MVC**：虽然 `MVC` 和 `MVVM` 都解决了关注点分离，但 `MVVM`\
    \ 通过数据绑定提供了视图和 `ViewModel` 之间更紧密的集成。这对于具有动态 UI 的复杂 JavaFX 应用程序特别有利。\n\n#### 在\
    \ MVC 和 MVVM 之间选择：\n\n- **简单应用程序**：对于较小的 JavaFX 应用程序，`MVC` 因为结构简单可能足够。\n- **复杂应用程序**：对于具有动态\
    \ UI 的数据驱动应用程序，`MVVM` 的双向绑定和松耦合可以带来更整洁、更易维护的代码。\n\n## 第 13 章：实现模型-视图-控制器 (MVC)\
    \ 模式\n\n### 使用 MVC 分离关注点\n\n模型-视图-控制器 (`MVC`) 模式是构建用户界面的基础架构模式。它将应用程序逻辑 (`model`)、数据展示\
    \ (`view`) 和用户交互处理 (`controller`) 分离到不同的组件。本章深入探讨 `MVC` 在 JavaFX 应用程序中的实现，强调关注点分离的优势。\n\
    \n### MVC 的核心原则\n\n`MVC` 促进了应用程序内部关注点的清晰分离。以下是这些关注点及其 MVC 组件的详细说明：\n\n- **数据和业务逻辑\
    \ (Model)**：模型代表应用程序的核心数据，并封装了负责操作数据的业务逻辑。它应该独立于任何 UI 或用户交互。\n- **数据展示 (View)**：视图包含了负责向用户显示数据的\
    \ UI 组件。视图通常使用 `FXML` 创建，不应包含任何应用程序逻辑或数据访问代码。\n- **用户交互处理 (Controller)**：控制器充当视图和模型之间的中介。它处理与\
    \ UI 的交互（例如按钮点击、表单提交）并相应地更新模型。然后控制器从模型中获取更新的数据，并指示视图反映这些更改。\n\n### 分离关注点的优势\n\n\
    通过采用 `MVC` 模式，你的 JavaFX 应用程序将获得若干优势：\n\n- **提高可维护性**：分离关注点使你的代码更加模块化，更容易理解和维护。对一个组件（`model`,\
    \ `view` 或 `controller`）的更改对应用程序其他部分的影响较小。\n- **增加可测试性**：每个 MVC 组件都可以孤立地测试，简化了测试过程并确保了应用程序的可靠性。\n\
    - **灵活性**：如果你需要更改 UI (`view`) 或数据结构 (`model`)，你可以这样做，而对其他组件的影响最小，提升了灵活性适应性。\n\
    - **可重用性**：控制器和模型可以在应用程序内的不同视图之间重复使用，甚至可以在具有相似数据模型的其他应用程序中用。\n\n### 在 JavaFX 中实现\
    \ MVC\n\n以下是在 JavaFX 应用程序中实现 `MVC` 的基本结构：\n\n- **Model 包**：包含表示你的应用程序数据和业务逻辑的类。这些类不应有任何与\
    \ UI 相关的依赖。\n\n"
- fmt: "\n- **View Package**: Contains FXML files for defining your UI layouts and\
    \ Java classes associated with those FXML files (controller classes) to handle\
    \ UI logic.\n- **Controller Package**: Contains controller classes that handle\
    \ user interactions within the view and communicate with the model to update data\
    \ or retrieve new data for display.\n\n## Example: Simple Address Book Application\n\
    \nImagine an application for managing address book entries (name, phone number,\
    \ email). Here's a simplified illustration of how MVC would be applied:\n\n- **Model**:\
    \ An `Address` class encapsulating properties like `name`, phone number, and `email`.\
    \ It might also have methods for adding, editing, and deleting contacts.\n- **View**:\
    \ An FXML file defining the UI layout for displaying and managing contacts, potentially\
    \ including a list view, text fields, and buttons.\n- **Controller**: A `ContactController`\
    \ class associated with the view's FXML file. It handles user interactions like\
    \ adding new contacts, editing existing ones, and deleting contacts. The controller\
    \ communicates with the `Address` model to perform these operations and updates\
    \ the view accordingly.\n\n## Communication between MVC Components\n\nWhile MVC\
    \ promotes separation, some communication between components is necessary. Here\
    \ are common approaches:\n\n- **Controllers Update Models Directly**: Controllers\
    \ can directly access and modify the model based on user interactions.\n- **Events\
    \ and Listeners**: Models can notify views about data changes through events and\
    \ listeners. This approach can improve loose coupling.\n- **Property Binding (Limited\
    \ in MVC)**: In JavaFX, you can utilize property binding to a limited extent within\
    \ MVC to establish a connection between view elements and model properties. However,\
    \ be cautious not to introduce excessive two-way data flow, which can become complex\
    \ to manage in MVC.\n\n**Remember**: MVC is about separation of concerns, so strive\
    \ to maintain clear boundaries between components while facilitating necessary\
    \ communication.\n\n## Limitations of MVC\n\nWhile a powerful pattern, MVC does\
    \ have some limitations to consider:\n\n- **Complexity for Simple Applications**:\
    \ For very basic applications, the structure of MVC might introduce unnecessary\
    \ overhead.\n- **Bidirectional Data Flow**: Updating the UI often requires modifying\
    \ the controller, which can lead to tighter coupling between components. For more\
    \ complex scenarios, consider Model-View-ViewModel (MVVM), which is explored in\
    \ the next chapter, as it offers tighter integration between the view and model\
    \ through data binding.\n\n## Building a Swing/JavaFX Application with MVC\n\n\
    This section provides a step-by-step walkthrough of building a simple Swing/JavaFX\
    \ application using the MVC pattern. We'll create a basic counter application\
    \ that allows users to increment and decrement a counter value displayed on the\
    \ screen.\n\n### Choosing Swing or JavaFX:\n\nFor this example, you can choose\
    \ either Swing or JavaFX to develop the view component. While both can be used\
    \ with MVC, Swing is a more traditional option, and JavaFX offers a more modern\
    \ approach with richer UI capabilities. The choice depends on your project requirements\
    \ and preferences.\n\n### 1. Define the Model (Common for Swing/JavaFX):\n\nCreate\
    \ a model class named `Counter` to represent the application's data. Here's an\
    \ example implementation in Java:\n\n```java\npublic class Counter {\n    private\
    \ int value;\n\n    public Counter() {\n        this.value = 0;\n    }\n\n   \
    \ public int getValue() {\n        return value;\n    }\n\n    public void increment()\
    \ {\n        value++;\n    }\n\n    public void decrement() {\n        value--;\n\
    \    }\n}\n```\n\nThis `Counter` class encapsulates the counter value and provides\
    \ methods to increment and decrement it. It has no UI dependencies, adhering to\
    \ the separation of concerns principle.\n\n### 2. Develop the View (Swing Example):\n\
    \nHere's a Swing example for the view using a `JFrame` and associated UI components:\n\
    \n- `counter.fxml`: An FXML file can be used for layout definition (optional for\
    \ Swing).\n- `CounterView.java`: A Java class associated with the FXML (or directly\
    \ implementing the UI in Swing).\n\n```java\n// CounterView.java (Swing example)\n\
    public class CounterView extends JFrame {\n    private JLabel counterLabel;\n\
    \    private JButton incrementButton;\n    private JButton decrementButton;\n\
    \    private Counter model;\n\n    public CounterView(Counter model) {\n     \
    \   this.model = model;\n        initializeComponents();\n        createLayout();\n\
    \        addEventListeners();\n    }\n\n    private void initializeComponents()\
    \ {\n        counterLabel = new JLabel(\"0\");\n        incrementButton = new\
    \ JButton(\"Increment\");\n        decrementButton = new JButton(\"Decrement\"\
    );\n    }\n\n    private void createLayout() {\n        // Code to define layout\
    \ using Swing layout managers (e.g., BorderLayout)\n    }\n\n    private void\
    \ addEventListeners() {\n        incrementButton.addActionListener(e -> incrementCounter());\n\
    \        decrementButton.addActionListener(e -> decrementCounter());\n    }\n\n\
    \    private void incrementCounter() {\n        model.increment();\n        updateView();\n\
    \    }\n\n    private void decrementCounter() {\n        model.decrement();\n\
    \        updateView();\n    }\n\n    private void updateView() {\n        counterLabel.setText(String.valueOf(model.getValue()));\n\
    \    }\n}\n```\n\nThis Swing implementation defines a `CounterView` class that\
    \ creates the UI using Swing components (`JLabel`, `JButton`). It also includes\
    \ methods for handling user interaction with the buttons and updating the displayed\
    \ counter value based on the model.\n\n### 3. Develop the View (JavaFX Example):\n\
    \nHere's a JavaFX example for the view using FXML and a controller class:\n\n\
    - `counter.fxml`: An FXML file defining the UI layout for the counter application.\n\
    \n```xml\n<HBox fx:id=\"root\" spacing=\"10\">\n    <Label text=\"Counter:\" />\n\
    \    <Label fx:id=\"counterLabel\" text=\"0\" />\n    <Button text=\"Increment\"\
    \ onAction=\"incrementCounter\" />\n    <Button text=\"Decrement\" onAction=\"\
    decrementCounter\" />\n</HBox>\n```\n\n- `CounterViewController.java`: A JavaFX\
    \ controller class associated with the FXML.\n\n```java\n// CounterViewController.java\
    \ (JavaFX example)\npublic class CounterViewController {\n    @FXML\n    private\
    \ Label counterLabel;\n    private Counter model;\n\n    public void setModel(Counter\
    \ model) {\n        this.model = model;\n        counterLabel.setText(String.valueOf(model.getValue()));\n\
    \    }\n\n    public void incrementCounter() {\n        model.increment();\n \
    \       counterLabel.setText(String.valueOf(model.getValue()));\n    }\n\n   \
    \ public void decrementCounter() {\n        model.decrement();\n        counterLabel.setText(String.valueOf(model.getValue()));\n\
    \    }\n}\n```\n\nThe JavaFX example uses FXML to define the UI layout and a `CounterViewController`\
    \ class to handle interactions and update the view based on the model.\n\n###\
    \ 4. Create the Controller (Common for Swing/JavaFX):\n\n- A controller class\
    \ is responsible for handling user interactions and communication between the\
    \ view and model.\n\n```java\n// CounterController.java\npublic class CounterController\
    \ {\n    private Counter model;\n    private CounterView view; // Swing or JavaFX\
    \ view\n\n    public CounterController(Counter model, CounterView view) {\n  \
    \      this.model = model;\n        this.view = view;\n        view.setController(this);\
    \ // Set this controller in the view (optional)\n    }\n\n    public void incrementCounter()\
    \ {\n        model.increment();\n        view.updateView(model.getValue()); //\
    \ Update view based on model\n    }\n\n    public void decrementCounter() {\n\
    \        model.decrement();\n        view.updateView(model.getValue()); // Update\
    \ view based on model\n    }\n}\n```\n\nThis `CounterController` class acts as\
    \ the intermediary. It receives a reference to the `model` and the `view`. It\
    \ defines methods for handling increment/decrement clicks and delegates the update\
    \ task to the view.\n\n### 5. Putting it all Together (Swing Example):\n\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        Counter\
    \ model = new Counter();\n        CounterView view = new CounterView(model);\n\
    \        CounterController controller = new CounterController(model, view);\n\
    \        view.setVisible(true);\n    }\n}\n```\n\nThe `Main` class creates instances\
    \ of the model, view, and controller and establishes connections between them.\
    \ Finally, it makes the view visible to the user.\n"
  raw: '​● ​View Package: Contains FXML files for defining your UI layouts and Java
    classes associated with those FXML files (controller classes) to handle UI logic.


    ​● ​Controller Package: Contains controller classes that handle user interactions
    within the view and communicate with the model to update data or retrieve new
    data for display.


    Example: Simple Address Book Application


    Imagine an application for managing address book entries (name, phone number,
    email). Here''s a simplified illustration of how MVC would be applied:


    ​● ​Model: An Address class encapsulating properties like name, phone number,
    and email. It might also have methods for adding, editing, and deleting contacts.


    ​● ​View: An FXML file defining the UI layout for displaying and managing contacts,
    potentially including a list view, text fields, and buttons.


    ​● ​Controller: A ContactController class associated with the view''s FXML file.
    It handles user interactions like adding new contacts, editing existing ones,
    and deleting contacts. The controller communicates with the Address model to perform
    these operations and updates the view accordingly.


    Communication between MVC Components


    While MVC promotes separation, some communication between components is necessary.
    Here are common approaches:


    ​● ​Controllers Update Models Directly: Controllers can directly access and modify
    the model based on user interactions.


    ​● ​Events and Listeners: Models can notify views about data changes through events
    and listeners. This approach can improve loose coupling.


    ​● ​Property Binding (Limited in MVC): In JavaFX, you can utilize property binding
    to a limited extent within MVC to establish a connection between view elements
    and model properties. However, be cautious not to introduce excessive two-way
    data flow, which can become complex to manage in MVC.


    Remember: MVC is about separation of concerns, so strive to maintain clear boundaries
    between components while facilitating necessary communication.


    Limitations of MVC


    While a powerful pattern, MVC does have some limitations to consider:


    ​● ​Complexity for Simple Applications: For very basic applications, the structure
    of MVC might introduce unnecessary overhead.


    ​● ​Bidirectional Data Flow: Updating the UI often requires modifying the controller,
    which can lead to tighter coupling between components. For more complex scenarios,
    consider Model-View-ViewModel (MVVM), which is explored in the next chapter, as
    it offers tighter integration between the view and model through data binding.


    ### Building a Swing/JavaFX Application with MVC


    This section provides a step-by-step walkthrough of building a simple Swing/JavaFX
    application using the MVC pattern. We''ll create a basic counter application that
    allows users to increment and decrement a counter value displayed on the screen.


    Choosing Swing or JavaFX:


    For this example, you can choose either Swing or JavaFX to develop the view component.
    While both can be used with MVC, Swing is a more traditional option, and JavaFX
    offers a more modern approach with richer UI capabilities. The choice depends
    on your project requirements and preferences.


    1\. Define the Model (Common for Swing/JavaFX):


    Create a model class named Counter to represent the application''s data. Here''s
    an example implementation in Java:


    Java


    public class Counter {


    private int value;


    public Counter() {


    this.value = 0;


    }


    public int getValue() {


    return value;


    }


    public void increment() {


    value++;


    }


    public void decrement() {


    value--;


    }


    }


    This Counter class encapsulates the counter value and provides methods to increment
    and decrement it. It has no UI dependencies, adhering to the separation of concerns
    principle.


    2\. Develop the View (Swing Example):


    Here''s a Swing example for the view using a JFrame and associated UI components:


    ​● ​counter.fxml: An FXML file can be used for layout definition (optional for
    Swing).


    ​● ​CounterView.java: A Java class associated with the FXML (or directly implementing
    the UI in Swing).


    Java


    // CounterView.java (Swing example)


    public class CounterView extends JFrame {


    private JLabel counterLabel;


    private JButton incrementButton;


    private JButton decrementButton;


    private Counter model;


    public CounterView(Counter model) {


    this.model = model;


    initializeComponents();


    createLayout();


    addEventListeners();


    }


    private void initializeComponents() {


    counterLabel = new JLabel("0");


    incrementButton = new JButton("Increment");


    decrementButton = new JButton("Decrement");


    }


    private void createLayout() {


    // Code to define layout using Swing layout managers (e.g., BorderLayout)


    }


    private void addEventListeners() {


    incrementButton.addActionListener(e -> incrementCounter());


    decrementButton.addActionListener(e -> decrementCounter());


    }


    private void incrementCounter() {


    model.increment();


    updateView();


    }


    private void decrementCounter() {


    model.decrement();


    updateView();


    }


    private void updateView() {


    counterLabel.setText(String.valueOf(model.getValue()));


    }


    }


    This Swing implementation defines a CounterView class that creates the UI using
    Swing components (JLabel, JButtons). It also includes methods for handling user
    interaction with the buttons and updating the displayed counter value based on
    the model.


    3\. Develop the View (JavaFX Example):


    Here''s a JavaFX example for the view using FXML and a controller class:


    ​● ​counter.fxml: An FXML file defining the UI layout for the counter application.


    XML


    <HBox fx:id="root" spacing="10">


    <Label text="Counter:" />


    <Label fx:id="counterLabel" text="0" />


    <Button text="Increment" onAction="incrementCounter" />


    <Button text="Decrement" onAction="decrementCounter" />


    </HBox>


    ​● ​CounterViewController.java: A JavaFX controller class associated with the
    FXML file.


    Java


    // CounterViewController.java (JavaFX example)


    public class CounterViewController {


    @FXML


    private Label counterLabel;


    private Counter model;


    public void setModel(Counter model) {


    this.model = model;


    counterLabel.setText(String.valueOf(model.getValue()));


    }


    public void incrementCounter() {


    model.increment();


    counterLabel.setText(String.valueOf(model.getValue()));


    }


    public void decrementCounter() {


    model.decrement();


    counterLabel.setText(String.valueOf(model.getValue()));


    }


    }


    The JavaFX example uses FXML to define the UI layout and a CounterViewController
    class to handle user interactions and update the view based on the model. Notice
    how


    4\. Create the Controller (Common for Swing/JavaFX):


    ​● ​A controller class is responsible for handling user interactions and communication
    between the view and model.


    Java


    // CounterController.java


    public class CounterController {


    private Counter model;


    private CounterView view; // Swing or JavaFX view interface


    public CounterController(Counter model, CounterView view) {


    this.model = model;


    this.view = view;


    view.setController(this); // Set this controller in the view (optional)


    }


    public void incrementCounter() {


    model.increment();


    view.updateView(model.getValue()); // Update view based on model


    }


    public void decrementCounter() {


    model.decrement();


    view.updateView(model.getValue()); // Update view based on model


    }


    }


    This CounterController class acts as the intermediary. It receives a reference
    to the model and the view (either Swing''s CounterView or JavaFX''s CounterViewController).
    It defines methods for handling increment/decrement button clicks and delegates
    the update task to the view, passing the current model value.


    5\. Putting it all Together (Swing Example):


    Java


    public class Main {


    public static void main(String[] args) {


    Counter model = new Counter();


    CounterView view = new CounterView(model);


    CounterController controller = new CounterController(model, view);


    view.setVisible(true);


    }


    }


    The Main class creates instances of the model, view, and controller and establishes
    connections between them. Finally, it makes the view visible to the user.'
