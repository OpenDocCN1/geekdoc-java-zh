    - **Creator Class**: Defines an interface or abstract class specifying the object
    creation operation (e.g., `ProductCreator`).

    - **Concrete Creator Classes**: Implementations of the creator class that provide
    specific logic for creating different product types (e.g., `WindowFactory`, `DialogFactory`).

    - **Product**: The interface or base class representing the objects to be created.

    - **Concrete Products**: Concrete implementations of the product interface (e.g.,
    `Window`, `Dialog`).


    ### Benefits

    - **Decoupling**: Client code interacts with the `creator`, not the concrete product
    implementations. This allows for easy switching between different product types
    without modifying client code.

    - **Flexibility**: You can introduce new concrete creator and product classes
    without affecting existing code.

    - **Encapsulated Creation Logic**: The logic for creating objects is centralized
    and easier to manage.


    ### Example: Creating Different Window Types


    Imagine an application that can create different window types (modal dialog, pop-up
    window). Here''s how the Factory Method pattern can be applied:


    - **Product**: An interface `Window` defining methods common to all window types.

    - **Concrete Products**: `ModalDialog` and `PopupWindow` classes implementing
    the `Window` interface with specific functionalities.

    - **Creator**: A `WindowFactory` abstract class defining a `createWindow` method
    that takes a type parameter (e.g., `MODAL_DIALOG`, `POPUP`) and returns a `Window`
    object.

    - **Concrete Creator Classes**: `ModalDialogFactory` and `PopupWindow` that extend
    `WindowFactory` and implement `createWindow` by returning specific concrete product
    instances (`ModalDialog` or `PopupWindow`).


    The client code interacts with the `WindowFactory` (or its concrete subclasses)
    to create different window types without knowing the specific implementation details.


    ### Singleton Pattern


    The Singleton pattern ensures that a class has only one instance and provides
    a global access point to it.


    - **Singleton Class**: Defines a private constructor to prevent direct instantiation
    and a static method to get the single instance (`getInstance`). It ensures only
    one instance is created and provides access to it.


    ### Benefits

    - **Global Access**: Provides a single point of access to the object from anywhere
    in the application.

    - **Resource Management**: Useful for managing resources like database connections
    or configuration files, ensuring they are created and used efficiently.


    ### Drawbacks

    - **Tight Coupling**: Global state can lead to tight coupling between parts of
    your application.

    - **Testing Challenges**: Singleton classes can be difficult to unit test due
    to their global nature.


    ### Use Cases in JavaFX:


    While the Singleton pattern has limitations, it can be cautiously used in JavaFX
    for specific scenarios:


    - **Configuration Manager**: A Singleton class can hold application-wide configuration
    settings, accessed by different parts of the application.

    - **Logging Service**: A Singleton can manage a centralized logging system, ensuring
    consistent logging behavior throughout the application.


    Remember: Use the Singleton pattern sparingly and consider alternatives like dependency
    injection for situations where loose coupling is critical.


    This chapter explored the Factory Method and Singleton design patterns. While
    not as widely used in GUI development as MVVM or Observer, they can be valuable
    tools for specific situations. By understanding these patterns and their trade-offs,
    you can make informed decisions about their applicability in your JavaFX applications.


