  trans: "\n\n此示例创建了一个引用 `/resources` 文件夹内音频文件的 `Media` 对象。然后使用该 `Media` 对象创建一个 `MediaPlayer`，并通过\
    \ `play` 方法启动播放。\n\n注意：请将 `/resources/audio.mp3` 替换为音频文件的实际路径。\n\n## 用于媒体播放的 FXML\
    \ 集成\n\n你可以利用 FXML 在 UI 布局中声明式地集成媒体播放功能：\n\n```xml\n<HBox>\n  <MediaView fx:id=\"\
    mediaView\" />\n  <Button text=\"Play\" onAction=\"playMedia\" />\n  <Button text=\"\
    Pause\" onAction=\"pauseMedia\" />\n</HBox>\n```\n\n这段 FXML 代码定义了一个 `MediaView`\
    \ 元素，并带有 `fx:id` 以便在控制器类中引用它。同时还定义了按钮用于触发播放控制方法。\n\n### 控制器类 (`playMedia` 和 `pauseMedia`\
    \ 方法):\n\n```java\npublic void playMedia() {\n    mediaPlayer.play();\n}\n\npublic\
    \ void pauseMedia() {\n    mediaPlayer.pause();\n}\n```\n\n控制器类通过 `fx:id` 引用 `MediaView`，并提供方法根据用户与按钮的交互来控制播放。\n\
    \n## 额外考虑\n\n- **支持的媒体格式**：JavaFX 媒体播放能力取决于特定平台上的底层媒体引擎。请参阅 JavaFX 文档获取支持的格式列表。\n\
    - **高级功能**：JavaFX  API 提供了设置音量、静音和处理媒体事件（例如播放结束）等功能。探索 JavaFX 文档获取全面概述。\n\n通过理解这些概念和技术，你可以在\
    \ JavaFX 应用中加入音频和视频播放，用多媒体内容丰富用户体验。\n\n## 使用 JavaFX 创建 3D 图形和特效\n\nJavaFX 提供了内置的\
    \ 3D 图形能力，允许你创建沉浸式且具有视觉吸引力的用户界面。本节将介绍在 JavaFX 中处理 3D 图形的基础知识。\n\n### JavaFX 3D\
    \ 概念\n\n- **场景图扩展**：作为 UI 布局基础的场景图扩展到了支持 3D 元素。3D 节点代表 3D 场景中的几何形状、材质、光照和相机。\n\
    - **形状**：JavaFX 提供了预定义的 3D 形状，如盒子、球体、圆体以及用于复杂几何形状的网格。\n- **材质**：材质定义了 3D 对象的表面属性，包括颜色、纹理和光照效果。\n\
    - **光照**：光照照亮场景并投射影子，为你的 3D 环境营造深度和真实感。\n- **相机**：相机定义了渲染 3D 场景的视角。你可以操作相机的位置和方向以获得不同的观察角度。\n\
    \n### JavaFX 3D 的优势\n\n- **跨平台兼容性**：JavaFX 3D 利用硬件加速，在各种操作系统上实现平滑渲染。\n- **声明式方法\
    \ (FXML)**：与普通 UI 元素类似，你可以在 FXML 中声明式地定义基础的 3D 场景结构。\n- **Scene Builder 集成**：JavaFX\
    \ 的视觉 UI 设计工具 Scene Builder 提供了基本的 3D 场景编辑能力。\n\n### JavaFX 3D 的局限性\n\n- **并非全功能\
    \ 3D 引擎**：虽然功能强大，但 JavaFX 3D 并非为高端、计算密集型的 3D 图形应用而设计。\n- **学习曲线**：与基础 UI 开发相比，理解\
    \ 3D 概念并有效使用 JavaFX 3D API 需要额外的学习。\n\n### 构建一个简单的 3D 场景\n\n以下是使用立方体和光源创建一个简单\
    \ 3D 场景的步骤：\n\n1. **创建 3D 节点**：实例化 `Box` 类对象来表示立方体。\n2. **定义材质**：创建一个 `Material`\
    \ 对象来定义立方体的表面颜色。\n3. **添加光照**：创建一个 `PointLight` 对象代表场景内的光源。\n4. **定位节点**：使用变换方法设置立方体和光在\
    \ 3D 空间中的位置。\n5. **创建相机（可选）**：定义一个 `PerspectiveCamera` 对象来指定渲染场景的视角。\n\n#### 示例代码\
    \ (JavaFX 类):\n\n```java\npublic class My3DApp extends Application {\n    @Override\n\
    \    public void start(Stage stage) throws Exception {\n        // 创建 3D 场景元素\
    \ (盒子、材质、光照)\n        Box cube = new Box(100, 100, 100);\n        Material material\
    \ = new PhongMaterial(Color.BLUE);\n        PointLight light = new PointLight(Color.WHITE);\n\
    \        light.setTranslateX(200);\n        light.setTranslateY(100);\n\n    \
    \    // 将节点添加到场景图\n        Group root = new Group();\n        root.getChildren().addAll(cube,\
    \ light);\n\n        // (可选) 设置相机位置\n        PerspectiveCamera camera = new PerspectiveCamera(false);\n\
    \        camera.setTranslateX(-200);\n        camera.setTranslateY(-200);\n  \
    \      camera.setTranslateZ(500);\n\n        // 创建场景并设置相机（如果已定义）\n        Scene\
    \ scene = new Scene(root, 600, 400);\n        scene.setCamera(camera);\n\n   \
    \     // 设置场景并显示阶段\n        stage.setScene(scene);\n        stage.show();\n  \
    \  }\n}\n```\n\n这段代码创建了一个由白色光源照亮的蓝色立方体 基础 3D 场景。在这里也定义了相机位置，但如果你喜欢默认视角，可以省略它。\n\
    \n## 更多资源和学习\n\n如需深入探索 JavaFX 3D 图形，请参阅以下资源：\n\n- **JavaFX 3D 文档**：探索官方文档以获取详细信息。\n\
    - **JavaFX 3D 教程**：探索在线教程获取实践学习体验。\n\n"
