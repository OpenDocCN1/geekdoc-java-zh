    \ (Timeline)**：创建动画的基础类。它定义了一个动画发生的时间轴，并允许你指定关键帧，关键帧代表动画在不同时间点的状态。\n- **关键帧 (KeyFrame)**：代表动画在时间轴上特定点的特定状态。你可以在关键帧内定义\
