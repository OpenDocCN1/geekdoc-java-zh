  \ JavaScript 中有对应的方法吗？**\n\n**答：有，但你可能不应该使用它。元素的 `className` 属性包含一个用空格分隔的类列表。你可以通过将新类名附加到该属性来添加类，例如\
  \ `obj.className += \" \" + newClass;`。移除 `className` 则更为困难，你需要使用正则表达式或者将字符串拆分、移除类然后重新构建。这些方法比\
  \ jQuery 风险大得多，因为你可能会破坏字符串，导致所有类失效。**\n\n**问：有办法旋转图像元素吗？**\n\n**答：在某些浏览器中可以。你可以使用\
  \ `transform` CSS 属性处理 Firefox 和 Chrome，使用 `filter` 属性处理 Internet Explorer。以下代码演示了如何使用\
  \ jQuery 在这些浏览器中旋转图像。**\n\n工作坊\n\n由一组问答组成，旨在巩固你对本节所涵盖内容的理解。在查看答案之前，请尝试回答这些问题。\n\n\
