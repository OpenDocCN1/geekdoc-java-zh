  \  position:fixed; right:60px; top:60px;\n}\n#content{\n  padding:2px;\n  color:blue;\n\
  \  font-size:20px;\n}\n```\n\n### 在网页上动态重新排列元素\n\n你可以与网页交互时实现的最酷的交互之一是根据用户交互重新排列元素。例如，你可以让元素变大或变小，或者改变它们的位置。这些内容在本节的第一部分中作为获取和设置元素属性时已经涵盖了。本节在这些概念的基础上进一步深入，讨论了使用\
  \ `z-index` 对页面元素进行定位的最后方法；然后你通过一个示例展示了重新排列元素的不同方法。\n\n#### 调整 z-index\n\n`z-index`\
  \ 是一个 CSS 属性，指定 HTML 元素相对于其他元素的位置，它不是垂直或水平方向，而是向用户投影的，就像屏幕上堆叠在另一个之上的纸张一样。当浏览器渲染页面时，`z-index`\
  \ 元素将显示在其他元素的上方。\n\n在 jQuery 中获取和设置 `z-index`，请使用 `.css()` 方法。例如，获取某个项目的 `z-index`，请使用以下代码：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar zIndex = $(\"#item\").css(\"z-index\");\n```\n\
  \n设置某个项目的 `z-index` 为 1，请使用以下代码：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#item\").css(\"\
  z-index\", \"1\");\n```\n\n### 尝试你自己：动态重新排列页面元素\n\n在这个示例中，你将学习如何使用 jQuery 移动、调整大小并重新排列元素。你可以将这些原理应用到任何元素。这个示例包含了以下\
  \ 10.7、10.8 和 10.9 文件：\n\n1. 创建 `rearranging_elements.html`、`rearranging_elements.js`\
  \ 和 `rearranging_elements.css` 文件。\n2. 在 10.7 文件中，创建 `<span>` 元素。\n3. 在 10.8 文件中，添加这些\
  \ `<span>` 元素的样式。\n4. 在 10.9 文件中定义全局变量：\n\n打开 `rearranging_elements.js` 文件，第 3-4\
  \ 行定义全局变量：\n\n```javascript\nvar startX = startY = 60;\nvar topIndex, maxIndex;\n\
  ```\n\n5. 添加以下 `load()` 函数。第 3-4 行设置当前的顶部索引和最大索引为文件数量减 1，使其基于零索引。然后第 6-12 行为每个按钮添加点击处理程序：\n\
  \n```javascript\n$(window).load(function(){\n  topIndex = $(\".photo\").length-1;\n\
  \  maxIndex = topIndex;\n  $(\"#right\").click(function(e){move(e, \"right\");});\n\
  \  $(\"#left\").click(function(e){move(e, \"left\");});\n  $(\"#bigger\").click(function(e){resize(e,\
  \ \"bigger\");});\n  $(\"#smaller\").click(function(e){resize(e, \"smaller\");});\n\
  \  $(\"#stack\").click(stack);\n  $(\"#tile\").click(tile);\n  $(\"#flip\").click(flip);\n\
  \  stack();\n});\n```\n\n### 注意\n\n你需要使用 `$(window).load()` 事件处理器而不是 `$(document).ready()`，以便在运行\
  \ `stack()` 之前图像已加载。\n\n6. 添加以下 resize 处理程序，它接收一个方向并使用该值通过调整 `width()` 方法来放大或缩小图像。注意\
  \ `topIndex` 变量被用于确定要调整哪个图像：\n\n```javascript\nfunction resize(e, direction){\n\
  \  var img = $(\"img:eq(\" + topIndex + \")\");\n  if (direction == \"bigger\"){\
  \ img.width(img.width()+20); }\n  else { img.width(img.width()-20); }\n}\n```\n\n\
  7. 添加以下 move 处理程序，根据方向参数调整元素的 `offset()` 向左或向右。同时 `startX` 和 `startY` 调整到新位置：\n\n\
  ```javascript\nfunction move(e, direction){\n  var img = $(\"img:eq(\" + topIndex\
  \ + \")\");\n  var pos = img.offset();\n  if (direction == \"right\"){ pos.left\
  \ += 10;}\n  else {pos.left -= 10;}\n  img.offset(pos);\n  startX = pos.left;\n\
  \  startY = pos.top;\n}\n```\n\n\n\n\n\n## 8. 添加以下 `stack()` 函数，该函数会遍历所有的 `.photo`\
  \ 元素并在每次迭代中通过调整 `top` 和 `left` 偏移值将它们进行堆叠：\n\n点击此处查看代码图片\n\n```javascript\nfunction\
  \ stack(){\n    var x = startX,  y = startY;\n    $(\".photo\").each(function(indx){\n\
  \      $(this).offset({ top:y, left:x });\n      x += 20;\n      y += 20;\n    });\n\
  }\n```\n\n## 9. 添加以下 `tile()` 函数，该函数同样遍历所有的 `.photo` 元素并将它们并排放置，如果当前组超过了 400 像素，则换到下一行。注意，我在每次迭代中使用了几个变量来跟踪最大高度以及当前的\
  \ `x` 和 `y` 坐标：\n\n点击此处查看代码图片\n\n```javascript\nfunction tile(){\n    var x = startX,\
  \ y = currTop = startY;\n    var maxH = 0;\n    $(\".photo\").each(function(indx){\n\
  \      maxH = Math.max(maxH, $(this).outerHeight());\n      $(this).offset({ top:y,\
  \ left:x });\n      x += $(this).outerWidth();\n      if (x > 400){\n        y =\
  \ currTop + maxH;\n        x = startX;\n        maxH = 0;\n      }\n    });\n}\n\
  ```\n\n## 10. 添加 `flip()` 函数，它将调整 `z-index`，以便当图像相互重叠时，你可以更改哪一个在上方：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction flip(){\n    topIndex++;\n    if (topIndex > $(\".photo\"\
  ).length-1){ topIndex=0; }\n    $(\".photo\").each(function(indx){\n      if (indx\
  \ <= topIndex){ z = maxIndex - (topIndex - indx); }\n      else { var z = indx -\
  \ topIndex - 1; }\n      $(this).css(\"z-index\", z);\n    });\n}\n```\n\n## 11.\
