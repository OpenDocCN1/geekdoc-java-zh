  \n### 将模型绑定到页面元素的指令\nAngularJS 模板允许你将作用域中的数据绑定到 HTML 元素中显示的内容。你可以通过多种方式将数据绑定到视图，包括以下方式：\n\
  \n![Image](img/image00767.jpeg)\n\n**值：** 你可以直接在作用域中表示表单元素的值。例如，文本输入可以是作用域中的 `String`\
  \ 变量，但复选框将由一个 `Boolean` 值表示。\n![Image](img/image00767.jpeg)\n\n**HTML：** 你可以使用如下表达式在元素的\
  \ HTML 输出中表示作用域中的数据值：\n`<p>{{myTitle}}</p>`\n![Image](img/image00767.jpeg)\n\n**属性：**\
  \ 通过使用如下表达式，HTML 属性的值可以反映作用域中的数据：点击此处查看代码图片\n`<a ng-href=\"/{{hash}}/index.html\"\
  >{{hash}}</a>`。\n![Image](img/image00767.jpeg)\n\n**可见性：** 元素的可见性可以反映视图中的作用域。例如，当基于表达式的结果为真时，元素是可见的。\n\
  ![Image](img/image00767.jpeg)\n\n**存在性：** 元素的存在性可以反映作用域。\n![Image](img/image00767.jpeg)\n\
