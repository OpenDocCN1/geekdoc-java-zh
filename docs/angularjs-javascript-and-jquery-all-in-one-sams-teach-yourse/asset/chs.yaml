  \   font-size: 1.5em;\n14   font-weight: bold;\n15 }\n```\n\n### 总结\n在本节中，你学习了使用\
  \ jQuery 查找和访问 DOM 元素。这对于动态操作它们至关重要。\n\n### 问答\n[Q] 我什么时候应该使用[getElementById()`\
  \ 而不是 `$(\"#\")`？\n[A] 你可能很少使用 `getElementById()`。唯一可能使用它的情况是你不想将 jQuery 库链接到你的\
  \ HTML 中。\n\n### 练习\n练习由问题和答案组成，旨在巩固你对本节内容的理解。在查看答案之前请尝试回答问题。\n\n#### 测\n[1] 如何将名为\
  \ `myDiv` 的 DOM 对象转换为 jQuery 对象？\n[2] 对或错：jQuery 选择器返回的是 DOM 元素的列表。\n[3] 如何判断一个对象是否是\
  \ jQuery 对象？\n[4] 如果你想获取所有 `class=\"heading\"` 的元素，应该使用什么 jQuery 选择器？\n[5] 获取 `<div>`\
  \ 元素的子元素 `<p>` 元素，应该使用什么 jQuery 选择器？\n[6] 如何获取 jQuery 对象所表示的 DOM 元素的 JavaScript\
  \ 数组？\n\n#### 测答案\n[1] 使用 `$(myDiv)` 创建一个以该 DOM 元素为唯一项的新 jQuery 对象。\n[2] 错。jQuery\
  \ 选择器返回的是一个包含一组 DOM 元素的 jQuery 对象。\n[3] 测试它是否设置了 `jquery` 属性。\n[4] `$(\".heading\"\
  )`\n[5] `$(div p)`\n[6] 在 jQuery 对象上使用 `get()` 方法。\n\n### 练习\n1. 为 `jquery_selectors.html`\
  \ 示例添加一个额外的按钮，用于选择列表中的第一个和最后一个项。你需要添加所需的 HTML 和 JavaScript 代码。\n\n\n\njQuery 对象提供了额外的功能，通过允许你轻松地精炼所代表的\
  \ DOM 元素列表、导航 DOM 树寻找其他元素以及操作 HTML 元素的值，增强了选择器的结果。以下章节将介绍如何将 jQuery 操作链在一起，以便高效地查找、过滤和遍历网页中的\
  \ DOM 元素。\n\n### 链式 jQuery 对象操作\n\njQuery 对象的强大之处之一是你可以将多个 jQuery 操作链成一个单一语句。每个连续的语句都将在链中上一个操作的结果上进行操作。这可以有助于减少并简化你的选择器，并减少\
  \ CSS 中所需的类（class）和 ID 定义。\n\n将链式 jQuery 操作的结果想象成一栈 jQuery 对象，其中每个对象代表一组 DOM 元素。链中的每个操作都会将一个\
  \ jQuery 对象放入栈中，但当前操作仅应用于栈顶的 jQuery 对象。\n\n为了帮助说明这一点，请考虑以下语句。代码首先找到具有 `id=\"content\"\
  ` 的 `<div>` 元素，然后找到其内部的第一个 `<p>` 元素并将 `font-weight` 改为 `bold`。然后，它找到 `<p>` 内部的 `<span>`\
  \ 元素并将 `color` 设置为 `red`：\n\n点击此处查看代码\n\n```\nvar $contentDiv = $(\"div#content\"\
  );\nvar $firstP = $contentDiv.children(\"p:first\");\n$firstP.css(\"font-weight\"\
  ,\"bold\");\nvar $spans = $firstP.children(\"span\");\n$spans.css(\"color\",\"red\"\
  );\n```\n\n前面的代码使用了五行来完成它的所有任务。而以下单行链式 jQuery 操作仅需一行就实现了相同的功能：\n\n点击此处查看代码\n\n```\n\
  $(\"div#content\").children(\"p:first\").css(\"font-weight\",\"bold\").children(\"\
  span\"). css(\"color\",\"red\");\n```\n\n由于每个操作都返回一个 jQuery 对象，因此你可以根据需要链接任意数量的\
  \ jQuery 操作。即使 `.css()` 操作设计用于修改 DOM 对象而不是查找它们，它仍然会返回相同的 jQuery 对象，因此你可以在结果上执行其他操作。\n\
  \n### 过滤 jQuery 对象的结果\n\njQuery 对象提供了一组良好的方法，允许你修改查询中所代表的 DOM 对象。当你尝试在 jQuery 选择器结果中精确定一组特定的元素时，减少结果是有帮助的。表\
  \ 8.1 提供了链式 jQuery 选择器的一些示例。\n\n![图像](img/image00878.jpeg)\n\n**表 8.1 过滤所代表的 DOM\
  \ 元素的 jQuery 对象方法及示例**\n\n***\n\n提示\n\n与 CSS 选择器相同的 jQuery 选择器能够使用原生 DOM 方法 `querySelectorAll()`，该方法在\
  \ DOM 对象上具有一些高级优化。其他 jQuery 选择器无法利用该优化，因此最好先使用基于 CSS 的选择器，然后将过滤器作为链式选择器添加。例如，与其使用\
  \ `$(\"div:animated\")`，不如你应该使用 `$(\"div\").filter(\":animated\")`：[`api.jquery.com/category/selectors/jquery-selector-extensions/`](http://api.jquery.com/category/selectors/jquery-selector-extensions/)\n\
  \n***\n\n### 使用 jQuery 对象遍历 DOM\n\n附加到 jQuery 对象的另一组重要方法是 DOM 遍历方法。DOM 遍历允许你根据元素与其他元素之间的关系来选择元素。\n\
  \nDOM 有时被称为 DOM 树，因为它是以树结构组织的，以文档为根，节点可以同时具有父元素、兄弟元素和子元素。为了更好地视觉化，请查看以下 HTML 代码：\n\
  \n```html\n<<body>\n  <div>\n    <p>Paragraph 1</p>\n    <p>Paragraph 2</p>\n  \
  \  <ul>\n      <li>Item 1</li>\n      <li>Item 2</li>\n    </ul>\n  </div>\n</body>\n\
  ```\n\n`<p>` 元素和 `<ul>` 元素是它们彼此的兄弟元素，并且它们都是 `<div>` 元素的子元素。`<div>` 元素是 `<p>` 和 `<ul>`\
  \ 元素的父元素，而 `<ul>` 元素是 `<li>` 元素的父元素，依此类推。\n\njQuery DOM 遍历方法允许你从 DOM 的某一层移动到另一层以选择元素——例如，如果你想访问所有作为\
  \ `<div>` 元素子元素的 `<p>` 元素，或者如果你想找到作为 `<input>` 元素兄弟的 `<label>` 元素。\n\njQuery 对象提供了一组惊不起的方法，允许你以几乎无法数的方法遍历\
  \ DOM，因为它允许你使用 jQuery 对象中当前的 DOM 元素选择来选择树中的其他 DOM 元素。表 8.2 列出了你可以用于遍历 DOM 的方法。\n\
  \n![图像](img/image00879.jpeg)![图像](img/image00880.jpeg)![图像](img/image00881.jpeg)![图像](img/image00882.jpeg)\n\
  \n**表 8.2 允许你遍历元素的 jQuery 对象方法及示例**\n\n### 查看一些额外方法\n\n在使用遍历 DOM 的 jQuery 方法的函数时，你应该注意某些方法。表\
  \ 8.3 列出了你随着代码变得自然而会频繁使用的方法。\n\n![图像](img/image0083.jpeg)![图像](img/image0084.jpeg)\n\
  \n**表 8.3 允许你处理对象的额外方法及示例**\n\n***\n\n注意\n\n在使用遍历 DOM 的函数时，你可以使用 `this` 关键字来访问正在迭代的元素。这是一个\
  \ DOM 对象，而不是 jQuery 对象。如果你需要 jQuery 格式，请使用 `$(this)`。但请记住，构建格式需要一些工作。\n\n***\n\n\
  #### 使用 .each()\n\n`.each(function)` 方法最重要的 jQuery 方法之一，因为它允许你遍历集合中的所有元素并对它们单独执行操作。这与仅对所有项目执行相同的操作不同。\n\
  \n`.each()` 方法允许你指定一个在 jQuery 对象的每个元素上运行的函数。该函数将索引数字作为第一个参数。在函数内部，`this` 变量指向当前的\
  \ DOM 元素。\n\n以下代码说明了 `.each()`。它遍历所有元素并设置内容，包括元素的索引号：\n\n点击此处查看代码\n\n```javascript\n\
  $(\"p\").each(function (idx){\n  $(this).html(\"This is paragraph \" + idx);\n});\n\
  ```\n\n注意 `idx` 作为索引传入；第一个 `<p>` 元素为 0，第二个为 1，依此类推。还要注意 `this` 已通过 `$(this)` 转换为\
  \ jQuery 对象，以便调用 `.html()` 方法。\n\n#### 使用 .map()\n\n`.map(function)` 方法同样遍历 jQuery\
  \ 对象集合中的每个元素。虽然与 `.each()` 非常相似，但有一个巨大的区别，即 `.each()` 将返回相同的 jQuery 对象，而 `.map()`\
  \ 将返回一个包含每次迭代返回值的新的 jQuery 对象。\n\n\n\n\n\n```javascript\nvar liValues = $(\"li\"\
  ).map(function (idx){\n    return $(this).html();\n}).get().join(\",\");\n```\n\
  注意，在每次迭代中，该函数都会返回 `<li>` 元素中的 HTML 内容。你调用 `.get()` 将 `.map()` 返回的新型 jQuery 对象转换为\
  \ JavaScript 数组版本，然后对该数组调用 `.join(\",\")` 以构建成一个以逗号分隔的字符串。\n\n***\n\n## 尝试自己动手：使用\
  \ jQuery 的 .map() 和 .each() 方法来导航、访问和操作 DOM 元素\n\n在本示例中，你将学习如何使用 jQuery 选择器找到所有段落元素（`<p>`）的过程。然后，你使用\
