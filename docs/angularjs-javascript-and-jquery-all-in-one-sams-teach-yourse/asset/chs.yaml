  ## 动手尝试：使用 jQuery 和 JavaScript 创建动态页面\n\n现在你已经创建了项目和一个可以运行的 Web 服务器，准备好创建动态页面了。在本节中，按照以下步骤创建一个简单的动态页面。完成后，你将拥有基于\
  \ HTML 并通过 jQuery 和 JavaScript 进行交互的动态页面。\n\n***\n\n注意\n书中的所有示例图像和代码文件都可以从 Github\
  \ 下载。\n\n***\n\n### 添加 HTML\n\n第一步是创建一个可以样式化和操作的 HTML 元素的简单网页。使用以下步骤创建基础 HTML 文档：\n\
  \n1. 在你的项目中创建一个名为 `lesson01` 的文件夹。\n2. 右键点击你创建的 `lesson01` 文件夹。\n3. 从弹出菜单中选择 New,\
  \ File（新建文件）。\n4. 将文件命名为 `first.html` 并点击 OK。为你打开一个空白文档。\n5. 输入以下 HTML 代码。如果你不熟悉\
  \ HTML，不用担心，稍后你会学到足够的知识：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n\
  \    <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\" />\n\
  \  </head>\n  <body>\n    <span>Click Me</span>\n  </body>\n</html>\n```\n\n6. 保存文件。\n\
  7. 在浏览器中打开以下 URL，你应该能看到“Click Me”字样：\n\n点击此处查看代码图像\n\n`http://localhost/lesson01/first.html`\n\
  \n好了。所有的基础 HTML 元素现在已就位。在下一节中，我们将样式化 <span> 元素，让 Click Me 看起来更像一个按钮。\n\n### 添加 CSS\n\
  \n浏览器渲染的简单文本非常单调，可以通过添加 CSS 样式快速解决。在本节中，你使用 CSS 让文本看起来更像一个按钮。\n\n使用以下步骤为 <span>\
  \ 元素添加 CSS 样式。作为参考，你在这些步骤中进行的样式更改将在 Listing 1.6 的最后的脚本所示：\n\n1. 在网页的 `<head>` 标签内添加以下代码，包含适用于所有\
  \ <span> 元素的 CSS `<style>` 元素：\n\n```html\n<style>\n  span{\n}\n</style>\n```\n\n\
  2. 为 span 样式添加以下属性设置，将文本背景改为深蓝色：\n`background-color: #0000FF;`\n\n3. 为 span 样式添加以下属性设置，将颜色改为白色并将字体加粗：\n\
  `color: #FFFFFF;`\n`font-weight: bold;`\n\n4. 为 span 样式添加以下属性设置，在文本周围添加边框：\n`border:\
  \ 1px solid #000000;`\n\n5. 为 span 样式添加以下属性设置，设置绝对位置：\n`position: absolute;`\n\n\
  6. 保存文件。\n7. 在浏览器中打开以下 URL，你应该能看到“Click Me”文本，如图图 1.12 所示：\n\n`http://localhost/lesson01/first.html`\n\
  \n![Image](img/image0077.jpeg)\n\n**图 1.12** 在 Eclipse 中运行 JavaScript 应用程序。\n\n\
  ### 编写脚本\n\n现在 HTML 已经按照你想要的方式样式化，你可以开始添加动态交互了。在本节中，你将 jQuery 添加到你的中：\n\n1. 修改 <span>\
  \ 元素以包含一个 `id`，以便你可以引用它，并为 `mouseover` 事件添加一个处理器：\n\n```html\n<span id=\"elusiveText\"\
  \ onmouseover=\"moveIt()\">Click Me</span>\n```\n\n2. 在 `<head>` 中添加以下代码行，它从托管源加载\
  \ jQuery 库：\n\n```html\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n```\n\n3. 在 `<head>` 中添加以下 JavaScript 函数。该函数创建一个从 10 到 350 的坐标值数组，然后在每次鼠标悬停在它上时，随机设置\
  \ span 的 `top` 和 `left` CSS 属性：\n\n```javascript\nfunction moveIt() {\n  var coords\
  \ = new Array(10,50,100,130,175,225,260,300,320,350);\n  var x = coords[Math.floor(Math.random()*10)];\n\
  \  var y = coords[Math.floor(Math.random()*10)];\n  $(\"#elusiveText\").css({\"\
  top\": y + \"px\", \"left\": x + \"px\"});\n}\n```\n\n4. 保存文件。\n5. 在浏览器中打开以下 URL，你应该能看到样式化的文本\
  \ Click Me，如图图 1.13 所示：\n\n`http://localhost/lesson01/first.html`\n\n6. 现在尝试点击 Click\
  \ Me 按钮。按钮会在每次鼠标悬停在它上时移动，导致你无法点击它。\n7. 找一个让你讨厌的人，并让他们点击这个按钮。\n\n\n\n\n\n```html\n\
  <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\n<script>\n\
  \  function moveIt(){\n    var coords = new Array(10,50,100,130,175,225,260,300,320,350);\n\
  \    var x = coords[Math.floor((Math.random()*10))];\n    var y = coords[Math.floor((Math.random()*10))];\n\
  \    $(\"#elusiveText\").css({\"top\": x + \"px\", \"left\": y + \"px\"})\n  }\n\
  </script>\n<style>\n  span{\n    background-color: #0066AA;\n    color: #FFFFFF;\n\
  \    font-weight: bold;\n    border-color: #C0C0C0;\n    border:2px solid;\n   \
  \ border-radius:5px;\n    padding: 3px;\n    position:absolute;\n    top:150px;\n\
  \    left:100px;\n  }\n</style>\n</head>\n<body>\n  <span id=\"elusiveText\" onmouseover=\"\
  moveIt()\">Click Me</span>\n</body>\n</html>\n```html\n```\n\n***\n\n### 总结\n\n\
  在本节中，你学习了 Web 服务器与浏览器之间通信的基础知识。你学习了 `GET` 和 `POST` 请求之间的区别，以及服务器端脚本和客户端脚本的作用。你还学习了\
  \ `DOM` 以及浏览器如何利用它来渲染显示给用户的网页。\n\n你已经建立了一个良好的 Web 开发环境并创建了你的第一个项目。作为创建第一个项目的一部分，你创建了一个结合了\
  \ HTML、CSS、jQuery 和 JavaScript 的动态网页。\n\n### 问答\n\n**Q. 客户端脚本和服务器端脚本哪个更好？**\n\n\
  **A.** 这很大程度上取决于你想实现什么目标。有些人认为只有一种方法是可行的，但实际上，通常是两者的结合才能提供最佳方案。可以遵循的良好规则是：如果与数据的交互基于用户交互（如鼠标点击），则使用客户端脚本；如果数据的验证或错误处理需要与服务器交互，则使用服务器端脚本。\n\
  \n**Q. 为什么所有的浏览器处理 JavaScript 的方式不同？**\n\n**A.** 为了渲染 HTML 并与 JavaScript 交互，浏览器使用引擎来解析来自服务器的数据、构建对象，然后将其输入图形渲染引擎并写在屏幕上。由于由于种浏览器使用的引擎不同，因此它们对脚本的解释方式略有不同，特别是对于尚未尚未标准化的边缘元素。如果你想支持所有浏览器，需要在每个浏览器中测试你的网页，以验证它们是否运行正常。\n\
  \n### 工作坊\n\n该工作坊由一组问题和答案组成，旨在巩固你对本节内容的理解。在查看答案之前，请尝试回答这些问题。\n\n### 测验\n\n**1.**\
  \ 你会向 Web 服务器发送 `GET` 还是 `POST` 请求来打开网页？\n\n**2.** 哪种脚本可以访问浏览器鼠标事件：服务器端还是客户端？\n\n\
  **3.** 正确或错误：JavaScript 是默认开启的。\n\n**4.** 哪种类型的脚本最适合调试 JavaScript？\n\n### 测验答案\n\
  \n**1.** `GET`\n\n**2.** 客户端 \n\n**3.** 正确\n\n**4.** 客户端\n\n\n\n\n\n注意在图 2.1 中的消息部分，有两种类型的消息。一种是日志语句（log\
  \ statement），另一种是错误。两者在右侧都显示行号。点击行号，将直接跳转到代码处。\n\n注意在错误消息中，顶部文本部分指向发生的错误，底部显示实际的\
  \ JavaScript 行。这在调试时非常有用，因为你通常可以通过查看错误和单行代码来发现问题。\n\n***\n\n### 动手尝试：使用 JavaScript\
