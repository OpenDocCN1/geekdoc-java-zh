  <script>\n    function writeIt(){\n        ...\n    }\n</script>\n</head>\n<body\
  \ onload=\"writeIt()\">\n```\n4. 添加以下 JavaScript 函数，它接收一个消息和一个数组参数作为 `msg` 和 `arr`。数组使用\
