  ></script>\n\n***\n\n## 顺带一提\n\n如果你决定在 `AngularJS` 中使用完整版本的 `jQuery`，请确保在 HTML 中将\
  \ `jQuery` 库的`<script>`标签加载在 `AngularJS` 库的`<script>`标签之前。否则，`AngularJS` 将无法正确绑定到\
  \ `jQuery` 库。\n\n***\n\n无论加载的是 `jQuery` 精量版还是完整的 `jQuery` 库，在 `AngularJS` 代码中通过\
  \ `AngularJS` 启动时可用的 `angular` 变量的`element`属性来访问 `jQuery`。本质上，`angular.element`\
  \ 是 `jQuery` 应用中常用的 `jQuery` 变量的别名。描述这种关系的最佳方式如下：\n\n点击此处查看代码图片\n\n```\nangular.element()\
  \ === jQuery() === $()\n```\n\n通常情况下，你会在 `AngularJS` 为你创建的 `jQuery` 对象中使用 `jQuery`\
  \ 或 `jQuery` 精量版的功能。\n\n例如，当你像本书稍后讨论的那样在 `AngularJS` 中创建一个指令时，一个元素会被传递给 `link` 函数。如此处所示，该元素是一个\
  \ `jQuery` 或 `jQuery` 精量版对象，你可以相应地使用 `jQuery` 功能：\n\n点击此处查看代码图片\n\n```javascript\n\
  angular.module('myApp', [])\n  .directive('myDirective', function() {\n      . .\
  \ .\n      link: function(scope, elem, attrs, photosControl) {\n        //elem 是一个\
  \ jQuery 精量对象\n        elem.addClass(...);\n      }\n  });\n```\n\n访问 `jQuery` 功能的另一个示例是从在\
  \ `AngularJS` 绑定上触发的事件。例如，考虑以下代码，它使用 `ngClick` 绑定将`<div>`元素上的浏览器点击事件绑定到 `AngularJS`\
  \ 代码中的 `clicked()` 函数：\n\n点击此处查看代码图片\n\n```html\n<div ng-click=\"clicked($event)\"\
  >Click Me</div></div>\n```\n\n你可以使用以下 `AngularJS` 代码访问对象的 `jQuery` 版本：\n\n点击此处查看代码图片\n\
  \n```javascript\n$scope.clicked = function(event){\n  var jQueryElement = angular.element(event.target);\n\
  };\n```\n\n注意，有必要使用 `angular.element()` 方法将 `target` DOM 对象转换为 `jQuery` 对象。\n\n\
  ### 总结\n\n`AngularJS` 是一个 JavaScript 库框架，为创建网站和 Web 应用程序提供了非常结构化的方法。`AngularJS`\
  \ 将 Web 应用程序结构化非常清晰的 MVC 风格方法。`AngularJS` 作用域（scopes）为应用程序的数据模型提供上下文绑定，并由基础 JavaScript\
  \ 对象组成。`AngularJS` 利用带有指令的模板来扩展 HTML 的功能，使你能够实现完全自定义的 HTML 组件。\n\n在本节中，你查看了 `AngularJS`\
  \ 应用中不同的组件以及它们是如何相互作用的。你还学习了 `AngularJS` 应用的生命周期，涉及启动（bootstrap）、编译（compilation）和运行（runtime）阶段。在本节结束时，你完成了一个实现基础\
  \ `AngularJS` 应用的逐步示例，包括模板、模块、控制器和作用域。\n\n### 问与答\n\n**Q. 我可以去哪里学习更多关于开发 `AngularJS`\
  \ 应用的内容？**\n\n**A.**  [`docs.angularjs.org/guide`](https://docs.angularjs.org/guide)\
  \ 的 `AngularJS` 开发者指南提供了 `AngularJS` 开发主题的良好资源。\n\n**Q. 有方法构建 `AngularJS` 应用的端到端测试吗？**\n\
  \n**A.** 你可以使用 Node.js 程序 `Protractor` 来运行端到端测试。在开发者指南的 [`docs.angularjs.org/guide/e2e-testing`](https://docs.angularjs.org/guide/e2e-testing)\
  \ 中有相关描述。\n\n### 工作坊\n\n工作坊由一组问答组成，旨在巩固你对本小时涵盖内容的理解。请在看答案之前尝试回答这些问题。\n\n### 测验\n\
  \n**1.** 使用完整版本的 `jQuery` 时，`jQuery` 库应该在 `AngularJS` 库之前还是之后加载？**\n\n**2.** `AngularJS`\
  \ 生命周期的三个阶段是什么？**\n\n**3.** 全局 API 何时可用？**\n\n**4.** 哪个 `AngularJS` 指令用于在 HTML 文件中启动\
  \ `AngularJS` 应用？**\n\n### 测验答案\n\n**1.** 在 `AngularJS` 库之前加载。\n\n**2.** 启动（bootstrap）、编译（compilation）和运行（runtime）。\n\
  \n**3.** 启动（bootstrap）之后。\n\n**4.** `ng-app`。\n\n### 练习\n\n**1.** 访问 [`docs.angularjs.org/api`](https://docs.angularjs.org/api)\
  \ 查看 `AngularJS` 文档，并回顾 `angular.copy` 和 `angular.element` 等全局函数。\n\n**2.** 通过 [`code.angularjs.org/`](https://code.angularjs.org/)\
  \ 获取 `AngularJS` 版本的索引。\n\n## 第 21 ：理解 AngularJS 动态机制\n\n在本节中将学习：\n\n![Image(Images/00767.jpeg)\
  \ `AngularJS` 如何使用依赖注入\n\n![Image(Images/00767.jpeg) 如何在 `AngularJS` 中创建依赖提供\n\n\
  ![Image(Images/00767.jpeg) `AngularJS` 应用中配置块（configuration block）的用途\n\n![Image(Images/00767.jpeg)\
  \ `AngularJS` 应用中运行块（run block）的用途\n\n理解 `AngularJS` 最重要的方面之一是依赖注入以及它与模块的关系。依赖是许多服务器端语言中的共同概念，但在\
  \ `AngularJS` 之前并没有被大量实现。\n\n依赖注入允许 `AngularJS` 模块在保持非常整洁、组织良好的同时，更容易地访问其他模块的功能。当正确实现时，它通常会减少大量的代码。\n\
  \n本节提供了依赖注入的基本概述，然后描述了如何创建功能的模块，以及如何在其他模块以及其他控制器中使用这些功能。\n\n### 查看模块和依赖注入\n\n当你开始编写\
  \ `AngularJS` 应用时，理解模块和依赖注入的基础知识至关重要。对于一些习惯于开放式 JavaScript 背景的人来说，这个概念可能很难理解和实现。\n\
  \n了解模块如何利用依赖注入访问其他模块的功能，将使你能够实现你的代码。\n\n\n\n\n依赖注入（Dependency injection）可能是一个难以理解的概念。然而，它是\
  \ AngularJS 中非常重要的一部分，在你理解了基础知识后，AngularJS 的实现就会变得非常清晰。依赖注入是大多数服务器端语言中一种的设计模式，但在\
  \ AngularJS 之前，它尚未广泛应用于 JavaScript 框架。\n\nAngularJS 依赖注入的思想定义并将依赖对象动态地注入到另一个对象中，使得依赖对象提供的所有功能可用。\n\
  \n我喜欢用来类比依赖注入的例子是虚拟房间。如果你只是想创建一个虚拟房间，你只需要定义四面墙、地板和天花板作为基础。然而，这个房间对于大多数用途来说功能性并不强。如果你想让房间变成餐厅，你需要桌子和餐椅；如果你想让它变成客厅，你可能需要沙发和电视。\n\
  \n因此，在虚拟世界中，你会定义一种创建沙发、餐椅、餐桌、电视、灯、画、边几等的方法。请记住，这仅仅是创建这些对象的方法，而不是沙发或桌对象的实际实例。\n\n\
  然后，依赖注入允许你通过声明在创建房间时应该注入哪些类型的对象，来轻松地定义你可能任何类型的房间。\n\n例如，你可以定义类似 `LivingRoom` 等于\
  \ `[sofa, table, TV]` 并注入到 `Room` 中。这只是一个定义，在你创建实例 `LivingRoom` 之前，并没有 `Room`、`sofa`、`table`\
  \ 或 `TV` 的实例；此时，`sofa`、`table` 和 `TV` 对象将被创建并自动注入到新创建的 `LivingRoom` 中，为你提供坐下看虚拟电影时所需的客厅功能。\n\
  \nAngularJS 通过使用提供者（providers）和注入器服务（injector service）提供了依赖注入。提供者定义了如何创建具有某些功能的可注入对象。注入器服务创建可注入对象的实例，并使其在使用它们的新创建对象可用。\n\
  \n## 提供者 (Providers)\n\n提供者本质上是如何创建一个具有所有必要功能的对象实例的定义。提供者应该定义为 AngularJS 模块的一部分。模块将提供者注册到注入器服务器。在\
  \ AngularJS 中，提供者的对象始终只会被实例。\n\n## 注入器 (Injectors)\n\n注入器服务负责跟踪提供者对象的实例。为每个注册了提供者的模块都会创建一个注入器服务实例。\n\
  \n当创建一个需要提供者的对象时，会针对提供者对象的实例发出一个依赖请求。注入器服务首先检查注入器缓存中是否已存在实例。如果是，则返回该实例。如果在缓存中没有找到实例，则将使用提供者定义创建一个新实例；将其存储在缓存中，然后返回。\n\
  \n## 定义 AngularJS 模块对象\n\n创建 AngularJS 模块是一个简单的过程，涉及调用 `angular.module()` 方法。该方法创建一个\
  \ `Module` 对象的实例，将其注册到注入器服务，然后返回新创建的 `Module` 对象的实例，你可以使用该实例来实现提供者功能。`angular.module()`\
  \ 方法使用以下语法：\n\n点击此处查看代码图片\n\n```\nangular.module(name, [requires], [configFn])\n\
  ```\n\n`name` 参数是模块在注入器服务中注册的名称。`requires` 参数是一个模块名称的数组，这些模块被添加到注入器服务中供该模块使用。如果你需要来自另一个模块的功能，你需要在\
  \ `requires` 列表中添加它。默认情况下，`ng` 模块会自动添加到每个实例模块中，因此你不需要在列表中显式指定 `ng` 即可访问 AngularJS\
  \ 提供者。\n\n所有依赖的实例都会自动注入到模块实例中。依赖可以是模块、服务以及注册在注入器服务中的任何其他对象。`configFn` 参数是另一个在模块配置阶段调用的函数。配置函数将在下一节中描述。\n\
  \n以下是一个创建一个依赖 `$window` 和 `$http` 服务的 AngularJS 模块的示例。该定义还包含一个添加名为 `myValue` 的 `value`\
  \ 提供者的配置函数：\n\n点击此处查看代码图片\n\n```javascript\nvar myModule = angular.module('myModule',\
  \ ['$window', '$http'], function(){\n    $provide.value('myValue', 'Some Value');\n\
  });\n```\n\n如果你没有指定 `requires` 参数，返回的将不是一个新的 `Module` 对象，而是已经创建的实例。例如，以下代码覆盖了之前定义的实例：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar myModule2 = angular.module('myModule', []);\n\
  ```\n\n然而，以下代码返回了之前创建的实例，因为参数列表中的 `require` 数组中没有列出依赖：\n\n点击此处查看代码图片\n\n```javascript\n\
  var myModule3 = angular.module('myModule');\n```\n\n## 在 AngularJS 模块中创建提供者\n\n\
  AngularJS 为各种对象和服务提供了许多内置提供者。例如，`$window` 服务有一个提供者，用于构建 AngularJS 服务对象，使你能够与 JavaScript\
  \ 底层的 `Window` 对象进行交互。除了这些提供者，你还可以创建自己的提供者，将功能注入到 AngularJS 组件中。\n\n`Module` 对象提供了几个辅助方法，作为使用\
  \ `config()` 方法的替代方案来添加提供者。这些方法更简单，代码也更清晰。你可以向 AngularJS 模块添加两种类型的提供者对象。这些方法接受两个参数：注册到依赖注入器的名称以及定义如何构建特定对象的器函数。后续章节将详细介绍这些方法。\n\
  \n### 特殊 AngularJS 对象提供者\n\n`Module` 对象提供了特殊的构造方法，用于为模块中需要实现的 AngularJS 对象添加提供者。这些特殊方法允许你为以下类型的对象添加定义：\n\
  \n图片 `animation(name, animationFactory)`\n\n图片 `controller(`name`,` controllerFactory`)`\n\
  \n图片 `filter(`name`,` filterFactory`)`\n\n图片 `directive(name, directiveFactory)`\n\
  \n之所以称为特殊方法，是因为 AngularJS 中为这些提供者方法了对应的 `animation`、`controller`、`filter` 和 `directive`\
  \ 对象。\n\n这些每个对象将在后的课程中进行详细介绍。现在，快速看一下基础控制器的定义：\n\n点击此处查看代码图片\n\n```javascript\n\
  var mod = angular.module('myMod', []);\n\nmod.controller('myController', function($scope)\
  \ {\n    $scope.someValue = 'Some Value';\n});\n```\n\n创建了一个名为 `mod` 的简单模块，然后调用\
  \ `controller()` 方法并传入了 `myController` 以及 `controllerFactory` 函数。`controllerFactory`\
  \ 函数接收 `$scope` 变量作为参数。这是因为 AngularJS 有一个内置的控制器对象，并且知道所有控制器对象必须接收作用域对象作为第一个参数。\n\
  \n\n\n\n服务者（Service providers）是一个独特的提供者类别，因为对于生成的提供者对象并没有特定的格式。相反，提供者作为一种服务来提供功能。AngularJS\
  \ 提供了一些构建服务的特定创建方法，并通过以下方法将它们暴露：\n\n![Image](img/image00767.jpeg) `value(name, object)`：这是所有提供者中最基本的。`object`\
  \ 参数被直接赋值给 `name`，因此在注入器（injector）中 `name` 值和 `object` 值之间存在直接对应关系。\n\n![Image](img/image00767.jpeg)\
  \ `constant(name, object)`：这与 `value()` 方法类似，但值是不可变的。此外，`constant()` 方法在其他提供者方法之前应用。\n\
  \n![Image](img/image00767.jpeg) `factory(name, factoryFunction)`：此方法使用 `factoryFunction`\
  \ 参数来构建一个由注入器提供的对象。\n\n![Image](img/image00767.jpeg) `service(name, serviceFactory)`：此方法为提供者对象增加了实现更面向对象方法的概念。AngularJS\
  \ 的许多内置功能都是通过服务提供者提供的。\n\n![Image](img/image00767.jpeg) `provider(name, providerFactory)`：这是所有其他方法的核心。虽然它提供了最多的功能，但并不频繁使用，因为其他方法更简单。\n\
  \n后面的课程将更详细介绍这些对象。现在，这里有一些基础 `value` 和 `constant` 定义的快速示例：\n\n点击此处查看代码图像\n\n```\n\
  var mod = angular.module('myMod', []);\n\nmod.constant(\"cID\", \"ABC\");\n\nmod.value('counter',\
  \ 0);\n\nmod.value('image', {name:'box.jpg', height:12, width:20});\n```\n\n创建了一个名为\
  \ `mod` 的简单模块，然后定义了 `constant()` 和两个 `value()` 提供者。在这些方法中定义的值注册在 `myMod` 模块的注入器服务器中，然后可以通过名称进行访问。\n\
  \n### 实现提供者和依赖注入\n\n在定义模块和适当的提供者之后，你可以将该模块作为依赖添加到其他模块、控制器以及各种 AngularJS 对象中。你可以设置依赖于提供者的对象的\
  \ `$inject` 属性值。`$inject` 属性包含一个应该注入到它的提供者名称数组。\n\n例如，下面的代码定义了一个接受 `$scope` 和 `appMsg`\
  \ 参数的基础控制器。然后，将 `$inject` 属性设置为一个包含 `$scope` 的数组，`$scope` 是 AngularJS 作用域服务，提供对作用域和自定义\
  \ `appMsg` 的访问。`$scope` 和 `appMsg` 都被注入到 `myController` 函数中：\n\n点击此处查看代码图像\n\n```\n\
  var myController = function($scope, appMsg) {\n\n  $scope.message = appMsg;\n};\n\
  \ncontroller['$inject'] = ['$scope', 'appMsg'];\n\nmyApp.myController('controllerA',\
  \ controller);\n```\n\n在实现某些对象时，这种方法可能会变得笨拙，因此 AngularJS 还提供了一种更优雅的方法来注入依赖项，使用以下语法代替常规的构造函数：\n\
  \n点击此处查看代码图像\n\n```\n[providerA, providerB, . . ., function(objectA, objectB, .\
  \ . .) {} ]\n```\n\n例如，前面的代码也可以这样写：\n\n点击此处查看代码图像\n\n```\nmyApp.controller('controllerA',\
  \ ['$scope', 'appMsg', function($scope, appMsg) {\n\n  $scope.message = appMsg;\n\
  \n}]);\n```\n\n在继续之前，理解依赖注入是至关重要的，因此接下来的章节提供了在 AngularJS 中实现依赖注入的示例列表。\n\n***\n\n\
  ### 尝试一下：将内置提供者注入到控制器中\n\n在本节中，你将学习如何将 AngularJS 内置的一些提供者注入到你的控制器中。列表 21.1 所示的代码实现了一个被注入了\
  \ `$scope` 和 `$window` 提供者的基础控制器。列表 22.2 中的代码显示了加载 AngularJS 应用程序的 HTML 模板。\n\n\
  以下描述了使用依赖注入将 AngularJS 提供者的功能添加到控制器的中的重要方面：\n\n**1.** 添加 `lesson21/inject_builtin.html`\
  \ 和 `lesson21/js/inject_builtin.js` 文件。\n\n**2.** 将 列表 21.1 和 列表 21.2 所示的代码添加到 HTML\
  \ 和 JavaScript 文件中。\n\n**3.** 下面的代码定义了一个使用 AngularJS 内置的 `$scope` 和 `$window` 提供者的控制器。注意，在\
  \ `function()` 定义中，参数名也是 `$scope` 和 `$window`。这并不是必要的，但它可能会让代码更容易跟读：\n\n点击此处查看代码图像\n\
  \n```\n02 mod.controller('controllerA', '$scope', '$window',\n```\n\n**4.** [列表\
  \ 21.1 中的以下行代码使用 `$scope` 创建的 `$scope` 对象在作用域中设置一个值：\n\n点击此处查看代码图像\n\n```\n04 $scope.message\
  \ = \"My Loaded!\";\n```\n\n**5.** 列表 21.2 中的以下行使用注入到控制器的 `$window` 显示警报：\n\n```\n\
  05 $window.alert($scope.message);\n```\n\n**6.** 当你在浏览器中加载 `inject_builtin.html`\
  \ 时，你应该看到一个类似于 图 21.1 的页面，显示了结果。\n\n![Image](img/image0794.jpeg)\n\n**列表 21.1 inject_builtin.js\
  \ 实现内置服务**\n\n点击此处查看代码图像\n\n```\n01 var mod = angular.module('myMod', []);\n\n02\
  \ mod.controller('controllerA', ['$scope', '$window',\n\n03               function($scope,\
  \ $window) {\n\n04  $scope.message = \"My Loaded!\";\n\n05  $window.alert($scope.message);\n\
  \n06 }]);\n```\n\n**列表 21.2 inject_builtin.html 使用 HTML 代码实现 AngularJS**\n\n点击此处查看代码图像\n\
  \n```html\n01 <!doctype html>\n02 <html ng-app=\"myMod\">\n03  <head>\n04    <title>AngularJS\
  \ Dependency Injection</title>\n05  </head>\n06  <body>\n07    <div ng-controller=\"\
  controllerA\">\n08         <h2>This Page has an Alert</h2>\n09     </div><hr>\n\
  10    <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n\
  11    <script src=\"js/inject_builtin.js\"></script>\n12 </body>\n13 </html>\n```\n\
  \n\n\n\n### 3. 下行代码定义了 `myMod` 模块：\n\n点击此处查看代码图片\n\n```javascript\n01 var myMod\
  \ = angular.module('myMod', []);\n```\n\n### 4. 下行代码为 `myMod` 定义了一个名为 `modMsg` 的值提供者（value\
  \ provider），它包含一个简单的字符串：\n\n点击此处查看代码图片\n\n```javascript\n02 myMod.value('modMsg',\
  \ 'Hello from My Module');\n```\n\n### 5. 下几行代码定义了 `controllerB`并将 `$scope` 和 `modMsg`\
  \ 提供者注入其中，然后设置将在模板中显示的 `message` 值：\n\n点击此处查看代码图片\n\n```javascript\n03 myMod.controller('controllerB',\
  \ ['$scope', 'modMsg',\n04                               function($scope, msg) {\n\
  05    $scope.message = msg;\n06 }]);\n```\n\n### 6. 然后，下行代码定义了 `myApp`，并将 `myMod`\
  \ 作为可注入的提供者。其余行与前面步骤中定义的 `value` 提供者和控制定义类似：\n\n点击此处查看代码图片\n\n```javascript\n07\
  \ var myApp = angular.module('myApp', ['myMod']);\n```\n\n### 7. 注意列表 21.4 中的以下几行，只有\
  \ `myApp` 模块被引导（bootstrapped），但 `myMod` 中的 `controllerB` 能够被使用，因为它被注入到了 `myApp`：\n\
  \n点击此处查看代码图片\n\n```html\n02 <html ng-app=\"myApp\">\n. . .\n07      <div ng-controller=\"\
  controllerA\">\n. . .\n11      <div ng-controller=\"controllerB\">\n```\n\n### 8.\
  \ 图 21.2 显示了生成的网页，其中每个模块的控制器显示不同的消息。\n\n![Image](img/image00995.jpeg)\n\n**图 21.2**\
  \ 实现依赖注入以为模块和控制器提供额外功能。\n\n**列表 21.3 inject_custom.js 在控制器和模块定义中实现依赖注入**\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var myMod = angular.module('myMod', []);\n02 myMod.value('modMsg',\
  \ 'Hello from My Module');\n03 myMod.controller('controllerB', ['$scope', 'modMsg',\n\
  04                               function($scope, msg) {\n05    $scope.message =\
  \ msg;\n06 }]);\n07 var myApp = angular.module('myApp', ['myMod']);\n08 myApp.value('appMsg',\
  \ 'Hello from My App');\n09 myApp.controller('controllerA', ['$scope', 'appMsg',\n\
  10                                  function($scope, msg) {\n11    $scope.message\
  \ = msg;\n12 }]);\n```\n\n**列表 21.4 inject_custom.html 使用 HTML 代码实现依赖另一个模块的 AngularJS\
  \ 模块**\n\n点击此处查看代码图片\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n\
  03    <head>\n04      <title>AngularJS Dependency Injection</title>\n05    </head>\n\
  06    <body>\n07      <div ng-controller=\"controllerA\">\n08        <h2>Application\
  \ Message:</h2>\n09        {{message}}\n10      </div><hr>\n11      <div ng-controller=\"\
  controllerB\">\n12        <h2>Message:</h2>\n13        {{message}}\n14      </div>\n\
  15      <script src=\"http://ajax.googleapis.com/angularjs/angular.min.js\"></script>\n\
  16      <script src=\"inject_custom.js\"></script>\n</body>\n</html>\n```\n\n***\n\
  \n### 应用配置块和运行块（Run Blocks）\n\n现在你已经理解了模块之间的关系，需要了解 AngularJS 模块。它们通过两个阶段实现：配置（configuration）和运行（run）。\n\
  \n#### 配置块\n\n配置阶段是定义模块阶段。在此阶段，你可以注册提供者（providers）。你通过调用 `config()` 方法来实现配置，例如：\n\
  \n```javascript\n01 var myMod = angular.module('myMod', []);\n02 myMod.config(function($provide)\
  \ {\n03    $provide.value(\"startTime\", new Date());\n04 });\n```\n\n#### 运行块\n\
  \n配置完成后，就可以执行运行阶段。这是放置需要在根级别执行的处理程序的绝佳位置。你通过以下方式实现运行块：\n\n```javascript\n01 myMod.run(function(startTime)\
  \ {\n02    startTime.setTime((new Date()).getTime());\n03 });\n```\n\n### 动手尝试：实现配置和运行\n\
