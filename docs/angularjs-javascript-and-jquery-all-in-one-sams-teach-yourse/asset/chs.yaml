  * *\n\n### 在类过渡中添加效果\n\njQuery UI 效果中一个非常重要的部分是在向元素应用类时对过渡进行动画处理。这是通过为类过渡添加 `duration`\
  \ 并指定控制动画的 `easing` 函数来实现的。任何改变的数值类值都将在类过渡的每一步中进行动画。\n\n注意\n颜色可能会很复杂；jQuery UI 无法动画从红色到蓝色的过渡，但它可以动画从\
  \ `#FF0000` 到 `#0000FF` 的过渡。如果你想动画颜色过渡，请使用它们的十六进制数值值。\n\n以下是你可以使用的类过渡方法列表，你可以通过设置\
  \ `duration` 和 `easing` 值来对对象应用效果：\n\n![Image](img/image00767.jpeg) `.addClass(className,\
  \ duration, easing, complete)`——添加类并对数值类属性的更改进行动画。\n\n![Image](img/image00767.jpeg)\
  \ `.removeClass(className, duration, easing, complete)`——移除类并对数值类属性的更改进行动画。\n\n\
  ![Image](img/image00767.jpeg) `.switchClass(removeClassName, addClassName, duration,\
  \ easing, complete)`——首先移除 `removeClassName` 并对数值类属性的更改进行动画，然后添加 `addClass` 并对数值类属性的变化进行动画。\n\
  \n![Image](img/image00767.jpeg) `.toggleClass(className, switch, duration, easing,\
  \ complete)`——如果对象尚未具有该类，则添加它；如果已经，则移除它。对数值类属性的任何更改将根据 `easing` 函数进行动画。\n\n* *\n\
