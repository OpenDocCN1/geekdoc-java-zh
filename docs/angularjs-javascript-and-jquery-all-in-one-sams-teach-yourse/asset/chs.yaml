  \n\n\n\n\n本课程将向你介绍 `AngularJS` 以及 AngularJS 应用中涉及的主要组件。在尝试实现 AngularJS 应用之前，理解这些组件至关重要，因为该框架与传统的\
  \ JavaScript Web 应用程序编程有所不同。\n\n在你充分掌握 AngularJS 应用的组件和生命周期后，你将学习如何一步步构建一个基础的 AngularJS\
  \ 应用。这将为你进入后续课程做做好准备，后续课程将提供关于实现 `AngularJS` 的更多详细信息。\n\n### 注意事项\n\n书中的示例基于 `AngularJS\
  \ 1.x`。Google 已经宣布了 `AngularJS 2` 并向我们展示了一些它的未来预览（尽管发布似乎还有很长的路要走）。`AngularJS 2`\
  \ 将是 `AngularJS 1.x` 的重大升级。看起来影响开发者的最大变化将围绕自定义指令（custom directives）展开，而自定义指令是 `AngularJS\
  \ 1.x` 中复杂的部分。问题是：我仍然应该学习 `AngularJS 1.x` 吗？简单的答案是肯定的。根据我们的观察，`AngularJS 1.x` 的大部分知识将适用于\
  \ `AngularJS 2`，因为代码结构和关注点分离的核心概念是相同的。同时，为 `AngularJS 2` 做准备的一种良好方法是保持代码尽可能模块化。Google\
  \ 已经指出，你可以在 `AngularJS 2` 内部封装运行 `AngularJS 1.x`，模块化的代码将允许你一次更新一部分。\n\n### 为什么选择\
  \ AngularJS？\n\n`AngularJS` 是一个构建在 JavaScript 和轻量级 `jQuery` 之上的 MVC 框架。MVC 框架将代码中的业务逻辑与视图（View）和模型（Model）分离。如果没有这种分离，当你尝试管理这三者以及复杂的函数矩阵时，基于\
  \ JavaScript 的 Web 应用程序可能会迅速失控。\n\n`AngularJS` 提供的所有功能你都可以通过 JavaScript 和 `jQuery`\
  \ 自己实现，甚至可以尝试使用另一个 MVC JavaScript 框架。然而，`AngularJS` 拥有许多功能，`AngularJS` 框架的设计使其能够以正确的方式实现\
  \ MVC。以下是选择 `AngularJS` 的理由。\n\n`AngularJS` 框架强制执行 MVC 的正确实现并让正确实现 MVC 变得容易：\n\n\
  ![Image](img/image00767.jpeg) `AngularJS` HTML 模板的声明式样式使得 HTML 的意图更加直观，并使 HTML 更易维护。\n\
  \n![Image](img/image00767.jpeg) `AngularJS` 的模型部分是基础 JavaScript 对象，使其易于操作、访问和实现。\n\
  \n![Image](img/image00767.jpeg) `AngularJS` 使用声明式方法，通过在 HTML 声明与其背后的 JavaScript\
  \ 功能之间建立直接链接来扩展 HTML 的功能。\n\n![Image](img/image00767.jpeg) `AngularJS` 提供了一个非常简单且灵活的过滤器接口，允许你在数据从模型传递到视图时轻松地格式化。\n\
  \n![Image](img/image00767.jpeg) `AngularJS` 应用使用的代码通常比传统 JavaScript 应用程序少得多，因为你只需要关注逻辑，而不是所有细小的细节（如数据绑定）。\n\
  \n![Image](img/image00767.jpeg) `AngularJS` 需要比传统方法少得多的文档对象模型（DOM）操作，并引导你将操作放在应用程序中的正确位置。基于数据展示来设计应用程序比基于\
  \ DOM 操作要容易得多。\n\n![Image](img/image00767.jpeg) `AngularJS` 提供了若干内置服务，并允许你以结构化可重用的方式实现自己的服务。这使得你的代码更具维护性且更易测试。\n\
  \n![Image](img/image00767.jpeg) 得于 `AngularJS` 框架中职责的清晰分离，很容易测试你的应用程序，甚至可以使用测试驱动的方法来开发它们。\n\
  \n## 理解 AngularJS\n\n`AngularJS` 提供了一个基于模型-视图-控制器（MVC）模型的非常有结构化的框架。该框架允许你构建健壮且易于理解和维护的结构化应用程序。如果你不熟悉\
  \ MVC 模型，接下来的段提供了一个简要概述，帮助你理解基础知识。这绝不是完整的，仅旨在为你提供足够的参考，以了解 `AngularJS` 如何应用 MVC\
  \ 原则。如果你想获得更多关于 MVC 的信息，维基百科网站是一个很好的资源。\n\n在 MVC 中，有三个组件：模型（Model）是数据源，视图（View）是渲染的网页，而控制器（Controller）处理两者之间的交互。其思想是，当模型发生变化时，视图会自动用新数据更新。当用户与视图交互时，控制器处理这些交互，通常最终会更新模型，然后再次更新视图。\n\
  \nMVC 的主要目的是分离你 JavaScript 代码中的职责，以保持其整洁和易于遵循。`AngularJS` 是可用最佳 MVC 框架之一，因为它让实现\
  \ MVC 变得非常简单。\n\n要开始 `AngularJS`，你首先需要理解你将实现的各种组件以及它们如何相互作用。接下来的章节将讨论涉及 `AngularJS`\
  \ 应用的各种组件、它们的用途以及每个组件的职责。\n\n### 模块 (Modules)\n\n`AngularJS` 引入了模块（module）的概念，代表应用程序中的组件。模块提供了一个命名空间，允许你根据模型名称引用指令（directives）、作用（scopes）和其他组件。这使得封装和重用应用程序的部分变得更容易。\n\
  \n`AngularJS` 中的每个视图或网页都通过 `ng-app` 指令分配了一个单一模块。（指令将在本课程稍后讨论。）然而，你可以将其他模块作为依赖添加到主模块中，从而提供非常有结构且组件化的应用程序。主\
  \ `AngularJS` 模块的作用类似于 C# 和 Java 中的根命名空间。\n\n### 作用域 (Scopes) 和数据模型\n\n`AngularJS`\
  \ 引入了作用域（scope）的概念。作用域仅仅是用于填充网页上展示的视图的数据 JavaScript 表示。数据可以来自任何源，例如数据库、远程 Web 服务或客户端\
  \ `AngularJS` 代码，也可以是由 Web 服务器动态生成。\n\n作用域的一个很棒特性是它们只是普通的 JavaScript 对象，这意味着你可以轻松地在\
  \ `AngularJS` 代码中根据需要操作它们。此外，你还可以嵌套作用域，以组织数据以匹配它们被使用的上下文。\n\n### 使用模板 (Templates)\
  \ 和指令 (Directives) 的视图 (Views)\n\nHTML 网页基于 DOM，每个 HTML 元素由一个 DOM 对象表示。 浏览器读取 DOM\
  \ 对象的属性，并根据 DOM 对象的属性知道如何在网页上渲染 HTML 元素。\n\n大多数动态 Web 应用使用原生 JavaScript 或基于 JavaScript\
  \ 的库（如 `jQuery`）操作 DOM 对象，以更改用户视图中渲染 HTML 元素的行为和外观。\n\n`AngularJS` 引入了一种新概念，将包含指令的模板相结合，指令通过背后的\
  \ JavaScript 代码直接扩展 HTML 标签和属性，从而扩展 HTML 的能力。\n\n\n\n\n\n使用指令（directives）的优势在于，HTML\
  \ 模板指明了视觉元素的预期逻辑，使其易于遵循，而不会隐藏在大量的 JavaScript 代码中。AngularJS 的优秀特性之一是其内置的 AngularJS\
  \ 指令处理了大多数所需的 DOM 操作功能，让你能够将 `scope` 中的数据直接绑定到视图中的 HTML 元素上。\n\n你也可以创建自己的 AngularJS\
  \ 指令，以实现 Web 应用中所需的任何必要的自定义功能。事实上，你应该使用自己的自定义指令来处理 Web 应用所需的任何直接 DOM 操作。\n\n## 表达式\
  \ (Expressions)\n\nAngularJS 的一个强大特性是可以在 HTML 模板中添加表达式。AngularJS 会评估表达式，然后动态地将结果添加到网页中。由于表达式与\
  \ `scope` 绑定，你可以拥有一个利用 `scope` 中值的表达式，并且随着模型的变化，表达式的值也会随之改变。\n\n## 控制器 (Controllers)\n\
  \nAngularJS 通过实现控制器（controllers）来完成 MVC 框架。控制器通过设置 `scope` 中的初始状态或值，以及为 `scope`\
  \ 添加行为来增强 `scope`。例如，你可以添加一个函数来求加 `scope` 中的值以提供总和，这样如果 `scope` 后面的模型数据发生变化，总值就会一直变化。\n\
  \n你通过使用指令将控制器添加到 HTML 元素中，然后在后台作为 JavaScript 代码实现它们。\n\n## 数据绑定 (Data Binding)\n\
  \nAngularJS 的最佳特性之一是内置的数据绑定。数据绑定是将模型中的数据与网页上显示的内容链接起来的过程。AngularJS 提供了一个非常简洁的接口，将模型数据链接到网页中的元素上。\n\
  \n在 AngularJS 中，数据绑定是一个双向过程：当网页上的数据发生变化时，模型会更新；而当模型中的数据发生变化时，网页会自动更新。通过这种方式，模型始终是呈现给用户的数据唯一来源，而视图是模型的投影。\n\
  \n## 服务 (Services)\n\n服务（Services）是 AngularJS 环境中的主要负载。服务是为 Web 应用提供功能的单例对象。例如，Web\
  \ 应用的一个常见任务是向 Web 服务器执行 AJAX 请求。AngularJS 提供了一个 `HTTP` 服务，包含了访问 Web 服务器的所有功能。\n\n\
  服务功能完全独立于上下文或状态，因此可以从应用程序的组件中轻松调用。AngularJS 提供了许多用于基本用途的内置服务组件，例如 HTTP 请求、日志记录、解析和动画。你也可以创建自己的服务并在整个代码中复用它们。\n\
  \n## 依赖注入 (Dependency Injection)\n\n依赖注入是一个代码组件定义对其他组件依赖关系的过程。当代码初始化时，被依赖的组件将供组件内部访问。AngularJS\
  \ 应用程序大量使用依赖注入。\n\n依赖注入的一个常见用途是消费服务。例如，如果你正在定义一个需要通过 HTTP 请求访问 Web 服务器的模块，你可以将 `HTTP`\
  \ 服务注入模块中，该功能即可在模块代码中可用。此外，一个 AngularJS 模块通过依赖消费另一个模块的功能。\n\n## 编译器 (Compiler)\n\
  \nAngularJS 提供了一个 HTML 编译器，它会发现 AngularJS 模板中的指令，并使用 JavaScript 指令代码构建出扩展的 HTML\
  \ 元素。当 AngularJS 库启动（bootstrap）时，编译器会被加载到浏览器。加载后，编译器将搜索浏览器中的 HTML DOM，并将任何后端 JavaScript\
  \ 代码链接到 HTML 元素上，然后最终的应用程序视图将渲染给用户。\n\n## AngularJS 生命周期概述\n\n既然你已经了解了 AngularJS\
  \ 应用中涉及的组件，你还需要了解生命周期期间发生了什么，生命周期包含三个阶段：启动（bootstrap）、编译（compilation）和运行（runtime）。理解\
  \ AngularJS 应用程序的生命有助于理解如何设计和实现你的代码。\n\nAngularJS 应用程序生命周期的三个阶段每次浏览器加载网页时都会发生。以下章节描述了\
  \ AngularJS 应用程序的这些阶段。\n\n### 启动阶段 (The Bootstrap Phase)\n\nAngularJS 生命周的第一阶段是启动阶段，发生在\
  \ AngularJS JavaScript 库下载到浏览器时。AngularJS 初始化其自身的必要组件，然后初始化由 `ng-app` 指令指向的模块。加载模块，任何依赖项都会被注入到你的模块中并供模块内的代码使用。\n\
  \n### 编译阶段 (The Compilation Phase)\n\nAngularJS 生命周的第二阶段是 HTML 编译阶段。最初加载网页时，静态的\
  \ DOM 被加载到浏览器中。在编译阶段，静态 DOM 被替换为代表 AngularJS 视图的动态 DOM。\n\n此阶段涉及两个部分：遍历静态 DOM 并收集所有指令，然后将指令链接到\
  \ AngularJS 内置库或自定义指令代码中相应的 JavaScript 功能。指令与 `scope` 结合以产生动态或实时的视图。\n\n### 运行数据绑定阶段\
  \ (The Runtime Data Binding Phase)\n\nAngularJS 应用程序的最后一个阶段是运行阶段，它持续到用户重新加载或离开网页为止。此时，`scope`\
  \ 中的任何更改都会反映在视图中，而视图中的任何更改都会直接更新到 `scope` 中，使 `scope` 成为视图的数据单一来源。\n\nAngularJS\
  \ 的行为与传统的数据绑定方法不同。传统方法将模板与从引擎接收的数据结合，并在每次数据变化时操作 DOM。AngularJS 仅编译一次 DOM，然后根据需要链接已编译的模板，这比传统方法高效得多。\n\
  \n## 职责分离 (Separation of Responsibilities)\n\n设计 AngularJS 应用程序的一个至关重要的部分是职责分离。你选择结构化框架的完全目的是确保代码实现良好、易于遵循、可维护且可测试。Angular\
  \ 提供了一个非常有结构性的框架供你工作，但你仍然需要确保以恰当的方式实现 AngularJS。\n\n以下是实现 AngularJS 时遵循的一些规则：\n\n\
  ![Image](img/image0767.jpeg) 视图作为应用程序的官方呈现结构。将任何呈现逻辑作为指令位于视图的 HTML 模板中。\n\n![Image](img/image0767.jpeg)\
  \ 如果你需要执行任何 DOM 操作，请在内置或自定义指令 JavaScript 代码中进行——而不是在其他地方进行。\n\n![Image](img/image0767.jpeg)\
  \ 将任何可复用的任务实现为服务，并通过依赖注入将其添加到模块中。\n\n![Image](img/image0767.jpeg) 确保 `scope` 反映模型的当前状态，并是视图所消费数据的单一来源。\n\
  \n![Image](img/image0767.jpeg) 确保控制器代码仅用于增强作用 数据，而不包含任何业务逻辑。\n\n![Image](img/image0767.jpeg)\
  \ 将控制器定义在模块命名空间内而不是全局。这确保了你的应用程序可以被容易地打包，并防止污染全局命名空间。\n\n\n\n\nAngularJS 基于 JavaScript\
  \ 和 jQuery，这一事实使得人们很想将其添加到现有的应用程序中，以提供数据绑定或其他功能。这种方法几乎总是会导致难以维护的故障代码。然而，使用 AngularJS\
  \ 并不意味着你需要简单地抛弃现有的代码。通常，你可以选择性地提取运行良好的 JavaScript/jQuery 组件，并将它们转换为指令（directives）或服务（services）。\n\
  \n这还引出了另一个问题：何时该使用完整版的 jQuery，而不是使用 AngularJS 提供的 jQuery 轻量版（jQuery lite version）呢？我知道许多人对这两种观点都有强烈的看法。一方面，你希望你的实现尽可能保持简洁和简单。但另一方面，有时你可能需要只有完整版\
  \ jQuery 中才提供的功能。我们的建议是根据情况而定。如果你需要 AngularJS jQuery 轻量版未提供的功能，请加载完整库。加载 jQuery\
  \ 而不是 jQuery 轻量版的机制将在本节稍后进行讨论。\n\n以下步骤提供了一种将 AngularJS 集成到现有的 JavaScript 和 jQuery\
  \ 应用程序的方法：\n\n1. 从头开始编写至少一个小型 AngularJS 应用，该应用应使用模型（model）、自定义 HTML 指令、服务和控制器。换句话说，在这个应用中，确保你对\
  \ AngularJS 的职责分离原则（separation of responsibilities）有实际理解。\n2. 识别代码中的模型部分。具体来说，尝试将模型中增强模型数据代码分离到控制器函数中，将访问后端模型数据代码分离到服务中。\n\
  3. 识别视图中操作 DOM 元素的代码。尝试将 DOM 操作代码分离到定义良好的自定义指令组件中，并为它们提供 HTML 指令。同时，识别出 AngularJS\
  \ 已经提供内置支持的任何指令。\n4. 识别其他基于任务的功能，并将它们分离到服务中。\n5. 将指令和控制器隔离到模块（modules）中，以组织你的代码。\n\
  6. 使用依赖注入（dependency injection）恰当地链接你的服务和模块。\n7. 更新 HTML 模板以使用新的指令。\n\n显然，在某些情况下，使用大量（甚至不使用）你的现有代码是没有意义的。然而，通过执行上述步骤，你将进入使用\
  \ AngularJS 实现项目的设计阶段，然后就可以做出明智的决定。\n\n### 在你的环境中添加 AngularJS\n\nAngularJS 是一个客户端\
  \ JavaScript 库，这意味着要在你的环境中实现 AngularJS，你唯一需要做的就是提供一种方法，让客户端通过 HTML 模板中的 `<script>`\
  \ 标签获取 `angular.js` 库文件。\n\n提供 `angular.js` 库简单的方法是使用内容分发网络（CDN），它提供了从第三方下载该库的 URL。这种方法的缺点是你必须依赖第三方来提供该库，如果客户端无法连接到该第三方\
  \ URL，你的应用程序将无法工作。例如，下面的 `<script>` 标签从 Google APIs CDN 加载 `angular.js` 库：\n\n```html\n\
  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
  ></script>\n```\n\n提供 `angular.js` 库的另一种方法是从 AngularJS 网站 ([`angularjs.org`](http://angularjs.org))\
  \ 下载，并使用你自己的 Web 服务器向客户端提供文件。这种方法需要更多精力，并且还需要占用额外的带宽；但如果你想对客户端获取库的方式有更多控制，这可能是更好的选择。\n\
  \n### 在 HTML 文档中启动 AngularJS\n\n要在你的网页中实现 AngularJS，你需要对 HTML 文档进行启动（bootstrap）。启动包含两个部分：第一部分是使用\
  \ `ng-app` 指令定义应用模块，第二部分是在 `<script>` 标签中加载 `angular.js` 库。\n\n`ng-app` 指令告诉 AngularJS\
  \ 编译器将该元素视为编译的根。`ng-app` 指令通常加载在 `<html>` 标签中，以确保包含整个网页在内；但你也可以将其添加到另一个容器元素，只有该容器内部的元素会被包含在\
  \ AngularJS 编译中，从而在 AngularJS 应用功能中。\n\n如果可能，你应该将 `angular.js` 库作为 HTML `<body>`\
  \ 内部最后一个标签之一（甚至是最后一个）。当 `angular.js` 脚本被加载时，编译器就会启动并开始寻找指令。最后加载 `angular.js` 可以让网页加载更快。\n\
  \n以下是在 HTML 文档中实现 `ng-app` 和 `angular.js` 启动的示例：\n\n```html\n<!doctype html>\n<html\
  \ ng-app=\"myApp\">\n  <body>\n    <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n    <script src=\"/lib/myApp.js\"></script>\n  </body>\n</html>\n```\n\
  \n### 使用全局 API\n\n当你实现 AngularJS 应用程序时，你会发现有一些经常执行的常用 JavaScript 任务，例如比较对象、深拷贝、遍历对象和转换\
  \ JSON 数据。AngularJS 在全局 API 中提供了许多此类基础功能。\n\n当 `angular.js` 库加载时，即可使用全局 API，你可以通过\
  \ `angular` 对象访问它们。例如，要创建一个名为 `myObj` 的对象的副本，你可以使用以下语法：\n\n```javascript\nvar myCopy\
  \ = angular.copy(myObj);\n```\n\n下面的代码展示了通过 `forEach()` 全局 API 遍历对象数组的示例：\n\n```javascript\n\
  var objArr = [{score: 95}, {score: 98}, {score: 92}];\nvar scores = [];\nangular.forEach(objArr,\
  \ function(value, key){\n  this.push(key + '=' + value);\n}, scores);\n// scores\
  \ == ['score=95', 'score=98', 'score=92']\n```\n\n### 自己尝试：创建一个简单的 AngularJS 应用\n\
  \n现在你已经理解了 AngularJS 的基本组件、意图和设计以及如何启动 AngularJS，你准备好开始实现应用程序了。本节将引导你完成一个非常简单的 AngularJS\
  \ 应用，该应用实现了 HTML 模板、模块、控制器、作用域（scope）和表达式。\n\n示例代码是一个 AngularJS HTML 模板 `first.html`\
  \ 和一个 JavaScript 模块 `first.js`。以下步骤描述了实现此 AngularJS 代码的重要步骤。\n\n这些每个步骤将在后的课程中进行更详细的描述，所以在这里不要纠结细节。现在重要的是理解模板、模块、控制器和作用域的实现过程，以及它们之间是如何相互作用的：\n\
  \n1. 在 Eclipse 中，添加 `lesson20/first.html` 和 `lesson18/js/first.js` 文件。\n2. 在 `first.html`\
  \ 文件中，添加标准的网页元素 `doctype`、`html`、`head` 和 `body`。\n\n\n\n\n\n### 3. 接下来，你需要在 HTML\
  \ 模板中加载库。添加 列表 20.1 所示的以下行，以加载 `angular.js` 库，然后加载 `first.js` JavaScript 自定义模块：\n\
  \n点击此处查看代码图片\n\n```html\n15      <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n16      <script src=\"/js/first.js\"></script>\n```\n\n### 4. 下一步是在应用的根元素中定义\
  \ `ng-app` 参数，以便 AngularJS 知道从何处开始编译。添加 列表 20.1 所示的以下行，在 `<html>` 元素中引导 AngularJS。注意\
  \ `ng-app` 被分配了模块名称 `firstApp`，这与 列表 20.2 所示 JavaScript 代码中的模块对应：\n\n```html\n02\
  \ <html ng-app=\"firstApp\">\n```\n\n### 5. 在 列表 20.2 所示的 `first.js` 文件中添加以下行，以定义名为\
