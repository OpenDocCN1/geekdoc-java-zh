  \ 和 XML/HTML。脚本和文本可以通过 `.load()` 和 `.getScript()` 方法简单处理。JSON 和 XML/HTML 可能会复杂一些。\n\
  \n后续章节将引导你了解处理服务器响应中 JSON 和 XML 数据的过程。\n\n### 尝试一下：处理 JSON 响应数据\n\n在 jQuery AJAX\
  \ 响应中，JSON 数据是最容易处理的。这是因为响应数据是以对象形式存在的，所以你可以通过点命名来访问它。例如，服务器返回的以下 JSON 响应：\n\n点击此处查看代码图像\n\
  \n```json\n{\"first\":\"Brad\", \"last\":\"Dayley\"}\n```\n\n可以通过如下方式在响应数据访问：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar name  = data.first + \" \" + data.last;\n```\n\n\
  即使响应数据对象是以字符串形式提供的，你也可以使用 `.parseJSON()` 获取 JavaScript 对象。例如：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar data = $.parseJSON('{\"first\":\"Brad\", \"last\":\"Dayley\"\
  }');\nvar name  = data.first + \" \" + data.last;\n```\n\n在本练习中，你将处理来自 AJAX 请求返回的\
  \ JSON 数据。生成的网页包含几张带有说明的图像。图像说明和图像文件名来自位于服务器 `lesson15/data/images.json` 的 JSON\
  \ 文件。本练习的目的是让你熟悉如何使用从 AJAX 请求返回的 JSON 数据来动态填充页面。\n\n示例代码位于 列表 15.9、15.10、15.11 和\
  \ 15.12。使用以下步骤创建动态网页：\n\n1. 在 Eclipse 中，创建 `lesson15/load_json.html`、`lesson15/js/load_json.js`、`lesson15/css/load_json.css`\
  \ 和 `lesson15/data/images.json` 文件。\n2. 在 HTML 和 CSS 文件中添加列表 15.9 和 列表 15.12 所示的代码。这些是非常基础的文件，因为图像元素将是动态生成的。\n\
