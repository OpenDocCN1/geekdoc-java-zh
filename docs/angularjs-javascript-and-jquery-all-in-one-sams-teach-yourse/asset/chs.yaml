  \n\n在你定义 CSS 样式规则时，请记住有几种方法可以动态应用样式。你可以这样设计 CSS，使得动态代码的实现将变得简单得多。以下章节描述了你之后将学习的一些方法。\n\
  \n### 准备动态为 HTML 元素添加类\n\n动态调整 HTML 元素样式的简单方法是更改与该元素关联的 CSS 规则。更改 CSS 规则最简单的方法是为你想要使用的不同规则使用\
  \ `class` 选择器。通过这种方式，你可以从 `AngularJS`、`jQuery` 和 `JavaScript` 出发，添加一个 `class` 来应用样式，或移除一个\
  \ `class` 来移除样式。\n\n这提供了两个主要优势。首先，动态代码变得简单得多，因为添加和移除类非常容易。其次，易于调整将应用的 CSS 样式，因为这些调整将在\
  \ `.css` 文件或 `<style>` 标签内部完成。\n\n使用动态类规则要求类选择器的规则必须在加载到页面的 CSS 代码某处被完全定义。它还需要你对如何实现每个\
  \ CSS 规则进行思考。\n\n例如，考虑为一个样式化为按钮的 `<span>` 元素添加动态交互。你希望按钮能够有四种不同的状态：升起、按下、未激活和状态改变。你可以为这些按钮状态的类选择器创建一个不同的\
  \ CSS 规则。当按钮升起时，分配给 `<span>` 的 `class` 属性为 `up`；当用户点击按钮时，你可以将 `class` 更改为 `state\
  \ changing`，然后在鼠标释放时，将 `class` 更改为 `down`。\n\n### 准备直接调整 CSS 属性\n\n你也可以通过 `AngularJS`、`jQuery`\
  \ 和 `JavaScript` 直接访问并修改元素或一组元素的特定 CSS 属性。这提供了可以在 `.css` 文件或 `<style>` 标签中创建静态 CSS\
  \ 定义，然后动态更改属性值子集的优势。\n\n使用 `JavaScript`  CSS 属性值的一个很好的例子是在 页面上移动项目。例如，假设你定义了一个滚动\
  \ banner 的 HTML 元素，它应该在屏幕上水平滚动。你会定义静态 CSS 样式，将 banner 设置为浏览器窗口中的固定位置。然后，由于 CSS 已经定义了渲染固定\
  \ banner 需要的所有属性，从 `AngularJS`、`jQuery` 和 `JavaScript` 所做的只需要调整 CSS 位置属性来滚动 banner。\n\
  \n### 总结\n\n本节讨论了使用 CSS 快速方便地更改网页的外观和感受。理解这些概念对于实现 `JavaScript`、`jQuery` 和 AngularJS\
  \ 以创建动态网页和富丰富的互联网应用程序至关重要。\n\n你学习了 CSS 规则是如何构造的，以及如何定义选择器将 CSS 规则应用于特定的 HTML 元素组。你接触了\
  \ CSS 的一些常见设计和布局样式。\n\n你学习了如何设置文本样式、应用颜色和背景图像，以及为 HTML 元素创建酷的边框。你还学习了如何理解和控制页面上\
  \ HTML 元素的流，以及如何应用固定定位。\n\n### 问答\n\n**Q. 为 HTML 元素使用固定尺寸和位置更好，还是应该尝试使用更多基于内容大小的\
  \ HTML 流？**\n\n**A.** 这是一个很难的问题。对于大多数网页，请考虑尽可能在元素内部使用更多相对定位的流。之所以这样做是因为可能查看网页的显示范围非常广。如果你需要支持多达\
  \ 36 英寸显示器的移动显示，流允许内容更容易地匹配浏览器大小。然而，如果你正在设计一个更像网络应用程序的动态网页，请使用更多支持平均尺寸显示器的固定尺寸，然后使用你在书中后学习的\
  \ `jQuery Mobile` 技术来实现移动版本。\n\n**Q. 为什么要费力用 CSS——我不能直接从 jQuery 和 JavaScript 应用\
  \ CSS 样式吗？**\n\n**A.** 当然可以，你用 CSS 能做的任何事情都可以通过 `JavaScript` 应用。然而，维护这些更改更加困难，特别是当有多个人参与设计时。通常，优秀的网页设计师并不知道任何\
  \ `jQuery` 或 `JavaScript`。此外，考虑保留多个版本的 CSS 文件并对其进行调整以为网页应用不同的皮肤是简单的。\n\n### 工作坊\n\
  \n工作坊由一组问答组成，旨在巩固你对本节涵盖内容的理解。在看答案之前尝试回答这些问题。\n\n### 测验\n\n**1.** 你会使用什么选择器为所有 `<div>`\
  \ 元素应用 CSS 规则？**\n\n**2.** 哪个 CSS 属性允许元素向右或向左浮过其他元素？**\n\n**3.** 你如何为 `<div>` 元素应用带圆角的边框？**\n\
  \n**4.** 正确或错误：你不能在浏览器中指定精确坐标来定位 HTML 元素。**\n\n**5.** 你会使用什么选择器为类设置为 `myClass` 且\
  \ ID 设置 `mainContainer` 的 HTML 元素应用 CSS 规则？**\n\n### 测验答案\n\n**1.** `div {...}`\n\
  \n**2.** `float:right` 或 `float:left`\n\n**3.** `border:1px solid;border-radius:5px;`\n\
  \n**4.** 错误。你可以设置 `display:fixed` 属性，然后设置 `top`、`left` 或 `right` 像素偏移来放置 HTML 元素，无论页面上的其他元素在哪里。\n\
  \n**5.** `#mainContainer {...}`\n\n### 练习\n\n**1.** 修改你在列表 4.3 应用的代码，包含以下 CSS 规则，该规则适用于你定义的按钮的\
  \ span。该规则应该在鼠标悬停在其上方时更改 HTML 元素的样式，从而改变菜单项的外观：\n\n```css\nspan:hover {\n  width:150px;\n\
  \  background-color: #223FF;\n  color: white;\n  border:5px outset blue;\n  border-radius:50%;\n\
  }\n```\n\n**2.** 修改列表 4.6 和列表 4.7 中的代码，将标题封装在自己的边框中并将其放置在其他 `<div>` 元素上方。你需要通过更改现有\
  \ `<div>` 元素的位置来实现这一点。\n\n\n\n\n[content]\n\n在本节中，你将学习 JavaScript 的基本结构和语法，以及如何使用\
  \ jQuery 来简化某些开发任务。本节的目的是帮助你熟悉 JavaScript 语言语法，这同时也也是 jQuery 的语言语法。\n\n## 在网页中添加\
  \ jQuery 和 JavaScript\n\n浏览器已经内置了对 JavaScript 的支持。这意味着你只需要将自己的 JavaScript 代码添加到网页中，即可实现动态网页。另一方面，jQuery\
  \ 是一个额外的库，在添加 jQuery 脚本之前，你需要先将 jQuery 库添加到你的网页中。\n\n## 加载 jQuery 库\n\n由于 jQuery\
  \ 库是一个 JavaScript 脚本，因此你使用 `<script>` 标签将 jQuery 加载到你的网页中。你可以将 jQuery 下载到你的代码目录并托管在你的\
  \ Web 服务器上，也可以使用在 [jQuery.com](http://jQuery.com) 提供的托管版本。以下语句显示了每种方式的示例；唯一的区别是第一个是从\
  \ jQuery CDN 源加载，而第二个是从 Web 服务器加载的：\n\n点击此处查看代码图像\n\n```html\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script src=\"includes/js/jquery-latest.min.js\"></script>\n```\n\n\
  **注意**\n\n记住，你需要在加载 jQuery 库的 `<script>` 元素放置在任何使用它的脚本元素之前。否则，那些脚本库将无法连接到 jQuery\
  \ 代码。\n\njQuery 库的下载地址可以在以下位置找到：\n[`http://jquery.com/download/`](http://jquery.com/download/)\n\
  \njQuery 库的托管链接可以在以下位置找到：\n[`http://code.jquery.com/`](http://code.jquery.com/)\n\
  \n### 实现你自己的 jQuery 和 JavaScript\n\njQuery 代码是作为 JavaScript 脚本的一部分来实现的。要向你的网页中添加\
  \ jQuery 和 JavaScript，首先添加一个加载 jQuery 库的 `<script>` 标签，然后添加带有你自定义代码的自己的 `<script>`\
  \ 标签。\n\nJavaScript 代码可以添加到 `<script>` 元素内部，也可以 `<script>` 标签的 `src` 属性可以指向单独 JavaScript\
  \ 文档的位置。无论哪种方式，JavaScript 都将以相同的方式加载。\n\n以下是一对加载 jQuery 后并使用它的 `<script>` 语句示例。`document.write()`\
  \ 函数直接将文本写入浏览器以进行渲染：\n\n点击此处查看代码图像\n\n```html\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script>\n  function writeIt(){\n    document.write(\"jQuery Version\
  \ \" + $().jquery + \" loaded.\");\n  }\n</script>\n```\n\n**注意**\n\n`<script>`\
  \ 标签不需要添加到 HTML 文档的 `<head>` 部分；它们也可以添加到 `body` 中。将简单的脚本直接内联到使用它们的 HTML 元素中通常是很有用的。\n\
  \n## 访问 HTML 事件处理程序\n\n那么在你将 JavaScript 添加到网页后，如何让它执行呢？答案是将其绑定到浏览器上。每当页面或元素加载、用户移动或点击鼠标或输入字符时，就会触发一个\
  \ HTML 事件。\n\n每个受支持的事件都是接收事件的对象的的一个属性。如果你将属性值设置为 JavaScript 函数，那么当事件触发时，浏览器将执行你的函数。例如，当\
  \ HTML 页面的 body 加载时，以下将执行 `writeIt()` 函数：\n\n```html\n<body onload=\"writeIt()\"\
  >\n```\n\n### 尝试一下：实现 JavaScript 和 jQuery\n\n这些是基本步骤。现在是时候亲自尝试了。使用以下步骤将 jQuery 添加到你的项目中并在网页中动态使用它：\n\
  \n1. 在 Eclipse 中，创建一个名为 `lesson05` 的源文件夹。\n2. 在与 `lesson05` 文件夹相同的目录下，添加一个名为 `js`\
  \ 的额外目录。\n3. 现在在 lesson05 文件夹中创建一个名为 `jquery_version.html` 的源文件。\n4. 添加常规元素（html,\
  \ head, body）。\n5. 在 `<head>` 元素内部，添加以下行代码来加载刚刚下载的库：\n点击此处查看代码图像\n```html\n<script\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n```\n6. 现在你可以添加你自己的\
  \ `<script>` 标签并带有以下代码将 jQuery 版本打印到浏览器上：\n点击此处查看代码图像\n```html\n<script>\n  function\
  \ writeIt(){\n    document.write(\"jQuery Version \" + $().jquery + \" loaded.\"\
  );\n  }\n</script>\n```\n7. 为了让你的脚本在文档加载时执行，使用以下行代码将 `writeIt()` 函数绑定到 `<body> onload`\
  \ 事件：\n```html\n<body onload=\"writeIt()\">\n```\n8. 保存文件并在 Web 浏览器中通过以下位置查看。输出应该类似于\
  \ 图 5.1：\n`http://localhost/lesson06/jquery_version.html`\n\n**图 5.1** 当执行 `writeIt()`\
  \ 函数时，会将 jQuery 版本写入到浏览器。**列表 5.1 在网页中加载 jQuery 并打印其版本的简单示例**\n点击此处查看代码图像\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title>jQuery Version</title>\n  <meta charset=\"\
  utf-8\" />\n  <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  \  <script>\n    function writeIt(){\n      document.write(\"jQuery Version \" +\
  \ $().jquery + \" loaded.\");\n    }\n  </script>\n</head>\n<body onload=\"writeIt()\"\
  >\n</body>\n</html>\n```\n[/content]\n\n[/content]\n\n[content]\n\n访问 DOM\n\nJavaScript（尤其是\
  \ jQuery）最重要的方面之一是访问 DOM 能力。访问 DOM 是你通过更改元素的样式、大小、位置和值来使网页动态的方式。\n\n在接下来的章节中，你将学习通过传统方法访问\
  \ DOM 以及使用 jQuery 选择器的更改进方法。这些章节只是简要介绍。你将在后的课程中进行大量的练习。\n\n### 使用传统 JavaScript 访问\
  \ DOM\n\n传统上，JavaScript 使用全局 `document` 对象来访问网页中的元素。访问元素的最简单方法是通过 `id` 直接引用它。例如，如果你有一个\
  \ `id=\"question\"` 的段落，你可以通过以下 JavaScript `getElementById()` 函数访问它：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar q = document.getElementById(\"question\");\n...\n<p id=\"question\"\
  >你更喜欢哪种方法？</p>\n```\n\n另一个用于访问 DOM 元素的有用 JavaScript 函数是 `getElementsByTagName()`。它返回一个与标签名称匹配的\
  \ DOM 元素数组。例如，获取所有 `<p>` 元素的列表使用以下函数调用：\n\n点击此处查看代码图像\n\n```javascript\nvar paragraphs\
  \ = document.getElementsByTagName(\"p\");\n```\n\n### 使用 jQuery 选择器访问 HTML 元素\n\n\
  访问 HTML 元素是 jQuery 的最大优势之一。jQuery 使用与 CSS 选择器非常的选择器来访问 DOM 中的一个或多个元素；因此得名 jQuery。jQuery\
  \ 返回一个单个元素或 jQuerified 对象的数组。jQuerified 意味着向 DOM 对象添加了额外的 jQuery 功能，使得操作变得更加容易。\n\
  \n\n\n\n使用 jQuery 选择器的语法为 `$(selector).action()`，其中 `selector` 被替换为有效的选择器，而 `action`\
  \ 被替换为附加到 DOM 元素上的 jQuery 动作。\n\n例如，以下命令可以找到 HTML 文档中的所有段落元素，并将 CSS-`font-weight`\
  \ 属性设置为 `bold`：\n\n点击此处查看代码图片\n\n```\n$(\"p\").css('font-weight', 'bold');\n```\n\
  \n***\n\n## 动手尝试：使用 jQuery 和 JavaScript 访问 DOM 元素\n\n为了巩固这些概念，你将运行一个使用 jQuery 和\
  \ JavaScript 访问并修改 DOM 元素的快速示例。按照以下步骤构建 Listing 5.2 所示的 HTML 文档：\n\n**1.** 在 `lesson05`\
  \ 文件夹中创建一个名为 `dom_elements.html` 的源文件。\n\n**2.** 添加常规的基础元素（`html`、`head`、`body`）。\n\
  \n**3.** 在 `<head>` 元素内部添加以下行来加载你刚刚下载的库：\n\n点击此处查看代码图片\n\n```html\n06    <script\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n```\n\n**4.** 添加以下\
  \ `<script>` 元素，它同时使用 JavaScript 和 jQuery 方法访问 DOM。注意，在 jQuery 中，两个动作是链式连接的。第一个动作设置\
  \ CSS-font-weight 属性，第二个动作更改元素包含的文本。对于 JavaScript，你使用 `getElementById()` 方法，然后直接在\
  \ DOM 中设置 `innerHTML` 属性来更改浏览器中显示的文本：\n\n点击此处查看代码图片\n\n```html\n07    <script>\n\
  08      function writeIt(){\n09          $(\"#heading\").css('font-weight', 'bold').html(\"\
  jQuery\");\n10          var q = document.getElementById(\"question\");\n11     \
  \     q.innerHTML = \"I Prefer jQuery!\";\n12      }\n13    </script>\n```\n\n**5.**\
  \ 为了让脚本在文档加载时执行，请使用以下行将 `writeIt()` 函数绑定到 `<body> onload` 事件：\n\n点击此处查看代码图片\n\n\
  ```html\n15    <body onload=\"writeIt()\">\n```\n\n**6.** 在 `<body>` 中添加以下 `<p>`\
  \ 元素，为 JavaScript 代码提供访问容器：\n\n点击此处查看代码图片\n\n```html\n16      <p id=\"heading\"\
  >jQuery or JavaScript</p>\n17      <p id=\"question\">Which method to you prefer?</p>\n\
  ```\n\n**7.** 保存文件并在网页浏览器中查看。输出应该与 Figure 5.2 相似。\n\n![Image](img/image00847.jpeg)\n\
  \n**图 5.2** 函数 `writeIt()` 在 body 加载时执行，并更改文本的内容和外观。\n\n**列表 5.2 使用 JavaScript 和\
  \ jQuery 访问 DOM 元素的非常基础的示例**\n\n点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n\
  03    <head>\n04      <title>DOM Changes</title>\n05      <meta charset=\"utf-8\"\
  \ />\n06      <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  07      <script>\n08        function writeIt(){\n09          $(\"#heading\").css('font-weight',\
  \ 'bold').html(\"jQuery\");\n10          var q = document.getElementById(\"question\"\
  );\n11          q.innerHTML = \"I Prefer jQuery!\";\n12      }\n13      </script>\n\
  14    </head>\n15    <body onload=\"writeIt()\">\n16      <p id=\"heading\">jQuery\
  \ or JavaScript</p>\n17      <p id=\"question\">Which method to you prefer?</p>\n\
  18    </body>\n19 </html>\n```\n\n***\n\n### 理解语法\n\n与任何其他语言一样，JavaScript 基于语法，其中特定的单词具有特定的含义。\n\
  \n***\n\n### 创建变量\n\n学习 JavaScript 的起点是变量。变量可以指向简单的数据，也可以指向更复杂的数据，例如对象。\n\n要定义变量，你必须使用\
  \ `var` 关键字并给它分配一个值。例如：\n\n```javascript\nvar myString\n```\n\n在声明变量后，你可以在代码中使用它。例如：\n\
  \n```javascript\nvar myString = \"Some Text\";\n```\n\n变量名应以字母、`$` 或 `_` 开始，且不能包含空格。还要记住变量名是区分大小写的。\n\
  \n***\n\n### 理解数据类型\n\nJavaScript 使用数据类型来决定如何处理数据。以下描述了：\n\n### 字符串 (String)\n存储字符数据。字符数据通过单引号或双引号指定。例如：\n\
  \n```javascript\nvar myString = 'Some Text';\nvar anotherString = \"Some Text\"\
  ;\n```\n\n### 数字 (Number)\n将数据存储为数值。数字在计数、计算和比较中非常有用。示例如下：\n\n```javascript\nvar\
  \ myInteger = 1;\nvar cost = 1.33;\n```\n\n### 布尔值 (Boolean)\n存储单个位，值为真或假。布尔值通常用于标记位。例如，你可能会在代码开始时将变量设置为\
  \ false，并在完成后检查它以查看代码是否运行了特定位置。以下是定义 true 和 false 变量的示例：\n\n```javascript\nvar yes\
  \ = true;\nvar no = false;\n```\n\n## 数组 (Array)\n索引数组是一系列存储在单个变量名下的相互独立的数据项。可以使用从零开始的索引\
  \ `[index]` 访问数组中的项。以下是创建一个简单数组并访问第一个元素（索引为 0）的示例：\n\n```javascript\nvar arr = [\"\
  one\", \"two\", \"three\"];\nvar first = arr[0];\n```\n\n### 关联数组/对象 (Associative\
  \ Array/Objects)\nJavaScript 确实支持关联数组的概念，即通过名称而不是索引值来访问数组项。然而，更好的方法是使用对象字面量。当你使用对象字面量时，可以使用\
  \ `object.property` 语法访问对象中的项。以下示例显示了如何创建和访问对象字面量：\n\n```javascript\nvar obj = {\"\
  name\":\"Brad\", \"occupation\":\"Hacker\", \"age\", \"Unknown\"};\n```\n\n\n\n\n\
  \n```javascript\nvar name = obj.name;\n```\n\n![Image](img/image00767.jpeg) Null—有时，你没有值可以存储在变量中，可能是因为该变量尚未被创建，或者你不再使用它。此时，你可以将变量设置为\
  \ `null`。这样一来，你就可以在代码中检查变量的值，并仅在它不为 `null` 时才使用它：\n\n```javascript\nvar newVar =\
  \ null;\n```\n\n> Note\n> JavaScript 是一门无类型语言，这意味着你不需要告诉浏览器变量是什么数据类型；解释器会自动为变量确定正确的数据类型。\n\
  \n## 使用运算符\n\nJavaScript 运算符提供了更改变量值的能力。你已经熟悉了 `=` 运算符，因为你已经在书中使用了它好几次了。JavaScript\
  \ 提供了几种运算符，它们可以被分为两类——算术运算符和赋值运算符。\n\n### 算术运算符\n\n算术运算符用于在变量和直接值之间执行操作。表 5.1 显示了算术运算列表以及所应用的结果。\n\
  \n![Image](img/image00848.jpeg)\n\n**表 5.1 显示 JavaScript 算术运算符以及基于 y=4 初始值的的结果**\n\
  \n> Tip\n> `+` 运算符也可以用于相加字符串或字符串与数字相加。这允许你快速拼接字符串并将数值数据加到输出字符串中。表 5.1 显示，当相加数值值和字符串值时，数值值会被转换为字符串，然后将两个字符串进行拼接。\n\
  \n### 赋值运算符\n\n赋值运算符用于给变量赋值。你可能习惯了 `=` 运算符，但还有几种形式允许你在赋值时对数据进行操纵。表 5.2 显示了赋值操作列表以及所应用的结果。\n\
  \n![Image](img/image00849.jpeg)\n\n**表 5.2 JavaScript 赋值运算符以及基于 x=10 初始值的的结果**\n\
  \n## 应用比较运算符和条件运算符\n\n条件判断是将逻辑应用到应用程序中的方法，使得某些代码仅在正确的条件下执行。这是通过对变量值应用比较逻辑来实现的。接下来的章节描述了\
  \ JavaScript 中可用的比较以及如何在条件语句中使用它们。\n\n### 比较运算符\n\n比较运算符评估两部分数据，如果评估正确则返回 true，如果评估不正确则返回\
  \ false。比较运算符将运算符左侧的值与右侧的值进行比较。\n\n帮助你理解比较的最简单方法是提供一个包含示例的列表。表 5.3 显示了比较运算符列表以及示例。\n\
  \n![Image](img/image00850.jpeg)\n\n**表 5.3 JavaScript 比较运算符以及基于 x=10 初始值的的结果**\n\
  \n你可以使用逻辑运算符将多个比较链在一起。表 5.4 显示了逻辑运算符列表以及如何使用它们将比较链在一起。\n\n![Image](img/image00851.jpeg)\n\
  \n**表 5.4 JavaScript 比较运算符以及基于 x=10 和 y=5 初始值的的结果**\n\n### If\n\n`if` 语句允许你根据比较评估的结果来分离代码执行。语法在下面的代码行所示，其中条件运算符位于\
  \ `()` 括号中，如果条件评估为真则要执行的代码位于 `{}` 大括号中：\n\n```javascript\nif(x==5){\n  do_something();\n\
  }\n```\n\n除了执行 `if` 语句块内的代码外，你还可以指定一个 `else` 块，它只在条件为假时被执行。例如：\n\n```javascript\n\
  if(x==5){\n  do_something();\n} else {\n  do_something_else();\n}\n```\n\n你还可以将\
  \ `if` 语句链在一起。要做到这一点，添加一个条件语句以及一个 `else` 语句。例如：\n\n```javascript\nif(x<5){\n  do_something();\n\
  } else if(x<10) {\n  do_something_else();\n} else {\n  do_nothing();\n}\n```\n\n\
  ### switch\n\n另一种条件逻辑是 `switch` 语句。`switch` 语句允许你评估一次表达式，然后根据值执行许多代码段之一。\n\n`switch`\
  \ 语句的语法如下：\n\n点击此处查看代码图像\n\n```javascript\nswitch(expression){\n  case value:\n\
  \    <code to execute>\n    break;\n  case value2:\n    <code to execute>\n    break;\n\
  \  default:\n    <code to execute if not value or value2>\n}\n```\n\n这是发生的情况。`switch`\
  \ 语句将完全评估表达式并获得一个值。该值可以是字符串、数字，甚至是一个对象。然后，`switch` 值将通过 `case` 语句与每个值进行比较。如果值匹配，则执行\
  \ `case` 语句中的代码。如果没有值匹配，则执行 `default` 代码。\n\n> Note\n> 通常，每个 `case` 语句末尾都会包含一个 `break`\
  \ 命令，以指示退出 `switch` 语句。如果没有找到 `break`，代码执行将继续到下一个 `case` 语句。\n\n## 动手尝试：在 JavaScript\
  \ 中应用 If 逻辑\n\n为了巩固 JavaScript 逻辑，使用以下步骤为动态网页构建条件逻辑。HTML 文档的最终版本如列表 5.3 所示：\n\n\
  1. 在 `lesson5` 文件夹中创建一个名为 `if_logic.html` 的源文件。\n2. 在 `5` 目录下创建一个名为 `images` 的文件夹。\n\
  3. 将你自己的 `day.png` 和 `night.png` 添加到 `./images` 文件夹中或从书籍网站下载。\n4. 添加常规元素（`html`、`head`、`body`）。\n\
  5. 添加以下 `<script>` 元素，使用 `Date().getSeconds()` JavaScript 代码获取课程值。该代码使用 `if` 语句判断时间并执行两件事：在屏幕上写问候语并设置\
  \ `timeOfDay` 变量的值：\n\n点击此处查看代码图像\n\n```javascript\n<script>\nfunction writeIt(){\n\
  \  var lesson = new Date().getSeconds();\n  var timeOfDay;\n  if(lesson>=7 && lesson<12){\n\
  \    document.write(\"Good Morning!\");\n    timeOfDay=\"morning\";\n  } else if(lesson>=12\
  \ && lesson<18) {\n    document.write(\"Good Day!\");\n    timeOfDay=\"day\";\n\
  \  } else {\n    document.write(\"Good Night!\");\n    timeOfDay=\"night\";\n  }\n\
  }\n</script>\n```\n\n6. 现在添加以下 `switch` 语句，使用 `timeOfDay` 的值来确定在网页中显示的图像：\n\n点击此处查看代码图像\n\
  \n```javascript\nswitch(timeOfDay){\n  case \"morning\":\n  case \"day\":\n    document.write(\"\
  <img src='images/day.png' />\");\n    break;\n  case \"night\":\n    document.write(\"\
  <img src='images/night.png' />\");\n    break;\n  default:\n    document.write(\"\
  <img src='images/day.png' />\");\n}\n```\n\n7. 保存文件并在浏览器中查看。输出应与图 5.3 相似，取决于具体时间。\n\
  \n![Image](img/image00852.jpeg)\n\n**图 5.3 writeIt() 函数在 body 加载时执行，并更改网页上显示的问候语和图像。**\n\
  \n**列表 5.3 if_logic.html 在 JavaScript 中使用条件逻辑简单示例**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>If Logic</title>\n```\n\n\n\n\n\n```html\n<meta\
  \ charset=\"utf-8\" />\n<script>\n  function writeIt(){\n    var hour = new Date().getHours();\n\
  \    var timeOfDay;\n    if(hour>=7 && hour<12){\n      document.write(\"Good Morning!\"\
  );\n      timeOfDay=\"morning\";\n    } else if(hour>=12 && hour<18) {\n      document.write(\"\
  Good Day!\");\n      timeOfDay=\"day\";\n    } else {\n      document.write(\"Good\
  \ Night!\");\n      timeOfDay=\"night\";\n    }\n    switch(timeOfDay){\n      case\
  \ \"morning\":\n      case \"day\":\n        document.write(\"<img src='../images/day.png'\
  \ />\");\n        break;\n      case \"night\":\n        document.write(\"<img src='../images/night.png'\
  \ />\");\n        break;\n      default:\n        document.write(\"<img src='../images/day.png'\
  \ />\");\n    }\n  }\n</script>\n</head>\n<body onload=\"writeIt()\">\n</body>\n\
  </html>\n```\n\n## 实现循环\n\n循环是一种多次执行同一段代码的方法。当你需要对一组 DOM 对象执行相同任务，或者当你正在动态创建一个项目列表时，这种方法非常有用。\n\
  \nJavaScript 提供了执行 `for` 和 `while` 循环的功能。接下来的章节描述了如何在 JavaScript 中实现循环。\n\n### while\
  \ 循环\n\nJavaScript 中最基础的循环类型是 `while` 循环。`while` 循环测试一个表达式，并继续执行其 `{}` 括号包含的代码，直到该表达式的值为\
  \ `false`。\n\n例如，以下 `while` 循环将一直执行到 `i` 的值等于 5 为止：\n\n点击此处查看代码图片\n\n```javascript\n\
  var i = 1;\n\nwhile (i<5){\n  document.write(\"Iteration \" + i + \"<br>\");\n \
  \ i++;\n}\n```\n\n浏览器的最终输出如下：\n\nIteration 1\nIteration 2\nIteration 3\nIteration\
  \ 4\n\n### do/while 循环\n\n另一种类型的 `while` 循环是 `do`/`while` 循环。如果你总是希望至少执行一次循环中的代码，并且在代码至少执行一次之前无法测试表达式，那么它非常有用。\n\
  \n例如，以下 `do`/`while` 循环将一直执行到 `day` 的值等于 Wednesday（周三）为止：\n\n点击此处查看代码图片\n\n```javascript\n\
  var days = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\n\
  var i=0;\n\ndo{\n  var day=days[i++];\n  document.write(\"It's \" + day + \"<br>\"\
  );\n} while (day != \"Wednesday\");\n```\n\n浏览器的最终输出如下：\n\nIt's Monday\nIt's Tuesday\n\
  It's Wednesday\n\n### for 循环\n\nJavaScript 的 `for` 循环允许你通过 `for` 语句执行特定次数的代码，该语句使用以下语法将三个语句合并为一个：\n\
  \n点击此处查看代码图片\n\n```javascript\nfor (statement 1; statement 2; statement 3){\n  code\
  \ to be executed;\n}\n```\n\n`for` 语句对这三个语句的使用方式如下：\n\n- `statement 1`：在循环开始前执行且不再执行。这用于初始化将在循环中使用的变量。\n\
  - `statement 2`：在循环每次迭代之前评估的表达式。如果该表达式的值为 `true`，则执行循环；否则 `for` 循环结束。\n- `statement\
  \ 3`：在每次迭代执行完代码后执行。\n\n`for` 语句按如下方式使用这三个语句：\n\n- `statement 1`：用于初始化循环中使用的变量。\n\
  - `statement 2`：在循环每次迭代之前评估的表达式。如果该表达式的值为 `true`，则执行循环；否则 `for` 循环结束。\n- `statement\
  \ 3`：在每次迭代执行完代码后执行。\n\n为了说明 `for` 循环，请 `               的次数：\n\n点击此处查看代码图片\n\n以下示例展示了嵌套的\
  \ for 循环：\n\n```javascript\nfor (var x=1; x<3; x++){\n  for (var y=1; y<3; y++){\n\
  \    document.write(\"x=\" + x + \", y=\" + y + \"<br>\");\n  }\n}\n```\n\n浏览器的最终输出如下：\n\
  \nx=1, y=1\nx=1, y=2\nx=1, y=3\nx=2, y=1\nx=2, y=2\nx=2, y=3\n\n### for...in 循环\n\
  \n另一种 `for` 类型是 `for...in` 循环。当你需要遍历对象的所有属性时，它非常有用。`for...in` 循环允许你通过对象的属性名来执行代码。以下示例展示了\
  \ `for...in` 循环的使用：\n\n点击此处查看代码图片\n\n```javascript\nvar person = {name: \"John\"\
  , age: 30, city: \"New York\"};\nfor (var key in person){\n  document.write(key\
  \ + \": \" + person[key] + \"<br>\");\n}\n```\n\n浏览器的最终输出如下：\n\nname: John\nage:\
  \ 30\ncity: New York\n\n### for...of 循环\n\n`for...of` 循环允许你遍历数组、字符串或其他可迭代对象的值。与\
  \ `for...in` 不同，它遍历的是值。以下示例展示了 `for...of` 循环的使用：\n\n点击此处查看代码图片\n\n```javascript\n\
  var fruits = [\"apple\", \"banana\", \"orange\"];\nfor (var fruit of fruits){\n\
  \  document.write(fruit + \"<br>\");\n}\n```\n\n浏览器的最终输出如下：\n\napple\nbanana\norange\n\
  \n\n\n\n\n要调用 `greeting()` 函数，我们需要传入一个 `name` 值和一个 `city` 值。该值可以是直接值，也可以是之前定义的变量。为了说明这一点，下面的代码将使用\
  \ `name` 变量和 `city` 的直接字符串来执行 `greeting()` 函数：\n\n```\nvar name = \"Brad\";\n\n\
  greeting(name, \"Florence\");\n```\n\n### 函数的返回值\n\n通常，函数需要向调用代码返回一个值。通过添加 `return`\
  \ 关键字后跟一个变量或值，可以从函数返回该值。例如，下面的代码调用了一个函数来格式化字符串，将函数返回的值赋值给变量，然后将该值写入浏览器：\n\n点击此处代码图片\n\
  \n```javascript\nfunction formatGreeting(name, city){\n  var retStr = \"\";\n  retStr\
  \ += \"Hello <b>\" + name + \"</b>><br>\";\n  retStr += \"Welcome to \" + city +\
  \ \"!\";\n  return retStr;\n}\n\nvar greeting = formatGreeting(\"Brad\", \"Rome\"\
  );\ndocument.write(greeting);\n```\n\n你可以在函数中包含多个 `return` 语句。当函数遇到 `return` 语句时，函数的执行将立即停止。如果\
  \ `return` 语句包含要返回的值，则返回该值。下面的示例显示了一个测试输入的函数，如果输入为零立即返回：\n\n点击此处代码图片\n\n```javascript\n\
  function myFunc(value){\n  if (value == 0)\n    return;\n  code_to_execute_if_value_nonzero;\n\
  }\n```\n\n***\n\n### 动手尝试：创建 JavaScript 函数\n\n为了巩函数，请按照以下步骤将函数集成到 JavaScript 应用中。以下步骤将引导你完成创建函数、调用它执行代码，然后处理返回结果的过程：\n\
