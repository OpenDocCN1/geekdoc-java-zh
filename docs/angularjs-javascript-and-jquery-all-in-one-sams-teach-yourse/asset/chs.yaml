  27</html\n```\n\n### 使用过滤器 (Filters)\n\nAngularJS 的一个强大特性是实现过滤器的能力。过滤器是提供者的一种，它挂接到表达式解析器并修改表达式的结果以便在视图中显示——例如，格式化时间或货币值。\n\
  \n你在表达式内部实现过滤器，并使用以下语法：\n\n`{{ expression | filter}}`\n\n如果你将多个过滤器链在一起，它们将按照你指定的顺序进行执行：\n\
  \n点击此处查看代码图像\n\n`{{ expression | filter | filter }}`\n\n某些过滤器允许你以函数参数的形式提供输入。你通过使用以下语法添加这些参数：\n\
  \n点击此处查看代码图像\n\n`{{ expression | filter:parameter1:parameter2 }}`\n\n此外，你还可以向控制器和服务中添加过滤器，过滤器的名称为过滤器的名称。例如，过滤器名为\
  \ `currencyFilter`。过滤器作为函数，以表达式作为第一个参数，后续是其他参数：\n\n点击此处查看代码图像\n\n```javascript\n\
  controller('myController', '$scope', 'currencyFilter',\n          function($scope,\
  \ currencyFilter){\n  $scope.getCurrencyValue = function(value){\n  return currencyFilter(value,\
  \ \"$USD\");\n\n\n#### 使用内置过滤器\n\nAngularJS 提供了多种过滤器，允许你轻松地格式化 模板中的字符串、对象和数组。[表\
