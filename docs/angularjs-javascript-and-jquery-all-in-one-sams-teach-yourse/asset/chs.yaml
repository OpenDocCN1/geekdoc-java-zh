  \ </div>\n```\n\n***\n\n### 总结\n\nAngularJS 最强大的功能之一是创建自定义指令的能力。在 `Module` 对象上使用\
  \ `directive()` 方法在代码中实现自定义指令是非常简单的。然而，由于实现方式多种多样，指令也可以变得非常复杂。本节让你略微体验了在 AngularJS\
  \ 中通过自定义指令可以做些什么。尝试花些时间研究这些示例并编写一些你自己的代码，以尽可能熟悉熟悉它们的工作原理。\n\n### 问答\n\n**Q. 是否有方法可以确保我为自定义指令选择的名称不会被其他人使用？**\n\
  \n**A.** 目前没有强制执行此点的方法。最好的方法是想出一个唯一的缩写，作为你自定义 AngularJS 指令的前缀。\n\n**Q. 将自定义指令实现为标签（tag）、属性（attribute）、类（class）还是注释名更好吗？**\n\
  \n**A.** 最佳实践是在合适的情况下使用标签或属性名，而不是注释名和类名。\n\n### 工作坊\n\n工作坊由一组问题和答案组成，旨在巩固你对本小时所涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\
  \n### 测验\n\n**1.** 正确或错误：在自定义指令中使用 scope 时，scope 必须与父 scope 共享。\n\n**2.** 正确或错误：属性\
  \ `'type'` 可以被设置为一个不是 HTML 根节点的字符串。\n\n**3.** 在向指令添加控制器（controller）时，指示注入器服务（injector\
  \ service）在父环境中查找控制器的语法是什么？\n\n**4.** 你应该使用哪个函数来在自定义指令中操作 DOM？\n\n### 测验答案\n\n**1.**\
  \ 错误。scope 可以共享父 scope、继承父 scope，或者作为它自己的隔离作用域（isolate scope）。\n\n**2.** 正确。`'type'`\
  \ 不仅可以用于 HTML，还可以用于 `svg` 和 `math` 元素。\n\n**3.** 在指令中使用 `require: '^controllerName'`\
  \ 。\n\n**4.** `link` 和 `compile` 函数。\n\n#### 练习题\n\n**1.** 修改 列表 25.1 和 25.2 中的示例代码。添加一个类似于\
  \ `bwidth` 参数的 `bheight` 参数，用于设置方框的高度和宽度。\n\n**2.** 修改 列表 25.3 和 25.4 中的示例代码。添加一个名为\
  \ `movit` 的新指令，用于改变元素在页面上的 x 和 y 坐标。你需要将元素设置为绝对定位。\n\n**3.** 修改 列表 25.6 中的示例代码，创建一个第二个\
  \ `<my-photos>` 块并包含 10 或 15 张额外的图片，这样你就可以看到复用自定义指令有多简单。\n\n## 第 26 节 使用事件与模型交互\n\
  \n事件是 AngularJS 中最重要的部分之一。具体来说，本节将讨论四种类型的事件：浏览器事件、用户交互事件、基于 scope 的事件以及自定义事件。你已经在之前的课程中接触了其中一些。在本节中，你将学习处理：\n\
  \n本节你将学到：\n- 如何使用 `$watch` 跟踪变量\n- 如何使用 `ng` 指令\n- 如何发射自定义\n- 如何实现自定义事件\n\n### 浏览器事件\n\
  \n若干事件由浏览器触发。在某种意义上，当这些知道这些事件非常有用。浏览器事件包括文档加载时的 ready 事件以及浏览器调整大小时的 resize 事件。这些也是用户交互事件。\n\
  \n### 用户交互事件\n\n你已经接触过用户事件。这些包括鼠标和键盘事件，以及诸如焦点（focus）和失去焦点（blur）之类的事件。通常有两个地方你会实现交互。一个是是使用\
  \ `ng` 指令，例如 `ngclick`。第二个地方是在自定义指令的 link 函数。你已经在之前的课程中接触过这两种方法；在本节中，你将看到你有权选择使用哪一种。使用内置\
  \ `ng` 事件指令如 `ngClick` 的优点是你不必为简单的添加自定义指令的复杂性。\n\n你不应该在控制器中进行 DOM 操作，而那是定义处理器的地方。另一个缺点是每当你需要该功能时，都需要在模板中实现\
  \ `ngClick` 代码。例如，考虑以下为元素添加鼠标事件处理程序的模板代码：\n\n```html\n<span ng-mouseenter=\"mouseEntered(event)\"\
  \n      ng-mouseleave=\"mouseLeft(event)\"\n      ng-click=\"clicked(event)\">\n\
  ```\n\n代码看起来并不糟糕，但如果你在多个地方都需要相同的功能呢？如果它们落在 `ng-repeat` 块中，那么还不算糟糕，否则会很麻烦。遵循的一个良好规则是，如果你想在多个地方使用该功能，特别是如果你会在多个应用程序中复用它，就应该定义一个实现的自定义指令。\n\
  \n### 添加 $watches 来跟踪 scope 变化事件\n\n另一个你将常用的事件不是由浏览器触发，而是由模型数据的更改触发。这种能力使你能够对模型变化做出响应，而无需在可能改变值的地方添加代码。这种能力非常有用，因为模型中的数据可能会以各种方式变化——用户输入、服务更新等。\n\
  \n#### 使用 $watch 跟踪 scope 变量\n\n\n\n\n\n要添加处理作用域（scope）值更改的能力，你需要使用 AngularJS 内置的\
  \ `$watch` 功能为作用域中的变量添加 `$watch`。作用域中的 `$watch` 函数语法如下：\n\n点击此处查看代码图片\n\n```\n$watch(watchExpression,\
  \ listener, [objectEquality])\n```\n\n`watchExpression` 是要监听的作用域中的表达式。该表达式在每次 `$digest()`\
  \ 时都会被调用，并返回被监听的值。`listener` 定义了一个函数，当 `watchExpression` 的值变为一个新值时，该函数会被调用。如果 `watchExpression`\
  \ 的值变为了它已设置的值，则不会调用 `listener`。`objectEquality` 是一个布尔值，当为 `true` 时，将使用 `angular.equals()`\
  \ 函数来判断相等性，而不是使用更严格的 `===` 运算符。在使用 `objectEquality` 时应小心，因为对于复杂对象，它可能会导致内存和性能消耗的增加。\n\
  \n以下展示了在作用域变量 `score` 上添加 `$watch` 的示例：\n\n点击此处查看代码图片\n\n```javascript\n$scope.score\
  \ = 0;\n\n$scope.$watch('score', function(newValue, oldValue) {\n  if(newValue >\
  \ 10){\n    $scope.status = 'win';\n  }\n});\n```\n\n### 使用 $watchGroup 跟踪多个作用域变量\n\
  \nAngularJS 还提供了使用 `$watchGroup` 方法监听表达式数组的能力。`$watchGroup` 方法的工作方式与 `$watch` 相同，不同之处第一个参数是需要监听的表达式数组。`listener`\
  \ 将接收一个包含所监听变量的新值和旧值的数组。例如，如果你想监听 `score` 和 `time` 变量，可以使用以下代码：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$scope.score = 0;\n$scope.time = 0;\n\n$scope.$watchGroup(['score',\
  \ 'time'], function(newValues, oldValues) {\n  if(newValues[0] > 10){\n    $scope.status\
  \ = 'win';\n  } else if (newValues[1] > 5){\n    $scope.status = 'times up';\n \
  \ }\n});\n```\n\n### 使用 $watchCollection 跟踪作用域中对象属性的变化\n\n你也可以使用 `$watchCollection`\
  \ 方法监听对象的属性。`$watchCollection` 方法接受对象作为第一个参数，并监听该对象的属性。在数组的情况下，数组的各个值会被监听。例如：\n\n\
  点击此处查看代码图片\n\n```javascript\n$scope.scores = [5, 10, 15, 20];\n\n$scope.$watchGroup('scores',\
  \ function(newValue, oldValue) {\n  $scope.newScores = newValue;\n});\n```\n\n***\n\
  \n### 动手实践：在控制器中实现监听器（Watches）\n\n在这个示例中，你有机会在控制器中实现监听器、分组监听和集合监听，以跟踪更改并动态更新视图。代码列表\
  \ 26.1 和 26.2 中的代码演示了一个实现 `$watch`、`$watchGroup` 和 `$watchCollection` 方法的简单示例。\n\
  \n列表 26.1 中的代码实现了一个控制器，在作用域中存储了值 `myColor`、`hits`、`misses` 以及一个名为 `myObj` 的对象。列表\
  \ 26.2 中的代码实现了一个 AngularJS 模板，该模板提供了更改值并查看更新监听项的交互。\n\n使用以下步骤构建监听作用域中值的应用程序：\n\n\
  1. 添加 `lesson26/scope_watch.html` 和 `lesson26/js/scope_watch.js` 文件。\n2. 将 列表 26.1\
  \ 和 列表 26.2 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. 列表 26.1 中的代码首先设置了几个作用域值，包括 `myColor`、`hits`\
  \ 和 `misses`，这些值将被监听。控制器还定义了 `setColor()`、`hit()` 和 `miss()` 函数，允许从浏览器更改这些值。\n4.\
  \ 列表 26.1 中的以下几行代码对作用域中的 `myColor` 值实现了 `$watch`，以便每当 `myColor` 改变时，`myObj.color`\
  \ 的值也能随之调整。\n5. 列表 26.1 中的以下几行代码对作用域中的 `hits` 和 `misses` 值实现了 `$watchGroup`，以便每当它们变化时，`myObj.hits`\
  \ 和 `myObj.misses` 的值也会改变。\n6. 列表 26.1 中的以下几行代码对作用域中的 `myObj` 对象实现了 `$watchCollection`，以便每当\
  \ `myObj` 改变时，作用域中的 `changes` 值就会递增，以跟踪 `myColor`、`hits` 和 `misses` 变化次数。\n7. 列表\
  \ 26.2 中的代码实现了一个 AngularJS 模板，使用户可以使用鼠标选择颜色并增加 `hits` 和 `misses` 变量。对象和更改值显示在底部，展示了\
  \ `$watch` 方法如何检测并更新作用域的变化。\n8. 在浏览器中打开 `scope_watch.html` 并更改颜色、增加 hits 和 misses，观察\
  \ `myObj` 和 `changes` 中监听值的变化。图 26.1 显示了渲染后的网页。\n\n![Image](img/image1034.jpeg)\n\
  \n**图 26.1** 用于监听作用域变量值的 `$watch()`、`$watchGroup()` 和 `$watchCollection()` 处理程序。\n\
  \n**列表 26.1 `scope_watch.js` 实现监听作用域变量值的 `$watch()`、`$watchGroup()` 和 `$watchCollection()`\
  \ 处理程序**\n\n点击此处查看代码图片\n\n***\n\n```javascript\nangular.module('myApp', [])\n.controller('myController',\
  \ function ($scope) {\n  $scope.mColors = ['red', 'green', 'blue'];\n  $scope.myColor\
  \ = '';\n  $scope.hits = 0;\n  $scope.misses = 0;\n  $scope.changes = 0;\n  $scope.myObj\
  \ = {color: '', hits: '', misses: ''};\n  $scope.setColor = function (color) {\n\
  \    $scope.myColor = color;\n  };\n  $scope.hit = function () {\n    $scope.hits\
  \ += 1;\n  };\n  $scope.miss = function () {\n    $scope.misses += 1;\n  };\n  $scope.$watch('myColor',\
  \ function(newValue, oldValue) {\n    $scope.myObj.color = newValue;\n  });\n  $scope.$watchGroup(['hits',\
  \ 'misses'], function(newValues, oldValues) {\n    $scope.myObj.hits = newValues[0];\n\
  \    $scope.myObj.misses = newValues[1];\n  });\n  $scope.$watchCollection('myObj',\
  \ function (newValue, oldValue) {\n    $scope.changes += 1;\n  });\n});\n```\n\n\
  ***\n\n**列表 26.2 `scope_watch.html` 提供与 列表 26.1 中定义的作用域和控制器交互的 HTML 模板代码**\n\n点击此处查看代码图片\n\
  \n\n\n\n作用域（scopes）的一个强大特性是可以在作用域层级中发射和广播事件。事件允许你向作用域中的不同级别发送通知，告知事件已发生。事件可以是你选择的任何内容，例如值改变或达到阈值。这在许多情况下都非常有用，例如让子作用域知道父作用域中的值发生了变化，反之亦然。\n\
  \n### 向父级作用域层级发射自定义事件\n\n要从作用域发射事件，你可以使用 `$emit()` 方法。该方法通过父级作用域层级向上发送事件。任何注册了该事件的祖先作用域都会收到通知`$emit()`\
  \ 方法使用以下语法，其中 `name` 是事件名称，`args` 是传递给事件处理函数的零或多个参数：\n\n点击此处查看代码图像\n\n```\nscope.$emit(name,\
  \ [args, . . .])\n```\n\n### 向子级作用域层级广播自定义事件\n\n你还可以通过 `$broadcast()` 方法通过子级作用域层级向下广播事件。任何注册了该事件的后代作用域都会收到通知。`$broadcast()`\
  \ 方法使用以下语法，其中 `name` 是事件名称，`args` 是传递给事件处理函数的零或多个参数：\n\n点击此处查看代码图像\n\n```\nscope.$broadcast(name,\
  \ [args, . . .])\n```\n\n### 使用监听器处理自定义事件\n\n要处理发射或广播的事件，你可以使用 `$on()` 方法。`$on()`\
  \ 方法使用以下语法，其中 `name` 是要监听的事件名称：\n\n```\nscope.$on(name, listener)\n```\n\nlistener\
  \ 参数是一个函数，它接受事件作为第一个参数，并将由 `$emit()` 或 `$broadcast()` 方法传递的任何参数作为后续参数。`event` 对象具有以下属性：\n\
  \n![Image](img/image00767.jpeg) **targetScope:** 调用 `$emit()` 或 `$broadcast()` 的作用域。\n\
  \n![Image](img/image00767.jpeg) **currentScope:** 当前正在处理事件的作用域。\n\n![Image](img/image00767.jpeg)\
  \ **name:** 事件的名称。\n\n![Image](img/image00767.jpeg) **stopPropagation():** 一个停止事件沿作用域层级向上或向下传播的函数。\n\
  \n![Image](img/image00767.jpeg) **preventDefault():** 一个防止浏览器事件默认行为的函数，但只执行你自己的自定义代码。\n\
  \n![Image](img/image00767.jpeg) **defaultPrevented:** 一个布尔值，如果调用了 `event.preventDefault()`\
  \ 则为 `true`。\n\n***\n\n### 动手尝试：在嵌套控制器中实现自定义事件\n\n在这个示例中，你使用自定义事件在两个控制器之间通信变化，其中一个嵌套在另一个内部。列表\
  \ 26.3 和列表 26.4 中的代码提供了 AngularJS 应用和模板，说明了如何使用 `$emit()`、`$broadcast()` 和 `$on()`\
  \ 在作用域层级中上下发送和处理事件。\n\n在示例中，父作用域中存储了一个角色列表。你可以轻松地点击列表中的角色来显示包含子作用域中的角色信息。你还可以删除子作用域中的角色，这将将其从父作用域的列表中移除。\n\
  \n使用以下步骤构建带有嵌套控制器和作用域的应用程序：\n\n**1.** 添加 `lesson26/scope_events.html`和`lesson26/js/scope_events.js`文件。\n\
  \n**2.** 将列表 26.3 中和列表 26.4 中所示的代码添加到 HTML 和 JavaScript 文件中。\n\n**3.** 列表 26.3 中的以下几行代码实现了名为\
  \ `Characters`的父作用域控制器。作用域中定义了一个角色名称数组，并将 `currentName` 值设置为数组中的第一个元素：\n\n点击此处查看代码图像\n\
  \n```\n02  controller('Characters', function($scope) {\n03    $scope.names = ['Frodo',\
  \ 'Aragorn', 'Legolas', 'Gimli'];\n04    $scope.currentName = $scope.names[0];\n\
  ...\n15  }).\n```\n\n**4.** `changeName()` 函数更改作用域中的 `currentName` 值，然后广播一个 `CharacterChanged`\
  \ 事件。注意 `changeName()` 使用了`this`关键字来访问 `name` 属性。`name` 属性来自一个动态子作用域，该作用域是因为在列表\
  \ 26.4 中使用以下指令生成多个元素而创建的：\n\n点击此处查看代码图像\n\n```\n05    $scope.changeName = function()\
  \ {\n06      $scope.currentName = this.name; \n07      $scope.$broadcast('CharacterChanged',\
  \ this.name);\n08  };\n```\n\n**5.** 以下 `CharacterDeleted` 事件由 `$on('CharacterDeleted')`\
  \ 处理并从列表中移除角色，这将反映在父作用域的列表中：点击此处查看代码图像\n\n```\n05  $scope.changeName = function()\
  \ {\n09    $scope.$on('CharacterDeleted', function(event, removeName){\n10     \
  \ var i = $scope.names.indexOf(removeName);\n11      $scope.names.splice(i, 1);\n\
  12      $scope.currentName = $scope.names[0];\n13      $scope.$broadcast('CharacterChanged',\
  \ $scope.currentName);\n14  });\n```\n\n**6.** 列表 26.3 中的以下几行代码定义了一个名为 `Character`的子作用域。`CharacterChanged`\
  \ 事件由 `$on('CharacterChanged')` 处理并设置作用域中的 `currentInfo` 值，这将更新页面元素。`deleteChar()`\
  \ 函数从`Character`作用域删除角色并使用 `$emit` 发送 `CharacterDeleted` 事件到父级，以便在 `Characters`\
  \ 控制器中处理：点击此处查看代码图像\n\n```\n16  controller('Character', function($scope) {\n17 \
  \   $scope.info = {'Frodo': { weapon: 'Sting', race: 'Hobbit'},\n19      'Aragorn':\
  \ { weapon: 'Sword', race: 'Man'},\n21      'Legolas': { weapon: 'Bow', race: 'Elf'},\n\
  23      'Gimli': { weapon: 'Axe', race: 'Dwarf'}};\n25    $scope.currentInfo = $scope.info['Frodo'];\n\
  26    $scope.$on('CharacterChanged', function(event, newCharacter){\n27      $scope.currentInfo\
  \ = $scope.info[newCharacter];\n28  });\n29    $scope.deleteChar = function() {\n\
  30      delete $scope.info[$scope.currentName];\n31      $scope.$emit('CharacterDeleted',\
  \ $scope.currentName);\n32    };\n33  });\n```\n\n**7.** 列表 26.4 中的 AngularJS 模板代码实现了嵌套的\
  \ `ng-controller` 语句，这些语句生成了作用域层级并显示了角色的作用域值。此代码还包含了一些基础的 CSS 样式，使 span 看起来像按钮并在页面上定位元素。\n\
  \n**8.** 在浏览器中加载 `scope_events.html` 文件。图 26.2 显示了生成的网页。当你点击角色名称时，会显示该角色的信息，当你点击删除按钮时，该角色将从按钮和信息部分被删除。\n\
  \n![Image](img/image01035.jpeg)\n\n**图 26.2** 使用 `$broadcast()` 和 `$emit()` 在作用域层级中发送更改和删除事件。\n\
