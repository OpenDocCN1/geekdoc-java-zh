  \ 和 `lesson14/css/image_slider.css` 文件。\n\n**2.** 将[列表 14.1]和[列表 14.3]所示的代码添加到 HTML\
  \ 和 CSS 文件中。HTML 了一组 `<div>` 元素，这些元素将包含图片滑块、控制按钮和显示的图像。CSS 代码对图像和 `<div>` 元素进行样式处理。特别请注意以下几行。这些行定义了具有特定宽度和溢出的滑动区域、包含所有图像元素的子\
