  , duration:1500},\n```\n\n## 第 18 节 使用 jQuery UI 交互组件的高级交互\n\n**你将在本节中学到：**\n\n\
  ![Image](img/image00767.jpeg) 实现拖放功能\n\n![Image](img/image00767.jpeg) 让元素及其子元素可调整大小\n\
  \n![Image](img/image00767.jpeg) 如何使用边界框选择多个页面元素\n\n![Image](img/image00767.jpeg)\
  \ 创建可排序的表格、列表和容器\n\n一组特殊的 jQuery UI 组件旨在为各种元素提供通用的交互。这些组件允许你让元素变得可拖动和放置，并为元素提供排序、框选择和调整大小的功能。\n\
  \njQuery UI 交互组件可以附加到元素上，以提供一组丰富的预定义交互。以下章节将介绍不同的交互组件以及如何在你的网页中实现它们。\n\n### 介绍 jQuery\
  \ UI 交互\n\n所有的 jQuery UI 交互都基于两个主要组件——`jQuery.widget` 工厂和鼠标组件（mouse widget）。`jQuery.widget`\
  \ 工厂提供了所有组件的基础功能，包括创建、禁用、启用和选项设置。鼠标组件提供了与组件的基础鼠标交互，它捕获鼠标事件并允许组件与其进行交互。\n\n#### 复习\
  \ jQuery.widget 工厂\n\n`jQuery.widget` 工厂定义了一个所有 jQuery UI 组件都使用的接口。工厂的选项、方法和事件对所有组件都可用。表\
  \ 18.1 列出了工厂中定义并在所有组件中可用的方法和事件。\n\n![Image](img/image00961.jpeg)\n\n**表 18.1 所有\
  \ jQuery UI 组件可用的方法和事件**\n\n你可以在 [`api.jqueryui.com/jQuery.widget/`](http://api.jqueryui.com/jQuery.widget/)\
  \ 获取更多关于 `jQuery.widget` 工厂的信息。\n\n#### 理解鼠标交互组件\n\n鼠标交互组件会自动应用到所有组件。通常情况下，你不需要与它进行太多交互。但是，它暴露了一些在某些非常有用的选项。这些选项如下：\n\
  \n![Image](img/image00767.jpeg) cancel—取消特定元素的交互。例如，要取消 `#item1` 中类类为 `\"label\"\
  ` 的元素的鼠标交互，你使用以下代码：\n\n点击此处查看代码图像\n\n```\n$( \"#item1\" ).mouse( \"option\", \"\
  cancel\", \".label\" );\n```\n\n![Image](img/image00767.jpeg) delay—在 `mousedown`\
  \ 事件发生后到交互发生之前延迟时间。例如，要为 `#item2` 的鼠标交互添加 1 秒延迟，请使用以下代码：\n\n点击此处查看代码图像\n\n```\n\
  $( \"#item2\" ).mouse( \"option\", \"delay\", 1000 );\n```\n\n![Image](img/image00767.jpeg)\
  \ distance—指定在 `mousedown` 事件发生后到交互开始之前鼠标必须移动的像素距离。例如，要将 `#item3` 的鼠标交互距离设置为 10\
  \ 像素，请使用以下代码：\n\n点击此处查看代码图像\n\n```\n$( \"#item3\" ).mouse( \"option\", \"distance\"\
  , 10 );\n```\n\n### 使用拖放组件\n\n现在你已经复习了组件接口和鼠标组件，准备好查看一些常见的交互组件了——可拖动（draggable）和可放置（droppable）。这些组件设计为协同工作。你可以定义一个元素为可拖动的，另一个为可放置的。\n\
  \n#### 使用 Draggable 组件拖动元素\n\ndraggable 组件通过按住鼠标并移动来将元素定义为可拖动。draggable 组件提供了多个选项来控制外观。表\
  \ 18.2 描述了更多 draggable 选项。以下是将 `draggable` 组件附加到元素的示例：\n\n```\n$(\"#img1\").draggable({cursor:\"\
  move\",\n```\n\n![Image](img/image0962.jpeg)\n\n**表 18.2 常用 draggable 选项**\n\ndraggable\
  \ 组件还提供了可以附加的额外事件。表 18.3 列出了在 draggable 项目上可以使用的事件。以下是添加 `dragstop` 事件以在掉落时应用 `bounce`\
