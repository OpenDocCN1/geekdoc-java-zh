  \ 是的，更改会被检测到并更新 DOM。\n**4](#part0037.xhtml_ch22qa04)** B 是 A 的父级。\n\n#### 练习题\n\
  **1](#part0037.xhtml_ch22lis01)** 修改列表 22.1，添加一个按钮，点击它时将作用域中的 `current` 值重置为 `start`\
  \ 值。\n**2](#part0037.xhtml_ch22lis02)** 修改列表 22.2，在作用域中添加另一个名为 `multiplyValues()`\
  \ 的函数，用于相乘值而不是相加值。\n**3](#part0037.xhtml_ch22lis03)** 修改列表 22.3，添加相应的表达式和按钮到模板以暴露该功能。\n\
  **4](#part0037.xhtml_ch22lis04)** 修改列表 22.4，添加一个在点击时增加作用域中值的表达式。\n\n## 23. 使用 AngularJS\
  \ 模板创建视图\n\n本节将学习：\n- 如何以及何时使用 AngularJS 表达式\n- 如何创建 AngularJS 模板\n- 如何使用内置 AngularJS\
  \ 过滤器\n- 如何创建自定义的 AngularJS 过滤器\n\nAngularJS 模板提供了向用户表示应用程序的框架。模板包含表达式、过滤器指令，它们为\
  \ DOM 元素添加额外的功能和行为。模板构建在普通 HTML 之，通过添加额外的元素和属性来扩展 HTML。\n\n本节关注 AngularJS 模板，以及表达式和过滤器。表达式允许你在\
  \ HTML 代码旁边实现类似 JavaScript 代码。过滤器允许你在显示数据之前对其进行转换。\n\n### 理解模板\nAngularJS 模板非常简单但非常强大且易于扩展。模板基于标准的\
  \ HTML 文档，但通过三个额外的组件扩展了 HTML 功能：\n\n- **表达式：** 表达式是在作用域范围内计算的类似 JavaScript 代码片段。表达式用\
  \ `{{}}` 括号表示。表达式的结果会被编译到 HTML 网页中。表达式可以放在普通的 HTML 文本或属性值中，如下：\n\n```html\n<p>{{1+2}}</p>\n\
  <a href=\"/myPage.html/{{hash}}\"></a>\n```\n\n- **过滤器：** 过滤器转换放置网页上的数据的外观。例如，过滤器可以将作用域中的数字转换为货币字符串或时间字符串。\n\
  - **指令：** 指令是 HTML 元素内部新的 HTML 元素名称或属性名称。它们通过添加和修改 HTML 元素的行为，为 AngularJS 应用提供数据绑定、事件处理以及其他支持。\n\
  \n\n\n\n\n以下代码段展示了指令、表达式和过滤器的实现。`ng-model=\"msg\"` 属性是一个指令，它将`<input>`元素的值绑定到作用域（scope）中的\
  \ `msg`。`{{}}` 括号中的代码是一个表达式，它应用了 `uppercase` 过滤器：\n\n```html\n<div>\n  <input ng-model=\"\
  msg\">\n  {{msg | uppercase}}\n</div>\n```\n\n当我们将一个 AngularJS 页面加载到浏览器中时，它是以原始状态加载的，其中包含了模板代码以及\
  \ HTML 代码。初始 DOM 是根据该网页构建的。当 AngularJS 应用程序启动（bootstrapped）时，AngularJS 模板会被编译到 DOM\
  \ 中，动态地调整 DOM 元素的值、事件绑定和其他属性，使其对应到模板中的指令、表达式和过滤器。\n\n在编译期间，HTML 标签和属性会进行归一化处理，以支持\
  \ AngularJS 是大小写敏感而 HTML 不敏感的事实。归一化主要做了两件事：\n\n![Image](img/image00767.jpeg) 移除元素和属性开头的\
  \ `x-` 和 `data-` 前缀。\n\n![Image](img/image00767.jpeg) 将带有 `:` 或 `-` 或 `_` 的名称转换为驼峰命名（camelCase）。\n\
  \n例如，以下所有内容都会归一化为 `ngModel`：\n\n- `ng-model`\n- `data-ng-model`\n- `x-ng:model`\n\
  - `ng_model`\n\n### 使用表达式\n\n使用表达式是在 AngularJS 视图表示作用域数据的最简单方法。表达式是封装在括号内的代码块：`{{expression}}`。AngularJS\
  \ 编译器会将表达式编译为 HTML 元素，以便将表达式的结果显示出来。例如，请看以下表达式：\n\n```html\n{{1+5}}\n{{'One' + 'Two'}}\n\
  ```\n\n基于这些表达式，网页显示了这些值：\n\n- 6\n- OneTwo\n\n表达式绑定到数据模型，这提供了两个巨大的优势。首先，你可以在表达式中使用作用域中定义的属性名和函数。其次，因为表达式绑定到作用域，所以当作用域中的数据变化时，表达式也会随之变化。例如，假设作用域包含以下值：\n\
  \n```javascript\n$scope.name='Brad';\n$scope.score=95;\n```\n\n你可以直接在模板表达式中引用 name\
  \ 和 score 值，如下所示：\n\n```html\nName: {{name}}\nScore: {{score}}\nAdjusted: {{score+5}}\n\
  ```\n\nAngularJS 表达式在许多方面与 JavaScript 表达式相似，但在以下方面不同：\n\n![Image](img/image00767.jpeg)\
  \ **属性求值：** 属性名是针对作用域模型求值的，而不是针对全局 JavaScript 命名空间。\n\n![Image](img/image00767.jpeg)\
  \ **容错性更高：** 表达式在遇到 undefined 或 null 变量类型时不会抛出异常；相反，它们将这些视为没有值。\n\n![Image](img/image00767.jpeg)\
  \ **无流程控制：** 表达式不允许 JavaScript 条件判断或循环。此外，你不能在表达式内部抛出错误。\n\nAngularJS 将用于定义指令标签中属性值的字符串求值为表达式。这允许你在一个定义中包含表达式类型的语法。例如，当你在模板中设置\
  \ `ng-click` 指令的值时，你指定了一个表达式。在该表达式内部，你可以引用作用域变量并使用其他表达式语法，如下所示：\n\n点击此处查看代码图像\n\n\
  ```html\n<span ng-click=\"scopeFunction()\"></span>\n<span ng-click=\"scopeFunction(scopeVariable,\
  \ 'stringParameter')\"></span>\n<span ng-click=\"scopeFunction(5*scopeVariable)\"\
  ></span>\n```\n\n因为 AngularJS 模板表达式可以访问作用域，你也可以可以在 AngularJS 表达式内部对作用域进行更改。例如，以下\
  \ `ng-click` 指令更改了作用域模型内部 `msg` 的值：\n\n点击此处查看代码图像\n\n```html\n<span ng-click=\"\
  msg='clicked'\"></span>\n```\n\n接下来的章节将带你了解一些在 AngularJS 中利用表达式能力的示例。\n\n***\n\n\
  ### 动手实践：使用基础表达式\n\n在本次练习中，你将看到 AngularJS 表达式如何处理字符串和数字的渲染。此练习的目的是说明 AngularJS 如何求值包含字符串、数字以及基础数学运算符的表达式。\n\
  \n列表 23.1 中的代码是一个简单的 AngularJS 应用，带有一个 `myController` 的控制器。该控制器是空的，因为没有任何表达式访问作用域。\n\
  \n列表 23.2 中的代码是一个 AngularJS 模板，包含几个封装在 `{{}}` 括号中的多种类型的表达式。某些表达式是数字或字符串，某些包含 `+`\
  \ 操作以组合字符串和/或数字，还有一个应用了 `===` 运算符来比较两个数字。\n\n使用以下步骤构建使用基础表达式的应用程序：\n\n**1.** 添加\
  \ `lesson23/expressions_basic.html` 和 `lesson23/js/expressions_basic.js` 文件。\n\n\
  **2.** 将 列表 23.1 和 列表 23.2 所示的代码添加到 HTML 和 JavaScript 文件中。\n\n**3.** 列表 23.1 中的以下代码实现了一个控制器：\n\
  \n```javascript\nangular.module('myApp', [])\n  .controller('myController', function($scope)\
  \ {\n});\n```\n\n**4.** 列表 23.2 中的以下行显示数字：\n\n```html\n{{5}}\n```\n\n**5.** 列表 23.2\
  \ 中的以下行显示字符串：\n\n```html\n{{5}}\n```\n\n**6.** 列表 23.2 中的以下行通过组合字符串显示字符串：\n\n```html\n\
  {{'1' + '2'}}\n```\n\n**7.** 列表 23.2 中的以下行通过数字数字显示数字：\n\n```html\n{{5+5}}\n```\n\
  \n**8.** 列表 23.2 中的以下行通过将它们组合显示字符串和数字：\n\n```html\n{{5 + '+' + 5}}\n```\n\n**9.**\
  \ 列表 23.2 中的以下行通过比较 5 和 5 显示布尔值：\n\n```html\n{{5===5}}\n```\n\n**10.** 在浏览器中打开 `expressions_basic.html`。图\
  \ 23.1 显示渲染后的网页。注意数字和字符串直接渲染到最终视图。组合字符串和数字允许你构建渲染到视图的文本。还要注意使用比较运算符会在视图中渲染 `true`\
  \ 或 `false`。\n\n![Image](img/image1000.jpeg)\n\n**图 23.1** 使用包含字符串、数字和数学运算的 AngularJS\
  \ 表达式。\n\n***\n\n```html\n<!doctype html>\n<html ng-app=\"myApp\">\n  <head>\n \
  \   <title>AngularJS Expressions</title>\n    <style>\n      p{margin:0px;}\n  \
  \    p:after{color:red;}\n    </style>\n  </head>\n```\n\n\n\n\n\n```html\n<body>\n\
  \  <div ng-controller=\"myController\">\n    <h1>表达式</h1>\n    数字:<br>\n    {{5}}<hr>\n\
  \    字符串:<br>\n    {{'My String'}}<hr>\n    将两个字符串加在一起:<br>\n    {{'String1' + '\
  \ ' + 'String2'}}<hr>\n    将两个数字加在一起:<br>\n    {{5+5}}<hr>\n    将字符串和数字加在一起:<br>\n\
  \    {{5 + '+' + 5 + '='}}{{5+5}}<hr>\n    比较两个数字:<br>\n    {{5===5}}<hr>\n  <script\
  \ src=\"http://code.angularjs.org/1.3.0/angular.min.js\"></script>\n  <script src=\"\
  js/expressions_basic.js\"></script>\n</body>\n</</html>\n```\n\n* * *\n* * *\n*\
  \ * *\n\n动手尝试：在表达式中与 scope（作用域）交互\n\n现在你已经看到基础的 AngularJS 表达式，让我们来看看如何在 AngularJS\
  \ 表达式内部与 scope 进行交互。在之前的示例中，表达式的所有输入都来自显式的字符串或数字。这个示例展示了 AngularJS 表达式的真实威力，这种威力源于与\
  \ scope 中的数据进行交互。\n\n按照以下步骤构建使用基础表达式的应用程序：\n\n**1.** 添加 `lesson23/expressions_scope.html`\
  \ 和 `lesson23/js/expressions_scope.js` 文件。\n\n**2.** 在 HTML 和 JavaScript 文件中添加列表\
