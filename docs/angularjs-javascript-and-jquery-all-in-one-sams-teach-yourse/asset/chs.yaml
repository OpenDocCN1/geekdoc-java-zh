  \n## 第 14 节：使用 jQuery 创建高级 页面元素\n\n在本节中你将学习：\n\n- ![Image](img/image00767.jpeg)\
  \ 创建带有滑块控制的图片库\n- ![Image](img/image00767.jpeg) 为表格元素添加排序功能\n- ![Image](img/image00767.jpeg)\
  \ 为表格元素添加过滤功能\n- ![Image](img/image00767.jpeg) 如何创建多类型树形视图\n- ![Image](img/image00767.jpeg)\
  \ 如何实现自定义对话框\n- ![Image](img/image00767.jpeg) 使用基础 HTML 和 jQuery 创建视觉元素\n- ![Image](img/image00767.jpeg)\
  \ 如何使用 jQuery 创建动态折线图（sparklines）\n\n在本节中，你将尝试创建一些高级的页面元素。本节的目的是让你有机会以更高级的方式应用你在书中目前所学到的所有知识。你在本节中构建的元素包括图片库、交互式表格、树形视图、覆盖层、均衡器和折线图。\n\
  \n以下章节以示例的形式编写，首先解释高级元素中用到的一些概念；然后你将亲手实现它们。你将能够在本节中学到的概念应用到自己的网页中，实现各种类型的高级元素。\n\
  \n### 添加图片库\n\n图片库是网页中视觉交互最强的组件之一。一画胜于千言。图片允许用户比任何其他类型的视觉元素更快地做出决策。应用图片让用户做出决策的最佳方法是提供一个交互式图片库。\n\
  \n交互式图片库应该让用户能够快速扫描几张图片，然后轻松选择其中一张以进入网页的下一步。因此，必要的组件是图片缩略图和控制控件。缩略图应该是原始图像的小版本，允许你同时提供多个选项供选择。控件是你用于在缩略图之间导航的任何工具。\n\
  \n实现图片库最有效的方法是创建一个包含缩略图的滑块，并带有箭头在缩略图之间滑动，直到用户找到并点击所需的图片。滑块是一个很好的选择，因为它们可以用垂直或水平方式实现，以适应网页的设计。\n\
  \n要实现滑块，你首先创建一个固定大小且隐藏溢出的容器 `<div>` 元素，然后是一个包含所有缩略图图像的子 `<div>` 元素。然后可以调整子 `<div>`\
  \ 的位置，以显示滑块中不同的图像集。下一节描述了该过程。\n\n***\n\n### 尝试自己：添加基于滑块的图片库\n\n该练习的目的是提供关于如何实现带有滑块控制的图片库的思路。示例代码位于[列表\
  \ 14.1]、[14.2] 和 [14.3] 中。\n\n使用以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建 `lesson14`、`lesson14/js`、`lesson14/css`\
