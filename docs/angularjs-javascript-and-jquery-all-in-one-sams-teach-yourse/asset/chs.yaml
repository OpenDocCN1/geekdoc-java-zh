  \n在本节中，你实现了几个更高级的 Web 元素。你学习了实现图库的各种知识、如何为表格添加排序和过滤，以及如何动态创建树形视图。你还实现了一些图形元素，例如迷你折线（sparklines）和均衡器显示。\n\
