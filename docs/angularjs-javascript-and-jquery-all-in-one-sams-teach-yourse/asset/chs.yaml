  \ 'Lockheed', model: 'L1011', capacity: 380}\n];\n\n$scope.filteredPlanes = $scope.planes;\n\
  $scope.reverse = true;\n$scope.column = 'make';\n$scope.setSort = function(column){\n\
  \  $scope.column = column;\n  $scope.reverse = !scope.reverse;\n};\n\n$scope.filterString\
  \ = '';\n$scope.setFilter = function(value){\n  $scope.filteredPlanes = filterFilter($scope.planes,\
  \ $scope.filterString);\n};\n```\n\n## 列表 23.10 filter_sort.html 使用 filter 和 orderBy\
  \ 实现表格中项目排序和过滤的 AngularJS 模板\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html ng-app=\"\
  myApp\">\n<head>\n  <title>AngularJS 排序与过滤</title>\n  <style>\n    table{text-align:right;}\n\
  \    td,th{padding:3px;}\n    th{cursor:pointer;\n  </style>\n</head>\n<body>\n\
  \  <div ng-controller=\"myController\">\n    <h2>排序与过滤</h2>\n    <input type=\"\
  text\" ng-model=\"filterString\">\n    <input type=\"button\" ng-click=\"setFilter()\"\
  \ value=\"过滤\">\n    <table>\n      <tr>\n        <th ng-click=\"setSort('make')\"\
  >厂商</th>\n        <th ng-click=\"setSort('model')\">型号</th>\n        <th ng-click=\"\
  setSort('capacity')\">载量</th>\n      </tr>\n      <tr ng-repeat=\"plane in filteredPlanes\
  \ | orderBy:column:reverse\">\n        <td>{{plane.make}}</td>\n        <td>{{plane.model}}</td>\n\
  \        <td>{{plane.capacity}}</td>\n      </tr>\n    </table>\n    <script src=\"\
  http://code.angularjs.org/1.3.0/angular.min.js\"></script>\n    <script src=\"js/filter_sort.js\"\
  ></script>\n  </div>\n</body>\n</html>\n```\n\n### 创建自定义过滤器\n\nAngularJS 允许你创建自己的自定义过滤器提供程序（custom\
  \ filter provider），并可以在表达式、控制器和服务中中使用它，就像使用内置过滤器一样。AngularJS 提供了 `filter()` 方法来创建过滤器提供程序并将其注册到依赖注入服务器中。\n\
  \n`filter()` 方法接受第一个参数作为过滤器的名称，第二个参数作为函数。过滤器函数应该接受第一个参数作为表达式输入，其后跟接任何额外参数。例如：\n\n\
  点击此处查看代码图片\n\n```javascript\nfilter('myFilter', function(){\n  return function(input,\
  \ param1, param2){\n    return <<modified input>>;\n  };\n});\n```\n\n在过滤器函数内部，你可以以任何喜欢的方式更改\
  \ `input` 的值。过滤器函数返回的任何值都将作为表达式的结果返回。\n\n### 尝试自己：创建并实现自定义过滤器\n\n在本次练习中，你将构建并使用一个对单词进行屏蔽（censor）的自定义过滤器。此练习的目的是说明如何构建和使用自定义模板。列表\
  \ `23.1](#part038.xhtml_ch2311)` 和 `23.2](#part038.xhtml_ch2312)` 中的代码创建了一个过滤器函数，该函数可以过滤字符串中的单词，并允许将替换值作为可选参数。按照以下步骤构建创建并应用自定义过滤器的应用程序：\n\
  \n1. 添加 `23/filter_custom.html` 和 `23/filter_custom.js`。\n2. 在 HTML 和 JavaScript\
  \ 文件中添加 `23.1](#part038.xhtml_ch2311)` 和 `23.2](#part038.xhtml_ch2312)` 所示的代码。\n\
  3. `23.1](#part038.xhtml_ch2311)` 中的后续代码定义了名为 `censor` 的过滤器。注意，该过滤器返回一个接受 `input`\
  \ 和 `replacement` 值的函数，然后遍历被屏蔽的单词并将文本替换为 `replacement` 值：\n\n点击此处查看代码图片\n\n```javascript\n\
  .filter('censor', function() {\n  return function(input, replacement) {\n    var\
  \ cWords = ['bad', 'evil', 'dark'];\n    var out = input;\n    for(var i=0; i<cWords.length;\
  \ i++){\n      var regex = new RegExp(cWords[i], \"gi\");\n      out = out.replace(regex,\
  \ replacement);\n    }\n    return out;\n  };\n})\n```\n\n4. 后续代码实现了该应用程序。注意该过滤器被注入到控制器中。通过\
  \ `filterText` 函数手动处理字符串：点击此处查看代码图片\n\n```javascript\n.controller('myController',\
  \ ['$scope', 'censorFilter',\n  function($scope, myCensorFilter) {\n    $scope.phrase\
  \ = \"This is a bad phrase.\";\n    $scope.txt = \"Click to filter out dark and\
  \ evil.\";\n    $scope.filterText = function(){\n      $scope.txt = myCensorFilter($scope.txt,\
  \ '<<censored>>');\n    };\n  }]);\n```\n\n5. `23.2](#part038.xhtml_ch2312)` 中的代码通过传递\
  \ `\"happy\"` 作为替换字符串，对作用域 `phrase` 值使用了过滤器：点击此处查看代码图片\n\n```html\n{{phrase | censor:\"\
  happy\"}}\n```\n\n6. 这里的后续行代码使用 `ng-click` 调用控制器中的 `filterText()` 函数，这将通过调用过滤器并传递\
  \ `<<censored>>` 作为替换字符串：点击此处查看代码图片\n\n```html\n<p ng-click=\"filterText()\"></p>\n\
  ```\n\n7. 在浏览器中加载 `filter_custom.html` 以查看图 `23.6](#part038.xhtml_ch236)` 所示的行为。\n\
  \n![Image](img/0108.jpeg)\n\n\n\n\n\n```html\n10      {\"This is some bad, dark,\
  \ evil text.\" | censor:\"happy\"}}\n\n11      <p ng-click=\"filterText()\">{{txt}}</p>\n\
  \n12 <script src=\"http://code.angularjs.org/1.3.0/angular.min.js\"></script>\n\n\
  13 <script src=\"js/filter_custom.js\"></script>\n\n14</body\n15</</html>\n```\n\
  \n### 总结\n\nAngularJS 模板实现简单，但功能非常强大且广泛。本节将讨论 AngularJS 模板的各个组件，以及它们如何协同工作以扩展 HTML\
  \ DOM 的行为和功能。表达式（Expressions）是包含在 `{{}}` 括号内或 AngularJS 模板指令定义中的 JavaScript 代码。表达式可以访问作用域（scope），因此你可以将作用域值渲染到视图。\n\
  \n过滤器（Filters）作为表达式的修饰符，允许你根据特定目的格式化表达式的结果。AngularJS 提供了多个内置过滤器，例如用于货币和日期格式化的过滤器。你也可以创建自定义过滤器，以便在数据渲染到页面之前应用任何所需的格式化或修改。你将过滤器作为提供者注入到\
  \ `injector` 服务中，因此可以使用依赖注入在控制器和模板内部访问它们。这意味着你在 JavaScript 代码中也可以访问过滤器。\n\n### 问答\n\
  \n**Q. 为什么使用自定义过滤器而不是控制器中的简单函数？**\n\n**A.** AngularJS 的理念是尽可能在 HTML 模板中表达意图。这使得应用程序更容易设计和遵循。此外，复用一个过滤器比复用一个自定义函数要容易得多。\n\
  \n**Q. 为什么 HTML 标准没有将 AngularJS 提供的所有功能作为 HTML 规范的一部分？**\n\n**A.** 随着时间的推移，HTML\
  \ 可能会添加 AngularJS 提供的某些功能。然而，要按照开发者所需的速度移动 HTML 这样被广泛采用的规范太困难。AngularJS 是最佳选择。\n\
  \n### 工作坊\n\n工作坊由一组问答组成，旨在巩固你对本小时涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\n### 测验\n\n**1.** 如何在\
  \ AngularJS 表达式中比较作用域值 `valueA` 和 `valueB`？**\n\n**2.** 下述 AngularJS 表达式 `{{5 +\
  \ '+' + 5}}` 的输出是什么？**\n\n**3. 你如何使用 AngularJS 正确显示存储在作用域变量 `myMoney` 中的美国美元金额？**\n\
  \n**4. 你会使用哪个 AngularJS 过滤器来对 HTML 表格进行排序？**\n\n### 测验答案\n\n**1.** `{{valueA===valueB}`\n\
  \n**2.** `5+5`\n\n**3.** `{{myMoney | currency:\"$USD\" }}`\n\n**4.** `orderBy`\n\
