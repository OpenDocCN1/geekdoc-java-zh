  >\n09    </head>\n10    <body>\n11      <span onclick=\"setEven()\">Even</span>\n\
  12      <span onclick=\"setOdd()\">Odd</span>\n13      <span onclick=\"setFirst4()\"\
  >First 4</span>\n14      <p class=\"label\">Planets</p>\n15      <ul>\n16      \
  \  <li>Poseidon</li>\n17        <li>Ares</li>\n18        <li>Apollo</li>\n19   \
  \     <li>Hermes</li>\n20        <li>Nike</li>\n21        <li>Nemesis</li>\n22 \
  \       <li>Zeus</li>\n23        <li>Hades</li>\n24      </ul>\n25    </body>\n\
  26 </html>\n```\n\n**列表 7.5 jquery_selectors.js 包含以各种方式使用 jQuery 选择和修改的事件处理函数的 JavaScript\
  \ 文件**\n\n点击此处查看代码图片\n\n```javascript\n01 function setEven(){\n02   $(\"li, span\"\
