  \      </expand-list>\n    </div>\n  </body>\n</html>\n```\n\n### 6. 在浏览器中加载 `expand.html`\
  \ 文件。AngularJS 应用程序的结果显示在图 29.4。\n\n**图 29.4** 使用自定义指令构建并实现可展开元素。\n\n### 动手尝试：为元素添加星级\n\
  \n在这个示例中，你仅使用 AngularJS 的作用域、控制器和视图来实现带有星级的元素。当你点击星星时，作用域中的评分会改变。此练习目的是提醒你，许多数据绑定和视图交互可以通过基础\
  \ AngularJS 完成，不需要自定义指令。\n\n使用以下步骤构建可展开/折叠 AngularJS 应用：\n\n**1.** 创建以下目录结构：\n`lesson29/`:\
  \ 项目文件夹。\n`lesson29/rating.html`: 实现简单星级项目的 AngularJS 模板。\n`lesson29/js/rating.js`:\
  \ 定义支持元素的 AngularJS 应用。\n\n**2.** 将列表 29.14 中的代码添加到 `rating.js` 文件中。它实现了我们用于更改星级的\
  \ AngularJS 应用。注意所使用的数据来自 `$scope.items`。这些数据可能来自服务、数据库或其他源。`$scope.stars` 数组用于模板在网页上显示星星。控制器代码中唯一的函数是\
  \ `adjustRating`，它在用户点击星星更改评分时被调用。\n\n```javascript\nangular.module('myApp', [])\n\
  .controller('myController', ['$scope', function($scope) {\n  $scope.stars = [1,2,3,4,5];\n\
  \  $scope.items = [\n    {\n      description: \"Mysty Mountains\",\n      img:\
  \ \"/images/misty_mountains.jpg\",\n      rating: 3},\n    {\n      description:\
  \ \"Wheel\",\n```\n\n\n\n\n\n```javascript\n11 img: \"/images/wheel.jpg\",\n12 rating:\
  \ 4},\n13 {\n14 description: \"Pool\",\n15 img: \"/images/pool.jpg\",\n16 rating:\
  \ 4}\n17 ];\n18 $scope.adjustRating = function(item, value){\n19 item.rating = value;\n\
  20 };\n21 }]);\n```\n\n### 3. 将代码添加到 rating.html 文件中\n\n将列表中的代码添加到 `rating.html`\
  \ 文件中。这实现了一个 AngularJS 模板，它遍历来自 scope 的 `items` 数组，并构建带有描述和星级评分的图像元素。请注意，为了构建星级列表，在\
  \ scope 的 `stars` 数组上使用了 `ng-repeat`。同样请注意，第 33 和第 34 行决定了显示实心星还是空星。为了实现这一点，根据项目\
  \ `rating` 是否大于星级索引来设置 `ng-class` 属性。`ng-click` 属性用于将每个星形上的鼠标点击绑定到 scope 中的 `adjustRating()`\
  \ 函数上，以便设置该项目的评分。\n\n**列表 29.15 rating.html AngularJS 模板，利用来自 scope 的数据显示带有描述和评分的图像列表**\n\
  \n[点击此处查看代码]\n\n```html\n01 <!DOCTYPE html>\n02 <html ng-app=\"myApp\">\n03   <head>\n\
  04     <title>Ratings</title>\n05     <style>\n06       img {\n07           width:\
  \ 200px; }\n08       .star {\n09           display: inline-block;\n10          \
  \ width: 15px;\n11           background-image: url(\"/images/star.png\");\n12  \
  \         background-repeat: no-repeat;\n13           background-size: 15px 15px;\n\
  14       }\n15       .empty {\n16           display: inline-block;\n17         \
  \  width: 15px;\n18           background-image: url(\"/images/empty.png\");\n19\
  \           background-repeat: no-repeat;\n20           background-size: 15px 15px;\n\
  21       }\n22     </style>\n23   </head>\n24   <body>\n25     <h2>Images With Ratings</h2>\n\
  26     <hr>\n27     <div ng-controller=\"myController\">\n28       <div ng-repeat=\"\
  item in items\">\n29         <img ng-src=\"{{item.img}}\" />\n30         {{item.description}}<br>\n\
  31         Rating: {{item.rating}} stars<br>\n32         <span ng-repeat=\"idx in\
  \ stars\"\n33               ng-class=\n34                   \"{true: 'star', false:\
  \ 'empty'}[idx <= item.rating]\"\n35               ng-click=\"adjustRating(item,\
  \ idx)\">&nbsp;\n36         </span>\n37         <hr>\n38       </div>\n39     </div>\n\
  40   </body></body>\n41   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n42   <script src=\"js/rating.js\"></script>\n43 </html>\n```\n\n###\
  \ 4. 在网络浏览器中加载 rating.html\n\n生成的网页如图 29.5 所示。请注意，当点击星形时，显示的评分和星级会发生变化。\n\n**图 29.5\
  \ 使用 AngularJS scope、控制器代码和模板视图在元素中实现一个简单的星级评分。**\n\n### 总结\n\nAngularJS 提供了许多工具，通过使用带有内置和自定义指令的模板来扩展\
  \ HTML 的功能。在本节中，你学习了以一种简单且结构化的方式在网页中实现富交互性元素的不同方法。在本节中，你还了解了几个自定义指令。标签页面板和可展开/折叠示例展示了实现相互嵌套并相互作用的指令的方法。拖放示例向你展示了与\
  \ HTML5 拖放事件交互的一种方法，以及如何在控制器和自定义指令之间共享 scope。星级评分示例向你展示了如何仅使用 AngularJS scope、控制器和模板来构建交互。缩放视图示例向你展示了如何扩展\
  \ HTML `<img>` 元素的概念，使其包含一个与鼠标点击交互的额外缩放元素的元素。\n\n本书到此结束。我们希望你像我们一样喜欢学习 AngularJS、jQuery\
  \ 和 JavaScript。我们热爱这些技术，因为它们允许你创建极佳、动态且高度交互的网页和网络应用程序。这些技术是强大的工具，因为它们允许你以快速高效的方式创建结构良好且可重用的代码。在阅读完本书后，你应该对\
  \ JavaScript、jQuery 和 AngularJS 框架有良好的理解，从而有信心跳上手编写你自己的网络应用程序。祝编码愉快！\n\n### 问答\n\
  \n- 哪里是学习 AngularJS 额外功能的良好来源？\n- 最好且最新的来源是 AngularJS 官方网站 `angularjs.org`。对于简单内容，你可以参考\
  \ `w3schools.com` 提供的内容。\n\n### 工作坊\n\n工作坊由一系列问题和答案组成，旨在巩固你对本小时涵盖内容的理解。在查看答案之前，请尝试回答这些问题。\n\
