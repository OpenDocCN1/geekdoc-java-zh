  </</div>\n```\n\n### 5. 将列表 29.13 中的代码添加到 `expand.html` 文件中。它实现了提供页面样式以及 `<expand-list>`\
  \ 元素定义的 AngularJS 模板。注意定义了四个 `<expand-list>` 元素。第一个是简单列表，`<expand-item>` 元素仅包含文本。第二个提供了一个带有表单元素的\
  \ `<expand-item>` 元素。第三个在每个 `<expand-item>` 元素中混合了不同的 HTML 元素。第四个仅包含一个 `<img>` 元素。\n\
  \n注意，每个 `<expand-list>` 元素包含不同的属性 `title` 和 `exwidth` 值，这导致页面上显示具有不同标题和宽度的列表。\n\n\
  **列表 29.13 expand.html 使用 expandList 和 expandItem 自定义指令设置样式并实现可展开/折叠元素的 AngularJS\
  \ 代码**\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"myApp\">\n  <head>\n\
  \    <title>Expandable and Collapsible Lists</title>\n    <style>\n      * { vertical-align:\
  \ top; }\n      expand-list{ border: 2px black; }\n      .expand-header{\n     \
  \   text-align: center;\n        font: bold 16px/4px;\n        background-image:\
  \ linear-gradient(#CCCCCC, #EEEEEE);\n      }\n      .expand-button{\n        float:\
  \ left;\n        padding: 2px 4px;\n        font: bold 2px/16px;\n        color:\
  \ white;\n        background-color: black;\n        cursor: pointer;\n        border:\
  \ 3px grey;\n      }\n      .expand-item { border: 1px ridge black;}\n      p {\
  \ margin: 0px; padding: 2px;}\n      label { display: inline-block; width: 80px;\
  \ padding: 2px; }\n      .small { width: 100px; padding: 2px; }\n      .large {\
  \ width: 300px; }\n    </style>\n  </head>\n  <body>\n    <h2>Expandable and Collapsible\
  \ Lists</h2>\n    <hr>\n    <div ng-controller=\"myController\">\n      <expand-list\
  \ title=\"Companion\" exwidth=\"120px\">\n        <expand-item>Rose</expand-item>\n\
  \        <expand-item>Donna</expand-item>\n        <expand-item>Martha</expand-item>\n\
