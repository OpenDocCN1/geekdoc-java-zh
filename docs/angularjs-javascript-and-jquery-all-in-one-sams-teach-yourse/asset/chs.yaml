  ></script>\n  <script src=\"directive_mouse_events.js\"></script>\n</body>\n</html>\n\
  \n### 总结\nAngularJS 指令扩展了 HTML 的功能。你可以将指令应用于 元素、属性和类。通过 JavaScript 代码定义指令的功能。AngularJS\
  \ 提供了许多内置指令来与表单元素交互，将作用域中的数据绑定到视图，反之亦然。\n\n### 问答\n**Q](#part0039.xhtml_ch24aa01)\
  \ 可以覆盖内置 AngularJS 指令的行为吗？**\n\n**A](#part0039.xhtml_ch24qq01)** 不可以；但你可以创建一个同名的指令，它们一起执行。通常建议使用不同的名称创建自定义指令。\n\
  \n**Q](#part0039.xhtml_ch24aa02) 为什么 AngularJS 指令使用 ng 前缀？**\n\n**A](#part0039.xhtml_ch24qq02)**\
  \ 因为它短且听起来像“angular”。\n\n### 工作坊\n工作坊包含一组问题，旨在巩固你对本节内容的理解。在查看答案之前请尝试回答问题。\n\n###\
  \ 测验\n**1](#part0039.xhtml_ch24as01) `ng-required` 指令的作用是什么？**\n\n**2](#part0039.xhtml_ch24as02)\
  \ `ng-repeat` 指令的作用是什么？**\n\n**3](#part0039.xhtml_ch24as03) 使用哪个 AngularJS 指令将元素绑定鼠标点击事件？**\n\
  \n**4](#part0039.xhtml_ch24as04) 使用哪个 AngularJS 指令将表单元素绑定焦点事件？**\n\n### 测验答案\n**1](#part0039.xhtml_ch24qa01)**\
  \ 它为表单中的 `<input>` 元素创建一个布尔值。\n\n**2](#part0039.xhtml_ch24qa02)** 允许根据 JavaScript\
  \ 对象数组动态添加多个 HTML 元素。\n\n**3](#part0039.xhtml_ch24qa03)** `ng-click`\n\n**4](#part0039.xhtml_ch24qa04)**\
  \ `ng-focus`\n\n#### 练习题\n1. 修改 代码列表 24.8 中的代码，使其高亮奇数几而不是偶数。\n2. 修改 代码列表 24.9 和\
  \ 24.10 中的代码，使得 `InputData` 对象中的输入值在未聚焦时显示为小写，在获得焦点时显示为大写。\n\n\n\n\n本节讨论了自定义指令（directives）的设计与实现。你还将看到一些自定义指令的基本示例，这些指令扩展了\
  \ HTML 的功能。\n\n### 理解自定义指令的定义\n\n你通过调用 `Module` 对象上的 `directive()` 方法来实现自定义指令。`directive()`\
  \ 方法接受第一个参数作为指令的名称，第二个参数是一个提供者函数，该函数返回一个包含构建指令对象所需指令的对象。例如，以下是一个指令的基本定义：\n\n点击此处查看代码图片\n\
  \n```javascript\nangular.module('myApp', []).\ndirective('myDirective', function()\
  \ {\n  return {\n    template: 'Name: {{name}} Score: {{score}}'\n  };\n});\n```\n\
  \n表 25.1 提供了一个你可以应用于指令定义返回对象的的属性列表，在前面的代码中，返回了 `template` 属性。\n\n![Image](img/image01028.jpeg)![Image](img/image01029.jpeg)![Image](img/image01030.jpeg)\n\
  \n**表 25.1 定义 AngularJS 指令功能的指令定义属性**\n\n后续章节将更详细地讨论指令选项。\n\n### 定义指令视图模板\n\n你可以包含\
  \ AngularJS 模板代码来构建视图组件，这些组件将显示在包含指令的 HTML 元素中。你可以通过使用 `template` 属性直接添加模板代码，如下例所示：\n\
  \n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    template: 'Name: {{name}} Score: {{score}}'\n  };\n});\n```\n\n你可以在自定义模板中指定一个根元素——但只能有一个。该元素将作为\
  \ AngularJS 模板中定义的任何子元素的根元素进行放置。此外，如果你使用了 `transclude` 标记，该元素应该包含 `ngTransclude`。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    transclude: true,\n    template: '<div ng-transclude></div>'\n  };\n});\n```\n\
  \n你还可以使用 `templateUrl` 属性来指定位于 Web 服务器上的 AngularJS 模板的 URL，如下例所示：\n\n点击此处查看代码图片\n\
  \n```javascript\ndirective('myDirective', function() {\n  return {\n    templateUrl:\
  \ '/myDirective.html'\n  };\n});\n```\n\n模板 URL 可以包含任何标准的 AngularJS 模板代码。因此，你可以根据需要让指令尽可能简单或复杂。\n\
  \n### 限制指令行为\n\n你可以将指令作为 HTML 元素、属性或两者兼之应用。`restrict` 属性允许你限制自定义指令的应用方式。`restrict`\
  \ 属性可以设置为以下值：\n\n![Image](img/image00767.jpeg) **A**: 作为属性名应用。例如：\n\n`<my-directive></my-directive>`\n\
  \n![Image](img/image00767.jpeg) **E**: 作为元素名应用。例如：\n\n点击此处查看代码图片\n\n`<div my-directive=\"\
  expression\"></</div>`\n\n![Image](img/image00767.jpeg) **C**: 作为类应用。例如：\n\n点击此处查看代码图片\n\
  \n`<div class=\"my-directive: expression;\"></</div>`\n\n![Image](img/image00767.jpeg)\
  \ **M**: 作为注释应用。例如：\n\n点击此处查看代码图片\n\n`<!-- directive: my-directive expression -->`\n\
  \n![Image](img/image00767.jpeg) **AEC**: 作为属性、元素或类名应用。你也可以使用其他组合，例如 `AE` 或 `AC`。\n\
  \n例如，你可以将以下指令作为属性或元素应用：\n\n点击此处查看代码图片\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    restrict: 'AE',\n    templateUrl: '/myDirective.html'\n\
  \  };\n});\n```\n\n以下显示了如何将指令同时作为元素和属性实现。注意驼峰命名（camelCase）名称被替换为带连字符的名称：\n\n`<my-directive></my-directive>`\n\
  \n`<div my-directive></div>`\n\n### 为指令添加控制器\n\n你可以通过指令定义中的 `controller` 属性为指令添加自定义控制器。这允许为指令模板提供控制器支持。例如，以下代码添加了一个简单的控制器：\n\
  \n```javascript\ndirective('myDirective', function() {\n  return {\n    scope: {},\n\
  \    controller: function ($scope) {\n      $scope.title = \"new\";\n      $scope.myFunction\
  \ = function() {};\n    }\n  };\n});\n```\n\n你还可以使用 `require` 属性来确保控制器可用。`require`\
  \ 选项使用 `^controller` 语法来指示注入器向上查找直到找到控制器。例如：\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    require: '^controller'\n  };\n});\n```\n\n如果你在 `require`\
  \ 选项中指定了另一个指令的名称，该指令的控制器将被链接。例如：\n\n```javascript\ndirective('myDirective', function()\
  \ {\n  return {\n    require: '^myDirective',\n    link: function(scope, attrs,\
  \ otherDirectiveController) {\n    }\n  };\n});\n```\n\n#### 配置指令作用域\n\n指令默认与父级共享作用域。这通常可以满足大多数需求。最大的缺点是你可能不想将所有自定义指令属性包含在父作用域中，特别是父作用域是根作用域时。\n\
  \n为了解决这个问题，你可以使用 `scope` 属性为指令定义独立的作用域。后续章节将描述如何添加继承作用域和隔离作用域。\n\n#### 添加继承作用域\n\
  \n为指令添加作用域的最简单方法是创建一个从父作用域继承的作用域。优点是你拥有了一个独立于父作用域的作用域来添加额外值，但缺点是自定义指令仍然可以修改父作用域中的值。\n\
  \n为自定义指令创建一个继承作用域，将指令的 `scope` 属性设置为 `true`。例如：\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    scope: true\n  };\n});\n```\n\n#### 添加隔离作用域\n\n\n\
  \n\n\n有时，你可能希望将指令内部的作用域与指令外部的作用域隔离开。这样做可以防止指令更改父控制器作用域中的值。指令定义允许你指定一个 `scope` 属性来创建一个隔离作用域（isolate\
  \ scope）。隔离作用域将指令作用域与外部作用域隔离开，防止指令访问外部作用域，并防止外部作用域中的控制器更改指令的作用域。例如，以下代码将指令的作用域从外部作用域隔离开：\n\
  \n点击此处查看图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    scope: { },\n    templateUrl: '/myDirective.html'\n  };\n});\n```\n\n使用这段代码，指令拥有一个完全空的隔离作用域。然而，你可能仍然想将外部作用域中的某些项映射到指令的内部作用域。你可以使用以下前缀为属性命名，使得本地作用域变量在指令的作用域中可用：\n\
  \n![Image](img/image00767.jpeg) `@`: 将本地作用域的字符串绑定到 DOM 属性的值。该属性的值将在指令作用域内部可用。\n\n\
  ![Image](img/image00767.jpeg) `=`: 在本地 `scope` 属性和指令 `scope` 属性之间创建双向绑定。\n\n![Image](img/image00767.jpeg)\
  \ `&`: 将本地作用域中的函数绑定到指令作用域。\n\n如果前缀后没有属性名，则使用指令属性名称。例如：\n\n`title: '@'`\n\n等同于：\n\
  \n`title: '@title'`\n\n以下代码展示了如何实现每种方法将本地值映射到指令的隔离作用域：\n\n点击此处查看图片\n\n```javascript\n\
  angular.module('myApp', []).\n  controller('myController', function($scope) {\n\
  \    $scope.title=\"myApplication\";\n    $scope.myFunc = function(){\n      console.log(\"\
  out\");\n    };\n  }).\n  directive('myDirective', function() {\n    return {\n\
  \      scope: {title: '=', newFunc:\"&myFunc\", info: '@'},\n      template: '<div\
  \ ng-click=\"newFunc()\">{{title}}: {{info}}</div>'\n    };\n  });\n```\n\n以下代码展示了如何在\
  \ AngularJS 模板中定义指令，以提供必要的属性来映射属性：\n\n```html\n<div my-directive\n      my-func=\"\
  myFunc()\"\n      title=\"title\"\n      info=\"SomeString\"></</div>\n```\n\n###\
  \ 元素嵌套 (Transcluding Elements)\n\n嵌套（Transcluding）起初可能是一个比较抽象的概念。基本上，它的想法是你可以保留\
  \ AngularJS 模板中定义的自定义指令的内容，并将其绑定到作用域。其工作原理是指令的链接函数（link function）会接收一个预绑定到当前作用域的嵌套函数。然后，指令内部的元素就可以访问指令外部的作用域。\n\
  \n你可以将 `transclude` 选项设置为以下值：\n\n![Image](img/image00767.jpeg) `true`: 嵌套指令的内容。\n\
  \n![Image](img/image00767.jpeg) `element`: 嵌套整个元素，包括在较低优先级上定义的任何指令。\n\n你还必须在指令模板内部的元素中包含\
  \ `ngTransclude` 指令。以下是一个实现 `transclude` 以从 `myDirective` 指令模板访问控制器作用域中 `title`\
  \ 变量的示例：\n\n点击此处查看图片\n\n```javascript\nangular.module('myApp', []).\n  directive('myDirective',\
  \ function() {\n    return {\n      transclude: true,\n      scope: {},\n      template:\
  \ '<div ng-transclude>{{title}}</div>'\n    };\n  }).\n  controller('myController',\
  \ function($scope) {\n    $scope.title=\"myApplication\";\n  });\n```\n\n### 使用\
  \ Link 函数操作 DOM\n\n当 AngularJS HTML 编译器遇到指令时，它会运行指令的编译函数（compile function），该函数返回\
  \ `link()` 函数。`link()` 函数被添加到 AngularJS 指令的列表中。在所有指令编译完成后，HTML 编译器会根据优先级顺序调用 `link()`\
  \ 函数。\n\n如果你想修改自定义指令内部的 DOM，应该使用 `link()` 函数。`link()` 函数接收与指令相关的 `scope`、`element`、`attributes`、`controller`\
  \ 和 `transclude` 函数，使你能够直接在指令内部操作 DOM。嵌套函数是……（等待，文本在此中断了，但我将处理所提供的片段）。\n\n*注意：提供的文本在句子中间结束。我已根据你的规则对可用内容进行了格式化。*\n\
  \n\n\n\n[content]\n\n## 使用 Compile 函数操作 DOM\n\n`compile` 函数与 `link` 函数非常相似，但有一个主要的优势，同时也存在一些缺点。使用\
  \ `compile` 函数的优势和主要原因是性能考虑。`compile` 方法仅在编译模板时执行一次，而 `link` 函数在每次元素被链接（linked）时都会执行一次；例如，如果你在\
  \ `ng-repeat` 循环内部应用了多个指令，或者当模型发生变化时。如果你正在进行大量的 DOM 操作，这将会是一个大问题。\n\n以下是 `compile`\
  \ 函数的局限性：\n\n![Image](img/image00767.jpeg) 任何操作都在克隆（clone）之前应用。这意味着当在 `ng-repeat`\
  \ 内部使用自定义指令时，任何 DOM 操作将应用于所有生成的自定义指令。\n\n![Image](img/image00767.jpeg) `compile()`\
  \ 方法无法处理在 fact 自己的模板或 `compile()` 函数中递归使用自我的指令，因为这会导致死循环。\n\n![Image](img/image00767.jpeg)\
  \ `compile()` 方法无法访问 scope。\n\n![Image](img/image0076.jpeg) `transclude` 函数已废弃并从\
  \ `compile` 函数中移除，因此你无法链接到嵌套（transcluded）的元素。\n\n`compile()` 方法的语法与 `link()` 方法非常相似。你可以像这样指定一个单一的\
  \ postlink 函数：\n\n```javascript\ndirective('myDirective', function() {\n  return\
  \ {\n    compile: function compile(scope, elem, attr, controller){\n           \
  \ //postlink code\n        }\n  };\n});\n```\n\n你也可以像这里所示，使用对象来指定 prelink- 和 postlink\
  \ 函数：\n\n```javascript\ndirective('myDirective', function() {\n  return {\n    compile:\
  \ {\n      pre: function preLink(elem, attr){\n          //prelink code\n      },\n\
  \      post: function postLink(elem, attr){\n          //postlink code\n      },\n\
  \    }\n  };\n});\n```\n\n## 实现自定义指令\n\n你可以定义的自定义指令类型是无限制的，这使得 AngularJS 具有可扩展性。自定义指令是\
  \ AngularJS 中最难解释和理解的部分。入门的最好方法是向你展示一些自定义指令的示例，让你感受如何实现它们以及它们之间如何交互。\n\n### 尝试自己：在自定义指令中操作\
  \ DOM\n\n你在自定义指令中执行的最常见任务之一就是操作 DOM。这应该是你的 AngularJS 应用中唯一操作 DOM 的地方。在这个练习中，你将构建一个基础的自定义指令，它在包含的元素周围应用一个带有标题和页脚的框。这个示例非常基础，它让你有机会看到如何使用\
  \ AngularJS 中的某些机制，例如将值作为属性设置到自定义指令上。\n\n使用以下步骤构建带有操作 DOM 的自定义指令应用程序：\n\n**1.**\
  \ 添加 `lesson25/directive_custom_dom.html` 和 `lesson25/js/directive_custom_dom.js`\
  \ 文件。\n\n**2.** 在 HTML 和 JavaScript 文件中添加 [Listing 25.1] 和 [Listing 25.2] 所示的代码。\n\
  \n**3.** 来自 [Listing 25.1] 的以下行代码定义了一个简单的应用程序，该控制器只包含 scope 变量 `title` 和一个名为 `mybox`\
  \ 的指令：\n\n```javascript\n01 angular.module('myApp', [])\n02 .controller('myController',\
  \ function($scope) {\n03     $scope.title=\"myApplication\";\n04   })\n05 .directive('mybox',\
  \ function() {\n06   return {\n. . .\n18     };\n19 });\n```\n\n**4.** 指令中的以下行代码启用了嵌套（transclusion）：\n\
  `07 transclude: true,`\n\n**5.** 以下行代码将自定义指令限制为元素类型：\n`08 restrict: 'E',`\n\n**6.**\
  \ 以下行代码定义了一个接受 `title` 和 `bwidth` 字符串的隔离 scope：\n`09 scope: {title: '@', bwidth:\
  \ '@'},`\n\n**7.** 以下行定义了一个 `template`，它添加了标题栏和一个 `<div ng-transclude>`，用于存储指令的嵌套内容：\n\
  `10 template: '<div><span class=\"title\">{{title}}' + '</span><div ng-transclude></div></div>',`\n\
  \n**8.** 以下行显示了 `link()` 函数，它使用 `append` 添加了一个页脚。这也可以在 `template` 中完成；但是，我想说明可以在\
  \ `link()` 函数中完成。同时注意，页脚的文本来自父 scope 的标题，使用了 `scope.$parent.title`。`link` 函数还添加了\
  \ `border` 并根据 scope 中的 `bwidth` 值设置了 `display` 和 `width` 值：\n```javascript\n12\
  \ link: function (scope, elem, attr, transclude){\n13     elem.append('<span class=\"\
  footer\">' + scope.$parent.title + '</span>');\n14     elem.css('display', 'inline-block');\n\
  15     elem.css('width', scope.bwidth);\n16 },\n```\n\n**9.** [Listing 25.2] 中的代码实现了一个\
  \ AngularJS 模板，设置了一些 CSS 样式并添加了在 [Listing 25.1] 中定义的 `<mybox>` 自定义指令。\n\n**10.**\
  \ 在浏览器中打开 `directive_custom_dom.html`。结果如图 251 所示。`bwidth` 属性决定了框的宽度，所有元素都被相同类型的框包围。\n\
  \n![Image](img/image011)\n**FIGURE 25.1** 在 AngularJS 视图中操作元素的指令。\n\n### LISTING\
  \ 25.1 directive_custom_dom.js - 操作 DOM 的指令\n\n```javascript\n01 angular.module('myApp',\
  \ [])\n02 .controller('myController', function($scope) {\n03     $scope.title=\"\
  myApplication\";\n04   })\n05 .directive('mybox', function() {\n06   return {\n\
  07     transclude: true,\n08     restrict: 'E',\n09     scope: {title: '@', bwidth:\
  \ '@'},\n10     template: '<div><span class=\"title\">{{title}}' +\n11     '</span><div\
  \ ng-transclude></div></div>',\n12     link: function (scope, elem, attr, transclude){\n\
  13     elem.append('<span class=\"footer\">' + scope.$parent.title + '</span>');\n\
  14     elem.css('display', 'inline-block');\n15     elem.css('width', scope.bwidth);\n\
  16 },\n17   };\n18 });\n```\n\n### LISTING 25.2 directive_custom_dom.html - 使用自定义指令操作\
  \ DOM 的 AngularJS 模板\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n\
  03 <head>\n04   <title>AngularJS Custom Directive</title>\n05   <style>\n06    \
  \ * { text-align: center; }\n07     .titleBar { color: white; background-color:\
  \ grey;\n08             font: bold 14px/18px arial; display: block;\n09        \
  \     border-bottom: 4px ridge grey; }\n10     .footer {  color: white; background-color:\
  \ grey;\n11             font: italic 10px/14px arial; display: block;\n12      \
  \       border-top: 4px ridge grey; }\n13     mybox { border: 4px ridge grey; margin:\
  \ 10px; }\n14     img { display: block; }\n15   </style>\n16 </head>\n17 <body>\n\
  18   <div ng-controller=\"myController\">\n```\n\n\n\n\n\n## 操作 DOM 的自定义指令\n\n```html\n\
  <mybox title=\"Simple Text\" bwidth=\"100px\">\n  Using AngularJS to build a box\
  \ around text.\n</mybox>\n<mybox title=\"Paragraph\" bwidth=\"200px\">\n  <p>Using\
  \ AngularJS to build a box around a paragraph.</p>\n</mybox>\n<mybox title=\"List\"\
  \ bwidth=\"200px\">\n  <ul>\n    <li>Using AngularJS</li>\n    <li>to build a box</li>\n\
  \    <li>around a list.</li>\n  </ul>\n</mybox>\n<mybox title=\"Image\" bwidth=\"\
  400px\">\n  <img src=\"/images/sunset2.jpg\" width=\"400px\" />\n</mybox>\n```\n\
  \n```html\n<script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n\
  <script src=\"js/directive_custom_dom.js\"></script>\n```\n\n### 动手一试：在自定义指令中实现事件处理程序\n\
  \n自定义指令的另一个常见用途是实现事件处理程序，以便与自定义元素中发生的鼠标和键盘事件进行交互。这允许你为自定义元素提供增强的用户交互。\n\n在此示例中，你添加了鼠标事件处理程序，允许你通过拖动图像来调整其尺寸和不透明度。当鼠标向左拖动时，图片缩小；向右移动时，图片放大；向上移动时，图片变淡；向下移动时，不透明度增加。为了这个示例，我在\
  \ AngularJS 模板中加载了完整版本的 jQuery。这样做是为了使用诸如获取图片 `width()` 等功能，这些功能在 jQuery lite 版本中是不提供的。\n\
  \n按照以下步骤构建带有操作 DOM 的自定义指令应用程序：\n\n1. 添加 `lesson25/directive_custom_zoom.html` 和\
  \ `lesson25/js/directive_custom_zoom.js` 文件。\n2. 将 [列表 25.3] 和 [列表 25.4] 所示的代码添加到\
  \ HTML 和 JavaScript 文件中。\n3. 自 [列表 25.3] 的以下几行代码定义了一个包含两个指令 `zoomit` 和 `fadit` 的简单应用程序：\n\
  \n```javascript\nangular.module('myApp', [])\n.directive('zoomit', function() {\n\
  \  return {\n    link: function (scope, elem, attr){\n// . . .\n    }\n  }\n})\n\
  .directive('fadeit', function() {\n  return {\n    link: function (scope, elem,\
  \ attr){\n// . . .\n    } \n```\n\n4. 第一个指令 `zoomit` 的 `link` 函数中的以下代码监听了 `mousedown`、`mouseup`、`mouseleave`\
  \ 和 `mousemove` 事件。当按下鼠标按钮时，`dragging` 变量被设置为 `true`；当松开鼠标或鼠标离开元素时，`dragging` 被设置为\
  \ `false`。另外注意，在 `mousedown` 中，默认事件行为被 `event.preventDefault()` 抑制了。此举是为了消除拖动期间与浏览器默认行为的任何交互冲突：\n\
  \n```javascript\nelem.on('mouseup', function(){\n  dragging = false;\n});\nelem.on('mouseleave',\
  \ function(){\n  dragging = false;\n});\n```\n\n5. 在 `zoomit` 的以下行中，定义了一个 `mousemove`\
  \ 处理器来确定鼠标位置并增加或减小图片尺寸。注意，由于加载了完整版本的 jQuery，你能够使用 `width()` 和 `height()` 函数获取并设置图片的尺寸：\n\
  \n```javascript\nelem.on('mousemove', function(event){\n  if(dragging){\n    var\
  \ adjustment = null;\n    if ( event.screenX > lastX+tolerance && elem.width() <\
  \ 300){\n      adjustment = 1.1;\n    } else if ( event.screenX < lastX-tolerance\
  \ && elem.width() > 100){\n      adjustment = .9;\n    }\n    if(adjustment){\n\
  \      //requires jQuery library\n      elem.width(elem.width()*adjustment);\n \
  \     elem.height(elem.height()*adjustment);\n      lastX = event.screenX;\n   \
  \ }\n  }\n});\n```\n\n6. 查看 `fadeit` 指令，你可以发现它与 `zoomit` 指令非常相似，区别在于图片的 `opacity`\
  \ 值被改变了。\n7. `fadeit` 和 `zoomit` 指令用在 [列表 25.4] 所示 AngularJS 模板中的以下 `<img>` 元素上。注意，在第一张图片上添加了\
  \ `zoomit` 指令，第二张图片上添加了 `fadeit` 指令，而在最后一张图片上两者都添加了。这向你展示了同一个元素可以添加多个自定义指令：\n\n\
  ```html\n<img src=\"/images/wheel.jpg\" zoomit></img>\n<img src=\"/images/wheel.jpg\"\
