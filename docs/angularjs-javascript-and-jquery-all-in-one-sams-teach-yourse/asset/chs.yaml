  \ `myPhoto` 元素 `active` 属性的开启与关闭。\n\n使用以下步骤构建一个操作 DOM 的自定义指令应用程序：\n\n1. 添加 `lesson25/directive_custom_photos.html`、`my_photos.html`\
  \ 和 `lesson25/js/directive_custom_photos.js` 文件。\n2. 将 `列表 25.5`、`列表 25.6` 和 `列表\
  \ 25.7` 所示的代码添加到 HTML 和 JavaScript 文件中。\n3. `列表 25.5` 中的以下行代码实现了 `myPhotos` 指令。`myPhotos`\
  \ 指令被设计为稍后定义的 `myPhoto` 指令的容器。注意以下几行定义了一个为 `myPhotos` 指令提供功能的控制器，其中包含 `addPhoto()`\
  \ 函数：\n\n```javascript\n02 .directive('myPhotos', function() {\n03   return {\n\
  04     restrict: 'E',\n05     transclude: true,\n06     scope: {},\n07     controller:\
