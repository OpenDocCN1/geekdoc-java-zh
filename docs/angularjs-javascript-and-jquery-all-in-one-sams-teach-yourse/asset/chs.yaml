  \n### 日期\n\n`Date` 对象提供了对当前时间的访问。这可以非常有用，例如在页面上显示时间、与服务器比较时间、对某些事件计时等。要获取系统当前时间，请使用以下语法：\n\
  \n```javascript\nvar cDate = new Date();\ndocument.write(cDate);\n```\n\n日期的字符串版本将类似于以下：\n\
  \n点击此处查看代码图片\nMon 10 2012 17:30 GMT-0700 (Mountain Standard Time)\n\n你可以使用以下语法通过字符串或一组值来创建\
  \ `Date` 对象：\n\n点击此处查看代码图片\n```javascript\nDate(year, month, day, minutes, seconds,\
  \ milliseconds)\n```\n\n例如，以下代码将创建相同的 `Date` 对象：\n\n点击此处查看代码图片\n```javascript\n\
  var d1 = Date(\"2012, 12, 12, 12, 12, 00\");\nvar d2 = Date(\"December 12, 2012\
  \ 12:12\");\n```\n\nJavaScript 允许你使用普通的逻辑比较（`<`, `>`, `==` 等）来比较日期。例如，你可以使用以下代码将浏览器的当前时间与从服务器发送的时间戳“December\
  \ 12, 2012 12:12”进行比较：\n\n点击此处查看代码图片\n```javascript\nvar currentTime = new Date();\n\
  var serverTime = new Date(\"December 12, 2012 12:12\");\nif (currentTime > serverTime){\n\
  \  // 逻辑\n}\n```\n\n### 数学\n\n`Math` 对象提供了对数学函数的访问。这在很多方面都很有用，例如在页面上显示计算结果、生成随机数、计算平方根等。\n\
  \n```javascript\nvar x = Math.sqrt(16); // x 为 4\nvar y = Math.random(); // 生成 0\
  \ 到 1 之间的随机数\n```\n\n### 正则表达式\n\n正则表达式是用于匹配字符串中模式的强大工具。在 JavaScript 中，你可以使用字面量或构造函数创建。\n\
  \n```javascript\nvar pattern = /abc/;\nvar str = \"abcdef abc\";\nconsole.log(pattern.test(str));\
  \ // 输出 true\n```\n\n正则表达式可以用来执行复杂的搜索、替换和提取任务。\n\n\n\n\n前两个选项对于你以后不需要重用的简单对象非常有效。更好的方法是将对象封装在它自己的函数块中。这样做的优点可以让你将所有与对象相关的代码都保持在对象内部。例如：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction User(first, last){\n  this.first = first;\n\
  \  this.last = last;\n}\n\nvar user = new User(\"Brad\", \"Dayley\");\n```\n\n这些方法的最终结果基本上是相同的。你拥有一个带有属性的对象，可以使用点语法进行引用，如下：\n\
  \n点击此处查看代码图像\n\n```javascript\ndocument.write(user.first + \" \" + user.last);\n\
  ```\n\n### 向 JavaScript 对象中添加方法\n\n如果有特定于自定义对象的代码，你希望将这些代码作为方法附加到对象本身。根据对象的创建方式，有几种方法。\n\
  \n第一种方法是定义一个静态函数，然后将其赋值为对象的属性。以下是在动态定义对象时赋值静态函数的示例：\n\n点击此处查看代码图像\n\n```javascript\n\
  var user = new Object();\nuser.first=\"Brad\";\nuser.last=\"Dayley\";\nuser.getFullName\
  \ = makeFullName;\n\nvar user2 = {'first':'Brad', 'last':'Dayley',\n           \
  \  'getFullName':makeFullName};\n\nfunction makeFullName(){\n  return this.first\
  \ + \" \" + this.last;\n}\n\ndocument.write(user.getFullName());\n```\n\n函数 `makeFullName()`\
  \ 将对象的 `first` 和 `last` 属性合并并返回字符串。注意，该函数使用 `this` 关键字访问属性。`this` 指对象的当前实例。还要注意，将\
  \ `makeFullName()` 赋值给 `getFullName` 时省略了括号()`；这会将 `user.getFullName` 设置为函数本身，而不是它返回的值。\n\
  \n如果你使用更好的封装方法创建了对象，可以使用以下语法在对象内部定义函数。注意 `getFullName` 被设置为一个新定义的函数，该函数返回值的方式与静态函数\
  \ `makeFullName()` 相同：\n\n点击此处查看代码图像\n\n```javascript\nfunction User(first, last){\n\
  \  this.first = first;\n  this.last = last;\n  this.getFullName = function(){\n\
  \    return this.first + \" \" + this.last;\n  };\n}\n```\n\n### 使用原型对象模式\n\n创建对象的更高级的方法是使用原型模式。原型模式通过在对象的\
  \ `prototype` 属性中定义函数而不是在对象本身中定义函数来实现。原型之所以更好的原因是，在原型中定义的函数在 JavaScript 加载时只创建一次，而不是每次创建新对象时都创建。\n\
  \n下面的示例显示了实现原型模式所需的代码。注意你定义了对象 `UserP`，然后将 `UserP.prototype` 设置为包含 `getFullName()`\
  \ 函数。你可以根据需要在此 `prototype` 中包含任意数量的函数。每创建一个新对象，这些函数都可用：\n\n点击此处查看代码图像\n\n```javascript\n\
  function UserP(first, last){\n  this.first = first;\n  this.last = last;\n}\n\n\
  UserP.prototype = {\n  getFullName: function(){\n    return this.first + \" \" +\
  \ this.last;\n  }\n};\n```\n\n要调用 `getFullName()` 函数，你将使用类似下面的代码：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar me = UserP(\"Brad\", \"Dayley\");\nvar myFullName = me.getFullName();\n\
  ```\n\n***\n\n### 动手尝试：创建和使用自定义对象\n\n在本节中，你将使用原型模式创建并使用自定义 JavaScript 对象的数组。使用以下步骤构建\
