  \ }\n```\n\n### 使用 Widget 调整大小\n\n用户频繁的需求是定义图像、列表等的大小。`resizable` 组件提供了通过鼠标控件轻松调整大小的功能。这允许用户根据意愿调整页面元素。\n\
  \n`resizable` 组件在页面元素上附加了多个句柄，通过鼠标交互来调整元素。你也可以同时调整其他元素。表格 18.6 描述了更多常用的调整大小选项。以下是向元素附加\
  \ `resizable` 组件并指定 `aspectRatio` 为 `true` 的示例：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#div1\").resizable ({aspectRatio:true});\n```\n\n![图像](img/image00968.jpeg)\n\
  \n**表格 18.6 常用 Resizable 组件**\n\nresizable 组件提供了额外的事件，可以在调整大小时附加到元素上。表格 18.7 列出了可以在调整大小项上访问的事件。以下是添加\
  \ `resizestop` 事件以便在调整大小项完成后应用 `pulsate` 效果的示例：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#resize1\").resizable ({aspectRatio:true });\n$(\"#resize1\").on(\"dropactivate\"\
  , function(){$(this).effect(\"pulsate\"); });\n```\n\n![图像](img/image00969.jpeg)\n\
  \n**表格 18.7 Resizable Widget 事件**\n\n* * *\n\n### 动手尝试：创建可调整大小的元素\n\n在此示例中，你实现了可拖放和可调整大小的元素，允许用户自定义网页上项目的位置和大小。示例的目的是说明拖放和调整之间的交互。\n\
  \n示例代码位于列表 18.7、18.8 和 18.9。使用以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，添加 `lesson18/resizable_elements.html`、`lesson18/js/resizable_elements.js`\
  \ 和 `lesson18/css/resizable_elements.css` 文件。\n**2.** 在 HTML 和 CSS 文件中添加列表 18.7\
