  \ CSS**\n\n\n\n\n\nWeb 表单最重要的部分之一就是对用户输入的信息进行验证。根据输入数据的不同，有许多不同类型和层级的验证。\n\n例如，某些元素是完全可选的，不需要验证。其他元素（如注释）可能是必填的，但内容实际上并不重要。其他元素（如电子邮件地址或数据）可能是必填的，并且必须符合特定的格式要求，甚至可能有数值范围。\n\
  \n通常，这是通过服务器端脚本实现的。这种方法的问题是所有数据都必须发送到服务器，然后生成错误并将其返回给用户。\n\n更好的选择是在表单提交到服务器之前，在你的\
  \ `jQuery` 代码中对表单数据进行验证。以下章节描述了验证表单数据的不同方法\n\n## 手动验证 Web 表单\n\n验证表单最基本的方法是访问它们的值，并将实际内容与要求进行比对。这可以在用户输入数据时通过添加（例如\
  \ `blur`、`change` 或 `keypress` 事件处理器来完成，然后在事件处理程序内部检查数据的值。以下代码在 `keypress` 处理器中实现了验证，验证表单元素的值是否为数字，如果不是，则在标签上添加警告文本：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"input:text\").keypress(function (){\n    if(!$.isNumeric($(this).val()))\
  \ {\n      $(\"#validLabel\").html(\"Not a Number\"));\n    }\n  });\n```\n\n你也可以通过将验证逻辑添加到\
  \ `submit` 处理器中，在用户提交表单时实现验证。例如，以下代码向提交处理器中添加了一个验证函数，如果元素不是以文本 `\"vfx\"` 开头，则显示\
  \ `alert` 且不提交表单：\n\n点击此处查看代码图像\n\n```javascript\n$(\"form\").submit(function (){\n\
  \    if (!$(\"#vfxField\").val().match(\"^vfx\")){\n      alert(\"Invalid vfx element\"\
  );\n      e.preventDefault();\n    }\n  });\n```\n\n## 获取 jQuery 验证插件\n\n使用上一节中的技术，你可以验证几乎任何类型的表单元素。问题是添加验证需要大量的代码和时间。与其重新发明轮子，你可以使用\
  \ `jQuery` 验证插件，它可以处理大多数验证需求。\n\n作为一个插件，`validator` 是在加载 `jquery.js` 文件后加载 `.js`\
  \ 文件来实现的。例如：\n\n点击此处查看代码图像\n\n```html\n<script type=\"text/javascript\" src=\"../js/jquery.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"js/jquery.validate.min.js\"></script>\n\
  ```\n\n可以从此处下载插件：`http://jqueryvalidation.org/`\n\n验证插件的文档可以在此处找到：`http://docs.jquery.com/Plugins/Validation/`\n\
  \n## 使用 HTML 应用简单的 jQuery 验证\n\n可以使用 `class` 和 `title` 属性在 HTML 中实现验证器。该验证器使用一组规则（如\
  \ `required` 或 `email`）来验证表单元素。将 `class` 属性设置为这些规则之一或多个，当在表单上调用 `.validate()` 时就会应用验证。表\
  \ 13.3 列出了若干条验证规则。\n\n![图像](img/image00924.jpeg)![图像](img/image00925.jpeg)\n\n**表\
  \ 13.3 验证规则与用法**\n\n例如，要验证文本元素是否具有文本且符合电子邮件格式，你使用以下代码：\n\nHTML:\n\n点击此处查看代码图像\n\n\
  ```html\n<form id=\"myForm\">\n  <input type=\"text\" class=\"required email\" />\n\
  </form>\n```\n\njQuery:\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n\
  \    $(\"#myForm\").validate();\n});\n```\n\n`.ready()` 函数将验证添加到表单中，当用户在元素中输入时，如果元素为空，会显示该元素是必填的；如果不包含有效的电子邮件地址，则显示需要有效的电子邮件地址，如\
  \ 图 13.6 所示。\n\n![图像](img/image00926.jpeg)\n\n**图 13.6** 电子邮件元素的验证消息。\n\n你也可以添加自定义的文本消息，而不是验证库提供的默认消息。这是通过将\
  \ `title` 属性设置为你想要显示的消息字符串来实现的。例如，以下输入语句添加了当元素无效时将显示的 title 元素：\n\n点击此处查看代码图像\n\n\
  ```html\n<input type=\"text\" class=\"required\" title=\"Must add Email\"/>\n```\n\
  \n## 应用复杂的验证\n\n添加验证的更好方法是在 `jQuery` 方法内部。`validate` 方法接受一个定义了规则的对象（规则列在 表 13.3\
  \ 中），通过引用 `name` 属性应用于表单中。\n\nHTML:\n\n```html\n<form id=\"myForm\">\n  <input type=\"\
  text\" class=\"required email\" />\n</form>\n```\n\njQuery:\n\n点击此处查看代码图像\n\n```javascript\n\
  $(document).ready(function(){\n    $(\"#myForm\").validate();\n});\n```\n\n`.ready()`\
  \ 函数将验证添加到表单中，当用户在元素中输入时，如果元素为空，会显示该元素是必填的；如果不包含有效的电子邮件地址，则显示需要有效的电子邮件地址，如 图 13.6\
  \ 所示。\n\n### 添加规则\n\n验证对象的 `rules` 属性允许你为元素定义规则。以下代码演示了使用 `rules` 方法：\n\n```javascript\n\
  $(document).ready(function(){\n    $(\"#myForm\").validate({\n      rules: {\n \
  \       emailField: {\n          required: true,\n          email: true\n      \
  \  }\n      }\n    });\n});\n```\n\n### 添加消息\n\n你也可以添加自定义的文本消息，而不是验证库提供的默认消息。这是通过设置验证对象的\
  \ `messages` 属性来实现的。以下代码演示了向验证添加消息：\n\n```javascript\n$(document).ready(function(){\n\
  \    $(\"#simpleForm\").validate({\n      rules: {\n        emailField: {\n    \
  \      required: true,\n          email: true\n        }\n      },\n      messages:\
  \ {\n        emailField: {\n          required: \"Must add Email\",\n          email:\
  \ \"Email format = me@here.com\"\n        }\n      }\n    });\n});\n```\n\n### 提示\n\
  \n`validate()` 方法接受一个 `debug` 选项，它可以禁用表单提交以便进行测试。要实现表单调试模式，请使用：\n\n```javascript\n\
  $(form).validate({\n  debug: true\n});\n```\n\n`.validate()` 方法返回一个 `Validator`\
  \ 对象，它提供了许多用于检查表单验证的方法。表 13.4 列出了 `Validator` 对象可用的方法。以下代码演示了通过调用 `.form()` 方法使用\
  \ `Validator` 对象检查表单的有效性：\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n\
  \  var validator = $(\"#simpleForm\").validate(...);\n  if(!validator.form()){ alert(\"\
  Form is not valid\"));\n});\n```\n\n**表 13.4 Validator 对象方法**\n\n当表单元素中检测到错误时，会向表单添加一个标签以显示错误消息。插件会在该元素和新的消息标签上添加一个名为\
  \ `error` 的类。这使得对消息以及元素的样式设置变得非常简单。\n\n\n\n\n要对元素设置样式，你可以为该元素类型添加 CSS 规则并添加 `.error`。例如，为了让带有错误的\
  \ `input` 元素显示为红色文本，你可以使用以下 CSS 规则：\n\n```css\ninput.error { color:red; }\n```\n\
  \n你也可以使用相同的方法通过 `label.error` 选择器对显示的错误消息设置样式。例如，以下代码将错误消息的字体颜色设置为红色：\n\n```css\n\
  label.error { color:red; }\n```\n\n### 放置验证消息\n\n验证插件会将错误消息直接放置在经过验证的元素之后。这通常不是期望的位置。例如，你可能希望验证信息出现在某些元素之前，或者在完全不同的位置。\n\
  \n***\n\n注意\n\njQuery Validation 工具为 Web 表单验证本地化提供了一个简单的方法。如果你包含了在本地化文件夹中找到 `messages_##.js`\
  \ 文件，验证错误消息将会被本地化。`messages_##.js` 中的两位数字（`##`）代表两个字符的 ISO 国家代码。\n\n***\n\n一个很好的例子是单选框输入组（radio\
  \ input groups）。如果你对该组进行验证，消息将出现在第一个单选框输入元素之后，如 图 13.7 所示。这并不是期望的位置。相反，你希望错误消息出现在整组单选框输入及其标签之后。\n\
  \n![Image](img/image00928.jpeg)\n\n**图 13.7** 在 `.validate()` 方法中使用 `errorPlacement`\
  \ 选项允许你定义错误消息的位置。\n\n这正是 `Validation` 对象的 `errorPlacement` 属性派上用场的地方。`errorPlacement`\
  \ 属性值是一个函数，被调用以向 Web 表单添加错误元素。`errorPlacement` 函数将传递两个参数。第一个参数是代表新错误消息的 jQuery 对象，第二个参数是代表验证失败元素的\
  \ jQuery 对象。使用这些参数，你可以定义自己的函数，将元素放置在你想要的任何地方。\n\n为了说明这一点，请看以下代码。`errorPlacement`\
  \ 被设置为一个接收 `error` 和 `element` 参数的函数。对 `element` 进行测试以判断是否为单选框。如果 `element` 是单选框输入，则将\
  \ `error` 插入到表单中最后一个单选框之后的标签之后，如 图 13.7 所示。如果 `element` 不是单选框输入，则 `error` 紧接插入到\
  \ `element` 之后：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#simpleForm\").validate({\n\
  \  rules: {\n    gender: {required:true}\n  },\n  errorPlacement: function(error,\
  \ element){\n    if (element.is(\":radio\")){\n      error.insertAfter($(\"input:radio:last\"\
  ).next(\"label\"))\n    }\n    else {error.insertAfter(element)}}\n});\n```\n\n\
  ***\n\n### 动手尝试：使用 jQuery 验证 Web 表单\n\n在这个示例中，你使用 jQuery 验证插件来验证一个基础 Web 表单。该示例目的是帮助你理解如何在自己的脚本中实现该验证插件。\n\
