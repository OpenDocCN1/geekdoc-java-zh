  \ $q 服务提供延迟响应\n\nAngularJS 提供的一个极其实用的服务是 `$q` 服务。`$q` 服务是一个 promise/延迟（deferred）实现。由于并不是所有服务都能立即响应请求，因此需要推迟响应，直到该服务准备好响应。这正是\
  \ `$q` 服务用武之地场。其核心思想是：你可以发送一个请求，而不是直接获取响应，而是将获得一个关于服务将响应的 promise。请求的应用程序可以分配一个回调函数，在延迟请求完成或失败时执行该函数。\n\
  \n要利用 `$q` 服务实现延迟响应，你首先需要使用以下语法创建一个延迟对象：\n\n```javascript\nvar deferred = $q.defer();\n\
  ```\n\n获取延迟对象后，你可以通过访问 `promise` 属性来传递该 `promise`。例如，下面这行代码将 `promise` 返回给调用它的应用程序：\n\
  \n```javascript\nfunction makeDeferredRequest(){\n  var deferred = $q.defer();\n\
  \  return deferred.promise;\n}\n```\n\n请求的应用程序随后可以调用 `promise` 对象上的 `then()` 方法，使用以下语法注册\
  \ `successCallback`、`errorCallback` 和 `notifyCallback` 函数：\n\n```javascript\npromise.then(successCallback,\
  \ errorCallback, notifyCallback)\n```\n\n以下展示了 `then()` 函数的示例实现：\n\n```javascript\n\
  var promise = makeDeferredRequest();\npromise.then(\n  function successCallback(value){\n\
  \    //处理成功\n  },\n  function errorCallback(value){\n    //处理错误\n  },\n  function\
  \ notifyCallback(value){\n    //处理通知\n  }\n);\n```\n\n在延迟服务端，你可以使用 表 27.6 中描述的方法来向请求应用程序通知请求的状态。\n\
  \n![Image](img/image01049.jpeg)\n\n**表 27.6 $q 服务的延迟对象的可用方法**\n\n第 28  [#part0043.xhtml_ch28]\
  \ 节“实现数据库访问服务”部分以及“创建你自己的 AngularJS 服务”展示了这些。\n\n### 总结\n\nAngularJS 服务是可以在依赖注入器注册的单例对象。控制器和其他\
  \ AngularJS 组件可以消费它们。AngularJS 通过服务提供了许多后端功能，例如 `$http`，允许你轻松地将 Web 通集成到 AngularJS\
  \ 中。\n\n在本节中，你还学习了几个内置服务，如 `$cookieStore`、`$q`、`$window`、`$location`、`$animate`\
  \ 和 `$cacheFactory`。这些以及 AngularJS 服务可以用于将功能注入到控制器、指令中。\n\n### 问答\n\n**Q](#part0042.xhtml_ch27aa01)\
  \ AngularJS 提供的内置服务是以单例运行的吗？**\n\n**A](#part0042.xhtml_ch27qq01) 是的，但它们是懒性单例，这意味着只有在依赖它们时才会被实例化。**\n\
  \n### 练习\n\n练习由一组问题组成，旨在巩固你对本节内容的理解。在查看答案之前请尝试回答这些问题。\n\n#### 测试\n\n**1](#part0042.xhtml_ch27as01)\
