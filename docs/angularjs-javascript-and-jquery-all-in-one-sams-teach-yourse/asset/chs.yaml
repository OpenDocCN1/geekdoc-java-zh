  <body onload=\"writeIt()\">\n</body>\n</html\n```\n\n### 总结\n\n在本节中，我们讨论了 JavaScript\
  \ 对象如何提供创建更简洁、更高效代码的方法。你学习了对象如何支持在单个变量名上附加属性和方法。\n\n你还接触了几个内置对象，如 `Array` 和 `String`。内置对象提供了许多属性和方法，能够用极少的代码实现快速的功能——例如，使用\
  \ `Date` 对象获取系统时间、比较时间以及向浏览器创建基于时间的输出。\n\n最后，你获得了一个机会创建并操作自己的带有属性和方法的自定义 JavaScript\
  \ 对象。创建自定义对象将帮助你更有效地组织脚本。\n\n### 问答 (Q&A)\n\n**问. 内置对象、自定义对象、DOM 对象和 jQuery 对象之间有什么区别？**\n\
  \n**答.** 区别仅在于它们是如何被定义的。内置对象是自动定义的，并且有时作为语言的一部分直接可用；就像数组或字符串一样，它们在赋值语句执行期间会被自动实例化。DOM\
  \ 对象也是内置在 JavaScript 语言中的。你可以在 JavaScript 中创建它们的实例，但它们也是根据 HTML 文件中的标签创建的。jQuery\
  \ 对象是在 jQuery 库内部定义并创建的。在底层，它们都只是 JavaScript 对象。每个对象都拥有可以简化 JavaScript 任务的属性和方法。\n\
  \n**问. `new` 关键字会创建一个对象的新实例，但我如何移除对象实例以释放内存等资源呢？**\n\n**答.** 当变量超出作用范围时，JavaScript\
  \ 会自动为你清理内存。要清理 JavaScript 对象的实例，请将引用设置为 `null`。要清理 JavaScript 对象的实例，请将引用设置为 `null`。（等一下，原文此处有重复，我将保留提供的核心逻辑）。\n\
  \n最后，你获得了一个机会创建并操作自己的带有属性和方法的自定义 JavaScript 对象。创建自定义对象将帮助你更有效地组织脚本。\n\n### 工作坊 (Workshop)\n\
  \n该工作坊由一组旨在巩固你理解的问答组成。在查看答案之前，尝试回答这些问题。\n\n### 测试 (Quiz)\n\n**问. 内置对象、自定义对象、DOM\
  \ 对象和 jQuery 对象之间有什么区别？**\n\n**答.** 区别仅在于它们是如何被定义的。内置对象是自动定义的，并且有时作为语言的一部分直接可用；就像数组或字符串一样，它们在赋值语句执行期间会被自动实例化。DOM\
  \ 对象也是内置在 JavaScript 语言中的。你可以在 JavaScript 中创建它们的实例，但它们也是根据 HTML 文件中的标签创建的。jQuery\
  \ 对象是在 jQuery 库内部定义并创建的。在底层，它们都只是 JavaScript 对象。每个对象都拥有可以简化 JavaScript 任务的属性和方法。\n\
  \n**问. `new` 关键字会创建一个对象的新实例，但我如何移除对象实例以释放内存等资源呢？**\n\n**答.** 当变量超出作用范围时，JavaScript\
  \ 会自动为你清理内存。要清理 JavaScript 对象的实例，请将引用设置为 `null`。\n\n### 练习 (Exercises)\n\n**1.**\
  \ 扩展 `Listing 6.1` 中的代码以添加更多字符。\n**2.** 扩展 `Listing 6.2` 中的代码以添加更多属性。\n**3.** 扩展\
  \ `Listing 6.3` 中的代码以添加更多方法。\n\n## 第二部分：在网页中实现 jQuery 和 JavaScript\n\n## 第 7 节 使用\
  \ JavaScript 和 jQuery 访问 DOM 元素\n\n在本节中你将学习：\n\n- jQuery 和 JavaScript 的区别\n- 如何判断一个对象是\
  \ jQuery 对象还是 DOM 对象\n- 如何访问 DOM 元素\n\n### 理解 DOM 对象与 jQuery 对象\n\n你需要理解 DOM 对象和\
  \ jQuery 对象之间的区别，以及如何有效地操作和使用这两种对象。在这一节中，你将学习这些类型的对象以及如何在它们之间进行导航。\n\n#### 介绍 JavaScript\
  \ DOM 对象\n\nDOM 对象是网络浏览器用于渲染网页上元素的对象。因此，DOM 对象拥有大量的函数和属性。处理 DOM 对象的优势是你可以直接访问所需的一切内容。\n\
  \nDOM 对象的缺点是，大多数附加的函数和属性是浏览器需要的，当你编写 JavaScript 时它们并不一定有用。这意味着 DOM 对象具有许多属性和方法，会干扰你的调试环境（例如\
  \ Chrome 开发工具或其他 JavaScript 控制台）。\n\n#### 介绍 jQuery 对象\n\njQuery 对象基本上是围绕一组 DOM\
  \ 元素的封装对象。jQuery 对象仍然是 JavaScript 对象，并提供了访问 DOM 元素的方法——但这种方式是完全不同、更简单且通常更有效的。\n\n\
  最需要记住的一点是，jQuery 对象可能代表单个 DOM 对象，也可能代表多个 DOM 对象。因此，如果你对 jQuery 对象执行某个操作，该操作可能会应用于多个\
  \ DOM 对象上。\n\n\n\n`jQuery` 对象的最大优势在于在网页中搜索 HTML 元素非常简单。另一个优势是 `jQuery` 库专门封装了方法和属性，使得\
  \ JavaScript 和 `jQuery` 开发者能够更方便地操作和处理不同组的对象。在 `jQuery` 对象上调用方法可以同时应用于一个或多个 DOM\
  \ 元素，而无需遍历列表。\n\n表 7.2 提供了你应该注意的一些 `jQuery` 对象的重要方法列表。该列表并不是详尽的；其目的是让你对可以从 `jQuery`\
  \ 对象访问的内容有一个大致的了解。\n\n![Image](img/image0086.jpeg)\n\n**表 7.2 附加到 jQuery 对象的某些常用方法**\n\
  \n### 确定对象是 DOM 还是 jQuery\n\n有时你可能会发现自己处于一种情况：你拥有一个对象，但不确定它是一个 `jQuery` 对象、DOM 对象还是其他\
  \ JavaScript 对象。有一个非常简单的方法可以区分它们。\n\n要判断一个对象是否为 `jQuery` 对象，请使用以下 `if` 语法检查该对象是否具有\
  \ `jquery` 属性：\n\n```javascriptif( obj.jquery ) {\n  ...\n}\n```\n\n要判断一个对象是否为 DOM\
  \ 对象，请使用以下 `if` 语法检查该对象是否具有 `nodeType` 属性：\n\n```javascript\nif( obj.nodeType )\
  \ {\n  ...\n}\n```\n\n### 将对象从 DOM 转换为 jQuery 以及反之\n\n如果你有一个 `jQuery` 对象但想使用为 DOM\
  \ 对象设计的代码，或者反之，该怎么办？答案是将对象转换为另一种类型。\n\n`.get()` 方法以 DOM 对象数组的形式返回 JavaScript 版本的\
  \ `jQuery` 元素集。使用以下代码调用 `get()` 函数，返回由 `jQuery` 对象代表的 HTML 元素的 DOM 对象：\n\n点击此处查看代码图像\n\
  \n```\nvar domObj = jqueryObj.get();\n```\n\n相反，`$()` 或 `jquery()` 方法可以从 JavaScript\
  \ 创建新的 `jQuery` 对象。使用以下代码执行 `$()` 函数，将 DOM 对象封装为 `jQuery` 对象：\n\n```\nvar jqueryObj\
  \ = $(domObj);\n```\n\n### 从 JavaScript 访问 DOM 对象\n\n为了能够从 JavaScript 操作 HTML 元素，你首先需要获取\
  \ DOM 对象的访问权限。你可以使用几种方法来实现。\n\n#### 通过 ID 查找 DOM 对象\n\n最简单是使用 `getElementById(id)`\
  \ 函数通过 `id` 属性的值来查找 HTML 元素。`getElementById(id)` 在 DOM 中搜索具有匹配 `id` 属性的对象。\n\n例如，以下代码搜索\
  \ `id=\"container\"` 的 HTML 元素：\n\n点击此处查看代码图像\n\n```\nvar containerObj = document.getElementById(\"\
  container\");\n```\n\n#### 通过类名查找 DOM 对象\n\n你也可以使用 `getElementsByClassName(class)`\
  \ 通过 `class` 属性搜索 HTML 元素。该函数会返回一个包含具有匹配 `class` 属性的 DOM 列表。然后，你可以使用 JavaScript\
  \ 循环遍历该列表，并对每个 DOM 元素应用更改。\n\n例如，以下代码获取 `class=\"myClass\"` 的 HTML 元素列表，然后对它们进行迭代：\n\
  \n点击此处查看代码图像\n\n```\nvar objs = document.getElementsByClassName(\"myClass\");\n\n\
  for (var i=0; i<objs.length; i++){\n  var htmlElement = objs[i];\n  ...\n}\n```\n\
  \n#### 通过标签名查找 DOM 对象\n\n另一种搜索 HTML 元素的方法是通过它们的 HTML 标签，使用 `getElementsByTagName(tag)`。该函数返回一个包含具有匹配\
  \ HTML 标签的 DOM 列表。然后，你可以使用 JavaScript 循环遍历该列表，并对每个 DOM 元素应用更改。\n\n例如，以下代码获取 `<div>`\
  \ HTML 元素列表，然后对它们进行迭代：\n\n点击此处查看代码图像\n\n```\nvar objs = document.getElementsByTagName(\"\
  div\");\n\nfor (var i=0; i<objs.length; i++){\n  var htmlElement = objs[i];\n  ...\n\
  }\n```\n\n***\n\n### 动手试一下：使用 JavaScript 访问 DOM 对象\n\n在这个示例中，你使用 JavaScript 查找不同的元素并读取值以及向它们写入值。这是一个基础示例，旨在让你有机会使用\
  \ JavaScript 访问 DOM 对象。示例中使用的完整脚本显示在 列表 7.1、7.2 和 7.3 中：\n\n**1.** 在 Eclipse 中，创建一个名为\
  \ `lesson07` 的源文件夹。在 `lesson07` 文件夹内创建 `js` 和 `css` 文件夹。\n\n**2.** 在 `lesson07`\
  \ 文件夹中创建一个名为 `dom_objects.html` 的源文件。\n\n**3.** 添加常规的基础元素（`html`、`head`、`body`）。\n\
  \n**4.** 在 `<head>` 元素内部，添加以下 `<script>` 和 `<link>` 元素，如列表 7.1\n\n```html\n<script\
  \ type=\"text/javascript\" src=\"js/dom_objects.js\"></script>\n<link rel=\"stylesheet\"\
  \ type=\"css\" href=\"css/dom_objects.css\">\n```\n\n**5.** 添加以下 `<input>` 元素来定义文本框和按钮。注意在按钮上，你需要添加\
  \ `onclick` 处理程序，这允许你运行动态脚本。文本输入具有 `id=\"text\"`：\n\n点击此处查看代码图像\n\n```html\n<input\
  \ id=\"text\" />\n```\n\n**6.** 添加以下 `<span>` 和 `<p>` 元素。现在它们是空的；动态代码将更新它们：\n\n\
  点击此处查看代码图像\n\n```html\n<span class=\"heading\"></span>\n<p></p>\n```\n\n**7.** 创建名为\
  \ `lesson07/js/dom_objects.js` 的文件。\n\n**8.** 创建一个函数 `textChange()`，如列表 7.2 所示。该将在点击按钮时被调用。\n\
  \n**9.** 在 `textChange()` 函数中添加以下变量定义，通过 `id=\"text\"` 查找文本输入：\n\n```javascript\n\
  var inElement = document.getElementById(\"text\");\n```\n\n**10.** 添加以下变量定义以通过标签名获取所有的\
  \ `<p>` 元素：\n\n**11.** 添加 `for` 循环，遍历文档中找到的元素。对于每个元素，你将 `innerHTML` 文本设置为 `inElement.value`，即在文本框中输入的内容。\n\
  \n**12.** 创建名为 `lesson07/css/dom_objects.css` 的文件，并添加如列表 7.3\n\n**图 7.1** 一个允许用户输入文本并更新组件的简单\
  \ JavaScript 网页。\n\n\n\n\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"css/dom_objects.css\">\n</head>\n<body>\n  <input id=\"textIn\" type=\"\
  text\"/>\n  <input type=\"button\" onclick=\"textChange()\" value=\"Update\" /><br>\n\
  \  <span class=\"heading\"></span>\n  <p id=\"p1\"></p>\n  <span class=\"heading\"\
  ></span>\n  <p id=\"p2\"></p>\n</body>\n</html>\n```\n\n***\n\n## 列表 7.2 dom_objects.js\
  \ JavaScript 文件包含一个显示通过 id、标签和类属性访问变量的函数\n\n点击此处查看代码图片\n\n```javascript\nfunction\
  \ textChange(){\n   var inElement = document.getElementById(\"textIn\");\n   var\
  \ outElements = document.getElementsByTagName(\"p\");\n   var headingElements =\
  \ document.getElementsByClassName(\"heading\");\n   for(var i=0; i<outElements.length;\
  \ i++){\n      var outItem = outElements[i];\n      headingElements[i].innerHTML\
  \ = \"Updating \" + (i+1) +\n                                     \" to \" + inElement.value;\n\
  \      outItem.innerHTML = inElement.value;\n   }\n}\n```\n\n***\n\n## 列表 7.3 dom_objects.css\
  \ 样式化 <p> 元素的 CSS\n\n```css\np{\n   font-weight:bold;\n   font-size:50px;\n   margin:5px;\n\
  \   color:blue;\n}\n```\n\n***\n\n### 使用 jQuery 选择器\n\n与 JavaScript 不同，jQuery 允许你使用选择器以无数种方式查找\
  \ HTML 元素。是的，就像 CSS 选择器一样。事实上，大多数 jQuery 选择器都是取自 CSS，这在两者之间提供了更无缝的过渡。\n\n正如你将在后续章节中发现的，jQuery\
  \ 选择器可以非常方便地选择任何一组 HTML 元素。但请记住，jQuery 选择器返回的是 jQuery 对象，而不是 DOM 对象。\n\njQuery 选择器语法非常直观。在加载\
  \ jQuery 库后，使用 `$(selector)`。例如：\n\n`$(\"#myElement\")`\n\n***\n\n### 注意事项\n\njQuery\
  \ 选择器语法中使用了几个元字符。如果你想将任何元字符（如 ``!\"#$%&'()*+,./:;<=>?@[\\]^`{|}~ )``）作为类/id/名称的一部分，你需要使用双反斜杠\
  \ `\\\\` 对该字符进行转义。例如，如果你有一个具有 `id=\"my.element\"` 的元素，你将使用选择器 `$(\"#my\\\\.element\"\
  )`。\n\n***\n\n与 CSS 选择器一样，向你介绍 jQuery 选择器的最佳方法是展示一些示例。以下章节将带你通过不同类型的 jQuery 选择器的示例。这些章节仅触及皮毛。你有空时，可以去以下位置查看选择器文档：\n\
  \n[`http://api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)\n\
  \n#### 应用基础选择器\n\n最常用的选择器是基础选择器。基础选择器侧重于 HTML 元素的 id 属性、类属性和标签名。表 7.3 列出了一些示例，向你展示如何定义一些基础选择器。\n\
  \n![图像](img/image00868.jpeg)\n\n**表格 7.3 使用基础 jQuery 选择器的示例**\n\n#### 应用属性选择器\n\n\
  使用 jQuery 选择器的另一种方法是通过它们的属性值选择 HTML 元素。这可以是默认属性，也可以是你添加到 HTML 元素中的属性。属性值在选择器语法中用\
  \ `[]` 括号表示。表 7.4 显示了属性选择器应用的一些方式。\n\n![图像](img/image00869.jpeg)![图像](img/image00870.jpeg)\n\
  \n**表格 7.4 使用属性 jQuery 选择器的示例**\n\n#### 应用内容选择器\n\n另一组有用的 jQuery 选择器是内容过滤选择器。这些选择器允许你根据\
  \ HTML 元素内部的内容选择 HTML 元素。表 7.5 显示了内容选择器的示例。\n\n![图像](img/image00871.jpeg)\n\n**表格\
  \ 7.5 使用内容选择器的示例**\n\n#### 应用层级选择器\n\n一组重要的 jQuery 选择器是层级选择器。这些选择器允许你根据 HTML 元素的父元素、子元素或\
  \ DOM 中的元素元素选择 HTML 元素。表 7.6 显示了层级示例。\n\n![图像](img/image00872.jpeg)\n\n**表格 7.6\
  \ 层级选择器的示例**\n\n***\n\n### 注意\n\n在设计选择器时，尽可能具体总是是最好的。例如，如果你想选择 `div` 下所有 `class=\"\
  menu\"` 的 `span` 元素，那么 `$(\"div .menu\")` 会比 `$(\".menu\")` 高效得多。\n\n***\n\n####\
  \ 应用表单选择器\n\n另一组有用的选择器是表单。表 7.7 显示了表单选择器的示例。\n\n![图像](img/image00873.jpeg)\n\n**表格\
  \ 7.7 使用表单选择器的示例**\n\n#### 应用可见性选择器\n\n如果你使用可见性来控制网页的流程和交互，使用可见性选择器可以简单地选择隐藏或显示的元素。表\
  \ 7.8 显示了可见性的示例。\n\n![图像](img/image00874.jpeg)\n\n**表格 7.8 使用可见性选择器的示例**\n\n####\
  \ 应用过滤选择器\n\n你通常需要将选择器缩小到更具体的子集。实现此点的方法是使用过滤选择器。过滤选择器在选择语句末尾添加过滤器以限制选择器的结果。表 7.9\
  \ 显示了向选择器添加过滤器。\n\n![图像](img/image00875.jpeg)![图像](img/image00876.jpeg)\n\n**表格\
  \ 7.9 使用过滤选择器的示例**\n\n***\n\n### 动手尝试：使用 jQuery 访问 DOM 对象\n\n在这个示例中，你使用 jQuery 找到元素并读取值。这是另一个有助于巩选择器如何访问\
  \ DOM 对象的概念示例。在本节的后面你将看到更多高级的示例。示例中使用的完整脚本显示在列表 7.4、7.5 和 7.6 中：\n\n1. 在 `07` 文件夹中创建源文件\
  \ `jquery_selectors.html`、`js/jquery_selectors.js` 和 `css/jquery_selectors.css`。\n\
  2. 打开 `jquery_selectors.html` 并添加常规元素（`html`、`head`、`body`）。\n3. 在 `<head>` 元素内部添加以下\
  \ `<script>` 和 `<link>` 元素（见列表 7.4），用于加载 jQuery、JavaScript 和 CSS：\n\n```html\n<script\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n<script type=\"\
  text/javascript\" src=\"js/jquery_selectors.js\"></script>\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"css/jquery_selectors.css\">\n```\n\n4. 现在添加以下 `<span>`\
  \ 元素，它们将被样式化为按钮。每个 `<span>` 元素包含不同的 `onclick` 处理程序，允许你在点击时运行你的动态脚本：\n\n```html\n\
  <span onclick=\"setEven()\">Even</span>\n<span onclick=\"setOdd()\">Odd</span>\n\
  <span onclick=\"setFirst4()\">First 4</span>\n```\n\n\n\n\n5. 将列表 7.4 中所示的 `<p>`\
  \ 和 `<ul>` 元素添加到页面中，以添加古代神列表。\n\n6. 打开 `jquery_selectors.css` 文件，并添加列表 7.6 中的内容，这些内容将\
  \ `<span>` 元素样式为按钮，并将 `<p>` 元素样式为列表头。\n\n7. 打开 `jquery_selectors.js` 文件，以便为 `<span>`\
  \ 元素添加事件处理程序。\n\n8. 添加一个名为 `setEven()` 的 JavaScript 函数作为事件处理程序。\n\n9. 添加以下行，该行使用\
  \ jQuery 选择所有 `<li>` 和 `<span>` 元素，并清空 CSS 的 `font-weight` 值：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"li, span\").css(\"font-weight\",\"\");\n```\n\n10. 添加以下行，这些行定义了一个名为\
  \ `$evenItems` 的变量，结果为选择所有 `<li>` 元素的选择器，然后过滤列表仅保留偶数索引的项。第 3 行使用 `$evenItems` 变量将这些项的\
  \ CSS `font-weight` 属性设置为粗体：\n\n点击此处查看代码图片\n\n```javascript\nvar $evenItems = $(\"\
  li:even\");\n$evenItems.css(\"font-weight\",\"bold\");\n```\n\n11. 添加以下行，该行使用 jQuery\
  \ 选择内容包含 \"Even\" 的 `<span>` 元素，并将 CSS `font-weight` 属性设置为 `bold`：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"span:contains(Even)\").css(\"font-weight\",\"bold\");\n```\n\
  \n12. 添加以下行，该行使用 jQuery 选择带有 `class=\"label\"` 的元素以选择 `<p>` 元素。语句的 `.html(\"Even\"\
  )` 部分将所选元素的 `innerHTML` 属性更改为 `\"Even\"`，从而更改标题：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\".label\").html(\"Even\");\n```\n\n13. 添加列表 7.5 中所示的两个事件处理程序 `setOdd()` 和 `setFirst4()`，它们基本上在做相同的事情，但针对的是不同的列表项。\n\
  \n14. 保存这三个文件并在网页浏览器中打开 `jquery_selectors.html` 文件，以检查图 7.2 所示的网页。尝试点击不同的按钮，并观察按钮、标题和列表项的变化。\n\
  \n![Image](img/image00877.jpeg)\n\n**图 7.2** 一个简单的 JavaScript Web 页面，使用 jQuery 根据用户交互动态更改页面元素。\n\
  \n**列表 7.4 jquery_selectors.html 加载 jQuery 和 JavaScript 并附加事件处理程序元素以提供用户交互的 HTML\
  \ 文件**\n\n点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n03    <head>\n04\
  \      <title>jQuery Selectors</title>\n05      <meta charset=\"utf-8\" />\n06 \
  \     <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07\
  \      <script type=\"text/javascript\" src=\"js/jquery_selectors.js\"></script>\n\
