  \ 0 和 1 处停止。\n\n## 第 11 节：与窗口、浏览器及其他非网页元素元素交互\n\n本节你将学到：\n\n![Image](img/image00767.jpeg)\
  \ 在网页中添加定时器\n\n![Image](img/image00767.jpeg) 获取和设置 cookie\n\n![Image](img/image00767.jpeg)\
  \ 创建弹出窗口\n\n动态网页通常需要你访问 HTML 元素之外的内容，在某些情况下甚至可以操作这些内容。JavaScript 提供了一系列丰富的对象和函数，允许你访问有关屏幕、浏览器窗口、历史记录等信息。\n\
  \n本节的第一部分描述了 `screen`、`window`、`location` 和 `history` 对象，这些对象为 JavaScript 提供了访问网页之外信息的接口。第二部分涵盖了利用这些对象来实现\
  \ cookie、弹出窗口和定时器。\n\n### 理解 Screen 对象\n\n你在之前的课程中已经见过 screen 对象的用法。你曾使用 screen\
  \ 对象来获取色彩深度以及屏幕的高度和宽度。随着移动设备和平板电脑的普及，获取屏幕尺寸变得更加重要。\n\n由于有多种屏幕尺寸可用，因此你必须能够设计你的网页和动态交互以考虑到屏幕尺寸。\n\
  \n表 11.1 描述了 screen 对象上提供的全属性。\n\n![Image](img/image00904.jpeg)\n\n**表 11.1 Screen\
  \ 对象属性**\n\n### 使用 Window 对象\n\nwindow 对象是外部对象集中迄为止最强大的。window 对象提供了对浏览器窗口的访问，允许你获取如浏览器窗口的尺寸和位置等信息。\n\
  \n使用 window 对象，当你想要显示额外的网页内容但不想离开当前页面时，还可以创建并控制新的浏览器窗口。\n\n以下章节描述了附加到 window 对象的某些方法和属性。\n\
  \n#### 访问 Window 对象属性\n\nwindow 对象为你提供了有关浏览器窗口的重要信息。你可以访问当前窗口甚至其父窗口的大小和位置。例如，以下代码获取了从屏幕左上角到浏览器左上角的像素距离：\n\
  \n点击此处查看代码图片\n\n```\nvar fromTop = window.self.screenY;\n\nvar fromLeft = window.self.screenX;\n\
  ```\n\n表 11.2 显示了某些较重要的 window 对象属性列表及其用途。\n\n![Image](img/image00905.jpeg)\n\n\
  **表 11.2 Window 对象属性**\n\n#### 使用 Window 方法\n\nwindow 对象还提供了一系列方法，允许你创建并管理额外的窗口。\n\
  \n例如，以下代码通过 window 对象打开一个新的浏览器窗口并加载指定的 URL：\n\n点击此处查看代码图片\n\n```\nvar tempWindow\
  \ = window.open(\"http://com\");\n```\n\n稍后，在 JavaScript 代码中你可以使用以下语句关闭该窗口：\n\n\
  ```\ntempWindow.close();\n```\n\n表 11.3 显示了某些较重要的 window 对象属性及其用途。\n\n![Image](img/image00906.jpeg)\n\
  \n**表 11.3 Window 方法**\n\n### 使用浏览器 Location 对象\n\nlocation 对象提供了对当前位置的访问。这允许你获取\
  \ URL 信息，还可以刷新页面或加载新页面。\n\n例如，以下语句从当前页面获取 URL 并加载新页面：\n\n```\nvar oldURL = location.href;\n\
  \nlocation.assign(\"http://com\");\n```\n\n此外，如果 URL 指向页面上的某个锚点，你可以通过 `location.hash`\
  \ 获取该部分：\n\n```\nvar anchor = location.hash;\n```\n\n表 11.4 描述了属性。\n\n![Image](img/image00907.jpeg)\n\
  \n**表 11.4 Location 对象属性和方法**\n\n### 使用浏览器 History 对象\n\nhistory 对象提供了对浏览器导航历史的访问，允许你动态地向前向后移动，而无需用户点击浏览器的前进/后退按钮。\n\
  \n#### 在历史记录中前进\n\n向前移动时可以使用 `history.forward()` 前到历史中的下一个 URL，或者可以使用 `history.go(n)`，其中\
  \ `n` 是一个表示移动步数的正数。例如，以下语句向前移动三个 URL：\n\n```\nhistory.go(3);\n```\n\n#### 在历史记录中向后\n\
  \n向后移动时可以使用 `history.back()` 回到历史中的上一个 URL，或者可以使用 `history.go(n)`，其中 `n` 是一个表示移动步数的负数。例如，以下语句向后移动两个\
  \ URL：\n\n```\nhistory.go(-2);\n```\n\n\n\n\n\n要锁定网页上的外部链接，你首先需要为链接到外部的 `<a>` 标签添加点击事件处理程序，然后在点击事件对象上调用\
  \ `preventDefault()`。例如，以下代码使用 jQuery 的 `^=` 选择器语法来查找 `href` 以 `http://` 开头的 `<a>`\
  \ 标签，然后添加一个防止浏览器默认行为的点击处理程序函数：\n\n点击此处查看代码图片\n\n```javascript\n$('ahref^=\"http://\"\
  ').click(function (e){\n    这里写你自己的处理程序代码 . . .\n    e.preventDefault();\n});\n\
  ```\n\n### 强制链接在新浏览器窗口中打开\n\n你通过简单的 jQuery 脚本可以执行的另一个有用任务是强制外部链接在新窗口中打开。这可以使当前窗口保持可用状态。\n\
  \n要强制外部链接在新窗口中打开，请为链接到外部的 `<a>` 标签将 `target` 属性设置为“`_blank`”。例如，以下代码查找 `href` 以\
  \ `http://` 开头的 `<a>` 标签，然后将 `target` 属性设置为“`_blank`”，强制链接在点击时在新的浏览器窗口中打开：\n\n[点击此处查看代码图片\n\
  \n```javascript\n$('ahref^=\"http://\"').attr(\"target\", \"_blank\");\n```\n\n\
  ### 尝试一下：获取和设置 Cookies\n\nCookies 允许你在客户端浏览器中静态地存储位信息，是 Web 范式的重要部分。Cookies 通常由服务器端脚本读取；然而，如果你可以在不需要额外的服务器通信的情况下从\
  \ JavaScript 获取并设置 Cookies，那也将非常有帮助。\n\n你可以通过读取或写入 `document.cookie` 属性来获取和设置 Cookies。`document.cookie`\
  \ 采用字符串格式，包含以下格式的 `name`（名称）、`value`（值）、`expiration`（过期时间）和 `path`（路径）：\n\n`name=value;expiration;path`\n\
  \n帮助理解如何实现 Cookie 的简单方法是通过示例展示。以下示例将带你创建一个简单的 JavaScript，用于从网页中获取和设置 Cookie。示例代码位于在列表\
  \ 11.1、11.2 和 11.3 中。使用以下步骤实现示例：\n\n1. 在 Eclipse 中，创建 `lesson11/cookies.html`、`lesson11/js/cookies.js`\
  \ 和 `lesson11/css/cookies.css` 文件。\n\n2. 将列表 11.1](#part0023.xhtml_ch11lis01)、11.2\
  \ 和 11.3 所示的代码添加到 HTML 文件中。你应该能识别出这些 HTML 组件。HTML 代码包含几个被样式化为按钮的 `<span>` 元素、用于输入\
  \ Cookie 名称和值的文本框，以及一个 Cookie 列表。\n\n3. 将列表 11.3](#part0023.xhtml_ch11lis03) 中的\
  \ CSS 添加到 CSS 文件中。这段代码用于样式化按钮。\n\n4. 打开 `cookies.js` 文件并添加以下 `ready()` 函数，该函数为获取、设置和删除\
  \ Cookie 的按钮添加了点击处理程序。注意，处理程序从名称 `<input>` 字段获取 Cookie 名称：\n\n点击此处查看代码图片\n\n```javascript\n\
  01 $(document).ready(function(){\n02    $(\"#set\").click(function(e){setCookie($(\"\
  #cookieName\").val(),\n03                                     $(\"#cookieValue\"\
  ).val(), 1);});\n04    $(\"#get\").click(function(e){getCookie($(\"#cookieName\"\
  ).val());});\n05    $(\"#delete\").click(function(e){setCookie($(\"#cookieName\"\
  ).val(), \"\", -1);});\n06    displayCookies();\n07 });\n```\n\n5. 添加以下 `setCookie()`\
  \ 处理程序函数，该函数获取日期并使用其创建一个过期时间字符串。随后代码使用 `name`、`value`、`expires` 和根路径作为字符串值设置 `document.cookie`：\n\
  \n点击此处查看代码图片\n\n```javascript\n08 function setCookie(name, value, days) {\n09  \
  \  var date = new Date();\n10    date.setTime(date.getTime()+(days*24*60*60*1000));\n\
  11    var expires = \"; expires=\"+date.toGMTString();\n12    document.cookie =\
  \ name + \"=\" + value + expires + \"; path=/\";\n13    displayCookies();\n14 }\n\
  ```\n\n6. 以下 `getCookie()` 处理程序获取 `document.cookie` 字符串，通过 `;` 将其分割，然后遍历 Cookie\
  \ 数组直到找到名称与传入名称匹配的 Cookie。随后，该函数将 `<input>` 字段的值设置为 Cookie 的值：\n\n点击此处查看代码图片\n\n\
  ```javascript\n15 function getCookie(name) {\n16    var cookieStr = $(\"#cookieName\"\
  ).val(); // 注意：此处原文逻辑似乎略有偏差，按原文翻译\n17    var cookieStr = document.cookie;\n18  \
  \  var cArr = cookieStr.split(';');\n19    for(var i=0; i < cArr.length; i++) {\n\
  20      var cookie = cArr[i];\n21      while (cookie.charAt(0)==' '){\n22      \
  \  cookie = cookie.substring(1, cookie.length);\n23      }\n24      if (cookie.indexOf(name\
  \ + \"=\") == 0){\n25        $(\"#cookieValue\").val(cookie.substring(name + \"\
  =\".length));\n26        break;\n27      }\n28    }\n29 }\n```\n*(注：由于原文代码块 15-28\
  \ 行在逻辑和格式上存在混乱，此处已严格按照原文文本进行翻译)*\n\n7. 添加以下 `displayCookies()` 函数，用于渲染当前的 Cookie\
  \ 列表：\n\n点击此处查看代码图片\n\n```javascript\n30 function displayCookies(){\n31    $(\"\
  #cookieList\").html(\"\");\n32    var cArr = document.cookie.split(';');\n33   \
  \ for(var i=0; i < cArr.length; i++) {\n34      var cookie = cArr[i];\n35      $(\"\
  #cookieList\").append(cookie);\n36    }\n```\n\n8. 保存所有文件，然后在浏览器中如图 1.1](#part0023.xhtml_fig01)\
  \ 所示打开 HTML 文档。尝试设置和删除 Cookie。离开页面后再返回时，Cookie 应该依然存在。使用 JavaScript 获取、设置和删除 Cookie。**图\
  \ 1.1** 用于示例的 HTML 页面。\n\n**列表 11.1** 定义按钮的 HTML。\n\n**列表 11.2** cookies.js 获取、设置和删除\
  \ Cookie 的 JavaScript 代码。\n\n\n\n\n\n```javascript\n25      break;\n26    }\n27\
  \   }\n28 }\n29 function displayCookies(){\n30   $(\"#cookieList\").html(\"\");\n\
  31   var cArr = document.cookie.split(';');\n32   for(var i=0;i < cArr.length;i++)\
  \ {\n33     var cookie = cArr[i];\n34     $(\"#cookieList\").append($(\"<li></li>\"\
  ).html(cookie));\n35   }\n36 }\n```\n\n列表 11.3 cookies.css 样式化按钮和图像的 CSS 代码\n\n\
  点击此处查看代码图像\n\n```css\n01 span{\n02   padding:10px;\n03   background-color:steelblue;\
  \ color:white;\n04   border-radius:10px 20px; border:2px ridge blue;\n05   cursor:pointer;\n\
  06 }\n07 div{ padding:10px; }\n```\n\n### 添加弹出框\n\n窗口提供了几种方法，允许你启动可以进行交互的弹出窗口，用于警报、提示和通知。弹出窗口将显示出来，用户在继续访问网页之前需要与弹出框进行交互。\n\
  \n### 注意\n\n通常情况下，创建一个带有覆盖层的固定位置 `<div>` 元素比使用这些弹出框要好得多，因为你对它们有更多的控制权。你将在书的稍后部分学习如何这样做。\n\
  \n#### 通知用户\n\n最常见的弹出框类型是警报（alert）弹出框，用于通知用户发生了某些事情。用户会看到消息；然而，提供的唯一选项是关闭弹出消息。\n\
  \n要创建一个简单的警报消息，使用下所示 `window.alert()` 方法，并在图 11.2 中显示：\n\n点击此处查看代码图像\n\n```javascript\n\
  window.alert(\"It's 12/12/12 12:12:12!!!\");\n```\n\n![图像](img/image00909.jpeg)\n\
  \n**图 11.2** JavaScript 弹出框。\n\n#### 请求用户确认\n\n下一种常见的弹出框类型是确认（confirmation）弹出框，用于通知用户某些事情即将发生。用户会看到消息，然后获得点击“确定”以允许操作或点击“取消”以拒绝操作的选项。\n\
  \n要创建一个允许用户用“是”或“否”响应的确认对话框，请使用 `window.confirm()` 方法，如下所示并在图 11.2 中显示：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar response = window.confirm(\"Are you sure?\");\nif (response\
  \ == true) { do something; }\nelse { don't do something; }\n```\n\n#### 提示用户输入\n\
  \n另一种弹出框类型是提示（prompt）。提示显示一个文本框，允许用户在弹出框中输入文本字符串。该字符串将返回给 JavaScript 代码并可以多种方式使用。\n\
  \n要创建一个允许用户输入单个文本字符串作为输入的提示对话框，请使用 `window.prompt()` 方法，如下所示并在图 11.2 中显示：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar response = window.prompt(\"What is the airspeed velocity of\
  \ an unlaiden swallow?\");\nif (response == \"African or European?\"){ pass }\n\
  else { no pass }\n```\n\n### 设置定时器\n\nJavaScript 的另一个有用功能是设置定时器，以便在一定时间后或按特定间隔执行函数或评估表达式。\n\
  \n使用定时器允许你延迟代码的执行，因此它不需要在事件触发或页面加载的精确时刻刻发生。\n\n#### 添加延迟定时器\n\n要延迟代码的执行一段时间，请使用\
  \ `setTimeout(code, ms)` 方法，其中 `code` 是语句或在时间到期后执行的函数。`ms` 是毫秒数。例如，要在 10 秒后执行名为\
  \ `myTimer()` 的函数，你将使用以下代码：\n\n点击此处查看代码图像\n\n```javascript\nvar timerId = setTimeout(myTimer,\
  \ 10000);\n```\n\n在时间耗尽且代码执行之前的任何时候，你可以使用 `setTimeout()` 返回的 `id` 调用 `clearTimeout(id)`\
  \ 方法来清除定时器。例如：\n\n```javascript\nclearTimeout(timerId);\n```\n\n#### 添加循环定时器\n\n\
  你还可以使用 `setInterval(code, ms)` 方法启动一个按固定间隔触发的定时器。该方法也接受 `code` 语句或函数名作为参数。例如，以下代码每分钟创建一个定时器并调用函数\
  \ `checkStatus()`：\n\n点击此处查看代码图像\n\n```javascript\nvar timerId = setInterval(checkStatus,\
  \ 60000);\n```\n\n你还可以使用 `clearInterval()` 方法关闭定时器：\n\n```javascript\nclearInterval(timerId);\n\
  ```\n\n### 尝试字体：定时器和对话框\n\n在本练习中，你创建一个每秒更新一次的网页，它使用定时器显示时间。网页会弹出通知，直到你停止它。这种方法将巩固了在\
  \ 11.4、11.5 和 11.6 中的定时器和警报。\n\n1. 在 Eclipse 中创建 `clock.html`、`clock.js` 和 `clock.css`。\n\
  2. 在 HTML 中添加代码，如 11.4 所示。\n3. 在 `clock.js` 中添加下所示的 `ready()` 函数，它包含了定时器和间隔器：\n\n\
  ```javascript\n$(document).ready(function(){\n  setTimeout(continueNotify, 3000);\n\
  \  setInterval(displayTime, 1000);\n});\n```\n4. 添加下所示的 `continueNotify()` 函数，它将在\
  \ 3 秒后执行：\n\n```javascript\nfunction continueNotify(){\n  var result = confirm(\"\
  Do you wish to receive notifications?\");\n  if (result) { setTimeout(continueNotify,\
  \ 3000); }\n}\n```\n5. 保存所有文件，然后在网页浏览器中打开 HTML 文档，如图 11.3 所示。时间应该开始更新。当弹出框出现时，尝试第一次取消，第二次接受它。它不再出现。\n\
  \n\n\n\n\n```javascript\nsetTimeout(continueNotify, 3000);\n\nsetInterval(displayTime,\
  \ 1000);\n```\n\n```javascript\nfunction continueNotify(){\n  var result = confirm(\"\
  Do you wish to continue\\nto receive notifications?\");\n  if (result==true) { setTimeout(continueNotify,\
  \ 3000); }\n}\nfunction padNumber(num){\n  if (num<10){ return \"0\"+num; }\n  return\
  \ num;\n}\nfunction displayTime(){\n  var date = new Date();\n  $(\"#clock\").html(padNumber(date.getHours())\
  \ +\":\"+\n                  padNumber(date.getMinutes()) +\":\"+\n            \
  \      padNumber(date.getSeconds()));\n}\n```\n\n* * *\n\n### 示例 11.6 用于样式时钟的 clock.cs\
  \ CSS 代码\n\n* * *\n\n```css\ndiv {padding:15px;}\nspan{\n   background-color:black;\n\
  \   color:#00FF00;\n   font:30px arial;\n   padding:5px;\n   border:5px groove;\n\
  }\n```\n\n* * *\n\n* * *\n\n### 总结\n\n本节重点介绍了如何使用 JavaScript 对象访问网页之外的数据。你学习了 `screen`、`window`、`browser`、`location`\
  \ 和 `history` 对象，这些对象提供了关于物理屏幕、浏览器和客户端历史的众多细节，以及对 cookie 的访问。\n\n你看到了如何打开和关闭浏览器窗口。通过\
  \ JavaScript，你还学习了如何创建基础弹窗，以便与用户进行交互。\n\n### 问答\n\n**问。有方法找到正在使用的操作系统和浏览器吗？**\n\n\
  **答。** 有。`navigator` 对象会在 `window.navigator.appCodeName` 属性中显示浏览器。你也可以使用 `window.navigator.platform`\
  \ 获取操作系统。\n\n### 工作坊\n\n工作坊包含一组问答，旨在巩固你对本节所涵盖内容的理解。在看答案之前，尝试回答这些问题。\n\n### 测验\n\n\
  **1。** JavaScript 支持的三种类型的弹框是什么？\n\n**2。** 你如何使用 JavaScript 找到加载网页的完整 URL？\n\n**3。**\
  \ 正确或错误：你可以在浏览器历史中向后导航，但不能向前导航。\n\n### 测验答案\n\n**1。** Alert（alert）、确认（confirm）和提示（prompt）。\n\
  \n**2。** 访问 `location.href` 属性。\n\n**3。** 错误。你可以使用 `history.forward()` 或 `history.go(n)`\
