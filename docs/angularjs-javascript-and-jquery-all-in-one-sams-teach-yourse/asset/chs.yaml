  \  Available.addEventListener('click', simbleClick, false);\n  var allWeek = document.getElementById(\"\
  AllWeek\");\n  AllWeek.addEventListener('click', eventClick, false);\n  var weekDays\
  \ = document.getElementById(\"WeekDays\");\n  WeekDays.addEventListener('click',\
  \ eventClick, false);\n}\nfunction simbleClick(e){\n  var cb = document.getElementById(\"\
  check\"+e.target.id);\n  cb.click();\n}\nfunction eventClick(e){\n  var event =\
  \ document.createEvent(\"MouseEvents\");\n  event.initMouseEvent(\"click\", true,\
  \ true, window,\n                      0, 0, 0, 0, 0, false, false,\n          \
  \            false, false, 0, null);\n  var cb = document.getElementById(\"check\"\
  +e.target.id);\n  cb.dispatchEvent(event);\n}\n```\n\n**代码列表 9.9 manual_event.css\
  \ 用于设置 `<span>` 元素样 CSS 代码**\n\n```css\nspan{\n  border-radius:5px;\n  margin:3px;\n\
  \  padding:5px;\n  background-color:#C0C0C0;\n  border:3px ridge;\n  display:inline-block;\n\
  \  cursor:pointer;\n}\n```\n\n#### 使用 jQuery 手动触发事件\n\n现在你已经有机会从 JavaScript 触发事件了，你已经准备好发现如果你能够使用\
  \ jQuery，它将如何让你的生活变得多么简单了。jQuery 还支持两种手动触发事件的方法。与 JavaScript 类似，jQuery 对象也有许多与你可以调用的许多事件类型对应的方法。例如，大多数元素都有\
  \ `click()` 和 `dblclick()` 方法。表单元素增加了额外的方法，如 `blur()`、`focus()`、`keypress()`、`keydown()`\
  \ 和 `keyup()`，可以调用它们来触发特定事件。例如，以下语句会触发所有 `<span>` 元素的 `click` 事件：\n\n```javascript\n\
  $(\"span\").click();\n```\n\njQuery 还提供了一种通过 `trigger()` 方法在指定事件对象值的同时触发事件的方法。`trigger()`\
  \ 方法有两种不同的语法，如下所示：\n\n```javascript\ntrigger(eventType [, extraParameters])\n```\n\
  \n```javascript\ntrigger(eventObject)\n```\n\n以下是使用第一种方法触发所有 `class=\"checkbox\"\
  ` 元素的 `click` 事件的示例：\n\n```javascript\n$(\".checkbox\").trigger(\"click\");\n```\n\
  \n以下是在所有具有 `class=\"bigText\"` 的输入项上使用第二种方法的示例。该方法为 `keypress` 事件传递了一个简单的事件对象，然后将事件对象的\
  \ `charCode` 属性设置为 13，即回车键：\n\n\n\n```javascript\n$(\"input.bigText\").trigger({'type':'keypress',\
  \ 'charCode':13});\n```\n\n注意，这比 JavaScript 的方法要简单得多，因为 `trigger()` 接受一个带有适当属性名称的简单对象，以设置你想要在事件对象中传递的任何值。偶尔，你可能不得不使用\
  \ JavaScript 方法，但你应该尽可能多地使用 jQuery。\n\n### 尝试一下：在 jQuery 中手动触发事件\n\n在这个示例中，你将通过使用来自\
  \ `<span>` 元素的事件处理程序来为 `<input>` 元素触发 `keypress` 事件的过程。结果是，对 `<span>` 的点击将作为按键传递给\
  \ `<input>` 元素。使用以下步骤创建列表 9.10、9.11 和 9.12 所示的文件：\n\n1. 在 Eclipse 中创建 `lesson09/card_suits.html`、`lesson09/js/card_suits.js`\
  \ 和 `lesson09/css/card_suits.css` 文件。\n2. 将列表 9.10 中的代码添加到 HTML 文件中。这是一个加载了额外 jQuery、JavaScript\
  \ 和 CSS 文件的基础 HTML 文件。有一个 `<p>` 元素、一个 `<input>` 元素以及一系列作为按钮的 `<span>` 元素。\n3. 将列表\
  \ 9.12 中的 CSS 添加到 CSS 文件。该代码将 `<span>` 元素样式化为按钮，并为 `<p>` 元素提供良好的格式。\n4. 打开 `card_suits.js`\
  \ 文件并添加以下 `ready()` 初始化函数，该函数为 `<input>` 元素附加 `keypress` 事件处理程序，并为所有 `<span>` 元素附加\
  \ `click` 处理程序：\n\n```javascript\n$(document).ready(function(){\n  $(\"input\").keypress(function\
  \ (e){inputHandler(e)});\n  $(\"span\").click(function (e){spanHandler(e)});\n});\n\
  ```\n\n5. 创建 `inputHandler()` 处理函数，该函数从事件对象获取 `charCode` 并并将字符串添加到 `<p>` 元素中。此时，当你在文本\
  \ `<input>` 中输入时，它也会显示在 `<p>` 元素中：\n\n```javascript\nfunction inputHandler(e){\n\
  \  var chr = String.fromCharCode(e.charCode);\n  $(\"p\").append(chr);\n}\n```\n\
  \n6. 添加以下 `spanHandler()` 处理函数，该函数获取 `<span>` 元素的 `innerHTML` 并第一个字符转换为代码。第 7 行随后\
  \ `<input>` 元素触发 `keypress` 事件，将按钮的字符代码作为 `charCode` 值传递。这允许用户点击按钮并使用文本 `<inputs>`\
  \ 的事件处理程序应用卡牌符号：\n\n```javascript\nfunction spanHandler(e){\n  var chrCode = e.target.innerHTML.charCodeAt(0);\n\
  \  $(\"input\").trigger({'type':'keypress', 'charCode':charCode});\n}\n```\n\n\n\
  \n\n\n# 列表 9.10 card_suits.html 加载 CSS 和 JavaScript 并定义 <p>、文本 <input> 和 <span>\
  \ 元素的 HTML 文件\n\n点击此处查看代码图像\n\n* * *\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n\
  03   <head>\n04     <title>Event Based Manipulation</title>\n05     <meta charset=\"\
  utf-8\" />\n06     <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n07     <script type=\"text/javascript\" src=\"js/card_suits.js\"></script>\n\
  08     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/card_suits.css\">\n\
  09   </head>\n10   <body>\n11     <p>Card and Suit: </p>\n12     <input type=\"\
  text\" />\n13     <span>&#9824;</span>\n14     <span>&#9827;</span>\n15     <span>&#9829;</span>\n\
  16     <span>&#9830;</span>\n17   </body>\n18 </html>\n```\n\n* * *\n\n# 列表 9.11\
  \ card_suits.js 通过 <span> 元素的事件处理器触发 <input> 元素 keypress 事件的 JavaScript 代码\n\n点击此处查看代码图像\n\
  \n* * *\n\n```javascript\n01 function inputHandler(e){\n02   var chr = String.fromCharCode(e.charCode);\n\
  03   $(\"p\").append(chr);\n04 }\n05 function spanHandler(e){\n06   var chrCode\
  \ = e.target.innerHTML.charCodeAt(0);\n07   $(\"input\").trigger({'type':'keypress',\
  \ 'charCode':chrCode});\n08 }\n09 $(document).ready(function(){\n10   $(\"input\"\
  ).keypress(function (e){inputHandler(e)});\n11   $(\"span\").click(function (e){spanHandler(e)});\n\
  12 });\n```\n\n* * *\n\n# 列表 9.12 card_suits.css 为 <span> 和 <p> 元素设置的 CSS 代码\n\n\
  点击此处查看代码图像\n\n* * *\n\n```css\n01 span{\n02   border-radius:5px;\n03   margin:3px;padding:5px;\n\
  04   background-color:#C0C0C0;\n05   border:3px ridge;\n06   display:inline-block;\n\
  07   cursor:pointer;\n08 }\n09 p{\n10   border:4px outset steelblue;\n11   padding:3px;\n\
  12   color:white;background-color:skyblue;\n13   font-size:30px;font-weight:bold;\n\
  14 }\n```\n\n* * *\n\n* * *\n\n### 创建自定义事件\n\nJavaScript 和 jQuery 事件处理机制非常强大的方面是添加自定义事件的能力。这解决了内置事件都与\
  \ DOM 元素和浏览器支持的特定行为的问题。如果你希望当数组中的项目数量大于 100 时触发一个事件，该怎么办？\n\n自定义事件允许你扩展可以添加到元素上的事件。自定义事件并不直接对应于与用户的物理交互，而是根据用户正在进行的交互而在你的代码中发生的事件。\n\
  \n创建自定义事件的优势在于，你可以使用现有的事件处理系统，该系统允许你添加/删除事件、冒泡它们以及触发它们。\n\n以下章节描述了你可以在 JavaScript\
  \ 和 jQuery 中添加自己的自定义事件的不同方法。\n\n#### 使用 JavaScript 添加自定义事件\n\n在 JavaScript 中添加自定义事件与触发事件相似，即你创建一个自定义事件对象并对其进行初始化。以下代码显示了创建一个基本自定义事件的示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myEvent = document.createEvent(\"CustomEvent\"\
  );\n\nmyEvent .initCustomEvent(\n  \"worldEnds\",\n  true,\n  false,\n  {\n    \
  \  'fire': false,\n  }\n);\n```\n\n`initCustomEvent()` 的第一个参数定义 `type`，第二个参数设置 `bubbles`，第三个设置\
  \ `cancelable`，第四个定义 `details`。事件创建后，你可以通过调用 `dispatchEvent()` 来触发它：\n\n```javascript\n\
  document.dispatchEvent(myEvent);\n```\n\n\n\n\njQuery 提供了一种实现回调函数的奇颖方式，即延迟对象（deferred\
  \ object）。延迟对象是一个包含一组函数的对象，这些函数可以在以后的某个时间运行。传递给函数的实际参数只有在延迟对象被解析（resolve）且函数被执行时，才会被添加到其中。\n\
  \n这允许你将一组函数应用到单个对象上，并且可以在任何时间应用这些应用。\n\n以下代码演示了如何创建一个带有多个函数的简单延迟对象，然后执行这些函数：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar resultString = \"\";\n\nfunction function1(n1,\
  \ n2, p3) { resultString += \"Problem: \"; }\n\nfunction function2(n1, n2) { resultString\
  \ += n1 + \" + \"; }\n\nfunction function3(n1, n2) { resultString += n2 + \" = \"\
  ; }\n\nvar deferredObj = $.Deferred();\n\ndeferredObj.done( [function1, function2],\
  \ function3).done(function(n1, n2) {\n    resultString += n1 + n2;\n    $(\"div\"\
  ).append(resultString);\n});\n\ndeferredObj.resolve(5,6);\n```\n\n上述代码中发生的过程如下：三个定义的函数都向\
  \ `resultString` 变量添加了内容。创建了一个名为 `deferredObj` 的新延迟对象。调用 `.done(functions [, functions])`\
  \ 方法将函数添加到延迟对象中。这里使用了三种方法来添加函数：第一个参数是待执行的函数列表，第二个是单个函数，第三个是一个匿名函数。\n\n在调用 `.resolve(args)`\
  \ 之前，这些函数都不会执行。注意 `.resolve()` 的参数与函数所需的参数相匹配。每个函数按顺序执行。结果是将以下字符串追加到 `<div>` 元素中：\n\
  \nProblem: 5 + 6 = 11\n\n### 总结\n\n本节课程重点关注了在网页中实现事件处理的不同方式。事件处理是交互式网页的核心。JavaScript\
  \ 和 jQuery 在如何创建和将事件添加到 DOM 元素的方法上有所不同。你学习了这两种者用于添加事件处理程序的方法。\n\n你还学习了如何访问事件对象并将你自定义的对象传递到事件处理程序，并学习了如何创建和触发你自己的自定义事件。\n\
  \n### 问答\n\n**Q. 什么时候使用 JavaScript 创建和触发自定义函数比使用 jQuery 更好？**\n\n**A.** 绝不。好吧，不一定。目前\
  \ jQuery 对事件的跨浏览器支持要好得多。此外，创建必要的对象也容易得多。出于这些原因，你应该几乎总是使用 jQuery。如果由于后兼容等原因你的环境无法使用\
  \ jQuery，那么请使用 JavaScript。\n\n**Q. 你用自定义事件可以做回调函数能做的所有事情吗？**\n\n**A.** 并不容易。记住，你可以创建任意数量的带有不同标记的回调列表，并且只触发与特定列表绑定的函数。在事件处理程序中尝试管理所有内容会很快失控。\n\
  \n### 工作坊\n\n工作坊由一组问答组成，旨在巩固你对本节涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\n### 测验\n\n**1.** `<body>`\
  \ 标签的哪个 HTML 属性可以在页面加载完成后调用 JavaScript 代码？\n\n**2.** 正或错：事件只会为其发生的目标元素触发处理程序。\n\n\
  **3.** 在什么情况下，你会使用 `.ready()` 方法而不是 `.load()` 方法？\n\n**4.** 正或错：鼠标事件只能通过鼠标移动或点击来触发。\n\
  \n### 测验答案\n\n**1.** `onload`。\n\n**2.** 错误。大多数事件会向上冒泡，经过所有祖先对象，一直传递到 `document`\
  \ 对象。\n\n**3.** 当你只需要 DOM 加载完成时使用 `.ready()`。如果你还需要其他资源（如图像）也完成加载，则使用 `.load()`。\n\
  \n**4.** 错误。鼠标事件可以在 jQuery 和 JavaScript 中被手动触发。\n\n#### 练习题\n\n**1.** 扩展 `9.10(#part0021.xhtml_ch09lis10)`、`9.11(#part0021.xhtml_ch09lis11)`\
  \ 和 `9.12(#part0021.xhtml_ch09lis12)` 中的示例，为非标准字符添加额外的按钮。你需要从 Web 获取 Unicode 字符编码。\n\
  \n**2.** 扩展 `9.7(#part0021.xhtml_ch09lis07)`、`9.8(#part0021.xhtml_ch09lis08)` 和\
  \ `9.9(#part0021.xhtml_ch09lis09)` 中的示例。\n\n## 第 10 课：使用 JavaScript 和 jQuery 动态访问和操作网页\n\
  \n在本节中将学习：\n\n- **跟踪鼠标位置和其他信息**\n- **操作元素的大小和其他属性**\n- **动态显示和隐藏元素**\n- **动态创建元素并添加到网页**\n\
  - **在 jQuery 中添加和类**\n- **修改网页布局**\n\n这节课非常重要。到目前为止，已经为你提供了实现高度动态交互式网页的大部分工具。在本节中，你将学习如何使用这些工具以及一些新工具来访问信息。\n\
  \n你将了解到 JavaScript 和 jQuery 的网页操作方法是完全开放的。你可以从 JavaScript 代码的任何地方操作页面元素。这种方法的优点是只需少量代码就能轻松转换页面。缺点是你需要保持自律，以确保代码易维护。AngularJS\
  \ 有一种完全不同的方法，你将在 AngularJS 章节中学习。现在，请享受快速且方便的动态网页操作之旅。\n\n### 访问浏览器和元素值\n\njQuery\
  \ 和 JavaScript 的核心基础之一是访问代表网页元素的 DOM 对象。本节将引导你访问属性值、位置、大小和其他属性，并向你展示如何修改其中的许多内容。\n\
  \n#### 获取鼠标位置\n\n鼠标移动是你将处理的最常见的网页交互之一。通常，你可能根据鼠标的位置对元素进行调整。\n\n当鼠标事件被触发时，可以从事件对象获取鼠标位置。请记住，事件指定了三个鼠标坐标。`表\
  \ 10.1(#part0022.xhtml_ch10tab01)` 描述了每一个。\n\n`Image(Images/00898.jpeg)`\n\n**表\
  \ 10.1 指定鼠标位置的事件对象属性**\n\n以下代码展示了从名为 `e` 的事件对象获取鼠标坐标并将其应用字符串变量的示例：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar screenPosition = e.screenX + \", \" + e.screenY;\nvar pagePosition\
  \ = e.pageX + \", \" + e.pageY;\nvar browserPosition = e.clientX + \", \" + e.clientY;\n\
  ```\n\n#### 获取和设置值\n\n\n\n\n若干 HTML 元素（特别是输入元素）具有与其关联的值。在 `jQuery` 和 `JavaScript`\
  \ 中，访问这些元素的值都是非常简单的事情。\n\n在 JavaScript 中，可以通过访问对象的 `value` 属性来直接获取该值。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\ndomObject.value = 5;\nvar value = domObject.value;\n```\n\n另一方面，`jQuery`\
  \ 提供了 `.val()` 方法来获取和设置值。例如，以下代码设置并获取了代表 `id=\"textInput\"` 的 HTML `<input>` 元素的\
  \ jQuery 对象的的值：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#textInput\").val(5);\nvar value\
  \ = $(\"#textInput \").val();\n```\n\n### 在 jQuery 中获取和设置属性和属性\n\nDOM 对象允许直接访问其所代表的\
  \ HTML 元素的 DOM 对象属性和 DOM 元素属性。这在 `jQuery` 中是不合理的，因为 `jQuery` 对象通常代表具有不同属性的多个元素。出于此原因，`jQuery`\
  \ 提供了 `.attr()` 和 `.prop()` 方法来获取和设置这些元素的属性和属性。\n\n`.attr(attribute, [value])` 方法允许你仅指定属性名称获取当前值，也可以指定一个可选的值来设置当前值。例如，以下代码获取了\
  \ `id=\"bannerImg\"` 的特定图像元素的 `src` 值：\n\n点击此处查看代码图片\n\n```javascript\nvar state\
  \ = $(\"#bannerImg\").attr(\"src\");\n```\n\n然后，以下语句设置了所有 `<img>` 元素的 `src` 属性值：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"img\").attr(\"src\",\"images/default.jpg\");\n\
  ```\n\n`.prop(property, [value])` 方法允许你指定属性来获取当前值，并指定一个可选的值来设置当前值。例如，以下代码获取了 `id=\"\
  firstCheckbox\"` 的特定元素的选中状态（checked）：\n\n点击此处查看代码图片\n\n```javascript\nvar state\
  \ = $(\"#firstCheckbox\").prop(\"checked\");\n```\n\n接下来的语句将将所有 `<input>` 元素的 `checked`\
  \ 值设置为 `true`：\n\n点击此处查看代码图片\n\n```javascript\n$(\"input\").prop(\"checked\", true);\n\
  ```\n\n***\n\n注意\n\n在 `jQuery` 中，属性（property）和特性（attribute）唯一的区别在于：特性是定义 HTML 结构的值，而属性影响对象的动态状态的值。例如，在\
  \ `<input>` 元素中，\"type\"` 是特性，因为它定义了结构；而 `\"checked\"` 是属性，因为它只影响状态。\n\n***\n\n\
  ### 获取和设置 CSS 属性\n\n动态网页编程另一个重要方面是 CSS 的动态操作。\n\n`JavaScript` 允许你通过 DOM 对象的样式属性访问\
  \ CSS 属性。例如，你可以使用以下代码从 DOM 对象获取元素的 `color` 和 `background-color` CSS 属性。注意，你需要使用\
  \ `style[\"background-color\"]` 语法，因为 `style.background-color` 在 `JavaScript` 中是无效的：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar domObj = document.getElementById(\"banner\");\n\
  var color = domObj.style.color;\nvar color = domObj.style.[\"background-color\"\
  ];\n```\n\n另一个示例是，你可以使用以下代码为元素设置 `position`、`top` 和 `left` CSS 属性：\n\n点击此处查看代码图片\n\
  \n```javascript\ndomObj.style.position = \"absolute\";\ndomObj.style.top = \"100px\"\
  ;\ndomObj.style.left = \"100px\";\n```\n\n`jQuery` 也使得使用 `.css(property, [value])`\
  \ 方法获取和设置 CSS 值变得极其。例如，以下代码获取了元素的 `cursor` CSS 属性值：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#buttonA\").css(\"cursor\");\n```\n\n然后，以下语句设置了 `border-radius` 值：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#buttonA\").css(\"border-radius\", \"10px 15px\");\n```\n\n\
  `.css()` 方法还允许你传递一个包含属性和值的映射对象。这允许你一次性设置多个配置。例如，以下代码使用 `.css()` 同时设置 `margin`、`padding`、`float`\
  \ 和 `font-weight` 属性：\n\n点击此处查看代码图片\n\n```javascript\n$(\"span\").css({margin:0,\
  \ padding:2, float:\"left\", \"font-weight\":\"bold\"});\n```\n\n注意，属性名可以包含引号也可以不包含。如果属性名包含特殊字符，则需要使用引号。\n\
  \n\n\n\n\n获取 HTML 元素相关类的最简单方法是查看 DOM 对象的 `className` 属性。`className` 属性是一个字符串，包含了附加到元素上的类（或类）名称。请注意，一个元素可能附加了多个类名。在这种情况下，这些名称将用空格分隔。\n\
  \n以下示例展示了如何使用 jQuery 获取带有 `id=\"mainList\"` 的元素的 `className` 属性：\n\n点击此处查看代码图像\n\
  \n```\nvar class = $(\"#mainList\").get().className;\n```\n\n## 获取浏览器和屏幕尺寸及颜色信息\n\
  \n动态操作网页的一个重要部分是访问有关屏幕和浏览器信息的能力。本节侧重于尺寸和颜色能力。\n\n获取屏幕或浏览器窗口的大小允许你根据屏幕或浏览器窗口上的可用区域来调整\
  \ HTML 元素的大小。\n\n你可以使用 JavaScript 中的 `Screen` 对象访问屏幕尺寸。`Screen` 对象提供了 `width` 和\
  \ `height` 属性，它们代表屏幕分辨率的维度。例如，以下代码将屏幕的 `width` 和 `height` 存储在变量中：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar sWidth = screen.width;\nvar sHeight = screen.height;\n```\n\
  \n要获取屏幕以及因此 Web 浏览器支持的颜色，请使用 `Screen` 对象的 `colorDepth` 属性。它返回支持的位数的值——例如 8、16、24。以下是获取屏幕支持的色彩深示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar colorBits = screen.colorDepth;\n```\n\n即使屏幕很大，浏览器窗口也可能没有占据整个屏幕。虽然浏览器窗口为超过窗口大小的网页提供了滚动条，但随着浏览器尺寸的变化，调整页面元素的大小或调整布局通常看起来会更好。\n\
  \n可以通过 JavaScript 中 window 对象的 `innerWidth`、`outerWidth`、`innerHeight` 和 `outerHeight`\
  \ 属性访问浏览器维度。`innerHeight` 和 `innerWidth` 值指的是网页可用的实际区域。`outerWidth` 和 `outerHeight`\
  \ 指包括浏览器菜单、边框和栏在内的总区域。以下是获取网页显示区域尺寸的示例：\n\n点击此处查看代码图像\n\n```javascript\nvar pageWidth\
  \ = window.innerWidth;\nvar pageHeight = window.innerHeight;\n```\n\n***\n\n## 动手尝试：使用\
  \ jQuery 和 JavaScript 获取屏幕、浏览器、鼠标和元素信息\n\n现在是把所有内容整合在一起了。在这个示例中，你将构建包含一些不同 HTML\
  \ 元素的基础网页。其中一个元素将是 `<div>`，用于显示屏幕、浏览器、鼠标和元素信息，并在每次移动鼠标时更新。代码显示在 Listing 10.1、10.2\
  \ 和 10.3 中。起初看起来代码很多，但它们其实非常基础，并将帮助你了解如何从 jQuery 和 JavaScript 获取有关当前状态的信息。\n\n使用以下步骤实现该示例：\n\
  \n1. 在 Eclipse 中，创建 `lesson10`、`lesson10/js` 和 `lesson10/css` 文件夹。\n2. 创建 `lesson10/web_page_manipulation.html`、`lesson10/js/web_page_manipulation.js`\
  \ 和 `lesson10/css/web_page_manipulation.css` 文件。\n3. 将 Listing 10.1 所示的代码添加到 HTML\
  \ 文件中。你应该能识别出这些 HTML 组件。它有两个主要部分：第一部分定义了若干供你交互的元素，第二部分（那个非常长的 `<div>`）提供了一个显示鼠标、屏幕、浏览器和元素信息的地方。\n\
  4. 将 Listing 10.3 中的 CSS 添加到 CSS 文件中。现在你也应该识别这些 CSS 语句了。CSS 中的某些行被合并在一起，以便更好地适应书中。\n\
  5. 打开 `web_page_manipulation.js` 文件以及下面的 `load()` 函数，该函数为 `mousemove`、`mouseover`、`change`、`keypress`\
  \ 和 `resize` 事件添加了事件处理器。你将在稍后的步骤中创建这些事件处理器。`mousemove` 事件处理器附加到文档上，以捕获文档层面的鼠标移动。`resize`\
