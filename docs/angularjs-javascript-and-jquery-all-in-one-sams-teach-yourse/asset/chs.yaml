  console.log(\"cnt=%d\",cnt);\n```\n\n**2.** 在浏览不同页面的流量时，使用网络（Net）流量。展开一些请求并查看某些标签页中表示的数据。这可以帮助你更好地理解浏览器与\
  \ Web 服务器之间流量的起伏。\n\n# 第 3 节：理解动态网页的剖析\n\n你将在本节中学习到：\n\n![Image](img/image00767.jpeg)\
  \ 如何构建基础的动态网页\n![Image](img/image00767.jpeg) 在网页的哪里添加 CSS 和 JavaScript\n![Image](img/image00767.jpeg)\
  \ 块元素（block）和行内元素（inline）之间的区别\n![Image](img/image00767.jpeg) 如何在网页中添加图像\n![Image](img/image00767.jpeg)\
  \ 如何构建表单\n![Image](img/image00767.jpeg) 如何在网页的特定位置添加链接\n![Image](img/image00767.jpeg)\
  \ 如何在网页中构建表格\n![Image](img/image00767.jpeg) HTML5 SVG 图形可以做什么\n![Image](img/image00767.jpeg)\
  \ 使用 HTML5 为动态音频和视频做准备的方法\n\n在本书的其余部分中，你将使用大量的 HTML、CSS、jQuery 和 JavaScript。为了这一目的，本节设计用于完成两个任务。第一个是让你熟悉（如果你还不熟悉的话）一些\
  \ HTML 的重要基础知识，以便你能够轻松理解示例。\n\n第二个是帮助你理解如何设计你的 HTML，以便以后使用 jQuery 和 JavaScript 为你的网页添加动态效果。理解如何设计\
  \ HTML 元素将使以后添加某些酷炫的效果以及动态更新存储在列表或表格中的数据变得更容易。\n\n接下来的章节将讨论 HTML 的基础以及它们与 jQuery\
  \ 和 JavaScript 的关系。\n\n### 使用 HTML/HTML5 元素构建动态网页\n\n你已经在 第 1  和 第 2  中看了一些 HTML\
  \ 代码示例。现在是时候深入理解语法，以及哪些 HTML 元素和属性对动态网页很重要了。\n\n要正确构建动态网页，你需要理解 HTML 语法、一些基础 HTML\
  \ 元素以及如何组织和结构这些元素。接下来的章节涵盖了这些主题。\n\n### 理解 HTML 结构\n\nHTML 文档由三个主要部分组成：`<!DOCTYPE>`\
  \ 标签、头部（head）和正体（body）。这些部分部分在帮助浏览器将 HTML 文档渲染为网页方面都起着特定的作用。\n\n`<!DOCTYPE>` 标签必须是\
  \ HTML 文件中的第一个语句；它告诉浏览器如何读取文件的其余部分。虽然此标签不是强制要求的，但在你的 HTML 文档中包含它是一个好主意。`<!DOCTYPE>`\
  \ 元素有几种形式，下面列出了其中：\n\n![Image](img/image00767.jpeg) **HTML5**——用于 HTML5 文档的版本：\n\
  \n```html\n<!DOCTYPE html>\n```\n\n![Image](img/image00767.jpeg) **HTML 4.01 Strict**——强制遵守\
  \ HTML 4.01 标准，并将移除如 `<font>` 等弃用元素：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01 Strict//EN\" \"http://www.w3.org/TR/HTML401/strict.dtd\"\
  >\n```\n\n\n\n\n\n点击此处查看代码图片\n\n<p align=\"center\">这是一段居中文字。</p>\n\n### 注意事项\n\n\
  如果属性的值需要双引号，则普通的 `attribute=“value”` 赋值将无法正常工作。在这种情况下，你可以在赋值中使用单引号。例如，`attribute=’some\
  \ “quoted” value’`。\n\n如果一个元素没有结束标签，你可以在第一个标签的末尾包含一个 `/` 并完全省略结束标签。例如，以下两种方式对浏览器来说都是可以的：\n\
  \n<p align=\"center\"></p>\n\n<p align=\"center\" />\n\n### 实现 HTML Head 元素\n\n\
  HTML `<head>` 元素被设计为网页非视觉元素的容器。`<head>` 元素中的标签会被浏览器解析为 DOM，但它们不会被渲染到浏览器窗口中。\n\n\
  接下来的章节描述了一些较重要的 `<head>` 元素以及它们如何与使用 jQuery 和 JavaScript 关联。\n\n### <title>\n\n\
  `<title>` 元素在所有 HTML 文档中都应该是要求的。即使没有它，浏览器仍然会渲染页面，但有许多理由要在网页中包含标题元素，其中包括 `<title>`\
  \ 元素具有以下功能：\n\n- ![Image](img/image00767.jpeg) 定义显示在浏览器工具栏/标签页上的标题。\n- ![Image](img/image00767.jpeg)\
  \ 提供网页被添加到收藏夹时列出的标题。\n- ![Image](img/image00767.jpeg) 决定当网页由搜索引擎显示时显示的标题内容。\n\n\
  以下代码展示了为网页添加标题的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Page</title>\n\
  ```\n\n可以使用 jQuery 和 JavaScript 轻松地更改 `<title>` 元素的值。例如，列表 3.1 中的代码使用了 JavaScript\
  \ 在网页加载后更改页面标题。\n\n**列表 3.1 page_title.html 在页面加载后使用 JavaScript 更改 <title> 值的值**\n\
  \n点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html\n02 <html>\n03   <head>\n04      <title>Page</title>\n\
  05      <meta charset=\"UTF-8\" />\n06      <script>\n07        function appendTitle(newTitle){\n\
  08          document.title += newTitle;\n09        }\n10      </script>\n11    </head>\n\
  12   <body onload=\"appendTitle('... Loaded')\">\n13   </body>\n14 </html>\n```\n\
  \n注意在 图 3.1 中标签页中的标题已更改为 Page...Loaded。\n\n![Image](img/image00807.jpeg)\n\n**图\
  \ 3.1** JavaScript 函数更改了在浏览器标签页中显示的网页标题。\n\n### <meta>\n\n`<meta>` 标签有许多用途。浏览器使用\
  \ `<meta>` 标签来确定诸如渲染网页时使用何种字符集等事宜。搜索引擎爬虫使用 `<meta>` 标签来确定网页内容的目的，以便更好地优化搜索。介绍它的最好方法是向你展示一些语法示例。\n\
  \n在 HTML5 网页中设置字符集所需的 `<meta>` 标签如下：\n\n```html\n<meta charset=\"UTF-8\">\n```\n\
  \n在 HTML 4 网页中设置字符集所需的 `<meta>` 标签如下：\n\n点击此处查看代码图片\n\n```html\n<meta http-equiv=\"\
  content-type\" content=\"text/html; charset=UTF-8\">\n```\n\n用于定义搜索引擎关键词的 `<meta>`\
  \ 标签如下，其中 `content` 的值即是你希望搜索引擎在查找网页时使用的关键词：\n\n点击此处查看代码图片\n\n```html\n<meta name=\"\
  keywords\" content=\"HTML, CSS, jQuery, JavaScript\">\n```\n\n告诉浏览器每 60 秒刷新一次网页的\
  \ `<meta>` 标签如下：\n\n点击此处查看代码图片\n\n```html\n<meta http-equiv=\"refresh\" content=\"\
  300\">\n```\n\n### <style>\n\n`<style>` 标签允许你直接在 HTML 文档中添加 CSS 代码。包含 `<style>`\
  \ 标签内部的所有内容都被视为 CSS 文档，并被浏览器用于渲染网页。\n\n作为语法的示例，列表 3.2 HTML 文件包含了 CSS，将 `<h1>` 元素的背景变为黑色，前景变为白色，如\
  \ 图 3.2 所示。\n\n![Image](img/image0808.jpeg)\n\n**图 3.2** 该 `<h1>` 元素的样式已被 HTML 文档中的\
  \ CSS 脚本反转。\n\n**列表 3.2 reversed_text.html 在 HTML 文档中使用 <style> 标签添加 CSS**\n\n点击此处查看代码图片\n\
  \n```html\n01 <html>\n02 <head>\n03   <meta charset=\"UTF-8\">\n04   <style type=\"\
  text/css\">\n05     h1 {\n06         background-color: black;\n07         color:\
  \ white;\n08     }\n09   </style>\n10 </head>\n11 <body>\n12   <h1>Reversed Text</h1>\n\
  13 </body>\n14 </html>\n```\n\n### <script>\n\n`<script>` 标签允许你直接在 HTML 文档中添加 JavaScript\
  \ 代码或链接到外部文件。包含 `<script>` 标签内部的所有内容都被视为 JavaScript 文档，并在 HTML 文档解析时由浏览器加载。\n\n\
  **注意**\n\n在使用 `<script>` 标签时，脚本按照它们的解析顺序加载。这意味着后续具有相同全局变量或函数名的脚本将覆盖已有的脚本。例如，列表 3.3\
  \ 两个 `<script>` 元素：一个用于加载 jQuery 库，另一个使用简单的 JavaScript 函数将 `<h1>` 元素的背景变为黑色，前景变为白色，如\
  \ 图 3.3 所示。\n\n![Image](img/image0809.jpeg)\n\n**图 3.3** 该 `<h1>` 元素的样式已被 HTML 文档中直接使用的\
  \ JavaScript 函数反转。\n\n**列表 3.3 js_text.html 在 HTML 文档中使用 <script> 标签添加 JavaScript\
  \ 和 jQuery**\n\n点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n\
  04     <meta charset=\"UTF-8\">\n05     <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n06     <script>\n07       function reverseText(){\n08         $(\"h1\"\
  ).css(\"background-color\", \"black\");\n09         $(\"h1\").css(\"color\", \"\
  white\");\n10       }\n11     </script>\n12   </head>\n13   <body onload=\"reverseText()\"\
  >\n14     <h1>JavaScript Reversed Text</h1>\n15   </body>\n16 </html>\n```\n\n###\
  \ <noscript>\n\n虽然这种情况现在并不经常发生，但偶尔人们会在他们的浏览器中禁用 JavaScript。如果 JavaScript 被禁用，任何\
  \ JavaScript 以及相应的 jQuery 脚本将不会执行。这会给用户带来非常糟糕的体验。\n\n`<noscript>` 标签允许你在 `<body>`\
  \ 元素之前提供将被渲染的元素。这允许你在 JavaScript 被禁用的情况下显示警告信息或替代形式页面。\n\n`<noscript>` 标签支持 `<body>`\
  \ 标签支持的所有子元素类型。例如，以下代码在 JavaScript 启用时加载 JavaScript 文件，但如果未启用，它会在网页顶部添加一个 `<h3>`\
  \ 标题，警告用户网页无法正常工作：\n\n点击此处查看代码图片\n\n```html\n<head>\n  <script src=\"DynamicPage.js\"\
  ></script>\n  <noscript>\n    <h3>此网页使用了 JavaScript，但在您的浏览器中禁用了它。\n    网页可能无法正常工作。</h3>\n\
  \  </noscript>\n</head>\n```\n\n\n\n\n`<link>` 标签允许将单独的资源链接到当前文档。大多数情况下，它用于 CSS\
  \ 文件。这意味着当浏览器加载 HTML 文档时，链接的 CSS 文件也会从 Web 服务器下载并加载。例如，下面的 `head` 块将加载两个不同的 CSS\
  \ 文档：\n\n点击此处查看代码图像\n\n```html\n<head>\n  <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styleA.css\">\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"styleB.css\"\
  >\n</head>\n```\n\n除了 CSS 文件外，你还可以将图标、帮助文档、许可证和搜索等链接到网页。例如，下面的代码链接了一个在网页加载时显示在浏览器标签页中的图标：\n\
  \n点击此处查看代码图像\n\n```html\n<link rel=\"icon\" type=\"image/png\" href=\"http://example.com/myicon.png\"\
  >\n```\n\n### 添加 HTML 主体元素\n\n大多数添加到 `body` 块的 HTML 元素由浏览器渲染并显示在用户的屏幕上。每个 HTML 主体元素标签都提供了不同的选项，帮助你以有意义且优雅的方式在网页上显示信息。\n\
  \n在接下来的章节中，你将看到某些在编写 jQuery 和 JavaScript 编程时应用于 HTML 元素的非常有用的属性。你还将学习一些在书的其余部分会看到的常见元素的语法，以便于理解这些示例。\n\
  \n### 使用重要的主体元素属性\n\n每个不同的主体元素都有某些对该元素特有的属性。然而，某些属性对于所有元素都是重要且通。这些标签如下：\n\n![Image](img/image00767.jpeg)\
  \ `id`——这是一个字符串标识符，在网页上的所有元素中必须是唯一的。CSS、JavaScript 和 jQuery 使用它来识别、访问和修改网页上的特定元素。\n\
  \n![Image](img/image00767.jpeg) `class`——`class` 属性允许你指定多个元素的分组。该选项在 CSS 样式设置中被广泛使用，用于同时为多个\
  \ HTML 元素设置样式（如 `background-color`）。在 jQuery 中，它也用于根据元素的 `class` 值选择多个元素。\n\n![Image](img/image00767.jpeg)\
  \ `style`——`style` 属性允许你将 CSS 定义直接放在 HTML 对象内部 HTML 代码中。`style` 中的值会覆盖所有其他 CSS 指。\n\
  \n下面的代码说明了向 HTML 元素添加 `id`、`class` 和 `style` 属性的语法。注意类 `heading` 和 `content` 被多次使用，但每个元素的\
  \ `id` 属性都是不同的。还要注意对于第一个标题，添加了额外的 `style` 属性以强制第一个标题始终加粗：\n\n点击此处查看代码图像\n\n```html\n\
  <div id=\"Div1\">\n  <p id=\"Div1Heading\" class=\"heading\" style=\"font-weight:bold\"\
  >Heading Text</p>\n  <p id =\"Div1Content\" class=\"content\">Some Content</p>\n\
  </div>\n<div id=\"Div2\">\n  <p id=\"Div2Heading\" class=\"heading\">Another Heading\
  \ Text</p>\n  <p id =\"Div2Content\" class=\"content\">Some More Content</p>\n</div>\n\
  ```\n\n### 理解块级与内行元素\n\n记住，网页是通过浏览器解析 HTML 文档中的每个元素并与其任何子元素一起渲染到显示器上的。块级元素（block）和内行元素（inline\
  \ elements）之间的区别在于浏览器给予元素的空间大小。\n\n块级元素获得可用的全宽度来在浏览器中渲染项目。这意味着任何之前的元素都将显示在上方，随后的元素将显示在下方。`<div>`\
  \ 和 `<p>` 是块级元素的示例。\n\n内行元素仅获得在页面上显示元素所需的宽度。这意味着只要空间足够，多个内行元素就会浏览器中并排显示。`<span>`、`<a>`\
  \ 和 `<img>` 是内行元素的某些示例。\n\n下面的代码和图 3.4 所示的渲染版本说明了块级标签和内行标签之间的区别。注意 `<p>` 标签占据了浏览器屏幕的全宽度，而\
  \ `<span>` 标签仅占据足够显示文本和外边距的空间：\n\n```html\n<p>Paragraph A</p>\n<p>Paragraph B</p>\n\
  <p>Paragraph C</p>\n<<span>>Span A</span>\n<<span>>Span B</span>\n<<span>>Span CA</span>\n\
  ```\n\n![Image](img/image00810.jpeg)\n\n**图 3.4** 块级元素 `<p>` 占据了整个宽度，但内行元素 `<span>`\
  \ 只使用它需要的宽度。\n\n虽然元素默认是块级或内行的，但你始终可以通过设置 `display` CSS 样式来更改它们。例如，如下所示将 `<span>`\
  \ 的 display 设置为 block，将使其行为得像一个 `<div>` 元素：\n\n点击此处查看代码图像\n\n```html\n<span style=\"\
  {display:block;}\">Span Text</span>\n```\n\n以下是你可以设置给 `display` 的值列表：\n\n![Image](img/image00767.jpeg)\
  \ `block`——将元素渲染为块级。\n\n![Image](img/image00767.jpeg) `inline`——将元素渲染为内行。\n\n![Image](img/image00767.jpeg)\
  \ `none`——不渲染该元素。\n\n这些标签不需要闭合标签。例如，下面的代码创建了一组由 `<br>` 和 `<hr>` 分隔的 `<span>` 元素，如图\
  \ 3.5 所示：\n\n```html\n<span>Text on</span></span>\n<span>Line 1</span></span><br>\n\
  <span>Text on Line 2</span></span><hr>\n<span>New section on Line 3</span></span\n\
  ```\n\n![Image](img/image0811.jpeg)\n\n**图 3.5** 使用 `<br>` 和 `<hr>`\n\n### 创建容器元素\n\
  \n容器元素用于各种目的，例如分组和格式化元素或文本。这允许你对容器应用格式和尺寸，并影响其内部的所有项目。虽然任何 HTML 元素都可以作为容器，但主要的三个是\
  \ `<p>`、`<div>` 和 `<span>`。\n\n容器元素本身不会改变内部文本的外。例如，以下所有内容的渲染效果是相同的：\n\n```text\n\
  Some Text\n<p>Some Text</p>\n<div>Some Text</div>\n<span>Some Text</span>\n```\n\
  \n#### 尝试一下：使用容器元素分组和样式\n\n容器元素通常用于布局和样式设置的分组。下面的练习创建了列表 3.4 中的代码。该代码旨在向你介绍分组和样式：\n\
  \n1. 首先在你的 Eclipse 项目中创建一个名为 `lesson03` 的文件夹。\n2. 在 `lesson03` 文件夹中创建一个名为 `css_styling.html`\
  \ 的新 HTML 文档（匹配书籍网站上的文件名）。\n3. 添加适当的 `<html>、`<head>` 和 `<body>` 标签。\n4. 添加下面的 `<div>`\
  \ 元素，将其 `class` 属性设置为 `heading`。\n\n这将标题项的容器：\n\n```html\n<div class=\"heading\"\
  >\n  <p>Heading A</p>\n  <p>Heading B</p>\n</div>\n```\n\n\n\n\n\n### 标题 C\n\n<p>Heading\
  \ C</p>\n\n5. 添加以下第二个 `<<div>>` 元素，并将 `class` 属性设置为“`content`”。这是你内容项目的容器：\n\n点击此处查看代码图像\n\
  \n```html\n<div class=\"content\">\n  <p>Paragraph A</p>\n  <p>Paragraph B</p>\n\
  \  <p>Paragraph C</p>\n</div>\n```\n\n6. 保存文件并在 浏览器中加载以下 URL 以查看未格式化的代码，如 图 3.6\
  \ 所示：\n\n点击此处查看代码图像\n\nhttp://localhost/lesson03/css_styling.html\n\n![Image](img/image00812.jpeg)\n\
  \n**图 3.6** 使用 `<div>` 容器元素可以轻松更改网页不同区域 `<p>` 元素的外观和行为。\n\n7. 返回 Eclipse 并在文件头部添加一个\
  \ `<style>` 标签。\n\n8. 在 `<style>` 标签内部，添加以下代码将内容元素格式化为灰色背景并在边缘留一些内边距：\n\n点击此处查看代码图像\n\
  \n```css\n.content p{\n  background-color:#C0C0C0;\n  padding: 3px;\n}\n```\n\n\
  9. 添加以下附加规则来设置头部元素。此规则将标题容器中的 `<p>` 元素更改为内联，并带有加粗白色文本和黑色背景：\n\n点击此处查看代码图像\n\n```css\n\
  .heading p{\n  display: inline;\n  background-color:black;\n  color: white;\n  font-weight:bold;\n\
  \  padding:3px;\n}\n```\n\n10. 保存文档并在浏览器中重新加载。注意 图 3.6 中，“heading”类 `<div>` 元素中的元素被渲染为内联、黑色背景和白色文本，而“content”类\
  \ `<div>` 元素中的元素被渲染为灰色背景并保持块级样式。\n\n**列表 3.4 css_styling.html 使用 <style> 标签向 HTML\
  \ 文档添加 CSS**\n\n点击此处查看代码图像\n\n```html\n<html>\n  <head>\n    <title>CSS Styling</title>\n\
  \    <meta charset=\"UTF-8\">\n    <style type=\"text/css\">\n      .content p{\n\
  \        background-color:#C0C0C0;\n        padding: 3px;\n      }\n      .heading\
  \ p{\n        display: inline;\n        background-color:black;\n        color:\
  \ white;\n        font-weight:bold;\n        padding:3px;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <div class=\"heading\">\n      <p>Heading A</p>\n    \
  \  <p>Heading B</p>\n      <p>Heading C</p>\n    </div>\n    <div class=\"content\"\
  >\n      <p>Paragraph A</p>\n      <p>Paragraph B</p>\n      <p>Paragraph C</p>\n\
  \    </div>\n  </body>\n</html>\n```\n\n你将在 JavaScript 和 jQuery 中大量使用容器元素来分组、格式化和控制页面的各个方面。\n\
  \n#### 添加链接元素\n\n网页中通常包含一组指向其他页面的链接。使用锚点标签 `<a>` 可以很容易地在网页上添加链接。`<a>` 标签有三个用途：\n\
  \n![Image](img/image00767.jpeg) **到外部网页的链接**——在网页上显示一个链接。当用户点击链接时，浏览器会从服务器请求网页。以下是向外部网页添加链接的示例：\n\
  \n点击此处查看代码图像\n\n```html\n<a href=\"http://www.dayleycreations.com/\">Dayley Creations\n\
  ```\n\n![Image](img/image00767.jpeg) **到当前网页位置的链接**——在网页上显示一个链接。当用户点击链接时，浏览器将向下滚动到该位置，使链接的锚点可见：\n\
  \n点击此处查看代码图像\n\n```html\n<a href=\"#local link\">Link to Some Text\n```\n\n![Image](img/image00767.jpeg)\
  \ **网页锚点**——在网页内部添加一个可以直接链接到当前页面或另一个网页的链接。要定义锚点，你需要使用 `id` 属性。例如，要为前面的链接添加锚点，请使用以下代码：\n\
  \n点击此处查看代码图像\n\n```html\n<a id=\"local_link\">Page Anchor\n```\n\n在使用 JavaScript\
  \ 构建链接元素时，网页锚点非常有用。例如。\n\n### 使用图像元素\n\n网页锚点在 ways JavaScript 构建链接元素时非常有用。图像的一个优势是可以使用\
  \ `<img>` 标签来显示。图像的显示取决于定义，需要使用 `height` 和 `width` 属性。以下代码显示了具有不同 `height` 和 `width`\
  \ 属性的图像，如 图 3.7 所示：\n\n点击此处查看代码图像\n\n```html\n<img src=\"peak.jpg\" height=\"200\"\
  >\n<img src=\"peak.jpg\" width=\"200\">\n<img src=\"peak.jpg\" height=\"200\" width=\"\
  200\">\n```\n\n![Image](img/image00813.jpeg)\n\n**图 3.7** 使用 `<img>` 添加图像并指定 `height`\
  \ 和 `width`\n\n#### 应用列表元素\n\n列表元素允许将项目分组并带有编号或符号。有序列表使用 `<ol>` 标签创建，无序列表使用 `<ul>`\
  \ 标签创建。列表项目包含在 `<li>` 标签中。例如，以下代码如 图 3.8 所示：\n\n```html\n<ul>\n  <li>Yellowstone</li>\n\
  \  <li>Yosemite</li>\n  <li>Glacier</li>\n  <li>Arches</li>\n  <li>Zion</li>\n</ul>\n\
  ```\n\n![Image](img/image00814.jpeg)\n\n**图 3.8** 使用 `<ul>` 和 `<li>` 标签向网页添加列表\n\
  \n#### 创建表格元素\n\n表格元素是最复杂的 HTML 元素之一。它们用于以行列的形式组织屏幕上的其他元素。它们可以多种用途，从布局整个网页到简单的数据表格。本节涵盖了你所需的基础知识。\n\
  \n表格使用一系列定义表格、头部、主体和单元格的标签来构建。以下列出了构建表格时使用的各种标签：\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ `<tr>`—定义表格中的单行。它作为 `<th>` 和/或 `<td>` 元素或单元格元素的容器。\n\n![Image](img/image00767.jpeg)\
  \ `<caption>`—为标题内容提供容器。标题内容可以是文本或其他 HTML 元素。\n\n![Image](img/image00767.jpeg) `<colgroup>`—允许你将表格中的一个或多列放入一组中，并对它们进行统一格式化。如果你想通过\
  \ `id` 属性从 jQuery 或 JavaScript 访问特定的列集，这也非常有用。\n\n![Image](img/image00767.jpeg)\
  \ `<col>`—指定 `<colgroup>` 元素中单列的列属性。\n\n![Image](img/image00767.jpeg) `<tfoot>`—该元素不是必须的，但它非常有用，因为它允许你对表格中的页脚元素进行分组和定义，或者通过\
  \ `id` 属性直接从 jQuery 或 JavaScript 引用页脚元素的父级元素。\n\n在 HTML 4 中，可以在表格元素上设置几个属性。其中许多在\
  \ HTML5 中已被弃用，因为它们曾用于格式化大小、对齐和颜色，而这些应该通过 CSS 样式来完成。以下是你仍需要在表格元素上的一些的重要属性列表：\n\n\
  ![Image](img/image00767.jpeg) `border`—指定表格单元格是否具有边框。\n\n![Image](img/image00767.jpeg)\
  \ `colspan`—指定单元格应跨越的列数。这允许单个 `<td>` 或 `<th>` 元素占据表格中的多列。\n\n![Image](img/image00767.jpeg)\
  \ `rowspan`—指定单元格应跨越的数。这允许单个 `<td>` 或 `<th>` 元素占据表格中的多行。\n\n![Image](img/image00767.jpeg)\
  \ `headers`—添加到 `<td>` 或 `<th>` 元素上。允许你指定一个或多个 `<th>` 元素的 `id` 值。这创建了与表头元素的关联，可以通过\
  \ jQuery 和 JavaScript 进行访问。\n\n***\n\n## 动手尝试：创建 HTML 表格\n\n解释表格最简单的方法是向你展示创建一个基础表格的示例。使用以下步骤在\
  \ 列表 3.5 中创建表格代码：\n\n1. **在 lesson03 文件夹中创建一个名为 `tables.html` 的新 HTML 文档**（以与书籍网站上的文件名匹配）。\n\
  2. **添加相应的 `<html>`、`<head>` 和 `<body>` 标签。**\n3. **添加以下 `<table>` 元素**，并将 `border`\
  \ 属性设置为 1：\n\n点击此处查看代码图片\n\n```html\n08      <table border=1></<table>\n```\n\n\
  4. **在 `<table>` 元素内部添加以下 `<caption>` 元素**，以为表格添加标题：\n\n点击此处查看代码图片\n```html\n09\
  \      <caption>Favorite World Sites</caption>\n```\n\n5. **通过向 `<table>` 元素添加以下\
  \ `<thead>` 元素来创建表头**。注意第三个 `<th>` 将 `colspan` 设置为 2，以便它将覆盖最后两列，如图 3.9](#part0014.xhtml_ch03fig09)\
  \ 所示：\n\n点击此处查看代码图片\n```html\n10      <thead>\n11          <th>Monument</th>\n12\
  \          <th>location</th>\n13          <th colspan=2>century</th>\n14      </thead>\n\
  ```\n\n![Image](img/image00815.jpeg)\n\n**图 3.9** 一个 HTML 表格示例，显示了行列表头以及标题。\n\n\
  6. **添加以下 `<tr>` 元素**。注意接下来的示例，这些 `<tr>` 元素每一个都包含四个单元格。第一个单元格是行头，因为它使用了 `<th>` 标签。接下来的两个单元格是\
  \ `<td>` 元素中的简单文本，但在第四个单元格中，`<td>` 元素包含一个 `<img>` 元素（.jpg 文件可以在书籍网站上找到）：\n\n点击此处查看代码图片\n\
  ```html\n15      <tr>\n16          <th>Delicate Arch</th>\n17          <td>Utah</td>\n\
  18          <td>March 1, 1872</td>\n19          <td><img src=\"/images/arch.jpg\"\
  \ width=\"100\" />\n20      </tr>\n```\n\n7. **保存文档**并在网页浏览器中打开以下 URL，以在图 3.9](#part0014.xhtml_ch03fig09)\
  \ 中查看结果：\n\n点击此处查看代码图片\n\n`http://localhost/lesson03/tables.html`\n\n**列表 3.5 tables.html\
  \ 生成带有表头的表格**\n\n点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n03 <head>\n\
  04     <title>Tables</title>\n05     <meta charset=\"UTF-8\">\n06 </head>\n07 <body>\n\
  08     <table border=1>\n09         <caption>Favorite World Sites</caption>\n10\
  \         <thead>\n11             <th>Monument</th>\n12             <th>location</th>\n\
  13             <th colspan=2>century</th>\n14         </thead>\n15         <tr>\n\
  16             <th>Delicate Arch</th>\n17             <td>Utah</td>\n18        \
  \     <td>March 1, 1872</td>\n19             <td><img src=\"/images/arch.jpg\" width=\"\
  100\" /></td>\n20         </tr>\n21         <tr>\n22             <th>Great Canyon</th>\n\
  23             <td>Arizona</td>\n24             <td>Ancient</td>\n25           \
  \  <td><img src=\"/images/canyon.jpg\" width=\"100\" /></td>\n26         </tr>\n\
  27         <tr>\n28             <th>Statue of Liberty</th>\n29             <td>New\
  \ York</td>\n30             <td>1886</td>\n31             <td><img src=\"/images/statue.jpg\"\
  \ width=\"100\" /></td>\n32         </tr>\n33     </table>\n34 </body>\n35 </html>\n\
  ```\n\n***\n\n## 实现表单元素\n\n表单元素有一组不同的属性，用于访问和修改元素的外观和行为。以下是你可以获取用户输入的一些常用的表单标签：\n\
  \n![Image](img/image00767.jpeg) `<form>`—这是表单的根元素。所有其他元素都包含其中。\n\n![Image](img/image00767.jpeg)\
  \ `<fieldset>`—作为一组表单元素的容器。在 HTML5 中，你可以通过设置 fieldset 的 `disabled` 属性来禁用输入。你也可以使用\
  \ jQuery 和 JavaScript 访问并修改其子元素。\n\n![Image](img/image00767.jpeg) `<legend>`—告诉浏览器为\
  \ fieldset 添加一个标题。\n\n![Image](img/image00767.jpeg) `<label>`—通过将 `for` 属性设置为 `<input>`\
  \ 元素的 `id` 值，将标签元素与表单中的 `<input>` 元素绑定。这样做的好处是，点击标签也会触发输入元素的鼠标事件。\n\n![Image](img/image00767.jpeg)\
  \ `<input>`—input 标签实际上是多种类型输入组件的封装。浏览器渲染的输入取决于 `type` 属性的值。以下是可以在 input 标签中指定的类型元素列表：`button`,\
  \ `checkbox`, `color`, `date`, `datetime`, `email`, `file`, `hidden`, `image`, `month`,\
  \ `number`, `password`, `radio`, `range`, `reset`, `search`, `submit`, `tel`, `text`,\
  \ `time`, `url`, `week`。\n\n![Image](img/image00767.jpeg) `<textarea>`—与其他输入不同，它提供了一个允许用户输入多行文本的可调整区域。`cols`\
  \ 和 `rows` 属性定义了初始大小。\n\n![Image](img/image00767.jpeg) `<select>`—下拉列表容器。\n\n![Image](img/image00767.jpeg)\
  \ `<option>`—在 `<select>` 元素内部定义列表中的单个项目。选中项目的 `value` 属性也是 `<select>` 元素的 `value`。\n\
  \n![Image](img/image00767.jpeg) `<button>`—定义一个点击的按钮元素。按钮的 `type` 属性告诉浏览器使用该按钮提交\
  \ `submit` 表单、重置 `reset` 值，还是作为简单的输入 `button`。\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ name—此选项指定了提交表单时使用的名称。\n\n![Image](img/image00767.jpeg) value—此选项指定表单元素的值。对于如\
  \ `text <input>` 等元素，你为 `value` 指定的内容将作为文本添加到渲染后的文本框中。`value` 属性也可以通过 JavaScript\
  \ 访问，因此你可以直接从 JavaScript 获取任何表单元素的值。\n\n![Image](img/image00767.jpeg) disabled—当添加此属性时，元素将会被显示；但它将显示为禁用状态，使用户无法与表单元素进行交互。当你从\
  \ JavaScript 或 jQuery 启用或禁用元素时，此值会被动态修改。`disabled` 属性是一个布尔值，因此你不需要包含一个值。以下显示了包含\
  \ `disabled` 属性的示例：\n\n```\n<input type=\"text\" disabled />\n```\n\n***\n\n# 动手尝试一下：在网页中添加表单\n\
  \n在这个示例中，你将在网页上添加一个包含不同元素的表单。完成后的示例如代码列表 3.6 所示，它渲染了图 3.10 所示带有多种类型表单元素的网页表单。通过学习以下示例中的基础，你将能够创建几乎任何需要的自定义表单：\n\
  \n1. 在 `lesson03` 文件夹中创建一个名为 `forms.html` 的新 HTML 文档（以匹配书籍网站上的文件名）。\n2. 添加相应的 `<html>`、`<head>`\
  \ 和 `<body>` 标签。\n3. 添加一个 `<form>` 元素。\n4. 在 `<form>` 元素内部，添加以下 `<fieldset>` 来请求信息。`<fieldset>`\
  \ 包含一个提供标题的 `<legend>` 元素；两个用于名称、起始地、目的地和数据的基本 `text <input>` 标签；以及一个带有四个 `<option>`\
  \ 子元素的 `<select>` 元素，用于提供航空司的下拉列表。图 3.10 显示了渲染后的 `<fieldset>`，其周围和元素周围有一个框。\n\n\
  ```html\n<fieldset>\n  <legend>Contact Info:</legend>\n  Name: <input type=\"text\"\
  \ name=\"name\">\n  Origin: <input type=\"text\" name=\"address\"><br>\n  Destination:\
  \ <input type=\"text\" name=\"city\">\n  Flight Date: <input type=\"text\" name=\"\
  zip\"><br>\n  <select name=\"Airline\">\n    <option value=\"DA\">Delta</option>\n\
  \    <option value=\"PJ\">Private Jet</option>\n    <option value=\"Heli\">Helicopter</option>\n\
  \    <option value=\"EG\">Eagles</option>\n  </select>\n</fieldset>\n```\n\n5. 接下来，添加单选按钮来选择单程或往返。向表单添加以下\
  \ `<label>` 和 `<input>` 字段。`<input>` 元素的 `type` 属性设置为 `radio`。还要注意，`<label>` 元素包含一个\
  \ `for` 属性，将其与 `radio <input>` 元素关联。因为 `<label>` 与 `<input>` 关联，当你点击标签时，它会切换单选按钮的状态。\n\
  \n```html\n<input id=\"One WayRB\" type=\"radio\" name=\"travelPlan\" value=\"One\
  \ way\">\n<label for=\"One WayRB\">One Way</label>\n<input id=\"Round TripRB\" type=\"\
  radio\" name=\"travelPlan\" value=\"round trip\">\n<label for=\"Round TripRB\">Round\
  \ Trip</label>\n```\n\n6. 通过添加以下 `<textarea>` 元素添加注释元素。注意 `rows` 和 `cols` 属性定义了尺寸，我们在文本区域中初始包含了“comments”单词而不是添加标签。`<br>`\
  \ 标签导致后续表单元素位于新行：\n\n```html\n<textarea rows=\"10\" cols=\"30\">comments</textarea><br>\n\
  ```\n\n7. 通过添加以下 `<input>` 和 `<label>` 提供复选框以启用飞行里程。`<input>` 元素的 `type` 设置为 `checkbox`，以便浏览器将其渲染为复选框。同样，`<label>`\
  \ 元素使用 `for` 属性使用户户点击复选框或标签来切换开启：\n\n```html\n<input id='newsCB' type=\"checkbox\"\
  \ name=\"news\" value=\"news\">\n<label for=\"newsCB\">I would like to enroll into\
  \ the flyer miles</label><br>\n```\n\n8. 添加以下代码以包含两个按钮元素：一个 `submit` 按钮和一个 `reset`\
  \ 按钮。点击 `submit` 按钮时，浏览器会提交表单。点击 `reset` 按钮时，表单中的值将重置：\n\n```html\n<button type=\"\
  submit\" name=\"SubmitButton\" value=\"Submit\"></button>\n<button type=\"reset\"\
  \ name=\"ResetButton\" value=\"Reset\"></button>\n```\n\n9. 保存文档并在网页浏览器中打开以下 URL，以查看图\
  \ 3.10 中的渲染结果：`http://localhost/lesson03/forms.html`\n\n**图 3.10** 显示由代码列表 3.6 创建的各种元素的\
  \ HTML 表单。\n\n**代码列表 3.6 forms.html** 生成带有文本、单选和选择输入的表单\n\n```html\n<html>\n<head>\n\
  \  <title>Forms</title>\n  <meta charset=\"UTF-8\">\n</head>\n<body>\n  <form>\n\
  \    <fieldset>\n      <legend>Contact Info:</legend>\n      Name: <input type=\"\
  text\" name=\"name\">\n      Origin: <input type=\"text\" name=\"address\"><br>\n\
  \      Destination: <input type=\"text\" name=\"city\">\n      Flight Date: <input\
  \ type=\"text\" name=\"zip\"><br>\n      <select name=\"Airline\">\n        <option\
  \ value=\"DA\">Delta</option>\n        <option value=\"PJ\">Private Jet</option>\n\
  \        <option value=\"Heli\">Helicopter</option>\n        <option value=\"EG\"\
  >Eagles</option>\n      </select>\n    </fieldset>\n    <input id=\"One WayRB\"\
  \ type=\"radio\" name=\"travelPlan\" value=\"One way\">\n    <label for=\"One WayRB\"\
  >One Way</label>\n    <input id=\"Round TripRB\" type=\"radio\" name=\"travelPlan\"\
  \ value=\"round trip\">\n    <label for=\"Round TripRB\">Round Trip</label>\n  \
  \  <textarea rows=\"10\" cols=\"30\">comments</textarea><br>\n    <input id='newsCB'\
  \ type=\"checkbox\" name=\"news\" value=\"news\">\n    <label for=\"newsCB\">I would\
  \ like to enroll into the flyer miles</label><br>\n    <button type=\"submit\" name=\"\
  SubmitButton\" value=\"Submit\"></button>\n    <button type=\"reset\" name=\"ResetButton\"\
  \ value=\"Reset\"></button>\n  </form>\n</body>\n</html>\n```\n\n***\n\n### 添加一些高级\
  \ HTML5 元素\n\nHTML5 添加了许多更高级的元素，你可以使用它们来增强动态网页。一些图形和媒体元素将在后续章节中介绍，因为它们与 JavaScript/jQuery\
  \ 编程之间存在直接关系。\n\n#### 使用 HTML5 图形元素\n\n两个主要的 HTML5 图形元素是 `<svg>` 和 `<canvas>`。这两个元素可以通过\
  \ jQuery 和 JavaScript 添加并操作。这允许你通过脚本直接在浏览器窗口中绘图，动态改变复杂的图形。\n\n##### 在 HTML5 中创建\
  \ SVG 图形\n\n\n\n\n\n`<svg>` 元素允许你在网页中添加可缩放矢量图形。可缩放矢量图形是由一系列构成路径的线、弧和填充组成的。当由浏览器渲染时，这些路径可以生成从简单到复杂的图形。使用矢量图形的优势是，即使在浏览器中进行缩放，它们也能保持锐利的边缘。它们在屏幕上和打印时看起来都更加清晰。\n\
  \n添加 SVG 图形可能会变得非常复杂；下一节将介绍涉及的 HTML 元素，以便你理解属性和样式属性。通过 JavaScript 和 jQuery，你将出于各种原因访问这些属性，例如在网页中创建和制作图形。\n\
  \n## 添加基础几何形状\n\n首先，你将创建一些基础几何形状。以下来自列表 3.7 的代码创建了一系列简单的椭圆和一个圆，如图 3.11 所示。在 `<ellipse>`\
  \ 元素中，你使用 `cx` 和 `cy` 坐标指定椭圆的中心；然后使用 `rx` 和 `ry` 属性在水平和垂直方向上指定半径。注意，你还指定了 `stroke`\
  \ 颜色和宽度，以及 `fill` 颜色：\n\n点击此处查看代码图像\n\n```xml\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ version=\"1.1\" height=\"200\">\n  <ellipse cx=\"100\" cy=\"100\" rx=\"80\" ry=\"\
  50\" stroke=\"black\" stroke-width=\"2\" fill=\"transparent\" />\n  <ellipse cx=\"\
  100\" cy=\"100\" rx=\"50\" ry=\"80\" stroke=\"black\" stroke-width=\"2\" fill=\"\
  transparent\" transform=\"rotate(30, 100, 100)\" />\n  <ellipse cx=\"100\" cy=\"\
  100\" rx=\"80\" ry=\"50\" stroke=\"black\" stroke-width=\"2\" fill=\"transparent\"\
  \ transform=\"rotate(60, 100, 100)\" />\n  <ellipse cx=\"100\" cy=\"100\" rx=\"\
  8\" ry=\"2\" stroke=\"crimson\" stroke-width=\"2\" fill=\"crimson\" transform=\"\
  rotate(45, 100, 100)\" />\n  <ellipse cx=\"100\" cy=\"100\" rx=\"2\" ry=\"8\" stroke=\"\
  crimson\" stroke-width=\"2\" fill=\"crimson\" transform=\"rotate(45, 100, 100)\"\
  \ />\n  <ellipse cx=\"100\" cy=\"100\" rx=\"2\" ry=\"8\" stroke=\"black\" stroke-width=\"\
  2\" fill=\"transparent\" />\n  <ellipse cx=\"100\" cy=\"100\" rx=\"2\" ry=\"8\"\
  \ stroke=\"crimson\" stroke-width=\"2\" fill=\"crimson\" />\n  <ellipse cx=\"100\"\
  \ cy=\"100\" rx=\"8\" ry=\"2\" stroke=\"crimson\" stroke-width=\"2\" fill=\"crimson\"\
  \ />\n  <circle cx=\"100\" cy=\"100\" r=\"6\" stroke=\"red\" stroke-width=\"4\"\
  \ fill=\"Dark\"/>\n</svg>\n```\n\n![Image](img/image00817.jpeg)\n**图 3.11** 使用 SVG\
  \ 图形可以轻松地向网页添加基础几何形状。\n\n### 添加路径\n\n另一个示例是使用路径绘制一些复杂的形状。路径是所有连接的线的集合。这些线可以是直线、抛物线弧或贝塞尔曲线。要创建路径，向\
  \ `<svg>` 元素中添加一个 `<path>` 元素并定义 `d` 属性。`d` 属性包含一系列指令，告诉浏览器如何在屏幕上渲染该路径。以下是更常用的命令列表：\n\
  \n![Image](img/image00767.jpeg) `M x,y`: 指定移动到坐标 `x,y`。大写的 `M` 指定绝对坐标；小写的 `m` 指定相对坐标。\n\
  \n![Image](img/image00767.jpeg) `h n`: 指定绘制长度为 `n` 像素的水平线。此值可以是正也可以是负。负数表示左侧。大写的\
  \ `H` 是绝对的，小写的 `h` 是相对的。\n\n![Image](img/image00767.jpeg) `v n`: 指定绘制长度为 `n` 像素的垂直线。此值可以是正也可以是负。负数表示向上。大写的\
  \ `V` 是绝对的，小写的 `v` 是相对的。\n\n![Image](img/image00767.jpeg) `l x,y`: 从当前坐标到坐标 `x,y`\
  \ 画一条线。你可以指定用空格分隔的额外坐标来添加线段。大写的 `L` 是绝对的，小写的 `l` 是相对的。\n\n![Image](img/image00767.jpeg)\
  \ `c x1 y1 y2 y2 x`: 从当前坐标到 `x,y` 绘制一条贝塞尔曲线，使用 `x1,y1` 作为曲线起点的控制点，并使用 `x2,y2` 作为曲线终点的控制点。图\
  \ 3.12 阐了控制点是如何工作的。大写的 `C` 是绝对的，小写的 `c` 是相对的。\n\n![Image](img/image00818.jpeg)\n\
  **图 3.12** 控制点定义曲线的形状。\n\n![Image](img/image00767.jpeg) `a rx ry x-axis-rotation\
  \ large-arc-flag sweep-flag x y`: 从当前坐标到 `x,y` 绘制一条弧。椭圆的大小和方向由两个半径 `rx, ry` 以及 `x-axis-rotation`\
  \ 值定义，该值指定了弧的 x 轴的角度。`large-arc-flag` 和 `sweep-flag` 设置为 `0` 或 `1`，定义了抛物线的哪部分被渲染到屏幕上。大写的\
  \ `A` 是绝对的，小写的 `a` 是相对的。\n\n![Image](img/image00767.jpeg) `z`: 关闭路径，这意味着最后一个坐标将连接到路径的起点。\n\
  \n列表 3.7 中的后续代码说明了如何利用几个路径，如图 3.13 所示。注意 `<path>` 元素以 `M` 指令开始移动到绝对坐标。然后 `h50` 命令向右绘制\
  \ 50 像素的线；接下来，`a` 命令绘制一个半径为 50 像素且跨越两个方向的弧。最后，`z` 命令关闭弧。\n\n```xml\n<svg xmlns=\"\
  http://www.w3.org/2000/svg\" version=\"1.1\" height=\"200\">\n  <path d=\"M100,90\
  \ h50 a50,50 0 1,0 50,-50 z\" stroke=\"purple\" stroke-width=\"1\" fill=\"none\"\
  \ />\n  <path d=\"M90,80 v-50 a50,50 0 0,0 -50,50 z\" stroke=\"violet\" stroke-width=\"\
  2\" fill=\"none\" />\n</svg>\n```\n\n![Image](img/image00819.jpeg)\n**图 13** 使用路径创建饼图。\n\
  \n除了使用路径创建图形元素外，你还可以使用路径创建一些文本效果。例如，以下代码在 `<defs>` 容器中添加了一个无填充的路径。该路径使用两个弧绘制了一个完整的圆。`id`\
  \ 属性设置为 `path1`。接下来，创建了一个 SVG `<text>` 元素来定义文本。注意 `<text>` 元素内部有一个引用 `path1` 的 `<textPath>`。结果是文本绘制在路径上，如图\
  \ 3.14 所示。我们还向 `<svg>` 标签添加了一个路径，使用几个线段绘制了指针。\n\n```xml\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ version=\"1.1\" height=\"350\">\n  <defs>\n    <path id=\"path1\" d=\"M 77,210\
  \ a 1,1 0 1,1 200,0 a 1,1 0 1,1 -200,1\"/>\n  </defs>\n  <text x=\"10\" y=\"10\"\
  \ style=\"fill:blue;font-size:31px;\">\n    <textPath xlink:href=\"#path1\">\n \
  \     Teach Yourself AngularJS JavaScript and jQuery\n    </textPath>\n  </text>\n\
  \  <path d=\"M 175,130 v90 h60\" stroke=\"black\" stroke-width=\"5\" fill=\"none\"\
  />\n</svg>\n```\n\n![Image](img/image00820.jpeg)\n**图 3.14** 使用矢量路径，你可以将文本链接到路径以创建酷酷的视觉效果。\n\
  \n\n\n\nSVG 示例可以在网站上的 `code/lesson03/html_svg.html` 文件中找到。使用这些技术，你可以创建大量的图形形状。\n\
