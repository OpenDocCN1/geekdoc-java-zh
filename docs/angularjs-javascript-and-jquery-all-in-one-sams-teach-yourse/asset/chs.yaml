  \ HTML5 中的 SVG 图形，可以查看此处文档：[www.w3.org/TR/SVG/Overview.html](http://www.w3.org/TR/SVG/Overview.html)。\n\
  \n### 添加 Canvas 用于动态设计\n\n`<canvas>` 元素也允许你动态地向网页页面中添加和操作图像类型的图形。canvas 允许你通过 JavaScript\
  \ 在浏览器屏幕的区域上绘制颜色、线条、文本和图像。\n\n`<svg>` 元素和 `<canvas>` 元素区别在于，后者不是作为路径存储，而是以逐像素映射的形式存储，其中每个像素都有不同的颜色和透明度。\n\
  \n使用 `<canvas>` 元素的大部分工作将在 jQuery 和 JavaScript 脚本中完成。在 HTML 中，你只需要添加一个带有 `id` 的\
  \ canvas 元素，你可以从脚本中访问它。为了了解 `<canvas>` 元素与 JavaScript 之间的关系，请考虑 `Listing 3.8` 中的代码。\n\
  \ncanvas 元素只定义了一个可以进行绘制的容器。所有工作都在 `<script>` 元素中完成。在脚本内部，前两行获取了 `myCanvas` 元素和一个\
  \ `2d` 上文对象。上下文对象是提供图形功能的图形对象。\n\n上下文对象提供了在画布上绘制的方法。\n\n```javascript\nvar c = document.getElementById(\"\
  myCanvas\");\nvar ctx = c.getContext(\"2d\");\n```\n\n这段代码设置了画布的线宽和颜色，并将渲染到画布。\n\
  \n```javascript\nctx.lineWidth = 1;\nctx.strokeStyle = \"blue\";\n```\n\n绘制立方体需要通过\
  \ `stroke()` 方法。对于面，`beginPath()` 方法开始新路径。然后使用 `createLinearGradient()` 和 `addColorStop()`\
  \ 来创建渐变填充。此时，画布上还没有任何内容。\n\n```javascript\nvar grd = ctx.createLinearGradient(100,0,100,5);\n\
  grd.addColorStop(0,\"blue\");\ngrd.addColorStop(1,\"white\");\nctx.fillStyle = grd;\n\
  ```\n\n绘制立方体的面需要通过 `moveTo()` 方法移动到特定坐标，然后通过一系列 `lineTo()` 方法添加线条。\n\n**图 3.15**\
  \ 使用 JavaScript 在画布上绘制像素。\n\n![Image](img/00821.jpeg)\n\n### 列表 3.8 在 <canvas> 元素中绘制立方体的\
  \ JavaScript 和 HTML 代码\n\n```html\n<html>\n  <head>\n    <title>HTML5 Canvas</title>\n\
  \    <meta charset=\"UTF-8\" />\n  </head>\n  <body>\n    <canvas id=\"myCanvas\"\
  \ width=\"300\" height=\"300\">\n      Your Browser Doesn't Support HTML5\n    </canvas>\n\
  \    <script>\n      var c = document.getElementById(\"myCanvas\");\n      var ctx\
  \ = c.getContext(\"2d\");\n      ctx.lineWidth = 1;\n      ctx.strokeStyle = \"\
  blue\";\n      //top\n      ctx.beginPath();\n      var grd = ctx.createLinearGradient(100,50,100,5);\n\
  \      grd.addColorStop(0,\"blue\");\n      grd.addColorStop(1,\"white\");\n   \
  \   ctx.fillStyle = grd;\n      grd.addColorStop(0,\"blue\");\n      ctx.moveTo(1,25);\n\
  \      ctx.lineTo(100,5);\n      ctx.lineTo(200,25);\n      ctx.lineTo(100,50);\n\
  \      ctx.fill();\n      ctx.stroke();\n      //left\n      ctx.beginPath();\n\
  \      var grd = ctx.createLinearGradient(75,100,60,25);\n      grd.addColorStop(0,\"\
  red\");\n      grd.addColorStop(1,\"white\");\n      ctx.fillStyle = grd;\n    \
  \  ctx.moveTo(1,25);\n      ctx.lineTo(100,50);\n      ctx.lineTo(100,165);\n  \
  \    ctx.lineTo(1,125);\n      ctx.fill();\n      ctx.stroke();\n      //right\n\
  \      ctx.beginPath();\n      var grd = ctx.createLinearGradient(200,50,125,175);\n\
  \      grd.addColorStop(0,\"yellow\");\n      grd.addColorStop(1,\"white\");\n \
  \     ctx.fillStyle = grd;\n      ctx.moveTo(100,50);\n      ctx.lineTo(200,25);\n\
  \      ctx.lineTo(200,125);\n      ctx.lineTo(100,165);\n      ctx.fill();\n   \
  \   ctx.stroke();\n    </script>\n  </body>\n</html>\n```\n\n\n\n\n\n以下代码展示了 `<video>`\
  \ 和 `<audio>` 标签的示例，图 3.16 和图 3.17 显示了渲染后的组件：\n\n点击此处查看代码图片\n\n```html\n<video width=\"\
  320\" height=\"240\" controls>\n  <source src=\"images/movie.mp4\" type=\"video/mp4\"\
  >\n  <source src=\"images/movie.ogg\" type=\"video/ogg\">\n  Sorry, your browser\
  \ does not support the video tag.\n</video>\n\n<audio controls>\n  <source src=\"\
  song.mp3\" type=\"audio/mp3\">\n  Sorry, your browser does not support the audio\
  \ element.\n</audio>\n```\n\n![Image](img/image00822.jpeg)\n\n**图 3.16** 渲染后的 `<video>`\
  \ 允许你播放电影。\n\n![Image](img/image00823.jpeg)\n\n**图 3.17** 渲染后的 `<audio>` 允许你播放歌曲或其他音频。\n\
  \n### 总结\n\n在本节中，你学习了 HTML 网页开发的基础。你还学习了如何通过 `jQuery` 和 `JavaScript` 动态访问某些元素，以便为你的网页设计更好的交互功能。此外，你还学习了设计\
  \ HTML 元素所需的必要基础，以支持实现 CSS 布局和样式设置。\n\n几个“亲手实践”练习引导你逐步添加了样式的容器、表格和网页表单。在随后的课程中，你将使用在本节中学的基础来实现动态的\
  \ `jQuery` 和 `JavaScript`。\n\n### 问答\n\n**问。为什么既有 HTML5 和 HTML 4，而不是只有 HTML？我应该用哪一个？**\n\
  \n**答。** 浏览器需要一些时间来采用新版本 HTML 中的标准。许多 HTML5 特性在旧浏览器中将无法运行，而某些新浏览器只支持某些功能而不支持其他功能。这会导致\
  \ HTML 页面出现错误且用户体验非常糟糕。因此，在 HTML5 被所有网络浏览器完全支持之前，HTML 4 将作为一个不同的标准保留。你选择使用哪一个取决于谁将查看你的网页。如果网页面向互联网上的所有人，你就需要继续支持\
  \ HTML 4，直到浏览器完全支持 HTML5。如果网页仅供公司内部用户使用，且你可以要求使用特定版本的浏览器，那么你可以选择完全支持 HTML5 的浏览器和版本并运行新功能。\n\
  \n**问。既然可以从 JavaScript 动态创建元素，为什么还要费心创建带有这些元素的 HTML 文档呢？**\n\n**答。** 用于动态网页的最佳范式是使用\
  \ HTML 构建骨架，使用 CSS 进行样式化，然后使用 `JavaScript` 添加交互。你应该使用带有完整骨架的 HTML 文档的原因是，通过 HTML\
  \ 理解和调整网页结构比通过 `JavaScript` 容易得多。此外，如果你要对网页进行本地化处理，处理 HTML 文档通常比本地化动态的 `JavaScript`\
  \ 字符串更容易。\n\n### 工作坊\n\n工作坊由一组问题和答案组成，旨在巩固你对本节内容的理解。在查看答案之前，尝试回答这些问题。\n\n### 测验\n\
  \n**1。** 使用哪个 HTML 元素属性来更改元素的背景颜色和大小等内容？\n\n**2。** `<noscript>` 元素是做什么用的？\n\n**3。**\
  \ `<canvas>` 和 `<svg>` 元素之间的区别是什么？\n\n**4。** 正确或错误：HTML 页面不能链接到同一页面上的某个位置。\n\n**5。**\
  \ 块级（block）HTML 元素和行内（inline）HTML 元素之间的区别是什么？\n\n### 测验答案\n\n**1。** `style`。\n\n\
  **2。** 如果用户的网络浏览器中没有激活 `JavaScript`，`<noscript>` 你在 HTML 页面上显示消息。\n\n**3。** `<canvas>`\
  \ 元素以基于像素的图形显示图像，并支持 JPEG 和 PNG 等图像；`<svg>` 支持基于矢量的图形，它是一系列在缩放时仍保持清晰的路径。\n\n**4。**\
  \ 错误。你可以使用 `<a href=\"#` 语法链接到网页上的本地锚点。\n\n**5。** 块级元素占据屏幕的整个宽度，因此其后的元素会流到下方；而多个行内元素可以显示在同一行，因为它们只占据所需的空间。\n\
  \n### 练习\n\n**1.** 扩展 `3.5` 中的示例。\n\n**2.** 使用 `3.8` 中的示例来包含一些内容。\n\n\n\n\n\n后续章节将讨论如何使用每个选项添加样式，以及何时应该使用它们。\n\
  \n#### 从文件加载 CSS 样式\n\n通常，加载 CSS 样式的最佳方法是从单独的文件加载，这意味着创建一个扩展名为 `.css` 的文件，然后将其添加到你的网站。这具有几个优点：\n\
  \n![Image](img/image00767.jpeg) 你可以将多个 HTML 文档链接到同一个 CSS 文件。\n\n![Image](img/image00767.jpeg)\
  \ 你的 HTML 文件将保持整洁，因为没有大量额外的 CSS 代码负担。\n\n![Image](img/image00767.jpeg) 通过将 CSS 文件更换为另一个文件，可以轻松地更改网站的外观（换肤）。\n\
  \n要从单独的文件加载 CSS 样式，你需要将 `.css` 文件添加到你的网站，然后在 HTML 的 `<head>` 元素中添加 `<link>` 元素。当加载加载时，浏览器会解析\
  \ `<link>` 元素，从 Web 服务器请求 `.css` 文件，并在渲染 HTML 元素时应用样式。\n\n以下是 `<link>` 元素中使用的语法示例。请注意\
  \ `rel` 属性被设置为 `stylesheet`，`type` 设置为 `text/css`，且 `href` 指向 Web 服务器上 `.css` 文件的位置：\n\
  \n点击此处查看代码\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/test.css\"\
  >\n```\n\n#### 在 Header 中添加 CSS 样式\n\n你也可以使用`<style>` 标签直接在网页的 `<head>` 元素中添加 CSS\
  \ 样式。`<style>` 标签内部的所有文本将被视为 CSS，读入浏览器并在渲染时应用到元素。\n\n在头部中应用 CSS 样式确实具有一些优点，包括：\n\
  \n![Image](img/image00767.jpeg) 轻松地将它们应用到头部以测试网页，而无需管理额外的 `.css` 文件。\n\n![Image](img/image00767.jpeg)\
  \ 你可以使用特定于页面的样式来覆盖从 `.css` 文件加载的全局样式。\n\n以下是一个包含 CSS 的 `<style>` 元素的 `<head>` 元素示例。注意\
  \ `type` 属性被设置为 `text/css`；这并非强制要求，但在浏览器支持其他样式类型的时代，这是一个良好的习惯：\n\n点击此处查看代码\n\n```html\n\
  <html>\n  <head>\n    <meta charset=\"UTF-8\">\n    <style type=\"text/css\">\n\
  \      p{\n        background-color:#C0C0C0;\n        padding: 3px;\n      }\n \
  \     span{\n        font-weight:bold;\n      }\n    </style>\n  </head>\n...\n\
  ```\n\n#### 在 HTML Body 中使用 CSS 样式\n\n你也可以使用`<script>` 标签直接在 HTML `<body>` 元素内部添加\
  \ CSS 样式设置。这不是良好的做法，因为这会导致网页样式非常难以更改和修复。你应该将这种方法的使用限制在为了测试目的快速添加样式的时刻。测试后，你应该始终将它们移动到\
  \ `<head>` 或单独的文件。\n\n#### 在 HTML 元素中定义 CSS 样式\n\nHTML 元素提供了 `style` 属性，允许你直接在 HTML\
  \ 语句中设置 CSS 样式。这具有优点，但有一个巨大的缺点。\n\n优点是你可以覆盖全局应用于网站或网页的 CSS 样式。这使得自定义特定元素的外观和感觉成为可能，而无需在另一个位置包含特殊规则。\n\
  \n缺点是，如果你频繁这样做，当你决定使用不同的网页设计或品牌标识时，更新网站的样式将变得非常困难。\n\n下行代码显示了直接在 `<span>` 元素内部添加\
  \ CSS `style` 的示例：\n\n点击此处查看代码\n\n```html\n<span style=\"background-color:blue;\
  \ color:white font-weight:bold\">Styled Text</span>\n```\n\n### 为 HTML 元素添加 CSS\
  \ 样式\n\n你已经在本书之前的示例中见过一些应用 CSS 的简要示例。现在是时候向你介绍可以通过 CSS 应用到 HTML 元素上的语法和属性了。本节绝不是详尽的；但它将让你了解通过\
  \ CSS 对 HTML 元素可以进行操作。\n\n当你阅读并尝试这些示例时，请记住你可以通过 AngularJS、jQuery 和 JavaScript 访问\
  \ CSS 属性，因此可以在用户与网页交互时动态地设置它们。\n\n#### 理解基础 CSS 语法\n\nCSS 由一组或多个规则组成，这些规则定义了 Web\
  \ 浏览器在渲染 HTML 元素时使用的属性值。每个规则都由选择器开始，选择器定义了对哪些 HTML 元素应用样式更改。然后在 `{}` 括号内部是特定的属性设置。属性值使用\
  \ `property:value` 语法设置。每个属性设置之间用分号隔开。\n\n以下列表显示了一个简单规则的示例，它设置了 `<p>` 元素的字体、背景颜色和宽度：\n\
  \n```css\np {\n  font-style:italic;\n  background-color:#DDDD;\n  width:250px;\n\
  }\n```\n\n你应该为每个元素使用单独的一行以增加文件的可读性。只要包含在 `{}` 中，你就可以将元素组合在同一行。例如：\n\n```css\np {\n\
  \  font-style:italic;\n  background-color:#DDDD;\n  width:250px;\n}\n```\n\n###\
  \ 注意\n\n若干 CSS 属性支持单个属性的多个设置。例如，下面的属性设置将字体设置为**粗体**、*斜体*、`12px` 和 `Times Roman`。字体之间用逗号分隔，表示它们仍然属于同一个值的一部分。注意，由于\
  \ `Times Roman` 包含空格，它必须封装在引号中：\n\n```css\nfont:italic bold 12px \"Times Roman\"\
  ,serif;\n```\n\n\n\n\n\nHTML 元素样式设计最重要的部分之一就是 CSS 选择器。CSS 选择器用于定义 CSS 规则适用于哪些 HTML\
  \ 元素。CSS 选择器起初看起来可能有些令人望畏；然而，当你通过一些示例理解了基本概念后，其语法就会迎刃解。\n\n接下来的系列示例将帮助你理解选择器。\n\n\
  要对所有 `<div>` 元素应用 CSS 规则，请使用以下（HTML 元素通过标签名引用）：\n\n```css\ndiv {...}\n```\n\n要对\
  \ `id` 属性等于 `myDiv` 的特定 HTML 元素应用 CSS 规则，请使用以下（在 CSS 中，`id` 属性使用 `#` 指定）：\n\n```css\n\
  #myDiv {...}\n```\n\n要对所有 `class` 属性等于 `container` 的 HTML 元素组应用 CSS 规则，请使用以下（在 CSS\
  \ 中，`class` 属性使用 `.` 指定）：\n\n```css\n.container {...}\n```\n\n要在鼠标悬停在 `<span>` 元素上时对其应用\
  \ CSS 规则，请使用以下（在 CSS 中，状态通过 `:state` 指定）：\n\n```css\nspan:hover {...}\n```\n\n要对\
  \ `target` 属性设置为 `_blank` 的 `<a>` 元素应用 CSS 规则，请使用以下（在 CSS 中，属性通过 `[]` 括号指定）：\n\n\
  ```css\na[target=_blank]\n```\n\n你还可以使用逗号将多个选择器链在一起。例如，要对所有 `<div>`、`<span>`、`<p>`\
  \ 以及 `class=\"menu\"` 的元素应用 CSS 规则，你可以使用以下：\n\n```css\ndiv, span, p, .menu {...}\n\
  ```\n\n还要记住，CSS 代表级联样式表（Cascading Style Sheets）。你可能会有不同的选择器适用于多个重叠的对象组。例如，考虑以下选择器。第一个适用于所有的\
  \ `<div>` 元素，第二个仅适用于 `menu` 类元素——其中一些是 `<div>` 元素——最后一个仅适用于当前处于鼠标光标下的 `menu` 类元素。`.menu`\
  \ 和 `.menu:hover` 规则中的属性设置将覆盖 `div` 规则中的性设置：\n\n```css\ndiv {...}\n.menu {...}\n\
  .menu:hover{...}\n```\n\n表 4.1 提供了若干类型选择器的列表；它展示了一个示例并描述了选择器如何工作。你可以使用选择器实现许多比前面的示例和\
  \ 表 4.1 中显示的更多的功能，但这些应该让你对我们在书中后续练习中如何使用选择器有一个概念。\n\n![Image](img/image00825.jpeg)![Image](img/image00826.jpeg)\n\
  \n**表 4.1 一些常用 CSS 选择器列表**\n\n## 使用 CSS 设计属性\n\n大多数 CSS 属性都旨在改变 HTML 元素的外观。遗憾的是，默认的\
  \ HTML 元素看起来非常单调。然而，通过添加颜色、边框、背景、图像和其他设计属性，你只需要少量 CSS 代码就能极大改变 HTML 元素的外。\n\n接下来的章节涵盖了改变\
  \ HTML 组件外观的 CSS 属性。\n\n### CSS 颜色\n\n通过 CSS 应用的最频繁的设置之一是 `color` 属性。大多数元素都有 `color`\
  \ 属性，定义了浏览器渲染它们时使用的颜色——例如，表格边框、列表符号或段落中的文本字符。\n\n你可以使用几种方法来设置精确的颜色，以支持定义颜色者的不同背景和情况。颜色值可以通过以下方法之一指定：\n\
  \n![Image](img/image00767.jpeg) **Name**——CSS 颜色名称，如 `red`、`blue`、`green` 或 `yellow`。有\
  \ 147 个预定义的颜色名称，例如 `aqua`、`crimson` 和 `silver`。你可以在 [www.w3.org/TR/css3-color/#svg-color](http://www.w3.org/TR/css3-color/#svg-color)\
  \ 找到颜色名称列表。\n\n![Image](img/image00767.jpeg) **Hex**——你可以指定一个十六进制数表示颜色中包含的红色、绿色和蓝色量。语法为\
  \ `#RRGGBB`。值 `00` 代表不包含该颜色，值 `FF` 代表包含该颜色。例如，红色是 `#FF0000`，绿色是 `#00FF00`，青色是 `#00FFFF`。\n\
  \n![Image](img/image00767.jpeg) **RGB**——与 Hex 类似，不同在于你可以指定 0 到 255 之间的值。例如，青色是\
  \ `rgb(0, 255, 255)`。\n\n![Image](img/image00767.jpeg) **RGBA**——与 RGB 相同；但你还可以指定一个控制透明度的\
  \ alpha 参数，`0.0` 为完全透明，`1.0` 为不透明。例如：`rgba(0, 255, 255, 0.5)` 是透明度 50% 的青色。\n\n\
  ![Image](img/image00767.jpeg) **HSL**——允许你根据色相/饱和度/亮度色彩方案来指定颜色。例如，色相为 `100`、饱和度为\
  \ `45%`、亮度为 `75%` 的颜色将是 `hsl(100, 45%, 75%)`。\n\n![Image](img/image00767.jpeg) **HSLA**——与\
  \ HSL 相同，但你还可以指定一个控制透明度的 alpha 参数，`0.0` 为完全透明，`1.0` 为不透明。例如：`hsla(100, 45%, 75%,\
  \ 0.5)`。\n\n## 动手尝试：通过 CSS 应用文本样式\n\nCSS 提供了几个属性，允许你定义文本的外观。以下是你可能会处理的一些较常用的属性：\n\
  \n`color`: 设置文本颜色。\n`font-family`: 指定字体（例如 `serif`、`sans-serif`）。\n`font-style`:\
  \ 设置字体样式（例如 `italic`）。\n`font-weight`: 设置字符的粗细（例如 `bold`）。\n`font-size`: 设置文本大小。\n\
  `text-align`: 设置水平对齐方式（例如 `left`、`center`、`right`）。\n\n`text-decoration`: 添加下划线等装饰。\n\
  `text-transform`: 控制大小写（例如 `uppercase`）。\n`line-height`: 设置行高。\n`letter-spacing`:\
  \ 设置字符间距。\n`word-spacing`: 设置单词间距。\n\n\n\n\n\n![Image](img/image00767.jpeg) `line-height`—允许你控制行与行之间的空间。你可以指定一个数值，该数值将乘以文本高度；或者使用带有\
  \ `em`/`px`/`pt`/`cm` 后缀的数值作为大小；或者使用代表行高百分比的 `%`。图 4.5 显示了使用以下 CSS 设置将行间距紧凑到只有正常高度的\
  \ 50% 的示例：\n\n```css\n#half-height{line-height:50%}\n```\n\n![Image](img/image00830.jpeg)\n\
  \n**图 4.5** 将行高更改为 50% 会使文本行变得紧凑。\n\n![Image](img/image00767.jpeg) `text-decoration`—允许你使用\
  \ `overline`、`underline` 或 `line-through` 值在文本下方、上方或穿过文本添加一条线。你也可以指定 `blink` 为值，使文本在浏览器中闪烁。以下\
  \ CSS 代码将使元素渲染出下划线和删除线，如图 4.6 所示：\n\n点击此处查看代码图像\n\n```css\n#underline{text-decoration:underline;}\n\
  #strike-through{text-decoration:line-through;}\n```\n\n![Image](img/image00831.jpeg)\n\
  \n**图 4.6** 将文本更改为下划线或删除线。\n\n![Image](img/image00767.jpeg) `text-indent`—允许你通过特定值（如\
  \ 20px）或元素宽度的百分比（如 20%）来指定文本第一行的缩进量。\n\n![Image](img/image00767.jpeg) `text-transform`—允许你使用以下值更改文本的大小写：`capitalize`\
  \ 将每个单词的首字母大写，`uppercase` 使文本全部大大写，或 `lowercase` 移除所有大写字母。\n\n![Image](img/image00767.jpeg)\
  \ `text-overflow`—允许你定义当文本宽元素允许的尺寸时发生的情况。选项有 `clip` 直接截断文本，`ellipsis` 添加 `...` 表示被截断的文本，或者添加一个用于替换截断文本的字符串。例如，以下\
  \ CSS 代码将在文本过长时将其截断，并在末尾附加字符串“`(more)`”：\n\n点击此处查看代码图像\n\n```css\n#overflow{text-overflow:\"\
