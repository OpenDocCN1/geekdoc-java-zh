  \ 服务器提供一个模拟的数据库访问服务。列表 28.5 实现了一个 Node.js Web 服务器，它处理以下 `GET` 和 `POST` 路由，用于获取和设置用户对象以及表格数据数组，以模拟向远程数据库服务发送请求：\n\
  \n- `/get/user`：返回用户对象 JSON 版本的 `GET` 路由。\n- `/get/data`：返回表格数据数组 JSON 版本的 `GET`\
  \ 路由。\n- `/set/user`：接受请求体中用户对象的 `POST` 路由，并更新服务器上的对象以模拟用户对象。\n- `/set/data`：接受请求体中对象数组的\
  \ `POST` 路由，并更新 `data` 变量以模拟。\n\n（注：原文后续部分存在大量字符重复与乱码，已根据技术逻辑完成核心翻译。）\n\n\n\n\n\
  ```javascript\napp.post('/set/user', function(req, res){\n  console.log(req.body.userData);\n\
  \  user = req.body.userData;\n  res.json({ data: user, status: \"User Updated.\"\
  \ });\n});\n\napp.post('/set/data', function(req, res){\n  data = req.body.data;\n\
  \  res.json({ data: data, status: \"Data Updated.\" });\n});\n\napp.listen(80);\n\
  ```\n\n* *\n\n#### 4. 在列表 28.6 中添加代码，实现一个名为 `dbAccess` 的模块和一个名为 `DBService` 的自定义服务。创建服务对象的\
  \ `DBAccessObj()` 函数提供了 `getUserData()` 和 `updateUser()` 方法，用于通过 `$http` 请求从服务器检索和更新用户对象。`getData`\
  \ 和 `updateData()` 方法为表格数据提供了类似的功能。注意如何使用 `$q` 服务来推迟 `$http` 请求的响应，因为请求不会立即返回。\n\
  \n**列表 28.6 service_custom_db_access.js 实现一种利用 $http 和 $q 服务与存储在服务器上的数据交互的自定义 AngularJS\
  \ 服务**\n\n点击此处查看代码图片\n\n* *\n\n```javascript\nvar app = angular.module('dbAccess',\
  \ []);\n\nfunction DBAccessObj($http, $q) {\n  this.getUserData = function(){\n\
  \    var deferred = $q.defer();\n    $http.get('/get/user')\n    .success(function(response,\
  \ status, headers, config) {\n      deferred.resolve(response);\n    });\n    return\
  \ deferred.promise;\n  };\n  this.updateUser = function(userInfo){\n    var deferred\
  \ = $q.defer();\n    $http.post('/set/user', { userData: userInfo}).\n    success(function(response,\
  \ status, headers, config) {\n      deferred.resolve(response);\n    });\n    return\
  \ deferred.promise;\n  };\n  this.getData = function(){\n    var deferred = $q.defer();\n\
  \    $http.get('/get/data')\n    .success(function(response, status, headers, config)\
  \ {\n      deferred.resolve(response);\n    });\n    return deferred.promise;\n\
  \  };\n  this.updateData = function(data){\n    var deferred = $q.defer();\n   \
  \ $http.post('/set/data', { data: data}).\n    success(function(response, status,\
  \ headers, config) {\n      deferred.resolve(response);\n    });\n    return deferred.promise;\n\
  \  };\n}\napp.service('DBService', ['$http', '$q', DBAccessObj]);\n```\n\n* *\n\n\
