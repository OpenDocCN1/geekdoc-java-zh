  ```\n\n### 在 jQuery 中添加页面元素\n\n现在你可以查看如何在 jQuery 中添加新元素。你可以通过使用 `.html()` 方法在 jQuery\
  \ 中应用与 JavaScript 相同的 `innerHTML` 快捷方法，该方法可以获取或设置 `innerHTML` 字符串。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#myDiv\").html(\"<p>Paragraph 1 goes here</p>\");\n```\n\n\
  然而，这种方法具有相同的局限性，应该谨慎使用。更好的方法是创建一个新的 jQuery 对象并将其附加。以下代码将带你完成这一过程。第一步是通过向 jQuery\
  \ 对象 `$` 传递标签名或 HTML 字符串来创建对象。例如，以下语句在集合中创建一个包含一个 `<p>` 元素的新 jQuery 对象：\n\n```javascript\n\
  var newP = $(\"<p></p>\");\n```\n\n然后你可以使用以下代码为段落添加文本：\n\n点击此处查看代码图片\n\n```javascript\n\
  newP.html(\"Paragraph 1 goes here\");\n```\n\n然后你可以使用 `.append(jQueryObject)` 将元素附加到一个或多个现有元素中。例如，以下代码将段落添加到所有的\
  \ `<div>` 元素中：\n\n```javascript\n$(\"div\").append(newP);\n```\n\n为了说明这一点，以下代码创建了一个包含\
  \ `<img>` 元素的新 jQuery 对象，并将其添加到所有 `<li>` 元素中：\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ newImg = $(\"<img></img>\");\n\nnewImg.attr(\"src\", \"images/sunset.jpg\");\n\
  \nnewImg.height(30);\n\n$(\"li\").append(newImg);\n```\n\njQuery 还提供了 `.appendTo(target)`\
  \ 方法，允许你将一个对象附加到另一个对象。它的工作与 `.append()` 相同，但方向相反。该方法是从子对象而不是新的父对象调用的。例如，上一个示例中的\
  \ `newImg` 对象可以使用以下语句替代：\n\n```javascript\nnewImg.appendTo(\"li\");\n```\n\n###\
  \ 移除页面元素\n\n可以通过可以通过移除元素。最基本的方法是获取父对象，然后对 DOM 对象设置 `domObj.innerHTML = \"\"` 或对\
  \ jQuery 对象调用 `jObj.html(\"\")`。这会清除父元素内部的所有内容，从而移除任何子元素。\n\n尝试设计你的 HTML 组件，以便能够使用\
  \ `.html(\"\")` 方法移除元素，因为这让清理代码变得简单。另一个优势是向容器添加新元素变得更容易，因为你不需要处理已有的元素。\n\n在 JavaScript\
  \ 中，你也可以在父元素上调用 `.removeElement(child)`。例如，以下代码获取一个 `id=\"container\"` 的元素，然后移除\
  \ `id=\"paragraphA\"` 的子元素：\n\n点击此处查看代码图片\n\n```javascript\nvar parent=document.getElementById(\"\
  container\");\n\nvar child=document.getElementById(\"paragraphA\");\n\nchild.parentNode.removeChild(child);\n\
  ```\n\njQuery 提供了两种移除元素的方法。第一个是 `.empty()`，它等同于 `.html(\"\")`。使用 `.empty()`，所有的子元素和文本将被移除。第二个方法是\
  \ `.remove([selector])`，它仅根据原始查询和可选的 `selector` 移除元素。\n\n如果没有指定选择器，将移除原始查询的元素。例如，要移除所有的\
  \ `<div>` 元素，请使用以下语句：\n\n```javascript\n$(\"div\").remove()\n```\n\n如果指定了选择器，原始查询中匹配选择器的子元素将被移除。例如，要移除\
  \ `<div>` 元素内部的 `<p>` 元素，请使用：\n\n```javascript\n$(\"div\").remove(\"p\");\n```\n\
  \njQuery 还提供了一个在移除元素时非常有用的额外方法：`.detach([selector])` 方法。detach 方法的工作方式与 `.remove([selector])`\
  \ 方法相同，但有一个重要的区别：即使元素从父元素中移除，实际的元素 DOM 数据也不会被删除。你仍然在现有的 jQuery 对象中拥有这些元素，并将它们重新插入\
  \ DOM 的其他位置。\n\n例如，以下代码从一个元素中分离所有段落并将它们添加到另一个中：\n\n点击此处查看代码图片\n\n```javascript\n\
  var ps = $(\"#div1\").detach(\"p\");\n\nps.appendTo(\"#div2\");\n```\n\n### 在 jQuery\
  \ 中替换元素\n\n正如你在之前的章节中看到的，你可以轻松通过 jQuery 添加和移除元素。你还需要了解如何替换元素。\n\n你可以使用三种方法来替换 jQuery\
  \ 中的元素。最简单的是使用 `.html()`。jQuery 中的 `.html()` 方法对于替换现有元素的内容非常有用。`.html()` 方法接受一个字符串或一个对象。例如，以下语句将所有\
  \ `<div>` 元素的内容替换为段落：\n\n点击此处查看代码图片\n\n```javascript\n$(\"div\").html(\"<p>New Paragraph</p>\"\
  );\n```\n\n另一种替换集合的方法是使用 `.replaceAll(target)`。该方法替换匹配 `target` 选择器的元素。例如，要将 `parentB`\
  \ 替换为 `parentA` span 元素，你可以使用：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#parentA span\"\
  ).replaceAll(\"#parentB\");\n```\n\n最后的方法是使用 `.replaceWith(newContent)`，它与 `.replaceAll()`\
  \ 相。`.replaceWith()` 使用指定的内容替换元素。例如，要将所有的 `<div>` 元素替换为一个空的 `<div>`，你可以使用：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"div\").replaceWith(\"<div>\");\n```\n\n### 在 jQuery 中插入元素\n\
  \njQuery 的另一个重要功能是可以轻松向现有内容插入元素。你已经学会了如何在末尾添加项目；但如果你想在中间插入内容呢？`.before()` 和 `.after()`\
  \ 方法就派上用场了。\n\n`.after(content [,content])` 方法允许你指定一个插入到当前 jQuery 对象集合中每个元素之后的元素。例如，要在文档中的第三个\
  \ `<p>` 元素之后插入新段落，将使用以下代码：\n\n点击此处查看代码图片\n\n```javascript\n$(\"p:eq(2)\").after(\"\
  <p>New Fourth Paragraph</p>\");\n```\n\n`.before(content [,content])` 方法允许你指定一个插入到当前\
  \ jQuery 对象集合中每个元素之前的元素。例如，要在文档中的第三个 `<p>` 元素之前插入新段落，将使用以下代码：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"p:eq(2)\").before(\"<p>New Third Paragraph</p>\");\n```\n\n\n\
  \n\n\n富交互网页网页的一个非常重要的部分是良好的 CSS 设计。JavaScript 和 jQuery 可以通过动态向元素添加和移除类（classes）来增强\
  \ CSS 设计。\n\njQuery 让添加、移除和切换类变得极其简单。如果你将 CSS 代码设计得当，就可以非常容易地应用一些精美的效果。\n\n使用 `.addClass(className)`\
  \ 方法添加类。例如，要为所有 `<span>` 元素添加名为 `active` 的类，你可以使用以下语句：\n\n点击此处查看代码图片\n\n```\n$(\"\
  span\").addClass(\"active\");\n```\n\n使用 `.removeClass([className])` 方法移除类。例如，要从\
  \ `<span>` 元素中移除 active 类，你将调用以下代码：\n\n点击此处查看代码图片\n\n```\n$(\"span\").removeClass(\"\
  active\");\n```\n\n你也可以使用不带 `className` 的 `remove`，这会移除元素上的所有类。例如，以下语句会移除 `<p>`\
  \ 元素上的所有类：\n\n```\n$(\"p\").removeClass();\n```\n\n你还可以使用 `.toggleClass(className\
  \ [, switch])` 方法切换类的开启和关闭。除了 `className` 外，你还可以为可选的 `switch` 参数指定 `true` 或 `false`，表示开启或关闭类。\n\
  \n例如，要关闭所有 `<span>` 元素的 active 类和 inactive 类，代码如下：\n\n点击此处查看代码图片\n\n```\n$(\"span\"\
  ).toggleClass(\"active\", true);\n$(\"span\").toggleClass(\"inactive\", false);\n\
  ```\n\n### 切换可见性\n\n改变网页外观的一种简单方法是切换元素的可见性。你可以通过将 JavaScript 中的 `style.display`\
  \ 属性设置为 `\"none\"` 或 `\"\"` 来实现这一点；然而，jQuery 提供了更优雅且扩展性更好的解决方案。\n\n要使用 jQuery 显示元素，调用该对象的\
  \ `.show()` 方法。要隐藏元素，则使用 `.hide()` 方法。就如此简单。例如，要隐藏名为 `jObj` 的对象，使用以下语句：\n\n```\n\
  jObj.hide();\n```\n\n要再次显示它，使用以下代码：\n\n```\njObj.show();\n```\n\n`.hide()` 的一个问题是，在应用之后元素将不再占据任何页面空间。这可能是你想要的，或者在某些情况下，你可能只想让元素不可见但仍占据空间。要让元素不可见，将\
  \ `opacity` CSS 属性设置为 0。例如：\n\n```\njObj.css(\"opacity\", \"0\");\n```\n\n要让元素再次可见，将\
  \ `opacity` 设回 1：\n\n```\njObj.css(\"opacity\", \"1\");\n```\n\n**提示**\n将透明度设置得较低但不设为\
  \ 0，是显示元素当前未激活但仍显示它们的极佳方法。例如，你可以将尚未实现和激活的菜单和按钮元素设置为 `.5` 透明度，这样它们仍然显示，但显然是不可点击的。\n\
