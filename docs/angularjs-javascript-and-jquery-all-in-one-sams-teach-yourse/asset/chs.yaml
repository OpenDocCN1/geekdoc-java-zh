  \n## 数组 (Array)\n\n`Array` 对象提供了一种和处理一组其他对象的方法。数组可以存储数字、字符串或其他 JavaScript 对象。你可以使用几种方法来创建\
  \ JavaScript 数组；例如，以下语句创建了三个相同的数组版本：\n\n点击此处查看代码图像\n\n```javascript\nvar arr = [\"\
  one\", \"two\", \"three\"];\nvar arr2 = new Array();\narr2[0] = \"one\";\narr2[1]\
  \ = \"two\";\nvar arr3 = new Array();\narr3[2] = \"three\";\narr3.push(\"one\");\n\
  arr3.push(\"two\");\narr3.push(\"three\");\n```\n\n要获取数组中的元素数量，可以使用 `Array` 对象的\
  \ `length` 属性。例如：\n\n```javascript\nvar numOfItems = arr.length;\n```\n\n数组是基于零索引的，这意味着第一个项位于索引\
  \ 0，依此类推。你可以通过相减使用 `length` 属性来反向访问数组。例如，在以下代码中，变量 `first` 的值将是 Monday，变量 `last`\
  \ 的值将是 Friday：\n\n点击此处查看代码图像\n\n```javascript\nvar week = [\"Monday\", \"Tuesday\"\
  , \"Wednesday\", \"Thursday\", \"Friday\"];\nvar first = week[0];\nvar last = week[week.length-1];\n\
  ```\n\n`Array` 对象有几个内置函数，允许你以各种方式访问和操作数组。表 6.4 描述了附加到 `Array` 对象上的方法。为了帮助你上手 `Array`\
  \ 对象提供的功能，以下章节描述了一些常见任务：\n\n### 合并数组\n\n你可以像合并 `String` 对象一样合并数组，使用 `+` 语句或使用 `concat()`\
  \ 方法。在以下代码中，`arr3` 最终变为了 `arr4`：\n\n```javascript\nvar arr1 = [1,2,3];\nvar arr2\
  \ = [\"three\", \"four\", \"five\"];\nvar arr3 = arr1 + arr2;\nvar arr4 = arr1.concat(arr2);\n\
  ```\n\n> 你可以合并一个数字数组和一个字符串数组。数组中的每个项将保留其对象类型。然而，当你使用数组中的项时，你需要跟踪这些项。\n\n### 遍历数组\n\
  \n你可以使用 `for` 循环或 `for/in` 循环遍历数组。以下代码演示了如何遍历数组中的每个项：\n\n```javascript\nweek = [\"\
  Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\nfor (var i=0;\
  \ i<week.length; i++){\n    document.write(week[i] + \"<br>\");\n}\nfor (dayIndex\
  \ in week){\n    document.write(week[dayIndex] + \"<br>\");\n}\n```\n\n### 将数组转换为字符串\n\
  \n`Array` 对象的一个有用功能是可以使用特定分隔符将元素组合成 `String` 对象。例如，以下代码形成格式 12:10:36：\n\n```javascript\n\
  var timeArr = [12,10,36];\nvar timeStr = timeArr.join(\":\");\n```\n\n### 检查数组是否包含项\n\
  \n通常你需要检查数组是否包含某个项。你可以通过使用 `indexOf()` 方法来实现。如果在数组中未找到项，将返回 `-1`。以下函数在项位于 `week`\
  \ 数组时会写入消息：\n\n```javascript\nfunction message(day){\n    var week = [\"Monday\"\
  , \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\n    if (week.indexOf(day)\
  \ != -1){\n        document.write(\"Happy \" + day);\n    }\n}\n```\n\n### 向数组添加和移除项\n\
  \n你可以使用多种方法向 `Array` 对象中添加或移除项。表 6.5 提供了书中使用的各种方法的思路。\n\n## 动手尝试：创建和操作数组\n\n在这个练习中，你将学习使用附加到\
