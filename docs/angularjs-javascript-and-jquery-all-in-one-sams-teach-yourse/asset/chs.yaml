  ```\n\n* * *\n\n###  18.8 resizable_elements.js 使用 jQuery 和 jQuery UI 实现页面元素的缩放与移动\n\
  \n点击此处查看代码图像\n\n* * *\n\n```javascript\n$(document).ready(function(){\n  $(\"#resize1,\
  \ #resize2, #resize3\").draggable();\n  $(\"#resize1\").resizable(\n    {aspectRatio:true,\
  \ alsoResize:\"#resize1 img\" });\n  $(\"#resize2\").resizable(\n    {alsoResize:\"\
  #resize2 img\"});\n  for(var i=0; i<100; i++){\n    $(\"#list\").append($(\"<p></p>\"\
  ).html(\"Item \"+i)); }\n  $(\"#resize3\").resizable(\n    {alsoResize:\"#resize3\
  \ #list\", handles:\"n,s,e,w\"});\n});\n```\n\n* * *\n\n###  18.9 resizable_elements.css\
  \ 样式化页面 CSS 代码\n\n点击此处查看代码图像\n\n* * *\n\n```css\nimg {\n  width:230px; }\n#resize1,\
