  \ 或 `$interval` 创建了超时或间隔，你必须在 `scope` 或 `elements` 指令被销毁时，使用 `cancel()` 显式地销毁它们。最简单的方法是向\
  \ `$destroy` 事件添加监听器。例如：\n\n点击此处查看代码图片\n\n```javascript\n$scope.$on('$destroy',\
  \ function(){\n  $scope.cancel(myInterval);\n});\n```\n\n### 使用 $animate 服务\n\n\
  `$animate` 服务提供了动画检测钩子，你可以在执行进入（enter）、离开（leave）、移动（move）DOM 操作以及 `addClass` 和 `removeClass`\
  \ 操作时使用。你可以通过 CSS 类名或 AngularJS 中的 `$animate` 服务来使用这些钩子。\n\n要实现动画，你需要向想要动画的元素上添加一个支持动画的指令。表\
  \ 27.3 列出了支持动画的指令以及它们所支持的动画事件类型。\n\n![Image](img/image01043.jpeg)\n\n**表 27.3 支持动画的\
  \ AngularJS 指令**\n\n#### 在 CSS 中实现动画\n\n要在 CSS 中实现动画，你需要在想要动画的元素中包含 `ngClass` 指令。AngularJS\
  \ 使用 `ngClass` 的值作为附加 CSS 类的根名称，这些类将在动画期间被添加到元素并从元素中移除。\n\n在定义了 `ngClass` 指令的元素上会调用动画事件。表\
  \ 27.4 列出了在动画过程中添加和移除的附加类。\n\n![Image](img/image01044.jpeg)\n\n**表 27.4 在动画期间自动添加和移除的\
  \ AngularJS 指令**\n\n要实现基于 CSS 的动画，你需要为表 27.4 中列出的附加类添加相应的 CSS 过渡代码。为了说明这一点，以下代码段为名为\
  \ `.img-fade` 的用户定义类实现了添加类和移除类的过渡，该类会使图片的 `opacity`（透明度）在 2 秒内动画变为 `.1`：\n\n点击此处查看代码图片\n\
  \n```css\n.img-fade-add, .img-fade-remove {\n  -webkit-transition:all ease 2s;\n\
  \  -moz-transition:all ease 2s;\n  -o-transition:all ease 2s;\n  transition:all\
  \ ease 2s;\n}\n.img-fade, .img-fade-add.img-fade-add-active {\n  opacity:.1;\n}\n\
  ```\n\n注意，过渡效果被添加到 `.img-fade-add` 和 `.img-fade-remove` 类中，但实际的类定义被应用于 `.img-fade`。你还需要类定义\
  \ `.img-fade-add.img-fade-add-active` 来设置过渡的结束状态。\n\n#### 在 JavaScript 中实现动画\n\n\
  实现 AngularJS CSS 动画非常简单，但你也可以使用 jQuery 在 JavaScript 中实现动画。JavaScript 动画对你的动画提供了更直接的控制。此外，JavaScript\
  \ 动画不需要浏览器支持 CSS3。\n\n要在 JavaScript 中实现动画，你需要在加载 `angular.js` 库之前，在你的模板中包含 jQuery\
  \ 库。例如：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://code.jquery.com/jquery-1.11.0.min.js\"\
  ></script>\n```\n\n#### 顺便说\n\n如果你希望能够利用 jQuery 动画的完整功能，则包含整个 jQuery 库是必要的。如果你决定包含\
  \ jQuery 库，请确保它在 HTML 代码中加载于 AngularJS 库之前加载。\n\n你还需要在应用程序的 `Module`（模块）对象定义中包含\
  \ `ngAnimate` 依赖。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp',\
  \ ['ngAnimate']);\n```\n\n你可以在 `Module` 对象上使用 `animate()` 方法来实现动画。`animate()` 方法返回一个对象，该对象为你想要处理的\
  \ `enter`、`leave`、`move`、`addClass` 和 `removeClass` 事件提供了函数。这些函数将要动画的元素作为第一个参数传递。你可以使用\
  \ `animate()` 方法来动画元素。\n\n`animate()` 方法使用以下语法：`cssProperties` 是一个对象，`duration`\
  \ 以毫秒为单位，`callback` 是要执行的函数：\n\n例如，以下代码通过将 `opacity` 设置为 `0` 来动画 `fadeClass`：\n\n\
  ```javascript\napp.animation('.fadeClass', function() {\n  return {\n    addClass\
  \ : function(element, className, done) {\n      jQuery(element).animate({ opacity:\
  \ 0);\n    }\n  };\n});\n```#### 自己尝试：使用 AngularJS 动画元素\n\n在这个练习中，你有机会使用 AngularJS\
  \ 以及 jQuery 实现动画。此练习的目的是展示每个方法 27.7、27.8 和 27.9 如何实现一个对图片应用淡入/淡出动画的基本示例，使用 JavaScript\
  \ 方法并使用 CSS 过渡处理图片。\n\n按照以下步骤构建 AngularJS 应用程序：\n\n1. 添加 `27/service_animation.html`、`27/service_animation.js`\
  \ 和 `27/service_animation.css` 文件。\n2. 将[27.7]、[27.8] 和 [27.9]所示的代码添加到 HTML、JavaScript\
  \ 和 CSS 文件中。\n3. 下行代码将 AngularJS 动画服务注入到应用程序中以便使用：\n4. 下述几行代码使用应用程序上的 `animate()`\
  \ 方法实现淡入和淡出动画。注意，同一个类 `.fadeOut` 被用于应用淡入和淡出动画，通过钩入 `addClass` 和 `removeClass` 事件，然后对元素的透明度使用\
  \ `jQuery.animate()` 方法。\n\n\n\n\n\n## 5. 下面来自代码列表 27.9 的 CSS 代码通过在给元素分配 `shrink`\
  \ 和 `grow` 类时，对类 `–add` 和 `–add-active` 的 AngularJS 类切换应用 CSS 动画，实现了图像收缩和放大的动画：\n\
