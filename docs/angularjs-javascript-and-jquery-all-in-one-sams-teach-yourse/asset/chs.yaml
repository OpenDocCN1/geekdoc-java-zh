  \ *\n\n### 创建日历输入（Calendar Input）\n\njQuery 提供的日期选择器小组件（datepicker widget）允许你实现一个日历界面，允许用户通过简单的点击来选择特定日期。这可以在用户手动输入日期错误时避免很多问题。\n\
  \n日期选择器小组件附加到 `text`、`date` 或 `datetime <input>` 元素。当用户点击 `<input>` 时，会显示日历。你还可以添加图标图像来启动日期选择器。\n\
  \n列表 19.4 中的代码创建一个带有图像图标的日期。视觉效果可以在 图 19.4 中看到。以下设置说明了一些可用选项：\n\nonSelect—指定每次选择新日期时都会调用的函数。\n\
  \nshowOn—设置为“button”，以便在点击按钮图标时启动日期选择器。\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ `buttonImage`—指定要使用的图像文件位置。\n\n![Image](img/image00767.jpeg) `buttonImageOnly`—当为\
  \ `true` 时，只有点击按钮图标时才会启动日期选择器，而不是点击 `<input>`。\n\n![Image](img/image00767.jpeg)\
  \ `numberOfMonths`—指定显示的月份数。\n\n![Image](img/image00767.jpeg) `showButtonPanel`—当为\
  \ `true` 时，在日期选择器底部显示“今天”和“完成”按钮。\n\n![Image](img/image00767.jpeg) `dateFormat`—描述放置在\
  \ `<input>` 字段中格式的字符串。\n\n![Image](img/image00980.jpeg)\n\n**图 19.4** 在日期输入框中添加日期选择器。\n\
