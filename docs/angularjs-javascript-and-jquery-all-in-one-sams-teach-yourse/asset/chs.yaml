  9. 回到 Chrome 并刷新网页。\n10. 点击 `Click Me` 文本。错误应该已经解决了。\n\n### 调试 HTML 元素\n\n元素检查器（Element\
  \ inspector）允许你查看 HTML 结构并调试问题。可用功能如下：\n\n### DOM Tree\n这是树的简单视图。你可以点击箭头图标来展开和收叠树的部分。\n\
  \n### 更改断点（Break on Changes）\n右键点击元素并选择 `Break On`（断点）允许你在元素更改、删除或子元素被修改时设置不同类型的断点。每当\
  \ DOM 元素更改时，浏览器将中断。\n\n### 编辑为 HTML（Edit as HTML）\n右键点击元素并选择 `Edit as HTML` 允许你直接编辑浏览器中的\
  \ HTML 代码。虽然这不会更改项目中的代码，但使用此功能进行测试要方便得多。\n\n### 悬停（Hover）\n当你悬停在 DOM 树中的 HTML 代码上时，元素会在浏览器中突出显示。元素检查器的悬停功能是我最喜欢的功能之一，因为它提供了一种视觉方式来查看\
  \ DOM 树节点与渲染网页之间的关系。注意图 2.6，当悬停在 `h1` 元素上时，标题会在网页中突出显示。\n\n### 面包屑（Breadcrumbs）\n\
  面包屑显示了从根节点 `html` 到当前在树或编辑视图中选中节点的层级结构。这使得导航变得简单，特别是在编辑视图中。\n\n**注意**\n当悬停在 DOM\
  \ 树上的元素时，该元素会在网页上突出显示。悬停高亮是颜色编码的，浅蓝色表示内容，紫色表示内边距（padding），黄色表示 HTML 元素的外边距（margin）。\n\
  \n\n\n\n为了说明如何使用元素检查器（Element inspector），请考虑列表 2.2 中的代码。一个包含电影列表且标题中带有“Favorite（收藏）”一词的基础\
  \ HTML 文档应该是斜体。然而，请看图 2.7 中的渲染版本。显然存在一些问题：所有内容都是斜体，且第一个列表项没有项目符号。这些问题是由整个文本中的仅两个字符引起的。\n\
