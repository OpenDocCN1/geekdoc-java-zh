  \ `Finish`（完成）。\n3. 右键点击新文件夹，并从菜单中选择 `New`（新建）、`File`（文件）。\n4. 将文件命名为 `js_errors.html`。\n\
  5. 输入列表 2.1 的内容，或者如果你有网站上的文件，将其内容剪切并粘贴到新文件中。\n6. 保存文件。\n\n***\n\n**列表 2.1 js_errors.html\
