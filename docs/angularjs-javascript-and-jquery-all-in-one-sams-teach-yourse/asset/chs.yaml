  \n# 第四部分：利用 jQuery UI\n\n## 第 16 ：介绍 jQuery UI\n\n在本节中将学习：\n\n![Image](img/image0767.jpeg)\
  \ 如何下载并添加 jQuery UI 库\n\n![Image](img/image0767.jpeg) 如何创建自定义 jQuery UI 主题\n\n![Image](img/image0767.jpeg)\
  \ jQuery UI 相比 de jQuery 提供的新功能\n\n![Image](img/image0767.jpeg) 使用 jQuery UI 选择器\n\
  \n![Image](img/image0767.jpeg) 如何使用 jQuery UI 动态定位 UI 元素\n\njQuery UI 是基于 jQuery\
  \ 之上的额外库。jQuery UI 的目的是提供一组可扩展的交互、效果、组件和主题，使得在网页中引入专业的 UI 元素变得更容易。在本节中，你将有机会在一些网页中下载并实现\
  \ jQuery UI。\n\n\n\n\n\njQuery UI 由 JavaScript 和 CSS 两部分组成。jQuery UI 的 JavaScript\
  \ 部分扩展了 jQuery，添加了用于添加 UI 元素或对这些元素应用效果的特定功能。jQuery UI 的 CSS 部分对页面元素进行样式处理，使得开发者不需要都为元素设置样式。\n\
  \njQuery UI 通过提供预构建的 UI 元素（如日历和菜单）以及拖放、调整大小等交互功能，为开发者节省了时间。接下来的章节将向你介绍该库；你将学习如何下载它并将其应用于你的项目中。\n\
  \njQuery UI 库由几个组件组成，用于构建、管理和与网页上的 UI 元素交互。这些元素可以分为以下类：\n\n![Image](img/image00767.jpeg)\
  \ **JavaScript**——jQuery UI 自带一个 `.js` 文件，它挂接到主 jQuery 库。该文件必须与 jQuery 一起加载到网页中，以实现\
  \ jQuery UI 组件。\n\n![Image](img/image00767.jpeg) **CSS**——jQueryUI 包含了几个 css 文件。主文件是\
  \ `jquery-ui.css`。这些文件包含了与 jQuery UI 相关的所有 CSS 设置，特别是针对代表的主题。\n\n![Image](img/image00767.jpeg)\
  \ **Images**——jQuery 还提供了几张用于构建某些 UI 组件的。\n\n## 获取 jQuery UI 库\n\n你可以通过两种方式之一在项目中实现\
  \ jQuery UI。如果你想使用已经提供的特定主题，可以在 [`code.jquery.com`](https://code.jquery.com) 上的\
  \ jQuery CDN 位置的 jQuery UI 部分选择其中一个主题。\n\n例如，以下代码从 jQuery CDN 位置加载了 jQuery UI 库和\
  \ Smoothness 主题：\n\n点击此处查看代码图片\n\n```\n<script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n\n<script type=\"text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"\
  ></script>\n\n<link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n```\n\n你也可以连同自定义主题一起下载库并存储在自己的 Web 服务器上。在这种情况下，你将使用自己的位置作为 `src` 和 `href` 属性，而不是使用\
  \ CDN 位置的 `jquery-ui.js` 和 `jquery-ui.css` 文件。\n\n你可以从以下位置下载 jQuery，通过选择图 16.1 所示的想要包含的选项，并点击底部的下载按钮。这将下载\
  \ jQuery UI 文件：\n\n[`http://jqueryui.com/download`](http://jqueryui.com/download)\n\
  \n![Image](img/image00946.jpeg)\n\n**图 16.1** 使用 jQuery UI 下载器构建并下载 jQuery UI 的自定义版本。\n\
  \n## 使用 ThemeRoller 创建自定义主题\n\n除了基础 jQuery UI 主题外，你还可以使用 jQuery UI ThemeRoller（如图\
  \ 16.2](#part0030.xhtml_ch16fig02)所示）选择某些不同的自定义主题或自定义你自己的主题。主题定义了应用于 jQuery UI 组件和元素的颜色、圆角以及其他多种样式。\n\
  \n![Image](img/image00947.jpeg)\n\n**图 16.2** 使用 jQuery UI ThemeRoller 定义自定义主题。\n\
  \n访问 jQuery UI ThemeRoller：\n\n**1.** 在你的浏览器中打开以下 URL：\n\n[`jqueryui.com/download/`](http://jqueryui.com/download/)\n\
  \n**2.** 滚动到图 16.1 所示下载页的底部，点击“Design a Custom Theme”（设计自定义主题）链接。这将弹出图 16.2 所示的\
  \ ThemeRoller。\n\n**3.** 选择 Gallery（画库）标签页并查看图 16.2 所示的预构建主题画库。\n\n**4.** 选择最符合你需求的画库。\n\
  \n**5.** 选择 Roll Your Own（自己制作）标签页（同样如图 16.2](#part0030.xhtml_ch16fig02)所示），并指定你想要定义的尽可能多的特定设置。\n\
  \n**6.** 点击 Download Theme（下载主题）按钮。这将带你回到主下载页面。\n\n**7.** 点击下载按钮下载 jQuery UI 文件。\n\
  \n***\n\n### 动手尝试：添加 jQuery UI\n\n使用以下步骤下载 jQuery UI 并将其添加到你的：\n\n**1.** 在 Eclipse\
  \ 中，创建 `lesson16`、`lesson16/js` 和 `lesson16/css` 文件夹。\n**2.** 创建 `lesson16/datepicker.html`。\n\
  **3.** 创建 `lesson16/js` 和 `lesson16/css` 文件夹。\n**4.** 以下行加载了 jQuery、jQuery UI 库以及\
  \ jQuery 的 smoothness 主题：\n\n点击此处查看图片\n\n```\n<script type=\"text/javascript\" src=\"\
  https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\n<script type=\"text/javascript\"\
  \ src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"></script>\n\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n```\n\n**5.** 以下行添加了一个 `<div>` 并为其分配了 `datepicker` ID：\n\n点击此处查看图片\n\n```\n<div\
  \ id=\"datepicker\"></div>\n```\n\n**6.** 以下 `ready()` 函数将 jQuery UI 添加到 `<div>`\
  \ 中：\n\n点击此处查看图片\n\n```\n$(document).ready(function(){\n    $(\"#datepicker\").datepicker();\n\
  });\n```\n\n**7.** 保存文件，然后在 浏览器中打开 HTML 文档，如图图 16.3 所示。如果库安装正确，你应该看到日期选择器。\n\n![Image](img/00948.jpeg)\n\
  \n**图 16.3** 简单的 jQuery UI 日期。\n\n**列表 16.1** datepicker.html 添加 jQuery 库并渲染日期的\
  \ HTML\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Calendar</title>\n\
  \    <meta charset=\"utf-8\">\n    <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n    <script type=\"text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"\
  ></script>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n    <script>\n        $(document).ready(function(){\n            $(\"#datepicker\"\
  ).datepicker();\n        });\n    </script>\n</head>\n<body>\n    <div id=\"datepicker\"\
  ></div>\n</body>\n</html>\n```\n\n\n\n\n\n要添加唯一 ID，可以使用 `.uniqueId()` 方法。该方法会检查集合中的每个元素，如果不存在\
  \ `id` 属性，则会添加一个。新 ID 将具有前缀 `\"ui-id-\"`。如果元素已经有了 `id` 属性，则不会对其进行修改。\n\n你稍后可以使用集合上的\
  \ `.removeUniqueId()` 方法来删除这些唯一 ID。只有通过 `.uniqueId()` 创建了 ID 的元素会受影响。\n\n例如，以下代码为所有\
  \ `<div>` 元素添加了 `id` 值，稍后将其移除：\n\n点击此处查看代码图像\n\n```\nvar divs = $(\"div\").uniqueId();\n\
  \n...\n\ndo something\n\n...\n\n$(\"div\"). removeUniqueId ();\n```\n\n### 获取 ScrollParent\n\
  jQuery UI 的另一个有用扩展是 `.scrollParent()` 方法。该方法会搜索元素的祖先，并返回第一个可滚的父元素。此方法仅适用于集合中包含单个元素的\
  \ jQuery 对象。\n\n### 获取 zIndex\njQuery UI 的另一个有用扩展是 `.zIndex()` 方法。该方法返回元素的数值型 `z-index`\
  \ 值（如果存在），或者返回具有该值的祖先。这让你能够快速确定页面上任何项目的堆叠位置。\n\n### 异步聚焦\njQuery UI 扩展了 jQuery 对象的\
  \ `.focus(delay [. callback])` 方法，允许在设置焦点之前设置一个 `delay`，并包含一个在元素获得焦点时执行的 `callback`\
  \ 函数。`delay` 以毫秒为单位。\n\n此功能具有广泛的用途，从使用计时器、自动选择表单元素，到强制元素重新聚焦。例如，以下代码在为元素 `#timedInput`\
  \ 设置焦点之前添加了半秒的延迟：\n\n点击此处查看代码图像\n\n```\n$(\"#timedInput\").focus(500, function(){\n\
  \  $(this).val(\"Enter Text Now\");\n});\n```\n\n### 在 jQuery UI 中使用新选择器\njQuery\
  \ UI 的一个非常强大的特性是它能够扩展已经非常详尽的 jQuery 选择器。这些新选择器可以更方便地针对 UI 元素的需求来缩小选择范围。接下来的章节将讨论每一个种新选择器。\n\
  \n#### 使用 :data() 选择器\n我最喜欢的 jQuery UI 选择器之一是 `:data()` 选择器。该选择器允许你根据使用 `.data()`\
  \ jQuery 方法添加到元素上的特定键（key）来过滤元素。例如，以下代码为所有 `<span>`, `<div>` 和 `<p>` 元素添加了 `color`\
  \ 值，然后使用 `:data()` 选择器在这些元素上设置相应的颜色：\n\n点击此处查看代码图像\n\n```\n$(p).data(\"color\",\
  \ \"red\");\n$(span).data(\"color\", \"blue\");\n$(div).data(\"color\", \"green\"\
  );\n\n$(\":data(color)\").each(function(){\n  $(this).css({color:$(this).data(\"\
  color\")});\n});\n```\n\n#### :focusable\n`:focusable` 选择器允许将元素限制为仅可以接收焦点的元素。例如，以下语句将更改限制为仅可以接收焦点的表单元素：\n\
  \n点击此处查看代码图像\n\n```\n$(\"form:focusable\").each(function(){\n  $(this).css({color:red});\n\
  });\n```\n\n#### :tabbable\n`:tabbable` 选择器类似于 `:focusable` 选择器。它允许将元素限制为仅可以通过 Tab\
  \ 键切换选择的元素。例如，以下语句将更改限制为仅可以通过 Tab 键切换选择的表单元素：\n\n点击此处查看代码图像\n\n```\n$(\"form:tabbable\"\
  ).each(function(){\n  $(this).css({color:red});\n});\n```\n这种过滤器非常有用，尤其是当你尝试排除禁用的元素时。\n\
  \n> 提示：具有负 tab index 的元素是 `:focusable` 但不是 `:tabbable`。\n\n### 尝试一下：基于数据值应用 jQuery\
