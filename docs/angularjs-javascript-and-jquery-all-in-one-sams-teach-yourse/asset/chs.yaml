  \n**图 9.3** 使用 jQuery 为 `<div>` 元素动态添加事件处理程序并响应点击。\n\n**列表 9.4** HTML 文件，加载 jQuery\
  \ 和 JavaScript，并为 `<h1>` 元素附加事件处理程序。\n\n\n\n\n\n除了使用 `addEventListener()` 方法添加事件处理器外，jQuery\
  \ 还提供了许多辅助函数，允许你设置事件处理器。这些辅助函数以事件命名，因此可以让你的代码看起来更整洁。\n\n这些辅助函数使用与 `addEventListener()`\
  \ 类似的语法，但不需要指定事件类型：\n\n点击此处查看代码图像\n\n.<event type>([ [eventData], handler(eventObject))`\n\
  \n`eventData` 参数是可选的，与 `addEventListener()` 一样，它会为事件对象设置 `data` 值。`handler` 参数是必须的，用于指定要调用的函数。将\
  \ `<event type>` 替换为表 9.3 列出的事件名称。例如，以下两个 jQuery 语句是为点击事件分配处理器的等方式：\n\n点击此处查看代码图像\n\
  \n```\nobj.click( dataObj, function myHandler(e){...});\nobj.addEventListener(\"\
