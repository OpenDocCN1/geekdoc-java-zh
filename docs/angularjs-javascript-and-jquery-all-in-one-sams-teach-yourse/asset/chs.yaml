  \n本节的目的是帮助你了解如何使用一些新的 HTML5 元素结合动态 jQuery 和 JavaScript 交互，通过趋势数据的视觉指示器来提供丰富的用户体验。数据可以来自多种来源，包括在网页上运行的\
  \ JavaScript 或通过 AJAX 请求收集的外部服务。在本节中，你将实现一系列折线图。折线图是一种微型图表，根据来自服务器的最新值频繁更新。折线图元素为你提供了一种很好的方法，展示如何使用新的\
  \ HTML 元素为用户提供数据的优秀视觉指示。接下来的章节将引导你完成折线图的过程。\n\n***\n\n### 动手尝试：使用简单的 JavaScript\
  \ 和 CSS 创建折线图\n\n该练习的目的是说明如何实现新的 HTML5 图形元素来为你的网页渲染实用组件。在练习中，你使用 `<canvas>` 元素来实现折线图，并使用\
  \ jQuery 和 JavaScript 动态更新它们。示例代码位于 14.16、14.17 和 14.18 中。\n\n使用以下步骤创建动态网页：\n\n\
  1. 在 Eclipse 中，创建 `lesson14/dynamic_sparkline.html`、`lesson14/js/dynamic_sparkline.js`\
  \ 和 `lesson14/css/dynamic_sparkline.css` 文件。\n2. 在 HTML 和 CSS 文件中添加 14.16 和 18 所示的代码。HTML\
  \ 和 CSS 非常基础。注意，这里只有 `<div>`、`<span>` 和 `<canvas>` 元素。\n3. 打开 `dynamic_sparkline.js`\
  \ 文件并添加以下 `.ready()` 函数，该函数填充用于折线图的数据并启动 `adjValues()` 定器。你还需要 14.17 所示的 `adjValues()`\
  \ 和 `getRandomArray()` 函数。这些函数填充并持续更新折线图的数据。使用 `.data()` 方法将数据存储在 `<div>` 元素中：\n\
  \n```javascript\n$(document).ready(function(){\n  $(\"div\").each(function(){\n\
  \    $(this).data(\"valueArr\", getRandomArray());\n  });\n  adjValues();\n});\n\
  ```\n\n4. 添加以下 `renderSpark()` 函数，它使用数据数组在 `<canvas>` 上绘制一系列线条。设置 `<canvas>` 的宽度会擦除当前的线条，以便绘制新的：\n\
  \n```javascript\nfunction renderSpark(c, lineValues){\n  c.width = c.width;\n  var\
  \ xAdj = c.width/lineValues.length;\n  var ctx = c.getContext(\"2d\");\n  ctx.fillStyle\
  \ = \"#000000\";\n  ctx.strokeStyle = \"#00ffff\";\n  ctx.lineWidth = 3;\n  var\
  \ x = 1;\n  ctx.moveTo(x,(c.height));\n  for (var idx in lineValues){\n    var value\
  \ = parseInt(lineValues[idx]);\n    ctx.lineTo(x+xAdj, (c.height - value));\n  \
  \  x += xAdj;\n  }\n  ctx.stroke();\n}\n```\n\n5. 保存所有三个文件，然后在浏览器中打开图 14.6 所示的 HTML\
  \ 文件。你应该看到折线图自动更新。\n\n![Image](img/035.jpeg)\n\n**图 14.6** 具有自动更新的折线图网页\n\n### 列表\
