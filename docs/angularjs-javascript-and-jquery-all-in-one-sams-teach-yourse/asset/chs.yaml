  \ `<div>` 部分。只要它们遵循相同的结构 `<<div>><input><<span>...</span></span></div>`，jQuery 代码\
  \ 就能作用于所有这些元素：\n\n点击此处查看代码图片\n\n```javascript\n07      $input.siblings(filter).css(\"\
  background-color\",\"blue\");\n```\n\n### 12. 保存文件并在 浏览器中打开 `traverse_dom.html`。注意，当你在文本框中输入内容时，`<span>`\
  \ 元素会变为蓝色以匹配输入的值。\n\n![图像](img/image00886.jpeg)\n\n**图 8.2** 一个简单的 JavaScript 网页，允许用户输入评分，并根据输入的值进行动态变化。\n\
  \n**列表 8.4 traverse_dom.html，用于加载 jQuery 和 JavaScript 并附加事件处理器元素以提供用户交互的 HTML 文件**\n\
  \n点击此处查看代码图片\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n03    <head>\n04      <title>Traversing\
  \ the DOM</title>\n05      <meta charset=\"utf-8\" />\n06      <script type=\"text/javascript\"\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07      <script\
  \ type=\"text/javascript\" src=\"js/traverse_dom.js\"></script>\n08      <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"css/traverse_dom.css\">\n09    </head>\n10\
  \    <body>\n11    <p>How satisfied are you 1-5</p>\n12    <div>\n13      <label>Quality</label>\n\
  14      <input type=\"text\" onkeyup=\"update()\"></input>\n15      <span><span><span><span></span></span>\n\
  16    </div>\n17    <div>\n18      <label>Taste</label>\n19      <input type=\"\
  text\" onkeyup=\"update()\"></input>\n20      <span><span><span><span></span></span>\n\
  21    </div>\n22    <div>\n23      <label>Service</label>\n24      <input type=\"\
  text\" onkeyup=\"update()\"></input>\n25      <span><span><span><span></span></span>\n\
  26    </div>\n27  </body>\n28 </html>\n```\n\n**列表 8.5 traverse_dom.js，用于根据输入值处理\
  \ <span> 颜色的 JavaScript 代码**\n\n```javascript\nfunction update() {\n  $(\"span\"\
  ).css(\"background-color\",\"lightgrey\");\n  $(\"div\").each(function(i){\n   \
  \ var $input = $(this).children(\"input:first\");\n    var $value = $input.val();\n\
  \    var filter = \"span:lt(\" + $value + \")\";\n    $input.siblings(filter).css(\"\
  background-color\",\"blue\");\n  });\n}\n```\n\n**列表 8.6 traverse_dom.css，用于设置 <span>\
  \ 元素的 CSS 代码**\n\n```css\nspan {\n  display: inline-block;\n  height: 20px;\n  width:\
  \ 20px;\n  margin: 5px;\n  padding: 5px;\n}\n```\n\n\n\n\n\n`.map()` 用于遍历元素集合并返回一个包含每次迭代中指定函数结果的新对象。`.each()`\
  \ 则仅遍历元素并应用指定的函数。\n\n### 练习\n\n1. 扩展 `dom_manipulation.html` 中的 HTML 代码，包含更多与其它部分类似的\
  \ `<div>` 部分。请注意，相同的功能会自动应用到每个部分上。\n\n## 第 9 节：应用 JavaScript 和 jQuery 事件构建丰富交互的网页\n\
  \n你将在本节中学习到：\n\n![Image](img/image00767.jpeg) 用户和浏览器触发事件的方式\n\n![Image](img/image00767.jpeg)\
  \ 事件对象上可以访问属性\n\n![Image](img/image00767.jpeg) 如何添加能够动态响应事件的处理程序\n\n![Image](img/image00767.jpeg)\
  \ 向事件处理程序传递额外数据的方式\n\n![Image](img/image00767.jpeg) 手动触发事件的方法\n\n![Image](img/image00767.jpeg)\
  \ 创建自定义事件的方法\n\n![Image](img/image00767.jpeg) 如何在代码中实现并触发回调函数\n\nAngularJS、jQuery\
  \ 和 JavaScript 的主要目标之一是为开发者提供创建极其复杂且交互丰富的网页的能力。这种交互式网页的核心是事件。事件基本上是浏览器环境中发生的任何事情，从页面加载、鼠标移动或点击、键盘输入，到窗口大小的调整等。\n\
  \n理解事件、代表事件的对象以及如何在你的网页中应用它们，将使你能够创建出极佳的用户交互。在本节中，你将学习理解事件所需的概念，以及如何在构建丰富交互的网页时利用它们。你将在书的其余部分反复使用本节的概念。\n\
  \nAngularJS 利用了本节讨论的底层 JavaScript 和 jQuery 事件功能，但还提供了额外的功能（例如数据监听），以实现更健壮的事件处理。这些概念在课程的\
  \ AngularJS 部分中会有介绍。\n\n### 理解事件\n\n你已经在本书的几个示例中使用过事件。然而，为了充分利用它们，你需要理解从物理交互到 AngularJS、jQuery\
  \ 和 JavaScript 交互（这些交互将修改屏幕元素和数据）过程中发生了什么。接下来的章节描述了事件过程、涉及的组件以及如何在网页中实现事件。\n\n####\
  \ 理解事件过程\n\n从高层来说，事件处理的概念很容易理解：你点击网页上的一个按钮，事情就发生了。本节将深入探讨，以便你理解正在发生什么。以下列表描述了当用户与网页或浏览器窗口交互时发生的重要事项。\n\
  \n1. **物理事件发生**——发生了一个物理事件；例如，用户点击或移动鼠标或按下按键。\n\n2. **浏览器中触发事件**——用户交互导致 Web 浏览器触发事件——通常是同时触发多个事件。例如，当用户在键盘上输入一个按键时，会触发三个事件：`keypressed`、`keydown`\
  \ 和 `keyup` 事件。\n\n3. **浏览器为事件创建对象**——Web 浏览器为触发的每个事件创建一个单独的对象。这些对象包含了有关事件的信息，可供处理程序使用。\n\
  \n4. **调用用户事件处理程序**——调用用户定义的事件处理程序。你有能力在 JavaScript 中创建处理程序，这些处理程序将与事件对象和或页面元素交互，为\
  \ HTML 元素提供交互性。事件处理程序可以处于三个阶段。以下描述了 [图 9.1] 所示的三个阶段。\n\n![Image](img/image00767.jpeg)\
  \ **捕获 (Capturing)**——捕获阶段是从文档直接通过每个父元素向下到达目标 HTML 元素的路径阶段。默认情况下，捕获阶段的事件处理程序行为是禁用的。\n\
  \n![Image](img/image00767.jpeg) **目标 (Target)**——当事件处于最初触发它的 HTML 元素中时，即进入目标阶段。\n\
  \n![Image](img/image00767.jpeg) **冒泡 (Bubbling)**——冒泡阶段是经过目标 HTML 元素的每个父元素向上移动，一直回到文档。默认情况下，事件的冒泡阶段是启用的。\n\
  \n![Image](img/image00887.jpeg)\n\n**图 9.1** 事件在捕获阶段从文档向下到目标处理，然后在目标阶段处理，最后在冒泡阶段从目标向上通过文档进行处理。\n\
  \n5. **调用浏览器处理程序**——除了用户事件处理程序外，浏览器还有默认处理程序，它们根据触发的事件执行不同的操作。例如，当用户点击链接时，浏览器会调用一个事件处理程序，并导航到链接中指定的\
  \ `href` 位置。\n\n#### 查看事件对象\n\n当浏览器检测到事件发生时，会创建事件对象。如果事件处理程序是由 AngularJS 或 jQuery\
  \ 定义的，事件对象会被转换为 jQuery 事件对象，该对象具有更多的属性和方法。因此，你需要意识到你正在处理哪种类型的事件对象。\n\n事件对象为你提供了有关事件的额外信息，例如事件的类型（例如\
  \ `click` 或 `keypress`）、按了哪些键、鼠标位置、事件发生在哪个 HTML 元素上等。[表 9.1] 描述了你将使用的最常用的事件属性。\n\
  \n![Image](img/image00888.jpeg)![Image](img/image00889.jpeg)\n\n**表 9.1** JavaScript\
  \ 和 jQuery 事件属性\n\n事件还提供了一些方法，允许你控制事件的行为——例如停止传播和默认行为。[表 9.2] 描述了事件对象上的重要方法。\n\n\
  ![Image](img/image00890.jpeg)\n\n**表 9.2** JavaScript 和 jQuery 事件属性\n\n#### 回顾事件类型\n\
  \n事件类型是 JavaScript、jQuery 和 AngularJS 用于识别发生的物理事件的关键字。这些关键字用于附加处理程序以指定事件类型。此外，正如你之后将看到的，这些关键字也用于方法名称中，用于附加事件处理程序或手动触发事件。\n\
  \nJavaScript 提供了多种对应动态页面交互期间发生的不同事件类型。jQuery 事件处理支持所有的 JavaScript 事件，并增加了自己的事件。[表\
  \ 9.3] 列出了 JavaScript 和 jQuery 支持的不同事件类型。\n\n![Image](img/image00891.jpeg)![Image](img/image00892.jpeg)\n\
  \n**表 9.3** JavaScript 和 jQuery 事件类型\n\n### 使用页面加载事件进行初始化\n\n当 HTML 文档加载时，`<script>`标签中指定的\
  \ JavaScript 代码将被加载并执行。通常，JavaScript 和 jQuery 逻辑将位于以后执行的函数内部。然而，会有一些代码执行初始化工作，例如向页面元素附加事件处理程序，甚至向现有元素中添加额外的元素。\n\
  \n问题是，在 JavaScript 代码加载时，HTML 元素对象可能尚未被浏览器构建。如果你在 HTML 对象创建之前引用它，将抛出异常，因此，你需要等待页面完全加载。\n\
  \n\n\n\n这就是 `load` 事件非常有用的地方。将初始化代码放置在页面加载时触发的事件处理程序内部，可以确保所有的 HTML 对象都已创建，并且 DOM\
  \ 已完全就绪。\n\n## 使用 JavaScript onload 事件\n\n若要在 JavaScript 中添加在页面加载时运行的初始化代码，请在 JavaScript\
  \ 中创建一个执行初始化的函数。例如，考虑以下展示了简单骨架结构初始化函数的 JavaScript 代码：\n\n点击此处查看代码图片\n\n```javascript\n\
  function onloadHandler(){\n   (initialization code here...)\n}\n```\n\n现在你有两种方法可以确保在页面完全加载时触发\
  \ `onloadHandler()`。第一种是将你的初始化代码绑定到 HTML 中 `<body>` 元素的 `onload` 属性上。例如：\n\n点击此处查看代码图片\n\
  \n```html\n<body onload=\"onloadHandler()\">\n```\n\n第二种方法是将其直接赋值给 JavaScript 代码中的\
  \ `window` 对象。例如：\n\n点击此处查看代码图片\n\n```javascript\nwindow.onload = onloadHandler;\n\
  ```\n\n## 在 jQuery 中添加初始化代码\n\n在 jQuery 中，初始化代码可以在两个不同的时间触发并执行：当 DOM 就绪时，以及当文档及其资源完全加载时。使用哪种选项取决于你的初始化代码需要执行什么操作。\n\
  \n使用 jQuery 的 `.ready()` 方法将在 DOM 完全就绪时触发初始化代码运行。此时所有的 DOM 对象都已创建，页面将显示给用户。然而，此时所有的页面资源（如图像）可能尚未完全下载。这种选项允许你尽早地添加交互和功能。下面的示例展示了如何使用\
  \ `.ready()` 绑定简单初始化函数的用法：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n\
  \   (initialization code here...)\n})\n```\n\n使用 jQuery 的 `.load()` 方法将在所有页面资源加载并渲染给用户后触发初始化代码。在有时，如果你需要在初始化代码中使用如图像之类的资源，则可能会使用此选项。下面的示例展示了使用\
  \ `load()` 绑定简单初始化函数的用法：\n\n点击此处查看代码图片\n\n```javascript\n$(window).load(function(){\n\
  \   (initialization code here...)\n})\n```\n\n***\n\n> **注意**\n> `.ready()` 和 `.load()`\
  \ 方法与 `<body>` 标签中使用 `onload=\"...\"` 属性不兼容。如果你在使用 jQuery，请使用 `.ready()` 或 `.load()`；如果没有使用，请使用\
  \ `onload` 属性。\n\n***\n\n## 为 DOM 元素添加和移除事件处理程序\n\n为了给网页中的事件提供交互，必须为你想要交互的每个特定事件类型添加事件处理程序。事件处理程序是一个\
  \ JavaScript 函数，用于添加、删除或更改 DOM 元素或其他完成交互所需的任何操作。例如，下面的代码是一个将 `<p>` 元素中显示的文本更改为 `\"\
  clicked\"` 的事件处理程序示例：\n\n```javascript\nfunction clickHandler(){\n  $(\"p\").html(\"\
  clicked\");\n}\n```\n\n多种方法可以向 DOM 元素添加事件处理程序。本节将描述这些这些方法及其优缺点。\n\n### 在 HTML 中分配事件处理程序\n\
  \n向 DOM 元素添加事件处理程序最基本的方法是直接在 HTML 代码中编写。这种方法的优点是简单，并且易于查看哪个事件处理程序被分配给了特定的 DOM 对象。\n\
  \n通过在标签语句中设置 handler 属性的值，可以将事件处理程序添加到 HTML 的 DOM 对象中。对于元素支持的每个事件，都有一个以“on”开头并跟跟事件名称的属性。例如，`click`\
  \ 事件属性是 `onclick`，`load` 事件属性是 `onload`。要查看事件列表，请参阅 表 9.1。\n\n下面的示例展示了在 HTML 代码中为\
  \ DOM 元素添加 `click` 事件处理程序是多么简单：\n\n点击此处查看代码图片\n\n```html\n<div onclick=\"clickHandler()\"\
  >Click Here</div\n```\n\n当点击 `<div>` 元素时，将调用以下函数：\n\n```javascript\nfunction clickHandler(){\n\
  \  $(\"div\").html(\"clicked\");\n}\n```\n\n你还可以使用 `event` 关键字将 DOM 事件对象作为参数包含在事件处理程序中。这允许你在事件处理程序中访问事件信息；\n\
  \n```html\n<div onclick=\"clickHandler(event)\">Click Here</div\n```\n\n当点击 `<div>`\
  \ 元素时，将调用以下函数：\n\n```javascript\nfunction clickHandler(event){\n  $(\"div\").html(\"\
  clicked\");\n}\n```\n*(等待，原文在此处有些重复/重叠，我将根据提供的文本维持其逻辑)*：\n\n你还可以使用 `event` 关键字将\
  \ DOM 事件对象作为参数包含在事件处理程序中。这允许你在事件处理程序中访问事件信息；\n\n```html\n<div onclick=\"clickHandler(event)\"\
  >Click Here</div\n```\n\n当点击 `<div>` 元素时，将调用以下函数：\n\n```javascript\nfunction clickHandler(event){\n\
  \  $(\"div\").html(\"clicked\");\n}\n```\n\n\n\n\n```javascript\ndocument.getElementById(\"\
  div1\").addEventListener('click',\n  function(e){\n    clickHandler (e, \"heading\"\
  , 1, \"yes\");\n  },false);\n```\n所以，这就是前面代码中 `addEventListener()` 调用所发生的情况。指定了事件类型\
  \ `'click'`，然后定义了一个没有名称的新匿名 `function`，它接受事件对象作为唯一参数，并用 `e` 表示。在包装器函数内部，使用自定义参数调用了实际的事件处理器，包括用于传递事件对象的\
  \ `e` 变量。在示例中，使用 `false` 表示该句处理器应只在冒泡阶段被调用。\n\n你也可以使用 DOM 对象上的 `removeEventListener()`\
  \ 函数从事件中移除事件处理器。你需要指定要移除的事件类型和事件处理器的名称。例如，以下代码先添加了事件处理器，然后将其移除：\n\n点击此处查看代码图片\n\n\
  ```javascript\nvar obj = document.getElementById(\"div1\");\nobj.addEventListener('click',\
  \ clickHandler);\nobj.removeEventListener('click', clickHandler);\n```\n\n### 提示\n\
  你也可以使用 `handler` 属性在 DOM 对象本身设置访问事件处理器。`handler` 属性将是“on”加上事件类型。例如，对于点击事件，该属性为 `obj.onclick`。你可以通过\
  \ `obj.onclick()` 调用事件处理器，或直接使用 `obj.onclick= function handler(){ ...};` 为其赋值。\n\
  \n## 尝试自己：通过 JavaScript 为 DOM 对象添加事件处理器\n在此示例中，你将使用 JavaScript 方法动态地为 DOM 对象附加事件处理器。请按照以下步骤创建\
  \ 列表 9.1、9.2 和 9.3 所示的文件：\n\n1. **在 Eclipse 中**，创建 `lesson09`、`lesson09/js` 和 `lesson09/css`\
  \ 文件夹。\n2. **创建** `lesson09/broken_event.html`、`lesson09/js/broken_event.js` 和 `lesson09/css/broken_event.css`\
  \ 文件。\n3. **将** 来自 列表 9.1 所示的代码添加到 HTML 文件中。你应该能识别该文件中的几乎所有内容。注意 `<body>` 标签的 `onload`\
  \ 事件处理器设置为 `onloadHandler()`。\n4. **将** 来自 列表 9.3 的 CSS 添加到 CSS 文件中。现在你也应该能识别这些\
  \ CSS 语句了。\n5. **打开** `broken_event.js` 文件以及将用于处理点击事件的后续函数。注意它接受多个参数。第一个参数是 DOM\
  \ 事件对象，用于通过 `e.screenX` 获取 x 坐标。它还接受一个对象 `objId`，用于获取应该写入的对象。其余参数用于向由 `objId` 指定的对象的\
  \ `innerHTML` 中写入消息：\n\n点击此处查看代码图片\n\n```javascript\n01 function clickHandler(e,objId,num,msg){\n\
  02   var obj = document.getElementById(objId);\n03   obj.innerHTML = \"DIV \" +\
  \ num + \" says \" + msg +\" at X postion: \" + e.screenX;\n04 }\n```\n\n6. **创建**\
  \ 以下包装器函数，用于将参数传递给实际的事件处理器。包装器函数仅接受事件对象作为参数 `e`。它们使用适当的值调用 `clickHandler()` 函数。在示例中，通过调用\
  \ `removeEventListener()` 从目标对象移除事件处理器。移除事件处理器并不是常见做法，这只是为了提供一个示例：\n\n点击此处查看代码图片\n\
  \n```javascript\n05 function yesWrapper(e){\n06   clickHandler(e, \"heading\", 1,\
  \ \"yes\");\n07   e.target.removeEventListener('click', yesWrapper);\n08 }\n09 function\
  \ noWrapper(e){\n10   clickHandler(e, \"heading\", 1, \"no\");\n11   e.target.removeEventListener('click',\
  \ noWrapper);\n12 }\n```\n\n7. **添加** 以下 `onloadHandler()` 函数，该函数调用 `addEventListener()`\
  \ 为每个 `<div>` 元素添加 `click` 事件处理器：\n\n点击此处查看代码图片\n\n```javascript\n13 function onloadHandler(){\n\
  14   document.getElementById(\"div1\").addEventListener('click', yesWrapper, false);\n\
  15   document.getElementById(\"div2\").addEventListener('click', noWrapper, false);\n\
  16 }\n```\n\n8. **保存** 所有三个文件，然后在网页浏览器中打开 HTML 文档，并尝试 图 9.2 所示的“Say Yes”和“Say No”按钮。注意按钮只会生效一次，因为事件处理器已被移除。如果我们没有移除事件处理器，按钮将继续更改\
  \ `<h1>`。\n\n![图 9.2](https://example.com/083.jpeg) **图 9.2** 一个为元素 添加事件处理器并响应点击的简单网页。\n\
  \n### 列表 9.1 broken_event.html HTML 文件 加载 jQuery、并将事件处理器附加到 <div>\n点击此处查看代码图片\n\n\
  ```html\n01 <!DOCTYPE html>\n02 <html>\n03 <head>\n04   <meta charset=\"utf-8\"\
  \ />\n05   <title>Broken Event</title>\n06   <script type=\"text/javascript\" src=\"\
  https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07   <script type=\"text/javascript\"\
  \ src=\"js/broken_event.js\"></script>\n08   <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"css/broken_event.css\">\n09 </head>\n10 <body onload=\"onloadHandler()\"\
  >\n11   <div id=\"div1\">Say Yes</div>\n12   <div id=\"div2\">Say No</div>\n13 \
  \  <h1></h1>\n14 </body>\n15 </html>\n```\n\n### 列表 9.2 broken_event.js JavaScript\
  \ 代码 定义事件处理器并动态地附加到 <div>\n点击此处查看代码图片\n\n```javascript\n01 function clickHandler(e,objId,num,msg){\n\
  02   var obj = document.getElementById(objId);\n03   obj.innerHTML = \"DIV \" +\
  \ num + \" says \" + msg +\" at X postion: \" + e.screenX;\n04 }\n05 function yesWrapper(e){\n\
  06   clickHandler(e, \"heading\", 1, \"yes\");\n07   e.target.removeEventListener('click',\
  \ yesWrapper);\n08 }\n09 function noWrapper(e){\n10   clickHandler(e, \"heading\"\
  , 1, \"no\");\n11   e.target.removeEventListener('click', noWrapper);\n12 }\n13\
  \ function onloadHandler(){\n14   document.getElementById(\"div1\").addEventListener('click',\
  \ yesWrapper, false);\n15   document.getElementById(\"div2\").addEventListener('click',\
  \ noWrapper, false);\n16 }\n```\n\n### 列表 9.3 broken_event.css CSS 代码 样式 <div> 元素\n\
  点击此处查看代码图片\n\n```css\n1 div{\n2   border-radius:5px;\n3   margin:3px;\n4   padding:5px;\n\
  5   background-color:lightgrey;\n6   font-weight:bold;\n7   display:inline-block;\n\
  8   cursor:pointer;\n9 }\n```\n\n## 在 jQuery 中应用事件处理器\n为 DOM 元素附加事件处理器的最佳方法是使用 jQuery。使用\
  \ jQuery 对象可以轻松选择不同的集合并同时为它们应用相同的事件处理器。\n\n在过去，jQuery 有几种方法添加和移除事件处理器，包括 `bind()/unbind()`\
  \ 和 `delegate()`/`undelegate()`。`bind()` 方法模仿了 `addEventListener()` 的行为，而 `delegate()`\
  \ 允许向 jQuery 对象添加事件，然后当添加额外的子元素时，也会自动将其委托给这些元素。\n\n从 jQuery 1.7 版本开始，这些方法都由一组简单的对方法\
  \ `on()` 和 `off()` 取代。使用 `on()` 方法在 jQuery 对象上附加事件处理器。`on()` 方法可以以以下两种格式之一调用：\n\n\
  点击此处查看代码图片\n\n```javascript\non(events [, selector] [, data], handler(eventObject))\n\
  \non(events-map [, selector][, data])\n```\n\n\n\n\n\n以下列表描述了在向 jQuery 对象添加事件处理程序时，可以添加到\
  \ `on()` 方法的每个参数的用途：\n\n![Image](img/image00767.jpeg) `events`—一个或多个由空格分隔的事件类型，以及用点语法表示的可选命名空间；例如，`\"\
  click\"`、`\"mouseenter mouseleave\"` 或 `\"keydown.myPlugin\"`。事件类型列表可以在 表 9.1 中找到。\n\
  \n![Image](img/image00767.jpeg) `events-map`—一个映射对象，其中字符串键指定一个或多个由空格分隔的事件类型，而值指定在事件触发时将调用的处理程序函数；例如，`{'click':myhandler}`\
  \ 或 `{'click':function myHandler(e){return true;}}`。\n\n![Image](img/image00767.jpeg)\
  \ `selector`—可选。选择器字符串，指定当事件触发时，哪些后代元素也应该调用事件处理程序。这取代了 `delegate()` 方法的功能。如果你向事件始终存在于页面父对象集添加事件处理程序，那么任何匹配选择器的后代元素在事件触发时也会调用该处理程序，即使它们是在绑定事件之后才添加的。\n\
  \n![Image](img/image00767.jpeg) `data`—可选。它可以是一个数字、字符串或对象，当事件触发时将作为 `event` 的数据部分通过\
  \ `event.data` 传递给处理程序。\n\n![Image](img/image00767.jpeg) `handler(eventObject)`—如果你没有使用\
  \ `events-map`，则需要指定在事件触发时执行的处理程序函数。\n\n要从元素中移除 jQuery 事件处理程序，请在 jQuery 对象上调用 `off()`\
  \ 方法。`off` 方法的语法是以下之一：\n\n点击此处查看代码图像\n\n```\noff(events [, selector] [, handler(eventObject]))\n\
  \noff(events-map [, selector])\n```\n\n如果没有指定处理程序，`off()` 函数将移除所有指定事件的处理程序。接下来的示例展示了如何使用\
  \ `on()` 向所有 `<div>` 元素添加事件处理程序，然后使用 `off()` 移除它：\n\n点击此处查看代码图像\n\n```\n$(\"div\"\
  ).on(\"click\",clickHandler);\n\n$(\"div\").off(\"click\",clickHandler);\n```\n\n\
  ***\n\n注意\n\n`on()` 和 `off()` 方法适用于所有的 jQuery 事件类型，包括你自定义的事件。jQuery 还提供了一些简单的辅助函数（将在课程稍后部分讨论），以便更容易地为某些事件附加处理程序。\n\
  \n***\n\n提示\n\n你通常希望事件处理程序只在事件第一次发生时运行一次。jQuery 提供了非常有用的 `one()` 方法，它会添加一个事件并在第一次触发后自动将其移除。`one()`\
  \ 方法与 `on()` 方法使用相同的语法。\n\n***\n\n### 尝试自己：使用 jQuery 添加事件处理程序\n\n在本示例中，你使用 jQuery\
  \ 方法动态地为 DOM 对象附加事件处理程序。使用以下步骤创建 列表 9.4、9.5 和 9.6 所示的文件：\n\n**1.** 在 Eclipse 中，创建\
