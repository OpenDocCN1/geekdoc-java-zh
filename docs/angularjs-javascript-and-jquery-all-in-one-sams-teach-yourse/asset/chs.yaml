  \n**图 2.15** 在元素检查器的布局编辑器中查看 CSS 布局属性。\n\n### 使用布局编辑器\n\n调试 CSS 的另一个极其强大的工具是元素编辑器中的布局编辑器。布局编辑器如图\
  \ 2.15 **外边距 (Margin)**——外边距是布局编辑器中显示的最外层框。外边距的四边都有一个值。你可以双击这些值并直接在布局编辑器中更改 CSS\
