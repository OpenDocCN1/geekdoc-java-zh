  \ 5px 5px 5px #225588;\n28     opacity:1; }\n```\n\n* * *\n\n### 使用 Sortable 小部件排序元素\n\
  \njQuery UI 提供的最酷的交互之一是 `sortable` 小部件。`sortable` 小部件允许你拖动并重新排列在列表、表格或容器内流式排列的 HTML\
  \ 元素的顺序。\n\n当你拖动其中一个项目时，`sortable` 小部件会重新定位其他元素。你还可以将多个 sortable 容器链接，这样就可以将项目从一个\
  \ sortable 容器拖到另一个。\n\n表 18.10 描述了更常用的 sortable 选项。以下展示了如何将 `sortable` 小部件挂载到元素上并将\
  \ `tolerance` 指定为 `fit` 的示例：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#ul1\").sortable({tolerance:\"\
  fit\"});\n```\n\n#### 常用 Sortable 小部件选项\n\n** *\n\n**注意**\n要使用 `sortable` 排序表格行，你需要让\
  \ `<tbody>` 可可排序，而不是 `<table>`。\n\n`sortable` 小部件还提供了额外的事件，以便可以将处理器挂载到 sortable\
  \ 元素或其子元素上。表 18.11 列出了你可以在可选择项目上访问的事件。\n\n#### Sortable 小部件事件\n\n**提示**\njQuery\
  \ UI 会为正在排序的辅助元素添加 `.ui-sortable-helper` 类。你可以在 CSS 中为该辅助类定义你自己的设置，以控制在 `sortable`\
  \ 中移动元素时的外观。\n\n每个 `sortable` 事件都会传递 `event` 对象以及一个 `ui` 对象，该 `ui` 对象将带有以下值：\n\n\
  - `helper`: 代表正在拖拽的辅助对象的 jQuery 对象。\n- `item`: 代表目标项目的 jQuery 对象。\n- `offset`: 偏移量信息。\n\
  - `original`: 原始位置信息。\n- `position`: 当前位置信息。\n- `sender`: 发送事件的元素。\n\n\n\n\n\n```html\n\
  <html\n<head>\n    <title>整理条目</title>\n    <meta charset=\"utf-8\" />\n    <script\
  \ type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  \    <script type=\"text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"\
  ></script>\n    <script type=\"text/javascript\" src=\"js/sortable_elements.js\"\
  ></script>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/sortable_elements.css\"\
  >\n</head>\n<body>\n    <div id=\"sorter1\"></div>\n    <div id=\"sorter2\"></div>\n\
  \    <table border=1>\n        <tbody>\n            <tr>\n                <th>图标</th>\n\
  \                <th>数字</th>\n                <th>名称</th>\n                <th>来源</th>\n\
  \            </tr>\n        </tbody>\n        <tbody id=\"sortTable\"></</tbody>\n\
  \    </table>\n</body>\n</html>\n```\n\n### 列表 18.14 sortable_elements.js 使用 jQuery\
  \ 和 jQuery UI 实现排序\n\n点击此处查看代码图片\n\n```javascript\nvar images = [\n    {src:\"/images/lake.jpg\"\
