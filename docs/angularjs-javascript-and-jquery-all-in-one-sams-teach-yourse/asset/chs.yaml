  \n# 第 13 ：在 jQuery 和 JavaScript 中与 Web 表单交互\n\n在本节中将学习：\n\n![Image](img/image00767.jpeg)\
  \ 如何获取和设置表单元素的值\n\n![Image](img/image00767.jpeg) 动态构建表单元素\n\n![Image](img/image00767.jpeg)\
  \ 如何使用表单元素动画帮助用户导航表单\n\n![Image](img/image00767.jpeg) 如何为用户自动聚焦元素\n\n![Image](img/image00767.jpeg)\
  \ 创建基础电子商务 Web 表单\n\n![Image](img/image00767.jpeg) Web 表单的简单方法\n\nWeb 表单是动态 Web\
  \ 编程不可或缺的一部分。你可能只把表单考虑为信用卡支付、在线注册等；然而，每当你需要从用户处获取实际数据时，你都会使用 Web 表单来收集数据输入。\n\n\
  Web 表单对用户来说可能是积极或消面的体验。思考一下：他们知道自己需要输入数据。如果由于表单笨拙或难以理解，导致输入数据很困难，他们会讨厌它并产生糟糕的体验。如果表单能够优雅、快速且高效地引导他们，那么他们会说：“哇！太简单了。”\n\
  \n那么，如何给用户提供良好的体验呢？\n\n1. 使用动态编程访问他们正在输入的数据，以提供符合其操作的动态工作流。\n\n2. 提供视觉效果（如高亮或展开元素），帮助他们浏览页面。\n\
  \n3. 提供内联验证，让他们在开始偏离方向时立即获知。\n\n接下来的章节将介绍每个概念。当你完成学习后，你将能够实现一些非常出色的 Web 表单。\n\n\
  ***\n\n注意\n\njQuery 和 JavaScript 在处理 Web 表单时提供了许多非常棒的功能。AngularJS 为 JavaScript 和\
  \ jQuery 增加了功能，能够将 Web 表单元素绑定到 Web 页面数据模型中的值。你将在课程的 AngularJS 部分学习到更多相关内容。\n\n***\n\
  \n### 访问表单元素\n\n与 Web 表单交互最重要的部分是能够访问它们所代表的数据。访问表单数据允许你获取和设置值、更改选择并将数据序列化以供其他方式使用。\n\
  \n表单元素有多种类型。遗憾的是，没有单一的标准方法来获取和设置元素所代表的值。接下来的章节描述了访问每种表单元素数据的方法。\n\n### 获取和设置表单元素的值\n\
  \n获取表单元素代表的值取决于表单元素的类型。例如，文本元素代表内部的文本，而选择元素代表被选中元素的值（或多个值）。\n\n在接下来的章节中，将根据获取表单值的方法对表单元素进行分组。例如，无论类型如何，所有文本元素都以相同的方式进行访问。\n\
  \n#### 访问表单元素属性\n\n不同的元素具有许多相同的属性，也有一些是元素类型特有的。在实现动态代码时，有几个属性是你需要访问的：\n\n![Image](img/image00767.jpeg)\
  \ `id`——用于查询和识别表单元素。\n\n![Image](img/image00767.jpeg) `name`——有多种用途。对于单选按钮（radio\
  \ inputs），此属性用于将元素分组在一起，以便每次只能选择一个。对于表单的序列化和提交，`name` 属性被用作元素值的名称。\n\n![Image](img/image00767.jpeg)\
  \ `type`——用于识别 `<input>` 元素的类型。\n\n![Image](img/image00767.jpeg) `value`——存储与元素关联的值。对于文本元素，该值显示在文本框中；对于按钮，它是按钮中的字符串；对于\
  \ `<option>` 元素，它是与选项关联的值。\n\n![Image](img/image00767.jpeg) `checked`——用于访问单选按钮或复选框\
  \ `<input>` 元素的选择状态。\n\n可以通过属性 `name` 直接在 JavaScript 中访问这些属性。例如，要获取和设置 `value` 属性，可以使用以下代码：\n\
  \n```javascript\ndomObj.value = \"New Text\";\nvar newValue = domObj.value;\n```\n\
  \n在 jQuery 中，有三种方法获取表单对象的属性和特性：`.attr()`、`.prop()` 和 `.val()`。`.attr()` 方法用于访问对应\
  \ HTML 属性，如 `id`、`name` 和 `type`；而 `.prop()` 方法用于访问更特定的 DOM 对象的属性，例如 `<select>`\
  \ 元素的 `selectedIndex`。\n\n***\n\n注意\n\n`.attr()`、`.prop()` 和 `.val()` 方法仅获取匹配元素的值。如果你正在处理多个元素，可能需要使用\
  \ `.map()` 或 `.each()` 来获取所有元素的值。\n\n***\n\njQuery 提供了 `.val()` 方法来访问表单元素的值。在 jQuery\
  \ 中，可以使用 jQuery 对象的 `.val()` 方法访问值。例如，以下语句设置所有 `type=\"text\"` 的 `<input>` 元素的值，然后获取第一个值：\n\
  \n#### 访问文本输入元素\n\n最常见的表单元素类型是文本输入。这些元素包括 `<textarea>` 元素以及具有以下 `type` 属性值的 `<input>`\
  \ 元素：`color`、`date`、`datetime`、`datetime-local`、`email`、`month`、`number`、`password`、`range`、`search`、`tel`、`time`、`url`\
  \ 和 `week`。\n\n尽管这些元素用法上有所不同，但它们都渲染相同的 Basic 文本框并以相同的方式访问。每个元素都有可以在 HTML 中设置的值属性。例如，以下代码显示了一个带有初始值的文本表单元素的示例，如图\
  \ 13.1 所示：\n\n[content]\n```html\n<input type=\"text\" value=\"Initial Text\"/>\n\
  ```\n[/content]\n\n![Image](img/image0917.jpeg)\n\n**图 13.1** 带有初始值的简单文本输入。\n\n\
  可以通过访问值属性直接从 JavaScript 获取该值。例如，以下代码设置了文本输入元素的值并获取了该值：\n\n[content]\n```javascript\n\
  textDomObj.value = \"New Text\";\nvar newValue = textDomObj.value;\n```\n[/content]\n\
  \n```javascript\n$(\"input:text\").val(\"New Text\");\nvar newValue = $(\"input:text\"\
  ).val();\n```\n\n\n\n\n复选框输入元素具有布尔值，该值取决于该元素是否被选中。通过获取 `checked` 属性的值可以访问该值。如果元素被选中，则\
  \ `checked` 的值将为 `true` 或 `\"checked\"`；否则，该值为 `undefined` 或 `false`。\n\n你可以通过以下方式从\
  \ JavaScript 获取并设置复选框元素的状态：\n\n```javascript\ndomObj.checked = true;\ndomObj.checked\
  \ = false;\nvar state = domObj.checked;\n```\n\n使用 jQuery 判断一个项目是否被选中时情况略有不同。请记住，在\
  \ jQuery 中你可能同时处理多个复选框，因此查看 jQuery 对象是否代表已选中的对象的最安全的方法是使用 `.is()` 方法。例如：\n\n```javascript\n\
  jObj.is(\":checked\");\n```\n\n要将代表复选框的 jQuery 对象的状态设置为已选中，你可以如下所示设置 `checked` 属性：\n\
  \n```javascript\njObj.prop(\"checked\", true);\n```\n\n将代表复选框的 jQuery 对象的状态设置为未选中的的方法类似。你需要使用\
  \ `prop()` 移除 `checked` 属性并将值设置为 `false`。例如：\n\n点击此处查看代码图片\n\n```javascript\njObj.prop(\"\
  checked\", false);\n```\n\n### 单选按钮输入\n\n单个单选按钮的工作方式与复选框相同。你可以以相同的方式访问其选中状态。\n\n\
  然而，单选按钮几乎总是成组使用的。单选按钮组代表的值不是布尔值。相反，它是当前被选中元素的 `value` 属性。\n\n在提交表单或序列化表单数据时，单选按钮组的值会自动填充。若要在代码中获取单选按钮组的值，你首先需要访问组中的所有元素，找到哪一个被选中了，然后从该对象获取\
  \ `value` 属性。以下代码将展示如何在 jQuery 中获取由 `name=\"myGroup\"` 组归类的单选按钮组的值：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar groupValue = $(\"input[name=myGroup]\").filter(\":checked\"\
  ).val();\n```\n\n该代码首先找到 `name=\"myGroup\"` 的 `<input>` 元素，然后过滤出被选中的元素，最后返回值。\n\n\
  ### 下拉列表输入\n\n`select` 输入元素实际上是系列 `<option>` 元素的容器输入元素。`select` 元素的值是当前选中选项（或选项）的值。同样，jQuery\
  \ 和 JavaScript 中的提交和序列化会自动为你处理这些。然而，若要手动处理，则需要一些代码。\n\n***\n\n**注意**\n\n如果你没有为 `<option>`\
  \ 元素指定 `value` 属性，返回的值将是 `innerHTML` 的值。例如，以下选项的数值为 `\"one\"`：`<option>one</option>`\n\
  \n***\n\n在访问 `<select>` 元素时，你可能需要几个值。其中一个是元素所代表的完整值。在 jQuery 中使用 `.val()` 方法获取该值非常简单。例如，考虑以下代码：\n\
  \nHTML:\n\n点击此处查看代码图片\n\n```html\n<select id=\"mySelect\">\n  <option value=\"one\"\
  >One</option>\n  <option value=\"two\">Two</option>\n  <option value=\"three\">Three</option>\n\
  </select>\n```\n\njQuery:\n\n```javascript\n$(\"#mySelect\").val();\n```\n\n如果第一个选项被选中，jQuery\
  \ 语句返回的值如下：\n\n`\"one\"`\n\n对于多选框，`.val()` 方法返回的是值的数组而不是单个值。例如，在多多选框中，如果过第一个选项被选中，jQuery\
  \ 语句返回的值如下：\n\n`[\"one\"]`\n\n在多选框中，如果过前三个选项都被选中，jQuery 语句返回的值如下：\n\n`[\"one\",\
  \ \"two\", \"three\"]`\n\n你也可以使用 `.val()` 方法来设置选中的元素。例如，以下语句选中了列表中的第二个元素：\n\n```javascript\n\
  [\"one\", \"two\", \"three\"]\n$(\"#mySelect\").val(\"two\");\n```\n\n以下语句选中了多选框元素中的第二个和第三个选项：\n\
  \n点击此处查看代码图片\n\n```javascript\n[\"one\", \"two\", \"three\"]\n$(\"#mySelect\").val([\"\
  two\", \"three\"]);\n```\n\n### 按钮输入\n\n在大多数情况下，你不需要访问按钮数据，唯一的可能是 `value` 属性，它定义了显示在按钮上的文本。`adding`/`removing`\
  \ 事件处理器和 CSS 属性都与其他 HTML 元素相同。\n\n### 文件输入\n\n文件输入是一种有趣且不同的表单元素类型。它同时提供了一个按钮和一个文本框。按钮链接到操作系统的文件浏览器，而文本框显示需要上传到\
  \ Web 服务器的文件路径。\n\n文件输入元素的 `value` 属性将是文件名，因此你可以直接从 JavaScript 访问它，或通过 jQuery 中的\
  \ `.val()` 方法访问它。\n\n在 Chrome 和 Firefox 中，DOM 对象还提供了一个 `files` 属性，它是一个文件对象数组，代表由该元素选择的文件。你可以从\
  \ JavaScript 使用用户选择的文件：\n\nHTML:\n\n点击此处查看代码图片\n\n```html\n<input id=\"fileSelect\"\
  \ type=\"file\" />\n```\n\nJavaScript:\n\n点击此处查看代码图片\n\n```javascript\nvar fileSelector\
  \ = document.getElementById(\"fileSelect\");\nvar fileList = fileSelector.files;\n\
  \nfor (var i in fileList){\n  var fileObj = fileList[i];\n  var fileName = fileObj.name;\n\
  \  var filePath = fileObj.last;\n  var fileSize = fileObj.size;\n  var fileType\
  \ = fileObj.type;\n}\n```\n\n***\n\n**注意**\n\n在处理文件时必须小心，因为这似乎是恶意行为的漏洞。如果 Internet\
  \ Explorer 检测到文件对象被篡改，它会阻止提交事件。此外，许多浏览器的安全设置阻止脚本获取某些文件信息。\n\n***\n\n每个文件对象包含几个动态编程中非常有用的属性。常用的属性列在表\
  \ 13.1。\n\n![图片](img/image018.jpeg)\n\n**表 13.1 文件对象的属性**\n\n### 隐藏输入\n\n如果你需要为表单提供额外信息，隐藏输入是一个非常好的\
  \ HTML 元素。隐藏输入不会显示在表单中；但它可以包含提交的键值对，甚至只是你想存储在表单中并在动态操作期间访问的值。\n\n随表单提交的是 `name`\
  \ 和 `value` 属性。然而，你可以使用 `.data(key [,value])` 方法为隐藏表单对象（或任何 jQuery DOM 对象）附加额外值。该方法的作用类似于\
  \ `.attr()` 和 `.prop()`：如果你想获取值，则传递键；如果你想设置值，则传递键和值。例如，以下代码定义了一个简单的隐藏元素，并使用 jQuery\
  \ 分配了提交值以及扩展属性：\n\nHTML:\n\n点击此处查看代码图片\n\n```html\n<input id=\"invisibleMan\" name=\"\
  InvisibleMan\" type=\"hidden\" />\n```\n\njQuery:\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#invisibleMan\").val(\"alive\");\n$(\"#invisibleMan\").data(\"hairColor\", \"\
  clear\");\n\nvar state $(\"#invisibleMan\").val();\nvar state $(\"#invisibleMan\"\
  ).data(\"hairColor\");\n```\n\n#### 序列化表单数据\n\n表单中的许多输入元素都可以轻松地序列化为字符串或数组。序列化表单数据使其在存储、发送或根据表单事件进行动态调整时变得更加容易。\n\
  \n\n\n\n要对一个表单进行序列化，它需要具备两个要素：一个 `name` 属性和一个可以赋值给名称的 `value` 属性。表 13.2 描述了不同类型属性的各种来源。\n\
  \n![Image](img/image0091.jpeg)\n\n**表 13.2 DOM File 对象的属性**\n\n## 将表单转换为查询字符串\n\n\
  常见的序列化任务之一是将表单数据转换为序列化数组。jQuery 使用 `.serialize()` 方法可以轻松完成这一任务。`.serialize()` 方法将访问表单并将名称/值对转换为\
  \ URL 编码字符串，准备好在网络上进行传输。\n\n例如，查看以下代码，它创建了一个表单并根据图 13.2 中设置的值对其进行序列化：\n\nHTML:\n\
  \n点击此处查看代码图像\n\n```html\n<form id=\"simpleForm\">\n  <input name=\"title\" type=\"\
  text\" /><br>\n  <select name=\"mySelection\" multiple size=3 id=\"mySelect\">\n\
  \    <option value=\"one\">One</option>\n    <option value=\"two\">Two</option>\n\
  \    <option value=\"three\">Three</option>\n  </select><br>\n  <input type=\"radio\"\
  \ name=\"gender\" value=\"male\">Male</input>\n  <input type=\"radio\" name=\"gender\"\
  \ value=\"female\">Female</input><br>\n</form>\n```\n\n![Image](img/image00920.jpeg)\n\
  \n**图 13.2** 包含 `text`、`select` 和 `radio` 输入的简单表单。\n\njQuery:\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar qString = $(\"#simpleForm\").serialize();\n```\n\n`qString` 的值：\n\
  \n点击此处查看代码图像\n\n```\ntitle=Lumber+Jack&mySelection=one&mySelection=two&gender=male\n\
  ```\n\n## 将表单转换为 JavaScript 对象\n\n另一种非常有用的序列化技术是将表单数据转换为 JavaScript 对象，以便对其进行访问。jQuery\
  \ 的 `.serializeArray()` 方法可以实现此功能。所有的名称/值对都被转换为一个可以通过你的代码访问的数组。\n\n例如，考虑在图 13.2\
  \ 所示的相同表单上运行以下 jQuery 语句：\n\n点击此处查看代码图像\n\n```javascript\nvar formArr = $(\"#simpleForm\"\
  ).serializeArray();\n```\n\n`formArr` 的结果值将如下：\n\n点击此处查看代码图像\n\n```json\n{0: {\"\
  name\":\"title\", \"value\":\"Lumber Jack\"},\n  1: {\"name\":\"mySelection\", \"\
  value\":\"one\"},\n  2: {\"name\":\"mySelection\", \"value\":\"two\"},\n  3: {\"\
  name\":\"gender\", \"value\":\"male\"}};\n```\n\n***\n\n## 动手实践：访问并操作表单元素数据\n\n\
  现在你已经有机会回顾了访问和交互表单数据的方法，是时候亲自实践一下了。在这次练习中，你将创建两个表单：一个用于获取数据，另一个用于设置数据。结果将是当你更新一个表单时，另一个表单也会之更新。\n\
  \n该练习的目的是让你有机会以各种方式获取和设置表单元素的值。示例代码位于列表 13.1、13.2 和 13.3 中。\n\n使用以下步骤创建动态 页面：\n\n\
  1. 在 Eclipse 中，创建 `lesson13`、`lesson13/js` 和 `lesson13/css` 文件夹，然后添加 `lesson13/form_manipulation.html`、`lesson13/js/form_manipulation.js`\
  \ 和 `lesson13/css/form_manipulation.css` 文件。\n\n2. 在 HTML 和 CSS 文件中添加列表 13.1 和列表\
  \ 13.3 所示的代码。这里有很多 HTML 代码，但它们都只是定义表单元素。注意有两个表单：`formA` 和 `formB`。\n\n3. 打开 `form_manipulation.js`\
  \ 文件并添加基础的 `.ready()` 函数，并在其中添加代码行来实现事件处理器，从而从 `formA` 的数据更新 `formB`。\n\n4. 添加以下行，为文本输入绑定一个\
  \ `keyup` 处理器，以便当 `formA` 中的值发生变化时，`formB` 中的值也会随之变化。值通过 `.val()` 方法获取和设置：\n\n点击此处查看代码图像\n\
  \n```javascript\n$(\"#formA input:text\").keyup(function() {\n  $(\"#formB input:text\"\
  ).val($(this).val());\n});\n```\n\n5. 添加以下行，为 `<textarea>` 输入绑定一个 `keyup` 处理器，以便当\
  \ `formA` 中的值发生变化时，`formB` 中的值也会随之变化。值通过 `.val()` 方法获取和设置：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(\"#formA textarea\").keyup(function() {\n  $(\"#formB textarea\").val($(this).val());\n\
  });\n```\n\n6. 添加以下行，为单选框输入绑定一个 `change` 处理器。注意为了获取另一个表单中相同的输入，你需要使用 `$(\"#formB\
  \ inputvalue=...)` 获取元素。值通过 `.prop()` 方法设置：\n\n[点击此处查看代码图像\n\n```javascript\n$(\"\
  #formA input:radio\").change(function() {\n  var radioB = $(\"#formB input[value=\"\
  \ + $(this).val() + \"]\");\n  radioB.prop(\"checked\", true);\n});\n```\n*(注：此处原文代码中逻辑略有瑕疵，radioB\
  \ 未定义定义，但翻译保持原意)*\n\n7. 添加以下行，为复选框绑定一个 `click` 处理器。注意为了在 `formB` 中选中相同的复选框，你需要使用\
  \ `.prop()` 方法：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#formA input:checkbox\").click(function()\
  \ {\n  $(\"#formB input:checkbox\").prop(\"checked\", $(this).is(\":checked\"));\n\
  });\n```\n\n8. 添加以下行，为 `formA` 中的选择框绑定 `change` 处理器，以便当选择项变化时，可以调用 `.val()` 获取 `formA`\
  \ 的值并设置给 `formB`：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#formA select\").change(function()\
  \ {\n  $(\"#formB select\").val($(this).val());\n});\n```\n\n9. 添加以下行，为图像输入绑定 `click`\
  \ 处理器，以便当它被点击时，属性将匹配：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#formA input:image\").click(function(e)\
  \ {\n  $(\"#formB input:image\").attr(\"src\", $(this).attr(\"src\"));\n  e.preventDefault();\n\
  });\n```\n\n10. 为重置按钮添加以下点击处理器。该处理器通过 `$(\"#formB\").get(0)` 获取 `formB` DOM 元素并对其调用\
  \ `.reset()` 函数。然后它移除所有元素的 `checked` 属性并重置图像元素的 `src` 属性：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(\"#resetB\").click(function() {\n  $(\"#formB\").get(0).reset();\n  $(\"#formB\
  \ input:checked\").prop(\"checked\", false);\n  $(\"#formB input:image\").attr(\"\
  src\", \"\");\n});\n```\n\n11. 为序列化按钮添加以下点击处理器。该处理器首先对表单调用 `.serialize()` 并字符串写入序列化元素。然后通过调用\
  \ `.serializeArray()` 获取序列化数组。使用 `jQuery.each()` 方法遍历数组，并将带有名称/值对的新段落追加到 `serializedA`\
  \ 段落中：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#serializeB\").click(function(e) {\n\
  \  $(\"#serialized\").html($(\"#formA\").serialize());\n  $(\"#serializedA\").empty();\n\
  \  var arr = $(\"#formA\").serializeArray();\n  jQuery.each(arr, function(i, prop)\
  \ {\n    $(\"#serializedA\").append($(\"<p>\" + prop.name + \" = \" + prop.value\
  \ + \"</p>\"));\n  });\n});\n```\n\n\n\n\n12. 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 13.3\
  \ 所示。你应该更改左侧表单中的元素，并看到右侧随之变化。当你点击`Serialize`（序列化）按钮时，底部的两个`<div>`元素将填充来自 `formA`\
  \ 的序列化数据。\n\n![Image](img/image00921.jpeg)\n\n**图 13.3** 表单到表单的操作，展示了如何向表单读写数据以及对表单值进行序列化。\n\
  \n**代码 13.1 form_manipulation.html 实现示例中用表单元素的 HTML 文档**\n\n点击此处查看代码图片\n\n* *\n\n\
  ```html\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n04      <title>Form Manipulation</title>\n\
  05      <meta charset=\"utf-8\" />\n06      <script type=\"text/javascript\" src=\"\
  https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07      <script type=\"\
  text/javascript\" src=\"js/form_manipulation.js\"></script>\n08      <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"css/form_manipulation.css\">\n09   </head>\n\
  10   <body>\n11       <div><form id=\"formA\">\n12           <label>Time</label><br>\n\
  13           <input type=\"image\" src=\"/images/day.png\" />\n14           <input\
  \ type=\"image\" src=\"/images/night.png\" /><br>\n15           <input name=\"tilte\"\
  \ type=\"text\" /><br>\n16           <textarea name=\"comments\"></textarea><br>\n\
  17           <input type=\"radio\" name=\"gender\" value=\"male\">Male\n18     \
  \      <input type=\"radio\" name=\"gender\" value=\"female\">Female<br>\n19   \
  \        <input type=\"checkbox\" name=\"Registered\">Registered<br>\n20       \
  \    <select size=3 multiple name=\"count\">\n21               <option>One</option><option>Two</option><option>Three</option>\n\
  22           </select><br>\n23           <input id=\"resetB\" type=\"button\" value=\"\
  Reset\"></input>\n24           <input id=\"serializeB\" type=\"button\" value=\"\
  Serialize\"></input>\n25       </form></div>\n26       <div><form id=\"formB\">\n\
  27           <label>Destination</label><br>\n28           <input type=\"image\"\
  \ alt=\"No Image\"></input><br>\n29           <input type=\"text\" /><br>\n30  \
  \         <textarea></textarea><br>\n31           <input type=\"radio\" name=\"\
  gender\" value=\"male\">Male</input>\n32           <input type=\"radio\" name=\"\
  gender\" value=\"female\">Female</input><br>\n33           <input type=\"checkbox\"\
  >Checked</input><br>\n34           <select size=3 multiple>\n35               <option>One</option><option>Two</option><option>Three</option>\n\
  36           </select>\n37       </form></div><br>\n38       <div><label>Serialized</label><p\
  \ id=\"serialized\"></p>\n39       <div><label>Serialized Array</label><span id=\"\
  serializedA\"></span></div>\n40   </body>\n41 </html>\n```\n\n* *\n\n**代码 13.2 form_manipulation.js\
  \ 实现一系列处理器的 jQuery 和 JavaScript 代码，用于从一个表单读取数据并更新第二个表单**\n\n点击此处查看代码图片\n\n* *\n\n\
  ```javascript\n01 $(document).ready(function(){\n02   $(\"#formA:text\").keyup(function(){\n\
  03     $(\"#formB:text\").val($(this).val());\n04   });\n05   $(\"#formA textarea\"\
  ).keyup(function(){\n06     $(\"#formB textarea\").val($(this).val());\n07   });\n\
  08   $(\"#formA:radio\").change(function(){\n09     var radioB = $(\"#formB input[value=\"\
  \ + $(this).val() + \"]\");\n10     radioB.prop(\"checked\", $(this).is(\":checked\"\
  ));\n11   });\n12   $(\"#formA:checkbox\").click(function(){\n13     $(\"#formB:checkbox\"\
  ).prop(\"checked\", $(this).prop(\"checked\"));\n14   });\n15   $(\"#formA select\"\
  ).change(function(){\n16     $(\"#formB select\").val($(this).val());\n17   });\n\
  18   $(\"#formA label\").click(function(){\n19     $(\"#formB label\").html(new\
  \ Date().UTCString());\n20   });\n21   $(\"#formA input:image\").click(function(e){\n\
  22     $(\"#formB input:image\").attr(\"src\", $(this).attr(\"src\"));\n23     e.preventDefault();\n\
  24   });\n25   $(\"#resetB\").click(function(){\n26     $(\"#formB\").get(0).reset();\n\
  27     $(\"#formB input:checked\").prop(\"checked\", false);\n28     $(\"#formB\
  \ input:image\").attr(\"src\", \"\");\n29   });\n30   $(\"#serializeB\").click(function(e){\n\
  31     $(\"#serialized\").html($(\"#formA\").serialize());\n32     $(\"#serializedA\"\
  ).empty();\n33     var arr = $(\"#formA\").serializeArray();\n34     jQuery.each(arr,\
  \ function(i, prop){\n35       $(\"#serializedA\").append($(\"<p>\" + prop.name\
  \ + \" = \" + prop.value + \"</p>\"));\n36     });\n37   });\n38 });\n```\n\n* *\n\
  \n**代码 13.3 form_manipulation.css 用于设置表单元素的 CSS 代码**\n\n点击此处查看代码图片\n\n* *\n\n```css\n\
  input[type=image] {height:40px; margin-top:15px;}\ndiv{\n  vertical-align:top; width:300px;\
  \ height:auto;\n  display:inline-block; padding:20px; margin:5px;\n  border-radius:10px;\n\
  }\n```\n\n\n\n\n表单流程动态控制的另一个重要方面是拦截 `submit` 和 `reset` 事件，并根据各种条件执行操作。例如，你可能希望在提交表单之前对表单值进行验证。\n\
  \n你通过在表单上绑定 `submit` 事件处理器来控制表单的提交函数。在事件处理器内部，你可以访问有关事件的信息以及将提交的表单数据。你可以执行任何需要的任务，然后允许表单提交、重置或阻止浏览器的默认行为。\n\
  \n以下代码演示了通过在事件上调用 `.preventDefault()` 来停止表单提交的示例：\n\n```javascript\n$(\"form\").submit(function(e){\n\
  \    alert(\"Sorry. Not yet Implemented.\");\n    e.preventDefault();\n});\n```\n\
  \n由于某些原因，`jQuery` 没有为表单的 `reset` 事件提供事件处理器。要在 jQuery 中解决这个问题，请将重置按钮的输入 `type` 从\
