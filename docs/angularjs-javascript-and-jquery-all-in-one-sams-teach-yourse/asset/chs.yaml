  \ `count`: 表示间隔重复的次数。\n\n![Image](img/image00767.jpeg) `invokeApply`: 是一个布尔值，如果为\
  \ `true`，则导致仅在 AngularJS 事件循环的 `$apply()` 块中执行函数。默认值为 `true`。\n\n当你调用 `$interval()`\
  \ 和 `$timeout()` 方法时，它们会返回一个 promise 对象，你可以使用该对象来取消超时或间隔。要取消现有的 `$timeout` 或 `$interval`，请调用\
  \ `cancel()` 方法。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar myInterval = $interval(function(){$scope.seconds++;},\
