  35. 观察图 2.16。\n36. 标签页糟糕的 CSS 布局导致网页变得难看。\n\n***\n\n### 调试 JavaScript\n\n你已经学会了在\
  \ JavaScript 控制台中查找 JavaScript 和其他脚本的异常错误。如果你的脚本没有引起任何浏览器错误，但运行方式不符合你的预期呢？所有的浏览器都提供了非常好的集成调试器来帮助。接下来的部分介绍如何使用\
  \ Chrome 开发者工具调试 JavaScript。\n\n#### 导航 JavaScript 调试器\n\nJavaScript 调试器允许你查看随网页加载的\
  \ JavaScript 脚本。除了查看脚本之外，你还可以设置断点、观察变量值并查看调用栈，就像使用任何其他调试器一样。\n\n图 2.21 显示了开发者工具中提供的\
  \ JavaScript 调试器组件。通过 JavaScript 调试器，你可以访问以下功能：\n\n- **JavaScript 视图**——显示实际的 JavaScript\
  \ 代码。\n- **源选择菜单**——此菜单列出了随网页加载的所有源文件列表。你可以点击此菜单来选择要在视图中加载的 JavaScript 文件。\n\n\n\
  \n\n\n![Image](img/image00767.jpeg) **异常暂停**—当选择此选项时，如果发生 JavaScript 异常，浏览器将进入调试器并停止执行。\n\
  \n![Image](img/image00767.jpeg) **监视**—图 2.21 中显示的监视面板列出了在代码当前执行时可用的函数、变量、属性等。这是一个非常有价值的窗口。在这里，你可以看到代码执行过程中变量和对象的值。此外，你可以通过点击监视列表顶部的加号图标向监视面板添加自己的表达式。监视面板的一个非常棒的功能是，你可以双击变量值并更改执行时使用的值。这是测试“假设”场景的极佳方法。\n\
  \n![Image](img/image00767.jpeg) **调用堆栈**—调用堆栈面板提供了导致当前执行代码行的函数调用历史。调用堆栈面板最有价值的方面之一是通过展开函数名称查看传递给每个函数的参数值。你还可以点击函数名，该文件将在\
  \ JavaScript 视图中加载并高亮显示该行代码。\n\n![Image](img/image00767.jpeg) **断点**—断点允许你指定执行 JavaScript\
  \ 时何时停止。当你设置了断点时，浏览器会在执行该行代码之前停止执行并进入调试器。你可以通过点击 JavaScript 视图中代码行左侧来设置断点。它们由红点表示。要删除断点，只需点击它。断点面板显示已设置的断点列表。你可以通过取消旁边的复选框来禁用断点。你可以点击“禁用断点”按钮来禁用断点。\n\
  \n![Image](img/image00767.jpeg) **当前执行行**—当前正在执行的代码行由黄色箭头表示。\n\n![Image](img/image00767.jpeg)\
  \ **恢复**—这允许脚本继续执行，直到遇到另一个断点（如果有的话）。\n\n![Image](img/image00767.jpeg) **进入**—当你点击此图标时，代码将前进一行。如果该行代码正在执行另一个函数，你将进入该函数的第一行代码。\n\
  \n![Image](img/image00767.jpeg) **跳过**—当你点击此图标时，代码将前进一行。如果该行代码正在执行另一个函数，该函数将被执行，然后你将进入当前函数中的下一行代码。如果在跳过函数时遇到断点，浏览器将在脚本的该位置停止执行。\n\
  \n![Image](img/image00767.jpeg) **跳出**—当你点击此图标时，当前函数执行完毕，你将回到调用函数中的下一行代码。\n\n![Image](img/image00801.jpeg)\n\
  \n**图 2.21** 开发者工具 JavaScript 调试器提供了代码、监视、堆栈和断点视图。\n\n***\n\n## 尝试自己：使用 JavaScript\
  \ 调试器\n\n以下示例将帮助你更熟悉 JavaScript 调试器。考虑列表 2.4 中的代码。这是一个包含按钮和计数字符串的基础网页。HTML 包含两个\
  \ `<div>` 元素。第一个 `<div id=\"clicker\" onclick=\"countIt()\">` 用于简单的按钮。当你点击按钮时，会调用\
  \ JavaScript 函数 `countIt()`。第二个 `<div id=\"counter\">` 用于显示数字。\n\nJavaScript 应该在每次点击按钮时数字加\
  \ 1。然而，JavaScript 代码存在一个问题；数字不会超过 2。\n\n**列表 2.4 debug.html 带有 JavaScript 错误的极简\
  \ HTML 文档示例**\n\n点击此处查看代码图像\n\n***\n\n```\n01 <!DOCTYPE html>\n02 <html\n03    <head>\n\
  04      <meta charset=\"utf-8\" />\n05      <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n06      <script>\n07        function incCount(){\n08          var cnt\
  \ = 1;\n09          cnt += 1;\n10          return cnt;\n11        }\n12        function\
  \ countIt(){\n13          $(\"#counter\").html(incCount);\n14        }\n15     \
  \ </script>\n16      <style>\n17        #clicker{\n18          color: red;\n19 \
  \         font-weight: bold;\n20        }\n21        #counter{\n22          border:\
  \ 1px solid #000;\n23          width: 50px;\n24          height: 50px;\n25     \
  \   }\n26      </style>\n27 </head>\n28 <body>\n29      <div id=\"clicker\" onclick=\"\
  countIt()\">Click Me</div>\n30      <div id=\"counter\">0</div>\n31 </body>\n32\
  \ </html>\n```\n\n1. 在 Chrome 中打开 JavaScript 调试器。\n2. 在 Chrome 中打开 `debug.html`。\n\
  3. 在第 8 行设置断点。\n4. 点击按钮。\n5. 在“作用域变量”（Scope Variables）面板中观察 `cnt` 变量。\n6. 逐行执行代码。\n\
  7. 观察 `cnt` 如何每次点击时被重置。\n8. 要修复这个问题，请在 Eclipse 原始文件中交换第 7 行和第 8 行，使 `cnt` 的定义出现在\
  \ `countIt()` 的定义之前。这会在脚本加载时定义变量 `cnt` 并仅设置一次值。保存文件。\n\n\n\n\n\n17. 无需每次在调试时都展开\
  \ Window（窗口）元素，只需点击图 2.24 所示监视列表顶部的 `New Watch Expression`（新建监视表达式），输入 `cnt` 并按\
  \ `Enter`。这会在 `cnt` 变量的最上方直接添加一个新的监视表达式，如图图 2.24 所示。\n\n18. 点击 `Step Over`（单步）图标，`cnt`\
  \ 将变为 2。然后点击 `Continue`（继续）按钮恢复执行。\n\n19. 点击网页上的按钮，此时 `cnt` 变量将显示为 2。当你点击 `Step\
  \ Over` 按钮时，`cnt` 变量将变为 3。\n\n20. 程序似乎运行正常，因此点击第 9 行上的断点以移除断点，然后点击 `Continue` 按钮恢复执行。\n\
  \n21. 现在每当你点击按钮时，数字都会递增。你刚刚调试了 JavaScript。\n\n这是一个非常基础的示例，但为了方便跟进步骤并熟悉调试器的工作原理，我们做了简化处理。在完成书中的练习时，你可能会多次回到调试器。请记住这些基本步骤：设置断点并在单步执行代码时观察变量。\n\
  \n###那么如何调试 jQuery 或 AngularJS？\n\n这是一个经常出现的问题，即使对于那些具有 JavaScript 调试经验的人来说，也是如何调试\
  \ jQuery 或 AngularJS。答案很简单：AngularJS、jQuery 以及许多 JavaScript 插件和版本仅仅是额外的 JavaScript\
  \ 代码。要调试 AngularJS 或 jQuery，请在项目中使用未压缩（nonminified）格式的库文件。你将在本书的后后部分学习如何操作。\n\n\
  你下载未压缩版本的原因是压缩后的版本是不可读的。所有内容都挤在了一行中，在调试器中显示效果很差。未压缩的版本以可读的格式格式化。\n\n注意\n即使你无法获取\
  \ JavaScript 文件的未压缩版本，也可以在 Eclipse 中打开该文件，并从主菜单选择 `File`（文件）-> `Format`（格式化）。Eclipse\
  \ 会自动将文件格式化为可读的形式。大多数 IDE 都有此类功能。\n\n格式化了 AngularJS、jQuery 或任何其他 JavaScript 库后，你就可以像调试其他\
  \ JavaScript 文件一样调试它了。\n\n### 分析网络流量\n\n开发者工具中有一个在调试 JavaScript 时非常有用的工具，就是网络流量分析器。网络流量分析器如图\
  \ 2.25 所示，通过点击开发者工具中的 `Net` 标签可以使用。流量分析器显示了从浏览器到 Web 服务器每个请求的信息。这让你能够更好地理解正在传输什么数据，以及请求是否发生，以及顺序是否正确。\n\
  \n![Image](img/image00805.jpeg)\n\n**图 2.25** 加载 [amazon.com](http://amazon.com)所需的网络流量。\n\
  \n图 2.25 显示了加载 [amazon.com](http://amazon.com) 网页涉及的流量。有许多请求，每个请求对应流量列表中的一行。对于每个请求，流量中显示以下内容：\n\
  \n![Image](img/image00767.jpeg) **URL Path**——请求的 URL 非常有用。你可以右键点击 URL 并复制它，甚至在另一个标签页或窗口中打开它。这允许你调试单个请求，而不是整个网页加载。\n\
  \n![Image](img/image00767.jpeg) **Method**——请求中使用的 HTTP 方法类型。\n\n![Image](img/image00767.jpeg)\
  \ **Status**——你可以使用状态来确定请求是否成功以及是否仍在运行。例如，网页看起来可能正常可能是因为某个图像请求加载失败，这在开发者工具的 `Net`\
  \ 标签中非常容易诊断。\n\n![Image](img/image00767.jpeg) **Type**——请求获取的数据类型。\n\n![Image](img/image00767.jpeg)\
  \ **Initiator**——请求发起的来源。\n\n![Image](img/image00767.jpeg) **Size**——大小可能很有用，因为它允许你快速找到需要大量磁盘空间和网络带宽的请求。\n\
  \n![Image](img/image00767.jpeg) **Latency**——显示请求以毫秒为单位的延迟。\n\n![Image](img/image00767.jpeg)\
  \ **Timeline**——显示请求花费的毫秒时间。这在诊断响应缓慢的网页和其他速度相关问题时非常有用。\n\n注意\n`Network` 标签顶部的选项允许你禁用浏览器缓存。当你更新\
  \ Web 服务器上的文件以调试和修复问题时，此选项非常有用。当勾选此选项时，浏览器将始终从 Web 服务器获取最新内容。\n\n对于某些复杂的网页，流量可能太多，无法调试所有请求。`Net`\
  \ 标签中的过滤选项允许你只查看某些类型的请求，例如 HTML、CSS 或 JS。`XHR` 过滤器代表 `XMLHttpRequest`，它是 AJAX 中使用的通信方式。\n\
  \n当你展开一个请求时（如图 2.26 所示），你可以获得关于该请求的大量信息。可用标签取决于请求类型，这里是一些实用的：\n\n![Image](img/image00767.jpeg)\
  \ **Headers**——显示发送的请求头。如果你通过 AJAX 访问特定的头，这非常有用。\n\n![Image](img/image00767.jpeg)\
  \ **Preview**——显示数据的预览。如果这是一个 POST 请求，它会显示发送的参数。\n\n![Image](img/image00767.jpeg)\
  \ **Response**——取决于响应的内容。例如，如果你正在从服务器下载 JavaScript 文件，它显示原始 JavaScript；对于 HTML 文件，它显示\
  \ HTML。\n\n![Image](img/image00767.jpeg) **Cookies**——显示请求涉及的 Cookie 值。\n\n![Image](img/image00767.jpeg)\
  \ **Timing**——显示请求的时间信息，包括发送时间、等待时间和下载时间。\n\n![Image](img/image806.jpeg)\n\n**图\
  \ 2.26** 展开请求提供了更多信息。\n\n### 总结\n\n在本节中，你学习了调试动态网页问题的多种方法。你学习了如何将脚本信息输出到 JavaScript\
  \ 控制台。你学习了如何使用元素检查器查看浏览器在加载网页时构建的 HTML 元素。\n\n你还遵循了 HTML、CSS 和 JavaScript 问题的多个示例。在本节中中学的方法对于你完成本书以及未来的项目将非常有帮助，因为它们可以节省你调试那些总是出现的简单语法问题产生的时间和精力。\n\
  \n### 问答\n\nQ 有方法调试服务器端脚本吗？]\n\nA 有，这种方法。这真的超出了本书的范围；但大多数优秀的语言都有远程调试问题的方法。如果你正在尝试调试\
  \ PHP 服务器端脚本，请查看 ZEND 的功能（www.zend.com/en/community/pdt）。如果你正在使用 Python 服务器端脚本，请检查并使用\
  \ PyDev（pydev.org）。]\n\nQ 有方法调试 Cookie 吗？]\n\n\n\n\n\n## A\n\n在调试 cookie 时，你只需要知道\
  \ cookie 是否已启用、浏览器中设置了哪些 cookie、cookie 的值是什么以及它们何时过期。所有这些信息可以在开发者工具的 Cookies 标签页中找到。Chrome\
  \ 和 Internet Explorer 的开发者控制台中也有类似的功能。\n\n### 工作坊 (Workshop)\n\n工作坊由一组问答组成，旨在巩固你对本节涵盖内容的理解。在查看答案之前，尝试回答这些问题。\n\
