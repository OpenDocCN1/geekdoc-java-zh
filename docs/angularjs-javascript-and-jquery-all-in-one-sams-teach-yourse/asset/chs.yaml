  \n***\n\n## 使用 jQuery UI 生成样式化对话框\n\n对话（dialog）小部件是 jQuery UI 中非常有用的包含。你可以轻松地放弃\
  \ JavaScript 提供的简单对话框，并将其替换为具有样式属性甚至表单的对话框。\n\n列表 19.5 中的代码创建了一个包含图像、图标、按钮和一些样式化文本的\
  \ jQuery UI 对话框。视觉效果可以在图 19.5 中看到。以下选项是示例的一部分：\n\n![Image](img/image00767.jpeg)\
  \ `modal`—布尔值。当为 `true` 时，在对话框返回之前，页面上的其他项目将被禁用。\n\n![Image](img/image00767.jpeg)\
  \ `buttons`—这是一个对象，其属性键指定了按钮名称以及在按钮上显示的文本。属性值指定了点击该按钮时将调用的函数。注意在第 13 行中，使用 `buttons`\
  \ 属性指定了一个名为 `Sweet` 的按钮，它执行一个关闭对话框的函数。\n\n![Image](img/image00981.jpeg)\n\n**图 19.5**\
  \ 样式化的 jQuery UI 对话框。\n\n**列表 19.5 widgets_dialogs.html 使用 jQuery, CSS, 和 HTML 实现对话框**\n\
  \n点击此处查看代码图像\n\n```javascript\n...jQuery...\n$(document).ready(function(){\n  $(\
  \ \"#dialog\" ).dialog({ modal: true,\n    buttons: { Sweet: function() {\n    \
  \  $( this ).dialog( \"close\" )} }}}\n  });\n});\n...CSS...\nimg { height:60px;\
  \ float:left; }\n...HTML...\n<div id=\"dialog\" title=\"Successful\">\n  <p>\n \
