  \nWeb 表单验证是编程中最关键的部分之一。通过在浏览器端直接捕捉问题而不是在表单提交到服务器之后，可以节省大量的用户时间。\n\n### 问答\n\n**可以使用\
  \ jQuery 插件创建自己的验证规则吗？**\n\n可以。你可以调用 `.validate()` 返回的 Validator 对象的 `addMethod(name,\
  \ function(value, parameters) [,message])` 方法。你指定的 `name` 将作为新规则；调用函数并将当前值和元素传递给它。如果元素值有效，函数应返回\
  \ `true` 或 `false`。可选的 message 参数是运行显示的消息。\n\n**有什么方法可以隐藏 `<select>` 元素上难看的滚动条吗？**\n\
  \n并没有真正的办法。\n\n## 工作\n\n工作坊包含一组旨在巩固你对本节内容理解的问题。在查看答案之前，尝试回答这些问题。\n\n### 测验\n\n1.\
  \ 如何通过 jQuery 获取 `<select>` 元素的值？\n2. 如何通过 jQuery 禁用表单元素？\n3. 列出两种通过 jQuery 判断复选框是否被选的方法。\n\
  4. 语句 `$(\"input:text\").blur();` 执行了什么？\n\n### 测验答案\n\n1. 在代表它的 jQuery 对象上调用 `.val()`\
  \ 方法。\n\n\n\n\n\n[2]. 在代表该元素的 jQuery 对象上调用 `.prop(\"disabled\",\"disabled\")`。\n\
  \n[3]. 在该 jQuery 对象上调用 `.prop(\"checked\")` 或 `.is(\":selected\")`。\n\n[4]. 它会移除所有类型为\
  \ `text` 的 `<input>` 元素的焦点。\n\n### 练习题\n\n**1.** 打开[列表 13.1]、[13.2] 和 [13.3] 中的代码，并修改代码使\
