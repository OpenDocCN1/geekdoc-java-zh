  17     };\n18   },\n19     templateUrl: 'my_photos.html'\n20   };\n21 })\n```\n\n\
  4. `myPhotos` 指令中的以下行指定了在渲染指令时使用 `my_photos.html` 作为模板：\n\n```javascript\n19   templateUrl:\
