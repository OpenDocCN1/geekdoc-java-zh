  \ Screen is: \\n\" +\n        window.screen.availWidth + \"X\" + window.screen.availHeight);\n\
  \    }]);\n```\n\n### 使用 $cookie 服务与浏览器 Cookie 交互\n\nAngularJS 提供了获取和设置 Cookie 的服务：`$cookie`\
  \ 和 `$cookieStore`。Cookie 在浏览器中提供临时存储，即使用户离开网页或关闭浏览器也会存在。\n\n`$cookie` 服务允许你通过点符号获取并更改字符串\
  \ Cookie 值。例如，以下代码获取了名为 `appCookie` 的 cookie 值，然后更改了它：\n\n```javascript\nvar cookie\
  \ = $cookies.appCookie;\n\n$cookies.appCookie = 'New Value';\n```\n\n\n\n\n\n`$cookieStore`\
  \ 服务提供了 `get()`、`put()` 和 `remove()` 函数用于获取、设置和删除 cookie。`$cookieStore` 服务的一个非常好的特性是它在设置\
  \ cookie 之前会将 JavaScript 对象值序列化为 JSON 字符串，然后在获取时将它们反序列化回对象。\n\n要使用 `$cookie` 和 `$cookieStore`\
  \ 服务，你需要完成三件事。首先，在模板中于 `angular.js` 之后但 `application.js` 之前加载 `angular-cookies.js`\
  \ 库。例如：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://code.angularjs.org/1.3.0/angular.min.js\"\
  ></script>\n<script src=\"http://code.angularjs.org/1.3.0/angular-cookies.min.js\"\
  ></script>\n```\n\n### 顺一下\n\n你也可以从 AngularJS 网站 [`code.angularjs.org/`](http://code.angularjs.org/)-<version>/\
  \ 下载 `angular-cookies.js` 文件，其中 `<version>` 是你正在使用的 AngularJS 版本。根据你使用的 AngularJS\
  \ 版本，你可能还需要下载 `angular-cookies.min.js.map` 文件。\n\n其次，在你的应用程序 `Module` 定义的所需项列表中添加\
  \ `ngCookies`。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp',\
  \ ['ngCookies']);\n```\n\n第三，将 `$cookies` 或 `$cookieStore` 服务注入你的控制器中。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\napp.controller('myController', ['$scope', '$cookieStore',\n   \
  \                            function($scope, cookieStore) {\n\n}]);\n```\n\n###\
