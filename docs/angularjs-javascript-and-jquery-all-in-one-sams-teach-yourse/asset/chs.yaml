  \ 表达式只有在点击 `Click to Add Values` 按钮时才会变化。\n\n![Image](img/image0998.jpeg)\n\n**图\
  \ 22.2** 一个简单的 AngularJS 模板，它实现控制器并将多个字段链接到作用域，以提供值的输入和结果显示。\n\n**列表 22.3 scope_template.js\
  \ 实现支持模板的基础控制器**\n\n点击此处查看代码图片\n\n***\n\n```javascript\n01 angular.module('myApp',\
  \ []).\n02    controller('SimpleTemplate', function($scope) {\n03      $scope.valueA\
  \ = 5;\n04      $scope.valueB = 7;\n05      $scope.valueC = 12;\n06      $scope.addValues\
  \ = function(v1, v2) {\n07        $scope.valueC = v1 + v2;\n08      };\n```\n\n\
  ***\n\n**列表 22.4 scope_template.html 实现控制器并将各种字段链接到作用域的 HTML 模板**\n\n```html\n01\
  \ <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04   <title>AngularJS\
  \ Scope</title>\n05 </head>\n06 <body>\n07 <div ng-controller=\"SimpleTemplate\"\
  >\n08   ValueA: <input type=\"number\" ng-model=\"valueA\" /><br>\n09   ValueB:\
  \ <input type=\"number\" ng-model=\"valueB\" /><br><br>\n10   Expression: {{valueA}}\
  \ + {{valueB}}<br><br>\n11   Live Expression Value: {{valueA + valueB}}<br><br>\n\
  12   <input type=\"button\" ng-click=\"addValues(valueA, valueB)\"\n13     value\
  \ =\"Click to Add Values {{valueA}} & {{valueB}}\" /><br>\n14   Clicked Expression\
  \ Value: {{valueC}}<br>\n15 </div>\n16 <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n17 <script src=\"js/scope_template.js\"></script>\n18 </body>\n19 </html>\n\
  ```\n\n\n\n\n\n在创建阶段，还会创建一个与浏览器事件循环交互的 **digest 循环（digest loop）**。digest 循环负责根据模型的更改来更新\
  \ DOM 元素，并执行任何已注册的监听器（watcher）函数。虽然你永远不需要手动执行 digest 循环，但你可以通过在 scope 上执行 `$digest()`\
  \ 方法来实现。例如，下面的代码评估任何异步更改，然后执行 scope 上的监听函数：\n\n```\n$scope.$digest()\n```\n\n###\
  \ 监听器注册阶段 (The Watcher Registration Phase)\n\n监听器注册阶段为模板中表示的 scope 值注册监听。这些监听会自动将模型的变化传播到\
  \ DOM 元素。\n\n你还可以使用 `$watch()` 方法在 scope 属性上注册你自己的监听函数。该方法接受 scope 属性名作为第一个参数，并将一个回调函数作为第二个参数。当\
  \ scope 中的属性发生变化时，旧值和新值将传递给该回调函数。\n\n例如，下面的代码为 scope 中的属性 `watchedItem` 添加了监听，并在它每次变化时将计数器加\
  \ 1：\n\n点击此处查看代码图片\n\n```javascript$scope.watchedItem = 'myItem';\n$scope.counter\
  \ = 0;\n$scope.$watch('watchedItem', function(newValue, oldValue) {\n  $scope.watchedItem\
  \ = $scope.counter + 1;\n});\n```\n\n### 模型变异阶段 (The Model Mutation Phase)\n\n当\
  \ scope 中的数据发生变化时，就会发生模型变异。当你从 AngularJS 代码中进行更改时，名为 `$apply()` 的 scope 函数会更新模型并调用\
  \ `$digest()` 函数来更新 DOM 和监听器。这就是你在 AngularJS 控制器或通过 `$http`、`$timeout` 和 `$interval`\
  \ 服务所做的更改自动更新到 DOM 中的方式。\n\n你应该尝试在 AngularJS 控制器或服务内部对 scope 进行更改。然而，如果你必须在 AngularJS\
  \ 范围之外更改 scope，你需要在 scope 上调用 `scope.$apply()` 以强制模型和 DOM 正确更新。`$apply()` 方法接受表达式作为唯一参数。该表达式会被求值并返回，然后调用\
  \ `$digest()` 方法来更新 DOM 和监听器。\n\n### 变异观察阶段 (The Mutation Observation Phase)\n\n\
  当 digest 循环、`$apply()` 调用或手动执行 `$digest()` 方法时，就会发生变异观察阶段。当 `$digest()` 执行时，它会评估所有监听的变化。如果某个值发生了变化，`$digest()`\
  \ 会调用 `$watch` 监听并更新 DOM。\n\n### Scope 销毁阶段 (The Scope Destruction Phase)\n\n`$destroy()`\
  \ 方法从浏览器内存中移除 scope。AngularJS 库会在子 scope 不再时自动调用此方法。`$destroy()` 方法会停止 `$digest()`\
  \ 调用并移除监听，允许浏览器垃圾回收器回收内存。\n\n### 实现 Scope 层级结构 (Implementing Scope Hierarchy)\n\n\
  scope 的一个伟大特性是它们是按层次结构组织的。这种层次结构有助于你保持 scope 的有序，并与它们代表的视图上下文相关。在 AngularJS 模块级别有一个根\
  \ scope（root scope），然后在子组件（如控制器或指令）中实现子 scope。子 scope 可以相互嵌套，创建层级结构。\n\n#### 顺带一下\n\
  \n`$digest()` 方法利用 scope 层级结构将 scope 更改传播到相应的监听器和 DOM 元素。\n\nScope 层级结构根据 AngularJS\
  \ 模板中 `ng-controller` 语句的位置自动创建。例如，下面的模板代码定义了两个 `div` 元素，它们创建了同级的控制器实例：\n\n点击此处查看代码图片\n\
  \n```html\n<div ng-controller=\"controllerA\"> . . . </div>\n<div ng-controller=\"\
  controllerB\"> . . . </div>\n```\n\n然而，下面的模板代码定义了控制器，其中 `controllerA` 是 `controllerB`\
  \ 的父级：\n\n点击此处查看代码图片\n\n```html\n<div ng-controller=\"controllerA\">\n  <div ng-controller=\"\
  controllerB\"> . . . </div>\n</div>\n```\n\nScope 层级结构的工作类似于面向对象语言中的对象继承。你可以从控制器访问父级\
  \ scope 值，但无法访问兄弟或子 scope 值。如果你在子 scope 中添加属性名，它不会覆盖父级，而是在子 scope 中创建一个同名的属性，其值与父级不同。\n\
  \n* *\n\n### 亲自尝试一下：实现嵌套控制器和 scope\n\n在这个示例中，你将观察嵌套控制器内 scope 的行为。列表 22.5 和 22.6\
  \ 实现了一个基本的嵌套 scope 层级结构，以演示 scope 在层级中是如何工作的。列表 22.5 创建包含三个控制器的应用程序，每个控制器定义了两个 scope\
  \ 项。它们共享公共 scope 属性 `title` 以及 scope 属性 `valueA`、`valueB` 和 `valueC`。列表 22.6 在 AngularJS\
  \ 模板中创建了三个控制器。\n\n使用以下步骤构建带有嵌套控制器和 scope 的应用程序：\n\n1. 添加 `lesson22/scope_hierarchy.html`\
  \ 和 `lesson22/js/scope_hierarchy.js` 文件。\n2. 将 列表 22.5 和 22.6 所示的代码添加到相应文件中。\n3.\
  \ 列表 22.5 代码实现了三个控制器：`LevelA`、`LevelB` 和 `LevelC`。每个控制器定义了 `title`、`value` 和 `inc()`\
  \ 函数。\n\n```javascript\n$scope('LevelA', function($scope) {\n  $scope.title = \"\
  Level A\";\n  $scope.value = 1;\n  $scope.inc = function() {\n    $scope.value++;\n\
  \  };\n});\n```\n4. 在 列表 22.6 中，嵌套了以下 `div` 元素：\n```html\n<div ng-controller=\"\
  controllerA\">\n  <div ng-controller=\"controllerB\"></div>\n  <div ng-controller=\"\
  controllerC\"></div>\n</div>\n```\n5. `div` 中的以下模板显示 `LevelA` 的 `title` 和 `valueA`\
  \ 值，并在点击按钮时调用 `LevelA` 的 `inc()` 函数：\n\n```html\n<div>\n  {{title}}\n  {{valueA}}\n\
  \  <button ng-click=\"inc()\">+</button>\n</div>\n```\n6. `div` 中的以下模板显示 `LevelB`\
  \ 的 `title` 和 `valueB` 值，但也包含 `LevelA` scope 的 `valueA` 值。此外，当点击此按钮时，执行的是 `LevelB`\
  \ 的 `inc()` 函数：\n\n```html\n<div>\n  {{title}}\n  {{valueB}}\n  <button ng-click=\"\
  inc()\">+</button>\n</div>\n```\n7. `div` 中的以下模板显示 `LevelC` 的 `title` 和 `valueC`\
  \ 值，但也包含 `LevelA` scope 的 `valueA` 值以及 `LevelB` scope 的 `valueB` 值。此外，当点击此按钮时，执行的是\
  \ `LevelC` 的 `inc()` 函数：\n\n```html\n<div>\n  {{title}}\n  {{valueC}}\n  <button\
  \ ng-click=\"inc()\">+</button>\n</div>\n```\n\n\n\n\n## 8. 图 22.3 显示了渲染后的 AngularJS\
  \ 应用。注意三个作用域（scope）中 `title` 属性的值都是不同的。这是因为在层次结构中的每一层都创建了新的 `title` 属性。\n\n![图像](img/image00999.jpeg)\n\
  \n**图 22.3** 实现了一个从多级作用域渲染结果的控制器层级。\n\n**列表 22.5 scope_hierarchy.js 实现一个可以访问每层属性的基本作用域层级**\n\
  \n点击此处查看代码图像\n\n```javascript\n01 angular.module('myApp', []).\n02   controller('LevelA',\
  \ function($scope) {\n03     $scope.title = \"Level A\"\n04     $scope.valueA =\
  \ 1;\n05     $scope.inc = function() {\n06       $scope.valueA++;\n07     };\n08\
  \   }).\n09   controller('LevelB', function($scope) {\n10     $scope.title = \"\
  Level B\"\n11     $scope.valueB = 1;\n12     $scope.inc = function() {\n13     \
  \  $scope.valueB++;\n14     };\n15   }).\n16   controller('LevelC', function($scope)\
  \ {\n17     $scope.title = \"Level C\"\n18     $scope.valueC = 1;\n19     $scope.inc\
  \ = function() {\n20       $scope.valueC++;\n21     };\n22   });\n```\n\n**列表 22.6\
  \ scope_hierarchy.html 实现控制器层级并渲染多级作用域结果的 HTML 模板代码**\n\n点击此处查看代码图像\n\n```html\n\
  01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04 <title>AngularJS Scope\
  \ Hierarchy</title>\n05 </head>\n06 <body>\n07     <div ng-controller=\"LevelA\"\
  >\n08       <h3>{{title}}</h3>\n09       ValueA = {{valueA}} <input type=\"button\"\
  \ ng-click=\"inc()\" value=\"+\" />\n10       <div ng-controller=\"LevelB\"><hr>\n\
  11         <h3>{{title}}</h3>\n12         ValueA = {{valueA}}<br>\n13         ValueB\
  \ = {{valueB}}\n14         <input type=\"button\" ng-click=\"inc()\" value=\"+\"\
  \ />\n15         <div ng-controller=\"LevelC\"><hr>\n16           <h3>{{title}}</h3>\n\
  17             ValueA = {{valueA}}<br>\n18             ValueB = {{valueB}}<br>\n\
  19             ValueC = {{valueC}}\n20             <input type=\"button\" ng-click=\"\
  inc()\" value=\"+\" />\n21         </div>\n22       </div>\n23     </div>\n24  \
  \   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n25\
  \     <script src=\"js/scope_hierarchy.js\"></script>\n26 </body>\n27 </html>\n\
  ```\n\n### 总结\n作用域（scope）是 AngularJS 应用中数据的确定源。作用域与模板视图、控制器、模块和服务之间有直接关系，并充作为将应用程序绑定在一起的胶水。作用域还作为数据库或其他服务器端数据的表示。作用域的生命周期与浏览器事件循环相关，因此浏览器中的更改可以改变作用域，而作用域的变化会反映在绑定到作用域的\
  \ DOM 元素中。你还可以添加自定义的监听函数，当作用域发生变化时接收通知。作用域被组织成层次结构，根作用域（root scope）定义在该层。每个控制器的实例都会获得一个子作用域实例。从子作用域，你可以访问存储在父作用域中的数据。\n\
  \n### 问答\n**Q](#part0037.xhtml_ch22aa01)** 作用域必须与数据完全匹配吗——例如来自服务器的数据？\n**A](#part0037.xhtml_ch22qq01)**\
  \ 不，AngularJS 应用的作用域应该匹配应用程序本身所需。然而，尽可能保持与后端数据匹配可以使代码更易维护。\n\n**Q](#part0037.xhtml_ch22aa02)**\
  \ 是否可以从 AngularJS 外部修改作用域？\n**A](#part0037.xhtml_ch22qq02)** 是的，你始终可以使用 `angular(element).scope()`\
  \ 访问作用域。但是，通常最好只在作用域内部修改它。\n\n### 工作坊\n该工作坊由一系列问题和答案组成，旨在巩固你对本节涵盖内容的理解。请在查看答案之前尝试回答这些问题。\n\
