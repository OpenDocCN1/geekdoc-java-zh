  \ 和 `getUser()` 来更新和从刷新表格数据。\n\n**列表 28.8 service_custom_db.html 使用 input 元素实现与存储在服务器上的数据交互的\
  \ AngularJS 模板**\n\n点击此处查看代码图片\n\n* *\n\n(注：此处为代码块，根据要求不翻译，原文内容，已根据模板逻辑保持结构)\n\n\
  \n\nAngularJS 自定义服务（services）是单例对象，你可以将它们注册到依赖注入器中。在注册之后，控制器（controllers）、指令（directives）以及其他的\
  \ AngularJS 组件就可以使用它们。AngularJS 提供了几种方法来创建自定义服务，复杂程度不相同。`value` 和 `constant` 方法创建简单的服务。另一方面，`factory`\
  \ 和 `service` 方法允许你创建复杂得多的服务。\n\n本节课程重点介绍了当你需要为应用程序提供基于任务的功能时，能够让你实现自己的自定义服务的工具。你学习了四种自定义服务的方法或类型，包括\
  \ `value`、`constant`、`factory` 和 `service`。本节展示了实现每种类型自定义服务的示例。你还看到了一个在多个控制器中实现自定义服务的示例。本节的最后一个示例展示了如何实现一个使用\
  \ `$http` 与服务器交互的独立自定义服务，以及如何注入和使用它。\n\n### QA\n\nQ：在单元测试中可以模拟（mock）AngularJS 服务吗？\n\
  A：可以。你可以使用像 Jasmine 测试驱动框架之类的工具来模拟服务提供者。\n\nQ：`value` 服务和 `constant` 服务之间有什么区别？\n\
  A：它们在行为上几乎相同。唯一的真实区别是 `value` 服务不能注入到模块的配置块（configuration block）中。\n\n### Workshop\n\
  \n工作坊包含一组问题和答案，旨在巩固你对本小时所涵盖内容的理解。在查看答案之前，请尝试回答这些问题。\n\n### Quiz\n\n1. 如果你想为变量定义初始值，你会使用哪种\
  \ AngularJS 服务提供者？\n2. 共有多少种服务提供者？\n3. 判断对错：服务在你的模块内只能被使用一次。\n\n### Quiz Answers\n\
  \n1. `value` 服务提供者。\n2. Value、constant、factory 和 service。\n3. 错误。服务可以注入到模块的多个组件中。\n\
