  \n# 第 28 节：创建你自己的自定义 AngularJS 服务\n\n在本节中，你将学习到：\n\n- 哪些方法可以创建 AngularJS 自定义服务\n\
  - 如何使用 factory provider 来定义自定义服务\n- 如何使用 service provider 来定义自定义服务\n- 如何使用所有四种自定义服务构建应用程序\n\
  - 如何实现异步数据库访问服务\n\n`AngularJS` 在内置服务中提供了大量功能；然而，你可能还需要能够实现自己的自定义服务，以提供你所需的特定功能。每当你需要为应用程序提供基于任务的功能时，都应该实现自定义服务。\n\
  \n在实现自定义服务时，你需要将服务视为执行一个或多个相关任务的可重用代码块。然后你可以将它们设计并分组到自定义模块中，这些模块可以轻松被多个 `AngularJS`\
  \ 应用程序调用。\n\n本节介绍了 `AngularJS` 自定义服务。随后，本节提供了几个自定义 `AngularJS` 服务的实现示例，让你更清楚地理解如何设计和构建自己的服务。\n\
  \n## 理解自定义 AngularJS 服务\n\n`AngularJS` 允许你创建自己的自定义服务，为需要它的 `AngularJS` 组件提供功能。正如你在上一节看到的，内置的\
  \ `AngularJS` 服务为 AngularJS 应用程序提供了多种功能。通过自定义服务，你可以以多种方式自定义、增强和扩展这些功能。\n\n你可能会在代码中实现四种类型的服务：`value`、`constant`、`factory`\
  \ 和 `service`。接下来的章节将介绍这些服务。\n\n### 定义 value 服务\n\n你使用非常简单的 `value` 服务来定义一个单一值，并作为服务提供者注入该值。`value`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`object` 是你想提供的任何 JavaScript 对象：\n\n```\nvalue(name,\
  \ object)\n```\n\n例如：\n\n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp',\
  \ []);\napp.value('myValue', {color:'blue', value:'17'});\n```\n\n### 定义 constant\
  \ 服务\n\n`constant` 服务与 `value` 服务基本相同，不同在于 `constant` 服务在构建 `Module` 对象的配置阶段可用，而\
  \ `value` 服务则不可。`constant` 方法使用以下语法，其中 `name` 是服务名称，`object` 是你想提供的任何 JavaScript\
  \ 对象：\n\n```javascript\nconstant(name, object)\n```\n\n例如：\n\n点击此处查看代码图像\n\n```javascript\n\
  var app = angular.module('myApp', []);\napp.constant('myConst', \"Constant String\"\
  );\n```\n\n### 使用 Factory Provider 构建 factory 服务\n\n`factory` 方法提供了将功能实现到服务的能力。它还可以依赖于其他服务提供者，使你能够构建模块化的代码。`factory`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`factoryProvider` 是用于构建 factory 服务的 provider 函数：\n\n\
  点击此处查看代码图像\n\n```javascript\nfactory(name, factoryProvider)\n```\n\n与 `value` 或\
  \ `constant` 服务不同，你可以向其他服务注入 `factory` 方法，它会返回具有相应功能的服务对象。该功能可以是复杂的 JavaScript 服务、一个值或一个简单的函数。例如，以下代码实现了一个\
  \ `factory` 服务，该服务返回一个两个数字之和的函数：\n\n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp',\
  \ []);\napp.constant('myConst', 10);\napp.factory('multiplier', ['myConst', function\
  \ (myConst) {\n  return function(value) { return value + myConst; }\n]);\n```\n\n\
  ### 使用对象定义 service 服务\n\n`service` 方法提供了将功能实现到服务器的能力。`service` 方法与 `factory` 方法的功能相同；然而，`service`\
  \ 方法的实现方式与 `factory` 方法不同。选择其中哪一个取决于语义上的考虑。\n\n`service` 方法接受构造函数作为第二个参数，并使用它来创建对象的新实例。`service`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`constructor` 是构造函数：\n\n```javascript\nservice(name,\
  \ constructor)\n```\n\n`service` 方法还可以接受依赖注入。以下代码实现了一个基础服务方法，提供 `add()` 函数和 `multiply()`\
  \ 函数：\n\n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp', []);\napp.constant('myConst',\
  \ 10);\nfunction ConstObj(myConst) {\n  this.add = function(value){ return value\
  \ + myConst; };\n  this.multiply = function(value){ return value * myConst; };\n\
  }\napp.service('constMath', 'myConst\n\n## 将自定义服务集成到 AngularJS 应用程序中\n\n当你开始为应用程序实现\
  \ AngularJS 服务时，你会发现某些服务简单而另一些变得复杂。服务的复杂性通常反映了其提供的底层数据和功能的复杂性。本节的目的是为你提供一些不同类型的服务示例，以说明如何实现。\n\
  \n接下来的每个章节都包含一个说明自定义服务不同方面的示例。第一个设计用于展示如何实现不同类型；第二个展示了服务的重用性，第三个展示了服务交互。\n\n###\
  \ 动手尝试：实现一个使用四种类型的简单应用程序\n\n在这个示例中，你构建了 `constant`、`value`、`factory` 和 `service`\
  \ 服务。目的是学习如何实现每种服务，以及如何在应用程序中使用多种类型的服务。\n\n[Listing 28.1 中的代码展示了将 `value`、`constant`、`factory`\
  \ 和 `service` 服务集成到单个模块的示例。Listing 28.2 代码实现了加载并运行应用程序的 AngularJS 模板。\n\n使用以下步骤构建使用四种类型的应用程序：\n\
  \n1. 添加 `lesson28/service_custom_censor.html` 和 `lesson28/js/service_custom_censor.js`\
  \ 文件。\n2. 将 Listing 28.1 所示的代码和 Listing 28.2 的代码添加到 HTML 和 JavaScript 文件中。\n3. Listing\
  \ 28.1 中的下一行创建了一个名为 `censorWords` 的简单 `value` 服务，包含要过滤的词汇数组：\n\n点击此处查看代码图像\n\n```javascript\n\
  app.value('censorWords', [\"can't\", \"quit\", \"fail\"]);\n```\n\n4. 下一行代码创建一个名为\
  \ `repString` 的 `constant` 服务，包含用于过滤词的替换字符串：\n\n\n\n\n\n点击此处查看代码图片\n\n03 `app.constant('repString',\
  \ \"****\");`\n\n### 5. 下面代码实现了一个名为 `censorF` 的 `factory` 服务，该服务注入了 `censorWords`\
  \ 和 `repString`。此服务返回一个函数，该函数接收输入字符串并使用 `replace` 将 `censorWords` 列表中的任何单词替换为 `repString`\
  \ 的值：\n\n点击此处查看代码图片\n\n```javascript\n04 app.factory('censorF', ['censorWords',\
  \ 'repString',\n    function (cWords, repString) {\n    return function(inString)\
  \ {\n      var outString = inString;\n      for(i in cWords){\n        var regex\
  \ = new RegExp(cWords[i], \"ig\");\n        outString = outString.replace(regex,\
  \ repString);\n      }\n      return outString;\n    };\n }]);\n```\n\n### 6. 下面代码实现了一个名为\
  \ `censorS` 的 `service` 服务，它首先定义了一个名为 `CensorObj` 的函数，然后将其同 `censorWords` 和 `repString`\
  \ 一起注入到 `app.service()` 方法中。与 `factory` 服务类似，此服务也接受字符串并返回过滤后的结果：\n\n点击此处查看代码图片\n\
  \n```javascript\n15 function CensorObj(cWords, repString) {\n    this.censor = function(inString){\n\
