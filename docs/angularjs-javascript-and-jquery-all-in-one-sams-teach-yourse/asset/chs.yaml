  \ = 0;\n08   $scope.change = 1;\n09   $scope.inc = function() {\n10     $scope.current\
  \ += $scope.change;\n11     $scope.calcDiff();\n12   };\n13   $scope.dec = function()\
  \ {\n14     $scope.current -= $scope.change;\n15     $scope.calcDiff();\n16   };\n\
  17   $scope.calcDiff = function() {\n18     $scope.difference = $scope.current -\
  \ $scope.start;\n19   };\n20 }]);\n```\n\n**列表 22.2 scope_controller.html 允许根据增减值动态查看作用域中值的\
  \ HTML 模板**\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n\
  04   <title>AngularJS Basic Scope</title>\n05 </head>\n06 <body>\n07   <div ng-controller=\"\
  Counter\">\n08     <span>Change Amount:</span>\n09     <input type=\"number\" ng-model=\"\
  change\"><hr>\n10     <span>Starting Value:</span>\n11     {{start}}\n12     <br>\n\
  13     <span>CurrentValue:</span>\n14     {{current}}\n15     <button ng-click='inc()'>+</button>\n\
  16     <button ng-click='dec()'>-</button><hr>\n17     <span>Difference:</span>\n\
  18     {{difference}}\n19   </div>\n20   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n21   <script src=\"js/scope_controller.js\"></script>\n22 </body>\n\
  23 </html>\n```\n\n### 作用域与模板的关系\n\n模板为 AngularJS 应用提供视图。HTML 元素通过 `ng-controller`\
  \ 属性定义为控制器。在控制器 HTML 元素及其子元素内部，控制器的作用域适用于表达式和其他 AngularJS 功能。\n\n作用域的值可以通过 `ng-model`\
  \ 指令直接链接到模板中的 `<input>`、`<select>` 和 `<textarea>` 元素。该指令将元素的值链接到作用域中的属性名。当用户更改元素的值时，作用域会自动更新。例如，以下代码将元素的数字值链接到名为\
  \ `valueA` 的作用域：\n\n```html\n<input type=\"number\" ng-model=\"valueA\" />\n```\n\
  \n你可以使用 `{{expression}}` 语法在模板中添加作用域属性甚至函数。括号内的代码将被执行，结果将显示在渲染的视图中。例如，如果作用域包含名为\
  \ `valueA` 和 `valueB` 的属性，你可以在表达式中引用这些属性，如下所示：\n\n```\n{{valueA + valueB}}\n```\n\
  \n\n\n\n在模板中定义 AngularJS 指令时，可以使用作用域属性和函数。例如，`ng-click` 指令将浏览器点击事件绑定到名为 `addValues()`\
  \ 的作用域函数，并传递作用域属性 `valueA` 和 `valueB` 的值：\n\n点击此处查看代码图片\n\n```html\n<span ng-click=\"\
  addValues(valueA, valueB)\">Add Values{{valueA}} & {{valueB}}</span\n```\n\n注意，在这段代码中，`{{}}`\
  \ 括号是必须的。然而，在 `addValues()` 函数调用中，并不是需要的。这是因为 `ng-click` 和其他 AngularJS 指令会自动作为表达式求值。\n\
  \n***\n\n### 动手尝试：查看 AngularJS 模板中的作用域值\n\n在这个示例中，你将所有这些概念整合到一个非常基础的示例，以便理解模型（model）和作用域（scope）之间的关系。列表\
