  \n### 总结\n\n管理事件的能力是大多数 AngularJS 应用中至关重要的组件部分之一。你可以在 AngularJS 应用中使用事件来提供元素与用户的交互，并让应用程序的组件之间进行通信，以知道何时执行某些任务。本节从关于浏览器和用户交互事件的简短讨论开始，以及它们与整体架构的关系。\n\
  \n接下来，本节涵盖了使用 `$watch`、`$watchGroup` 和 `$watchCollection` 方法来监听作用域值。使用监听允许你在作用域值变化时采取行动，而无需在这些值可能变化的每个地方放置代码。\n\
  \n作用域组织成层级结构，根作用域定义在应用程序级别。每个控制器的实例也会获得一个子作用域实例。在本节中，你学习了如何从作用域内部发射（emit）或广播（broadcast）事件，然后实现监听这些事件并在被触发时执行的处理器。\n\
  \n### 问答\n\n问. AngularJS 何时处理监听器（watches）？\n\n答. AngularJS 使用消化循环（digest cycle），它本质上是一个检查被监听变量是否发生变化的循环。\n\
  \n问. 那就意味着所有的作用域值都在被监听吗？\n\n答. 不是，那会产生严重的性能影响。只有你指定的变量才会被检查。\n\n### 练习\n\n练习包含一组问题和答案，旨在巩固你对内容的理解。在查看答案之前尝试回答问题。\n\
  \n### 测验\n\n问. 同时监听多个值的最佳方法是什么？\n\n答. 使用 `$watchGroup`\n\n问. 由 `$emit` 触发的事件是向上还是向下传递？\n\
  \n答. 向上\n\n问. 由 `$broadcast` 触发的事件是向上还是向下传递？\n\n答. 向下\n\n### 测验答案\n\n1. `$watchGroup`\n\
  \n2. 向上\n\n3. 向下\n\n4. `preventDefault()`\n\n### 练习\n\n1. 修改 列表 26.1 和 26.2 的代码，添加一个代表命中次数除以缺失次数的比率值。在每次点击命中或缺失时通过监听器更新比率。\n\
  \n2. 修改 列表 26.3 和 26.4 的代码，在删除按钮旁边添加一个复制按钮。当用户点击复制按钮时，为该角色创建一个副本。你还需要添加一个事件和处理器，以通知父控制器已添加新角色并应该显示在列表中。\n\
  \n## 第 27 节在 Web 应用中实现 AngularJS 服务\n\n你将在本节中学习：\n\n- 如何从 AngularJS 向 Web 服务器发送\
  \ GET 和 PUT 请求\n- 如何实现浏览器警告\n- 如何在 AngularJS 代码中实现定时器\n- 如何从 AngularJS 操作 Cookie\n\
  - 如何使用 `$animate` 服务\n\n服务为你的应用程序提供基于任务的功能。将服务视为执行一个或多个相关任务的可用代码块。AngularJS 提供了许多内置服务，并允许你创建自己的自定义服务。\n\
  \n### 理解 AngularJS 服务\n\nAngularJS 服务是单例对象，这意味着只会被创建一个实例。服务的意图是提供执行特定任务的简洁代码。服务可以是简单的值定义，也可以是复杂的提供完整的\
  \ Web 服务器 通信。\n\n\n\n\n服务提供了一个可重用功能的容器，供 AngularJS 应用程序轻松使用。在 AngularJS 中，服务通过依赖注入机制进行定义和注册。这允许你将服务注入到模块、控制器和其他服务中。\n\
  \n***\n\n## 顺说\n\n第 21 节 “理解 AngularJS 应用程序动态”讨论了依赖注入。在继续阅读本节之前，你应该已经阅读过那一节。\n\n\
  ***\n\n## 使用内置服务\n\nAngularJS 提供了几个内置服务。这些服务会自动注册到依赖注入器；因此，你可以通过依赖注入轻松将它们整合到你的 AngularJS\
  \ 应用中。\n\n表 27.1 描述了一些常见的内置服务，让你对可用内容有一个直观。接下来的章节将详细介绍其中一些服务。\n\n![Image](img/image01036.jpeg)![Image](img/image01037.jpeg)![Image](img/image01038.jpeg)\n\
  \n**表 27.1 AngularJS 内置常用服务**\n\n### 使用 $http 服务发送 HTTP GET 和 PUT 请求\n\n`$http`\
  \ 服务允许你直接从 AngularJS 代码与 Web 服务器交互。`$http` 服务在底层使用浏览器的 `XMLHttpRequest` 对象，但在 AngularJS\
  \ 框架的上下文中运行。\n\n使用 `$http` 服务有两种方法。最简单的方法是使用以下对应标准 HTTP 请求的内置快捷方法之一：\n\n![Image](img/image00767.jpeg)\
  \ `delete(url, [config])`\n\n![Image](img/image00767.jpeg) `get(`url`, [`config`])`\n\
  \n![Image](img/image00767.jpeg) `head(`url`, [`config`])`\n\n![Image](img/image00767.jpeg)\
  \ `jsonp(`url`, [`config`])`\n\n![Image](img/image00767.jpeg) `post(`url`,` data`,\
  \ [`config`])`\n\n![Image](img/image00767.jpeg) `put(`url`,` data`, [`config`])`\n\
  \n![Image](img/image00767.jpeg) `patch(url, data, [config])`\n\n#### 配置 $http 请求\n\
  \n在这些方法中，`url` 参数是 Web 请求的 URL。可选的 `config` 参数是一个 JavaScript 对象，用于指定实现请求时使用的选项。表\
  \ 27.2 列出了你可以在 `config` 参数中设置的属性。\n\n![Image](img/image01039.jpeg)![Image](img/image01040.jpeg)\n\
  \n**表 27.2 $http 服务请求中 config 参数中可以定义的属性**\n\n你也可以通过直接向 `$http(`config`)` 方法发送 `config`\
  \ 参数来指定请求、URL 和数据。例如，以下两行代码是相同的：\n\n点击此处查看代码图片\n\n```\n$http.get('/myUrl');\n\n\
  $http({method: 'GET', url:'/myUrl'});\n```\n\n#### 实现 $http 响应回调函数\n\n当你使用 `$http`\
  \ 对象调用请求方法时，你将获得一个带有 `success()` 和 `error()` Promise 方法的对象。你可以向这些方法传递一个回调函数，该函数会在请求成功或失败时被调用。这些方法接受以下参数：\n\
  \n![Image](img/image00767.jpeg) data:** 响应数据。\n\n![Image](img/image00767.jpeg) status:**\
  \ 响应状态。\n\n![Image](img/image00767.jpeg) header:** 响应标头。\n\n![Image](img/image00767.jpeg)\
  \ config:** 请求配置。\n\n以下是在 `get()` 请求上实现 `success()` 和 `error()` 方法的简单示例：\n\n点击此处查看代码图片\n\
  \n```\n$http({method: 'GET', url: '/myUrl'}).\n  success(function(data, status,\
  \ headers, config) {\n    // 处理成功\n  }).\n  error(function(data, status, headers,\
  \ config) {\n    // 处理失败\n  });\n```\n\n***\n\n## 动手一试：实现一个简单的 HTTP 服务器并使用 $http\
  \ 服务访问它\n\n在例例中，你将实现一个 AngularJS 应用程序，使用 `$http` 服务访问并更新 Web 服务器上的数据。此练习的目的是让你熟悉使用\
  \ `$http.get()` 和 `$http.post()` 请求。\n\n代码列表 27.1 到 27.3 中的代码实现了一个简单的 Node.js Web\
