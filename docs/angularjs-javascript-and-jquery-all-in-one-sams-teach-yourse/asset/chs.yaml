  \ `myScopeNumber` 的数字变量执行相同操作：\n\n```html\n{{myScopeText}}\n```\n\n**2.** 查看 表 23.1\
  \ 中列出的日期过滤器，然后修改 列表 23.8 中的日期过滤器，以更改显示的日期字符串格式。**\n\n**3.** 修改 列表 23.11 和 23.12\
  \ 中的代码，向作用域中添加一个额外的字符串进行审查。然后向模板中添加一条语句，指定作用域中该单词的变量名以及作为替换值的字符串。例如：\n\n点击此处查看代码图像\n\
  \n```html\n{{myNewPhrase | censor:\"XXX\" }}<br>\n```\n\n## 第 24 节：在 AngularJS 视图中实现指令\n\
  \n你将在本节中学习到：\n\n![Image](img/image00767.jpeg) AngularJS 指令与 HTML 的关系\n\n![Image](img/image00767.jpeg)\
  \ 在你的...实现 AngularJS 指令的方法\n\n![Image](img/image00767.jpeg) 使用鼠标和键盘事件\n\n![Image](img/image00767.jpeg)\
  \ 哪些元素被 AngularJS 扩展\n\n![Image](img/image00767.jpeg) 如何在你的...构建指令\n\nAngularJS\
  \ 指令实现简单，但功能非常强大且广泛。本节将讨论 AngularJS 模板的组件以及它们如何协同工作以扩展 HTML DOM 的行为和功能。表达式是包含在 `{{}}`\
  \ 括号内或 AngularJS 模板指令定义中的 JavaScript 代码。表达式可以访问作用域，因此你可以将作用域值渲染到视图。\n\n过滤器作为表达式的修饰符，允许你根据特定目的格式化表达式的结果。AngularJS\
  \ 提供了多个内置过滤器，例如用于货币和日期格式化的过滤器。你也可以创建自定义过滤器，以便在数据渲染到页面之前应用任何所需的格式化或修改。你将过滤器作为提供者注入到\
  \ `injector` 服务中，因此可以使用依赖注入在控制器和模板内部访问它们。这意味着你在 JavaScript 代码中也可以访问过滤器。\n\nAngularJS\
  \ 最强大的功能之一是指令。指令扩展了 HTML 的行为，允许你创建自定义元素、属性和类。AngularJS 提供了许多内置过滤器。事实上，大部分 AngularJS\
  \ 都是指令。AngularJS 编译器遍历模板 DOM 并编译所有指令。然后将其与作用域链接以生成新视图。视图包含了指令定义的 DOM 元素。\n\n###\
  \ 理解指令\n\n指令是标记和 JavaScript 代码的结合。标记可以是 HTML 属性、元素名称或 CSS 类。JavaScript 代码定义了 HTML\
  \ 元素的数据和行为。\n\n### 使用内置指令\n\n你需要在 HTML 元素中大部分 AngularJS 功能由内置指令提供。这些指令由库提供并在加载 AngularJS\
  \ 时可用。\n\n指令为 AngularJS 应用提供了各种支持。后续章节描述了大多数 AngularJS 指令，它们分为以下类别：\n\n![Image](img/image0076.jpeg)\
  \ 支持功能的指令\n\n![Image](img/image0076.jpeg) 扩展表单元素的指令\n\n![Image](img/image0076.jpeg)\
  \ 将页面元素绑定到作用域值的指令\n\n![Image](img/image0076.jpeg) 将页面事件绑定到控制器的指令\n\n后续每个章节都包含一个包含相关指令及其基本描述的表格。你现在不需要理解所有的指令；表格仅供参考。后续章节和课程提供了许多指令示例代码。\n\
  \n#### 支持功能的指令\n\n若干指令提供了 AngularJS 功能的支持。这些指令涵盖了从启动应用程序到确保 AngularJS 需要的布尔表达式保留在\
  \ DOM 中的所有工作。\n\n表 24.1 列出了这些指令，并描述了每个指令的行为和用法。\n\n![Image](img/01009.jpeg)![Image](img/01010.jpeg)![Image](img/01011.jpeg)\n\
