  10. 保存文件并在浏览器中打开 HTML。你应该看到与图 4.12 所示类似的各种边框样式。\n\n![图像](img/image0039)\n\n#####\
  \ 图 4.12 为 HTML 元素添加边框\n\n##### 列表 4.4 创建一系列 `<div>` 元素的 HTML\n\n##### 列表 4.5 定义多种边框样式的\
  \ CSS\n\n\n\n\n\n浏览器与用户交互的一个重要部分是鼠标光标。你只需更改鼠标悬停在 HTML 元素上时的光标样式，就可以让用户知道元素的用途或行为。\n\
  \n`cursor` CSS 属性允许你定义当鼠标悬停在特定元素上时使用什么光标。以下是一个将 `cursor` 设置为 `pointer` 的示例：\n\n\
  ```css\ndiv { cursor:pointer; }\n```\n\n你可以从几个 `cursor` 值中进行选择。图 4.13 显示了通过 `cursor`\
  \ CSS 属性提供的某些 `cursor` 值示例。\n\n![Image](img/image00840.jpeg)\n\n**图 4.13** 通过 cursor\
  \ CSS 属性可用的某些光标类型示例。\n\n### 透明度 (Opacity)\n\n`opacity` CSS 属性允许你设置 HTML 元素及其包含的所有元素的透明度。`opacity`\
  \ 被指定为 0 到 1 之间的小数，其中 0 表示透明，1 表示不透明。\n\n改变 `opacity` 是让用户知道 HTML 元素是非活动状态的好方法。例如，以下\
  \ CSS 和 HTML 定义了两个按钮定义。`button2` 的定义包含了 .4 的透明度，使其部分透明。结果显示在图 4.14 中。\n\n![Image](img/image00841.jpeg)\n\
  \n**图 4.14** 两个样式为按钮的 `<span>` 元素，其中一个的 `opacity` 设置为 .4。\n\nCSS 规则：\n\n点击此处查看代码图像\n\
  \n```css\n#button, #button2 {\n  margin: 5px; padding:3px;\n  text-align: center;\n\
  \  background-color: #2233FF;\n  color: white;\n  border:5px outset blue;\n  border-radius:50%;\n\
  }\n\n#button2 { opacity:.4; }\n```\n\nHTML 元素：\n\n点击此处查看代码图像\n\n```html\n<span id=\"\
  button\">Active</span>\n<span id=\"button2\">Inactive</span>\n```\n\n### 可性 (Visibility)\n\
  \n另一个属性 CSS 属性是 `visibility`。你可以将 `visibility` 设置为 `hidden`，此时 HTML 元素及其包含的所有元素将不会渲染到浏览器中。再次设置为\
  \ `visible` 就会在浏览器窗口中显示。这种功能在 jQuery 和 JavaScript 中非常有用，允许你动态地显示和隐藏页面元素。\n\n###\
  \ 应用 CSS 布局属性\n\n创建 HTML 网页最大的挑战之一是 HTML 并不容易于创建美观的布局。这就是为什么许多 CSS 属性旨在更改大小、位置以及与其他\
  \ HTML 元素之间的关系。\n\n使用 CSS 布局属性，你将能够在你的网页上正确地定位项目，并且通过 JavaScript、`jQuery` 和 `AngularJS`，你可以高效地更改这些位置，为用户提供更多的应用程序体验，而不是一个简单的点击式网页。接下来的章节涵盖了更改\
  \ HTML 组件布局的 CSS 属性。\n\n### 理解盒模型 (Box Model)\n\nHTML 元素使用盒模型渲染到浏览器窗口中。在盒模型中，HTML\
  \ 元素的内容由图图 4.15 所示的四个部分组成：\n\n![Image](img/image00767.jpeg) **内容 (Content)**——HTML\
  \ 组件本身的内容\n\n![Image](img/image00767.jpeg) **内边距 (Padding)**——组件与边框之间的空间\n\n![Image](img/image00767.jpeg)\
  \ **边框 (Border)**——包围 HTML 元素的边框\n\n![Image](img/image00767.jpeg) **外边距 (Margin)**——HTML\
  \ 元素与其周围元素之间的空间\n\n![Image](img/image00842.jpeg)\n\n**图 4.15** CSS 盒模型包含四个部分：内容、内边距、边框和外边距。\n\
  \n每个部分在 浏览器中占据的空间可以使用 CSS 设置。\n\n#### 设置内容大小\n\n通过指定 `height` 和 `width` CSS 属性的大小值来设置内容。大小值可以指定为\
  \ `px`、`cm`、`auto`、`%` 等。你还可以使用 `max-height`、`max-width`、`min-height` 和 `min-width`\
  \ 属性指定最大和最小高度及宽度。\n\n以下是设置 `<p>` 元素的高度和宽度属性的示例：\n\n```css\np {height:100px; width:\
  \ 50px;}\n```\n\n#### 在 HTML 内容周围添加内边距\n\n内边距是元素布局的重要部分，特别是当你使用边框时。内边距防止 HTML 元素内部的内容接触到边框。\n\
  \n通过指定 `padding` 值，可以为 HTML 元素的所有边添加内边距，如下：\n\n```css\npadding:3px;\n```\n\n你也可以为元素的每个边指定内边距，例如：\n\
  \n```css\npadding:1px 2px 1px 2px;\n```\n\n#### 在 HTML 元素周围添加外边距\n\n外边距的工作原理与内边距类似，但它们位于元素的边框之外，并防止其他\
  \ HTML 元素接触边框。可以通过指定 `margin` 值为 HTML 元素的所有边添加外边距：\n\n```css\nmargin:\n```\n\n你也可以为元素的每个边指定外边距，例如：\n\
  \n```css\nmargin:\n\n```\n\n`margin` 属性还支持 `auto` 值。\n\n### 修改元素流\n\n除非另有指定，否则元素是静态的并与文档中的其他元素一起流动。正如上一节中学的，有些元素是块级的，有些是内联的。块元素占据整个宽度；内联元素只占据必要的空间。\n\
  \n使用 `display` 属性，你可以将元素设置为 `block` 或 `inline`。另一个值得的 display 值是 `inline-block`。与内联元素不同，你仍然可以设置属性，如\
  \ `height` 和 `width`。例如：\n\n```css\nspan {height:200px; width:200px;display:inline-block;}\n\
  ```\n\n另一种修改元素流的方法是使用 `float` 属性。`float` 属性允许元素浮在容器元素的左侧或右侧。未浮动的元素将显示在元素旁边。\n\n\
  使用 `float` 属性时，你需要使用 `clear` 属性来定义哪些元素不允许在浮动元素周围流动。为了说明这一点，请考虑以下 CSS 和 HTML。注意，在图\
  \ 4.16 中，未包含 `clear:both` 属性的段落元素渲染在左侧浮动的图像旁边。\n\n![Image](img/image00843.jpeg)\n\
  \n**图 4.16** 将元素浮动到左侧或右侧会修改流。然而，你需要 `clear` 你不希望流动的属性。\n\nCSS 规则：\n\n```css\n#image1\
  \ {float:left;}\n#image2 {float:right;}\n#cleared {clear:both;}\n```\n\nHTML 元素：\n\
  \n```html\n<img id=\"image1\" src=\"images/lesson0302.jpg\" width=\"100\" />\n<img\
  \ id=\"image2\" src=\"images/lesson0303.jpg\" width=\"100\" />\n<p id=\"uncleared\"\
  >Uncleared Line of Text</p>\n<p id=\"cleared\">Cleared Line of Text</p>\n```\n\n\
  ### 使用 CSS 定位 HTML 元素\n\n`position` 属性允许你定义浏览器如何对元素进行定位。默认情况下，元素是静态的并与文档中的其他元素一起。通过更改\
  \ `position` 属性的值，你可以更改这种行为。以下列表描述了每个非静态定位值：\n\n![Image](img/image00767.jpeg) **固定\
  \ (fixed)**——相对于浏览器窗口进行定位。\n\n![Image](img/image00767.jpeg) **绝对 (absolute)**——相对于第一个非静态容器元素进行定位。元素的至少一个容器已经定义了非静态定位。\n\
  \n\n\n\n\n![Image](img/image00767.jpeg) relative—相对——将元素相对于其原本应所在的位置进行定位。\n\n当你将\
  \ `position` 属性更改为非静态（nonstatic）值，你可以使用 `top`、`left`、`bottom` 和 `right` 属性来设置位置。例如，要将元素的左上角设置为距离页面顶部\
  \ 50 像素、距离浏览器窗口左侧边缘 100 像素，你可以使用以下 CSS 代码：\n\n```css\nposition:fixed;\ntop:50px;\n\
  left:100px;\n```\n\n### Z-Index（层级）\n\n当你开始使用非静态定位对 HTML 元素时，你可能会发现一个元素重叠另一个元素的情况。`z-index`\
  \ 属性允许你指定哪个元素应该显示在前面。`z-index` 数字较高的元素位于 `z-index` 值较小的元素之前。以下 CSS `<div>` 元素将位于\
  \ `<p>` 段落元素的前面：\n\n```css\ndiv { z-index:2; }\np { z-index:1; }\n```\n\n### Overflow（溢出）\n\
  \n`overflow` CSS 属性用于解决在设计的网页区域中尝试显示比该区域过大的项目的问题。`overflow` 属性可以设置为以下几个值：\n\n![Image](img/image00767.jpeg)\
  \ visible—可见——默认行为。\n\n![Image](img/image00767.jpeg) hidden—隐藏——如果内容太大，将隐藏该元素。\n\
  \n![Image](img/image00767.jpeg) scroll—滚动——在底部和右侧添加滚动条。如果内容超过了尺寸限制，滚动条将激活，这样你可以查看容器的完整内容，而不影响页面其他部分的布局。\n\
  \n![Image](img/image00767.jpeg) auto—自动——在必要时将添加滚动条，以保持元素符合你设置的尺寸限制。\n\n图 4.17 显示了一个列表示例，该列表被限制在一个\
  \ `<ul>` 元素内部，该元素具有以下带有 `overflow` 属性的 CSS 规则：\n\n```css\nul{\n  border:1px solid;\n\
  \  height:150px; width:300px;\n  overflow:auto;\n}\nli{ width:800px; }\n```\n\n\
  ![Image](img/image00844.jpeg)\n\n**图 4.17** 向 `<ul>` 元素添加 `overflow` 属性会导致列表被限制在滚动条内。\n\
  \n***\n\n### 动手尝试：使用 CSS 布局网页组件\n\n在这个示例中，你将实践了几个布局属性。在示例中，你创建了两个 `<div>` 元素，并按照以下步骤将它们放置在网页的固定位置。完整的\
