  \n```javascript\n02 firstApp.controller('FirstController', function($scope) {\n\
  09 });\n```\n\n### 8. 控制器定义后，你就可以实现作用域，这涉及将 HTML 元素链接到作用域变量、初始化作用域中的变量，并提供处理作用域值变化的功能。在\
