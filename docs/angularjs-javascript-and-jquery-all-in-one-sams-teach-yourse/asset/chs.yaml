  \ 的文件，并将 列表 15.5、15.6、15.7 和 15.8 的内容放入其中。该文件将仅作为此的 Node.js Web 服务器。\n\n**3.** 如果\
  \ `server.js` Web 服务器已在运行，请停止它。然后使用 `node` 命令或如果使用 Eclipse 则使用“Run As, Node Application”来启动\
  \ `server_lesson15_ajax_post.js` 服务器。\n\n* * *\n\n### 注意\n\n在继续进行额外练习之前，不要忘记停止 `server_lesson15_ajax_post.js`\
  \ 服务器并启动正常的 `server.js`。\n\n* * *\n\n**4.** 将 列表 15.17 和 列表 15.19 所示的代码添加到 HTML\
  \ 和 CSS 文件中。这些文件定义了度假页的样式和框架。这些文件中不应该有任何以前没见过的新内容。\n\n\n\n\n\n### 5. 打开 `ajax_post.js`\
  \ 文件\n添加以下 `.ready()` 函数，该函数将向服务器发送 `.get()` 请求以从服务器获取假期列表。注意，添加了一个 `.done()` 函数，以便在数据返回并填充链接后，自动点击第一个链接以设置假期内容。注意，为元素添加了\
  \ `sendRating()` 事件处理器，以开始元素能够通过鼠标处理评分：\n\n```javascript\n$(document).ready(function(){\n\
  \  $.get(\"/getList\", setList).done(function(){\n    $(\"span:first\").click();\
  \ return false;\n  });\n  $(\".star\").click(sendRating);\n});\n```\n\n### 6. 为左侧导航栏添加以下点击处理器\
  \ `setList()`\n对于每个按钮，都添加了 `getTrip()` 事件处理器：\n\n```javascript\nfunction setList(data){\n\
  \  var items = [];\n  $.each(data, function(key, val) {\n    var item = $(\"<span>\"\
  ).html(val.title);\n    item.click(function(){getTrip(val.idx)});\n    $(\"#leftNav\"\
  ).append(item);\n  });\n}\n```\n\n### 7. 添加以下 `getTrip()` 事件处理器\n这将发送一个 `.get()`\
  \ 请求，通过指定 `/getTrip` 为路径以及 `idx`（Web 服务器上行程的索引）来获取特定行程的信息。当 AJAX 请求完成后，将调用 `setTrip()`\
  \ 处理器，因此你需要添加如列表 15.18 第 1–10 行所示的代码。此函数获取 JSON 数据并填充元素：\n\n```javascript\nfunction\
  \ getTrip(idx){\n  $.get(\"/getTrip\", {idx: idx}, setTrip);\n}\n```\n\n### 8. 添加以下\
  \ `sendRating()` 函数\n当用户点击星号时调用。`.star` 元素的索引将通过 `.post()` 方法发送到服务器，带有参数 `idx:idx`\
  \ 和 `rating:rating`。生成的 POST 请求将更新服务器上的 JSON 文件，永久地存储新的评分值：\n\n```javascript\nfunction\
  \ sendRating(){\n  var idx = $(\"#idx\").html();\n  var rating = $(\".star\").index($(this))+1;\n\
  \  $.post(\"/setRating\", {idx: idx, rating: rating}, setTrip);\n}\n```\n\n### 9.\
  \ 保存所有三个文件并打开 HTML 文档\n如图 15.6 所示，在网络浏览器中打开文档。你应该能够链接到不同的假期，查看图片并设置评分。\n\n#### 图\
  \ 15.6 能够通过 AJAX 加载数据和更新评分的简单假期页面\n\n#### 列表 15.17 加载 jQuery 和 JavaScript 的 ajax_post.html\
  \ 文档\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>AJAX Post</title>\n  <meta\
  \ charset=\"utf-8\" />\n  <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
