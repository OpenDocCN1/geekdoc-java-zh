  \ `.position()` 设置中添加负值。\n\n## 第 17 节 使用 jQuery UI 效果\n\n在本节你将学习：\n\n![Image](img/image00767.jpeg)\
  \ 使用 jQuery UI 库应用效果\n![Image](img/image00767.jpeg) 缓动效果（easing effects）如何使动画变化变化\n\
  ![Image](img/image00767.jpeg) 在隐藏/显示元素时添加酷效果的方法\n![Image](img/image00767.jpeg) 如何对类更改应用效果\n\
  ![Image](img/image00767.jpeg) 在重新定位元素时应用动画效果\n\njQuery UI 提供了一系列丰富的动画类型效果，可以应用于\
  \ Web 上的元素。元素动画是一件好事，有几个原因。之一是让用户留下一种网站是交互式且易于使用的印象。其次是帮助用户理解你的动态脚本执行中正在发生的视觉变化。\n\
  \n在本节中，你将看到 jQuery UI 在动画效果方面提供的改进。你可以直接对元素应用效果，也可以在进行类、可见性或位置更改时应用效果。\n\n### 应用\
  \ jQuery UI 效果\n\n本节的目的是向你介绍 jQuery UI 提供的效果。本节讨论了每种效果以及如何使用 `.each()` 方法应用它们。你还将被介绍许多缓动函数（easing\
  \ functions），这些函数为效果动画期间应用值的方式提供了可变维度。\n\n#### 理解 jQuery UI 效果\n\njQuery UI 效果仅仅是针对\
  \ CSS 位置、大小和可见性属性的动画。这些动画变化以这种方式实现，从而创建为用户提供更好体验的视觉效果。\n\n例如，假设用户尝试用无效密码登录。除了表单验证消息外，你还可以使用\
  \ jQuery UI 效果让登录按钮抖动，这能更好地吸引用户的注意力，让用户知道登录失败。这些是对网页的细微更改，但它们对用户体验可能会产生巨大影响。\n\n\
  表 17.1 列出了可以用于操作效果的效果值。这应该让你对 jQuery UI 可能的效果有一个了解。你将在本节稍后的部分实现其中一些效果。\n\n![Image](img/image00953.jpeg)![Image](img/image00954.jpeg)![Image](img/image00955.jpeg)\n\
  \n**表 17.1 jQuery UI 效果**\n\n#### 设置效果动画缓动\n\n缓动函数设置了效果在执行动画时使用的值路径。你已经在 jQuery\
  \ 动画中见过了线性（linear）和摆动（swing）缓动。jQuery UI 添加了大量新的缓动函数，可以提供一些有趣的动画效果。\n\n说明缓动工作的最简单方法是向你展示位于以下位置并在图\
  \ 17.1 所示的图表。将水平轴设为持续时间，左侧为 0，右侧为完成。将垂直轴设为效果过渡的完成程度。例如，在淡出（fade-out）过渡中，底部将完全不透明，顶部将完全透明：[http://api.jqueryui.com/easings/]\n\
  \n![Image](img/image00956.jpeg)\n\n**图 17.1** jQuery UI 缓动函数。\n\n#### 为 jQuery 对象添加效果\n\
  \n有多种方法可以将应用于 jQuery 对象。效果可以作为另一种转换的一部分，例如类更改或可见性更改。你还可以使用 `.effect()` 方法对元素应用效果。`.effect()`\
  \ 方法具有以下语法：\n\n点击此处查看代码图像\n\n```\n.effect( effect [, options ] [, duration ] [,\
  \ complete ]\n```\n\n在 `.effect()` 方法中，`effect` 是效果的名称，`options` 是对象（表 17.1 列出了你可以应用的操作）。`duration`\
  \ 以毫秒为单位，你可以添加一个在效果完成后执行的 `complete` 函数。\n\n以下示例说明了对元素应用 `size` 效果的完整语法：\n\n```\n\
  $(...).effect(\"size\", {height:100, width:100, origin:[\"right\",\"top\"], \"box\"\
  }, 3000, function(){\n    alert(\"effect\");\n});\n```\n\n### 亲自尝试：添加效果\n\n在本示例中，你对\
  \ `<img>` 元素应用多种效果。当用户点击图像时，添加不同的效果。该示例的目的是让你熟悉如何实现效果、设置 `options` 并应用 `complete`\
  \ 函数。\n\n**1.** 在 Eclipse 中创建 `17`、`17/js` 和 `17/css` 文件夹，然后添加 `17/jquery_effects.html`、`17/js/jquery_effects.js`\
  \ 和 `17/css/jquery_effects.css` 文件。\n\n**2.** 在 HTML 和 CSS 文件中添加 17.1 和 17.3 所示的代码。\n\
  \n**3.** 打开 `jquery_effects.js` 文件并添加 `.ready()` 函数。\n\n**4.** 为 `#img1` 添加以下 `click`\
  \ 处理程序。该 `click` 处理程序应用了一个基础抖动效果；首先向某个方向抖动 5 次。3000 毫秒意味着效果将持续 3 秒：\n\n```javascript\n\
  $(\"#img1\").click(function(e) {\n    $(this).effect(\"shake\", {direction:\"down\"\
  , distance:20, times:5}, 3000);\n});\n```\n\n**5.** 为 `#img2` 添加以下 `click` 处理程序。该\
  \ `click` 处理程序在中间、右侧消失点双向应用缩放效果。效果将图像缩小到 40%。此外注意添加了 `easeInBounce` 缓动以调整动画的流：\n\
  \n```javascript\n$(\"#img2\").click(function(e) {\n    $(this).effect(\"scale\"\
  , {direction:\"both\", origin:[\"middle\", \"right\"], percent:40, scale:\"box\"\
  , easing:\"easeInBounce\"}, 3000);\n});\n```\n\n**6.** 为 `#img3` 添加以下 `click` 处理程序。该\
  \ `click` 处理程序应用了双重效果。第一个效果是向右方向滑动 200 像素，第二个效果（向右滑动）被放置在第一个效果的回调函数中，因此它会在第一个效果完成后才发生：\n\
  \n```javascript\n$(\"#img3\").click(function(e) {\n    $(this).effect(\"slide\"\
  , {to:200}, 3000, function(){\n        $(this).effect(\"slide\", {}, 3000);\n  \
  \  });\n});\n```\n\n\n\n\n```javascript\n{ direction:\"down\", distance:200}, 3000,\
  \ function(){\n    $(this).effect(\"slide\",\n        {direction:\"right\", distance:200},\
  \ 3000);\n});\n});\n```\n\n### 7. 为 `#img4` 添加以下 `click` 处理程序。该 `click` 处理程序会应用爆炸效果，将图像分解为\
  \ 16 份，并在它们在分离时逐渐淡出：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#img4\").click(function(e)\
