  \n\n\n\n### 为页面元素添加工具提示（Tooltips）\n\ntooltip 插件允许你轻松地为表单输入、图像以及几乎任何其他页面元素添加工具提示。要实现工具提示，请对文档或其他容器应用\
  \ `.tooltip(options)`。在 options 选项中，指定应包含工具提示的项，然后指定工具提示的内容处理程序。\n\n当鼠标悬停在支持工具提示的项目上时，会显示工具提示消息。列表\
  \ 19.11 中的代码提供了在 ``<input>`` 和 ``<img>``元素上实现工具提示的示例。可以在图 19.11 中看到该视觉效果：\n\n![Image](img/image00767.jpeg)\
  \ items—指定用于确定页面元素是否支持工具提示的选择器。\n\n![Image](img/image00767.jpeg) content—当悬停在支持的元素上时调用的工具提示处理函数。该函数应返回要显示的内容。注意对于图像，工具提示中显示的是一个微版本。\n\
  \n![Image](img/image00767.jpeg) position—指定放置工具提示的位置；例如：\n\n点击此处查看代码图像\n\n```\n\
  position: {my: \"left top+15\", at: \"left bottom\", collision: \"flipfit\" }\n\
  ```\n\n![Image](img/image00987.jpeg)\n\n**图 19.11** 当悬停在页面元素上时会显示工具提示。\n\n**列表 19.11\
  \ widgets_tooltips.html 使用 jQuery、CSS 和 HTML 实现标签页面板**\n\n点击此处查看代码图像\n\n```javascript\n\
  ...jQuery...\n\n$(document).ready(function(){\n  $(document).tooltip({\n    items:\
  \ \"img, input\",\n    position: { my: \"left+15 top\", at: \"left bottom\",\n \
  \               collision: \"flipfit\" },\n    content: function() {\n      var\
  \ obj = $(this);\n      if (obj.is(\"input\")) { return obj.attr( \"title\" ); }\n\
  \      if (obj.is(\"img\")) {\n        var img = $(\"<img></img>\").addClass(\"\
  mini\")\n                    .attr(\"src\", obj.attr(\"src\"));\n        var span\
  \ = $(\"<span></span>\")\n                    .html(obj.attr( \"alt\" ));\n    \
  \    return $(\"<div></div>\").append(img, span); }\n    }\n  });\n});\n```\n\n\
  ```css\n...CSS...\n\ninput { border:2px ridge; border-radius:5px; padding:3px; }\n\
  img { height:200px; margin:15px; }\n.mini {height:30px; }\n```\n\n```html\n...HTML...\n\
  \n<label for=\"size\">Who are You?</label>\n<input id=\"size\" title=\"Nosce Ipsum\
  \ (Know Thyself)\" /><br>\n<img src=\"/images/someday.jpg\" alt=\"I'm going there\"\
  />\n```\n\n### 创建自定义组件\n\n创建自定义组件是一个相当简单的过程。`$.widget()` 工厂需要一个名称，然后是原型对象。组件工厂将处理所有工作，以便可以将组件应用到页面元素上。\n\
  \n列表 19.12 中的代码显示了自定义组件的基本框架。要创建组件，请遵循以下步骤：\n\n1. 将 `custom.mywidget` 替换为你自己的名称。\n\
  2. 添加带有默认值的选项。\n3. 在 `_create()`、`_refresh()`、`_destroy()`、`_setOptions()` 和 `_setOption()`\
  \ 中添加任何额外代码。\n4. 向原型对象添加额外的属性或方法以实现组件。\n\n**列表 19.12 widgets_custom.html 实现自定义组件的\
  \ jQuery 代码**\n\n点击此处查看代码图像\n\n```javascript\n$.widget(\"custom.mywidget\", {\n\
  \  options : {\n    // 自定义选项\n  },\n  _create: function() {\n    // 创建代码\n  },\n\
  \  _refresh: function() {\n    // 元素刷新时的刷新代码\n  },\n  _destroy: function() {\n \
  \   // 组件销毁时的清理代码\n  },\n  _setOptions: function() {\n    // _super 和 _superApply\
  \ 处理保持正确的此上下文\n    this._superApply( arguments );\n    this._refresh();\n  },\n\
  \  _setOption: function( key, value ) {\n    // 设置单个选项值的代码\n    this._super( key,\
  \ value );\n  }\n});\n```\n\n### 总结\n\njQuery UI 包含大量内置组件，这些组件提供了传统 HTML 元素所缺失的许多功能和样式。在本节中，你学习了这些组件以及如何在页面上实现它们，包括自动完成元素、按钮、日期选择器、对话框、菜单、进度条、滑块、计数器、标签页和工具提示。\n\
  \n### 问答\n\n**Q. 什么是 Globalize 插件？我为什么要用它？**\n\n**A.** Globalize 插件是一个旨在简化网页国际化过程的项目，以匹配不同货币、时间和其他随地区而变化的数值格式。如果你计划建立一个包含需要本地化元素的网站，至少了解一下它是一个好主意。\n\
  \n### 工作坊\n\n工作坊由一系列问题和答案组成，旨在巩固你对本节涵盖内容的理解。在查看答案之前，尝试回答问题。\n\n### 测验\n\n**1.**\
