  \ 添加以下行，将 `draggable` 添加到主 `<div>` 元素中：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#resize1,\
  \ #resize2, #resize3\").draggable();\n```\n\n\n\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n<script type=\"\
  text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"></script>\n\
