  \ overflow-y:auto; }\n```\n\n* * *\n\n* *\n\n### 应用可选择组件 (Selectable Widget)\n\n\
  用户的另一个频繁请求是能够使用边界框在页面上轻松选择多个项目。可选择组件通过允许用户使用鼠标在可选择元素内部的可选择子元素周围绘制一个框（或称为“套索”）来提供了该功能。框内的项目将在列表中被选中。\n\
  \n表 18.8 描述了更常见的可选择选项。以下展示了将 `selectable` 组件附加到元素上并将 `tolerance` 指定为 `fit` 的示例：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"#ul1\"). selectable ({tolerance:\"fit\"});\n\
  ```\n\n![图像](img/image00971.jpeg)\n\n**表 18.8 常见可选择组件选项**\n\n可选择组件还提供了额外的事件，因此在更改选择时，可以将处理程序附加到可选择元素或其子元素。表\
  \ 18.9 列出了你可以在可选择项目上访问的事件。\n\n![图像](img/image00972.jpeg)\n\n**表 18.9 可选择组件事件**\n\
  \n每个可选择事件将传递事件对象以及一个 `ui` 对象，该 `ui` 对象将为每个事件提供代表可选择元素的值。例如，以下代码为元素添加了 `selectables`\
  \ 事件，然后访问 `selected` 属性：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#list1\").selectable();\n\
  $(\"#list1\").on(\"selectables\", function(e, ui){ ui.selected.effect(\"shake\"\
  );\n```\n\n#### 备注\n`.ui-selecting` 类会被附加到当前被选中的子元素。当子元素被选中后，`.ui-selected` 类将被附加。这允许你在在\
  \ CSS 中定义某些样式，而无需在可选择处理程序中添加/删除类。\n\n* * *\n\n* *\n\n### 亲手尝试：创建可选择集合\n\n在例例中，你将在\
  \ `<list>` 和一组图像上实现 `selectable`。该示例的目的是让你了解实现 `selectable` 组件的几种方法。你将有机会应用一些选项并使用事件处理程序与选择过程进行交互。示例的代码位于\
