  18 </html>\n```\n\n### 总结\n\n### 依赖注入允许你定义可以注入到其他 AngularJS 组件的提供者功能。提供者功能包含在模块内部并在注入器服务（injector\
  \ service）注册。提供者定义了如何构建功能，以便当另一个组件对提供者定义依赖时，可以创建并注入提供者对象的实例。\n\nAngularJS 提供了一个相当健壮的依赖注入模型，允许你定义不同类型的服务提供者。使用依赖注入而不是全局定义可以让你的代码更加模块化且易于维护。在本节中，你学习了依赖注入模型，并了解了如何在模块和控制器组件中实现它。\n\
  \n### 问答\n\n**问。 AngularJS 程序的控制器和指令代码会在运行块（run block）之前还是之后运行？**\n\n**答。** 执行顺序是：config、run、指令编译（directive.compile）、controller\
  \ 和指令链接（directive link）。\n\n### 工作坊\n\n工作坊由一组问题和答案组成，旨在巩固你的理解。\n\n### 测验\n\n**问。\
  \ AngularJS 程序的控制器和指令代码会在运行块（run block）之前还是之后运行？**\n\n**答。** 执行顺序是：config、run、指令编译（directive.compile）、controller\
  \ 和指令链接（directive link）。\n\n\n\n\n控制器（Controllers）是旨在通过扩展作用域（scope）来提供业务逻辑的代码。你通过使用应用\
  \ `Model` 对象上的 `controller()` 方法创建控制器。该函数将控制器注册为模块中的提供者（provider），但它不会创建控制器的实例。实例化是在\
  \ AngularJS 模板中链接 `ng-controller` 指令时完成的。\n\n`controller()` 方法接收控制器名称作为第一个参数，并将依赖项数组作为第二个参数。例如，以下代码定义了一个使用依赖注入来访问名为\
  \ `start` 的 `value` 提供者的控制器：\n\n```javascript\nangular.module('myApp', []).\n  value('start',\
  \ 200).\n  controller('Counter', ['$scope', 'start',\n                function($scope,\
  \ startingValue) {\n  }]);\n```\n\n注意，`value()` 和 `controller()` 方法是使用点 `.` 符号链式连接的。你会在\
  \ AngularJS 应用中经常看到这种用法。当 AngularJS 中创建一个新的控制器实例时，还会创建一个特定于该控制器的新子作用域，并且可以通过注入到前面的\
  \ `Counter` 控制器的 `$scope` 服务进行访问。在之前的示例中，`start` 提供者被注入到控制器中，并作为 `startingValue`\
  \ 传递给控制器函数。参数注入基于它们在传递给 `controller()` 函数的数组中的位置。\n\n控制器必须初始化创建并添加到作用域的状态。控制器还负责附加到该作用域的任何业务逻辑。这可能意味着处理作用域的更新更改、操纵作用域值，或根据作用域的状态发射事件。\n\
  \n### 动手尝试：实现一个基础控制器\n\n在这个示例中，你将有机会尝试一下控制器代码。列表 22.1 显示了如何实现一个利用依赖注入、初始化某些值并使用\
  \ `inc()`、`dec()` 和 `calcDiff()` 函数实现基础业务逻辑的控制器。列表 22.2 显示了一个基础的 AngularJS HTML\
  \ 模板，该模板提供了查看和操作作用域中存储的值的视图。\n\n使用以下步骤构建应用并实现应用和控制器：\n\n1. 添加 `lesson22/scope_controller.html`\
  \ 和 `lesson22/js/scope_controller.js` 文件。\n2. 将列表 22.1 和列表 22.2 中所示代码添加到 HTML 和\
  \ JavaScript 文件中。\n3. 来自列表 22.1 的后续代码实现了一个 AngularJS 模块和一个名为 `Counter` 的控制器：\n\n\
  ```javascript\n01 angular.module('myApp', []).\n02   value('start', 200).\n03  \
  \ controller('Counter', '$scope', 'start',\n04                               function($scope,\
  \ start) {\n```\n\n4. 然后接下来的几行在 `Counter` 控制器的 `$scope` 中定义了值：\n\n```javascript\n\
  05    $scope.start = start;\n06    $scope.current = start;\n07    $scope.difference\
  \ = 0;\n08    $scope.change = 1;\n```\n\n5. 注意，在接下来的行中，定义了函数 `inc()`、`dec()` 和 `calcDiff()`，它们用于操纵\
  \ `current` 和 `difference` 的值：\n\n```javascript\n09    $scope.inc = function() {\n\
  10      $scope.current += $scope.change;\n11      $scope.calcDiff();\n12    };\n\
  13    $scope.dec = function() {\n14      $scope.current -= $scope.change;\n15  \
  \    $scope.calcDiff();\n16    };\n17    $scope.calcDiff = function() {\n18    \
  \  $scope.difference = $scope.current - $scope.start;\n19    };\n```\n\n6. 代码[列表\
  \ 22.2 实现了一个 AngularJS 模板，该模板提供了一个数字输入来设置作用域中的 `change` 值，以及调用 `inc()` 和 `dec()`\
  \ 来更改 `current` 值的 + 和 - 按钮。模板还使用简单的过滤器显示初始值、当前值和差值。图 22.1 显示了网页页的运行情况。你可以设置增减值并点击\
  \ +/– 按钮来减少当前值并查看作用域中的差值。\n\n**图 22.1** 一个基础应用，在作用域中存储初始值和当前值，然后显示差值以说明作用域的交互。\n\
  \n**列表 22.1 scope_controller.js 使用依赖注入、初始化作用域值并实现逻辑的基础控制器**\n\n```javascript\n01\
