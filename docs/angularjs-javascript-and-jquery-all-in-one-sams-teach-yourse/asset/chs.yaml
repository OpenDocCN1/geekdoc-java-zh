  59 app.listen(80);\n```\n\n### 使用高级 jQuery AJAX\n\n本节中已经涵盖的概念应该能够满足你大部分 AJAX 需求。然而，它们并没有涵盖\
  \ jQuery AJAX 接口的所有功能。以下章节将讨论直接内置在 jQuery 中的一些额外 AJAX 功能。\n\n#### 复习全局设置\n\njQuery\
  \ 提供了 `.ajaxSetup()` 方法，允许你指定选项以便在整个脚本中全局配置 AJAX 请求。表 15.3 列出了调用 `.ajaxSetup()`\
  \ 时可以指定的某些选项。例如，以下代码设置了请求的默认全局 URL：\n\n点击此处查看代码图像\n\n```javascript\n$.ajaxSetup({url:\"\
  service.php\", accepts:\"json\"})\n```\n\n#### 使用全局事件处理器\n\njQuery 提供了了一些方法，用于创建全局事件处理器，这些处理器会在特定事件发生时被调用，例如所有\
  \ AJAX 请求的初始化或完成。全局事件会在每次 AJAX 请求时触发。表 15.2 列出了你可以使用的用于注册全局事件处理器的方法。\n\n![Image](img/image00943.jpeg)\n\
  \n**表 15.2 jQuery 全局 AJAX 事件处理器注册方法**\n\n接下来展示了一个使用全局事件处理器设置表单类名的示例：\n\n点击此处查看代码图像\n\
  \n```javascript\n$(document).ajaxStart(function(){\n  $(\"form\").addClass(\"processing\"\
  );\n});\n\n$(document).ajaxComplete(function(){\n  $(\"form\").removeClass(\"processing\"\
  );\n});\n```\n\n> 注意：无论全局设置的值为何，跨域脚本或 JSONP 请求都永远不会触发全局事件。\n\n#### 实现低级 Ajax 请求\n\
  \n你在本节中一直使用的所有 AJAX 请求封装方法在底层都是通过 `.ajax(url [, settings])` 接口处理的。该接口使用起来稍微困难，但它赋予了你对\
  \ AJAX 请求更大的灵活性和控制力。\n\n`.ajax()` 方法的调用与 `.get()` 和 `.post()` 相同；然而，`settings` 参数允许你设置用于请求的各种配置。表\
  \ 15.3 列表出了适用于 `.ajax()` 方法的更常用的设置。\n\n![Image](img/image00944.jpeg)\n\n**表 15.3\
  \ .ajax() 请求中提供的常用设置**\n\n以下代码展示了一个使用 `.ajax()` 接口的简单示例：\n\n点击此处查看代码图像\n\n```javascript\n\
  $.ajax({\n  url:\"setEmail\",\n  type:\"get\",\n  accepts:\"json\",\n  contentType:\
  \ 'application/x-www-form-urlencoded; charset=UTF-8',\n  data: {\"first\":\"Brad\"\
  , \"last\":\"Dayley\"}\n}).fail(function(){ alert(\"request Failed\"); });\n```\n\
  \n`.ajax()` 方法返回一个 `jqXHR` 方法，该方法提供了一些额外功能，特别是在响应时。表 15.4 列出了附加到 `jqXHR` 对象的一些方法和属性。\n\
  \n![Image](img/image00945.jpeg)\n\n**表 15.4 .ajax() 返回的 jqXHR 对象常用方法和属性**\n\n###\
  \ 总结\n\nAJAX 是 jQuery/JavaScript 与 Web 服务器之间基本的通信框架。使用 AJAX 允许你从 Web 服务器获取额外数据并用它动态更新页面，而不是完全重新加载。这让你能够为用户提供更好的体验。\n\
  \n在本节中，你学习了 AJAX 的来龙去脉。你实现了几个示例，让你获得了处理 GET 和 POST 请求的经验，以及如何处理不同类型的数据（如 HTML、JSON\
  \ 和 XML）。\n\n### 问答\n\nQ 为什么既有 GET 请求又有 POST 请求，而不是只有一个请求？\n\nA 答案是优化。虽然你可以只用 POST\
  \ 请求完成所有工作，但通过使用参数直接放在 URL 中的 GET 请求，可以在 Web 服务器和浏览器端进行优化。这在缓存处理方面尤为如此。\n\nQ 除了\
  \ JSONP 之外，还有其他方法可以发送跨域请求吗？\n\nA 有。Flash 和 Silverlight 都有允许你发送跨域请求的机制。HTML5 引入了旨在允许跨域请求的\
  \ `postMessage` 接口。\n\n### 工作坊\n\n工作由一组问题和答案组成，旨在巩固你对本节涵盖内容的理解。尝试在查看答案之前先回答问题。\n\
  \n### 测验\n\n1 在 Web 服务器上设置新密码时，你会使用 GET 请求还是 POST 请求？\n\n2 对或错误：`.done()` 事件处理器函数仅在\
  \ AJAX 请求成功时才被调用。\n\n3 对于 XML 数据，响应数据被转换为什么数据类型？\n\n4 对于 JSON 数据，响应数据被转换为什么数据类型？\n\
  \n5 是否可以通过 jQuery 指定随 GET 请求一起发送的请求头？\n\n### 测验答案\n\n1 POST。\n\n2 正确。\n\n3 DOM 对象。\n\
  \n4  JavaScript 对象。\n\n5 是。你可以使用 `.ajax()` 配合参数，也可以使用 `.ajaxSetup()` 全局设置参数。\n\n\
