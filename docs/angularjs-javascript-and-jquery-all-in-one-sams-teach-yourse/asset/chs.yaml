  \n* * *\n\n* *\n\n 尝试一下：为 HTML 元素添加边框\n\n另一个可以修改以完全改变 HTML 组件外观和感觉的 CSS 属性是 `border`\
  \ 属性。所有的容器元素，如 `<div>`、`<span>` 和 `<p>`，都允许你通过 CSS 定义边框样式。\n\n表 4.2 描述了一些可以在 CSS\
  \ 中修改以定义各种样式边框的 CSS 属性。\n\n![图像](img/image00838.jpeg)\n\n#### 表 4.2 定义边框样式的 CSS\
  \ 属性\n\n你可以使用以下语法在单个属性设置上指定 `border-width`、`border-color` 和 `border-style` 属性的不同值：\n\
  \n点击此处查看代码图像\n\n`property: top right left;`\n`border-width: 1px 2px 1px 2px;`\n\
  `border-color: red blue red;`\n\n你也可以使用位置设置单个边框属性，例如 `border-top` 或 `border-top-width`。例如，下面的\
  \ CSS 将仅样式边框的顶部和左侧：\n\n`border-top: 1px solid;`\n`border-left-color: blue;`\n`border-left-style:\
  \ solid;`\n`border-left-width: 2px;`\n\n以下步骤将引导你通过在 列表 4.4 和 列表 4.5 中创建代码，为 `<div>`\
