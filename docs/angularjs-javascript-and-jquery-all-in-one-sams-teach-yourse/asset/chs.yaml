  \ 辅助函数允许你同时设置 `mouseenter` 和 `mouseleave` 事件的处理器。例如：\n\n点击此处查看代码图像\n\n```\nobj.hover(function\
  \ enterHandler(e){...}, function leaveHandler(e){...});\n```\n\n等同于\n\n点击此处查看代码图像\n\
  \n```\nobj.addEventListener(\"mouseenter\", function enterHandler(e){...});\nobj.addEventListener(\"\
  mouseleave\", function leaveHandler (e){...});\n```\n\n你也可以通过仅指定一个处理器来为 `mouseenter`\
  \ 和 `mouseleave` 设置同一个处理器。例如：\n\n点击此处查看代码图像\n\n```\nobj.hover(function hoverHandler(e){...});\n\
  ```\n\n### 手动触发事件\n\nJavaScript 和 jQuery 允许你手动触发事件。这提供了许多优势，例如模拟用户交互、将页面元素交互结合在一起，或与自定义自定义事件进行交互。\n\
  \n以下章节描述了如何在 JavaScript 和 jQuery 中触发事件。\n\n#### 在 JavaScript 中触发事件\n\n在 JavaScript\
  \ 中触发事件最简单的方法是使用附加在 DOM 对象上的方法（如果有）。对于 `click`、`select`、`blur` 和 `focus` 等简单事件，支持它们的\
  \ DOM 对象上都有相应的方法。例如，你可以使用以下语法在大多数 DOM 对象上触发 `click` 事件：\n\n```\nobj.click();\n```\n\
  \nJavaScript 中触发事件的更高级的方法是创建一个事件对象，然后使用 `document.dispatchEvent()` 调用来触发事件机制。这种方法对事件信息提供了更多的控制，并且是触发许多事件的唯一方法。`dispatchEvent()`\
  \ 方法涉及三个步骤。\n\n第一步是使用 `document.createEvent()` 方法创建一个事件对象。`createEvent()` 方法要求你为正在创建的对象指定事件\
  \ `type`。表 9.4 列出了 `createEvent()` 接受的一些常见事件类型。例如，要创建一个鼠标 `click` 事件对象，请使用以下语句：\n\
  \n点击此处查看代码图像\n\n```\nvar clickEvent = document.createEvent(\"MouseEvents\");\n```\n\
  \n![Image](img/image0089.jpeg)\n\n**表 9.4 `createEvent()` 支持的常见事件类型**\n\n下一步是通过调用事件的初始化函数为事件对象初始化值。表\
  \ 9.4 列出了事件类型对应的初始化函数以及支持的参数。\n\n例如，要初始化点击事件对象，请使用以下语句。类型指定为 `\"click\"`，且 `bubbling`\
  \ 和 `cancelable` 属性均 true `true`。这里，`window` 被用作 `view` 。坐标并不重要，所以它们保持为 0，额外的键盘键也不重要，因此它们被设置为\
  \ `false`。`button` 参数设置为 0 以表示左键，且没有指定相关的 target：\n\n点击此处查看代码图像\n\n```\nclickEvent.initMouseEvent(\"\
  click\", true, true, window, 0, 0, 0, 0, 0, 0, false, false, false, false, 0, null);\n\
  ```\n\n在大多数情况下，初始化函数的参数应该是自显其意的。然而，你可能需要检查某些特定的参数。你可以在 [www.w3.org/TR/DOM-Level-2-Events/events.html](http://www.w3.org/TR/DOM-Level-2-Events/events.html)\
  \ 找到事件对象和方法的定义。\n\n最后一步是在你想触发的元素上调用 `dispatchEvent()`。\n\n### 动手尝试：手动触发事件\n\n在这个示例中，你将逐步了解使用事件触发点击事件的过程。\n\
  \n**1.** 在 `manual_event.html` 中，将列表 9.7 所示的代码添加到 HTML 文件。这是一个包含两个复选框的基础 HTML 文件。\n\
  \n**2.** 打开 `manual_event.js` 并编写以下 `onloadHandler()` 初始化函数，它为两个 `<span>` 元素附加事件监听器：\n\
  \n点击此处查看代码图像\n\n```\nfunction onloadHandler(){\n  var employee = document.getElementById(\"\
  Employee\");\n  employee.addEventListener('click', simpleClick, false);\n  var registered\
  \ = document.getElementById(\"Registered\");\n  registered.addEventListener('click',\
  \ eventClick, false);\n}\n```\n\n**3.** 将列表 9.9 中的 CSS 添加 CSS 文件。这段代码将 `<span>`\
  \ 元素的样式使其像按钮。\n\n**4.** 为第一个按钮创建 `simpleClick()` 处理函数。该代码使用事件的 `target.id` 寻找对应的复选框元素。然后在复选框对象上调用\
  \ `click()` 函数，从而触发 `click` 事件，就像鼠标点击了它一样：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ simpleClick(e){\n  var cb = document.getElementById(\"check\"+e.target.id);\n\
  \  cb.click();\n}\n```\n\n**5.** 为第二个按钮添加以下 `eventClick()` 处理函数。该代码首先创建一个 `\"MouseEvents\"\
  ` 对象，然后使用相应的参数将其初始化为 `\"click\"` 类型。该代码还使用事件的 `target.id` 寻找对应的复选框元素，然后在复选框元素对象上调用\
  \ `dispatchEvent()`，触发鼠标 `click` 事件：\n\n点击此处查看代码图像\n\n```javascript\nfunction eventClick(e){\n\
  \  var clickEvent = document.createEvent(\"MouseEvents\");\n  clickEvent.initMouseEvent(\"\
  click\", true, true, window, 0, 0, 0, 0, 0, 0, false, false, false, false, 0, null);\n\
  \  e.target.dispatchEvent(clickEvent);\n}\n```\n\n\n\n\n\n```javascript\nvar event\
  \ = document.createEvent(\"MouseEvents\");\n\nevent.initMouseEvent(\"click\", true,\
  \ true, window,\n                    0, 0, 0, 0, 0, false, false,\n            \
  \        false, false, 0, null);\nvar cb = document.getElementById(\"check\"+e.target.id);\n\
  cb.dispatchEvent(event);\n```\n\n7. 保存所有三个文件，然后在网络浏览器中打开 HTML 文档，如图 9.4 所示。尝试操作复选框和按钮。注意，按钮提供的交互效果与直接点击复选框是相同的。\n\
