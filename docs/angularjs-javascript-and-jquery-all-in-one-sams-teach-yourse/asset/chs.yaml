  \ 小组件将某些元素变为可拖拽的，将其变为可放置的，从而创建了一些拖放元素。添加 selectable 小组件允许你在多个项目周围绘制边界框或套索框。你使用了\
  \ resizable 小组件让如 `div` 等容器变得可调整大小。你还调整了容器的大小。\n\n## 第 19  使用 jQuery UI 小组件为网页添加丰富的交互\n\
  \n你将学习：\n\n- 添加自动补全、滑块和计数器\n- 如何在表单中添加 datepicker 日历\n- 样式化对话框和按钮的方法\n- 实现工具提示\n\
  - 使用自定义菜单和标签页组织你的网页\n- 如何将状态栏应用到你的工作流\n\n\n\n\n本节未包含“**自己试试**”部分，因为这些示例非常基础且易于理解。每个列表的代码以及辅助图像可以在书籍网站的\
  \ `code/lesson19` 处找到。\n\n### 复习小组件（Widgets）\n\n在开始之前，本节将复习如何在小组件元素上访问选项（options）和属性值（attribute\
  \ values），因为这与普通的 jQuery 对象略有不同。\n\n在创建小组件时，选项是在传递给构造函数的对象中指定的。例如，以下代码为滑块小组件（slider\
  \ widget）设置了 `min` 和 `max` 选项：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#mySlider\").slider({min:2,\
  \ max:10});\n```\n\n要稍后访问这些选项，你需要将 `\"options\"` 作为 `.slider()` 调用的参数。例如，以下代码设置了然后获取了\
  \ `max` 选项：\n\n点击此处查看代码图像\n\n```javascript\nvar slider = $(\"#mySlider\").slider({min:2,\
  \ max:10});\nslider.slider(\"option\", \"max\", 100);\nvar currentMax = slider.slider(\"\
  option\", \"max\");\n```\n\n小组件的属性值的访问方式类似。例如，以下代码获取了然后设置了滑块上 `value` 属性的值：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar value = $(\"#mySlider\").slider(\"value\");\n$(\"\
  #mySlider\").slider(\"value\", value+5 );\n```\n\n事实上，`value` 和 `options` 是滑块小组件上的方法，当它们作为第一个参数传递时会被调用。\n\
  \n### 添加可折叠手风琴元素（Accordion Element）\n\n手风琴小组件（accordion widget）将标题对和内容组合成一个可折叠的手风琴视图。手风琴小组件应用于容器元素，并且所有的标题头都会被识别。`header`\
  \ 将变成一个标签（tab），而标题头之间的内容将附加到一个独立的、可展开/折叠的 `<div>` 元素上。\n\n列表 19.1 中的代码创建了一个每个标签都以图像作为内容的手风琴视图。视觉效果可以在\
  \ 图 19.1 中看到。以下选项是示例的一部分：\n\n![Image](img/image00767.jpeg) header—指定在确定标题元素时使用的选择器。\n\
  \n![Image](img/image00767.jpeg) collapsible—布尔值。如果为 `true`，则手风琴中的所有内容都可以折叠。\n\n\
  ![Image](img/image00977.jpeg)\n\n**图 19.1** 简单的的手风琴视图。\n\n**列表 19.1 widgets_accordian.html`\
  \ 使用 jQuery、CSS 和 HTML 实现手风琴**\n\n点击此处查看代码图像\n\n* * *\n\n...jQuery...\n\n```javascript\n\
  11      $(window).load(function(){\n12        $( \"#accordion\" ).accordion(\n13\
  \            {header:\"p\", collapsable:true});\n14      });\n```\n...CSS...\n\n\
  ```css\n17      div { width:300px; }\n18      img { width:300px; }\n```\n...HTML...\n\
  \n```html\n21      <div id=\"accordion\">\n22        <p>Fort</p><div>\n23      \
  \  <img src=\"/images/fort.jpg\" /></div>\n24        <p>Bison</p><div>\n25     \
  \   <img src=\"/images/bison.jpg\" /></div>\n26        <p>Sunset</p><div>\n27  \
  \      <img src=\"/images/sunset3.jpg\" /></div>\n28        <p>tiger</p><div>\n\
  29        <img src=\"/images/tiger.jpg\" /></div>\n30      </div>\n```\n* * *\n\n\
