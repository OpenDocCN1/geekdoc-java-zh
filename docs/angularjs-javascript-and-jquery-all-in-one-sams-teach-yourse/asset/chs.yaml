  writeIt()\">\n29   </body>\n30</html\n```\n\n***\n\n### 理解作用域\n\n在你开始向 JavaScript\
  \ 中添加条件、函数和循环之后，你需要理解作用域。变量作用域简单来说：“在当前行，变量的值是什么？”\n\nJavaScript 允许定义全局和局部版本。全局版本定义在主\
  \ JavaScript 中，而局部版本定义在函数内部。在函数内部，你将引用局部版本。\n\n为了更好地理解作用域，请考虑以下代码：\n\n```javascript\n\
  01 <script>\n02   var myVar = 1;\n03   function writeIt(){\n04     var myVar = 2;\n\
  05     document.write(myVar);\n06     writeIt();\n07   }\n08   function writeMore(){\n\
  09     document.write(myVar);\n10  }\n11 </script>\n```\n\n全局变量 `myVar` 定义在第 2 行。在第\
  \ 4 行，在 `writeIt()` 函数内部定义了一个局部版本。因此，第 5 行将写入文档。随后在第 6 行调用了 `writeMore()`。由于 `writeMore()`\
  \ 中没有定义 `myVar` 的局部版本，第 9 行将写入全局 `myVar` 的值。\n\n#### 添加错误处理\n\nJavaScript 编码的一个重要部分是为可能出现的问题添加错误处理。默认情况下，如果由于\
  \ JavaScript 中的问题导致发生代码异常，脚本将失败且不会加载。这通常不是我们想要的行为。\n\n### Try/Catch 块\n\n为了防止代码完全崩溃，请使用\
  \ `try`/`catch` 块来处理代码内部的问题。如果 JavaScript 在执行 `try`/`catch` 块中的代码时遇到错误，它将跳到下方执行\
  \ `catch` 部分，而不是停止整个脚本。如果没有发生错误，则将执行 `try` 的所有内容，而不执行 `catch`。\n\n例如，下面的 `try`/`catch`\
  \ 块将执行任何替换 `your_code_here` 的代码。如果在执行该代码时发生错误，则会将错误信息以及后面的字符串 \": 发生在加载脚本时”写入文档：\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```javascript\ntry {\n    your_code_here\n} catch (err)\
  \ {\n  document.write(err.message + \": happened when loading the script\");\n}\n\
  ```\n\n### 抛自定义错误\n\n你也可以使用 `throw` 语句抛出自己的错误。以下代码说明了如何向函数添加 `throw` 来抛出错误，即使在没有发生脚本错误的情况下也是如此：\n\
  \n点击此处查看代码图片\n\n```javascript\n01 <script>\n02    function sqrRoot(x) {\n03    \
  \  try {\n04        if(x==\"\")    throw \"Can't Square Root Nothing\";\n05    \
  \    if(isNaN(x)) throw \"Can't Square Root Strings\";\n06        if(x<0)      throw\
  \ \"Sorry No Imagination\";\n07        return \"sqrt(\"+x+\") = \" + Math.sqrt(x);\n\
  08      } catch(err){\n09        return err;\n10      }\n11    }\n12    function\
  \ writeIt(){\n13      document.write(sqrRoot(\"four\") + \"<br>\");\n14      document.write(sqrRoot(\"\
  \") + \"<br>\");\n15      document.write(sqrRoot(\"4\") + \"<br>\");\n16      document.write(sqrRoot(\"\
  -4\") + \"<br>\");\n17    }\n18 </script>\n```\n\n函数 `sqrRoot()` 接受单个参数 `x`。然后测试\
  \ `x` 以验证它是否为正数，并返回 `x` 平方的根字符串。如果 `x` 不是正数，则抛出相应的错误并返回给 `writeIt()`。\n\n### 使用\
  \ finally\n\n异常处理中的另一个有用工具是 `finally` 关键字。可以将 `finally` 关键字添加到 `try`/catch` 块的末尾。在执行\
  \ `try`/catch` 块之后，`finally` 块始终会被执行。无论是否发生并捕获了错误，或者 `try` 块是否完全执行完毕都是。\n\n以下是在网页中使用\
  \ `finally` 块的示例：\n\n点击此处查看代码图片\n\n```javascript\nfunction testTryCatch(value){\n\
  \  try {\n    if (value < 0){\n      throw \"too small\";\n    } else if (value\
  \ > 10){\n      throw \"too big\";\n    }\n    your_code_here\n  } catch (err) {\n\
  \    document.write(\"The number was \" + err.message);\n  } finally {\n    document.write(\"\
  This is always written.\");\n  }\n}\n```\n\n### 总结\n\n在本节中，你学习了在网页中添加 jQuery 和 JavaScript\
  \ 的基础知识。描述了 JavaScript 以及随后的 jQuery 中使用的基本数据类型。你学习了在 JavaScript 应用中应用条件逻辑的一些基本语法。你还学习了如何将\
  \ JavaScript 应用划分为可以在其他地方重用的函数。最后，你学习了在浏览器接收异常之前处理脚本中 JavaScript 错误的方法。\n\n### 问答\n\
  \n**Q. 在字符串操作中何时应该应该使用正则表达式？**\n\n**A.** 这取决于你对正则表达式的理解。经常使用正则表达式并很好掌握语法的人几乎总是更倾向于使用正则表达式，因为它们非常多功能。如果你不熟悉正则表达式，花费时间来研究语法，因此你只会在需要时才使用它们。底线是，如果你需要频繁操作字符串，那么学习正则表达式是绝对值得的。\n\
  \n**Q. 我可以同时加载多个版本的 jQuery 吗？**\n\n**A.** 可以，但实际上没有正当理由这样做。最后加载的那个将覆盖上一个版本的功能。第一个版本中任何未被覆盖的函数都可能因为库的不匹配而变得完全不可预测。最好的办法是针对特定版本进行开发和测试，然后更新到该版本。\n\
  \n\n\n\n\n```javascript\nvar x = new Number(\"5\");\n```\n\n## 访问对象属性\n\n几乎所有的 JavaScript\
  \ 对象都有一个可以通过标准点命名语法访问的值。例如，考虑一个变量名为 `user` 的对象，它包含一个名为 `firstName` 的属性。以下语句访问了 `user`\
  \ 对象中 `firstName` 属性的值：\n\n```javascript\nuser.FirstName\n```\n\n### 访问对象方法\n\n\
  许多 JavaScript 对象还拥有方法。对象方法是作为名称附加到对象上的函数。可以使用点符号语法引用方法名来调用该函数。例如，如果名为 `user` 的对象有一个名为\
  \ `getFullName()` 的方法，则可以通过以下语句调用该函数：\n\n```javascript\nuser.getFullName()\n```\n\
  \n## 为对象分配新值和方法\n\nJavaScript 对象最酷酷的特性之一是，你可以在任何时候使用点符号语法为它们分配新的属性和方法值。无论它是内置对象还是你自定义的某个对象都没关系。之后可以使用相同的点符号语法访问该值。\n\
  \n以下是一个向我们在几个示例中使用的主文档对象（document object）添加一个方法和一个属性的示例。注意，我们定义了一个简单的函数，将 `document.me`\
  \ 属性写入浏览器。然后我们为 `document.me` 分配一个值，并将不带 `()` 的函数 `writeMe()` 赋值给 `document.writeMe`。此时，我们可以调用\
  \ `document.writeMe` 并访问属性 `document.me`：\n\n点击此处查看代码图像\n\n```html\n<script>\n \
  \ function writeMe(){\n    document.write(document.me);\n  }\n  document.me = \"\
  Brad Dayley\";\n  document.writeMe = writeMe;\n  document.writeMe();\n</script>\n\
  ```\n\n> **注意**\n> 如果你为对象分配一个新值，同名的现有属性或方法将被覆盖。在为对象分配值时，请小心不要意外覆盖现有的属性或方法。\n\n##\
  \ 理解内置对象\n\nJavaScript 拥有几个内置对象，它们提供特定的功能 set。使用这些内置对象将节省时间，因为它们提供了已经编写并测试的方法来处理数据。接下来的章节没有包含所有的\
  \ JavaScript 对象，但涵盖了本书书中需要的那些。\n\n### Number\n\n`Number` 对象提供了在处理数字时非常有用的功能。创建一个数字对象与仅仅给变量赋值一个数字不同。当你创建一个\
  \ `Number` 对象时，你还会获得一组可以与它配合的方法。\n\n`Number` 对象提供了表 6.1 中列出的方法。根据下面的对象创建，在表 6.1\
  \ 中查看这些每个方法的输出结果：\n\n点击此处查看代码图像\n\n```javascript\nvar x = new Number(\"5.55555555\"\
  );\n```\n\n![Image](img/image00854.jpeg)\n\n**表 6.1 使用内置 Number 对象方法**\n\n我们选择将数字\
  \ `5.555555555` 作为字符串而不是数字传入，用来说说明 `Number()` 可以接受字符串、数字或代表字符串或数字的变量。该字符串必须是数字字符串，否则\
  \ `Number` 对象的值将为 `NaN`（非数字）。\n\n在创建 `Number` 对象之前测试值是一个好主意。要测试一个值并判断它是否为数字，请使用\
  \ `isNaN()` 函数。如果值是数字或可以转换为数字的字符串，`isNaN()` 返回 `false`。\n\n> **注意**\n> 在检查数字时，可以使用十六进制字符串。当你正在处理十六进制颜色值（例如\
  \ #e0ffff）时，这非常有用。在 JavaScript 中使用的字符串格式为“0xe0ffff”。\n\n### String\n\n`String` 对象是\
  \ JavaScript 中到目前最常用的对象。每当你定义一个具有字符串数据类型的变量时，JavaScript 都会创建一个 `String` 对象。例如：\n\
  \n```javascript\nvar myStr = \"Teach Yourself jQuery & JavaScript in 24 Lessons\"\
  ;\n```\n\n当你创建一个字符串时，有几个特殊字符是不能直接添加到字符串中的。对于这些字符，JavaScript 提供了一组在表 6.2 中描述的转义码。\n\
  \n![Image](img/image00855.jpeg)\n\n**表 6.2 JavaScript 字符串中使用的转义码**\n\n要获取字符串的长度，你可以使用\
  \ `String` 对象的 `length` 属性，例如：\n\n```javascript\nvar numOfChars = myStr.length;\n\
  ```\n\n`String` 对象有几个函数，允许你以各种方式访问和操作字符串。字符串操作的方法在表 6.3 中描述。\n\n![Image](img/image00856.jpeg)![Image](img/image00857.jpeg)\n\
  \n**表 6.3 用于操作 JavaScript 字符串的 String 对象方法**\n\n为了让你开始使用 `String` 对象提供的功能，接下来的章节描述了一些可以使用\
  \ `String` 对象方法完成的常见任务。\n\n### 组合字符串\n\n多个字符串可以通过 `+` 运算符或使用 `concat()` 方法进行组合。例如，在下面的代码中，`sentence1`\
  \ 和 `sentence2` 将相同的：\n\n点击此处查看代码图像\n\n```javascript\nvar word1 = \"Today \";\n\
  var word2 = \"is \";\nvar word3 = \" \";\nvar word4 = \"yesterday.\";\nvar sentence1\
  \ = word1 + word2 + word3 + word4;\nvar sentence2 = word1.concat(word2, word3, word4);\n\
  ```\n\n### 搜索子字符串\n\n要判断一个字符串是另一个字符串的子字符串，可以使用 `indexOf()` 方法。例如，下面的代码仅当字符串包含“think”时才写入字符串：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myStr = \"I think, therefore I am.\";\nif (myStr.indexOf(\"\
  think\") != -1)\n  document.write(myStr);\n```\n\n### 替换字符串中的单词\n\n另一个 `String`\
  \ 对象任务是替换子字符串。要替换字符串中的一个单词，请使用 `replace()` 方法。下面的代码将 `<username>` 替换为 `username`\
  \ 的值：\n\n点击此处查看代码图像\n\n```javascript\nvar username = \"Brad\";\nvar output = \"\
  <username> please enter your password: \";\noutput = output.replace(\"<username>\"\
  , username);\n```\n\n### 将字符串分割为数组\n\n字符串的一个常见任务是使用分隔符将其分割为数组。例如，下面的代码使用 `split()`\
  \ 方法根据 `:` 分隔符时间字符串：\n\n```javascript\nvar t = \"12:10:36\";\nvar tArr = t.split(\"\
  :\");\nvar hour = tArr[0];\nvar minute = tArr[1];\n\n## 动手尝试：在 JavaScript 中操作字符串\n\
  \n在本节中，你按照步骤操作一些字符串以生成一个简单的 madlib。这只是一个基础示例，但它应该有所帮助。完整代码见列表 6.1，结果显示在图 6.1](#part0017.xhtml_ch06fig01)。\n\
