  \n## 第 29 节：以 AngularJS 的方式创建丰富的 Web 组件\n\n你将在本节中学习到：\n\n- 使用自定义 AngularJS 指令实现拖放的方法\n\
  - 如何使用嵌套的 AngularJS 指令构建标签页面板应用程序\n- 使用自定义 AngularJS 指令实现可展开和折叠的容器\n- 如何使用简单的 AngularJS\
  \ 代码实现星级评分视图\n\n本书之前的 AngularJS 课程旨在教你 AngularJS 应用程序中不同组件的机制和基础实现。你已经学习了作用域/模型（scope/model）、视图（views）、控制器（controllers）、指令（directives）和服务（services）。本节稍微转换思路，提供了一些示例来帮助巩固\
  \ AngularJS 中的操作方法。\n\nAngularJS 对结构的要求比普通的 JavaScript 甚至 jQuery 要求的要得多。然而，它在框架内部仍然提供了很大的灵活性。因此，尽可能从不同的角度观察在\
  \ AngularJS 中实现任务的方法是一个好主意。\n\n这就是为什么整节课程都致力于展示以各种方式实现 AngularJS 的系列示例。本节中的示例并没有经过完美打磨——有些比其他的更完善——但是，它们提供了实现自定义指令和利用内置指令的不同视角。其目的不是为你提供立刻可复用的代码，而是提供一些不同的观点和一个基础框架，你可以在设计自己的实现方案时在此基础上构建。\n\
  \n### 试一试：构建标签页视图\n\n在这个示例中，你将构建两个自定义 AngularJS 指令：一个充当标签组，另一个充当标签组中的单个面板。此示例的目标是让你了解如何将自定义指令嵌套在另一个指令内部，以及它们之间的一些通信。\n\
  \n使用以下步骤构建标签页视图的 AngularJS 应用程序：\n\n1. 创建以下文件夹和文件结构。`server.js` 文件和 `images` 文件夹是在《动态编程》中创建的。你需要从书籍网站获取图像或提供自己的：\n\
