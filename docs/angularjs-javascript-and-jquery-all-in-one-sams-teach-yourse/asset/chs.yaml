  \ 0 到 100 的 `value` 属性来控制。进度由具有 `.ui-progressbar-value` 类的元素表示。\n\n列表 19.7 提供实现进度条的示例。进度在\
  \ `inc()` 函数中更新，该函数说明了如何获取和设置进度条的值。`setTimeout()` 用于延迟。视觉效果可以在图 19.7 中看到。\n\n![Image](img/image0983.jpeg)\n\
  \n**图 19.7** 由 `setTimeout()` 更新的进度条。\n\n**列表 19.7 widgets_progress_bars.html 使用\
  \ jQuery, CSS, 和 HTML 实现进度条**\n\n点击此处查看代码图像\n\n```javascript\n...jQuery...\nfunction\
  \ inc(){\n  var value = $(\"#progressbar\").progressbar(\"value\") + 5;\n  if (value\
  \ <= 100){\n    $(\"p\").html(\"Progress: \" + value + \"%\");\n    $(\"#progressbar\"\
  ).progressbar(\"value\", value);\n    setTimeout(inc, 100);\n  }\n}\n$(document).ready(function(){\n\
  \  $(\"#progressbar\").progressbar({ value: 0});\n  inc();\n});\n...CSS...\n#progressbar\
  \ {\n  box-shadow: 5px 5px 5px #88888; border:2px ridge;\n  display:inline-block;\
  \ height:20px; width:300px; }\n#progressbar .ui-progressbar-value{\n  background-image:\
  \ -moz-linear-gradient(top, steelblue, skyblue);\n  background-image: -webkit-linear-gradient(top,\
  \ steelblue, skyblue);\n  background-image: -ms-linear-gradient(top , steelblue,\
  \ skyblue); }\n...HTML...\n<p></p>\n<div id=\"progressbar\"></div>\n<p></p>\n```\n\
  \n\n\n35 <div id=\"progressbar\"></div>\n\n# 笔记\n`progressbar` 组件通常与 jQuery Ajax\
  \ 的 `beforeSend()` 函数配合使用，以显示请求的进度。\n\n## 实现滑块（Slider Bars）\n\n`slider` 组件允许你创建滑块控件，通过拖动鼠标来调整数值。滑块由两个部分组成：滑动轨道（slide）和滑柄（handle）。滑动轨道由\
  \ `.ui-slider-range` 类设置样式，滑柄由 `.ui-slider-handle` 类设置样式。\n\n### 提示\n你可以定义一个最小值和一个最大值滑柄，这允许你使用单个滑块控件来定义一个范围而不是单个值。\n\
  \n`Listing 19.8` 中的代码提供了一个实现一组滑块的示例，这些滑块用于调整另一个元素的背景颜色。滑块被应用于第 22–29 行的 `<div>`\
  \ 元素，并设置了以下选项：\n\n![Image](img/image00767.jpeg) orientation—方向——可以设置为 `\"horizontal\"\
  `（水平）或 `\"vertical\"`（垂直）。\n\n![Image](img/image00767.jpeg) range—范围——可以设置为 `true`、`\"\
  min\"` 或 `\"max\"`。用于定义范围。`\"min\"` 从滑块最小值到滑块上的一个滑柄，而 `\"max\"` 从滑块上的一个滑柄到滑块最大值。\n\
  \n![Image](img/image00767.jpeg) max—最大——指定最大值。\n\n![Image](img/image00767.jpeg)\
  \ value—值——指定当前值。\n\n![Image](img/image00767.jpeg) slide—滑动——当轨道移动时调用的事件处理器。\n\n\
  ![Image](img/image00767.jpeg) change—改变——当滑动值改变时调用的事件处理器。\n\n还要注意 CSS 中第 41–46 行的类设置。这些设置改变滑块和滑柄的外观。视觉效果可以在\
  \ `Figure 19.8` 中看到。\n\n![Image](img/image00984.jpeg)\n\n**图 19.8** 用于根据 RGB 值选择颜色的滑块。\n\
  \n**代码列表 19.8 widgets_slider_bars.html 使用 jQuery、CSS 和 HTML 实现滑块**\n\n点击此处查看代码图像\n\
  \n```javascript\n...jQuery...\n\n11      function cValue(selector){\n12        var\
  \ v = $(selector).slider(\"value\").toString( 16 );\n13        if (v.length ===1)\
  \ { v = \"0\" + v;}\n14        return v;\n15      }\n16      function refreshSwatch()\
  \ {\n17        $(\"#mix\").css(\"background-color\", \"#\" + cValue(\"#red\") +\n\
  18          cValue(\"#green\") +  cValue(\"#blue\"));\n19        $(\"#mix\").html($(\"\
  #mix\").css(\"background-color\"));\n20      }\n21      $(document).ready(function(){\n\
  22          $( \"#red, #green, #blue\" ).slider({\n23          orientation: \"horizontal\"\
  ,\n24          range: \"min\",\n25          max: 255,\n26          value: 127,\n\
  27          slide: refreshSwatch,\n28          change: refreshSwatch\n29       \
  \ });\n30        $(\"#red\").slider(\"value\", 128);\n31        $(\"#green\").slider(\"\
