  \ 的 cookie。如果设置了 `buttonColor` cookie，请使用以下 jQuery 代码行更改按钮的颜色：\n\n点击此处查看代码图像\n\n\
  ```javascript\n$(\"span\").css(\"color\", getCookie(\"buttonColor\"));\n```\n\n\
  **2.** 打开列表 11.4、11.5 和 11.6 中的代码，并修改 prompt 以要求用户输入下一次通知之前的秒数。如果用户输入 0，则终止通知。否则，在\
  \ `setTimeout()` 调用中使用该值。记住你需要将秒数乘以 1000 以转换为毫秒。\n\n# 第三部分：使用 jQuery 构建丰富的交互式 网页\n\
  \n## 第 12 节：通过 jQuery 动画和其他特殊特效增强用户交互\n\n你将在本节中学到的内容：\n\n![Image](img/image00767.jpeg)\
  \ 理解动画基础\n\n![Image](img/image00767.jpeg) 创建滑动元素\n\n![Image](img/image00767.jpeg)\
  \ 创建图片库\n\n### 理解动画\n\n动画是随时间更改 CSS 属性的过程。jQuery 提供了一种种简单的方法，无需编写复杂的 CSS 或原生 JavaScript\
  \ 即可制作动画。你可以制作移动、滑动和淡出效果。这提供了视觉反馈并提升了用户体验。\n\n#### 动画 CSS 设置\n\n`.animate()` 方法用于制作数值属性。例如，你可以动画\
  \ `width`、`height`、`opacity` 等。\n\n```javascript\n$(\".box\").animate({\n  width:\
  \ \"250px\",\n  opacity: 0\n});\n```\n\n`.animate()` 方法接受一个对象，其中键是你想要动画的属性，值是最终值。你还可以指定\
  \ `duration`（持续时间）和 `easing`（缓动）函数。\n\n```javascript\n$(\".box\").animate({\n  width:\
  \ \"250px\",\n  opacity: 0\n}, 1000, \"swing\");\n```\n\n默认情况下，动画的持续时间为 400 毫秒。你可以通过传递第二个参数来更改它。\n\
  \n#### 使用缓动函数\n\njQuery 包含了几个内置的缓动函数，用于控制动画的进展，例如 `linear` 和 `swing`。你也可以定义自定义缓动函数。\n\
  \n```javascript\n$(\".box\").animate({\n  left: \"250px\"\n}, 1000, \"linear\");\n\
  ```\n\n#### 链式动画\n\n你可以在一个语句中将多个动画链在一起。每个动画在上一个动画完成后立即开始。\n\n```javascript\n$(\"\
  .box\").animate({height: \"100px\"}, 500)\n          .animate({width: \"200px\"\
  }, 500)\n          .animate({top: \"50px\"}, 500);\n```\n\n#### 回调函数\n\n你可以向 `.animate()`\
  \ 方法提供回调函数，以便在动画完成后执行代码。\n\n```javascript\n$(\".box\").animate({\n  opacity: 0\n\
  }, 500, function() {\n  alert(\"动画完成!\");\n});\n```\n\n#### 停止动画\n\n如果你需要在动画完成之前停止它，请使用\
  \ `.stop()` 方法。这将清除所选元素的动画队列。\n\n```javascript\n$(\".box\").stop();\n```\n\n\n\n\
  \n\n你必须注意触发动画的来源。请记住，事件会冒泡。如果你在冒泡阶段从所有层级执行同一个动画，可能会导致一些严重不符合预期结果。为了防止这种情况，你可以使用\
  \ `stopPropagation()` 和 `stopImmediatePropagation()` 方法。\n\n***\n\n## 停止动画\n\njQuery\
  \ 允许你停止在 jQuery 对象集包含的元素上当前正在执行的动画。`.stop([clearQueue] [, jumpToEnd])` 方法允许你通过几种方式停止动画。\n\
  \n不带任何参数调用 `.stop()` 会暂停队列中的动画。下一个开始的动画将再次重新开始执行队列中的动画。例如，以下代码会暂停所有动画：\n\n```javascript\n\
  (\"*\").stop();\n```\n\n调用 `.stop(true)` 并将 `cleareQueue` 选项设置为 `true`，则会在当前点停止动画并从队列中移除所有动画。例如，以下代码将停止所有图片上的动画并移除队列中的动画：\n\
  \n```javascript\n$(\"img\").stop(true);\n```\n\n调用 `.stop(true, true)` 并将 `jumpToEnd`\
  \ 选项设置为 `true`，会导致当前正在执行的动画立即跳转到结束值，清空队列，然后停止所有动画。例如，以下代码会停止所有图片上的动画，但会完成当前动画做的调整，然后移除队列中的动画：\n\
  \n```javascript\n$(\"img\").stop(true, true);\n```\n\n`.stop()` 方法返回 jQuery 对象，因此你可以在末尾链式调用其他方法。例如，以下代码停止所有图片上的动画，然后启动一个新动画将\
  \ `opacity` 设置为 `.5`：\n\n点击此处查看代码图片\n\n```javascript\n$(\"img\").stop(true, true).animate({opacity:.5},\
  \ 1000);\n```\n\n## 延迟动画\n\n在实现动画时，一个非常棒的选项是在动画添加到队列之前添加延迟。这可以用一种更高级的方式提供动画，因为你延迟了动画队列的执行，为用户提供了更好的视觉体验。\n\
  \n`.delay(duration, [, queueName])` 方法允许你指定以毫秒为单位的延迟 `duration`，以及一个可选的 `queueName`，用于指定将延迟应用到哪个队列。例如，以下代码为图片添加了大小动画；在尺寸调整完成后，会有\
  \ 2 秒的延迟，然后 `opacity` 将动画到 `1`：\n\n点击此处查看代码图片\n\n```javascript\n$(\"img\").animate({width:500},\
  \ 1000).delay(2000).animate({opacity:1} 1000);\n```\n\n***\n\n注意\n\n`.delay()` 方法非常适合在队列中的\
  \ jQuery 效果之间之间延迟；然而，它并不是 JavaScript `setTimeout()` 函数的替代品，后者可能更适用于某些用例——特别是那些你要求具有取消延迟能力的情况。\n\
  \n***\n\n## 对动画应用 .promise()\n\n`.promise([type], [, target])` 方法允许你在绑定到 jQuery\
  \ 对象集的所有操作完成后应用某些功能。它通过返回一个新对象来实现这一点，该对象将观察操作，并在操作完成之前不执行任何绑定的方法。\n\n`.promise()`\
  \ 返回一个类似于延迟对象（deferred object）的对象。它拥有一个 `.done()` 方法，允许你传入一个函数，该函数将在 `.promise()`\
  \ 功能执行后运行。\n\n例如，以下代码等待动画完成，然后将文本更改为“complete”：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"span\").animate({opacity:0}, 30000).promise().done(function(){\n    $(\"p\"\
  ).html(\"complete\");\n});\n```\n\n`.promise()` 方法接受两个可选参数。第一个是 `type`，指定操作的类型。默认类型是\
  \ `fx`，适用于动画；因此对于动画，你不需要指定类型。第二个参数是 `target`，指定要返回的可选目标 jQuery 对象，而不是新创建一个。\n\n\
  ## 动画显示和隐藏\n\n你已经已经在 第 9 节 中见过 `.show()` 和 `.hide()` 方法的用法。对此功能进行动画处理是常见做法，因此 jQuery\
  \ 特意为这些方法提供了良好的动画选项，让你的工作变得更轻松。\n\n### 动画 hide()\n\n`.hide( [duration] [, easing]\
  \ [, callback])` 方法提供了可选的 `duration`、`easing` 和 `callback` 选项，允许你对隐藏效果进行动画，使元素消失时不那么突兀。\n\
  \n例如，以下代码在隐藏元素时应用了一个 1 秒的带有 `linear` 缓动的动画，并执行了一个简单的回调函数：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#box\").hide(1000, \"linear\", function() { $(\"#label\").html(\"Hidden!\")\
  \ });\n```\n\n### 动画 show()\n\n`.show( [duration] [, easing] [, callback])` 方法提供了可选的\
  \ `duration`、`easing` 和 `callback` 选项，允许你对显示效果进行动画，使元素出现时的过渡更平滑。\n\n例如，以下代码在显示元素时应用了一个\
  \ 1 秒的带有 `linear` 缓动的动画，并执行了一个简单的回调函数：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#box\"\
  ).show(1000, \"linear\", function() { $(\"#label\").html(\"Shown!\") });\n```\n\n\
  ### 动画 toggle()\n\n`.toggle( [duration] [, easing] [, callback])` 方法提供了可选的 `duration`、`easing`\
  \ 和 `callback` 选项，允许你在切换时对显示或隐藏效果进行动画。\n\n例如，以下代码应用了一个 1 秒的带有 `linear` 缓动的动画，并在切换时执行一个简单的回调函数：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#switch\").toggle(1000, \"linear\", function()\
  \ { $(\"#label\").html(\"Toggled!\") });\n```\n\n***\n\n## 自己尝试：使用显示和隐藏动画\n\n在这个示例中，你创建一个简单的网页元素，它有一个带有折叠和展开按钮的标题栏，允许你展开和折叠图片。该练习的目的是让你有机会使用显示和隐藏动画。示例代码见\
  \ 列表 12.1。\n\n使用以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中创建 lesson12、`lesson12/js` 和 `lesson12/css`\
  \ 文件夹，然后添加 `lesson12/image_hide.html`、`lesson12/js/image_hide.js` 和 `lesson12/css/image_hide.css`\
  \ 文件。\n\n***\n\n注意\n\n对于本节的练习，你需要使用自己的图片或从书籍网站获取图片。\n\n***\n\n**2.** 将 列表 12.1 和\
  \ 列表 12.3 所示的代码添加到 HTML 和 CSS 文件中。这些只是基础内容——一个带有句柄的 `<div>`、一个 `<img>` 和页脚 `<div>`。\n\
  \n**3.** 打开 image_hide.js 文件并添加以下 `load()` 函数，为 `#handle` 元素添加点击处理器：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(window).load(function(){\n    $(\"#handle\").click(toggleImage);\n\
  });\n```\n\n**4.** 添加以下处理器来切换图片的可见性。`if` 语句检查 `#handle` 中的文本，然后调用 `show()` 显示图片或调用\
  \ `hide()` 隐藏它。注意在 `show()` 时，有一个完整的函数会显示页脚，告诉用户图片已就绪。在 `hide()` 时，页脚会被隐藏：\n\n```javascript\n\
  function toggleImage(){\n    if ($(\"#handle\").html() == '+'){\n        $(\"#photo\"\
  ).show(1000, function(){$(\"#footer\").show();});\n        $(\"#handle\").html('-');\n\
  \    } else {\n        $(\"#footer\").hide();\n    }\n}\n```\n\n\n\n\n\n```javascript\n\
  $(\"#photo\").hide(1000);\n$(\"#handle\").html('+');\n}\n}\n```\n\n5. 保存所有三个文件，然后在网页浏览器中打开该\
  \ HTML 文档，如图图 12.1 所示。你应该能够展开和折叠图像，并看到适当的时间显示页脚。\n\n![Image](img/image00912.jpeg)\n\
  \n**图 12.1** 简单的展开/折叠图像元素。\n\n**代码列表 12.1 image_hide.html 用于显示折叠图像元素的 HTML 基础 Web\
  \ 文件**\n\n点击此处查看代码图片\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n    <title>图像隐藏</title>\n\
  \    <meta charset=\"utf-8\" />\n    <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n    <script type=\"text/javascript\" src=\"js/image_hide.js\"></script>\n\
  \    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/image_hide.css\">\n</head>\n\
  <body>\n    <div>\n        <div id=\"title\"><span id=\"handle\">-</span>Canon</div>\n\
  \        <img id=\"photo\" src=\"/images/liberty.jpg\" width=\"300px\"/>\n     \
  \   <div id=\"footer\">图像就绪</div></div>\n    </div>\n</body>\n</html>\n```\n\n*\
  \ * *\n\n**代码列表 12.2 image_hide.js 实现折叠图像的 jQuery 和 JavaScript 代码**\n\n点击此处查看代码图片\n\
  \n* * *\n\n```javascript\n$(window).load(function(){\n    $(\"#handle\").click(toggleImage);\n\
  });\nfunction toggleImage(){\n  if ($(\"#handle\").html() == '+'){\n    $(\"#photo\"\
  ).show(1000, function(){$(\"#footer\").show();});\n    $(\"#handle\").html('-');\n\
  \  } else {\n    $(\"#footer\").hide();\n    $(\"#photo\").hide(1000);\n    $(\"\
  #handle\").html('+');\n  }\n}\n```\n\n* * *\n\n**代码列表 12.3 image_hide.css 设置折叠图像元素的样式\
  \ CSS 代码**\n\n点击此处查看代码图片\n\n* * *\n\n```css\ndiv{ width:300px; text-align:center;\
  \ }\n#title, #handle, #footer{\n    background-color:blue; color:white;\n    font-weight:bold;\n\
  }\n#handle{\n    display:inline-block; width:20px; float:left;\n    background-color:black;\
  \ cursor:pointer;\n}\n#footer{\n    font-size:10px; background-color:black;\n  \
  \  margin-top:-5px\n}\n```\n\n* * *\n\n* *\n\n### 可见性动画\n\njQuery 在附加到 jQuery 对象的淡入方法中提供了动画功能。最后，这些淡入方法等同于在透明度属性上使用\
  \ `.animate()`。\n\n以下章节描述了如何将动画应用于各种淡入方法。\n\n#### fadeIn()\n\n`.fadeIn( [duration]\
  \ [, easing] [, callback])` 方法提供了可选的 `duration`、`easing` 和 `callback` ，允许你将元素的 `opacity`\
  \ 从其当前值淡化到 1 的动画效果。\n\n例如，以下代码对所有图像元素应用了带有 `swing` 缓动的 1 秒钟动画：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(\"img\").fadeIn(1000, \"swing\");\n```\n\n#### fadeOut()\n\n`.fadeIn(\
  \ [duration] [, easing] [, callback])` 方法提供了可选的 `duration`、`easing` 和 `callback`\
  \ ，允许你将元素的 `opacity` 从其当前值淡化到 0（淡出效果）。\n\n例如，以下代码对所有图像元素应用了带有 `swing` 缓动的 1 秒钟动画，然后在完成后再次将它们淡入：点击此处查看代码图片\n\
  \n```javascript\n$(\"img\").fadeOut(1000, \"swing\", function() {$(this).fadeIn(1000);});\n\
  ```\n\n#### fadeToggle()\n\n`.fadeToggle( [duration] [, easing] [, callback])` 方法提供了可选的\
  \ `duration`、`easing` 和 `callback`，允许你根据元素的当前值，将其 `opacity` 从当前值淡化到 0 或 1 的动画效果。\n\
  \n例如，以下代码对所有图像元素应用了带有 `swing` 缓动的 3 秒钟动画。当前可见的图像将淡出，而当前透明的图像将淡入：点击此处查看代码图片\n\n```javascript\n\
  $(\"img\").fadeToggle(3000, \"swing\");\n```\n\n#### fadeTo()\n\n`.fadeTo( duration,\
  \ opacity [, easing] [, callback])` 方法提供了 `duration` 和 `opacity` 选项，用于指定结束时的透明度以及动画过渡的时间。它还有可选的\
  \ `easing` 和 `callback` 参数。\n\n例如，以下代码对所有图像应用了耗时 2 秒的动画，使其从当前透明度过渡到 .5：\n\n```javascript\n\
  $(\"img\").fadeTo(2000, .5);\n```\n\n* *\n\n### 尝试一下：使用淡入实现图像效果\n\n在本示例中，你将淡入动画应用于一组图像，在鼠标悬停在图像上时改变其透明度。练习的目的是让你使用本节中的淡入技术。\n\
  \n1. 在 Eclipse 中创建 `image_fade.html`、`image_fade.js` 和 `image_fade.css` 文件。\n2.\
  \ 添加所示的 12.4、12.5 和 12.6 的 HTML 和 CSS 文件——一个包含五个 `<img>` 的基础 `<div>`。\n3. 打开 `image_fade.js`\
  \ 并添加以下 `load()` 函数，为所有图像元素添加 `mouseover` 和 `mouseout` 处理程序。`mouseover` 将图像透明度淡至\
  \ 1，使其不透明；`mouseout` 则在鼠标移开时将其淡回 .3，使其变为透明：\n\n```javascript\n$(window).load(function(){\n\
  \    $(\"img\").mouseover(function(){$(this).fadeTo(1000, 1);});\n    $(\"img\"\
  ).mouseout(function(){$(this).fadeTo(1000, .3);});\n});\n```\n4. 保存所有三个文件，然后在网页浏览器中打开该\
  \ HTML 文档，如图图 12.2 所示。你应该能够将鼠标移动在图像上并看到透明度的变化。\n\n\n\n\n\n一种常见的动画是滑动效果。滑动效果使元素从不占用空间到占用空间，从起始边缘移动到结束边缘进行过渡。使用滑动动画可以给用户提供更丰富的体验，因为菜单、图像和其他元素可以在用户将鼠标悬停在上面或点击它们之前被“收叠”起来。\n\
  \n你可以使用几种方法来创建滑动元素。一种方法是使用内置的 `jQuery` 滑动方法。另一种方法是对 `height` 和 `width` 属性进行动画处理。以下章节将描述这些方法。\n\
  \n####  `slideUp()`、`slideDown()` 和 `slideToggle()`\n\n`.slideUp( duration [, easing]\
  \ [, callback])`, `.slideDown( duration [, easing] [, callback])` 和 `.slideToggle(\
  \ duration [, easing] [, callback])` 方法提供了 `duration`、`easing` 和 `callback` 参数，允许你在垂直方向上制作滑动效果。\n\
  \n例如，以下代码应用了 1 秒的动画使元素向下滑动，然后应用 3 秒的延迟并将元素滑向上：\n\n点击此处查看代码图片\n\n```\n$(\"#menu\"\
  ).slideDown(1000).delay(3000).slideUp(1000);\n```\n\n你也可以以类似的方式对 `.slideToggle()`\
  \ 方法进行动画。例如，以下代码使用滑动动画控制 `<div>` 元素的可见性：\n\n```\n$(\"div\").slideToggle(1000);\n\
  ```\n\n#### 使用 Width 和 Height 滑动\n\n我们也喜欢使用 `width` 和 `height` 属性来创建滑动元素。你可以通过对\
  \ `height` 进行动画处理来创建垂直滑动动画，通过对 `width` 进行动画处理来创建水平滑动动画。\n\n有一些技巧。如果你想获得完整的滑动效果而不仅仅是调整大小的效果，则需要为元素同时提供\
  \ `width` 和 `height` 值。此外，如果你想让元素在页面上保留空间，你就不能将该值一直减到 0。但是，你可以将其减到 `.1`，而另一个维度将保留其空间。\n\
  \n下面的示例显示了一个动画，该动画通过将 `height` 更改为 100 来向下滑动，然后通过将 `height` 更改为 .1 向上滑动：\n\n点击此处查看代码图片\n\
  \n```\n$(\"img\").animate({height:100}, 1000);\n$(\"img\").animate({height:.1},\
  \ 1000);\n```\n\n* * *\n\n### 动手尝试：使用滑动动画实现动态菜单\n\n在这个示例中，你将创建一个简单的网页元素，它提供了一个带有滑动效果的标题栏，可以显示出一个图像菜单。当你悬停在菜单中的每一项上时，图像会向下滑动，当你离开菜单时它又滑向上。这个练习的目的是让你有机会尝试使用本节中讨论的一些滑动技术。示例代码位于\
  \ Listing 12.7、12.8 和 12.9 中。\n\n使用以下步骤创建动态网页：\n\n1. **在 Eclipse 中**，创建 `lesson12/sliding_images.html`、`lesson12/js/sliding_images.js`\
  \ 和 `lesson12/css/sliding_images.css` 文件。\n\n2. **将**在 Listing 12.7 和 Listing 12.9\
  \ 中显示的代码添加到 HTML 和 CSS 文件中——这些只是基础内容：一个带有 `<p>` 标题栏的 `<div>`，以及一个包含用于菜单的 `<span>`\
  \ 和 `<img>` 元素的内部 `<div>`。\n\n3. **打开 `sliding_images.js` 文件**并编写基本的 `$(window).load()`\
  \ 函数。在 `load()` 函数内部，添加以下行来隐藏内部的 `<div>`：\n\n```javascript\n$(\"div div\").hide();\n\
  ```\n\n4. **添加以下语句**为 `<span>` 元素添加 `mouseover` 和 `mouseout` 处理器。在 `mouseover` 时，你获取\
  \ `<span>` 的索引，然后使用它找到对应的 `<img>` 元素，并通过动画将 `height` 设置为 100，从而使图像向下滑动。在 `mouseout`\
  \ 时，你执行相反的操作，将 `height` 设置为 1 以使其向上滑动：\n\n点击此处查看代码图片\n\n```javascript\n$(\"span\"\
  ).mouseover(function(){\n  var i = $(this).index(\"span\");\n  $(\"img\").eq(i).animate({height:100},\
  \ 1000);\n});\n$(\"span\").mouseout(function(){\n  var i = $(this).index(\"span\"\
  );\n  $(\"img\").eq(i).animate({height:.1}, 1000);\n});\n```\n\n5. **添加以下语句**为 `#container`\
  \ 元素添加 `mouseenter` 和 `mouseleave` 处理器。在 `mouseenter` 时，你首先停止传播，以便在冒泡期间只应用一次滑动切换。然后，你停止\
  \ `#images` 元素上的所有动画，并使用 `slideToggle()` 制作整个菜单的滑动动画。`mouseleave` 时发生相同的情况。结果是，当鼠标悬停在\
  \ `#container` 上时，它向下滑动，当你离开时它滑向上：\n\n6. **保存所有文件**，然后在浏览器中打开 HTML 文档。你应该看到菜单展开，并在鼠标悬停在每一项上时图像向下滑动，离开时滑向上。\n\
  \n**FIGURE 12.3 滑动菜单**\n\n#### LISTING 12.7 sliding_images.html 用于显示菜单的 HTML\n\n\
  点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>Sliding Images</title>\n  <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n  <script type=\"text/javascript\" src=\"js/sliding_images.js\"></script>\n\
  \  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/sliding_images.css\">\n\
  </head>\n<body>\n  <div id=\"container\">\n    <p>Sliding</p>\n    <div id=\"images\"\
  >\n      <span>Image 1</span>\n      <span>Image 2</span>\n      <span>Image 3</span>\n\
  \      <span>Image 4</span>\n    </div>\n  </div>\n</body>\n</html>\n```\n\n####\
  \ LISTING 12.8 sliding_images.js 实现滑动菜单的 JavaScript\n\n点击此处查看代码图片\n\n```javascript\n\
  $(window).load(function(){\n  $(\"div div\").hide();\n  $(\"span\").mouseover(function(){\n\
  \    var i = $(this).index(\"span\");\n    $(\"img\").eq(i).animate({height:100},\
  \ 1000);\n  });\n  $(\"span\").mouseout(function(){\n    var i = $(this).index(\"\
  span\");\n    $(\"img\").eq(i).animate({height:.1}, 1000);\n  });\n  $(\"#container\"\
  ).mouseenter(function(e){\n    e.stopPropagation();\n    $(\"#images\").stop(true).slideToggle(1000);\n\
  \  });\n  $(\"#container\").mouseleave(function(e){\n    e.stopPropagation();\n\
  \    $(\"#images\").stop(true).slideToggle(1000);\n  });\n});\n```\n\n#### LISTING\
  \ 12.9 sliding_images.css 为滑动菜单提供样式的 CSS\n\n点击此处查看代码图片\n\n```css\nimg{\n  display:inline-block;\n\
  \  width:150px;\n  height:1px;\n  margin:0px;\n  padding:0px;\n  float:left;\n}\n\
  p, span {\n  display:inline-block;\n  width:600px;\n  background-color:black;\n\
  \  color:white;\n  margin:0px;\n  padding:0px;\n  text-align:center;\n}\nspan {\n\
  \  width:150px;\n  margin:-1px;\n  border:1px solid;\n  background-color:blue;\n\
  \  float:left;\n}\n#container {\n  width:610px;\n}\n```\n\n\n\n\n与使用高度和宽度创建滑动效果类似，你也可以使用它们来创建缩放动画。滑动（slide）和缩放（resize）的区别在于，在缩放时会保持图像的宽高比例，这使得元素的整体效果看起来是正在变大或缩小，而不是被拉伸或折叠。\n\
  \n创建缩放动画的技巧在于，你要么需要在 `.animate()` 语句中同时指定 `height` 和 `width`，或者在 CSS 设置中将其中一个设置为\
  \ `auto`，并且你只对有值的那个进行动画处理。\n\n例如，以下代码展示了图像在 1 秒内缩放到 500 像素，然后在 5 秒内缓慢地缩小回 400 像素：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"img\").animate({height:500, width:500}, 1000).animate({height:500,\
  \ width:500}, 5000);\n```\n\n***\n\n## 动手一试：使用缩放动画创建一个简单的图库视图\n\n在这个示例中，你创建了一个简单的图库视图，该视图可以在同一个动画中缩放图像并应用透明度变化。本次练习的目的是让你有机会使用本节中讨论的一些缩放技术。该示例的代码位于列表\
  \ 12.10、12.11 和 12.12。\n\n使用以下步骤创建动态网页：\n\n1.  在 Eclipse 中，创建 `lesson12/animated_resize.html`、`lesson12/js/animated_resize.js`\
  \ 和 `lesson12/css/animated_resize.css` 文件。\n\n2.  将列表 12.10 和列表 12.12 中所示的代码添加到\
  \ HTML 和 CSS 文件中——只需要一个带有 `<img>` 元素的基础 `<div>`。在 CSS 文件中，`<img>` 元素的宽度被样式设置为 100px，但没有设置高度。这样我们就可以在不使用高度属性的情况下对尺寸进行动画处理。\n\
  \n3.  现在打开 `animated_resize.js` 文件并编写基础的 `load()` 函数，为 `<img>` 元素添加 `mouseover`\
  \ 和 `mouseout` 处理器。在 `mouseover` 时，通过增加 `width` 和 `opacity` 来实现动画，在 `mouseout` 时执行相反的操作：\n\
