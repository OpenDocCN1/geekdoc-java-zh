  \n## 自己尝试：使用 jQuery 更新服务器数据\n\n在这个练习中，你有机会实现一个带有 `.get()` 和 `.post()` 请求以及若干不同 AJAX\
  \ 处理器的复杂 AJAX 网页。生成的网页提供了你可以评分的不同度假地。度假数据位于 Node.js 服务器上的数据结构中。当你更改评分时，将发送 POST\
  \ 请求到 Node.js 服务器并更改服务器数据，只要服务器运行，这种更改就是永久的。该练习的目的是巩固 jQuery AJAX。\n\n示例代码位于 列表\
  \ 15.17、15.18、15.19 和 15.20。使用以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建 `lesson15/ajax_post.html`、`lesson15/js/ajax_post.js`\
