  \ CSS 修改。\n\n## 15. 通过 AJAX 访问服务器端数据\n\n你将在本节中学到：\n\n- AJAX 请求\n- 使用 AJAX\n- 实现\
  \ AJAX\n- AJAX 与 jQuery\n- AJAX 与 JSON\n- AJAX 与 XML\n- AJAX 与事件\n\n接下来的章节将帮助揭开\
  \ AJAX 的神秘面。在本节结束时，你将能够使用 `$http` 来处理 AJAX。\n\n### 让 AJAX 变得简单\n\n尽管 AJAX 非常重要，但初学者可能会感到望而畏惧。接下来的章节将提供\
  \ AJAX 的实用示例。\n\n### 轻松上手 AJAX\n\n#### AJAX 与页面请求\n\n第一步是理解 AJAX 与普通页面链接的区别。你已经熟悉页面链接了；当你点击链接时，会出现一个新的网页。即使所有控件、表格等都没有变化，只要数据发生了变化，通常也是如此。在表单提交的情况下，页面仍然需要刷新。\n\
  \n* * *\n\n### 注意\n\n不要将服务器端动态生成页面与 AJAX 混淆。动态生成页面仍然是旧方法——只是更容易管理一些。每次返回服务器的请求仍然返回一个新的网页。唯一的优点是页面是在内存中生成的，而不是从磁盘读取。\n\
  \n* * *\n\nAJAX 完全不同。AJAX 请求不会从服务器请求新网页。相反，AJAX 请求只发送和接收部分数据。如果从服务器收到的新数据需要更新网页，那么可以使用\
  \ jQuery 和 JavaScript 进行更新，正如你之前所看到的。\n\n图 15.1 说明了在浏览器中更新数据的两种方法的区别。\n\n![Image](img/00936.jpeg)\n\
  \n**图 15.1** AJAX 请求与传统页面链接的对比。\n\n#### 理解服务器端服务如 Node.js、ASP、PHP 和 MySQL\n\n下一步是理解\
  \ AJAX 请求是如何被处理的。细节并不一定重要。你需要理解的是，对于向 Web 服务器发送的每一个 AJAX 请求，都会有一个进程读取该请求、执行某些工作，然后返回响应。\n\
  \n\n\n\n后端处理可以是返回静态 HTML、文本、XML 或 JSON 文件的 Web 服务器。后端进程通常是运行在服务器上的 `ASP`、`JSP`、`PHP`、`Python`\
  \ 或 `Node.js` 脚本，从内存、文件、数据库和其他源读取数据。后端进程也可以是集成到 Web 服务器中的许多其他框架。\n\n对于在浏览器中运行的 AJAX\
  \ 脚本来说，这些其实并不重要。唯一重要的是服务器返回了状态和数据。\n\n### 理解异步通信\n\n你需要明确什么是异步通信。当你向 Web 服务器请求一个网页时，这种通信对你的浏览器来说是同步的。这意味着浏览器会等待从服务器下载\
  \ HTML 文档后，才开始渲染它并检索所需的额外资源。\n\n***\n\n提示\n\n你可以使用 jQuery 和 JavaScript 进行同步的 AJAX\
  \ 请求。jQuery 的 `.ajax()` 方法和 JavaScript 的 `send()` 函数都带有一个允许此操作的布尔字段。尽管，你不应该这样做，因为这可能会导致浏览器死锁，从而给用户带来非常糟糕的体验。事实上，在\
  \ jQuery 1.8 及更高版本中，该选项已被弃用。\n\n***\n\n当你发送 AJAX 请求时，AJAX 通信会有所不同。控制权会立即返回给 jQuery\
  \ 或 JavaScript，它们可以执行其他操作。只有当请求完成或超时时，浏览器中才会触发事件，允许你处理请求数据。\n\n### 理解跨域请求\n\n当你向不同域的独立服务器发送\
  \ AJAX 请求时，就会发生跨域请求。浏览器会阻止这种行为，出于安全考虑，这样做是正确的。\n\n阻塞跨域请求的问题在于，你通常希望从当前网站外部的服务获取数据。你可以通过几种方法解决这个问题。\n\
  \n克服跨域限制的第一方法是让 Web 服务器作为其他服务器或其他代理，这意味着你不是通过 JavaScript 直接通信，而是将请求发送给服务器，由服务器为你完成。唯一的缺点是它需要额外的服务器端脚本，并且你需要支付额外的时间成本，因为数据必须先下载到\
  \ Web 服务器，然后到达 Web 浏览器。\n\n另一个选项是使用所谓的按需 JavaScript，它通过 JSON 填充（JSONP）实现。这种方法利用了\
  \ fact：你可以使用以下语法从另一个网站下载脚本作为资源：\n\n点击此处查看代码图像\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"http://new.domain.com/getData?jsonp=parseData\">\n</script>\n```\n\n技巧之处在于，`src`\
  \ 属性指定的地址不能直接返回 JSON 响应。如果浏览器检测到脚本中的数据是 JSON（如下所示），它将抛出跨域错误：\n\n点击此处查看代码图像\n\n```json\n\
  { \"title\": \"photoA\", \"rating\": 7 };\n```\n\n相反，第三方服务必须支持 JSONP，在这种情况下，它会根据请求指定的函数调用对响应进行填充，如下所示。通过这种方式，你将通过调用该函数从\
  \ JavaScript 访问数据：\n\n点击此处查看代码图像\n\n```javascript\nparseData({ \"title\": \"photoA\"\
  , \"rating\": 7 });\n```\n\n***\n\n注意\n\n另一种可能有用的处理跨域通信的方法是在响应头中包含 `ACCESS-CONTROL-ALLOW-ORIGIN:*`\
  \ 头部。如果你正在设置自己的服务器，可以轻松实现这一点。\n\n***\n\n### 比较 GET 与 POST 请求\n\n本节阐明了 GET 和 POST\
  \ 请求。你向 Web 服务器发送的两种主要请求类型是 GET 和 POST。它们之间只有少数区别，但非常重要。GET 请求将参数作为 URL 的一部分传递，而\
  \ POST 请求将它们作为请求数据的一部分传递。\n\n为了帮助你快速看到这一点，下面的示例说明了在 GET 和 POST 请求中向服务器发送名和姓时涉及的基本\
  \ URL 和数据：\n\nGET 请求 URL：\n\n点击此处查看代码图像\n\n```text\nhttp://localhost/code/example1.html?first=Brad&last=Dayley\n\
  ```\n\nGet 请求数据：\n\n`<empty>`\n\nPOST 请求 URL：\n\n点击此处查看代码图像\n\n```text\nhttp://localhost/code/example1.html\n\
  ```\n\nPOST 请求数据：\n\n```text\nfirst=Brad\nlast=Dayley\n```\n\n你应该使用哪种请求类型？基本规则是：从服务器检索信息时使用\
  \ GET，如果你正在更改服务器上的数据则使用 POST。\n\n### 理解响应数据类型——二进制对文本对 XML 对 JSON\n\n明确从服务器返回的响应数据类型是非常重要的。返回\
  \ AJAX 请求的数据将是某种二进制格式或文本格式。通常，二进制格式留给图像、zip 文件等。然而，文本格式可能是原始文本、HTML、XML、JSON 等。\n\
  \n这意味着什么？这里可能会变得有点棘手。当浏览器接收到服务器的响应时，它会尝试确定服务器接收的数据类型，并为你创建一个相应的响应对象供你使用。\n\n对于 XML\
  \ 和 HTML 数据，会创建一个响应对象；而对于 JSON，则创建一个对象。\n\n### 实现 AJAX\n\n现在你已经掌握了 AJAX 概念，可以开始实现细节了。要实现\
  \ AJAX 请求，你需要访问 HTTP 请求、格式需要发送的数据、发送请求并处理响应。\n\nJavaScript 和 jQuery 都有向 Web 服务器发送\
  \ AJAX 请求的方法。你将在后续章节看到它们。jQuery 能够完成 JavaScript 的所有功能，但方式更简单。\n\n### JavaScript\
  \ 中的 AJAX\n\n要在 JavaScript 中实现 AJAX 请求，你需要一个 `XMLHttpRequest` 对象。15.1 描述了 `XMLHttpRequest`\
  \ 对象的重要方法和属性。\n\n![Image](img/image0937.jpeg)\n\n**表格 15.1 XMLHttpRequest 对象的重要方法和属性**\n\
  \n为了说明这一点，请查看以下根据名和姓参数向服务器发送 GET 请求以获取的代码：\n\n点击此处查看代码图像\n\n```javascript\nvar xmlhttp\
  \ = new XMLHttpRequest();\nxmlhttp.onreadystatechange=function() {\n  if (xmlhttp.readyState==4\
  \ && xmlhttp.status==200) {\n    document.getElementById(\"email\").innerHTML=xmlhttp.responseText;\n\
  \  }\n};\nxmlhttp.open(\"GET\",\"/getUserEmail?userid=brad\",true);\nxmlhttp.send();\n\
  ```\n\n下面的代码演示了如何向服务器发送基础 POST AJAX 请求以设置电子邮件。注意，对于 POST 请求，添加的 `Content-length`\
  \ 和 `Content-type` 头部确保数据被正确处理。`Content-length` 设置为 `params` 字符串的长度：\n\n```javascript\n\
  var xmlhttp = new XMLHttpRequest();\nvar params = \"first=Brad&last=Dayley&email=brad@dayleycreations.com\"\
  ;\nhttp.setRequestHeader(\"Content-type\", \"text/plain\");\nhttp.setRequestHeader(\"\
  Content-length\", params.length);\nxmlhttp.onreadystatechange=function() {\n  if\
  \ (xmlhttp.readyState==4 && xmlhttp.status==200) {\n    alert(\"Email Updated\"\
  );\n  }\n};\nxmlhttp.open(\"POST\",\"/setUserEmail\",true);\nxmlhttp.send(params);\n\
  ```\n\n\n\n\n在 IE7 之前的版本的 Internet Explorer 浏览器中，你需要使用以下行来创建 `xmlhttp` 对象，因为 `window`\
  \ 对象不支持 `XMLHttpRequest` 属性：\n\n点击此处查看代码图像\n\n```javascript\nxmlhttp=new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n```\n\n## 来自 jQuery 的 AJAX\n\n本节介绍了如何从 jQuery 实现 AJAX 请求。jQuery\
  \ 提供了非常简单易用的封装方法来实现 AJAX 请求，即 `.load()`、`.get()` 和 `.post()`。\n\n这些辅助函数是 `.ajax()`\
  \ 接口的封装，该接口将在后文中讨论。这些辅助函数如下：\n\n![Image](img/image00767.jpeg) `.load(url [, data\
  \ ] , success(data, textStatus, jqXHR) )`——该方法用于直接向 jQuery 对象表示的元素中加载数据。\n\n![Image\
  \ `.getScript (url [, data ] [, success(data, textStatus, jqXHR) ] )`——该方法用于加载并立即执行\
  \ JavaScript/jQuery 脚本。\n\n![Image](img/image00767.jpeg) `.getJSON(url [, data ]\
  \ [, success(data, textStatus, jqXHR) ] )`——该方法用于通过 JSONP 请求向不同域服务器加载 JSON 格式的数据。\n\
  \n![Image](img/image00767.jpeg) `.get(url [, data ] [, success(data, textStatus,\
  \ jqXHR) ] [, dataType ]) )`——该方法用于向服务器发送通用 GET 请求。\n\n![Image](img/image00767.jpeg)\
  \ `.post(url [, data ] [, success(data, textStatus, jqXHR) ] [, dataType ]) )`——该方法用于向服务器发送通用\
  \ POST 请求。\n\n这些方法每个都允许你指定请求的 `url`。`.load()` 方法用于将数据直接加载到 jQuery 对象表示的元素中。`.get()`\
  \ 和 `.post()` 方法用于发送 GET 和 POST 请求。\n\n`data` 参数可以是字符串或基础 JavaScript 对象。例如，在下面的示例中，`obj`、`objString`\
  \ 和 `formString` 都是有效的数据参数：\n\n点击此处查看代码图像\n\n```javascript\nvar obj ={\"first\"\
  :\"Brad\", \"last\":\"Dayley\"};\nvar objString = $.param(obj);\nvar formString\
  \ = $(\"form\").serialize();\n```\n\n你也可以指定当服务器响应成功时执行的函数。例如，下面的成功处理程序会将 `#email`\
  \ 元素的值设置为响应数据的值：\n\n点击此处查看代码图像\n\n```javascript\n$.get(\"/getEmail?first=Brad&last=Dayley\"\
  , null, function (data, status, xObj){\n  $(\"#email\").html(data);\n}));\n```\n\
  \n`.get()` 和 `.post()` 方法还允许你指定字符串指定 `dataType` 参数，例如 `\"xml\"`、`\"json\"`、`\"script\"\
  `、`\"html\"` 等，用于格式化服务器响应数据的预期格式。例如，要指定 JSON 响应类型，你可以使用以下代码：\n\n点击此处查看代码图像\n\n```javascript\n\
  $.get(\"/getUser?first=Brad&last=Dayley\", null, function (data, status, xObj){\n\
  \  $(\"#email\").html(data.email);\n}), \"json\");\n```\n\n## 亲自尝试：从 jQuery 发送 AJAX\
  \ 请求\n\n在本次练习中，你将有机会 jQuery 的 `.load()` 方法实现一些简单的 AJAX 请求。生成的网页包含一个左侧导航，该导航使用 AJAX\
  \ 请求从网络服务器加载 lorem ipsum 文章数据并将结果填充到网页中。该练习的目的是让你有机会看到 `.load()` 方法是如何工作的。\n\n示例代码位于\
