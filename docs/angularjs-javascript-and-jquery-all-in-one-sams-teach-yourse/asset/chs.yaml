  \n**图 24.6** 在 AngularJS 模板视图中实现鼠标点击和移动事件指令。\n\n**代码列表 24.13 directive_mouse_events.js\
  \ 实现一个带有作用域数据（Scope Data）和事件处理程序的控制器，以支持来自视图的鼠标点击和移动事件**\n\n点击此处查看代码图像\n\n```javascript\n\
  angular.module('myApp', []).\n  controller('myController', function($scope) {\n\
