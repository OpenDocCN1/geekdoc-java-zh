    affect and physicality of words in a way that resonates with Galás’s


    bloody ‘Intravenal Song’: ‘There is a forcible affect of language


    which courses like blood through its speakers’ (Riley 2005: 1). Both


    musician and writer admit the ‘bloodiness’ of language as it pumps


    through the veins of a body, and both have a technical interest in


    ‘malediction’ that seems to endorse belief in the occult powers of


    hateful words with evil intentions. As mysterious as this initially


    sounds, Riley writes of a pragmatic approach:


    The conception of an affect soaked power of language itself can be


