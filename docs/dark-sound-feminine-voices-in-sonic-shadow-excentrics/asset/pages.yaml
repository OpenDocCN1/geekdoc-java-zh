    **27**


    This notion of being squeezed into the hazy peripheries by a


    dominant force and of mapping, exploring and colonial conquering


    is important to the conceptualization of dark sound and the ways in


    which, as I shall argue, female bodies and soundings are construed to


    signify both the shadowy edge of darkness, and the darkness of the


    unknown: the black hole. Important, because it underscores not only


    the ideological forces that err towards the erasure of female bodies


    from (music) histories or the higher echelons of musical value in


    hierarchal terms, but also how it anticipates the desire to territorialize


    the darkness that is the non-place nothing of the marginalized. That


    is to say, darkness in music discourse and aesthetics particularly,


    although by no means exclusively, has value in terms of the cultural


    capital accrued through ‘outsider’ narratives and ‘cult’ status. And


    this value of dark sound affixes itself so assuredly to maleness and


    masculinity as to suggest darkness is actually the domain of ‘Man’


    as opposed to ‘Woman’. Far from marginal in any simple sense,


    music’s ‘dark side’ has developed a strong semiotic and affective


    cultural presence and the developments of these expressions (rage,


    violence, melancholy, alienation, addiction, eroticism) acquire a


    cultural capital and credibility that, despite the dark’s historical and


    cultural associations with women, tends to accrue around a kind


    of dark sound canon that privileges masculinity. At times, darkness


    emerges explicitly like a word broken out of repressive bondage,


    as in Nick Kent’s *The Dark Stuff*: *Selected Writings on Rock*


    *Music* (2013), George Lipsitz’s *Footsteps in the Dark: The Hidden*


    *Histories of Popular Music* (2007) and Dave Haslam’s *Life after*


    *Dark: A History of British Nightclubs & Music Venues* (2015),


    all of which are texts that appear to find in the word ‘dark’ (as


    noun and/or adjective) a useful connective tissue between language,


    music, outsider narratives, marginalized identities and subcultural


    scenes. I want to argue that the very notion of a ‘mainstream’ and


    an ‘underground’ with an attendant dark underbelly of subgenres,


    is experienced differently by female artists, fans and the feminized


    who operate in the shadows of ‘mainstream’ music cultures as


    well as ‘underground’ subcultures, who are in effect marginalized


    across the board in terms of (sub)cultural hierarchies bound to


    an ideological logic of what is valuable and authentic. Arguably,


    certain kinds of nods to ‘inclusivity’ agendas do not so much unseat


    the structures of power, but colonize and capitalize from a darkness


    that designates identities always already less than – in the shadows.'
