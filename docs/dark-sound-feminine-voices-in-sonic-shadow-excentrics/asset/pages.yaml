    **64**


    **The luminous shadow of the Mother**


    Barthes’s evaluations of music are based on listening to the *body*


    in music, or rather the encounter between body, text, and music.


    Music’s body, as it emerges in Barthes’s text, has an umbilical cord


    that can be traced back to the maternal through Julia Kristeva’s


    writings on the pheno/geno text, jouissance and the semiotic chora


    (Barthes credits the work of Kristeva). At times the mother explicitly


    appears in his texts in a series of references scattered across the


    body of his music essays. Of the most intense of these references is


    the moment where the ‘Mother tongue’ explodes in an essay about


    Schumann, a composer whose music Barthes loved:


    To remain with Schumann […], the explosion of the *Muttersprache*


    in musical writing is really the declared restoration of the body –


    as if, on the threshold of melody, the body discovered itself,


    assumed itself in the double depth of the beat and of language;


    as if, with regard to music, the mother tongue occupied the place


    of the *chora* (a notion adapted from Plato by Julia Kristeva):


    the indicating word is the receptacle of *signifying*. (Barthes,


    [1975] 1991: 310)


    It is the ongoing process and plurality of meaning that Barthes


    hopes to relieve from the tyranny of the signified by following the


    ‘body in a state of music’ ([1975] 1991: 312). And, as Barthes turns


    to the specificity of his unique relationship with Schumann in the


    essay ‘Loving Schumann’, the umbilical relationship to the maternal


    is made explicit as the epitome of solitary intimacy, in which there is


    a musical refuge that expresses pre-Oedipal and choric space:


    This is a music at once dispersed and unary, continually taking


    refuge in the luminous shadow of the Mother (the lied, copious


    in Schumann’s work, is, I believe, the expression of this maternal


    unity). (Barthes, [1979] 1991: 298)


    There is comfort in the lied, the comfort of refuge in the luminous


    shadow of the Mother and the dream of pre-separation unity and


    wholeness. In conceptualizing Barthes’s ‘maternal methodology’,


    Barbara Engh draws comparisons between this umbilical relation


    and the ‘umbilical cord’ that Barthes refers to in his *Camera Lucida*'
