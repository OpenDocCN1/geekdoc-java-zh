    night, the image of formless ‘darkness over the deep’ is accompanied


    by sounds implicitly caught up in the divine wind sweeping over


    waters. By the end of the fifth and sixth day, a veritable orchestra of


    sound occupies both day and night as the world begins to teem with


    birds, fish, cattle, wild animals. This imaginary acoustic image of


    creatures is the ‘great animal orchestra of sounds’ discussed in Bernie


    Krause’s understanding of ‘biophony’ (Krause, 2012: 82–105). In


    the 1980s, Krause went on a recording field trip to the Masai Mara,


    Kenya, to capture soundscapes of the natural environment (which


    he would later analyse as spectrograms). During recording, Krause


    hears not cacophony or chaos, but creation in a ‘highly orchestrated


    acoustic arrangement of insects, spotted hyenas, eagle-owls, African


    wood-owls, elephants, tree hyrax, distant lions, and several knots


    of tree frogs and toads’, noting that each creature occupies various


    frequency ranges across a sense of temporal duration, producing a


    sublime score that would bring Krause closer than he’d ever been


    to the revelation of God’s existence (Krause 2012: 84). By listening


    to and evoking the choruses and soloists of this vivid soundscape,


    Krause’s description conjures an audio phantasmagoria of the


    Garden of Eden and the very first explosions of life soundings on


    earth in a dynamic arrangement of *glissandos*, choruses, solos,


    melodies, harmonies, rhythms, pitches and timbres, across dawn,


    dusk, day and night, composed by an unseen composer and heard


    by the first human audience on earth, Adam and Eve.


    According to the Judeo-Christian Bible, God makes man in


    his own image and takes from him a rib that he shapes and uses


    to make woman as man’s companion and helper. Despite the


    narratival progression of the story of the beginning of the world,


    indicative of a linear time logic that propels from the beginning of


    all things and towards a future (albeit one based on the eventual


    revelation of an apocalyptic end signalled by trumpeting angels),


    the focus of my attention reverts backwards to the timeless void


    before God spoke His primordial word, to the scene of darkness


    before creation. This darkness conjures a fantasy that I consider


    to be the very essence of potential, since it imagines a moment


