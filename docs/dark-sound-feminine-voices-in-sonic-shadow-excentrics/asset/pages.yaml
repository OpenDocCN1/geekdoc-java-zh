    **203**


    Galás raises the cultural figures and figurations of musical virtuosity


    whilst antagonizing the parameters of what virtuosity means, when


    it is assumed and to whom the term is applied. Her music breathes


    life into the notion of virtuosity and, at the same time, performs a


    critical autopsy of its ideological and predominantly gendered basis,


    corrupting and darkening its soundness by making audible a swarm


    of power, intention and agency that is both human and non-human.


    Abject and objectionable sounds, fluids, bodies, all of that which is


    ordinarily cast out of individual and social life and which does not


    usually substantiate the praise heaped upon the virtuoso, are here


    relished as vital forces of affect that blur the boundaries between


    subject and Other. This abominable series of amalgamations


    includes the immense capacities of dark feminine soundings, as


    they vitally hook up and connect abjected bodies, technologies


    and mythologies, to affect and be affected. Galás’s vocal technique


    puts the signifiers of the dark feminine to work, mutating them


    into affects as an amendment of virtuosity that undermines the


    binary logic on which male genius is based, weaving together the


    rational with the irrational, the intelligible with that which has been


    culturally and socially rendered unintelligible. In the bleed between


    bodies, technology, sound and text, Galás’s ‘intravenal song’ gets


    under the skin and into the bloodstream of the individualism,


    morality, gender binary and ideologies at the core of ‘virtuosity’,


    infecting it with the abject and establishing a porosity that invites


    other and Othered forces into the being of the ‘Virtuoso’. In effect,


    her work forms an assemblage of power and agency that is human


    and non-human, complicating relationships of power, intentionality


    and agency in sound, in swarm.


    Of these intelligibilities, multiple mutations of hybridized bodies


    pulsate and vibrate as currents in a network of virtuosos/virtuosity,


    mutations within her practice that seem to darken and subsume


    this network (distributive of value and virtues), undermine its


    terms of communication and identification, whilst simultaneously


    drawing power from it and making claims to it. In coming into


    contact with outcast mutations, the network of virtuosity itself is


    subjected to a virus that infects its virtues, techniques and values


    with the poisonous, impure emanations of the abject and all that


    has been abjected. Consequently, virtuosity is darkened by that


    which moves in the dark and moves in on the light, a pure virtuosity


    perverted and corrupted with impurities from which it distinguishes'
