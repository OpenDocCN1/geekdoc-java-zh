    of the body as part of the production of music’s enlivening meaning.


    The central argument or manoeuvre of Jankélévitch’s text is to base


    an understanding of music on what he refers to as music’s ‘ineffable


    Charm’, which directs the listener away from the ‘the intolerable


    chatter about music’ and wrests music away from the conceits


    of ‘*logos*’, thereby releasing music from its dimming authority


    (Jankélévitch, [1961]  2003:  142). According to Jankélévitch, the


    violence of *logos* attempts to seize and know what, for him, remains


    the unknowable mystery of music: the ‘ineffable Charm’. An


    ineffable silence is for Jankélévitch the absolute silence of *logos* –


    but not of music. Ineffable silence is rather the enabling context in


    which the many different languages and voices of music may emerge.


    Whereas Barthes explicitly challenges the ineffable, Jankélévitch


    embraces ineffability as essential to the conceptualization of music’s


    potential in relation to both the body and language and to its ability


    to unfurl the conceits of *logos*. Despite the appeal of the idea of


    the ‘ineffable Charm’ of music and the foregrounding of a physical


    manual response in the form of music practice and performance,


    the key strategy of this chapter is to repeatedly question whether the


    ‘ineffable’ does actually unfurl those conceits or whether it harbours


    some of the violent powers that it is apparently distinguished from.


    Whilst the ineffable might maintain unsayable and elusive meaning


    (of music in this case), its deployment may also harbour potential


    violence in terms of what the ineffable attempts to hush, seize,


    know, silence, hide, monumentalize or destroy: to kill as a living


    thing might be killed. In other words, the violence of *logos* and the


    powers of language are not necessarily challenged by ineffability


    if one considers, for example, the theological understanding of


    *logos* that refers to the Word of God, in relation to ineffability as


    etymologically tied to God, His unspeakable name and religious


    prohibition (*what must not be uttered*). In this respect, far from


