    **35**


    **The darkening power of Will’s**


    **wilful words**


    Love-sick poetry bursts with vivid evocations of dark ladies. From


    William Shakespeare’s dark lady of the ‘Sonnets’ ([1609]  2009)


    to the ‘Darkness’ caught by Cohen after ‘drinking from the cup’


    (2012), fragmented and multiple configurations of the dark lady rise


    and fall in sonnet and song, like malevolent apparitions torturing


    the feverish desire of the man-made-mad. She materializes in song


    through seductive and mysterious sirenic feminine archetypes,


    stirring desire and threatening the stable subjectivity of those she


    seduces. Being driven mad with desire, the lover’s loving dreams of


    total union morph into night sweats, irrational compulsions and


    a violent will to power over the other (‘*libido dominandi*’) who is


    difficult if not impossible to contain (Barthes, [1977] 1990: 121).


    Characterized by ambiguity and allusiveness, the dark lady is


    assigned the temporality of night-time and consigned to marginal


    places, just out of reach. Her mysteriousness causes an awkward


    shadow to dominate over the image of her corporeal form,


    suggesting that sexual ‘union’ does nothing to ease the fatal malady


    of desire, but rather takes the subject further into the black hell of


    a deathly unrest that, at best, results in an amorphous immersion in


    repulsive shared lies, flattery and shame. Flitting between fragments


    of adoration, paranoia and curses, befitting of the fragments


    Roland Barthes referred to as a ‘lover’s discourse’ ([1977] 1990),


    the dark lady sonnets appear to bequeath the confused passions of


    an amorous subject who claims to love the object of his ‘affections’.


    Shakespeare is sick of it and in sonnet 147 of the dark lady sonnets


    (127–54), he writes of his fever and illness:


    My love is as a fever, longing still,


    For that which longer nurseth the disease,


    Feeding on that which doth preserve the ill,


    The uncertain sickly appetite to please.


    My reason, the physician to my love,


    Angry that his prescriptions are not kept,


    Hath left me, and I desperate now approve


    Desire is death, which physic did except.'
