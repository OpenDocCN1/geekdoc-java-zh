    centre that, although vulnerable, establishes the beginnings of order


    as a thread of orientation through the darkness of chaos. Lyrics,


    rhythm and harmony, forces of organization within the song, might


    launch into an improvization ‘on the thread of a tune’, leaving the


    territory. Humming to summon strength, singing to oneself in the


    face of adversity, radios playing, the sound of a television set, these


    are the sonorous building blocks for walls that mark territories


    against the forces of chaos and destruction, which mark ‘home’


