    **6**


    opposed organism, a dominate history is fabricated for him too.


    The girl is the first victim, but she must also serve as an example


    and a trap. (Deleuze and Guattari, 2003: 276)


    The darkening of the feminine and the first theft of the girl’s body


    are themes that emerge as key moments in the cosmologies and


    epistemologies of Western culture and music discourse, moments


    that nevertheless fade like phantasmal chimeras in subtle discursive


    processes of erasure. Part of this book is dedicated to revealing


    and retracing in music and music discourse the historical, cultural


    and ongoing darkening of the feminine that has served as the


    foundations upon which ‘Woman’ is constructed, a figure who serves


    as an ‘example’ and ‘trap’ for ‘Man’. Imagine the ominous sound of


    the fall of Eve. The sound of her fall does not necessarily have an


    impact sound in that there is no ‘big bang’ body slam thud as she


    hits the ground. Instead, as representative of ‘Woman’, Eve’s fall is


    the darkening and fall of all women in the cultural equivalent of an


    everlasting, descending Shepard tone, spiralling downwards forever.


    Whilst ‘Woman’ falls and falls, like Alice perpetually tumbling


    down the rabbit hole, ‘Man’ is also caught up in the implications of


    the fall and out of grace with his Father, the Almighty. In terms of


    sound and music, his concomitant post-fall suspicion of ‘Woman’


    translates into a suspicion of women’s voices and music, so that he


    becomes enmeshed in a cultural and historical tension between the


    desire to be moved by music, and the threat that music effectively


    effeminizes by eliciting emotional and affective responses that are


    contrary to legitimate rule and power, properly fathered.


