    Africa and to the *Heart of Darkness* ([1899] 2014). Here too, the


    darkening of the feminine alongside the silencing of women’s voices


    interweaves with the racist discourse of colonial imperialism and a


    journey from Europe to Africa (in this case the Congo) in ways that


    inextricably bind constructions of gender and race to the dark.


    **Fascinated by the ‘blank spaces’**


    **on the map**


    From early childhood, Conrad was fascinated with maps and in


    particular a region on the map marked as ‘blank space’. In 1868


    and at nine years old, Conrad decided he would one day travel


    to this mysterious unnamed and uncharted place. By the time he


    arrived in 1890 the blank space was named ‘Stanley Falls’, a part


    of the Congo aggressively colonized by King Leopold II of Belgium.


    Conrad’s novella *Heart of Darkness* is based on his own journey to


    this dark space of his childhood fantasy. In variable contexts, both


    the author himself and subsequent critiques of the novella have


    noted the silence of women in the text and their seemingly liminal


    place in the narrative from which they are restricted access through


    limited roles and lack of intelligible speech (replaced to a large


    degree by obscure ‘non-language’). Gabrielle McIntire has argued


    that the relative obscurity of women and their voices in the text,


    together with the territories to which they are aligned, morph into a


    darkness upon which the boundaries of territories and the whitened,


    masculinized movement between them depends, making of women


    in the text ‘ghost-like, half-presences’ (McIntire,  2002:  258).


    Within the text, female bodies are aligned with either Europe


    or Africa and they ensure a distance between different modes of


    being that are navigated and negotiated by the white European


