    social media, inducing a terrible fatigue that buries any enjoyment


    as well as differing critical opinion and, in doing so, encourages


    those tired of the ‘too much’ to ‘go dark’ in the unplugging sense: to


    try to rest the eyes from PR hype machines and the kind of online


    music writing ‘where anything can be referenced and hyperlinked’,


    the ‘“retero-historicism,” “historical list-making,” and “influence


    fishing”’ (Tanner, 2016: 66). Broadly speaking, Tanner’s argument


    raises the suggestion that the contemporary mainstream music


