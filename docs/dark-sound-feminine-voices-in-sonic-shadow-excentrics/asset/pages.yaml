    **9**


    Rupert Till’s *Pop Cult: Religion and Popular Music* (2010) analyses


    in detail what he describes as the implicit religions and cults of


    popular music, noting the repetitive brainwashing activities of the


    music industry, the establishment of ‘ritualized activities’, the use of


    drugs, transgressional sex practices and other cultic activity: ‘Pop


    cults have often involved specific clothing that identifies members;


    suicides by cult members and/or leaders; and reverences to new


    forms of paganism including Satanism’ (Till, 2010: 8). As Till also


    discusses, the delineation of dark sound across America and Europe


    (such as rock and heavy metal) is somewhat indebted to ideas about


    pre-Christian pagan history, as well as the demonization of African-


    American music, particularly the blues, which were mythologized


    as the ‘Devil’s music’.


    In general, the paradoxes and potentialities of music have


    prompted, across epochs, a common concord around attributions


    of value via qualitative evaluations, dividing music and sound into


    moral and ideological principles through the concept of good and


    evil mapped across light and dark. As anxiety around sound and


    its political application and moral meaning or social value seeps


    and weeps across centuries of Eurocentric and Western music


    discourse, the imagination of the philosophical writing subject


    appears somewhat permanently beseeched by a shared fear


    that Man may be overwhelmed by violent and/or manipulative


    seductive sounds, producing involuntary actions and manipulating


    the body, soul and spirit of the individual, and of society. Under


    such circumstances, feminine mythologies are frequently deployed


    in music discourse to signal the dangers of music and sound. The


    seminal example of this deployment can be found in Homer’s


    poem the *Odyssey* ([675–725]  2003), which describes the great


