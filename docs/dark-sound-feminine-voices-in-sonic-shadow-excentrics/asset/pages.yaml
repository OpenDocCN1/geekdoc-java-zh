    **8**


    of transgression of law (music could be exploited by the Devil).


    Theodor Adorno of the Frankfurt School, from a notably different


    critical, temporal and cultural perspective, famously links the threat


    of fascist ideologies with cults of popular music and argued that


    the popular music consumer can be divided into two socio-political


    types of behaviour – the ‘rhythmically obedient’ or ‘emotional’ type.


    Of the ‘rhythmically obedient’ type, he writes:


    They are most susceptible to a process of masochistic adjustment


    to authoritarian collectivism. The type is not restricted to any one


    political attitude […] repression and crowd mindedness overtake


    followers of both trends […] as the standardized meter of dance


    music and of marching suggests the coordinated battalions of a


    mechanical collectivity, obedience to this rhythm by overcoming


    the responding individuals leads them to conceive of themselves


    as agglutinized with the untold millions of the meek who must


    be similarly overcome. Thus do the obedient inherit the earth.


    (Adorno, cited in Rietveld, 1998: 257)


    Adorno’s views on popular music (considered by Rietveld in the


    context of repetitive beats and the dance music of the politicized


    free party rave scene of the 1990s in the UK) extend and elaborate


    on the anxiety around the potential of music to produce obedience,


    to homogenize and standardize. By way of challenging Adorno’s


    disparagement of popular music, popular music studies, in particular


    as a multidisciplinary field, responds to, analyses and, in varying


    ways, nurtures an understanding of the resistant potential of song


    and sound as a political and social tool that makes meaning and


    produces affects, creating real, positive, tangible social change that


    moves against oppressive power. In turn, Bruce Johnson and Martin


    Cloonan’s *Dark Side of the Tune* (2013) is an attempt to challenge


    what is presented as a general positivist propensity of popular


    music studies, through a series of chapters that study the ways in


    which popular music, noise and sound elicit and arouse violence: to


    this extent, the dark side of the tune is characterized predominantly


    by violence. Pop’s dark side might also be considered through the


    cult capital, transgression and power of ‘stars’ such as that of the


    rock god who, as cult leader, is mythologized and idolized through


    repeated messages and mantras adopted by fans that financially


    and personally invest in individual and shared rituals and fantasies.'
