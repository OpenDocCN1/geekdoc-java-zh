    A ‘drone’ refers to a long, sustained low sound, a single tone


    or sustained group of pitches and is a term that recalls monotony,


    humming, buzzing, vibrations and, in a sense, a sort of desire-


    less sound that ‘drones’ on, sometimes lagging, without an easily


    locatable momentum driven by desire. It is a sound that lends itself


    to the notion of non-meaning or nonsense in that it lacks an active


    agency and the necessary organization of spaces in-between sounds,


    which provide language with meaning. A drone is thus generally


    perceived as a dull ongoing sound or noise. Etymologically, drone


    acquired its sonic meaning in the early sixteenth century, meaning


    ‘deep, continuous humming sound’ and is related to threnody, from


    the ‘Greek *threnodia* “lamentation”, from *threnos* “dirge, lament”’


    (Etymonline). Feeling drone in the body, physiologically, can


    therefore produce an uncanny affect as it lacks subjecthood and


    has no meaningful intention of verbal meaning, but nevertheless


    vibrates the body in a way that resonates with drudging ‘low’ tones


    and closeness to death. John Cale is largely credited for developing


