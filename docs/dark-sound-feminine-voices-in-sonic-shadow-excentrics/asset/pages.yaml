    **4**


    the knowledge of good and evil, Eve, persuaded by the serpent


    and enticed by the wisdom offered by the fruit of this tree, ate


    an apple from it and gave some to her husband, Adam, who also


    ate some. Thus, both failed the test of free will and God expelled


    them from paradise forever. The notion of ‘the Fall’ attributes


    the motion of falling to sin and punishment, for which Woman is


    made principally responsible. She is punished by God who curses


    her with the intense pain of childbirth and condemns her to suffer


    yearning for her husband, whom God authorizes to dominate her.


    In this narrative, curiosity, susceptibility to persuasion, the exercise


    of free will, transgression of God’s word, the apparent acquisition


    of the knowledge of good and evil, and the inevitability of death


    all characterize a ‘fall’ principally gendered feminine as a result of


    Eve’s actions. The narrative of her original sin precipitates a fall into


    a metaphorical dark that is the genesis moment of all humanity’s


    pain, power, guilt, shame, hardship and punishment: in effect, the


    ‘dark side’ of life. From then on, Eve’s fall implicitly legitimizes


    misogynistic discourses which attempt to essentialize the darkness


    of women and their predisposition to the temptations of evil. God


    punishes Eve for her transgression of His Word and so she must


    yield to her Husband’s word: obey. If this is a story of the beginning


    of creation, it is also the beginning of a suspicion and hatred of


    women because it is Woman who has initiated the transgression


    of God’s word via her speaking voice: a voice *with words*. After


    all, Eve’s communication with both the serpent and Adam brings


    about the fall of mankind from paradise and enshrines a painful


    distance between God and Man until death, when, ideally, Father


    and son are reunited in heaven. In other words, the first woman on


    earth instigated the necessity of mankind’s arduous journey back


    to the Almighty, because she was tempted, curious and because


    she spoke (a similar curiosity drove Alice down the rabbit hole


    to a wonderland of eating and drinking). After that, male voices


    and their communication with God occupy and dominate the


    pages of the Bible in a series of stories that coalesce into ideologies


    and histories which implicitly and explicitly contrive to regulate


    women’s voices and movements, remaining suspicious of women’s


    creative power and agency as affiliated with darkness and sin.


