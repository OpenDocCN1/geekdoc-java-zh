  md: '**COSMOLOGIES OF DARK FEMININE SOUNDINGS**


    **3**


    narratives of creation and destruction. Far from being silent, it is


    from out of this darkness that dark sound emerges. The term ‘dark


    sound’ is not, strictly speaking, charged with the same force that


    the concept of darkness is loaded with in this creation narrative,


    although it is undoubtedly related to it. Dark sound is articulated


    here in relation to the principles of creation and destruction,


    the meaningful ideological distinctions between light and dark,


    understandings of time and space, and, as I shall argue, to the


    darkening of ‘Woman’, darkened from the beginning of the world


    onwards. Dark sound as a concept has two primary use values


    in this book, it speaks of at least two things at once. Firstly, dark


    sound conceptualizes what I propose is the cultural and historical


    darkening of Woman and the feminine, and the emergence of that


    darkening within sound and music as well as the discourses that


    ascribe meaning and value to sound and music in a wider cultural


    context. Secondly, and contrary to the confines and strictures


    implied by the first use value, the concept speaks to a potential for


    *something else*, an as yet unspecified way of being and knowing


    that can be imagined, explored and created in music and sound,


    so that, in feminist terms, dark sound offers a femphonosophy:


    feminist thought and wisdom that may be derived from sound and


    music. Moreover, this book seeks to offer a dark femphonosophy;


    a way of questioning and thinking about feminism through dark


    sound, because it is darkness that simultaneously speaks to that


    which can be learnt about the darkening of Woman and that which


    can liberate possibilities to move beyond restricted understandings


    of both the dark and Woman. The two values of dark sound


    intertwine, conjoined rather than opposed in music discourse and


    in the music practice of the artists featured within this book. To


    begin, however, I’d like to return to the beginning, or rather to the


    time just after the beginning of the world.


