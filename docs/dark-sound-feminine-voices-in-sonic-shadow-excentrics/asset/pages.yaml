    deal with a fascinating audiovisual reflection of a music lover’s own


    (heteronormative) desire, a desire that wishes to speak itself. There


    is perhaps nothing exceptional in this given that such encounters


    are so often the impetus for saying or writing anything about music.


    However, tuning into the listener’s desire, Theodor Adorno, in less


    than generous terms and characteristic of his strident critique of


    popular music and the culture industry, suggests that gramophone


    listeners are orientated around providing themselves with a


    flattering reflection of their own image:


    What the gramophone listener actually wants to hear is himself,


    and the artist merely offers him a substitute for the sounding


    image of his own person, which he would like to safeguard as


    a possession. The only reason that he accords the record such


    value is because he himself could also be just as well preserved.


    Most of the time records are virtual photographs of their owners,


    flattering photographs. (Adorno, 1990: 54)


