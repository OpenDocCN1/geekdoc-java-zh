    **219**


    potential for the unknown in opposition to the order of the known.


    Her breakaway is not therefore necessarily away from the black


    hole, but further into it, through a desire to meld with the darkness


    beyond the territorialized predesignated ‘home’ which has made


    the black hole, darkness and women’s bodies synonymous with all


    that is fearful and in opposition to the light, towards newness and


    unknown beings and futures. This future is dark. Through her song,


    the cosmic housewife, like science fiction, draws as yet unimagined


    futures from travelling through black holes as portals to other


    worlds, exciting imagination and possibilities for new being, time


    and space, beyond her static terrestrial self. This is a political move


    that cannot be distinguished from the ‘dark times’ in which one


    finds or loses oneself.


    I have interpreted therefore, in the dark sound of the artists


    featured here, a movement further into the dark. Their movement


    into the dark is a resistance strategy that seeks to destabilize and


    obliterate binary logic and the hierarchal privilege that aligns


    maleness, whiteness, knowledge, light and movement, but it is


    more than resistance: their practice moves beyond reactions against


    misogyny and patriarchy. A future conceived as dark is about


    moving further into the darkness through which femininity has been


    constructed and with which the ‘darkness’ of the feminine has been


    aligned. As such, the future is not orientated around endeavours


    to establish a place in the limelight or the journey forward that


    assumes and privileges bodies aligned with the light. Light is not


    ‘home’ for the dark feminine. Instead of a paradigm in which from


    the blackness and from the shadows, darkened and marginalized


    bodies seek the limelight of a privileged centre, these artists move


    further into the shadows, antagonizing the light, but also moving


    outwards farther into unknown space/time that elicits desire and


    opens up the feminine to countless becomings and unbecomings.


    This is a subversive movement, but it is an operation beyond


    subversive challenges and resistance, one that tends towards the


    cosmic darkness of the unknown, connecting with a strange desire


    that imagines both a self and that which radically exceeds the self.


    Such artists are much more interested in the ability to formulate


    connections than they are the binary logic of this or that. These


    are artists whose practice of connections privilege the ‘and’ of


    the shadows. This is the movement of dark sound as it gathers


    momentum through the dark feminine, neither mainstream or


    underground, but of and from the darkness. The future is dark.'
