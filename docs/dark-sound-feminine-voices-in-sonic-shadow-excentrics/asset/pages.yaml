    say, “Well, that’s not my fault, is it? I respect you for trying, but it’s


    a craft like anything else. I’m not just screaming. Really I’m not.”


    So if a person approaches it as screaming, they get the rewards of


    screaming. They won’t be able to sing for a week!’ (Galás, cited in


    Oldham, 1999).


    4


    ‘It’s mandatory if you want to extend the voice, doing the kind of


    work I do, to know what you’re doing technically. […] But also later


    on I was studying, because what I was trying to do was theoretically


    impossible, in many ways. It was an attempt to be able to do a lot of


    what horn players do with circular breathing – but voices, we don’t


    have circular breathing’ (Galás, cited in Payne, 2008: 41).


    5


    Dido Soteriou was a journalist and novelist who wrote and


    published *Bloody Earth* in 1962 and the English edition *Farewell*


    *Anatolia* was published in 1996.


    6


    In 1992, Francis Ford Coppola hired Galás to provide demonic


    sound effects for his film *Bram Stoker’s Dracula*.


    7


    See Felstiner, John. (ed.) (2001), *Selected Poems and Prose of Paul*


    *Celan*. London: Norton; Baer, Ulrich. (2000), *Remnants of Song:*


    *Trauma and the Experience of Modernity in Charles Baudelaire and*


    *Paul Celan*. Stanford: Stanford University Press.


    8


    Galás attributes some of her inspiration for these experiments with


    no longer vocal (yet vocal sounds) to the treatment of sounding


    material in Pierre Henry and Pierre Schaeffer’s tape concrete


    experiments and their spatial manipulations of sound. ‘[Pierre


    Henry] did a record called *A Door and a Sigh*. And he’d have the


    closing of a door and the sigh, and that would be it. And he would'
