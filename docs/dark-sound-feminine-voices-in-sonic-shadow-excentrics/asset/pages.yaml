    ‘woman’, is, on the contrary, responsible for a ‘malignant image’


    of gendered relations and female identities. She argues that the


    dark ‘nature’ of women is ‘deeply embedded in the modern psyche’


    and is a myth of femininity that ‘undergirds destructive patterns


    in the fabric of our culture’. For Daly, ‘Literature and the mass


    media repeat the “temptress Eve” motif in deadly earnest, as do


    rationalizations for social customs and civil laws, such as abortion


    legislation, which incorporate punitive attitudes towards women’s


    sexual function’ (Daly, 1986: 45). In these terms, women are haunted


    by the shadow of a mythology that essentializes their nature as


    already predisposed to a dark devious morality that must be both


    punished and controlled. The two key areas of focus for this control


    are fixed on her voice and her sexual reproductive system. Both


    of the implied ‘mouths’ of that body which is designated ‘Woman’


    lead to a darkness that authorizes the regulation and stalking of her


    acquisition of knowledge, her voice and language, and her womb as


    it offers the ability to bear life. The feminization of darkness and the


    darkening of the feminine produces cultural and social processes


    whereby women are encouraged and/or forced to internalize a legacy


    of patriarchal judgement and an inheritance of blame, guilt and ‘sin’


    that they inherit through ‘socialization processes’, so that ‘she’ ‘is


    conditioned to live out the abject role assigned to the female sex’


    and ‘actually appears to “deserve” the contempt heaped upon “the


    second sex”’ (Daly, 1986: 49). To interpret dark feminine sound (in


    music and text) is thus always already hermeneutic in that one must


    necessarily follow a religious logic to understand how, at the core


