    journey and controlled navigation is not restricted to music but


    extends to the history of the physics of sound as Tara Rodgers’s


    essay ‘Towards a Feminist Epistemology of Sound’ demonstrates


    in her analysis of wave metaphors and maritime themes in late


    nineteenth and early-twentieth-century texts on sound. She


    argues that audio-technical discourse is infused with a wide-scale


    deployment of a ‘network of analogies’ linking sound waves and


    electricity to water waves and by extension fluidity to feminine


    corporeality (Rodgers,  2016:  196). Through this discourse,


    feminized sound waves acquire a dualistic function similar to that


    attributed to the cultural imaging of the maternal and of the sea,


    in that they are ‘both form giving – enabling the very possibility


    of sound – and perpetually in excess of formal representation’


