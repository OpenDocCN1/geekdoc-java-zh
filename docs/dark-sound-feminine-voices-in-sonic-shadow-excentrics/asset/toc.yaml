  - '舒曼的音乐躲在巴罗特所谓的“母亲的光之影”中，而母性发出的光虽然无法触摸，却建立了亲密的接触——他被“触碰”了，并能够做一个母性重聚的梦。母性的光芒在他的论文《浪漫歌曲》中延续，巴罗特在开头设定了一个聆听舒伯特的夜晚场景。在这次邂逅中，巴罗特通过揭示自己的内心对话拉近了读者，让我们听到他对语言局限性的沉思：“对于一个人所爱的东西，除了*我爱它*并不断重复，还有什么好说的”（Barthes,
    [1976] 1991: 286）。巴罗特再次听着那首平淡无奇的浪漫歌曲，回到了母性，回到了一种特殊的光芒——这种光芒在舒曼和舒伯特的艺术民歌中浮现出来，对巴罗特而言，这两者都体现了“浪漫歌曲的炽热核心”（
    [1976] 1991: 289）。沉浸在这种光芒中，巴罗特开始质疑浪漫歌曲的“感觉”，他的写作将提问模式从“音乐本身”转向了处于音乐状态的身体，使得他的问题转向了情感和诉求，他问自己：'
