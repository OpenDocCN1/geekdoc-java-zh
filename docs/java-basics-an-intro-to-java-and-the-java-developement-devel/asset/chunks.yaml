  raw: 'There is no sizeof() operator in Java. In C++, the sizeof() operator tells
    you the number of bytes allocated for data items. Java does not need a sizeof(
    ) operator for this purpose because all the data types are the same size on all
    machines.Statements, Control over Program Execution


    Statements are the smallest separate parts of the programming language. A program
    is a sequence of statements. Most of Java statements are similar to ones in C++.


    Empty statement consists of one semicolon.


    Expression statement is an expression that ends with a semicolon. For examples
    are as follows:


    CODE :


    k = i + j + 1; // assignment


    Arrays.sort(a); // invocation of function


    return; // termination of current function execution


    Compound statement is a sequence of statements enclosed in braces. Compound statement
    is often referred to as block. Compound statement does not contain semicolon after
    closing brace. Syntactically block can be considered as a separate statement,
    but it also defines scope of visibility. Identifier declared inside the block,
    has a scope from the point of definition to the closing brace. Blocks can be nested
    in each other.


    Selection statement is whether conventional statement or switch statement. Conditional
    statement is used in two forms:


    CODE :


    if (condition_expression)


    statement1


    else


    statement2


    //or


    if (condition_expression)


    statement1


    If condition_expression is true then statement1 is executed, otherwise flow of
    control jumps to statement2 (in first form), or to the next statement (in second
    form). Unlike C + +, expression-condition can only be of type Boolean


    Syntax of switch statement is the same as one in C++. In addition, Java 7 allows
    usage of string expressions in switch() header and string constants in case labels:


    The break and continue statements, used alone, behave the same in Java as they
    do in C++. However, in Java, they may optionally be followed by a label that specifies
    an enclosing loop. The labeled forms of these statements allow you to "break"
    and "continue" any specified loop within a method definition, not only the nearest
    enclosing loop. For example:


    CODE :


    int a;


    . . .


    double b = 0;


    label:


    for (int i = 0; i < 10; i++) {


    for (int j = 0; j < 10; j++) {


    if (i + j + a == 0) {


    break label;


    }


    b += 1 / (i + j + a);


    }


    }


    The goto statement is not currently part of the Java language, but goto is a reserved
    word in Java. This word cannot be used in any way.


    There is no typedef operator in Java. Java does not support C++ struct and union
    types.Packages and Functions


    Java code does not require header files. All code is written inline. To avoid
    naming conflicts a mechanism of packages is used. In the Java language, packages
    are used to group classes.


    A package is a collection of related classes and interfaces providing access protection
    and namespace management.


    In the Java language, every class must be placed into a package. If the source
    code for a class doesn''t have a package statement at the top, declaring the package
    the class is in, then the class is in the default package.


    Physically each package is essential a folder with the same name as package. Subpackages
    are reflected to subfolders.


    The first line of most Java programs is so called package statement. Only blank
    lines and comments can precede package statement.


    CODE :


    package package_name;


    The package statement specifies which package the code in the file is part of.
    Java code that is part of a particular package has access to all classes (public
    and non-public) in the package, and all non-private methods and fields in all
    those classes. If the package statement is omitted from a file, the code in that
    file is part of an unnamed default package.


    Java does not allow creation of global functions. Instead of this, you can create
    so called static methods within classes. In simplest case, definition of a static
    method can be as follows:


    CODE :


    static result_type function_name(list_of_formal_parameters) body


    Parameters (arguments) of function defined in brackets are called formal parameters.
    Parameters, which are used by invocation of a function, are called actual parameters.
    Storage for formal parameters is allocated by invocation of a function. Appropriate
    cells are created in the program stack. Values of actual parameters are copied
    into these cells.


    Function''s body is a block (compound statement). In the following example, function
    returns sum of two arguments:


    CODE :


    static int sum(int a, int b)


    {


    int c = a + b;


    return c;


    }


    We can omit c variable:


    CODE :


    static int sum(int a, int b)


    {


    return a + b;


    }


    To invoke function from another block, you should use its name followed by actual
    arguments (constants, variables, or expressions of appropriate types):


    CODE :


    int x = 4;


    int y = 5;


    int z = sum(a, b);


    int t = sum(1, 3);


    It can be no parameters in argument list:


    CODE :


    int zero()


    {


    return 0;


    }


    The call of such function also requires empty brackets:


    CODE :


    System.out.println(zero());


    The return statement within function body causes termination of funcntion''s execution.
    The expression after return keyword defines a value, which will be return from
    this function.


    Sometimes, function returns no value. To declare such function, void keyword is
    used as resulting type.


    CODE :


    void hello()


    {


    System.out.println("Hello!");


    }


    In this case, you can omit return keyword in function''s body. The return statement
    (without succeeding expression) allows termination of function before end of body.
    Function with void type can be called using separate statement only:


    CODE :


    hello();


    Arguments can be transferred to functions by value only. Values of actual parameters
    cannot be changed within function''s body:


    CODE :


    static void f(int k)


    {


    k++; // k = 2;


    }


    public static void main(String[] args) {


    int k = 1;


    f(k);


    System.out.println(k); // k = 1;


    }


    Within a single class, you can create several functions with the same names. Such
    functions must have different argument lists (count and / or types of arguments).
    Such approach is called function overloading. If names and argument lists are
    the same, compiler produces compile error.


    Function overloading is used when you want to apply analogous operations to different
    types using different algorithms:


    CODE :


    static int max(int a, int b) { } // Finding of maximum of two integers


    static int max(double x, double y, double z) { } // Finding of maximum of three
    floating point values


    In contrast to Java, you cannot create functions with default arguments.


    Static functions within class can be invoked using function''s name and list of
    actual parameters. To invoke static functions from another class, you should use
    the following syntax;


    CODE :


    class_name.function_name(actual_parameters);


    In this way, you can only use methods of current package or java.lang standard
    package. This package provides classes with very useful functions. For instance,
    Math class provides numerical methods.


    double pow(doublea,doubleb) : Calculation of a^b


    double sqrt(doublea) : Calculation of square root


    double sin(doublea) : Calculation of sine


    double cos(doublea) : Calculation of cosine


    double tan(doublea) : Calculation of tangent


    double asin(doublea) : Calculation of arc sine


    double acos(doublea) : Calculation of arc cosine


    double atan(doublea) : Calculation of arc tangent


    double exp(doublea) : Calculation of e^x


    double log(doublea) : Calculation of natural logarithm (base e)


    double abs(doublea) : Obtaining of the absolute value


    int abs(inta) : Obtaining of the absolute value


    long round(doublea) : Obtaining of the closest integer value


    Usage :


    Math.pow(x,y);


    Math.sin(x);'
