    The typical array traversal is as follows:


    CODE :

    ```java

    for (int i = 0; i < a.length; i++) {

    a[i] = 0;

    }

    ```


    Java provides simple way to initialize arrays at declaration time by enclosing
    the initial values in curly braces (`{}`). Array members are automatically initialized
    to the default initial value for the array type if the array is not initialized
    at the time it is declared.


    CODE :

    ```java

    int[] numbers = new int[] {1, 2, 3, 4, 5};

    String[] names = new String[] {"Matt", "Joanne", "Robert"};

    ```


    You can omit the `new` statement if an initializer is provided, like this:


    CODE :

    ```java

    int[] numbers = {1, 2, 3, 4, 5};

    String[] names = {"Matt", "Joanne", "Robert"};

    ```


    Multidimensional arrays can be initialized in a similar manner:


    CODE :

    ```java

    int[][] b = {{1, 2, 3},

    {0, 0, 1},

    {1, 1, 11},

    {0, 0, 0}};

    ```


    In this example, two-dimensional array contains four rows and three columns.


    New form of `for` loop simplifies full array traversal. For instance, instead
    of


    CODE :

    ```java

    int[] nums = {1, 2, 3, 4, 5, 6};

    for (int i = 0; i < nums.length; i++)

    System.out.println(nums[i]);

    ```


    you can write


    CODE :

    ```java

    int[] nums = {1, 2, 3, 4, 5, 6};

    for(int n : nums)

    System.out.println(n);

    ```


    A new form can be applied for reading elements only (not for modification).


    The assignment of one array to another is essentially copying of a reference.
    If you wont to assign all elements of array `a` to elements of array `b`, you
    must create a cycle. Class `System` offers you a simplest way of copying one array
    into another: an `arraycopy()` function:


    CODE :

    ```java

    System.arraycopy(a, a_from, b, b_from, size);

    ```


    This is equivalent to the following loop:


    CODE :

    ```java

    for (int i = a_from, j = b_from; i < size + a_from; i++, j++) {

    b[j] = a[i];

    }

    ```


    You can copy entire array `a` into `b` using such function call:


    CODE :

    ```java

    System.arraycopy(a, 0, b, 0, a.length);

    ```


    # Definition of Classes


    Class is a structured data type that contains data members of different types,
    as well as functions for processing these data. Class definition contains of specifiers
    (e. g. `public`, `final`), class name, base class name, list of implemented interfaces,
    and class body enclosed in braces.


    The class body contains declarations for the fields (data members in C++) and
    methods (member functions in C++). Variables and methods collectively are called
    members. Declaration of Java classes looks a lot like ones in C++. Here is an
    example of a simple class:


    CODE :

    ```java

    class Rectangle {

    double width;

    double height;

    double area() {

    return width * height;

    }

    }

    ```


    Note that you don''t need to put in a semicolon after closing brace. Methods always
    go inside the class definition in Java, not outside with the `::` operator as
    programmers usually do in C++.


    Java initializes all fields with default values. In contrast to C++, Java allows
    fields'' initialization on the spots:


    CODE :

    ```java

    class Rectangle {

    double width = 10;

    double height = 20;

    double area() {

    return width * height;

    }

    }

    ```


    You can create initialization block inside of class body:


    CODE :

    ```java

    class Rectangle {

    double width;

    double height;

    {

    width = 10;

    height = 20;

    }

    double area() {

    return width * height;

    }

    }

    ```


    Methods and fields can be declared with `static` keyword. A static method can
    be invoked without an instance of the class. Static fields can be accessed using
    class name. A static field is a kind of global variable declared in class scope.
    You don''t need to define static members in global scope. You can initialize static
    fields on the spots:


    CODE :

    ```java

    class SomeClass {

    static double x = 10;

    static int i = 20;

    }

    ```


    You can create initialization block for static fields:


    CODE :

    ```java

    class SomeClass {

    static double x;

    static int i;

    static {

    x = 10;

    i = 20;

    }

    }

    ```


    In contrast to non-static initialization, creation of static fields occurs by
    the first use of a class. Java does not create static members for idle classes.


    You can access static member using both class name and object name:


    CODE :

    ```java

    SomeClass.x = 30;

    SomeClass s = new SomeClass();

    s.x = 40;

    ```


    In Java methods, arguments are passed by value.


    The `this` keyword refers to the current instance for which a method is called.
    All non-static methods implicitly obtain `this` reference. You can explicitly
    use this reference if you want to return reference to current object or need to
    prevent name conflicts. Static member functions do not have a `this` reference.


    # Visibility


    Like C++, Java supports `private`, `protected`, and `public` visibility levels.
    Class itself can be specified as `public`. In contrast to C++, Java requires separate
    definition of visibility for any member:


    CODE :

    ```java

    public class SomeClass {

    private int i;

    private double x;

    public void setI(int value) {

    i = value;

    }

    public int getI() {

    return i;

    }

    public void setX(double value) {

    x = value;

    }


    public int getI() {

    return i;

    }

    }

    ```


    Access to `private` class members is restricted to methods within the class. There
    is no `friend` keyword. A `public` class member can be accessed by any function.


    Access to `protected` class members is restricted to methods within the class,
    derived classes, and to current package.


    # Constructors


    A user instantiates a class by applying the `new` operator to the class.


    A constructor is a function whose name matches the class name and does not define
    any return type A class may define multiple constructors. If no constructor is
    defined by the class a default (no argument) constructor is made available. The
    default constructor initializes all the fields to their default values.


    You can invoke constructor with arguments from another constructor using `this`.


    CODE :

    ```java

    class Rectangle {

    double width;

    double height;

    Rectangle(double width, double height) {

    this.width = width;

    this.height = height;

    }


    Rectangle() {

    this(10, 20); // calls another constructor

    }

    }

    ```


    There are no destructors in Java. You can create a special method called `finalize()`.
    A Garbage Collector invokes `finalize()` method before the destruction of object.
    Object can be never destroyed by Garbage Collector, and therefore `finalize()`
    method can be never invoked.


    # Strings


    Strings in Java are instances of the `java.lang.String` class. The object of string
    type represents Unicode character string.


    You can create a `String` object simply by enclosing characters in double quotes:


    CODE :

    ```java

    String s = "The first string";

    ```


    When one or both operands are of type string, the predefined addition operators
    concatenate the string representation of the operands


    An instance of String is said to be immutable because its value cannot be modified
    once it has been created. Methods that appear to modify a String actually return
    a new String containing the modification. If you need to modify the contents of
    a String, you have to create a `StringBuffer` object from the String object, modify
    the contents of the `StringBuffer`, and then create a new String from the contents
    of the `StringBuffer`.


    Some of the more important String methods are as follows:


    `length()` : Returns the `int` number of characters in the string.


    `charAt(int index)` : Returns the character at the specified index of the string.


    `equals(Object obj)` : Compares this string to the specified object, returns true
    or false.


    `compareTo(String value)` : Compares a string to the argument string. The result
    is a negative integer if this String object lexicographically precedes the argument
    string. The result is a positive integer if this String object lexicographically
    follows the argument string. The result is zero if the strings are equal.


    `indexOf(char ch)` : Returns the index location of the first occurrence of the
    specified character.

