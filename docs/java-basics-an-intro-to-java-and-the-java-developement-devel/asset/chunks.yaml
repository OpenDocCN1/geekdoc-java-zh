  trans: "\n\n# Java 基础\n\n关键字集是有限的。所有关键字都是保留的。关键字不能用作标识符。在 Java 中，还有一些不是关键字的保留字。它们通常不能被使用。这些词是\
    \ `const` 和 `goto`。\n\n标识符用于命名变量、函数和其他软件对象。第一个字符必须是字母或下划线字符（`_`）。数字也可以作为非起始字符。在名称开头使用下划线是不理想的。\n\
    \n建议使用反映对象或函数性质的有意义的名称。不要在标识符内部使用空格。因此，如果你需要创建一个包含多个单词的标识符，应该将这些单词写在一起，并从第二个、第三个或其他单词的首字母开始大大写。例如，你可以创建一个变量名：\n\
    \n```java-\nthisIsMyVariable\n```\n\n使用英文助记词来创建有意义的名称。类和接口的名称应以大写字母开头，其他名称仅以小写字母开头。静态常量名称由大写字母和下划线组成，例如\
    \ `PI`、`CONST_VALUE` 等。\n\n## 注释\n\nJava 语言支持三种注释：C++ 风格（双斜杠）、C 风格（`/* */`）和文档注释（`/**\
    \ */`）。\n\nJDK javadoc 工具在准备自动生成的文档时使用文档注释。文档注释必须按照 Javadoc 标准进行格式化。你可以添加类和接口级别的\
    \ Javadoc 注释，还可以添加方法、构造函数和字段级别的注释。文档注释必须放置在相应代码之前。每条注释由一个描述和随后的一个或多个标签组成。如果需要，你可以在\
    \ Javadoc 注释中使用 HTML 格式。有一组特殊的 Javadoc 标签，如 `@author`、`@param`、`@return` 等。这些标签允许对类和方法的文档进行标准表示。例如，方法前的以下注释：\n\
    \n```java\n/**\n* 返回给定索引的文件名。<br>\n* 文件名存储在字符串数组中。\n* @param i 索引\n* @return 文件名。\n\
    * */\npublic String getFileName(int i) {\n    return names;\n}\n```\n\n产生如下 HTML\
    \ 文档文件片段：\n\n方法详情\n\n`getFileName`\n\n`public String getFileName(int i)`\n\n返回给定索引的文件名。\n\
    \n文件名存储在字符串数组中。\n\n参数：\n\n`i` - 索引\n\n返回值：\n\n文件名。\n\n## 局部变量与原始类型的定义\n\nJava\
    \ 支持在方法定义内部声明局部变量。这些局部变量的行为与 C++ 中的局部变量完全相同。以下是局部变量定义的示例。\n\n```java\nint i =\
    \ 11;\ndouble d= 0, x;\nfloat f;\nint j, k;\n```\n\n你可以在函数体或其他代码块的任何地方定义和初始化局部变量。你不能在外部块和内部块中使用相同的变量名：\n\
    \n```java\n{\n    int i = 0;\n    {\n        int j = 1; // OK。j 是内部块中定义的局部变量\n\
    \        int i = 2; // 错误！外部块中已定义变量 i\n    }\n}\n```\n你不能只声明变量而不定义！\n\n`final`\
    \ 关键字可以应用于变量。此类变量不能被修改。\n\n```java\nfinal int h = 0;\n```\n`const` 关键字是 Java 中的保留字。这个词不能以任何方式使用。\n\
    \n原始（或基本）数据类型分为整数型（用于整数）、浮点型（用于小数）、字符型（用于 Unicode 字符）或布尔型（指定真/假）。原始类型局部变量的定义看起来类似于\
    \ C++ 编程语言。以下是原始数据类型；\n\n### 整数\n- `byte` : 字节长度整数 : 8 位\n- `short` : 短整数 : 16\
    \ 位\n- `int` : 整数 : 32 位\n- `long` : 长整数 : 64 位\n\n### 实数\n- `float` : 单精度浮点数\
    \ : 32 位\n- `double` : 双精度浮点数 : 64 位\n\n### 其他\n- `char` : 单个 Unicode 字符 : 16\
    \ 位\n- `boolean` :  布尔值（真或假）\n\n在某些语言中（例如 C 和 C++），原始数据类型的格式和大小取决于程序运行的平台。相比之下，Java\
    \ 编程语言为所有平台指定了其原始数据类型的大小和格式。\n\n整数常量由一系列十进制表示。此类常量的默认类型为 `int`。可以通过在常量末尾添加字母 `L`\
    \ 或 `l`（long 类型）进行调整。整数常量可以用八进制表示，在这种情况下，第一位数字应该是零（`0`），且数字只能包含数字 0 ... 7。整数常量也可以用十六进制表示，在这种情况下，常量以\
    \ `0x`（或 `0X`）字符开头。为了表示 10 到 15 之间的数字，使用字母 a, b, c, d, e 和 f（大或小写）。例如：\n\n```java\n\
    int octal = 023; // 19\nint hex = 0xEF; // 239\n```\n\n字面量字符可以是单引号之间的任何单个 Unicode\
    \ 字符。你可以使用当前字符集的符号，或者跟在反斜字符之前的整数常量。这是一组特殊的控制字符（这些双字符被称为转义序列）：\n- `'\\n'` - 换行，\n\
    - `'\\t'` - 水平制表符，\n- `'\\r'` - 跳到行首，\n- `'`'` - 单引号，\n- `'\\\"'` - 双引号，\n- `'\\\
    \\'` - 反斜杠\n\n实类型常量可以带有小数点或科学计数法，并默认为 `double`。如果需要，可以通过添加后缀 `f` 或 `F` 指定 `float`\
    \ 类型，添加 `d` 或 `D` 指定 `double` 类型。例如：\n\n`1.5f` // float\n`2.4E-2` // double\n\n\
    你不能将浮点值赋值给整数变量。窄转换——从较大类型（例如 `double`）转换为较小类型（例如 `float`）存在风险。窄转换需要一种特殊操作，强制转换。例如：\n\
    \n```java\nint i = 10;\nfloat f = i; // 允许转换\nlong l = f; // 错误！窄转换\nlong l1 =\
    \ (long) f; // 类型转换\n```\n可以通过数字后加上 'L' 或 'l' 来指定长整数。建议使用 'L'因为它不会与数字 '1' 混淆。Java\
    \ 语言没有无符号数据类型。什么是无符号数据类型？无符号数据类型类似于“无符号整变量”，这些变量不能包含负数。\n\n两个布尔字面量简单的 `true` 和\
    \ `false`。布尔类型与其他类型（特别是 `int`）之间没有转换。你无法通过显式类型转换从布尔值获取整数，反之亦然。\n\n字符串常量是封装在引号内的系列字符。例如：\n\
    \n`\"这是一个字符串\"`\n\n将字符串与其他类型的变量相加可以将值转换为其字符串表示。特别是，这种方法用于输出多个变量的值。例如：\n\n```java\n\
    int k = 1;\ndouble d = 2.5;\nSystem.out.println(k + \" \" + d); // 1 2.5\n```\n\
    \n## 表达式与操作\n\nJava 类包含字段（数据）和方法（函数）。方法可以包含语句，语句由表达式组成。表达式由一个或多个操作组成。\n\nJava\
    \ 支持几乎所有的 C++ 数值、逻辑和比较运算符。这些标准运算符在 Java 中的优先级和结合性与 C++ 相同。Java 仅在循环头部支持逗号运算符。\n\
    \nJava 提供了额外的无符号移动运算符（`>>>`）。\n\n由于 Java 不允许直接操作指针，因此它不支持引用和解引用运算符 `*`、`->` 和\
    \ `&`（取地址）。\n\n"
- fmt: "\nThere is no `sizeof()` operator in Java. In C++, the `sizeof()` operator\
    \ tells you the number of bytes allocated for data items. Java does not need a\
    \ `sizeof()` operator for this purpose because all the data types are the same\
    \ size on all machines.\n\n## Statements, Control over Program Execution\n\nStatements\
    \ are the smallest separate parts of the programming language. A program is a\
    \ sequence of statements. Most of Java statements are similar to ones in C++.\n\
    \n### Empty statement\nEmpty statement consists of one semicolon.\n\n### Expression\
    \ statement\nExpression statement is an expression that ends with a semicolon.\
    \ For examples are as follows:\n\nCODE :\n```java\nk = i + j + 1; // assignment\n\
    Arrays.sort(a); // invocation of function\nreturn; // termination of current function\
    \ execution\n```\n\n### Compound statement\nCompound statement is a sequence of\
    \ statements enclosed in braces. Compound statement is often referred to as block.\
    \ Compound statement does not contain semicolon after closing brace. Syntactically\
    \ block can be considered as a separate statement, but it also defines scope of\
    \ visibility. Identifier declared inside the block, has a scope from the point\
    \ of definition to the closing brace. Blocks can be nested in each other.\n\n\
