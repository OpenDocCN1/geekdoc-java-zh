- fmt: "\n![](cover.jpeg)\n\n# Java Basics\n\nJava can be written in regular text\
    \ editors, and compile on Command Prompt or Terminal. Compilation is made by `javac`,\
    \ for more information please visit [Oracle](http://docs.oracle.com/javase/7/docs/technotes/tools/windows/javac.html).\n\
    \nFor this book, I will also explain Integrated Development Environment `Eclipse\
    \ 4.2`.\n\n Common Concept\n\n`Eclipse` is a universal programming platform used\
    \ for creation of Integrated Development Environments (IDE). This platform is\
    \ built on an open source. Although `Eclipse` can be used as an IDE for development\
    \ programs in `C++`, `C#`, and other programming languages, its great popularity\
    \ is as a Java IDE, and it comes with built-in Java support.\n\nThe term `Workbench`\
    \ refers to the desktop development environment. `Eclipse`'s Workbench` window\
    \ contains one or more perspectives. A perspective defines the initial set and\
    \ layout of views in the `Workbench` window. Each perspective provides a set of\
    \ functionality aimed at accomplishing a specific type of task or works. Perspectives\
    \ control what appears in certain menus and toolbars. Examples of perspectives\
    \ are `Java`, `Debug`, `C++`, etc.\n\nWhen the `Workbench` is launched for the\
    \ first time, the first thing you see is a dialog that allows you to select where\
    \ the `workspace` should be located. The `workspace` is the directory where your\
    \ work will be stored. After workspace location is chosen, a Welcome window is\
    \ displayed (\"Welcome to Eclipse IDE for Java Developers\"). You can then close\
    \ the \"Welcome\" and, if necessary, change the `workspace`. To start Java development,\
    \ you should choose necessary perspective (`Window | Open Perspective | Other...\
    \ | Java`). In most cases, this is default perspective.\n\nIf the `workspace`\
    \ was created before, main window opens with several views according to chosen\
    \ perspective. Unnecessary windows should close. You can continue to work on previous\
    \ projects, or create a new one.\n\n## Creating New Project\n\nTo create a new\
    \ project, choose `File | New | Project` function of a main menu. Choose `Java\
    \ Project` (Adapted menu provides short invocation: `File | New | Java Project`).\
    \ Now press Next button. On the next step you must type project name and then\
    \ press Finish button.\n\nAll Java functions can be implemented in the context\
    \ of classes only. Now you should create a new class with `static main()` method\
    \ that is a starting point of your Java program. Choose `File | New | Class` function\
    \ to activate Class Wizard. It allows adding a new source file, which contains\
    \ a description of a class. Now you type package name and class name. The new\
    \ class should be `public`. It must contain `main()` method.\n\nAssume that package\
    \ called `test` contains class called `TestClass`. The Class Wizard generates\
    \ the following code:\n\n```java\npackage test;\n\npublic class TestClass {\n\
    \    /**\n    * @param args\n    */\n    public static void main(String[] args)\
    \ {\n        // TODO Auto-generated method stub\n    }\n}\n```\n\nParameter of\
    \ this method `String[] args` provides access to command line arguments. What\
    \ I mean is; you want to run the program via terminal/cmd, and you want to control\
    \ your program with flags or give input values inline, you have to use command\
    \ line arguments.\n\n```cmd\nc:\\myProgram -f arg3 arg4\n```\n\nAs you know, arrays\
    \ are zero indexed. So, the very first argument is `args[0]` which is `myProgram`.\
    \ `\"-f\"` is second argument, and is saved in `args[1]`, so on.\n\nLet's write\
    \ a program which reads values for `a` and `b`, then returns `c` as `a+b`.\n\n\
    ```java\npackage test;\n\nimport java.util.Scanner;\n\npublic class TestClass\
    \ {\n    /**\n    * @param args\n    */\n    public static void main(String[]\
    \ args) {\n        Scanner scanner = new Scanner(System.in);\n        int a =\
    \ scanner.nextInt();\n        int b = scanner.nextInt();\n        int c = a +\
    \ b;\n        System.out.println(c);\n    }\n}\n```\n\nFor those who do not know\
    \ what is `import`, and `java.util.Scanner;`\n\nIn order to read user input for\
    \ variable `a`, and `b`, you have to read from console. So, you need some predefined\
    \ methods from the Class (`java.util.Scanner`). `Scanner` class takes one argument\
    \ (`System.in`). Since, you want to scan inputs on console, you have to define\
    \ (`System.in`).\n\nThe result is printed onto standard output device (console)\
    \ using `println()` method of `out` object. This object is a static field of `System`\
    \ class.\n\nAs you can see, automatically generated source file called `TestClass.java`\
    \ is stored in `test` subfolder. You cannot modify names of files and folders\
    \ manually. Source file can contain the only non-nested public class with the\
    \ same name as file name. The name of package is always the same as subfolder\
    \ name. If you want to modify these names, you should use `Refactor | Rename...`\
    \ function.\n\nNew program should be launched using `Run | Run (Ctrl-F11)` function\
    \ of main menu, or `Run as | Java Application` function of context menu. You can\
    \ also create runtime configuration using `Run | Run Configurations...` function.\
    \ Choose Java application item and then press New. Choose necessary project name\
    \ and class name and press Run button. Special view called `Console` appears in\
    \ lower part of Eclipse window. Next times you can press `\"Run project name\"\
    ` button (or `Ctrl-F11`).\n\nIf the project was previously created on another\
    \ computer, you can copy it to the folder that represents the workspace, and then\
    \ import your project using the import function (`File | Import... | General |\
    \ Existing Project into Workspace`). Import does not involve physical copying\
    \ project files.\n\n## Debugging Program\n\nDebugging is used to find and fix\
    \ run-time errors. Choose `Window | Open Perspective | Debug` function for debugging.\
    \ You can add breakpoints (`Run | Toggle Breakpoint`, or `Ctrl-Shift-B`). To run\
    \ the program in debugging mode, use `Run | Debug F11`. You can also use Step\
    \ Into (`F5`) and Step Over (`F6`) functions. You can obtain values of variables\
    \ in hints.\n\nThe `Run | Resume` function allows you to resume execution. The\
    \ `Run | Terminate` function terminates execution.\n\n## Common Program Structure\n\
    \nThere are no global variables in Java. That should avoid name conflicts. Neither\
    \ are global functions or procedures, for that matter. There are only classes\
    \ with fields (data members) and methods (member functions). A program in Java\
    \ consists of one or more class definitions. One of these classes must define\
    \ a `main()` method, which is where the program starts running. Code of classes\
    \ definition should be stored in text files with the `Java` extension. Class name\
    \ (without extension) must match the name of a `public` class that defined in\
    \ the file. Please keep in mind that capitalized and small letters are different.\n\
    \nEach class is compiled into its own file containing the binary code and `Class`\
    \ extension. Unlike C++, this binary code is not a set of machine commands of\
    \ particular processor, but so called byte code.\n\nCompiled program can be executed\
    \ on your computer only if so-called Java Virtual Machine is installed. Java Virtual\
    \ Machine (`JVM`) is a special program, which provides interpretation of byte\
    \ codes. This approach allows you to create applications that can be transferred\
    \ from one operating environment (operating system, hardware platform) to another\
    \ without additional recompilation. Unlike C++, Java does not provide static linking\
    \ of binary code into an executable file. Linking (getting of a byte code from\
    \ different files with the `Class` extension and interpreting of byte code) is\
    \ always dynamic.\n\n### Identifiers, Keywords, Reserved Words, and Comments\n\
    \nLike C++, Java language is case-sensitive. Java source code consists of tokens.\
    \ Token is a sequence of characters that have some meaning. Separators (space,\
    \ tab, new line, etc.) are placed between individual tokens.\n\nTokens are divided\
    \ into the following groups:\n\n- keywords (reserved words)\n\n- identifiers\n\
    \n- literals (explicit constants)\n\n- operators.\n"
