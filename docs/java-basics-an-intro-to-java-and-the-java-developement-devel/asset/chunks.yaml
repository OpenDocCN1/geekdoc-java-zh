    Java initializes all fields with default values. In contrast to C++, Java allows
    fields'' initialization on the spots:


    CODE :


    class Rectangle {


    double width = 10;


    double height = 20;


    double area() {


    return width * height;


    }


    }


    You can create initialization block inside of class body:


    CODE :


    class Rectangle {


    double width;


    double height;


    {


    width = 10;


    height = 20;


    }


    double area() {


    return width * height;


    }


    }


    Methods and fields can be declared with static keyword. A static method can be
    invoked without an instance of the class. Static fields can be accessed using
    class name. A static field is a kind of global variable declared in class scope.
    You don''t need to define static members in global scope. You can initialize static
    fields on the spots:


    CODE :


    class SomeClass {


    static double x = 10;


    static int i = 20;


    }


    You can create initialization block for static fields:


    CODE :


    class SomeClass {


    static double x;


    static int i;


    static {


    x = 10;


    i = 20;


    }


    }


    In contrast to non-static initialization, creation of static fields occurs by
    the first use of a class. Java does not create static members for idle classes.


    You can access static member using both class name and object name:


    CODE :


    SomeClass.x = 30;


    SomeClass s = new SomeClass();


    s.x = 40;


    In Java methods, arguments are passed by value.


    The this keyword refers to the current instance for which a method is called.
    All non-static methods implicitly obtain this reference. You can explicitly use
    this reference if you want to return reference to current object or need to prevent
    name conflicts. Static member functions do not have a this reference.Visibility


    Like C++, Java supports private, protected, and public visibility levels. Class
    itself can be specified as public. In contrast to C++, Java requires separate
    definition of visibility for any member:


    CODE :


    public class SomeClass {


    private int i;


    private double x;


    public void setI(int value) {


    i = value;


    }


    public int getI() {


    return i;


    }


    public void setX(double value) {


    x = value;


    }


    public int getI() {


    return i;


    }


    }


    Access to private class members is restricted to methods within the class. There
    is no friend keyword in Java.


    A public class member can be accessed by any function from any package.


    Class members without visibility attributes have default access. The default access
    has no keyword, but it is commonly referred to as "friendly." All the other classes
    in the current package have access to the friendly member, but to all the classes
    outside of this package the member appears to be private.


    Access to protected class members is restricted to methods within the class, member
    functions of derived classes, and to classes within current package.Constructors


    A user instantiates a class by applying the new operator to the class constructor.


    A constructor is a function whose name matches with the class name and does not
    define any return type. A class may define multiple constructors. If no constructor
    is defined by the class a default (no argument) constructor is automatically made
    available to the class. The default constructor initializes all the fields to
    their default values.


    You can invoke constructor with arguments from another constructor using this
    keyword.


    CODE :


    class Rectangle {


    double width;


    double height;


    Rectangle(double width, double height) {


    this.width = width;


    this.height = height;


    }


    Rectangle() {


    this(10, 20); // calls another constructor


    }


    }


    There are no destructors in Java. You can create a special method called finalize().
    A Garbage Collector invokes finalize() method before the destruction of object.
    Object can be never destroyed by Garbage Collector, and therefore finalize() method
    can be never invoked.Strings


    Strings in Java are instances of the java.lang.String class. The object of string
    type represents Unicode character string.


    You can create a String object simply by enclosing characters in double quotes:


    CODE :


    String s = "The first string";


    When one or both operands are of type string, the predefined addition operators
    concatenate the string representation of the operands


    An instance of String is said to be immutable because its value cannot be modified
    once it has been created. Methods that appear to modify a String actually return
    a new String containing the modification. If you need to modify the contents of
    a String, you have to create a StringBuffer object from the String object, modify
    the contents of the StringBuffer, and then create a new String from the contents
    of the StringBuffer.


    Some of the more important String methods are as follows:


    length() : Returns the int number of characters in the string.


    charAt(int index) : Returns the character at the specified index of the string.


    equals(Object obj) : Compares this string to the specified object, returns true
    or false.


    compareTo(String value) : Compares a string to the argument string. The result
    is a negative integer if this String object lexicographically precedes the argument
    string. The result is a positive integer if this String object lexicographically
    follows the argument string. The result is zero if the strings are equal.


    indexOf(char ch) : Returns the index location of the first occurrence of the specified
    character.'
