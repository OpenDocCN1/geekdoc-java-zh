    reads integer and real values from the command line and finds their sum.


    CODE :


    Public class TestArgs {


    public static void main(String[] args) {


    int n = Integer.parseInt(args[0]);


    double x = Double.parseDouble(args[1]);


    double y = n + x;


    System.out.println(y);


    }


    }


    Count of arguments typed in command line can be determined using args.length expression.


    To set command line arguments in eclipse environment, Arguments tab of "Run" window
    is used. Necessary arguments should be typed in "Program arguments:" text area.
    String type arguments that contain several words should be quoted.Console Input
    and Output


    You can use Scanner class of java.util package for data input from the keyboard
    at runtime. For keyboard input at runtime you can use Scanner class of java.util
    package. First, we need to create an object of this class by new operation.


    CODE :


    Scanner s = new Scanner(System.in);


    Now this object can be used for reading data of different types. For example,
    next() function returns the next read value of String type, nextInt() allows to
    obtain an integer, nextDouble() reads and returns the number of double type. There
    are also functions nextBoolean(), nextByte(), nextShort(), nextLong(), nextFloat()
    etc.. All these functions cause termination of the program that resumes after
    reading corresponding value from the keyboard. For example:


    CODE :


    Scanner s = new Scanner(System.in);


    double d = s.nextDouble();


    int i = s.nextInt();


    float f = s.nextFloat();


    Output onto console window is based on using functions of out object declared
    within System class. The print() function can print results without jump to a
    new line, println() function moves cursor to a new line after output. You can
    also use the printf() for formatted output. Using this function is similar to
    use of one in C language.


    The following sample program reads real and integer numbers, and displays their
    sum:


    CODE :


    import java.util.Scanner;


    public class Average {


    public static void main(String[] args) {


    Scanner s = new Scanner(System.in);


    int i = s.nextInt();


    double d = s.nextDouble();


    double sum = i + d;


    System.out.println("Sum: " + sum);


    }


    }References


    There is no pointer type in Java. The names of variables of non-primitive types
    are essentially names of references to corresponding objects. These non-primitive
    types are often called reference types because they are handled by reference.
    By comparison, primitive types are handled by value. Dereference * and -> operators
    do not exist in Java: primitive types are always passed by value; arrays and objects
    are always passed by reference. A reference type can never be cast to a primitive
    type or vice versa. Java does not allow you to do pointer arithmetic.


    A special keyword null is used as a reference to nothing. This indicates "an absence
    of reference". The null value may be assigned to any variable of reference type.


    You can create objects in dynamic store using new operator:


    CODE :


    SomeType st = new SomeType();


    Because reference types are not passed by value, assigning one object to another
    in Java does not copy the value of the object. It merely assigns a reference to
    the object.


    CODE :


    SomeType a = new SomeType();


    SomeType b = new SomeType();


    a = b;


    After these lines are executed, the variable a contains a reference to the object
    that b refers to. The object that a used to refer to is lost.


    You don''t need to deallocate objects. There is no delete operator in Java. A
    special mechanism called garbage collection is used for object''s deallocation.
    The garbage collection is based of reference counting. This means that each object
    contains a reference counter, and every time a reference is attached to an object
    the reference count is increased. Every time a reference goes out of scope or
    is set to null, the reference count is decreased. The garbage collector moves
    through the entire list of objects and when it finds one with a reference count
    of zero it releases that storage.Arrays


    Java arrays are zero indexed; that is, the array indexes start at zero. When declaring
    an array, the square brackets ([]) must come after the type, not the identifier.
    Placing the brackets after the identifier is legal but is not recommended in Java.


    CODE :


    int[] a;


    In this example, a is a reference to an array that can be created later. The size
    of the array is not part of its type as it is in the C++ language. This allows
    you to declare an array and assign any array of appropriate objects to it, regardless
    of the array''s length.


    CODE :


    int[] numbers; // declare a reference to an int array of any size


    numbers = new int[10]; // numbers is a 10-element array


    numbers = new int[20]; // now it''s a 20-element array


    Java supports single-dimensional arrays and multidimensional arrays (array-of-arrays).
    The following examples show how to declare different kinds of references to arrays:


    CODE :


    int[] numbers; // single-dimensional array


    byte[][] scores; // two-dimensional array


    Declaring references does not actually create the arrays. In Java, arrays are
    objects and must be instantiated. The following examples show how to create arrays:


    CODE :


    int[] numbers = new int[5]; // single-dimensional array


    String[][] names = new String[5][4]; // rectangular array


    byte[][] scores = new byte[5][]; // jagged array


    for (int x = 0; x < 5; x++) {


    scores[x] = new byte[x + 4];


    }


    The last example shows how to create two-dimensional array with different lengths
    of lines. The size of an array can be defined using integer constants and variables
    as well as expressions with integer result.


    In Java, arrays hold elements as well as their count. The count of elements can
    be obtained using special read only field called ''length'':


    CODE :


    int[] a = new int[10];


    System.out.println(a.length); // 10'
