  trans: "\n\n如果你想访问在其他包（不在 `java.lang` 中）中定义的类，你应该使用特殊前缀：`package_name.class_name`。如果你想访问嵌套包的类，前缀将更加复杂。为了避免使用全名，可以使用\
    \ `import` 指令。`import` 指令应该放置在源文件的顶部（或紧跟在 `package` 语句之后）。\n\n要导入位于不同包的类或接口，你有三个选择：\n\
    \n- 导入该类或接口（使用 `import` 关键字）。\n- 导入该类或接口所属的整个包（使用 `import` 关键字）。\n- 静态导入（Static\
    \ import）\n\n下面的示例演示了这些选择中的两种。\n\nCODE :\n```javaimport java.io.FileReader; //\
    \ 导入类或接口\n\nimport java.util.*; // 导入整个包\n\npublic class TestClass {\n\n    public\
    \ static void main(String[] args) {\n        java.io.FileWriter fw; // 全限定名\n\
    \        FileReader fr; // 直接访问导入的名称；\n        ArrayList al; // ArrayList 是 java.util\
    \ 包的一部分\n. . .\n    }\n}\n```\n\n你永远不需要 `import java.lang.*` 语句来使用该包中编译好的类。这个包总是自动导入的。\n\
    \nJava 5 版本中添加了一种新的导入形式，允许导入给定类的静态元素。大多数需要 `Math` 类数值函数的程序都包含以下语句：\n\nCODE :\n\
    ```java\nimport static java.lang.Math.*;\n```\n\n现在现在你可以在不需要额外修饰符的情况下调用 `Math`\
    \ 类的静态方法：\n\nCODE :\n```java\ndouble d = sin(1);\n```\n\n# 命令行参数的使用和控制台输入\n\n\
    你可以在 Java 程序中轻松地读取命令行参数。例如，下面的程序会在屏幕上显示第一个命令行参数的值：\n\nCODE :\n```java\npublic\
    \ static void main(String[] args) {\n    System.out.println(args[0]);\n}\n```\n\
    \n`main()` 函数中的命令行参数可以以字符串数组的形式访问（数组和字符串将在稍后解释）。要访问特定的数组元素，使用 `[]`。要获取由字符串表示的数值，则使用\
    \ `Integer` 和 `Double` 类的静态函数。在下面的示例中，程序从命令行读取整数值和实数值并计算它们的和。\n\nCODE :\n```java\n\
    Public class TestArgs {\n    public static void main(String[] args) {\n      \
    \  int n = Integer.parseInt(args[0]);\n        double x = Double.parseDouble(args[1]);\n\
    \        double y = n + x;\n        System.out.println(y);\n    }\n}\n```\n\n\
    命令行中输入的参数数量可以使用 `args.length` 表达式来确定。\n\n要在 eclipse 环境中设置命令行参数，可以使用 \"Run\" 窗口的\
    \ `Arguments` 选项卡。必要的参数应该输入到 \"Program arguments:\" 文本区域。包含多个单词的字符串类型参数应该加引号。\n\
    \n# 控制台输入与输出\n\n你可以使用 `java.util` 包中的 `Scanner` 类从键盘运行时输入数据。对于运行时的键盘输入，你可以使用 `java.util`\
    \ 包中的 `Scanner` 类。首先，我们需要通过 `new` 操作创建该类的对象。\n\nCODE :\n```java\nScanner s = new\
    \ Scanner(System.in);\n```\n\n现在这个对象可以用于读取不同类型的数据。例如，`next()` 函数返回下一个读取的 `String`\
    \ 类型值，`nextInt()` 允许获取一个整数，`nextDouble()` 读取并返回 double 类型数字。还有 `nextBoolean()`、`nextByte()`、`nextShort()`、`nextLong()`、`nextFloat()`\
    \ 等函数。所有这些函数都会导致程序终止，并在从键盘读取到相应值后恢复。例如：\n\nCODE :\n```java\nScanner s = new Scanner(System.in);\n\
    double d = s.nextDouble();\nint i = s.nextInt();\nfloat f = s.nextFloat();\n```\n\
    \n输出到控制台窗口基于使用 `System` 类中声明的 `out` 对象的方法。`print()` 函数可以打印结果而不跳换行，`println()`\
    \ 函数在输出后将光标移动到新行。你也可以使用 `printf()` 进行格式化输出。使用该函数类似于在 C 语言中使用。\n\n下面的示例程序读取实数和整数，并显示它们的和：\n\
    \nCODE :\n```java\nimport java.util.Scanner;\n\npublic class Average {\n    public\
    \ static void main(String[] args) {\n        Scanner s = new Scanner(System.in);\n\
    \        int i = s.nextInt();\n        double d = s.nextDouble();\n        double\
    \ sum = i + d;\n        System.out.println(\"Sum: \" + sum);\n    }\n}\n```\n\n\
    # 引用\n\nJava 中没有指针类型。非基本类型变量的本质上是指向对应对象的引用名称。这些非基本类型通常被称为引用类型，因为它们通过引用进行处理。相比之下，基本类型是通过值处理的。Java\
    \ 中不存在解引用运算符 `*` 和 引用运算符 `->`：基本类型总是按值传递的；数组和对象总是按引用传递的。引用类型永远无法转换为基本类型，反之亦然。Java\
    \ 不允许你进行指针算术。\n\n特殊关键字 `null` 被用作指向“无”的引用。它表示“引用的缺失”。`null` 值可以被赋值给任何引用类型的变量。\n\
    \n你可以使用 `new` 运算符在动态存储区中创建对象：\n\nCODE :\n```java\nSomeType st = newType();\n```\n\
    \n由于引用类型是按值传递的，将一个对象赋值给另一个仅仅是赋值引用。\n\nCODE :\n```java\nSomeType a = newType();\n\
    SomeType b = newType();\na = b;\n```\n\n在执行这些行后，变量 `a` 包含了 `b` 所指向的对象引用。你不需要释放对象。Java\
    \ 中没有 `delete` 运算符。一种特殊的垃圾回收机制用于对象的释放。这意味着每个对象都包含一个引用计数，每当附加引用时，计数增加。每当引用超出作用范围或设置为\
    \ `null` 时，计数减少。\n\n# 数组\n\nJava 数组是零索引的；也就是说，索引从零开始。在声明数组时，方括号 `[]` 必须放在类型后面。将括号放在标识符后面在\
    \ Java 中是合法的但不推荐。\n\nCODE :\n```java\nint[] a;\n```\n\n在示例中，`a` 是一个之后创建的数组引用。数组的大小不是类型的一部分，就像在\
    \ C++ 中那样。这允许你声明一个数组并将任何对象数组赋值给它，无论数组长度如何。\n\nCODE :\n```java\nint[] numbers;\
    \ // 声明\n```\n\nJava 支持单维数组和多维数组（数组数组）。下面的示例展示了如何声明不同类型的数组引用：\n\nCODE :\n```java\n\
    int[] numbers; // 单维数组\nbyte[][] scores; // 二维数组\n```\n\n声明引用不会实际创建数组。在 Java 中，数组是对象，必须进行实例化。下面的示例展示了如何创建数组：\n\
    \nCODE :\n```java\nint[] numbers = new int[5]; // 单维数组\nString[][] names = new\
    \ String[5][4]; // 矩形数组\nbyte[][] scores = new byte[5][]; // 锯齿数组\n\nfor (int\
    \ x = 0; x < 5; x++) {\n    scores[x] = new byte[x + 4];\n}\n```\n\n最后一个示例展示了如何创建行长度不同的二维数组。数组的大小可以使用整数常量、变量以及计算结果为整数的表达式来定义。\n\
    \n在 Java 中，数组持有元素以及它们的数量。元素的数量可以通过特殊的只读字段 `length` 来获取：\n\nCODE :\n```java\nint[]\
    \ a = new int[10];\nSystem.out.println(a.length); // 10\n```\n\n"
