  trans: "\nJava 中没有 `sizeof()` 运算符。在 C++ 中，`sizeof()` 运算符用于告知为数据项分配的字节数。Java 不需要为此目的提供\
    \ `sizeof()` 运算符，因为所有数据类型在所有机器上的尺寸都是相同的。\n\n## 语句与程序执行控制\n\n语句是编程语言中最小的独立部分。程序是语句的序列。大多数\
    \ Java 语句与 C++ 中的语句相似。\n\n### 空语句\n空语句由一个分号组成。\n\n### 表达式语句\n表达式语句是以分号结尾的表达式。例如下：\n\
    \nCODE :\n```java\nk = i + j + 1; // assignment\nArrays.sort(a); // invocation\
    \ of function\nreturn; // termination of current function execution\n```\n\n###\
    \ 复合语句\n复合语句是封装在大括号中的语句序列。复合语句通常被称为“块”（block）。复合语句在右括号后不包含分号。从语法上讲，块可以被视为独立语句，但它也定义了可见性作用域。在块内部定义的标识符，其作用域从定义点持续到右括号。块可以相互嵌套。\n\
    \n### 选择语句\n选择语句可以是常规语句或 switch 语句。条件语句有两种形式，如下：\n\nCODE :\n```java\nif (condition_expression)\n\
    statement1\nelse\nstatement2\n\n//or\n\nif (condition_expression)\nstatement1\n\
    ```\n如果 `condition_expression` 为真，则执行 `statement1`，否则控制流跳转到 `statement2`（第一种形式），或跳转到下一语句（第二种形式）。与\
    \ C++ 不同，`expression-condition` 只能是布尔类型。\n\n`switch` 语句的语法与 C++ 相同。此外，Java 7 允许在\
    \ `switch()` 头部使用字符串表达式并在 case 标签中使用字符串常量：\n\n单独使用的 `break` 和 `continue` 语句在 Java\
    \ 中的行为与 C++ 相同。然而，在 Java 中，它们后面可以可选跟一个指定包含层循环的标签。这些语句的标签形式允许你在方法定义内“跳出”或“继续”任何指定的循环，而不仅仅是最近的包含层循环。例如：\n\
    \nCODE :\n```java\nint a;\n. . .\ndouble b = 0;\nlabel:\nfor (int i = 0; i < 10;\
    \ i++) {\n    for (int j = 0; j < 10; j++) {\n        if (i + j + a == 0) {\n\
    \            break label;\n        }\n        b += 1 / (i + j + a);\n    }\n}\n\
    ```\n\n`goto` 语句目前不是 Java 语言的一部分，但 `goto` 是 Java 中的保留字。该词不能以任何方式使用。\n\nJava 中没有\
    \ `typedef` 运算符。Java 不支持 C++ 的 `struct` 和 `union` 类型。\n\n### 包与函数\n\nJava 代码不需要头文件。所有代码都是内联的。为了避免命名冲突使用了包（packages）机制。在\
    \ Java 语言中，包用于分类类。\n\n包是相关类和接口的集合，提供了访问保护和命名空间管理。\n\n在 Java 语言中，每个类都必须放在一个包中。如果类的源代码顶部没有声明该类所属包的\
    \ `package` 语句，那么该类位于默认包中。\n\n在物理上，每个包本质上是一个与包同名的文件夹。子包反映为子文件夹。\n\n大多数 Java 程序的第一行是所谓的\
    \ `package` 语句。只有空行和注释可以出现在 `package` 语句之前。\n\nCODE :\n```java\npackage package_name;\n\
    ```\n`package_name` 指定包名。在语言中，每个类都必须放在一个包中。如果类的源代码顶部没有声明该类所属包的 `package` 语句，那么该类位于默认包中。\n\
    \n通过这种方式，你只能使用当前包或 `java.lang` 标准包的方法。该包提供了具有有用函数的类。例如，`Math` 类提供了数值方法。\n\n（注：源代码中的剩余文本包含关于方法重载和语法的重复/乱码描述；核心技术逻辑已在上方保留并结构化。）\n"
- fmt: "\nIf you want to access classes, which are defined in other packages (not\
    \ in `java.lang`), you should use special prefix: `package_name.class_name`. If\
    \ you want to access classes of nested packages, prefix will be more complex.\
    \ To avoid use of full names, `import` directive is used. The `import` directive\
    \ should be placed at the top of source file (or directly after `package` statement).\n\
    \nTo import a class or an interface that's in a different package, you have three\
    \ choices:\n\n- Import the class or the interface (using `import` keyword).\n\
    - Import the entire package of which the class or the interface is a member (using\
    \ `import` keyword).\n- Static import\n\nThe following example demonstrates two\
    \ of these choices.\n\nCODE :\n```javaimport java.io.FileReader; // Import of\
    \ the class or the interface\n\nimport java.util.*; // Import of the entire package\n\
    \npublic class TestClass {\n\n    public static void main(String[] args) {\n \
    \       java.io.FileWriter fw; // Fully qualified name\n        FileReader fr;\
    \ // Direct access to the imported name;\n        ArrayList al; // ArrayList is\
    \ a part of in java.util package\n. . .\n    }\n}\n```\n\nYou never need an `import\
    \ java.lang.*` statement to use the compiled classes in that package. This package\
    \ is always imported automatically.\n\nA new additional form of import that was\
    \ added in Java 5 version, allows import of static element of a given class. Most\
    \ programs that need numerical functions of `Math` class contain the following\
    \ statement:\n\nCODE :\n```java\nimport static java.lang.Math.*;\n```\n\nNow you\
    \ can invoke static methods of `Math` class without extra qualifiers:\n\nCODE\
    \ :\n```java\ndouble d = sin(1);\n```\n\n# Use of Command Line Arguments and Console\
    \ Input\n\nYou can easy read command line arguments in Java program. For example,\
    \ the following program shows value of the first command line argument on the\
    \ screen:\n\nCODE :\n```java\npublic static void main(String[] args) {\n    System.out.println(args[0]);\n\
    }\n```\n\nCommand line arguments within `main()` function can be accessed in the\
    \ form of array of strings (arrays and strings will be explained later). To access\
    \ particular array elements, `[]` is used. To obtain numeric value, represented\
    \ by string, static functions of `Integer` and `Double` classes are used. In the\
    \ following example, program reads integer and real values from the command line\
    \ and finds their sum.\n\nCODE :\n```java\nPublic class TestArgs {\n    public\
    \ static void main(String[] args) {\n        int n = Integer.parseInt(args[0]);\n\
    \        double x = Double.parseDouble(args[1]);\n        double y = n + x;\n\
    \        System.out.println(y);\n    }\n}\n```\n\nCount of arguments typed in\
    \ command line can be determined using `args.length` expression.\n\nTo set command\
    \ line arguments in eclipse environment, `Arguments` tab of \"Run\" window is\
    \ used. Necessary arguments should be typed in \"Program arguments:\" text area.\
    \ String type arguments that contain several words should be quoted.\n\n# Console\
    \ Input and Output\n\nYou can use `Scanner` class of `java.util` package for data\
    \ input from the keyboard at runtime. For keyboard input at runtime you can use\
    \ `Scanner` class of `java.util` package. First, we need to create an object of\
    \ this class by `new` operation.\n\nCODE :\n```java\nScanner s = new Scanner(System.in);\n\
    ```\n\nNow this object can be used for reading data of different types. For example,\
    \ `next()` function returns the next read value of `String` type, `nextInt()`\
    \ allows to obtain an integer, `nextDouble()` reads and returns the number of\
    \ double type. There are also functions `nextBoolean()`, `nextByte()`, `nextShort()`,\
    \ `nextLong()`, `nextFloat()` etc.. All these functions cause termination of the\
    \ program that resumes after reading corresponding value from the keyboard. For\
    \ example:\n\nCODE :\n```java\nScanner s = new Scanner(System.in);\ndouble d =\
    \ s.nextDouble();\nint i = s.nextInt();\nfloat f = s.nextFloat();\n```\n\nOutput\
    \ onto console window is based on using functions of `out` object declared within\
    \ `System` class. The `print()` function can print results without jump to a new\
    \ line, `println()` function moves cursor to a new line after output. You can\
    \ also use the `printf()` for formatted output. Using this function is similar\
    \ to use of one in C language.\n\nThe following sample program reads real and\
    \ integer numbers, and displays their sum:\n\nCODE :\n```java\nimport java.util.Scanner;\n\
    \npublic class Average {\n    public static void main(String[] args) {\n     \
    \   Scanner s = new Scanner(System.in);\n        int i = s.nextInt();\n      \
    \  double d = s.nextDouble();\n        double sum = i + d;\n        System.out.println(\"\
    Sum: \" + sum);\n    }\n}\n```\n\n# References\n\nThere is no pointer type in\
    \ Java. The names of variables of non-primitive types are essentially names of\
    \ references to corresponding objects. These non-primitive types are often called\
    \ reference types because they are handled by reference. By comparison, primitive\
    \ types are handled by value. Dereference `*` and `->` operators do not exist\
    \ in Java: primitive types are always passed by value; arrays and objects are\
    \ always passed by reference. A reference type can never be cast to a primitive\
    \ type or vice versa. Java does not allow you to do pointer arithmetic.\n\nA special\
    \ keyword `null` is used as a reference to nothing. This indicates \"an absence\
    \ of reference\". The `null` value may be assigned to any variable of reference\
    \ type.\n\nYou can create objects in dynamic store using `new` operator:\n\nCODE\
    \ :\n```java\nSomeType st = new SomeType();\n```\n\nBecause reference types are\
    \ not passed by value, assigning one object to another in Java does not copy the\
    \ value of the object. It merely assigns a reference to the object.\n\nCODE :\n\
    ```java\nSomeType a = new SomeType();\nSomeType b = new SomeType();\na = b;\n\
    ```\n\nAfter these lines are executed, the variable `a` contains a reference to\
    \ the object that `b` refers to. The object that `a` used to refer to is lost.\n\
    \nYou don't need to deallocate objects. There is no `delete` operator in Java.\
    \ A special mechanism called garbage collection is used for object's deallocation.\
    \ This means that each object contains a reference counter, and every time a reference\
    \ is attached to an object reference count increases. Every time a reference goes\
    \ out of scope or is set to null, the reference count decreases. The garbage collector\
    \ moves through the entire list of objects and when it finds one with reference\
    \ count of zero it releases that storage.\n\n# Arrays\n\nJava arrays are zero\
    \ indexed; that is, the array indexes start at zero. When declaring an array,\
    \ the square brackets `[]` must come after the type, not the identifier. Placing\
    \ the brackets after the identifier is legal but not recommended in Java.\n\n\
    CODE :\n```java\nint[] a;\n```\n\nIn this example, `a` is a reference to an array\
    \ that can be created later. The size of the array is not part of its type as\
    \ it is in the C++ language. This allows you to declare an array and assign any\
    \ array of objects to it, regardless of the array's length.\n\nCODE :\n```java\n\
    int[] numbers; // declare a reference to an int array of any size\nnumbers = new\
    \ int[10]; // numbers is a 10-element array\nnumbers = new int[20]; // now it's\
    \ a 20-element array\n```\n\nJava supports single-dimensional arrays and multidimensional\
    \ arrays (array-of-arrays). The following examples show how to declare different\
    \ kinds of references to arrays:\n\nCODE :\n```java\nint[] numbers; // single-dimensional\
    \ array\nbyte[][] scores; // two-dimensional array\n```\n\nDeclaring references\
    \ does not actually create the arrays. In Java, arrays are objects and must be\
    \ instantiated. The following examples show how to create arrays:\n\nCODE :\n\
    ```java\nint[] numbers = new int[5]; // single-dimensional array\nString[][] names\
    \ = new String[5][4]; // rectangular array\nbyte[][] scores = new byte[5][]; //\
    \ jagged array\n\nfor (int x = 0; x < 5; x++) {\n    scores[x] = new byte[x +\
    \ 4];\n}\n```\n\nThe last example shows how to create two-dimensional array with\
    \ different lengths of lines. The size of an array can be defined using integer\
    \ constants and variables as well as expressions with integer result.\n\nIn Java,\
    \ arrays hold elements as well as their count. The count of elements can be obtained\
    \ using special read only field called `length`:\n\nCODE :\n```java\nint[] a =\
    \ new int[10];\nSystem.out.println(a.length); // 10\n```\n"
