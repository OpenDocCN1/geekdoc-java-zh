    典型的数组遍历如下：


    CODE :

    ```java

    for (int i = 0; i < a.length; i++) {

    a[i] = 0;

    }

    ```


    Java 提供了一种在声明时通过将初始值封装在大括号（`{}`）中来初始化数组的简单方法。如果数组在声明时没有初始化，数组成员将自动初始化为该数组类型的默认初始值。


    CODE :

    ```java

    int[] numbers = new int[] {1, 2, 3, 4, 5};

    String[] names = new String[] {"Matt", "Joanne", "Robert"};

    ```


    如果提供了初始化器，可以省略 `new` 语句，如下：


    CODE :

    ```java

    int[] numbers = {1, 2, 3, 4, 5};

    String[] names = {"Matt", "Joanne", "Robert"};

    ```


    多维数组可以以类似的方式初始化：


    CODE :

    ```java

    int[][] b = {{1, 2, 3},

    {0, 0, 1},

    {1, 1, 11},

    {0, 0, 0}};

    ```


    在这个示例中，二维数组包含四行三列。


    `for` 循环的新形式简化了整个数组的遍历。例如，与其使用


    CODE :

    ```java

    int[] nums = {1, 2, 3, 4, 5, 6};

    for (int i = 0; i < nums.length; i++)

    System.out.println(nums[i]);

    ```


    你也可以写成


    CODE :

    ```java

    int[] nums = {1, 2, 3, 4, 5, 6};

    for(int n : nums)

    System.out.println(n);

    ```


    新形式可以仅用于读取元素（不用于修改）。


    将一个数组赋值给另一个数组本质上是引用的复制。如果你想将数组 `a` 的所有元素赋值给数组 `b` 的元素，必须创建一个循环。`System` 类提供了一种最简单的将数组复制到另一个数组的方法：`arraycopy()`
    函数：


    CODE :

    ```java

    System.arraycopy(a, a_from, b, b_from, size);

    ```


    这等于以下循环：


    CODE :

    ```java

    for (int i = a_from, j = b_from; i < size + a_from; i++, j++) {

    b[j] = a[i];

    }

    ```


    你可以使用此类函数调用将整个数组 `a` 复制到 `b`：


    CODE :

    ```java

    System.arraycopy(a, 0, b, 0, a.length);

    ```


    # 类定义


    类是一种结构化数据类型，包含不同类型的数据成员以及处理这些数据的函数。类定义包含修饰符（例如 `public`、`final`）、类名、基类名、实现的接口列表以及封装在大括号中的类体。


    类体包含字段（C++ 中的数据成员）和方法（C++ 中的成员函数）的声明。变量和方法共同统称为成员。Java 类的声明看起来与 C++ 非常相似。这里有一个简单类的示例：


    CODE :

    ```java

    class Rectangle {

    double width;

    double height;

    double area() {

    return width * height;

    }

    }

    ```


    注意，你不需要在右大括号后加分号。在 Java 中，方法始终位于类定义内部，而不是像程序员在 C++ 中通常那样使用 `::` 运算符放在外部。


    Java 使用默认值初始化所有字段。与 C++ 不同，Java 允许在就处初始化字段：


    CODE :

    ```java

    class Rectangle {

    double width = 10;

    double height = 20;

    double area() {

    return width * height;

    }

    }

    ```


    你可以在类体内创建初始化块：


    CODE :

    ```java

    class Rectangle {

    double width;

    double height;

    {

    width = 10;

    height = 20;

    }

    double area() {

    return width * height;

    }

    }

    ```


    方法和字段可以使用 `static` 关键字声明。静态方法可以在没有实例的情况下调用。静态字段可以使用类名访问。静态字段是一种在类作用域内定义的全局变量。你不需要在全局作用域内定义静态成员。你可以在就处初始化静态字段：


    CODE :

    ```java

    class SomeClass {

    static double x = 10;

    static int i = 20;

    }

    ```


    你可以为静态字段创建初始化块：


    CODE :

    ```java

    class SomeClass {

    static double x;

    static int i;

    static {

    x = 10;

    i = 20;

    }

    }

    ```


    与非静态初始化相比，静态字段的创建发生在类的首次使用。Java 不为空闲类创建静态成员。


    你可以使用类名和对象名访问静态成员：


    CODE :

    ```java

    SomeClass.x = 30;

    SomeClass s = new SomeClass();

    s.x = 40;

    ```


    在 Java 方法中，参数是按值传递的。


    `this` 关键字指向调用方法的实例。所有非静态方法都会隐式地获取 `this` 。如果你想返回当前对象的引用或需要防止名称冲突，可以显式使用此引用。静态成员函数没有
    `this` 。


    # 可见性


    像 C++ 一样，Java 支持 `private`、`protected` 和 `public` 可见性。类本身可以指定为 `public`。与 C++
    不同，Java 要求对任何成员单独定义可见性：


    CODE :

    ```java

    public class SomeClass {

    private int i;

    private double x;

    public void setI(int value) {

    i = value;

    }

    public int getI() {

    return i;

    }

    public void setX(double value) {

    x = value;

    }


    public int getI() {

    return i;

    }

    }

    ```


    对 `private` 类成员的访问限制在类内部的方法。没有 `friend` 关键字。`public` 类成员可以被任何函数访问。


    对 `protected` 类成员的访问限制在类内部的方法、派生类以及当前包。


    # 构造函数


    用户通过对类应用 `new` 运算符来实例化。


    构造函数是一个名称与类名匹配且不定义任何返回类型的函数。类可以定义多个构造函数。如果类没有定义构造函数，则提供一个默认（无参数）构造函数。默认构造会将所有字段初始化为默认值。


    你可以使用 `this` 从另一个构造函数调用带参数的构造函数：


    CODE :

    ```java

    class Rectangle {

    double width;

    double height;

    Rectangle(double width, double height) {

    this.width = width;

    this.height = height;

    }


    Rectangle() {

    this(10, 20); // 调用另一个构造函数

    }

    }

    ```


    Java 中没有析构函数。你可以创建一个特殊的方法 `finalize()`。垃圾回收器在对象销毁之前调用 `finalize()` 方法。对象永远不会被垃圾回收器销，因此
    `finalize()` 方法永远不会调用。


    # 字符串


    Java 中的字符串是 `java.lang.String` 类的实例。字符串对象表示 Unicode 字符字符串。


    你可以简单地通过封装双引号来创建 `String` 对象：


    CODE :

    ```java

    String s = "The first string";

    ```


    当一个或两个操作数为字符串类型时，预定义的加运算符会拼接操作数的字符串表示


    String 实例是不可变的，因为一旦创建就无法修改。看似修改字符串的方法实际上返回包含修改内容的字符串。如果你需要修改字符串的内容，必须从字符串对象创建一个
    `StringBuffer` 对象，修改 `StringBuffer` 的内容，然后从 `StringBuffer` 的内容创建一个新字符串。


    一些重要的字符串方法如下：


    `length()` 返回字符串中字符的 `int` 数量。


    `charAt(int index)` 返回字符串中指定索引处的字符。


    `equals(Object obj)` 将此字符串与指定对象比较，返回 true 或 false。


    `compareTo(String value)` 将字符串与参数字符串比较。如果此 String 对象在字典顺序上于参数字符串，结果为负整数。如果此 String
    对象在字典顺序上于参数字符串，结果为正整数。如果字符串相等，则结果为零。


    `indexOf(char ch)` 返回指定字符首次出现的索引位置。

