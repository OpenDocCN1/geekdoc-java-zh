  trans: "\n\n`substring(int beginIndex,int endIndex)` : 返回一个作为该字符串的子字符串的新字符串。\n\n\
    `toLowerCase()` : 返回小写的字符串。\n\n`toUpperCase()` : 返回大写的字符串。\n\n以下示例演示了用于处理字符串数据的方法的使用。\n\
    \nCODE :\n```java\nString s1 = new String(\"Hello World.\");\n\nint i = s1.length();\
    \ // i = 12\n\nchar c = s1.charAt(6); // c = 'W'\n\ni = s1.indexOf('e'); // i\
    \ = 1 (index of 'e' in \"Hello World.\")\n\nString s2 = \"abcdef\".substring(2,\
    \ 5); // s2 = \"cde\"\n\nint k = \"AA\".compareTo(\"AB\"); // k = -1\n```\n\n\
    Java 语言对字符串拼接运算符（`+`）提供了特殊支持，并支持将其他对象转换为字符串。“加号”运算符用于字符串拼接：\n\nCODE :\n```java\n\
    String s1 = \"first\";\nString s2 = s1 + \" and second\";\n```\n\n如果其中一个操作数不是字符串类型，Java\
    \ 会自动获取其字符串表示。\n\nCODE :\n```java\nint n = 1;\nString sn = \"n is \" + n; // \"\
    n is 1\"\n\ndouble d = 1.1;\nString sd = d + \"\"; // \"1.1\"\n```\n\n你也可以使用 `+=`\
    \ 运算符。\n\n### Integer 和 Double 类\n\n`Integer` 和 `Double` 类将原始类型 `int` 和 `double`\
    \ 的值封装在适当的对象中。此外，这些类还提供了多种方法将数值转换为 `String` 以及将字符串转换为数字，以及在处理整数和双精度浮所需的常量和其他方法。\n\
    \n`Double.parseDouble()` 函数返回一个新的 `double`，其初始化为指定字符串所表示的值：\n\nCODE :\n```java\n\
    String s = \"1.2\";\ndouble d = Double.parseDouble(s);\n```\n\n函数 `Integer.parseInt()`\
    \ 和 `Boolean.parseBoolean()` 提供类似的功能。\n\n在 Java 5 (JDK 1.5) 中，`Integer` 类型的对象可以使用\
    \ `int` 类型的表达式进行初始化。此类对象可以在表达式中作为整数值使用。`int` 类型的常量和表达式可以添加到列表和容器中，会自动创建 `Integer`\
    \ 对象。在之前的版本中，你应该这样写：\n\nCODE :\n```java\nInteger m = new Integer(10); // Integer\
    \ 对象的初始化\nint k = m.intValue() + 1; // 存储的值在表达式中使用\n\n// 创建数组：\nInteger[] a =\
    \ {new Integer(1), new Integer(2), new Integer(3)};\nList li = new ArrayList();\n\
    a[2] = new Integer(4); // 用新对象替换给定元素\n\n// 提取 Integer 对象并使用其值：\nint i = a[1].intValue()\
    \ + 2;\n```\n\n在 Java 5 中，这段代码可以更简单：\n\nCODE :\n```java\nInteger m = 10; // Integer\
    \ 对象的初始化\nint k = m + 1; // 存储的值在表达式中使用\n\n// 创建数组：\nInteger[] a = {1, 2, 3};\n\
    a[2] = 4; // 用新对象替换给定元素\n\n// 提取 Integer 对象并使用其值：\nint i = a[1] + 2;\n```\n\n\
    相同的规则也适用于 `Double` 和 `Boolean` 类型。事实上，`Integer`、`Double` 和 `Boolean` 对象可以替代 `int`、`double`\
    \ 和 `Boolean` 变量。\n\n#### 类组合\n\n类组合假设创建某些类，这些类包含其他类的对象作为类字段。在 Java 中，你不能将对象放入另一个对象中。这里只允许引用。你可以在声明后或在构造函数中创建对象。\n\
    \nCODE :\n```java\nClassX {\n}\n\nclass Y {\n}\n\nclass Z {\n    X x = new X();\n\
    \    Y y;\n    Z() {\n        y = new Y();\n    }\n}\n```\n\n我认为，细节是编程中最重要的部分。因此，我试图解释每一个细节。\n\
