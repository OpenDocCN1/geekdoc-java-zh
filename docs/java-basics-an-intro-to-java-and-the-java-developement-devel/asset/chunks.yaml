  trans: "\n\n![](img/cover.jpeg)\n\n# Java 基础\n\nJava 可以在普通的文本编辑器中编写，并在命令提示符（Command\
    \ Prompt）或终端中编译。编译通过 `javac` 完成，更多信息请访问 [Oracle](http://docs.oracle.com/javase/7/docs/technotes/tools/windows/javac.html)。\n\
    \n在本书中，我还将解释集成开发环境 `Eclipse 4.2`。\n\n 常用概念\n\n`Eclipse` 是一个通用的编程平台，用于创建集成开发环境\
    \ (IDE)。该平台基于开源构建。虽然 `Eclipse` 可以作为 `C++`、`C#` 等其他编程语言的 IDE，但它作为 Java IDE 非常受欢迎，并且内置了\
    \ Java 支持。\n\n`Workbench`（工作区）术指的是桌面开发环境。`Eclipse` 的 `Workbench` 窗口包含一个或多个视角（perspectives）。视角定义了\
    \ `Workbench` 窗口中视图（views）的初始集合和布局。每个视角都提供一组旨在完成特定类型任务或工作的功能。视角控制某些菜单和工具栏中显示的内容。视示例包括\
    \ `Java`、`Debug`、`C++` 等。\n\n当第一次启动 `Workbench` 时，你看到的第一个是对话框，允许你选择 `workspace`（工作空间）的位置。`workspace`\
    \ 是存储你工作的目录。选择工作空间位置后，会显示欢迎窗口（“Welcome to Eclipse IDE for Java Developers”）。你可以关闭“欢迎”窗口，并在时更改\
    \ `workspace`。要开始 Java 开发，你应该选择必要的视角（`Window | Open Perspective | Other... | Java`）。在大多数情况下，这是默认视角。\n\
    \n如果 `workspace` 之前已经创建过，主窗口将根据所选视角打开几个视图。不必要的窗口应该关闭。你可以继续处理之前的项目，或者创建一个新项目。\n\
    \n## 创建新项目\n\n要创建一个新项目，请选择主菜单中的 `File | New | Project` 功能。选择 `Java Project`（适配后的菜单提供了快捷调用方式：`File\
    \ | New | Java Project`）。现在点击 Next 按钮。在下一步中，你必须输入项目名称，然后点击 Finish 按钮。\n\n所有的 Java\
    \ 函数只能在类的上下文中实现。现在你应该创建一个带有 `static main()` 方法的新类，这是你 Java 程序的起点。选择 `File | New\
    \ | Class` 功能激活类向导（Class Wizard）。它允许添加一个新的源文件，该文件包含对类的描述。现在你输入包名和类名。新类应该是 `public`\
    \ 的。它必须包含 `main()` 方法。\n\n假设名为 `test` 的包包含一个名为 `TestClass` 的类。类向导生成以下代码：\n\n```java\n\
    package test;\n\npublic class TestClass {\n    /**\n    * @param args\n    */\n\
    \    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method stub\n    }\n}\n```\n\n此方法的参数 `String[] args` 提供了对命令行参数访问。我的意思是：你想通过终端/cmd\
    \ 运行程序，并想通过标志控制程序或内联输入值，你必须使用命令行参数。\n\n```cmd\nc:\\myProgram -f arg3 arg4\n```\n\
    \n如你所知，数组是从零索引的。因此，第一个参数是 `args[0]`，即 `myProgram`。`\"-f\"` 是第二个参数，保存在 `args[1]`\
    \ 中，依此类推。\n\n让我们写一个程序读取 `a` 和 `b` 的值，然后返回 `a+b` 作为 `c`。\n\n```java\npackage test;\n\
    \nimport java.util.Scanner;\n\npublic class TestClass {\n    /**\n    * @param\
    \ args\n    */\n    public static void main(String[] args) {\n        Scanner\
    \ scanner = new Scanner(System.in);\n        int a = scanner.nextInt();\n    \
    \    int b = scanner.nextInt();\n        int c = a + b;\n        System.out.println(c);\n\
    \    }\n}\n```\n\n对于那些不知道 `import` 和 `java.util.Scanner;` 的人：\n\n为了读取变量 `a` 和\
    \ `b` 的用户输入，你必须从控制台读取。因此，你需要类 (`java.util.Scanner`) 中的预定义方法。`Scanner` 类接受一个参数\
    \ (`System.in`）。由于你想在控制台扫描输入，你必须定义 (`System.in`）。\n\n结果使用 `out` 对象的 `println()`\
    \ 方法打印到标准输出设备（控制台）。该对象是 `System` 类的静态字段。\n\n如你所见，自动生成的源文件 `TestClass.java` 存储在\
    \ `test` 子文件夹中。你不能手动修改文件和文件夹的名称。源文件可以包含一个与文件名同名的唯一非嵌套公共类。包的名称始终与子文件夹名称相同。如果你想修改这些名称，应该使用\
    \ `Refactor | Rename...` 功能。\n\n新程序应使用主菜单的 `Run | Run (Ctrl-F11)` 功能，或右键菜单的 `Run\
    \ as | Java Application` 功能启动。你也可以使用 `Run | Run Configurations...` 功能创建运行时配置。选择\
    \ Java application 项然后点击 New。选择必要的项目名和类名并点击 Run 按钮。Eclipse 窗口下部会出现一个名为 `Console`\
    \ 的特殊视图。下次你可以点击 `\"Run project name\"` 按钮（或 `Ctrl-F11`）。\n\n如果项目之前在另一计算机上创建，你可以将其复制到代表工作空间的文件夹，然后使用导入功能导入项目（`File\
    \ | Import... | General | Existing Project into Workspace`）。导入不涉及项目的物理拷贝。\n\n\
    ## 调试程序\n\n调试用于发现和修复运行时错误。选择 `Window | Open Perspective | Debug` 功能进行调试。你可以添加断点（`Run\
    \ | Toggle Breakpoint`，或 `Ctrl-Shift-B`）。要在调试模式下运行程序，请使用 `Run | Debug F11`。你还可以使用\
    \ Step Into（`F5`）和 Step Over（`F6`）功能。你可以在提示中获取变量的值。\n\n`Run | Resume` 功能允许你恢复执行。`Run\
    \ | Terminate` 功能终止执行。\n\n## 常用程序结构\n\nJava 中没有全局变量。这可以避免命名冲突。同样，也没有全局函数或过程。只有带有字段（数据成员）和方法（成员函数）的类。Java\
    \ 程序由一个或多个类定义组成。这些类中必须有一个定义 `main()` 方法，这是程序开始运行的地方。类定义代码应该存储在带有 `Java` 扩展名的文件中。类名（不带扩展名）必须与文件中定义的\
    \ `public` 类名匹配。请记住大写和小写字母是不同的。\n\n每个类都被编译成自己的文件，包含二进制代码和 `Class` 扩展名。与 C++ 不同，这种二进制代码不是特定处理器的机器指令集，而是所谓的字节码（bytecode）。\n\
    \n只有在安装了所谓的 虚拟机的情况下，编译后的程序才能在你的计算机上执行。Java 虚拟机 (`JVM`) 是一个提供字节码解释的特殊程序。这种方法允许你创建可以从一个运行环境（操作系统、硬件平台）传输到另一个环境的应用，而无需额外的编译。与\
    \ C++ 不同，Java 不提供将二进制代码静态链接到可执行文件。链接（获取来自不同 `Class` 扩展名文件的字节码并解释字节码）总是动态的。\n\n\
    ### 标识符、关键字、保留字和注释\n\n像 C++ 一样，Java 语言对大小写敏感。Java 源代码由标记（tokens）组成。标记是具有某些意义的字符序列。分隔符（空格、制表符、换行等）放置在各个标记之间。\n\
    \n标记分为以下几组：\n\n- 关键字（保留字）\n- 标识符\n- 字面量（显式常量）\n- 运算符\n\n"
- fmt: "\n# Java Basics\n\nA set of keywords is finite. All keywords are reserved.\
    \ Keywords cannot be used as identifiers. In Java there are also reserved words\
    \ that are not keywords. They generally cannot be used. These words are `const`\
    \ and `goto`.\n\nIdentifiers used for naming variables, functions and other software\
    \ objects. The first character must be a letter or underscore character (`_`).\
    \ Numbers also can be used as nonstarting characters. Using an underscore at the\
    \ beginning of the name is not desirable.\n\nIt is advisable to use meaningful\
    \ names that reflect the nature of the object or function. Do not use spaces inside\
    \ identifiers. So if you need to create identifier with several words, these words\
    \ should be written down together, starting second, third and other words with\
    \ capital letters. For example, you can create a variable name:\n\n```java-\n\
    thisIsMyVariable\n```\n\nUse English mnemonics for meaningful names. Names of\
    \ classes and interfaces should begin with capital letters, and other names -\
    \ only with lowercase letters. Names of static constants are composed of capital\
    \ letters and an underscore characters, for example `PI`, `CONST_VALUE` etc.\n\
    \n## Comments\n\nThe Java language supports three kinds of comments: C++-style\
    \ (double slashes), C-style (`/* */`), and doc comments (`/** */`).\n\nThe JDK\
    \ javadoc tool uses doc comments when preparing automatically generated documentation.\
    \ The doc comments must be formatted according to Javadoc standards. You can add\
    \ class and interface-level Javadoc comments as well as method, constructor and\
    \ field-level comments. Doc comments must be placed before corresponding parts\
    \ of code. Each comment consists of a description followed by one or more tags.\
    \ If desired, you can use HTML formatting in your Javadoc comments. There is a\
    \ special set of Javadoc tags such as `@author`, `@param`, `@return`, and so on.\
    \ The tags allow standard representation of documentation concerning classes and\
    \ methods. For example, the following comments before method;\n\n```java\n/**\n\
    * Returns file name with given index.<br>\n* File names are stored in array of\
    \ strings.\n* @param i index\n* @return file name.\n* */\npublic String getFileName(int\
    \ i) {\n    return names;\n}\n```\n\nproduce such fragment of HTML documentation\
    \ file:\n\nMethod Details\n\n`getFileName`\n\n`public String getFileName(int i)`\n\
    \nReturns file name with given index.\n\nFile names are stored in array of strings.\n\
    \nParameters:\n\n`i` - index\n\nReturns:\n\nfile name.\n\n## Definition of Local\
    \ Variables, and Primitive Types\n\nJava supports local variables, declared within\
    \ method definitions. These local variables behave just like local variables in\
    \ C++. Here are examples of local variables definition.\n\n```java\nint i = 11;\n\
    double d= 0, x;\nfloat f;\nint j, k;\n```\n\nYou can define and initialize local\
    \ variables anywhere in a function body or other block of code. You cannot use\
    \ the same variable names in outer and inner blocks:\n\n```java\n{\n    int i\
    \ = 0;\n    {\n        int j = 1; // OK. j is local variable defined in inner\
    \ block\n        int i = 2; // Error! A variable i is defined in outer block\n\
    \    }\n}\n```\nYou cannot declare variables without definition!\n\nThe `final`\
    \ keyword can be applied to variables. Such variables cannot be modified.\n\n\
    ```java\nfinal int h = 0;\n```\nThe `const` keyword is a reserved word in Java.\
    \ This word cannot be used in anyway.\n\nPrimitive, or basic, data types are classified\
    \ as integer (for whole numbers), floating-point (for decimal numbers), character\
    \ (for Unicode characters), or Boolean (specifying true / false). The definition\
    \ of local variables of primitive types looks like one in C++ programming language.\
    \ Here is primitive data types;\n\n### Integers\n- `byte` : Byte-length integer\
    \ : 8-bit\n- `short` : Short integer : 16-bit\n- `int` : Integer : 32-bit\n- `long`\
    \ : Long integer : 64-bit\n\n### Real Numbers\n- `float` : Single-precision floating\
    \ point : 32-bit\n- `double` : Double-precision floating point : 64-bit\n\n###\
    \ Others\n- `char` : A single Unicode character : 16-bit\n- `boolean` : A Boolean\
    \ value (true or false)\n\nIn some languages (for instance, C and C++), the format\
    \ and size of primitive data types may depend on the platform on which a program\
    \ runs. In contrast, the Java programming language specifies the size and format\
    \ of its primitive data types for all platforms.\n\nInteger constants are represented\
    \ by a sequence of decimal digits. The default type of such constants is `int`.\
    \ It can be adjusted by adding letter `L` or `l` (long type) at the end of the\
    \ constant. Integer constants can be represented in octal notation, in this case\
    \ the first digit should be zero (`0`), and the number can only contain digits\
    \ 0 ... 7. Integer constants can also be represented in hexadecimal number system,\
    \ in this case constant starts with `0x` (or `0X`) characters. To represent digits\
    \ between 10 and 15, letters a, b, c, d, e and f (large or small) are used. For\
    \ example:\n\n```java\nint octal = 023; // 19\nint hex = 0xEF; // 239\n```\n\n\
    A literal character value is any single Unicode character between single quote\
    \ marks. You can use whether symbols of the current character set, or integer\
    \ constant, which precedes the backslash character. It is a set of special control\
    \ characters (these double characters are called escape sequences):\n- `'\\n'`\
    \ - a new line,\n- `'\\t'` - horizontal tab,\n- `'\\r'` - jump at the beginning\
    \ of line,\n- `'\\`` - single quote,\n- `'\\\"'` - double quote,\n- `'\\\\'` -\
    \ backslash character itself.\n\nConstants of real types can be written whether\
    \ with decimal point or in scientific notation and are double by default. If necessary,\
    \ type of constant can be specified by adding suffix `f` or `F` for type `float`,\
    \ `d` or `D` for type `double`. For example:\n\n`1.5f` // float\n`2.4E-2d` //\
    \ double\n\nYou cannot assign floating point values to integer variables. A narrowing\
    \ conversion - converting from a larger type (for instance, `double`) to a smaller\
    \ type (for instance, `float`) - risks data. A narrowing conversion requires a\
    \ special operation called a cast. For example:\n\n```java\nint i = 10;\nfloat\
    \ f = i; // Permissible conversion\nlong l = f; // Error! Narrowing conversion\n\
    long l1 = (long) f; // Type cast\n```\nNumeric literals without decimal point\
    \ are constants of type `int`. Numeric literals with decimal point are constants\
    \ of type `double`. To assign them to smaller types, you must use type cast:\n\
    \n```java\nfloat f = 10.5; // Error! Narrowing conversion\nfloat f1 = (float)\
    \ 10.5; // Type cast\n```\nYou can specify a long integer by putting an 'L' or\
    \ 'l' after the number. 'L' is preferred as it cannot be confused with the digit\
    \ '1'. The Java programming language has no unsigned data types. What is an unsigned\
    \ data type? Unsigned data type works like \"unsigned int variable \", and this\
    \ variables cannot contain any negative number.\n\nThe two Boolean literals are\
    \ simply `true` and `false`. There is no conversion between the Boolean type and\
    \ other types (specifically `int`). You cannot apply explicit typecasting for\
    \ obtaining int from Boolean and vice versa.\n\nThe string constant is a series\
    \ of characters enclosed in quotation marks. For example:\n\n`\"This is a string\"\
    `\n\nAdding strings to variables of other types provides conversion of values\
    \ into their string representation. In particular, this approach is used to output\
    \ values of several variables. For example:\n\n```java\nint k = 1;\ndouble d =\
    \ 2.5;\nSystem.out.println(k + \" \" + d); // 1 2.5\n```\n\n## Expressions and\
    \ Operations\n\nJava class includes fields (data) and methods (functions). Methods\
    \ may contain statements, which in turn are composed of expressions. Expression\
    \ consists of one or more operations.\n\nJava supports almost all of the standard\
    \ numeric, logical and comparison C++ operators. These standard operators have\
    \ the same precedence and associativity in Java as they do in C++. Java supports\
    \ the comma operator only in loop headings.\n\nJava provides additional unsigned\
    \ shift operator (`>>>`).\n\nSince Java does not allow you to manipulate pointers\
    \ directly, it does not support the reference and dereference operators `*`, `->`,\
    \ and `&` (address of).\n"
