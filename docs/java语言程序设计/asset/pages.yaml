  md: "抽象类不能实例化，它是不能用 new 关键字创建的。抽象类只能为父类使用，通过派生的子类必须实现所有的抽象方法，才能创建对象。\n\n# 5.3.2\
    \ 抽象方法\n\n抽象方法，是指在类中定义为“要处理数据”，但“不知道如何处理数据”的方法。换句话，一个抽象方法仅仅为所有子类定义统一的接口，具体的代码通过派生类中对抽象方法的覆盖来实现，解决类中的不确定性。抽象方法是用抽象修饰。\n\
    \n抽象方法的格式：\n\n```\nabstract datatype AbstractName(parameterList);\n```\n\n可以看到，抽象方法只有定义，没有方法体，并且以分号；”结尾。\n\
    n注意：抽象方法只能在抽象类中定义。正如前文所述，如果类中有一个方法是抽象的，那么这个类就是抽象类。因此在非抽象类中，没有抽象方法。\n\n抽象方法的主要目的就是为所有子类定义统一的接口。如在初等几何类中求形状的面积，通常是定义一个方法\
    \ getArea()，但是在具体的形状未确定之前，面积是无法获取的，因为在不同形状的数学公式不同，我们不能只写方法来实现。\n下面我们举一个例子。如所述，每个初等几何形状都有面积，对这样的类似问题，可以定义一个抽象\
    \ Shape，并包含一个方法 getArea()，通过继承不同形状的类，如 Circle、Rectangle 等，并在这些派生类中重写 getArea()方法。每个子类都有\n\
    \n定义一个抽象类 Shape 和一个取面积的抽象方法 getArea()。\n\n```\n// Shape.java\n\npublic abstract\
    \ double getArea();\n```\n\n抽象类中的定义充当占位，它只是为了强制后续的子类实现它们。具体如何实现各种形状的面积，依据实现它的子类对该方法的重写。\n\
    \n再定义一个子类，重写方法 getArea():\n\n(1)定义一个矩形 Rectangle，并重写取面积的抽象方法。\n\n```\n// Rectangle.java\n\
    \npublic class Rectangle extends Shape // 从抽象类继承\n{\n    private double length;\n\
    \    private double height;\n\n    public Rectangle(double length, double height)\n\
    \    {\n        this.length=length;\n        this.width=height;\n    }\n```"
