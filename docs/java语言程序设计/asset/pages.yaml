    \ private 方法和属性（在子类中不必重新定义这些共同的属性和方法），并且子类中可以增加新的属性和方法。\\类的继承模拟了现实世界中的因关系，通过继承可以更有效地组织程序结构，并充分利用类来完成复杂的任务，继承目的是使程序复用，减少冗余。\n\
    \n# 5.2.1 类的继承\n\n正如前面介绍的一样，Java语言中所有的类都是java.lang.Object类继承来的（直接或间接的）。因此，在子类中不需要定义父类中已经存在的。\n\
    在C++中，一个类可以继承多个类的和行为（即多重继承），虽然增加了程序的灵活性，但使得程序结构变得复杂，并由此导致程序运行不稳定因素加大。因此在Java语言中，不支持多重继承，类的继承具有单重继承的特点，每个子类只有有一个直接父类。\n\
    \nJava语言中类继承的格式：\n通过extends关键字来实现类与类的继承。\nextends 关键字描述要定义的ClassName，（子类）需要继承父类（superClassName）中（非\
    \ private 修饰）的属性和方法。通过extends，在两个类之间建立起来关系。注意的是，Java的类不能获得父类的构造器。\n\n【例5—4】继承演示代码。\n\
