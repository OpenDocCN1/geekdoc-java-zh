    \n在同步中还会调用 wait(),notify()方法。概来说，每个共享对象的锁存在两个队列中，一个是锁等待队列，另一个是锁申请队列。锁等待队列中的线程在某些情况下将移入锁申请队列。\n\
    \nwait()和notify()方法必须在已经持有的锁的情况下调用，所以它们只能出现在synchronized作用的范围内，也就是出现在synchronized修饰的方法或类中。wait()的作用是释放已持有的锁，进入等待队列；notify()的作用是唤醒wait()队列中的第一个线程并将其移入锁申请队列；notifyAll()的作用是唤醒wait()队列所有的线程并将其移入锁申请队列。\n\
