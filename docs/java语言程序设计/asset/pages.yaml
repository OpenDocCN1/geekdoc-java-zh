  md: "# Java 程序设计\n\n# 2.9 其他辅助语句\n\n# 2.9.1 break 语句\n\nJava 语言提供了 goto 语句控制程序的跳转，这种做法提高了程序流程控制的可读性，但降低了流程控制的灵活性。为了弥补这个不足，Java\
    \ 提供了 break 和 continue 来控制循环结构。除此之外，return 可以结束整个方法，自然也结束一次循环。\n\n在某些时候，我们需要在循环条件出现时进行终止循环，而不是等到循环条件为\
    \ false 时退出循环。此时，可以用 break 实现这个功能，break 跳出当前的循环（提循环），执行循环结构后的语句。\n\n【例2-1】求 a-b\
    \ 之间的所有素数。\n\n分析：判断是否为素数的方法是用分别除 2 到 a-1，如果其中有一个整除，则不是素数。还可以扩展分别除 2 到 a 的平方根，如果其中有一个整除，则不是素数：\n\
    \n```\n//Prime.java\n```\n\n```\nimport java.util.Scanner;\n\nclass Prime {\n\
    \    public static void main(String[] args) {\n        int a=0,b=0; //定义变量\n \
    \       int r=0,line=0; //计数器\n        String temp=\"\";\n        System.out.print(\"\
    Please input first integer number:\");\n        Scanner sc=new Scanner(System.in);\n\
    \        temp=sc.nextLine();\n        a=Integer.parseInt(temp);//输入的第一个数字字符串转换成整数\n\
    \        System.out.print(\"Please input second integer number:\");\n        temp=sc.nextLine();\n\
    \        b=Integer.parseInt(temp);//输入的第二个数字字符串转换成整数\n        for(int n=a;n<=b;n++)\
    \ {\n            int m;\n            for(m=2;m<=Math.sqrt(n);m++) {\n        \
    \        if(n%m==0) break; //有一个能整除，即余数数为0，则此数不是素数\n            }\n          \
    \  if(m>Math.sqrt(n)) {\n                System.out.print(\"*\");\n          \
    \      line++; //打印一个素数，计数器每行打印的个数\n                if(line%10==0) //每10个数后，计数器清零，回车换行\n\
    \                    System.out.println();\n            }\n        }\n    }\n\
    }\n```\n\n![](img/313b79d057fc8eb887843de679d8acad_63_0.png)"
