  md: '# 第 3 章

    数组与字符串


    本章将介绍数组、字符串和 Java 语言的核心类和实用类，数组和字符串处理是 Java 语言程序设计中不可少的内容。为了简化程序设计的过程，Java 系统事先设计并实现了一些常规功能的标准，这些标准根据实现功能的不同，划分不同的集合——组成一个集合，称为系统的类。此外，还将介绍数组中使用非常普遍的对象——字符串缓冲类、字符串类、数组类、向量类以及某些算法。


    # 3.1 数组


    数组是有数据的集合，数组是一种简单的复合数据类型，数组中的每个数据被称为元素，每个元素都有相同的数据类型。在实际应用中常常会遇到相同类型值的处理，例如，1000
    个学生分数的排序处理，单用一个前面介绍的简单变量是很难完成的，这就需要数组。


    数组就是一个命名变量，其中的变量被标识为数组元素。在数组中可以存放任意类型的元素，其中一个一组存放的元素类型必须一致。一个数组中所有元素都有相同的名称，数组中的元素可以使用统一的数组名和下标来唯一确定。下标是一个
    int 型整数，数组中第一个元素的下标为 0，第二个元素的下标为 1……此类类推。


    # 3.1.1 一维数组


    只有一个下标的数组称为一维数组。在 Java 语言中，数组是作为对象处理的，在使用数组之前必须要需要初始化。所谓初始化，就是为数组分配内存空间，并为每个数组元素赋值。


    +   1. 数组的声明


    声明数组目的是说明数组变量的名称和数组元素的数据类型。


    声明格式：


    数据类型[] 数组名


    ![](img/313b79d057fc8eb887843de679d8acad_71_0.png)'
