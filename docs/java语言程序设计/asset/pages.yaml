    # 10.2 SQL 语言简介


    SQL 是一个标准的结构化的数据库查询语言。SQL 语言本身就是 Sequel，是 Boyce 和 Chamberlin 1970 年提出的。1975-1979
    年间美国数据库的发展，奎为 Almaden(美国研究中心)训练的数据库管理系统 R 实现了这种查询。SQL 语言得到了业界的认可。美国国家标准协会(ANSI)的数据库委员会已批准了
    SQL 作为关系数据库语言的标准，并且在 1986 年发布了 SQL 版本 SQL-86。1987 年国际标准组织(ISO) 也通过了这一标准。如今，所有的数据库都支持
    SQL。因此，使用 SQL 编写 Java，必须使用通用的 SQL 语言。


