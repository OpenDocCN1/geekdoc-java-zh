  md: '# 第1章


    # Java 开发环境和程序设计初步


    通过本章的学习，读者将初步了解 Java 语言产生的历史背景和工作原理；掌握 Java 语言作为一门面向对象语言的基本编程思路；初步接触 Java 编程的两种形式，Java
    application 和 Java applet；掌握 Java 程序的结构，学习阅读 Java 帮助文档，并安装 Java 开发环境；最后掌握 Java
    程序开发工具的使用。


    # 1.1 Java 语言产生的历史


    Java 语言产生于 C++语言之后，是完全的面向对象的编程语言，它充分吸收了 C++语言的优点，继承了程序员所熟悉的 C 和 C++语言的许多语言特性，同时去掉了
    C++语言中指针、申请和析构等可能影响程序健康的部分，可以说 Java 语言是站在 C++语言这个“巨人的肩膀上”前进的。


    任何事物的产生都有必然的原因和偶然的因素，Java 语言的出现也见证了这一点。


    1991年4月，美国 Micros Systems 公司的一组员开始了一个号为“Green”的工程，Green 工程的目标是开发出一个适用于家用电器的控制系统。项目成员们已经意识到，家用电器使用的处理器具有统一的架构，消费电子种类种类繁，除了
    PDA、机顶盒等，同一类电子产品所采用的芯片和插件系统也不相同，造成了跨越平台的问题。为了方便开发，我们需要一个与平台无关的开发环境。


    Sun Microsystems 的小组在起初考虑了 C++语言，但是研究表明，对于消费电子产品而言，C++语言过于复杂庞大，而且内存也不人愿意，解决这些问题需要花费很多的精力，而且开发效率不易。但是，James
    Gosling 和 Bill Joy 带领的研究小组执着设计并开发一种名为 Oak 的语言。传奇说起名为 Oak是因为在他们设计这种语言的结构时，另一棵橡树树（Oak）映入了他们的眼帘，后来又不再放弃这个名字，因为对于较小的一种语言来说这个名字足够了。


