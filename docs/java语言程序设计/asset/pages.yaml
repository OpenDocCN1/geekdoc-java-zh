  md: '# 2. start()


    调用完 init() 方法后，系统将自动调用 start() 方法当用户离开包含 apple 的主页后再次返回时，或者当浏览器从图标状态恢复为窗口时，系统都会自动调用一次
    start() 方法

    和 init() 方法不同，start 方法是在 apple 的生命周期中被多次调用，该方法是在 apple 的主体中，可以执行-一些任务，或者是在启动后的线性未执行的任务，如循环播放等。


    # 3. stop()


    和 start() 方法相对应，当用户离开 apple 在页面上或者是浏览器变成图标时，系统就会调用 stop() 方法，因此该方法也是可以被多次调用的。

    stop() 方法起到这样的作用：当用户在当前时刻不十分关注 apple 时，停止一些消耗资源的工作，这样就可以提高系统的运行速度，且系统会自动调用该方法，并不需要人为干预。若编写的
    apple 中不涉及及视频等多种媒体，一般不必需要考虑。


    # 4. destroy()


    当用户关闭浏览器时，系统就会调用 destroy() 方法，应该注意 stop() 方法和 destroy() 方法的区别。

    本节代码部分中的 paint(Graphics g) 方法执行时间是在 init() 方法结束后，start() 方法启动之后，就用此方法画图。另外，每次需要重新绘制
    apple 时，也将调用此方法。其代码如图 1-11 所示。


