    # 2.8.2 while 结构


    while 结构主要实现“当”循环，即循环条件成立时，重复执行循环体，否则退出 while 结构进行条件判断，然后决定是否执行循环体格式：


    ```

    while (conditionalexpression)

    ```


    条件判断表达式可以是一个布尔变量，这时，为了避免死循环，可以在循环体内增加条件判断，用 break 语句结束循环结构。


    while 循环的执行流程如图 2-20 所示。如求 1 到 100 的和：


    ![](img/313b79d057fc8eb887843de679d8acad_61_0.png)


    ```

    int count = 0; while (count < 100) count++;

    ```


    对于初学者，使用 while 运行时有一个陷阱：while 循环体的后面跟着一个分号。比如下面的程序片段：


    ```

    int count = 0; while (count < 100); count++;

    ```


    如果不小心看这段代码，觉得这段代码并没有任何问题，执行了 count 从 0 到 9 输出，但细看一下这个程序，难发现 while 循环的条件表达式后面跟了一个分号。在
    Java 程序中，一个单独的分号表示一个空语句，不做任何事情的空语句，这意味着这个 while 循环体是空语句。空语句作为循环体并不是最大的问题，问题是 Java
    反复执行这个循环体时，循环条件的表达式没有任何改变，就成了一个死循环。 后面的代码块与 while 循环没有任何关系。


    图 2-20 while 循环流程'
