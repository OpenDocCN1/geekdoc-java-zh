    \    Zi z2=new Zi(\"越六\");\n\n    }\n}\n```\n\n# ## 5.2.6 方法的重载 (overload)\n\n\
    方法的重载（overload）是实现多态性的重要手段。重载的含义是指在一个类中使用同名的方法定义，但每个方法有不同的参数，以实现相同的功能。\n\n这些同名方法之间所带的参数个数、参数类型、参数排列顺序的不同差异来区分。参数的返回类型不能构成重载，如果两个方法的签名相同，即参数的类型和排列顺序都一样，而仅仅是返回值不同时，Java\
    \ 编译器将提示错误信息。\n\n在 Java 中，方法的名称、类型和格式构成了方法的签名，编译器根据方法的签名来调用方法，签名在重载时必须不同，因为方法可以没有返回。\n\
    \n在很多情况下使用重载非常方便。例如，在数学方法中使用绝对值函数，按照基本数据类有 byte、short、int、float、double 六种，在定义方法时，使用六个不同名称来区分它们，在使用中使用既不好记忆，还比较麻烦。这时使用一个名字\
