  md: '# Java面向对象教程——类和对象      第4章


    类的类（subclass），又称派生类。由于类继承了父类的属性（仅是属性），与类继承父类的属性和行为有所区别。


    如电视机，作为电视类，黑白电视和彩色电视都是电视的子类；而投影黑白电视又是黑白电视的子类。意思是类之间可以派生自己的类，存在层次关系的。以成为电视类后，它就有了图像、视频、声音。而彩色电视和黑白电视机是从电视机继承来的，同样也有图像，可以选择颜色、声音，所以类继承了父类的属性和动作。


    事实上类可以有自己的属性和动作，否则的话，就不必要继承父类的属性和动作，直接使用类就行了。继承的优点：继承实现了代码的重用，加速了编程进度，提高了效率，减少了代码的冗余。


    C++多重继承，一个类可以继承多个类，对对象的处理变得异常复杂，通过接口（interface）可以实现多重继承。接口的定义更加简单，方便使用，且只限于继承，它使得相似的类具有相同的方法。


    3）多态


    多态是OOP的第三个特征

    所有多态，是指在类定义的属性或动作被特定子类覆盖之后，可以具有不同的数据表现出不同的行为。通过同一个属性或动作在泛类以及各个特定子类中具有不同的实现。例如几个几何形状的“画图”方法，在“圆形”类和“多边形”类中同样可以存在，它们都是是“圆形”类或“多边形”类的方法在子类中“画”的功能是不不同的。

    实现态的方法


    ①通过对父类方法的重写（override）实现多态

    父类的方法在子类中可以同名，并重写代码。由于子类与父类的方法却不能完全一样。


    那么，如何区分子类中与父类中的同名方法呢？因不同的方法存在不同的类中，所以只需要在调用时，指定是哪类的类即可。


    ②同类中允许方法重载（overload）实现多态

    在一个类中，可以定义多个同名的方法。这些方法的最终目的是基本或完全相同，只不过根据具体的参数来决定使用哪一个方法。取形状的面积时，可以定义多个方法，圆形的面积、矩形的面积、三角形的面积等，目的都是取面积的。但是我们必须清楚，取某种形状的方法代码是不同的。


    如何区分同一类中同名的方法呢？因为是在同一个类里，不能用类来区分。可以采用的方法的方法相同，需要通过参数的列表来区分，即使用的参数个数、数据类型和排列顺序来区分，决定调用哪个方法。例如图形类，可以定义多个draw()方法，画绘制各种形状的图形（圆、矩形、三角形、其他文字信息等）。


