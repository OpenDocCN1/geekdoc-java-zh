    Swing 提供了许多类型的按钮 Java 中所有的按钮，包括复选框、单选按钮，甚至菜单项，都是从 AbstractButton 继承来。这里介绍基本的按钮
    JButton 是一个组件，它有自己的小调，作为我们更新过程的一部分部分会自动被重绘，也就是说，我们不需要自己绘制一个按钮或者其他类型的标签，只要把它们放在容器里，它们可以自己绘制自己的构造方法把标签加入容器中。


    JLabel 用文字或图像信息，并可以指定信息的位置 JLabel 实现了 SwingConstants，在第 11 章中定义了与位置有关的常量，它们有：


