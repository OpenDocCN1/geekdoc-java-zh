  md: "# 数据组的常见操作\n\n(1) 使用for循环遍历数组。\n\n在操作数组时，经常需要依次访问数组组中的每个元素，这种操作称为数组组的遍历。\n\n\
    【 3-2 】 遍历数组组。\n\n```\npublic class Demo {\n    public static void main(String[]\
    \ args) {\n        int[] arr = {1, 2, 3, 4, 5}; // 定义数组\n        // 使用for循环遍历数组的元素\n\
    \        for (int i=0; i<arr.length; i++) { // 通过索引访问元素\n            System.out.println(arr[i]);\n\
    \        }\n```\n\n运行结果如图 3-3 所示。\n\n(2) 数组取最值。\n\n在操作数组时，经常需要获取数组中元素的最值（最大或最小值）。\n\
    \n【 3-3 】 取最值。\n\n```\npublic class Demo {\n    public static void main(String[]\
    \ args) {\n        int[] arr = {4, 1, 6, 3, 9, 8}; // 定义一个数组\n        int max=arr[0];\
    \ // 定义变量用于记录最大值，假设第一个元素为最大值\n        // 通过循环遍历数组中的元素\n        for (int i=1; i<arr.length;\
    \ i++) {\n            if (arr[i]>max) // 比较arr[i]的值是否大于max\n                max=arr[i];\
    \ // 条件成立，将arr[i]的值赋值给max\n        }\n        System.out.println(\"max=\"+max);\
    \ // 打印最大值\n    }\n```\n\n运行结果如图 3-4 所示。\n\n(3) 数组排序。\n\n冒泡排序：比较相邻的元素，如果第一个元素比第二个元素大，交换它们的位置。\n\
    \n对每一对相邻元素做同样的工作，从开始的第一对到结尾的最后一次，最后的元素应该是最大的值。\n\n针对所有的元素重复以上的步骤，除了最后一个。\n持续每次越越少的元素重复上面的步骤，直到没有任何一对数字需要比较。\n\
    \n![](img/313b79d057fc8eb887843de679d8acad_76_0.png)\n\n![](img/313b79d057fc8eb887843de679d8acad_76_1.png)"
