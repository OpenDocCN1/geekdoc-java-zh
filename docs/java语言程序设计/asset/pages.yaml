  md: '# # Java 程序设计


    # ## 8.2.1 流的概念


    简单来说，流（stream）是通过固定的传输路径从源传递到目的地的字符序列。

    在流式输入输出中，Java提供了通过控制台、文件、内存甚至与内核等多种不同数据源或目的进行不同方式访问。通过过滤器的正确使用，提供了灵活的 I/O 操作 Java

    不仅提供了对文件的流式访问，还提供了随机访问和文件管理，如图 8-2 所示


    ![](img/313b79d057fc8eb887843de679d8acad_209_0.png)


    从前几章节介绍的实例我们可以看出，大部分分程序都需要使用数据（如用户通过输入的信息从那里获取数据（称为输入 input），然后对输入的数据进行处理，将处理的结果显示出来（称为输出
    output）。

    实际上这就是信息在流动，对程序而言流向的，有用的信息从程序中流出，像共享一个名字的水流一样，可以将某些内容从一地方带到另一个地方显而易见，程序流的信息不仅仅从磁盘存储，程序也可以从磁盘文本或网络接收信息；从程序流出的信息不仅是显示，也可以输出到文件或网络中你在
    Java 中可能会可能会要用不同的技术来实现一种不同的设备，事实并非如此，给给报告，在 Java 中在不同资源间可以使用相同的技术——一套流的通信系统未处理，不管是键盘、磁盘、光盘或网络（网页）。


    既然 Java 程序可以通过流的形式形成所有的输入和输出，通过输入输出系统与任何设备连接起来，所有的流具有相同的行为，也通过流操作对所有设备的输入和输出


    # ## 8.2.2 流的类型


    按照上面的程序输输出的方式，有两种基本的：


    +   * 输入流（input stream）：流是将数据从某个源向程序中流出

    * 输出流（output stream）：一种输出流是将数据从程序发送到某个的目的


    对于每一种流都具有特殊的功能。例如可以仅仅在输入流中读取数据，也可以仅仅向写入数据。因此，一个流（stream）是程序数据中所经过的一条路径。


    +   * (1)字节流（byte stream）


    许多类型的数据都可以用字节的形式来表示，包括字节数据、可执行程序、内核等'
