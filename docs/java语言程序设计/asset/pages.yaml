  md: '# Java编程设计


    MVC(model-view-controller)体系结构

    Swing 相比 AWT 的优势在于 MVC 的运用。在一个 MVC 用户界面中，存在多个通信通道：模型、视图和组件。模型是指定的逻辑表示，视图是模型的可视化表示，而组件指定了如何处理用户。当模型发生变化时，它会通知所有依赖它的视图，视图使用组件指定的唯一响应器。


    为了编写界面的设计，Swing 中组件和视图两部分合为一体。每个 Swing 组件都有它相关的分离模型和它对应的界面（包括视图和组件）。


    +   3. 可选取列表


    所有的 Swing 都实现了 Accessible 接口，提供对可访问性的支持，使得辅助功能像阅读器一样十分方便地从 Swing 中获取信息。


    +   4. 支持替代鼠标标识的操作


    在 Swing 组件中，使用组件的类的 keyBorderAction(Action) 方法，使用户可以通过操作来标识目标 GUI 的 Swing 组件。某些还为键盘操作提供了更方便的方法。这相当于对热热，使得用户可以使用替代标识进行操作。


    +   5. 选择标识


    对于组件可以设置一个或多个标识。Swing 提供了各种式的标识，能够建立组合边框或自己设计边框。空白边框可以增大，帮助布局管理器对组件中的组件布局。


    +   6. 使用标识(icon)


    与 AWT 的不同，许多 Swing 组件按钮、标签，除了文字外，还可以使用标识装饰自己。


    # 11.2 布局组织—布局管理器


    我们知道，在给出的很多例子中，可见的组件基本上都是简单地加入容器中，无法确定它们的相互位置。本节将介绍布局组件在容器中的几个布局管理器。


    Java 中，组件的摆放位置通过布局管理器来实现。


    java.awt 包包含了多个布局管理器：FlowLayout 类、BorderLayout 类、GridLayout 类、GridLayout 类和 BorderLayout
    类。


    # 11.2.1 BorderLayout 类


    BorderLayout 是一种简单的布局管理器。它将容器的空间简单地分成东、南、北、中五个区域，每加入一个组件时，应该明确在哪个区域中。如果某个区域没有加入组件，该区域将被其他组件占据。


    在容器中加入的组件超过五个时，应该使用其他的布局管理器。该布局是 Frame 类的...'
