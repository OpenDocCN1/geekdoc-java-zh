  md: "# 多线程机制\n\n# 第9章\n\n创建一个新的线程时，默认的优先级是5。如果多个线程处于绪状态，则具有高优先级的线程会在低优先级线程之前执行。\n\
    \n在当前线程的运行过程中，如果有较高优先别的线程准备就绪，则正在运行的较低优先别的线程将被被挂起；转到较高优先别的线程运行，直到结束后又回到原来被挂起的线程。\n\
    \n相同优先别的线程大致上平均划分 CPU 时间，轮询执行每一个线程。\n\n【9-6】通过设置线程的优先级，观察各个线程运行的先后顺序、不同优先级的线程占用的CPU\
    \ 时间。虽然低优先级的线程启动，但仍然是优先级的得到控制权而执行。\n\n```\n```java\nclass PriorityTime implements\
    \ Runnable {\n    int counter=0;// 计数器\n    private boolean flag=true;// 标志；启动线程\n\
    \    Thread t;// 声明对象\n\n    public PriorityTime(int p) {\n        t=new Thread(this);\n\
    \        t.setPriority(p);// 设置优先级\n    }\n\n    public void run() {\n       \
    \ while (flag) {\n            counter++; 计数器加1\n        }\n    }\n\n    public\
    \ void stop() {\n        flag=false;// 结束线程\n    }\n\n    public void start()\
    \ {\n        t.start();// 启动线程\n    }\n}\n```\n```\n\n```\npublic static void\
    \ main(String args[]) {\n    Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n\
    \    PriorityTime higher=new PriorityTime(Thread.NORM_PRIORITY+2);//高\n    PriorityTime\
    \ lower=new PriorityTime(Thread.NORM_PRIORITY-2);//低\n    lower.start();//启动\n\
    \    higher.start();//启动\nn\n```\n\n-239-"
