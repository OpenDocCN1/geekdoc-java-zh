    # 5.6.1 多态定义


    多态是继承、继承之后，面向对象的第三大特性。


    现实事物经常表现出多种形态，如学生，学生是一个类，一个具体的同学叫三三学生也是一类，即出现两种形态。


    Java作为面向对象的语言，同样可以描述一个事物的多种形态。如 Student 类继承了Person类，一个对象的对象就是 Student，是Person。


    多态的体现就是：父类对象（实现对象）就可以给这个子类（实现对象）引用赋值值，也可以给这个子类的类型变量赋值值。


    如果 Student 类是 Person 类的子类，一个 Student 对象可以赋值给 Student 类型的引用，也可以赋值给一个 Person 类型的引用。


    最终多态表现为父类引用变量可以指向子类对象。


    多态的前提是要有父类关系或者实现接口关系，否则无法完成多态。\在使用父类中使用引用变量调用的方法时，会调用子类重写后的方法。


    # 5.6.2 多态定义的赋值格式


    多态定义的格式，就是父类的引用变量变量指向子类对象。


    ```

    父类类型变量名=new 子类类型();

    ```


    变量名，方法名();


