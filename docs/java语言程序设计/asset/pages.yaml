  md: '# 多线程机制 第9章


    机制，CPU可为每个线程分配自己的部分时间，每个线程“感觉”自己拥有整个CPU，但CPU的计算实际上是在所有线程中并行的。

    线程机制降低了效率效率，无论设计、调度都是为了用户的方便，从中获得了巨大的。综合考虑，这种机制是有价值的。当然，如果原本安装了多个CPU，那么操作系统能够决定为不同的CPU分配哪些线程，程序的运行速度会更快（这些都需要操作系统以及程序的支持）。多线程和任务是充分发挥多处理器系统的一种最有效的方法。


    # 9.2.1 线程接口和线程类


    Java的线程是建立在Thread类和Runnable接口的基础上的，线程类封装了线程的执行，为了创建一个新的线程，多线程程序必须继承Thread或实现Runnable接口但不使用继承方法创建线程程序，则要用到java.lang.Thread类以及它的方法。


    Java提供一个实现Runnable接口，当一个程序不是Thread以外的派类时，就需要实现接口。


    +   1. Runnable 接口


    使用接口的原因：线程程序是由JavaApp扩展而来的，因为Java不支持多重继承，我们不能同时从Thread和Runnable类派生，所以使用接口提供的接口来解决了这个问题。


    这个接口有一个方法run()，所有实现Runnable接口的用户对象都必须实现这个run()方法，通过重写方法来定义具体的操作。

    Runnable接口中的这个run()方法是一个特殊的方法，它可以被运行系统自动识别和执行。也就是说，当程序被运行线程时，它所执行的操作就是run()方法中规定的操作。可以是，一个实现了Runnable接口的对象的实际上是在一个主线程的操作，而不是定义新线程的操作和执行流程，是实现多线程的应用的最基础和基本的工作之一。


    +   2. Thread 类


    Java的线程是通过java.lang.Thread类实现的。线程类中包含了Java程序中一个线程需要的属性和方法。当我们创建一个Thread类的对象时，一个新的线程就产生了。

    线程实例代表Java解释器的真正的线程，它可以启动线程、终止线程、挂起等


    (1) 构造方法


    Thread类的构造方法有七个，对应的操作如下三种：


    ```

    public Thread()

    public Thread(Runnable target) //为传递参数，实现了Runnable接口的target对象中定义的run()方法来初始化或覆盖创建线程对象的run()方法。

    public Thread(String ThreadName) //为创建线程对象指定了一个字符串名称以后使用。

    ```


    用构造方法创建新线程对象之后，这个对象中的有关数据被初始化，从而进入线程的生命的第一状态——新建状态。'
