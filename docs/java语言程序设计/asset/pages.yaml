    ABC\"\n字符串的操作\n\n# 2. 字符串处理\n\n对字符串处理时，可以使用 String 类提供的几个常用方法：\ncharAt(int index)\
    \ 获取指定位置的字符。\n如：\n\n```\nString str=\"You are the best\";\nc c=str.charAt(0);\n\
    system.out.println(c);\n打印\"Y\" 最左边的字符位置为0。\n```\n\nlength()查询字符串长度。\n如：int n=str.length();\n\
    下面是处理字符串的方法：\nboolean startsWith(String prefix); 判断字符串的前缀。\nboolean endsWith(String\
