  md: '# 第5章


    # 封装、继承与多态


    前一章我们详细介绍了面向对象编程的基本技术、类的定义、对象（类实例）的创建和引用方法、成员变量和实例成员等。至此，我们已经能够编写一些相对简单的 Java
    程序。本章将继续介绍面向对象的相关知识，包括面向对象三大特征（封装、继承、多态），各种特殊的使用、抽象类、终结类、以及接口的概念。后面章节开发 Java 程序打下良好的、面向对象的编程基础。


    # 5.1 封装的封装(encapsulation)


    在面向对象设计方法中，封装（encapsulation）指的是一种抽象性接口的实现细节封装，隐藏起来的方法。封装可以被视为一个保护屏障，防止类的代码和数据被外部定义的类代码随机访问。要访问该类的代码和数据，必须通过严格的类控制


    封装的主要功能在于我们能够修改已经实现的代码，而不用修改那些调用我们代码的程序段。合适的封装可以让程序更容易理解和维护，也加强了程序的安全性。


    # 5.1.1 封装实例


    一台电脑，是由 CPU、主板、硬盘、内存、电源等组件组成的，我们将这些组件装在一起就可以电脑。但是这些组件散落在外面，容易出现不安全的情况，我们使用箱子把这些组件装在里面，在机箱壳上留下一些接口。机箱其实封装了设备的细节，对外提供了接口和开关访问内部细节的方式。\思考：如果机箱不留下任何接口，会发生什么情况呢？


    +   - 封装原则

    - 将不需要对外部的内容隐藏起来。

    - 封装实现细节，提供公共方法对其访问。

    - 封装好处


    ![](img/313b79d057fc8eb887843de679d8acad_126_0.png)'
