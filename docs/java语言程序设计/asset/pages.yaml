  md: '决决定了组件占据分配的区域怎样调整组件大小，它对应四个重量：


    NONE(缺);不改变组件大小。


    HORIZONTAL: 组件横向扩展、占满的空间。


    VERTICAL: 组件纵向扩展，占满的空间。


    BOTH: 组件横向扩展，占满分配的空间。


    Anchor: 指定组件在分配空间中的位置，有九种取值：


    CENTER 分配区域的中心，组件位于分配区域的中心。


    NORTH 组件位于分配区域的北面。


    SOUTH 组件位于分配区域的南面。


    EAST 组件位于分配区域的东面。


    WEST 组件位于分配区域的西面。


    NORTHEAST 组件位于分配区域的东北角。


    NORTHWEST 组件位于分配区域的西北角。


    SOUTHEAST 组件位于区域的东南角。


    SOUTHWEST 组件位于区域的西南角。


    weights and weight 指定水平方向和垂直方向的权重(0 或 1)。当分配组件的区域比所需要的区域增大时，多出来的空间根据每一行(或列)的权重来分配。


