    # 11.4 菜单


    JMenu与JMenuBar组件是JFrame中开发菜单系统的主要模块。任何单类系统的基础都是JMenuBar，它是必要的，每个JMenu和JMenuItem都要用它构建。setJMenuBar()方法将JMenu附加到JFrame中，一旦将附加到JFrame中，就可以添加所有想要的菜单、子菜单和菜单项。


    JMenu与JMenuItem的级别看起来比较明显，通过层层次结构，可以知道JMenu是JMenuItem的类。在表面上，它们的类别是相同：JMenu包含其他JMenuItem和JMenu；JMenuItem在选中时触发菜单。


    JMenuItem也支持快捷键的概念。对于读者的大多数应用程序来说，Swing应用程序允许用户按下 Ctrl+ (某个键)触发一个操作，就像菜单中快捷键本身一样。例如剪切和粘贴的快捷键Ctrl+X和Ctrl+V。


