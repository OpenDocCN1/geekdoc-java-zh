  md: '# 多线程编程


    任务环境中，线程是最小的执行单位。这意味着一个程序可以同时完成多个任务的功能。


    多线程意味着一个程序的多个特定语句可以同时去执行在同一时间内运行。与进程相似的是，线程是一段完成特定功能的代码，程序中单顺序的运行控制。与进程不同的，同类的多线程是共享同一内存空间和资源，程序本身的数据访问通常带有微弱的寄存器数据，以及一个程序执行时使用的栈。所以系统可以产生一个线程，或者在多个线程之间切换，负载要比进程小多，因此如此，线程被称为轻级（light-weight
    process）。


    使用多线程可以编写出最大利用的高效率，因为 CPU 空闲时间最低，这对于 Java 交互的互网络环境至关重要。网络的数据传输速率远比计算机的处理能力，本地文件读取速度远比
    CPU 的处理的速度，在传统的进程程序中，用户必须等待每一个任务的完成以后才能执行下一步，使 CPU 浪费空闲时间。多线程可以使用充分利用这些空闲时间。


    # 9.2 进程和线程的关系


    我们知道，对于一个完整的应用程序，main() 方法是程序执行的初始入口点，然后按照顺序实例化相应的对象并对类定义的成员方法后，直到程序完成功能后结束后或发生异常时，由
    JVM 运行环境，收回无用的内存。


    因此，应用程序应该有一个运行的初始入口点、一个代码执行序列和一个程序出口，并在时序操作系统中，每一个时刻都有一个执行单元在处理 CPU 执行序列。


    Java 语言线程的概念是程序的执行过程序列类似，它也包括一个程序入口、一个出口以及一个代码执行序列。


    但是，Java 线程与应用程序的区别是线程是程序执行的一部分，线程不能独立运行，必须由应用程序启动或者终止。


    Java 语言的线程并不是程序的多个多个语句同时执行，也不是多次启动同一个应用程序，而且在同一个程序内部执行多个线程。Java 程序通过线程控制多的任务并发执行，改进了程序的运行状态。


