    为此，抽象类和抽象方法可以总结如下：

    (1)如果一个类中声明了抽象方法，则这个类必须被声明为抽象类。由于抽象类不能直接

    实例化，所以就不能用 new关键字来创建。抽象类只能作为父类使用，由它派生的

    子类必须实现所有的抽象方法，才能创建实例。

    (2)抽象方法的实实在抽象父类派生的子类中重写抽象方法，增加方法，使之成为

    一个非抽象方法；在重写方法时不需要 abstract 修饰。这种实现也是可以的，也就是方法

    只有一对“||”，方法中没有分号。

    (3)如果子类没有实现父类中所有的抽象方法，则子类也必须成为一个抽象类，

    也就是说子类也必须使用 abstract 修饰。

    (4)可以将没有任何抽象方法的类声明为抽象类，但要避免这个类直接创建任何的

    对象。


    (5)构造方法、静态方法、私有方法、final方法不能被声明为抽象方法。


