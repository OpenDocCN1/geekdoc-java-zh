    ```

    Vector()

    Vector(Collection c)

    Vector(int initialCapacity)

    Vector(int initialCapacity, int capacityIncrement)

    ```


    第一种形式，构造函数中没有参数，按照默认值，向量的初始容量为10，空间动态

    增长为0。

    第二种形式，以 Collection(集合)的实例、c为参数，使得向量类默认值 Collection 元素

    数量和内容。

    第三种形式：初始向量的剩余空间为 initialCapacity。


    第四种形式，在提供初始向量空间时，还需要每次添加向量元素的个数。

    创建向量对象的一种格式：

    Vector object=new Vector(int initialCapacity, int capacityIncrement);

