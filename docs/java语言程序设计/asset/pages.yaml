  md: '# 第 10 章


    # 数据库操作技术


    # 10.1 JDBC 技术与 ODBC


    本章将介绍关系型数据库的概念及常用的关系型数据库，掌握 JDBC 应用程序中的 ODBC 数据源的配置方法。熟悉 java 包中与 Java 数据库技术有关的对象和接口，并利用相关程序编写基于
    JDBC—ODBC 方式的数据访问程序，实现动态操作数据库。


    数据库(database, DBMS) 是相关信息的集合，数据库管理系统(database manage system, DBMS) 是提供用户的一种机制，用于对数据库中的数据进行检索、添加和修改。DBMS
    有很多种，常用的是 SQL Server 和目前许多数据库产品有 Oracle、Sybase、DB2、Informix 等，它们于早期的单机数据库系统。这些类型数据库的应用多依赖于
    Client/Server 和 Browser 的多层体系结构。对于 Java这种网络应用程序都要涉及对数据库的操作，因此 Java 对数据库的访问是其重要的功能之一。


    是否，在客户端上设置好数据库管理事务有大事了？答案是否定的？若是否定的，我们不需要要求用户去设置数据库管理事务的知识；此，还是需要在客户端上有友好的界面的应用程序中使用计算机即可。仅可以通过将数据库管理系统、常见的
    SQL(structured query language)安装到客户端上，对客户来说基本上没有任何作用。


    再者，我们知道，并不是数据库使用的合适的方法，没有丰富的经验很难掌握各种数据库的操作，要求每个程序设计者熟悉各种数据库是不现实的（因为这将花费费量的时间），也是无意义的。


    为让我们学会数据库开发应用程序的程序，用户通过更友面的应用程序与计算机交互，不再去学习更专业的数据库知识，通过连接数据的查询（检索），添加与使用


