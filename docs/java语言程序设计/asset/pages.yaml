  md: '# ### 4.5.3 对象的清理


    Java 运行时，系统（run time system）通过垃圾回收周期性释放不再占用的内存，完成对象的清理。


    当一个对象没有被垃圾收集的引用时（当前的栈帧对对象的作用域或把对象的引用值置 null，当 p=null 时），该对象就是一个无用的对象。


    Java 垃圾回收自动内存管理，操作员不再需要跟踪每个对象的创建。垃圾回收作为一项运行时，在内存不足或程序运行过程中调用 System.gc() 要求进行垃圾回收，垃圾回收系统与系统同步运行，否则在系统空闲时运行。


    此外，在类的定义中，可以用于对象销毁的 finalize()，在 Java 的对象被回收之前，会自动调用对象的 finalize() 方法，使它释放自己使用的资源。

    finalize()类似于 C++的析构函数。


    Java 中并不使用 finalize() 来清理对象并回收其占用的内存，当 null 告诉它可以通过 free() 释放内存，当 C++ 中通过 delete（释放）内存时，易造成系统崩溃。


    # ### 4.5.4 内存模型


    Java 把内存分为两种：一种栈，另一种是堆。


    +   1. 栈


    在方法定义的基本类型变量和引用变量都是方法的栈内分配，当一对花号引用同一个变量时，Java 栈中为这个变量分配内存空间，当超过变量的作用域后，Java 会自动释放该变量的栈内内存。


    +   2. 堆


    堆内存用于存放创建的对象和数组。在堆中分配的由 Java 垃圾回收机的自动回收器管理。在堆的产生过程中，一般在堆中的变量中分配，也就是将堆中对象的首地址赋值给栈中的变量。栈中这个变量就是我们先声明的对象变量，它用来存储一个对象的地址，从而使用一个一个真正的对象，亦称为引用变量。


    因此当给对象赋值时，在栈中进行赋值。引用变量在程序运行到该作用域后会被释放，而对象本身存储在堆内存中，即使程序运行到该代码之外，对象和数组在没有引用指向它们时仍然存在，并在某个不确定的时刻被垃圾回收器回收。


    当一个对象被创建时，会会中的各种类型的成员变量自动初始化。对于数值型变量初始化为 0；对于字符变量初始化为 ''\u0000''，即空字符；对于布尔类型初始化为
    false；对于其他的类型变量均初始化为 null，即空值。


    以创建和使用 Person 类的实例为例，分析它的内存模型。对象的创建和使用在 main 方法中。


    (1) 声明变量


    Person p;

    在栈内分配空间中，为变量存放一个地址，此时地址指向任何数据，内存模型如图 4-14 所示。'
