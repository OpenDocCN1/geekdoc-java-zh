    # 5.5 接口 (interface)


    接口是实现类多重继承的结构。接口抽象的概念更深入了，我们可以把

    看作是一种特殊的抽象类，接口用来表示一类必须做什么，而不是规定它如何做。因

    此此类用来指定的协议(protocol)。


    Java 和 C++不同，它支持类的多重继承，即使能继承多个直接父类，一个类只能

    有一个直接父类。JavaAPI 将接口和类分开，由于 Java 的接口中没有具体的实现细节，也

    就存储空间没有关联，可以将多个类合并在一起，目的是实现类多重继承的

    功能。


