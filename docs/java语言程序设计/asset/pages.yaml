    需要注意的是：Java applet的生命周期共有四种状态（初始化、运行、停止和消亡状态），其分别对应四个方法：init()、start()、stop()和destroy()。


    +   1. init()


    当创建 Java 且第一次支持 Java applet 的浏览器加载时，就会执行 init() 方法。在Java applet 生命周期周期中，该方法只运行一次，因为可以利用这一点在
    init() 方法中进行一些只需一次的初始化操作，例如变量的初始化。'
