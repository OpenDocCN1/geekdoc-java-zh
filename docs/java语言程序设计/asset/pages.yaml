  md: '# 3. 结构中立并可以移植


    网络上充满了各种不同类型的机器和操作系统，使用 Java 程序在网络中的任何地方运行，Java 编译器生成了与结构无关的字节码文件。任何种的计算机，只要其处理器和操作系统上有
    Java 运行的环境，字节码就可以在该计算机上运行。即使是在单一系统的计算机上，结构中立也是是非常重要的。随着处理器架构的发展变化，各种版本的程序在不同的处理器上运行，使得开发能够在在任何平台上工作的软件变得是不可能的。而使用
    Java 将同一版本的应用程序可以运行在任何的平台上。


    结构中立使得 Java 系统具有可移植性。Java 运行时系统可以迁移到不同的处理器和操作系统，Java 的解释器是 Java 语言实现的，解释器就是 Java
    语言和 C 语言的相似，这样可以方便便于进行移植。


    # 4. 高性能


    虽然 Java 是解释执行的，它仍然具有很高的性能。在某些特定的 CPU、Java 虚拟机可以快速转换为机器进行执行；而 Java 字节码的设计是针对机器器的转换，实际转换相当于编译。自动的寄存器分配与编译器对字节码的优化，可使得代码质量的提高。通过
    Java 虚拟机的“即时执行（just in time）”技术的出现，使得 Java 的执行速度有了更大的提高。


    # 5. 解释器：编译也许是可能的


    为了现场执行，Java 设计为解释执行，字节码中包含了许多编译时生成的信息，使得连接更加简单。而多线程程序可以在运行时同时处理不同的任务，处理不同的事情。在多线程制中，不同的线程处理不同的任务，互不干扰，也不会由于某一事务处于等待状态而影响它的执行，这样就可以容易地在网络上的实时交互。在执行过程中，可以动态加载各种类，这一使得使得非常适合网络上的连接，同时也有利于软件的开发，即使更新不需要重新编译就可以使用这一套灵活的应用程序。


    Java 语言是面向对象的。分布式的、解释的、健壮的、安全的、结构中立的、可移植的、性能优异的、多线程的、动态的语言。


    # 1.3 Java 工作原理


    # 1.3.1 虚拟机


    Java 虚拟机是软件编写的计算机，可以在任何处理器上（无论是在计算机中还是在子设备上）安全并且兼容地保持存在。在 class 文件中的字节码。Java 虚拟机的“机器”存在，class文件中，有时也称为字节码文件。Java
    程序的跨平台是指字节码可以在任何有 Java 虚拟机的计算机或电子设备上运行，Java 虚拟机中的解释器将字节码文件解释为特定的机器进行执行。Java 程序需要通过编译器编译和执行过程如图
