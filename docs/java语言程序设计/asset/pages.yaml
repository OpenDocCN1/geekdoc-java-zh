  md: '# 第7章


    # 集合和泛型


    本章介绍 Java 中非常频繁的集合框架。首先通过实际引入集合框架并介绍它所包含的内容，然后详细讲解 ArrayList、LinkedList 和 HashMap
    三种具体的集合类，详细讲解统一的遍历工具器 Iterator，最后讲解用泛型改进集合的使用。在学习中应从整体上把握框架所包含的内容，并在具体学习时注意区分此彼此的不同，通过对比加深理解和记忆。


    # 7.1 集合框架概述


    # 7.1.1 引入集合框架


    前面我们学习了数组，充分体会到了数组的优势，即可以存储同一类型的数据。但是我们有了假设的需求，看看该如何解决？


    请做一个公司员工薪管理系统，要求完成：当有新人入职时，将该员工加入管理系统；当员工离职时，将员工从管理系统中删除。


    如果需要存储多个员工的信息，可以使用数组来实现，但是可以定义一个长度为50的员工类型的数组，存储多个员工对象的实例。但是用数组存在一些明显的缺点：


    +   1) 数组长度固定的，不能适应元素数量动态变化的情况。如果需要存储大于50的员工信息，则长度不足；如果需要存储20个员工信息，会导致内存浪费。


    +   2) 通过length属性获取的长度，无法直接获取数组中存储的员工


    +   3) 数组采用在内存中连续空间的存储方式，根据下标可以快速获取员工信息，但是根据索引查找时效率较低，需要多次比较。在频繁插入、删除操作时，同样效率较低


    另外例子：在存储员工信息的时候，分别存储工资和员工信息，两者都有一一对应的关系，员工号作为员工信息的键，可以根据索引获得员工信息。这仍然无法通过数组来解决。


    从以上分析可以看出，数组在处理某些问题时局限明显，而集合完全弥补了数组的'
