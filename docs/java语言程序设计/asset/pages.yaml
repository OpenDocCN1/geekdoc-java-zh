    # 5.4 终极类


    # 5.4.1 终极类


    所谓终极类，即不能有子类的类，或者说用 final 修饰的类。

    如果一个类的定义很完整，不需要再重建该类的类，这个类称为终极类在 Java

    中，定义为 final 类，通常是用来某种标准类，具有固定作用的类，如系统中有关

    网络的 InetAddress 类、Socket 类输入输出类等。

    终极类定义的格式：


    ```

    final class className(extends className) [implements interfaceList];

    ```


    由于安全的原因或 OOP 的考虑，有希望一些类不能被继承，如 String 类对编译器

    解释器的正常运行非常重要，不能轻易改变，定义为 final 类，保证 String 类型的唯一

    例如，下列代码编译出错，出错原因是 Germeral 类继承终极类 VeryGoodClass。


    ```

    //VeryGoodClass.java

    final class VeryGoodClass //一个终极类

    {

    }

    //VeryGoodClass 代码

    class Germeral extends VeryGoodClass //继承终极类

    {\}

    //Germeral 类代码

    ```


    子类不能从终极（final）父类继承。


    # 5.4.2 终极方法


    终极方法是指不能被子类重写的方法。

    如果某个父类的方法用 final 修饰，则子类中不能再出现该方法的定义，只能使用从

    类继承来的这个方法的功能。


    定义终极方法的目的：防止子类对父方法的修改，保证程序的安全性。

    终极方法定义格式：


    ```

    final datatype final methodName(parametersList)

    {

    ```


    ![](img/313b79d057fc8eb887843de679d8acad_145_0.png)'
