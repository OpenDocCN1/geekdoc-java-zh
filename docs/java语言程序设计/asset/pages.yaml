  md: "# Java程序基础 第2章\n\n# 2.8 循环（重复）结构\n\n循环结构是在指定一个条件下，反复执行某段程序（称循环体），直到条件不成立为止。\n\
    \n循环结构（repetition structure）分为 3 种：for循环、while（当）循环、do……while（到运行）\n\n循环语句通常包括以下\
    \ 4 部分：\n\n+   * 初始化语句（init_statement）：一条或多条语句，这些语句用于完成一些初始化工作，初始化语句在循环开始时执行一次。\n\
    \n+   * 循环体（body_statement）：这个部分是循环的主体，如果循环体允许，则这个代码块的花括号是可以省略的。如果这个代码块只有一行，则重复执行。\n\
    \n+   * 迭代语句（iteration_statement）：这个部分是在一次循环体执行之后，对循环条件值进行赋值之前，通常用于控制循环条件中的变量，使得循环在合适的时候结束。\n\
    \n上面 4 部分只是基础的分类，并不是每个循环中都非常频繁的拆出了这 4 部分。\n\n# 2.8.1 for 结构\n\n与C/C++语言相同，是在已知循环次数的条件下使用的循环，即循环的初始值和结束值在循环执行前是确定的。for循环是灵活、方便的一种循环结构。\n\
    \n格式：\n\n```\nfor (初始化循环变量，如 int i=0; ... {\n\t//循环体 circlebody\n}\n```\n\n用于初始化循环变量，如\
    \ i=0；\n\ntermination：用于判断循环的结束条件，如 i<=10；\n\niteration：累加（减），如 i++;\n\nfor循环的执行过程：\n\
    \n先初始化循环部分赋值，可以同时给多个变量赋值，中间用逗号分隔。这部分在在循环开始时执行一次，以后不再使用。\n\n接着根据逻辑条件判断。条件成立时执行循环体，之后循环变量的值更新（增或减），进入下一循环；条件不成立，结束了循环，跳转到该结构下的程序。\n\
    \n除第一次循环外，之后的每次循环都是先执行，后执行 termination。对于for循环而言，循环条件比循环体多执行一次，因为最后一次执行循环条件为false，则将不再\n\
    \n执行循环体。\n\n![](img/313b79d057fc8eb887843de679d8acad_58_0.png)"
