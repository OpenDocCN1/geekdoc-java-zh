    commit(); 将定义的数据库事务过程提交数据库系统。

    createStatement(); 创建 Statement对象实例。

    prepareStatement(); 创建PreparedStatement对象实例。

    rollback(); 将数据库访问的事务回滚。


    可用Connection对象实例创建Statement或PreparedStatement对象。


