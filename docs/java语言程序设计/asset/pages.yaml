  md: "# Java 自动调用\n\n# 2. 系统的自动调用的特点\n\n系统自动调用的特点是，方法定义好以后，不需要在程序里书写调用方法的语句。\n事实上，也不可能知道什么类型的方法在何时被执行，完全由系统控制，只有系统本身知道什么时候该调用方法，如单击命令按钮，不可能事先安排好时间顺序\n\
    再次，一个图形Applet 上有多个按钮，用户点击按钮的先后顺序在程序中是无法预先设定好的。是不管何时，单单击的按钮应该应该执行相应的代码，由程序本身决定何时调用方法（只需考虑机会即可）。\n\
    \n# 4.3.3 实参与参数的传递方式\n\n先看一下实参和参数的概念，然后讨论参数参数传递的方式。\n\n+   1. 实参和参数\n\n一般我们把调用语句中的参数形为实参（实际参数），实参可以是常量、变量、对象或表达式，并把方法声明中的参数形为形参（形式参数）或虚参（虚拟参数）。\n\
    方法调行的过程其实就是将参数的数据传递给方法的形式，以这些数据为基础，执行方法体，所要实现的功能。在实参和参数的结合上必须保持“三一一致”：实参与参数个数一致，对应数据类型一致，对应顺序一致（实参与参数传递顺序一一一一对应数据）。\n\
    建立了实参和参数的概念后，参数的传递方式相对来说容易理解了。先看一个关于交换两个变量的值的。\n\n```\n【示例4-4】使用不同方法交换两个变量的值。\n\
    public class MethodExample {\n    int n1, n2; // 定义方法者的实际参数值n1, n2\n    /* 下定义方法swap_value,该方法的功能是交换变量n1,n2的值\
    \ */\n    int n2; // n2的值由实参的值传过来\n\n    public void swap_value(int n1, int n2)\
    \ // 定义方法方法接收两个形参数\n        // 按值传递\n        int n0; // 定义方法局部变量n0\n        n0=n1;\
    \ // 将n1的值赋值给n0\n        n1=n2; // 再将n2的值赋值给n1\n        n2=n0; // 最后将n0的值赋值给n2\n\
    \    }\n\n    public void swap(MethodExample n) // 按引用传递\n        int n0; // 辅助方法变量n0,\
    \ 交换成员变量n1,n2的值\n        n0=n.n1;\n        n.n1=n.n2;\n        n.n2=n.n0;\n  \
    \  }\n}\n```"
