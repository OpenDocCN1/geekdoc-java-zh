  md: '# Java 程序设计基础 第二章


    # 2.5 Java 程序规范


    # 2.5.1 Java 类结构


    一个完整的 Java 程序应该包括以下几类：


    import 语句；该部分可以有若干 import 语句或者没有，必须在所有的类定义之前。


    publicClassDefinition；公共类定义部分，至多只有一个公共类的定义，java 语言规定的 Java 程序的文件名必须与该类名完全一致。


    ClassDefinition；类定义部分，可以有 0 个或多个类定义。


    InterfaceDefinition；接口定义部分，可以有 0 个或者多个接口定义。

    例如，一个 Java 程序可以是如下结构，该程序名为 HelloWorld.java。


    ```

    package java; // 告诉编译器本程序中所使用的所有类，文件放到 java. 包下

    ```


    ```

    import java.awt.*; // 告诉编译器本程序中所用到用户定义的 java. 包

    ```


    ```

    public class HelloWorld { // 公共 HelloWorld 的类，名字与文件名完全一致

    ```


    ```

    class FirstClass { } // 第一个类的类的定义

    ```


    ```

    interface FirstInterface { } // 定义一个接口

    ```


    package 语句：由 Java 编译器为每个类创建一个源文件，且文件名名与类名相同，由于同名的类可能有发生冲突。为了解决这个问题，Java 提供包来管理命名空间，实际中使用一个唯一名称来限制。


    import 语句：在源程序中除了 java 包之外，每一个包包含的类，如果是自己已经定义的类，都必须使用 import 语句，以告知编译器在编译时要找到对应的类文件。


    例如，示例中的 java.awt 是系统的包，newcenter 是用户定义的包。比如在程序中包含了 Button 类，而 Button 属于 newcenter
    包。在编译时编译器将从 java.awt 中查找 Button，而awtClass 是先定义的环境变量，或许可以定义为：; d = \$sdk1\class；


    classpath 也可以作为类路径，需要注意的是，在 classpath 中往往包含多个路径，用逗号分隔开。


    在编译过程中查找类，从环境变量 classpath 的第一个目录开始往下找。在查找 Button 类时，编译器，然后从环境变量 classpath 的第二个目录开始查找。如果要从一个包中引入多个类，则在包后面加上“*”。

    在程序中使用了包中自己定义的包中的类，例如在程序中使用 newcenter 包中的 HelloWorld 类，newcenter 包对应的路径是：javaproject/

