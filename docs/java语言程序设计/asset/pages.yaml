    # 5.4.3 终极变量


    final 修改变量时，变量的值在整个程序中是不能改变的，它就是一个常量。它常与

    static 一起使用。


    用 final 修饰变量时，应该给出变量的值，即在定义变量时赋值，不能在后赋值。

