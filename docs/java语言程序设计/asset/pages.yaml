  md: '# 第6章


    # 异常处理机制


    我们知道，错误(error)在编程中是不可避免的，如操作系统发生的错误（系统崩溃、系统死锁等），电源产生的错误等。在 Java 中我们可以将错误分成两种类型：


    一类是 Error，在 Java 中用 Error 表示，意味着发生了 JVM 监测到的严重错误，导致 JVM 无法运行。这种错误程序是不能处理的，因为程序无法捕捉到它，也就无法相应的处理措施。


    另一类在 Java 中称为异常(exception)类，是可以恢复的。这种错误程序能够捕捉，因此程序中可以采取适当的措施进行处理。本章讨论 Java 程序设计异常处理的内容。


    # 5.1 异常的处理方式


    在面向对象的程序设计中（如在 C 语言中），传统的办法是将错误的检查代码放在在相应的程序段中，使用if条件判断语句来进行判断。对于一个可能发生的错误判断，通常使用多个if语句，就用go、return等语句，对于一个项目而言，就难以维护错误的程序。程序设计通常需要预先可能会出现错误的情况，并且对出现的错误进行处理。


    但是我们也应该考虑到，错误并不是经常发生的。程序执行到该段时，总是要进行检查，导致 CPU 时间的浪费，降低程序运行的效率，并且程序的维护性变差，因为这种方式是将错误处理和正常的处理代码交交在一起的。


    如果从编译和运行时考虑，错误可以分成两种：


    一种编译错误。是指语法上存在问题，使得程序不能通过编译而产生目标标识，这种错误由编译本身检查出来。


    另一种是运行错误。程序在语法上没有任何问题，并可以通过编译生成目标标识。在程序的运行过程中仍然可能产生错误。而运行错误可以分成运行时错误和逻辑错误两种。


    系统错误是指用户程序产生的错误和操作系统时，可能导致系统的崩溃，如死循环、崩溃等，即 Error 错误。'
