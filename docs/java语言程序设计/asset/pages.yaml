  md: "# Java 程序设计\n\n从几个简单例子开始\n\n# ## 2.10.1 从控制台读取半径是固定的\n\n在例 2-1 中，源代码为了使用不同的半径，必须修改源码后重新编译。很很不方便\
    \ 所以我们可以使用 Scanner 类来控制输入\nJava 使用 System.out 表示标准输出设备，用 System.in 表示标准输入设备。默认情况下，输出设备是显示器，输入设备是为了完成控制台输入，只需使用/println\
    \ 方法来可以在控制台显示某值或字符串。Java 并不直接支持控制台输入，但是可以使用 Scanner 类创建的对象的对象，以读取来自 System.in\
    \ 的。如下：\n\n```\nScanner input = new Scanner(System.in);\n```\n\nnextLine(System.in)\
    \ 表明创建了一个 Scanner 类型的对象。语法 Scanner input 变量是一个 Scanner 类型的变量。行的 Scanner input\
    \ 创建了一个 Scanner 对象，并且它的引用值赋值给变量 input。对象可以调整它自己的方法，通过调用它自己的对象的方法让这个对象完成某个任务。你可以通过例\
