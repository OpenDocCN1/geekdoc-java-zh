    # 2.5.2 Java命名


    软件开发是一个集体体的过程,程序员之间的代码是经常需要交换阅读的;因此,Java程序会有一定定的命名规则,主要是为了提高Java程序的可读性。


    +   - 包名：是全小写的,中间可以用下划线分隔,例如 java.awt.

    - 类名：首字母大写,通常由多个单词合成一个类名,要求每个单词的首字母也要大写,例如 HelloWorld

    - 接口名：规则与类名相同,例如 Interface

    - 方法名：往往由多个单词合成,一个单词通常为动词,首字母小写,中间的单词首字母也要大写,例如 balanceAccount,isPressed

    - 变量名：全小写,一般为名词,例如 length

    - 常量：基础数据类型的常量为全大写,由于是由多个单词构成,可以用下划线隔离,例如int YEAR,WEEK_OF_MONTH;如果是对象类型的常量,则大小混合,由大大大写每个单词拼接


    # 2.5.3 Java帮助文档


    Java中所有的类的介绍都存在Java帮助文档中;程序员在编程过程中，必须阅读该帮助文档;让系统理解类的功能、方法、成员变量等信息以后，能够更好地编程帮助文档可以到Oracle公司官网注册在线阅读(URL:http://docs.oracle.com/java/8/);同时,Java开发工具包(JDK)提供了javac,jav,
    javadoc,appletviewer等命令,如图2-12所示,在Java帮助文档中也对此进行了详细的描述。


    # 2.5.4 Java注释


    +   - 单行注释：用于方法方面(主方法)

    - //注释内容 *

    - 多行注释：用于方法方面(主方法)

    - /* 被注释的内容 */

    - 文档注释：用于类和方法之之前

    - /** 被注释的内容 */'
