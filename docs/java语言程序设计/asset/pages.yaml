    面向对象是一种程序设计语言，或者是一种程序设计规范 (paradigm)，其基本思想是使用类、继承、封装、消息等概念来进行程序。我们从客观世界中存在的物（对象）出发构建软件系统，并在系统中利用人类的自然思维来开发。开发一个软件是为了解决某些问题，这些问题所涉及的业务范围接近软件的问题。其应用领域不仅限于实现，还有许多架构和智能工具。


