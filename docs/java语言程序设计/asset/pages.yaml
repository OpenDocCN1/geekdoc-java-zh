    \ DBMS 必须支持 ODBC，应用程序能够发布 ODBC 命令，而 DBMS 能够应用这些命令。\n\n既然使用 ODBC 可以操作任何类型的数据，而不必得熟悉相同格式的文件和数据库函数，还要讨论\
    \ JDBC 吗?\n\n这是因为 JDBC是非字段的，不同的操作需要安装相同版本的 ODBC，使得程序的不可移植性。为了解决可移植性问题，在 Java 中就需要跨平台的、数据库接口，就是\
    \ JDBC (Java database base connectivity)。\n\n# 10.1.2 JDBC\n\n在 Java 中有一个程序套件，sql，为用户提供数据库结构化查询的语言，由于它数据库应用程序开发者提供了一个标准的应用程序接口。通过\
