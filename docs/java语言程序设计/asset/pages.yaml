    # 1.4 Java 环境 JDK


    # 1.4.1 Java 平台


    Java不是编程语言，还是一个开发平台，Java技术给开发者提供了许多工具：编译器、

    解释器、文档生成器和打包工具等。同时，Java还是一个程序发布平台，有两种

    种“发布环境”。首先，Java运行时环境（java runtime environment，JRE）包含了完整的类

    组件；其次，许多的浏览器提供了Java解释器和运行时环境。我们把Java平台

    分成JEE、JSE、JME三个平台，针对不同的市场和设备进行定位。JEE是java2

    enterprise edition，主要是java2的标准，主要目的是为企业计算提供一个应用服务器的开发和开发平台。JEE本身是

    一个开放的标准，很多软件厂商都旨在推出自己的产品，用户可以有

    多种选择。目前已经IBM、Oracle、BEA、HP等29家公司推出了自己的产品，其中之一

    BEA公司的weblogic和IBM的网页服务器最为著名。Java将逐步发展成为与微软

    工作站的NET栈策略对抗的网络计算平台。JSE是java2 standard edition，主要目的是为台式机和

    工作站提供一个开发和运行的平台。JME是java2 micro edition，主要的是面向消费电子产品、

    为消费电子产品提供一个Java的运行平台，使得Java程序能够在手机、机盒子、PDA等产品

    平台上运行。现在，Java的各种版本已经更名，已取得了其中的数字“2”：JEE更名为Java EE，

    JSE更名为Java SE，JME更名为Java ME，且目前此版本应用方向基本被安卓系统取代，而安卓的

    语言语法基础就是Java。我们在学习Java的过程中，目前应用方向基本采用JSE来进行开发。上述三

    个Java平台的关系如图1-2所示。


