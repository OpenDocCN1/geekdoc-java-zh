    \n# 2.7 分支控制结构\n\n程序的执行过程中，可根据不同的条件选择执行不同的语句，也可以在两种及两种以上的分支中选择一个，执行某些的语句，跳过另外一些分支的语句。\n\
    分支结构由if结构和switch结构组成。其中if语句使用布尔表达式或布尔值作为分支来进行分支控制；而switch语句用于对多个值进行匹配，从而实现分支控制。\n\
    \n# 2.7.1 if 结构\n\n用于执行“二一”的操作，即满足条件时时执行一个分支，不满足条件时执行另一个分支。此外，还有几种特殊用法，如if结构的嵌套、省略一个分支等。\n\
    格式：\n\n```\nif(relation_expression) {\n    statementblock;\n}\n```\n\n![](img/313b79d057fc8eb887843de679d8acad_51_1.png)"
