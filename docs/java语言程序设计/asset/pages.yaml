  md: '# Java 程序设计


    我们将继承父类的 run() 方法，即当它们被

    调度时将执行该 run() 方法

    run() 方法的功能是先眠一段随机的

    时间，然后当前活动（即获得了了处理器的

    线程）被调度次数，并显示在相应的文本

    中。


    ![](img/313b79d057fc8eb887843de679d8acad_235_0.png)


    图 9-4 多线程程序


    构造线程的两种方法的比较：


    +   1. 使用 Runnable 接口。

    2. 可以将 Runnable、代码和数据分析，形成

    清晰的模型。

    3. 还可以其他风格继承。

    4. 保持程序的一致性。

    5. 直接继承 Thread 类。

    6. 不能再从其他类继承。


    编写简单，可以直接连接 Thread().


    # 9.4 线程的调度


    线程调度的目的是处于可执行状态的线程对象对操作系统的调度，防止多个线程

    竞争有限资源而导致系统死机或崩溃。为此，Java 定义了线程的优先级控制和调整策略

    Java 提供一个线程调度器来监控线程从启动后进入就绪的所有状态。线程调度器

    线程的优先级低调到高优先级（进入运行中状态），同时线程调度是抢占调度，

    如果在当前线程执行过程中，一个更高优先级的线程进入运行状态，这个线程就会立即

    被调度。


    抢占调度分为时间片方式和独占方式。在时间片方式下，线程执行完全之前

    时间片后，如果有其他处于就绪状态的相同优先级的线程，系统将会执行权交给其他线程

    相同优先级的线程，当前线程等待执行，等待一个时间片的调度


    在独占方式下，当前线程获得执行权，将一直执行下去，直到执行完毕或由于

    某种原因放弃 CPU，或者是一个更高优先级的线程进入就绪。


    在若干情况下，当前线程放弃 CPU：


    +   (1) 线程调用了 yield()

    (2) 由于当前线程进行 I/O 操作，外连接，等待用户输入操作，导致线程阻塞；或

    为了等待一个条件变量，以及线程等待 wait()。


    +   (3) 抢占体系下，由高优先级的线程调度；时间片方式下，当前时间片完，由

    高优先级的线程参与调度。


    Java 将线程的优先级分为若干等级，分别用数字 1 到 10 表示，数字越大代表线程的级别

    越高差异常量 NORMAL_PRIORITY 和 MAX_PRIORITY 分别为 5 和 10

    int getPriority() 方法可以得到线程的优先级。当线程创建后，可以通过 setPriority'
