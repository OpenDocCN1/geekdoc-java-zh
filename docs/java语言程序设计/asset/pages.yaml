    # # 多线程机制


    本章讨论 Java 系统的一个重要部分——多线程。在 Java 程序中，线程的最常用用途是允许 Applet 在接受用户输入的同时，在屏幕的另一处显示动画使用多线程可以写出
    CPU 最大利用的高效程序，因为 CPU 空闲时间保持最低，这对 Java 的交互式的网络环境是至关重要的


    # ## 9.1 多线程的概念


    ![](img/313b79d057fc8eb887843de679d8acad_223_0.png)


    多线程程序比多进程程序需要更少的管理费用。进程是重量级的任务，需要分配它们自己独立的地址空间。线程是轻量级的，多线程间共享的地址空间并共同共享一个进程。为了理解多线程，我们先来看一看相关概念


    # ### 9.1.1 进程和线程的概念


    随着计算机的快速发展，个人计算机操作系统（如 Windows）也纷扬出现多任务和多线程的设计，将出现类似大型计算机具有的系统特性对于个人计算机系统中，多任务处理的特点允许用户同时运行


    两个或多个进程的运行。在 Windows 中，一个任务就是一个进程，每一个任务都有自己独立的内存空间、一组资源，每一个任务内部数据和状态是完全独立的


    我们将多任务操作系统中 CPU 同时运行多个程序（进程）的机制称为线程，每一个任务都是一个进程（process）。看起来同时运行的程序，实际上是由 CPU
    机制的作用，每一个线程都能循环获得自己的 CPU 时间片，但由于切换速度非常快，使得整个程序像是在同一时间内“运行”——一般可以在同一时间内运行多线程的操作系统具有进程的概念


    多任务的另一种类型是基于线程的（threaded）。线程是进程内部的一个顺序控制。因此，一个进程可以运行多个线程的执行。


    Java 支持多线程编程（multithreaded programming），程序中可以包含两个或以上运行运行的程序，程序中这样的部分都称为线程（thread）。在基于线程（thread-based）的'
