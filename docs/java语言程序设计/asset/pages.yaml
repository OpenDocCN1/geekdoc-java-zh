    +   1. 创建功能


    +   - createFile(): 在指定位置创建文件，成功返回 true；如果已存在就不再创建，返回返回 false。


    +   - mkdir(): 在指定位置创建目录，之后创建最后一级目录，如果上级目录不存在则抛出异常。


