  md: '# Java 编程语言


    JDBC 数据库连接通过 JDBC API 与数据库进行交互。此要求它所用的客户端机器上也必须安装 ODBC API，丧了 Java 的跨平台性


    +   (2) 使用 JDBC 与某个数据库连接，然后直接进入数据库。这种方法用 Java 实现的驱动程序，将 JDBC 转换为特定数据库系统的 SQL 语句。然而所有的
    DBMS 都遵循 SQL 标准与数据库交互，但并不是每一个 DBMS 都支持 SQL 的特性


    虽然这种方法有效，但是由于使用了专用的驱动程序，限制了应用层与其他数据库库的配合使用


    +   (3) 使用一种与数据库协议相连的驱动程序，然后通过中间件和解释器将这个驱动程序与某种数据库相连。这是 Java 的驱动程序，它将 JDBC 调用转换为网络调用，如
    RMI、CORBA 或 HTTP。网络连接将这些调用翻译为 SQL 函数调用。


    JDBC 程序是跨平台的，而且可以连接不同的数据库系统，具有很好的通用性，不需要购买第三方开发的中间件和解释器。


    每个 JDBC 程序至少有一个 JDBC驱动程序，为了管理这些程序，JDBC 的 API 中专门设计了驱动程序工具，将 Java 程序和相应的驱动程序连接起来，图
