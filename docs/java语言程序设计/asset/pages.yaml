  md: '# Java 构造方法


    # 4.1.2 OOP 的特点


    +   1. 抽象的概念


    抽象是科学研究中常用的方法。什么是抽象呢？抽象是将去掉研究对象中所关心的元素，或暂时不需要考虑的因素，只取对当前需求有直接影响的因素，即实质内容


    如对圆形来说，确定圆心和半径，就可以在平面上确定一个具体的圆（图4-2）。抽取的数据是：圆心和半径。但是，这种抽象仅仅描述了对象的基本要素，并没有涉及对对象的行为，还不能称为数据抽象。


    什么是数据抽象？数据抽象是指数据系统中需要处理的数据和数据的操作结合起来。它是 OOP 的基础，抽象是在数据的基础上编程的方法和技术（approaches
    & techniques）。


    如上面提到的，其基本要素是圆心和半径，面积是由半径求取的，求取面积的抽象就是基本方法。


    +   2. 对对象的特点


    +   1) 封装


    封装（encapsulation）是 OOP 的特点之一，是将抽象类型将数据和数据的操作（方法）包装起来，是把对象的属性和功能结合成一个独立的，并可能对对象的内部细节隐藏，也就是一些复杂的处理细节。私有数据封装在类里，只有外部可以使用，更加安全，也不会破坏内部的结构。封装保护了安全性和完整性。


    封装包含两个含义：对象的全部属性和动作结合在一起，形成一个不可分割的单位（对象）；隐藏信息，使得可能对对象的内部数据、对形式形成一道边界（或形成一道屏障），只留有的外部接口与对象发生联系。


    封装的实现方法是要求封装对对象的外部部分不允许随意访问对对象的内部数据（属性），从而避免了对象之间的“数据交换”，使得编译器能够编译，大大减少出错和错误的概率。如一台电视机内部使用了许多不能更改的操作：高压、X射线屏幕、白显示部分等。用户买电视机关心操作方便、图像清晰、声音好听、外观是否美观，而不关心其本身的制造细节，如制造、工作原理、内部的组件由哪个厂家制造，组件的工作原理等。


    +   2) 继承


    继承（inheritance）是 OOP 的第二个特点。


    当一个类拥有另一个类的属性（在 Java中称为数据）和行为（在 Java中称为方法）时，这个类就是继承来的类。其中被继承的类称为父类（又基类），而继承来的


    ![](img/313b79d057fc8eb887843de679d8acad_95_0.png)'
