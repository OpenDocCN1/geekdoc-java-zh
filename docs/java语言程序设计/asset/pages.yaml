    # 5.7.1 创建包


    系统会为每一个 Java 源创建一个无名的包，这个 Java 文件的每个类属于同一个包。这时，包中的类可以相互引用（非私有），由于它是无名的，无法被其他包中的
    Java 程序所引用。解决上述的方法是创建一个名字的包，


    package 是创建包的关键字，利用它对于所有的 Java 文件创建一个。


    创建包的格式：


    ```

    package packageName;

    packageName为要创建的名字（符合标识符的），习惯上，包使用小写字母单词。这个词应该位于 Java 文件的第一个语句处（注释除外）。

    ```


    事实上，创建一个包就是在当前的目录下创建一个子目录，用以存放 Java 的类文件。在 javac 编译、创建包文件时，相应的子目录就会创建。如：


    ```

    package packageName1; packageName2; packageName3;

    ```


    其中“packageName1”代表了目录分隔，注意不要用"\"


    第一个 packageName1 是当前文件夹下的子文件夹。

    第二个 packageName2 是 packageName1 下的子文件夹。

    第三个 packageName3 是 packageName2 下的文件夹。'
