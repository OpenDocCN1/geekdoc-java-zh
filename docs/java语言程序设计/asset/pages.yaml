  md: '# 集合和泛型


    (2)实现:集框架接口的具体实现，在图 7-1 中使用线性表，实线线性表的实现。例如 ArrayList、LinkedList、HashSet、HashMap
    等。


    (3)算法:在实现了一个某个集合框架的对象上完成某种计算的方法，例如查找、排序等。Java提供了集合操作的工具 Collections（注意不是 Collection，类似于
    Arrays 类），它提供了对集合进行排序等多种实现。大家在使用 Collections 的时候可以查阅 Iterator 算法来帮助。


    从图 7-1 可以清楚看出，Java集合框架共有三类接口，Collection、Map 和 Iterator。Iterator 是为了集合和泛型提供遍历方法的，在后文还会详细介绍。Collection
    有两个接口 List 和 Set，所以说 集合框架共有三大类接口，List、Set 和 Map，它们的共同点都是在任何地方都可以存储数据，但它们的区别如下：


    +   (1)List 接口存储一组不一（允许重复），无序的对象。


    +   (2)Set 接口继承 Collection，存储一组不一（允许重复），无序的对象。


    +   (3)List 继承继承接口，存储一组不一（允许重复），有序（以元素插入的顺序来放置元素，不会顺序重列的）。


    +   (4)Map 接口存储一组构成的键-值对。提供 key（键）到 value（值）的映射。Map 的 key 要求唯一，值不要求重复，有允许重复。


    如表 7-1 所示为集合框架的区别。


    | 表 7-1 集合框架的区别 |

    | Collection | 有序 | 允许元素重复 |

    | :--- | :--- | :--- |

    | List | 是 | 是 |

    | Set | HashSet | 否 | 是 |

    | | TreeSet | 是（用二叉树排序） | |

    | Map | AbstractMap | | |

    | | HashMap | 使用 key-value 映射和存储数据，Key 必须唯一，可以重复 |

    | | TreeMap | 是（用二叉树排序） |


    在集合框架中，List 可以理解为前面讲解的数组，元素的内容可以重复且有序，如表 7-2 所示。Set 可以理解为数学中的集合，或者理解一个大麻袋，里面数据不重复且无序，如图
    7-2 所示。Map 也可以理解为数学中的集合，或者理解一个大麻袋，只是其中每个元素都由 key 和 value 两个对象组成，如图 7-3 所示。


