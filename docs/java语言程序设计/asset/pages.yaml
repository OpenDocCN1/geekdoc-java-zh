    break 语句用于跳出 switch 语句，应在每个 case 子语句分支中使用 break，否则程序继续\n执行下一个 case 分支，不断执行。Java\
    \ 的 switch 语句允许 case 句后代码没有 break，但这种\n做法可以引入一个陷阱。如果把 break 句都注释掉，程序将会执行从匹配的 case\
    \ 句开始\n每一个 case 子句后面的代码（穿透执行）。\n\ncase 子句入口使用，后面的 case 子句不再进行匹配。\ncase 分支中的多个\
    \ case 句可以用“|”组合起来。\nswitch 结构可以用结构来实现。\n\n```\n// 【示例2-1】根据考试结果(A、B、C、D)打印分数段(使用\
