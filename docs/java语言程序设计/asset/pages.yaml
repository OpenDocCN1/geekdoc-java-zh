  md: '# Java 编程语言


    成为世界上程序员用得最多的编程语言。可以从以下几个方面考虑：


    Java 语言将对软件开发产生深刻影响，可以使用用户的代码进行动态活动、可视化的描述、以提供设计者更加直观的视图。用户的需求是色彩各异的，无论地区、行业、部门、爱好的影响，都可以用
    Java 语言描述清楚。


    (1)软件的开发方法；由于 Java 语言的面向对象，完全可以使用 OOP 技术与方法来开发它，这是许多最新的软件编程开发的要求。


    (2)Java 语言的动画效果远比 GUI 技术更加逼真，尤其是利用 WWW 提供的巨大动画资源，可以实现丰富的世界的动画资源。


    (3)软件产品：用 Java 编写的软件具有可视化、可视化、可操作的效果，这使得电视、电影的效果更加理想，因为它可以做到“即时、交互、动画与动作”，要它停就停，要它继续就继续，这是在电影或视频播放过程中难以做到的。


    (4)其他：Java 语言对开发效益具有比较明显的影响。


    # 1.2 Java 语言的特点


    Java 到底是什么样的语言？


    +   1. 简单并面向对象


    Java 的简单性体现在精巧的系统上，用图形化的操作系统来实现程序设计的要求，在较小的计算机上可以良好地运行。和所有新代的程序设计语言一样，Java 也采用了面向对象技术来使得
    Java application 和 applet 程序都是均衡的，封装模块化和信息隐藏，彻底实现了代码的自由，用户可以用以自己建立的类。而且 Java 采用的是相对简单的面向对象技术，使用了大量的运算符、多重继承处理复杂性，采用单一继承、强制转换、多线程、并行（非线程）等方式。内在自动垃圾回收机制使得程序员不需要心管理内存，程序设计更加简单，大大减小了出错的概率。Java
    语言用了 C 语言中的大部分语法，C 语言的 Java 语言与 C 语言相似。


    +   2. 强大且安全


    Java 语言在编译和运行过程中，都进行严格的检查，防止出错问题的出现。如果使用一个非法类型或一个非法参数，Java 将在解释时指出错误。在 Java 程序中没有指针的方法通过索引来访问内存，大大减小了出错的概率；而且
    Java 的语言并没有使用指针，这样就可以检查中避免越界类的发生。内在自动垃圾回收也增加了 Java 的安全性。


    作为应用程序，Java 必须提供足够的安全，并且防止病毒的执行。Java 在运行程序时，严格检查访问数据的权限，只有允许的操作才能修改本地数据。数据加载到计算机中的字节代码在被执行之前需要经过一个核实工具检查，一旦字节代码被执行，由
    Java 解释器来，这个解释器阻止了对直接的跳转进来提高 Java 的安全性。同时 Java 高的安全性增加了 Java 的安全性。'
