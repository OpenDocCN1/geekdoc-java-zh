    # 11.2.4 GridLayout


    在组件定位方面，GridLayout比BorderLayout和FlowLayout更精确，它将容器空间分成n行m列的网格，组件可放置在小方格区域。


    使用GridLayout布局管理器的一般方法是：


    +   - 创建一个GridLayout，指定划分布局的行数和列数。

    - 使用容器的setLayout()方法将容器设置为这个GridLayout布局；

    - 调整容器的add()方法，将组件加入容器中。


    组件放入网格的顺序是从第一行开始，第一列，第二列，……第一行放完后，从第二行第一列开始继续，直到最后一行的最后列为止。

    当某个网格中不需要放置组件时，可以使用标签add(newLabel("))填充，以确保下一个组件正确放置在下一个网格中。


    构造函数：


    GridLayout(int rows, int cols, int hgap, int vgap); 指定两个参数设置网格的列间距和行间隔。


    常用方法有：


    +   - add(Component comp); 将组件从左到右，从上到顺序放入网格。

    - setRows(int rows); 设置行数。

    - setCols(int cols); 设置列数。

    - setHgap(int hgap); 设置组件垂直间距。

    - setVgap(int vgap); 设置组件水平间距。


