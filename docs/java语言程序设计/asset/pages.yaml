    # ## 2. 项目任务


    设计一个中国象棋界面。棋盘由九道直线和十道横线组成，棋盘上有九十几个交叉点，棋子滑动在这些交叉点上。象棋中没有竖直线的地方，叫做“河界”；交叉线的点，叫做“九字”。九道横线从右到左用数字一至九代表，棋子共有三十个，分为红、黑组，每组十六个。各一种，名称和规则如下：


    +   红棋子：将、车、马、象、士各两个


    +   黑棋子：将车、车、马、象、士各两个


    具体的棋法效果如图 11-15 所示，红黑象棋交替移动。


    象棋规则：


    +   (1)（帅）每只允许走一步、向前、后退、横相同不同在同一直线上移动，但不能出“九宫”。将帅和对方帅直面对时，另一方必须回避


    +   (2)（士）只能斜过“河界”，每走走斜步，走可退。


    +   (3)（象）不能越过“河界”，每走走两步，走可退，称为“相（象）走田字”。当象棋中心的棋子被挡住时，称为“塞（（眼）”，则不能走过去。


    +   (4)（马）每走一直或一横，走可退，称为“马字走”。要在对方那边被棋子挡住，称为“塞马腿”，则不能走过去。


    +   (5)兵都可以前进、直退、横走，不限步数。


    +   (6)卒在没有“河界”的时候，走法和兵一样。


    走过“河界”后，每棋都可以向前走或横走，但不能后退。


    吃子规则：


    走一着时，如果自己能够位置的位置对方棋子存在，就可以把对方棋子吃掉占领那个位置。只有吃子时必须阻隔一个棋子（无论是哪一方）的跳，称为“炮打隔子”。将（将）其他棋子都可以对对方走，或主动吃子。吃方的，立即把被吃掉的棋子从盘上移除


