    【例9-7】线程的同步。\n\n```\npublic class SynchronizedBlock implements Runnable {\n  \
    \  public static void main(String[] args) {\n        SynchronizedBlock aObjB=new\
    \ SynchronizedBlock(); // 创建对象\n        Thread thread;\n        for (int i=0;\
