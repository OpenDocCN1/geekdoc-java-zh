    # 6.2 Java的异常处理机制


    什么是异常呢？在Java语言中，我们将程序运行时可能产生的错误(error)视为异常(exception)，有时也称为例外。所有产生异常，实际上就是产生一个异常对象。这个对象可能由程序本身也可以由JVM产生，这取决于产生异常的类型。因此，Java引入了异常和异常类，异常是异常的类。


    Java的异常处理机制：程序在运行时，当发生一个可以识别的异常时，就会有一个异常的类与与之对应，并产生异常类的一个对象（即异常），系统中就会有相应的机制来处理异常，确保程序能够正常运行。


    在Java程序中，异常处理机制会抛出异常，捕获异常。

    抛出异常：当一个发生错误时抛出异常时，程序创建异常对象并交付运行时系统，异常对象包含了异常类型和异常出现时的状态等信息。运行时系统负责查找异常处理器的包标识。


    捕获异常：在方法抛出异常之后，运行时将将寻找合适的异常处理器（exception handler）。在潜在的异常处理器是异常发生时依赖于调用链中的方法。当异常处理器所处理的异常类型与方法抛出的异常类型匹配时，即为合适的异常处理器。运行时系统从异常发生的方法开始，依次查找调用链中的方法直到找到合适的异常处理器的方法并执行。如果运行时追溯调用链中没有找到合适的异常处理器，则运行时将终止。同时，所有的异常处理的结束。'
