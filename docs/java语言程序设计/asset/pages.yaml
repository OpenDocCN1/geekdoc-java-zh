    # 表 7-5 LinkedList 使用方法


    | 返回类型 | 方法 | 说明 |

    | --- | --- | --- |

    | void | addFirst(Object o) | 在列表的首部添加元素 |

    | void | addLast(Object o) | 在列表的尾部添加元素 |

    | Object | getFirst() | 返回列表中的第一个元素 |

    | Object | getLast() | 返回列表中的最后一个元素 |

    | Object | removeFirst() | 删除并返回列表中的第一个元素 |

    | Object | removeLast() | 删除并返回列表中的最后一个元素 |


    (1) ArrayList 与 LinkedList均为非线程安全，ArrayList内部使用数组实现（与Vector相同），LinkedList内部采用链表结构实现。

    (2) ArrayList使用数组存储元素，意味着大量添加元素、数组空间不足时，仍然需要通过新建数组、在内存复制的方式增加数组，效率较低；而对数据进行插入、删除操作时，会进行元素移动，效率也较低；而按下标查询时（只需需要方法），使用索引效率较高

    (3) LinkedList使用链表存储元素，在添加元素时只需要进行一次简单的内存分配即可，效率较高；进行插入、删除时，需要对链表相邻元素进行修改，效率也也很高；但按下标查询时，效率较低。

    (4) 可以看出ArrayList在处理数据的新增、插入、删除时效率较低，按下标对数据进行查询时效率较高；LinkedList正相反。一般来说，ArrayList适用于保存经常查询的操作的集合，LinkedList适用于保存经常进行修改的操作。


