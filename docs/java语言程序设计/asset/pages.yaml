  md: "# 第2章\n\n# Java 程序设计基础\n\n# 2.1 编写简单的程序\n\n首先，我们来看一个计算圆面积的简单问题。该如何编写程序解决这个问题？编写程序涉及如何设计算法以及如何将其翻译成程序代码两部分内容。算法(algorithm)描述的是如果要解决问题，需要执行的动作以及这些动作的顺序。算法可以帮助程序员在使用程序设计语言编写程序之前做一个规划。算法可以用自然语言或者代码（即自然语言和程序设计代码混合在一起）描述。这个程序的算法描述如下：\n\
    \n+   (1)读入半径\n\n+   (2)利用的公式计算圆面积：n面积=半径×半径×π\n\n+   (3)显示面积。\n\n+   【2-1】 编写一个\
    \ Java 程序，计算圆面积(执行结果如图2-1所示）。\n\n```\npublic class ComputeArea {\n    public static\
