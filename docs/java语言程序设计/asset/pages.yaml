    \    }\n    }\n}\n```\n\n```\nfor (int i=0; i<=5; i++) {\n    try {\n        Thread.sleep(5);\n\
    \    } catch (InterruptedException e) {\n        // synchronized(System.out输出当前线程的名字，后面可能有其他线程执行，为了保证同一\n\
    //变量和线程名，在这两个句子中执行，否则\n//程的这两个语句一起性执行（不中断）或不执行。\n        System.out.println(Thread.currentThread().getName());\
    \ // 显示线程名\n        +Thread.currentThread().getName());\n    }\n}\n```\n\nrun()连接两个输出语句，一般先输出当前线程的名字，接着输出对应线程的变量i的值[如图9-5]所示，为了区分i是哪个线程的值，在i的后面用线程名标注。实际输出的\n\
    图9-5(b)所示，是同一个线程的每一个输出语句执行后，CPU执行另一个线程\n并并不一定是接着执行第二个输出语句。\n\n为了保证同一个线程的两个语句一起被执行，而不是被其他线程中断，可以使用\n\
    synchronized(Object o)即可实现同步。\n将代码中插注的符号\"//\"去掉，即可实现同步。"
