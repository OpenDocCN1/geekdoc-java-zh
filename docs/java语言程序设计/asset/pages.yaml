  md: '# 2. 数组的大小


    数组的声明说明了数组变量的名称和数据类型，但存放数组元素的内存空间还并不存在，还必须为其申请内存空间即定义数组的大小。申请内存空间就是指定数组的长度即数组存储元素元素的个数。


    ```

    数据类型[] 数组名=new 数据类型[数组的长度];

    ```


    代码示例：


    ```

    public static void main(String[] args) {

    // 数据类型[] 数组名=new 数据类型[数组的长度];

    int[] arr=new int[5]; // 数组可以存储int 类型的数据

    // 左边：

    int[]: 类型

    []: 类型，几个中括号代表数组类型(后跟随)

    // 右边：

    new: 创建的实体或对象

    int[]: 数据类型

    [5]: 表示数组的长度(指定几个空间存什么东西)

    }

    ```


    # 3. 数组初始化


    所谓初始化就是为数组划分连续的内存空间，为每个元素赋初始值。一旦数组被定义之后，系统就会给每个元素赋予初始值。有时候，我们希望在声明时使用指定的值对其进行初始化，同时也确定了数组的大小，即静态初始化。如果在定义数组以后，再给数组元素赋初始值，动态初始化。


    (1) 静态初始化


    在声明和定义数组的同时，给数组元素赋初始值。初始化时，由程序员指定每个数组元素的初始值，由系统决定数组长度。

    格式：

    数据类型[] 数组名=new 数据类型[]{元素1, 元素2, 元素3};


    +   * int[] intArray=new int[]{1, 2, 3};


    表示数组的长度是3，立即 intArray[0]=1, intArray[1]=2, intArray[2]=3。

    * String[] stringArray=new String[]{"How", "are", "you"};

    表示数组的长度是3，stringArray[0]="How", stringArray[1]="are", stringArray[2]="you";


    (2) 动态初始化


    先声明和定义数组，然后再初始化。在初始化时，程序员指定数组长度，由系统为数组分配初始值，即数组有默认值。常见数据类型的初始化默认值，如3-1所示。'
