    但是，Java 虚拟内存针对不同的软件平台进行专门的实现，要考虑处理器的型号，也要考虑操作系统的种类。如图1-1所示，目前在 SPARC 结构、X86 结构、MIPS
    和 PPC 等嵌入式处理器芯片上，在 Unix、Linux、windows 和部分实时操作系统上，都有 Java 虚拟机的实现


    ![](img/313b79d057fc8eb887843de679d8acad_19_0.png)


    图1-1 Java虚拟机结构


    # 1.3.2 内存自动回收


    在程序的执行过程中，部分内在使用后就应该处于废弃状态。如果不及时进行内存的回收，就会导致内存泄漏，进而导致系统崩溃。在C++语言中是由程序员进行内存回收的，程序员需要在编写程序的时候时刻把不再使用的对象释放掉；但是这种人的管理内存释放的方法往往由于程序员的疏忽而导致内存不可回收，同时也增加了程序员的工作量。而在
    Java 运行环境中存在一个系统的线程，专门负责内存的线程，定期检测不再使用的内存，并进行自动回收，避免了内存的泄漏，也减轻了程序员的工作量


    # 1.3.3 标识安全性检查


    安全和方便是相矛盾的。Java 语言的出现使得客户端可以方便从网络上将代码加载到本地机器上运行，但是如何保证Java虚拟机不会携带病毒或者有害的代码呢？如果
    Java 语言不能保证执行的安全性，那么它就可能活不下去。虽然有少数程序员会阻止 applet 文件系统的不能运行，但是通过所有安全机制确保了 Java 语言的安全


    字节的加载需要三个步骤：首先，由类加载器（class loader）负责将类（class）加载到 Java 虚拟机中，在此过程中加载该类是否符合类文件规范；其次，字节校验器（bytecode
    verifier）检查该类的标识中是否存在非法操作，例如，applet 程序中存在针对本地机器的操作；如果字节码校验验证通过，由 Java 解释器负责将字节码转换为机器码进行执行
    Java 虚拟机使用的是“沙箱”运行模式，即将 Java 代码的'
