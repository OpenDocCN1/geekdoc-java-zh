    # 9.5 同步的同步\n\n同步（synchronization）是解决线程安全问题的重要手段 在多线程的程序中，由于多线程\n共享内存，因此一个线程在使用某些资源时，另一个线程要去修改，将造成数据的混乱\n\
    实际应用中，要保证在同一时刻只有一个线程可以使用共享的数据，以保证数据的安全。\n\n在 Java 中，一个主线程的资源使用相同的方法放置局部变量和类变量。为了避免\n\
    多个线程同时使用一个对象造成数据混乱，可以使用 Java 提供的关键字 synchronized 同步\n同步化像是一个一个对象的锁。当多个线程在访问所监控的对象时，此对象会被锁住\n\
    （通过一个 mutually exclusive lock，又称为 mumlock），以避免其他线程使用\n完毕，它也会被释放，以供其他线程使用\n\n#\
    \ 9.5.1 Synchronized 访问\n\n用来同步后后对象的对象的段一次只有一个线程能使\n用。这个标记用来保证在同一时刻，只有一个线程访问该对象。当\n\
    关键字 synchronized 用于与对对象的互斥锁连接。当某个对象\nsynchronized 修饰时，表明它在任何时刻只能由一个线程访问。\n\n![](img/313b79d057fc8eb887843de679d8acad_237_0.png)\n\
    \n- 224"
