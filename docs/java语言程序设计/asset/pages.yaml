    \        // ******* 提高最低工资得到330元\n    }\n}\n```\n\n方法的调用与类属性调用相似，只能用类名引用（不能对对象引用）。因为它不被某个对象专有，所以它不能处理（引用、访问）实例变量。\n\
    \n我们知道，不管是类方法还是实例方法，都是以代码的形式存在的，类的字节码文件加载到内存后，它们在内存中只各有一个地址。但类方法与实例方法不同的是：\n\n\
    +   1) 的类方法，加载到内存后，不会被分配入口地址。该类创建后，类中的实例方法会被分配入口地址，但从类方法可以被类创建的任何对象调用，这一个入口地址也是所有对象共享的。\n\
    2) 的类方法，在该类加载到内存后，就分配了相应的入口地址。这个地址在整个类中共享的，从类方法不仅可以被类创建的任何对象调用，也可以直接调用类方法。\n\n\
    无论是类方法还是实例方法，在调用执行时，方法的局部变量会被分配内存空间，方法执行完毕，变量就从栈中释放内存空间。\n\n那么，Java 程序中的类方法为什么要声明为\
    \ static 呢？这是因为只有在类加载到内存后，就可以获得该方法的入口地址，从而可以用 Java 虚拟机执行，成为程序运行的入口。如果 main 方法声明为实例方法，这个方法无法在类加载到内存时被\
    \ Java 虚拟机直接调用。\n\n在使用类方法时，注意以下几点：\n\n+   1) 类方法只能直接访问同类中的其他类成员（包括变量和方法），而不能直接访问类的实例成员。因为对于实例变量和方法，需要创建的实例对象后才能使用，而类方法执行前不需要创建任何对象。在实例方法中，类变量和实例变量均可以使用。\n\
