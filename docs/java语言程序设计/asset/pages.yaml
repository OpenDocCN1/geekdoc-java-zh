  md: '# Java 面向对象——类和对象 第4章


    鸟、鸡、天鹅属于鸟类的特征是有羽毛、有翅膀、眼睛等；行为包括会飞、会走、会动等。


    面向对象的思想概括为：按照现实世界的特点，管理复杂的事务，将事物抽象为对象。其中对象具有自己的状态和行为，通过对消息响应，完成一定的任务。


    # 4.1.1 对象、类和消息


    # 1. 对象


    什么是对象(object)？对象是具有属性(property、特征或状态)和操作相关的行为为(action)的集合(collection、多个对象和多个行为)的具体化。对象是系统中用来描述客观事物的一个实体，是构成系统的一个基础单位。


    面向对象的程序是对对象组合而成的，对象之间可以相互通信、协调与配合，完成整个任务和功能。对象的概念是 OOP的核心。


    举一个例子，用在网上买手机。买者不能说“一台 Android手机(屏幕大小不清楚)；同样不能说“5.5寸 Android手机(型号不清楚)”，但可以说“华为
    Huawei Ascend 7 尊版双卡双网移动/联通4G黑色手机”，据此将“手机”实例化为具体的对象。


    在 OOP 中，类也是一种，类是必须实例化(instance，生成对象)后才能使用的。


    # 2. 类


    类(class)是什么？简单来说，类是相同对象的集合。大众的归归、划分类是人类在观察客观世界时常用的思维方式。分类的标准是抽象，对于属于类的对象提供了统一的描述，其中包括属性和动作两个主要部分。在面向对象的编程语言中，类是一个独立的程序单位，它应该有一个类名并包含属性性和动作说明两个主要部分。类与对象的关系就像方法和零件的关系，类的实例化化就是对象，而对一类对象的抽象就是类。


    如手表、钟表、电子表等属于“类”。在现实世界中，虽然手表、钟表、电子表是不同的，但它们有共同的特点：显示时间，可以调节，有外观，需要能量。因此可以将它们视为一类——“类”。


    在 OOP 中，对象之间通过消息交互，实现不同的行为。


    如汽车加速时，应发送给它一个消息，告诉它进行某种动作并实现这种动作所需的参数。


    消息传递的示意图如图 4-1 所示。


