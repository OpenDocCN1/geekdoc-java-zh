  md: '# Java 程序设计详解


    ![](img/313b79d057fc8eb887843de679d8acad_141_0.png)


    图 5-2 初等几何


    我们可以这样描述类，它有直径、周长和面积。矩形、三角形、多边形及其他具体的图形也是相似的描述。那么，对于初等几何类该如何描述呢？它是抽象的，我们只能说它表示一个区域、它有面积但是，它的面积如何如何计算呢？这也是抽象的。在现实生活中，我们会遇到很多抽象的类，如汽车、车等。


    Java 提供了类下一个定义；当遇到这类仅包含类的结构，而不能具体的实现方法时，可以将它们定义类。


    # 5.3.1 抽象类


    如果给抽象类下一个定义，可以这样描述：抽象类是指只能被继承而不能生成具体对象（即不能实例化）的类。包含抽象类方法的就叫抽象类，一个抽象类中可以有一个或多个抽象方法，也可以没有抽象方法。


    先看这个例子，交通工具分类，如图 5-3 所示。


    “交通工具”仅仅是一种抽象的类，不存在属于交通工具的类。具体什么样的实际的交通工具，都属于交通工具中某个类的对象。


    比如“鸟”类，它是一种抽象类，在实在只有一种实在存在的鸟，它既不是鸡，也不是燕。“鸟”并不代表一种具体的鸟，仅仅是一种抽象的“鸟”。


    抽象类的定义格式：


    ```

    abstract class className

    // 编译

    // 抽象方法

    void 控制控制速度 abstract 返回类型 方法名（形参数列表）

    // 非抽象方法

    void 控制控制速度 abstract 返回类型 方法名（形参数列表）

    ```


    ![](img/313b79d057fc8eb887843de679d8acad_141_1.png)


    抽象类可以包含抽象方法（abstract method），也可以包含抽象方法。只要有一个方法是抽象的，则这个类一定是抽象的。


    · 128 · 实例化类'
