  md: "# Java程序设计\n\n造方法。\n\n+   * 什么时候继承：继承关系是“is a”（一个），是一种表示特殊与一般的关系。\n继承其实实现的一种关系。如果有两个类A、B，只有它们符合A是B的一种，或者B是A的一种，就可以考虑使用继承。比如，狗（猴）是一种动物（一般）。关键字\
    \ extends 表明在构造的新类中派生于一种的类。\n\n```\n【5-5】继承演示代码：\n```java\nclass A {\n    public\
    \ void show() { }\n}\nclass B {\n    public void show1() { }\n    public void\
    \ show3() { }\n}\nclass C extends A {\n    public void show3() { }\n}\n```\n```\n\
    \n这里B不应该继承A，因为B本身是没有show2()，所以继承的关系使得B平台无故多出一个方法\n\n# 5.2.3 继承成员变量的关系\n\n+   *\
    \ 子类中的成员变量和父类中的成员变量名称不一样可以直接使用。\n\n+   * 子类变量名与父类成员变量名一样\n查找遵循就近原则。先在局部位置查找，如果局部找不到，那么就到当前成员变量找；如果当前找不到，那就到父类里面，再找不到，就报错。\n\
    注意：当子类覆盖父类的成员变量时，每个类使用成员变量都相当于在前面加了一个this指针。\n\n```\n【5-6】继承成员变量的关系：\n```java\n\
