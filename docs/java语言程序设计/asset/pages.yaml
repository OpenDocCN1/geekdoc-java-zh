    不管怎样，一个类可以使用和调用自己的类和方法，不管这些属性或方法如何使用被限定修饰。


    封装可以将数据和处理数据的方法依赖联系在一起，通过封装可以对控制的哪些部分能够访问的成员，哪些部分不能访问的成员，防止对成员的误用。


    前面的例子大多使用了默认的模式，这并不是最好的方式，对类的类的成员加以限制，使用访问控制修饰是最佳的选择。


