  md: '# 第11章


    # 图形用户界面设计


    本章将介绍 Java 语言的图形用户界面 (GUI) 技术、设计图形用户界面工具。图形界面程序与字符界面程序相比，界面直观、操作方便、可以使用鼠标。


    在 Java 语言中，开发 GUI 程序时直接使用系统提供的各种组件（或称为）。Java 2.0 中组件位于 Awt 和 Swing 包中。


    # 11.1 图形用户界面构成


    程序设计要遵循一条基本原则：“简单的事情容易变得，困难的事情容易变得


    Java1.0版本的图形用户界面，最初的设计目标是帮助程序员写在所有平台上都能良好的 GUI 程序。由于，这个目标还没有达到。事实上 Java1.0 提供的窗口接口包括
    (abstract window toolkit, AWT) 在的系统上的表现都不太好，而且限制多，比如只能使用四个字体，也不能存在于操作系统上的任何成熟的
    GUI 组件。Java1.0 的编程模型非常笨，而且不是面向对象的。


    Java 的 1 在引入了线程模型后（这是一种更清晰的、面向对象的方法），以及随着 JavaBeans 的加入，使得情况有所好。Java 2.0 (JDK2)
    完成了对旧的 Java AWT 到新标准的转换，Java 基础类库 (GUI) 几乎替换了所有的内容，其中 GUI 的部分被称为“Swing”。Swing
    是一组容易使用、理解的 JavaBeans，可以通过插件扩展（也可以通过编码）来创建的 GUI 程序。软件工业界的“第三次修订”规则（在完善第三次之后才会成熟）对编程语言也同样适用。


    本章将介绍引入的 Swing 界面，并且说 Swing 就是 Java 的最终 GUI 程序。


    在学习 Swing 时会遇到 Swing 的特性。


    # 1. Swing 组件的多样化


    Swing 是 AWT 的扩展，提供了许多新的界面组件。Swing 组件以“J”开头，除了与 Swing 类似的按钮 (JButton)、标签 (JLabel)、复选框
    (CheckBox)、菜单 (JMenu) 等基本组件之外，还增加了一个丰富的各种组件集合，如表格 (JTable)、树 (Tree)。'
