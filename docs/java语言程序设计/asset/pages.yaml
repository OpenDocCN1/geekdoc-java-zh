  md: '# Java语言程序设计


    模式和设计模式等设计模式的应用介绍。


    【本书的特点】


    本书以 Java 语言教学为目的的初学者，因此特别注重学生入门，围绕这个目标，本书在内容组织、结构安排、教学方式等方面有如下特点：


    +   1. 强化面向对象。本书版突出了 Java 面向对象开发技术原理。面向对象思想和开发技术一直是 Java 语言的难点，本书一方面增加了理论讲解编译，另一方面增加了原理与实际结合，以代码为引入深入浅出现在的面向对象编程技术。特别地，在理论逻辑形类比例讲解基础上，配合代码直看到运行结果，有利于理解和应用。


    +   2. 优化章节结构。本书在第一版基础上，结合教学实践经验积累和企业开发工程建议，优化调整了章节内容。从 Java 语言运行到语法基础再到面向对象编程，最后介绍基础编程，条例清晰，模块独立，章节独立性强。


    +   3. 支持在线学习。为了帮助学生更好地掌握知识，编写用心录制了微视频，针对 Java 基础中的一些重点知识、案例进行进行了讲解，学生可以扫描教材中二维码进行在线学习，为了方便教师教学，编写提供了书书中所有案例源代码、教学大纲、PPT
    等配套资源。


    本书可作为计算机应用专业专生、本科生的教材，也可以供从事计算机应用和网络程序开发的各类人员使用。由于作者水平有限，加上时间仓促，书中中错误在所难免，请广大读者批评指正。


    编者'
