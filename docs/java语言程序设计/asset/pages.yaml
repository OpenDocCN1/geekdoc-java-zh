    CETR: 中间 NORTH: 北边

    SOUTH: 南边 WEST: 西边

    EAST: 东边 NORTH_EAST: 东北边

    NORTH_WEST: 西北 SOUTH_EAST: 东南

    SOUTH_WEST: 西南 HORIZONTAL: 水平排列

    VERTICAL: 垂直排列 LEADING: 前端

    TRAILING: 后端'
