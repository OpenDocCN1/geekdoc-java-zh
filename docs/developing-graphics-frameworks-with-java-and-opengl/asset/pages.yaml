    in the rendered image, the depth buffer stores the distance from the viewer to
    the corresponding point in the scene. This information is used during rendering
    when a fragment would correspond to the same pixel as a previously processed fragment,
    to determine whether the new fragment is closer to the viewer, in which case the
    new fragment’s data overwrites the data currently stored in the color and depth
    buffers. The final rendered image of scene, each pixel corresponds to a fragment
    that is the shortest distance from the camera, compared to all other fragments
    that would correspond to the same pixel. “shortest distance” information from
    the depth buffer can be used to generate shadows according to the following algorithm
    (called *shadow mapping*):


