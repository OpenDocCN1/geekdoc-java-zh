    # 5.7 USING TEXT IN SCENES


    In this section, you will explore a way in which images of text can be added to
    three-dimensional scenes. Many of these approaches will naturally lead to additions
    to the graphics framework, such as a sprite material and an orthogonal camera
    that may be useful in other contexts as well.


    # 5.7.1 Billboarding


    One major use of text is to convey information to the viewer, as in a label. One
    way to incorporate a label in a scene is to apply it to an in-scene object, such
    as a sign or marker. The approach has the drawback that the viewer might not be
    able to read the label from all angles and inadvertently miss some useful information.
    One remedy for this issue is billboards: orienting an object so that it always
    faces the camera, as illustrated in Figure 5.25. Two methods for implementing
    billboards are using a special matrix transformation and using a custom material,
    each of which are discussed in detail and implemented in what follows.


    One method for accomplishing billboards is using a transformation called look-at
    matrix, which as the name implies, directs one object towards another called the
    target. The look direction or forward direction of a 3D object is its local negative
    z-axis, just as is the case when working with camera objects. Similarly, in this
    context, the positive'
