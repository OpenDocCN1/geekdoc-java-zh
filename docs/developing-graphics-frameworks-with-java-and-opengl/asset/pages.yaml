    \ create a file name\nFlatMaterial.vert and add the following code:\n\n```\nstruct\
    \ Light {\n        // 1 = AMBIENT, 2 = DIRECTIONAL, 3 = POINT\n    int lightType;\n\
    \    // used by all lights\n    vec3 color;\n    // used by directional lights\n\
    \    vec3 direction;\n    // used by point lights\n    vec3 position;\n    vec3\
    \ attenuation;\n};\n```\n\n```\nuniform Light light0;\nuniform Light light1;\n\
    uniform Light light2;\nuniform Light light3;\n```\n\nNext, we will implement the\
    \ lightCalc function. The function will be designed so that\nit may calculate\
    \ the contributions from a combination of ambient, diffuse, and specular\nin the\
    \ flat shading and Lambert materials, only ambient and diffuse light contributions\n\
    are considered, and thus the parameters required by the lightCalc function\nare\
    \ the light source itself, and the position and normal vector for a point on the\
    \ surface.\nValues for the contributions from each type of light are stored in\
    \ the variables ambient,\ndiffuse, and specular, each of which is initially set\
    \ to zero, and then modified as\nnecessary according to the light type.\n\nThe\
    \ calculations for the diffuse component of a directional light and a point light\
    \ are\nquite similar. One difference is in the calculation of the light direction\
    \ vector: for a direc-\nlight, this is constant, but for a point light, this is\
    \ dependent on the position of the\nlight and the position of the point on the\
    \ surface. Once the light direction vector is known,\nthe contribution of the\
    \ light source can be calculated. The value of the contribution\ndends on the\
    \ angle between the light direction vector and the normal vector to the\nsurface.\
    \ When this angle is small (close to zero), the contribution of the light source\
    \ is\nto 100%. As the angle approaches 90°, the contribution of the light source\
    \ approaches 0%.\nThis models the observation that light rays meeting a surface\
    \ at large angles are scattered,\nredu the intensity of the reflected light. Fortunately,\
    \ this mathematical relation-\nship is captured by the cosine function, as cos(0°)=1\
    \ and cos(90°)=0. Furthermore,\nit can be proven that the cosine of the angle\
    \ between two unit vectors (vectors with length\none) is the dot product of the\
    \ vectors, which can be calculated with the GLSL function\ntion dot. If the value\
    \ of the cosine is negative, this indicates that the surface is inclined at\n\
    an angle away from the light source, in which case the contribution should be\
    \ set to zero;\nthis will be accomplished with the GLSL function max, as you will\
    \ see."
