  md: '# A Scene Graph Framework


    In this chapter, you will begin to create the structure of a three-dimensional
    (3D) graphics framework in earnest. At the heart of the framework will be a scene
    graph: a data structure that organizes the contents of a 3D scene using a hierarchical
    or tree-like structure.


    In the context of computer science, a tree is a collection of node objects, each
    of which stores a value and a list of zero or more nodes called child nodes. If
    a A has a child B, then node A is said to be the parent node of node B. In a tree,
    each node has exactly one parent, with the exception of a special node called
    the root, from which all other nodes can be reached by a sequence of child nodes.
    Starting with node N, the set of nodes that can be reached from a sequence of
    child nodes are the descendants of N, while the sequence of parent nodes from
    N up to and including the root are called the ancestors of N. An abstract example
    of a tree is illustrated in Figure 4.1, where nodes are represented by oval labeled
    with the letters from A to G, and arrows point from a node to its children. In
    the diagram, node A is the root and has child nodes B, C, and D; node B has child
    nodes E and node D has child node G. Nodes E, F, and G do not have any child nodes.


    In a scene graph, each node represents a 3D object in the scene. As described
    previously, the current position, orientation, and scale of an object is stored
    in a matrix model, which is calculated from the accumulated transformations that
    have been applied to the object. For convenience, the position, orientation, and
    scale of an object will be collectively referred to as the transform of the object.
    The matrix model stores the transform of an object relative to its parent object
    in the scene graph. The transform of an object relative to the root of the scene
    graph, is often called a world transformation, can be calculated from the product
    of the matrix model of the object and those each of its ancestors. This enables
    complicated transformations to be expressed in terms of simpler ones. For example,
    the motion of the moon relative to the sun, illustrated in Figure 4.2 (gray dashed
    line), can be more simply expressed in terms of the combination of two motions:
    the moon relative to the Earth and the Earth relative to the sun (blue dotted
    line).


    DOI: 10.1201/9781003153375-4'
