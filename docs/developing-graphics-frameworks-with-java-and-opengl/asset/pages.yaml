  md: '# 14 Developing Graphics Frameworks with Java and OpenGL


    However, rendering transparent objects has some complex subtleties. These calculations
    occur at the same time that depth values are being resolved, and scenes involving
    transparency must render objects in a particular order: all opaque objects must
    be rendered from the farthest to the closest with respect to the virtual camera.
    Not following this order may cause transparency to fail. For example, a scene,
    such as that in Figure 1.15, containing a single transparent object close to the
    camera and multiple opaque objects farther from the camera that appear behind
    the transparent object. Assume that, to the previously described rendering order,
    the transparent object is rendered first, followed by the opaque objects in some
    unknown order. When the fragments of the opaque objects are processed, their depth
    value will be greater than the value stored in the depth buffer (corresponding
    to the closer transparent object), and so the opaque fragments'' color data will
    automatically be discarded, rather than blended with the currently stored object.
    When attempting to use the alpha value of the transparent object stored in the
    color buffer in this example does not resolve the underlying issue, because when
    the fragments of each opaque object are being rendered, it is not possible at
    this point to determine if they have been occluded from view by another opaque
    fragment (only the closest depth value, corresponding to the transparent object,
    is stored), and thus it is unknown which opaque fragment''s color values should
    be blended into the color buffer.


