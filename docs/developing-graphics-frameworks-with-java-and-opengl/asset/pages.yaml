  md: '# 78 Developing Graphics Frameworks with Java and OpenGL


    The derivation relating to scalar multiplication is as follows:


    ```

    $H(c\cdot v) = F(G(c\cdot v))\n= F(c\cdot G(v))\n= c\cdot F(G(v))\n= c\cdot H(v)$

    ```


    The reason this is significant is that linear functions – each of which can be
    represented by a single matrix, as previously observed – their composition can
    be represented by a single matrix, as the composition is also a linear function.
    By repeatedly applying this reasoning, it follows that the composition of any
    number of linear functions can be represented by a single matrix. This immediately
    leads to the question: how the matrix corresponding to the composition be calculated?
    Algebraically, given two transformations $F(v) = A\cdot v$ and $G(v) = B\cdot
    v$, the goal is to find if the transformation $H(v) = C\cdot v$ is equal to $F(G(v))
    = A\cdot (B\cdot v)$ for all vectors $v$. In this case, one writes $C = A\cdot
    B$. This operation is referred to as matrix multiplication, and $C$ is called
    the product of the matrices $A$ and $B$.


    The formula for matrix multiplication may be deduced by computing both sides of
    the equation $C\cdot v = A\cdot (B\cdot v)$ and expanding the coefficients of
    $x$ and $y$ on either side of the equation. Expanding $C\cdot v$ yields:


    ```

    $C\cdot v = \begin{bmatrix} c_{11} & c_{12} \ c_{21} & c_{22} \end{bmatrix} \begin{bmatrix}
    x \ y \end{bmatrix} = \begin{bmatrix} c_{11}\cdot x + c_{12}\cdot y \ c_{21}\cdot
