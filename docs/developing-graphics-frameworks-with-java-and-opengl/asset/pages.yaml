    | red | 1 0 0 | black | 0 0 0 |

    | orange | 1 5 0 | white | 1 1 1 |

    | yellow | 1 1 |0 | gray | 0.5 0.5 |

    | green | 0 1 0 | brown | 0.5 2 0 |

    | blue | 0 0 1 | pink | 1 5 0.5 |

    | violet | 0.5 0 1 | cyan | 0 1 1 |


    FIGURE 1.4 Various colors and their corresponding (RGB) values.'
