    # 2.4 WORKING WITH UNIFORM DATA


    There are many scenarios in computer graphics where you may want to reuse the
    same information in shader programming. For example, you may want to translate
    all the vertices that define a shape by the same amount, or you may want to draw
    all the pixels corresponding to a shape with the same color. The most flexible
    and efficient way to accomplish such tasks is by using uniform variables: global
    variables that can be accessed by both the vertex shader and the fragment shader,
    whose values are constant while each shape is being drawn (but can be changed
    between draw functions).


    # 2.4.1 Introduction to Uniforms


    Uniform shader variables, declared with the type qualifier uniform, provide a
    mechanism to send data directly from variables in a CPU application to variables
    in a GPU program. In contrast to attribute data, uniform is not stored in GPU
    buffers and is not managed with VAOs. Similar to attribute data, reference to
    the location of the uniform variable must be obtained before data may be sent
    to. This is accomplished with the following OpenGL function:


    ```

    glGetUniformLocation(programRef, variableName)

    ```


    Returns a value used to reference a uniform variable (indicated by the type qualifier
    uniform) with name indicated by the parameter variableName and declared in the
    program referenced by the parameter programRef. If the variable is not declared
    or not used in the specified program, the value -1 is returned.


    The other OpenGL functions to work with uniforms are used to store data in uniform
    variables. However, unlike the function glVertexAttribPointer that specified the
    data type with its parameters baseType and size, specifying different types of
    uniform data is handled by different functions. The notation {a | b | c | ...}
    used below (similar to that used in the original OpenGL documentation provided
    by the Khronos group) indicates that one of the values a, b, c, ... in the set
    should be each chosen to specify the name of a'
