    local x axis and y axis are sometimes referred to as the right direction and the
    up direction respectively. The look direction is aligned with the vector from
    the position of the object to the position of the target. To avoid ambiguity,
    an up direction must be specified when calculating this matrix, as there are many
    ways to look along the look direction: the object could be tilted (rotated) to
    the left or the right by any amount with respect to this direction.


    To determine the rotation components of a look-matrix (the upper three-by-three
    submatrix), you can apply the same mathematical approach used in Chapter 3 to
    derive the matrices representing rotation around each of the coordinate axes:
    determine the results of applying the look-at transformation to the standard basis
    vectors i, j, and k. If F represents this transformation, F(j) will equal the
    up direction, and -F(k) will equal the forward direction. These results will be
    the columns for the rotational component of the transformation matrix. The fourth
    column of the transformation matrix corresponds to the position of the object,
    which should not be changed in this matrix.


    Before procceding with the necessary calculations, a new vector operation must
    be introduced: the cross product v × w of two vectors v and w in three-dimensional
    space produces a third vector u which is perpendicular to both v and w. The orientation
    of u is given by the right-hand convention discussed in Chapter 3. For example,
    if v and w align with the x and y axes, then u will align with the z axis. The
    cross product operation is not commutative: symbolically, v × w = -(w × v). If
    v and w are parallel along the same direction – the calculation of a perpendicular
    vector is ambiguous and the cross product returns the zero vector. The cross product
    will be used in calculating the right, up, and forward vectors, all of which must
    be perpendicular to each other. The actual formula for the cross product will
