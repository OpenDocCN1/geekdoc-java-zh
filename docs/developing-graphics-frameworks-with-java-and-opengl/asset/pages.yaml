  md: "# 164 ■ Developing Graphics Frameworks with Java and OpenGL\n\nBefore continuing\
    \ with this test class, create two shader files named Test_4_4.frag and Test_4_4.vert.\
    \ Inside the fragment shader, insert the following code:\n\n```\nin vec3 position;\n\
    out vec4 fragColor;\nvoid main() {\n    vec3 color = mod(position, 1.0);\n   \
    \ fragColor = vec4(color, 1.0);\n}\n```\n\nAnd inside the vertex shader file,\
    \ insert the following code:\n\n```\nin vec3 vertexPosition;\nout vec3 position;\n\
    uniform mat4 modelMatrix;\nuniform mat4 viewMatrix;\nuniform mat4 projectionMatrix;\n\
    void main() {\n    vec4 pos = vec4(vertexPosition, 1.0);\n    gl_Position = projectionMatrix\
    \ * viewMatrix * modelMatrix * pos;\n    position = vertexPosition;\n}\n```\n\n\
    Note that there are out and in variables named position, which are used to transform\
    \ position data from the vertex shader to the fragment shader (which, as usual,\
    \ is interpolated for each fragment). Additionally, to obtain the fractional part\
    \ of each coordinate, the values are reduced modulo one using the GLSL function\
    \ mod. In this example, objects do not need to be created for the matrices, as\
    \ this is handled by the Mesh class.\n\nNext, in the initialize method in the\
    \ file Test_4_4, delete the code that is present after the camera object is initialized,\
    \ and replace it with the following code:\n\n```\nGeometry geometry = new SphereGeometry(3);\n\
    \nMaterial material = new Material(\n    \"./src/Test_4_4.vert\", \"./src/Test_4_4.frag\"\
    ;\nmaterial.locateUniforms());\n\nmesh = new Mesh( geometry, material );\nscene.add(\
    \ mesh );\n```\n\nIt is easy to see the red and green gradients on the rendered\
    \ sphere, but not the blue gradient, due to the orientation of the sphere and\
