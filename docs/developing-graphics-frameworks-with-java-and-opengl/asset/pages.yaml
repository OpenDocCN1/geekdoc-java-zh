  md: '# 2 Developing Graphics Frameworks with Java and OpenGL


    # 1.1 CORE CONCEPTS AND VOCABULARY


    Our primary goal is to generate 2D images of 3D scenes; this process is called
    rendering the scene. Scenes may contain 2D and 3D objects, from simple geometric
    shapes such as boxes and spheres to complex models representing real-world or
    imaginary objects such as teapots or alien lifeforms. These objects may simply
    appear to be of a single color, or their appearance may be affected by textures
    (images applied to surfaces), light sources such that result in shading (the darkness
    of an object not in direct light) and shadows (the silhouette of one object''s
    shape on the surface of another object), or environmental properties such as fog.
    Scenes are rendered from the point of view of a virtual camera, whose relative
    position and orientation in the scene, together with its intrinsic properties
    as angle of view and depth of field, determine which objects will be visible or
    partially obscured by other objects when the scene is rendered. A 3D scene containing
    multiple shaded objects and a virtual camera is illustrated in Figure 1.1. The
    region contained within the pyramid shape outlined in white (called a frustum)
    indicates the visible space to the camera. Figure 1.1, this region completely
    contains the red and green cubes, but contains only part of the blue sphere, and
    the yellow cylinder lies completely outside of this region. The results of rendering
    the scene in Figure 1.1 is shown in Figure 1.2.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_9_0.png)


    FIGURE 1.1 Three-dimensional scene with geometric objects, viewing region (white
    outline), and virtual camera (lower right).


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_9_1.png)


    FIGURE 1.2 Results of rendering the scene from Figure 1.1.'
