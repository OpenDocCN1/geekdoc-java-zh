    # # Textures


    In many computer graphics applications, you will want to use textures: images
    applied to surfaces of geometric shapes in three-dimensional scenes, such as Figure
    5.1, which shows an image applied to a box to create the appearance of a wooden
    crate. Textures and related concepts (such as UV coordinates) will be briefly
    mentioned in Chapter 1. In this chapter, you will learn all the details necessary
    to use textures in your scenes, including creating a Texture class that handles
    uploading pixel data to the graphics processing unit (GPU), associating textures
    to uniform variables, and sampling pixel data from a texture in a shader. Once
    you have learned the basics, you will learn how to animate effects such as blending
    and distortion. In the last part of the chapter, there are optional sections that
    introduce advanced techniques, such as procedurally generating textures, displaying
    sprite sheet animations, rendering the scene to a texture, and applying postprocessing
    effects such as pixellation and vignette shading. Textures may also be one-dimensional
    and three-dimensional, but the discussion in this chapter will be limited to two-dimensional
    textures.


    #  5.1 A TEXTURE CLASS


    In OpenGL, a texture object is a data structure that stores pixel data from an
    image. In addition, a texture object stores information about which algorithms
    to use to determine the colors of the surface the texture is being applied to;
    this requires some type of computation when the texture and surface are different
    sizes. In this section, you will create a Texture class to easily manage information
    and perform tasks, similar to the motivation for creating an Attribute class in
    Chapter 2. Working with textures involves some additional OpenGL functions, introduced
    and discussed in this section.


    Similar to the process with vertex buffers, you must first identify an available
    texture name or reference, and bind it to a particular type of target. OpenGL
    functions that affect a texture in some way do not directly reference a particular
    texture object; they also contain a target parameter and affect the texture object
    currently bound


