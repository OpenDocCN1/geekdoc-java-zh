  md: '# 62 Developing Graphics Frameworks with Java and OpenGL


    In your application, the variable t will be the total elapsed time. This particular
    circular path is centered at the origin and has radius 1; for a path centered
    at (a, b) with radius r you can use the equations


    ```

    x=r*cos(t)+a, y=r*sin(t)+b

    ```


    To keep the entire triangle visible as it moves along this path, you will need
    to use a radius value less than 1.

    The code for this application is nearly identical to the previous application,
    and so to speak, in the main folder, make a new class named Test_2_7 into this
    new. In the class Test_2_8, delete the code between the comments "update data"
    and "render scene", and in its place, add the following code:


    ```

    translation.data.values[0] = (float) (* 0.75 * Math.cos(time));

    translation.data.values[1] = (float) (* 0.75 * Math.sin(time));

    ```


    With these additions, the code for this application is complete.


    When you run this application, you will see a triangle moving in a circular path
    around the origin, in a counterclockwise direction. The sin and cos functions
    have a period of 2π units, meaning they repeat their pattern of values during
    each interval of length, and the triangle will complete a complete revolution
    around the origin every 2π (approximately 6.283) seconds. Before, part of this
    animation is illustrated with a sequence of images, which are displayed in Figure
    2.12.


    In the final example of this section, instead of an animation based on changing
    position, you will create an animation where the triangle color shifts back and
    forth between red and black. This will be accomplished by using a sine function
    to generate oscillating values. Since the components that specify color components
    range between 0 and 1, while a sine function ranges between -1 and 1, the output
    values from the function will have to be modified. Since the function f(t)=sin(t)
    ranges from -1 to 1, the function f(t)=sin(t)+1 shifts the output values to the
    range 0 to 2. Next, you must scale the size of the range; the function f(t)=(sin(t)+1)/2
    ranges from 0 to 1. Further adjustments are also possible: for example, given
    a constant c, the function sin(c * t) will traverse its values c times faster
    than sin(t). The final version of the equation will use f(t)=(sin(3*t)+1)/2.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_69_0.png)


    FIGURE 2.12 Frames from an animation of a triangle moving along a circular path.'
