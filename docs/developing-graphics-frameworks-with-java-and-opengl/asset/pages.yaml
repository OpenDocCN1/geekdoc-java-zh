  md: '# 100 Developing Graphics Frameworks with Java and OpenGL


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_107_0.png)


    FIGURE 3.28 Various local transformations.


    The concepts of local and global transformation are reflected in everyday language.
    For example, walking forward, backward, left, or right, are examples of local
    translations that depend on the current orientation of a person’s coordinate system:
    in other words, it matters which the person is currently facing. If two people
    are facing in different directions, and they are both asked to step forward, they
    will move in different directions. If a global translation is specified, which
    is typically done by referencing the compass directions (North, South, East, and
    West), then you can be assured that people walk in the same direction, regardless
    of which they may have been facing.


    The question remains: how can matrix multiplication be used to perform local transformations
    (assuming that is possible)? Before addressing this query, it will help to introduce
    a new concept. When transforming a set of points with a matrix, the points are
    multiplied by the vertex shader and the new coordinates are passed along the fragment
    shader, but the new coordinates of the points are not permanently stored. Instead,
    the accumulated transformations that have been applied to an object are stored
    as the product of the corresponding matrices, which is a single matrix called
    the model matrix of the object. The model effect effectively stores the current
    location, orientation, and scale of an object (although it is slightly complicated
    to extract some of this information from the entries of the matrix).


    Given an object shape is defined by a set of points $S$, such that a sequence
    of transformations has been applied and let $M$ denote the current model matrix
    of the object. Thus, the current location of the points of the object can be calculated
    by $M \cdot P$, where $P$ ranges over the points in the set $S$. Let $T$ be the
    matrix corresponding to a transformation. If you were to apply this as a global
    transformation, as described in previous sections, the new model matrix would
    be $T \cdot M$, since each new matrix that applied becomes the leftmost in the
    product (just as functions are ordered in function composition). For the matrix
    $T$ to have the effect of a local transformation on an object, the local coordinate
    axes of the object would have to be aligned with the global coordinate axes that
    suggest the following three-step strategy:


    +   1. Align the two sets of axes by applying $M^{-1}$, the inverse of the model
    matrix.


    +   2. Apply $T$, since local and global transformations are the same when the
    axes are aligned.


    +   3. Apply $M$, the original model matrix, which returns the object to its previous
    state while taking the transformation $T$ into account.'
