    the z coordinates of the nearest points to the viewer should be mapped to the
    value 1, as the positive z-axis points directly at the viewer in our coordinate
    system. However, this is not the case! When OpenGL performs depth testing, it
    determines if one point is closer (to the viewer) than another by comparing their
    coordinates. The type of comparison can be specified by the OpenGL function glDepthFunc,
    which has the default value GL_LESS, an OpenGL constant which indicates that a
    point should be considered closer to the viewer if its z is less. Then in clip
    space, the negative z-axis points directly at the viewer; this space uses a left-handed
    coordinate system. Combining these two points, we now know that if $P_z = -n$,
    then $-b-c/P_z$ should equal -1, and if $P_z = -f$, then $-b-c/P_z$ should equal
    1. This corresponds to the following system of equations:


    ```

    $$-b+c=-1\nn\n$$-b+c=1\nf$$

    ```


    There are a variety of approaches to solve this system; one the simplest is to
    multiply the first equation by -1 and then add it to the second. This eliminates
    $b$; solving for $c$ yields $c=2\cdot n\cdot f/(n-f)$. Substituting this value
    for $c$ into the first equation and solving for $b$ yields $b=(n+f)/(n-f)$.\nWith
    this calculation finished, the matrix is completely determined. To summarize:
    the perspective projection transformation for a frustum-shaped region defined
    by near distance $n$, far distance $f$, vertical angle of view $a$, and aspect
    ratio $r$ when working with homogeneous coordinates, can be achieved with the
    following matrix:


    $$\begin{array}{|c|c|c|c|}\hline 1 & 0 & 0 & 0 \ \hline r\cdot\tan(a/2) & 0 &
    0 & 0 \ \hline 0 & 1/tan(a/2) & 0 & 0 \ \hline 0 & 0 & (n+f)/(n-f) & 2\cdot f/(n-f)
    \ \hline 0 & 0 & -1 & 0 \ \hline\end{array}$$


