    GPU programs to display graphics in the LWJGL application window.


    # 2.2.1 OpenGL Shading Language


    GLSL is a C-style language, as is Java. Similar to Java, there are "if statements"
    to process conditional statements, "for loops" to iterate through a group of statements
    over a range of values, "while loops" to iterate through a group of statements
    as a given condition is true, and functions that take a set of inputs and perform
    some computations (optionally return an output value). Like Java, variables in
    GLSL must be declared with an assigned type, and each of statement must be indicated
    with a semicolon; statements are grouped using braces, comments are preceded by
    "//", and functions must specify the types of their input parameters and return
    value. The details of the features in Java and GLSL syntax will be illustrated
    and indicated as features introduced in the examples throughout this book.'
