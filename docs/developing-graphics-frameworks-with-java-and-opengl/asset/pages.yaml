    \ x \\ y \\ z \\ 1 \\end{bmatrix} = \begin{bmatrix} x+m \\ y+n \\ z+p \\ 1 \\\
    end{bmatrix}$\n```\n\nIn other words, to represent translation as a matrix transformation,\
    \ the space translated is identified with a subset of a higher dimensional space\
    \ with the additional coordinate set to one. This is the reason that four-dimensional\
