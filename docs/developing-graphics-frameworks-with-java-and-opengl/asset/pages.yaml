    # 3.2.4 Projections


    In this section, the goal is to derive a formula for a perspective projection
    transformation. In Chapter 1, at the beginning of the chapter and also in the
    section on geometry processing, some of the core ideas were illustrated and informally
    introduced. To review: the walkable region in the scene needs to be mapped to
    the region defined by OpenGL, a cube where the $x, y,$ and $z$ coordinates are
    all -1 and +1, also referred to as *clip space*. In a perspective projection,
    the shape of the walkable region is a *frustum*, or truncated pyramid. The pyramid
    is oriented so that it is "lying on its side": its central axis is aligned with
    the negative $z$-axis, as illustrated in Figure 3.19, and the viewer or virtual
    camera is positioned at the origin of the scene, which aligns with the point that
    was the tip of the original pyramid. The smaller rectangular end of the frustum
    is nearest to the origin, and the larger rectangular end is farthest from the
    origin. When the frustum is compressed into a cube, the larger end must be compressed.
    This causes objects in the rendered image of the scene to appear smaller the farther
    they are from the viewer.


    The shape of a frustum is defined by four parameters: the *near distance*, the
    *far distance*, the (vertical) *angle of view*, and the *aspect ratio*. The near
    and far distances are


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_100_0.png)


    FIGURE 3.19 The frustum for a perspective transformation.'
