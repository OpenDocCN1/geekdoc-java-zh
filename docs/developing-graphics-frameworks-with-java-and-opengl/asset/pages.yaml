  md: '# Matrix Algebra and Transformations ■ 101


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_108_0.png)


    **FIGURE 3.29** A sequence of global transformations equivalent to a local translation.


    This sequence of transformations is illustrated in Figure 3.29, where the images
    show an object with model matrix $M$ (in this example, translation and then rotation
    by $45^{\circ}$ was applied), the result of applying $M^{-1}$ (reversing the rotation
    and then reversing the translation), the result of applying $T$ (in this example,
    translation), and the result of applying $M$ again (translating and rotating again).
    The last image also shows the output of the object in its original placement for
    comparison.


    At the end of this process, combining all these transformations, the model matrix
    has become $M \cdot T \cdot M^{-1} \cdot M$ (recall that matrices are applied
    to a point from the right to the left). Since $M^{-1} \cdot M = I$ (the identity
    matrix), this expression simplifies to $M \cdot T$: the original matrix $M$ multiplied
    by the right by $T$. This is the answer to the question of interest. To summarize:
    given an object with model matrix $M$ and a transformation with matrix $T$:


    +   - To apply $T$ as a global transformation, let the new matrix equal $T \cdot
    M$.

    - To apply $T$ as a local transformation, let the new model matrix $M \cdot T$.


    As you will see in later sections, being able to use local transformations will
    be useful when creating interactive 3D scenes. For example, navigating within
    a scene feels more intuitive and immersive if one is able to move the virtual
    camera with local transformations. The viewer might not always be aware of the
    direction of the $z$-axis, which could lead to unexpected motions when moving
    in global directions, the viewer is always able to see what is in front of them,
    which makes moving forward more natural.


    # 3.3 A MATRIX CLASS


    Now that you have learned how to derive the various types of matrices that will
    be needed, the next step will be to create a Matrix class. This class will need
    to store the values contained within a matrix, as well as perform the basic operations
    previously discussed: multiplying a matrix by a vector, multiply a matrix by another
    matrix, and calculating the inverse of a matrix. The class will also contain static
    methods to generate matrices corresponding to each of the previously discussed
    geometric transformations: identity, translation, rotation (around each axis),
    scaling, and projection.'
