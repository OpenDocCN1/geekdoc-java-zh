    , 0);\n} else {\n    addUniform(\"bool\", \"useTexture\", 1);\n    addUniform(\"\
    sampler2D\", \"tex\",\n        new Vector(texture.textureRef, 1));\n}\n```\n\n\
    This completes the code required for the FlatMaterial class."
