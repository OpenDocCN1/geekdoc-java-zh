  md: '# Introduction to LWJGL and OpenGL ■ 61


    In the previous application, the movement of the triangle was specified relative
    to whatever its current position was (it continuously moved to the right of its
    starting position). The next application will feature time-based movement: the
    position will be calculated from equations expressed in terms of a time variable.


    Since keeping track of time will be useful in many applications, you will begin
    by adding functionality to the Base class. The variable time will keep track of
    the number of seconds the application has been running, which will be used to
    calculate time-based movement. The variable deltaTime will keep track of the number
    of seconds that have elapsed during the previous iteration of the run loop (typically
    1/60, or approximately 0.017 seconds), which will be useful for future applications.
    The Base class from the core package, adds the following global variables to the
    class:


    ```

    // number of seconds application has been running

    public float time;

    ```


    ```

    // seconds since last iteration of run loop

    public float deltaTime;

    ```


    ```

    // store time data from last iteration of run loop

    private long previousTime;

    private long currentTime;

    ```


    In the startup method, add the following lines of code after the line where the
    running variable is set to true:


    ```

    time = 0;

    deltaTime = 1/60f;

    Current = System.currentTimeMillis();

    previousTime = System.currentTimeMillis();

    ```


    In, the run function, directly after the statement glfwPollEvents() add the following
    code:


    ```

    // recalculate time variables

    Current = System.currentTimeMillis();

    deltaTime = (currentTime - previousTime) / 1000f;

    time += deltaTime;

    previousTime = currentTime;

    ```


    In the next application, a triangle will move along a circular path. This may
    be easily accomplished by using the trigonometric functions (sin) and cosine (cos),
    both of which smoothly oscillate between the values -1 and 1. Positions (x, y)
    along a circular path can be expressed with the equations


    ```

    x = cos(t), y = sin(t)

    ```'
