    Framebuffers, introduced in Chapter 1, are of importance when rendering to a texture.
    When OpenGL is initialized, a frame buffer is automatically generated, containing
    a color buffer and a depth buffer, which is attached to the window that displays
    graphics. When a scene is rendered, the image seen in the window corresponds to
    the data in the color buffer. To render an image to a texture, you will need to
    manually set a framebuffer and configure the attached buffers (color and depth).
    These tasks will require the use of many OpenGL functions, which are discussed
    in what follows.


    The first steps in working with framebuffers are to generate a reference and bind
    it to a target, analog the first steps when working with vertex buffers or textures.
    In the case of framebuffers, this is accomplished with the following OpenGL functions:


    ```

    glGenFramebuffers(bufferCount)

    ```


    Returns a set of nonzero integers representing available framebuffer references.
    The number of references returned is specified by the integer parameter bufferCount.


    ```

    glBindFramebuffer(bindTarget, framebufferRef)

    ```


    The framebuffer referred to by the parameter framebufferRef is bound to the target
    specified by the parameter bindTarget, whose value is an OpenGL constant such
    as GL_FRAMEBUFFER or GL_DRAW_FRAMEBUFFER. Future OpenGL operations affecting the
    same bindTarget will be attached to the referenced framebuffer.


    The buffers used by the framebuffer need to be configured. To use a texture for
    a buffer (as you will for the color buffer), you use the following function:


    ```

    glFramebufferTexture(bindTarget, attachment, textureRef, level)

    ```


    Attaches a texture object specified by textureRef as the type of buffer specified
    by attachment to the framebuffer currently bound to bindTarget. The parameter
    attachment is an OpenGL constant such as GL_COLOR_ATTACHMENTn (for an integer
    n), GL_DEPTH_ATTACHMENT, or GL_STENC_ATTACHMENT. The parameter level is usually
    zero, indicating this is the base image level in the associated mipmap image.


    Similar to textures, renderbuffers are OpenGL objects that store image data, but
    specifically used with and optimized for framebuffers. As, the first steps in
    working with these objects are to generate a reference and bind it to a target,
    which uses the following OpenGL functions:


    ```

    glRenderbuffers(bufferCount)

    ```


    Returns a set of nonzero integers representing available renderbuffer references.
    The number of references returned is specified by the integer parameter bufferCount.'
