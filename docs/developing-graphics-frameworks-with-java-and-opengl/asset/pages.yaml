  md: "# Introduction to LWJGL and OpenGL ■ 47\n\nNow that you have learned how to\
    \ work with multiple buffers, you may want to use them for purposes other than\
    \ positions. For example, as previously mentioned, buffers can be used to store\
    \ vertex colors. Since attribute data is passed into the vertex shader, the color\
    \ data needs to be used in the fragment shader, requires you to pass data from\
    \ the vertex shader to the fragment shader, which is the topic of the next section.\n\
    \n# 2.3.4 Passing Data between Shaders\n\nIn this section, you will create an\
    \ application that renders six points (once again, arranged in a hexagonal pattern)\
    \ in six different colors. This requires data (in particular, the color data)\
    \ to be sent from the vertex shader to the fragment shader. Recall from the introductory\
    \ explanation of GLSL Language that type qualifiers are keywords that modify the\
    \ properties of a variable, and in particular:\n\n+   - In a vertex shader, the\
    \ keyword **in** indicates that values will be supplied from a buffer, while the\
    \ keyword **out** indicates that values will be passed to the fragment shader.\n\
    - In a fragment shader, the keyword **in** indicates that values will be supplied\
    \ from the vertex shader, after being interpolated during the rasterization stage.\n\
    \nThis application described will use the shaders to follow. First, create a new\
    \ text file named `Test_2_5.vert` containing the vertex shader code:\n\n```\n\
    in vec3 position;\nin vec3 vertexColor;\nout vec3 color;\nvoid main()\n{\n   \
    \ gl_Position = vec4(position.x, position.y, position.z, 1.0);\n    color = vertexColor;\n\
    }\n```\n\nNote the presence of **two in** variables; this is because there are\
    \ two vertex attributes **position** and **vertexColor**. The data arrays for\
    \ each of these attributes will be stored in a separate buffer and associated\
    \ to the corresponding variable. The arrays should contain the same number of\
    \ elements; the length of the arrays is the number of vertices. For a given vertex,\
    \ the same array index will be used to retrieve data from each of the attribute\
    \ arrays. For example, the vertex that uses the value from index N in the position\
    \ data arrays will also use the value from index N in the vertex color data.\n\
    \nIn addition, the vertex shader contains an **out variable color**, which will\
    \ be used to transmit the data to the fragment shader; a value must be assigned\
    \ to this (and in general, any **out variable**) within the vertex shader. In\
    \ this case, the value in **vertexColor** just \"passes through\" to the variable\
    \ **color**; no computations are performed on this value."
