  md: "# 26 Developing Graphics Frameworks with Java and OpenGL\n\nThe basic data\
    \ types in GLSL are boolean, integer, and floating point values, indicated by\
    \ bool, int, and float respectively. GLSL also has vector data types, which are\
    \ often used to store values like positions, colors, and texture coordinates.\
    \ Vectors may have two, three, or four components, indicated by vec2, vec3, and\
    \ vec4 (for floats). As a C-like language, GLSL provides arrays and structs: user-defined\
    \ data types. To facilitate graphics-related computations, GLSL also matrix data\
    \ types, which offer transformations (translation, rotation, scaling, and projections),\
    \ and sampler data types, which represent textures; these will be introduced in\
    \ later chapters.\n\nThe components of a vector type can be accessed in multiple\
    \ ways. For example, once vec4 named v has been initialized, its components can\
    \ be accessed using array notation (v[0], v[1], v[2], v[3]) or using dot notation\
    \ with any of the three systems (v.x, v.y, v.z, v.w) or (v.r, v.g, v.b, v.a) or\
    \ (v.s, v.t, v.p, v.q). While all systems are interchangeable, programmers typically\
    \ choose a system related to the context for readability: (x, y, z, w) are used\
    \ for positions, (r, g, b, a) are used for colors (red, green, blue, alpha), and\
    \ (s, t, p, q) are used for texture coordinates.\n\nEvery shader must contain\
    \ a function main, similar to the C programming language. No values are returned\
    \ (which is indicated by the keyword void) and there are no parameters required\
    \ by the main function, thus every shader has the general following structure:\n\
    \n```\nvoid main ()\n{\n    // code statements\n}\n```\n\nIn the description of\
    \ the graphics pipeline from the previous chapter, it was mentioned that a vertex\
    \ shader will receive data about the geometric shapes rendered via buffers. At\
    \ this point, you may be wondering how vertex attribute data is sent from buffers\
    \ to a vertex shader if the main function takes no parameters. Data is passed\
