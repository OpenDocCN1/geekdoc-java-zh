  md: '# 70 Developing Graphics Frameworks with Java and OpenGL


    # 3.1.1 Vector Definitions and Operations


    In Chapter 2, you worked with vector data types, such as vec3, which are data
    structures whose components are floating-point numbers. In this section, you will
    learn about vectors from a mathematical point of view. For simplicity, the topics
    in this section will be introduced in a two-dimensional context. In Section 3.1.3,
    you will learn how each of the concepts is generalized to higher-dimensional settings.


    A coordinate system is defined by an origin point and the orientation and scale
    of a set of coordinate axes. A point P=(x, y) refers to a location in space, specified
    relative to a coordinate system. A point is typically drawn as a dot, as illustrated
    by Figure 3.1. Note that in the diagram, the axes are oriented so that the x-axis
    is pointing to the right, and the y-axis is pointing upward; the direction of
    the arrow represents the direction in which the values increase. The orientation
    of the coordinate axes is arbitrary, although having the x-axis point to the right
    is a standard choice. In many two-dimensional mathematics computer graphics applications,
    as well as OpenGL, the y-axis points upward. However, in many two-dimensional
    the origin is placed in the top-left corner of the screen or drawing area, and
    it is always important to know the orientation of the coordinate system you are
    working in!


    A vector v=(m, n) refers to a displacement – an amount of change in each coordinate
    and is typically drawn as an arrow pointing along the direction of displacement,
    as illustrated by Figure 3.2. The point where the arrow begins is called the initial
    point or tail; the point where the arrow ends is called the terminal point or
    head, and indicates the result when the displacement has been applied to the initial
    point. The distance between


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_77_0.png)


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_77_1.png)'
