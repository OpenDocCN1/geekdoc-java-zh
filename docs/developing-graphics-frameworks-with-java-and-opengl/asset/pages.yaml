    \ to creating and using a Camera object. Fortunately, the key concept can be illustrated\
    \ by a couple of examples.\n\nConsider a scene containing multiple objects in\
    \ front of the camera, and imagine that the camera shifts two units to the left.\
    \ From the perspective of the viewer, all objects in the scene would appear to\
    \ have shifted two units to the right. In fact, these transformations (shifting\
    \ the camera left versus shifting all objects right) are equivalent, in the sense\
    \ that there is no way for the viewer to distinguish between them in the rendered\
    \ image. As another example, imagine that the camera rotates 45° clockwise about\
    \ its vertical axis. To the viewer, this appears equivalent to all objects in\
    \ the world having rotated 45° counterclockwise around the camera. These examples\
    \ illustrate the general notion that each transformation of the camera affects\
    \ the objects in the opposite way. Mathematically, this relationship is captured\
    \ by defining the view matrix, which describes the placement of objects in the\
    \ scene with respect to the camera, as the inverse of the camera's transform matrix.\n\
