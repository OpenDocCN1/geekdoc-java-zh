  md: '# Matrix Algebra and Transformations ■ 71


    the initial and terminal points of the vector is called its length or magnitude,
    and can be calculated from the components of the vector. Vectors are not associated
    to any particular location in space; the same vector may exist at different locations.
    A vector whose initial point is located at the origin (when a coordinate system
    is specified) is said to be in standard position.


    To emphasize the difference between location and displacement, consider navigating
    in a city whose roads are arranged in a grid. If you were to ask someone to meet
    you at the intersection of 42nd Street and 5th Avenue, this refers to a location,
    and corresponds to a point. If you were to travel five blocks North and three
    blocks East from your current position, this refers to a displacement (a change
    in their position), and corresponds to a vector.


    Each of these mathematical objects – points and vectors – are represented by a
    list of numbers, but as explained above, they have different geometric interpretations.
    In this book, notation will be used to distinguish these objects. When referring
    to vectors, bold lowercase letters will be used for variables, and angle brackets
    will be used when listing components, as in $v=(1, 4)$. In contrast, when referring
    to points (that is, non-bold) uppercase letters will be used for variables, and
    standard parentheses will be used when listing components, as in $P=(3, 2)$. Individual
    numbers (that are not part of a point or vector) are often called scalars in this
    context (to distinguish them from points and vectors), Additionally, subscripted
    variables will be used when writing the components of a point or vector, and these
    subscripts may be used as numbers, as in $P=(p_x, p_y)$ or $P=(p_1, p_2)$ for
    points, and $v=(v_1, v_2)$ or $w=(w_1, w_2)$ for vectors.


    While many algebraic operations can be defined on combinations of points and vectors,
    those with a geometric interpretation are most significant in what follows. The
    first operation is vector addition, which combines two vectors $v=(v_1, v_2)$
    and $w=(w_1, w_2)$ and produces a new vector according to the formula


    ```

    v+w = (v_1+w_1, v_2+w_2) = (v_1+w_1, v_2+w_2)

    ```


    For example, $(2,5)+(4,-2)=(6,3)$. Geometrically, this corresponds to displacement
    along the vector $v$, followed by displacement along the vector $w$; this can
    be visualized by aligning the terminal point of $v$ and the terminal point of
    $w$. The result is a new vector $u=v+w$ that shares the initial point of $v$ as
    illustrated in Figure 3.3.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_78_0.png)


    FIGURE 3.3 Vector addition.'
