  md: "![](img/3f6cb2c9587f9f6262512f621ea0f52d_261_0.png)\n\nFIGURE 6.11 Attenuation\
    \ of a light source as a function of distance.\n\nFinally, points also incorporate\
    \ attenuation: the intensity of the light should decrease as the distance d between\
    \ the light source and the surface increases. This effect is is modeled mathematically\
    \ by multiplying the diffuse component by the factor $1/(a+b+cd^2)$, where the\
    \ coefficients $a, b, c$ are used to add the rate at which the light effect decreases.\
    \ Figure 6.11 displays a graph of this function for the default attenuation coefficients\
    \ $a=1, b=0, c=0.1$, which results in the function $1/(1+0+0.1d^2)$. Observe that\
    \ in the graph, the distance d is at a minimum $(d=0)$ the attenuation factor\
    \ is 1, and the attenuation is 50% approximately when $d=3.2$.\n\nTo implement\
    \ the lightCalc function, in the vertex shader code, add the following after the\
    \ declaration of the uniform variables:\n\n```\nvec3 lightCalc(Light light, vec3\
    \ pointPosition, vec3 pointNormal)\n{\n    float ambient = 0;\n    float diffuse\
    \ = 0;\n    float specular = 0;\n    float attenuation = 1;\n    vec3 lightDirection\
    \ = vec3(0,0,0);\n\nif ( light.lightType == 1 ) // ambient light\n{\n    ambient\
    \ = 1;\n} else if ( light.lightType == 2 ) // directional light\n{\n    lightDirection\
    \ = normalize(light.direction);\n} else if ( light.lightType == 3 ) // point light\n\
    {\n    lightDirection = normalize(\n        pointPosition - light.position)\n\
    \    float distance = length(light.position - pointPosition);\n    attenuation\
    \ = 1.0 / (light.attenuation[0] +\n        light.attenuation[1] * distance +\n\
    \        light.attenuation[2] * distance * distance);\n}\n```"
  merge: -1
  pgno: 261
- img_proc: true
  md: "```\nif ( light.lightType > 1 ) // directional or point light\n{\n    pointNormal\
    \ = normalize(pointNormal);\n    diffuse = max ( (pointNormal, -lightDirection),\
    \ 0.0 );\n    diffuse *= attenuation;\n}\n```\n\n```\nreturn light.color * (ambient\
    \ + diffuse + specular);\n```\n\nWith these additions in place, you are ready\
    \ to complete the vertex shader for the flat shading. In addition to the standard\
    \ calculations involving the vertex position and UV coordinates, you also need\
    \ to calculate the total contribution from all of the lights. If data for a light\
    \ variable has not been set, the light's lightType variable defaults to zero,\
    \ which case the value returned by lightCalc function is also zero. Before being\
    \ used in the lightCalc function, the model matrix needs to be applied to the\
    \ position, and the rotational part of the model matrix needs to be applied to\
    \ the normal data. The total contribution is passed from the vertex shader to\
    \ the fragment shader for use in determining the final color of each fragment.\
    \ In the vertex shader, add the following code after the body of the lightCalc\
    \ function.\n\n```\nuniform mat4 projectionMatrix;\nuniform mat4 viewMatrix;\n\
    uniform mat4 modelMatrix;\nin vec3 vertexPosition;\nin vec2 vertexUV;\nin vec3\
    \ faceNormal;\nout vec2 UV;\nout vec3 light;\n```\n\n```\nvoid main ()\n{\n  \
    \  gl_Position = projectionMatrix * viewMatrix * modelMatrix\n        * vec4(vertexPosition,\
    \ 1);\n    UV = vertexUV;\n    // calculate total effect of lights on color\n\
    \    vec3 position = vec3(\n        modelMatrix * vec4(vertexPosition, 1) );\n\
    \    vec3 normal = normalize( mat3(modelMatrix) * faceNormal );\n    light = vec3(0,0,0);\n\
    \    light += lightCalc( light0, position, normal );\n    light += lightCalc(\
    \ light1, position, normal );\n    light += lightCalc( light2, position, normal\
    \ );\n    light += lightCalc( light3, position, normal );\n```"
