    # 4.3.2 Boxes


    A box is a particularly simple 3D shape to render. Although some other 3D shapes
    (such as pyramids) may have fewer vertices, the familiarity of the shape and the
    symmetries in the positions of its vertices make it a natural choice for a first
    3D shape to implement. A box has eight vertices and six sides composed of two
    triangles, for a total of 12 triangles. Since each triangle is specified with
    three vertices, the data arrays for each attribute will contain 36 elements. Similar
    to the Rectangle class just created, the constructor of the Box class will take
    three parameters: the width, height, and depth of the box, referring to lengths
    of the box edges parallel to the x-, y-, and z-axis, respectively. As before,
    the parameters will each have a default value of one, and the box will be centered
    at the origin.


