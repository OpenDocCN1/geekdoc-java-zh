  md: '# Matrix Algebra and Transformations ■ 81


    composition. Thinking of vector functions as geometric transformations, the identity
    function does not change the location of any points; the geometric transformations
    by (0, 0), rotation around the origin by 0°, and scaling all components by a factor
    of 1, are all equivalent to the identity function.


    The concept of identity elements leads to the concept of inverse elements. In
    a given mathematical context, combining an object with its inverse yields the
    identity element. For example, a number x multiplied by its inverse equals 1;
    a function composed with its inverse function yields the identity function. Analously,
    a matrix multiplied by its inverse matrix results in the identity matrix. Symbolically,
    the inverse of a matrix A is a M such that $A \cdot M = I$ and $M \cdot A = I$.
    The inverse of the matrix A is typically written using the notation $A^{-1}$.
    Using a fair pair of algebra, one can find a formula for the inverse of the matrix
    A by solving the equation $A \cdot M = I$ for the entries of $M$:


    ```

    $A \cdot M = \begin{bmatrix} a & b \ c & d \end{bmatrix} \begin{bmatrix} n & 1
    \ p & 0 \end{bmatrix} = I$

    ```


    Solving this equation first involves calculating the product on the left-hand
    side of the equation and setting each entry of the resulting matrix equal to the
    corresponding entry in the identity matrix. This yields a system of four equations
    with four unknowns (the entries of M). Solving these four equations yields the
    formula for the inverse of a 2-by-2 matrix:


    ```

    $M = A^{-1} = \begin{bmatrix} d/(ad-bc) & -b/(ad-bc) \ -c/(ad-bc) & a/(ad-bc)
    \end{bmatrix}$

    ```


    The value $(a\cdot d-b\cdot c)$ appearing in the denominator of each entry of
    the inverse matrix is called the determinant of the matrix A. If this value is
    equal to 0, then the fractions are all undefined, and the inverse of the matrix
    A does not exist. Analogous situations, in which certain elements do not have
    inverse, arise in other mathematical contexts. For example, in ordinary arithmetic,
    the number $x=0$ does not have a multiplicative inverse, as nothing times it equals
    the identity element 1.


    As expected, if an invertible vector function F can be represented with matrix
    multiplication as $F(v)=A \cdot v$, then the inverse function G can be represented
    with matrix multiplication by the inverse of A, as $G(v)=A^{-1} \cdot v$, since


    ```

    $F(G(v)) = A \cdot A^{-1} \cdot v = v$\n$G(F(v)) = A^{-1} \cdot A \cdot v = v$

    ```


    Once again, thinking of vector functions as geometric transformations, the inverse
    of a function performs a transformation that is in some sense the "opposite" or
    "reverse" transformation. As examples: the inverse of translation $(m, n)$ is
    translation by $(-m, -n);'
