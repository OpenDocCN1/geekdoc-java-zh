  md: '# Developing Graphics Frameworks with Java and OpenGL


    Many classes will extend the Object3D class, each with a different role in the
    framework. The root node will be represented by the Scene class. Interior nodes
    that are only used for grouping purposes will be represented by the Group class.
    Nodes corresponding to objects that will be rendered will be represented by the
    Mesh class. There are other objects with 3D characteristics that affect the appearance
    of the scene but are not themselves rendered. One object is a virtual camera from
    whose point of view the scene will be rendered; this will be represented by the
    Camera class. Another object is a virtual light source that affects shading and
    shadows; this will be represented by the Light class (but will not be created
    until a future chapter).


    To keep the framework code modular, each mesh will consist of a Material class
    object. The Geometry class will specify the general shape and other vertex-related
    properties, which the Material class will specify the appearance of an object.
    Since each instance of a mesh stores a transformation matrix, multiple versions
    of a mesh (based on the same geometry and material) can be rendered with different
    positions and orientations. Each mesh will also store a reference to a vertex
    array object, whose references will be stored by attribute objects stored in the
    geometry) to attribute variables (specified by shaders in the material). This
    will allow geometric objects to be reused and rendered with different materials
    in different meshes.


    The Geometry class will mainly serve to store Attribute objects, which describe
    vertex properties, such as position and color, as seen in examples in prior chapters.
    In later chapters, geometric objects will also store texture coordinates, for
    applying images to shapes, and normal vectors, for use in lighting calculations.
    This will calculate the total number of vertices, which is equal to the length
    of the data array stored in attribute. Extensions of the Geometry class will be
    created to realize each particular shape. In some cases, such as rectangles and
    boxes, the data for each attribute will be listed directly. For other shapes,
    as polygons, cylinders, and spheres, the attribute data will be calculated from
    mathematical formulas.


    The Material class will serve as a repository for three types of information related
    to the rendering process and the appearance of an object: shader code (the associated
    program reference), Uniform objects, and render settings: the properties which
    are set by calling OpenGL functions, such as the type of primitive (points, lines,
    or triangles), point size, line width, and so forth. The base Material class will
    initialize to store uniform objects and render setting data, and will define functions
    to perform tasks such as compiling the shader code and locating uniform variable
    references. Extensions of this class will supply the actual shader code, a collection
    of uniform objects corresponding to uniform variables in the shaders, and a collection
    of render setting variables applicable to the type of primitive being rendered.


    A Renderer class will handle the general OpenGL initialization tasks as well as
    rendering the image. The rendering function will require a scene object and a
    camera object as parameters. For each mesh in the scene graph, the renderer will
    perform the tasks necessary before the glDrawArrays function is called, including
    activating the correct'
