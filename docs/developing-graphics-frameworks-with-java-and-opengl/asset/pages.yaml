  md: '# A Scene Graph Framework 149


    For example, different materials will exist for rendering geometric data as a
    collection of points, as a set of lines, or as a surface. Some basic materials
    will implement vertex colors or uniform base colors, while advanced materials
    (developed in later chapters) will implement texture mapping, lighting, and other
    effects. The framework will also enable developers to easily write customized
    shaders in applications.

    The tasks handled by the base Material class will include:


    +   - compiling the shader code and initializing the program

    - initializing collections to store uniforms

    - defining uniforms corresponding to the model, view, and projection matrices,
    whose values are stored outside the material (in mesh and camera objects)

    - define a method named addUniform to simplify creating and adding Uniform objects

    - defining a method named locateUniforms that determines and stores all the uniform
    variable references in the shaders


    Classes that extend this class will:


    +   - contain the actual shader code

    - add any extra uniform objects required by the shaders

    - call the locateUniforms method once uniform objects have been added

    - add OpenGL render settings (as Java variables) to the settings dictionary

    - implement a method named addRenderSettings, which will call the OpenGL functions
    needed to configure the render settings


    # 4.4.1 Material Class


    Since there will be many extensions of this class, all the material-related classes
    will be organized into a separate folder. To this end, in your main folder, create
    a new package called material. To create the base class, in the material package,
    create a new Java class called Material with the following code. (The Rendering
    class referenced here will be introduced immediately after this code listing.)


    ```

    package material;

    import static org.lwjgl.opengl.GL40.*;

    import java.util.HashMap;

    import core.OpenGLUtils;

    import core.Uniform;

    import core.Rendering;

    ```'
