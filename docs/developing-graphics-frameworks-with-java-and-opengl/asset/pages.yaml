    # 6.3 NORMAL VECTORS


    Just as working with textures required the addition of a new attribute (representing
    UV coordinates) to geometry classes, working with lights also requires new attributes,
    as discussed in the beginning of this chapter, representing vertex normal vectors
    and face vectors. The next step is to add attributes containing these two types
    of vectors to the previously created geometry classes: rectangles, boxes, polygons,
    and metric surfaces. The shader code that be created later in this chapter will
    access this data through shader variables named vertexNormal and faceNormal. In
    the case of rectangles, boxes, and polygons, since the sides of these shapes are
    flat, these two types of normal vectors are the same. Curved surfaces defined
    by parametric functions will require slightly more effort to calculate these two
    types of normal vectors.


    # 6.3.1 Rectangles


    Since a rectangle is a flat shape aligned with the xy-plane, the normal vectors
    at each vertex all in the same direction: (0, 0, 1), aligned with the z-axis,
    as illustrated in Figure 6.8.


