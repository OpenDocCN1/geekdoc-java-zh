    \ and vector addition: for any scalar $c$ and vectors $v$ and $w$\n\n```\n$F(c\
    \ \\cdot \\mathbf{v}) = c \\cdot F(\\mathbf{v})$\\nF(\\mathbf{v} + \\mathbf{w})\
    \ = F(\\mathbf{v}) + F(\\mathbf{w})$\n```\n\nAn advantage to working with such\
    \ functions involves the standard basis vectors $i$ and $j$: if $F$ is a linear\
    \ function and the values of $F(i)$ and $F(j)$ are known, then it is possible\
    \ to calculate the value of $F(v)$ for any vector $v$, even when a general formula\
    \ for the function $F$ is not given. For example, assume that $F$ is a linear\
    \ function, $F(i)=\\langle 1, 2\rangle$, and $F(j)=\\langle 3, 1\rangle$. Then\
    \ by using the equations that linear functions satisfy, the value of $F(\\langle\
    \ 4, 5\rangle)$ can be calculated as follows:\n\n```\n$F(\\langle 4, 5\rangle)\
    \ = F(\\langle 4, 0\rangle + \\langle 0, 5\rangle)$\\n$=F(\\langle 4, 0\rangle)\
    \ + F(\\langle 0, 5\rangle)$\\n$=F(\\langle 4 \\cdot 1, 0\rangle) + F(\\langle\
    \ 5 \\cdot 0, 1\rangle)$\\n$=4 \\cdot F(\\langle 1, 0\rangle) + 5 \\cdot F(\\\
