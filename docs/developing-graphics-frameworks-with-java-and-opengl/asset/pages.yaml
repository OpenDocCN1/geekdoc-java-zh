    \ in column form, as:\n\n$F\\left[\begin{matrix} v_1 \\ v_2 \\end{matrix}\\right]=\\\
    left[\begin{matrix} w_1 \\ w_2 \\end{matrix}\\right]$\n\nThe latter of these three\
    \ expressions is most commonly used in a traditional mathematical presentation,\
    \ but the alternative expressions are often used for writing mathematics within\
    \ sentences.\n\nVector functions with differing levels of complexity are easy\
    \ to write. As simple examples, one may consider the zero function, where the\
    \ output is the zero vector:\n\n$F(v_1, v_2) = \\langle 0, 0 \\rangle$\n\nThere\
    \ is also the identity function, where the output is always equal to the input:\n\
    \n$F(v_1, v_2) = \\langle v_1, v_2 \\rangle$\n\nAt the other extreme, one could\
