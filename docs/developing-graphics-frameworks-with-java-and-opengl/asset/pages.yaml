    In 3D space, points are written as $P = (p_x, p_y, p_z)$ or $P = (p_1, p_2, p_3)$,
    and vectors are written as $\mathbf{v} = (v_x, v_y, v_z)$ or $\mathbf{v} = (v_1,
    v_2, v_3)$. Sometimes, for clarity, the components may be written as $x, y,$ and
    $z$ (and in four-dimensional space, the fourth component may be written as $w$).
    Vector addition is defined by


    ```

    $\mathbf{v} + \mathbf{w} = (v_1, v_2, v_3) + (w_1, w_2, w_3) = \langle v_1+w_1,
    v_2+w_2, v_3+w_3 \rangle$

    ```


    While scalar multiplication is defined by


    ```

    $c \cdot \mathbf{v} = c \cdot (v_1, v_2, v_3) = \langle c \cdot v_1, c \cdot v_2,
    c \cdot v_3 \rangle$

    ```


    The standard basis for 3D space consists of the vectors $\mathbf{i} = \langle
    1, 0, 0 \rangle, \mathbf{j} = \langle 0, 1, 0 \rangle,$ and $\mathbf{k} = \langle
    0, 0, 1 \rangle$. Every vector $\mathbf{v} = (x, y, z)$ can be written as a linear
    combination of these vectors as follows:


    ```

    $$\mathbf{v} = (x, y, z) \n = x \cdot (1, 0, 0) + y \cdot (0, 0, 0) + z \cdot
    (0, 0, 1) \n = x \cdot (1, 0, 0) + y \cdot (0, 1, 0) + z \cdot (0, 0, 1) \n =
    x \cdot \mathbf{i} + y \cdot \mathbf{j} + z \cdot \mathbf{k} \$

    ```


    The definition of a linear function is identical for vectors of any dimension,
    as it only involves the operations of vector addition and scalar multiplication;
    it does not refer to the number of components of a vector at all:


    ```

    $F(c \cdot \mathbf{v}) = c \cdot F(\mathbf{v}) \nF(\mathbf{v} + \mathbf{w}) =
    F(\mathbf{v}) + F(\mathbf{w})$

    ```


    The values of a 3D linear function can be calculated for any vector if the values
    of $F(\mathbf{i}), F(\mathbf{j}),$ and $F(\mathbf{k})$ are known, and in general,
    such a function can be written in the form


    $$\begin{bmatrix} x \ y \ z \end{bmatrix} = \begin{bmatrix} a_{11} \cdot x + a_{12}
    \cdot y + a_{13} \cdot z \ a_{21} \cdot x + a_{22} \cdot y + a_{23} \cdot z \
    a_{31} \cdot x + a_{32} \cdot y + a_{33} \cdot z \end{bmatrix} \$'
