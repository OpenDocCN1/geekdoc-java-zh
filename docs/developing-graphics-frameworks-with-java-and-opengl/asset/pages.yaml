    A frequently used technique in computer graphics enabled by rendering to textures
    is postprocessing, which is described in detail and implemented in the next section.


    # 5.9 POSTPROCESSING


    In computer graphics, postprocessing is the application of additional visual effects
    to the rendered scene. Figure 5.30 illustrates three effects applied separately
    to a scene: vignette (reduced brightness towards the edges of an image), color
    inversion, and pixelation.


    In addition, it is also desirable in many situations to chain these effects –
    apply them one after the other in sequence – to create a compound effect. For
    example, to replicate the appearance of older handheld video game systems, one
    could take the base scene used in Figure 5.30 and apply a green tint effect followed
    by a pixelation effect, resulting in the image illustrated in Figure 5.31.


    With the addition of the RenderTarget class from the previous section, incorporating
    postprocessing into the graphics framework is a straightforward task. Each effect
    will be implemented with a simple shader incorporated into a material. There will
    be a sequence of passes, starting with the base scene, each of which is applied
    to a render target. The texture in the next render target in the sequence will
    be used in a material implementing an effect for the next pass in the sequence.
    The last pass in the sequence will use a final render target; if none is specified,
    the window will be the target and the final result of the postprocessing effect
    sequence will be displayed.


    To implement postprocessing functionality, a Postprocessor class will be created.
    This class will maintain lists of Scene, Camera, and RenderTarget objects. The
    original scene and camera will be the first elements in their respective lists.
    All subsequent scenes will consist of a single rectangle; its vertices will be
    aligned with clip to eliminate the need for any matrix transformations in the
    vertex shader. In order to use the


