  md: "# 76 Developing Graphics Frameworks with Java and OpenGL\n\nIt is useful to\
    \ think of the vector $(x, y)$ as being operated on the set of numbers $a, b,\
    \ c, d$, which naturally leads us to a particular mathematical notation: these\
    \ numbers can be grouped into a rectangular array of numbers called a *matrix*,\
    \ typically enclosed within square brackets, and the function $F$ can be rewritten\
    \ as:\n\n```\n$F\\left(\begin{bmatrix} x \\ y\\end{bmatrix}\\right)=\\left[\b\
    egin{matrix} a & b \\ c & d\\end{matrix}\\right]$\n```\n\nIn accordance with this\
    \ notation, the *product* of a matrix and a vector is defined by the equation\n\
    \n```\n$\\left[\begin{matrix} a & b \\ c & d\\end{matrix}\\right]\\begin{bmatrix}\
    \ x \\ y\\end{bmatrix}=\\left[\begin{matrix} a\\cdot x+b\\cdot y \\ c\\cdot x+d\\\
    cdot y\\end{matrix}\\right]$\n```\n\nFor example, consider the linear function\n\
    \n```\n$F\\left(\begin{bmatrix} x \\ y\\end{bmatrix}\\right)=\\left[\begin{matrix}\
    \ 2 & 3 \\ 4 & 1\\end{matrix}\\right]\\begin{bmatrix} x \\ y\\end{bmatrix}$\n\
    ```\n\nThen, $F(5, 6)$ can be calculated as follows:\n\n```\n$F\\left(\\begin{bmatrix}\
    \ 5 \\ 6\\end{bmatrix}\\right)=\\left[\begin{matrix} 2 & 3 \\ 4 & 1\\end{matrix}\\\
    right]\\begin{bmatrix} 5 \\ 6\\end{bmatrix}=\\left[\begin{matrix} 2\\cdot5+3\\\
    cdot6 \\ 4\\cdot5+1\\cdot6\\end{matrix}\\right]$\n```\n\nSimilarly, to calculate\
    \ $F(-3, 1)$:\n\n```\n$F\\left(\\begin{bmatrix} -3 \\ 1\\end{bmatrix}\\right)=\\\
    left[\begin{matrix} 2 & 3 \\ 4 & 1\\end{matrix}\\right]\\begin{bmatrix} -3 \\\
    \ 1\\end{bmatrix}=\\left[\begin{matrix} 2\\cdot(-3)+3\\cdot1 \\ 4\\cdot(-3)+1\\\
    cdot1\\end{matrix}\\right]$\n```\n\nOnce again, it will be helpful to use notation\
    \ to distinguish matrices and other types of mathematical objects (scalars, points,\
    \ and vectors). When referring to a matrix, bold uppercase letters will be used\
    \ for variables, and square brackets will be used to enclose the grid of numbers.\
    \ This notation can be briefly summarize the previous observation: if $F$ is a\
    \ linear function, then $F$ can be written in the form $F(v)=A\\cdot v$ for some\
    \ matrix $A$. Conversely, one can also show that if $F$ is a vector function defined\
    \ by matrix multiplication, that is, $F(v)=A\\cdot v$, then $F$ also satisfies\
    \ the equations that define a linear function; this can be verified by straightforward\
    \ algebraic calculations. Therefore, these two descriptions of vector functions\
    \ — those that are linear and defined by matrix multiplication — are equivalent;\
    \ they define precisely the same set of functions."
