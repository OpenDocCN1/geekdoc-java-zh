  md: "# 216 Developing Graphics Frameworks with Java and OpenGL\n\nThe objects to\
    \ be included in the heads-up display will be added to a second scene, sometimes\
    \ called the HUD layer. In contrast to the primary three-dimensional scene, where\
    \ the scale is arbitrary and a perspective projection is used, the natural unit\
    \ of measurement in the HUD layer is pixels and an orthographic projection is\
    \ used. The viewable region of space in the HUD layer will be a rectangular box,\
    \ whose width and height will be equal to the dimensions of the screen, and depth\
    \ is arbitrary. In general, z coordinates in the HUD layer are only important\
    \ if one object should be rendered above another. When used to determine stack\
    \ order in this way, the z coordinate of an object is also called its z-index.\n\
    \nThe viewable region can be specified by six constants: left, right, bottom,\
    \ top, n, and f respectively; the region satisfies l ≤ r, b ≤ t, and n ≤ -z (the\
    \ negation of z due to the z of direction line, discussed in Chapter 3). This\
    \ region in turn must be projected into the cubic volume rendered by OpenGL, the\
    \ set of points (x, y, z) where all components are bounded by -1 and +1. The necessary\
    \ transformations in each coordinate affine transformations, involving both scaling\
    \ and translation. For example, the transformation of the x coordinate is a function\
    \ of the form F(x)=px+q, and when F(l)=-1 and F(r)=+1, it is possible to algebraically\
    \ solve for the values of p and q in land r. In particular, p=2/(r-l) and q=-(r+l)/(r-l).\
    \ Simple calculations can be used for the transformation needed for the y coordinate\
    \ and the z coordinate. Since homogeneous coordinates are used throughout this\
    \ graphics framework, these can be combined into the following matrix:\n\n| 2\
    \ | 0 | 0 |\n|---|---|---|\n| r-1 | | r+1 |\n| 0 | 2 | 0 |\n| | t-b | t+b |\n\
    | 0 | 0 | 2 |\n| | f-n | f+n |\n| 0 | 1 |\n\nThe next step is to add a method\
