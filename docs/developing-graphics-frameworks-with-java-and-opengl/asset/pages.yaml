    these images appear to call the frame rate and is measured in frames per second
    (FPS). The standard frame rate for movies and television is 24 FPS. Computer monitors
    typically display graphics at 60 FPS. For virtual reality simulations, developers
    aim to attain 90 FPS, as lower frame rates may cause disorientation and other
    negative side effects in users. Since computer graphics must render these images
    in real-time, in response to user interaction, it is vital that computers be able
    to do so quickly.


    In the early 1990s, computers relied on the central processing unit (CPU) circuitry
    to perform the calculations for graphics. Real-time 3D graphics became increasingly
    common in video game platforms (including arcades, game consoles, and personal
    computers), there was increased demand for specialized hardware for these graphics.
    This led to the development of the graphics processing unit (GPU), a term coined
    by the Sony Corporation that referred to the circuitry in their PlayStation video
    game console, released in 1994. The Sony GPU performed graphics-related computational
    tasks while managing a framebuffer, drawing polygons with textures, and shading
    and transparency effects. The term GPU was popularized by the Nvidia Corporation
    in 1999'
