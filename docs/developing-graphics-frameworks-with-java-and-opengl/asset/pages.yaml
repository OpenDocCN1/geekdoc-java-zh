  md: '# 50 Developing Graphics Frameworks with Java and OpenGL


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_57_0.png)


    FIGURE 2.8 Rendering six points with vertex colors, using GL_POINTS.


    During the rasterization stage, points are grouped into geometric primitives:
    points, lines, or triangles, depending on the draw mode specified. The GPU determines
    which pixels correspond to the space occupied by each geometric primitive. For
    each of these pixels, the GPU generates a fragment, which stores the data needed
    to determine the final color of each pixel. Each vertex data passed from the vertex
    shader via an out variable will be interpolated for each of these fragments; a
    weighted average of the vertex values is automatically calculated, depending on
    the distances from the interior point to the original vertices. This interpolated
    value is that corresponds to the corresponding variable in the fragment shader.


    For a numerical example of interpolation, suppose a line segment is drawn between
    a point P1 with color C1 = [1, 0, 0] (red) and a point P2 with color C2 = [0,
    0, 1] (blue). All points along the segment will be colored according to combination
    of values of C1 and C2; points closer to P1 will have colors closer to C1 (more
    red) while points closer to P2 will have colors closer to C2 (more blue). For
    example, the point on the segment exactly halfway between P1 and P2 will be colored
    0.5 * C1 + 0.5 * C2 = [0.5, 0, 0.5], a shade of purple. For another, a point that
    is 25% of the distance from the segment from P1 will be colored 0.75 * C1 + 0.25
    * C2 = [0.75, 0, 0.25], a reddish-purple. Similarly, colors of points within a
    triangle are weighted averages of the colors of its three vertices; the color
    of an interior point depends on the distance from the interior point to each of
    these vertices. To see examples of color interpolation within lines and triangles,
    you can run the previous program by changing the drawMode parameter of glDrawArrays
    to either GL_LINE_LOOP or GL_TRIANGLE_FAN; the results are illustrated in Figure
    2.9.


    Many times, you may want to draw a shape that is a single color. This is technically
    possible using the previous shaders: if your shape has N vertices, you could create
    an array that contains the same color N times. However, there is a much less redundant
    approach to accomplish this task using uniform variables, which are introduced
    in the next section.'
