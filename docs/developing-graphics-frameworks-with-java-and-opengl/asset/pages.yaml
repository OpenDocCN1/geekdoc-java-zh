    Finally, you will create the Phong material, which includes specular light contributions.
    This calculation is similar to the diffuse light calculation, involving the angle
    between two vectors (which can be calculated using a dot product), but in this
    case, the vectors of interest are the reflection of the light direction vector
    and the vector from the viewer or virtual camera to the surface point. These elements
    are illustrated in Figure 6.12. First, the light direction vector $d$ impacts
    the surface at a point. Then the vector $d$ is reflected around the normal vector
    $n$, producing the reflection vector $r$. The vector from the camera to the surface
    is indicated by $v$. The angle is indicated by $a$; it is the angle between the
    vector $r$ and the vector $v$.


    The impact of specular light on an object is typically adjusted by two parameters:
    strength, a multiplicative factor which can be used to make the overall specular
    light effect brighter or dimmer, and shininess, which causes the highlighted region
    to be more blurry or more sharply defined, which corresponds to how reflective
    the surface will be perceived. Figure 6.13 illustrates the effects of increasing
    the shininess value by a factor of 4 in each image from the left to the right.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_265_0.png)


    FIGURE 6.12 The vectors used in the calculation of specular highlights.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_265_1.png)


    FIGURE 6.13 The effect of increasing shininess in specular lighting.'
