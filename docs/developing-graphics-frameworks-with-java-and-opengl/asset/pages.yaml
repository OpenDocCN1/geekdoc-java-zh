  md: '# Introduction to Computer Graphics 9


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_16_0.png)


    **FIGURE 1.9** Different renderings of a sphere: wireframe, vertex colors, texture,
    and with lighting effects.


    In addition to the overall shape of an object, additional information may be required
    to describe how the object should be rendered. The properties or attributes that
    are specific to rendering each individual point are grouped together into a data
    structure called a vertex. At a minimum, a vertex must contain the 3D position
    of the corresponding point. Additional data contained by a vertex includes:


    +   - a color to be used when rendering the point


    +   - *texture coordinates* (UV coordinates), which indicate a point in an image
    that is mapped to the vertex


    +   - a *normal vector*, which indicates the direction perpendicular to a surface,
    and are typically used in lighting calculations


    Figure 1.9 illustrates different renderings of a sphere that make use of these
    attributes. Additional vertex attributes may be defined as needed.


    During the geometry processing stage, the vertex shader is applied to each of
    the vertices; each attribute variable in the shader receives data from a buffer
    to previously specified associations. The primary purpose of the vertex shader
    is to determine the final position of each point being rendered, which is typically
    calculated from a series of transformations:


    +   - The collection of points defining the intrinsic shape of an object may be
    translated, rotated, and scaled so that the object appears to have a particular
    location, orientation, and size with respect to a virtual 3D world. This process
    is called *model transformation*; coordinates expressed from this frame of reference
    are said to be in *world space*.


    +   - There may be a virtual camera with its own position and orientation in the
    virtual world. In order to render the world from the camera''s point of view'
