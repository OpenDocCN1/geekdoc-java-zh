  md: "# 5.6 PROCEDURALLY GENERATED TEXTURES\n\nA procedurally generated texture is\
    \ a texture that is created using a mathematical algorithm, rather than using\
    \ an array of pixels stored in an image file. Procedural textures can yield noise\
    \ textures (similar to Figure 5.17) and simulations of naturally occurring patterns\
    \ such as clouds, water, wood, marble, and other patterns (similar to those in\
    \ Figure 5.19).\n\nThe first step in generating a noise texture is to create a\
    \ function that can produce pseudo-random values in a shader. This can be accomplished\
    \ by taking advantage of the limited precision of the fractional part of floating-point\
    \ numbers, which can be obtained using the GLSL function fract. While a function\
    \ as sin(x) is perfectly predictable, the output of the function fract(235711-sin(x))\
    \ is effectively random for generating images. With regards to the number that\
    \ sin(x) is multiplied by, only the magnitude (and not the particular digits)\
    \ is important. To produce random values across a two-dimensional region, one\
    \ could define a similar function, as fract(235711-sin(14.337*x + 42.418*y)).\n\
    \nNext, you will create a sample application with a custom material that illustrates\
    \ how this function can be used in a shader. To do this, make two new files named\
    \ Test_5_6.vert and Test_5_6.frag. Additionally, you can make a copy of the file\
    \ Test_Template and name it Test_5_6. Inside the vertex shader file, insert the\
    \ following code:\n\n```\nuniform mat4 projectionMatrix;\nuniform mat4 viewMatrix;\n\
    uniform mat4 modelMatrix;\nin vec3 vertexPosition;\nin vec2 vertexUV;\nout vec2\
    \ UV;\nvoid main()\n{\n    vec4 pos = vec4(vertexPosition, 1.0);\n    gl_Position\
    \ = projectionMatrix * viewMatrix * modelMatrix\n    * pos;\n    UV = vertexUV;\n\
    }\",\n```\n\nInside the fragment shader file, insert the following code:\n\n```\n\
    // return a random value in [0, 1]\nfloat random(vec2 UV)\n{\n    return fract(235711.0\
    \ * sin(14.337*UV.x + 42.418*UV.y));\n}\n```\n\nin vec2 UV;\nout vec4 fragColor;"
