  md: '# About the Authors


    Lee Stemkoski is a professor of mathematics and computer science. He earned his
    Ph.D. in mathematics from Dartmouth College in 2006 and has been teaching at the
    college level since. His specialties are computer graphics, video game development,
    and virtual and augmented reality programming.


    James Cona is an up and coming software engineer who studied computer science
    at Adelphi University. Some of his specific interests include music, video game
    programming, 3D graphics, artificial intelligence, and clear and efficient software
    development in general.'
