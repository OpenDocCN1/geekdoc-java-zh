  md: 'OpenGL functions that allow you to take advantage of the graphics capabilities
    of the GPU and render some truly impressive 3D scenes. The steps involved in this
    rendering process are described in detail in the sections that follow.


    # 1.2 THE GRAPHICS PIPELINE


    A pipeline is an abstract model that describes a sequence of steps needed to render
    a 3D scene. Pipelining a computational task to be split into subtasks, each of
    which can be worked on in parallel, similar to an assembly line for manufacturing
    products in a factory, which increases overall efficiency. Graphics pipelines
    increase the efficiency of the rendering process, enabling images to be displayed
    at faster rates. Multiple pipeline models are possible; the one described in this
    section is commonly used for rendering real-time graphics using OpenGL, which
    consists of four stages (illustrated by Figure 1.7):


    +   * Application Stage: initializing the window where rendered graphics will
    be displayed, sending data to the GPU.

    * Geometry Processing: determining the position of each vertex of the geometric
    shapes to be rendered, implemented by a program called a vertex shader.

    * Rasterization: determining which pixels correspond to the geometric shapes to
    be rendered.

    * Pixel Processing: determining the color of each pixel in the rendered image,
    involving a program called a fragment shader.


    Each of these stages is described in more detail in the sections that follow;
    the next chapter contains code that will begin to implement many of the processes
    described here.


    # 1.2.1 Application Stage


    The application stage primarily involves processes that run on the CPU. One of
    the first tasks is to create a window where the rendered graphics will be displayed.
    When working with OpenGL, this can be accomplished using a variety of programming
    languages. The window (or a canvas object) must be initialized so that the graphics
    are read from the GPU frame buffer. In the case of animated or interactive applications,
    the main application contains a loop that re-renders the scene repeatedly, aiming
    for a rate of 60 FPS. Other processes that may be handled by the CPU include monitoring
    hardware for user input events, or running algorithms for tasks such as physics
    simulation and collision detection.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_14_0.png)


    FIGURE 1.7 The graphics pipeline.'
  merge: -1
