    # 4.3.3 Polygons


    Polygons (technically, regular polygons) are two-dimensional shapes such that
    all sides have the same length and all angles have equal measure, such as equilateral
    triangles, squares, pentagons, hexagons, and so forth. The corresponding class
    will be designed so that may produce a polygon with any number of sides (three
    or greater). The coordinates of the vertices can be calculated by using equally
    spaced points on the circumference of a circle of radius R can be expressed with
    the parametric equations $x = R \cdot \cos(t)$ and $y = R \cdot \sin(t)$. Note
    that these parametric equations also satisfy the implicit equation of a circle
    of radius $x^2+y^2=R^2$, which can be verified with the trigonometric identity
    $\sin^2(t)+\cos^2(t)=1$. The key is to find the required values of the angle $t$
    that that correspond to these equally spaced points. This in turn is calculated
    using multiples of a base angle $A$, equal to $2\pi$ divided by the number of
    sides of the polygon being generated, as illustrated with a nonagon in Figure
    4.11.


    Once it is understood how the vertices of a polygon can be calculated, one must
    also consider how the vertices will be grouped into triangles. In this case, each
    triangle will have one vertex at the origin (the center of the polygon) and two
    adjacent vertices on the circumference of the polygon, ordered counterclockwise
    as usual. In addition, the same three vertex colors will be repeated in each triangle
    for simplicity. To proceed, in the geometry package, create a new Java class called
    PolygonGeometry with the following code:


    ```

    package java.util.Arrays;

    import java.util.ArrayList;

    import math.Vector;

    ```


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_141_1.png)


    FIGURE 4.11 Calculating the vertices of a regular polygon.'
