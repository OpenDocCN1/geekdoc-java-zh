    Next, ignoring x-coordinates for a moment, consider a point $P=(P_y, P_z)$ in
    the frustum that will be projected onto this new projection window. Drawing a
    line from $P$ to the origin, let $Q=(Q_y, Q_z)$ be the intersection of the line
    with the projection window, as illustrated in Figure 3.24. Adding a perpendicular
    line from P to the $z$-axis, it becomes clear that we have two similar right triangles.
    Since that the bases of the triangles are located on the negative $z$-axis, but
    lengths of sides are proportional, the lengths of the sides are the negatives
    of the $z$-coordinates. The sides of similar triangles are proportional to each
    other, so we know that $P_y/(-P_z)=Q_y/(-Q_z)$. Since $Q$ is a point on the adjusted
    projection window, we also know that $Q_z=-d$. This enables us to write a formula
    for the $y$-coordinate of the projection: $Q_y=d \cdot P_y/(-P_z)$.


    At first glance, this may appear incompatible with our matrix-based approach,
    as this formula is not linear due to the division by the $z$ coordinate. Fortunately,
    the fact that we are working in homogeneous coordinates $(x, y, z, w)$ will enable
    us to resolve this problem. Since this point will be converted to $(x/w, y/w,
    z/w)$ by perspective division (which is automatically performed by the GPU after
    the vertex shader is complete), the “trick” is to use a matrix to change the value
    of the $w$-component (which is typically equal to one value of the $z$-component
    (or more precisely, the negative of the $z$-component)). This can be achieved
    with the following matrix transformation (where $*$ indicates an as-yet unknown):


    ```

    \begin{bmatrix} * & * & * & P_c \ 0 & 0 & 0 & P_y \ * & * & * & P_z \ 0 & 0 &
    -1 & 0 \end{bmatrix} = \begin{bmatrix} * \ d \cdot P_y \ * \ -P_z \end{bmatrix}$

    ```


    Then, after performing the division transformation, the homogeneous point $(*,
    d \cdot P_y, *, -P_z)$ is transformed into $(*, d \cdot P_y/(-P_z))$, as desired.


