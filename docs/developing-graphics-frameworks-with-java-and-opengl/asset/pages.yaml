    and cellular noise algorithms, the functions here will be sufficient for our purposes.
    The next step will be to use these functions to produce random images simulating
    textures found in nature, such as those illustrated in Figure 5.24, which are
    meant to resemble clouds, lava, marble, and wood.


    All of the examples from Figure 5.24 are generated by mixing two different colors,
