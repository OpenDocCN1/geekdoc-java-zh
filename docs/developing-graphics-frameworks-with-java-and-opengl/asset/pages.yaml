  md: '![](img/3f6cb2c9587f9f6262512f621ea0f52d_246_0.png)


    **FIGURE 6.4** The Lambert and Phong illumination models on a torus-shaped surface.


    An illumination model is a combination of lighting types used to determine the
    color at each point on a surface. Two of the most commonly used illumination models
    are the Lambert model and the Phong model, illustrated in Figure 6.4. The Lambert
    model uses a combination of ambient and diffuse lighting, particularly appropriate
    for simulating the appearance of matte or rough surfaces, where most of the light
    rays meet the surface are scattered. The Phong model uses ambient, diffuse, and
    specular lighting, and is particularly appropriate for reflective or shiny surfaces.
    Due to the additional lighting data and calculations required, the Phong model
    is more computationally intensive than the Lambert model. The strength or sharpness
    of the shine in the Phong model can be adjusted by parameters stored in the corresponding
    material, and if the strength of shine is set to zero, the Phong model generates
    results identical to the Lambert model.

    The magnitude of the effect of a light source at a point depends on the angle
    at which a ray of light meets a surface. This angle is calculated as the angle
    between two vectors: the direction vector of the light ray, and a *normal vector*:
    a vector perpendicular to the surface. Figure 6.5 illustrates normal vectors for
    multiple surfaces as short line segments. When calculating normal vectors to a
    surface, one has the option of using either vertex normal vectors or face normal
