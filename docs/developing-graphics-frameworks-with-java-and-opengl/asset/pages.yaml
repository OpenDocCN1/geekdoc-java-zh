    # 5.3 USING TEXTURES IN SHADERS


    Once you have implemented UV coordinates for at least one geometric shape, the
    next step is to focus on adding shader code that supports this functionality.
    Sampling refers to the process of calculating a color based on the information
    stored in a texture; this calculation is performed by a texture unit, to which
    a texture object is assigned. To perform sampling in a shader program, you will
    use a uniform variable of type sampler2D, which stores a reference to a texture
    unit. You will also use the function texture, which takes a sampler2D and a vector
    (containing UV coordinates) as inputs, then performs the sampling calculation.


    There are a limited number of texture units available by any shader at any time.
    In OpenGL 3.0 and above, there are a minimum of 16 texture units available. This
    number may be greater for some systems depending on the implementation of OpenGL,
    but only 16 texture units are guaranteed to exist. It may be possible to create
    many more texture units than this, depending on the size of the image data in
    each texture object and the storage capacity of the GPU. However, when rendering
    any particular primitive, you may use the data from most 16 of these texture objects,
    as they are accessed through the texture units.


    In order to work with multiple texture units (as you will later on in this chapter),
    you will need to use the following OpenGL function:


    ```

    glActiveTexture(textureUnitRef)

    ```


    Activates a texture unit specified by the parameter textureUnitRef. any texture
    objects that are bound using glBindTexture are assigned to the active texture
    unit. The value of textureUnitRef is an OpenGL constant GL_TEXTURE0, GL_TEXTURE1,
    GL_TEXTURE2,, with maximum value depending on the number of texture units supported
    by the particular OpenGL implementation. These constants form a consecutive set
    of integers, so that for any positive integer n, GL_TEXTUREn is equal to GL_TEXTURE0
    + n.


    Due to the immense step of assigning the texture object to a texture unit that
    whose reference is stored in a shader variable, each Uniform object that represents
    a sampler2D will store a list in its data field containing reference for the texture
    object, followed by the number of the texture unit to be used. Unlike texture
    object references, which must be generated by the OpenGL function glGenTextures,
    texture units may be chosen by the developer. In addition, you will need to use
    the previously discussed OpenGL function glUniform1 to upload the number of the
    texture unit (not the OpenGL constant) to the sampler2D variable. In other words,
    using the previously established notation, if the texture unit is GL_TEXTUREn,
    the integer n should be uploaded to the sampler2D variable.'
