  md: '# Matrix Algebra and Transformations 91


    It can quickly be established that this transformation cannot be represented with
    a two-by-two matrix. For example, consider translation by $(2,0)$. If this could
    be represented as a matrix transformation, then it would be possible to solve
    the following equation for the constants $a, b, c,$ and $d$:


    ```

    $$\begin{bmatrix} a & b \ c & d \end{bmatrix} \begin{bmatrix} x \ y \end{bmatrix}
    = \begin{bmatrix} a\cdot x+b\cdot y \ c\cdot x+d\cdot y \end{bmatrix} = \begin{bmatrix}
    x+2 \ y \end{bmatrix}$

    ```


    Matching coefficients of $x$ and $y$ leads to $a=1, c=0, d=1$, and the unavoidable
    expression $b=2/y$, which is not a constant value for $b$. If the value $b=2$
    were chosen, the resulting matrix would not produce a translation—it would correspond
    to a *shear transformation*.


    ```

    $$\begin{bmatrix} 1 & 2 \ 0 & 1 \end{bmatrix} \begin{bmatrix} x \ y \end{bmatrix}
    = \begin{bmatrix} x+2\cdot y \ y \end{bmatrix}$

    ```


    This shear transformation is illustrated in Figure 3.18, where the dot-shaded
    square on the left side is transformed into the dot-shaded parallelogram on the
    right side.

    Observe that, in Figure 3.18, the points along each horizontal line are being
    translated by a constant amount that depends on the $y$-coordinate of the points
    on the line; this is the defining characteristic of any shear transformation.
    In particular example, the points along the line $y=1$ are translated 2 units
    to the right, the points along $y=2$ are translated 4 units to the right, and
    so; the points along $y=p$ are translated $2p$ units to the right.


    The goal is to find a matrix that performs a constant translation on the *complete*
    set of points in a space; a shear transformation performs a constant translation
    on a subset of points in a space. This observation is the key to finding the desired
    matrix, and requires a new way of thinking about points. Consider a one-dimensional
    space, which would consist of only an $x$-axis. A translation on this space would
    consist of adding a constant number $m$ to each $x$ value. To realize this transformation
    as two-dimensional space, we consider a copy of the one-dimensional space embedded
    in the line $y = 1$; symbolically, identifying the one-dimensional point $x$ with
    the two-dimensional point $(x, 1)$. Then, one-dimensional translation by $m$ corresponds
    to the matrix calculation:


    ```

    $$\begin{bmatrix} 1 & m \ 0 & 1 \end{bmatrix} \begin{bmatrix} x \ 1 \end{bmatrix}
    = \begin{bmatrix} x+m \ 1 \end{bmatrix}$

    ```


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_98_0.png)


    FIGURE 3.18 A shear transformation along the x direction.'
