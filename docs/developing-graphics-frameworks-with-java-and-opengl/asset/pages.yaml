  md: '# Light and Shadow


    Lighting effects can greatly enhance the three-dimensional (3D) nature of a scene,
    as illustrated in Figure 6.1, which illustrates a light source and shaded objects,
    specular highlights, bump map textures that simulate surface detail, a postprocessing
    effect to simulate a glowing sun, and shadows from objects onto other objects.


    When using lights, the colors on a surface may be brighter or dimmer, depending
    on the angle at which the light meets the surface. This effect is called shading,
    and enables viewers to observe the 3D nature of a shape in a rendered image, without
    the need for vertex colors or textures, as illustrated in Figure 6.2.


    In this chapter, you will learn how to calculate the effects of different types
    of lights, such as ambient, diffuse, and specular, as well as how to simulate
    different light sources as directional lights and point lights. Then you will
    create new types of Light to store this data, update various geometric classes
    to store related data, create a set of materials to process this data, and incorporate
    all these elements into the rendering process. Finally, you will learn about and
    implement the advanced topics illustrated by Figure 6.1, including bump mapping
    to simulate surface details, additional postprocessing techniques to generate
    light bloom and glow effects, and shadow mapping, which enables objects to cast
    shadows on other objects.


    # 6.1 INTRODUCTION TO LIGHTING


    There are many different types of lighting that may be used when rendering an
    object. Ambient lighting affects all points on all geometric surfaces in a scene
    by the same amount. Ambient light simulates lights that have been reflected from
    other surfaces, and ensures that objects or regions not directly lit by other
    types of lights remain at partially visible. Diffuse lighting represents light
    that has been scattered and thus appear lighter or darker in various regions,
    depending on the angle of the incoming light. Specular lighting creates bright
    spots and highlights on a surface to simulate shininess: the tendency of a surface
    to reflect light. These three types of lighting applied to a torus-shaped surface
    are illustrated in Figure 6.3. (A fourth type of lighting is emissive, which is
    light emitted by an object that can be used to create a glow-like effect, but
    this will not be covered here


