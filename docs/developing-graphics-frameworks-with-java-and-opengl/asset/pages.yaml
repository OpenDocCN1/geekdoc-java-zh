    \ 1, 2\rangle + 5 \\cdot \\langle 3, 1\rangle$\\n=\\langle 4, 8\rangle + \\langle\
    \ 15, 5\rangle$\\n=\\langle 19, 13\rangle$\n```\n\nIn a similar way, the general\
    \ formula for $F(\\langle x, y\rangle)$ for this example can be calculated:\n\n\
    ```\n$F(\\langle x, y\rangle) = F(\\langle x, 0\rangle + \\langle 0, y\rangle)$\\\
