  md: '# Developing Graphics Frameworks with Java and OpenGL


    Another class of tasks performed by the application includes reading data required
    for the rendering process and sending it to the GPU. This data may include vertex
    attributes (which describe the appearance of the geometric shapes being rendered),
    images that will be applied to surfaces, and source code for the vertex shader
    fragment shader programs (which will be used later on the graphics pipeline).
    OpenGL describes the functions that can be used to transmit this data to the GPU;
    these functions are accessed through the bindings of the programming language
    used to write the application. Vertex attribute data is stored in GPU memory buffers
    vertex buffer objects (VBOs), images that will be used as textures are stored
    in texture buffers. It is important to note that this stored data is not initially
    assigned to any particular program variables; these associations are specified
    later. Finally, source code for the vertex shader and fragment shader programs
    needs to be sent to the GPU, compiled, and loaded. If needed, buffer data can
    be updated during the application''s main loop, and additional data can be sent
    to shader programs as well.


    Once the necessary data has been sent to the GPU, before rendering can take place,
    the application needs to specify the associations between attribute data stored
    in VBOs and attribute variables in the vertex shader. A single geometric shape
    may have multiple attributes for each vertex (such as position and color), and
    the corresponding data is streamed from buffers to variables in the shader during
    the rendering process. It is also frequently necessary to work with many sets
    of such associations: there may be multiple geometric shapes (with data stored
    in different buffers) that are rendered by the same shader program, or each shape
    may be rendered by a different shader program. These sets of associations can
    be conveniently managed by using vertex array objects (VAOs), which store this
    information and can be activated and deactivated as needed during the rendering-process.


    # 1.2.2 Geometry Processing


    In computer graphics, the shape of a geometric object is defined by a mesh: a
    collection of points that are grouped into lines or triangles, as illustrated
    in Figure 1.8.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_15_0.png)'
  merge: -1
