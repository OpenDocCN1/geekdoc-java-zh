  md: '# 10 Developing Graphics Frameworks with Java and OpenGL


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_17_0.png)


    FIGURE 1.10 One scene rendered from multiple camera locations and angles. occupying
    either a box-shaped or frustum-shaped region,


    +   - The set of points in the world considered to be visible, occupying either
    a box-shaped or frustum-shaped region, must be scaled to and aligned with the
    space rendered by OpenGL: a cube-shaped region consisting of all points whose
    coordinates are -1 and 1. The position of each point returned by the vertex shader
    is assumed to be expressed in this frame of reference. Any points outside this
    region are automatically discarded or clipped from the scene; coordinates expressed
    at this stage are said to be in clip space. This task is accomplished with a projection
    transformation. More specifically, it is called orthographic projection or perspective
    projection, depending on whether the shape of the visible region is a box or a
    frustum. A perspective projection is generally considered to produce more realistic
    images, as objects that are farther away from the virtual camera will require
    greater compression by the transformation and thus appear smaller when the scene
