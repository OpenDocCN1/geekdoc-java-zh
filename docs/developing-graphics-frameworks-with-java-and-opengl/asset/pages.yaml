    in disjoint pairs, as in (A, B), (C, D), (E, F), resulting in a set of disconnected
    line segments. Alternatively, they could be grouped in overlapping pairs, as in
    (A, B), (B, C), (C, D), (D), (E, F), resulting in a set of connected line segments
    (a line strip). The type of geometric primitive and method for grouping points
    is specified using an OpenGL function when the rendering process begins. The process
    of grouping points into geometric primitives is *primitive assembly.*


    Once the geometric primitives have been assembled, the next step is to determine
    which pixels correspond to the interior of each geometric primitive. Since pixels
    are discrete units, they will typically approximate the continuous nature of a
    geometric shape, and a criterion must be given to clarify which pixels are in
    the interior. Three simple criteria could be:


    +   - the entire pixel area is contained within the shape

    - the center of the pixel is contained within the shape

    - any part of the pixel is contained within the shape


    These effects of applying each of these criteria to a triangle is illustrated
    in Figure 1.12, where the original triangle appears outlined in blue, and pixels
    meeting the criteria are shaded gray.

    For each pixel corresponding to the interior of a shape, a *fragment* is created:
    a collection of data used to determine the color of a single pixel in a rendered
    image. The data stored in a fragment always includes the *raster position*, also
    called *pixel coordinates*. When rendering a 3D scene, fragments will also store
    a *depth value*, which is needed when points on different geometric objects would
    overlap from the perspective of the viewer. When this happens, the associated
    fragments would correspond to the same pixel, and the depth value determines which
    fragment''s data should be used when rendering this pixel.

    Additional data may be assigned to each vertex, as a color, and passed from the
    vertex shader to the fragment shader. In this case, a new data field is added
    to each fragment. The value assigned to this field at each interior point is *interpolated*
    from the values at the vertices: calculated using a weighted average, depending
    on the distance from the interior point to each vertex. The closer an interior
    point is to a vertex, the greater the weight of that vertex''s value when calculating
    the interpolated value. For example, if


