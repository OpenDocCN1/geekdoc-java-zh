    # 3.1.3 Vectors and Matrices in Higher Dimensions


    All of these vector and matrix concepts can be generalized to three, four, and
    even higher dimensions. In this section, these concepts will be restated in a
    3D context. The generalization to four-dimensional space follows the same algebraic
    pattern. Four-dimensional vectors and matrices are used quite frequently in computer
    graphics, for reasons discussed later in this chapter.


    Three dimensional coordinate systems are drawn using $xyz$-axes, where each axis
    is perpendicular to the other. Assuming that the axes are oriented as in Figure
    3.1, so that the plane spanned by the $x$- and $y$-axes are aligned with the window
    to display graphics, there are two possible directions for the $(positive)$ $z$-axis
    (in the direction the viewer or away from the viewer). These two systems are called
    *right-handed* and *left-handed* coordinate systems, respectively, named so by
    the hand-based mnemonic used to remember the orientation. To visualize the relative
    orientation of the axes in a right-handed coordinate system, use your right hand,
    imagine your index finger along the $x$-axis, and your middle finger perpendicular
    to this (in the direction the palm of your hand is facing), pointing along the
    $y$-axis. Then your extended thumb will be pointing in the direction of the $z$-axis;
    this is illustrated in Figure 3.8. If the $z$-axis were pointing in the opposite
    direction, this would correspond to a left-handed coordinate system, and indeed
    this would the orientation indicated by carrying out the steps above with your
    left hand. Some descriptions of the right-hand rule, instead of indicating the
    directions of the $x$ and $y$ axes with extended fingers, will suggest the fingers
    of your hand in the direction from the $x$-axis to the $y$-axis; your extended
    thumb still indicates the direction of the $z$-axis, and the two descriptions
    have the same result.


    In mathematics, physics, and computer graphics, it is standard practice to use
    a right-handed coordinate system, as shown on the left side of Figure 3.9. In
    computer graphics, the positive $z$-axis points directly towards the viewer. Although
    the axes are perpendicular to each other, when illustrated in this way, it may
    first be difficult to see that the $z$-axis is perpendicular to the other axes.
    In this case, it may aid with visualization to imagine the $xyz$-axes as aligned
    with the edges of a cube hidden from view, illustrated with dashed lines as shown
    on the right side of Figure 3.9.


