    \nFIGURE 4.15 Sphere and ellipsoid.\n\nR = 0. Since the equations for x, y, and\
    \ z formulas must also satisfy the implicit equation of a unit sphere, x² + y²\
    \ + z² = 1, you can substitute the formulas for x and z into this equation and\
    \ simplify to get the equation R² + y² = 1. Rather than solve for R as a function\
    \ of y, it is more productive to use again the parametric equations for a circle,\
    \ letting R=cos(v) and y=sin(v). For R and y to have the values previously described,\
    \ the values of v must range from -π/2 to π/2. This yields the full parametrization\
    \ of the unit sphere:\n\n(x, y, z) = {sin(u)cos(v), sin(v), cos(u)cos(v)}\n\n\
    For additional flexibility, you may scale the parametric equations for x, y, and\
    \ by different amounts, resulting in a shape called an ellipsoid, illustrated\
    \ on the right side of Figure 4.15. Then a sphere can be considered a special\
    \ case of an ellipsoid, where the scaling amounts are equal along each direction.\n\
    \nTo implement these shapes, you will start with an ellipsoid. The size parameters\
    \ will be called width, height, and depth, and used in the same way as the corresponding\
    \ parameters that define the size of a box. In the geometry package, create a\
