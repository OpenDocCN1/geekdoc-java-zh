  md: '# Light and Shadow ■ 281


    information stored by the shadow camera object (its projection matrix and view
    matrix).

    Position calculations are most efficiently handled in a vertex shader, where the
    standard model/view/projection multiplications are typically performed. The result
    will be in clip space coordinates, where the coordinates of points in the visible
    region are each in the range from -1 to 1. Once this is performed on the vertex
    position, this value (which will be called the shadow position, as it is derived
    from shadow camera data) will be transmitted to the fragment shader and interpolated
    for each fragment.


    In the fragment shader, the coordinates of the shadow position variable can be
    used to calculate and recover the required depth values. The x and y coordinates
    can be used to derive the coordinates of the pixel in the rendered image (as viewed
    from the shadow camera), or more importantly, the UV coordinates corresponding
    to that pixel, which are needed to retrieve a value stored in the depth texture.
    Since clip space coordinates range from -1 to 1, while UV coordinates range from
    zero to one, the shadow position coordinates need to be transformed before sampling
    the texture. Recall that the value retrieved from the depth texture distance to
    the closest point (relative to the shadow camera of reference), and is in the
    range from zero to one. The distance from the fragment being processed to the
    shadow camera is greater, then a different point is closer to the shadow camera
    along this direction, in which case the fragment is considered to be shadow and
    its color will be adjusted accordingly.


    With this knowledge, you are now prepared to add shadow effects to the graphics
    framework.


    # 6.9.2 Adding Shadows to the Framework


    The steps involved in shadow casting functionality to the graphics framework are
    similar to the steps involved in adding the lighting effects at the beginning
    of this chapter. First, a special material called DepthMaterial will be created
    to generate the depth texture during the shadow pass. A Shadow class will be created
    to store the objects necessary for shadow calculations (including a reference
    to the directional light, the shadow camera, and a target to be used during the
    shadow pass). The LambertMaterial and PhongMaterial classes, a shadow struct will
    be defined to group related variables in the shadow calculations. The vertex and
    fragment shaders will be updated with additional uniform objects and code. The
    Uniform class will be extended to store Shadow objects and upload the corresponding
    fields in a uniform variable in the shaders. Finally, the Renderer class will
    be updated with a new enableShadows method, which will generate a Shadow object
    and cause a shadow pass to be performed by the render method before the main scene
    is rendered. As usual, as the framework classes have been updated, you will create
    an interactive scene to verify that everything works as expected.'
