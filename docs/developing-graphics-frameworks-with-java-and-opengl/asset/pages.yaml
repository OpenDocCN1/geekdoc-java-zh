  md: 'Matrix Algebra and Transformations 99


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_106_0.png)


    FIGURE 3.26 A sequence of global transformations.


    called world coordinates or global coordinates, and this aspect is emphasized
    by the more specific term global transformations.

    The internal or local coordinate system used to define the vertices of a geometric
    object is somewhat arbitrary – the origin point and the orientation and scale
    of the global coordinate axes are typically chosen for convenience, without reference
    to the global coordinate system. For, the local origin is frequently chosen to
    correspond to a location on the object that is in some sense the “center” of the
    object. Locations specified relative to this coordinate system are called object
    coordinates or local coordinates. After an object is added to a 3D scene, the
    object can be repositioned, oriented, and resized as needed using geometric transformations.

    Of particular interest in this section are local transformations: transformations
    relative to the local coordinate system of an object, and how they may be implemented
    with matrix multiplication. Initially, the local coordinate axes of an object
    are aligned with the global coordinate axes. As an object is transformed, its
    local coordinate axes undergo the same transformations. Figure 3.27 illustrates
    multiple copies of the turtle object together with their local axes after various
    transformations have been applied.

    Figure 3.28 illustrates several examples of local transformations. Assuming the
    turtle starts at the state with position and orientation in the leftmost image,
    the remaining images show local translation by (2, 0), local translation by (0,
    1), and local rotation by 45°, each applied to the starting state. Observe in
    particular that a local rotation takes place around the center of the object (the
    origin of its local coordinate system), rather than around the world or global
    origin.


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_106_1.png)


    FIGURE 3.27 Transforming local coordinate axes.'
