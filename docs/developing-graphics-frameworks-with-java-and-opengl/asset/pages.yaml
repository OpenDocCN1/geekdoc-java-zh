    # 5.2 TEXTURE COORDINATES


    Texture coordinates (also known as UV coordinates) are used to specify which points
    of an image correspond to which vertices of a geometric object. Each coordinate
    ranges from zero to one, with the point (0,0) corresponding to the lower-left
    corner of the image, and the point (1,1) corresponding to the upper-right corner
    of the image. Typically, these values are passed from the vertex shader to the
    fragment shader (automatically interpolated for each fragment), and then the UV
    coordinates are used to select a point on the texture from which the color of
    the fragment will be generated. Figure 5.5 shows a sample image, and two of the
    many ways that UV coordinates can be applied to the vertices of a triangle, in
    order to map different parts of the image to the triangle.


    The next step will be to add a new attribute containing UV coordinates to the
    previously created geometries: rectangles, boxes, polygons, and parametric surfaces.
    The shader code that will be created later in this chapter will access this data
    through a shader variable vertexUV.


