  md: "# Matrix Algebra and Transformations ■ 105\n\nNext, for reversing geometric\
    \ transformations, as well as calculations involving the virtual camera (briefly\
    \ mentioned in Section 1.2.2, and which will be discussed in detail in Chapter\
    \ 4), it is necessary to be able to calculate the inverse of a matrix. The theoretical\
    \ details would take us far afield; the interested reader can find the algebraic\
    \ derivation in any algebra reference text. The related concepts include the minor\
    \ of a matrix (a smaller matrix containing a subset of the values of the original\
    \ matrix), the determinant of a matrix (a value that naturally appears in the\
    \ calculation of inverse matrices, that can be calculated recursively), and the\
    \ transpose of a matrix (which interchanges the rows and columns of matrix). To\
    \ proceed, in the Matrix class, add the following methods:\n\n```\n// generate\
    \ the (rows-1) by (cols-1) submatrix,\n// excluding given row and column.\npublic\
    \ Matrix minor(int excludeRowNum, int excludeColNum)\n{\n    Matrix m = new Matrix(this.rows-1,\
    \ this.cols-1);\n    int minorRowNum = 0, minorColNum = 0;\n    for (int row =\
    \ 0; row < rows; row++)\n    {\n        if (row == excludeRowNum)\n          \
    \  continue;\n        minorColNum = 0;\n        for (int col = 0; col < cols;\
    \ col++)\n        {\n            if (col == excludeColNum)\n                continue;\n\
    \            m.values[minorRowNum][minorColNum] =\n                this.values[row][col];\n\
    \            minorColNum++;\n        }\n        minorRowNum++;\n    }\n    return\
    \ m;\n}\nn\npublic double determinant()\n{\n    if (rows == 1)\n        return\
    \ values[0][0];\n\n    if (rows == 2)\n        return values[0][0] * values[1][1]\n\
    \            - values[0][1] * values[1][0];\n```"
