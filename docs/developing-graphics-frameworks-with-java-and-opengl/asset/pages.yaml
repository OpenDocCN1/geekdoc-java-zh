  md: '# Introduction to Computer Graphics


    ![](img/3f6cb2c9587f9f6262512f621ea0f52d_10_0.png)


    FIGURE 1.3 Zooming on an image to illustrate individual pixels.


    From a more technical, lower-level perspective, rendering a scene produces a raster
    – an array of pixels (picture elements) that will be displayed on a screen, arranged
    in a 2D grid. Pixels are typically extremely small; zooming on an image can illustrate
    the presence of individual pixels, as shown in Figure 1.3.


    On modern computer systems, pixels specify colors using triples of floating-point
    numbers to represent the amount of red, green, and blue light in a color; a value
    of 0 represents no amount of that color, while a value of 1 represents that color
    is displayed at full (100%) intensity. These three colors are typically used since
    photoreceptors in the human eye have in those particular colors. The triple (1,
    0, 0) represents red, (0, 1, 0) represents green, and (0, 0, 1) represents blue.
    Black and white are represented by (0, 0, 0) and (1, 1, 1), respectively. Additional
    colors and their corresponding triples of values specifying the amounts of red,
    green, and blue (often called RGB values) are illustrated in Figure 1.4.


    The quality of an image depends on its resolution (the number of pixels in the
    raster) and precision (the number of bits used for each pixel). As each bit has
    two possible values (0 or 1), the number of colors that can be expressed with
    N-bit precision is 2N. For example, early video consoles with 8-bit graphics could
    display 256 different colors. Monochrome displays could be said to have 1-bit
    graphics, while modern displays often feature "high color" (16-bit, 65,536 colors)
    or "true color" (24-bit, more than 16 million colors) graphics. Figure 1.5 illustrates
    the same image rendered with high precision but different resolutions, while Figure
    1.6 illustrates the same image rendered with high resolution but different precision
    levels.


    In computer science, a buffer (or data buffer, or buffer memory) is a part of
    a computer’s memory that serves as temporary storage for data while it is moving
    from one location to another. Pixel data is stored in a region of memory called
    the frame buffer. A frame buffer


    | R G B | | R G B |

