  md: '# 6 Developing Graphics Frameworks with Java and OpenGL


    with their release of the GeForce 256, a single-chip processor that performed
    geometric transformations and lighting calculations in addition to the rendering
    computations performed by earlier hardware implementations. Nvidia was the first
    company to produce a GPU capable of being programmed by developers: each geometric
    vertex could be processed by a short program, as every rendered pixel, before
    the resulting image was displayed on screen. This processor, GeForce 3, was introduced
    in 2001 and was also used in the Xbox video game console. In general, GPUs feature
    a highly parallel structure that enables them to be more efficient than CPUs for
    rendering graphics. As computer technology advances, so does the quality of the
    graphics that can be rendered; modern systems are able to produce real-time photorealistic
    graphics at high resolutions.


    Programs that are run by shaders, used for shading effects, but now need to perform
    many different computations required in the rendering process. Since there are
    as many high-level programming languages such as Java, JavaScript, and Python
    to develop CPU-based applications, there are many shader programming languages.
    Each shader language implements an programming interface (API), which defines
    a set of commands, functions, and protocols that can be used to interact with
    an external system — in this case, the GPU. Some APIs and their corresponding
    shader languages include:


    +   - The DirectX API and High-Level Shading Language (HLSL), used on Microsoft
    platforms, including the Xbox game console

    - The Metal API and Metal Shading Language, which runs on modern Mac computers,
    iPhones, and iPads

    - The OpenGL (Open Graphics Library) API and OpenGL Shading Language (GLSL), a
    cross-platform library


    This book will focus on OpenGL, as it is the most widely adopted graphics APIs.
    As a cross-platform library, visual results will be consistent on any supported
    operating system. Furthermore, OpenGL can be used in concert with a variety of
    high-level languages using bindings: software libraries that bridge two programming
    languages, enabling functions from one language to used another. For example,
    some bindings to OpenGL include:


    +   - JOGL (https://jogamp.org/jogl/www/) for Java

    - WebGL (https://www.khos.org/webgl/) for JavaScript

    - PyOpenGL (http://pyopengl.sourceforge.net/) for Python


    The initial version of OpenGL was released by Silicon Graphics, Inc. (SGI) in
    1992 and has been managed by the Khronos Group since 2006. The Khronos Group is
    a non-profit technology consortium, whose members include graphics card manufacturers
    and general technology companies. New versions of the OpenGL specification are
    released regularly to support new features and functions. In this book, you will
