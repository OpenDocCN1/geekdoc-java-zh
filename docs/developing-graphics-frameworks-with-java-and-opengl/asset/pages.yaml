  md: 'level is usually zero, indicating this is the base image level in the associated
    mipmap image. The other parameters describe how the image data is stored in memory.
    The format of the data stored in pixelData and the desired format that should
    be used by the GPU are defined by the parameters format and internalFormat, respectively,
    and are specified using OpenGL constants such as GL_RGB or GL_RGBA. The parameter
    type indicates the precision for the color data, and is often GL_UNSIGNED_BYTE,
    indicating that 8 bits are used for each component.


    When applying a texture to a surface, the pixels of the texture (referred to as
    texels) are usually not the same size as the pixels in the rendered image of the
    scene. If the texture is smaller than the area of the surface it is being applied
    to, then the texture needs to be scaled up, a process called magnification. This
    requires an algorithm to determine a color for each pixel on the surface based
    on the colors of the texture. The simplest algorithm is neighbor filtering, which
    assigns the pixel color of the closest texel; this will result in a blocky or
    pixelated appearance, as illustrated in Figure 5.2. Another algorithm is bilinear
    filtering, which interpolates the colors of the four closest pixels (calculating
    a weighted average, to the rasterization process described in Chapters 1 and 2);
    the result is a smoother appearance, also illustrated in Figure 5.2.


    If the texture is larger than the area of the surface it is being applied to,
    then the texture needs to be scaled down, a process called minification. After
    minification, the texels will be smaller than the pixels; multiple texels will
    overlap each pixel. As before, an algorithm is required to determine the color
    of each pixel from the texture data. A neighbor filter can be used, where the
    pixel color is set to the color of the texel whose center is closest to the center
    of the pixel, but this may cause unwanted visual artifacts. A linear filter can
    be used, where the pixel color is calculated from a weighted average of the colors
    of the texels overlapping it, but calculating this average can take a large amount
    of time. A computer graphics technique called mipmapping provides a more efficient
    approach to this calculation.


    A mipmap is a sequence of images, each of which is half the width and height of
    the previous image; the final image in the sequence consists of a single pixel.
    A sample mipmap is illustrated in Figure 5.3. The images in the sequence only
    need to be calculated once, the original image is uploaded to the GPU. Then, when
    a texture needs to be minified, the GPU can select the image from the corresponding
    mipmap that is closest to the desired size, and perform linear filtering on that
    image, a much more efficient calculation as it will involve only four texels.


