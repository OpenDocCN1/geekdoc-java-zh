  md: '# Matrix Algebra and Transformations


    In this chapter, you will learn about some mathematical objects – vectors and
    matrices – that are essential to rendering three-dimensional (3D) scenes. After
    learning some theoretical background, you will apply this knowledge to create
    a Matrix class that is fundamental in manipulating the position and orientation
    of geometric objects. Finally, you will learn how to incorporate matrix objects
    into the rendering of an interactive 3D scene.


    # 3.1 INTRODUCTION TO VECTORS AND MATRICES


    When animating and interactive graphics applications, you will frequently want
    to transform sets of points defining the shape of geometric objects. You may want
    to translate the object to a new position, rotate the object to a new orientation,
    or scale the object to a new size. Additionally, you will want to project the
    viewable region of the space that is rendered by OpenGL. This will be a perspective
    projection, where objects appear smaller the further they are from the virtual
    camera. These ideas were first introduced in Chapter 1, in the discussion of the
    graphics pipeline and geometry processing: these calculations take place in a
    vertex shader. In Chapter 2, you learned how to work with points (using the data
    types vec3 and vec4), and you implemented a transformation (two-dimensional translation).
    In this chapter, you will learn about a data structure called a matrix – a rectangular
    or two-dimensional array of numbers – that is capable of representing all the
    different types of transformations you will need in 3D graphics. For matrix-based
    transformations, you will learn how to:


    +   - apply a transformation to a point

    - combine multiple transformations into a single transformation

    - create a matrix corresponding to a given description of a transformation'
