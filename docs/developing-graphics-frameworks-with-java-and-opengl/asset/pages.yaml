    Once the final positions of each vertex have been specified by the vertex shader,
    the rasterization stage begins. The points themselves must be first grouped into
    the desired type of geometric primitive: points, lines, or triangles, which consist
    of sets of 1, 2, or 3 points. In the case of lines or triangles, additional information
    must be specified. For example, consider an array of points [A, B, C, D, E, F]
    to be grouped into lines. They could be grouped


