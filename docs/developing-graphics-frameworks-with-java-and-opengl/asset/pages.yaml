  md: "# Developing Graphics Frameworks with Java and OpenGL\n\nAfter establishing\
    \ that keyboard input works as expected, you will then use this functionality\
    \ in a graphics-based application, where the user can move a triangle around the\
    \ screen using the arrow keys.\n\n# 2.5.1 Keyboard Input with LWJGL\n\nThe LWJGL\
    \ library provides support for working with user input events, as interaction\
    \ with the keyboard. In particular, the LWJGL function `glfwSetKeyCallback` specifies\
    \ code that will run when the user presses or releases a key; in this case, a\
    \ value corresponding to the key event will be stored in a list (`keyPressedQueue`\
    \ or `keyLeasedQueue`) in the **Input** class.\n\nAn event is said to be *discrete*\
    \ if it happens at an isolated point in time, or *continuous* if it continues\
    \ during an interval of time. The keyboard events previously described are discrete,\
    \ but many applications also feature continuous actions (such as moving an object\
    \ on screen) that occur for the entire period during which a key is pressed down.\
    \ Unfortunately, there is no standard vocabulary for these standard discrete and\
    \ continuous events; for example, a \"key down\" state sometimes refers to the\
    \ discrete event when a key is initially pressed, and sometimes refers to the\
    \ continuous state of a key after the initial press and before the key is released.\
    \ `keyDown` and `keyUp` will store names of keys corresponding to the discrete\
    \ press and release events, while `keyPressed` will store names of keys in the\
    \ continuous state between these discrete events. For readability, the contents\
    \ of each list can be queried using functions you will create in the **Input**\
    \ class. The contents of these lists will be updated in the **Input** class `update`\
    \ method, based on what has been stored in the `keyPressedQueue` and `keyReleasedQueue`\
    \ since the last update. In particular, keys that are designated as down or up\
    \ only remain for a single iteration of the main application loop, and so the\
    \ contents of the corresponding lists must be cleared before processing the data\
    \ in the queue variables.\n\nTo proceed, in the **core** package, create a new\
    \ Java class named **Input** with the following code:\n\n```\npackage core;\n\n\
    import java.util.ArrayList;\nimport static org.lwjgl.glfw.GLFW.*;\n\npublic class\
    \ Input {\n\n    public boolean quit;\n\n    public ArrayList<Integer> keyPressQueue;\n\
    \    public ArrayList<Integer> keyReleaseQueue;\n\n    public ArrayList<Integer>\
    \ keyDownList;\n    public ArrayList<Integer> keyPressedList;\n    public ArrayList<Integer>\
    \ keyUpList;\n```"
