  md: "# Matrix Algebra and Transformations 77\n\nTwo of the vector functions previously\
    \ mentioned can both be represented using matrix multiplication: the zero function\
    \ can be written as\n\n```\n$F\\left[\begin{matrix} x \\ y\\end{matrix}\\right]\
    \ = \\left[\begin{matrix} 0 & 0 \\ 0 & 0\\end{matrix}\\right]x = \\left[\begin{matrix}\
    \ 0\\cdot x+0\\cdot y \\ 0\\cdot x+0\\cdot y\\end{matrix}\\right] = \\left[\b\
    egin{matrix} 0 \\ 0\\end{matrix}\\right]$\n```\n\nwhile the identity function\
    \ can be written as\n\n```\n$F\\left[\begin{matrix} x \\ y\\end{matrix}\\right]\
    \ = \\left[\begin{matrix} 1 & 0 \\ 0 & 1\\end{matrix}\\right]x = \\left[\begin{matrix}\
    \ 1\\cdot x+0\\cdot y \\ 0\\cdot x+1\\cdot y\\end{matrix}\\right] = \\left[\b\
    egin{matrix} x \\ y\\end{matrix}\\right]$\n```\n\nThe matrix in the definition\
    \ of the identity function is called the *identity matrix*, and appears in a variety\
    \ of contexts, as you will see.\n\nWhen introducing notation for vectors, it indicated\
    \ that subscribed variables sometimes be used for the components of a vector.\
    \ When working with a matrix, *double subscripted variables* sometimes be used\
    \ for its components; the subscripts indicate the position (row and column) of\
    \ the component in the matrix. For example, the variable $a_{12}$ will refer to\
    \ the entry in row 1 and column 2 of matrix $A$, and in general, $a_{mn}$ will\
    \ refer to the entry in row $m$ and column $n$ of the matrix $A$. The contents\
    \ of the entire matrix $A$ can be written as:\n\n```\n$A = \\left[\begin{matrix}\
    \ a_{11} & a_{12} \\ a_{21} & a_{22}\\end{matrix}\\right]$\n```\n\nAt this point,\
    \ you know how to apply a linear function (written in matrix notation) to a point\
    \ or vector. In many contexts (and in computer graphics in particular), you will\
    \ want to apply multiple functions to sets of points. Given two functions $F$\
    \ and $G$, a new function $H$ can be created by defining $H(\\mathbf{v})=F(G(\\\
    mathbf{v}))$; the function $H$ is the *composition of* $F$ and $G$. As it turns\
    \ out, if $F$ and $G$ are linear functions, then $H$ will be a linear function\
    \ as well. This can be verified by checking that the linearity equations hold\
    \ for $H$, making the use of the fact that the linearity equations are true for\
    \ the functions $F$ and $G$ by assumption. The derivation relating to vector addition\
    \ is as follows:\n\n```\n$H(\\mathbf{v}+mathbf{w})=F(G(\\mathbf{v}+mathbf{w}))\\\
    n=F(G(\\mathbf{v})+G(\\mathbf{w}))\\n=F(G(\\mathbf{v}))+F(G(\\mathbf{w}))\\n=H(\\\
    mathbf{v})+H(\\mathbf{w})$\n```"
