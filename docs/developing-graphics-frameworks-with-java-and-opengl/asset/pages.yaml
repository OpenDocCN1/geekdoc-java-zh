  md: "# 256 Developing Graphics Frameworks with Java and OpenGL\n\nNext, you need\
    \ to add the code for the flat material fragment shader. In addition to the standard\
    \ elements of past fragment shaders, this new shader also uses the light value\
    \ calculated in the vertex shader when determining the final color of a fragment.\
    \ This material (as well as the two that follow) will include an optional texture\
    \ parameter. If this parameter is not null, it will cause a shader variable use\
    \ to be set to true, in which case a color sampled from the supplied texture be\
    \ combined with the material's base color. To implement this, create a new file\
    \ FlatMaterial.frag with the following code:\n\n```\nuniform vec3 baseColor;\n\
    uniform bool useTexture;\nuniform sampler2D tex;\nin vec2 UV;\nin vec3 light;\n\
    out vec4 fragColor;\nvoid main() {\n    vec4 color = vec4(baseColor, 1.0);\n \
    \   if ( useTexture ) {\n        color *= texture( tex, UV );\n        color *=\
    \ vec4( light, 1 );\n    }\n    fragColor = color;\n}\n```\n\nFinally, you must\
    \ add the necessary uniform objects to the material using the addUniform method.\
    \ To proceed, the method locateUniforms is called, add the following code. (The\
    \ data for the light objects will be supplied by the Renderer class, handled similarly\
    \ to the model, view, and projection matrix data.)\n\n```\naddUniform(\"vec3\"\
    , \"baseColor\", new Vector(1,1,1,1));\naddUniform(\"Light\", \"light\", null);\n\
    addUniform(\"Light\", \"light1\", null);\naddUniform(\"Light\", \"light2\", null);\n\
    addUniform(\"Light\", \"light3\", null);\n```\n\nNext, add the following code\
    \ that sets the remaining uniform variables, depending on whether or not a texture\
