  md: '# Introduction to Computer Graphics


    The importance of computer graphics in modern society is illustrated by the great
    quantity and a variety of applications and their impact on our daily lives. Computer
    graphics can be two-dimensional (2D) or three-dimensional (3D), animated, and
    interactive. They are used in data visualization to identify patterns and relationships,
    and also in scientific visualization, enabling researchers to model, explore,
    and understand natural phenomena. Computer graphics are used for medical applications
    such as magnetic resonance imaging (MR) and computed tomography (CT) scans, and
    architectural applications, such as creating blueprints or virtual models. They
    enable the creation of tools such as training simulators and software for computer-aided
    engineering and design. Many aspects of the entertainment industry use of computer
    graphics to some extent: movies may use them for special effects, generating realistic
    characters, or rendering entire films, while video games are primarily interactive
    graphics-based experiences. Recent advances in computer graphics hardware and
    software have even helped virtual and augmented reality technology enter the consumer
    market.


    The field of computer graphics is continuously advancing, finding new applications
    and increasing in importance. For all these reasons, combined with the inherent
    appeal of working in a highly visual medium, the field of computer graphics is
    an exciting area to learn about, experiment with, and work in. In this book, you''ll
    learn how to create a robust framework capable of rendering and animating interactive
    3D scenes using modern graphics programming techniques.


    Before diving into programming and code, you''ll first need to learn about the
    core concepts and vocabulary in computer graphics. These ideas will be revisited
    repeatedly throughout this book, and so it may help you to periodically review
    parts of this chapter to keep the overall process in mind. In the second half
    of this chapter, you''ll learn how to install the necessary software and set up
    your development environment.'
  merge: -1
