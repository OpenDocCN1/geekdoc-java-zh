  md: '# 58 Developing Graphics Frameworks with Java and OpenGL


    Next, you will create animated effects by continuously changing the values stored
    in uniform variables.


    In the previous application code examples, you may have wondered why the glDrawArrays
    function was called within the update function – since the objects being drawn
    were not changing, the result was that the same image was rendered 60 times per
    second. In those examples, the rendering code could technically have been placed
    in the initialize function instead of once without affecting the resulting image
    (although it would have been rendered only once). The goal was to adhere to the
    “life cycle” structure of an application discussed at the beginning of this chapter,
    which became strictly necessary at this point. Starting in this case, the appearance
    of the objects will change over time, and the image must be rendered repeatedly.


    Since geometric shapes will appear in different positions in subsequent renders,
    it is important to refresh the drawing area, resetting all the pixels in the color
    buffer to some default color. If this step is not performed, then in each animation
    the rendered shapes will be drawn superimposed on the previous frame, resulting
    in a smeared appearance. To specify the color used when clearing (which effectively
    becomes the background color), and to actually perform the clearing process, the
    two OpenGL functions will be:


    ```

    glClear(red, green, blue, alpha )

    ```


    Specify the color used when clearing the color buffer; the color components specified
    by the parameters red, green, blue, and alpha. Each of these parameters is a float
    between 0 and 1; the default values are 0.


    ```

    glClear( mask )

    ```


    Reset the contents of the buffer(s) indicated by the parameter mask to their default
    values. The value of mask can be one of the OpenGL constants such as GL_COLOR_BUFFER_BIT
    (to clear the color buffer), GL_DEPTH_BUFFER_BIT (to clear the depth buffer),
    GL_STENCIL_BUFFER_BIT (to clear the stencil buffer), or any combination of the
    constants, combined with the bitwise operator |.


    In the next application, you will draw a triangle that continuously moves to the
    right, and once it completely passes the right edge of the screen, it will reappear
    on the left side (This behavior is sometimes called a wrap-around effect, popularized
    by various 1980s arcade games). The same shader code will be used as before, and
    Uniform objects will be created for the triangle. The Uniform corresponding to
    the translation variable will have its value changed (the first component, representing
    the x-coordinate) during the update function, prior to clearing the color buffer
    and rendering the triangle. The wrap-around effect is accomplished by checking
    if the translation x-coordinate is greater than a certain positive value, and
    if so, setting it to a negative value (these values depending on the size of the
    triangle).'
