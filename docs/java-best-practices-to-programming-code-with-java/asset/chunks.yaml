    Multi-dimensional arrays can be implemented in Java but must be treated as single-dimension
    arrays that contain another single-dimension array, and so on.


    ### Treating scalars as objects


    Scalars, like `float` and `int`, are not objects but you may want to treat them
    like objects when you deposit them into a `Vector`, like this:


    ```

    Vector vec = new Vector();

    vec.addElement(12);

    ```


    This will result in a syntax error like this:


    ```

    Line nn: No method matching xxxx found in yyyy

    ```


    In this example, `xxxx` is the method name and `yyyy` is the class name that is
    expecting the object. To solve this, convert them into objects using the object
    wrapper class that you will find in `java.lang`.


    ### Confusing a scalar and its corresponding object type


    When you use a scalar like `int` it isn’t difficult to write a piece of code that
    assumes it can be treated like an object. For example:


    ```java

    int y = 22;

    Integer x = y;

    ```


    Will throw up an error message like:


    ```

    Line nn: Incompatible type for declaration. Can''t convert xxxx to yyyy

    ```


    In this example, both `yyyy` and `xxxx` are the class names.


    ### Not typing the main method header correctly


    Execution of a Java application requires a method declarations starting with:


    ```java

    public static void main (String []args){

    ```


    If any of that line is not types properly or you omit a keyword, you will get
    an error at run time. Let’s say you omitted the keyword `static`, you would get
    an error message like:


    ```

    Exception in thread main.....

    ```


    will be generated at run time.


    ### Conclusion


    Thank you again for reading this book!


    I hope this book was able to help you to understand how to neaten up your Java
    code and how to write cleaner and neater code for more effective and efficient
    programming.


    The next step is to practice. And keep on practicing because that is the only
    way you will improve. The trick with computer programming languages like `Java`
    is to practice regularly because things fall out of fashion and new coding rules
    and styles come in every day. And if you don’t keep up, you will find yourself
    having to go right back to basics every time.


    Finally, if you enjoyed this book, then I’d like to ask you for a favor, would
    you be kind enough to leave a review for this book on Amazon? It’d be greatly
    appreciated!


    Thank you and good luck!


    ### About the Author


    Charlie Masterson is a computer programmer and instructor who have developed several
    applications and computer programs.


    As a computer science student, he got interested in programming early but got
    frustrated learning the highly complex subject matter.


    Charlie wanted a teaching method that he could easily learn from and develop his
    programming skills. He soon discovered a teaching series that made him learn faster
    and better.


    Applying the same approach, Charlie successfully learned different programming
    languages and is now teaching the subject matter through writing books.


    With the books that he writes on computer programming, he hopes to provide great
    value and help readers interested to learn computer-related topics.

