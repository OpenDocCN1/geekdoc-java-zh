  trans: "\n当你在表达式中使用括号时，不要仅仅用它们来规定优先级；它们还应该被用作简化问题的方法。\n\n# 第 2 章：命名规范\n\n在 Java\
    \ 中，正确地命名方法、变量和类非常重要，这里是一些比较常见的规范，如果你学习并遵循这些规范，将帮助你的代码变得清晰得多：\n\n*   当你命名包（packages）时，名称应该用小写，例如\
    \ `mypackage`。\n*   所有代表类型（types）的名称必须是名词，并采用混合驼峰写法，以大写字母开头，例如 `AudioSystem`、`Line`。\n\
    *   所有变量名必须采用混合驼峰并以小写字母开头，例如 `audioSystem`、`line`。这有助于区分变量和类型，并解决任何潜在的命名冲突。\n\
    *   如果一个名称代表常量（constant）或最终变量（final variable），必须全大写，并用下划线分隔每个单词，例如 `COLOR_BLUE`、`SAM_ITERATIONS`。通常情况下，这些常量的使用应保持最少，而且通常情况下，通过方法来实现值更好，例如：\n\
    \n    ```java\n    Int getSamIterations() // ：SAM_ITERATIONS = 25\n    {\n   \
    \     return 25;\n    }\n    ```\n    这样更易读，而且还能确保类值具有统一的接口。\n*   如果一个名称代表方法，它必须是一个动词，并且必须是以小写字母开头的混合写法，例如\
    \ `computeTotalLenght()`、`getNames()`。这与变量完全相同，但因为它们有特定的形式，Java 方法已经很容易与变量区分开来。\n\
    *   当将缩写词或简称作名称使用时，永远不要使用大写，例如：\n\n    良好示例：\n    ```java\n    exportHtmlSource();\n\
    \    ```\n\n    错误示例：\n    ```java\n    exportHTMLSource();\n    ```\n\n    良好示例：\n\
    \    ```java\n    openDvdPlayer();\n    ```\n\n    错误示例：\n    ```java\n    openDVDPlayer();\n\
    \    ```\n\n    之所以这样做是因为如果你对基础名称使用全大写字母，你会发现它与在本章中讨论过的命名规范发生冲突。例如，如果你有这样的变量，你需要将其命名为\
    \ `hTML` 或 `dVD`，正如你所看到的，这些并不非常易读。另一个问题是——当将名称与另一个名称连接时，可读性会大大降低，缩写词后面的单词并不会凸显。\n\
    *   所有私有类变量都应该以下划线结尾，例如：\n\n    ```java\n    class Person\n    {\n      private\
    \ String name_;\n      ...\n    }\n    ```\n    除了类型和名称之外，任何变量最重要的特征是它的作用域（scope）。使用下划线表示类的作用域可以让你轻松区分类变量和局部临时变量（scratch\
    \ variable）。之所以这很重要，是因为类变量被认为比方法变量重要，因此你应该小心对待它。\n\n使用下划线规范的一个副作用是它解决了为 setter\
    \ 方法寻找良好变量名的问题。例如：\n\n    ```java\n    void setName(String name)\n    {\n    \
    \  name_ = name;\n    }\n    ```\n    关于下划线应该是后缀还是前缀存在一个争议。这两种都很常用，但建议将其作为后缀，因为它是保持名称可读性的最佳方式。\n\
    \n    请注意，变量的作用域识别长期以来一直是一个具有争议的问题，但最终，使用下划线后缀的做法现在正在获得动力，并在专业 Java 开发领域中更受接受。\n\
    *   所有泛型变量（generic variables）的命名必须与其类型相同。例如：\n\n    良好示例：\n    ```java\n    void\
    \ getTopic(Topic topic)\n    ```\n\n    错误示例：\n    ```java\n    void getTopic(Topic\
    \ value)\n    void getTopic(Topic aTopic)\n    void getTopic(Topic t)\n    ```\n\
    \n    良好示例：\n    ```java\n    void connect(Database database)\n    ```\n\n   \
    \ 错误示例：\n    ```java\n    void connect(Database db)\n    void connect(Database\
    \ oracleDB)\n    ```\n    这是一个良好的实践，因为它通过减少使用的名称和术语的数量来帮助降低复杂性。它也更容易根据名称判断变量的类型。如果这个规范不符合你的编程习惯，这说明你选择了一个糟糕的类型名称。\n\
    *   所有非泛型变量都被分配了特定的角色，你通常可以使用类型和角色的组合来命名它们。例如：\n\n    ```java\n    Point startingPoint,\
    \ centerPoint;\n    Name loginName;\n    ```\n*   对所有名称使用英语。这是首选语言，你唯一偏离此点的唯一理由是你百分之百确定你的程序永远不会被任何不会说或读写你所语言的人看到或阅读。\n\
    *   作用域和名称应该匹配。如果你有一个作用域较大的变量，可以给它一个较长的名称；相反，作用域较小的变量可以给较短的名字。\n\n    如果你使用临时变量作为索引或临时存储，请保持它们简短。阅读你的代码并看到这些变量的程序员应该能够假设这些变量是在一小段代码之外被使用的。某些用于整数的临时变量有\
    \ `i, j, k, m, n`，通常用于整数的是 `cand, d`。\n*   对象名称是隐式的，且不应该在方法名中使用。例如：\n\n    良好示例：\n\
    \    ```java\n    line.getLength();\n    ```\n\n    错误示例：\n    ```java\n    line.getLength();\n\
    \    ```\n\n## 特定命名规范\n\n*   当直接访问属性时，必须使用 `get` 和 `set` 术语。例如：\n\n    `employee.getName();`\n\
    \    `employee.setName(name);`\n    `matrix.getElement(2, 4);`\n    `matrix.setElement(2,\
    \ 4, value);`\n*   对所有布尔方法和变量使用 `is` 前缀。例如：\n\n    `isSet`\n    `isVisible`\n\
    \    `isFinished`\n    `isOpen`\n\n    使用这个前缀将解决选择 `flag` 或 `status` 等糟糕名称的问题。用于布尔值的\
    \ setter 方法应该有 `set` 前缀，如：\n\n    ```java\n    void setFound(boolean isFound);\n\
    \    ```\n    有一些替代方案可以代替 `is` 前缀，某些某些情况下效果更好。你可以使用的另外三个前缀是 `has`, `should`, `can`：\n\
    \n    `boolean hasLicense();`\n    `boolean canEvaluate();`\n    `boolean shouldAbort\
    \ = false;`\n*   当名称代表对象集合时，使用复数形式：\n\n    ```java\n    Collection<Point> points;\n\
    \    int[] values;\n    ```\n这立即提高了代码的可读性，因为用户可以看到变量类型以及对元素执行的操作。\n\n# 第 3 章：注释\n\
    \n注释非常有用，用于标记程序。这些注释是给程序的读者的，帮助他们理解你的程序或程序的某些部分。作为一条原则，代码用于告诉计算机和程序员要做什么，而注释用于告诉程序员为什么要这样做。\n\
    \n注释可以出现在程序中任何允许空白字符的地方，Java 编译器不会注意到它们——前提是它们写得是正确的。如果你不按照正确的格式编写注释，不仅你的程序会抛出错误，你的代码看起来也会非常混乱困惑。\n\
    \n让我们看看不同类型的注释以及它们如何编写：\n\n*   行内注释 - 当你写行尾注释时，应该以一对双斜杠（`//`）开始，它将在双斜杠所在的行的行尾结束。编译器将忽略\
    \ `//` 到行尾之间的任何内容。\n"
- fmt: "\n## Block Comments\n\n- Block Comments – Block comments start with the forward\
    \ slash, then the asterisk - `/*` and they end with the asterisk and the forward\
    \ slash - `*/` e.g./`/*this is a block comment*/`. Any text that appears between\
    \ these two delimiters will be ignored, even if it goes over several lines.\n\n\
    - Bold Comments - These are special types of block comment that are designed with\
    \ drawing attention in mind. For example:\n\n```\n/*---------------------------------------------------------\n\
    \n*  This is a block comment that will draw attention\n\n*  to itself.\n\n*---------------------------------------------------------*/\n\
    ```\n\n- Javadoc Comments – this is another special type of block comment that\
    \ starts with a forward slash, followed by a pair of asterisks - `/**`. These\
    \ tend to be used as a way of automatically generating a class API and the following\
    \ are the general guidelines for writing a Javadoc comment:\n\nThere are no actual\
    \ set-in-stone rules because a good programmer will write good code that will\
    \ document itself\n\n- Do be sure that your comments agree with your code; if\
    \ you ever update your code, you must remember to update the comments as well.\n\
    - Never write a comment that does nothing more than repeat the code. Comments\
    \ should describe what the code does and why, not how it is done:\n\n```\ng++;\
    \      // increment g by one\n```\n\n- If you have code that can be confusing,\
    \ either comment it or, better still, rewrite it so it doesn’t look confusing.\n\
    - At the start of each file, add a bold comment that contains your name, the date,\
    \ what the program is for and how it should be executed:\n\n```\n/*----------------------------------------------------------------\n\
    \n*  Author:       Sharon Stone\n\n*  Written:      5/12/2014\n*  Last updated:\
    \  12/17/2006\n*\n\n*  Compilation:   javac HelloWorld.java\n*  Execution:   \
    \  java HelloWorld\n* \n\n*  Prints \"Hello, World\". This is the first program\n\
    * that everyone learns\n*  % java HelloWorld\n*  Hello, World\n\n*\n\n*----------------------------------------------------------------*/\n\
    ```\n\n- Wherever you have a variable name, including an instance variable, that\
    \ is important, comment it with the `//` comment and make sure that the comments\
    \ are aligned vertically.\n\n```java\nprivate double rx, ry;    // position\n\
    private double q;         // charge\n```\n\n- Each method must be commented with\
    \ a description of what the method does, including what it needs as an input,\
    \ what the output will be and if there are any side effects – list them if there\
    \ are. Your comment must include the parameter names.\n\n```java\n/**\n*  This\
    \ method will use Knuth’s shuffling algorithm to\n*  rearrange all the array elements\
    \ in [] random order\n\n *\n*  If it is null, it will throw a NullPointerException\n\
    */\npublic static void shuffle(String[] a)\n```\n\n## Chapter 4: Java Files\n\n\
    Another important part of Java that you have to get right for efficiency is how\
    \ you use files. For a start, every Java file must have the `.java` extension.\
    \ In this chapter, we are also going to take a brief look at the layout of statements,\
    \ classes, methods, types, variables, and numbers. Here are some more things you\
    \ must get right if you want your code to be effective:\n\n- The content of each\
    \ file must be kept to no more than 80 columns. This is the common measure for\
    \ printers, terminal emulators, editors, and debuggers. If your file is shared\
    \ with other developers, you must keep to this constraint otherwise, readability\
    \ will be low – when you pass a file to another developer that doesn’t keep to\
    \ this, there will be line breaks that you possibly didn’t mean to be there.\n\
    \n- Avoid the use of special characters like page break and `TAB`. Special characters\
    \ cause trouble for debuggers, editors, terminal emulators and printers when they\
    \ are used in files that are shared across developers and across platforms.\n\
    - If a split line is not complete, it must be made obvious. For example:\n\n```java\n\
    totalSum = a + b + c +\n           d + e;\n\nmethod(param1, param2,\n      param3);\n\
    \nsetText (\"Long line split\" +\n          \"into two parts.\");\n\nfor (int\
    \ tableNo = 0; tableNo < nTables;\n      tableNo += tableStep) {\n  ...\n}\n```\n\
    \nSplit lines happen when you go over the 80-column constraint and, although it\
    \ isn’t easy to give exact rules on how to split lines, the examples above should\
    \ give you some idea. As a rule of thumb:\n\n- A break should follow a comma\n\
    - A break should follow an operator\n- New lines should be aligned with the start\
    \ of the expression on the line before\n\n## Statements\n\n### Import and Package\
    \ Statements\n\n- Package statements are always the first statement in a file\
    \ and every file must belong to a specified package. By placing all files into\
    \ a specified package, and not the default Java package, allows the object-oriented\
    \ programming of Java to be enforced.\n- Import statements must be placed after\
    \ a package statement. They should also be sorted so that the fundamental packages\
    \ come first and then group all associated packages. There should be a single\
    \ blank line between each group:\n\n```java\nimport java.io.IOException;\nimport\
    \ java.net.URL;\nimport java.rmi.RmiServer;\nimport java.rmi.server.Server;\n\
    import javax.swing.JPanel;\nimport javax.swing.event.ActionEvent;\nimport org.linux.apache.server.SoapServer;\n\
    ```\n\nThe location of the import statement will be enforced by Java. By sorting\
    \ the packages, it makes it easier to browse through when there are a lot of imports\
    \ and it also makes it easier to determine any dependencies on the present package.\
    \ Grouping packages together collapses all related information into one unit and\
    \ makes it less complicated. Less complicated = increased readability.\n\n- Always\
    \ explicitly list imported classes:\n\n**Good Example:**\n```java\nimport java.util.List;\n\
    ```\n\n**Bad Examples:**\n```java\nimport java.util.*;\nimport java.util.ArrayList;\n\
    import java.util.HashSet;\n```\n\nWhen you explicitly import a class, you are\
    \ providing the best documentation value for the present class and it also makes\
    \ it much easier to understand the class and maintain it.\n\n### Interfaces and\
    \ Classes\n\nMake sure that all interface and class declarations are organized\
    \ in the following way:\n\n- Interface or class documentation\n- Interface or\
    \ class statement\n- Static, or class, variables in this order – Public; Protected;\
    \ Package (no access modifiers); Private\n- Instance variables in this order –\
    \ Public; Protected; Package (no access modifiers); Private\n- Constructors\n\
    - Methods but there is no particular order for these\n\nMake the location of each\
    \ the class elements predictable so it reduces complexity.\n\n### Methods\n\n\
    Put method modifiers in this order:\n\n- `<access> static synchronized <unusual>\
    \ final native\n\nThe first modifier should always be the `<access modifier>`\
    \ if there is one:\n\n**Good Example:**\n```java\npublic static double square(double\
    \ a);\n```\n\n**Bad Example:**\n```java\nstatic public double square(double a);\n\
    ```\n\nThe `<access>` modifier is `public`, `private` or `protected` while the\
    \ `<unusual>` modifier will include `transient` and `volatile`. Out of all of\
    \ this, the most important thing to learn is to put the `<access>` modifier at\
    \ the beginning – this is a very important modifier and it has to stand out in\
    \ your method declarations. The order of other modifiers isn’t so important.\n\
    \n### Types\n\n- All type conversions should be explicitly done; you should never\
    \ rely on implicit conversions:\n\n**Good Example:**\n```java\nfloatValue = (int)\
    \ intValue;\n```\n\n**Bad Example:**\n```java\nfloatValue = intValue;\n```\n\n\
    By doing this, you are indicating that you fully aware of all the different types\
    \ that are in use and that the mix was deliberate.\n\n- Attach array specifiers\
    \ to type, never to the variable:\n\n**Good Example:**\n```java\nint[] a = new\
    \ int[20];\n```\n\n**Bad Example:**\n```java\nint a[] = new int[20]\n```\n\nArrayness\
    \ is not a feature of the variable, and it is unknown why Java allows it to be\
    \ when it should be attached to the base type.\n\n### Variables\n\n- When you\
    \ declare a variable, it must be initialized and you should also use the smallest\
    \ possible scope to declare as well.\n"
  raw: '*   Block Comments – Block comments start with the forward slash, then the
    asterisk - /* and they end with the asterisk and the forward slash - */ e.g./*this
    is a block comment*/. Any text that appears between these two delimiters will
    be ignored, even if it goes over several lines.


    *   Bold Comments - These are special types of block comment that are designed
    with drawing attention in mind. For example:


    /*---------------------------------------------------------


    *  This is a block comment that will draw attention


    *  to itself.


    *---------------------------------------------------------*/


    *   Javadoc Comments – this is another special type of block comment that starts
    with a forward slash, followed by a pair of asterisks - /**. These tend to be
    used as a way of automatically generating a class API and the following are the
    general guidelines for writing a Javadoc comment:


    There are no actual set-in-stone rules because a good programmer will write good
    code that will document itself


    Do be sure that your comments agree with your code; if you ever update your code,
    you must remember to update the comments as well.


    Never write a comment that does nothing more than repeat the code. Comments should
    describe what the code does and why, not how it is done:


    g++;      //  increment g by one


    If you have code that can be confusing, either comment it or, better still, rewrite
    it so it doesn’t look confusing.


    At the start of each file, add a bold comment that contains your name, the date,
    what the program is for and how it should be executed:


    /*----------------------------------------------------------------


    *  Author:        Sharon Stone


    *  Written:       5/12/2014


    *  Last updated:  12/17/2006


    *


    *  Compilation:   javac HelloWorld.java


    *  Execution:     java HelloWorld


    * 


    *  Prints "Hello, World". This is the first program


    * that everyone learns


    *  % java HelloWorld


    *  Hello, World


    *


    *----------------------------------------------------------------*/


    Wherever you have a variable name, including an instance variable, that is important,
    comment it with the // comment and make sure that the comments are aligned vertically.


    private double rx, ry;    //  position


    private double q;         //  charge


    Each method must be commented with a description of what the method does, including
    what it needs as an input, what the output will be and if there are any side effects
    – list them if there are. Your comment must include the parameter names.


    /**


    *   This method will use Knuth’s shuffling algorithm to


    *   rearrange all the array elements in [] random order


     *


    *   If it is null, it will throw a NullPointerException


    */


    public static void shuffle(String[] a)


    Chapter 4:


    Java Files


    Another important part of Java that you have to get right for efficiency is how
    you use files. For a start, every Java file must have the .java extension. In
    this chapter, we are also going to take a brief look at the layout of statements,
    classes, methods, types, variables, and numbers. Here are some more things you
    must get right if you want your code to be effective:


    *   The content of each file must be kept to no more than 80 columns.


    This is the common measure for printers, terminal emulators, editors, and debuggers.
    If your file is shared with other developers, you must keep to this constraint
    otherwise, readability will be low – when you pass a file to another developer
    that doesn’t keep to this, there will be line breaks that you possibly didn’t
    mean to be there.


    *   Avoid the use of special characters like page break and TAB


    Special characters cause trouble for debuggers, editors, terminal emulators and
    printers when they are used in files that are shared across developers and across
    platforms.


    *   If a split line is not complete, it must be made obvious. For example:


    totalSum = a + b + c +


               d + e;


    method(param1, param2,


           param3);


    setText ("Long line split" +


             "into two parts.");


    for (int tableNo = 0; tableNo < nTables;


         tableNo += tableStep) {


      ...


    }


    Split lines happen when you go over the 80-column constraint and, although it
    isn’t easy to give exact rules on how to split lines, the examples above should
    give you some idea. As a rule of thumb:


    *   A break should follow a comma


    *   A break should follow an operator


    *   New lines should be aligned with the start of the expression on the line before


    Statements


    Import and Package Statements


    *   Package statements are always the first statement in a file and every file
    must belong to a specified package


    By placing all files into a specified package, and not the default Java package,
    allows the object-oriented programming of Java to be enforced.


    *   Import statements must be placed after a package statement. They should also
    be sorted so that the fundamental packages come first and then group all associated
    packages. There should be a single blank line between each group:


    import java.io.IOException;


    import java.net.URL;


    import java.rmi.RmiServer;


    import java.rmi.server.Server;


    import javax.swing.JPanel;


    import javax.swing.event.ActionEvent;


    import org.linux.apache.server.SoapServer;


    The location of the import statement will be enforced by Java. By sorting the
    packages, it makes it easier to browse through when there are a lot of imports
    and it also makes it easier to determine any dependencies on the present package.
    Grouping packages together collapses all related information into one unit and
    makes it less complicated. Less complicated = increased readability.


    *   Always explicitly list imported classes:


    Good Example:


    import java.util.List;


    Bad Examples:


    import java.util.*;


    import java.util.ArrayList;


    import java.util.HashSet;


    When you explicitly import a class, you are providing the best documentation value
    for the present class and it also makes it much easier to understand the class
    and maintain it.


    Interfaces and Classes


    Make sure that all interface and class declarations are organized in the following
    way:


    *   Interface or class documentation


    *   Interface or class statement


    *   Static, or class, variables in this order – Public; Protected; Package (with
    no access modifiers; Private


    *   Instance variables in this order – Public; Protected; Package (with no access
    modifiers); Private


    *   Constructors


    *   Methods but there is no particular order for these


    Make the location of each of the class elements predictable so it reduces complexity.


    Methods


    Put method modifiers in this order:


    *   <access> static abstract synchronized <unusual> final native


    The first modifier should always be the <access modifier> if there is one:


    Good Example:


    public static double square(double a); 


    Bad Example:


    static public double square(double a);


    The <access> modifier is public, private or protected while the <unusual> modifier
    will include transient and volatile. Out of all of this, the most important thing
    to learn is to put the <access> modifier at the beginning – this is a very important
    modifier and it has to stand out in your method declarations. The order of other
    modifiers isn’t so important.


    Types


    *   All type conversions should be explicitly done; you should never rely on implicit
    conversions:


    Good Example:


    floatValue = (int) intValue;


    Bad Example:


    floatValue = intValue;


    By doing this, you are indicating that you fully aware of all the different types
    that are in use and that the mix was deliberate.


    *   Attach array specifiers to type, never to the variable:


    Good Example:


    int[] a = new int[20];  


    Bad Example:


    int a[] = new int[20]


    Arrayness is not a feature of the variable, and it is unknown why Java allows
    it to be when it should be attached to the base type


    Variables


    *   When you declare a variable, it must be initialized and you should also use
    the smallest possible scope to declare as well.'
