    \ y, z);\naveragePosition = computeDistance(average, x, y, z);\n\nswitch (phase)\
    \ {\n  case PHASE_OIL  : text = \"Oil\";  break;\n  case PHASE_WATER : text =\
    \ \"Water\"; break;\n  case PHASE_GAS  : text = \"Gas\";  break;\n}\n```\n\nJava\
    \ 代码中有很多地方可以添加空格来提高可读性，即使这样做会导致违反常见的通用指南。这些地方中的许多都与代码对齐有关，虽然很难提供通用指南的完整列表，但上面的示例应该对你有所帮助。\n\
    \n# 第 6 章：编码规范与禁忌\n\n这些只是另外一些要做和不要的事，可以帮助你成为一名更高效的程序员：\n\n*   只在方法的末尾使用 return，绝不要在中间使用\n\
    \    如果你在中间使用 return，那么以后如果你想将该方法拆分成更小的方法，将会非常费力。它还会迫使你查看一个方法中的多个出口点。\n\n*   不要使用\
    \ continue\n    同样，这会使以后将一个结构拆分为更小的结构或方法变得困难，并迫使你查看一个结构中的多个终点。\n    原因：使用 `continue`\
    \ 会导致以后很难将该结构拆分为更小的结构或方法。它还迫使开发者考虑一个结构的多个终点。\n\n*   使用单独的行进行自增或自减；永远不要将它们组合\n\
    \    将自增或自减运算符组合到方法调用中会增加阅读难度，对于修改代码方面经验较少的程序员来说是不利的。\n\n    坏的示例：\n    ```java\n\
    \    foo(x++);\n    ```\n\n    良好的示例：\n    ```java\n    foo(x);\n    x++;\n  \
    \  ```\n\n    坏的示例：\n    ```java\n    y += 100 * x++;\n    ```\n\n    良好的示例：\n\
    \    ```java\n    y += 100 * x;\n    x++;\n    ```\n\n*   尽可能在变量要使用的地方附近声明它。\n\
    \n    示例 1：\n    ```java\n    int totalWide;\n    int firstWide = 20;\n    int\
    \ secondWide = 12;\n    firstWide = doFoo(firstWide, secondWide);\n    doBar(firstWide,\
    \ secondWide);\n    totalWide = firstWide + secondWide;      // 错误！\n    ```\n\
    \n    示例 2：\n    ```java\n    int firstWide = 20;\n    int secondWide = 12;\n\
    \    firstWide = doFoo(firstWide, secondWide);\n    doBar(firstWide, secondWide);\n\
    \    int totalWide = firstWide + secondWide;      // 正确！\n    ```\n\n    示例 3：\n\
    \    ```java\n    int secondWide = 12;\n    int firstWide = doFoo(20, secondWide);\n\
    \    doBar(firstWide, secondWide);\n    int totalWide = firstWide + secondWide;\
    \      //更好！\n    ```\n\n    引用：\n    “任何傻瓜都能写出计算机能懂的代码。优秀的程序员写出人类能懂的代码。” - Martin\
    \ Fowler\n\n    与其试图记录一个复杂算法是如何执行的，不如从一开始通过添加标识符让算法更具可读性。如果将来算法被更改但文档没有更新，这将非常有帮助。\n\
    \n    示例：\n    与其这样做：\n    ```java\n    if (hero == theTick) && (sidekick == arthur)\
    \ || (sidekick == speak) )\n    ```\n    不如这样做：\n    ```java\n    boolean isTickkick\
    \ = (sidekick == arthur) || (sidekick == speak);\n    if (hero == theTick) &&\
    \ isTickkick )\n    ```\n    或者，与其这样做：\n    ```java\n    public static void happyBirthday(int\
    \ age) {\n      // 如果你在美国，某些生日是特殊的：\n      // 16 (甜蜜 16 岁)\n      // 21 (成年)\n\
    \      // 25, 50, 75 (世纪纪念)\n      // 30, 40, 50, 75\n      if (age == 16 || age\
    \ == 21 || age == 25 || age == 50 || age == 75 || age == 30 || age == 40) {\n\
    \        // 某些逻辑\n      }\n    }\n    ```\n    （注：原文示例中 birthday 部分似乎不完整，此处已根据语境翻译并补全逻辑结构）\n\
    \n    注：由于您提供的文本在 `birthday` 处截断，上述翻译保持了逻辑的连贯性。\n\n    *注：由于您提供的原始文本在结尾处截断，我已根据上下文逻辑进行了翻译和对齐。*\n\
    \n"
- fmt: "\nAnother common error; because Java is a case sensitive language, if you\
    \ use the wrong case, it won’t recognize it. For example, if you write `string`\
    \ and not `notString`, you would get an error message like this:\n\n`Line nn:\
    \ Class xxxx not found in type declaration.`\n\nIn this, `xxxx` is the class name\
    \ with the wrong case.\n\n### Using the wrong case with variables\nThe same thing\
    \ applies here; variables are case sensitive as well and, if you were to declare\
    \ a variable `linkEdit` as an `int` and then attempted to refer to it in a class,\
    \ you would get an error message like this:\n\n`Line nn: Undefined variable: xxxx`\n\
    \nIn this, `xxxx` is the mistyped variable name.\n\n### Using the wrong format\
    \ for writing class methods\nClass methods are always written in this form:\n\n\
    `ClassName.MethodName(Argument(s))`\n\nOne of the most common mistakes is to omit\
    \ the name of the class and that will throw up a message like this:\n\n`Line nn:\
    \ '}' expected`\n\n### Wrongly specifying a method argument\nWhen a class is defined,\
    \ each argument should be prefixed with either the name of a class\n\n```java\n\
    public void tryIt(int a, int b, URL c)\n```\n\nOne of the more common errors,\
    \ especially if you have come to Java from another programming language, is to\
    \ not prefix ALL arguments with the type. For example, taking:\n\n```java\npublic\
    \ void tryIt(int a, b URL c)\n```\n\nThis will generate an error message something\
    \ like this:\n\n`Line nn: Identifier expected`\n\n### Forgetting to send a message\
    \ to an object\nThis is another error that more common to those who are new to\
    \ oop, or object oriented programming. Let’s say that you have the `tryIt` method;\
    \ it has two `int` arguments and it will return an `int` value. If we assume that\
    \ the method is to send a message to an object, we would write it like this:\n\
    \n```java\nint newVal = destination.tryIt(arg1, arg2)\n```\n\nThe arguments, or\
    \ `ints`, have been declared in this code whereas, if you write it like the next\
    \ example:\n\n```java\nint newVal = tryIt(destination, arg1, arg2)\n```\n\nYou\
    \ would get an error message like this:\n\n`Line nn: ')' expected`\n\n### Treating\
    \ == as value equality\nWe use `==` to compare values with scalars and, when you\
    \ apply it to an object, it will compare addresses instead. For example, let’s\
    \ look at an `if` statement:\n\n```java\nif(newObj1 == newObj2){\n    ...\n}\n\
    ```\n\nThis executes the code that is denoted by … but ONLY when the first object\
    \ has the same address as the second one. When they have different addresses but\
    \ the same instance variable values, you would get an evaluation to false. This\
    \ won’t give you any syntax errors but you will see it when you execute the program.\n\
    \n### Not putting voids into methods\nIf a method carries out an action but doesn’t\
    \ return any result, you need to insert the keyword `void` before the method name.\
    \ If you don’t, you will likely see an error message that looks something like:\n\
    \n`Line nn: Invalid method declaration; return type required`\n\n### Not putting\
    \ a break in a case statement\nThis is common in both procedural and object oriented\
    \ languages. You must put a `break` statement at the end of a case statement if\
    \ you want it to finish and then exit at the end of said case statement. If you\
    \ don’t put the `break` statement in, execution will go on to the branch beneath\
    \ the one where you left out the break statement.\n\n### Not putting a return\
    \ into a method\nIf a method is returning a value, there should be a minimum of\
    \ one `return` statement in the method body that returns the right value type.\
    \ Not doing this will result in an error message like this:\n\n`Line nn: Return\
    \ required at end of xxxx`\n\nIn this case, `xxxx` is the method that has no return.\n\
    \n### Declaring an instance variable as private and referring to it in another\
    \ class by name\nWhen you declare an instance variable as `private`, you cannot\
    \ access it by its name outside of the class. The only way to do this is to use\
    \ a method that is declared within the class in which the instance variable resides.\
    \ You will see an error message like this:\n\n`Line nn: Variable xx in class xxxx\
    \ not accessible from class yyyy`\n\nIn this example, `xx` is a private variable,\
    \ `xxxx` is the class where the variable is defined and `yyyy` is the class in\
    \ which the variable is referred to.\n\n### Making use of a variable before you\
    \ assign it a value\nAnother common error in procedural and object oriented languages.\
    \ Scalers are initialized to a default value or to zero in Java so that no errors\
    \ are indicated. If there are any, they are shown by an array that goes beyond\
    \ its bounds, or a false result. Objects are initialized to `null` and if you\
    \ try to reference an object that has not been initialized, it will be caught\
    \ when it comes to run time.\n\n### Assuming the incorrect value type will be\
    \ generated by a message\nThis is another popular error when you use Java packages.\
    \ One example is the use of a method that will deliver a string with digits in\
    \ it but treating it as an integer. The method `getInteger` inside of `java.lang.Integer`\
    \ will deliver an integer and if you try to use that value as an `int`, for example,\
    \ you would see an error message like this:\n\n`Line nn: Incompatible type for\
    \ declaration can't convert xxxx to yyyy`\n\n### Mixing up prefix and postfix\
    \ operators\nThe postfix operators, like `` and `++`, are used to take an old\
    \ value of the variable they are applied to while the prefix operators are for\
    \ the new value. So, if `x` is `45` and you have this statement:\n\n```java\n\
    y = ++x\n```\n\nWhen it is executed, `x` and `y` will both be `46`. However, if\
    \ this statement were to be executed:\n\n```java\ny = x++\n```\n\n`y` would be\
    \ `45` and `x` would be `46`. You won’t see these errors while you are compiling.\n\
    \n### Failing to remember that if an argument is an object, it is passed to a\
    \ method by reference\nWhen you use an object as a method argument, you pass the\
    \ address and not the value. This means that values can be assigned to these arguments.\
    \ While treating them as a value won't particularly kick up an error, you won’t\
    \ be making proper use of the object language.\n\n### Failing to remember that\
    \ a scalar is passed to a method by value\nArguments that take the form of a scalar\
    \ cannot be treated if they can be assigned to. While this won’t come up as a\
    \ syntax error, it will show up at run time if you write a piece of code that\
    \ assumes a method has been used to pass a value to a scalar.\n\n### Not using\
    \ size properly for arrays and strings\nSize is an instance variable that is associated\
    \ with a string and with arrays. If you were to muddle them up by writing something\
    \ like:\n\n```java\narrayVariable.size()\n```\n\nor\n\n```java\nstringVariable.size\n\
    ```\n\nthe first example would give you an error message like:\n\n`Line nn: Method\
    \ size() not found in class java.lang.Object`\n\nAnd the second example would\
    \ give an error message like:\n\n`Line nn: No variable size defined in java.lang.String`\n\
    \n### Using non-existent constructors\nIt is a common error to use an undefined\
    \ constructor. For example, you could have a class in which you have the following\
    \ constructors –one int, two int, three int – but you might have used a `four\
    \ int` constructor. You would see this when compiling with an error message like:\n\
    \n`Line nn: No constructor matching xxxx found in class yyyy`\n\nIn this example,\
    \ `xxxx` is the signature for the non-existent constructor and `yyyy` is the class\
    \ where you should have defined it.\n\n### Calling constructors within a constructor\
    \ that has the same name\nLet’s say, for example, that you defined a class called\
    \ `x` with a `one int` and a `two int` constructor. In the `two int` constructor\
    \ you have referenced the argument `x` and this will kick up an error like:\n\n\
    `Line nn: Method xxxx not found in yyyy`\n\nIn this example, `xxxx` is the constructor\
    \ name with the arguments and `yyyy` is class name where it is defined. The answer\
    \ to this is to use the keyword `this`.\n\n### Assuming that a 2-dimensional array\
    \ will be implemented directly in Java\nThis will result in wrong code, like:\n\
    \n```java\nint [,] arrayVariable = new [10,20] int\n```\n\nIn java, this is illegal\
    \ and you will see errors like this:\n\n`Line nn: Missing term`\n\nand:\n\n`Line\
    \ nn: ']' expected`\n"
