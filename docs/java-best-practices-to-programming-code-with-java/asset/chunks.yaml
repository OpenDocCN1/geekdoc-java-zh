    \n# Introduction\nI want to thank you and congratulate you for reading my book,\
    \ “Java: Best Practices to Programming Code with Java”.\n\nThis book contains\
    \ proven steps and strategies on how to write Java code that doesn’t kick up errors,\
    \ is neat and tidy and has a high level of readability. If your code looks familiar,\
    \ it will be far easier to understand and even easier to cast your eye over to\
    \ see if there are any obvious errors. To make sure your code looks familiar,\
    \ there are a set of best practice guidelines that you should follow; not only\
    \ will this help you, it will help other developers who look over your code as\
    \ well.\n\nThis book assumes that you already have a level of familiarity and\
    \ experience with Java computer programming language. My aim is to help you further\
    \ your knowledge and have you programming like a pro in no time at all. If you\
    \ are a completely new to the language, please familiarize yourself with the basics\
    \ before you run through my best practice guide.\n\nThanks again for purchasing\
    \ this book, I hope you enjoy it!\n\n# Chapter 1: Formatting Your Code\nReally\
    \ and truthfully, the first place to start, before we get into the nitty-gritty,\
    \ is in how to format your Java code. There are several “rules” that you should\
    \ follow to make sure that your code is readable and clean:\n\n## Indentation\n\
    All Java code indenting uses spaces rather than tabs and each indent is 4 spaces.\
    \ The reason for this is because, like all other computer programming languages,\
    \ Java works well with spaces. Some programs mix up spaces and tabs, leaving some\
    \ lines indented with tabs and some with spaces. If you set your tabs to 4 and\
    \ your file is shared with a person that has theirs set to 8 it is all going to\
    \ look a mess.\n\nWhen you use matching braces, they must vertically line up under\
    \ their construct, in exactly the same column. For example:\n\n```java\nvoid foo()\n\
    {\n    while (bar > 0)\n    {\n        System.out.println();\n        bar--;\n\
    \    }\n    if (Cheese == tasty)\n    {\n        System.out.println(\"Cheese is\
    \ good and it is good for you\");\n    }\n    else if (Cheese == yuck)\n    {\n\
    \        System.out.println(\"Cheese tastes like rubber\");\n    }\n    else\n\
    \    {\n        System.out.println(\"please tell me, what is this cheesel'\");\n\
    \    }\n    switch (yuckyFactor)\n    {\n        case 1:\n            System.out.println(\"\
    This is yucky\");\n            break;\n        case 2:\n            System.out.println(\"\
    This is really yucky\");\n            break;\n        case 3:\n            System.out.println(\"\
    This is seriously yucky\");\n            break;\n        default:\n          \
    \  System.out.println(\"whatever\");\n            break;\n    }\n}\n```\n\n##\
    \ Use Braces for All `if`, `for` Statements\nThis is the case even if they are\
    \ controlling a single statement. Why? Because you keep your formatting consistent,\
    \ your code becomes easier to read. Not only that, if you need to add or take\
    \ away lines of code, there’t so much editing to do. Have a look at this example\
    \ – the first three show you the wrong way while the fourth shows the right way\
    \ to do:\n\nBad Examples:\n```java\nif (superHero == tock) System.out.println(\"\
    Fork!\"); \nif (superHero == tock)\n    System.out.println(\"Fork!\"); \nif (superHero\
    \ == tock) {\n    System.out.println(\"Fork!\");\n}\n```\n\nGood Example:\n```java\n\
    if (superHero == tock)\n{\n    System.out.println(\"Fork!\");\n}\n```\n\n## Spacing\n\
    Whenever you have a method name, it should be followed immediately with a left\
    \ parenthesis:\n\nBad Example:\n```java\nfoo (i, j);\n```\n\nGood Example:\n```java\n\
    foo(i, j);\n```\n\nA left square bracket must follow immediately after array dereference:\n\
    \nBad Example:\n```java\nargs [0];\n```\n\nGood Example:\n```java\nargs[0];\n\
    ```\n\nMake sure there is a space on either side of any binary operator:\n\nBad\
    \ Examples:\n```java\na=b+c;\na = b+c;\na=b + c;\n```\n\nGood Example:\n```java\n\
    a = b + c;\n```\n\nBad Example:\n```java\nz = 2*x + 3*y;\n```\n\nGood Examples:\n\
    ```java\nz = 2 * x + 3 * y;\nz = (2 * x) + (3 * y);\n```\n\nWhenever you use a\
    \ unary operator it should be followed immediately by its operand:\n\nBad Example:\n\
    ```java\ncount ++;\n```\n\nGood Example:\n```java\ncount++;\n```\n\nBad Example:\n\
    ```java\ni --;\n```\n\nGood Example:\n```java\ni--;\n```\n\nWhenever you use a\
    \ semicolon or a comma, follow it immediately with a whitespace:\n\nBad Example:\n\
    ```java\nfor (int i = 0;i < 10;i++)\n```\n\nGood Example:\n```java\nfor (int i\
    \ = 0; i < 10; i++)\n```\n\nBad Example:\n```java\ngetOmelets(EggsQuantity,butterQuantity);\n\
    ```\n\nGood Example:\n```java\ngetOmelets(EggsQuantity, butterQuantity);\n```\n\
    \nWrite all casts without spaces:\n\nBad Examples:\n```java\n(MyClass) v.get(3);\n\
    ( MyClass )v.get(3);\n```\n\nGood Example:\n```java\n(MyClass)v.get(3);\n```\n\
    \nWhen you use the keywords `while`, `if`, `for`, and `switch`, always follow\
    \ them with a space:\n\nBad Example:\n```java\nif(hungry)\n```\n\nGood Example:\n\
    ```java\nif (hungry)\n```\n\nBad Example:\n```java\nwhile(omelets < 7)\n```\n\n\
    Good Example:\n```java\nwhile (omelets < 7)\n```\n\nBad Example:\n```java\nfor(int\
    \ i = 0; i < 10; i++)\n```\n\nGood Example:\n```java\nfor (int i = 0; i < 10;\
    \ i++)\n```\n\nBad Example:\n```java\ncatch(TooManyOmeletsException e)\n```\n\n\
    Good Example:\n```java\ncatch (TooManyOmeletsException e)\n```\n\n### Ordering\
    \ of Class Members\nWhen you use class members, they must always be ordered in\
    \ the following way, without exception:\n\n```java\nclass Order\n{\n    // fields\
    \ (attributes)\n    // constructors\n    // methods\n}\n```\n\n### Line Length\n\
    Try not to make any lines more than 120 characters long. This is because most\
    \ text editors can handle this line length easily; any more than this and things\
    \ start to get a little messy and frustrating. If you find that your code is being\
    \ indented way off to the right, think about breaking it done into a few more\
    \ methods.\n\n## Parentheses\n"
