- fmt: "\nWhen you use parentheses in expressions, don’t just use them for the precedence\
    \ order; they should also be used as a way of simplifying things.\n\n# Chapter\
    \ 2: Naming Conventions\n\nNaming methods, variables, and classes correctly are\
    \ very important in Java and here are some of the more common conventions that,\
    \ if you learn and follow, will help your code to be much clearer:\n\n*   When\
    \ you are naming packages, the name should be lowercase, for example `mypackage`.\n\
    *   All names that are representative of types have to be nouns and they are written\
    \ in mixed case, beginning with an upper-case letter, for example `AudioSystem`,\
    \ `Line`.\n*   All variable names have to be in a mixed case and start with a\
    \ lower-case letter, for example `audioSystem`, `line`. This makes it easier to\
    \ distinguish the variables from types and also resolves any potential naming\
    \ clashes.\n*   Where a name is representative of a constant, or a final variable,\
    \ they must be in upper case and an underscore should be used separate each word,\
    \ for example `COLOR_BLUE`, `SAM_ITERATIONS`. Generally, use of these constants\
    \ should be kept to a minimum and, more often than not, it is better to implement\
    \ a value as a method, for example:\n\n    ```java\n    Int getSamIterations()\
    \ // NOT: SAM_ITERATIONS = 25\n    {\n        return 25;\n    }\n    ```\n   \
    \ This is much easier to read and it also ensures that class values have a uniform\
    \ interface.\n*   If a name is representing a method it must be a verb and it\
    \ must be mixed case with a lower-case at the beginning, for example `computeTotalLenght()`,\
    \ `getNames()`. This is exactly the same as for variables but, because they have\
    \ a specific form, the Java method is already easily distinguished from the variable.\n\
    *   Never use uppercase for acronyms or abbreviations when you use them as a name,\
    \ for example:\n\n    Good Example:\n    ```java\n    exportHtmlSource();\n  \
    \  ```\n\n    Bad Example:\n    ```java\n    exportHTMLSource();\n    ```\n\n\
    \    Good Example:\n    ```java\n    openDvdPlayer();\n    ```\n\n    Bad Example:\n\
    \    ```java\n    openDVDPlayer();\n    ```\n\n    The reason for this is because\
    \ if you use all upper-case letters for a base name you will see clashes with\
    \ the naming conventions we already talked about in this chapter. For example,\
    \ if you had this type of variable, you would need to call it `hTML` or `dVD`\
    \ and these, as you can see, are not incredibly readable. A separate problem is\
    \ this - when you connect the name to another, readability is significantly compromised\
    \ and the word that comes after the acronym doesn’t stand out.\n*   All private\
    \ class variables should have an underscore as a suffix, for example:\n\n    ```java\n\
    \    class Person\n    {\n      private String name_;\n      ...\n    }\n    ```\n\
    \    Quite apart from the type and name, the most important feature of any variable\
    \ is its scope. Using the underscore to indicate the scope of a class allows you\
    \ to easily distinguish a class variable from a local scratch variable. The reason\
    \ why this is so important is because the class variable is considered to be of\
    \ higher importance than the method variable and, as such, you should treat it\
    \ carefully.\n\n    One side effect of using the underscore convention is that\
    \ it solves the issue of finding good variable names for the setter methods. For\
    \ example:\n\n    ```java\n    void setName(String name)\n    {\n      name_ =\
    \ name;\n    }\n    ```\n    There is an issue about whether the underscore should\
    \ be a suffix or whether it should be a prefix. Both of these are used commonly\
    \ but adding it as a suffix is recommended because it is the best way to preserve\
    \ name readability.\n\n    Do note that the scope identification of a variable\
    \ has been something of a controversial issue for some time now but, at long last,\
    \ the practice of using the underscore suffix is now gaining momentum and is more\
    \ accepted within the professional Java development world.\n*   All generic variables\
    \ must be named the same as their type. For example:\n\n    Good Example:\n  \
    \  ```java\n    void getTopic(Topic topic)\n    ```\n\n    Bad Examples:\n   \
    \ ```java\n    void getTopic(Topic value)\n    void getTopic(Topic aTopic)\n \
    \   void getTopic(Topic t)\n    ```\n\n    Good Example:\n    ```java\n    void\
    \ connect(Database database)\n    ```\n\n    Bad Examples:\n    ```java\n    void\
    \ connect(Database db)\n    void connect(Database oracleDB)\n    ```\n    This\
    \ is good practice because it helps you to cut down on intricacy by reducing the\
    \ number of names and terms used. It also makes it much easier to decide what\
    \ type a variable is just by the name. If this convention doesn’t fit in with\
    \ your programming, it is a good indicator that you have chosen a poor type name.\n\
    *   All non-generic variables are assigned a specific role and you can often name\
    \ them with a combination of the type and the role. For example:\n\n    ```java\n\
    \    Point startingPoint, centerPoint;\n    Name loginName;\n    ```\n*   Use\
    \ the English language for all names. This is the preferred language and the only\
    \ reason you can deviate from this is if you are 100% certain that your program\
    \ is never going to be seen or read by anyone who does NOT speak or read your\
    \ language.\n*   Scope and names should match. If you have a variable that has\
    \ a large scope, you can give it a longer name and, in direct contrast, variables\
    \ that have a smaller scope can be given a shorter name.\n\n    If you use a scratch\
    \ variable for indices or as temporary storage, do keep them short. A programmer\
    \ who is reading your code and sees these variables has to be able to assume that\
    \ the value of the variable not been used outside of a small number of code lines.\
    \ Some of the scratch variables used for integers are `i`, `j`, `k`, `m`, `n`\
    \ and commonly used for integers are `cand`, `d`.\n*   Object names are implicit\
    \ and should not be used in method names. For example:\n\n    Good Example:\n\
    \    ```java\n    line.getLength();\n    ```\n\n    Bad Example:\n    ```java\n\
    \    line.getLength();\n    ```\n\n## Specific Naming Conventions\n\n*   Where\
    \ an attribute is to be directly accessed, you must use the terms `get` and `set`.\
    \ For example:\n\n    `employee.getName();`\n    `employee.setName(name);`\n \
    \   `matrix.getElement(2, 4);`\n    `matrix.setElement(2, 4, value);`\n*   Use\
    \ the `is` prefix for all Boolean methods and variables. For example:\n\n    `isSet`\n\
    \    `isVisible`\n    `isFinished`\n    `isOpen`\n\n    Using this prefix will\
    \ solve the common issue of selecting bad names like `flag` or `status`. Setter\
    \ methods used for the Booleans should have `set` prefixes, as in:\n\n    ```java\n\
    \    void setFound(boolean isFound);\n    ```\n    There are some alternatives\
    \ that you can use instead of the prefix `is` and some of these work better in\
    \ certain situations. There are three other prefixes you can use – `has`, `should`,\
    \ `can`:\n\n    `boolean hasLicense();`\n    `boolean canEvaluate();`\n    `boolean\
    \ shouldAbort = false;`\n*   When the name is representative of an object collection,\
    \ use the plural form:\n\n    ```java\n    Collection<Point> points;\n    int[]\
    \ values;\n    ```\n    This immediately makes the code more readable because\
    \ the user can see the variable type and the operations that are to be performed\
    \ on the elements.\n\n# Chapter 3: Commenting\n\nComments are incredibly useful\
    \ and are used to annotate programs. These comments are there for the reader of\
    \ a program, to help them understand your program or elements of it. As a rule\
    \ of thumb, the code is used to tell the computer and the programmer programmer\
    \ is to be done and the comments tell the programmer why it is being done.\n\n\
    Comments can go anywhere in a program where whitespace can go and the Java compiler\
    \ will not take any notice of them – provided they have been written correctly\
    \ of course. If you don’t write the comments in the correct format, not only will\
    \ your program throw up errors, your code is going to look very messy and confusing.\n\
    \nLet’s look at the different types of comments and how they should be written:\n\
    \n*   Line Comments - When you write an end-of-line comment, you should start\
    \ it with a pair of forward slashes (`//`) and it will finish at the end of the\
    \ same line the forward slashes are on. The compiler will ignore anything that\
    \ comes between `//` and the end of the line.\n"
