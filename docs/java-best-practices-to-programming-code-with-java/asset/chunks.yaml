    Introduction


    I want to thank you and congratulate you for reading mybook,“Java: Best Practices
    to Programming Code with Java”.


    This book contains proven steps and strategies on how to write Java code that
    doesn’t kick up errors, is neat and tidy and has a high level of readability.
    If your code looks familiar, it will be far easier to understand and even easier
    to cast your eye over to see if there are any obvious errors. To make sure your
    code looks familiar, there are a set of best practice guidelines that you should
    follow; not only will this help you, it will help other developers who look over
    your code as well.


    This book assumes that you already have a level of familiarity and experience
    with Java computer programming language. My aim is to help you further your knowledge
    and have you programming like a pro in no time at all. If you are a completely
    new to the language, please familiarize yourself with the basics before you run
    through my best practice guide.


    Thanks again for purchasing this book, I hope you enjoy it!


    # Chapter 1:


    Formatting Your Code


    Really and truthfully, the first place to start, before we get into the nitty-gritty,
    is in how to format your Java code. There are several “rules” that you should
    follow to make sure that your code is readable and clean:


    Indentation


    All Java code indenting uses spaces rather than tabs and each indent is 4 spaces.
    The reason for this is because, like all other computer programming languages,
    Java works well with spaces. Some programs mix up spaces and tabs, leaving some
    lines indented with tabs and some with spaces. If you set your tabs to 4 and your
    file is shared with a person that has theirs set to 8 it is all going to look
    a mess.


    When you use matching braces, they must vertically line up under their construct,
    in exactly the same column. For example:


    void foo()


    {


        while (bar > 0)


        {


            System.out.println();


            bar--;


        }


        if (Cheese == tasty)


        {


            System.out.println("Cheese is good and it is good for you");


        }


        else if (Cheese == yuck)


        {


            System.out.println("Cheese tastes like rubber");


        }


        else


        {


            System.out.println("please tell me, what is this cheesel''");


        }


        switch (yuckyFactor)


        {


            case 1:


                System.out.println("This is yucky");


                break;


            case 2:


                System.out.println("This is really yucky");


                break;


            case 3:


                System.out.println("This is seriously yucky");


                break;


            default:


                System.out.println("whatever");


                break;


        }


    }


    Use Braces for Allif, forand  while  Statements


    This is the case even if they are controlling just a single statement. Why? Because
    when you keep your formatting consistent, your code becomes much easier to read.
    Not only that, if you need to add or take away lines of code, there isn’t so much
    editing to do. Have a look at this example – the first three show you the wrong
    way while the fourth shows the right way to do it:


    Bad Examples:


    if (superHero == theTock) System.out.println("Fork!"); 


    if (superHero == theTock)


         System.out.println("Fork!"); 


     if (superHero == theTock) {


          System.out.println("Fork!");


        }                                           


    Good Example:


        if (superHero == thetock)                  


        {


            System.out.println("Fork!");


        }                                           


    Spacing


    Whenever you have a method name, it should be followed immediately with a left
    parenthesis:


    Bad Example:


    foo (i, j);    


    Good Example:


    foo(i, j); 


    A left square bracket must follow immediately after any array dereference:


    Bad Example:


       args [0];


    Good Example:


        args[0]; 


    Make sure there is a space on either side of any binary operator:


    Bad Examples:


       a=b+c;        


        a = b+c;       


        a=b + c;       


    Good Example:


        a = b + c;     


    Bad Example:


        z = 2*x + 3*y;        


    Good Examples:


        z = 2 * x + 3 * y;     !


        z = (2 * x) + (3 * y);!


    Whenever you use a unary operator it should be followed immediately by its operand:


    Bad Example:


        count ++;


    Good Example:


        count++; 


    Bad Example:


        i --;    


    Good Example:


        i--;     


    Whenever you use a semicolon or a comma, follow it immediately with a whitespace:


    Bad Example:


        for (int i = 0;i < 10;i++)  


    Good Example:


         for (int i = 0; i < 10; i++)


    Bad Example:


         getOmelets(EggsQuantity,butterQuantity); 


    Good Example:


         getOmelets(EggsQuantity, butterQuantity);


    Write all casts without spaces


    Bad Examples:


       (MyClass) v.get(3); 


        ( MyClass )v.get(3);


    Good Example:


        (MyClass)v.get(3);  


    When you use the keywordswhile, if, for, catchand  switch, always follow them
    with a space:


    Bad Example:


         if(hungry) 


    Good Example:


         if (hungry)


    Bad Example:


         while(omelets < 7) 


    Good Example:


         while (omelets < 7)


    Bad Example:


         for(int i = 0; i < 10; i++) 


    Good Example:


         for (int i = 0; i < 10; i++)


    Bad Example:


            catch(TooManyOmeletsException e) 


    Good Example:


         catch (TooManyOmeletsException e)


    Ordering of Class Members


    When you use class members, they must always be ordered in the following way,
    without exception:


        class Order


        {


            // fields (attributes)


            // constructors


            // methods


        }


    Line Length


    Try not to make any lines more than 120 characters long. This is because most
    text editors can handle this line length easily; any more than this and things
    start to get a little messy and frustrating. If you find that your code is being
    indented way off to the right, think about breaking it done into a few more methods.


