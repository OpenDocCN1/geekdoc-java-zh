    This is to make sure that a variable will be valid all the time. On occasion,
    it may be possible to initialize the variable to a proper value in the location
    it is declared – in this case, leave the variable uninitialized, rather than initializing
    it to a false value.


    *   Never let your variables have a dual meaning


    This way, all of your concepts are uniquely represented and there is a lower chance
    of errors popping up.


    *   Never declare a class variable publicly


    One of the main concepts of Java is to hide and encapsulate information. The declaration
    of a class variable as `public` violates that so use access functions and private
    variables instead. There is just one exception to this – if a class is a data
    structure that has no behavior. In this case, you can make the instance variable
    public.


    *   Brackets beside type when you declare an array:


    Good Example:

    ```

    double[] vertex;

    ```


    Bad Example:

    ```

    double vertex[];

    ```


    Good Example:

    ```

    int[] count;

    ```


    Bad Example:

    ```

    int count[];

    ```


    Good Examples:

    ```java

    public static void main(String[] arguments)

    public double[] computeVertex()

    ```


    There are two reasons for this. First, as we mentioned earlier, arrayness is NOT
    a feature of the variable, it is attached to class. Second, when an array is returned
    from a method, you can’t have the brackets anywhere but with type.


    *   Keep the lifespan of a variable as short as you can


    This makes it easier to control the side effects and the effects of the variable.


    ### Loops


    *   Only include loop control statements in the `for()` construction:


    Good Example:

    ```

    sum = 0;

    ```


    Bad Examples:

    ```java

    for (i = 0, sum = 0; i < 100; i++)

    for (i = 0; i < 100; i++)

    sum += value[i];

    sum += value[i];

    ```


    This increases readability and makes it easier to maintain. Always have a clear
    distinction of what is in the loop and what controls it.


    *   Do not initialize a loop variable right before a loop


    Good Example:

    ```

    isDone = false;

    ```


    Bad Examples:

    ```java

    bool isDone = false;

    while (!isDone) {

    }

    ```


    *   Avoid using `do-while` loops


    These are not as readable as the normal `while` and `for` loops because the conditional
    goes at the bottom. This means that a reader has to scan through the entire loop
    to understand what the scope is. You don’t actually need to use a `do-while` loop
    because they can be written very easily into standard `while` or `for` loops.
    Cutting down on the amount of constructs you use enhances readability.


    *   Avoid using `continue` and `break` in loops


    The only reason you should use these is they provide better readability than their
    more structured equivalent.


    ### Conditionals


    *   Avoid the use of complex conditional expressions; a better option is a temporary
    Boolean variable


    Good Example:

    ```java

    bool isFinished = (elementNo < 0) || (elementNo > maxElement);

    bool isRepeatedEntry = elementNo == lastElement;

    if (isFinished || isRepeatedEntry) {

    }

    ```


    Bad Example:

    ```java

    if ((elementNo < 0) || (elementNo > maxElement) || elementNo == lastElement) {

    }

    ```


    When you assign a Boolean variable to an expression, your program is given automatic
    documentation, it will be better constructed, easier to read and to debug.


    *   Place nominal case within the `if` section and exceptions in the `else` section
    of `if` statement


    ```java

    boolean isOk = readFile(fileName);

    if (isOk) {

    }

    else {

    }

    ```


    Ensure that the exception doesn’t cover up the normal path the execution should
    take; this is an important point, not just for readability but for performance
    as well.


    *   Put the conditional on another line


    Good Example:

    ```java

    if (isDone)

    ```


    Bad Example:

    ```java

    if (isDone) doCleanup();

    doCleanup();

    ```


    We do this for the purposes of debugging. If you place them on the same line,
    it will not be clear if the test is true or false.


    *   Avoid using executable statements in a conditional


    Good Example:

    ```java

    InputStream stream = open(fileName, "w");

    if (stream != null) {

    }

    ```


    Bad Example:

    ```java

    if (stream = open(fileName, "w")) {

    }

    ```


    ### Numbers


    *   Avoid using magic numbers. Anything other than `0` should be a named constant


    Good Example:

    ```

    final int TEAM_SIZE = 11;

    ```


    Bad Example:

    ```

    players = 11;

    ```


    *   Always put a digit in front of the decimal point


    Good Example:

    ```

    double total = 0.5;

    ```


    Bad Example:

    ```

    double total = .5;

    ```


    *   Refer to static methods or variables using the class name


    Good Example:

    ```

    Thread.sleep(1000);

    ```


    Bad Example:

    ```

    thread.sleep(1000);

    ```


    ### White Space


    Whitespace is another important part of coding, especially knowing where to use
    it. The general rules are:


    *   Always surround operators with space

    *   Follow reserved keywords with a space

    *   Follow a comma with a space

    *   Surround colons with space

    *   Follow semi-colons that are in `for` statement with a space


    Good Example:

    ```

    a = (b + c) * d;

    ```


    Bad Example:

    ```

    a=(b+c)*d;

    ```


    Good Example:

    ```

    while (true) {

    }

    ```


    Bad Example:

    ```

    while(true){

    }

    ```


    Good Example:

    ```

    doSomething(a, b, c, d);

    ```


    Bad Example:

    ```

    doSomething(a,b,c,d);

    ```


    Good Example:

    ```

    case 100 :

    ```


    Bad Example:

    ```

    case 100:

    ```


    Good Example:

    ```

    for (i = 0; i < 10; i++) {

    }

    ```


    Bad Example:

    ```

    for(i=0;i<10;i++){

    }


    By doing all of this you are making the components of each statement stand out,
    increasing readability. While it isn’t very easy to provide you with a full list
    of white space use, the above examples should give you some idea.


    *   Use a white space after a method name if it has another name after it


    ```

    doSomething (currentFile);

    ```


    This ensures that each individual name stands out and makes it easier to read.
    If there is no name following the method name, leave out the white space as the
    name will be obvious.


    ```

    (doSomething())

    ```


    There is an alternative method here – follow the opening parenthesis with a white
    space. Some who do this place another white space before the closing parenthesis
    but this is not really needed. It does make things stand out more though and there
    is no harm in doing it.


    Example – two white spaces

    ```

    doSomething( currentFile );

    ```


    Example – one white space

    ```

    (doSomething( currentFile))

    ```


    *   Separate all logical units in a block with a blank line


    ```java

    // Create a new identity matrix

    Matrix4x4 matrix = new Matrix4x4();


    // Precompute angles for efficiency

    double cosAngle = Math.cos(angle);


    double sinAngle = Math.sin(angle);

    ```

