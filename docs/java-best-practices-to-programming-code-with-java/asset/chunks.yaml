    （注：原文存在重复内容）\n\n## 空格\n当你有一个方法名时，它应该紧跟一个左括号：\n\n错误示例：\n```java\nfoo (i, j)\n```\n\
    \n正确示例：\n```java\nfoo(i, j)\n```\n\n左方括号必须紧跟在数组引用之后：\n\n错误示例：\n```java\nargs [0];\n\
    ```\n\n正确示例：\n```java\nargs[0];\n```\n\n确保任何二元运算符的两侧都有空格：\n\n错误示例：\n```java\n\
    a=b+c;\n```\n\n正确示例：\n```java\na = b + c;\n```\n\n当你使用一元运算符时，它应该紧跟其操作数：\n\n错误示例：\n\
    ```java\ncount ++;\n```\n\n正确示例：\n```java\ncount++;\n```\n\n错误示例：\n```java\ni\
    \ --;\n```\n\n正确示例：\n```java\ni--;\n```\n\n当你使用分号或逗号时，请在其后紧跟一个空格：\n\n错误示例：\n```java\n\
    for (int i = 0;i < 10;i++)\n```\n\n正确示例：\n```java\nfor (int i = 0; i < 10; i++)\n\
    ```\n\n错误示例：\n```java\ngetOmelets(EggsQuantity,butterQuantity);\n```\n\n正确示例：\n\
