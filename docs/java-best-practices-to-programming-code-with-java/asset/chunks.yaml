    Chapter 2:


    Naming Conventions


    Naming methods, variables, and classes correctly are very important in Java and
    here are some of the more common conventions that, if you learn and follow, will
    help your code to be much clearer:


    *   When you are naming packages, the name should be lowercase, for example, mypackage


    *   All names that are representative of types have to be nouns and they are written
    in mixed case, beginning with an upper-case letter, for example, AudioSystem,
    Line


    *   All variable names have to be in a mixed case and start with a lower-case
    letter, for example,audioSystem, line. This makes it easier to distinguish the
    variables from types and also resolves any potential naming clashes.


    *   Where a name is representative of a constant, or a final variable, they must
    be in upper case and an underscore should be used separate each word, for example,COLOR_BLUE,
    SAM_ITERATIONS. Generally, use of these constants should be kept to a minimum
    and, more often than not, it is better to implement a value as a method,for example


    Int getSamIterations() // NOT: SAM_ITERATIONS = 25


      {


        return 25;


      }


    This is much easier to read and it also ensures that class values have a uniform
    interface


    *   If a name is representing a method it must be a verb and it must be mixed
    case with a lower-case at the beginning, for example,computeTotalLenght(), getNames().
    This is exactly the same as for variables but, because they have a specific form,
    the Java method is already easily distinguished from the variable.


    *   Never use uppercase for acronyms or abbreviations when you use them as a name,
    for example,


    Good Example:


    exportHtmlSource();


    Bad Example:


    exportHTMLSource();


    Good Example:


    openDvdPlayer();   


    Bad Example:


    openDVDPlayer();


    The reason for this is because if you use all upper-case letters for a base name
    you will see clashes with the naming conventions we already talked about in this
    chapter. For example, if you had this type of variable, you would need to call
    it hTML or dVD and these, as you can see, are not incredibly readable. A separate
    problem is this -  when you connect the name to another, readability is significantly
    compromised and the word that comes after the acronym doesn’t stand out.


    *   All private class variables should have an underscore as a suffix, for example:


    class Person


    {


      private String name_;


      ...


    }


    Quite apart from the type and name, the most important feature of any variable
    is its scope. Using the underscore to indicate the scope of a class allows you
    to easily distinguish a class variable from a local scratch variable. The reason
    why this is so important is because the class variable is considered to be of
    higher importance than the method variable and, as such, you should treat it carefully.


    One side effect of using the underscore convention is that it solves the issue
    of finding good variable names for the setter methods. For example:


      void setName(String name)


      {


        name_ = name;


      }


    There is an issue about whether the underscore should be a suffix or whether it
    should be a prefix. Both of these are used commonly but adding it as a suffix
    is recommended because it is the best way to preserve name readability.


    Do note that the scope identification of a variable has been something of a controversial
    issue for some time now but, at long last, the practice of using the underscore
    suffix is now gaining momentum and is more accepted within the professional Java
    development world


    *   All generic variables must be named the same as their type. For example:


    Good Example:


    void getTopic(Topic topic)


    Bad Examples:


    void getTopic(Topic value)


    void getTopic(Topic aTopic)


    void getTopic(Topic t)


    Good Example:


    void connect(Database database)


    Bad Examples:


    void connect(Database db)


    void connect(Database oracleDB)


    This is good practice because it helps you to cut down on intricacy by reducing
    the number of names and terms used. It also makes it much easier to decide what
    type a variable is just by the name. If this convention doesn’t fit in with your
    programming, it is a good indicator that you have chosen a poor type name.


    *   All non-generic variables are assigned a specific role and you can often name
    them with a combination of the type and the role. For example:


    Point  startingPoint, centerPoint;


      Name   loginName;


    *   Use the English language for all names. This is the preferred language and
    the only reason you can deviate from this is if you are 100% certain that your
    program is never going to be seen or read by anyone who does NOT speak or read
    your language.


    *   Scope and names should match. If you have a variable that has a large scope,
    you can give it a longer name and, in direct contrast, variables that have a smaller
    scope can be given a shorter name.


    If you use a scratch variable for indices or as temporary storage, do keep them
    short. A programmer who is reading your code and sees these variables has to be
    able to assume that the value of the variable not been used outside of a small
    number of code lines. Some of the scratch variables used for integers arei, j,
    k, m, n  and commonly used for integers arecand  d.


    *   Object names are implicit and should not be used in method names. For example:


    Good Example:


    line.getLength();  


    Bad Example:


    line.getLineLength();


    While the last example might look natural when it comes to class declarations,
    it does prove to be unnecessary, as you can see in the example.


    Specific Naming Conventions


    *   Where an attribute is to be directly accessed, you must use the terms get
    and set. For example:


    employee.getName();


    employee.setName(name);


    matrix.getElement(2, 4);


    matrix.setElement(2, 4, value);


    *   Use the is prefix for all Boolean methods and variable. For example:


    isSet


    isVisible


    isFinished


    isFound


    isOpen


    Using this prefix will solve the common issue of selecting bad names for Booleans
    like flag or status.isStatusandisFlag  just don''t work and you will be forced
    to choose names that are more appropriate. Setter methods used for the Boolean
    variables should have set prefixes, as in:


    void setFound(boolean isFound);


    There are some alternatives that you can use instead of the prefix is and some
    of these work better in certain situations. There are three other prefixes you
    can use –has, shouldand  can:


    boolean hasLicense();


    boolean canEvaluate();


    boolean shouldAbort = false;


    *   When the name is representative of an object collection, use the plural form:


    Collection<Point>  points;


    int[]              values;


    This immediately makes the code more readable because the user can see the variable
    type and the operations that are to be performed on the elements.


    Chapter 3:


    Commenting


    Comments are incredibly useful and are used to annotate programs. These comments
    are there for the reader of a program, to help them to understand your program
    or elements of it. As a rule of thumb, the code is used to tell the computer and
    the computer programmer what is to be done and the comments tell the programmer
    why it is being done.


    Comments can go anywhere in a program where whitespace can go and the Java compiler
    will not take any notice of them – provided they have been written correctly of
    course. If you don’t write the comments in the correct format, not only will your
    program throw up errors, your code is going to look very messy and confusing.


    Let’s look at the different types of comments and how they should be written:


    *   Line Comments - When you write an end-of-line comment, you should start it
    with a pair of forward slashes (//) and it will finish at the end of the same
    line the forward slashes are on. The compiler will ignore anything that comes
    between // and the end of the line'
