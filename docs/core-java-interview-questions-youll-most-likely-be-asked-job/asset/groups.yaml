    ## 55: How to obtain Array from an ArrayList?


    Answer:


    Array can be obtained from an ArrayList using to() method on ArrayList.


    ```

    ArrayList arrayList = new ArrayList();


    arrayList.add(obj1)


    Object a[] = arrayList.toArray();

    ```


    ## 56: Why insertion and deletion in ArrayList is slow compared to LinkedList?


    Answer:


    ArrayList internally uses an array to store the elements, when that array gets
    filled by inserting elements, a new array of roughly 1.5 times the size of the
    original array is created and all the data of old array is copied to new array.
    During deletion, all elements present in the array after the deleted elements
    have to be moved one step back to fill the space created by deletion.


    In linked list, data is stored in nodes that have reference to the previous node
    and the next node, so adding element is simple as creating the node and updating
    the next pointer on the last node and the previous pointer on the new node.


    Deletion in linked list is fast because it involves only updating the next pointer
    in the node before the deleted node and updating the previous pointer in the node
    after the deleted node.


    ## 57: Why are Iterators returned by ArrayList called Fail Fast?


    Answer:


    Because, if list is structurally modified at any time after the iterator is created,
    in any way except through the iterator''s own remove or add methods, the iterator
    will throw a ConcurrentModificationException. Thus, in the face of concurrent
    modification, the iterator fails quickly and cleanly, rather than risking arbitrary,
    non-deterministic behavior at an undetermined time in the future.


    ## 58: How do you decide when to use ArrayList and when to use LinkedList?


    **Answer:**


    If you need to support random access, without inserting or removing elements from
    any place other than the end, then ArrayList offers the optimal collection. If,
    however, you need to frequently add and remove elements from the middle of the
    list and only access the list elements sequentially, then LinkedList offers the
    better implementation.


    ## 59: What is the Set interface?


    **Answer:**


    The Set interface provides methods for accessing the elements of a finite mathematical
    set.


    - a) Sets do not allow duplicate elements

    - b) Contains no methods other than inherited from Collection

    - c) It adds the restriction that duplicate elements are prohibited

    - d) Two Set objects are equal if they contain the same elements


    ## 60: What are the main Implementations of the Set interface?


    Answer:


    The main implementations of the List interface are as follows:


    - a) HashSet

    - b) TreeSet

    - c) LinkedHashSet

    - d) EnumSet


    ## 61: What is a HashSet? When it should be used?


    Answer:


    A HashSet is an unsorted, unordered Set. It uses the hashcode of the object being
    inserted (the more efficient your hashcode() implementation, the better access
    performance you’ll get). Use this class when you want a collection with no duplicates
    and you don’t care about order when you iterate through it.


    ## 62: What is a TreeSet?


    Answer:


    TreeSet is a set implementation that keeps the elements in sorted order. The elements
    are sorted according to the natural order of elements or by the comparator provided
    at creation time.


    ## 63: What is an EnumSet?


    Answer:


    An EnumSet is a specialized set for use with enum types, all of the elements in
    the Enum type that is specified, explicitly or implicitly, when the set is created.


    ## 64: Difference between HashSet and TreeSet?


    # Core JAVA Interview Questions You''ll Most Likely Be Asked


    Answer:


    | HashSet | TreeSet |

    | :--- | :--- |

    | HashSet is under set interface i.e. it does not guarantee for either sorted
    order or sequence order. | TreeSet is under set i.e. it provides elements in a
    sorted order (ascending order). |

    | We can add any type of elements to hash set. | We can add only similar types
    of elements to tree set. |


    ## 65: What is a Map?


    A Map is an object that stores associations between keys and values (key/value
    pairs). Given a key, you can find its value. Both keys and values are objects.
    The keys must be unique, but the values may be duplicated. Some Maps can accept
    a null key and null values, others cannot.


    ## 66: What are the main Implementations of the Map interface?


    Answer:


    The main implementations of the List interface are as follows:


    - a) HashMap

    - b) HashTable

    - c) TreeMap

    - d) EnumMap


    ## 67: What is a TreeMap?


    Answer:


    TreeMap actually implements SortedMap interface which extends the Map interface.
    In TreeMap, the elements are sorted according to the natural order of elements
    or by the comparator provided at creation time.


    ## 68: How do you decide when to use ArrayList and when to use LinkedList?


    Answer:


    If you need to support random access, without inserting or removing elements from
    any place other than the end, then ArrayList offers the optimal collection. If,
    however, you need to frequently add and remove elements from the middle of the
    list and only access the list elements sequentially, then LinkedList offers the
    better implementation.


    ## 69: Difference between HashMap and Hashtable?


    Answer:


    | HashMap | Hashtable |

    | :--- | :--- |

    | HashMap is not synchronized. | Hashtable is synchronized. |

    | HashMap allows null key and null values. | Hashtable does not allow null key
    or null values. |

    | HashMap is faster. | Hashtable is slower. |


    ## 70: What is static block? What is its use?


    Answer:


    Static block is a block of code that is executed when the class is loaded by the
    JVM. It is used to initialize static variables.


    ## 71: Name different Views that Maps Provide?


    Answer:


    Maps Provide Three Views:


    - Key Set - Allows Map''s contents to be viewed as keys.

    - Values Collection - Allows Map''s contents to be viewed as values.

    - Entry Set - Allows Map''s contents to be viewed as key-value mappings.


    ## 72: What is KeySet View?


    Answer:


    KeySet is a set returned by the keySet() method of the Map. It contains all the
    keys present in the map.


    ## 73: What is Values Collection?


    Answer:


    Values Collection is a collection returned by the values() method of the Map Interface.
    It contains all the objects present as values in the map.


    ## 74: What is EntrySet View?


    Answer:


    EntrySet view is a set returned by the entrySet() method and contains each of
    which has both Key and Value.


    ## 75: How do you sort an ArrayList (or any list) of user-defined objects?


    Answer:


    Create an implementation of the Comparator interface that knows how to order your
    objects and pass it to Collections.sort().


    ## 76: What is the Comparable interface?


    Answer:


    The Comparable interface is used to sort collections and arrays using the Collections.sort()
    and Arrays.sort() methods respectively. The objects of the class implementing
    the Comparable interface can be ordered.


    The Comparable interface in the generic form is written as:


    ```

    interface Comparable<T>

    ```


    where T is the name of the type parameter. All classes implementing the Comparable
    interface must implement the compareTo() method that has the return type as an
    integer. The signature of the compareTo() method is as follows:


    ```

    int i = object1.compareTo(object2)

    ```


    If object1 < object2: The value of i returned will be negative.


    If object1 > object2: The value of i returned will be positive.


    If object1 = object2: The value of i returned will be zero.


    ## 77: What are the differences between the Comparable and Comparator interfaces?


    Answer:


    | Comparable | Comparator |

    | :--- | :--- |

    | It uses the compareTo() method. | It uses the compare() method. |

    | int objectOne.compareTo(objectTwo) | int compare(ObjOne, ObjTwo) |

    | It is necessary to modify the class whose instance is going to be sorted. |
    A separate class can be created in order to sort the instances. |

    | Only one sort sequence can be created. | Many sort sequences can be created.
    |

    | It is frequently used by the API classes. | It used by third-party classes to
    sort instances. |

