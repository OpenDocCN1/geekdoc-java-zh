    # 36: Would you be willing to relocate if required?


    Answer:

    You should be clear on this with your family prior to the interview if you think
    there is a chance it may come up. Do not say yes just to get the job if the real
    answer is no. This can create a lot of problems later on in your career. Be honest
    at this point. This will save you from future grief.


    # 37: Are you willing to put the interests of the organization ahead of your own?


    Answer:

    This is a straight loyalty and dedication question. Do not worry about the deep
    ethical and philosophical implications. Just say yes.'
  - '[PAGE 103]


    # 38: Describe your management style.


    Answer:


    Try to avoid labels. Some of the more common labels, like progressive, salesman
    or consensus, can have several meanings or descriptions depending on which management
    expert you listen to. The situational style is safe, because it says you will
    manage according to the situation, instead of one size fits all.


    # 39: What have you learned from mistakes on the job?


    Answer:


    Here you have to come up with something or you strain credibility. Make it small,
    well intentioned mistake with a positive lesson learned. An example would be,
    working too far ahead of colleagues on a project and thus throwing coordination
    off.


