    # Core JAVA Interview Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    This page is intentionally left blank


    # OOPS


    # 1: What are the principle concepts of OOPS?


    Answer:


    There are four principle concepts upon which object oriented design and programming
    rest. They are:


    - a) Abstraction

    - b) Polymorphism

    - c) Inheritance

    - d) Encapsulation


    (i.e. easily remembered as A-PIE).


    # 2: What is Abstraction?


    Answer:


    Abstraction refers to the act of representing essential features without including
    the background details or explanations.


    # 3: What is Encapsulation?


    Answer:


    Encapsulation is a technique used for hiding the properties and behaviors of an
    object and allowing outside access only as appropriate. It prevents other objects
    from directly altering or accessing the properties or methods of the encapsulated
    object.


    # 4: What is the difference between abstraction and encapsulation?


    Answer:


    Abstraction focuses on the outside view of an object (i.e. the interface) Encapsulation
    (information hiding) prevents clients from seeing it’s inside view/where the behavior
    of the abstraction is implemented. Abstraction solves the problem in the design
    side while Encapsulation is the Implementation: Encapsulation is the deliverable
    of Abstraction. Encapsulation barely talks about grouping up your abstraction
    to suit the developer needs.


    # 5: What is Inheritance?


    Answer:


    Inheritance is the process by which objects of one class acquire the properties
    of objects of another class. A class that is inherited is called a superclass.
    The class that is the inheriting is called a subclass. Inheritance is done using
    the keyword extends.


    The two most common reasons to use inheritance are:


    - a) To promote code reuse

    - b) To use polymorphism


    # 6: What is Polymorphism?


    Answer:


    Polymorphism is briefly described as "one interface, many implementations." Polymorphism
    is a characteristic of being able to assign a different meaning or usage to something
    in different contexts - specifically, to allow an entity such as a variable, a
    function, or an object to have more than one form.


    # 7: How does Java implement polymorphism?


    Answer:


    Inheritance, Overloading and Overriding are used to achieve Polymorphism in Java.
    Polymorphism manifests itself in Java in the form of multiple methods having the
    same name.


    In some cases, multiple methods have the same name, different argument lists (overloaded).
    In other cases, multiple methods have the same name, return type, and same argument
    list (overridden).


    # 8: Explain the different forms of Polymorphism.


    Answer:


    There are two types of polymorphism, one is Compile time polymorphism and the
    other is run time polymorphism. Compile time polymorphism is method overloading.
    Runtime polymorphism is done using inheritance.


    # 9: What is runtime polymorphism or dynamic dispatch?


    Answer:


    In Java, runtime polymorphism or dynamic dispatch is a process in which a call
    to an overridden method is resolved at runtime rather than at compile time. In
    this process, an overridden method is called through the reference variable. The
    determination of the method to be called is based on the object being referred
    to.


    # 10: What is Dynamic Binding?


    Answer:


    Binding refers to the linking of a procedure call to the code to be executed in
    response to the call. Dynamic binding (also known as late binding) means that
    the code associated with a given procedure call is not known until the time of
    the call. It is associated with polymorphism and inheritance.


    # 11: What is method overloading?


    Answer:


    Method Overloading means to have two or more methods with same name in the same
    class with different arguments. The benefit of method overloading is that it allows
    you to implement methods that support the same operation but differ by argument
    number or type.


    # Important Note:


    - a) Overloaded methods MUST change the argument list.

    - b) Overloaded methods CAN change the return type.

    - c) Overloaded methods CAN change the access modifier.

    - d) Overloaded methods CAN declare new or broader checked exceptions.

    - e) A method can be overloaded in the same class or in a subclass.


    # 12: What is method overriding?


    Answer:


    Method overriding occurs when sub class declares a method that has the same type
    arguments as a method declared by one of its superclass. The key benefit of overriding
    is the ability to define behavior that’s specific to a particular subclass type.


    Note: The overriding method cannot have a more restrictive access modifier than
    the method being overridden (You can’t override a method marked public and make
    it protected). You cannot override a method marked final. You cannot override
    a method marked Static.


    # 13: What is the difference between method overloading and method overriding?


    Answer:


    | | Overloaded Method | Overridden Method |

    |---|---|---|

    | Arguments | Must change | Must not change |

    | Return type | Can change | Can''t change except for covariant returns |

    | Exceptions | Can change | Can reduce or eliminate. Must not throw new or broader
    checked exceptions |

    | Access | Can change | Must not make more restrictive (can be less restrictive)
    |

    | Invocation | Reference type determines which overloaded version is selected.
    Happens at compile time. | Object type determines which method is selected. Happens
    at runtime. |

