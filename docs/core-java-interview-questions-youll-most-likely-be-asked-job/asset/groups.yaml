    multiple files into a single archive file. A JAR file will contain a manifest.mf
    file inside META-INF folder that describes the version and other features of JAR
    file.


    ## 141: What is Static initializer block? What is its use?


    # Answer:


    A Static initializer block is a block of code that declares with the Static keyword.
    It normally contains the block of code that must execute at the time of class
    loading. The Static initializer block will execute only once at the time of loading
    the class only.


    ## 142: What is a marker interface? Give some examples.


    # Answer:


    Marker interface contains no methods. It is used to just mark Java classes that
    support certain capability.

    Eg: Serializable, Cloneable, SingleThreadModel etc.


    ## 143: What are Tag interfaces?


    # Answer:


    Tag interface is an alternate name for Marker interface.


    ## 144: What are the restrictions placed on Static method?


    # Answer:


    We cannot override Static methods. We cannot access any object variables inside
    Static method. Also the this reference is not available in Static methods.


    ## 145: What is JVM?


    # Answer:


    JVM stands for Java Virtual Machine. It is the runtime for Java programs. All
    Java programs are running inside this JVM. It converts Java byte code to OS-specific
    commands. In addition to governing the execution of an application’s byte codes,
    the virtual machine handles related tasks such as managing the system’s memory,
    providing security against malicious code, and managing multiple threads of program
    execution.


    ## 146: What is JIT?


    # Answer:


    JIT stands for Just In Time compiler. It compiles Java byte code to native code.


    ## 147: What is Method overloading?


    # Answer:


    Method overloading is the process of creating a new method with the same name
    and different signature.


    ## 148: What is Method overriding?


    # Answer:


    Method overriding is the process of giving a new definition for an existing method
    in its child class.


    ## 149: What is finalize()?


    # Answer:


    Finalize is a protected method in java. When the garbage collector is executed,
    it will first call finalize(), and on the next garbage-collection it reclaims
    the objects'' memory. So finalize(), gives you the chance to perform some cleanup
    operation at the time of garbage collection.


    ## 150: What is Multi-threading?


    # Answer:


    Multi-threading is the scenario where more than one threads are running.


    ## 151: What is a deadlock?


    # Answer:


    Deadlock is a situation when two threads are waiting for each other to release
    a resource. Each thread waits for a resource which is held by the other waiting
    thread.


    ## 152: What is the difference between Iterator and Enumeration?


    # Answer:


    Enumeration is twice as fast as Iterator and uses very less memory. Enumeration
    is very basic and fits to basic needs, but Iterator is much safer as compared
    to Enumeration because it always denies other threads to modify the collection
    object. Whenever a second thread tries for that, Iterator will throw a ConcurrentModificationException.
    Iterators that do this are known as fail-fast iterators as they fail quickly and
    cleanly.


    An Enumeration is used for iterating over a given collection, usually of unknown
    size. Enumeration does not allow modification of the collection, which can be
    achieved using Iterator.


    Iterator’s “remove” method removes from the underlying collection the last element
    returned by the iterator. This method can be called only once per call to the
    Iterator’s “next” method.


    ## 153: What is internationalization?


    # Answer:


    Internationalization is the process of designing an application so that it can
    be adapted to various languages and regions without changes.


    ## 154: What is the difference between URL and URLConnection?


    # Answer:


    A URL represents the location of a resource, and a URLConnection represents a
    link for accessing or communicating with the resource at the location.


