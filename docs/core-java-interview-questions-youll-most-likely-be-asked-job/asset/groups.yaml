    ## 137: What is object pooling?


    # Answer:


    Creating a large number of identical short-lived objects is called object pooling.
    This helps to minimize the need of garbage collection and makes the memory use
    more effective.


    ## 138: What is Garbage collection?


    # Answer:


    Garbage collection is the process of releasing memory used by unreferenced objects.
    It relieves the programmer from the process of manually releasing the memory used
    by objects.


    ## 139: What is the disadvantage of Garbage collection?


    # Answer:


    It adds an overhead that can affect performance.


    Additionally, there is no guarantee that the object will be garbage collected.


    ## 140: What is JAR file?


    # Answer:


