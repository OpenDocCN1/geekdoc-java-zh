    - a) ServerSocket

    - b) Socket.


    ServerSocket is useful for two-way socket communication.

    Socket class helps us to read and write through the sockets.

    getInputStream() and getOutputStream() are the two methods available in Socket
    class.


    # HR Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    This page is intentionally left blank.


    ## 1: Tell me about yourself?


    # Answer:


    The most often asked question. You need to have a short statement prepared in
    mind. Limit it to one or two minutes. Be careful that it does not sound rehearsed.
    Start with the farthest back and work up to present.


    ## 2: Why did you leave your last job?


    # Answer:


    Stay positive regardless of the circumstances. Never refer to a major problem
    with management and never speak ill of supervisors, co-workers or the organization.


    ## 3: What experience do you have in this field?


    # Answer:


    Speak about specifics that relate to the position you are applying for. If you
    do not have specific experience, get as close as you can.


    ## 4: Do you consider yourself successful?


    # Answer:


    You should always answer yes and briefly explain why. A good explanation is that
    you have set goals, and you have met some and are on track to achieve the others.


    ## 5: What do co-workers say about you?


    # Answer:


    Be prepared with a quote or two from co-workers. Either a specific statement or
    a paraphrase will work. Bill Smith, a co-worker at Clarke Company, always said
    I was the hardest worker he had ever known.


    ## 6: What do you know about this organization?


    # Answer:


    This question is one reason to do some research on the organization before the
    interview. Research the company''s products, size, reputation, image, goals, problems,
    management style, skills, history, and philosophy. Be informed and interested.
    Find out where they have been and where they are going. What are the current issues
    and who are the major players?


    ## 7: What have you done to improve your knowledge in the last year?


    # Answer:


    Try to include improvement activities that relate to the job. A wide variety of
    activities can be mentioned as positive self-improvement. Have some good ones
    handy to mention.


    ## 8: Are you applying for other jobs?


    # Answer:


    Be honest but do not spend a lot of time in this area. Keep the focus on this
    job and what you can do for this organization. Anything else is a distraction.


    ## 9: Why do you want to work for this organization?


    # Answer:


    This may take some thought and certainly should be based on the research you have
    done on the organization. Sincerity is extremely important here and will easily
    be sensed. Relate it to your long-term career goals. Never talk about what you
    want; first talk about their needs. You want to be part of an exciting forward-moving
    company. You can make a definite contribution to specific company.

