    ## 55: 如何从 ArrayList 获取数组？


    答案：


    可以使用 ArrayList 的 `toArray()` 方法从 ArrayList 中获取数组。


    ```

    ArrayList arrayList = new ArrayList();


    arrayList.add(obj1)


    Object a[] = arrayList.toArray();

    ```


    ## 56: 为什么与 LinkedList 相比，ArrayList 的插入和删除较慢？


    答案：


    ArrayList 内部使用数组来存储元素，当数组通过插入元素被填满时，会创建一个大小大约为原数组 1.5 倍的新数组，并将旧数组的所有数据复制到新数组中。在删除时，数组中被删除元素之后的所有元素都必须向前移动一步，以填充删除操作留空间。


    在链表中，数据存储在节点中，节点包含指向上一个节点和下一个节点的引用，因此添加元素非常简单，只需创建节点并更新上一个节点的 `next` 指针以及新节点的
    `previous` 指针即可。


    链表的删除操作非常快，因为它只需要更新被删除节点之前节点的 `next` 指针以及被删除节点之后节点的 `previous` 指针。


    ## 57: 为什么 ArrayList 返回的迭代器被称为 Fail Fast（快速失败）？


    答案：


    因为如果在创建迭代器后，以任何通过迭代器自身的 `remove` 或 `add` 方法以外的方式对列表进行结构性修改，迭代器将抛出 `ConcurrentModificationException`。因此，在面对并发修改时，迭代器会快速且干净地失败，而不是在未来的某个不确定时间面临任意的、非确定性行为的风险。


    ## 58: 你如何决定何时使用 ArrayList，何时使用 LinkedList？


    **答案：**


    如果你需要支持随机访问，且不在末尾以外的地方插入或删除元素，那么 ArrayList 是最优的集合。然而，如果你需要频繁从列表中间添加和删除元素，并且仅按顺序访问列表元素，那么
    LinkedList 提供了更好的实现。


    ## 59: 什么是 Set 接口？


    答案：


    Set 接口提供了访问有限数学集合中元素的方法。


    - a) Set 不允许重复元素

    - b) 除了继承自 Collection 的方法外，不包含其他方法

    - c) 它增加了禁止重复元素的限制

    - d) 如果两个 Set 对象包含相同的元素，则认为它们是相等的


    ## 60: Set 接口的主要实现类有哪些？


    答案：


    （注：原文此处误为 List，应为 Set）Set 接口的主要实现如下：


    - a) HashSet

    - b) TreeSet

    - c) LinkedHashSet

    - d) EnumSet


    ## 61: 什么是 HashSet？什么时候应该使用它？


    答案：


    HashSet 是一个无序、无顺序的 Set。它使用被插入对象的 `hashcode`（你的 `hashcode()` 实现越高效，访问性能就越好）。当你需要一个没有重复元素的集合，并且不在意遍历时的顺序时，使用此类。


    ## 62: 什么是 TreeSet？


    答案：


    TreeSet 是一种保持元素排序顺序的 Set 实现。元素根据元素的自然顺序或在创建时提供的比较器（comparator）进行进行排序。


    ## 63: 什么是 EnumSet？


    答案：


    EnumSet 是一种专门用于枚举类型（enum）的特殊集合，它包含了创建集合时显式或隐式指定的该枚举类型中的所有元素。


    ## 64: HashSet 和 TreeSet 的区别是什么？


    # 你可能被问到的核心 Java 面试题


    答案：


    | HashSet | TreeSet |

    | :--- | :--- |

    | HashSet 属于 set 接口，即它不保证排序顺序或序列顺序。 | TreeSet 属于 set 接口，即它提供了排序后的元素（升序）。 |

    | 我们可以向 hash set 添加任何类型的元素。 | 我们只能向 tree set 添加相同类型的元素。 |


    ## 65: 什么是 Map？


    Map 是一个存储键值对关联关系（associations）的对象。Map 存储的是键值对（key-value pairs）。Map 允许空值，键必须是唯一的，值可以重复。


    ## 66: Map 接口的主要实现类有哪些？


    答案：


    Map 接口的主要实现如下：


    - a) HashMap

    - b) Hashtable

    - c) TreeMap

    - d) EnumMap


    ## 67: 什么是 TreeMap？


    答案：


    TreeMap 实现了 SortedMap 接口。在 TreeMap 中，元素根据元素的自然顺序或创建时提供的比较器进行排序。


    ## 68: 你如何决定何时使用 ArrayList，何时使用 LinkedList？


    答案：


    如果你需要支持随机访问，且不在末尾以外的地方插入或删除元素，那么 ArrayList 是最优的集合。然而，如果你需要频繁从列表中间添加和删除元素，并且仅按顺序访问列表元素，那么
    LinkedList 提供了更好的实现。


    ## 69: HashMap 和 Hashtable 的区别？


    答案：


    | HashMap | Hashtable |

    | :--- | :--- |

    | HashMap 不是同步的。 | Hashtable 是同步的。 |

    | HashMap 允许空值。 | Hashtable 不允许空值。 |

    | HashMap 更快。 | Hashtable 较慢。 |


    ## 70: 什么是静态块（static block）？它的用途是什么？


    答案：


    静态块是在类加载时执行的代码块。用于初始化静态变量。


    ## 71: Map 提供哪些视图？


    答案：


    Map 提供三种视图：


    - Key Set - 允许作为键查看

    - Values Collection - 允许作为值查看

    - Entry Set - 允许作为键值对映射查看


    ## 72: 什么是 KeySet 视图？


    答案：


    KeySet 是 Map 的 `keySet()` 方法返回的集合。包含了 map 中所有的键。


    ## 73: 什么是 Values Collection？


    答案：


    Values Collection 是 Map 的 `values()` 方法返回的集合。包含了 map 中所有的值。


    ## 74: 什么是 EntrySet 视图？


    答案：


    EntrySet 视图是 `entrySet()` 方法返回的集合，其中的每个元素都包含键和值。


    ## 75: 如何对自定义对象的 ArrayList（或任何列表）排序？


    答案：


    创建一个 `Comparator` 接口的实现，了解如何排序你的对象，并将其传递给 `Collections.sort()`。


    ## 76: 什么是 Comparable 接口？


    答案：


    Comparable 接口用于通过 `Collections.sort()` 和 `Arrays.sort()` 分排序集合和数组。实现 Comparable
    接口的对象是可以排序的。


    泛型形式的 Comparable 接口如下：


    ```

    interface Comparable<T>

    ```


    其中 T 是类型参数的。所有实现 Comparable 接口的类都必须实现返回整数的 `compareTo()` 方法。该方法的签名如下：


    ```

    int i = object1.compareTo(object2)

    ```


    如果 object1 < object2: 返回值为负数。


    如果 object1 > object2: 返回值为正数。


    如果 object1 = object2: 返回值为零。


