- md: "\n## 14: Can overloaded methods be overridden too?\n\nAnswer:\n\nYes, derived\
    \ classes still can override the overloaded methods. Polymorphism can still happen.\
    \ Compiler will not bind the method calls since it is overloaded, because it might\
    \ be overridden now or in the future.\n\n## 15: Is it possible to override the\
    \ main method?\n\nAnswer:\n\nNO, because main is a Static method. A Static method\
    \ can't be overridden in Java.\n\n## 16: How to invoke a superclass version of\
    \ an Overridden method?\n\nAnswer:\n\nTo invoke a superclass method that has been\
    \ overridden in a subclass, you must either call the method directly through a\
    \ superclass instance, or use the super prefix in the subclass itself. From the\
    \ point of view of the subclass, the super prefix provides an explicit reference\
    \ to the superclass's implementation of the method.\n\n```\n// From subclass\n\
    super.overriddenMethod();\n```\n\n## 17: What is Super?\n\nAnswer:\n\nSuper is\
    \ a keyword which is used to access the method or member variables from the superclass.\
    \ If a method hides one of the member variables in its superclass, the method\
    \ can refer to the hidden variable through the use of the super keyword. In the\
    \ same way, if a method overrides one of the methods in its superclass, the method\
    \ can invoke the overridden method through the use of the super keyword.\n\nNote:\
    \ You can only go back one level. In the constructor, if you use super(), it must\
    \ be the very first code, and you cannot access any this.xxx variables or methods\
