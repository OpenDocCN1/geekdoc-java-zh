    an object to be managed by a hash-based data structure. A hashCode should be equal
    for equal objects, fast to compute based on all or most of the internal state
    of an object, use all or most of the space of 32-bit integers in a fairly uniform
    way, and likely to be different even for objects that are very similar. If you
    are overriding hashCode, you need to override the equals method also.


    # 124: What is an I/O filter?


