    # 131: What are the access modifiers available in Java?


    Answer:


    Access modifiers specify where a method or attribute can be used. Public is accessible
    from anywhere. Protected is accessible from the same class and its subclasses.
    Package/Default are accessible from the same package. Private is only accessible
    from within the class.


    # 132: Why is Java said to be pass-by-value?


    Answer:


    When assigning an object to a variable, we are actually assigning the memory address
    of that object to the variable. So the value passed is actually the memory location
    of the object. This results in object aliasing, meaning you can have many variables
    referring to the same object.


    # 133: What do you mean by immutable? How to create an immutable object?


