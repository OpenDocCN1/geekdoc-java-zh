    # 12: Are you a team player?


    Answer:


    You are, of course, a team player. Be sure to have examples ready. Specifics that
    show you often perform for the good of the team rather than for yourself is good
    evidence of your team attitude. Do not brag; just say it in a matter-of-fact tone.
    This is a key point.


    # 13: How long would you expect to work for us if hired?


    Answer:


    Specifics here are not good. Something like this should work: I''d like it to
    be a long time. Or As long as we both feel I''m doing a good job.


    # 14: Have you ever had to fire anyone? How did you feel about that?


    Answer:


    This is serious. Do not make light of it or in any way seem like you like to fire
    people. At the same time, you will do it'
  - '[PAGE 94]


    when it is is the right thing to do. When it comes to the organization versus
    the individual who has created a harmful situation, you will protect the organization.
    Remember firing is not the same as layoff or reduction in force.


    # 15: What is your philosophy towards work?


    Answer:


    The interviewer is not looking for a long or flowery dissertation here. Do you
    have strong feelings that the job gets done? Yes. That''s the type of answer that
    works best here. Keep it short and positive, showing a benefit to the organization.


    # 16: If you had enough money to retire right now, would you?


    Answer:


    Answer yes if you would. But since you need to work, this is the type of work
    you prefer. Do not say yes if you do not'
