    答案：


    如果类中不存在其他构造函数，编译器将提供一个默认构造函数。


    # 111: 方法覆盖（Override）有哪些限制？


    答案：


    被重写的方法必须具有与父类方法完全相同的签名，包括返回类型。指定的访问权限不能比父类方法get。我们不能在重写的方法中抛任何新异常。


    # 112: 什么是类型转换（Casting）？


    答案：


    类型转换意味着将一种类型转换为另一种类型。主要有两种类型的类型转换：


    - a) 原始类型之间的转换

    - b) 对象引用之间的转换。


    原始数值类型之间的转换用于将较大的数据类型转换为较小的数据类型。


    对象引用之间的转换用于通过兼容的类、接口或数组类型引用来引用对象。


    # 113: == 和 equals() 有什么区别？


    答案：


    `equals` 方法可以被认为是对对象的值进行深度比较，而 `==` 运算符执行的是浅比较。如果我们没有重写 `equals` 方法，两者的结果将是相同的。`==`
    用于比较对象引用。它用于检查两个对象是否指向同一个引用。


    # 114: 什么是 void 返回类型？


    答案：


    `void` 表示该方法不会返回任何内容。


    # 115: 如果异常没有被捕获会发生什么？


    答案：


    未捕获的异常会导致线程的 `ThreadGroup` 触发 `uncaughtException()` 方法，从而导致程序终止。


    # 116: 线程进入等待状态的不同方式有哪些？


    答案：


    线程进入等待状态有三种方式：


    - a) 调用其 `sleep()` 方法，

    - b) 在 I/O 上阻塞，

    - c) 尝试获取对象的锁失败，或调用对象的 `wait()` 方法。


    # 117: 什么是 ResourceBundle 类？


    答案：


    `ResourceBundle` 类用于存储特定区域的资源，程序可以加载这些资源，以创建程序在运行的特定区域的显示界面。


    # 118: 什么是数值提升（Numeric promotion）？


    答案：


    数值提升是将较小的数值类型转换为较大的数值类型。在数值提升中，`byte`、`char` 和 `short` 值被转换为 `int` 值。如果需要，`int`、`long`
    和 `float` 值将转换为所需的类型。


    # 119: ++ 运算符的前缀形式和后置形式有什么区别？


    答案：


    前缀形式先执行增加操作，然后返回增加操作后的值。后置形式先返回表达式的当前值，然后对该值执行增加操作。


    # 120: 什么是同步方法（synchronized methods）和同步语句（synchronized statements）？


    答案：


    同步方法是用 `synchronized` 关键字声明的方法。线程只有在获取了方法对象或类的锁后，才会执行同步方法。同步语句与同步方法类似，它是用 `synchronized`
    关键字声明的代码块。只有在线程获取了同步语句中引用的对象或类的锁后，才能执行同步语句。


    # 121: 如何创建一个线程？


    答案：


    可以通过通过扩展 `Thread` 类或实现 `Runnable` 接口来创建线程。然后我们需要重写 `public void run()` 方法。


    # 122: switch 语句和 if 语句有什么区别？


    答案：


    `if` 语句用于从两种备选中进行选择。它使用布尔表达式来决定执行哪种备选。`if` 中的表达式必须是布尔值。`switch` 语句用于从多个备选中选择。`case`
    值必须提升为 `int` 值。


    # 123: 什么是 hashCode？


    答案：


    Java 对象的 `hashCode` 是一个数字（32位有符号 `int`），允许对象通过基于哈希的数据结构进行管理。对于相等的对象，`hashCode`
    应该相等；基于对象的全部或大部分内部状态计算要很快；以相当均匀的方式使用 32 位整数的所有或大部分空间；即使对于非常相似的对象，其值也可能不同。如果你重写了
    `hashCode`，则也需要重写 `equals` 方法。


    # 124: 什么是 I/O 过滤器（I/O filter）？


    答案：


    I/O 过滤器是从一个流读取并写入另一个流的对象，通常在数据从一个流传递到另一个流的过程中对其进行某种更改。


    # 125: RandomAccessFile 和 File 有什么区别？


    答案：


    `File` 类包含关于本地文件系统的文件和目录的信息。`RandomAccessFile` 类包含了直接访问所需的方法。


    # 126: 什么是 final？


    答案：


    `final` 是一个关键字。如果应用于变量，该变量将变成常量。如果应用于方法，它不能被重写。如果应用于类，我们无法扩展它。


    # 127: JVM Spec、JVM Implementation 和 JVM Runtime 之间有什么区别？


    答案：


    JVM Spec 是 JVM 的蓝图。JVM Implementation 是厂商提供的实际实现。JVM Runtime 是 JVM 的实际实例。


    # 128: 线程和进程有什么区别？


    答案：


    进程运行在自己的地址空间中。线程共享拥有它们的进程的地址空间。


    # 129: Vector 和 ArrayList 有什么区别？


    答案：


    Vector 是同步的，ArrayList 不是。Vector 有指定初始容量的构造函数，而 ArrayList 没有。默认情况下 Vector 增长 100%，而
    ArrayList 增长 50%。


    # 130: Hashtable 和 HashMap 有什么区别？


    答案：


    Hashtable 是同步的，HashMap 不是。Hashtable 不允许空值，但 HashMap 允许空值。


    # 131: Java 中哪些访问修饰符？


    答案：


    访问修饰符指定了方法或属性可以使用。`public` 处可用。`protected` 在同类及其子类中可用。包默认在同包内可用。`private` 仅在类内部可用。


    # 132: 为什么说 Java 是值传递（pass-by-value）？


    答案：


    将对象赋值给变量时，我们实际上是将对象的内存地址赋值给变量。因此，传递的值实际上是内存位置。这导致了对象引用，意味着多个变量可以引用同一个对象。


    # 133: 什么是不可变（immutable）？如何创建不可变对象？


    答案：


    不可变意味着对象在初始化后无法被修改。不可变类中不会有 setter 方法。通常这些类是 `final` 的。


    # 134: Java 中的类加载器（class loader）是什么？


    答案：


    类加载器是负责加载类的类。所有 JVM 都包含一个原始类加载器（Primordial class loader）。


    # 135: 什么是弱引用（weak reference）？


    答案：


    弱引用是指防止引用对象被垃圾回收的引用。弱引用不会保持它所引用的对象存活。弱引用在垃圾回收中不被视为引用。这将使用内存更加有效。


    # 136: 什么是对象克隆（object cloning）？


