    ## 78: Observer（观察者）和 Observable（观察对象）是如何使用的？


    答案：


    Observable 子类维护了一个观察者列表。


    每当 Observable 对象更新时，它会调用其每个观察者的 `update()` 方法，以通知观察者它的状态发生了变化。观察者是任何实现了 `Observer`
    接口的对象。


    ## 79: 什么是同步（Synchronization）？


    答案：


    同步是控制多个线程访问共享资源的能力。同步停止多线程并发。通过同步，同一时间只有一个线程能够访问共享资源。


    ## 80: yield() 和 sleep() 之间有什么区别？


    答案：


    当一个对象调用 `yield()` 时，它会返回就绪状态（ready state）。但当一个对象调用 `sleep()` 方法时，会进入非就绪状态（not
    ready state）。


    ## 81: 我们可以调用 finalize() 方法吗？


    答案：


    可以。如果某个方法在我们的类中是可的，没有人能阻止调用它。但如果一个对象是可达的（reachable），垃圾收集器就不会调用该对象的 `finalize`
    方法。


    ## 82: 时间分片（time slicing）和抢占式调度（preemptive scheduling）之间有什么区别？


    答案：


    在抢占式调度中，高优先级任务继续执行，直到它进入非运行状态（not running state）或出现更高优先级的任务。在时间分片中，任务执行预定义的一段时间，然后重新进入就绪任务池。


    ## 83: boolean 运算符 && 运算符与 && 运算符之间有什么区别？


    答案：


    当评估包含 `&` 运算符的表达式时，两个操作数都会被评估，并且 `&` 运算符被应用于这两个操作数。


    当评估包含 `&&` 运算符的表达式时，会评估第一个操作数。只有当第一个操作数返回 `true` 时，才会评估第二个操作数，否则第二部分将不会执行。`&&`
    也称为短路（short cut）。


    ## 84: 抽象类（abstract class）和接口（interface）之间有什么区别？


    答案：


    抽象类可以拥有具体的方法，这在接口中是不允许的。抽象类可以有私有或保护的方法和变量，而接口只允许公共方法和变量。我们可以实现多个接口，但只能扩展一个抽象类。接口提供了松耦合（loose
    coupling），而抽象类提供了紧耦合（tight coupling）。


    ## 85: 同步块（synchronized block）和同步方法（synchronized method）之间有什么区别？


    答案：


    同步块为指定的块放置锁，而同步方法则为整个方法放置锁。


    ## 86: 如何在 Java 中强制进行垃圾回收（garbage collection）？


    答案：


    你无法强制进行垃圾回收，但你可以通过调用 `system.gc()` 方法来请求。但这并不意味着垃圾回收会立即开始。垃圾回收是 JVM 的低优先级线程。


    ## 87: 普通方法和构造函数（constructors）有什么区别？


    答案：


    构造函数必须与类名相同，且没有返回类型。它们只被调用一次，而普通方法可以根据需要调用。我们不能显式地调用构造函数。


    ## 88: Java 中包（packages）有什么作用？


    答案：


    当项目包含多个模块时，包是组织 Java 文件的一种方式。它有助于解决不同模块具有相同名称类时的命名冲突问题。


    ## 89: 什么是序列化（serialization）？


    答案：


    序列化是保存对象状态的过程。


    ## 90: 什么是反序列化（de-serialization）？


    答案：


    反序列化是恢复对象状态的过程。


    ## 91: 什么是可外部化（externalizable）？


    答案：


    它是扩展 `Serializable` 的接口。它包含两个不同的方法 `writeExternal()` 和 `readExternal`。此接口允许我们自定义输出。


    ## 92: Java 中有哪些类型的异常？


    答案：


    Java 中有两种类型的异常，即受检异常（Checked exceptions）和未检异常（Unchecked exceptions）。任何派自 `Throwable`
    和 `Exception` 的异常（`RuntimeException` 及其子类除外）被称为受检异常。编译器会在编译时检查异常是否被捕获。我们需要捕获这些异常或在
    `throws` 子句中声明。任何派自 `Error` 和 `RuntimeException` 的异常被称为未检异常。我们不需要显式地捕获未检异常。


    ## 93: 可以在我们的 Java 程序中捕获错误（error）吗？


    答案：


    可以。我们可以捕获任何派自 `Throwable` 的内容。由于 `Error` 是 `Throwable` 的子类，我们也可以捕获错误。


    ## 94: 什么是线程优先级（Thread Priority）？


    答案：


    线程优先级是一个整数值，用于标识它相对于其他线程执行的相对顺序。线程优先级值范围为 1-10，默认值为 5。但如果一个线程优先级更高，并不意味着它会先执行。线程调度取决于操作系统。


    ## 95: 垃圾收集器可能会调用对象的 `finalize()` 方法多少次？


    答案：


    仅一次。


    ## 96: Continue 语句和 Break 语句之间有什么区别？


    答案：


    `Break` 语句会导致其所属的语句（`switch`、`for`、`do` 或 `while`）立即终止。`Continue` 语句用于结束当前的循环迭代并将控制权交还给循环语句。


    ## 97: 类要实现接口必须做什么？


    答案：


    类必须在它的 `implements` 子句中标识该接口。


    ## 98: 什么是抽象类（abstract class）？


    答案：


    抽象类是一个不完整的类。它用 `abstract` 修饰符声明。我们不能创建抽象类的对象。它被用于为所有子类指定一个通用协议。


    ## 99: notify 和 notifyAll 之间有什么区别？


    答案：


    `notify` 唤醒一个等待对象监视器（monitor）的线程。如果有任何线程在等待该对象，将选择其中一个唤醒。这种选择是随机的。`notifyAll`
    唤醒所有等待该对象的线程。


    ## 100: wait 方法的作用？


    答案：


    导致当前线程等待，直到另一个线程调用当前对象的 `notify` 或 `notifyAll` 方法，或者过了指定的时间。


    ## 101: 线程有哪些不同的状态？


    答案：


    线程的不同状态有就绪（ready）、运行（running）、等待（waiting）和死亡（dead）。


    ## 102: 静态（Static）内部类和非静态（non-Static）内部类之间有什么区别？


    答案：


    非静态内部类拥有与外部类实例关联的对象实例。静态内部类没有任何对象实例。


    ## 103: String 和 StringBuilder 类之间有什么区别？


    答案：


    `String` 是不可变的（常量），创建后无法更改值。`StringBuilder` 支持可变对象。


    ## 104: 读取器（readers）和流（streams）之间有什么区别？


    答案：


    读取器面向字符，而流面向字节。读取器对 Unicode 数据有完全支持。


    ## 105: 什么是构造器链（constructor chaining）？


    答案：


    当一个类的构造函数执行时，它会自动调用父类的默认构造函数（如果没有显式调用任何父类构造函数），一直持续到层次结构的根部。


    ## 106: Java 中有哪些不同的原始数据类型？


    答案：


    Java 中有 8 种原始数据类型。


    - boolean

    - char

    - byte

    - short

    - int

    - long

    - float

    - double


    ## 107: 静态（static）关键字是什么？


    答案：


    静态意味着每个类有一个。静态变量在类加载时创建。它们与类相关。访问静态变量不需要对象。我们可以直接通过调用 `类名.变量名` 来访问静态方法和变量。


