    mean it.


    # 17: Have you ever been asked to leave a position?


    Answer:


    If you have not not, say no. If you have, be honest, brief and avoid saying negative
    things about the people or organization involved.


    # 18: Explain how you would be an asset to this organization.


    Answer:


    You should be anxious for this question. It gives you a chance to highlight your
    best points as they relate to the position being discussed. Give a little advance
    thought to this relationship.


    # 19: Why should we hire you?


    Answer:


    Point out how your assets meet what the organization'
  - '[PAGE 96]


    needs. Also mention about your knowledge, experience, abilities, and skills. Never
    mention any other candidates to make a comparison.


    # 20: Tell me about a suggestion you have made.


    Answer:


    Have a good one ready. Be sure and use a suggestion that was accepted and was
    then considered successful. One related to the type of work applied for is a real
    plus.


    # 21: What irritates you about co-workers?


    Answer:


    This is a trap question. Think real hard but fail to come up with anything that
    irritates you. A short statement that you seem to get along with folks is great.


    # 22: What is your greatest strength?


    Answer:


    Numerous answers are good, just stay positive. A few'
  - '[PAGE 97]


    good examples: Your ability to prioritize, Your problem-solving skills, Your ability
    to work under pressure, Your ability to focus on projects, Your professional expertise,
    Your leadership skills, Your positive attitude


    # 23: Tell me about your dream job or what are you looking for in a job?


    Answer:


    Stay away from a specific job. You cannot win. If you say the job you are contending
    for is it, you strain credibility. If you say another job is it, you plant the
    suspicion that you will be dissatisfied with this position hired. The best is
    to stay genetic and say something like: A job where I love the work, like the
    people, can contribute and can''t wait to get to work.


    # 24: Why do you think you would do well at this job?


    Answer:


    Give several reasons and include skills, experience and'
  - '[PAGE 98]


    interest.


    # 25: What do you find the most attractive about this position? (Least attractive?)


    Answer:


    +   a) List a couple of attractive factors such as the responsibility the post
    offers and the opportunity to work with experienced teams that have a reputation
    for innovation and creativity.

    b) Say you''d need more information and time before being able to make a judgment
    on any unattractive aspects.


    # 26: What kind of person would you refuse to work with?


    Answer:


    Do not be trivial. It would take disloyalty to the organization, violence or lawbreaking
    to get you to object. Minor objections will label you as a whiner.'
  - '[PAGE 99]


    # 27: What is more important to you: the money or the work?


    Answer:


    Money is always important, but the work is the most important. There is no better
    answer.


    # 28: What would your previous supervisor say your strongest point is?


    Answer:


    There are numerous good possibilities:

    Loyalty, Energy, Positive attitude, Leadership, Team player, Expertise, Initiative,
    Patience, Hard work, Creativity, Problem solver.


    # 29: Tell me about a problem you had with a supervisor.


    Answer:


    Biggest trap of all! This is a test to see if you will speak ill of your boss.
    If you fall for it and tell about a problem with a former boss, you may well below
    the interview right'
  - '[PAGE 100]


    there. Stay positive and develop a poor memory about any trouble with a supervisor.


    # 30: What has disappointed you about a job?


    Answer:


    Don''t get trivial or negative. Safe areas are few and can include:


    +   a) Not enough of a challenge.


    +   b) You were laid off in a reduction Company did not win a contract, which
    would have given you more responsibility.


    # 31: Tell me about your ability to work under pressure.


    Answer:


    You may say that you thrive under certain types of pressure. Give an example that
    relates to the type of position applied for.


    # 32: Do your skills match this job or another job more'
  - '[PAGE 101]


    closely?


    Answer:


    Probably this one! Do not give fuel to the suspicion you may want another job
    more than this one.


    # 33: What motivates you to do your best on the job?


    Answer:


    This is a personal trait that only you can say, but good examples are: Challenge,
    Achievement, and Recognition.


    # 34: Are you willing to work overtime? Nights? Weekends?


    Answer:


    This is up to you. Be totally honest.


