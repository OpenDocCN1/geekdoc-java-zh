    # 128: What is the difference between thread and process?


    Answer:


    A process runs in its own address space. Threads share the same address space
    of the process that owns them.


    # 129: What is the difference between Vector and ArrayList?


    Answer:


    Vector is synchronized, ArrayList is not. Vector has a constructor to specify
    the incremental capacity, but ArrayList doesn''t. By default Vector grows by 100%
