    # 38: What are Access Specifiers?


    Answer:


    One of the techniques in object-oriented programming encapsulation. It concerns
    the hiding of data in a class and making this class available only through methods.
    Java allows you to control access to classes, methods, and fields via so-called
    access specifiers.


    # 39: Name the Access Specifiers available in Java?


    Answer:


    Java offers four access specifiers, listed below in decreasing accessibility:


    - Public - Public classes, methods, and fields can be accessed from everywhere.


    - Protected - Protected methods and fields can only be accessed within the same
    class to which the methods and fields belong, within its subclasses, and within
    classes of the same package.


    - Default(no specifier) - If you do not set access to specific level, then such
    a class, method, or field will be accessible from inside the same package to which
    the class, method, or field belongs, but not from outside this package.


    - Private - Private methods and fields can only be accessed within the same class
    to which the methods and fields belong. private methods and fields are not visible
    within subclasses and are not inherited by subclasses. See details in the following
    table.


    | Situation | Public | Protected | Default | Private |

    | :--- | :--- | :--- | :--- | :--- |

    | Accessible to class from same package? | Yes | Yes | Yes | No |

    | Accessible to class from different package? | Yes | No, unless it is a subclass
    | No | No |


    # 40: What is final modifier?


    Answer:


    The final modifier keyword makes sure that the programmer cannot change the value
    anymore. The actual meaning depends on whether it is applied to a class, a variable,
    or a method.


    - final Classes - A final class cannot have subclasses.


    - final Variables - A final variable cannot be changed once it is initialized.


    - final Methods - A final method cannot be overridden by subclasses.


    # 41: What are the uses of final method?


    Answer:


    There are two reasons for marking a method as final:


    - a) Disallowing subclasses to change the meaning of the method.

    - b) Increasing efficiency by allowing the compiler to turn calls to the method
    into inline Java code.


    # 42: What is a Static block?


    Answer:


    Static block is executed exactly once when the class is loaded into JVM. Before
    going to the main method the Static block will execute.


    # 43: What are Static variables?


    Answer:


    Variables that have only one copy per class are known as Static variables. They
    are not attached to a particular instance of a class but rather belong to a class
    as a whole.


    They are declared by using the Static keyword as a modifier.


    ```

    Static type varIdentifier;

    ```


    where, the name of the variable is varIdentifier and its data type is specified
    by type.


    **Note:** Static variables that are not explicitly initialized in the code are
    automatically initialized with a default value.


    The default value depends on the data type of the variables.


    # 44: What is the difference between Static and non-Static variables?


    **Answer:**


    A Static variable is associated with the class as a whole rather than with specific
    instances of a class. Non-Static variables take on unique values with each object
    instance.


    # 45: What are Static methods?


    Answer:


    Methods declared with the keyword Static as modifier are called Static methods
    or class methods. They are called Static methods because they affect a class as
    a whole, not a particular instance of the class. Static methods are always invoked
    without reference to a particular instance of a class.


    Note: The use of a Static method suffers from the following restrictions:


    - a) A Static method can only call other Static methods.

    - b) A Static method must only access Static data.

    - c) A Static method cannot reference to the current object using keywords super
    or this.


    # JAVA COLLECTION


    # 46: What is an Iterator?


    Answer:


    The Iterator interface is used to step through the elements of a Collection. Iterators
    let you process each element of a Collection.


    Iterators are a generic way to go through all the elements of a Collection no
    matter how it is organized. Iterator is an Interface implemented a different way
    for every Collection.


    # 47: How do you traverse through a collection using its Iterator?


    Answer:


    To use an iterator to traverse through the contents of a collection, follow these
    steps:


    - a) Obtain an iterator to the start of the collection by calling the collection''s
    iterator() method.

    - b) Set up a loop that makes a call to hasNext(). Have the loop iterate as long
    as hasNext() returns true.

    - c) Within the loop, obtain each element by calling next().


    # 48: How do you remove elements during Iteration?


    Answer:


    Iterator also has a method remove() when remove is called, the current element
    in the iteration is deleted.


    # 49: What is the difference between Enumeration and Iterator?


    Answer:


    | Enumeration | Iterator |

    | :--- | :--- |

    | Enumeration doesn''t have a remove() method | Iterator has a remove() method
    |

    | Enumeration acts as Read-only interface, because it has the methods only to
    traverse and fetch the objects | Can be abstract, final, native, Static, or synchronized


    # 50: What is ListIterator?


    Answer:


    ListIterator is just like Iterator, except it allows us to access the collection
    in either the forward or backward direction and lets us modify an element # 51:
    What is the List interface?


    Answer:


    The List interface provides support for ordered collections of objects. Lists
    may contain duplicate elements.


    # 52: What are the main implementations of the List interface?


    Answer:


    The main implementations of the List interface are as follows:


    - ArrayList: Resizable-array implementation of the List interface. The best all-around
    implementation of the List interface.

    - Vector: Synchronized resizable-array implementation of the List interface with
    additional "legacy methods."

    - LinkedList: Doubly-linked list implementation of the List interface. May provide
    better performance than the ArrayList implementation if elements are frequently
    inserted or deleted within the list. Useful for queues and double-ended queues
    (deques).


    # 53: What are the advantages of ArrayList over arrays?


    Answer:


    Some of the advantages ArrayList has over arrays are:


    - a) It can grow dynamically

    - b) It provides more powerful insertion and search mechanisms than arrays.


    # 54: Difference between ArrayList and Vector?


    Answer:


    | ArrayList | Vector |

    | :--- | :--- |

    | ArrayList is NOT synchronized by default. | Vector List is synchronized by default.
    |

    | ArrayList can use only Iterator to access the elements. | Vector list can use
    Iterator and Enumeration Interface to access the elements. |

    | ArrayList increases its array size by 50 percent if it runs out of room. | A
    Vector defaults to doubling the size of its array if it runs out of room |

