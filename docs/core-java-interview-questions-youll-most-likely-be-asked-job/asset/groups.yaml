    ## 78: How Observer and Observable are used?


    Answer:


    Subclass of Observable class maintains a list of observers.


    Whenever an Observable object is updated, it invokes the update() method of each
    of its observers to notify the observers that it has a changed state. An observer
    is any object that implements the interface Observer.


    ## 79: What is Synchronization?


    Answer:


    Synchronization is the ability to control the access of multiple threads to shared
    resources. Synchronization stops multi-threading. With synchronization, at a time
    only one thread will be able to access a shared resource.


    ## 80: What is the difference between yield() and sleep()?


    Answer:


    When a object invokes yield() it returns to ready state. But when an object invokes
    sleep() method enters to not ready state.


    ## 81: Can we call finalize() method?


    Answer:


    Yes. Nobody will stop us to call any method, if it is accessible in our class.
    But a garbage collector cannot call an object''s finalize method if that object
    is reachable.


    ## 82: What is the difference between time slicing and preemptive scheduling?


    Answer:


    In preemptive scheduling, highest priority task continues execution till it enters
    a not running state or a higher priority task comes into existence. In time slicing,
    the task continues its execution for a predefined period of time and reenters
    the pool of ready tasks.


    ## 83: What are the differences between boolean & operator and && operator


    Answer:


    When an expression containing the & operator is evaluated, both operands are evaluated
    and the & operator is applied to the operand.


    When an expression containing && operator is evaluated, the first operand is evaluated.
    If the first operand returns a value of true only then the second operand is evaluated
    otherwise the second part will not get executed. && is also called short cut and.


    ## 84: What are the differences between an abstract class and an interface?


    Answer:


    An Abstract class can have concrete method, which is not allowed in an interface.
    Abstract class can have private or protected methods and variables and only public
    methods and variables are allowed in interface. We can implement more than one
    interface, but we can extend only one abstract class. Interfaces provides loose
    coupling where as abstract class provides tight coupling.


    ## 85: What is the difference between synchronized block and synchronized method?


    Answer:


    Synchronized blocks place locks for the specified block where as synchronized
    methods place locks for the entire method.


    ## 86: How can you force garbage collection in Java?


    Answer:


    You cannot force Garbage Collection, but you can request it by calling the method
    system.gc(). But it doesn''t mean that Garbage Collection will start immediately.
    The garbage collection is a low priority thread of JVM.


    ## 87: What''s the difference between normal methods and constructors?


    Answer:


    Constructors must have the same name of the class and can not have a return type.
    They are called only once, while regular methods can be called whenever required.
    We cannot explicitly call a constructor.


    ## 88: What is the use of packages in Java?


    Answer:


    Packages are a way to organize files in Java when a project consists of more than
    one module. It helps in resolving name conflicts when different modules have classes
    with the same names.


    ## 89: What is serialization?


    Answer:


    Serialization is the process of saving the state of an object.


    ## 90: What is de-serialization?


    Answer:


    De-serialization is the process of restoring the state of an object.


    ## 91: What is externalizable?


    Answer:


    It is an interface that extends Serializable. It is having two different methods
    writeExternal() and readExternal. This interface allows us to customize the output.


    ## 92: What are different type of exceptions in Java?


    Answer:


    There are two types of exceptions in Java i.e. Checked exceptions and Unchecked
    exceptions. Any exception that is derived from Throwable and Exception is called
    checked exception except RuntimeException and its subclasses. The compiler will
    check whether the exception is caught or not at compile time. We need to catch
    the checked exception or declare in the throws clause. Any exception that is derived
    from Error and RuntimeException is called unchecked exception. We don''t need
    to explicitly catch an unchecked exception.


    ## 93: Can we catch an error in our Java program?


    Answer:


    Yes. We can catch anything that is derived from Throwable. Since Error is a sub
    class of Throwable we can catch an error also.


    ## 94: What is Thread Priority?


    Answer:


    Thread Priority is an integer value that identifies the relative order in which
    it should be executed with respect to others. The thread priority values ranging
    from 1-10 and the default value is 5. But if a thread has higher priority doesn’t
    means that it will execute first. The thread scheduling depends on the OS.


    ## 95: How many times may an object''s finalize() method be invoked by the garbage
    collector?


    Answer:


    Only once.


    ## 96: What is the difference between a Continue statement and a Break statement?


    Answer:


    Break statement results in the immediate termination of the statement to which
    it applies (switch, for, do, or while). A Continue statement is used to end the
    current loop iteration and return control to the loop statement.


    ## 97: What must a class do to implement an interface?


    Answer:


    A Class must identify the interface in its implements clause.


    ## 98: What is an abstract class?


    Answer:


    An abstract class is an incomplete class. It is declared with the modifier abstract.
    We cannot create objects of the abstract class. It is used to specify a common
    protocol for all child classes.


    ## 99: What is the difference between notify and notifyAll?


    Answer:


    Notify wakes up a single thread that is waiting for object''s monitor. If any
    threads are waiting on this object, one of them is chosen to be awakened. The
    choice is arbitrary and occurs at the discretion of implementation. notifyAll
    wakes up all threads that are waiting on this object.


    ## 100: What does wait method do?


    Answer:


    It causes current thread to wait until either another thread invokes notify or
    notifyAll method of the current object, or a specified amount of time has elapsed.


    ## 101: What are the different states of a thread?


    Answer:


    The different thread states are ready, running, waiting and dead.


    ## 102: What is the difference between Static and non-Static inner class?


    Answer:


    A non-Static inner class can have an object instances that are associated with
    instances of the class''s outer class. A Static inner class can not have any object
    instances.


    ## 103: What is the difference between String and StringBuffer class?


    Answer:


    Strings are immutable (constant), their values cannot be changed after they are
    created. StringBuilder supports mutable objects.


    ## 104: What is the difference between readers and streams?


    Answer:


    Readers are character oriented whereas streams are byte oriented. The readers
    are having full support for Unicode data.


    ## 105: What is constructor chaining?


    Answer:


    When a constructor of a class is executed it will automatically call the default
    constructor of the super class (if no explicit call to any of the super class
