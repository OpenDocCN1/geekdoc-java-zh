    陷阱题！如果你已经了解了盲点，那么它们就不再是盲点了。在这里不要透露任何你个人关注的领域。让他们自己去发现你的缺点。不要把主动权交给他们。


    ## 41: 如果你正在为这份工作招聘人员，你会寻找什么？


    回答：


    注意提到所需的特质以及你所具备的特质。


    ## 42: 你认为你对这个职位来说资历过高了吗？


    回答：


    无论你的资历如何，都要说明你非常胜任你面试的这个职位。


    ## 43: 你打算如何弥补经验的不足？


    回答：


    首先，如果你有面试官不知道的经验，请提出来：然后，指出（如果属的话）你是一个勤奋且学习速度快的人。


    ## 44: 你对老板有什么特质的要求？


    回答：


    回答要通用且积极。安全的特质包括：博学多才、有幽默感、公平、对下属忠诚以及拥有高标准。所有的老板都认为自己具备这些特质。


    ## 45: 请讲述一次你帮助他人解决纠纷的经历。


    回答：


    选择一个具体的事件。重点关注你解决问题的技巧，而不是你解决的纠纷本身。


    ## 46: 在某个项目的团队中，你倾向于担任什么位置？


    回答：


    诚实回答。如果你在不同的角色中都能感到自如，请指出这一点。


    ## 47: 描述你的工作准则。


    回答：


    强调对组织的益处。诸如：完成工作的决心、努力工作并且热爱工作等都是很好的回答。


    ## 48: 你职业生涯中最大的幻灭是什么？


    回答：


    确保你提到的是你无法控制的事情。表现出接受的态度，不要带有负面情绪。


    ## 49: 告诉我在工作中感到最有趣的时刻。


    回答：


    谈论为组织完成某些任务而带来的快乐。


