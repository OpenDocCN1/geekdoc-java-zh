  mdcn: "\n\n## 14: 重载方法也可以被重写吗？\n\n答案：\n\n是的，派生类仍然可以重写重载的方法。多态仍然可以发生。编译器不会绑定方法调用，因为它是重载的，因为该方法现在或将来可能被重写。\n\
    \n## 15: 可以重写 main 方法吗？\n\n答案：\n\n不可以，因为 main 是一个静态方法（Static method）。在 Java 中，静态方法不能被重写。\n\
    \n## 16: 如何调用被重写方法的父类版本？\n\n答案：\n\n要调用在子类中被重写的父类方法，你必须直接通过父类实例调用该方法，或者在子类中使用 super\
    \ 前缀。从子类的角度来看，super 前缀提供了对父类该方法实现的显式引用。\n\n```\n// 在子类中\nsuper.overriddenMethod();\n\
    ```\n\n## 17: 什么是 Super？\n\n答案：\n\nSuper 是用于访问父类方法或成员变量的关键字。如果方法隐藏了其父类中的某个成员变量，该方法可以通过\
    \ `super` 关键字引用被隐藏的变量。同样，如果一个方法重写了其父类中的某个方法，该方法可以通过 `super` 关键字调用被重写的方法。\n\n注意：你只能回溯一级。在构造函数中使用\
    \ much `super()`，它必须是第一行代码，且你不能访问任何 `this.xxx` 变量或方法来计算它的参数。\n\n## 18: 如何防止方法被重写？\n\
    \n答案：\n\n为了防止特定方法在子类中被重写，在方法声明上使用 `final` 修饰符，这意味着“这是该方法的最终实现”，即其继承层次的终点。\n\n\
    ```\npublic final void exampleMethod() {\n  // 方法语句\n}\n```\n\n## 19: 什么是接口（Interface）？\n\
    \n答案：\n\n接口是对实现类必须遵守的一组方法定义的描述。\n\n注意：\n\n- a) 你不能将接口标记为 final。\n- b) 接口变量必须是静态的（Static）。\n\
    - c) 接口不能扩展除其他接口以外的任何内容。\n\n## 20: 我们可以实例化接口吗？\n\n答案：\n\n你不能直接实例化接口，但你可以实例化实现接口的类。\n\
    \n## 21: 我们可以为接口创建对象吗？\n\n答案：\n\n是的，总是必须为接口创建一个对象实现。接口本身无法实例化，因此你必须编写一个实现接口的类并履行其中定义的所有方法。\n\
    \n## 22: 接口有成员变量吗？\n\n答案：\n\n接口可以有成员变量，但这些变量是隐式的公共（public）、静态（Static）且最终的（final）。换句话说，接口只能声明常量，而不能声明所有实现都可用的实例变量（例如可以作为方法参数的关键引用）。\n\
    \n## 23: 接口中的方法允许哪些修饰符？\n\n答案：\n\n接口方法只允许使用公共（public）和抽象（abstract）修饰符。\n\n## 24:\
    \ 什么是标记接口（Marker interface）？\n\n答案：\n\n标记接口是不声明任何所需方法的接口，但表示它们与某些操作的兼容性。`java.io.Serializable`\
    \ 接口和 `Cloneable` 是典型的标记接口。它们不包含任何方法，但类必须实现这些接口才能被序列化。\n\n## 25: 什么是抽象类（Abstract\
    \ class）？\n\n答案：\n\n抽象类是包含一个或多个抽象方法的类。抽象方法是声明了但没有包含实现的方法。\n\n注意：\n\n- a) 即使只有一个方法是抽象的，整个类也必须声明为抽象的。\n\
    - b) 抽象类不能实例化，并要求子类为抽象方法提供实现。\n- c) 你不能将一个类同时标记为抽象和 final。\n\n## 26: 我们可以实例化抽象类吗？\n\
    \n答案：\n\n抽象类不能被实例化。它的唯一目的是被扩展。\n\n## 27: 抽象类和接口的区别是什么？\n\n答案：\n\n| 抽象类 | 接口 |\n\
    | --- | --- |\n| 抽象类可以提供完整的实现 | 接口只需要签名 |\n| 抽象类只能继承一个 | 接口可以实现多个 |\n| 抽象类可以非抽象方法\
    \ | 接口的方法都是抽象的 |\n| 抽象类可以拥有成员变量 | 接口没有成员变量 |\n| 抽象类可以具有任何可见性（public/private/protected）\
    \ | 接口的可见性必须是公共的（public） |\n| 如果在抽象类中添加新方法，可以选择实现 | 如果在接口中添加新方法，则没有 |\n| 抽象类可以包含构造函数\
    \ | 接口不能包含构造函数 |\n| 抽象类是快速的 | 接口是缓慢的 |\n\n## 28: 什么时候应该使用抽象类，什么时候应该使用接口？\n\n答案：\n\
    \n使用接口当：\n\n- a) 设计会频繁变化时。如果各种实现共享签名，使用接口更好。\n- b) 当你需要实现定义的方法时。\n\n使用抽象类当：\n\n\
    - a) 如果各种实现是相同的，使用抽象类更好。\n- b) 当你想提供通用的形式供类继承时。\n- c) 抽象类是创建层次结构的极佳方式，也是叶子类的良好选择。\n\
    \n## 29: 当你将方法声明为抽象时，其他抽象方法可以访问它吗？\n\n答案：是的，其他抽象方法可以访问你声明为抽象的方法。\n\n## 30: 可以存在没有方法的抽象类吗？\n\
    \n答案：是的，可以存在没有方法的抽象类。\n\n## 31: 什么是构造函数（Constructor）？\n\n答案：构造函数是一种用于初始化对象的特殊方法。它的特殊之处在于名称与类名相同。它们没有返回类型，甚至没有\
    \ void，因此不能返回值。它们不能被继承，尽管派生类可以调用基类的构造函数。当创建关联类的对象时，构造函数就会被调用。\n\n## 32: 什么是默认构造函数？\n\
    \n答案：如果代码定义的类没有任何构造函数，编译器会自动为类提供一个无参数构造函数（默认构造函数）。默认构造函数的访问修饰符（public/private\
    \ 等）与类本身相同。\n\n## 33: 构造函数可以被继承吗？\n\n答案：不可以，构造函数不能被继承，尽管派生类可以调用基类的构造函数。\n\n##\
    \ 34: 构造函数和方法的区别是什么？\n\n答案：\n\n| 构造函数 | 方法 |\n| --- --- |\n| 创建类的实例 | 分组 Java\
    \ 语句 |\n| 修饰符 | 不能是抽象、最终、原生、静态或同步 | 可以是抽象、最终、原生、静态或同步 |\n| 返回类型 | 无返回类型，甚至没有 void\
    \ | void 或有效的返回类型 |\n| 名称 | 与类名相同（约定首字母大写）——通常是名词 | 类以外的任何名称。方法名以小字母开头——通常是动作名称\
    \ |\n| this | 指向同一类中的另一个构造函数。如果使用，它必须是构造函数的第一行 | 指向所属类的实例。不能在静态方法中使用 |\n\n"
