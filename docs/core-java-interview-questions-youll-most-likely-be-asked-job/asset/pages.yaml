  md: '# 7: How does Java implement polymorphism?


    Answer:


    Inheritance, Overloading and Overriding are used to achieve Polymorphism in Java.
    Polymorphism manifests itself in Java in the form of multiple methods having the
    same name.


    In some cases, multiple methods have the same name, but different formal argument
    lists (overloaded methods). In other cases, multiple methods have the same name,
    same return type, and same formal argument list (overridden methods).


    # 8: Explain the different forms of Polymorphism.


    Answer:


    There are two types of polymorphism, one is Compile time polymorphism and the
    other is run time polymorphism. Compile time polymorphism is method overloading.
    Runtime time polymorphism is done using inheritance and interface.'
