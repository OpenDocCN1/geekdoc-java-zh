  md: "```\npublic static void main(String[] args) {\n    ① SecretMessagesGUI theApp\
    \ = new SecretMessagesGUI();\n    ② theApp.setSize(new java.awt.Dimension(600,400));\n\
    \    ③ theApp.setVisible(true);\n}\n```\n\nThe line at ① creates a SecretMessagesGUI\
    \ object called theApp. The new keyword followed by the class name runs the constructor\
