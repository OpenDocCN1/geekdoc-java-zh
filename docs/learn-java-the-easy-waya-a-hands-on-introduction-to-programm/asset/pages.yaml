  md: "Android Studio will fill in the OnSeekbarChangeListener with three methods:\
    \ onProgressChanged(),onStartTrackingTouch(),onStopTrackingTouch(). We want to\
    \ use onProgressChanged(), as this will tell us when the user has changed the\
