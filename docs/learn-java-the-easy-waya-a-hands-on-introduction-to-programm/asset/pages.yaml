- img_proc: true
  md: 'The Caesar cipher is named for the Roman emperor Julius Caesar (100–44 BCE).
    Historians say Caesar liked to encode his private messages, such as by ''shifting''
    the letters of the alphabet. For example, the cipher disk shown in Figure 6-1
    shifts the alphabet by 13 letters.


    In the disk, the outer letters align with the inner letters they should be substituted,
    so as an $A$ becomes $N$, a $B$ becomes $O$, and so on. This is the cipher that
    created the following:


    Secret messages are so cool!

    Frperg zrffntr ner pbby!


    ![](img/3adc91bcbd2fd7adb1324b7a67680674_149_0.png)


    The first line is the *plaintext*: the original, readable version of the message.
    The second line is the *ciphertext*, the encoded version of the message.


    Decoding this message back to its original by reversing the substitution: find
    each inner letter and substitute it with the corresponding outer layer.

    Not all Caesar ciphers are like this one. *Symmetric* means that the process can
    be used for both encoding and decoding a message. For example, $F$ becomes $S$
    when encoding by 13, and $S$ becomes $F$ when decoding by subtracting 13, and
    you can use the same disk and *key*—the number to shift the letters—in this case
    13—is called a key because knowing it ''unlocks'' the cipher. The Secret Messages
    app will build allow us to use any key value.


    # Setting Up the Secret Messages App


    We''ll build the Secret Messages app like we did the Hi-Lo guessing game: first,
    we''ll create a command line version, and a GUI for the desktop, and finally an
    Android mobile app. The command line version will look fairly simple, as shown
    in Figure 6-2, but it will allow us to test the secret algorithm quickly and easily.


    ```

    C:\Users\Bryson Payne\workspace_ch0\SecretMessages\bin>Java SecretMessagesnEnter
    message to encode or decode:

    Secret messages are so cool!

    Enter a key (-25 to 25):

    13

    Frperg zrffntr ner pbby!

    C:\Users\Bryson Payne\workspace_ch0\SecretMessages\bin>_

    ```


    Figure 6-2: The command line version of the Secret Messages app'
