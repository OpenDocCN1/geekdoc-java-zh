    Where I''ve used a lowercase s in system, Eclipse underlines the missp-

    adding an error alert along the left border of the screen that you can

    by moving over it. The Java compiler issues the error "system

    cannot resolved". That means Java can''t figure out what system is supposed

    to be because it only understands System with a capital S. Eclipse does the

    with playAgain on the line—it will be playAgain.


    Remember that you can use the content assist feature in Eclipse to fix

    many errors like. Click one of the misspelled words from Figure A-1,

    and you''ll see a content assist like the one in Figure A-2.


    | system cannot be resolved | playagain cannot be resolved to a variable |

