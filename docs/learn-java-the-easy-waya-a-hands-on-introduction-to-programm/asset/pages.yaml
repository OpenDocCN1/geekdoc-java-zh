    \  String output = encode(message, key);\n  txtOut.setText(output);\n} catch (Exception\
    \ e) {\n}\n}\n```\n\nEclipse highlighting the catch block in red, so let's go\
    \ ahead and add\nthe catch block. We'll need to tell Java what to do when bad\
    \ input is\nreceived, and we'll add those steps inside the braces for the catch\
