    \ motion.\n\nBack in Figure 10-11, the bubble is moving towards the right edge\
    \ of the screen, where x=getWidth(), meaning the bubble's x value is at the maximum\
    \ x-coordinate, the width of the screen in pixels. To make it look like it's bouncing,\
    \ we change the direction by reversing the xspeed. The bubble was moving by some\
    \ positive number of pixels each time it updated; if it touches the edge of the\
    \ screen, we can make it move in the opposite direction by changing the xspeed.\
    \ In other words, we can xspeed negative to make the bubble move to the left and\
    \ away from the right edge of the screen after bounces.\n\nWe reverse the bubble's\
    \ horizontal direction by setting xspeed = -xspeed, which makes xspeed the opposite\
    \ of itself. So, an xspeed of 3 pixels per frame would change to an xspeed of\
