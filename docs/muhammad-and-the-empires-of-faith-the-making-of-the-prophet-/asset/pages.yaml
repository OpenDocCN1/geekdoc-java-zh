    With Heraclius''s decisive victory over the Persians in 628 C.E., the emperor
    exploited the victory as a chance to reinvigorate his empire''s triumphalist ideology.
    Heraclius began to promote the idea that with Byzantium''s defeat of Sasanid Persia,
    a new Golden Age had dawned, an age of prosperity that would prepare humankind
    for the Day of Judgment under the aegis of Rome. The revitalizing drive the Heracian
    triumphalism manifested in many spheres of imperial propaganda. Kevin van Bladel,
    for example, providing a compelling account of how pro-Heracian propaganda portrayed
    the emperor as a new Alexander in the Syriac Alexander Legend and how far each
    of this left its impact, not just on early Islamic kerygma, but also on the text
    of the Qur. However, al-Zuhri''s depiction of Heraclius as a stargazer draws on
    another thread of Heracian propaganda. As part of imperial renewal, Heraclius
    alsovers a reordering of the calendrical observance of Christian ritual and, concomitantly,
    the very tabulation of historical time. These calend reforms involved the reordering
    of the time scale of human history that revealed the workings of divine providence,
    in practical terms, required new, up-to-date means of accurately calculating the
    dates for events such as the Creation, the Flood, and crucial episodes in the
    life of Jesus Christ. The yearly pascal cycle, which fixed the annual dates of
    Easter, posed a particularly formidable challenge, and its standardization would
    constitute a formidable achievement for Heraclius. To provide the best and most
    accurate means of its determination, would require employing sophisticated enough
    to transcend the ecclesiastical divisions within Christianity. Embedded in Heraclius''s
