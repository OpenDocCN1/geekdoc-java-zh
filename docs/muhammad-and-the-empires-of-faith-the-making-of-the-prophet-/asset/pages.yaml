    What is significant in the above story of the Magḥāzī of Ibn ʿthmān ibn ‘ʿAbd,
    however, is what it tells us about the early codification and recording of traditions
    about the past general and stories about the recent Islamic past in particular.
    Firstly, we see the role of the wealthy elite and politically enfranchised scholars
    in overseeing and priming for the compilation of the Prophet’s biography—broadly
    called in Arabic al-siyar wa-l-magḥāzī (war-conduct and expeditions)—for the sake
    of its dissemination. This theme of court initiates throughout accounts of subsequent
    successful attempts to compile traditions after Muhammad’s life into books. What
    is also notable is that Abān ibn ʿthmān ibn ‘ already compiled a book for his
    own private use prior to Sulayman’s commission. This was for Abān’s private benefit,
    and what Sulayman did seek to disseminate Abān’s book among the imperial elite—in
    fact, to “publish”.


    Another key feature of the account should also be highlighted: the role of the
    costly elite in the story above is decisive, it also ambivalent. The costly elite
    neither controlled nor themselves produced this corpus; they intervened in its
    dissemination at a crucial time in order to oversee its being committed to writing
    and its dissemination. Hence, while in the stories of the Prophet and his Companions
    thrived, as did therein, independently of the calhal court, they played a decisive
    role in what traditions written rather than oral, and how that writing came to
    be redacted in the shadow of its patronage and sponsorship.


