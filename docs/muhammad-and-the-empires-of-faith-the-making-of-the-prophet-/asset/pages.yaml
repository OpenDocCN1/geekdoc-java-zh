  md: '# THE BEGINNINGS OF THE SĪRAH-MAGHĀZĪ LITERATURE


    taken the form of al-Zuhri dictating stores of his knowledge to scribes who made
    official records for use by the Umayyads and their court and to students who subsequently
    passed on this material and organized it as they saw fit without intervention
    by the authorities. The intervention of the authorities to affect the recording
    of this knowledge in writing seems to have been the most important contribution
    of the court. Al-Zuhri has vast knowledge of the Median traditions and their learning—of
    *hadith*, maghāzī, qurʿanic exegesis (*tafsīr*), or jurisprudence (*fiqh*)—and
    his elite stature among them guaranteed the lasting and indelible influence of
    the enterprise.


    As Ibn Shihāb al-Zuhri himself, he allegedly owned no books containing traditions
    and never copied himself for public distribution. Ibrāīm Ibn Saʿ al-Zuhri recounts
    how al-Zuhri, in cases where *hadith* was lengthy, allegedly borrowed of writing
    material (*waraqah*) from his fellow Median scholar al-Raj (d.117/735), who used
    to make a living copying the Qurʿan, only to memorize it and then erase what he
    had once learned by heart. For al-Zuhri, and many other scholars of his age, the
    act of recording a tradition served as a memory aid, but it was no substitute
    for the ultimate goal of memorization. That goal was achieved, records had no
    longer purpose. One of al-Zuhri’s closest pupils, Yunus Ibn Yazid al-Alily, told
    of how he once asked al-Zuhri for his writings, when upon the scholar ordered
    a female slave to bring them out. However, Yunus recounted his story when the
    slave girl brought out merely “scrolls containing poetry”⁸², or according to another
    version of the story, al-Zuhri owned not a single piece of writing except for
    a record of his tribe’s lineage⁸³ All of these personal writings of the scholar
    paired in comparison to the vast record of al-Zuhri’s traditions kept by the Umayyad
    court. Maʿmar ibn Rshid claims to have witnessed the fate of these records of
    al-Zuhri’s traditions: “We used to think that we had learned a great deal from
    al-Zuhri until al-Walid [II] was assassinated and, lo, notebooks of al-Zuhri’s
    knowledge were carried out by burdens of burden [the caliph’s storehouses].”⁸⁴
