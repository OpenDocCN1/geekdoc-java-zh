  md: '# INTRODUCTION 11


    interested and self-serving memories of individuals and groups become the final
    arbiter of historical knowledge.^{33}


    Then, how, historians escape prosaic: broaden the source base and enlarge the
    archive. However, the implementation of the solution is also fraught: the boundaries
    between history and memory are often elusive, and history can never fully vanquish
    memory or its pluralities (i.e., the perennial existence of "histories" rather
    than an all-encompassing, grand narrative of History).^{34} One sees this in the
    first such strategy to be adopted in modern times—namely, setting aside the sirāmaghāẓī
    tradition for the historical Muhammad and turning to the other cardinal sources,
    especially the Qur and early non-Muslim accounts. Since of Muhammad and the Empires
    of Faith in fact argues for the importance of integrating non-Muslim source material,
    I shall briefly outline the challenges that the Qur poses vis-à-vis—the siraah-maghāẓī
    literature.


    The Qur is the earliest and most important artifact of the life of Muhammad and,
    therefore, the best witness to the religious and sociocultural milieu of his earliest
    followers. Moreover, the Qur''an documentation and the material evidence for its
    redaction and transmission are peerless in the Arabic corpus. This assertion,
    not the naive sentiments of believers or pietistic scripturists, but rather an
    emerging consensus based over a century and a half of Western scholarship and
    debate, inaugurated by the publication of the first edition of Theodor Nöldeke''s
    *Geschichte des Qurräns* in 1860. The text of the Qur''an had been established
    as a written document decades after Muhammad''s death first based on the basis
    of the intrinsic qualities of the Qur itself.^{35} However, the arguments for
    the Qur''s antiquity have been strengthened by breakthroughs in the paleographical
    analysis of the early Arabic script and codicological and radiocarbon analysis
    of the surviving fragments of the Qur''an on parchment and papyrus.^{36} All of
    this leads modern historians to an encouraging conclusion: the theological narrative
    that renders the sirah-maghāẓī literature as a problematic historical source has
    not touched the Qur''an, the primeval document of Islamic religion.


