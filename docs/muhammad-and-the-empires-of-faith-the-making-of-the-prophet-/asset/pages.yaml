    does not survive independently; however, numerous quotations from it survive in
    later sources, in particular via the recension of his Saʿid ibn Yahā al-Umawī
    (d. 294/869).¹¹⁹ Ella Landau-Tasseron has deduced that, like many other students
    of Ibn Ishāq, may have supplemented Ibn Ishāq’s original work with additional
    traditions.¹²⁰ A renowned hadith scholar from Baghdad named Abū l-Qāsim al-Baghdad
    (d. 317/929) relates a fascinating story of how, after having been introduced
    to him by his grandfather, Saʿid ibn Yahā (al-juz al-awwal) of Ibn Ishāq’s Maġāzī
    so that he could make his own copy. Al-Baghdad then made the rounds of the local
    scholars informing him that they intended to learn from Saʿid ibn Yahā, and they
    agreed to pay him anywhere between ten and twenty dinars to prepare a copy of
    the work for themselves, with which he would transmit in turn. By the day’s end,
    al-Baghdad claims that he had earned over two hundred dinars, spending just a
    small amount on the writing materials needed for the copies.The anecdote gives
    a sense of how costly a complete copy of the work would be—just the revision (tahdhib)
    of Ibn Hisham was likely divided into three quarters.¹²¹


    Ibn Ishāq composed and taught portions of Kitāb al-Maġāzī before leaving Medina
    remains relatively well established. The version of the text which Ibn Ishāq taught
    to Ibrahīm ibn Saʿd al-Zuhrī dates from the period prior to his departure from
    Medina and offers a glimpse into the work at its earliest stage. Ibn Ishāq’s Maġāzī
    undoubtedly continued to evolve thereafter. Less certain, however, is how Abbasid
    patronage expertly shaped the shape of his work. Our most direct account of the
    Abbasid court exerting its influence on the contents of the Kitāb comes from an
