  md: 'This is not to say that all the historical problems surrounding the Qur’an
    have been resolved—they have not, but by a short list. The earliest manuscripts
    of the Qur’an are copied in “defective” Arabic devoid of vowel markings and lacking
    signs to disambiguate similarly written consonants. As result, the highly stylized,
    oral recitations (jīrā ʿat) of Qur’an relate to the archaic text of the earliest
    manuscripts has yet to be fully determined.³37 Codology has simultaneously established
    the early date of the Qur’an and called into question the circumstances and motivations
    behind its codification as reluctant historical accounts of its codification from
    the second/eighth century.³38 Deeply intertwined with the question of the Qur
    as well is the very history of the Arabic language. Thanks to new discoveries
    in epigraphy and historical linguistics, history is on the brink of being rewritten,
    upending old certainties.³39 The list goes on, but that means there is still plenty
    of work for scholars to do.


    So why not justiffen the sīrah-muḥāfiẓ tradition and rely solely on the Qur’an
    as our main source about the historical Muhammad? Although historians can, and
    indeed must, rely on the Qur’an when writing upon the historical Muhammad, it
    is an unusual historical source.³⁰ Embedded in the Qur’an is a great deal of information
    about the worldview and religiosity of its Messenger, his community, and its opponents,
    but the text contains few details about Muhammad that one could easily organize
    into a historical narrative. The Qur relates to Muhammad’s life, offers no narratives
    of his Companions or his enemies, and in general takes little interest in directly
    providing the immediate historical context for its message. The Qur was was divided
    into chapters sīrahs at its earliest stage (e.g., see Q. Niḥ 2:1), in its current
    form it does not present these sīrahs in chronological order but, roughly in order
    of the sīrahs’ size, with the longest sīrahs placed closer to the beginning and
    the shortest towards the end. The Qur, and surprisingly, has been preserved with
    the needs and concerns of the faithful in mind, not historians.


