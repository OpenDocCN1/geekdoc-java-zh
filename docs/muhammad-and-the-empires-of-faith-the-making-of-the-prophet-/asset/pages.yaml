    Long before Schooler''s study, scholars of the *sirah-maghāzī* literature had
    recognized the basic story of Muhammad''s call—the *iqra''* narrative—survives
    in two main versions, which in turn survive in numerous redactions of the *hadith*,
    tafīr, and *sirah-maghāzī* literature. Minor alternative versions of the story
    of how Muhammad was called to prophethood in addition to the better-known versions
    of the *iqra''* narrative have been extensively documented by prior studies. However,
    the *iqra''* narrative in its two surviving versions is undoubtedly the most dominant,
    preponderant story in the early Arabic literary tradition.


    The "original" version underlying the *iqra''* narrative is ultimately lost, but
    the story''s redactions are sufficiently attested in early textual testimonies
    to allow modern historians to credit with putting the respective versions into
    collection with a high degree of confidence. The first is the one found in the
    *Kitāb-Maghāzī* of Ibn Iqshāq (d. 767) and has been preserved in the numerous
    surviving versions of this work; the second is the version of Ibn Iqshāq''s teacher,
    Ibn Shihāh al-Zuhri (d. 742). Al-Zuhri''s version enjoys a broad attention throughout
    the *hadīth* literature, the earlier redaction survives in the *Kitāb-Maghāzī*
    of student ma'' Ibn Rāshid (d. 770), which is in present in the redactions of
    his student Abd al-Razzāq al-San''ī (d. 826). Both accounts overlap to a great
    extent and agree on all significant details. Overall, al-Zuhri''s account is sober
    and more pared-down, whereas Ibn Iqshāq contains more embellishments. This observation
    is common when comparing the respective accounts of al-Zuhri and his student Ibn
    Iqshāq. Furthermore, the account of al-Zuhri boasts a greater pedigree and claims
    to derive from *‘Urwah ibn al-Zuhri*''s transmission of the story from his aunt,
    the Prophet’s wife *‘Āishah ibn Abi Bakr*. Ibn Iqshāq''s account, however, exhibits
    more literary detail. These two versions are distinct, but are they entirely independent
    accounts?


    As long as the early 1860s, Aloys Sprenger had already suggested that the accounts
    of al-Zuhri and Ibn Iqshāq resembled one another so closely that they must be
    interdependent, but it took over a century for another scholar, G. H. A. Junnello,
    to provide a plausible account of how they were interrelated. Both accounts clearly
    had the same narrative structure, not purporting to recount how


