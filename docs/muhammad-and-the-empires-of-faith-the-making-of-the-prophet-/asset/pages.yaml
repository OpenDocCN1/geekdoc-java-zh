    In a basic sense, one can locate the imprint of hagiography in the most essential
    assumptions underiding the iʿra narrative: the sheer poetry of holy persons visions
    of angels in their dreams that they provide with authoritative and/ inserted texts.
    To overlook how such rudimentary assumptions are deeply rooted in late ancient
    hagiography is to overlook an essential feature of the early narratives of the
    sirah-maghāzi literature. For example, consider the story about a fourth-century
    Egyptian monk named Pachomius, recorded in the History of Gallatia (de before
    433 C.E.):


    One time when Pachomius was sitting in his cave an angel appeared to him and told
    him: "So far as you are concerned, you conduct your life properly. It is vain
    for you to continue sitting in your cave Come now,leave this place, and go out,
    and call the young monks with them. Rule them by the model that I am now giving."
    And the angel gave him a bronze tablet on which [the following rule was engraved
    ...]


    The rule angled to Pachomius from the bronze tablet laid the ground-work for the
    foundation of a new monastic community. Hagiographically speaking, the tablet
    presented to Pachomius is the functional equivalent of the silk scroll Gabriel
    presents to Muhammad in the cave Mount Ḥrā; both texts are received through preternatural
    visions and convey a revealed, divine discourse around which a new community of
    faith coalesced.


    Late hagiography, therefore, must be regarded as having set a baseline of expectations
    that shaped how Muslims conceived of God''s plan for humanity untold in history
    and the role of holy persons in the devotional plan for humankind. In the seminal
    narratives, the early purveyors of the sirahmaghāzi tradition strive to depict
    Muhammad as the ultimate holy person and the pinnacle of monotheistic prophecy.
    All the same, the question of the interrelationship between the iʿra narrative
    and Cædmon''s call is quite another thing altogether. Late antique hagiography
    provide a fixed model, or an identifiable narrative template, shared by the iʿra
