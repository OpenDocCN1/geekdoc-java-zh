  md: '# ACKNOWLEDGMENTS


    Many of the ideas underlying this book began to emerge early in 2012, when I first
    began translating one of our earliest surviving examples of a literary biography
    of the prophet Muhammad: the eighth-century Kitáb al-Maghāzī of Ma''mar ibn Rāshid,
    subsequently published in New York University Press’s Library of Arabic Literature
    series in 2015. Shortly after I finished the project, the editorial board of the
    Library of Arabic Literature (to my great surprise) took me under their wing and
    invited me to join their ranks. Ever since, I have had countless discussions and
    exchanges with them about the ideas in this book, Arabic literature in general,
    and life write—so much that it is impossible to keep track of the debt that this
    book owes me. All I know is so large. To Phil Kennedy, James Montgomery, Shawkat
    Toorawa, Julia Bray, Michael Cooperson, Joseph Lowry, Tahera Qutbuddin, Devin
    Stewart, and Maurice Pomeranz, I extend my deepest thanks for keeping the fire
    in my bones for Arabic and its literary heritage well kindled.


    In 2013, I arrived in Princeton with a Mellon fellowship at the School of Historical
    Studies at the Institute for Advanced Study. My intent was to work on my we still
    unfinished book on Arabic Shi‘ apocalypticism, but with the translation of Ma’s
    Maghāzī still fresh in my mind, I mostly ended up working on and researching topics
    that appear in this book. My good friend Stephen Shoemaker shares part of the
    blame for this—we ended up with offices facing each the hall that autumn, and
    we couldn''t resist constantly debating the historical Muhammad. We’re still debating,
    and he’s still teaching me a thing or two as well. The early stages of this book
    benefited immensely from the incredible resources of IAS and Princeton University,
    but even more from the faculty and fellows there. I must thank Hassan Ansari,
    Stefan Esdars, Sabine Schmidttke,'
