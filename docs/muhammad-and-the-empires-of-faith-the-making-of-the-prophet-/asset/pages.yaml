  md: '158 THE BEGINNINGS OF THE SĪRAḤ-MAGHĀZĪ LITERATURE


    was unprecedented about the Kitāb al-Maghāzī, however, was its ambition to capture
    the arc of God’s providential ordering of human history, from Adam to the advent
    of the prophecy of Muhammad and the victory of the last prophet’s ummah.¹⁴ An
    account cited by the historian al-Masʿūd (d. 345/956) lists the Maghāzī as one
    of the most famous accomplishments of the caliphate of Abu Ja‘ al-Manshūr:


    In the days of [al-Manshūr], Muhammad Ibn Ishāq put into writing the book of the
    expeditions of the Prophet and his policies, as well as the stories of Creation
    [wa kutub al-maghāzī wa-l-siyār wa-akhbār al-mubtāda]. Before that, they neither
    gathered together [maǧʿū ah], well known [mārifah], nor organized [muṣannaf]¹⁴⁴


    Ibn Ishāq patronaged by the Abbasids and his nearness to the court “put him at
    the heart of a revolutionary regime” for whom the entire sweep of time—whether
    pre-Islamic, prophetic, or the recent past—had taken on new meanings. Their were
    neither political triumph over the Umayyads; it was also an ideological one with
    deep political and religious undertones.¹⁴⁵ For the Abbasids and their revolution
    (dawlah), theirs were a victory of the Prophet’s clan, the Banū Hāšim, and of
    the descendants of him, al-ʿAbbās, over an Umayyad clan that had arrested away
    Muhammad’s legacy from his household and had himself ummah with blood spilled
    at the hands of tyranny. It is hard to imagine Ibn Ishāq’s codification and revision
    of the Maghāzī in such a context left the work scarcely untouched.


    # THE CORPUS OF IBN ISĀQ


    All these statements, however, must be accompanied by a word of caution: the entirety
    of Ibn Ishāq’s Kitāb al-Maghāzī does not survive, only recensions and selections
    of a vast work whose contents are familiar, but whose true parameters remain unknown.
    However, one gains a profound sense of its monumental scope from the substantial
    portions of the work that survive—whether in later (partial) recensions, epitomes,
    or quotations—and the very disparate nature of how the work enables scholars to
    peek around the interventions, omissions, and bowldwerization by one of its redactors.
    Following the early precedent of Johann Fuchs (1894–1974), modern scholars have
    accepted the hypothesis that Ibn Ishāq’s work was originally divided into three
    sections: “the Genesis” (al-Mubtāda ), relating humanity history and the history
    of


