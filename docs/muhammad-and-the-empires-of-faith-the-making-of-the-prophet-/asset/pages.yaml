  md: 'cultural trends that preceded the emergence of their genre and that were shared
    by multiple communities—be they Jewish, Christian, Muslim, or other. What should
    not be lost, in other words, is how the *sirah-maghāzi* literature responded to
    the other-Muslim sectarian milieu and the literary genres of Late Antiquity to
    create a uniquely autochthonous genre of Arabic literature. Although fashioned
    to serve the particular aims of Arabic-Islamic discourse and identity, the genre
    nevertheless promulgated a universal vision of human history and God''s cosmic,
    providential shaping of the course of human events through a series of monotheistic
    prophets, culminating in Muhammad.


    Moreover, this work has also argued that working with the *sirah-maghāzi* literature
    as a historical source requires first establishing a plausible, well-evidenced
    historical baseline through recourse to the other cardinal sources for the life
    and context of the historical Muhammad—early non-Muslim sources written (mostly)
    in Armenian, Greek, and Syriac; archaeological, material, and documentary evidence
    from the sixth to seventh centuries C.E.; and historical-critical readings of
    the Qur''an. When viewed as overlapping layers of evidence, rather than mutually
    exclusive antagonists, these “first-order” sources offer what one might call a
    “low-resolution view” of the historical Muhammad to guide us in approaching the
    *sirah-maghāzi* literature, and against which its narratives can be measured.
    Based on these early cardinal sources, it seems doubt that in the first half of
    the seventh century there emerged a law-giving claim to prophecy from Arabia,
    a Saracen/Ismaelite merchant from an Arabic-speaking tribe named Muhammad, who
    claimed to culmin a line of monotheistic Abrahamic prophets gifted with divine
    revelation. Furthermore, we can deduce on a well-sourced evidentiary basis that
    this prophetic claimant, whose earliest followers regarded themselves as descendants
    of the biblical patriarch Abraham, formed a community in West Arabia and became
    a ruler in Yathrib. This community coalesced around the prophet''s teachings,
    instantiated in a revelation called the Qur''an. Inspired by the prophet''s teachings,
    the new community embarked on wide-reaching campaigns of conquest, which from
    the mid-seventh century on engulfed much of Near East, Sasanid Persia and of the
    Eastern Roman Empire. All of these details appear, in one way or another, in seventh-century
    sources that were either recorded by insiders or written by outsiders who nonetheless
    witnessed the conquests, experienced their immediate effects, and interacted with
    these Arabian conquerors firsthand.


    Although none of the seventh-century non-Muslim sources yet know of the Qur—they
    refer to Muhammad’s teachings, his traditions, or his laws


