    I was with [my uncle] when Hishām ibn ʿAbd al-Malik ordered him to write down
    his hadīth for him. He seated several scribes around him, to whom al-Zuhri dictated
    while they wrote. I attended that session, and if perhaps need arose, I would
    leave to relieve myself. My uncle would then cease to dictate until I returned
    to my place.⁴³


    The mandate that al-Zuhri received from the caliph had two key aspects: firstly,
    the education of the caliph''s children and, secondly, the dictation to the scribes
    to create a written corpus for the sake of the Umayyad court. The tutelage of
    Hishām''s children overseen by al-Zuhri''s sons met with rather poor results;
    as none of Hishām''s ever amounted to much, and some were downright disorderly.¹⁴
    However, the project had far-reaching results and irrevocably transformed the
    landscape of early scholarship by creating an extensive corpus of the early tradition.
    Although begun in Damascus, much of the scholarly activity behind this enterprise
    transpired at Hishām''s court in Ruṣāfah four hundred kilometers northeast of
    Damascus. According to one of his students, Ruṣāfah remained al-Zuhri''s primary
    residence for almost twenty years, that is, the entirety of Hishām''s caliphate.⁴⁵


    # THE CORPUS OF IBN SHĪHĀB AL-ZUHRĪ


    Although no trace of the "official" corpus of the Umayyads'' record of al-Zuhri''s
    teaching in Hishām''s court at Ruṣāfah, the writing of al-Zuhri''s students and
    records kept by the scribes who attended his sessions in Ruṣāfah survive in part,
    albeit not original. These fragmentary writings offer us the most insight into
    the importance of these decades at Hishām''s court for the long-term preservation
    of this early stage of the tradition as it passed from a primarily oral to a primarily
    literary stage. Such writings also reveal the content of these traditions and
    give us our best insights into the larger corpus of material held by the Umayyad
    court. Among those who studied al-Zuhri''s feet in Ruṣāfah, the following were
    to highlighted:


