    public manifestations of their far-reaching, imperial power. Urwah himself abandoned
    Mecca and returned to Medina, the city of his birth, where he spent the remainder
    of his life as a scholar and teacher. The historicity of ‘Urwah’s residence in
    Medina during this time seems beyond reasonable doubt. Mays’a al-Ghabbana has
    recently discovered an inscription on the Hisismā plateau a.H. 80—which is to
    say ‘Urwah’s lifetime’—that mentions him by name.


    The original copies of ‘Urwah’s letters do not survive, and neither likes their
    exact wording, given the vagaries of their transmission. All that remains of them
    citations and excerpts embedded in later works, most completely in the works of
    Abu Ja fa Muhammad ibn Jarir al-Tabari (d. 310/923). The authenticity of (most
    not all) of these letters was defended by Aloys Sprenger (1813–1893) and Josef
    Horovitz (1874–1931), and it has more recently been vigorously defended by Andreas
    Görke and Gregor Schoeler; ‘Urwah’s authorship of the letters is also openly contested,
    most recently in years by Stephen Shoemaker.


