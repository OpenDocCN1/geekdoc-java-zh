    al-Ayyam on the outskirts of Mecca.³


    Whereas reports from the hadith literature assert that Muhammad had once earning
    as a shepherd and even offered neverification of this assertion, no parallel statements
    affirming that he had earning as a merchant can be found.³ Some hadith reports
    go so far as to categorically deny that Muhammad had been a merchant or trader
    in any way. In a report in the Kitab al-Zuhd (Asceticism) of Ahmad Hanbal (d.
    241/855), the Prophet emphatically states: “I have not been granted revelation
    to gather wealth or to be a merchant. I have been granted revelation to glorify
    your Lord with praise and before Him! (Q. Hijr 1598).”⁵ Another tradition voices
    similar rejection of the idea that Muhammad was a merchant but with apocalyptic
    tones: "God sent me as [a messenger] of doom [ba thani halmattan wa-rahmat]. He
    did not send to be a merchant or tiller of soil. The most wicked of people on
    the Day of Resurrection shall be merchants and tillers of soil, except he embraces
    poverty for his faith."⁶ Generally, the hadith literature portrays merchants in
    negative terms and as immoral and profane.⁷


    The diversity and prevalence of traditions depicting Muhammad as a shepherd in
    the hadith and sirah-maghazi literature demonstrate how important the image of
    Muhammad as a shepherd was, particularly as prophetic archetype. A key question
    of this investigation remains unresolved. Where does the assertion that Muhammad
    had been an Arabian merchant derive from? From the hadith or sirah-maghazi literature
    proffer any of the mercantile activities of Muhammad at all?


