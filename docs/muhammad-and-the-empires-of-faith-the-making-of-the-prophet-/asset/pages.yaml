  md: '# 82      BEFORE THE SĪRAH-MAGHĀZĪ LITERATURE


    veracity or verifiability of a banal factoid. Rather, it is directed at a more
    fundamental question: What does it mean to look at Muhammad as a historical figure?
    Essential to the answers that historians have given to this broader question is
    the axiom that one must first deduce the bare factual data, no matter how sparse
    or spare, the skeletal rudiments of any historical analysis. These rudiments serve,
    in turn, as the basic certainties upon which one builds inferences to be rationally
    argued as plausible and/or likely to varying degrees. The more robust and numerous
    these basic certainties, the better, since they create greater possibilities for
    subsequent inferences and potential discoveries.


    Often such data is admittedly banal: dates of birth and death, geographic origin,
    native language, social status, occupation, and so on. Yet although banalities
    are simplistic, they can be surprisingly elusive. The danger for historians, lies
    in the potential to forget or neglect the contingency of our knowledge as persons
    bound up in our history. Too often the path from "datum" to "fact" has been forgotten,
    ignored, or obscured by the sleepy consensus of historians. In this chapter, I
    have sought to interrogate the facticity of modern claims that Muhammad was a
    merchant. This interrogation has not led to a denial of the assertion that Muhammad
    was a merchant, but rather to what I believe is a rather counterintuitive insight:
    if modern historians wish to assert that Muhammad was a merchant by fact one of
    the many bare facts of his life, they must be cognizant that this "fact" does
    not originate as such from the sīrah-maghāzī literature, which portrays him as
    a shepherd; rather, our modern view of Muhammad as a merchant-turned-prophet ultimately
    rests on non-Muslim seventh-century accounts of Muhammad’s life that precede both
    Arabo-Islamic historiography and even the very historical memory of the early
    Muslim community.'
