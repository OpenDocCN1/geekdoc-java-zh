    transmitters (*isnad*). In the early period, *ilm* served as the ore from which
    the scholars derived the malleable metals used in forging these genres. The genres
    drew from this shared mine of knowledge (whether learned, performed, or obeyed),
    they necessarily interpenetrated one another from an early date, and they continue
    to do so today.


    # THE UMAYADS AND THE BEGINNINGS OF THE SIRAH-MAGHĀZI TRADITION


    The Abbasid-era historian al-Zubayr ibn Bakkār (d. 256/870) returns a fascinating
    story of what is ostensibly the first recorded attempt to gather *sirah-maghāzī*
    traditions into a literary work and to disseminate them beyond the domain of scholarly
    circles. The narrative offers the closest thing to an account of the beginnings
    of this literature that one might find. His story begins with the winter Hajj
    of the Umayad prince Sulayymān ibn Ab-Malik to Mecca in A.H. 82/702 C. That the
    story not only relates the history of a genre but also the earliest known instance
    in which a Muslim ruler and/or member of a caliphal house showed interest in writing
    a larger significance which we shall return below. For now, it suffices to emphasize
    that the story narrates the opening chapter of how the *sirah-maghāzī* tradition
    transformed from an oral to a written literary tradition.


    According to the story, prior to reaching Mecca to lead the Hajj, the Umayad prince
    followed the crowd of pilgrims traveling south from Syria and alighted in Medina—the
    Prophet’s capital city from his *hijra* in 622 C.E. until his death in 632. Although
    Mecca housed Islam’s most sacred sanctuary and the Ka’... Medina remained the
    cultural epicenter of the Arab elite of the early Islamic polity, and not Mecca,
