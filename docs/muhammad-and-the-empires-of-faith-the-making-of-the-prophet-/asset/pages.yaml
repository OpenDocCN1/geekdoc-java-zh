  md: 'works were preserved and transmitted, whether during or subsequent to their
    lifetimes. Among the findings put forward was that the systematic recording and
    writing of the *sirah-maghāzī* corpus initially emerged out of a court impulse,
    which harnessed rather than created, a preexisting oral tradition about the life
    of Muhammad and his companions. In nearly every case, Umayyad and Abbasid caliphs
    as key figures in their courts patronized and funded the most important large-scale
    projects to compile *sirah-maghāzī* traditions into systematic literary works.
    However, although the eighth-century court of the caliphs deserves the credit
    for this initial impulse, these works did not survive solely due to this culture
    and the sponsorship afforded by its largesse. The lion''s share of the credit
    for the long-term survival of this corpus and its traditions—whether whole or
    part—belongs to informal scholarly networks that transmitted it via a series of
    teacher-pupil exchanges. Such exchanges account, in large part, why this survives
    (to the extent that it did) in the form that it today: redacted, truncated, and
    scattered across sundry works that were reorganized and reframed the material
    of the earlier purveyors of the narratives about Muhammad''s life, such as Ibn
    Shihāb al-Zubrī, Mī ‘Uqban, and Ibn Ishaq. These observations help us to see that
    our extant preserve sources that are not necessarily late as they seem; furthermore,
    these observations facilitate the task of locating earlier sources embedded within
    later compositions, on one hand, and on the other, the process of surmising the
    limitations on reconstructing sources—a “vertical” reading strategy for tracing
    the history of the textual corpus and genre within its own tradition and discerning
    its strata.


    A second strategy employed in this work was to read the *sirah-maghāzī* literature
    as an emerging from the epistemic fabric of the Late Antique world—one might have
    called a “lateral” reading strategy across traditions as opposed to the strategy
    of reading “vertical” within a tradition. Such a reading strategy reveals the
    shortcomings in any approach to reading this literature as emerging generis from
    the epistemic soil of the Arabo-Islamic tradition (however conceived) or solely
    from the veterans guardians of early Muslim memory (however demarcated). This
    reading strategy also considers considerable light on how this literary corpus
    absorbed and refashioned the literary and cultural contexts from it. As a corpus,
    the *sirah-maghāzī* literature was not insulated from the political and imperial
    visions of the court or the triumphalist visions of the early Islamic polity’
    elites. Indeed, they participated in them. As a general competing in the sectarian
    milieu of the late antique Near East, the genre was deeply enmeshed in the hagiographic
    and scriptural works of the religious communities of the era. More important to
    this reading strategy than the nomenclature of “Late Antiquity” itself is the
    heuristic value of viewing the purveyors of the *sirah-maghāzī* tradition as engaging
    with the religious and'
