  md: '# EPILOGUE


    rather than a scriptural corpus—the material evidence for the scripture''s early
    codification, its centrality in seventh-century material remains of the earliest
    Muslims (such as coinage, papyri, graffiti, epigraphs, official inscriptions,
    etc.), and the explosive emergence of literary and non-literary writings in this
    scripture''s Arabic vernacular precedes outsiders'' awareness of its existence
    and thus confirm definitively that this Arabic scripture represents the earliest
    artifact of both Muhammad''s life and the ravaged piety of the community that
    regarded him as the messenger of God. Even if interpreting the Qur out the outlines
    of a ''mere Muhammad'' that is much in accord with what one can infer from the
    earliest non-Muslim accounts of his life. As Fred Donner has masterfully shown,
    the Qur''an conveys a great deal to us about the fundamental beliefs espoused
    by Muhammad and his early community: his espousal of prophetic monoton and rejection
    of Arabic syncretism (shirk); his embrace and reinterpretation of the prophetic
    and secular legacy of the Christians and Jews; his belief in eschatological punishments
    for the wicked and rewards for the righteous; the immense arrival of the day;
    structuring of his community over monotheistic laws and rituals, which are simultaneously
    familiar yet particular to this community (liturgical prayers, alarms, fasting,
    observance of a sacred calendar, pilgrimage and ritual sacrifice, etc.); his militancy
    and the sacred struggle (jihad) of his community in pursuit of God''s path to
    expand (and God''s) dominion, to establish, and to conquer sites they held; and
    Muhammad''s status in the revelation as God''s prophet, messenger, and lawgiver.4
    This amounts to what I call a ''low-resolution'' view of Muhammad, that turns
    out to offer quite a lot of information.


    If we move on such a low-resolution view of the historical Muhammad to a higher-resolution
    one, the sirah-maghāzi literature is an indispensable role to play. This literature
    conveys much in the way of raw data for it to be ignored or categorically rejected.
    Even if one decides to be so radical as reject the history of all the narratives
    of this corpus, the data it collects about the geography of Arabia, both human
    and topographical, remain indispensable. But such minimalism is unwarranted. Larger
    questions about Muhammad and his historical context will only come into focus
    as we scour this corpus. And the corpus is vast—much of it unexplored in a sufficiently
    systematic


