  md: '# MUHAMMAD AND CÆDMON 207


    This story of Muhammad''s call to prophethood—hereafter called "the iqra'' narrative”—hits
    many of the same narrative beats as Bede''s story of Caedmon''s call. Indeed,
    on a formal level, the narratives share much of the same skeletal structure. In
    Ibn Ishaq''s story, Muhammad is a humble, unnamed righteous man who withdraws
    from his village (Mecca) for his evening retreat (atop Mt. Hirā), where in his
    sleep he receives a startling vision of an angel bearing a silk scroll. "Read
    [iqra]" the angel commands. Muhammad resists at first but eventually acquiesces.
    When he wakes, he finds that he has been gifted with the miraculous ability to
    recite a revealed scripture in his Arabic vernacular, a gift whose origin is subsequently
    affirmed by his wife Khadija and her learned Christian cousin Ibrahim Ibn Nawfal.
    The resemblance between the stories is entirely remarkable, not merely because
    of their chronological proximity (both accounts recorded in the mid-eighth century
    C.E.), but because of the vast distance that separates them—more than 3,728 miles
    (6,000 km). The number of parallels between the stories seemingly defy mere coincidence.
    How, then, are possibly related, if at all?


    # CAEMON''S CALL AND THE IQRA NARRATIVE


    The late Klaus von See, a scholar of Scandinavian and German languages, first
    put forward a formal argument for a direct relationship between Ibn Ishaq''s story
    of Muhammad''s call and Bede''s story of the Anglo-Saxon poet Caedmon in 1983.
    See noted how Bede''s Caedmon, which the prophet Muhammad in Ibn Ishaq''s ''iqra''
    narrative, receives an angelic visitor in his sleep who compels him to sing. Bede
    narrative also culminates in Caedmon acquiring the miraculous ability to sing
    of the glories of God''s creation in his own vernacular (English) in much the
    same manner that, in Ibn Ishaq''s story, Muhammad acquired the miraculous ability
    to "read/recite" the Qur''an in Arabic. Noting these striking correspondences
    between the two stories, See postulated that Bede''s telling of Caedmon call relied
    heavily on an earlier version of the Arabic story preserved in Ibn Ishaq''s Maghāzīī.
    Hence, Bede had recorded his account of Caedmon in his Historia decades before
    Ibn Ishaq recorded his account of Muhammad''s call in his Maghāzīī, by See regarded
    the Arabic account as chronologically prior.


    In truth, See''s study was not the first to point out the parallels between the
    story of Muhammad and Caedmon; however, his study was the first to gain traction
    with Arabists and historians of early Islam. He was also the first study to frame
    the similarities between the two stories as a historiographical puzzle. Rudolf
    Sellheim was the first Arabic to bring von See''s insight to the attention


