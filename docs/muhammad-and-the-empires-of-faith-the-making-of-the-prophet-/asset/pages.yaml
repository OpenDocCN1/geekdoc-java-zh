    than his father Abū 1-Zīnād.


    # Chain 3. The Zuhri Transmission


    Letter 4 is attested only in the transmission of ‘Urwah ibn al-Zubayr prominent,
    the Median scholar Ibn Shihāb al-Zuhrī (of 124/752). This letter survives in two
    versions translated by the most sensual authors of the sirah-maghāzī tradition:
    a shorter one, quoted in the corpus of al-Zuhrī’s pupil Ibn Ishaāq (of 150/767),
    and a long version quoted by al-Wāqidi (of 207/822) on the authority of al-Zuhrī’s
    nephew Muhammad ibn ‘Abdāll. Görke and Schoeler are disined to accept the authenticity
    of this line of transmission.^25


    # A TRANSLATION OF THE LETTERS ATTRIBUTED TO ‘URWA IBN AL-ZUBAYR


    The translations below are and made directly from the Arabic texts indexed in
    the citations. We, however, consulted the English translations of Tabarī Tārik
    and Alfred Guillaume’s translation of Ibn Ishaāq’s Sirah in the process, as well
    as the German translations by Joachim von Stipagel. Full references and citations
    of these Arabic source texts as well as the English translations consulted are
    given at the head of each letter. The corpus provided here does not represent
    the sum of traditions and reports attributed to ‘Urwah, historical or other-Indeed,
    most reports on his authority are not transmitted in letter form but appear in
    the preferred form of orally transmitted reports (akhbar; sg. khabar). For further
    documentation and analysis of the ‘Urwah corpus beyond the letters, the reader
    is pointed to the work of Andreas Görke and Gregor Schoeler.


