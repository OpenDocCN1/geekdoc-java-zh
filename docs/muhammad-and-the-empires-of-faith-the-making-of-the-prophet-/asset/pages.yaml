  md: '# INTRODUCTION


    such as lies of battle participants, tribal genealogies, and poetry.¹³ Each of
    these textual units, called a matn, varies in size. They can then be merely a
    sentence long or even stretch for few pages. Each matn is also accompanied by
    a chain of authorities, called an isnad, that recounts the transmitted content
    from whom, from teacher to pupil, and on across generations. The best isnads lists
    of pupil-teacher relationships that stretch back from author/compiler either to
    Muhammad himself or to someone who knew him or witnessed the events being recounted.
    Isnads, of course, can be forged and indeed quite often were forged and improved
    upon the ages passed—something long recognized by Muslim and Western philosophy,
    albeit addressing the problem with different approaches and assumptions.¹⁴ But
    as a source-critical method, what isnad-cum-matn analysis does is test by comparing
    the matns to which they are attached. Scholars who practise this method pair matns
    concerned with the same topic and/or then analyze their accompanying isnads to
    track the evolution of a matn over time and determine the authenticity of the
    transmission represented in the isnads. Some traditions are revealed to be spurious
    and forgeries, whereas others have been revealed to be faithfully transmitted
    and recorded by later editors, in most cases, did so without attempting to harmonize
    the disparate counts.


