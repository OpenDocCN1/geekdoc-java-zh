  md: '# # Epilogue

    nThe Future of the Historical Muhammad


    Can the modern historian really work with the *sirah-maghāzī* literature—or is
    this corpus hopelessly mired in legend, an impenetrable veil that that must be
    cast aside because it obscures our view of the historical past? In the Introduction,
    I referred to the *sirah-maghāzī* literature as a "second-order source" for the
    life of Muhammad and his world and, hence, of lesser reliability as a source of
    historical evidence than our "first-order sources"—that is, the Qur’ material
    and documentary evidence from the sixth to seventh centuries C.E., and non-Muslim
    sources from the seventh century. However, I also proposed that, despite it being
    a second-order source, historians can indeed work with the *sirah-maghāzī* literature,
    not just as a source for tracing how Muslim communities constructed a cultural
    memory of Muhammad and, in the process, forged their identities and beliefs—a
    process to which surely attests to a considerable degree—but also as a source
    for understanding the life of Muhammad himself, as a mere person of history. Scholars
    must always approach this material with "skeptical caution rather than optimistic
    trust," but through this work, I have sought to put forward a number of strategies
    to help conceptualize how historians might indeed approach the *sirah-maghāzī*
    literature and even "work with it" to this end.


    One strategy was to take renewed stock of the historical beginnings of this *sirah-maghāzī*
    corpus, and especially through the lens of prosopography, with the aim of recovering
    the social context of its most seminal and earliest compilers, and to examine
    how the works of these pioneering scholars were impacted by the societal, political,
    and cultural contexts of their moment in history, and how their


    +   1. Goldziher 1971, 19.'
