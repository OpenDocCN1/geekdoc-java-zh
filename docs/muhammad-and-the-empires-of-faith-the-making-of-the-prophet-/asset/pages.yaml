    (d. A.H. 124/744 c.E.). However, the pall that such dreary prognosis over the
    prospect of success research into the historical Muhammad appeared. At the time
    she published these works in 1980, Crone''s intervention was indispensable for
    the faith, a much-needed revolt against a somewhat dominant strain of Orientalist
    positivism that took these texts as records of historical fact—and, indeed, the
    iconoclastic spirit of her interventions vital to moving the faith forward. But
    is the problem as intractable four decades ago? Can a historian really work with
    the *sirah-maghazī* literature? This monograph has in large part written to cover
    this pessimism and demonstrate that, one, indeed can work with this purpose. The
    question of how remains.


