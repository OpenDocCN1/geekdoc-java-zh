    this. He asserted that Mālik—as well as his father, grandfather, and uncles—descended
    rather from non-Arab clients of Taym ibn Murrah.¹119 Ibn Isshāq was not the only
    scholar to make such accusations, nor was he the only learned Medinan to suffer
    Mālik’s wrath as a result.¹120 Indeed, every indication suggests that Ibn Isshāq’s
    charge against Mālik was true.¹121 In subsequent years, Mālik Ibn Isshāq boasted
    about how he expelled Ibn Isshāq from Medina.¹122


    Perhaps the most serious accusation leveled against Muhammad Ibn Isshāq by the
    Medinan, was that he denied God’s predestination of human affairs (*qadar*), and
    was thus a *qadari*, who believed in humankind’s innate free will. Such views
    had political consequences in the late-Umayyad period, especially under the caliph
    of Hishām ‘Abd al-Malik, when the group opposing them—the so-called Qadariyah—came
    to be viewed, without justification, as a hive of sed. In truth, Ibn Isshāq’s
    interest in *qadar* was not eccentric: the ideas proposed by the Qadariyah had
    been current in Medina for some time—even the despised heretics of the Qadariyah,
    the Umayyad imperial scribe Ghaylan al-Dimashqi whose followers would eventually
    stage a coup d’état to install Yazid III in 744, had some sort of following this.
    Following likely dated from the famous public debate that Ghaylan held in the
