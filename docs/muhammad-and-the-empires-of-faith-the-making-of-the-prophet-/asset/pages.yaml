  md: '# INTRODUCTION 3


    early cultural memory of Muhammad that it does about the so-called historical
    Muhammad. Expressed another way, the sirah-maghāzi corpus is a primary source
    less about the historical figure of Muhammad than for understanding how Muslims
    understood Muhammad and his message, as how they chose to depict God’s disclosure
    of His Providential plan for salvation both. From the sirah-maghāzi literature,
    we learn mostly about Muslims of the eighth and ninth centuries C.E. wished Muhammad
    to be known and how they constructed images of him to forge their own confessions
    and sectarian identities, but perhaps not much else.


    Secondly, the sirah-maghāzi tradition is problematic because it is a noisy source—version
    of history tends to drown out the other sources or demand that they be read within
    the framework it provides. This applies especially to how one reads the Qur’an,
    if a source relatively devoid of historical narrative (not to say that it is uninterested,
    or that it lacks its own vision.) For over a century, modern scholarship has seen
    early Muslim efforts to interpret and historicize the Qur’an as the very front
    of the sirah-maghāzi tradition. In other words, although the traditions may appear
    to be historical narrative, current in modern scholarship holds that such traditions
    are, in fact, fundamentally exegetical rather than historical. Whatever the drawbacks
    of the sirah-maghāzi literature, the versions of history that its representative
    works offer a richer and a useful history, the first narratives that one learns
    as a neophyte. Hence, the arc of this tradition’s narrative is often difficult
    (and, for some, impossible) to unlearn. Even today, modern scholars scarcely began
    to imagine what it would be like to read the Qur’an without the aid of the exegetical
    and chronological framework of the sirah-maghāzi tradition.


    The late Patricia Crone, one the field’s most articulate skeptic, expressed just
    how acute the problem is for modern historians when she characterized the most
    important representative of the early sirah-maghāzi literature, the Kitāb al-Maghāzī
    (Book of Expeditions) of Ibn Ishāq (d. A.H. 150/767 C.E.), as follows:


    The work is written: not by a grandchild, but by a great-grandchild of the Prophet’s
    generation, it gives us the view for which classical Islam had settled. And written
    by a member of the ‘ʿulamā’, the scholars who had by them emerged as the classical
    bearers of the Islamic tradition, the picture which it offers is one-sided: how


