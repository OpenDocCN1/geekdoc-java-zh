  md: '# Introduction


    # The Making of the Historical Muhammad


    This is a book about the formation and beginnings of the sīrah-maghāzī literature,
    an early genre of Arabic writing about the life of Muhammad, the prophet and founder
    of Islam. It is also about how how to situate this genre historically in the thought
    world of Late Antiquity (approximately 250–750 C.E.), a period that witnessed
    the ascendance of today''s major monotheistic faiths (Christianity, rabbinic Judaism,
    and Islam), and well as others that are no longer so prominent (such as Manicheism,
    Zoroastrianism, and other Iranian religions). In addition to the burgeoning of
    these faiths, Late Antiquity also saw the rise of their political forces, often
    by means of imperial expansion, and the articulation of their intellectual, literary,
    and legal traditions, which led to the transformation of a broad array of civic
    ideas, such as empire, law, and political community.


    Employing the reading strategies of historical and comparative philology, this
    study explores what sort of insights situating the sīrah-maghāzī literature in
    a late antiquity context might provide. Hence, the work has been written with
    two primary goals: firstly, to explore how historical and comparative readings
    of the earliest Arabic sources on the biography of Muhammad in tandem with non-Muslim
    sources of the sixth to eighth centuries c.e. might revitalize research into the
    life and times of Muhammad; and, secondly, to shed new light on the historical
    circumstances and the intellectual currents that gave rise to the sīrah-maghāzī
    tradition as a discrete genre of Arabic letters from the last decade of the seventh
    century c.e. up until the end of the eighth. This is a book about what can currently
    be accomplished by researchers dedicated to investigating the historical Muhammad
    using modern historical methods and close readings of our earliest source-texts.
    It is not a comprehensive biography of Muhammad'
  merge: -1
