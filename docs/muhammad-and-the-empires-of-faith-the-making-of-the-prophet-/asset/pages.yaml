  md: '# 2 INTRODUCTION


    but rather an attempt to open new paths of research in the near term and to lay
    the methodological groundwork for future comprehensive accounts of him as a historical
    figure.


    Although the *sirah-maghāzī* literature remains an indispensable source for studying
    the historical Muhammad, it must be emphasized that the corpus of traditions that
    this literature preserves is by no means our only source of data about his life.
    Much of this study is considered, therefore, not just with understanding the *sirah-maghāzī*
    literature, but also with how this corpus relates to other sources. There are
    four cardinal sources upon which all research into the historical Muhammad hinges:
    (1) the Qur’an; (2) epigraphical, documentary, and archaeological evidence; (3)
    contemporary and near-contemporary non-Muslim accounts, written in Armenian, Greek,
    Syriac; and (4) Arabic literary sources that are mostly, but not exclusively,
    preserved in the *sirah-maghāzī* literature and the *hadith* compilations.


    Ideally, these cardinal sources should be viewed as complementary, rather than
    antagonistic, layers of historical evidence. In practice, however, this ideal
    proves difficult to achieve. Of these cardinal sources, the first three are for
    the most part quite early, as written, composed, or (in some cases) disposed within
    the first hundred years following Muhammad’s death in 632 c.E. The last of these—comprising
    the Arabic literary sources in general and the *sirah-maghāzī* traditions in particular—is
    often seen as the most formidable and daunting. Although all historical sources
    pose challenges of interpretation for historians, the challenges of the *sirah-maghāzī*
    tradition are particularly acute. This bromide may be a common refrain among historians
    of the early Islamic period; however, the challenges of relying on the *sirah-maghāzī*
    literature are salient and worth articulating.


    For one thing, the *sirah-maghāzī* corpus is the latest of the four cardinal sources.
    No books preserve the *sirah-maghāzī* traditions from date before the stretching
    from the late century c.E. to the ninth—approximately 150 to 250 years after Muhammad’s
    death—and the works that do survive are filled, to varying degrees, theologically
    tenuous and ever outright legendary materials. For this reason, a great number
    of modern historians have come to hold that the *sirah-maghāzī* literature tells
    us far more about the formation of the


