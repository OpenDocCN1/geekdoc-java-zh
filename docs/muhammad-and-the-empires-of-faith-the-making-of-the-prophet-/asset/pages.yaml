  md: '# # Prophecy and Empires of Faith


    A key thesis of this work is that a court impulse lay behind the earliest efforts
    to record the *sirah-maghāzī* tradition and to commit it to writing as a discrete
    corpus—a process that reached its culmination in the middle of the second/eighth
    century with the compilation of the *Kitāb al-Magzī* of Muhammad ibn Ishāq (d.
    A.H. 150/767 C.E.) under the patronage of the Abbasid caliph Abū Jaʿfar far al-Manšūr
    (r. 136–59/754–775). Materials from the formative period of the *sirah-maghāzī*
    tradition are nearly all lost except in redactions by later generations, but this
    formative period nonetheless produced a written corpus that effectively became
    a *vulgate historiography* of Antoine Borrutt’s useful term. Works produced in
    this period shaped all subsequent historical knowledge and provided the historiographical
    bedrock for subsequent debates about the early period. Hence, the formative historiography
    of the *sirah-maghāzī* tradition determined the shape of all subsequent ArabicIslamic
    historiography thereafter at a deeply structural level. Understanding this historical
    vulgate and examining how its framework came into being, therefore, remains a
    large extent to the mandate and aim of contemporary historical-critical scholarship
    on this historical corpus. Put another way, our aim is not to arrive at a truer
    or more original (and, therefore more authentic) history of this corpus, but rather
    to take stock of the contingency of the historical knowledge it proffers and the
    ideological forces that fashioned it.


    As argued in previous chapters, the court impulse began, not with the Abbasid
    caliphs, but rather with the late Umayyad caliphs. The surviving evidence strongly
    suggests that this process may have begun as early as the caliphates of ''Abd


