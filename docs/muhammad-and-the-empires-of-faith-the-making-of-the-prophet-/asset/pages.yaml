    The period of Abd al-Malik''s caliphate is critical because it coincides with
    the conclusion of an important power struggle within the Jerusalem Patriarchate
    with its roots in the monogenist andothelete controversies of the 630s. After
    restoring Egypt and the Levant to the Byzantine empire, Heraclius sponsored the
    efforts of Sergiius, the patriarch of Constantinople, to forge a new religious
    unity in the empire. Sergiius aimed to restore ecclesiastical unity with those
    who rejected the Christological doctrines promulgated at the Council of Chalcedon
    (451 C.E.) by aligning the imperial church with a compromise position that came
    to be known as the monogenist doctrine. Initially, the policy met with success.
    Under the auspices of Heraclius, Sergiius engineered a union with the Armenian
    Church and, most particularly, with the Egyptian Church under the leadership of
    the patriarch of Alexandria, Cyrus, who promulgated the Pact of Union in 633 C.E.
    However, despite these initial successes, an intractable opposition to the reconciliation
    swiftly appeared. Palestine and the patriarchate of Jerusalem—a position held
    by Sophronius from 634 until ca. 638 C.E.—served as the epicenter of the opposition
    to the new imperial compromise. Patriarch Sophronius spearheaded the opposition
    to Heraclius and rallied to the Roman Church, under the papal leadership of Honorius
    (625–38 C.E.) and later Martin (638 C.E.), and the daughterless theologian Maximus
    the Confessor. Efforts put in motion by the patriarch Sophronius a decade earlier
    culminated in the convention of the Lateran Synod of 649 C.E., which forcefully
    articulated the dyothelete position of Rome and Jerusalem against that imperial
    compromise promulgated by Constantinople⁵.


