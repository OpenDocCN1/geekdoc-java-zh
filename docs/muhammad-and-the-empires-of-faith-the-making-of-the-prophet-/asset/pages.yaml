    The assertion that Muhammad had been a merchant is one of the earliest attested
    historical claims about his life; the claim is so early, in fact, that the evidence
    for it predates the emergence of the *hadith* collections or *sirah-maġhāzī* literature
    as discrete literary corpora. In other words, the very veracity of the assertion
    need not rely upon the Arabo-Islamic historiographical and prophetic traditions
    at all. Indeed, Muhammad''s occupation as a merchant ranks among the few claims
    about his life can be ascertained by relying on the earliest source materials
    available and without recourse to the earliest Arabic sources. Two of our earliest
    sources to describe Muhammad as a historical figure at all are also the earliest
    sources to testify to his having been a merchant. Both can be dated securely to
    the seventh century C.E.


