    The most important observation to make here is this corpus of maghāzi traditions
    attributed to ‘Urwah already provides us with a coherent, albeit still poached,
    outline of Muhammad’s prophetic career from his migration from Mecca to Medina
    until his conquest of Mecca some eight years later. Unsurprisingly, the period
    of Muhammad’s early life and the Meccan period of his preaching is almost a total
    incognita—the story of Muhammad’s first revelation, its initial recognition among
    the Meccans, and the persecution of his first followers. We shall return to ‘Urwah’s
    account of Muhammad’s first revelation in chapter 7.


    In all, despite the considerable corpus of traditions attributed to ‘Urwah ibn
    al-Zubayr, whether in the form of letters or of his orally transmitted reports
    (i.e., *hadith* and *akhbār*), ‘Urwah never seems to have compiled a *Kitāb* al-maghāzi.
    As Gregor Seeger first noted, much of ‘Urwah’s reputation as a compiler of a work
    called al-maghāzi relies on later figures who compiled works of maghāzi traditions
    in his name. No evidence suggests that ‘Urwah compiled a book of maghāzi traditions.
    Rather, ‘Urwah limited his teaching of *hadith* to the oral methods commonplace
    during his lifetime—transmitting dissemination seems to be virtually untouched⁴
    Only the contents of his teachings can be reconstructed with relative certainty,
    in large part to the source of translations attributed to his authority and to
    the latter extent because the survival of the letters attributed to him.


