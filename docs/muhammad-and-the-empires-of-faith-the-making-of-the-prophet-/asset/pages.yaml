    the *Kitāb* al-Māghazi into (1) *al-Mubtada*, (2) al-Māghazi [wa-l-siyar], and
    (3) *Tārikh al-khulafā*. This newer hypothetical division strikes me as more plausible
    than Fuck’s¹⁵⁰, however definitive answer to the question is likely unattainable
    given the current state of the evidence.


    The transmitters of Ibn Isāq’s *Kitāb-al-Māghazi* attested in the literary sources
    are legion, and for this reason modern scholars tend, rather lazily, to rely on
    a single redaction. This is an unfortunate habit. Each student''s transmission,
    even authentically learned from Ibn Isāq, represents a different version of the
    *Kitāb* al-Māghazi inasmuch Ibn Isāq continually edited, expanded, and revised
    his work throughout his life. This process began at an early date: Ibn Isāq had
    likely composed some version of his *Māghazi* in Medina, but he continued to revise
    it. Michael Lecker has noted that Ibrahim Ibn Sa‘d, the only Medinan scholar to
    transmit Ibn Isāq’s *Māghazi*, explicitly claimed that “Muhammad Ibn Isshūd [the
    binding of] the Māghazi three times, and I observed and witnessed this¹⁵¹—meaning
    that Ibrahim himself learned at least three unbound, and, revised and rearranged
    versions of Ibn Isāq’s Māghazi. Transmitters of Ibn Isāq’s works, moreover often
    abbreviated, omitted, and supplemented his accounts as they saw fit. Any attempt
    to reconstruct a pure, unadulterated original is, therefore, a fool’s errand—to
    be reconstructed, only multiple versions of accounts transmitted multiple times
    over.¹⁵².


    Scholars are justified in finding the prospect of comparing these versions somewhat
    daunting. Nearly a century ago, Fuck found out fifteen transmitters of the *Māghazi*,¹⁵³
    seems like a long list but is humble compared to *Mut‘ al-Tārīshī’s more recent
    list, which exceeds sixty¹⁵⁴. However, of these many transmitters of the *Kitāb
    al-Māghazi*, only a few seem to have transmitted the work (or, at least, their
    version thereof) rather than merely parts of it. Six transmitters stand out as
    truly editors of Ibn Isāq’s *Māghazi* in this regard. These transmitters are as
    follows.


