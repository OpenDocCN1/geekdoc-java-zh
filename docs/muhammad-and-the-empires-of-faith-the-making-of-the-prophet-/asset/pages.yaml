    and exhibit a deference for ‘Urwah’s erudition on historical and juridical arcana
    also fits well with the image of the caliph ‘Abd al-Malik found in other sources.


    Absences in a corpus can speak volumes. Notably excluded from ‘Urwah’s letters
    is any mention of the Prophet’s son-in-law ‘Ali ibn Abi Tālib and the Hāshim clan
    of Quraysh. This absence is all the more conspicuous when one considers the prominence
    accorded to ‘Ali in all other accounts of the events narrated by the letters,
    such as Muhammad’s hijra to Yathrib/Medina and the conquest of Mecca? Given the
    hostility to ‘Ali not only of the Zubraid and Umayyads of ‘Urwah’s maternal relations,
    this argues strongly in favor of the letters’ authenticity. These issues all merit
    further investigation.


    # THE CHAINS OF TRANSMISSION

    OF URWAH’S LETTERS


    The letters of ‘Urwah ibn al-Zubayr survive in their most complete form in the
    works of a premier scholar of the Abbasid-era, Abū Ja far al-Tābarī (d. 310/923)—specifically
    in his history al-rusul wa-l-mulūk and his semi-final Qur’an commentary, ‘Jāmi‘ī-’al-bayān’.
    However, ‘Tābarī’s corpus is neither the earliest attraction to ‘Urwah’s letters.
    Explicit, albeit fragmentary, citations of letters attributed to ‘Urwah appear
    in the recensions of the Kitāb al-Maghāzī (d. 150/767), the Kitāb al-Maghāzī of
    al-Wāqidi (d. 207/822), the Kitāb al-Tabāqat-kubrā by Ibn Sa (d. 230/844-45),
    historical works of the Basran historian ‘Umar ibn Shabbab (d. 262/875), and the
    Tafsīr of Abū Hātim al-Rāzī (d. 277/890) as transmitted by his son, Ibn Abī Hātim
    al-Rāzī (d. 327/890). This list comprises all six scholars of diverse geographical
    provenance who claim to have transmitted the letters of ‘Urwah—or at least extracts
    thereof—of whose lives and scholarly careers created by al-Tābarī by decades least,
    and in some cases, over a century.


    That these letters served in any form whatsoever is noteworthy. Hadith scholars
    did not share historians’ fetish for documents as the supreme arbiters of historical
    authenticity; hence, it is quite rare to find traditions transmitted in the letter
    form, since it potentially detached rather than added to, a tradition’s claim
    to authenticity in the early days of the Islamic tradition. The sine qua of scholarly
    knowledge in the second/eighth century was, rather the oral transmission and reception
    of traditions via a teacher-pupil relationship that required the mastery of texts
    through memory. Indeed, intended to the use of


