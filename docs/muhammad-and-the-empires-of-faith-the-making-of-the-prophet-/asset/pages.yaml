    Arabic-Islamic documents and inscriptions—that is, material evidence bearing words
    that are either written in Arabic, that bear the names of Muslims and/or rulers,
    or that contain touchstone features of Islamic religiosity such as pious invocations
    and prayers composed in the religious idiom of the Qur an—appear on the historical
    record within mere decades after Muhammad''s death in C.E. 632. The earliest dated
    documents and inscriptions of this sort hitherto recognized as such because they
    either refer to contemporary, date events and/or use the newly minted *hijri*
    calendar, or *no heirae* (represented in Western scholarship by acronym A.H.).
    The significance of the *hijri* calendar, of the earliest, most visible markers
    of Muslim identity, is considerable. A distinctive measure of timekeeping, reckoning
    according to a cycle of lunar months, it regulates Islamic ritual and its observance,
    and the early Islamic polity eventually used for administrative and social purposes
    well. It is important to point out that, on one hand, the use of this calendar
    as well as the names of the months it employs, are unattested in any Arabic or
    Arabian inscriptions that predicate Islamic conquests, and on the other hand,
    that the calendar putatively begins the passing of years with the year A.H. (622–23
    C.E.), the year in which Muhammad reportedly pursued persecution in his native
    city of Mecca and undertook the Hijrah, or migration, to the city of Yathrib (subsequently
    renamed Medina), where he would become ruler and inaugurate the Muslim community,
    or ummah. The ideological importance of the calendar is, therefore, immense—it
    represents no less than a reorientation of time-keeping around an event so significant
    that it was placed at the axis of the community''s historical consciousness.


    Though adopted at an early date, was not an innovation of Muhammad himself. If
