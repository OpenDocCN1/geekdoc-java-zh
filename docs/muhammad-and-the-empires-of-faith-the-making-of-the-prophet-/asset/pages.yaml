    Understandably weary of politics, Urwah withdrew to Medina to redefine remainder
    of his life to scholarly pursuits. His only other major journey outside Medina
    in the years that followed by his pledge of allegiance (Ar. bay ah) to ‘Abd al-Malik’s
    son and successor, Al-Walid ibn Abd al-Malik (r. 86–96/705–15), with whom he exchanged
    letters on magḥāzi traditions. This trip cost Urwah the way to Syria, his face
    became ferocious, and after he reached the court, one of the caliph’s physicians
    had to amputate with a saw. Shortly thereafter, the son who accompanied him on
    the long journey fell over the roof of the caliph stables, and the horses inside
    trampled the young man to death.³⁶


    Urwah’s rapproche with ‘Abd al-Malik and the House of Umayyah is momentous for
    our concerns because it reportedly survived a series of letters exchanged between
    the caliph and his son al-Walid. These letters become an “accidental” corpus of
    early materials for the biography of Muhammad. The corpus is insofar as the letters
    were written for private consumption by the caliphs in response to their queries
    and not for public dissemination and instruction.³⁷ In this way, they differ markedly
    from Abān ibn ‘Uthmān’s book that the caliph ordered to be destroyed. While these
    letters are not the only magḥazi traditions of Urwah to survive—like most scholars
    of his epoch, his learning was transmitted orally to his students—they are the
    only such traditions to survive in document-like form.


    These letters, the manner of their preservation, and their authenticity are discussed
    more in the following chapter, but here it is worthwhile to note what they contain
    and reveal about the early era of Arabic traditions on the life of Muhammad at
    the time. Andreas Görke and Gregor Schoecler have meticulously argued that narrative
    traditions of the following events from the life of Muhammad can be ascribed to
    Urwah with a reasonably high degree of certainty:


