    ![](img/589a7a798371e3a79a191adb61ea26ba_13_0.png)


    FIGURE 1. Genealogical tree of the Quraysh and the early Caliphs.


    Perhaps the most seminal figure in the history of the Islamic tradition was, al-Zuhri
    an eminent member of the Zubrah clan of Quraysh and a prominent member of the
    Umayyad court from the caliphate of Abd-al-Malik until the end of his life. During
    the caliphate of Hisishām, the court sponsored a massive effort to record the
    traditions of al-Zuhri, effecting a change in early attitudes to the codification
    and distribution of the oral tradition.


    Ma mar ibn Rāshid al-Azdi (born 687, Bašrah (Basra, Iraq); died 770, San ‘ān)


    A Persian cloth-merchant and a non-Arab client (mawlā) of Azd of Bašrah who travelled
    widely from southern Iraq to Syria (where he studied under al-Zuhri), the Hijāz
    and eventually Yemen, where he settled. In Yemen, he transmitted one of the earliest
    accounts of the Prophet Muhammad’s life *The Expeditions (Kitāb al-Maghāzī)*,
    to his prominent student ’Abd al-Razzāq al-Šānī.


    Mūsā ibn ‘Ubbah (born 705, Medina; died 758, Medina)


    A non-Arab client of the Zubrayed family who wrote one of the earliest accounts
    of the Prophet’s life *The Book of Expeditions (Kitāb al-Maghāzī)*, reportedly
    quite short, which only survives in later quotations. A teacher with his own study
    circle in the Prophet’s mosque in Medina, he maintained a strong reputation among
    the scholars of Medina and their school, especially their doyen, Mālik ibn Anas.


    Muhammad ibn Isšāq (born 704, Medina; died 767, Baghdad)'
