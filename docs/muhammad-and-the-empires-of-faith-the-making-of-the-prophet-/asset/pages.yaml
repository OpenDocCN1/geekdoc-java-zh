  md: '# INTRODUCTION


    Both the Qur''an and the sirah-maghāzī¹ tradition must be read historically and
    philologically. This process entails subjecting these two sources to the traditional
    realms of philological research, such as the comparative study of texts and their
    genres and the historical evolution of languages and language families as they
    evolve and interact with each other over time. Being so relies on a pluralistic
    methodology that draws upon methods that are text-critical, colloidal, historical,
    and so on. Tastly, this type of philological reading requires self-reflection
    on the part of the philologist-cum-historian. Noological reading is absolute and
    immutable. Each reading is contingent, rather, on the philologist''s access to
    the particular constellation of source material available to her as well as its
    embeddedness in her own time, place, and cultural context—it is not the product
    of a “view from nowhere.” Each scholar must contend as historically bounded and
    contingent as her sources⁶⁸ the “vast domain of historical unknowability.”⁶⁹

    Sheldon Pollock terms an approach “philology in three dimensions,” a scholarly
    practice that takes seriously “its factitiousness and historicity as a knowledge
    edge.” As conceived by Pollock, three-dimensional philology plots the practice
    of reading texts philologically across three planes that presume the intersecting
    dimensions of time and space through which every reader encounters: “1) the text’s
    genesis; 2) its earlier readers; and 3) me reading here and now.”⁷⁰ Modern scholarship
    of the Arabic-Islamic tradition already boasts skilled practitioners who engage
    with this second dimensional of philological scholarship. Modern research that
    analyzes isnads, compiles and compares all the accounts of a given event, and
    establishes criteria for distinguishing reliable sources from unreliable ones
    is deeply embedded in (and frankly without) the tools and methods inherited from
    the monumental philosophical undertakings of of scholarship, whether of the past
    or the present.⁷¹ Indeed, recognizing this redounds to the methodological and
    conceptual pluralism of modern philological practice at its best. Philological
    practice, as Pollock has noted, is a knowledge form that appears wherever texts
    and the problem of their interpretation appear; it cannot be owned by or exist
    as the selfcontained scholastic enterprise of a single discursive community. Hence,
    making sense of texts inevitably entails learning how others have done so, and
    often done so differently.⁷²


