    life, it remains our best and earliest witness to the historical existence of
    a man named Muhammad who was revered by a faith community of Arabic-speakers as
    God''s messenger and prophet, not to mention the message that he preached and
    the religiosity that he exposed. Yet do to the limitations of the Qur''an as a
    historical source we demand that we inevitably fall back on the *hadith* corpus
    or the *sirah-maghazī* literature as our *only* other option for knowledge about
    the historical Muhammad? Apart from the Qur''an, is there any knowledge to be
    gained at all about the historical figure of Muhammad from sources that provide
    either the *sirah-maghazī* literature or the *hadith* corpus? One can pose the
    question in simpler terms: apart from the Qur''an, what are the earliest references
