    argue, against the backdrop of two literary traditions: that of the Christian
    literature of Late Antiquity, specifically in the Syriac-speaking tradition of
    the East, and that of a hitherto-neglected corner of the early Islamic tradition,
    in particular the early hadith corpus, and its utilization of the Keys to Paradise
    (mafātīh al-jannah), on the other. As will become clearer below, the results of
    such an analysis are striking and, in my view, the potential to change modern
    scholarship’s evaluation of the relationship between the Doctrina and the early
    Islamic tradition.


    # THE KEYS TO PARADISE” IN LATE ANTIQUE RELIGIOUS DISCOURSE


    In the context of the Doctrine Iacobi and its unashably pro-Christian propaganda,
    the keys to Paradise motif evokes Christian conceptions of apostolic authority.⁶¹
    In late antiquity, possessing the keys to the (kingdom of) heaven is attached
    to the leaders of the church and their stewardship of the authority conferred
    by Christ on his disciples.² The fourth-century Syriac-speaking ascetic Aphrahat
    refers to Christian bishops as “keepers of the keys,”⁶³ since he regarded as inheriting
    the legacy of the apostle Peter, to whom Jesus declared, “I will give you the
