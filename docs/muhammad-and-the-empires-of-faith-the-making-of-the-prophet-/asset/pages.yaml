    # ABD AL-MALIK IBN MARWĀN AND URWAH IBN AL-ZUBAYR


    The pairing of ‘Abd al-Malik and ‘Urwah ibn al-Zubayr—sons of two rival houses
    of Quraysh with a history of enmity and violence—might seem improbable, given
    the antipathies between them throughout the conflict of the Second Civil War,
    but both were equal products of the Medinan Qurashi elite, a milieu that bound
    them together at an early age just as their rivals would eventually face each
    other in adulthood. The Umayyads and Zubayids would eventually face each titanic
    struggle for the leadership of the early Islamic policy; Abd al-Malik knew the
    Zubayrid brothers as merely his de-facto peer. Qabish ibn ʿyb used to recount
    how, ‘Abd al-Malik ibn Marwān, ‘Urwah ibn al-Zubayr, and others gathered each
    in Medina’s mosque in a study circle (halakah) of the city’s youthful. Qabish
    allegedly distinguished himself with the knowledge he had gained from the Prophet’s
    scribe, Zayn ibn Thābit al-Anṣār, Qabish admitted that ‘Urwah outstripped them
    in his knowledge, because he, as a nephew of the Prophet’s widow, ‘Āishah ibn
    Abi Bakr, could freely visit and learn from her.


