    # THE IQRA’ NARRATIVE—EARLY, BUT NOT HISTORICAL


    For all the impressive evidence for its early date and its extraordinary dissemination,
    the *iqra* narrative is not likely to be an accurate historical account of Muhammad’s
    earliest experiences of revelation. Details of the *iqra* narrative hold no historical
    warrant from the Qur itself, inasmuch as the Arabic scripture teaches that revelation
    came to Muhammad during the month Ramadan (Q. Baqarah 2:118; laylat shahr ramadān
    (laylat ʿunzi fī l-qur’ān))⁶⁶ and at (Q. Dukhan 44:3, laylat al-qadr; Qadr 97:1)⁶⁷,
    and that luminous visions commissioned the prophetic revelation (Q. Najm 53:1–18;
    Takwir 81:19–26)⁶⁸. But historians would resist such structural proof-testing.
    Our reading of the commonalities between Cæmon and the *iqra* narrative against
    the backdrop of intellectual and religious world of late antiquity strongly suggests
    that other dynamics are at play. Rather than functioning as a record of Muhammad’s
    first prophetic experiences, or even a historically accurate attestation to the
    authentic past, the *iqra* narrative first and foremost must be read as a literary
    artifact of its age, which conveys how Muslims wished to imagine Muhammad and
    how they relied on their image to articulate the meaning of prophecy and divine
    guidance for human affairs, a cultural memory synthesized from an array of literary
    forms in the historical landscape of Late Antiquity.


