    COMMENTARY: Much of the narrative in this relates to Muhammad’s hijrah accords
    with later tradition (and indeed forms its basis); the claim made at §2.2 that
    Mecca’s Quraysh were initially receptive to the public preaching of Muhammad’s
    message until the arrival of certain Qurashi interlopers from al-Tā is unique
    to the ‘Urwah tradition. The usual scheme portrays Muhammad’s initial preaching
    as having taken place in secret and mostly gaining followers among his kin and
    the downtrodden; the opposition from the Mecans and Quraysh arises only after
    he begins to proclaim his message publicly and denounce the Mecans’ ancestral
    gods. These wealthy Quraysh who first opposed Muhammad are not named in the letter.
    Hichejmat speculated that ‘Urwah suppressed the names of other wealthy Mecans
    who owned lands in al-Tā because many of them came from the caliph ‘Abd al-Malī
    ancestral clan of Quraysh, ‘Abd Shams’; however, an Egyptian tradition attributed
    to ‘Urwah identifies these opponents, naming not individuals from the clans of
    Abd Shams but, two individuals from the Makhzum clan of Quraysh, “Abū Jahl” (‘Amr
    ibn Hishām) and al-Walid ibn al-Mughīrāh. Both are well known opponents of Muhammad’s
    early preaching in the broader corpus of the sirah-magḥzī tradition. Notably missing
    from the Meccan phase of Muhammad’s preaching is any mention of the “satanic verses”
    affair, which plays a prominent role in the sirah-magḥzī traditions of the subsequent
    generation of scholars.³³


