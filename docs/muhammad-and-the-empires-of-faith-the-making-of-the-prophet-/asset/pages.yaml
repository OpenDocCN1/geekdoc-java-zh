    The solution, therefore, cannot be return to what Joseph Schacht termed "the gratuitous
    assumptions" of earlier generations of scholars⁷⁶—namely, that there exists a
    pure, original or authentic core of material, the proverbial "historical kernel"
    of the life and turns of Muhammad. Such a view is not historiographically naive,
    it is epistemologically unsound and a betrayal of the philological method. There
    seems to be a persistent misconception that all of future insights rely on our
    field''s ability to employ the methods and tools of biblical studies. Not so—truth
    be, current scholarship shows an unwelcome emergent trend of neglecting the centuries-long
    philological tradition of Muslim scholarship or translating this tradition actually
    contains. The field will have to develop its own tools, better suited to the corpus
    with which we work.


    Nor is the solution to resign ourselves to the role of curators and catalogers
    of historical memory. Historical research into the founding personalities of religions
    (Moses, Buddha, Jesus, Muhammad, or whoever) has often been misconstrued as a
    project aimed at undermining the truths of scripture and demolishing the claims
    of a religious tradition once vanished as evident. However, the aims of such historical
    research into the founders are far more: to derive new knowledge from ancient
    sources using the tools and methodologies of historical inquiry. That historical
    inquiry poses no challenges for contemporaries, whether persons of faith or not,
    is a common can. New knowledge always enters a new way of looking at the world
    and humanity itself. Early modern humanistic research into the historical Muhammad
    dismantled early European views of him as a demonic possessed of the malevolent
