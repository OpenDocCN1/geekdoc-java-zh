    2. writings in the form of elaborate and systematically organized lectures note,
    usually recited by a scholar-teacher to his student and, more rarely, handed over
    to students and colleagues for copying or as a bequest;


    3. writings penned for a smaller circle of readers, produced for official collections,
    and/or by the order of the caliphal court for their exclusive use.³⁹


    The last category produced what was the first appearance of "real books"—what
    Sebastian Günther has termed a "literary composition"⁴⁰—and the emergence of compositions
    in the realm of the "tradition," ʿīlm, marks the watershed moment when written
    culture became an integral component in the transmission of *hadīth* and sirah-maghāzī
    traditions. The surviving corpus of al-Zuhri’s students in Ruṣāfah of the second
    category, but one must keep in mind that these writings were written down by students
    in the context of the official codification of their traditions for the consumption
    and benefit of the Umayyad court. Schoeler continues, “[al-Zuhri’s toll of the
    emergence and even production and commission of witnesses of the third type...
    marked an important step toward a genuinely written literature."⁴¹


    The fate of the Umayyad court’s official record of Ibn Shihāb al-Zuhri’s traditions
    is something of a mystery. The aforementioned testimony of al-Zuhri’s students
    Ma mar Ibn Rāshīd concerning the fate of this official corpus answers this question
    only partially. Ma mar testifies to witnessing the removal of the court’s official
    record of al-Zuhri’s traditions from the caliphal storehouses and how those entrusted
    with the task needed several beasts of burden for the task. According to his own
    testimony, Ma mar was surprised to see that the voluminous corpus outstripped
    everything he himself had learned from his teacher. Where were these writings
    taken? We shall never know. They are unlikely to have survived the collapse of
    the Umayyad caliphate. The content of Ma mar’s testimony is important: he says
    that he witnessed the event after the assassination of the Umayyad caliph II in
    744 C.E. The assassination of al-Walid II was an inflexion point, an event that
