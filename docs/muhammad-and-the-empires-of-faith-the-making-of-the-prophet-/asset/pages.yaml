  md: '# The Letters of ‘Urwah ibn al-Zubayr


    Nine letters attributed to Urwah ibn al-Zubayr, one of the famed “seven jurists
    [fuqaha ] of Medina,” (d. ca. A.H. 93–713 C.E.), may constitute the earliest extant
    written sources about the life of Muhammad. The letters are potentially extraordinary
    not just for how early they are but for who wrote them (assuming they are authentic).
    Urwah ibn al-Zubayr was the son of one of the more prominent Companions of the
    Prophet, al-Zubayr ibn ‘Awām (d. 36/65), and, through his mother Asmā’, the grandson
    of the first caliph, Abu Bakr al-Siddiq (r. 11–13/632–64). He belonged to the
    Asad clan of Quraysh and, hence, to the upper echelons of the conquest elite of
    Islamic and Umayyad society, and lived most of his life in the Hijaz, the region
    of Islam’s original seat of power and its cultural epicenter. He was thus ideally
    placed to know the earliest traditions about Muhammad’s life.


    Although addressed to two Umyad caliphs, ‘Abd al-Malik Marwan (r. 65–685) and
    his successor, al-Walid I (r. 86–705), the letters attributed to ‘Urwah presumably
    reflect what he taught students in his public majlis, or “sitting session.” If
    authentic, Urwah’s correspondence with these caliphs constantly postulates 73/692,
    the year of his political reconciliation with the Umayyads in the year ‘Abd al-Malik’s
    crushing defeat of his elder brother, ‘Abdallah ibn al-Zubayr, whose failed bid
    to become the leader the early Islamic polity Urwah had supported.


    That victory was a watershed event for the Umayyads. It put a decisive end to
    the Zubayrid’ efforts to seize the caliphate from their grasp and inaugurated
    a new stage in the ideological orientation of the early Islamic polity under Umayyad
    leadership. Henceforth the Umayyads placed confessions of God’s oneness and Muhammad’s
    messengership front and center in an array of state-commissioned'
