    putsch to oust the famously debauched al-Walid II, reigned only four months after
    the seizure, and the ensuing power struggle after Yazid’s demise created a dynamic
    crisis from which the Umayyads recovered. The Hāshimid revolution, led by a caliph
    in Kufah and strengthened by an army recruited on the eastern frontiers of the
    empire, manipulated the chaos to its advantage and succeeded in eliminating the
    Umayyads and installing a new caliph dynasty, the Abbasids, The rise of the Abbasid
