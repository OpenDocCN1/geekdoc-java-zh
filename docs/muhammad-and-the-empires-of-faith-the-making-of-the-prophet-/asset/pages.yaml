  md: '# THE BEGINNINGS OF THE SIRĀH-MAGHĀZĪ LITERATURE


    # IBN ISHĀQ AND THE ABBASIDS


    end of the Umayyad dynasty brought a new dynamism that set in motion transformations
    of the political, societal, and religious landscape of the early Islamic polity,
    but much lost with the decimation of the Umayyads'' leadership as well. Certainly,
    among those lost the Umayyad court''s official record of al-Zuhri''s corpus of
    traditions, of which the caliphal library had stored at most a few copies for
    the exclusive use of the court. The most part written records of al-Zuhri''s learning
    survive only through private copies of his students. This had important consequences
    for the early Abbasids. After they seized the caliphate and began to consolidate
    their power, the Abbasids, unlike the Umayyads, could boost no court history,
    no official record of the past onto which they could project their ideology. To
    match this Umayyad achievement, the Abbasids "had to start again from scratch,"
    Schoeler notes.⁹ They needed another al-Zuhri. The Abbasids found one of his students,
    from Medina named Muhammad Ibn Ishāq, for the task.


    Muhammad Ibn Ishāq ibn Yasir an inhabitant of Medina, was like most transmitters
    of the sirah-maghāzī tradition, unlike Ibn Shih Shihāb al-Zuhri or his predecessors
    ''Urwah ibn al-Zubayr, Ibn Ishāq was not of Arab descent and could boost no tribal
    generic neutrality. Ibn Ishāq descended from a Jewish man Yasir Ibn Kūtham, whose
    Arabian tribes had taken captive in 12/633-34 from a synagogue in ''Ayn al-Tamr
    in southern Iraq with forty boys. His father Yasar was reported to be the first
    couple (sabi) of the early Islamic converts to the city of Medina, where he lived
    the remainder of his life bound by clientage to a notable family of Quraysh. His
    grandfather and father before him, Ibn Ishāq was a non-Arab mawlā, a man by clientage
    to an Arab tribe. The Medina household of whom Ibn Ishāq and his family were both
    a rather prominent, one of the Qurashi noble family Ibn Makhram ibn al-Muṭalib
    Ibn ''Abd Mānf, who was born of a Jewish mother.¹⁰


    As a non-Arab, Ibn Ishāq lacked the high status granted to his famous teachers
    by accident of birth. A widely reported anecdote about Ibn Ishāq''s youth grants
    us a glimpse into the societal gulf that separated him from his predecessors.
    It was when Ibn Ishāq began to show up at Ibn Shihāb al-Zuhri''s teaching sessions
    in Medina to learn traditions from him, he would often arrive late. Seeking the
    reason for this, al-Zuhri discovered that his doorkeeper had been treating the
    callow youth as riffraff and showing him away. Only after al-Zuhri intervened
    was Ibn Ishāq able to join his circle and learn traditions from him.¹¹


