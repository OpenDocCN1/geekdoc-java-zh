    The overall impression from accounts of al-Zuhri''s writings remains, however,
    that his monumental corpus was recorded by officials at the Umayyad court, on
    the one hand, and by his students, on the other, who subsequently redacted their
    records. The preservation of al-Zuhri''s traditions was not undertaken by the
    scholar himself. As any survey of the earliest Arabic literature will bear out,
    the corpus of al-Zuhri''s tradition survives in a few ofours, which seem to rely
    whatever the earliest written records of al-Zuhri''s corpus might have revealed
    partially lost. The Medinan scholar Mālik ibn Anas (d. 179/795) purportedly once
    said:


    We used to crowd around Ibn Shihāb [al-Zuhri]''s doorstep each of us would fall
    on one of another. I had never seen several chests of writings [sanādiq kutub],
    but they were there. If they had survived, they would have been dearer to me than
    my family and possessions combined!


    Later attempts were to reassemble and reconstruct this corpus, the most famous
    example being the *Kitab al-Zuhriyyat*, compiled by the famous *hadith* scholar
    of Nishapur Muhammad Yahāʿ al-Duhuli (d. 258/873), which, seems not to have survived.


    All of these reports regarding al-Zuhri''s corpus must be understood as speaking
    about sundry sorts of writing, or compiled for different reasons and for different
    audiences. These different types of writings have been conveniently recorded by
    Gregor Schoeler:


