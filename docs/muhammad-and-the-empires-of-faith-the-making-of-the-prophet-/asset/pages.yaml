    Despite his lowly status, Ibn Ishāq also belonged to a new generation of scholars
    who rose to prominence despite being from non-Arab lineage and the servant class
    of the Arabs'' clients (*mawāli*). The increasing prominence of the scholarly
    influence and accomplishments of non-Arab scholars over Arab scholars at this
    time has been exaggerated in past scholarship,⁹⁹ it is no exaggeration to note
    how the generation whose lives spanned the late-Umayyad and early-Abbasid period
    witnessed an important, demographic shift in the composition of its learned elite
    and the eminent beirs of its cultural ideals. Ibn Ishāq''s generation of *mawāli*-scholars
    were upward mobile, ambitious assimilators to the new hegenic culture, with their
    zealous embrace of religion (Islam) and language (Arabic), they swiftly rose to
    prominence in the second/eighth century.¹¹⁰ Ibn Ishāq''s rise to prominence as
    a scholar of *maghāzī* and, in particular, of the traditions of al-Zuhri in Medina
    was not an isolated achievement, even if he was the most spectacular. This rise
    occurred alongside that of other prominent *mawāli* of Medina, who are now lost
    and survive only in quotations later works,


