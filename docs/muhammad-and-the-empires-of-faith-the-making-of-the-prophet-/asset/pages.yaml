    recorded, and he singled out al-Zuhri as the preeminent scholar for the task.
    In a famous statement, al-Zuhri himself characterized the shift as transpiring
    mostly against his will, declaring: "We were unwilling to commit knowledge [of
    the tradition] to writing these rulers forced to do it. Our view is that we ought
    not forbid Muslim from doing it."³⁵


    In another version, al-Zuhri said, "The kings had me commit [knowledge of the
    tradition] to writing, and I had them written down. Since I wrote it for kings
    I would be ashamed before God not to write it for others."³⁶ Compelled by the
    caliphal court, al-Zuhri’s ideological shift hath overturned long-held prohibitions
    against committing the tradition—more specifically the *hadith* and sunan that
    provided so much of the raw material for the sīrah-magḥāzi literature—to writing
    for broad dissation.


    Yet it is important to re-emphasize the following: writing was not forbidden—recording
    the Qurʿan in codes and penning letters on sundry issues remained no scholarly
    thababas. Recording tradition, or *ʿilm*, was was interdicted. This attitude is
    clearly expressed in a saying attributed to the Prophet’s cousin Ibn Abbās, "We
    write nothing on pages except for letters and the Qurʿan."³⁷ The rationale for
    the prohibition of writing assumed diverse forms in the period, but the most salient
    concern were expressed that the differences between the Qurʿan and the tradition
    might become confused, or that the recording of this tradition might distract
    the pious from learning the Qurʿan, or even that records of the tradition might
    fall into unworthy hands and be as nefarious as.³.


    Secondly, the acquisition of al-Zuhri to Hishām did not cause a radical break
    with the past that scholars of the tradition devalued oral transmission and aerial
    reception altogether. A prodigious memory allowed one to memorize vast stores
    of *hadith* still remained the sine qua non of scholarly acumen for generations
    of *hadith* scholars thereafter. Rather, what emerged was a compromise-, and Hishām’s
    court at its epicenter, that commanded oral transmission of the tradition its
    written codification in books.³⁹ At the same time, the impact of this written
    record of the tradition in future generations is difficult to underestimate.


    Precisely when Ibn Shihāb al-Zuhri acquiesced to the court’s will and let his
