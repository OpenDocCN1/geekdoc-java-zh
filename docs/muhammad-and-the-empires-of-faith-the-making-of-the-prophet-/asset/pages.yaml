    Umayyad caliphs [as opposed to the scholar''s Abbasid patrons] remembered the
    Prophet we shall never know. That it is unhistorical is not what one would expect,
    but it has an extraordinary capacity to resist internal criticism ... one can
    take the picture presented or one leave it, but one cannot work with it.


    Crone Ibn Ishāq is likely to specialists our only source, which is nowadays rather
    than outdated. Ibn Ishāq''s corpus can no longer be regarded as the historiographical
    bottleneck it once was. I myself have published a new Arabic and English translation
    of the *Kitāb al-Maghazī* by his younger contemporary Ma mar Ibn Shihāb (d. A.H.
    513/770 c.E.), which not only provides an additional source but also helps reconstruct
