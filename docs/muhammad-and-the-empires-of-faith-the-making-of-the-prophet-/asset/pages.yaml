    COMMENTARY. Traditions transmitted on the authority provide the most detailed
    outline of the historical events surrounding the pact contained between Muhammad
    and the Meccan Qurays at al-Hudaybiyah in 6/628 in the sirah-maghāzī corpus. The
    pact at al-Hudaybiyah sets the terms of an armistice between Medina and Mecca,
    giving the Meccans a free hand to recover from the ongoing war with Medina and
    the Medinan, under Muhammad''s direction, a free hand to focus their attention
    on the expansion of their authority to north without the intervention of Quraysh
    to the south. The pact of al-Hudaybiyah effectively allowed Muhammad to create
    the political conditions that would enable him to conquer Mecca with minimal resistance.
    ''Urwah''s letter here addresses an existential issue that there be a discrepancy
    in Medina''s policy towards Meccans who sought to abandon Mecca and to join Muhammad''s
    community. The men who abandoned the Meccan Qurays were turned away—though in
    reality many of them did not return home but instead formed a type of guerrilla
    movement—but the women were not turned away and forced to return to Mecca. ''Urwah''s
    letter offers an exegesis of al-ʿI Q. 60:10 that places the divine revelation
    within the context of al-Hudaybiyah and elaborates on the pragmatic rationale
    behind Muhammad''s policy towards the women.


