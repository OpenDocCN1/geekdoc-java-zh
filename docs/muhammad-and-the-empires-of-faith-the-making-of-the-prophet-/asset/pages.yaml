    and reception. Variants resulted, not only from the vagaries of oral transmission,
    but also from those of textual transmission in manuscripts. Even if the existence
    of an early source text or template can be proven with a reasonable degree of
    certainty, some of the “original” wording of many accounts as transmitted from
    teacher to pupil has been lost.


    3. The earliest hadith and sīrah-maghāzī accounts that can be reconstructed generally
    from no earlier than sixty years after the death of Muhammad, with very few exceptions,
    they are not eyewitness reports. Hence, the chasm between source and event is
    never eliminated; it is only narrowed.


    4. Although analysis can verify the authenticity of transmission (i.e., that teacher
    transmitted tradition n to pupil), it cannot verify the authenticity of a given
    tradition being transmitted. We merely get a sense of its beginnings. Moreover,
    the epistemological problems of all historical projects are never entirely resolved
    just because the beginnings of a tradition can be placed at an early stage. An
    early tradition is neither necessarily a historically accurate tradition nor ever
    a historical one.¹⁷


