  md: '# INTRODUCTION


    who are content to document how the cultural memory of early Muslim communities
    coalesced and the formation of the literary forms that preserved this cultural
    memory.¹⁹ Robinson expresses his sanguinity about the second project, but of the
    two camps, the second bears the more pessimistic message in his reckoning. My
    message seems to help that modern historians can sort and sift through the memories
    of the past—or, more accurately, the literary representations of the past that
    construct the cultural memory of their societies and, thus, sustain and shape
    the identities of subsequent Muslim communities—but they cannot look beyond them.


    Robinson’s attitude is understandable and justified in numerous respects—just
    because he is pessimistic does not mean he is wrong. The habits cultivated by
    historians create an aversion to naive and clueless approaches to sources, and
    a healthy skepticism is stauch and indispensable inoculation against such naïvete.¹⁰
    But even skepticism has its limits.¹¹ More importantly, Robinson''s observations
