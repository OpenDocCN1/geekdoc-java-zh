  md: '# Muhammad and Cæmon


    According to a historian writing in the eighth century c.E., there lived in the
    century prior an an upright man whose life was irrevocably changed by an extraordinary
    vision. Even though this man was of meager means and lived far from civilization
    and military centers of his day, he was ultimately destined for eternal fame.
    The powerful urban and military centers of the late antique Roman Empire scarcely
    touched the people of his barbarian land. For the greater part of the man''s life,
    days passed by unequally. He was well regarded among his people, and they were
    accustomed to entrusting him with the care of their animals; yet being meek and
    unlearned, he was by no means a prominent leader among them. However, one night
    his life irrevocably changed. Having withdrawn into solitude away from the noise
    and bustle of the village, he entered quiet contemplation and eventually fell
    asleep. This was no ordinary slumber, but this was an ordinary evening. That night
    appeared to the man an angelic visitor of formidable countenance that demanded
    he proclaim to his people the glory of God and the majesty of His creation. Since
    he lacked learning and spoke a barbarian tongue, he at refused to heed the angelic
    visitor''s demands. How could he? But the heavenly visitor insisted more forcefully,
    and when at last the man acquiesced to the heavenly charge, he awoke from his
    somnambulant state transformed. As by some miracle, he now possessed the ability
    to fulfill his otherworldly visitor''s charge. He spoke forth the wonders of God
    and His Creation in the native tongue of his people. Indeed, he was the first
    to do so with such astounding beauty. Blessed with a divine gift, the eloquence
    of his words was peerless. When his people heard him utter the divinely gifted
    words in their native tongue, they stood in awe at what they heard, certain that
    it could only be explained as a wonder of God.'
