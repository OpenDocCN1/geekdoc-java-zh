    # IBN SHIHĀH AL-ZUHRĪ AND THE UMAYYADS


    In strictly evidentiary terms, we are on firmer ground with the signs of a cultural
    shift in ʿAbd al-Malik according to tradition in the reign of the Umayyad caliph
    Hishām ibn ʿAbd (r. 105–25/724–43). Most accounts assert that Caliph Hishām approached
    the Medinan scholar Muhammad Muslim ibn ʿbayallah ʿAbdallah ibn Shihāb al-Zuhrah
    of Quraysh, widely known as Ibn Shihāb al-Zuhri (d. 124/742), and had record his
    learning and knowledge of the tradition (ʿilm) in writing at the court''s behest.
    That Hishām come to the task comes little surprise: al-Zuhri cultivated intimate
    ties with the Umayyad court for almost his entire adult life, which would have
    major ramifications for him personally, and broadly speaking, for the history
    of committing the Medinas'' tradition to writing.


    Ibn Saʿ (d. 230/845) records an extraordinary autobiographical account of al-Zuhri
    in which he relates his relationship with the Umayyad court and how it influenced
    his pursuit of knowledge throughout the course of his life. Since such autobiographical
    accounts are virtually unprecedented for this period, so it merits question in
    full, length which it is. ¹¹⁴ Al-Zuhri begins his story with his youth in Medina
    during the Second Civil War between the Zubayids and Umayyads:


