    Yet such epigraphic attestations to Muhammad are not the earliest Muslim documentary
    texts to mention his name—and certainly not the earliest that can be dated with
    precision. The earliest datable attestations hitherto discovered come from numismatic
    research rather than epigraphic evidence. Hence, Muhammad''s name and epithet
    “the Messenger of God” (Ar. *rasūl Allh*) were first attested on silver coins
    minted in Bishapūr in the Fars province of southern Iran. The coins were struck
    early in the Second Civil War between the Umayyads and the Zubrayids, which pitted
    two families of Qurash against each other in a political contest for the leadership
    of the early Islamic policy. Between 66/685 and 68–89, these coins were put into
    circulation as a new issue minted on behalf of the would-caliph and the leader
    of the Zubayid faction, ‘Abdāll ibn al-Zubayr, by his brother-in-law and governor
    of the east, ‘Abd al-Malik ibn ‘Abdāll ibn ‘Āmir. The marks of these coins bear
    the simple confession “In the name of God, Muhammad is the Messenger of God” (see
    fig. 2). Although these Zubrayid coins also offer the earliest-known attestation
    to the Muslim confession of faith (*al-shahādah*), they only affirm of Muhammad’s
    prophethood and curiously lack the ubiquitous common phrase “There is no god but
    God [lā ilāha illā Allh],” which subsequently achieved prominence in the documentary
    record after 70s/695. The confession of Muhammad’s messengership conveyed by these
    early coins seems to have played an integral role in the Zubrayids’ efforts to
    bolster the legitimacy of Ibn al-Zubayr and his claim to the title “Commander
    of the Faithful [*amir al-muʿminīn*],” and thus to the Zubrayids’ efforts to articulate
    a counter-discourse against their rivals, the Umayyads, whom they sought to displace.²⁴We
    will encounter the Zubrayids repeatedly in the course of this monograph, but for
    not to note the following: While the Zubrayids brought a formidable military and
    ideological challenge to the Umayyads’ leadership they ultimately failed to vanquish
    the Umayyads or to permanently displace them from the caliphate. Yet, however
    brief the Zubayrid intermezzo, the influence of their ideological and numismatic
    innovations left an indelible imprint on how political legitimacy would be articulated
    by the early Islamic policy’ elites ever thereafter.


