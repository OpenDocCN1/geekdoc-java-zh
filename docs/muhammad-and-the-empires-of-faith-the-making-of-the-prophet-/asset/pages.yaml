    # EXCURSIS: ALTERNATIVE ACCOUNTS OF MUHAMMAD’S FIRST REVELATION


    The i‘raq narrative narrates the most widespread account of Muhammad''s first
    revelation; however, it is not by means the only account of Muhammad''s first
    revelatory experience. Had al-Zuhri (or perhaps ‘Urwah) ‘Ubay ibn ‘Umar al-Laythi,
    this particular story might have been another obscure hadith scarcely known outside
    the Islamic tradition. Numerous additional accounts posit a more gradual experience
    and realization of prophethood that does not initiate with an abrupt revelation
    of the divine revelation by the angel Gabriel. Gradualist accounts of Muhammad''s
    experience of prophecy often anecdotes that were suppressed for theological reasons:
    anecdotes in which the archangels Gabriel and Michael chastise Muhammad for touching
    one or sacrificing an animal to idols during his years. According to Iraqi tradition,
    before his first revelations from Gabriel, [the archangel] Michael was entrusted
    with looking after the Messenger of God when he was four-years-old, for three
    years he learned the ways of prophecy [āsāb al-nwwihat].⁷¹ Notable as well is
    how many of these gradualist accounts place Muhammad''s first revelatory experience
    at al-Ayyad while he is busy tending flocks as a shepherd. These accounts are
