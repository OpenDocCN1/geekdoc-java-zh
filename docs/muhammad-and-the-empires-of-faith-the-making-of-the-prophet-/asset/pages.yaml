    Excavating of the first and third sections of the narrative is the primary goal
    of the remainder of this chapter. A philological and historical reading of the
    story of Heraclius’s vision and Muḥammad’s letter reveal, I contend, that al-Zuhri
    composed his account by an earlier Christian source of Palestinian provenance.
    The evidence of this appropriation was found in the two bookends of the narrative:
    the story of how Heraclius foresees the king[dom] of the circumcised and the story
    of Muḥammad’s letter to Heraclius. We begin with the story of Heraclius’s vision.


    # Heraclius Foresees the Kingdom of the Circumcised


    The Zuhri-account from Ma mar begins by stating that “Heraclius was a seer who
    peered into the stars [kāla ḥrāq haazzā ‘yanzuru fī-nujūm],” and also says that
    “he wrote to a seer who also looked into the stars [kataba ilā ‘yanzuru fī-nujūm]”.³⁶
    This characterization of Heraclius features in most of the other versions of al-Zuhri’s
    account as well. An Arabist’s eye is drawn to the peculiar term haazza used by
    the account to describe Heraclius and his fellow stargazer. Though a small detail,
    this word also provides us with the first clue that a non-Muslim account lies
    underneath the story. The word haazza is an Arabic hapax that occurs only in the
    cluster of traditions that transmit this account. Obscure and difficult words
    are rare in the *hadith* codex, the word haazza in particular appears to be an
    Aramaic, related to haazzāy, a word meaning “seer” or “one who receives visions”
    and “one who contemplates” (e.g., a sight, as the stars).³⁷ The word haazza thus
    provides us with an important clue and raises the question: Why does the account
    portray Heraclius as an astronomer at all? The short answer is that al-Zuhri’s
    claim that the emperor Heraclius was a practitioner of allegory reflects, to some
    extent, real historical knowledge about the emperor—knowledge conveyed to him
    by a well-informed source—but to appreciate the significance of this point requires
    further elaboration.


    As noted above, the legend is set during Heraclius’s story in Syria in the wake
    of his victory in the Persian-Roman War and his retrieval of the relic of the
    True Cross. In his version of the story, Ibn Ishāq makes this context explicit,
    and this setting is critical to the native idiom of both accounts: it presents
    Heraclius at the height of his powers and on the brink of his greatest loss.


