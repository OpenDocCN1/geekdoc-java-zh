    letters for the preservation of the tradition could be downright hostile—as Michael
    Cook noted, the accumulated private letters of scholars were often burned to prevent
    them from falling into the hands of anyone other than the scholar and the original
    recipient(s).¹ In ‘Urban’s day, written records of traditions served private,
    rather than public, and early scholars of his generation were at pains to prevent
    the dissemination of letters they had written, or writings that they personally
    owned, even instructing that they be destroyed after they died.¹¹ When texts owned
    by scholars did survive their deaths, it was often as family heirlooms. Both Nabia
    Abab and Michael Cook have noted the frequent overlap between family lines of
    transmission and the transmission of written materials,¹² a pattern that one also
    sees in the transmission of the bulk of ‘Urban’s letters by his son Hisham.


    The letters ascribed to ‘Urban ibn al-Zubay survive in three chains of transmission,
    the first is far more attested. They are as follows:


    # Chain 1. The Baṣrān Transmission


    ‘Abd al-Samad ibn ‘Abd al-Wārīth ← Abān al-ʿAṭār ← Hishām ibn ‘Urban ←

    Urban ibn al-Zubayr


    The Baṣrān line of transmission, the principle source for ‘Urban’s letters in
    Tabārī Tafsī and Tārīkh, is most fully attested. This chain of authorities, or
    Isḥām, depicts the letters written in response to the inquiries of the ‘Umayyad
    caliph ‘Abd al-Malik ibn Marwan to ‘Urban. The Baḥādith al-shollāt ‘Abd al-Wārīth
    Sa‘id al-Tammī (207/822–23, Baṣrān) is the common link for this line. Tabari cites
    his history via his son, but ‘Abd al-Wārīth ibn ‘Abd al-Samad (d. 252/866, Baṣrān),
    in his Tārīkh, transmitted the letters to the latter chain truly constituting
    an independent transmission which is confirmed by its citation in the Qur’an commentary
    of Ibn Abi Hātim al-Rāzī (d. 327/890).


    It might seem odd that the letters survive in a Baṣrān transmission, given that
    ‘Urban and his son Hishām were scions of a distinguished Medinan family of Qurays.
    Hishām’s scholarly biography sheds some light on this. In the wake of Abbasid
    revolution, Hishām undertook several journeys to Iraq. His departure after the
    Hajj season of 140/758 seems to have returned to Medina, where he allegedly supported
    the revolt of Muhammad al-Nafs al-Zakiyy in 145/762. However, Hishām supported
    Muhammad


