    The lyrical court did not create the corpus of traditions that served as the raw
    materials for this literature; the court impulse was contiguous with the tradition,
    but it did not encompass its totality. Only a portion of the early Muslim corpus
    of orally religious knowledge (‘ilm) constituted to the raw material of the *sīrah-maġhāzī*
    literature. The impulse emanating from the court call to write down *ibn* in general
    and the *sīrah-maġhāzī* traditions seized upon harnessed a vibrant, but still
    amorphous, tradition that flourished without direction from the court elite. Yet
    even if the court did not create the corpus, the legacy of the court’s intervention
    proved decisive for the formation of the *sīrah-maġhāzī* literature and its emergence
    as a literary genre of Arabic letters. Hence, reports about Muhammad’s life circulated
    on their own without the need for intervention and or prompting by the ruling
    class of the court elite, by a mustering of the resources of the court and the
    prestige of its patronage accounts for the genre’s survival in the shape of its
    most seminal works, as Muhammad Ibn Ishaq’s *Maġhāzī*.


    # PROPHECY AND THE RHORIC OF EMPIRE


    If one accepts that the court shaped the literature, it is essential to ask how
    the court impulse influenced the content of the *maġhāzī* traditions as well.
    In other words, how did the ideologies underlying the conquests of the early Islamic
    period and the expansion of the hegemony of its elites shape and impact the narratives
    of the *sīrah-maġhāzī*? I contend that the rhetoric of empire in Late Antiquity
    prefigured this corpus in underappreciated ways. The early powers of the *sīrah-maġhāzī*
    tradition adopted a preexisting language of political legitimacy rooted in the
    traditions of the Byzantine or Sasanid empires on the one hand, while on the other,
    they also sought to forge a new imperial discourse that, albeit in dialog with
    the imperial ideologies exposed by the Islamic period’s predecessors, mobilized
    the distinctive theological idiom of the *Qur’an and the religiosity it inspired.


    This phenomenon can perhaps easily be seen in the chasm between Arabic and non-Arabic
    sources speak about the political fortunes of Muhammad


