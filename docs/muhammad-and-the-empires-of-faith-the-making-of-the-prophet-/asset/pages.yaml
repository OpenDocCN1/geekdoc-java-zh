  md: '# The Beginnings of the Corpus


    The beginnings of the *sirah-maghāzī* literature are inextricably intertwined
    with the story of how a diffuse, orally transmitted corpus of learning distinct
    from the Qur''an came to be committed to writing and revered as an authoritative
    source of knowledge that complemented revealed scripture. At the earliest stages,
    this body of knowledge was collectively referred to as (*al-ilm*), and it mostly
    comprised an anecdotal stories and sayings (*hadith, akhbār, and āthār*) that
    conveyed the words of the Prophet Muhammad and his Companions, the manner in which
    they performed rituals to early Islamic religiosity, and the exemplary demands
    and conduct of the community''s forebears (*sunan*). The corpus was diffuse, since
    it was dispersed among numerous individuals whose participation in the conquests
    scattered across the expanse, and (then) still expanding, territorial reach of
    the Islamic polity and its settlements; but it was also topically varied, providing
    knowledge about an array of issues germane to early faith, such as ritual practice,
    legal norms, cosmology, past events, and else.


    The strand of this learned tradition that most concerns us is here the one that
    conveyed knowledge about the sacred past. *ilm* comprised a corpus of knowledge,
    but did not form a literary genre. Rather, the process of codifying *ilm* and
    its structural organization into writing gave rise to early genres of Arabic literature
    that put *ilm* to different uses: collections of *hadith* arranged into *muṣannaf*
    and *musnad form*, organizing the corpus according to the topics of each individual
    tradition or the authorities who transmitted them, respectively; works of qur
    ancient exegesis (*tafsir*), which attached to traditions to specific qur ancient
    verses; works detailing the proper conduct (*siyar*) for waging war and the division
    of the spoils of conquest; and narratives of significant events from the life
    of the'
