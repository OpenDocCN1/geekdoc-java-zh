    across opposing swathes of geography—and our documented example from Late Antiquity
    is the remarkable spread of the so-called *Sleeper of Ephesus* legend about Christian
    youths who hide and fall asleep in a cave fleeing Rome persecution only to awake
    a century later to find that the Christian message has spread and pagan persecutors
    follow. Our earliest testimony to the legend in Syria—the story is recorded in
