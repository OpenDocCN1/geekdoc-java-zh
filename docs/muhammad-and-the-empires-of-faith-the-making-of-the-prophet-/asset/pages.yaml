    Andreas Görke. Identifying the provenance of Bede''s tale of Cædmon in the ‘iqra’
    narrative seemed to provide independent confirmation of the accuracy of the philological
    tools Schoeler had developed to precisely trace the dissemination of the historical
    traditions about Muhammad''s call.


    Relying on von See''s hypothesis, Schoeler believed he could demonstrate that
    Ibn Ishāq had not invented the story of Muhammad''s call but merely transmitted
    an earlier account of his own making. In other words, the iqra narrative must
    have circulated far earlier than Ibn Ishāq''s Kitāb al-Maghāzī and in a form highly
    similar to the one recorded under Abbasid patronage. Indeed, for von See''s thesis
    that Bede relied upon the story of Muhammad''s call to be true, Schoeler''s thesis
    must also be correct: Bede could not have relied upon Ibn Ishāq''s Maghāzī, for
    Bede had finished his chronicle decades before Ibn Ishāq compiling his Kitāb al-Maghāzī
    during the caliphate of Abū Jaʿfar al-Manšūr (r. 136–59/754–75). Ibn Ishāq must
    have drawn on some source like Cædmon''s call, or so before Bede''s story—or so
