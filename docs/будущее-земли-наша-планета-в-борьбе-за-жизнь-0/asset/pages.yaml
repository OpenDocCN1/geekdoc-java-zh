  md: '# PART III


    # The Solution


    The global conservation movement has temporarily mitigated but hardly stopped
    the ongoing extinction of species. The rate of loss is instead accelerating. If
    biodiversity is to be returned to the baseline level of extinction that existed
    before the spread of humanity, and thus saved for future generations, the conservation
    effort must be raised to a new level. The only solution to the “Sixth Extinction”
    is to increase the area of inviolable natural reserves to half the surface of
    the Earth or greater. This expansion is favored by unplanned consequences of ongoing
    human population growth and movement and evolution of the economy now driven by
    the digital revolution. But it also requires a fundamental shift in moral reasoning
    concerning our relation to the living environment.'
