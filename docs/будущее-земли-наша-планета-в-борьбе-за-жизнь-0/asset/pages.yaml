    Scientific naturalists, amateur and professional both, acquainted with the species
    they study almost as though they were other people. One of my mentors when I was
    an undergraduate at the University of Alabama, the lepidopterist Ralph L. Chermock,
    once remarked to his students that a true naturalist knows the names of thousand
    species of organisms. I never come close to that, and I doubt that Chermock ever
    did, either. Perhaps a mnemonist could accomplish the feat from illustrations
    and museum specimens, but he would have little feel or substance in such knowledge
    alone. Chermock and I could do something better, however. Among the several hundreds
    species we had individually studied well, we knew just the names but the higher
    categories to which they belong, phyla through orders to families. We also knew
    a many genera (plural of genus) that especially interested us. We could then identify
    at a higher category thousands of species placed in front of us. And more than
    any but the most dedicated mnemonists, we could add facts and impressions about
    the biology of the species. There would be major gaps, of course, but we could
    say something or use of it, such as “That’s a Demognath salamander or close to
    it. I’ve seen several species. Very common. They prefer terrestrial but very habitats;
    there are several species in the southeastern United States.” Or, “That’s a solifug;
    they’re called sun spiders; some people call camel spiders; they look like little
    spiders but are all predators; they’re very different in a lot of ways. They are
    fast, and I believe all find them in the deserts in the Southwest and all over
    Africa; I’ve seen a couple of species.” Or, “Now, there’s something you don’t
    see every day. It’s a terrestrial planarian, a flatworm. This is only the second
    one I’ve personally seen. Most are aquatic or marine, but this one is terrestrial;
    I believe it occurs all around the world, probably carried accidentally in cargo.


    A great majority of people have little awareness of the countless species of the
    great biosphere that still envelops our planet. In particular, common knowledge
    of the world-dominant invertebrates, the little things that run the natural world,
    have dwindled to almost nothing. The working vocabulary of the average person
    comprises “cockroaches, mosquitoes, ants, wasps, termites, butterflies, moths,
    bedbugs, ticks, crabs, shrimp, lobsters, earthworms,” and a few others consisting
    of one to several species that,'
