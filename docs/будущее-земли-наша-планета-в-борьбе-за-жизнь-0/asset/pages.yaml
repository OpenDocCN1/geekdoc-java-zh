  md: 'The pathway of economic evolution will be set by growth that is increasingly
    intensive and less extensive. Its most advanced products will empower individuals
    with instruments capable of achieving more and more with less and per-capita consumption
    of materials and energy. The environmental consequence of its success will be
    the opposite of that envisioned by supporters of Anthropocene ideology. Ach, it
    will reduce the world ecological footprint, and free space and resources for the
    rest of life, not restrict it as a perceived necessity of a growing economy. The
    biosphere and the ten million species that compose it will no longer be treated
    as a commodity, but as something vastly more important—a mysterious entity still
    beyond the boundaries of our imagination yet vital to long-term human existence.


    With innovation and effort, we will find a way to steer through the climate-change
    crisis without having to resort to the gargantuan and dangerous programs of geoengineering
    now being discussed. In particular, let us hope that depression from fear of a
    declining future will not force the human race to scrub the atmosphere of excess
    carbon dioxide, then somehow put the carbon gathered back into the ground. Or,
    alternatively, coat Earth’s surface with sulfates to reflect part of the sun’s
    energy. Or, even worse but still talked about, add lime to seawater to absorb
    excess carbon dioxide out of the atmosphere.


    The spearhead of intensive economic evolution, and with it hope for biodiversity,
    is contained in the linkage of biology, nanotechnology, and robotics. Two ongoing
    enterprises within it, the seem to occupy a large part of science and high technology
    for the rest of the present century. They are also by happenstance on track to
    help reduce the ecological footprint, providing a better quality of life with
