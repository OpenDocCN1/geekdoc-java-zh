  md: '# 16


    # HISTORY REDEFINED


    History is not a prerogative of the human species. In the living world there are
    millions of histories. Each species is the inheritor of an ancient lineage. History
    exists in a point of space and time after a long journey through the labyrinth
    of evolution. Each twist and turn has been a gamble with the species’ continued
    existence. The players are the many ensembles of genes in the population. The
    game is the navigation of the environment in which the population lives. The payout
    is the share of breeding individuals in the next generation. The traits prescribed
    by the genes that sufficed in past generations might in the future continue to
    do so, but not. The environment is also changing. In new environments the genes
    may keep on winning, allowing the species to survive. Some of the variants of
    the genes, having arisen by mutation or forming new combinations, might even cause
    the species population to grow and spread. But at any time in a changing environment,
    the species could lose this game of evolution, and its population would spiral
    to extinction.'
