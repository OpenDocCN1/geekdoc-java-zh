    SOCOTRA. An isolated island (with small satellites) located in the Indian Ocean
    352 kilometers south of Yemen, Socotra is populated by trees and shrubs in strange
    shape and foliage as to earn it the titles “another Galápagos” and "most alien-looking
    place on Earth." Here you will find the dragon’s tree, the wall-dwelling Socotran
    fi, toothed aloes, and other plant species that compare in general form with vegetation
    elsewhere. Socotra also has about two hundred bird species, of which eight are
    unique to the archipelago.


    THE SERENGETI GRASSLAND ECOSYSTEM. Arguably the most famous terrestrial wildland
    ecosystem in the world is the great Serengeti (which means, in the Maasai language,"endless
    plains"), spanning a vast area from northern Tanzania to southwestern Kenya. A
    substantial portion of its area, as well as that of Kenya, is protected by national
    parks, conservation areas, and game reserves. The faunas and floras, including
    especially the large mammals, are the closest we have to the originals that have
    populated the African tropical grasslands and savannas since Pleistocene times.


    GORONGOSA NATIONAL PARK, MOZAMBIQUE. The country’s premier reserve has a full
    representation of southeastern African biodiversity by the multifarious habitats
    found within it, including a mountain ridge rising to almost two thousand meters
    and topped by rain forest, miombo dry forest, multiple rivers and streams, and
    gorges covered in rain forest and flanked by limestone cliffs, the latter riddled
    with still mostly unexplored caves. Gorongosa’s megafauna is rapidly regenerating
    after being driven to near extinction during the civil war of 1978–1992 followed
    by widespread poaching.


    SOUTH AFRICA. The country as a whole contains within its borders of the world’s
    several abundant and distinctive assemblages of both'
