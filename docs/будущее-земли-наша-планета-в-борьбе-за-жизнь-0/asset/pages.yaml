  md: 'reserve, or more, can we save the living part of the environment and achieve
    the stabilization required for our own survival.*


    Why one-half? Why not one-quarter or one-third? Because large plots, whether they
    already stand or can be created from corridors connecting smaller plots, harbor
    many more ecosystems and the species composing them at a sustainable level. As
    reserves grow in size, the diversity of life surviving within them also grows.
    As reserves are reduced in area, the diversity within them declines to a mathematically
    predictable degree swiftly—often immediately, and for a large fraction, forever.
    A biogeographic scan of Earth’s principal habitats shows that a full representation
    of its ecosystems and the vast majority of its species can be saved within half
    the planet''s surface. At one-half and above, life on Earth enters the safe zone.
    Within half, existing calculations from existing ecosystems indicate that more
    than 80 percent of the species would be stabilized.


    There is a second, psychological argument for protecting half of Earth. The current
    conservation movement has not been able to go the distance because it is a process.
    It targets the most endangered habitats and species and works forward from there.
    Knowing that the conservation window is closing fast, it strives to add increasing
    amounts of protected space, faster and faster, saving as much time and opportunity
    we will.


    Half-Earth is different. It is a goal. People understand and prefer goals. They
    need a victory, not just news that progress is being made. It is human nature
    to yearn for finally, something achieved by which their anxieties and fears are
    put to rest. We stay afraid if the enemy is still at the gate, if bankruptcy is
    still possible, if more care tests may yet prove positive. It is further our nature
    to choose large goals that while difficult are potentially game-changing and universal
    in benefit. To strive against odds on behalf of all of life would be humanity
    at its most noble.


    > * I first presented the basic argument for such a globally expanded reserve
    in The Future of Life (2002), and expanded in A Window on Eternity: A Biologist''s
    Walk Through Gorongosa National Park (2014). The term "Half-Earth" was suggested
    for this concept by Tony Hiss in his 2014 Smithsonian article "Can the World Really
    Set Aside Half the Planet for Wildlife?"'
