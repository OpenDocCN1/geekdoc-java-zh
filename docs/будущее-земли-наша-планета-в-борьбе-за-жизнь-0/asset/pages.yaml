    GIANT KILLERS. Naturalists are often startled when they first study a previously
    unknown species. When reflecting on the universal phenomenon of predation among
    animals, for example, naturalists tend to assume that predator and prey are roughly
    the same size, or that the predator is much larger. There are exceptions, however.
    Birds peck insects. A pack of wolves can bring a moose in deep snow, and a pride
    of lions on a while can disable an elephant. Still, the weight difference between
    predator and prey is usually no more than tenfold. A number of exceptions, however,
