    of Earth’s fauna and flora is not more expertly mapped and protected, some, amount
    of biodiversity will be vastly diminished by the end of the present century. Humanity
    is losing the race between the scientific study of global biodiversity and the
    obliteration of countless still-unknown species.


    I can illustrate the taxonomic overload very well with an example from my experience.
    A part of my research on ants has been a classification, which in any part of
    biodiversity species is absolutely necessary prelude for work on ecology and evolution.
    Over the years I’ve described about 450 new species of ants. Of these, 354 were
    in the single genus Pheidole. (As a reminder, a genus is a cluster of species
    similar to one another and all evolved from the same ancestral species. For example,
    Homo is our genus, and the ancestral species includes sapiens and our direct ancestral
    species, first Homo habilis, followed by Homo erectus.)


    Pheidole, whose name from the Greek means “thrifty one,” is the largest and most
    diverse genus among all of the fourteen thousand known species of ants. One of
    the species I discovered and named is Pheidole scalaris, where scalaris means
    “ladder,” referring to the distinctive ladderlike sculpture on the head of the
    soldier caste. Another is Pheidole hasticeps—“speahead,” for the spear-headed
    shape of the soldier’s head, and a third is Pheidole tachygalia—“belongs to tachigalia,”
    for the tree (Tachigalia) in which the ants make their nest. Pheidole aloyai honors
    Dr. D. P. Aloya, the Cuban entomologist who collected the first specimens in the
    field. With hundreds of species of Pheidole named by me and earlier taxonomists
    in this fashion, I was out of Greek and Latin words to describe additional new
