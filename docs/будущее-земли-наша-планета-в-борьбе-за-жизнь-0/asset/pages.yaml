  pgno: 126
- img_proc: true
  md: 'in its unique elsewhere endangered marsupial fauna, Kimberley is correctly
    called Australia’s “last great wilderness.”


    THE GIBBER PLAINS. The flat overflow plains of St Stony Desert, located within
    the ultra-dry center of the continent, hold water only in the form of floods that
    occur many years apart. Abounding life emerges from dormancy at that time, drawing
    large flocks of waterbirds from far away. In between the rains the land is baked
    bone-dry, with knee-high sclerophyllous vegetation. Even when severe, it nevertheless
    teams with mostly hidden animal species. Bruce Means has written of the Gibber
    habitats, “More often than we realise, the miracle of biodiversity is right under
    our noses, wherever we are.”


    NEW GUINEA. The world’s second largest island (after Greenland), about eight thousand
    square kilometers in area, is still mostly invested in rain forest, wetlands,
    and upland grasslands. Its terrestrial biodiversity is generally recognized as
    the richest and most explored in the world. The hyperdiversity is enhanced by
    the complex array of mountain ranges, the tallest soaring to alpine zones above
    forty-seven hundred meters, which occur permanently ice-covered peaks. New Guinea
    was an archipelago of smaller islands up to five million years ago, adding a secondary
    factor to species formation. In 1955, as a twenty-five-year-old, I was the first
    to collect ants in a systematic fashion across parts of New Guinea. Today, if
    I were offered other decades of healthy life but told I must spend it in one place
    as a naturalist, I would take New Guinea. No contest.


    NEW CALEDONIA. This remarkable island, subtropical and mountainous, has been isolated
    as a Gondwan fragment for eighty million years. It was first joined with New Zealand,
    then broke off to drift completely toward the equator. Today more than 80 percent
    of the native plant and animal species are found nowhere else, and many are markedly
    different from anything found elsewhere. New Caledonia even harbors elements that
