  md: 'Darwin’s five-week visit there in 1835. Homeward bound, he noticed that mockingbirds
    differ from one island to the next, causing him to conceive of evolution. But
    the Galápagos are special for another reason: from just a few species able to
    cross the ocean and colonize the islands have evolved many species that are specially
    adapted to the barren volcanic landscape. Giant tortoises, marine iguanas, herbs
    of the sunflower family that transmitted into trees, fences from a single ancestor
    to fill a half-dozen bird niches, and more, make the islands both a laboratory
    and classroom of evolutionary biology.


    # # Europe


    BIAŁOWIEZA FOREST, POLAND AND BELARUS. This is the largest remaining fragment
    of the primeval forest that once covered the flats of northwestern Europe to the
    dawn of the Neolithic period. Straddling the border between Poland and Belarus,
    the protected land covers almost two thousand square kilometers. A large fraction
    of the mammals of Europe live within its confines, including most notably the
    European bison (which more than once has narrowly escaped extinction), roe deer,
    elk, wild boar (a Polish forest horse), lynx, wolf, otter, and ermine. The nine
    hundred vascular plant species present include some of the largest ever recorded.


    LAKE BAIKAL, RUSSIAN SIBERIA. With an area of 31,722 square kilometers and maximum
    depth of 1,642 meters, Lake Baikal is the oldest and deepest freshwater lake in
    the world. As expected from its volume, it also harbors a remarkably large fauna
    and flora for an isolated body in the high latitudes. From its approximately twenty-five
    hundred species of plants and animals, two-thirds are nowhere else. Certain groups
    are represented by large numbers of species, including sculptins (fishes of the
    family Cottidae), sponges, snails, and amphipod crustaceans. Like the Galáp Islands,
    Lake Baikal is both a sanctuary of biodiversity, in this case the most found in
    any freshwater lake, and a laboratory of evolution.


    # # Africa and Madagascar'
