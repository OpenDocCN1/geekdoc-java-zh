  md: '# 3 HOW MUCH BIODIVERSITY SURVIVES TODAY?


    The total number of species alive on Earth can in theory be counted. In time we
    will be able to write the number down within narrow limits. But for the moment,
    conservation scientists look at a world census as a dilemma wrapped in a paradox.
    The amount of Earth’s biodiversity, we have found, is like a magic well. The more
    species humanity extinguishes, the more new ones are discovered. But this only
    adds to estimate the magnitude of destruction under way in species per year. We
    need to apply the approximate extinction rate of known species also to those that
    are unknown. There is no reason as yet to suppose that the two groups of species,
    known and still unknown, differ from each other radically. That realization leads
    to a dilemma that turns out also to be one of the great moral questions of all
    time: Will we continue to degrade the planet to satisfy our own immediate needs,
    or will we find a way to halt the mass extinction for the sake of future generations?'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'If we choose the path of destruction, the planet will continue to descend irreversibly
    into the Anthropocene Epoch, the biologically final age in which the planet exists
    almost exclusively by, and of ourselves. I prefer to call this option by another
    name, the Eremocene, the Age of Loneliness. The Eremocene is basically the age
    of people, our domesticated plants and animals, and our croplands all around the
    world as far as the eye can see.


    To measure the biosphere and its rate of diminution, the best unit to use by far
    is the species. Individual ecosystems, which are composed of species, are much
    more subjective in their boundaries. One thinks of foothill scrubland vs. oxbow
    lakes into rivers, riverbanks into deltas, and ground-soaking seeks into springs.
    Genes, which prescribe the defining traits of species, are on the other hand objective
    and can be exactly defined, but are more difficult to read and use to meet the
    multiple needs of taxonomy and biology. You with binoculars census a melody of
    warblers as they fly from one ecosystem to another—say, forest edge to forest
    interior—but identifying their preferred habitat is difficult, and sequencing
    their DNA for identification is even more so without capturing killing specimens.


    Far more important, however, is the circumstance that the traits with which we
    recognize organisms, variously by sight, sound, and smell. With species in mind
    we are able to understand how life evolves, and why each life-form is unique in
    its combination of anatomy, physiology, behavior, habitat preference, and every
    other property by which it survives and reproduces.


    Biologists define species as populations of individuals that mostly share the
    same traits and in addition interbreed freely among themselves under natural conditions,
    but not with other species. The textbook case of proven species is provided by
    the lion and the tiger. The two big cats will interbreed when caged—but not in
    nature. In ancient times their geographic ranges overlapped across a broad region,
    lions through all of Africa, including the Mediterranean coast, then east to India
    (where a small population still survives in Gujarat), and tigers from the Caucasus
    to eastern Siberia. No hybrids have ever been reported among wild populations,
    in either ancient or recent times.


    In 1758 Carl Linnaeus, a professor of botany at the University of Uppsala, published
    the system of classification that biologists have used to the present time. The
    goal he was to describe all of the species of plants'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'and animals in the world. With the help of his students, who traveled far away
    as South America and Japan, Linnaeus accounted for about twenty thousand species.
    By 2009, according to the Australian Biological Resources Study, the number had
    grown to 1.9 million. Since then, new species have been discovered and provided
    formal, Latinized double names (for example, Canis lupus for the wolf) at the
    rate of over eighteen thousand a year. Thus in 2015 the number of species known
    to science passed two million.


    That figure, however, is still far from the actual number of living species. Earth,
    remains a little-known planet. Scientists and the public are reasonably familiar
    with the vertebrates (fishes, amphibians, reptiles, birds, mammals), mostly because
    of their large size and immediate visible impact on human life. The best known
    of the vertebrates are the mammals, with about fifty-five hundred species known
    and, according to experts, a few remaining to be discovered. Birds have ten thousand
    recognized species, with an average of two or three species turning up each year.
    Reptiles are reasonably well known, with slightly more than nine thousand species
    recognized and a harsh thousand awaiting discovery. Fishes have thirty-two known
    and perhaps ten thousand awaiting discovery. Amphibians (frogs, salamanders, wormlike
    caecilians), among the most vulnerable to destruction, are surprisingly less known
    than the other land vertebrates: a bit over sixty-six hundred species discovered
    and a surprising fifteen thousand believed to exist. Flowering plants come with
    about two hundred seventy thousand species known and as many as eighty thousand
    awaiting discovery.


    For most of the rest of the living world, the picture is radically different.
    When expert estimates for invertebrates (such as the insects, crustaceans, and
    earthworms) are added to algae, fungi, mosses, and other lower plants; to gymnosperms,
    as well as flowering plants, bacteria, and other microorganisms, the total added
    and then projected has varied wildly, from five million to over hundred million
    species.


    In 2011, Boris Worm and his fellow researchers at Dalhousie University devised
    a new way to estimate the number of species, both known and still undiscovered.
    They proposed to scale downward across the taxonomic categories, ending up at
