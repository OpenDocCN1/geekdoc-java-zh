    I''ve chosen the foregoing examples of species interactions, all very peculiar
    in nature, with a purpose. First, to hold your attention, or course; insects are
    not everyone''s favorite animals. But they also illustrate an important principle
    of ecosystems studies. Imagine for yourself any niche that might have evolved
    on this planet within the realm of physical possibility. (No animal can run a
    hundred miles an hour, for example, or digest iron ore.) Somewhere among the millions
    of species on Earth one or more will probably occupy the niche you chose. To extend
    this principle from species to ecosystems, there is no better way than the exclamation
    that closes Darwin''s Origin of Species:


    It is interesting to contemplate an entangled branch, with many plants of many
