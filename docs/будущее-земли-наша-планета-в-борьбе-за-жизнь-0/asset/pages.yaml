  md: 'missing links of evolution—dinosaurs morphed into birds, for example, or lungfish
    into amphibians, or apes into humans.


    Equally exciting is the rediscovery of a species thought extinct. Which brings
    me to one of my favorite fantasies. I''m paddling a canoe through the back channels
    of another coastal floodplain forest, this one surrounding the Choctawhatchee
    River, which crosses the Florida Panhandle and flows into the Gulf of Mexico.
    I had an eerly familiar birdcall, peet-peet, the double strike of bill against
    hardwood. That, sounds like . . . but, no, it can’t be. But, yes, it can. Why
    not?


    In the dream of a pair of large woodpeckers swoop in and land noisily on a cypress
    trunk twenty feet straight ahead. Then another sharp double knock as one of the
    birds chisels out a beetle.


    Binoculars up. There are the black bodies and tails, flashing white primaries
    of the wings, bright red crest of the male. Ivory-bills! But, I, think, Impossible!
    Maybe I remembered the field guide. No, I have to believe my own eyes. The last
    verified sighting of an ivorybilled woodpecker I know was in the Singer Tract
    of Louisiana in 1944. In the fantasy I know that. I also remember that a sighting
    in the Big Woods swamp of Arkansas in 2004 was a mistake, the bird was a pileated
    woodpecker, a common look-alike of the ivory-bill. And I recall that later a team
    of birds reported signs of an ivory-bill population in the floodplain of Florida’s
    Choctawhatchee River, but that didn’t pan out, either. Has’t yet, anyway.


    Returning from the daydream to reality, I made a trip up the Choctawhatchee weir
    several years after the team of birds who reported signs of ivory-bills. It was
    a thrill—even without ivory-bills. The Choctawhatchee is a classic river of the
    region: dense subtropical floodplain forest, inlets that lead nowhere, life teeming
    everywhere, turtles of several species called schooters and sliders slipping over
    fallen tree limbs and out of sight as you approach. Alligators, occasionally big
    ones, crashing into the water farther upriver.


    I nurtured the first forhope I might see an ivory-bill myself. My companion and
    host MC Davis, a leading landowner and conservationist of the Gulf Coast who knew
    the region intimately, was entirely skeptical. He said, “Look, if I wanted to
    know about ivory-bills, I’d go up the river a ways, talk to some of the swamp
    rats who live along the river,'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'and offer a pretty good reward for proof of an ivory-bill population, I don’t
    mean a dead bird, either.


    Anyway, one day I was having breakfast with a group of naturalists in MC Davis’s
    renovated barn, preparing for a day in the field, and the subject of possible
    ivory-bills in the nearby Choctawhatchee floodplain came. There was a general
    thumbs-down—nobody likes to appear gullible—when one of the group said he wanted
    to play a tape of a birdcall. We hear peet-peet, peet-peet. An experienced birder
    said quietly, “That’s an ivory-bill.” It might have been, but I’m a realist I
    suspect the tape had been made sixty years previously in the Singer Tract of Louisiana.
    One of the most spectacular birds of America, the equal in length of the wooping
    crane and California condors, the ivory-bill had been driven to extinction by
    the clear-cutting of cypress and large trees, upon its existence depended. The
    Singer Tract was its refuge, and when that, too, was logged, the species disappeared.


    So, to return a moment to the fantasy, imagine what you yourself might say first
    on making this historic discovery. You know this much: if you lived in the southern
    United States a hundred years ago, when the ivory-bill was already rare but occasionally
    seen, and you had previously never seen one, you might have responded with what
    was then a common expression: “Lord God, what is that?” Anyone who has been startled,
    out of nowhere (in Costa Rica), by a pair of large woodpeckers descending suddenly
    out of nowhere ten feet away at head level will understand that exclamation.


    And thus it came to pass that common name for the ivory-bill in the old days was
    the Lord God bird.


    I’m telling you this story not to get you down to the Choctawhatchee but to help
    convey you the passion of the naturalist. We each commonly make a discovery of
    at least one species, whether new to science or rescued from oblivion, just rare
    and unexpected, in what may be called a Lord God moment. It could come in the
    field from anywhere and at any time. Depending on one’s expertise, the creature
    before could be a Lord God salamander, for example, or a Lord God butterfly, or
    a Lord God spider, or even, descending the scale all the way down through the
    vast array of biodiversity, a God virus. Every species still alive is precious
    to us. Naturalists live for our Lord God moment. We want to save the experience
    for all generations to come.'
