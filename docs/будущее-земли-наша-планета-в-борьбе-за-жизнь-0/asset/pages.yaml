  md: 'And if that were not enough, a second chytrid has recently appeared on the
    scene. Where Batrachochytrium dendrobatidis kills frogs, its cousin Batrachochytrium
    salamandrivans attacks salamanders, the second major group of amphibians. (The
    second Latin name means “eater of salamanders.”) Having invaded Europe from Asia
    as a free-rider of the pet trade, the parasite infects 98 percent mortality. It
    looms as an especially dangerous threat to the rich salamander fauna of both temperate
    and tropical America.


    The chytrid invasion for amphibians—frogs and salamanders—is the equivalent of
    the Black Death for humans that swept Europe in the fourteenth century. In both
    catastrophes, the descending darkness became a Darwanian tragedy. The predators,
    having invaded a new continent, found a rich food supply. Their populations exploded,
    consumed too many of the prey, and doomed themselves to inevitable decline. Humanity
    has failed the amphibians, to date, the frogs anticipated and stopped this cruel
    epizootic.


    Frogs and salamanders are important predators that help stabilize moist forests,
    streamsides, and freshwater wetlands. They are our most gentle neighbors among
    the vertebrates, the equivalents of birds that we find in midst and on leaves
    of shrubs in forest litter, beautiful and often dazzling in color, timid in demeanor.
    Frogs sing in choruses during the mating season—sometimes as many as twenty species
    together in the American tropics—each species with its own song. The whole ensemble
    at seems chaotic, but you can learn to distinguish one from another with your
    eyes closed, by their precise and different scores, as you do with the instruments
    of an orchestra. During the rest of the year, individuals spread out. Then, if
    they sing at all, it is a different sound, hard to locate, designed during evolution
    to mark off territories among others of the same species.


    Frogs are pitifully vulnerable. When wetlands and forests are disturbed, they
    are among the first to disappear. Many of their species are specialized to live
    only in particular habitats—freshwater marshes or, variously, waterfalls, rock
    faces, forest canopies, and alpine meadows. And now, as scientists have discovered
    almost too late, there exist introduced diseases that can erase almost the entirety
    in one sweep.


    I cannot stress enough the menace of invasive species. Some authors, thankfully
    few in number, have naively suggested that in time alien plants'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'and animals will form "novel ecosystems" that replace the natural ecosystems
    wiped out by us and our hitchhiker companion species. There is evidence that some
    alien species of plants "naturalize" in island environments, in other words genetically
    adapt to them by natural selection. But this occurs only where the diversity of
    plant species is low and offers a relative abundance of empty niches to fill.


    Allowing the entry of alien species of any kind is the ecological equivalent of
    russian roulette. How many cylinders spin in the barrel of the extinction gun?
    And what percentage of the cylinders are loaded? The answers depend on the identity
    of the travelers and the niches in the host country they are able to fill. The
    plants of Europe and North America fit roughly the "tens rule" of invasion biology:
    by large, one in ten imported species escapes to the world, and one in ten colonists
    multiplies and spreads enough to become a pest. For vertebrates (mammals, birds,
    reptiles, amphibians, and fishes), the fraction of pet species is higher—about
    in ten.


    Inevitably, one immigrant species or another turns into a mega-invasive rivaling
    the frog chytrid. Such destroyer is Miconia calescens, an ornamental shrub native
    to Mexico and Central America. Two-thirds of the native forests of Tahiti have
    been overwhelmed by this invader. It reaches the size of trees and stands dense
    enough to crowd out other trees and woody shrubs—and in addition all but a few
    animals. A similar fate is prevented in Hawaii by squads of volunteers who locate
    and weed out every individual miconia plant from uncultivated areas.


    The accommodation of invasives into novel ecosystems is not cheap. By 2005, the
    economic costs in the United States had risen to an estimated $137 billion annually,
    not counting the threats they pose to freshwater species and ecosystems.


    The lands of the Pacific Islands have been the victims of another kind of apocalyptic
    force. In sheer numbers of species lost, they have been the hardest hit of all
    vertebrate animals. The wave of extinction began thirty-five hundred years ago
    with the arrival of humans in the western archipelagos—Samoa, Tonga, Vanuatu,
    Fiji, and the Marianas—continued nine to seven centuries ago through the colonization
    of the most remote islands of Hawaii, New Zealand, and Easter Island. A few of
    the surviving species teeter on the brink of extinction today. Two-'
