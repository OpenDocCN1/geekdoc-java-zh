  md: 'Taxonomists discover species, learn to identify them by differences in anatomy,
    DNA, behavior, habitat, and other biological traits. All of this information has
    practical value. Suppose a new kind of fruit fly introduced from a still-unknown
    location threatens the western alfalfa croplands. What is the name and identity
    of this invader? Where did it come from? What are its parasites and other natural
    enemies in the homeland? What else can be taken from its known biology to help
    control it? Would not be wise to wait for each such emergency in order to begin
    the needed research from the ground up. Bear in mind that the number of such invasive
    species is growing exponentially everywhere in the world. A few in the rising
    tide are potential pests. Another small fraction are insects and other organisms
    that carry the pathogenic microbes from one human or domestic animal to.


    Consider a second kind of problem becoming increasingly urgent in conservation.
    In 2014, officials of the oil palm industry proposed to cut and convert half of
    Borneo''s rain forest, leaving half as a conservation reserve. What effect would
    this massive destruction have on Borneo''s biodiversity? Would all of the island''s
    species survive in the trimmed-down reserve? Or would it be closer to 80 percent,
    or to half? And in the process, how many species found nowhere else in the world
    would fall to the chain saw? Previous experience with widespread conversion of
    natural environments suggests that the loss would be less than half, but still
    in the range of 10 or 20 percent, with many of the species found only in the destroyed
    forest lost forever, or doomed to early extinction, before they are even known
    to science.


    Another problem is the claim by Anthropocene enthusiasts that there are no more
    wildernesses, that Earth is already a used planet, and unfettered nature is dear
    or dying. The time has come, they say, to bring people fully into the picture,
    mingling people and wild species in a manner that benefits the two symbiotically.
    So just how many species, and how much nature, would survive? Anthropocene supporters
    have no idea, and qualified scientists are struggling to find out.


    I''ve stressed species as the unit in the hierarchy of biodiversity (ecosystem,
    species, gene) that can and must be studied most thoroughly with the practical
    aim of saving the whole. What needs to be done? The history of each species can
    be considered an epic. The entire biology of one species can consume the lifetime
    of a scientist. Even with a hundred'
