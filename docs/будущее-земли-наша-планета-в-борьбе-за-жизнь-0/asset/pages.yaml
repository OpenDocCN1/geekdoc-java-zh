  md: 'animals and plants. Huge Kruger National Park in the northeast and other reserves
    are home to the most complete array of ten-kilogram-plus wildlife in Africa (including
    black and white rhinoceroses, both critically endangered). The Cape Floristic
    Region harbors nine thousand species, 69 percent found nowhere else, and one-fifth
    of all the plant species of Africa. Within the region flores form several unique
    major habitats, including the fenbos heath, the succulent Karoo desert (shared
    with Namibia), and the archaic cycad forest of Limpopo Province.


    FORESTS OF THE CONGO BASIN. The basin of the Congo River, its 3.4 million square
    spanning the Republic of the Congo, the Democratic Republic of the Congo, the
    Central African Republic, and parts of Cameroon, Gabon, Angola, Zambia, and Tanzania,
    is the second largest drainage system in the world, exceeded only by the Amazon.
    It is invested by tropical rain forest, constituting one of the world''s three
    great rain forest wilderness (the other two are the Amazon and New Guinea). Although
    under heavy siege from logging and conversion to agriculture, it remains home
    to more than three thousand unique plants and an immense fauna, including gorillas,
    okapi, forest elephants, and other famously spectacular species of large animals.
    Five of the rain parks of the Congo are United Nations World Heritage sites.


    THE ATEA FOREST, GHANA. Many of the moist forests of Africa''s western hump have
    been reduced drastically by human encroachment, but fragments still survive as
    islands that preserve parts of the once exceptionally rich flora and forest. A
    splendid example is the pristine Atewa Forest, at least and half million years
    old, a remnant of the rain forest that has elsewhere be 80 percent removed. Atewa
    is the finest example of a variant of the biome called the Upland Evergreen Forest.


    MADAGASCAR. This huge island, the size of California and Arizona combined, located
    in the Indian Ocean four hundred kilometers off the coast of eastern Africa, has
    been isolated since it broke away 150 million years ago from the southern supercontinent
    of Gondwana. Very big, ancient, and tropical, Madagascar harbors a very large
    and unique fauna and flora, with 70 percent or more of its species found nowhere
    else. (The most recent figure for the fourteen thousand species.) Like Cuba, Hisola,
    and the Galápagos, Madagascar is a living laboratory for the observation of adaptive
    radiation, defined as the origin of a large array of species from a single species
    fortunate to colonize the island (in this'
