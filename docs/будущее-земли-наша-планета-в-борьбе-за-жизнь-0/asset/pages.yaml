    It follows that no study of a self-sustaining natural ecosystem can be entirely
    sound without a full biodiversity census of the kind under way in the Great Smoky
    Mountains National Park. And that is just a beginning. Far more information is
    needed, including where each species lives, and when it is active, its life cycle,
    its population dynamics, its interactions with other species within and outside
    the ecosystem. And even within taxonomic groups, as all the swallowtail butterflies
    collectively or all the birds of prey or land snails or orb-weaving spiders and
    on through the full taxonomic roster, there typically exist great differences
    among species in basic biology and impact on other organisms.


    When a graduate I first visited the Great Smoky Mountains National Park, I was
    fascinated by springtails, part of the group listed in the table as Collembola.
    These tiny and very elusive creatures possess a lever beneath their bodies, free
    at one end and attached at the other, allowing it to be opened and closed like
    a jackknife. When the collembolan is approached by a predator, it releases the
    free end, and the lever strikes the ground.'
