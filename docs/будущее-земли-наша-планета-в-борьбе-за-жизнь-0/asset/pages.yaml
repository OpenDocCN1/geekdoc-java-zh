- img_proc: true
  md: 'extremely rare. Few marine biologists have even seen one alive. I have not.
    Linnaeus and Darwin were completely unaware of their existence. All known to exist
    are water striders, a kind of "true bug" (insect order Hemiptera) common in freshwater
    streams, ponds, and lakes, where they skip over the surface on long, water-repellent
    legs. Freshwater water striders prey on other insects, such as mosquito larvae,
    which themselves live on or close to the surface. All of the marine water striders
    belong to the single genus Halobates. Only few species in this select group have
    found living on the open seas. The prey they hunt is unknown.


    The existence of Halobates water striders on the open sea is an exception that
    deepens the mystery. Insects have been evolving on the land and in ponds and other
    bodies of freshwater habitats for more than four hundred million years. During
    that period they dominated animal life while there are plants. Undetermined millions
    of species have evolved and proliferated during repeated surges of evolution.
    Yet only Halobates, water striders, have managed a foot on the sea. No, to the
    best of my knowledge, have been found even in a narrow niche among the thousands
    occupied by species of other invertebrate animals, such as crustaceans, spiders,
    and polychaetes.


    Conrad Labandeira, a leading paleontologist and expert on insect ecology, has
    suggested that there are no marine insects because there are no trees or lower
    leafy vegetation of the kind where the land life flourishes. Perhaps so. But there
    is plenty of layered vegetation in shallow marine waters, such as the kelp forests
    along the Pacific coast. Even that habitat has somehow yielded to invasion. Instead,
    it abounds with predators, parasites, and scavengers belonging to other kinds
    of invertebrates.


    Surprises of a different kind await in a wholly different fauna in yet another
    biological realm of the ocean, the deep scattering layer. If you are an open-ocean
    fisherman not committed to marlin, tuna, and other big-game species, you will
    encounter the widest variety of fishes by going out at night. As the sunlight
    fades, a dense concentration of fish, ascend from a depth of about 270 to 360
    meters, where they have cruised and floated hidden in darkness during the daylight
    hours. The cover deeper water gives them is not complete, however, because predators
    swimming at even greater depths still see them silhouetted against the light above.
    As a second defense some species'
  merge: -1
