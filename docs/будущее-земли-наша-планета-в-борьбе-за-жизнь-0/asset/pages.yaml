  md: To those who think nature consists primarily of plants and large vertebrate
    animals, I say look about you at the little things that run the earth. To those
    who believe they can fathom the working of ecosystems with mathematical models
    of a handful of species, I say you live in a dream world. And to those who believe
    that a damaged ecosystem will heal itself or can be safely restored by replacing
    original native species with functional alien equivalents, I say I think again
    before you cause damage. Just as successful medicine depends upon a knowledge
    of anatomy and physiology, conservation science depends upon a knowledge of of
    taxonomy and natural history.
