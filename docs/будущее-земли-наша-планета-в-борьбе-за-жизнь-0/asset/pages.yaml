  md: 'scientists focused on the species, our knowledge of it remains incomplete.
    There is the niche, where the species lives intimately with other species—prey,
    predator, inside and outside symbionts, engineers of soil and vegetation. Therein,
    we can find no species that lives alone. When we allow one species to die, we
    erase the web of relationships it maintained in life, with consequences that scientists
    seldom understand. In displacing wilderness, our actions are ignorant and permanently
    destructive. We break many threads, and change the ecosystem in ways still impossible
    to predict. As the pioneer environmentalist Barry Comer observed as his Second
    Law of Ecology,"You cannot do just one thing."


    The major ties of ecosystems are food webs. As taught in Ecology 101, on plants,
    birds prey on insects, birds feed on birds with seeds and fruit containing seeds,
    birds spread when they defeat, promoting the growth of plants. With predator-prey
    and symbiotic links of this simplicity, in a small ecosystem of a few species,
    it is possible to build mathematical models that predict population cycles, dispersal,
    and the likelihood of the persistence of the species. But are the models true?


    It is highly unlikely they will prove to be true within very broad limits. Ecologists
    are well aware that webs of simplicity are rare in nature, for reasons I have
    stressed. The real world, when explored as scientific natural history, reveals
    relationships among species that are usually surprising and often bizarre, far
    from ordinary human experience. I offer the following examples to make my point.


    VAMPIRE HUNTERS. The five thousand species of jumping spiders known worldwide
