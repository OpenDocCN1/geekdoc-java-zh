    # Antarctica


    MCMURDO DRY VALLEYS. Here, in the most inhospitable ice-free land on Earth, a
    place rivaled in the poverty of its biodiversity only by the serre, rainless Atacama
    Desert of Chile, live just enough species to make a balanced ecosystem. Sparse
    traces of algae are the plants, and several species of nematodes, also commonly
    called roundworms, are variously herbivores and predators—what Diana Wall at Colorado
    State University calls the “elephants and tigers” of the Antarctic soil. The simplicity
    of the material and energy cycle reminds us that there exist organisms able to
    establish themselves almost anywhere. But as humanity scales Earth’s ecosystems,
    life will become progressively less interesting and more difficult to turn into
    a support system.


