  md: '# 15


    # THE BEST PLACES IN THE BIOSPHERE


    Many who have spent their lives in cities or densely populated rural areas find
    it easy to imagine a world given over entirely to humanity. In the extreme Anthropocene
    worldview, it seems more logical to re-engineer what remains of nature to serve
    people than to protect nature in its original condition. Why, why its devotees
    ask, commit space and resources to a lost cause? The natural world is already
    badly damaged. Its biodiversity is past the point of no return. Prime habitats
    no longer exist. This defeatist opinion should be kept clearly in view. As John
    Stuart Mill once put the essence of discourse, both teachers and learners alike
    fall asleep when there is no enemy in the field.


    Naturalists and population biologists of course see the world in an entirely different
    way. A point of no return exists, but it only exists for humanity should we devote
    too much of the planet’s environment to the needs and pleasures of our one species.
    An Earth packed-wall-to wall with people would be a planetary spaceship, dependent
    on humanity’s future'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'intellect and wisdom for the long-term survival of life. It would not only
    be disastrous for the rest of life but a high risk to our own long-term survival.


    Conservation organizations themselves are not immune to the Anthropocene worldview.
    A worrisome expression of this turn of thought is expressed in recent annual reports
    of The Nature Conservancy. TNC has one of the most admired nongovernmental proponents
    of nature reserves, acquiring and setting aside miles of acres for permanent conservation.
    This work will no doubt continue, but the organization appears to have adopted
    a different mood. What nature can do for people and the economy has moved to center
    stage, where biodiversity has faded. The wraparound cover of the 2013 annual report,
    for example, is emblematic of what appears to be this worrisome trend. It is a
    photograph of a smiling boy on horseback tending a herd of goats in Mongolia.
    Behind, stretching to the horizon, a geometrically flat grassland. The total biodiversity
    comprises four species of organisms: human, two domestic animals, and one plant.
    Almost every photograph and block of photographs in the text features people,
    their habitats, and their domestic animals. portrays elephants, another penguins,
    a third childish cranes, and a fourth salmon hanging in an Alaskan smokehouse,
    their usefulness to people permitting no doubt.


    In contrast, the view of experienced naturalists and conservation biologists is
    focused on the two million other known species on Earth, and the more than six
    million others still undiscovered. Because it is clear that a healthy biosphere
    is good for the economy, we trust that the public and business and political leaders
    join us and come to value the living world as an independent moral imperative
    that also happens to be vital for human welfare.


    The lesson of biodiversity research is that the diversity of species, arrayed
    in countless natural ecosystems on the land and in the sea, is under threat. Those
    who have studied the database most agree that human activity, which has raised
    the species extinction rate a thousand times over its prehuman level, threatens
    to extinguish or bring to the brink of extinction half of the species surviving
    into this century. Yet remain scattered around the world many reservoirs of Earth’s
    biodiversity, from a few acres in area to authentic original wildernesses with
    areas in excess of many thousands of square kilometers. Almost all of these last
    domains of the natural living environment are under some degree of threat'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'or other, but they can be saved for future generations if those alive today
    have the will to act on their behalf.


    To document this important point about the promise of an expanded global conservation,
    I wrote to eighteen of the world''s senior naturalists, each with international
    experience and expertise in biodiversity and ecology, and asked them opinion on
    the best reserves, those sheltering assemblages of notably unique and valuable
    species of plants, animals, and microorganisms. I made the following request,
    here slightly paraphrased:


    It is important to describe the real world and biodiversity in the way naturalists
    have experienced and known, and which refutes that envisioned by de-extinction
    enthusiasts, nature-is-dead defeatists, and sundry ideological anthropocists conservation
    should be judged and led by those who know it. Not just that, but we need to ramp
    up the effort dramatically.


    So here''s the request: name one of five places in the world you would consider
    best on the basis of richness, uniqueness, and most in research and protection,
    in other words those you care most. And as you wish, give me reasons for your
    choice.


    The "best places in the biosphere" are strongly personal and subjective choices.
    They are not the same as the global biodiversity "hot spots," as first defined
    in the 1980s by the British ecologist Norman Myers and others—although there is
    very considerable overlap. Hot spots are selected on the basis of the high number
    of species at greatest risk that would be saved by protection of the area in which
    they live. My consultants and I are well aware that our "best places" list could
    be multiplied times over, but I believe that we have captured most of the very
    best. Together we make the point that even though extinction rates are soaring,
    a great deal of Earth''s biodiversity can still be saved.


    # The Best Places Chosen


    # North America


    THE REDWOOD FORESTS OF CALIFORNIA. Mark Moffett, an author and biodiversity expert,
    reports, “The most striking ecosystem within what''s called the California Floristic
    Province is a hot spot for species diversity. I have climbed redwoods and sequoias
    with the researchers working in the region, and have been awed by the crowns of
    these trees, which are so'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'ecologically lavish groves of smaller trees, hidden from the ground, can grow
    out of the soils that accumulate on their immense branches.” In effect, mature
    redwood forests have created a new and mostly unexplored layer of life, with which
    exist species rare or absent elsewhere. Scientists and adventurers can camp there,
    enthralled by the archetype of the giant tree that rises to a mythic world in
    the sky.


    THE LONGLEAF PINE SAVANNA OF THE AMERICAN SOUTH. An increasing number of scientists
    and writers are turning their attention to this outwardly ordinary but remarkably
    rich and complex ecosystem. As the dominant tree of 60 percent of the land from
    the Carolinas to eastern Texas, the longleaf savanna vegetation is adapted to
    frequent lightning-struck groves. The ground flora is one of the richest in North
    America, with as many fifty herbaceous and shrubby species in a single hectare.
    Pitcher-plant bogs scattered through the longleaf woodland are in turn the richest
    in the world, comprising up to fifty slender-stemmed species crowded into a square
    meter. The pine was almost entirely cut over during the past 150 years, but is
    now being reinstated to shelter the ground flora and fauna that survived its temporary
    disappearance. My own formative years were spent wandering through its remnants
    and the hardwood floodplain forests that dissect the region’s countless rivers
    and streams.


    # The West Indies


    CUBA AND HISANIOLA. The two largest islands of the Greater Antilles contain an
    exuberant fauna and flora that form the bulk of the biodiversity of all the West
    Indies. Their ultimate affinity is to Central America, from'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'which the Antillean landmass broke away by continental drift tens of millions
    of years ago. Their long isolation has resulted in the origin of large numbers
    of species that are found nowhere else. Some, like the strange insectivore mammal
    Solenodon, are relics from the islands'' earliest history. Others are the products
    of adaptive radiation, wherein one or a very few colonizing species have found
    competition and more open niches on the mainland. This circumstance has allowed
    some to proliferate into swarms of species that today individually fill the niches.
    Among the conspicuous examples are the diverse, abundant forms of anole lizards,
    and strange ants that in metallic hues variously of blue and green. One day, while
    exploring the Escambray Mountains of central Cuba, I found both a metallic green
    ant that nests in rock crevices and another species whose bodies flash gold foraging
    on low bushes. Moreover, both Cuba and the nearby Dominican Republic are surrounded
    by relatively undisturbed shorelines, with intact coral reefs.


    # South and Central America


    THE AMAZON RIVER BASIN. This endless world of ecosystems, the largest drainage
    system in the world, also contains the greatest area of rain forest and the most
    biodiverse surrounding savannas. It feeds fifteen thousand primary and secondary
    tributaries of the Amazon River and covers seven a half million square kilometers,
    40 percent of the area of the continent. Its biodiversity, if its Andean headwaters
    are included, is the largest in the world. The main stream commences in alpine
    rivu of the Peruvian Andes. Running at an average velocity of 2.4 kilometers an
    hour and average depth of more than 45.7 meters, it moves thirty trillion liters
    of water each day through a delta mouth 402 kilometers wide. Its rate of discharge
    eleven times that of the Mississippi River and sixty times that of the Nile. Its
    dimensions, when all of the tributaries are added, are matched by an immense diversity
    of fish and other freshwater animals and plants. The floodplain forests that clothe
    its its banks, their ground and lower tree trunks underwater during the wet season,
    when combined with the inland terra firma rain forests, are reservoirs of an even
    greater diversity of animals and plants.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'THE GUIANA SHIELD. The small countries of Guyana and Suriname, with neighboring
    French Guiana, are still 70 to 90 percent covered by pristine Amazon-related but
    distinctive rain forests. Their faunas and floras are exceptionally rich and remain
    among the least explored in the world.


    TEPUIS. These tabletop mountains are the imagined "lost worlds" of H. G. Wells
    and Hollywood. Limited to Venezuela and western Guyana, they are composed of blocks
    of ancient quartz arenite sandstone thrust surrounding rain forest. Their more
    or less flat tops range in elevation from one thousand to three thousand meters.
    They are indeed worlds unto themselves, with weather radically different from
    that at lower elevations, spectacular rock formations and waterfalls (Angel Falls
    is the highest in the world), and floras and faunas different from the lowlands
    below and from one tepui to the next.


    GREATER MANÚ REGION OF PERU. Adrian Forsyth, a leading tropical biologist, has
    captured the magic of this region, "where the largest equatorial ice mass in the
    world, crowned by mighty Ausangate, towers above the rocky slopes and puna grasslands
    that turn into unroaded rain forests with the landscape ranging down through montane
    forest. It makes a compressed panorama visible in a single glance by anyone standing
    in the Amazonian woodlands of Madre de Dios." North of the river exists the most
    concentrated biodiversity on Earth, including a full array of New World mammals.
    A simple square kilometer can harbor the same number of species of frogs found
    in the entire continental States, and twice the number of birds and butterflies.
    The same distinction or better applies to the rain forests of Ecuador''s legendary
    Yasuni National Park, located still further to the north.


    CLOUD AND SUMMIT FORESTS OF CENTRAL AMERICA AND THE NORTHERN ANDES. These cool,
    rain-soaked environments are distinct in both climate and biodiversity from the
    lowland forests below. Many are poorly explored, and contain large numbers of
    still-unknown species. The finding of the olinguito, the first sizable carnivorous
    mammal discovered in a century, is emblematic of what remains hidden.


    PÁRAMOS. These high-elevation (2,800 to 4,700 meters) grasslands of South America
    contain many unique grasses, herbs, and woody bushes. They also stand out in their
    high rate of evolution of new species—possibly due to fluctuations of climate
    in the fragmented mountaintop environment. Even though each is only kilometers
    above the lowland rain forests that'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'surround, they are physically and biologically a different world. Their floras
    are unique, and their small areas make their biodiversity vulnerable.


    ATLANTIC FORESTS OF SOUTH AMERICA. Called the Mata Atlântica in Portuguese, this
    vast and magnificent but now significantly reduced ecological system extends along
    the Brazilian Atlantic coast from Rio Grande Norte in the north to Rio Grande
    do Sul state in the south, with small extensions to Paraguay and Argentina (in
    other words, from the tip of Brazil’s “nose” to southeastern Paraguay). Its latitude
    and wide variation in rainfall give it an exceptional variation in ecosystems,
    which range from tropical to subtropical forests, both moist and dry, as well
    as scrub forests and grasslands. Within their domains occur a wide variety of
    rare and unusual animals, including, as described by Mark Moffett, “the most primitive
    porcupine; dancing frog and fruit-eating frog; curassow, the few remaining specimens
    of whom roam the private properties of two bird lowers; the largest New World
    primate, the muriki; the most colorful of all primates, the golden lion tamarin;
    the golden lancehead viper of Queimada Island, where it reaches the highest density
    known for any snake (not surprisingly, no person lives on ‘snake island”.


    THE CERADO. Covering a large part of east-central Brazil, the Cerrado is the largest
    savanna in South America and the most biodiversity-rich of any tropical habitat
    in the world. Its luxurious variety of life derives from the sharply defined mosaic
    of ecosystems it comprises, from classic open grassland with scattered woodland
    copses to patches of tall, rain-forest-like trees, with thick gallery forests
    that line its rivers. Unfortunately for biodiversity, its soil favors agriculture,
    and the Cerrado habitat is being rapidly cleared with as yet very little protection
    in reserves.


    THE PANTANAL. One of Earth’s largest wetlands, mostly in southern Brazil extending
    into Bolivia, this magnificent floodplain is 80 percent underwater in the rainy
    season and is the year-round home to an immense variety of waterfowl and insect
    life, as well as jaguars, capyaras, and other charismatic large mammals, including
    abundant crocodile-like caimans. Although designated as a World Heritage Site
    and increasingly popular with tourists, the Pantanal still supports a heavy burden
    of agriculture and cattle ranching.


    THE GALÁAGOS. This equatorial archipelago 926 kilometers west of the Ecuadorian
    mainland has acquired iconic status because of Charles'
