  md: 'Consider in the same light the different kinds of flies alone you would capture
    in a field on a summer day by simply sweeping a butterfly net back and forth through
    the vegetation. (Try it; you''ll be amazed.) Then ponder further, if you will,
    the species are variously specialized to feed on particular kinds of fruit, or
    pollen, or fungi; or scat, or dead bodies, or if you let them, your own fresh
    blood. Some flies are parasites on other insects—and not just insects, but to
    several species on which they are specialized out of thousands available. When
    as a teenager I had this epiphany, I almost became a diopterist, an entomologist
    who studies flies. I was mesmerized by delicate little flies of the family Dolichopodidae,
    glistening all in metallic blues and greens as they displayed themselves on plant
    leaves in the summer sunshine. How many species were there? Why were they dancing
    with the maximum effect to be seen, at least to me? Where and how did they spend
    their lives as larvae? Then I was distracted by ants. Although I was in normal
    Alabama at the time, far from the tropics, I discovered a colony of ants crossing
    my backyard. They were a native species, miniature version of the army ants that
    rampage through the forests of Central and South America. I followed their swiftmoving
    column as they crossed a neighbor''s yard, then poured across a paved street,
    and into a patch of woodland. At the tail of the procession I saw parasitic silverfish
    and other insect followers. My beautiful little dolichopodid flies could offer
    no competition to this spectacle, and I resolved to specialize on the study of
    ants. I had no idea then of the breadth and endless beauty of the world I was
    entering.


    Each ecosystem, be it a pond, meadow, coral reef, or something else out of thousands
    that can be found around the world, is a web of specialized organisms braided
    and woven together. The species, each interbreeding population of individuals,
    interact with some of the other species in the ecosystem either strongly or weakly
    or not at all. Where in most ecosystems even the identities of the species are
    unknown, how are biologists to define the many processes of their interactions?
    How can we predict changes in the ecosystem if some resident species vanish while
    other, previously absent species invade? We have best partial data, working off
    hints, tweaking everything with guesses.


    Those of us who have actually analyzed ecosystems to the species level in the
    field have managed to make serious progress only on the most restricted and elementary
    among them, and then for only a fraction of their'
