    Didierereaceae.


    # # Asia


    THE ALTAI MOUNTAINS. Towering 4,509 meters at maximum elevation, this beautiful
    and seldom-visited mountain range rises in Central Asia where Russia, China, Mongolia,
    and Kazakhstan meet. Covered at different elevations variously by steppes, northern
    coniferous forests, and high alpine vegetation, it contains a living encyclopedia
    of cold temperature and arctic mammals, and is one of the places in all of Eurasia
    that harbors a true Ice Age fauna. Herbivores resounding on its slopes include
    wapiti, moose, reindeer, Siberian musk deer, deer, and wild boar. Among their
    predators are brown bear, wolves, lynx, leopards, and wolverines. It is also the
    place where the first fossils of the Denisovan human species were found.


    BORNEO. The 18,307 islands of Indonesia (the estimated number varies according
    to criteria and technology) straddle 5,120 kilometers of latitude, from the western
    tip of Sumatra to Irian Jaya, the western half of New Guinea. Together, the archipelagos
    contain a staggering amount of biodiversity. The southern three-fourths of Borneo,
    the world''s third-largest island, is part of Indonesia, while the northern one-fourth
    belongs respectively to Malaysia and the independent monarchy of Brunei. The island
    as a whole has lost a substantial fraction of its rain forest due to settlement
    and conversion to oil palm plantations. The damage has been Science reported in
    2007: “Palm oil plantations are spreading as sales of the biofuel soar, invasive
    acacia trees are on a rampage, and wildfires ravaged the island each year.” Yet
    the interior of the great island, the “Heart of Borneo,” remains the leading single
    harbor of Asia’s tropical biodiversity.


    THE WESTERN GHATS OF INDIA. The subcontinent of India, like the great islands
    of Madagascar, New Caledonia, and New Zealand, is a fragment of Gondwana, differing
    primarily in drifting north all the way to'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'meet and fuse with the mainland of Asia. The Western Ghats, a mountain range
    running parallel to the full length of the west coast, is the geological spine
    of India. Their range of elevation, from near sea level to 2,695 meters at the
    highest point, and their tropical location combine to create a variety of terrestrial
    habitats, and with them a high level of biodiversity. Native to the most rolling,
    forested hills are five thousand species of plants, of which seventeen hundred
    are endemic, and a major mammal fauna that includes the world''s largest population
    of wild Asian elephants and a tenth of Earth''s surviving tigers.


    BHUTAN. This idyllic mountain nation deserves for the preservation of much of
    its native habitats and biodiversity. Its faunas and floras remain an intact slice
    of those that originally characterized the bulk of the Himalayan mountains and
    foothills. In Bhutan, 70 percent of the land is covered by forest representing
    the three principal zones—tropical, temperate, and alpine. The five thousand species
    of plants include forty-six rhododendrons and six hundred orchids.


    MYANMAR. The northern reaches of this still-somited country harbor reserves, about
    thirty-one square kilometers in combined area, and a rich fauna that includes
    elephants, bears, red pandas, tigers, and gibbons. The region includes tropical
    forests, coniferous woodland, and even patches of arctic grasslands above tree
    line.


    # Australia and Melanesia


    SCRUBLAND OF SOUTHWESTERN AUSTRALIA. From Esperance on the southwestern coast
    east to the edge of the Nullarbor Plain lies one of Earth''s richest endemic flora.
    Possessing a mild, Mediterranean-type climate and molybdenum-deficient soil that
    excludes species other than those adapted to the deficiency, the scrublands have
    evolved much like the flora of an ocean island. Unfortunately for the biodiversity
    of Australia and that of the world generally, molybdenum added to the soil makes
    it arable, and a large fraction of the scrubland has been converted to farms and
    cattle ranches, accompanied by incursions of invasive species.


    THE KIMBERLEY REGION OF NORTHWESTERN AUSTRALIA. The national parks and other,
    remote areas of this part of the continent are among its most biologically diverse
    and least disturbed regions. Experiencing a comeback'
