  md: '# 14


    # THE INVISIBLE EMPIRE


    ![](img/f03e757fcddd4aaceb89b9f39b980fec_105_0.png)


    Early in this century the members of the Explorers Club of New York faced a shrinking
    supply of unclimbed mountain peaks, unwalked polar ice sheets, and unvisited Amazonian
    tribes. In 2009 they adapted by adding biodiversity to their purview, which turned
    out to be a wise choice. The exploration of biodiversity offers scientists and
    adventurers alike the greatest physical adventures that remain on planet Earth.


    Remarkably, the new emphasis on biodiversity includes an auspicious examination
    of the flora and fauna inhabiting our own bodies. The ability to rapidly sequence
    the DNA of microorganisms has revealed that each healthy person contains a series
    of balanced ecosystems composed primarily of bacteria. Like microbes resident
    in other organisms, they are most friendly to their human hosts. Called “mutualistic
    symbionts” by biologists, they both benefit from the plants or animals with whom
    they live, and give benefit in return.


    Over five hundred such species of bacteria live in the mouth and esophagus of
    the average human. By forming a well-adapted microbial rain'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'forest, they protect this part of the body from harmful, parasitic species
    of bacteria. The price of failure in the symbiosis is an invasion of aliens, the
    buildup of dental plaque, tooth decay, and gum disease.


    Further down each successive part of the gastrointestinal tract, colonies of other
    specialized bacteria play crucial roles in digestion and disposal. The average
    number of human cells in the body runs at least into the tens of trillions—one
    number calculated from multiple estimates is forty million. The average number
    of bacteria in our microbiome, as it has come to be called, is at least ten times
    higher. To make the point, microbiologists joke that if biological taxonomy were
    to be based exclusively on the preponderance of DNA within each organism, human
    beings would be classified as bacteria.


    It should not be surprising to learn that the microbiome looms in medical science
    and practice. Researchers have come increasingly to investigate the symbionts''
    role in a wide range of health problems, usually arising in the gastrointestinal
    tract but also including obesity, diabetes, proneness to infections, and even
    some forms of mental illness. The microbiome is an interlocking array of ecosystems
    whose species need to be kept diverse and in correct balance. In a nutshell, much
    of medical practice will become a kind of bacterial gardening.


    The gardens growing within human beings and other animals are typical of complex
    ecosystems everywhere, inside and out. The overall number of kinds of microbiomes
    dwelling in animals and plants worldwide remains entirely unknown, but it may
    be enormous. Those inhabiting wood-eating termites, microbiologists have found,
    are drastically different from the ones carried by carnivorous animals, and so
    on a fortiori to other organisms as frogs and earthworms. It is obvious that symbiotic
    microbiology, which encompasses these systems, has emerged as an exciting frontier
    of science, and will remain for decades to come.


    Microbiology as a science was founded by Antonie van Leeuwenhoek in the late 1600s,
    when he invented microscopes powerful to see bacteria. It was nearly four hundred
    years later that biologists, led by the American Carl Woese, first recognized
    that the archaea, a group of bacteria-like microorganisms, are radically distinct
    in DNA from bacteria. The discovery challenged the basic arrangement of the Tree
    of Life and our picture of the early evolution of life. The Tree is a branching
    diagram that displays the ancestral relationships of species and groups of species
    one to'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'another, thus tracking the course of evolution that occurred earlier kinds
    of organisms gave rise to younger ones. It shows how some species multiply into
    daughter species across millions of years or, in a few cases, quickly as thousands
    of years, while others remain undivided.


    Until Woose and his colleagues, the standard classification recognized five kingdoms:
    Monera (comprising the bacteria and archaea), Protista (paramecia, amoebae, and
    other single-celled organisms), Fungi, Plantae, and Animalia. After Woose, three
    sprawling “domains” of life were left: the bacteria, microbes that lack a distinct
    nucleus; the newly defined archaea, similar to bacteria in their structure and
    also lacking a nucleus; and the Eukarya, having a nucleus, and combining all other
    known life-forms—protists, fungi, algae, and plants. What DNA comparisons revealed
    was that the Eukarya are largely in size—the property we see and care about almost
    to the exclusion of everything else—bacteria and archaea rule in numbers and global
    distribution, just as they have since the origin of life.


    Microbes create and deposit minerals. They break down and secrete organic chemicals,
    and influence plant growth. They are everywhere, collectively prepare to clean
    toxic waste, capture and collect the energy of sunlight, and combine water with
    carbon. They rule the base of the food chain. In short, our planet, the microbiologist
    Robertto once summed up the biosphere, “has been shaped by an invisible world.”


    Genetic diversity in the microbial world stands well apart from that in the rest
    of life. Human beings and potatoes are closer in their DNA sequences than the
    most dissimilar species of bacteria are from one another. Biologists have no idea
    of the number of species of bacteria on Earth. It could be in the tens of millions,
    hundreds of millions. At the present time there is not even an exact definition
    of bacterial and archaean species. Further complicating the picture is the promiscuity
    of the individual organisms. Bacterial cells have multiple ways of picking up
    genes from other cells, whether closely related or not. They accomplish this high-technology
    feat by collecting DNA fragments from the environment; by filming pieces from
    retroviruses during DNA transport by these quasi-organisms into the cells of larger
    organisms that host the viruses; and, finally, by engaging in conjugation, a surprisingly
    complex operation during which two cells come together and swap similar segments
    of their own DNA.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'Even the geography of bacterial diversity may be fundamentally different from
    that of plants and animals. In some way or other many kinds of bacteria obey a
    principle first proposed in 1934 by the pioneering ecologist Laurens Becking:
    “Everything is everywhere, but the environment selects.” That is, a large fraction
    of genetic forms or something very close to them occur around the globe, but lay
    dormant most of the time. They form a microbial seed bank within which each species
    begins to multiply only when the environment changes to suit its DNA-coded preference.
    The sleeping cells awake when presented by the right acidity, the right nutrients,
    and the right temperature. Seed banks occur throughout the terrestrial and watery
    beds. Only across great distances, perhaps continental in scale, genetic differences
    emerge, species formation at the magnitude conventional in plant and animal species.


    As DNA technology has improved, so is the rate of discovery of kinds of bacteria
    and other microscopic life-forms. Some are hidden in plain sight—abundant and
    exposed, yet too small to be seen with conventional light microscopy. As a result
    they are easily overlooked in standard screenings of microbial communities.


    The most important organisms discovered far may be the Prochlorococcus bacteria.
    Although first recognized only in 1988, Prochlorococcus are far from rare. They
    are in fact the most abundant organisms in tropical and subtropical seas around
    the world. They live in waters as deep as two hundred meters and reach local densities
    of more than a hundred thousand per millimeter. Because the tiny cells are also
    photosynthetic, living on the energy of sunlight, they account for 20 to 40 percent
    of the biomass of all photosynthetic present between 40°N and 40°S in the open
    ocean, and they are responsible for up to half of local net primary production.
    In warm ocean waters, at least, the invisible support the visible.


    Yet if Prochlorococcus along with a second superabundant bacterium, Pelagibacter,
    are the most abundant conventional organisms, might they be the prey of viruses
    that are even smaller? Experts used to think that such micro-predators are at
    best rare. In 2013, however, new methods in the fast-moving field of ultramicroscopic
    research revealed the presence of viruses on an average of billions per liter
    of seawater. All are bacteriophages (literally, “eaters of bacteria”), of which
    one, HTVC01P, is'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'the abundant. Biologists disagree on whether viruses in general are true organisms,
    since they rely on the molecular machinery of their hosts in order to reproduce.
    If HTVC010P is thus classified, it must be considered the most abundant known
    species on Earth.


    There is more. While sunlight-capturing Prochlorococcus bacteria and its bacteriophage
    predators are a large part of the ocean, they are likely backed by a still most
    undiscovered “dark matter” of scavengers and predators. These, too, are undetectable
    by means of conventional microscopy. Apparently filling the role at least in part
    is a highly diverse assemblage of pico-biphylates that measure only two-three-millions
    of a meter in greater diameter. One of the species was studied in sufficient detail
    in 2013 to recognize it as a new phylum, which researchers named the Picozoa.
    These almost vanishingly small creatures feed on colloidal fragments, moving jerkly
    through the water by whipping their flagellae back and forth. The anatomy of the
    one well-studied species is unique among microorganisms. It is oblong in shape,
    with its feeding apparatus occupying one entire-half of the body, leaving all
    the other organelles packed into the other half.


    As scientists have probed downward in the ocean, past the scattering layer at
    the edge of light and into the cold black, crushing depth, they have discovered
    yet another world of fishes, invertebrate animals, and microorganisms. Each species
    is specialized to survive and reproduce at the particular depth it has evolved.


    Then abruptly comes the bottom, darkly and poetically well named the abyssal benthos.
    Surely, you might think, there can be very little life in this featureless plain
    of silt so far below the photosynthesizing lighted kilometers above. That would
    be a mistake. the abyssal benthos teams with life. It is a prime hunting ground
    where the primary producers are not plants and photosynthesizing bacteria but
    scavengers. These organisms feast on every carcass, every piece of flesh and bone,
    and every salt-grained particle that makes it past the viper fish, gulper eels,
    and others cruising above them. The bottom-feeders include unique species of fishes,
    invertebrates, and bacteria. Together they wait for the decaying manna dropped
    from above. They are the final scavengers, predators of scavengers, and predators
    of scavengers in open water. Food is very scarce, but the ecosystem works because
    of all its inhabitants'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'have a superb sense of smell. They are able to track extremely faint traces
    of odor rising from every morsel of food, even in relatively still water.


    Consider the fate of a wooden boat that sinks at sea. Soon after it settles on
    the bottom, larvae of Teredo (Teredinidae) locate it and fasten to its surface.
    As the later stages grow, "termites of the sea" feed on the wood, boring tunnels
    as they proceed. The teredos are not worms, which they superficially resemble,
    but mollusks genetically close to barnacles.


    Next, visualize a piece of meat that makes it to the bottom. Within minutes it
    is likely to be discovered and vigorously attacked by deep-sea macourrid fish
    and jawless, eel-hagfish. Then come the scavenger invertebrates, and quickly thereafter
    bacteria, and soon nothing remains but fin organic products diffusing outwards
    in the icy still water.


    Any scraps of leftover wood and flesh are targets of invertebrates and bacteria,
    among which a prize given for "most bizarre," at least as a human would judge,
    I would vote for the Osedax worms, which feed on the lipids in the bones of whales
    that fall to the ocean floor. The diet is peculiar enough, but the method of feeding
    strains credibility. Female Osedax, which grow to the size of a human finger,
    have neither mouths nor intestines. They feed instead by penetrating the bones
    with bodily extensions that contain symbiotic bacteria. These microbial partners
    metabolize the lipids and share the material and energy produced with their worm
    hosts. And what of the male Osedax? Even stranger. The larva-like adults are only
    a third of a millimeter long, a dot from a pen in the hand. More than a hundred
    live in a colony of parasites beneath the sheath of every female, feeding on yolk
    of the female’s eggs—in other words, their own future brothers and sisters. The
    niche occupied by the Osedax is not as scarce as it may seem; six hundred thousand
    whale skeletons have been estimated to lie on Earth’s oceans.


    However, even if Osedax ebalone ever make you, let us not stop with them. There
    is another kind of life even farther down. Under the bottom surface, the benthic
    crust, life continues to flourish. The marine organisms join their counterparts,
    which occupy deep subterranean layers of soil and rock on land, to form a shroud
    enveloping the planet called the deep biosphere. The inhabitants are overwhelmingly
    microbial, comprising large proportions of both bacteria and the bacteria-like
    archaea.'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'In some marine localities, at least, a million of their cells abound per cubic
    centimeter at half a kilometer below the benthic surface. If this density proves
    to be worldwide, it means that the microbes of the marine deep biosphere comprise
    more than half of all microorganisms on the planet. It would possess the same
    order of magnitude of biomass (weight of organic material) as all the photosynthesizing
    plant life on Earth’s surface.


    If these estimates are even approximately correct, the existence of the deep biosphere
    requires a fundamental shift in our view of both the microbial species and the
    ecosystems they compose. At the ocean bottom and just below meter perhaps, the
    microbes and sparse invertebrate animals among them remain players in the carbon
    cycle of the waters and land above. Energy is derived from the debris of organisms
    that were created by solar energy. But in the deep biosphere down, this connection
    weakens and is evidently replaced by chemical energy derived from nonorganic sources
    in the soil and rocks. The deepest at which all such microbes have been found
    is 2.8 kilometers below the Earth’s surface, in the walls of the Mponeng gold
    mine near Johannesburg, South Africa. There, in the absence of light and oxygen,
    subject to a constant sixty degrees Celsius, lives the newly discovered species
    Desulforudis audaxivari. It exists by reducing sulfate and fixing carbon nitrogen
    from its surrounding organic environment. Given the steady rise of temperature
    with depth, *Desulforudis audaxivari* is, so far as known, the only species habitat
    appears to mark the inner boundary of life on the planet.


    What more complex, multiple-celled-forms? As I write, one species of nematode
    worm has been discovered in the lower reaches of the deep biosphere, feeding on
    microbes. More invertebrates, representing considerable biodiversity, are likely
    to be found.


    The existence of an independent layer of life invites reflection on the imagined
    Armageddon, and with it the End of the World. Our species, self-appointed Lords
    of Earth, accidentally turned the planet’s surface to a crisp, or on out asteroid
    meteor to wipe out all organisms on the surface, life could go on in the planet’s
    deep biosphere. There, its microbes and invertebrates would persist, shielded
    and unconcerned in their dark refugia, drawing their energy and substance from
    rocks, resistant to heat, perhaps evolving over hundreds of millions of years,
    eventually to reach the surface and generate a diversity of multiple-celled organisms,'
