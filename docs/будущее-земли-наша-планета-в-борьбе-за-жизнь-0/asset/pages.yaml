    As the databases in all these grow, new methods are being developed to convert
    their content into search engines to aid the rapid identification of specimens.
    By far the most potent is barcoding. The key is the DNA sequence of mitochondrial
    genes, which lie outside the nucleus in each cell, hence are inherited only through
    the mother. One segment in the gene CO1, comprising only six hundred fifty base
    pairs, is particularly useful because it varies immensely from one species to
