  md: 'number of classes in all these phyla, followed by order, family, genus—and
    finally species. The numbers from phyla to genus are relatively stable, with each
    rising in a smoothly'' bending curve as more and more time is devoted to them.
    If the shape of these curves is then extended to species, the number of species
    in the animal kingdom predicted to exist on Earth settles at a quite reasonable
    7.7 million. The total number in the Eukarya, which includes plants, animals,
    algae, fungi, and many kinds of eukaryotic microorganisms (those with mitochondria
    and other organelles), comes to approximately 8.7 million, give or take a million.


    The Dalhous method might undershoot the mark, however. Many species remain undiscovered
    for a reason well understood by biologists. These biologists have learned that
    the most elusive species tend to be rare and isolated in narrow niches limited
    to small, remote habitats, and hence could be much more numerous than suggested
    by public data sets.


    Wherever the censuses of biodiversity come rest among the scientists, the total
    will be strikingly higher than the two million species so discovered, given a
    Latinized double name, and counted to the present time. It is entirely possible
    that specialists have discovered only 20 percent, or fewer, of Earth’s biodiversity
    at the species level. Scientists working on biodiversity are in a race to find
    many of the surviving species as possible in each assemblage—mammals and birds,
    to tardigrades and tunicates and lichens and liohibid spiders and ants and nematodes—before
    they vanish and are not only overlooked but never to be known.


    Most people are unaware that this unfinished mission of science to discover and
    conserve all of life on Earth even exists. They have grown accustomed to media
    accounts that trivialize the subject with headlines as “Three new kinds of frogs
    discovered in Mexico” and “Himalayan bird found to consist of two species.” Readers
    are led to believe that the exploration of the living world is nearly finished,
    that the discovery of new species is a notable event. As a curator of insects
    at Harvard University’s Museum of Comparative Zoology for much of my career, I
    can testify how misleading and stultifying that image can be. The truth is that
    new species flood museums and laboratories everywhere, all the time. Specimens
    of the novelties pile up in most groups of organisms. They often must wait for
    years or even decades before the curators of the world’s'
