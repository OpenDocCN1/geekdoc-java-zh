    # APOCALYPSES NOW


    We encountered tropical forests practically devoid of amphibians that were once
    teeming with dozens of them. We watched mass die-offs. We tried to save threatened
    species by airlifting them out of infected areas, breeding them in captivity and
    searching for answers through field and lab research. None of it worked. No cure
    exists for wild populations. Loss of amphibians continues around the globe. We''ve
    seen no significant recovery of populations. Worse, the fungus persists in the
    environment, preventing the reintroduction of captive animals.


    Thus the field biologists Karen R. Lips and Joseph R. Mendelson II have described
    the devastation of frogs caused by the deadly chytrid fungus, known by the appropriately
    forbidding scientific name Batrachochytrium dendrobatis. The species has spread
    worldwide in freshwater aquariums used to transport frogs, a few of which have
    been unwittingly infected. And here is a stroke of bad luck: carriers include
    the African clawed frog Xenopus, often used in biological and medical research.
    Then added on is the second, fatal piece of bad luck: the fungus feeds on the
    entire skins of the adult frogs. Since adults breathe through their skin, they
    die from'
