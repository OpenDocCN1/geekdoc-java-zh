    # THREADING THE BOTTLENECK


    The Half-Earth solution does not mean dividing the planet into hemispheric halves
    or any other large pieces the size of continents or nation-states. Nor does it
    require changing ownership of any of the pieces, but instead only the stipulation
    that they be allowed to exist unharmed. It does, on the other hand, mean setting
    aside the largest reserves possible for nature, hence for the millions of other
    species still alive.


    The key to saving one-half of the planet is the ecological footprint, defined
    as the amount of space required to meet all of the needs of an average person.
    It comprises the land used for habitation, fresh water, food production and delivery,
    personal transportation, communication, governance, other public functions, medical
    support, burial, and entertainment. In the same way the ecological footprint is
    scattered in pieces around the world, so are Earth’s surviving wildlands on the
    land and in the sea. The pieces range in size from the major desert and forest
    wildernesses to pockets of restored habitats as small as a few hectares.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'But, you may ask, doesn''t a rising population and per-capita consumption doom
    the Half-Earth prospect or any other measure aimed at confining the Anthropocene?
    It does, but only if the human population continues growing as it has in the past,
    through the remainder of the twenty-first century and on into the twenty-second
    century. In this aspect of its biology, humanity appears to have won a throw of
    the demographic dice. Its population growth has begun to decelerate autonomously,
    without pressure one way or the other from law or custom. In every country where
    women have gained some degree of social and financial independence, their average
    fertility has dropped by a corresponding amount through individual personal choice.
    In Europe and among native-born Americans, it has already reached and continued
    to hold below the zero-growth threshold of 2.1 children per woman surviving to
    maturity. Given even a modest amount of personal freedom and an expectation of
    future security, women choose the option of what ecologists call K-selection,
    favoring a small number of healthy well-prepared offspring, as opposed to r-selection,
    hedging the bet with a larger number of poorly prepared offspring.


    There won''t be an immediate drop in the total population. An overshoot still
    exists due to the longevity of the more numerous per-mother offspring of earlier,
    more fertile generations. There also remain highfertility countries, with an average
    of more than three surviving children born to each woman, higher than the 2.1
    children per woman that yields zero population growth. They include Patagonia,
    the Middle East, Pakistan, and Afghanistan, plus all of sub-Saharan Africa exclusive
    of South Africa. The shift to lower fertility can happen during one or two generations.
    The United Nations biennial report on population in 2014 projected an 80 percent
    probability that by 2100 the world population, as it decelerates toward zero growth,
    will reach between 9.6 billion and 12.3 billion, up from the 7.2 billion existing
    in 2014. That is a heavy burden for an already overpopulated planet to bear, but
    unless women worldwide switch back from the negative population trend of fewer
    than 2.1 children per woman, a turn downward in the early twenty-second century
    is inevitable. Another way of looking at the population problem is that it will
    be solved as an unintended consequence of human nature, namely the flip from r-strategy
    reproduction to K-strategy reproduction in favorable environments.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'But then, what of per-capita consumption? Won''t it rise enough to break any
    resolve for large-scale conservation? It might if the components of the ecological
    footprints were to remain the same as today. But they will not stay the same.
    The footprint will evolve, not to claim more and space, as you might at first
    suppose, but less. The reason lies in the evolution of the free market system,
