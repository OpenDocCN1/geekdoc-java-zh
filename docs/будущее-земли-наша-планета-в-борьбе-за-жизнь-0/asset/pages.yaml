    a double helix of 1.08 million'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'DNA base pairs. During the process they modified the code sequence slightly,
    implanting a statement made by the late theoretical physicist Richard Feynman,
    “What I cannot create, I do not understand,” in order to detect daughters of the
    altered cells in future tests. Then they transplanted the altered DNA into a recipient
    cell from which the original DNA had been removed. The newly encoded cell fed
    and multiplied like a natural cell.


    The entity was given a seventeenth century Latinized name with an appropriately
    robotic surname, Mycoplasma mycoides JCVI-syn 1.0. Hamilton O. Smith, speaking
    for the research team, wrote that with this synthetic entity, and with the new
    tools and techniques designed to complete the project, “We now have the means
    to dissect the genetic instruction set of a bacterial cell and understand how
