  md: 'thirds of the nonpasser Pacific birds, however, close to one thousand species,
    were extinguished. Thus some 10 percent of the bird species on Earth were wiped
    out during a single episode of colonization by relatively small groups of people.


    Hawaii, universally acknowledged as the extinction capital of the world, had the
    most to lose when the Polynesian voyagers came ashore, and with the later help
    of Europeans and Asian colonists, they extinguished most of its native bird species.
    Gone are native eagle, a flightless ibis, a ground species the size of a turkey,
    and more than twenty species of drepanid honeycreepers, the smaller pollen feeders,
    many with brilliantly colored plumage and long curved bills that probe deeply
    into tube-petaled flowers. And many more—in excess of forty-five species—vanished
    the arrival of the Polynesians before A.D. 1000, and twenty-five following the
    entry of the first Europeans and Asians two centuries ago. Oddly, the feathery
    remains of some of the most extinct species are preserved in the cloaks of the
    old Hawaiian royalty.


    The Pacific archipelago was a killing field for two reasons. First, because of
    their relatively small size and the rapid reproduction of the colonists, they
    were soon overpopulated. In some remote islands the predation continues on a reduced
    scale. In 2011, on the big island of Espiritu Santo, Vanuatu, I saw hunters armed
    with powerful slings carrying a native Pacific imperial pigeon (Ducula pacifica),
    resplendent in red-knobbed beak, white body, and black wings, on its way to a
    restaurant in Lugaville.


    The second reason for the mass extinction was that the island birds were afraid
    of the two-legged colonists, having never been exposed to comparable predators
    during their evolution. (Snakes, mongooses, and tigers, being poor oceanic travelers,
    never made it the Pacific.) Many of the bird species also became flightless or
    close to it, a common trait of land birds on small, remote islands. Hence they
    exemplified a basic rule of extinction biology: the first to fall are the slow,
    the dumb, and the tasty.


    The dodo of Mauritius, an oversized, flightless descendant of a pigeon, illustrates
    the same principle for islands in the Indian Ocean. The first Dutch sailors to
    land on Mauritius, in 1598, found a bird that was just short of being served to
    them on a dinner platter—fat, earthbound, and fearless. The last recorded time
    a living dodo waddled within sight of a human being'
