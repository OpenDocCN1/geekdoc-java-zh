    of, say, physiology and biochemistry in the early twentieth century, before the
    revolutions of molecular genetics and cell biology.


    What does knowledge of nature works tell us about conservation and the Anthropocene?
    This much is clear. To save biodiversity, it is necessary to obey the precautionary
    principle in the treatment of Earth’s natural ecosystems, and to do so strictly
    until we, scientists and the public alike, know much more about them. Proceed
    carefully—study, discuss, plan. Give the rest of Earth’s life a chance. Avoid
    nostrums and careless talk about quick fixes, especially those that threaten to
    harm the natural world beyond return.'
