    in Cecropia obtuse, a broad-leafed tree in the rain forest of South America. As
    many as eight thousand workers line side by side on the lower margins of a single
    Cecropia leaf. They wait, with their mandibles held open, ready for immediate
    action. When insect lands on the leaf, the ambush rushes it from all sides, and,
