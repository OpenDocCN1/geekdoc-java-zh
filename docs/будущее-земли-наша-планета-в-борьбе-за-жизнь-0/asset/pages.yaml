  md: '# 13

    THE WHOLLY DIFFERENT AQUEOUS WORLD


    EArrth is invested with two different living worlds, two radically different arrays
    of ecosystems. The basic hierarchies of biodiversity are the same, from ecosystems
    to species to genes, and they face the same threat of obliteration. But all the
    rest is different.


    To explain I I propose to take you on a brief journey. Come with me to the edge
    of the sea. Look out to an environment so removed from the land and sky as to
    seem on another planet. If you were to submerge yourself into it physically without
    a life-support system, you would die in less than ten minutes. There are vast
    areas on the bottom that have, in fact, never been visited by humans, much less
    closely viewed.


    Most of the marine world has hitherto lived outside the events of the Anthropocene,
    but that is changing rapidly in the early years of the twentyfirst century. Humans
    have assaulted the farthest and deepest ocean waters, especially wherever food
    and other resources can be profitably extracted. Our ecological footprint is growing:
    the waters are warming and acidifying; coral reefs are fading to oblivion and
    in some places are being'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Let''s start at the beach. Stand, if you will, on the wet sand of the surf
    zone at low tide, letting longer waves work around and starting to accumulate
    on it top. Now biology. The surf may may at first seem lifeless, composed of water
    and soil washed clean. The opposite is true. It is home to a legion of invertebrate
    animals unique to this habitat. They range in size from bullet burrowing shrimp
    (“sand fleas”) to the size of a thumb down to the vast majority, which are barely
    visible if at all to the naked eye.


    The strangeness of the meioofauna, as it is called (the Greek word "less”), especially
    given the simplicity of its habitat, is not just in the species it contains but
    in the many higher taxonomic categories represented by the species. If on the
    land you walk up to the edge of a forest and census its biodiversity carefully,
    you will likely find representatives of the following seven phyla: Chordata (birds,
    mammals, amphibians), Arthropoda (insects, spiders, mites, millipedes, centipedes,
    crustaceans), Mollusca (snails, slugs), Annelida (earthworms), Nematoda (roundworms),
    Tardigrade (bear animalcules), and Rotifera (rotifers). Among the grains of sand
    in the surf zone you will find twice this number of phyla (causing you perhaps
    to start murmuring over and again, “Lord God”), including enteroprocts, gastotrichs,
    gnathostomulus, kinorhynchus, nematodes, nemertes, priapsids, sipunculans, and
    tardigrade. These teen among the more familiar mollusks, polychaete worms, rotifers,
    and crustaceans. A common body form of meiounal animals is wormlike, allowing
    them to move quickly through the tightly packed grains of sand. They slipper to
    feed, slither to avoid being eaten, slither to mate and reproduce.


    Research on the meiofauna and its place in the shoreline ecosystems of the world
    is in an early stage. The multiple ways its species interact still'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'largely studied. Yet these strange denizens of one of Earth''s most physically
    dynamic ecosystems are important parts of the biosphere. And there are more of
    them than you might imagine. Although the meiofauna may live within a strip of
    habitat only a kilometer wide, the total length of Earth''s shoreline is 573,000
    kilometers, almost exactly the distance from Earth to the moon. If the meiofauna
    realm is taken to be this length and the average width guessed to be a kilometer,
    its total area would be about that of Germany.


    Let''s pass on the already familiar offshore reefs, often called by the rain forests
    of the sea for their immense structural complexity and biodiversity, and travel
    out above open water, then drop down to skim the surface. Here you will find pleuston,
    an entirely different habitat, unfamiliar to many marine biologists. Where air
    touches the sea are organisms specialized to live on or just beneath the layer
    formed by surface tension. Although sparsely distributed, they are everywhere
    in all of the oceans. They live on floating islands mostly of animal origin, which
    range in size from the corpses of fish and seabirds down to fragments of algae
    and mucus too small to be seen with the naked eye. Each fragment is home to a
    community of living organisms. The inhabitants always include bacteria of multiple
    species and probably also archaea, which resemble bacteria but are far newly arrived
    on a conventional oceanic island, they flourish and multiply until they have used
    up all of the available nutrients.


    All across the oceans and inland seas, bacteria and archaea ride the surface detritus
    also float and swim in the waters below. Those freely obtain material and energy
    from photosynthesis. The overall result is this: no matter how crystalline-clear
    the water appears, it teems with life.


    Because I am an entomologist by specialty, I take a special interest in marine
    insects. Because their millions of species and the roiling biomass they compose
    dominate life on the land, it is of considerable interest to know how many inhabit
    the marine environments. The answer is virtually none, and therein lies an absorbing
    scientific mystery. In my own research of islands, I''ve discovered caterpillars
    living in the submerged prop roots of red mangroves, the most seaward and globally
    widespread among the mangrove species. But this near-terrestrial habitat is a
    very far distance from the coral garden and blue water farther out. There are
    no insects in that world except except on the surface, and these off odd voyagers
    are'
  merge: -1
