  md: 'area. Just as islands are fragments of land surrounded by water, so are streams,
    rivers, ponds, and lakes aquatic islands surrounded by land. Freshwater species
    of all kinds are at high risk of extinction because on every continent except
    Antarctica, humans are both short of clean freshwater and in direct competition
    for that water with the faunas and floras living in it.


    The agent causing the most immediate damage to species in fresh water are dams,
    great boosters of local economies but unfortunately chinese demons of aquatic
    habitat destruction. Their malign effects include the barricades they create against
    migrating fish species, the stilling and deepening of water upstream, and pollution,
    all exacerbated by the usual intensive agricultural conversion that builds up
    dams. Most at risk are salmon, sturgeon, and other fish that travel upstream to
    breed. One species I personally care about because of my own geographic origin
    is the Alabama sturgeon. It is so rare that it is caught only once every few years.
    Occasionally it is considered to be most extinct. Then another is found, amid
    wide publicity, and the species returns for a while to the category of "critically
    endangered."


    For centuries the baiji, the native dolphin of the Yangtze River, was cherished
    by the Chinese river people. By 2006, as the Three Dams nearing completion, the
    baijis could no longer be found. Similar examples abound on other continents.
    Among the most famous is in Africa. In 2000 a hydropower plant in Tanzania’s Udumwa
    Mountains cut off 90 percent of the water pouring into Kihansi Gorge, driving
    the tiny, golden-hued Kihansi spray to extinction in the wild. It survives only
    in a few specially designed aquariums in the United States. The plight of the
    little animal should by itself serve as a wake-up call to us for many extinctions
    imminent or in progress around the world.


    Few are aware of the damage done to the wildlife by their own dams. The greatest
