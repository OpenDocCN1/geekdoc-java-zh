    所有这些门类的分类数量，接着是目、科、属——最后是物种。从门到属的数量相对稳定，随着投入这些领域的时间越来越多，每一个层级的数据都顺着一条平滑弯曲的曲线上升。如果将这些曲线的形状延伸到物种，预计地球上存在的动物界物种数量将稳定在一个相当合理的
    770 万种。真核生物界（包括植物、动物、藻类、真菌和许多真核微生物，即具有线粒体和其他细胞器的生物）的总数约为 870 万，正负一百万左右。


    然而，达尔霍斯统计法（Dalhous method）可能会低估目标。由于生物学家完全理解的原因，许多物种仍未被发现。这些生物学家已经了解到，难以发现的物种往往稀少且孤立在局小、偏远栖息地的狭窄生态位中，因此其数量可能比公开数据集所示的多得多。


    无论科学家对生物多样性普查的结论定在哪里，考虑到已发现的、具有拉丁化双名且统计到目前的两十万种物种，总数将惊人地高得多。完全有可能，专家们在物种水平上仅发现了地球多样性的
    20% 或更少。致力于生物多样性的科学家正在进行一场竞赛，试图在每个种群中找到尽可能多的生存物种——从哺乳动物和鸟类，到缓幼、海鞘动物、地衣、织叶叶蛛、蚂蚁和线虫——在它们消失之前，以免它们不仅被忽视，而且永远不再不为人知。


    大多数人并不知道这项发现和保护地球上所有生命的、尚未完成的科学任务甚至存在。他们习惯了媒体的报道，这些报道用“在墨西哥发现三种新种蛙”和“在喜马拉雅发现的鸟类由两个物种组成”之类的标题淡化了这一主题。读者被引向相信，对生命世界的探索已几乎完成，新物种的发现是一个重大事件。在我职业生涯的大部分在哈佛大学比较动物学博物馆担任昆虫馆员期间，我可以证明那种形象是多么具有误导性且令人愚钝。事实是，新物种不断涌入世界各地的博物馆和实验室。在大多数生物群中，新奇标本堆积如山。这些标本通常要等待几年甚至几十年，世界各地人手极其匮乏的博物馆馆员才能处理它们。它们研究可能带给我们的生物学知识可能会被无限推迟。


    如果目前的性描述和分析速度持续，正如我和其他人经常指出的那样，我们直到 23 世纪中叶才能完成全球生物多样性普查——即其剩余部分。此外，如果对地球动植物的保护缺乏更专业的测绘和保护，到本世纪末，某种程度的生物多样性将大幅减少。人类在全球生物多样性科学研究与无数未知物种灭绝之间的竞赛中正失去比赛。


    我可以用我经验中的一个例子很好地说明分类过载的问题。我关于蚂蚁的一部分研究是分类工作，在生物多样性的任何领域，分类都是进行生态学和演化工作绝对绝对的序曲。多年来，我描述了大约
    450 种新蚂蚁。其中，354 种属于大头蚁（*Pheidole*）单属。（提醒一下，属是一类相似的物种群，它们都演化自同一个祖先物种。例如，人属 *Homo*
    是我们的属，祖先物种包括智人 *sapiens* 和我们的直接祖先物种——能人 *Homo habilis*，然后是直人 *Homo erectus*。）


    大头蚁属的名字在希腊语中意为“节俭者”，是所有已知 1.4 万种蚂蚁中体最大、最多样化的属。我发现并命名的物种之一是梯大头蚁（*Pheidole scalaris*），其中
    *scalaris* 意为“梯子”，指士兵级头部独特的梯状纹路。另一个是矛大头蚁（*Pheidole hasticeps*）——因为士兵头的形状像矛头；第三种是翅大头蚁（*Pheidole
    tachygalia*）——“属于 tachigalia”，指的是蚂蚁筑巢的树（*Tachigalia*）。阿洛大头蚁（*Pheidole aloyai*）是为了纪念
    D. P. Aloya 博士，这位古巴的昆虫学家在野外采集了第一批标本。在我和早期的分类学家这样命名了数百种大头蚁后，我已经没有足够的希腊语和拉丁语单词来描述额外的新物种了。使用像
    Aloya 这样的采集者名字以及标本发现地的名称很有帮助。然后我想到了另一种种减轻困难的方法。我请求国际保护组织（Conservation International）主席
    Peter Seligmann 推荐 CI 董事会的八位成员，他们因在全球保护方面的私人努力而做出了卓越贡献。被选中的其中一位是我的董事成员兼朋友，现在有了自己的私人蚂蚁：哈里森德大头蚁（*Pheidole
    harrisonford*）。还有西里格曼大头蚁（*Pheidole seligmanni*）。


    无论是业余还是专业的科学自然主义，对他们研究的物种熟悉程度几乎就像对待其他人一样。我在阿拉拉巴马大学读本科期间的导师之一，鳞翅学家莱夫·L·切莫克（Ralph
    L. Chermock）曾对学生们说，真正的自然学家知道数千种生物的名字。我从未接近过那个水平，我怀疑 Chermock 也从未达到过。也许一个记忆大师可以通过插图和博物馆标本完成这一壮举，但仅凭这些知识他将几乎没有感觉或实质。然而，Chermock
    和我可以做些更好的。在我们各自充分研究过的数百种物种中，我们不仅知道名字，还知道它们所属的高级分类单元，从门到目再到科。我们还知道许多对我们特别感兴趣的属。我们我们可以在较高的分类水平上识别在我们面前的数千种物种。除了最专注的记忆大师外，我们比任何人都做得好。

