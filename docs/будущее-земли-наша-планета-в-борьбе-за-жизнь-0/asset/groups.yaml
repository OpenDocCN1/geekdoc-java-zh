    世界。保护运动诞生于19世纪和20世纪初的美国，虽然来得晚了，但幸好还不至于晚到无法拯救我们剩余的动植物。该运动始于1872年世界上第一个国家公园——黄石公园的建立，并深受亨利·大卫·梭罗、约翰·穆尔等其他自然主义者和活动家著作的启发，最终形成了令人印象深刻的联邦、州和地方公园网络。这些公园还得到了非政府组织（最著名的如自然保护会）所设立的私人保护区的补充。自然是荒野的，自然是古老的，自然是纯洁的，这种典型的美国信条宣称，除了减轻人类干扰的腐蚀作用外，自然不应受到管理。作家华莱·斯格纳在1983年写道，美国的国家公园是“我们曾过的最好的主意”。


    为了保护本身而保护的理念已传全球，到21世纪初，世界上196个主权国家中绝大多数拥有自然国家公园或某种政府保护保护区。因此，这一理念是成功的——但仅在数量和质量上如此。极度濒危的湿地——其物种数量是美国和欧洲保护区的十倍——仅在热带美洲、印度尼西亚、菲律宾、马达加斯加和赤道非洲的大部分地区维持。根据脊椎动物（哺乳动物、鸟类、爬行动物、蛙类和其他两栖动物，鱼类）的数据估计，全球所有栖息地的物种灭绝率已达到人类前基线的千倍，且正在加速。


    新人类世意识形态关注。支持者本质上认为，拯救地球生物多样性的传统努力已经失败。原始自然已不存在，真正的荒野仅作为想象的产物存在。那些通过人类世爱好者的视角观察世界的人，其世界观与传统的保护主义者完全不同。他们中的极端分子认为，剩余的自然应该被视为一种商品，以证明拯救它的合理性。幸存的生物多样性应更多取决于其对人类的价值。让历史按照其似乎早已注定的轨迹发展。最重要的是，要承认地球的命运是人类化的。对于认同这一大部分或全部愿景的人来说，人类世本质上是一件好事。自然残存的部分并不糟糕，但底线仍然是，即使是野生动物也必须像其他人一样赚取生计。


    这种被某些支持者称为“新保护”的意识形态导致了各种实践建议。首要是，自然公园和其他保护区的管理方式应该有助于满足人类的需求。而且并不是我们现在现在及不久的未来中的所有人，我们的当代审美和个人价值观将是决定性的——因此是永远的。遵循人类世准则的领导者将自然带过不可恢复的边缘，无论未来的无数后代是否喜欢。幸存的野生动植物将与人类建立一种新的友谊。在过去，人们以访问客身份进入自然生态系统；而在人类世时代，构成混杂生态系统片段的物种预计将生活在我们周围。


    领先的人类世爱好者似乎担心如果他们的信念得到实现，将产生什么后果。他们对事实的缺乏和对恐惧的缺乏一样。正如社会观察者和保护主义者厄尔（Erle）写道：


    经济增长和消费文化将仍然是领先的社会模型（许多人类世推动者认为这是理想的，而少数人对此持矛盾态度）；我们现在生活在一个被驯化的星球上，荒野已永久消失；我们可以放下生态忧虑和末日论，对人类化星球上的前景抱有更积极的态度；技术，包括风险性的、集中的和工业规模系统，应该被视为我们的命运甚至是救赎。


    马里兰大学的环境科学家厄尔·埃利斯（Erle Ellis）发表了一份激进的信条，帮助环保主义者为新秩序做准备：“停止尝试拯救地球。自然已经消失了。你生活在一个用过的星球上。如果这困扰了你，那就接受它。我们现在生活在人类世——这是一个地质时代，地球的大气、岩石层和生物圈主要由人类力量塑造。”


    是什么激情驱动着人类的巨兽？它体现在我们日常生活的普通体验以及语言中不容质疑的习语中。克里斯（Crist）继续他的分析：


    接管（或同化）通过生物清洗和贫化进行：耗尽并毒化土壤；使万物变得可杀；让在 във面前覆盖或逃避的动物心中产生对上帝的恐惧；将“渔场”重新命名，动物为“牲畜”，树木重新命名为“木材”，河流重新命名为“淡水”，山脉重新命名为“覆盖物”，海滨重新命名为“海景房”，以便将转化、灭绝和商品化的“冒险”合法化。


    当然，人类世爱好者并不完全缺乏如何在新秩序中保护生物多样性的想法。英国约克大学的保护生物学家克里斯·D·托马斯（Chris D. Thomas）成功地避开了大量发表的相反证据，指出当地本土物种的持续灭绝将由世界各地人类正在传播的外来物种所平衡。这位专家向我们保证，这些物种将帮助填补生物多样性自然较低或被人类活动贫瘠化的生态系统的空白。外来物种与幸存的本土物种之间的杂交将进一步增加品种和物种的数量。我们必须记住，他提醒说，过去地质时代的大规模灭绝之后紧随着着新物种的激增。当然，这个过程持续了数百万年。后代将发现生物多样性的演化恢复需要五百万年或更长的时间，这比演化出现代人类种所需的时间长几倍，这似乎并不重要。大量的外来物种变成入侵种，每年给世界造成数十亿美元的损失，也不是主要障碍。


    如果地球生命遗产的保护首先取决于任其自然发展，那么谁能有不同的想法？一位持有不同意见的观点是彼得·M·卡里瓦（Peter M. Kareiva），他是“新保护”理念的领军人物。他在2014成为自然保护会的首席科学家。在公共演讲和为大众媒体写作时，他是攻击荒野本质的领导者。在他看来，地球上没有原始地区了。因此，早已被占据的地区应该开放给人类进行更理智的管理。卡里瓦倾向于“工作景观”，以便被经济学家和商业领袖接受。


    但对荒野的攻击基于一个词源学错误。在《荒野法》中从未出现过“原始”这样的词。无疑，卡里瓦和其他人也意识到，“荒野”一词指的是尚未被人类束缚的地方。在保护科学术语中，“荒野”是指在没有人类干预的情况下自然过程发生的大区域，在那里生命保持“自主”。荒野通常包含了稀疏的人口，而没有失去其本质。正如我很快将记录的，荒野是真实的实体。


    其他人类世乐观者认为可以复活，只要我们能获得足够的组织来绘制基因代码并克隆整个生物。这种过程被称为“灭绝延续”，受青睐的例子包括旅鸽、猛象和澳大利亚的袋狼。


    印度巴德拉纳的生物技术教授苏布拉特·库马尔（Subrat Kumar）在《自然》杂志上写道，他不仅相信灭绝延续，还敦促一项新的大规模计划为此做好准备。对于那些担心曾经灭绝的物种可能会扩散得像僵尸一样穿过森林的人，库马尔提供了一个令人放心的补充：“我们带回的任何物种如果产生问题，都可以通过工程手段消除。”


    与此同时，在流行文学领域，记者兼作家艾玛·马里斯（Emma Maris）描绘了一个快乐的画面：在新的智能星球各处，为了人类利益而保留的半野生物种。在她看来，我们应该立即放弃不受限制的荒野的想法，这是一种在美国产生并推行的“崇拜”，一直潜伏在保护组织的使命宣言中，并不幸地渗透了自然写作和自然纪录片。马里斯警告说，这种谬误的想法必须得到遏制。我们作为星球统治者的真正角色是将生物多样性变成一个由我们照料的全球性的、半野生的狂野花园。


    我的印象是，那些对草地和这些土地仍庇护的巨大生物多样性最漠不在乎且容易忽视的人，往往是经验最少的人。我认为在这里引用伟大的自然主义者亚历山大·冯·洪堡（Alexander
    von Humboldt）的话是相关的，无论在他的时代还是我们的时代：“最危险的世界观是那些没有观察过世界的世界观。”

