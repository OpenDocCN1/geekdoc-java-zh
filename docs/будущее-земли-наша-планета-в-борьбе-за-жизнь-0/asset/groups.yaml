    THE GUIANA SHIELD. The small countries of Guyana and Suriname, with neighboring
    French Guiana, are still 70 to 90 percent covered by pristine Amazon-related but
    distinctive rain forests. Their faunas and floras are exceptionally rich and remain
    among the least explored in the world.


    TEPUIS. These tabletop mountains are the imagined "lost worlds" of H. G. Wells
    and Hollywood. Limited to Venezuela and western Guyana, they are composed of blocks
    of ancient quartz arenite sandstone thrust surrounding rain forest. Their more
    or less flat tops range in elevation from one thousand to three thousand meters.
    They are indeed worlds unto themselves, with weather radically different from
    that at lower elevations, spectacular rock formations and waterfalls (Angel Falls
    is the highest in the world), and floras and faunas different from the lowlands
    below and from one tepui to the next.


    GREATER MANÚ REGION OF PERU. Adrian Forsyth, a leading tropical biologist, has
    captured the magic of this region, "where the largest equatorial ice mass in the
    world, crowned by mighty Ausangate, towers above the rocky slopes and puna grasslands
    that turn into unroaded rain forests with the landscape ranging down through montane
    forest. It makes a compressed panorama visible in a single glance by anyone standing
    in the Amazonian woodlands of Madre de Dios." North of the river exists the most
    concentrated biodiversity on Earth, including a full array of New World mammals.
    A simple square kilometer can harbor the same number of species of frogs found
    in the entire continental States, and twice the number of birds and butterflies.
    The same distinction or better applies to the rain forests of Ecuador''s legendary
    Yasuni National Park, located still further to the north.


    CLOUD AND SUMMIT FORESTS OF CENTRAL AMERICA AND THE NORTHERN ANDES. These cool,
    rain-soaked environments are distinct in both climate and biodiversity from the
    lowland forests below. Many are poorly explored, and contain large numbers of
    still-unknown species. The finding of the olinguito, the first sizable carnivorous
    mammal discovered in a century, is emblematic of what remains hidden.


    PÁRAMOS. These high-elevation (2,800 to 4,700 meters) grasslands of South America
    contain many unique grasses, herbs, and woody bushes. They also stand out in their
    high rate of evolution of new species—possibly due to fluctuations of climate
    in the fragmented mountaintop environment. Even though each is only kilometers
    above the lowland rain forests that'
  - '[PAGE 121]


    surround, they are physically and biologically a different world. Their floras
    are unique, and their small areas make their biodiversity vulnerable.


    ATLANTIC FORESTS OF SOUTH AMERICA. Called the Mata Atlântica in Portuguese, this
    vast and magnificent but now significantly reduced ecological system extends along
    the Brazilian Atlantic coast from Rio Grande Norte in the north to Rio Grande
    do Sul state in the south, with small extensions to Paraguay and Argentina (in
    other words, from the tip of Brazil’s “nose” to southeastern Paraguay). Its latitude
    and wide variation in rainfall give it an exceptional variation in ecosystems,
    which range from tropical to subtropical forests, both moist and dry, as well
    as scrub forests and grasslands. Within their domains occur a wide variety of
    rare and unusual animals, including, as described by Mark Moffett, “the most primitive
    porcupine; dancing frog and fruit-eating frog; curassow, the few remaining specimens
    of whom roam the private properties of two bird lowers; the largest New World
    primate, the muriki; the most colorful of all primates, the golden lion tamarin;
    the golden lancehead viper of Queimada Island, where it reaches the highest density
    known for any snake (not surprisingly, no person lives on ‘snake island”.


    THE CERADO. Covering a large part of east-central Brazil, the Cerrado is the largest
    savanna in South America and the most biodiversity-rich of any tropical habitat
    in the world. Its luxurious variety of life derives from the sharply defined mosaic
    of ecosystems it comprises, from classic open grassland with scattered woodland
    copses to patches of tall, rain-forest-like trees, with thick gallery forests
    that line its rivers. Unfortunately for biodiversity, its soil favors agriculture,
    and the Cerrado habitat is being rapidly cleared with as yet very little protection
    in reserves.


    THE PANTANAL. One of Earth’s largest wetlands, mostly in southern Brazil extending
    into Bolivia, this magnificent floodplain is 80 percent underwater in the rainy
    season and is the year-round home to an immense variety of waterfowl and insect
    life, as well as jaguars, capyaras, and other charismatic large mammals, including
    abundant crocodile-like caimans. Although designated as a World Heritage Site
    and increasingly popular with tourists, the Pantanal still supports a heavy burden
    of agriculture and cattle ranching.


    THE GALÁAGOS. This equatorial archipelago 926 kilometers west of the Ecuadorian
    mainland has acquired iconic status because of Charles'
  - '[PAGE 122]


    Darwin’s five-week visit there in 1835. Homeward bound, he noticed that mockingbirds
    differ from one island to the next, causing him to conceive of evolution. But
    the Galápagos are special for another reason: from just a few species able to
    cross the ocean and colonize the islands have evolved many species that are specially
    adapted to the barren volcanic landscape. Giant tortoises, marine iguanas, herbs
    of the sunflower family that transmitted into trees, fences from a single ancestor
    to fill a half-dozen bird niches, and more, make the islands both a laboratory
    and classroom of evolutionary biology.


    # # Europe


    BIAŁOWIEZA FOREST, POLAND AND BELARUS. This is the largest remaining fragment
    of the primeval forest that once covered the flats of northwestern Europe to the
    dawn of the Neolithic period. Straddling the border between Poland and Belarus,
    the protected land covers almost two thousand square kilometers. A large fraction
    of the mammals of Europe live within its confines, including most notably the
    European bison (which more than once has narrowly escaped extinction), roe deer,
    elk, wild boar (a Polish forest horse), lynx, wolf, otter, and ermine. The nine
    hundred vascular plant species present include some of the largest ever recorded.


    LAKE BAIKAL, RUSSIAN SIBERIA. With an area of 31,722 square kilometers and maximum
    depth of 1,642 meters, Lake Baikal is the oldest and deepest freshwater lake in
    the world. As expected from its volume, it also harbors a remarkably large fauna
    and flora for an isolated body in the high latitudes. From its approximately twenty-five
    hundred species of plants and animals, two-thirds are nowhere else. Certain groups
    are represented by large numbers of species, including sculptins (fishes of the
    family Cottidae), sponges, snails, and amphipod crustaceans. Like the Galáp Islands,
    Lake Baikal is both a sanctuary of biodiversity, in this case the most found in
    any freshwater lake, and a laboratory of evolution.


    # # Africa and Madagascar'
  - '[PAGE 123]


    THE CHRISTIAN ORTHODOX CHURCH FORESTS, ETHIOPIA. Less than 5 percent of the native
    forests of northern Ethiopia remain, and they are virtually all limited to properties
    of the Church—conspicuously from the air as green patches sprinkled across the
    brown landscape of subsistence agriculture. They contain, as Margaret Lowman has
    written, "the seed bank of native plants, pollinators for many gardens crops,
    freshwater springs, medicines from plants, paints from fruits and seeds for the
    church murals, water conservation from roots, spiritual sanctuary as the church
    centerpiece, carbon storage, and home to the last remaining genetic library of
    native species.


    SOCOTRA. An isolated island (with small satellites) located in the Indian Ocean
    352 kilometers south of Yemen, Socotra is populated by trees and shrubs in strange
    shape and foliage as to earn it the titles “another Galápagos” and "most alien-looking
    place on Earth." Here you will find the dragon’s tree, the wall-dwelling Socotran
    fi, toothed aloes, and other plant species that compare in general form with vegetation
    elsewhere. Socotra also has about two hundred bird species, of which eight are
    unique to the archipelago.


    THE SERENGETI GRASSLAND ECOSYSTEM. Arguably the most famous terrestrial wildland
    ecosystem in the world is the great Serengeti (which means, in the Maasai language,"endless
    plains"), spanning a vast area from northern Tanzania to southwestern Kenya. A
    substantial portion of its area, as well as that of Kenya, is protected by national
    parks, conservation areas, and game reserves. The faunas and floras, including
    especially the large mammals, are the closest we have to the originals that have
    populated the African tropical grasslands and savannas since Pleistocene times.


    GORONGOSA NATIONAL PARK, MOZAMBIQUE. The country’s premier reserve has a full
    representation of southeastern African biodiversity by the multifarious habitats
    found within it, including a mountain ridge rising to almost two thousand meters
    and topped by rain forest, miombo dry forest, multiple rivers and streams, and
    gorges covered in rain forest and flanked by limestone cliffs, the latter riddled
    with still mostly unexplored caves. Gorongosa’s megafauna is rapidly regenerating
    after being driven to near extinction during the civil war of 1978–1992 followed
    by widespread poaching.


    SOUTH AFRICA. The country as a whole contains within its borders of the world’s
    several abundant and distinctive assemblages of both'
- md: '

    animals and plants. Huge Kruger National Park in the northeast and other reserves
    are home to the most complete array of ten-kilogram-plus wildlife in Africa (including
    black and white rhinoceroses, both critically endangered). The Cape Floristic
    Region harbors nine thousand species, 69 percent found nowhere else, and one-fifth
    of all the plant species of Africa. Within the region flores form several unique
    major habitats, including the fenbos heath, the succulent Karoo desert (shared
    with Namibia), and the archaic cycad forest of Limpopo Province.


    ## FORESTS OF THE CONGO BASIN. The basin of the Congo River, its 3.4 million square
    kilometers spanning the Republic of the Congo, the Democratic Republic of the
    Congo, the Central African Republic, and parts of Cameroon, Gabon, Angola, Zambia,
    and Tanzania, is the second largest drainage system in the world, exceeded only
    by the Amazon. It is invested by tropical rain forest, constituting one of the
    world''s three great rain forest wilderness (the other two are the Amazon and
    New Guinea). Although under heavy siege from logging and conversion to agriculture,
    it remains home to more than three thousand unique plants and an immense fauna,
    including gorillas, okapi, forest elephants, and other famously spectacular species
    of large animals. Five of the rain parks of the Congo are United Nations World
    Heritage sites.


    ## THE ATEA FOREST, GHANA. Many of the moist forests of Africa''s western hump
    have been reduced drastically by human encroachment, but fragments still survive
    as islands that preserve parts of the once exceptionally rich flora and forest.
    A splendid example is the pristine Atewa Forest, at least a half million years
    old, a remnant of the rain forest that has elsewhere been 80 percent removed.
    Atewa is the finest example of a variant of the biome called the Upland Evergreen
    Forest.


    ## MADAGASCAR. This huge island, the size of California and Arizona combined,
    located in the Indian Ocean four hundred kilometers off the coast of eastern Africa,
    has been isolated since it broke away 150 million years ago from the southern
    supercontinent of Gondwana. Very big, ancient, and tropical, Madagascar harbors
    a very large and unique fauna and flora, with 70 percent or more of its species
    found nowhere else. (The most recent figure for the fourteen thousand species.)
    Like Cuba, Hisola, and the Galápagos, Madagascar is a living laboratory for the
    observation of adaptive radiation, defined as the origin of a large array of species
    from a single species fortunate to colonize the island (in this case usually flying
    or floating over Africa. Examples of evolutionary radiation in Madagascar''s animals
    are the many, yet closely related, species of lemurs (primitive primates), chameleons,
    vangid shrikes, ranid frogs, and, among the twelve thousand species of plants,
    complexes of palms, orchids, baobabs, and cactus-like Didierereaceae.


    # Asia


    ## THE ALTAI MOUNTAINS. Towering 4,509 meters at maximum elevation, this beautiful
    and seldom-visited mountain range rises in Central Asia where Russia, China, Mongolia,
    and Kazakhstan meet. Covered at different elevations variously by steppes, northern
    coniferous forests, and high alpine vegetation, it contains a living encyclopedia
    of cold temperature and arctic mammals, and is one of the places in all of Eurasia
    that harbors a true Ice Age fauna. Herbivores resounding on its slopes include
    wapiti, moose, reindeer, Siberian musk deer, deer, and wild boar. Among their
    predators are brown bear, wolves, lynx, leopards, and wolverines. It is also the
    place where the first fossils of the Denisovan human species were found.


    ## BORNEO. The 18,307 islands of Indonesia (the estimated number varies according
    to criteria and technology) straddle 5,120 kilometers of latitude, from the western
    tip of Sumatra to Irian Jaya, the western half of New Guinea. Together, the archipelagos
    contain a staggering amount of biodiversity. The southern three-fourths of Borneo,
    the world''s third-largest island, is part of Indonesia, while the northern one-fourth
    belongs respectively to Malaysia and the independent monarchy of Brunei. The island
    as a whole has lost a substantial fraction of its rain forest due to settlement
    and conversion to oil palm plantations. The damage has been Science reported in
    2007: “Palm oil plantations are spreading as sales of the biofuel soar, invasive
    acacia trees are on a rampage, and wildfires ravaged the island each year.” Yet
    the interior of the great island, the “Heart of Borneo,” remains the leading single
    harbor of Asia’s tropical biodiversity.


    ## THE WESTERN GHATS OF INDIA. The subcontinent of India, like the great islands
    of Madagascar, New Caledonia, and New Zealand, is a fragment of Gondwana, differing
    primarily in drifting north all the way to meet and fuse with the mainland of
    Asia. The Western Ghats, a mountain range running parallel to the full length
    of the west coast, is the geological spine of India. Their range of elevation,
    from near sea level to 2,695 meters at the highest point, and their tropical location
    combine to create a variety of terrestrial habitats, and with them a high level
    of biodiversity. Native to the most rolling, forested hills are five thousand
    species of plants, of which seventeen hundred are endemic, and a major mammal
    fauna that includes the world''s largest population of wild Asian elephants and
    a tenth of Earth''s surviving tigers.


    ## BHUTAN. This idyllic mountain nation deserves for the preservation of much
    of its native habitats and biodiversity. Its faunas and floras remain an intact
    slice of those that originally characterized the bulk of the Himalayan mountains
    and foothills. In Bhutan, 70 percent of the land is covered by forest representing
    the three principal zones—tropical, temperate, and alpine. The five thousand species
    of plants include forty-six rhododendrons and six hundred orchids.


    ## MYANMAR. The northern reaches of this still-somited country harbor reserves,
    about thirty-one thousand kilometers in area, is still mostly invested in rain
    forest, wetlands, and upland grasslands. The hyperdiversity is enhanced by the
    complex array of mountain ranges, the tallest soaring to alpine zones above four
    seven hundred meters, which occur permanently ice-covered peaks.


    # Australia and Melanesia


    ## SCRUBLAND OF SOUTHERN AUSTRALIA. From Esperance on the southwestern coast to
    the edge of the Nullarbor Plain lies one of Earth''s richest flora. Possessing
    a mild Mediterranean-type climate, the scrublands have evolved much unique species.
    New Caledonia even harbors elements that were present before it departed the Australia-plus-Antarctica
    landmass.


    ## THE KIMBERLEY REGION OF NORTHERN AUSTRALIA. The national parks and other remote
    areas of this part of the continent are among its most biologically diverse and
    least disturbed.


    ## GIBBER PLAINS. The flat plains of Stony Desert, located within the center of
    the continent, hold water only in the form of floods. Abounding life emerges from
    dormancy at that time, drawing large flocks of waterbirds from far away. In between
    rains the land is bone-dry, with knee-high sclerophyllous vegetation.


    ## NEW GUINEA. The world’s second largest island (after Greenland), eight thousand
    square kilometers in area, is still mostly invested in rain forest, wetlands,
    and upland grasslands. Its terrestrial biodiversity is generally recognized as
    the richest and most explored in the world. New Guinea was an archipelago of smaller
    islands up five million years ago, adding a secondary factor to species formation.


    ## NEW CALEDonia. This remarkable island, subtropical and mountainous, has been
    isolated as a Gondwan fragment for eighty million years. It was first joined with
    New Zealand, then broke off to drift completely toward the equator. Today more
    than 80 percent of the native plant and animal species are found nowhere else,
    and many are markedly different from anything found elsewhere. New Caledonia even
    harbors the highest number of endemic families, including those with archaic features,
    most famously Antarctica, the most primitive flowering plant known on Earth. Along
    mountain ridges are still mingled forests of Araucaria and Podocarpus, providing
    an environment resembling that which prevailed over most of Earth during the Mesozoic
    Era. I conducted research on the island during 1954 when I was a graduate student,
    then often had dreams of it during sleep, until I returned fifty-seven years later.

