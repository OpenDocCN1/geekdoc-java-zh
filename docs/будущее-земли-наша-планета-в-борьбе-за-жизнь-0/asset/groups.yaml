    # 11


    # THE LORD GOD SPECIES


    It may seem to you that the study of biodiversity is conducted in a different
    culture from that of conventional biology. But there are parallels. The cell and
    brain are like ecosystems—the equivalent of rain forests, savannas, or coral reefs,
    or alpine meadows. The location and functions of their various parts must first
    be discovered and described, then related to create a picture of the whole. But
    research on organ systems takes place mostly in the confines of a laboratory.
    Even a square meter of table space may be enough to make a great scientific discovery.
    In contrast, research on biodiversity—call it biodiversity studies or scientific
    natural history or evolutionary biology—ranges widely over the entire surface
    of the planet.


    There exist two kinds of scientists. The first go into science in order to make
    a living. The second do the reverse: they find a way to make a living in order
    to go into science. Virtually all scientific naturalists of my acquaintance belong
    to the second group. They are among the hardestworking yet least competitive of
    all scientists. They are also among the lowest paid and least garlanded with honors,
    so there is little incentive to'
- md: '

    work except for the science. When naturalists meet, they seldom gossip about colleagues
    not present. Instead they gossip about discoveries, and breaking news. (“I hear
    Peter fell down a ravine in El Salvador. Do you know if he’s okay?”)


    With rare exceptions, nobody keeps a secret. The opposite. The ethos is to eavesdrop,
    you may catch fragments that sound something like: “Did you hear about crazy symbiotic
    katydid Barbara found in an oropendola nest? In Suriname, ‘I think.’ Or, Bob got
    to work on his lichens in the Altai, and the Russians gave him permission to camp
    at mid-elevation for six months. Boy, I’d be happy to get in there and collect
    bark beetles for just one week! That’s still virgin territory. At least for bark
    beetles.


    Here’s a real example.


    Ed Wilson to Ben Rains of the Mobile Press Register at the floodplain forest of
    the Mobile-Tensaw Delta in south Alabama, April 27, 2014: “I’ve heard there are
    jaguarundi in here. That would be a big addition to the mammal fauna. (Jaguarundis
    are species of rare, elusive wildcats to range naturally from the American tropics
    north and to Texas. An introduced population in Florida and on the central Gulf
    Coast is possible.)


    Raines: “Oh, yeah? Have you seen a photograph of one?”


    Wilson: “No. I suppose you’re going to tell me that nobody has a photograph or
    skin. But the rumor is at least intriguing.”


    Raines: “Well, I know for a fact that cougars are here, but you almost never see
    one. So maybe jaguarundis will show up someday, too. We can hope.”


    The reason, I believe, for the easy camaraderie is the virtually unlimited number
    of discoveries that the trained naturalist with even a little ambition, a discerning
    eye, and an endless supply of mosquito repellent. The reward in discoveries per
    week for hard work is extraordinarily high. It''s like getting a bite every time
    you drop a baited hook into a Louisiana catfish pond. Take three breaths and pull
    up almost all. Every field trip into a wildland or excursion through a museum
    collection yields a worthwhile discovery in scientific natural history. Provided,
    of course, we know the species you’re dealing with.


    Natural historians, like other scientists, have dreams of great discoveries, of
    phenomena unimaginable or at best elusive shadows under the precious moment. We
    have our holy grail also, the most familiar of which are the missing links of
    evolution—dinosaurs morphed into birds, for example, or lungfish into amphibians,
    or apes into humans.


    Equally exciting is the rediscovery of a species thought extinct. Which brings
    me to one of my favorite fantasies. I''m paddling a canoe through the back channels
    of another coastal floodplain forest, this one surrounding the Choctawhatchee
    River, which crosses the Florida Panhandle and flows into the Gulf of Mexico.
    I had an eerly familiar birdcall, peet-peet, the double strike of bill against
    hardwood. That, sounds like . . . but, no, it can’t be. But, yes, it can. Why
    not?


    In the dream of a pair of large woodpeckers swoop in and land noisily on a cypress
    trunk twenty feet straight ahead. Then another sharp double knock as one of the
    birds chisels out a beetle.


    Binoculars up. There are the black bodies and tails, flashing white primaries
    of the wings, bright red crest of the male. Ivory-bills! But, I, think, Impossible!
    Maybe I remembered the field guide. No, I have to believe my own eyes. The last
    verified sighting of an ivory-billed woodpecker I know was in the Singer Tract
    of Louisiana in 1944. In the fantasy I know that. I also remember that a sighting
    in the Big Woods swamp of Arkansas in 2004 was a mistake, the bird was a pileated
    woodpecker, a common look-alike of the ivory-bill. And I recall that later a team
    of birds reported signs of an ivory-bill population in the floodplain of Florida’s
    Choctawhatchee River, but that didn’t pan out, either. Has’t yet, anyway.


    Returning from the daydream to reality, I made a trip up the Choctawhatchee weirs
    several years after the team of birds who reported signs of ivory-bills. It was
    a thrill—even without ivory-bills. The Choctawhatchee is a classic river of the
    region: dense subtropical floodplain forest, inlets that lead nowhere, life teeming
    everywhere, turtles of several species called schooters and sliders slipping over
    fallen tree limbs and out of sight as you approach. Alligators, occasionally big
    ones, crashing into the water farther upriver.


    I nurtured the first hope I might see an ivory-bill myself. My companion and host
    MC Davis, a leading landowner and conservationist of the Gulf Coast who knew the
    region intimately, was entirely skeptical. He said, “Look, if I wanted to know
    about ivory-bills, I’d go up the river a ways, talk to some of the swamp rats
    who live along the river, and offer a pretty good reward for proof of an ivory-bill
    population, I don’t mean a dead bird, either.


    Anyway, one day I was having breakfast with a group of naturalists in MC Davis’s
    renovated barn, preparing for a day in the field, and the subject of possible
    ivory-bills in the nearby Choctawhatchee floodplain came. There was a general
    thumbs-down—nobody likes to appear gullible—when one of the group said he wanted
    to play a tape of a birdcall. We hear peet-peet, peet-peet. An experienced birder
    said quietly, “That’s an ivory-bill.” It might have been, but I’m a realist I
    suspect the tape had been made sixty years ago.

