    # # APPENDIX I


    There exist organizations and recent trends in large-scale land and marine conservation
    that lend credibility to the Half-Earth solution.

    The organization already in existence on which a sustainable Half-Earth system
    can logically be built is the World Heritage Foundation, inaugurated in 1972 and
    administered today by the United Nations Educational, Scientific and Cultural
    Organization (UNESCO). The rationale of the World Heritage Foundation is expressed
    in a United Nations Convention to protect "the world''s superb natural and scenic
    areas and historic sites for the present and future of the entire world citizenship.\nOf
    the 1,007 UN sites listed by 2014, 197 were natural and 31 mixed natural and cultural.
    Each qualifies in at least one criterion in one or the other ten categories, the
    last two of which are fully biological, and communities as follows:


    [The site] IX is an outstanding example representing significant on-going ecological
    and biological processes in the evolution and development of terrestrial, freshwater,
    coastal and marine ecosystems, communities of plants and animals.


    [The site] X contains the most important and significant habitats for in-situ
    conservation of biological diversity, including those threatened species of outstanding
    universal value from the point of view of science or conservation.


    The ambiguity of the first phrase, "from the point of view of science or conservation,"
    can and should be hardened and expanded to include all species of an ecosystem.
    As I''ve stressed, we don''t even know the majority of species on Earth enough
    to give them a scientific name, much less discover their place in nature or survival
    status. We can''t assess their role one by one in the future of ecosystems and
    human life. But we can move decisively with wholesale sweeps. Among those most
    recent and notable are the following:'
  - '[PAGE 189]


    +   Brazil''s minister of the environment signed the legal documents required
    to fund in perpetuity the Amazon Region Protected Areas program (ARPA), covering
    51.2 million hectares, the world''s largest network of protected tropical rainforest
    and three times the size of the U.S. National Park System.


    +   The London-based oil company SOCO International announced that it would abandon
    plans to explore for oil in the Virunga National Park, a World Heritage Site of
    the Democratic Republic of Congo. The park is home to a large amount of biodiversity
    that includes the critically endangered mountain gorilla, the largest primate
    in the world.


    +   Following a celebrity-led campaign in China, the consumption of fine-sin soup
    plummeted by as much as 70 percent. The Chinese fondness for this delicacy had
    been ravaging shark populations around the world.


    +   In the United States, as elsewhere, the building of dams has a devastating
    effect on freshwater diversity, being responsible for most of the recorded extinctions
    of native fish and mollusks. Many of the dams are now being torn down, with the
    annual rate of removal doubling during the first decade of this century.


    +   Governments can protect a great deal of the living environment with a single
    relatively small change in policy. In 2012 USAID announced its first-ever Biodiversity
    Policy, designed to protect native ecosystems and species through "strategic actions
    to conserve the world''s most important biodiversity, such as stamping out global
    wildlife trafficking; and a new focus on integrating biodiversity and other development
    sectors for improved outcomes." This broadening of goals, as I know from personal
    experience in the field, will offer serious assistance for conservation to the
    developing nations that need it.


    +   The World Parks Congress conceived of a plan with major potential impact on
    open-water marine ecosystems. The proposal suggests the creation of large marine
    protected areas (MPAs) over 20 to 30 percent of the world''s seas in which fishing
    is forbidden. Because fish and other life of open marine areas disperse constantly,
    the restored productivity of the MPAs would be shared with adjacent fishing grounds.
    The average increase in yield in the latter, it was estimated, would yield a million
    additional jobs, and cost less to monitor and protect than government subsidies
    provided to increase yield in the entire, largely unprotected open-water system.'
