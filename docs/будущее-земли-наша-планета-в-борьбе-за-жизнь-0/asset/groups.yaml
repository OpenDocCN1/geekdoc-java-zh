    # 19


    ## HALF-EARTH: HOW TO SAVE THE BIOSPHERE


    At the end of the day, the central question of biodiversity conservation is how
    many of the surviving wildlands and the species within them will be lost before
    the extinction rate is returned to the prehuman level. The prehuman rate is now
    put at ten species extinct per million species each year. In terms of a human
    life span that primordial rate is infinitesimal, essentially zero in conservation
    thinking. (Keep in mind also that as many as six million contemporary species
    remain undiscovered by scientists.) Yet it also means that the current rate of
    extinction of the well-known species is up by a multiple of close to one thousand
    and accelerating—despite the heroic best efforts of the global conservation movement.


    Unstched hemorrhaging has only one end in all biological systems: death for an
    organism, extinction for a species. Researchers who study the trajectory of biodiversity
    loss are alarmed that within the century an exponentially rising extinction rate
    might easily wipe out most of the species still surviving at the present time.


    The crucial factor in the life and death of species is the amount of suitable
    habitat left to them. The relation between habitat area and number of species
    has been calculated and refined many times and cited often in scientific and popular
    literature. It is that a change in area of a habitat, up or down, results in a
    change in the sustainable number of species by the third to fifth root, most commonly
    close to the fourth root. In this case, for example, 90 percent of the area is
    removed, the number that can persist sustainably will descend to a half. Such
    is the actual condition of many of the species-rich localities around the world,
    including Madagascar, the Mediterranean perimeter, parts of continental southwestern
    Asia, Polynesia, and many of the islands of the Philippines and the West Indies.
    If 10 percent of the remaining natural habitat were then removed—a team of lumbermen
    might die in a month—most or all of the surviving resident species would disappear.


    If, on the other hand, with the relation of sustainable species to the area of
    their habitat at the fourth root (the approximate median value), the fraction
    protected in one-half the global surface is about 85 percent. That fraction can
    be increased by including within the one-half Earth “hot spots,” where the largest
    numbers of endangered species exist.


    Today every sovereign nation in the world has a protected-area system of some
    kind. All together the reserves number about a hundred sixty-one thousand on land
    and sixty-five hundred over marine waters. According to the World Database on
    Protected Areas, a joint project of the United Nations Environmental Program and
    the International Union for Conservation of Nature, they occupied by 2015 a little
    less than 15 percent of Earth’s land area and 2.8 percent of Earth’s ocean area.
    The coverage is increasing gradually. This trend is increasing. To have reached
    the existing level is a tribute to those who have led and participated in the
    global conservation effort. But is it the level enough to just solve halt the
    acceleration of species extinction? Unfortunately, it is in fact now close to
    enough. Might the upward trend conservation efforts have set enough during the
    rest of the century to save most of Earth’s biodiversity? That is problematic,
    but I doubt that it can be, and even there will be far less biodiversity to save.


    Even in the best scenarios of conventional conservation practice the losses should
    be considered unacceptable by civilized peoples. The declining world of biodiversity
    cannot be saved by the piecemeal operations in current use alone. It will certainly
    be mostly lost if conservation continues to be treated as a luxury item in national
    budgets. The extinction rate our behavior is now imposing on the rest of life,
    and seems destined to continue, is more correctly viewed as the equivalent of
    a Chicxulub-sized asteroid strike played out over several human generations.


    The only hope for the species still living is a human effort commensurate with
    the magnitude of the problem. The ongoing mass extinction of species, and with
    it the extinction of genes and ecosystems, ranks with pandemics, world war, and
    climate change as among the deadliest threats that humanity has imposed on itself.
    To those who feel content to let the Anthropocene evolve whatever destiny mindlessly
    drifts, I say please take time to reconsider. To those who are steering the growth
    of reserves worldwide, let me make an earnest request: don''t stop, just aim a
    lot higher.


    Populations of species that were dangerously small will have space to grow. Rare
    and local species previously doomed by development will escape their fate. The
    unknown species, apparently at least six million in number, will no longer remain
    silent and thereby be put at highest risk. People will have closer access to a
    world that is complex and beautiful beyond our present imagining. We will have
    more time to put our own house in order for future generations. Living Earth,
    all of it, can continue to breathe.


