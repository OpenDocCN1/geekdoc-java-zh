    # 9


    # THE MOST DANGEROUS WORLDVIEW


    Not everyone claiming to be a conservationist agrees that biodiversity should
    be protected intact. A small but growing minority believe that humanity has already
    changed the living world beyond repair. We must now, they, even on remote, adapt
    to life on a damaged planet. A few of the revisionists urge the adoption of an
    extreme Anthropocene worldview, in which humans completely dominate Earth and
    surviving wild species and ecosystems are judged and conserved for their usefulness
    to our species.


    In this vision of life on Earth, wildernesses no longer exist; all parts of the
    world, even the most remote, have been adulterated to some degree. Living nature,
    as it evolved before the coming of man, is dead or dying. Perhaps, extreme advocates
    believe, this outcome was foreordained by the imperatives of history. If so, the
    destiny of the planet is to be completely overtaken and ruled by humanity—pole
    to pole, of, by, and for us, the only species at the end of the day that really
    matters.


    here is a whisper of truth in this opinion. Humanity has delivered a blow to the
    planet not even remotely approached by that of any other single'
