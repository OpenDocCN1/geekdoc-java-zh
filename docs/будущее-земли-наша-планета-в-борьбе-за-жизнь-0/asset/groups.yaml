    The knowledge accumulating in scientific studies of any species is organized by
    its place in the hierarchy. Its genetic relationships and evolutionary history
    are given by its place, and its name can be changed when new evidence force a
    change in that place. If this hierarchical system did not exist, and was not subjected
    as it has been to the strict, internationally sanctioned rules of zoological and
    botanical literature, knowledge of Earth’s biodiversity would quickly descend
    into chaos.


    The hierarchical system and formal nomenclatural rules cannot be easily changed,
    but the transmission of information using it has been vastly improved by the digital
    revolution. For most of my career, in which taxonomic studies of ants played a
    major part, I had no choice but to borrow reference specimens on which the species
    names and classifications are based, or else visit the far-flung collections in
    museums throughout Europe and America in which they are deposited. To consult
    the literature, I had to search through antiquated or highly specialized journals.
    I was fortunate to be at Harvard University, with the largest collection of ants,
