    DNA base pairs. During the process they modified the code sequence slightly, implanting
    a statement made by the late theoretical physicist Richard Feynman, “What I cannot
    create, I do not understand,” in order to detect daughters of the altered cells
    in future tests. Then they transplanted the altered DNA into a recipient cell
    from which the original DNA had been removed. The newly encoded cell fed and multiplied
    like a natural cell.


    The entity was given a seventeenth century Latinized name with an appropriately
    robotic surname, Mycoplasma mycoides JCVI-syn 1.0. Hamilton O. Smith, speaking
    for the research team, wrote that with this synthetic entity, and with the new
    tools and techniques designed to complete the project, “We now have the means
    to dissect the genetic instruction set of a bacterial cell and understand how
    it works.”


    In fact, the new technology is ready to do a great deal. In 2014, a second team,
    by Jeff Boeke at Hopkins University, constructed a completely artificial chromosome
    of a yeast cell. This feat also represents an important advantage. Yeast cells
    are more complex than bacterial cells in possessing organelles as chromosomes
    and mitochondria.


    The textbook example of elementary artificial selection of the past millennia
    is the transformation of teosinte, a species of wild grass with three races in
    Mexico and Central America, to maize (corn). The food found in the ancestor was
    a meager packet of hard kernels. Over centuries of selective breeding it was altered
    into its modern form. Today maize, after further selection and widespread hybridization
    of inbred strains that display “hybrid vigor,” is the principal food of hundreds
    of millions.


    The first decade of the present century saw the beginning of the new may phase
    of genetic modification beyond hybridization: artificial selection and even direct
    substitution in single organisms of one gene for another. If we use the trajectory
    of progress in molecular biology during the previous half century as a historical
    guide, it appears inevitable that scientists will begin routinely to build cells
    of wide variety from the ground up, then induce them to multiply into synthetic
    tissues, organs, and eventually induce independent organisms of considerable complexity.


    If people are to live long and healthy lives in the sustainable Eden of our dreams,
    and our minds are to break free and dwell in the far more interesting universe
    of reason triumphant over superstition, it will be through advances in biology.
