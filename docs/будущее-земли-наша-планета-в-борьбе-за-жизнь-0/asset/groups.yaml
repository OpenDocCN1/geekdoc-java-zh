    ## 加纳阿特瓦森林。非洲西部驼背地区的许多湿润森林已因人类侵入而急剧减少，但残碎片仍像岛屿一样幸存，保留了曾经极其丰富的植物群和森林的一部分。一个绝佳的例子是原始的阿特瓦森林，它至少有50万历史，是雨林的遗迹，而在其他地区雨林已消失了80%。阿特瓦是“高地常绿林”这一生物群变体的最佳实例。


    ## 马达加斯加。这座巨大的岛屿相当于加利福尼亚州和亚利桑那州的总和，位于非洲东部海岸外400公里的印度洋，自1.5亿年前从南方超级大陆冈瓦纳分离以来一直处于隔离状态。由于面积巨大、古老且属于热带，马达加斯加拥有非常丰富且独特的动植物群，其70%以上的物种在世界其他地方从未发现（这是1.4万个物种的最新数据）。与古巴、希索拉和加尔帕戈斯岛一样，马达加斯加是观察适应性辐射的活实验室，适应性辐射定义为一个幸运殖民岛屿的单一物种起源出大量物种（在这种情况下，通常是飞过或漂过非洲的）。马达加斯加动物演化辐射的例子包括多种但亲缘关系相的猴类（原始灵长类）、变色龙、森林鹴鸸、蛙类，以及在1.2万种植物中，包括棕榈科、兰科、猴面包科和类仙掌的迪迪尔树科的复杂复合群。


    # 亚洲


    ## 亚山脉。亚山脉最高海拔达4509米，这片美丽且少有人迹的山脉耸立于俄罗斯、中国、蒙古和哈萨克斯坦交界的中亚地区。在不同海拔上，分布着草原、北方针叶林和高山植物，它像是一本关于冷温带和极地动物的生物百科全书，是整个欧亚地区拥有真正冰河时代动物群的地方之一。山坡上活跃的食草动物包括马鹿、驼鹿、驯鹿、西藏羚、鹿和野猪。它们的捕食者包括棕熊、狼、猞猁、豹子和貂熊。它还是发现尼人索人物种首批化石的地方。


    ## 婆罗洲。印度尼西亚的18307个岛屿（估计数量根据标准和技术而异）横跨5120公里的纬度，从苏门答腊的西端到伊里安贾亚（新几内亚的西半部）。这些群岛共同包含了惊人的生物多样性。婆罗洲是世界第三大岛屿，其南部四分之三属于印度尼西亚，而北部四分之一则分别属于马来西亚和独立的文莱君主制国。整个岛屿已经失去了大部分雨林。由于森林砍伐和棕榈油种植，婆罗洲失去了大量比例的雨林。正如207年报道的，“婆罗洲的内部由于棕榈油种植的扩张，许多雨林已消失，许多热带植物被焚毁，但该岛屿仍然是生物多样性最丰富的地区之一。”婆罗洲的整体已经失去了大量比例的雨林。


    ## 冈瓦纳遗迹。西高特山脉是印度大陆的脊梁，与马达加斯加、新喀里多尼亚和新西兰一样，都是冈瓦纳的碎片。西高特山脉平行于印度西岸延伸的山脉，与马达加斯加、新喀里多尼亚和新西兰一样，都是冈瓦纳的碎片。由于从海平面到6695米的最高海拔，西高特山脉拥有极其丰富的热带生物多样性。这个山山国家拥有不丹的古老栖息地和植物群，这5000种植物中有1700种是特有种。


    ## 不丹。这片诗意的山地保护了喜马拉雅山脉大部分原始生息地和生物多样性。在不丹，70%的土地被森林覆盖，代表了热带、温带和高山三大主要区域。这5000种植物包括46种杜鹃和600种兰花。


    ## 缅甸。缅甸的北部地区（面积约31万平方公里）大部分被热带雨林覆盖，是联合国自然自然保护地。其陆地生物多样性由于复杂的山脉分布而得到增强，在海拔700米以上的地方出现了永久冰雪覆盖的山峰。


    # 澳大利亚和美拉尼西亚


    ## 澳大利亚南部灌木丛。从西南海岸的埃斯斯到努尔拉伯平原，分布着地球最丰富的植物群之一。拥有温和的地中海气候，这些灌木丛演化出了许多独特物种。新喀里多尼亚甚至保留了离开澳大利亚-冈瓦纳大陆块之前的元素。


    ## 澳大利亚北部金伯利地区。澳大利亚该地区的国家公园和其他偏远地区是该大陆生物多样性最高且受干扰最小的地区之一。


    ## 砾平原。位于大陆中心的荒石沙漠平坦平原只有通过洪水的形式蓄水。在洪水期间，丰富的生命从休眠中苏醒，从远方引来大量鸟类。在雨季之间，土地极其干旱，长着膝高的硬叶植被。


    ## 新几内亚。作为除格陵兰之外世界第二大岛屿（面积8万平方公里），新几内亚仍然大部分被热带雨林覆盖。其陆地生物多样性被公认为世界上最丰富且探索最充分的。新几内亚在5万年前是由小岛组成的群岛，为物种形成增加了次要因素。


