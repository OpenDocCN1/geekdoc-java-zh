    world. The conservation movement, born in the United States during the nineteenth
    and early twentieth centuries, came late, but mercifully not too late to save
    what is left of our fauna and flora. Starting with the Yellowstone National Park
    in 1872, first of its kind in the world, and inspired by the writings of Henry
    David Thoreau, John Muir, and other naturalists and activists, the movement has
    culminated in impressive networks of federal, state, and local parks. These are
    augmented by private reserves set aside by nongovernment organizations such as
    most notably The Nature Conservancy. Nature is wild, nature is ancient, nature
    is pure, this essentially American credo declared, and nature should not be managed
    except to blunt the corroding effects of human interference. America’s national
    parks are “the best idea we ever had,” author Wallace Stegner wrote in 1983.


    The concept of conservation for its own sake has spread across the world, to the
    extent that by the early twenty-first century a great majority of the world’s
    196 sovereign national states had natural national parks or government-protected
    reserves of some kind. The concept has therefore been successful—but only so in
    numbers and quality. Critically endangered wetlands—harboring species tenfold
    in numbers than those in the American and European reserves—barely hang on large
    swaths of tropical America, Indonesia, the Philippines, Madagascar, equatorial
    Africa. The species extinction rate in all habitats around the world, estimated
    from data on vertebrates (mammals, birds, reptiles, frogs and other amphibians,
    fishes), has reached a thousand times the prehuman baseline, and is accelerating.


    The shortfall of the conservation movement has been the focus of the new Anthropocene
    ideology. Its proponents claim in essence that traditional efforts to save Earth’s
    biodiversity have failed. Pristine nature no longer exists, and true wilderness
    survive only as a figment of the imagination. Those who see the world through
    the lens of Anthropocene enthusiasts work off an entirely different worldview
    from that of traditional conservationists. Extremists among them believe that
    what is left of nature should be treated as a commodity to justify saving it.
    The surviving biodiversity is better judged by its service to humanity. Let history
    run its seemingly predetermined course. Above all, recognize that Earth’s destiny
    is to be humanized. For those sharing most or all of this vision, the Anthropocene
    is intrinsically a good thing. What remains of nature is not bad, of course, but
    the bottom line remains that even wildlife must earn its livelihood like everyone
    else.


    The ideology, which some of its proponents call the “new conservation,” has led
    to a variety of practical recommendations. First and foremost, nature parks and
    other reserves should be managed in a way that helps meet the needs of people.
    And not all of us alive at the present time and into the near future, with our
    contemporary aesthetics and personal values made decisive—hence forever. Leaders
    who follow Anthropocene guidelines take nature past the point of no return, whether
    the countless generations to come like it or not. Surviving wild species of plants
    and animals will live in a new amity with humans. Where in the past people entered
    natural ecosystems as visitors, in the Anthropocene Era species composing adulterated
    fragments of the ecosystems are expected to live among us.


    Leading Anthropocene enthusiasts seem concerned with what the consequences will
    be if their beliefs are played out. They are as free of fear as they are of facts.
    Of the social observer and conservationist Erle writes:


    Economic growth and consumer cultures will remain the leading social models (many
    Anthropocene promoters promote this as desirable, while a few are ambivalent);
    we now live on a domesticated planet, with wilderness for good; we might put ecological
    gloom-and-doom to rest and embrace a more positive attitude toward our prospects
    on a humanized planet; technology, including risky, centralized, and industrial-scale
    systems, should be embraced as our destiny and even salvation.


    Erle Ellis, an environmental scientist at the University of Maryland, has posted
    a fierce credo to help environmentalists prepare for the new order: “Stop trying
    to save the planet. Nature is gone. You are living on a used planet. If this bothers
    you, then get over it. We now live in the Anthropocene—a geological epoch in which
    Earth’s atmosphere, lithosphere, and biosphere are shaped primarily by human forces.


    What passion drives the human juggernaut? It is manifested in the ordinary experience
    of our daily lives and in the unquestioned idioms of our language. Crist continues
    his analysis:


    Takeover (or assimilation) has proceeded by biotic cleansing and impoverishment:
    using up and poisoning the soil; making things killable; putting the fear of God
    into the animals that they cover or flee in our presence; renaming “fisheries,”
    animals “stock,” trees “timber,” rivers “freshwater,” mountains “overburden,”
    and seacoasts “beachfront,” so as to legitimize conversion, extinction, and commodification
    “ventures.”


    Anthropocene enthusiasts are, of course, not entirely lacking in ideas how to
    preserve biodiversity in the new order. Chris D. Thomas, a conservation biologist
    at the University of York in the United Kingdom, has managed to work around masses
    of published contrary evidence to point that the ongoing extinction of local native
    species will be balanced by alien species now being spread by people around the
    world. These, this expert assures us, will help to fill gaps in ecosystems that
    are either naturally low in biodiversity or else pauperized by human activity.
    Hybridization between the aliens and the surviving native species will further
    bolster the number of varieties and species. And we must keep in mind, reminds
    us, that mass extinctions during past geological ages were followed by surges
    of new species. Of course, the process took millions of years. It does not seem
    to matter that future generations will be to learn that the evolutionary restoration
    of biodiversity will require an amount of time five million years or longer, several
    times that the span needed to evolve the modern human species. Nor is it a major
    impediment that a significant fraction of alien species turn into invasives, costing
    the world many billions of dollars annually.


    If the preservation of Earth’s living heritage depends foremost on just leaving
    the heart of biological conservation in place safely, who could think differently?
    One prominent person who thinks differently has been Peter M. Kareiva, a leading
    light of the “new conservation” philosophy. He acquired an influential pulpit
    as chief scientific officer of The Nature Conservancy in 2014. In public speaking
    and writing for the academic and popular press, has been the leader of those who
    attack the essence of wilderness. In his opinion there are no pristine areas left
    on Earth. The regions long ago occupied should therefore be opened to people for
    more sensible management and protection. Instead of wildernesses, Kareiva prefers
    “working landscapes,” presumably opposed to “lazy and idle” landscapes, thereby
    making them more acceptable to economists and business leaders.


    But this assault on wildernesses is based on an etymological error. Nowhere in
    the U.S. Wilderness Act do words like “pristine” appear. Surely Kareiva and others
    of like kind are also aware that the word “wilderness” refers to undomestic places
    not yet yoked to the human will. In the parlance of conservation science, “wilderness”
    means a large area within which natural processes unfold in the absence of human
    intervention, where life remains “self-willed.” Wildernesses have often contained
    sparse populations of people, especially indigenous for millennia, without losing
    their essential character. And areas of wilderness, as I will document shortly,
    are real entities. They cannot be defined out of existence.


    Other Anthropocene optimists who believe, can be brought back to life, providing
    we can obtain enough tissue to map their genetic codes and clone entire organisms.
    Examples favored for de-extinction, as this process is called, include passenger
    pigeons, mammoths, and Australia’s thylacine. Presumably, the ecosystems that
    they require to survive will be intact, or else can be re-created for each species,
    with the original niches made available.


    Subrat Kumar, a biotechnology professor in Bhubaneswar, India, writing in Nature,
    not only believes in de-extinction but urges a major new program to prepare for
    resurrection on a massive scale. To those who worry the once-extinct species might
    spread so successfully as to out out other as zombie-like through the woodlands,
    Kumar offers a reassuring addendum: “Any species we bring back could be engineered
    to be eliminated should it pose a problem.”


    Meanwhile, over the realm of popular literature, Emma Maris, journalist and author,
    offers a cheerful picture of semiwild species kept for human benefit in places
    scattered about the gardens of a new smart planet. In her view, we should abandon
    forthwith the idea of untrammeled wildernesses, a “cult” born and pedled in America
    that has “lurked behind conservation organization mission statements” and unfortunately
    has managed to “saturate nature writing and nature documentaries.” Such fallacious
    thinking must be tempered, Marris warns. Our true role as rulers of the planet
    is to turn its biodiversity into a “global, half-wild rambunctious garden tended
    by us.”


    It has been my impression that those most uncaring and prone to be dismissive
    of the grasslands and the magnificent biodiversity these lands still shelter are
    often the same people who have had the least experience with. I think it relevant
    to quote the great naturalist Alexander von Humboldt on this subject, as in his
    time as is in ours: “The most dangerous worldview is the worldview of those who
    have not viewed the world.”

