    species. Together these vanishing remnants of Earth''s biodiversity test the reach
    and quality of human morality. Species brought low by our hand now deserve our
    constant attention and care. Religious believers and nonbelievers alike would
    do well to sacralize God''s elegant command given in the Judeo-Christian account
    of Genesis: Let the waters teem with countless living creatures, and let birds
    fly above the earth across the vault of heaven.


    ![](img/f03e757fcddd4aaceb89b9f39b980fec_42_0.png)


    ![](img/f03e757fcddd4aaceb89b9f39b980fec_43_0.png)


    Australian bustard in courtship display.

    Proceedings of the Zoological Society of London, 1868.


    # 6

    ARE WE AS GODS?


    Some believe that humanity should accept the ecological chaos we have created
    just as damaged collateral to a brilliant destiny. “We are as gods,” the futurist
    Stewart Brand has written, “and have to get better at it.” Earth is our planet,
    this vision continues in zigzag logic, and our ultimate role is to take control
    of all of it. A few keruffles such as economic crashes, climate change, and religious
    wars notwithstanding, we are getting better in every way the time. We travel faster
    across the globe, reach higher and deeper probe, and look further across the universe.
    We are collectively learning at an exponential pace everything the Big God permits
    us little gods to learn, and we are putting all that knowledge within reach of
    everyone by a few keystrokes. Homo sapiens, the amazing primate species on two
    legs, with free hands and a cerebrum-packed globular skull, is on its way!


    In the dreams of science-prone intellectuals and Hollywood scriptwriters, there
    is no limit to humanity’s eventual grasp. Astrophysists conceive of travel at
    one-tenth the speed of light among the two hundred billion stars of the Milk Way,
    traversing it desired in a few tens of thousands of years. There is even time
    ahead ahead for a species like our own to occupy the galaxy. The formula is arithmetically
    simple, as follows. Take centuries to colonize the nearest star system that possesses
    a habitable planet. Take a few more centuries or millennia to build a civilization
    there, then launch multiple space vehicles to other star systems. Continue the
    process until all the habitable planets of the galaxy are occupied. The time may
    seem impossibly long but it is less than between the evolutionary origin of humans
    and the present (which is also only an eyelid in the full span of life on Earth).


    Meanwhile, in imagination, we may attain the status of what the astronomer Nikolai
    Kardashev called Type I civilization, a society in control of all the available
    energy on Earth. Thus we could conceivably press on to Type II civilization, in
    control of available power in the Solar System, and even Type III civilization,
    taking control of all energy in the galaxy.


    I may now humbly ask, just where we are going—really? I believe the great majority
    of people on Earth would agree with the following goals: an indefinitely long
    and healthy life for all, abundant sustainable resources, personal freedom, adventure
    both virtual and real on demand, status, dignity, membership in one or more respectable
    groups, obedience to wise rulers and laws, and lots of sex with or without reproduction.


    There is a problem, however. These are also the goals of your family dog.


    Let’s talk about ourselves. We are indeed somehow soaring to greatness, if not
    god least for our emotional gratification. Our individual organisms, our tribe,
    our species, are the culmination of Earth’s achievement. Of course we think this
    way. So would members of any other species capable of self-reflection at the human
    level. If it could think, each and every fly would dream for greatness. We are
    so binary with the rest of life that we actually think of ourselves as demigods,
    halfway between the animals below us and angels above, moving ever upward. It
    is easy to suppose that the genius of our species is on some kind of automatic
    pilot, guiding us to an undefined empyrean that will exist with perfect order
    and provide personal happiness. If we ourselves are ignorant, our descendants
    will find the empyrean as humanity’s destiny someday, somehow, they arrive there.


    So we stumble forward in hopeful chaos, trusting that the light on the horizon
    is the dawn and not the twilight. Ignorance of the future based on lack of self-understanding
    is, however, a dangerous condition. The French writer Jean Bruller had it right
    when on the brink of World War II he wrote that “all of mankind’s troubles are
    due to the fact that we do not know what we are and cannot agree on what to become.”


    We are still too greedy, shortsighted, and divided into warring tribes to make
    wise, long-term decisions. Much of the time we behave like a troop of apes quarreling
    over a fruit tree. As one consequence, we are changing the atmosphere and climate
    away from conditions best for our bodies and minds, making a lot more difficult
    for our descendants.


    And while it, we are unnecessarily destroying a large part of the rest of life.
    Imagine Hundreds of years in the making, and we’re extinguishing Earth’s biodiversity
    as though the species of the natural world are no better than weeds and kitchen
    vermin. We have no shame?


    In order to settle down before we wreck the planet, we should learn to think about
    where our species really come from and what we are today. There is plenty of evidence
    to show transcendent goals—above self and tribe—arise in the human brain. They
    are fundamentally biological in origin. To understand the meaning of life, to
    know that we know how and why we know, is the premier driving force of all of
    science and the humanities. There is greatness in understanding the basic elements
    of human evolution and wisely acting upon the way we are linked. The form it is
    taking can be expressed succinctly as follows: the biosphere gave rise to the
    human mind, the evolved mind gave rise to culture, and culture will find the way
    to save the biosphere.


    For those who believe in gods (and who can say with provable certainty they are
    wrong?), we may hope it not be like the bloodthirsty warrior god described in
    Joshua 10. His name was Yahweh, and He halted the celestial sphere in order to
    aid the Amorite genocide, guaranteeing Israelite victory. Before of His people
    He commanded:


    Stand still, O Sun, on Gibeon;

    stand, Moon, in the Vale of Aijalon.*

