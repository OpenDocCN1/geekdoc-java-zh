    # 12


    # THE UNKNOWN WEBS OF LIFE


    It should be obvious to scientists and the general public alike that in order
    to save biodiversity it is necessary to understand how species interact with one
    another to form ecosystems. Yet poor is our knowledge of the interactions that
    ecosystems studies remain an underdeveloped science, with few answers to pass
    on that solve even the simplest problems of conservation.


    I feel obligated, as a scientist with research experience in both field and theoretical
    research on ecosystems, to reemphasize in some detail the weakness and inadequacy
    persisting in this important branch of ecology. Conventional ecosystem studies
    fall especially short in accounting for the ways in which species interact with
    one another. Sophisticated mathematical models are available, of course. When
    data are few, the models are easy to construct—too easy.


    Don''t get me wrong. Ecological studies at every level are necessary, and attractive.
    For young scientists with strong mathematical backgrounds they offer a bright
    future, even aha* moments. Nevertheless, as a contemporary'
- md: '

    field of pure scientific fires they are even worse off than economics. In parallel
    manner to this marginal science, the shortcoming is in the database of the identity
    and natural history of the species making up the ecosystems—much the same as for
    innate and learned behavior of individual people in economics. Add to that the
    ubiquitous nonlinearities that twist and turn like escaping eels when you put
    together the actions of real players. Overall, theorists have not been able to
    grasp the near-bottomless complexity of the real world, where not just two or
    three large numbers of players, species humans, usually to an indeterminate number,
    are engaged.


    In a few cases ecologists can mine databases for partial correlation that reveal
    the causes of environmental change. One is the increase of bark beetles in coniferous
    forests caused by global warming and followed by more frequent fires, a general
    principle. Another is the increase of average niche breadth of species as in the
    ecosystem declines, as seen in north temperate and arctic ecosystems. Individual
    species on average occur in a greater number of habitats. They consume a greater
    variety of food. Still another global trend is the rise in diversity of lichens,
    conifers and northward toward the world, parallel to the decline of orchids, butterflies,
    and reptiles over the same geographical gradient. As a rule, however environmental
    factors of biodiversity change have been adduced only when the ecosystems studied
    were very small and their biodiversity relatively simple.


    Ecology, like all scientific disciplines, is made up of subjects that are best
    mastered from the bottom up. First you discover certain phenomena, and infer that
    such phenomena exist, then you interpret their cause and effect, fitting what
    you have in hand to whatever explanation seems relevant. With the existing explanation,
    using common sense or inspiration, you devise possible studies (hypotheses), preferably
    multiple explanations that compete with one another. You are thereby guided in
    the search for more data and improved theory that might or might not shed mer
    light on each phenomenon and the pattern of which they are a part. And if you
    remain unable to explain the whole, at least you can open new avenues of research.


    Scientific research is thereby seldom straightforward. It rarely takes major leaps
    to the top. It moves obliquely, pressing forward at angles, reformulating, twisting,
    filling the subject out, waiting, looking around, describing parts more exactly,
    describing lineages more firmly. Then, like a crack in a cave wall, a guiding
    beam of light comes through.


    That is the way almost all successful science is done. And it is obviously not
    being done enough in ecology. The data needed to advance studies of the structure
    and function of ecosystems do not most cases exist. Let us ask of ecologists,
    over and again, how can we understand the deep principles of sustainability of
    a forest or river if we do not know even the identity of most of the insects,
    nematodes, and other small animals that run finely tuned engines of the energy
    and materials cycles? Turning to the sea, what are we to make of the superabundance
    of bacteriophage virus predators, which first came to light in 2013? And how will
    marine ecosystems be reliably understood when ultra-small-organisms, the Picozoa,
    which might be a key part of the colloid-consuming “dark matter” of the oceans,
    were first described anatomically and ranked as a new phylum—also only in 2013?


    Let put this matter of ecology’s shortfall as science another way. Every scientific
    discipline must go through a natural history period before it can be synthesized
    into something resembling mature theory. The scientific natural history lacking
    in most domains of ecology is the identity and biology of the species that compose
    biodiversity. At least two-thirds of the species on Earth remain unknown and unnamed,
    and of the one-third known, fewer than one in a thousand have been subject to
    intensive biological research. In the same way that physiology and medicine could
    not have advanced (nor properly taught) without a solid knowledge of the organs
    and tissues of the human body, serious advance of ecosystems analysis cannot be
    expected to emerge without a solid knowledge of the species composing one ecosystem
    at a time.


    Writers and spokespeople favoring Anthropocene philosophy are focused on ecosystems
    and by training seem innocent of the nature and meaning of biodiversity at the
    species level. Researchers in species-level biology are the equivalent of neurobiologists
    in their finely detailed study of the brain, while those Anthropocene enthusiasts
    who see species interchangeable parts that fill up ecosystems are little more
    than nineteenth century phrenologists, who studied mind by shape of skull.


    It follows that most of the necessary work on ecosystems immediately ahead lies
    in the study of biodiversity at the level of species. The exploration of biodiversity
    starts, as it always has, with taxonomy.


    Taxonomists discover species, learn to identify them by differences in anatomy,
    DNA, behavior, habitat, and other biological traits. All of this information has
    practical value. Suppose a new kind of fruit fly introduced from a still-unknown
    location threatens the western alfalfa croplands. What is the name and identity
    of this invader? Where did it come from? What are its parasites and other natural
    enemies in the homeland? What else can be taken from its known biology to help
    control it? Would not be wise to wait for each such emergency in order to begin
    the needed research from the ground up. Bear in mind that the number of such invasive
    species is growing exponentially everywhere in the world. A few in the rising
    tide are potential pests. Another small fraction are insects and other organisms
    that carry the pathogenic microbes from one human or domestic animal to.


    Consider a second kind of problem becoming increasingly urgent in conservation.
    In 2014, officials of the oil palm industry proposed to cut and convert half of
    Borneo''s rain forest, leaving half as a conservation reserve. What effect would
    this massive destruction have on Borneo''s biodiversity? Would all of the island''s
    species survive in the trimmed-down reserve? Or would it be closer to 80 percent,
    or to half? And in the process, how many species found nowhere else in the world
    would fall to the chain saw? Previous experience with widespread conversion of
    natural environments suggests that the loss would be less than half, but still
    in the range of 10 or 20 percent, with many of the species found only in the destroyed
    forest lost forever, or doomed to early extinction, before they are even known
    to science.


    Another problem is the claim by Anthropocene enthusiasts that there are no more
    wildernesses, that Earth is already a used planet, and unfettered nature is dear
    or dying. The time has come, they say, to bring people fully into the picture,
    mingling people and wild species in a manner that benefits the two symbiotically.
    So just how many species, and how much nature, would survive? Anthropocene supporters
    have no idea, and qualified scientists are struggling to find out.


    I''ve stressed species as the unit in the hierarchy of biodiversity (ecosystem,
    species, gene) that can and must be studied most thoroughly with the practical
    aim of saving the whole. What needs to be done? The history of each species can
    be considered an epic. The entire biology of one species can consume the lifetime
    of a scientist. Even with a hundred scientists focused on the species, our knowledge
    of it remains incomplete. There is the niche, where the species lives intimately
    with other species—prey, predator, inside and outside symbionts, engineers of
    soil and vegetation. Therein, we can find no species that lives alone. When we
    allow one species to die, we erase the web of relationships it maintained in life,
    with consequences scientists seldom understand. In displacing wilderness, our
    actions are ignorant and permanently destructive. We break many threads, and change
    the ecosystem in ways still impossible to predict. As the pioneer environmentalist
    Barry Comer observed as his Second Law of Ecology,"You cannot do just one thing."


    The major ties of ecosystems are food webs. As taught in Ecology 101, on plants,
    birds prey on insects, birds feed on seeds and fruit containing seeds, birds spread
    when they defeat, promoting the growth of plants. With predator-prey and symbiotic
    links of this simplicity, in a small ecosystem of a few species, it is possible
    to build mathematical models that predict population cycles, dispersal, and the
    likelihood of the persistence of the species. But are the models true?


    It is highly unlikely they will prove to be true within broad limits. Ecologists
    are well aware that webs of simplicity are rare in nature, for reasons I have
    stressed. The real world, when explored as scientific natural history, reveals
    relationships among species that are usually surprising and often bizarre, far
    from ordinary human experience. I offer the following examples to make my point.
    VAMPIRE HUNTERS. The five thousand species of jumping spiders known worldwide
    are mostly short-legged, chunky in build, and hairy. They do not build webs, but
    instead prowl over the ground and vegetation using their large eyes to search
    for prey. When one is seen, the spider approaches and pounces on it, catlike.
    The spiders vary in size such that if the smallest were the size of a domestic
    cat, the largest would be as big as a lion. While relaxing in your backyard reading
    a newspaper, you see a small chubby spider appear on the paper and walk over it
    short zigzag runs, your visitor is almost certainly a jumping spider. They are
    specialized on the prey they hunt. Some prefer ants, others hunt spiders of other
    species. *Evarcha culiculora* of East Africa prefers mosquitoes—and not just any
    mosquitoes, but vampirish females that have recently fed on the blood of humans
    and other vertebrates. The *Evarcha* are especially common around'
