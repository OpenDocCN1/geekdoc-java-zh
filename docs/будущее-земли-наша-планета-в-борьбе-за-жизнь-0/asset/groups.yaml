    # 7


    # WHY EXTINCTION IS ACCELERATING


    Very few people wish to see species disappear, except those occasional pests that
    attack our bodies and sources of food. The biosphere would not mourn the loss
    of mosquitoes of the African *Anopheles gambiae* group of species, specialists
    on human blood, expert hikers in native dwellings, and the principal carriers
    of malaria. Nor, I suspect, would even dedicated conservationists mourn the complete
    elimination of the African guinea worm, my candidate for the most ghastly of human
    pathogens. Growing up to a meter in length, it stretches through the body and
    opens sores on the feet or legs to eject its larvae. We could moreover endure
    extinction of the protozoa parasites that cause the disfiguring and deadly disease
    of leishmaniasis. Other than still-unknown pathogens among bacteria, microscopic
    fungi, and viruses, the number of species worthy of extinction, or at least of
    harmless storage in liquid nitrogen, is probably (my guess) fewer than a thousand.
    I have suffered several times from arboviruses (arthropod-borne) picked up in
    tropical forests, lying abed with fever, and would happily say goodbye to them.'
  - '[PAGE 50]


    The millions of other species are beneficial to human welfare, whether directly
    or indirectly. There are unfortunately almost countless ways that humans are hastening
    their extinction, whatever might be their present or future beneficial roles.
    The human impact is largely due to the excess of many quotidian activities we
    perform just to get on with our personal lives. Those activities have made us
    the most destructive species in the history of life.


    How fast are we driving species to extinction? For paleontologists and biodiversity
    experts have believed that before the coming of humanity about two hundred thousand
    years ago, the rate of origin of new species per extinction of existing species
    was roughly one per million species per year. As a consequence of human activity,
    it is believed that the current rate of extinction overall is between one and
    one thousand times higher than it was originally, and all due to human activity.


    In 2015 an international team of researchers finished a careful analysis of the
    prehuman rates and came up with a diversification rate ten times lower in genera
    (groups of closely related species). The data, when translated to species extinctions,
    suggests species extinction rates at the present time are closer to one thousand
    times higher than before the spread of humanity. The estimate is further consistent
    with an independent study that detected a similar downward shift in the rate of
    species formation in prehumans, as well as in their closest relatives among the
    great ages.


    Every expansion of human activity reduces the population size of more and species,
    raising their vulnerability and the rate of extinction accordingly. A 2008 mathematical
    model by a team of botanists predicted that between 37 and 50 percent of rare
    tree species in the Brazilian Amazon rain forest,“rare” defined as having populations
    of fewer than ten thousand individuals, will suffer early extinction, caused by
    contemporary road building, logging, mining, and conversion of land to agriculture.
    The lower figure, 37 percent, applies to areas developed in part but protected
    by careful management.


    It is difficult to make comparisons of origin and extinction rates across different
    kinds of plants and animals in different parts of the world. But all of the available
    evidence points to the same two conclusions. First, the Sixth Extinction is under
    way; and second, human activity is its driving force.'
  - '[PAGE 51]


    This grim assessment leads to a second very important question: How well is conservation
    working? How much have the efforts of global conservation movements achieved in
    slowing and halting the devastation of Earth’s biodiversity? Having served on
    the boards of Conservation International, The Nature Conservancy, and the World
    Wildlife Fund–U.S., and as advisor to many local conservation organizations, I
    can testify to the zeal and inspiration, backed by private and public funding,
    and to the years of sweat and blood in the field, that have gone into conservation
    efforts around the world during the past half century. How much has this heroic
    effort accomplished?


    In 2010 a survey conducted by two hundred experts on vertebrate animals (mammals,
    birds, reptiles, amphibians) analyzed the status of all 25,780 known species.
    One-fifth were confirmed as threatened with extinction, and of these a fifth had
    been stabilized as a result of conservation efforts. An independent study in 2006
    had already concluded that extinction of bird species in particular had been cut
    by about 50 percent as a result of conservation efforts during the past century.
    Thirty-one bird species worldwide still live because of efforts on their behalf.
    In short, global conservation thus far, averaged out for land-dwelling vertebrates,
    has lowered extinction rates of species by approximately 20 percent.


    Next, what is the impact of governmental regulation, in particular the U.S. Endangered
    Species Act of 1973? A review made in 2005 found that a quarter of the 1,370 American
    plant and animal species classified earlier as threatened achieved new population
    growth, while 40 percent declined, with 13 of the listed species improved enough
    to be taken off the endangered list. The most important statistic is that while
    22 species have slipped into extinction, 227 have been saved that would likely
    have otherwise disappeared. Among the more familiar protected species that have
    climbed back to health are the yellow-shouldered blackbird, green sea turtle,
    and bighorn sheep.


    These successes have shown that conservation works, but at the level of effort
    being applied at the present, it falls short of what is needed to save the natural
    world. The conservation movement has slowed the species extinction rate but failed
    to bring it anywhere close to the prehuman level. At the same time the birth rate
    of species is dropping rapidly. Like an accident patient in emergency care continuing
    to hemorrhage and with no'
  - '[PAGE 52]


    new supply of blood available, stabilization is out of reach and further decline
    and death are inevitable. We might be inclined to say to the surgeons and conservationists
    alike, “Congratulations. You have extended a life, but not by much.”


    Of course, not all wild species are threatened by the assault on biodiversity.
    A few are compatible with a humanized environment. What fraction of the present
    survivors will last to the end of this century? What present conditions persist,
    perhaps half. More likely fewer than one-fourth.


    That is my guess. But the fact is due to habitat loss alone, the rate of extinction
    is rising in most parts of the world. The preeminent sites of biodiversity loss
    are the tropical forests and coral reefs. The most vulnerable habitats of all,
    with the highest extinction rate per unit area, rivers, streams, and lakes in
    both tropical and temperate regions.


    An established principle in conservation biology for all habitats is that a reduction
    in area results in a fraction of the species disappearing in time roughly the
    fourth root of the area. If 90 percent of a forest is cut, for example, half of
    the species will disappear that would have otherwise persisted. At the beginning
    most of the species may survive for a while, but roughly half will have populations
    too small to persist for more than a few generations.


    Barro Colorado Island in Panama has proved a valuable natural laboratory to study
    the effect of area on extinction. Covered by rain forest, it was created by the
    formation of Gatun Lake in 1913 during the construction of the Panama Canal. As
    ornithologist, John Terborough, predicted that after fifty years the island would
    lose seventeen bird species. The actual number was thirteen, representing 12 percent
    of the one hundred eight breeding species originally. On the other side of the
    world, a 0.9-square-kilometer patch of rain forest, the Bogor Botanical Gardens
    of Indonesia, was also isolated, not by water but by the clearing of all the forest
    around. In the first fifty years it lost twenty of its sixty-two breeding bird
    species, approximately the number expected.


    Conservation scientists often use the acronym HIPPO for a quick recall of the
    most ruinous of our activities, in order of importance:


    Habitat destruction. This includes that caused by climate change.

    invasive species. This includes plants and animals that crowd native species and
    attack crops and native vegetation, as well as microbes causing disease in humans
    and other species.'
- md: '

    Pollution. The effluents from human activity are killers of life, especially in
    rivers and other freshwater ecosystems, the most vulnerable of Earth’s habitats.


    Population growth. Although it is still widely unpopular to say so, we must really
    slow down. Reproduction is obviously necessary, but it is a bad idea, as Pope
    Francis I have pointed out, to continue multiplying like rabbits. Demographic
    projections suggest that the human population will rise to about eleven billion
    or slightly before the end of the century, thereafter peak, and begin to subside.
    Unfortunately for the sustainability of the biosphere, per-capita consumption
    is also destined to rise, and perhaps even more steeply than human numbers. Unless
    the right technology is brought to bear that greatly improves efficiency and productivity
    per unit area, there will be a continued increase in humanity’s ecological footprint,
    defined as the area of Earth’s surface each person on average needs. The footprint
    is not just local area, but space scattered across land and sea, in pieces for
    habitation, food, transportation, governance, and all other services down including
    recreation.


    Overhunting. Fishing and hunting can be pressed until the target species is driven
    to extinction or on the way, making the last surviving populations subject to
    final erasure by disease, competition, changes in weather, and other stresses
    survived by larger and more far-ranging populations of the same species.


    Single cases in the decline and extinction of species can be identified readily
    in a few cases. One example is the dietary preferences of the brown tree snake,
    which is especially skilled at preying on bird nests. Another has been identified
    in the decline of the monarch butterfly in the Midwest, which famously overwinters
    in masses of millions on pine trees in the Mexican state of Michoacán. By 2014,
    there was an 81 percent decline of the butterflies in the United States Midwest,
    attributed to a 58 percent decline in milkweeds, the exclusive food plant of the
    monarch caterpillars. The milkweeds have fallen off in turn because of the increased
    use of glyphosate weed-killer in corn (maize) and soybean fields. The crops have
    flourished after being genetically modified to resist the weed-killer, while the
    flourished milkweed plants have not been protected. With their food supply unintentionally
    reduced, the migrating monarch butterflies of both the United States and Mexico
    have declined steeply.


    In most extinctions, however, the causes are multiple, linked to one another in
    some way, all ultimately the result of human activity. In one well-analyzed example
    of multiple causes, the Allegheny woodrat vanished or endangered through a third
    of its range. It is considered to have suffered from the extinction of the American
    chestnut and hence the loss of its seeds, on which the species partly depended.
    Also important have been the logging and fragmentation of the forests where the
    woodrats live, plus further reduction of this habitat by the voracity of the invasive
    European gypsy moth. The coup de gras rootworm infection from raccoons, which
    are animals better suited than the woodrats to live around


    Those unimpressed by the fall of a rodent may turn a more caring eye to the songbirds
    that migrate each year their wintering ground in the New World tropics and breeding
    range in the eastern United States. From data compiled by the federally sponsored
    North American Breeding Bird Survey along with the Audubon Christmas Bird Count,
    it is clear that populations of more than dozen species are in a steep descent.
    Those affected include the wood thrush, Kentucky warbler, eastern kingbird, and
    boblink. One, Bachman''s warbler, whose winter ground in Cuba, has evidently gone
    extinct. I have a place in my heart for this little bird. During field trips to
    the floodplain forests of the U.S. Gulf Coast, which have brought me close to
    canebrakes where the warbler once nested, I''ve often looked and listened for
    a Bachman''s best as I could (admittedly not very skillfully), but to avail.


    It seems as though the remainder of American native plants and animals are under
    deliberate assault by everything humanity can throw. Leading the list in our deadly
    arsenal is the destruction of both wintering and breeding habitats, heavy use
    of pesticides, shortage of natural insect and food plant, and artificial light
    pollution causing errors in migratory navigation. Climate change and acidification
    pose newly recognized game-changing risks—shifts in all aspects of the rhythms
    of the environment away from those necessary for wildlife survival and reproduction.


    There exist several facts about global biodiversity to keep in mind while trying
    to save it. The first is that the human-caused agents of extinction are synergistic.
    As any one of the agents intensifies, it causes others to intensify also, and
    the sum of the changes is an acceleration of extinction. Clearing a forest for
    agriculture reduces habitat, diminishes carbon capture, and introduces pollutants
    that are carried downstream to degrade otherwise pure aquatic habitats in route.
    With the disappearance of any native predator or herbivore species, the remainder
    of the ecosystem is altered, sometimes catastrophically. The same is true for
    the addition of an invasive species.


    Another overarching principle of biodiversity is the greater richness of tropical
    environments over temperate environments, in both number of species and vulnerability.
    While the variety of aphids, lichens, and conifers increases poleward, a vastly
    larger number of other kinds of organisms increase in the opposite direction.
    For example, you can expect to find about fifty species of ants in a square kilometer
    of New England temperate forest (if you care to look) up to ten times number in
    a comparable area of forest in Ecuador or Borneo.


    A third principle of biodiversity worth noting is in the relation between its
    richness and the geographical range of the species comprising it. A large fraction
    of the species of plants and animals of temperate North America are distributed
    across most of the continent, but very few species range the same across tropical
    South.


    When these last two principles are linked, both entails the numbers of resident
    species, we find that on average tropical species are more vulnerable than temperate
    species. They occupy smaller ranges and thereby manage to sustain smaller populations.
    Furthermore, existing as they do among a greater array of competing species, they
    tend to be more specialized in where they live, in what they eat, and by the predators
    that hunt and eat them.


    A general rule to follow in conservation practice is therefore that, while clear-cutting
    a square kilometer of old-growth coniferous forest in Canada, Finland, or Siberia
    will do a lot of environmental damage, cutting the same area of old-growth rain
    forest in Brazil or Indonesia will do far more damage.


    Finally, there is the immense disparity between the 62,839 known species of vertebrates
    (mammals, birds, reptiles, amphibians, fishes, the total number in 2010) and 1.3
    million known invertebrate species (also 2010). Almost all the information on
    quantitative trends in biodiversity are based on the vertebrates, the big animals
    with which we have intimate familiarity. There are well-studied groups within
    the invertebrates, notably including mollusks and butterflies, but even these
    organisms are less known than the mammals, birds, and reptiles. The great majority
    of invertebrate species, notably the hyperdiverse insects and marine organisms,
    remain to be discovered and made known to science. Nevertheless, of those groups
    well enough studied to make an estimate of their conservation status down to species,
    such as freshwater crabs, dragonflies, and corals, the percentages of vulnerable
    and endangered are comparable to those of vertebrates.


    In thinking about life and death in the biosphere, it is important to avoid two
    misconceptions. The first is that a rare declining species is probably senescent.
    You might think that its time has come, let it go. On the contrary, its young
    are just as vital as the young of the most aggressive species. If its population
    is shrinking in size from vulnerable to endangered (the scale of descent used
    in the Red List of the International Union for Conservation of Nature), the reason
    is neither age nor destiny of the species. Instead, the reason is the predicament
    in which the Darwinian process of natural selection has placed it. The environment
    is changing, and the genes assembled by earlier natural selection are by happenstance
    not able to adapt quickly. The species is a victim of bad luck, unlike a farmer
    who invests in land at the start of a ten-year drought. Put some young individuals
    into an environment where the genes are better adapted, and the species will flourish.


    Humanity, keep in mind, is the principal architect of such maladaptive environments.
    Conservation biology is the scientific discipline by which better environments
    are identified and protected for species imperiled within them.

    '
  mdcn: '


    污染。人类活动产生的排放物是生命的杀手，特别是在河流和其他淡水生态系统中，而这些是地球上最脆弱的栖息地。


    人口增长。尽管这种说法仍然广不受欢迎，但我们确实必须放缓增长。繁衍显然是必要的，但正如教皇方济一指出的，像兔子一样不断繁殖是一个糟糕的主意。人口预测显示，人类人口将在本世纪末或稍前增加到约110亿，随后达到顶峰并开始下降。对于生物圈的可持续性而言遗憾的是，人均消费注定也会增长，而且可能比人口数量的增长更快。除非引入能够极大提高单位面积效率和生产力的正确技术，否则人类的生态足迹将持续增加，生态足迹定义为每人平均所需的地球表面积。这一足迹不仅是局部区域，还是分布在陆地和海洋上的空间，用于居住、食物、交通、治理以及包括休闲在内的所有其他服务的碎片。


    过度捕猎。捕鱼和狩猎可以一直持续，直到目标物种被逼灭绝或处于灭绝边缘，使最后的幸存种群易受到疾病、竞争、天气变化以及其他较大且范围更广的同种种群所承受的压力的影响，最终被彻底抹除。


    物种衰落和灭绝的某些案例可以很容易识别。一个例子是棕树蛇的食性偏好，它们特别擅长捕食鸟巢。另一个案例是美国中西部黑斑蝶的衰落，这种蝴蝶以在墨西哥米却华坎州的松树上成数百万只地聚集越冬而闻名。到2014年，美国中部的蝴蝶数量减少了81%，这归因于乳草减少了58%，而乳草是黑斑蝶幼虫的唯一食物植物。乳草的继继减少是因为玉米（maize）和大豆田中甘草膦除草剂使用量的增加。由于这些作物在经过基因改造以抵抗除草剂后生长得茂盛，而那些生长茂盛的乳草植物没有得到保护。由于食物供应无意中减少，美国和墨西哥的迁徙黑斑蝴蝶数量急剧。。


    然而在大多数灭绝中，原因是多方面的，并以某种方式相互联系，但最终都是人类活动的结果。在一个分析良好的多因素原因案例中，阿勒格尼山鼠在其三分之一的范围内消失或处于濒危状态。它被认为遭受了美国栗树的灭绝，因此丧失了该物种部分依赖的种子。同样重要的是山鼠栖息森林的砍伐和碎片化，加上入侵物种欧洲吉赛云蛾的贪食对这一栖息地的进一步破坏。来自浣熊的条纹根甲虫虫感染，而浣熊是比山鼠更适合生活在周围的动物。


    那些对齿类动物的衰落不以为意的人，可能会对每年迁徙的鸟类报以更关注的目光，这些鸟类在新世界热带地区是越冬地，在美国东部是繁殖地。根据联邦资助的“北美繁殖鸟类调查”以及“奥杜邦堡圣诞鸟计数”收集的数据，显然有十多个物种的种群正在急剧下降。受影响的物种包括林地鸫、肯塔基战莺、东部王鸟和斑翅鸟。其中，巴曼战莺（其越冬地在古巴）显然已经灭绝。我对这只小鸟心中留有一个位置。在对美国墨西哥湾沿岸的泛滥林进行实地考察期间，这些森林带我进入了战莺曾筑巢的芦丛，我经常尽力寻找并聆听巴曼战莺的声音（承认技巧并不高超），但徒无于事。


    似乎美国本土植物动物的剩余部分正遭受着人类所能投出的一切手段的蓄意攻击。在我们致命武器库中居首位的是对越冬地和繁殖栖息地的破坏、对农药的过度使用、自然昆虫和食物植物的短缺，以及导致迁徙导航错误的人工光污染。气候变化和酸化构成了新认识的规则改变者风险——环境节奏各个方面的转变都偏离了野生动物生存和繁殖所必需的。


    在尝试拯救全球生物多样性时，有几个关于生物多样性的事实需要记住。第一是，人类引起的灭绝因素是协同的。随着任何一个因素的加强，它会导致其他因素也随加强，变化的总和是灭绝的加速。为了农业砍伐森林减少了栖息地，减少了碳捕获，并引入了向下游并在途中纯净水生栖息地的污染物。随着任何原生捕食者或食草动物物种的消失，生态系统的其余部分被改变了，有时是灾难性的。增加入侵物种也是如此。


    生物多样性的另一个首要原则是热带环境在物种数量和脆弱性方面都比温带环境更具丰富。虽然蚜、地衣和针叶树的多样性向极地增加，但数量得多的其他类型的生物在相反方向增加。例如，你可以预计在纽英格兰的温带森林的平方公里内发现约50种蚂蚁（如果你感兴趣的话），而在厄瓜多尔或波罗洲尼类似的森林区域，这个数量是其十倍。


    生物多样性值得注意的第三个原则是其丰富性与其组成物种的地理范围之间的关系。温带北美的大部分植物动物物种分布在整个大陆的大部分地区，但极少数物种在热带南方具有同样广泛的分布范围。


    当这最后两个原则联系起来时（它们涉及定留物种的数量），我们发现平均而言，热带物种比温带物种更脆弱。它们占据的范围较小，从而能够维持较小的种群。此外，由于它们存在于更丰富的竞争物种中，它们在居住地、食物以及捕食猎杀和捕食它们的方面往往更具专门化。


    因此，保护实践中遵循的一条通用规则是：虽然在加拿大、芬兰或西伯利亚砍伐平方公里的古老针叶林会造成巨大的环境破坏，但在巴西或印度尼西亚砍伐相同面积的原始雨林造成的破坏要大得多。


    最后，已知的62,839种脊椎动物（哺乳动物、鸟类、爬行动物、两栖类、鱼类，2010年的总数）与130万已知无脊椎动物（同样为2010年）之间存在巨大差异。关于生物多样性定量趋势的信息几乎都基于脊椎动物，即我们非常熟悉的大动物。在无脊椎动物中，有研究充分的群体，特别是软体动物和蝴蝶，但即使这些生物也比哺乳动物、鸟类和爬行动物为人知。大多数无脊椎动物物种，特别是高度多样化的昆虫和海洋生物，仍待被发现和被科学认知。尽管如此，在那些研究充分到可以估计其物种级保护状况的群体中（如淡水蟹、蜻蜓和珊瑚），脆弱和濒危的百分比与脊椎动物相当。


    在思考生物圈的生命与死亡时，避免两个误解是关重要的。第一个是认为稀有衰落的物种可能已经老了。你可能认为它的时间到了，随它去吧。相反，它们的幼体与侵略性物种的幼体一样重要。如果它们的种群规模从脆弱萎缩到濒危（国际自然保护联盟红色清单使用的下降尺度），原因既不是物种的年龄也不是命运。相反，原因是达尔文自然选择过程将其置于的困境。环境正在变化，而早期自然选择所积累的基因由于偶然无法快速适应。该物种是运气差的受害者，不像一个在十年干旱开始时投资土地的农民。将一些幼体放在基因更适应的环境中，该物种将会繁衍。


