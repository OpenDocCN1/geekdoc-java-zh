    从整体上看地球有助于获得视角。如果将地球上单细胞细菌和古菌演化为更复杂的生命形式所需的约十亿年进化时间加进去，就能感受到我们的出生地是多么脆弱，庇护每个物种的生态系统部分多么复杂，以及物种之间的非线性相互作用是多么错综且交织。地球的生物圈就像一个鸟类不小心坠入的蜘蛛网。美丽的秩序瞬间变成了混乱。蜘蛛本能地察觉到了这种风险，在丝网的部分区域织了极其显眼的丝线，仿佛在对闯入者大喊让他们避开。


    像蜘蛛那样的警告信号就在我们四周，但我们大脑机制中倾向于短期决策而非长期规划的达尔文主义倾向让我们忽略了它们。让我想起 2005 年与德克萨斯科技大学的一位水文学家进行的一次对话。我对德克萨斯州原部丰富的农业状况印象深刻，但也意识到它依赖于来自奥加拉拉（Ogallala）含水层的灌溉。由于水的补给速度远慢于抽取速度，我问我的伴侣还能维持多久。“哦，如果我们仔细的话，大约二十年。”“那时你们怎么办？”他耸耸肩回答道，“噢，我们会想办法的。”


    我希望我的想法是正确的，但迹并不乐观。在这里和其它地区的边缘栖息地，气候变化和短视思维已经付出了沉重的代价。随着沙漠在非洲的萨赫尔地区不断扩张，随着澳大利亚的干旱中心向沿海农田挤压，随着科罗拉多河没有多余的水流向美国西南部的缺水农田，农业工作最终将不得不转向旱地作物。他们将需要具有深多年生根系的物种，以及带有食用种子的更耐旱草类。


    整个世界已经深陷水危机。约 18 个国家（拥有世界一半的人口）正在耗尽它们的含水层。在中国北方粮仓带的核心地区河北省，深层含水层的平均水位每年下降近三米。印度农村平原地下水位下降得如此快，某些地区必须通过水车运水。国际水研究所的一位官员曾说：“气球破裂时，印度农村将面临无法想象的混乱。”在中东，明显的是，仇恨和不稳定与其说是由于宗教差异和对历史不公的记忆，不如说是由于人口过多以及耕地和水的严重短缺。


    地球七十亿人口共同是这个星球匮乏财富的贪婪消费者。预计本世纪末人口将达到百亿（正负十亿），除非农业生物学和高科技扭转局面，否则他们将更加贪婪。农业面临其他现实。目前，我们消耗了地球近四分之一的自然光合生产力：地球新产生的生物量有这么多比例落入我们的手中和胃里，而且份额正在增加。地球剩余的生产力留给了所有其他物种。


    目前地球的总生产力可以精确总结如下。蒙大拿大学的史蒂文·W·勒宁（Steven W. Running）在过去的三十年里报告说，地球陆地及植物为主的初级生产力（NPP）保持基本不变，每年波动小于
    2%。全球总降水量仅变化了 2%，驱动光合作用的全球太阳辐射输入波动小于 0.01%。人类现在占用了约 38% 的 NPP 作为能量和燃料。人类能继续在一种允许我们接管剩余
    62% 的燃料中不断增加和消耗吗？不，我恐怕不能，至少无法通过传统农业实现。减去不可收的部分后，全球总 NPP 仅剩 10% 可供人类额外使用，而这部分主要位于非洲和南美。除非能工程出一种新的绿色革命，否则人类的使用将面临消除大部分剩余陆地生物多样性的风险。


    ![img/03e757a2b8f9](img/03e757a2b8f9)


    ## 修复 (RESTORATION)


    许多荒野地区只要保持孤立，就能持续存在。对于大多数保护项目来说，某种程度的修复（即人类干预）是必要的。每个项目都是独一无二的。每个项目都需要科学家、活动家和经济领袖伙伴共同对环境的知识和热爱。要成功，需要每一分创业精神、勇气和坚持。


    大型保护计划像新的科学学科一样，始于英雄。少数个人向前，冒着失败和伤害的风险。他们拥有不符合常常的梦想。他们接受长时间的加班、个人开支、不断的不确定性和被拒绝。当他们成功时，他们的个人故事便理所应当地被视为史诗。他们成为了环境史的一部分。


    在自然公园和保护区工作期间，我有幸与两位这样的生物多样性保护领域的先驱合作。他们的英雄般的举措在不同的大陆展开。他们修复的景观所面临的问题最初看似完全对立，但这些保护者受到同样的原动力驱动：对他们所结谊的栖息地的热爱，以及对带回关键物种的感知需求。


    来自佛罗里达州米拉马海滩（Miramar Beach）的 MC Davis（直到 2015 年因癌症去世前）是一位非常成功的企业家，他的财富很大程度上建立在物业管理和小小型企业的经营。他最初的生活方式专注于资本投资和开发，看起来像一个典型的美国商人。但他也是一名户外爱好者，以对科学和教育的特殊热情探索他家乡佛罗里达州原部的荒野环境。通过自学生态学，MC
    发现该地区大部分部林地的生物多样性处于一种严重受扰的状态。他了解到，主要原因是长叶松（*Pinus palustris*）的消失。


    长叶松是一种高大、庄严的树木，产的高质量木材与白松和红杉木并列为美国顶级木材。在欧洲人到来之前，它是南方 60% 荒野土地的主导物种。长叶松并非紧密排列成森林，也不是散布在景观中小森林中最丰富的树木。相反，它统治着一片开阔的草原。其中的其他树种因频繁的闪电引发火灾而变得稀疏。长叶松之所以能生存，是因为它们在幼苗阶段进化出了特殊的抗性，包括快速的地上部生长和深根。在古老的长叶松林中行走相对容易，因为林下由各种同样适应频繁火灾的开花物种组成。


