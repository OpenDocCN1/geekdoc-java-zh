    SLAVE MAKERS. The social insects provide many bizarre examples of extreme adaptation.
    In the north temperate zone high drama has been played out deceit in the millions
    of years of ant slavery. There are many species that raid the colonies of other
    ant species and, after driving off the defending adults, kidnap (antnap?) the
    immature offspring in their pupal stage. The raiders then raise the captives (allow
    them to emerge from the pupae) as slaves to augment their own work force. In extreme
    cases the slave makers, like Spartan warriors of old, depend entirely on the quotidian
    labor of the slaves. The deception is based on a universal trait in ants: after
    workers emerge from the pupal stage as adults, they fixate during the first several
    days on the odor of the colony around them. From time until they die, the captives
    regard the slave makers as sisters, oppress as they truly are.


    The slave makers are ferocious warriors. Some are equipped with powerful sickle-shaped
    mandibles used to kill or cripple the defenders of the colonies they target. One
    species I studied achieves the same result with “propaganda” substances. During
    attacks the raiders release large quantities of a chemical that acts as an alarm
    signal for the defenders. The besieged workers are thrown into a panic, in the
    way humans might be suddenly blasted with the scream of fire alerts at high volume
    all around them. The raiders themselves are not disturbed; they are instead attracted
    to the odor of their own pheromone.


