  mdcn: '

    甚至细菌多样性的地理特征也与植物和动物有着本质的不同。在某种意义上，许多细菌遵循由先驱生态学家劳伦斯·贝肯金（Laurens Becking）在 1934
    年提出的一个原则：“万物无处不在，但环境在进行选择。”这意味着，大部分遗传形式或与其非常相似的形式遍布全球，但在大多数时间里处于休眠状态。它们形成了一个微生物种子库，只有当环境变得符合其
    DNA 编码偏好时，每个物种才开始繁殖。当出现合适的酸度、合适的营养和合适的温度时，沉睡的细胞就会苏醒。种子库遍布陆地和水床。只有跨越巨大的距离（可能是大陆尺度），遗传差异才会出现，并产生类似于植物动物物种规模的物种形成。


    随着 DNA 技术的进步，细菌和其他微生物形式的发现速度也之提高。有些生命体隐藏在眼皮底下——丰富且暴露，但由于微小到无法用普通光显微镜看到。因此，它们在微生物群的标准筛选中很容易被忽视。


    目前发现的最重要生物可能是远远球藻（Prochlorococcus）。虽然直到 1988 年才被发现，但远远球藻并不稀有。事实上，它们是全球热带和亚热带海洋中最丰富的生物。它们生活在深达两百米的水中，局部密度超过每毫米十万个。由于这些微小细胞也能进行光合作用，依靠阳光能量生存，它们占据了北纬
    40°到南纬 40°之间开放海洋所有光合作用生物量的 20% 到 40%，并负责了当地净初级生产的一半。至少在温暖的海域中，这些隐形的支撑维持了可见的存在。


    然而，如果远远球藻与另一种极丰富的细菌——海绵杆菌（Pelagibacter）是最丰富的常规生物，那么它们会是更微小的病毒的猎物吗？专家们曾认为这种微捕食者充其量稀少。然而，在
    2013 年，快速发展的超微研究领域的新方法揭示了每升海水中平均有数十亿个病毒的存在。它们都是噬菌病毒（字面意思是“细菌的吃者”），其中一种 HTVC01P
    是非常丰富的。


    生物学家对于病毒泛是否为真正的生物存在分歧，因为它们依赖宿主的分子机器进行进行复制。如果 HTVC010P 被归为此类，那么它必须被认为是地球上已知最丰富的物种。


    不仅于此。虽然捕获光的远远球藻及其噬菌病毒捕食者占据了海洋的大部分，但它们可能由一个仍未被发现的由食腐者和捕食者组成的“暗物质”支撑。这些生物同样无法通过传统的显微镜检测到。显然，至少部分履行这一角色的是一种高度多样化的微双丝（pico-biphylates），其直径仅为二三百万米。其中一个物种在
    2013 年经过了足够的研究，被识别为一个新门，研究人员将其命名为微动物（Picozoa）。这些近乎消失的微生物以胶体碎片为食，通过来回抽动鞭毛在水中剧烈地移动。一种被充分研究的物种的解剖结构在微生物中是独特的。它呈长方形，捕食器器占据了身体的一整半，将所有其他细胞器都挤在另一半。


    当科学家向海洋深处探测，穿过光边缘的散射层进入寒冷黑暗、高压的深渊时，他们发现了另一个由鱼类、无脊椎动物和微生物的世界。每个物种都专门化于在其演化的特定深度生存和繁殖。


    然后底部突然出现，被黑暗且富有诗意地命名为深渊底栖生物（abyssal benthos）。无疑，你可能会认为，在上方几公里的光合区之下，这片毫无特征的淤泥平原上几乎没有生命。那是一个错误。深渊底栖生物充满了生命。这是一个主要的狩猎场，那里的初级生产者不是植物和光合细菌，而是食腐者。这些生物取食每一具尸体、每一块肉骨，以及每一粒穿过上方巡游的鮞鱼、吞噬鳗等和其他生物的盐粒颗粒。底栖鱼类包括独特的鱼类、无脊椎动物和细菌。它们共同等待着从上方掉落的腐朽曼纳。它们是最后的食腐者、食腐者的捕食者，以及开放水域中食腐者的捕食者。食物非常稀缺，但生态系统之所以能运作，是因为所有居民都具有极佳的嗅觉。它们能够追踪从每一块食物散出的极微弱的气味痕迹，即使在相对静止的水中也是如此。


    考虑一只沉没木船的命运。在它沉入底部不久，船虫（Teredo）的幼虫就定位了它并固定在其表面。随着后期的生长，“海中白蚁”取食木头，一边前进一边钻出隧道。船虫不是虫（它们在表面上看起来像虫），而是遗传上与藤壶接近的软体动物。


    接下来，想象一块到达底部的肉。在几分钟内，它很可能被深海鼠狮鱼和无颌的泥绵鱼发现并猛烈攻击。接着是食腐无脊椎动物，随之是细菌，很快什么也没有了，只有在冰冷静止水中向外扩散的细有机产物。


    任何剩余的木头和肉块都是无脊椎动物和细菌的目标，其中一个获得“最怪异”奖项的（至少从人类的角度来看）——我会投票给骨栖虫（Osedax），它们取食掉落在海底的鲸鱼骨中的脂质。这种饮食已经足够奇了，但进食方式甚至令人难以置信。雌性骨栖虫长到人类手指大小，既没有嘴也没有肠道。它们通过含有共生细菌的身体延伸物渗透骨骼来进食。这些微生物伙伴代谢脂质，并将产生的物质和能量与它们的虫类宿主分享。那么雄性骨栖虫呢？更奇怪。这些类幼虫的成体只有三分之一毫米长，就像手里笔尖的一个点。一百多只生活在每个雌性个体鞘下的寄生群落中，取食雌性卵的蛋黄——换句话说，它们是自己未来的兄弟姐妹。骨栖虫占据的生态位并不像看起来那么稀缺；估计地球海洋上有六十万具鲸骨。


    然而，即使骨栖虫让你感到不可思议，我们也不要停于此。在更深的地方还有另一种生命。在底部表面，即底栖壳层之下，生命继续繁荣。海洋生物与陆地上占据深层地下土壤和岩石的对应生物会合，形成了一个包裹行星的被称为“深层生物圈”（deep
    biosphere）的包层。居民大部分是微生物，由大量的细菌和古菌组成。


    在某些海洋海域，至少每立方厘米有一百万个细胞。如果这种密度证明是全球性的，这意味着深层生物圈的微生物占据了地球上所有微生物的一半。它拥有与表面所有光合植物生物（有机物重量）相同的数量级。


    如果这些估计大致准确，深层生物圈的存在要求我们对微生物物种及其组成的生态系统的看法发生根本转变。在海洋底部和下方几米处，微生物和稀有的无脊椎动物仍然是上方碳循环的参与者。能量源于光能产生的生物碎片。但在深层生物圈，这种联系减弱了，并显然被来自无机来源的化学能量所取代。此类微生物的最深发现是在地表2.8公里处，南非约翰内斯堡附近的姆彭恩金矿。在那里，在没有光和氧气、恒定60度摄氏的环境下，生活着骨栖虫。它通过还原硫酸和固定周围环境中的碳氮生存。考虑到温度随深度的稳定增加，目前已知骨栖虫是标记生命内在边界的唯一物种。


    还有更复杂的细胞生物吗？当我写这些时，已经在深层生物圈的低区域发现了一种线虫，以微生物为食。可能会发现更多代表相当数量生物多样性的无脊椎动物。


    独立生命层的存在引发了对想象的末日以及随之而来的世界结局的反思。如果我们物种——自是的地球之主——意外将行星表面烧焦，或被小行星撞灭了表面所有生物，生命可以在行星的深层生物圈中继续。在那里，它的微生物和无脊椎动物将在黑暗的避难所中生存，从岩石中获取能量和物质，可能演化数百万年，最终到达表面产生多样化的多细胞生物。

