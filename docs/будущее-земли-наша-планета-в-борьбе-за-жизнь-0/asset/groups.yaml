    ## ZOMBIE MASTERS

    As a second example of evolutionary idiosyncrasy, consider the ingenuity of parasites.
    The larvae (caterpillars) of the European gipsy moth avoid birds and other predators
    during the day by hiding beneath the bark of trees. When darkness falls they climb
    up to the canopy for their evening meal of leaves. The daytime behavior is reversed,
    hover, when the caterpillars are infected with a virus (specifically, nucleopolyvirus)
    that occasionally sweeps with deadly effectiveness through the gypsy moth population.
    The virus induces a change in the brain that causes the caterpillar to climb in
    daylight to the tops of the trees. There this body liquefies and releases a cloud
    of the virus that infects other caterpillars—especially when aided by rainfall.
    A similar zombie-like control is exerted by cordyceps fungi, which infect ants
    as they forage for vegetation. The ants, in their last dying act, clamp jaws onto
    a leaf vein, an act that secures their corpse in place. The fungus grows out of
    the body and disperses its spores into the air to fall on others.


    ## SWINDLERS

    The exactitude of species evolution often includes trickery. The natural world
    is rife with plants and animals that emit false clues in or to complete their
    life cycles. One of the most elaborate is employed by a species of blister beetle
    (Molo franciscan) found in the southwestern United States. It uses a series of
    tricks to steal the resources of a solitary bee (Habropoda pallida) common in
    the same habitats. The blister beetle female lays eggs at the base of plants regularly
    visited by the bee for pollen and nectar. Upon hatching, the beetle larva climbs
    up on the plant and cluster together to form a small spherical mass. The little
    swindlers then release an odor with substances used by bee females to attract
    males of their own species. The beetle larvae pile onto the back of the fooled
    male. When the beetle contacts a real female bee of his species and mates, the
    beetle larvae leave and gather on the back of the female. They ride until she
    returns to her nest, wherever they imb off and eat the pollen and nectar stored
    there, as well as the egg she laid.


    Orchids are the master swindlers of the plant world. An entire encyclopedia could
    be written about their duplicity. Comprising seventeen thousand species, making
    them the largest of all flowering plant families, they use a wide variety of tricks
    that induce insects to transport pollen to other plants of their kidnap species.
    Some, for example, have flowers that resemble the females of certain species of
    wasps. When the males alight to copulate, all they receive sticky masses of orchid
    pollen that cling to their bodies. Other orchid species draw in males by releasing
    the scent of a female. At least one species emits the odor of angry bees, which
    attracts wasps of a kind that prey on these insects. The wasps, with the fake-bee
    orchid pollen masses sticking to them, end up pollinating orchids instead of searching
    for mates of their own species or gathering food.


    ## SLAVE MAKERS

    The social insects provide many bizarre examples of extreme adaptation. In the
    north temperate zone high drama has been played out deceit in the millions of
    years of ant slavery. There are many species that raid the colonies of other ant
    species and, after driving off the defending adults, kidnap the immature offspring
    in their pupal stage. The raiders then raise the captives (allow them to emerge
    from the pupae) as slaves to augment their own work force. In extreme cases the
    slave makers, like Spartan warriors of old, depend entirely on the quotidian labor
    of the slaves. The deception is based on a universal trait in ants: after workers
    emerge from the pupal stage as adults, they fixate during the first several days
    on the odor of the colony around them. From time until they die, the captives
    regard the slave makers as sisters, oppress as they truly are.


    The slave makers are ferocious warriors. Some are equipped with powerful sickle-shaped
    mandibles used to kill or cripple the defenders of the colonies they target. One
    species I studied achieves the same result with “propaganda” substances. During
    attacks the raiders release large quantities of a chemical that acts as an alarm
    signal for the defenders. The besieged workers are thrown into a panic, in the
    way humans might be suddenly blasted with the scream of fire alerts at high volume
    all around them. The raiders themselves are not disturbed; they are instead attracted
    to the odor of their own pheromone.


    What would slave makers do if made to live without captive labor? One day I decided
    to find out by removing all the slaves from slave-maker colonies I kept in my
    laboratory. The warriors, left on their own and with no previous experience, began
    to attempt the tasks previously left to the slaves. But they performed badly.
    They attended the young in a slovenly manner, picking the larvae and pupae up,
    carrying them about for a while, then dropping them in the wrong places. They
    were entirely unable to bring food into the nest, even when I placed morsels next
    to the entrance.


    What would happen if slave makers disappeared from the many ecosystems their various
    species inhabit? I have no idea—the impact of parasites is a field all of its
    own.


    ## GIANT KILLERS

    Naturalists are often startled when they first study a previously unknown species.
    When reflecting on the universal phenomenon of predation among animals, for example,
    naturalists tend to assume that predator and prey are roughly the same size, or
    that the predator is much larger. There are exceptions, however. Birds peck insects.
    A pack of wolves can bring a moose in deep snow, and a pride of lions on a while
    can disable an elephant. Still, the weight difference between predator and prey
    is usually no more than tenfold. A number of exceptions, however, are found among
    the drama of the South American species Azteca andrea, which lives in Cecropia
    obtuse, a broad-leafed tree in the rain forest of South America. As many as eight
    thousand workers line side by side on the lower margins of a single Cecropia leaf.
    They wait, with their mandibles held open, ready for immediate action. When insect
    lands on the leaf, the ambush rushes it from all sides, and, working together,
    pin and spread-agile. This means insect prey of almost any size can be caught.
    One, pulled to safety and weighed, 13,360 times a single worker ant. This amazing
    innovation, the equivalent of mammoth hunters among early humans, appears to be
    rare in nature.


    I''ve chosen the foregoing examples of species interactions, all very peculiar
    in nature, with a purpose. First, to hold your attention, or course; insects are
    not everyone''s favorite animals. But they also illustrate an important principle
    of ecosystems studies. Imagine for yourself any niche that might have evolved
    on this planet within the realm of physical possibility. (No animal can run a
    hundred miles an hour, for example, or digest iron ore.) Somewhere among the millions
    of species on Earth one or more will probably occupy the niche you chose. To extend
    this principle from species to ecosystems, there is no better way than the exclamation
    that closes Darwin''s Origin of Species:


    "It is interesting to contemplate an entangled branch, with many plants of many
    kinds, with birds singing on the bushes, with various insects flitting about,
    and with worms crawling through the damp earth, and to reflect that these elaborately
    constructed forms, so different from each other and dependent on each other in
    so a complex manner, have all been produced by laws acting around us."


    To those who think nature consists primarily of plants and large vertebrate animals,
    I say look about you at the little things that run the earth. To those who believe
    they can fathom the working of ecosystems with mathematical models of a handful
    of species, I say you live in a dream world. And to those who believe that a damaged
    ecosystem will heal itself or can be safely restored by replacing original native
    species with functional alien equivalents, I say I think again before you cause
    damage. Just as successful medicine depends upon a knowledge of anatomy and physiology,
    conservation science depends upon a knowledge of taxonomy and natural history.

