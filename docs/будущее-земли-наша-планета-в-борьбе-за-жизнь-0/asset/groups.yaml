    use counter-illumination, the production on their undersides of bioluminescence,
    the light provided by their own tissue or symbiotic bacteria carried inside their
    bodies. The illumination matches the brightness around them coming from the sun
    or moon above, rendering the animal less visible.


    Obedient to a law of biology, every game played between predator and prey in the
    deep scattering layer is an evolutionary arms race. Thus at least a few deepwater
    sharks, together with predatory hatfish and bobtail squid, have lifted the game
    to the next level: they have their bottom lights that hide their approach to the
    prey.


    One of the surprises in recent marine biology coming from the deep scattering
    layer, aside from the discovery of the layer itself, has been the encounter of
    a genuine monster living. The first megamouth shark was discovered in deep water
    off Hawaii in only 1976. By 2014, over fifty others had been captured or at least
    reliably sighted. Although the megamouth reaches a length of at least eighteen
    feet and weighs up to twelve hundred pounds or more, it is its enormous mouth
    paradoxically has small teeth and in any case does not bite; it opens wide and
    funnels in smaller crustaceans and other plankton, the same method used by the
    equally harmless manta rays, whale sharks, basking sharks, and baleen whales.


    If giants still swim unseen on moonless nights beneath ships across the vastness
    of the sea, what other surprise awaits us in the smaller creatures swarming among
    them? That question is very much on the minds of scientists. In order to find
    the most extreme and least-known forms of life, they have begun to hunt more thoroughly
    for ocean microbes, some of which in particular turn out to be the smallest known
    organisms on Earth.


