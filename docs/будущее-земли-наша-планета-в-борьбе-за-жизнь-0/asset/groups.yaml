    > The time has come to unyoke our steaming horses.


    —VIRGIL, *The Second Georgic*

    (Translated by David Ferry)


    # CONTENTS


    Prologue


    # PART I. The Problem


    + 1. THE WORLD ENDS, TWICE

    2. HUMANITY NEEDS A BIOSPHERE

    3. HOW MUCH BIODIVERSITY SURVIVES TODAY?

