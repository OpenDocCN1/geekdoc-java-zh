    being equal, the ability of organisms to function through seasons and across different
    habitats gave them an edge in the constant struggle to survive and reproduce.


    Little wonder, then, that neurobiologists have found the human brain to be densely
    sprinkled with partially independent centers of unconscious operations, along
    with all of the operators of rational thought. Thought through the cortex in what
    may look like first random arrays are the headquarters of process variously for
