    Fiji, and the Marianas—continued nine to seven centuries ago through the colonization
    of the most remote islands of Hawaii, New Zealand, and Easter Island. A few of
    the surviving species teeter on the brink of extinction today. Two-thirds of the
    nonpasspasser Pacific birds, however, close to one thousand species, were extinguished.
    Thus some 10 percent of the bird species on Earth were wiped out during a single
    episode of colonization by relatively small groups of people.


