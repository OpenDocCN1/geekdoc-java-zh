    Another overarching principle of biodiversity is the greater richness of tropical
    environments over temperate environments, in both number of species and vulnerability.
    While the variety of aphids, lichens, and conifers increases poleward, a vastly
    larger number of other kinds of organisms increase in the opposite direction.
    For example, you can expect to find about fifty species of ants in a square kilometer
    of New England temperate forest (if you care to look) up to ten times number in
    a comparable area of forest in Ecuador or Borneo.


    A third principle of biodiversity worth noting is in the relation between its
    richness and the geographical range of the species comprising it. A large fraction
    of the species of plants and animals of temperate North America are distributed
    across most of the continent, but very few species range the same across tropical
    South.


    When these last two principles are linked, both entails the numbers of resident
    species, we find that on average tropical species are more vulnerable than temperate
    species. They occupy smaller ranges and thereby manage to sustain smaller populations.
    Furthermore, existing as they do among a greater array of competing species, they
    tend to be more specialized in where they live, in what they eat, and by the predators
    that hunt and eat them.


    A general rule to follow in conservation practice is therefore that, while clear-cutting
    a square kilometer of old-growth coniferous forest in Canada, Finland, or Siberia
