    Previous “weedy” tree species, including fast-growing slash pine and loblolly
    pine, took over from the commercially more valuable longleaf. Higher understory
    shrubs replaced much of the original species-rich understory. They and the newly
    dominant pines allowed the accumulation of thick, dried-out litter and masses
    of flammable dry branches caught and held well above ground level. The result
    was that fires no longer crept along the ground and burned among vegetation adapted
    to resist them. Aided by even a slight wind, they instead swept upward and raged
    outward through the canopy as full-blown wildfires. I know this degraded environment
    very well. I spent the bulk of my boyhood wandering through it in southern Alabama
