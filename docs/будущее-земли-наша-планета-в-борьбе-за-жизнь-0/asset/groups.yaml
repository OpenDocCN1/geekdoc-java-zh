    The crippling bottleneck I''ve just described has now been largely eliminated
    throughout the classification of all animals, algae, fungi, and plants. Crucial
    specimens, including the “type” specimens on the name was originally based, are
    photographed with a high degree of resolution. Their three-dimensional traits
    are made clear by computer software. The images are then uploaded to a website
    with a description and citations so that anyone in the world can see them with
    a few keystrokes. The entire literature of biodiversity is currently being scanned
    and will be made available online by a consortium of major universities and research
    institutes. The final product, called the Biodiversity Heritage Library, will
    eventually contain as many as five million pages. Meanwhile, the Encyclopedia
    of Life, designed to summarize and present most available information on all described
    species at the time of writing (2015) approaching 1.4 million, with more than
    50 percent of all the known species in the world. Complementary projects with
    additional knowledge, which grow as data added, include the Global Biodiversity
    Information Facility, Map of Life, Vital Signs, USA National Phenology Network,
    AntWiki, FishBase, and not least GenBank, the immense, publicly accessible repository
    of DNA sequences. In a nutshell, the digital revolution has propelled the classification
    of life forward by decades, perhaps centuries.


    As the databases in all these grow, new methods are being developed to convert
    their content into search engines to aid the rapid identification of specimens.
    By far the most potent is barcoding. The key is the DNA sequence of mitochondrial
    genes, which lie outside the nucleus in each cell, hence are inherited only through
    the mother. One segment in the gene CO1, comprising only six hundred fifty base
    pairs, is particularly useful because it varies immensely from one species to
    the next. Read CO1, and in most cases, perhaps all cases, biologists can name
    the species—providing it to known science. They can also match very dissimilar
    life stages, such as caterpillars with the adult butterflies into which they metamorphose.
    In the manner of forensic science, they can even identify tiny fragments of organisms
    to the correct species. And for the first time, it is possible to distinguish
    species so similar in anatomy that they cannot be separated by standard taxonomic
