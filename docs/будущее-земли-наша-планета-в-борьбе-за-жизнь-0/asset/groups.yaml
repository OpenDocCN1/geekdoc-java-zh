    # 10


    # CONSERVATION SCIENCE


    Like most mistaken philosophies, the Anthropocene worldview is largely a product
    of well-intentioned ignorance. Its call for a new, human-centered approach to
    conservation—more precisely anti-conservation—has multiple sources. First is a
    false image of the history of conservation organizations. Second is an inadequate
    grasp of the biodiversity database. A third, less obvious source is the mistaken
    emphasis on ecosystems as the key level of biological organization, to the near
    exclusion of species and genes.


    To suggest—as hard-core believers in anthropocentrism do in promoting the “new
    conservation”—that the agendas of the traditional conservation organizations give
    scant attention to the welfare of people is simply wrong. From personal experience
    during thirty years of service on the governing and advisory boards of several
    leading global organizations, I know very well that the opposite is true. I was
    present, when, during the 1980s, the World Wildlife Fund–U.S. radically broadened
    its guidelines. We began by debating the intent and purpose of the organization.
    Which groups of animals and plants to protect, which parts of the world, and how,
    and,'
  - '[PAGE 73]


    finally, why? Was it enough to stay with a few charismatic animals and plants,
    trusting they would function as “umbrella species” that shelter the rest of the
    life around them? And how might saving the big and beautiful of the natural world
    also serve humanity? Surely it was wrong—and ultimately futile—to fence off nature
    reserves from people already living in them or close by.


    Our solutions were adopted in two steps. First, we expanded our attention from
    the panda-tiger class of star species to include entire ecosystems, even without
    those familiar to the public. Next, we set out as a policy to assist the economy
    and health care of people living in and around the nature reserves.


    Other conservation organizations have similarly altered their activities to bring
    humanity to center stage. Conservation International, for example, has put a focus
    on assisting government leaders in developing countries, suggesting ways to protect
    biodiversity as part of improvement of the economy and quality of life of its
    rural people. The Nature Conservancy has always been people-minded by assuming
    stewardship of biologically rich land and opening it to the public, including
    ecology and biodiversity researchers. Rare, a successful small conservation organization,
    has focused on star species and natural ecosystems as a vital part of the culture
    of local people.


    Leaders in biodiversity research and conservation have long understood that the
    surviving wildlands of the world are not museums. They are not gardens to be arranged
    and tended for our delectation. They are not recreation centers or harbors of
    natural resources or sanatoriums or undeveloped sites of business opportunities—of
    any kind. The wildlands and the bulk of Earth’s biodiversity protected within
    them are another world from the one humanity is throwing together pell-mell. What
    do we receive from them? The stabilization of the global environment they provide
    and their very existence are the gifts we give to us. We are stewards, not their
    owners.


    A prediction can’t be made of the damage from procedures suggested by Anthropocene
    ideologists, in particular their half-wild gardens, alien and new hybrid species,
    and business-friendly landscapes. The meerness of the literature they consult
    suggests that writers proposing such measures are largely unaware of the content
    and structure of the ecosystems they recommend be put under siege. It is instructive
    therefore to proceed to the'
  - '[PAGE 74]


    Great Smoky Mountains National Park, one of the best-studied American reserves,
    and to reflect briefly on the breakdown of the numbers of known species in each
    group of organisms. The data are summarized in the table at the end of this chapter.
    Fifty thousand person-hours of search by research specialists and trained volunteers
    have yielded records of eighteen thousand two hundred species. The actual number,
    especially when all suspected but still unrecorded transient species and microorganisms
    are added, has been estimated to lie between sixty thousand and eighty thousand.


    If any of the eighteen thousand two hundred species seem superfluous to you, please
    think again. They are just unfamiliar to you, as they are to many of the most
    devoted scientists as well.


    There exist in the Great Smoky Mountains National Park proboscis worms and symphylans
    that might be removed without major consequence to the remaining biota (here I
    could easily be wrong), but I am sure that very few of the remainder could be
    eliminated without the serious decline of some other group of species. To illustrate
    this principle, consider the consequences of extinguishing any block of five that
    you might randomly choose from the list in the table—for example, nemerteans,
    mollusks, annelids, tardigrades, and arachnids. The extirpation of any such block
    of five would perturb the ecosystem, and even trigger a collapse of the whole.


    It follows that no study of a self-sustaining natural ecosystem can be entirely
    sound without a full biodiversity census of the kind under way in the Great Smoky
    Mountains National Park. And that is just a beginning. Far more information is
    needed, including where each species lives, and when it is active, its life cycle,
    its population dynamics, its interactions with other species within and outside
    the ecosystem. And even within taxonomic groups, as all the swallowtail butterflies
    collectively or all the birds of prey or land snails or orb-weaving spiders and
    on through the full taxonomic roster, there typically exist great differences
    among species in basic biology and impact on other organisms.


    When a graduate I first visited the Great Smoky Mountains National Park, I was
    fascinated by springtails, part of the group listed in the table as Collembola.
    These tiny and very elusive creatures possess a lever beneath their bodies, free
    at one end and attached at the other, allowing it to be opened and closed like
    a jackknife. When the collembolan is approached by a predator, it releases the
    free end, and the lever strikes the ground.'
  - '[PAGE 75]


    Milligram for milligram, the strike is one of the most powerful locomotory forces
    in the animal world. It carries the collembol high into the air and forward as
    far as, for humans, would be the equivalent length of a football field.


    In the larger picture of natural history, however, this maneuver is only a part
    of the story. The evolution of predator and prey has often been said, is an arms
    race. It happens that certain kinds of ants have developed ways to best the collembolans
    at their own game. They use one or the other two techniques to defeat the high
    jumps of the prey. One is to put so many huntresses into the field that when a
    collembolan jumps away from one, it lands close to another.


    The other adaptation is one of the most precise and exquisite hunting techniques
    in the entire animal world. I''ve studied in several species of ants belonging
    to a taxonomic group called the Dacetini. The ant releases a scent from its waist
    which attracts colloans. Sensing the approach of a collembolan, the ant freezes.
    Then, guided by odor receptors on the tip of its two antennae waved by side, it
    moves slowly toward the prey. Its long-toothed mandibles are spread widely, in
    some species have more than 180 degrees, locked in position, poised to strike.
    Two long hairs extend forward, out of the way of the open mandibles. When one
    or both touch the collembolan, the mandibles snap shut—instantly, faster than
    the eye can follow, faster than the collembolan can spring away. The mandibles
    impale the prey with the teeth lining their inner surface. The collembolan then
    releases its lever instantly afterward, to no avail—predator and prey remain locked
    together as they travel through the air.


    One reality as I entered the park, I lifted a piece of bark from a fallen log
    (permission from a ranger) and saw three tiny symphylans, another group of reclusive
    insectlike creatures on which the collembolhunting ants sometimes feed. These
    creatures, belonging to a special group of symphylans called jalapids, have a
    pair of pincers on their rear ends. Although there are many species of these worldwide,
    very little is known about any part of their biology. What is their preferred
    food, what is their life cycle, why are these pincers in such an unusual position?
    I have no idea. Nor can I, or any other biologist, guess what would happen if
    all were to disappear. What I thought at the moment was that if I had another
    lifetime to live, I could easily devote it to symphylans.'
