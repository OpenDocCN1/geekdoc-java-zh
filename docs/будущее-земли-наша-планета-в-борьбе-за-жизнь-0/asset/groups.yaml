    a pleasure to see such a program in action.


    Even in the most favorable circumstances, a nagging problem of biodiversity restoration
    is determining its baseline. Natural ecosystems change over time, across millennia,
    centuries, and sometimes even decades. The species composing them change genetically,
    enough in tens or hundreds of different species. In some kinds of plants, new
    species can originate in one quick step by the hybridization of two species followed
    by the doubling of the hybrid’s chromosomes, or even just the doubling of chromosomes
    in one species alone. So, how far back in time restorers go in establishing the
    baseline goal of their interventions?


    The seeming arbitrariness of the baseline has been used by Anthropocene enthusiasts
    to accept pauperized floras and faunas as they are, infiltrated by invasive species
    to constitute “novel ecosystems.” To lower the bar in such a manner reflects ignorance
    and unacceptable carelessness. Instead, each puzzle of the baseline can and should
    be analyzed at the species level, with the composition of the floras and faunas
    tracked back in time to detect major changes.


    The species composition immediately prior to the first major shift that can be
    ascribed to human activity on the basis of fossil and present-day evidence is
    the baseline tested and preferred by scientists. Gorongrosa National Park, it
    is the late Pleistocene prior to invasions by Neolithic people from western Africa.
    On the U.S. Gulf of Mexico coast, it would be just before the start of the European
    excursion or the later clearcutting of the longleaf pine, the keystone species
    of the great savanna.


    One successful case of baseline choice out of many possible has been the aforementioned
    restoration of the kelp forests lining the North American Pacific coasts. When
    the sea otter was driven to near extinction by the fur trade, the sea urchins
    for which it was the principal predator prodigiously, consuming kelp until the
    forests were replaced by “sea-urchin barren.” With the sea otter protected and
    allowed to multiply to its original population level, the kelp returned, along
    with the large number of marine species dependent on it. At the opposite extreme,
    a far more difficult challenge is the restoration of Ireland’s primal forests,
    the last remnants of which were obliterated centuries ago. Its signature remaining
    ecosystems are the raised peat bogs.'
