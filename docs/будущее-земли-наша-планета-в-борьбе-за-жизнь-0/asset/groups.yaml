    It conjures up what we personally know or think we know. The double name forms
    the basis of a hierarchy suited to the way the human actually works. In repeating
    it over and over, listening to the sound of it and sensing the unknown, it is
    the poetry of science.


    Biologists define a species as a collectivity of individuals that breed with one
    another under natural conditions. I''ve earlier cited as an example the lions,
    which are close relatives of the tigers, Panthera tigris. The name Panthera denotes
    the genus comprising these big cats that are genetically close to one another
