    圭亚地盾。圭亚纳和苏里南这两个小国，邻法属圭亚那仍有70至90%的地区被原始的与亚马逊相关但独特的雨林覆盖。它们的动植物极其丰富，仍然是世界上探索最少的地区之一。


    特普伊（TEPUIS）。这些平顶山是H.G. 威尔斯和好莱坞想象中的“迷失的世界”。它们局限于委内瑞拉和圭亚纳西部，由环绕着雨林的古老石英质砂岩组成。它们或平坦的山顶海拔从一千到三千米不等。它们确实是自成的世界，气候与低海拔地区截然不同，拥有壮丽的岩石形成和瀑布（安赫尔瀑布是世界最高），其动植物与下方的地不同，不同桌山之间也各不相同。


    秘鲁大马努区地区。领先的热带生物学家艾德里安·福赛斯（Adrian Forsyth）捕捉到了这一地区的魅力，“这里全球最大的赤道冰体在雄伟奥桑加特峰的环绕下，耸立在岩石坡和普纳草原之上，并转化为没有道路的雨林，景观透过山地森林向下延伸。任何站在马德雷德迪奥斯亚马逊林地中的人，一眼就能看到一个压缩的全景。”河流北部存在着地球上最密集的生物多样性，包括一系列新世界哺乳动物。一个简单的平方公里就能栖息与整个美国大陆地区数量相同的蛙类物，以及鸟类和蝴蝶数量的两倍。同样的独特性甚至更高也适用于更北部的厄瓜多尔传奇的亚苏尼国家公园的雨林。


    中美及北部安第斯山脉的云林和山顶森林。这些凉爽、湿润的环境在气候和生物多样性上与下方的低地森林都有不同。其中许多地方尚未被开发，包含大量仍未知的物种。小面灵（olinguito）的发现——世纪以来发现的首种大型食肉哺乳动物——是那些仍然隐藏着事物的象征。


    帕拉莫草原（PÁRAMOS）。这些位于南美的高海拔（2,800至4,700米）草原包含了许多独特的草类、草本植物和木本灌木。它们还因新物种演化速率高而脱颖而出——可能是由于破碎的山顶环境中的气候波动。尽管每一处都仅比周围的低地雨林高几公里，但在物理和生物上都是一个不同的世界。它们的植物群是独特的，而其狭小的面积使其生物多样性变得非常脆弱。


    南美大西洋森林。在葡萄牙语中被称为Mata Atlântica，这一广阔而壮丽但现在已大幅减少的生态系统沿着巴西大西洋海岸延伸，从北部的里奥格兰德北方尔特到南部的里奥格兰德·杜苏尔州，并小范围延伸至巴拉圭和阿根廷（换句话说，从巴西“鼻子”尖到巴拉圭东南部）。它的纬度和降水量的巨大变化使其具有异常的生态系统多样性，涵盖从热带到亚热带森林（湿润和干旱），以及灌木丛和草原。在它们的领地内存在着各种稀有和不常的动物，包括马克·莫菲特（Mark
    Moffett）描述的，“最原始的豪猪；跳舞蛙和食果蛙；巨雉，剩余的几只个体在两名鸟类农主的私人土地上游荡；新世界最大的灵长类动物巨脸猴；所有灵长类中最色彩斑斓的金丝织网猴；基马马达岛的金线矛头蛇，那里的密度达到了已知任何蛇类的最高水平（难怪，“蛇岛”上没有人居住）。”


    塞拉多（THE CERADO）。塞拉多覆盖了巴西中东部大部分，是南美最大的草原，也是全球热带栖息地中生物多样性最丰富的。其丰富的生命种类源于其构成的清晰生态系统马赛克，从带有散布木林丛的典型开放草原到成片的类雨林高树林，以及沿河分布的茂密廊林。遗憾的是，对于生物多样性来说，这里的土壤有利于农业，塞拉多的栖息地正被迅速清除，而保护区内的保护极少。


    潘塔纳尔（THE PANTANAL）。地球上最大的湿地之一，大部分位于巴西南部并延伸至玻利维亚，这片壮丽的洪原在雨季节有80%的区域没在水中，是各种水鸟和昆虫的常年家园，也是美洲豹、水豚和其他富有魅力的大型哺乳动物的家园，包括丰富的类鳄凯门鳄。尽管被列为世界遗产地并吸引了越来越多的游客，潘塔纳尔仍承受着沉重的农业和畜牧业负担。


    加拉帕戈斯群岛（THE GALÁAGOS）。这座位于厄瓜多大陆西部926公里的赤道群岛因查尔斯·达尔文在1835年在那里的五周访问而获得了标志性地位。在回家的途中，他注意到画眉在不同岛屿之间有所不同，这使他构思了进化论。但加拉帕戈斯群岛特殊还有另一个原因：从少数能够跨越海洋并殖民岛屿的物种中演化出了许多特别适应荒凉火山景观的物种。巨龟、海鬣、演化成树木的葵菊科草本、从单一祖先演化并填补六个生态位的鸟类等，使岛屿既是演化生物学的实验室，也是教室。


    ## 欧洲


    波兰和俄罗斯的比亚沃维亚森林（BIAŁOWIEZA FOREST）。这是曾覆盖欧洲西北部平原直到新石器时代黎明的原始森林残存的最大碎片。它横跨波兰和白俄罗斯边界，保护区涵盖了近两千平方公里。欧洲大部分哺乳动物生活在这一范围内，其中最著名的是欧洲野牛（曾多次险些逃离灭绝）、欧洲鹿、驼鹿、野猪（一种波兰森林马）、猞猁、狼、水獭、白鼬。


    贝加尔湖（LAKE BAIKAL）。位于俄罗斯西伯利亚，面积为31,722平方公里，最大深度1,642米，是世界上最老、最深的淡水湖。正如其水量所预期的，它还拥有极其巨大的动物群，包括二千五百种植物、鲈科鱼类、海绵、蜗类和足甲类。像加拉帕戈斯群岛一样，贝加尔湖既是生物多样性的避难港，也是进化的实验室。


    ## 非洲和马达加斯加


    埃塞俄比亚的正教森林（THE CHRISTIAN ORTHODOX FORESTS）。埃塞俄比亚北部原生森林仅存不足5%，它们几乎完全局限于散布在褐色景观中的绿色斑块。正如玛格丽特·洛曼（Margaret
    Lowman）所写的，它们包含了“原生植物的种子库、许多园艺作物的授粉者、淡水泉、植物药、水资源保护和碳汇。”


    索科特拉岛（SOCOTRA）。这是一个位于也门以南352公里的印度洋孤岛（带有若干卫星岛），岛上生长着形状和叶片奇特的树木和灌木，使其赢得了“另一个加拉帕戈斯”和“地球上最像外星的地方”的美誉。在这里你会发现龙血树、岩生的索科特拉龙血、齿芦以及与其他地区形态相似的其他植物物种。索科特拉还拥有约两百种类，其中八种是该群岛特有的。


    塞伦盖蒂草原生态系统（THE SERENGETI GRASSLAND ECOSYSTEM）。世界上最著名的陆地野生生态系统无疑是巨大的塞伦盖蒂（在马语语中意为“无尽平原”），横跨从坦桑尼亚北部到肯尼亚西南部的广大区域。其大部分地区以及肯尼亚大部分受到国家公园、保护区和狩猎保护区的保护。这里的动植物群，尤其是大型哺乳动物，最接近自第四纪时代以来一直生活在非洲热带草原和草原的原始物种。


    莫桑比克的戈龙戈萨国家公园（GORONGOSA NATIONAL PARK）。该国顶级保护区通过其内部发现的多样栖息地完整呈现了东南非非洲的生物多样性，包括一条海拔近两千米的山脊，山顶覆盖着雨林、米木干旱森林、多条河流溪流，以及被雨林覆盖且两侧为石灰岩峭崖的峡谷，后者上面布满了许多尚未被探索的洞穴。戈龙戈萨的大型动物在1978年至1992年内战期间被逼近灭绝，并在遭到大规模盗猎后，正在迅速恢复。


