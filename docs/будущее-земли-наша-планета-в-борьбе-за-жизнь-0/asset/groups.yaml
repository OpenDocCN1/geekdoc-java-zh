    生活在腐烂木材内部及上面的甲虫。阿尔弗雷德·埃德蒙德·布姆（Alfred Edmund Brehm），1883–1884。


    # 14


    # 无形的帝国


    ![](img/f03e757fcddd4aaceb89b9f39b980fec_105_0.png)


    本世纪初，纽约探险家俱乐部的成员面临着未攀登的山峰、未行走的极地冰盖和未造访的亚马逊部落的供应日益减少。2009年，他们通过将生物多样性纳入研究范围来适应现状，事实证明这是一个明智的选择。对生物多样性的探索为科学家和冒险家提供了地球星球上剩余的最伟大的身体冒险。


    值得注意的是，对生物多样性的新重点还包括对我们身体内植物植物群进行的一次良好的检查。快速测序微生物DNA的能力揭示了每个健康的人体内都包含一系列主要由细菌组成的平衡生态系统。与其他生物体内的微生物一样，它们对它们的人类宿主最友好。生物学家将它们称为“互利共生体”，它们既从与其共生的植物或动物中获益，又作为回报提供益处。


    普通人类口腔和食道中生活着五百多种此类细菌。通过形成一个适应性良好的微生物雨林，它们保护了身体的这部分免受有害寄生细菌的侵害。共生失败的代价就是外星人的入侵、牙菌斑的堆积、龋齿和牙周病。


    在胃肠道的每个后续部位，其他专门细菌的菌落在消化和处理中起着至关重要的作用。人体细胞的平均数量至少达到万级——根据多次估算得出的数字是四千万。我们微生物组（现在已如此命名）中的细菌平均数量至少高出十倍。为了说明这一点，微生物学家开玩笑说，如果生物分类完全基于每个生物体内DNA的优势，那么人类将被归类为细菌。


    得知微生物组出现在医学科学和实践中并不令人意外。研究人员越来越多地调查共生体在广泛健康问题中的作用，这些问题通常发生于胃肠道，但也包括肥胖、糖尿病、易感染性，甚至某些形式的精神疾病。微生物组是一个相互锁定的的生态系统阵列，其物种需要保持多样性并在正确的平衡状态。简而言之，大部分医学实践将变成一种细菌园艺。


    在人类和其他动物体内生长的花园是世界各处复杂生态系统的典型。全球范围内栖息在动物和植物中的微生物组种类总数仍然完全未知，但可能是巨大的。微生物学家发现，栖息在食木蚂蚁体内的微生物与肉食动物携带的微生物截然不同，对于青蛙和蚯蚓等其他生物更是如此。显而易见，涵盖这些系统的共生微生物学已成为科学领域令人兴奋的前沿，并在未来几十年内保持如此。


    微生物学科学于1600年代末由安东尼·范·列文虎克（Antonie van Leeuwenhoek）创立的，当时他发明了观察细菌的显微镜。近四年后，由美国人卡尔·沃斯（Carl
    Woese）领导的生物学家首次意识到，古菌这类微生物在DNA上与细菌截然不同。这一发现挑战了生命树的基本结构以及我们对早期演化的认知。生命树是一幅分支图，显示了物种与物种群之间的祖先关系，从而追踪了早期生物产生晚期物种的演化过程，这种过程跨越了百万年，而在某些情况下则在几千年内保持未分裂。


    在沃斯和他的同事之前，标准分类法承认五个界：原界（由细菌和古菌组成）、原生界（包括履虫、变形虫和其他单细胞生物）、真菌界、植物界和动物界。沃斯之后，生命被分为三个巨大的“域”：缺乏细胞核的微生物细菌；新定义的古菌，结构与细菌相似但同样缺乏细胞核；以及具有细胞核的真核域，包含了所有已知生命形式——原生生物、真菌、藻类和植物。DNA比较揭示了真核生物在尺寸上（我们观察和关注的属性）具有优势，而细菌和古菌在数量和全球分布上占据着统治地位，自生命起源以来一直如此。


    微生物世界的遗传多样性与生命的其他部分截然不同。人类和土豆在DNA序列上的相似性，比最不相似的细菌之间的相似性还要。生物学家不知道地球上细菌物种的数量。可能是数千万、几亿个。目前，甚至还没有细菌和古菌物种的精确定义。个体生物的杂交性进一步使情况变得复杂。细菌细胞有多种方式从其他细胞获取基因，无论亲疏远。它们通过从环境中收集DNA片段来实现这一高科技成就；通过这些准生物在将DNA输送到病毒宿主细胞的过程中从逆录病毒拍摄片段；最后通过接合，这是一种异常复杂的操作，在此过程中两个细胞结合并交换自身的相似DNA片段。

