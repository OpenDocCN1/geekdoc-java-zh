    ## 僵尸主宰

    作为演化特异性的第二个例子，考虑寄生虫的巧妙。欧洲服尺蛾的幼虫（毛毛虫）白天通过躲在树皮下躲避鸟类和其他捕食者。当夜幕降临，它们会爬上树冠进食叶子作为晚餐。当这些毛毛虫感染一种病毒（特别是核多倍体病毒）时，其白天的行为会发生反转，这种病毒会以致命的有效性席卷整个服尺蛾种群。病毒会诱导大脑发生变化，导致毛毛虫在白天爬到树顶。在顶部，它们的身体会液化，并释放出一云病毒来感染其他的毛毛虫——尤其在雨水的帮助下。类似的僵尸化控制还由冬虫菌实施，真菌在蚂蚁觅食植物时感染蚂蚁。蚂蚁在临死前的最后一个动作是是用上颚夹住叶脉，这一动作将它们的尸体固定在原地。真菌从身体中生长出来，并将孢子散到空气中，落在其他身上。


    ## 骗子大师

    物种演化的精确性通常包含欺骗。自然界中充满了为了完成或辅助完成其生命周期而发出虚假线索的植物动物。其中最复杂的例子之一是发现于美国西南地区的一种拟甲虫（*Molo
    franciscanus*）。它利用一系列骗术来偷取与其同一栖息地常见的独栖蜂（*Habropoda pallida*）的资源。拟甲虫雌在蜜蜂经常采食花粉和花蜜的植物基部产卵。孵化后，甲虫幼虫爬上植物并聚集在一起形成一个小的球形物体。这些小骗子随后释放出一种气味，雌蜂利用这种物质来吸引同类的雄性。甲虫幼虫堆积在受骗的雄蜂背上。当甲虫接触到同种的真实雌蜂并交配时，甲虫幼虫离开并聚集在雌蜂背上。它们一直骑到直到雌蜂回到巢穴，无论那里在哪里，它们都会掉下来，吃掉那里储存的花粉、花蜜，以及她产下的卵。


    兰花是植物界的大型骗子。关于它们的欺骗手段可以写一整部百科全书。兰花由一万七千种组成，是花植物家族中最大的，它们利用各种技巧诱导昆虫将花粉传播到其他同种植物上。例如，有些兰花的形状像某些类蜂的雌性。当雄蜂降落交配时，它们得到的只有粘性的兰花花粉团，附着在身体上。其他的兰花品种通过释放雌性气味来吸引雄性。至少有一种物种会发出愤怒蜜蜂的味道，这吸引了捕食这些昆虫的蜂类。蜂类身上带着虚假的蜜兰花花粉团，最终反而授粉了兰花，而不是寻找同类的配偶或采集食物。


    ## 奴隶主

    社会性昆虫提供了许多极端适应的奇特例子。在北方温带地区，数百万年的蚂蚁奴隶制上演了充满欺诈的大大戏。有许多物种会袭击其他蚂蚁物种的群，并在赶走防御性的成年体后，绑架处于蛹期的未成年后代。掠夺者随后将俘虏（让它们从蛹中孵化）作为奴隶抚养，以增加自己的劳动力。在极端情况下，奴隶主就像古老的的斯巴达战士一样，完全依赖奴隶的日常劳动。这种欺骗基于蚂蚁的一个普遍特征：工蚁在从蛹中孵化为成年体后，它们在最初的几天里会痴迷于周围蚁群的气味。从那一刻直到死亡，俘虏们都将奴隶主视为姐妹，尽管奴隶主正如其实质那样压迫它们。


    奴隶主是凶残的战士。有些个体配备了强大的镰形大颚，用于杀死或致残它们目标群落的防御者。我研究的一种物种通过“宣传性”物质达到了同样的效果。在攻击期间，掠夺者会释放大量的化学物质，这种物质作为防御者的警报信号。被围的工蚁会陷入恐慌，就像人类突然被周围高音量播放的火灾警报声包围一样。掠夺者本身不受干扰；它们会被自己自身的费信息气味所吸引。


    如果被要求在没有俘隶劳动的情况下生活，奴隶主会怎样？一天，我决定通过从实验室饲养的奴隶主蚁群中移除所有奴隶来寻找答案。战士们被孤立且没有以前的经验，开始尝试以前留给奴隶的任务。但它们的表现很糟糕。它们照顾幼体的方式非常草率，捡起幼虫和蛹带着它们走一会儿，然后把它们掉在错误的地方。它们完全无法将食物带回巢穴，即使我把碎片放在入口处。


    如果奴隶主从它们各种物种所栖息的许多生态系统中消失，会发生什么？我不知道——寄生虫的影响是一个完全独立的领域。


    ## 巨型杀手

    自然历史学家在首次研究之前未知的物种时往往感到惊讶。例如，在反思动物间捕食的普遍现象时，自然历史学家倾向于假设捕食者和猎物的大小大致相同，或者捕食者大得多。然而，例外是存在的。鸟类啄昆虫。一群狼可以在深雪中带走一头驼驯，一群狮子有时可以让大象丧失行动。尽管如此，捕食者和猎物之间的重量差异通常不超过十倍。然而，在南美洲物种
    *Azteca andrea* 的戏剧中发现了许多例外，它们生活在南美洲热带雨林的一种阔叶树 *Cecropia obtuse* 上。多达八千只工蚁并排排列在单片粗尾树叶的下缘。它们张开大颚等待，准备好立即行动。当昆虫落在叶子上时，伏击者从四面八方冲上来，并共同将其固定。这意味着几乎任何大小的昆虫猎物都能被捕获。被带到安全处的重量是单个工蚁的13360倍。这种令人惊叹的类人创新在自然界中似乎很少见。


    我选择上述物种相互作用的例子在自然界中非常独特是有目的的。首先是为了引起你的注意力，当然；昆虫不是每个人喜欢的动物。但它们也说明了生态系统研究的一个重要原理。想象在物理范围内地球上演化出的任何生态位。（例如，没有动物能以每小时百英里的速度跑步或消化矿石。）地球数百万物种中，可能会有一个或多个占据你选择的生态位。要将这一原理从物种扩展到生态系统，最好的方法莫过于《物种起源》结尾的感叹：


    “观察一个错综复杂的树枝，上面有许多种植物，鸟类在灌丛中歌唱，各种昆虫在周围飞舞，蠕虫在潮湿的土壤中爬行，并反思这些构造精致的形式，彼此如此迥异并以如此复杂的方式相互依赖，都是由我们周围作用的法则所产生的。”


    对于那些认为自然主要由植物和大型脊椎动物组成的人，我说看看你们周围运行地球的小型生物。对于那些认为自己可以用少数物种的数学模型来洞察生态系统运作的人，我说你们住在梦世界里。正如成功的医学依赖于解剖学和生理学的知识，保护科学依赖于分类学和自然历史的知识。对于那些认为受损的生态系统会自我修复，或者可以通过用功能性的外来物种替代原始原生物种来安全恢复的人，我说在你们造成伤害之前再想一想。


