    # 16


    # HISTORY REDEFINED


    History is not a prerogative of the human species. In the living world there are
    millions of histories. Each species is the inheritor of an ancient lineage. History
    exists in a point of space and time after a long journey through the labyrinth
    of evolution. Each twist and turn has been a gamble with the species’ continued
    existence. The players are the many ensembles of genes in the population. The
    game is the navigation of the environment in which the population lives. The payout
    is the share of breeding individuals in the next generation. The traits prescribed
    by the genes that sufficed in past generations might in the future continue to
    do so, but not. The environment is also changing. In new environments the genes
    may keep on winning, allowing the species to survive. Some of the variants of
    the genes, having arisen by mutation or forming new combinations, might even cause
    the species population to grow and spread. But at any time in a changing environment,
    the species could lose this game of evolution, and its population would spiral
    to extinction.'
  - '[PAGE 133]


    The average life span of a species varies according to taxonomic group. It is
    as long as tens of millions of years for ants and trees, and as short half a million
    years for mammals. The average span across all groups combined appears to be (very
    roughly) a million years. By that time the species may have changed enough to
    be called a different species, or else it may split into two or more species—or
    vanished entirely to join the more than 99 percent that have come and gone since
    the origin of life. Keep in mind that every surviving species (including us) is
    therefore a champion in a club of champions. We are all best of the best, descendants
    of species that have never turned wrong in the maze, never lost.


    The history of a species is thereby an epic. maybe not in this century given the
    huge number of other species still alive in the biosphere, scientists might get
    around to studying the biology of any randomly selected species in total depth.
    They will explore its life cycle, its anatomy, physiology, genetics, and ecological
    niche. They will learn as much as possible about its geological history. Fossils,
    when available, will help them immensely. But more likely, its history will be
    inferred by comparisons with other species that most closely resemble it. The
    idea is to place it in the family tree of the most closely related species. With
    the aid of DNA sequencing, the researchers will determine which living species
    it arose. Their common ancestors will be traced back, as in human genealogies,
    joined inward toward many twigs and branches. The genetic analysis, joined to
    the evidence of the species’ inherited biological traits, will reveal where the
    relatives now live, where they lived in the past, and what their traits may have
    once been. An evolutionary family tree of this kind is called a phylogeny. Its
    reconstruction will be the closest we ever get to telling the species’ epic. But
    as more and more such stories are written, principles in the history of life will
    be clarified. The living world around us will make more and more sense, continuing
    for all time to come.


    The human species, of course, has an evolutionary history, which reaches very
    far back in traditional recorded history. We, too, are the twig-end of a phylogeny.
    The multitud stories of human cultures are epics in the usual sense, but you will
    understand that the traits of human nature that have molded these stories are
    also products of evolution. We have our australopith cousins and our australopith
    forebears, together with grandmother Homo habilis and our mother Homo erectus.'
