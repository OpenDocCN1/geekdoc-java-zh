    In simplest terms, both shrinkage of the ecological footprint and the resulting
    improvement of biodiversity conservation are favored because of the acceleration
    of the replacement of extensive economic growth by intensive economic growth.
    Extensive economic growth, which prevailed through the twentieth century to the
    present time, is the increase of capita income by adding more capital, more population,
    and more undeveloped land. Intensive economic growth is that generated by the
    invention of high-performance new products added to the improved design and using
    of existing products. The iconic example of the transition is Moore''s Law, for
    its inventor Gordon Moore, cofounder of Intel (and incidentally a leading activist
    in global conservation): the cost of microchip transistors will fall because the
    number that be etched into a fixed area of computer microprocessor will double
    every two years. The law held between 2002 and 2012, with production rising from
    2.6 million per dollar to twenty million per dollar, before beginning to level
    off.


    A closely linked consequence of economic evolution in the twenty-first century
    is the shift in worldview wealth based on quantity to quality based on, with the
    latter made through ecological realism. The central idea is to view the entire
    planet as an ecosystem, to see Earth as it is and not as we wish it to be. Given
    that stability in the economy and in the environment are closely linked, both
    require striving for quality of life through self-understanding as opposed to
    the conventional accumulation of material wealth, based on the assumption that
    the wealth can eventually be traded for quality of life.


    The ecological-realism worldview has been expressed with resonance in People and
    the Planet, a report of Britain’s Royal Society. Its recommendations have been
    endorsed by the global network of national science academies.


    In the most developed and the emerging economies unsustainable consumption must
    be urgently reduced. This will entail scaling back or radical transformation of
    damaging material consumption and emissions and the adoption of sustainable technologies,
    and is critical to ensuring a sustainable future for all. At present, consumption
    is closely linked to economic models based on growth. Improving the wellbeing
    of individuals so humanity flourishes rather than survives requires moving from
    current economic measures to fully valuing natural capital. Decoupling economic
    activity from material and environmental throughputs is needed urgently.'
