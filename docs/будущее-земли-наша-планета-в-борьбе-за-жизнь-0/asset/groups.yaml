    are now fully available or soon be. Each will yield more and better results with
    less per-capita material and energy, and thereby will reduce the size of the ecological
    footprint.


    In viewing this future I wish to suggest a means to achieve almost free enjoyment
    of the world''s best places in the biosphere that I and my fellow naturalists
    have identified. The cost-benefit ratio would be extremely small. It requires
    only a thousand or so high-resolution cameras (small and unobtrusive, thanks to
    the continuing information technology revolution) that broadcast live around the
