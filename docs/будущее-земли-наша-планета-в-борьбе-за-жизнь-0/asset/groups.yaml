    # 17


    # THE AWAKENING


    Earth is a Goldilocks planet, not close enough to its star to be burned to a crisp,
    not far enough away to be locked in eternal ice. Life began on this planet more
    than three billion years ago, yet on Antarctica there is part of the biosphere
    that could not advance. Elsewhere, and even close by the icy waters of the Antarctic
    shallow sea, life flourished and diversified. But inland, at Lake Untersee in
    the mountains of Queen Maud Land, possessing an environment closer to that of
    Mars than Earth, evolution stalled. Dale Andersen, a research scientist at the
    SETI Institute, has described Lake Untersee as “a place few people have seen or
    even imagined.”


    The weather can be harsh at the terrain with winds and blowing reaching 110 mph.
    For four months the darkness is company only the sounds of cracking ice and the
    ever howling of the winds. The surrounding mountains rise majestically to soaring,
    pinnacled peaks, blocking the passage of the continental ice that surrounds them.
    The gentle slope of the Auchin Glacier flows from the north, halting at its edge.
    Lake Untersee within the mountains of Queen Maud Land is a world that resembles
    Earth’s earliest biosphere. One dominated by microbial life forming the same fabrics
    and structures that we see preserved in'
- md: '

    sediments dating back 3.45 billion years. Beneath the thick perennial ice-cover
    are cyanobacterial mats growing undisturbed as they did billions of years ago.


    Now suppose that the Antarctic terrain had been by happenstance the best for life
    with a different code and a different mode of star energy and mineral energy capture.
    The norm and the efflorescence of biodiversity might have been here as it is in
    Queen Maud Land, and the equatorial belt of the Amazon and Congo too hot to sustain
    anything but marginal, primitive life.


    It helps perspective to look at Earth as a whole this. If the approximately one
    billion years of evolution it took for the single-celled bacteria and archaea
    on our planet to evolve into more complex life-forms were added, it is possible
    to sense how delicate our birthplace is, how complicated those parts of the ecosystems
    that shelter each species are, and how intricate and intertwined are the nonlinear
    interactions of the species. Earth’s biosphere is like the orb of a spiderweb
    through which a bird has accidentally fallen. Beautiful order has instantly turned
    into chaos. The spider knows this risk instinctively, and builds across part of
    the web of silk so conspicuous that it virtually shouts at intruders to turn aside.


    Warning signs like that of the spider are all around us, yet the Darwinian propensity
    in our brain’s machinery to favor short-term decisions over range planning makes
    us ignore them. I''m reminded of a conversation I had in 2005 with a hydrologist
    at Texas Tech University. I had been impressed by the rich agriculture of the
    Texas Panhandle but aware of its dependence on irrigation with water from the
    Ogallala aquifer. Knowing that the water recharges at a much slower rate than
    its with withdrawal, I asked my companion how long it would last. “Oh, about twenty
    years, if we''re careful.” “What will you do then?” he replied, with a shrug;
    “Oh, we’ll think of something.


    I hope right, but the signs are not favorable. Here and elsewhere in marginal
    habitats, climate change and myopic thinking have taken a heavy toll. As deserts
    relentlessly across the Sahel of Africa, as Australia’s arid center presses outward
    against the coastal croplands, and as the Colorado River has no more to go to
    the water-starved fields of America’s Southwest, agriculturists will at last have
    to turn to dryland crops. They will need species characterized by deep perennial
    roots, and more drought-resistant grasses that bear edible seeds.


    The world as a whole is already well into a water crisis. About eighteen countries,
    home to half the world’s population, are draining their aquifers. In Hebei Province,
    in the heart of China’s northern grain belt, the average water level in the deep
    aquifer is dropping nearly three meters a year. Underground water levels are falling
    so fast in the lowlands of rural India that in some localities drinking water
    must be trucked in. One official of the International Water Management Institute
    has said, “When the balloon bursts, untold anarchy will be the lot of rural India.”
    In the Middle East, it is becoming clear that hatred and instability are not so
    much to religious differences and the memories of historical injustice as they
    are to overpopulation and the severe shortage of arable land and water.


    Earth’s more than seven billion people are collectively ravenous consumers of
    all of the planet’s inadequate bounty. Ten billion, give or take a billion, expected
    by end of the century, will be even more ravenous unless agrobiology and high
    technology can turn the tide. Agriculture faces other realities. At present we
    consume nearly one-quarter of Earth’s natural photosynthetic productivity: that
    much of the planet’s freshly manufactured biomass ends up in our hands and stomachs
    and the share is growing. The remainder of the planet’s productivity is left for
    all of the other species.


    The overall productivity of Earth at the present time can be summarized precisely
    follows. For the past thirty years at least, Steven W. Running of the University
    of Montana has reported, the land-based and primarily plant-based primary productivity
    (NPP) of the planet has remained almost constant, varying by less than 2 percent
    annually. Total global precipitation has varied by only 2 percent, and the global
    input of solar radiation, which drives photosynthesis, has fluctuated by less
    than 0.01 percent. Humans now co-opt for energy and fuel about 38 percent of the
    NPP. Humans can continue to increase and consume in a fuel that allows us to take
    over the remaining 62 percent? No, I’m afraid not, at least not through conventional
    agriculture. The unharvestable part is subtracted, it leaves only 10 percent of
    total global NPP available for additional use by humans, and that fraction is
    located mostly in Africa and South America. Unless a new Green Revolution can
    be engineered, human use will risk elimination of most of the remaining land-based
    biodiversity.


    The pivotal conclusion to be drawn remains forever the same: by destroying most
    of the biosphere with archaic short-term methods, we are setting ourselves up
    for a self-inflicted disaster. Across eons the diversity of species has created
    ecosystems that provide a maximum level of stability. Climate changes and uncontrollable
    catastrophes from earthquakes, volcanic eruptions, and asteroid strikes have thrown
    nature off balance, but in relatively short geologic periods of time, the damage
    was repaired—due to the great variety and resilience of the life-forms on Earth.


    Finally, during the Anthropocene, Earth''s shield of biodiversity is being shattered
    and the pieces are being thrown away. In its place is being inserted only the
    promise that all can be solved by human ingenuity. Some hope we can take over
    the controls, monitor the sensors, and push the right buttons to run Earth the
    way we choose. In response, the rest of us should be asking: Can the planet be
    a true spaceship by one intelligent species? Surely we would be foolish to take
    such a large and dangerous gamble. There is nothing our scientists and political
    leaders can do to replace the still-unimaginable.


    ![img/03e757a2b8f9](img/03e757a2b8f9)


    ## RESTORATION


    There are many wildernesses that, if simply alone, will endure. For a large majority
    of conservation projects, some amount of restoration, meaning human intervention,
    is necessary. Each project is special unto itself. Each requires knowledge and
    love of environment shared by partnerships of scientists, activists, and economic
    leaders. To succeed, it needs every bit of entrepreneurship, courage, and persistence.


    Large conservation programs, like new scientific disciplines, start with a hero.
    A few individuals push forward, risking failure and harm. They have a dream that
    does not fit the norm. They accept long hours, personal expense, nagging uncertainty,
    and rejection. When they succeed, their individual stories are then rightfully
    seen as epics. They become part of environmental history.


    During my work in nature parks and reserves, I have the privilege of working with
    two such pioneers in biodiversity conservation. Their heroic endeavors unfolded
    on different continents. The landscapes they restored had problems that at first
    seemed polar opposites, but these conservationists were motivated by the same
    prime movers: the love of the habitats they befriended and the perceived need
    to bring back keystone species.


    MC Davis of Miramar Beach, Florida, was (until his death from cancer in 2015)
    a very successful business entrepreneur whose wealth was built in good part from
    property management and the rehabilitation of small businesses. At his first way
    of life, focused on capital investment and development, seemed typical for an
    American businessman. But he was also an outdoorsman who explored the wild environments
    of his native Florida Panhandle with a special passion for science and education.
    Learning ecology with his own, MC discovered that the biodiversity of most of
    the Panhandle woodlands was a seriously disturbed condition. The principal cause,
    he learned, was the disappearance of the longleaf pine (Pinus palustris).


    The longleaf pine is a tall, stately tree that yields lumber of high quality,
    ranked with white pine and redwood among the best in the United States. Before
    the coming of Europeans, it was the dominant species on 60 percent of the Southern
    wildlands. Longleaf was not tightly arrayed into a forest, nor was it the most
    abundant tree within small forest scattered across the landscape. Rather, it ruled
    over an open savanna. Other tree species in its midst were sparse by frequent
    lightning-sparked fires. Longleafs survived because they evolved special resistance
    to the seedling stage, including rapid aboveground growth and deep roots. It is
    relatively easy to walk through an old-growth stand of longleaf pine, because
    the understory consists of a great variety of flowering species also adapted to
    survive the frequent fires.

