    在纯科学领域，它们的处境甚至比经济学更糟。与这种边缘科学并行的是，其短板在于构成生态系统的物种的身份和自然史数据库——这与经济学中个体天生与后天行为的缺陷如出一辙。此外，当你把真实参与者的行为结合在一起时，无处不在的非线性因素像逃跑的鳗鱼一样扭曲翻动。总的来说，理论学家们未能掌握现实世界近乎无尽的复杂性，在那个世界中，参与的不只有极少数大量的物种或人类，其数量通常是不确定的。


    在少数情况下，生态学家可以挖掘数据库中的部分相关性来揭示环境变化的原因。之一是全球变暖导致针叶林中树虫数量增加，随之的是更频繁的火灾，这是一个普遍原理。另一个是随着生态系统的下降，物种平均生态位宽度增加，这在北温带和极地生态系统中十分可见。单个物种平均出现在更多的栖息地中。它们消耗更多样化的食物。另一个全球趋势是地衣、针叶树向世界北的多样性增加，与此同时，在同一地理梯度上，兰花、蝴蝶和爬虫动物的多样性在下降。然而，通常，只有当研究的生态系统非常小且生物多样性相对简单时，生物多样性变化的环境因素才会被引出。


    生态学像所有科学学科一样，由最好从底向上逐步掌握的课题组成。首先，你发现某些现象，并推断此类现象的存在，然后你解释它们的因果关系，将手头的材料与任何看似相关的解释相结合。根据现有的解释，利用常识或灵感，你设计出可能的研究（假设），最好是多个相互竞争的解释。借此，你被引导去寻找更多数据并改进理论，这些理论可能也可能为每种现象以及它们所属的模式提供一些微弱的光亮。如果你仍然无法解释整体，至少你可以开辟新的研究途径。


    因此，科学研究很少是直截了当的。它很少向顶发生巨大的飞跃。它是斜着移动的，以角度向前推进、重构、扭曲、填充主体、等待、环顾、更准确地描述局部、更坚定地描述谱系。然后，就像洞穴墙上的裂缝一样，一束引导的光穿了进来。


    这几乎是所有成功科学运作的方式。显然，这在生态学中做得还不够。推进生态系统结构和功能研究所需的数据在大多数情况下并不。让我们反复询问生态学家：如果我们甚至不知道大多数运行着精细调节的能量和物质循环引擎的昆虫、线虫和其他小动物的身份，我们又如何能理解森林或河流可持续性的深层原理？转向海洋，那些在2013年首次为人知的噬菌体病毒捕食者的极度丰富，我们该如何解释？而当超微型生物——皮藻门动物（Picozoa），它们可能是海洋胶体消耗性“暗物质”的关键组成部分——直到2013年才首次被解剖学描述并归为一个新门时，海洋生态系统又将如何被可靠地理解？


    让我们用另一种方式来看待生态学短板的这一问题。每一个科学学科在合成成类似于成熟理论的东西之前，都必须经历一个自然史时期。大多数生态学领域缺乏的科学自然史是构成生物多样性的物种的身份和生物学。地球上至少二之二的物种仍然未知且未命名，在已知的三分之一中，不足千分之一的接受过密集的生物学研究。正如生理学和医学如果没有对人体器官和组织的坚实知识就无法进步（也无法妥善教学），不能期待生态系统分析在缺乏对构成一个生态系统的物种之坚实知识的情况下取得重大进展。


    支持“人类世”哲学的作家和发言人关注生态系统，并根据训练，似乎并不理解物种水平上生物多样性的本质和意义。物种水平生物学的研究人员等同于对大脑进行精细研究的神经生物学家，而那些将物种视为填充生态系统的可交换零件的人类世爱好者，无非是十九世纪的颅相学家，他们通过头骨形状来研究思想。


    因此，生态生态系统的大部分必要工作在于物种水平的生物多样性研究。生物多样性的探索一如既往是从分类开始的。


    分类学家发现物种，学习通过解剖、DNA、行为、栖息地和其他生物特征的差异来识别它们。所有这些信息都有实用价值。假设从一个仍然未知地点引入的新种果蝇威胁到了西部的苜蓿农田。这个入侵者的名字和身份是什么？它从哪里来？它在故乡的寄生虫和其他天敌是什么？还能从它已知的生物学中获取什么来帮助控制它？等到每种紧急情况发生才从底层开始必要的研究不是明智的吗？记住，这种入侵物种的数量在世界各地都在指数级增长。在上升的潮流中，少数是潜在的害虫。另一一小部分是携带病原微生物从人类或家畜的昆虫和其他生物。


    考虑保护领域日益紧的第二类问题。2014年，油棕行业的官员建议砍伐并转化婆罗洲一半的雨林，留下另一半作为自然保护区。这种大规模的破坏对婆罗洲的生物多样性产生什么影响？该岛上所有的物种会在缩减的保护区内存活吗？还是会接近80%，或者一半？在此过程中，有多少在世界上其他地方未被发现的物种将落入电锯？以往对自然环境广泛转换的经验表明，损失将不到一半，但在10%或20%的范围内。由于生物多样性变化的环境因素只有在研究的生态系统非常小且生物多样性相对简单时才会被引出（此处应为：与此同时，在同一地理梯度上，兰花、蝴蝶和爬虫动物的多样性在下降。然而，通常，只有当研究的生态系统非常小且生物多样性相对简单时，生物多样性变化的环境因素才会被引出。*注：原文此处有重复逻辑，译文已根据语境微调*）。


    另一个问题是人类世支持者的主张，荒野已不存在，地球已经是一个使用的星球，时间已经到了，他们说，将人们完全带入画面，以共生的。。如此，有多少物种，以及大大自然，会存活？人类世支持者并不知道，科学家们正在努力发现。

