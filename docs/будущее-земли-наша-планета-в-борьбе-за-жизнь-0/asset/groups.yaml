    species. The full scale of the assault, in common parlance of the Anthropocene
    called “growth and development,” began at the start of the Industrial Revolution.
    It was foreordained by the extermination of most of the mammal species in the
    world more than ten kilograms in weight, collectively called the megafauna, a
    process begun by Paleolithic hunter-gatherers and thereafter increased in stages
    enabled by technological innovation.


    The decline of biodiversity has been more like the gradual dimming of light than
    the flick of a switch. As the human population multiplied and spread around the
    world, it almost always strained local resources to their local limits. Doubling
    in numbers, then doubling again, and yet again, people fell upon the planet like
    a hostile race of aliens.


    The process was pure Darwinian, obedient to the gods of unlimited growth and reproduction.
    While the creative arts yielded new forms of beauty by human standards, the overall
    process has not been pretty by anybody else’s standards—except bacteria, fungi,
    and vultures. As described in 1877 by the Victorian poet Gerard Manley Hopkins:


    +   Generations have trod, have trod, trod;

    And all is seared with trade; smeared with toil;

    And wars men smudge and shears man''s shame; the soil

    is bare now, nor can foot feel, being shod.


    The extirpation of humankind proceeded in a measure equal to that of the spread
    of mankind. Tens of thousands of species fell to the ax and the pot. As we''ve
    already seen, at least a thousand species of birds, 10 percent of the world total,
    vanished when the Polynesian colonists swept across the Pacific on double canoe
    and outriggers island to island to the most distant archipelagos of Hawaii, Pitcairn,
    and New Zealand. The early European explorers of North America found that the
    megafauna, possibly the richest in the world, had already been wiped out by the
    arrows and traps of the PaleoIndians. Gone were mammoths, mastodons, sabert-toothed
    big cats, oversized dire soaring birds and gigantic beavers elsewhere.


