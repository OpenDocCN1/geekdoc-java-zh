    the ten million species that compose it will no longer be treated as a commodity,
    but as something vastly more important—a mysterious entity still beyond the boundaries
    of our imagination yet vital to long-term human existence.


    With innovation and effort, we will find a way to steer through the climate-change
    crisis without having to resort to the gargantuan and dangerous programs of geoengineering
