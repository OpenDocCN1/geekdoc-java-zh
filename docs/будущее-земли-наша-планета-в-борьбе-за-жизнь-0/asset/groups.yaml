    Santo），我看到猎人手持强力弹弓，捕捉着一只本土的太平洋皇鸽（*Ducula pacifica*），它拥有红斑喙、白色身体和黑色翅膀，显得华丽夺目，正前往卢加维尔的一家餐厅。


