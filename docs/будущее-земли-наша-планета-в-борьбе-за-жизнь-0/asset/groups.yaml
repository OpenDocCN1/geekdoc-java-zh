    new species flood museums and laboratories everywhere, all the time. Specimens
    of the novelties pile up in most groups of organisms. They often must wait for
    years or even decades before the curators of the world’s hugely understaffed museums
    can get to them. The knowledge their study might give us of biology could be put
    off indefinitely.


    If the current rate of basic descriptions and analyses continues, we will not,
    as I and others have often pointed out, complete the global census of biodiversity—what
    is left of it—until well into the twenty-third century. Further, if the conservation
    of Earth’s fauna and flora is not more expertly mapped and protected, some amount
    of biodiversity will be vastly diminished by the end of the present century. Humanity
    is losing the race between the scientific study of global biodiversity and the
    obliteration of countless still-unknown species.


    I can illustrate the taxonomic overload very well with an example from my experience.
    A part of my research on ants has been a classification, which in any part of
    biodiversity species is absolutely necessary prelude for work on ecology and evolution.
    Over the years I’ve described about 450 new species of ants. Of these, 354 were
    in the single genus Pheidole. (As a reminder, a genus is a cluster of species
    similar to one another and all evolved from the same ancestral species. For example,
    Homo is our genus, and the ancestral species includes sapiens and our direct ancestral
    species, first Homo habilis, followed by Homo erectus.)


    Pheidole, whose name from the Greek means “thrifty one,” is the largest and most
    diverse genus among all of the fourteen thousand known species of ants. One of
    the species I discovered and named is Pheidole scalaris, where scalaris means
    “ladder,” referring to the distinctive ladderlike sculpture on the head of the
    soldier caste. Another is Pheidole hasticeps—“speahead,” for the spear-headed
    shape of the soldier’s head, and a third is Pheidole tachygalia—“belongs to tachigalia,”
    for the tree (Tachigalia) in which the ants make their nest. Pheidole aloyai honors
    Dr. D. P. Aloya, the Cuban entomologist who collected the first specimens in the
    field. With hundreds of species of Pheidole named by me and earlier taxonomists
    in this fashion, I was out of Greek and Latin words to describe additional new
    species. It helped to use the names of collectors like Aloya, and of the localities
    where the specimens had been found. Then I thought of another way to ease the
    difficulty. I asked Peter Seligmann, president of Conservation International,
    to recommend eight members of the CI board of directors who had been distinguished
    by their private efforts on behalf of global conservation. One of selected, a
    fellow board member and friend of mine, now has his own personal ant: Pheidole
    harrisonford. There is also a Pheidole seligmanni.


    Scientific naturalists, amateur and professional both, acquainted with the species
    they study almost as though they were other people. One of my mentors when I was
    an undergraduate at the University of Alabama, the lepidopterist Ralph L. Chermock,
    once remarked to his students that a true naturalist knows the names of thousand
    species of organisms. I never come close to that, and I doubt that Chermock ever
    did, either. Perhaps a mnemonist could accomplish the feat from illustrations
    and museum specimens, but he would have little feel or substance in such knowledge
    alone. Chermock and I could do something better, however. Among the several hundreds
    species we had individually studied well, we knew just the names but the higher
    categories to which they belong, phyla through orders to families. We also knew
    a many genera (plural of genus) that especially interested us. We could then identify
    at a higher category thousands of species placed in front of us. And more than
    any but the most dedicated mnemonists, we could add facts and impressions about
    the biology of the species. There would be major gaps, of course, but we could
    say something or use of it, such as “That’s a Demognath salamander or close to
    it. I’ve seen several species. Very common. They prefer terrestrial but very habitats;
    there are several species in the southeastern United States.” Or, “That’s a solifug;
    they’re called sun spiders; some people call camel spiders; they look like little
    spiders but are all predators; they’re very different in a lot of ways. They are
    fast, and I believe all find them in the deserts in the Southwest and all over
    Africa; I’ve seen a couple of species.” Or, “Now, there’s something you don’t
    see every day. It’s a terrestrial planarian, a flatworm. This is only the second
    one I’ve personally seen. Most are aquatic or marine, but this one is terrestrial;
    I believe it occurs all around the world, probably carried accidentally in cargo.


    A great majority of people have little awareness of the countless species of the
    great biosphere that still envelops our planet. In particular, common knowledge
    of the world-dominant invertebrates, the little things that run the natural world,
    have dwindled to almost nothing. The working vocabulary of the average person
    comprises “cockroaches, mosquitoes, wasps, termites, butterflies, moths, bedbugs,
    ticks, crabs, shrimp, lobsters, earthworms,” and a few species that, more importantly,
    affect them personally. Within this black night of ignorance we have suffered
    a massive failure of education. The average persons, with busy lives of their
    own, can’t be expected to know Latin or Greek or summon the official two-part
    names of species. But it would bring a new warmth and richness to their own lives
    to understand the majesty of biodiversity, even the little bit of it to be seen
    in no more than a search around their homes. Dedicated naturalists will tell you
    what it is like to experience twenty kinds of warblers in the migratory season,
    a dozen species of hawks, or every kind of local mammal.


    Pick for a final example any kind of butterfly at random. The thrill of my life
    as a very young butterfly collector was my first purple hairstrake, a flying gem
    not easy to find. I didn’t know that its caterpillars feed on the leaves of the
    mistletoe, a parasitic shrub that grows high in the canopy of trees. I came to
    realize that hairstreaks as a whole are the warblers of the butterfly world. Bright
    in color, varying widely in their geographic range, their habitat, the plant food
    on which they depend, their abundance or rarity, here are (for example) the common
    names of the twenty-two species found in the North American East Coast: Acadian,
    amethyst, banded, Bartram’s scrub, coral, early, Edwards’, fulvous, gray, great
    purple, Hessel’s, hickory, juniper, King’s, mallow scrub, martial scrub, oak,
    red-banded, rud silver-banded, striped, and white. (Each, of course, also bears
    a Latinized two-part scientific name.)


    Each species is a wonder to behold, a long, brilliant history in our time after
    a long struggle of thousands or millions of years, best of the best, an expert
    specialist in the niche of the natural environment in which it lives.

