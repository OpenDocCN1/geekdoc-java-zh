- md: "\nMay the better instruction be instead the one by Paul, in his first letter\
    \ to the Corinthians, advising them to look inward for wisdom from the Lord of\
    \ glory, and hence seek:\n\nThings beyond our seeing, things beyond our hearing,\
    \ things beyond our imagining, all prepared by God for those who love him.*\n\n\
    There is an unbreakable chain in self-understanding that thinking people largely\
    \ neglect. One of its lessons is that we are not as gods. We're not yet sentient\
    \ or intelligent enough to be much of anything. And we're not going to have a\
    \ secure future if we continue to play the kind of false god who whimsically destroys\
    \ Earth's living environment, and are pleased with what we have wrought.\n\n*\
    \ New English Bible.\n\n![](img/f03e757fcddd4aaceb89b9f39b980fec_48_0.png)\n\n\
    Thylacine (“Tasmanian tiger”) of Australia, extinct 1936. Proceedings of the Zoological\
    \ Society of London, 1848–1860.\n\n# 7 ## WHY EXTINCTION IS ACCELERATING\n\nVery\
    \ few people wish to see species disappear, except those occasional pests that\
    \ attack our bodies and sources of food. The biosphere would not mourn the loss\
    \ of mosquitoes of the African *Anopheles gambiae* group of species, specialists\
    \ on human blood, expert hikers in native dwellings, and the principal carriers\
    \ of malaria. Nor, I suspect, would even dedicated conservationists mourn the\
    \ complete elimination of the African guinea worm, my candidate for the most ghastly\
    \ of human pathogens. Growing up to a meter in length, it stretches through the\
    \ body and opens sores on the feet or legs to eject its larvae. We could moreover\
    \ endure extinction of the protozoa parasites that cause the disfiguring and deadly\
    \ disease of leishmaniasis. Other than still-unknown pathogens among bacteria,\
    \ microscopic fungi, and viruses, the number of species worthy of extinction,\
    \ or at least of harmless storage in liquid nitrogen, is probably (my guess) fewer\
    \ than a thousand. I have suffered several times from arboviruses (arthropod-borne)\
    \ picked up in tropical forests, lying abed with fever, and would happily say\
    \ goodbye to them.\n\nThe millions of other species are beneficial to human welfare,\
    \ whether directly or indirectly. There are unfortunately almost countless ways\
    \ that humans are hastening their extinction, whatever might be their present\
    \ or future beneficial roles. The human impact is largely due to the excess of\
    \ many quotidian activities we perform just to get on with our personal lives.\
    \ Those activities have made us the most destructive species in the history of\
    \ life.\n\nHow fast are we driving species to extinction? For paleontologists\
    \ and biodiversity experts have believed that before the coming of humanity about\
    \ two hundred thousand years ago, the rate of origin of new species per extinction\
    \ of existing species was roughly one per million species per year. As a consequence\
    \ of human activity, it is believed that the current rate of extinction overall\
    \ is between one and one thousand times higher than it was originally, and all\
    \ due to human activity.\n\nIn 2015 an international team of researchers finished\
    \ a careful analysis of the prehuman rates and came up with a diversification\
    \ rate ten times lower in genera (groups of closely related species). The data,\
    \ when translated to species extinctions, suggests species extinction rates at\
    \ the present time are closer to one thousand times higher than before the spread\
    \ of humanity. The estimate is further consistent with an independent study that\
    \ detected a similar downward shift in the rate of species formation in prehumans,\
    \ as well as in their closest relatives among the great ages.\n\nEvery expansion\
    \ of human activity reduces the population size of more and species, raising their\
    \ vulnerability and the rate of extinction accordingly. A 2008 mathematical model\
    \ by a team of botanists predicted that between 37 and 50 percent of rare tree\
    \ species in the Brazilian Amazon rain forest, “rare” defined as having populations\
    \ of fewer than ten thousand individuals, will suffer early extinction, caused\
    \ by contemporary road building, logging, mining, and conversion of land to agriculture.\
    \ The lower figure, 37 percent, applies to areas developed in part but protected\
    \ by careful management.\n\nIt is difficult to make comparisons of origin and\
    \ extinction rates across different kinds of plants and animals in different parts\
    \ of the world. But all of the available evidence points to the same two conclusions.\
    \ First, the Sixth Extinction is under way; and second, human activity is its\
    \ driving force.\n\nThis grim assessment leads to a second very important question:\
    \ How well is conservation working? How much have the efforts of global conservation\
    \ movements achieved in slowing and halting the devastation of Earth’s biodiversity?\
    \ Having served on the boards of Conservation International, The Nature Conservancy,\
    \ and the World Wildlife Fund–U.S., and as advisor to many local conservation\
    \ organizations, I can testify to the zeal and inspiration, backed by private\
    \ and public funding, and to the years of sweat and blood in the field, that have\
