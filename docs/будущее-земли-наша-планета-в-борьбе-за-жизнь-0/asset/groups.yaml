    ## GLOSSARY


    **Anthropocene** The proposed name for a new geological epoch in which the entire
    global environment has been altered by humanity.


    **Anthropocene worldview** Applied to nature, the belief that all life should
    be henceforth valued primarily or solely for its importance to human welfare.
    In its extreme form, the worldview envisions future Earth as entirely enveloped
    and engineered by humans.


    **biodiversity** The total of variation in organisms, in past times and present,
    in locations up to and ecosystems, and genes prescribing the traits of the species.


    **biosphere** All the organisms alive in the world at any moment, which together
    form a thin spherical layer around the planet.


    **ecosystem** A locality with particular physical traits and the distinctive species
    that live within it, such as a lake, a forest patch, a coral reef, a tree hole,
    or your mouth and esophagus.


    **gene** The basic unit of heredity, encoded by a particular sequence of DNA units.


    **genus** (plural: genera) A group of species, living or extinct, closely related
    to one another by having descended from the same ancestral species.


    **Half-Earth** The proposal to set aside for nature half the area of Earth’s land
    and half the area of oceans.


    **species** A genetically distinct population or cluster of populations whose
    members interbreed with another.


