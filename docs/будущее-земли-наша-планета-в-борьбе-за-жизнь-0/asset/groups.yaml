    encounter phenomena that other biologists, absorbed in the minutiae of molecular
    and cell organization of a few dozen model species, never even imagine. I admit
    I feel a measure of pride in my own work and that of my colleagues when on one
    occasion I was introduced as the keynote speaker of a major conference on behavioral
    biology by an illustrious molecular biologist, who said, “Ed is the kind of biologist
    who makes the discoveries on which we work.”


    An authentic scientific naturalist is devoted to his group of species. He feels
    responsible for them. He loves them, not the literal earthworms or liver flukes
    or cavernous mosses he might be studying, but the research that reveals their
    secrets and the place of these chosen organisms in the world. It has long been
    clear that biologists are divided into two kinds of people, differing by worldview
    and research methodology. The first tribe follows the rule that for every problem
    in biology there exists an organism ideal for its solution. And thus are selected
    the model species: fruit flies for particulate heredity, the gut bacterium Escherichia
    for molecular genetics, the roundworm Caenorhabditis elegans for architecture
    of the nervous system, and so on across the long arc of molecular biology, cellular
    biology, developmental biology, neurobiology, and of course biomedicine. In contrast,
    for the second tribe, the naturalists, the rule is the inverse of the rule for
    the first tribe: for every organism there exists a problem for the solution of
    which it is ideal. There have been stickleback fish for instinctive behavior,
    cone mollusks and poison-arrow frogs for neurotoxins, ants and moths for pheromones,
    and thence through every level of biological organization, from cell assembly
    through all the principles of organismic and evolutionary biology.


    Unfortunately, there has been more competition than cooperation between members
    of the two tribes, and the naturalists have decisively lost. Since the 1950s,
    when molecular biology was born and the golden age of modern biology was inaugurated,
    funding and prestige have shifted massively to a structural-biology and model-species
    school. A large part of this support has come from the obvious relevance to medicine.
    From 1962 through the rest of the century, the second tribe, organic and evolutionary
    biology, saw its proportion of Ph.Ds drop precipitously, while that of microbiology,
    molecular biology, and developmental biology soared. The number of faculty positions
    in research universities followed the same trend, despite the obvious relevance
    of natural history and biodiversity'
