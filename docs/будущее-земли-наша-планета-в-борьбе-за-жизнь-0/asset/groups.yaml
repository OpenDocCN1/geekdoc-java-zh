    # 生物圈内的最佳地点


    许多终身生活在城市或人口稠密的农村地区的人，很容易想象一个完全属于人类的世界。在极端的“人类世”观点中，重新改造残存的自然来服务人类，似乎比保护原始状态的自然更符合逻辑。为什么，其追随者们问，要将空间和资源投入到一个注定失败的事业？自然界已经遭受了严重破坏。它的生物多样性已过了无法挽回的。主要栖息地已不复存在。这种失败主义观点应当清晰地记住。正如约翰·斯图亚特·米尔曾概括的本质：当战场没有敌人时，老师和学生都会入睡。


    当然，自然学家和种群生物学家以完全不同的方式看待世界。确实存在无法回头的点，但只有当我们把地球太多的环境献给了我们单一物种的需求和快乐时，这个界点才对人类而言存在。一个密密麻麻挤满地球将是一艘星球飞船，生命的长期生存将取决于人类未来的智慧和知识。这不仅对其他生命来说是灾难性的，对我们自身的长期生存也是一个高风险的。


    保护组织本身也无法免于“人类世”观点的影响。大自然保护会（The Nature Conservancy, TNC）最近的年度报告表达了这种思维转变的令人担忧。TNC
    是世界上最受推崇的非政府自然保护区支持者之一，收购并保留了数百万英里的土地进行永久保护。这项工作无疑将继续，但该机构似乎采取了不同的情绪。自然能为人类和经济做些什么已移到了舞台中心，而生物多样性已被褪色。例如，2013
    年年度报告的环绕封面就是这种令人担忧趋势的象征。照片上是一个在蒙古骑着马、照着羊群的微笑男孩。背景是延伸到地平线的几何平坦的草原。总生物多样性包含四种生物：人类、两种家畜和一种植物。文中几乎每张照片或每组照片都描写了人物、他们的栖息地和他们的家畜。它描绘了大象、另一种企鹅、第三种幼稚的鹤，以及第四种挂在阿拉斯加烟熏房里的鲑鱼，它们对人类的用途不言而喻。


    相比之下，经验丰富的自然学家保护生物学家的观点关注的是地球上其他两万已知物种，以及尚未被发现的六百万多个物种。显然，健康的生物圈对经济是有益的，我们相信公众、企业和政治领袖会加入我们，将生物世界视为一个独立的道德命令，而这恰恰对人类的福祉至关重要。


    生物多样性研究的教训是，分布在陆地和海洋无数自然生态系统中的物种多样性正受到威胁。那些研究过数据库的人大多数认同：人类活动将物种灭绝率提高了其前人类水平的一千倍，威胁要灭绝或将本世纪存活的一半物种推向灭绝边缘。然而，世界各地散布着许多地球生物多样性的宝库，面积从几英亩到超过数千平方公里的纯正荒野不等。这些自然生存环境的最后领域几乎都面临着某种程度的威胁，但如果现今的存者有意代表他们采取行动，就可以为后代留住它们。


    为了记录关于扩大全球保护这一承诺的重要论点，我写信给了世界上 18 位资深自然学家，他们都具有国际经验，并在生物多样性和生态学方面拥有专业知识，并征求他们对最佳保护区的意见，即那些庇护着具有显著独特且珍贵物种植物、动物和微生物群落的保护区。我提出了以下请求（在此处略作转述）：


    以自然学家所经历和所知的方式来描述真实世界和生物多样性至关重要，这反驳了灭绝物种狂热者、“自然已死”失败主义者以及各种意识形态的人类中心主义者所设想的观点——保护应该由了解它的人来判断和领导。不仅如此，我们还需要大幅加强努力。


    所以请求是：根据丰富性、独特性以及研究和保护的最充分程度，列出你认为世界上最好的五个地点之一，换句话说，就是你最关心的地点。正如你要求的，给出你选择的理由。


    “生物圈内的最佳地点”是极具个人色彩和主观的选择。它们与20 世纪80 年代由英国生态学家诺曼·迈斯（Norman Myers）等人首次定义的全球生物多样性“热点”不同——尽管之间有非常大的重叠。热点的选择标准是基于高风险物种的数量，这些物种将通过保护它们栖息的区域得以拯救。我的顾问和我很清楚，我们的“最佳地点”列表可以增加很多倍，但我相信我们捕捉到了大部分最优秀的地方。我们共同说明了一个观点：尽管灭绝率正在飙升，地球的大部分生物多样性仍然可以被保护。


    ## 出的最佳地点


    ### 北美


    #### 加利福尼亚州的红杉森林

    加州植物区是一个热点。作者兼生物多样性专家马凯特（Markett）报告道：“加利福尼亚州的红杉森林是最引注目的生态系统之一。”我度过成长年华穿梭于其中，被巨大的红杉倾倒了，它们拥有与世界上其他地方一样多的物种。


    #### 美国南部的长叶松草原

    越来越多的科学家将注意力转向这一看似平凡但丰富的景观。从卡罗来纳州到德克萨斯州东，长叶松草原是北美最丰富的地区之一。它的植被适应了频繁的火灾。其岸边的泛滥森林是更丰富多样性的宝库。


    ### 加勒比海


    #### 古巴和海斯帕尼奥拉

    大安列斯群岛最大的两个岛包含了整个勒比海的大部分生物多样性。它们的陆地在数千万年前通过大陆漂移分离。长期的隔离导致了大量物种的产生。一些像奇怪的食虫哺乳类动物鼠鼠（Solenodon）是岛屿最早历史的遗迹。另一些是适应性辐射的产物，一个或少数殖民物种在大陆发现了开放的生态位。这种情况允许某些物种繁殖成群，占据了这些生态位。显著的例子包括多样化的、丰富的鬣蜥品种，以及闪着蓝绿色金属色泽的奇异蚂蚁。一天，在探索古巴中部的埃斯坎布雷山区时，我发现了一种筑在岩石缝隙中的金属绿蚂蚁，另一种在矮木丛中觅食时闪着金光的物种。


    #### 南美中美洲


    #### 亚马逊河流盆地

    这个无尽的生态系统世界是世界上最大的排水系统，拥有面积最大的雨林和生物多样性丰富的周围草原。它供给亚马逊河的一万五千条主要和次级支流，覆盖 750 万平方公里，占该大陆面积的
    40%。如果加上安第斯山脉，其生物多样性是世界上最大的。主流起始于秘鲁安第斯山脉。它以每小时 2.4 公里的平均速度运行，深度超过 45.7 米，每天通过宽
    402 公里的河口排放三十万亿升水。它的流量是密西西比河的十一倍，尼罗河的六十倍。


