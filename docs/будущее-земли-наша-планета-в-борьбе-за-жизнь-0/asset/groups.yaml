    The two levels, biological and cultural, flow one into the other. This is the
    reason that history makes no sense without prehistory, and prehistory makes no
    sense without biology.


    Looking back to deepest geological history, to the primordial single-called prokaryotes,
    all living species are seen to be members of the same phylogenetic megafauna.
    Tracing forward from 3.8 billion years ago to a point 55 million years ago, we
    find the limb (so to speak of) of all the Old World primates. Pressing forward
    and outward, we come to the branch of the hominids, and finally to humanity.


    Our key adaptation, stroke of evolutionary good luck, is our relatively powerful
    minds. With it we re-create episodes of the past. We invent alternative episodes
    for the future, select one of them, and perhaps decide to make it part of our
    story. We are the only entity on the planet that accumulates knowledge for its
    own sake and, by combining it with the knowledge and cooperation among ourselves,
    makes decisions for the future, often but equally disastrous.


    And so it has come to pass that we have chosen to learn all we can about the rest
    of life—all of life, the whole biosphere. To discover every species of organism
    on Earth is as daunting of all tasks. We will do it, because humanity needs the
    information for many basic scientific and practical reasons, and more deeply and
    compellingly exploration of the unknown is in our genes. In the mapping of Earth''s
    biodiversity will become a Big Science project, comparable to cancer research
    and the brain activity map prevailing at the present day. Unless our current estimates
    of biodiversity are wildly off, there are about a thousand people alive on Earth
    for every species of organism. In theory a sponsor might easily be found for each
    and every one. The collective human mind, hyperconnected and digitized, will flow
    through the entirety of the life we have inherited far more than possible before.
    We will then understand the full meaning of extinction, and we will come to regret
    every species humanity will have carelessly thrown away.


    All biological knowledge begins with names and classification. When specimens
    can be identified to a species, every bit of information accumulated about that
    species becomes immediately available. There is magic in the Linnaean double name,
    such as Drosophila melanogaster for the common fruit fly and Haliaetus leucocephalus
    for the bald eagle. It is the key to finding everything that has been learned
    by science about the species. It conjures up what we personally know or think
    we know. The double name forms the basis of a hierarchy suited to the way the
    human actually works. In repeating it over and over, listening to the sound of
    it and sensing the unknown, it is the poetry of science.


    Biologists define a species as a collectivity of individuals that breed with one
    another under natural conditions. I''ve earlier cited as an example the lions,
    which are close relatives of the tigers, Panthera tigris. The name Panthera denotes
    the genus comprising these big cats that are genetically close to one another
    and to lions and tigers. The classical system of taxonomic classification that
    continues upward and outward, in hierarchical order, as in leaf to twig branch.
    The cat species of Panthera when put together with other cat genera (genera is
    the plural of genus), for example those that include the domestic cat, the wildcat,
    lynx, and the jaguarundi, form the taxonomic cat family, the Felidae. The species
    of the Felidae are joined with the dog family, the Canidae, and put with other
    related mammalian families to form the order Carnivora. And so on upon the taxonomic
    hierarchy until all the species of animals, plants, and microorganisms, both living
    and extinct, have been included.


    This is old-fashioned taxonomy, dating back more than 250 years to Carl Linnaeus,
    and it works. It provides the foundation and framework of classification, as well
    as the language of scientific natural history. The two-part scientific name itself
    is based semantically on Latin and Greek, and is spoken across all cultures. It
    provides each specimen with a name as we do for a person, and it leads easily
    to all the levels in the hierarchy to which the specimen belongs. All knowledge
    accumulated to the present moment and around the species is made available by
    citing the name of the specimen.


    The taxonomic name follows with the way the brain works and the way we all most
    readily communicate. We can talk easily using the Linnaeus double names. A field
    biologist might say of a tiny fly flying over a banana the following: "It’s a
    fruit fly, a drosophila, almost certainly a member of the genus Drosophila. My
    guess is that it''s Drosophila melanogaster, to be completely sure I''d need to
    check its key traits under a microscope." And of a small spider with splayed-out
    legs and two elongated spinnerets extended like a tail behind it, resting on the
    bark of a red mangrove tree (Rhizophora mangle): “This is a hersiliid. I have
    no idea what genus or species of the family Hersiliidae it belongs to, but that’s
    unmistakably a hersiliid.” And next, an elongated creature with multiple legs.
    “That is a centipede. And not just any centipede, but a member of the family Lithobiidae.
    It’s a lithobiid and definitely not a scolopendrid, or scutigerid, or a geophilid,
    or a species of any of the ten known families of centipedes found around the world.


    Finally, in Mozambique''s Gorongosa National Park, where I have conducted field
    research, we see a solid column of large ants beginning to march across a dirt
    road. I might explain this to a visitor:


    - Those are matabele ants, as they''re in this part of Africa, after the Matabele
    warriors of Zimbabwe, and we''re beginning to study them more carefully. Pachodyndyla
    the correct Latin name, and it''s the only one that matches in a highly coordinated
    column running in the same day. The digital revolution has propelled the classification
    of life forward by decades, perhaps centuries.


    As the databases in all these grow, new methods are being developed to convert
    their content into search engines to aid the rapid identification of specimens.
    By far the most potent is barcoding. The key is the DNA sequence of mitochondrial
    genes, which lie outside the nucleus in each cell, hence are inherited only through
    the mother. One segment in the gene CO1, comprising only six hundred fifty base
    pairs, is particularly useful because it varies immensely from one species to
    the next. Read CO1, and in most cases, perhaps all cases, biologists can name
    the species—providing it to known science. They can also match very dissimilar
    life stages, such as caterpillars with the adult butterflies into which they metamorphose.
    In the manner of forensic science, they can even identify tiny fragments of organisms
    to the correct species. And for the first time, it is possible to distinguish
    species so similar in anatomy that they cannot be separated by standard taxonomic
    methods.

