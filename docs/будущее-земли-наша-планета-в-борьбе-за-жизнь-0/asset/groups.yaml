  raw:
  - '[PAGE 166]


    being scientists, live with one uncompromising mandate: Press discovery to the
    limit. Hand the baton from one to the next, if necessary, but never let the effort
    die. There has already emerged a term for the manufacture of organisms and parts
    of organisms: synthetic biology. Its potential benefits, easily visualized as
    spreading through medicine and agriculture, are limited only by imagination. Synthetic
    biology will also bring onto center the microbe-based economy of food and energy.


    The potential power of synthetic biology also leads directly to a vexing question:
    Can we create a human being? Some enthusiasts believe that in time we ultimately
    can. If scientists succeeded, even if in just good part, we will have drawn close
    to the Feynman equation: to construct is to understand. But we will be forced
    to solve the ultimate problem of philosophy: What is the meaning of humanity?


    A note on history is appropriate at this century. A century ago artificial intelligence
    (AI) engineers and brain scientists began pursuit of separate goals served by
    different technologies. The primary purpose of artificial intelligence was and
    remains the creation of devices that perform tasks beyond human capacity. Brain
    science, in contrast, is more focused. Its central and ultimate goal is whole
    brain emulation (WBE), the method and ultimately the construction of a human-grade
    mind. Today the two endeavors are converging, and in many ways they already overlap.
    The technology of artificial intelligence has proven essential to whole brain
    emulation, with activities observed in the living brain promise advances in artificial
    intelligence.


    The greatest challenge in whole brain emulation is the explanation of consciousness.
    Neurobiologists almost universally agree that it is a material phenomenon with
    a cellular physical base. As such it is part of what is called the neuronal workspace,
    and thus subject to experimentation and mapping. Whole brain emulation is still
    proceeding in baby steps, but each is longer than the one before. If the current
    trajectory and pace of research can be sustained, it seems likely that WBE will
    be attained within the current century. Its culmination will rank as one of the
    greatest achievements of all time. Exactly what will WBE have accomplished? It
    will have achieved the construction of artificial self-aware minds, reflective,
    emotional, eager to learn and grow.


    Researchers drawn by this goal or key parts of it are unaraid of what they will
    find and what might become of it. The most successful scientists'
  - '[PAGE 167]


    are like prospectors exploring an unknown territory. What they mostly care about
    making a strike—to be the first to find intellectual gold, silver, or oil. People
    want it, so lay claim to it, let others worry about the consequences. Later in
    life they become philosophers, and worry. Meanwhile, they are confident that humanity
    will ultimately be accompanied by man-made intelligence that knows the meaning
    of intelligence and can be transferred safely to mobile robots. On the other hand,
    the people in the general public, influenced by Hollywood scriptwriters, are apprehensive.
    As citizens of still-volatile cultures besotted with religious dogma and superstition,
    even well-educated people are willing to believe almost anything. In AI and WBE
    they see a blueprint for possible catastrophe. It is easy to imagine human-grade
    robots berserk and wreaking havoc (robotic human copies) in revolt against their
    human creators, and minds downloaded into computers that are as ("transhumans")
    to dominate those who choose to remain mortal flesh and blood. It helps the myths
    that they are featured in technically excellent science-fiction films, for example
    2001: A Space Odyssey (1968), Star Wars (1977), The Terminator (1984), I, Robot
    (2004), Avatar (2009), and Transcendence (2014), which are among the most entertaining
    of this genre ever made, thanks to their epic dramas bolstered by brilliant special
    effects.


    The scientists are certain they know better. In any case, we are on our way to
    moving the brain sciences to the center of biology and the humanities. The magnitude
    of artificial intelligence is rising as part of the overall exponential growth
    of machine computing. Measured in calculations performed per second thousand dollars
    of hardware, computer performance has increased since 1960 from one-thousand of
    a calculation per second (every three hours) to ten billion calculations per second.
    All of modern civilization, in every country, both developed and developing, have
    joined the digital revolution. The effect is not reversible. It will continue
    to intensify relentlessly, and soon will reach deeply into the lives of everyone.
    An example is the impact on the longevity of occupations. Carl Benedikt Frey and
    Michael A. Osborne, economist and mathematician, respectively, at the University
    of Oxford, have estimated that at up to 2030, jobs will be relatively secure for
    recreational therapists, athletic trainers, dentists, chemical engineers, firefighters,'
  - '[PAGE 168]


    and editors, but at high risk for second-level machinists, secretaries, real estate
    agents, accountants, auditors, and telemarketers.


    Each year sees advances in artificial intelligence and their multitudinous applications—advances
    that would have been distantly futuristic decades earlier. Robots roll over the
    surface of Mars. They travel around boulders and up and down slopes while photographing,
    measuring minutiae of topography, analyzing the chemical composition of soil and
    rocks, and scrutinizing for signs of life. In 2014, SCHAFT, a Japanese-built robot,
    won the International DARPA Robotics Challenge navigating doorways and debris,
    cutting a hole in a wall with a tool tool connecting a fire hose, and driving
    a small automobile along a twisted path. Advanced computers have recently begun
    to learn and correct themselves with repeated trials. One programmed with this
    ability trained itself to recognize images of cats. Another programmed to converse
    with the level of a boy passed the Turing Test (named after the pioneer computer
    theorist Alan Turing) when a third of a panel of experts speaking with it for
    five minutes did not recognize it as a machine.


    In 1976, Kenneth I. Appel and Wolfgang Haken revolutionized part of mathematics
    using ten calculations on an early computer to prove the classic four-color map
    theorem (proof that no more than four colors are needed to draw any two-dimensional
    map broken into two-dimensional countries or other pieces), where traditional
    analytic methods to that time had failed. They justified at least in part the
    remark by Einstein that “God does not care about our mathematical difficulties.
    He integrates empirically.” In other words, where something is countable, He prefers
    to count. In some way not yet understood, might the same be true of the hundred
    billion neurons of the natural human brain?


    In the early period of the digital revolution, innovators relied on machine design
    of computers without reference to the human brain, much as the earliest aeronautical
    engineers used mechanical principles and intuition to design aircraft instead
    of imitating the flight of birds. Their approach was required by simple ignorance.
    Neither computer nor brain scientists were advanced enough to make practical connections
    to living organisms. With the contemporary swift growth of both fields, analogies
    and even one-on-one comparisons of processes in natural versus man-made are multiplying.
    The alliance of computer technology and brain science gave birth to whole brain
    emulation as one of the ultimate goals of science.'
  - '[PAGE 169]


    Do brain scientists know enough of the brain’s circuits and processes to translate
    them into the algorithms of artificial intelligence? The orientations of the two
    disciplines remain different. Whereas artificial intelligence is substantially
    an engineering enterprise, seeking solutions to problems, whole brain emulation
    is focused on the central problem of brain and mind. The two are nevertheless
    thoroughly intertwined. According to Daniel Eth and his coworkers at Stanford
    University, it is realistic to conceive of simulating a brain in its entirety
    on a computer, including its thoughts, feelings, memories, and skills. They identify
    four requisite technologies: first scanning brain cellular architecture totally,
    next translating the scan into a model, running the model on a computer, and finally
    simulating sensory input from the body and the surrounding environment. All these,
    and many others believe, can be accomplished well before the end of this century.


    For their part, “neuromorphic engineers,” researchers centered on computer development,
    foresee success in developing computers with characteristics that brains have
    and computers still lack. According to Karlheiz Meier of the University of Heidelberg,
    big problems must be solved by this reverse engineering successfully. The first
    is that supercomputers currently trying to emulate brains require millions of
    watts of power, where human brains use only about twenty watts. Another obstacle
    is that computers cannot yet tolerate even small failures. The loss of just one
    transistor can wreck a microprocessor, whereas brains handle a constant loss of
    neurons. Finally, brains learn and change spontaneously during experiences in
    the environment and the vast complexity of child development, but computers must
    follow the fixed paths and branches of predetermined algorithms.


    In fact, the difficulties facing the architects of whole brain emulation go much
    deeper than just the traditional obstacles in engineering design. The most obvious
    is that the human brain is not a product of engineering but of evolution. It is
    a jittery-rigid product, built from what was available at each interval from past
    selection to the environment of the moment. Across the 450 million years of vertebrate
    evolution, and further back into our invertebrate ancestry, the brain has evolved
    not so much as an organ of thought as an organ of survival. From the beginning
    it was programmed to run the autonomic controls of respiration and heartbeat,
    built with the sensory and motor'
- md: '

    controls of reflex. From the very start as well, the brain housed the staging
    centers of instinct. It was in these centers that appropriate stimuli (the “sign
    stimuli” of the ethologists) triggered inborn instincts (“consummatory acts”).


    From the time of the ancient human-destined line of amphibians, then reptiles,
    the neural pathways of every part of the brain were repeatedly altered by natural
    selection to adapt the organism to the environment in it lived. Step-by-step,
    from the Paleozoic amphibians to the Cenozoic primates, the ancient centers were
    augmented by newer centers, chiefly in the growing cortex, that added to learning
    ability. Adaptation to a particular environment by evolving repertoires of reflex
    and instinct to include adaptability to changing environments. All other things
    being equal, the ability of organisms to function through seasons and across different
    habitats gave them an edge in the constant struggle to survive and reproduce.


    Little wonder, then, that neurobiologists have found the human brain to be densely
    sprinkled with partially independent centers of unconscious operations, along
    with all of the operators of rational thought. Thought through the cortex in what
    may look like first random arrays are the headquarters of process variously for
    numbers, attention, face recognition, meanings, reading, sounds, fears, values,
    and error detection. Decisions tend to be made by the brute force of unconscious
    choice in these centers prior to conscious comprehension. Decision, even for simple
    action, can proceed without awareness. The process was anticipated clearly, and
    poetically, as back as 1902 by Henri Poincaré;


    The subliminal self is no way inferior to the conscious self; it is not purely
    automatic; as capable of discernment, it has tacit, delicacy; it knows better
    how to choose, to divide. What do I say? It knows how to divide than the conscious
    self, since it succeeds where that has failed. In a word, is not the subliminal
    self superior to the conscious self?


    Next in evolution came consciousness. Brain scientists don’t know exactly what
    it is, but they are getting a grip on the role it plays as the newcomer in the
    human brain. Stanislas Dehaene, a leading theorist at the College de France, picked
    up Poincaré’s thread in 2014 as follows:


    In fact, consciousness supports a number of specific operations that cannot unfold
    unconsciously. Subliminal information is evanescent, but conscious information
    is stable—we can hang on it for it as long as we wish. Consciousness also compresses
    the incoming information, reducing an immense stream of sense data to a small
    set of carefully selected bite-size symbols. The sampled information can then
    be routed to another processing stage, allowing us to perform what are fully controlled
    chains of operations, much like a serial computer. This broadcasting function
    of consciousness is essential. In humans, it is greatly enhanced by language,
    which lets us distribute our conscious thoughts across the social network.


    What has brain science to do with biodiversity? With the human future coming more
    closely in focus, including an opening to the fountainhead of intellect, it is
    time—past time—to explore carefully our moral reasoning with respect to the rest
    of life. Human nature evolved along a zigzag path as a constantly changing exchange
    of genetic traits. For all those millions of years to the beginning in this eleventh
    hour of the Anthropocene, our species let the biosphere continue to evolve on
    its own. Then, with scythe and fire, guided by ignorant instinct than by reason,
    we changed everything.


    The endgame of biodiversity conservation is being played out in the twenty-first
    century. The explosive growth of digital technology, transforming every aspect
    of our lives and changing our self-perception, has made the "BNR" industries (biology,
    nanotechnology, robotics) the spearhead of the modern economy. These three have
    the potential either to favor biodiversity or to destroy it. I believe they will
    favor it, by moving the economy away from fossil fuels to energy sources that
    are clean and sustainable, by radically improving agriculture with new crop species
    and ways to grow them, and by reducing the need or the desire for distant travel.
    All are primary goals of the digital revolution. Through them the size of the
    ecological footprint will be reduced. The average person can expect to enjoy a
    longer, healthier life of high quality with less energy extraction and raw demand
    on the land and sea. If we are lucky (and smart), world population will peak at
    a little more than ten billion people by the end of the century or thereafter.
    Not only will the world population decline but the ecological footprint as—perhaps
    precipitously. The reason is that we are thinking organisms trying to understand
    how the world works. We will come awake.


    Meanwhile, digital technologies have serendipously made it possible to complete
    the census of global biodiversity, and with it to determine the status of the
    millions of species that compose Earth''s fauna and flora. That process is already
    underway, albeit far too slowly—with the end in sight in the twenty-third century.
    We and the rest of life with us are in the middle of a bottleneck of rising population,
    shrinking resources, and disappearing species. As its stewards we need to think
    of our species as being in a race to save the living environment. The logical
    primary goal is to make it through the bottleneck to a better, less perilous existence
    while carrying through as much of the rest of life as possible. If global biodiversity
    is given space and security, most of the large fraction of species now endangered
    will regain sustainability on their own.


    Furthermore, advances made in synthetic biology, artificial intelligence, whole
    brain emulation, and other, similar mathematically based disciplines can be imported
    to create an authentic, predictive science of ecology. In it the interrelations
    of species will be explored as fervently as we search through our own bodies for
    health and longevity. It is often said that the human brain is the most complex
    system known to us in the universe. That is incorrect. The most complex is the
    individual natural ecosystem, and the collectivity of ecosystems comprising Earth’s
    species-level biodiversity. Each species of plant, animal, fungus, and microorganism
    is guided by sophisticated decision devices. Each is intricately programmed in
    its own way to pass through its respective life cycle. Even the single-celled
    Escherichia coli, living in the bacterial paradise of our intestines moves toward
    food and away by spinning its tail cilium one way, then the other way, in response
    to chemosensory molecules within its microscopic body.


    How all these minds and the decision-making devices within around them evolve,
    and how they interact with ecosystems—whether tightly or loosely—is a vast area
    of biology that remains mostly uncharted—and still uneven dreamed by scientists
    who devote their lives to it. The analytic techniques coming to bear on neuroscience,
    on Big Data theory, on interoperability studies, on simulations with robot avatars,
    and other comparable enterprises will find applications in biodiversity studies.
    They are ecology’s sister disciplines.


    It is past time to broaden the discussion of the human future and connect to the
    rest of life. The Silicon Valley dreamers of a digitized humanity have not done
    that, not yet. They have failed to give much thought at all to the biosphere.
    With the human condition changing so swiftly, we are losing or degrading to uselessness
    ever more the millions of species that have run the world independently of us
    and free of cost. If humanity continues its suicidal ways to change the global
    climate, eliminate ecosystems, and exhaust Earth’s natural resources, our species
    will very soon find itself forced into making a choice, this time engaging the
    conscious part of our brain. It is as follows: Shall we be existential conservatives,
    keeping our genetically based human nature while tapering off the activities inimical
    to ourselves and the rest of the biosphere? Or shall we use our new technology
    to accommodate the changes important solely to our own species, while letting
    the rest of life slip away? We have only a short time to decide.

    '
  mdcn: '

    反射的控制。从一开始开始，大脑就安置了本能的调控中心。正是在这些中心，恰当的刺激（行为学家所说的“标志性刺激”）触发了先天的本能（“消费行为”）。


    从古老的注定向人类演化的两栖动物开始，再到爬行动物，大脑的每个部分的神经通路都通过自然选择反复改变，以适应生物所生存的环境。从古生代的两栖动物到中生世的灵长类动物，古老的中心被新的中心（主要是不断增长的皮层）所增强，这些新中心增加了学习能力。它们通过演化反射和本能的库，实现了对特定环境的适应，使其包含了对变化环境的适应性。在其他一切都相同的情况下，生物跨越季节和不同栖息地发挥功能的能力，使它们在生存和繁衍的持续斗争中占据了优势。


    因此，神经生物学家发现人类大脑中密密地分布着部分独立的无意识操作中心，以及所有理性思考的操作器，这并不奇怪。通过皮层进行的思维，最初看起来像是随机排列，实际上是处理数字、注意力、面部识别、意义、阅读、声音、恐惧、价值观和错误检测等各种总部。决策往往在意识理解之前，在这些中心通过无意识选择的力量做出。即使是简单的动作，决策也可以在没有意识的情况下进行。庞加莱早在1902年就清晰且诗意地预见到这一过程；


    潜意识自我并不逊于意识自我；它并非完全自动；作为一种具有辨别能力，它具有含蓄的细腻；它更懂得如何选择、如何划分。我在说什么呢？它比意识自我更擅长划分，因为它在意识自我失败的地方取得了成功。简而言之，潜意识自我难道不优于意识自我吗？


    进化的下一步是意识。大脑科学家并不知道它究竟是什么，但他们正在掌握它作为人类大脑中新来者所扮演的角色。法国法学院的领先理论家斯坦尼斯拉斯·德哈纳在2014年延续了庞加莱的思路如下：


    事实上，意识支持许多无法无意识展开的特定操作。潜意识信息是转瞬即逝的，但意识信息是稳定的——我们可以随心所欲地抓住它。意识还压缩传入的信息，将巨大的感官数据流减少为一小组经过仔细挑选的易于处理的符号。采样信息可以被路由到另一个处理阶段，允许我们执行完全控制的操作链，就像串行计算机一样。意识的这种广播功能至关重要。在人类身上，这种功能通过语言得到了极大增强，让我们能够将意识思想分布到社交网络中。


    脑科学与生物多样性之间有什么关系？随着人类的未来越来越受到关注，包括人类智力源泉的开启，现在是——已经太晚了——仔细审视我们对地球其他生命的道德推理了。人性沿着一条之字路径演化，处于遗传特征不断变化的交换之中。从那数百万年直到人类世的这一最后时刻的开始，我们的物种让生物圈继续自我演化。然后，在镰刀和火的帮助下，受无知本能而非理性的引导，我们改变了一切。


    生物多样性保护的终局正在21世纪上演。数字技术的爆炸式增长改变了我们生活的方方面面并改变了自我认知，使“BNR”行业（生物学、纳米技术、机器人学）成为现代经济的先锋。这三者有潜力有利于生物多样性，也有可能破坏它。我相信它们将有利于它：通过将经济从化石燃料转向清洁可持续的能源，通过新的农作物品种和种植方式从根本上改进农业，以及减少对远途旅行的需求或欲望。这些都是数字革命的主要目标。通过这些目标，生态足迹将将缩小。普通人可以期待享受更长、更健康、高质量的生活，而对陆地海洋的能量提取和原始需求更少。如果我们幸运（且聪明），世界人口将在世纪末或之后达到超过100亿的峰。不仅世界人口将下降，生态足迹也将——可能是急剧下降。原因是我们是试图理解世界如何运作的思考生物。我们将醒来。


    与此同时，数字技术偶然使得全球生物多样性的普查成为可能，并已经在进行中，尽管速度太慢了——终点在23世纪。我们和与我们在一起的其他生命正处于人口增长、资源萎缩和物种灭绝的瓶颈之中。作为它们的守护者，我们需要将我们的物种视为正在参加一场拯救生存环境的竞赛。逻辑上的首要目标是通过瓶颈，进入一个更好、更少危险的存在，同时尽可能保留其他大多数生命。如果全球生物多样性得到空间和安全保障，目前濒危的大多数物种将自行重新获得可持续性。


    此外，合成生物学、人工智能、全脑仿真和其他类似的基于数学的学科的进展可以被引入，以创造一种真实的、预测性的生态学。在其中，物种之间的相互关系将得到像我们寻找身体的健康和长寿那样热烈的探索。人们常说人脑是宇宙中已知的最复杂的系统。那是错误的。最复杂的是个体自然生态系统，以及组成地球物种级生物多样性的生态系统集合。每个植物、动物、真菌和微生物都受到复杂的决策设备的引导。每一种都以自己的方式精密编程，以通过各自的生命周期。即使生活在我们肠道细菌天堂中的单细胞大肠杆菌，也会通过在其微观体内的化学感受分子的响应，旋转其鞭毛，来靠近食物或远离食物。


    所有这些心灵以及周围的决策设备是如何演化的，以及它们如何与生态系统相互作用（无论紧密还是松散），这是生物学一个巨大的领域，大部分仍未被开发——并且仍由致力于此的科学家们梦想得仍然不均衡。应用于神经科学、大数据理论、互操作性研究、机器人化身模拟以及其他可比事业的分析技术将在生物多样性研究中找到应用。它们是生态学的姐妹学科。


    是时候扩大对人类未来的讨论并与其他生命联系起来了。硅谷那些关于数字化人类的梦想者还没有这样做，至少还没有。他们完全没有对生物圈进行思考。随着人类状况如此迅速变化，我们正在日益失去或退化为无用，那些独立于我们且免费地运行世界的数百万物种。如果人类继续以这种自杀的方式改变全球气候、消除生态系统并耗尽地球自然资源，我们的物种将很快发现自己被迫做出选择，这次将涉及大脑的意识部分。情况如下：我们是成为生存保守者，在保持遗传人性的同时，减少对我们和其他生物圈有害的活动？还是利用新技术来适应仅对我们物种重要的变化，而让其他生命流逝？我们只有短暂的时间来决定。


