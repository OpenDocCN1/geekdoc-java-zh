    # 8


    # THE IMPACT OF CLIMATE CHANGE: LAND,

    SEA, AND AIR


    Having risen above all the biosphere, set to alter everything everywhere, the
    wrathful demon of climate change is our child that we left unrestrained for too
    long. By using the atmosphere as the carbon dump of the Industrial Revolution,
    and pressing on without caution, humanity has raised the concentration of greenhouse
    gases, primarily carbon dioxide and methane, to a dangerous level.


    Most experts agree on the following dire prediction. The rise in the annual mean
    surface temperature caused by the pollution should not be allowed to exceed 2°C,
    or 3.6°F, above that prior to the birth of the Industrial Revolution—roughly,
    the mid-eighteenth century. The rise has already reached nearly half of the “2C”
    threshold. When global atmospheric warming pushes past the 2C-increase level,
    Earth’s weather will be destabilized. Heat records now considered historic will
    become routine. Severe storms and weather anomalies will be the new normal. The
    melting'
  - '[PAGE 60]


    of the Greenland and Antarctic ice shields now under way will accelerate, bringing
    landmasses a new climate and a new geography. The sea level, as measured by both
    satellite and tidal gauge data, is already rising three millimeters a year. Pushed
    up both by the addition of meltwater and by expansion of the ocean volume due
    to heating of the whole of marine water itself the sea level will eventually exceed
    nine meters.


    Can such catastrophic change really come to pass? It has already begun. The average
    annual surface temperature of the planet has increased steadily since 1980, with
    no sign of moderating.


    The governments of the world have been stirred to action, but the response is
    tired and far from adequate. Only the tiny Pacific Island countries of Kiribati
    and Tuvalu, with the Pacific Ocean threatening to close over them, have found
    a solution. They are getting ready to move their populations to New Zealand.


    Of course, you don''t see the moving from one day to the next. Political leaders
    in Washington haven''t begun yet to travel to their offices in gondolas. But on
    November 12, 2014, President Obama did sign a historic agreement with President
    Xi Jinping of China that the United States to reduce its carbon emissions to 28
    percent before the 2005 level by 2025, while China will peak and start downward
    to the same level by 2030.


    In December 2014, delegates of 196 sovereign nations, virtually from the whole
    world, met in Lima, Peru. They agreed to return home and compose a plan within
    six months for their respective countries to cut their own emissions of greenhouse
    gases from coal, gas, and oil. The collective plan was the basis of a global agreement
    to be drafted in December 2015. The accord reached, however, will not have to
    be implemented until 2020.


    The International Energy Agency insists that somehow humanity must plan to leave
    most of the world''s proven oil and gas reserves in the ground to blunt otherwise
    ruinous climate change, adding that “no more than onethird of proven reserves
    of fossil fuels can be consumed prior to 2050.”


    A dilemma facing each one of the delegates lies in the division of loyalties.
    Called by the late ecologist Garrett Hardin the tragedy of the commons, it originates
    when individuals, or organizations or nations, share a limited resource. They
    will tend to deplete the resource—in this case global clean air and water—because
    each will obtain as large a share as allowed by the rules or an even larger by
    outright cheating.'
  - '[PAGE 61]


    A textbook example of the tragedy of the commons is the depletion of living resources
    in the open sea. Within territorial waters the harvesting of fish and other seafood
    is weakly regulated in many parts of the world, if all Blue water, belonging to
    no one, is subject to no regulations whatsoever, save that established by international
    negotiation. For generations marine waters, variously protected to some degree
    or not at all, have suffered overharvesting of edible species. The downward spiral
    has been hastened by habitat destruction, spread of invasive species, climate
    warming, acidification, pollution with toxins, and eutrophication from excess
    nutrient runoff.


    The assault been brutal and unrelenting. The numbers of larger food and sports
    species, such as tuna, swordfish, sharks, and larger groundfish (the latter comprising
    cod, halibut, flounder, red snapper, and skates), have fallen 90 percent since
    1950. Cod, so abundant in the time of the Pilgrims that it was a meal could be
    caught with an unabated hook, have declined by 99 percent.


    Fortunately, the complete extinction of ocean species is much rarer than that
    of larger animals on the land. The reason is that almost all of the larger marine
    species, including pelagic fishes, have large personal home ranges or migratory
    routes. In a lifetime they travel much greater distances than land animals, thus
    seeding pauperized populations—and hence saving their species from extinction.
    As Asian tigers, for example, have been extirpated from about 93 percent of their
    original geographical ranges, tiger sharks still roam through almost all of theirs.


    With as little as 1°C warming of the water, or a small increase in its acidity,
    both of which are caused by human action, the zooxanthellae emigrate from their
    host calcareous organism, taking their colors and'
  - '[PAGE 62]


    photosynthesis with them, the potentially suicidal process called coral bleaching.


    For these magnificent coral assemblages the consequences of changes caused by
    warming are already catastrophic. Nineteen percent of the world’s coral reefs
    are dead. Thirty-eight percent of the 44,838 coral species known in the world
    are vulnerable or endangered, compared to 14 percent of the birds, 22 percent
    of the mammals, and 31 percent of the amphibians (frogs, salamanders, and caecillians).
    Recent analyses suggest that a quarter of the world’s coral species will vanish
    by 2050.'
