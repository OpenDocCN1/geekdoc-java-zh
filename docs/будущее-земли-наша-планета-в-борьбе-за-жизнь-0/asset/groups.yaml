    # # ACKNOWLEDGMENTS


    This essay could not have been completed without the help of many friends and
    colleagues. I''m especially grateful to my agent John Taylor “Ike” Williams, for
    both fiscal and legal advice; to Robert Weil, my editor, for inspiration and guidance;
    to Kathleen M. Horton, for expert research, editing, and manuscript preparation;
    and to my wife, Renee, for support and advice, as ever before. Gregory C. Carr
    and MC Davis were essential supporters and coworkers during my visits to Mozambique
    and Florida. George Kemerjiev, for years a close intellectual companion, introduced
    me to key trends in the development of high technology and the brain sciences.


    I''m very grateful to my friend Tony Hiss for his encouragement and suggestion
    that the name “Half-Earth” be applied to my proposal in The Future of Life, A
    Window on Eternity, and the present; and to Paula Erhart for her valuable counsel
    advice.


    Those consulted on “The Best Places in the Biosphere” who responded: Leanne Alonso,
    Stefan Cover, Sylvia Earle, Brian Fiss, Adrian Forsyth, Robert George, Harry Greene,
    Tom Lovejoy, Meg Lowman, David Madison, Bruce Means, Russ Rittermeier, Mark Moffett,
    Piotr Naskrecki, Stuart Pimm, Guillem Prime, Peter Raven, and Diana Wall.


