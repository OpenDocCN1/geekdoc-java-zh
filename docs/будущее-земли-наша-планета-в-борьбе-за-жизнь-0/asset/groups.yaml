    Great Indian rhinoceroses. Alfred Edmund Brehm, 1883–1884.


    # 4

    AN ELEGY FOR THE RHINOS


    Twenty-seven thousand rhinococeroses remain in the world. A century ago millions
    thundered across the African plains or slipped silently through the Asian rain
    forests. They represent five species, all endangered. A large majority of the
    survivors belong to the southern race of the white rhino, found mostly in South
    Africa, where they are protected closely by armed guards.


    On October 17, 2014, Suni, one of the last surviving northern white rhinos, died
    in the Ol Pejeta Conservancy of Kenya. His death brought the number of living
    northern whites down to six: three at Ol Pejeta, in the Dvů Králové Zoo in the
    Czech Republic, and two in the San Diego Zoo Safari Park. The animals are aging,
    and no young are being produced. With the last of their kind scattered around
    the world, and rhinos generally difficult to breed in captivity, the northern
    white rhino is functionally extinct. Taking natural longevity into consideration,
    it seems certain that the last individual will have died by 2040.


    Meanwhile, their western race of the black rhino is totally extinct—no individuals
    left anywhere, not even in captivity. Once these great animals with the long curving
    horn were a symbol of African wildlife. They teemed throughout savannas and dry
    tropical forests from Cameroon to Chad, south to the Central African Republic
    and northeast to the Sudan. The whittling away of their numbers began with sporting
    hunters of the colonial era. Then came poachers harvesting horn to make the handles
    of ceremonial daggers, principally in Yemen but also in other parts of the Middle
    East and North Africa. Finally came the crushing blow, the huge appetite in China
    and Vietnam for powdered rhino horn as a pharmaceutical of traditional Chinese
    medicine. The increased consumption was fueled through the favoring by Mao Zedong
    of traditional Chinese medicine over Western medicine. It is still used for a
    wide range of ailments, including sexual disorders and cancer. China’s population
    had risen by 2015 to 1.4 billion. Even though only a tiny percent sought horn,
    the effect on rhinos turned catastrophic. The price per gram soared to that of
    gold.


    The rhino horn market has summoned an array of poachers and criminal gangs willing
    to hunt down the last animal, risking their lives for a dead object you can hold
    in both hands. There seems to be no stopping the impact on all five rhino species.
    The western race of the black rhino population declined by 98 percent during 1960–1995.
    Cameroon, its last stronghold, harbored only fifty individuals in 1991, then thirty-five
    in 1992. The poacher scourge stayed unrelenting, and the Cameroon government could
    offer no solution. By 1997, only ten rhinos were left. Unlike white rhinos, are
    prone to forming herds of up to fourteen individuals (herds of rhinos are called
    “crashes,” incidentally), black rhinos are solitary except when breeding. In the
    days of the western black rhinos, the survivors were scattered across a large
    area of northern Cameroon. Only four were close enough to one another to meet
    and mate. They did not follow through, however, and soon all were gone. Millions
    of years of evolutionary glory came to an end.


    The rarest land mammal in the world at this time is the Javan rhino. A dweller
    of deep rain forest, the species originally ranged from Thailand to southern China,
    thence to Indonesia and Bangladesh. Until recently ten Javan rhinos remained hidden
    and unnoticed in an unprotected forest of northern Vietnam, now the Cát Tiên National
    Park. Soon after their presence became more widely known, all were killed by poachers.
    The last was shot in April 2010.


    Today the last surviving population is sheltered in the Ujung Kulon National Park,
    at the westernmost part of Java. It consists of fewer than fifty individuals.
    (I have been given a figure of thirty-five by one expert.) A tsunami or determined
    band of poachers can take the species out in a single strike.


    Comparable in both rarity and peril is the Sumatran rhino, another species of
    tropical Asia’s deep rain forest. Javan rhinos widely throughout southeastern
    Asia. With much of its habitat replaced by agriculture, and its populations driven
    downward by the relentless poachers, the species is limited almost entirely to
    a few captives in zoos and the dwindling forests of Sumatra. Several individuals
    may possibly be hiding in a remote corner of Borneo.


    From 1990 to 2015, the worldwide population of the Sumatran rhino plunged to three
    hundred, one hundred. In a heroic effort, the veterinarian Terri Roth and her
    team at the Cincinnati Zoo and Botanical Garden learned to apply modern human
    reproductive technology to rhinos. They were successful: three generations have
    now been produced, allowing a very cautious return of several pioneer animals
    to reserves in Sumatra. The process is slow, difficult, expensive, and far from
