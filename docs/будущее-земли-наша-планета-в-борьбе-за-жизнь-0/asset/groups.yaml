    # 20


    ## THREADING THE BOTTLENECK


    The Half-Earth solution does not mean dividing the planet into halves or any other
    large-scale. Nor does it require ownership of any de-states. It does, on the other
    hand, mean setting aside possible for possible.


    The key to saving one-half of the planet is the ecological footprint, defined
    as the amount of space required to meet all of needs. It comprises the land used
    for habitation, food production and delivery, transportation, governance, entertainment.
    In the same way the ecological footprint is scattered around the world, so are
    the pieces.


    There won''t be an immediate drop in the total population. An overshoot still
    exists due to the longevity of the more numerous offspring of earlier, more fertile
    generations. The shift to lower fertility can happen during one or two generations.
    The United Nations biennial report on population in 2014 projected an 80 percent
    probability that by 2100 the world population, as it decelerates toward zero growth,
    will reach between 9.6 billion and 12.3 billion, up from the 7.2 billion existing
    in 2014. That is a heavy burden for an already overpopulated planet to bear, but
    unless women worldwide switch back from the negative population trend of fewer
    than 2.1 children per woman, a turn downward in the early twenty-second century
    is inevitable. Another way of.


    But, you may ask, doesn''t a rising population and per-capita consumption doom
    the Half-Earth prospect? It does, but only if the human population continues growing
    as it has in the past, through the remainder of the twenty-first century and on
    the twenty-second century. In this aspect of its biology, humanity appears to
    have won a throw of the demographic dice. In every country where women have gained
    some degree of social and financial independence, their average fertility has
    dropped by a corresponding amount. In Europe and among native-born Americans,
    it has reached and continued to hold below the zero-growth threshold of 2.1 children
    per woman. Given even a modest amount of personal freedom and an expectation of
    future security, women choose the option of K-selection, favoring a small number
    of healthy well-prepared offspring, as opposed to r-selection, hedging the bet
    with a larger number of poorly prepared offspring. Another way of looking at the
    population problem is that it will be solved as an unintended consequence of human
    nature, namely the flip from r-strategy reproduction to K-strategy reproduction
    in favorable environments.

