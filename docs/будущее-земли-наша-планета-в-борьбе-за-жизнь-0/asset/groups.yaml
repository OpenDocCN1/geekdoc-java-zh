    Good things, however, invite overenthusiasm, and such is the case for barcoding.
    Some of its users see it as the solution to a shortage of expert taxonomists in
    the scientific world, as well as a direct route to the mapping of global biodiversity,
    and even a replacement of the prevailing hierarchical, name-based system of classification.
    However, these hopes are conspicuously in vain. The barcoding method is a technology,
    but it is not an advance in science or scientific knowledge.


    Furthermore, there is no guarantee that the exploration of Earth’s biodiversity
    can be completed before the twenty-third century. The problem is a severe shortage
    of expert researchers. Technology without science is like an automobile without
    wheels and a road map. The solution to the problem is more naturalists, or more
    precisely, scientific natural historians. We need more experts on particular groups
    of organisms, dedicated specialists who conduct original research on the classification
    of the species, their natural history, and, in collaboration with other scientists,
    ultimately all of the biology of the species in their favored group. These scientists
    are furthermore historians, custodians of the stories each species will tell as
    its biology unfolds. Scientific naturalists were once among the leaders of biology.
    They were, and still remain in smaller numbers, masters of the zoologists on mammals,
    herpetologists on reptiles and amphibians, botanists on angiosperms, mycologists
    on fungi, and so on the long Linnaeus roster. Their numbers have been cut in the
    erroneous belief that the living environment is less important to humanity than
    the nonliving environment.


    The scientific naturalists were and remained a special breed. They do not select
    a special process or outstanding problem on which to focus their attention. They
    are not prepared to devote their careers to tracing a biochemical cycle, penetrating
    strata of a nuclear membrane, mapping brain circuitry, or achieving some other
    comparable goal. Instead they are out to learn everything, by which I mean literally
    everything, about the biology of the group they have chosen. The group may not
    be all the birds, but it could be the passerine birds of South America; may not
    be all the flowering plants, but say, the oak species of eastern North America.
    Every scrap of information is deemed valuable and publishable, somewhere, even
    if just online.


    Naturalists are thereby the ones who make the most surprising discoveries and
    often the most important ones. They routinely encounter phenomena that other biologists,
    absorbed in the minutiae of molecular and cell organization of a few dozen model
    species, never even imagine. I admit I feel a measure of pride in my own work
    and that of my colleagues when on one occasion I was introduced as the keynote
    speaker of a major conference on behavioral biology by an illustrious molecular
    biologist, who said, “Ed is the kind of biologist who makes the discoveries on
    which we work.”


    An authentic scientific naturalist is devoted to his group of species. He feels
    responsible for them. He loves them, not the literal earthworms or liver flukes
    or cavernous mosses he might be studying, but the research that reveals their
    secrets and the place of these chosen organisms in the world. It has long been
    clear that biologists are divided into two kinds of people, differing by worldview
    and research methodology. The first tribe follows the rule that for every problem
    in biology there exists an organism ideal for its solution. And thus are selected
    the model species: fruit flies for particulate heredity, the gut bacterium Escherichia
    for molecular genetics, the roundworm Caenorhabditis elegans for architecture
    of the nervous system, and so on across the long arc of molecular biology, cellular
    biology, developmental biology, neurobiology, and of course biomedicine. In contrast,
    for the second tribe, the naturalists, the rule is the inverse of the rule for
    the first tribe: for every organism there exists a problem for the solution of
    which it is ideal. There have been stickleback fish for instinctive behavior,
    cone mollusks and poison-arrow frogs for neurotoxins, ants and moths for pheromones,
    and thence through every level of biological organization, from cell assembly
    through all the principles of organismic and evolutionary biology.


    Unfortunately, there has been more competition than cooperation between members
    of the two tribes, and the naturalists have decisively lost. Since the 1950s,
    when molecular biology was born and the golden age of modern biology was inaugurated,
    funding and prestige have shifted massively to a structural-biology and model-species
    school. A large part of this support has come from the obvious relevance to medicine.
    From 1962 through the rest of the century, the second tribe, organic and evolutionary
    biology, saw its proportion of Ph.Ds drop precipitously, while that of microbiology,
    molecular biology, and developmental biology soared. The number of faculty positions
    in research universities followed the same trend, despite the obvious relevance
    of natural history and biodiversity studies to ecology and the remainder of environmental
    science. Scientific naturalists, often erroneously labeled as old-fashioned and
    as largely washed out, found some refuge in museums and environmental research
    organizations, but even these positions became less secure and well funded with
    time.


    This disparity in the prestige and support of disciplines is a loser for science
    and for humanity’s ability to protect the living environment. If ecology and conservation
    biology are ever able to mature enough to conserve Earth’s biodiversity, it will
    be done not by theory and high-altitude overflights of the ecosystems, not by
    studies of molecular and cellular biology, but by taxonomic boots on the ground.
    Let great continue flowing to those who explore the broad traits of habitats and
    intricate details of a few kinds of bacteria, roundworms, and mice, but also to
    those dwindling few who study everything else.


    ## PART III


    ## The Solution


    The global conservation movement has temporarily mitigated but hardly stopped
    the ongoing extinction of species. The rate of loss is instead accelerating. If
    biodiversity is to be returned to the baseline level of extinction that existed
    before the spread of humanity, and thus saved for future generations, the conservation
    effort must be raised to a new level. The only solution to the “Sixth Extinction”
    is to increase the area of inviolable natural reserves to half the surface of
    the Earth or greater. This expansion is favored by unplanned consequences of ongoing
    population growth and evolution of the economy now driven by the digital revolution.
    But it also requires a fundamental shift in moral reasoning concerning our relation
    to the living environment.


    ## 17


    ## THE AWAKENING


    Earth is a Goldilocks planet, not close enough to its star to be burned to a crisp,
    not far enough away to be locked in eternal ice. Life began on this planet more
    than three billion ago, yet on Antarctica there is part of the biosphere that
