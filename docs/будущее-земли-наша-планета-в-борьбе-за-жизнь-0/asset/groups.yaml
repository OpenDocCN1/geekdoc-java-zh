    # 2


    HUMANITY NEEDS A BIOSPHERE


    The biosphere is the collectivity of all the organisms on the planet at any given
    moment in time. It is all the plants, animals, algae, fungi, and microbes alive
    as you read this sentence.


    The upper boundary of the biosphere consists of bacteria swept upward by storms
    to ten thousand meters and possibly higher. Comprising 20 percent of the microscopic
    particles found at this altitude (the remainder are inert dust particles), some
    of the bacterial species are believed to recycle materials and reproduce by photosynthesis
    and scavenging dead organic matter. Can this high-drifting stratum be called an
    ecosystem? The matter is still under discussion.


    The lower boundary of life exists along the lower edge of what scientists call
    the deep biosphere. There, at more than three kilometers below the surface on
    land and sea, bacteria and nematodes (roundworms) survive the intense heat coming
    up from Earth’s magma. The very few resident species found by scientists in this
    hellish stratum live on energy and materials drawn from rocks around them.


    The biosphere, compared with the immense bulk of the planet as a whole, is razor-thin
    and negligible in weight. Plastered on the surface like a membrane, it.


