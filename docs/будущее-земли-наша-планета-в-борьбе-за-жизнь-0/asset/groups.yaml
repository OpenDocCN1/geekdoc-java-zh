    The pathway of economic evolution will be set by growth that is increasingly intensive
    and less extensive. Its most advanced products will empower individuals with instruments
    capable of achieving more and more with less and per-capita consumption of materials
    and energy. The environmental consequence of its success will be the opposite
    of that envisioned by supporters of Anthropocene ideology. Ach, it will reduce
