    and seldom-visited mountain range rises in Central Asia where Russia, China, Mongolia,
    and Kazakhstan meet. Covered at different elevations variously by steppes, northern
    coniferous forests, and high alpine vegetation, it contains a living encyclopedia
    of cold temperature and arctic mammals, and is one of the places in all of Eurasia
    that harbors a true Ice Age fauna. Herbivores resounding on its slopes include
    wapiti, moose, reindeer, Siberian musk deer, deer, and wild boar. Among their
    predators are brown bear, wolves, lynx, leopards, and wolverines. It is also the
    place where the first fossils of the Denisovan human species were found.


