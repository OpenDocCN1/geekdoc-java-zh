    name is *Power*. God''s mocking challenge to Job no longer daunts us.


    +   * Hast thou entered into the springs of the sea? or hast thou walked in the
    search of the depth?

    * The gates of death been opened unto thee? or hast thou seen the doors of the
    shadow of death?

    * Hast thou perceived the breadth of the earth? declare if thou knowit all.

    * . . . * Who hath divided a watercourse for the overflowing of waters, or a way
    of the lightning of thunder . . . ?


    Well, granted we''ve done all, more or less. Explorers have descended to the Mariana
    Trench, and in the deepest part of the ocean, they''ve seen fish and collected
    microbes. They''ve even traveled completely away from the planet, although drawing
    no closer to a now-silent God. Our scientists and engineers have launched vehicles
    and robots able to examine other planets in the solar system, and asteroids passing
    by, in minute detail. So we''ll have the ability to reach other star systems,
    and the planets that circle them.


    Yet ourselves, our physical bodies, have stayed as vulnerable as we evolved millions
    of years ago. We remain organisms absolutely dependent on other organisms. People
    can live unaided by our artifacts only in bits and slivers of the biosphere, and
    even we are severely constrained.


    There can be no exception to our extreme flesh-bound fragility. We obey the Rule
    of Threes used by the military and others in survival training: You can live for
    three minutes without air, three hours without shelter or proper clothing in freezing
    cold, three days without water, and three weeks without food.


    Why must humans be so weak and dependent? For the same reason all the other species
    in the biosphere areably weak and dependent. Even tigers and whales require protection
    in a particular ecosystem. Each is delicate in its own way, each is constrained
    by its own'
  - '[PAGE 17]


    version of the Rule of Threes. To make the point, if you increase the acidity
    of a lake, certain species in it will disappear, but not all. Some of the survivors,
    having relied on the presence of the newly extinct species—mostly as providers
    of food and for protection against predators—will also in time disappear. The
    population effect of this kind of interaction, called by scientists density-dependent
    regulation, is a universal rule of life.


    A textbook example of density-dependent regulation is the role wolves have played
    in the promotion of tree growth. In Yellowstone National Park, the presence of
    no more than a small pack of wolves in the vicinity drastically reduces the number
    of elk in the same area. One wolf can consume most of the body of an elk in a
    week (it can digest a full meal in hours), while one elk can literally down a
    large number of aspen seedlings in the same time. Even the more presence of the
    canine top-level predator is enough to frighten elk from the neighborhood. When
    wolves are present, fewer aspen are browsed by elk, and the aspen groves thicken.
    When the wolves are removed, the elk return and the growth of aspen plummets.


    In the mangrove forest of the Sundarbans National Park of India and the Sundarbans
    Reserve Forest of Bangladesh, tigers play the same role, prey on and thinning
    the populations of spotted deer, wild boar, and maca (and humans, unfortunately),
    promoting a lusher, more biologically diverse fauna and flora.


    Biodiversity as a whole forms a shield protecting each of the species that together
    compose it, ourselves included. What will happen if, in addition to the species
    already extinguished by human activity, say 10 percent of those remaining are
    taken away? Or 50 percent? Or 90 percent? As more and more species vanish or drop
    to near extinction, the rate of extinction of the survivors accelerates. In some
    cases the effect is felt almost immediately. When a century ago the American chestnut,
    a dominant tree over much of eastern North America, was reduced to near extinction
    by an Asian fungal blight, seven month species which caterpillars depended on
    its vegetation vanished, and the last of the pigeons plunged to extinction. As
    extinction mounts, biodiversity reaches a tipping point at which the ecosystem
    collapses. Scientists have only begun to study under what conditions and when
    this catastrophe is most likely to occur.


    In one realistic disaster scenario, a habitat can suffer a complete takeover by
    alien species. This event is not a Hollywood script. In every country'
- md: '

    where biodiversity censuses are kept, the number of colonist species is rising
    exponentially. Among those, a few to some degree harm humans, the environment,
    or both. By presidential executive order policy in the United States, to help
    clarify government policy they are designated ‘invasive’ species. A small percentage
    of invasive species cause major damage, with the potential of reaching catastrophic
    levels. They include species whose destructiveness has made household names. Their
    swiftly growing roster includes the imported fire ant, Asian termite (“the termite
    that ate New Orleans’), gypsy moth, emerald elm beetle, zebra mussel, Asian carp,
    snakehead, two species of python, and the West Nile virus.


    The invasives come from parts of the world where they have lived for millennia
    as native species. Because they are naturally adapted with other native species
    in their homeland, variously in the roles of predators, prey, and competitors,
    their populations as a whole are kept under control. In their homeland, and it
    also turns out, invasives tend to be adapted for life variously in grasslands,
    riverbanks, and in other habitats of the kind favored by humans. The imported
    fire ant, with its hot-needle sting, does best as an invasive in pastures, yards
    of residences, and road banks. In its South American native range it is mostly
    a well-behaved specialist of grasslands and floodplains.(A note of caution about
    this species: Imported fire ants have a favorite subject of mine for field and
    laboratory research. I once put my hand briefly into a nest as part of a filmed
    demonstration, and within seconds received fifty-four stings from the enraged
    worker ants. Within twenty-four hours sting turned into an itching pustule. My
    advice: never put your hand into it, much less sit on, fire nests.)


    Other invasives do not live in human habitat but can be particularly dangerous
    to the natural environment. The little fire ant, a species smaller than the common
    fire ant (and another subject of my research), is a native of the South American
    rain forest. It is able to penetrate tropical forests elsewhere in dense swarms,
    where it proceeds to decimate single-tarsed (insect term for single-handed) almost
    all of the other invertebrates inhabiting the leaf litter and soil.


    Another, horrific killer is the brown snake, which was introduced by accident
    onto the island of Guam in the late 1940s from New Guinea or the Solomon Islands.
    Being mostly specialized to feed on nesting birds, it wiped out every songbird
    of several species on Guam, down to the last individual.


    It is contrary to all evidence to suppose, as a few writers have, that time invasive
    species will settle down with native species into stable “new ecosystems.” Quite
    the contrary. The only proven way to halt the destabilization of the living world
    is to protect the largest possible reserves and the native biodiversity surviving
    within them.


    Human beings are not exempt from the iron law of species interdependency. We were
    not inserted as ready-made invasives into an edenic world. Nor were we intended
    by providence to rule that world. The biosphere does not belong to us; we belong
    to it. The organisms that surround us in such beautiful profusion are the product
    of 3.8 billion years of evolution by natural selection. We are one of its present-day
