    Such a trip is the reverse of ordinary present-day travel. Instead of passing
    over wildlands to skip from city to city, it passes over cities to get to the
    wildlands.


    The odyssey is more instructive if the pathway chosen is the same taken by our
    ancestors starting than sixty thousand years ago. The trail begins in the birthplace
    of humanity, the savannas and miombo forests of southern and central Africa, much
    of which is still in wilderness condition. It takes a side trip to the rain forests
    of the Congo Basin and West Africa. Then north along the Nile, and perhalps also
    the Bab-el-Mandeb, out of Africa and into Eurasia. By necessity the trail is broken
    by the densely settled lands of the broad Mediterranean region, including all
    of the Bialowieża Forest of Poland and Belarus, the largest primeval woodland
    remaining in the middle latitudes of Europe. It then enters the taiga, the northern
    coniferous forest that begins in Scandinavia and Finland and stretches mostly
    unbroken eastward seven thousand kilometers across the Eurasian Supercontinent
    to the Pacific. Along the way it passes Lake Baikal, the largest body of freshwater
    in the world and home to the endemic species of north temperate aquatic animals.


    From the Amur River region of Siberia and northern China the wilderness trail
    jumps to the Altai Mountains of Central Asia, the Tibetan Plateau, and remote
    parts of the Himalayan southern face. It picks up again in the montane and tropical
