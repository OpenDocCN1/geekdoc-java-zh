    # 18


    # RESTORATION


    There are true wildernesses around the world that, if simply left alone, will
    endure as wildernesses. In addition there are mostly wild places whose living
    environments can be returned close to their original condition, either by the
    removal of a few invasive species or the reintroduction of one to several extirpated
    keystone species—or both. At the opposite extreme are landscapes so degraded that
    their original life must be restored from the ground up, by inserting soil, microorganisms,
    and eukaryotic species (algae, fungi, plants, animals) in certain combinations
    and in particular sequences.


    For a large majority of conservation projects, some amount of restoration, meaning
    human intervention, is necessary. Each project is special unto itself. Each requires
    knowledge and love of the local environment shared by partnerships of scientists,
    activists, and political and economic leaders. To succeed, it needs every bit
    of their entrepreneurship, courage, and persistence.


    Large conservation programs, like new scientific disciplines, start with a heroic
    age. A few individuals push forward, risking failure and harm to'
  - '[PAGE 149]


    their security and reputations. They have a dream that does not fit the norm.
    They accept long hours, personal expense, nagging uncertainty, and rejection.
    When they succeed, their idiosyncratic views become the new normal. Their individual
    stories are then rightfully seen as epics. They become part of environmental history.


    During my work in nature parks and reserves, I have the privilege of working with
    two such pioneers in biodiversity conservation. Their heroic endeavors unfolded
    onendent different continents. The landscapes they restored had problems that
    at first seemed polar opposites, but these conservationists were motivated by
    the same prime movers: the love of the habitats they befriended and the perceived
    need to bring back keystone species earlier destroyed by human action.


    MC Davis of Miramar Beach, Florida, was (until his death from cancer in 2015)
    a very successful business entrepreneur whose wealth was built in good part from
    property management and the rehabilitation of small businesses. At his first way
    of life, focused on capital investment and development, seemed typical for an
    American businessman. But he was also an outdoorsman who explored the wild environments
    of his native Florida Panhandle with a special passion for science and education.
    Learning ecology with his own, MC discovered that the biodiversity of most of
    the Panhandle woodlands was a seriously disturbed condition. The principal cause,
    he learned, was the disappearance of the longleaf pine (Pinus palustris), the
    signature tree of the southern U.S. grasslands.


    The longleaf pine is a tall, stately tree that yields lumber of high quality,
    ranked with white pine and redwood among the best in the United States. Before
    the coming of Europeans, it was the dominant species on 60 percent of the Southern
    wildlands. Longleaf was not tightly arrayed into a forest, nor was it the most
    abundant tree within small hardwood forest scattered across the landscape. Rather,
    it ruled over an open savanna. Other tree species in its midst were sparse by
    frequent lightning-sparked fires. Longleafs survived because they evolved special
    resistance to the seedling stage, including rapid aboveground growth and deep
    roots. It is relatively easy to walk through an old-growth stand of longleaf pine,
    because the understory consists a great variety of flowering species also adapted
    to survive the frequent fires.'
- md: '

    Following the U.S. Civil War, Northern entrepreneurs and newly impoverished Southerners
    began harvesting longleaf pine as a principal source of income. By the end of
    the twentieth century, less than 1 percent of the pristine original cover remained.


    The clearcutting resulted in more than the severe reduction of the dominant species.
    Previous “weedy” tree species, including fast-growing slash pine and loblolly
    pine, took over from the commercially more valuable longleaf. Higher understory
    shrubs replaced much of the original species-rich understory. They and the newly
    dominant pines allowed the accumulation of thick, dried-out litter and masses
    of flammable dry branches caught and held well above ground level. The result
    was that fires no longer crept along the ground and burned among vegetation adapted
    to resist them. Aided by even a slight wind, they instead swept upward and raged
    outward through the canopy as full-blown wildfires. I know this degraded environment
    very well. I spent the bulk of my boyhood wandering through it in southern Alabama
    and the western Florida Panhandle. Only as an adult did I understand the full
    picture of its.


    MC Davis recognized that restoring the longleaf pine was the key to the health
    and sustainability of the Florida Panhandle and a substantial region of the southern
    United States beyond. Other environmentalists, including forestry professionals
    in the Longleaf Alliance and similar environmental organizations, had also grasped
    the problem well and begun to address it. But it was Davis as a private citizen
    chose himself to do something dramatic about this problem. And he did. He noticed
    that undeveloped property away from the beach zone of the Gulf of Mexico coast,
    being shorn of its longleaf and left with soil relatively poor for farming, had
    been purchased cheaply. In partnership with a fellow business entrepreneur, Sam
    Shine, bought up large sections of land and put them into a permanent conservation
    trust.


    Then came the even harder part, restoration of the longleaf savanna. Davis acquired
    big timber equipment and set out to cut down the intrusive slash and loblolly
    pines. He arranged to sell the timber to help pay for the operation. His crews
    used other, specialized machines to claw out the dense fire-prone parts of the
    understory. When the cleared land was ready, they planted more than a million
    longleaf seedlings. When the South’s premier timber species began to return, the
    rich ground flora resumed its original unimpeded growth.


    In the case of restoring to life a part of northern Florida’s original habitat,
    MC Davis devised another idea. While we''re at it (he said in a good-old-boy Deep
    Southern drawl), we might create a wildlife corridor, consisting of a narrow strip
    of natural environment along the Gulf of Mexico coast from Tallahassee west to
    Mississippi. The corridor would allow larger animals, including bears and cougars,
    reoccupy regions from which they had disappeared decades ago. It would also make
    possible a moderation of damage due to climate change, which was expected to include
    an eastbound wave of drying along the Gulf Coast. Such a linkage is now viewed
    as a possibility. Even better, its creation is under way. The parts, achieved
    and planned, include state and federal woodland, coastal river floodplain forests,
    military buffer property, and privately owned wild tracts.


    Gregory C. Carr, scion of a pioneer family in faraway Idaho, the second American
    entrepreneur restoring grasslands whom I''ve had the privilege of knowing and
    assisting. Wealth from innovation in telephone voice technology and its commercial
    development, Carr devoted his life to the gargantuan task of restoring the Gorongosa
    National Park in Mozambique. During the country''s civil war of 1978 through 1992,
    which left as many as a million people dead, and continuing the heavy poaching
    that followed, almost all of the megafauna, including elephants, and fourteen
    species of antelopes, were extinguished or brought to the brink of extinction.


    Following his first visit, on March 30, 2004, Greg Carr set out to restore Gorongosa
    to its original condition. He rebuilt the central camp at Chitego and added, a
    wholly new facility, laboratory and museum for the thorough study of the fauna
    and flora of the park and surrounding area. By the end of the first decade he
    had largely fulfilled his original goals. And, as planned, tourists were returning
    in increasing numbers.


    Carr’s innovation was by no means focused on science and conservation. From the
    beginning, he also gave high priority to the welfare of people living in and around
    Gorongosa. Hundreds of local people were employed in the park, as laborers and
    construction workers to restaurant workers and rangers. A Mozambican was named
    park warden, and in addition functioned as the official liaison with the central
    government of Mozambique at Maputo. Another Mozambican was made director of conservation.
    A clinic and school were built to serve the nearest village. For the first time
    local children were given the opportunity to move up the educational ladder to
    high school. And beyond. Tonga Torcida, my guide during my first visit to the
    park in 2010, received a scholarship to attend a college in Tanzania, the first
    from the Gorongosa area to reach this level of education. Tor graduated in 2014,
    returned, and was employed in an executive position at the park.


    The big animal populations of Gorongosa, once Mozambique’s premier national reserve,
    soon began to regain their prewar strength. Most, like the African elephants,
    lions, buffalo, hippopotamus, zebras, and a myriad of antelope species, were allowed
    to breed from small stocks of wartime survivors. A few, including hyenas and African
    wild dogs, were listed to be introduced from stocks in surrounding countries.
    Nile crocodiles, which are dangerously hard to kill and pull ashore, even by heavily
    armed hunters, evidently had never dropped in numbers.


    In that as an example for parks around the world, specialists were invited to
    census all of Gorongosa’s plants and animals. The latter include thousands of
    invertebrate species ranging in size from nearly invisible springtails to katydids.
    I personally found most startling: ants, of which two hundred are new to science.
    The Mozambican government has recognized the value of the park for both tourism
    and encouraged its growth. One of the key steps it has taken was the inclusion
    of Mount Urema in the official boundary, thereby saving the water supply. In the
    planning phase is aid to improve the park perimeter and to help establish the
    baseline for the native residents.

