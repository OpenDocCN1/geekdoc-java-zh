    生物与文化这两个层面交织在一起。这就是为什么历史离开史前史就毫无意义，而史前史离开生物学也毫无意义。


    回溯到最久远的地质历史，追溯到原始的单细胞核生物，所有生物物种都被视为同一进化系统系巨型动物的成员。从38亿年前向前追溯到5500万年前的一个点，我们发现了旧世界灵长类的（可以这么说）肢体。继续向前向外延伸，我们来到了人科的分支，最终到达了人类。


    我们关键的适应性，也是进化道路上巨大的好运，是我们相对强大的大脑。通过它，我们重现了过去的片段。我们为未来发明了替代片段，选择其中一个，并可能决定将其成为我们故事的一部分。我们是地球上唯一为了知识本身而积累知识的实体，并通过结合我们内部的知识与合作，为未来做出决策——这些决策往往是灾难性的，但同样具有决定性。


    因此，我们选择了尽可能地学习生命的其他部分——整个生命，整个生物圈。发现地球上的每种生物都是一项艰巨的任务。但我们会做到，因为人类出于许多基础科学和实践原因需要这些信息，而且深层的、更具吸引力的对未知探索已刻在我们的基因里。地球生物多样性的绘制将成为一个“大科学”项目，与目前的癌症研究和脑活动图相媲美。除非我们目前对生物多样性的估计有巨大偏差，否则地球上每种物种大约对应一千个人。在理论上，很容易为每一种物种找到赞助者。高度连接和数字化的人类集体智慧将比以前任何时候都渗透到我们继承生命的全部。我们将理解灭绝的全意义，并对人类丢弃的每一个物种感到后悔。


    所有的生物学知识始于命名和分类。当标本被鉴定到物种时，关于该物种积累的每一条信息都会立即可用。林奈双名法中蕴含着魔力，例如普通果蝇的 *Drosophila
    melanogaster* 和白头海雕的 *Haliaetus leucocephalus*。它是发现科学界关于该物种所学到的一切的钥匙。它能唤起我们个人已知或认为自己知道的。双名形成了一个适用于人类实际工作方式的层次体系的基础。在反复重复它、倾听它的声音并感知未知时，它是科学的诗篇。


    生物学家将物种定义为在自然条件下相互繁殖的个体集合。我之前引用狮子作为例子，它们是老虎（*Panthera tigris*）的近亲属。*Panthera*
    这个名字代表了这些大猫的属，它们在基因上相互接近，并与狮子和老虎接近。经典的分类分类系统按照层次顺序继续向上和向外延伸，就像从叶子到树枝一样。*Panthera*
    的猫类物种与其他猫科的属（genera 是 genus 的复数）放在一起，例如包括家猫、野猫、猞猁和短尾猫的属，就构成了分类学上的猫科（*Felidae*）。猫科的物种与犬科（*Canidae*）结合，与其他相关的哺乳动物科放在一起形成食肉目（*Carnivora*）。以此类推，沿着分类等级，直到所有的动物、植物和微生物（无论是现在的还是灭绝的）都被包含进来。


    这是传统的分类学，可以追溯到250多年前的卡尔·林奈（Carl Linnaeus），它是有效的。它提供了分类的基础和框架，以及科学自然史的语言。双部分的科学名称本身在语义上基于拉丁语和希腊语，并跨越所有文化。它为每个标本提供了一个名称，就像我们为人命名一样，并容易引导至标本所属的层次结构中的所有级别。到目前积累的关于该物种的所有知识都可以通过引用标本名称来获得。


    分类学名称遵循大脑运作的方式以及我们所有人最容易交流的方式。我们可以轻松地使用林奈双名法进行交流。一位野外生物学家可能会对飞过香蕉上方的一只小蝇这样说：“这是一只果蝇，一种果蝇属（drosophila），几乎确定是果蝇属的成员。我猜它是黑果蝇（*Drosophila
    melanogaster*），为了完全确定，我需要从显微镜下检查它的关键特征。”对于一只腿张开、两根细长的丝网像尾巴一样延伸在背后的小蜘蛛，它停在红树林（*Rhizophora
    mangle*）的树皮上：“这是一只蛛蛛（hersiliid）。我不知道它属于蛛蛛科（*Hersiliidae*）的哪个属或哪个种，但那无疑是一只蛛蛛。”接着，是一个多条腿的细长生物。“那是一只蜈蚣。而且不是普通的蜈蚣，而是石息蜈科（*Lithobiidae*）的成员。它是一种石息蜈，绝对不是马陆蜈、僧蜈、巨足或世界上发现的十个蜈蚣科中的任何一种。”


    最后，在莫桑比克的戈龙戈萨国家公园（我曾进行过野外研究），我们看到一列大蚁开始走过一条土路。我可能会向游客解释：


    - 那些是马塔贝莱蚁（matabele ants），在非洲的这个地区是这样的，以津巴布韦马塔贝莱战士命名，我们正开始更仔细地研究它们。*Pachodyndyla*
    是正确的拉丁名称，它是唯一符合在一天内高度协调地列队行进的名称。数字革命将生命的分类向前推进了几十年，甚至是几个世纪。


    随着所有这些数据库的增长，新的方法正在开发中，以将其内容转换为搜索引擎，以帮助快速鉴定标本。到目前为止最有效的是条形码。关键是线粒体基因的DNA序列，它们位于每个细胞的核外，因此仅通过母系遗传。CO1基因中的一个片段（仅包含六百五十个碱基对）特别有用，因为它在不同物种之间差异巨大。读取CO1，在大多数情况下，也许是所有情况下，生物学家都可以命名物种——将其提供给已知科学。他们还可以匹配截然不同的生命阶段，例如幼虫与它们变态后的成年蝴蝶。像法医学一样，他们甚至可以将生物微小碎片鉴定到正确的物种。而且第一次，可以区分在解剖上如此相似到无法通过标准分类方法区分的物种。

