    # 21


    ## WHAT MUST BE DONE


    In a world gaining so swifty in biotechnology and rational capability, it is entirely
    reasonable to envision a global network of inviolable reserves that cover half
    the surface of Earth. But will people and their self-centered political leaders
    share with others what is theirs to dispose? It is popular to say that the first
    rule of altruism is never to expect anyone to do anything contrary to his personal
    interest. Because of the way the brain has evolved, it is especially difficult
    to protect distant environments if people imagine even a small amount of personal
    risk or sacrifice. True altruism, this logic continues, is limited to family,
    tribe, race, or nation, where our genes are seen as indirectly rewarded by our
    individual devotion to others. God is thought to favor the creation story of the
    believer''s religion over those of all other religions. A patriot considers the
    moral precepts of his society to be the best in the world. It is the national
    anthem, not a hymn to human achievement, that is played for Olympic winners.


    Even though self-rewarding behavior dominates human behavior, it does not act
    alone. An instinct for true altruism exists. It enters the decision centers of
    the brain most readily when an individual has some degree of power and hence the
    responsibility to achieve altruistic goals. The driving evolutionary force that
    has created it is group selection, as distinguished from individual selection.
    The essence of the process is the following: if altruism toward other members
    of the group contributes to the group''s success, the benefit the altruist''s
    bloodline and genes received may exceed the loss in genes caused by the individual''s
    altruism.


    Charles Darwin, who originated the broad outline of this idea, having confessed
    duality of grasping it at first (for one thing, he had no concept of genes), nevertheless
    outlined it clearly in The Descent of Man:


    It must not be forgotten that a high standard of morality gives a slight or no
    advantage to each individual and his children over the other men of the same tribe,
    yet that an advancement in the standard of morality and an increase in the number
    of well-owed men will certainly give an immense advantage to one over another.
    There can be no doubt that a tribe including many members, from possessing in
    a high degree the spirit of patriotism, fidelity, obedience, courage, and sympathy,
    were always ready to give to each other and to sacrifice themselves for the common
    good, would be victorious over other tribes; this would be natural selection.
    At all times the world would have supplanted other tribes; as morality is one
    element in their success, the standard of morality and the number of well-owed
    men will thus everywhere to rise and increase.


    This idea of multilevel selection (individual plus group selection), which has
    been refined many times, then proved by theory and experiment, can be extended
    as part of social evolution to unrelated persons inside and out of the same tribe
    and even to other species. As I and other researchers have argued in earlier work,
    the phenomenon of biophilia, the innate love of the living process, applies even
    to the natural world, in other words humanity''s ancestral environment.


    The living world is in desperate condition. It is suffering declines in all the
    levels of its diversity. It will be helped but not saved by economic measures
    of its ecological services and potential products. Nor will the perception of
    God''s holy will suffice: traditional religions are pivoted upon the salvation
    of human beings, here and in the afterlife, above all other purposes that can
    be conceived.


    Only a major shift in moral reasoning, with greater commitment given to the rest
    of life, can meet this greatest challenge of the century. Wildlands are our birthplace.
    Our civilizations were built from them. Our food and most of our dwellings and
    vehicles were derived from them. Our gods lived in their midst. Nature in the
    wildlands is the birthright of everyone on Earth.


    The millions of species we have allowed to survive there, but continue to threaten,
    are our phylogenetic kin. Their long-term history is our long-term history. Despite
    all of our pretenses and fantasies, we always have been and will remain a biological
    species tied to this particular biological world. Millions of years of evolution
    are indelibly encoded in our genes. History without the wildlands is no history
    at all.


    We should forever bear in mind that the beautiful world our species inherited
    took the biosphere 3.8 billion years to build. The intricacy of its species we
    know only in part, and the way they work together to create a sustainable balance
    we have only recently begun to grasp. Like it or not, and prepared or not, we
    are the mind and stewards of the living world. Our own ultimate future depends
    upon that understanding. We have come a very long way through the barbaric period
    in which we still live, and now I believe we''ve learned enough to adopt a transcendent
    moral precept concerning the rest of life. It is simple and easy to say: Do no
    further harm to the biosphere.


