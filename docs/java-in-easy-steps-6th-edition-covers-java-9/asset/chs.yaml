  \ `for` 循环中插入语句来统计带有开头的标题\n\n```java\nif ( books[i].startsWith( “Java” ) counter2++;\n\
  ```\n\n![image](img/7o.jpg)在 `for` 循环中插入语句来统计不包含子字符串的标题\n```java\nif ( books[i].indexOf(\
  \ “easy” ) == -1 ) counter3++;\n```\n\n![image](img/8o.jpg)在 main 方法末尾，添加这些语句来输出每次搜索的结果\n\
