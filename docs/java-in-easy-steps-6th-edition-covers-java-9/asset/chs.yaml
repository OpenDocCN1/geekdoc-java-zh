  \ ;\n```\n\n![image](img/3g.jpg)添加一个 `while` 循环，在 `num` 变量仍大于 0 时显示其当前值\n\n```java\n\
  while ( num > 0 )\n{\n    System.out.println( “While Countdown: ” + num ) ;\n}\n\
  ```\n\n![image](img/4g.jpg)在 `while` 循环块末尾插入一个更新器，每次迭代将 `num` 变量的值减 10——从而避免无限循环\n\
  \n```java\nnum -= 10 ;\n\n![image](img/5g.jpg)将程序保存为 `While.java`，然后编译并运行程序查看输出\n\
  \n![image](img/pg53_1.jpg)\n\n![image](img/forget.jpg)\n\n此更新器中的赋值是 `num = ( num\
  \ - 10 )` 的简写。\n\n## 执行 do-while 循环\n\n`while` 循环结构的一种变体（见此处）采用 `do` 关键字来创建一个具有如下语法的循环：\n\
  \n```java\ndo\n{\n    statements-to-be-executed-on-each-iteration ;\n}\nwhile (\
  \ test-expression ) ;\n```\n\n\n与 `for` 循环和 `while` 循环不同，`do while` 测试表达式出现在包含执行语句的块之后。测试表达式在循环的每次迭代结束时被评估为布尔值\
  \ `true`。当评估结果为 `true` 时，继续下一次迭代；但当返回 `false` 时，循环立即终止。这意味着 `do while` 循环中的语句至少会被执行一次。\n\
  \n请注意，如果测试表达式在第一次评估时返回 `false`，循环语句已经执行了一次。\n\n`do while` 循环可以构造成类似于 `for` 循环的结构，通过将计数器初始化放在循环结构外部，并将更新器放在语句块内部，在测试表达式中评估计数器变量——这与\
  \ `while` 循环完全相同。\n\n所有 `for`、`while` 或 `do while` 循环结构如果只包含一个执行语句，可以选择省略语句周围的大括号。但如果省略了，以后向循环中添加额外语句时，你需要添加大括号。\n\
  \n选择 `for`、`while` 还是 `do while` 循环很大程度上取决于个人的编码偏好和用途。`for` 结构方便地将计数器初始化、测试表达式和更新器置于\
  \ `for` 关键字后的括号中。`while` 循环结构可以更简洁——但你必须在循环语句中包含一个更新器以避免无限循环。`do while` 循环仅仅增加了一个优点：在评估其测试表达式之前执行一次其语句——如右侧描述的\
  \ `do while` 循环所示。\n\n![image](img/hot.jpg)\n\n始终将循环要执行的语句封装在大括号内——以保持代码清晰度并提高代码的可维护性。\n\
  \n![image](img/1g.jpg)启动一个名为“DoWhile”的新程序，其中包含标准的 main 方法\n\n```java\nclass DoWhile\n\
  {\n    public static void main ( String[] args ) {    }\n```\n\n![image](img/java.jpg)\n\
