  ) );\npnl.add( new JButton(\"No\") );\npnl.add( new JButton(\"Cancel\") );\ngrid.add(\
  \ new JButton(\"1\") );\ngrid.add( new JButton(\"2\") );\ngrid.add( new JButton(\"\
  3\") );\ngrid.add( new JButton(\"4\") );\n```\n\n![image](img/5b.jpg)\n\n现在，插入语句将两个面板和按钮添加到内容面板中。\n\
  \n```\ncontentPane.add(\"North\", pnl );\ncontentPane.add(\"Center\", grid );\n\
  contentPane.add(\"West\", new JButton(\"West\") );\n```\n\n![image](img/6b.jpg)\n\
  \n将程序保存为 `Layout.java`，然后编译并运行程序查看组件布局。\n\n![image](img/pg147_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n虽然 `FlowLayout` 保持 `JButton` 的大小，但其他布局管理器会扩展组件以填充它们的布局设计。\n\n`ButtonGroup` 对象仅在逻辑上对按钮分组，而不是在物理上分组。\n\
  \n![image](img/pg45_1.jpg)\n![image](img/pg45_2.jpg)\n\n### JLabel 组件\n\n有关如何创建事件处理方法来响应用户操作的细节可以在下一章找到。\n\
  \n注意 `JLabel` 的背景是透明的，因此应该调用 `setOpaque()` 方法将不透明度设置为 `true`。\n\n![image](img/5b.jpg)\n\
  ![image](img/pg45_3.jpg)\n![image](img/pg45_4.jpg)\n![image](img/pg45_5.jpg)\n![image](img/hot.jpg)\n\
  \n之前的页面演示了最常用的 Swing 组件——`JButton`、`JLabel`、`JTextField`、`JComboBox`、`JList`。`javax.swing`\
  \ 包中还有许多专用组件——`JSlider`、`ProgressBar` 和 `JMenuBar`。\n\n尝试使用 Java 文档为 `Radios` 程序添加一个\
  \ `JSlider` 组件——参阅这里 获取如何使用文档的详细信息。\n\n\n\n\n\n```java\nbox.add( lbl1 ) ; box.add(\
  \ lbl2 ) ; box.add( lbl3 ) ;\n```\n![image](img/9b.jpg)\n然后，将布局容器添加到 `JPanel` 容器中\n\
  \n```java\npnl.add( box ) ;\n```\n\n![image](img/10b.jpg)将程序保存为 `Custom.java`，然后编译并运行程序以查看效果\n\
  \n![image](img/pg149_1.jpg)\n\n![image](img/hot.jpg)\n\n在这种情况下，自定义颜色等于 `Color.RED`，因为\
  \ RGB 值指定了最大红色值而没有绿色或蓝色。\n\n![image](img/hot.jpg)\n\n`Box` 对象是一个方便的轻量级容器，它使用 `BoxLayout`\
  \ 作为其布局管理器。`Box` 对象的 `createVerticalBox()` 方法会从上到下单独显示其组件。\n\n## 总结\n\n- `javax.swing`\
  \ 包包含了用于创建 GUI 组件的 Java Swing 类。\n- 窗口作为顶层 `JFrame` 容器创建。\n- `JFrame` 构造函数应该指定窗口的标题、大小、默认关闭操作和可见性。\n\
  - `JPanel` 容器使用其默认的 `FlowLayout` 布局管理器在换行中显示较小的组件。\n- `JButton` 构造函数可以指定显示在推入按钮组件上的文本和图像。\n\
  - `ImageIcon` 对象表示程序中使用的图像。\n- 要部署为单个 Java 归档 (JAR) 的程序应使用 `ClassLoader` 对象来指定图像源。\n\
  - `JLabel` 对象显示非交互式文本和图像内容。\n- 可编辑文本可以现在 `JTextField` 和 `JTextArea` 字段中。\n- `JScrollPane`\
  \ 对象为 `JTextArea` 字段提供滚动条。\n- 可以 `JCheckBox`、`JComboBox` 和 `JList` 组件显示选择项。\n- `ButtonGroup`\
  \ 对象逻辑上对若干 `JRadioButton` 组件分组，以便只有一个一个可以被选中。\n- 特定的 RGB 颜色可以通过 `java.awt` 包中的 `Color`\
  \ 类表示。\n- `java.awt` 包有一个 `Font` 类，可以用于创建表示特定字体名称、样式和大小的对象。\n- 可以使用 `java.awt` 包中的\
  \ `Container` 类表示 `JFrame` 的内容面板，向 `JFrame` 容器添加多个 `JPanel` 容器。\n- 创建 `JPanel` 容器对象时，其参数可以指定布局管理器。\n\
  \n9\n\n### 识别事件\n\n*本章演示了如何创建 Java 程序事件处理器，以响应用户界面操作。*\n\n- 监听事件\n- 生成事件\n- 处理按钮事件\n\
  - 处理项目事件\n- 响应键盘事件\n- 响应鼠标事件\n- 发布消息\n- 请求输入\n- 总结\n\n### 监听事件\n\n用户可以通过执行鼠标、键盘或其他输入设备的操作来与提供图形用户界面\
  \ (GUI) 的程序进行交互。这些操作会导致界面中发生“事件”，让程序响应这些事件被称为“事件处理”。\n\n为了让程序识别用户事件，它需要添加来自 `java.awt.event`\
  \ 包的一个或多个 `EventListener` 接口。可以通过在程序开头添加初始语句 `import java.awt.event.* ;` 使这些接口对程序可用。\n\
  \n可以使用 `implements` 关键字在类声明中包含所需的 `EventListener` 接口。例如，一个监听按钮点击的类声明可能如下所示：\n\n\
  ```java\nclass Click extends JFrame implements ActionListener { }\n```\n\nJava 文档描述了许多可以监听不同事件的\
  \ `EventListener` 接口，但最常用的列在下表所示，并附有简要描述：\n\n| EventListener: | 描述: |\n| :--- |\
  \ :--- |\n| `ActionListener` | 识别当按钮被按下或释放时发生的动作事件 |\n| `ItemListener` | 识别当列表项被选中或取消选中时发生的项目事件\
  \ |\n| `KeyListener` | 识别当用户按下或释放按键时发生的键盘事件 |\n| `MouseListener` | 识别当用户按下或释放鼠标按钮，以及鼠标进入或退出组件时发生的鼠标按钮动作\
  \ |\n| `MouseMotionListener` | 识别当用户移动鼠标时发生的运动事件 |\n\n![image](img/hot.jpg)\n\n\
  可以在 `implements` 关键字之后以逗号分隔列表的形式包含多个 `EventListener`。\n\n### 生成事件\n\n如果组件要有用，它们需要生成\
  \ `EventListener` 接口可以识别的事件。在如右侧所示向程序添加了适当的 `EventListener` 后，必须为组件添加一个事件生成器。\n\n\
  例如，为了让程序响应按钮点击，需要向程序添加 `ActionListener` 接口，并且必须调用按钮的 `addActionListener()` 方法，并将\
  \ `this` 关键字作为其参数。这使得按钮在被点击时生成事件。\n\n创建生成事件的按钮的语句如下：\n\n```java\nJButton btn = new\
  \ JButton( “Click” ) ;\nbtn.addActionListener( this ) ;\n```\n\n当用户点击生成事件的按钮时，`ActionListener`\
  \ 接口识别事件并在程序中寻找事件处理器来响应。\n\n每个 `EventListener` 接口都有一个关联的事件处理器，该方法在识别事件时被调用。例如，当按钮被点击时，`ActionListener`\
  \ 接口会调用名为 `actionPerformed()` 的方法并传递一个 `ActionEvent` 对象作为参数。\n\n`ActionEvent` 对象包含了有关事件及其产生源组件的信息。通常，它有一个\
  \ `getSource()` 方法来识别生成事件的对象。这可以用于为该组件创建适当的响应。\n\n为特定按钮创建响应的事件处理器可能如下：\n\n```java\n\
  public void actionPerformed( ActionEvent event )\n{\n    if ( event.getSource()\
  \ == btn )\n    {\n        // 此按钮执行的语句\n    }\n}\n```\n\n\n\n\n\n![image](img/4r.jpg)在\
  \ `Actions()` 构造函数之前，创建两个 `JButton` 按钮和一个 `JTextArea` 文本字段\n\n```java\nJButton btn1\
  \ = new JButton( “Button 1” ) ;\nJButton btn2 = new JButton( “Button 2” ) ;\nJTextArea\
  \ txtArea = new JTextArea( 5 , 38 ) ;\n```\n\n![image](img/5r.jpg)将按钮和文本区域添加到 `JPanel`\
  \ 容器\n\n```java\npnl.add( btn1 ) ;\npnl.add( btn2 ) ;\npnl.add( txtArea ) ;\n```\n\
  \n![image](img/6r.jpg)插入语句设置两个组件的初始状态\n\n```java\nbtn2.setEnabled( false ) ;\ntxtArea.setText(\
  \ “Button 2 is Disabled” ) ;\n```\n\n![image](img/7r.jpg)在 `Actions()` 构造函数中，插入语句使每个按钮在被点击时生成一个\
  \ `ActionEvent` 事件\n\n```java\nbtn1.addActionListener( this ) ;\nbtn2.addActionListener(\
  \ this ) ;\n```\n\n![image](img/8r.jpg)在构造方法之后，为 `ActionListener` 接口添加一个事件处理方法——用于显示标识哪个按钮被点击了\n\
  \n```java\npublic void actionPerformed( ActionEvent event )\n{\n    txtArea.setText(\
  \ event.getActionCommand()\n            + “ Clicked and Disabled” ) ;\n}\n```\n\n\
  ![image](img/9r.jpg)在事件处理方法中插入 `if` 语句——对每个按钮点击执行特定的响应\n\n```java\nif ( event.getSource()\
  \ == btn1 )\n{ btn2.setEnabled( true ) ; btn1.setEnabled( false ) ; }\nif ( event.getSource()\
  \ == btn2 )\n{ btn1.setEnabled( true ) ; btn2.setEnabled( false ) ; }\n```\n\n![image](img/10r.jpg)将程序保存为\
  \ `Actions.java`，然后编译并运行程序，点击推按钮\n\n![image](img/pg155_1.jpg)\n\n![image](img/pg155_2.jpg)\n\
  \n![image](img/pg155_3.jpg)\n\n![image](img/forget.jpg)\n\n组件在构造函数之前声明，因此对于事件处理方法是全局可见的。\n\
  \n![image](img/hot.jpg)\n\n有时在用户执行所需操作之前禁用某个组件是有用的。\n\n### 处理项目事件\n\nSwing `JRadioButton`、`JCheckBox`\
  \ 和 `JComboBox` 组件维护的状态，这些状态的变化可以通过 `ItemListener` 接口识别，该接口会将 `ItemEvent` 传递给其 `itemStateChanged()`\
  \ 事件处理方法。`ItemEvent` 对象有一个 `getItemSelectable()` 方法用于标识源组件，并有一个 `getStateChange()`\
  \ 方法用于返回其状态。这将决定变化是选中还是取消项目，并可以与 `ItemEvent.SELECTED` 常量进行比较。\n\n![image](img/1r.jpg)从这里编辑\
  \ `Window.java` 的副本，将声明、构造函数和实例化语句中的类名从“Window”更改为“States”。然后，在程序开头添加一条语句来导入 `java.awt.event`\
  \ 包的功能\n\n```java\nimport java.awt.event.* ;\n```\n\n![image](img/java.jpg)\n\n\
  States.java\n\n![image](img/2r.jpg)编辑类声明以为程序添加 `ItemListener` 接口\n\n```java\nclass\
  \ States extends JFrame implements ItemListener\n```\n\n![image](img/3r.jpg)在 `States()`\
  \ 构造函数之前，创建这些组件\n\n```java\nString[] styles = { “Deep Dish” , “Gourmet Style” ,\
  \ “Thin & Crispy” } ;\nJComboBox<String> box = new JComboBox<String> ( styles )\
  \ ;\nJRadioButton rad1 = new JRadioButton( “White” ) ;\nJRadioButton rad2 = new\
  \ JRadioButton( “Red” ) ;\nButtonGroup wines = new ButtonGroup() ;\nJCheckBox chk\
  \ = new JCheckBox( “Pepperoni” ) ;\nJTextArea txtArea = new JTextArea( 5 , 38 )\
  \ ;\n```\n\n![image](img/4r.jpg)在 `States()` 构造函数中，插入语句将两个 `JRadioButton` 组件分组\n\
  \n```java\nwines.add( rad1 ) ;\nwines.add( rad2 ) ;\n```\n\n![image](img/5r.jpg)插入语句将组件添加到\
  \ `JPanel` 容器\n\n```java\npnl.add( rad1 ) ;\npnl.add( rad2 ) ;\npnl.add( chk ) ;\n\
  pnl.add( box ) ;\npnl.add( txtArea ) ;\n```\n\n![image](img/hot.jpg)\n\n注意此示例如何使用\
  \ `append()` 方法向文本区域添加更多文本。\n\n![image](img/6r.jpg)插入语句使可选择组件在选中项目时生成一个 `ItemEvent`\
  \ 事件\n\n```java\nrad1.addItemListener( this ) ;\nrad2.addItemListener( this ) ;\n\
  chk.addItemListener( this ) ;\nbox.addItemListener( this ) ;\n```\n\n![image](img/7r.jpg)在构造方法之后，为\
  \ `ItemListener` 接口添加一个事件处理方法——用于标识哪个按钮被点击了\n\n```java\npublic void itemStateChanged(\
  \ ItemEvent event )\n{\n    if ( event.getItemSelectable() == rad1 )\n        txtArea.setText(\
  \ “White” ) ;\n    if ( event.getItemSelectable() == rad2 )\n        txtArea.setText(\
  \ “Red” ) ;\n    if ( event.getItemSelectable() == chk )\n        txtArea.append(\
  \ “Pepperoni\\n” ) ;\n    if ( event.getItemSelectable() == box )\n        txtArea.append(\
  \ event.getStateChange().toString() + “ selected\\n” )\n}\n```\n\n### 响应键盘事件\n\n\
  允许用户输入文本的 Swing 组件可以通过 `KeyListener` 接口识别用户的按键输入，该接口会将 `KeyEvent` 事件传递给这三个方法：\n\n\
  | 事件处理器 | 说明 |\n| :--- | :--- |\n| `keyPressed( KeyEvent event )` | 在按下按键时调用 |\n\
  | `keyTyped( KeyEvent event )` | 在按下按键后调用 |\n| `keyReleased( KeyEvent event )` |\
  \ 在松开按键时调用 |\n\n当程序实现 `KeyListener` 时，必须声明这三个方法——即使并非全部都会使用。`KeyEvent` 对象有一个 `getKeyChar()`\
  \ 方法，返回该键的字符，以及有一个 `getKeyCode()` 方法，返回表示该按键的整数 Unicode 值。此外，`getKeyText()` 方法接收键码值作为参数并返回该按键的描述。\n\
  \n\n\n\n\n![image](img/6r.jpg)在构造方法之后，添加一个事件处理器来确认按键是否被按下\n\n```java\npublic void\
  \ keyPressed( KeyEvent event )\n{\n    txtArea.setText( “Key Pressed” ) ;\n}\n```\n\
  \n![image](img/7r.jpg)添加第二个事件处理器，在按键被按下后显示按键字符\n\n```java\npublic void keyTyped(\
  \ KeyEvent event )\n{\n    txtArea.append( “\\nCharacter : ” + event.getKeyChar()\
  \ ) ;\n}\n```\n\n![image](img/8r.jpg)添加第三个事件处理器，在按键释放时显示按键代码和按键文本\n\n```java\npublic\
  \ void keyReleased( KeyEvent event )\n{\n    int keyCode = event.getKeyCode() ;\n\
  \    txtArea.append( “\\nKey Code : ” + keyCode ) ;\n    txtArea.append( “\\nKey\
  \ Text : ” + event.getKeyText( keyCode ) ) ;\n}\n```\n\n![image](img/9r.jpg)将程序保存为\
  \ `Keystrokes.java`，然后编译并运行程序，在顶部的文本框中输入\n\n![image](img/pg159_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n`getKeyCode()` 方法仅当从 `keyPressed()` 或 `keyReleased()` 事件处理器内部调用时才会返回按键代码——而从 `keyTyped()`\
  \ 事件处理器中调用不会。\n\n![image](img/hot.jpg)\n\n运行此程序并按下非字符键（如退格键），以查看其按键文本名称。\n\n## 响应鼠标事件\n\
  \nSwing 组件可以通过 `MouseListener` 接口识别用户的鼠标操作，该接口会将 `MouseEvent` 事件传递给这五个事件处理器方法：\n\
  \n| 事件处理器: | 描述: |\n| :--- | :--- |\n| `mousePressed( MouseEvent )` | 按钮被按下 |\n\
  | `mouseReleased( MouseEvent )` | 按钮被释放 |\n| `mouseClicked( MouseEvent )` | 按钮已释放\
  \ |\n| `mouseEntered( MouseEvent )` | 鼠标移入 |\n| `mouseExited( MouseEvent )` | 鼠标移出\
  \ |\n\n鼠标移动可以通过 `MouseMotionListener` 接口识别，该接口会将 `MouseEvent` 事件传递给两个事件处理器：\n\n\
  | 事件处理器: | 描述: |\n| :--- | :--- |\n| `mouseMoved( MouseEvent )` | 鼠标被移动 |\n| `mouseDragged(\
  \ MouseEvent )` | 鼠标被拖动 |\n\n当程序实现 `MouseListener` 或 `MouseMotionListener` 接口时，必须声明所有相关的事件处理器方法——即使并非所有方法都被使用。\n\
  \n由 `MouseMotionListener` 接口传递的 `MouseEvent` 对象具有 `getX()` 和 `getY()` 方法，它们返回相对于产生事件的组件的当前鼠标坐标。\n\
  \n![image](img/1r.jpg)从这里编辑 `Window.java` 的副本，将声明、构造方法和实例化语句中的类名从“Window”更改为“Mouse”。然后，添加一条初始语句来导入\
  \ `java.awt.event` 包的功能。\n\n```java\nimport java.awt.event.* ;\n```\n\n![image](img/java.jpg)\n\
  \nMouse.java\n\n![image](img/2r.jpg)修改类声明，为程序添加 `MouseListener` 接口和 `MouseMotionListener`\
  \ 接口\n\n```java\nclass Mouse extends JFrame implements MouseListener , MouseMotionListener\n\
  ```\n\n![image](img/3r.jpg)在 `Mouse()` 构造方法之前，创建一个 `JTextArea` 组件和两个存储坐标的整数变量\n\n\
  ```java\nJTextArea txtArea = new JTextArea( 8 , 38 ) ;\nint x , y ;\n```\n\n![image](img/4r.jpg)在\
  \ `Mouse()` 构造方法中，插入语句将 `JTextArea` 组件添加到 `JPanel` 容器中并使其生成 `MouseEvent` 事件\n\n\
  ```java\npnl.add( txtArea ) ;\ntxtArea.addMouseMotionListener( this ) ;\ntxtArea.addMouseListener(\
  \ this ) ;\n```\n\n![image](img/5r.jpg)在构造方法之后，为 `MouseMotionListener` 接口添加两个事件处理器\n\
  \n```java\npublic void mouseMoved( MouseEvent event )\n{ x = event.getX() ; y =\
  \ event.getY() ; }\npublic void mouseDragged( MouseEvent event ) { }\n```\n\n![image](img/6r.jpg)为\
  \ `MouseListener` 接口添加五个事件处理器\n\n```java\npublic void mouseEntered( MouseEvent event\
  \ )\n{ txtArea.setText( “\\nMouse Entered” ) ; }\npublic void mousePressed( MouseEvent\
  \ event )\n{ txtArea.append( “\\nMouse Pressed at X: “ +x+ “Y: ” +y ) ; }\npublic\
  \ void mouseReleased( MouseEvent event )\n{ txtArea.append( “\\nMouse Released”\
  \ ) ; }\npublic void mouseClicked(MouseEvent event ) { }\npublic void mouseExited(MouseEvent\
  \ event) { }\n```\n\n![image](img/7r.jpg)将程序保存为 `Mouse.java`，然后编译并运行程序，点击 `JTextArea`\n\
  \n![image](img/159.jpg)\n\n## 发布消息\n\n`JOptionPane` 类用于创建标准对话框。其 `showMessageDialog()`\
  \ 方法向用户显示信息、警告或错误描述。`showMessageDialog()` 方法可以接受四个参数：\n\n- 通常由 `this` 引的父对象\n- 要显示的消息\
  \ `String`\n- 对话框标题 `String`\n- `JOptionPane` 常量之一：\n    - `INFORMATION_MESSAGE`\n\
  \    - `WARNING_MESSAGE`\n    - `ERROR_MESSAGE`\n\n对话框将根据指定的 `JOptionPane` 常量显示相应的图标。你也可以仅指定父对象和消息作为两个参数，以创建一个带有默认信息图标和默认“Message”标题的对话框。\n\
  \n\n\n\n\n`JOptionPane` 类可以通过通过其 `showConfirmationDialog()` 方法打开对话框来请求用户信息并请求决策，或者通过其\
  \ `showInputDialog()` 方法请求用户输入。\n\n这两个方法都可以接受四个参数：\n\n• 父对象 – 通常通过 `this` 关键字引用\n\
  • 要显示的请求 `String` \n• 对话框标题 `String`\n• `JOptionPane` 常量之一，如 `PLAIN_MESSAGE`，或指定对话框决策按钮如\
  \ `YES_NO_CANCEL_OPTION`\n\n对话框将返回来自输入对话框的输入 `String`，或来自决策按钮的整数 – 0 表示是，1 表示否，2\
  \ 表示取消。\n\n![image](img/1r.jpg)从这里 复制 `Window.java` 的副本，将声明、构造函数和实例化语句中的类名从“Window”更改为“Request”。然后，添加一条初始语句来导入\
  \ `java.awt.event` 包的功能。\n\n```\nimport java.awt.event.* ;\n```\n\n![image](img/java.jpg)\n\
  \nRequest.java\n\n![image](img/2r.jpg)修改类声明，为程序添加一个 `ActionListener` 接口\n\n```\n\
  class Request extends JFrame implements ActionListener\n```\n\n![image](img/3r.jpg)在\
  \ `Request()` 构造函数之前，创建一个 `JTextField` 和两个 `JButton` 组件\n\n```\nJTextField field\
  \ = new JTextField( 38 ) ;\nJButton btn1 = new JButton( “Request Decision” ) ;\n\
  JButton btn2 = new JButton( “Request Input” ) ;\n```\n\n![image](img/4r.jpg)将每个组件添加到\
  \ `JPanel` 容器中\n\n```\npnl.add( field ) ; pnl.add( btn1 ) ; pnl.add( btn2 ) ;\n\
  ```\n\n![image](img/5r.jpg)在 `Request()` 构造函数中，插入语句使每个按钮生成 `ActionEvent` 事件\n\n\
  ```\nbtn1.addActionListener( this ) ;\nbtn2.addActionListener( this ) ;\n```\n\n\
  ![image](img/6r.jpg)在构造方法之后，为 `ActionListener` 接口添加事件处理方法\n\n```\npublic void actionPerformed(\
  \ ActionEvent event ) { }\n```\n\n![image](img/7r.jpg)在事件处理器的括号之间，插入一个 `if` 语句来响应决策按钮的点击\n\
  \n```\nif ( event.getSource() == btn1 )\n{\n  int n = JOptionPane.showConfirmDialog(\
  \ this ,\n  “Do you agree?” , “Confirmation Dialog” ,\n  JOptionPane.YES_NO_CANCEL_OPTION\
  \ ) ;\n  switch( n )\n  {\n      case 0 : field.setText( “Agreed” ) ; break ;\n\
  \      case 1 : field.setText( “Disagreed” ) ; break ;\n      case 2 : field.setText(\
  \ “Canceled” ) ; break ;\n  }\n}\n```\n\n![image](img/8r.jpg)插入一个 `if` 语句来处理用户输入\n\
  \n```\nif ( event.getSource() == btn2 )\nfield.setText( JOptionPane.showInputDialog(\
  \ this ,\n“Enter your comment” , “Input Dialog” ,\nJOptionPane.PLAIN_MESSAGE ) ;\n\
  ```\n\n![image](img/9r.jpg)将程序保存为 `Request.java`，然后编译并运行程序，点击每个按钮\n\n![image](img/pg165_1.jpg)\n\
  ![image](img/pg165_2.jpg)\n![image](img/pg165_3.jpg)\n![image](img/pg165_4.jpg)\n\
  ![image](img/pg165_5.jpg)\n![image](img/hot.jpg)\n\n`OK_CANCEL` 常量提供了两个决策按钮 – `OK`\
  \ 返回 0，`CANCEL` 返回 2。请参考文档以获取完整的常量范围。\n\n## 总结\n\n• `implements` 关键字可以在类声明中使用以添加一个或多个\
  \ `EventListener` 接口。\n• 组件的 `addActionListener()` 方法接受 `this` 关键字作为其参数 – 以便该组件在被激活时生成\
  \ `ActionEvent` 事件。\n• `ActionListener` 接口将生成的 `ActionEvent` 事件作为参数传递给其 `actionPerformed()`\
  \ 事件处理器，该处理程序可以响应用户对推入按钮的点击。\n• `ActionEvent` 事件的 `getSource()` 方法可用于识别生成该事件的源组件。\n\
  • `ItemListener` 接口将生成的 `ItemEvent` 事件作为参数传递给其 `itemStateChanged()` 事件处理器，该处理程序可以响应用户对项目的选择。\n\
  • `ItemEvent` 事件的 `getItemSelectable()` 方法可用于识别生成该事件的组件。\n• `KeyListener` 接口将生成的\
  \ `KeyEvent` 事件作为参数传递给三个要求的事件处理方法，这些方法可以响应按键并显示该键的字符。\n• `MouseListener` 接口将生成的\
  \ `MouseEvent` 事件作为参数传递给五个要求的事件处理方法，这些方法可以响应用户对鼠标的操作。\n• `MouseMotionListener` 接口将生成的\
  \ `MouseEvent` 事件作为参数传递给两个要求的事件处理器，这些处理器可以响应鼠标移动。\n• `JOptionPane` 类的 `showMessageDialog()`\
  \ 方法创建一个向用户显示消息的对话框，其 `showInputDialog()` 和 `showConfirmationDialog()` 方法可用于请求用户输入。\n\
  音频资源可以用 `AudioClip` 类表示，并使用 `play()` 方法播放。\n\n# 10 部署程序\n\n本章演示了如何部署 Java 程序 – 作为\
  \ Java 归档（JAR）和安卓应用程序（APK）。\n\n### 创建一个应用程序\n\n用于桌面和移动设备的 Java 程序可以从下方的 `Lotto.java`\
  \ 代码创建：\n\n```java\nimport javax.swing.*;\nimport java.awt.event.*;\n\npublic class\
  \ Lotto implements ActionListener\n{\n  ClassLoader ldr = this.getClass().getClassLoader();\n\
  \  java.net.URL iconURL = ldr.getResource(\"Lotto.png\");\n  ImageIcon icon = new\
  \ ImageIcon(iconURL);\n  JLabel img = new JLabel(icon);\n  JTextField txt = new\
  \ JTextField(18);\n  JButton btn = new JButton(\"Get Lucky Numbers\");\n  JPanel\
  \ pnl = new JPanel();\n\n  // 构造函数\n  public Lotto() {\n    super(\"Lotto App\"\
  );\n    setSize(260, 210);\n    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \    pnl.add(img);\n    pnl.add(txt);\n    pnl.add(btn);\n    btn.addActionListener(this);\n\
  \    add(pnl);\n    setVisible(true);\n  }\n\n  // 事件处理器\n  public void actionPerformed(ActionEvent\
  \ event) {\n    if (event.getSource() == btn) {\n      int[] nums = new int[60];\n\
  \      String str = \"\";\n      for (int i = 1; i < 60; i++) { nums[i] = i; }\n\
  \      for (int i = 1; i < 60; i++) {\n        int r = (int) (59 * Math.random())\
  \ + 1;\n        int t = nums[i];\n        nums[i] = nums[r];\n        nums[r] =\
  \ t;\n      }\n      for (int i = 1; i < 7; i++) {\n        str += \" \" + Integer.toString(nums[i])\
  \ + \" \";\n      }\n      txt.setText(str);\n    }\n  }\n\n  // 入口点\n  public static\
  \ void main(String[] args) {\n    Lotto lotto = new Lotto();\n  }\n}\n```\n\n\n\n\
  \n\n`Lotto()` 构造函数构建了一个简单的 Swing 界面，并将面板加载到尺寸为 260 x 210 的窗口框中。\n\n### 事件处理器\n\n\
  按钮的事件处理器方法会执行一种算法，在 1-59 的范围内选择六个唯一的随机数，并显示在文本字段组件中。\n\n### 入口点\n\n`main()` 方法创建应用的实例，并调用\
  \ `ClassLoader()` 在程序文件相同的目录中查找图像资源文件 `Lotto.png`。在尝试编译程序之前，必须按照这种方式安排文件。\n\n![image](img/pg169_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n本章将贯穿使用 `Lotto` 程序来为桌面设备和手持设备创建应用程序。\n\n观察所需的文件安排方式，可以像通常一样使用\
  \ `javac` 编译器来创建 `Lotto.class` 文件，然后使用 `java` 解释器来执行程序：\n\n![image](img/pg169_3.jpg)\n\
  \n### 分发程序\n\n`Lotto` 程序会打开一个具有指定尺寸的新窗口，其中包含 Swing 界面组件。每当用户点击推按钮时，其事件处理器就会在文本字段组件中显示\
  \ 1-59 范围内六个新的随机数：\n\n![image](img/pg170_1.jpg)\n\n与书中的所有其他示例一样，示例 `Lotto` 程序已针对\
  \ Java 9 在此处编译，并分发到安装了 Java 9 运行时环境的其他计算机上执行——无论其操作系统是什么。例如，在下方的图中，`Lotto.class`\
  \ 和 `Lotto.png` 文件已复制到运行 Linux 操作系统且安装了 Java 9 运行时的计算机桌面上。因此，`Lotto` 程序可以像在原始 Windows\
  \ 系统上一样通过 `java` 解释器进行执行。\n\n![image](img/pg170_2.jpg)\n\n![image](img/pg170_3.jpg)\n\
  \n![image](img/hot.jpg)\n\n分发程序时不需要包含 `.java` 源代码文件——只需要 `.class` 文件和资源文件。\n\n然而，这种方式分发\
  \ Java 程序存在一种危险，因为如果资源文件不可用，程序将无法执行——在这种情况下，移除 `Lotto.png` 会产生此错误：\n\n![image](img/pg171_1.jpg)\n\
  \nJDK 包含一个 `jar` 工具，它允许将程序类和资源文件打包成单个 Java 归档 (JAR) 文件。这使用流行的 ZIP 格式将所有程序文件压缩成一个具有\
  \ `.jar` 扩展名的单个文件。JAR 文件能够高效地存储程序，并有助于确保资源文件不会被意外隔离。`java` 解释器完全支持 JAR 文件，因此可以在不解压单个文件的情况下执行\
  \ Java 。与 `java` 解释器和 `javac` 编译器一样，`jar` 工具位于 Java 的 `bin` 目录下，并从命令行运行执行这些常见的 `jar`\
  \ 操作：\n\n| 命令语法： | 操作： |\n| :--- | :--- |\n| `jar cf *jar-file input-file/s*` |\
  \ 创建 JAR 文件 |\n| `jar cfe *jar-file entry-point input-file/s*` | 创建一个在独立应用程序中具有指定入口点的\
  \ JAR 文件 |\n| `jar tf *jar-file*` | 查看 JAR 文件的内容 |\n| `jar uf *jar-file*` | 更新 JAR\
  \ 文件的内容 |\n| `jar ufm *jar-file attribute-file*` | 更新 JAR 文件的清单，添加属性 |\n| `jar xf\
  \ *jar-file*` | 提取 JAR 的所有内容 |\n| `jar xf *jar-file archived-file/s*` | 从 JAR 中提取特定文件\
  \ |\n\n![image](img/forget.jpg)\n\n较大的程序可能会使用许多资源文件，这些文件的位置很容易被用户破坏——解决方案是将程序及其所有资源打包成单个可执行的归档文件。\n\
  \n![image](img/hot.jpg)\n\n对于较大的程序，可以使用 `*` 通配符来归档目录内的多个文件——例如，`jar cf Program.jar\
  \ *.class` 会归档当前目录下的所有类文件。\n\n### 构建 Java 归档\n\n按照以下步骤为本章开头描述的 Lotto 程序创建一个 JAR\
  \ 文件：\n\n![image](img/1g.jpg)打开命令行/终端窗口，然后导航到 Lotto 程序文件所在的目录——`Lotto.class` 和 `Lotto.png`\n\
  \n![image](img/jar.jpg)\n\nLotto.jar\n\n![image](img/2g.jpg)输入 `jar cfe Lotto.jar\
  \ Lotto.class Lotto.png`，然后按下 **Enter** 键创建一个 `Lotto.jar` 归档\n\n![image](img/3g.jpg)接下来，输入\
  \ `jar tf Lotto.jar` 查看 JAR 的所有内容\n\n![image](img/pg172_1.jpg)\n\n注意 `jar` 工具会自动在归档文件旁边创建一个\
  \ `META-INF` 目录。它包含一个名为 `MANIFEST.MF` 的文本清单元文件，你可以检查它：\n\n![image](img/4g.jpg)现在，输入\
  \ `jar xf Lotto.jar META-INF` 提取 `META-INF` 目录的副本\n\n![image](img/5g.jpg)最后，输入 `type\
  \ META-INF\\MANIFEST.MF` 查看 `META-INF` 目录\n\n![image](img/pg174_2.jpg)\n\n![image](img/hot.jpg)\
  \ 部署应用程序\n\nJAR 文件在安装了相应版本的任何系统上都可以执行：\n\n![image](img/1g.jpg)在命令行处导航到 JAR 文件所在的目录，然后输入\
  \ `java -jar Lotto.jar` 并按下 **Enter** 键运行 Lotto 应用\n\n![image](img/pg173_1.jpg)\n\
  \n![image](img/2g.jpg)\n\n![image](img/pg173_2.jpg)\n\n或者，右键点击 `Lotto.jar` 文件并选择“打开方式”Java\
  \ Runtime\n\n![image](img/pg173_3.jpg)\n\n![image](img/pg173_4.jpg)\n\n执行 JAR 文件需要\
  \ `.jar` 文件扩展名。在你的系统中将 JRE 设置为默认 JAR 文件处理器以便双击执行。\n\n### 创建 Android 项目\n\nAndroid\
  \ 操作系统流行于手持设备，包含一组核心库，提供了 Java 编程语言中的大部分功能。这意味着 Java 程序可以轻松转换为 Android 程序。\n\n![image](img/pg174_2.jpg)\n\
  \nAndroid Studio 可以从 [developer.android.com](https://developer.android.com/studio)\
  \ 免费获取。本示例描述的是 2.3 版本——指令可能随版本而异。Android Studio 是一个约 1.9GB 的大型下载文件，可能需要额外的下载来完成设置。在下载之前检查系统要求以确保你的电脑可以运行\
  \ Android Studio。\n\nAndroid 应用开发最好使用官方 Android Studio 集成开发环境 (IDE)。它提供了一个统一的环境，让你为所有\
  \ Android 设备开发应用，并提供了丰富的测试工具。完成的应用程序以 Android 应用包（APK）归档文件分发，这类似于 Java 归档 (JAR)\
  \ 文件。它使用流行的 ZIP 格式将所有程序文件压缩成一个具有 `.apk` 文件扩展名的单个文件。每个应用首先在 Android Studio 中作为“项目”创建，开发者向其添加代码和资源：\n\
  \n![image](img/hot.jpg)启动 Android Studio，然后在对话框选项中选择**新建 Android Studio 项目**——以打开“新项目”对话框\n\
  \n![image](img/1g.jpg)输入**应用程序名称**（例如“Lotto”）和**公司域名**，然后选择你优的**项目位置**将其保存在计算机上\n\
  \n![image](img/pg174_1.jpg)点击**下一步**打开“目标 Android 设备”对话框\n\n\n\n\n\n![image](img/4g.jpg)\n\
  选择设备类型和平台级别（例如，运行“Ice Cream Sandwich”的“手机和平板”）\n\n![image](img/hot.jpg)\n\n包名是自动分配的应用程序唯一标识符，由\
  \ `com.*domain.appname` 组成\n\n![image](img/pg175_1.jpg)\n\n![image](img/5g.jpg)点击\
  \ `Next` 打开“向手机设备添加 Activity”对话框，只需选择 `Empty Activity` 选项\n\n![image](img/6g.jpg)点击\
  \ `Next` 打开“自定义 Activity”对话框\n\n![image](img/pg175_2.jpg)\n\n![image](img/7g.jpg)点击\
  \ `Finish` 接受建议的配置——Android Studio 现在将为新项目生成若干文件和文件夹（这可能需要一段时间），最后打开 IDE 界面\n\n\
  ![image](img/hot.jpg)\n\n如果你希望应用运行在 Google Play 商店 100% 的活跃设备上，请选择 `API 15`。\n\n\
  ![image](img/forget.jpg)\n\n你可以在这里更改建议的名称，但请确保勾选 `Generate Layout File`（生成布局文件）和\
  \ `Backwards Compatibility`（向后兼容）框。\n\n## 探索项目文件\n\nAndroid Studio IDE 提供了一个 Project\
  \ 窗口，显示项目内所有文件和文件夹的可展开树。你可以点击 Project 窗口中的任何箭头来展开文件夹，并双击 Project 窗口中的任何文件在标签 Editor\
  \ 窗口中打开它。\n\n![image](img/pg176_1.jpg)\n\n尽管初看起来很复杂，但开发者只需修改两个文件即可创建一个自定义应用程序：\n\
  \n* `MainActivity.java` – 负责将控件加载到应用界面的 Java 文件，并可以包含事件处理代码，以响应应用界面中的用户操作。\n* `activity_main.xml`\
  \ – 用于定义显示在应用界面中的每个控件及其布局的 XML 文件。\n\n![image](img/hot.jpg)\n\n如果 Project 窗口没有立即显示，请点击左侧边栏中的\
  \ Project 按钮，或使用快捷键 `Alt + F1` 打开它。\n\n在 Project 窗口中选择 `activity_main.xml` 文件，它将在\
  \ Editor 窗口中以两种视图之一显示——视觉上的 Design（设计）视图或程序化的 Text（文本）视图。窗口底部有标签可以切换视图。\n\n![image](img/pg177_1.jpg)\n\
  \nDesign 提供了一个 Palette（调色板），可以将控件拖动到应用的图形化表示上；一个用于选择任何添加控件的 Component Tree（组件树），以及一个用于修改所选控件外观的\
  \ Properties（属性）窗口。\n\nText 提供了布局的“后台”版本，使用 XML 属性描述添加控件的每个方面。\n\n![image](img/pg177_2.jpg)\n\
  \n控件可以在 Design 视图中通过视觉方式修改，也可以在 Text 视图中通过程序方式修改。\n\n## 添加资源与控件\n\n### 图像资源\n\n\
  要开始为 Lotto 程序自定义默认的 Android Studio 空应用，首先可以将图像作为“资源”添加：\n\n![image](img/1g.jpg)右键点击\
  \ `Lotto.png` 图像，并选择 `Copy`（复制）\n\n![image](img/2g.jpg)接下来，右键点击 `app>res>drawable`\
  \ 文件夹并选择 `Paste`（粘贴）——会出现一个“Copy”对话框\n\n![image](img/3g.jpg)将文件重命名为小写的 `lotto.png`\n\
  \n![image](img/4g.jpg)点击 `OK` 查看文件现在出现在 `drawable` 文件夹中\n\n![image](img/pg178_1.jpg)\n\
  \n![image](img/snake.jpg)\n\nAndroid 资源项仅支持小写文件名。\n\n![image](img/pg178_2.jpg)\n\
  \n### 界面控件\n\nLotto 应用需要三个在垂直布局中上下对齐的界面控件。Logo 需要一个 ImageView 控件，输出需要一个 TextView\
  \ 控件，用户交互需要一个 Button 控件：\n\n![image](img/1g.jpg)在 Editor 的 Text 视图中打开 `activity_main.xml`\
  \ 文件\n\n![image](img/xml.jpg)\n\nactivity main.xml\n\n![image](img/2g.jpg)在现有的默认\
  \ TextView 元素之前立即插入此 ImageView 控件元素\n\n```xml\n<ImageView\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    app:srcCompat=\"\
  @drawable/lotto\"\n    android:id=\"@++id/imageView\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n![image](img/forget.jpg)\n\n`app:srcCompat` 属性引用了添加到 `drawable`\
  \ 文件夹的图像资源。\n\n该元素中的属性使控件适应布局容器的宽度，并将控件放置在容器的顶部。图像资源被定义为内容源，并为元素分配 id 以供其他元素引用。\n\
  \n![image](img/3g.jpg)编辑现有的 TextView 元素使其像这样\n\n```xml\n<TextView\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@++id/textView\"\
  \n    android:height=\"60dp\"\n    android:textSize=\"36sp\"\n    android:gravity=\"\
  center_horizontal\" \n    app:layout_constraintTop_toBottomOf=\"@++id/imageView\"\
  \ />\n```\n\n![image](img/4g.jpg)在 TextView 之后直接插入此元素\n\n```xml\n<Button\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@++id/button\"\
  \n    android:textSize=\"24sp\"\n    android:onClick=\"lotto\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/textView\" />\n```\n\n![image](img/hot.jpg)\n\n元素中的 `android:id` 属性指定了一个唯一名称，以便在代码中引用控件。\n\
  \n![image](img/hot.jpg)\n\n`android:onClick` 属性指定了要调用的事件处理程序名称。\n\n### 字符串资源\n\n\
  分配给内容和按钮文本的字符串都应转换为字符串资源：\n\n![image](img/1g.jpg)点击 `Lotto Logo` 字符串赋值使其聚焦，然后按 `Alt\
  \ + Enter` 查看 QuickFix 对话框\n\n![image](img/pg179_1.jpg)\n\n选择 `Extract resource`（提取字符串资源），然后在“Extract\
  \ Resource”对话框中提供资源名称\n\n![image](img/pg179_2.jpg)\n\n![image](img/3g.jpg)点击 `OK`\
  \ 关闭对话框，看到分配的字符串被替换为资源的引用\n\n![image](img/pg179_3.jpg)\n\n![image](img/4g.jpg)对\
  \ `GET MY NUMBERS` 字符串重复此操作\n\n### 插入 Java 代码\n\n添加资源和控件后，应用界面现在应该像 `Lotto.jar`\
  \ 应用程序一样\n\n![image](img/pg180_1.jpg)\n\n![image](img/snake.jpg)\n\n如果控件看起来不像截图所示，你应该返回此处并仔细检查每个元素的属性。\n\
  \n接下来可以通过向 `MainActivity.java` 文件中插入事件处理程序为应用添加功能，当用户按下按钮时响应按钮的 `onClick` 事件。此事件会自动向事件处理器传递一个参数，该参数是所点击控件的标识引用。因此，事件处理签名必须通过包含\
  \ `View` 类参数来适应这一点（它是所有控件的基类）。该方法也具有 `void` 返回类型：\n\n![image](img/1g.jpg)将此事件处理签名插入到\
  \ `MainActivity` 类中，紧跟在 `onCreate()` 方法块之后\n\n```java\npublic void lotto(View vue)\
  \ { }\n```\n\n![image](img/java.jpg)\n\nMainActivity.java\n\n可以通过将它们的身份作为 `findViewById()`\
  \ 方法的参数在代码中引用界面控件。这是在 `activity_main.xml` 中分配的 `android:id` 名称，并在前面加上 `R.id.`：\n\
  \n![image](img/2g.jpg)在事件处理器块内部，将 `<TextView>` 控件元素的引用赋值给变量\n\n```java\nTextView\
  \ txt = (TextView) findViewById( R.id.textView) ;\n```\n\n\n\n\n![image](img/3g.jpg)\n\
  最后，在事件处理器块中，从 `Lotto.java` 程序的事件处理器中复制代码（详见此处），该代码将输出六个唯一的随机数。\n\n```java\nint[\
  \ ] nums = new int[ 60 ] ; String str = “ ” ;\nfor ( int i = 1 ; i < 60 ; i++ )\
  \ { nums[ i ] = i ; }\nfor ( int i = 1 ; i < 60 ; i++ ) {\n    int r= ( int ) (\
  \ 59 * Math.random( ) ) + 1 ;\n    int t= nums[ i ] ; nums[ i ]= nums[ r ] ; nums[\
  \ r ]= t ;\n}\nfor ( int i = 1 ; i < 7 ; i++ ) {\n    str += “ ” + Integer.toString(\
  \ nums[ i ] ) + “ ” ;\n}\ntxt.setText( str ) ;\n```\n\n![image](img/forget.jpg)\n\
  \n在这种情况下，代码不需要检查调来源，因为事件处理器已通过 `activity_main.xml` 中的 `android:onClick` 属性显式地分配给按钮。\n\
  \n现在 Lotto 应用已经具备了所有的资源、控件和功能代码，可以尝试构建项目：\n\n![image](img/4g.jpg)\n在 Android Studio\
  \ 主工具栏上，点击 `View`、`Tool Windows`、`Messages` 以打开“Messages”窗口。\n\n![image](img/5g.jpg)\n\
  然后，点击 `Build`、`Make Project`（或按快捷键 `Ctrl + F9`）开始构建。\n\n![image](img/6g.jpg)\n“Messages”窗口将很快显示成功确认，或者报告任何需要修复的错误。\n\
  \n![image](img/pg181_1.jpg)\n\n![image](img/7g.jpg)\n如有必要，修复报告的错误，然后重新构建，直到看到成功确认。\n\
  \n![image](img/hot.jpg)\n\n如果构建尝试失败，请查看代码中的红色灯泡图标——Android Studio 添加了这些图标，以便你轻松找到并纠正错误。\n\
  \n### 测试应用程序\n\n一旦应用程序项目构建成功，就可以进行测试了。测试可以在通过 USB 接口连接到计算机真实 Android 设备上进行，也可以在\
  \ Android 虚拟设备（AVD）模拟器上进行。AVD 允许你测试应用在系列设备上的性能，但它们消耗更多的系统资源且速度可能缓慢。应用程序应该至少在一个手机设备和一个平板设备上测试：\n\
  \n![image](img/1g.jpg)\n点击 `Run`、`Run ‘app’`（或按快捷键 `Shift + F10`）打开“选择部署目标目标”对话框。\n\
  \n![image](img/pg182_1.jpg)\n\n![image](img/2g.jpg)\n选择一个 AVD 手机模拟器进行连接，然后点击 `OK`\
  \ 在模拟器上安装 Lotto 应用。\n\n![image](img/pg182_2.jpg)\n\n![image](img/3g.jpg)\n点击运行按钮，查看\
  \ `TextView` 内容在这个小设备屏幕上不理想的换行。\n\n![image](img/4g.jpg)\n编辑 `activity_main.xml`\
  \ 以减小字体大小 `android:textSize=”32sp”`。\n\n![image](img/5g.jpg)\n点击 `Build`、`Rebuild\
  \ Project` 以应用更改，然后在模拟器中再次运行应用以查看解决方案。\n\n![image](img/pg182_3.jpg)\n\n![image](img/pg182_4.jpg)\n\
  \n![image](img/snake.jpg)\n\n创建每个 AVD 模拟器可能需要下载大型系统镜像文件。你可能更喜欢在真实的 Android 设备上进行测试。还要注意，加速模拟器仅在计算机\
  \ CPU 支持硬件虚拟化（Intel VT-x 或 AMD SVM）时才会运行。\n\n![image](img/hot.jpg)\n\nAndroid Studio\
  \ 具有 Instant Run 功能，可以自动更新应用的更改，使其更快地出现在测试设备上。\n\n![image](img/forget.jpg)\n\n在真实设备上测试比在模拟器更好。理想情况下，在最终部署应用之前，你应该在尽可能不同的设备上进行测试。\n\
  \n![image](img/6g.jpg)\n拿一个 Android 平板电脑，在 `Settings`、`Developer Options` 菜单中开启“USB\
  \ 调试”。\n\n![image](img/7g.jpg)\n通过 USB 端口将平板连接到计算机显示此通知。\n\n![image](img/pg183_1.jpg)\n\
  \n![image](img/8g.jpg)\n点击 `Run`、`Run ‘app’`（或按快捷键 `Shift + F10`）打开“选择部署目标”对话框。\n\
  \n![image](img/pg183_2.jpg)\n\n![image](img/9g.jpg)\n选择已连接的平板设备，然后点击 `OK` 在平板上安装\
  \ Lotto 应用。\n\n![image](img/10g.jpg)\n点击运行按钮，查看 Lotto 应用按预期运行——一次成功的测试。\n\n![image](img/pg183_3.jpg)\n\
  \n![image](img/pg183_4.jpg)\n\n![image](img/pg183_5.jpg)\n\n测试过程提供了一个应用程序启动器，这样平板就可以断开连接，并通过点击启动图标启动应用。\n\
  \n\n\n\n\n![image](img/pg185_4.jpg)\n![image](img/pg185_3.jpg)\n\n## 总结\n\n- Java\
  \ 程序可以部署为在适当版本的 JRE 上运行的独立桌面应用程序。\n- 应用程序文件可以使用适当的 `java` 解释器分并在其他操作系统上执行。\n- 将所有程序文件打包成单个\
  \ JAR 归档文件有助于确保资源文件被意外隔离。\n- 可执行的 JAR 应用程序可以通过命令行提示符使用 `java -jar` 命令或通过点击其文件图标来运行。\n\
  - Java 程序可以轻松转换为 Android 操作系统程序，因为它包含了相似的核心库。\n- Android Studio 是开发 Android 应用程序的官方\
  \ IDE。\n- APK 和 JAR 归档文件都是以 ZIP 格式压缩的。\n- 每个 Android 应用首先以项目形式创建，开发者向该项目添加代码和资源。\n\
  - Android Studio 界面中最常用的窗口是项目（Project）窗口和编辑器（Editor）窗口。\n- 功能性代码可以添加到 `MainActivity.java`\
  \ 文件中，界面组件可以添加到 `activity_main.xml` 文件中。\n- Android 应用可以将图像和字符串作为资源存储。\n- 按钮的 `onClick`\
  \ 事件处理程序的签名必须包含一个 `View` 类对象的参数。\n- 可以通过指定其身份作为 `findViewById()` 的参数在代码中引用界面组件。\n\
  - Android Studio 提供了 AVD 模拟器进行测试，并允许在连接的真实设备上进行测试。\n- Android 应用的 Release 版本必须使用公钥证书进行数字签名。\n\
  \n![image](img/back1.jpg)\n![image](img/back2.jpg)\n![image](img/bcover.jpg)\n\n"
