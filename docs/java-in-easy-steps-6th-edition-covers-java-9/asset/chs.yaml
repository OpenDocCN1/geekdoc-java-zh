  \n![image](img/forget.jpg)\n\n布尔变量默认为 `false`。\n\n### 异常异常\n\n程序可能会遇到运行时问题，导致“异常”错误，这会停止程序的执行。这通常是由意外的用户输入引起的。因此，一个编写良好的程序应该尝试预测用户可能在运行时引起异常的所有可能方式。\n\
  \n可能出现异常的代码可以被识别并封装在 `try catch` 语句块中。这允许程序处理异常而不停止执行，如下所示：\n\n```java\n{\n    *可能出现异常的语句*\n\
  }\ncatch( Exception e )\n{\n    *对异常的响应语句*\n}\n```\n\n`catch` 关键字后面的括号指定了要捕获的异常类，并将其赋值给变量\
  \ `e`。顶层 `Exception` 类捕获所有异常。然而，可以使用多个 `catch` 语句来识别不同的低级异常类，为特定异常提供响应。\n\n最常见的异常是\
  \ `NumberFormatException`（当程序遇到非预期数字类型的值时产生）和 `ArrayIndexOutOfBoundsException`（当程序尝试访问索引大小之外的数组元素时产生）。为这些异常中的每一个创建一个单独的是有帮助的，以便及时通知用户问题的性质。\n\
  \n可选地，`try catch` 语句块可以使用 `finally` 语句块进行扩展，该块包含无论程序是否遇到异常都将始终执行的代码。\n\n![image](img/hot.jpg)\n\
  \n`e.getMessage()` 方法返回有关某些已捕获异常的进一步信息。\n\n![image](img/1p.jpg)创建一个名为“Exceptions”的新程序，包含标准的\
