  \n此更新器中的赋值是 `num = 110` 的简写。\n\n## 跳出循环\n\n`break` 关键字用于在满足特定条件时提前终止循环。`break` 语句位于循环内部，并位于测试表达式之前。当测试返回\
  \ `true` 时，循环结束，程序继续执行下一个任务。\n\n![image](img/1g.jpg)启动一个名为“Break”的新程序，其中包含标准的 main\
  \ 方法\n\n```java\nclass Break\n    public static void main ( String[] args ) {  \
  \  }\n}\n```\n\n![image](img/java.jpg)\nBreak.java\n\n![image](img/2g.jpg)在 main\
  \ 方法内部，创建两个嵌套的 `for` 循环，每次迭代时显示它们的计数器值\n\n```java\nfor ( int i = 1 ; i < 4 ; i++\
  \ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println(\
  \ “Running i=”+i+“ j=”+j ) ;\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Break.java`，然后编译并运行程序查看输出\n\
  \n\n此程序使外部循环进行三次迭代，每次迭代都执行内部循环。可以添加 `break` 语句来停止内部循环的第二次执行。\n\n![image](img/4g.jpg)在内部循环块开头添加此\
  \ `break` 语句，跳出内部循环\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int\
  \ j = 1 ; j < 4 ; j++ )\n    {\n        if ( i == 2 && j == 1 )\n        {\n   \
  \         System.out.println( “Breaks innerLoop when i=”+i+“ j=”+j ) ;\n       \
  \     break ;\n        }\n    }\n}\n```\n\n![image](img/5g.jpg)\n![image](img/pg53_1.jpg)\n\
  ![image](img/forget.jpg)\n\n在这里，当外部循环尝试第二次运行时，`break` 语句停止了内部循环的所有三次迭代。\n\n`continue`\
  \ 关键字用于在满足特定条件时跳过循环的单次迭代。`continue` 语句位于语句块内部，并位于测试表达式之前。当测试返回 `true` 时，该迭代结束。\n\
  \n![image](img/5g.jpg)在内部循环块开头添加此 `continue` 语句，跳过内部循环的第一次迭代\n\n```java\nfor ( int\
  \ i = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n       \
  \ if ( i == 1 && j == 1 )\n        {\n            System.out.println( “Continues\
  \ innerLoop when i=”+i+“ j=”+j ) ;\n            continue;\n        }\n    }\n}\n\
  ```\n![image](img/pg53_2.jpg)\n\n![image](img/forget.jpg)\n\n在这里，当外部循环尝试第一次运行时，`continue`\
  \ 语句仅跳过了内部循环的第一次迭代。\n\n\n\n\n\n![image](img/1g.jpg)启动一个名为“Label”的新程序，包含标准的 main\
  \ 方法\n\n```java\nclass Label\n{\n    public static void main ( String[] args ) {\
  \    }\n}\n```\n\n![image](img/java.jpg)\n\n\n![image](img/2g.jpg)在 main 方法内部，创建两个嵌套的\
  \ `for` 循环，在三次迭代中的每次显示它们的计数器值\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n \
  \   for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println( “Running\
  \ i=”+i+ “ j=”+j ) ;\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Label.java`，然后编译并运行程序以查看输出\n\
  \n![image](img/pg58_1.jpg)\n\n标记循环的语法需要一个标签名称，后跟一个冒号 `:`，放在循环结构开始之前\n\n![image](img/4g.jpg)修改外层循环的开头，将其标记为“outerLoop”\n\
  \nouterLoop : for ( int i = 1 ; i < 4 ; i++ )\n```\n\n要显式指定程序应在外层循环中继续，在 `continue`\
  \ 关键字之后写出该循环的标签名称\n\n![image](img/5g.jpg)将此 `continue` 语句添加到内层循环语句块的开头，以便进入外层循环的下一次迭代——然后重新编译并运行程序\n\
  \n```java\nif ( i == 1 && j == 1 )\n{\n    System.out.println( “Continues outerLoop\
  \ when i=” +i+ “ j=” +j ) ;\n    continue outerLoop ;\n}\n```\n\n![image](img/pg59_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n在这里 `continue` 语句停止了内层循环第一次运行的所有迭代——通过将控制权返回外层循环。要显式指定程序应从外层循环退出，在\
  \ `break` 关键字之后写出该循环的标签名称\n\n\n```java\nif ( i == 2 && j == 3 )\n{\n    System.out.println(\
  \ “Breaks outerLoop when i=” +i+ “ j=” +j ) ;\n    break outerLoop ;\n}\n```\n\n\
  ![image](img/pg59_2.jpg)\n\n![image](img/forget.jpg)\n\n在这里 `break` 语句停止了整个循环结构的所有迭代——通过退出外层循环。\n\
  \n## 总结\n\n- `if` 关键字执行条件测试，以评估表达式的布尔值为 `true` 或 `false`。\n- `if` 语句块可以包含一个或多个语句，这些语句仅在测试表达式返回\
  \ `true` 时才执行。\n- `else` 关键字指定了当 `if` 关键字执行的测试返回 `false` 时执行的备选语句。\n- 组合 `if else`\
  \ 语句使程序能够通过条件分支的过程继续。\n- 每个 `case` 选项都可以由 `break` 关键字终止，因此只有与该选项相关的语句会被执行。\n- `default`\
  \ 关键字可以指定当所有 `case` 选项都返回 `false` 时执行的语句。\n- 循环重复执行其包含的语句，直到测试表达式返回 `false` 为止。\n\
  - `for` 关键字后面的括号指定了循环的计数器初始化、测试表达式和计数器更新器。\n- `while` 循环和 `do while` 循环中的语句必须更改测试表达式中使用的值，以避免死循环。\n\
  - 测试表达式在 `for` 循环和 `while` 循环的开始处评估——在循环第一次迭代之前。\n- 测试表达式在 `do while` 循环的结束处评估——在循环第一次迭代之后。\n\
  - 使用 `continue` 关键字跳过循环迭代。\n- 使用 `break` 关键字终止循环。\n- 嵌套的内层循环可以使用标签配合 `break` 和 `continue`\
  \ 关键字来引用外层循环。\n\n# 4. 值的引导\n\n*本章演示了如何使用各种 Java 编程结构来引导数据值。*\n\n- 类型值强制转换\n- 创建变量数组\n\
  - 传递参数\n- 传递多个参数\n- 遍历元素\n- 更改元素值\n- 捕获异常\n- 总结\n\n## 类型值强制转换\n\n在 Java 编程中处理值需要严格遵守正确的数据类型，以避免编译器错误。例如，将\
  \ `float` 类型值发送到需要 `int` 类型值的方法将产生编译器错误。这意味着在处理某个值之前，通常有必要将其转换为另一种数据类型。\n\n数值值可以很容易地“强制转换”（转换）为另一种数值类型，使用以下语法：\n\
  \n```\n(int) value\n```\n\n将 `float` 值强制转换为 `int` 类型时会发生精度损失。例如，将 `365.25` 转换为 `int`\
  \ 时会被截断。\n\n数值值可以使用数值类的 `toString()` 方法转换为 `String`。例如，将 `int` 变量转换为 `String`：\n\
  \n```\nInteger.toString(num)\n```\n\n\n```\nFloat.toString(num)\n```\n\n在实践中，你经常需要将\
  \ `String` 转换为数值类型以便进行算术运算。使用 `Integer.parseInt()` 将 `String` 转换为 `int`：\n\n```\n\
  Integer.parseInt(msg)\n```\n\n或者使用 `Float.parseFloat()` 将 `String` 转换为 `float`：\n\
  \n```\nFloat.parseFloat(msg)\n```\n\n在将 `String` 值转换为数值类型时，该 `String` 可能只包含有效的数值，否则编译器将报告错误。\n\
  \n\n\n数组简单来说是一个包含多个值的变量——与只能包含单个值的普通变量不同。\n\n数组的声明首先使用数据类型关键字之一指明其数据类型，紧接着使用方括号\
  \ `[]` 表示它将是一个数组变量。接下来，声明数组变量的名称，并遵循标准的命名规范。\n\n![image](img/pinkbox.jpg)\n\n可以在声明数组时，通过将适当数据类型的值以逗号分隔的列表形式赋值（并包含在大括号\
  \ `{}` 中）来初始化数组。例如，一个初始化了三个值的整数数组变量的声明可能如下：\n\n```\nint[ ] numbersArray = { 1, 2,\
  \ 3 } ;\n```\n\n数组的长度根据所赋值列表的大小创建，每个值对应一个“元素”——在这种情况下，这是一个包含三个元素的数组。\n\n存储的值从零开始索引，每个值都可以通过其元素索引位置进行访问。这种操作的语法要求数组名后跟一个包含元素索引的方括号。例如，`numbersArray[0]`\
  \ 将访问上述示例中存储的第一个值 (1)。\n\n虽然每个元素中存储的值可以像普通变量一样简单地更改，但数组的大小由其声明决定，此后无法更改。有用的是，数组中的元素总数以整数形式存储在该数组的\
  \ `length` 属性中。访问该数字的语法只需在数组名后加上一个点和“length”。例如，`numbersArray.length` 将返回上述示例数组的大小——在本例中为整数\
  \ 3。\n\n数组也可以通过 `new` 关键字创建一个指定大小的空数组“对象”，从而在不分配初始值列表的情况下声明。所需的空元素数量在适当数据类型之后的方括号内的赋值语句中指定。例如，一个具有三个元素的空整数数组变量的声明可能如下：\n\
  \n```\n```\n\n`int` 和 `float` 数据类型的元素被赋予默认值零，`String` 数据类型赋值为 `null`，`char` 数据类型赋值为\
  \ `\\0`，`boolean` 数据类型赋值为 `false`。\n\n![image](img/snake.jpg)\n\n记住数组索引从零开始。这意味着\
  \ `index[2]` 访问的是数组中的第三个元素，而不是第二个元素。\n\n![image](img/1p.jpg)启动一个名为“Array”的新程序，其中包含标准的\
