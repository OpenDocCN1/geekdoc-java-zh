  \n## 操作字符\n\n`java.lang` 包中的 `String` 类提供了 `trim()` 方法，用于移除作为参数指定的 `String` 开头结尾的任何空白字符。该方法将移除极端的空格、换行和制表符，返回该\
  \ `String` 的修剪版本。\n`String` 中的单个字符可以通过指定其在 `String` 中的索引位置作为其 `charAt()` 方法的参数来访问。该方法将\
  \ `String` 视为字符数组，其中第一个字符位于位置零 ——就像其他从零索引的数组一样。`String` 中的第一个字符可以通过 `charAt(0)`\
  \ 访问，第二个字符可以通过 `charAt(1)` 访问，以此此类推。\n\n由于字符索引从零开始，`String` 中的最后一个字符的索引号始终比 `String`\
  \ 中的字符总少一。这意味着任何 `String` 的最后一个字符索引号等于 `length() - 1`。因此，名为 `str` 的 `String` 的最后一个字符可以通过\
  \ `str.charAt( str.length() - 1 )` 访问。\n\n可以使用 `replace()` 方法将 `String` 中所有特定特定字符替换为另一个字符。该方法需要两个参数，指定要替换的字符和要取其位置的字符。例如，要将所有的字母“a”替换为字母“z”，语法为\
  \ `replace( ‘a’ , ‘z’ )`。\n\n`isEmpty()` 方法可以检查 `String` 是否不包含字符。如果 `String` 绝对为空，该方法将返回\
  \ `true`，否则将返回 `false`。\n\n\n\n\n\n![image](img/2o.jpg)在 `main` 方法中，声明并初始化一个空的 `String`\
  \ 变量\n\n```java\nString txt = ““ ;\n```\n\n![image](img/3o.jpg)为 `String` 变量赋值一些字符，如果它确实为空，则包含前后的空格\n\
