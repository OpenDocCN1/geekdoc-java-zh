  public` 关键字允许从任何类访问，但默认访问只允许从同包的类访问\n\n### 继承现有类\n\n一个类可以通过在类声明中使用 `extends` 关键字来继承另一个类的特征——指定要继承的类名。例如，`class\
  \ Extra extends Base` 继承自 `Base` 类。继承类被称为“子”类，而它继承的类被称为“父”类。\n\n父类中创建的方法和变量通常可以像它们存在于子类中一样处理，除非它们被声明为\
  \ `private` 关键字，这会拒绝访问。父类方法可以使用类名和点符号法显式访问。例如，`SuperClass.run()`。需要注意的是，父类方法中的 `try\
  \ catch` 语句无法捕获发生在子类中的异常——调用语句必须封装在自己的，try catch` 语句中。\n\n![image](img/1bl.jpg)启动一个名为“SuperClass”的类\n\
