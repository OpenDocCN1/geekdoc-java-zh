  \n## 总结\n\n- 程序开头可以包含一个或多个 `import` 语句，以使其他类的功能可用。\n- `import` 语句可以使用通配符字符导入包中的所有类，也可以通过类名导入单个类。\n\
  - `java.io` 包包含设计用于处理输入和输出过程的类。\n- `File` 对象可以用于访问文件和目录。\n- `InputStreamReader`\
  \ 对象将输入字节解码为字符，而 `BufferedReader` 读取其解码后的字符。\n- `FileReader` 对象可以将文本文件字节解码为字符，以供\
  \ `BufferedReader` 对象读取。\n- `FileWriter` 对象和 `BufferedWriter` 对象可以创建和更新文本文件。\n-\
  \ `java.util` 包包含处理数据集合的工具，例如使用其 `Arrays` 类进行数组操作。\n- `java.util` 包还包含一个 `ArrayList`\
  \ 类，它拥有可以轻松操作顺序列表项的方法。\n- `ArrayList` 对象是一个集合（Collection），它必须指定列表可能包含的的泛型类型，例如 `<String>`。\n\
  - Lambda 表达式是一个匿名方法，可以在需要执行的地方指定。\n- `java.time` 包包含一个 `LocalDateTime` 类，该类提供了日期和时间组件的字段。\n\
  - `java.text` 包包含一个 `NumberFormat` 类，它可以格式化数字和货币。\n- `java.time.format` 包包含一个 `DateTimeFormatter`\
  \ 类，它可以指定用于格式化日期和时间的模式。\n\n8\n\n## 构建界面 \n\n*本章演示了如何使用 Java Swing 组件创建图形程序界面。*\n\
  \n- 创建窗口\n- 添加推按钮\n- 添加标签\n- 添加文本字段\n- 添加项目选择器\n- 添加单选按钮\n- 排列组件\n- 更改外观\n- 总结\n\
  \n## 创建窗口\n\n程序可以使用 Java 库中的“Swing”组件提供图形用户界面 (GUI)。`javax.swing` 包包含用于使用原生操作系统样式创建各种组件的类。通过在程序包含初始语句\
  \ `import javax.swing.*;`，可以让这些类对程序可用。\n\n必须创建一个类来表示 GUI，并可以向其中添加组件以构建界面。通过使用 `extends`\
  \ 关键字将其声明为 Swing 的 `JFrame` 类的子类可以轻松实现——从而继承允许用户移动、调整大小和关闭窗口的属性和行为。\n\n![image](img/snake.jpg)\n\
  \n通过想 `JAVA` e`Xtra` 来记住 `javax.swing` 中的字母 `x`。\n\n类构造函数应该包含设置这些硬性要求的语句：\n\n- 窗口标题——作为继承自\
  \ ` `` 类 `super()` 方法的 `String` 参数指定。\n- 窗口大小——以像素宽度和高度作为其 `setSize()` 方法的参数指定。\n\
  - 当用户关闭窗口时要做什么——作为其 `setDefaultCloseOperation()` 方法的常量参数指定。\n- 显示窗口——作为其 `setVisible()`\
  \ 方法的布尔参数指定。\n\n此外，构造函数可以向窗口添加一个 `JPanel` 容器组件，可以使用 `JFrame` 类的继承方法 `add()` 在其中添加更小的组件。\n\
  \n默认情况下，`JPanel` 容器采用 `FlowLayout` 布局管理器，该布局器从左到右行排列组件，并在窗口右边缘处换行。\n\n相反的步骤描述了如何创建一个包含带有\
  \ `FlowLayout` 布局管理器的 `JPanel` 容器的基本窗口。该窗口将出现在书中随后的示例中，这些示例演示了如何添加组件。\n\n![image](img/hot.jpg)布局管理器的详细说明请见\
  \ chapter08.html_sec72\n\n![image 启动一个导入所有 Swing 的程序```javaimport javax.swing.*;```![image](img/java.jpg)创建一个名为“Window”的\
  \ `JFrame` 类子类，包含主方法\n\n```java\nclass Window extends JFrame {\n    public static\
  \ void main ( String[] args ) {\n    }\n}\n```\n\n![image](img/2b.jpg)在主方法之前，创建一个\
  \ `JPanel` 容器\n\n```java\nJPanel pnl = new JPanel() ;\n```\n\n![image](img/3b.jpg)接下来，插入此构造方法以指定窗口并将\
  \ `JPanel` 对象添加到 `JFrame`\n\n```java\npublic Window() {\n    super( “Swing Window”\
  \ ) ;\n    setSize( 500 , 200 ) ;\n    setDefaultCloseOperation( EXIT_ON_CLOSE )\
  \ ;\n    add( pnl ) ;\n    setVisible( true ) ;\n}\n```\n\n![image](img/4b.jpg)通过在主方法中插入此行创建\
  \ Window 类实例\n\n```java\nWindow gui = new Window() ;\n```\n\n![image](img/5b.jpg)将程序保存为\
  \ `Window.java`，然后编译并运行程序以看到基本窗口出现\n\n![image](img/pg135_1.jpg)\n\n![image](img/pg135_2.jpg)\n\
  \n![image](img/forget.jpg)`EXIT_ON_CLOSE` 操作是 `JFrame` 类的一个常量。它在窗口关闭时退出程序。\n\n![image](img/hot.jpg)注意此处如何使用\
  \ `add()` 方法将 `JPanel` 对象添加到 `JFrame` 窗口。\n\n## 添加推按钮\n\nSwing `JButton` 类创建一个可以添加到图形界面的推按钮组件。这使用户可以通过点击按钮执行执行操作来与程序交互。\n\
  \n`JButton` 对象使用 `new` 关键字创建，其构造函数接受一个 `String` 参数，指定显示在按钮上的文本。\n\n图像也可以出现在按钮上。必须先创建一个\
  \ `ImageIcon` 对象来表示图像，通过作为其构造函数的参数指定图像文件名。通常，图像将位于程序旁边，但参数可以包含本地目录之外的图像路径。\n\n![image](img/hot.jpg)\n\
  \n创建用于响应用户操作（如点击按钮）的事件处理方法的细节可以在下一章找到。\n\n指定 `ImageIcon` 对象的名称作为 `JButton` 构造函数的参数，以便按钮上显示该图像，或指定\
  \ `String` 和 `ImageIcon` 作为其两个参数，以便同时显示文本和图像。\n\n\n\n\n![image](img/1b.jpg)从此处 复制\
  \ `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Buttons”\n\n![image](img/java.jpg)\n\
  \nButtons.java\n\n![image](img/2b.jpg)在 `Buttons()` 构造函数之前，创建两个 `ImageIcon` 对象\n\
  \n```\nImageIcon tick = new ImageIcon( “Tick.png” ) ;\nImageIcon cross = new ImageIcon(\
  \ “Cross.png” ) ;\n```\n\n![image](img/3b.jpg)接下来，创建三个 `JButton` 对象分别显示文本、图像以及文本和图像\n\
  \n```\nJButton btn = new JButton( “Click Me” ) ;\nJButton tickBtn = new JButton(\
  \ tick ) ;\nJButton crossBtn = new JButton( “STOP” , cross ) ;\n```\n\n![image](img/4b.jpg)在\
  \ `Buttons()` 构造函数内部，插入三条语句将 `JButton` 组件添加到 `JPanel` 容器中\n\n```\npnl.add( btn )\
  \ ;\npnl.add( tickBtn ) ;\npnl.add( crossBtn ) ;\n```\n\n![image](img/5b.jpg)将程序保存为\
  \ `Buttons.java`，然后编译并运行程序以在窗口中显示推按钮\n\n![image](img/forget.jpg)\n\n`JPanel` 对象有一个\
  \ `add()` 方法 – 用于向该面板添加组件。\n\n![image](img/pg137_1.jpg)\n\n![image](img/pg137_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n有关如何创建 Java 存档 (JAR) 的详情可以在此处 Find。\n\n按钮在点击时会有图形化响应，但在程序提供事件处理方法来响应每个点击事件之前，它们不会执行任何操作。\n\
  \n如果程序打算部署在单个 Java 存档 (JAR) 中，必须在创建表示它们的 `ImageIcon` 对象之前，通过 `ClassLoader` 对象加载图像资源。\n\
  \n向 `ClassLoader` 的 `getResource()` 方法指定资源文件名或路径会返回一个 `URL`，该 URL 可以用作 `ImageIcon`\
  \ 构造函数的参数。`java.net` 包提供了一个实用的 `URL` 类，可以先赋值给这些对象。\n\n![image](img/6b.jpg)在 `Buttons()`\
  \ 构造函数之前，创建一个 `ClassLoader` 对象\n\n```\nClassLoader ldr = this.getClass().getClassLoader()\
  \ ;\n```\n\n![image](img/7b.jpg)加载图像资源的 URL\n\n```\njava.net.URL tickURL = ldr.getResource(\
  \ “Tick.png” ) ;\njava.net.URL crossURL = ldr.getResource( “Cross.png” ) ;\n```\n\
  \n![image](img/8b.jpg)修改第 2 步中的 `ImageIcon()` 构造函数以使用 URL\n\n```\nImageIcon tick\
  \ = new ImageIcon( tickURL ) ;\nImageIcon cross = new ImageIcon( crossURL ) ;\n\
  ```\n\n![image](img/9b.jpg)保存更改，重新重新编译并运行程序 – 它将像以前一样运行，但现在可以部署到 JAR 中\n\n![image](img/hot.jpg)\n\
  \n注意此处是如何使用 `getClass()` 方法和 `this` 关键字来引用此类对象的。\n\n### 添加标签 (labels)\n\nSwing 的\
  \ `JLabel` 类创建一个可以添加到图形界面上的标签组件。它可以用于显示非交互式文本、图像或或文本和图像。\n\n`JLabel` 对象使用 `new`\
  \ 关键字创建，其构造函数接受一个 `String` 参数，指定要在该标签上显示的文本，或者表示要显示图像的 `ImageIcon` 对象的名称。它还可以接受三个参数，指定文本、图像以及作为\
  \ `JLabel` 常量值的水平对齐方式。例如，`JLabel( “text”, img, JLabel.CENTER )` 居中对齐。\n\n当 `JLabel`\
  \ 对象同时包含文本和图像时，可以通过指定 `JLabel` 常量作为 `JLabel` 对象的 `setVerticalPosition()` 和 `setHorizontalPosition()`\
  \ 方法的参数来确定文本的相对位置。\n\n此外，通过为对象的 `setToolTipText()` 方法指定文本 `String` 参数，可以让 `JLabel`\
  \ 对象在光标悬停在其上方时显示提示 (ToolTip)。\n\n![image](img/1b.jpg)从此处 复制 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Labels”\n\
  \n![image](img/java.jpg)\n\nLabels.java\n\n![image](img/2b.jpg)在 `Labels()` 构造函数之前，创建一个\
  \ `ImageIcon` 对象\n\n```\nImageIcon duke = new ImageIcon( “Duke.png” ) ;\n```\n\n\
  ![image](img/3b.jpg)接下来，创建三个 `JLabel` 对象分别显示图像、文本以及文本和图像\n\n```\nJLabel lbl1 = new\
  \ JLabel( duke ) ;\nJLabel lbl2 = new JLabel( “Duke is the friendly mascot of Java\
  \ technology.” ) ;\nJLabel lbl3 = new JLabel( “Duke” , duke , JLabel.CENTER ) ;\n\
  ```\n\n![image](img/4b.jpg)在 `Labels()` 构造函数内部，插入此语句为第一个标签创建一个提示\n\n```\nlbl1.setToolTipText(\
  \ “Duke - Mascot” ) ;\n```\n\n![image](img/5b.jpg)添加这两条语句使第三个标签居中对齐并位于底部\n\n```\n\
  lbl3.setHorizontalPosition( JLabel.CENTER ) ;\nlbl3.setVerticalPosition( JLabel.BOTTOM\
  \ ) ;\n```\n\n![image](img/6b.jpg)现在添加三条语句将 `JLabel` 组件添加到 `JPanel` 容器中\n\n```\n\
  pnl.add( lbl1 ) ;\npnl.add( lbl2 ) ;\npnl.add( lbl3 ) ;\n```\n\n![image](img/7b.jpg)将程序保存为\
  \ `Labels.java`，然后编译并运行程序，将光标放在第一个标签上\n\n![image](img/pg137_1.jpg)\n\n![image](img/pg137_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n`JLabel` 对齐常量包括 `LEFT`、`CENTER`、`RIGHT`、`TOP` 和 `BOTTOM`。\n\
  \n如果程序打算部署在单个 Java 存档 (JAR) 中，必须在创建表示它的 `ImageIcon` 对象之前，通过 `ClassLoader` 对象加载资源。\n\
  \n![image](img/8b.jpg)在 `Labels()` 构造函数之前，创建一个 `ClassLoader` 对象\n\n```\nClassLoader\
  \ ldr = this.getClass().getClassLoader() ;\n```\n\n![image](img/9b.jpg)修改第 2 步中的\
  \ `ImageIcon()` 构造函数，使用 `ClassLoader` 对象加载图像资源的 URL\n\n```\nImageIcon duke = new\
  \ ImageIcon( ldr.getResource( “Duke.png” ) ) ;\n```\n\n![image](img/10b.jpg)保存更改，重新编译并运行程序\
  \ – 它将像以前一样运行，但现在可以部署到 JAR 中\n\n![image](img/hot.jpg)\n\n### 添加文本字段 (text fields)\n\
  \nSwing 的 `JTextField` 类创建一个可以添加到图形界面上的单行文本字段组件。它可以用于显示可编辑文本，并允许用户输入文本以与程序交互。\n\n\
  `JTextField` 对象使用 `new` 关键字创建，其构造函数可以接受一个 `String` 参数，指定要在字段中显示的默认文本。在这种情况下，组件的大小将根据该\
  \ `String` 的长度进行调整。或者，参数可以是一个数值，用于指定文本字段的大小。构造函数还可以接受两个参数，同时指定默认文本和文本字段的大小。\n\n\
  在需要输入字符不可见的情况下，使用 `JPasswordField` 类代替 `JTextField` 类。\n\n多行文本字段可以使用 `JTextArea`\
  \ 类创建，其构造函数接受两个数值参数，分别指定其行数和宽度。或者，也可以提供三个参数，指定默认文本、行数和宽度。通过为 `JTextArea` 对象的 `setLineWrap()`\
  \ 方法和 `setWrapStyleWord()` 方法指定 `true` 作为参数，可以使该字段内在单词末尾自动换行。\n\n\n\n\n\n当输入到 `JTextArea`\
  \ 组件的文本超过其初始大同时，组件将扩展以容纳这些文本。要使组件具有具有滚动能力的固定大小，可以将其放置在 `JScrollPane` 容器中。这可以通过 `new`\
  \ 关键字创建，并并以 `JTextArea` 的名称作为其参数。\n\n默认情况下，滚动条仅在字段包含超过其初始大小的文本时才会出现——但通过向 `JScrollPane`\
  \ 对象的 `setVerticalScrollBarPolicy()` 或 `setHorizontalScrollBarPolicy()` 方法（其命名非常直观）传递\
  \ `JScrollPane` 常量作为参数，可以使其始终出现。例如，要始终显示垂直滚动条，请使用 `JScrollPane.VERTICAL_SCROLLBAR_ALWAYS`\
  \ 常量作为参数。\n\n![image](img/1b.jpg)\n\n从这里 编辑 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“TextFields”\n\
  \n![image](img/java.jpg)\n\nTextFields.java\n\n![image](img/2b.jpg)\n\n在 `TextFields()`\
  \ 构造函数之前，创建两个 `JTextField` 对象\n\n```java\nJTextField txt1 = new JTextField( 38 )\
  \ ;\nJTextField txt2 = new JTextField( “Default Text” , 38 ) ;\n```\n\n![image](img/3b.jpg)\n\
  \n创建一个五行高的 `JTextArea` 对象\n\n```java\nJTextArea txtArea = new JTextArea( 5 , 37\
  \ ) ;\n```\n\n![image](img/4b.jpg)\n\n添加一个 `JScrollPane` 对象 – 用于包含第 3 步中创建的 `JTextArea`\n\
  \n```java\nJScrollPane pane = new JScrollPane( txtArea ) ;\n```\n\n![image](img/5b.jpg)\n\
  \n在 `TextFields()` 构造方法中，插入语句使 `JTextArea` 对象能够在单词末尾换行\n\n```java\ntxtArea.setLineWrap(\
  \ true ) ;\ntxtArea.setWrapStyleWord( true ) ;\n```\n\n![image](img/6b.jpg)\n\n\
  插入一条语句，为 `JTextArea` 对象始终显示垂直滚动条\n\n```java\npane.setVerticalScrollBarPolicy ( JScrollPane.VERTICAL_SCROLLBAR_ALWAYS\
  \ ) ;\n```\n\n![image](img/7b.jpg)\n\n插入两条语句，将 `JTextField` 组件添加到 `JPanel` 容器中\n\
  \n```java\npnl.add( txt1 ) ;\npnl.add( txt2 ) ;\n```\n\n![image](img/8b.jpg)\n\n\
  插入另一条语句，将包含 `JTextArea` 字段的 `JScrollPane` 容器添加到 `JPanel` 容器中\n\n```java\npnl.add(\
  \ pane ) ;\n```\n\n![image](img/9b.jpg)\n\n将程序保存为 `TextFields.java`，然后编译并运行程序，在文本区域输入一些文本\n\
  \n![image](img/pg141_1.jpg)![image](img/pg141_2.jpg)![image](img/snake.jpg)\n\n\
  除非 `JTextArea` 组件位于 `JScrollPane` 组件内部，否则它没有滚动能力。\n\n### 添加选择器\n\nSwing `JCheckBox`\
  \ 类创建一个可以添加到图形界面的复选框组件。这可以用于允许用户选择或取消选择单个项目。\n\n`JCheckBox` 对象通过 `new` 关键字创建，其构造函数接受一个\
  \ `String` 参数，用于指定在该复选框旁边显示的文本。它还可以接受第二个 `true` 参数，以使复选框默认被选中。\n\n`JComboBox` 类可以提供一组项目选择，它创建一个下拉列表，用户可以从列表中选择任何单个项目。该对象通过\
  \ `new` 关键字创建，其构造函数通常接受一个 `String` 数组作为参数。数组中的每个元素都为下拉列表提供一个供选择的项目。\n\n同样，`JList`\
  \ 类也可以提供一组项目选择，它创建一个固定大小的列表，用户可以从中选择一个或多个项目。它通过 `new` 关键字创建，其构造函数也接受数组作为参数，每个元素提供一个供选择的项目。由于\
  \ `JList` 和 `JComboBox` 都是集合（Collections），它们必须指定它们包含的泛型类型，例如 `<String>`。\n\n![image](img/1b.jpg)\n\
  \n从这里 编辑 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Items”\n\n![image](img/java.jpg)\n\
  \nItems.java\n\n![image](img/2b.jpg)\n\n在 `Items()` 构造函数之前，创建一个用于选择的项目的 `String`\
  \ 数组\n\n```java\nString[] toppings = { “Pepperoni” , “Mushroom” , “Ham” , “Tomato”\
  \ };\n```\n\n![image](img/3b.jpg)\n\n接下来，创建四个 `JCheckBox` 对象来展示数组中的每个项目供选择——其中一个默认被选中\n\
  \n```java\nJCheckBox chk1 = new JCheckBox( toppings[0] ;\nJCheckBox chk2 = new JCheckBox(\
  \ toppings[1] , true ) ;\nJCheckBox chk3 = new JCheckBox( toppings[2] ) ;\nJCheckBox\
  \ chk4 = new JCheckBox( toppings[3] ) ;\n```\n\n![image](img/4b.jpg)\n\n添加第二个用于选择的项目\
  \ `String` 数组\n\n```java\nString[] styles = { “Deep Dish” , “Gourmet Style” , “Thin\
  \ & Crispy” };\n```\n\n![image](img/5b.jpg)\n\n创建一个 `JComboBox` 对象，展示第二个数组中的每个项目供选择\n\
  \n```java\nJComboBox<String> box1 = new JComboBox<String>( styles ) ;\n```\n\n![image](img/6b.jpg)\n\
  \n添加一个 `JList` 对象，从列表中展示第一个数组中的每个项目供选择\n\n```java\nJList<String> lst1 = new JList<String>(\
  \ toppings ) ;\n```\n\n![image](img/7b.jpg)\n\n在 `Items()` 构造方法中，插入语句将每个 `JCheckBox`\
  \ 组件添加到 `JPanel` 容器\n\n```java\npnl.add( chk1 ) ;\npnl.add( chk2 ) ;\npnl.add( chk3\
  \ ) ;\npnl.add( chk4 ) ;\n```\n\n![image](img/8b.jpg)\n\n插入语句设置默认选择并将 `JComboBox`\
  \ 组件添加到 `JPanel` 容器\n\n```java\nbox1.setSelectedIndex( 0 ) ;\npnl.add( box1 ) ;\n\
  ```\n\n![image](img/9b.jpg)\n\n现在，插入一条语句将 `JList` 组件添加到 `JPanel` 容器\n\n```java\n\
  pnl.add( lst1 ) ;\n```\n\n![image](img/10b.jpg)\n\n将程序保存为 `Items.java`，然后编译并运行程序，从列表中选择项目\n\
  \n![image](img/pg143_1.jpg)![image](img/pg143_2.jpg)![image](img/forget.jpg)\n\n\
  `JComboBox` 组件只能选择一个项目——`JList` 组件可以选择多个项目。\n\n![image](img/hot.jpg)\n\n### 添加单按钮\n\
  \nSwing `JRadioButton` 类创建一个可以添加到图形界面的单按钮组件。这可以用于允许用户从单按钮组中选择项目。\n\n`JRadioButton`\
  \ 对象通过 `new` 关键字创建，其构造函数接受一个 `String` 参数，用于指定在该单按钮旁边显示的文本。它还可以接受第二个 `true` 参数，以使单按钮默认被选中。\n\
  \n`ButtonGroup` 对象逻辑上对一组单按钮进行分组，使得组内只有一个按钮被选中。通过指定名称作为组 `add()` 方法的参数，可以将每个单按钮添加到\
  \ `ButtonGroup` 对象。\n\n![image](img/1b.jpg)\n\n在 `Radios()` 构造函数之前，创建三个 `JRadioButton`\
  \ 对象——其中一个默认被选中\n\n```java\nJRadioButton rad1 = new JRadioButton( “Red” , true )\
  \ ;\nJRadioButton rad2 = new JRadioButton( “Rosé” ) ;\nJRadioButton rad3 = new JRadioButton(\
  \ “White” ) ;\n```\n\n![image](img/2b.jpg)\n\n接下来，创建一个 `ButtonGroup` 对象以便对单按钮进行分组\n\
  \n```java\nButtonGroup wines = new ButtonGroup() ;\n```\n\n![image](img/3b.jpg)\n\
  \n在 `Radios()` 构造方法中，插入语句将每个 `JRadioButton` 组件添加到 `JPanel` 容器\n\n```java\nwines.add(\
  \ rad1 ) ;\nwines.add( rad2 ) ;\nwines.add( rad3 ) ;\n```\n\n\n\n\n\n## 排版组件\n\n\
  `java.awt` 包（抽象窗口）包含许多布局管理器类，可以使用它们将不同的方式放置在容器中。使用 `new` 关键字创建布局管理器对象，然后可以将其作为 `JPanel`\
  \ 构造函数的参数，以便让面板使用该布局。当组件被添加到面板时，它们将根据指定布局管理器的规则进行放置。\n\n| 布局管理器 | 规则 |\n| :--- |\
  \ :--- |\n| `BorderLayout` | 将组件放置在北、南、东、中位置（内容面板的默认布局） |\n| `BoxLayout` | 放置在单行或单列中\
  \ |\n| `CardLayout` | 在不同时间将不同的组件放置在指定区域 |\n| `FlowLayout` | 从左到右在换行行内放置（`JPanel`\
  \ 的默认布局） |\n| `GridBagLayout` | 在单元格网格中放置，允许组件跨越单元格 |\n| `GridLayout` | 在行和列网格中放置\
  \ |\n| `GroupLayout` | 在水平和垂直方向上放置 |\n| `SpringLayout` | 通过间距放置 |\n\n顶层 `JFrame`\
  \ 对象有一个“内容面板”容器，它默认使用 `BorderLayout` 布局管理器放置组件。这可以用来放置多五个 `JPanel` 容器，每个面板可以使用它们默认的\
  \ `FlowLayout` 布局管理器，或上述的任何一种布局管理器。使用多种布局管理器可以满足大多数布局需求。\n\n内容面板可以用 `java.awt.Container`\
  \ 对象表示，其 `add()` 方法可以指定要放置在内容面板内的组件的位置和名称。\n\n![image](img/forget.jpg)\n\n你可以在 Java\
  \ 文档的 `java.awt` 部分找到每个布局管理器的更多详细信息。\n\n![image](img/1b.jpg)\n\n## 更改外观\n\n从这里 复制\
  \ `Window.java` 的副本，将类声明、构造函数和实例从“Window”更改为“Layout”，然后在程序开头添加一条语句来导入 `java.awt`\
  \ 包的功能。\n\n```\nimport java.awt.*;\n```\n\n![image](img/java.jpg)\n\nLayout.java\n\
  \n![image](img/2b.jpg)\n\n在 `Layout()` 构造函数之前，创建一个代表 `JFrame` 内容面板容器的 `Container`\
  \ 对象。\n\n```\nContainer contentPane = getContentPane();\n```\n\n![image](img/3b.jpg)\n\
  \n使用 `GridLayout` 布局管理器创建一个 2 x 2 网格的第二个 `JPanel` 对象。\n\n```\nJPanel grid = new\
  \ JPanel( new GridLayout( 2 , 2 ) );\n```\n\n![image](img/4b.jpg)\n\n在 `Layout()`\
