  \ 的类，它以有序的“集合”（可调整序列）存储数据。通过导入特定类 `util.ArrayList` 可以使其程序可用。列表可以包含重复元素，`ArrayList`\
  \ 对象允许通过指定索引来操作存储的值。例如，列表的方法调用 `get(0)` 将检索存储在第一个元素的值，而 `remove(1)` 将删除第二个列表元素。\n\
  \n可以通过指定索引号和新值作为 `set()` 方法的参数来修改元素值。可以通过指定索引号和值作为 `add()` 方法的参数向特定位置添加元素。列表通过移动元素值来适应额外的元素。\n\
  \n![image](img/hot.jpg)\n\n你可以通过调用 `size()` 方法发现列表当前有多少个元素。\n\n`ArrayList` 对象只需使用\
  \ `new` 关键字创建，但与其他 Java 集合一样，语句必须指定列表可能包含泛泛类型。通常，列表包含 `String` 项目，因此 `ArrayList`\
  \ 必须带有 `<String>` 后缀。\n\n集合（如 `ArrayList`）有一个 `forEach()` 方法可以遍历列表中的每个元素。这使得遍历包含的所有项目变得简单。\n\
  \n通过指定“Lambda 表达式”作为 `forEach()` 方法的参数，可以方便地引用每个存储的列表项。Lambda 表达式只是短匿名（未命名）方法，可以在执行的位置指定。它们以括号开始，包含任何参数，然后是\
  \ `->` 字符序列，最后是语句块\n\n参数的数据类型可以显式声明，也可以从上下文中推断——`(String x)` 可以简单为 `(x)`。此外，如果 Lambda\
  \ 表达式语句块只包含一个语句，可以省略大括号。\n\n\n\n\n通过列表的 `forEach()` 方法，迭代中的当前元素值可以作为参数传递给 lambda\
  \ 表达式，然后通过语句在输出中显示。\n\n![image](img/hot.jpg)\n\nLambda 表达式在 Java 8 中引入，以实现简洁的匿名方法。\n\
