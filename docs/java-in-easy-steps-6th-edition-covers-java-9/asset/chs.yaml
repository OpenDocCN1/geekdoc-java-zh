  \n给变量分配错误的数据类型将导致错误。\n\n### 比较值\n\n比较运算符列如下表，用于比较表达式中的两个值并返回单个布尔值 `true` 或 `false`——用于描述该比较的结果。\n\
  \n| :--- | :--- |\n| `==` | 相等 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `>=` | 大于等于 |\n\
  | `<` | 小于 |\n| `<=` | 小于等于 |\n\n`==` 相等运算符比较两个操作数，如果两者的值完全相等，则返回 `true`。如果两个都是相同的数字，则它们相等；如果两个都是包含相同顺序相同字符的\
  \ `String` 值，则它们相等。两个均为 `true` 或均为 `false` 的布尔操作数是相等的。\n\n相反，`!=` 不等于运算符在两个操作数不相等时返回\
  \ `true`——适用与相等运算符相同的规则。\n\n相等和不等于运算符对于测试两个变量的状态以执行程序的“条件分支”非常有用——根据条件向不同的方向继续运行。\n\
  \n`>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回 `true`。\n\n`<` “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个，则返回\
  \ `true`。\n\n在 `>` “大于”运算符或 `<` “小于”运算符后添加 `=` 赋值运算符，可以使其在两个操作数的值完全相等时也返回 `true`。\n\
  ![image](img/hot.jpg)\n\n`<` 小于运算符通常用于测试循环中的计数器值——可以在此处找到此类示例。\n\n按照以下步骤在 Java shell\
  \ 中探索 Java 比较运算符：\n\n![image](img/1r.jpg)打开命令行提示符窗口，然后输入 `jshell` 并按 `Enter` 键启动\
  \ Java shell\n\n![image](img/2r.jpg)接下来，输入语句初始化两个 `String` 变量\n\n```java\nString\
  \ txt = \"Super \"; String lang = \"Java\";\n```\n\n![image](img/3r.jpg)现在，分别输入语句来添加并赋值\
  \ `String` 值，然后显示拼接后的字符串结果\n\n```java\nboolean state = txt == lang;\nstate = txt\
  \ != lang;\n```\n\n\n![image](img/4r.jpg)以类似的方式，分别输入语句来添加并赋值一个 `int` 值，然后显示总计整数结果\n\
  \n```java\nint dozen = 12; int score = 20;\n```\n\n```java\nstate = dozen > score;\n\
  state = dozen < score;\n```\n\n![image](img/pg29_2.jpg)\n\n![image](img/new.jpg)\n\
  \n可以通过输入 `help` 命令在 Java shell 中发现更多选项。\n\n### 评估逻辑\n\n逻辑运算符如下表，用于将多个返回布尔值的表达式组合成返回单个布尔值的复杂表达式。\n\
  | **运算符：** | **操作：** |\n| :--- | :--- |\n| `&&` | 逻辑与 |\n| `||` | 逻辑或 |\n| `!` |\
  \ 逻辑非 |\n\n逻辑运算符用于具有布尔值 `true` 或 `false`的操作数，或者可以转换为 `true` 或 `false` 的值。\n\n`&&`\
  \ 与运算符将评估两个操作数，仅当两个操作数均为 `true` 时才返回 `true`。否则，逻辑 `&&` 运算符将返回 `false`。这种评估可用于条件分支，即只有当两个测试条件均为真时，程序才会执行特定操作。\n\
  \n与需要两个操作数均为 `true` 的逻辑 `&&` 运算符不同，`||` 或运算符评估其两个操作数，如果其中一个操作数为 `true`，则返回 `true`——只有当两个操作数都不为\
  \ `true` 时才会返回 `false`。这在 Java 编程中非常有用，可以在满足任一测试条件时执行特定操作。\n\n`!` 非运算符是一个单元运算符，用于单个操作数之前。它返回给定操作数的反向布尔值——将\
  \ `true` 反转为 `false`，将 `false` 反转为 `true`。它在 Java 程序中非常有用，可以使用 `goState=!goState`\
  \ 语句在连续循环迭代中切换变量的值。这确保了每次循环值都会变化，就像开关灯一样。\n\n注意如何将表达式放在括号中以提高可读性。\n\n\n\n\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入\
  \ `jshell` 并按 `Enter` 键启动 Java 壳\n\n\n```java\nboolean yes = true ; boolean no =\
  \ false ;\n```\n\n![image](img/3r.jpg)输入语句测试两个条件是否都真\n\n```java\nboolean result\
  \ = ( yes && yes ) ; result = ( yes && no ) ;\n```\n\n![image](img/pg33_1.jpg)\n\
  \n![image](img/4r.jpg)输入语句测试两个条件中是否有一个为真\n\n```java\nresult = ( yes || yes ) ;\n\
  result = ( yes || no ) ;\nresult = ( no || no ) ;\n```\n\n\n```java\nresult = yes\
  \ ; result = !yes ;\n```\n\n![image](img/pg33_2.jpg)\n\n![image](img/hot.jpg)\n\n\
  注意 `false && false` 返回 `false` 而不是 `true` —— 这证明了“两个错产生出一个对的”这一格言。\n\n![image](img/forget.jpg)\n\
  \n`!` NOT 逻辑运算符返回的值是存储值的反值——存储值本身保持不变。\n\n### 检查条件\n\nJava 程序员最喜爱的运算符可能就是 `? :`\
  \ 条件运算符，它能以非常简洁的方式实现强大的语句。它不寻常的语法初看起来可能难以理解，但了解这个实用的运算符是非常值得的。\n\n条件运算符首先评估一个表达式以获得\
  \ `true` 或 `false` 值，然后根据评估结果返回两个给定操作数中的一个。它的语法如下：\n\n```java\n( boolean-expression\
  \ ) ? if-true-return-this : if-false-return-this ;\n\n![image](img/hot.jpg)\n\n\
  条件运算符也被“三元”运算符。\n\n每个指定的操作数选项都允许程序根据测试表达式返回的布尔值继续执行。例如，选项可以返回一个 `String` 值：\n\n\
  ```java\nstatus = ( quit == true ) ? “Done!” : “Continuing...” ;\n```\n\n在这种情况下，当\
  \ `quit` 变量为 `true` 时，条件运算符将其第一个操作数的值赋值给 `status` 变量；否则，它赋值其第二个操作数的值。\n\n编写 Java\
  \ 程序时可用的一种简写方式允许表达式在评估简单布尔值时可选省略 `== true`，因此上面的示例可以简单地写为：\n\n```java\nstatus =\
  \ ( quit ) ? “Done!” : “Continuing...” ;\n```\n\n条件运算符可以返回任何数据类型的值，并采用任何有效的测试表达式。例如，表达式可以使用大于\
  \ `>` 运算符来评估两个数值，然后根据结果返回一个布尔值：\n\n```java\n```\n\n同样，条件运算符可能使用不等于 `!=` 运算符来评估一个\
  \ `String` 值，然后根据结果返回一个数值：\n\n```java\nbodyTemperature = ( scale != “Celsius” )\
  \ ? 98.6 : 37.0 ;\n```\n\n![image](img/new.jpg)\n\n你也可以使用命令 `jshell--feedback verbose`\
  \ 启动 Java 壳，以便每次评估后接收性输出。\n\n按照以下步骤在 Java 壳中探索 Java 条件运算符：\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入\
  \ `jshell` 并按 `Enter` 键启动 Java 壳\n\n![image](img/2r.jpg)接下来，输入语句来初始化两个 `int` 变量\n\
  \n```java\n```\n\n![image](img/3r.jpg)声明另一个变量来存储测试结果 `String`\n\n```java\nString\
  \ result ;\n```\n\n![image](img/4r.jpg)输入此语句确定第一个整数值是奇数还是偶数\n\n```java\nresult =\
  \ ( num1 % 2 != 0 ) ? “Odd” : “Even” ;\n```\n\n![image](img/pg35_1.jpg)\n\n![image](img/5r.jpg)现在，输入此语句确定第二个整数值是奇数还是偶数\n\
  \n```java\nresult = ( num2 % 2 != 0 ) ? “Odd” : “Even” ;\n```\n![image](img/pg35_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n注意未初始化的 `String` 变量返回特殊的 `null` 值 —— 表示它不包含任何内容。\n\n\
  ![image](img/forget.jpg)\n\n在这里，当存在任何剩余时，表达式评估为真。\n\n### 设置优先级\n\n包含多个运算符和操作数的复杂表达式，除非执行顺序明确，否则可能会产生歧义。这种缺乏清晰度很容易导致同一个表达式暗示不同的结果。例如，考虑这个复杂表达式：\n\
  \n```java\nnum = 8 + 4 * 2 ;\n```\n\n从左到右计算，`8 + 4 = 12`，然后 `12 * 2 = 24`，所以 `num\
  \ = 24`。但从右到左计算 `2 * 4 = 8`，然后 `8 + 8 = 16`，所以 `num = 16`。\n\nJava 程序员可以通过添加括号来显式指定哪个操作应该先执行，以指示哪个运算符具有优先级。在这种情况下，`(8\
  \ + 4) * 2` 确保先执行加法——所以结果是 24 而不是 16。相反，`8 + (4 * 2)` 先执行乘法——所以结果是。\n按照以下步骤在 Java\
  \ 壳中探索运算符优先级：\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入 `jshell` 并按 `Enter` 键启动 Java\
  \ 壳\n\n![image](img/2r.jpg)接下来，输入语句显示使用默认运算符优先级的表达式评估结果\n\n```java\nint sum = 32\
  \ - 8 + 16 * 2 ;\n```\n\n![image](img/pg37_1.jpg)\n\n![image](img/3r.jpg)现在，输入语句显示相同表达式的评估结果——但让加减法的优先级高于高于乘法\n\
  \n```java\nsum = ( 32 - 8 + 16 ) * 2 ;\n```\n\n![image](img/pg37_2.jpg)\n\n![image](img/4r.jpg)最后，输入语句再次评估相同表达式——但现在优先级顺序是先加法、后减法、最后是乘法\n\
  ```java\nsum = ( 32 - ( 8 + 16 ) ) * 2 ;\n```\n\n![image](img/pg37_3.jpg)\n\n![image](img/forget.jpg)\n\
  \n当表达式有多个嵌套括号时，最内层的具有优先级。\n\n遵循下表所示优先级顺序，从顶部到最后：\n\n| 运算符 | 描述 |\n| :--- | :---\
  \ |\n| ++ -- | 递增、递减、逻辑非 |\n| / % | 乘法、除法、取模 |\n| + - | 加法、减法 |\n| > <= | 大于...小于等于...\
  \ |\n| == != | 等于、不等于 |\n| && | 逻辑与 |\n| \\| \\| | 逻辑或 |\n| ? : | 条件 |\n| -= *=\
  \ %= | 赋值 |\n\n优先级相同的运算符将按照它们在表达式中出现的顺序处理——从左到右。\n\n\n\n\n字面量通常与 Java 语言的关键字是分离的，但在\
  \ `String` 值内部需要双引号或单引号时，必须指示该引号字符被视为字面量处理，以避免提前终止 `String`。这可以通过在每个嵌套的引号字符前紧跟一个\
  \ `\\` 转义运算符来轻松实现。例如，在 `String` 变量中包含引号，如下所示：\n\nString quote = “ \\”Fortune favors\
  \ the brave.\\” said Virgil ”;\n```\n\n此外，`\\` 转义运算符还提供了多种实用的转义序列用于简单的输出格式化：\n\n\
  | 转义字符: | 描述: |\n| :--- | :--- |\n| `\\n` | 换行 |\n| `\\t` | 制表符 |\n| `\\b` | 退格键\
  \ |\n| `\\r` | 回车 |\n| `\\f` | 换页 |\n| `\\\\` | 反斜杠 |\n| `\\’` | 单引号 |\n| `\\”`\
  \ | 双引号 |\n\n![image](img/hot.jpg)\n\n可以将单引号嵌套在双引号内，作为转义引号字符的替代方案。\n\n`\\n` 换行转义序列经常用于长\
  \ `String` 值中，以便多行显示输出。同样，`\\t` 制表符转义序列经常用于按列显示输出。结合使用 `\\n` 换行和 `\\t` 制表符转义序列可以以行和列的形式格式化输出——类似于表格。\n\
  \n\n![image](img/1r.jpg)启动一个名为“Escape”的新程序，包含标准的 main 方法\n\n```java\nclass Escape\n\
