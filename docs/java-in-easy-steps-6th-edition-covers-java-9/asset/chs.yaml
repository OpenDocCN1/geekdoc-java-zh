  \n### 添加数组维度\n\n可以创建数组来存储多组元素值，每组都有它们自己的索引维度。多维数组中使用每个维度的相应索引号来访问单个值。例如 `num [1]\
  \ [3]`。\n\n二维数组可能用于记录年度内每天的整数值，按周组织。这需要一个包含 52 个元素（每周一个）的数组，每个元素包含一个 7 个元素的数组（每天一个）。它的声明如下：\n\
  \n```java\nint[][] dailyRecord = new int [52] [7] ;\n```\n\n\n避免在数组中使用超过三个维度——这会令人困惑。\n\
  \n\n\n\n\n这种“数组的数组”为每个工作日提供了一个元素。通过指明每个维度的适当索引值，为多维数组赋值。例如，使用上面的示例，可以这样给第六周的第一天赋值一个值：\n\
  \n```java\ndailyRecord [5] [0] = 5000 ;\n```\n\n每个数组都有自己的 `length` 属性，可以通过指定所需的维度来访问它。对于上面的示例，语法\
  \ `dailyRecord.length` 返回值 52 —— 即第一维的大小。若要访问第二个维度的大小，语法 `dailyRecord[0].length`\
  \ 返回值 7。\n\n![image](img/array.jpg)\n\n二维数组通常用于存储存储网格坐标，其中一个维度代表 X 轴，另一个维度代表 Y 轴。例如，`point[3][5]`。\n\
