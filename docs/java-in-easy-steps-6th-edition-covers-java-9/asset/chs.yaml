  \ ;\n}\n```\n\n与 `for` 循环一样，`while` 循环重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下个任务。\n\n\
  测试表达式在循环每次迭代开始时被评估为布尔 `true` 值。当评估返回 `true` 时，迭代继续；但当返回 `false` 时，循环立即终止，而不完成该次迭代。\n\
  \n注意，如果测试表达式在第一次评估时返回 `false`，则循环语句永远不会执行。\n\n\n\n\n\n`while` 循环可以构造成类似于 `for` 循环的结构，通过在循环外部创建一个计数器变量，并在每次迭代执行的语句中更改其值，从而在测试表达式中评估计数器变量。例如，上一个示例中的外部\
  \ `for` 循环可以重建为 `while` 循环，如下：\n\n```java\nint i = 1 ;\n{\n    System.out.println(\
  \ “Outer Loop i=” +i ) ;\n    i++ ;\n}\n```\n\n这会将计数器初始化放在 `while` 循环结构外部，并将更新器放在语句块内部。\n\
  \n![image](img/snake.jpg)\n\n无限循环将由于持续执行迭代而锁定程序——在 Windows 上，请按 `Ctrl + C` 停止。\n\
  \n![image](img/1g.jpg)启动一个名为“While”的新程序，其中包含标准的 main 方法\n\n```java\nclass While\n\
