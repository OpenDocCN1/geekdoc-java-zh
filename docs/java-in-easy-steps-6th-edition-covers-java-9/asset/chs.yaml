- "# Java 入门指南，第6版（涵盖 Java 9）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n此外，为了识别步骤中描述的每个源代码文件，彩色图标和文件名会出现在步骤旁边的边缘，如下：\n\n![](img/pg6_1.jpg) App.java\n\
  ![](img/pg6_2.jpg) App.class\n![](img/pg6_3.jpg) App.jar\n![](img/pg6_4.jpg) App.xml\n\
  \n\n\n\n\n\nJava™ 编程语言由孙内部系统公司（Sun Microsystems）工程师詹姆斯·高林（James Gosling）于 1990 年首次开发。他不喜欢使用\
  \ C++ 编程语言，因此创建了一种新语言并将其命名为“Oak”（橡树），这是他在办公室窗外看到的一棵橡树。\n\n![image](img/pg8_2.jpg)\n\
  \n随着万维网的普及，Sun 公司意识到 Gosling 的这种语言可以为互联网开发。因此，Sun 公司将该语言重命名为“Java”（仅仅是因为这个名字听起来很酷），并于\
  \ 1995 年将其免费开放。全世界的开发者迅速采用了这种令人兴奋的新语言，并且由于其模块化的设计，他们能够创建可以添加到核心语言中的新功能。最受喜爱的额外功能被保留在\
  \ Java 的后续版本中，并使其发展成为今天的全面版本。\n\nJava 的本质是一个被称为“类”（classes）的文件库，每个类都包含小段现成的、经过验证的代码。这些类中的任何一个都可以像墙上的砖一样整合到新程序中，因此只需要编写少量的新代码即可完成程序。这为程序员节省了大量时间，并在很大程度上解释了\
  \ Java 编程如此流行的原因。此外，这种模块化的安排使得比单一大型程序更容易识别任何错误。\n\nJava 技术既是一种编程语言，又是一个平台。在 Java\
  \ 编程中，源代码首先被写为人类可读的纯文本文件，扩展名为 `.java`。这些文件通过 `javac` 编译器编译成机器可读的 `.class` 文件。然后，`java`\
  \ 解释器可以通过 Java 虚拟机（Java VM）的实例执行程序：\n\n![image](img/pg8_1.jpg)\n\n![image](img/new.jpg)\n\
  \n上述所示的“New”图标表示 Java 最新版本中引入的新功能或增强功能。\n\n由于 Java VM 适用于许多不同的操作系统，相同的 `.class`\
  \ 文件能够在 Windows、Linux 和 Mac 操作系统上运行——因此， Java 程序员在理论上享有“编写一次，随处运行”的跨平台能力。\n\n为了创建\
  \ Java 程序，需要在你的计算机上安装 Java 类库和 `javac` 编译器。为了运行 Java 程序，需要安装 Java 运行时环境（JRE）以提供\
  \ `java` 解释器。所有这些组件都包含在一个免费提供的包中，即 Java 标准版开发工具包（JDK）。\n\n![image](img/pg9_1.jpg)\n\
  \n书中的 Java 程序使用 JDK 9 版本，它包含了开发工具包本身和运行时环境，可以从 Oracle® 网站 `[www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)`\
  \ 下载。\n\n![image](img/pg9_2.jpg)\n\n![image](img/forget.jpg)\n\nOracle 下载页面还包含其他包，但开始\
  \ Java 编程只需要 JDK 9 包。\n\nJDK 9 包适用于 Linux、Mac、Solaris 和 Windows 平台的 32 位和 64 位变体——接受\
  \ Oracle 许可协议，然后选择适用于你计算机的适当下载 Java 开发工具包。\n\n![image](img/pg9_3.jpg)\n\n![image](img/hot.jpg)\n\
  \nJAVA 代表“另一个模糊的缩写”（Just Another Vague Acronym）的传言并非事实。\n\n\n从 Oracle® 下载页面为你的系统选择合适的\
  \ Java 开发工具包（JDK）包，然后按照以下步骤在你的计算机上安装 Java：\n\n![image](img/1b.jpg)卸载系统中任何以前版本的 JDK\
  \ 和/或 Java 运行时环境（JRE）\n\n![image](img/2b.jpg)启动安装并接受许可协议\n\n![image](img/3b.jpg)当“自定义设置”（Custom\
  \ Setup）对话框出现时，要么接受建议的安装位置，要么点击 `Change` 按钮选择你首选的位置——例如 Windows 系统的 `C:\\Java` 或\
  \ Linux 系统的 `/usr/Java`\n\n\n![image](img/4b.jpg)确保从列表中选择了 `Public JRE` 和 `Development\
  \ Tools`（开发工具）功能。可以选择地，你可以取消选择其他功能，因为使用此书开始编程不需要这些功能\n\n![image](img/5b.jpg)点击 `Next`\
  \ 按钮在所选位置安装所有必要的 Java 类库和工具\n\n![image](img/snake.jpg)\n\n系统中可能安装了旧版本的 JRE，以便你的网络浏览器运行\
  \ Java 小程序。最好卸载它，以避免与 JDK 9 中的新版本产生混淆。\n\n\n你可以从只安装最小的功能开始以免混淆。\n\n编译和运行 Java 程序的工具通常从命令行提示符操作，并位于\
  \ Java 目录下的 `bin` 子目录。可以通过将它们的位置添加到系统路径中使其全范围内可用：\n\n•在 Windows 上，通过`Control Panel`控制面板、`System`系统、`Advanced\
  \ System Settings`高级系统设置、`Advanced`高级选项卡、`Environment Variables`环境变量进行，然后选择名为“Path”的系统变量。点击\
  \ `Edit`（编辑）并将 Java 的 `bin` 子目录的地址添加到列表中（例如 `C:\\Java\\bin`），然后点击 `OK` 应用更改。\n\n\
  •在 Linux 上，通过编辑家目录目录下的 `.bashrc` 文件将 Java 的 `bin` 子目录的位置添加到系统路径。例如，添加 `PATH=$PATH:/usr/Java/bin`\
  \ 然后保存文件。\n\n\n在旧版本的 Windows 上，包含空格的路径必须用双引号括起来并以分号结束。例如路径`“C:\\Program Files\\\
  \ Java\\jdk-9\\bin”;`\n\n\n![image](img/1b.jpg)打开命令行提示符，例如 **Windows PowerShell**\
  \ 或 **Linux Terminal**\n\n![image](img/2b.jpg)输入命令 `java -version` 然后按 **Enter**\
  \ 键查看 Java 解释器的版本号\n\n![image](img/3b.jpg)接下来，输入命令 `javac -version` 然后按 **Enter**\
  \ 键查看 Java 编译器的版本号\n\n![image](img/4b.jpg)现在，输入命令 `jshell -version` 然后按 **Enter**\
  \ 键查看 Java shell 版本号\n\n![image](img/5b.jpg)确保所有版本号匹配（9），你已准备好开始 Java 编程了\n\n![image](img/pg11_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n如果 Linux 家目录下没有显示 `.bashrc` 文件，请选择查看、显示隐藏文件以显示它。\n\n\
  ![image](img/new.jpg)\nJava shell `jshell` 是 Java 9 的新功能。这个交互式工具让你快速测试代码片段，而无需先编译代码。它将在下一章中演示\
  \ Java 编程中的各种“运算符”。\n\n\n所有的 Java 程序都从文本文件开始，随后用于创建“类”文件，这些才是的可运行程序。这意味着 Java 程序可以用任何纯文本编辑器编写，例如\
  \ Windows 记事本程序。\n\n按照以下步骤创建一个简单的 Java 程序，它将输出传统的第一个程序问候：\n\n![image](img/java.jpg)\n\
  \nHello.java\n\n![image](img/1b.jpg)打开纯文本编辑器（如记事本），并按照列出的格式输入此代码——以创建一个名为“Hello”的类\n\
  \n```\nclass Hello\n{\n```\n\n\n\n\n\n}\n\n![image](img/2b.jpg)在 `Hello` 类的大括号之间，插入这段代码\
  \ – 为 `Hello` 类创建一个“main”方法：\n\n```java\npublic static void main ( String[] args\
  \ )\n{\n\n}\n```\n\n![image](img/3b.jpg)在 `main` 方法的大括号之间，插入此行代码 – 说明程序将执行的操作：\n\
  \n```java\n```\n\n![image](img/4b.jpg)将文件保存到任何方便的位置，但确保精确命名为 `Hello.java` – 现在完整的程序看起来应该是这样的：\n\
  \n![image](img/pg12_1.jpg)\n\n![image](img/snake.jpg)\n\nJava 是一种区分大小写的语言，“Hello”和“hello”是完全不同的\
  \ – 通常情况下，Java 程序名称应该始终以大字母开头。\n\n![image](img/forget.jpg)\n\nJava 程序始终以其完全相同的程序名称加上\
  \ `.java` 扩展名进行保存。\n\n可以单独检查对页上程序代码的各个部分，以便更清楚地理解每个部分：\n\n\n```java\nclass Hello\
  \ {    }\n```\n\n程序名紧接 `class` 关键字之后声明，并跟着一对大括号。所有定义 `Hello` 类的程序代码都包含这些大括号内。\n\n\
  ![image](img/forget.jpg)\n\n所有独立的 Java 程序都必须有一个 `main` 方法。Java Applet 则不同，它们的格式将在稍后解释。\n\
  \n\n```java\npublic static void main ( String[] args ) {      }\n```\n\n这行看起来很吓人的代码是标准代码，用于定义几乎所有\
  \ Java 程序的起点。它将在本书的大多数示例中以与上方所示完全相同的形式出现 – 因此，记住它可能很有用。\n\n该代码声明了一个名为“main”的方法，该方法在大括号内包含实际的程序指令。\n\
  \n关键字 `public static void` 位于方法名之前，用于定义该方法如何被使用，将在稍后详细解释。\n\n代码 `( String[] args\
  \ )` 在向方法传递值时非常有用，书中稍后也会对其进行完全解释。\n\n## 语句\n\n```java\nSystem.out.println( “Hello\
  \ World!” ) ;\n```\n\n语句是执行程序任务的实际指令，并且必须以分号结尾。一个方法可以在大括号内包含许多语句，形成一个“语句块”，定义要执行的一系列任务，但在这里，单个语句指示程序输出一行文本。\n\
  \n\n![image](img/hot.jpg)\n\n创建一个“MyJava”目录，用于保存你所有的 Java 程序文件。在 Windows 上使用\n\n\
  \n在 Java 程序运行之前，它必须首先由 Java 编译器编译成 `class` 文件。该编译器位于 Java 的 `bin` 子目录中，是一个名为 `javac`\
  \ 的应用程序。此处 描述的指令说明了如何将 `bin` 子目录添加到系统路径中，以便从系统的任意位置都可调用 `javac`。\n\n按照以下步骤编译程序 此处\
  \ ：\n\n![image](img/1b.jpg)打开命令行窗口，然后导航到保存 `Hello.java` 源码文件的目录\n\n![image](img/2b.jpg)输入\
  \ `javac`，紧跟一个空格，然后输入源码文件的完整名称 `Hello.java` 并按下 `Enter` 键\n\n![image](img/pg14_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n在 Windows 上使用 Windows PowerShell 应用或旧版本的命令提示符应用来提供命令行提示，在\
  \ Linux 上使用 Terminal 窗口。\n\n![image](img/hot.jpg)\n\n在提示符处输入 `javac` 并按回键显示 Java\
  \ 编译器的选项。\n\n如果 `javac` 编译器发现代码中存在错误，它将停止并显示一份有用的报告，指示错误的性质 – 请参此处 进行故障排除。\n如果 `javac`\
  \ 编译器没有发现任何错误，它将创建一个以程序名和 `.class` 文件扩展名命名的新文件。\n\n![image](img/pg14_2.jpg)\n\n\
  ![image](img/hot.jpg)\n\n如果你为 javac 编译器指定文件的完整路径地址，也可以从另一个位置编译源码 – 在这种情况下为 `C:\\\
  MyJava\\Hello.java`\n\n当 Java 编译器完成编译后，命令行窗口的焦点将返回提示符处，没有任何确认消息 – 程序已准备好运行。\n\n\
  Java 程序解释器是一个名为 `java` 的应用程序，位于 Java 的 `bin` 子目录中 – 与 `javac` 编译器并列。由于该目录之前已添加到系统路径，此处，`java`\
  \ 解释器可以从任何位置调用。\n按照对面描述的程序按照以下步骤运行编译后的程序：\n\n![image](img/1b.jpg)打开命令行提示符窗口，然后导航到\
  \ `Hello.class` 程序文件所在的目录\n\n![image](img/2b.jpg)在提示符处输入 `java`，紧跟一个空格，然后输入程序名 `Hello`\
  \ 并按下 `Enter` 键\n\n![image](img/pg15_1.jpg)\n\n![image](img/snake.jpg)\n\n在 Java\
  \ 编程中，“变量”简单是有用的容器，可以在其中存储值供程序后续使用。存储的值在程序执行过程中可能会发生变化（vary）– 因此有了“variable”一词。\n\
  \n![image](img/box.jpg)\n\n\n通过在程序中编写变量“声明”来创建变量，指定变量可能的数据类型以及该变量的给定名称。例如，可以指定 `String`\
  \ 数据类型以允许名为 `message` 的变量包含普通文本：\n\n```java\nString message ;\n```\n\n变量名由程序员选择，但必须遵守某些命名规范。变量名只能以字母、美元符号\
  \ `$` 或下划线字符 `_` 开头，随后可以是字母、数字、美元符号或下划线。名称区分大小写，因此“var”和“Var”是不同的名称，且名称中不允许空格。\n\
  \n变量名也应避免下表列出的 Java 关键字，因为这些在 Java 语言中有特殊含义。\n\n| abstract | default | goto | package\
  \ | synchronized |\n| :--- | :--- | :--- | :--- | :--- |\n| assert | do | if | private\
  \ | this |\n| boolean | double | implements | protected | throw |\n| break | else\
  \ | import | public | throws |\n| byte | enum | instanceof | return | transient\
  \ |\n| case | extends | int | short | true |\n| catch | false | interface | static\
  \ | try |\n| char | final | long | strictfp | void |\n| class | finally | native\
  \ | String | volatile |\n| const | float | new | super | while |\n| continue | for\
  \ | null | switch | |\n![image](img/snake.jpg)\n\n每个变量声明都必须以分号字符结束 – 就像所有其他语句一样。\n\
  \n![image](img/hot.jpg)\n\n\n\n\n严格来说，此表中的某些单词实际上并不是关键字——`true`、`false` 和 `null`\
  \ 都是字面量；`String` 是一个特殊的类名；`const` 和 `goto` 是预留字（目前未使用）。将它们包含在表中是因为在命名变量时也必须避免使用这些词。\n\
  \n作为良好的习惯，变量命名应使用单词或易于识别的缩写，并描述该变量的用途。例如，使用“button1”或“btn1”来描述一号按钮。单单词名称优选小写字母，如“gear”，而多个单词组成的名称应将每个后续单词的首字母大写，例如\
  \ `gearRatio` —— 即所谓的“驼峰命名法”（`camelCase`）。\n\n一旦声明了变量，可以使用等号 `=` 为其分配相应数据类型的初始值，可以在声明时进行，也可以在程序的稍后部分进行，然后可以使用变量名随时引用其值。\n\
  \n按照以下步骤创建一个程序，该程序在声明时初始化变量，并在稍后对其进行更改：\n\n![image](img/1b.jpg)启动一个名为“FirstVariable”的新程序，包含标准的\
  \ main 方法\n\n```\n{\n    public static void main ( String[] args ) {\n    }\n}\n\
  ```\n\n![image](img/java.jpg)\n\nFirstVariable.java\n\n![image](img/2b.jpg)在 main\
  \ 方法的大括号之间插入此代码以创建、初始化并输出一个变量\n\n```java\nString message = “Initial value */;\n\
  System.out.println( message );\n```\n\n\n```java\nmessage = “Modified value */;\n\
  System.out.println( message );\n```\n\n![image](img/4b.jpg)将程序保存为 `FirstVariable.java`，然后编译并运行程序\n\
  \n![image](img/pg17_1.jpg)\n\n![image](img/forget.jpg)\n\n如果你在编译或运行程序时遇到问题，可以在此处获取故障排除问题的帮助。\n\
  \n\nJava 变量声明中最常用的数据类型列在本表中，并附有简要描述：\n\n| 数据类型: | 描述: | 示例: |\n| :--- | :--- | :---\
  \ |\n| `char` | 单个 Unicode 字符 | ‘a’ |\n| `String` | 任意数量的 Unicode 字符 | “my String”\
  \ |\n| `int` | 整数，从 -21.4 亿到 +21.4 亿 | 1000 |\n| `float` | 带有小数点的浮点数 | 3.14159265f\
  \ |\n| `boolean` | 逻辑值 true 或 false 之一 | true |\n\n![image](img/forget.jpg)\n\n\
  由于浮点数运算的不规则性，`float` 数据类型绝不应用于精确值，例如货币——详情请参阅此处。\n\n注意，`char` 数据值必须始终被单引号包围，`String`\
  \ 数据值必须始终被双引号包围。此外，记住 `float` 数据值必须始终带有“f”后缀，以确保它们被视为 `float` 值。\n\n除了上述更常见的数据类型，Java\
  \ 还提供了这些特殊数据类型以用于精确情况：\n\n| :--- | :--- |\n| `byte` | 从 -128 到 +127 的整数 |\n| `short`\
  \ | 从 -32,768 到 +32,767 的整数 |\n| `long` | 超过 21.4 亿的正负整数 |\n| `double` | 极长的浮点数\
  \ |\n\n![image](img/forget.jpg)\n\n所有数据类型关键字都以小写字母开头，`String` 除外——这是一个特殊的类。\n\n\
  特殊类型在高级 Java 程序中有用——书中的示例大多使用上方描述的常用数据类型。\n\n按照以下步骤创建一个 Java 程序，该程序创建、初始化并输出所有五个常用数据类型的变量：\n\
  \n![image](img/1b.jpg)启动一个名为“DataTypes”的新程序，包含标准的 main 方法\n\n```java\nclass DataTypes\n\
  {\n    public static void main ( String[] args ) {\n}\n```\n\n![image](img/java.jpg)\n\
  \nDataTypes.java\n\n![image](img/2b.jpg)在 main 方法的大括号之间插入此代码以创建并初始化\n\n```java\n\
  char letter = ‘M%；\nString title = “Java */;\nint number = 365;\nfloat decimal =\
  \ 98.6f;\nboolean result = true;\n```\n\n![image](img/3b.jpg)添加这些行来输出\n\n```java\n\
  System.out.println( “Initial is ” + letter );\nSystem.out.println( “Book is ” +\
  \ title );\nSystem.out.println( “Days are ” + number );\nSystem.out.println( “Temperature\
  \ is ” + decimal );\nSystem.out.println( “Answer is ” + result );\n```\n\n![image](img/4b.jpg)将程序保存为\
  \ `DataTypes.java`，然后编译并运行程序查看输出\n\n\n`final` 关键字是一个修饰符，可以在声明变量时使用防止其被更改。以这种方式创建的变量被称为“常量”，惯例用全大写命名常量以与普通变量区分。\n\
  \n按照以下步骤创建一个包含常量的程序：\n\n![image](img/1b.jpg)启动一个名为“Constants”的新程序，包含标准的 main 方法\n\
  \n```java\nclass Constants\n{\n    public static void main ( String[] args ) {\n\
  \    }\n}\n```\n\n![image](img/java.jpg)\n\nConstants.java\n\n\n```java\nfinal int\
  \ TOUCHDOWN = 6;\nfinal int CONVERSION = 1;\nfinal int FIELDGOAL = 3;\n```\n\n![image](img/3b.jpg)现在声明普通变量——使用常量的倍数\n\
  \n```java\nint td , pat , fg , total ;\ntd = 4 * TOUCHDOWN ;\npat = 3 * CONVERSION\
  \ ;\nfg = 2 * FIELDGOAL ;\ntotal = ( td + pat + fg );\n```\n\n![image](img/4b.jpg)添加此行来显示总分\n\
  \n```java\nSystem.out.println( “Score: ” + total );\n```\n\n\n( 4 x 6 = 24, 3 x\
  \ 1 = 3, 2 x 3 = 6，所以 24 + 3 + 6 = 33 )\n\n### 添加注释\n\n在任何语言中编程时，良好的习惯是在程序代码中添加注释来解释特定部分。这使得其他人更容易理解代码，也让你自己在一段时间后重新查看这段代码时更容易理解。\n\
  \n在 Java 编程中，可以在 `/***` 和 `***` 注释标识之间添加跨行注释，也可以在 `//` 注释标识之后添加单行注释。`javac` 编译器完全忽略\
  \ `/***` 和 `***` 之间或 `//` 之后的内容。\n\n```java\n/***\n一个演示常量变量的程序。\n***\n```\n\n\n\n\
  \n```java\nclass Constants\n{\n    public static void main( String args[] )\n  \
  \      // 常数分值。\n        final int TOUCHDOWN = 6 ;\n        final int CONVERSION\
  \ = 1 ;\n        final int FIELDGOAL = 3 ;\n        // 计算得分。\n        int td , pat\
  \ , fg , total ;\n        td = 4 * TOUCHDOWN ;      // 4x6=24\n        pat = 3 *\
  \ CONVERSION ;    // 3x1= 3\n        fg = 2 * FIELDGOAL ;            // 2x3= 6\n\
  \        total = ( td + pat + fg ) ;      // 24+3+6=33\n        // 输出计算出的总分。\n \
  \       System.out.println( “Score: “ + total ) ;\n    }\n}\n```\n\n带有注释保存后，程序可以正常编译并运行：\n\
  \n![image](img/pg21_1.jpg)\n\n![image](img/forget.jpg)\n你可以添加一条尝试更改常量值值的语句，然后尝试重新编译程序以查看生成的错误信息。\n\
  \n### 故障排除\n\n有时，`javac` 编译器或 `java` 解释器会报告错误，因此了解这些错误的原因以及如何快速解决问题非常有帮助。为了演示一些常见的错误报告，这段代码包含了一些故意错误：\n\
  \n![image](img/java.jpg)\n\nTest.java\n\n```\nclass test\n{\n    public static void\
  \ main ( String[] args )\n    {\n        String text ;\n        System.out.println(\
  \ “Test ” + text )\n    }\n}\n```\n\n\n![image](img/pg22_1.jpg)\n\n•原因 – 找不到 `javac`\
  \ 编译器。\n•解决方案 – 编辑系统 `PATH` 变量，描述请参考此处，或使用其完整路径地址来调用编译器。\n\n![image](img/pg22_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n如果路径地址包含任何空格，必须封装在引号内，例如路径地址“C:\\Program Files\\ Java”。\n\
  \n•原因 – 找不到文件 `Test.java`。\n•解决方案 – 导航到文件所在的目录，或在命令中使用文件的完整路径。\n\n![image](img/pg23_1.jpg)\n\
  \n•原因 – 语句未正确结束。\n•解决方案 – 在源代码的语句末尾添加分号，然后保存文件以应用更改。\n\n![image](img/pg23_2.jpg)\n\
  •原因 – 程序名和类名不匹配。\n•解决方案 – 在源代码中将类名从 `test` 改为 `Test`，然后保存文件以应用更改。\n\n![image](img/pg23_3.jpg)\n\
  \n•原因 – 变量 `text` 没有值。\n•解决方案 – 在变量声明中为变量分配有效的 `String` 值，例如 `= “success”`，然后保存文件。\n\
  \n![image](img/pg23_4.jpg)\n\n![image](img/snake.jpg)\n\n你必须在程序所在的目录下运行程序——你不能使用路径地址，因为\
  \ Java 启动器需要的是程序名而不是文件名。\n\n## 总结\n\n•Java 既是一种编程语言也是一种运行时平台。\n•Java 程序编写为带有 `.java`\
  \ 扩展名的纯文本文件。\n•Java 编译器 `javac` 从原始 `.java` 源代码文件创建编译后的 `.class` 程序文件。\n•Java 解释器\
  \ `java` 使用 Java 虚拟机的实例执行编译后的程序。\n•Java VM 可用在许多操作系统平台。\n•Java 是一种区分大小写的语言。\n•标准的\
  \ `main` 方法是 Java 程序的入口。\n•`System.out.println()` 语句输出文本。\n• Java 程序文件名必须与类名完全匹配。\n\
  •Java 变量只能按照指定的命名规范进行命名，并且必须避开 Java 关键字。\n•在 Java 编程中，每条语句必须以分号字符结束。\n•最常见的 Java\
  \ 数据类型是 `String`、`int`、`char`、`float` 和 `boolean`。\n•`String` 值必须用双引号封装；`char` 值用单引号封装；且\
  \ `float` 值必须带有 “f” 后缀。\n•`final` 关键字可以用于创建常量变量。\n•注释可以添加到 Java 源代码的 `/***` 和 `***/**`\
  \ 之间（跨一行或多行），或者在单行的 `//` 之后。\n•错误报告识别编译器和运行时问题。\n\n2\n\n## 执行操作\n\n*本章演示了用于在 Java\
  \ 程序创建表达式的各种运算符。*\n\n算术运算\n\n赋值值\n比较值\n\n评估逻辑\n\n判断条件\n\n设置优先级\n\n转义字面量\n\n位运算\n\
  \n总结\n\n### 算术运算\n\n下表所示的算术运算符用于在 Java 程序创建返回单个值的表达式。\n\n| **运算符:** | **操作:** |\n\
  | :--- | :--- |\n| `+` | 加法（并连接 `String` 值） |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%`\
  \ | 取模 |\n| `++` | 递增 |\n| `--` | 递减 |\n\n运算符 `+` 操作取决于操作数的类型。如果两个操作数都是数值，它将返回和；但如果操作数是\
  \ `String` 值，它将返回连接后的 `String` —— 例如，“Java ” + “Arithmetic”返回“Java”。\n\n`int` 除法将截断任何小数部分。例如\
  \ 11/4=2，而 `float` 除法 11/4=2.75。\n\n递增运算符 `++` 和递减运算符 `--` 返回修改单个操作数值的结果。例如，4++\
  \ 返回 5，4-- 返回 3。\n\n取模运算符 `%` 将第一个操作数除以第二个操作数并返回操作的余数。例如，32 % 5 返回 2 —— 五除 32 为六次，余\
  \ 2。\n\n按照以下步骤在 Java Shell 中探索 Java 算术运算符\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入\
  \ `jshell` 并按下 **Enter** 键启动 Java Shell\n\n![image](img/2r.jpg)接下来，输入语句初始化三个变量\n\
  \n`int num = 100 ; int factor = 20 ; int sum = 0 ;`\n![image](img/pg27_1.jpg)\n\n\
  ![image](img/3r.jpg)接下来，分别输入语句执行加法和减法操作，显示每个结果\n\n`sum = num + factor ;`\n`sum =\
  \ num - factor ;`\n\n![image](img/pg27_2.jpg)\n\n![image](img/4r.jpg)现在，分别输入语句执行乘法和除法操作，显示每个结果\n\
  \n`sum = num * factor ;`\n`sum = num / factor ;`\n\n![image](img/pg27_3.jpg)\n\n\
  \n\n\n\n赋值运算符列如下表，用于为表达式的结果赋值。除了简单的 `=` 运算符外，所有的运算符都是更等价表达式的简写：\n\n| :--- | :---\
  \ | :--- |\n| `=` | `a = b` | `a = b` |\n| `+=` | `a += b` | `a = a + b` |\n| `-=`\
  \ | `a -= b` | `a = a - b` |\n| `*=` | `a *= b` | `a = a * b` |\n| `/=` | `a /=\
  \ b` | `a = a / b` |\n| `%=` | `a %= b` | `a = a % b` |\n\n将 `=` 运算符视为“赋值”而不是“等于”，有助于与\
  \ `==` 相等运算符混淆。\n\n在示例 `a = b` 中，存储在名为 `b` 的变量中的值被赋值给名为 `a` 的变量，该值成为存储在 `a` 中的新值——替换掉它之前包含的任何值。\n\
  \n`+=` 运算符用于向存储在变量中的现有值增加一个值——保持一个“运行总和”。\n\n示例 `a += b` 首先计算存储名为 `a` 和 `b` 的变量中的值的总和，然后将所得总和赋值给变量\
  \ `a`。程序随后可能会包含另一个赋值 `a += c`，它计算存储名为 `a` 和 `c` 的变量中的总和，然后将该新总和赋值给变量 `a`——将 `c`\
  \ 的值加上它之前包含的值上。\n\n所有其他赋值运算符的工作方式都相同：首先对两个存储的值进行算术计算，然后将结果赋值给第一个变量——成为其新的存储值。\n\n\
  ![image](img/forget.jpg)\n\n`==` 相等运算符比较两个值，其详细解释请见此处。\n\n\n![image](img/1r.jpg)打开命令行提示符窗口，然后输入\
  \ `jshell` 并按 `Enter` 键启动 Java shell\n\n![image](img/2r.jpg)接下来，输入语句初始化两个 `String`\
