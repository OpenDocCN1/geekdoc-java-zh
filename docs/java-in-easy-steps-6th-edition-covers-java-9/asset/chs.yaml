  \n```java\ninitial = txt.charAt( ( txt.length() -1 ) );\nSystem.out.println( “Last\
  \ Letter: “ + initial ) ;\n```\n\n![image](img/8o.jpg)将所有的字母“o” 替换为字母“a”\n\n```java\n\
  txt = txt.replace( ‘o’ , ’a’ ) ;\nSystem.out.println( “String: “ + txt ) ;\n```\n\
