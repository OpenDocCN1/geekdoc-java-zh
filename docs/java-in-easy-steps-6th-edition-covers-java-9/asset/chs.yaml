  \n## 总结\n\n- Java 文档提供了每个 Java 类中方法和属性的信息。\n- Java Java 语言基础的 Java 类包含在 `java.lang`\
  \ 包中，位于 `java.base` 模块内。\n- `Math` 类提供了 `Math.PI` 和 `Math.E` 常量。\n- `Math.pow()`\
  \ 将数字提升到指定的幂，`Math.sqrt()` 返回指定数的平方根。\n- 使用 `Math.round()`、`Math.floor()` 和 `Math.ceil()`可以将数字四舍入为整数。\n\
  - 使用 `Math.max()` 和 `Math.min()` 对数字进行比较。\n- `Math.random()` 返回 0.0 到 0.999999999999999\
  \ 之间的 `double` 精度随机数。\n- `String` 是用引号括的零或多个字符。\n- `length()` 方法返回 `String` 的大小，类似于数组的\
  \ `length` 属性。\n- `String` 的 `concat()` 方法追加另一个 `String` 值。\n- `String` 的 `equals()`\
  \ 方法仅当两个 `String` 值具有相同字符且顺序相同时返回 `true`。\n- 使用 `toUpperCase()` 和 `toLowerCase()`\
  \ 方法更改字符串的大小。\n- 使用 `startsWith()` 和 `endsWith()` 方法比较 `String` 值。\n- 使用 `indexOf()`\
  \ 和 `substring()` 方法在 `String` 中查找子字符串。\n- `isEmpty()` 方法仅当 `String` 完全没有任何内容时返回\
  \ `true`。\n- 使用 `trim()`、`charAt()` 和 `replace()` 方法处理 `String` 值中的字符。\n\n6\n\n\
  ## 创建类\n\n***本章将演示如何创建一个使用多个方法和类的 Java 程序。***\n\n- 形成多个方法\n- 理解程序范围\n- 形成多个类\n-\
  \ 扩展现有类\n- 创建对象类\n- 产生对象实例\n- 封装属性\n- 构造对象值\n- 总结\n\n### 形成多个方法\n\n程序通常被拆分为单独的方法，以便创建每个执行特定任务的代码模块，并根据需要可以在整个程序中反复调用。将程序拆分成多个方法也更容易追踪错误，因为每个方法都可以被单独测试。进一步的方法可以在类声明后的大括号内声明，使用与声明\
  \ `main` 方法相同的关键字。每个新方法必须按照通常的命名规范赋予名称，并可以可选在名称后的括号中指定参数。\n\n![image](img/1bl.jpg)启动一个名为“Methods”的新程序，包含标准的\
  \ `main` 方法\n\n```java\nclass Methods {\n    public static void main ( String[]\
  \ args ) { }\n}\n```\n\n![image](img/java.jpg)Methods.java\n\n![image](img/2bl.jpg)在\
  \ `main` 方法的大括号之间插入语句，输出消息并调用名为“sub”的第二个方法\n\n```java\nSystem.out.println( “Message\
  \ from the main method.” ) ;\nsub();\n```\n\n![image](img/3bl.jpg)在 `main` 方法之后、类声明的大括号之前，添加第二个方法\n\
  \n```java\npublic static void sub() {\n    System.out.println( “Message from the\
  \ method.” ) ;\n}\n```\n\n![image](img/4bl.jpg)将程序保存为 `Methods.java`\n\n![image](img/pg98.jpg)调用无参数方法的语法只需要方法名后跟括号。一个类甚至可以包含多个相同名称的方法，参数不同或类型不同。这种功能被称为“重载”。\n\
  \n```java\nclass Overload {\n    public static void main ( String[] args ) { }\n\
  }\n```\n\n![image](img/java.jpg)Overload.java\n\n2bl.jpg\n\n在 `main` 方法的大括号之间插入三个调用不同方法并传递值的语句\n\
  \n```java\nSystem.out.println( write( 12 ) ) ;\nSystem.out.println( write( “Twelve”\
  \ ) ) ;\nSystem.out.println( write( 4 , 16 ) ) ;\n```\n\n![image](img/3bl.jpg)在\
  \ `main` 方法之后、类的大括号之前，添加重载方法，以便向调用者返回 `String` \n\n```java\npublic static String\
  \ write( int num ) {\n    return ( “Integer passed is “ + num ) ;\n}\npublic static\
  \ String write( String num ) {\n    return ( “String passed is “ + num ) ;\n}\n\
  public static String write( int num1 , int num2 ) {\n    return ( “Sum Total is\
  \ “ + ( num1 * num2 ) ) ;\n}\n```\n\n![image](img/4bl.jpg)将程序保存为 `Overload.java`\n\
  \n![image](img/pg99.jpg)每个重载方法的声明必须指示该方法返回 `String` 值，而不是 `void`。\n\n### 理解程序范围\n\
  \n在方法内部声明的变量仅从该方法内部访问——其访问的“范围”仅限于声明它的方法。这意味着可以在另一个方法中声明同名变量而不会发生冲突。\n\n![image](img/1bl.jpg)启动一个名为“Scope”的新程序，包含标准的\
  \ `main` 方法\n\n```java\nclass Scope {\n    public static void main ( String[] args\
  \ ) { }\n}\n```\n\n![image](img/java.jpg)Scope.java\n\n![image](img/2bl.jpg)在 `main`\
  \ 方法的大括号之间声明并初始化一个局部 `String` 变量，然后输出其值\n\n```java\nString txt = “This is a local\
  \ variable in the main method”;\nSystem.out.println( txt ) ;\n```\n\n![image](img/3bl.jpg)在\
  \ `main` 方法之后、类的大括号之前，添加另一个名为“sub”的方法\n\n```java\npublic static void sub( ) {\n\
  \    String txt = “This is a local variable in the sub method” ;\n}\n```\n\n\n\n\
  \n\n```\nSystem.out.println( txt ) ;\n```\n\n![image](img/5bl.jpg)在 main 方法末尾插入对\
  \ sub 方法的\n\n```\nsub() ;\n```\n\n![image](img/6bl.jpg)将程序保存为 `Scope.java`，然后编译并运行程序查看输出\n\
  \n![image](img/pg100_1.jpg)\n\n![image](img/forget.jpg)\n\n在 `for` 循环中声明的计数变量无法在循环外访问——它的作用范围限于\
  \ `for` 语句块。\n\n在方法声明中使用的 `static` 关键字确保该方法是一个“类方法”——可以从类中的任何其他方法进行全局访问。\n\n同样，可以使用\
  \ `static` 关键字声明“类变量”，以确保它在整个类中都是全局可用的。它的声明应该放在 main 方法声明之前，紧跟在类声明后的大括号之后。\n\n一个程序可能拥有具有同名的全局类变量和局部方法变量。局部方法变量具有优先级，除非使用点符号法（dot\
  \ notation）通过类名前缀显式地访问全局类变量，或者没有声明该名的局部变量。\n\n![image](img/7bl.jpg)编辑 `Scope.java`，插入一个与局部方法变量同名的全局类\
  \ `String` 变量常量\n\n```\nfinal static txt = “This is a global variable of the Scope\
  \ class” ;\n```\n\n![image](img/8bl.jpg)在 main 方法末尾添加一条语句输出全局类变量的值\n\n```\nSystem.out.println(\
  \ Scope.txt ) ;\n```\n\n![image](img/9bl.jpg)注释掉 sub 方法中声明局部变量的行——这样输出语句现在将访问同名的全局变量\n\
  \n```\n//String txt = “This is a local variable in the sub method” ;\n```\n\n![image](img/10bl.jpg)保存更改，然后重新编译程序并再次运行以查看修改后的输出\n\
  \n![image](img/pg101_1.jpg)\n\n![image](img/hot.jpg)\n\n尽可能使用局部方法变量以避免冲突——全局类变量通常用于常量。\n\
  \n### 多个类\n\n正如程序可以有多个方法一样，较大的程序可能由几个类组成——每个类提供特定的功能。这种模块化的格式通常比将整个程序写在单个类中更好，因为它更容易调试并提供了更好的灵活性。\n\
  \n出现在声明中的 `public` 关键字是一个“访问修饰符”，它决定了某个项对其他类的可见性。它可以用于类声明，以显式确保该类对任何其他类可见。如果省略，默认的访问控制级别允许从其他本地类进行访问。然而，`public`\
  \ 关键字必须与程序的 main 方法一起使用，以便该方法对编译器可见。\n\n![image](img/1bl.jpg)启动一个名为“Multi”的新程序，包含标准的\
  \ main 方法——像往常包含 `public` 关键字\n\n```\nclass Multi\n{\npublic static void main (\
  \ String[] args ) {     }\n}\n```\n\n![image](img/java.jpg)\n\nMulti.java\n\n![image](img/2bl.jpg)在\
  \ main 方法的大括号之间声明并初始化一个 `String` 变量，然后输出其内容\n\n```\nString msg = “This is a local\
  \ variable in the Multi class” ;\nSystem.out.println( msg ) ;\n```\n\n![image](img/3bl.jpg)从名为“Data”的类输出名为“txt”的类\
  \ `String` 变量常量\n\n```\nSystem.out.println( Data.txt ) ;\n```\n\n![image](img/4bl.jpg)调用\
  \ Data 类中名为“greeting”的方法\n\n```\nData.greeting() ;\n```\n\n![image](img/5bl.jpg)从名为“Draw”的类调用名为“line”的方法\n\
  \n```\nDraw.line() ;\n```\n\n![image](img/6bl.jpg)将程序保存为 `Multi.java`\n\n![image](img/hot.jpg)\n\
  \n编译器会自动找到相邻外部 `.java` 文件中的类——并为每个类创建编译后的 `.class` 文件。\n\n![image](img/7bl.jpg)启动一个新文件创建\
  \ Data 类\n\n```\nclass Data\n{\n}\n```\n\n![image](img/java.jpg)\n\nData.java\n\n\
