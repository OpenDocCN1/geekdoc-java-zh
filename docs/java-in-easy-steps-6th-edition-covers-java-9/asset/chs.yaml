  \n`String` 值需要包含在引号内。\n\n### 传递参数\n\n\n```\npublic static void main( String[] args\
  \ ) { }\n```\n\n`args[]` 数组的目的是在调用程序运行时将值传递给程序。在命令行上，在程序名称后的空格后添加要传递给程序的值。例如，向名为“Run”的程序传递\
  \ String “Java” 的命令是 `Run Java`。\n\n传递给程序的单个值会自动放在 `args[]` 数组的第一个元素中，因此程序可以通过 `args[0]`\
  \ 访问它。\n\n重要的是要意识到 `args[]` 数组是 String 数据类型——因此传递给程序的数值值将存储为该数字的 String 表示形式。这意味着在将该值转换为数值类型（例如\
  \ `int` 值）之前，程序无法对其进行算术运算。例如，`Run 4` 将数字 4 传递给程序，程序将其存储为 String “4”，而不是 int 4。因此，`args[0]`\
  \ 的输出将是字符串“4”。\n\n### 传递多个参数\n\n可以在命令行通过程序名称和空格向程序传递多个参数。参数之间必须至少有一个空格分隔，其值按顺序放入\
  \ `args[]` 数组的元素中。然后像任何其他数组一样通过索引号访问每个值——`args[0]` 是第一个参数，`args[1]` 是第二个，以此此类推。\n\
  \n程序可以测试 `args[]` 数组的 `length` 属性以确保用户输入了数量数量参数。当测试失败时，可以使用 `return` 关键字退出 `main`\
  \ 方法，从而退出程序：\n\n```\nclass Args\n{\n    public static void main ( String[] args\
  \ )      }\n```\n\nArgs.java\n\n\n\n\n![image](img/2p.jpg)在 `main` 方法中，编写一个 `if`\
