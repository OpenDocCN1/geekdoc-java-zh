  int num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个 `do while` 循环，在 `num` 变量小于 10 时显示其当前值\n\
  \n```java\ndo\n{\n    System.out.println( “DoWhile Countup: ” + num ) ;\n}\nwhile\
  \ ( num < 10 ) ;\n```\n\n\n```java\nnum += 10 ;\n```\n\n![image](img/5g.jpg)将程序保存为\
