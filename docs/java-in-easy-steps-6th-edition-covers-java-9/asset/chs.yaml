  ```\n\n复杂表达式使用相等运算符 `==` 来指定精确匹配，而不是赋值运算符 `=`。\n\n### 分支替代方案\n`else` 关键字用于与 `if`\
  \ 关键字结合使用，创建 `if else` 语句，为程序提供可选的后续分支——取决于测试表达式的评估结果。在最简单的形式中，它仅仅在测试失败时指定一个备选语句执行：\n\
  \n```java\nif ( test-expression )\n    code-to-be-executed-when-true;\nelse\n  \
  \  code-to-be-executed-when-false;\n```\n\n每个备选分支可以是单条语句，也可以是语句块。通过嵌套的 `if` 语句可以构建更强大的\
  \ `if else` 语句。\n\n```\n![image](img/1g.jpg)创建一个名为“Else” 的新程序，其中包含标准的 main 方法\n\
  class Else {\n    public static void main (String[] args) { }\n}\n```\n\n![image](img/java.jpg)\n\
  Else.java\n\n![image](img/2g.jpg)在 main 方法内部，插入此行来声明并初始化一个名为 `num` 的整数变量\n```java\n\
  int num = 8 ;\n```\n\n![image](img/3g.jpg)添加此简单的条件测试，当变量 `num` 的值小于 13 时执行单条语句：\n\
  \n```java\nif ( num < 13 ) {\n    System.out.println( “Good morning: ” + num ) ;\n\
  }\n```\n\n![image](img/4g.jpg)将程序保存为 `Else.java`，然后编译并运行程序查看语句的执行。注意第一个语句在 `else`\
  \ 关键字之前通常以分号结束：\n\n```\n![image](img/pg47_1.jpg)\n```\n\n更改赋值给 `num` 变量的值为 15，然后在\
  \ `if` 语句之后添加此备选分支：\n\n```java\n    System.out.println( “Good afternoon: ” + num\
  \ ) ;\n}\n```\n\n![image](img/5g.jpg)有时最好提供一个最终的 `else` 分支（无需嵌套 `if` 语句），以便在没有表达式评估为\
  \ `true` 时指定一个“默认”语句：\n\n```java\nelse System.out.println( “Good evening: ” + num\
  \ ) ;\n```\n\n![image](img/6g.jpg)更改赋值给 `num` 变量的值为 21，然后在 `if else` 语句末尾添加此默认分支以查看默认语句的执行：\n\
  \n```\n![image](img/pg47.jpg)\n```\n\n条件分支是程序运行的基础过程。\n\n### 切换分支\n\n大量的 `if else`\
  \ 语句为程序提供了许多分支，可能会变得臃肿。当测试表达式重复评估同一个变量值时，`switch` 语句通常提供更优雅的解决方案。\n典型的 `switch`\
  \ 语句语法如下：\n\n```java\nswitch ( test-variable )\n{\n    case value1 : code-to-be-executed-when-true;\
  \ break;\n    case value2 : code-to-be-executed-when-true; break;\n    case value3\
  \ : code-to-be-executed-when-true; break;\n    default : code-to-be-executed-when-false;\n\
  }\n```\n\n`switch` 语句的工作方式比较独特。它接收一个指定的变量，然后从多个 `case` 选项中寻找其赋值值。随后将执行与匹配值选项关联的语句。\n\
  \n\n\n\n可选地，`switch` 语句可以包含一个使用 `default` 关键字的选项，用于指定当指定变量的值与任何 `case` 选项匹配时不执行的语句。\n\
  \n每个选项都以 `case` 关键字和一个用于匹配的值开始。随后是一个冒号 `:` 字符以及在匹配成功时要执行的语句（如果有的话）。\n\n重要的一点是，与每个\
  \ `case` 选项关联的语句或语句块必须由 `break` 关键字终止。否则，程序将在匹配的选项之后继续执行其他 `case` 选项的语句。有时，这种特性用于指定多个\
  \ `case` 选项，让它们在匹配时各自执行相同的语句是有用的。例如，对于每三个选项的块使用如下的语句：\n```java\nswitch (test-variable)\n\
  {\n    case value1: case value2: case value3:\n        code-A-to-be-executed-when-true\
  \ ; break ;\n    case value4: case value5: case value6:\n        code-B-to-be-executed-when-true\
  \ ; break ;\n}\n```\n\n![image](img/snake.jpg)\n\n缺失 `break` 关键字并不是语法错误——请确保 `switch`\
  \ 块中存在所有预期的 `break` 以避免意外结果。\n\n![image](img/1g.jpg)创建一个名为“Switch”的新程序，其中包含标准的 main\
  \ 方法\n\n```java\nclass Switch\n{\n    public static void main ( String[] args )\
  \ {\n    }\n}\n\n![image](img/java.jpg)\n\nSwitch.java\n\n![image](img/2g.jpg)在\
  \ main 方法内部，声明并初始化三个整数变量\n\n```java\nint month = 2, year = 2018, num = 31 ;\n```\n\
  \n![image](img/3g.jpg)添加一个 switch 语句块来测试赋值给 `month` 变量的值\n\n```java\nswitch ( month\
  \ )\n{\n}\n```\n\n![image](img/4g.jpg)在 switch 块内部，插入 `case` 选项，为第 4、6、9 和 11 个份的\
  \ `num` 变量赋一个新值\n\ncase 4 : case 6 : case 9 : case 11 : num = 30 ; break ;\n```\n\
  \n![image](img/5g.jpg)根据 `year` 的值，插入一个 `case` 选项为第 2 个份的 `num` 变量赋一个新值\n\n```java\n\
  case 2 : num = ( year % 4 == 0 ) ? 29 : 28 ; break ;\n```\n\n![image](img/6g.jpg)在\
  \ switch 块之后、main 方法的末尾，添加此行以输出三个整数值\n\n```java\nSystem.out.println( month+“/”+year+“:\
  \ ”+num+“days” ) ;\n```\n\n![image](img/7g.jpg)将程序保存为 Switch.java，然后编译并运行程序查看输出。\n\
  \n![image](img/pg49_1.jpg)\n\n![image](img/hot.jpg)\n\n注意所有三个整数变量是如何使用方便的简写在这里内联声明并初始化的。\n\
  ![image](img/forget.jpg)条件运算符在步骤 5 中效果非常好。你可以返回这里 回顾它是如何工作的。\n\n## for 循环\n\n循环是一个代码块，它重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下个任务。\n\
  \n![image](img/arrowg.jpg)\n\nJava 编程中最常用的循环结构是使用 `for` 关键字，其语法如下：\n\n```java\n\
  for (initializer ; test-expression ; updater)\n{\n    statements-to-be-executed-on-each-iteration\
  \ ;\n}\n```\n\n`for` 关键字后面的括号必须包含三个建立循环性能的控制部分：\n\n*   初始化器（Initializer）——为计数器变量分配初始值，该变量将记录此循环执行的次数。为此目的的变量可以在此处声明，传统上是一个命名为\
  \ `i` 的“简单”整数变量。\n*   测试表达式（Test expression）——在循环每次迭代开始时被评估为布尔 `true` 值。当评估返回 `true`\
  \ 时，迭代继续；但当返回 `false` 时，循环立即终止，而不完成该次迭代。\n*   更新器（Updater）——由初始化器开始更改计数器变量的当前值，维护该循环执行次数的运行数。通常，这将使用\
  \ `i++` 递增，或使用 `i--` 递减。\n在循环每次迭代中执行的代码可以是单个语句、语句块，甚至是另一个“嵌套”循环。\n\n每个循环必须在某点能够使测试表达式返回\
  \ `false`——否则将创建一个无限循环，它将无情地执行其语句。通常，测试表达式会评估计数器变量的当前值为执行指定次数的迭代。例如，计数器 `i` 初始化为\
  \ 1 每次迭代加 1，测试表达式 `i < 11` 在 10 次迭代后变为 `false`——因此该循环在结束前将执行 10 次其语句。\n\n![image](img/hot.jpg)\n\
  \n更新器通常被称为“递增器”，因为它经常是递增而非减少计数器变量。![image](img/1g.jpg)创建一个名为“For”的新程序，其中包含标准的 main\
  \ 方法\n\n```java\nclass For\n{\n    public static void main ( String[] args ) {\n\
  \    }\n}\n```\n\n![image](img/java.jpg)\n\nFor.java\n\n![image](img/2g.jpg)在 main\
  \ 方法内部，声明并初始化一个整数变量来计算迭代的总数\n```java\nint num = 0 ;\n```\n\n![image](img/3g.jpg)添加一个\
