  \ `print()` 方法——而不是在输出后自动添加换行的 `println()` 方法。\n\n\n在本章前面描述的普通运算符外，Java 还提供了用于二进制算术的特殊运算符。这些运算符的使用频率低于其他运算符，但在此简要讨论是为了让大家了解它们的存在。\n\
  \nJava “位”运算符可以与 `int` 整数数据类型一起使用，用于操作值的二进制表示位。这需要理解二进制计数，其中一个字节中的八位表示从 0 到 255\
  \ 的十进制值。例如，\n\n53 是二进制 `00110101`\n\n(`0` x 128, `0` x 64, `1` x 32, `1` x 16, `0`\
  \ x 8, `1` x 4, `0` x 2, `1` x 1)。\n\n二进制加法运算像十进制算术一样进行：\n\n| | 53 | = | `00110101`\
  \ |\n| :--- | :--- | :--- | :--- |\n| `+` | 7 | = | `00000111` |\n| | 60 | = | `00111100`\
  \ |\n\n下列出的位运算符允许在二进制算术中执行更专门的操作。\n\n| 运算符: | 操作: | 示例: | 结果: |\n| :--- | :--- |\
  \ :--- | :--- |\n| `&` | 与 (AND) | `a & b` | 如果两个位都为 1 则为 1 |\n| `\\|` | 或 (OR)\
  \ | `a \\| b` | 如果任意一个位为 1 则为 1 |\n| `^` | 异或 (XOR) | `a ^ b` | 如果两个位不同则为 1 |\n\
  | `~` | 非 (NOT) | `~a` | 反反位 |\n| `<<` | 左移 | `n << p` | 将 `n` 左移动 `p` 位 |\n| `>>`\
  \ | 右移 | `n >> p` | 将 `n` 右移动 `p` 位 |\n\n例如，在二进制算术中使用位运算符 `&`：\n\n|| | 53 | = |\
  \ `00110101` |\n| `&` | 7 | = | `00000111` |\n\n\n\n\n\n本章演示了用于在 Java 程序中创建分支的各种关键字。\n\
  \n### 使用 if 分支\n### 分支替代方案\n### 切换分支\n## for 循环\n### while true 真值循环\n## 执行 do-while\
  \ 循环\n## 跳出循环\n### 返回控制权\n## 总结\n\n### 使用 if 分支\n\n`if` 关键字执行条件测试，以评估一个表达式的 `Boolean`\
  \ 值。表达式随后的语句仅在评估结果为 `true` 时才会执行，否则程序将继续执行后续代码——即进入下一个“分支”。`if` 语句的语法如下：\n```\n\
  ![image](img/ycap.jpg)ifif ( test-expression ) code-to-be-executed-when-true;\n\
  ```\n\n如果待执行的代码包含在大括号内以形成一个“语句块”，则它可以包含多个语句：\n\n```\n![image](img/1g.jpg)创建一个名为“If”\
  \ 的新程序，其中包含标准的 main 方法\nclass If {\n    public static void main (String[] args)\
  \ { }\n}\n```\n\n![image](img/java.jpg)\nIf.java\n\n![image](img/2g.jpg)在 main 方法的大括号之间，插入这个简单的条件测试，当一个数字大于另一个数字时，将执行单条语句：\n\
  \n```java\nif ( 5 > 1 ) System.out.println( “Five is greater than one.” ) ;\n```\n\
  ![image](img/3g.jpg)添加第二个条件测试，当一个数字小于另一个数字时，执行整个语句块：\n\n```java\nif ( 2 < 4 ) {\n\
  \    System.out.println( “Two is less than four.” ) ;\n    System.out.println( “Test\
  \ succeeded.” ) ;\n}\n```\n\n![image](img/4g.jpg)将程序保存为 `If.java`，然后编译并运行程序以查看所有语句的执行——因为在这种情况下，两个测试的评估结果都为\
  \ `true`：\n\n```\n![image](img/pg44_1.jpg)\n![image](img/hot.jpg)\n```\n\n表达式可以使用\
  \ `true` 和 `false` 关键字。测试表达式 `( 2 < 4 )` 是 `( 2 < 4 == true )` 的简写。\n\n条件测试还可以评估复杂的表达式，以对\
  \ `Boolean` 值测试多个条件。圆括号包裹每个测试条件以建立优先级——因此它们会被优先评估。布尔运算符 `&&` AND（与）确保只有当两个测试条件都为\
  \ `true` 时，复杂的表达式才会返回 `true`：\n\n```java\n```\n\n布尔运算符 `||` OR（或）确保只有当测试条件中的之一为\
  \ `true` 时，复杂的表达式才会返回 `true`：\n\n```java\nif ( ( test-condition1 ) || ( test-condition2\
  \ ) ) execute-this-code;\n```\n\n这些组合可以形成更长的复杂表达式：\n\n```\n![image](img/5g.jpg)在\
  \ If.java 的 main 方法中插入此行来声明并初始化一个名为 `num` 的整数变量\nint num = 8 ;\n```\n\n![image](img/6g.jpg)添加第三个条件测试，当变量\
  \ `num` 的值在指定范围内，或者它恰好等于某个指定值时，执行语句：\n\n```java\nif ( ( ( num > 5 ) && ( num < 10\
  \ ) ) || ( num == 12 ) )\n    System.out.println( “Number is 6-9 inclusive, or 12”\
  \ ) ;\n```\n![image](img/7g.jpg)重新编译程序并再次运行，查看复杂表达式后的语句是否被执行：\n\n```\n![image](img/pg45_1.jpg)\n\
