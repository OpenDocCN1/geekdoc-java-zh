    If you encounter problems compiling or running the program, you can get help from
    Troubleshooting problems [here](#chapter01.html_sec9) .


    **Recognizing data types**


    The most frequently-used data types in Java variable declarations are listed in
    this table, along with a brief description:


    | **Data type:** | **Description:** | **Example:** |


    | **char** | A single Unicode character | ‘a’ |


    | **String** | Any number of Unicode characters | “my String” |


    | **int** | An integer number, from -2.14 billion to +2.14 billion | 1000 |


    | **float** | A floating-point number, with a decimal point | 3.14159265f |


    | **boolean** | A logical value of either true or false | true |


    ![image](images/forget.jpg)


    Due to the irregularities of floating-point arithmetic the **float** data type
    should never be used for precise values, such as currency – see [here](#chapter07.html_sec63)
    for details.


    Notice that **char** data values must always be surrounded by single quotes, and
    **String** data values must always be surrounded by double quotes. Also, remember
    that **float** data values must always have an “f” suffix to ensure they are treated
    as a **float** value.


    In addition to the more common data types above, Java provides these specialized
    data types for use in exacting circumstances:


    | **Data type:** | **Description:** |


    | **byte** | Integer number from -128 to +127 |


    | **short** | Integer number from -32,768 to +32,767 |


    | **long** | Positive or negative integer exceeding 2.14 billion |


    | **double** | Extremely long floating-point number |


    ![image](images/forget.jpg)


    All data type keywords begin with a lowercase letter except **String** – which
    is a special class.


    Specialized data types are useful in advanced Java programs – the examples in
    this book mostly use the common data types described in the top table.


    Follow these steps to create a Java program that creates, initializes, and outputs
    variables of all five common data types:


    ![image](images/1b.jpg)Start a new program named “DataTypes” containing the standard
    main method


    **class DataTypes**


    **{**


    **public static void main ( String[] args ) {        }**


    **}**


    ![image](images/java.jpg)


    DataTypes.java


    ![image](images/2b.jpg)Between the curly brackets of the main method, insert these
    declarations to create and initialize five variables


    **char letter = ‘M’ ;**


    **String title = “Java in easy steps” ;**


    **int number = 365 ;**


    **float decimal = 98.6f ;**


    **boolean result = true ;**


    ![image](images/3b.jpg)Add these lines to output an appropriate text **String**
    concatenated to the value of each variable


    **System.out.println( “Initial is ” + letter ) ;**


    **System.out.println( “Book is ” + title ) ;**


    **System.out.println( “Days are ” + number ) ;**


    **System.out.println( “Temperature is ” + decimal ) ;**


    **System.out.println( “Answer is ” + result ) ;**


    ![image](images/4b.jpg)Save the program as **DataTypes.java**, then compile and
    run the program


    ![image](images/pg19_1.jpg)


    ![image](images/hot.jpg)


    Notice how the + character is used here to join (concatenate) text strings and
    stored variable values.


    ![image](images/hot.jpg)


    The Java compiler will report an error if the program attempts to assign a value
    of the wrong data type to a variable – try changing the values in this example,
    then attempt to recompile the program to see the effect.


    .


    **Creating constants**


    The “final” keyword is a modifier that can be used when declaring variables to
    prevent any subsequent changes to the values that are initially assigned to them.
    This is useful when storing a fixed value in a program to avoid it becoming altered
    accidentally.


    Variables created to store fixed values in this way are known as “constants”,
    and it is convention to name constants with all uppercase characters – to distinguish
    them from regular variables. Programs that attempt to change a constant value
    will not compile, and the **javac** compiler will generate an error message.


    Follow these steps to create a Java program featuring constants:


    ![image](images/1b.jpg)Start a new program named “Constants” containing the standard
    main method


    **class Constants**


    **{**


    **public static void main ( String[] args ) {        }**


    **}**


    ![image](images/java.jpg)


    Constants.java


    ![image](images/2b.jpg)Between the curly brackets of the main method, insert this
    code to create and initialize three integer constants


    **final int TOUCHDOWN = 6 ;**


    **final int CONVERSION = 1 ;**


    **final int FIELDGOAL = 3 ;**


    ![image](images/3b.jpg)Now, declare four regular integer variables


    **int td , pat , fg , total ;**


    ![image](images/4b.jpg)Initialize the regular variables – using multiples of the
    constant values


    **td = 4 * TOUCHDOWN ;**


    **pat = 3 * CONVERSION ;**


    **fg = 2 * FIELDGOAL ;**


    **total = ( td + pat + fg ) ;**


    ![image](images/5b.jpg)Add this line to display the total score


    **System.out.println( “Score: ” + total ) ;**


    ![image](images/6b.jpg)Save the program as **Constants.java**, then compile and
    run the program to see the output, Score: 33


    ( 4 x 6 = 24, 3 x 1 = 3, 2 x 3 = 6, so 24 + 3 + 6 = 33 ).


    ![image](images/hot.jpg)


    The * asterisk character is used here to multiply the constant values, and parentheses
    surround their addition for clarity


    **Adding comments**


    When programming in any language, it is good practice to add comments to program
    code to explain each particular section. This makes the code more easily understood
    by others, and by yourself, when revisiting a piece of code after a period of
    absence.


    In Java programming, comments can be added across multiple lines between **/***
    and ***/** comment identifiers, or on a single line after a **//** comment identifier.
    Anything appearing between **/*** and ***/**, or on a line after **//**, is completely
    ignored by the **javac** compiler.


    When comments have been added to the **Constants.java** program, described opposite,
    the source code might look like this:


    ![image](images/java.jpg)


    Constants.java (commented)


    **/***


    **A program to demonstrate constant variables.**


    ***/**'
