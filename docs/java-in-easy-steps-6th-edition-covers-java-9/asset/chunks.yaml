    \ `LocalDateTime` fields of the revised date\n\n```java\nString fields = “\\nYear:\\\
    t\\t\\t” + date.getYear() ;\nfields + = “\\nMonth:\\t\\t\\t” + date.getMonth()\
    \ ;\nfields + = “\\nMonth Number:\\t\\t” + date.getMonthValue() ;\nfields + =\
    \ “\\nDay:\\t\\t\\t” + date.getDayOfWeek() ;\nfields + = “\\nDay:\\t\\t\\t” +\
    \ date.getDayOfMonth() ;\nfields + = “\\nDay:\\t\\t” + date.getDayOfYear() ;\n\
    fields + = “\\nHour (23):\\t” + date.getHour() ;\nfields + = “\\nMinute:\\t\\\
    t” + date.getMinute() ;\nfields + = “\\nSecond:\\t\\t” + date.getSecond() ;\n\
    System.out.println(fields) ;\n```\n\n![image](images/7.jpg)Save the program as\
    \ `DateTime.java` then compile and run the program to see the output\n\n![image](images/pg127_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nAs with regular arrays, elements in an `ArrayList`\
    \ have a zero-based index.\n\n![image](images/forget.jpg)\n\nConcatenating a `String`\
    \ like this means the program makes just one `println()` to output field.\n\n\
    ![image](images/hot.jpg)\n\nYou alternatively use `ZonedDateTime` instead of `LocalDateTime`\
    \ if you also require time zone.\n\n### Formatting numbers\n\nJava contains a\
    \ package named `java.text` that provides useful classes for formatting.. package\
    \ can be made available to a program by including animportimport` at the very\
    \ of of the `.java``.,, use the character to mean name.\n\nThe `java.text` package\
    \ has a class named `NumberFormat`, which has methods that can be used to format\
    \ numbers,\n\nThe method used to used to used used to a a ` `Format`` determines\
    \ its formatting type – `getNumberInstance()` for group separators, `getCurrencyInstance()`\
    \ for currency signs, and `getPercentInstance()` for percentage signs. Formatting\
    \ is applied by specifying the numerical value to be formatted as the argument\
    \ to the `format()` method of the `NumberFormat` object.\n\nAlternatively, use\
    \ the wildcard character to mean all classes in the statement. This is more efficient\
    \ than calling `println()` many times.\n\nThe `java.time.format` package was introduced\
    \ in Java 8 to make it easier to specify date patterns.\n\nThe `java.time.format`\
    \ package has a `DateTimeFormatter` class that can be used to format `java.time`\
    \ dates and time objects. A `DateTimeFormatter` object contains a formatter pattern\
    \ that is specified as a string argument to its `ofPattern()` method. The formatter\
    \ comprises letters, defined in the Java documentation, and your choice of separators.\
    \ For example, `“M/d/y”` specifies the month, day, and year, separated by slashes.\
    \ The format is applied by specifying the formatter as the argument to the `format()`\
    \ method of a `java.time` date and time object.\n\nStart a new program that imports\
