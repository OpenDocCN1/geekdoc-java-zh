    \ of a `BufferedReader` object reads the characters decoded by the `InputStreamReader`.\
    \ This method must be called from within a `try catch` statement to catch any\
    \ `IOException` problems.\n\nTypically, the `readLine()` method will assign the\
    \ input to a `String` variable for manipulation by the program.\n\n![image](images/1v.jpg)Start\
