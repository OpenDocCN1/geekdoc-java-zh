    regular variable that can only contain a single value.


    The declaration of an array first states its data type, using one of the data
    type keywords, followed by square brackets [ ] to denote that it will be an array
    variable. Next, the declaration states the array variable name, adhering to the
    normal naming conventions.


    ![image](images/pinkbox.jpg)


    An array can be initialized in its declaration by assigning values of the appropriate
    data type as a comma-delimited list, enclosed within curly brackets. For example,
    the declaration of an integer array variable initialized with three values might
    look like this:


    **int[ ] numbersArray = { 1, 2, 3 } ;**


    The array is created of the length of the assigned list, allowing one “element”
    per value – in this case, an array of three elements.


    Stored values are indexed starting at zero, and each value can be addressed by
    its element index position. The syntax to do so requires the array name to be
    followed by square brackets containing the element index. For instance, **numbersArray[0]**
    would address the first value stored in the example above (1).


    Although the values stored in each element can be changed as simply as those of
    regular variables, the size of an array is determined by its declaration and cannot
    be changed later. Usefully, the total number of elements in an array is stored
    as an integer in the **length** property of that array. The syntax to address
    this figure just tacks a period and “length” onto the array name. For example,
    **numbersArray.length** would return the size of the array in the example above
    – in this case, the integer 3.


    Arrays can also be declared without assigning a list of initial values by using
    the **new** keyword to create an empty array “object” of a specified size. The
    number of required empty elements is stated in the assignment within square brackets
    after the appropriate data type. For example, the declaration of an empty integer
    array variable with three elements might look like this:


    **int[ ] numbersArray = new int[3] ;**


    The elements are assigned default values of zero for **int** and **float** data
    types, **null** for **String** data types, **\0** for **char** data types, and
    **false** for **boolean** data types.


    ![image](images/snake.jpg)


    Remember that array indexing starts at zero. This means that **index[2]** addresses
    the third element in the array, not its second element.


    ![image](images/1p.jpg)Start a new program named “Array” containing the standard
    main method


    **class Array**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


    ![image](images/java.jpg)


    Array.java


    ![image](images/2p.jpg)Inside the main method, declare and initialize a **String**
    array with three elements


    **String[] str = { “Much ”, “More”, “ Java” } ;**


    ![image](images/3p.jpg)Declare an empty integer array with three elements


    **int[] num = new int[3] ;**


    ![image](images/4p.jpg)Assign values to the first two integer array elements


    **num[0] = 100 ;**


    **num[1] = 200 ;**


    ![image](images/5p.jpg)Assign a new value to the second String array element


    **str[1] = “Better” ;**


    ![image](images/6p.jpg)Output the length of each array and the content of all
    elements in each array


    **System.out.println( “String array length is “ + str.length ) ;**


    **System.out.println( “Integer array length is “+ num.length) ;**


    **System.out.println( num[0] + ”,” +num[1]+ ”,”+num[2] ) ;**


    **System.out.println( str[0] + str[1] + str[2] ) ;**


    ![image](images/7p.jpg)Save the program as **Array.java** then compile and run
    the program to see the output


    ![image](images/pg65_1.jpg)


    ![image](images/forget.jpg)


    **String** values need to be enclosed within quotes.


    **Passing an argument**


    The standard Java code that declares the program’s **main** method includes an
    argument within its parentheses that creates a **String** array, traditionally
    named “args”:


    **public static void main( String[] args ) { }**


    The purpose of the **args[]** array is to allow values to be passed to the program
    when it is called upon to run. At the command line, a value to be passed to the
    program is added after a single space following the program name. For example,
    the command to pass the **String** “Java” to a program named “Run” would be **Run
    Java**.


    A single value passed to a program is automatically placed into the first element
    of the **args[]** array, so it can be addressed by the program as **args[0]**.


    It is important to recognize that the **args[]** array is of the **String** data
    type – so a numeric value passed to a program will be stored as a **String** representation
    of that number. This means that the program cannot use that value arithmetically
    until it has been converted to a numerical data type, such as an **int** value.
    For example, **Run 4** passes the number four to the program, which stores it
    as the **String “4”**, not as the **int 4**. Consequently, output of **args[0]+3**
    produces the concatenated **String** “43”, not the sum 7. The argument can be
    converted with the **Integer.parseInt()** method so that **Integer.parseInt( args[0])+3**
    does produce the sum 7.


    A **String** containing spaces can be passed to a program as a single **String**
    value by enclosing the entire **String** within double quotes on the command line.
    For example, **Run “Java In Easy Steps”**.


    Passing an argument to a program is most useful to determine how the program should
    run by indicating an execution option. The option is passed to the program as
    a **String** value in **args[0]** and can be evaluated using the **String.equals()**
    method. The syntax for this just tacks a period and “equals()” onto the array
    name, with a comparison **String** within the parentheses. For example, **args[0].equals(“b”)**
    evaluates the argument for the **String** value “b”.


    ![image](images/1p.jpg)Start a new program named “Option” containing the standard
    main method


    **class Option**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


    ![image](images/java.jpg)


    Option.java


    ![image](images/2p.jpg)Inside the main method, write an **if** statement to seek
    an argument of “-en”


    **if ( args[0].equals( “-en” ) )**


    **{**


    **System.out.println( “English option” ) ;**


    **}**


    ![image](images/3p.jpg)Add an **else** alternative onto the **if** statement to
    seek an argument of “-es”


    **else if ( args[0].equals( “-es” ) )**


    **{**


    **System.out.println( “Spanish option” ) ;**


    **}**


    ![image](images/4p.jpg)Add another **else** alternative onto the **if** statement
    to provide a default response


    **else System.out.println( “Unrecognized option” ) ;**


    ![image](images/5p.jpg)Save the program as **Option.java** then compile and run
    the program to see the output


    ![image](images/pg67_1.jpg)


    ![image](images/snake.jpg)


    This example will throw an **ArrayIndexOutOfBounds** exception if you attempt
    to execute the program without any argument. See [here](#chapter04.html_sec36)
    for details on how to catch exceptions.


    **Passing multiple arguments**


    Multiple arguments can be passed to a program at the command line, following the
    program name and a space. The arguments must be separated by at least one space
    and their values are placed, in order, into the elements of the **args[]** array.
    Each value can then be addressed by its index number as with any other array –
    **args[0]** for the first argument, **args[1]** for the second argument, and so
    on.


    The program can test the **length** property of the **args[]** array to ensure
    the user has entered the appropriate number of arguments. When the test fails,
    the **return** keyword can be used to exit the **main** method, thereby exiting
    the program:


    ![image](images/1p.jpg)Start a new program named “Args” containing the standard
    main method


    **class Args**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


    ![image](images/java.jpg)


    Args.java'
