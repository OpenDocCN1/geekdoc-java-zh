    \n```java\nif ( i == 1 && j == 1 )\n{\n    System.out.println( “Continues outerLoop\
    \ when i=” +i+ “ j=” +j ) ;\n    continue outerLoop ;\n}\n```\n\n![image](img/pg59_1.jpg)\n\
    \n![image](img/forget.jpg)\n\n在这里 `continue` 语句停止了内层循环第一次运行的所有迭代——通过将控制权返回外层循环。要显式指定程序应从外层循环退出，在\
    \ `break` 关键字之后写出该循环的标签名称\n\n![image](img/6g.jpg)将此 `break` 语句添加到内层循环语句块的开头，以退出外层循环——然后重新编译并运行程序\n\
    \n```java\nif ( i == 2 && j == 3 )\n{\n    System.out.println( “Breaks outerLoop\
    \ when i=” +i+ “ j=” +j ) ;\n    break outerLoop ;\n}\n```\n\n![image](img/pg59_2.jpg)\n\
    \n![image](img/forget.jpg)\n\n在这里 `break` 语句停止了整个循环结构的所有迭代——通过退出外层循环。\n\n### 总结\n\
    \n- `if` 关键字执行条件测试，以评估表达式的布尔值为 `true` 或 `false`。\n- `if` 语句块可以包含一个或多个语句，这些语句仅在测试表达式返回\
    \ `true` 时才执行。\n- `else` 关键字指定了当 `if` 关键字执行的测试返回 `false` 时执行的备选语句。\n- 组合 `if else`\
    \ 语句使程序能够通过条件分支的过程继续。\n- `switch` 语句通常可以通过提供 `case` 选项为繁琐的 `if else` 语句提供优雅的解决方案。\n\
    - 每个 `case` 选项都可以由 `break` 关键字终止，因此只有与该选项相关的语句会被执行。\n- `default` 关键字可以指定当所有 `case`\
    \ 选项都返回 `false` 时执行的语句。\n- 循环重复执行其包含的语句，直到测试表达式返回 `false` 为止。\n- `for` 关键字后面的括号指定了循环的计数器初始化、测试表达式和计数器更新器。\n\
    - `while` 循环和 `do while` 循环中的语句必须更改测试表达式中使用的值，以避免死循环。\n- 测试表达式在 `for` 循环和 `while`\
    \ 循环的开始处评估——在循环第一次迭代之前。\n- 测试表达式在 `do while` 循环的结束处评估——在循环第一次迭代之后。\n- 使用 `continue`\
    \ 关键字跳过循环迭代。\n- 使用 `break` 关键字终止循环。\n- 嵌套的内层循环可以使用标签配合 `break` 和 `continue` 关键字来引用外层循环。\n\
    \n# 4. 值的引导\n\n*本章演示了如何使用各种 Java 编程结构来引导数据值。*\n\n- 类型值强制转换\n- 创建变量数组\n- 传递参数\n\
    - 传递多个参数\n- 遍历元素\n- 更改元素值\n- 添加数组维度\n- 捕获异常\n- 总结\n\n## 类型值强制转换\n\n在 Java 编程中处理值需要严格遵守正确的数据类型，以避免编译器错误。例如，将\
    \ `float` 类型值发送到需要 `int` 类型值的方法将产生编译器错误。这意味着在处理某个值之前，通常有必要将其转换为另一种数据类型。\n\n数值值可以很容易地“强制转换”（转换）为另一种数值类型，使用以下语法：\n\
    \n```\n(int) value\n```\n\n将 `float` 值强制转换为 `int` 类型时会发生精度损失。例如，将 `365.25` 转换为\
    \ `int` 时会被截断。\n\n数值值可以使用数值类的 `toString()` 方法转换为 `String`。例如，将 `int` 变量转换为 `String`：\n\
    \n```\nInteger.toString(num)\n```\n\n同样，将 `float` 变量转换为 `String`：\n\n```\nFloat.toString(num)\n\
    ```\n\n在实践中，你经常需要将 `String` 转换为数值类型以便进行算术运算。使用 `Integer.parseInt()` 将 `String`\
    \ 转换为 `int`：\n\n```\nInteger.parseInt(msg)\n```\n\n或者使用 `Float.parseFloat()` 将\
    \ `String` 转换为 `float`：\n\n```\nFloat.parseFloat(msg)\n```\n\n在将 `String` 值转换为数值类型时，该\
    \ `String` 可能只包含有效的数值，否则编译器将报告错误。\n\n"
- fmt: "\nAn array is simply a variable that can contain multiple values – unlike\
    \ a regular variable that can only contain a single value.\n\nThe declaration\
    \ of an array first states its data type, using one of the data type keywords,\
    \ followed by square brackets `[]` to denote that it will be an array variable.\
    \ Next, the declaration states the array variable name, adhering to the normal\
    \ naming conventions.\n\n![image](images/pinkbox.jpg)\n\nAn array can be initialized\
    \ in its declaration by assigning values of the appropriate data type as a comma-delimited\
    \ list, enclosed within curly brackets. For example, the declaration of an integer\
    \ array variable initialized with three values might look like this:\n\n```\n\
    int[ ] numbersArray = { 1, 2, 3 } ;\n```\n\nThe array is created of the length\
    \ of the assigned list, allowing one “element” per value – in this case, an array\
    \ of three elements.\n\nStored values are indexed starting at zero, and each value\
    \ can be addressed by its element index position. The syntax to do so requires\
    \ the array name to be followed by square brackets containing the element index.\
    \ For instance, `numbersArray[0]` would address the first value stored in the\
    \ example above (1).\n\nAlthough the values stored in each element can be changed\
    \ as simply as those of regular variables, the size of an array is determined\
    \ by its declaration and cannot be changed later. Usefully, the total number of\
    \ elements in an array is stored as an integer in the `length` property of that\
    \ array. The syntax to address this figure just tacks a period and “length” onto\
    \ the array name. For example, `numbersArray.length` would return the size of\
    \ the array in the example above – in this case, the integer 3.\n\nArrays can\
    \ also be declared without assigning a list of initial values by using the `new`\
    \ keyword to create an empty array “object” of a specified size. The number of\
    \ required empty elements is stated in the assignment within square brackets after\
    \ the appropriate data type. For example, the declaration of an empty integer\
    \ array variable with three elements might look like this:\n\n```\nint[ ] numbersArray\
    \ = new int[3] ;\n```\n\nThe elements are assigned default values of zero for\
    \ `int` and `float` data types, `null` for `String` data types, `\\0` for `char`\
    \ data types, and `false` for `boolean` data types.\n\n![image](images/snake.jpg)\n\
    \nRemember that array indexing starts at zero. This means that `index[2]` addresses\
    \ the third element in the array, not its second element.\n\n![image](images/1p.jpg)Start\
    \ a new program named “Array” containing the standard main method\n\n```\nclass\
    \ Array\n{\n    public static void main ( String[] args )      }\n}\n```\n\n![image](images/java.jpg)\n\
    \nArray.java\n\n![image](images/2p.jpg)Inside the main method, declare and initialize\
    \ a `String` array with three elements\n\n```\nString[] str = { “Much ”, “More”,\
    \ “ Java” } ;\n```\n\n![image](images/3p.jpg)Declare an empty integer array with\
    \ three elements\n\n```\nint[] num = new int[3] ;\n```\n\n![image](images/4p.jpg)Assign\
    \ values to the first two integer array elements\n\n```\nnum[0] = 100 ;\nnum[1]\
    \ = 200 ;\n```\n\n![image](images/5p.jpg)Assign a new value to the second String\
    \ array element\n\n```\nstr[1] = “Better” ;\n```\n\n![image](images/6p.jpg)Output\
    \ the length of each array and the content of all elements in each array\n\n```\n\
    System.out.println( “String array length is “ + str.length ) ;\nSystem.out.println(\
    \ “Integer array length is“+ num.length) ;\nSystem.out.println( num[0] + ”,” +num[1]+\
    \ ”,”+num[2] ) ;\nSystem.out.println( str[0] + str[1] + str[2] ) ;\n```\n\n![image](images/7p.jpg)Save\
    \ the program as `Array.java` then compile and run the program to see the output\n\
    \n![image](images/pg65_1.jpg)\n\n![image](images/forget.jpg)\n\n`String` values\
    \ need to be enclosed within quotes.\n\n### Passing an argument\n\nThe standard\
    \ Java code that declares the program’s `main` method includes an argument within\
    \ its parentheses that creates a `String` array, traditionally named “args”:\n\
    \n```\npublic static void main( String[] args ) { }\n```\n\nThe purpose of the\
    \ `args[]` array is to allow values to be passed to the program when it is called\
    \ upon to run. At the command line, a value to be passed to the program is added\
    \ after a single space following the program name. For example, the command to\
    \ pass the `String` “Java” to a program named “Run” would be `Run Java`.\n\nA\
    \ single value passed to a program is automatically placed into the first element\
    \ of the `args[]` array, so it can be addressed by the program as `args[0]`.\n\
    \nIt is important to recognize that the `args[]` array is of the `String` data\
    \ type – so a numeric value passed to a program will be stored as a `String` representation\
    \ of that number. This means that the program cannot use that value arithmetically\
    \ until it has been converted to a numerical data type, such as an `int` value.\
    \ For example, `Run 4` passes the number four to the program, which stores it\
    \ as the `String “4”`, not as the `int 4`. Consequently, output of `args[0]` would\
    \ be the string “4”.\n\n### Passing multiple arguments\n\nMultiple arguments can\
    \ be passed to a program at the command line, following the program name and a\
    \ space. The arguments must be separated by at least one space and their values\
    \ are placed, in order, into the elements of the `args[]` array. Each value can\
    \ then be addressed by its index number as with any other array – `args[0]` for\
    \ the first argument, `args[1]` for the second argument, and so on.\n\nThe program\
    \ can test the `length` property of the `args[]` array to ensure the user has\
    \ entered the appropriate number of arguments. When the test fails, the `return`\
    \ keyword can be used to exit the `main` method, thereby exiting the program:\n\
    \n```\nclass Args\n{\n    public static void main ( String[] args )      }\n}\n\
    ```\n\nArgs.java\n"
