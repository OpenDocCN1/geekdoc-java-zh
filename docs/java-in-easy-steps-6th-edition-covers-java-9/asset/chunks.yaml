    Here, the expression evaluates as true when there is any remainder.


    ### Setting precedence


    Complex expressions, which contain multiple operators and operands, can be ambiguous
    unless the order in which the operations should be executed is clear. This lack
    of clarity can easily cause different results to be implied by the same expression.
    For example, consider this complex expression:


    ```java

    num = 8 + 4 * 2 ;

    ```


    Working left to right `8 + 4 = 12`, and `12 * 2 = 24`, so `num = 24`. But working
    right to left `2 * 4 = 8`, and `8 + 8 = 16`, so `num = 16`.


    The Java programmer can explicitly specify which operation should be executed
    first by adding parentheses to signify which operator has precedence. In this
    case, `(8 + 4) * 2` ensures that the addition is performed before the multiplication
    – so the result is 24, not 16. Conversely, `8 + (4 * 2)` performs the multiplication
    first – so the result is 16.


    Where parentheses do not explicitly specify precedence Java follows the default
    precedence order listed in the table below, from first at the top to last at the
    bottom:


    | Operator | Description |

    | :--- | :--- |

    | `++ -- !` | Increment, Decrement, Logical NOT |

    | `/ %` | Multiplication, Division, Modulus |

    | `+ -` | Addition, Subtraction |

    | `> >= <=` | Greater than... / Less than... |

    | `== !=` | Equality, Inequality |

    | `&&` | Logical AND |

    | `\| \|` | Logical OR |

    | `? :` | Conditional |

    | `= -= *= %=` | Assignment |


    Operators of equal precedence are handled in the order they appear in the – from
    left to right.


    Follow these steps to explore operator precedence in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type `jshell` and
    hit the `Enter` key to launch the Java shell


    ![image](images/2r.jpg)Next, enter a statement to display the result of evaluating
    an expression that uses default operator precedence


    ```java

    int sum = 32 - 8 + 16 * 2 ;

    ```


    ![image](images/pg37_1.jpg)


    ![image](images/3r.jpg)Now, enter a statement to display the result of evaluating
    the same expression – but giving addition and subtraction precedence over multiplication


    ```java

    sum = ( 32 - 8 + 16 ) * 2 ;

    ```


    ![image](images/pg37_2.jpg)


    ![image](images/4r.jpg)Finally, enter a statement to display the result of evaluating
    the same expression once more – but now where precedence order is first addition,
    then subtraction, and then multiplication


    ```java

    sum = ( 32 - ( 8 + 16 ) ) * 2 ;

    ```


    ![image](images/pg37_3.jpg)


    ![image](images/forget.jpg)


    Where expressions have multiple nested parentheses, the innermost takes precedence.


    How it works – Step 2 ...


    `16 x 2 = 32, + 24 = 56`


    Step 3...


    `24 + 16 = 40, x 2 = 80`


    Step 4 ...


    `32 - 24 = 8, x 2 = 16`

