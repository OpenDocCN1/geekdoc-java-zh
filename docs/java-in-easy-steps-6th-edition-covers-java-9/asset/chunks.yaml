    \n![image](img/pg123_1.jpg)\n\n![image](img/pg123_2.jpg)\n\n![image](img/hot.jpg)\n\
    \n你可以调用 `BufferedWriter` 对象的 `append()` 方法来添加文本——而不是使用 `write()` 方法覆盖文本。\n\n###\
    \ 排序数组元素\n\nJava 包含一个名为 `java.util` 的包，它提供了处理数据集合的实用实用程序。通过在 `.java` 文件的最开头包含\
    \ `import` 语句，可以使程序可以使用包。在 `import java.util.* ;` 语句中，可以使用通配符来表示“所有类”。\n\n`java.util`\
    \ 包有一个名为“Arrays”的类，它包含可以用于操作数组的方法。通过导入 `java.util` 包中的所有类，或者在程序仅需要单个类时通过 `import`\
    \ 语句仅导入该特定类，可以使功能对程序可用。例如，程序可以使用 `import java.util.Arrays ;` 语句导入 `Arrays` 类。\n\
    \n`Arrays` 类有一个 `sort()` 方法，可以按字母和数字顺序重新排列数组元素的内容。\n\n![image](img/1v.jpg)启动一个新程序，导入\
    \ `java.util.Arrays` 类中所有方法的功能\n\n```java\nimport java.util.Arrays ;\n```\n\n\
    ![image](img/java.jpg)\n\nSort.java\n\n![image](img/2v.jpg)添加一个名为“Sort”的类，包含标准的\
    \ main 方法\n\n```java\nclass Sort {\n    public static void main( String[] args\
    \ ) { }\n}\n```\n\n![image](img/3v.jpg)在 main 方法之后，插入一个方法来显示传递的 `String` 数组的所有元素内容\n\
    \n```java\npublic static void display( String[] elems ) {\n    System.out.println(\
    \ “\\nString Array:” ) ;\n    for ( int i = 0 ; i < elems.length ; i++ )\n   \
    \     System.out.println( “Element ”+i+“ is ”+elems[i] ) ;\n}\n```\n\n![image](img/4v.jpg)添加一个重载的\
    \ `display()` 方法以显示传递的 `int` 数组的所有元素内容\n\n```java\npublic static void display(\
    \ int[] elems ) {\n    System.out.println( “\\nInteger Array:” ) ;\n    for (\
    \ int i = 0 ; i < elems.length ; i++ )\n        System.out.println( “Element ”+i+“\
    \ is ”+elems[i] ) ;\n}\n```\n\n![image](img/hot.jpg)\n\n关于方法重载的更多信息请参见此处。\n\n\
    ![image](img/5v.jpg)在 main 方法的大括号之间，声明并初始化 `String` 数组和 `int` 数组\n\n```java\n\
    String[] names = { “Mike” , “Dave” , “Andy” } ;\nint[] nums = { 200 , 300 } ;\n\
    ```\n\n![image](img/6v.jpg)输出每个数组中的所有元素\n\n```java\ndisplay( names ) ;\ndisplay(\
    \ nums ) ;\n```\n\n![image](img/7v.jpg)对两个数组进行排序\n\n```java\nArrays.sort( names\
    \ ) ;\nArrays.sort( nums ) ;\n```\n\n![image](img/8v.jpg)输出每个数组中的所有元素\n\n```java\n\
    display( names ) ;\ndisplay( nums ) ;\n```\n\n![image](img/9v.jpg)将程序保存为 `Sort.java`，然后编译并运行程序查看输出\n\
    \n![image](img/pg25_1.jpg)\n\n![image](img/forget.jpg)\n\n示例中的 `for` 循环只有一个语句，因此不需要括号——但为了清晰可以添加。\n\
    \n### 数组列表\n\n`java.util` 包包含一个名为 `ArrayList` 的类，它以有序的“集合”（可调整序列）存储数据。通过导入特定类\
    \ `util.ArrayList` 可以使其程序可用。列表可以包含重复元素，`ArrayList` 对象允许通过指定索引来操作存储的值。例如，列表的方法调用\
    \ `get(0)` 将检索存储在第一个元素的值，而 `remove(1)` 将删除第二个列表元素。\n\n可以通过指定索引号和新值作为 `set()` 方法的参数来修改元素值。可以通过指定索引号和值作为\
    \ `add()` 方法的参数向特定位置添加元素。列表通过移动元素值来适应额外的元素。\n\n![image](img/hot.jpg)\n\n你可以通过调用\
    \ `size()` 方法发现列表当前有多少个元素。\n\n`ArrayList` 对象只需使用 `new` 关键字创建，但与其他 Java 集合一样，语句必须指定列表可能包含泛泛类型。通常，列表包含\
    \ `String` 项目，因此 `ArrayList` 必须带有 `<String>` 后缀。\n\n集合（如 `ArrayList`）有一个 `forEach()`\
    \ 方法可以遍历列表中的每个元素。这使得遍历包含的所有项目变得简单。\n\n通过指定“Lambda 表达式”作为 `forEach()` 方法的参数，可以方便地引用每个存储的列表项。Lambda\
    \ 表达式只是短匿名（未命名）方法，可以在执行的位置指定。它们以括号开始，包含任何参数，然后是 `->` 字符序列，最后是语句块\n\n参数的数据类型可以显式声明，也可以从上下文中推断——`(String\
    \ x)` 可以简单为 `(x)`。此外，如果 Lambda 表达式语句块只包含一个语句，可以省略大括号。\n"
