    \ “ j=” +j ) ;\n    break outerLoop ;\n}\n```\n\n![image](images/pg59_2.jpg)\n\
    \n![image](images/forget.jpg)\n\nHere the `break` statement halts all further\
    \ iterations of the entire loop structure – by exiting from the outer loop.\n\n\
    ### Summary\n\n- The `if` keyword performs a conditional test to evaluate an expression\
    \ for a Boolean value of `true` or `false`.\n- An `if` statement block can contain\
    \ one or more statements, which are only executed when the test expression returns\
    \ `true`.\n- The `else` keyword specifies alternative statements to execute when\
    \ the test performed by the `if` keyword returns `false`.\n- Combined `if else`\
    \ statements enable a program to proceed by the process of conditional branching.\n\
    - A `switch` statement can often provide an elegant solution to unwieldy `if else`\
    \ statements by offering `case` options.\n- Each `case` option can be terminated\
    \ by the `break` keyword so only statements associated with that option will be\
    \ executed.\n- The `default` keyword can specify statements to be executed when\
    \ all `case` options return `false`.\n- A loop repeatedly executes the statements\
    \ it contains until a tested expression returns `false`.\n- The parentheses that\
    \ follow the `for` keyword specify the loop’s counter initializer, test expression,\
    \ and counter updater.\n- Statements in a `while` loop and a `do while` loop must\
    \ change a value used in their test expression to avoid an infinite loop.\n- The\
    \ test expression is evaluated at the start of `for` loops and `while` loops –\
    \ before the first iteration of the loop.\n- The test expression is evaluated\
    \ at the end of `do while` loops – after the first iteration of the loop.\n- A\
    \ loop iteration can be skipped using the `continue` keyword.\n- A loop can be\
    \ terminated using the `break` keyword.\n- Nested inner loops can use labels with\
    \ the `break` and `continue` keywords to reference the outer loop.\n\n# 4. Directing\
    \ values\n\n*This chapter demonstrates how to direct data values using various\
    \ Java programming constructs.*\n\n- [Casting type values](#chapter04.html_sec29)\n\
    - [Creating variable arrays](#chapter04.html_sec30)\n- [Passing an argument](#chapter04.html_sec31)\n\
    - [Passing multiple arguments](#chapter04.html_sec32)\n- [Looping through elements](#chapter04.html_sec33)\n\
    - [Changing element values](#chapter04.html_sec34)\n- [Adding array dimensions](#chapter04.html_sec35)\n\
    - [Catching exceptions](#chapter04.html_sec36)\n- [Summary](#chapter04.html_sec37)\n\
    \n## Casting type values\n\nHandling values in Java programming requires correct\
    \ data typing to be closely observed to avoid compiler errors. For example, sending\
    \ a `float` type value to a method that requires an `int` type value will produce\
    \ a compiler error. This means it is often necessary to convert a value to another\
    \ data type before it can be processed.\n\nNumeric values can be easily “cast”\
    \ (converted) into another numeric data type using this syntax:\n\n```\n- (data-type)\
    \ value\n```\n\nSome loss of precision will occur when casting `float` floating\
    \ point values into an `int` data type, as the number will be truncated at the\
    \ decimal point. For example, casting a `float` value of 9.9 into an `int` variable\
    \ produces an integer value of nine.\n\nInterestingly, character values of the\
    \ `char` data type can automatically be used as `int` values because they each\
    \ have a unique integer representation. This is their numeric code value in the\
    \ ASCII character set, which is supported by Java. The uppercase letter A, for\
    \ instance, has the code value of 65.\n\nNumeric values can be converted to the\
    \ `String` data type using the `toString()` method of that value’s data type class.\
    \ This takes the numeric value as its argument, within the parentheses. For example,\
    \ convert an `int num` variable to a `String` with `Integer.toString(num)`. Similarly,\
    \ convert a `float num` variable to a `String` with `Float.toString(num)`. In\
    \ practice, this technique is not always required because Java automatically converts\
    \ variables to a `String` if any one of the variables has a `String` value.\n\n\
    More frequently, you will want to convert a `String` value to a numeric type so\
    \ the program can use that value arithmetically. A `String` can be converted to\
    \ an `int` using `Integer.parseInt()`. This takes the `String` value as its argument.\
    \ For example, convert a `String msg` variable to an `int` with `Integer.parseInt(msg)`.\
    \ Similarly, convert a `String msg` variable to a `float` with `Float.parseFloat(msg)`.\
    \ When converting a `String` value to a numeric type, the `String` may only contain\
    \ a valid numeric value, or the compiler will report an error.\n\n![image](images/forget.jpg)\n\
    \nAll numeric classes have a `parse` method and a `toString` method allowing conversion\
    \ between `String` values and numeric data types.\n\n![image](images/1p.jpg)Start\
    \ a new program named “Convert” containing the standard main method\n\n```java\n\
    class Convert\n{\n    public static void main ( String[] args ) {    }\n}\n```\n\
    \n![image](images/java.jpg)\n\nConvert.java\n\n![image](images/2p.jpg)Inside the\
    \ main method, declare and initialize a `float` variable and a `String` variable\n\
    \n```java\nfloat daysFloat = 365.25f;\nString weeksString = “52”;\n```\n\n![image](images/3p.jpg)Cast\
    \ the `float` value into an `int` variable\n\n```java\nint daysInt = (int) daysFloat;\n\
    ```\n\n![image](images/4p.jpg)Convert the `String` value into an `int` variable\n\
    \n```java\nint weeksInt = Integer.parseInt(weeksString);\n```\n\n![image](images/5p.jpg)Perform\
    \ arithmetic on the converted values and display the result\n\n```java\nint week\
    \ = ( daysInt / weeksInt ) ;\nSystem.out.println( “Days per week: “ + week ) ;\n\
    ```\n\n![image](images/6p.jpg)Save the program as `Convert.java` then compile\
    \ and run the program to see the output\n"
