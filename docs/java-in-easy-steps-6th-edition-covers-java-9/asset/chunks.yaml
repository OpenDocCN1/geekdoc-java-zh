- fmt: "\n`String` values that use different letter case, such as “Java” and “JAVA”,\
    \ are not considered equal because the ASCII code values of the characters differ.\
    \ For instance, the value of uppercase “A” is 65, whereas lowercase “a” is 97.\n\
    \nTo compare an input `String` value, where the letter case entered by the user\
    \ is uncertain, against a `String` value in the program it is often useful to\
    \ transform the input into a particular case. For this purpose, the `String` class\
    \ provides a `toUpperCase()` method and a `toLowerCase()` method. The input `String`\
    \ is specified as the argument, and the method returns the transformed `String`.\n\
    \nA typical example might force a user-input password `String` to lowercase before\
    \ comparing it to the correct password stored in all lowercase in a `String` variable\
    \ within the program. This would allow the user to enter their password in uppercase,\
    \ lowercase, or a mixture of both cases where case-insensitive passwords are permissible.\n\
    \nDot notation allows methods to be tacked onto other methods so their operations\
    \ can be performed in sequence. This means that `toLowerCase().equals()` can be\
    \ used to transform a `String` value to lowercase and then compare that lowercase\
    \ version against a specified argument.\n\n![image](images/1o.jpg)Start a new\
    \ program named “StringComparison” containing the standard main method\n\n```java\n\
    class StringComparison\n{\n    public static void main ( String[] args ) { }\n\
    }\n```\n\n![image](images/java.jpg)\n\nStringComparison.java\n\n![image](images/2o.jpg)Inside\
    \ the main method, create and initialize a `String` variable with a correct lowercase\
    \ password\n\n```java\nString password = “bingo” ;\n```\n\n![image](images/3o.jpg)Add\
    \ a `try catch` statement to catch the exception that occurs when no password\
    \ argument is entered\n\n```java\ntry {\n}\ncatch( Exception e )\n{\n    System.out.println(\
    \ “Password required.” ) ;\n}\n```\n\n![image](images/4o.jpg)Insert this `if else`\
    \ statement into the `try` statement block to evaluate the password argument entered\
    \ by the user\n\n```java\nif ( args[0].toLowerCase().equals( password ) )\n{\n\
    \    System.out.println( “Password accepted.” ) ;\n}\nelse\n{\n    System.out.println(\
    \ “Incorrect password.” ) ;\n}\n```\n\n![image](images/5o.jpg)Save the program\
    \ as `StringComparison.java` then compile and run the program with various arguments\n\
    \n![image](images/pg91_1.jpg)\n\n## Searching strings\n\nThe `String` class within\
    \ the `java.lang` package provides `startsWith()` and `endsWith()` methods to\
    \ compare portions of a `String` value. These are especially useful to compare\
    \ a number of `String` values and select those with common beginnings or common\
    \ endings. When the `String` section matches the specified argument, the method\
    \ returns `true` – otherwise, it returns `false`.\n\nA portion of a `String` value\
    \ can be copied by stating the position number of the first character to be copied\
    \ as the argument to its `substring()` method. This will return a substring of\
    \ the original `String` value, starting at the specified start position and ending\
    \ at the end of the original `String`.\n\nOptionally, the `substring()` method\
    \ can take a second argument to specify the position number of the final character\
    \ to be copied. This will return a substring of the original `String` value, starting\
    \ at the specified start position and ending at the specified end position.\n\n\
    A `String` value can be searched to find a character or substring specified as\
    \ the argument to its `indexOf()` method. Unusually, this method returns the numeric\
    \ position of the first occurrence of the matched character or substring within\
    \ the searched `String` value. Where no match is found, the method returns the\
    \ negative integer value of -1.\n\n![image](images/1o.jpg)Start a new program\
    \ named “StringSearch” containing the standard main method\n\n```java\nclass StringSearch\n\
    {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](images/java.jpg)\n\
    \nStringSearch.java\n\n![image](images/2o.jpg)Inside the main method, create an\
    \ initialized `String` array of book titles\n\n```java\nString[] books =\n{  \
    \  “Java in easy steps”, “XML in easy steps” ,\n    “SQL in easy steps” , ”CSS\
    \ in easy steps” ,\n    “Gone With the Wind” , “Drop the Defense” } ;\n```\n\n\
    ![image](images/3o.jpg)Create and initialize three `int` counter variables\n\n\
    ```java\nint counter1 = 0 , counter2 = 0 , counter3 = 0 ;\n```\n\n![image](images/4o.jpg)Add\
    \ a `for` loop to iterate through the `String` array, listing as output the first\
    \ four characters of each title\n\n```java\nfor ( int i = 0 ; i < books.length\
    \ ; i++ )\n{\n    System.out.print( books[i].substring( 0, 4 ) + “ | ” );\n}\n\
    ```\n\n![image](images/5o.jpg)Insert a statement in the `for` loop to count the\
    \ titles with an ending\n\n```java\nif ( books[i].endsWith( “easy steps” ) counter1++;\n\
    ```\n\n![image](images/6o.jpg)Insert a statement in the `for` loop to count the\
    \ titles with a beginning\n\n```java\nif ( books[i].startsWith( “Java” ) counter2++;\n\
    ```\n\n![image](images/7o.jpg)Insert a statement in the `for` loop to count the\
    \ titles not containing a substring\n\n```java\nif ( books[i].indexOf( “easy”\
    \ ) == -1 ) counter3++;\n```\n\n![image](images/8o.jpg)At the end of the main\
    \ method, add these statements to output the results of each search\n\n```java\n\
    System.out.println( “\\nFound “ + counter1 + “ titles from this series” ) ;\n\
    System.out.println( “Found “ + counter2 + “ Java title” ) ;\nSystem.out.println(\
    \ “Found “ + counter3 + “ other titles” ) ;\n```\n\n![image](images/9o.jpg)Save\
    \ the program as `StringSearch.java` then compile and run the program\n\n![image](images/forget.jpg)\n\
    \nThe `!` operator cannot be used to test if the `indexOf()` method has failed\
    \ – because it returns an integer value, not a Boolean value.\n\n## Manipulating\
    \ characters\n\nThe `String` class within `java.lang` package provides the `trim()`\
    \ method that is used to remove any whitespace from the beginning and end of the\
    \ `String` specified as its argument. This method will remove extreme spaces,\
    \ newlines, and tabs, returning the trimmed version of that `String`.\n\nAn individual\
    \ character in a `String` can be addressed by stating its index position within\
    \ that `String` as the argument to its `charAt()` method. This method treats the\
    \ `String` as an array of characters where the first character is at position\
    \ zero – just like other arrays whose elements are indexed starting at zero. The\
    \ first character in a `String` can be addressed as `charAt(0)`, the second character\
    \ as `charAt(1)`, and so on.\n\nAs character indexing begins at zero, the final\
    \ character in a `String` will always have an index number is one less than the\
    \ total number of characters in the `String`. This means that the final character\
    \ in any `String` has the index number equivalent to `length() - 1`. The final\
    \ character in a `String` named `str` can, therefore, be addressed as `str.charAt(\
    \ str.length() - 1 )`.\n\nAll occurrences of a particular character in a `String`\
    \ can be replaced by another character using its `replace()` method. This method\
    \ requires two arguments that specify the character to be replaced and the character\
    \ that is to take its place. For example, to replace all occurrences of the letter\
    \ “a” with the letter “z”, the syntax would be `replace( ‘a’ , ‘z’ )`.\n\nThe\
    \ `isEmpty()` method can be used to discover if a `String` contains no characters.\
    \ This method will return `true` if the `String` is absolutely empty, otherwise\
    \ it will return `false`.\n"
