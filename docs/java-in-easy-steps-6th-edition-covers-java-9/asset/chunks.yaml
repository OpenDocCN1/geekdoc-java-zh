    \ `+` 操作取决于操作数的类型。如果两个操作数都是数值，它将返回和；但如果操作数是 `String` 值，它将返回连接后的 `String` —— 例如，“Java\
    \ ” + “Arithmetic”返回“Java”。\n\n`int` 除法将截断任何小数部分。例如 11/4=2，而 `float` 除法 11/4=2.75。\n\
    \n递增运算符 `++` 和递减运算符 `--` 返回修改单个操作数值的结果。例如，4++ 返回 5，4-- 返回 3。\n\n取模运算符 `%` 将第一个操作数除以第二个操作数并返回操作的余数。例如，32\
    \ % 5 返回 2 —— 五除 32 为六次，余 2。\n\n按照以下步骤在 Java Shell 中探索 Java 算术运算符\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入\
