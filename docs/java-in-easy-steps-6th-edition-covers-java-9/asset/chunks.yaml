    \n```java\nint randomInt = (int) Math.ceil( multiplied ) ;\nSystem.out.println(\
    \ “Random Integer: “ + randomInt ) ;\n```\n\n![image](img/5o.jpg)将程序保存为 `Random.java`，然后编译并运行程序以查看输出\n\
    \n![image](img/pg86_1.jpg)\n\n![image](img/hot.jpg)\n\n上所述的乐票程序将此示例中的三个步骤合并为一条语句。\n\
    \n可以使用 `Math.random()` 生成一组在 1-59（包含）范围内的六个不重复的随机数序列，以产生随机乐票选择。\n\n![image](img/1o.jpg)创建一个名为“Lottery”的新程序，其中包含标准的\
