  raw: 'The **Math** class within the **java.lang** package provides two methods to
    compare two numerical values. The **Math.max()** method and the **Math.min()**
    method each require two numbers to be stated as their arguments. **Math.max()**
    will return the greater number and **Math.min()** will return the smaller number.


    The numbers to be compared can be of any numerical data type, but the result will
    be returned as a **double** data type.


    ![image](images/1o.jpg)Start a new program named “Compare” containing the standard
    main method


    **class Compare**


    **{**


    **public static void main ( String[] args ) {          }**


    **}**


    ![image](images/java.jpg)


    Compare.java


    ![image](images/2o.jpg)Inside the main method, declare and initialize a **float**
    variable and an **int** variable


    **float num1 = 24.75f ;**


    **int num2 = 25 ;**


    ![image](images/3o.jpg)Output the greater value


    **System.out.println( “Most is “ + Math.max( num1, num2 ) ) ;**


    ![image](images/4o.jpg)Output the lesser value


    **System.out.println( “Least is “ + Math.min( num1, num2 ) ) ;**


    ![image](images/5o.jpg)Save the program as **Compare.java** then compile and run
    the program to see the output


    ![image](images/pg85_1.jpg)


    **Generating random numbers**


    The **Math** class within the **java.lang** package provides the ability to generate
    random numbers with its **Math.random()** method, which returns a **double** precision
    random number between 0.0 and 0.999\. Multiplying the random number will specify
    a wider range. For example, multiplying by 10 will create a random number in the
    range of 0.0 to 9.999\. Now rounding the random number up with **Math.ceil()**
    will ensure it falls within the range of 1-10 inclusive.


    ![image](images/1o.jpg)Start a new program named “Random” containing the standard
    main method


    **class Random**


    **{**


    **public static void main ( String[] args ) {         }**


    **}**


    ![image](images/java.jpg)


    Random.java


    ![image](images/2o.jpg)Inside the main method, assign a random number to a **float**
    variable, and output its value


    **float random = (float) Math.random() ;**


    **System.out.println( “Random number: “ + random ) ;**


    ![image](images/3o.jpg)Assign a multiplication of the random number to a second
    **float** variable, and output its value


    **float multiplied = random * 10 ;**


    **System.out.println( “Multiplied number: “ + multiplied ) ;**


    ![image](images/4o.jpg)Assign a rounded integer of the multiplied random number
    to an **int** variable, and output its value


    **int randomInt = (int) Math.ceil( multiplied ) ;**


    **System.out.println( “Random Integer: “ + randomInt ) ;**


    ![image](images/5o.jpg)Save the program as **Random.java** then compile and run
    the program to see the output


    ![image](images/pg86_1.jpg)


    ![image](images/hot.jpg)


    The Lottery program described opposite combines all three steps from this example
    into a single statement.


    A sequence of six non-repeating random numbers within the range 1-59 inclusive
    can be generated using **Math.random()** to produce a random lottery selection.


    ![image](images/1o.jpg)Start a new program named “Lottery” containing the standard
    main method


    **class Lottery**


    **{**


    **public static void main ( String[] args ) {            }**


    **}**


    ![image](images/java.jpg)


    Lottery.java


    ![image](images/2o.jpg)Inside the main method, create an **int** array of 60 elements,
    then fill elements 1-59 with integers 1-59


    **int[] nums = new int[60] ;**


    **for( int i = 1 ; i < 60 ; i++ ) { nums[i] = i ; }**


    ![image](images/3o.jpg)Shuffle the values in elements 1-59


    **for( int i = 1 ; i < 60 ; i++ )**


    **{**


    **int r = (int) Math.ceil( Math.random() * 59 ) ;**


    **int temp = nums[i] ;**


    nums[i] = nums[r] ;


    nums[r] = temp ;


    **}**


    ![image](images/4o.jpg)Output only those values contained in elements 1-6


    **for ( int i = 1 ; i < 7 ; i++ )**


    **{**


    **System.out.print( Integer.toString( nums[i]) + “ “ ) ;**


    **}**


    ![image](images/5o.jpg)Save the program as **Lottery.java** then compile it and
    run the program three times to see three different sequences


    ![image](images/pg87_1.jpg)


    ![image](images/hot.jpg)


    This program is revisited with a graphical user interface in [Chapter 10](#chapter10.html).


    **Managing strings**


    In Java programming, a **String** is zero or more characters enclosed within quotation
    marks. So, these are all valid **String** values:


    **String txt1 = “My First String” ;**


    **String txt2 = “” ;**


    **String txt3 = “2” ;**


    **String txt4 = “null” ;**


    ![image](images/snake.jpg)


    **Array.length** is a property but **String.length()** is a method – so it must
    have trailing parentheses.


    The empty quotes of **txt2** initialize the variable as an empty **String** value.
    The numeric value assigned to **txt3** is a **String** representation of the number.
    The Java **null** keyword, which normally represents the absence of any value,
    is simply a **String** literal when it is enclosed within quotes.


    Essentially, a **String** is a collection of characters; each character containing
    its own data – just like elements in a defined array. It is, therefore, logical
    to regard a **String** as an array of characters and apply array characteristics
    when dealing with **String** values.


    The **String** class is part of the fundamental **java.lang** package and provides
    a **length()** method that will return the size of a **String**, much like the
    **length** property of an array. Each **String** variable is created as an “instance”
    of the **String** class so its methods can be used by tacking their name onto
    the variable name using dot notation. For example, the syntax to return the size
    of a **String** variable named **txt** is **txt.length()**.


    The **String** class within the **java.lang** package also provides an alternative
    to the **+** concatenation operator for joining **String** values together. Its
    **concat()** method requires a single argument specifying the second **String**
    to be appended. In use it is tacked onto the variable name of the first **String**
    using dot notation. For example, append **txt2** onto **txt1** using **txt1.concat(
    txt2 )**.


    ![image](images/1o.jpg)Start a new program named “StringLength” containing the
    standard main method


    **class StringLength**


    **{**


    **public static void main ( String[] args ) {           }**


    **}**


    ![image](images/java.jpg)


    StringLength.java


    ![image](images/2o.jpg)Inside the main method, create and initialize two **String**
    variables


    **String lang = “Java” ;**


    **String series = “ in easy steps” ;**


    ![image](images/3o.jpg)Add another **String** variable and assign it the concatenated
    value of the other two **String** variables


    **String title = lang.concat( series ) ;**


    ![image](images/4o.jpg)Output the concatenated **String** within quotation marks,
    together with its size


    **System.out.print( “\”” + title + “\” has “ )** ;


    **System.out.println( title.length() + “ characters” ) ;**


    ![image](images/5o.jpg)Save the program as **StringLength.java** then compile
    and run the program to see the output


    ![image](images/pg89_1.jpg)


    ![image](images/forget.jpg)


    Spaces are part of the **String** so are included in the character count – but
    the quotation marks are not included.


    **Comparing strings**


    The **String** class within the **java.lang** package provides the useful **equals()**
    method that was introduced [here](#chapter04.html_sec31) to evaluate a command
    line argument in the **args[0]** element. This can also be used to compare any
    two **String** values by tacking the method name onto the first **String** variable
    using dot notation, and specifying the **String** to be compared as its argument.
    For example, the syntax to compare **txt2** to **txt1** is **txt1.equals( txt2
    )**. When both **String** values have identical characters, in the same order,
    the method returns **true** – otherwise, it returns **false**.


    ![image](images/snake.jpg)


    Be sure to observe correct capitalization using a capital “C” in the toUpperCase
    and toLowerCase methods.'
