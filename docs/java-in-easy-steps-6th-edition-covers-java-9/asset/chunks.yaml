    \ a class named “ReadFile” containing the standard main method\n\n```java\nclass\
    \ ReadFile {\n    public static void main( String[] args ) { }\n}\n```\n\n![image](images/3v.jpg)Between\
    \ the curly brackets of the main method, insert a `try catch` statement\n\n```java\n\
    try {\n} catch ( IOException e ) {\n    System.out.println( “A read error has\
