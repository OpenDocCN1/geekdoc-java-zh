    ## 创建对象类


    现实世界的对象无处不在，它们每一个都有我们可以描述的属性和行为：


    • 属性描述对象拥有的特征

    • 行为描述对象可以执行的操作


    例如，一辆汽车可以被描述为具有“红色”和“轿跑”属性，以及一个“加速”行为。


    这些特征在 Java 编程中可以通过一个包含变量属性 `color` 和 `bodyType` 的 `Car` 类，以及一个 `accelerate()`
    方法来表示。


    ![image](img/pg106_1.jpg)


    Java 被称为面向对象编程 (OOP) 语言，因为它大量使用对象的属性和行为来执行程序任务。


    Java 中通过定义类作为模板来创建对象，从该模板可以创建不同的副本，或“实例”。


    类的每个实例都可以通过分配属性值和行为进行自定义，以描述该对象。


    `Car` 类在对面描述的步骤中被创建为类模板——具有上述概述的默认属性和行为。`Car` 类的实例在此处描述的步骤中创建，继承了相同的默认属性和行为。


    ![image](img/1bl.jpg)开始一个名为“Car”的新模板类


    ```

    class Car

    {

    }

    ```


    ![image](img/java.jpg)


    FirstObject.java


    ![image](img/2bl.jpg)在 `Car` 类的大大括号之间，声明并初始化两个描述属性的全局 `String` 常量


    ```

    public final static String color = “Red” ;

    public final static String bodyType = “Coupe” ;

    ```


    ![image](img/3bl.jpg)添加一个描述行为的全局方法


    ```

    public static String accelerate()

    {

    String motion = “Accelerating...” ;

    return motion ;

    }

    ```


    ![image](img/4bl.jpg)在 `Car` 类之后，开始一个名为“FirstObject”的新程序类，包含标准的 main 方法


    ```

    class FirstObject

    {

    public static void main ( String[] args ) {     }

    }

    ```


    ![image](img/5bl.jpg)在 main 方法的大括号之间，插入语句以输出每个 `Car` 属性的值并调用其行为方法


    ```

    System.out.println( “Paint is “ + Car.color ) ;

    System.out.println( “Style is “ + Car.bodyType ) ;

    System.out.println( Car.accelerate() ) ;

    ```


    ![image](img/6bl.jpg)将程序保存为 `FirstObject.java`，然后编译并运行程序以查看输出


    ![image](img/pg107_1.jpg)


    ![image](img/forget.jpg)


    `static` 关键字声明类变量和类方法——在本例中，它们是 `Car`类的成员。


    ![image](img/hot.jpg)


    对象类通常在包含 main 方法的程序类之前创建。


    ## 创建对象实例


    每个类都有一个内置的“构造”方法，用于创建该类的新实例。构造方法与类名相同，并用 `new` 关键字调用。


    类的每个实例都继承对象的属性和行为。继承原理在整个 Java 中使用，使得程序可以使用现成的属性。


    为了更高的灵活性，对象类模板可以定义在包含程序的其他文件中。这意味着它们可以被多个程序轻松使用。


    ![image](img/1bl.jpg)开始一个新文件，重复上一个示例中此处所示的 `Car` 类对象模板


    ```

    class Car

    {

    public final static String color = “Red” ;

    public final static String bodyType = “Coupe” ;

    public static String accelerate()

    {

    String motion = “Accelerating...” ;

    return motion ;

    }

    }

    ```


    ![image](img/java.jpg)


    Car.java


    ![image](img/2bl.jpg)将文件保存为 `Car.java`


    ![image](img/3bl.jpg)开始一个名为“FirstInstance”的新程序，包含标准的 main 方法


    ```

    class FirstInstance

    {

    public static void main ( String[] args ) {     }

    }

    ```


    ![image](img/java.jpg)


    FirstInstance.java


    ![image](img/4bl.jpg)在 main 方法的大括号之间，插入语句以输出 `Car` 类每个属性的值并调用其行为方法


    ```

    System.out.println( “Car paint is “ + Car.color ) ;

    System.out.println( “style is “+ Car.bodyType ) ;

    System.out.println( Car.accelerate() ) ;

    ```


    ![image](img/5bl.jpg)现在，添加一条语句创建一个 `Car` 类的 `Porsche` 实例


    ```

    Car Porsche = new Car();

    ```


    ![image](img/6bl.jpg)添加语句输出每个 `Porsche` 属性并调用其行为方法


    ```

    System.out.println( “Car paint is “ + Porsche.color ) ;

    System.out.println( “style is “+ Porsche.bodyType ) ;

    System.out.println( Porsche.accelerate() ) ;

    ```


    ![image](img/7bl.jpg)将程序保存为 `FirstInstance.java` 并与 `Car.java` 文件一起，然后编译并运行程序查看输出


    ![image](img/pg109_1.jpg)


    ![image](img/forget.jpg)


    你无法直接访问 `motion` 变量——它是方法范围内的。虚拟 `Porsche` 类复制了原始 `Car` 类。这两个对象都包含静态“类变量”和一个“类方法”，使用类名和点符号进行访问——由于这些成员是全局可见的，这并不是良好的做法。


    虽然此示例演示了实例如何继承原始类的属性，但在下一个示例此处中得到了改进，它使用非静态成员创建“实例变量”和“实例方法”，这些无法从类外部访问——由于这些成员不是全局可见的，这被认为是良好的做法。


    ![image](img/hot.jpg)


    编译器会自动在外部 `.java` 文件中找到 `Car` 类，并为它创建一个编译后的 `.class` 文件。


    ## 封装属性


    在声明对象变量和方法可以使用 `private` 关键字来保护它们免受外部程序代码的操作。对象随后应包含 `public` 方法来检索值并调用方法。这种技术将变量和方法整齐地封装在对象结构中。以下步骤演示了之前的示例——但使用了封装的属性和方法：


    ![image](img/1bl.jpg)开始一个名为“Car”的新类


    ```

    class Car

    {

    }

    ```


    ![image](img/java.jpg)


    SafeInstance.java


    ![image](img/2bl.jpg)在类的大括号之间，声明三个私有的 `String` 变量来存储对象属性


    ```

    private String maker ;

    private String color ;

    private String bodyType ;

    ```


    ![image](img/3bl.jpg)添加一个描述行为的私有方法


    ```

    private String accelerate()

    {

    String motion = “Accelerating...” ;

    return motion ;

    }

    ```


    ![image](img/4bl.jpg)添加一个公共方法，将传递的参数值赋值给每个私有变量


    ```

    public void setCar( String brand , String paint , String style )

    {

    maker = brand ;

    color = paint ;

    bodyType = style ;

    }

    ```


