  trans: "\n\n本章演示了用于在 Java 程序中创建分支的各种关键字。\n\n### 使用 if 分支\n### 分支替代方案\n### 切换分支\n\
    ### for 循环\n### while true 真值循环\n### 执行 do-while 循环\n### 跳出循环\n### 返回控制权\n###\
    \ 总结\n\n#### 使用 if 分支\n\n`if` 关键字执行条件测试，以评估一个表达式的 `Boolean` 值。表达式随后的语句仅在评估结果为\
    \ `true` 时才会执行，否则程序将继续执行后续代码——即进入下一个“分支”。`if` 语句的语法如下：\n\n```\n![image](img/ycap.jpg)ifif\
    \ ( test-expression ) code-to-be-executed-when-true;\n```\n\n如果待执行的代码包含在大括号内以形成一个“语句块”，则它可以包含多个语句：\n\
    \n```\n![image](img/1g.jpg)创建一个名为“If” 的新程序，其中包含标准的 main 方法\nclass If {\n    public\
    \ static void main (String[] args) { }\n}\n```\n\n![image](img/java.jpg)\nIf.java\n\
    \n![image](img/2g.jpg)在 main 方法的大括号之间，插入这个简单的条件测试，当一个数字大于另一个数字时，将执行单条语句：\n\n```java\n\
    if ( 5 > 1 ) System.out.println( “Five is greater than one.” ) ;\n```\n\n![image](img/3g.jpg)添加第二个条件测试，当一个数字小于另一个数字时，执行整个语句块：\n\
    \n```java\nif ( 2 < 4 ) {\n    System.out.println( “Two is less than four.” )\
    \ ;\n    System.out.println( “Test succeeded.” ) ;\n}\n```\n\n![image](img/4g.jpg)将程序保存为\
    \ `If.java`，然后编译并运行程序以查看所有语句的执行——因为在这种情况下，两个测试的评估结果都为 `true`：\n\n```\n![image](img/pg44_1.jpg)\n\
    ![image](img/hot.jpg)\n```\n\n表达式可以使用 `true` 和 `false` 关键字。测试表达式 `( 2 < 4 )` 是\
    \ `( 2 < 4 == true )` 的简写。\n\n条件测试还可以评估复杂的表达式，以对 `Boolean` 值测试多个条件。圆括号包裹每个测试条件以建立优先级——因此它们会被优先评估。布尔运算符\
    \ `&&` AND（与）确保只有当两个测试条件都为 `true` 时，复杂的表达式才会返回 `true`：\n\n```java\nif ( ( test-condition1\
    \ ) && ( test-condition2 ) ) execute-this-code;\n```\n\n布尔运算符 `||` OR（或）确保只有当测试条件中的之一为\
    \ `true` 时，复杂的表达式才会返回 `true`：\n\n```java\nif ( ( test-condition1 ) || ( test-condition2\
    \ ) ) execute-this-code;\n```\n\n这些组合可以形成更长的复杂表达式：\n\n```\n![image](img/5g.jpg)在\
    \ If.java 的 main 方法中插入此行来声明并初始化一个名为 `num` 的整数变量\nint num = 8 ;\n```\n\n![image](img/6g.jpg)添加第三个条件测试，当变量\
    \ `num` 的值在指定范围内，或者它恰好等于某个指定值时，执行语句：\n\n```java\nif ( ( ( num > 5 ) && ( num <\
    \ 10 ) ) || ( num == 12 ) )\n    System.out.println( “Number is 6-9 inclusive,\
    \ or 12” ) ;\n```\n\n![image](img/7g.jpg)重新编译程序并再次运行，查看复杂表达式后的语句是否被执行：\n\n```\n\
    ![image](img/pg45_1.jpg)\n![image](img/8g.jpg)\n```\n\n更改赋值给 `num` 变量的值，使其既不在指定的\
    \ 6-9 范围内，也不恰等于 12。重新编译程序并再次运行，现在会看到复杂表达式后的语句没有被执行：\n\n```\n![image](img/hot.jpg)\n\
    ```\n\n可以使用 `>=` 和 `<=` 运算符将范围扩展到上限和下限。\n\n```\n![image](img/forget.jpg)\n```\n\
    \n复杂表达式使用相等运算符 `==` 来指定精确匹配，而不是赋值运算符 `=`。\n\n#### 分支替代方案\n\n`else` 关键字用于与 `if`\
    \ 关键字结合使用，创建 `if else` 语句，为程序提供可选的后续分支——取决于测试表达式的评估结果。在最简单的形式中，它仅仅在测试失败时指定一个备选语句执行：\n\
    \n```java\nif ( test-expression )\n    code-to-be-executed-when-true;\nelse\n\
    \    code-to-be-executed-when-false;\n```\n\n每个备选分支可以是单条语句，也可以是语句块。通过嵌套的 `if`\
    \ 语句可以构建更强大的 `if else` 语句。\n\n```\n![image](img/1g.jpg)创建一个名为“Else” 的新程序，其中包含标准的\
    \ main 方法\nclass Else {\n    public static void main (String[] args) { }\n}\n\
    ```\n\n![image](img/java.jpg)\nElse.java\n\n![image](img/2g.jpg)在 main 方法内部，插入此行来声明并初始化一个名为\
    \ `num` 的整数变量\n\n```java\nint num = 8 ;\n```\n\n![image](img/3g.jpg)添加此简单的条件测试，当变量\
    \ `num` 的值小于 13 时执行单条语句：\n\n```java\nif ( num < 13 ) {\n    System.out.println(\
    \ “Good morning: ” + num ) ;\n}\n```\n\n![image](img/4g.jpg)将程序保存为 `Else.java`，然后编译并运行程序查看语句的执行。注意第一个语句在\
    \ `else` 关键字之前通常以分号结束：\n\n```\n![image](img/pg47_1.jpg)\n```\n\n更改赋值给 `num` 变量的值为\
    \ 15，然后在 `if` 语句之后添加此备选分支：\n\n```java\nelse if ( num < 18 ) {\n    System.out.println(\
    \ “Good afternoon: ” + num ) ;\n}\n```\n\n![image](img/5g.jpg)有时最好提供一个最终的 `else`\
    \ 分支（无需嵌套 `if` 语句），以便在没有表达式评估为 `true` 时指定一个“默认”语句：\n\n```java\nelse System.out.println(\
    \ “Good evening: ” + num ) ;\n```\n\n![image](img/6g.jpg)更改赋值给 `num` 变量的值为 21，然后在\
    \ `if else` 语句末尾添加此默认分支以查看默认语句的执行：\n\n```\n![image](img/pg47.jpg)\n```\n\n条件分支是程序运行的基础过程。\n\
    \n#### 切换分支\n\n大量的 `if else` 语句为程序提供了许多分支，可能会变得臃肿。当测试表达式重复评估同一个变量值时，`switch` 语句通常提供更优雅的解决方案。\n\
    \n典型的 `switch` 语句语法如下：\n\n```java\nswitch ( test-variable )\n{\n    case value1\
    \ : code-to-be-executed-when-true; break;\n    case value2 : code-to-be-executed-when-true;\
    \ break;\n    case value3 : code-to-be-executed-when-true; break;\n    default\
    \ : code-to-be-executed-when-false;\n}\n```\n\n`switch` 语句的工作方式比较独特。它接收一个指定的变量，然后从多个\
    \ `case` 选项中寻找其赋值值。随后将执行与匹配值选项关联的语句。\n"
- fmt: "\nOptionally, a `switch` statement can include a final option using the `default`\
    \ keyword to specify statements to execute when no case options match the value\
    \ assigned to the specified variable.\n\nEach option begins with the `case` keyword\
    \ and a value to match. This is followed by a `:` colon character and the statements,\
    \ if any, to be executed when the match is made.\n\nIt is important to recognize\
    \ that the statement, or statement block, associated with each `case` option must\
    \ be terminated by the `break` keyword. Otherwise, the program will continue to\
    \ execute the statements of other `case` options after the matched option. Sometimes,\
    \ this is desirable to specify a number of `case` options that should each execute\
    \ the same statements if matched. For example, one statement for each block of\
    \ three options like this:\n\n```java\nswitch (test-variable)\n{\n    case value1:\
    \ case value2: case value3:\n        code-A-to-be-executed-when-true ; break ;\n\
    \    case value4: case value5: case value6:\n        code-B-to-be-executed-when-true\
    \ ; break ;\n}\n```\n\n![image](images/snake.jpg)\n\nMissing break keywords are\
    \ not syntax errors – ensure that all intended breaks are present in switch blocks\
    \ to avoid unexpected results.\n\n![image](images/1g.jpg)Start a new program named\
    \ “Switch” containing the standard main method\n\n```java\nclass Switch\n{\n \
    \   public static void main ( String[] args ) {\n    }\n}\n```\n\n![image](images/java.jpg)\n\
    \nSwitch.java\n\n![image](images/2g.jpg)Inside the main method, declare and initialize\
    \ three integer variables\n\n```java\nint month = 2, year = 2018, num = 31 ;\n\
    ```\n\n![image](images/3g.jpg)Add a switch statement block to test the value assigned\
    \ to the `month` variable\n\n```java\nswitch ( month )\n{\n}\n```\n\n![image](images/4g.jpg)Inside\
    \ the switch block, insert `case` options assigning a new value to the `num` variable\
    \ for months 4, 6, 9 and 11\n\n```java\ncase 4 : case 6 : case 9 : case 11 : num\
    \ = 30 ; break ;\n```\n\n![image](images/5g.jpg)Insert a `case` option assigning\
    \ a new value to the `num` variable for month 2, according to the `year` value\n\
    \n```java\ncase 2 : num = ( year % 4 == 0 ) ? 29 : 28 ; break ;\n```\n\n![image](images/6g.jpg)After\
    \ the switch block, at the end of the main method, add this line to output all\
    \ three integer values\n\n```java\nSystem.out.println( month+“/”+year+“: “+num+“days”\
    \ ) ;\n```\n\n![image](images/7g.jpg)Save the program as Switch.java then compile\
    \ and run the program to see the output.\n\n![image](images/pg49_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nNotice how all three integer variables are declared and initialized inline here\
    \ using convenient shorthand.\n\n![image](images/forget.jpg)\n\nThe conditional\
    \ operator is used to good effect in step 5. You can check back to [here](#chapter02.html_sec15)\
    \ to be reminded how it works.\n\n## Looping for\n\nA loop is a block of code\
    \ that repeatedly executes the statements it contains until a tested condition\
    \ is met – then the loop ends and the program proceeds on to its next task.\n\n\
    ![image](images/arrowg.jpg)\n\nThe most frequently-used loop structure in Java\
    \ programming employs the `for` keyword and has this syntax:\n\n```java\nfor (initializer\
    \ ; test-expression ; updater)\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\n```\n\nThe parentheses after the `for` keyword must contain three controls\
    \ that establish the performance of the loop:\n\n*   Initializer – assigns an\
    \ initial value to a counter variable, which will keep count of the number of\
    \ iterations made by this loop. The variable for this purpose may be declared\
    \ here, and it is traditionally a “trivial” integer variable named `i`.\n*   Test\
    \ expression – evaluated at the start of each iteration of the loop for a Boolean\
    \ `true` value. When the evaluation returns `true` the iteration proceeds but\
    \ when it returns `false` the loop is immediately terminated, without completing\
    \ that iteration.\n*   Updater – changes the current value of the counter variable,\
    \ started by the initializer, keeping the running total of the number of iterations\
    \ made by this loop. Typically, this will use `i++` for counting up, or `i--`\
    \ for counting down.\n\nThe code executed on each iteration of the loop can be\
    \ a single statement, a statement block, or even another “nested” loop.\n\nEvery\
    \ loop must, at some point, enable the test expression to return `false` – otherwise,\
    \ an infinite loop is created that will relentlessly execute its statements. Commonly,\
    \ the test expression will evaluate the current value of the counter variable\
    \ to perform a specified number of iterations. For example, with a counter `i`\
    \ initialized at one and incremented by one on each iteration, a test expression\
    \ of `i < 11` becomes false after 10 iterations – so that loop will execute its\
    \ statements 10 times before the loop ends.\n\n![image](images/hot.jpg)\n\nThe\
    \ updater is often referred to as the “incrementer” as it often increments, rather\
    \ than decrements, the counter variable. ![image](images/1g.jpg)Start a new program\
    \ named “For” containing the standard main method\n\n```java\nclass For\n{\n \
    \   public static void main ( String[] args ) {\n    }\n}\n```\n\n![image](images/java.jpg)\n\
    \nFor.java\n\n![image](images/2g.jpg)Inside the main method, declare and initialize\
    \ an integer variable to count the total number of iterations\n\n```java\nint\
    \ num = 0 ;\n```\n\n![image](images/3g.jpg)Add a `for` loop to perform three iterations\
    \ and display the current value of its counter variable `i` on each iteration\n\
    \n```java\nfor ( int i = 1 ; i < 4 ; i++)\n{\n    System.out.println( “Outer Loop=”\
    \ + i ) ;\n}\n```\n\n![image](images/4g.jpg)Inside the `for` block insert a nested\
    \ `for` loop to also perform three iterations, displaying the current value of\
    \ its counter variable `j` and total number of iterations\n\n```java\nfor ( int\
    \ j = 1 ; j < 4 ; j++)\n{\n    System.out.print( “tInner Loop j=” + j ) ;\n  \
    \  System.out.println( “t\\tTotal num=”++num) ) ;\n}\n```\n\n![image](images/5g.jpg)Save\
    \ the program as For.java then compile and run the program to see the output.\n\
    \n![image](images/pg51_1.jpg)\n\n![image](images/snake.jpg)\n\nThe increment `++`\
    \ and decrement `--` operators can prefix a variable, to change its value immediately,\
    \ or postfix the variable – so its value becomes changed when referenced. Try\
    \ changing the increment operators in this example to `++i` and `++j` to see the\
    \ difference.\n\n## Looping while true\n\nAn alternative loop structure to that\
    \ of the `for` loop, described [here](#chapter03.html_pg51), employs the `while`\
    \ keyword and has this syntax:\n\n```java\nwhile (test-expression)\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\n```\n\nLike the `for` loop, a `while` loop repeatedly executes the statements\
    \ it contains until a tested condition is met – then the loop ends and the program\
    \ proceeds on to its next task.\n\nThe test expression is evaluated at the start\
    \ of each iteration of the loop for a Boolean `true` value. When the evaluation\
    \ returns `true` the iteration proceeds but when it returns `false` the loop is\
    \ immediately terminated, without completing that iteration.\n\nNote that if the\
    \ test expression returns `false` when it is first evaluated, the loop statements\
    \ are never executed.\n"
  raw: 'Optionally, a **switch** statement can include a final option using the **default**
    keyword to specify statements to execute when no case options match the value
    assigned to the specified variable.


    Each option begins with the **case** keyword and a value to match. This is followed
    by a **:** colon character and the statements, if any, to be executed when the
    match is made.


    It is important to recognize that the statement, or statement block, associated
    with each **case** option must be terminated by the **break** keyword. Otherwise,
    the program will continue to execute the statements of other **case** options
    after the matched option. Sometimes, this is desirable to specify a number of
    **case** options that should each execute the same statements if matched. For
    example, one statement for each block of three options like this:


    **switch (** *test-variable* **)**


    **{**


    **case** *value1* **: case** *value2* **: case** *value3* **:**


    *code-A-to-be-executed-when-true* **; break ;**


    **case** *value4* **: case** *value5* **: case** *value6* **:**


    *code-B-to-be-executed-when-true* **; break ;**


    **}**


    ![image](images/snake.jpg)


    Missing break keywords are not syntax errors – ensure that all intended breaks
    are present in switch blocks to avoid unexpected results.


    ![image](images/1g.jpg)Start a new program named “Switch” containing the standard
    main method


    **class Switch**


    **{**


    **public static void main ( String[] args ) {          }**


    **}**


    ![image](images/java.jpg)


    Switch.java


    ![image](images/2g.jpg)Inside the main method, declare and initialize three integer
    variables


    **int month = 2, year = 2018, num = 31 ;**


    ![image](images/3g.jpg)Add a switch statement block to test the value assigned
    to the **month** variable


    **switch ( month )**


    **{**


    **}**


    ![image](images/4g.jpg)Inside the switch block, insert **case** options assigning
    a new value to the **num** variable for months 4, 6, 9 and 11


    **case 4 : case 6 : case 9 : case 11 : num = 30 ; break ;**


    ![image](images/5g.jpg)Insert a **case** option assigning a new value to the **num**
    variable for month 2, according to the **year** value


    **case 2 : num = ( year % 4 == 0 ) ? 29 : 28 ; break ;**


    ![image](images/6g.jpg)After the switch block, at the end of the main method,
    add this line to output all three integer values


    **System.out.println( month+“/”+year+“: “+num+“days” ) ;**


    ![image](images/7g.jpg)Save the program as **Switch.java** then compile and run
    the program to see the output


    ![image](images/pg49_1.jpg)


    ![image](images/hot.jpg)


    Notice how all three integer variables are declared and initialized inline here
    using convenient shorthand.


    ![image](images/forget.jpg)


    The conditional operator is used to good effect in step 5\. You can check back
    to [here](#chapter02.html_sec15) to be reminded how it works.


    **Looping for**


    A loop is a block of code that repeatedly executes the statements it contains
    until a tested condition is met – then the loop ends and the program proceeds
    on to its next task.


    ![image](images/arrowg.jpg)


    The most frequently-used loop structure in Java programming employs the **for**
    keyword and has this syntax:


    **for (** *initializer* **;** *test-expression* **;** *updater* **)**


    **{**


    *statements-to-be-executed-on-each-iteration* **;**


    **}**


    The parentheses after the **for** keyword must contain three controls that establish
    the performance of the loop:


    •Initializer – assigns an initial value to a counter variable, which will keep
    count of the number of iterations made by this loop. The variable for this purpose
    may be declared here, and it is traditionally a “trivial” integer variable named
    **i**.


    •Test expression – evaluated at the start of each iteration of the loop for a
    Boolean **true** value. When the evaluation returns **true** the iteration proceeds
    but when it returns **false** the loop is immediately terminated, without completing
    that iteration.


    •Updater – changes the current value of the counter variable, started by the initializer,
    keeping the running total of the number of iterations made by this loop. Typically,
    this will use **i++** for counting up, or **i--** for counting down.


    The code executed on each iteration of the loop can be a single statement, a statement
    block, or even another “nested” loop.


    Every loop must, at some point, enable the test expression to return **false**
    – otherwise, an infinite loop is created that will relentlessly execute its statements.
    Commonly, the test expression will evaluate the current value of the counter variable
    to perform a specified number of iterations. For example, with a counter **i**
    initialized at one and incremented by one on each iteration, a test expression
    of **i < 11** becomes false after 10 iterations – so that loop will execute its
    statements 10 times before the loop ends.


    ![image](images/hot.jpg)


    The updater is often referred to as the “incrementer” as it more often increments,
    rather than decrements, the counter variable


    ![image](images/1g.jpg)Start a new program named “For” containing the standard
    main method


    **class For**


    **{**


    **public static void main ( String[] args ) {          }**


    **}**


    ![image](images/java.jpg)


    For.java


    ![image](images/2g.jpg)Inside the main method, declare and initialize an integer
    variable to count the total overall number of iterations


    **int num = 0 ;**


    ![image](images/3g.jpg)Add a **for** loop to perform three iterations and display
    the current value of its counter variable **i** on each iteration


    **for ( int i = 1 ; i < 4 ; i++ )**


    **{**


    **System.out.println( “Outer Loop i=” + i ) ;**


    **}**


    ![image](images/4g.jpg)Inside the **for** loop block insert a nested **for** loop
    to also perform three iterations, displaying the current value of its counter
    variable **j** and total overall number of iterations


    **for ( int j = 1 ; j < 4 ; j++ )**


    **{**


    **System.out.print( “\tInner Loop j=” + j ) ;**


    **System.out.println( “\t\tTotal num=”+ (++num) ) ;**


    **}**


    ![image](images/5g.jpg)Save the program as **For.java** then compile and run the
    program to see the output


    ![image](images/pg51_1.jpg)


    ![image](images/snake.jpg)


    The increment **++** and decrement **--** operators can prefix a variable, to
    change its value immediately, or postfix the variable – so its value becomes changed
    when next referenced. Try changing the increment operators in this example to
    **++i** and **++j** to see the difference.


    **Looping while true**


    An alternative loop structure to that of the **for** loop, described [here](#chapter03.html_pg51)
    , employs the **while** keyword and has this syntax:


    **while (** *test-expression* **)**


    **{**


    *statements-to-be-executed-on-each-iteration* **;**


    **}**


    Like the **for** loop, a **while** loop repeatedly executes the statements it
    contains until a tested condition is met – then the loop ends and the program
    proceeds on to its next task.


    Unlike the **for** loop, the parentheses after the **while** keyword do not contain
    an initializer or updater for an iteration counter variable. This means that the
    test expression must evaluate some value that gets changed in the loop statements
    as the loop proceeds – otherwise, an infinite loop is created that will relentlessly
    execute its statements.


    The test expression is evaluated at the start of each iteration of the loop for
    a Boolean **true** value. When the evaluation returns **true** the iteration proceeds
    but when it returns **false** the loop is immediately terminated, without completing
    that iteration.


    Note that if the test expression returns **false** when it is first evaluated,
    the loop statements are never executed.'
