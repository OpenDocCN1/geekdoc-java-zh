    \ == 1 && j == 1 )\n{\n    System.out.println( “Continues outerLoop when i=” +i+\
    \ “ j=” +j ) ;\n    continue outerLoop ;\n}\n```\n\n![image](images/pg59_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nHere the `continue` statement halts all three\
    \ iterations of the inner loop‘s first run – by returning control to the outer\
