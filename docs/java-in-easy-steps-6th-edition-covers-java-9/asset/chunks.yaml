  trans: "\nJava 拥有海量的预测试代码包库，这些包以模块的形式组织。提供 Java 语言本身基础功能的代码包包含在 `java.base` 模块的\
    \ `java.lang` 包中。这些包可以被 Java API（应用程序接口）自动访问。这意味着在创建程序时，`java.lang` 包提供的属性和方法是随取随用的。例如，`java.base`\
    \ 模块中 `java.lang` 包的 `Math` 类 `abs()` 方法提供的数学功能。\n\n![image](img/new.jpg)\n\n\
    ## 模块\n模块是 Java 9 引入的新功能，旨在提高可扩展性并提升性能。\n\n包的内容按层次顺序排列，允许使用点符号表示法访问任何项。例如，`System`\
    \ 类包含一个 `out` 属性（字段），该属性又包含一个 `println()` 方法——因此可以通过 `System.out.println()` 进行访问。\n\
    \nJava 文档提供了每个可用项的信息，并可用于探索 Java 类。你可以在线 `docs.oracle.com/javase/9/docs/api` 获取，或者下载进行离线参考。文档显然非常大，但熟悉它非常有价值。一个很好的起点是\
    \ API 概述页面，该页面分三个部分列出了每个部分的每个模块列表，并附带每个模块的简要描述：\n\n![image](img/1o.jpg)启动网络浏览器并打开\
    \ `docs.oracle.com/javase/9/docs/api` 上的 API 概述页面\n\n![image](img/2o.jpg)查看每个部分按字母顺序列出的\
    \ `Modules`——向下滚动到“Java SE”部分找到 `java.base` 模块，然后点击其超链接\n\n![image](img/pg80_1.jpg)\n\
    \n![image](img/forget.jpg)\n\n你可以点击 `Frames` 链接查看文档的多面板视图。\n\n![image](img/3o.jpg)查看每个部分按字母顺序列出的模块的\
    \ `Packages`——向下滚动到“Exports”部分找到 `java.lang` 包，然后点击其超链接\n\n![image](img/pg81_1.jpg)\n\
    \n![image](img/4o.jpg)查看每个部分按字母顺序列出的包的 `Classes`——向下滚动页面到“Class Summary”部分找到 `Math`\
    \ 类，然后点击其超链接\n\n![image](img/pg81_2.jpg)\n\n![image](img/5o.jpg)在“Method Summary”部分按字母顺序列出类的\
    \ `Methods`——点击任何超链接以发现该方法的目的及其语法\n\n![image](img/pg81_3.jpg)\n\n![image](img/pg81_4.jpg)\n\
    \n![image](img/hot.jpg)\n\n你也可以使用搜索框来查找任何项的信息。\n\n![image](img/hot.jpg)\n\n检查页面菜单上其他项提供的可用信息，以更熟悉文档。\n\
    \n## 进行数学运算\n`java.lang` 包中的 `Math` 类提供了两个在执行数学计算时经常用的常量值。`Math.PI` 存储圆周率的值，而\
    \ `Math.E` 存储自然对数的底的值。这两个常量值都以 `double` 精度数据类型存储，并保留 15 位小数。\n\n![image](img/1o.jpg)创建一个名为“Pi”的新程序，其中包含标准\
    \ main 方法\n\n```java\nclass Pi {\n    public static void main ( String[] args\
    \ ) {\n    }\n}\n```\n\n![image](img/java.jpg)\nPi.java\n\n![image](img/2o.jpg)在\
    \ main 方法中，从命令行参数声明并初始化一个 `float` 变量，并将 `double Math.PI` 常量转换为第二个 `float` 变量\n\
    \n```java\nfloat radius = Float.parseFloat(args[0]);\nfloat shortPi = (float)\
    \ Math.PI;\n```\n\n![image](img/3o.jpg)使用转换后的值进行数学计算，将结果分配更多的 `float` 变量\n\n```java\n\
    float circ = shortPi * (radius + radius);\nfloat area = shortPi * (radius * radius);\n\
    ```\n\n![image](img/4o.jpg)输出 `Math.PI` 的值及其转换后的 `float` 等效值，随后输出计算结果\n\n```java\n\
    System.out.print( “With Pi commuted from “ + Math.PI );\nSystem.out.println( “\
    \ to ” + shortPi + “...” ) ;\nSystem.out.println( “A circle of radius “ + radius\
    \ + “ cm” ) ;\nSystem.out.printIn( “has a circumference of “ + circ + “ cm” )\
    \ ;\n```\n\n![image](img/5o.jpg)保存程序为 `Pi.java`，然后编译并运行程序查看输出\n\n![image](img/pg82.jpg)\n\
    \n![image](img/hot.jpg)\n\nPi 转换后的值通常提供了足够的精度。`java.lang` 包中的 `Math` 类提供了许多用于执行计算的方法。使用\
    \ `Math.pow()`，可以将给定数字提升指定的幂。`Math.sqrt()` 方法返回数字的平方根。\n\n```java\nclass Power\
    \ {\n    public static void main ( String[] args ) {\n    }\n}\n```\n\n![image](img/1o.jpg)创建一个名为“Power”的新程序，其中包含标准\
    \ main 方法\n\n![image](img/2o.jpg)在 main 方法中，从命令行参数声明并初始化一个 `int` 变量\n\n```java\n\
    int num = Integer.parseInt(args[0]);\n```\n\n![image](img/3o.jpg)进行数学计算，将结果转换为\
    \ `int` 变量\n\n```java\nint square = (int) Math.pow(num, 2);\nint cube = (int)\
    \ Math.pow(num, 3);\nint sqrt = (int) Math.sqrt(num);\n```\n\n![image](img/4o.jpg)输出计算结果\n\
    \n```java\nSystem.out.println(num + ” squared is ” + square);\nSystem.out.println(num\
    \ + ” cubed is ” + cube);\nSystem.out.println( “Square root of ” + sqrt);\n```\n\
    \n`java.lang` 包提供了三种将浮点数舍入整数的方法。其中最简单的是 `Math.round()` 方法，它将作为参数的数字向上或向下舍入到最近的整数。`Math.floor()`\
    \ 方法向下舍入到最近的整数，而 `Math.ceil()` 方法向上舍入到最近的整数。虽然 `Math.round()` 方法返回 `int` 数据类型，但\
    \ `Math.floor()` 和 `Math.ceil()` 方法都返回 `double` 数据类型。\n\n```java\nclass Round\
    \ {\n    public static void main ( String[] args ) {\n    }\n}\n```\n\n![image](img/1o.jpg)创建一个名为“Round”的新程序，其中包含标准\
    \ main 方法\n\n![image](img/2o.jpg)在 main 方法中，声明并初始化一个 `float` 变量\n\n```java\nfloat\
    \ num = 7.25f;\n```\n\n![image](img/3o.jpg)输出舍入后的 `float` 值作为 `int` 值\n\n```java\n\
    System.out.println(num + ” rounded is ” + Math.round(num));\n```\n\n![image](img/4o.jpg)输出舍入后的\
    \ `float` 值作为 `double` 值\n\n```java\nSystem.out.println(num + ” floored is ” +\
    \ Math.floor(num));\nSystem.out.println(num +“ ceiling is ” + Math.ceil(num));\n\
    ```\n\n默认情况下，`Math.round()` 会向上舍入——所以 7.5 会被舍入到 8。\n"
- fmt: "\nThe `Math` class within the `java.lang` package provides two methods to\
    \ compare two numerical values. The `Math.max()` method and the `Math.min()` method\
    \ each require two numbers to be stated as their arguments. `Math.max()` will\
    \ return the greater number and `Math.min()` will return the smaller number.\n\
    \nThe numbers to be compared can be of any numerical data type, but the result\
    \ will be returned as a `double` data type.\n\n![image](images/1o.jpg)Start a\
    \ new program named “Compare” containing the standard main method\n\n```java\n\
    class Compare\n{\n    public static void main ( String[] args ) { }\n}\n```\n\n\
    ![image](images/java.jpg)\n\nCompare.java\n\n![image](images/2o.jpg)Inside the\
    \ main method, declare and initialize a `float` variable and an `int` variable\n\
    \n```java\nfloat num1 = 24.75f ;\nint num2 = 25 ;\n```\n\n![image](images/3o.jpg)Output\
    \ the greater value\n\n```java\nSystem.out.println( “Most is “ + Math.max( num1,\
    \ num2 ) ) ;\n```\n\n![image](images/4o.jpg)Output the lesser value\n\n```java\n\
    System.out.println( “Least is “ + Math.min( num1, num2 ) ) ;\n```\n\n![image](images/5o.jpg)Save\
    \ the program as `Compare.java` then compile and run the program to see the output\n\
    \n![image](images/pg85_1.jpg)\n\n## Generating random numbers\n\nThe `Math` class\
    \ within the `java.lang` package provides the ability to generate random numbers\
    \ with its `Math.random()` method, which returns a `double` precision random number\
    \ between 0.0 and 0.999. Multiplying the random number will specify a wider range.\
    \ For example, multiplying by 10 will create a random number in the range of 0.0\
    \ to 9.999. Now rounding the random number up with `Math.ceil()` will ensure it\
    \ falls within the range of 1-10 inclusive.\n\n![image](images/1o.jpg)Start a\
    \ new program named “Random” containing the standard main method\n\n```java\n\
    class Random\n{\n    public static void main ( String[] args ) { }\n}\n```\n\n\
    ![image](images/java.jpg)\n\nRandom.java\n\n![image](images/2o.jpg)Inside the\
    \ main method, assign a random number to a `float` variable, and output its value\n\
    \n```java\nfloat random = (float) Math.random() ;\nSystem.out.println( “Random\
    \ number: “ + random ) ;\n```\n\n![image](images/3o.jpg)Assign a multiplication\
    \ of the random number to a second `float` variable, and output its value\n\n\
    ```java\nfloat multiplied = random * 10 ;\nSystem.out.println( “Multiplied number:\
    \ “ + multiplied ) ;\n```\n\n![image](images/4o.jpg)Assign a rounded integer of\
    \ the multiplied random number to an `int` variable, and output its value\n\n\
    ```java\nint randomInt = (int) Math.ceil( multiplied ) ;\nSystem.out.println(\
    \ “Random Integer: “ + randomInt ) ;\n```\n\n![image](images/5o.jpg)Save the program\
    \ as `Random.java` then compile and run the program to see the output\n\n![image](images/pg86_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe Lottery program described opposite combines\
    \ all three steps from this example into a single statement.\n\nA sequence of\
    \ six non-repeating random numbers within the range 1-59 inclusive can be generated\
    \ using `Math.random()` to produce a random lottery selection.\n\n![image](images/1o.jpg)Start\
    \ a new program named “Lottery” containing the standard main method\n\n```java\n\
    class Lottery\n{\n    public static void main ( String[] args ) { }\n}\n```\n\n\
    ![image](images/java.jpg)\n\nLottery.java\n\n![image](images/2o.jpg)Inside the\
    \ main method, create an `int` array of 60 elements, then fill elements 1-59 with\
    \ integers 1-59\n\n```java\nint[] nums = new int[60] ;\nfor( int i = 1 ; i < 60\
    \ ; i++ ) { nums[i] = i ; }\n```\n\n![image](images/3o.jpg)Shuffle the values\
    \ in elements 1-59\n\n```java\nfor( int i = 1 ; i < 60 ; i++ )\n{\n    int r =\
    \ (int) Math.ceil( Math.random() * 59 ) ;\n    int temp = nums[i] ;\n    nums[i]\
    \ = nums[r] ;\n    nums[r] = temp ;\n}\n```\n\n![image](images/4o.jpg)Output only\
    \ those values contained in elements 1-6\n\n```java\nfor ( int i = 1 ; i < 7 ;\
    \ i++ )\n{\n    System.out.print( Integer.toString( nums[i]) + “ “ ) ;\n}\n```\n\
    \n![image](images/5o.jpg)Save the program as `Lottery.java` then compile it and\
    \ run the program three times\n\n![image](images/pg85_1.jpg)\n\nThe Lottery program\
    \ described opposite combines all three steps from this example into a single\
    \ statement.\n\nA sequence of six non-repeating random numbers within the range\
    \ 1-59 inclusive can be generated using `Math.random()` to produce a random lottery\
    \ selection. (Wait, I noticed the user text repeated some sections, I will follow\
