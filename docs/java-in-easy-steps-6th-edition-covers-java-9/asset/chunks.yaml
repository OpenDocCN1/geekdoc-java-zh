    FileReader file = new FileReader( “Oscar.txt” ) ;\n```\n\n![image](images/5v.jpg)Create\
    \ a `BufferedReader` object to read the file\n\n```java\nBufferedReader buffer\
    \ = new BufferedReader( file ) ;\n```\n\n![image](images/6v.jpg)Add a loop to\
    \ read the text file contents into the variable and output each line of text\n\
    \n```java\nwhile ( ( line = buffer.readLine() ) != null ) {\n    System.out.println(\
    \ line ) ;\n}\n```\n\n![image](images/7v.jpg)Remember to close the `BufferedReader`\
    \ object when it is no longer needed\n\n```java\nbuffer.close() ;\n```\n\n![image](images/8v.jpg)Save\
    \ the program as `ReadFile.java` alongside the text file, then compile and run\
    \ the program to see the output\n"
