    \ ;\n}\n```\n\n![image](img/5v.jpg)将程序保存为 `ListFiles.java`，并带上包含一些文件的“data”文件夹，然后编译并运行程序以查看输出列出的文件名\n\
    \n![image](img/pg117_1.jpg)\n\n### 读取控制台输入\n\n`java.io` 包允许程序从命令行读取输入——与用户进行交互。就像\
    \ `System.out` 字段可以将输出发送到命令行一样，`System.in` 字段可以配合 `InputStreamReader` 对象从命令行读取内容。这以字节形式读取输入，并将其转换为代表\
    \ Unicode 字符值的整数值。\n\n为了读取整行输入文本，`BufferedReader` 对象的 `readLine()` 方法会读取由 `InputStreamReader`\
    \ 解码的字符。该方法必须在 `try catch` 语句内部调用，以捕获任何 `IOException` 问题。\n\n通常，`readLine()` 方法会将输入赋值给\
    \ `String` 变量，以便程序处理。\n\n![image](img/1v.jpg)启动新程序，导入所有 `java.io` 类的功能\n\n```java\n\
    import java.io.* ;\n```\n\n![image](img/java.jpg)\n\nReadString.java\n\n![image](img/2v.jpg)添加一个名为“ReadString”的类，包含标准的\
    \ main 方法\n\n```java\nclass ReadString {\n    public static void main( String[]\
    \ args ) { }\n}\n```\n\n![image](img/3v.jpg)在 main 方法的大括号之间，插入一条语句来提示用户输入\n\n\
    ```java\nSystem.out.print( “Enter the title of this book: “ ) ;\n```\n\n![image](img/4v.jpg)添加一条创建\
    \ `InputStreamReader` 对象的语句，能够从命令行读取输入\n\n```java\nInputStreamReader isr = new\
    \ InputStreamReader( System.in ) ;\n```\n\n![image](img/5v.jpg)创建一个 `BufferedReader`\
    \ 对象来读取解码后的输入\n\n```java\nBufferedReader buffer = new BufferedReader( isr ) ;\n\
    ```\n\n![image](img/6v.jpg)声明并初始化一个空的 `String` 变量，用于存储输入\n\n```java\nString input\
    \ = ““ ;\n```\n\n![image](img/7v.jpg)添加一个 `try catch` 语句从命令行读取输入并存储在变量中\n\n```java\n\
    try {\n    input = buffer.readLine() ;\n    buffer.close() ;\n} catch ( IOException\
    \ e ) {\n    System.out.println( “An input error has occurred” ) ;\n}\n```\n\n\
    ![image](img/8v.jpg)输出包含存储值的的消息\n\n```java\nSystem.out.println( “\\nThanks, you\
    \ are reading “ + input ) ;\n```\n\n![image](img/9v.jpg)将程序保存为 `ReadString.java`，然后编译并运行程序\n\
    \n![image](img/pg119_1.jpg)\n\n![image](img/10v.jpg)按照提示输入文本，然后按回车键查看包含你输入文本输出的消息\n\
    \n![image](img/pg119_2.jpg)\n\n![image](img/hot.jpg)\n\n在不再需要 `BufferedReader`\
    \ 对象时调用其 `close()` 方法是一个良好的习惯。\n\n### 读取文件\n\n`java.io` 包包含一个名为 `FileReader` 的类，专门用于读取文本文件。该类是\
    \ `InputStreamReader` 类的子类，可读取文本文件。\n\n![image](img/1v.jpg)打开编辑器（如记事本），并写几行文本——例如奥斯卡·王德华《奥丁监狱歌》中一段著名的诗句\n\
    \n![image](img/pg120_1.jpg)启动新程序，导入所有 `java.io` 类的功能\n\n```java\nimport java.io.*\
    \ ;\n```\n\n![image](img/java.jpg)\n\nReadFile.java\n\n![image](img/2v.jpg)添加一个名为“ReadFile”的类，包含标准的\
    \ main 方法\n\n```java\nclass ReadFile {\n    public static void main( String[]\
    \ args ) { }\n}\n```\n\n![image](img/3v.jpg)在 main 方法的大括号之间，插入一个 `try catch` 语句\n\
    \n```java\ntry {\n} catch ( IOException e ) {\n    System.out.println( “A read\
    \ error has occurred” ) ;\n}\n```\n\n![image](img/4v.jpg)在 `try` 块的大括号之间，插入一条语句创建一个\
    \ `FileReader` 对象\n\n```java\nFileReader file = new FileReader( “Oscar.txt” )\
    \ ;\n```\n\n![image](img/5v.jpg)创建一个 `BufferedReader` 对象来读取文件\n\n```java\nBufferedReader\
    \ buffer = new BufferedReader( file ) ;\n```\n\n![image](img/6v.jpg)添加一个循环将文本文件内容读取到变量并输出每行文本\n\
    \n```java\nwhile ( ( line = buffer.readLine() ) != null ) {\n    System.out.println(\
    \ line ) ;\n}\n```\n\n![image](img/7v.jpg)记住不再需要时关闭 `BufferedReader` 对象\n\n```java\n\
    buffer.close() ;\n```\n\n![image](img/8v.jpg)将程序保存为 `ReadFile.java` 与文本文件放在一起，然后编译并运行程序以查看输出\n\
    \n"
- fmt: "\nThe `BufferedWriter` object is created with the `new` keyword, and takes\
    \ the name of the `FileWriter` object as its argument. Text can then be written\
    \ with the `write()` method of the `BufferedWriter` object, and lines separated\
    \ by calling its `newLine()` method. These methods should be called from within\
    \ a `try catch` statement to catch any `IOException` problems that may arise.\n\
    \nIf a file of the specified name already exists, its contents will be overwritten\
    \ by the `write()` method, otherwise a new file of that name will be created and\
    \ its contents written.\n\n![image](images/1v.jpg)Start a new program that imports\
    \ the functionality of all the `java.io` classes\n\n```java\nimport java.io.*\
    \ ;\n```\n\n![image](images/java.jpg)\n\nWriteFile.java\n\n![image](images/2v.jpg)Add\
    \ a class named “WriteFile” containing the standard main method\n\n```java\nclass\
    \ WriteFile {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](images/3v.jpg)Between\
    \ the curly brackets of the main method, insert a `try catch` statement\n\n```java\n\
    try {\n}\ncatch ( IOException e ) {\n    System.out.println( “A write error has\
    \ occurred” ) ;\n}\n```\n\n![image](images/4v.jpg)Between the curly brackets of\
    \ the `try` block, insert a statement to create a `FileWriter` object for a text\
    \ file named “Tam.txt”\n\n```java\nFileWriter file = new FileWriter( “Tam.txt”\
    \ ) ;\n```\n\n![image](images/5v.jpg)Create a `BufferedWriter` object to write\
    \ the file\n\n```java\nBufferedWriter buffer = new BufferedWriter( file ) ;\n\
    ```\n\n![image](images/6v.jpg)Add statements to write lines of text and newline\
    \ characters into the text file – for example, a translated verse from “Tam O’Shanter”\
    \ by Robert Burns\n\n```java\nbuffer.write( “The wind blew as if it had blown\
    \ its last” ) ;\nbuffer.newLine() ;\nbuffer.write( “The rattling showers rose\
    \ on its blast” ) ;\nbuffer.newLine() ;\nbuffer.write( “The speedy gleams the\
    \ darkness swallowed” ) ;\nbuffer.newLine() ;\nbuffer.write( “Loud, deep and long\
    \ the thunder bellowed” ) ;\nbuffer.newLine() ;\nbuffer.write( “That night a child\
    \ might understand” ) ;\nbuffer.newLine() ;\nbuffer.write( “The devil had business\
    \ on his hand.” ) ;\n```\n\n![image](images/7v.jpg)Remember to close the `BufferedWriter`\
    \ object when it is no longer needed\n\n```java\nbuffer.close() ;\n```\n\n![image](images/8v.jpg)Save\
    \ the program as `WriteFile.java` then compile and run the program to write the\
    \ text file alongside the program\n\n![image](images/pg123_1.jpg)\n\n![image](images/pg123_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nYou can call the `append()` method of the `BufferedWriter`\
    \ object to add text – rather than overwriting text with the `write()` method.\n\
    \n### Sorting array elements\n\nJava contains a package named `java.util` that\
    \ provides useful utilities for handling collections of data. The package can\
    \ be made available to a program by including an `import` statement at the very\
    \ beginning of the `.java` file. This can use the wildcard character to mean “all\
    \ classes” in the statement `import java.util.* ;`.\n\nThe `java.util` package\
    \ has a class named “Arrays” that has methods which can be used to manipulate\
    \ arrays. Its functionality can be made available to the program by importing\
    \ all classes from the `java.util` package or, where the program only requires\
    \ a single class, the `import` statement can import just that specific class.\
    \ For example, the program can import the `Arrays` class with the statement `import\
    \ java.util.Arrays ;`.\n\nThe `Arrays` class has a `sort()` method that can rearrange\
    \ the contents of array elements alphabetically and numerically.\n\n![image](images/1v.jpg)Start\
    \ a new program that imports the functionality of all methods in the `java.util.Arrays`\
    \ class\n\n```java\nimport java.util.Arrays ;\n```\n\n![image](images/java.jpg)\n\
    \nSort.java\n\n![image](images/2v.jpg)Add a class named “Sort” containing the\
    \ standard main method\n\n```java\nclass Sort {\n    public static void main(\
    \ String[] args ) { }\n}\n```\n\n![image](images/3v.jpg)After the main method,\
    \ insert a method to display all element contents of a passed `String` array\n\
    \n```java\npublic static void display( String[] elems ) {\n    System.out.println(\
    \ “\\nString Array:” ) ;\n    for ( int i = 0 ; i < elems.length ; i++ )\n   \
    \     System.out.println( “Element ”+i+“ is ”+elems[i] ) ;\n}\n```\n\n![image](images/4v.jpg)Add\
    \ an overloaded version of the `display()` method to display all element contents\
    \ of a passed `int` array\n\n```java\npublic static void display( int[] elems\
    \ ) {\n    System.out.println( “\\nInteger Array:” ) ;\n    for ( int i = 0 ;\
    \ i < elems.length ; i++ )\n        System.out.println( “Element ”+i+“ is ”+elems[i]\
    \ ) ;\n}\n```\n\n![image](images/hot.jpg)\n\nSee [here](#chapter06.html_pg99)\
    \ for more on overloading methods.\n\n![image](images/5v.jpg)Between the curly\
    \ brackets of the main method, declare and initialize a `String` array and an\
    \ `int` array\n\n```java\nString[] names = { “Mike” , “Dave” , “Andy” } ;\nint[]\
    \ nums = { 200 , 300 , 100 } ;\n```\n\n![image](images/6v.jpg)Output the contents\
    \ of all elements in each array\n\n```java\ndisplay( names ) ;\ndisplay( nums\
    \ ) ;\n```\n\n![image](images/7v.jpg)Sort the element contents of both arrays\n\
    \n```java\nArrays.sort( names ) ;\nArrays.sort( nums ) ;\n```\n\n![image](images/8v.jpg)Output\
    \ the contents of all elements in each array\n\n```java\ndisplay( names ) ;\n\
    display( nums ) ;\n```\n\n![image](images/9v.jpg)Save the program as `Sort.java`\
    \ then compile and run the program to see the output\n\n![image](images/pg125_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nThe `for` loops in this example each a single\
    \ statement so no brackets are required – but they could be added for clarity.\n\
    \n### Making array lists\n\nThe `java.util` package contains a class named `ArrayList`\
    \ that stores data in an ordered “Collection” (resizable sequence) of list elements.\
    \ This can be made available to the program by importing the specific class `util.ArrayList`.\
    \ A list may contain duplicate elements, and an `ArrayList` object has useful\
    \ methods that allow manipulation of stored values by specifying their element\
    \ index. For example, the list’s method call `get(0)` will retrieve the value\
    \ stored in the first element whereas `remove(1)` will remove the second list\
    \ element.\n\nElement values can be modified by specifying the index number and\
    \ new value as arguments to the list’s `set()` method. Elements can be added to\
    \ the list at a particular position by specifying the index number and value as\
    \ arguments to the list’s `add()` method. The list expands to accommodate additional\
    \ elements by moving the element values along the index.\n\n![image](images/hot.jpg)\n\
    \nYou can discover how many elements a list currently has by calling its `size()`\
    \ method.\n\nAn `ArrayList` object is simply created using the `new` keyword but,\
    \ like other Java collections, the statement must specify which generic type of\
    \ item the list may contain. Typically, a list may contain `String` items, so\
    \ `ArrayList` must have a `<String>` suffix.\n\nCollections, such as `ArrayList`,\
    \ have a `forEach()` method that iterates over each element in the list. This\
    \ makes it easy to loop through all items contained in the list.\n\nEach stored\
    \ list item can be conveniently referenced in turn by specifying a “lambda expression”\
    \ as the argument to the `forEach()` method. Lambda expressions are simply short,\
    \ anonymous (un-named) methods that can be specified in the location they are\
    \ to be executed. They begin with parentheses, to contain any arguments, then\
    \ have a `->` character sequence followed by the statement block\n\nThe data type\
    \ of the arguments can be explicitly declared, or it can be inferred from the\
    \ context – `(String x)` can be simply `(x)`. Additionally, the curly brackets\
    \ can be omitted if the lambda expression statement block contains only one statement.\n"
