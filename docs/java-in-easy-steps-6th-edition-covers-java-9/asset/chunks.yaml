    当输入到 `JTextArea` 组件的文本超过其初始大同时，组件将扩展以容纳这些文本。要使组件具有具有滚动能力的固定大小，可以将其放置在 `JScrollPane`
    容器中。这可以通过 `new` 关键字创建，并并以 `JTextArea` 的名称作为其参数。


