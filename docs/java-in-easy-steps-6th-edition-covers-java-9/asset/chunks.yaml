    ### Compiling & running programs


    Before a Java program can run, it must first be compiled into a `class` file by
    the Java compiler. This is located in Java’s `bin` sub-directory, and is an application
    named `javac`. The instructions [here](#chapter01.html_pg11) described how to
    add the `bin` sub-directory to the system path so that `javac` can be invoked
    from any system location.


    Follow these steps to compile the program [here](#chapter01.html_pg13) :


    ![image](images/1b.jpg)Open a command-line window, then navigate to the directory
    where you saved the `Hello.java` source code file


    ![image](images/2b.jpg)Type `javac` followed by a space then the full name of
    the source code file `Hello.java` and hit the `Enter` key


    ![image](images/pg14_1.jpg)


    ![image](images/hot.jpg)


    On Windows use the Windows PowerShell app or the older Command Prompt app to provide
    a command-line prompt, and on Linux use a Terminal window.


    ![image](images/hot.jpg)


    At a prompt type `javac` and hit Return to reveal the Java compiler options.


    If the `javac` compiler discovers errors in the code it will halt and display
    a helpful report indicating the nature of the error – see [here](#chapter01.html_sec9)
    for troubleshooting problems.


    If the `javac` compiler does not find any errors it will create a new file with
    the program name and the `.class` file extension.


    ![image](images/pg14_2.jpg)


    ![image](images/hot.jpg)


    You can also compile the source code from another location if you state the file’s
    full path address to the javac compiler – in this case, `C:\MyJava\Hello.java`


    When the Java compiler completes compilation, the command-line prompt window focus
    returns to the prompt without any confirmation message – and the program is ready
    to run.


    The Java program interpreter is an application named `java` that is located in
    Java’s `bin` sub-directory – alongside the `javac` compiler. As this directory
    was previously added to the system path, [here](#chapter01.html_pg11), the `java`
    interpreter can be invoked from any location.


