    \ ;\nforecast += “\\tMonday\\t\\t69F\\t57F\\tSunny\\n” ;\nforecast += “\\tTuesday\\\
    t\\t71F\\t50F\\tCloudy\\n” ;\n```\n\n![image](img/4r.jpg)现在，添加此行来输出两个格式化的 `String`\
    \ 值\n\n```java\nSystem.out.print( header + forecast ) ;\n```\n\n![image](img/5r.jpg)将程序保存为\
    \ `Escape.java`，然后编译并运行该程序\n\n![image](img/pg39_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n在这种情况下，转义序列添加了换行，因此这里使用了 `print()` 方法——而不是在输出后自动添加换行的 `println()` 方法。\n\n###\
    \ 使用位操作\n\n在本章前面描述的普通运算符外，Java 还提供了用于二进制算术的特殊运算符。这些运算符的使用频率低于其他运算符，但在此简要讨论是为了让大家了解它们的存在。\n\
    \nJava “位”运算符可以与 `int` 整数数据类型一起使用，用于操作值的二进制表示位。这需要理解二进制计数，其中一个字节中的八位表示从 0 到 255\
    \ 的十进制值。例如，\n\n53 是二进制 `00110101`\n\n(`0` x 128, `0` x 64, `1` x 32, `1` x 16,\
    \ `0` x 8, `1` x 4, `0` x 2, `1` x 1)。\n\n二进制加法运算像十进制算术一样进行：\n\n| | 53 | = | `00110101`\
    \ |\n| :--- | :--- | :--- | :--- |\n| `+` | 7 | = | `00000111` |\n| | 60 | = |\
    \ `00111100` |\n\n下列出的位运算符允许在二进制算术中执行更专门的操作。\n\n| 运算符: | 操作: | 示例: | 结果: |\n|\
    \ :--- | :--- | :--- | :--- |\n| `&` | 与 (AND) | `a & b` | 如果两个位都为 1 则为 1 |\n\
    | `\\|` | 或 (OR) | `a \\| b` | 如果任意一个位为 1 则为 1 |\n| `^` | 异或 (XOR) | `a ^ b` |\
    \ 如果两个位不同则为 1 |\n| `~` | 非 (NOT) | `~a` | 反反位 |\n| `<<` | 左移 | `n << p` | 将 `n`\
    \ 左移动 `p` 位 |\n| `>>` | 右移 | `n >> p` | 将 `n` 右移动 `p` 位 |\n\n例如，在二进制算术中使用位运算符\
    \ `&`：\n\n|| | 53 | = | `00110101` |\n| :--- | :--- | :--- | :--- |\n| `&` | 7\
    \ | = | `00000111` |\n\n"
- fmt: "\nThis chapter demonstrates the various keywords that are used to create branching\
    \ in Java programs.\n\n### [Branching with if](#chapter03.html_sec20)\n### [Branching\
    \ alternatives](#chapter03.html_sec21)\n### [Switching branches](#chapter03.html_sec22)\n\
    ### [Looping for](#chapter03.html_sec23)\n### [Looping while true](#chapter03.html_sec24)\n\
    ### [Doing do-while loops](#chapter03.html_sec25)\n### [Breaking out of loops](#chapter03.html_sec26)\n\
    ### [Returning control](#chapter03.html_sec27)\n### [Summary](#chapter03.html_sec28)\n\
    \n#### Branching with if\n\nThe `if` keyword performs a conditional test to evaluate\
    \ an expression for a `Boolean` value. A statement following the expression will\
    \ only be executed when the evaluation is `true`, otherwise the program proceeds\
    \ on to subsequent code – pursuing the next “branch”. The `if` statement syntax\
    \ looks like this:\n\n```\n![image](images/ycap.jpg)ifif ( test-expression ) code-to-be-executed-when-true;\n\
    ```\n\nThe code to be executed can contain multiple statements if they are enclosed\
    \ within curly brackets to form a “statement block” :\n\n```\n![image](images/1g.jpg)Start\
    \ a new program named “If” containing the standard main method\nclass If {\n \
    \   public static void main (String[] args) { }\n}\n```\n\n![image](images/java.jpg)\n\
    If.java\n\n![image](images/2g.jpg)Between the curly brackets of the main method,\
    \ insert this simple conditional test that executes a single statement when one\
    \ number is greater than another\n\n```java\nif ( 5 > 1 ) System.out.println(\
    \ “Five is greater than one.” ) ;\n```\n\n![image](images/3g.jpg)Add a second\
    \ conditional test, which executes an entire statement block when one number is\
    \ less than another\n\n```java\nif ( 2 < 4 ) {\n    System.out.println( “Two is\
    \ less than four.” ) ;\n    System.out.println( “Test succeeded.” ) ;\n}\n```\n\
    \n![image](images/4g.jpg)Save the program as `If.java` then compile and run the\
    \ program to see all statements get executed – because both tests evaluate as\
    \ `true` in this case:\n\n```\n![image](images/pg44_1.jpg)\n![image](images/hot.jpg)\n\
    ```\n\nExpressions can utilize the `true` and `false` keywords. The test expression\
    \ `( 2 < 4 )` is shorthand for `( 2 < 4 == true )`.\n\nA conditional test can\
    \ also evaluate a complex expression to test multiple conditions for a `Boolean`\
    \ value. Parentheses enclose each test condition to establish precedence – so\
    \ they get evaluated first. The Boolean `&&` AND operator ensures the complex\
    \ expression will only return `true` when both tested conditions are true:\n\n\
    ```java\nif ( ( test-condition1 ) && ( test-condition2 ) ) execute-this-code;\n\
    ```\n\nThe Boolean `||` OR operator ensures a complex expression will only return\
    \ `true` when either one of the tested conditions is true:\n\n```java\nif ( (\
    \ test-condition1 ) || ( test-condition2 ) ) execute-this-code;\n```\n\nA combination\
    \ of these can form longer complex expressions:\n\n```\n![image](images/5g.jpg)Inside\
    \ the main method of If.java insert this line to declare and initialize an integer\
    \ variable named `num`\nint num = 8 ;\n```\n\n![image](images/6g.jpg)Add a third\
    \ conditional test that executes a statement when the value of the `num` variable\
    \ is within a specified range, or when it’s exactly equal to a specified value\n\
    \n```java\nif ( ( ( num > 5 ) && ( num < 10 ) ) || ( num == 12 ) )\n    System.out.println(\
    \ “Number is 6-9 inclusive, or 12” ) ;\n```\n\n![image](images/7g.jpg)Recompile\
    \ the program, and run it once more to see the statement after the complex expression\
    \ get executed\n\n```\n![image](images/pg45_1.jpg)\n![image](images/8g.jpg)\n\
    ```\n\nChange the value assigned to the `num` variable so it is neither within\
    \ the specified range 6-9, or exactly 12. Recompile the program, and run it again\
    \ to now see the statement after the complex expression is not executed\n\n```\n\
    ![image](images/hot.jpg)\n```\n\nThe range can be extended to include the upper\
    \ and lower limits using the `>=` and `<=` operators.\n\n```\n![image](images/forget.jpg)\n\
    ```\n\nThe complex expression uses the `==` equality operator to specify an exact\
    \ match, not the `=` assignment operator.\n\n#### Branching alternatives\n\nThe\
    \ `else` keyword is used in conjunction with the `if` keyword to create `if else`\
    \ statements that provide alternative branches for a program to pursue – according\
    \ to the evaluation of a tested expression. In its simplest form, this merely\
    \ nominates an alternative statement for execution when the test fails:\n\n```java\n\
    if ( test-expression )\n    code-to-be-executed-when-true;\nelse\n    code-to-be-executed-when-false;\n\
    ```\n\nEach alternative branch may be a single statement or a block of statements.\
    \ More powerful `if else` statements can be constructed with nested `if` statements.\n\
    \n```\n![image](images/1g.jpg)Start a new program named “Else” containing the\
    \ standard main method\nclass Else {\n    public static void main (String[] args)\
    \ { }\n}\n```\n\n![image](images/java.jpg)\nElse.java\n\n![image](images/2g.jpg)Inside\
    \ the main method, insert this line to declare and initialize an integer variable\
    \ named `num`\n```java\nint num = 8 ;\n```\n\n![image](images/3g.jpg)Add this\
    \ simple conditional test that executes a single statement when the value of the\
    \ `num` variable is below 13\n\n```java\nif ( num < 13 ) {\n    System.out.println(\
    \ “Good morning: ” + num ) ;\n}\n```\n\n![image](images/4g.jpg)Save the program\
    \ as `Else.java` then compile and run the program to see the statement executed\
    \ Notice that the first statement is terminated with a semicolon, as usual, before\
    \ the `else` keyword.\n\n```\n![image](images/pg47_1.jpg)\n```\n\nChange the value\
    \ assigned to the `num` variable to 15, then add this alternative branch right\
    \ after the `if` statement\n\n```java\nelse if ( num < 18 ) {\n    System.out.println(\
    \ “Good afternoon: ” + num ) ;\n}\n```\n\n![image](images/5g.jpg)It is sometimes\
    \ desirable to provide a final `else` branch, without a nested `if` statement,\
    \ to specify a “default” statement to be executed when no expression evaluates\
    \ as `true`:\n\n```java\nelse System.out.println( “Good evening: ” + num ) ;\n\
    ```\n\n![image](images/6g.jpg)Change the value assigned to the `num` variable\
    \ to 21, then add this default branch to the end of the `if else` statement to\
    \ see the default statement executed\n\n```\n![image](images/pg47.jpg)\n```\n\n\
    Conditional branching is the fundamental process by which computer programs proceed.\n\
    \n#### Switching branches\n\nLengthy `if else` statements, which offer many conditional\
    \ branches for a program to pursue, can become unwieldy. Where the test expressions\
    \ repeatedly evaluate the same variable value, a more elegant solution is often\
    \ provided by a `switch` statement.\n\nThe syntax of a typical `switch` statement\
    \ looks like this:\n\n```java\nswitch ( test-variable )\n{\n    case value1 :\
    \ code-to-be-executed-when-true; break;\n    case value2 : code-to-be-executed-when-true;\
    \ break;\n    case value3 : code-to-be-executed-when-true; break;\n    default\
    \ : code-to-be-executed-when-false;\n}\n```\n\nThe `switch` statement works in\
    \ an unusual way. It takes a specified variable then seeks to match its assigned\
    \ value from among a number of `case` options. Statements associated with the\
    \ option whose value matches are then executed.\n"
  raw: '***This chapter demonstrates the various keywords that are used to create
    branching in Java programs.***


    [**Branching with if**](#chapter03.html_sec20)


    [**Branching alternatives**](#chapter03.html_sec21)


    [**Switching branches**](#chapter03.html_sec22)


    [**Looping for**](#chapter03.html_sec23)


    [**Looping while true**](#chapter03.html_sec24)


