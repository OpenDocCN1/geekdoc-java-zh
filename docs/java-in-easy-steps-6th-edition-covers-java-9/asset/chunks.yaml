    Create a `JTextArea` object five lines high


    ```java

    JTextArea txtArea = new JTextArea( 5 , 37 ) ;

    ```


    ![image](images/4b.jpg)


    Add a `JScrollPane` object – to contain the `JTextArea` created in Step 3, above


