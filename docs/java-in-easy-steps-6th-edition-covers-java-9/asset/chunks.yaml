    ![image](images/pg23_3.jpg)


    •Cause – the variable **text** has no value.


    •Solution – in the variable declaration assign the variable a valid **String**
    value, for instance **= “success”**, then save the file.


    ![image](images/pg23_4.jpg)


    ![image](images/snake.jpg)


    You must run the program from within its directory – you cannot use a path address
    as the Java launcher requires a program name, not a file name.


    **Summary**


    •Java is both a programming language and a runtime platform.


    •Java programs are written as plain text files with a **.java** file extension.


    •The Java compiler **javac** creates compiled **.class** program files from original
    **.java** source code files.


    •The Java interpreter **java** executes compiled programs using an instance of
    the Java Virtual Machine.


    •The Java VM is available on many operating system platforms.


    •Adding Java’s **bin** sub-directory to the system **PATH** variable allows the
    **javac** compiler to be invoked from anywhere.


    •Java is a case-sensitive language.


    •The standard **main** method is the entry point for Java programs.


    •The **System.out.println()** statement outputs text.


    •A Java program file name must exactly match its class name.


    •Java variables can only be named in accordance with specified naming conventions,
    and must avoid the Java keywords.


    •In Java programming, each statement must be terminated by a semicolon character.


    •The most common Java data types are **String**, **int**, **char**, **float**
    and **boolean**.


    •**String** values must be enclosed in double quotes; **char** values in single
    quotes; and **float** values must have an “f” suffix.


    •The **final** keyword can be used to create a constant variable.


    •Comments can be added to Java source code between **/*** and ***/**, on one or
    more lines, or after **//** on a single line.


    •Error reports identify compiler and runtime problems.


    2


    **Performing operations**


    ***This chapter demonstrates the various operators that are used to create expressions
    in Java programs.***


    [**Doing arithmetic**](#chapter02.html_sec11)


    [**Assigning values**](#chapter02.html_sec12)


    [**Comparing values**](#chapter02.html_sec13)


    [**Assessing logic**](#chapter02.html_sec14)


    [**Examining conditions**](#chapter02.html_sec15)


    [**Setting precedence**](#chapter02.html_sec16)


    [**Escaping literals**](#chapter02.html_sec17)


    [**Working with bits**](#chapter02.html_sec18)


    [**Summary**](#chapter02.html_sec19)


    **Doing arithmetic**


    Arithmetical operators, listed in the table below, are used to create expressions
    in Java programs that return a single resulting value. For example, the expression
    **4 * 2** returns the value **8**.


    | **Operator:** | **Operation:** |


    | **+** | Addition (and concatenates **String** values) |


    | **-** | Subtraction |


    | ***** | Multiplication |


    | **/** | Division |


    | **%** | Modulus |


    | **++** | Increment |


    | **--** | Decrement |


    ![image](images/snake.jpg)


    Division of **int** values will truncate any fractional part. For example, 11/4
    = 2, whereas division of **float** values 11/4 = 2.75.


    The increment operator **++** and decrement operator **--** return the result
    of modifying a single given operand by a value of one. For example, **4++** returns
    the value **5,** and **4--** returns the value **3**.


    All other arithmetic operators return the result of an operation performed on
    two given operands, and act as you would expect. For example, the expression **5
    + 2** returns **7**.


    The modulus operator divides the first operand by the second operand and returns
    the remainder of the operation. For example, **32 % 5** returns **2** – five divides
    into 32 six times, with 2 remainder.


    The operation performed by the addition operator + depends on the type of its
    given operands. Where both operands are numeric values it will return the total
    sum value of those numbers, but where the operands are **String** values it will
    return a single concatenated **String** – combining the text in each **String**
    operand. For example, **“Java ”** + **“Arithmetic”** returns **“Java Arithmetic”**.


    ![image](images/hot.jpg)


    Increment and decrement operators are typically used to count the iterations in
    the **for** loop constructs, introduced [here](#chapter03.html_sec23) .


    Follow these steps to explore the Java arithmetic operators in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type **jshell**
    and hit the **Enter** key to launch the Java shell


    ![image](images/2r.jpg)Next, enter statements to initialize three variables


    **int num = 100 ; int factor = 20 ; int sum = 0 ;**


    ![image](images/pg27_1.jpg)


    ![image](images/3r.jpg)Next, separately enter statements to perform addition and
    subtraction operations, displaying each result


    **sum = num + factor ;**


    **sum = num - factor ;**


    ![image](images/pg27_2.jpg)


    ![image](images/4r.jpg)Now, separately enter statements to perform multiplication
    and division operations, displaying each result


    **sum = num * factor ;**


    **sum = num / factor ;**


    ![image](images/pg27_3.jpg)


    ![image](images/forget.jpg)


    Java must be installed on your system path to launch the Java shell from any prompt
    – see Installing [here](#chapter01.html_pg11) and Troubleshooting [here](#chapter01.html_sec9)
    for details.


    ![image](images/new.jpg)


    The Java shell **jshell** is a new feature in Java 9\. Optionally, the semicolon
    character may be omitted at the end of single statements entered into the shell
    but these are required when writing Java programs for compilation. Semicolons
    are included in the shell examples in this chapter to aid code consistency.


