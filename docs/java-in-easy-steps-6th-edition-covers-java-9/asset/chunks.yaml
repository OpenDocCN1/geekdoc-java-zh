    \ `/***` 和 `***/**` 之间（跨一行或多行），或者在单行的 `//` 之后。\n•错误报告识别编译器和运行时问题。\n\n2\n\n## 执行操作\n\
    \n*本章演示了用于在 Java 程序创建表达式的各种运算符。*\n\n算术运算\n\n赋值值\n\n比较值\n\n评估逻辑\n\n判断条件\n\n设置优先级\n\
    \n转义字面量\n\n位运算\n\n总结\n\n### 算术运算\n\n下表所示的算术运算符用于在 Java 程序创建返回单个值的表达式。\n\n| **运算符:**\
    \ | **操作:** |\n| :--- | :--- |\n| `+` | 加法（并连接 `String` 值） |\n| `-` | 减法 |\n|\
