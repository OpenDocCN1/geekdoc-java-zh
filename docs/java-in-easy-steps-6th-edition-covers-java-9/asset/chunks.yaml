    The buttons respond graphically when they are clicked, but will not perform an
    action until the program provides an event-handler method to respond to each click
    event.


    Where the program is intended for deployment in a single Java archive (JAR), image
    resources must be loaded by a `ClassLoader` object before creating the `ImageIcon`
    objects to represent them.


    Specifying the resource file name or path to the `getResource()` method of a `ClassLoader`
    returns a `URL`, which can be used as the argument to the `ImageIcon` constructor.
    The `java.net` package provides a useful `URL` class to which these may first
    be assigned.


    ![image](images/6b.jpg)Before the `Buttons()` constructor, create a `ClassLoader`
    object


    ```

    ClassLoader ldr = this.getClass().getClassLoader() ;

    ```


    ![image](images/7b.jpg)Load the URLs of the image resources


    ```

    java.net.URL tickURL = ldr.getResource( “Tick.png” ) ;

    java.net.URL crossURL = ldr.getResource( “Cross.png” ) ;

    ```


    ![image](images/8b.jpg)Edit the `ImageIcon()` constructors in Step 2 opposite
    to use URLs


    ```

    ImageIcon tick = new ImageIcon( tickURL ) ;

    ImageIcon cross = new ImageIcon( crossURL ) ;

    ```


    ![image](images/9b.jpg)Save the changes then recompile and re-run the program
    – it will run as before but can now be deployed in a JAR


    ![image](images/hot.jpg)


    Notice how the `getClass()` method and `this` keyword are used here to reference
    this class object.


    ### Adding labels


    The Swing `JLabel` class creates a label component that can be added to a graphical
    interface. This can be used to display non-interactive text or image, or both
    text and an image.


    The `JLabel` object is created with the `new` keyword, and its constructor takes
    a `String` argument specifying text to be displayed on that label, or the name
    of an `ImageIcon` object representing an image to display. It can also take three
    arguments to specify text, image, and horizontal alignment as a `JLabel` constant
    value. For example, `JLabel( “text”, img, JLabel.CENTER )` aligns centrally.


    Where a `JLabel` object contains both text and an image, the relative position
    of the text can be determined by specifying a `JLabel` constant as the argument
    to `setVerticalPosition()` and `setHorizontalPosition()` methods of the `JLabel`
    object.


    Additionally, a `JLabel` object can be made to display a ToolTip when the cursor
    hovers over, by specifying a text `String` as the argument to that object’s `setToolTipText()`
    method.


    ![image](images/1b.jpg)Edit a copy of `Window.java` from [here](#chapter08.html_pg135)
    , changing the class name in the declaration, the constructor, and the instance
    statement from “Window” to “Labels”


    ![image](images/java.jpg)


    Labels.java


    ![image](images/2b.jpg)Before the `Labels()` constructor, create an `ImageIcon`
    object


    ```

    ImageIcon duke = new ImageIcon( “Duke.png” ) ;

    ```


    ![image](images/3b.jpg)Next, create three `JLabel` objects to display an image,
    text, and both text and an image respectively


    ```

    JLabel lbl1 = new JLabel( duke ) ;

    JLabel lbl2 = new JLabel( “Duke is the friendly mascot of Java technology.” )
    ;

    JLabel lbl3 = new JLabel( “Duke” , duke , JLabel.CENTER ) ;

    ```


    ![image](images/4b.jpg)Inside the `Labels()` constructor, insert this statement
    to create a ToolTip for the first label


    ```

    lbl1.setToolTipText( “Duke - the Java Mascot” ) ;

    ```


    ![image](images/5b.jpg)Add these two statements to align the text centrally below
    the third label


    ```

    lbl3.setHorizontalPosition( JLabel.CENTER ) ;

    lbl3.setVerticalPosition( JLabel.BOTTOM ) ;

    ```


    ![image](images/6b.jpg)Now, add three statements to add the `JLabel` components
    to the `JPanel` container


    ```

    pnl.add( lbl1 ) ;

    pnl.add( lbl2 ) ;

    pnl.add( lbl3 ) ;

    ```


    ![image](images/7b.jpg)Save the program as `Labels.java` then compile and run
    the program, placing the cursor over the first label


    ![image](images/pg137_1.jpg)


    ![image](images/pg137_2.jpg)


    ![image](images/forget.jpg)


    `JLabel` alignment constants include `LEFT`, `CENTER`, `RIGHT`, `TOP` and `BOTTOM`.


    Where the program is intended for deployment in a single Java archive (JAR), image
    resource must be loaded by a `ClassLoader` object before creating the `ImageIcon`
    object to represent it.


    ![image](images/8b.jpg)Before the `Labels()` constructor, create a `ClassLoader`
    object


    ```

    ClassLoader ldr = this.getClass().getClassLoader() ;

    ```


    ![image](images/9b.jpg)Edit the `ImageIcon()` constructors in Step 2 opposite
    to load the URL of the image resource using the `ClassLoader` object


    ```

    ImageIcon duke = new ImageIcon( ldr.getResource( “Duke.png” ) ) ;

    ```


    ![image](images/10b.jpg)Save the changes then recompile and re-run the program
    – it will run as before but can now be deployed in a JAR


    ![image](images/hot.jpg)


    ### Adding text fields


    The Swing `JTextField` class creates a single-line text field component that can
    be added to a graphical interface. This can be used to display editable text,
    and allows the user to enter text to interact with the program.


    The `JTextField` object is created with the `new` keyword, and its constructor
    can take a `String` argument specifying default text to be displayed in that field.
    In this case, the component will be sized to accommodate the length of the `String`.
    Alternatively, the argument may be a numeric value to specify the text field size.
    The constructor can also take two arguments, specifying both default text and
    the text field size.


    Use the `JPasswordField` class instead of the `JTextField` class where input characters
    are needed to be not visible.


    A multiple-line text field can be created with the `JTextArea` class, whose constructor
    takes two numerical arguments specifying its number of lines and its width. Alternatively,
    three arguments can be supplied specifying default text, line number, and width.
    Text can be made to wrap at word endings within this field by specifying `true`
    as the argument to the `setLineWrap()` method and `setWrapStyleWord()` method
    of the `JTextArea` object.

