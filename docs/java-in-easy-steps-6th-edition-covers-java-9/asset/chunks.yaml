  trans: "\n\n![image](img/3g.jpg)\n最后，在事件处理器块中，从 `Lotto.java` 程序的事件处理器中复制代码（详见此处），该代码将输出六个唯一的随机数。\n\
    \n```java\nint[ ] nums = new int[ 60 ] ; String str = “ ” ;\nfor ( int i = 1 ;\
    \ i < 60 ; i++ ) { nums[ i ] = i ; }\nfor ( int i = 1 ; i < 60 ; i++ ) {\n   \
    \ int r= ( int ) ( 59 * Math.random( ) ) + 1 ;\n    int t= nums[ i ] ; nums[ i\
    \ ]= nums[ r ] ; nums[ r ]= t ;\n}\nfor ( int i = 1 ; i < 7 ; i++ ) {\n    str\
    \ += “ ” + Integer.toString( nums[ i ] ) + “ ” ;\n}\ntxt.setText( str ) ;\n```\n\
    \n![image](img/forget.jpg)\n\n在这种情况下，代码不需要检查调来源，因为事件处理器已通过 `activity_main.xml`\
    \ 中的 `android:onClick` 属性显式地分配给按钮。\n\n现在 Lotto 应用已经具备了所有的资源、控件和功能代码，可以尝试构建项目：\n\
    \n![image](img/4g.jpg)\n在 Android Studio 主工具栏上，点击 `View`、`Tool Windows`、`Messages`\
    \ 以打开“Messages”窗口。\n\n![image](img/5g.jpg)\n然后，点击 `Build`、`Make Project`（或按快捷键\
    \ `Ctrl + F9`）开始构建。\n\n![image](img/6g.jpg)\n“Messages”窗口将很快显示成功确认，或者报告任何需要修复的错误。\n\
    \n![image](img/pg181_1.jpg)\n\n![image](img/7g.jpg)\n如有必要，修复报告的错误，然后重新构建，直到看到成功确认。\n\
    \n![image](img/hot.jpg)\n\n如果构建尝试失败，请查看代码中的红色灯泡图标——Android Studio 添加了这些图标，以便你轻松找到并纠正错误。\n\
    \n### 测试应用程序\n\n一旦应用程序项目构建成功，就可以进行测试了。测试可以在通过 USB 接口连接到计算机真实 Android 设备上进行，也可以在\
    \ Android 虚拟设备（AVD）模拟器上进行。AVD 允许你测试应用在系列设备上的性能，但它们消耗更多的系统资源且速度可能缓慢。应用程序应该至少在一个手机设备和一个平板设备上测试：\n\
    \n![image](img/1g.jpg)\n点击 `Run`、`Run ‘app’`（或按快捷键 `Shift + F10`）打开“选择部署目标目标”对话框。\n\
    \n![image](img/pg182_1.jpg)\n\n![image](img/2g.jpg)\n选择一个 AVD 手机模拟器进行连接，然后点击 `OK`\
    \ 在模拟器上安装 Lotto 应用。\n\n![image](img/pg182_2.jpg)\n\n![image](img/3g.jpg)\n点击运行按钮，查看\
    \ `TextView` 内容在这个小设备屏幕上不理想的换行。\n\n![image](img/4g.jpg)\n编辑 `activity_main.xml`\
    \ 以减小字体大小 `android:textSize=”32sp”`。\n\n![image](img/5g.jpg)\n点击 `Build`、`Rebuild\
    \ Project` 以应用更改，然后在模拟器中再次运行应用以查看解决方案。\n\n![image](img/pg182_3.jpg)\n\n![image](img/pg182_4.jpg)\n\
    \n![image](img/snake.jpg)\n\n创建每个 AVD 模拟器可能需要下载大型系统镜像文件。你可能更喜欢在真实的 Android 设备上进行测试。还要注意，加速模拟器仅在计算机\
    \ CPU 支持硬件虚拟化（Intel VT-x 或 AMD SVM）时才会运行。\n\n![image](img/hot.jpg)\n\nAndroid\
    \ Studio 具有 Instant Run 功能，可以自动更新应用的更改，使其更快地出现在测试设备上。\n\n![image](img/forget.jpg)\n\
    \n在真实设备上测试比在模拟器更好。理想情况下，在最终部署应用之前，你应该在尽可能不同的设备上进行测试。\n\n![image](img/6g.jpg)\n\
    拿一个 Android 平板电脑，在 `Settings`、`Developer Options` 菜单中开启“USB 调试”。\n\n![image](img/7g.jpg)\n\
    通过 USB 端口将平板连接到计算机显示此通知。\n\n![image](img/pg183_1.jpg)\n\n![image](img/8g.jpg)\n\
    点击 `Run`、`Run ‘app’`（或按快捷键 `Shift + F10`）打开“选择部署目标”对话框。\n\n![image](img/pg183_2.jpg)\n\
    \n![image](img/9g.jpg)\n选择已连接的平板设备，然后点击 `OK` 在平板上安装 Lotto 应用。\n\n![image](img/10g.jpg)\n\
    点击运行按钮，查看 Lotto 应用按预期运行——一次成功的测试。\n\n![image](img/pg183_3.jpg)\n\n![image](img/pg183_4.jpg)\n\
    \n![image](img/pg183_5.jpg)\n\n测试过程提供了一个应用程序启动器，这样平板就可以断开连接，并通过点击启动图标启动应用。\n\n"
