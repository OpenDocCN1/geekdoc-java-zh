    **}**


    ![image](images/3b.jpg)Before the main method, create a **JPanel** container object


    **JPanel pnl = new JPanel( ) ;**


    ![image](images/4b.jpg)Next, insert this constructor method to specify window
    requirements and to add the **JPanel** object to the **JFrame**


    **public Window()**


    **{**


    **super( “Swing Window” ) ;**


    **setSize( 500 , 200 ) ;**


    **setDefaultCloseOperation( EXIT_ON_CLOSE ) ;**


    **add( pnl ) ;**


    **setVisible( true ) ;**


    **}**


    ![image](images/5b.jpg)Create an instance of the Window class by inserting this
    line into the main method


    **Window gui = new Window() ;**


    ![image](images/6b.jpg)Save the program as **Window.java** then compile and run
    the program to see the basic window appear


    ![image](images/pg135_1.jpg)


    ![image](images/pg135_2.jpg)


    ![image](images/forget.jpg)


    The **EXIT_ON_CLOSE** operation is a constant member of the **JFrame** class.
    It exits the program when the window gets closed.


    ![image](images/hot.jpg)


    Notice how the **add()** method is used here to add the **JPanel** object to the
    **JFrame** window.


    **Adding push buttons**


    The Swing **JButton** class creates a push-button component that can be added
    to a graphical interface. This lets the user interact with the program by clicking
    on a button to perform an action.


    The **JButton** object is created with the **new** keyword, and its constructor
    takes a **String** argument specifying text to be displayed on that button.


    Images can appear on buttons too. An **ImageIcon** object must first be created
    to represent the image, specifying the image file name as the argument to its
    constructor. Typically, the image will be located alongside the program but the
    argument can include the path for images outside the local directory.


    ![image](images/hot.jpg)


    Details of how to create event-handler methods to respond to user actions, such
    as a button click, can be found in the next chapter.


    Specify the name of the **ImageIcon** object as the argument to the **JButton**
    constructor to display that image on the button, or specify a **String** and **ImageIcon**
    as its two arguments to display both text and the image.'
