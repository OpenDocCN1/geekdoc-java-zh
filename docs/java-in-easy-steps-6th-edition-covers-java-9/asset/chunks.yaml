    arguments to the list’s **set()** method. Elements can be added to the list at
    a particular position by specifying the index number and value as arguments to
    the list’s **add()** method. The list expands to accommodate additional elements
    by moving the element values along the index.


    ![image](images/hot.jpg)


    You can discover how many elements a list currently has by calling its **size()**
    method.


    An **ArrayList** object is simply created using the **new** keyword but, like
    other Java collections, the statement must specify which generic type of item
    the list may contain. Typically, a list may contain **String** items, so **ArrayList**
    must have a **<String>** suffix.


    Collections, such as **ArrayList**, have a **forEach()** method that iterates
    over each element in the list. This makes it easy to loop through all items contained
    in the list.


    Each stored list item can be conveniently referenced in turn by specifying a “lambda
    expression” as the argument to the **forEach()** method. Lambda expressions are
    simply short, anonymous (un-named) methods that can be specified in the location
    they are to be executed. They begin with parentheses, to contain any arguments,
    then have a **->** character sequence followed by the statement block, with this
    syntax:


    **( *argument/s* ) -> { *statement/s* }**


    The data type of the arguments can be explicitly declared, or it can be inferred
    from the context – **(String x)** can be simply **(x)**. Additionally, the curly
    brackets can be omitted if the lambda expression statement block contains only
