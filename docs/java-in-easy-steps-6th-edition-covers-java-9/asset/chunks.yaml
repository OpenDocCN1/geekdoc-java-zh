    \ `Compare.java`，然后编译并运行程序以查看输出\n\n![image](img/pg85_1.jpg)\n\n## 生成随机数\n\n`java.lang`\
    \ 包中的 `Math` 类通过其 `Math.random()` 方法提供了生成随机数的能力，该方法返回 0.0 到 0.999 之间的双精度随机数。通过乘以该随机数可以指定更宽的范围。例如，乘以\
    \ 10 将创建一个 0.0 到 9.999 之间的随机数。现在使用 `Math.ceil()` 将随机数向上取整，将确保它落在 1-10（包含）范围内。\n\
    \n![image](img/1o.jpg)创建一个名为“Random”的新程序，其中包含标准的 main 方法\n\n```java\nclass Random\n\
    {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](img/java.jpg)\n\
    \nRandom.java\n\n![image](img/2o.jpg)在 main 方法中，将随机数赋值给一个 `float` 变量，并输出它的值\n\n\
    ```java\nfloat random = (float) Math.random() ;\nSystem.out.println( “Random number:\
    \ “ + random ) ;\n```\n\n![image](img/3o.jpg)将随机数的乘积赋值给第二个 `float` 变量，并输出它的值\n\
    \n```java\nfloat multiplied = random * 10 ;\nSystem.out.println( “Multiplied number:\
