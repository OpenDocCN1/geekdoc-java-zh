- fmt: "\n```java\nbox.add( lbl1 ) ; box.add( lbl2 ) ; box.add( lbl3 ) ;\n```\n![image](images/9b.jpg)\n\
    Then, add the layout container to the `JPanel` container\n\n```java\npnl.add(\
    \ box ) ;\n```\n\n![image](images/10b.jpg)Save the program as `Custom.java` then\
    \ compile and run the program to see the effect\n\n![image](images/pg149_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nIn this case, the custom color is equivalent to\
    \ `Color.RED` as the RGB value specifies the maximum red value with no green or\
    \ blue.\n\n![image](images/hot.jpg)\n\nA `Box` object is a handy lightweight container\
    \ that uses `BoxLayout` as its layout manager. The `Box` object’s `createVerticalBox()`\
    \ method individually displays its components from top to bottom.\n\n### Summary\n\
    \n- The `javax.swing` package contains the Java Swing classes that are used to\
    \ create GUI components.\n- A window is created as a top-level `JFrame` container.\n\
    - The `JFrame` constructor should specify the window’s title, size, default close\
    \ operation and visibility.\n- A `JPanel` container displays smaller components\
    \ in a wrapping line using its default `FlowLayout` layout manager.\n- The `JButton`\
    \ constructor can specify text and images to be displayed on a push button component.\n\
    - An `ImageIcon` object represents an image to use in the program.\n- Programs\
    \ that are to be deployed as a single Java archive (JAR) should use a `ClassLoader`\
    \ object to specify an image source.\n- A `JLabel` object displays non-interactive\
    \ text and image content.\n- Editable text can be displayed in `JTextField` and\
    \ `JTextArea` fields.\n- A `JScrollPane` object provides scrollbars for a `JTextArea`\
    \ field.\n- Items for selection can be displayed with `JCheckBox`, `JComboBox`\
    \ and `JList` components.\n- A `ButtonGroup` object logically groups a number\
    \ of `JRadioButton` components so only one can be selected.\n- Specific RGB colors\
    \ can be represented by the `Color` class of the `java.awt` package.\n- The `java.awt`\
    \ package has a `Font` class that can be used to create objects representing a\
    \ particular font name, style, and size.\n- Multiple `JPanel` containers can be\
    \ added to a `JFrame` container by using the `Container` class of the `java.awt`\
    \ package to represent the content pane of the `JFrame`.\n- When creating a `JPanel`\
    \ container object, its argument may optionally specify a layout manager.\n\n\
    9\n\n### Recognizing events\n\n*This chapter demonstrates how to create Java program\
    \ event-handlers that respond to user interface actions.*\n\n- [Listening for\
    \ events](#chapter09.html_sec74)\n- [Generating events](#chapter09.html_sec75)\n\
    - [Handling button events](#chapter09.html_sec76)\n- [Handling item events](#chapter09.html_sec77)\n\
    - [Reacting to keyboard events](#chapter09.html_sec78)\n- [Responding to mouse\
    \ events](#chapter09.html_sec79)\n- [Announcing messages](#chapter09.html_sec80)\n\
    - [Requesting input](#chapter09.html_sec81)\n- [Summary](#chapter09.html_sec82)\n\
    \n### Listening for events\n\nA user can interact with a program that provides\
    \ a graphical user interface (GUI) by performing actions with a mouse, keyboard,\
    \ or other input device. These actions cause “events” to occur in the interface,\
    \ and making a program respond to them is known as “event-handling”.\n\nFor a\
    \ program to recognize user events it needs to have one or more `EventListener`\
    \ interfaces added from the `java.awt.event` package. These can be made available\
    \ to the program by adding an initial statement to `import java.awt.event.* ;`.\n\
    \nThe desired `EventListener` interface can be included in the class declaration\
    \ using the `implements` keyword. For example, a class declaration to listen for\
    \ button clicks might look like this:\n\n```java\nclass Click extends JFrame implements\
    \ ActionListener { }\n```\n\nThe Java documentation describes many `EventListener`\
    \ interfaces that can listen out for different events, but the most common ones\
    \ are listed in the table below, together with a brief description:\n\n| EventListener:\
    \ | Description: |\n| :--- | :--- |\n| `ActionListener` | Recognizes action events\
    \ that occur when a push button is pushed or released |\n| `ItemListener` | Recognizes\
    \ item events that occur when a list item gets selected or deselected |\n| `KeyListener`\
    \ | Recognizes keyboard events that occur when the user presses or releases a\
    \ key |\n| `MouseListener` | Recognizes mouse button actions that occur when the\
    \ user presses or releases a mouse button, and when the mouse enters or exits\
    \ a component |\n| `MouseMotionListener` | Recognizes motion events that occur\
    \ when the user moves the mouse |\n\n![image](images/hot.jpg)\n\nMultiple EventListeners\
    \ can be included after the `implements` keyword as a comma-separated list.\n\n\
    ### Generating events\n\nComponents need to generate events that the `EventListener`\
    \ interfaces can recognize if they are to be useful. Having added the appropriate\
    \ `EventListener` to the program, as described opposite, an event generator must\
    \ be added to the component.\n\nFor example, in order to have the program respond\
    \ to a button click, the `ActionListener` interface is added to the program and\
    \ the button’s `addActionListener()` method must be called, specifying the `this`\
    \ keyword as its argument. This makes the button generate an event when it gets\
    \ clicked.\n\nStatements creating a button that generates events look like this:\n\
    \n```java\nJButton btn = new JButton( “Click” ) ;\nbtn.addActionListener( this\
    \ ) ;\n```\n\nWhen the user clicks a button that generates an event, the `ActionListener`\
    \ interface recognizes the event and seeks an event-handler method within the\
    \ program to execute a response.\n\nEach `EventListener` interface has an associated\
    \ event-handler method that is called when an event is recognized. For example,\
    \ when a button gets clicked, the `ActionListener` interface calls an associated\
    \ method named `actionPerformed()` and passes an `ActionEvent` object as its argument.\n\
    \nThe `ActionEvent` object contains information about the event and the source\
    \ component from where it originated. Mostfully, it has a `getSource()` method\
    \ that identifies the object that generated the event. This can be used to create\
