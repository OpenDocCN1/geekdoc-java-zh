    ### Adding selectors


    The Swing `JCheckBox` class creates a checkbox component that can be added to
    a graphical interface. This can be used to allow the user to select or deselect
    individual items.


    The `JCheckBox` object is created with the `new` keyword, and its constructor
    takes a `String` argument specifying text to be displayed alongside that checkbox.
    It can also take a second `true` argument to make the checkbox selected by default.


    A choice of items can be offered by the `JComboBox` class that creates a drop-down
    list from which the user can select any single item. This object is created with
    the `new` keyword, and its constructor typically takes a `String` array as its
    argument. Each element in the array provides an item for selection in the drop-down
    list.


    Similarly, a choice of items can be offered by the `JList` class that creates
    a fixed-size list from which the user can select one or more items. It is created
    with the `new` keyword, and its constructor also takes an array as its argument,
    with each element providing an item for selection. As both `JList` and `JComboBox`
    are Collections they must specify the generic type they contain such as `<String>`.


    ![image](images/1b.jpg)


    Edit a copy of `Window.java` from [here](#chapter08.html_pg135), changing the
    class name in the declaration, the constructor, and the instance statement from
    “Window” to “Items”


    ![image](images/java.jpg)


    Items.java


    ![image](images/2b.jpg)


    Before the `Items()` constructor, create a `String` array of items for selection


    ```java

    String[] toppings = { “Pepperoni” , “Mushroom” , “Ham” , “Tomato” };

    ```


    ![image](images/3b.jpg)


    Next, create four `JCheckBox` objects to present each array item for selection
    – with one selected by default


    ```java

    JCheckBox chk1 = new JCheckBox( toppings[0] ;

    JCheckBox chk2 = new JCheckBox( toppings[1] , true ) ;

    JCheckBox chk3 = new JCheckBox( toppings[2] ) ;

    JCheckBox chk4 = new JCheckBox( toppings[3] ) ;

    ```


    ![image](images/4b.jpg)


    Add a second `String` array of items for selection


    ```java

    String[] styles = { “Deep Dish” , “Gourmet Style” , “Thin & Crispy” };

    ```


    ![image](images/5b.jpg)


    Create a `JComboBox` object to present each item in the second array for selection


    ```java

    JComboBox<String> box1 = new JComboBox<String>( styles ) ;

    ```


    ![image](images/6b.jpg)


    Add a `JList` object to present each item in the first array for selection from
    a list


    ```java

    JList<String> lst1 = new JList<String>( toppings ) ;

    ```


    ![image](images/7b.jpg)


    In the `Items()` constructor method, insert statements to add each `JCheckBox`
    component to the `JPanel` container


    ```java

    pnl.add( chk1 ) ;

    pnl.add( chk2 ) ;

    pnl.add( chk3 ) ;

    pnl.add( chk4 ) ;

    ```


    ![image](images/8b.jpg)


    Insert statements to make a default selection and to add the `JComboBox` component
    to the `JPanel` container


    ```java

    box1.setSelectedIndex( 0 ) ;

    pnl.add( box1 ) ;

    ```


    ![image](images/9b.jpg)


    Now, insert a statement to add the `JList` component to the `JPanel` container


    ```java

    pnl.add( lst1 ) ;

    ```


    ![image](images/10b.jpg)


    Save the program as `Items.java` then compile and run the program, selecting items
    from the lists


    ![image](images/pg143_1.jpg)![image](images/pg143_2.jpg)![image](images/forget.jpg)


    Only one item can be selected from a `JComboBox` component – multiple items can
    be selected from a `JList` component.


    ![image](images/hot.jpg)


    Details of how to create event-handler methods to respond to user actions, such
    as an item selection, can be found in [Chapter 9](#chapter09.html).


    ### Adding radio buttons


    The Swing `JRadioButton` class creates a radio button component that can be added
    to a graphical interface. This can be used to allow the user to select an item
    from a group of radio buttons.


    The `JRadioButton` object is created with the `new` keyword, and its constructor
    takes a `String` argument specifying text to be displayed alongside that radio
    button. It can also take a second `true` argument to make a radio button selected
    by default.


    A `ButtonGroup` object logically groups a number of radio buttons so that only
    one button in that group can be selected at any time. Each radio button is added
    to the `ButtonGroup` object by specifying its name as the argument to the group’s
    `add()` method.


    ![image](images/1b.jpg)


    Before the `Radios()` constructor, create three `JRadioButton` objects – with
    one selected by default


    ```java

    JRadioButton rad1 = new JRadioButton( “Red” , true ) ;

    JRadioButton rad2 = new JRadioButton( “Rosé” ) ;

    JRadioButton rad3 = new JRadioButton( “White” ) ;

    ```


    ![image](images/2b.jpg)


    Next, create a `ButtonGroup` object with which to group the radio buttons


    ```java

    ButtonGroup wines = new ButtonGroup() ;

    ```


    ![image](images/3b.jpg)


    In the `Radios()` constructor method, insert statements to add each `JRadioButton`
    component to the `JPanel` container


    ```java

    wines.add( rad1 ) ;

    wines.add( rad2 ) ;

    wines.add( rad3 ) ;

    ```

