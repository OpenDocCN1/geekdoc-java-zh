    \ event )\n{ x = event.getX() ; y = event.getY() ; }\npublic void mouseDragged(\
    \ MouseEvent event ) { }\n```\n\n![image](img/6r.jpg)为 `MouseListener` 接口添加五个事件处理器\n\
    \n```java\npublic void mouseEntered( MouseEvent event )\n{ txtArea.setText( “\\\
    nMouse Entered” ) ; }\npublic void mousePressed( MouseEvent event )\n{ txtArea.append(\
    \ “\\nMouse Pressed at X: “ +x+ “Y: ” +y ) ; }\npublic void mouseReleased( MouseEvent\
    \ event )\n{ txtArea.append( “\\nMouse Released” ) ; }\npublic void mouseClicked(MouseEvent\
    \ event ) { }\npublic void mouseExited(MouseEvent event) { }\n```\n\n![image](img/7r.jpg)将程序保存为\
    \ `Mouse.java`，然后编译并运行程序，点击 `JTextArea`\n\n![image](img/159.jpg)\n\n## 发布消息\n\n\
    `JOptionPane` 类用于创建标准对话框。其 `showMessageDialog()` 方法向用户显示信息、警告或错误描述。`showMessageDialog()`\
