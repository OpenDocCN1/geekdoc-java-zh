    ```java

    System.out.println( “Hello World!” ) ;

    ```


    ![image](images/4b.jpg)Save the file at any convenient location, but be sure to
    name it precisely as `Hello.java` – the complete program should now look like
    this:


    ![image](images/pg12_1.jpg)


    ![image](images/snake.jpg)


    Java is a case-sensitive language where “Hello” and “hello” are distinctly different
    – traditionally, Java program names should always begin with an uppercase letter.


    ![image](images/forget.jpg)


    Java programs are always saved as their exact program name followed by the `.java`
    extension.


    The separate parts of the program code on the opposite page can be examined individually
    to understand each part more clearly:


    ### The Program Container


    ```java

    class Hello {    }

    ```


    The program name is declared following the `class` keyword, and followed by a
    pair of curly brackets. All of the program code that defines the `Hello` class
    will be contained within these curly brackets.


    ![image](images/forget.jpg)


    All stand-alone Java programs must have a `main` method. Java applets are different,
    and their format is explained later.


    ### The Main Method


    ```java

    public static void main ( String[] args ) {      }

    ```


    This fearsome-looking line is the standard code that is used to define the starting
    point of nearly all Java programs. It will be used in most examples throughout
    this book exactly as it appears above – so it may be useful to memorize it.


    The code declares a method named “main” that will contain the actual program instructions
    within its curly brackets.


    Keywords `public static void` precede the method name to define how the method
    may be used, and are explained in detail later.


    The code `( String[] args )` is useful when passing values to the method, and
    is also fully explained later in this book.


    ### The Statement


    ```java

    System.out.println( “Hello World!” ) ;

    ```


    Statements are actual instructions to perform program tasks, and must always end
    with a semicolon. A method may contain many statements inside its curly brackets
    to form a “statement block” defining a series of tasks to perform, but here a
    single statement instructs the program to output a line of text.


