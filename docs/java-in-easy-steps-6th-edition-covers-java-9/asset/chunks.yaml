    \ path address to invoke the compiler.\n\n![image](images/pg22_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nThe path address must be enclosed within quotation marks if it contains any\
    \ spaces, such as the path address “C:\\Program Files\\ Java”.\n\n•Cause – the\
    \ file `Test.java` cannot be found.\n•Solution – navigate to the directory where\
    \ the file is located, or use the full path address to the file in the command.\n\
    \n![image](images/pg23_1.jpg)\n\n•Cause – the statement is not terminated correctly.\n\
    •Solution – in the source code add a semicolon at the end of the statement, then\
    \ save the file to apply the change.\n\n![image](images/pg23_2.jpg)\n\n•Cause\
    \ – the program name and class name do not match.\n•Solution – in the source code\
    \ change the class name from `test` to `Test`, then save the file to apply the\
    \ change.\n\n![image](images/pg23_3.jpg)\n\n•Cause – the variable `text` has no\
    \ value.\n•Solution – in the variable declaration assign the variable a valid\
    \ `String` value, for instance `= “success”`, then save the file.\n\n![image](images/pg23_4.jpg)\n\
    \n![image](images/snake.jpg)\n\nYou must run the program from within its directory\
    \ – you cannot use a path address as the Java launcher requires a program name,\
    \ not a file name.\n\n### Summary\n\n•Java is both a programming language and\
    \ a runtime platform.\n•Java programs are written as plain text files with a `.java`\
    \ file extension.\n•The Java compiler `javac` creates compiled `.class` program\
    \ files from original `.java` source code files.\n•The Java interpreter `java`\
    \ executes compiled programs using an instance of the Java Virtual Machine.\n\
    •The Java VM is available on many operating system platforms.\n•Adding Java’s\
    \ `bin` sub-directory to the system `PATH` variable allows the `javac` compiler\
    \ to be invoked from anywhere.\n•Java is a case-sensitive language.\n•The standard\
    \ `main` method is the entry point for Java programs.\n•The `System.out.println()`\
    \ statement outputs text.\n•A Java program file name must exactly match its class\
    \ name.\n•Java variables can only be named in accordance with specified naming\
    \ conventions, and must avoid the Java keywords.\n•In Java programming, each statement\
    \ must be terminated by a semicolon character.\n•The most common Java data types\
    \ are `String`, `int`, `char`, `float` and `boolean`.\n•`String` values must be\
    \ enclosed in double quotes; `char` values in single quotes; and `float` values\
    \ must have an “f” suffix.\n•The `final` keyword can be used to create a constant\
    \ variable.\n•Comments can be added to Java source code between `/***` and `***/**`,\
    \ on one or more lines, or after `//` on a single line.\n•Error reports identify\
    \ compiler and runtime problems.\n\n2\n\n## Performing operations\n\n*This chapter\
    \ demonstrates the various operators that are used to create expressions in Java\
    \ programs.*\n\n[Doing arithmetic](#chapter02.html_sec11)\n\n[Assigning values](#chapter02.html_sec12)\n\
    \n[Comparing values](#chapter02.html_sec13)\n\n[Assessing logic](#chapter02.html_sec14)\n\
    \n[ining conditions](#chapter02.html_sec15)\n\n[Setting precedence](#chapter02.html_sec16)\n\
    \n[Escaping literals](#chapter02.html_sec17)\n\n[Working with bits](#chapter02.html_sec18)\n\
    \n[Summary](#chapter02.html_sec19)\n\n### Doing arithmetic\n\nArithmetical operators,\
    \ listed in the table below, are used to create expressions in Java programs that\
    \ return a single value.\n\n| **Operator:** | **Operation:** |\n| :--- | :---\
    \ |\n| `+` | Addition (and concatenates `String` values) |\n| `-` | Subtraction\
    \ |\n| `*` | Multiplication |\n| `/` | Division |\n| `%` | Modulus |\n| `++` |\
    \ Increment |\n| `--` | Decrement |\n\nThe operation performed by the addition\
    \ operator `+` depends on the type of its operands. Where both operands are numeric\
    \ values it will return total sum of those numbers, but where the operands are\
    \ `String` values it will return a concatenated `String` – For example, “Java\
    \ ” + “Arithmetic” returns “Java Arithmetic”.\n\nDivision of `int` values will\
    \ truncate any fractional part. For example, 11/4 = 2, whereas division of `float`\
    \ values 11/4 = 2.75.\n\nThe increment operator `++` and decrement operator `--`\
    \ return the result of modifying a single operand by a value of one. For example,\
    \ `4++` returns 5, and `4--` returns 3.\n\nThe modulus operator `%` divides the\
    \ first operand by the second operand and returns the remainder of the operation.\
    \ For example, `32 % 5` returns 2 – five divides into 32 six times, with 2 remainder.\n\
    \nFollow these steps to explore the Java arithmetic operators in the Java shell\n\
    \n![image](images/1r.jpg)Open a command-line prompt window, then type `jshell`\
    \ and hit the **Enter** key to launch the Java shell\n\n![image](images/2r.jpg)Next,\
    \ enter statements to initialize three variables\n\n`int num = 100 ; int factor\
    \ = 20 ; int sum = 0 ;`\n\n![image](images/pg27_1.jpg)\n\n![image](images/3r.jpg)Next,\
    \ separately enter statements to perform addition and subtraction operations,\
    \ displaying each result\n\n`sum = num + factor ;`\n`sum = num - factor ;`\n\n\
    ![image](images/pg27_2.jpg)\n\n![image](images/4r.jpg)Now, separately enter statements\
    \ to perform multiplication and division operations, displaying each result\n\n\
    `sum = num * factor ;`\n`sum = num / factor ;`\n\n![image](images/pg27_3.jpg)\n\
    \n![image](images/forget.jpg)\n\nJava must be installed on your system path to\
    \ launch the Java shell from any prompt – see Installing [here](#chapter01.html_pg11)\
    \ and Troubleshooting [here](#chapter01.html_sec9) for details.\n\nThe Java shell\
    \ **jshell** is a new feature in Java 9\\. Optionally, the semicolon character\
    \ may be omitted at the end of single statements entered into the shell but these\
    \ are required when writing Java programs for compilation. Semicolons are included\
    \ in the shell examples in this chapter to aid code consistency.\n"
