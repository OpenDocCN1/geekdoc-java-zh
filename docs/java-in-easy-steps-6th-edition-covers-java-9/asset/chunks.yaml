  trans: "\n\n这种“数组的数组”为每个工作日提供了一个元素。通过指明每个维度的适当索引值，为多维数组赋值。例如，使用上面的示例，可以这样给第六周的第一天赋值一个值：\n\
    \n```java\ndailyRecord [5] [0] = 5000 ;\n```\n\n每个数组都有自己的 `length` 属性，可以通过指定所需的维度来访问它。对于上面的示例，语法\
    \ `dailyRecord.length` 返回值 52 —— 即第一维的大小。若要访问第二个维度的大小，语法 `dailyRecord[0].length`\
    \ 返回值 7。\n\n![image](img/array.jpg)\n\n二维数组通常用于存储存储网格坐标，其中一个维度代表 X 轴，另一个维度代表 Y\
    \ 轴。例如，`point[3][5]`。\n\n三维数组可以以类似的方式存储 XYZ 坐标，但要可视化 `point[4][8][2]` 可能会困难。\n\
    \n嵌套循环非常适合多维数组，因为每个循环级别都可以处理每个数组维度的元素。\n\n![image](img/1p.jpg)创建一个名为“Dimensions”的新程序，包含标准的\
    \ main 方法\n\n```java\nclass Dimensions\n{\n    public static void main ( String[]\
    \ args ) {    }\n}\n```\n\n![image](img/java.jpg)\n\nDimensions.java\n\n![image](img/2p.jpg)在\
    \ main 方法中，创建一个二维数组来存储与 XY 坐标相关的布尔标记\n\n```java\nboolean[][] points = new boolean[5][20]\
    \ ;\n```\n\n![image](img/3p.jpg)在每个 X 轴上定义一个 Y 点\n\n```java\npoints[0][5] = true\
    \ ;\npoints[1][6] = true ;\npoints[2][7] = true ;\npoints[3][8] = true ;\npoints[4][9]\
    \ = true ;\n```\n\n![image](img/4p.jpg)添加一个 `for` 循环来遍历第一个数组索引，在每次迭代末尾添加一个换行字符\n\
    \n```java\nfor ( int i = 0 ; i < points.length ; i++ )\n{\n    System.out.print(\
    \ \"\\n” ) ;\n}\n```\n\n![image](img/5p.jpg)在 `for` 循环的大括号内，插入第二个 `for` 循环来遍历第二个数组索引\n\
    \n```java\nfor ( int j = 0 ; j < points[0].length ; j++ ) {    }\n```\n\n![image](img/6p.jpg)在第二个\
    \ `for` 循环的大括号内，插入一个语句，根据元素的布尔值为每个元素输出一个字符\n\n```java\nchar mark = ( points[i][j]\
    \ ) ? ‘X’ : ‘-’ ;\nSystem.out.print( mark ) ;\n```\n\n![image](img/7p.jpg)将程序保存为\
    \ `Dimensions.java`，然后编译并运行程序以查看输出\n\n![image](img/pg75_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n布尔变量默认为 `false`。\n\n### 异常异常\n\n程序可能会遇到运行时问题，导致“异常”错误，这会停止程序的执行。这通常是由意外的用户输入引起的。因此，一个编写良好的程序应该尝试预测用户可能在运行时引起异常的所有可能方式。\n\
    \n可能出现异常的代码可以被识别并封装在 `try catch` 语句块中。这允许程序处理异常而不停止执行，如下所示：\n\n```java\ntry\n\
    {\n    *可能出现异常的语句*\n}\ncatch( Exception e )\n{\n    *对异常的响应语句*\n}\n```\n\n`catch`\
    \ 关键字后面的括号指定了要捕获的异常类，并将其赋值给变量 `e`。顶层 `Exception` 类捕获所有异常。然而，可以使用多个 `catch` 语句来识别不同的低级异常类，为特定异常提供响应。\n\
    \n最常见的异常是 `NumberFormatException`（当程序遇到非预期数字类型的值时产生）和 `ArrayIndexOutOfBoundsException`（当程序尝试访问索引大小之外的数组元素时产生）。为这些异常中的每一个创建一个单独的是有帮助的，以便及时通知用户问题的性质。\n\
    \n可选地，`try catch` 语句块可以使用 `finally` 语句块进行扩展，该块包含无论程序是否遇到异常都将始终执行的代码。\n\n![image](img/hot.jpg)\n\
    \n`e.getMessage()` 方法返回有关某些已捕获异常的进一步信息。\n\n![image](img/1p.jpg)创建一个名为“Exceptions”的新程序，包含标准的\
    \ main 方法\n\n```java\nclass Exceptions\n{\n    public static void main ( String[]\
    \ args ) {    }\n}\n```\n\n![image](img/java.jpg)\n\nExceptions.java\n\n![image](img/2p.jpg)在\
    \ main 方法内部，编写一个 `try` 语句来输出单个整数参数\n\n```java\ntry\n{\n    int num = Integer.parseInt(\
    \ args[0] ) ;\n    System.out.println( “You entered: “+ num ) ;\n}\n```\n\n![image](img/3p.jpg)添加一个\
    \ `catch` 语句来处理在未带参数运行运行时产生的异常\n\n```java\ncatch( ArrayIndexOutOfBoundsException\
    \ )\n{\n    System.out.println( “Integer required.” ) ;\n}\n```\n\n![image](img/4p.jpg)添加一个\
    \ `catch` 语句来处理在带非整数参数运行时产生的异常\n\n```java\ncatch( NumberFormatException )\n{\n\
    \    System.out.println( “Argument is wrong.” ) ;\n}\n```\n\n![image](img/5p.jpg)在程序末尾添加一个\
    \ `finally` 语句\n\n```java\nfinally\n{\n    System.out.println( “Program ends.”\
    \ ) ;\n}\n```\n\n"
- fmt: "\nJava has a vast library of pre-tested code packages, which are arranged\
    \ in modules. Those providing functionality that is fundamental to the Java language\
    \ itself are contained in the `java.lang` package, within the `java.base` module.\
    \ These are automatically accessible to the Java API (Application Programming\
    \ Interface). This means that the properties and methods provided by the `java.lang`\
    \ package are readily available when creating programs. For example, the mathematic\
    \ functionality provided by the `abs()` method of the `Math` class, which is part\
    \ of the `java.lang` package, in the `java.base` module.\n\n![image](images/new.jpg)\n\
    \n## Modules\nModules are a new feature introduced in Java 9 to improve scalability\
    \ and increase performance.\n\nPackage contents are arranged in hierarchical order,\
    \ allowing any item to be addressed using dot notation. For example, the `System`\
    \ class contains an `out` property (field), which in turn contains a `println()`\
    \ method – so can be addressed as `System.out.println()`.\n\nThe Java documentation\
    \ provides information about every item available, and can be used to explore\
    \ the Java classes. It is available online at `docs.oracle.com/javase/9/docs/api`\
    \ or can be downloaded for offline reference. The documentation is understandably\
    \ large, but familiarity with it is valuable. A good starting point is the API\
    \ Overview page containing a list of every module in each of three sections, together\
    \ with a brief description of each module:\n\n![image](images/1o.jpg)Start a web\
    \ browser and open the API Overview page at `docs.oracle.com/javase/9/docs/api`\n\
    \n![image](images/2o.jpg)See the `Modules` listed alphabetically in each section\
    \ – scroll down the page to the “Java SE” section and find the `java.base` module,\
    \ then click its hyperlink\n\n![image](images/pg80_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nYou can click on the Frames link to see a multi-pane view of the documentation.\n\
    \n![image](images/3o.jpg)See the module’s `Packages` listed alphabetically in\
    \ each section – scroll down the page to the “Exports” section and find the `java.lang`\
    \ package, then click its hyperlink\n\n![image](images/pg81_1.jpg)\n\n![image](images/4o.jpg)See\
    \ the package’s `Classes` listed alphabetically in each section – scroll down\
    \ the page to the “Class Summary” section to find the `Math` class, then click\
    \ its hyperlink\n\n![image](images/pg81_2.jpg)\n\n![image](images/5o.jpg)See the\
    \ class’s `Methods` listed alphabetically in the “Method Summary” section – click\
    \ on any hyperlink to discover the purpose of that method and its syntax\n\n![image](images/pg81_3.jpg)\n\
    \n![image](images/pg81_4.jpg)\n\n![image](images/hot.jpg)\n\nYou can also use\
    \ the Search box to find information on any item.\n\n![image](images/hot.jpg)\n\
    \nExamine the information available via other items on the page menu to become\
    \ more familiar with the documentation.\n\n## Doing mathematics\nThe `Math` class\
    \ within the `java.lang` package provides two constant values that are often useful\
    \ to perform mathematical calculations. `Math.PI` stores the value of Pi, and\
    \ `Math.E` stores the value that is the base of natural logarithms. Both these\
    \ constant values are stored as `double` precision data types with 15 decimal\
    \ places.\n\n![image](images/1o.jpg)Start a new program named “Pi” containing\
    \ the standard main method\n\n```java\nclass Pi {\n    public static void main\
    \ ( String[] args ) {\n    }\n}\n```\n\n![image](images/java.jpg)\nPi.java\n\n\
    ![image](images/2o.jpg)Inside the main method, declare and initialize a `float`\
    \ variable from a command line argument, and cast the `double Math.PI` constant\
    \ into a second `float` variable\n\n```java\nfloat radius = Float.parseFloat(args[0]);\n\
    float shortPi = (float) Math.PI;\n```\n\n![image](images/3o.jpg)Perform mathematical\
    \ calculations using the cast value, assigning the results to more `float` variables\n\
    \n```java\nfloat circ = shortPi * (radius + radius);\nfloat area = shortPi * (radius\
    \ * radius);\n```\n\n![image](images/4o.jpg)Output the value of `Math.PI` and\
    \ its cast `float` equivalent, followed by the results of the calculations\n\n\
    ```java\nSystem.out.print( “With Pi commuted from “ + Math.PI );\nSystem.out.println(\
    \ “ to ” + shortPi + “...” ) ;\nSystem.out.println( “A circle of radius “ + radius\
    \ + “ cm” ) ;\nSystem.out.printIn( “has a circumference of “ + circ + “ cm” )\
    \ ;\nSystem.out.println( “ and an area of ” + area + “ sq.cm” ) ;\n```\n\n![image](images/5o.jpg)Save\
    \ the program as `Pi.java` then compile and run the program to see the output\n\
    \n![image](images/pg82_1.jpg)\n\n![image](images/hot.jpg)\n\nThe commuted value\
    \ of Pi usually provides sufficient precision. The `Math` class within the `java.lang`\
    \ package provides many methods that are useful to perform calculations. Using\
    \ `Math.pow()`, a given number can be raised to a specified power. `Math.sqrt()`\
    \ method returns the square root of the number.\n\n```java\nclass Power {\n  \
    \  public static void main ( String[] args ) {\n    }\n}\n```\n\n![image](images/1o.jpg)Start\
    \ a new program named “Power” containing the standard main method\n\n![image](images/2o.jpg)Inside\
    \ the main method, declare and initialize an `int` variable from a command line\
    \ argument\n\n```java\nint num = Integer.parseInt(args[0]);\n```\n\n![image](images/3o.jpg)Perform\
    \ mathematical calculations, casting the results into `int` variables\n\n```java\n\
    int square = (int) Math.pow(num, 2);\nint cube = (int) Math.pow(num, 3);\nint\
    \ sqrt = (int) Math.sqrt(num);\n```\n\n![image](images/4o.jpg)Output the results\
    \ of the calculations\n\n```java\nSystem.out.println(num + ” squared is ” + square);\n\
    System.out.println(num + ” cubed is ” + cube);\nSystem.out.println( “Square root\
    \ of ” + sqrt);\n```\n\nBoth The `java.lang` package provides three methods to\
    \ round floating-point numbers to the nearest integer. Simplest of these is the\
    \ `Math.round()` method that rounds a number stated as its argument up, or down,\
    \ to the closest integer. The `Math.floor()` method rounds down to the closest\
    \ integer below, and `Math.ceil()` rounds up to the closest integer above. While\
    \ the `Math.round()` method returns an `int` data type, both `Math.floor()` and\
    \ `Math.ceil()` methods return a `double` data type.\n\n```java\nclass Round {\n\
    \    public static void main ( String[] args ) {\n    }\n}\n```\n\n![image](images/1o.jpg)Start\
    \ a new program named “Round” containing the standard main method\n\n![image](images/2o.jpg)Inside\
    \ the main method, declare and initialize a `float` variable\n\n```java\nfloat\
    \ num = 7.25f;\n```\n\n![image](images/3o.jpg)Output the rounded `float` value\
    \ as an `int` value\n\n```java\nSystem.out.println(num + ” rounded is ” + Math.round(num));\n\
    ```\n\n![image](images/4o.jpg)Output the rounded `float` value as `double` values\n\
    \n```java\nSystem.out.println(num + ” floored is ” + Math.floor(num));\nSystem.out.println(num\
    \ +“ ceiling is ” + Math.ceil(num));\n```\n\nBy default, `Math.round()` will round\
    \ up – so 7.5 would be rounded up to 8.\n"
  raw: 'Java has a vast library of pre-tested code packages, which are arranged in
    modules. Those providing functionality that is fundamental to the Java language
    itself are contained in the **java.lang** package, within the **java.base** module.
    These are automatically accessible to the Java API (Application Programming Interface).
    This means that the properties and methods provided by the **java.lang** package
    are readily available when creating programs. For example, the mathematic functionality
    provided by the **abs()** method of the **Math** class, which is part of the **java.lang**
    package, in the **java.base** module.


    ![image](images/new.jpg)


    Modules are a new feature introduced in Java 9 to improve scalability and increase
    performance.


    Package contents are arranged in hierarchical order, allowing any item to be addressed
    using dot notation. For example, the **System** class contains an **out** property
    (field), which in turn contains a **println()** method – so can be addressed as
    **System.out.println()**.


    The Java documentation provides information about every item available, and can
    be used to explore the Java classes. It is available online at **[docs.oracle.com/javase/9/docs/api](https://docs.oracle.com/javase/9/docs/api/overview-summary.html)**
    or can be downloaded for offline reference. The documentation is understandably
    large, but familiarity with it is valuable. A good starting point is the API Overview
    page containing a list of every module in each of three sections, together with
    a brief description of each module:


    ![image](images/1o.jpg)Start a web browser and open the API Overview page at **[docs.oracle.com/javase/9/docs/api](https://docs.oracle.com/javase/9/docs/api/overview-summary.html)**


    ![image](images/2o.jpg)See the **Modules** listed alphabetically in each section
    – scroll down the page to the “Java SE” section and find the **java.base** module,
    then click its hyperlink


    ![image](images/pg80_1.jpg)


    ![image](images/forget.jpg)


    You can click on the Frames link to see a multi-pane view of the documentation.


    ![image](images/3o.jpg)See the module’s **Packages** listed alphabetically in
    each section – scroll down the page to the “Exports” section and find the **java.lang**
    package, then click its hyperlink


    ![image](images/pg81_1.jpg)


    ![image](images/4o.jpg)See the package’s **Classes** listed alphabetically in
    each section – scroll down the page to the “Class Summary” section to find the
    **Math** class, then click its hyperlink


    ![image](images/pg81_2.jpg)


    ![image](images/5o.jpg)See the class’s **Methods** listed alphabetically in the
    “Method Summary” section – click on any hyperlink to discover the purpose of that
    method and its syntax


    ![image](images/pg81_3.jpg)


    ![image](images/pg81_4.jpg)


    ![image](images/hot.jpg)


    You can also use the Search box to find information on any item.


    ![image](images/hot.jpg)


    Examine the information available via other items on the page menu to become more
    familiar with the documentation.


    **Doing mathematics**


    The **Math** class within the **java.lang** package provides two constant values
    that are often useful to perform mathematical calculations. **Math.PI** stores
    the value of Pi, and **Math.E** stores the value that is the base of natural logarithms.
    Both these constant values are stored as **double** precision data types with
    15 decimal places.


    ![image](images/1o.jpg)Start a new program named “Pi” containing the standard
    main method


    **class Pi**


    **{**


    **public static void main ( String[] args ) {         }**


    **}**


    ![image](images/java.jpg)


    Pi.java


    ![image](images/2o.jpg)Inside the main method, declare and initialize a **float**
    variable from a command line argument, and cast the **double Math.PI** constant
    into a second **float** variable


    **float radius = Float.parseFloat( args[0] ) ;**


    **float shortPi = (float) Math.PI ;**


    ![image](images/3o.jpg)Perform mathematical calculations using the cast value,
    assigning the results to more **float** variables


    **float circ = shortPi * ( radius + radius ) ;**


    **float area = shortPi * ( radius * radius ) ;**


    ![image](images/4o.jpg)Output the value of **Math.PI** and its cast **float**
    equivalent, followed by the results of the calculations


    **System.out.print( “With Pi commuted from “ + Math.PI ) ;**


    **System.out.println( “ to “ + shortPi + “...” ) ;**


    **System.out.println( “A circle of radius “ + radius + “ cm” ) ;**


    **System.out.printIn( “has a circumference of “ + circ + “ cm” ) ;**


    **System.out.println( “ and an area of “ + area + “ sq.cm” ) ;**


    ![image](images/5o.jpg)Save the program as **Pi.java** then compile and run the
    program to see the output


    ![image](images/pg82_1.jpg)


    ![image](images/hot.jpg)


    The commuted value of Pi usually provides sufficient precision.


    The **Math** class within the **java.lang** package provides many methods that
    are useful to perform mathematical calculations. Using **Math.pow()**, a given
    number can be raised to a specified power. The parentheses require the number
    as its first argument and the power by which it is to be raised as its second
    argument. The **Math.sqrt()** method returns the square root of the number specified
    as its sole argument. Both methods return a **double** type.


    ![image](images/1o.jpg)Start a new program named “Power” containing the standard
    main method


    **class Power**


    **{**


    **public static void main ( String[] args ) {       }**


    **}**


    ![image](images/java.jpg)


    Power.java


    ![image](images/2o.jpg)Inside the main method, declare and initialize an **int**
    variable from a passed command line argument


    **int num = Integer.parseInt( args[0] ) ;**


    ![image](images/3o.jpg)Perform mathematical calculations, casting the results
    into more **int** variables


    **int square = (int) Math.pow( num , 2 ) ;**


    **int cube = (int) Math.pow( num , 3 ) ;**


    **int sqrt = (int) Math.sqrt( num ) ;**


    ![image](images/4o.jpg)Output the results of the calculations


    **System.out.println( num + ” squared is “ + square ) ;**


    **System.out.println( num + ” cubed is “ + cube ) ;**


    **System.out.println( “Square root of “ + num + ” is “+ sqrt ) ;**


    ![image](images/5o.jpg)Save the program as **Power.java** then compile and run
    the program to see the output


    ![image](images/pg83_1.jpg)


    ![image](images/forget.jpg)


    Both these examples could be improved by adding **try catch** statement blocks
    to anticipate user errors – see [here](#chapter04.html_sec36) for details.


    **Rounding numbers**


    The **Math** class within the **java.lang** package provides three methods to
    round floating-point numbers to the nearest integer. Simplest of these is the
    **Math.round()** method that rounds a number stated as its argument up, or down,
    to the closest integer.


    The **Math.floor()** method rounds down to the closest integer below, and **Math.ceil()**
    rounds up to the closest integer above.


    While the **Math.round()** method returns an **int** data type, both **Math.floor()**
    and **Math.ceil()** methods return a **double** data type.


    ![image](images/1o.jpg)Start a new program named “Round” containing the standard
    main method


    **class Round**


    **{**


    **public static void main ( String[] args ) {         }**


    **}**


    ![image](images/java.jpg)


    Round.java


    ![image](images/2o.jpg)Inside the main method, declare and initialize a **float**
    variable


    **float num = 7.25f ;**


    ![image](images/3o.jpg)Output the rounded **float** value as an **int** value


    **System.out.println( num+” rounded is “+Math.round( num ) ) ;**


    ![image](images/4o.jpg)Output the rounded **float** value as **double** values


    **System.out.println( num+” floored is “ +Math.floor( num ) );**


    **System.out.println( num+“ ceiling is “ + Math.ceil( num ) ) ;**


    ![image](images/5o.jpg)Save the program as **Round.java** then compile and run
    the program to see the output


    ![image](images/pg84_1.jpg)


    ![image](images/hot.jpg)


    By default, **Math.round()** will round up – so 7.5 would be rounded up to 8.'
