    statements to output the value of each attribute of the `Car` class and call its
    behavior method


    ```

    System.out.println( “Car paint is “ + Car.color ) ;

    System.out.println( “style is “+ Car.bodyType ) ;

    System.out.println( Car.accelerate() ) ;

    ```


    ![image](images/5bl.jpg)Now, add a statement to create a `Porsche` instance of
    the `Car` class


    ```

