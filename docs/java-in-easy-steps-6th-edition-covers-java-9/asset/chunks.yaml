    \ |\n| `\\f` | Formfeed |\n| `\\\\` | Backslash |\n| `\\’` | Single quote mark\
    \ |\n| `\\”` | Double quote mark |\n\n![image](images/hot.jpg)\n\nSingle quotes\
    \ can be nested within double quotes as an alternative to escaping quote characters.\n\
    \nThe `\\n` newline escape sequence is frequently used within long `String` values\
    \ to display the output on multiple lines. Similarly, the `\\t` tab escape sequence\
