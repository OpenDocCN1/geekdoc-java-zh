    \n`int num = 100 ; int factor = 20 ; int sum = 0 ;`\n\n![image](img/pg27_1.jpg)\n\
    \n![image](img/3r.jpg)接下来，分别输入语句执行加法和减法操作，显示每个结果\n\n`sum = num + factor ;`\n`sum\
    \ = num - factor ;`\n\n![image](img/pg27_2.jpg)\n\n![image](img/4r.jpg)现在，分别输入语句执行乘法和除法操作，显示每个结果\n\
    \n`sum = num * factor ;`\n`sum = num / factor ;`\n\n![image](img/pg27_3.jpg)\n\
