  trans: "\n\n![image](img/4r.jpg)在 `Actions()` 构造函数之前，创建两个 `JButton` 按钮和一个 `JTextArea`\
    \ 文本字段\n\n```java\nJButton btn1 = new JButton( “Button 1” ) ;\nJButton btn2 =\
    \ new JButton( “Button 2” ) ;\nJTextArea txtArea = new JTextArea( 5 , 38 ) ;\n\
    ```\n\n![image](img/5r.jpg)将按钮和文本区域添加到 `JPanel` 容器\n\n```java\npnl.add( btn1 )\
