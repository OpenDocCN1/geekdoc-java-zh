    The `Lotto()` constructor builds a simple Swing interface that loads the panel
    into a window frame measuring 260 x 210.


    ### Event-handler


    The button’s event-handler method executes an algorithm to select a sequence of
    six unique random numbers in the range of 1-59 for display in the text field component.


    ### Entry-point


    The `main()` method creates an instance of the app, and calls upon `ClassLoader()`
    to seek the image file resource `Lotto.png` in the same directory as the program
    file. The files must be arranged in this way before attempting to compile the
    program.


    ![image](images/pg169_2.jpg)


    ![image](images/hot.jpg)


    The Lotto program is used throughout this chapter to create apps for desktop and
    handheld devices.


    Observing the required file arrangement, the `javac` compiler can be employed
    in the usual way to create a `Lotto.class` file, then the `java` interpreter can
    be employed to execute the program:


    ![image](images/pg169_3.jpg)


    ### Distributing programs


    The `Lotto` program opens a new window of the specified size containing the Swing
    interface components. Each time the user clicks the push button, its event-handler
    displays six new random numbers in the range 1-59 within the text field component:


    ![image](images/pg170_1.jpg)


    As with all other examples in this book, the example `Lotto` program has been
    compiled here for Java 9 and can be distributed for execution on other computers
    where the Java 9 Runtime Environment is present – regardless of their operating
    system. For example, in the screenshots below, `Lotto.class` and `Lotto.png` files
    have been copied to the desktop of a computer running the Linux operating system
    with the Java 9 runtime installed. The `Lotto` program can, therefore, be executed
    by the `java` interpreter in the same way as on the originating Windows system.


    ![image](images/pg170_2.jpg)


    ![image](images/pg170_3.jpg)


    ![image](images/hot.jpg)


    The `.java` source code file need not be included when distributing a program
    – only `.class` and resource files are needed.


    There is, however, a danger in distributing Java programs this way as the program
    will fail to execute if resource files become unavailable – in this case, removing
    `Lotto.png` produces this error:


    ![image](images/pg171_1.jpg)


    The JDK contains a `jar` utility tool that allows program class and resource files
    to be bundled into a single Java ARchive (JAR) file. This compresses all program
    files, using the popular ZIP format, into a single file with a `.jar` file extension.
    A JAR file stores the program efficiently and helps ensure that resource files
    do not become accidentally isolated. The `java` interpreter fully supports JAR
    files so Java applications can be executed without extracting the individual files.
    Like the `java` interpreter and `javac` compiler, the `jar` tool is located in
    Java’s `bin` directory and runs from the command line to perform these common
    `jar` operations:


    | Command syntax: | Operation: |

    | :--- | :--- |

    | `jar cf *jar-file input-file/s*` | Create a JAR file |

    | `jar cfe *jar-file entry-point input-file/s*` | Create a JAR file with a specified
    entry point in a stand-alone application |

    | `jar tf *jar-file*` | View contents of a JAR file |

    | `jar uf *jar-file*` | Update contents of JAR file |

    | `jar ufm *jar-file attribute-file*` | Update contents of JAR file manifest,
    adding attribute/s |

    | `jar xf *jar-file*` | Extract all contents of JAR |

    | `jar xf *jar-file archived-file/s*` | Extract specific files from JAR |


    ![image](images/forget.jpg)


    Larger programs may use many resource files whose location can easily be disrupted
    by a user – the solution is to package the program and all its resources into
    a single executable archive file.


    ![image](images/hot.jpg)


    For larger programs, the `*` wildcard character can be used to archive multiple
    files within the directory – for instance, `jar cf Program.jar *.class` archives
    all class files in the current directory.


    ### Building Java archives


    Follow these steps to create a JAR file for the Lotto program described at the
    start of this chapter:


    ![image](images/1g.jpg)Open a command-line/terminal window, then navigate to the
    directory where the Lotto program files are located – `Lotto.class` and `Lotto.png`


    ![image](images/jar.jpg)


    Lotto.jar


    ![image](images/2g.jpg)Enter `jar cfe Lotto.jar Lotto Lotto.class Lotto.png`,
    then hit the **Enter** key to create a `Lotto.jar` archive


    ![image](images/3g.jpg)Next, enter `jar tf Lotto.jar` to see all contents of the
    JAR


    ![image](images/pg172_1.jpg)


    Notice that the `jar` tool automatically creates a `META-INF` directory alongside
    the archived files. This contains a text-based manifest meta file named `MANIFEST.MF`
    that you can examine:


    ![image](images/4g.jpg)Now, enter `jar xf Lotto.jar META-INF` to extract a copy
    of the `META-INF` directory


    ![image](images/5g.jpg)Finally, enter `type META-INF\MANIFEST.MF` to extract the
    `META-INF` directory


    ![image](images/pg174_2.jpg)


    ![image](images/hot.jpg)


    ### Deploying applications


    JAR files are executable on any system on which the appropriate version is installed:


    ![image](images/1g.jpg)At the command line, navigate to the directory where the
    JAR file is located, then type `java -jar Lotto.jar` and hit the **Enter** key
    to run the Lotto application


    ![image](images/pg173_1.jpg)


    ![image](images/2g.jpg)


    ![image](images/pg173_2.jpg)


    Alternatively, right-click the `Lotto.jar` file and choose “Open With” the Java
    Runtime


    ![image](images/pg173_3.jpg)


    ![image](images/pg173_4.jpg)


    The `.jar` file extension is required when executing JAR files. Set the JRE as
    the default JAR file handler on your system for double-click execution.


    ### Creating Android projects


    The Android operating system, prevalent on handheld devices, includes a set of
    core libraries that provide most of the functionality of those in the Java programming
    language. This means that Java programs can be readily converted for Android.


    ![image](images/pg174_2.jpg)


    Android Studio is available free from [developer.android.com/studio](https://developer.android.com/studio/index.html)
    This example describes version 2.3.3 – instructions may vary for other versions.
    Android Studio is a sizeable download of around 1.9GB, and may require additional
    downloads to complete setup. Check the system requirements to ensure your computer
    can run Android Studio before downloading.


    Android app development is best undertaken using the official Android Studio Integrated
    Development Environment (IDE). This provides a unified environment where you can
    develop apps for all Android devices, and provides extensive testing tools. Completed
    apps are distributed as an Android Application Package (APK) archive file, which
    is similar to a Java archive (JAR) file. This compresses all program files, using
    the popular ZIP format, into a single file with a `.apk` file extension. Each
    app is first created in Android Studio as a “project”, to which the developer
    adds code and resources:


    ![image](images/hot.jpg)Launch Android Studio, then choose to **Start a new Android
    Studio project** in the “Welcome” dialog options – to open the “New Project” dialog


    ![image](images/1g.jpg)Enter an **Application name** (for example, “Lotto”) and
    a **Company Domain**, then choose your preferred **Project location** at which
    to save the project on your computer


    ![image](images/pg174_1.jpg)Click **Next** to open the “Target Android Devices”
    dialog

