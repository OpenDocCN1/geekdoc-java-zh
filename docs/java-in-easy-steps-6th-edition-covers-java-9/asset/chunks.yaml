    \ – not from the `keyTyped()` event-handler.\n\n![image](images/hot.jpg)\n\nRun\
    \ this program and press a non-character key, such as Backspace, to see its key\
    \ text name.\n\n## Responding to mouse events\n\nSwing components can recognize\
    \ user mouse actions with the `MouseListener` interface, which will pass the `MouseEvent`\
    \ event to these five event-handler methods:\n\n| Event-handler: | Description:\
    \ |\n| :--- | :--- |\n| `mousePressed( MouseEvent )` | Button is pressed |\n|\
