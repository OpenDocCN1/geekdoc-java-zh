    \ the program to handle exceptions without halting execution and looks like this:\n\
    \n```java\ntry\n{\n    *statements where an exception may arise*\n}\ncatch( Exception\
    \ e )\n{\n    *statements responding to an exception*\n}\n```\n\nThe parentheses\
    \ following the `catch` keyword specify the class of exception to be caught and\
    \ assign it to the variable `e`. The top-level `Exception` class catches all exceptions.\
    \ Responses can be provided for specific exceptions, however, using multiple `catch`\
