    \ ;\n```\n\n![image](images/java.jpg)\n\nMouse.java\n\n![image](images/2r.jpg)Edit\
    \ the class declaration to add a `MouseListener` interface and `MouseMotionListener`\
    \ interface to the program\n\n```java\nclass Mouse extends JFrame implements MouseListener\
    \ , MouseMotionListener\n```\n\n![image](images/3r.jpg)Before the `Mouse()` constructor,\
    \ create a `JTextArea` component and two integer variables to store coordinates\n\
    \n```java\nJTextArea txtArea = new JTextArea( 8 , 38 ) ;\nint x , y ;\n```\n\n\
    ![image](images/4r.jpg)In the `Mouse()` constructor, insert statements to add\
    \ the `JTextArea` component to the `JPanel` container and to make it generate\
    \ `MouseEvent` events\n\n```java\npnl.add( txtArea ) ;\ntxtArea.addMouseMotionListener(\
    \ this ) ;\ntxtArea.addMouseListener( this ) ;\n```\n\n![image](images/5r.jpg)After\
    \ the constructor method, add the two event-handlers for the `MouseMotionListener`\
    \ interface\n\n```java\npublic void mouseMoved( MouseEvent event )\n{ x = event.getX()\
    \ ; y = event.getY() ; }\npublic void mouseDragged( MouseEvent event ) { }\n```\n\
    \n![image](images/6r.jpg)Add five event-handlers for the `MouseListener` interface\n\
    \n```java\npublic void mouseEntered( MouseEvent event )\n{ txtArea.setText( “\\\
    nMouse Entered” ) ; }\npublic void mousePressed( MouseEvent event )\n{ txtArea.append(\
    \ “\\nMouse Pressed at X: “ +x+ “Y: ” +y ) ; }\npublic void mouseReleased( MouseEvent\
    \ event )\n{ txtArea.append( “\\nMouse Released” ) ; }\npublic void mouseClicked(MouseEvent\
    \ event ) { }\npublic void mouseExited(MouseEvent event) { }\n```\n\n![image](images/7r.jpg)Save\
    \ the program as `Mouse.java` then compile and run the program, clicking on the\
    \ `JTextArea`\n\n![image](images/159.jpg)\n\n## Announcing messages\n\nThe `JOptionPane`\
