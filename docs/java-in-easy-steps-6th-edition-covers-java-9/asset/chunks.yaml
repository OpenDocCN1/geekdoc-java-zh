    \n你可以添加一条尝试更改常量值值的语句，然后尝试重新编译程序以查看生成的错误信息。\n\n### 故障排除\n\n有时，`javac` 编译器或 `java`\
    \ 解释器会报告错误，因此了解这些错误的原因以及如何快速解决问题非常有帮助。为了演示一些常见的错误报告，这段代码包含了一些故意错误：\n\n![image](img/java.jpg)\n\
    \nTest.java\n\n```\nclass test\n{\n    public static void main ( String[] args\
    \ )\n    {\n        String text ;\n        System.out.println( “Test ” + text\
    \ )\n    }\n}\n```\n\n首次尝试编译 `Test.java` 会抛出此错误报告：\n\n![image](img/pg22_1.jpg)\n\
    \n•原因 – 找不到 `javac` 编译器。\n•解决方案 – 编辑系统 `PATH` 变量，描述请参考此处，或使用其完整路径地址来调用编译器。\n\n\
    ![image](img/pg22_2.jpg)\n\n![image](img/hot.jpg)\n\n如果路径地址包含任何空格，必须封装在引号内，例如路径地址“C:\\\
    Program Files\\ Java”。\n\n•原因 – 找不到文件 `Test.java`。\n•解决方案 – 导航到文件所在的目录，或在命令中使用文件的完整路径。\n\
