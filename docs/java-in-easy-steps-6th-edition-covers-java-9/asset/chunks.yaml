    **Manipulating characters**


    The **String** class within the **java.lang** package provides the **trim()**
    method that is used to remove any whitespace from the beginning and end of the
    **String** specified as its argument. This method will remove all extreme spaces,
    newlines, and tabs, returning the trimmed version of that **String**.


    An individual character in a **String** can be addressed by stating its index
    position within that **String** as the argument to its **charAt()** method. This
    method treats the **String** as an array of characters where the first character
    is at position zero – just like other arrays whose elements are indexed starting
    at zero. The first character in a **String** can be addressed as **charAt(0)**,
    the second character as **charAt(1)**, and so on.


    As character indexing begins at zero, the final character in a **String** will
    always have an index number that is one less than the total number of characters
    in the **String**. This means that the final character in any **String** has the
    index number equivalent to **length() - 1**. The final character in a **String**
    named “str” can, therefore, be addressed as **str.charAt( str.length() - 1 )**.


    All occurrences of a particular character in a **String** can be replaced by another
    character using its **replace()** method. This method requires two arguments that
    specify the character to be replaced and the character that is to take its place.
    For example, to replace all occurrences of the letter “a” with the letter “z”,
    the syntax would be **replace( ‘a’ , ‘z’ )**.


    The **isEmpty()** method can be used to discover if a **String** contains no characters.
    This method will return **true** if the **String** is absolutely empty, otherwise
    it will return **false**.


