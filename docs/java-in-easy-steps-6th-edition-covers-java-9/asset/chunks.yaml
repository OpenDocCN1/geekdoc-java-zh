  trans: "\n\n使用不同字母大小写的 `String` 值（例如“Java”和“JAVA”）不被认为是相等的，因为字符的 ASCII 值不同。例如，大写“A”的值为\
    \ 65，而小写“a”的值为 97。\n\n为了将用户输入的、大小写不确定的 `String` 值与程序中的 `String` 值进行比较，通常将输入转换为特定的大小写格式是非常有用的。为此，`String`\
    \ 类提供了 `toUpperCase()` 方法和 `toLowerCase()` 方法。将输入的 `String` 作为参数指定，该方法返回转换后的 `String`。\n\
    \n一个典型的示例可能是：将用户输入的密码 `String` 强制转换为小写，然后将其与程序中存储在 `String` 变量中的、全小写的正确密码进行比较。这允许用户在允许大小写不敏感密码的情况下，以大写、小写或大小写混合输入密码。\n\
    \n点符号表示允许将方法附加到其他方法上，以便按顺序执行这些操作。这意味着可以使用 `toLowerCase().equals()` 将一个 `String`\
    \ 值转换为小写，然后将该小写版本与指定的参数进行比较。\n\n![image](img/1o.jpg)创建一个名为“StringComparison”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass StringComparison\n{\n    public static void main (\
    \ String[] args ) { }\n}\n```\n\n![image](img/java.jpg)\n\nStringComparison.java\n\
    \n![image](img/2o.jpg)在 main 方法内部，创建并初始化一个带有正确小写密码的 `String` 变量\n\n```java\nString\
    \ password = “bingo” ;\n```\n\n![image](img/3o.jpg)添加 `try catch`语句来捕获未输入密码参数时发生的异常\n\
    \n```java\ntry {\n}\ncatch( Exception e )\n{\n    System.out.println( “Password\
    \ required.” ) ;\n}\n```\n\n![image](img/4o.jpg)将此 `if else` 语句插入 `try` 语句块中以评估用户输入的密码参数\n\
    \n```java\nif ( args[0].toLowerCase().equals( password ) )\n{\n    System.out.println(\
    \ “Password accepted.” ) ;\n}\nelse\n{\n    System.out.println( “Incorrect password.”\
    \ ) ;\n}\n```\n\n![image](img/5o.jpg)将程序保存为 `StringComparison.java`，然后使用各种参数编译并运行程序\n\
    \n![image](img/pg91_1.jpg)\n\n## 搜索字符串\n\n`java.lang` 包中的 `String` 类提供了 `startsWith()`\
    \ 和 `endsWith()` 方法来比较 `String` 值的部分。这些方法对于比较多个 `String` 值并选择具有相同开头或相同结尾的值特别有用。当\
    \ `String` 的部分与指定的参数匹配时，方法返回 `true` —— 否则，返回 `false`。\n\n通过将要复制的第一个字符的位置号作为其 `substring()`\
    \ 方法的参数，可以复制 `String` 值的一个部分。这将返回原始 `String` 值的子字符串，从指定的起始位置开始到原始 `String` 的末尾结束。\n\
    \n可选地，`substring()` 方法可以接受第二个参数来指定要复制的最后一个字符的位置号。这将返回原始 `String` 值的子字符串，从指定的起始位置开始到指定的结束位置结束。\n\
    \n可以对 `String` 值进行搜索，以找到作为其 `indexOf()` 方法参数的字符或子字符串。异常的是，该方法返回匹配的字符或子字符串在搜索的\
    \ `String` 值中首次出现的数字位置。如果没有找到匹配项，方法返回负整数值 -1。\n\n![image](img/1o.jpg)创建一个名为“StringSearch”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass StringSearch\n{\n    public static void main ( String[]\
    \ args ) { }\n}\n```\n\n![image](img/java.jpg)\n\nStringSearch.java\n\n![image](img/2o.jpg)在\
    \ main 方法内部，创建一个初始化的书名 `String` 数组\n\n```java\nString[] books =\n{    “Java in\
    \ easy steps”, “XML in easy steps” ,\n    “SQL in easy steps” , ”CSS in easy steps”\
    \ ,\n    “Gone With the Wind” , “Drop the Defense” } ;\n```\n\n![image](img/3o.jpg)创建并初始化三个\
    \ `int` 计数变量\n\n```java\nint counter1 = 0 , counter2 = 0 , counter3 = 0 ;\n```\n\
    \n![image](img/4o.jpg)添加一个 `for` 循环来遍历 `String` 数组，输出每个标题的前四个字符\n\n```java\nfor\
    \ ( int i = 0 ; i < books.length ; i++ )\n{\n    System.out.print( books[i].substring(\
    \ 0, 4 ) + “ | ” );\n}\n```\n\n![image](img/5o.jpg)在 `for` 循环中插入语句来统计带有结尾的标题\n\
    \n```java\nif ( books[i].endsWith( “easy steps” ) counter1++;\n```\n\n![image](img/6o.jpg)在\
    \ `for` 循环中插入语句来统计带有开头的标题\n\n```java\nif ( books[i].startsWith( “Java” ) counter2++;\n\
    ```\n\n![image](img/7o.jpg)在 `for` 循环中插入语句来统计不包含子字符串的标题\n\n```java\nif ( books[i].indexOf(\
    \ “easy” ) == -1 ) counter3++;\n```\n\n![image](img/8o.jpg)在 main 方法末尾，添加这些语句来输出每次搜索的结果\n\
    \n```java\nSystem.out.println( “\\nFound “ + counter1 + “ titles from this series”\
    \ ) ;\nSystem.out.println( “Found “ + counter2 + “ Java title” ) ;\nSystem.out.println(\
    \ “Found “ + counter3 + “ other titles” ) ;\n```\n\n![image](img/9o.jpg)将程序保存为\
    \ `StringSearch.java`，然后编译并运行程序\n\n![image](img/forget.jpg)\n\n`!` 运算符不能用于测试 `indexOf()`\
    \ 方法是否失败——因为它返回的是整数值，而不是布尔值。\n\n## 操作字符\n\n`java.lang` 包中的 `String` 类提供了 `trim()`\
    \ 方法，用于移除作为参数指定的 `String` 开头结尾的任何空白字符。该方法将移除极端的空格、换行和制表符，返回该 `String` 的修剪版本。\n\
    \n`String` 中的单个字符可以通过指定其在 `String` 中的索引位置作为其 `charAt()` 方法的参数来访问。该方法将 `String`\
    \ 视为字符数组，其中第一个字符位于位置零 ——就像其他从零索引的数组一样。`String` 中的第一个字符可以通过 `charAt(0)` 访问，第二个字符可以通过\
    \ `charAt(1)` 访问，以此此类推。\n\n由于字符索引从零开始，`String` 中的最后一个字符的索引号始终比 `String` 中的字符总少一。这意味着任何\
    \ `String` 的最后一个字符索引号等于 `length() - 1`。因此，名为 `str` 的 `String` 的最后一个字符可以通过 `str.charAt(\
    \ str.length() - 1 )` 访问。\n\n可以使用 `replace()` 方法将 `String` 中所有特定特定字符替换为另一个字符。该方法需要两个参数，指定要替换的字符和要取其位置的字符。例如，要将所有的字母“a”替换为字母“z”，语法为\
    \ `replace( ‘a’ , ‘z’ )`。\n\n`isEmpty()` 方法可以检查 `String` 是否不包含字符。如果 `String` 绝对为空，该方法将返回\
    \ `true`，否则将返回 `false`。\n\n"
