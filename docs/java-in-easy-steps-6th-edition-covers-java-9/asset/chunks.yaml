    ## 引言


    Java™ 编程语言由孙内部系统公司（Sun Microsystems）工程师詹姆斯·高林（James Gosling）于 1990 年首次开发。他不喜欢使用
    C++ 编程语言，因此创建了一种新语言并将其命名为“Oak”（橡树），这是他在办公室窗外看到的一棵橡树。


    ![image](img/pg8_2.jpg)


    随着万维网的普及，Sun 公司意识到 Gosling 的这种语言可以为互联网开发。因此，Sun 公司将该语言重命名为“Java”（仅仅是因为这个名字听起来很酷），并于
    1995 年将其免费开放。全世界的开发者迅速采用了这种令人兴奋的新语言，并且由于其模块化的设计，他们能够创建可以添加到核心语言中的新功能。最受喜爱的额外功能被保留在
    Java 的后续版本中，并使其发展成为今天的全面版本。


    Java 的本质是一个被称为“类”（classes）的文件库，每个类都包含小段现成的、经过验证的代码。这些类中的任何一个都可以像墙上的砖一样整合到新程序中，因此只需要编写少量的新代码即可完成程序。这为程序员节省了大量时间，并在很大程度上解释了
    Java 编程如此流行的原因。此外，这种模块化的安排使得比单一大型程序更容易识别任何错误。


    Java 技术既是一种编程语言，又是一个平台。在 Java 编程中，源代码首先被写为人类可读的纯文本文件，扩展名为 `.java`。这些文件通过 `javac`
    编译器编译成机器可读的 `.class` 文件。然后，`java` 解释器可以通过 Java 虚拟机（Java VM）的实例执行程序：


    ![image](img/pg8_1.jpg)


    ![image](img/new.jpg)


    上述所示的“New”图标表示 Java 最新版本中引入的新功能或增强功能。


    由于 Java VM 适用于许多不同的操作系统，相同的 `.class` 文件能够在 Windows、Linux 和 Mac 操作系统上运行——因此， Java
    程序员在理论上享有“编写一次，随处运行”的跨平台能力。


    为了创建 Java 程序，需要在你的计算机上安装 Java 类库和 `javac` 编译器。为了运行 Java 程序，需要安装 Java 运行时环境（JRE）以提供
    `java` 解释器。所有这些组件都包含在一个免费提供的包中，即 Java 标准版开发工具包（JDK）。


    ![image](img/pg9_1.jpg)


    书中的 Java 程序使用 JDK 9 版本，它包含了开发工具包本身和运行时环境，可以从 Oracle® 网站 `[www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)`
    下载。


    ![image](img/pg9_2.jpg)


    ![image](img/forget.jpg)


    Oracle 下载页面还包含其他包，但开始 Java 编程只需要 JDK 9 包。


    JDK 9 包适用于 Linux、Mac、Solaris 和 Windows 平台的 32 位和 64 位变体——接受 Oracle 许可协议，然后选择适用于你计算机的适当下载
    Java 开发工具包。


    ![image](img/pg9_3.jpg)


    ![image](img/hot.jpg)


    JAVA 代表“另一个模糊的缩写”（Just Another Vague Acronym）的传言并非事实。


    ## 安装 JDK


    从 Oracle® 下载页面为你的系统选择合适的 Java 开发工具包（JDK）包，然后按照以下步骤在你的计算机上安装 Java：


    ![image](img/1b.jpg)卸载系统中任何以前版本的 JDK 和/或 Java 运行时环境（JRE）


    ![image](img/2b.jpg)启动安装并接受许可协议


    ![image](img/3b.jpg)当“自定义设置”（Custom Setup）对话框出现时，要么接受建议的安装位置，要么点击 `Change` 按钮选择你首选的位置——例如
    Windows 系统的 `C:\Java` 或 Linux 系统的 `/usr/Java`


    ![image](img/pg10_1.jpg)


    ![image](img/4b.jpg)确保从列表中选择了 `Public JRE` 和 `Development Tools`（开发工具）功能。可以选择地，你可以取消选择其他功能，因为使用此书开始编程不需要这些功能


    ![image](img/5b.jpg)点击 `Next` 按钮在所选位置安装所有必要的 Java 类库和工具


    ![image](img/snake.jpg)


    系统中可能安装了旧版本的 JRE，以便你的网络浏览器运行 Java 小程序。最好卸载它，以避免与 JDK 9 中的新版本产生混淆。


    ![image](img/hot.jpg)


    你可以从只安装最小的功能开始以免混淆。


    编译和运行 Java 程序的工具通常从命令行提示符操作，并位于 Java 目录下的 `bin` 子目录。可以通过将它们的位置添加到系统路径中使其全范围内可用：


    •在 Windows 上，通过`Control Panel`控制面板、`System`系统、`Advanced System Settings`高级系统设置、`Advanced`高级选项卡、`Environment
    Variables`环境变量进行，然后选择名为“Path”的系统变量。点击 `Edit`（编辑）并将 Java 的 `bin` 子目录的地址添加到列表中（例如
    `C:\Java\bin`），然后点击 `OK` 应用更改。


    •在 Linux 上，通过编辑家目录目录下的 `.bashrc` 文件将 Java 的 `bin` 子目录的位置添加到系统路径。例如，添加 `PATH=$PATH:/usr/Java/bin`
    然后保存文件。


    ![image](img/snake.jpg)


    在旧版本的 Windows 上，包含空格的路径必须用双引号括起来并以分号结束。例如路径`“C:\Program Files\ Java\jdk-9\bin”;`


    现在可以测试环境了：


    ![image](img/1b.jpg)打开命令行提示符，例如 **Windows PowerShell** 或 **Linux Terminal**


    ![image](img/2b.jpg)输入命令 `java -version` 然后按 **Enter** 键查看 Java 解释器的版本号


    ![image](img/3b.jpg)接下来，输入命令 `javac -version` 然后按 **Enter** 键查看 Java 编译器的版本号


    ![image](img/4b.jpg)现在，输入命令 `jshell -version` 然后按 **Enter** 键查看 Java shell 版本号


    ![image](img/5b.jpg)确保所有版本号匹配（9），你已准备好开始 Java 编程了


    ![image](img/pg11_1.jpg)


    ![image](img/hot.jpg)


    如果 Linux 家目录下没有显示 `.bashrc` 文件，请选择查看、显示隐藏文件以显示它。


    ![image](img/new.jpg)


    Java shell `jshell` 是 Java 9 的新功能。这个交互式工具让你快速测试代码片段，而无需先编译代码。它将在下一章中演示 Java 编程中的各种“运算符”。


    ## 编写第一个 Java 程序


    所有的 Java 程序都从文本文件开始，随后用于创建“类”文件，这些才是的可运行程序。这意味着 Java 程序可以用任何纯文本编辑器编写，例如 Windows
    记事本程序。


