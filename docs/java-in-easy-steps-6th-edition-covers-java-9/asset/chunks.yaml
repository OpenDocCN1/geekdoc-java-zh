    \ the text size `android:textSize=”32sp”`\n\n![image](images/5g.jpg)\nClick `Build`,\
    \ `Rebuild Project` to apply the change, then run the app in the emulator once\
    \ more to see the solution\n\n![image](images/pg182_3.jpg)\n\n![image](images/pg182_4.jpg)\n\
    \n![image](images/snake.jpg)\n\nCreation of each AVD emulator may require a large\
