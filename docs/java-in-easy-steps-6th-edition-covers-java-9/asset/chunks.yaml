    ![image](images/6v.jpg)Create a **BufferedReader** object to read the file


    **BufferedReader buffer = new BufferedReader( file ) ;**


    ![image](images/7v.jpg)Declare and initialize an empty **String** variable in
    which to store a line of text


    **String line = ““ ;**


    ![image](images/8v.jpg)Add a loop to read the text file contents into the variable
