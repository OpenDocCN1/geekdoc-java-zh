    # Preface


    The creation of this book has provided me, Mike McGrath, a welcome opportunity
    to update my previous books on Java with the latest techniques. All examples I
    have given in this book demonstrate features supported by current compilers on
    both Windows and Linux systems, and the book’s screenshots illustrate the actual
    results produced by compiling and executing the code.


    ## Conventions in this book


    In order to clarify the code listed in example, I have adopted certain colorization
    conventions. Components of the Java language itself are colored blue; programmer-specified
    names are red; numeric and string values are black; and comments are green, like
    this:


    ```java

    // Store then output a text string.

    String message = "Welcome to Java programming!";

    System.out.println(message);

    ```


    Additionally, in order to identify each source code file described in the steps,
    a colored icon and file name appears in the margin alongside the steps, like these:


    ![](images/pg6_1.jpg) App.java

    ![](images/pg6_2.jpg) App.class

    ![](images/pg6_3.jpg) App.jar

    ![](images/pg6_4.jpg) App.xml


    ## Grabbing the source code


    For convenience, I have placed source code files from the examples featured in
    this book into a single ZIP` archive. You can obtain the complete archive by following
    these easy steps:


    ![image](images/1lg.jpg)

    Browse to **[www.ineasysteps.com](https://www.ineasysteps.com)** then navigate
    to Free Resources and choose the Downloads section


    ![image](images/2lg.jpg)

    Find Java in easy steps, 6th Edition in the list, then click on the hyperlink
    entitled All Code Examples to download the archive


    ![image](images/3lg.jpg)

    Now, extract the archive contents to any convenient location on your computer

