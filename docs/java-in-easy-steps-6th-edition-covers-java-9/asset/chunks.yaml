    ## Arranging components


    The `java.awt` package (Abstract Window) contains a number of layout manager classes
    that can be used to place components in a container in different ways. A layout
    manager object is created using the `new` keyword, and can then be specified as
    the argument to a `JPanel` constructor to have the panel use that layout. When
    components get added to the panel they will be placed according to the rules of
    the specified layout manager.


    | Layout Manager | Rules |

    | :--- | :--- |

    | `BorderLayout` | Places North, South, East and Center (the content pane default)
    |

    | `BoxLayout` | Places in a single row or column |

    | `CardLayout` | Places different components in a specified area at different
    times |

    | `FlowLayout` | Places left to right in a wrapping line (the `JPanel` default)
    |

    | `GridBagLayout` | Places in a grid of cells, allowing components to span cells
    |

    | `GridLayout` | Places in a grid of rows and columns |

    | `GroupLayout` | Places horizontally and vertically |

    | `SpringLayout` | Places by spacing |


    The top level `JFrame` object has a “content pane” container that places components
    using the `BorderLayout` layout manager by default. This can be used to place
    up to five `JPanel` containers, which may each use their default `FlowLayout`
    layout manager, or any of the layout managers above. Using a variety of layout
    managers accommodates most layout requirements.


    The content pane can be represented by a `java.awt.Container` object, whose `add()`
    method can specify the position and name of a component to be placed within the
    content pane.


    ![image](images/forget.jpg)


    You can find further details of each layout manager in the `java.awt` section
    of the Java documentation.


    ![image](images/1b.jpg)


    ## Changing appearance


    Edit a copy of `Window.java` from [here](#chapter08.html_pg135), changing the
    class declaration, constructor, and instance from “Window” to “Layout”, then add
    a statement at the start of the program to import the functionality of the `java.awt`
    package.


    ```

    import java.awt.*;

    ```


    ![image](images/java.jpg)


    Layout.java


    ![image](images/2b.jpg)


    Before the `Layout()` constructor, create a `Container` object representing the
    `JFrame` content pane container.


    ```

    Container contentPane = getContentPane();

    ```


    ![image](images/3b.jpg)


    Create a second `JPanel` object using a `GridLayout` layout manager in a 2 x 2
    grid.


    ```

    JPanel grid = new JPanel( new GridLayout( 2 , 2 ) );

    ```


    ![image](images/4b.jpg)


    In the `Layout()` constructor method, insert statements adding `JButton` components
    to both `JPanel` objects.


    ```

    pnl.add( new JButton("Yes") );

    pnl.add( new JButton("No") );

    pnl.add( new JButton("Cancel") );

    grid.add( new JButton("1") );

    grid.add( new JButton("2") );

    grid.add( new JButton("3") );

    grid.add( new JButton("4") );

    ```


    ![image](images/5b.jpg)


    Now, insert statements adding both panels and a button to the content pane.


    ```

    contentPane.add("North", pnl );

    contentPane.add("Center", grid );

    contentPane.add("West", new JButton("West") );

    ```


    ![image](images/6b.jpg)


    Save the program as `Layout.java` then compile and run the program to see the
    component layout.


    ![image](images/pg147_1.jpg)


    ![image](images/snake.jpg)


    While the `FlowLayout` maintains the `JButton` size, other layout managers expand
    the components to fill their layout design.


    The `ButtonGroup` object only groups buttons logically, not physically.


    ![image](images/pg45_1.jpg)

    ![image](images/pg45_2.jpg)


    ### The JLabel component


    Details of how to create event-handler methods to respond to user actions can
    be found in the next chapter.


    Note that the background of `JLabel` is transparent, so the `setOpaque()` method
    should be called to set the opacity to `true`.


    ![image](images/5b.jpg)

    ![image](images/pg45_3.jpg)

    ![image](images/pg45_4.jpg)

    ![image](images/pg45_5.jpg)

    ![image](images/hot.jpg)


    The previous pages have demonstrated the most common Swing components – `JButton`,
    `JLabel`, `JTextField`, `JComboBox`, `JList`. There are many more specialized
    components available in the `javax.swing` package – `JSlider`, `ProgressBar`,
    and `JMenuBar`.


    Try using the Java documentation to add a `JSlider` component to the `Radios`
    program – see [here](#chapter05.html_sec38) for details on how to use the documentation.

