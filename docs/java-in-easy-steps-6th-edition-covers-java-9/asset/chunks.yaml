    **Writing files**


    In the **java.io** package the **FileReader** and **BufferedReader** classes,
    which are used to read text files, have counterparts named **FileWriter** and
    **BufferedWriter** that can be used to write text files.


    A **FileWriter** object is created using the **new** keyword, and takes the name
    of the file to be written as its argument. Optionally, the argument can include
    the full path to a file to be written in a directory outside that in which the
    program is located.'
