  trans: "\n\n可选地，`switch` 语句可以包含一个使用 `default` 关键字的选项，用于指定当指定变量的值与任何 `case` 选项匹配时不执行的语句。\n\
    \n每个选项都以 `case` 关键字和一个用于匹配的值开始。随后是一个冒号 `:` 字符以及在匹配成功时要执行的语句（如果有的话）。\n\n重要的一点是，与每个\
    \ `case` 选项关联的语句或语句块必须由 `break` 关键字终止。否则，程序将在匹配的选项之后继续执行其他 `case` 选项的语句。有时，这种特性用于指定多个\
    \ `case` 选项，让它们在匹配时各自执行相同的语句是有用的。例如，对于每三个选项的块使用如下的语句：\n\n```java\nswitch (test-variable)\n\
    {\n    case value1: case value2: case value3:\n        code-A-to-be-executed-when-true\
    \ ; break ;\n    case value4: case value5: case value6:\n        code-B-to-be-executed-when-true\
    \ ; break ;\n}\n```\n\n![image](img/snake.jpg)\n\n缺失 `break` 关键字并不是语法错误——请确保 `switch`\
    \ 块中存在所有预期的 `break` 以避免意外结果。\n\n![image](img/1g.jpg)创建一个名为“Switch”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass Switch\n{\n    public static void main ( String[]\
    \ args ) {\n    }\n}\n```\n\n![image](img/java.jpg)\n\nSwitch.java\n\n![image](img/2g.jpg)在\
    \ main 方法内部，声明并初始化三个整数变量\n\n```java\nint month = 2, year = 2018, num = 31 ;\n\
    ```\n\n![image](img/3g.jpg)添加一个 switch 语句块来测试赋值给 `month` 变量的值\n\n```java\nswitch\
    \ ( month )\n{\n}\n```\n\n![image](img/4g.jpg)在 switch 块内部，插入 `case` 选项，为第 4、6、9\
    \ 和 11 个份的 `num` 变量赋一个新值\n\n```java\ncase 4 : case 6 : case 9 : case 11 : num\
    \ = 30 ; break ;\n```\n\n![image](img/5g.jpg)根据 `year` 的值，插入一个 `case` 选项为第 2 个份的\
    \ `num` 变量赋一个新值\n\n```java\ncase 2 : num = ( year % 4 == 0 ) ? 29 : 28 ; break\
    \ ;\n```\n\n![image](img/6g.jpg)在 switch 块之后、main 方法的末尾，添加此行以输出三个整数值\n\n```java\n\
    System.out.println( month+“/”+year+“: ”+num+“days” ) ;\n```\n\n![image](img/7g.jpg)将程序保存为\
    \ Switch.java，然后编译并运行程序查看输出。\n\n![image](img/pg49_1.jpg)\n\n![image](img/hot.jpg)\n\
    \n注意所有三个整数变量是如何使用方便的简写在这里内联声明并初始化的。\n\n![image](img/forget.jpg)条件运算符在步骤 5 中效果非常好。你可以返回这里\
    \ 回顾它是如何工作的。\n\n## for 循环\n\n循环是一个代码块，它重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下个任务。\n\
    \n![image](img/arrowg.jpg)\n\nJava 编程中最常用的循环结构是使用 `for` 关键字，其语法如下：\n\n```java\n\
    for (initializer ; test-expression ; updater)\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\n```\n\n`for` 关键字后面的括号必须包含三个建立循环性能的控制部分：\n\n*   初始化器（Initializer）——为计数器变量分配初始值，该变量将记录此循环执行的次数。为此目的的变量可以在此处声明，传统上是一个命名为\
    \ `i` 的“简单”整数变量。\n*   测试表达式（Test expression）——在循环每次迭代开始时被评估为布尔 `true` 值。当评估返回\
    \ `true` 时，迭代继续；但当返回 `false` 时，循环立即终止，而不完成该次迭代。\n*   更新器（Updater）——由初始化器开始更改计数器变量的当前值，维护该循环执行次数的运行数。通常，这将使用\
    \ `i++` 递增，或使用 `i--` 递减。\n\n在循环每次迭代中执行的代码可以是单个语句、语句块，甚至是另一个“嵌套”循环。\n\n每个循环必须在某点能够使测试表达式返回\
    \ `false`——否则将创建一个无限循环，它将无情地执行其语句。通常，测试表达式会评估计数器变量的当前值为执行指定次数的迭代。例如，计数器 `i` 初始化为\
    \ 1 每次迭代加 1，测试表达式 `i < 11` 在 10 次迭代后变为 `false`——因此该循环在结束前将执行 10 次其语句。\n\n![image](img/hot.jpg)\n\
    \n更新器通常被称为“递增器”，因为它经常是递增而非减少计数器变量。![image](img/1g.jpg)创建一个名为“For”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass For\n{\n    public static void main ( String[] args\
    \ ) {\n    }\n}\n```\n\n![image](img/java.jpg)\n\nFor.java\n\n![image](img/2g.jpg)在\
    \ main 方法内部，声明并初始化一个整数变量来计算迭代的总数\n\n```java\nint num = 0 ;\n```\n\n![image](img/3g.jpg)添加一个\
    \ `for` 循环执行三次迭代，并在每次迭代中显示其计数器变量 `i` 的当前值\n\n```java\nfor ( int i = 1 ; i < 4\
    \ ; i++)\n{\n    System.out.println( “Outer Loop=” + i ) ;\n}\n```\n\n![image](img/4g.jpg)在\
    \ `for` 块内部插入一个嵌套的 `for` 循环执行三次迭代，显示其计数器变量 `j` 的当前值和迭代总数\n\n```java\nfor ( int\
    \ j = 1 ; j < 4 ; j++)\n{\n    System.out.print( “tInner Loop j=” + j ) ;\n  \
    \  System.out.println( “t\\tTotal num=”++num) ) ;\n}\n```\n\n![image](img/5g.jpg)将程序保存为\
    \ For.java，然后编译并运行程序查看输出。\n\n![image](img/pg51_1.jpg)\n\n![image](img/snake.jpg)\n\
    \n递增 `++` 和递减 `--` 运算符可以前缀变量以立即更改其值，也可以后缀变量——在其引用时才更改。尝试将此示例中的递增运算符改为 `++i` 和\
    \ `++j` 来查看差异。\n\n## while true 循环\n\n另一种 `for` 循环结构，见此处\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\n```\n\n与 `for` 循环一样，`while` 循环重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下个任务。\n\
    \n测试表达式在循环每次迭代开始时被评估为布尔 `true` 值。当评估返回 `true` 时，迭代继续；但当返回 `false` 时，循环立即终止，而不完成该次迭代。\n\
    \n注意，如果测试表达式在第一次评估时返回 `false`，则循环语句永远不会执行。\n\n"
- fmt: "\nA `while` loop can be made to resemble the structure of a `for` loop, to\
    \ evaluate a counter variable in its test expression, by creating a counter variable\
    \ outside the loop and changing its value within the statements it executes on\
    \ each iteration. For example, the outer `for` loop in the previous example can\
    \ be recreated as a `while` loop, like this:\n\n```java\nint i = 1 ;\nwhile (\
    \ i < 4 )\n{\n    System.out.println( “Outer Loop i=” +i ) ;\n    i++ ;\n}\n```\n\
    \nThis positions the counter initializer externally, before the while loop structure,\
    \ and its updater within the statement block.\n\n![image](images/snake.jpg)\n\n\
    An infinite loop will lock the program as it continues to perform iterations –\
    \ on Windows, press `Ctrl + C` to halt.\n\n![image](images/1g.jpg)Start a new\
    \ program named “While” containing the standard main method\n\n```java\nclass\
    \ While\n{\n    public static void main ( String[] args ) {    }\n}\n```\n\n![image](images/java.jpg)\n\
    While.java\n\n![image](images/2g.jpg)Inside the main method, declare and initialize\
    \ an integer variable named `num`\n\n```java\nint num = 100 ;\n```\n\n![image](images/3g.jpg)Add\
    \ a `while` loop to display the `num` variable’s current value while it remains\
    \ above zero\n\n```java\nwhile ( num > 0 )\n{\n    System.out.println( “While\
    \ Countdown: ” + num ) ;\n}\n```\n\n![image](images/4g.jpg)Insert an updater at\
    \ the end of the `while` loop block to decrease the `num` variable’s value by\
    \ 10 on each iteration – thereby avoiding an infinite loop\n\n```java\nnum -=\
    \ 10 ;\n```\n\n![image](images/5g.jpg)Save the program as `While.java` then compile\
    \ and run the program to see the output\n\n![image](images/pg53_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe assignment in this updater is shorthand for `num = ( num - 10 )`.\n\n##\
    \ Doing do-while loops\n\nA variation of the `while` loop structure, described\
    \ [here](#chapter03.html_pg53) , employs the `do` keyword to create a loop with\
    \ this syntax:\n\n```java\ndo\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\nwhile ( test-expression ) ;\n```\n\nLike the `for` loop and `while` loop,\
    \ a `do while` loop repeatedly executes the statements it contains until a tested\
    \ condition is met – then the loop ends and the program proceeds to its next task.\n\
    \nUnlike the `for` loop and `while` loop, the `do while` test expression appears\
    \ after the block containing the statements to be executed. The test expression\
    \ is evaluated at the end of each iteration of the loop for a Boolean `true`.\
    \ When the evaluation returns `true` the next iteration proceeds but when it returns\
    \ `false` the loop is immediately terminated. This means that the statements in\
    \ a `do while` loop are always executed at least once.\n\nNote that if the test\
    \ expression returns `false` when it is first evaluated, the loop statements have\
    \ already been executed once.\n\nA `do while` loop can be made to resemble the\
    \ structure of a `for` loop, to evaluate a counter variable in its test expression,\
    \ by positioning the counter initializer outside the loop structure and its updater\
    \ within the statement block – just as with a `while` loop.\n\nAll `for`, `while`,\
    \ or `do while` loop structures containing just one statement to execute may,\
    \ optionally, omit the curly brackets around the statement. But, if omitted, you\
    \ will need to add curly brackets if additional statements are added to the loop\
    \ later.\n\nThe choice of `for`, `while`, or `do while` loop is largely a matter\
    \ of personal coding preference and purpose. A `for` loop structure conveniently\
    \ locates the counter initializer, test expression, and updater in the parentheses\
    \ after the `for` keyword. A `while` loop structure can be more concise – but\
    \ you must remember to include an updater in the loop’s statements to avoid an\
    \ infinite loop. A `do while` loop simply adds the benefit of executing its statements\
    \ once before evaluating its test expression – demonstrated by the `do while`\
    \ loop described opposite.\n\n![image](images/hot.jpg)\n\nAlways enclose the statements\
    \ to be executed by a loop within curly brackets – for clarity and improved code\
    \ maintainability.\n\n![image](images/1g.jpg)Start a new program named “DoWhile”\
    \ containing the standard main method\n\n```java\nclass DoWhile\n{\n    public\
    \ static void main ( String[] args ) {    }\n}\n```\n\n![image](images/java.jpg)\n\
    DoWhile.java\n\n![image](images/2g.jpg)Inside the main method, declare and initialize\
    \ an integer variable named `num`\n\n```java\nint num = 100 ;\n```\n\n![image](images/3g.jpg)Add\
    \ a `do while` loop to display the `num` variable’s current value while it is\
    \ below 10\n\n```java\ndo\n{\n    System.out.println( “DoWhile Countup: ” + num\
    \ ) ;\n}\nwhile ( num < 10 ) ;\n```\n\n![image](images/4g.jpg)Insert an updater\
    \ at the end of the `while` loop block to decrease the `num` variable’s value\
    \ by 10 on each iteration – thereby avoiding an infinite loop\n\n```java\nnum\
    \ += 10 ;\n```\n\n![image](images/5g.jpg)Save the program as `DoWhile.java` then\
    \ compile and run the program to see the output\n\n![image](images/pg53_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nThe assignment in this updater is shorthand for\
    \ `num = num + 10`.\n\n## Breaking out of loops\n\nThe `break` keyword can be\
    \ used to prematurely terminate a loop when a specified condition is met. The\
    \ `break` statement is situated inside the loop block and is preceded by a test\
    \ expression. When the test returns `true`, the loop ends and the program proceeds\
    \ to its next task.\n\n![image](images/1g.jpg)Start a new program named “Break”\
    \ containing the standard main method\n\n```java\nclass Break\n{\n    public static\
    \ void main ( String[] args ) {    }\n}\n```\n\n![image](images/java.jpg)\nBreak.java\n\
    \n![image](images/2g.jpg)Inside the main method, create two nested `for` loops\
    \ that display their counter values on each iteration\n\n```java\nfor ( int i\
    \ = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n       \
    \ System.out.println( “Running i=”+i+“ j=”+j ) ;\n    }\n}\n```\n\n![image](images/3g.jpg)Save\
    \ the program as `Break.java` then compile and run the program to see the output\n\
    \n![image](images/pg53_1.jpg)\n\nThis program makes three iterations of the outer\
    \ loop, which executes the inner loop on each iteration. A `break` statement can\
    \ be added to stop the second execution of the inner loop.\n\n![image](images/4g.jpg)Add\
    \ this `break` statement to the beginning of the inner loop block, to break out\
    \ the inner loop\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int\
    \ j = 1 ; j < 4 ; j++ )\n    {\n        if ( i == 2 && j == 1 )\n        {\n \
    \           System.out.println( “Breaks innerLoop when i=”+i+“ j=”+j ) ;\n   \
    \         break ;\n        }\n    }\n}\n```\n\n![image](images/5g.jpg)\n![image](images/pg53_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nHere, the `break` statement halts all three iterations\
    \ of the inner loop when the outer loop tries to run it the second time.\n\nThe\
    \ `continue` keyword can be used to skip a single iteration of a loop when a specified\
    \ condition is met. The `continue` statement is situated inside the loop statement\
    \ block and is preceded by a test expression. When the test returns `true`, that\
    \ iteration ends.\n\n![image](images/5g.jpg)Add this `continue` statement to the\
    \ beginning of the inner loop block, to skip the first iteration of the inner\
    \ loop\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j\
    \ < 4 ; j++ )\n    {\n        if ( i == 1 && j == 1 )\n        {\n           \
    \ System.out.println( “Continues innerLoop when i=”+i+“ j=”+j ) ;\n          \
    \  continue;\n        }\n    }\n}\n```\n\n![image](images/pg53_2.jpg)\n\n![image](images/forget.jpg)\n\
    \nHere, the `continue` statement skips just the first iteration of the inner loop\
    \ when the outer loop tries to run it for the first time.\n\n## Returning control\n\
    \nThe default behavior of the `break` and `continue` keywords can be changed to\
    \ explicitly specify that control should return to a labeled outer loop by stating\
    \ its label name.\n"
