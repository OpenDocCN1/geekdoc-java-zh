  trans: "\n\n![image](img/2p.jpg)在 `main` 方法中，编写一个 `if` 语句，当参数数量不足（在此情况下为三个）时，输出建议并退出程序。\n\
    \n```java\nif ( args.length != 3 )\n{\n    System.out.println( “Wrong number of\
    \ arguments” ) ; return ;\n}\n```\n\n![image](img/3p.jpg)在 `if` 语句下方创建两个 `int`\
    \ 变量——分别用第一个和第三个参数的值初始化\n\n```java\nint num1 = Integer.parseInt( args[0] ) ;\n\
    int num2 = Integer.parseInt( args[2] ) ;\n```\n\n![image](img/4p.jpg)添加一个 `String`\
    \ 变量，用三个参数的拼接字符串进行初始化\n\n```java\nString msg = args[0] + args[1] + args[2] + “=”\
    \ ;\n```\n\n![image](img/hot.jpg)\n\n`return` 关键字用于退出当前方法。它还可以将值返回到调用方法的地方。更多详情请参阅此处。\n\
    \n![image](img/5p.jpg)添加此 `if else` 语句对参数进行算术运算并将结果追加到 `String` 变量中\n\n```java\n\
    if ( args[1].equals(“+”) )             msg += (num1 + num2);\nelse if ( args[1].equals(“-”)\
    \ )  msg += (num1 - num2) ;\nelse if ( args[1].equals(“x”) )     msg += (num1\
    \ * num2) ;\nelse if ( args[1].equals(“/”) )     msg += (num1 / num2) ;\nelse\
    \ msg = “Incorrect operator” ;\n```\n\n![image](img/6p.jpg)在 `main` 方法末尾插入此行以显示追加的\
    \ `String`\n\n```java\nSystem.out.println( msg ) ;\n```\n\n![image](img/7p.jpg)将程序保存为\
    \ `Args.java`，然后使用三个参数编译并运行程序——一个整数、任意一个算术符号 + - x / 以及另一个整数\n\n![image](img/pg69_1.jpg)\n\
    \n![image](img/8p.jpg)现在，使用错误的第二个参数和错误的参数数量运行程序\n\n![image](img/pg69_2.jpg)\n\n\
    ![image](img/hot.jpg)\n\n如果输入非数字值，此程序将报告错误。有关如何捕获错误的详情，请参阅此处。\n\n### 遍历元素\n\n\
    所有类型的循环都可以轻松地读取数组元素中存储的所有值。循环计数器应该从第一个元素的索引号开始，一直进行到最后一个索引号。数组中最后一个元素的索引号始终比数组长度少\
    \ 1——因为索引从零开始。\n\n![image](img/arrowp.jpg)\n\n将数组的 `length` 属性设置为循环的条件测试，以决定循环何时结束是非常很有用的。这意味着循环将持续，直到计数器值超过数组最后一个元素的索引号。\n\
    \n![image](img/1p.jpg)开始一个名为“Loops”的新程序，其中包含标准的 `main` 方法\n\n```java\nclass Loops\n\
    {\n    public static void main ( String[] args ) {     }\n}\n```\n\n![image](img/java.jpg)\n\
    \nLoops.java\n\n![image](img/2p.jpg)在 `main` 方法中，编写一个 `if` 语句来测试是否从命令行向 `args[]`\
    \ 数组输入了任何参数值\n\n```java\nif ( args.length > 0 ) {     }\n```\n\n![image](img/3p.jpg)在\
    \ `if` 语句的大括号内插入一个 `for` 循环，输出存储在每个元素中的值\n\n```java\nfor ( int i = 0 ; i < args.length\
    \ ; i++ )\n{\n    System.out.println( “args[“+i+ “] is |+ args[i] ) ;\n}\n```\n\
    \n![image](img/4p.jpg)将程序保存为 `Loops.java`，然后编译程序并使用参数 `Java in easy steps` 运行\n\
    \n![image](img/pg70_1.jpg)\n\n![image](img/5p.jpg)编辑 `Loops.java` 添加一个 `String`\
    \ 数组和一个 `while` 循环，输出存储在每个元素中的值\n\n```java\nString[] htm = { “HTML5”, “in”, “easy”,\
    \ “steps” } ;\nint j = 0 ;\nwhile ( j < htm.length )\n{\n    System.out.println(\
    \ “htm[“+j+ “] is | “ + htm[j] ) ;\n    j++ ;\n}\n```\n\n![image](img/6p.jpg)保存更改，然后重新编译并运行程序\n\
    \n![image](img/pg71_1.jpg)\n\n![image](img/7p.jpg)编辑 `Loops.java` 添加另一个 `String`\
    \ 数组和一个 `do while` 循环，输出存储在每个元素中的值\n\n```java\nString[] xml = { “XML”, “in”, “easy”,\
    \ “steps” } ;\nint k = 0 ;\nif ( xml.length > 0 ) do\n{\n    System.out.println(\
    \ “xml[“+k+“] is |+xml[k] ) ;\n    k++;\n} while ( k < xml.length ) ;\n```\n\n\
    ![image](img/8p.jpg)保存更改，然后重新编译并运行程序\n\n![image](img/pg71_2)\n\n![image](img/hot.jpg)注意\
    \ `do` 语句之前有一个条件测试，以确保数组在尝试输出时不为空。\n\n### 修改元素\n\n数组中存储的值可以通过给特定索引赋值新值来更改。此外，可以使用任何类型的循环来填充数组元素。\n\
    \n![image](img/1p.jpg)开始一个名为“Elements”的新程序，包含标准的 `main` 方法\n\n```java\nclass Elements\n\
    {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](img/java.jpg)\n\
    \nElements.java\n\n![image](img/2p.jpg)在 `main` 方法中，创建一个包含 12 个元素的空 `int` 数组用于合并销售额，以及一个记录总计的\
    \ `int` 变量\n\n```java\nint[] sum = new int[12];\nint total = 0;\n```\n\n![image](img/3p.jpg)添加一个\
    \ `for` 循环，用其他数组填充空数组\n\n```java\nfor ( int i = 0 ; i < kioskq1.length ; i++ )\n\
    {\n    sum[i] = kioskq1[i] + outletq1[i];\n    sum[i+3] = kioskq2[i] + outletq2[i];\n\
    \    sum[i+6] = kioskq3[i] + outletq3[i];\n    sum[i+9] = kioskq4[i] + outletq4[i];\n\
    }\n```\n\n![image](img/4p.jpg)接下来，添加第二个 `for` 循环以输出每个合并销售额，并计算它们的总计\n\n```java\n\
    for ( int i = 0 ; i < sum.length ; i++ )\n{\n    System.out.println( “Month \"\
    + ( i+1 ) + ” sales:\\t” + sum[i] ) ;\n    total += sum[i];\n}\n```\n\n![image](img/5p.jpg)在\
    \ `main` 方法末尾插入最后的语句以输出总计\n\n```java\nSystem.out.println( “TOTAL YEAR SALES\\\
    t” + total );\n```\n\n![image](img/6p.jpg)将程序保存为 `Elements.java`，然后编译并运行以查看输出\n\
    \n### 添加数组维度\n\n可以创建数组来存储多组元素值，每组都有它们自己的索引维度。多维数组中使用每个维度的相应索引号来访问单个值。例如 `num [1]\
    \ [3]`。\n\n二维数组可能用于记录年度内每天的整数值，按周组织。这需要一个包含 52 个元素（每周一个）的数组，每个元素包含一个 7 个元素的数组（每天一个）。它的声明如下：\n\
    \n```java\nint[][] dailyRecord = new int [52] [7] ;\n```\n\n![image](img/snake.jpg)\n\
    \n避免在数组中使用超过三个维度——这会令人困惑。\n\n"
- fmt: "\nThis “array of arrays” provides an element for each business day. Values\
    \ are assigned to a multi-dimensional array by stating the appropriate index numbers\
    \ of each dimension. With the example above, for instance, a value can be assigned\
    \ to the first day of the sixth week like this:\n\n```java\ndailyRecord [5] [0]\
    \ = 5000 ;\n```\n\nEach array has its own `length` property that can be accessed\
    \ by specifying the dimension required. For the example above, the syntax `dailyRecord.length`\
    \ returns a value 52 – the size of the first dimension. To access the size of\
    \ the second dimension, the syntax `dailyRecord[0].length` returns the value of\
    \ seven.\n\n![image](images/array.jpg)\n\nTwo-dimensional arrays are often used\
    \ to store grid coordinates, where one dimension represents the X axis and the\
    \ other dimension represents the Y axis. For example, `point[3][5]`.\n\nThree-dimensional\
    \ arrays can be used to store XYZ coordinates in a similar way, but it can be\
    \ difficult to visualize `point[4][8][2]`.\n\nNested loops are perfectly suited\
    \ to multi-dimensional arrays, as each loop level can address the elements of\
    \ each array dimension.\n\n![image](images/1p.jpg)Start a new program named “Dimensions”\
    \ containing the standard main method\n\n```java\nclass Dimensions\n{\n    public\
    \ static void main ( String[] args ) {    }\n}\n```\n\n![image](images/java.jpg)\n\
    \nDimensions.java\n\n![image](images/2p.jpg)In the main method, create a two-dimensional\
    \ array to store Boolean flats relating to XY coordinates\n\n```java\nboolean[][]\
    \ points = new boolean[5][20] ;\n```\n\n![image](images/3p.jpg)Define one Y point\
    \ on each X axis\n\n```java\npoints[0][5] = true ;\npoints[1][6] = true ;\npoints[2][7]\
