    You cannot address the `motion` variable directly – it is out of scope within
    the method.


    A virtual class is created for the new `Porsche` object that replicates the original
    `Car` class. Both these objects contain static “class variables” and a “class
    method”, which are addressed using the class name and dot notation – as these
    members are globally accessible, this is not considered programming practice.


    Whilst this example demonstrates how instances of an object inherit properties
    of the original class, it is improved in the next example [here](#chapter06.html_sec53)
