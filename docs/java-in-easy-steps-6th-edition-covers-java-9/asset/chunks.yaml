  raw: 'This “array of arrays” provides an element for each business day. Values are
    assigned to a multi-dimensional array by stating the appropriate index numbers
    of each dimension. With the example above, for instance, a value can be assigned
    to the first day of the sixth week like this:


    **dailyRecord [5] [0] = 5000 ;**


    Each array has its own **length** property that can be accessed by specifying
    the dimension required. For the example above, the syntax **dailyRecord.length**
    returns a value 52 – the size of the first dimension. To access the size of the
    second dimension, the syntax **dailyRecord[0].length** returns the value of seven.


    ![image](images/array.jpg)


    Two-dimensional arrays are often used to store grid coordinates, where one dimension
    represents the X axis and the other dimension represents the Y axis. For example,
    **point[3][5]**.


    Three-dimensional arrays can be used to store XYZ coordinates in a similar way,
    but it can be difficult to visualize **point[4][8][2]**.


    Nested loops are perfectly suited to multi-dimensional arrays, as each loop level
    can address the elements of each array dimension.


    ![image](images/1p.jpg)Start a new program named “Dimensions” containing the standard
    main method


    **class Dimensions**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


    ![image](images/java.jpg)


    Dimensions.java


    ![image](images/2p.jpg)In the main method, create a two-dimensional array to store
    Boolean flats relating to XY coordinates


    **boolean[][] points = new boolean[5][20] ;**


    ![image](images/3p.jpg)Define one Y point on each X axis


    **points[0][5] = true ;**


    **points[1][6] = true ;**


    **points[2][7] = true ;**


    **points[3][8] = true ;**


    **points[4][9] = true ;**


    ![image](images/4p.jpg)Add a **for** loop to iterate through the first array index,
    adding a newline character at the end of each iteration


    **for ( int i = 0 ; i < points.length ; i++ )**


    **{**


    **System.out.print( “\n” ) ;**


    **}**


    ![image](images/5p.jpg)Within the curly brackets of the **for** loop, insert a
    second **for** loop to iterate through the second array index


    **for ( int j = 0 ; j < points[0].length ; j++ ) {      }**


    ![image](images/6p.jpg)Within the curly brackets of the second **for** loop, insert
    a statement to output a character for each element according to that element’s
    Boolean value


    **char mark = ( points[i][j] ) ? ‘X’ : ‘-’ ;**


    **System.out.print( mark ) ;**


    ![image](images/7p.jpg)Save the program as **Dimensions.java** then compile and
    run the program to see the output


    ![image](images/pg75_1.jpg)


    ![image](images/forget.jpg)


    Boolean variables are **false** by default.


    **Catching exceptions**


    A program may encounter a runtime problem that causes an “exception” error, which
    halts its execution. Often, this will be created by unexpected user input. A well-written
    program should, therefore, attempt to anticipate all possible ways the user might
    cause exceptions at runtime.


    Code where exceptions might arise can be identified and enclosed within a **try
    catch** statement block. This allows the program to handle exceptions without
    halting execution and looks like this:


    **try**


    **{**


    *statements where an exception may arise*


    **}**


    **catch( Exception e )**


    **{**


    *statements responding to an exception*


    **}**


    The parentheses following the **catch** keyword specify the class of exception
    to be caught and assign it to the variable “e”. The top-level **Exception** class
    catches all exceptions. Responses can be provided for specific exceptions, however,
    using multiple **catch** statements to identify different lower-level exception
    classes.


    The most common exceptions are the **NumberFormatException**, which arises when
    the program encounters a value that is not of the expected numeric type, and the
    **ArrayIndexOutOfBoundsException**, which arises when the program attempts to
    address an array element number that is outside the index size. It is helpful
    to create a separate response for each of these exceptions to readily notify the
    user about the nature of the problem.


    Optionally, a **try catch** statement block can be extended with a **finally**
    statement block, containing code that will always be executed – irrespective of
    whether the program has encountered exceptions.


    ![image](images/hot.jpg)


    The **e.getMessage()** method returns further information about some captured
    exceptions.


    ![image](images/1p.jpg)Start a new program named “Exceptions” containing the standard
    main method


    **class Exceptions**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


    ![image](images/java.jpg)


    Exceptions.java


    ![image](images/2p.jpg)Inside the main method, write a **try** statement to output
    a single integer argument


    **try**


    **{**


    **int num = Integer.parseInt( args[0] ) ;**


    **System.out.println( “You entered: “+ num ) ;**


    **}**


    ![image](images/3p.jpg)Add a **catch** statement to handle the exception that
    arises when the program is run without an argument


    **catch( ArrayIndexOutOfBoundsException e )**


    **{ System.out.println( “Integer argument required.” ) ;     }**


    ![image](images/4p.jpg)Add a **catch** statement to handle the exception that
    arises when the program is run with a non-integer argument


    **catch( NumberFormatException e )**


    **{ System.out.println( “Argument is wrong format.” ) ;     }**


    ![image](images/5p.jpg)Add a **finally** statement at the end of the program


    **finally { System.out.println( “Program ends.” ) ;     }**


    ![image](images/6p.jpg)Save the program as **Exceptions.java** then compile and
    run the program, trying to cause exceptions


    ![image](images/pg77_1.jpg)


    **Summary**


    •Numeric values can be converted to other numeric data types by casting, and to
    the **String** type using the **toString()** method.


    •A **String** value can be converted to an **int** value using the **Integer.parseInt()**
    method, and to a **float** using **Float. parseFloat()**.


    •An array is a variable that can contain multiple values, initialized as a list
    within curly brackets in its declaration.


    •An empty array object can be created using the **new** keyword.


    •The **length** property of an array stores an integer, which is the number of
    elements in that array.


    •Each element of an array can be addressed by its index number.


    •A program’s **main** method creates a **String** array, traditionally named “args”,
    to store command line arguments.


    •The first command line argument gets automatically stored in the **args[0]**
    element – as a **String** data type.


    •Multiple arguments being passed to a program from the command line must each
    be separated by a space.


    •Loops are an ideal way to read all the values stored within array elements.


    •Data from multiple arrays can be combined to form a new array of totaled data
    in each element.


    •Multi-dimensional arrays can store multiple sets of element values, each having
    their own index dimension.


    •A **try catch** statement block is used to anticipate and handle runtime exceptions
    that may arise.


    •The **Exception** class catches all exception errors, including **NumberFormatException**
    and **ArrayIndexOutOfBoundsException**.


    •A **try catch** statement can be extended with a **finally** statement block,
    containing code that will always be executed.


    5


    **Manipulating data**


    ***This chapter demonstrates how to manipulate program data using various Java
    library methods.***


    [**Exploring Java classes**](#chapter05.html_sec38)


    [**Doing mathematics**](#chapter05.html_sec39)


    [**Rounding numbers**](#chapter05.html_sec40)


    [**Generating random numbers**](#chapter05.html_sec41)


    [**Managing strings**](#chapter05.html_sec42)


    [**Comparing strings**](#chapter05.html_sec43)


    [**Searching strings**](#chapter05.html_sec44)


    [**Manipulating characters**](#chapter05.html_sec45)


    [**Summary**](#chapter05.html_sec46)


    **Exploring Java classes**'
