    ### Extending an existing class


    A class can inherit the features of another class by using the `extends` keyword
    in the class declaration to specify the name of the class from which it should
    inherit. For example, `class Extra extends Base` inherits from the `Base` class.
    The inheriting class is described as the “sub” class, and the class from which
    it inherits is described as the “super” class. In the example above, `Base` is
    the super class and `Extra` is the sub class.


    Methods and variables created in a super class can generally be treated as if
    they existed in the sub class unless they have been declared with the `private`
    keyword, which denies access from outside the original class. A method in a sub
    class will override a method of the same name that exists in its super class unless
    their arguments differ. The method in the super class may be explicitly addressed
    using its class name and dot notation. For example, `SuperClass.run()`. It should
    be noted that `try catch` statement in a method within a super class does not
    catch exceptions that occur in a sub class – the calling statement must be enclosed
    within its own `try catch` statement.


