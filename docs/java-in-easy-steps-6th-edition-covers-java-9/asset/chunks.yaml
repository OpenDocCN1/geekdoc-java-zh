  trans: "\n数组简单来说是一个包含多个值的变量——与只能包含单个值的普通变量不同。\n\n数组的声明首先使用数据类型关键字之一指明其数据类型，紧接着使用方括号\
    \ `[]` 表示它将是一个数组变量。接下来，声明数组变量的名称，并遵循标准的命名规范。\n\n![image](img/pinkbox.jpg)\n\n\
    可以在声明数组时，通过将适当数据类型的值以逗号分隔的列表形式赋值（并包含在大括号 `{}` 中）来初始化数组。例如，一个初始化了三个值的整数数组变量的声明可能如下：\n\
    \n```\nint[ ] numbersArray = { 1, 2, 3 } ;\n```\n\n数组的长度根据所赋值列表的大小创建，每个值对应一个“元素”——在这种情况下，这是一个包含三个元素的数组。\n\
    \n存储的值从零开始索引，每个值都可以通过其元素索引位置进行访问。这种操作的语法要求数组名后跟一个包含元素索引的方括号。例如，`numbersArray[0]`\
    \ 将访问上述示例中存储的第一个值 (1)。\n\n虽然每个元素中存储的值可以像普通变量一样简单地更改，但数组的大小由其声明决定，此后无法更改。有用的是，数组中的元素总数以整数形式存储在该数组的\
    \ `length` 属性中。访问该数字的语法只需在数组名后加上一个点和“length”。例如，`numbersArray.length` 将返回上述示例数组的大小——在本例中为整数\
    \ 3。\n\n数组也可以通过 `new` 关键字创建一个指定大小的空数组“对象”，从而在不分配初始值列表的情况下声明。所需的空元素数量在适当数据类型之后的方括号内的赋值语句中指定。例如，一个具有三个元素的空整数数组变量的声明可能如下：\n\
    \n```\nint[ ] numbersArray = new int[3] ;\n```\n\n`int` 和 `float` 数据类型的元素被赋予默认值零，`String`\
    \ 数据类型赋值为 `null`，`char` 数据类型赋值为 `\\0`，`boolean` 数据类型赋值为 `false`。\n\n![image](img/snake.jpg)\n\
    \n记住数组索引从零开始。这意味着 `index[2]` 访问的是数组中的第三个元素，而不是第二个元素。\n\n![image](img/1p.jpg)启动一个名为“Array”的新程序，其中包含标准的\
    \ main 方法\n\n```\nclass Array\n{\n    public static void main ( String[] args\
    \ )      }\n}\n```\n\n![image](img/java.jpg)\n\nArray.java\n\n![image](img/2p.jpg)在\
    \ main 方法内部，声明并初始化一个具有三个元素的 String 数组\n\n```\nString[] str = { “Much ”, “More”,\
    \ “ Java” } ;\n```\n\n![image](img/3p.jpg)声明一个具有三个元素的空整数数组\n\n```\nint[] num =\
    \ new int[3] ;\n```\n\n![image](img/4p.jpg)给前两个整数数组元素赋值\n\n```\nnum[0] = 100 ;\n\
    num[1] = 200 ;\n```\n\n![image](img/5p.jpg)给第二个 String 数组元素赋一个新值\n\n```\nstr[1]\
    \ = “Better” ;\n```\n\n![image](img/6p.jpg)输出每个数组的长度以及每个数组中所有元素的内容\n\n```\nSystem.out.println(\
    \ “String array length is “ + str.length ) ;\nSystem.out.println( “Integer array\
    \ length is“+ num.length) ;\nSystem.out.println( num[0] + ”,” +num[1]+ ”,”+num[2]\
    \ ) ;\nSystem.out.println( str[0] + str[1] + str[2] ) ;\n```\n\n![image](img/7p.jpg)将程序保存为\
    \ `Array.java`，然后编译并运行程序以查看输出\n\n![image](img/pg65_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n`String` 值需要包含在引号内。\n\n### 传递参数\n\n声明程序 `main` 方法的标准 Java 代码在其括号内包含一个参数，该参数创建了一个\
    \ String 数组，传统上命名为“args”：\n\n```\npublic static void main( String[] args ) { }\n\
    ```\n\n`args[]` 数组的目的是在调用程序运行时将值传递给程序。在命令行上，在程序名称后的空格后添加要传递给程序的值。例如，向名为“Run”的程序传递\
    \ String “Java” 的命令是 `Run Java`。\n\n传递给程序的单个值会自动放在 `args[]` 数组的第一个元素中，因此程序可以通过\
    \ `args[0]` 访问它。\n\n重要的是要意识到 `args[]` 数组是 String 数据类型——因此传递给程序的数值值将存储为该数字的 String\
    \ 表示形式。这意味着在将该值转换为数值类型（例如 `int` 值）之前，程序无法对其进行算术运算。例如，`Run 4` 将数字 4 传递给程序，程序将其存储为\
    \ String “4”，而不是 int 4。因此，`args[0]` 的输出将是字符串“4”。\n\n### 传递多个参数\n\n可以在命令行通过程序名称和空格向程序传递多个参数。参数之间必须至少有一个空格分隔，其值按顺序放入\
    \ `args[]` 数组的元素中。然后像任何其他数组一样通过索引号访问每个值——`args[0]` 是第一个参数，`args[1]` 是第二个，以此此类推。\n\
    \n程序可以测试 `args[]` 数组的 `length` 属性以确保用户输入了数量数量参数。当测试失败时，可以使用 `return` 关键字退出 `main`\
    \ 方法，从而退出程序：\n\n```\nclass Args\n{\n    public static void main ( String[] args\
    \ )      }\n}\n```\n\nArgs.java\n"
- fmt: "\n![image](images/2p.jpg)Inside the main method, write an `if` statement to\
    \ output advice and exit the program when there are not the required number of\
    \ arguments – in this case, three\n\n```java\nif ( args.length != 3 )\n{\n   \
    \ System.out.println( “Wrong number of arguments” ) ; return ;\n}\n```\n\n![image](images/3p.jpg)Below\
    \ the `if` statement, create two `int` variables – initialized with the values\
    \ of the first argument and third argument respectively\n\n```java\nint num1 =\
    \ Integer.parseInt( args[0] ) ;\nint num2 = Integer.parseInt( args[2] ) ;\n```\n\
    \n![image](images/4p.jpg)Add a `String` variable, initialized with a concatenation\
    \ of all three arguments\n\n```java\nString msg = args[0] + args[1] + args[2]\
    \ + “=” ;\n```\n\n![image](images/hot.jpg)\n\nThe `return` keyword exits the current\
    \ method. It can also return a value to the point where the method was called.\
    \ See [here](#chapter06.html_pg99) for more details.\n\n![image](images/5p.jpg)Add\
    \ this `if else` statement to perform arithmetic on the arguments and append the\
    \ result to the `String` variable\n\n```java\nif ( args[1].equals(“+”) )     \
    \        msg += (num1 + num2);\nelse if ( args[1].equals(“-”) )  msg += (num1\
    \ - num2) ;\nelse if ( args[1].equals(“x”) )     msg += (num1 * num2) ;\nelse\
    \ if ( args[1].equals(“/”) )     msg += (num1 / num2) ;\nelse msg = “Incorrect\
    \ operator” ;\n```\n\n![image](images/6p.jpg)Insert this line at the end of the\
    \ main method to display the appended `String`\n\n```java\nSystem.out.println(\
    \ msg ) ;\n```\n\n![image](images/7p.jpg)Save the program as `Args.java` then\
    \ compile and run the program with three arguments – an integer, any arithmetical\
    \ symbol + - x /, and another integer\n\n![image](images/pg69_1.jpg)\n\n![image](images/8p.jpg)Now,\
    \ run the program with an incorrect second argument and with the wrong number\
    \ of arguments\n\n![image](images/pg69_2.jpg)\n\n![image](images/hot.jpg)\n\n\
    This program will report an error if non-numeric values are entered. See [here](#chapter04.html_sec36)\
    \ for details on how to catch errors.\n\n### Looping through elements\n\nAll types\
    \ of loop can be used to easily read all the values stored inside the elements\
    \ of an array. The loop counter should start with the index number of the first\
    \ element then proceed on up to the final index number. The index number of the\
