    \nMouse.java\n\n![image](img/2r.jpg)修改类声明，为程序添加 `MouseListener` 接口和 `MouseMotionListener`\
    \ 接口\n\n```java\nclass Mouse extends JFrame implements MouseListener , MouseMotionListener\n\
    ```\n\n![image](img/3r.jpg)在 `Mouse()` 构造方法之前，创建一个 `JTextArea` 组件和两个存储坐标的整数变量\n\
    \n```java\nJTextArea txtArea = new JTextArea( 8 , 38 ) ;\nint x , y ;\n```\n\n\
