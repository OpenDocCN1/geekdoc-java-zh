    to protect them from manipulation by external program code. The object should
    then include `public` methods to retrieve the values and call the methods. This
    technique neatly encapsulates the variables and methods within the object structure.
    It is demonstrated in the following steps that reproduce the previous example
    – but with encapsulated attributes and method:


