    \ )` | Button has been released |\n| `mouseEntered( MouseEvent )` | Mouse moves\
    \ on |\n| `mouseExited( MouseEvent )` | Mouse moves off |\n\nMouse movements can\
    \ be recognized by the `MouseMotionListener` interface, which passes `MouseEvent`\
    \ events to two event-handlers:\n\n| Event-handler: | Description: |\n| :--- |\
    \ :--- |\n| `mouseMoved( MouseEvent )` | Mouse is moved |\n| `mouseDragged( MouseEvent\
    \ )` | Mouse is dragged |\n\nWhen a program implements the `MouseListener` or\
    \ `MouseMotionListener` interface, it must declare all its associated event-handler\
    \ methods – even if not all are actually used.\n\nThe `MouseEvent` object passed\
    \ by the `MouseMotionListener` interface has `getX()` and `getY()` methods, which\
    \ return the current mouse coordinates relative to the component generating the\
    \ event.\n\n![image](images/1r.jpg)Edit a copy of `Window.java` from [here](#chapter08.html_pg135)\
    \ , changing the class name in the declaration, the constructor, and the instance\
