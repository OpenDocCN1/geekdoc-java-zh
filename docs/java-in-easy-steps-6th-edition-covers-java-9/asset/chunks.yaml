- fmt: "\nThe `JOptionPane` class can request information from the user by opening\
    \ a dialog box with its `showConfirmationDialog()` method, requesting a decision,\
    \ or with its `showInputDialog()` method, requesting user input.\n\nBoth these\
    \ methods can take four arguments:\n\n•Parent object – typically referenced by\
    \ the `this` keyword\n•Request `String` to be displayed\n•Dialog title `String`\n\
    •One of the `JOptionPane` constants such as `PLAIN_MESSAGE` or to specify dialog\
    \ decision buttons as `YES_NO_CANCEL_OPTION`\n\nThe dialog box will return the\
    \ input `String` from an input dialog or an integer from a decision button – zero\
    \ for yes, 1 for no, or 2 for cancel.\n\n![image](images/1r.jpg)Edit a copy of\
    \ `Window.java` from [here](#chapter08.html_pg135) , changing the class name in\
    \ the declaration, the constructor, and the instance statement from “Window” to\
