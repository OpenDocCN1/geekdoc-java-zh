    \n```java\nbtn2.setEnabled( false ) ;\ntxtArea.setText( “Button 2 is Disabled”\
    \ ) ;\n```\n\n![image](img/7r.jpg)在 `Actions()` 构造函数中，插入语句使每个按钮在被点击时生成一个 `ActionEvent`\
    \ 事件\n\n```java\nbtn1.addActionListener( this ) ;\nbtn2.addActionListener( this\
    \ ) ;\n```\n\n![image](img/8r.jpg)在构造方法之后，为 `ActionListener` 接口添加一个事件处理方法——用于显示标识哪个按钮被点击了\n\
    \n```java\npublic void actionPerformed( ActionEvent event )\n{\n    txtArea.setText(\
    \ event.getActionCommand()\n            + “ Clicked and Disabled” ) ;\n}\n```\n\
    \n![image](img/9r.jpg)在事件处理方法中插入 `if` 语句——对每个按钮点击执行特定的响应\n\n```java\nif ( event.getSource()\
    \ == btn1 )\n{ btn2.setEnabled( true ) ; btn1.setEnabled( false ) ; }\nif ( event.getSource()\
    \ == btn2 )\n{ btn1.setEnabled( true ) ; btn2.setEnabled( false ) ; }\n```\n\n\
    ![image](img/10r.jpg)将程序保存为 `Actions.java`，然后编译并运行程序，点击推按钮\n\n![image](img/pg155_1.jpg)\n\
    \n![image](img/pg155_2.jpg)\n\n![image](img/pg155_3.jpg)\n\n![image](img/forget.jpg)\n\
    \n组件在构造函数之前声明，因此对于事件处理方法是全局可见的。\n\n![image](img/hot.jpg)\n\n有时在用户执行所需操作之前禁用某个组件是有用的。\n\
    \n### 处理项目事件\n\nSwing `JRadioButton`、`JCheckBox` 和 `JComboBox` 组件维护的状态，这些状态的变化可以通过\
    \ `ItemListener` 接口识别，该接口会将 `ItemEvent` 传递给其 `itemStateChanged()` 事件处理方法。`ItemEvent`\
    \ 对象有一个 `getItemSelectable()` 方法用于标识源组件，并有一个 `getStateChange()` 方法用于返回其状态。这将决定变化是选中还是取消项目，并可以与\
    \ `ItemEvent.SELECTED` 常量进行比较。\n\n![image](img/1r.jpg)从这里编辑 `Window.java` 的副本，将声明、构造函数和实例化语句中的类名从“Window”更改为“States”。然后，在程序开头添加一条语句来导入\
    \ `java.awt.event` 包的功能\n\n```java\nimport java.awt.event.* ;\n```\n\n![image](img/java.jpg)\n\
    \nStates.java\n\n![image](img/2r.jpg)编辑类声明以为程序添加 `ItemListener` 接口\n\n```java\n\
    class States extends JFrame implements ItemListener\n```\n\n![image](img/3r.jpg)在\
    \ `States()` 构造函数之前，创建这些组件\n\n```java\nString[] styles = { “Deep Dish” , “Gourmet\
    \ Style” , “Thin & Crispy” } ;\nJComboBox<String> box = new JComboBox<String>\
    \ ( styles ) ;\nJRadioButton rad1 = new JRadioButton( “White” ) ;\nJRadioButton\
    \ rad2 = new JRadioButton( “Red” ) ;\nButtonGroup wines = new ButtonGroup() ;\n\
    JCheckBox chk = new JCheckBox( “Pepperoni” ) ;\nJTextArea txtArea = new JTextArea(\
    \ 5 , 38 ) ;\n```\n\n![image](img/4r.jpg)在 `States()` 构造函数中，插入语句将两个 `JRadioButton`\
    \ 组件分组\n\n```java\nwines.add( rad1 ) ;\nwines.add( rad2 ) ;\n```\n\n![image](img/5r.jpg)插入语句将组件添加到\
    \ `JPanel` 容器\n\n```java\npnl.add( rad1 ) ;\npnl.add( rad2 ) ;\npnl.add( chk )\
    \ ;\npnl.add( box ) ;\npnl.add( txtArea ) ;\n```\n\n![image](img/hot.jpg)\n\n\
    注意此示例如何使用 `append()` 方法向文本区域添加更多文本。\n\n![image](img/6r.jpg)插入语句使可选择组件在选中项目时生成一个\
    \ `ItemEvent` 事件\n\n```java\nrad1.addItemListener( this ) ;\nrad2.addItemListener(\
    \ this ) ;\nchk.addItemListener( this ) ;\nbox.addItemListener( this ) ;\n```\n\
    \n![image](img/7r.jpg)在构造方法之后，为 `ItemListener` 接口添加一个事件处理方法——用于标识哪个按钮被点击了\n\n\
    ```java\npublic void itemStateChanged( ItemEvent event )\n{\n    if ( event.getItemSelectable()\
    \ == rad1 )\n        txtArea.setText( “White” ) ;\n    if ( event.getItemSelectable()\
    \ == rad2 )\n        txtArea.setText( “Red” ) ;\n    if ( event.getItemSelectable()\
    \ == chk )\n        txtArea.append( “Pepperoni\\n” ) ;\n    if ( event.getItemSelectable()\
    \ == box )\n        txtArea.append( event.getStateChange().toString() + “ selected\\\
    n” )\n}\n```\n\n### 响应键盘事件\n\n允许用户输入文本的 Swing 组件可以通过 `KeyListener` 接口识别用户的按键输入，该接口会将\
    \ `KeyEvent` 事件传递给这三个方法：\n\n| 事件处理器 | 说明 |\n| :--- | :--- |\n| `keyPressed( KeyEvent\
    \ event )` | 在按下按键时调用 |\n| `keyTyped( KeyEvent event )` | 在按下按键后调用 |\n| `keyReleased(\
    \ KeyEvent event )` | 在松开按键时调用 |\n\n当程序实现 `KeyListener` 时，必须声明这三个方法——即使并非全部都会使用。`KeyEvent`\
    \ 对象有一个 `getKeyChar()` 方法，返回该键的字符，以及有一个 `getKeyCode()` 方法，返回表示该按键的整数 Unicode 值。此外，`getKeyText()`\
    \ 方法接收键码值作为参数并返回该按键的描述。\n\n"
