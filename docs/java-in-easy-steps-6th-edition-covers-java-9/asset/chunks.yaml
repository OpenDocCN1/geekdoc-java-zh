    \ ;\n```\n\n![image](img/9bl.jpg)现在添加一条语句调用 `Car` 类的另一个公共方法以检索存储的属性值并调用私有行为方法\n\
    \n```java\nPorsche.getCar() ;\n```\n\n![image](img/10bl.jpg)创建另一个实例，分配并检索值\n\n\
    ```java\nCar Bentley = new Car() ;\nBentley.setCar( “Bentley” , ”Green” , ”Saloon”\
    \ ) ;\nBentley.getCar() ;\n```\n\n![image](img/11bl.jpg)将程序保存为 `SafeInstance.java`，然后编译并运行程序以查看输出\n\
    \n![image](img/pg111_1.jpg)\n\n![image](img/forget.jpg)\n\n未初始化的 `String` 变量具有\
    \ `null` 值——因此在调用 `setCar()` 之前调用 `getCar()` 方法将从每个变量返回 `null`。\n\n## 构建对象值\n\n\
    对象的构造方法可以直接在对象类中调用，以初始化对象变量。这有助于将声明和赋值分离，并被认为良好的编程风格。接下来的步骤演示了如何重现之前的示例 这里，其中包含封装的属性和方法——以及通过构造函数的初始化：\n\
    \n![image](img/1bl.jpg)启动一个名为“Car”的新类\n\n```java\nclass Car\n{\n}\n```\n\n![image](img/java.jpg)\n\
    \nConstructor.java\n\n![image](img/2bl.jpg)在类的大括号之间，声明三个私有的 `String` 变量来存储对象属性\n\
    \n```java\nprivate String maker ;\nprivate String color ;\nprivate String bodyType\
    \ ;\n```\n\n![image](img/3bl.jpg)添加一个构造方法，用属性值初始化三个变量\n\n```java\npublic Car()\n\
    {\n    maker = “Porsche” ;\n    color = “Silver” ;\n    bodyType = “Coupe” ;\n\
    }\n```\n\n![image](img/4bl.jpg)添加一个描述行为的私有方法\n\n```java\nprivate String accelerate()\n\
    {\n    String motion = “Accelerating...” ;\n    return motion ;\n}\n```\n\n![image](img/5bl.jpg)添加一个公共方法，将传递的参数值分配给每个私有变量\n\
    \n```java\npublic void setCar( String brand , String paint , String style )\n\
    {\n    maker = brand ;\n    color = paint ;\n    bodyType = style ;\n}\n```\n\n\
    ![image](img/snake.jpg)\n\n构造方法的声明没有说明任何返回数据类型。\n\n![image](img/6bl.jpg)添加另一个公共方法来获取私有变量的值并调用私有方法\n\
    \n```java\npublic void getCar()\n{\n    System.out.println( maker + ” paint is\
    \ “ + color ) ;\n    System.out.println( maker + “ style is “ + bodyType ) ;\n\
    \    System.out.println( maker + “ is “ + accelerate() + ”\\n” ) ;\n}\n```\n\n\
    ![image](img/7bl.jpg)在 `Car` 类结束之后，启动另一个名为“Constructor”的类，其中包含标准的 main 方法\n\n\
    ```java\nclass Constructor\n{\n    public static void main ( String[] args ) {\
    \ }\n}\n```\n\n![image](img/8bl.jpg)在 main 方法的大括号之间，插入语句创建 `Car` 类的实例并检索初始默认值\n\
    \n```java\nCar Porsche = new Car() ;\nPorsche.getCar() ;\n```\n\n![image](img/9bl.jpg)创建另一个实例，分配并检索值\n\
    \n```java\nCar Ferrari = new Car() ;\nFerrari.setCar( “Ferrari” , ”Red” , ”Sport”\
    \ ) ;\nFerrari.getCar() ;\n```\n\n![image](img/10bl.jpg)将程序保存为 `Constructor.java`，然后编译并运行程序以查看输出\n\
    \n![image](img/pg113_1.jpg)\n\n## 总结\n\n- 将程序拆分为多个方法并在需要时调用，可以增加灵活性并使更容易追踪错误。\n\
    - 重载方法具有相同的名字但接收不同的参数。\n- 在方法内部声明的变量具有局部作用域，但类变量在整个类中具有全局作用域。\n- `static` 关键字用于声明类方法和类变量——在整个类中具有全局作用域。\n\
    - `public` 关键字允许访问类。\n- `extends` 关键字可以表示继承自类。\n- `点` 关键字可以表示特定的类。\n- `new` 关键字可以创建类的实例。\n\
    - 对象的构造方法可以创建类的拷贝。\n- `private` 关键字拒绝从类外部访问。\n- 封装保护属性和方法免受外部影响。\n- `import` 语句可以使用通配符表示“所有”。\n\
    - 对象的构造方法可以调用来初始化对象。\n\n7\n\n## 导入功能\n\n*本章演示了如何导入额外的类功能。*\n\n- 处理文件\n- 读取输入\n\
    - 读取文件\n- 写入文件\n- 排序元素\n- 制作列表\n- 管理日期\n- 格式化数字\n- 总结\n\n### 处理文件\n\nJava 包含一个\
    \ `java.io` 包，用于处理文件输入输出程序。通过在 `.java` 开头包含 `import` 语句可以使该包可用。这可以使用通配符字符表示“所有类”：`import\
    \ java.io.*;` ;\n\n`java.io` 包有一个 `File` 类可用于访问文件或目录。必须先使用 `new` 关键字创建 `File`\
    \ 对象，并将文件名或目录名作为构造函数的参数。例如，创建本地文件 `info.dat` 的 `File` 对象语法如下：\n\n```java\nFile\
    \ info = new File( “info.dat” )\n```\n\n该文件位于程序相同的目录下，但参数可以指定其他位置的文件路径。注意，创建 `File`\
    \ 对象实际上并没有创建文件，只是表示文件的手段。\n\n一旦创建了表示文件的 `File` 对象，就可以调用它的方法来操作文件。最常用的 `File` 对象方法列下表，并附有简要描述：\n\
    \n| 方法 | 返回 |\n| :--- | :--- |\n| `exists()` | 如果文件存在则返回 `true`——不存在则返回 `false`\
    \ |\n| `getName()` | `String` 类型的文件名 |\n| `length()` | 文件中的字节数，类型为 `long` |\n\
    | `createNewFile()` | 如果能够创建新的唯一文件则返回 `true` |\n| `delete()` | 如果成功删除文件则返回 `true`\
    \ |\n\n"
