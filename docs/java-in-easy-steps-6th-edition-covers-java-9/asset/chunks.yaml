    Assignment operators, listed in the table below, are used to assign the result
    of an expression. All except the simple `=` operator are the shorthand form of
    a longer equivalent expression:


    | **Operator:** | **Example:** | **Equivalent:** |

    | :--- | :--- | :--- |

    | `=` | `a = b` | `a = b` |

    | `+=` | `a += b` | `a = a + b` |

    | `-=` | `a -= b` | `a = a - b` |

    | `*=` | `a *= b` | `a = a * b` |

    | `/=` | `a /= b` | `a = a / b` |

    | `%=` | `a %= b` | `a = a % b` |


    It is important to regard the `=` operator to mean “assign”, rather than “equals”,
    to avoid confusion with the `==` equality operator.


    In the example `a = b`, the value stored in the variable named `b` is assigned
    to the variable named `a`, so that value becomes the new value stored in `a` –
    replacing any value it previously contained.


    The `+=` operator is useful to add a value onto an existing value stored in a
    variable – keeping a “running total”.


    The example `a += b` first calculates the sum total of the values stored in the
    variables named `a` and `b`, then assigns the resulting total to variable `a`.
    A program might then contain a further assignment `a += c` that calculates the
    total stored in variables named `a` and `c`, then assigns that new total to variable
    `a` – adding the value of `c` to the value it previously contained.


    All the other assignment operators work in the same way by first performing the
    arithmetical calculation on the two stored values, then assigning the result to
    the first variable – to become its new stored value.


    ![image](images/forget.jpg)


    The `==` equality operator compares values, and is fully explained [here](#chapter02.html_sec13).


    Follow these steps to explore the Java assignment operators in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type `jshell` and
    hit the `Enter` key to launch the Java shell


    ![image](images/2r.jpg)Next, enter statements to initialize two `String` variables


    ```java

    String txt = "Super "; String lang = "Java";

    ```


    ![image](images/3r.jpg)Now, separately enter statements to add and assign a `String`
    value, then display the concatenated string result


    ```java

    txt += lang; txt;

    ```


    ![image](images/pg29_1.jpg)


    ![image](images/4r.jpg)Then, enter statements to initialize two integer variables


    ```java

    int sum = 10; int num = 20;

    ```


    ![image](images/5r.jpg)Separately enter statements to add and assign an `int`
    value, then display the totaled integer result


    ```java

    sum += num; sum;

    ```


    ![image](images/pg29_2.jpg)


    ![image](images/new.jpg)


    The new Java shell feature, introduced in Java 9, creates internal `$`prefixed
    numbered variables containing the result of an evaluation. Here, internal variables
    `$3` and `$7` contain evaluation results.


    ![image](images/snake.jpg)


    Assignment of the wrong data type to a variable will cause an error.


    ### Comparing values


    Comparison operators, listed in the table below, are used to compare two values
    in an expression and return a single Boolean value of `true` or `false` – describing
    the result of that comparison.


    | **Operator:** | **Comparison:** |

    | :--- | :--- |

    | `==` | Equality |

    | `!=` | Inequality |

    | `>` | Greater than |

    | `>=` | Greater than, or equal to |

    | `<` | Less than |

    | `<=` | Less than, or equal to |


    The `==` equality operator compares two operands, and will return `true` if both
    are exactly equal in value. If both are the same number they are equal, or if
    both are `String` values containing the same characters in the same order they
    are equal. Boolean operands that are both `true`, or that are both `false`, are
    equal.


    Conversely, the `!=` inequality operator returns `true` if two operands are not
    equal – applying the same rules as the equality operator.


    Equality and inequality operators are useful in testing the state of two variables
    to perform “conditional branching” of a program – proceeding in different directions
    according to the condition.


    The `>` “greater than” operator compares two operands, and will return `true`
    if the first is greater in value than the second.


    The `<` “less than” operator makes the same comparison, but returns `true` if
    the first operand is less in value than the second.


    Adding the `=` assignment operator after the `>` “greater than” operator, or after
    the `<` “less than” operator, makes it also return `true` when the two operands
    are exactly equal in value.


    ![image](images/hot.jpg)


    The `<` less than operator is typically used to test a counter value in a loop
    – an example of this can be found [here](#chapter03.html_sec23).


    Follow these steps to explore the Java comparison operators in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type `jshell` and
    hit the `Enter` key to launch the Java shell


    ![image](images/2r.jpg)Next, enter statements to initialize two `String` variables


    ```java

    String txt = "Super "; String lang = "Java";

    ```


    ![image](images/3r.jpg)Now, separately enter statements to add and assign a `String`
    value, then display the concatenated string result


    ```java

    boolean state = txt == lang;

    state = txt != lang;

    ```


    ![image](images/pg29_1.jpg)


    ![image](images/4r.jpg)In a similar way, separately enter statements to add and
    assign an `int` value, then display the totaled integer result


    ```java

    int dozen = 12; int score = 20;

    ```


    ```java

    state = dozen > score;

    state = dozen < score;

    ```


    ![image](images/pg29_2.jpg)


    ![image](images/new.jpg)


    You can discover more options within the Java shell by entering the `help` command.


    ### Assessing logic


    Logical operators, listed in the table below, are used to combine multiple expressions
    that each return a Boolean value – into a complex expression that returns a single
    Boolean value.


    | **Operator:** | **Operation:** |

    | :--- | :--- |

    | `&&` | Logical AND |

    | `||` | Logical OR |

    | `!` | Logical NOT |


    Logical operators are used with operands that have the Boolean values of `true`
    or `false`, or values that can convert to `true` or `false`.


    The `&&` AND operator will evaluate two operands and return `true` only if both
    operands are `true`. Otherwise, the logical `&&` operator will return `false`.
    This evaluation can be used in conditional branching, where a program will only
    perform a certain action when two tested conditions are both true.


    Unlike the logical `&&` operator that needs two operands to be `true`, the `||`
    OR operator will evaluate its two operands and return `true` if either one of
    the operands is `true` – it will only return `false` when neither operand is `true`.
    This is useful in Java programming to perform a certain action when either one
    of test conditions has been met.


    The `!` NOT operator is a “unary” operator that is used before a single operand.
    It returns the inverse Boolean value of the given operand – reversing `true` to
    `false`, and `false` to `true`. It’s useful in Java programs to toggle the value
    of a variable in successive loop iterations with a statement like `goState=!goState`.
    This ensures that on each pass of the loop the value is changed, like flicking
    a light switch on and off.


    Notice how an expression can be contained in parentheses for better readability.

