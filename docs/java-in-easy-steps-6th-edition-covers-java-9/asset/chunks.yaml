  trans: "\n\n`while` 循环可以构造成类似于 `for` 循环的结构，通过在循环外部创建一个计数器变量，并在每次迭代执行的语句中更改其值，从而在测试表达式中评估计数器变量。例如，上一个示例中的外部\
    \ `for` 循环可以重建为 `while` 循环，如下：\n\n```java\nint i = 1 ;\nwhile ( i < 4 )\n{\n \
    \   System.out.println( “Outer Loop i=” +i ) ;\n    i++ ;\n}\n```\n\n这会将计数器初始化放在\
    \ `while` 循环结构外部，并将更新器放在语句块内部。\n\n![image](img/snake.jpg)\n\n无限循环将由于持续执行迭代而锁定程序——在\
    \ Windows 上，请按 `Ctrl + C` 停止。\n\n![image](img/1g.jpg)启动一个名为“While”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass While\n{\n    public static void main ( String[] args\
    \ ) {    }\n}\n```\n\n![image](img/java.jpg)\nWhile.java\n\n![image](img/2g.jpg)在\
    \ main 方法内部，声明并初始化一个名为 `num` 的整数变量\n\n```java\nint num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个\
    \ `while` 循环，在 `num` 变量仍大于 0 时显示其当前值\n\n```java\nwhile ( num > 0 )\n{\n    System.out.println(\
    \ “While Countdown: ” + num ) ;\n}\n```\n\n![image](img/4g.jpg)在 `while` 循环块末尾插入一个更新器，每次迭代将\
    \ `num` 变量的值减 10——从而避免无限循环\n\n```java\nnum -= 10 ;\n```\n\n![image](img/5g.jpg)将程序保存为\
    \ `While.java`，然后编译并运行程序查看输出\n\n![image](img/pg53_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n此更新器中的赋值是 `num = ( num - 10 )` 的简写。\n\n## 执行 do-while 循环\n\n`while` 循环结构的一种变体（见此处）采用\
    \ `do` 关键字来创建一个具有如下语法的循环：\n\n```java\ndo\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\nwhile ( test-expression ) ;\n```\n\n与 `for` 循环和 `while` 循环一样，`do while`\
    \ 循环重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下一个任务。\n\n与 `for` 循环和 `while` 循环不同，`do while`\
    \ 测试表达式出现在包含执行语句的块之后。测试表达式在循环的每次迭代结束时被评估为布尔值 `true`。当评估结果为 `true` 时，继续下一次迭代；但当返回\
    \ `false` 时，循环立即终止。这意味着 `do while` 循环中的语句至少会被执行一次。\n\n请注意，如果测试表达式在第一次评估时返回 `false`，循环语句已经执行了一次。\n\
    \n`do while` 循环可以构造成类似于 `for` 循环的结构，通过将计数器初始化放在循环结构外部，并将更新器放在语句块内部，在测试表达式中评估计数器变量——这与\
    \ `while` 循环完全相同。\n\n所有 `for`、`while` 或 `do while` 循环结构如果只包含一个执行语句，可以选择省略语句周围的大括号。但如果省略了，以后向循环中添加额外语句时，你需要添加大括号。\n\
    \n选择 `for`、`while` 还是 `do while` 循环很大程度上取决于个人的编码偏好和用途。`for` 结构方便地将计数器初始化、测试表达式和更新器置于\
    \ `for` 关键字后的括号中。`while` 循环结构可以更简洁——但你必须在循环语句中包含一个更新器以避免无限循环。`do while` 循环仅仅增加了一个优点：在评估其测试表达式之前执行一次其语句——如右侧描述的\
    \ `do while` 循环所示。\n\n![image](img/hot.jpg)\n\n始终将循环要执行的语句封装在大括号内——以保持代码清晰度并提高代码的可维护性。\n\
    \n![image](img/1g.jpg)启动一个名为“DoWhile”的新程序，其中包含标准的 main 方法\n\n```java\nclass DoWhile\n\
    {\n    public static void main ( String[] args ) {    }\n}\n```\n\n![image](img/java.jpg)\n\
    DoWhile.java\n\n![image](img/2g.jpg)在 main 方法内部，声明并初始化一个名为 `num` 的整数变量\n\n```java\n\
    int num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个 `do while` 循环，在 `num` 变量小于 10\
    \ 时显示其当前值\n\n```java\ndo\n{\n    System.out.println( “DoWhile Countup: ” + num\
    \ ) ;\n}\nwhile ( num < 10 ) ;\n```\n\n![image](img/4g.jpg)在 `while` 循环块末尾插入一个更新器，每次迭代将\
    \ `num` 变量的值增加 10——从而避免无限循环\n\n```java\nnum += 10 ;\n```\n\n![image](img/5g.jpg)将程序保存为\
    \ `DoWhile.java`，然后编译并运行程序查看输出\n\n![image](img/pg53_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n此更新器中的赋值是 `num = 110` 的简写。\n\n## 跳出循环\n\n`break` 关键字用于在满足特定条件时提前终止循环。`break`\
    \ 语句位于循环内部，并位于测试表达式之前。当测试返回 `true` 时，循环结束，程序继续执行下一个任务。\n\n![image](img/1g.jpg)启动一个名为“Break”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass Break\n{\n    public static void main ( String[] args\
    \ ) {    }\n}\n```\n\n![image](img/java.jpg)\nBreak.java\n\n![image](img/2g.jpg)在\
    \ main 方法内部，创建两个嵌套的 `for` 循环，每次迭代时显示它们的计数器值\n\n```java\nfor ( int i = 1 ; i <\
    \ 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println(\
    \ “Running i=”+i+“ j=”+j ) ;\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Break.java`，然后编译并运行程序查看输出\n\
    \n![image](img/pg53_1.jpg)\n\n此程序使外部循环进行三次迭代，每次迭代都执行内部循环。可以添加 `break` 语句来停止内部循环的第二次执行。\n\
    \n![image](img/4g.jpg)在内部循环块开头添加此 `break` 语句，跳出内部循环\n\n```java\nfor ( int i =\
    \ 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        if\
    \ ( i == 2 && j == 1 )\n        {\n            System.out.println( “Breaks innerLoop\
    \ when i=”+i+“ j=”+j ) ;\n            break ;\n        }\n    }\n}\n```\n\n![image](img/5g.jpg)\n\
    ![image](img/pg53_1.jpg)\n\n![image](img/forget.jpg)\n\n在这里，当外部循环尝试第二次运行时，`break`\
    \ 语句停止了内部循环的所有三次迭代。\n\n`continue` 关键字用于在满足特定条件时跳过循环的单次迭代。`continue` 语句位于语句块内部，并位于测试表达式之前。当测试返回\
    \ `true` 时，该迭代结束。\n\n![image](img/5g.jpg)在内部循环块开头添加此 `continue` 语句，跳过内部循环的第一次迭代\n\
    \n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++\
    \ )\n    {\n        if ( i == 1 && j == 1 )\n        {\n            System.out.println(\
    \ “Continues innerLoop when i=”+i+“ j=”+j ) ;\n            continue;\n       \
    \ }\n    }\n}\n```\n\n![image](img/pg53_2.jpg)\n\n![image](img/forget.jpg)\n\n\
    在这里，当外部循环尝试第一次运行时，`continue` 语句仅跳过了内部循环的第一次迭代。\n\n"
