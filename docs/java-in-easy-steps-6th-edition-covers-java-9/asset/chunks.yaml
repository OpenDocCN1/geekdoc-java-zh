    Now that the Lotto app has all resources, controls, and functional code in place,
    an attempt can be made to build the project:


    ![image](images/4g.jpg)On the Android Studio main toolbar, click **View**, **Tool
    Windows**, **Messages** – to open the “Messages” window


    ![image](images/5g.jpg)Then, click **Build**, **Make Project** (or press the **Ctrl
    + F9** shortcut) to start building


    ![image](images/6g.jpg)The “Messages” window will soon display a confirmation
    of success, or report any errors that need fixing


    ![image](images/pg181_1.jpg)


    ![image](images/7g.jpg)Fix any reported errors if necessary, then build again
    until you see a confirmation of success


    ![image](images/hot.jpg)


    If the build attempt fails, look for red lightbulb icons in the code – Android
    Studio adds these so you can easily find and correct errors.


    **Testing the application**


    Once an application project has built successfully, it is ready to be tested.
    Testing can be performed on a real Android device, connected to your computer
    via a USB socket, or on an Android Virtual Device (AVD) emulator. AVDs allow you
    to test how the app will perform on a range of devices, but they do use more system
    resources and can be painfully slow. Applications should be tested on at least
    one phone device and one tablet device:


    ![image](images/1g.jpg)Click **Run**, **Run ‘app’** (or press the **Shift** +
    **F10** shortcut) to open the “Select Deployment Target” dialog


    ![image](images/pg182_1.jpg)


    ![image](images/2g.jpg)Select an AVD phone emulator to connect, then click **OK**
    to install the Lotto app on the emulator


    ![image](images/pg182_2.jpg)


    ![image](images/3g.jpg)Push the app button to see the TextView content unhappily
    wrap on this small device screen


    ![image](images/4g.jpg)Edit **activity_main.xml** to reduce the text size **android:textSize=”32sp”**


    ![image](images/5g.jpg)Click **Build**, **Rebuild Project** to apply the change,
    then run the app in the emulator once more to see the solution


    ![image](images/pg182_3.jpg)


    ![image](images/pg182_4.jpg)


    ![image](images/snake.jpg)


    Creation of each AVD emulator may require a large system image file to be downloaded.
    You may prefer to test on a real Android device. Also note that accelerated emulators
    will only run if your computer has a CPU that supports hardware virtualization
    (Intel VT-x or AMD SVM).


    ![image](images/hot.jpg)


    Android Studio has an Instant Run feature that automatically updates changes to
    the app so they appear in the test device more quickly.


    ![image](images/forget.jpg)


    It is better to test on real devices rather than the emulators. Ideally, you should
    test on as many different devices as possible before final deployment of apps.


    ![image](images/6g.jpg)Take an Android tablet and enable “USB Debugging” on the
    **Settings**, **Developer Options** menu


    ![image](images/7g.jpg)Connect the tablet to your computer via a USB port to see
    this notification


    ![image](images/pg183_1.jpg)


    ![image](images/8g.jpg)Click **Run**, **Run ‘app’** (or press the **Shift** +
    **F10** shortcut) to open the “Select Deployment Target” dialog


    ![image](images/pg183_2.jpg)


    ![image](images/9g.jpg)Select the connected tablet device, then click **OK** to
    install the Lotto app on the tablet


    ![image](images/10g.jpg)Push the app button to see the Lotto app happily perform
    as expected – a successful test


    ![image](images/pg183_3.jpg)


    ![image](images/pg183_4.jpg)


    ![image](images/pg183_5.jpg)


    The test processes provide an application launcher so the tablet can be disconnected
    and the app launched by tapping the launcher icon – but remember, this is a Debug
    build of the app.


    ![image](images/hot.jpg)


    If you cannot see Developer Options on the Android Settings you can enable it
    by tapping on the Build Number seven times – typically found at Settings, About,
    Software Information, Build Number.


    ![image](images/hot.jpg)


    Android Studio provides a default image launcher icon, but you can use your own
    image. In the Project window, right-click on the **res** folder then choose **New**,
    **Image Asset** to open the Asset Studio, then select **Image** and browse to
    an image you wish to import into the project.


    **Deploying Android apps**


    After successful testing, the development Debug version of an app should be changed
    to a Release version before deployment as an Android Application Package (APK).
    Android requires that all APKs must be digitally signed with a certificate, and
    Android Studio allows you to easily generate a signed APK:


    ![image](images/1g.jpg)Click **Build**, **Select Build Variant**, then choose
    the **release** version option


    ![image](images/pg184_1.jpg)


    ![image](images/2g.jpg)Next, click **Build**, **Generate Signed APK**


    ![image](images/pg184_2.jpg)


    ![image](images/3g.jpg)Enter existing keystore details or click **Create new...**


    ![image](images/4g.jpg)Choose a location at which to save the keystore, then enter
    passwords


    ![image](images/pg184_3.jpg)


    ![image](images/5g.jpg)Select your preferred validity period, then enter certificate
    information


    ![image](images/6g.jpg)Click **OK** to create the new keystore


    ![image](images/pg184_4.jpg)


    ![image](images/7g.jpg)Click **Next** to use the new keystore to generate a signed
    APK for the app


    ![image](images/hot.jpg)


    Additional steps are required if you wish to distribute your apps via the Google
    Play Store. You can discover what is needed online at **[developer.android.com/distribute/tools/launch-checklist.html](https://developer.android.com/distribute/best-practices/launch/launch-checklist.html)**


    ![image](images/hot.jpg)


    A keystore holds one or more corresponding public/private key pairs. You, as the
    owner of the certificate, retain the private key while the Android Studio signing
    tool attaches the public key certificate to the APK. This uniquely associates
    the APK to you and your corresponding private key to ensure that any future updates
    to the APK come from the original developer.


    ![image](images/8g.jpg)Choose a location at which to save the APK and be sure
    the Build Type is “release”, then click **Finish** to generate a signed APK named
    **app-release.apk**


    ![image](images/pg185_1.jpg)


    ![image](images/9g.jpg)Upon success, change the APK name to a more meaningful
    **Lotto.apk**


    ![image](images/pg185_2.jpg)


    ![image](images/hot.jpg)


    A product flavor can be specified to define different customized builds of the
    app. For example, the button text on a Spanish language flavor as “Consigue mis
    números de la suerte”.


    The Android app APK can now be deployed in several ways:


    •**App Marketplace** – publish on Google Play Store


    •**Email** – send direct as an attachment


    •**Website** – host online for download


    Installation of APKs from sources other than Google Play is blocked unless the
    user opts to allow them:


    ![image](images/10g.jpg)On an Android device, go to **Settings**, **Security**
    and opt to “Allow installation of apps from unknown sources”


    ![image](images/11g.jpg)Next, download **Lotto.apk** to the Android device


    ![image](images/12g.jpg)Navigate to the download folder and click **Install**,
    then tap the ![image](images/icon.jpg) launcher icon to run the app'
