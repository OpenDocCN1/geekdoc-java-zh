    **Reading files**


    The **java.io** package contains a class named **FileReader** that is especially
    designed to read text files. This class is a subclass of the **InputStreamReader**
    class that can be used to read console input by converting a byte stream into
    integers that represent Unicode character values.


    A **FileReader** object is created using the **new** keyword, and takes the name
    of the file to be read as its argument. Optionally, the argument can include the
    full path to a file outside the directory where the program is located.


    In order to efficiently read the text file line-by-line, the **readLine()** method
    of a **BufferedReader** object can be employed to read the characters decoded
    by the **FileReader** object. This method must be called from within a **try catch**
    statement to catch any **IOException** problems that may arise.


    Reading all lines in a text file containing multiple lines of text is accomplished
    by making repeated calls to the **readLine()** method in a loop. At the end of
    the file the call will return a **null** value, which can be used to terminate
    the loop.


