    The `static` keyword that is used in method declarations ensures that the method
    is a “class method” – globally accessible from any other method in the class.


    Similarly, a “class variable” can be declared with the `static` keyword to ensure
    it is globally accessible throughout the class. Its declaration should be made
    before the main method declaration, right after the curly bracket following the
    class declaration.


    A program may have a global class variable and local method variable of the same
    name. The local method variable takes precedence unless the global class variable
    is explicitly addressed by the class name prefix using dot notation, or if a local
    variable of that name has not been declared.


