    9


    **Recognizing events**


    ***This chapter demonstrates how to create Java program event-handlers that respond
    to user interface actions.***


    [**Listening for events**](#chapter09.html_sec74)


    [**Generating events**](#chapter09.html_sec75)


    [**Handling button events**](#chapter09.html_sec76)


    [**Handling item events**](#chapter09.html_sec77)


    [**Reacting to keyboard events**](#chapter09.html_sec78)


    [**Responding to mouse events**](#chapter09.html_sec79)


    [**Announcing messages**](#chapter09.html_sec80)


    [**Requesting input**](#chapter09.html_sec81)


    [**Summary**](#chapter09.html_sec82)


    **Listening for events**


    A user can interact with a program that provides a graphical user interface (GUI)
    by performing actions with a mouse, keyboard, or other input device. These actions
    cause “events” to occur in the interface, and making a program respond to them
    is known as “event-handling”.


    For a program to recognize user events it needs to have one or more **EventListener**
    interfaces added from the **java.awt.event** package. These can be made available
    to the program by adding an initial statement to **import java.awt.event.* ;**
    .


    The desired **EventListener** interface can be included in the class declaration
    using the **implements** keyword. For example, a class declaration to listen for
    button clicks might look like this:


    **class Click extends JFrame implements ActionListener {     }**


    The Java documentation describes many **EventListener** interfaces that can listen
    out for different events, but the most common ones are listed in the table below,
    together with a brief description:


    | **EventListener:** | **Description:** |


    | **ActionListener** | Recognizes action events that occur when a push button
    is pushed or released |


    | **ItemListener** | Recognizes item events that occur when a list item gets selected
    or deselected |


    | **KeyListener** | Recognizes keyboard events that occur when the user presses
    or releases a key |


    | **MouseListener** | Recognizes mouse button actions that occur when the user
    presses or releases a mouse button, and when the mouse enters or exits a component
    |


    | **MouseMotionListener** | Recognizes motion events that occur when the user
    moves the mouse |


    ![image](images/hot.jpg)


    Multiple EventListeners can be included after the **implements** keyword as a
    comma-separated list.


    **Generating events**


    Components need to generate events that the **EventListener** interfaces can recognize
    if they are to be useful. Having added the appropriate **EventListener** to the
    program, as described opposite, an event generator must be added to the component.


    For example, in order to have the program respond to a button click, the **ActionListener**
    interface is added to the program and the button’s **addActionListener()** method
    must be called, specifying the **this** keyword as its argument. This makes the
    button generate an event when it gets clicked, which can be recognized by the
    **ActionListener** interface.


    Statements creating a button that generates events look like this:


    **JButton btn = new JButton( “Click Me” ) ;**


    **btn.addActionListener( this ) ;**


    When the user clicks a button that generates an event, the **ActionListener**
    interface recognizes the event and seeks an event-handler method within the program
    to execute a response.


    Each **EventListener** interface has an associated event-handler method that is
    called when an event is recognized. For example, when a button gets clicked, the
    **ActionListener** interface calls an associated method named **actionPerformed()**
    and passes an **ActionEvent** object as its argument.


    An **ActionEvent** object contains information about the event and the source
    component from where it originated. Most usefully, it has a **getSource()** method
    that identifies the object that generated the event. This can be used to create
    an appropriate response for that component.


    An event-handler method to create a response for a specific button click could
    look like this:


    **public void actionPerformed( ActionEvent event )**


    **{**


    **if ( event.getSource() == btn )**


    **{**


    *Statements to be executed for this button click event*


    **}**


    **}**


    **Handling button events**


    A Swing **JButton** component that is set to generate an **ActionEvent** event
    when it gets clicked can be recognized by the **ActionListener** interface, which
    will pass the event to its **actionPerformed()** event-handler method. The **ActionEvent**
    object has a **getSource()** method that identifies the originating component,
    and a **getActionCommand()** method that returns a **String**. This will be the
    text label for a button component, or the content for a text field component.


    One response to a button might be to disable a component by calling its **setEnabled()**
    method with a **false** argument. Conversely, the component can be enabled once
    more by specifying a **true** argument to its s**etEnabled()** method.


