    \ each component to the `JPanel` container\n\n```\npnl.add( field ) ; pnl.add(\
    \ btn1 ) ; pnl.add( btn2 ) ;\n```\n\n![image](images/5r.jpg)In the `Request()`\
    \ constructor, insert statements to make each button generate an `ActionEvent`\
    \ event\n\n```\nbtn1.addActionListener( this ) ;\nbtn2.addActionListener( this\
    \ ) ;\n```\n\n![image](images/6r.jpg)After the constructor method, add an event-handler\
    \ method for the `ActionListener` interface\n\n```\npublic void actionPerformed(\
    \ ActionEvent event ) { }\n```\n\n![image](images/7r.jpg)Between the curly brackets\
    \ of the event-handler, insert an `if` statement to respond to a decision button\
    \ click\n\n```\nif ( event.getSource() == btn1 )\n{\n  int n = JOptionPane.showConfirmDialog(\
    \ this ,\n  “Do you agree?” , “Confirmation Dialog” ,\n  JOptionPane.YES_NO_CANCEL_OPTION\
    \ ) ;\n  switch( n )\n  {\n      case 0 : field.setText( “Agreed” ) ; break ;\n\
    \      case 1 : field.setText( “Disagreed” ) ; break ;\n      case 2 : field.setText(\
    \ “Canceled” ) ; break ;\n  }\n}\n```\n\n![image](images/8r.jpg)Insert an `if`\
    \ statement to handle user input\n\n```\nif ( event.getSource() == btn2 )\nfield.setText(\
    \ JOptionPane.showInputDialog( this ,\n“Enter your comment” , “Input Dialog” ,\n\
    JOptionPane.PLAIN_MESSAGE ) ) ;\n```\n\n![image](images/9r.jpg)Save the program\
    \ as `Request.java` then compile and run the program, clicking on each button\n\
    \n![image](images/pg165_1.jpg)\n![image](images/pg165_2.jpg)\n![image](images/pg165_3.jpg)\n\
    ![image](images/pg165_4.jpg)\n![image](images/pg165_5.jpg)\n![image](images/hot.jpg)\n\
    \nThe `OK_CANCEL` constant provides two decision buttons – `OK` returns zero and\
    \ `CANCEL` returns 2. Refer to the documentation for the full range of constants.\n\
    \n## Summary\n\n•The `implements` keyword can be used in a class declaration to\
    \ add one or more `EventListener` interfaces.\n•A component’s `addActionListener()`\
    \ method takes the `this` keyword as its argument – to make that component generate\
    \ an `ActionEvent` event when it is activated.\n•The `ActionListener` interface\
    \ passes a generated `ActionEvent` event as the argument to its `actionPerformed()`\
    \ event-handler, which can respond to a push button click made by the user.\n\
    •The `getSource()` method of an `ActionEvent` event can be used to identify the\
