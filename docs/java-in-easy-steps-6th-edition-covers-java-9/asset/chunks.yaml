    [**Breaking out of loops**](#chapter03.html_sec26)


    [**Returning control**](#chapter03.html_sec27)


    [**Summary**](#chapter03.html_sec28)


    **Branching with if**


    The **if** keyword performs a conditional test to evaluate an expression for a
    Boolean value. A statement following the expression will only be executed when
    the evaluation is **true**, otherwise the program proceeds on to subsequent code
    – pursuing the next “branch”. The **if** statement syntax looks like this:


    ![image](images/ycap.jpg)


    **if (** *test-expression* **)** *code-to-be-executed-when-true* **;**


    The code to be executed can contain multiple statements if they are enclosed within
    curly brackets to form a “statement block” :


    ![image](images/1g.jpg)Start a new program named “If” containing the standard
    main method


    **class If**


    **{**


    **public static void main (String[] args) {          }**


    **}**


    ![image](images/java.jpg)


    If.java


    ![image](images/2g.jpg)Between the curly brackets of the main method, insert this
    simple conditional test that executes a single statement when one number is greater
    than another


    **if ( 5 > 1 ) System.out.println( “Five is greater than one.” ) ;**


    ![image](images/3g.jpg)Add a second conditional test, which executes an entire
    statement block when one number is less than another


    **if ( 2 < 4 )**


    **{**


    **System.out.println( “Two is less than four.” ) ;**


    **System.out.println( “Test succeeded.” ) ;**


    **}**


    ![image](images/4g.jpg)Save the program as **If.java** then compile and run the
    program to see all statements get executed – because both tests evaluate as **true**
    in this case:


    ![image](images/pg44_1.jpg)


    ![image](images/hot.jpg)


    Expressions can utilize the **true** and **false** keywords. The test expression
    **( 2 < 4 )** is shorthand for **( 2 < 4 == true )**.


    A conditional test can also evaluate a complex expression to test multiple conditions
    for a Boolean value. Parentheses enclose each test condition to establish precedence
    – so they get evaluated first. The Boolean **&&** AND operator ensures the complex
    expression will only return **true** when both tested conditions are true:


    **if** **( (** *test-condition1* **) && (** *test-condition2* **) )** *execute-this-code*
    **;**


    The Boolean **||** OR operator ensures a complex expression will only return **true**
    when either one of the tested conditions is true:


    **if ( (** *test-condition1* **) || (** *test-condition2* **) )** *execute-this-code*
    **;**


    A combination of these can form longer complex expressions:


    ![image](images/5g.jpg)Inside the main method of **If.java** insert this line
    to declare and initialize an integer variable named **num int num = 8 ;**


    ![image](images/6g.jpg)Add a third conditional test that executes a statement
    when the value of the **num** variable is within a specified range, or when it’s
    exactly equal to a specified value


    **if ( ( ( num > 5 ) && ( num < 10 ) ) || ( num == 12 ) )**


    **System.out.println( “Number is 6-9 inclusive, or 12” ) ;**


    ![image](images/7g.jpg)Recompile the program, and run it once more to see the
    statement after the complex expression get executed


    ![image](images/pg45_1.jpg)


    ![image](images/8g.jpg)Change the value assigned to the **num** variable so it
    is neither within the specified range 6-9, or exactly 12\. Recompile the program,
    and run it again to now see the statement after the complex expression is not
    executed


    ![image](images/hot.jpg)


    The range can be extended to include the upper and lower limits using the **>=**
    and **<=** operators.


    ![image](images/forget.jpg)


    The complex expression uses the **==** equality operator to specify an exact match,
    not the **=** assignment operator.


    **Branching alternatives**


    The **else** keyword is used in conjunction with the **if** keyword to create
    **if else** statements that provide alternative branches for a program to pursue
    – according to the evaluation of a tested expression. In its simplest form, this
    merely nominates an alternative statement for execution when the test fails:


    **if (** *test-expression* **)**


    *code-to-be-executed-when-true* **;**


    **else**


    *code-to-be-executed-when-false* **;**


    Each alternative branch may be a single statement or a statement block of multiple
    statements – enclosed within curly brackets.


    More powerful **if else** statements can be constructed that evaluate a test expression
    for each alternative branch. These employ nested **if** statements after each
    **else** keyword to specify each further test. When the program discovers an expression
    that evaluates as **true**, it executes the statements associated with just that
    test then exits the **if else** statement without exploring any further branches:


    ![image](images/1g.jpg)Start a new program named “Else” containing the standard
    main method


    **class Else**


    **{**


    **public static void main ( String[] args ) {          }**


    **}**


    ![image](images/java.jpg)


    Else.java


    ![image](images/2g.jpg)Inside the main method, insert this line to declare and
    initialize an integer variable named **hrs**


    **int hrs = 11 ;**


    ![image](images/3g.jpg)Insert this simple conditional test, which executes a single
    statement when the value of the **hrs** variable is below 13


    **if ( hrs < 13 )**


    **{**


    **System.out.println( “Good morning: ” + hrs ) ;**


    **}**


    ![image](images/4g.jpg)Save the program as **Else.java** then compile and run
    the program to see the statement get executed


    ![image](images/snake.jpg)


    Notice that the first statement is terminated with a semicolon, as usual, before
    the else keyword.


    ![image](images/pg47_1.jpg)


    ![image](images/5g.jpg)Change the value assigned to the **hrs** variable to 15,
    then add this alternative branch right after the **if** statement


    **else if ( hrs < 18 )**


    **{**


    **System.out.println( “Good afternoon: ” + hrs ) ;**


    **}**


    ![image](images/6g.jpg)Save the changes, recompile, and run the program again
    to see just the alternative statement get executed


    ![image](images/pg47_2.jpg)


    It is sometimes desirable to provide a final **else** branch, without a nested
    **if** statement, to specify a “default” statement to be executed when no tested
    expression evaluates as **true**:


    ![image](images/7g.jpg)Change the value assigned to the **hrs** variable to 21,
    then add this default branch to the end of the **if else** statement


    **else System.out.println( “Good evening: ” + hrs ) ;**


    ![image](images/8g.jpg)Save the changes, recompile, and run the program once more
    to see just the default statement get executed


    ![image](images/pg47_3.jpg)


    ![image](images/forget.jpg)


    Conditional branching is the fundamental process by which computer programs proceed.


    **Switching branches**


    Lengthy **if else** statements, which offer many conditional branches for a program
    to pursue, can become unwieldy. Where the test expressions repeatedly evaluate
    the same variable value, a more elegant solution is often provided by a **switch**
    statement.


    The syntax of a typical switch statement block looks like this:


    **switch (** *test-variable* **)**


    **{**


    **case** *value1* **:** *code-to-be-executed-when-true* **; break ;**


    **case** *value2* **:** *code-to-be-executed-when-true* **; break ;**


    **case** *value3* **:** *code-to-be-executed-when-true* **; break ;**


    **default :** *code-to-be-executed-when-false* **;**


    **}**


    The **switch** statement works in an unusual way. It takes a specified variable
    then seeks to match its assigned value from among a number of **case** options.
    Statements associated with the option whose value matches are then executed.'
