    ![image](img/9b.jpg)\n然后，将布局容器添加到 `JPanel` 容器中\n\n```java\npnl.add( box ) ;\n\
    ```\n\n![image](img/10b.jpg)将程序保存为 `Custom.java`，然后编译并运行程序以查看效果\n\n![image](img/pg149_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n在这种情况下，自定义颜色等于 `Color.RED`，因为 RGB 值指定了最大红色值而没有绿色或蓝色。\n\
    \n![image](img/hot.jpg)\n\n`Box` 对象是一个方便的轻量级容器，它使用 `BoxLayout` 作为其布局管理器。`Box`\
    \ 对象的 `createVerticalBox()` 方法会从上到下单独显示其组件。\n\n### 总结\n\n- `javax.swing` 包包含了用于创建\
    \ GUI 组件的 Java Swing 类。\n- 窗口作为顶层 `JFrame` 容器创建。\n- `JFrame` 构造函数应该指定窗口的标题、大小、默认关闭操作和可见性。\n\
    - `JPanel` 容器使用其默认的 `FlowLayout` 布局管理器在换行中显示较小的组件。\n- `JButton` 构造函数可以指定显示在推入按钮组件上的文本和图像。\n\
    - `ImageIcon` 对象表示程序中使用的图像。\n- 要部署为单个 Java 归档 (JAR) 的程序应使用 `ClassLoader` 对象来指定图像源。\n\
    - `JLabel` 对象显示非交互式文本和图像内容。\n- 可编辑文本可以现在 `JTextField` 和 `JTextArea` 字段中。\n- `JScrollPane`\
    \ 对象为 `JTextArea` 字段提供滚动条。\n- 可以 `JCheckBox`、`JComboBox` 和 `JList` 组件显示选择项。\n\
    - `ButtonGroup` 对象逻辑上对若干 `JRadioButton` 组件分组，以便只有一个一个可以被选中。\n- 特定的 RGB 颜色可以通过\
    \ `java.awt` 包中的 `Color` 类表示。\n- `java.awt` 包有一个 `Font` 类，可以用于创建表示特定字体名称、样式和大小的对象。\n\
    - 可以使用 `java.awt` 包中的 `Container` 类表示 `JFrame` 的内容面板，向 `JFrame` 容器添加多个 `JPanel`\
    \ 容器。\n- 创建 `JPanel` 容器对象时，其参数可以指定布局管理器。\n\n9\n\n### 识别事件\n\n*本章演示了如何创建 Java 程序事件处理器，以响应用户界面操作。*\n\
    \n- 监听事件\n- 生成事件\n- 处理按钮事件\n- 处理项目事件\n- 响应键盘事件\n- 响应鼠标事件\n- 发布消息\n- 请求输入\n- 总结\n\
    \n### 监听事件\n\n用户可以通过执行鼠标、键盘或其他输入设备的操作来与提供图形用户界面 (GUI) 的程序进行交互。这些操作会导致界面中发生“事件”，让程序响应这些事件被称为“事件处理”。\n\
    \n为了让程序识别用户事件，它需要添加来自 `java.awt.event` 包的一个或多个 `EventListener` 接口。可以通过在程序开头添加初始语句\
    \ `import java.awt.event.* ;` 使这些接口对程序可用。\n\n可以使用 `implements` 关键字在类声明中包含所需的 `EventListener`\
    \ 接口。例如，一个监听按钮点击的类声明可能如下所示：\n\n```java\nclass Click extends JFrame implements\
    \ ActionListener { }\n```\n\nJava 文档描述了许多可以监听不同事件的 `EventListener` 接口，但最常用的列在下表所示，并附有简要描述：\n\
    \n| EventListener: | 描述: |\n| :--- | :--- |\n| `ActionListener` | 识别当按钮被按下或释放时发生的动作事件\
    \ |\n| `ItemListener` | 识别当列表项被选中或取消选中时发生的项目事件 |\n| `KeyListener` | 识别当用户按下或释放按键时发生的键盘事件\
    \ |\n| `MouseListener` | 识别当用户按下或释放鼠标按钮，以及鼠标进入或退出组件时发生的鼠标按钮动作 |\n| `MouseMotionListener`\
    \ | 识别当用户移动鼠标时发生的运动事件 |\n\n![image](img/hot.jpg)\n\n可以在 `implements` 关键字之后以逗号分隔列表的形式包含多个\
    \ `EventListener`。\n\n### 生成事件\n\n如果组件要有用，它们需要生成 `EventListener` 接口可以识别的事件。在如右侧所示向程序添加了适当的\
    \ `EventListener` 后，必须为组件添加一个事件生成器。\n\n例如，为了让程序响应按钮点击，需要向程序添加 `ActionListener`\
    \ 接口，并且必须调用按钮的 `addActionListener()` 方法，并将 `this` 关键字作为其参数。这使得按钮在被点击时生成事件。\n\n\
    创建生成事件的按钮的语句如下：\n\n```java\nJButton btn = new JButton( “Click” ) ;\nbtn.addActionListener(\
    \ this ) ;\n```\n\n当用户点击生成事件的按钮时，`ActionListener` 接口识别事件并在程序中寻找事件处理器来响应。\n\n每个\
    \ `EventListener` 接口都有一个关联的事件处理器，该方法在识别事件时被调用。例如，当按钮被点击时，`ActionListener` 接口会调用名为\
    \ `actionPerformed()` 的方法并传递一个 `ActionEvent` 对象作为参数。\n\n`ActionEvent` 对象包含了有关事件及其产生源组件的信息。通常，它有一个\
    \ `getSource()` 方法来识别生成事件的对象。这可以用于为该组件创建适当的响应。\n\n为特定按钮创建响应的事件处理器可能如下：\n\n```java\n\
    public void actionPerformed( ActionEvent event )\n{\n    if ( event.getSource()\
    \ == btn )\n    {\n        // 此按钮执行的语句\n    }\n}\n```\n\n"
- fmt: "\n![image](images/4r.jpg)Before the `Actions()` constructor, create two `JButton`\
    \ push buttons and a `JTextArea` text field\n\n```java\nJButton btn1 = new JButton(\
    \ “Button 1” ) ;\nJButton btn2 = new JButton( “Button 2” ) ;\nJTextArea txtArea\
    \ = new JTextArea( 5 , 38 ) ;\n```\n\n![image](images/5r.jpg)Add the buttons and\
    \ text area to the `JPanel` container\n\n```java\npnl.add( btn1 ) ;\npnl.add(\
    \ btn2 ) ;\npnl.add( txtArea ) ;\n```\n\n![image](images/6r.jpg)Insert statements\
    \ to set the initial state of two components\n\n```java\nbtn2.setEnabled( false\
    \ ) ;\ntxtArea.setText( “Button 2 is Disabled” ) ;\n```\n\n![image](images/7r.jpg)In\
    \ the `Actions()` constructor, insert statements to make each button generate\
    \ an `ActionEvent` event when clicked\n\n```java\nbtn1.addActionListener( this\
    \ ) ;\nbtn2.addActionListener( this ) ;\n```\n\n![image](images/8r.jpg)After the\
    \ constructor method, add an event-handler method for the `ActionListener` interface\
    \ – to display text identifying which button has been clicked\n\n```java\npublic\
    \ void actionPerformed( ActionEvent event )\n{\n    txtArea.setText( event.getActionCommand()\n\
    \            + “ Clicked and Disabled” ) ;\n}\n```\n\n![image](images/9r.jpg)Insert\
    \ `if` statements in the event-handler method – executing a specific response\
    \ to each button click\n\n```java\nif ( event.getSource() == btn1 )\n{ btn2.setEnabled(\
    \ true ) ; btn1.setEnabled( false ) ; }\nif ( event.getSource() == btn2 )\n{ btn1.setEnabled(\
    \ true ) ; btn2.setEnabled( false ) ; }\n```\n\n![image](images/10r.jpg)Save the\
    \ program as `Actions.java` then compile and run the program, clicking the push\
    \ buttons\n\n![image](images/pg155_1.jpg)\n\n![image](images/pg155_2.jpg)\n\n\
    ![image](images/pg155_3.jpg)\n\n![image](images/forget.jpg)\n\nThe components\
    \ are declared before the constructor so they are globally accessible to the event-handler\
    \ method.\n\n![image](images/hot.jpg)\n\nIt’s sometimes useful to disable a component\
    \ until the user has performed a required action.\n\n### Handling item events\n\
    \nSwing `JRadioButton`, `JCheckBox` and `JComboBox` components maintain states\
    \ whose change can be recognized by the `ItemListener` interface, which will pass\
    \ the `ItemEvent` to its `itemStateChanged()` event-handler method. The `ItemEvent`\
    \ object has a `getItemSelectable()` method that identifies the originating component\
    \ and a `getStateChange()` method that returns its status. This will determine\
    \ if the change is selecting or deselecting an item, and can be compared to an\
    \ `ItemEvent.SELECTED` constant.\n\n![image](images/1r.jpg)Edit a copy of `Window.java`\
    \ from [here](#chapter08.html_pg135) , changing the class name in the declaration,\
    \ the constructor, and the instance statement from “Window” to “States”. Then,\
    \ add a statement at the very start of the program to import the functionality\
    \ of the `java.awt.event` package\n\n```java\nimport java.awt.event.* ;\n```\n\
    \n![image](images/java.jpg)\n\nStates.java\n\n![image](images/2r.jpg)Edit the\
    \ class declaration to add an `ItemListener` interface to the program\n\n```java\n\
    class States extends JFrame implements ItemListener\n```\n\n![image](images/3r.jpg)Before\
    \ the `States()` constructor, create these components\n\n```java\nString[] styles\
    \ = { “Deep Dish” , “Gourmet Style” , “Thin & Crispy” } ;\nJComboBox<String> box\
    \ = new JComboBox<String> ( styles ) ;\nJRadioButton rad1 = new JRadioButton(\
    \ “White” ) ;\nJRadioButton rad2 = new JRadioButton( “Red” ) ;\nButtonGroup wines\
    \ = new ButtonGroup() ;\nJCheckBox chk = new JCheckBox( “Pepperoni” ) ;\nJTextArea\
    \ txtArea = new JTextArea( 5 , 38 ) ;\n```\n\n![image](images/4r.jpg)In the `States()`\
    \ constructor, insert statements to group the two `JRadioButton` components\n\n\
    ```java\nwines.add( rad1 ) ;\nwines.add( rad2 ) ;\n```\n\n![image](images/5r.jpg)Insert\
    \ statements to add the components to the `JPanel` container\n\n```java\npnl.add(\
    \ rad1 ) ;\npnl.add( rad2 ) ;\npnl.add( chk ) ;\npnl.add( box ) ;\npnl.add( txtArea\
    \ ) ;\n```\n\n![image](images/hot.jpg)\n\nNote how this example uses the `append()`\
    \ method to add further text to the text area.\n\n![image](images/6r.jpg)Insert\
    \ statements to make selectable components generate an `ItemEvent` event when\
    \ an item is selected\n\n```java\nrad1.addItemListener( this ) ;\nrad2.addItemListener(\
    \ this ) ;\nchk.addItemListener( this ) ;\nbox.addItemListener( this ) ;\n```\n\
    \n![image](images/7r.jpg)After the constructor method, add an event-handler method\
    \ for the `ItemListener` interface – to display text identifying which button\
    \ has been clicked\n\n```java\npublic void itemStateChanged( ItemEvent event )\n\
    {\n    if ( event.getItemSelectable() == rad1 )\n        txtArea.setText( “White”\
    \ ) ;\n    if ( event.getItemSelectable() == rad2 )\n        txtArea.setText(\
    \ “Red” ) ;\n    if ( event.getItemSelectable() == chk )\n        txtArea.append(\
    \ “Pepperoni\\n” ) ;\n    if ( event.getItemSelectable() == box )\n        txtArea.append(\
    \ event.getStateChange().toString() + “ selected\\n” ) ;\n}\n```\n\n### Reacting\
    \ to keyboard events\n\nSwing components that allow the user to input text can\
    \ recognize user key strokes with the `KeyListener` interface, which will pass\
    \ the `KeyEvent` event to these three methods:\n\n| Event-handler | Description\
    \ |\n| :--- | :--- |\n| `keyPressed( KeyEvent event )` | Called when a key is\
    \ pressed |\n| `keyTyped( KeyEvent event )` | Called after a key is pressed |\n\
    | `keyReleased( KeyEvent event )` | Called when a key is released |\n\nWhen a\
    \ program implements `KeyListener` it must declare these three methods – even\
    \ if not all used. The `KeyEvent` object has a `getKeyChar()` method, which returns\
    \ the character for that key, and a `getKeyCode()` method, which returns an integer\
    \ Unicode value representing that key. Additionally, a `getKeyText()` method takes\
    \ the key code value as its argument and returns a description of that key.\n"
