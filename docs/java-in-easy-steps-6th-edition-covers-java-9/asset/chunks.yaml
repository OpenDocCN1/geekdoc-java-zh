- fmt: "\n![image](images/4g.jpg)\nSelect the device type and platform level (for\
    \ example, “Phone and Tablet” running “Ice Cream Sandwich”)\n\n![image](images/hot.jpg)\n\
    \nThe Package name is an automatically assigned unique identifier for the app,\
    \ comprised of `com.*domain.appname`\n\n![image](images/pg175_1.jpg)\n\n![image](images/5g.jpg)Click\
    \ `Next` to open the “Add an Activity to Mobile” dialog, and simply select the\
    \ `Empty Activity` option\n\n![image](images/6g.jpg)Click `Next` to open the “Customize\
    \ the Activity” dialog\n\n![image](images/pg175_2.jpg)\n\n![image](images/7g.jpg)Click\
    \ `Finish` to accept the suggested configuration – Android Studio will now generate\
    \ several files and folders for the new project (this can take a while) then eventually\
    \ open the IDE interface\n\n![image](images/hot.jpg)\n\nChoose `API 15` if you\
    \ would like the app to run on 100% of devices active on the Google Play Store.\n\
    \n![image](images/forget.jpg)\n\nYou can change the suggested names here, but\
    \ be sure to leave the `Generate Layout File` and `Backwards Compatibility` boxes\
    \ checked.\n\n## Exploring project files\n\nThe Android Studio IDE provides a\
    \ Project window that displays an expandable tree view of all files and folders\
    \ within the project. You can click any arrow in the Project window to expand\
    \ a folder, and double-click on any file in the Project window to open it in the\
    \ tabbed Editor window.\n\n![image](images/pg176_1.jpg)\n\nDespite its initial\
    \ appearance of complexity, only two files need modification by the developer\
    \ to create a customized application:\n\n* `MainActivity.java` – The Java file\
    \ that loads controls into the app interface and can contain event-handler code\
    \ to respond to user actions within the app interface.\n* `activity_main.xml`\
    \ – The XML file that defines each control to appear in the app interface and\
    \ their layout.\n\n![image](images/hot.jpg)\n\nIf the Project window is not immediately\
    \ visible click the Project button in the left sidebar, or open it using the shortcut\
    \ keys `Alt + F1`.\n\nSelecting the `activity_main.xml` file in the Project window\
    \ presents it in the Editor window in one of two possible views – visually in\
    \ Design view or programmatically in Text view. There are tabs at the bottom of\
    \ the window to switch between views.\n\n![image](images/pg177_1.jpg)\n\nDesign\
    \ view provides a Palette of controls that can be dragged onto a graphical representation\
    \ of the app, a Component Tree to select any added control, and a Properties window\
    \ in which to modify the appearance of a selected control.\n\nText view provides\
    \ a “code-behind” version of the layout that describes each aspect of added controls\
    \ using XML attributes.\n\n![image](images/pg177_2.jpg)\n\nControls can be added\
    \ to the app interface and modified either visually in Design view or programmatically\
    \ in Text view.\n\n## Adding resources & controls\n\n### Image Resources\n\nTo\
    \ begin customizing the default Android Studio empty app for the Lotto program,\
    \ the image can first be added as a “resource”:\n\n![image](images/1g.jpg)Right-click\
    \ on the `Lotto.png` image, and choose `Copy`\n\n![image](images/2g.jpg)Next,\
    \ right-click on the `app>res>drawable` folder and choose `Paste` – to see a “Copy”\
    \ dialog appear\n\n![image](images/3g.jpg)Rename the file to lowercase `Lotto.png`\n\
    \n![image](images/4g.jpg)Click `OK` to see the file now appear in the `drawable`\
    \ folder\n\n![image](images/pg178_1.jpg)\n\n![image](images/snake.jpg)\n\nAndroid\
    \ only supports lowercase filenames for resource items.\n\n![image](images/pg178_2.jpg)\n\
    \n### Interface Controls\n\nThe Lotto app will require three interface controls\
    \ aligned one above the other in a vertical layout. An ImageView control is required\
    \ for the logo, a TextView control is required for the output, and a Button control\
    \ is required for user interaction:\n\n![image](images/1g.jpg)Open the `activity_main.xml`\
    \ file in the Editor’s Text view\n\n![image](images/xml.jpg)\n\nactivity _main.xml\n\
    \n![image](images/2g.jpg)Insert this ImageView control element immediately before\
    \ the existing default TextView element\n\n```xml\n<ImageView\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    app:srcCompat=\"\
    @drawable/lotto\"\n    android:id=\"@++id/imageView\"\n    app:layout_constraintTop_toTopOf=\"\
    parent\" />\n```\n\n![image](images/forget.jpg)\n\nThe `app:srcCompat` attribute\
    \ references the image resource added to the `drawable` folder.\n\nThe attributes\
    \ in this element fit the control to the width of the layout container, and position\
    \ the control at the top of the container. The image resource is defined as the\
    \ content source, and the element is given an id for reference by other elements.\n\
    \n![image](images/3g.jpg)Edit the existing TextView element to look like this\n\
    \n```xml\n<TextView\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    wrap_content\"\n    android:id=\"@++id/textView\"\n    android:height=\"60dp\"\
    \n    android:textSize=\"36sp\"\n    android:gravity=\"center_horizontal\" \n\
    \    app:layout_constraintTop_toBottomOf=\"@++id/imageView\" />\n```\n\n![image](images/4g.jpg)Insert\
    \ this element right after the TextView element\n\n```xml\n<Button\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"\
    @++id/button\"\n    android:textSize=\"24sp\"\n    android:onClick=\"lotto\"\n\
    \    android:text=\"GET MY NUMBERS\" \n    app:layout_constraintTop_toBottomOf=\"\
    @++id/textView\" />\n```\n\n![image](images/hot.jpg)\n\nThe `android:id` attribute\
    \ in each element specifies a unique name by which the element can be referenced\
    \ in code.\n\n![image](images/hot.jpg)\n\nThe `android:onClick` attribute specifies\
    \ the name of an event-handler to be called.\n\n### String Resources\n\nThe strings\
    \ assigned to the image content and to specify the button text should each be\
    \ converted to a string resource:\n\n![image](images/1g.jpg)Click within the `Lotto\
    \ Logo` string assignment to give it focus, then press `Alt + Enter` to see QuickFix\
    \ dialog\n\n![image](images/pg179_1.jpg)\n\n![image](images/2g.jpg)Choose `Extract\
    \ string resource`, then provide a resource name in the “Extract Resource” dialog\
    \ now appears\n\n![image](images/pg179_2.jpg)\n\n![image](images/3g.jpg)Click\
    \ `OK` to close the dialog, and see the assigned string replaced by a reference\
    \ to the string resource\n\n![image](images/pg179_3.jpg)\n\n![image](images/4g.jpg)Repeat\
    \ this for the `GET MY NUMBERS` string\n\n### Inserting Java code\n\nAfter adding\
    \ resources and controls [here](#chapter10.html_pg179), the app interface should\
    \ now resemble that of the `Lotto.jar` application:\n\n![image](images/pg180_1.jpg)\n\
    \n![image](images/snake.jpg)\n\nIf the controls do not look like this screenshot,\
    \ you should return to [here](#chapter10.html_pg179) and carefully check each\
    \ element’s attributes.\n\nFunctionality can next be added to the app by inserting\
    \ an event-handler into the `MainActivity.java` file that will respond to the\
    \ button’s `onClick` event when the user pushes the button. This event automatically\
    \ passes one argument to the event-handler, which is an identifying reference\
    \ to the control that has been clicked. Consequently, the event-handler signature\
    \ must accommodate the argument by including a parameter for the `View` class\
    \ – the base class of all widgets. The method must also have a `void` return type:\n\
    \n![image](images/1g.jpg)Insert this event-handler signature into the `MainActivity`\
    \ class, immediately after its `onCreate()` ` method block\n\n```java\npublic\
    \ void lotto(View vue) { }\n```\n\n![image](images/java.jpg)\n\nMainActivity.java\n\
    \nInterface controls can be referenced in code by specifying their identity as\
    \ the argument to a `findViewById()` ` method. This is the name assigned to their\
    \ `android:id` आयु in `activity_main.xml` prefixed by `R.id.` :\n\n![image](images/2g.jpg)Inside\
    \ the event-handler block, assign a reference to the `<TextView>` control element\
    \ to a variable\n\n```java\nTextView txt = (TextView) findViewById( R.id.textView)\
    \ ;\n```\n"
