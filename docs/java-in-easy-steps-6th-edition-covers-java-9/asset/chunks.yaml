  trans: "\n\n![image](img/4g.jpg)\n选择设备类型和平台级别（例如，运行“Ice Cream Sandwich”的“手机和平板”）\n\
    \n![image](img/hot.jpg)\n\n包名是自动分配的应用程序唯一标识符，由 `com.*domain.appname` 组成\n\n![image](img/pg175_1.jpg)\n\
    \n![image](img/5g.jpg)点击 `Next` 打开“向手机设备添加 Activity”对话框，只需选择 `Empty Activity`\
    \ 选项\n\n![image](img/6g.jpg)点击 `Next` 打开“自定义 Activity”对话框\n\n![image](img/pg175_2.jpg)\n\
    \n![image](img/7g.jpg)点击 `Finish` 接受建议的配置——Android Studio 现在将为新项目生成若干文件和文件夹（这可能需要一段时间），最后打开\
    \ IDE 界面\n\n![image](img/hot.jpg)\n\n如果你希望应用运行在 Google Play 商店 100% 的活跃设备上，请选择\
    \ `API 15`。\n\n![image](img/forget.jpg)\n\n你可以在这里更改建议的名称，但请确保勾选 `Generate Layout\
    \ File`（生成布局文件）和 `Backwards Compatibility`（向后兼容）框。\n\n## 探索项目文件\n\nAndroid Studio\
    \ IDE 提供了一个 Project 窗口，显示项目内所有文件和文件夹的可展开树。你可以点击 Project 窗口中的任何箭头来展开文件夹，并双击 Project\
    \ 窗口中的任何文件在标签 Editor 窗口中打开它。\n\n![image](img/pg176_1.jpg)\n\n尽管初看起来很复杂，但开发者只需修改两个文件即可创建一个自定义应用程序：\n\
    \n* `MainActivity.java` – 负责将控件加载到应用界面的 Java 文件，并可以包含事件处理代码，以响应应用界面中的用户操作。\n*\
    \ `activity_main.xml` – 用于定义显示在应用界面中的每个控件及其布局的 XML 文件。\n\n![image](img/hot.jpg)\n\
    \n如果 Project 窗口没有立即显示，请点击左侧边栏中的 Project 按钮，或使用快捷键 `Alt + F1` 打开它。\n\n在 Project\
    \ 窗口中选择 `activity_main.xml` 文件，它将在 Editor 窗口中以两种视图之一显示——视觉上的 Design（设计）视图或程序化的\
    \ Text（文本）视图。窗口底部有标签可以切换视图。\n\n![image](img/pg177_1.jpg)\n\nDesign 提供了一个 Palette（调色板），可以将控件拖动到应用的图形化表示上；一个用于选择任何添加控件的\
    \ Component Tree（组件树），以及一个用于修改所选控件外观的 Properties（属性）窗口。\n\nText 提供了布局的“后台”版本，使用\
    \ XML 属性描述添加控件的每个方面。\n\n![image](img/pg177_2.jpg)\n\n控件可以在 Design 视图中通过视觉方式修改，也可以在\
    \ Text 视图中通过程序方式修改。\n\n## 添加资源与控件\n\n### 图像资源\n\n要开始为 Lotto 程序自定义默认的 Android Studio\
    \ 空应用，首先可以将图像作为“资源”添加：\n\n![image](img/1g.jpg)右键点击 `Lotto.png` 图像，并选择 `Copy`（复制）\n\
    \n![image](img/2g.jpg)接下来，右键点击 `app>res>drawable` 文件夹并选择 `Paste`（粘贴）——会出现一个“Copy”对话框\n\
    \n![image](img/3g.jpg)将文件重命名为小写的 `lotto.png`\n\n![image](img/4g.jpg)点击 `OK` 查看文件现在出现在\
    \ `drawable` 文件夹中\n\n![image](img/pg178_1.jpg)\n\n![image](img/snake.jpg)\n\n\
    Android 资源项仅支持小写文件名。\n\n![image](img/pg178_2.jpg)\n\n### 界面控件\n\nLotto 应用需要三个在垂直布局中上下对齐的界面控件。Logo\
    \ 需要一个 ImageView 控件，输出需要一个 TextView 控件，用户交互需要一个 Button 控件：\n\n![image](img/1g.jpg)在\
    \ Editor 的 Text 视图中打开 `activity_main.xml` 文件\n\n![image](img/xml.jpg)\n\nactivity\
    \ main.xml\n\n![image](img/2g.jpg)在现有的默认 TextView 元素之前立即插入此 ImageView 控件元素\n\n\
    ```xml\n<ImageView\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    wrap_content\"\n    app:srcCompat=\"@drawable/lotto\"\n    android:id=\"@++id/imageView\"\
    \n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n![image](img/forget.jpg)\n\
    \n`app:srcCompat` 属性引用了添加到 `drawable` 文件夹的图像资源。\n\n该元素中的属性使控件适应布局容器的宽度，并将控件放置在容器的顶部。图像资源被定义为内容源，并为元素分配\
    \ id 以供其他元素引用。\n\n![image](img/3g.jpg)编辑现有的 TextView 元素使其像这样\n\n```xml\n<TextView\n\
    \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:id=\"@++id/textView\"\n    android:height=\"60dp\"\n    android:textSize=\"\
    36sp\"\n    android:gravity=\"center_horizontal\" \n    app:layout_constraintTop_toBottomOf=\"\
    @++id/imageView\" />\n```\n\n![image](img/4g.jpg)在 TextView 之后直接插入此元素\n\n```xml\n\
    <Button\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    wrap_content\"\n    android:id=\"@++id/button\"\n    android:textSize=\"24sp\"\
    \n    android:onClick=\"lotto\"\n    app:layout_constraintTop_toBottomOf=\"@+id/textView\"\
    \ />\n```\n\n![image](img/hot.jpg)\n\n元素中的 `android:id` 属性指定了一个唯一名称，以便在代码中引用控件。\n\
    \n![image](img/hot.jpg)\n\n`android:onClick` 属性指定了要调用的事件处理程序名称。\n\n### 字符串资源\n\
    \n分配给内容和按钮文本的字符串都应转换为字符串资源：\n\n![image](img/1g.jpg)点击 `Lotto Logo` 字符串赋值使其聚焦，然后按\
    \ `Alt + Enter` 查看 QuickFix 对话框\n\n![image](img/pg179_1.jpg)\n\n选择 `Extract resource`（提取字符串资源），然后在“Extract\
    \ Resource”对话框中提供资源名称\n\n![image](img/pg179_2.jpg)\n\n![image](img/3g.jpg)点击 `OK`\
    \ 关闭对话框，看到分配的字符串被替换为资源的引用\n\n![image](img/pg179_3.jpg)\n\n![image](img/4g.jpg)对\
    \ `GET MY NUMBERS` 字符串重复此操作\n\n### 插入 Java 代码\n\n添加资源和控件后，应用界面现在应该像 `Lotto.jar`\
    \ 应用程序一样\n\n![image](img/pg180_1.jpg)\n\n![image](img/snake.jpg)\n\n如果控件看起来不像截图所示，你应该返回此处并仔细检查每个元素的属性。\n\
    \n接下来可以通过向 `MainActivity.java` 文件中插入事件处理程序为应用添加功能，当用户按下按钮时响应按钮的 `onClick` 事件。此事件会自动向事件处理器传递一个参数，该参数是所点击控件的标识引用。因此，事件处理签名必须通过包含\
    \ `View` 类参数来适应这一点（它是所有控件的基类）。该方法也具有 `void` 返回类型：\n\n![image](img/1g.jpg)将此事件处理签名插入到\
    \ `MainActivity` 类中，紧跟在 `onCreate()` 方法块之后\n\n```java\npublic void lotto(View\
    \ vue) { }\n```\n\n![image](img/java.jpg)\n\nMainActivity.java\n\n可以通过将它们的身份作为\
    \ `findViewById()` 方法的参数在代码中引用界面控件。这是在 `activity_main.xml` 中分配的 `android:id` 名称，并在前面加上\
    \ `R.id.`：\n\n![image](img/2g.jpg)在事件处理器块内部，将 `<TextView>` 控件元素的引用赋值给变量\n\n```java\n\
    TextView txt = (TextView) findViewById( R.id.textView) ;\n```\n"
- fmt: "\n![image](images/3g.jpg)\nFinally, inside the event-handler block, copy the\
    \ code from the event-handler in the `Lotto.java` program (listed [here](#chapter10.html_sec83))\
    \ that outputs six unique random numbers\n\n```java\nint[ ] nums = new int[ 60\
    \ ] ; String str = “ ” ;\nfor ( int i = 1 ; i < 60 ; i++ ) { nums[ i ] = i ; }\n\
    for ( int i = 1 ; i < 60 ; i++ ) {\n    int r= ( int ) ( 59 * Math.random( ) )\
