    \  JPanel pnl = new JPanel();\n\n  // Constructor\n  public Lotto() {\n    super(\"\
    Lotto App\");\n    setSize(260, 210);\n    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \    pnl.add(img);\n    pnl.add(txt);\n    pnl.add(btn);\n    btn.addActionListener(this);\n\
    \    add(pnl);\n    setVisible(true);\n  }\n\n  // Event-handler\n  public void\
    \ actionPerformed(ActionEvent event) {\n    if (event.getSource() == btn) {\n\
    \      int[] nums = new int[60];\n      String str = \"\";\n      for (int i =\
    \ 1; i < 60; i++) { nums[i] = i; }\n      for (int i = 1; i < 60; i++) {\n   \
