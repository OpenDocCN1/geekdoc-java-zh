    ## Creating an object class


    Real-world objects are all around us, and they each have attributes and behaviors
    that we can describe:


    • Attributes describe the features that an object has

    • Behaviors describe actions that an object can perform


    For example, a car might be described with attributes of “red” and “coupe”, along
    with an “accelerates” behavior.


    These features could be represented in Java programming with a `Car` class containing
    variable properties of `color` and `bodyType`, along with an `accelerate()` method.


    ![image](images/pg106_1.jpg)


    Java is said to be an Object Oriented Programming (OOP) language because it makes
    extensive use of object attributes and behaviors to perform program tasks.


    Objects are created in Java by defining a class as a template from which different
    copies, or “instances”, can be made.


    Each instance of the class can be customized by assigning attribute values and
    behaviors to describe that object.


    The `Car` class is created as a class template in the steps described opposite
    – with the default attributes and behavior outlined above. An instance of the
    `Car` class is created in the steps described [here](#chapter06.html_pg109) ,
    inheriting the same default attributes and behavior.


    ![image](images/1bl.jpg)Start a new template class named “Car”


    ```

    class Car

    {

    }

    ```


    ![image](images/java.jpg)


    FirstObject.java


    ![image](images/2bl.jpg)Between the curly brackets of the `Car` class, declare
    and initialize two global `String` constants describing attributes


    ```

    public final static String color = “Red” ;

    public final static String bodyType = “Coupe” ;

    ```


    ![image](images/3bl.jpg)Add a global method describing a behavior


    ```

    public static String accelerate()

    {

    String motion = “Accelerating...” ;

    return motion ;

    }

    ```


    ![image](images/4bl.jpg)After the `Car` class, start a new program class named
    “FirstObject” containing the standard main method


    ```

    class FirstObject

    {

    public static void main ( String[] args ) {     }

    }

    ```


    ![image](images/5bl.jpg)Between the curly brackets of the main method, insert
    statements to output the value of each `Car` attribute and call its behavior method


    ```

    System.out.println( “Paint is “ + Car.color ) ;

    System.out.println( “Style is “ + Car.bodyType ) ;

    System.out.println( Car.accelerate() ) ;

    ```


    ![image](images/6bl.jpg)Save the program as `FirstObject.java` then compile and
    run the program to see the output


    ![image](images/pg107_1.jpg)


    ![image](images/forget.jpg)


    The `static` keyword declares class variables and class methods – in this case,
    as members of the `Car` class.


    ![image](images/hot.jpg)


    Object classes are normally created before the program class containing the main
    method.


    ## Producing an object instance


    Each class has a built-in “constructor” method that can be used to create a new
    instance of that class. The constructor method has the same name as the class,
    and is invoked with the `new` keyword.


    Each instance of a class inherits the object’s attributes and behaviors. The principle
    of inheritance is used throughout Java so that programs can use ready-made properties.


    To be more flexible, object class templates can be defined in a file other than
    that containing the program. This means they can be readily used by multiple programs.


    ![image](images/1bl.jpg)Start a new file, repeating the `Car` class object template
    from the previous example [here](#chapter06.html_sec51)


    ```

    class Car

    {

    public final static String color = “Red” ;

    public final static String bodyType = “Coupe” ;

    public static String accelerate()

    {

    String motion = “Accelerating...” ;

    return motion ;

    }

    }

    ```


    ![image](images/java.jpg)


    Car.java


    ![image](images/2bl.jpg)Save the file as `Car.java`


    ![image](images/3bl.jpg)Start a new program named “FirstInstance” containing the
    standard main method


