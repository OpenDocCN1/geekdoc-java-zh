  md: 'Mirroring its support for coups abroad, Canada has a long history of undermining
    other nations’ politics. British and French colonizers destroyed Indigenous governance
    structures, which often served First Nations well for hundreds of years. They
    liquidated Mi’kmaq leaders in the Maritimes and bombed First Nations chiefs into
    submission on the west coast.


    Since Confederation, the federal government has undermined Indigenous governments
    in innumerable ways. In 1870 and 1885, for example, British and Canadian troops
    violently repressed two rebellions against the expansion of colonial rule into
    Western Canada. Louis Riel, a prominent leader of these resistance movements and
    the founder of Manitoba, was hanged by the Canadian government in 1885.


    For a century Indian Agents oversaw politics on reserves and the 1876 Indian Act
    subverted Indigenous governance. *To instill dependence on Indian Affairs,* the
    federal government-imposed band councils on hundreds of First Nations. The Indian
    Act undercut direct democracy and governing structures linked to distinct land
    and cultural practices. For over half a century women and hereditary chiefs were
    largely excluded from band council politics.


    Despite regular pae to “reconciliation,” Ottawa continues to subvert First Nations
    self-governance and intervened to prevent more democratic decision-making. In
    recent years Canada has repeatedly jailed band council leaders. In 2008, for instance,
    the chief, deputy chief and four other members of the Kitchenuhmaykoosib Ininnuwwug
    (Big Trout Lake) council were imprisoned for their opposition to mining operations
    on their reserve 600 km north of Thunder Bay, Ontario.


    A more subtle way to usurp Indigenous governance has been to impose third party
    management. It grants the federal government control of a reserve’s finances.1'
