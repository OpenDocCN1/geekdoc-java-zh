    street rallies … and encouragement [of] democratic and anti-communist sentiment
    in Congress, armed forces, friendly leader and student groups, church, and business.”4


    Ottawa failed to publicly condemn the ouster of Goulart. “The Canadian reaction
    to the military coup of 1964 was careful, polite and allied with American rhetoric,”
    notes Barbosa in Brazil and Canada in the Americas.5


    As important as following Washington’s tacit support for the coup was also driven
