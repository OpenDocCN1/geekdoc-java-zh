    (a) change in regime.”3


    Washington, Ottawa, and leading segments of Brazil’s business community opposed
    Goulart’s foreign policy and Reformas de Base. Two and a half years into his presidency
    the Brazilian military and conservative political elements organized his ouster.


    When the coup came in April 1964, Washington backed it fully. At one point, President
