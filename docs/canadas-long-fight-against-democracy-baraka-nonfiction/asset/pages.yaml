    than 20,000 US troops to the Dominican Republic, almost half the number of US
    soldiers then in Vietnam.3 Johnson blamed Cuban-trained communist operatives for
    the uprising against the unelected military regime. On May 2, 1965, the President
    claimed “Communist leaders, many of them trained in Cuba, seeing a chance to increase
    disorder, to gain a foothold, joined the revolution. They took increasing control.
    And what began as a popular democratic revolution ... very shortly moved and was
