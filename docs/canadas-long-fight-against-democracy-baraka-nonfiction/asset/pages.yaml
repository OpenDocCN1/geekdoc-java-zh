  md: '# THE DOMINICAN REPUBLIC, 1963


    In late 1962, the leftist Juan Bosch won the Dominican Republic’s first clean
    election with 59% of the vote. At first backed by the US government as a reformer
    who could mediate the excesses of the increasingly embarrassing Rafael Trujillo
    dictatorship, Bosch proved to be more than the toothless politician Washington
    desired. After three decades of Trujillo family rule, Bosch encouraged civil society
    by training cooperative, union, and peasant leaders. The Dominican president also
    moved to break up some of the country’s large plantations and pushed constitutional
    changes that expanded the rights of labour, women, and children. These moves were
    not welcomed by the right-wing church establishment or economic elite that built
    up tremendous wealth under Trujillo. Nor was Washington happy, who saw “another
    Cuba” in Bosch’s mild but important reports.


    After months in office, Bosch was exiled in a military coup backed by industrialists,
    large landowners, and the church. With Washington’s support, the elected government
    was replaced by a three-man military junta. US Senator J. W. Fulbright stated
    that “the United States turned its back on social revolution in Santo Domingo
    and associated itself with a corrupt and reactionary military oligarchy.”1 Bosch
    himself later wrote that “the most influential strata of the population [the upper
    and middle classes] joined with political leaders...in a conspiracy to defeat
    the democratic government.”2


    Growing dissatisfaction with the coup regime spurred a military counter-rebellion
    led by “constitutionalist” forces demanding Bosch be restored to'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'office. After the coup regime successfully removed from power, the US intervened.
