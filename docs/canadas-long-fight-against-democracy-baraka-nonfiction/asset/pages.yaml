  md: '# HONDURAS, 2009


    The Harper government tacitly supported the Honduran military’s 2009 removal of
    elected president Manuel Zelaya. Early on June 28, soldiers entered the presidential
    palace and took a pajama-clad Zelaya to Costa Rica. Soon after, demonstrators
    took to the streets and erected blockades calling for the return of the elected
    president. In response, the military regime imposed martial law in the capital
    Tegucigalpa. What followed was a period of instability characterized by widespread
    state and paramilitary violence against journalists, social movements and the
    political opposition.


    Eight hours after Zelaya’s ouster, a Foreign Affairs spokesperson told Mexico’s
    Notime that Canada had “no comment” regarding the coup. It was not until basically
    every country in the hemisphere denounced the coup that Ottawa finally did so.
    Notime later reported that Canada was the only country in the hemisphere that
    did not explicitly call for Zelaya’s return to power, and on a number of occasions,
    minister of state of foreign affairs Peter Kent said it was important to take
    into account the context in which the military overwhelmed Zelaya, particularly
    whether he had violated the constitution. Kent was quoted in The New York Times
    saying, “there is a context in which these events [the coup] happened.”


    Following the 2009 coup, Honduras had the highest homicide rate in the world and,
    according to Reporters Without Borders, it became the most dangerous country for
    journalists in the first quarter of 2010. Scores of activists were murdered in
    the following years, including Lenca land defender Berta Cáceres, who was one
    of the highest profile activists in Central America.'
