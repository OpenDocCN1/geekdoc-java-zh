  md: '# THE DEMOCRATIC REPUBLIC OF THE

    CONGO, 1961


    The Canadian military played a significant role in the overthrow of Patrice Lumumba,
    the first prime minister of the Democratic Republic of the Congo. In the final
    days of a hastily organized independence, the Congolese elected the str anti-colonialist
    Lumumba, who was once imprisoned by the Belgians. After his election, he sought
    to implement his vision of an independent, decolonized, pan-Africanist Congo,
    which earned the ire of Belgian, US, and Canadian officials. Lumumba would only
    be prime minister for 81 days before foreign forces and domestic enemies organized
    his murder.


    The political forces galvanized by Lumumba threatened Belgium’s plan to maintain
    control over the newly independent country’s resources and, in particular, the
    behemoth Union Minière company. To undermine the elected prime minister, the former
    colonial power backed a secessionist movement in the eastern Katanga province
    and supported a coup and Lumumba’s assassination. During this time Ottawa was
    a willing partner in Belgian/US policy.


    The Belgians oversaw a particularly oppressive colonial regime in the Congo. They
    largely excluded Africans from higher education and professional positions, while
    foreign corporations pillaged its natural resources. A number of Canadian companies
    had a vested interest in maintaining the colonial system in the Congo and throughout
    Africa.'
