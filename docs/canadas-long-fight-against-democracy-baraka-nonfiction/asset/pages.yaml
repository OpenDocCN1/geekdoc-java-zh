  md: '# When it comes to regime change, Ottawa believes the end justifies the means.


    Canada cuts off aid and illegally sanctions countries to turn the people against
    popular elected governments. It interferes in other countries'' affairs by financing
    opposition groups and allowing protesters to use its embassy to topple elected
    leaders.


    It once hosted a secret international gathering to plan the overthrow of popular
    elected leader. Ottawa recognized a marginal opposition politician as the legitimate
    president of a country targeted for regime change. When necessary, Canadian troops
    are deployed to intimidate and subvert governments.


    > But we want democracy and human rights!” goes the mantra. No, you doat exactly
    the opposite, reply Engler and Schalk.


    Whereas Washington''s role in subverting elected governments is widely documented,
    Canada''s role has gone under the radar. The authors push it to centre stage where
    it belongs.


    This carefully researched study highlights how Canada took part in the oyster
    of more than 20 elected governments since 1950.


    **Yves Engler** is a political activist and author of two books. Dubbed as “one
    of the most important voices on the Canadian Left.” *The Globe and Mail* has situated
    him in the mould of I.F. Stone. Yves Engler lives in Montreal.


    **Owen Schalk** is the author of *Canada in Afghanistan: A Story of Military,
    Diplomatic, Political, and Media Failure, 2003-2023*. He contributes a weekly
    column to *Canadian Dimension*. He lives in rural Manitoba.


    With poems by **Rob Rolfe**


