  md: '# BRAZIL, 1964


    In 1964, Brazil’s military overthrew the country’s elected government headed by
    left-leaning president João Goulart. Having assumed power following the resignation
    of President Jânio Quadros in August 1961, Goulart sought to lift Brazil from
    political and socioeconomic crisis by implementing his Reform de Base (Basic Reforms)
    program, which included efforts to combat adult illiteracy, increase taxes on
    the profits of foreign-based companies, and a number of redistributive measures
    including land reform. Goulart also wanted to expand suffrage by giving illiterate
    people and low-ranking military officers the right to vote. He proposed putting
    15% of the national income into education. To pay for this, the government planned
    to introduce a proportional income tax and greater controls on the profit transfers
    of multinational corporations.


    Additionally, Goulart enacted an independent foreign policy. He affirmed Cuba’s
    right to self-determination while entertaining cordial relations with the Soviet
    Union and China. Goulart wanted Washington to be more flexible regarding the terms
    of its assistance and criticized the Kennedy administration’s Alliance for Progress,
    a development program aimed at promoting anti-communism in recipient nations.
    The Kennedy administration was angered at what it considered “an open declaration
    of war on the Alliance for Progress.”¹


    When Goulart threatened to increase Brazil’s economic cooperation with the Soviet
    Union, US ambassador Lincoln Gordon claimed he was threatening to create “a second
    Yugoslavia at best and a second Cuba at worst.” Gordon said Goulart’s threat “impressed
    me once again with'
  merge: -1
