    “马杜罗资助的大族灭杀。”42 去年11月，莱德斯马（Ledezma）逃脱逮捕并逃往国外。43


    渥太华与委内瑞拉反对派中一些最反民主、强硬且在选举边缘化的元素结盟。瓜伊多的人民意志党（VP）多次煽动暴力抗议。在民主统一圆桌反对派联盟候选人亨里克埃·卡皮莱斯（Henrique
    Capiles）于2014年1月实际上承认失败后不久，VP领袖莱奥波尔多·洛佩斯（Leopoldo López）发起了“出走行动”（La Salida），试图推翻马杜罗。VP活动分子组成了“封锁路”（guarimbas）抗议的先锋队，2014年导致43名委内瑞拉人死亡，800人受伤并造成大量财产损失。44
    2017年，另一波由VP支持的抗议浪潮中，数十人被杀。


    VP在煽动暴力方面虽然有效，但未能赢得许多选票。在2015年的选举中，该党获得了8%的席位，使反对派控制了国民议。45 凭借议会167名议员中的14名，它在民主统一圆桌联盟中获得了第四多多的席位。46
    在2012年12月的地区选举中，VP是第六大成功的政党，在次年的市政选举中表现略有其微。


    VP由洛佩斯于2009年底创立，根据《华尔街日报》报道，这位政治家“长期与美国外交官密切接触”。47 洛佩斯是独立领袖西蒙·玻利瓦尔（Simón Bolívar）的远太外甥，一位前内阁成员的孙子以及一位总统的曾孙孙，他曾在哈佛大学肯尼迪政府学院学习过。48
    在2000年至2008年间，洛佩斯是人口为65,000人、富裕的加拉加斯查卡奥市（Chacao）一位相对成功且受欢迎的市长。


    在2002年军事政变期间，洛佩斯“策划了反对查韦斯的公众抗议，并……在逮捕查韦斯内政部长发挥了核心作用。”49 如前所述，他在2014年“封锁路”抗议期间因煽动暴力被定罪，并判处13年监。50


    加拿大官员与洛佩斯的使者及其政党有密切接触。加拿大驻加拉加斯使馆与VP官员合作，推动推翻当选政府。雅拉库伊州（Yaracuy）的VP领袖加布里尔·加洛（Gabriel
    Gallo）是使馆2015年人权奖的亚军。51 作为刑事论坛（组织（Foro Penal）的协调员，加洛还在使馆2017年人权奖颁典上与大使本·罗威尔（Ben
    Rowell）合影。52


    在此期间，大量VP代表访问了渥太华。2017年5月，特鲁多会见了VP领袖洛佩斯的妻子莉莉安·廷托里（Lillian Tintori）。托里担任洛佩斯的使者，因为洛佩斯因在2014年“封锁路”抗议中煽动暴力被定罪而无法前往渥太华。


    三个月后，廷里会见了美国总统唐纳德·特朗普，《卫卫报》报道了她在为任命VP副主席瓜伊多为临时总统的计划建立国际支持方面的作用。53


    作为回应，委内瑞拉外交部长德尔西·罗德里格（Delcy Rodríguez）形容廷里是一个“干预代理”，声称处于“虚假的受地位”，同时与委内瑞拉的“法西斯”力量结盟。54
    根据一系列报告，洛佩斯是任命瓜伊多为临时总统计划的关键委方组织者。55


    加拿大加强了VP在反对派内部的强硬立场。2019年2月，《华尔街日报》的一题为《发生了什么？一个小集团如何夺取委内瑞拉反对派控制权》的文章指出，在瓜伊多宣布自己为临时总统时，与他同台的反对派领先人物对其计划一无所知，尽管他们依赖民主统一圆桌联盟在联盟内部轮换国民议会主席席位的协议。56（VP的轮到本应定于2019年1月）。


    加拿大的“委内瑞拉特别协调员”与VP及反对派合作。从2017年秋到2020年，艾伦·库姆（Allan Culham）担任加拿大委内瑞拉特别顾问。加拿大纳税人向这位强硬、亲企业、亲华盛顿的前外交官支付了数十万，以协调政府推翻委内瑞拉政府的尝试。


    曾任加拿大驻委内瑞拉、萨尔瓦多、危地马拉及美洲组织大使的库姆，在2015年从公职部门退休后描述了他对洛佩斯的亲近。加拿大委内瑞拉特别顾问写道：“我遇到[莱奥波尔多]时，他是加拉加斯查卡奥市的市长，加拿大使馆就在那里。他也变成了一个好朋友，并在试图理解委内瑞拉许多政治现实的过程中非常有用的联系人。”57


    在2002年至2005年担任委内瑞拉大使期间，库姆对胡戈·查韦斯的政府持敌视。根据维基泄露的美国外交电报，“加拿大大使库姆对查韦斯在2004年2月15日其每周电视和广播节目《你好，总统》中的语气表示惊讶。库姆观察到查韦斯的辞令令他所听过的最强硬。库姆说‘他听起来像个霸凌者，更加固执且更具侵略性’”58


    美国电报引用了库姆对国家选举委员会的批评，并对监督针对查韦斯的总统罢免的小组给予了正面评价。文章指出‘库姆补充说，Sumate令人印象深刻、透明，且完全由志愿者运营。’Súmate领导人玛丽亚·科里娜·马查多（Maria
    Corina Machado）的名字出现在支持2002年4月反对查韦斯军事政变的名单上，为此面临叛国罪指控。59 渥太华被动地支持军事扣留查韦斯并实施未经选举的政府。2002年的政变仅持续了几天，随后民众示威、军队内部的分裂和国际谴责便回归。虽然大多数拉丁洲领导人谴责了政变，但加拿大外交官保持了沉默。“在2002年委内瑞拉政变中，加拿大保持了低调，可能因为它对美国对总统胡戈·查韦斯的犹豫态度很敏感，”弗拉维·梅约（Flavie
    Major）在《在美洲促进民主》中写道。库姆可能协调了他的推翻计划，作为他们运动规模之胆妄的另一个迹象，外交服务专业协会授予了全球事务委内瑞拉工作组负责人帕特里亚·阿特金森（Patricia
    Atkinson），其解释道，“帕特里亚和她组建并领导的卓越团队，在针对政权的三轮制裁的内容和组织方面发挥了关键作用。” 涉及到委内瑞拉，连续几届加拿大政府一直反对民主进程，并支持强硬的右翼反对派努力摧毁玻利瓦尔革命。在加拿大，泰勒·希普利（Tyler
    Shipley）简洁地总结了加拿大在1999年后角色的本质：“加拿大积极参与了颠覆和瓦解一个为大多数委内瑞拉人建立的过程的工作。”62


