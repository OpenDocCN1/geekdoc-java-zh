    In response to Mossadeh’s oil nationalization, the British government organized
    an embargo of Iranian oil, which Ottawa followed.8 The embargo weakened Mossadeh’s
    government, enabling the CIA’s subsequent drive to topple the nationalist prime
    minister.


    Following a meeting of the National Security Council on March 11, 1953, the head
    of the CIA Allan Dulles gave the agency’s Tehran bureau one million US dollars
    ($8 million today) to be used “in any way that would bring the fall of Mossadeh.”9
    In *All the Shah’s Men*, Stephen Kinzer explains: “Through a variety of means,
    covert agents would manipulate public opinion and turn as many Iranians against
    Mossadeh. This effort, for which $150,000 was budgeted, would ‘create, extend
    and enhance public hostility and distrust and fear of Mossadeh and his government.’
    It would portray Mossadeh as corrupt, pro-communist, hostile to Islam, and bent
    on destroying the morale and readiness of the armed forces. While Iranian agents
    spread these lies, thugs would be paid to launch staged attacks on religious leaders
    and make it appear that they were ordered by Mossadeh or his supporters.”10


    Pearson did not protest the overthrow of Iran’s first elected prime minister.
    Privately, External Affairs celebrated. Three days after Mossadeh was ousted,
    a cable from the ambassador in Washington explained: “Perhaps the most disturbing
    and unpredictable factor [in Iran] was the continued strength of the Tudeh party.”11
    Iran’s Communist Party, Tudeh, pushed for the nationalization of the Anglo-Iranian
    Oil Company and its support for Mossadeh was used to justify the coup. External
    Affairs joined Anglo-American efforts to demonize and criminalize Tudeh by sending
    the RCMP a copy of a UK government report titled “Tudeh Party of Persia.”12


    When some Canadians asked External Affairs “to prevent the imprisonment or execution
    of premier Mossadeh of Iran,” they were told nothing could be done.13 Four months
    after the coup, Canada’s ambassador in Washington cabled Ottawa about “encouraging
    reports from their [US] embassy in Tehran on the growing strength of the present
    [coup] government.”14 Two years after Mossadeh’s illegal overthrow, Canada began
    diplomatic relations with Iran.15 In 1965, the shah visited Ottawa, where he was
    taken to Parliament and welcomed at a reception party hosted by governor general
    Georges Vanier. Ottawa supported the extremely unpopular Pahlavi, who purchased
    $60 million ($600 million today) in Canadian weapons in the 1970s, with his overthrow
    in the nationwide revolution of 1979.16


    Canada played a small but noteworthy role in overthrowing Iranian democracy in
    1953.


