    # 秘鲁，2022


    2022年12月7日，当选总统佩德罗·卡斯蒂略被弹劾并入狱。渥太华立即支持罢免这位总统，而该政府曾称由加拿大支持的反委内瑞拉的“利马小组”是“我们在秘鲁国际政治历史上所做的最灾难的事情”。¹


    卡斯蒂略出生于秘鲁最贫困地区之一的卡哈马卡的一个文盲农民家庭，他成为一名小学教师和工会活动家。他通过在2017年领导教师罢工声名鹊起。卡斯蒂略的崛起对于原住民、农村和贫困的秘鲁人来说具有象征意义。但这引起了利马精英阶层的蔑视，他们试图在每一个转折点羞辱他。部分由于持续的破坏活动，卡斯蒂略在追求减少国家极端不平等的议程时无无作为。除其他立场外，卡斯蒂略承诺将改革藤森时代的宪法，并实施土地改革，以促进粮食安全和可持续的小规模生产。²


    加拿大协助巩固了一场政变，引发了激烈的民众反弹。渥太华支持一个未经选举产生的秘鲁政权，该政权在暂停公民自由并实施宵禁的同时，向街道部署了军队。安全部队杀杀了六多名大部分为原住民的抗议者。


    在卡斯蒂略逮捕加拿大驻美洲组织代表几小时后，美洲组织的一场特别会议上：“加拿大对卡斯蒂略总统试图解散国并在秘鲁建立例外政府表示深表关切。这种破坏稳定的行为直接违背了美洲组织高级小组的建议，并可能危及秘鲁对民主准则的遵守。根据加拿大政府的说法，罢免当选总统是民主迈的一步。”


