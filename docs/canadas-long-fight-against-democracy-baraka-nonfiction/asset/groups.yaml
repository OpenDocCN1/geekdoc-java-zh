- md: '

    Jacobo Árbenz’s 1950 election, with 65% of the vote, convinced the elite and Washington
    that they must put a stop to the social democratic reforms.


    Following in the footsteps of Arévalo, Árbenz prioritized rural agrarian reform,
    targeting the unproductive holdings of large companies. Washington screamed communism,
    but Árbenz was not a proto-Castro. As Eduardo Galeano pointed out, Árbenz drew
    “his inspiration not from Lenin but from Abraham Lincoln. His agrarian reform,
    an attempt to modernize Guatemala capitalism, [was] less radical than the North
    American rural laws of almost a century ago.”^1


    Árbenz ran afoul of Washington decision-makers when he gave landless peasants
    uncultivated land owned by the United Fruit Company (the Boston-based company
    was offered compensation at the price they valued the property for tax purposes).
    “By far the largest property owner in the country,” 85% of United Fruit’s 550,000
    acres of land was unused in 1953.^2 The company had monopolized Guatemala’s banana
    exports, its telephone and telegraph facilities as well as its main Atlantic harbour
    and nearly every mile of railroad track in the country.^3 Long-time United Fruit
    employee, Thomas McCann, summarized the company’s history in Guatemala: “Guatemala
    was chosen as the site of the company’s earliest development activities at the
    turn of the century because a good portion of the country contained prime banana
    land and at the time we entered Central America, Guatemala’s government was the
    region’s weakest, most corrupt and most plausible. In short, the country offered
    an ‘ideal investment climate,’ and United Fruit’s profits there flourished for
    fifty years. Then something went wrong: a man named Jacobo Árbenz became president.”^4


    Beyond United Fruit, Washington worried that Árbenz’s social democratic policies
    would disrupt the elite-dominated status quo in the region. In 1954, a State Department
    official was unusually blunt, pointing out that “Guatemala has become an increasing
    threat to the stability of Honduras and El Salvador. Its agrarian reform is a
    powerful propaganda weapon; its broad social program of aiding the workers and
    peasants in a victorious struggle against the upper classes and large foreign
    enterprises has a strong appeal to the populations of Central American neighbors
    whose similar conditions prevail.”5 Arbenz represented the threat of a bad example.


    Prior to Arbenz’s election, Canada’s trade commissioner in Guatemala had described
    him as “unscrupulous, and ruthless, and not one to be allayed in his aims by bloodshed
    or killing.”6 He concluded that “businessmen and landowners do not have any cause
    to view the prospect of Arbenz as future president with any optimism.”7


    Canada helped isolate Arbenz. With the US seeking to de-stabilize his government,
    Arbenz sought to demonstrate that Guatemala had cordial relations with a US ally
    and was not a threat. But Ottawa refused the request to open embassies in each
    other’s countries in 1953 and again in 1954.8


    Despite opposition questioning by the CCF in the House, Pearson refused to acknowledge
    US involvement in the invasion of Guatemala. He said: “To the best of my knowledge,
    based on information we have received, the attacking forces in Guatemala seem
    to be Guatemalan, some non-Guatemalans might be included.”9 Canada’s external
    affairs minister admitted that he had foreknowledge that “matters” in Guatemala
    “would be reaching a climax very shortly,” but claimed not to know what would
    bring the situation to a head.10


    In *Northern Shadows: Canadians in Central America*, Peter McFarlane summarizes:
    “At External Affairs and in Canadian [corporate] boardrooms,... the coup [against
    Árbenz] was chalked up as another victory of the Free World against the [Soviet]
    Menace.”11


    But the coup was a “definitive blow to Guatemala’s young democracy.” Árbenz’s
    successor, Castillo Armas, immediately outlawed peasant organizations and unions
    and reversed the previous ten years of agrarian reform. The coup led to a series
