    事实上，美洲组织（OAS）利用某些议院席位计算中的技术问题，随后将一场涉及 7,000 个职位的选举描述为“深度缺陷”。


    加拿大政府在 OAS 选举任务中发挥了重要作用。渥太华为 OAS 观察团提供了超过 30 万美元，许多加拿人参与了其中。2 3 4


    加拿大还致力于在 OAS 架构之外削弱 2000 年 5 月选举的信誉。渥太华支持反对派对选举进行“重新审查”的要求。选举一周后，外交部派遣了其首席外交官大卫·李（David
    Lee）会同美国官员唐纳德·斯坦伯格（Donald Steinberg）前往海地，会选举委员会审查部分结果。作为回应，变革组织联盟（Rally of Organizations
    for Change）控加拿大官员“干预海地选举”。6


    选举观察任务的参与者、魁北克国民议会主席让-皮埃尔·夏尔博诺（Jean-Pierre Charbonneau）告诉《法语报》（La Presse）：“海地当局必须进行必要的纠正，如果
    PFL [拉瓦拉斯联盟] 如其所称的那样强大，它就不应该害怕透明且合法的过程。”


    加拿大和美国威胁切断对该援助，以抗议决定议院席位胜者的公式。7 2000年9月，外交部长洛德·阿克斯沃西（Lloyd Axworthy）和美国国务卿玛德琳·奥尔布赖特（Madeleine
    Albright）召开了“海地之友”会议。会议导致美国发表声明，宣布将取消对海地 11 月总统选举的援助。渥太华也决定不资助或参与总统选举的观察团。8


    民调预测阿里里德（Aristide）将获得压倒性胜利。2000年10月由 CID-Gallup 在全国范围内进行的一项针对 1002 名海地人的民调显示，92.8%
    的受访者知道即将到来的总统选举；绝大多数表示他们非常有可能（55.9%）或有些可能（22.7%）投票。超过 50% 的人选择阿里里德为最受信任的领导人，反对派成员没有一个接近这个数字。拉瓦拉斯是首选政党，比例高达惊人的
    13 比1。


    惊讶的是，阿里里德在随后的投票中以 92% 的得票率胜。尽管大多数反对派抵制了总统选举，但没有分析师认真怀疑阿里里德压倒性的人。海地官员和约 3000 名独立观察员报告，有超过四百万选民（超过人口的一半）注册，其中
    60% 参加投票。这些数字优于 2000 年美国选举，阿里里德 92% 的得票率比例几乎是乔治·W·布什（George W. Bush）同月获得的两倍。


    共和党夺取总统职位加强了美国对海地贫困多数人口的政策。布什任命了一群反阿里里德的极端分子，其中包括新保守主义者罗杰·诺里加（Roger Noriega），他被任命为美国驻
    OAS 大使。从该位置，诺里加与加拿大 OAS 大使大卫·李在海地密切合作。正如加拿大美洲基金会的卡洛·戴德（Carlo Dade）在解释 2004 年政变时所说，阿里里德政权在
    2000 年选举期间就已经注定失败。美国政府采取了积极政策支持反对派推翻阿里里德。9


    鉴于阿里里德的选举胜利，“国际社区”几乎没有选择承认他的合法当选。但在阿里里德的首次国际活动上，据报道总理让·克里蒂安（Jean Chrétien）“教训”了关于
    5 月选举的“缺点”。2001 年在魁北市举行的峰会上，拉瓦拉斯被指责未能“结束去年选举（其被广泛指责有缺陷）后反对派谈判僵局”。10 克里蒂安表示，各国领导将特别关注海地，并呼吁美国和加拿大主导的
    OAS 加大干预。加拿大总理请求 OAS 秘书长塞萨·加维里亚（César Gaviria）访问奥斯头塞，并与加勒比共同（CARICOM）合作处理海地“危机”。作为对克里蒂安请求的回应，巴巴斯总理欧恩·阿瑟（Owen
    Arthur）访问了奥斯头塞，随后 OAS 指派了负责加强海地民主的特派员、加拿大外交官大卫·李。11 美国在很大程度上资助了李的海地任务。12


    克里蒂安向阿里里德施压与其谈判，将解决 2000 年 5 月选举争议的责任推给了他。但是，即使在阿里里德向压力屈协并说服多位拉瓦拉斯联盟的议员辞职后，这种动摇运动仍在继续。作为针对阿里里德政府的动摇运动的一部分，捐助者试图从经济上勒死该国。在美、加的敦促下，世界银行和美洲开发银行阻止了已批准的
    5 亿美元贷款。13 这些贷款等同于海地政府年度预算的一半。根据经济学家杰弗里·萨克斯（Jeffrey Sachs）的说法，贷款的切断产生了“挤压海地公民”的效果。阿里里德上任后，加拿大对该国的援助减少了一半以上，流政府的资金几乎枯竭。


    目前，美国和加拿大联合了政治反对派。根据记者安东尼·芬森（Anthony Fenton）采访的一位美国官员的话，北美“民主促进者”面临的困境是“一个非常弱的反对派，一个没有政纲、非常碎片化的反对派，不愿意按意识形态或计划或任何方式联合在一起……阿里里德确实拥有
    70% 的民意支持，而其他 120 个政党将 30% 的支持分成一百二十种不同的方式，这基本上是不可能竞争的”。14


    在隶属于共和党的美国政府机构国际共和基金（International Republican Institute）的指导下，由社会民主派、新杜瓦尔派、基督教和与商业相关的政党合并，创建了民主联盟（Convergence
    Democratique, CD）。CD 要求撤销 5 月选举、阿里里德辞职并恢复军事。华盛顿和渥太华坚持 CD 达成协议。


    由于政府不受欢迎，美国、加拿大和欧盟还资助了一场“独立”的公民运动。这些团体获得资金以制作声称选举是“欺诈”的广播节目，并组织集会。根据加拿大国际开发署（CIDA）的一份报告，2000-2002
    年间，其支出特点是转向公民社会。CIDA 在海地花费了 6730 万美元，这些资金大部分流向非政府组织（NGO）。尽管这些资助表面上是非政治的，但几乎没有例外，接收
    CIDA 资助的海地组织——无论是直接还是间接——都反对阿里里德。


    在2004 年对加拿大与海地关系的评估中，指出通过“参与关键利益者的联盟”和“提供充足资源”，对公民社会的支持产生了相对良好的结果。向公民社会的转变“有助于增强非政府行为产生基层需求的能力”。


    作为一个例子，受 CIDA 资助的“发展与和平”（Development & Peace）协助其海地伙伴“成为不可忽视的力量，并帮助结束当前政权造成的政治混乱”。2000-2003
    年，“发展与和平”通过其海地伙伴在了 140 万美元，与 70 多个地方组织合作，“改善信息的外部流传”并“制定行动和培训计划，并进行动员”。


    雅梅尔的学生、女性和工会组织者告诉一个美国人权代表团，美国援助署培训了我们并教我们如何组织，我们组织了你们看到的这些团体，要求推翻腐败的阿里里德政府。研讨会促成了几个反对政府的地区性组织网络，这些网络“开始紧密协调活动以产生协同效应”。


    2002 年12 月，反对派“公民”侧翼的明珠之宝出世。184 人小组（Group of 184）源于社会社会倡议，“这是一个由商业和宗教精英组织的集合”。


