    # BOLIVIA, 2019


    In November 2019, Ottawa supported the ousted of Bolivian president Evo Morales.
    During that period, an alliance of economic elites, Christian extremists, and
    security forces backed by Washington deposed Morales, Bolivia''s first Indigenous
    president, and replaced him with an unconstitutional government led by rightist
    Jeanine Arce, whose party 4% of the vote in the 2019 elections. The unconstitutional
    post-coup government immediately attacked Indigenous symbols and authorized massacres
    of pro-democracy protesters in the cities of Sacaba and Senkata, killing 32. Hundreds
    were arrested in political repression with many journalists and media outlets
    such as Telesur, RT en Español, and dozens of local and community-based radio
    stations shuttered. Meanwhile, many MAS officials fled Bolivia for their lives
    as the armed forces committed repeated acts of violence against members and supporters
    of Morales'' political party.


    Prior to his removal in the November 2019 coup, Evo Morales had been president
    of Bolivia for thirteen years. He won four presidential elections as head of the
    left-wing Movement for Socialism (MAS), a political party founded by coca farmers.
    As the party''s long-serving leader, Morales became the figurehead of a grassroots
    Indigenous-led fight against neoliberalism and imperialism in the the only country
    in South America where the majority of the population identifies as Indigenous.


    Deep-seated racist attitudes amongst the country''s middle-to-upper class white
    population played a substantial role in opposition to MAS rule. The racist character
    of the new regime became obvious after Morales was'
