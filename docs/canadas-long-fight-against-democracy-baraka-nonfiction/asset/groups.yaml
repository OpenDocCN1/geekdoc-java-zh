    # 洪都拉斯，2009年


    哈珀政府暗中支持了洪都拉斯军在2009年推翻当选总统塞拉亚。6月28日凌晨，士兵进入总统宫并将穿着睡衣的塞拉亚带往哥斯黎达。不久后，示威者走上街头并建立封锁，要求当选总统回归。作为回应，军方政权在首都特格西尔帕实施了戒严法。随之而来的是一段动荡时期，其特征是国家和准军事力量对记者、社会运动和政治反对派的广泛暴力。


    在塞拉亚被驱逐八小时后，一位外交部发言人告诉墨西哥Notime报，加拿大对政变“没有意见”。直到半球内几乎每个国家都谴责这次政变，渥太华才最终做出了表态。Notime随后报道说，加拿大是半球内唯一没有明确要求塞拉亚重返权力的国家，在多次场合，外务国务部长彼得·肯特表示，考虑到军事力量压倒塞拉亚的背景很重要，特别是他是否违反了宪法。肯特在《纽约时报》中被引用说：“存在这些事件[政变]发生的背景。”


