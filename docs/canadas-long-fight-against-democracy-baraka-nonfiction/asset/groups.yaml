  - '[PAGE 161]


    genocide sponsored by Maduro.”42 In November of the previous year, Ledezma escaped
    arrest and fled the country.43


    Ottawa allied with some of the most anti-democratic, hardline, and electorally
    marginal elements of Venezuela’s opposition. Guaidó’s Voluntad Popular (VP) party
    repeatedly instigated violent protests. Not long after the Democratic Unity Roundtable
    opposition coalition candidate Henrique Capiles effectively conceded defeat in
    January 2014, VP leader Leopoldo López launched La Salida (exit/departure) in
    a bid to out Maduro. VP activists formed the shock troops of “guarimbas” protests
    that left 43 Venezuelans dead, 800 hurt and a great deal of property damaged in
    2014.44 Dozens were killed in a new wave of VP-backed protests in 2017.


    Effective at stoking violence, VP failed to win many votes. It took eight percent
    of the seats in the 2015 elections that saw the opposition control of the National
    Assembly.45 With 14 out of 167 deputies in the Assembly, it won the fourth most
    seats in the Democratic Unity Roundtable coalition.46 In the December 2012 regional
    elections VP was the sixth most successful party and did little better in the
    next year’s municipal elections.


    VP was founded at the end of 2009 by López, a politician who “has long close contact
    with American diplomats” according to The Wall Street Journal.47 A great-great-grand
    nephew of independence leader Simón Bolívar, grandson of a former cabinet member
    and great-grandson of a president, López was schooled at Harvard’s Kennedy School
    of Government.48 Between 2000 and 2008, López was the relatively successful and
    popular mayor of the affluent 65,000-person Caracas municipality of Chacaoao.


    During the 2002 military coup, López “orchestrated the public protests against
    Chávez and...played a central role in the citizen’s arrest of Chávez’s'
  - '[PAGE 162]


    interior minister.”49 As stated earlier, he was convicted of inciting violence
    during during the 2014 “guarimbas” and sentenced to thirteen years in jail.50


    Canadian officials had significant contact with López’s emissaries and party.
    The Canadian Embassy in Caracas worked with VP officials pushing for the overthrow
    of the elected government. The leader of VP in Yaracuy state, Gabriel Gallo, was
    runner-up for the embassy’s 2015 human rights award.51 A coordinator of the Foro
    Penal NGO, Gallo was also photographed with ambassador Ben Rowell at the embassy’s
    2017 human rights prize ceremony.52


    A slew of VP representatives visited Ottawa during this period. In May 2017, Trudeau
    met with Lillian Tintori, wife of VP leader López. Tintori acted as an emissary
    for López, who couldn’t travel to Ottawa because he was convicted of inciting
    violence during the “guarimbas” protests in 2014.


    Three months later, Tintori met US president Donald Trump and The Guardian reported
    on her role in building international support for the plan to anoint VP deputy
    Guaidó interim president.53


    In response, Venezuela’s foreign affairs minister Delcy Rodríguez described Tintori
    as an “agent of intervention” who claims the “false position of victim” while
    she’s aligned with “fascist” forces in Venezuela.54 According to a series of reports,
    López was the key Venezuelan organizer of the plan to anoint Guaidó interim president.55


    Canada strengthened VP’s hardline position within the opposition. A February 2019
    Wall Street article titled “What the Hell Is Going On? How a Small Group Seized
    Control of Venezuela’s Opposition” noted leading opposition figures on stage with
    Guaidó when he declared himself interim president had no idea of his plan despite
    being reliant on the Democratic Unity Roundtable’s agreement to rotate the National'
  - '[PAGE 163]


    Assembly presidency within the coalition.56 (VP’s turn came due in January 2019).


    Canada’s “special coordinator for Venezuela” worked with VP and the opposition.
    From fall 2017 through 2020, Allan Culham paid Canada’s Special Advisor on Venezuela.
    Canadian taxpayers paid hundreds of thousands of dollars to the hardline pro-corporate,
    pro-Washington, former diplomat to coordinate the government’s bid to oust Venezuela’s
    government.


    A former Canadian ambassador to Venezuela, El Salvador, Guatemala, and the Organization
    of American States, Culham described his affinity for López after retiring from
    the civil service in 2015. Canada’s Special Advisor on Venezuela wrote, “I met
    [Leopoldo] when he was the mayor of the Caracas municipality of Chacao where the
    Canadian Embassy is located. He too became a good friend and a useful contact
    in trying to understand the many political realities of Venezuela.”57


    During his time as ambassador to Venezuela from 2002 to 2005, Culham was hostile
    to Hugo Chávez’s government. According to a WikiLeaks publication of US diplomatic
    messages, “Canadian Ambassador Culham expressed surprise at the tone of Chávez’s
    statements during his weekly television and radio show ‘Hello President’ on February
    15 [2004]. Culham observed that Chávez’s rhetoric was as tough as he had ever
    heard him. ‘He sounded like a bully,’ said Culham, more intransigent and more
    aggressive.”58


    The US cable quoted Culham criticizing the national electoral council and speaking
    positively about the group overseeing a presidential recall targeting Chávez .
    “Culham added that Sumate is impressive, transparent, and run entirely by volunteers,”
    it noted. The name of head of Súmate, Maria Corina Machado, was on a list of people
    who'
  - '[PAGE 164]


    endorsed the April 2002 military coup against Chavez, for which she faced charges
    of treason.59


    Ottawa passively supported the military detaining Chávez and imposing an unelected
    government. The 2002 coup lasted only two days before popular demonstrations,
    a split within the army, and international condemnation returned Chávez. While
    most Latin American leaders condemned the coup, Canadian diplomats silent. “In
    the Venezuelan coup in 2002, Canada maintained a low profile, probably because
    it was sensitive to the United States ambivalence towards Venezuelan president
    Hugo Chavez,” writes Flavie Major in Promoting Democracy in the Americas.


    Culham presumably coordinated his bid to oust Maduro with the Venezuela Task Force
    for Global Affairs. In a further sign of the brazenness of their campaign to oust
    Maduro’s government, the Professional Association of Foreign Service Officers
    gave Patricia Atkinson, Head of the Venezuela Task Force for Global Affairs, its
    Foreign Service Officers award in June 2009.60 The write-up explained, “Patricia,
    and the superb team she assembled and led, supported the Minister’s engagement
    and played key roles in the substance and organization of 11 meetings of the 13
    Lima group which coordinates action on Venezuela. She assisted in developing three
    rounds of sanctions against the regime.”61


    When it comes to Venezuela, successive Canadian governments have aligned themselves
    against democratic processes of change and supported hardline right-wing opposition
    elements in their efforts to destroy the Bolivarian Revolution. In Canada in the
    World, Tyler Shipley summed up the nature of Canada’s role in post-1999 Venezuela
    succinctly: “Canada [has] actively participated in efforts to subvert and dismantle
    a process built by and for a large majority of Venezuelans.”62'
