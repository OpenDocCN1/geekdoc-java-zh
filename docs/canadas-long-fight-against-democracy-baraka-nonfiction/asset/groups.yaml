    through the woods to conspire against Aristide, to meet with the opposition.”


    The Gazette also revealed that Arcelin had met Pierre Pettig in early February
    2004 in Montréal: “He took advantage of the visit and the political clout of his
    sister-in-law [former Conservative MP Nicole Arcelin-Roy] to'
  - '[PAGE 94]


    meet with Health Minister Pierre Pettigrew... ‘I explained the reality of Haiti
    to him,’ Arcelin, pulling Pettigrew’s business card out of his wallet. ‘He promised
    to make a report to the Canadian government about what I had said.’”


    At the end of 2003, Philippe and the former soldiers intensified their cross-border
    attacks against government targets. They were subsequently joined by a coalition
    of gangs in Gonaïves led by a former death squad leader. On February 5, 2004,
    the insurgents seized Gïves, the country’s fourth largest city. The heavily armed
    force rampaged across Haiti, killing police, emptying jails, and burning public
    buildings.


    Initially foreign affairs minister Bill Graham denounced the rebellion, saying
    Canada supported the elected government. “Aristide has been elected and he must
    complete his term,” explained Graham in a mid-January 2004 La Presse article titled
    “Caricom tells Paul Martin about Aristide’s popularity in Haiti.” “If new elections
    were held today, he would probably be re-elected.”^21


    The Bush Administration publicly responded to the rebellion in a similar way.
    In what was probably a bid to claim deniability and a way to hedge based on developments,
    US secretary of state Colin Powell told a Senate foreign relations committee on
    February 12, “the policy of the administration is not regime change. President
    Aristide is the elected president of Haiti.” Powell reaffirmed that position five
    days later: “We cannot buy into a proposition that says the elected president
    must be forced out of office by thugs and those who do not respect law and are
    bringing terrible violence to the Haitian people.”


    At the same time they criticized the rebels, US and Canadian officials strengthened
    their hand. They demanded Aristide negotiate with an intransigent political opposition
    working in parallel with the rebels. In mid-'
  - '[PAGE 95]


    February 2004, Ottawa sent a delegation to Port-au-Prince to deliver a “firm message
    to Mr. Aristide, that he must respect his obligations,” explained Canada’s foreign
    minister. Graham claimed the mission’s objective was “to create a situation where
    the opposition can enter into discussions,” but the actual aim was to further
    weaken the elected government.22


    On February 22, the insurgents took Cap Haïtien, the country’s second largest
    city. Scores of police officers were killed and many more simply abandoned their
    posts to the better-armed rebels. As the insurgents made their way to Port-au-Prince,
    the international community ignored the elected government’s requests for “a few
    dozen” peacekeepers to restore order in a country without an army. On February
    26, three days before Aristide’s removal, the OAS permanent council called on
    the UN Security Council to “take all the necessary and appropriate urgent measures
    to address the deteriorating situation in Haiti.” CARICOM on the UN Security Council
    to deploy an emergency military task force to assist Aristide’s government. This
    appeal for assistance was flatly rejected by the world’s most powerful nations.


    By the end of the month, gunmen had overrun all major cities except Port-au-Prince
    and rebel on the outskirts. Supporters of the president built barricades across
    the capital. They blocked the main arteries of the city of two million and prepared
    to fight. Even with most of the country in rebel hands, the government’s prospects
    began to improve as pro-government police recaptured several cities. A shipment
    of guns, bulletproof vests, and ammunition was in Kingston, Jamaica, on route
    from South Africa at the request of CARICOM. Rumors were swirling Venezuela had
    agreed to send soldiers to protect the constitutional government. Most important,
    Port-au-Prince’s size made it difficult to capture for a few hundred men.'
- md: '

    But the battle for Port-au-Prince never took place. In the early hours of February
    29, 2004, US soldiers, with Canadian forces “securing” the airport, escorted Haiti’s
    elected president and his security staff onto a jet and out of the country. US
    officials insisted the president had resigned to avoid a bloodbath. This version
    of events was accepted by most of the world’s media despite Aristide’s contradictory
    account.


    Prominent professor Jeffrey Sachs recounts the events of February 29:


    According to Mr. Aristide, U.S. officials in Port-au-Prince told him that rebels
    were on way to the presidential residence and that he and his family were unlikely
    to survive unless they immediately boarded a U.S.-chartered plane standing by
    to take them to exile. The U.S. made clear, he said, that it would provide no
    protection for him at the official residence, despite the ease with which this
    could have been arranged. Indeed, says Aristide’s lawyer, the U.S. blocked reinforcement
    of Aristide’s own security detail and refused him entry to the airplane until
    he signed a letter of resignation. Then Aristide was denied access to a phone
    for nearly 24 hours and knew nothing of his destination until he was summarily
    deposited in the Central African Republic.


    Despite ignoring appeals for support from CARICOM and the OAS in the preceding
    days, soon after US/French/Canadian troops ousted the elected government the UN
    Security Council passed a motion authorizing an intervention. In a three-minute
    Sunday night meeting—between 9:52 and 9:55 PM, according to the official UN summary—the
    Security Council “authorized the immediate deployment of [a] Multinational Interim
    Force for a period of three months to help to secure and stabilize the capital,
    Port-au-Prince, and elsewhere in the country.” The resolution repeated coup talking
    points. It noted, “Haiti’s political situation became volatile after flawed elections
    in May 2000” claimed the intervention was designed “to further the constitutional
    political process now under way.”


    Canada played a role in the kidnapping and coup d’état. JTF2 commandos took control
    of the airport from which Aristide was bundled onto a plane by US Marines. According
    to AFP, “about 30 Canadian special forces secured the airport on Sunday [February
    29] and two sharpshooters positioned themselves on the top of the control tower.”
    Members of the elite force had reportedly arrived in Port-au-Prince four or five
    days earlier, ostensibly to protect Canada’s embassy and “secure key locations”
    in the capital. According to the military’s account of Operation PRINCIPAL, “more
    than 100 CF personnel and CC-130 Hercules aircraft ... assisted with emergency
    contingency plans and security measures” during the week before the coup.


    Canada, with France and Chile, provided for the subsequent US-led and UN-approved
    Multinational Interim Force (MIF). As part of the force, 500 Canadian troops patrolled
    the streets of Port-au-Prince.


    An interim government was appointed by “wise people” put together by France, Canada,
    and the USA. The “illegal” interim government was headed by Gérard Latortue, a
    man from Florida who had not lived in Haiti for fifteen years.


    Latortue set about dismantling the modest social programs established during Aristide’s
    second term and many of the achievements of the 1994–2004 democratic period. Subsidies
    for impoverished farmers were slashed, an adult literacy program was dismantled,
    and the minimum wage was reduced. Reversing the limited land reform enacted during
    Prévail’s government, thousands of peasants in the Artibonite were evicted from
    their lands by local landlords and their hired thugs were sometimes supported
    by police. The interim regime gave large businesses a three-year tax holiday.


    Latotue dismissed the Aristide’s government’s campaign to force France to repay
    the independence ransom it extorted from Haiti. The de facto minister told Reuters,
    “[this debt restitution] claim was illegal, ridiculous and was made only for political
    reasons ... This matter is closed. What we need now is increased cooperation with
    France.” However, before he was installed, Latotue told the *Miami Herald* France
    repaying the debt was “the moral and politically responsible thing to do.”


    “A Haitian president demands reparations ends in exile,” declared the front-page
    of a May 2022 *New York Times*. Solidifying the historical narrative regarding
    the coup, French ambassador Thierry Burkhard admitted Aristide’s call for the
    restitution of Haiti’s $21+ billion debt (ransom) of independence partly explained
    why he was ousted in 2004. Burkhard told *The New York Times* the elected president’s
    removal was a “coup” that was “probably a bit about” Aristide’s campaign for France
    to repay Haiti.


    *In the Powerless: Canada’s Role in Dismantling Democracy in Haiti and the Americas,
    then defence minister David Pratt said, “Canada, the US, and France did what was
    necessary in terms of removing [Aristide] from power.” In the 2022 documentary
    Pratt claimed Haiti’s most popular politician was ousted because he’d become a
    “big man” leader responsible for “abuses of power.” But Canada’s allies in overthrowing
    Aristide and thousands of other elected officials were light-skinned oligarchs
    overseeing profoundly inequitarian racial capitalism and mercenaries with odious
    histories. Canada’s role in Haiti during this period was to help dismantle the
    elected forces of social and economic change and reconstitute a repressive right-wing
    state apparatus violently opposed to the demands of the impoverished majority.


