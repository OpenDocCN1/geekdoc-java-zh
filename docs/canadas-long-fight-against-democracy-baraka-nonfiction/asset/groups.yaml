    # PALESTINE, 2006


    In January 2006, Hamas won Canadian-monitored and facilitated legislative elections
    in Palestine. After Israel, Canada was the first country to cut its assistance
    to the Palestinian Authority (PA). The aid cut-off, which was designed to sow
    division within Palestinian society, had devastating social effects. “Open warfare
    among Gazan families is by-product of aid freeze,” explained a Globe and Mail
    headline.


    Hamas is an Islamist resistance organization founded in 1987 by Sheikh Ahmed Yassin,
    a paralegic who was assassinated (along with nine bystanders) by Hellfire missiles
    from an Israeli gunship in 2004. The Israeli government initially enabled Hamas
    as an alternative to the Palestine Liberation Organization (PLO) and leftist resistance
    organizations. Israeli brigadier general Yitzhak Segev told The New York Times,
    Israel “helped finance the Palestinian Islamist movement as a ‘counterweight’
    to the secularists and leftists of the Palestine Liberation Organization and the
    Fatah party, led by Yasser Arafat.” Once Hamas began to represent an actual threat
    to Israel supremacy in occupied Palestine, Israel sought to “bomb, besiege, and
    block it out of existence.”


    When Hamas won the 2006 legislative elections, that campaign intensified with
    Canadian support. Israel instituted an economic blockade of Gaza that severely
    limited the amount of food, water, and energy available because Palestinians voted
    for the wrong party in elections internationally as free and fair.


    In March 2006, Canada became the first donor to suspend aid to the newly Hamas-led
    Palestine Authority.


    In a bid to lessen division and avoid a full-fledged civil war, political factions
    representing more than 90% of the Palestinian Legislative Council established
    a unity government in March 2007. Still, Ottawa shunned the new government. “It’s
    our policy to have no contact with members of the government or deputy ministers,”
    said Daniel Dugas, then foreign affairs minister Peter Mackay’s director of communications.


    When the Palestinian unity government''s information minister travelled to Ottawa
    on a global peace tour, Mackay refused to meet him. Mustafa Barghouti, who represented
    a secular party, told Embassy: “I think the Canadian government is the only government
    that is taking such a position, except for Israel. Even the United States has
    sent its consul general [in Jerusalem, Jacob Walls] to meet the Palestinian finance
    minister [Salam Fayyad].” Barghouti had already met the foreign ministers of Sweden
    and Norway, the secretary-general of the UN and US secretary of state Condoleezza
    Rice.


    Canada’s intransigence was designed to sow division within Palestinian society
    and destroy the unity government. In fact, Washington and Ottawa actually pushed
    for war between Hamas and Fatah. A senior figure in the Israeli intelligence establishment
    explained: “Washington did not want a unity government. It wanted Fatah to wreck
    it and it sent [US Lieutenant-General Keith] Dayton to create and train a force
    that could overthrow Hamas. When Hamas pre-empts it, everyone cries foul, claiming
    it’s a military putsch by Hamas—but who did the putsch?”


    After Hamas officials were ousted from the PA in June 2007, Ottawa restarted diplomatic
    relations and financial support. “The Government of Canada welcomes the leadership
    of President Abbas and Prime Minister [Salam] Fayyad in establishing a government
    that Canada and the rest of the international community can work with,” explained
