    38. Tim Harper, “Stephen Harper 在访问乌克兰期间对普京发表了严厉辞，《多伦多星报》，2014年3月22日。


    ## 巴西，2016


    2016年，巴西工人党主席迪尔玛·罗塞菲（Dilma Rousseff）通过一场“软性政变””被弹劾。在她第二个四年任期开始的一年多后，议会投票裁定罗塞菲违反了巴西的预算法。这次弹劾的起因是经济衰退以及针对各政治家的大型“洗车行动”（Lava
    Jato）腐败调查，其目标人物包括工人党的前任主席卢拉·达·席瓦（Lula da Silva）。并没有证据表明罗塞菲存在腐败，而针对前总统卢拉·达·席瓦的指控充其量站不住脚。在巴西体系下同时担任法官的首席检察官塞尔吉希奥·莫罗（Sergio
    Moro）后来在雅尔·博尔索纳罗（Jair Bolsonaro）政府中担任司法部长。


    2019年中，《拦截》（The Intercept）发布了一批莫罗的通信记录，证实了对卢拉指控的政治性质，这由于罗塞菲与这位前总统的关联而削弱了她的地位。1
    这些文件还显示，检察官在调查期间与美国当局合作，有时会向罗塞菲政府隐瞒这种合作关系。2 泄露的对话中频繁提到 FBI，清楚地表达了“最亲密的关系是在巴西联邦警察（PF）成员与
    FBI 探员之间”。


    尽管特鲁多政府发表了数十份声明批评尼古拉斯·马德罗（Nicolás Maduro）领导下的委内瑞拉，但渥华对罗塞菲的下台以及对巴西左翼的迫害保持沉默。我们找到的唯一评论是全球事务部的一位官员告诉卫星新闻，在罗塞菲被弹劾后，加拿大可以与巴西保持关系。3
    很快，加拿大开始谈判加入巴西领导的南方共同市场（MERCOSUR）贸易集团（就在委内瑞拉被驱逐之后）。4 它们还建立了加拿大-巴西战略对话伙伴关系。5


    2018年10月，全球事务部长克里斯蒂亚·弗里兰（Chrystia Freeland）与她的巴西同行会面，讨论了包括向委内瑞拉政府施压在的问题。她推特道：“加拿大和巴西拥有深厚的友谊，感谢你们支持维护基于规则的国际秩序，并让委内瑞拉马德罗政权负责。”罗塞菲下台后，巴西加入了由加拿大创建的反马德罗利马集团（Lima
    Group）。


    2018年，公开歧视女性、种种族歧视且反环保的政治家雅尔·博尔索纳罗赢得了总统选举，这很大程度上是因为民调调查中的领先者因可疑指控被入狱。前工人党主席卢拉·达·席瓦因其旨在缓解极端饥饿和增加巴西
    GDP 的高成本政策，在第二个任期结束时仍拥有 83% 的支持率，但因这些具有政治动机的腐败指控被阻止参选。6 特鲁多政府对卢拉的入狱公开保持沉默。在最高法院准备决定卢拉命运的前一天晚上，负责军队的将暗示将进行军事干预，但法官们最终裁决支持这位广受欢迎的前总统。7
    渥华甚至没有对这种荒谬的言论进行批评。


