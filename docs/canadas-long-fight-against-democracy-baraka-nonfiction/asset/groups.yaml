    backed the Chilean military removing elected president Salvador Allende in 1973.
    From economic asphyxiation to diplomatic isolation, Ottawa’s policy towards Allende’s
    Chile was clear. Within three weeks of the coup, Canada recognized Pinochet’s
    military junta and immediately after that Canada’s ambassador to Chile cabled
    External Affairs that Pinochet “has assumed the probably thankless task of sobering
    Chile up” from the “riffraff of the Latin American Left to whom Allende deave
    asylum.


    Ottawa backed the Honduran military’s removal of elected president Manuel Zelaya.
    Before his 2009 ouster, Canadian officials criticized Zelaya and afterwards condemned
    his attempts to return to the country. Failing to suspend its military training
    program with Honduras, Canada was also the only major donor to Honduras—the largest
    recipient of Canadian assistance in Central America—failed to sever any aid to
    the military government. Six months after the coup, Ottawa endorsed an electoral
    farce and immediately recognized the new right-wing government.


    In a similar degree of involvement, Ottawa supported the 2019 ouster of Bolivia’s
    first Indigenous president. Hours after the military command forced Evo Morales
    to resign, foreign affairs minister Christia Freeland released a celebratory statement
    declaring, “Canada stands with Bolivia and the democratic will of its people.”
    Ottawa also provided significant support for the Organization of American States’
    effort to discredit Bolivia’s 2019 vote, which fueled opposition protests and
    justified the coup.'
- md: '

    Ottawa worked to subvert Palestinians’ democratic vote in 2006. After Hamas won
    that year’s legislative elections, Canada imposed sanctions against the Palestinians.
    Ottawa’s aid cut-off and refusal to recognize a Palestinian unity government helped
    spur fighting between Hamas and Fatah, ending a short-lived electoral experiment.


    In the 1960s, Ottawa played a substantial role in the oster of pan-Africanist
    independence leaders Nkrumah and Patrice Lumumba. In 1966, Ghana’s Canadian-trained
    army overthrew Nkrumah. In an internal memo to External Affairs just after Nkrumah
    was ousted, Canadian high commissioner in Accra, C.E. McGaughey, wrote “a wonderful
    thing has happened for the West in Ghana and Canada has played a worthy part.”
    Soon after the coup, Ottawa informed the military junta that Canada intended to
    carry on normal relations and Canada sent $1.82 million ($15 million today) worth
    of flour to Ghana.


    Through its important role in a UN mission to the Congo, Ottawa contributed greatly
    to independence leader Patrice Lumumba’s demise. Canadian colonel Jean Berthiaume
    assisted the elected prime minister’s enemies recapturing him and soon after Lumumba
    was killed. Canadian officials celebrated the demise of an individual that prime
    minister John Diefenbaker privately called a “major threat to Western interests.”


    Between 2010 and 2014, Canada waged a campaign to subvert an elected government
    in Ukraine. At the start of the three-month Maidan uprising that toppled president
    Viktor Yanukovych, foreign affairs minister John Baird attended an anti-government
    rally in Kyiv. Ottawa also implemented sanctions on the Yanukovych government
    and Maidan activists used the Canadian Embassy as a safe haven for a week. Furthermore,
    Ottawa quickly recognized the post-coup government despite having sent election
    observers to monitor the 2010 presidential and 2012 parliamentary elections, which
    were won by Yanukovych and his Party of Regions.


    Canada most aggressively subverted a progressive elected government in the Western
    Hemisphere’s most impoverished nation. On January 31 and February 1, 2003, Jean
    Chrétien’s Liberal government organized an international gathering to discuss
    Haiti’s democratically-elected president Jean-Bertrand Aristide. No Haitian officials
    were invited to the “Ottawa Initiative on Haiti,” where high-level US, Canadian,
    and French officials decided Aristide “must go,” the army should be re-created
    and the country put under UN trusteeships.


    Thirteen months after the “Ottawa Initiative on Haiti” meeting, Aristide and most
    other elected officials were pushed out and a quasi-UN trusteeship had begun.
    Canadian special forces “secured” the airport from which Aristide was bundled
    (“kidnapped” in his words) onto a plane by US Marines and deposited in the Central
    African Republic. Five hundred Canadian troops occupied Haiti for the next six
    months.


    Similar in scope to Ottawa’s subversion of democracy in Haiti, the Justin Trudeau
    government openly sought to overthrow Venezuela’s government. In a bid to elicit
    “regime change,” Ottawa worked to isolate Caracas, imposed illegal sanctions,
    took that government to the International Criminal Court, financed an often-unsavoury
    opposition, and decided a marginal opposition politician was the legitimate president.
    Indeed, the same day Juan Guaidó declared himself president of Venezuela in a
    Caracas, park affairs minister Chrystia Freeland formally recognized the little-known
    opposition politician. Additionally, Canadian diplomats played an important role
    in uniting swaths of the Venezuelan opposition, as well as international forces,
    behind a plan to proclaim as president the new head of the opposition-dominated
    National Assembly. Unlike the other cases, Ottawa’s remarkable multi-year campaign
    to subvert the Venezuelan government failed.


    Washington’s role in subverting elected governments has been detailed in countless
    studies by scholars and observers from around the world. The literature on Canada’s
    role in anti-democratic meddling is comparatively limited. In fact, this is the
    first book to focus solely on Canada’s role in subverting democracy around the
    globe.


    - 1. Quoted in Ernie Regehr, *Arms Canada: The Deadly Business of Military Exports*
    (Toronto: Lorimer, 1987), 39.

    - 2. Quoted in Jeremy Kinsman, “Who is My Neighbour?: Trudeau and Foreign Policy,”
    *International Journal*, vol. 57, no. 1, 2002.

    - 3. “Minister Baird Concludes Successful Visit to the Gulf Region News Release,”
    *Government of Canada*, Nov. 22, 2011 (https://www.canada.ca/en/news/archive/2011/11/minister-baird-concludes-successful-visit-gulf-region.html).

    - 4. “It’s not about diaspora: Freeland explains why Canada supports Ukraine,”
    *Ukrinform*, Feb. 11, 2019 (https://www.ukrinform.net/rubric-politics/28107211-its-not-about-diaspora-freeland-explains-why-canada-supports-ukraine.html).


    # IRAN, 1953


    In 1953, the US and Britain overthrew Iran’s first popularly elected prime minister,
    Mohammad Mossadegh. Mossadegh was a nationalist politician who believed the country’s
    natural resources, particularly its large oil reserves, should be controlled by
    Iranians rather than Western companies. With the Louis St. Laurent government’s
    quiet support, Mossadegh was removed in a CIA-engineered coup and replaced by
    shah Reza Pahlavi, who helmed a brutal regime for nearly three decades.


    In the lead-up to the 1953 coup against Mossadegh, the British Embassy in Tehran
    represented Canada’s diplomatic relations in the country. During these years files
    concerning Iran at Canada’s Department of External Affairs largely consisted of
    US and British reports, Canadian officials still voiced their disapproval of Mossadegh
    and his policies. Thirteen months before the coup, Canada’s ambassador in Washington
    cabled Ottawa: “The situation in Iran could hardly look worse than it does at
    present. Mossadegh has been returned to power with increased influence and prestige
    and will almost certainly prove even more unreasonable and intractable in the
    past, that a settlement of the oil dispute will be harder than ever to arrange.”¹


    Mossadegh’s supposed intractability stemmed from the fact that he wanted Iranians
    to benefit from the country’s huge oil reserves. The British had different plans.
    As one of the earliest sources of Middle Eastern oil, the Anglo-Iranian Oil Company
    (British Petroleum’s predecessor) had generated immense wealth for British investors
    since 1915. Unwilling to yield any of its profits, Anglo-Iranian chairman Sir
    William Fraser responded to Iran’s attempts to gain a greater share of its oil
    wealth by proclaiming “one penny more and the company broke.”2 Yet a 1952 State
    Department report showed the company was selling its oil at between and thirty
    times its production cost.3 Needless to say, Anglo-Iranian Oil was unpopular.
    Even the US State Department noted the company’s “arrogance” had made it genuinely
    interested in Iran.”4 In the face of Anglo-Iranian intransigence, Mossadde defied
    London and supported the nationalization of the country’s oil industry. It was
    a historic move that made Iran the first former colony to reclaim its oil.


    Ottawa was not happy with the Iranian government’s move. In May 1951, external
    affairs minister Lester Pearson told the House of Commons the “problem can be
    settled” only if the Iranians keep in mind the “legitimate interests of other
    people who had ministered to the well-being of Iran in administering the oil industry
    that country which they have been instrumental in developing.”5 Later that year
    Pearson complained about the Iranians’ emotional” response to the English. He
    added: “In their anxiety to gain full control of their affairs by the elimination
    of foreign influence, they are exposing themselves to the menace of communist
    penetration and absorption—absorption into the Soviet sphere.”6


    Notwithstanding Pearson’s warning, Mossaddeh was a secular nationalist, not a
    communist, and his relationship with the Soviet Union was limited. As Mossaddegh
    biographer Farhad Diba explains, “the Soviet attitude towards the Mossaddegh Government
    vacillated between a ‘hands-off’ policy and the maintenance of correct but politically
    distant relations.”7 When Mossaddegh began making moves to reclaim Iran’s resources
    from Western business interests, the Soviets praised his anti-imperialism, but
    made few moves to deepen cooperation with his government.

