    from the affluent Santa Cruz department, declared that Pachamama, a goddess revered
    by the Indigenous Andean peoples of South America, “will never return to the [presidential]
    palace. Bolivia belongs to Christ.”5 The new opposition government then tore the
    Indigenous Wiphala flag from government buildings. After proclaiming interim president,
