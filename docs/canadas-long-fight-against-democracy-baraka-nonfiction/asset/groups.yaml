    Odessa federation of trade unions. Ottawa stayed quiet about the massacre in Odessa
    and the ban on opposition parties.


    The 2014 coup divided Ukraine politically, geographically, and linguistically.
    The largely Russian-speaking south and east protested the ouster of Yanukovych,
    who was from the region. Likewise, many opposed the post-coup right-wing nationalist
    government because it immediately eliminated Russian as an official language and
    prohibited education in Russian, Polish, and Hungarian (Magyar) while making moves
    to rehabilitate hardline anti-Soviet historical figures, including Nazi collaborators,
    by building statues and renaming streets.


    The 2014 coup prompted Moscow to seize Crimea with its largely Russian population
    and strategically important Russian naval base. Additionally, the coup and the
    subsequent violence against Russian speakers, including the Odessa massacre, prompted
    thousands of Ukrainians in the eastern Donetsk region to rebel against the new
    Western-backed government in Kyiv. Moscow offered this endogenous uprising military
    and logistical support. The Donetsk became the site of an eight-year war that
    left 14,000 people dead and contributed to Russia’s 2022 invasion of Ukraine.


