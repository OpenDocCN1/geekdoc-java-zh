    OAS high level group and risk jeopardizing Peru’s adherence to democratic norms.3
    According to the Canadian government, the ouster of the elected president was
    a step forward for democracy.


    Castillo’s ouster was justified on the grounds the former union leader declared
    an “exceptional emergency government” and sought to dissolve Congress to pre-empt
    it by breach to impeachment. The constitutional legitimacy of Castillo’s actions
    was dubious. But his opponents’ plan also undercut constitutional norms and they
    wanted the vice president to rule for the remaining of Castillo’s four-and-a-half-year
    term. He at least called for immediate elections. Additionally, Castillo’s approval
    was significantly higher than the Congress that removed him (30%).4


    Global Affairs and Canada’s ambassador to Peru, Louis Marcotte, worked hard to
