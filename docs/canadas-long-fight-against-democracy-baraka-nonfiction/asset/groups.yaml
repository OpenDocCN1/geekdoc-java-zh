    Incredibly, the 2004 coup against Aristide began with an effort to discredit elections
    he neither participated in nor oversaw. In the May 2000 legislative and municipal
    elections, Aristide’s Fanmi Lavalas won more than 70% of the vote. They took an
    unprecedented 89 of 115 mayoral positions, 72 of 83 seats in the Chamber of Deputies
    and 18 of 19 Senate seats. Immediately afterwards, OAS observers called the elections
    “a great success for the Haitian population, which turned out in large and orderly
    numbers to choose both their local and national governments.”1 According to the
    OAS, 60% of registered voters went to the polls and there were “very few” incidents
    of either fraud or violence.


    In response to its crushing defeat, the opposition accused the electoral commission
    of organizing a “massive fraud.” Realizing there was little chance Fanmi Lavalas
    would be defeated at the ballot box in the foreseeable future, the US and Canadian-dominated
    OAS Observation Mission legitimized the opposition’s protests. The OAS challenged
    the calculation of majorities in some Senate seats, claiming Lavalas should have
    only won seven senate seats in the first round, not the sixteen announced by the
    electoral council.


    The electoral council determined the 50% plus one vote required for a first-round
    victory by calculating the percentages of the top four candidates. The OAS concerns
    were disingenuous since they worked with the electoral council to prepare the
    elections and were aware of the counting method beforehand. The same procedure
    was used in prior elections, but they failed to voice any concerns until Lavalas’
    landslide victory. Finally, the tabulation method proposed by the OAS would probably
    not have altered the outcome of the senate seats.'
