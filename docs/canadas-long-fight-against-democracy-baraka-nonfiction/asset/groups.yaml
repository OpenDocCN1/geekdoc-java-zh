    在恩克鲁马被推翻后不久，麦高海（McGaughey）在《外交》杂志写道：“加纳发生了一件西方好事，加拿大发挥了应的作用。”提到这次政变时，高级专员补充道：“除了政党官员和共产党外交使团外，这里的所有人都欢迎这一进展。”随后，他赞扬了加纳军队将“那些俄罗斯和中国的坏蛋赶了出去”。
