    government.35 Harper said, “I think we really have to credit the Ukrainian people
    themselves with resisting the attempt to overturn their democracy and to lead
    their country back into the past.”36


    After the coup, Canada’s PM was the first G7 leader to visit the interim government.37
    Alongside Baird and justice minister Peter MacKay, Harper told the acting president,
    “you have provided inspiration and a new chapter in humanity’s ongoing story of
    the struggle for freedom, democracy and justice.”38 During his visit to show up
    the US and Canadian-installed government, Harper accused Vladimir Putin of seeking
    to destabilize international security and return the world to the “law of the
    jungle.” In support of the unconstitutional change of power, Harper visited the
    authorities in Kyiv within two months.


    The individual who became president three months after the Maidan protests said,
    “Canada is one of Ukraine’s closest partners.” During September 2014 visit to
    Ottawa, Petro Poroshenko added that Ukraine had “no better friend.”


    The post-Yanukovych government banned a number of major political parties and
    empowered far-right forces that perpetrated significant violence, including a
    massacre of at least 42 individuals at the headquarters of'
