    The Venezuelan government responded to Canadian sanctions by denouncing Ottawa’s
    “alliance with war criminals that have declared their intention to destroy the
    Venezuelan economy to inflict suffering on the people and loot the country’s riches.27
    A Center for Economic and Policy Research report gave credence to this perspective.
    Written by Jeffrey Sachs and Mark Weisbro, “Economic Sanctions as Collective Punishment:
    The Case of Venezuela” concluded that 40,000 Venezuelans may have died in 2017
    and 2018 as a result of US sanctions.28 A July 2019 Financial Times story titled
    “Venezuela sanctions fuel famine fears” and a New York Times op-ed that month
    titled “Misguided sanctions hurt Venezuelans” highlighted their growing impact.


    Unilateral sanctions violate the UN charter. Additionally, the Human Rights Council
    passed a resolution condemning the economic sanctions by the US and Canada adopted
    against Venezuela.29 It urged “states to refrain from imposing the unilateral
    application and enforcement by certain powers of such measures as tools of political
    or economic pressure.”30 For its part, Caracas called Canada’s move a “blatant
    violation of the most fundamental rules of International Law.”31


    Canadian diplomats were encouraged to play up human rights violations in Venezuela.
    A 27-page Global Affairs report uncovered by the Globe and Mail noted “Canada
    should maintain the embassy’s prominent position as a champion of human-rights
