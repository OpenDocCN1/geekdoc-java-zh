    measurements available.


    The “hard-to-explain” changes cited by the OAS were entirely expected, as detailed
    in the Washington-based Center for Economic Policy Research’s report “What Happened
    in Bolivia’s 2019 Vote Count? The Role of the OAS Electoral Observation Mission.”
    The CEPR analysis pointed out that Morales’ percentage lead over the second-place
    Carlos Mesa increased steadily as votes from rural, largely Indigenous, areas
    were tabulated. Additionally, the 47.1% of the vote garnered aligned with pre-election
    polls and the vote score for the MAS party. The hullabaloo about the quick count
    stopping at 83% of the vote was preplanned and there was no evidence of a pause
    in the actual counting.


    Subsequent investigations CEPR’s analysis. A Washington Post commentary published
    by researchers at MIT’s Election Data and Science Lab was titled “Bolivia dismissed
