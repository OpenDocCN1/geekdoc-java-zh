    a significant internet presence inside Venezuela, so that we could then engage
    tens of thousands of Venezuelan citizens in a conversation on human rights. We
    became one of the most vocal embassies in speaking out about human issues and
    encouraging Venezuelans to speak out.”33


    During Rowwell''s tenure at the embassy, Canada financed NGOs with the expressed
    objective of embarrassing the government internationally. According to the government’s
    response to a July 2017 Standing Senate Committee on Foreign Affairs and International
    Trade report on Venezuela, “CFLI [Canada Fund for Local Initiatives] programming
    includes support for a local NGO documenting the risks to journalists and freedom
    of expression in Venezuela, in order to provide important statistical evidence
    to the national and international community on the worsening condition of basic
    freedoms in the country.”34 Another CFLI initiative funded during Rowwell''s tenure
    in Caracas “enabled Venezuelan citizens to anonymously register and denounce corruption
    abuses by government officials and police through a mobile phone application.”35


    In line with its policy of amplifying oppositional voices, the Canadian Embassy
    in Caracas co-sponsored an annual Human Rights Award with the Centro para la Paz
    y los Derechos Humanos, whose director, Raúl Herrera, repeatedly denounced the
    Venezuelan government. In late 2017 Herrera said, “the Venezuelan State systematically
    and repeatedly violates the Human Rights of Venezuelans and political prisoners.”36


