    # COLOMBIA, 1953


    In June 1953, Gustavo Rojas Pinilla seized power. Colombia’s political establishment
    backed the general’s coup, hoping Rojas would end the rural insurgencies that
    erupted after the assassination of Liberal leader Jorge Eliécer Gaitán. La Violencia,
    which saw left-wing guerrillas rise up against the entrenched conservative government,
    resulted in 1952 alone.1


    General Rojas took a hardline position against the guerrillas. He sought to “eradicate
    the roots of communism [through] his brutal use of force.”2 Ottawa ignored Rojas’s
    violent attacks against peasants and democracy activists. In fact, the Canadian
    government pushed for commercial cooperation with the dictatorship regime and
    Rojas was praised by the press. In “Securing the Expansion of Capitalism in Colombia:
    Canadair and the Military Regime of General Gustavo Rojas Pinilla (1953–1957),”
    Stefano Tijerina writes, “the Canadian government also welcomed the military dictatorship.
    The Winnipeg Free Press, for example, pointed out the peaceful transition of power
    after the military coup, paying minimal attention to the violation of the democratic
    process in Colombia. Six months after the military coup, the Alberta daily newspaper,
    The Medicine Hat News, presented a very favourable view of General Rojas, describing
    him as the ‘leader’ that brought ‘law and order’ back to the country. The West
    had given legitimacy to the military regime; Western nations believed in his nation-building
    project, and more specifically, in his commitment to eradicating communism.”3


    During the Rojas dictatorship, the Canadian government secured the sale of six
    Canadair F-86 fighter jets to the repressive regime. According to Tijerina, “the
    transaction marked the first sale of Canadian jet aircraft to Latin America and
    the first time of this kind occurred outside NATO and the Commonwealth.”4


    In discussing the sale, government officials noted privately that the fighter
    jets would be useful to ‘suppress revolt’ in Rojas’s Colombia.5 In arguing in
    favour of selling the arms, external affairs minister Lester Pearson pointed to
    the benefits for the Canadian aircraft industry that Colombia “was the best friend
    that Canada had in South America and it would be difficult to explain why the
    export of the aircraft could not be permitted.”6 He added that securing the sale
    with Rojas would open the door for other Canadian companies to profit in Colombia.


    Popular protests prompted the Colombian elite to remove Rojas from power in May
    1957, but the general laid the groundwork for Colombia’s twentieth-century economic
    liberalization. Canadian corporations greatly benefited from these policies.7


    1. Stefano Tijerina, “One Size Fits All? Canadian Development Assistance to Colombia,
    1953-1972,” in *A Samaritan State Revisited: Historical Perspectives on Canadian
    Foreign Aid* (Calgary: University of Calgary Press, 2019), 128.

    2. Ibid., 129-130.

    3. Tijerina, “Securing the Expansion of Capitalism in Colombia: Canadair and the
    Military Regime of General Gustavo Rojas Pinilla (1953–1957),” in *Big Business
    and Dictatorships in Latin America: A Transnational History of Profits and Repression*
    (London: Palgrave Macmillan, 2020), 350.

    4. Tijerina, “One Size Fits All?,” 130.

    5. Tijerina, “Securing the Expansion of Capitalism,” 366.

    6. Ibid., 365.

    7. Ibid., 366.


    # GUATEMALA, 1954


    In 1953, the CIA launched Operation PBSUCCESS to overthrow Guatemalan president
    Jacobo Árbenz. The covert action agency conducted an extensive propaganda campaign
    to undermine Árbenz, which included promoting a Guatemalanliberation army” established
    in Honduras. Under the command of exiled army colonel Carlos Castillo Armas, this
    small military force coordinated their attacks with the CIA. As part of these
    efforts, the US Navy enforced a blockade of Guatemala while US warplanes buzzed
    Guatemala City to sow popular panic and dissent within the army. In the face of
    this onslaught, Guatemala''s elected president stepped down and a series of military
    men took his place. Ottawa welcomed the military coup and Canadian investment
    in Guatemala increased in subsequent years.


    In 1944, a popular uprising in Guatemala overwhelmed the US-backed military dictatorship
    of Jorge Ubico and led to free elections in which Juan José Arévalo, a left-of-center
    nationalist, became Guatemala''s first democratically-elected leader. Arévalo
    implemented modern reforms furthering the disadvantaged, including the Maya who
    the Spanish nearly wiped out to establish a settler-plantation economy.


    Arévalo''s reforms were popular among ordinary Guatemalans, but they irked the
    domestic landed class, US business interests, and Washington.

