    由 USAID 和 CIDA 资助，根据位于英国的海地支持小组的说法，这些资助“完全不能代表海地大多数人的利益”。反对提高最低工资的浅肤汗水工业家安迪·阿派德子士和查尔斯·亨利·贝克主导了
    184 组织的领导层。


    律师兼人权研究员托马斯·格里芬描述了 184 团体是如何从 USAID 资助的团体中发展而来的，例如国际选举系统基金会（IFES），该基金会投入了数百万美元来建立“公民反对派”。迈阿密大学的一项人权调查解释说，IFES：


    - 组建从未不存在的团体，统一现有的团体，为人们提供参加的意识性研讨会，支付娱乐和餐饮费用，并基本上一个接一个地建立团体。

    - 他们接触学生团体、商业……[以及]人权组织——他们实际上付钱让这些组织报告人权暴行，以让阿里斯蒂德看起来很糟糕。……他们收买了记者，IFES 的协会演变成了
    184 团体，该团体变成了一个针对阿里斯蒂德的稳固反对派。


    渥太华支持 184 团体及其成员组织。CIDA 花了 1300 万美元用于由与 184 团体附属的 NGO 实施的以“公民社会、民主和人权”为主题的项目，加拿大援助也帮助制定了
    184 团体的“社会契约”。


    184 团体和民主联盟（CD）举行了多次谴责政府并要求阿里斯蒂德辞职的示威。州立（许多外国资助的 NGO 领导人在那里担任教授）的学生反对政府。亲政府和反政府示威者之间的冲突变得频繁，因为亲拉瓦瓦拉斯的群众组织动员起来，对抗（通常人数要少得多的）184
    团体的示威者。暴力冲突从投石升级到武器攻击，在少数情况下甚至使用了火器。紧张局势导致了孤立的政治暗杀事件，例如亲拉瓦瓦拉斯小组杀杀了记者布里格诺·林多尔，作为对反对派支持者在勒蒂戈夫（Petit
    Goave）杀害他们的一名成员的回报。正如政治学家罗伯特·帕顿子士所言的那样，一些亲拉瓦瓦拉斯的群众组织开始“威胁反对派，因为他们认为反对派正在故意激化危机，以产生一种有利于军事当局回归的混乱”。


    群众组织的担忧并非理论性的。2001 年 7 月和 12 月，前士兵试图推翻阿里斯蒂德。他们通过从多米尼共和国进行的跨境袭击，对政府及其支持者发动了低水平战争。富裕精英和民主联盟的核心成员秘密资助了这场“叛乱”，这场叛乱结合了解散军队的前士兵以及臭名昭彰的
    FRAPH 领导人路易·乔德·尚布兰。


    当亲拉瓦瓦拉斯群众组织与反政府抗议者发生冲突时，公民和政治反对派指责政府利用帮派镇压异见。反对派还引用帮派暴力和毒品作为拉瓦瓦拉斯政府及其支持者邪恶计划的进一步证据。然而，这些问题在阿里斯蒂德第二个任期之前后一直困扰着这个国家——特别是比首港快速发展的贫民窟。来自贫民窟的政府支持者无情地丑化为“奇美拉”（暴徒）和“拉瓦瓦拉斯暴民”。公民和政治反对派的一些成员称阿里斯蒂德为“法西斯分子”，并声称他的政府正在进行“种族灭绝”。


    缺乏党性的观察者发现，杜瓦利埃独裁和军事集团为特征的系统性人权侵犯和政治镇压完全不存在。在政治紧张局势升剧、跨境军事袭击和外国经济绞杀的背景下，国际赦赦组织的报告显示，最多有
    30 起政治谋杀可以归于警察或亲拉瓦瓦拉斯团体（与政府的联系非常微弱）。没有与之前的（或之后的）政府进行比较的依据。根据彼得·哈尔沃德的说法，“记住这些基本数字：在杜瓦利尔统治下（1957-1986）可能有
    5 万人死亡，在南菲/阿夫里尔时期（1986-1990）可能有 700 到 1000 人死亡，在塞德拉斯统治下（1991-1994）有 4000 人死亡，随后在拉托尔特时期（2004-2006）又有
    3000 人被杀。”人权律师布莱恩·康康西翁子士认为，反对派对政治迫害的指控与事实完全不符：


    “媒体在[阿里斯蒂德第二个]任期内是如此自由，以至于在 2004 年政变前，你会看到媒体公开要求推翻政府。在美国，那是不被容忍的。那已经超出了言论自由的范围。我预计那在加拿大也是非法的。有巨大的集会自由。有些会议在美国或加拿大绝对会被控制，因为它们是暴力且非法的。因为它们是由反对派发起的，阿里斯蒂德政府没有碰它们。所以，这样的人被称为独裁者真是很奇怪。”


    尽管有巨额资金支持，反政府反对派也无法将其支持扩大到小的城市“中产阶级”基础之外。“大家都知道阿里斯蒂德很坏，”保罗·法穆解释道，“我是说，除了海地的穷人——占人口的
    85%。”尽管经济状况恶化并受到 NGO 和政治反对派的无情诋化，阿里斯蒂德的受欢迎依然稳固。由 USAID 委托的 2002 年和 2003 年民调由《纽约时报》记者特蕾西·基德获得，显示出对阿里斯蒂德的支持持续稳定。政变六个月后，美国大使詹姆斯·福利在份机密电报中承认，一项民调“显示阿里斯蒂德仍然是海地唯一好感率超过
    50%的人物”。


    184 团体的示威活动经常被亲拉瓦瓦拉斯的反击集会所掩盖。到 2003 年底，这种人为夸大的反对派运动仅成功让一小部分民众反对政府。加拿大外交部的大卫·马洛恩观察到，“令朋友小组（加拿大、美国和法国）感到遗憾的是，阿里斯蒂德仍然是海地最强大的政治力量。”NGO、184
    团体和民主联盟无法对政府构成真正的政治挑战。他们需要帝国三头体的直接干预，而他们的加拿大 NGO 伙伴为美国、法国和加拿大的入侵提供了合法性。


    在阿里斯蒂德于 2001 年上职的前几天，许多加拿大 NGO 呼吁推翻阿里斯蒂德。2003 年 12 月 15 日，魁北克的 NGO 伞组织——魁北国际合作组织协会（AQOCI）呼吁加拿大政府“公开谴责”阿里斯蒂德及其“政权”，该政权“充斥着人权侵犯”。发展和平杂志在
    2003 年 12 月 16 日写给总理保罗·马丁的信中更进一步，要求加拿大要求阿里斯蒂德辞职，并协助建立一支国际力量来解除阿里斯蒂德支持者的武装。两个月后，海地协调小组（CPH）——一个由发展和平、AQOCI
    和教会援助在内的六个 NGO 组成的非正式团体——将阿里斯蒂德定为“暴君”，将他的政府称为“独裁政权”，并呼吁结束“恐怖统治”，移除阿里斯蒂德。

