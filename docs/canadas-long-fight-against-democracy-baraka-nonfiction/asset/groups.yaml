    总理联系了法国、西班牙、巴拉圭、爱尔兰和意大利的领导人，以及国际货币基金和欧盟联盟，说服他们加入加拿大反对委内瑞拉的行动。16 在2019年5月与西班牙首相佩德罗·桑切斯的一次会话中，关于该呼吁的官方新闻稿中唯一提到了委内瑞拉。17
    日本首相安倍晋三2019年4月访问渥太华期间，委内瑞拉也是议程之一。会后发布稿指出：“访问期间，安倍首相宣布日本支持《渥太华委内瑞拉宣言》。”18 《渥太华宣言》产生于2019年2月的利马集团会议，该宣言要求委内瑞拉武装部队“表现出对临时总统的忠诚”并罢免当选总统。19


    4月30日，瓜伊多、反对派政治家莱奥波尔多·洛佩斯（他因2014年“guarimbas”抗议期间煽动和策划暴力被判处13年监）以及其他人试图在加拉斯煽动军事起义。凌晨几小时后，弗兰兰推特道：“密切关注今天委内瑞拉的动态。胡安·瓜伊多和莱奥波尔多·洛佩斯的安全必须得到保障。和平支持临时总统瓜伊多的委内瑞拉人必须在不受恐吓或暴力的情况下这样做。”20
    她随后向媒体发表声明指出：“委内瑞拉人今天走上街头，即使面对暴力镇压也展示了他们对回归民主的渴望。加拿大赞赏他们的勇气，并敦促马杜罗政权立即下台。”21 随后弗兰兰发布了一个视频，呼吁委内瑞拉人起义，并请求利马集团召开紧急视频会议。22
    当晚晚些时候，联盟发表声明，将此次政变企图描述为“恢复民主”的努力，并要求军队“停止作为非法政权压迫委内瑞拉人民的工具”。23


    瓜伊多于2020年1月正式被免委内瑞拉国民议会领导人（此举存在争议）。两周后，瓜伊多寻求重申他的国际支持。他在渥太华受到欢迎，会见了加拿大总理、国际发展部长和外交部长。杜鲁道宣布：“我赞扬临时总统瓜伊多在努力恢复委内瑞拉民主方面表现出的勇气和领导力，并代表加拿大提供持续支持。”24


    在两年的时间里，渥太华断绝了与加拉斯的外交关系。渥太华效华盛对委内瑞拉官员实施了四轮制裁。25 2017年9月，当选总统、副总统、选举委员会主席以及其他三十名官员在加拿大的资产被冻结，加拿人被禁止与这些个人进行财务往来。当43个人被加入一个70名领导人的名单时，加拿大已经实施了制裁。CBC在2019年4月报道说，制裁旨在“惩罚那些为马杜罗行动背书的委内瑞拉法官”，以及“在2月23日镇委内瑞拉反对派向国家提供人道主义援助的尝试中发挥重要作用的中低警察官员”。26


    制裁的真实目标是帮助压缩经济以引发政权更迭。虽然表面上针对个人，但加拿大的制裁阻止了公司在委内瑞拉开展业务。它们还帮助更具破坏性的美国行动合法化。


    委内瑞拉政府对加拿大的制裁的回应是谴责渥太华与战犯结盟，“这些战犯宣布打算破坏委内瑞拉经济，给人民带来并掠夺该国财富”。27 经济与政策研究中心的一份报告证实了这一观点。由杰弗里·萨克斯和马克·魏斯布鲁写的《作为集体惩罚的经济制裁：委内瑞拉案例》得出结论，受美国制裁影响，2017和2018年可能有4万委内瑞拉人死亡。28
    2019年7月，《金融时报》一篇题为《委内瑞拉制裁加剧饥荒担忧》的文章以及该月《纽约时报》的一篇题为《错误的制裁伤害了委内瑞拉人》的评论强调了其日益增长的影响。


    单边制裁违反了联合国宪章。此外，人权理事会通过了一决议，谴责美国对委内瑞拉实施的经济制裁。29 决议敦促“各国避免某些国家单方面地适用和执行此类措施，作为政治或经济压力的工具”。30
    加拉斯方面认为加拿大的此举是“对国际法最基本规则的公然违反”。31


    加拿大外交官被鼓励大大委内瑞拉的人权侵犯行为。《环球邮报》发现的一份27页全球事务报告指出，“加拿大应保持其大使馆作为人权捍卫者的显赫地位。”由于其对干涉该国事务而引发的敌意，这份被部分删除的2017年报告建议加拿大官员还应“制定并实施策略，以减少政府在回应加拿大人权声明和活动时所采取攻击的影响”。32


    渥太华致力于放大委内瑞拉内部反对派的声音。2017年，离任的加拿大大使本·罗威尔（Ben Rowwell）告诉《渥太华公民报》：“我们在委内瑞拉内部建立了相当大的网络存在感，这样我们就能与成千上万委内瑞拉公民就人权进行对话。我们成为就人权问题和鼓励委内瑞拉人发声方面最有影响的大使馆之一。”


    在罗威尔担任大使期间，加拿大资助了非政府组织（NGO），其明确目的是让政府在国际上尴尬。根据政府对2017年7月参议院外交和贸易委员会关于委内瑞拉报告的回应，“CFLI[加拿大地方倡议基金]计划包括支持一家当地NGO，记录委内瑞拉记者和言论自由面临风险，以便为国家和国际社区提供重要的统计证据。”34
    罗威尔在加拉斯任期间资助的另一项CFLI计划使委内瑞拉公民能够通过手机应用程序匿名注册并举报政府官员的腐败滥用。”35


    与其放大反对派声音的政策一致，加拿大驻委内瑞拉大使馆与和平人权中心（Centro para la Paz y los Derechos Humanos）共同举办了年度人权奖，该中心主任拉乌尔·赫雷拉（Raúl
    Herrera）多次谴责委内瑞拉政府。2017年后期，赫雷拉表示：“委内瑞拉国家系统地、反复地侵犯委内瑞拉人和政治犯的人权。”36


    获奖者将获得“一次对委内瑞拉几个城市的访问，以与其他促进人权的组织分享经验”，并前往加拿大与“人权当局”会面。”37 他们通常会获得媒体关注。加拿大媒体中引用最多、批评该国人权状况的委内瑞拉非组织——Provea、Foro
    Penal、CODEVIDA、Observatorio Venezolano de Conflictividad、Observatorio Venezolano
    de Prisiones等——均获得了加拿大大使馆的正式认可。


    2018年3月，大使馆将其人权奖颁给了健康与生命权利组织联盟（CODEVIDA）的主任弗朗西斯科·瓦伦西亚亚（Francisco Valencia）。众多媒体媒体报道了这项颁给委内瑞拉政府反对派成员的奖项。38
    “我认为我们正面临一个犯罪国家，”瓦伦西亚亚告诉《委内瑞拉危机危机》。39 2018年7月，瓦伦西亚亚在渥太华发表演讲，并被《环球邮报》报道。“在我看来，加拿大通常是谴责委内瑞拉侵犯人权最多的国家……而且在人道主义问题资助方面帮助最大，”瓦伦西亚亚解释道，他还告诉该报自己是“政府的目标”。


    在另一个受邀来到渥太华的反政府人物中，前加拉斯大市市安东尼奥·莱德斯马（Antonio Ledezma）在外交和国际发展常委会国际人权小组委员会前呼了“人道主义干预”。41
    2018年9月，莱德斯马表示：“如果国际社会不尽快为委内瑞拉启动人道主义干预原则——这一原则发展了保护责任的概念——他们只能给委内瑞拉人送去悼案，但这无法挽回在危机中失去生命的数万人。”'
