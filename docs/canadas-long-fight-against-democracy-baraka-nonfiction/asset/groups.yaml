    Since Confederation, the federal government has undermined Indigenous governments
    in innumerable ways. In 1870 and 1885, for example, British and Canadian troops
    violently repressed two rebellions against the expansion of colonial rule into
    Western Canada. Louis Riel, a prominent leader of these resistance movements and
    the founder of Manitoba, was hanged by the Canadian government in 1885.


    For a century Indian Agents oversaw politics on reserves and the 1876 Indian Act
    subverted Indigenous governance. *To instill dependence on Indian Affairs,* the
    federal government-imposed band councils on hundreds of First Nations. The Indian
    Act undercut direct democracy and governing structures linked to distinct land
    and cultural practices. For over half a century women and hereditary chiefs were
    largely excluded from band council politics.


    Despite regular pae to “reconciliation,” Ottawa continues to subvert First Nations
    self-governance and intervened to prevent more democratic decision-making. In
    recent years Canada has repeatedly jailed band council leaders. In 2008, for instance,
    the chief, deputy chief and four other members of the Kitchenuhmaykoosib Ininnuwwug
    (Big Trout Lake) council were imprisoned for their opposition to mining operations
    on their reserve 600 km north of Thunder Bay, Ontario.


    A more subtle way to usurp Indigenous governance has been to impose third party
    management. It grants the federal government control of a reserve’s finances.1'
  - '[PAGE 171]


    The Algonquins of Barriere Lake were placed under third party management and then
    the federal government sidelined the nation’s leadership. After years of struggle,
    Barriere Lake won a landmark revenue sharing and resource co-management agreement
    with the Federal and Provincial governments. Unhappy with the 1991 “Trilateral
    Agreement,” Indian Affairs fomed division within a community that hunts, traps
    and harvests on 10,000 square kilometers north of Ottawa. Ottawa failed to pay
    Barriere Lake resource management fees under the “Trilateral Agreement” and imposed
    third party management on the reserve. They refused to recognize the Algonquin’s
    Customary Chief and subsequently organized an election that a dozen in the community
    of 500 participated in. For a time, the Canadian government-recognized Chief operated
    from a location outside the community.


    There is a wealth of scholarship on the ways in which Ottawa has dismantled Indigenous
    governance, but research into Canada’s support for ousting governments around
    the world is lacking. This book aims to remedy that gap.


    In addition to shining a light on Canadian foreign policy, this book aims to help
    readers understand the coup process itself. Rarely do coups begin the day the
    leader or government is overthrown, and there are generally many opportunities
    to stop them. Successful coups, however, usually include economic, diplomatic,
    propaganda, and military dimensions.


    To generate popular frustration with the targeted government, outside powers usually
    seek to “make the economy scream,” as US president Richard Nixon declared when
    seeking to destabilize Allende’s Chile. This usually includes cutting off aid
    or bilateral or multilateral loans, and sometimes it means imposing sanctions.
    During the coup attempt'
  - '[PAGE 172]


    against Venezuela, which Ottawa actively assisted, then US National Security Advisor
    John Bolton compared similar measures against the Maduro government to Darth Vader
    choking his victims in Star Wars.5


    Invariably, coup attempts also include a disinformation campaign. Canada, the
    tactic of using disinformation against enemies of state goes back many years.
    During the 1885 Northwest rebellion on the prairies, for example, Ottawa took
    over local newspapers and used them to spread racist propaganda and hinder local
    support for the resistors.6 When it comes to international coup attempts, disinformation
    campaigns serve a similar purpose. The human rights violations of the targeted
    government are exaggerated while the nation''s leader is demonized as corrupt,
    authoritarian, and evil. There is also usually some effort to promote or organize
    opposition protests. The US and Canada often fund civil society groups and coordinate
    with opposition politicians. Sometimes, as was the case in Venezuela, they even
    create a parallel leadership.


    Generally, there is an effort to isolate the government diplomatically. The targeted
    government is criticized in international forums and may be blocked from participating
    in international gatherings. Sometimes a multistate alliance is created to criticize
    the targeted state and isolate them further on the world stage. At the same time,
    destabilization campaigns are devised to stoke unrest and legitimate military
    intervention. Sometimes foreign troops intervene but it is usually the targeted
    country’s armed forces, which is why the US and Canadian militaries seek influence
    with their counterparts in other countries by their training.


    Much like how First Nations were targeted by the state to acquire their land and
    wealth, governments targeted for coups have often pursued political, economic,
    and social reforms that anger the corporate set. In many cases, Canadian-backed
    coups have led to the reversal of reforms and'
  - '[PAGE 173]


    created direct money-making opportunities. After Pinochet''s 1973 coup against
    Allende, Timothy David Clark notes, “Canadian mining companies were leaders in
    the stampede of foreign investment to Chile. Between 1974 and 2003, Canada was
    the third-largest single investor in the country, behind the United States and
    Spain, with Spain surpassing Canada only towards the end of the 1990s.”Z In the
    decades after Allende was overthrown, Canadian companies owned most of Chile''s
    largest mining projects.


    It must also be said that narrow corporate interests rarely cause a coup. Broader
    economic, racial and gestrategic dimensions usually shape policy toward targeted
    nations as well. For example, ousting Congo''s Patrice Lumumba, Uganda''s Milton
    Obote and Ghana''s Kwame Nkrumah was partly about stunting these leaders'' efforts
    to dismantle colonial structures and pan-African unity. One can identify a similar
    dynamic at play in recent coups in Latin America. Undercutting regional integration
    was a factor in the coups in Bolivia, Honduras, and Brazil as well as the failed
    bid to oust the Venezuelan government.


    Some coups are largely about geopolitics. Ottawa wanted to be rid of Viktor Yanukovych
    because he promoted cordial relations with Moscow and opposed Ukraine joining
    NATO. In this case, an organized ethnic lobby was also an influential force in
    promoting Canada''s bid to subvert the elected Yanukovych. The Ukrainian Canadian
    Congress, which represents Western Ukrainian nationalists, pushed against Yanukovych.
    A similar force contributed to Canada''s effort to sabotage Palestinian elections
    as the Israel lobby in Canada is well-financed and organized around a specific
    political ideology.


    The coup in Haiti was shaped by a particularly virulent form of racism. Since
    its 1804 Revolution, white supremacist forces have sought to'
  - '[PAGE 174]


    humiliate the country’s impoverished Black masses and Canada threw its weight
    behind their goals by helping overthrow a learned, polyglot Black president hated
    by the country’s light-skinned elite.


    In all the coups documented in this book, Ottawa worked in tandem with the US
    government. However, that does not mean Ottawa was coerced into supporting these
    anti-democratic forces. The Canadian elite does not require pressure from Washington
    to disposs and disempower Indigenous nations. Canadian leaders generally participated
    in the coups happily, which speaks to how elite Canadian interests are served
    by the US empire. In short, Canada’s ruling class views the world much like their
    US counterparts and profits from global exploitation in a similar way.


    If we are serious about democracy, the correct prescription is to First Do No
    Harm. Rather than seeking to make Canada a force for promoting elections, we need
    to restrain Ottawa’s ability to subvert democracy around the world. Frankly, this
    approach is low cost. It does not require new financial contributions or interventions
    and is also in line with international law. Non-interference in other countries’
    affairs is an important principle of international law. Article 2 (7) of the UN
    Charter states that “nothing should authorize intervention in matters essentially
    within the domestic jurisdiction of any state.” Furthermore, the concept of self-determination
    is a core principle of the UN Charter and International Covenant on Civil and
    Political Rights.


    In recent years, the Canadian government and media have devoted significant attention
    to China and Russia’s purported interference in Canadian democracy. For instance,
    the Trudeau government established a special task force of CSIS, RCMP, CSE, and
    Global Affairs officials to monitor potential threats to Canada’s electoral system.9
    While no foreign government should meddle in another country’s political or electoral'
- md: '

    system, Ottawa has little standing to moralize on the subject. As outlined throughout
    this book, Canada has interfered in the political and electoral systems of many
    countries, backing certain leaders over others and helping shape those countries’
    politics to fit Ottawa’s preferences. Simply put, if foreign meddling in a country’s
    sovereign affairs is unconscionable to our leadership, then they should stop doing
    it elsewhere.


    Hopefully this book assists readers in evaluating officials’ claims on both the
    topics in question and other international issues. Indirectly, this book challenges
    the notion that Ottawa’s conflict with other states is about democracy or authoritarianism.
    Are we really to believe Canadian officials are concerned about democracy in China,
    Russia, or Iran when they’ve repeatedly subverted elected governments?


    This book is about Canada’s role in overthrowing democracy, but more broadly,
    it is a handbook for democracy. Democracy requires an informed public, and Canadians
    cannot demand better of their government if they do not understand what democracy
    is going.


