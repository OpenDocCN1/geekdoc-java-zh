    穆雷·布鲁克斯特（Murray Brewster）写道：“加拿人在某些地方并不受欢迎，偶尔还会被亲俄乌克兰人所憎恶。”


    至少某些允许使用加拿大大使馆的人中，来自极右翼分子。卡奇乔夫斯基（Katchovsky）教授在《乌克兰的极右翼、欧洲广场和迈丹大屠杀》中报告道：“极右翼自由党（Svoboda）附属C14的领导人承认，基于C14的迈丹自卫公司曾于2月18日躲入基辅的加拿大大使馆，并在迈丹大屠杀期间留在了那里。”28


    2月19日和20日，超过50人死于暴力事件，这些事件被广泛归咎于政府安全部队。然而，卡恰诺夫斯基、BBC等人的研究显示，极右翼活动分子可能是许多死亡事件的责任者。29


    杀戮事件引发了政府的崩溃。正如美国务卿助理秘书维多利亚·纽兰（Victoria Nuland）与驻乌克兰大使杰弗里·皮亚特（Geoffrey Pyatt）之间的一通泄露电话电话所示，美国官员为雅努科维奇的违宪更替铺平了道路。30
    在电话中，美国官员决定主张加入北约的阿塞尼·亚森纽克（Arseniy Yatsenyuk）应该掌权。


    在雅努科维奇被下台后，渥太华试图巩固这个违宪政府。不久后，拜尔德（Baird）欢迎“任命合法政府是恢复乌克兰民主和正常化的关键一步”。31 但该国中处理更换或弹劾总统的宪法规定遭到了公然违背。尽管乌克兰议会通过了一项支持罢免雅努科维奇的决议，但宪法第111条规定的弹劾程序需要特别调查委员会对总统提出指控、宪法法院最高法院的裁决，以及议会的多次（决定性的）投票。32


    政变几天后，拜尔德带领一个由保守党议会议员和乌克兰裔加拿人代表组成的代表团，会见了临时总统奥列克山德·图尔尼科夫（Oleksandr Turchynov）和新总理阿塞尼·亚森纽克，后者是纽兰的首选。33
    加拿大外交部长宣布立即为政治暴力中受伤的人提供2亿加元的医疗援助。34 随后，渥太华宣布向过渡政府提供2.2亿加元的援助。35 哈珀（Harper）表示：“认为我们真的应该感谢乌克兰人民自己，他们抵抗了推翻自身民主并并将国家带回过去的尝试。”36


    政变后，加拿大总理是首位访问过渡政府的G7领导人。37 哈珀与拜尔德以及司法部长彼得·麦凯格（Peter MacKay）一起告诉临时总统：“你为人类正在争取自由、民主和正义的斗争故事提供了灵感和新篇章。”38
    在为了支持由美国和加拿大任命的政府的访问期间，哈珀指责弗拉基米尔·普京（Vladimir Putin）试图破坏国际安全并让世界回到“丛林法则”。为了支持这次违宪的权力更替，哈珀在两个月内访问了基辅当局。


    在迈丹抗议三个月后当选总统的个人表示：“加拿大是乌克兰最亲密的伙伴之一。”在2014年9月访问渥太华期间，彼得·波罗申申（Petro Poroshenko）补充说，乌克兰“没有更好的朋友”。


    雅努科维奇后的政府禁止了若干主要政党，并授权了实施严重暴力的极右翼势力，其中包括在奥德萨工会联合总部发生的导致至少42人死亡的大屠杀。渥太华对奥德萨大屠杀和对反对派的禁令保持沉默。


    2014年的政变使乌克兰在政治、地理和语言上陷入了分裂。主要讲俄语的南部和东部抗议了源于该地区的雅努科维奇被下台。同样，许多人反对政变后的右翼民族主义政府，因为该政府立即取消了俄语的官方语言，并禁止使用俄语、波兰语和匈牙语（Magyar）进行教育，同时通过建立塑像和重新命名街道，试图平反强硬的反苏苏联历史人物（包括纳粹合作者）。


    2014年的政变促使莫斯科占领了拥有大部分俄罗斯族人口和具有战略意义的俄罗斯海军基地的克里米亚。此外，政变以及随后对俄语使用者的暴力（包括奥德萨大屠杀）促使东部顿涅茨克地区的数千名乌克兰人反抗基辅受西方支持的新政府。莫斯科为这场内部起义提供了军事和后勤支持。顿涅茨克成为了一场八年战争的现场，导致1.4万人死亡，并为俄罗斯2022年入侵乌克兰造成了影响。


