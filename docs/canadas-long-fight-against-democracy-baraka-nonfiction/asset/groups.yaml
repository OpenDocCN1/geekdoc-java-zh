    # THE DOMINICAN REPUBLIC, 1963


    In late 1962, the leftist Juan Bosch won the Dominican Republic’s first clean
    election with 59% of the vote. At first backed by the US government as a reformer
    who could mediate the excesses of the increasingly embarrassing Rafael Trujillo
    dictatorship, Bosch proved to be more than the toothless politician Washington
    desired. After three decades of Trujillo family rule, Bosch encouraged civil society
    by training cooperative, union, and peasant leaders. The Dominican president also
    moved to break up some of the country’s large plantations and pushed constitutional
    changes that expanded the rights of labour, women, and children. These moves were
    not welcomed by the right-wing church establishment or economic elite that built
    up tremendous wealth under Trujillo. Nor was Washington happy, who saw “another
    Cuba” in Bosch’s mild but important reports.


    After months in office, Bosch was exiled in a military coup backed by industrialists,
    large landowners, and the church. With Washington’s support, the elected government
    was replaced by a three-man military junta. US Senator J. W. Fulbright stated
    that “the United States turned its back on social revolution in Santo Domingo
    and associated itself with a corrupt and reactionary military oligarchy.”1 Bosch
    himself later wrote that “the most influential strata of the population [the upper
    and middle classes] joined with political leaders...in a conspiracy to defeat
    the democratic government.”2


    Growing dissatisfaction with the coup regime spurred a military counter-rebellion
    led by “constitutionalist” forces demanding Bosch be restored to office. After
    the coup regime successfully removed from power, the US intervened. At the end
    of April 1965, the Lyndon B. Johnson administration dispatched more than 20,000
    US troops to the Dominican Republic, almost half the number of US soldiers then
    in Vietnam.3 Johnson blamed Cuban-trained communist operatives for the uprising
    against the unelected military regime. On May 2, 1965, the President claimed “Communist
    leaders, many of them trained in Cuba, seeing a chance to increase disorder, to
    gain a foothold, joined the revolution. They took increasing control. And what
    began as a popular democratic revolution ... very shortly moved and was taken
    over and really seized and placed into the hands of a band of Communist conspirators.”4
    Therefore, he argued, the US had to invade to protect “progress, democracy ...
    social justice [and] the principles of the inter-American system.”5


    Despite touting the invasion as a necessary measure to protect the “inter-American
    system,” Johnson did not seem bothered by the fact that the military intervention
    was a violation of the Organization of American States (OAS) charter. The US administration
    had failed to inform Latin American member states of the invasion beforehand,
    an “open contravention of articles 15 and 17 of the OAS charter.”6


    In response to the invasion, prime minister B. Pearson told Parliament: “the United
    States government intervened in the Dominican Republic for the protection of its
    own citizens and those of other countries.”7 When asked whether the “United States
    has the right to violate the sovereign rights of the Dominican Republic by the
    landing of marines,” Pearson said: “I think it is well known in international
    law—indeed it is accepted in the Organization of American States—that a government
    has the responsibility for protecting its own people in situations of insurrection
    and disturbance when those citizens are in danger and when the forces of law and
    order seem to have temporarily disappeared.”8 Secretary of state for external
    affairs, Paul Martin Sr., also jumped to the defense of the Johnson administration,
    stating:“It is easy to criticize countries which bear the brunt of responsibility
    when dangerous situations develop. Such criticism must be directed at the imperfections
    of our international arrangements.”9


    The government continued to defend US actions even after it was clear Washington
    was not simply protecting US civilians. Three weeks after the US deployed its
    troops, an NDP MP referred to the “invasion of the Republic by the United States,”
    prompting External Affairs Minister Martin to complain about this “extravagant
    characterization” of “the American interest in Latin America and the Dominican
    Republic.”10


