    伊朗，1953年。哥伦比亚，1953年。

    危地马拉，1954年。刚果民主共和国，1960年。

    多米尼加共和国，1963年。

    巴西，1964年。印度尼，1965年。

    加纳，1966年。加蓬，1990年代。

    乌甘达，1971年。利比利亚，1983年。

