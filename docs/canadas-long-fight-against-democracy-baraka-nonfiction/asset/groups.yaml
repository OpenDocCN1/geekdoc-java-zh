    mining companies in Honduras and create transparency in mining operations. Mr.
    Reeder estimated potential investments in Honduras of up to US$700 and pointed
    out the benefits to the country in terms of jobs creation and additional tax revenues.
    Mining in Honduras by foreign multinationals has traditionally been a source of
    contention, with one side arguing in favor of business interests and another pointing
    out the environmental damages caused by open pit mining and the use of chemicals
    such as cyanide.


    The Honduran right-wing retained power for twelve years after the coup, relying
    on state repression, North American support, and rigged elections that first brought
    to power Porfirio Lobo (2010-2014) and later Juan Orlando Hernández (2014-2022).


