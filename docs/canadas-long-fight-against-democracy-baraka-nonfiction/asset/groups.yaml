    # INTRODUCTION


    Canada supports democracy around the world. The leaders of this country promote
    free and fair elections, freedom of assembly, and freedom of the press.


    At least, that''s what Canadian officials say. Lester B. Pearson waxed eloquent
    about “the struggle of free, expanding progressive democracy against tyrannical
    and reactionary communism.”1 Pierre Trudeau lauded “the freedom of individuals
    and of nations, the political freedom which distinguishes East from West.”^2


    To justify Canada’s 2004 intervention in Haiti, Prime Minister Martin talked about
    the primacy of democracy to economic development while Stephen Harper’s foreign
    affairs minister John Baird declared that “Canada will continue to support people
    who are seeking to bring freedom, democracy, human rights and the rule of law
    to their respective countries.”^3 In 2019 foreign affairs minister Chrystia Freeland
    claimed Canada supported Ukraine since the country was at the “forefront of the
    struggle between democracy and authoritarianism,” while a 2021 release by Justin
    Trudeau was titled “Prime Minister focuses on protecting democracy at Summit for
    Democracy.”^4


    Alongside the pro-democracy rhetoric, the federal government has instigated various
    initiatives with the ostensible aim of promoting democracy. In 1988, the Brian
    Mulroney government set up the International Centre for Human Rights and Democratic
    Development (Rights and Democracy). In 2009, Harper opened a South America-focused
    “democracy promotion” centre at the embassy in Peru while Canada'
  - '[PAGE 9]


    Fund for Local Initiatives, a financing mechanism overseen by diplomatic outposts,
    lists “democracy” as a top concern.


    Echoing government officials, the media regularly suggests Canada seeks to promote
    democracy. They frame conflicts with countries ranging from China to Russia to
    Iran as motivated by a belief in democracy.


    At the critical end of the mainstream discussion, commentators sometimes complain
    that Ottawa does business with or maintains ties to undemocratic regimes. In the
    years before this book went to print, there was significant criticism of Canada
    selling light armoured vehicles to Saudi Arabia. In an earlier period, there was
    some criticism of Canada’s ties to Hosni Mubarak in Egypt and Suharto in Indonesia
    as well as Ferdinand Marcos in the Philippines, Duvalier in Haiti and the shah
    in Iran. There is, in fact, an underexplored history of Canadian officials supporting
    autocratic and repressive regimes. But this book is not about Canada accommodating
    an unjust world by passively/actively supporting dictatorships.


    Rather, it is about Ottawa passively/actively subverting elected governments around
    the world and why it has done so.


    Canada has repeatedly endorsed US-backed military coups against elected, usually
    progressive, leaders. As we will see, Canada has passively supported the ouster
    of, or actively contributed to, the overthrow of at least twenty elected governments.
    Ottawa passively supported the removal of Iranian prime minister Mohammad Mosaddegh
    in 1953, Guatemalan president Jacobo Árbenz in 1954, Dominican Republic leader
    Juan Bosch in 1963, Brazilian president João Sukarno in 1966, Ugandan president
    Milton Obote in 1971, Paraguayan leader Fernando Lugo in 2012, Brazilian leader
    Dilma Rousseff in 2016, and Peruvian president Pedro Castillo in 2022. Additionally,
    Canada offered quiet support to military interventions that impeded'
