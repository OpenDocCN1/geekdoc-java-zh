    莫布图与加拿大的政治和军事官员建立了密切联系。在1992年的一次采访中，加拿大外交官米歇尔·高维（Michel Gauvin）表示，“在我担任利奥波维维代公的期间（1961年至1963年），我非常了解莫布图，我是受邀参加他其中一个女儿洗礼的少数白人之一。”38
    在《风暴之眼：加拿大维和行动史》中，弗雷德·加芬（Fred Gaffen）解释道：


    莫布图学会了信任加拿大军官。这种信任在安排刚果军队与联合国部队之间的停火、谈判释放人员以及联合国与刚果当局之间的联系方面具有无法估量的价值。成为扎埃民主共和国总统的莫布图于1964年5月访问了加拿大。当时，他感谢了对维护国家统一做出巨大贡献的加拿大军官。39


