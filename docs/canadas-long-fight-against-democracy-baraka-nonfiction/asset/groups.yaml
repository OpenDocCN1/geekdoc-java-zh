    但争夺太子奥普朗斯的战斗从未发生过。2004年2月29日凌晨，美国士兵在加拿大军队“安保”机场的情况下下，护送海地的当选总统及其安保人员登上一架喷气飞机离开了该国。美国官员坚称总统是为了避免流血而辞职的。尽管阿里斯蒂德（Aristide）有自矛盾的说法，世界上大多数媒体仍接受了这一版本的事件。


    著名教授杰弗里·萨克斯（Jeffrey Sachs）回忆了2月29日的事件：


    根据阿里斯蒂德的说法，位于奥普朗斯的美国官员告诉他，反叛军正前往总统府，除非他们立即登上候命送他们去流亡的美国包机飞机，否则他和他的家人可能无法幸存。他说，尽管这很容易安排，但美国明确表示，不会在官方官邸为他提供任何保护。事实上，阿里斯蒂德的律师说，美国阻止了阿里斯蒂德安保人员的增援，并在他签署辞职信之前拒绝进入飞机。随后，阿里斯蒂德被拒绝使用电话近24小时，直到他被草草地丢在中非共和国，期间对目的地一无所知。


    尽管在几天前忽略了加勒比共同体（CARICOM）和美洲（OAS）的支持请求，在美、法、加军队推翻当选政府后，联合国安理会通过了一项授权干预的动议。在周日晚上一个持续三分钟的会议中——根据联合官方摘要，晚上9:52至9:55之间——安理会“授权立即部署一支为期三个月的跨国临时部队，以帮助维护首都奥普朗斯及该国其他地区的安全与稳定。”该决议重复了政变期间的论点。它指出，“在2000年5月存在缺陷的选举之后，海地的政治局势变得动荡，”并声称干预的设计目的是“为了进一步推进正在进行的宪法政治进程”。


    加拿大在绑架和政变中发挥了作用。特种任务第2队（JTF2）指挥官接管了机场，美国陆战队将阿里斯蒂德推送上飞机。据法新社（AFP）报道，“约30名加拿大特种部队在周日（2月29日）控制了机场，两名狙击手在控制塔顶部就位。”据报道，这支精英部队的成员提前四五天已抵达奥普朗斯，表面上是为了保护加拿大大使馆并“确保首都关键地点的安全”。根据军方对“主要行动”（Operation
    PRINCIPAL）的描述，在政变发生的一周内，“超过100名加拿大军队人员和CC-130大力直升士运输机……协助了应急预案计划和安全措施”。


    加拿大与法国、智利共同提供了随后由美国领导并经联合国批准的跨国临时部队（MIF）。作为该部队的一部分，500名加拿大士兵在奥普朗斯的街道上巡逻。


    一个由法国、加拿大和美国组成的“智者”小组任命了临时政府。这个“非法”临时政府由热尔德·拉托图于（Gérard Latortue）领导，他是一个来自佛罗里达的人，已经离开海地十五年了。


    拉托图于开始拆解阿里斯蒂德第二个任期内建立的规模的社会计划以及1994–2004年民主时期的许多成就。对贫困农民的补贴被削减，一项成人识字计划被拆除，最低工资被降低。扭转普雷瓦尔（Prévail）政府实施的有限土地改革，阿尔蒂博尼特（Artibonite）的数千农民被当地地主赶出土地，他们雇用的暴徒有时得到了警察的支持。临时政权为大企业提供了三年的免税期。


    拉托图于取消了阿里斯蒂德政府强迫法国偿还从海地勒索的独立赎金的运动。这位事实部长告诉路透社，“（这项债务偿还）主张是非法的、荒谬的，完全是出于政治原因提出的……这个问题已经结束了。我们现在需要加强与法国的合作。”然而，在他就职之前，拉托图于告诉《迈阿密卫报》，法国偿还债务是“道德和政治上负责任的做法”。


    “一个海地总统要求赔偿的结果以流亡告终，”2022年5月的《纽约时报》头版如此宣布。为了巩固关于政变的历史叙事，法国大使蒂埃里·布尔哈德（Thierry Burkhard）承认，阿里斯蒂德要求偿还海地超过210亿美元债务（赎金）的立场部分解释了为什么他在2004年被赶下。布尔哈德告诉《纽约时报》，当选总统的撤职是一场“政变”，“可能部分是因为”阿里斯蒂德要求法国偿还海地的运动。


    在《无力者：加拿大在拆解海地和美洲民主中的作用》一书中，时国防部长大卫·普拉特（David Pratt）说，“加拿大、美国和法国在解除[阿里斯蒂德]权力方面做了必要的努力。”在2022年的纪录片中，普拉特声称海地最受欢迎的政治家被赶下是因为他变成了一个负责“滥用权力”的“大人物”领袖。但加拿大在推翻阿里斯蒂德和其他数千其他当选官员的盟友，是监督着深度不平等的种族资本主义的浅肤寡头，以及拥有臭名历史的雇佣兵。加拿大在此期间在海地的作用是帮助拆解当选的社会经济变革力量，并重建一个暴力反对贫困多数人要求的压迫性右翼国家机器。


    # 荒诞剧


    海地


    他处于战争之中

    他的面具

    依然完好无损


    对于首相来说

    这就是荒诞剧


    在舞台上他是

    山姆叔的

    替身


    他发誓这

    只是个玩笑

    一个小恶作剧


    他是

    黑脸艺术的

    大师


