    In the lead up to Zelaya’s ouster, the Harper government displayed a clear attitude
    towards the elected president. With political tensions increasing in Honduras,
    two days before the coup the Organization of American States (OAS) passed a resolution
    supporting democracy and the rule of law in the country. Ottawa’s representative
    at the meeting remained silent. Early in June, Kent criticized Zelaya saying,
    “we have concerns with the government of Honduras.”2 Ottawa opposed Zelaya’s plan
    for a non-binding public poll on whether to hold consultations to reopen the constitution,
    which was written by a military government. Parroting the baseless accusations
    of the Honduran oligarchy, Kent said: “There are elections coming up this year
    and we are watching very carefully the behaviour of the government and what seems
    to be an attempt to amend the constitution to allow consecutive presidencies.”


    A businessman and Liberal Party member, Zelaya was not a political outsider or
    a revolutionary leftist. But, to the chagrin of officials in Washington and Ottawa,
    he increasingly aligned with the left-wing governments that came to power across
    Latin America in the early 2000s, particularly Hugo Chávez’s Venezuela. He also
    expressed a willingness to make concessions to Honduras’ increasingly organized
    social movements, which angered the entrenched oligarchy. Zelaya made more accessible,
    strengthened environmental protections, and increased the minimum wage substantially.
    He also announced plans to convene a constituent assembly to rewrite the dictatorship-era
    constitution.


    In addition to these measures, Zelaya implemented a moratorium on new mining concessions.
    This fact likely perturbed the Canadian government, given that, in the words of
    one Latin American official, “As far as I can tell, the Canadian ambassador here
    is a representative for Canadian mining companies,” which dominated the sector.3
    Following the coup, the moratorium was lifted, and Canadian companies pounced
    on the new business opportunities.


    A week after the coup, Zelaya tried to return to Honduras along with three Latin
    American heads of state. The military blocked his plane from landing and kept
    100,000 plus supporters at bay. In doing so, the military killed two protesters
    and wounded at least 30. On CTV, Kent blamed Zelaya for the violence.4


    Just before the elected president to fly into Tegucigalpa, Kent told the OAS “time
    is not right” for a return, prompting Zelaya to respond dryly: “I could delay
    until January 27 [2010],” when his term ended.5 Two weeks after the air route,
    Zelaya attempted to cross into Honduras by land from Nicaragua. Kent once again
    criticized this move. “Canada’s Kent Says Zelaya Should Wait Before Return to
    Honduras,” read a July 20 Bloomberg headline. A July 25 right-wing Honduran newspaper
    blared: “Canada pide a Zelaya no entrar al pais hasta un acuerdo” (Canada asks
    Zelaya not to enter the country until there’s a negotiated solution).6


    Despite the coup and the repression that followed, Ottawa refused to exclude Honduras
    from its Military Training Assistance Program. Though only five Honduran troops
    were being trained in Canada, failing to suspend relations with a military responsible
    for overthrowing an elected government was highly symbolic. More significantly,
    Canada was the only major donor to Honduras—the largest recipient of Canadian
    assistance in Central America—that failed to sever any aid to the military government.
    The World Bank, European Union, and the US suspended some of their planned assistance
    to Honduras.


    In response to the conflicting signals from North American leaders, the ousted
    Honduran foreign minister told Telesur that Ottawa and Washington were providing
    “oxygen” to the military government.7 Patricia Rodas called Canada and the US
    to suspend aid to the facto regime. During an official visit to Mexico with Zelaya,
    Rodas asked Mexican president Felipe Calderón, who was about to meet Harper and
    President Obama, to lobby Ottawa and Washington on their behalf. “We are asking
    [Calderón] to be an intermediary for our people with the powerful countries of
    the world,” said Rodas, “for example, the US and at this moment Canada, which
    have lines of military and economic support with Honduras.”8


    Five months after Zelaya was ousted, the coup government had previously scheduled
    elections. During the campaign period, the de facto government imposed martial
    law and censored media outlets. Dozens of candidates withdrew from local and national
    races and opposition presidential candidate, Carlos H. Reyes, was hospitalized
    following a severe beating by security forces. A protest in Tegucigalpa on election-day
    was forcefully repressed. Hondurans voted in a “climate of harassment, violence,
    and violation of the rights to freedom of expression, association and assembly,”
    according to the Washington-based Center for Justice and International Law.9


    The November 2009 election was boycotted by the UN and OAS and most Hondurans
    despite mandatory voting regulations, only 45% of those eligible cast a ballot
    (it may have been much lower as this was the government’s accounting). Ottawa
    endorsed this electoral farce. “Canada praised the Honduran people for the relatively
    peaceful and orderly manner in which the country’s elections were conducted,”
    noted an official statement.10 Peter Kent went boldly proclaiming, “there was
    a strong turnout for the elections, that they appear to have run freely and fairly,
    and that there was no major violence.”


    While most countries in the region continued to shun post-coup Honduras, Ottawa
    immediately recognized Porfirio Lobo after he was inaugurated as Honduran president
    on January 27, 2010. Kent stated, “Canada congratulates President Lobo as he begins
    his term. I am confident that he will provide the strong political leadership
    needed to help Honduras move beyond its lengthy political impasse.”11 Kent said
    that Lobo’s election constituted “the beginning of a process of renewal.” He remained
    silent on the growing number of prominent social activists, including LGBTQ activist
    Walter Tróché, who was kidnapped, beaten, and murdered by men in police uniforms
    just a few weeks before the inauguration.


    Ottawa supported Honduras’ re-entry into the OAS, which was opposed by most members
    states. During a March 2012 visit, Canada’s minister of state Diane Abloncy called
    Honduras an “important” partner in the Americas.


    Overall, the Canada-backed coup sparked a major surge in grassroots political
    activism. Hondurans mobilized in support of Zelaya and against the illegitimate
    government. Protestors also called for more fundamental reforms to their highly
    unequal society, beginning with a constituent assembly to rewrite the country’s
    constitution.


    The de-facto government and elite sectors responded with repression. Amnesty International
    described “the damage to human rights protection and the rule of law that followed
    the 2009 coup.” In the two years after Zelaya’s overthrow, hundreds were killed
    in political violence and many more attacked or injured. In May 2012 Reporters
    Without Borders noted, “His[Erick Avila’s] death brings to 19 the number of journalists
    who were supporters of former president Manuel Zelaya, who have been killed since
    his overthrow in a coup three years ago next month.” None of the murders had been
    solved.


    Ottawa stayed silent on the detention, torture, and murder of anti-coup activists.
    During an August 2011 visit to Honduras, Harper said Canada had “no information
    to suggest that [human rights abuses] are in any way perpetrated by the government.”
    Deciding this wasn’t a sufficient endorsement of the regime’s human rights record,
    the prime minister called Lobo “a prominent human rights leader in this country.”
    Prior to his role in state-backed repression and his victory in a dubious presidential
    election, Lobo attended business school in Miami, oversaw his wealthy family’s
    cattle ranches and was a member of Congress who insisted on reintroducing the
    death penalty.


    During the prime minister’s visit, the two countries signed a free trade accord.
    In the midst of significant state-backed repression, the Conservatives gave the
    regime a boost of legitimacy by commencing bilateral trade negotiations with the
    Lobo administration in October 2010. Before the coup, Ottawa was negotiating a
    joint Central American trade accord with Honduras, Guatemala, El Salvador, and
    Nicaragua, but the Conservatives dropped these plans when they found Lobo more
    accepting.


