    In April 1992, Canada refused to condemn Peruvian president Alberto Fujimori’s
    coup against Peru’s elected congress, sometimes dubbed “autogolpe” or “self-coup.”
    The coup was a way for Fujimori to push through neoliberal economic reforms and
    empower the military, police, and National Intelligence Service (SIN).


    On April 5, the Peruvian military took control of “Lima’s streets, the Congress,
    and the Palace of Justice, and radio stations, newspaper and magazine offices,
    and some party and union headquarters.” Fujimori then broadcast to the nation
    that the military coup was required to replace the “chaos and corruption” and
    the “existing institutional order,” which had been rendered dysfunctional by “party
    elites.”1


    Fujimori organized the coup with Vladimiriro Montesinos, his SIN chief and a long-time
    CIA contact, and elements within the military that supported a Pinochet-style
    regime. After the coup, Fujimori granted greater impunity to Peruvian soldiers
    combating rural guerrillas, which led to a huge increase in sexual violence by
    state forces.2


    Fujimori had tacit or overt support from much of the military and business sectors
    and from Washington. Overall, economic elites in Peru “expressed overwhelming
    support for Fujimori’s actions after the coup,” and “[several business association
    leaders attended the swearing-in ceremony for the new cabinet” the day after the
    coup.34 a coup that granted Fujimori “complete dictatorial powers,” Washington
    and the'
  - '[PAGE 73]


    OAS publicly urged the president to restore representative democracy. But this
    was a formality since they took no other action.


    Canada, meanwhile, did not issue a clear-cut statement of condemnation. On April
    6, Bill Fairbairn of the Inter-Church Committee on Human Rights in Latin America
    sent a letter to external secretary Barbara McDougal calling on Ottawa to condemn
    Fujimori’s actions. On April 7, McDougal released a statement noting “concern”
    about the events in Peru.


    That dissent was perceived as Peru became one of Canada’s closest partners on
    the continent. In collaboration with the World Bank, Fujimori instituted a structural
    reform program that opened huge areas of Peruvian natural resources to foreign
    companies. “In 1991,” writes José De Echave, “registered mining holdings covered
    2,258,000 hectares; in 1997—a peak year—they reached 15,597,000 hectares.”5 During
    the early 1990s Canadian mining holdings in Peru grew from three to 98 properties.6


    When the leftist Túpac Amaru guerrilla group took dozens of foreign diplomats
    hostage at the Japanese Embassy in Lima in 1996, Canadian JTF2 special forces
    reportedly participated in the US-led rescue effort. It left all fourteen guerrillas
    dead, including many of them reportedly executed.


    In 1998, Fujimori came to Canada on a four-day visit “aimed at boosting trade
    relations between Canada and Peru.” Activists and human rights groups urged prime
    minister Jean Chrétien to speak out about Fujimori’s abuses, but Chrétien refused
    to do so. Instead, he stood next to Fujimori at a joint press conference, assured
    the press they had “already discussed the issue,” and allowed Fujimori to make
    the outlandish claim that “fortunately we have arrived to the point (in Peru)
    where human rights are respected.”7'
  - '[PAGE 74]


    After ten years Fujimori stepped down in 2000 following an election that was so
    blatantly rigged he lost US and OAS support. When US and Canadian officials shunned
    Fujimori’s third inauguration ceremony, his days were numbered and months later
    he agreed to a transition of power.


    Much of the economic foundations of Canada’s modern investments in Peru were laid
    in the aftermath of Fujimori’s 1992 coup d’état.


