    # BRAZIL, 1964


    In 1964, Brazil’s military overthrew the country’s elected government headed by
    left-leaning president João Goulart. Having assumed power following the resignation
    of President Jânio Quadros in August 1961, Goulart sought to lift Brazil from
    political and socioeconomic crisis by implementing his Reform de Base (Basic Reforms)
    program, which included efforts to combat adult illiteracy, increase taxes on
    the profits of foreign-based companies, and a number of redistributive measures
    including land reform. Goulart also wanted to expand suffrage by giving illiterate
    people and low-ranking military officers the right to vote. He proposed putting
    15% of the national income into education. To pay for this, the government planned
    to introduce a proportional income tax and greater controls on the profit transfers
    of multinational corporations.


    Additionally, Goulart enacted an independent foreign policy. He affirmed Cuba’s
    right to self-determination while entertaining cordial relations with the Soviet
    Union and China. Goulart wanted Washington to be more flexible regarding the terms
    of its assistance and criticized the Kennedy administration’s Alliance for Progress,
    a development program aimed at promoting anti-communism in recipient nations.
    The Kennedy administration was angered at what it considered “an open declaration
    of war on the Alliance for Progress.”¹


    When Goulart threatened to increase Brazil’s economic cooperation with the Soviet
    Union, US ambassador Lincoln Gordon claimed he was threatening to create “a second
    Yugoslavia at best and a second Cuba at worst.” Gordon said Goulart’s threat “impressed
    me once again with'
  - '[PAGE 44]


    Goulart’s basic incapacity to be (the) president of (a) large country.”2 In the
    event that Goulart proceeded with his Reformas de Base model of development, the
    ambassador stated that “we must consider all possible means (for) promoting (a)
    change in regime.”3


    Washington, Ottawa, and leading segments of Brazil’s business community opposed
    Goulart’s foreign policy and Reformas de Base. Two and a half years into his presidency
    the Brazilian military and conservative political elements organized his ouster.


    When the coup came in April 1964, Washington backed it fully. At one point, President
    Lyndon Johnson urged ambassador Gordon to take “every step that we can” to support
    Goulart’s removal. In a declassified cable between Gordon and Washington, the
    ambassador in Brasília acknowledged US involvement in “covert support for pro-democracy
    street rallies … and encouragement [of] democratic and anti-communist sentiment
    in Congress, armed forces, friendly leader and student groups, church, and business.”4


    Ottawa failed to publicly condemn the ouster of Goulart. “The Canadian reaction
    to the military coup of 1964 was careful, polite and allied with American rhetoric,”
    notes Barbosa in Brazil and Canada in the Americas.5


    As important as following Washington’s tacit support for the coup was also driven
    by Canadian corporate interests. The Toronto-based firm Brascan (formerly Brazilian
    Traction) was active in Brazil at the time. Commonly known as the “Canadian octopus”
    because its tentacles reached into so many areas of Brazil’s economy, Brascan
    was among the largest companies in Latin America at the time. A study of the firm
    noted, “[Brazilian Traction president Antonio] Gallotti doesn’t hide his participation
    in the moves and operations that led to the coup d’état against Goulart in 1964.”6
    Just before the coup, Brazilian Traction president Grant Glassco remarked, “more
    and'
  - '[PAGE 45]


    more, the various agencies of the government infiltrated by extremists, many of
    whom were Communist inspired and directed.”7 After Goulart was overthrown, Glassco
    stated “the new government of Brazil is ... made up of men of proven competence
    and integrity. The President, Humberto Castelo Branco, commands the respect of
    the entire nation.”8


    Putting a stop to the Goulart government, which made it more difficult for companies
    to export profits, was good business.9 After the 1964 coup, the Financial Post
    noted “the price of Brazilian Traction common shares almost doubled overnight
    with the change of government from an April 1 low of $1.95 to an April 3 high
    of $3.06.”10 Between 1965 and 1974, Brascan drained Brazil of $342 million ($2
    billion today).11 When Brascan’s Canadian president, Robert Winters, was asked
    why the company’s profits grew so rapidly in the late 1960s his response was simple:
    “The Revolution.”12


    Before he took charge of Brascan, Winters was Canada’s trade minister. Similarly,
    Jack Nicholson, a Brazilian Traction chief executive in Brazil in the 1950s, held
    a number of cabinet positions in the Pearson government.13 Long-time Liberal servant,
    Mitchell Sharp, went from deputy minister in the Department of Trade and Commerce
    to vice-president of Brascan. A year before the coup, Pearson appointed him finance
    minister.


    The coup against Goulart brought to power a military dictatorship that ruled Brazil
    for over two decades. The regime served as a counter-revolutionary bastion for
    neighbouring right-wing dictatorships, and it received the support of Washington,
    Ottawa, and their allies including Pinochet’s Chile and Israel.


