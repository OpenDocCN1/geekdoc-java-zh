    # 多米尼加共和国，1963年


    在1962年底，左翼分子胡安·博什以59%的得票赢得了多米尼加共和国的首次清洁选举。博什最初得到了美国政府的支持，被视为一名改革者，能够调和日益令人尴尬的拉斐尔·特鲁霍约独裁的过度行为，但事实证明他并非华盛顿所希望的那个软弱政治人物。在特鲁霍约家族统治三十年后，博什通过培训合作社、工会和农民领袖来鼓励公民社会。这位多米尼加总统还致力于拆分该国的一些大型种植园，并推动了扩大工人、妇女和儿童权利的宪法改革。这些行动并没有赢得右翼教会机构或在特鲁霍约时期积累巨额财富的经济精英的欢迎。华盛顿也不高兴，因为他们在博什温和但重要的报告中看到了“另一个古巴”。


    在执职几个月后，博什在工业家、大地主和教会的支持下在一场军事政变中被流逐。在华盛顿的支持下，选举政府被一个三人军事军团取代。美国参议员J·W·富尔布莱特表示，“美国对圣多马明的社会革命背过身，并与一个腐败和反动的军事寡头集团结盟。”1
    博什本人后来写道，“人口中影响最大的阶层[中产阶级]与政治领袖一起…………击败民主政府的阴谋。”2 对政变政权日益的不满引发了一场由“宪政派”力量领导的、要求恢复博什职位的军事反叛。在政变政权成功下台后，美国实施了干预。1965年4月底，林登·B·约翰逊政府向多米尼加共和国派遣了超过2万名美国士兵，这几乎是当时在越南美军人数的一半。3
    约翰逊将受古巴培训的共产主义特工指为反对非选举军事政权的起义。1965年5月2日，总统声称“共产主义领袖（其中许多人在古巴接受过训练）看到增加混乱、获得立足点，加入了革命。他们获取了越来越多的控制权。而最初是一场大众民主革命……很快就被转移、接管并真正夺取，落入一群共产主义阴谋者手中。”4
    因此，他认为，美国必须入侵以保护“进步、民主……社会正义[以及]美洲体系的原则。”5


    尽管将入侵吹嘘为保护“美洲体系”的必要措施，但约翰逊似乎并不在意军事干预违反了美洲组织（OAS）宪章的事实。美国政府未能事先通知拉美成员国入侵，这“公然违反了美洲组织宪章第15条和第17条。”6


    作为入侵的回应，首相B·皮尔森对议会说：“美国政府干预多米尼加共和国是为了保护其自身公民和其他国家的公民。”7 当被问及“美国是否有权通过登陆陆战队来侵犯多米尼加共和国的主权权利”时，皮尔森说：“我认为国际法中众所周知——事实上在美洲组织也是被接受的——在叛乱和动荡的情况下，当这些公民处于危险之中且法律秩序似乎暂时消失时，政府有责任保护其本国人民。”8
    外长保罗·马丁老士也为约翰逊政府辩护，指出：“在公民面临危险且法律秩序似乎暂时消失的情况下，政府有责任保护其本国人民。……这种批评必须针对我们国际安排的缺陷。”9
    在清楚华盛顿并非仅仅是在保护美国平民后，政府仍继续捍护美国的行动。美军部署部队三周后，一名新民主党（NDP）议员提到了“美国对共和国的入侵”，导致外交部长马丁对这种“在拉美和多米尼加共和国的利益”表示不满。10
    渥太华拒绝了“宪政派”将军弗朗西斯科·卡马诺在博什回归前提出的外交承认请求。在解释这一决定时，皮尔森对议会说，“那里确实有控制那个特定集团的共产主义者。”11
    当在加勒比地区的加拿大战争是为了“以备不时之”时，少数拉美国家派遣了士兵参加旨在让美军离开的美洲组织任务。12 5月28日，皮尔森对众表示：“我相信我们都希望看到这支（美洲组织）力量成功为多米尼加共和国带来和平与稳定。”13
    入侵一年后，美国举行“演示性选举”，由前特鲁霍约官员华奎金·巴拉格尔赢得。皮尔森政府通过对拉美国家提供的首次双边援助之一支持了巴拉格尔。1966年，加拿大向多米尼加共和国提供了29.8万美元的食品援助，作为对1965年军事入侵该国的“后续行动”。14
    在巴拉格尔确立国家元首地位后，皮尔森指示加拿大官员不要公开批评美国的多米尼加政策。15


    渥太华支持美国入侵，部分是出于对在该投资的担忧，其中包括矿业巨头富鲁桥，该公司在特鲁霍约独裁后期曾与其合作。在博什于1963年被军事力量清除后，保罗·马丁老士对议会说：“我们……一直在与富鲁桥镍厂保持电话……并被告知一切安好。”16
    随后他表示，“大使馆也在调查有关皇家银行分行遭到抢劫的报告。”17 对加拿大资产的担忧是由投资规模驱动的。此时，加拿大银行利益持有多米尼加共和国外资银行资产的近70%。18
    富鲁桥在多米尼加的利益同样不小，美国干预对生意是有利的。


    入侵后一年，富鲁桥将其在该国的实验性试点工厂规模扩大了四倍。20世纪70年代，《金融时代》的约翰·哈伯报道道，Falondo（富鲁桥多米尼加业务机构）的首席执行官伊恩·基思“已成为多米尼加公共生活的亲密的一部分，正如那些新兴的多米尼加公私企业总裁和经理的精英阶层一样，他们正在吸收Falondo的模式。”19
