    independence, cease the harassment of opposition voices, and to conduct an election
    that is indeed free and fair.”8 Harper pressed the monitors to raise their voice,
    stating, “never forget, that the vigilant watcher can hold rulers to account,
    that the one who sees and speaks up is truly the guardian of liberty.”


    Further encouraging opposition to the government, citizenship, immigration and
    multicultural minister Jason Kenney announced funding for a project “to strengthen
    freedom of expression, freedom of information and free media in Ukraine.”9 Launched
    during a March 2013 visit, the initiative was designed to boost antigovernment
    forces.


    Ottawa helped encourage the Maidan protests by breathlessly criticizing the Yanukovych
    government. It is quite clear if Yanukovych’s main competitor in the 2010 election,
    Yulia Tymoshenko, had won and committed five times more rights violations, she
    would have received far less criticism.


    The overthrow of Yanukovych in the 2014 Maidan protests, which led to his unconstitutional
    replacement by a Washington-selected government, amounted to what Guardian columnist
    Seumas Milne called “the imposition of a pro-western government on Russia’s most
    neuralgic and politically divided neighbor.”10 The effects of this intervention,
    Milne predicted in April 2014, would be “The US and EU have already overplayed
    their hand in Ukraine. Neither Russia nor the western powers may want to intervene
    directly...but a century after 1914, the risk of unintended consequences would
    be obvious—as the threat of a return of big-power conflict grows. Pressure for
    a negotiated end to the crisis is essential.”11


    Ottawa and the Ukrainian Canadian Congress began assisting nationalist, anti-Russian,
    Ukrainians prior to the USSR breakup in 1991.12 Through the 1990s, Canada played
    an outsized role in shaping the newly independent nation’s politics. Canada was
    the first country after Poland to recognize Ukraine’s independence and the first
    western country to offer credit. Canadians helped draft the country’s inaugural
    constitution and many Canadian advisers, generally from the Ukrainian community,
    were assigned to positions within Ukrainian ministries and agencies. Even the
    currency used after independence was printed in Canada.


    In the lead up to the 2004 Orange Revolution, Canada funnelled hundreds of thousands
    of dollars to the groups that protested against a close presidential election
    in which Yanukovych was initially declared victor. The lead group behind the organization
    of the Orange Revolution, Pora, received US$30,000 from the Canadian Embassy,
    which was its first donation. Canadian ambassador Andrew Robinson, reported the
    Globe and Mail, “organized secret meetings of western ambassadors” to support
    Yanukovych’s rival Viktor Yuschenko. In 2004 protests and subsequent election
    redo deepened the country’s geographical and linguistic divisions.


    In the two decades before the Maidan uprising, Canada channelled tens, hundreds,
    of millions of dollars to anti-Russian elements of Ukrainian civil society.13
    During a July 2007 visit to Ukraine, foreign minister Peter MacKay announced $16
    million in assistance for democratic reform to “counterbalance” Russia. “There
    are outside pressures, from Russia most notably,” noted MacKay. “We want to make
    sure they feel the support is there for them in the international community.”
    In 2013, US assistant secretary of state Victoria Nuland boasted the National
    Endowment for Democracy (NED), USAID, and other US government agencies had plowed
    $5 billion into bolstering Western-oriented forces in Ukraine since 1991.14 In
    a sign of Ottawa’s close ties to opposition activists, throughout the Maidan protests
    the Canadian Embassy’s local spokesperson, Inna Tsarkova, was a prominent member
    of AutoMaidan, an anti-government group that organized protests in front of Yanukovych’s
    residence calling for the president to go.15 As the embassy’s Program Officer,
    Tsarkova had previously led sessions acquiring Canadian funding.16 Two months
    into the Maidan protests, Tsarkova’s car was set ablaze. In an interview with
    a Ukrainian Canadian radio program two days after the long-time employee at the
    Canadian Embassy said, “if we don’t stand up enough then you know it means the
    end of Ukraine in terms of democracy and real freedoms. It will be the Soviet
    empire back in the 1930s when people were just thrown into prison and killed.”17


    The Maidan protests were sparked by Yanukovych stalling on the European Union–Ukraine
    Association Agreement. The free accord was a step forward in the process of the
    country potentially joining the EU, which was attractive to many Ukrainians, especially
    in the west and centre of the country. However, the agreement was more divisive
    than portrayed by Canadian media and officials. Ukraine, with the second largest
    landmass in Europe, for instance, Lviv is the closest to Prague, Vienna and Berlin
    than the eastern Ukrainian city of Kharkiv, which is near Russia. Additionally,
    eastern and southern Ukraine was part of the Russian empire for two centuries,
    while modern Ukraine’s west was once part of the Polish-Lithuanian and Austro-Hungarian
    empires and was known as Galicia.


    Joining the EU was viewed favourably by many Ukrainians, but the Association Agreement
    had costs as well. The EU deal would not only undercut trade with Russia; it also
    depended on Kyiv agreeing to the International Monetary Fund’s demand for “extremely
    harsh conditions” on eliminating energy subsidies and other government supports.18


    Amidst the negotiations over the Association Agreement, Moscow offered $10 billion
    in benefits to Ukraine and called for tripartite (EU, Russia, and Ukraine) negotiations
    to work out various trade and economic issues. The EU rejected negotiations. The
    president of the European Commission, José Manuel Barroso, said explicitly that
    Kyiv had to choose between the EU Association Agreement and a consensus with Russia.
    The EU’s take-it-or-leave position exacerbated deep geographical and linguistic
    divisions within Ukraine.


    When the anti-Yanukovych uprisings began in late 2013, Canada supported the three-month-long
    protests. The Canadian Embassy was a safe haven from November 21, 2013, to February
    22, 2014. A little over into the protests, Canada released a statement critical
    of government repression, which University of Ottawa professor Ivan Katchanovovski
    was precipitated by far-right infiltrators.19 In November 30, 2013 release “Canada
    Condemns Use of Force Against Protesters,” foreign minister John Baird declared,
    “Canada strongly condemns the deplorable use of force today.”20 Six days later,
    Baird visited Maidan square with Paul Brod, president of the ultrationalist UCC.21
    From the stage, Brod announced Baird’s presence and support for the protesters,
    which led many to chant “Thank you Canada.” In recognition of Canada’s important
    role, a Canadian flag flew at the Maidan.22 Baird also called on Ukrainian authorities
    to respect the protests and bemoaned“the shadow that Russia is casting over this
    country.”23


    On December 27, Canada’s chargé d’affaires visited protest leader and journalist
    Tetiana Chornolov in the hospital after she was violently attacked.24 Three weeks
    earlier, Chornolov was widely reported to have participated in seizing Kyiv City
    Hall.25 A member of a far-right party, Chornolov had previously been arrested
    on numerous occasions and was subsequently charged with murder for throwing a
    Molotov cocktail at the Party of Regions headquarters during the Maidan protests.


    Prime Minister Harper repeatedly expressed support for the protesters and criticized
    Yanukovych. On January 27, he slammed the Ukrainian president for “not moving
    towards a free and democratic future but very much towards an anti-democratic
    Soviet past.”26 The next day Ottawa announced travel restrictions and economic
    sanctions on individuals close to the elected president. At the press conference
    to announce the measures, Alexander said, “you [Yanukovych] are not welcome in
    Canada and we will continue to take action until the violence against the people
    of Ukraine has stopped and democracy has been restored.”27 Ottawa slapped travel
    bans and economic sanctions on dozens of individuals aligned with Yanukovych.


    At the height of the protests, activists used the Canadian Embassy, which was
    immediately adjacent to Maidan square, a safe haven for “at least a week.” The
    protesters gained access a mini-van and other Canadian material. In a story written
    a year after the coup, the Canadian Press quoted officials from allied European
    nations accusing Canada of being“an active participant in regime change.” In his
    investigation of Maidan activists’ use of the Canadian Embassy in Kyiv, Canadian
