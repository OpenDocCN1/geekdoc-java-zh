- md: "\n# INDONESIA, 1965\n\nIn a coordinated campaign to prevent the spread of leftism\
    \ in Asia, Western countries including the US, Britain, and Canada supported the\
    \ overthrow of Indonesia’s independence leader Sukarno in 1965 and the subsequent\
    \ murder of half a million suspected supporters.\n\nInitially, Canada backed Dutch\
    \ colonialism during the Indonesian war of independence. However, the Canadian\
    \ position took a turn in 1948 when Sukarno appeared to be a reliably pro-Western\
    \ and anti-communist leader. By the early 1960s, Canada’s attitude changed. Sukarno’s\
    \ willingness to recognize the legitimacy of the Indonesian Communist Party (PKI)\
    \ and other endogenous left-wing and progressive movements rocked the North American\
    \ and the European powers, as did his tendency to publicly criticize Western imperialism\
    \ in Asia and his leading role in the anti-colonial Non-Aligned Movement.\n\n\
    In a bid to maintain its influence in East Asia, mid-1961 London pushed to merge\
    \ its colonies of North Borneo, Sarawak, and Singapore with Malaya (technically\
    \ independent from England since 1957) to create Malaysia. Indonesia objected\
    \ to what it saw as a subservient Malaysian government’s willingness to extend\
    \ colonial authority on its border. Conflict between Indonesia and Malaysia escalated\
    \ into a low-level war.\n\nOttawa sided with the Malaysian leader Tunku. During\
    \ a visit to Ottawa by Tunku, prime minister Lester B. Pearson said “under his\
    \ leadership the peoples of Malaysia have been brought closer together in freedom,\
    \ democracy and greater human welfare” despite Indonesian “pressure dedicated\
    \ to their destruction.”1 In Fire and the Full Moon, David Webster notes, “Ottawa\
    \ avoided direct military involvement but was clearly a partisan and on the Malaysian\
    \ side.”2 In the midst of the conflict, Canada cut a small disbursement of food\
    \ aid to Indonesia while releasing $4 million ($28 million today) in military\
    \ aid to Malaysia.3 In response, Indonesian President Sukarno added to his list\
    \ of “imperialists with white skins,” which included the US, New Zealand, Australia,\
    \ and Britain.4 A nationalist Indonesian newspaper, Suluh, said Ottawa should\
    \ “go to hell.”5 \n\nAn External Affairs assessment of Indonesian foreign policy\
    \ during this period concluded that Sukarno wanted “an endless succession of foreign\
    \ adventures” to satisfy his “personal and national megalomania.”6 Canada’s ambassador\
    \ in Jakarta further explained: “He [Sukarno] wants revolutionary change in the\
    \ balance of economic power between the developed and less developed nations ...\
    \ We believe that under Sukarno Indonesia is already a lost cause as far as the\
    \ world is concerned.”7\n\nSukarno’s aggressive opposition to British policy in\
    \ Malaysia hastened a slow-moving US-backed military takeover, which included\
    \ the eventual slaughter of 500,000 “communists.” Enabled by external and internal\
    \ dynamics, Major General Suharto oversaw a wave of terror in late 1965 that left\
    \ hundreds of thousands of peasants and Communist members dead.8 Commander of\
    \ the Army Strategic Reserve, Suharto then overthrew democratically elected Sukarno.\
    \ In the lead-up to this bloody military coup, the US government authorized a\
    \ covert program in late 1964 to assist the “good men in the government, armed\
    \ services and the private sector” who might topple Sukarno if Washington supported\
    \ their efforts.9 Washington also worked to paint the PKI as an agent of China\
    \ and enemy of Indonesian nationalism.\n\nPearson’s government backed the Indonesian\
    \ general’s repressive political machinations. Even though he was aware of Suharto’s\
    \ killing, in early 1966 Canada’s ambassador in Jakarta called this mass murderer\
    \ “a moderate, sensible and progressive leader.”10 An External Affairs memorandum\
    \ explained: “Changes in the political orientation of Indonesia have already had\
    \ a profound effect on the prospects for stability in South East Asia. It is patently\
    \ in our interests that the new [Suharto] regime be able to consolidate its internal\
    \ position and pursue external policies it appears prepared to follow. These are\
    \ policies which promise to make the situation much easier not only for the smaller\
    \ countries of the area but for Australia, New Zealand, the UK and the USA.”11\n\
    \nOne of the most important actions implemented by the Suharto government following\
    \ the coup was the “Stabilization Plan.” The Stabilization Plan was a boon to\
    \ foreign investors, including companies headquartered in Canada. It established\
    \ “tax holidays, provisions for unrestricted repatriation of profits, exemptions\
    \ from import duties, and cutbacks in government participation in the economy.”12\
    \ Canadian companies Bata Shoes and International Nickel Company (INCO) benefitted.13\n\
    \nTo aid Suharto, Ottawa selected Indonesia as the main Asian country outside\
    \ of the Commonwealth to receive Canadian aid.14 Rain Dancing explains: “The domestic\
    \ stability achieved by Suharto after the ouster of Sukarno in 1966, together\
    \ with a pronounced tilt in foreign policy towards the West, made Indonesia an\
    \ attractive target in the eyes of [Canadian] policymakers.”15 Ottawa preferred\
    \ Suharto’s Western-trained technocrats to Sukarno’s anti-colonial nationalism.16\
    \ “Only with the removal of Sukarno from power,” notes Webster, “would the Government\
    \ of Canada smile on Indonesia again.”17\n\n- 1. David Webster, Fire and the Full\
