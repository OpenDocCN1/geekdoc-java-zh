    # VENEZELA, 2017 to the present


    Since 2017, the Trudeau government has engaged in a brazen effort to overthrow
    Venezuela’s government. In a bid to elicit “regime change,” Ottawa worked to isolate
    Caracas, imposed illegal sanctions, took the Maduro government to the International
    Criminal Court, financed an often-unsavoury opposition and a marginal right-wing
    opposition politician was the country’s legitimate president.


    Prior to the election of Hugo Chávez in 1999 and the advent of the socialist-oriented
    Bolivarian Revolution, Venezuela was governed by an unaccountable US-backed oil
    oligarchy that ignored the demands of the poor majority and repressed them when
    they attempted to rise and claim their rights, as evidenced by the 1989 Caracazo
    massacre.


    Chávez’s promise to redistribute Venezuela’s wealth while standing for his country’s
    national interests vis-à-vis the US made him a hero to the poor majority and enemy
    of Washington. Under Chávez, Venezuela helped launch regional organizations such
    as the Bolivarian Alliance for the Peoples of Our America (ALBA) and Union of
    South American Nations (UNASUR) and offered affordable energy to countries in
    the Caribbean through the Petrocaribe program.


    Chávez also forced multinational oil companies, which often paid little in royalties,
    to become minority partners with the state oil company PDVSA. This led ExxonMobil
    and Petro-Canada to abandon the country in 2007. Furthermore, Chávez’s push to
    increase the state’s role in gold extraction led to legal battles with Canadian
    mining companies such as Crystalex, Vannessa Ventures, Gold Reserve Inc., and
    Rusoro Mining. In 2007, Peter'
  - '[PAGE 153]


    Munk, the founder of Barrick Gold and one of Canada’s premier capitalists, wrote
    a letter to the Financial Times in which he called Chávez “dangerous dictator”
    and compared his actions to Pol Pot, Slobodan Milosevic, Robert Mugabe, and Adolf
    Hitler.


    In addition to forging a new, boldly assertive foreign policy, the Bolivarian
    Revolution empowered Venezuela’s poor and working class for nearly two decades.
    During its first fifteen years, substantial gains were made in public health,
    reducing illiteracy and lessening inequality. Even amidst a severe economic downturn,
    Nicolás Maduro’s government built three million units of social housing.


    The Chávez-led government/movement also massively increased democratic space through
    community councils, new political parties, grassroots media, and worker cooperatives.
    Between 1998 and 2018, the Bolivarian Revolution won nineteen elections. After
    almost every defeat, large swaths of the opposition fought and sought to oust
    the president through unconstitutional means. US and Canadian officials largely
    sided with the opposition.


    Taking advantage of Chávez’s death in 2013 and a huge drop in the price of oil,
    Washington labeled the South American country to threaten US “national security.”
    Donald Trump ramped up sanctions and repeatedly threatened to invade. Currently,
    the opposition attempted to assassinate Nicolás Maduro.


    A May 2018 presidential election demonstrated that Maduro and his PSUV party maintained
    considerable support. Even with the opposition boycott, the turnout was 40% and
    Maduro received a higher proportion of the overall vote than leaders in the US,
    Canada, and elsewhere. For instance, in 2019, Trudeau’s Liberals received 33%
    of the vote with 66% of'
  - '[PAGE 154]


    eligible voters casting their ballots, which amounted to 22% of the adult population.
    Maduro received 67% of votes cast with 41% of eligible voters participating, which
    equaled 27% of the population.


    Despite the complicated political situation, Canadian officials leveled over-the-top
    criticism against Venezuela’s government. Trudeau repeatedly called Maduro “brutal
    dictator” while foreign minister Chrystia Freeland said he was “robbing the Venezuelan
    people of their democratic rights.”7 Ottawa supported efforts to condemn Venezuela
    at the Organization of American States (OAS) and in 2018 requested the International
    Criminal Court (ICC) investigate the Maduro government. Supported by five like-minded
    South nations, it was the first time a member state was brought before the ICC’s
    chief prosecutor by other members.8 But, Ottawa stayed mum about far worse human
    rights violations in Mexico, Honduras, and Colombia.9


    Canada founded the anti-Maduro Lima Group coalition with Peru. Amidst discussions
    between the two countries’ foreign ministers in spring 2017, Trudeau called his
    Peruvian counterpart, Pedro Pablo Kuczynski, to “stress the need for dialogue
    and respect for the democratic rights of Venezuelan citizens, enshrined in the
    charter of the Organization of American States and the Inter-American Democratic
    Charter.”10 But the Lima Group was established in August 2017 as a structure outside
    of the OAS largely because that organization’s members refused to back Washington
    and Ottawa’s bid to interfere in Venezuelan affairs, which they believed defied
    the OAS’ charter.


    Canada was the most active member of the coalition of governments opposed to Venezuela’s
    elected government. Freeland participated in a half dozen meetings of the Lima
    Group and she repeatedly probed Caribbean and Central American countries to join
    the Lima'
  - '[PAGE 155]


    Group’s anti-Maduro efforts.11 The second Lima Group meeting, held in Toronto
    in October 2017, urged regional governments to take steps to “further isolate”
    Venezuela.12


    Canadian officials even backed talk of an invasion which other members opposed.
    Eleven of the fourteen members of the Lima Group backed a September 2018 statement
    distancing the alliance from “any type of order or declaration that implies military
    intervention” over OAS chief Luis Almagro: “As for military intervention to overthrow
    the Nicolas Maduro regime, I think we should not rule out any option… diplomacy
    remains the first option but we can’t exclude any action.”13 Canada, Guyana, and
    Colombia refused to criticize the head of the OAS’ musings about an invasion of
    Venezuela.


    Canadian diplomats played an important role in uniting large swaths of the Venezuelan
    opposition behind a US-backed plan to ratchet up tensions by proclaiming the new
    head of the opposition-dominated National Assembly, Juan Guaidó, president. The
    Canadian Press quoted a diplomat saying they helped Guaidó “facilitate conversations
    with people that were out of the country and inside the country,” while the Globe
    and Mail reported that “Freeland spoke with Juan Guaidó to congratulate him on
    unifying opposition forces in Venezuela, two weeks before he de himself himself
    interim president” in January 2019.14 Canadian diplomats spent “months,” reported
    the Canadian Press, coordinating the plan with the hard-line opposition. In a
    story titled “Anti-Maduro coalition grew from secret talks,” the Associated Press
    reported on Canada’s “key role” in building international diplomatic support for
    claiming a relatively marginal National Assembly member was Venezuela’s president.15
    Alongside Washington and a number of right-leaning Latin American governments,
    Ottawa immediately recognized Guaidó after he proclaimed himself president at
    a'
