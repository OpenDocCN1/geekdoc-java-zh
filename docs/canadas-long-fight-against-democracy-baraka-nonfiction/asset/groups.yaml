    # PARAGUAY, 2012


    In 2012, the de-left-leaning president of Paraguay, Fernando Lugo, was ousted
    in what some called an “institutional coup.” Upset with Lugo for disrupting sixty-one
    years of one-party rule by the conservative Colorado Party, Paraguay’s traditional
    ruling elite claimed he was responsible for a murky incident that left seventeen
    peasants and police dead and the senate voted to impeach the president.


    On June 15, 2012, 300 police officers descended on the town of Curuguay to evict
    70 landless farmers from their property. The land was state owned before military
    dictator Alfredo Stroessner, who ruled from 1954-1989, transferred ownership to
    a friend. The confrontation, whose exact details remained muddled, led to the
    death of eleven campesinos and six policemen. Right-wing forces in Congress used
    the killings as a pretext to impeach President Lugo, accusing the former bishop
    of aligning with the farmers.


    The vast majority of countries in the hemisphere refused to recognize the new
    government. The Union of South American Nations (UNASUR) suspended Paraguay’s
    membership after Lugo’s ouster, as did the MERCOSUR trading bloc. “Not a single
    Latin American government has recognized [Federico] Franco’s presidency,” reported
    the Council on Hemispheric Affairs. But Canada was only one of a handful of countries
    in the world that immediately recognized the new government. “Canada notes that
    Fernando Lugo has accepted the decision of the Paraguayan Senate to impeach him
    and that a new president, Federico Franco, has been sworn in,” said Diane Abloncy,
    minister of state for foreign affairs, the day after'
  - '[PAGE 117]


    the coup. This statement was premature. After a confusing initial statement, Lugo
    rejected his ouster and announced the creation of a parallel government.


    Lugo''s reformist program was a thorn in the side of the conservative establishment
    and powerful agribusiness. Paraguay is largely reliant on agricultural exports,
    particularly soy. But growing soy production, which requires large amounts of
    land, intensified displacement and the growth of landless farmers.


    Lugo''s agrarian populism and position as a political outsider struck a chord
    with the imperiled campesino population. But the state apparatus established during
    the long Colorado party rule prevented the “bishop of the poor’s” attempts at
    reform. Lugo’s struggle to impose a five-percent tax on soy exports was suppressed
    and powerful farming corporations launched protests that forced him to reverse
    an executive order to limit the use of pesticides.


    The swift politicization of the Curuguay massacre by the right-wing establishment,
    coupled with numerous discrepancies in the official investigation and the murder
    of a key peasant witness shortly before testifying, led many progressives to believe
    the incident may have been manufactured to remove the would-be reformer from the
    presidency. Whether or not this is true, the judiciary immediately blamed the
    peasants for the incident and persecuted them at the expense of an open inquiry
    into the police’s actions. The coup was integral to returning the Colorado Party,
    which expanded rules on genetically modified seeds, rejected calls to raise taxes
    on soy exports and accelerated agricultural consolidation.


    A week after the coup against Lugo, Ottawa participated in an Organization of
    American States (OAS) mission that many member countries opposed. Largely designed
    to undermine the countries calling for'
- md: '

    Paraguay’s suspension from the OAS, delegates from the US, Canada, Haiti, Honduras,
    and Mexico travelled to Paraguay to investigate Lugo’s removal from office. Minister
    of state of foreign affairs Diane Ablonczy said the aim of the OAS mission was
    to “provide important context from Paraguay to inform international reaction.
    It is important that we avoid a rush to judgment and focus on the best interests
    of the Paraguayan people.” The delegation concluded that the OAS should not suspend
    Paraguay, which displeased many South American countries.


    In an interview three weeks after his ousted, Lugo alluded to Ottawa’s hostility
    toward Paraguay’s efforts at regional cooperation with other Latin American states.
    “With the current polarization between the United States, Canada, and Mexico on
    one end and South America on the other, we have tried to find regional alternatives.
    The coup d’état made many attempts to attack the [South American] regional integration
    efforts. Both the Canadian Labour Congress and the newly formed international
    labour federation IndustriALL Global Union criticized the Conservatives move to
    recognize the new government.


    In addition to agricultural exports, Paraguay relies on the mining sector, in
    which Canadian companies have some noteworthy investments. On a couple of occasions,
    the overthrown president claimed Canadian economic interests in this industry
    contributed to the coup. “Those who pushed for the coup are those who want to
    solidify the negotiations with the multinational Rio Tinto Alcan, betraying the
    energetic sovereignty and interests of our country,” Lugo told his supporters
    one month after the coup. IndustriALL Global Union concurred with the president,
    sending a letter to the CEO of Rio Tinto. “Rio Tinto, which has a legendary association
    with the government of Canada, has been quick off the mark to resume negotiations
    on behalf of Montréal-based Rio Tinto Alcan for a $4 billion aluminum plant,”
    wrote Jyrki Raina, general secretary of IndustriALL Global Union. The labour federation
    called on “Rio Tinto to publicly disclose its interest and involvement, if any,
    in the coup d’état in Paraguay and the ousting of a legitimately elected democratic
    government of Fernando Lugo.”


    In 2010, Montréal-based Rio Tinto Alcan, a subsidiary of Rio Tinto, began lobbying
    the Paraguayan government for subsidized electricity to set up a massive aluminum
    plant near the Paraná River. The company was seeking a thirty-year contract that
    could cost Paraguay’s government hundreds of millions of dollars and they received
    Ottawa’s backing. According to international media reports, the Canadian Embassy
    in Buenos Aires, which is in charge of the country’s diplomatic relations in Paraguay,
    lobbied the government on Rio Tinto Alcan’s behalf. The Lugo government was divided
    over the project, which would consume more energy than the country’s entire 6.5
    million population and damage the environment in various other ways. Three weeks
    before Lugo’s vice president Federico Franco, who represented the opposition party,
    complained to Ultima Hora newspaper: “I told the President of the Republic (Lugo):
    why did you send me to Canada to study the [aluminum] project if, finally, a Deputy
    Minister (Mercedes Canese) was going to oppose it.”


    After the coup, the vice president became president and announced that negotiations
    with Rio Tinto Alcan would be fast tracked. Since then, neoliberalism and Colorado
    Party domination have remained steadfast in Paraguay.


    # UKRAINE, 2014


    Between 2010 and 2014, Canada waged a campaign to subvert a Ukrainian president
    who won elections the Organization for Security and Co-operation in Europe called
    “an impressive display of democracy.”1 This electoral interference played out
    in a context of intensity and sometimes violent rivalry between two political
    camps, one in Ukraine’s west aligned with Western Europe and North America, and
    another in Ukraine’s east, which leaned towards Russia.


    The 2010 Ukrainian presidential election and 2012 parliamentary elections were
    won by Viktor Yanukovych and his Party of Regions. His victory was won by votes
    from the largely Russian-speaking regions in the east and south of Ukraine. Ottawa
    sent observers to monitor these elections. Following his victory, Yanukovych passed
    legislation codifying Ukrainian neutrality in the geopolitical confrontation between
    NATO and Russia, which increasingly played out in Ukraine. This move was not welcomed
    by Ottawa, a staunch proponent of expanding NATO eastward, into Ukraine.


    Ottawa has sought to destabilize the relationship between Russia and Ukraine since
    the early days of the USSR. In 1940, for example, the federal government helped
    establish the nationalist and anti-Soviet Ukrainian Canadian Congress. In 1952,
    External Affairs launched a Ukrainian section of Radio Canada International to
    disseminate an anti-Soviet perspective. Additionally, Canada accepted thousands
    of Ukrainian Nazi collaborators who fled Europe after World War II.2 The right-wing
    historical narrative passed down for generations by some of these diaspora groups
    is evidenced by numerous monuments glorifying Nazi collaborators, including a
    cenotaph honouring the Ukrainian Galician Division of the Waffen-SS in the St.
    Volodymyr Ukrainian Cemetery in Oakville, Ontario.


    The affinity between the Canadian state and Ukrainian nationalists persisted well
    into the twenty-first century. One of the most well-known examples of this alliance
    can be found in the personal history of deputy prime minister Chrysta Freeland,
    whose grandfather Mikhailo Chomiak was a Ukrainian Nazi propagandist during WWII.
    Chomiak produced a Nazi newspaper from an apartment that had belonged to Jews
    to concentration camps. After the war, he emigrated to Canada, and alongside his
    granddaughter Chrysta, worked on The Encyclopedia of Ukraine, an academic project
    “which took a hardline, far-right, and anti-Soviet position in his historical
    narrative.”3


    Yanukovich sought a middle ground between Russia and the West. In response, Ottawa
    immediately worked to undermine his government. Months after Yanukovich became
    president, Prime Minister Harper declared, “there are issues of concern to Ukrainian-Canadians
    and to the government of Canada involving issues of human rights and the rule
    of law, and I’ll be raising these with President Yanukovich.”4 Ukrainian Canadian
    Congress (UCC) head Paul Grod and other representatives of the ultrationalist
    organization accompanied the prime minister during his October 2010 visit to Ukraine.
    In announcing their participation, the UCC release claimed, “recent steps taken
    by Ukraine’s political leadership have seriously undermined the country’s constitution,
    its democratic institutions, the protection of its historical memory and national
    identity, sovereignty and territorial integrity.”5


    During the trip, Stephen Harper met opposition leaders, including failed presidential
    candidate Yulia Tymoshenko. In Lviv, Harper visited a controversial new nationalist
    museum and met its director, who had recently been accused of passing classified
    information to third parties. Talking to journalists about Ukraine’s 1932 famine,
    Harper encouraged the public to challenge their government, saying the famine
    should “remind the Ukrainian people of the importance of their freedom and democracy
    independence, and of the necessity of always defending these things.”6 With Yanukovych
    refusing to echo Harper’s nationalist interpretation of the 1932 famine, Lubomyr
    Lyciuk, a Royal Military College of Canada professor who participated in Harper’s
    tour, wrote in the Kingston Whig-Standard, “Yanukovych is slated for the dustbin
    of history while the honourable Harper can stand.”


    A year after his trip, Harper threatened Yanukovych over legal proceedings against
    Tymoshenko, who was found guilty of corruption. In an October 2011 letter, Canada’s
    PM wrote, “I cannot overstate the potential negative impact of the current judicial
    proceedings Yulia Tymoshenko on both Ukraine’s future relations with Canada and
    others on Ukraine’s long-term democratic development.”7 During an April 2012 visit,
    international trade minister Beverly Oda was concerned about human rights and,
    in a highly abnormal diplomatic move, had Ukrainian-Canadian representatives participating
    in her delegation. One need only imagine a Russian delegation bringing Russian-Canadians,
    or a Chinese delegation bringing Chinese-Canadians, to criticize Ottawa to understand
    the peculiarity of this decision.


