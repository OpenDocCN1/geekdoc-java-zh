    # 巴勒斯坦，2006年


    2006年1月，哈马斯在加拿大监督和促进的巴勒斯坦立法选举中获胜。在以色列之后，加拿大是第一个停止对巴勒斯坦当局（PA）援助的国家。这种援助中断旨在巴勒斯坦社会内部制造分裂，产生了毁灭性的社会影响。《环球与邮报》的标题解释道：“加沙家庭之间的公开战争是援助冻结的副产品。”


    哈马斯是一个伊斯兰教抵抗组织，由瘫痪的谢哈迈德·亚辛于1987年创立，他于2004年被以色列直升机发射的地狱火导弹暗杀死（连同九名旁观者）。以色列政府最初允许哈马斯作为巴勒斯坦解放组织（PLO）和左翼抵抗组织的替代方案。以色列准将伊兹哈克·塞格夫告诉《纽约时报》，以色列“帮助资助巴勒斯坦伊斯兰运动，作为对雅西尔·阿拉法特领导的巴勒斯坦解放组织和法塔派世俗主义者的‘制衡’”。一旦哈马斯开始对以色列在占领巴勒斯坦的霸权构成实际威胁，以色列就会寻求“轰炸、围困并将其消灭在本土”。


    当哈马斯赢得如006年立法选举时，该运动在加拿大的支持下加剧。以色列对加沙实施了经济封锁，严重限制了食物、水资源和能源的供应，因为巴勒斯坦人在国际上认为认为自由公平的选举中投给了错误的政党。


    2006年3月，加拿大成为第一个停止对新哈马斯领导的巴勒斯坦当局援助的捐助国。


    为了减少分裂并避免全面的内战，代表巴勒斯坦立法委员会90%以上成员的政治派别于2007年3月建立了联合政府。尽管如此，渥太华仍然回避了这一新政府。“我们的政策是不与政府成员或副部长接触，”时任外务部长彼得·麦基的通讯总监丹尼尔·杜加斯说。


    当巴勒斯坦联合政府的信息部长在全球和平访问期间前往渥太华时，麦基拒绝与他会面。代表世俗政派的穆斯塔法·巴尔古提告诉大使馆：“除了以色列之外，我认为加拿大政府是唯一采取这种立场的政府。甚至美国也派遣了其驻耶路撒冷领事总领[雅各布·沃尔斯]]去会见巴勒斯坦财政部长[萨拉姆·法亚德]。”巴尔古提已经会见了瑞典和挪威的外长、联合国秘书长以及美国国务卿康多利泽泽·莱斯。


    加拿大的强硬立场旨在巴勒斯坦社会内部制造分裂并摧毁联合政府。事实上，华盛顿和渥太华实际上推波了哈马斯和法塔派之间的战争。以色列情报机构的一位高级人物解释道：“华盛顿不想要联合政府。它想要法塔派破坏它，并派遣了[美国陆军中将基思·戴顿]创建并训练一支能够推翻哈马斯的力量。当哈马斯抢先制之时，每个人都控诉不公，称这是哈马斯的军事政变——但是谁发起的政变？”


