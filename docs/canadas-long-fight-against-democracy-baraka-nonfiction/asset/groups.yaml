    rally. At the opening of the Lima Group meeting in Ottawa after Guaidó’s presidential
    declaration, Trudeau declared, “the international community must immediately unite
    behind the interim president.”


    The PM called the leaders of France, Spain, Paraguay, Ireland, and Italy, as well
    as the International Monetary Fund and the European Union, to convince them to
    join Canada’s campaign against Venezuela.16 In a May 2019 conversation with Spanish
    prime minister Pedro Sánchez, Venezuela was the only subject mentioned in the
    official press release about the call.17 Venezuela was also on the agenda during
    Japanese prime minister Shinzo Abe’s visit to Ottawa in April 2019. The post-meeting
    release noted, “during the visit, Prime Minister Abe announced Japan’s endorsement
    of the Ottawa Declaration on Venezuela.”18 Produced at a February 2019 meeting
    of the Lima Group, the “Ottawa Declaration” called on Venezuela’s armed forces
    “to demonstrate their loyalty to the interim president” and remove the elected
    president.19


    On April 30, Guaidó, opposition politician Leopoldo López (who was given a thirteen-year
    jail sentence for inciting and planning violence during the 2014 “guarimbas” protests),
    and others sought to stoke a military uprising in Caracas. Hours into the early
    morning, Freeland tweeted, “watching events today in Venezuela very closely. The
    safety and security of Juan Guaidó and Leopoldo López must be guaranteed. Venezuelans
    who peacefully support Interim President Guaidó must do so without fear of intimidation
    or violence.”20 She followed that with a statement to the press noting, “Venezuelans
    are in the streets today demonstrating their desire for a return to democracy
    even in the face of a violent crackdown. Canada commends their courage and we
    call on the Maduro regime to step aside now.”21 Then Freeland put out a video
    calling for Venezuelans to rise up and requested an emergency video conference
    meeting of the Lima Group.22 Later that evening, the coalition issued a statement
    labelling the attempted putsch an effort “to restore democracy” and demanded the
    military “ceasing instruments of the illegitimate regime for the oppression of
    the Venezuelan people.”23


    Guaidó was officially dethroned as leader of Venezuela’s National Assembly (the
    matter was contested) in January 2020. Two weeks later, Guaidó sought to reaffirm
    his international backing. He was fêté in Ottawa, meeting the prime minister,
    international development minister and foreign minister. Trudeau declared, “I
    commend Interim President Guaidó for the courage and leadership he has shown in
    his efforts to return democracy to Venezuela, and I offer Canada’s continued support.”24


    Over a two-year period, Ottawa severed diplomatic relations with Caracas. Following
    Washington’s lead, Ottawa imposed four rounds of sanctions on Venezuelan officials.25
    In September 2017, the elected president, vice president, head of the electoral
    board, and thirty other officials had their assets in Canada frozen and Canadians
    were barred from having financial relations with these individuals. When forty-three
    individuals were added to a list of seventy leaders, Canada had already sanctioned
    CBC reported in April 2019 that the sanctions aimed to “punish Venezuelan judges
    who rubber-stamped Maduro’s moves” and “lower-ranking police officials who took
    prominent roles in suppressing the attempt by Venezuela’s opposition to bring
    humanitarian aid to the country on February 23.”26


    The real objective of the sanctions was to help squeeze the economy to precipitate
    regime change. While ostensibly targeted at individuals, Canadian sanctions deterred
    companies from doing business in Venezuela. They also helped legitimate more devastating
    US actions.


    The Venezuelan government responded to Canadian sanctions by denouncing Ottawa’s
    “alliance with war criminals that have declared their intention to destroy the
    Venezuelan economy to inflict suffering on the people and loot the country’s riches.27
    A Center for Economic and Policy Research report gave credence to this perspective.
    Written by Jeffrey Sachs and Mark Weisbro, “Economic Sanctions as Collective Punishment:
    The Case of Venezuela” concluded that 40,000 Venezuelans may have died in 2017
    and 2018 as a result of US sanctions.28 A July 2019 Financial Times story titled
    “Venezuela sanctions fuel famine fears” and a New York Times op-ed that month
    titled “Misguided sanctions hurt Venezuelans” highlighted their growing impact.


    Unilateral sanctions violate the UN charter. Additionally, the Human Rights Council
    passed a resolution condemning the economic sanctions by the US and Canada adopted
    against Venezuela.29 It urged “states to refrain from imposing the unilateral
    application and enforcement by certain powers of such measures as tools of political
    or economic pressure.”30 For its part, Caracas called Canada’s move a “blatant
    violation of the most fundamental rules of International Law.”31


    Canadian diplomats were encouraged to play up human rights violations in Venezuela.
    A 27-page Global Affairs report uncovered by the Globe and Mail noted “Canada
    should maintain the embassy’s prominent position as a champion of human-rights
    defenders.” Alluding to the hostility engender by its interference in that country’s
    affairs, the partially redacted 2017 report recommended that Canadian officials
    also “develop and implement strategies to minimize the impact of attacks by the
    government in response to Canada’s human rights statements and activities.”32


    Ottawa worked to amplify oppositional voices inside Venezuela. In 2017, outgoing
    Canadian ambassador Ben Rowwell told the Ottawa Citizen: “We established quite
    a significant internet presence inside Venezuela, so that we could then engage
    tens of thousands of Venezuelan citizens in a conversation on human rights. We
    became one of the most vocal embassies in speaking out about human issues and
    encouraging Venezuelans to speak out.”33


    During Rowwell''s tenure at the embassy, Canada financed NGOs with the expressed
    objective of embarrassing the government internationally. According to the government’s
    response to a July 2017 Senate Committee on Foreign Affairs and Trade report on
    Venezuela, “CFLI [Canada Fund for Local Initiatives] programming includes support
    for a local NGO documenting the risks to journalists and freedom of expression
    in Venezuela, in order to provide important statistical evidence to the national
    and international community.”34 Another CFLI initiative funded during Rowwell''s
    tenure in Caracas enabled Venezuelan citizens to anonymously register and denounce
    corruption abuses by government officials through a mobile phone application.”35


    In line with its policy of amplifying oppositional voices, the Canadian Embassy
    in Caracas co-sponsored an annual Human Rights Award with the Centro para la Paz
    y los Derechos Humanos, whose director, Raúl Herrera, repeatedly denounced the
    Venezuelan government. In late 2017 Herrera said, “the Venezuelan State systematically
    and repeatedly violates the Human Rights of Venezuelans and political prisoners.”36


    The winner received a “tour of several cities in Venezuela to share his or her
    experiences with other organizations promoting human rights” and a trip to Canada
    to meet with “human rights authorities.”37 They generally garnered media attention.
    The Venezuelan NGOs most quoted in the Canadian media criticizing the country’s
    human rights situation—Provea, Foro Penal, CODEVIDA, Observatorio Venezolano de
    Conflictividad, Observatorio Venezolano de Prisiones, etc.—had been formally recognized
    by the Canadian Embassy.


    In March 2018, the embassy gave its Human Rights Award to Francisco Valencia,
    director of the Coalition de Organizaciones por el Derecho a la Salud y la Vida
    (CODEVIDA). Numerous media outlets reported on the award given to an opposition
    member of the Venezuelan government.38 “I believe that we are facing a criminal
    State,” Valencia told Crisis in Venezuela.39 In July 2018 Valencia spoke in Ottawa
