    was about to meet Harper and President Obama, to lobby Ottawa and Washington on
    their behalf. “We are asking [Calderón] to be an intermediary for our people with
    the powerful countries of the world,” said Rodas, “for example, the US and at
    this moment Canada, which have lines of military and economic support with Honduras.”8


    Five months after Zelaya was ousted, the coup government had previously scheduled
    elections. During the campaign period, the de facto government imposed martial
    law and censored media outlets. Dozens of candidates withdrew from local and national
    races and opposition presidential candidate, Carlos H. Reyes, was hospitalized
    following a severe beating by security forces. A protest in Tegucigalpa on election-day
    was forcefully repressed. Hondurans voted in a “climate of harassment, violence,
    and violation of the rights to freedom of expression, association and assembly,”
    according to the Washington-based Center for Justice and International Law.9


    The November 2009 election was boycotted by the UN and OAS and most Hondurans
    despite mandatory voting regulations, only 45% of those eligible cast a ballot
    (it may have been much lower as this was the government’s accounting). Ottawa
    endorsed this electoral farce. “Canada had the Honduran people for the relatively
    peaceful and orderly manner in which the country’s elections were conducted,”
    noted an official statement.10 Peter Kent went boldly proclaiming, “there was
    a strong turnout for the elections, that they appear to have run freely and fairly,
    and that there was no major violence.”'
