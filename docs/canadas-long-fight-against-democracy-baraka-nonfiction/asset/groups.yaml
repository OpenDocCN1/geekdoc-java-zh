    The late prominent journalist Michel Vastel brought the gathering behind public
    attention in the March 15, 2003, issue of L’actualité, Québec’s equivalent to
    Maclean’s. In an article titled “Haiti put under U.N. Tutelage?” Vastel wrote
    that the possibility of Aristide’s departure, a potential trusteeship and the
    return of Haiti’s military were discussed. After the coup, Vastel said his source
    on this private conference was his friend Denis Paradis and information on the
    meeting was corroborated by French officials. For his part, Paradis would deny
    Vastel’s account of the “Ottawa Initiative in Haiti,” but the story was never
    retracted by Vastel or L’actualité. In several post-coup interviews, Vastel stood
    behind his original article and asserted that several follow-up meetings took
    place involving the same participants, as well as US secretary of state Colin
    Powell.


    While claiming he was misinterpreted by Vastel, Paradis made it clear that a foreign
    intervention into Haiti was discussed at the “Ottawa Initiative on Haiti.” In
    a September 2004 interview with researcher Anthony Fenton, Paradis explained,
    “there was one thematic that went under the whole meeting ... the responsibility
    to protect.” A showpiece of the Liberals’ foreign policy, the responsibility to
    protect doctrine asserts that where gross human rights abuses are occurring, it
    is the duty of the international community to intervene, over and above considerations
    of state sovereignty. In a highly censored February 11, 2004 cable from the Canadian
    Embassy in Port-au-Prince to Foreign Affairs, ambassador Kenneth Cook explained,
    “President Aristide is clearly a serious aggravating factor in the current crisis”
    and there is a need to “consider the options including whether a case can be made
    for the duty [responsibility] to protect.” According to an Access to Information
    request, Foreign Affairs monitored public reaction to Vastel’s story. In an e-mail
    exchange with Foreign Affairs, Canada’s ambassador to Haiti, Kenneth Cook, pointed
    out that of the seventy letters received by L’actualité on the topic of regime
    change, “most were positive.” As such, one suspects Paradis’ leak to Vastel was
    a trial balloon designed to gauge the response of the opposition parties, Haitian
    community, and other social organizations.


    For obvious reasons, the Haitian government wasn’t too pleased with the meeting.
    Days after it came to public attention, Haiti’s foreign minister demanded a meeting
    with Canada’s ambassador, while Haiti’s Radio Metropole reported that Paradis
    sent a letter to Haiti’s foreign minister telling him the Ottawa meeting posed
    no threat to his government.


    Alongside international diplomatic efforts and civil society opposition, a low-intensity
    war was waged against the government. Dozens of Lavalas members and supporters
    were killed in Belladere and other towns on the border with the Dominican Republic
    between 2001 and 2003. On July 28, 2001, several police stations were attacked.
    In a more serious coup attempt, more than dozen gunmen stormed the national palace
    on December 17, 2001. With a helicopter and 50-mm-caliber machine gun, they killed
    four and briefly occupied the building. Five attackers were killed by police.
    The attackers announced via radio that Aristide was no longer president and that
    Guy Philippe now commanded the police. The attack was reportedly praised in Santo
    Domingo by former police chiefs Philippe and Jean-Jacques Nau.


    Philippe and four others, including Paul Arcelin, were arrested by Dominican authorities.
    A Dominican military official told the Associated Press, “these people are being
    investigated because of allegations that they are trying to reach Haiti with the
    aim of conspiring” against the elected government. Arcelin’s relationship with
    Philippe revealed the connection between the paramilitaries and the Convergence
    Démocratique Arcelin has the CD representative in the Dominican Republic.


    Arcelin appears to have been working with the International Republican Institute
    (IRI). In a July 2004 Salon article, Max Blumenthal wrote:


    Others describe more formal ties between IRI and the insurgents. Jean Michel Caroit,
    chief correspondent in the Dominican Republic for the French daily Le Monde, says
    saw Philippe’s political advisor, Paul Arcelin, at an IRI meeting at Hotel Santo
    Domingo in December 2003. Caroit, who was having drinks in the lobby with several
    attendees, said the meeting was convened ‘quite discreetly.’ His account devoutiled
    with that of a Haitian journalist who Salon on condition of anonymity that Arcelin
    often attended IRI meetings in Santo Domingo as Convergence’s representative to
    the Dominican Republic.


    A former professor at the Université du Québec à Montréal, Arcelin later proclaimed
    himself “intellectual author” and “political leader” of the military uprising
    ousted Aristide. After the coup, the Montréal Gazette reported, “Arcelin, a rebel
    and self-proclaimed architect of the 2004 coup d’état, does not hesitate to express
    his role in Aristide’s overthrow, describing phone calls made from Canada to rebel
    leader Guy Philippe in Haiti or to discuss coup strategy.”20 Arcelin told the
    Gazette, “two years ago, I met Guy Philippe in Santo Domingo and we spent 10 to
    15 hours a day together, plotting against Aristide.” He added, “from time to time
    we’d [Arcelin and Philippe] cross the border clandestinely through the woods to
    conspire against Aristide, to meet with the opposition.”


    The Gazette also revealed that Arcelin had met Pierre Pett in early February 2004
    in Montréal: “He took advantage of the visit and the political clout of his sister-in-law
    [former Conservative MP Nicole Arcelin-Roy] to meet with Health Minister Pierre
    Pettigrew... ‘I explained the reality of Haiti to him,’ Arcelin, pulling Pettigrew’s
    business card out of his wallet. ‘He promised to make a report to the Canadian
    government about what I had said.’”


    At the end of 2003, Philippe and the former soldiers intensified their cross-border
    attacks against government targets. They were subsequently joined by a coalition
    of gangs in Gonaïves led by a former death squad leader. On February 5, 2004,
    the insurgents seized Gïves, the country’s fourth largest city. The heavily armed
    force rampaged across Haiti, killing police, emptying jails, and burning public
    buildings.


    Initially foreign affairs minister Bill Graham denounced the rebellion, saying
    Canada supported the elected government. “Aristide has been elected and he must
    complete his term,” explained Graham in a mid-January 2004 La Presse article titled
    “Caricom tells Paul Martin about Aristide’s popularity in Haiti.” “If new elections
    were held today, he would probably be re-elected.”^21


    The Bush Administration publicly responded to the rebellion in a similar way.
    In what was probably a bid to claim deniability and a way to hedge based on developments,
    US secretary of state Colin Powell told a Senate foreign relations committee on
    February 12, “the policy of the administration is not regime change. President
    Aristide is the elected president of Haiti.” Powell reaffirmed that position five
    days later: “We cannot buy into a proposition that says the elected president
    must be forced out of office by thugs and those who are bringing terrible violence
    to the people.”


    At the same time they criticized the rebels, US and Canadian officials strengthened
    their hand. They demanded Aristide negotiate with an intransigent political opposition.
    In mid-February 2004, Ottawa sent a delegation to Port-au-Prince to deliver a
    “firm message to Aristide, that he must respect his obligations,” explained Canada’s
    foreign minister. Graham claimed the mission’s objective was “to create a situation
    where the opposition can enter into discussions,” but the actual aim was to further
    weaken the elected government.22 On February 22, the insurgents took Cap Haïtien,
    the country’s second largest city. Scores of police officers were killed and many
    more abandoned their posts to the better-armed rebels. As the insurgents made
    their way to Port-au-Prince, the international community ignored the elected government’s
    requests for “a few dozen” peacekeepers to restore order in a country without
    an army. On February 26, three days before Aristide’s removal, the OAS permanent
    council called on the UN Security Council to “take all the necessary and appropriate
    urgent measures to address the deteriorating situation in Haiti.” CARICOM on the
    UN Security Council to deploy an emergency military task force to assist Aristide’s
    government. This appeal for assistance was flatly rejected by the world’s most
    powerful nations.


    By the end of the month, gunmen had overrun all major cities except Port-au-Prince
    and rebel on the outskirts. Supporters of the president built barricades across
    the capital. They blocked the main arteries of the city of two million and prepared
    to fight. Even with most of the country in rebel hands, the government’s prospects
    began to improve as pro-government police recaptured several cities. A shipment
    of guns, bulletproof vests, and ammunition was in Kingston, Jamaica, on route
    from South Africa at the request of CARICOM. Rumors were swirling Venezuela had
    agreed to send soldiers to protect the constitutional government. Most important,
    Port-au-Prince’s size made it difficult to capture for a few hundred men.

