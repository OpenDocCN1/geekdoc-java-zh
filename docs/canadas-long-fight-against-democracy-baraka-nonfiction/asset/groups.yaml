    在泽拉亚被推台之前，哈珀政府对这位当选总统表现出明显的态度。随着洪都拉斯紧张局势的加剧，在政变发生两天，美洲组织（OAS）通过了一项支持该国民主和法治的决议。渥太华在会议上的代表保持了沉默。6月初，肯特（Kent）批评泽拉亚说：“我们对洪都拉斯政府表示担忧。”
    渥太华反对泽拉亚关于举行非约束性公开民投的计划，该民投旨在咨询是否重新开启宪法，而该宪法是由军事政府编写的。肯特重复了洪都拉斯权贵阶层毫无根据的指控说：“今年将举行选举，我们正在密切关注政府的行为，以及似乎试图修改宪法以允许连任总统的尝试。”


    泽拉亚作为一名商人和自由党成员，并非政治局外人士或革命性左翼分子。但是，令华盛顿和渥太华的官员恼的是，他日益与21世纪初在拉丁美洲上台的左翼政府结盟，特别是胡戈·查韦斯领导的委内瑞拉。他还表示愿意向洪都拉斯日益组织化的社会运动让步，这引起了根深蒂固的权贵阶层的愤怒。泽拉亚制定了更易获得的、加强的环境保护措施，并大幅提高了最低工资。他还宣布计划召开制宪会议，以重写独裁时代的宪法。


    除了这些措施外，泽拉亚还对新的采矿特许实施了延期。这一事实可能困扰了加拿大政府，因为正如一位拉丁美洲官员所说：“据我所知，此地的加拿大大使是加拿大矿业公司的代表，”而这些公司主导了该行业。政变发生后，延期被取消，加拿大公司抢夺了这些新的商业机会。


    政变发生一周后，泽拉亚试图与三位拉丁美洲国家首脑返回洪都拉斯。军方阻止了他的飞机降落，并将10万多支持者挡在境外。在此过程中，军方杀害了两名抗议者，并伤了至少30人。在CTV电视上，肯特将暴力行为归咎于泽拉亚。


    在当选总统飞往特锡加尔帕之前，肯特告诉美洲组织返回“时机尚不对”，引发了泽拉亚干脆的回应：“我可以推迟到2010年1月27日，那时我的任期结束。”航线中断两周后，泽拉亚试图从尼加瓜陆路进入洪都拉斯。肯特再次批评了此举。7月彭博社的一条标题写道：“加拿大的肯特称泽拉亚在返回洪都拉斯前应等待”。7月25日，一家洪都拉斯右翼报纸大声宣布：“Canada
    pide a Zelaya no entrar al pais hasta un acuerdo”（加拿大要求泽拉亚在达成协议前不要进入该）。


    尽管发生了政变及随后的镇压，渥太华仍拒绝将洪都拉斯排除在其军事训练援助计划之外。尽管只有五名洪都拉斯士兵在加拿大接受训练，但未能与一个推翻当选政府的军事当局断交具有高度的象征意义。更重要的是，加拿大是洪都拉斯的主要捐助国——也是加拿大在中美洲最大的援助接收国——中唯一未能切断对军事政府援助的国家。世界银行、欧盟和美国都暂停了对洪都拉斯的部分计划援助。


    针对北美领导人冲突的信号，被推台的洪都拉斯外长告诉Telesur电视台，渥太华和华盛顿正在为军事政府提供“氧气”。帕特里娅·罗达斯（Patricia Rodas）要求加美停止对事实政权的援助。在泽拉亚访问墨西哥期间，罗达斯请求墨西哥总统菲利佩·卡尔德隆（Felipe
    Calderón）会会哈珀和奥巴马总统代表他们向渥太华和华盛顿游说。“我们请求[卡尔德隆]作为我们人民与世界大国之间的中介，”罗达斯说，“例如，美国以及目前的加拿大，它们与洪都拉斯有军事和经济支持路线。”


    泽拉亚被推台五个月后，政变政府此前安排了选举。在竞选期间，事实政府实施了戒严并审查了媒体。数十名候选人从地方和国家选举中退出，反对派总统候选人卡洛斯·H·雷耶斯（Carlos
    H. Reyes）在被安全部队严毒打后住院。选举当天，特锡加尔帕的一场抗议活动遭到强制镇压。根据总部位于华盛顿的正义与国际法中心称，洪都拉斯人在“骚扰、暴力以及侵犯言论、结社和集会自由的氛围中投票”。


    2009年11月的选举遭到联合国和美洲组织的抵制，大多数洪都拉斯人也拒绝了投票，尽管有强制投票规定，只有45%的合格选民投了票（由于这是政府统计的数据，数字可能低得多）。渥太华支持了这场选举戏法。官方声明指出：“加拿大赞扬洪都拉斯人民以相对和平、有序的方式举行了该国选举。”彼得·肯特（Peter
    Kent）大胆地宣称：“选举投票率很高，它们看起来运行得自由且公正，而且没有发生重大暴力事件。”


    当该地区大多数国家继续避开政变后的洪都拉斯时，渥太华在2010年1月27日波尔菲里奥·洛波（Porfirio Lobo）就职出为洪都拉斯总统后，立即承认了其地位。肯特表示：“加拿大祝贺洛波总统开始任期。我深信他将提供所需的政治领导力，帮助洪都拉斯度过长期的政治僵局。”肯特说洛波的当选意味着“更新进程的开始”。对于日益增多的知名社会活动人士，他保持了沉默，其中包括LGBTQ活动家沃尔特·特罗切（Walter
    Tróché），他在就职前几周被穿警察服的男子绑架、殴打并杀害。


    渥太华支持洪都拉斯重新加入美洲组织，而这遭到了大多数成员国的反对。在2012年3月的访问期间，加拿大部长戴安·阿布隆（Diane Abloncy）称洪都拉斯是美洲“重要的”合作伙伴。


    总而言之，加拿大支持的政变引发了基层政治活动的大增。洪都拉斯人动员支持泽拉亚并反对非法政府。抗议者还要求对极不平等的社会进行更根本的改革，包括召开制宪会议重写宪法。


    事实政府和精英阶层以镇压作为回应。国际赦赦描述了“2009年政变后对人权保护和法治造成的损害”。在泽拉亚被推台后的两年里，数百人在政治暴力中丧生，更多人受到攻击或受伤。2012年5月，无国界记者指出，“支持前总统曼努埃尔·泽拉亚的记者自三个月前政变以来被杀害，，[Erick
    Avila]的死亡人数已达19人。”这些谋杀案均未破获。


    渥太华对反政变活动人士的拘留、酷刑和杀害保持沉默。在2011年8月访问洪都拉斯期间，哈珀表示加拿大“没有信息表明[人权侵犯行为]是由政府实施的”。由于认为这并不是对政权人权记录的充分认可，总理称洛波为“这个国家著名的人权领袖”。在参与受国家支持的镇压和在可疑总统选举中获胜之前，洛波曾在迈阿密读过商学院，经营其富裕家族的牧场，并曾是坚持恢复死刑的国会议员。


    在总理访问期间，两国签署了一份自由贸易协定。在国家支持的大规模镇压之际，保守党通过从2010年10月与洛波政府开始双边贸易谈判，增加了该政权的合法性。政变之前，渥太华正在与洪都拉斯、危地马拉、萨尔瓦多和尼加拉瓜谈判一项中美共同贸易协定，但保守党在发现洛波更易接受后取消了这些计划。

