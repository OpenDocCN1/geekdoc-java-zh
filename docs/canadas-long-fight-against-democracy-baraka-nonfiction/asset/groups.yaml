    on January 27, 2010. Kent stated, “Canada congratulates President Lobo as he begins
    his term. I am confident that he will provide the strong political leadership
    needed to help Honduras move beyond its lengthy political impasse.”11 Kent said
    that Lobo’s election constituted “the beginning of a process of renewal.” He remained
    silent on the growing number of prominent social activists, including LGBTQ activist
    Walter Tróché, who was kidnapped, beaten, and murdered by men in police uniforms
    just a few weeks before the inauguration.


    Ottawa supported Honduras’ re-entry into the OAS, which was opposed by most members
    states. During a March 2012 visit, Canada’s minister of state Diane Abloncy called
    Honduras an “important” partner in the Americas.


    Overall, the Canada-backed coup sparked a major surge in grassroots political
    activism. Hondurans mobilized in support of Zelaya and against the illegitimate
    government. Protestors also called for more fundamental reforms to their highly
    unequal society, beginning with a constituent assembly to rewrite the country’s
    constitution.


