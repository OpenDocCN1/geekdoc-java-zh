    阿尔班斯遵循阿雷瓦洛（Arévalo）的足迹，优先考虑农村改革，针对大公司的无生产土地。华盛顿大喊这是共产主义，但阿尔班斯并非卡斯特罗式的。正如埃德华多·加莱诺（Eduardo
    Galeano）指出的，阿尔班斯的“灵感并非来自列宁，而是来自林肯。他的土地改革是一种试图使危地马拉资本主义现代尝试，比近一个世纪前的美国农村法律并不激进。”^1


    当阿尔班斯向无地农民分配联合果公司（United Fruit Company）拥有的未开发土地时，他触怒了华盛顿决策者（这家位于波士顿的公司根据其税务评估价值获得了补偿）。“该国最大的土地主，”1953年，联合果公司55万英亩土地中有85%处于闲置状态.^2
    该公司垄断了危地马拉的香蕉出口、电话和电报设施，以及其主要的大西洋港口和国内几乎每一里的铁路轨道.^3 联合果长期员工托马斯·麦坎（Thomas McCann）总结了公司在危地马拉的历史：“世纪交替之际，危地马拉被选为公司最早开发活动的地点，是因为该国大部分地区拥有优质的香蕉土地，而且在我们进入中洲时，危地马拉政府是该地区最软弱、最腐败且最容易收买的。简之，这个国家提供了一个‘理想的投资气候’，联合果公司在那里繁荣了五十年。然后事情出了问题：一个叫雅各博·阿尔班的人成了总统。”^4


    除了联合果公司之外，华盛顿担心阿尔班斯的社会民主政策会破坏精英阶层主导的地区现状。1954年，一位美国官员直言道：“危地马拉已成为对洪拉斯和萨尔瓦多稳定性的日益增长的威胁。它的土地改革是一种强大的宣传武器；它援助工人和与上阶级斗争的广泛社会计划，对处境相似的中洲邻具有很强的吸引力。”阿尔班斯代表了一个反面教材。


