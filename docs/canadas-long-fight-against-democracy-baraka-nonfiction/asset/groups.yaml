    the protests and bemoaned“the shadow that Russia is casting over this country.”23


    On December 27, Canada’s chargé d’affaires visited protest leader and journalist
    Tetiana Chornolov in the hospital after she was violently attacked.24 Three weeks
    earlier, Chornolov was widely reported to have participated in seizing Kyiv City
    Hall.25 A member of a far-right party, Chornolov had previously been arrested
    on numerous occasions and was subsequently charged with murder for throwing a
    Molotov cocktail at the Party of Regions headquarters during the Maidan protests.


    Prime Minister Harper repeatedly expressed support for the protesters and criticized
    Yanukovych. On January 27, he slammed the Ukrainian president for “not moving
    towards a free and democratic future but very much towards an anti-democratic
    Soviet past.”26 The next day Ottawa announced travel restrictions and economic
    sanctions on individuals close to the elected president. At the press conference
    to announce the measures, Alexander said, “you [Yanukovych] are not welcome in
    Canada and we will continue to take action until the violence against the people
    of Ukraine has stopped and democracy has been restored.”27 Ottawa slapped travel
    bans and economic sanctions on dozens of individuals aligned with Yanukovych.


    At the height of the protests, activists used the Canadian Embassy, which was
    immediately adjacent to Maidan square, a safe haven for “at least a week.” The
    protesters gained access a mini-van and other Canadian material. In a story written
    a year after the coup, the Canadian Press quoted officials from allied European
    nations accusing Canada of being“an active participant in regime change.” In his
    investigation of Maidan activists’ use of the Canadian Embassy in Kyiv, Canadian
    Press reporter'
- md: '

    Murray Brewster writes, “Canadians are not very popular in some quarters and occasionally
    loathed by pro-Russian Ukrainians.”


    At least some of those allowed to use the Canadian Embassy were from the far right.
    In “The far right, the Euromaidan, and the Maidan massacre in Ukraine,” professor
    Katchovsky reported, “the leader of the far right Svoboda-affiliated C14 admitted
    that C14-based Maidan Self-Defense company took refuge in the Canadian Embassy
    in Kyiv on February 18 and stayed there during the Maidan massacre.”28


    On February 19 and 20, more than 50 were killed in violence that was widely blamed
    on government security forces. However, work by Katchanovski, BBC and others show
    that far-right activists were likely responsible for many of these deaths.29


    The killings precipitated the collapse of the government. As revealed in a leaked
    phone call between US assistant secretary of state Victoria Nuland and ambassador
    to Ukraine Geoffrey Pyatt, US officials mid-wifed Yanukovych’s unconstitutional
    replacement.30 During the call the US officials decide Arseniy Yatsenyuk, who
    advocated joining NATO, should take power.


    After Yanukovych was ousted, Ottawa sought to shore up the unconstitutional government.
    Soon after, Baid welcomed “the appointment of a legitimate government is a vital
    step forward in restoring democracy and normalcy to Ukraine.”31 But the country’s
    constitutional provisions dealing with replacing or impeaching a president were
    flagrantly violated. While Ukraine’s Parliament passed a resolution backing Yanukovych’s
    ouster, the impeachment procedure enshrined in Article 111 of the constitution
    requires a special investigatory commission to formulate charges against the president,
    a ruling by the Constitutional Court Supreme Court and multiple (decisive) votes
    in parliament.32


    Days after the coup, Baird led a delegation of Conservative Party MPs and Ukrainian-Canadian
    representatives to meet acting president Oleksandr Turchynov and new prime minister
    Arseniy Yatsenko, who was Nuland’s preference.33 Canada’s foreign minister announced
    an immediate $200 million in medical assistance for those injured in the political
    violence.34 Subsequently, Ottawa announced $220 million in aid to the interim
    government.35 Harper said, “I think we really have to credit the Ukrainian people
    themselves with resisting the attempt to overturn their democracy and to lead
    their country back into the past.”36


    After the coup, Canada’s PM was the first G7 leader to visit the interim government.37
    Alongside Baird and justice minister Peter MacKay, Harper told the acting president,
    “you have provided inspiration and a new chapter in humanity’s ongoing story of
    the struggle for freedom, democracy and justice.”38 During his visit to show up
    the US and Canadian-installed government, Harper accused Vladimir Putin of seeking
    to destabilize international security and return the world to the “law of the
    jungle.” In support of the unconstitutional change of power, Harper visited the
    authorities in Kyiv within two months.


    The individual who became president three months after the Maidan protests said,
    “Canada is one of Ukraine’s closest partners.” During September 2014 visit to
    Ottawa, Petro Poroshenko added that Ukraine had “no better friend.”


    The post-Yanukovych government banned a number of major political parties and
    empowered far-right forces that perpetrated significant violence, including a
    massacre of at least 42 individuals at the headquarters of Odessa federation of
    trade unions. Ottawa stayed quiet about the massacre in Odessa and the ban on
    opposition parties.


    The 2014 coup divided Ukraine politically, geographically, and linguistically.
    The largely Russian-speaking south and east protested the ouster of Yanukovych,
    who was from the region. Likewise, many opposed the post-coup right-wing nationalist
    government because it immediately eliminated Russian as an official language and
    prohibited education in Russian, Polish, and Hungarian (Magyar) while making moves
    to rehabilitate hardline anti-Soviet historical figures, including Nazi collaborators,
    by building statues and renaming streets.


    The 2014 coup prompted Moscow to seize Crimea with its largely Russian population
    and strategically important Russian naval base. Additionally, the coup and the
    subsequent violence against Russian speakers, including the Odessa massacre, prompted
    thousands of Ukrainians in the eastern Donetsk region to rebel against the new
    Western-backed government in Kyiv. Moscow offered this endogenous uprising military
    and logistical support. The Donetsk became the site of an eight-year war that
    left 14,000 people dead and contributed to Russia’s 2022 invasion of Ukraine.


