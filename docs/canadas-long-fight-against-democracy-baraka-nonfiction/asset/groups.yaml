    ## RUSSIA, 1993


    On October 4, 1993, Russian president Boris Yeltsin bombed his own country''s
    parliament building, the White House. The aim was to end an elected, constitutional
    force''s opposition to his unilateral reforms. Ottawa effectively backed an anti-parliamentary
    coup that left hundreds of anti-Yeltsin protesters dead.[1]


    The conflict between the executive branch and parliament (Supreme Soviet) began
    as a result of the destruction wrought by Yeltsin''s Western-backed “shock therapy.”
    The neoliberal economic reforms laid waste to Russian society, impoverishing the
    vast majority while enriching a handful of well-connected insiders.[2] The pain
    of shock therapy spurred opposition to Yeltsin.


    At the start of 1993 parliamentary resistance to Yeltsin radicalized and by October,
    Russia was embroiled in what Boris Kagarlitsky called “minor civil war.”[3] In
    that war, Canada sided with Yeltsin who consolidated power in the presidency.


    In September 1993 the clash between Yeltsin and Parliament intensified when he
    dissolved Parliament, suspended numerous articles of the constitution, and inaugurated
    presidential rule. The Constitutional Court and legislature accused Yeltsin of
    a coup, removed him from the presidency, and named vice president Aleksandr Rutkoi
    acting president.


    In early October 1993, supporters of the Parliament occupied government buildings,
    including the mayor’s office and the Ostankino TV station. In response, Yeltsin
    cut off power, water, and electricity to the Parliament building. He ordered the
    military to attack pro-democracy protesters, bomb the White House people with
    heavy artillery, and storm the battered building. Fifteen hundred people were
    killed in the fighting according to the defenders of the parliament (140 according
    to the government).[4]


    After rolling over the elected parliament, Yeltsin restricted the opposition press
    and banned numerous political parties and organizations. After polls suggested
    the Communist Party would win, he also invited the US to rig the 1996 presidential
    elections.


    Ottawa offered no condemnation of the deadly coup. Instead, it increased its collaboration
    with the Yeltsin regime.


    From the beginning, Ottawa backed Yeltsin with advisers and hundreds of millions
    of dollars in assistance. In his memoirs, former prime minister Brian Mulroney
    boasted that “on a percentage basis” only Germany had provided more to Yeltsin’s
    Russia than Canada.[5] As Mulroney’s ambassador to Russia, Jeremy Kinsman, wrote,
    “We Canadians gave wholeheartedly support to Russian reformers. We flew in our
    expensive bankers, legal experts, parliamentarians and top bureaucrats to teach
    them how we do things.” Canada’s “whole-hearted support” included “hugely ambitious
    aid projects to privatize collective farms, teach provincial parliamentarians
    about fiscal federalism and write laws on copyright.


    Lavishing praise on Yeltsin, Kinsman added that he “gave paramount importance
    to simple, basic new rights—real votes, home ownership, free speech.”[6]


    In April 1993, prime minister Brian Mulroney and US president Bill Clinton voiced
    support for his reforms. At the meeting, Mulroney committed another $200 million
    in “economic and technical aid” to Russia.[7]


    Later in 1993, new Canadian prime minister Kim Campbell met Yeltsin and praised
    his actions. In his memoirs, Campbell described him as “a giant who was ‘trying
    to create democracy and a modern economy in Russia.’”[8]


    Canada played a significant role in promoting the post-Soviet neoliberal economy.
    To spur economic liberalization, Ottawa granted subsidies to Canadian companies
    investing in Russia.[9] Canadian firms became major players in the oil sector.


    They feared the Russian parliament’s ambivalence towards shock therapy.[10] Carl
    H. McMillan explains, “the former Russian parliament gave consideration to amending
    the law on foreign investment to place conditions on concession contracts to foreign
    companies in the oil and other extractive industries,” which prompted Canadian
    oil firms to consider “retrenching or withdrawing.”[11]


    After he bombed the parliament and assumed greater presidential powers, Western
    aid and investment grew and Yeltsin continued to be a guest of honour at G7 meetings.
    In 1995, prime minister Jean Chrétien invited Yeltsin to participate in the G7
    in Halifax, Nova Scotia.[12] His supposed reputation as a democrat and modernizer
    were constantly reinforced in Western press coverage. In Kagaritsky’s, Yeltsin
    “got away with everything—the destruction of the Soviet Union, the collapse of
    industry, a drastic fall in living standards, the lost war in Chechnya, and corruption
    scandals in his own family.”[13]


    In the apparent name of democracy, Ottawa supported a presidential coup and bombing
    of an elected parliament.


    - 1. Andrew Felky, Yeltsin’s Russia and the West (Westport: Prager Publishers,
    2002), 78.

    - 2. Alexander Buzgalin and Andrei Kolganov, Bloody Oct. in Moscow: Political
    Repression in the Name of Reform (New York: Monthly Review Press, 1994), 27.

    - 3. Boris Kagaritsky, Russia Under Yeltsin and Putin: Neo-liberal Aurocracy (London:
    Pluto Press, 2002), 85.

    - 4. Reddaway and Glinski, The Tragedy of Russia’s Reforms, 371.

    - 5. Brian Mulroney, Memoirs: 1939-1993 (Toronto: McClelland & Steward Ltd, 2007),
    985.

    - 6. Jeremy Kinsman, “A skate with democracy,” CBC (https://www.cbc.ca/news2/background/berlinwall/memories/f-vp-kinsman.html).

    - 7. Mulroney, op. cit., 984.

    - 8. Kim Campbell, Time and Change: The Political Memoirs of Canada’s First Woman
    Prime Minister (Toronto: Doubleday Canada Limited, 1996), 333.

    - 9. Yuri Adjubi, “Russia: A Largely Untapped Potential,” in Foreign Investment
    in Russia and Other Soviet Successor States (London: Macmillan Press Ltd, 1996),
    140.

    - 10. Ibid., 154-155.

    - 11. Ibid., 49.

    - 12. Alexander Panetta, “Chretien, Mulroney share memories of larger-than-life
    Yeltsin,” The Globe and Mail, Apr. 23, 2007.

    - 13. Kagarlitsky, op. cit., 77.


    ## HAITI, 2004


    On February 29, 2004, Canadian special forces “secured” the airport from Haiti’s
    elected president Jean-Bertrand Aristide was bundled (“kidnapped” in his words)
    onto a plane by US Marines. He was deposited against his will in the Central African
    Republic. Almost immediately after Aristide was removed, 500 Canadian troops were
    dispatched to patrol the streets of Port-Prince.


    Aristide''s overthrow was the culmination of a US-led and Canadian-supported destabilization
    campaign that included “civil society building,” military and paramilitary interventions,
    an aid embargo that would cripple the country’s economy, a disinformation campaign
    waged by Haitian elite-owned media, and concerted diplomatic efforts directed
    at guaranteeing regime change would be acceptable to the international community
    and believable to a confused public.


    Aristide, who had lived and studied in Montréal for three years, rose to prominence
    in the movement that toppled the thirty-year reign of “Papa Doc” and “Baby Doc”
    Duvalier. The slightly-formed priest’s political philosophy was rooted in liberation
    theology. During his first term in office, he raised the minimum wage, invested
    in education, and elevated the Creole language from its underclass status. His
    redistributionist policies angered the small number of families who run the economy
    and his call for France to repay its $21 billion debt angered others.


    Incredibly, the 2004 coup against Aristide began with an effort to credit elections
    he neither participated in nor oversaw. In the May 2000 legislative and municipal
    elections, Aristide’s Fanmi Lavalas won more than 70% of the vote. They took an
    unprecedented 89 of 115 mayoral positions, 72 of 83 seats in the Chamber of Deputies
    and 18 of 19 Senate seats. Immediately afterwards, OAS observers called the elections
    “a great success for the Haitian population, which turned out in large and orderly
    numbers to choose both their local and national governments.” According to the
    OAS, 60% of registered voters went to the polls and there were “very few” incidents
    of either fraud or violence.


    In response to its crushing defeat, the opposition accused the electoral commission
    of organizing a “massive fraud.” The OAS challenged the calculation of majorities
    in some Senate seats, claiming Lavalas should have only won seven seats in the
    first round, not the sixteen announced by the electoral council.


    The electoral council determined the 50% plus one vote required for a first-round
    victory by calculating the percentages of the top four candidates. The OAS concerns
    were disingenuous since they worked with the electoral council to prepare the
    elections and were aware of the counting method beforehand. Finally, the tabulation
    method proposed by the OAS would probably not have altered the outcome of the
    senate seats.

