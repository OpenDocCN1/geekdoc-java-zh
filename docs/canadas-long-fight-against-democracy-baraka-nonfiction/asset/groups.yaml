    # PERU, 2022


    On December 7, 2022, elected president Pedro Castillo was impe and jailed. Ottawa
    immediately backed the removal of a president whose government called the Canadian-backed
    anti-Venezuela Lima Group “the most disastrous thing we have done in international
    politics in the history of Perú.”¹


    Born to illiterate peasants in Cajamarca, one of the poorest regions in Peru,
    Castillo became a primary teacher and union activist. He rose to national prominence
    by leading a teachers’ strike in 2017. Castillo’s rise was symbolically important
    for Indigenous, rural, and impoverished Peruvians. But it elicited contempt from
    the Lima elite who sought to humiliate him at every turn. Partly as a result of
    an unrelenting sabotage campaign, Castillo was ineffective in pursuing his agenda
    of lessening the country’s gross inequities. Among other positions, Castillo vowed
    to reform the Fujimori-era constitution and implement agrarian reform to promote
    food security and sustainable small-scale production.²


    Canada helped consolidate a coup that sparked a furious popular backlash. Ottawa
    defended an unelected Peruvian regime that suspended civil liberties and imposed
    a curfew while deploying troops to the streets. Security forces killed over sixty
    mostly Indigenous protesters.


    At a special meeting of the Organization of American States hours after Castillo
    arrested Canada’s representative to the OAS, “Canada would like to express its
    deep concern over President Castillo’s attempt to dissolve congress and establish
    a government of exception in Peru. Such destabilizing actions run directly counter
    to the recommendation of the'
