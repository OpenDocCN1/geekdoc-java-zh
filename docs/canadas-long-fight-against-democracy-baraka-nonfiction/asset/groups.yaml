    The anti-democratic nature of Canada’s position grew darker with time. After dragging
    their feet on the elections initially set for January, the “interim” government
    used the COVID-19 pandemic as an excuse to repeatedly postpone elections. Global
    Affairs ignored the “caretaker” government’s repeated postponement of elections.
    Even worse, when the country’s social movements launched a general strike in August
