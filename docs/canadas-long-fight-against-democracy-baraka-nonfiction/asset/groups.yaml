    委内瑞拉，2017年...


    Yves Engler 和 Owen Schalk


    # 加拿大对民主的长期抗争


    ![](img/237a0e1a79e6c4027cfc64cc968802b0_1_0.png)


    Yves Engler 和 Owen Schalk


    #涉及到政权更迭时，渥太华认为手段正当。


    加拿大通过切断援助和对某些国家进行非法制裁，煽动民众反对民选政府。它通过资助反对派团体以及允许抗议者利用其大使馆推翻民选领导人来干涉其他国家的事务。


    它曾主持过一次秘密国际会议，计划推翻一位深受民选领导人。渥太华将一名边缘反对派政治人物承认为一个目标是政权更迭国家的合法总统。在必要时，加拿大军队会被部署去恐吓和颠覆政府。


    > “但我们想要民主和人权！”这种口号是如此响亮。Engler 和 Schalk 回道：“不，你们恰恰相反。”


    尽管华盛顿在颠覆民选政府方面的作用广为人知，但加拿大的作用一直被忽视。作者们将其推向了它所属的舞台中心。


    这项经过仔细研究的研究强调了加拿大自1950年以来如何参与了20多个民选政府的推翻。


    **Yves Engler** 是一位政治活动家，两本书的作者。他被誉为“加拿大左翼最重要的声音之一”，《环球与邮件报》将其比作 I.F. Stone 式人物。Yves
    Engler 住在蒙特利尔。


    **Owen Schalk** 是《阿富汗的加拿大：军事、外交、政治和媒体失败的故事，2003-2023》的作者。他为《加拿大维度》杂志撰写每周专栏。他住在曼尼托巴省农村。


    附有 **Rob Rolfe** 的诗作


    ![](img/237a0e1a79e6c4027cfc64cc968802b0_3_0.png)


    # 加拿大对民主的长期抗争


    Yves Engler 和 Owen Schalk


    Baraka Books

    蒙特利尔


    Yves Engler 是一位政治活动家，十二本书的作者。他被誉为“加拿大左翼最重要的声音之一”。《环球与邮件报》将他比作 I.F. Stone 式人物，而《Quill
    & Qu》则认为 Engler 是“那少数罕见但不断增长的、无畏面对加拿大自得其神话的社会批评家的一员”。Yves Engler 住在蒙特利尔。


    Owen Schalk 是一位来自曼尼托巴省的作家。他是《阿富汗的加拿大：军事、外交、政治和媒体失败的故事，2003-2023》（Lorimer Books,
    2023）的作者。他的文章发表在 Alborada、Monthly Review 和 Protean Magazine 上，并为《加拿大维度》杂志撰写每周专栏。他的小说作品曾发表在《Quagmire
    Literary Magazine》、《Sobotka Literary Magazine》、《Vast Chasm Magazine》等杂志上。


    Rob Rolfe 是七本诗集和三本诗歌小行本的作者。他的诗作出现在许多加拿大期刊上，以及加拿大和美国的诗集中。Rob 曾是多伦等地的一位图书管理员和工会领袖，并与歌手歌曲作家
    Larry Jensen 一起担任欧文音（Owen Sound）的桂桂诗人。


