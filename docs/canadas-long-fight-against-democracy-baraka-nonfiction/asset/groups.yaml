    在刚果加丹加的某处……我们的三位兄弟自由战士被处死。……关于他们的结局，很多事情是不确定的，但有一个事实是清晰易见的。他们被杀害是因为联合国——帕特里斯·卢蒙巴本人作为总理被邀请到刚果维护法律秩序，结果不仅未能维护那种法律秩序，还剥夺了刚果合法政府其他自我保护手段。历史记录了许多国家统治者被暗杀的场合。然而，帕特里斯·卢蒙巴和他的两名同事被杀害是独一无有的，因为这是历史上一个国家的合法统治者在他所信任的国际组织的公开纵容下被处死……联合国并没有维护法律秩序，反而宣布让自己在法律与混乱之间保持中立，并拒绝向合法政府提供任何援助来镇压那些在加丹加和南凯塞建立政权的叛乱者。当刚果政府为了调动部队反对叛乱者从苏联获得一些民用飞机和民用汽车时，联合国的殖民主义强权大声愤慨，与此同时，却对服务于叛乱者的比利时武装和实际比利时军事力量的集结保持了谨慎的沉默……当卢蒙巴[在萨卡库布政变后]希望向民众广播解释发生了什么时，联合国以所谓的“法律秩序的利益”阻止了他的发言。然而，他们并没有使用同样的力量来阻止刚果军叛乱者在利奥波维维夺权并建立一个完全非法的政府……联合国坐视旁，而所谓的加丹加（完全由比利时控制）从比利时和其他国家（如[实行种族隔离的]南非）进口了飞机和武器，这些国家在镇压非洲自由运动方面有既大利益。联合国事实上纵容了独立加丹加国家的建立，尽管这违反了安会自身的决议。最后，本可以行使权威阻止帕特里斯·卢蒙巴广播的联合国，却辩称完全无法阻止他被叛乱者逮捕，或通过使用受联合国控制的机场将其移交给由比利时主导的加丹加政府。40


