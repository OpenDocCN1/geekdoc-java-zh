    与此同时，贾汀·特鲁多（Justin Trudeau）与其他领导人对玻利维亚的选举表示担忧。在与智利总统塞巴斯蒂安·皮涅拉（Sebastián Piñera）电话通话期间，总理批评了“玻利维亚的选举违规行为”。渥太华还推动并资助了美洲组织（OAS）破坏玻利维亚总统选举信誉的努力。


    10月20日总统投票后，美洲组织立即抗议。第二天，该组织发表声明，对对“投票结束后公布的初步结果[来自快速计票]趋势发生剧烈且难以解释的变化表示‘深切关注和惊讶”。两天后，他们跟进了一份初步报告，重复了他们的主张，“TREP[快速计票]趋势的变化难以解释，且与其他可获得的测量结果不符。”


    美洲组织所引用的“难以解释”的变化完全是在料之中的，正如位于华盛顿的经济政策研究中心（CEPR）的报告《玻利维亚2019年计票过程中发生了什么？美洲组织选举观察团的作用》中所述的。CEPR的分析指出，随着农村（主要是住民地区）选票的计入，莫莱斯领先第二名卡洛斯·梅萨的百分比优势稳步增长。此外，他获得的47.1%票数与选前民调以及社会运动党的得票数一致。关于快速计票在选票83%时停止的骚动是预计划的，没有证据表明实际计票曾中断。


    随后的调查支持了CEPR的分析。由麻省理工学院（MIT）选举数据与科学实验室的研究人员发表在《华盛顿邮报》上的一篇评论文章标题为《玻利维亚将其10月选举斥为欺诈。我们的研究没有发现怀疑欺诈的理由》。《纽约时报》报道了其他三位美国学者进行的一项研究，质疑美洲组织的审计存在缺陷。该报道指出，“仔细观察玻利维亚选举数据表明，美洲组织的初步分析引发了对操票的质疑——并帮助让总统下台——这种分析是有缺陷的。”


    美洲组织的声明为反对抗议提供了动力。他们对选举的毫无根据的批评在国际上也被用来证明莫莱斯下台。作为对美洲组织主张的回，以及玻利维亚、华盛顿和渥太华抗议者表示不承认莫莱斯的胜利，玻利维亚总统同意让美洲组织对第一轮选举进行“具有约束力的”审计。意料之中，美洲组织的初步审计报告指存在“违规和操纵”，并要求由新的选举委员会监督举行新选举。


    在美洲组织发布初步审计报告后，美国国务卿迈克·庞佩奥（Mike Pompeo）更进一步表示，“所有参与了有缺陷的10月20日选举的政府官员和任何政治组织的官员都应该退出选举过程。”最初只是快速计票与最终计票结果之间易于解释的差异，演变成了“整个选举都是可的，任何与此有关的人都必须离开”的言论。


    在美洲组织常委会关于玻利维亚的特别会议上，安提瓜和巴布达代表批评了美洲组织玻利维亚选举团发布声明和报告的不透明方式。她指出该组织与玻利维亚政府达成了一系列协议，但这些实际上被抛弃了。许多拉美国家也认同这一观点。莫莱斯则表示，美洲组织“为北美帝国服务”。


    另一方面，美国和加拿大的代表赞扬了美洲组织在玻利维亚的工作。驻美洲组织的代表吹称，有两名加拿大技术顾问是玻利维亚审计团的一部分，且加拿大资助了破坏玻利维亚总统选举信誉的努力。在此，加拿大也是美洲组织的第二大贡献者，该组织一半的预算来自华盛顿。在题为《加拿大欢迎美洲组织玻利维亚选举审计任务的结果》的声明中，弗兰德伦（Freeland）指出，“加拿大赞扬美洲组织审计团在确保公平透明流程方面付出的无私工作，我们通过资金和专业知识支持了这一工作。”


    即使在多项学术和企业媒体研究证明了美洲组织审计团的党派性质，全球事务部继续推动该组织参与玻利维亚选举。在政变后选举的前夕，全球事务部的“加拿大在玻利维亚”账号推特写道：“加拿大很高兴支持美洲组织（OAS）在玻利维亚的选举观察团。”

