    and Ottawa insisted the elected government reach a settlement with CD over the
    “disputed” May elections before they would restore aid. Privately, however, they
    instructed CD leaders to maintain their intransigent attitude.


    Due to the unpopularity of the defeated political opposition, the US, Canada,
    and the EU also funded a parallel “independent” civic opposition movement. They
    funneled money to “human rights, democracy, and good governance” projects that
    fueled vociferous NGO criticism of alleged human rights abuses by the Lavalais
    government. Groups were funded to produce radio shows claiming the elections had
    been “fraudulent,” unite opponents of the “dictatorship,”” and organize anti-government
    demonstrations. Between 2000-2002, according to a Canadian International Development
    Agency (CIDA) report, its spending “was characterized by a shift in support to
    civil society.” CIDA spent $67.3 million in Haiti, which was largely channeled
    to NGOs. Though this funding was ostensibly “apol,” virtually without exception
    Haitian organizations receiving CIDA funding—either directly or indirectly via
    Canadian NGOs—opposed Aristide.


    In a December 2004 assessment of Canada’s “difficult partnership” with Haiti,
    CIDA remarked that by “engaging a coalition of key players” and'
  - '[PAGE 85]


    “providing sufficient resources,” Canada’s support for “civil society initiatives
    and Canadian NGO partners produced relatively good qualitative results.” The shift
    to civil society “contributed to building the capacity of non-governmental actors
    to generate grassroots demand for reform.”15


    As one example, CIDA-funded Development & Peace assisted its Haitian NGO partners
    “to become players to be reckoned with and to help an end to the political chaos
    caused by the current regime.” Through its Haitian partners, Development & Peace
    spent $1.4 million in Haiti from 2000-2003 working with over 70 local organizations
    “to improve the ... external circulation of information” and “to develop action
    and training plans, and to mobilize.” Development & Peace also organized a national
    symposium on strategies for fighting the “dictatorship” that was attended by representatives
    of forty Haitian groups. The symposium led to the creation of several regional
    networks of groups opposed to the government, which “started coordinating activities
    closely to develop synergy in action.”


    USAID channeled tens millions of dollars into unifying and galvanizing “civil
    society” opposition to Aristide’s government. Students, women, and union organizers
    in Jacmel told a US human rights delegation that USAID trained us and how to organize,
    and we organized the groups you see here to demand the corrupt government of Aristide
    brought down.


    In December 2002, the crown jewel of the “civic” wing of the opposition was unveiled.
    The Group of 184 presented itself as a broad-based citizens movement encompassing
    184 organizations representing human rights groups, women, peasants, intellectuals,
    students, and more. Claims of pluralism notwithstanding, the Group of 184 was
    dominated by a small segment of Haitian society. The Group of 184 grew out of
    the Initiative de la Société Civile, “a collection of business and religious elite
    organisations”'
- md: '

    funded by USAID and CIDA which, according to the UK-based Haiti Support Group,
    was “wholly unrepresentative of the Haitian majority.” Light-skinned sweatshop
    industrialists who opposed raising the minimum wage, Andy Apaid Jr. and Charles
    Henri Baker, dominated the Group of 184’s leadership.


    Lawyer and human rights researcher Thomas Griffin described how the Group of 184
    grew out of USAID-funded groups like the International Foundation for Electoral
    Systems (IFES), which invested millions in building up the “civic opposition.”
    A University of Miami Human Rights Investigation explained that IFES:


    - Formulated groups that never existed, united pre-existing groups, gave them
    sensitization seminars, for people to attend, paid for entertainment and catering,
    and basically built group after.

    - They reached out to student groups, business ... [and] human rights groups—which
    they actually paid off to report human rights atrocities to make Aristide look
    bad. ... They bought journalists, and the IFES associations grew into the Group
    of 184 that became a solidified opposition against Aristide.


    Ottawa supported the Group of 184 and its member organizations. CIDA spent $13
    million on “civil society, democracy and human rights” themed projects implemented
    by NGOs affiliated with the Group of 184 and Canadian aid money helped pay to
    elaborate the Group of 184’s “social contract.”


    The Group of 184 and CD staged numerous demonstrations denouncing the government
    and calling for Aristide to resign. Students at the State University (where many
    foreign funded NGO leaders worked as professors) turned against the government.
    Clashes between pro- and anti-government demonstrators became increasingly frequent,
    as pro-Lavavalas popular organizations mobilized to counter (typically much less
    numerous) Group of 184 demonstrators. Violent confrontations escalated from stone
    throwing to attacks with weapons, and on rare occasions firearms. Tensions led
    to isolated cases of political killings, such as the murder of journalist Brignol
    Lindor by a pro-Lavalas group, in response to the killing of one of their members
    by opposition supporters in Petit Goave. As political scientist Robert Patton
    Jr. argued, some pro-Lavavalas popular organizations began “threatening the opposition
    because they believe that it is purposefully exacerbating the crisis to generate
    a chaos that would nurture the return of the military.”


    The popular organizations’ concerns were not theoretical. In July and December
    2001, former soldiers attempted to overthrow Aristide. They conducted a low-level
    war against the government and its supporters through cross-border raids from
    the Dominican Republic. The wealthy elite and leading members of the CD secretly
    bankrolled the “insurgency,” which combined former soldiers of the disbanded military
    and notorious FRAPH leaders such as Louis-Jodel Chamblain.


    When pro-Lavalas popular organizations clashed with anti-government protesters,
    the civic and political opposition accused the government of using gangs to crack
    down on dissent. The opposition also cited gang violence and drug trafficking
    as further evidence of the nefarious designs of the Lavalas government and its
    supporters. These problems, however, afflicted the country—especially Port-au-Prince’s
    fast-growing slums—before and after Aristide’s second mandate. Government supporters
    from the slums were relentlessly demonized as “chimères” (thugs) and “Lavalassian
    hordes.” Some members of the civic and political opposition called Aristide a
    “fascist” and claimed his government was committing “genocide.”


    Less partisan observers found that the systematic human rights violations and
    political repression that characterized the Duvalier dictatorship and military
    juntas were completely absent. In the context of rising political tensions, cross-border
    paramilitary attacks and foreign economic strangulation, Amnesty International’s
    reports showed that at most 30 political murders could be attributed to the police
    or pro-Lavalas groups (only tenuously linked to the government). There was no
    basis for comparison with previous (or subsequent) governments. According to Peter
    Hallward, “remember the basic numbers: perhaps 50,000 dead under the Duvaliers
    (1957-1986), perhaps 700 to 1,000 dead under Namphy/Avril (1986-1990), 4,000 dead
    under Cedras (1991-1994) and then at another 3,000 killed under Latortue (2004-2006).”
    Human rights lawyer Brian Concancion Jr. argued that the opposition’s claims of
    political persecution simply did not align with the reality on the ground:


    “The press was so free in [Aristide’s second] term that in the lead up to coup
    d’état of 2004 you had the press openly calling for the overthrow of the government.
    In the US, that would not be tolerated. That would be beyond free speech. My expectation
    is that it would be illegal in Canada as well. There was immense freedom of assembly.
    There were assemblies that would definitely have been controlled in the U.S. or
    Canada because they were violent and illegal. Because they were done by the opposition,
    the Aristide government didn’t touch them. So it’s curious that someone like that
    is called a dictator.”


    Even with massive funding, the anti-government opposition could not expand its
    support beyond a small urban, “middle class” base. “Everybody knows that Aristide
    was bad,” explained Paul Farmer. “Everybody, that is, except the Haitian poor—85%
    of the population.” Aristide’s popularity remained the solid in spite of a deteriorating
    economic situation and relentless vilification by NGOs and the political opposition.
    Polls commissioned by USAID from 2002 and 2003 obtained by New York Times journalist
    Tracy Kidder showed consistent support for Aristide. Six months after the coup,
    a poll “showed that Aristide was still the only figure in Haiti with a favourability
    rating above 50%,” admitted US ambassador James Foley in a confidential cable.


    Group of 184 demonstrations were regularly dwarfed by pro-Lavavalas counter-rallies.
    By the end of 2003, the artificially inflated opposition movement had managed
    to turn only a small segment of the population against the government. “To the
    distress of the Group of Friends [Canada, US and France,” observed David Malone
    of Foreign Affairs Canada, “Aristide remains the most potent political force in
    Haiti.” The NGOs, Group of 184, and CD could not mount a serious political challenge
    to the government. They required direct intervention from the imperial triumvirate
    and their Canadian NGO partners legitimated the US, French, and Canadian invasion.


    A couple of days before Aristide took office in 2001, many Canadian NGOs called
    for Aristide’s overthrow. On December 15, 2003, Québec’s NGO umbrella group, Association
    québécoise des organismes de coopération internationale (AQOCI), called for the
    Canadian government to “publicly denounce” Aristide and his “regime,” which was
    “rife with human rights abuses.” Development & Peace went even further in a December
    16, 2003 letter to prime minister Paul Martin, calling on Canada to demand that
    Aristide resign and to help put in place an international force to disarm Aristide’s
    supporters.


    Two months later the Concertation Pour Haiti (CPH), an informal group of half
    a dozen NGOs including Development and Peace, AQOCI, and Entraide Missionnaire,
    branded Aristide as a “tyrant,” and his government a “dictatorship” and called
    for “regime of terror,” for Aristide’s removal.


    The NGOs were pushing on an open door. On January 31 and February 1, 2003, Ottawa
    played an important role in consolidating the international forces that would
    carry out the coup. Jean Chrétien’s government organized the “Ottawa Initiative
    on Haiti” to discuss that country’s future. No Haitian officials were invited
    to this assembly where high-level US, Canadian and French officials decided the
    elected president “must go,” the army be recreated and the country under a Kosovo-like
    UN trusteeship.


    Present at the Ottawa discussion were Canadian health (and later foreign) minister
    Pierre Pettigrew, US assistant secretary of state for the Western Hemisphere,
    Otto Reich, another state department official, Mary Ellen Gilroy, assistant secretary
    general of the Organization of American States, Luigi Einaudi, El Salvador’s foreign
    minister Maria de Avila, and France’s minister of security and conflict prevention
    Pierre-André Wiltzer. They were all invited to the government’s Meech Lake Conference
    Centre in Gatineau, Québec by secretary of state for Latin America and minister
    for La Francophonie Denis Paradis.

