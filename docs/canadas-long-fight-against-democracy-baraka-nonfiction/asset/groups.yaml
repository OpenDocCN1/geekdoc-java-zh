    已故的著名记者米歇尔·瓦斯尔（Michel Vastel）在2003年3月15日的《时事》（L’actualité，魁北克版的《麦克伦杂志》）中介绍了引发公众关注的聚会。在题为《海地将受联合国管辖？》的文章中，瓦斯尔写道，他们讨论了阿里斯德离开的可能性、潜在的托管以及海地军队的回归。政变后，瓦斯尔表示，他关于这次私人会议的消息来源是他的朋友丹尼斯·帕拉迪（Denis
    Paradis），法国官员也证实了有关会议的信息。帕拉迪本人否认瓦斯尔对“渥太华海地倡议”的描述，但瓦斯尔和《时事》从未撤回过该报道。在政变后的数次采访中，瓦斯尔坚持他最初的文章，并声称随后举行了多次会议，参与者包括之前的那些人员，以及美国国务卿科林·鲍威尔（Colin
    Powell）。


    帕拉迪在声称自己被瓦斯尔误解的同时，也明确表示，“渥太华海地倡议”确实讨论了对外地的干预。在2004年9月接受研究员安东尼·芬森（Anthony Fenton）的采访时，帕拉迪解释道，“有一个贯穿整个会议的主题……保护责任。”作为自由党外交政策的亮点，“保护责任”原则主张，当发生严重侵人权行为时，国际社会有义务进行干预，这高于对国家主权的考量。在2004年2月11日加拿大驻波德太子斯使馆给外交部的一封经过高度审查的电报中，大使肯尼斯·库克（Kenneth
    Cook）解释道，“阿里斯德总统显然是当前危机的严重升级因素”，有必要“考虑各种选择，包括是否可以为履行保护（责任）义务提供辩护”。根据一项信息公开法请求，外交部监测了公众对瓦斯尔报道的反应。在与外交部的邮件往来中，加拿大驻海地大使肯尼斯·库克指出，在《时事》收到的关于政权更迭的70封信中，“大多数是积极的”。因此，人们怀疑帕拉迪向瓦斯尔的泄密是一个试风石，旨在衡量反对派、海地社区和其他社会组织的反应。


    出于显而易见的原因，海地政府对这次会议并不满意。在引起公众关注几天后，海地外交部长要求与加拿大大使会面，而海地大都会电台（Radio Metropole）报道称，帕拉迪给海地外交部长写了信，告诉他渥太华会议对其政府不构成威胁。


    在国际外交努力和公民社会反对的同时，一场针对政府的低强度战争正在进行。2001年至2003年间，在多米尼共和国边界的贝拉德雷（Belladere）等城镇，数十名拉瓦拉斯（Lavalas）成员和支持者被杀。2001年7月28日，几个警察局遭到袭击。在一次更严重的政变图中，十多名枪手于2001年12月17日冲进总统宫。他们利用直升机和50毫米径机枪杀死了四人并短暂占领了建筑。五名攻击者被警察击杀。攻击者通过广播宣布阿里斯德已不再是总统，现在由盖·菲利普（Guy
    Philippe）指挥警察。据报道，这次袭击在圣多黎各受到了前警察局长菲利普和让·雅克·诺（Jean-Jacques Nau）的赞扬。


    菲利普和其他四个人（包括保罗·塞尔林，Paul Arcelin）被多米尼当局逮捕。一名多米尼军官向美联社表示，“这些人正在接受调查，因为他们被指控试图进入海地企图针对民选政府进行阴谋。”塞尔林与菲利普的关系揭示了准军事组织与民主联盟（Convergence
    Démocratique）之间的联系，塞尔林是该联盟在多米尼共和国的代表。


    塞尔林似乎一直在与国际共和基金（IRI）合作。在2004年7月的《沙龙》（Salon）杂志中，马克斯·布鲁门哈尔（Max Blumenthal）写道：


    其他人描述了IRI与反叛分子之间更正式的联系。法国日报《世界报》（Le Monde）驻多米尼共和国首席记者让·米歇尔·卡罗瓦（Jean Michel Caroit）表示，他曾在2003年12月在圣多黎哥酒店举行的一次IRI会议上看到菲利普的政治顾问保罗·塞尔林。卡罗瓦当时与几位与会者在大厅喝饮料，他表示会议召开得“相当谨慎”。他的说法与一位海地记者的吻合，后者匿名向《沙龙》杂志透露，塞尔林作为联盟在多米尼共和国的代表经常在圣多黎各参加IRI会议。


    塞尔林曾是蒙特利尔魁大学（Université du Québec à Montréal）的教授，他后来宣布自己为这场推翻阿里斯德的军事起义的“精神核心”和“政治领袖”。政变后，《蒙特利尔公报》（Montréal
    Gazette）报道道：“塞尔林是一个反叛分子和2004年政变的自封建筑师，他不辞于表达自己在推翻阿里斯德过程中的作用，并描述了从加拿大打给海地反叛领袖盖·菲利普的电话，用以讨论政变策略。”塞尔林告诉《公报》：“两年前，我在圣多黎各遇到了盖·菲利普，我们每天在一起花10到15小时，策划对付阿里斯德。”他补充道，“我们（塞尔林和菲利普）不时通过森林秘密越过边界，策划针对阿里斯德的行动，并与反对派会面。”


    《公报》还透露，塞尔林于2004年2月初在蒙特利尔会见了皮埃尔·佩特（Pierre Pett）：“他利用这次访问以及其嫂（前保守党议员尼科尔·塞尔林-罗伊，Nicole
    Arcelin-Roy）的影响力会见了卫生部长皮埃尔·佩蒂格鲁（Pierre Pettigrew）……‘我向他解释海地的现实，”塞尔林从钱包里拿出佩蒂格鲁的名片说道，“他承诺向加拿大政府汇报我说过的话。”


    2003年底，菲利普和前士兵们加强了针对政府目标的跨界攻击。随后，他们加入了一个由前死刑队首领领导的戈纳伊韦（Gonaïves）黑帮联盟。2004年2月5日，反叛分子占领了戈纳伊韦，这是该国第四大城市。这支武装精良的力量横扫海地，杀了警察，清空了监狱并焚烧了公共建筑。


    最初，外交部长比尔·格拉姆（Bill Graham）谴责了叛乱，表示加拿大支持民选政府。“阿里斯德已被当选，他必须完成任期，”格拉姆在2004年1月中旬《新闻》（La
    Presse）的一篇题为《加勒比告诉保罗·马丁阿里斯德在地的受欢迎》的文章解释道，“如果今天举行新选，他可能会再次当选。”


    布什政府以类似的方式公开回应了这次叛乱。可能是为了推卸责任并根据事发展进行对冲，美国国务卿科林·鲍威尔在2月12日向参院外交委员会表示：“政府的政策不是政权更迭。阿里斯德是海地的民选总统。”鲍威尔五天后重申了这一立场：“我们不能接受那种认为民选总统必须被暴徒和那些给人民带来恐怖暴力的人强迫下台的说法。”


    在批评反叛者的同时，美加两国官员加强了筹码。他们要求阿里斯德与固执的政治反对派进行谈判。2004年2月中旬，渥太华派遣了一个代表团前往波德太子斯，向阿里斯德传达了一个“坚定信号，他必须履行他的义务，”加拿大外交部长解释道。格拉姆声称该任务的目标是“创造一个反对派可以进入讨论的局面”，但实际目的是进一步削弱民选政府。2月22日，反叛分子占领了该国第二大城市海地港（Cap
    Haïtien）。数十名警察被杀，更多人放弃岗位投奔武装精良的反叛分子。当反叛分子向波德太子斯进同时，国际社会忽视了民选政府要求“几十名”维和者在这个没有军队的国家恢复秩序的。2月26日，在阿里斯德下台三天前，美洲（OAS）常委会呼吁联合国安会“采取一切必要和适当的紧急措施应对海地恶化的局势”。加勒比共同体（CARICOM）呼吁安会派遣紧急军事任务小组协助阿里斯德政府。这一援助请求被世界上最强大的几个国家断然拒绝。


    到月底，枪手已攻占了除波德太子斯和郊反叛军以外的所有主要城市。总统的支持者在首都筑起路障。他们封锁了这座两百万城市的主干道并准备战斗。尽管大部分国土处于反叛军手中，但随着亲政府警察夺回了几个城市，政府的前景开始改善。一批枪支、防弹衣和弹药正从南非运往牙加斯顿，是应加勒比共同体要求的。传闻盛传委内瑞拉已同意派遣士兵保护宪法政府。最重要的是，波德太子斯的规模使得几百人很难攻克。

