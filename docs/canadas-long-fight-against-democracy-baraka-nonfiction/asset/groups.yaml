    # CONCLUSION


    Why has there never been a coup in Canada? There’s no Canadian Embassy in Ottawa.


    Canadian leaders are keen to project the myth that Canada is a uniquely democratic
    actor on the world stage, with an exceptional history of supporting human rights
    and struggles for equality. This book has revealed that Ottawa’s foreign policy
    is not driven by democracy, but by the interests of corporate Canada, which are
    often anathema to democracy.


    By examining the history of Canadian support for military coups, this book explodes
    the myth that Canada promotes democracy around the world. In fact, Ottawa has
    repeatedly undermined elected, often progressive, governments and in doing so
    has helped destroy projects to build more equitable and democratic forms of governance
    across the globe.


    By our calculation, the Canadian government has passively or actively backed over
    twenty coups. Ottawa has helped overthrow elected governments even when the social
    costs were, as anyone could have expected, enormous. To cite only a few examples:
    Mobutu’s dictatorship lasted over three decades in Congo; thousands were killed
    after the 2004 coup in Haiti; and the 2014 ouster of Victor Yanukovych in Ukraine
    led to a civil war and contributed to Russia’s invasion in 2022. By backing the
    overthrow of Lumumumba and Mobutu’s rise to power, by participating in the coup
    against Aristide and propping up his successor, and by assisting in the removal
    of Yanukovych, the Canadian government helped set the stage for the horrors that
    followed.'
