    Foreign resource companies and Western geopolitical interests were the main beneficiaries
    of UN operations in the Congo. The leading Congolese beneficiary of the UN mission
    was Joseph Mobutu who went on to run the country for over three decades.


    Mobutu developed close ties to Canadian political and military officials. In a
    1992 interview Canadian diplomat Michel Gauvin said that “during my time in Léopoldville
    as Chargé d’Affaires [from 1961 to 1963] I got to know Mobutu very well, I was
    one of the only whites invited to the baptism of one of his girls.”38 In The Eye
    of the Storm: A History of Canadian Peacekeeping, Fred Gaffen explains:


    Mobutu learned to trust the Canadian officers. This trust was of inestimable value
    in arranging ceasefires between Congolese and UN forces, negotiating the release
    of prisoners as well as liaison between UN and Congolese authorities. Mobutu,
    who became president of the Democratic Republic of Zaire, visited Canada in May
    of 1964. At that time, he thanked those Canadian officers who had contributed
    so much to the maintenance of the unity of the country.39


    Kwame Nkrumah, who Canada would help overthrow a few years later, described the
    UN’s complicity in Lumumba’s murder:


    Somewhere in Katanga in the Congo ... three of our brother freedom fighters have
    been done to death. ... about their end many things are uncertain, but one fact
    is crystal clear. They have been killed because the United Nations Patrice Lumumba
    himself as Prime Minister had invited to the Congo to preserve law and order,
    not only failed to maintain that law and order, but also denied the lawful government
    of the Congo other means of self-protection. History records many occasions when
    rulers of states have been assassinated. The murder of Patrice Lumumba and of
    his two colleagues, however, is unique in that it is the first time in history
    that the legal ruler of a country has been done to death with the open connivance
    of a world organization in whom that that ruler put his trust ... instead of preserving
    law and order, the United Nations declared itself neutral between law and disorder
    and refused to lend any assistance whatsoever to the legal government in suppressing
    the mutineers who had set themselves up power in Katanga and South Kasai. When,
    in order to move its troops against the rebels, the government of the Congo obtained
    some civilian aircraft and civilian motor vehicles from the Soviet Union, the
    colonialist powers at the United Nations raised a howl of rage while, at the same
    time maintaining a discreet silence over the buildup of Belgian arms and actual
    Belgian military forces in the service of the rebels ... when Lumumba [after Kasavubu’s
    coup] wished to broadcast to the people explaining what happened, the United Nations
    in the so-called interest of law and order prevented him from speaking. They did
    not, however, use the same force to prevent the mutineers of the Congolese army
    from seizing power in Leopoldville and installing a completely illegal government
    ... the United Nations sat while the so-called Katanga sat, which is entirely
    Belgian controlled, imported aircraft and arms from Belgium and other countries,
    such as [apartheid] South Africa, which have a vested interest in the suppression
    of African freedom. The United Nations connived at the setting up, in fact of
    an independent Katanga state, though this is contrary to the Security Council’s
    own resolutions. Finally, the United Nations, which could exert its authority
    to prevent Patrice Lumumba from broadcasting, was, so it pleaded, quite unable
    to prevent his arrest by mutineers or his transfer, through the use of airfields
    under Nations control, into the hands of the Belgian-dominated government of Katanga.40


    The UN mission to the Congo, in which Canada participated actively, facilitated
    a major injustice and crime against the Congolese people.


