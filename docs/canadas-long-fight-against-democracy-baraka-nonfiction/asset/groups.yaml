    ## 巴西，1964年


    1964年，巴西军事政府推翻了由左倾总统胡安·古尔特（João Goulart）领导的国家民选政府。古尔特在1961年8月总统詹尼奥·夸德罗斯（Jânio
    Quadros）辞职后上台，试图通过实施他的“基础改革”（Reform de Base）计划将巴西从政治和社会经济危机中解救出来，该计划包括消除成人文盲字、增加对外国公司利润的税收以及包括土地改革在内的若干再分配措施。古尔特还想通过赋予文盲字人和低级军官投票权来扩大选举权。他提议将国民收入的15%投入教育。为了支付这笔费用，政府计划引入比例所得税，并加强对跨国公司利润转移的控制。


    此外，古尔特推行了独立的外交政策。他肯定了古巴的自决权，同时与苏联和中国保持友好关系。古尔特希望华盛顿在援助条款上更加灵活，并批评了肯尼迪政府的“进步联盟”——这是一个旨在促进受援国反共主义的发展计划。肯尼迪政府对这种他们认为是“对进步联盟的公开宣战”的行为感到愤怒。¹


    当古尔特威胁要加强巴西与苏联的经济合作时，美国大使林肯·戈登（Lincoln Gordon）声称，他正威胁要创造“充其量是第二个南斯拉维亚，最坏的情况下是第二个古巴”。戈登表示，古尔特的威胁“再次让我对古尔特完全无法担任大国总统的无能印象深刻”。²如果古尔特继续实行他的“基础改革”发展模式，大使表示“我们必须考虑所有可能的手段来促进政权更迭”。³


    华盛顿、渥太华以及巴西商界的领军阶层反对古尔特的外交政策和基础改革。在他执政两年半后，巴西军方和保守政治势力组织了将其下台的行动。


    当1964年4月政变发生时，华盛顿给予了充分支持。曾几何，林登·约翰逊（Lyndon Johnson）总统敦促戈登大使采取“我们能采取的一切步骤”来支持移除古尔特。在戈登与华盛顿之间的一份解密电文中，这位驻巴西利亚利亚的大使承认美国参与了“对支持民主街游行的秘密支持……以及在国会、军队、友好领导人及学生团体、教会和商界鼓励民主和反共情绪”。⁴


    渥太华未能公开谴责古尔特被推翻。“加拿大对1964年军事政变的反应是谨慎、礼貌且与美国的言辞保持一致的，”巴尔博萨（Barbosa）在《巴西与加拿大》中写道。


    华盛顿对政变的默许支持固然重要，但加拿大公司对古尔特下台的支持同样重要。这家位于多伦多的法鹰桥公司（Falconbridge，原Brazilian Traction）之所以被称为“加拿大章鱼”，是因为其触角遍及巴西的许多领域。⁵在政变期间，法鹰桥的总裁安东尼奥·加洛蒂（Antonio
    Gallotti）并未掩盖其对被激进分子渗透的政府机构的参与。⁶在政变前夕，法鹰桥总裁格兰特·格莱斯柯（Grant Glassco）评论道，“新政府是由具备能力和正直的人组成的。”⁷古尔特下台后，一个让公司出口利润变得困难的政府消失了。⁸通过停止古尔特政府的阻碍，公司更容易出口利润。⁹在1964年政变后，《金融邮报Financial
    Post）指出，“该股票的股价从4月的1.95翻倍到4月的高位3.06。”⁰在1965年至1974年间，法鹰桥从巴西榨取了3.4亿美元（20亿）。¹¹当法鹰桥的加拿大总裁温特斯（Winters）被问及为何公司利润在60年代后期增长如此迅速时，他的回答很简单：“革命。”¹²在接手法鹰桥之前，温特斯是加拿大的贸易部长。同样，杰克·尼尔森（Jack
    Nicholson）在50年代是巴西矿业公司的首席执行官，并在皮尔森政府中担任过多个内阁职位。¹³在政变一年前，米切尔·夏普（Mitchell Sharp）从贸易部副部长变为法鹰桥的副总裁。皮尔森任命他为财政部长。


    针对古尔特的政变带来了一个统治巴西二十多年的军事独裁。该政权作为邻国右翼独裁政权的反革命堡垒，并获得了华盛顿、渥太华以及智利在内的支持。


