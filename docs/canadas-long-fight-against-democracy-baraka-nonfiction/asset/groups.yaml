    # 1961年刚果民主共和国


    加拿大军队在推翻刚果民主共和国首任帕特里斯·卢蒙巴（Patrice Lumumba）的过程中发挥了重要作用。在仓促组织的独立最后几天里，刚果人选出了强权而有力的反殖民主义者卢蒙巴，他曾被比利时人囚禁。当选后，他试图实现一个独立的、去殖民的、泛非洲主义的刚果愿景，这引起了比利时、美国和加拿大官员的愤怒。卢蒙巴担任总理仅维持了81天，外国势力和国内敌人就策划了他的谋杀。


    受卢蒙巴激发的政治力量威胁到了比利时维持对这一新独立国家资源、特别是对巨头联合矿业公司（Union Minière）控制的计划。为了破坏这位当选总理，前殖民国家支持了东部加丹加（Katanga）省的分离运动，并支持政变和对卢蒙巴的暗杀。在此期间，渥太华是比利时/美国政策的自愿伙伴。


    比利时人在刚果实施了极为压迫的殖民政权。他们很大程度上将非洲人排除在高教育和职业职位之外，而外国公司掠夺其自然资源。许多加拿大公司对维持刚果及整个非洲的殖民体系有既利益。


    但卢蒙巴与加纳总统夸梅梅·恩克鲁玛（Kwame Nkrumah）结盟，希望能够“将整个非洲大陆从殖民主义和帝国主义中解放出来”。2两国领袖起草了一份关于“非洲联盟”的秘密协议，该联盟将设在利奥波维尔（Leopoldville，1966年更名为金沙萨）。此外，卢蒙巴对与苏联合作以实现其目标的开放态度，似乎证实了西方统治阶层最的的。联合国官员公开蔑视卢蒙巴具有独立精神的国内和外交政策。加拿大总理约翰·迪芬贝克（John
    Diefenbaker）支持联合国秘书长达格·哈马舍尔德（Dag Hammarskjöld）的反卢蒙巴路线。迪芬贝克的助手H.·巴希尔·罗宾逊（H. Basil
    Robinson）写道：“在政府决策和演讲中，他竭尽所能为哈马舍尔德提供支持。”3 迪芬贝克支持了加丹加省的分离运动，以动摇这位刚果领导人的新政。4 独立后第二天，资源丰富的东部省份加丹加宣布独立。联合矿业公司立即向分离政府缴纳税款，而非金沙萨的合法机构。那笔款项占了加丹加预算的70%。5
    当华盛顿和联合国官员敦卢蒙巴请求联合国部队来平息首都金沙萨的动荡时，卢蒙巴最终要求一支国际部队阻止国家东部的叛乱。


    尽管刚果当局对他们的参与保留意见，仍有近2000名加拿大士兵加入了联合国刚果团（ONUC）。卢蒙巴希望“考虑国籍和种族因素”，但这一点被自身很有种族意识的加拿大官员忽视了。6
