    Even after a number of academic and corporate media studies demonstrated the partisan
    nature of the OAS audit mission, Global Affairs continued to promote the organization’s
    involvement in Bolivia’s elections. In the lead up to the post-coup election,
    Global Affairs’ Canada in Bolivia account tweeted, “Canada is pleased to support
