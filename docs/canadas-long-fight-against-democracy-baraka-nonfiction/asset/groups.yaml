    2014年迈丹广场抗议中亚努科维奇被推翻，导致他被由华盛顿挑选的政府违宪地推翻，这被《卫报》专栏作家西马斯·米尔恩（Seumas Milne）称为“将一个亲西方政府强加给俄罗斯最神经质、政治最分裂的邻国”。10
    米尔恩在2014年4月预测，这种干预的影响将是：“美国和欧盟在乌克兰用力过猛。无论是俄罗斯还是西方强国都不都不直接干预……但在1914年百年后，意外后果的风险将显而易见——随着大国冲突回归的威胁日益增长。通过谈判结束危机的压力至关重要。”11


    渥太华和乌克兰加拿人大会在1991年苏联解体之前就开始协助民族主义的、反俄罗斯的乌克兰人。12 在20世纪90年代，加拿大在塑造这个新独立国家的政治方面发挥了超比例的作用。加拿大是波兰之后第一个承认乌克兰独立的国家，也是第一个提供贷款的西方国家。加拿大人帮助起草了该国的首部宪法，许多加拿大的顾问（通常来自乌克兰裔社区）被分配到乌克兰部委和机构的职位。甚至独立后使用的货币也是在加拿大印刷的。


    在2004年橙色革命发生前，加拿大向抗议总统选举结果不公的团体输送了数十万美元，在那场选举中，亚努科维奇最初被宣布为胜利者。橙色革命组织后的领先团体Pora从加拿大大使馆收到了3万美元，这是它的第一笔捐款。据《环球与邮报》（The
    Globe and Mail）报道，加拿大驻使安德鲁·罗宾森（Andrew Robinson）“组织了西方大使的秘密会议”，以支持亚努科维奇的竞争对手维克多·尤申科（Viktor
    Yuschenko）。2004年的抗议和随后的重选加深了该国地理和语言上的分歧。


    在迈丹起义之前的二十年里，加拿大向乌克兰公民社会的反俄罗斯元素输送了数千万、甚至数亿美元。13 在2007年7月访问乌克兰期间，外交部长彼得·麦凯（Peter
    MacKay）宣布将提供1600万美元的民主改革援助以“制衡”俄罗斯。麦凯指出：“存在外部压力，最是来自俄罗斯。我们希望确保他们感受到国际社会的支持。”2013年，美国助理国务卿维多利亚·努兰德（Victoria
    Nuland）吹嘘说，民主基金会（NED）、美国国际开发署（USAID）和其他美国政府机构自1991年来已投入50亿美元支持乌克兰倾向西方的力量。14 作为渥太华与反对活动人士密切关系的信号，在整个迈丹抗议期间，加拿大大使馆当地发言人因娜·察萨科娃（Inna
    Tsarkova）是AutoMaidan的著名成员，这是一个反政府组织，在亚努科维奇官邸前组织抗议并要求总统下台。15 作为大使馆的项目官，察萨科娃曾领导过获取加拿大资金的会议。16
    迈丹抗议开始两个月后，察萨科娃的汽车被焚烧。这位加拿大大使馆的老员工在两天后接受一个乌克兰加拿大电台节目采访时说：“如果我们站得不够坚定，你知道这意味着乌克兰在民主和真正自由方面的终结。它将回到20世纪30年代的苏联帝国，人们会被直接关进监狱杀掉。”17


    迈丹抗议的爆发是因为亚努科维奇拖延签署《欧盟-乌克兰协会协定》。这项自由协议是该国可能加入欧盟进程中的一步，这对许多乌克兰人（尤其是该国西部和中部的人）很有吸引力。然而，该协议的争议性比加拿大媒体和官员描述的要大。例如，拥有欧洲第二大陆面积的乌克兰，其城市利沃夫比靠近普拉格、维也纳和柏林的靠近俄罗斯的乌克兰东部城市哈尔夫。此外，乌克兰东部南部曾是俄罗斯帝国的一部分，而现代乌克兰西部曾是波兰-立陶宛帝国和奥匈帝国的一部分，被称为加利利西亚。


