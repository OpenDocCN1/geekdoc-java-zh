    在巴拉圭被美洲组织（OAS）暂停期间，来自美国、加拿大、海地、洪都拉斯和墨西哥的代表前往巴拉圭，调查卢戈（Lugo）下台的情况。外交部长迪安·阿布隆奇（Diane
    Ablonczy）表示，美洲组织使命的目标是“从巴拉圭提供重要的背景信息以告知国际反应。重要的是我们要避免草率下结论，并关注巴拉圭人民的最大利益。”代表团认为美洲组织不应暂停巴拉圭，这令许多南美国家感到不悦。


    在被赶下三周后的一次采访中，卢戈暗示渥太华对巴拉圭与其他拉丁美洲国家进行地区合作的努力持有敌意。“目前美国、加拿大、墨西哥与南美之间存在这种极化对立，我们一直在寻找区域性的替代方案。政变多次尝试攻击对[南美]地区整合的努力。加拿大劳工会和新成立的国际工会联合
    IndustriALL Global Union 均批评了保守派承认新政府的行为。”


    除了农业出口外，巴拉圭还依赖矿业，加拿大公司在该行业拥有一些值得关注的投资。在几次场合，被推翻的总统声称加拿大在该行业的经济利益促成了政变。政变一个月后，卢戈告诉他的支持者：“那些推动政变的人是为了巩固与跨国公司信拓（Rio
    Tinto）的谈判，背叛了我们国家的主权利益。” IndustriALL Global Union 同意总统的观点，向信拓首席执行官发送了一封信。IndustALL
    Global Union 总秘书于尔基·莱纳（Jyrki Raina）在信中写道：“信拓与加拿大政府有着传奇般的关联，它迅速代表总部位于蒙特令的信拓铝业就一项价值40亿美元的铝厂恢复谈判。”该劳工联邦要求“信拓公开披露其对巴拉圭政变以及推翻费尔南多·卢戈这一合法当选民主政府行为的任何利益关系或参与。”


    2010年，位于蒙特令的信拓集团子公司 Rio Tinto Alcan 开始游说巴拉圭政府提供补贴电价，以便在帕拉纳河附近建立一座大型铝厂。该公司正寻求一份为期30年的合同，这可能导致巴拉圭政府花费数亿美元，而他们获得了渥太华的支持。根据国际媒体报道，负责巴拉圭外交关系的驻布宜诺斯艾利斯加拿大大使馆代表该政府进行了游说。卢戈政府对该项目存在分歧，该项目消耗的能源将超过该国650万人口的总消耗量，并以其他多种方式损害环境。在卢戈下台三周前，代表反对党的副总统费德里科·弗兰科科（Federico
    Franco）向《最后一报》（Ultima Hora）报抱怨道：“我告诉共和国总统（卢戈）：如果最终副部长（梅尔塞尔德斯·卡内斯）要反对它，你为什么还派我去加拿大研究这个[铝]项目呢。”


    政变后，副总统继任总统，并宣布将快审与信拓铝业的谈判。从那以后，新自由主义和哥伦拉多党的统治在巴拉圭依然稳固。


    # 乌克兰，2014年


    在2010年至2014年间，加拿大发起了一场旨在推翻乌克兰总统的运动，该总统赢得选举被欧洲安全与合作组织（OSCE）称为“一次令人印象深刻的民主展示”。1这种选举干预发生在两个阵营之间激烈且有时带有暴力的竞争背景下，其中一方位于乌克兰西部，与西欧和北美结；另一方位于乌克兰东部，倾向于俄罗斯。


    2010年乌克兰总统选举和2012年议会选举由维克托·亚努科维奇（Viktor Yanukovych）及其地区党赢得。他的胜利得益于乌克兰东西大部分讲俄语地区的选票。渥太华派遣了观察员监督这些选举。胜利后，亚努科维奇通过立法，将乌克兰在北约与俄罗斯日益激化的地缘政治冲突的中立立场法化。此举并未受到渥太华的欢迎，渥太华是北约向东扩张乌克兰的坚定支持者。


    自苏联早期以来，渥太华一直试图破坏俄罗斯与乌克兰之间的关系。例如，1940年，联邦政府协助建立了民族主义和反苏联的乌克兰加拿大大会。1952年，外交部开办了加拿大国际电台的乌克兰频道，以传播反苏联观点。此外，加拿大接收了数千名二战后从欧洲逃亡的乌克兰纳粹合作者。2这些部分散裔群体世代相传的右翼历史叙事通过许多赞美纳粹合作者的纪念碑得到了证实，其中包括位于安大略省奥克维尔市圣弗拉基米尔乌克兰公墓的一座纪念纳粹卫军乌克兰加利西亚师团的纪念碑。


    加拿大国家与乌克兰民族主义者之间的亲缘一直持续到21世纪。这种联盟最广为人知的例子之一可以在副总理克里斯塔·弗里兰（Chrysta Freeland）的个人历史中找到，她的祖父米哈肖·乔米亚克（Mikhailo
    Chomiak）是二战期间的乌克兰纳粹宣传员。乔米亚克在属于犹太人的公寓里制作纳粹报纸。战后，他移民到加拿大，并与孙女克里斯塔一起编写了《乌克兰百科全》，这是一个“在其历史叙述中采取强硬、极右和反苏联立场的学术项目”。3


    亚努科维奇试图在俄罗斯和西方之间寻求中立。作为回应，渥太华立即致力于破坏他的政府。在亚努科维奇当总统几个月后，哈珀（Harper）总理宣布：“存在令乌克兰加拿人和加拿大政府关注的涉及人权和法治的问题，我将与亚努科维奇总统讨论这些问题。”4乌克兰加拿大大会（UCC）主席保罗·格罗德（Paul
    Grod）和其他这一极端民族主义组织的代表在哈珀2010年10月访问乌克兰期间陪同总理。在宣布参与时，UCC的新闻稿称：“乌克兰政治领导层近期采取的步骤严重破坏了该国的宪法、民主机构、对历史记忆和国家身份的保护，主权和领土完整。”5


    访问期间，斯蒂芬·哈珀（Stephen Harper）会见了反对派领袖，包括失败的总统候选人尤莉娅·季莫申申（Yulia Tymoshenko）。在利沃夫，哈珀参观了一个充满争议的新民族主义博物馆，并会见了其馆长，后者最近被指控向第三方传递机密信息。在与记者谈及乌克兰1932年的饥荒时，哈珀鼓励公众挑战他们的政府，称饥荒应该“提醒乌克兰人民自由、民主和独立的重要性，以及始终捍卫这些内容的必要性”。6由于亚努科维奇拒绝回应哈珀对1932年饥荒的民族主义解释，参加哈珀访问的加拿大皇家军事学院教授卢博米尔·利秋乌克（Lubomyr
    Lyciuk）在《金斯顿标准报》上写道：“亚努科维奇注定要进入历史垃圾堆，而尊敬的哈珀却能屹立。”


    访问一年后，哈珀针对对季莫申的腐败罪法律诉讼威胁亚努科维奇。在2011年10月的一信中，加拿大总理写道：“我无法低估目前尤莉娅·季莫申司法程序对乌克兰与加拿大及其他国家未来关系，以及乌克兰长期民主发展的潜在负面影响。”7在2012年4月的访问期间，国际贸易部长贝弗利·奥达（Beverly
    Oda）对人权表示担忧，并在极不寻的外交行动中，让乌克兰裔代表加入了她的代表团。人们只需要想象一下俄罗斯代表团带着俄罗斯裔加拿大人或中国代表团带着中裔加拿大人来批评渥太华，就能理解这一决定的特殊之处。


