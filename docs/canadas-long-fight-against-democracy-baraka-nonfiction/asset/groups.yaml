    for overthrowing an elected government was highly symbolic. More significantly,
    Canada was the only major donor to Honduras—the largest recipient of Canadian
    assistance in Central America—that failed to sever any aid to the military government.
    The World Bank, European Union, and the US suspended some of their planned assistance
    to Honduras.


    In response to the conflicting signals from North American leaders, the ousted
    Honduran foreign minister told Telesur that Ottawa and Washington were providing
    “oxygen” to the military government.7 Patricia Rodas'
