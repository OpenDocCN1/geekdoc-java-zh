  mdcn: '

    渥太华在2006年试图颠覆巴勒斯坦人的民主投票。在哈马斯赢得当年的立法选举后，加拿大对巴勒斯坦人实施了制裁。渥太华切断了援助并拒绝承认巴勒斯坦统一政府，这促成了哈马斯与法塔赫之间的战斗，结束了一场短暂的选举实验。


    在20世纪60年代，渥太华在泛非洲主义领人恩克鲁马（Nkrumah）和卢姆巴（Lumumba）的命运中扮演了重要角色。1966年，加拿大训练的军队推翻了恩克鲁马。恩克鲁马下台后，在一份给外交部的内部备忘录中，驻阿克拉加拿大公使C.E.
    McGaughey写道：“对加纳来说发生了一件美事，加拿大在其中发挥了应的作用。”政变发生后，渥太华通知军政府加拿大意图恢复正常关系，并向加纳赠送了价值182万美元（现值1500万万美元）的谷物。


    通过在联合国刚果任务中的重要角色，渥太华对卢姆巴的死亡贡献巨大。卢姆巴被杀后，加拿大上校让·伯蒂梅（Jean Berthiaume）协助抓住了这位选举首相的敌人。加拿大官员庆祝了这位人士的死亡，约翰·迪芬贝克（John
    Diefenbaker）私下称其为“西方利益的重大威胁”。


    在2010年至2014年间，加拿大发动了颠覆乌克兰选举政府的行动。在推翻总统亚连科维奇（Viktor Yanukovych）的三个月米哈丹起义初期，外交部长约翰·贝德（John
    Baird）参加了基辅的一场反政府集会。渥太华还对亚连科维奇政府实施了制裁，米哈丹活动人士将加拿大大使馆作为避风港使用一周。尽管渥太华派遣了选举观察员来监督2010年总统大选和2012年议会选举，但迅速承认了政变后的政府。


    加拿大最激进地颠覆了这一西半球最贫穷国家的民选政府。在2003年1月31日至2月1日期间，让·克里先安（Jean Chrétien）领导的自由党政府组织了国际会议，讨论海地的民选总统让·贝兰德·阿斯蒂德（Jean-Bertrand
    Aristide）。在“渥太华倡议”会议上，没有海地官员被邀请，美国、加拿大和法国高层官员决定阿斯蒂德“必须离开”，应该重建军队并将该国置于托管之下。


    在“渥太华倡议”会议13个月后，阿斯蒂德和大多数民选官员被驱逐，准联合国托管开始了。加拿大特种部队“确保”了机场，阿斯蒂德被美国陆战队“绑架”上飞机运离非。随后，五百名加拿大士兵占领了海地六个月。


    与渥太华颠覆海地民主的情况相似，贾汀·特鲁多（Justin Trudeau）政府公开寻求推翻委内瑞拉政府。为了引发“政权更迭”，渥太华孤立了加加斯，实施了非法制裁，将该政府诉至国际法庭，资助了不受欢迎的反对派，并决定边缘政治人物是合法的总统。事实上，就在委内瑞拉瓜伊多（Juan
    Guaidó）宣布自己为总统的同一天，外交部长长安·弗兰德（Chrystia Freeland）正式承认了这位鲜为人知的反对派。此外，加拿大外交官在支持反对派主导国民会方面发挥了重要作用。与其他情况不同，渥太华颠覆委内瑞拉政府的行动失败了。


    华盛顿颠覆选举政府的角色已被全球学者和观察家详述。关于加拿大干涉民主的文献相对有限。事实上，这是第一本专注于加拿大在全球范围内颠覆民主的书。


    - 1. 引用自 Ernie Regehr, *Arms Canada: The Deadly Business of Military Exports*
    (Toronto: Lorimer, 1987), 39.

    - 2. 引用自 Jeremy Kinsman, “Who is My Neighbour?: Trudeau and Foreign Policy,” *International
    Journal*, vol. 57, no. 1, 2002.

    - 3. “贝德部长结束海湾地区访问，”*Government of Canada*, 2011年11月22日 (https://www.canada.ca/en/news/archive/2011/11/minister-baird-concludes-successful-visit-gulf-region.html).

    - 4. “这不是关于移民：弗兰德解释为何加拿大支持乌克兰，”*Ukrinform*, 2019年2月11日 (https://www.ukrinform.net/rubric-politics/28107211-its-not-about-diaspora-freeland-explains-why-canada-supports-ukraine.html).


    # 伊朗，1953


    1953年，美国和英国推翻了伊朗首位民选首相穆哈默德·穆萨德格（Mohammad Mossadegh）。穆萨德格是一位民族主义政治家，认为国家的自然资源，特别是巨大的石油储应该由伊朗人而非西方公司控制。在路易·圣·洛朗（Louis
    St. Laurent）政府的秘密支持下，穆萨德格在CIA策划的政变中被撤，并被沙阿列扎·帕拉维（Reza Pahlavi）取代，后者统治了近三十年的暴政。


    在1953年反对穆萨德格政变的前夕，英国驻德黑兰大使代表了加拿大在该国的外交关系。在此期间，加拿大外交部关于伊朗的文件主要由美国和英国的报告组成，加拿大官员仍对穆萨德格及其政策表示不满。在政变发生前13个月，加拿大驻华盛顿大使电电渥太华：“伊朗的局势不会比现在更糟了。穆萨德格带着更大的影响力和威望重返权力，几乎会证明他比过去更加不可理喻和顽固，因此石油争端的解决将比以往任何时候都难以安排。”¹


    穆萨德格所谓的顽固，源于他希望伊朗人从该国巨大的石油储备中获益。英国人有不同的计划。作为中东石油最早的来源之一，英伊石油公司（英国石油的前身）自1915年以来为英国投资者创造了巨额财富。英伊石油公司不愿让出任何利润，其主席廉·弗雷泽爵（Sir
    William Fraser）对伊朗试图获得更多石油财富份额的尝试回应是声称“多给一分钱，公司就破产了。”² 然而，1952年美国国务院的一份报告显示，该公司出售石油的价格在其生产成本的20到30倍之间。³
    不用说，英伊石油公司不受欢迎。甚至美国国务院注意到该公司的“傲慢”使其对伊朗产生了真正的兴趣。”⁴ 面对英伊石油公司的强硬，穆萨德格违抗了伦敦并支持该国石油工业国有化。这是一项历史性的举措，使伊朗成为第一个收回其石油权的前殖民地。


    渥太华对伊朗政府的行为并不满意。1951年5月，外交部长莱斯特·皮尔逊（Lester Pearson）在下下议院表示，只有当伊朗人考虑到那些在开发该国已发展的石油工业方面发挥过工具作用的人的合法利益时，“问题才能得到解决。”⁵
    在同年晚些时候，皮尔逊对伊朗人的“情绪化”反应感到不满。他补充道：“他们通过消除外国影响来完全控制自己的事务，正使自己暴露在共产主义渗透和吸收的危险之中——被吸收进苏联范围。”⁶


    尽管皮尔逊发出了警告，但穆萨德格是一个世俗民族主义者，而非共产主义者，他与苏联的关系有限。正如穆萨德格传记作家法哈德·迪巴（Farhad Diba）所解释的，“苏联对穆萨德格政府的态度在‘放手’政策与维持正确但政治疏远的关系之间反复。”⁷
    当穆萨德格开始采取从西方商业利益中收回伊朗资源时，苏联赞扬了他的反帝国主义，但并未采取多少行动与他的政府深化合作。

