    # GHANA, 1966


    During a visit to Ghana in 2012 Canadian governor general Michaëlle Jean laid
    a wreath on the tomb of former president Kwame Nkrumah. But, in commemorating
    this leading pan-Africanist, she failed to acknowledge the substantial role her
    country played in his downfall. February 1966 Ghana’s Canadian-trained army overthrew
    Nkrumah, a leader dubbed “Man of the Millennium” in a 2000 poll by BBC listeners
    in Africa.


    Washington, together with London, backed the coup. Lester Pearson’s government
    gave its blessing to Nkrumah’s ouster and his replacement by a military-led government.
    In The Deceptive Ash: Bilingualism and Canadian Policy in Africa: 1957-1971, John
    P. Schlegel writes: “the Western orientation and the more liberal approach of
    the new military government was welcomed by Canada.”1


    The coup d’état was a largely CIA-orchestrated reaction against Nkrumah’s deepening
    alliances with the Soviet Union and Maoist China, as well as his state’s commitment
    to transitioning Africa away from an outward-oriented economic model toward an
    inward-facing national development plan. Nkrumah also espoused pan-Africanist
    ideology, or the belief that he and his allies were “not fighting for African
    liberation only, we are fighting also for the political unification of Africa,
    for without unity there can be no future for the African People.


    Nkrumah’s political writing, most notably 1965’s Neo-Colonialism, the independence
    leader researched the mechanisms by which Western states and transnational companies
    exploited Africa’s material wealth. He'
  - '[PAGE 52]


    illustrated how private investment from US companies had increased massively after
    the granting of formal independence. So had the profits they drew from the continent.
    Nkrumah pointed out that US power was gradually overtaking European supremacy
    in Africa, and that this power was not sustained through direct political control,
    but through "neocolonial" economic control.


    As the president, Nkrumah took an active role in supporting anti-colonial struggles
    throughout Africa, including the Western-backed apartheid regimes of Southern
    Africa. Outside the continent Nkrumah joined India’s Jawaharlal Nehru, Indonesia’s
    Ahmed Sukarno, and Yugoslavia’s Josip Broz Tito in challenging Cold War non-alignment.
    He participated in many "Third World" conferences in Africa and abroad, including
    the 1955 Bandung Conference, which Indonesian president Sukarno described as "the
    first intercontinental conference of coloured peoples."


    The day Nkrumah was overthrown, the Canadian prime minister was asked in the House
    of Commons his opinion about this development. Pearson said nothing of substance
    on the matter. The next day external affairs minister Paul Martin Sr. responded
    to questions about Canada’s military training in Ghana, saying there was no change
    in instructions. In response to an MP’s question about recognizing the military
    government, Martin said: "In many cases recognition is accorded automatically.
    In respective cases such as that which occurred in Ghana yesterday, the practice
    is developing of carrying on with the government which has taken over, but according
    no formal act until some interval has elapsed. We shall carry on with the present
    arrangement for Ghana. Whether there be be any formal act will depend on information
    which is not before us.\2


    While Martin and Pearson were measured in public, the Canadian commissioner in
    Accra, C.E. McGauhey, was not. In an internal memo to'
- md: '

    External Affairs just after Nkrumah was overthrown, McGGaughey wrote that “a wonderful
    thing has happened for the West in Ghana and Canada has played a worthy part.”
    Referring to the coup, the high commissioner added that “all here welcome this
    development except party functionaries and communist diplomatic missions.” He
    then applauded the Ghanaian military for having “thrown the Russian and Chinese
    rascals out.”3


    Less than two weeks after the coup, the Pearson government informed the military
    junta that Canada intended to carry on normal relations.4 In the immediate aftermath
    of Nkrumah’s overthrow, Canada sent $1.82 million ($15 million today) of flour
    to Ghana and offered the military regime a hundred CUSO volunteers.5 For its,
    the International Monetary Fund (IMF), which had previously severed financial
    assistance to Nkrumah’s government, engaged immediately after the coup by restructuring
    Ghana’s debt. Canada’s contribution was an outright gift. During the three years
    between 1966 and 1969, the National Liberation Council military regime received
    as much Canadian aid during Nkrumah’s ten years in office with $22 million in
    grants and loans. Ottawa was the fourth major donor after the US, UK and UN.6


    Two months after Nkrumah’s ouster the Canadian high commissioner in Ghana wrote
    to Montréal-bé De Havill Aircraft with a request to secure parts for Ghana’s Air
    Force. Worried Nkrumah might attempt a counter coup, the Air Force sought parts
    for non-operational aircraft in the event it needed to deploy its forces.7


    Six months after overthrowing Nkrumah, the country’s new leader, General Joseph
    Ankrah, made an official visit to Ottawa as part of a trip that also took him
    through London and Washington.8


    More important than the diplomatic and economic support for Nkrumah’s ouster,
    Canada provided military training. Schlegel described the military government
    as a “product of this military training program.”9 A Canadian major who was a
    training advisor to the commander of a Ghanaian infantry brigade discovered preparations
    for the coup the day before its execution. Bob Edwards said nothing.10 After Nkrumah''s
    removal the Canadian high commissioner boasted about the effectiveness of Canada’s
    Junior Staff Officer’s training program at the Ghanaian Defence College. Writing
    to the Canadian under secretary of external affairs, McGaughey noted that “all
    the chief participants of the coup were graduates of this course.”11


    After independence Ghana’s army remained British dominated. The colonial era British
    generals were still in place and the majority of Ghana’s officers continued to
    be trained in Britain. In response to a number of embarrassing incidents, Nkrumah
    released the British commanders in September 1961. It was at this point that Canada
    began training Ghana’s military.


    While Canadians organized and oversaw the Junior Staff Officers course, a number
    of Canadians took up top positions in the Ghanaian Ministry of Defence. In the
    words of Canada’s military attaché à Ghana, Colonel Desmond Deane-Freeman, the
    Canadians in these positions imparted “our way of thinking.”12 Celebrating the
    influence of “our way of thinking,” in 1965 High Commissioner McGaughey wrote
    the under secretary of external affairs: “Since independence, [Ghana’s military]
    has changed in outlook, perhaps less than any other institution. It is still equipped
    with Western arms and although essentially non-political, is Western oriented.”13


    Not everyone was happy with the military’s attitude or Canada’s role therein.
    A year after Nkrumah’s ouster, McGaughey wrote Ottawa: “For some African and Asian
    diplomats stationed in Accra, I gather that there is a tendency to identify our
    aid policies particularly where military assistance is concerned with the aims
    of American and British policies. American and British objectives are unfortunately
    not regarded by such observers as being above criticism or suspicion.”14 Thomas
    Howell and Jeffrey Rajasooria echo the high commissioner’s assessment in their
    book Ghana and Nkrumah: “Members of the ruling CPP tended to identify Canadian
    aid policies, especially in defence areas, with the aims of the U.S. and Britain.
    Opponents of the Canadian military program went so far as to create a countervailing
    force in the form of the Soviet equipped, post-communist President’s Own Guard
    Regiment [POGR]. The coup on 24 February 1966 which ousted Kwame Nkrumah and the
    CPP was partially rooted in this divergence of military loyalty.”15


    The POGR became a “direct rival” to the Canadian-trained army, notes Christopher
    Kilford in The Other Cold War: Canada’s Military Assistance to the Developing
    World, 1945-1975.16 Even once Canadian officials in Ottawa “well understood” Canada’s
    significant role in the internal military battle developing in Ghana, writes Kilford,
    “there was never any serious discussion around withdrawing the Canadian training
    team.”17


    As the 1960s wore on, Nkrumah’s government became increasingly critical of London
    and Washington’s support for the white minority in southern Africa. Ottawa had
    little sympathy for Nkrumah’s pan-African ideals and so it made little sense to
    continue the Ghanaian Army if it was, in Kilford’s words, “to be used to further
    Nkrumah’s political aims.” Kilford continued his thought, stating “that is unless
    the Canadian government believed that in a well-trained, professional Ghana Army
    might soon remove Nkrumah.”18


    The post-Nkrumah military government destroyed the president’s socialist project
    and massively liberalized the country’s economy. It also reduced the country’s
    support for the liberation of other African territories.19 After his overthrow
    in 1966, Nkrumah noted that the Western-supported military government“went on
    close down the training camps for freedom fighters in Ghana...I [had] set up the
    training camps in Ghana with the co-operation of freedom fighters from all over
    Africa. Their purpose was to provide training for those intending to win freedom.”20


