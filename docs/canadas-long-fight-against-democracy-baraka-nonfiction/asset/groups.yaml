    # PARAGUAY, 2012


    In 2012, the de-left-leaning president of Paraguay, Fernando Lugo, was ousted
    in what some called an “institutional coup.” Upset with Lugo for disrupting sixty-one
    years of one-party rule by the Colorado Party, Paraguay’s ruling elite used the
    incident to impeach him. On June 15, 2012, 300 police officers descended on the
    town of Curuguay to evict 70 landless farmers. The confrontation left eleven peasants
    and six policemen dead.


    Lugo''s agrarian populism and position as a political outsider struck a chord
    with the imperiled campesino population. But the state apparatus established during
    the long dictatorship of Alfredo Stroessner, who ruled from 1954-1989, prevented
    the “bishop of the poor’s” attempts at reform. Lugo’s struggle to impose a five-percent
    tax on soy exports was suppressed and powerful farming corporations launched protests
    that forced him to reverse an executive order to limit the use of pesticides.


    The swift politicization of the Curuguay massacre by the right-wing establishment,
    coupled with numerous discrepancies in the official investigation and the murder
    of a key peasant witness shortly before testifying, led many progressives to believe
    the incident may have been manufactured to remove the would-be reformer from the
    presidency. Whether or not this is true, the judiciary immediately blamed the
    peasants for the incident and persecuted them at the expense of an open inquiry
    into the police’s actions.


    The vast majority of countries refused to recognize the new government. The Union
    of South American Nations (UNASUR) suspended Paraguay’s membership as did the
    MERCOSUR trading bloc. But Canada was only one of a handful of countries in the
    world that immediately recognized the new government.


