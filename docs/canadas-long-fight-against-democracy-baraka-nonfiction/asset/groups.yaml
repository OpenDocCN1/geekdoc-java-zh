    正如其对海外政变的支持一样，加拿大有着长期破坏其他国家政治的历史。英国和法国的殖民者摧毁了原住民的治理结构，而这些结构往往曾让第一民族（First Nations）受益数百年。他们在大西洋地区清算了米克马马克人（Mi’kmaq）领袖，并在西岸通过轰炸第一民族首领来迫使他们屈服。


    自联邦成立以来，联邦政府以无数种方式破坏原住民的政府。例如，在1870年和1885年，英国和加拿大军队暴力镇压了两次反对殖民统治向加拿大西部地区扩张的起义。路易斯·里尔（Louis
    Riel）作为这些抵抗运动的卓越领袖和曼尼托巴省的创始人，于1885年被加拿大政府绞死。


    一个世纪以来，“印第人代理”（Indian Agents）监管着保留区的政治，1876年的《印第人法》颠覆了原住民的治理。*为了让他们对印第事务产生依赖*，联邦政府在数百个第一民族中强加了部落委员会（band
    councils）。《印第人法》削弱了与特定土地和文化实践相关的直接民主和治理结构。在半个多世纪的时间里，女性和世袭首领很大程度上被排除在部落委员会政治之外。


    尽管在“和解”上定期支付资金，渥太华继续颠覆第一民族的自治，并进行干预以阻止更民主的决策。近年来，加拿大多次监禁部落委员会领袖。例如，2008年，Kitchenuhmaykoosib
    Ininnuwwug（大鱼湖，Big Trout Lake）委员会的酋长、副酋长和其他四名成员因反对在位于安大略省汤德湾以北600公里的保留区进行采矿作业而被入狱。


    夺取原住民治理权的另一种更微妙的方法是实施第三方管理。这赋予了联邦政府对保留区财务的控制权。


    巴里埃湖（Barriere Lake）的阿尔尔冈人被置于第三方管理之下，随后联邦政府边缘化了该民族的领导层。经过多年的斗争，巴里埃湖与联邦和省政府签署了一项具有里程碑意义的收入共享和资源共同管理协议。对1991年的《三边协议》感到不满的印第事务部门在渥太华以北一万平方公里内狩猎、捕猎和采集收获的社区内部制造了分裂。渥太华未能根据《三边协议》支付巴里埃湖资源管理费，并对保留区实施了第三方管理。他们拒绝承认阿尔尔冈人的习惯酋长（Customary
    Chief），随后组织了一场选举，500人的社区中仅有十人参加了投票。一段时间内，加拿大政府承认的酋长在社区之外的地方办公。


    关于渥太华如何拆解原住民治理的方法有大量的学术研究，但对加拿大支持推翻世界其他政府的研究仍然匮乏。本书旨在弥补这一空白。


    除了关注加拿大的外交政策外，本书还旨在帮助读者理解政变本身的过程。政变很少在领导人或政府被推翻的那天就开始了，而且通常有许多机会阻止它们。然而，成功的政变通常包含经济、外交、宣传和军事等维度。


    为了引发民众对目标政府的愤满，外部力量通常寻求“让经济尖叫”，正如美国总统理查德·尼克松在试图动摇阿连德领导的智利时所言的那。这通常包括切断援助或双边及多边贷款，有时意味着实施制裁。在渥太华积极协助的委内瑞拉政变尝试期间，当时的美国国家安全顾问约翰·波尔顿将针对马杜罗政府的类似措施比作《星球大战》中达斯·维维达掐死他的受害者。


    政变尝试不可避免地包含虚假信息运动。加拿大，针对国家敌人使用虚假信息的策略可以追溯多年。例如，在1885年大大草原的西北起义期间，渥太华接管了当地报纸，并利用它们传播种族主义宣传，以阻碍当地对起义者的支持。在国际政变尝试中，虚假信息运动起着同样的作用。目标政府的人权侵行为被放大，而该国家的领导人被妖魔为腐败、专权和邪恶。通常还会投入努力促进或组织反对派抗议。美国和加拿大经常资助公民社会组织并与反对派政治家协调。有时，像委内瑞拉的情况那样，他们甚至创建了一个平行领导层。


    通常，会努力在外交上孤立政府。目标政府在国际论坛上受到批评，并可能被阻止参加国际集会。有时会建立多国联盟来批评目标国家并在世界舞台上对其进行进一步孤立。同时，还会制定动荡计划来煽动不安并为军事干预提供合法性。有时会有外国军队干预，但通常由目标国家的武装力量执行，这就是为什么美国和加拿大军队通过培训来寻求与其他国家军队的影响力。


    正如第一民族被国家盯上以获取其土地和财富一样，被政变针对的政府通常也追求过令企业界愤怒的政治、经济和社会改革。在许多情况下，有加拿大支持的政变导致了改革的逆转，并创造了直接的盈利机会。皮诺切特于1973年反对阿连德发动政变后，提摩西·大卫·克拉克（Timothy
    David Clark）指出：“加拿大矿业公司是外资涌入智利的领导者。在1974年至2003年间，加拿大是该国第三大单一投资者，仅次于美国和西班牙，直到20世纪末末西班牙才超过加拿大。”在阿连德被推翻后的几十年里，加拿大公司拥有智利大部分最大的采矿项目。


    也必须说，狭隘的企业利益很少引发政变。更广泛的经济、种族和战略维度通常塑造了针对目标国家的政策。例如，推翻刚果的帕特里斯·卢蒙巴（Patrice Lumumba）、乌甘达的米顿·奥博特（Milton
    Obote）和加纳的夸梅·恩克鲁玛（Kwame Nkrumah）是为了阻止这些领导人拆解殖民结构和泛非洲统一的努力。可以在拉丁美最近的政变中发现类似的动态。某些政变在很大程度上是为了地缘政治。渥太华想除掉亚卢科维奇（Yanukovych），因为他促进与俄罗斯的良好关系并反对乌克兰加入北约。在这种情况下，一个组织的民族游说集团也是加拿大试图颠翻亚卢科维奇的影响力。代表西方民族主义者的加拿大乌克兰人大会反对亚卢科维奇。类似的力量也导致了加拿大破坏巴勒斯坦选举的努力，因为加拿大的以色列游说集团资金充足，并围绕特定的政治意识形态组织起来。


    海地的政变受到一种形式极具毒性的种族主义的影响。自1804年革命以来，白人至上主义力量试图羞辱该国贫困的黑人大众，而加拿大通过帮助推翻一个博学多才、精通多种且被该国浅肤精英所恨的黑人总统，为他们的目标贡献了支持。


    在本书记录的所有政变中，渥太华都与美国政府合作。然而，这并不意味着渥太华是被迫加入这些反民主力量的。加拿大精英不需要华盛顿的压力来取代和剥夺原住民民族的权力。加拿大领导人通常乐于参与政变，这说明了美国帝国如何服务加拿大精英利益。简而言之，加拿大的统治阶级看待世界的方式与他们的美国同行相似，并以类似的方式从全球剥削中获利。


    如果我们认真对待民主，正确的处方是“首先不伤害”。与其试图让加拿大成为促进选举的力量，我们只需要限制渥太华在世界范围内颠覆民主的能力。坦率来说，这种方法的成本很。。不需要新的资金投入或干预，而且符合国际法。不干涉他国内是国际法的一项重要原则。《联合国宪章》第2条第7款规定，“本宪章不得授权干涉本质上属于任何国内管辖范围内的事件。”


