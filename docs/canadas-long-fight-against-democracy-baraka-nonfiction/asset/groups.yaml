    # HAITI, 2004


    On February 29, 2004, Canadian special forces “secured” the airport from Haiti’s
    elected president Jean-Bertrand Aristide was bundled (“kidnapped” in his words)
    onto a plane by US Marines. He was deposited against his will in the Central African
    Republic. Almost immediately after Aristide was removed, 500 Canadian troops were
    dispatched to patrol the streets of Port-Au-Prince.


    Aristide''s overthrow was the culmination of a US-led and Canadian-supported destabilization
    campaign that included “civil society building,” military and paramilitary interventions,
    an aid embargo that would cripple the country’s economy, a full-scale disinformation
    campaign waged by Haitian elite-owned and international corporate media, and concerted
    diplomatic efforts directed at guaranteeing regime change would be both acceptable
    to the international community and believable to a confused public.


    Aristide, who had lived and studied in Montréal for three years, rose to prominence
    in the movement that toppled the thirty-year reign of “Papa Doc” and “Baby Doc”
    Duvalier. The slightly formed priest’s political philosophy was rooted in liberation
    theology. During his first term in office, he raised the minimum wage, invested
    in education, and elevated the Creole language from its underclass status. Aristide
    promoted a modest program of favoring the impoverished majority in his second
    term. His redistributionist policies angered the small number of families who
    run the economy and his call for France to repay its $21 billion ransom/debt of
    independence angered Paris and others.'
