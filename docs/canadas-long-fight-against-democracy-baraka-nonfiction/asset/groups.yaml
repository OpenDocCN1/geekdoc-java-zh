    On February 19 and 20, more than 50 were killed in violence that was widely blamed
    on government security forces. However, work by Katchanovski, BBC and others show
    that far-right activists were likely responsible for many of these deaths.29


    The killings precipitated the collapse of the government. As revealed in a leaked
    phone call between US assistant secretary of state Victoria Nuland and ambassador
    to Ukraine Geoffrey Pyatt, US officials midwif Yanukovych’s unconstitutional replacement.30
    During the call the US officials decide Arseniy Yatsenyuk, who advocated joining
    NATO, should take power.


    After Yanukovych was ousted, Ottawa sought to shore up the unconstitutional government.
    Soon after, Baid welcomed “the appointment of a legitimate government is a vital
    step forward in restoring democracy and normalcy to Ukraine.”31 But the country’s
    constitutional provisions dealing with replacing or impeaching a president were
    flagrantly violated. While Ukraine’s Parliament passed a resolution backing Yanukovych’s
