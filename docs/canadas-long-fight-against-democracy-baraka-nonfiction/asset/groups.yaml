    Haiti


    he is at war

    his mask

    is still intact


    for the prime

    minister it

    is vaudeville


    on stage he’s

    a stand-in

    for uncle sam


    he swears it’s

    only a joke

    a little prank


    he’s a master

    in the art

    of blackface


