    # 引言


    加拿大支持通过军事手段罢免民选总统。至少，加拿大官员是这么说的。


    2009年，加拿大支持了洪都拉斯军罢免民选总统曼努埃·塞拉亚（Manuel Zelaya）。在他被推翻之前，加拿大官员曾批评塞拉亚，事后谴责了他试图回国的尝试。加拿大未能停止与洪都拉斯的军事训练计划，作为洪都拉斯唯一的大捐助国——也是加拿大在中美地区最大的援助接收国——未能对军事政府切断任何援助。政变六个月后，渥太华认可了一场选举闹剧并立即承认了右翼政府。


    在参与程度上，渥太华支持了2019年推翻玻利维亚首位原住民总统。在军事指挥部强制埃沃·莫莱斯（Evo Morales）辞职几小时后，外交部长克蒂娅·弗里兰（Christia
    Freeland）发布了一份庆祝声明，宣布：“加拿大与玻利维亚及其人民的民主意志站在一起。”渥太华还为这一努力提供了重大支持。


    有些人有时会抱怨加拿大的所作。


    在破坏选举民主方面做出更有实质性的贡献，渥太华支持了1973年智利军事罢免民选总统阿连尔德（Allende）。从经济窒息到外交孤立，渥太华对阿连尔德智利的政策显而易见。政变三周内，加拿大就承认了皮诺切特的军事委员会，随后加拿大驻智利大使立即电电外交部，称皮诺切特“承担了这项可能不讨好的任务”，从阿连尔德庇护的“拉丁美洲左流分子”手中清理智利。


    加拿大多次支持针对民选领导人的军事政变。正如我们将看到的，加拿大积极参与了至少20个民选政府的推翻。渥太华积极支持了推翻1953年伊朗首相穆萨迪克（Mosaddegh）、1954年危地马拉总统雅各·宾斯（Jacobo
    Arbenz）、1963年多米尼加共和国领导人博什（Juan Bosch）、1966年巴西总统苏加尔诺（Sukarno）、1971年乌甘达总统米尔顿·奥博特（Milton
    Obote）、2012年巴拉圭领导人费尔南多·洛戈（Fernando Lugo）、2016年巴西领导人迪尔玛·罗塞夫（Dilma Rousseff）以及2022年秘鲁总统佩德罗·卡斯蒂略（Pedro
    Castillo）。此外，加拿大还秘密支持了1953年哥伦比亚和1967年希腊阻碍进步派领导人的军事干预，以及1992年和1993年秘鲁总统针对其议会的“政变”。


