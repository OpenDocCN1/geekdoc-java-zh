    2. 同上，70。

    3. 同上，73。

    4. 彼得·科恩布赫（Peter Kornbluh），“巴西纪念军事政变40周年”（https://nsarchive2.gwu.edu/NSAEBB/NSAEBB118/index.html）。

    5. 巴尔博萨，《巴西与加拿大》（哈利法克斯：Gorsebrook Research Institute, 2007），44

