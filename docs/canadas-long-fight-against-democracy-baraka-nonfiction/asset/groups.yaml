    # PERU, 2022


    On December 7, 2022, elected president Pedro Castillo was impe and jailed. Ottawa
    immediately backed the removal of a president whose government called the Canadian-backed
    anti-Venezuela Lima Group “the most disastrous thing we have done in international
    politics in the history of Perú.”¹


    Born to illiterate peasants in Cajamarca, one of the poorest regions in Peru,
    Castillo became a primary teacher and union activist. He rose to national prominence
    by leading a teachers’ strike in 2017. Castillo’s rise was symbolically important
    for Indigenous, rural, and impoverished Peruvians. But it elicited contempt from
    the Lima elite who sought to humiliate him at every turn. Partly as a result of
    an unrelenting sabotage campaign, Castillo was ineffective in pursuing his agenda
    of lessening the country’s gross inequities. Among other positions, Castillo vowed
    to reform the Fujimori-era constitution and implement agrarian reform to promote
    food security and sustainable small-scale production.²


    Canada helped consolidate a coup that sparked a furious popular backlash. Ottawa
    defended an unelected Peruvian regime that suspended civil liberties and imposed
    a curfew while deploying troops to the streets. Security forces killed over sixty
    mostly Indigenous protesters.


    At a special meeting of the Organization of American States hours after Castillo
    arrested Canada’s representative to the OAS, “Canada would like to express its
    deep concern over President Castillo’s attempt to dissolve congress and establish
    a government of exception in Peru. Such destabilizing actions run directly counter
    to the recommendation of the OAS high level group and risk jeopardizing Peru’s
    adherence to democratic norms.3 According to the Canadian government, the ouster
    of the elected president was a step forward for democracy.


    Castillo’s ouster was justified on the grounds the former union leader declared
    an “exceptional emergency government” and sought to dissolve Congress to pre-empt
    it by breach to impeachment. The constitutional legitimacy of Castillo’s actions
    was dubious. But his opponents’ plan also undercut constitutional norms and they
    wanted the vice president to rule for the remaining of Castillo’s four-and-a-half-year
    term. He at least called for immediate elections. Additionally, Castillo’s approval
    was significantly higher than the Congress that removed him (30%).4


    Global Affairs and Canada’s ambassador to Peru, Louis Marcotte, worked hard to
    shore up support for Dina Boluarte’s replacement ‘usurper’ government. In the
    two months after Castillo’s ouster Marcotte met president Boluarte, the foreign
    minister, vulnerable populations minister, production minister, and mining minister.
    It is rare for a Canadian ambassador to have so much contact with top officials
    of any government. The diplomatic activity reflected Ottawa’s commitment to consolidating
    the shaky coup government, which was rejected by many regional governments and
    had multiple ministers resign.


    The diplomatic encounters were also an indirect endorsement of Boluarte’s repression.
    Security forces shot hundreds and detained many more more. Sixty were killed.


    Amidst large protests a week after Castillo’s ouster, Marcotte met new foreign
    minister Ana Cecilia Gervasi, tweeting a photo with the message: “Today with Minister
    Gervasi, reiterated support for the transition government of President Boluarte
    to create consensus leading to transparent and fair elections that will bring
    social peace. Condemned violence and affirmed the right to peaceful assembly.”—5
    Simultaneously, Gervasi released a statement to the media, reported CBC, about
    meeting Marcotte, which “reiterated Peru’s gratitude for the commitment of his
    country to work with President Boluarte.”6 Three days later global affairs minister
    Melanie Joly bolstered Canada’s support for Boluarte tweeting, “Spoke with Peru’s
    Foreign Minister, Ana Gervasi, to reiterate our support for the transitional government.”
    Joly and Marcotte’s moves followed similar moves by the US. Secretary of state
    Antony Blinken called Boluarte and ambassador Lisa Kenna met her the same time.7
    On December 23, ambassador Marcotte tweeted, “I met today with President Boluarte
    to reiterate Canada’s commitment to continue strengthening the relation and to
    support transparent and fair elections.”


    Most of the Hemisphere took a different tack. In “Canada takes sides as hemisphere
    splits over who rules Peru,” the CBC’s Evan Dyer reported nine days after Castillo
    was ousted that the US, Brazil, Ecuador, Panama, Chile, Uruguay and Costa Rica
    expressed support for Boluarte while Mexico, Argentina, Bolivia, Dominica, Grenada,
    Saint Lucia, Saint Vincent and the Grenadines, Saint Kitts and Nevis, Antigua,
    Barbuda, Cuba, Nicaragua, Honduras, Venezuela, and Colombia all expressed some
    opposition to Castillo’s ouster8


    While Canada blamed Castillo for the political crisis, other governments in the
    region criticized the Peruvian opposition for not allowing Castillo to govern.
    His opponent in the second round of the presidential election, Keiko Fujimori,
    refused to even recognize Castillo’s election victory while the media and business
    elite attacked Castillo viciously. The big business National Society of Industries
    vowed to “throw out communism” by making the country ungovernable and congress
    repeatedly sought to impeach Castillo. For its part, the military demanded (successfully)
    the removal of leftist cabinet members.9


