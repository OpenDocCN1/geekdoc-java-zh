  \ 详情*\n你可以尝试去搜索后端服务的 span。\n### 下一步展望\n在本章中，你学习了分布式追踪、CNCF OpenTracing 规范以及 Jaeger\
  \ 实现。你还学习了如何对不同的技术进行插桩以收集和报告追踪信息，以及如何使用 `ConfigMaps` 来存储这些配置。追踪是一个复杂的课题，我们只涵盖了基础知识，没有深入探讨追踪发生的机制。请查看以下链接获取更多信息：\n\
  * [OpenTracing](https://opentracing.io/)\n* [The camel-opentracing component](http://bit.ly/2tFBO)\n\
  * [Using OpenTracing with Jaeger in Kubernetes 中收集应用指标](https://red.ht/2U8q2lu)\n\
  \n\n同样如此，并且被认为是一种良好的实践。`Kubernetes` 还包含了用于挂载 `Secrets` 的 API，允许我们安全地将用户名、密码和私密钥从应用程序中解耦，并在需要时将其注入\
  \ Linux 容器中。此外，最近添加的 `ConfigMaps` 与 `Secrets` 非常相似，它们都允许管理应用程序级别的配置并与应用程序的 Docker\
  \ 镜像解耦，同时也允许我们通过环境变量和/或容器文件系统上的文件注入配置。如果一个应用程序可以从文件系统消耗配置（我们在所有三个 Java 框架中都看到了这一点）或读取环境变量，它就可以利用\
  \ Kubernetes 的配置功能。通过这种方法，我们不需要为消费配置而设置额外的配置服务和复杂的客户端。运行在容器内部（甚至是外部）的微服务的服务的配置，无论使用何种技术，现在都已经内置到集群管理基础设施中了。\n\
  ## 日志与指标\n毫无疑问，实现微服务架构的许多缺点都围绕着日志、指标和追踪方面的服务管理。你将一个系统拆分得越多的部分，就越需要工具支持、远见和洞察来观察大局。当你规模化运行服务时，特别是在假设会发生故障的模型中，你需要一种方法来获取服务信息并将其与其他数据（如指标和追踪）相关起来，无论容器是否仍然存。在制定日志和指标策略时，有几种方法可以考虑：\n\
