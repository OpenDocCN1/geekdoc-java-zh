  \ 时，也会注意到这种惯用法。\n### 调用另一个服务\n在微服务环境中，每个服务都负责为其他协作者提供其功能或服务。正如我们在第一章中讨论的，构建分布式系统是困难的，我们无法抽象掉网络或潜在的失败。\n\
