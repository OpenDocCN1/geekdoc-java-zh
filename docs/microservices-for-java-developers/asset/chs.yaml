  我们将看到的下一个 Java 微服务框架是 MicroProfile。\nJava 企业版 (EE)（现称为 Jakarta EE） 15 多年来一直是企业级\
  \ Java 应用程序的主力。许多企业对开源和专有的 Java EE 技术投入了大量资金，这影响了从我们招聘软件人才到培训、工具和管理的方方面。Java EE\
  \ 一直非常擅长通过提供 servlets/JavaServer Pages (JSPs)、事务、组件模型、消息和持久化等功能来帮助开发者构建分层应用。\n尽管\
  \ Java EE 非常受欢迎，但最近人们开始觉得，Java EE 的创新速度对于一个要求云原生应用、微服务和容器的世界来说太慢了。这种感觉促使了各种 Java\
  \ 用户组、Java 冠军、供应商和公司齐力合作，发布了 MicroProfile 规范。\nMicroProfile 1.0 在 JavaOne 2016 期间宣布，由\
  \ CDI、JSON-P 和 JAX-RS 规范组成。这些 API 让丰富的 Java EE 开发者能够利用现有的技能集来应对这一快速迭代、创新的开源规范。\n\
  MicroProfile 2.1 定义了基于 Java EE CDI、JSON-P、JAX-RS 和 JSON-B 的基础编程模型，并增加了 Open Tracing、Open\
  \ API、Rest Client、Config、Fault Tolerance、Metrics、JWT Propagation 和 Health Check\
  \ API（参见图 3-1）。开发仍然活跃，正在研究 Reactive Streams、Reactive Messaging、GraphQL、长时间运行操作和服务网功能。\n\
  *图 3-1. MicroProfile 2.1 API*\n### Thorntail\nThorntail 是来自 Red Hat 的 MicroProfile\
  \ 实现。它是将 WildFly 服务器完全拆分为小型、可重用的组件，这些组件可以组装成微服务应用程序。组装这些组件只需在 Java Maven 或 Gradle\
  \ 构建文件中包含依赖即可；Thorntail 会处理其余工作。\nThorntail 评估你的 `pom.xml`（或 Gradle）文件，确定你的微服务实际使用了哪些依赖（例如\
  \ CDI、OpenTracing 和 Metrics），然后构建一个 uber-JAR（类似于 Spring Boot 和 Dropwizard），其中包含了运行服务所需的最小\
  \ API 和实现。\n除了 MicroProfile API 之外，Thorntail 还提供了许多其他功能。某些组件仅提供对其他 API 的访问，例如 JPA\
  \ 或 JMS；其他组件则提供了高级功能，例如与 Infinispan 的集成。\n### 开始上手\n你可以使用 [Thorntail Generator](https://thorntail.io/generator/)\
