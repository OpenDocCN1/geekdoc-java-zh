  \ 项目生成器](http://bit.ly/2S6vDHj)\n\n\n现在你已经了解了如何构建微服务，可以继续构建越来越多的微服务。然而，随着微服务数量的增加，消费这些\
  \ API 的客户端复杂度也会随之增加。\n真实的应用可能有几十个甚至数百个微服务。像在 Amazon 这样的在线商店买书这样一个简单的过程，可能会导致客户端（你的网络浏览器或移动应用）使用其他几个微微服务。直接访问微服务的客户端必须自己负责定位、调用它们，并处理它们引发的任何故障。因此，通常更好的方法是将这些服务隐藏在一个新的服务层之后。这个聚合器服务层被称为\
  \ `API gateway`。\n使用 API 网关的另一个优势是，你可以在这一层添加授权和数据转换等跨切关注点。使用不适合互联网协议的服务也可以从 API\
  \ 网关的使用中受益。但是，请记住，通常不建议为应用程序中的所有微服务设置单个 API 网关。如果你（错误地）决定采取这种方法，它将像一个单体总线一样，通过耦合所有微服务来违反微服务的独立性。\n\
  **在 API 网关中添加业务逻辑是一个错误，应该予以避免。**\n### 53\n## Apache Camel\nApache Camel 是一个开源集成框架，非常适合实现\
  \ API 网关。该框架实现了 Gregor Hohpe 和 Bobby Woolf (Addison-Wesley) 所著的 *Enterprise Integration\
  \ Patterns* 一书中描述的大多数企业应用集成 (EAI)模式。每个企业集成模式 (EIP) 都描述了许多集成项目中反复出现的常见设计问题的解决方案。该书记录了\
  \ 65 个 EIP，并采用了与技术无关的方法。\nApache Camel 使用基于 EIP 的一致 API，为集成提供了定义良好的编程模型。通过 200 多个组件，开发者可以将\
  \ Apache Camel 连接到几乎任何源/目标。除了 `HTTP`、`FTP`、`File`、`JPA`、`SMTP` 和 `Websocket` 组件外，甚至还有\
  \ `Twitter`、`Facebook`、`AWS` 等平台的组件。\nApache Camel 非常强大但又非常简单。这使其成为为我们的微服务创建 API\
  \ 网关的理想选择。\nApache Camel 可以作为独立应用程序运行，也可以嵌入现有应用程序中。对于我们的 API 网关示例，我们将在 Spring Boot\
  \ 中使用 `Camel`。\n### 快速上手\n可以通过在现有应用中声明 Maven 依赖，或使用现有的 Maven Archetype 来创建 Camel\
