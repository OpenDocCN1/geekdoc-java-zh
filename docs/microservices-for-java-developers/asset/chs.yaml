  - 测试服务。\n- 在需要的地方识别架构并进行水平扩展。\n\n\n- 不必要的会议\n- 企业级统一规范模型\n微服务架构适合你吗？微服务有很多优点，但它们也有许多自己的缺点。你可以将微服务视为对那些需要在大范围内快速更改事物的问题的优化，但这是有代价的。\n\
  这种方法并不是高效的。它可能更消耗资源。\n你可能会得到看起来像重复的内容。操作复杂性要高得多。从整体理解系统变得非常困难。调试问题变得极其困难。在某些领域，你可能不得不放弃事务的概念。团队的设计可能不是为了这样工作的。\n\
  业务的每个部分都需要随时更改。许多面向客户的应用程序是。后端系统可能不是。\n但当这两个世界开始融合在一起时，我们可能会看到支持微服务架构的因素推向系统的其他部分。\n\
  `8 | 第一章：面向 Java 开发者的微服务`\n## 挑战\n\n遵循微服务方法设计云原生应用，需要对如何构建、部署和运行它们进行不同的思考。我们不能简单地在构建应用程序时认为我们知道它可能失败的所有方式，然后仅仅阻止它们。在用微服务构建的复杂系统中，我们必须能够处理不确定性。本节将识别开发微服务时需要牢记的五个主要事项。\n\
  ### 针对故障的设计\n在复杂系统中，万事皆故障。硬盘崩溃、网络电缆被拔掉、我们在活动数据库而不是备份上进行维护、虚拟机（`VMs`）消失。单个故障可能会传播到系统的其他部分，并导致导致整个系统的级联故障。\n\
  传统上，在构建应用程序时，我们尝试预测应用程序的哪些部分（例如 `n-tier`）可能会失败，并建立起足够大的墙来防止它们失败。这种思维在大规模下是有问题的，因为我们无法总是预测复杂系统中会发生什么。故障将会发生，所以我们必须开发我们的应用程序使其具有韧性并处理故障，而不仅仅是防止故障。我们应该能够优雅地处理故障，而不是让故障传播导致系统性故障。\n\
  构建分布式系统与构建共享内存、单进程单体应用不同。一个显著的区别是，网络通信与共享内存的本地调用不同。网络本质上是不可靠的。网络调用可能由于任何原因而失败（例如信号强度、糟糕的电缆/路由器/交换机以及防火墙），这可能是一个瓶颈的主要来源。网络不可靠性不仅对服务客户的响应时间产生性能影响，还可能导致上游系统的故障。\n\
  \n\n隐性网络调用可能非常难以调试；理想情况下，如果你的网络调用无法成功完成，它们应该立即失败，并且你的应用程序能够迅速察觉（例如通过 `IOException`）。在这种情况下，你可以快速采取纠正措施、提供降级功能，或者直接返回一条消息，说明请求无法正常完成，用户应稍后重试。但网络请求或分布式应用程序中的错误并不总是那么简单。如果你必须调用的下游应用程序响应时间比正常情况下长怎么办？这是一个致命问题，因为现在你的应用程序必须通过限制请求、下游请求超时以及可能阻塞通过你服务的所有调用来考虑这种延迟。这种积压会导致上游服务出现变慢，甚至停滞。\n\
  而且它可能导致级联故障。\n## 考虑到依赖关系的设计\n\n\n\n\n\n模型已经使用了几个世纪了，但 Eric Evans 的开创性著作*领域驱动设计》（Add-Wesley）帮助我们理解，软件中真正的复杂性不在于技术，而是围绕它的语言。我们需要构建在自身语文中具有内聚性的模型。\n\
  边界上下文（Bounded context）是一组领域对象，它们实现了一个试图简化业务、代码和组织的模型。通常，我们在设计系统时极力追求效率，但实际上我们需要的是灵活性。例如，在一个汽车零件应用程序中，我们可能会尝试为整个领域创建一个“规范模型”，并得到如\
  \ `Part`、`Price` 和 `Address` 等对象。如果库存应用程序使用 `Part` 对象，它指的是某种零件，比如某种刹车或轮子。在汽车质量保证系统中，`Part`\
  \ 可能指的是一个带有序列号和唯一标识符的特定零件，用于跟踪某些质量测试结果等。我们可能会努力高效地复用同一个模型，但库存跟踪和质量保证是不同的业务关注点，它们在语义上对\
  \ `Part` 对象的使用方式不同。通过库存系统的边界上下文，`Part` 被显式地建模为 `PartType`，并在该语文中理解为代表“零件类型”，而不是零件的具体实例。通过两个独立的边界上下文，这些\
  \ `Part` 对象可以在它们各自的模型中一致演进，而不会以奇怪的方式相互依赖，从而我们实现了敏捷性或灵活性。上下文映射（Context map）允许我们跟踪应用程序内部不同的上下文，以防止歧义。\n\
  对领域的深度理解需要时间。可能需要几次迭代才能完全理解业务模型中存在的歧义，并将其妥分离，允许它们独立变化。这至少是构建微服务之所以困难的原因之一。拆分单体并非易事，但许多概念已经根植于单体中；你的工作是识别并分离它们。对于绿地项目（Greenfield\
  \ project），在深入理解领域之前，你无法拆分任何东西。事实上，我们听到的所有微服务成功案例（如 Amazon 和 Netflix）在成功转型微服务之前，都是从单体路径开始的。\n\
  \n\n在一个具有自治团队和服务的微服务环境中，记住服务提供者与服务消费者之间的关系非常重要。作为一个自治的服务团队，你无法对其他团队和服务施加“义务”，因为你并不拥有它们；根据定义，它们是自治的。你所能做的就是选择接受或拒绝他们对功能或行为的承诺。作为他人的服务提供者，你所能做的就是向他们承诺某种行为。他们可以自由选择信任或不信任。承诺理论（Promise\
  \ theory）是由 Mark Burgess 在 2004 年首次提出的模型，在他的著作 [*In Search of Certainty*](http://bit.ly/1EKwwXG)\
  \ (O’Reilly) 中有所介绍，它是对包括人类、计算机和相互提供服务的组织的自治系统的研究。图 1-6 说明了义务（obligation）与承诺（promise）的区别：义务是施加在团队身上的，而承诺是由团队做出的。\n\
  *图 1-6. 义务与承诺*\n在分布式系统方面，承诺有助于明确服务可能提供的内容，并明确哪些假设是可以成立的，哪些是不能的。例如，假设我们的团队拥有一个图书推荐服务，我们承诺针对你询问的特定用户提供一组个性化的图书推荐。当你调用我们的服务时，如果我们的其中一个后端（存储该用户当前推荐视图的数据库）不可用，会发生什么？\n\
  我们可以向你抛出异常和堆栈跟踪信息，但那将不是非常好的体验，并可能导致系统其他部分的崩溃。因为我们做出了承诺，相反，我们可以尝试尽力遵守它，包括返回一个默认的书籍列表或所有书籍的子集。有时承诺是无法履行的，在这种情况下，确定最佳行动方案应由我们对用户的预期体验或结果驱动。这里的关键在于，我们的服务有责任尝试履行其承诺（返回某些推荐），即使我们依赖的服务无法履行它们的承诺（数据库宕机了）。在尝试履行承诺的过程中，对系统的其他部分以及我们试图维护的服务质量保持同理心是有帮助的。\n\
  看待承诺的另一种方式是将其视为一种为双方（如生产者和消费者）都提供价值的约定交换。但我们如何在两个双方之间决定什么是有价值，以及我们想要达成哪些承诺呢？如果没有人调用我们的服务或从我们的承诺中获得价值，这个服务有多大用？阐述消费者和提供者之间承诺的一种方法是使用*消费者驱动契约*（consumer-driven\
  \ contracts）。通过消费者驱动契约（W(http://bit.ly/2s69I7x)），我们能够通过代码或断言捕获承诺的价值，作为提供者，我们可以利用这些知识来测试我们是否履行了承诺。\n\
  ## 分布式系统管理\n归根结底，管理单一系统比管理分布式系统容易。如果只有一台机器、一个应用程序服务器，且系统出现问题，我们知道去哪里寻找。如果我们需要更改配置、升级到特定版本或对其进行安全保护，它们都在同一个物理和逻辑位置上。\n\
  管理、调试和更改它更加容易。单一系统可能适用于某些用例，但对于需要扩展的用例，我们可能会考虑利用微服务。然而，正如我们之前讨论过的，微服务并不是免费的；拥有灵活性和可扩展性的代价是必须管理一个复杂的系统。\n\
  在管理微服务部署时，这里有一些需要考虑的问题：\n- 我们如何启动和停止一组服务集群？\n- 在服务可以进入、离开、移动等的弹性环境中，我们如何发现服务？\n\
  - 我们如何了解我们的集群或单个服务的健康状况？\n- 我们如何进行细粒度的 API 路由？\n- 如果集群开始崩溃或异常运行，我们如何对其进行限流或断开某些部分的连接？\n\
  - 我们如何在大规模服务集群中进行配置更改？\n\n\n\n\n\n\n\n\n\n\n* [Spring Tool Suite (基于 Eclipse 的 IDE)](http://bit.ly/2X9wnze)\n\
  * [Thorntail 项目生成器](http://bit.ly/2S6vDHj)\n\n* [Minishift](http://bit.ly/2DRTANk)\n\
  * [Docker CLI](https://dockr.ly/2ME0ygi)\n# 第二 章：用于微服务的 Spring Boot\nSpring Boot\
  \ 是一个基于 Spring 依赖注入框架的 own Java 框架，用于构建微服务。Spring Boot 通过减少样板代码、配置和开发者摩擦来促进微服务的创建。这种方法与我们将查看的另外两个框架类似。\n\
  ## Spring Boot 的优势\n* 默认倾向于自动、约定好的配置\n* 简化应用程序打包\n\nSpring 在历史上是配置的噩梦。尽管该框架改进了其他高度复杂的组件模型（EJB\
  \ 1.x, 2.x 等），但它确实带来了自己的一套重量级使用模式。也就是说，Spring 需要大量的 XML 配置，并需要深层理解构造 `JdbcTemplates`、`JmsTemplates`、`BeanFactory`\
  \ 生命周期钩子、servlet 监听器以及许多其他组件时所需的单个 bean。事实上，使用 Spring MVC 编写一个简单的“Hello World”需要理解\
  \ `DispatcherServlet` 以及整系列模型-视图-控制器类。Spring Boot 旨在通过一些隐含的约定和简化的注解消除所有这些样板配置——尽管如果你需要，你仍然可以精细地调整底层\
  \ bean。\n## 启动器依赖\n\n* Java Persistence API (JPA)\n* Redis 缓存\n* Java Transaction\
  \ API (JTA)\n向应用程序添加子模块会引入一组精选的、已知兼容良好的传递依赖和版本，让开发者无需自己去处理依赖。\n## 应用程序打包\n\n\n\n\
  Spring Boot 自带了一个名为 `spring boot actuator` 的模块，它可以启用有关应用程序的指标和统计等功能。例如，你可以收集日志、查看指标、执行线程转储、显示环境变量、理解垃圾回收，并显示\
  \ `BeanFactory` 中配置了哪些 bean。你可以通过 HTTP 或 Java 管理扩展 (JMX) 暴露这些信息，你甚至可以通过 SSH 直接登录到进程。\n\
  通过 Spring Boot，你可以利用 Spring 框架的力量，并减少样板配置和代码，以更快速构建强大的、生产就绪的微服务。让我们来看看如何实现。\n##\
