  ## 服务发现\n在 Kubernetes 中，Service 是一种简单的抽象，它在 pod 组和使用该组 pod 所代表服务的应用程序之间提供了一个间接层。我们已经看到\
  \ Kubernetes 如何管理 pod，以及它们是如何随来随去的。我们还看到 Kubernetes 如何轻松地扩展特定服务的实例数量。在示例中，我们部署了之前章节中的\
  \ `backend` 服务来充当提供者。我们的 `hello-springboot` 服务是如何与该服务通信的？\n让我们看看存在 Kubernetes 服务：\n\
  ```\n```\n| 名称 | 类型 | 集群 IP | 端口(s) |\n| api-gateway | ClusterIP | 172.30.227.148\
  \ | 8080/TCP |\n| hello-microprofile | ClusterIP | 172.30.31.211 | 8080/TCP |\n\n\
  \napiVersion: v1\nmetadata:\nlabels:\n  book: microservices4javadev\n  ports:\n\
  \    port: 8080\n    app: backend\n\n\n\n@ConfigProperty(name = \"GREETING_BACKENDHOST\"\
  , defaultValue = \"localhost\")\n\n\n\n\n\n\n另一个我们可以使用的健康检查是存活探针（liveness probe）。这与就绪探针（readiness\
  \ probe）类似；但它适用于 pod 被确定为“就绪”并有资格接收流量之后。在 pod 或服务的生命周期内，如果存活探针（也可以是一个简单的 HTTP 端点）开始指示一个不健康状态（例如\
  \ HTTP 500 错误），Kubernetes 可以自动杀死该 pod 并重启它。\n在之前显示的 `deployment.yml` 文件中，我们通过 `livenessProbe`\
  \ 和 `readinessProbe` 声明了这两个探针：\n```yaml\n  httpGet: # 发起 HTTP 请求\n    path: /actuator/health\
  \ # 要访问的端点\n...\n  httpGet: # 发起 HTTP 请求\n    path: /actuator/health # 要访问的端点\n\
  ```\n这意味着 `hello-springboot` pod 的“就绪性”将通过定期轮询 pod 的 `/actuator/health` 端点来确定（该端点是在我们之前为\
  \ Spring Boot 微服务添加 actuator 时添加的）。如果 pod 已就绪，它将返回：\n```json\n```\n使用 MicroProfile/Thorntail\
  \ 和 Apache Camel 实现相同的操作。\n### 熔路器\n作为服务提供者，你的责任是向消费者提供你所承诺的功能。根据承诺理论（promise theory），服务提供者可能依赖于其他服务或下游系统，但不能也不应该对它们施加要求。服务提供者对其对消费者的承诺\
  \ `Fault Tolerance | 83` 负全部责任。然而，由于分布式系统可能且确实会发生故障，因此会有某些时候无法履行服务承诺或只能部分履行。在我们之前的示例中，我们展示了我们的“hello”微服务调用\
  \ `backend` 服务以在 `/api/greeting` 端点形成问候。如果 `backend` 服务不可用会发生什么？我们如何履行我们承诺的责任？\n\
  我们需要能够处理这类分布式系统故障。服务可能不可用；网络可能经历间歇性连接；后端服务可能正承受足够的负载以导致其变慢并引入延迟；后端服务中的 bug 可能会导致应用级异常。如果我们不显式地处理这些情况，就会面临降低我们自己服务的风险；占用线程、数据库锁和资源，并导致滚动性的、级联故障，这种故障可能会导致整个分布式网络崩溃。以下小节介绍了两种帮助我们处理这些故障的不同方法（每种技术一种，即\
  \ Spring Boot 和 MicroProfile）。\n### 使用 MicroProfile 的熔路器\n让我们从 MicroProfile 开始，通过向\
  \ Maven `pom.xml` 中添加 `microprofile-fault-tolerance` 依赖：\n```xml\n  <groupId>io.thorntail</groupId>\n\
  </dependency>\n\n\n\n*GreeterRestController.java*\n```java\n@RequestMapping(\"/api\"\
  )\npublic class GreeterRestController {\n\n    @Produces(\"text/plain\")\n    @CircuitBreaker\n\
  \    @Fallback(fallbackMethod = \"fallback\")\n        // greeting 实现\n\n      \
  \  return saying + \" at host \" +\n    }\n```\n### 使用 Spring Boot 的熔路器\n对于 Spring\
  \ Boot，我们将使用 NetflixOSS 栈中名为 `Hystrix` 的库。该库通过名为 `Spring Cloud` 的 Spring 库与 Spring\
  \ 集成。\nHystrix 是一个容错 Java 库，允许微服务通过以下方式履行其承诺：\n- 监控并提供超时以防止意外的\n- 优雅地降级\n\n\n<dependency>\n\
  \  <artifactId>spring-cloud-starter-netflix-hystrix</artifactId>\n</dependency>\n\
  \n\n*GreeterRestController.java*\n```java\n@RequestMapping(\"/api\")\npublic class\
