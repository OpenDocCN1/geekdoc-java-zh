  \ 和 `hello-springboot`）都依赖于 `backend`。如果在完成最新修改后停止 `backend` 应用，预期的行为是什么？\n为了测试这种行为，我们需要重新创建\
  \ Docker 镜像并重启容器以便加载新镜像。\n如果你想构建自己的源码，请导航到微服务目录，按照指令创建 Dockerfile 在\n\n\n参考第 74\
  \ 页的将我们的微服务打包为 Docker 镜像，并运行以下命令重新构建 Docker 镜像：\n```bash\n$ mvn clean package\n\n\
  $ mvn clean package\n$ docker build -t rhdevelopers/hello-microprofile:1.0 .\n\n\
  \n\n$ oc delete pod -l app=hello-springboot\n```\n我们还需要将 `backend` 服务扩展到 0 个副本副本：\n\
  ```bash\n```\n现在，我们等待所有 `backend` 以外的 pod 都处于 Running 状态，并尝试通过 `api-gateway` 服务从两个微服务获取响应：\n\
  ```bash\n```\n`/api/gateway`\n```\n```\n响应显示，两个微服务中的 `fallback()` 方法都被调用了，因为无法与\
  \ `backend` 服务进行通信。\n这个刻意设计的背后的思想无处不在。然而，决定是回退（fallback）、优雅降级还是中断承诺取决于具体的业务领域。例如，如果你正在银行应用程序中尝试转账，而一个后端服务由于机机了，你可能希望拒绝转账，也可能希望在后端进行对账时只允许转账的某些部分可用。无论哪种，都没有通用的回退方法。\n\
  总的来说，理想的回退解决方案取决于暴露了什么样的客户体验，以及如何根据业务领域最好地进行优雅降级。\n## 负载均衡\n在高度扩展的分布式系统中，我们需要一种方法来发现并对集群中的服务进行负载均衡。正如我们在之前的示例中看到的，我们的微服务能够处理故障；因此，我们必须能够对存在的服务、可能正在加入或离开集群的服务、或存在自动伸缩组中的服务进行负载均衡。基础的负载均衡方法（如轮询\
  \ DNS）是不够的。我们可能还需要会话保持（sticky sessions）、自动伸缩或更复杂的负载均衡算法。让我们来看看微服务环境中进行负载均衡的几种不同方法。\n\
  **88 | 第 6 章：实战集群管理、故障转移与负载均衡**\n### Kubernetes 负载均衡\nKubernetes 的伟大之处在于它开箱提供了许多分布式系统功能；不需要添加任何额外的组件（服务端）或库（客户端）。Kubernetes\
  \ Service 提供了发现微服务的方法，同时也提供了服务端负载均衡。如果你还记得，Kubernetes Service 是是一组 pod 的抽象，可以通过标签选择器（label\
  \ selectors）进行指定。对于所有可以使用指定选择器选中的 pod，Kubernetes 将在它们之间负载均衡任何请求。Kubernetes 默认的负载均衡算法是轮询，但可以配置为其他算法，例如会话亲性。注意，客户端不需要执行任何操作即可将\
  \ pod 添加到 Service 中；只需为 pod 添加标签即可启用被选择。客户端通过使用 Kubernetes 开箱提供的集群 IP 或集群 DNS 服务来访问\
  \ Kubernetes Service。还要记住，集群 DNS 服务不像传统的 DNS，不会受到使用 DNS 进行发现/负载均衡时通常遇到的 DNS 缓存 TTL\
  \ 问题的影响。此外，没有硬件负载均衡器需要配置或维护；一切都是内置的。\n为了演示负载均衡，让我们扩展集群中的 `backend` 服务，并将我们的 `hello-springboot`\
  \ 服务缩回一个副本，以减少资源消耗：\n```bash\ndeployment.extensions/hello-springboot scaled\n$ oc\
  \ scale deployment backend --replicas=3\n```\n现在如果我们检查 pod，应该能看到三个 `backend` pod：\n\
  ```bash\nNAME READY STATUS\nbackend-859bbd5cc-ck68q 1/1 Running\nbackend-859bbd5cc-mdvcs\
  \ 1/1 Running\nhello-springboot-f797878bd-24hxm 1/1 Running\n\n\n$ oc describe service\
  \ backend\nNamespace: microservices4java\nAnnotations: <none>\nType: ClusterIP\n\
  Port: 80/TCP\nEndpoints: 172.30.169.193:8080, 172.30.169.194:8080, 172.30.169.195:8080\n\
  \n\n\n\n\n\n\n\n\n\n\n\noc process -f http://raw.githubusercontent.com/jaegertracing/jaeger-openshift/master/all-in-one/jaeger-all-in-one-template.yml\
  \ | oc create -f -\n\ndeployment.extensions \"jaeger\" created\nservice \"jaeger-collector\"\
  \ created\nservice \"zipkin\" created\n```\n搞定！现在我们可以开始修改微服务，将追踪信息报告到该服务器了。\n##\
  \ 修改微服务以进行分布式追踪\n现在我们已经安装了 Jaeger 服务器，是时候修改微服务向其报告信息了。\n所有的 Java OpenTracing 库都可以使用[环境](http://bit.ly/2H41cjh)变量进行配置。唯一必需环境变量是\
  \ `JAEGER_SERVICE_NAME`，它告诉 Jaeger 服务名称。\n这将在每个微服务的 Dockerfile 中声明为一个 `ENV` 指令。由于我们还需要在所有微服务上使用其他环境变量来配置追踪收集器，它们将使用一个名为\
  \ `ConfigMap` 的 Kubernetes 特性声明，然后被所有微服务消费。\n## 修改 API 网关\n我们将修改的第一个微服务是 `api-gateway`\
  \ 服务。\n由于它是使用 Camel 构建的，我们将利用一个名为 `camel-opentracing` 的 Camel 组件。该组件用于追踪传入和流出的 Camel\
  \ 消息。\n要使用这个 Camel 组件，我们只需要向我们的 `pom.xml` 文件添加依赖 `camel-opentracing-starter`，它可以启用\
  \ Camel、Spring Boot 和 OpenTracing 的集成。我们还需要添加两个 Jaeger 库——`jaeger-tracerresolver`\
  \ 用于获取 `Tracer` 对象并从环境变量配置它，而 `jaeger-thrift` 是一组向后端发送组件的组件：\n```xml\n<dependency>\n\
  \  <artifactId>camel-opentracing-starter</artifactId>\n<dependency>\n  <artifactId>jaeger-tracerresolver</artifactId>\n\
  </dependency>\n  <groupId>io.jaegertracing</groupId>\n  <version>0.32.0</version>\n\
  ```\n现在我们可以通过在主类上添加 `@CamelOpenTracing` 来“开启” OpenTracing 功能，如示例 7-1](#index_split_000.html_p101)所示。\n\
  示例 7-1. src/main/java/com/redhat/examples/MySpringBootApplication.java:\n```java\n\
  @CamelOpenTracing\n    /**\n     */\n        SpringApplication.run(MySpringBootApplication.class,\
  \ args);\n}\n\n\nFROM fabric8/java-alpine\nADD target/api-gateway.jar /deployments/\n\
  \n\nmvn clean package\noc delete pod -l app=api-gateway\n\n\n\n<!-- OpenTracing\
  \ -->\n  <groupId>io.opentracing.contrib</groupId>\n  <version>1.0</version>\n<dependency>\n\
  \  <artifactId>jaeger-tracerresolver</artifactId>\n</dependency>\n  <groupId>io.jaegertracing</groupId>\n\
  \  <version>0.32.0</version>\n```\n为了让追踪头从此微服务转发到后端，`RestTemplate` 需要一个名为 `TracingRestTemplateInterceptor`\
  \ 的拦截器。\n让我们修改 `GreeterRestController` 类以添加此拦截器，如示例 7-2](#index_split_000.html_p103)所示。\n\
  示例 7-2. src/main/java/com/redhat/examples/springboot/GreeterRestController.java:\n\
  ```java\n@RequestMapping(\"/api\")\npublic class GreeterRestController {\n    private\
  \ String saying, backendServiceHost;\n\n    @HystrixCommand(fallbackMethod = \"\
  fallback\")\n        template.setInterceptors(\n                new TracingRestTemplateInterceptor(\n\
  \            )\n        String backendServiceUrl = String.format(\n        // ...\n\
  }\n\n\n\nSystem.out.println(\"Sending to: \" + backendServiceUrl);\nbackendServiceUrl,\
  \ BackendDTO.class, saying);\nreturn response.getGreeting() + \" at host: \" +\n\
  }\n//fallback method and setters\n```\n现在，让我们在 Dockerfile 中添加 `JAEGER_SERVICE_NAME`\
  \ 环境变量的声明：\n**修改分布式追踪的微服务 | 97**\n```dockerfile\nENV JAVA_APP_JAR hello-springboot-1.0.jar\n\
  ENV JAEGER_SERVICE_NAME hello-springboot\n```\n然后，我们可以使用以下命令重新构建 JAR 文件和 Docker\
  \ 镜像，并重启 Kubernetes Pod：\n```bash\n$ docker build -t rhdevelopers/hello-springboot:1.0\
  \ .\n```\n**修改 MicroProfile 微服务**\n对于我们的 *hello_microprofile*，我们将遵循相同的配方：1. 添加 Maven\
  \ 依赖。\n3. 在 Dockerfile 中添加 `JAEGER_SERVICE_NAME` 环境变量。\n让我们先添加与 OpenTracing 和 Jaeger\
  \ 相关的 Maven 依赖。MicroProfile 支持 OpenTracing，而 Thorntail 与 Jaeger 集成了集成，因此我们需要这两项依赖：\n\
  ```xml\n<dependency>\n<artifactId>microprofile-opentracing</artifactId>\n<dependency>\n\
  <artifactId>jaeger</artifactId>\n```\nMicroProfile 提供了一个 API，用于在 JAX-RS 应用中访问符合\
  \ OpenTracing 标准的 `Tracer` 对象。我们只需要对需要被“追踪”的方法添加 `@Traced` 注解即可。我们还需要使用 `ClientTracingRegistrar`\
  \ 类来将追踪功能配置到 JAX-RS 客户端中。让我们对 示例 7-3 中 `GreeterRestController` 类的 `greeting()` 方法进行这些修改。\n\
  **98 | 第 7 章：使用 OpenTracing 进行分布式追踪**\n*示例 7-3. src/main/java/com/redhat/examples/hellomicroprofile/*\n\
  \n@Path(\"/api\")\n    @Inject\n    private String saying;\n    @Inject\n    private\
  \ String backendServiceHost;\n    @Inject\n    private int backendServicePort;\n\
