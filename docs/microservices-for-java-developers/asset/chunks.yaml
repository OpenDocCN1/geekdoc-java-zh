    同样如此，并且被认为是一种良好的实践。`Kubernetes` 还包含了用于挂载 `Secrets` 的 API，允许我们安全地将用户名、密码和私密钥从应用程序中解耦，并在需要时将其注入
    Linux 容器中。此外，最近添加的 `ConfigMaps` 与 `Secrets` 非常相似，它们都允许管理应用程序级别的配置并与应用程序的 Docker
    镜像解耦，同时也允许我们通过环境变量和/或容器文件系统上的文件注入配置。如果一个应用程序可以从文件系统消耗配置（我们在所有三个 Java 框架中都看到了这一点）或读取环境变量，它就可以利用
    Kubernetes 的配置功能。通过这种方法，我们不需要为消费配置而设置额外的配置服务和复杂的客户端。运行在容器内部（甚至是外部）的微服务的服务的配置，无论使用何种技术，现在都已经内置到集群管理基础设施中了。


    ## 日志与指标


    毫无疑问，实现微服务架构的许多缺点都围绕着日志、指标和追踪方面的服务管理。你将一个系统拆分得越多的部分，就越需要工具支持、远见和洞察来观察大局。当你规模化运行服务时，特别是在假设会发生故障的模型中，你需要一种方法来获取服务信息并将其与其他数据（如指标和追踪）相关起来，无论容器是否仍然存。在制定日志和指标策略时，有几种方法可以考虑：


    *   开发者暴露他们的日志

    *   聚合/中心化

    *   搜索与关联

    *   可视化与图表化


    `Kubernetes` 拥有启用微服务全范围日志和指标收集的插件。解决这些问题的典型技术包括 `syslog`、`Fluentd` 或 `Logstash`，用于将日志从服务提取并流传输到中央聚合器。如果需要，有些人使用消息解决方案为这些日志提供某些可靠性。`ElasticSearch`
    是将日志聚合到中央、可扩展、可搜索索引的极佳选择，如果在其之上叠加 `Kibana`，你就能获得良好的仪表板和搜索界面。其他工具如 `Prometheus`、`Jaeger`、`Grafana`、`Hawkular`、`Netflix
    Servo` 等也应该被考虑。


    ## 持续交付


    正如在第 5 章中讨论的，使用不可变镜像部署微服务是至关重要的。当我们拥有比以前多（尽管更小）的服务时，现有的手动流程将无法扩展。此外，由于每个团队拥有并运行他们自己的微服务，我们需要一种方法让团队能够在没有瓶颈和人为错误的情况下实现不可变交付。一旦我们发布了微服务，我们需要关于它们使用情况的洞察和反馈，以驱动进一步的变更。随着业务需求的变化，以及我们向系统引入更多的反馈回路，我们将进行更多更频繁的发布。为了实现这一目标，我们需要强大的软件交付流水线。该流水线可能由带有闸和提升步骤的多个子流水线组成，但理想情况下，我们希望尽可能自动化构建、测试和部署机制。


    `Docker` 和 `Kubernetes` 等工具也赋予了我们实现滚动升级、蓝绿部署、金丝发布和其他部署策略的内置能力。显然，这些工具并不是以这种方式部署的必要（如
    `Amazon` 和 `Netflix` 等地方已经在没有 Linux 容器的情况下做了多年），但容器的出现确实为我们提供了隔离和不可变因素，使这变得更容易。你可以将你的
    CI/CD 工具（如 `Jenkins` 和 `Jenkins Pipeline`）结合 `Kubernetes` 构建出灵活且强大的构建和部署流水线。查看
    `OpenShift` 以获取有关基于 `Jenkins Pipeline` 的 `Kubernetes` CI/CD 实现的细节。


    ## 总结


    本报告旨在作为一份实用的、逐步的指南，介绍如何使用一些流行的 Java 框架遵循微服务方法开始构建分布式系统。微服务不仅仅是一个技术解决方案，正如我们在第一章中讨论的那样。人是复杂系统（业务）最重要的部分，为了扩展规模并保持敏捷，你必须考虑扩展组织结构以及涉及的技术系统。


    在使用你选择的任何 Java 框架构建微服务后，你需要构建、部署并管理它们。使用传统技术和原语进行规模化操作是过于复杂、昂贵且不可扩展的。幸运的是，我们可以转向
    `Docker` 和 `Kubernetes` 等新技术，这些技术可以帮助我们在遵循不可变交付等最佳实践的同时构建、部署和运行。


    在开始构建部署在 `Docker` 中由 `Kubernetes` 管理的微服务时，拥有一个用于开发的本地环境会有帮助。为此，我们推荐 `Red Hat Container
    Development Kit`，这是一个较小的本地虚拟机，内部在免费版的 `Red Hat Enterprise Linux` (`RHEL`) 上运行着
    `Red Hat OpenShift`。`OpenShift` 提供了一个生产就绪的 `Kubernetes` 分发版，而 `RHEL` 是运行生产负载的流行、安全且支持的操作系统。这允许你使用与环境中环境中相同的技术开发应用程序，并利用
    Linux 容器提供的应用程序封装和迁移性。


    我们在这里提到了一些需要记住的额外重要概念，如配置、日志、指标和持续、自动交付。我们没有涉及安全、自服务和无数其他主题，但不要误认为：它们是微服务故事的一部分。


    我们希望你发现这份报告对你有帮助。请在 Twitter 上关注 `@openshift`、`@kubernetesio`、`@rhdevelopers`、`@rafabene`、`@christianposta`
    和 `@RedHat` 获取更多信息，并查看[源代码仓库](http://bit.ly/2T33tS9)。

