    This will be declared as an ENV instruction in each microservice’s Dockerfile.
    Because we will also need other environment variables on all microservices to
    configure the tracing collector, they will be **94 | Chapter 7: Distributed Tracing
    with OpenTracing**


    declared using a Kubernetes feature called a ConfigMap, and then will be consumed
    by all the microservices.


    **Modifying the API gateway**


    The first microservice that we will modify is the *api-gateway* service.


    Since it was built using Camel, we will make use of a Camel component called camel-opentracing.
    This component is used for tracing incoming and outcoming Camel messages.


    To use this Camel component, we just need to add the dependency camel-opentracing-starter
    that enables the integration of Camel, Spring Boot, and OpenTracing to our *pom.xml*
    file. We will also need to add two Jaeger libraries--jaeger-tracerresolver gets
    the Tracer object and configures it from environment variables, and jaeger-thrift
