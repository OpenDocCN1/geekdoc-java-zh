    参考第 74 页的将我们的微服务打包为 Docker 镜像，并运行以下命令重新构建 Docker 镜像：


    ```bash

    $ cd <PROJECT_ROOT>/hello-springboot

    $ mvn clean package

    $ docker build -t rhdevelopers/hello-springboot:1.0 .


    $ cd <PROJECT_ROOT>/hello-microprofile

    $ mvn clean package


    $ docker build -t rhdevelopers/hello-microprofile:1.0 .

    ```


    现在镜像已经重新构建，我们可以删除之前运行的容器——Kubernetes 将使用新的 Docker 镜像重启它们：


    **容错性 | 87**


    ```bash

    $ oc delete pod -l app=hello-springboot

    $ oc delete pod -l app=hello-microprofile

    ```


    我们还需要将 `backend` 服务扩展到 0 个副本副本：


    ```bash

    $ oc scale deployment backend --replicas=0

    ```


    现在，我们等待所有 `backend` 以外的 pod 都处于 Running 状态，并尝试通过 `api-gateway` 服务从两个微服务获取响应：


    ```bash

    $ curl http://api-gateway-tutorial.$(minishift ip).nip.io

    ```


    `/api/gateway`


    ```

    ["Hello at host hello-microprofile-57c9f8f9f4-24c2l- (fallback)", "Hello Spring
    Boot at host hello-springboot-f797878bd-24hxm- (fallback)"]

    ```


    响应显示，两个微服务中的 `fallback()` 方法都被调用了，因为无法与 `backend` 服务进行通信。


    这个刻意设计的背后的思想无处不在。然而，决定是回退（fallback）、优雅降级还是中断承诺取决于具体的业务领域。例如，如果你正在银行应用程序中尝试转账，而一个后端服务由于机机了，你可能希望拒绝转账，也可能希望在后端进行对账时只允许转账的某些部分可用。无论哪种，都没有通用的回退方法。


    总的来说，理想的回退解决方案取决于暴露了什么样的客户体验，以及如何根据业务领域最好地进行优雅降级。


    ## 负载均衡


    在高度扩展的分布式系统中，我们需要一种方法来发现并对集群中的服务进行负载均衡。正如我们在之前的示例中看到的，我们的微服务能够处理故障；因此，我们必须能够对存在的服务、可能正在加入或离开集群的服务、或存在自动伸缩组中的服务进行负载均衡。基础的负载均衡方法（如轮询
    DNS）是不够的。我们可能还需要会话保持（sticky sessions）、自动伸缩或更复杂的负载均衡算法。让我们来看看微服务环境中进行负载均衡的几种不同方法。


    **88 | 第 6 章：实战集群管理、故障转移与负载均衡**


    ### Kubernetes 负载均衡


    Kubernetes 的伟大之处在于它开箱提供了许多分布式系统功能；不需要添加任何额外的组件（服务端）或库（客户端）。Kubernetes Service
    提供了发现微服务的方法，同时也提供了服务端负载均衡。如果你还记得，Kubernetes Service 是是一组 pod 的抽象，可以通过标签选择器（label
    selectors）进行指定。对于所有可以使用指定选择器选中的 pod，Kubernetes 将在它们之间负载均衡任何请求。Kubernetes 默认的负载均衡算法是轮询，但可以配置为其他算法，例如会话亲性。注意，客户端不需要执行任何操作即可将
    pod 添加到 Service 中；只需为 pod 添加标签即可启用被选择。客户端通过使用 Kubernetes 开箱提供的集群 IP 或集群 DNS 服务来访问
    Kubernetes Service。还要记住，集群 DNS 服务不像传统的 DNS，不会受到使用 DNS 进行发现/负载均衡时通常遇到的 DNS 缓存 TTL
    问题的影响。此外，没有硬件负载均衡器需要配置或维护；一切都是内置的。


    为了演示负载均衡，让我们扩展集群中的 `backend` 服务，并将我们的 `hello-springboot` 服务缩回一个副本，以减少资源消耗：


    ```bash

    $ oc scale deployment hello-springboot --replicas=1

    deployment.extensions/hello-springboot scaled


    $ oc scale deployment backend --replicas=3

    deployment.extensions "backend" scaled

    ```


    现在如果我们检查 pod，应该能看到三个 `backend` pod：


    ```bash

    $ oc get pods

    NAME READY STATUS

    api-gateway-9786d4977-2jnfm 1/1 Running

    backend-859bbd5cc-ck68q 1/1 Running

    backend-859bbd5cc-j46gj 1/1 Running

    backend-859bbd5cc-mdvcs 1/1 Running

    hello-microprofile-57c9f8f9f4-24c2l 1/1 Running

    hello-springboot-f797878bd-24hxm 1/1 Running

    ```


    如果我们描述 Kubernetes 服务 `backend`，我们应该能看到用于选择有资格承担 **负载均衡 | 89** 请求 的选择器。Service
    将对 Endpoints 字段中列出的 pod 进行负载均衡：


    ```bash

    $ oc describe service backend

    Name: backend

    Namespace: microservices4java

    Labels: app=backend

    Annotations: <none>

    Selector: app=backend

    Type: ClusterIP

    IP: 172.30.169.193

    Port: 80/TCP

    TargetPort: 8080

    Endpoints: 172.30.169.193:8080, 172.30.169.194:8080, 172.30.169.195:8080

    ```


