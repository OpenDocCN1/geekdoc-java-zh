    \n```java\n@Component\n@ConfigurationProperties(prefix=\"gateway\")\npublic class\
    \ MySpringBootRouter extends RouteBuilder {\n    private String springbootsvurl;\n\
    \    private String microprofilesvcurl;\n    private static final String REST_ENDPOINT=\"\
    http4:%s/greeting?httpClient.connectTimeout=1000&bridgeEndpoint=true&copyHeaders=true&connectionClose=true\"\
    ;\n\n    @Override\n    public void configure() {\n        from(\"direct:microprofile\"\
    ).streamCaching()\n            .to(REST_ENDPOINT, microprofilesvcurl)\n      \
    \      .log(\"Response from MicroProfile microservice: ${body}\")\n          \
    \  .convertBodyTo(String.class)\n            .end();\n\n        from(\"direct:springboot\"\
    ).streamCaching()\n            .to(REST_ENDPOINT, springbootsvurl)\n         \
    \   .log(\"Response from Spring Boot microservice: ${body}\")\n            .convertBodyTo(String.class)\n\
    \            .end();\n\n        rest()\n            .get(\"/gateway\").enableCORS(true)\n\
    \            .route()\n            .multicast(AggregationStrategies.flexible().accumulateInCollection(ArrayList.class))\n\
    \            .parallelProcessing()\n            .to(\"direct:microprofile\")\n\
    \            .to(\"direct:springboot\")\n            .end()\n            .marshal().json(JsonLibrary.Jackson)\n\
    \            .convertBodyTo(String.class)\n            .endRest();\n    }\n\n\
    \    public void setSpringbootsvurl(String springbootsvurl) {\n        this.springbootsvurl\
    \ = springbootsvurl;\n    }\n\n    public void setMicroprofilesvcurl(String microprofilesvcurl)\
    \ {\n        this.microprofilesvcurl = microprofilesvcurl;\n    }\n}\n```\n\n\
    `MySpringBootRouter` 类中的 `from(\"direct:...\")` 方法声明了连接到 `hello-microprofile`\
    \ 和 `hel o-springboot` 微服务的连接器。该 Camel 连接器使用的 URI 由 `REST_ENDPOINT` 静态变量定义的字符串指定。`http4:_hostname_[:_port_][/_resourceUri_][_?options_]`\
    \ 格式在 HTTP4 组件的参考页面中有。\n\n在我们声明目标路由 `direct:microprofile` 和 `direct:springboot`\
