    Note that import statements are omitted.\n\n*Example 2-2. src/main/java/com/examples/helloosspringboot/*\n\
    *HelloRestController.java*\n\n```java\n@RestController\n@RequestMapping(\"/api\"\
    )\npublic class HelloRestController {\n    @RequestMapping(method = RequestMethod.GET,\
    \ value = \"/hello\", produces = \"text/plain\")\n    public String hello(){\n\
    \        String hostname = null;\n        try {\n            hostname = InetAddress.getLocalHost()\n\
    \                .getHostAddress();\n        } catch (UnknownHostException e)\
    \ {\n            hostname = \"unknown\";\n        }\n        return \"Hello Spring\
    \ Boot from \" + hostname;\n    }\n}\n```\n\nIn this code, all we’ve done is add\
    \ the aforementioned annotations.\n\nFor example, `@RequestMapping(\"/api\")`\
    \ at the class level says “map any method-level HTTP endpoints under this root\
    \ URI path.” When we add `@RequestMapping(method = RequestMethod.GET, value =\
    \ \"/hello\", produces = \"text/plain\")`, we are telling Spring to expose an\
    \ HTTP GET endpoint at `/hello` (which will really be `/api/hello`) and map requests\
    \ with a media type of `Accept: text/plain` to this method. Spring Boot defaults\
    \ to using an embedded Tomcat servlet container, but this can be switched to other\
    \ options like Undertow or Jetty.\n\nIf you build the application and run `spring-boot:run`\
    \ again, you should be able to reach your HTTP endpoint:\n\n```bash\nmvn clean\
    \ spring-boot:run\n```\n\nNow if you point your browser to `http://localhost:8080/api/hello`,\
    \ you should see a response similar to [Figure 2-2.](#index_split_000.html_p31).\n\
    \n*Figure 2-2. Successful hello*\n\nWhat if we want to add some environment-aware\
    \ configuration to our application? For example, instead of saying “Hello,” maybe\
    \ you want to say “Guten Tag” if we deploy our app in production for German users.\
    \ We need a way to inject properties into our app.\n\n## Externalize Configuration\n\
    \nSpring Boot makes it easy to use external property sources like properties files,\
    \ command-line arguments, the OS environment, or system properties. We can now\
    \ externalize properties that will change depending on the environment in which\
    \ we are running. Things like service URIs, database URIs and passwords, and message\
    \ queue configurations would all be great candidates for external configuration.\n\
    \nThe `application.properties` file was automatically created when we created\
    \ our project. Note we could change the filename to `application.yml` and Spring\
    \ would still recognize it as the source. Let’s add a new property to our `src/main/resources/application.properties`:\n\
    \n```\nhelloapp.saying=Guten Tag\n```\n\nNext we add the `@ConfigurationProperties`\
    \ annotation and our new `saying` field to the `HelloRestController` class, as\
    \ shown in Example 2-3](#index_split_000.html_p32). Note we also need setters.\n\
    \n*Example 2-3. src/main/java/com/examples/helloosspringboot/*\n*HelloRestController.java*\n\
    \n```java\n@RestController\n@RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"\
    helloapp\")\npublic class HelloRestController {\n    private String saying;\n\n\
    \    public String hello() {\n        String hostname = null;\n        try {\n\
    \            hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return saying + \" \" + hostname;\n    }\n\n    public void\
    \ setSaying(String saying) {\n        this.saying = saying;\n    }\n}\n```\n\n\
    Stop the application from running (if you haven’t already) and restart it:\n\n\
    ```bash\nmvn clean spring-boot:run\n```\n\nNow if you point your browser to `http://localhost:8080/api/hello`,\
    \ you should see the German version of the greeting as shown in Figure 2-3.](#index_split_000.html_p33).\n\
    \n*Figure 2-3. Successful greeting*\n\n## Expose Application Metrics and Information\n\
    \nIf we want to put this microservice into production, how will we monitor it?\
    \ How can we get any insight about how things are running? Often our microservices\
    \ are black boxes unless we explicitly think through how we want to expose metrics\
    \ to the outside world.\n\nFortunately, Spring Boot comes with a prepackaged starter\
    \ (`springboot-starter-actuator`) that makes doing this a breeze.\n\n### Hello\
    \ World | 27\n\nLet’s see what it takes to enable the actuator. Open up the `pom.xml`\
    \ file for your `hello-springboot` microservice and add the following Maven dependency\
    \ in the `<dependencies>...</dependencies>` section:\n\n```xml\n<dependency>\n\
    \    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-actuator</artifactId>\n\
    </dependency>\n```\n"
