    OpenShift 拥有许多功能，但它最重要的功能之一是其底层仍然是原生 Kubernetes，并支持基于角色的访问控制（RBAC）、开箱用的软件定义网络、安全、登录、开发者构建以及许多其他功能。我们在这里提到它，是因为在本书的后续我们将使用的
    Kubernetes 版本是基于 OpenShift 的。我们还将使用 `oc` OpenShift 命令行工具，它为我们提供了更好的用户体验，并允许我们轻松登录到
    Kubernetes 集群并控制我们要部署到哪个项目中。Minishift 既包含原生 Kubernetes 也包含 OpenShift。在本书的剩余部分，我们将交替使用
    OpenShift 和 Kubernetes，但统一使用 OpenShift。


    ## 开始使用 Minishift


    通过 Minishift，你可以直接在笔记本电脑上以 Docker 容器的形式构建、部署和运行微服务，然后选择通过 OpenShift 内部的其他应用程序生命周期管理功能或使用自己的工具通过流水线来交付它们。


    为了继续阅读报告后续的示例和惯用法，请现在按照说明安装 Minishift。[这里有](http://bit.ly/2Sxhp2k) 多种虚拟化方案可选（例如
    xhyve、Hyper-V、Linux KVM/libvirtd 和 VirtualBox），你可以配合 Minishift 使用。安装说明包含了让你运行起来所需的所有细节。


    ## 开始使用 Kubernetes


    要启动 Minishift，请输入以下命令：


    ```bash

    minishift start

    ```


    这应该引导你完成配置过程并启动虚拟机。该虚拟机将暴露 Docker 守护进程、Kubernetes API 以及 `oc` 命令行工具。`oc` 命令行工具将允许你登录
    OpenShift/Kubernetes 并管理你的项目/命名空间。你可以自己使用 `kubectl` 命令，但使用 `oc login` 命令登录更简单，因此对于这些示例，我们将使用
    `oc`。要让 `oc` 在你的路径中可用，请输入：


    ```bash

    eval $(minishift oc-env)

    ```


    你可能还需要配置 OpenShift 以允许任何用户执行某些 Docker 镜像。可以通过运行以下命令完成：


    ```bash

    minishift addon apply anyuid

    ```


    -- 正在应用插件 ''anyuid'':


    当 Minishift 启动时，你将以用户 `developer` 的身份登录。要以 `admin` 身份登录，请输入：


    ```bash

    minishift addon apply admin-user

    ```


    -- 正在应用插件 ''admin-user'':


    ```bash

    oc login -u admin -p admin

    ```


    已使用现有凭据登录到 "https://192.168.64.30:8443" 用户为 "admin"。


    你没有任何项目。你可以尝试运行以下命令创建一个新项目：


    ```bash

    oc new-project <projectname>

    ```


    接下来，让我们创建一个新的项目/命名空间，我们将向其中部署微服务：


    ```bash

    oc new-project tutorial

    ```


    现在正在服务器 "https://192.168.64.30:8443" 上使用项目 "tutorial"。


    虽然运行这些示例并非强制要求，但为你的原生开发笔记本电脑安装 Docker CLI 也会用。这允许你直接从开发笔记本电脑上列出 Docker 镜像和 Docker
    容器，而无需登录到 Minishift 虚拟机。一旦安装了 Docker CLI，你应该能够直接从你的命令行 shell 运行 Docker：


    ```bash

    eval $(minishift docker-env)

    docker ps

    docker images

    ```


    ## 下一步看哪里


    在这一章中，你了解了一些关于大规模部署和管理微服务的痛苦，以及 Linux 容器如何提供帮助。


    我们可以利用不可变交付来减少配置漂移，实现可重复部署，并帮助我们扩展应用程序（无论它们是否正在运行）。我们可以使用 Linux 容器来实现服务隔离、快速交付和迁移性。我们可以利用像
    Kubernetes 这样可扩展的容器管理系统，并利用其内置的许多分布式系统功能，例如服务发现、故障转移、健康检查等。在 Kubernetes 上部署时，我们不需要复杂的端口转换或复杂的服务发现系统，因为这些问题已经在基础设施内部得到了解决。要了解更多信息，请参阅以下资源：


    - [Rafael Benevides 写的《为什么 Kubernetes 是新的应用程序服务器》](https://red.ht/2T8Lhq6)

    - [James Strachan 写的《使用 Docker 容器时 Java 应用程序器的衰落》](http://bit.ly/1W6b5OZ)

    - [Josha Stella 写的《不可变基础设施简介》](http://oreil.ly/1W6b5OX)

    - [Docker 文档](https://dockr.ly/2EnOU3l)

    - [OpenShift 3.11 文档](https://red.ht/2SkIpCh)

    - [Kubernetes](http://bit.ly/2GCoqxs)

    - [Kubernetes 文档：Pods](http://bit.ly/2SicC4P)

    - [Kubernetes 文档：Labels and Selectors](http://bit.ly/2SPuwkq)

    - [Kubernetes 文档：Deployments](http://bit.ly/2q7vR7Y)

    - [Kubernetes 文档：Services](http://bit.ly/2NhgFgT)


    ## 第 6 章：集群管理、故障转移和负载均衡


    #### 开始使用


    在第 5 章中，我们快速查看了微服务。在这一章中，我们将进入集群管理，以解决大规模运行微服务的问题。部署我们的微服务时，我们将假设一个镜像已经存在。然而，如果你想制作自己的
    Docker 镜像，本章将涵盖使其可用的步骤。构建镜像的示例 Dockerfile 如下：


    ```dockerfile

    FROM fabric8/java-jdk

    ENV JAVA_APP_JAR <your-jar-name>

    ENV AB_OFF true

    ADD target/<your-jar-name> /deployments/

    ```


    环境变量 `JAVA_APP_JAR` 指定了 `java -jar` 命令要调用的文件名。环境变量 `AB_OFF` 禁用了启用 JMX exporter。


    ### 将我们的微服务打包为 Docker 镜像


    进入 `hello-springboot` 目录并在其中创建一个以下内容的 Dockerfile：


    ```dockerfile

    FROM fabric8/java-alpine-jdk

    ENV JAVA_APP_JAR hello-springboot-1.jar

    ENV AB_OFF true

    ADD target/hello-springboot-1.jar /deployments/

    ```


    然后运行以下命令来构建 Docker 镜像：


    ```bash

    docker build -t rhdevelopers/hello-springboot:1.0 .

    ```


