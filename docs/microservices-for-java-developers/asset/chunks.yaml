    现在让我们构建微服务并验证我们可以调用这个新的 greeting 端点，以及它是否正确调用了后端。首先，如果后端尚未运行，请启动它。导航到此应用程序源码中的\
    \ `backend` 目录并运行它：\n\n`mvn clean wildfly:run`\n\n接下来，我们将构建并运行 Spring Boot 微服务。我们还配置该服务运行在默认端口（8080）不同的端口上，以免与已经运行在\
    \ 8080 端口的后端服务冲突：\n\n`mvn clean spring-boot:run -Dserver.port=9090`\n\n在报告的后部分，我们将看到在各自的\
    \ Linux 容器中运行这些微服务是如何消除运行时端口翻转（port swizzling）限制的。\n\n现在，将浏览器指向 `http://localhost:9090/api/greeting`，查看微服务是否正确调用了后端并显示了我们预期的内容，如图\
    \ 2-6 所示。\n\n*图 2-6. 成功的后端*\n\n### 下一步展望\n\n在本章中，你学习了什么是 Spring Boot 以及它与传统的 WAR/EAR\
    \ 部署的区别。你还看到了一些简单的用例，包括暴露 HTTP/REST 端点、配置外部、暴露指标以及调用另一个服务。这只是冰山一角；如果你对学习更多 Spring\
    \ Boot 内容感兴趣，请参考以下参考文献：\n\n- [Spring Boot](http://bit.ly/2U3NbWs)\n- [Spring Boot\
    \ 参考指南](http://bit.ly/2T7CSmN)\n- [Spring Boot Action*, by Craig Walls (Manning)](http://bit.ly/2BGd3QH)\n\
    - [GitHub 上的 Spring Boot](http://bit.ly/2GA4Mlt)\n- [GitHub 上的 Spring Boot ](http://bit.ly/1Ts6swn)\n\
    \n## 第 3 章：用于微服务的 Eclipse MicroProfile\n\n我们将看到的下一个 Java 微服务框架是 MicroProfile。\n\
    \nJava 企业版 (EE)（现称为 Jakarta EE） 15 多年来一直是企业级 Java 应用程序的主力。许多企业对开源和专有的 Java EE\
    \ 技术投入了大量资金，这影响了从我们招聘软件人才到培训、工具和管理的方方面。Java EE 一直非常擅长通过提供 servlets/JavaServer\
    \ Pages (JSPs)、事务、组件模型、消息和持久化等功能来帮助开发者构建分层应用。\n\n尽管 Java EE 非常受欢迎，但最近人们开始觉得，Java\
    \ EE 的创新速度对于一个要求云原生应用、微服务和容器的世界来说太慢了。这种感觉促使了各种 Java 用户组、Java 冠军、供应商和公司齐力合作，发布了\
    \ MicroProfile 规范。\n\nMicroProfile 1.0 在 JavaOne 2016 期间宣布，由 CDI、JSON-P 和 JAX-RS\
    \ 规范组成。这些 API 让丰富的 Java EE 开发者能够利用现有的技能集来应对这一快速迭代、创新的开源规范。\n\nMicroProfile 2.1\
    \ 定义了基于 Java EE CDI、JSON-P、JAX-RS 和 JSON-B 的基础编程模型，并增加了 Open Tracing、Open API、Rest\
    \ Client、Config、Fault Tolerance、Metrics、JWT Propagation 和 Health Check API（参见图\
    \ 3-1）。开发仍然活跃，正在研究 Reactive Streams、Reactive Messaging、GraphQL、长时间运行操作和服务网功能。\n\
    \n*图 3-1. MicroProfile 2.1 API*\n\n### Thorntail\n\nThorntail 是来自 Red Hat 的 MicroProfile\
    \ 实现。它是将 WildFly 服务器完全拆分为小型、可重用的组件，这些组件可以组装成微服务应用程序。组装这些组件只需在 Java Maven 或 Gradle\
    \ 构建文件中包含依赖即可；Thorntail 会处理其余工作。\n\nThorntail 评估你的 `pom.xml`（或 Gradle）文件，确定你的微服务实际使用了哪些依赖（例如\
    \ CDI、OpenTracing 和 Metrics），然后构建一个 uber-JAR（类似于 Spring Boot 和 Dropwizard），其中包含了运行服务所需的最小\
    \ API 和实现。\n\n除了 MicroProfile API 之外，Thorntail 还提供了许多其他功能。某些组件仅提供对其他 API 的访问，例如\
    \ JPA 或 JMS；其他组件则提供了高级功能，例如与 Infinispan 的集成。\n\n### 开始上手\n\n你可以使用 [Thorntail Generator](https://thorntail.io/generator/)\
    \ 来启动一个新的 Thorntail 项目（类似于 Spring Boot 的 Spring Initializr）。只需打开页面并在字段中填写以下值，如图\
    \ 3-2 所示：\n\n- Group ID: `com.redhat.examples`\n- Artifact ID: `hello-microprofile`\n\
    - 依赖: MicroProfile Config, JAX-RS\n\n"
- fmt: "\n*Figure 3-2. Thorntail Generator*\n\nNow click the blue `Generate Project`\
    \ button. This will cause a file called `hello-microprofile.zip` to be downloaded.\
    \ Save the file and extract it.\n\nNavigate to the `hello-microprofile` directory,\
    \ and try running the following command:\n\n```bash\nmvn thorntail:run\n```\n\n\
    Make sure that you have stopped the backend service that you started in the previous\
    \ chapter.\n\n**Getting Started | 39**\n\n![](index-46_1.png)\n\nIf everything\
    \ boots up without any errors, you should see some logging similar to this:\n\n\
    ```\n2018-12-14 15:23:54,119 INFO [org.jboss.as.server] (main) WFLYSRV0010: Deployed\
    \ \"demo.war\" (runtime-name : \"demo.war\") 2018-12-14 15:23:54,129 INFO [org.wildfly.swarm]\
    \ (main) THORN99999: Thorntail is Ready\n```\n\nCongrats! You have just gotten\
    \ your first MicroProfile application up and running. If you navigate to `http://localhost:8080/hello`\
    \ in your browser, you should see the output shown in [Figure 3-3.](#index_split_000.html_p46)\n\
    \n*Figure 3-3. Hello from Thorntail*\n\n## Hello World\n\nJust like with the Spring\
    \ Boot framework in the preceding chapter, we want to add some basic “Hello World”\
    \ functionality and then incrementally add more functionality on top of it.\n\n\
    We want to expose an HTTP/REST endpoint at `/api/hello` that will return “Hello\
    \ MicroProfile from *X*,” where *X* is the IP address where the service is running.\
    \ To do this, navigate to `src/main/java/com/examples/hellomicroprofile/rest`.\
    \ This location should have been created for you if you followed the preceding\
    \ steps. Then create a new Java class called `HelloRestController`, as shown in\
    \ [Example 3-1](#index_split_000.html_p47).\n\nWe’ll add a method named `hello()`\
    \ that returns a string along with the IP address of where the service is running.\
    \ You’ll see in [Chapter 6](#index_split_000.html_p79), in the sections on load\
    \ balancing and service discovery, how the host IPs can be used to demonstrate\
    \ proper failover, load balancing, etc.\n\n**40 | Chapter 3: Eclipse MicroProfile\
    \ for Microservices**\n\n*Example 3-1. src/main/java/com/examples/hellomicroprofile/rest/*\n\
    \n*HelloRestController.java*\n\n```java\npublic class HelloRestController {\n\
    \    public String hello() {\n        String hostname = null;\n        try {\n\
    \            hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return \"Hello MicroProfile from \" + hostname;\n    }\n\
    }\n```\n\n### Add the HTTP Endpoints\n\nYou might have noticed that the POJO class\
    \ `HelloRestController` in the MicroProfile project has exactly the same implementation\
    \ as the `HelloRestController` class in the Spring Boot project. The only exception\
    \ will be the HTTP endpoint annotations, which we add in [Example 3-2](#index_split_000.html_p47):\n\
    \n- `@Path`: Maps specific parts of the HTTP URI path to classes and methods.\n\
    - `@GET`: Specifies that any HTTP GET method will invoke the annotated method.\
    \ The method won’t be called if the path is the same but the HTTP method is anything\
    \ other than GET.\n- `@Produces`: Specifies the MIME type of the response.\n\n\
    Again, note that import statements are omitted in the following example.\n\n*Example\
    \ 3-2. src/main/java/com/examples/helloworld/*\n\n*HelloRestController.java*\n\
    \n```java\n@Path(\"/api\")\npublic class HelloRestController {\n    @GET\n   \
    \ @Produces(\"text/plain\")\n    @Path(\"/hello\")\n    public String hello()\
    \ {\n        String hostname = null;\n        try {\n            hostname = InetAddress.getLocalHost()\n\
    \                .getHostAddress();\n        } catch (UnknownHostException e)\
    \ {\n            hostname = \"unknown\";\n        }\n        return \"Hello MicroProfile\
    \ from \" + hostname;\n    }\n}\n```\n\nIn this code, all we’ve done is add the\
    \ aforementioned annotations.\n\nFor example, `@Path(\"/api\")` at the class level\
    \ says “map any method-level HTTP endpoints under this root URI path.” When we\
    \ add `@Path(\"/hello\")` and `@GET`, we are telling MicroProfile to expose an\
    \ HTTP GET endpoint at `/hello` (which will really be `/api/hello`). The annotation\
    \ `@Produces(\"text/plain\")` maps requests with a media type of `Accept: text/plain`\
    \ to this method.\n\nIf you build the application and run `thorntail:run` again,\
    \ you should be able to reach the HTTP endpoint:\n\n```bash\nmvn clean thorntail:run\n\
    ```\n\nNow if you point your browser to `http://localhost:8080/api/hello`, you\
    \ should see a response similar to the one shown in [Figure 3-4.](#index_split_000.html_p48)\n\
    \n*Figure 3-4. Successful hello*\n\nNow, the same way we did for Spring Boot,\
    \ we will see how to inject configuration.\n\n**Hello World | 41**\n\n![](index-48_1.png)\n\
    \n### Externalize Configuration\n\nLike Spring Boot, MicroProfile defines mechanisms\
    \ to externalize configuration. It uses different `ConfigSources` to consume configuration\
    \ from system properties, environment variables, or even a `src/main/resources/META-INF/microconfig.properties`\
    \ file. Each of these has a priority, so configuration values can be overridden.\n\
    \nTo see how simple it is, let’s add a new property to our `src/main/resources/META-INF/microconfig.properties`\
    \ file:\n\n```properties\nhello.saying=Guten Tag\n```\n\nNow, as shown in [Chapter\
    \ 3](#index_split_000.html_p49), let’s add the `@Inject` and `@ConfigProperty(\"\
    hello.saying\")` annotations to the `HelloRestController` class. Note that unlike\
    \ Spring Boot, we don’t need setters or getters.\n\n**42 | Chapter 3: Eclipse\
    \ MicroProfile for Microservices**\n\n*Example 3-3. src/main/java/com/examples/hellomicroprofile//*\n\
    \n*HelloRestController.java*\n\n```java\n@Path(\"/api\")\npublic class HelloRestController\
    \ {\n    @Inject\n    @ConfigProperty(name=\"hello.saying\")\n    private String\
    \ saying;\n\n    @GET\n    @Produces(\"text/plain\")\n    @Path(\"/hello\")\n\
    \    public String hello() {\n        String hostname = null;\n        try {\n\
    \            hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return saying + \" \" + hostname;\n    }\n}\n```\n\nBecause\
    \ we’ve started using the CDI API in our examples, we also need to add the `beans.xml`\
    \ file, with the contents shown in [Example 3-4](#index_split_000.html_p50).\n\
    \n*Example 3-4. src/main/resources/META-INF/beans.xml*\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://xmlns.jcp.org/ns/javaee\"\n\
    \       xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n       xsi:schemaLocation=\"\
    http://xmlns.jcp.org/ns/javaee http://xmlns.jcp.org/ns/javaee/beans_1_1.xsd\"\n\
    \       bean-discovery-mode=\"all\">\n</beans>\n```\n\nThis file will instruct\
    \ the CDI API to process all the injection points marked with the `@Inject` annotation.\n\
    \nLet’s stop our application from running (if we haven’t) and restart it:\n\n\
    ```bash\nmvn clean thorntail:run\n```\n\nNow if we navigate to `http://localhost:8080/api/hello`\
    \ we should see the German version of the saying, as shown in the figure.\n\n\
    **Hello World | 43**\n\n### Expose Application Metrics and Information\n\nAnother\
    \ similarity with Spring Boot is the ability of MicroProfile applications to expose\
    \ endpoints that can be used to monitor our applications. To enable this, we need\
    \ to add the MicroProfile Metrics dependency to our `pom.xml` file.\n\nOpen up\
    \ the `pom.xml` file for the `hello-microprofile` microservice and add the following\
    \ Maven dependency within the `<dependencies>` section:\n\n```xml\n<dependency>\n\
    \    <groupId>io.thorntail</groupId>\n    <artifactId>microprofile-metrics</artifactId>\n\
    </dependency>\n```\n\nAdding this dependency will cause the application to expose\
    \ a lot of information that will be very handy for debugging and general insight.\n\
    \nNow stop your microservice and restart it by running:\n\n```bash\nmvn clean\
    \ thorntail:run\n```\n"
