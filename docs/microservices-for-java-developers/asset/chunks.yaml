    $ **mvn thorntail:run \**


    **-Dswarm.network.socket-binding-groups.standard-sockets**


    **.port-offset=100**


    In [Chapter 6, we](#index_split_000.html_p79)’ll see how running these microservices
    in their own Linux containers removes the restriction of port swizzling at runtime.
    With all that done, you can point your browser to *http://localhost:8180/api/greeting*
    to see if our microservice properly calls the backend and displays what we’[re
    expecting, as shown in Figure 3-8](#index_split_000.html_p56).


