    如果你需要对应用程序进行更改，只需重新运行此流水线以生成应用程序的新不可变镜像，然后通过滚动更新进行交付。如果运行不正常，你可以通过部署之前的镜像来回滚更改。不再需要担心配置漂移、环境漂移，或者在回滚时一切是否已正确恢复。


    这听起来很棒，但我们如何做到呢？可执行的 JAR 包让我们完成了一部分工作，但还不够。JVM 是我们微服务的具体实现细节，那么我们该如何封装 JVM 呢？JVM
    用原生代码编写的，并且具有原生的操作系统级别的依赖项，我们需要将这些依赖项与配置、环境变量、权限、文件目录和其他内容一起打包。所有这些细节都无法在单个可执行
    JAR 中捕获。其他二进制格式（如虚拟机镜像）可以很好地封装这些细节。然而，对于每个可能有不同打包要求的微服务（JVM？Node.js？Golang？属性文件？私钥？），我们可以很容易看到
    VM 镜像和语言运行时组合的爆炸式增长。如果你能通过基础设施即代码（IaC）将此自动化，并拥有具有适当暴露 API 的基础设施服务（IaaS），你确实可以实现这一点。事实上，将虚拟机作为自动化交付流水线的一部分进行构建，正是
    Netflix 为了实现这种级别的不可变交付所做的。但管理、补补和更改多个虚拟机可能会困难，因为每个虚拟机都虚拟化了整台机器，带有所需的设备驱动程序、操作系统和管理工具。


    我们还可以探索哪些其他轻量级打包和镜像格式？


    ## Docker 和 Linux 容器


    Docker 在几年前出现，为不可变交付提供了一个优雅的解决方案。Docker 允许我们以轻量级的分层镜像格式将应用程序所需的所有依赖（操作系统、JVM、其他应用程序依赖等）打包在一起。它使用这些镜像来运行实例，在
    Linux 容器内部运行我们的应用程序，并隔离 CPU、内存、网络和磁盘的使用。在某种程度上，这些容器是应用程序虚拟化或进程虚拟化的一种形式。它们允许进程在执行时认为自己是唯一运行的程序（例如，使用
    `ps` 列出进程，你只会看到你的应用程序进程），并认为它拥有 CPU、内存、磁盘、网络和其他资源的完全访问权限，但实际上并非如此。每个应用程序只能使用分配给它的资源。例如，我可以启动一个
    Docker 容器，分配一小部分 CPU、一段内存，并限制其网络 I/O 性能。从 Linux 容器外部（宿主机）来看，该应用程序看起来就像另一个进程。没有设备驱动程序、操作系统或网络栈的虚拟化，没有特殊的虚拟化程序——它只是一个进程。这一事实意味着我们可以在单机硬件上运行更多的应用程序以获得更高的密度，而无需为了实现类似的隔离性而引入额外的操作系统和
    VM 其他组件的开销。


    底层发生的事情也并不是什么革命性的。一些名为 `cgroups`、`namespaces` 和 `chroot` 的功能已内置在 Linux 内核中一段时间，它们被用于创建这种应用程序虚拟化的假象。Linux
    容器已经存在了 10 多年，而进程虚拟化在此之前就已经存在于 Solaris 和 FreeBSD 中。传统上，使用这些底层的 Linux 原语，甚至使用如
    `lxc` 这样更高级的抽象，顶多也是复杂的。随后 Docker 的出现简化了围绕 Linux 容器的 API 和用户体验。它的客户端 CLI 可以根据 Docker
    镜像格式轻松启动这些容器，而这种格式现在已向 Open 容器倡议（OCI）的更大社区开放。这种易用性和镜像格式正在改变我们打包和交付软件的方式。


    一旦我们有了镜像，启动许多 Linux 容器就变得轻而易举。这些层被构建为基础镜像（例如 `RHEL`、`Debian` 或其他 Linux 操作系统）与应用程序文件之间的增量。分发新应用程序只需要在现有基础层之上分配新层。这使得分发镜像比传输臃肿的云虚拟机镜像容易得多。此外，如果基础镜像中发现了漏洞（Shellshock、Heartbleed
    等），可以重新构建该镜像，而无需尝试修补每一个虚拟机。这使得在任何地方运行容器都变得简单：容器可以以便携的方式从开发人员的桌面移动到开发、测试或生产环境，而无需手动确保或寄希望所有正确的依赖项都处于正确的位置（此应用程序使用的是
    JVM 1.6、1.7 还是 1.8 版本？）。如果我们需要由于更改而重新部署（新应用）或修复基础镜像，只需更改镜像中需要更改的层即可。


    当我们拥有标准 API 和开放格式时，我们可以构建出无需感知或不在乎容器内运行什么内容的工具。我们如何启动应用程序？我们如何停止它？我们如何进行健康检查？我们如何聚合日志、指标和洞察？我们可以构建或利用以技术无关的方式完成所有这些事项的工具。服务发现、负载均衡、容错、配置等功能也可以推到应用程序栈的较低层，这样应用程序开发人员无需尝试手动拼凑所有这些内容并使应用程序代码变得复杂。


    ## Kubernetes


    Google 以大规模运行 Linux 容器而闻名。2014 年，Google 工程师 Joe Beda 表示，公司每周启动超过 20 亿个容器。事实上，Google
    运行的“一切”都运行在 Linux 容器中，并由他们的 Borg 管理平台进行管理。Google 甚至参与了使容器可能的底层 Linux 技术的创建：2006
    年，其工程师开始研究“进程容器”，它最终变成了 `cgroups` 并合并到 Linux 内核代码库中，于 2008 年发布。凭借其在大规模运行容器方面的深度和背景，Google
    对围绕容器构建的平台产生强大影响并不意外。以下仅是几个例子：


    - Cloud Foundry 的原始创始人（Derek Collison 和 Vadim Spivak）曾在 Google 工作，并使用了多年 Google
    的 Borg 管理解决方案。

    - Apache Mesos 是为了博士论文而创建的，其创始人（Ben Hindman）曾在 Google 实习，并与 Google 工程师就容器集群、调度和管理进行了多次交流。

    - Kubernetes 集群管理平台最初由构建 Borg 的同批工程师创建；它在 2013 年 Docker 震撼科技行业时开源。


    如今，Kubernetes 社区庞大、开放且正在快速增长，拥有来自 Google、Red Hat、CoreOS 以及许多其他组织的贡献者（以及大量独立人士的贡献者！）。Kubernetes
    为在 Linux 容器中大规模运行微服务集群提供了大量功能。Google 将十多年的经验封装到了 Kubernetes 中，能够为我们自己的微服务利用这些知识和功能是具有游戏规则改变性的。网络级公司已经这样做多年了，其中许多公司（如
    Netflix、Amazon 等）不得不手动构建许多 Kubernetes 现在已内置的功能。


