  trans: "\n由于我们添加了 actuator 依赖，我们的应用程序现在可以暴露许多信息，这些对于调试或一般的微服务洞察非常有帮助。\n\n然而，actuator\
    \ 依赖提供的所有端并不是默认暴露。我们需要手动指定将暴露哪些端。\n\n向 `src/main/resources/application.properties`\
    \ 中添加以下属性以暴露某些技术无关的端：\n\n# 启用管理端\n\n```properties\nmanagement.endpoints.web.exposure.include=beans,env,health,metrics,httptrace,mappings\n\
    ```\n\n现在停止并运行以下命令重启你的微服务：$mvn clean spring-boot:run`\n\n尝试访问以下 URL 并检查返回的内容：\n\
    \n• `http://localhost:8080/actuator/beans`\n• `http://localhost:8080/actuator/env`\n\
    • `http://localhost:8080/actuator/health`\n• `http://localhost:8080/actuator/metrics`\n\
    • `http://localhost:8080/actuator/httptrace`\n• `http://localhost:8080/actuator/mappings`\n\
    \nFigure 2-4 显示了 `http://localhost:8080/env` 端点的示例。\n\n![](img/index-35_1.png)\n\
    *图 2-4. Actuator 响应*\n\n像这样暴露运行时洞察可以让开发者专注于编写为交付业务价值的微服务编写代码。将繁重的工作和样板代码委托给框架绝对是一个好主意。\n\
    \n## 在 Maven 之外运行\n\n到为止，我们一直在从开发者笔记本使用 Maven 的角度来考虑开发和构建我们的 Hello World 微服务。但如果你想将微服务分发给其他人或在实时环境（开发、测试、生产）中运行该怎么办？\n\
    \n幸运的是，使用 Spring Boot 只需几步即可准备好发布和生产。Spring Boot 倾向于将所有依赖打包到平坦类路径中的原子可执行 JAR。这意味着我们通过\
    \ `mvn clean package` 创建的 JAR 是可执行的，并且包含了在 Java 环境中运行微服务所需的所有内容。要测试这一点，进入 `hello-springboot`\
    \ 微服务项目的根目录并运行以下命令：\n\n```bash\nmvn clean package\njava -jar target/hello-springboot-1.0.jar\n\
    ```\n\n如果你的项目命名为 `demo` 而不是 `hello-springboot`，请替换为正确的 JAR 文件（`demo-1.0.jar`）。\n\
    \n就这些！\n\n我们在下一章探索 MicroProfile 时，也会注意到这种惯用法。\n\n## 调用另一个服务\n\n在微服务环境中，每个服务都负责为其他协作者提供其功能或服务。正如我们在第一章中讨论的，构建分布式系统是困难的，我们无法抽象掉网络或潜在的失败。\n\
    \n![](img/index-36_1.png)\n\n我们将在 [index_split_000.html_p67` 中介绍如何与依赖项构建具有韧性的交互。然而，在本节中，我们将仅关注于让一个服务与一个依赖服务通信。\n\
    \n如果我们希望扩展 `hello-springboot` 微服务，将需要创建一个可以使用 Spring 的 REST 客户端功能调用的服务。对于此示例以及报告中的其他示例，我们将使用一个后端服务并修改我们的服务以连接后端并生成我们想要使用的问候语，如\
    \ [index_split_000.html_p36` 所示。\n\n*图 2-5. 调用另一个服务*\n\n如果你查看此报告的源代码，你（http://bit.ly/2T33tS9）会看到名为\
    \ `backend` 的 Maven 模块，它包含一个非常简单的 HTTP servlet，可以通过 GET 请求和查询参数调用。该后端的代码非常简单，它没有使用任何微服务框架（Spring\
    \ Boot、MicroProfile 等）。我们创建了一个 `ResponseDTO` 对象，封装了时间、ip 和问候字段。我们还利用了非常的 Jackson\
    \ 库进行 JSON 数据绑定，如下所示：\n\n```java\n@WebServlet(urlPatterns = {\"/api/backend\"\
    })\npublic class BackendHttpServlet extends HttpServlet {\n    @Override\n   \
    \ protected void doGet(HttpServletRequest req, HttpServletResponse resp) throws\
    \ ServletException, IOException {\n        resp.setContentType(\"application/json\"\
    );\n        ObjectMapper mapper = new ObjectMapper();\n        String greeting\
    \ = req.getParameter(\"greeting\");\n        ResponseDTO response = new ResponseDTO();\n\
    \        response.setGreeting(greeting + \" from cluster Backend\");\n       \
    \ response.setTime(System.currentTimeMillis());\n        response.setIp(getIp());\n\
    \        PrintWriter out = resp.getWriter();\n        mapper.writerWithDefaultPrettyPrinter()\n\
    \              .writeValue(out, response);\n    }\n\n    private String getIp()\
    \ {\n        String hostname = null;\n        try {\n            hostname = InetAddress.getLocalHost().getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return hostname;\n    }\n}\n```\n\n要在端口 8080 上启动后端服务，导航到\
    \ `backend` 目录并运行以下命令：\n\n```bash\nmvn wildfly:run\n```\n\n`backend` 项目使用 Maven\
    \ WildFly 插件，它允许我们使用 `wildfly:run` 快速启动应用程序。该服务暴露在 `/api/backend`，并接收一个名为 `greeting`\
    \ 的查询参数。例如，当我们使用如下路径调用此服务时：\n\n```json\n{\n  \"greeting\": \"Hello from cluster\
    \ Backend\",\n  \"time\": 145918960895,\n  \"ip\": \"172.20.10.3\"\n}\n```\n\n\
    你也可以用浏览器访问它：\n\n```bash\ncurl -X GET http://localhost:8080/api/backend?greeting=Hello\n\
    ```\n\n接下来，我们将在 `hello-springboot` 微服务中创建一个新的 HTTP 端点 `/greeting/`，并使用 Spring\
    \ 调用此后端。\n\n首先，我们在 `src/main/java/com/example/hello-springboot` 中创建一个名为 `GreeterRestController`\
    \ 的类，并以类似于填充 `HelloRestController` 类的方式填充它（见 index_split_000.html_p38）。\n\n*示例\
    \ 2-4. src/main/java/com/example/hello-springboot/GreeterRestController.java*\n\
    \n```java\n@RestController\n@RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"\
    greeting\")\npublic class GreeterRestController {\n    private String saying;\n\
    \    private String backendServiceHost;\n    private int backendServicePort;\n\
    \n    @RequestMapping(value = \"/greeting\", method = RequestMethod.GET, produces\
    \ = \"text/plain\")\n    public String greeting() {\n        String backendServiceUrl\
    \ = String.format(\"http://%s:%d/api/backend?greeting={greeting}\", backendServiceHost,\
    \ backendServicePort);\n        System.out.println(\"Sending to: \" + backendServiceUrl);\n\
    \        return backendServiceUrl;\n    }\n}\n```\n\n我们在该类中省略了属性的 setter 方法，但请确保你的源代码中拥有它们！注意，我们在这里再次使用\
    \ `@ConfigurationProperties` 注解来配置 REST 控制器，尽管这次我们使用的是 greeting 前缀。让我们在 `application.properties`\
    \ 文件中添加 `backendServiceHost` 和 `backendServicePort`：\n\n```properties\ngreeting.saying=Hello\
    \ Spring Boot\ngreeting.backendServiceHost=localhost\ngreeting.backendServicePort=8080\n\
    ```\n\n接下来，我们将使用 Spring 的 `RestTemplate` 执行远程服务的调用。遵循 Spring 模板模式的长期惯例，`RestTemplate`\
    \ 将常见的 HTTP/REST 惯用法封装在一个方便的封装抽象中，然后处理所有连接以及结果的序列化/反序列化。`RestTemplate` 使用原生的 JDK\
    \ 进行。\n\n"
- fmt: "\nHTTP/network access, but you can swap that out for Apache HttpComponents,\
    \ OkHttp, Netty, or others.\n\n[Example 2-5](#index_split_000.html_p39) shows\
    \ what the source looks like when using the Rest Template (again, the getters/setters\
    \ are omitted here, but required).\n\nWe are communicating with the backend service\
    \ by constructing a URL based on the host and port that have been injected, and\
    \ we add a GET query parameter called `greeting`. The value we send to the backend\
    \ service for the `greeting` parameter is from the `saying` field of the `GreeterRestController`\
    \ object, which gets injected as part of the configuration when we add the `@ConfigurationProperties`\
    \ annotation.\n\n*Example 2-5. src/main/java/com/example/GreeterRestController.java*\n\
    \n```\n@RestController\n@RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"\
    greeting\")\npublic class GreeterRestController {\n    private RestTemplate template\
    \ = new RestTemplate();\n    private String saying;\n    private String backendServiceHost;\n\
    \    private int backendServicePort;\n\n    @RequestMapping(value = \"/greeting\"\
    ,\n    method = RequestMethod.GET, produces = \"text/plain\")\n    public String\
    \ greeting() {\n        String backendServiceUrl = String.format(\n          \
    \  \"http://%s:%d/api/backend?greeting={greeting}\", backendServiceHost, backendServicePort);\n\
    \        System.out.println(\"Sending to: \" + backendServiceUrl);\n        BackendDTO\
    \ response = template.getForObject(\n            backendServiceUrl, BackendDTO.class,\
    \ saying);\n        return response.getGreeting() + \" at host: \" +\n       \
    \ response.getIp();\n    }\n}\n```\n\n### Calling Another Service\n\nNext, we\
    \ add the `BackendDTO` class, which is used to encapsulate responses from the\
    \ backend ([Example 2-6](#index_split_000.html_p40).\n\n*Example 2-6. src/main/java/com/examples/hellospringboot/BackendDTO.java*\n\
    \n```\npublic class BackendDTO {\n    private String greeting;\n    private long\
    \ time;\n    private String ip;\n\n    public String getGreeting() {\n       \
    \ return greeting;\n    }\n\n    public void setGreeting(String greeting) {\n\
    \        this.greeting = greeting;\n    }\n\n    public long getTime() {\n   \
    \     return time;\n    }\n\n    public void setTime(long time) {\n        this.time\
    \ = time;\n    }\n\n    public String getIp() {\n        return ip;\n    }\n\n\
    \    public void setIp(String ip) {\n        this.ip = ip;\n    }\n}\n```\n\n\
    Now let’s build the microservice and verify that we can call this new greeting\
    \ endpoint and that it properly calls the backend. First, start the backend if\
    \ it’s not already running. Navigate to the `backend` directory of the source\
    \ code that comes with this application and run it:\n\n`mvn clean wildfly:run`\n\
    \nNext, we’ll build and run the Spring Boot microservice. Let’s also configure\
    \ this service to run on a different port than the default port (8080) so that\
    \ it doesn’t collide with the backend service, which is already running on port\
    \ 8080:\n\n`mvn clean spring-boot:run -Dserver.port=9090`\n\nLater in the report\
    \ we’ll see how running these microservices in their own Linux container removes\
    \ the restriction of port swizzling at runtime.\n\nNow, point your browser to\
    \ `http://localhost:9090/api/greeting` to see if the microservice properly calls\
    \ the backend and displays what we’re expecting, as shown in [Figure 2-6](#index_split_000.html_p41).\n\
    \n*Figure 2-6. Successful backend*\n\n### Where to Look Next\n\nIn this chapter,\
    \ you learned what Spring Boot is and how it’s different from traditional WAR/EAR\
    \ deployments. You also saw some simple use cases, including exposing an HTTP/REST\
    \ endpoint, externalizing configuration, exposing metrics, and calling another\
    \ service. This is just scratching the surface; if you’re interested in learning\
    \ more about Spring Boot, please take a look at the following references:\n\n\
    - [Spring Boot](http://bit.ly/2U3NbWs)\n- [Spring Boot Reference Guide](http://bit.ly/2T7CSmN)\n\
    - [Spring Boot in Action*, by Craig Walls (Manning)](http://bit.ly/2BGd3QH)\n\
    - [Spring Boot on GitHub](http://bit.ly/2GA4Mlt)\n- [Spring Boot Samples on GitHub](http://bit.ly/1Ts6swn)\n\
    \n## CHAPTER 3: Eclipse MicroProfile for Microservices\n\nThe next Java microservice\
    \ framework we’ll look at is MicroProfile.\n\nJava Enterprise Edition (EE) (now\
    \ Jakarta EE) has been the work-horse of enterprise Java applications for more\
    \ than 15 years. Many enterprises have heavily invested in open source and proprietary\
    \ Java EE technologies, and this has affected everything from how we hire software\
    \ talent to training, tooling, and management. Java EE has always been very capable\
    \ at helping developers build tiered applications by offering functionality like\
    \ servlets/JavaServer Pages (JSPs), transactions, component models, messaging,\
    \ and persistence.\n\nDespite its popularity, recently the feeling began to grow\
    \ that Java EE’s pace of innovation was too slow for a world that demanded cloud-native\
    \ applications, microservices, and containers. This feeling prompted various Java\
    \ User Groups, Java Champions, vendors, and corporations to join forces and release\
    \ the MicroProfile specification.\n\nMicroProfile 1.0, announced during JavaOne\
    \ 2016, was composed of the CDI, JSON-P, and JAX-RS specifications from Java EE.\
    \ These base APIs allow experienced Java EE developers to utilize their existing\
    \ skill sets for this fast-paced, innovative, and open source specification.\n\
    \nAs a specification, there are several MicroProfile implementations: these include\
    \ Thorntail from Red Hat, Payara Micro from Payara, TomEE from Apache, and OpenLiberty\
    \ from IBM, just to name a few.\n\nBecause Java EE had a strong influence on MicroProfile,\
    \ it is worth mentioning that in 2017, Oracle donated Java EE to the Eclipse Foundation\
    \ under the Jakarta EE brand. Although Jakarta EE and MicroProfile share the same\
    \ origin, their purpose remains very different. While Jakarta EE is a continuation\
    \ of Java EE and focuses on enterprise applications, MicroProfile instead focuses\
    \ on Enterprise microservices applications.\n\nThe MicroProfile 2.1 specification\
    \ defines the base programming model using the Jakarta EE CDI, JSON-P, JAX-RS,\
    \ and JSON-B APIs, and adds Open Tracing, Open API, Rest Client, Config, Fault\
