    \ 倾向于使用原子化的、可执行的 JAR 包，并将所有依赖项封装在平面的类路径（flat classpath）中。这意味着我们在调用 `mvn clean\
    \ package` 时创建的 JAR 是可执行的，并且包含了在 Java 环境中运行微服务所需的所有内容！要测试这一点，请进入 `hello-microprofile`\
    \ 微服务项目的根目录并运行以下命令：\n\n```bash\n$ mvn clean package\n$ java -jar target/demo-thorntail.jar\n\
    ```\n\n就这样！这与 `Spring Boot` 使用的方法完全相同。\n\n### 调用另一个服务\n\n在微服务环境中，每个服务都负责为其他协作方提供其功能或服务。如果我们想要扩展\
