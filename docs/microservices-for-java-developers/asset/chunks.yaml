    软件确实正在吞噬世界。企业正开始慢慢意识到这一点，这一现象背后有两个主要驱动因素：通过高质量服务交付价值，以及技术的快速大商品化。本报告主要以一种实操的、案例说明的形式编写。但在我们深入研究技术之前，我们需要妥善地搭建舞台，并理解其中起的力量。近年来，我们一直在没完没了地讨论让企业变得`敏捷`（agile），但我们需要完全理解这意味着什么。


    否则，这仅仅只是一句每个人都付之一见的陈词滥调。


    ## 服务的价值


    在过去的 10 多年里，我们的商业市场一直围绕着创造产品并驱动消费者想要这些产品：桌子、微波炉、汽车、鞋子，等等。这种“以生产者为导””经济背后的理念源于亨利·福特的理论，即如果能以低成本大量生产产品，市场将几乎是无限的。为了实现这一目标，你还需要一些单向通道来直接向大众进行营销，说服他们需要这些产品，并且有了这些产品生活将得到实质性的改善。在
    20 世纪的大部分时间里，这些单向通道以电视广告、报纸杂志以及公路广告牌的形式存在。然而，这种以生产者为首的经济被彻底颠覆了，因为市场已经被产品完全饱和（你需要多少部手机/汽车/电视？）。此外，互联网以及社交网络正在改变公司与消费者互动的动态（或者更重要的是，消费者如何与公司互动）。


    社交网络允许我们作为消费者，更自由地相互以及与我们业务往的公司分享信息。我们对朋友、家人和其他人的信任超过对营销部门的信任。这就是为什么我们去社交媒体平台选择餐厅、酒店和航空公司。我们通过评论、推文、分享等形式提供的正面反馈可以对公司的品牌产生积极影响，而我们的负面反馈也可以同样容易且快速地摧毁一个品牌。如图
    1-1(#index_split_000.html_p9）所示，现在公司与其消费者之间存在着以前所未有的强大双向信息流，企业正努力应对这种无法拥有自身品牌所带来的影响。


    *图 1-1. 社交影响*


    后工业时代的公司正在意识到，必须培养与客户的关系（使用双向通信），以理解如何为他们带来价值。公司通过服务、客户体验和反馈提供持续的对话来实现这一点。客户根据哪些服务能带给他们价值和良好体验来选择哪些服务以及为哪些服务付费。以
    Uber 为例，它并不拥有任何库存，从本质上也不销售产品。坐在别人的车里并不能获得价值，但你可能正试图去一个能带来价值的地方（例如，商务会议）。通过这种方式，使用
    Uber 的服务创造了价值。未来，公司将专注于为客户提供有价值的服务，而技术将通过数字服务驱动这一进程。


    ## 技术的大商品化


    技术遵循着与经济学、生物学和法律类似的繁荣与衰落周期。它导致了巨大的创新，如蒸汽机、电话和计算机。然而，在我们的竞争性市场中，改变规则的创新需要大量的投资和建设才能快速获利。这带来了更多的竞争、更大的产能以及价格的下降，最终使曾经创新的技术变成大商品。在这些大商品之上，我们继续进行创新和差异化，循环持续。这种大商品化将我们从大型机走向了个人电脑，再到我们现在所谓的“云计算”，这是一种带给我们几乎无需预付资本支出的大商品化计算的服务。在云计算之上，我们现在正在看到以数字服务形式出现的新创新。


    图 1-2 显示了随时间变化的曲线。


    *图 1-2. 随时间变化的曲线*


    开源也是技术领域的先锋。遵循大商品化曲线，开源是开发者可以去的地方，他们通过对曾经仅可用（而且没有源码）且带有高昂许可费的软件进行构建和创新，来挑战专利供应商。这驱动了社区去构建诸如操作系统（`Linux`）、编程语言（`Go`）、消息队列（`Apache
    ActiveMQ`）和网络服务器（`httpd`）。即使是最初拒绝开源的公司开始通过将其技术开源并向现有社区做出贡献来转型。随着开源和开放生态系统成为常态，我们开始看到软件技术中的许多创新直接来自开源社区（例如，`Apache
    Spark`、`Docker` 和 `Kubernetes`）。


    ## 颠覆


    这两个因素——服务设计和技术演进的汇合，降低了任何拥有好想法的人开始实验并尝试构建新服务的门槛。你可以几乎不花钱地学习编程、使用高级框架并利用按需计算。你可以免费在社交网络发布内容、写博客，并与服务的潜在用户进行双向对话。由于我们业务市场的流动性，任何周末成立的初创公司都可能让一家传统公司倒闭。


    这一事实让大多数 CIO 和 CEO 感到恐惧。随着软件迅速成为公司构建数字服务和体验并实现差异化的机制，许多人意识到，他们必须在各自的垂直领域成为软件公司。大规模外包和将
    IT 视为大商品或成本中心的时代已经过去。为了让公司保持真正的竞争力，它们必须将软件作为一种差异化因素，为了做到这一点，它们必须拥抱组织敏捷。


    ## 拥抱组织敏捷


    20 世纪工业时代思维的公司并不是为了敏捷而建立的。它们的建立目标是最大化效率、减少流程中的变异并消除员工的创造性思维，按照组织流水线的方式将他们放入方框中。


    它们像机器一样构建，接收输入、应用高度调节的流程并产生输出。它们采用自上而下的层级管理结构来促进这种机器思维。


    改变机器需要 18 个月的规划周期。来自边缘的信息要经过多层管理和翻译才能到达顶层，由那里做出决策并重新下发。这种组织方法在创造产品和试图榨干流程中的每一个效率时效果非常好，但在交付服务方面并不适用。图
    1-3(#index_split_000.html_p11) 描述了效率与灵活性之间的关系。


    *图 1-3. 效率与灵活性的关系*


    客户并不适应整齐的方框或流程。他们随时随地出现。他们想要与客户代表交谈，而不是自动电话系统。他们想要菜单上没有的东西。他们需要输入表单上没有的内容。


    客户想要便利。他们想要对话。如果需要等待，他们会生气。


