- fmt: '

    As we discussed previously, the configuration of Jaeger Java clients is done through
    environment variables. In any case, the only environment variable that is required
    is `JAEGER_SERVICE_NAME`, which we defined in every `Dockerfile`.


    If you look at the logs of any microservices, you should see a message like the
    following:


    ```

    Initialized tracer=JaegerTracer(

    version=Java-0.32.0,

    serviceName=API-Gateway,

    reporter=RemoteReporter(

    sender=UdpSender(),

    closeEnqueueTimeout=1000), sampler=

    RemoteControlledSampler(

    maxOperations=2000,

    manager=HttpSamplingManager(

    hostPort=localhost:5778),

    sampler=ProbabilisticSampler(

    tags={sampler.type=probabilistic,

    sampler.param=0.001})),

    ...

    ```


    This means that the default configuration for the tracer uses a UDP `Sender` that
    sends the tracing information to `localhost:5778`. The `ProbabilisticSampler`
    defines that only 0.1% (0.001) of the requests will be traced. Tracing only 0.1%
    of the requests seems fine for production usage. However, for our tutorial we
    will change the tracer to collect all requests.


    According to the environment variable definitions in the `jaeger-core` module,
    we will need to configure the following keys/values for all microservices:


    * `JAEGER_ENDPOINT`: `http://jaeger-collector:14268/api/traces`

    * `JAEGER_REPORTER_LOG_SPANS`: `true`

    * `JAEGER_SAMPLER_TYPE`: `const`

    * `JAEGER_SAMPLER_PARAM`: `1`


    These environment variables configure the tracer to send an HTTP report to `http://jaeger-collector:14268/api/traces`.
    Every tracer report will be logged, and we will use a constant sampler that collects
    100% of the requests (1 of 1).


    We could use the command `oc set env` for every microservice, but we want to try
    something more advanced. We will create a `ConfigMap` Kubernetes object to hold
    this configuration. Later we will consume the configurations using environment
    variables, but don’t worry about the details right now.


    ```

    oc set env deployment --all --from=configmap/jaeger-config deployment.extensions/api-gateway
    updated

    deployment.extensions/backend updated

    deployment.extensions/hello-microprofile updated

    deployment.extensions/hello-springboot updated

    deployment.extensions/jaeger updated

    ```


    ### Configuring Microservices Using ConfigMap


    Note that it will cause the deployment of every microservice and that the logs
    now for any microservice will contain different information about the tracer:


    ```

    Initialized tracer=JaegerTracer(

    version=Java-0.32.0,

    serviceName=API-Gateway,

    reporter=CompositeReporter(

    reporters=[RemoteReporter(

    sender=HttpSender(),

    closeEnqueueTimeout=1000),

    LoggingReporter(

    ...

    sampler=ConstSampler(

    decision=true,

    tags={sampler.type=const, sampler.param=true}),

    tags={hostname=api-gateway-78f6f8dcd7-wckvx,

    jaeger.version=Java-0.32.0,

    ip=172.17.0.16},

    ...

    ```


    Wait for the pods to come alive, and try making a request to the microservice:


    ```

    curl http://api-gateway-tutorial.$(minishift ip).nip.io/api/gateway

    ```


    ```

    ["Hello from cluster Backend at host: 172.17.0.13",

    "Hello Spring Boot from cluster Backend at host: 172.17.0.13"]

    ```


    You should see something like this in the logs:


    ```

    i.j.internal.reporters.LoggingReporter : Span reported: d716584c2fab233d:d716584c2fab233d:0:1

    ```


    ### Analyzing the Tracing in Jaeger


    Now that we’ve made a request using the `curl` command, and we’ve seen in the
    logs that this request generated a tracer `Span` that was reported to Jaeger,
    we can open the Jaeger UI to look at some important information. To open the UI
    in your browser, use the following command:


    ```

    minishift openshift service jaeger-query --in-browser

    ```


