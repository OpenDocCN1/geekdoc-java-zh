    **CHAPTER 8**


    **Where Do We Go from Here?**


    We have covered a lot in this report, but we certainly didn’t cover everything!
    Keep in mind we are just scratching the surface here, and there are many more
    things to consider in a microservices environment than what we could explore in
    this report. In this final chapter, we’ll very briefly talk about a couple of
    additional concepts you should be aware of. We’ll leave it as an exercise for
    the reader to dig into more detail for each section!


    **Configuration**


    Configuration is a very important part of any distributed system, and it becomes
    even more difficult with microservices. We need to find a good balance between
    configuration and immutable delivery because we don’t want to end up with snowflake
    services. For example, we’ll need to be able to change logging, switch on features
    for A/B testing, configure database connections, and use secret keys or passwords.
    We saw in some of our examples how to configure our microservices using each of
    the three Java frameworks presented here, but each framework does configuration
    slightly differently.


    What if we have microservices written in Python, Scala, Golang, Node.js, etc.?


    To be able to manage configuration across technologies and within containers,
    we need to adopt an approach that works regardless of what’s actually running
    in the containers. In a Docker environment, we can inject environment variables
    and allow our application to consume those environment variables. Kubernetes allows
    us to do **107**'
