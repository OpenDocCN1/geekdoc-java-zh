- fmt: '

    OpenShift has many features, but one of the most important is that it’s still
    native Kubernetes under the covers and supports role-based access control, out-of-the-box
    software defined networking, security, logins, developer builds, and many other
    things. We mention it here because the flavor of Kubernetes that we’ll use for
    the rest of this book is based on OpenShift. We’ll also use the `oc` OpenShift
    command-line tools, which give us a better user experience and allow us to easily
    log in to our Kubernetes clusters and control which project we’re deploying into.
    Minishift has both vanilla Kubernetes and OpenShift. For the rest of this book,
    we’ll be referring to OpenShift and Kubernetes interchangeably but using OpenShift.


    ## Getting Started with Minishift


    With Minishift, you can build, deploy, and run your microservices as Docker containers
    right on your laptop and then opt to deliver them in a pipeline through other
    application lifecycle management features inside of OpenShift or with your own
    tooling.


    To continue with the examples and idioms in the rest of this report, please install
    Minishift now, following the instructions. There are](http://bit.ly/2Sxhp2k) multiple
    flavors of virtualization (e.g., xhyve, Hyper-V, Linux KVM/libvirtd, and VirtualBox)
    that you can use with Minishift. The installation instructions contain all of
    the details you need to get up and running.


    ## Getting Started with Kubernetes


    To start Minishift, type the following:


    ```bash

    minishift start

    ```


    This should take you through the provisioning process and boot the VM. The VM
    will expose a Docker daemon, the Kubernetes API, and the `oc` command-line tools.
    The `oc` command-line tools will allow you to log in to OpenShift/Kubernetes and
    manage your projects/namespaces. You could use the `kubectl` commands yourself,
    but logging in is easier with the `oc login` command, so for these examples, we’ll
    use `oc`. To have `oc` available in your path, type:


    ```bash

    eval $(minishift oc-env)

    ```


    You might also need to configure OpenShift to enable some Docker images to be
    executed by any user. This is done by running the following command:


    ```bash

    minishift addon apply anyuid

    ```


    -- Applying addon ''anyuid'':.


    When Minishift starts, you will be logged in as a user called `developer`. To
    log in as `admin`, type:


    ```bash

    minishift addon apply admin-user

    ```


    -- Applying addon ''admin-user'':..


    ```bash

    oc login -u admin -p admin

    ```


    Logged into "https://192.168.64.30:8443" as "admin" using existing credentials.


    You don''t have any projects. You can try to create a new project, by running:


    ```bash

    oc new-project <projectname>

    ```


    Next, let’s create a new project/namespace into which we’ll deploy our microservices:


    ```bash

    oc new-project tutorial

    ```


    Now using project "tutorial" on server "https://192.168.64.30:8443".


    Although not required to run these examples, installing the Docker CLI for your
    native developer laptop, is useful as well. This will allow you to list Docker
    images and Docker containers right from your developer laptop as opposed to having
    to log in to the Minishift VM. Once you have the Docker CLI installed, you should
    be able to run Docker directly from your command-line shell:


    ```bash

    eval $(minishift docker-env)

    docker ps

    docker images

    ```


    ## Where to Look Next


    In this chapter, you learned a little about the pains of deploying and managing
    microservices at scale and how Linux containers can help.


    We can leverage immutable delivery to reduce configuration drift, enable repeatable
    deployments, and help us scale our applications regardless of whether they’re
    running. We can use Linux containers to enable service isolation, rapid delivery,
    and portability. We can leverage a scalable container management system like Kubernetes
    and take advantage of a lot of its built-in distributed system features, such
    as service discovery, failover, health checking, and more. We don’t need complicated
    port swizzling or complex service discovery systems when deploying on Kubernetes
    because these are problems that have been solved within the infrastructure itself.
    To learn more, please review the following resources:


    - [“Why Kubernetes Is the New Application Server” by Rafael Benevides](https://red.ht/2T8Lhq6)

    - [“The Decline of Java Application Servers when Using Docker Containers” by James
    Strachan](http://bit.ly/1W6b5OZ)

    - [“An Introduction to Immutable Infrastructure” by Josha Stella](http://oreil.ly/1W6b5OX)

    - [Docker Documentation](https://dockr.ly/2EnOU3l)

    - [OpenShift 3.11 Documentation](https://red.ht/2SkIpCh)

    - [Kubernetes](http://bit.ly/2GCoqxs)

    - [Kubernetes Documentation: Pods](http://bit.ly/2SicC4P)

    - [Kubernetes Documentation: Labels and Selectors](http://bit.ly/2SPuwkq)

    - [Kubernetes Documentation: Deployments](http://bit.ly/2q7vR7Y)

    - [Kubernetes Documentation: Services](http://bit.ly/2NhgFgT)


    ## CHAPTER 6: Cluster Management, Failover, and Load Balancing


    ### Getting Started


    In Chapter 5, we had a quick look at microservices. In this chapter, we will jump
    into cluster management to solve issues with running microservices at scale. To
    deploy our microservices, we will assume that a Docker image exists. However,
    if you want to craft your own Docker image, this chapter will cover the steps
    to make it available. An example Dockerfile to build a fat image would be simple
    as:


    ```dockerfile

    FROM fabric8/java-alpine-jdk

    ENV JAVA_APP_JAR <your-jar-name>

    ENV AB_OFF true

    ADD target/<your-jar-name> /deployments/

    ```


    The environment variable `JAVA_APP_JAR` specifies the name of the JAR file that
    should be called by the `java -jar` command. The environment variable `AB_OFF`
    disables the agent that enables JMX exporter.


    ### Packaging Our Microservices as Docker Images


    Navigate to the `hello-springboot` directory, and create a Dockerfile there with
    the following contents:


    ```dockerfile

    FROM fabric8/java-alpine-jdk

    ENV JAVA_APP_JAR hello-springboot-1.jar

    ENV AB_OFF true

    ADD target/hello-springboot-1.jar /deployments/

    ```


    You can then run the following command to build the Docker image:


    ```bash

    docker build -t rhdevelopers/hello-springboot:1.0 .

    ```


