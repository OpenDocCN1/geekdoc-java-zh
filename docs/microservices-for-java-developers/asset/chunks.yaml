    **Hello World**


    Just like with the Spring Boot framework in the preceding chapter, we want to
    add some basic “Hello World” functionality and then incrementally add more functionality
    on top of it.


    We want to expose an HTTP/REST endpoint at */api/hel o* that will return “Hello
    MicroProfile from *X*,” where *X* is the IP address where the service is running.
    To do this, navigate to *src/main/java/com/*


    *examples/hellomicroprofile/rest*. This location should have been created for
    you if you followed the preceding steps. Then create a new Java class called HelloRestController,
    as shown in [Example 3-1](#index_split_000.html_p47).


    We’ll add a method named hello() that returns a string along with the IP address
    of where the service is running. You’ll see in [Chap‐](#index_split_000.html_p79)


    [ter 6](#index_split_000.html_p79), in the sections on load balancing and service
    discovery, how the host IPs can be used to demonstrate proper failover, load balancing,
    etc.


    **40 | Chapter 3: Eclipse MicroProfile for Microservices**


    *Example 3-1. src/main/java/com/examples/hellomicroprofile/rest/*


    *HelloRestController.java*


    **public** **class** **HelloRestController** {


    **public** String hello() {


    String hostname = **null**;


    **try** {


    hostname = InetAddress.getLocalHost()


    .getHostAddress();


    } **catch** (UnknownHostException e) {


    hostname = "unknown";


    }


    **return** "Hello MicroProfile from " + hostname;


    }


    }


    **Add the HTTP Endpoints**


    You might have noticed that the POJO class HelloRestController in the MicroProfile
    project has exactly the same implementation as the HelloRestController class in
    the Spring Boot project. The only exception will be the HTTP endpoint annotations,
    which we add in


    [Example 3-2](#index_split_000.html_p47):


    @Path


    Maps specific parts of the HTTP URI path to classes and methods.


    @GET


    Specifies that any HTTP GET method will invoke the annotated method. The method
    won’t be called if the path is the same but the HTTP method is anything other
    than GET.


    @Produces


    Specifies the MIME type of the response.


    Again, note that import statements are omitted in the following example.


    *Example 3-2\. src/main/java/com/examples/hel ospringboot/*


    *Hel oRestControl er.java*


    @Path("/api")


    **public** **class** **HelloRestController** {


    **Hello World | 41**


    ![](index-48_1.png)


    @GET


    @Produces("text/plain")


    @Path("/hello")


    **public** String hello() {


    String hostname = **null**;


    **try** {


    hostname = InetAddress.getLocalHost()


    .getHostAddress();


    } **catch** (UnknownHostException e) {


    hostname = "unknown";


    }


    **return** "Hello MicroProfile from " + hostname;


    }


    }


    In this code, all we’ve done is add the aforementioned annotations.


    For example, @Path("/api") at the class level says “map any method-level HTTP
    endpoints under this root URI path.” When we add @Path("/hello") and @GET, we
    are telling MicroProfile to expose an HTTP GET endpoint at */hel o* (which will
    really be */api/*


    *hel o*). The annotation @Produces("text/plain") maps requests with a media type
    of Accept: text/plain to this method.


    If you build the application and run thorntail:run again, you should be able to
    reach the HTTP endpoint:


    $ **mvn clean thorntail:run**


    Now if you point your browser to *http://localhost:8080/api/hel o*, you should
    see a response similar to the one shown in [Figure 3-4.](#index_split_000.html_p48)


    *Figure 3-4\. Successful hel o*


    Now, the same way as we did for Spring Boot, we will see how to inject external
    properties into our app using MicroProfile’s Config API.


    **42 | Chapter 3: Eclipse MicroProfile for Microservices**


    **Externalize Configuration**


    Like Spring Boot, MicroProfile defines a mechanism to externalize configuration.
    It uses different ConfigSources to consume configuration from system properties,
    environment variables, or even from a *META-INF/microprofile-config.properties*
    file. Each of these sources has a different priority, so configuration values
    can be overwrit-ten.


    To see how simple it is to consume external configuration, let’s add a new property
    to our *src/main/resources/META-INF/microprofile-config.properties* file (remember
    to create the folder structure and the file if they don’t exist):


    helloapp.saying=Guten Tag aus


    Now[, as shown in Example 3-3](#index_split_000.html_p49), let’s add the @Inject
    and @Config Property("helloapp.saying") annotations and our new saying field to
    the HelloRestController class. Note that, unlike with Spring Boot, we don’t need
    setters or getters.


    *Example 3-3. src/main/java/com/examples/hellomicroprofile/*


    *HelloRestController.java*


    @Path("/api")


    **public** **class** **HelloRestController** {


    @Inject


    @ConfigProperty(name="helloapp.saying")


    **private** String saying;


    @GET


    @Produces("text/plain")


    @Path("/hello")


    **public** String hello() {


    String hostname = **null**;


    **try** {


    hostname = InetAddress.getLocalHost()


    .getHostAddress();


    } **catch** (UnknownHostException e) {


    hostname = "unknown";


    }


    **return** saying + " " + hostname;


    }


    }


    **Hello World | 43**


    ![](index-50_1.png)


    Because we’ve started using the CDI API in our examples, we’ll also need to add
    the *beans.xml* file, with the contents shown in


    [Example 3-4](#index_split_000.html_p50).


    *Example 3-4\. src/main/resources/META-INF/beans.xml*


    <?xml version="1.0" encoding="UTF-8"?>


    **<beans**


    xmlns="http://xmlns.jcp.org/xml/ns/javaee"


    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"


    xsi:schemaLocation="http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/beans_1_1.xsd"


    bean-discovery-mode="all" **>**


    **</beans>**


    This file will instruct the CDI API to process all the injection points marked
    with the @Inject annotation.


    Let’s stop our application from running (if we haven’t) and restart it: $ **mvn
    clean thorntail:run**


    Now if we navigate to *http://localhost:8080/api/hel o* we should see the German
    version of the saying, as shown in [Figure 3-5](#index_split_000.html_p50).


    *Figure 3-5\. Successful German hel o*


    **Expose Application Metrics and Information**


    Another similarity with Spring Boot is the ability of MicroProfile applications
    to expose endpoints that can be used to monitor our applications. To enable this,
    we need to add the MicroProfile Metrics dependency to our *pom.xml* file.


    Open up the *pom.xml* file for the *hello-microprofile* microservice and add the
    following Maven dependency within the <dependencies>…


    </dependencies> section:


    **44 | Chapter 3: Eclipse MicroProfile for Microservices**


    ![](index-51_1.png)


    **<dependency>**


    **<groupId>** io.thorntail**</groupId>**


    **<artifactId>** microprofile-metrics**</artifactId>**


    **</dependency>**


    Adding this dependency will cause the application to expose a lot of information
    that will be very handy for debugging and general insight.


    Now stop your microservice and restart it by running:


    $ **mvn clean thorntail:run**'
