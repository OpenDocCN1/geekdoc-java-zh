    **CHAPTER 1**


    **Microservices for Java Developers**


    **What Can You Expect from This Report?**


    This report is for Java developers and architects interested in developing microservices.
    We start the report with a high-level introduction and take a look at the fundamental
    prerequisites that should be in place to be successful with a microservices architecture.
    Unfortunately, just using new technology doesn’t magically solve distributed systems
    problems. Therefore, in this chapter we also explore some of the forces involved
    and what successful companies have done to make microservices work for them, including
    aspects such as culture, organizational structure, and market pressures. Then
    we take a deep dive into a few Java frameworks for implementing them. The accompanying
    source code repository can be found on GitHub (`http://bit.ly/2T33s9`). Once we
    have our hands dirty, we’ll come back up for air and discuss issues around deployment,
    clustering, and failover, and how Docker and Kubernetes deliver solutions in these
    areas.


    **You Work for a Software Company**

