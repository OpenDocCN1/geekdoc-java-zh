    \ `@ConfigurationProperties(prefix=\"gateway\")` 注解将网关字符串连接到此类。`@Component` 注解让\
    \ Spring Boot 找到并注册此类作为 Spring Bean。稍后，Camel 将查找每个扩展 `RouteBuilder` 的 Spring Bean，并使用\
