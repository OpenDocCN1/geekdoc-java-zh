    This means our customer-facing services need to account for variability. They
    need to be able to react to the unexpected. This is at odds with efficiency. Customers
    want to have a conversation through a service you provide them, and if that service
    isn’t sufficient for solving their needs, you need loud, fast feedback about what
    would help solve their needs and what’s getting in their way.


    This feedback can be used by the maintainers of the service to quickly adjust
    the service and interaction models to better suit users.


    You cannot wait for decisions to bubble up to the top and go through lengthy planning
    cycles; you need to make decisions quickly with the information you have at the
    edges of your business.


    You need autonomous, purpose-driven, self-organizing teams that are responsible
    for delivering a compelling experience to consumers (paying customers, business
    partners, peer teams, etc.). Rapid feedback cycles, autonomous teams, shared purpose,
    and conversation are the prerequisites that organizations must embrace to be able
    to navigate and live in a postindustrial, unknown, uncharted world of business
    disruption.


    No book on microservices would be complete without quoting Conway’s law: “Organizations
    which design systems…are constrained to produce designs which are copies of the
    communication structures of these organizations.”


    To build agile software systems, we must start with building agile organizational
    structures. This structure will facilitate the prerequisites we need for microservices,
    but what technology do we use?


    Building distributed systems is hard, and in the subsequent sections, we’ll take
    a look at the problems you must keep in mind when building and designing these
    services.


    ## What Is a Microservices Architecture?


    A microservices architecture (MSA) is an approach to building software systems
    that decomposes business domain models into smaller, consistently bounded contexts
    implemented by services. These services are isolated and autonomous yet communicate
    to provide some piece of business functionality. Microservices are typically implemented
    and operated by small teams with enough autonomy that each team and service can
    change the details of its internal implementation (including replacing it outright!)
    with minimal impact `6 | Chapter 1: Microservices for Java Developers` across
    the rest of the system.


    ![](index-13_1.png)


    [Figure 1-4](#index_split_000.html_p13) illustrates how having independent teams
    aids agility.


    *Figure 1-4. Independent teams aid agility*


    Teams communicate through `promises`, which are a way a service can publish intentions
    to other components or systems that may wish to use the service. They specify
    these promises with interfaces of their services and via wikis that document their
    services. If there isn’t enough documentation, or the `API` isn’t clear enough,
    the service provider hasn’t done their job. (There’ll be a little more on promises
    and promise theory in the next section.)


    Each team is responsible for designing its service, picking the right technology
    for the problem set, deploying and managing the service, and waking up at 2 a.m.
    to deal with any issues. For example, at Amazon, there is a single team that owns
    the tax calculation functionality that gets called during checkout. The models
    within this service (`item`, `address`, `tax`, etc.) are all understood to mean
    “within the context of calculating taxes” for a checkout; there is no confusion
    about these objects (e.g., is the item a return item or a checkout item?). The
    team that owns the tax calculation service designs, develops, and operates this
    service. Amazon has the luxury of a mature set of self-service tools to automate
    a lot of the build/deploy/operate steps, but we’ll come back to that.


    With microservices, we can scope the boundaries of a service, which helps us:


    - Understand what the service is doing without getting tangled up in other concerns
    in a larger application.

    - Quickly build the service locally.

    - Pick the right technology for the problem (lots of writes? lots of queries?
    low latency? bursty?).

    - Test the service.

    - Build/deploy/release at the cadence necessary for the business, which may be
    independent of that of other services.

    - Identify and horizontally scale parts of the architecture where needed.

    - Improve the resiliency of the system as a whole.


    MSA helps solve the problem of how we decouple our services and teams to move
    quickly at scale. It allows teams to focus on providing the services and making
    changes when necessary, and to do so without costly synchronization points. Here
    are some things you won’t hear about once you’ve adopted microservices:


    - `Jira` tickets

    - Unnecessary meetings

    - Shared libraries

    - Enterprise-wide canonical models


    Is a microservices architecture right for you? Microservices have a lot of benefits,
    but they come with their own set of drawbacks. You can think of microservices
    as an optimization for problems that require the ability to change things quickly
    at scale, but with a price.


    This approach is not efficient. It can be more resource-intensive.


    You may end up with what looks like duplication. Operational complexity is a lot
    higher. It becomes very difficult to understand the system holistically. It becomes
    significantly harder to debug problems. In some areas you may have to relax the
    notion of a transaction. Teams may not have been designed to work like this.


    Not every part of the business has to be able to change on a dime. A lot of customer-facing
    applications do. Backend systems may not.


    But as those two worlds start to blend together, we may see the forces that justify
    microservices architectures push to other parts of the system.


    `8 | Chapter 1: Microservices for Java Developers`


    ## Challenges


    Designing cloud-native applications following a microservices approach requires
    thinking differently about how to build, deploy, and operate them. We can’t simply
    build our application thinking we know all the ways it will fail and then just
    prevent those. In complex systems like those built with microservices, we must
    be able to deal with uncertainty. This section will identify five main things
    to keep in mind when developing microservices.


    ### Design for Faults


    In complex systems, things fail. Hard drives crash, network cables get unplugged,
    we do maintenance on the live database instead of the backups, and virtual machines
    (`VMs`) disappear. Single faults can be propagated to other parts of the system
    and result in cascading failures that take an entire system down.


    Traditionally, when building applications, we’ve tried to predict what pieces
    of our app (e.g., `n-tier`) might fail and build up a wall big enough to keep
    them from failing. This mindset is problematic at scale because we cannot always
    predict what things can go wrong in complex systems. Things will fail, so we must
    develop our applications to be resilient and handle failure, not just prevent
    it. We should be able to deal with faults gracefully and not let faults propagate
    to total failure of the system.


    Building distributed systems is different from building shared-memory, single-process,
    monolithic applications. One glaring difference is that communication over a network
    is not the same as a local call with shared memory. Networks are inherently unreliable.
    Calls over the network can fail for any number of reasons (e.g., signal strength,
    bad cables/routers/switches, and firewalls), and this can be a major source of
    bottlenecks. Not only does network unreliability have performance implications
    with regard to response times to clients of your service, but it can also contribute
    to upstream systems failure.

