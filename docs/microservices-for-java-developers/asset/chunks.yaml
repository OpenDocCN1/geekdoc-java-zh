    \ others.\n\nKubernetes also has the ability to do autoscaling by watching metrics\
    \ like CPU, memory usage, or user-defined triggers and scaling the number of replicas\
    \ up or down to suit. Autoscaling is outside the scope of this report but is a\
    \ very valuable piece of the cluster management puzzle.\n\n## Service discovery\n\
    \nIn Kubernetes, a Service is a simple abstraction that provides a level of indirection\
    \ between a group of pods and an application using the service represented by\
    \ that group of pods. We’ve seen how pods are managed by Kubernetes and can come\
    \ and go. We’ve also seen how Kubernetes can easily scale up the number of instances\
    \ of a particular service. In our example, we deployed our `backend` service from\
    \ the previous chapters to play the role of service provider. How does our `hello-springboot`\
    \ service communicate with that service?\n\nLet’s take a look at what Kubernetes\
    \ services exist:\n\n```\noc get services\n```\n\n| NAME | TYPE | CLUSTER-IP |\
    \ PORT(S) |\n| :--- | :--- | :--- | :--- |\n| api-gateway | ClusterIP | 172.30.227.148\
    \ | 8080/TCP |\n| backend | ClusterIP | 172.30.169.193 | 8080/TCP |\n| hello-microprofile\
    \ | ClusterIP | 172.30.31.211 | 8080/TCP |\n| hello-springboot | ClusterIP | 172.30.200.142\
    \ | 8080/TCP |\n\nThe `CLUSTER-IP` is assigned when a Service object is created\
    \ and never goes away. It’s a single, fixed IP address that is available to any\
    \ applications running within the Kubernetes cluster and can be used to talk to\
    \ `backend` pods. Take a look at the `service.yml` file for `backend`:\n\n```yaml\n\
    apiVersion: v1\nkind: Service\nmetadata:\n  name: backend\nlabels:\n    app: backend\n\
    \  book: microservices4javadev\nspec:\n  ports:\n  - name: http\n    port: 8080\n\
    \  selector:\n    app: backend\n```\n\nThe pods are “selected” with the `selector`\
    \ field. As we saw in, pods in Kubernetes can be “labeled” with whatever metadata\
    \ we want to apply (like “version” or “component” or “team”), and those labels\
    \ can subsequently be used in the selector for a Service. In this example, we’re\
    \ selecting all the pods with the label `app=backend`. This means any pods that\
    \ have that label can be reached just by using the cluster IP. There’s no need\
    \ for complicated distributed registries (e.g., ZooKeeper, Consul, or Eureka)\
    \ or anything like that; it’s all built right into Kubernetes. Cluster-level DNS\
    \ is also built into Kubernetes. Using DNS in general for microservice discovery\
    \ can be very challenging, if not downright painful. In Kubernetes, the cluster\
    \ DNS points to the cluster IP, and since the cluster IP is a fixed IP and doesn’t\
    \ go away, there are no issues with DNS caching and other gremlins that can pop\
    \ up with traditional DNS.\n\nWhen we deployed our `hello-microprofile` and `hello-springboot`\
    \ microservices, the `deployment.yml` files each declared an environment variable\
    \ called `GREETING_BACKENDSERVICEHOST` with the value `backend`. That value matches\
    \ the name of the backend service that we saw in the output of the command `oc\
    \ get services`. This name was declared in the backend service’s `service.yml`\
    \ file.\n\nThis environment value replaces the value that we declared in their\
    \ `application.yml` file for our `hello-springboot` microservice:\n\n```java\n\
    @ConfigProperty(name = \"GREETING_BACKENDSERVICEHOST\", defaultValue = \"localhost\"\
    )\n```\n\nBecause we declared the name of the service and not the IP address,\
    \ all it takes to find it is a little bit of DNS and the power of Kubernetes service\
    \ discovery. We happen to be using Java in this case, but Tolerance we can spend\
    \ a lot of energy trying to prevent failures, but even then we won’t be able to\
    \ predict every case of where and how dependencies in a microservices environment\
    \ can fail. A corollary to our premise that things will fail is therefore we must\
    \ design our services for failure. Another way of saying that is that we need\
    \ to figure out how to survive in an environment where there are failures.\n\n\
    ## Cluster Self-Healing\n\nIf a service begins to misbehave how will we know about\
    \ it? Ideally, you might think, our cluster management solution could detect and\
    \ alert us about failures and let human intervention take over. This is the approach\
    \ we typically take in traditional environments. But when running microservices\
    \ at scale, where we have lots of services that are supposed to be identical,\
    \ do we really want to stop and troubleshoot every possible thing that can go\
    \ wrong with a service? Long-running services may experience unhealthy states.\
    \ An easier approach is to design our microservices such that they can be terminated\
    \ at any moment, especially when they appear to be behaving incorrectly.\n\nKubernetes\
    \ has a couple of health probes we can use out of the box to allow the cluster\
    \ to administer and self-heal itself. The first is a *readiness probe*, which\
    \ allows Kubernetes to determine whether or not a pod should be considered in\
    \ any service discovery or load-balancing algorithms. For example, some Java apps\
    \ may take a few seconds to bootstrap the containerized process, even though the\
    \ pod is technically up and running. If we start sending traffic to a pod in this\
    \ state, users may experience failures or inconsistent states. With readiness\
    \ probes, we can let Kubernetes query an HTTP endpoint (for example) and only\
    \ consider the pod ready if it gets an HTTP 200 or some other response. If Kubernetes\
    \ determines a pod does not become ready within a specified period of time, the\
    \ pod will be killed and restarted.\n"
