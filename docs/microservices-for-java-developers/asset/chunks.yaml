    \ v4` 库连接到微服务的依赖、用于注册 REST 端点的 servlet，以及用于序列化结果的 JSON 库。\n\n打开 `api-gateway`\
    \ 微服务的 `pom.xml` 文件，并在 `<dependencies>...</dependencies>` 部分添加以下 Maven 依赖：\n\n\
    ```xml\n<dependency>\n    <groupId>org.apache.camel</groupId>\n    <artifactId>camel-http4-starter</artifactId>\n\
    </dependency>\n<dependency>\n    <groupId>org.apache.camel</groupId>\n    <artifactId>camel-servlet-starter</artifactId>\n\
    </dependency>\n<dependency>\n    <groupId>org.apache.camel</groupId>\n    <artifactId>camel-jackson-starter</artifactId>\n\
