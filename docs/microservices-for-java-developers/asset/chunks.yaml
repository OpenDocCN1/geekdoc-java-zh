  trans: '


    在一个具有自治团队和服务的微服务环境中，记住服务提供者与服务消费者之间的关系非常重要。作为一个自治的服务团队，你无法对其他团队和服务施加“义务”，因为你并不拥有它们；根据定义，它们是自治的。你所能做的就是选择接受或拒绝他们对功能或行为的承诺。作为他人的服务提供者，你所能做的就是向他们承诺某种行为。他们可以自由选择信任或不信任。承诺理论（Promise
    theory）是由 Mark Burgess 在 2004 年首次提出的模型，在他的著作 [*In Search of Certainty*](http://bit.ly/1EKwwXG)
    (O’Reilly) 中有所介绍，它是对包括人类、计算机和相互提供服务的组织的自治系统的研究。图 1-6 说明了义务（obligation）与承诺（promise）的区别：义务是施加在团队身上的，而承诺是由团队做出的。


    *图 1-6. 义务与承诺*


    在分布式系统方面，承诺有助于明确服务可能提供的内容，并明确哪些假设是可以成立的，哪些是不能的。例如，假设我们的团队拥有一个图书推荐服务，我们承诺针对你询问的特定用户提供一组个性化的图书推荐。当你调用我们的服务时，如果我们的其中一个后端（存储该用户当前推荐视图的数据库）不可用，会发生什么？


    我们可以向你抛出异常和堆栈跟踪信息，但那将不是非常好的体验，并可能导致系统其他部分的崩溃。因为我们做出了承诺，相反，我们可以尝试尽力遵守它，包括返回一个默认的书籍列表或所有书籍的子集。有时承诺是无法履行的，在这种情况下，确定最佳行动方案应由我们对用户的预期体验或结果驱动。这里的关键在于，我们的服务有责任尝试履行其承诺（返回某些推荐），即使我们依赖的服务无法履行它们的承诺（数据库宕机了）。在尝试履行承诺的过程中，对系统的其他部分以及我们试图维护的服务质量保持同理心是有帮助的。


    看待承诺的另一种方式是将其视为一种为双方（如生产者和消费者）都提供价值的约定交换。但我们如何在两个双方之间决定什么是有价值，以及我们想要达成哪些承诺呢？如果没有人调用我们的服务或从我们的承诺中获得价值，这个服务有多大用？阐述消费者和提供者之间承诺的一种方法是使用*消费者驱动契约*（consumer-driven
    contracts）。通过消费者驱动契约（W(http://bit.ly/2s69I7x)），我们能够通过代码或断言捕获承诺的价值，作为提供者，我们可以利用这些知识来测试我们是否履行了承诺。


    ## 分布式系统管理


    归根结底，管理单一系统比管理分布式系统容易。如果只有一台机器、一个应用程序服务器，且系统出现问题，我们知道去哪里寻找。如果我们需要更改配置、升级到特定版本或对其进行安全保护，它们都在同一个物理和逻辑位置上。


    管理、调试和更改它更加容易。单一系统可能适用于某些用例，但对于需要扩展的用例，我们可能会考虑利用微服务。然而，正如我们之前讨论过的，微服务并不是免费的；拥有灵活性和可扩展性的代价是必须管理一个复杂的系统。


    在管理微服务部署时，这里有一些需要考虑的问题：


    - 我们如何启动和停止一组服务集群？

    - 我们如何跨微服务聚合日志/指标/服务水平协议 (SLAs)？

    - 在服务可以进入、离开、移动等的弹性环境中，我们如何发现服务？

    - 我们如何进行负载均衡？

    - 我们如何了解我们的集群或单个服务的健康状况？

    - 我们如何重启已失败的服务？

    - 我们如何进行细粒度的 API 路由？

    - 我们如何确保我们服务的安全？

    - 如果集群开始崩溃或异常运行，我们如何对其进行限流或断开某些部分的连接？

    - 我们如何部署服务的多个版本并适当地路由到它们？

    - 我们如何在大规模服务集群中进行配置更改？

    - 我们如何以安全、可审计、可重复的方式对应用程序代码和配置进行更改？


    这些都不是容易解决的问题。本报告的其余部分将致力于让 Java 开发者上手并运行微服务，并能够解决此处列出的部分问题。


    ## 技术解决方案


    在报告的其余部分中，我们将向你介绍一些流行的技术组件以及它们如何帮助解决使用微服务架构开发和交付软件的一些问题。正如之前提到的，微服务不仅仅是一个技术问题，建立正确的组织结构和团队以促进这种方法是至关重要的。


    从 SOAP 切换到 REST 并不意味着拥有微服务架构。


    Java 开发团队创建微服务的的第一步是让某些内容在本地机器上运行。本报告将向你介绍三个用于微服务的观点鲜明的 Java 框架：Spring Boot、MicroProfile
    和 Apache Camel。


    每个框架对于不同的团队、组织和微服务方法都有其优势。正如技术领域的常态，某些工具比其他工具更适合使用它们的任务或团队。当然，这些并不是唯一使用的框架。还有几个采用响应式（reactive）微服务的框架，例如
    [Vert.x](http://bit.ly/2Sa7LT2) 和 [Lagom。开发基于响应式](http://bit.ly/2ImXJOK)t 模型的思维转变有所不同，并且需要不同的学习曲线，因此对于本报告，我们将坚持大多数企业
    Java 开发者感到熟悉的模型。


