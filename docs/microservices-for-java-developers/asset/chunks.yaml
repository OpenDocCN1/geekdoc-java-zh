    greeting. The value we send to the backend service for the greeting parameter
    is from the saying field of the GreeterRestController object, which gets injected
    as part of the configuration when we add the @ConfigurationProperties annotation.


    *Example 2-5\. src/main/java/com/example/GreeterRestControl er.java*


    @RestController


    @RequestMapping("/api")


    @ConfigurationProperties(prefix="greeting")


    **public** **class** **GreeterRestController** {


    **private** RestTemplate template = **new** RestTemplate(); **private** String
    saying;


    **private** String backendServiceHost;


    **private** **int** backendServicePort;


    @RequestMapping(value = "/greeting",


    method = RequestMethod.GET, produces = "text/plain") **public** String greeting(){


    String backendServiceUrl = String.format(


    "http://%s:%d/api/backend?greeting={greeting}", backendServiceHost, backendServicePort);


