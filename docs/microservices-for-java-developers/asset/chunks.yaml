    }


    }


    **86 | Chapter 6: Hands-on Cluster Management, Failover, and Load Balancing**


    We also need to add one last annotation, @EnableCircuitBreaker as


    [shown in Example 6-3](#index_split_000.html_p93); that’s necessary to tell Spring
    Cloud that the *hel o-springboot* application uses circuit breakers and to enable
    their monitoring, opening, and closing (behavior supplied, in our case, by Hystrix).


    *Example 6-3\. src/main/java/com/redhat/examples/hel ospringboot/*


    *Hel oSpringbootApplication*


