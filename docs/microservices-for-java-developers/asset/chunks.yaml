    # CHAPTER 5: Deploying Microservices at Scale with Docker and Kubernetes


    In the previous chapters we first talked about microservices at a high level,
    covering organizational agility, designing with dependency thinking, domain-driven
    design, and promise theory, then we took a deep dive into the weeds with three
    popular Java frameworks for developing microservices: Spring Boot, MicroProfile/Thorntail,
    and Apache Camel. We saw how we can leverage the powerful out-of-the-box capabilities
    these frameworks provide easily by exposing and consuming REST endpoints, utilizing
    environment configuration options, packaging as all-in-one executable JAR files,
    and exposing metrics. These concepts all revolve around a single instance of a
    microservice. But what happens when you need to manage dependencies, get consistent
    startup and shutdown behavior, do health checks, and load balance your microservices
    at scale?


    In this chapter, we’re going to discuss those high-level concepts so you understand
    more about the challenges of deploying microservices, regardless of language,
    at scale.


    When we start to break out applications and services into microservices, we end
    up with more moving pieces by definition: we have more services, more binaries,
    more configuration, more interaction points, etc. We’ve traditionally dealt with
    deploying Java applications by building binary artifacts (JARs, WARs, EARs), staging
    them somewhere (shared disks, artifact repositories), opening a ticket, and hoping
    the operations team deploys them into an application server as we intended, with
    the correct permissions. We also deploy our application servers in clusters with
    redundant hardware, load balancers, and shared disks. We may have built some automation
    around the infrastructure with great tools like Chef or Ansible, but somehow deploying
    applications still tends to be fraught with mistakes, configuration drift, and
    unexpected behaviors.


    With this model, we do a lot of hoping, which tends to break down quickly in current
    environments (never mind at scale). Is the application server configured in dev/QA/prod
    like it is on our machine?


    If it’s not, have we completely captured the changes that need to be made and
    expressed to the operations folks? Do any of our changes impact other applications
    also running in the same application server(s)? The JVM that runs an application
    is an implementation detail that is highly coupled to how we configure and tune
    the application, so variations across environments can wreak havoc. When you start
    to deliver microservices, do you run them in separate processes on traditional
    servers? Is process isolation enough? What happens if one JVM goes berserk and
    takes over 100% of the CPU? Or the network I/O? Or a shared disk? What if all
    of the services running on that host crash? Are your applications designed to
    accommodate that?


    ### Immutable Delivery


    Immutable delivery concepts help us reason about these problems.


    With immutable delivery, we try to reduce the number of moving pieces into prebaked
    images as part of the build process. For example, imagine in your build process
    you could output a fully baked image consisting of the operating system, the intended
    version of the JVM, any sidecar applications, and all the configuration. You could
    then deploy this in one environment, test it, and migrate it along a delivery
    pipeline toward production without worrying about whether the environment or application
    is configured consistently.

