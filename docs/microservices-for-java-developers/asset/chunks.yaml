    Latent network calls can be very difficult to debug; ideally, if your network
    calls cannot complete successfully, they fail immediately, and your application
    notices quickly (e.g., through `IOException`). In this case, you can quickly take
    corrective action, provide degraded functionality, or just respond with a message
    stating the request could not be completed properly and that users should try
    again later. But errors in network requests or distributed applications aren’t
    always that easy. What if the downstream application you must call takes longer
    than normal to respond? This is a killer because now your application must take
    into account this slowness by throttling requests, timing out downstream requests,
    and potentially stalling all calls through your service. This backup can cause
    upstream services to experience slowdowns and even grind to a halt.


    And it can cause cascading failures.


    ## Design with Dependencies in Mind

    To be able to move fast and be agile from an organizational or distributed systems
    standpoint, we have to design systems with dependency thinking in mind; we need
    loose coupling in our teams, our technology, and our governance. One of the goals
    with microservices is to take advantage of autonomous teams and autonomous services.
    This means being able to change things as quickly as the business needs without
    impacting the services around us or the system at large. It also means we should
    be able to depend on services, but if they’re not available or are degraded, we
    need to be able to handle this gracefully.


    In his book *Dependency-Oriented Thinking* (InfoQ Enterprise Software Development
    Series), Ganesh Prasad hits it on the head when he says, “One of the principles
    of creativity is to `drop a constraint`. In other words, you can come up with
    creative solutions to problems if you mentally eliminate one or more dependencies.”
    The problem is that our organizations were built with efficiency in mind, and
    that brings along a lot of tangled dependencies.


    For example, when you need to consult with three other teams to make a change
    to your service (DBA, QA, and security), this is not very agile; each one of these
    synchronization points can cause delays. It’s a brittle process. If you can shed
    those dependencies or build them into your team (you definitely can’t sacrifice
    safety or security, so you should build those components into your team), you’re
    free to be creative and more quickly solve problems that customers face or that
    the business foresees without costly people bottlenecks.


    Another angle to the dependency management story is what to do with legacy systems.
    Exposing the details of backend legacy systems (COBOL copybook structures, XML
    serialization formats used by a specific system, etc.) to downstream systems is
    a recipe for disaster.


    Making one small change (customer ID is now 20 numeric characters instead of 16)
    now ripples across the system and invalidates assumptions made by those downstream
    systems, potentially breaking them. We need to think about how to isolate these.


    ## Design with the Domain in Mind

    Models have been used for centuries, but Eric Evans’ seminal book *Domain-Driven
    Design* (Add-Wesley) helps us understand that the real complexity in software
    is not the technology but rather the language surrounding it. We need to build
    models that are cohesive within their own context.


    A bounded context is a set of domain objects that implement a model that tries
    to simplify a part of the business, code, and organization. Often, we strive for
    efficiency when designing our systems when we really need flexibility. In a auto
    parts application, for example, we might try to come up with a “canonical model”
    of the entire domain, and end up with objects like `Part`, `Price`, and `Address`.
    If the inventory application used the `Part` object it would be referring to a
    type of part, like a type of brake or wheel. In an automotive quality assurance
    system, `Part` might refer to a specific part with a serial number and unique
    identifier to track certain quality test results and so forth. We might try diligently
    to efficiently reuse the same model, but inventory tracking and quality assurance
    are different business concerns that use the `Part` object semantically differently.
    With a bounded context for the inventory system, `Part` would explicitly be modeled
    as `PartType` and be understood within that context to represent a “type of part,”
    not a specific instance of a part. With two separate bounded contexts, these `Part`
    objects can evolve consistently within their own models without depending on one
    another in weird ways, and thus we’ve achieved a level of agility or flexibility.
    The context map is what allows us to keep track of the different contexts within
    the application, to prevent ambiguity.


    This deep understanding of the domain takes time. It may take a few iterations
    to fully understand the ambiguities that exist in business models and properly
    separate them out and allow them to change independently. This is at least one
    reason starting off building microservices is difficult. Carving up a monolith
    is no easy task, but a lot of the concepts are already baked into the monolith;
    your job is to identify and separate them. With a greenfield project, you cannot
    carve up anything until you deeply understand the domain. In fact, all of the
    microservice success stories we hear about (like Amazon and Netflix) started out
    going down the path of the monolith before they successfully made the transition
    to microservices.

