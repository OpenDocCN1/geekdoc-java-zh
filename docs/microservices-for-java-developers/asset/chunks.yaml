    be running in production and take advantage of the application packaging and portability
    provided by Linux containers.


    We’ve touched on a few additional important concepts to keep in mind here, like
    configuration, logging, metrics, and continuous, automated delivery. We didn’t
    touch on security, self-service, and countless other topics, but make no mistake:
    they are very much a part of the microservices story.


    We hope you’ve found this report useful. Please follow @openshift,


    @kubernetesio, @rhdevelopers, @rafabene, @christianposta, and


    @RedHat on Twitter for more information, and take a look at the


    [source code repository](http://bit.ly/2T33tS9).


    **110 | Chapter 8: Where Do We Go from Here?**


    **About the Authors**


    **Rafael Benevides** ([@rafabene) is a Director of Developer Experi‐](https://twitter.com/rafabene)


    ence at Red Hat. With many years of experience in several fields of the IT industry,
    he helps developers and companies all over the world to be more effective in software
    development. Rafael is a committer and PMC member of Apache DeltaSpike. He has
    been an active speaker over the last three years at the major IT conferences in
    the world and is a top author at the Red Hat Developer blog.


    When not working, he enjoys building and flying RC airplanes and drones, and also
    does 4x4 wheeling. He lives with his cat Gregory.


    This book is dedicated to his passed-away son, João Gabriel, and to Cynthia Azevedo
    for her support.


    **Christian Posta** ([@christianposta) is a Field CTO a](https://twitter.com/christianposta)t
    [solo.io](https://www.solo.io/) and is well known in the community for being an
    author (his books include *Istio in Action* from Manning and *Microservices for
    Java* *Developers* from O’Reilly), frequent blogger, speaker, open source enthusiast,
    and committer on various open source projects, including Istio and Kubernetes.
    Christian has spent time at web-scale companies and now helps companies create
    and deploy large-scale, resilient distributed architectures—many of them what
    we now call serverless and microservices architectures. He enjoys mentoring, training,
    and leading teams to be successful with distributed systems concepts, microservices,
    DevOps, and cloud-native application design.


