  raw: 'Software really is eating the world. Businesses are slowly starting to realize
    this, and there are two main drivers for this phenomenon: delivering value through
    high-quality services and the rapid commoditization of technology. This report
    is primarily written in a hands-on, by-example format. But before we dive into
    the technology, we need to properly set the stage and understand the forces at
    play. We have been talking ad nauseam in recent years about making businesses
    *agile*, but we need to fully understand what that means.


    Otherwise it’s just a nice platitude that everyone glosses over.


    **The Value of Service**


    For more than 100 years, our business markets have been about creating products
    and driving consumers to want those products: desks, microwaves, cars, shoes,
    whatever. The idea behind this


    “producer-led” economy comes from Henry Ford’s theory that if one could produce
    great volumes of a product at low cost, the market would be virtually unlimited.
    For that to work, you also need a few one-way channels to directly market to the
    masses to convince them that they need these products and their lives will be
    substantially better with them. For most of the 20th century, these one-way channels
    existed in the form of advertisements on TV, in newspapers and magazines, and
    on highway billboards. However, this producer-led economy has been flipped on
    its head because markets are fully saturated with products (how many phones/cars/TVs
    do you need?). Further, the internet, along with social networks, is changing
    the dynamics of how companies interact with consumers (or more importantly, how
    consumers interact with them).


    Social networks allow us, as consumers, to more freely share information with
    one another and the companies with which we do business. We trust our friends,
    family, and others more than we trust marketing departments. That’s why we go
    to social media outlets to choose restaurants, hotels, and airlines. Our positive
    feedback in the form of reviews, tweets, shares, and the like can positively favor
    the brand of a company, and our negative feedback can just as easily and **2 |
    Chapter 1: Microservices for Java Developers**


    ![](index-9_1.png)


    ver[y swiftly destroy a brand. As depicted in Figure 1-1](#index_split_000.html_p9),
    there is now a powerful bidirectional flow of information between companies and
    their consumers that previously never existed, and businesses are struggling to
    keep up with the impact of not owning their brands.


    *Figure 1-1\. Social influence*


    Postindustrial companies are learning they must nurture their relationships (using
    bidirectional communication) with customers to understand how to bring value to
    them. Companies do this by providing ongoing conversation through service, customer
    experience, and feedback. Customers choose which services to consume and which
    to pay for depending on which ones bring them value and good experiences. Take
    Uber, for example, which doesn’t own any inventory or sell products per se. You
    don’t get any value out of sit-ting in someone else’s car, but you may be trying
    to get somewhere that does bring value (a business meeting, for example). In this
    way, using Uber’s service creates value. Going forward, companies will need to
    focus on bringing valuable services to customers, and technology will drive this
    through digital services.


    **The Commoditization of Technology**


    Technology follows a similar boom-and-bust cycle as economics, biology, and law.
    It has led to great innovations, like the steam engine, the telephone, and the
    computer. In our competitive markets, however, game-changing innovations require
    a lot of invest-ment and build-out to quickly capitalize. This brings more competition,
    greater capacity, and falling prices, eventually making **You Work for a Software
    Company | 3**


    ![](index-10_1.png)


    the once-innovative technology a commodity. Upon these commod-ities we continue
    to innovate and differentiate, and the cycle continues. This commoditization has
    brought us from the mainframe to the personal computer to what we now call “cloud
    computing,”


    which is a service bringing us commodity computing with almost no upfront capital
    expenditure. On top of cloud computing, we’re now seeing new innovation in the
    form of digital services.


    [Figure 1-2](#index_split_000.html_p10) shows the value over time curve.


    *Figure 1-2\. The value over time curve*


    Open source is also leading the charge in the technology space. Following the
    commoditization curve, open source is a place developers can go to challenge proprietary
    vendors by building and innovating on software that was once only available (without
    source, no less) with high license costs. This drives communities to build things
    like operating systems (Linux), programming languages (Go), message queues (Apache
    ActiveMQ), and web servers ( *httpd*). Even companies that originally rejected
    open source are starting to come around by open sourcing their technologies and
    contributing to existing communities. As open source and open ecosystems have
    become the norm, we’re starting to see a lot of the innovation in software technology
    coming directly from open source communities (e.g., Apache Spark, Docker, and
    Kubernetes).


    **Disruption**


    The confluence of these two factors—service design and technology evolution—is
    lowering the barrier of entry for anyone with a good idea to start experimenting
    and trying to build new services. You can learn to program, use advanced frameworks,
    and leverage on-demand computing for next to nothing. You can post to social networks,
    blog, and carry out bidirectional conversations with potential **4 | Chapter 1:
    Microservices for Java Developers**


    ![](index-11_1.png)


    users of your service for free. With the fluidity of our business markets, any
    over-the-weekend startup can put a legacy company out of business.


    And this fact scares most CIOs and CEOs. As software quickly becomes the mechanism
    by which companies build digital services and experiences and differentiate themselves,
    many are realizing that they must become software companies in their respective
    verti-cals. Gone are the days of massive outsourcing and treating IT as a commodity
    or cost center. For companies to stay truly competitive, they must embrace software
    as a differentiator, and to do that, they must embrace organizational agility.


    **Embracing Organizational Agility**


    Companies in the industrial-era thinking of the 20th century are not built for
    agility. They are built to maximize efficiencies, reduce vari-ability in processes,
    and eliminate creative thinking in workers, placing them into boxes the way you
    would organize an assembly line.


    They are built like machines to take inputs, apply a highly tuned process, and
    create outputs. They are structured with top-down hierarchical management to facilitate
    this machine-like thinking.


    Changing the machine requires 18-month planning cycles. Information from the edges
    goes through many layers of management and translation to get to the top, where
    decisions are made and handed back down. This organizational approach works great
    when creating products and trying to squeeze every bit of efficiency out of a
    process, but does not work for delivering ser[vices. Figure 1-3](#index_split_000.html_p11)
    illustrates the relation between efficiency and flexibility.


    *Figure 1-3\. Relation between efficiency and flexibility* Customers don’t fit
    in neat boxes or processes. They show up when-ever they want. They want to talk
    to a customer service representa-tive, not an automated phone system. They ask
    for things that aren’t on the menu. They need to input something that isn’t on
    the form.


    Customers want convenience. They want a conversation. And they get mad if they
    have to wait.


    **You Work for a Software Company | 5**'
