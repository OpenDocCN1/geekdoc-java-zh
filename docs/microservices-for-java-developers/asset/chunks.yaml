    # 第二 章：用于微服务的 Spring Boot


    Spring Boot 是一个基于 Spring 依赖注入框架的 own Java 框架，用于构建微服务。Spring Boot 通过减少样板代码、配置和开发者摩擦来促进微服务的创建。这种方法与我们将查看的另外两个框架类似。


    ## Spring Boot 的优势

    与 Spring 框架相比，Spring Boot 提供了优势：

    * 默认倾向于自动、约定好的配置

    * 精选了流行的启动器（starter）依赖集以便方便使用

    * 简化应用程序打包

    * 内置应用洞察（例如指标和环境信息）


    ## 简化配置

    Spring 在历史上是配置的噩梦。尽管该框架改进了其他高度复杂的组件模型（EJB 1.x, 2.x 等），但它确实带来了自己的一套重量级使用模式。也就是说，Spring
    需要大量的 XML 配置，并需要深层理解构造 `JdbcTemplates`、`JmsTemplates`、`BeanFactory` 生命周期钩子、servlet
    监听器以及许多其他组件时所需的单个 bean。事实上，使用 Spring MVC 编写一个简单的“Hello World”需要理解 `DispatcherServlet`
    以及整系列模型-视图-控制器类。Spring Boot 旨在通过一些隐含的约定和简化的注解消除所有这些样板配置——尽管如果你需要，你仍然可以精细地调整底层
    bean。


    ## 启动器依赖

    Spring 常用于大型企业应用，这些应用通常利用许多不同的技术来处理繁重工作：JDBC 数据库、消息队列、文件系统、应用级缓存等。开发者往往得停止手头的工作，切换认知上下文，弄清楚哪些依赖属于哪个功能部分（哦，我需要
    JPA 依赖！），并花费大量时间解决在尝试将这些组件组合在一起时出现的版本冲突和其他问题。


    Spring Boot 提供了一系列精选库集用于添加这些功能部分。这些启动器模块（starter modules）允许你添加如下内容：

    * Java Persistence API (JPA)

    * NoSQL 数据库，如 MongoDB、Cassandra 和 Couchbase

    * Redis 缓存

    * Tomcat/Jetty/Undertow servlet 引擎

    * Java Transaction API (JTA)


    向应用程序添加子模块会引入一组精选的、已知兼容良好的传递依赖和版本，让开发者无需自己去处理依赖。


    ## 应用程序打包

    Spring Boot 确实是一组带有某些配置约定的启动库，但没有理由你不能作为 Web 应用程序归档 (WAR) 在现有的应用服务器中。大多数使用 Spring
    Boot 的开发者偏好的应用程序模式是自包含的 Java 归档 (JAR) 打包，将所有依赖和应用程序代码通过扁平类加载器一起封装在单个 JAR 中。这使得理解应用启动、依赖顺序和日志语句变得更容易。更重要的是，它有助于减少将应用安全发布到生产环境所需的变动部分。你不是把一个应用直接丢进应用服务器；应用一旦构建完成，就可以按样运行——独立运行——包括如果它使用了
    servlet，它会嵌入自己的 servlet 容器。


    没错，现在一个简单的 `java -jar <name.jar>` 就足够启动你的应用程序了！Spring Boot、MicroProfile/Thorntail
    以及 Vert.x 和 Dropwizard 等许多框架都遵循这种将所有内容打包成可执行 uber-JAR 的模式。


    但是我们通常期望应用服务器提供的管理功能怎么办呢？


    ## 生产就绪特性

    Spring Boot 自带了一个名为 `spring boot actuator` 的模块，它可以启用有关应用程序的指标和统计等功能。例如，你可以收集日志、查看指标、执行线程转储、显示环境变量、理解垃圾回收，并显示
    `BeanFactory` 中配置了哪些 bean。你可以通过 HTTP 或 Java 管理扩展 (JMX) 暴露这些信息，你甚至可以通过 SSH 直接登录到进程。


    通过 Spring Boot，你可以利用 Spring 框架的力量，并减少样板配置和代码，以更快速构建强大的、生产就绪的微服务。让我们来看看如何实现。


    ## 入门

    我们将使用 Spring Boot 命令行界面 (CLI) 来引导第一个 Spring Boot 应用（CLI 在底层使用了 Spring Initializr）。如果你不熟悉
    CLI，可以自由探索实现此点的不同方法。替代方案包括为你喜爱的 IDE 安装 Spring Initializr 插件，或使用 Web 版本。


    ### CLI 使用

    一旦安装了 CLI 工具，你应该应该能够检查你安装的 Spring 版本：


    ```bash

    spring --version

    ```


    现在导航到你想托管示例的目录并运行以下命令：


    ```bash

    spring init --build maven --groupId com.redhat.examples --version 1.0 --java-version
    1.8 --dependencies web --name hello-springboot hello-springboot

    ```


    运行此命令后，你应该拥有一个名为 `helloworld` 的目录，其中包含完整的 Spring Boot 应用。如果你运行命令并得到了 `demo.zip`，只需将其解压并继续。让我们快速看一眼这些命令行选项：


    * `--build`: 我们想要使用的构建管理工具（maven 或 gradle）。

    * `--groupId`: 在我们的 `pom.xml` Maven 坐标中使用的 groupId。遗憾的是，这没有正确扩展到生成的 Java 包名中；这些需要手动修改。

    * `--version`: 我们的应用程序版本。

    * `--java-version`: JDK 的构建编译器版本。

    * `--dependencies`: 这是一个有趣的参数；我们可以指定用于常见类型开发的的完整预制依赖集。例如，`web` 将设置 Spring MVC
    并嵌入一个内部 servlet 引擎（默认为 Tomcat，Jetty 和 Undertow 可选）。


