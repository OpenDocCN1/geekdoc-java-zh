    polling the */actuator/health* endpoint of the pod (the endpoint was added when
    we added the actuator to our Spring Boot microservice earlier). If the pod is
    ready, it returns:


    {**"status"** :"UP"}


    The same thing can be done with MicroPorfile/Thorntail and Apache Camel.


    **Circuit Breaker**


    As a service provider, your responsibility is to your consumers to provide the
    functionality you’ve promised. Following promise theory, a service provider may
    depend on other services or downstream systems but cannot and should not impose
    requirements upon them. A service provider is wholly responsible for its promise
    **Fault Tolerance | 83**


    to consumers. Because distributed systems can and do fail, however, there will
    be times when service promises can’t be met or can be only partly met. In our
    previous examples, we showed our “hello”


    microservices reaching out to a *backend* service to form a greeting at the */api/greeting*
    endpoint. What happens if the *backend* service is not available? How do we hold
    up our end of the promise?


    We need to be able to deal with these kinds of distributed systems faults. A service
    may not be available; a network may be experienc-ing intermittent connectivity;
    the backend service may be experienc-ing enough load to slow it down and introduce
    latency; a bug in the backend service may be causing application-level exceptions.
    If we don’t deal with these situations explicitly; we run the risk of degrad-ing
    our own service; holding up threads, database locks, and resources, and contributing
    to rolling, cascading failures that can take an entire distributed network down.
    The following subsections present two different approaches to help us account
    for these failures (one for each technology, Spring Boot and MicroProfile).


    **Circuit breaker with MicroProfile**


    Let’s start with MicroProfile, by adding a microprofile-fault-tolerance dependency
    to our Maven *pom.xml*:


    **<dependency>**


    **<groupId>** io.thorntail**</groupId>**


    **<artifactId>** microprofile-fault-tolerance**</artifactId>**


    **</dependency>**


    Now we can annotate our greeting() method with the annotations


    @CircuitBreaker and @Timeout. But if a backend dependency becomes latent or unavailable
    and MicroProfile intervenes with a circuit breaker, how does our service keep
    its promise? The answer to this may be very domain-specific. Consider our earlier
    example of a personalized book recommendation service. If this service isn’t available
    or is too slow to respond, the backend could default to sending a book list that’s
    not personalized. Maybe we’d send back a book list that’s generic for users in
    a particular region, or just a generic “list of the day.” To do this, we can use
    MicroProfile built-in fallback() method. In [Example 6-1, we add a](#index_split_000.html_p91)
    fallback() method to return a generic response if the backend service is not available.


    We also add the @Fallback annotation to our GreeterRestControl ler class specifying
    the method to call if the greeting invocation **84 | Chapter 6: Hands-on Cluster
    Management, Failover, and Load Balancing**


    fails, along with the @Timeout annotation to avoid the microservice waiting more
    than one second for a reply.


    *Example 6-1. src/main/java/com/example/hellomicroprofile/rest/*


    *GreeterRestController.java*


    @RestController


    @RequestMapping("/api")


    @ConfigurationProperties(prefix="greeting")


    **public** **class** **GreeterRestController** {


    *// Not showing variables*


    @GET


    @Produces("text/plain")


    @Path("greeting")


    @CircuitBreaker


    @Timeout


    @Fallback(fallbackMethod = "fallback")


    **public** String greeting(){


    *// greeting implementation*


    }


    **public** String fallback(){


    **return** saying + " at host " +


    System.getenv("HOSTNAME") + " - (fallback)";


    }


    }


    **Circuit breaker with Spring Boot**


    For Spring Boot, we will use a library from the NetflixOSS stack named Hystrix.
    This library is integrated with Spring through a Spring library called Spring
    Cloud.


    Hystrix is a fault-tolerant Java library that allows microservices to hold up
    their end of a promise by:


    • Providing protection against dependencies that are unavailable


    • Monitoring and providing timeouts to guard against unexpected dependency latency


    • Load shedding and self-healing


    • Degrading gracefully


    • Monitoring failure states in real time


    **Fault Tolerance | 85**


    • Injecting business logic and other stateful handling of faults First, let’s
    add the spring-cloud-starter-netflix-hystrix dependency to our Maven *pom.xml*:


    **<dependency>**


    **<groupId>** org.springframework.cloud**</groupId>**


    **<artifactId>** spring-cloud-starter-netflix-hystrix**</artifactId>**


    **<version>** 2.0.2.RELEASE**</version>**


    **</dependency>**


    In [Example 6-2](#index_split_000.html_p92), we add the annotation @HystricCommand
