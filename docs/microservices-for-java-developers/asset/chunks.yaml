    **Where to Look Next**


    In this chapter, you learned what Spring Boot is and how it’s different from traditional
    WAR/EAR deployments. You also saw some simple use cases, including exposing an
    HTTP/REST endpoint, externalizing configuration, exposing metrics, and calling
    another service. This is just scratching the surface; if you’re interested in
    learning more about Spring Boot, please take a look at the following references:


    • [Spring Boot](http://bit.ly/2U3NbWs)


    • [Spring Boot Reference Guide](http://bit.ly/2T7CSmN)


