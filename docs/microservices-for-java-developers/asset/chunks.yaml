    \n```bash\nmvn spring-boot:run\n```\n\n如果一切正常启动且没有任何错误，你应该能看到类似下面的日志：\n\n```\n\
    2018-12-18 INFO 782 --- [main] MySpringBootApplication\n:Started MySpringBootApplication\
