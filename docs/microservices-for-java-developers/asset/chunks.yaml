    \           hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return \"Hello Spring Boot from \" + hostname;\n    }\n\
    }\n```\n\n### Add the HTTP Endpoints\n\nAt this point, this piece of code is just\
    \ a POJO (plain old Java object), and you could (and should) write a unit test\
