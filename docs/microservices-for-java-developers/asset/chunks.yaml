    \ 1 |\n\nAll the `deployment.yml` files that we used have a `replicas` value of\
    \ 1.\n\nThis means we want to have one pod/instance of our microservice running\
    \ at all times. If a pod dies (or gets deleted), then Kubernetes is charged with\
    \ reconciling the desired state for us, which is `replicas=1`. If the cluster\
    \ is not in the desired state, Kubernetes will take action to make sure the desired\
    \ configuration is satisfied. What happens if we want to change the desired number\
    \ of replicas and scale up our service?\n\n```\noc scale deployment hello-springboot\
    \ --replicas=3\n```\n\n`deployment.extensions/hello-springboot` scaled\n\n## Getting\
    \ Started\n\nNow if we list the pods, we should see three pods running our `hello-springboot`\
    \ application:\n\n```\noc get pods\n```\n\n| NAME | READY | STATUS |\n| :--- |\
    \ :--- | :--- |\n| api-gateway-76649cffc-dgr84 | 1/1 | Running |\n| backend-659d8c4cb9-5hv2r\
    \ | 1/1 | Running |\n| hello-microprofile-844c6c758-mmx4h | 1/1 | Running |\n\
