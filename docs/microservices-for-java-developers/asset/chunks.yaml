    “Packaging Our Microservices as Docker Images” on page 74](#index_split_000.html_p80),
    and run the following commands to rebuild the Docker images:


    ```bash

    $ cd <PROJECT_ROOT>/hello-springboot

    $ mvn clean package

    $ docker build -t rhdevelopers/hello-springboot:1.0 .


    $ cd <PROJECT_ROOT>/hello-microprofile

    $ mvn clean package


    $ docker build -t rhdevelopers/hello-microprofile:1.0 .

    ```


    Now that the images have been rebuilt, we can delete the previous running containers—Kubernetes
    will restart them using the new Docker images:


    **Fault Tolerance | 87**


    ```bash

    $ oc delete pod -l app=hello-springboot

    $ oc delete pod -l app=hello-microprofile

    ```


    We also need to scale the `backend` service to 0 replicas:


    ```bash

    $ oc scale deployment backend --replicas=0

    ```


    Now, we wait for all pods but the `backend` to be Running and try the `api-gateway`
    service to get the response from both microservices:


    ```bash

    $ curl http://api-gateway-tutorial.$(minishift ip).nip.io

    ```


    `/api/gateway`


    ```

    ["Hello at host hello-microprofile-57c9f8f9f4-24c2l- (fallback)", "Hello Spring
    Boot at host hello-springboot-f797878bd-24hxm- (fallback)"]

    ```


    The response now shows that the `fallback()` methods in both microservices were
    invoked because no communication with the `backend` service was possible.


    The idea behind this contrived example is ubiquitous. However, the decision of
    whether to fall back, gracefully degrade, or break a promise is very domain-specific.
    For example, if you’re trying to transfer money in a banking application and a
    backend service is down, you may wish to reject the transfer, or you may wish
    to make only a certain part of the transfer available while the backend gets reconciled.
    Either way, there is no one-size-fits-all fallback method.


    In general, the ideal fallback solution is dependent on what kind of customer
    experience gets exposed and how best to gracefully degrade considering the domain.


    ## Load Balancing


    In a highly scaled distributed system, we need a way to discover and load balance
    against services in the cluster. As we’ve seen in previous examples, our microservices
    must be able to handle failures; therefore, we have to be able to load balance
    against services that exist, services that may be joining or leaving the cluster,
    or services that exist in an autoscaling group. Rudimentary approaches to load
    balancing, like round-robin DNS, are not adequate. We may also need sticky sessions,
    autoscaling, or more complex load-balancing algorithms. Let’s take a look at a
    few different ways of doing load balancing in a microservices environment.


    **88 | Chapter 6: Hands-on Cluster Management, Failover, and Load Balancing**


    ### Kubernetes Load Balancing


    The great thing about Kubernetes is that it provides a lot of distributed systems
    features out of the box; no need to add any extra components (server side) or
    libraries (client side). Kubernetes Services provide a means to discover microservices,
    and they also provide server-side load balancing. If you recall, a Kubernetes
    Service is an abstraction over a group of pods that can be specified with label
    selectors. For all the pods that can be selected with the specified selector,
    Kubernetes will load balance any requests across them. The default Kubernetes
    load-balancing algorithm is round robin, but it can be configured for other algorithms,
    such as session affinity. Note that clients don’t have to do anything to add a
    pod to the Service; just adding a label to your pod will enable it for selection.
    Clients reach the Kubernetes Service by using the cluster IP or cluster DNS service
    provided out of the box by Kubernetes. Also recall the cluster DNS service is
    not like traditional DNS and does not fall prey to the DNS caching TTL problems
    typically encountered with using DNS for discovery/load balancing. Furthermore,
    there are no hardware load balancers to configure or maintain; it’s all just built
    in.


    To demonstrate load balancing, let’s scale up the `backend` services in our cluster
    and scale our `hello-springboot` service back to one replica to reduce the resource
    usage:


    ```bash

    $ oc scale deployment hello-springboot --replicas=1

    deployment.extensions/hello-springboot scaled


    $ oc scale deployment backend --replicas=3

    deployment.extensions "backend" scaled

    ```


    Now if we check our pods, we should see three `backend` pods:


    ```bash

    $ oc get pods

    NAME READY STATUS

    api-gateway-9786d4977-2jnfm 1/1 Running

    backend-859bbd5cc-ck68q 1/1 Running

    backend-859bbd5cc-j46gj 1/1 Running

    backend-859bbd5cc-mdvcs 1/1 Running

    hello-microprofile-57c9f8f9f4-24c2l 1/1 Running

    hello-springboot-f797878bd-24hxm 1/1 Running

    ```


    If we describe the Kubernetes services `backend`, we should see the selector used
    to select the pods that will be eligible for taking **Load Balancing | 89** requests.
    The Service will load balance to the pods listed in the End points field:


    ```bash

    $ oc describe service backend

    Name: backend

    Namespace: microservices4java

    Labels: app=backend

    Annotations: <none>

    Selector: app=backend

    Type: ClusterIP

    IP: 172.30.169.193

    Port: 80/TCP

    TargetPort: 8080

    Endpoints: 172.30.169.193:8080, 172.30.169.194:8080, 172.30.169.195:8080

    ```

