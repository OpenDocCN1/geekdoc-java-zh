    \ 所示的结果。\n\n*图 3-6. MicroProfile 指标*\n\n**Hello World | 45**\n\n![](img/index-52_1.png)\n\
    \n很简单，对吧？\n\n### 在 Maven 之外运行\n\n还记得在 Maven 之外运行 Spring Boot 有多简单吗？\n\n幸运的是，使用\
