    这意味着我们的面向客户的服务需要考虑到变数。它们需要能够对意外情况做出反应。这与效率是冲突的。客户希望通过你提供的服务与你交流，如果该服务不足以满足他们的需求，你需要获得响亮、快速的反馈，告知什么有助于解决他们的需求，以及哪些因素阻碍了他们。


    服务的维护者可以使用这些反馈来快速调整服务及其模型和交互模型，以更好地适应用户。


    你不能等待决策层层汇报到顶层并经过漫长的规划周期；你需要根据在业务边缘掌握的信息快速做出决策。


    你需要自主的、目标驱动的、自组织的团队，这些团队负责为消费者（付费客户、业务伙伴、同级团队等）提供引人的体验。快速的反馈循环、自主团队、共同目标和对话是组织必须拥抱的决，，以便能够在后工业时代、未知且未探险的业务颠覆世界中导航并生存。


    任何关于微服务的书籍，如果不引用康威定律（Conway’s law），都是不完整的：“设计系统的组织……受限于产生与其通信结构相似的设计。”


    要构建敏捷的软件系统，我们必须从构建敏捷的组织结构开始。这种结构将促进微服务所需的先决条件，但我们使用什么技术呢？


    构建分布式系统是困难的，在随后的章节中，我们将看看构建和设计这些服务时必须牢记的问题。


    ## 什么是微服务架构？


    微服务架构（MSA）是一种构建软件系统的方法，它将业务领域模型分解为较小的、边界一致的上下文（contexts），并由服务实现。这些服务是隔离且自主的，但通过通信来提供某些业务功能。微服务通常由小型团队实现和运行，这些团队具有足够的自主性，使得每个团队和服务都可以更改其内部实现的细节（甚至完全替换！），而对系统其他部分的影响极小。`6
    | 第一章：面向 Java 开发者的微服务`


    ![](img/index-13_1.png)


    图 1-4 展示了独立团队如何有助于敏捷性。


    *图 1-4. 独立团队有助于敏捷性*


    团队通过 `promises`（承诺）进行通信，这是服务向可能想要使用该服务的其他组件或系统发布意图的方式。它们通过服务的接口以及记录服务的维基（wikis）来指定这些承诺。如果文档不足，或者
    `API` 不够清晰，服务提供者就没有完成他们的工作。（下一节将对承诺和承诺理论进行更多介绍。）


    每个团队都负责设计自己的服务、为问题集选择合适的技术、部署和管理服务，并在凌晨 2 点醒来处理任何问题。例如，在 Amazon，有一个单一团队拥有结账时的税务计算功能，该功能在结账期间会被调用。该服务内部的模型（`item`、`address`、`tax`
    等）都被理解为“在结账计算税务的范围内”；对于这些对象不会产生歧义（例如，物品是退货物品还是结账物品？）。拥有税务计算服务的团队负责设计、开发和运行该服务。Amazon
    拥有成熟的自助工具集作为这种奢侈，可以自动化许多构建/部署/运行步骤，但我们会回到这一点。


    通过微服务，我们可以界定服务的边界，这有助于我们：


    - 理解服务在做什么，而不会被大型应用程序中的其他关注点缠绕在一起。

    - 在本地快速构建服务。

    - 为问题选择合适的技术（大量写入？大量查询？低延迟？突发性？）。

    - 测试服务。

    - 按业务所需的节奏构建/部署/发布，这种节奏可能独立于其他服务。

    - 在需要的地方识别架构并进行水平扩展。

    - 提高整个系统的韧性。


    MSA 帮助解决如何解耦服务和团队以便在大规模快速移动的问题。它允许团队专注于提供服务并在必要时做出更改，而无需昂贵的同步点。一旦你采用了微服务，你将再也不会听过这些内容了：


    - `Jira` 工单

    - 不必要的会议

    - 共享库

    - 企业级统一规范模型


    微服务架构适合你吗？微服务有很多优点，但它们也有许多自己的缺点。你可以将微服务视为对那些需要在大范围内快速更改事物的问题的优化，但这是有代价的。


    这种方法并不是高效的。它可能更消耗资源。


    你可能会得到看起来像重复的内容。操作复杂性要高得多。从整体理解系统变得非常困难。调试问题变得极其困难。在某些领域，你可能不得不放弃事务的概念。团队的设计可能不是为了这样工作的。


    业务的每个部分都需要随时更改。许多面向客户的应用程序是。后端系统可能不是。


    但当这两个世界开始融合在一起时，我们可能会看到支持微服务架构的因素推向系统的其他部分。


    `8 | 第一章：面向 Java 开发者的微服务`


    ## 挑战


    遵循微服务方法设计云原生应用，需要对如何构建、部署和运行它们进行不同的思考。我们不能简单地在构建应用程序时认为我们知道它可能失败的所有方式，然后仅仅阻止它们。在用微服务构建的复杂系统中，我们必须能够处理不确定性。本节将识别开发微服务时需要牢记的五个主要事项。


    ### 针对故障的设计


    在复杂系统中，万事皆故障。硬盘崩溃、网络电缆被拔掉、我们在活动数据库而不是备份上进行维护、虚拟机（`VMs`）消失。单个故障可能会传播到系统的其他部分，并导致导致整个系统的级联故障。


    传统上，在构建应用程序时，我们尝试预测应用程序的哪些部分（例如 `n-tier`）可能会失败，并建立起足够大的墙来防止它们失败。这种思维在大规模下是有问题的，因为我们无法总是预测复杂系统中会发生什么。故障将会发生，所以我们必须开发我们的应用程序使其具有韧性并处理故障，而不仅仅是防止故障。我们应该能够优雅地处理故障，而不是让故障传播导致系统性故障。


    构建分布式系统与构建共享内存、单进程单体应用不同。一个显著的区别是，网络通信与共享内存的本地调用不同。网络本质上是不可靠的。网络调用可能由于任何原因而失败（例如信号强度、糟糕的电缆/路由器/交换机以及防火墙），这可能是一个瓶颈的主要来源。网络不可靠性不仅对服务客户的响应时间产生性能影响，还可能导致上游系统的故障。


