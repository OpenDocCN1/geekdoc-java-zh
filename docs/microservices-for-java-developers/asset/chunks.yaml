    \        backendServiceUrl, BackendDTO.class, saying);\n        return response.getGreeting()\
    \ + \" at host \" +\n        response.getIp();\n    }\n\n    public String fallback(){\n\
    \        return saying + \" at host \" +\n        System.getenv(\"HOSTNAME\")\
    \ + \" - (fallback)\";\n    }\n}\n```\n\n`86 | 第 6 章：集群管理、故障转移和负载均衡`\n\n我们还需要添加最后一个注解\
