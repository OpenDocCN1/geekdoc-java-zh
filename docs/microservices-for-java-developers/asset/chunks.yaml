    Exposing runtime insights like this frees up the developer to just focus on writing
    code for the microservice that delivers business value. Delegating the heavy lifting
    and boilerplate to frameworks is definitely a good idea.


    **Running Outside of Maven**


    Up to this point we’ve been thinking about development and building our Hello
    World microservice from the perspective of a developer’s laptop using Maven. But
    what if you want to distribute your microservice to others or run it in a live
    environment (development, QA, production)?


    Luckily, with Spring Boot it only takes a few steps to get ready for shipment
    and production. Spring Boot prefers atomic, executable JARs with all dependencies
    packed into a flat classpath. This means the JAR that we create as part of a call
    to mvn clean package is executable and contains all we need to run our microservice
    in a Java environment. To test this out, go to the root of the *hel o-springboot*
    microservice project and run the following commands:


    $ **mvn clean package**


    $ **ava -jar target/hello-springboot-1.0.jar**


    If your project was named *demo* instead of *hel o-springboot*, then substitute
    the properly named JAR file ( *demo-1.0.jar*).


    That’s it!


    We’ll notice this sort of idiom when we explore MicroProfile in the next chapter,
    too.


    **Calling Another Service**


    In a microservices environment, each service is responsible for providing its
    functionality or service to other collaborators. As we discussed in the first
    chapter, building distributed systems is hard, and **Calling Another Service |
    29**


    ![](index-36_1.png)


    we cannot abstract away the network or the potential for failures.


    We will cover how to build resilient interactions with our dependen‐


    [cies in Chapter 5](#index_split_000.html_p67). In this section, however, we will
    just focus on getting a service to talk to a dependent service.


    If we wish to extend the *hel o-springboot* microservice, we will need to create
    a service that we can call using Spring’s REST client functionality. For this
    example and the rest of the examples in the report, we’ll use a backend service
    and modify our service to reach out to the backend to generate the greetings we
    want to be able to use, as indicated by [Figure 2-5.](#index_split_000.html_p36)


    *Figure 2-5\. Cal ing another service*


    If you look a[t the source code for this report, you](http://bit.ly/2T33tS9)’ll
    see a Maven module called backend that contains a very simple HTTP servlet that
    can be invoked with a GET request and query parameters. The code for this backend
    is very simple, and it does not use any of the microservice frameworks (Spring
    Boot, MicroProfile etc.). We have created a ResponseDTO object that encapsulates
    time, ip, and greet ing fields. We also leverage the awesome Jackson library for
    JSON


    data binding, as seen here:


