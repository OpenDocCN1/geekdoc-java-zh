    \  selector:\n    app: backend\n```\n\npod 通过 `selector` 字段被“选中”的。正如我们看到的，Kubernetes\
    \ 中的 pod 可以打上我们任何想要应用的元数据标签（例如“版本”或“组件”或“团队”），这些标签随后可以用于 Service 的选择器中。在这个示例中，我们选择了所有带有\
    \ `app=backend` 标签的 pod。这意味着任何带有该标签的 pod 都可以通过使用集群 IP 直接访问。不需要复杂的分布式注册中心（例如 ZooKeeper、Consul\
    \ 或 Eureka）或类似的机制；这一切都内置在 Kubernetes 中。集群级 DNS 也内置在 Kubernetes 中。通常在微服务发现中使用 DNS\
    \ 可能非常具有挑战性，甚至可以说是非常痛苦。在 Kubernetes 中，集群 DNS 指向集群 IP，由于集群 IP 是固定的且不会消失，因此不存在 DNS\
    \ 缓存问题以及传统 DNS 可能出现的其他怪异问题。\n\n当我们部署 `hello-microprofile` 和 `hello-springboot`\
    \ 微服务时，每个 `deployment.yml` 文件都声明了一个名为 `GREETING_BACKENDHOST` 的环境变量，值为 `backend`。这正是我们在\
    \ `oc get services` 输出中看到的后端服务的名称。我们在 `service.yml` 文件中声明了我们在 `hello-springboot`\
    \ 微服务的 `application.yml` 文件中的：\n\n```java\n@ConfigProperty(name = \"GREETING_BACKENDHOST\"\
    , defaultValue = \"localhost\")\n```\n\n因为我们声明的是服务的名称而不是 IP 地址，找到它只需要一点 DNS 和\
    \ Kubernetes 服务发现的能力。在这种情况下我们恰好使用 Java，但我们可以投入大量精力尝试防止故障，但即使如此，我们也无法预测微服务环境中依赖项会在何时以及如何故障。故障将会发生这一前提的推论是，我们必须为故障而设计服务。另一种说法是，我们需要学会如何在故障故障环境中生存。\n\
    \n## 集群自愈\n\n如果一个服务开始表现异常，我们将如何知道？理想情况下，你可能会认为，我们的集群管理解决方案可以检测并向我们报告故障，然后让人工干预。这是我们在传统环境中通常采取的方法。但在大规模运行微服务时，当我们有许多应该是相同的的服务时，我们真的想停下来排查服务可能发生的任何问题吗？长时间运行的服务可能会经历不健康状态。一种更容易的方法是设计我们的微服务使其可以在任何时候被终止，特别是当它们看起来运行不正常时。\n\
    \nKubernetes 有几个可以使用即用的健康探针，允许集群进行管理和自愈。第一个是*就绪探针*（readiness probe），它允许 Kubernetes\
    \ 判断一个 pod 是否应该被考虑在任何服务发现或负载均衡算法中。例如，某些 Java 应用可能需要几秒钟来启动容器化进程，即使 pod 在技术上已经运行。如果我们向这种状态下的\
    \ pod 发送流量，用户可能会遇到故障或不状态。通过就绪探针，我们可以让 Kubernetes 查询一个 HTTP 端点（例如），并且只有在收到 HTTP\
    \ 200 或其他响应时才认为该 pod 就绪。如果 Kubernetes 确定 pod 在规定时间内没有变得就绪，则 pod 将杀死并重启。\n\n"
- fmt: "\nAnother health probe we can use is a liveness probe. This is similar to\
    \ the readiness probe; however, it’s applicable after a pod has been determined\
    \ to be “ready” and is eligible to receive traffic. Over the course of the life\
    \ of a pod or service, if the liveness probe (which could also be a simple HTTP\
    \ endpoint) starts to indicate an unhealthy state (e.g., HTTP 500 errors), Kubernetes\
    \ can automatically kill the pod and restart it.\n\nIn the `deployment.yml` file\
    \ shown earlier we declared both of these, with `livenessProbe` and `readinessProbe`:\n\
    \n```yaml\nlivenessProbe:\n  httpGet: # make an HTTP request\n    port: 8080 #\
    \ port to use\n    path: /actuator/health # endpoint to hit\n    scheme: HTTP\
    \ # or HTTPS\n...\nreadinessProbe:\n  httpGet: # make an HTTP request\n    port:\
    \ 8080 # port to use\n    path: /actuator/health # endpoint to hit\n    scheme:\
    \ HTTP # or HTTPS\n```\n\nThis means the “readiness” of a `hello-springboot` pod\
    \ will be determined by periodically polling the `/actuator/health` endpoint of\
    \ the pod (the endpoint was added when we added the actuator to our Spring Boot\
    \ microservice earlier). If the pod is ready, it returns:\n\n```json\n{\"status\"\
    \ :\"UP\"}\n```\n\nThe same thing can be done with MicroPorfile/Thorntail and\
    \ Apache Camel.\n\n### Circuit Breaker\n\nAs a service provider, your responsibility\
    \ is to your consumers to provide the functionality you’ve promised. Following\
    \ promise theory, a service provider may depend on other services or downstream\
    \ systems but cannot and should not impose requirements upon them. A service provider\
    \ is wholly responsible for its promise `Fault Tolerance | 83` to consumers. Because\
    \ distributed systems can and do fail, however, there will be times when service\
    \ promises can’t be met or can be only partly met. In our previous examples, we\
    \ showed our “hello” microservices reaching out to a `backend` service to form\
    \ a greeting at the `/api/greeting` endpoint. What happens if the `backend` service\
    \ is not available? How do we hold up our end of the promise?\n\nWe need to be\
    \ able to deal with these kinds of distributed systems faults. A service may not\
    \ be available; a network may be experiencing intermittent connectivity; the backend\
    \ service may be experiencing enough load to slow it down and introduce latency;\
    \ a bug in the backend service may be causing application-level exceptions. If\
    \ we don’t deal with these situations explicitly; we run the risk of degrad-ing\
    \ our own service; holding up threads, database locks, and resources, and contributing\
    \ to rolling, cascading failures that can take an entire distributed network down.\
    \ The following subsections present two different approaches to help us account\
    \ for these failures (one for each technology, Spring Boot and MicroProfile).\n\
    \n### Circuit breaker with MicroProfile\n\nLet’s start with MicroProfile, by adding\
    \ a `microprofile-fault-tolerance` dependency to our Maven `pom.xml`:\n\n```xml\n\
    <dependency>\n  <groupId>io.thorntail</groupId>\n  <artifactId>microprofile-fault-tolerance</artifactId>\n\
    </dependency>\n```\n\nNow we can annotate our `greeting()` method with the annotations\
    \ `@CircuitBreaker` and `@Timeout`. But if a backend dependency becomes latent\
    \ or unavailable and MicroProfile intervenes with a circuit breaker, how does\
    \ our service keep its promise? The answer to this may be very domain-specific.\
    \ Consider our earlier example of a personalized book recommendation service.\
    \ If this service isn’t available or is too slow to respond, the backend could\
    \ default to sending a book list that’s not personalized. Maybe we’d send back\
    \ a book list that’s generic for users in a particular region, or just a generic\
    \ “list of the day.” To do this, we can use MicroProfile built-in `fallback()`\
    \ method. In [Example 6-1, we add a]`fallback()` method to return a generic response\
    \ if the backend service is not available.\n\nWe also add the `@Fallback` annotation\
    \ to our `GreeterRestController` class specifying the method to call if the greeting\
    \ invocation `84 | Chapter 6: Hands-on Cluster Management, Failover, and Load\
    \ Balancing` fails, along with the `@Timeout` annotation to avoid the microservice\
    \ waiting more than one second for a reply.\n\n*Example 6-1. src/main/java/com/example/hellomicroprofile/rest/*\n\
    *GreeterRestController.java*\n\n```java\n@RestController\n@RequestMapping(\"/api\"\
    )\n@ConfigurationProperties(prefix=\"greeting\")\npublic class GreeterRestController\
    \ {\n    // Not showing variables\n\n    @GET\n    @Produces(\"text/plain\")\n\
    \    @Path(\"greeting\")\n    @CircuitBreaker\n    @Timeout\n    @Fallback(fallbackMethod\
    \ = \"fallback\")\n    public String greeting(){\n        // greeting implementation\n\
    \    }\n\n    public String fallback(){\n        return saying + \" at host \"\
    \ +\n        System.getenv(\"HOSTNAME\") + \" - (fallback)\";\n    }\n}\n```\n\
    \n### Circuit breaker with Spring Boot\n\nFor Spring Boot, we will use a library\
    \ from the NetflixOSS stack named `Hystrix`. This library is integrated with Spring\
    \ through a Spring library called `Spring Cloud`.\n\nHystrix is a fault-tolerant\
    \ Java library that allows microservices to hold up their end of a promise by:\n\
    - Providing protection against dependencies that are unavailable\n- Monitoring\
    \ and providing timeouts to guard against unexpected\n- Load shedding and self-healing\n\
    - Degrading gracefully\n- Injecting business logic and other stateful handling\
    \ of faults `Fault Tolerance | 85`\n\nFirst, let’s add `spring-cloud-starter-netflix-hystrix`\
    \ to `pom.xml`:\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-netflix-hystrix</artifactId>\n  <version>2.0.2</version>\n\
    </dependency>\n```\n\nIn [Example 6-2], we add the annotation `@HystrixCommand`\
    \ and the `fallback()` method to the `GreeterRestController` class.\n\n*Example\
    \ 6-2. src/main/java/com/example/**\n*GreeterRestController.java*\n\n```java\n\
    @RestController\n@RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"\
    greeting\")\npublic class GreeterRestController {\n    // Not showing variables\
    \ and setters\n\n    @RequestMapping(value = \"/greeting\",\n    method = RequestMethod.GET,\
    \ produces = \"text/plain\")\n    @HystrixCommand(fallbackMethod = \"fallback\"\
    )\n    public String greeting(){\n        String backendServiceUrl = String.format(\n\
    \        \"http://%s:%d/api/backend?greeting={greeting}\", backendServiceHost,\
    \ backendServicePort);\n        System.out.println(\"Sending to: \" + backendServiceUrl);\n\
    \        BackendDTO response = template.getForObject(\n        backendServiceUrl,\
    \ BackendDTO.class, saying);\n        return response.getGreeting() + \" at host:\
    \ \" +\n        response.getIp();\n    }\n\n    public String fallback(){\n  \
    \      return saying + \" at host \" +\n        System.getenv(\"HOSTNAME\") +\
    \ \" - (fallback)\";\n    }\n}\n```\n\n`86 | Chapter 6: Hands-on Cluster Management,\
    \ Failover, and Load Balancing`\n\nWe also need to add one last annotation, `@EnableCircuitBreaker`\
    \ as [shown in Example 6-3]; that’s necessary to tell Spring Cloud that the `hello-springboot`\
    \ application uses circuit breakers and to enable their monitoring, opening, and\
    \ closing (behavior supplied, in our case, by Hystrix).\n\n*Example 6-3. src/main/java/com/redhat/examples/hellosspringboot/*\n\
    *HelloSpringbootApplication*\n\n```java\n@EnableCircuitBreaker\n@SpringBootApplication\n\
    public class HelloSpringbootApplication {\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(HelloSpringbootApplication.class, args);\n\
    \    }\n}\n```\n\n### Testing the circuit breaker\n\nWe know that both microservices\
    \ ( `hello-microprofile` and `hello-springboot`) depend on `backend`. What should\
    \ be the expected behavior if we stop the `backend` application after we’ve made\
    \ the latest modifications?\n\nTo test this behavior, we need to recreate the\
    \ Docker image and restart the containers so the new image will be loaded.\n\n\
    If you want to build your own source code, navigate to the directory where your\
    \ microservices are, create the Dockerfile as instructed in\n"
