    # CHAPTER 2: Spring Boot for Microservices


    Spring Boot is an opinionated Java framework for building microservices based
    on the Spring dependency injection framework. Spring Boot facilitates creation
    of microservices through reduced boilerplate, configuration, and developer friction.
    This is a similar approach to the two other frameworks we’ll look at.


    ## Advantages of Spring Boot

    Spring Boot offers the following advantages in comparison to the Spring framework:

    * Favoring automatic, conventional configuration by default

    * Curating sets of popular starter dependencies for easier consumption

    * Simplifying application packaging

    * Baking in application insight (e.g., metrics and environment info)


    ## Simplified Configuration

    Spring historically was a nightmare to configure. Although the framework improved
    upon other high-ceremony component models (EJB 1.x, 2.x, etc.), it did come along
    with its own set of heavy-weight usage patterns. Namely, Spring required a lot
    of XML configuration and a deep understanding of the individual beans needed to
    construct `JdbcTemplates`, `JmsTemplates`, `BeanFactory` lifecycle hooks, servlet
    listeners, and many other components. In fact, writing a simple “Hello World”
    with Spring MVC required understanding of `DispatcherServlet` and a whole host
    of Model–View–Controller classes. Spring Boot aims to eliminate all of this boilerplate
    configuration with some implied conventions and simplified annotations—although,
    you can still finely tune the underlying beans if you need to.


    ## Starter Dependencies

    Spring was used in large enterprise applications that typically leveraged lots
    of different technologies to do the heavy lifting: JDBC databases, message queues,
    file systems, application-level caching, etc. Developers often had to stop what
    they were doing, switch cognitive contexts, figure out what dependencies belonged
    to which piece of functionality (“Oh, I need the JPA dependencies!”), and spend
    lots of time sorting out versioning mismatches and other issues that arose when
    trying to use these various pieces together.


    Spring Boot offers a large collection of curated sets of libraries for adding
    these pieces of functionality. These starter modules allow you to add things like:

    * Java Persistence API (JPA)

    * NoSQL databases like MongoDB, Cassandra, and Couchbase

    * Redis caching

    * Tomcat/Jetty/Undertow servlet engines

    * Java Transaction API (JTA)


    Adding a submodule to an application brings in a curated set of transitive dependencies
    and versions that are known to work together, saving developers from having to
    sort out dependencies themselves.


    ## Application Packaging

    Spring Boot really is a set of bootstrap libraries with some convention for configurations,
    but there’s no reason why you couldn’t run a Spring Boot application inside your
    existing application servers as a Web Application Archive (WAR). The idiom that
    most developers who use Spring Boot prefer for their applications is the self-contained
    Java Archive (JAR) packaging, where all dependencies and application code are
    bundled together with a flat class loader in a single JAR. This makes it easier
    to understand application startup, dependency ordering, and log statements. More
    importantly, it also helps reduce the number of moving pieces required to take
    an app safely to production. You don’t take an app and chuck it into an app server;
    the app, once it’s built, is ready to run as is—standalone—including embedding
    its own servlet container if it uses servlets.


    That’s right, a simple `java -jar <name.jar>` is enough to start your application
    now! Spring Boot, MicroProfile/Thorntail, and many other frameworks like Vert.x
    and Dropwizard all follow this pattern of packaging everything into an executable
    uber-JAR.


    But what about the management things we typically expect out of an application
    server?


    ## Production-Ready Features

    Spring Boot ships with a module called `spring boot actuator` that enables things
    like metrics and statistics about your application. For example, you can collect
    logs, view metrics, perform thread dumps, show environment variables, understand
    garbage collection, and show which beans are configured in the `BeanFactory`.
    You can expose this information via HTTP or Java Management Extensions (JMX),
    or you can even log in directly to the process via SSH.


    With Spring Boot, you can leverage the power of the Spring framework and reduce
    boilerplate configuration and code to more quickly build powerful, production-ready
    microservices. Let’s see how.


    ## Getting Started

    We’re going to use the Spring Boot command-line interface (CLI) to bootstrap our
    first Spring Boot application (the CLI uses Spring Initializr under the covers).
    You are free to explore the different ways to do this if you’re not comfortable
    with the CLI. Alternatives include Spring Initializr plug-ins for your favorite
    IDE, or using the web version.


    ### CLI Usage

    Once you’ve installed the CLI tools, you should be able to check the version of
    Spring you have:


    ```bash

    spring --version

    ```


    Now navigate to the directory where you want to host your examples and run the
    following command:


    ```bash

    spring init --build maven --groupId com.redhat.examples --version 1.0 --java-version
    1.8 --dependencies web --name hello-springboot hello-springboot

    ```


    After running this command, you should have a directory named `helloworld` with
    a complete Spring Boot application. If you run the command and end up with `demo.zip`,
    then just unzip it and continue. Let’s take a quick look at what those command-line
    options are:


    * `--build`: The build management tool we want to use (maven or gradle).

    * `--groupId`: The groupId to use in our Maven coordinates for our `pom.xml`.
    Unfortunately this does not properly extend to the Java package names that get
    created; these need to be modified by hand.

    * `--version`: The version of our application.

    * `--java-version`: The build compiler version for the JDK.

    * `--dependencies`: This is an interesting parameter; we can specify fully baked
    sets of dependencies for doing common types of development. For example, `web`
    will set up Spring MVC and embed an internal servlet engine (Tomcat by default,
    Jetty and Undertow as options).

