  raw: 'Because we’ve added the actuator dependency, our application now can expose
    a lot of information that will be very handy for debugging or general microservice
    insight.


    Not all endpoints provided by the actuator dependency are exposed by default,
    however. We need to manually specify which endpoints will be exposed.


    Add the following property to *src/main/resources/application.properties* to expose
    some technology-agnostic endpoints:


