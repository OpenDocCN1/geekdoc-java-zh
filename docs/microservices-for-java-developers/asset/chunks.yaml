    `rest()`. The method is followed by the verb `get("/gate way")`, which specifies
    what HTTP method and path this endpoint expects. This rest method also enables
    cross-origin resource sharing (CORS), which allows this endpoint to receive requests
    from a server on a different origin (domain).


    Next, the REST request is routed via multicast to both routes using parallel processing,
    and the results are accumulated in an `ArrayList` collection. This is specified
    in the `route()`, `multicast()`, and `parallelProcessing()` methods. Finally,
    the result is marshaled into JSON format using the Jackson library in the `.marshal().json(JsonLibrary.Jackson)`
    method.


    The Camel Fluent API is very flexible yet makes the code very expressive. With
    less than 20 lines of code, we just built a REST endpoint that connects to other
    microservices in parallel, collects the results, and transforms them to JSON.


    ### Configuring the API Gateway


    The API gateway needs to connect to `hello-microprofile` and `hello-springboot`.
    The addresses of these microservices must not be hardcoded and should be configured
    externally. For that reason, we used the variables `springbootsvcurl` and `microprofilesvcurl`
    to provide those “service URLs.”


    Another configuration that we need to provide to our application is the context
    path that Camel will use for the REST endpoints. By default, Camel will bind the
    REST endpoints to `/camel/**`, but we want to use `/api/**` instead. For that
    reason, we will also configure the property `camel.component.servlet.mapping.context-path`
    in the `src/main/resources/application.properties` file.


    Let’s add all these properties to that file now:


    ```properties

    gateway.springbootsvcurl=localhost:8180

    gateway.microprofilesvcurl=localhost:8280


    # to reconfigure the camel servlet context-path mapping

    # to use /api/* instead of /camel/*

    camel.component.servlet.mapping.context-path=/api/*

    ```


    **58 | Chapter 4: API Gateway with Apache Camel**


    ![](index-65_1.png)


    ### Calling All Microservices


    Now that our API gateway is ready, we will start all four microservices locally
    using different ports:


    - `backend`: 8080

    - `hello-springboot`: 8180

    - `hello-microprofile`: 8280

    - `api-gateway`: 8380


    To start up the `backend` service on port 8080, navigate to the `backend` directory
    and run the following:


    ```bash

    mvn clean wildfly:run

    ```


    To start up the `hello-springboot` service on port 8180, navigate to the `hello-springboot`
    directory and run the following:


    ```bash

    mvn clean spring-boot:run -Dserver.port=8180

    ```


    To start up the `hello-microprofile` service on port 8280, navigate to the `hello-microprofile`
    directory and run the following:


    ```bash

    mvn thorntail:run -Dswarm.network.socket-binding-groups.standard-sockets.port-offset=200

    ```


    Finally, start the `api-gateway` service on port 8380. Navigate to the `api-gateway`
    directory and run the following:


    ```bash

    mvn spring-boot:run -Dserver.port=8380

