    **Where to Look Next**


    In this chapter, you learned a little about the pains of deploying and managing
    microservices at scale and how Linux containers can help.


    We can leverage true immutable delivery to reduce configuration drift, and we
    can use Linux containers to enable service isolation, rapid delivery, and portability.
    We can leverage scalable container management systems like Kubernetes features
    that are built in, such as service discovery, failover, health-checking, and much
    more. You don’t need complicated port swizzling or complex service discovery systems
    when deploying on Kubernetes because these are problems that have been solved
