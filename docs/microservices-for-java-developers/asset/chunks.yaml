    隐性网络调用可能非常难以调试；理想情况下，如果你的网络调用无法成功完成，它们应该立即失败，并且你的应用程序能够迅速察觉（例如通过 `IOException`）。在这种情况下，你可以快速采取纠正措施、提供降级功能，或者直接返回一条消息，说明请求无法正常完成，用户应稍后重试。但网络请求或分布式应用程序中的错误并不总是那么简单。如果你必须调用的下游应用程序响应时间比正常情况下长怎么办？这是一个致命问题，因为现在你的应用程序必须通过限制请求、下游请求超时以及可能阻塞通过你服务的所有调用来考虑这种延迟。这种积压会导致上游服务出现变慢，甚至停滞。


    而且它可能导致级联故障。


    ## 考虑到依赖关系的设计

    为了从组织或分布式系统的角度能够快速移动并保持敏捷，我们必须在设计系统时考虑到依赖关系；我们需要在团队、技术和治理方面实现松散耦合。微服务的目标之一是利用自治团队和自治服务的优势。这意味着能够根据业务需要快速更改内容，而不会影响我们周围的服务或整个系统。这也意味着我们应该能够依赖服务，但如果它们不可用或性能下降，我们需要能够优雅地处理这种情况。


    Ganesh Prasad 在他的书籍*依赖导向思维*（InfoQ 企业级软件开发系列）中一针见血地指出：“创造力的原则之一是`丢弃一个约束`。换句话说，如果你在脑中消除了一个或多个依赖关系，你就能为问题提出创造性的解决方案。”问题是，我们的组织在构建时考虑的是效率，这随之带来了许多纠缠的依赖关系。


    例如，当你需要咨询三个其他团队（DBA、QA 和安全团队）来对你的服务进行更改时，这并不敏捷；每一个此类同步点都可能导致延迟。这是一个脆弱的过程。如果你可以摆脱这些依赖，或将它们构建到你的团队中（你绝对不能牺牲安全或安全性，所以你应该将这些组件构建到你的团队中），你就可以自由地发挥创意，更快地解决客户面临或业务预见的问题，而不会出现昂贵的人力瓶颈。


    依赖管理问题的另一个角度是如何处理遗留系统。将后端遗留系统的细节（COBOL 复制书籍结构、特定系统使用的 XML 序列化格式等）暴露给下游系统是灾难的根源。


    现在只需做一个微小的更改（客户 ID 现在是 20 位数字而不是 16 位），就会在整个系统中产生波动，并使下游系统所做的假设失效，可能导致它们崩溃。我们需要考虑如何隔离这些内容。


    ## 考虑到领域的设计

    模型已经使用了几个世纪了，但 Eric Evans 的开创性著作*领域驱动设计》（Add-Wesley）帮助我们理解，软件中真正的复杂性不在于技术，而是围绕它的语言。我们需要构建在自身语文中具有内聚性的模型。


    边界上下文（Bounded context）是一组领域对象，它们实现了一个试图简化业务、代码和组织的模型。通常，我们在设计系统时极力追求效率，但实际上我们需要的是灵活性。例如，在一个汽车零件应用程序中，我们可能会尝试为整个领域创建一个“规范模型”，并得到如
    `Part`、`Price` 和 `Address` 等对象。如果库存应用程序使用 `Part` 对象，它指的是某种零件，比如某种刹车或轮子。在汽车质量保证系统中，`Part`
    可能指的是一个带有序列号和唯一标识符的特定零件，用于跟踪某些质量测试结果等。我们可能会努力高效地复用同一个模型，但库存跟踪和质量保证是不同的业务关注点，它们在语义上对
    `Part` 对象的使用方式不同。通过库存系统的边界上下文，`Part` 被显式地建模为 `PartType`，并在该语文中理解为代表“零件类型”，而不是零件的具体实例。通过两个独立的边界上下文，这些
    `Part` 对象可以在它们各自的模型中一致演进，而不会以奇怪的方式相互依赖，从而我们实现了敏捷性或灵活性。上下文映射（Context map）允许我们跟踪应用程序内部不同的上下文，以防止歧义。


    对领域的深度理解需要时间。可能需要几次迭代才能完全理解业务模型中存在的歧义，并将其妥分离，允许它们独立变化。这至少是构建微服务之所以困难的原因之一。拆分单体并非易事，但许多概念已经根植于单体中；你的工作是识别并分离它们。对于绿地项目（Greenfield
    project），在深入理解领域之前，你无法拆分任何东西。事实上，我们听到的所有微服务成功案例（如 Amazon 和 Netflix）在成功转型微服务之前，都是从单体路径开始的。


