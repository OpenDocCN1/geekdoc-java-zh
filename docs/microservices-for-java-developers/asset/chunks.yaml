  trans: "\n使用了 HTTP/网络访问，但你可以将其替换为 Apache HttpComponents、OkHttp、Netty 或其他组件。\n\n\
    示例 2-5 显示了使用 Rest Template 时源码的样式（再次，这里省略了 getter/setter 方法，但它们是必须的）。\n\n我们通过基于注入的主机和端口构建\
    \ URL 与后端服务进行通信，并添加了一个名为 `greeting` 的 GET 查询参数。我们发送到后端服务的 `greeting` 参数的值来自 `GreeterRestController`\
    \ 对象的 `saying` 字段，该字段在当我们添加 `@ConfigurationProperties` 注解时，作为配置的一部分被注入进来。\n\n\
    *示例 2-5. src/main/java/com/example/GreeterRestController.java*\n\n```\n@RestController\n\
    @RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"greeting\")\npublic\
