    The image fabric8/java-alpine-openjdk8-jdk uses OpenJDK 8.0 installed on *Alpine
    Linux* distribution, which makes the image as small as 74 MB.


    This image also provides nice features like adjusting the JVM arguments -Xmx and
    -Xms, and makes it really simple to run fat JARs.


