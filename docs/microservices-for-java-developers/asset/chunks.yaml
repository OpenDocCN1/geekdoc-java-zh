- fmt: "\nIf you want to try your newly built image, you can create a container using\
    \ the command:\n\n```bash\ndocker run -it --rm -p 8080:8080 rhdevelopers/hello-springboot:1.0\n\
    ```\n\nThe `-it` switch instructs Docker to create an interactive process and\
    \ assign a terminal to it. The `--rm` switch instructs docker to delete this container\
    \ when we stop it. The `-p 8080:8080` instructs Docker to assign port `8080` from\
    \ the container to port `8080` in the Docker daemon host.\n\nOnce your container\
    \ starts, you can open a new terminal and access it using the `curl` command:\n\
    \n```bash\ncurl $(minishift ip):8080/api/hello\n```\nGuten Tag aus 172.17.0.6\n\
    \nThese are the basics steps to deploy your application in a Docker container\
    \ and try it. However, we will not focus on pure Docker containers. Instead, in\
    \ the next chapter, we will see how to use Kubernetes to run these microservices\
    \ at scale. Before moving on, don’t forget to stop the running `hello-springboot`\
    \ Docker container by pressing Ctrl-C.\n\n## Deploying to Kubernetes\n\nThere\
    \ are several ways that we could deploy our microservices/containers inside a\
    \ Kubernetes/OpenShift cluster. However, for didatic purposes, we will use YAML\
    \ files that express very well what behavior we expect from the cluster.\n\nIn\
    \ the source code for this report, for each microservice example there is a folder\
    \ called `kubernetes` containing two files: `deployment.yml` and `service.yml`.\
    \ The deployment file will create a `Deployment` object with one replica.\n\n\
    The `Deployment` also provides at least two environment variables.\n\nThe one\
    \ called `JAVA_OPTIONS` specifies the JVM arguments, like `-Xms` and `-Xmx`. The\
    \ one called `GREETING_BACKENDSERVICEHOST` replaces the values we defined in our\
    \ first two microservices to find the `BACKEND` service, as you’ll see in [Service\
    \ discovery” on page 80.\n\nHere is the `deployment.yml` file used for the `hello-springboot`\
    \ microservice.\n\n```yaml\napiVersion: extensions/v1beta1\nkind: Deployment\n\
    metadata:\n  name: hello-springboot\n  labels:\n    app: hello-springboot\n  \
    \  book: microservices4javadev\n    version: v1\nspec:\n  replicas: 1\n  selector:\n\
    \    matchLabels:\n      app: hello-springboot\n      version: v1\n  template:\n\
    \    metadata:\n      labels:\n        app: hello-springboot\n        book: microservices4javadev\n\
    \        version: v1\n    spec:\n      containers:\n        - env:\n         \
    \   - name: JAVA_OPTIONS\n              value: -Xmx256m -Djava.net.preferIPv4Stack=true\n\
    \            - name: GREETING_BACKENDSERVICEHOST\n              value: backend\n\
    \          image: rhdevelopers/hello-springboot:1.0\n          imagePullPolicy:\
    \ IfNotPresent\n          livenessProbe:\n            httpGet: # make an HTTP\
    \ request\n              port: 8080 # port to use\n              path: /actuator/health\
    \ # endpoint to hit\n              scheme: HTTP # or HTTPS\n            initialDelaySeconds:\
    \ 20\n            periodSeconds: 5\n            timeoutSeconds: 1\n          name:\
    \ hello-springboot\n          ports:\n            - containerPort: 8080\n    \
    \          name: http\n          readinessProbe:\n            httpGet: # make\
    \ an HTTP request\n              port: 8080 # port to use\n              path:\
    \ /actuator/health # endpoint to hit\n              scheme: HTTP # or HTTPS\n\
    \            initialDelaySeconds: 10\n            periodSeconds: 5\n         \
    \   timeoutSeconds: 1\n```\n\nSince the `deployment.yml` and `service.yml` files\
    \ are stored together with the source code for this report, you can deploy the\
    \ services by pointing directly to those files using the following commands.\n\
    \nFirst, deploy the `backend` microservice:\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/deployment.yml\n\
    ```\nThen deploy the `hello-springboot` microservice:\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/service.yml\n\
    ```\nand the `hello-microprofile` microservice:\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/deployment.yml\n\
    ```\nFinally, deploy the `api-gateway` microservice:\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/service.yml\n\
    ```\n\nThe deployment files will create four pods (one replica for each microservice).\
    \ The service files will make each of these replicas visible to each other. You\
    \ can check the pods that have been created through the command:\n\n```bash\n\
    oc get pods\n```\nNAME                                 READY   STATUS\napi-gateway-5985d4fd5-4nsfs\
    \          1/1     Running\nbackend-659d84cb9-5hv2r            1/1     Running\n\
    hello-microprofile-844c6c758-mm4h   1/1     Running\nhello-springboot-5bf5c4c7fd-k5mf4\
    \   1/1     Running\n\nWhat advantages does Kubernetes bring as a cluster manager?\
    \ Let’s start by exploring the first of many. Let’s kill a pod and see what happens:\n\
    ```bash\noc delete pod hello-springboot-5bf5c4c7fd-k5mf4\n```\npod \"hello-springboot-5bf5c4c7fd-k5mf4\"\
    \ deleted Now let’s list our pods again:\n```bash\noc get pods\n```\nNAME    \
    \                             READY   STATUS\napi-gateway-5985d4fd5-4nsfs    \
    \      1/1     Running\nbackend-659d84cb9-5hv2r            1/1     Running\nhello-microprofile-844c6c758-mm4h\
    \   1/1     Running\nhello-springboot-5bf5c4c7fd-28mpk   1/1     Running\n\nWow!\
    \ There are still four pods! Another pod was created after we deleted the previous\
    \ one. Kubernetes can start/stop/auto-restart your microservices for you. Can\
    \ you imagine what a headache it would be to manually determine whether your services\
    \ are started/stopped at any kind of scale? Let’s continue exploring some of the\
    \ other valuable cluster management features Kubernetes brings to the table for\
    \ managing microservices.\n\n## External access\n\nNow that all our microservices\
    \ have been deployed inside the cluster, we need to provide external access. Since\
    \ we have an API Gateway defined, only this microservice needs to be exposed;\
    \ it will be the single point of access to invoke the `hello-microprofile` and\
    \ `hello-springboot` microservices. For a refresher on our microservices architecture,\
    \ take a look at Figure 6-1.\n\nTo enable external access using OpenShift, we\
    \ need to run the `oc expose service` command, followed by the name of the service\
    \ that we want to expose (in this case, `api-gateway`):\n```bash\noc expose service\
    \ api-gateway\n```\nroute.route.openshift.io/api-gateway exposed\n\nNow you can\
    \ try the `curl` command to test all microservices.\n```bash\ncurl http://api-gateway-tutorial.$(minishift\
    \ ip).nip.io/api/gateway\n```\n```\n[\"Hello from cluster Backend at host: 172.17.0.7\"\
    ,\n\"Hello Spring Boot from cluster Backend at host: 172.17.0.7\"]\n```\nThe output\
    \ should show that you reached both microservices through the API gateway and\
    \ both of them accessed the `backend` microservice, which means that everything\
    \ is working as expected.\n\n## Scaling\n\nOne of the advantages of deploying\
    \ in a microservices architecture is independent scalability. We should be able\
    \ to replicate the number of services in our cluster easily without having to\
    \ worry about port conflicts, JVM or dependency mismatches, or what else is running\
    \ on the same machine. With Kubernetes, these types of scaling concerns can be\
    \ accomplished with the `Deployment/ReplicationController`. Let’s see what deployments\
    \ exist in our deployment:\n```bash\noc get deployments\n```\n"
