    **Getting Started**


    To deploy our microservices, we will assume that a Docker image exists. Each microservice
    described here already has a Docker image available at the [Docker Hub registr](https://dockr.ly/2GWjVgz)y,
    ready to be consumed. However, if you want to craft your own Docker image, this
    chapter will cover the steps to make it available inside your Kubernetes/OpenShift
    cluster.


