    **CHAPTER 1**


    **Microservices for Java Developers**


    **What Can You Expect from This Report?**


    This report is for Java developers and architects interested in developing microservices.
    We start the report with a high-level introduction and take a look at the fundamental
    prerequisites that should be in place to be successful with a microservices architecture.
    Unfortunately, just using new technology doesn’t magically solve distributed systems
    problems. Therefore, in this chapter we also explore some of the forces involved
    and what successful companies have done to make microservices work for them, including
    aspects such as cul-ture, organizational structure, and market pressures. Then
    we take a deep dive into a few Java frameworks for implementing microservices.
    The accompanying source code repositor[y can be found on Git‐](http://bit.ly/2T33tS9)


    [Hub. Once we ha](http://bit.ly/2T33tS9)ve our hands dirty, we’ll come back up
    for air and discuss issues around deployment, clustering, and failover, and how
    Docker and Kubernetes deliver solutions in these areas. Then we’ll get back into
    the details with some hands-on examples with Docker, Kubernetes, and OpenShift
    to demonstrate the power they bring to cloud-native microservices architectures.
    The last chapter offers some thoughts on topics that we cannot cover in this report
    but that are nonetheless important, like configuration, logging, and continuous
    delivery.


    Transitioning to microservices involves more than just a technological change.
    Implementations of microservices have roots in complex adaptive theory, service
    design, technology evolution, domain-driven design, dependency thinking, promise
    theory, and other **1**


    areas. They all come together to allow the people in an organization to truly
    exhibit agile, responsive learning behaviors and to stay competitive in a fast-evolving
    business world. Let’s take a closer look.


    **You Work for a Software Company**'
