    *<!-- OpenTracing -->*


    **<dependency>**


    **<groupId>** org.apache.camel**</groupId>**


    **<artifactId>** camel-opentracing-starter**</artifactId>**


    **</dependency>**


    **<dependency>**


    **<groupId>** io.jaegertracing**</groupId>**


    **<artifactId>** jaeger-tracerresolver**</artifactId>**


    **<version>** 0.32.0**</version>**


    **</dependency>**


    **<dependency>**


    **<groupId>** io.jaegertracing**</groupId>**


    **<artifactId>** jaeger-thrift**</artifactId>**


    **<version>** 0.32.0**</version>**


    **</dependency>**


    Now we can “turn on” the OpenTracing feature by annotating the main class with
    @CamelOpenTracing [as shown in Example 7-1](#index_split_000.html_p101).


