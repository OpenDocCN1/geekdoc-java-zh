  trans: "\n\n*图 3-2. Thorntail 生成器*\n\n现在点击蓝色的 `Generate Project` 按钮。这将下载一个名为 `hello-microprofile.zip`\
    \ 的文件。保存该文件并解压。\n\n进入 `hello-microprofile` 目录，并尝试运行以下命令：\n\n```bash\nmvn thorntail:run\n\
    ```\n\n确保你已经停止了在上一中启动的后端服务。\n\n**开始上手 | 39**\n\n![](img/index-46_1.png)\n\n如果一切顺利启动且没有任何错误，你应该能看到类似下面的日志：\n\
    \n```\n2018-12-14 15:23:54,119 INFO [org.jboss.as.server] (main) WFLYSRV0010:\
    \ Deployed \"demo.war\" (runtime-name : \"demo.war\") 2018-12-14 15:23:54,129\
    \ INFO [org.wildfly.swarm] (main) THORN99999: Thorntail is Ready\n```\n\n恭喜！你刚刚运行并启动了你的第一个\
    \ MicroProfile 应用。如果你在浏览器中访问 `http://localhost:8080/hello`，你应该能看到图 3-3 所示的输出。\n\
    \n*图 3-3. 来自 Thorntail 的 Hello*\n\n## Hello World\n\n就像在前一节的 Spring Boot 框架一样，我们想要添加一些基本的“Hello\
    \ World”功能，然后在此基础上量地添加更多功能。\n\n我们希望在 `/api/hello` 处暴露一个 HTTP/REST 端点，它将返回“Hello\
    \ MicroProfile from *X*”，其中 *X* 是服务运行的 IP 地址。为了实现这一点，进入 `src/main/java/com/examples/hellomicroprofile/rest`\
    \ 目录。如果你遵循了之前的步骤，该位置应该已经为你创建。然后，创建一个名为 `HelloRestController` 的新 Java 类，如示例 3-1\
    \ 所示。\n\n我们将添加一个名为 `hello()` 的方法，它返回一个字符串以及服务运行的 IP 地址。你将在第 6 章的负载均衡和服务发现章节中看到，如何使用主机\
    \ IP 来演示适当的故障转移、负载均衡等。\n\n**40 | 第 3 章：用于微服务的 Eclipse MicroProfile**\n\n*示例 3-1.\
    \ src/main/java/com/examples/hellomicroprofile/rest/*\n\n*HelloRestController.java*\n\
    \n```java\npublic class HelloRestController {\n    public String hello() {\n \
    \       String hostname = null;\n        try {\n            hostname = InetAddress.getLocalHost()\n\
    \                .getHostAddress();\n        } catch (UnknownHostException e)\
    \ {\n            hostname = \"unknown\";\n        }\n        return \"Hello MicroProfile\
    \ from \" + hostname;\n    }\n}\n```\n\n### 添加 HTTP 端点\n\n你可能已经注意到，MicroProfile\
    \ 项目中的 POJO 类 `HelloRestController` 的实现与 Spring Boot 项目中的 `HelloRestController`\
    \ 类完全相同。唯一的区别将是 HTTP 端点注解，我们在示例 3-2 中添加了这些注解：\n\n- `@Path`：将 HTTP URI 路径的特定部分映射到类和方法。\n\
    - `@GET`：指定任何 HTTP GET 方法将调用被注解标记的方法。如果路径相同但 HTTP 方法不是 GET，则该方法将不会被调用。\n- `@Produces`：指定响应的\
    \ MIME 类型。\n\n再次注意，后续示例中省略了 import 语句。\n\n*示例 3-2. src/main/java/com/examples/helloworld/*\n\
    \n*HelloRestController.java*\n\n```java\n@Path(\"/api\")\npublic class HelloRestController\
    \ {\n    @GET\n    @Produces(\"text/plain\")\n    @Path(\"/hello\")\n    public\
    \ String hello() {\n        String hostname = null;\n        try {\n         \
    \   hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return \"Hello MicroProfile from \" + hostname;\n    }\n\
    }\n```\n\n在这些代码中，我们所做的只是添加了上述注解。\n\n例如，类级别的 `@Path(\"/api\")` 表示“映射到此根 URI 路径下的下的任何方法级\
    \ HTTP 端点”。当我们添加 `@Path(\"/hello\")` 和 `@GET` 时，我们是在告诉 MicroProfile 在 `/hello`\
    \ 处暴露一个 HTTP GET 端点（实际上是 `/api/hello`）。注解 `@Produces(\"text/plain\")` 将媒体类型为 `Accept:\
    \ text/plain` 的请求映射到此方法。\n\n如果你构建了应用程序并再次运行 `thorntail:run`，你应该能够访问该 HTTP 端点：\n\
    \n```bash\nmvn clean thorntail:run\n```\n\n现在，如果你将浏览器指向 `http://localhost:8080/api/hello`，你应该能看到与图\
    \ 3-4 所示类似的响应。\n\n*图 3-4. 成功的 hello*\n\n现在，按照我们对 Spring Boot 做的方法，我们将学习如何注入配置。\n\
    \n**Hello World | 41**\n\n![](img/index-48_1.png)\n\n### 外部化配置\n\n与 Spring Boot\
    \ 一样，MicroProfile 定义了外部化配置机制。它使用不同的 `ConfigSources` 从系统属性、环境变量甚至 `src/main/resources/META-INF/config.properties`\
    \ 文件中读取配置。每个源都有优先级，因此值可以被覆盖。\n\n为了看到这有多简单，我们在 `src/main/resources/META-INF/config.properties`\
    \ 文件中添加一个新的属性：\n\n```properties\nhello.saying=Guten\n```\n\n现在，如第 3 章所示，我们在 `HelloRestController`\
    \ 类中添加 `@Inject` 和 `@ConfigProperty(\"hello.saying\")` 注解。注意，与 Spring Boot 不同，我们不需要\
    \ setter 或 getter。\n\n**42 | 第 3 章：用于微服务的 Eclipse MicroProfile**\n\n*示例 3-3. src/main/java/com/examples/hellomicroprofile///*\n\
    \n*HelloRestController.java*\n\n```java\n@Path(\"/api\")\npublic class HelloRestController\
    \ {\n    @Inject\n    @ConfigProperty(name=\"hello.saying\")\n    private String\
    \ saying;\n\n    @GET\n    @Produces(\"text/plain\")\n    @Path(\"/hello\")\n\
    \    public String hello() {\n        String hostname = null;\n        try {\n\
    \            hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return saying + \" \" + hostname;\n    }\n}\n```\n\n此文件将指示\
    \ CDI API 处理所有标记了 `@Inject` 注解的注入点。如示例 3-4 所示，我们需要添加 `beans.xml` 文件：\n\n*示例 3-4.\
    \ src/main/resources/META-INF/beans.xml*\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<beans xmlns=\"http://xmlns.jcp.org/ns/javaee\"\n       xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n       xsi:schemaLocation=\"http://xmlns.jcp.org/ns/javaee\
    \ http://xmlns.jcp.org/ns/javaee/beans_1_1.xsd\"\n       bean-discovery-mode=\"\
    all\">\n</beans>\n```\n\n### 暴露应用程序指标和信息\n\n另一个与 Spring Boot 的相似点是，MicroProfile\
    \ 应用能够暴露用于监控应用程序的端点。为了启用此功能，我们需要在 `pom.xml` 文件中添加 MicroProfile Metrics 依赖。\n\n\
    打开 `hello-microprofile` 微服务的 `pom.xml` 文件并在 `<dependencies>` 部分添加以下 Maven 依赖：\n\
    \n```xml\n<dependency>\n    <groupId>io.thorntail</groupId>\n    <artifactId>microprofile-metrics</artifactId>\n\
    </dependency>\n```\n\n添加此依赖将导致应用程序暴露大量信息，这对于调试和常规洞察非常有帮助。\n\n现在停止你的微服务并运行以下命令重启它：\n\
    \n```bash\nmvn clean thorntail:run\n```\n\n"
- fmt: "\nTry hitting the URL `http://localhost:8080/metrics` and examine what gets\
    \ returned. You should see something like the result in\n\n[Figure 3-6](#index_split_000.html_p51).\n\
    \n*Figure 3-6. MicroProfile metrics*\n\n**Hello World | 45**\n\n![](index-52_1.png)\n\
    \nEasy, right?\n\n### Running Outside of Maven\n\nRemember how easy it was to\
    \ run Spring Boot outside Maven?\n\nLuckily, with MicroProfile it just takes the\
    \ exact same few steps to get a microservice ready for shipment and production.\n\
    \nJust like `Spring Boot`, `MicroProfile` prefers atomic, executable JARs with\
    \ all dependencies packed into a flat classpath. This means the JAR that we create\
    \ as part of a call to `mvn clean package` is executable and contains all we need\
    \ to run our microservice in a Java environment! To test this out, go to the root\
    \ of the `hello-microprofile` microservice project and run the following commands:\n\
    \n```bash\n$ mvn clean package\n$ java -jar target/demo-thorntail.jar\n```\n\n\
    That’s it! Exactly the same approach used by `Spring Boot`.\n\n### Calling Another\
    \ Service\n\nIn a microservices environment, each service is responsible for providing\
    \ its functionality or service to other collaborators. If we wish to extend the\
    \ `hello_microprofile` microservice, we will need to create a service that we\
    \ can call using `JAX-RS` client functionality. Just like we did for the `Spring\
    \ Boot` microservice, we’ll leverage the backend service from the source code\
    \ that accompanies this report. The interaction will look similar to [Figure 3-7.](#index_split_000.html_p52)\n\
    \n*Figure 3-7. Calling another service*\n\nIf you look at the source code for\
    \ this report, you](http://bit.ly/2T33tS9)’ll see a Maven module called `backend`\
    \ which contains a very simple `HTTP servlet` that can be invoked with a `GET`\
    \ request and query parameters. The code for this `backend` is very simple, and\
    \ it does not use any of the microservice frameworks (`Spring Boot`, `MicroProfile`,\
    \ etc.).\n\nTo start up the backend service on port 8080, navigate to the `backend`\
    \ directory and run the following:\n\n46 | Chapter 3: Eclipse MicroProfile for\
    \ Microservices\n\n```bash\n$ mvn clean wildfly:run\n```\n\nRemember that the\
    \ `hello-microprofile` service should be stopped before running the backend service.\n\
    \nThis service is exposed at `/api/backend` and takes a query parameter called\
    \ `greeting`. For example, when we call this service with the path `/api/backend?greeting=Hello`,\
    \ like this (you can also visit this URL with your browser):\n\n```bash\n$ curl\
    \ -X GET http://localhost:8080/api/backend?greeting=Hello\n```\n\nWe get back\
    \ a JSON object like this:\n\n```json\n{\n  \"greeting\": \"Hello from cluster\
    \ Backend\",\n  \"time\": 1459189860895,\n  \"ip\": \"172.20.10.3\"\n}\n```\n\n\
    Next, we’ll create a new HTTP endpoint, `/api/greeting`, in our `hellomicroprofile`\
    \ microservice and use the `JAX-RS Client API` to call this backend.\n\nFirst,\
    \ we create a new class in `src/main/java/com/examples/hellomicroprofile` called\
    \ `GreeterRestController` and fill it in similarly to how we filled in the `HelloRestController`\
    \ class (see [Example 3-5.](#index_split_000.html_p53)\n\n*Example 3-5. src/main/java/com/example/hellomicroprofile/rest/*\n\
    \n*GreeterRestController.java*\n\n```java\n@Path(\"/api\")\npublic class GreeterRestController\
    \ {\n    @Inject\n    @ConfigProperty(name=\"greeting.saying\", defaultValue =\
    \ \"Hello\")\n    private String saying;\n\n    @Inject\n    @ConfigProperty(name\
    \ = \"greeting.backendServiceHost\", defaultValue = \"localhost\")\n    private\
    \ String backendServiceHost;\n\n    @Inject\n    @ConfigProperty(name = \"greeting.backendServicePort\"\
    , defaultValue = \"8080\")\n    private int backendServicePort;\n\n    @GET\n\
    \    @Produces(\"text/plain\")\n    @Path(\"greeting\")\n    public String greeting()\
    \ {\n        String backendServiceUrl = String.format(\"http://%s:%d\", backendServiceHost,backendServicePort);\n\
    \        return \"Sending to: \" + backendServiceUrl;\n    }\n}\n```\n\nWe’ve\
    \ created a simple `JAX-RS` resource here that exposes an `/api/greeting` endpoint\
    \ that just returns the value of the `backendServiceUrl` field. Also note that\
    \ we’re injecting the backend host and port as environment variables that have\
    \ default values if no environment variables are set. Again, we’re using `MicroProfile\
    \ Config`’s `@ConfigProperty` annotation to accomplish this.\n\nLet’s also add\
    \ the `BackendDTO` class, shown in [Example 3-6](#index_split_000.html_p54).\n\
    \n*Example 3-6. src/main/java/com/examples/hellomicroprofile/*\n\n*BackendDTO.java*\n\
    \n```java\npublic class BackendDTO {\n    private String greeting;\n    private\
    \ long time;\n    private String ip;\n\n    public String getGreeting() {\n  \
    \      return greeting;\n    }\n\n    public void setGreeting(String greeting)\
    \ {\n        this.greeting = greeting;\n    }\n\n    public long getTime() {\n\
    \        return time;\n    }\n\n    public void setTime(long time) {\n       \
    \ this.time = time;\n    }\n\n    public String getIp() {\n        return ip;\n\
    \    }\n\n48 | Chapter 3: Eclipse MicroProfile for Microservices\n\n    public\
    \ void setIp(String ip) {\n        this.ip = ip;\n    }\n}\n```\n\nNext, let’s\
    \ add our `JAX-RS` client implementation to communicate with the backend service.\
    \ It should look like Example 3-7](#index_split_000.html_p55).\n\n*Example 3-7.\
    \ src/main/java/com/example/hellosspringboot/*\n\n*GreeterRestController.java*\n\
    \n```java\n@Path(\"/api\")\npublic class GreeterRestController {\n    @Inject\n\
    \    @ConfigProperty(name=\"greeting.saying\", defaultValue = \"Hello\")\n   \
    \ private String saying;\n\n    @Inject\n    @ConfigProperty(name = \"greeting.backendServiceHost\"\
    , defaultValue = \"localhost\")\n    private String backendServiceHost;\n\n  \
    \  @Inject\n    @ConfigProperty(name = \"greeting.backendServicePort\", defaultValue\
    \ = \"8080\")\n    private int backendServicePort;\n\n    @GET\n    @Produces(\"\
    text/plain\")\n    @Path(\"greeting\")\n    public String greeting() {\n     \
    \   String backendServiceUrl = String.format(\"http://%s:%d\", backendServiceHost,backendServicePort);\n\
    \        System.out.println(\"Sending to: \" + backendServiceUrl);\n        Client\
    \ client = ClientBuilder.newClient();\n        BackendDTO backendDTO = client.target(backendServiceUrl)\n\
    \            .path(\"api\")\n            .path(\"backend\")\n            .queryParam(\"\
    greeting\", saying)\n            .request(MediaType.APPLICATION_JSON)\n      \
    \      .get(BackendDTO.class);\n        return backendDTO.getGreeting() + \" at\
    \ host: \" + backendDTO.getIp();\n    }\n}\n```\n\nNow let’s build the microservice\
