- fmt: "\nSoftware really is eating the world. Businesses are slowly starting to realize\
    \ this, and there are two main drivers for this phenomenon: delivering value through\
    \ high-quality services and the rapid commoditization of technology. This report\
    \ is primarily written in a hands-on, by-example format. But before we dive into\
    \ the technology, we need to properly set the stage and understand the forces\
    \ at play. We have been talking ad nauseam in recent years about making businesses\
    \ `agile`, but we need to fully understand what that means. \n\nOtherwise it’s\
    \ just a nice platitude that everyone glosses over.\n\n## The Value of Service\n\
    \nFor more than 100 years, our business markets have been about creating products\
    \ and driving consumers to want those products: desks, microwaves, cars, shoes,\
    \ whatever. The idea behind this “producer-led” economy comes from Henry Ford’s\
    \ theory that if one could produce great volumes of a product at low cost, the\
    \ market would be virtually unlimited. For that to work, you also need a few one-way\
    \ channels to directly market to the masses to convince them that they need these\
    \ products and their lives will be substantially better with them. For most of\
    \ the 20th century, these one-way channels existed in the form of advertisements\
    \ on TV, in newspapers and magazines, and on highway billboards. However, this\
    \ producer-led economy has been flipped on its head because markets are fully\
    \ saturated with products (how many phones/cars/TVs do you need?). Further, the\
    \ internet, along with social networks, is changing the dynamics of how companies\
    \ interact with consumers (or more importantly, how consumers interact with them).\n\
    \nSocial networks allow us, as consumers, to more freely share information with\
    \ one another and the companies with which we do business. We trust our friends,\
    \ family, and others more than we trust marketing departments. That’s why we go\
    \ to social media outlets to choose restaurants, hotels, and airlines. Our positive\
    \ feedback in the form of reviews, tweets, shares, and the like can positively\
    \ favor the brand of a company, and our negative feedback can just as easily and\
    \ swiftly destroy a brand. As depicted in Figure 1-1(#index_split_000.html_p9),\
    \ there is now a powerful bidirectional flow of information between companies\
    \ and their consumers that previously never existed, and businesses are struggling\
    \ to keep up with the impact of not owning their brands.\n\n*Figure 1-1. Social\
    \ influence*\n\nPostindustrial companies are learning they must nurture their\
    \ relationships (using bidirectional communication) with customers to understand\
    \ how to bring value to them. Companies do this by providing ongoing conversation\
    \ through service, customer experience, and feedback. Customers choose which services\
    \ to consume and which to pay for depending on which ones bring them value and\
    \ good experiences. Take Uber, for example, which doesn’t own any inventory or\
    \ sell products per se. You don’t get any value out of sitting in someone else’s\
    \ car, but you may be trying to get somewhere that does bring value (a business\
    \ meeting, for example). In this way, using Uber’s service creates value. Going\
    \ forward, companies will need to focus on bringing valuable services to customers,\
    \ and technology will drive this through digital services.\n\n## The Commoditization\
    \ of Technology\n\nTechnology follows a similar boom-and-bust cycle as economics,\
    \ biology, and law. It has led to great innovations, like the steam engine, the\
    \ telephone, and the computer. In our competitive markets, however, game-changing\
    \ innovations require a lot of investment and build-out to quickly capitalize.\
    \ This brings more competition, greater capacity, and falling prices, eventually\
    \ making the once-innovative technology a commodity. Upon these commodities we\
    \ continue to innovate and differentiate, and the cycle continues. This commoditization\
    \ has brought us from the mainframe to the personal computer to what we now call\
    \ “cloud computing,” which is a service bringing us commodity computing with almost\
    \ no upfront capital expenditure. On top of cloud computing, we’re now seeing\
    \ new innovation in the form of digital services.\n\n[Figure 1-2](#index_split_000.html_p10)\
    \ shows the value over time curve.\n\n*Figure 1-2. The value over time curve*\n\
    \nOpen source is also leading the charge in the technology space. Following the\
    \ commoditization curve, open source is a place developers can go to challenge\
    \ proprietary vendors by building and innovating on software that was once only\
    \ available (without source, no less) with high license costs. This drives communities\
    \ to build things like operating systems (`Linux`), programming languages (`Go`),\
    \ message queues (`Apache ActiveMQ`), and web servers (`httpd`). Even companies\
    \ that originally rejected open source are starting to come around by open sourcing\
    \ their technologies and contributing to existing communities. As open source\
    \ and open ecosystems have become the norm, we’re starting to see a lot of the\
    \ innovation in software technology coming directly from open source communities\
    \ (e.g., `Apache Spark`, `Docker`, and `Kubernetes`).\n\n## Disruption\n\nThe\
    \ confluence of these two factors—service design and technology evolution—is lowering\
    \ the barrier of entry for anyone with a good idea to start experimenting and\
    \ trying to build new services. You can learn to program, use advanced frameworks,\
    \ and leverage on-demand computing for next to nothing. You can post to social\
    \ networks, blog, and carry out bidirectional conversations with potential users\
    \ of your service for free. With the fluidity of our business markets, any over-the-weekend\
