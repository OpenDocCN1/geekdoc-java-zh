    \ Maven WildFly plug-in, which allows us to quickly boot up our app using `wildfly:run`.\
    \ This service is exposed at `/api/backend` and takes a query parameter called\
    \ `greeting`. For example, when we call this service with the path like:\n\n```json\n\
    {\n  \"greeting\": \"Hello from cluster Backend\",\n  \"time\": 145918960895,\n\
    \  \"ip\": \"172.20.10.3\"\n}\n```\n\nYou can also visit this with your browser:\n\
    \n```bash\ncurl -X GET http://localhost:8080/api/backend?greeting=Hello\n```\n\
    \nNext, we’ll create a new HTTP endpoint, `/greeting/`, in our `hello-springboot`\
    \ microservice and use Spring to call this backend.\n\nFirst, we create a class\
