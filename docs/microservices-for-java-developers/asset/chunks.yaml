  trans: "\n\n# 22 | 第 2 章：用于微服务的 Spring Boot\n\n![](img/index-29_1.png)\n\n```bash\n\
    mvn spring-boot:run\n```\n\n如果一切都顺利启动且没有错误，你应该能看到类似下面的日志：\n\n```\n2018-12-13 13:18:19\
    \ --- [main] TomcatWebServer\n: Tomcat started on port(s): 8080 (http) with context\
    \ path ''\n2018-12-13 13:18:19 --- [main] HelloSpringbootApplication\n: Started\
    \ HelloSpringbootApplication in 2.3 seconds\n(JVM running for 10.265)\n```\n\n\
    恭喜！你刚刚启动并运行了第一个 Spring Boot 应用程序。如果你在浏览器中导航到 `http://localhost:8080`，你应该能看到图 2-1\
    \ 所示的输出。\n\n*图 2-1. 白标签错误页 (Whitelabel error page)*\n\n这个默认错误页面是正常的，因为我们的应用程序目前还没有实现任何功能。让我们进入下一节，添加一个\
    \ REST 端点来组合出一个“Hello World”用例。\n\n## Hello World\n\n现在我们已经有了一个可以运行的 Spring Boot\
    \ 应用程序，让我们添加一些简单的功能。我们希望在 `/api/hello` 暴露一个 HTTP/REST 端点，它将返回“Hello Spring Boot\
    \ from *X*”，其中 *X* 是服务运行的 IP 地址。要实现这一点，导航到 `src/main/java/com/examples/helloosspringboot`。如果你遵循了之前的步骤，该位置应该已经为你创建好了。然后，如示例\
    \ 2-1 所示所示创建一个创建一个 `HelloRestController` 的新 Java 类。我们将添加一个名为 `hello()` 的方法，返回字符串以及服务运行的\
    \ IP 地址。\n\n你将在第 6 章中看到，当我们讨论负载均衡和服务发现时，将如何使用主机 IP 来演示适当的故障转移、负载均衡等。\n\n*示例 2-1.\
    \ src/main/java/com/examples/helloosspringboot/*\n*HelloRestController.java*\n\
    \n```java\npublic class HelloRestController {\n    public String hello() {\n \
    \       String hostname = null;\n        try {\n            hostname = InetAddress.getLocalHost()\n\
    \                .getHostAddress();\n        } catch (UnknownHostException e)\
    \ {\n            hostname = \"unknown\";\n        }\n        return \"Hello Spring\
    \ Boot from \" + hostname;\n    }\n}\n```\n\n### 添加 HTTP 端点\n\n在此时，这部分代码只是一个 POJO（纯旧\
    \ Java 对象），你可以（也应该）编写一个单元测试来验证它的行为。为了将其暴露为 REST 端点，我们将使用示例 2-2： 中的以下注解：\n\n- `@RestController`:\
    \ 告诉 Spring 这是一个 HTTP 控制器，能够暴露 HTTP 端点（GET, PUT, POST 等）。\n- `@RequestMapping`:\
    \ 将 HTTP URI 路径的特定部分映射到 Java 代码中的类、方法和参数。\n\n注意这里省略了导入语句。\n\n*示例 2-2. src/main/java/com/examples/helloosspringboot/*\n\
    *HelloRestController.java*\n\n```java\n@RestController\n@RequestMapping(\"/api\"\
    )\npublic class HelloRestController {\n    @RequestMapping(method = RequestMethod.GET,\
    \ value = \"/hello\", produces = \"text/plain\")\n    public String hello(){\n\
    \        String hostname = null;\n        try {\n            hostname = InetAddress.getLocalHost()\n\
    \                .getHostAddress();\n        } catch (UnknownHostException e)\
    \ {\n            hostname = \"unknown\";\n        }\n        return \"Hello Spring\
    \ Boot from \" + hostname;\n    }\n}\n```\n\n在这段代码中，我们所做的只是添加了上述注解。\n\n例如，类级别的\
    \ `@RequestMapping(\"/api\")` 表示“映射到此根 URI 路径下的任何方法级 HTTP 端点”。当我们添加 `@RequestMapping(method\
    \ = RequestMethod.GET, value = \"/hello\", produces = \"text/plain\")` 时，我们是在告诉\
    \ Spring 在 `/hello` 处暴露一个 HTTP GET 端点（实际上是 `/api/hello`），并将媒体类型为 `Accept: text/plain`\
    \ 的请求映射到此方法。Spring Boot 默认使用嵌入的 Tomcat Servlet 容器，但也可以切换到 Undertow 或 Jetty 等其他选项。\n\
    \n如果你构建应用程序并再次运行 `spring-boot:run`，你应该能够访问你的 HTTP 端点了：\n\n```bash\nmvn clean spring-boot:run\n\
    ```\n\n现在，如果你将浏览器指向 `http://localhost:8080/api/hello`，你应该能看到类似图 2-2 所示的响应。\n\n\
    *图 2-2. 成功的 hello*\n\n如果我们想为应用程序添加一些环境感知的配置呢？例如，与其说“Hello”，也许如果我们为德国用户在生产环境中部署应用，我们可能想说“Guten\
    \ Tag”。我们需要一种将属性注入到应用程序的方法。\n\n## 外部化配置\n\nSpring Boot 轻松地使用外部属性源，如属性文件、命令行参数、操作系统环境变量或系统属性。我们现在可以外部化根据运行环境变化的属性。诸如服务\
    \ URI、数据库 URI 和密码以及消息队列配置都是外部化配置的极佳候选。\n\n`application.properties` 文件在我们创建项目时自动创建。注意我们将文件名改为\
    \ `application.yml`，Spring 仍然能识别它。让我们在 `src/main/resources/application.properties`\
    \ 中添加一个新属性：\n\n```\nhelloapp.saying=Guten Tag\n```\n\n接下来，如示例 2-3 所示，我们在 `HelloRestController`\
    \ 类中添加 `@ConfigurationProperties` 注解和新的 `saying` 字段。注意我们还需要 setter。\n\n*示例 2-3.\
    \ src/main/java/com/examples/helloosspringboot/*\n*HelloRestController.java*\n\
    \n```java\n@RestController\n@RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"\
    helloapp\")\npublic class HelloRestController {\n    private String saying;\n\n\
    \    public String hello() {\n        String hostname = null;\n        try {\n\
    \            hostname = InetAddress.getLocalHost()\n                .getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return saying + \" \" + hostname;\n    }\n\n    public void\
    \ setSaying(String saying) {\n        this.saying = saying;\n    }\n}\n```\n\n\
    停止运行应用程序（如果你还没有停止）并重启它：\n\n```bash\nmvn clean spring-boot:run\n```\n\n现在，如果你将浏览器指向\
    \ `http://localhost:8080/api/hello`，你应该能看到如图 2-3 所示的德语问候。\n\n*图 2-3. 成功的问候*\n\n\
    ## 暴露应用程序指标和信息\n\n如果我们要把这个微服务投入生产环境，我们将如何监控它？我们如何获取有关运行情况的洞察？除非我们明确思考如何向外部暴露指标，否则我们的微服务通常是黑盒。\n\
    \n幸运的是，Spring Boot 提供了一个预包启动器（`springboot-starter-actuator`），它让这一切变得非常简单。\n\n\
    ### Hello World | 27\n\n让我们看看启用 actuator 需要什么。打开你的 `hello-springboot` 微服务的 `pom.xml`\
    \ 文件，并在 `<dependencies>...</dependencies>` 部分中添加以下 Maven 依赖：\n\n```xml\n<dependency>\n\
    \    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-actuator</artifactId>\n\
    </dependency>\n```\n\n"
- fmt: "\nBecause we’ve added the actuator dependency, our application now can expose\
    \ a lot of information that will be very handy for debugging or general microservice\
    \ insight.\n\nNot all endpoints provided by the actuator dependency are exposed\
    \ by default, however. We need to manually specify which endpoints will be exposed.\n\
    \nAdd the following property to `src/main/resources/application.properties` to\
    \ expose some technology-agnostic endpoints:\n\n# Enable management endpoints\n\
    \n```properties\nmanagement.endpoints.web.exposure.include=beans,env,health,metrics,httptrace,mappings\n\
    ```\n\nNow restart your microservice by stopping it and running: `$mvn clean spring-boot:run`\n\
    \nTry hitting the following URLs and examine what gets returned:\n\n• `http://localhost:8080/actuator/beans`\n\
    • `http://localhost:8080/actuator/env`\n• `http://localhost:8080/actuator/health`\n\
    • `http://localhost:8080/actuator/metrics`\n• `http://localhost:8080/actuator/httptrace`\n\
    • `http://localhost:8080/actuator/mappings`\n\n[Figure 2-4](#index_split_000.html_p35)\
    \ shows an example of what the `http://localhost:8080/env` endpoint looks like.\n\
    \n![](index-35_1.png)\n*Figure 2-4. Actuator response*\n\nExposing runtime insights\
    \ like this frees up the developer to just focus on writing code for the microservice\
    \ that delivers business value. Delegating the heavy lifting and boilerplate to\
    \ frameworks is definitely a good idea.\n\n## Running Outside of Maven\n\nUp to\
    \ this point we’ve been thinking about development and building our Hello World\
    \ microservice from the perspective of a developer’s laptop using Maven. But what\
    \ if you want to distribute your microservice to others or run it in a live environment\
    \ (development, QA, production)?\n\nLuckily, with Spring Boot it only takes a\
    \ few steps to get ready for shipment and production. Spring Boot prefers atomic,\
    \ executable JARs with all dependencies packed into a flat classpath. This means\
    \ the JAR that we create as part of a call to `mvn clean package` is executable\
    \ and contains all we need to run our microservice in a Java environment. To test\
    \ this out, go to the root of the `hello-springboot` microservice project and\
    \ run the following commands:\n\n```bash\nmvn clean package\njava -jar target/hello-springboot-1.0.jar\n\
    ```\n\nIf your project was named `demo` instead of `hello-springboot`, then substitute\
    \ the properly named JAR file (`demo-1.0.jar`).\n\nThat’s it!\n\nWe’ll notice\
    \ this sort of idiom when we explore MicroProfile in the next chapter, too.\n\n\
    ## Calling Another Service\n\nIn a microservices environment, each service is\
    \ responsible for providing its functionality or service to other collaborators.\
    \ As we discussed in the first chapter, building distributed systems is hard,\
    \ and we cannot abstract away the network or the potential for failures.\n\n![](index-36_1.png)\n\
    \nWe will cover how to build resilient interactions with our dependencies in [index_split_000.html_p67`.\
    \ In this section, however, we will just focus on getting a service to talk to\
    \ a dependent service.\n\nIf we wish to extend the `hello-springboot` microservice,\
    \ we will need to create a service that we can call using Spring’s REST client\
    \ functionality. For this example and the rest of the examples in the report,\
    \ we’ll use a backend service and modify our service to reach out to the backend\
    \ to generate the greetings we want to be able to use, as indicated by [index_split_000.html_p36`.\n\
    \n*Figure 2-5. Calling another service*\n\nIf you look at the source code for\
    \ this report, you (http://bit.ly/2T33tS9) see a Maven module called `backend`\
    \ that contains a very simple HTTP servlet that can be invoked with a GET request\
    \ and query parameters. The code for this backend is very simple, and it does\
    \ not use any of the microservice frameworks (Spring Boot, MicroProfile etc.).\
    \ We have created a `ResponseDTO` object that encapsulates time, ip, and greeting\
    \ fields. We also leverage the awesome Jackson library for JSON data binding,\
    \ as seen here:\n\n```java\n@WebServlet(urlPatterns = {\"/api/backend\"})\npublic\
    \ class BackendHttpServlet extends HttpServlet {\n    @Override\n    protected\
    \ void doGet(HttpServletRequest req, HttpServletResponse resp) throws ServletException,\
    \ IOException {\n        resp.setContentType(\"application/json\");\n        ObjectMapper\
    \ mapper = new ObjectMapper();\n        String greeting = req.getParameter(\"\
    greeting\");\n        ResponseDTO response = new ResponseDTO();\n        response.setGreeting(greeting\
    \ + \" from cluster Backend\");\n        response.setTime(System.currentTimeMillis());\n\
    \        response.setIp(getIp());\n        PrintWriter out = resp.getWriter();\n\
    \        mapper.writerWithDefaultPrettyPrinter()\n              .writeValue(out,\
    \ response);\n    }\n\n    private String getIp() {\n        String hostname =\
    \ null;\n        try {\n            hostname = InetAddress.getLocalHost().getHostAddress();\n\
    \        } catch (UnknownHostException e) {\n            hostname = \"unknown\"\
    ;\n        }\n        return hostname;\n    }\n}\n```\n\nTo start up the backend\
    \ service on port 8080, navigate to the `backend` directory and run the following\
