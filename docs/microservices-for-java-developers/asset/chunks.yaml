    在我们深入探讨示例之前，你应该理解 Kubernetes 的一些简单基本原语。在本章中，我们将向你介绍这些概念，在接下来的章节中，我们将利用它们来管理微服务集群。


    ### Pods


    `pod` 是一个或多个 Docker 容器的组（就像鲸鱼群一样吗？）。然而，一个典型的 pod 部署通常与 Docker 容器是一一对应的。如果你有必须与应用程序共同部署的侧车（sidecar）、代理（ambassador）或适配器（adapter）部署，`pod
    是将它们分组的方式。这种抽象也是保证亲和性的方法`。Kubernetes 负责编排、调度和管理 pod。当我们提到运行在 Kubernetes 内部的应用程序时，它是运行在一个
    pod 内部的。pod 拥有自己的 IP 地址，pod 内部的所有容器共享此地址（这与纯 Docker 不同，后者每个容器都有一个 IP 地址）。当卷载挂载到
    pod 时，它们也是共享的。关于 pod 的最后一点需要知道：它们是可替换的（fungible）。这意味着它们可能随时消失（可能是因为崩溃，也可能是因为 Kubernetes
    杀杀了它们）。它们不像你那样需要呵护和培养的虚拟机（VM）。pod 可以在任何时候销毁。这符合我们在微服务世界的预期，即事情会（并且确实会）发生，因此我们强烈建议在编写微服务时牢记这一前提。


    ### Labels


    标签（Labels）是我们可以分配给 pod 的简单键/值对，例如 `release=stable` 或 `tier=backend`。pod（以及其他资源，但我们将重点关注
    pod）可以有多个标签，以松耦合的方式将它们分组，从而更容易在大规模范围内构建集群。在我们为 pod 打上标签后，我们可以使用`标签选择器（label selectors）`来查找哪些
    pod 属于哪个组。例如，如果我们有一些标记为 `tier=backend` 的 pod，另一些标记为 `frontend` 的 pod，使用标签选择器 `tier
    != frontend` 就可以选择所有不是“frontend”的 pod。标签选择器用于接下来的两个概念：复制控制器（replication controllers）和服务层（services）。


    ### ReplicationControllers and Deployments


    在谈论大规模运行微服务时，我们可能会涉及到任何给定微服务的多个实例。Kubernetes 有一个名为 `ReplicationController` 的概念，用于管理一组特定微服务的副本数量。例如，假设我们想要管理标记为
    `tier=backend` 和 `release=stable` 的 pod 数量。我们可以定义带有适当标签选择器的 `ReplicationController`，然后通过调整定义中的
    `replicas` 字段来控制集群中的 pod 数量。如果我们将副本计数设置为 `10`，那么 Kubernetes 将调整其当前状态，以反映为给定的 `ReplicationController`
    运行 10 个 pod。如果目前只有五个在运行，Kubernetes 将再启动另外五个。如果有 20 个在运行，Kubernetes 将杀掉 10 个（对于你的应用程序来说，杀死哪些是不确定的）。Kubernetes
    会尽一切努力以收敛到 10 个副本的预期状态。你可以想象使用 `ReplicationController` 非常容易地控制集群的大小。后来，Kubernetes
    项目引入了另一个名为 `Deployment` 的概念，它会监控副本的配置（如环境变量、CPU 和内存限制、标签等）。如果你更新了这些任何配置，Kubernetes
    将执行`滚动更新（rolling update）`，将之前声明的副本数量替换为具有新配置的新副本。我们将在下一章看到 `Deployments` 运行的示例。


    ### Services


    你应该理解的最后一个 Kubernetes 概念是 Kubernetes `Service`。我们已经看到 `ReplicationControllers`
    可以控制我们服务的副本数量。我们还看到 pod 会死亡（要么自己崩溃，要么被杀掉，可能是作为 `ReplicationController` 缩容事件的一部分）。因此，当我们尝试与一组
    pod 通信时，不应该直接依赖它们的 IP 地址（每个 pod 都有自己的 IP 地址），因为 pod 会来来去。我们需要一种分组 pod 的方法以发现它们在哪里以及如何与它们通信，并可能对它们进行负载均衡。这正是
    Kubernetes `Service` 所做的。它允许我们使用标签选择器对 pod 进行分组，并用单个虚拟（集群）IP 将它们抽象化，我们可以使用该 IP
    来发现并与它们交互。我们将在下一章展示一些具体的示例。通过这些简单的概念——pods、labels、`ReplicationControllers` 和 `Services`，我们可以按照
    Google 学到的（或学到的反教训）方式来管理和扩展我们的微服务。识别复杂问题的简单解决方案需要多年和多次失败，因此我们强烈鼓励你熟悉这些概念，并体验使用
    Kubernetes 管理微服务容器的力量。


    ### Getting Started with Kubernetes


    Docker 和 Kubernetes 都是 Linux 原生技术；因此，它们必须在 Linux 宿主机操作系统上运行。如果你在 Windows 或 Mac
    开发机上工作，为了利用 Docker 和 Kubernetes 为你带来的强大功能，你需要在宿主机操作系统上使用客机 Linux 虚拟机。你可以为你的环境下载
    `Docker Machine` 和 `Toolbox`，但那时你需要手动安装 Kubernetes（这可能有点复杂）。你可以使用上游 Kubernetes
    Vagrant 镜像，但像任何快速迭代的开源项目一样，这些镜像可能会迅速变化且有时不稳定。。此外，为了充分利用 Docker 的可移植性，最好在不同环境之间至少使用相同的
    Linux 内核，理想情况下使用相同的 Linux 发行版和版本。我们还有其他选择吗？


    ### Minishift


    为了开始使用 Docker 和 Kubernetes 开发微服务，我们将利用一个名为 `Minishift` 的免费开发者工具（`https://bit.ly/2E3i3zc`）。`Minishift`
    是一个运行在开发者机器上的小工具，包含了 Docker、Kubernetes 和 Web 控制台（实际上，它运行的是 Red Hat OpenShift，它基本上是一个包含其他开发者自服务和应用程序生命周期管理功能的
    Kubernetes 版本，但在这书中我们将仅使用 Kubernetes API）。


    ### OpenShift


    Red Hat OpenShift 3.x 是一个 Apache v2 许可的开源开发者自服务平台 `OpenShift Origin`（`http://bit.ly/2EpgiNe`），它已经重构为使用
    Docker 和 Kubernetes。OpenShift 曾经拥有自己的集群管理和编排引擎，但考虑到 Kubernetes 为容器集群管理世界带来的知识、简单力量，尝试竞争是愚蠢的。更广泛的社区正在汇聚到
    Kubernetes，而 Red Hat 也全力投入 Kubernetes。

