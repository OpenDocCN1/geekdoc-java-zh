- fmt: '

    In a microservices environment with autonomous teams and services, it’s very important
    to keep in mind the relationship between service provider and service consumer.
    As an autonomous service team, you cannot place obligations on other teams and
    services because you do not own them; they’re autonomous by definition. All you
    can do is choose whether or not to accept their promises of functionality or behavior.
    As a provider of a service to others, all you can do is promise them a certain
    behavior. They are free to trust you or not. Promise theory, a model first proposed
    by Mark Burgess in 2004 and covered in his book [*In Search of Certainty*](http://bit.ly/1EKwwXG)
    (O’Reilly), is a study of autonomous systems including people, computers, and
    organizations providing services to each other. [Figure 1-6](#index_split_000.html_p19)
    illustrates the difference between an obligation and a promise: an obligation
    is placed on a team, while a promise is made by the team.


    *Figure 1-6. Obligation versus promise*


    In terms of distributed systems, promises help articulate what a service may provide
    and make clear what assumptions can and cannot be made. For example, suppose our
    team owns a book recommendation service, and we promise a personalized set of
    book recommendations for a specific user you ask about. What happens when you
    call our service, and one of our backends (the database that stores that user’s
    current view of recommendations) is unavailable?


    We could throw exceptions and stack traces back to you, but that would not be
    a very good experience and could potentially blow up other parts of the system.
    Because we made a promise, we can instead try to do everything we can to keep
    it, including returning a default list of books, or a subset of all the books.
    There are times when promises cannot be kept, and identifying the best course
    of action in these circumstances should be driven by the desired experience or
    outcome for our users. The key here is the onus on our service to try to keep
    its promise (return some recommendations), even if our dependent services cannot
    keep theirs (the database was down). In the course of trying to keep a promise,
    it helps to have empathy for the rest of the system and the service quality we’re
    trying to uphold.


    Another way to look at a promise is as an agreed-upon exchange that provides value
    for both parties (like a producer and a consumer). But how do we go about deciding
    between two parties what is valuable and what promises we’d like to agree upon?
    If nobody calls our service or gets value from our promises, how useful is the
    service? One way of articulating the promises between consumers and providers
    is with *consumer-driven contracts*. W(http://bit.ly/2s69I7x)ith consumer-driven
    contracts, we are able to capture the value of our promises with code or assertions,
    and as a provider, we can use this knowledge to test whether we’re upholding our
    promises.


    ## Distributed Systems Management


    At the end of the day, managing a single system is easier than for a distributed
    one. If there’s just one machine, and one application server, and there are problems
    with the system, we know where to look. If we need to make a configuration change,
    upgrade to a specific version, or secure it, it’s all in one physical and logical
    location.


    Managing, debugging, and changing it is easier. A single system may work for some
    use cases, but for ones where scale is required, we may look to leverage microservices.
    As we discussed earlier, however, microservices are not free; the trade-off for
    having flexibility and scalability is having to manage a complicated system.


    When it comes to managing a microservices deployment, here are some questions
    to consider:


    - How do we start and stop a fleet of services?

    - How do we aggregate logs/metrics/service level agreements (SLAs) across microservices?

    - How do we discover services in an elastic environment where they can be coming,
    going, moving, etc.?

    - How do we do load balancing?

    - How do we learn about the health of our cluster or individual services?

    - How do we restart services that have failed?

    - How do we do fine-grained API routing?

    - How do we secure our services?

    - How do we throttle or disconnect parts of a cluster if it starts to crash or
    act unexpectedly?

    - How do we deploy multiple versions of a service and route to them appropriately?

    - How do we make configuration changes across a large fleet of services?

    - How do we make changes to our application code and configuration in a safe,
    auditable, repeatable manner?


    These are not easy problems to solve. The rest of this report will be devoted
    to getting Java developers up and running with microservices and able to solve
    some of the problems listed here.


    ## Technology Solutions


    Throughout the rest of the report, we’ll introduce you to some popular technology
    components and how they help solve some of the problems of developing and delivering
    software using a microservices architecture. As touched upon earlier, microservices
    aren’t just a technological problem, and getting the right organizational structure
    and teams in place to facilitate this approach is paramount.


    Switching from SOAP to REST doesn’t make a microservices architecture.


    The first step for a Java development team creating microservices is to get something
    working locally on their machines. This report will introduce you to three opinionated
    Java frameworks for working with microservices: Spring Boot, MicroProfile, and
    Apache Camel.


    Each framework has upsides for different teams, organizations, and approaches
    to microservices. As is the norm with technology, some tools are a better fit
    for the job or team using them than others. Of course, these are not the only
    frameworks to use. There are a couple that take a reactive approach to microservices,
    like [Vert.x](http://bit.ly/2Sa7LT2) and [Lagom. The mindshift for developing
    with an even](http://bit.ly/2ImXJOK)t-based model is a bit different and requires
    a different learning curve, though, so for this report we’ll stick with a model
    that most enterprise Java developers will find comfortable.


    If you want to know more about reactive programming and reactive microservices,
    you can download the free ebook [*Building Reactive*](https://red.ht/2SZRrIV)


    [*Microservices in Java*](https://red.ht/2SZRrIV) by Clemen[t Escoffier from the
    Red Hat Devel‐](https://red.ht/2E0BLvR)opers website.(https://red.ht/2E0BLvR).


    The goal of this report is to get you up and running with the basics for each
    framework. We’ll dive into a few advanced concepts in the last chapter, but for
    the first steps with each framework, we’ll assume a “Hello World” microservice
    application. This report is not an all-encompassing reference for developing microservices;
    each chapter ends with links to reference material that you can explore to learn
    more as needed. We will iterate on the Hello World application by creating multiple
    services and show some simple interaction patterns.


    The final iteration for each framework will look at concepts like bul-kheading
    and promise theory to make services resilient in the face of faults. We will dig
    into parts of the NetflixOSS stack, like Hystrix, that can make our lives easier
    when implementing this functionality.


    We will discuss the pros and cons of this approach and explore what other options
    exist.


    First, though, let’s take a look at the prerequisites you’ll need to get started.


    ## Preparing Your Environment


    We will be using Java 1.8 for the examples in this report and building them with
    Maven. Please make sure for your environment you have the following prerequisites
    installed:


    - JDK 1.8

    - Maven 3.5+

    - Access to a command-line shell (bash, PowerShell, cmd, Cyg-win, etc.)

