  raw: 'Now that you know how to build microservices, you could continue building
    more and more. However, as the number of microservices grows, the complexity for
    the client who is consuming these APIs also grows.


    Real applications could have dozens or even hundreds of microservices. A simple
    process like buying a book from an online store like Amazon can cause a client
    (your web browser or your mobile app) to use several other microservices. A client
    that has direct access to the microservice would have to locate and invoke them
    and handle any failures they caused itself. So, usually a better approach is to
    hide those services behind a new service layer. This aggregator service layer
    is known as an *API gateway*.


    Another advantage of using an API gateway is that you can add cross-cutting concerns
    like authorization and data transformation in this layer. Services that use non-internet-friendly
    protocols can also benefit from the usage of an API gateway. However, keep in
    mind that it usually isn’t recommended to have a single API gateway for all the
    microservices in your application. If you (wrongly) decided to take that approach,
    it would act just like a monolithic bus, violat-ing microservice independence
    by coupling all the microservices.


    Adding business logic to an API gateway is a mistake and should be avoided.


    **53**


    **Apache Camel**


    Apache Camel is an open source integration framework that is well suited to implementing
    API gateways. The framework implements most of the patterns for enterprise application
    integration (EAI) described in the book *Enterprise Integration Patterns*, by
    Gregor Hohpe and Bobby Woolf (Addison-Wesley). Each enterprise integration pattern
    (EIP) describes a solution for a common design problem that occurs repeatedly
    in many integration projects. The book documents 65 EIPs, taking a technology-agnostic
    approach.


    Apache Camel uses a consistent API based on EIPs to have a well-defined programming
    model for integration. With over 200 components, the developer can connect Apache
    Camel to almost any source/destination. In addition to HTTP, FTP, File, JPA, SMTP,
    and Websocket components, there are even components for platforms like Twitter,
    Facebook, AWS, etc.


    Apache Camel is very powerful, yet very simple to use. This makes it an ideal
    choice for creating the API gateway for our microservices.


    Apache Camel can be executed as a standalone application or be embedded in a existing
    application. For our API gateway example, we will use Camel in a Spring Boot application.


    **Getting Started**


    Camel applications can be created by declaring the Maven dependencies in an existing
    application, or by using an existing Maven Archetype.


