  raw: 'In the previous chapters, we built a couple of microservices that connect
    to a backend. To access these two microservices, we also built an API Gateway.
    With just a few microservices, it’s easy to understand the topology and what calls
    what inside our cluster.


    However, in a real-world scenario the network of services will likely be far more
    complex, and therefore it will be much more complex to monitor the number of requests,
    the response time, and the path of a particular invocation. A simple invocation
    can traverse several microservices, and any particular issue will be hard to detect
    if we don’t have the ability to trace those invocations.


    One things that we need to keep in mind is that distributed tracing should be
    technology-agnostic, because a Java microservice might invoke a .NET microservice
    that will call a Python microservice, and they should all accept and propagate
    the tracing information.


    [In 2010, Google published a paper about the project Dapper](http://bit.ly/2GWJWwc),
    which was designed to provide a solution for distributed tracing. This paper influenced
    several open source implementations, like Zipkin and Appdash. In 2015 the OpenTracing
    project was started, and in 2016 it became a hosted project of the Cloud Native
    Computing Foundation (CNCF).


    OpenTracing is comprised of a set of standard APIs and a vendor-neutral framework
    for instrumentation. It supports the following platforms: Go, JavaScript, Java,
    Python, Ruby, PHP, Objective-C, **93**


    C++, and C#. There are already several OpenTracing implementations, including
    Jaeger (from Uber), Apache Skywalking, and Instana, and others. In this report,
    we will use Jaeger, which is the most widely used implementation of OpenTracing.


    **Installing Jaeger**


    All information captured on each microservice should be reported to a server that
    will collect and store this information, so it can be queried later.


    So, before instrumenting the source code of our microservices, first we need to
    install the Jaeger server and its components. Jaeger provides an all-in-one distribution
    composed of the Jaeger UI, collector, query, and agent, with an in-memory storage
    component.


    We can install this distribution with the following command: $ **oc process -f
    \**


    **http://raw.githubusercontent.com/jaegertracing/jaeger-openshift**


    **/master/**


    **all-in-one/jaeger-all-in-one-template.yml | oc create -f -**


    deployment.extensions "jaeger" created


    service "jaeger-query" created


    service "jaeger-collector" created


    service "jaeger-agent" created


    service "zipkin" created


    route.route.openshift.io "jaeger-query" created That’s it! Now we can start modifying
    our microservices to report the tracing information to this server.


    **Modifying Microservices for Distributed**


    **Tracing**


