    \ rhdevelopers/hello-springboot:1.0\n```\n\n`-it` 切换指示 Docker 创建一个交互进程并为其分配一个终端。`--rm`\
    \ 切换指示 docker 在我们停止容器时删除该容器。`-p 8080:8080` 指示 Docker 将容器的 `8080` 端口映射到 Docker\
    \ 守护进程主机的 `8080` 端口。\n\n一旦容器启动，你可以打开一个新的终端，并使用 `curl` 命令访问它：\n\n```bash\ncurl\
    \ $(minishift ip):8080/api/hello\n```\nGuten Tag aus 172.17.0.6\n\n这些是在 Docker\
    \ 容器中部署你的应用程序并进行测试的基础性步骤。然而，我们不会重点关注纯粹的 Docker 容器。相反，在下一章中，我们将看到如何使用 Kubernetes\
    \ 大规模运行这些微服务。在继续之前，请不要忘记按 Ctrl-C 停止正在运行的 `hello-springboot` Docker 容器。\n\n## 部署到\
    \ Kubernetes\n\n有多种方法可以在 Kubernetes/OpenShift 集群内部部署我们的微服务/容器。然而，出于教学目的，我们将使用\
    \ YAML 文件，这些文件能够很好地表达我们期望集群具备的行为。\n\n在本报告的源代码中，每个微服务示例都有一个名为 `kubernetes` 的文件夹，其中包含两个文件：`deployment.yml`\
    \ 和 `service.yml`。部署文件将创建一个带有一个副本（replica）的 `Deployment` 对象。\n\n`Deployment` 还提供了至少两个环境变量。\n\
    \n名为 `JAVA_OPTIONS` 的变量指定了 JVM 参数，例如 `-Xms` 和 `-Xmx`。名为 `GREETING_BACKENDSERVICEHOST`\
    \ 的变量替换了我们在前两个微服务中定义的值，用于寻找 `BACKEND` 服务，正如你将在第 80 页的“服务发现”中看到的那样。\n\n以下是用于 `hello-springboot`\
    \ 微服务的 `deployment.yml` 文件。\n\n```yaml\napiVersion: extensions/v1beta1\nkind:\
    \ Deployment\nmetadata:\n  name: hello-springboot\n  labels:\n    app: hello-springboot\n\
    \    book: microservices4javadev\n    version: v1\nspec:\n  replicas: 1\n  selector:\n\
    \    matchLabels:\n      app: hello-springboot\n      version: v1\n  template:\n\
    \    metadata:\n      labels:\n        app: hello-springboot\n        book: microservices4javadev\n\
    \        version: v1\n    spec:\n      containers:\n        - env:\n         \
    \   - name: JAVA_OPTIONS\n              value: -Xmx256m -Djava.net.preferIPv4Stack=true\n\
    \            - name: GREETING_BACKENDSERVICEHOST\n              value: backend\n\
    \          image: rhdevelopers/hello-springboot:1.0\n          imagePullPolicy:\
    \ IfNotPresent\n          livenessProbe:\n            httpGet: # make an HTTP\
    \ request\n              port: 8080 # port to use\n              path: /actuator/health\
    \ # endpoint to hit\n              scheme: HTTP # or HTTPS\n            initialDelaySeconds:\
    \ 20\n            periodSeconds: 5\n            timeoutSeconds: 1\n          name:\
    \ hello-springboot\n          ports:\n            - containerPort: 8080\n    \
    \          name: http\n          readinessProbe:\n            httpGet: # make\
    \ an HTTP request\n              port: 8080 # port to use\n              path:\
    \ /actuator/health # endpoint to hit\n              scheme: HTTP # or HTTPS\n\
    \            initialDelaySeconds: 10\n            periodSeconds: 5\n         \
    \   timeoutSeconds: 1\n```\n\n由于 `deployment.yml` 和 `service.yml` 文件与报告的源代码存储在一起，你可以通过以下命令直接指向这些文件来部署服务\n\
    \n首先，部署 `backend` 微服务：\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/deployment.yml\n\
    ```\n然后部署 `hello-springboot` 微服务：\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/service.yml\n\
    ```\n以及 `hello-microprofile` 微服务：\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/deployment.yml\n\
    ```\n最后，部署 `api-gateway` 微服务：\n```bash\noc create -f http://raw.githubusercontent.com/redhat-developer/microservices-book/kubernetes/service.yml\n\
    ```\n\n部署文件将创建四个 pod（每个微服务一个副本）。服务文件将使这些每个副本相互可见。你可以通过以下命令检查已创建的 pod：\n\n```bash\n\
    oc get pods\n```\nNAME                                 READY   STATUS\napi-gateway-5985d4fd5-4nsfs\
    \          1/1     Running\nbackend-659d84cb9-5hv2r            1/1     Running\n\
    hello-microprofile-844c6c758-mm4h   1/1     Running\nhello-springboot-5bf5c4c7fd-k5mf4\
    \   1/1     Running\n\nKubernetes 作为集群管理器带来了哪些优势？让我们从许多功能中的第一个开始探索。让我们杀掉一个 pod\
    \ 看看会发生什么：\n```bash\noc delete pod hello-springboot-5bf5c4c7fd-k5mf4\n```\npod\
    \ \"hello-springboot-5bf5c4c7fd-k5mf4\" deleted 现在让我们再次列出 pod：\n```bash\noc get\
    \ pods\n```\nNAME                                 READY   STATUS\napi-gateway-5985d4fd5-4nsfs\
    \          1/1     Running\nbackend-659d84cb9-5hv2r            1/1     Running\n\
    hello-microprofile-844c6c758-mm4h   1/1     Running\nhello-springboot-5bf5c4c7fd-28mpk\
    \   1/1     Running\n\n哇！还是四个 pod！在我们删除上一个之后，另一个 pod 被创建了。Kubernetes 可以为你启动/停止/自动重启微服务。你能想象手动判断你的服务在任何规模下启动或停止有多头疼吗？让我们继续探索\
    \ Kubernetes 为管理微服务提供的其他集群管理功能。\n\n## 外部访问\n\n现在所有的微服务都已部署在集群内部，我们需要提供外部访问。由于我们定义了\
    \ API 网关，只有这个微服务需要暴露；它将成为调用 `hello-microprofile` 和 `hello-springboot` 微服务的单一访问点。为了使用\
    \ OpenShift 启用外部访问，我们需要运行 `oc expose service` 命令，后面跟上想要暴露的服务名称（在本例中为 `api-gateway`）：\n\
    ```bash\noc expose service api-gateway\n```\nroute.route.openshift.io/api-gateway\
    \ exposed\n\n现在你可以尝试使用 `curl` 命令测试所有微服务。\n```bash\ncurl http://api-gateway-tutorial.$(minishift\
    \ ip).nip.io/api/gateway\n```\n```\n[\"Hello from cluster Backend at host: 172.17.0.7\"\
    ,\n\"Hello Spring Boot from cluster Backend at host: 172.17.0.7\"]\n```\n输出显示你通过\
    \ API 网关访问了两个微服务，并且它们都访问了 `backend` 服务，这意味着一切都符合预期。\n\n## 扩展\n\n在微服务架构中部署的优势之一是独立扩展。我们应该能够轻松复制集群中的服务数量，而无需担心端口冲突、JVM\
    \ 或依赖不匹配，以及同一台机器上运行的其他任何内容。在 Kubernetes 中，这些扩展问题可以通过 `Deployment/ReplicationController`\
    \ 完成。让我们看看部署中存在哪些部署：\n```bash\noc get deployments\n```\n\n"
