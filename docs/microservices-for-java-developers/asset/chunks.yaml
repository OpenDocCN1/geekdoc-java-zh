  trans: "\n\n在之前的章节中，我们构建了几个连接到后端的微服务。为了访问这两个微服务，我们还构建了一个 API 网关。对于只有几个微服务的情况，理解集群内部拓扑结构以及内部的调用关系是很容易。\n\
    \n然而，在现实场景中，服务的网络可能会复杂得多，因此，监控请求数、响应时间以及特定调用的路径也会变得非常复杂。一个简单的调用可能会跨越多个微服务，如果我们没有追踪这些调用的能力，任何特定问题都将难以检测。\n\
    \n我们需要记住的一点是，分布式追踪应该是与技术无关的，因为一个 Java 微服务可能会调用一个 .NET 微服务，而该服务又会调用一个 Python 微服务，并且它们都应该能够接收并传播追踪信息。\n\
    \n2010 年，Google 发布了一篇关于 [Dapper 项目](http://bit.ly/2GWJWwc) 的论文，该项目旨在为分布式追踪提供解决方案。这篇论文影响了多个开源实现，如\
    \ Zipkin 和 Appdash。2015 年，OpenTracing 项目启动，并于 2016 年成为云原生计算计算基金会（CNCF）的托管项目。\n\
    \nOpenTracing 由一组标准 API 和一个厂商中立的插桩框架组成。它支持以下平台：Go、JavaScript、Java、Python、Ruby、PHP、Objective-C、93、C++\
    \ 和 C#。目前已经有了多个 OpenTracing 实现，包括 Jaeger（来自 Uber）、Apache Skywalking 和 Instana\
    \ 等。在本文报告中，我们将使用 Jaeger，它是 OpenTracing 使用最广泛的实现。\n\n## 安装 Jaeger\n\n在每个微服务上捕到的所有信息都应该报告到一个收集并存储这些信息的服务器，以便以后进行查询。\n\
    \n因此，在对微服务的源码进行插桩之前，我们首先需要安装 Jaeger 服务器及其组件。Jaeger 提供了一个由 Jaeger UI、收集器、查询器和代理组成的全合发行版，并包含一个内存存储组件。\n\
    \n我们可以使用以下命令安装该发行版：\n\n```bash\noc process -f http://raw.githubusercontent.com/jaegertracing/jaeger-openshift/master/all-in-one/jaeger-all-in-one-template.yml\
    \ | oc create -f -\n```\n\n```\ndeployment.extensions \"jaeger\" created\nservice\
    \ \"jaeger-query\" created\nservice \"jaeger-collector\" created\nservice \"jaeger-agent\"\
    \ created\nservice \"zipkin\" created\nroute.route.openshift.io \"jaeger-query\"\
    \ created\n```\n\n搞定！现在我们可以开始修改微服务，将追踪信息报告到该服务器了。\n\n## 修改微服务以进行分布式追踪\n\n现在我们已经安装了\
    \ Jaeger 服务器，是时候修改微服务向其报告信息了。\n\n所有的 Java OpenTracing 库都可以使用[环境](http://bit.ly/2H41cjh)变量进行配置。唯一必需环境变量是\
    \ `JAEGER_SERVICE_NAME`，它告诉 Jaeger 服务名称。\n\n这将在每个微服务的 Dockerfile 中声明为一个 `ENV`\
    \ 指令。由于我们还需要在所有微服务上使用其他环境变量来配置追踪收集器，它们将使用一个名为 `ConfigMap` 的 Kubernetes 特性声明，然后被所有微服务消费。\n\
    \n## 修改 API 网关\n\n我们将修改的第一个微服务是 `api-gateway` 服务。\n\n由于它是使用 Camel 构建的，我们将利用一个名为\
    \ `camel-opentracing` 的 Camel 组件。该组件用于追踪传入和流出的 Camel 消息。\n\n要使用这个 Camel 组件，我们只需要向我们的\
    \ `pom.xml` 文件添加依赖 `camel-opentracing-starter`，它可以启用 Camel、Spring Boot 和 OpenTracing\
    \ 的集成。我们还需要添加两个 Jaeger 库——`jaeger-tracerresolver` 用于获取 `Tracer` 对象并从环境变量配置它，而\
    \ `jaeger-thrift` 是一组向后端发送组件的组件：\n\n```xml\n<!-- OpenTracing -->\n<dependency>\n\
    \  <groupId>org.apache.camel</groupId>\n  <artifactId>camel-opentracing-starter</artifactId>\n\
    </dependency>\n<dependency>\n  <groupId>io.jaegertracing</groupId>\n  <artifactId>jaeger-tracerresolver</artifactId>\n\
    \  <version>0.32.0</version>\n</dependency>\n<dependency>\n  <groupId>io.jaegertracing</groupId>\n\
    \  <artifactId>jaeger-thrift</artifactId>\n  <version>0.32.0</version>\n</dependency>\n\
    ```\n\n现在我们可以通过在主类上添加 `@CamelOpenTracing` 来“开启” OpenTracing 功能，如示例 7-1](#index_split_000.html_p101)所示。\n\
    \n示例 7-1. src/main/java/com/redhat/examples/MySpringBootApplication.java:\n\n\
    ```java\n@SpringBootApplication\n@CamelOpenTracing\npublic class MySpringBootApplication\
    \ {\n    /**\n     * 启动此应用程序的方法。\n     */\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(MySpringBootApplication.class, args);\n\
    \    }\n}\n```\n\n如之前所述，`Tracer` 对象将使用环境变量进行配置。由于唯一必需的是 `JAEGER_SERVICE_NAME`，我们将其值\
    \ `api-gateway` 添加到我们的 Dockerfile 中：\n\n```dockerfile\nFROM fabric8/java-alpine\n\
    ENV JAEGER_SERVICE_NAME api-gateway\nADD target/api-gateway.jar /deployments/\n\
    ```\n\n现在我们可以通过以下命令重新构建 JAR 和 镜像并重启 Kubernetes Pod：\n\n```bash\nmvn clean package\n\
    docker build -t developers/api-gateway:1.0 .\noc delete pod -l app=api-gateway\n\
    ```\n\n## 修改 Spring Boot 微服务\n\n对于我们的 `springboot` 微服务，我们需要添加在 `api-gateway` 服务中相同的\
    \ `jaeger-tracerresolver` 和 `jaeger-thrift` 库，再加上负责与 Spring Boot 和 OpenTracing\
    \ 集成的 `opentracing-spring-starter` 依赖：\n\n```xml\n<!-- OpenTracing -->\n<dependency>\n\
    \  <groupId>io.opentracing.contrib</groupId>\n  <artifactId>opentracing-spring-starter</artifactId>\n\
    \  <version>1.0</version>\n</dependency>\n<dependency>\n  <groupId>io.jaegertracing</groupId>\n\
    \  <artifactId>jaeger-tracerresolver</artifactId>\n  <version>0.32.0</version>\n\
    </dependency>\n<dependency>\n  <groupId>io.jaegertracing</groupId>\n  <artifactId>jaeger-thrift</artifactId>\n\
    \  <version>0.32.0</version>\n</dependency>\n```\n\n为了让追踪头从此微服务转发到后端，`RestTemplate`\
    \ 需要一个名为 `TracingRestTemplateInterceptor` 的拦截器。\n\n让我们修改 `GreeterRestController`\
    \ 类以添加此拦截器，如示例 7-2](#index_split_000.html_p103)所示。\n\n示例 7-2. src/main/java/com/redhat/examples/springboot/GreeterRestController.java:\n\
    \n```java\n@RestController\n@RequestMapping(\"/api\")\n@ConfigurationProperties(prefix=\"\
    greeting\")\npublic class GreeterRestController {\n    private RestTemplate template\
    \ = new RestTemplate();\n    private String saying, backendServiceHost;\n    private\
    \ int backendServicePort;\n\n    @RequestMapping(value = \"/greeting\", method\
    \ = RequestMethod.GET, produces = \"text/plain\")\n    @HystrixCommand(fallbackMethod\
    \ = \"fallback\")\n    public String greeting() {\n        template.setInterceptors(\n\
    \            Collections.singletonList(\n                new TracingRestTemplateInterceptor(\n\
    \                    TracerResolver.resolveTracer()))\n            )\n       \
    \ );\n        String backendServiceUrl = String.format(\n            \"http://%s:%d/api/backend?greeting={greeting}\"\
    , backendServiceHost, backendServicePort);\n        // ...\n    }\n}\n```\n\n"
- fmt: "\n```java\nSystem.out.println(\"Sending to: \" + backendServiceUrl);\nBackendDTO\
    \ response = template.getForObject(\nbackendServiceUrl, BackendDTO.class, saying);\n\
    \nreturn response.getGreeting() + \" at host: \" +\nresponse.getIp();\n}\n\n//fallback\
    \ method and setters\n}\n```\n\nNow let’s add the declaration of the `JAEGER_SERVICE_NAME`\
    \ environment variable in the Dockerfile:\n\n**Modifying Microservices for Distributed\
    \ Tracing | 97**\n\n```dockerfile\nFROM fabric8/java-alpine-openjdk8-jdk\nENV\
    \ JAVA_APP_JAR hello-springboot-1.0.jar\nENV AB_OFF true\nENV JAEGER_SERVICE_NAME\
    \ hello-springboot\nADD target/hello-springboot-1.0.jar /deployments/\n```\n\n\
    Then we can rebuild the JAR file and the Docker image and restart the Kubernetes\
    \ pod with the following commands:\n\n```bash\n$ mvn clean package -DskipTests\n\
    $ docker build -t rhdevelopers/hello-springboot:1.0 .\n$ oc delete pod -l app=hello-springboot\n\
    ```\n\n**Modifying the MicroProfile microservice**\n\nFor our *hello_microprofile*,\
    \ we will follow the same recipe: 1. Add a Maven dependency.\n2. Modify the source\
    \ code.\n3. Add the `JAEGER_SERVICE_NAME` environment variable to the Dockerfile.\n\
    \nLet’s start by adding the Maven dependencies related to OpenTracing and Jaeger,\
    \ respectively. MicroProfile has support for OpenTracing and Thorntail has integration\
    \ with Jaeger, so we will need both dependencies:\n\n```xml\n<!-- OpenTracing\
    \ -->\n<dependency>\n<groupId>io.thorntail</groupId>\n<artifactId>microprofile-opentracing</artifactId>\n\
    </dependency>\n<dependency>\n<groupId>io.thorntail</groupId>\n<artifactId>jaeger</artifactId>\n\
    </dependency>\n```\n\nMicroProfile has an API for accessing an OpenTracing-compliant\
    \ `Tracer` object within a JAX-RS application. We just need to add the `@Traced`\
    \ annotation to the methods that will be “traced.” We also need to use the class\
    \ `ClientTracingRegistrar` to configure tracing features into the JAX-RS client.\
    \ Let’s perform these modifications to the `greeting()` method in the `GreeterRestController`\
    \ class in [Example 7-3](#index_split_000.html_p105).\n\n**98 | Chapter 7: Distributed\
    \ Tracing with OpenTracing**\n\n*Example 7-3. src/main/java/com/redhat/examples/hellomicroprofile/*\n\
    *rest/GreeterRestController.java*\n\n```java\n@Path(\"/api\")\npublic class GreeterRestController\
    \ {\n    @Inject\n    @ConfigProperty(name=\"greeting.saying\", defaultValue =\
    \ \"Hello\")\n    private String saying;\n\n    @Inject\n    @ConfigProperty(name\
    \ = \"greeting.backendServiceHost\", defaultValue = \"localhost\")\n    private\
    \ String backendServiceHost;\n\n    @Inject\n    @ConfigProperty(name = \"greeting.backendServicePort\"\
