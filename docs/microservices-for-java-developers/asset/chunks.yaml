    contains Docker, Kubernetes, and a web console (actually, it runs Red Hat OpenShift,
    which is basically a version of Kubernetes with some other developer self-service
    and application lifecycle management features, but for this book we’ll just be
    using the Kubernetes APIs).


    **OpenShift**


    Red Hat OpenShift 3.x is an Apache v2 licensed open source developer self-service
    platform, [OpenShift Origin](http://bit.ly/2EpgiNe), that has been revam-ped to
    use Docker and Kubernetes. OpenShift at one point had its own cluster management
    and orchestration engine, but with the knowledge, simplicity, and power that Kubernetes
    brings to the world of container cluster management, it would have been silly
    to try to compete. The broader community is converging around Kubernetes, and
    Red Hat is all in with Kubernetes.'
