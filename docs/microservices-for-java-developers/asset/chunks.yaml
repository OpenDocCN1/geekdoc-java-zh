  trans: "\n另一个我们可以使用的健康检查是存活探针（liveness probe）。这与就绪探针（readiness probe）类似；但它适用于 pod\
    \ 被确定为“就绪”并有资格接收流量之后。在 pod 或服务的生命周期内，如果存活探针（也可以是一个简单的 HTTP 端点）开始指示一个不健康状态（例如 HTTP\
    \ 500 错误），Kubernetes 可以自动杀死该 pod 并重启它。\n\n在之前显示的 `deployment.yml` 文件中，我们通过 `livenessProbe`\
    \ 和 `readinessProbe` 声明了这两个探针：\n\n```yaml\nlivenessProbe:\n  httpGet: # 发起 HTTP\
    \ 请求\n    port: 8080 # 使用的端口\n    path: /actuator/health # 要访问的端点\n    scheme:\
    \ HTTP # 或 HTTPS\n...\nreadinessProbe:\n  httpGet: # 发起 HTTP 请求\n    port: 8080\
    \ # 使用的端口\n    path: /actuator/health # 要访问的端点\n    scheme: HTTP # 或 HTTPS\n```\n\
    \n这意味着 `hello-springboot` pod 的“就绪性”将通过定期轮询 pod 的 `/actuator/health` 端点来确定（该端点是在我们之前为\
    \ Spring Boot 微服务添加 actuator 时添加的）。如果 pod 已就绪，它将返回：\n\n```json\n{\"status\" :\"\
    UP\"}\n```\n\n使用 MicroProfile/Thorntail 和 Apache Camel 实现相同的操作。\n\n### 熔路器\n\n\
    作为服务提供者，你的责任是向消费者提供你所承诺的功能。根据承诺理论（promise theory），服务提供者可能依赖于其他服务或下游系统，但不能也不应该对它们施加要求。服务提供者对其对消费者的承诺\
    \ `Fault Tolerance | 83` 负全部责任。然而，由于分布式系统可能且确实会发生故障，因此会有某些时候无法履行服务承诺或只能部分履行。在我们之前的示例中，我们展示了我们的“hello”微服务调用\
    \ `backend` 服务以在 `/api/greeting` 端点形成问候。如果 `backend` 服务不可用会发生什么？我们如何履行我们承诺的责任？\n\
    \n我们需要能够处理这类分布式系统故障。服务可能不可用；网络可能经历间歇性连接；后端服务可能正承受足够的负载以导致其变慢并引入延迟；后端服务中的 bug 可能会导致应用级异常。如果我们不显式地处理这些情况，就会面临降低我们自己服务的风险；占用线程、数据库锁和资源，并导致滚动性的、级联故障，这种故障可能会导致整个分布式网络崩溃。以下小节介绍了两种帮助我们处理这些故障的不同方法（每种技术一种，即\
    \ Spring Boot 和 MicroProfile）。\n\n### 使用 MicroProfile 的熔路器\n\n让我们从 MicroProfile\
    \ 开始，通过向 Maven `pom.xml` 中添加 `microprofile-fault-tolerance` 依赖：\n\n```xml\n<dependency>\n\
    \  <groupId>io.thorntail</groupId>\n  <artifactId>microprofile-fault-tolerance</artifactId>\n\
    </dependency>\n```\n\n现在，我们可以在 `greeting()` 方法上添加 `@CircuitBreaker` 和 `@Timeout`\
    \ 注解。但如果后端依赖项变得延迟或不可用，且 MicroProfile 使用熔路器进行干预，我们的服务如何保持其承诺？这个问题的答案可能取决于具体的领域。考虑我们之前关于个性化书籍推荐服务的示例。如果该服务不可用或响应太慢，后端可以默认发送一份非个性化的书籍列表。也许我们会为特定地区的用户发送一份通用书籍列表，或者只是一个通用的“今日列表”。为了做到这一点，我们可以使用\
    \ MicroProfile 内置的 `fallback()` 方法。在[示例 6-1 中，我们添加了]`fallback()` 方法以便在后端服务不可用时返回通用响应]。\n\
    \n我们还为 `GreeterRestController` 类添加了 `@Fallback` 注解，指定当问候调用 `84 | 第 6 章：集群管理、故障转移和负载均衡`失败时调的方法，并带有\
    \ `@Timeout` 注解以防止微服务等待回复超过一秒。\n\n*示例 6-1. src/main/java/com/example/hellomicroprofile/rest/*\n\
    *GreeterRestController.java*\n\n```java\n@RestController\n@RequestMapping(\"/api\"\
    )\n@ConfigurationProperties(prefix=\"greeting\")\npublic class GreeterRestController\
    \ {\n    // 未显示变量\n\n    @GET\n    @Produces(\"text/plain\")\n    @Path(\"greeting\"\
    )\n    @CircuitBreaker\n    @Timeout\n    @Fallback(fallbackMethod = \"fallback\"\
    )\n    public String greeting(){\n        // greeting 实现\n    }\n\n    public\
    \ String fallback(){\n        return saying + \" at host \" +\n        System.getenv(\"\
    HOSTNAME\") + \" - (fallback)\";\n    }\n}\n```\n\n### 使用 Spring Boot 的熔路器\n\n\
    对于 Spring Boot，我们将使用 NetflixOSS 栈中名为 `Hystrix` 的库。该库通过名为 `Spring Cloud` 的 Spring\
    \ 库与 Spring 集成。\n\nHystrix 是一个容错 Java 库，允许微服务通过以下方式履行其承诺：\n- 针对不可用的依赖提供保护\n- 监控并提供超时以防止意外的\n\
