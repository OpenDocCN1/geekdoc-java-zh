    **Where to Look Next | 35**


    **CHAPTER 3**


    **Eclipse MicroProfile for**


    **Microservices**


    The next Java microservice framework we’ll look at is MicroProfile.


    Java Enterprise Edition (EE) (now Jakarta EE) has been the work-horse of enterprise
    Java applications for more than 15 years. Many enterprises have heavily invested
    in open source and proprietary Java EE technologies, and this has affected everything
    from how they hire software talent to training, tooling, and management. Java
    EE has always been very capable at helping developers build tiered applications
    by offering functionality like servlets/JavaServer Pages (JSPs), transactions,
    component models, messaging, and persistence.


    Despite its popularity, recently the feeling began to grow that Java EE’s pace
    of innovation was too slow for a world that demanded cloud-native applications,
    microservices, and containers. This feeling prompted various Java User Groups,
    Java Champions, vendors, and corporations to join forces and release the MicroProfile
    specification.


    MicroProfile 1.0, announced during JavaOne 2016, was composed of the CDI, JSON-P,
    and JAX-RS specifications from Java EE. These base APIs allow experienced Java
    EE developers to utilize their existing skill sets for this fast-paced, innovative,
    and open source specification.


    As a specification, there are several MicroProfile implementations: these include
    Thorntail from Red Hat, Payara Micro from Payara, **37**


    ![](index-44_1.png)


    TomEE from Apache, and OpenLiberty from IBM, just to name a few.


    Because Java EE had a strong influence on MicroProfile, it is worth mentioning
    that in 2017, Oracle donated Java EE to the Eclipse Foundation under the Jakarta
    EE brand. Although Jakarta EE and MicroProfile share the same origin, their purpose
    remains very different. While Jakarta EE is a continuation of Java EE and focuses
    on enterprise applications, MicroProfile instead focuses on Enterprise microservices
    applications.


    The MicroProfile 2.1 specification defines the base programming model using the
    Jakarta EE CDI, JSON-P, JAX-RS, and JSON-B


    APIs, and adds Open Tracing, Open API, Rest Client, Config, Fault Tolerance, Metrics,
    JWT Propagation, and Health Check APIs (see


    [Figure 3-1](#index_split_000.html_p44)). Development remains active, with groups
    working on Reactive Streams, Reactive Messaging, GraphQL, long running actions,
    and service mesh features.


    *Figure 3-1\. MicroProfile 2.1 APIs*


    **Thorntail**


    Thorntail is the MicroProfile implementation from Red Hat. It is a complete teardown
    of the WildFly application server into bite-sized, reusable components that can
    be assembled and formed into a microservice application. Assembling these components
    is as simple as including a dependency in your Java Maven (or Gradle) build file;
    Thorntail takes care of the rest.


    **38 | Chapter 3: Eclipse MicroProfile for Microservices**


    ![](index-45_1.png)


    Thorntail evaluates your *pom.xml* (or Gradle) file and determines what dependencies
    your microservice actually uses (e.g., CDI, OpenTracing, and Metrics), and then
    builds an uber-JAR (just like Spring Boot and Dropwizard) that includes the minimal
    APIs and implementations necessary to run your service.


    Besides the MicroProfile API, Thorntail provides many other functionalities. Some
    components provide only access to other APIs, such as JPA or JMS; other components
    provide higher-level capabilities, such as integration with Infinispan.


    **Getting Started**


    You can start a new Thorntail project by using the [Thorntail Gener‐](https://thorntail.io/generator/)


    [ator web console](https://thorntail.io/generator/) to bootstrap it (similar to
    Spring Initializr for Spring Boot). Simply open the page and fill in the fields
    with the following values, as shown in [Figure 3-2:](#index_split_000.html_p45)


    • Group ID: com.redhat.examples


    • Artifact ID: hello-microprofile


    • Dependencies: MicroProfile Config, JAX-RS'
