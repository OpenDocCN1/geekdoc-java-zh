    # 第 5 章：使用 Docker 和 Kubernetes 大规模部署微服务


    在之前的章节中，我们首先从高层层面讨论了微服务，涵盖了组织敏捷性、基于依赖思维的设计、领域驱动设计和承诺理论，然后我们深入研究了三个用于开发微服务的流行 Java
    框架：Spring Boot、MicroProfile/Thorntail 和 Apache Camel。我们看到通过暴露和消费 REST 端点、利用环境配置选项、打包为全合一的可执行
    JAR 文件以及暴露指标，来轻松地利用这些框架提供的强大开箱即用功能。这些概念都围绕着微服务的单个实例展开。但当你需要管理依赖、获取一致的启动和停止行为、进行健康检查并大规模对你的微服务进行负载均衡时，会发生什么？


    在本章中，我们将讨论这些高层概念，以便你更多地理解无论使用语言，大规模部署微服务面临的挑战。


    当我们开始将应用程序和服务类拆解为微服务时，从定义上说，会有更多的活动部分：我们有更多的服务、更多的二进制文件、更多的配置、更多的交互点等。传统上我们处理部署
    Java 应用的方法是构建二进制制品（JARs、WARs、EARs），将其存放在某处（共享磁盘），提交工单，并希望运维团队按照我们的意图将其部署到应用程序服务器上。我们还在具有冗余硬件、负载均衡器和共享磁盘的集群中部署应用程序服务器。我们可能使用
    Chef 或 Ansible 等优秀工具对基础设施构建了一些自动化，但某些部署应用程序仍然充满了错误、配置漂移和意外之外的行为。


    在这种模式下，我们做了大量的“希望”，这在当前环境中很快就会失效，更不用说在大规模环境下。应用程序服务器在开发/测试/生产环境中的配置与我们机器上的一致吗？


    如果不是，我们是否完整地捕获了需要提交给运维人员的变化？运行应用程序的 JVM 是一个实现细节，与我们配置和调优应用程序高度耦合，因此环境之间的差异会造成灾难。当你开始交付微服务时，你是否在传统服务器上以单独进程运行它们？进程隔离足够吗？如果一个
    JVM 变得疯狂并占用了 100% 的 CPU 会怎样？或者网络 I/O？或共享磁盘？如果该主机上运行的所有服务都崩溃了怎么办？你的应用程序是否考虑了这些？


    ### 不可变部署


    不可变部署概念有助于我们思考这些问题。


    在不可变部署中，我们尝试在构建过程中将更多的活动部分减少到预制镜像中。例如，想象在你的构建过程中可以输出一个包含操作系统、预期的 JVM 版本、任何侧车应用程序以及所有配置的完整镜像。然后你就可以将其部署在一个环境中，进行测试，并沿着交付流水线迁移到生产环境，而无需担心环境或应用程序配置是否一致。


