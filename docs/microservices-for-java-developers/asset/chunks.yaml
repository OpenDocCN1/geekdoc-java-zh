    or service, if the liveness probe (which could also be a simple HTTP endpoint)
    starts to indicate an unhealthy state (e.g., HTTP 500 errors), Kubernetes can
    automatically kill the pod and restart it.


    In the *deployment.yml* file shown earlier we declared both of these, with livenessProbe
    and readinessProbe:


