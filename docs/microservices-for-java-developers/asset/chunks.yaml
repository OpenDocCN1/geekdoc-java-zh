    microservice that may have different packaging requirements (JVM? Node.js? Golang?
    properties files?


    private keys?), we could easily see an explosion of VM images and combinations
    of language runtimes. If you automate this with infrastructure as code and have
    access to infrastructure as a service with properly exposed APIs, you can certainly
    accomplish this. In fact, building up VMs as part of an automated delivery pipeline
    is exactly what Netflix did to achieve this level of immutable delivery. But it
    can be hard to manage, patch, and change multiple VMs, each of which virtualizes
    an entire machine with required device drivers, operating systems, and management
    tooling.


    What other lightweight packaging and image formats can we explore?


    **Docker and Linux Containers**


    [Docker came along a few years ago with an elegan](https://dockr.ly/2BGgHKD)t
    solution to immutable delivery. Docker allows us to package our applications with
    all of the dependencies they need (OS, JVM, other application dependencies, etc.)
    in a lightweight, layered image format. It uses these images to run instances
    that run our applications inside Linux containers with isolated CPU, memory, network,
    and disk usage. In a way, these containers are a form of *application virtualization*
    or *process virtualization*. They allow a process to execute while thinking it’s
    the only thing running (e.g., list processes with ps and you see only your application’s
    process there) and that it has full access to the CPUs, memory, disk, network,
    and other resources, when in reality, it doesn’t. Each application can only use
    the resources it’s allocated. For example, I can start a Docker container with
    a slice of CPU, a segment of memory, and limits on how much network I/O it **Docker
    and Linux Containers | 63**


    can perform. From outside the Linux container, on the host, the application just
    looks like another process. No virtualization of device drivers, operating systems,
    or network stacks, no special hypervisors—it’s just a process. This fact also
    means we can get even more applications running on a single set of hardware for
    higher density without the overhead of additional operating systems and other
    pieces of a VM that would be required to achieve similar isolation qualities.


    What’s happening under the covers is nothing revolutionary either.


    Features called *cgroups*, *namespaces*, and chroot, which have been built into
    the Linux kernel for some time, are used to create the appearance of this application
    virtualization. Linux containers have been around for over 10 years, and process
    virtualization existed in Solaris and FreeBSD even before that. Traditionally,
    using these underlying Linux primitives, or even higher-level abstractions like
    lxc, was complicated at best. Then Docker came along and simpli-fied the API and
    user experience around Linux containers. Its client CLI that can easily spin up
    these containers based on the Docker image format, which has now been opened up
    to the larger community in the Open Container Initiative (OCI). This ease of use
    and image format are changing the way we package and deliver software.


    Once we have an image, spinning up many Linux containers becomes trivial. The
    layers are built as deltas between a base image (e.g., RHEL, Debian, or some other
    Linux operating system) and the application files. Distributing new applications
    just distributes the new layers on top of existing base layers. This makes distributing
    images much easier than shuttling around bloated cloud machine images. Also, if
    a vulnerability (Shellshock, Heartbleed, etc.) is found in the base image, that
    image can be rebuilt without having to try to patch each and every VM. This makes
    it easy to run a container anywhere: containers can be moved from a developer’s
    desk-top to dev, QA, or production in a portable way without having to manually
    ensure or hope that all of the correct dependencies are in the right place (does
    this application use JVM 1.6, 1.7, or 1.8?). If we need to redeploy with a change
    (new app) or fix a base image, doing so just changes the layers in the image that
    require changes.


    When we have standard APIs and open formats, we can build tooling that doesn’t
    have to know or care what’s running in the container. How do we start an application?
    How do we stop it? How do we do health checking? How do we aggregate logs, metrics,
    and **64 | Chapter 5: Deploying Microservices at Scale with Docker and Kubernetes**


    insight? We can build or leverage tooling that does all of these things in a technology-agnostic
    way. Service discovery, load balancing, fault tolerance, configuration, and more
    can also be pushed to lower layers in the application stack so that application
    developers don’t have to try to cobble all this together by hand and complicate
    their application code.


    **Kubernetes**


    Google is known for running Linux containers at scale. In 2014, Google engineer
    Joe Beda said the company started more than two billion containers per week. In
    fact, “everything” running at Google runs in Linux containers, and it’[s all managed
    by their Borg cluster](http://bit.ly/1NARO1l)


    [management platform](http://bit.ly/1NARO1l). Google even had a hand in creating
    the underlying Linux technology that makes containers possible: in 2006 its engineers
    started working on “process containers,” which eventually became cgroups and was
    merged into the Linux kernel code base and released in 2008\. With its breadth
    and background of operating containers at scale, it’s no surprise Google has had
    a strong influence on platforms built around containers. Here are just a few examples:


    • The original Cloud Foundry creators (Derek Collison and Vadim Spivak) worked
    at Google and spent several years using Google’s Borg cluster management solution.


    • Apache Mesos was created for a PhD thesis, and its creator (Ben Hindman) interned
    at Google and had many conversations with Google engineers around container clustering,
    scheduling, and management.


    • [The Kubernetes con](https://kubernetes.io)tainer cluster management platform
    was originally created by the same engineers who built Borg at Google; it was
    open sourced back in 2013 when Docker rocked the technology industry.


    Today, the Kubernetes community is large, open, and rapidly grow-ing with contributors
    from Google, Red Hat, CoreOS, and many other organizations (and lots of independent
    individuals!). Kubernetes brings a lot of functionality for running clusters of
    microservices inside Linux containers at scale. Google has packaged over a decade
    of experience into Kubernetes, and being able to leverage this knowledge and functionality
    for our own microservices deploy-Kubernetes | 65


    ments is game-changing. The web-scale companies have been doing this for years,
    and a lot of them (Netflix, Amazon, etc.) had to hand-build much of the functionality
    that Kubernetes now has baked in.'
