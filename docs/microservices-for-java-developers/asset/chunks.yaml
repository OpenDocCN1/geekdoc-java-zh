    Easy, right?


    **Running Outside of Maven**


    Remember how easy it was to run Spring Boot outside Maven?


    Luckily, with MicroProfile it just takes the exact same few steps to get a microservice
    ready for shipment and production.


    Just like Spring Boot, MicroProfile prefers atomic, executable JARs with all dependencies
    packed into a flat classpath. This means the JAR that we create as part of a call
    to mvn clean package is executable and contains all we need to run our microservice
    in a Java environment! To test this out, go to the root of the *hello-microprofile*
    microservice project and run the following commands:


    $ **mvn clean package**


    $ **java -jar target/demo-thorntail.jar**


    That’s it! Exactly the same approach used by Spring Boot.


    **Calling Another Service**


    In a microservices environment, each service is responsible for providing its
    functionality or service to other collaborators. If we wish to extend the *hello_microprofile*
    microservice, we will need to create a service that we can call using JAX-RS client
    functionality. Just like we did for the Spring Boot microservice, we’ll leverage
    the backend service from the source code that accompanies this report. The interaction
    will look similar to [Figure 3-7.](#index_split_000.html_p52)


    *Figure 3-7\. Cal ing another service*


    If you look a[t the source code for this report, you](http://bit.ly/2T33tS9)’ll
    see a Maven module called backend which contains a very simple HTTP servlet that
    can be invoked with a GET request and query parameters. The code for this backend
    is very simple, and it does not use any of the microservice frameworks (Spring
    Boot, MicroProfile, etc.).


    To start up the backend service on port 8080, navigate to the *backend* directory
    and run the following:


    **46 | Chapter 3: Eclipse MicroProfile for Microservices**


    $ **mvn clean wildfly:run**


    Remember that the *hello-microprofile* service should be stopped before running
    the backend service.


    This service is exposed at */api/backend* and takes a query parameter called greeting.
    For example, when we call this service with the path */api/backend?greeting=Hel
    o*, like this (you can also visit this URL with your browser):


    $ **curl -X GET http://localhost:8080/api/backend?greeting=Hello** We get back
    a JSON object like this:


    {


    **"greeting"** : "Hello from cluster Backend",


    **"time"** : 1459189860895,


    **"ip"** : "172.20.10.3"


    }


    Next, we’ll create a new HTTP endpoint, */api/greeting*, in our *hellomicroprofile*
    microservice and use the JAX-RS Client API to call this backend.


    First, we create a new class in *src/main/java/com/examples/hel omicroprofile*
    called GreeterRestController and fill it in similarly to how we filled in the
    HelloRestController class (see [Example 3-5).](#index_split_000.html_p53)


    *Example 3-5. src/main/java/com/example/hellomicroprofile/rest/*


    *GreeterRestController.java*


    @Path("/api")


    **public** **class** **GreeterRestController** {


    @Inject


    @ConfigProperty(name="greeting.saying", defaultValue = "Hello") **private** String
    saying;


    @Inject


    @ConfigProperty(name = "greeting.backendServiceHost", defaultValue = "localhost")


    **private** String backendServiceHost;


    @Inject


    @ConfigProperty(name = "greeting.backendServicePort", defaultValue = "8080")


    **private** **int** backendServicePort;


    @GET


    **Calling Another Service | 47**


    @Produces("text/plain")


    @Path("greeting")


    **public** String greeting() {


    String backendServiceUrl = String.format("http://%s:%d", backendServiceHost,backendServicePort);


    **return** "Sending to: " + backendServiceUrl


    }


    }


    We’ve created a simple JAX-RS resource here that exposes an */api/*


    *greeting* endpoint that just returns the value of the backendServiceUrl field.
    Also note that we’re injecting the backend host and port as environment variables
    that have default values if no environment variables are set. Again, we’re using
    MicroProfile Config’s @ConfigProperty annotation to accomplish this.


    Let’s also add the BackendDTO class, shown in [Example 3-6](#index_split_000.html_p54),
    which is used to encapsulate responses from the backend.


    *Example 3-6. src/main/java/com/examples/hellomicroprofile/*


    *BackendDTO.java*


    **public** **class** **BackendDTO** {


    **private** String greeting;


    **private** **long** time;


    **private** String ip;


    **public** String getGreeting() {


    **return** greeting;


    }


    **public** **void** setGreeting(String greeting) {


    **this**.greeting = greeting;


    }


    **public** **long** getTime() {


    **return** time;


    }


    **public** **void** setTime(**long** time) {


    **this**.time = time;


    }


    **public** String getIp() {


    **return** ip;


    **48 | Chapter 3: Eclipse MicroProfile for Microservices**


    }


    **public** **void** setIp(String ip) {


    **this**.ip = ip;


    }


    }


    Next, let’s add our JAX-RS client implementation to communicate with the backend
    service. I[t should look like Example 3-7](#index_split_000.html_p55).


    *Example 3-7\. src/main/java/com/example/hel ospringboot/*


    *GreeterRestControl er.java*


    @Path("/api")


    **public** **class** **GreeterRestController** {


    @Inject


    @ConfigProperty(name="greeting.saying", defaultValue = "Hello") **private** String
    saying;


    @Inject


    @ConfigProperty(name = "greeting.backendServiceHost", defaultValue = "localhost")


    **private** String backendServiceHost;


    @Inject


    @ConfigProperty(name = "greeting.backendServicePort", defaultValue = "8080")


    **private** **int** backendServicePort;


    @GET


    @Produces("text/plain")


    @Path("greeting")


    **public** String greeting() {


    String backendServiceUrl = String.format("http://%s:%d", backendServiceHost,backendServicePort);


    System.out.println("Sending to: " + backendServiceUrl); Client client = ClientBuilder.newClient();


    BackendDTO backendDTO = client.target(backendServiceUrl)


    .path("api")


    .path("backend")


    .queryParam("greeting", saying)


    .request(MediaType.APPLICATION_JSON_TYPE)


    .get(BackendDTO.class);


    **return** backendDTO.getGreeting()


    + " at host: " + backendDTO.getIp();


    }


    **Calling Another Service | 49**


