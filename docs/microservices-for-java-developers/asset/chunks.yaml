- fmt: '

    Kubernetes has a handful of simple primitives that you should understand before
    we dig into examples. In this chapter we’ll introduce you to these concepts, and
    in the following chapter we’ll make use of them for managing a cluster of microservices.


    ### Pods


    A `pod` is a grouping of one or more Docker containers (like a pod of whales?).
    A typical deployment of a pod, however, will often be one-to-one with a Docker
    container. If you have sidecar, ambassador, or adapter deployments that must always
    be colocated with the application, `a pod is the way to group them. This abstraction
    is also a way to guarantee affinity`. Kubernetes orchestrates, schedules, and
    manages pods. When we refer to an application running inside Kubernetes, it’s
    running within a pod. A pod is given its own IP address, and all containers within
    the pod share this address (which is different from plain Docker where each container
    gets an IP address). When volumes are mounted to the pod, they are also shared.
    One last thing to know about pods: they are fungible. This means they can disappear
    at any time (either because they crashed or because Kubernetes killed them). They
    are not like VMs, which you care for and nurture. Pods can be destroyed at any
    point. This falls within our expectation in a microservice world that things will
    (and do) fail, so we are strongly encouraged to write our microservices with this
    premise in mind.


    ### Labels


    Labels are simple key/value pairs we can assign to pods, like `release=stable`
    or `tier=backend`. Pods (and other resources, but we’ll focus on pods) can have
    multiple labels that group them in a loosely coupled fashion, making it easier
    to build clusters at scale. After we’ve labeled our pods, we can use `label selectors`
    to find which pods belong in which group. For example, if we had some pods labeled
    `tier=backend` and others labeled `frontend`, using a label selector `tier !=
    frontend` could select all of the pods that are not “frontend.” Label selectors
    are used under the next two concepts: replication controllers and services.


    ### ReplicationControllers and Deployments


    When talking about running microservices at scale, we will probably be talking
    about multiple instances of any given microservice. Kubernetes has a concept called
    `ReplicationController` that manages the number of replicas for a given set of
    microservices. For example, let’s say we wanted to manage the number of pods labeled
    `tier=backend` and `release=stable`. We could define a `ReplicationController`
    with the appropriate label selector, and we would then be able to control the
    number of pods in the cluster by adjusting the `replicas` field in the definition.
    If we set the replica count equal to `10`, then Kubernetes will reconcile its
    current state to reflect 10 pods running for a given `ReplicationController`.
    If there are only five running at the moment, Kubernetes will spin up five more.
    If there are 20 running, Kubernetes will kill 10 (which kills is nondeterministic,
    as far as your app is concerned). Kubernetes will do whatever it needs to converge
    with the desired state of 10 replicas. You can imagine controlling the size of
    a cluster very easily with `ReplicationController`. Later, the Kubernetes project
    introduced another concept called `Deployment` that watches the configuration
    of the replicas (like environment variables, CPU and memory limits, labels, etc.).
    If you update any of these configurations, Kubernetes will perform a `rolling
    update` to replace the previously declared number of replicas with new ones with
    the new configuration. We will see examples of `Deployments` in action in the
    next chapter.


    ### Services


    The last Kubernetes concept you should understand is the Kubernetes `Service`.
    We’ve seen that `ReplicationControllers` can control the number of replicas of
    a service we have. We also saw that pods die (either crash on their own or be
    killed, maybe as part of a `ReplicationController` scale-down event). Therefore,
    when we try to communicate with a group of pods, we should not rely directly on
    their IP addresses (each pod will have its own IP address), as pods can come and
    go. What we need is a way to group pods to discover where they are and how to
    communicate with them, and possibly load balance against them. That’s exactly
    what the Kubernetes `Service` does. It allows us to use a label selector to group
    our pods and abstract them with a single virtual (cluster) IP that we can then
    use to discover and interact with them. We’ll show some concrete examples in the
    next chapter. With these simple concepts—pods, labels, `ReplicationControllers`,
    and `Services`, we can manage and scale our microservices the way Google has learned
    to (or learned not to). It takes many years and many failures to identify simple
    solutions to complex problems, so we highly encourage you to familiarize yourself
    with these concepts and experience the power of managing containers with Kubernetes
    for your microservices.


    ### Getting Started with Kubernetes


    Docker and Kubernetes are both Linux-native technologies; therefore, they must
    run in a Linux host operating system. If you’re working on a Windows or Mac developer
    machine, in order to take advantage of the great features Docker and Kubernetes
    bring you’ll need to use a guest Linux VM on your host operating system. You could
    download `Docker Machine` and `Toolbox` for your environment, but then you’d need
    to manually install Kubernetes (which can be a little tricky). You could use the
    upstream Kubernetes Vagrant images, but like with any fast-moving, open source
    project, those can change swiftly and be unstable at times. Additionally, to take
    full advantage of Docker’s portability, it’s best to use at least the same kernel
    of Linux between environments, and optimally the same Linux distribution and version.
    What other options do we have?


    ### Minishift


    To get started developing microservices with Docker and Kubernetes, we’re going
    to leverage a free developer tool called `Minishift` (`https://bit.ly/2E3i3zc`).
    `Minishift` is a small tool that runs on a developer’s machine, that contains
    Docker, Kubernetes, and a web console (actually, it runs Red Hat OpenShift, which
    is basically a version of Kubernetes with some other developer self-service and
    application lifecycle management features, but for this book we’ll just be using
    the Kubernetes APIs).


    ### OpenShift


    Red Hat OpenShift 3.x is an Apache v2 licensed open source developer self-service
    platform, `OpenShift Origin` (`http://bit.ly/2EpgiNe`), that has been revamped
    to use Docker and Kubernetes. OpenShift at one point had its own cluster management
    and orchestration engine, but with the knowledge, simplicity, and power that Kubernetes
    brings to the world of container cluster management, it would have been silly
    to try to compete. The broader community is converging around Kubernetes, and
    Red Hat is all in with Kubernetes.

