    **第一章**


    **Java 开发者微微服务**


    **你能从本报告中期待什么？**


    本报告面向对开发微服务感兴趣的 Java 开发者和架构师。我们从高层介绍开始报告，并查看了成功实施微服务架构应具备的基础前提条件。遗憾的是，仅仅使用新技术并不能魔术般解决分布式系统问题。因此，在本章中，我们还探讨了涉及的因素，以及成功公司为让微服务为其服务而做的努力，包括文化、组织结构和市场压力等方面。然后，我们将深入探讨几个实现这些服务的
    Java 框架。配套的源代码仓库可以在 GitHub 上找到（`http://bit.ly/2T33s9`）。在我们亲手实践过之后，我们将停下来喘口气，并讨论围绕部署、集群和故障转移的问题，以及
    Docker 和 Kubernetes 在这些领域提供的解决方案。


