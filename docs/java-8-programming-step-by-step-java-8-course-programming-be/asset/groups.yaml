  mdcn: "\n\n-   IntToLongFunction - 它代表接收一个 int 类型参数并返回一个 long 类型结果的函数。\n-   IntPredicate\
    \ - 它代表接收一个 int 类型参数的谓词（“返回布尔值的函数”）。\n-   IntSupplier - 它代表提供 int 类型结果的供应者。\n\
    -   IntToDoubleFunction - 它代表接收一个 int 类型参数并返回一个双精度浮点数结果的函数。\n-   IntUnaryOperator\
    \ - 它代表对单个 int 类型操作数进行操作并产生一个 int 类型结果。\n-   LongConsumer - 它代表接收一个单个 long 类型参数且不返回结果的操作。\n\
    -   LongFunction<R> - 它代表接收一个 long 类型参数并产生结果的函数。\n-   LongPredicate - 它代表接收一个\
    \ long 类型参数的谓词（“返回布尔值的函数”）。\n-   BinaryOperator<T> - 它代表两个相同类型操作数之间的操作，产生的结果与操作数的类型相同。\n\
    -   ObjDoubleConsumer<T> - 它代表接收一个对象类型且双精度类型的参数且不返回结果的操作。\n-   LongUnaryOperator\
    \ - 它代表对单个 long 类型操作数进行操作并产生一个 long 类型结果。\n-   UnaryOperator<T> - 它代表对操作数进行操作并产生一个与操作数类型相同的结果。\n\
    \n我们现在将通过 Java 8 的示例来演示函数式接口。\n\n\"Predicate<T>\" 接口是一个函数式接口，它有一个 \"test(Object)\"\
    \ 方法，其返回值为 Boolean（布尔值）。被测试的对象应该有一个 \"true\" 或 \"false\" 的结果。\n\n打开你的编辑器并创建一个新文件。\n\
    \n在文件中添加以下代码：\n\n```java\nimport java.util.List;\nimport java.util.Arrays;\nimport\
    \ java.util.function.Predicate;\npublic class TesterProgram {\n    public static\
    \ void main(String[] args[]) {\n        List<Integer> mylist = Arrays.asList(11,\
    \ 12, 13, 14, 15, 16, 17, 18, 19);\n        Predicate<Integer> mypredicate = k\
    \ -> true;\n        // k 是传递给测试 Predicate 接口方法的参数\n        // 无论值 “k” 是什么，该方法将始终返回\
    \ “true”。\n        System.out.println(\"Printing all the specified numbers:\"\
    );\n        // 让我们传递参数 “k\"\n        eval(mylist, k->true);\n        Predicate<Integer>\
    \ p1 = k -> k%2 == 0;\n        // k 已作为参数传递给 Predicate 接口的测试方法\n        // 如果\
    \ k%2 的结果为零，则测试方法将返回 \"true\"。\n        System.out.println(\"Printing all the\
    \ even numbers:\");\n        eval(mylist, k-> k%2 == 0); \n\n        Predicate<Integer>\
    \ p2 = k -> k > 3;\n        // k 已作为参数传递给 Predicate 的测试方法\n        // 如果 “k” 大于\
    \ 13，则测试方法将返回 \"true\"。\n        System.out.println(\"Printing numbers greater\
    \ than 13:\");\n        eval(mylist, k-> k > 13 );\n    }\n    public static void\
    \ eval(List<Integer> mylist, Predicate<Integer> mypredicate) {\n        for(Integer\
    \ k: mylist) {\n            if(mypredicate.test(k)) {\n                System.out.println(k\
    \ + \" \");\n            }\n        }\n        System.out.println();\n    }\n\
    }\n```\n\n一旦你写好了上述代码，请保存文件。你就可以开始执行它。你将观察到如下结果：\n\n# 打印所有指定的数字：\n\n11\n12\n13\n\
    14\n15\n16\n17\n18\n19\n\n图中显示了输出的第一部分。我们得到了指定的所有数字。\n\n输出的第二部分将如下：\n\n打印所有偶数：\n\
    \n12\n14\n16\n18\n\n输出的第二部分如上图所示，它由偶数组成。这些数字是从我们指定的数字列表中选出的。我们使用了一个公式来判断一个数字是否为偶数。\n\
    \n输出的最后部分将如下：\n\n打印大于 13 的数字：\n\n14\n15\n16\n17\n18\n19\n\n输出的最后部分由大于 13 的数字组成。这些数字也是从列表中选出的。注意我们使用的公式：如果检查一个数字是否能被\
    \ 2 整除而没有余数，它就是偶数，否则不是。你已经看到函数式接口在编程中是多么重要的，以及它如何在 Java 8 中实现的。\n\n"
