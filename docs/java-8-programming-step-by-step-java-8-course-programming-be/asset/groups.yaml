  - '[PAGE 15]


    # Chapter 3 - Default methods in Java 8


    Java 8 introduced a new feature in which a default method can be implemented in
    the interface. The idea was introduced for the purpose of backward compatibility,
    meaning that the old interfaces can be used for leveraging the capability of lambda
    expressions in Java 8. A good example is an interface made from collections or
    a list.


    These do not allow the declaration of the “forEach” method, if you add such a
    method, within the implementations of the collections framework. With the introduction
    of Java 8 programming language, this problem has been solved. This language provides
    a default implementation of the method so that the collection/list interface can
    be implemented by default for the method “forEach”. This means that the class
    in which this is supposed will not have to implement the same.'
- md: "\nIt takes the following syntax:\n\n```java\npublic interface Person {\n  \
    \  default void print(){\n        System.out.println(\"My name is Kira!\");\n\
    \    }\n}\n```\n\nIf you write the above program as it is and then run it. You\
    \ will get the following result as the output:\n\n# My name is Kira!\n\n# Multiple\
    \ defaults\n\nIf default functions are implemented in interfaces then a class\
    \ will implement two interfaces, which have the same default methods, will be\
    \ able to solve any ambiguities which arise. Consider the program given below:\n\
    \n```java\npublic interface Person {\n  default void print(){\n    System.out.println(\"\
    My name is Kira!\");\n  }\n}\npublic interface male {\n  default void print(){\n\
    \    System.out.println(\"I am a male!\");\n  }\n}\n```\n\nTo solve the problem,\
    \ we will create a method which will override the default implementation. This\
    \ is shown in the code below:\n\n```java\npublic class car implements person,\
    \ male {\n    default void print(){\n        System.out.println(\"I am a male\
    \ person named Kira!\");\n    }\n}\n```\n\nWe can also solve this by use of the\
    \ \"super\" keyword so as to call the default method of the interface which has\
    \ been specified.\n\nThe code for this is shown below:\n\n```java\npublic class\
    \ human implements person, male {\n    default void print(){\n        person.super.print();\n\
    \    }\n}\n```\n\n# Static Default methods\n\nIn Java 8, static helper methods\
    \ can be used in the interface. This feature was not available before the introduction\
    \ of Java 8. Consider the example given below:\n\n```java\npublic interface person\
    \ {\n    default void print(){\n        System.out.println(\"I am a person!\"\
    );\n    }\n\n    static void run(){\n        System.out.println(\"I am now running!!!\"\
    );\n    }\n}\n```\n\n# Default method example\n\nOpen your editor, either “Notepad”,\
    \ “Netbeans” or “Eclipse” and write the following program:\n\n```java\npublic\
    \ class TesterProgram {\n    public static void main(String args[]){\n       \
    \ Person person = new Human();\n        person.print();\n    }\n}\n\ninterface\
    \ Person {\n    default void print(){\n        System.out.println(\"I am a person!\"\
    );\n    }\n    static void run(){\n        System.out.println(\"I am now running!!!\"\
    );\n    }\n}\n```\n\n```java\ninterface Male {\n    default void print(){\n  \
    \      System.out.println(\"I am a male person!\");\n    }\n}\n\nclass Human implements\
    \ Person, Male {\n    public void print(){\n        Person.super.print();\n  \
    \      Male.super.print();\n        Person.run();\n        System.out.println(\"\
    I am a human!\");\n    }\n}\n```\n\nYou can compile the class and then execute\
    \ it. Observe the result that you get. It should be as follows:\n\nI am a person!\n\
    \nI am a male person!\n\nI am now running!!!\n\nI am a human!\n\n# Chapter 4 -\
    \ Method References\n\nWith method references, we can easily point to a particular\
    \ method by its name. The following are the types of methods which can be pointed\
    \ at:\n\n- Instance methods\n- Static methods\n- Constructors using the “new”\
    \ operator\n\nWe will now give an example of a method reference in Java 8. Open\
    \ your editor of choice and write the following program:\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.List;\npublic class TesterProgram {\npublic static void main(String\
    \ args[]){\nList ns = new ArrayList();\n```\n\n```java\nns.add(\"Kira \");\nns.add(\"\
    Life \");\nns.add(\"Nicholas \");\nns.add(\"Samuel \");\nns.add(\"John \");\n\
    ns.forEach(System.out::println);\n}\n}\n```\n\nThe method `System::out::println`\
    \ has been passed as a static method de-static method reference.\n\nOnce you have\
    \ written the program, run it and then observe the result. It should be as follows:\n\
    \nKira\n\nLife\n\nNicholas\n\nSamuel\n\nJohn\n\n# Chapter 5 - Optional class in\
    \ Java 8\n\nThe Optional class in Java 8 represents a container object which contains\
    \ objects which are not null. In other words, it represents null having absent\
    \ value. It provides various utility methods which can be used to check for values\
    \ which are available or not available, rather than checking for the null ones.\
    \ This class is another new addition in Java 8.\n\nThe class is declared using\
    \ the following syntax:\n\n```java\npublic final class Optional<T>\nextends Object\n\
    ```\n\nThe class has the following methods:\n\n- `boolean equals(Object obj)`\
    \ - Checks on whether the other object is \"equal to\" this option.\n- `Optional<T>\
    \ filter(Predicate<? super T> predicate)` - Checks on whether the present value\
    \ matches the given predicate. If true, it returns an Optional which is describing\
    \ the value, otherwise, it returns an empty Optional.\n- `<U> Optional<U> flatMap(Function<?\
    \ super T,Optional<U>> mapper)` - It checks whether a value is present. If true,\
    \ it applies the provided Optional-bearing mapping function to the value and then\
