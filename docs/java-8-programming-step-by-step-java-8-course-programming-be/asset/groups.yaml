    # Chapter 2 - Setting up the Environment


    You can choose to execute your code online or on your local machine. There are
    numerous websites online which provide you with coding grounds for various programming
    languages, including Java 8. You can choose to visit these sites and then run
    your Java code from there.


    # Setting up the environment locally


    If you are not interested in running your code online, then you can install the
    Java 8 development environment on your local machine. You need to download Java
    Development Kit (JDK) or Java Runtime Environment (JRE) and then install it on
    your machine. Once you have installed this, you can then download the Integrated
    Development Environment (IDE), which in this case is “Netbeans” and then install
    it.'
