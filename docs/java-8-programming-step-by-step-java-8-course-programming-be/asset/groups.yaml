    # Chapter 10 - Streams


    Java 8 introduced a new layer called stream. Streams make it possible for programmers
    to process their data in a declarative manner, similar to what happens in SQL.


    Consider the example SQL statement shown below:


    ```

    SELECT max(age),student_id,student_name FROM Student

    ```


    The query returns the student with the maximum or highest age in the “Student”
    table of the particular database. Notice that the developer needs to perform no
    computation on his or her end. For the case of Java collections framework, the
    developer would have to perform the check repeatedly by use of loops.


    We should be concerned about efficiency when programming. Due to the use of multi-core
    processors, the developer has to come up with a parallel code and this is prone
    to more errors.'
  - '[PAGE 88]


    This issue is the reason why Java 8 introduced the concept of streams, as it solves
    the above problems. Streams make it possible for programmers to process their
    data and leverage multiple architectures in a declarative manner without having
    to write a specific code for doing so.


    They have the following characteristics:


    +   - **Made up of a Sequence of elements** - It provides a group of elements
    arranged sequentially and they are all of the same type. The stream only computes
    the elements when needed, without storing them.


    +   - **They perform automatic Iterations** - The iterations over the elements
    are internally done collections where explicit iteration is required. This is
    done up to the collections in which the explicit iterations are done.'
  - '[PAGE 89]


    +   - Source – The input source for the stream is either the arrays, collections
    or I/O resources.


    **Pipelining** – After stream operations are done, the result is always a stream
    for pipelining purpose. This is an intermediate operation in which an input is
    taken, processed and then the output is returned to the target. The method “collect()”
    is a terminal operation available at the end of the pipelining function and it
    marks the end of a stream.'
