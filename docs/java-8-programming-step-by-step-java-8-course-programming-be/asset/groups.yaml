    \n# Introduction\n\nThe introduction of Java 8 programming language marked a point\
    \ of change and improvement in the experience for programmers. The language brought\
    \ numerous new features which were not available or supported in the previous\
    \ versions of the language and this led to an improved product and greater satisfaction\
    \ on the part of the programmers. The language has solved many problems which\
    \ were experienced when using the previous versions of Java such as in the use\
    \ of Date-Time API.\n\nLambda expression is the core of Java 8 programming. Once\
    \ you understand how to use lambda expressions in your program, you will have\
    \ become an expert in Java 8 programming. However, this doesn't mean that this\
    \ is the only feature introduced by the programming language as there are numerous\
    \ features of the language which will be discussed in this book.\n\n# Chapter\
    \ 1 - Definition\n\nThe initial version of Java 8 programming language was released\
    \ on 18th March 2014. This version of the programming language brought a great\
    \ change and improvement to the historical versions of Java. It introduced a number\
    \ of features which were not supported in the previous versions of Java programming\
    \ language. You might know, or have heard of, the “lambda” expression which was\
    \ first introduced in Java 8.\n\nWith this language, you can create programs which\
    \ support pipeline processing. This version of the language also introduced the\
    \ “Nashorn engine”, which makes it possible for Java developers to execute Javascript\
    \ code while programming in Java. To invoke or call a function you can do it by\
    \ the use of its name, this is in contrast to invoking directly.\n\nThe function\
    \ itself can be used as a parameter, most programmers are used to invoking functions\
    \ by use of the real arguments or the parameters but this is not a necessity in\
    \ Java 8 programming language. The date API was also greatly improved in Java\
    \ 8, meaning programmers get improved functionality for their applications.\n\n\
    The interface for Java 8 applications now has a default method through which it\
    \ can be implemented. The language also introduced new tools into the Java programming\
    \ language, examples of these tools are the ones for the compiler and “jdeps”\
    \ which is used for figuring out the dependencies.\n\nThe above are some of the\
    \ features which we will explore in this book. The language has many features\
    \ and you will meet these as you continue with your reading.\n\nFor now, consider\
    \ the following example:\n\n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
    import java.util.Comparator;\nimport java.util.List;\n\npublic class Tester {\n\
    \    public static void main(String[] args) {\n        List<String> ns1 = new\
    \ ArrayList<>();\n        ns1.add(\"Kira\");\n        ns1.add(\"Life\");\n   \
    \     ns1.add(\"Nicholas\");\n        ns1.add(\"Samuel\");\n\n        Collections.sort(ns1,\
    \ new Comparator<String>() {\n            @Override\n            public int compare(String\
    \ s1, String s2) {\n                return s1.compareTo(s2);\n            }\n\
    \        });\n        System.out.println(ns1);\n\n        List<String> ns2 = new\
    \ ArrayList<>();\n        ns2.add(\"Kira\");\n        ns2.add(\"Life\");\n   \
    \     ns2.add(\"Nicholas\");\n        ns2.add(\"Samuel\");\n\n        Collections.sort(ns2,\
    \ (s1, s2) -> s1.compareTo(s2));\n        System.out.println(ns2);\n    }\n}\n\
    ```\n\nOutput:\n```\n[Kira, Life, Nicholas, Samuel]\n[Kira, Life, Nicholas, Samuel]\n\
    ```\n*(Note: The OCR text for the code block was fragmented; I have reconstructed\
    \ the logical Java structure based on the fragments provided in the source text.)*\n"
