    \        System.out.println(\"My name is Kira!\");\n    }\n}\n```\n\n如果你按照原样编写上述程序并运行它，你将得到以下输出作为结果：\n\
    \n# My name is Kira!\n\n# 多个默认方法\n\n如果接口中实现了默认函数，那么当一个类实现了两个具有相同默认方法的接口时，该类将能够解决任何出现的歧义。考虑下面的程序：\n\
    \n```java\npublic interface Person {\n  default void print(){\n    System.out.println(\"\
    My name is Kira!\");\n  }\n}\npublic interface male {\n  default void print(){\n\
    \    System.out.println(\"I am a male!\");\n  }\n}\n```\n\n为了解决这个问题，我们将创建一个方法来重写默认实现。如下代码所示：\n\
    \n```java\npublic class car implements person, male {\n    default void print(){\n\
    \        System.out.println(\"I am a male person named Kira!\");\n    }\n}\n```\n\
    \n我们也可以通过使用“super”关键字来解决这个问题，以便调用指定接口的默认方法。\n\n该代码如下所示：\n\n```java\npublic class\
    \ human implements person, male {\n    default void print(){\n        person.super.print();\n\
    \    }\n}\n```\n\n# 静态默认方法\n\n在 Java 8 中，可以在接口中使用静态辅助方法。此功能在 Java 8 引入之前是不可用的。考虑下面的示例：\n\
    \n```java\npublic interface person {\n    default void print(){\n        System.out.println(\"\
    I am a person!\");\n    }\n\n    static void run(){\n        System.out.println(\"\
    I am now running!!!\");\n    }\n}\n```\n\n# 默认方法示例\n\n打开你的编辑器（无论是“Notepad”、“Netbeans”还是“Eclipse”并编写以下程序：\n\
    \n```java\npublic class TesterProgram {\n    public static void main(String args[]){\n\
    \        Person person = new Human();\n        person.print();\n    }\n}\n\ninterface\
    \ Person {\n    default void print(){\n        System.out.println(\"I am a person!\"\
    );\n    }\n    static void run(){\n        System.out.println(\"I am now running!!!\"\
    );\n    }\n}\n```\n\n```java\ninterface Male {\n    default void print(){\n  \
    \      System.out.println(\"I am a male person!\");\n    }\n}\n\nclass Human implements\
    \ Person, Male {\n    public void print(){\n        Person.super.print();\n  \
    \      Male.super.print();\n        Person.run();\n        System.out.println(\"\
    I am a human!\");\n    }\n}\n```\n\n你可以编译该类然后执行它。观察你得到的结果。它应该如下：\n\nI am a person!\n\
    \nI am a male person!\n\nI am now running!!!\n\nI am a human!\n\n# 第 4 章 - 方法引用\n\
    \n通过方法引用，我们可以轻松地通过名称指向某个特定的方法。以下是可以被的方法的方法类型：\n\n- 实例方法\n- 静态方法\n- 使用“new”操作符的构造函数\n\
    \n我们现在给出一个 Java 8 方法引用的示例。打开你选择的编辑器并编写以下程序：\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.List;\npublic class TesterProgram {\npublic static void main(String\
    \ args[]){\nList ns = new ArrayList();\n```\n\n```java\nns.add(\"Kira \");\nns.add(\"\
    Life \");\nns.add(\"Nicholas \");\nns.add(\"Samuel \");\nns.add(\"John \");\n\
    ns.forEach(System.out::println);\n}\n}\n```\n\n方法 `System::out::println` 被作为一个静态方法的去静态方法引用传递了。\n\
    \n一旦你写好了程序，运行它并观察结果。它应该如下：\n\nKira\n\nLife\n\nNicholas\n\nSamuel\n\nJohn\n\n#\
    \ 第 5 章 - Java 8 中的 Optional 类\n\nJava 8 中的 `Optional` 类表示一个容器对象，该对象包含非空对象。换句话说，它代表\
    \ `null` 的缺失值。它提供了各种实用方法，可以用于检查值是否可用，而不是检查 `null` 值。该类是 Java 8 的另一个新新增特性。\n\n\
    该类使用以下语法进行声明：\n\n```java\npublic final class Optional<T>\nextends Object\n```\n\
    \n该类具有以下方法：\n\n- `boolean equals(Object obj)` - 检查另一个对象是否“等于”此选项。\n- `Optional<T>\
    \ filter(Predicate<? super T> predicate)` - 检查当前值是否匹配给定的谓词。如果为真，它返回一个描述该值的 `Optional`，否则返回一个空的\
    \ `Optional`。\n- `<U> Optional<U> flatMap(Function<? super T,Optional<U>> mapper)`\
    \ - 它检查值是否存在。如果为真，它应用提供的带有 `Optional` 的映射器。\n- `T get()` - 检查值是否存在。如果为真，返回该值。\n\
    - `boolean isPresent()` - 检查 Optional 中是否存在值。\n- `void ifPresent(Consumer<? super\
    \ T> consumer)` - 如果值存在，则调用消费者。\n- `int hashCode()` - 返回 `Optional` 的哈希值。\n- `String\
    \ toString()` - `Optional` 的空字符串表示。\n- `static Optional<T> of(T value)` - 返回指定值的\
    \ `Optional`。\n- `static Optional<T> nullable(T value)` - 返回指定值的 `Optional`，如果值为\
    \ `null` 则返回空 `Optional`。\n- `T orElse(T other)` - 如果值存在则返回该值，否则传递默认值。\n- `T orElseThrow(Supplier<?\
    \ extends T> supplier)` - 如果存在则返回该值，否则抛出异常。\n- `<U> Optional<U> map(Function<?\
    \ super T, ? extends U> mapper)` - 如果值存在，则应用映射函数并返回描述结果的 `Optional`。\n\n`Optional`\
    \ 类继承了 `lang.Object` 类的方法。\n\n我们现在需要通过程序来演示这一点。只需打开编辑器并编写以下内容：\n\n```java\nimport\
    \ java.util.Optional;\npublic class TesterProgram {\n    public static void main(String\
    \ args[]){\n        TesterProgram tester = new TesterProgram();\n        Integer\
    \ v1 = null;\n        Integer v2 = new Integer(20);\n        //Optional.Nullable\
    \ - 传递的参数可以为null\n        Optional<Integer> in = Optional.ofNullable(v1);\n  \
    \      //Optional.of - 如果参数为null将抛出 \"NullPointerException\"\n        Optional<Integer>\
    \ in2 = Optional.of(v2);\n\n        System.out.println(tester.sum(in,in2));\n\
    \    }\n    public Integer sum(Optional<Integer> in, Optional<Integer> in2){\n\
    \        //Optional.isPresent - 检查值是否存在\n        System.out.println(\"The first\
    \ parameter has been provided: \" + in.isPresent());\n        System.out.println(\"\
    The second parameter has been provided: \" + in2.isPresent());\n        //Optional.orElse\
    \ - 如果存在则返回该值，否则传递默认值\n        Integer v1 = in2.orElse(new Integer(0));\n    \
    \    //Optional.get - 这将获取值且它必须可用\n        Integer v2 = in2.get();\n        return\
    \ v1 + v2;\n    }\n}\n```\n\n一旦你写好了程序，运行它并观察你得到的输出或结果。它应该如下：\n\n```\nThe first\
    \ parameter has been provided: false\nThe second parameter has been provided:\
    \ true\n40\n```\n\n"
