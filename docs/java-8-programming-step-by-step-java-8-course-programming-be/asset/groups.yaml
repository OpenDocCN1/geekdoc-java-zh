- md: "\n# Chapter 6 - Nashorn Javascript engine\n\nWhen Java 8 was introduced, it\
    \ came with the Nashorn engine which was meant to replace the Rhino Javascript\
    \ that was already in us. The performance of the new engine is better as it offers\
    \ almost twice what was offered in the previous engine.\n\nThe Nashorn engine\
    \ performs a direct compilation of the programmer's code. The compilation is done\
    \ in the memory of the machine and the resulting bytecode is then passed to the\
    \ Java Virtual Machine (JVM). The improved performance shown by this engine is\
    \ due to use of “invokokedynamics” which is a feature which was introduced for\
    \ the first time in Java 7.\n\n## Jjs\n\nThe Nashorn engine introduced in Java\
    \ 8 comes with a new command line tool. This command line is known as “jjs” and\
    \ is used for direct execution of Javascript code.\n\nWe now need to demonstrate\
    \ how the Javascript can be interpreted using this command line. Create a new\
    \ file and give it a name with a “.js” extension. I have given you my file the\
    \ name “test.js”. The extension implies that the file contains Javascript code.\n\
    \nOnce you have saved the file, add the following code to it:\n\n```\nprint('Hello\
    \ there!');\n```\n\nOnce you have added the code, save the file for the second\
    \ time. Open the console and then execute the following command:\n\n## jjs test.js\n\
    \nNotice that the last name of the command is the name that I gave to my Javascript\
    \ file. Make sure that it matches the name of your file without forgetting the\
    \ “js” extension.\n\nAfter executing the command, you should get the following\
    \ output:\n\n```\nHello there!\n```\n\n## Using jjs in an interactive mode\n\n\
    In the previous example, we saved our code in a file and then used \"jjs\" to\
    \ navigate to the location of the file and we then executed it. However, the coding\
    \ and the execution can both be done on the \"jjs\" console. Just open the \"\
    jjs\" console and then execute the following commands:\n\n```\nC:\\JAVA>jjs\n\
    jjs> print(\"Hello there!\")\n```\n\nOnce you have written the last command shown\
    \ above, press the \"Enter\" key and then observe what happens on the console.\
    \ You will observe the following output displayed on the console:\n\n## Hello\
    \ there!\n\nWe have achieved the same result to the previous example but in a\
    \ very simple and much faster way. To quit the “jjs” console, just type the following\
    \ command and then hit the “Enter” key:\n\n```\nquit()\n```\n\nAfter pressing\
    \ the “Enter” key, you will notice that the console will disappear.\n\n## How\
    \ to pass arguments\n\nIt is possible for you to pass arguments or parameters\
    \ within your function in the “jjs” console. Open the prompt and then execute\
    \ the following commands:\n\n```\nC:\\JAVA> jjs -- x y\njjs> print(\"The letters\
    \ are: '\" +arguments.join(\", \" \"))\n```\n\nAfter typing the last command shown\
    \ above, hit the “Enter” key and then observe the effect. The following output\
    \ will be observed on the console:\n\nThe letters are: x, y, z\n\nWe have provided\
    \ the console with three letters of the alphabet, that is, “x\", “y\" and “z\"\
    . These are the arguments in our example. We have then commanded the console to\
    \ concatenate the three arguments by use of the \"join()\" method. The three arguments\
    \ have been joined and then displayed on the console as the result.\n\nThis shows\
    \ that the console is powerful and can be used to perform some complex tasks as\
    \ well as the basic ones.\n\n## How to call Javascript in Java\n\nIn Java 8, it\
    \ is possible for programmers to invoke or call Javascript code and then the interpretation\
    \ will be done in Java. This is done by use of the \"ScriptEngineManager\".\n\n\
    Let us demonstrate this by use of an example.\n\nOpen the text editor of choice\
    \ and then create a new file. Save the file and then add the following code to\
    \ it:\n\n```\nimport javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\
    import javax.script.ScriptException;\n\npublic class TesterProgram {\npublic static\
    \ void main(String args[]){\nScriptEngineManager sEManager = new\nScriptEngineManager();\n\
    ```\n\n```\nScriptEngine nashorn = sEManager.getEngineByName(\"nashorn\");\nString\
    \ nm = \"Kira\";\nInteger rs = null;\ntry {\nnashorn.eval(\"print(\" + nm + \"\
    )\");\nrs = (Integer) nashorn.eval(\"20 + 5\");\n}catch(ScriptException ex) {\n\
    System.out.println(\"Error occurred while executing the script: \" + ex.getMessage());\n\
    }\nSystem.out.println(rs.toString());\n```\n\nAfter writing the program, save\
    \ the file again and then execute it. You can choose to use the \"javac\" compiler.\n\
    \nIn this case, compile the program by typing the following command on the prompt:\n\
    \n```\njavac TesterProgram.java\n```\n\nNotice the name which I have used. It\
    \ should be the name of the file not the class name.\n\nAfter compiling the source\
    \ code, execute it using the following command:\n\n```\njava TesterProgram\n```\n\
