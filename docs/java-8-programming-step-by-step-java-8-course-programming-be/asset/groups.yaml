    \nJava 8 编程语言的引入标志着程序员体验的一个转折点和改进。该语言引入了许多在之前的语言版本中不可用或不支持的新特性，这提升了产品的质量，并极大增强了程序员的满意度。该语言解决了在使用之前的\
    \ Java 版本时遇到的许多问题，例如日期时间 API 的使用问题。\n\nLambda 表达式是 Java 8 编程的核心。一旦你理解如何在程序中使用\
    \ lambda 表达式，你就会成为 Java 8 编程专家。然而，这并不意味着这是该语言引入的唯一特性，书中将讨论该语言的许多特性。\n\n# 第 1 章\
    \ - 定义\n\nJava 8 编程语言的版本于 2014 年 3 月 18 日发布。这个版本的编程语言为 Java 的历史版本带来了重大的变化和改进。它引入了许多之前的\
    \ Java 编程语言版本不支持的特性。你可能知道或听说过 Java 8 中首次引入的“lambda”表达式。\n\n通过这种语言，你可以创建支持流水线处理的程序。该版本的语言还引入了“Nashorn\
    \ 引擎”，使得 Java 开发者在编写 Java 代码时能够执行 Javascript 代码。要调用或调用一个函数，可以使用它的名称，这与直接调用形成对比。\n\
    \n函数本身可以作为参数使用，大多数程序员习惯于使用真实参数或参数来调用函数，但在 Java 8 编程语言中并非如此。日期 API 在 Java 8 中也得到了极大改进，这意味着程序员为他们的应用程序获得了更强大的功能。\n\
    \nJava 8 应用程序的接口现在可以通过默认方法来实现。该语言还向 Java 编程语言中引入了新工具，这些工具的示例包括编译器工具和用于查找依赖关系的“jdeps”。\n\
    \n以上是我们将在书中探索的某些特性。该语言有许多特性，当你继续阅读时将会遇到这些特性。\n\n现在，请考虑以下示例：\n\n```java\nimport\
    \ java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Comparator;\n\
    import java.util.List;\n\npublic class Tester {\n    public static void main(String[]\
    \ args) {\n        List<String> ns1 = new ArrayList<>();\n        ns1.add(\"Kira\"\
    );\n        ns1.add(\"Life\");\n        ns1.add(\"Nicholas\");\n        ns1.add(\"\
    Samuel\");\n\n        Collections.sort(ns1, new Comparator<String>() {\n     \
    \       @Override\n            public int compare(String s1, String s2) {\n  \
    \              return s1.compareTo(s2);\n            }\n        });\n        System.out.println(ns1);\n\
    \n        List<String> ns2 = new ArrayList<>();\n        ns2.add(\"Kira\");\n\
    \        ns2.add(\"Life\");\n        ns2.add(\"Nicholas\");\n        ns2.add(\"\
    Samuel\");\n\n        Collections.sort(ns2, (s1, s2) -> s1.compareTo(s2));\n \
    \       System.out.println(ns2);\n    }\n}\n```\n\n输出：\n```\n[Kira, Life, Nicholas,\
    \ Samuel]\n[Kira, Life, Nicholas, Samuel]\n```\n（注：代码块的 OCR 文本是碎片化的，我已根据原文提供的片段重构了逻辑\
    \ Java 结构。）\n\n"
