  md: '# Chapter 5 - Optional class in Java 8


    The Optional class in Java 8 represents a container object which contains objects
    which are not null. In other words, it represents null having absent value. It
    provides various utility methods which can be used to check for values which are
    available or not available, rather than checking for the null ones. This class
    is another new addition in Java 8.


    The class is declared using the following syntax:


    ```

    public final class Optional<T>

    extends Object

    ```


    The class has the following methods:


    +   - boolean equals(Object obj) - Checks on whether the other object is "equal
    to" this option.

    - Optional<T> filter(Predicate<? super T> predicate)'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Checks on whether the present value matches the given predicate. If true, it
    returns an Optional which is describing the value, otherwise, it returns an empty
    Optional.


    +   - <U> Optional<U> flatMap(Function<? super T,Optional<U>> mapper)


    It checks whether a value is present. If true, it applies the provided Optional-bearing
    mapping function to the value and then it returns the result. Otherwise, it returns
    an empty Optional.


    +   - T get() - It checks on whether a value is present in this Optional. If true,
    it returns the value. Otherwise it throws a “NoSuchElementException” Exception.


    +   - int hashCode() - It looks for the hash code of the present value and then
    it returns it. A zero (0) is returned if no value is present.


    +   - void ifPresent(Consumer<? super T> consumer) - If a value is provided, it
    invokes the specified consumer having the value, otherwise it does nothing.


    +   - boolean isPresent() - It returns “true” if a value is provided, otherwise
    it returns “false”.'
