  md: '# Introduction


    The introduction of Java 8 programming language marked a point of change and improvement
    in the experience for programmers. The language brought numerous new features
    which were not available or supported in the previous versions of the language
    and this led to an improved product and greater satisfaction on the part of the
    programmers. The language has solved many problems which were experienced when
    using the previous versions of Java such as in the use of Date-Time API.


    Lambda expression is the core of Java 8 programming. Once you understand how to
    use lambda expressions in your program, you will have become an expert in Java
    8 programming. However, this doesn''t mean that this is the only feature introduced
    by the programming language as there are numerous features of the language which
    will be discussed in this book.'
