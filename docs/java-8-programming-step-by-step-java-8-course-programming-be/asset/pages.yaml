  md: '# Chapter 8 - Date Time API


    Java 8 introduced a new Date API which brought a solution to the problems experienced
    by use of Date time APIs in the previous versions of Java. The old date API had
    the following issues:


    +   - Poorly designed – It had a Default Date beginning in 1900, months starting
    from 1 and days starting from 0, meaning that there is absence of uniformity.
    Direct methods for operations on a date were very few. With new APIs, there are
    multiple utility functions which can be used for such operations.


    +   - No safety for threads – “java.util.Date” has no safety for threads. This
    meant that the developer had to implement a mechanism for handling concurrency
    when implementing date in his or her application. Current date time APIs had no
    setter methods and were immutable.'
  merge: -1
