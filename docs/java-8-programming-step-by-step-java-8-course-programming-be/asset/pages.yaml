  md: '# Chapter 6 - Nashorn Javascript engine


    When Java 8 was introduced, it came with the Nashorn engine which was meant to
    replace the Rhino Javascript that was already in us. The performance of the new
    engine is better as it offers almost twice what was offered in the previous engine.


    The Nashorn engine performs a direct compilation of the programmer''s code. The
    compilation is done in the memory of the machine and the resulting bytecode is
    then passed to the Java Virtual Machine (JVM). The improved performance shown
    by this engine is due to use of “invokokedynamics” which is a feature which was
    introduced for the first time in Java 7.'
