  md: '# Chapter 7 - Functional Interfaces in Java 8


    Functional interfaces are a kind of interface that exhibits only a single functionality.
    An example of this is an interface which uses the method “compareToTo” so as to
    compare the values of two variables. There are numerous functional interfaces
    in Java 8 which are mostly used in Lambda expressions.


    These functional interfaces are defined in the package “java.util.Function” and
    they include the following:


    +   - LongBinaryOperator - It represents the operation between two operands which
    are long-valued and which give a long-valued result.


    +   - BiFunction<T,U,R> - It represents the function which accepts two arguments
    and then produces some result from the arguments.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '+   - BiPredicate<T,U> - It represents the predicate (boolean-valued function)
    having two arguments.


