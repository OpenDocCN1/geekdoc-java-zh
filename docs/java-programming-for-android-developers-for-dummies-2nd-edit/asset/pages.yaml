    The first two sets value of operatorSymbol and result in prepara-

    tion for displaying these values on the user''s screen. The third statement

    (the break statement) jumps out of the entire switch statement, skipping past

    the other case clauses and past the default clause to get to the last part of
    the

    program.


    After the switch statement, the statements


    ```

    operatorView.setText(operatorSymbol);

