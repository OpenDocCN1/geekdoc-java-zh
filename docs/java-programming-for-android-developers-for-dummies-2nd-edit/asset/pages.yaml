    identifies that particular piece of information. (Every value has to have a key.
    Otherwise, if you''ve stored several different values in your app''s shared preferences,
    you have no way to retrieve any particular value.)


    In Listing 14-2, call putInt to store an int value in shared preferences. Android''s
    Editor (an inner class of the SharedPreferences class) has methods such as putInt,
