  md: '# THE 01000001 01000010 0100011S


    What does 01001010 have to do with the number 74 or with the letter J?


    The answer for 74 involves the binary number representation. The familiar base-10
    (decimal) system has a 1 column, a 10s column, a 100s column, a 1000s column,
    and so on. But the base-2 (binary) system has a 1s column, a 2s column, a 4s column,
    an 8s column, and so on. The figure shows how you get 74 from 01001010 using the
    binary column values.


    ![](img/95a31530e90066e5e41d72a5efed3158_150_0.png)


    The connection between 01001010 and the letter J might seem more arbitrary. In
    the early 1960s, a group of professionals devised the American Standard Code for
    Information Interchange (ASCII). In the ASCII representation, each character takes
    8 bits. You can see the representations for some of the characters in the sidebar
    table. For example, our friend 01001010 (which, a binary number, stands for 74)
    is also the way Java stores the letter J. The decision to make A 01000001 and
    make J 01001010 has roots in the 20th century''s typographic hardware. (To read
    all about this, visit http://citeeseer.ist.ps.edu/viewdoc/summary?doi=10.1.9.678)


    In the late 1980s, as communication led to increasing globalization, a group of
    experts worked on an enhanced code with up to 32 bits for each character. The
    lower Unicode bits have the same meanings as the ASCII code, but with so many
    more bits, the Unicode standard has room for languages other than English. A Java
    char value is a 16-bit Unicode number, which means that, depending on the way
    you interpret it, a char is either a number between 0 and 65535 or a character
    in one of the many Unicode languages.


    In fact, you can use non-English characters for identifiers in a Java program.
    The sidebar figure shows an Android program with identifiers in Yiddish.


    (continued)


    CHAPTER 5 Java''s Building Blocks 137'
