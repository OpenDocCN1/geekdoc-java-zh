  md: 'I''ve never tried twitter .com URL in either the Website or Callback URL fields,
    but I suspect that typing twitter .com URL doesn''t work.


    To communicate with Twitter via an Android app, you need a callback URL. In other
    words, for this chapter''s example, the callback URL isn''t optional. Neither
    the Website field nor the Callback URL field has to point to a real web page.
    But you must fill in those two fields.


    The Callback URL field isn''t marked as being required. Nevertheless, you must
    type a URL in the Callback URL field.


    # 4. After agreeing to the terms, and doing the other stuff to prove that you''re
    a good person, create The Twitter Application button.


    Doing so brings you to a page where you manage your new application. The page
    has four tabs, labeled Details, Settings, Keys and Access Tokens, and Permissions.


    # 5. Near the top of the page, select the Permissions tab.


    # 6. On the Permissions page, look for a choice of access types. Change your app''s
    access from Read and Write (the default) to Read, Write and Access Direct Messages.


    For this application, you select Read, Write and Access Direct Messages — the
    most permissive access model that''s available. This option prevents your app
    from hitting brick walls because of access problems.


    When you develop a real-life application, do the opposite of what I suggest in
    this step. For a real-life app, select the least permissive option that suits
    your application''s requirements.


    First change your app''s access level, and then create the app''s access token
    (explained in Step 9). Don''t create the token before changing the access level.
    If you change the access level after you''ve created the access token, your app
    won''t work. Worse''s worse, Twitter''s setup page doesn''t show you the problem.
    Believe me — I''ve wasted hours of my life on this Twitter quirk.


    # 7. Click the button that offers to update your application''s settings.


    Doing so changes your app''s access level to Read, Write and Access Direct Messages.


    # 8. Near the top of the page, select the Keys and Access Tokens tab.


    You can find a few buttons on that page.


    # 9. Click the button that offers to create your access token.


    After doing so, your app''s Keys and Access Tokens tab displays your app''s access
    token and the access token secret, in addition to your app''s access level, consumer
    key, and consumer secret.'
