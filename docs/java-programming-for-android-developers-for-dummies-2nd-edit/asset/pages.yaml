  md: "In an onCreate method, the call super.onCreate(savedInstanceState) sends savedInstanceState\
    \ to the parent class's onCreate method. In Listing 10-11, the parent class is\
    \ the AppCompatActivity class. So Java calls the AppCompatActivity's onCreate\
    \ method.\n\nThe AppCompatActivity class's onCreate method contains its own call\
    \ to super.onCreate(savedInstanceState). The AppCompatActivity class's parent\
    \ is the FragmentActivity class. Java passes savedInstanceState to the FragmentActivity's\
    \ onCreate method. And so on.\n\nIt's not until you get to the Activity class\
    \ — your MainActivity's great-grandparent — that the code makes use of the savedInstanceState\
    \ variable. From this savedInstanceState information, the code puts the activity\
    \ back the way it was before the system destroyed it.\n\n![](img/95a31530e90066e5e41d72a5efed3158_306_0.png)\n\
    \n# Casting, again\n\nTo find out why poor activity may have been destroyed, see\
    \ Chapter 4.\n\nWhen you call findViewById, Java doesn't know what kind of view\
    \ it will find. The findViewById method always returns a View instance, but lots\
    \ of Android's classes extend the View class. For example, the classes Button,\
    \ TextView, ImageView, Checkbox, Chronometer, and RatingBar extend Android's View\
    \ class. If you type the following code:\n\n```\n// DON'T DO THIS!!\n\nTextView\
    \ textView;\n\textView = findViewById(R.id.textView);\n```\n\nJava lets out a\
    \ resounding, resentful roar: \"How dare you assume that the object returned by\
    \ a call refers to an instance of the TextView class! (Actually, Java quickly\
    \ and displays an incompatible types message in Android Studio's editor. But I\
    \ like to personify Java as though it's a stern taskmaster.)\n\nIn Chapter 6,\
    \ narrowing means assigning a long value to an int value. A long value has 64\
    \ bits, and an int value has only 32 bits. The attempt at narrowing fails. In\
    \ this section, bad findViewById is another attempt to narrowing — assigning the\
    \ View value returned by a method call to a TextView variable. The TextView class\
    \ is a subclass of the View class, so the assignment fails miserably."
