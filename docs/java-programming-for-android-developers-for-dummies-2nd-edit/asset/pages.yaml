    \ The BagOfCheese class in Listing 9-1 has four fields, and each of the four fields\
    \ has a name: kind, weight, daysAged, or isDomestic.\n\nLike an inline, a java\
    \ class describes items by listing the characteristics of each of the items. Both\
    \ the form in Figure 9-1 and the code in Listing 9-1 essentially tell the same\
    \ thing: Each bag of cheese has a certain kind of cheese, a certain weight, a\
    \ number of days that the cheese was aged, and a domestic-imported characteristic.\n\
