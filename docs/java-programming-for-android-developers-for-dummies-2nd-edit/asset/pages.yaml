  md: 'In contrast, the code in Listing 9-1 contains this line:


    ```

    double weight;

    ```


    This tells Java that every bag of cheese has a characteristic named weight and
    that a bag''s weight must be of type double. Similarly, each bag''daysAged value
    is an int, each bag''sDomestic value is boolean, and each bag''s kind value has
    the type String.


    The unfortunate pun in the previous paragraph makes life more difficult for me,
    the author! A Java String has no to do with the kind of cheese that peels into
    strings. A Java String is a sequence of characters, like these "Cheddar" or the
    sequence "qwohaslsjsal" or the sequence "GotheMoon!" The String kind in Listing
    9-1 indicates that a bag of cheese might contain "Cheddar", but it might also
    contain "qwohaslsjsal" or "GotheMoon!" Well, that''s what happens when Andy starts
    a business from scratch.


    If you look at Listing 9-1, you may notice my literal use of word public. By declaring
    the Bag class, I decided everything should be public. The class itself is public,
    kind field is public, the weight field is public, and so on.


    When you declare a class, you don''t have to make it public. But in this chapter''s
    examples, the keyword public helps a lot. To find out why, see the section "Java''s
    Modifiers."


    In an online form, fields are places where the user types text. And in a Java
    class such as the class in Listing 9-1, variables such as kind, weight, daysAged,
    and isDomestic are fields. In this section, I emphasize the similarity between
    a form''s fields and a Java class''s fields. Don''t mistake form fields for class
    fields. Form fields and Java class fields are two different kinds of things. A
    form''s field may or not be associated with a Java class''s variable. And a Java
    class''s field may or not have an appearance on any device''s screen.


    # What is an object?


    At the start of this chapter''s detailed Cheese Emporium exposé, Andy having no
    name except an online form — the form in Listing 9-1. Life was simple for Andy
    and his dog Fido. But eventually the suppliers delivered bags of cheese. Sud-denly,
    Andy had more than just an online form — he had whose character-matches the fields
    in the form. One bag had the characteristics shown in Figure 9-2; another bag
    had the characteristics shown in Figure 9-3.


    In the terminology of object-oriented programming, each bag of cheese is an object,
    and each bag of cheese is an instance of the class in Listing 9-1.


