  md: '# Why Java Methods Are Like Meals

    at a Restaurant


    I''m a fly on the wall at Mom''s Restaurant in a small town along Interstate 80.

    I see everything that goes on Mom''s: Mom toils year after year, fighting against
    the influx of high-volume, low-quality restaurant chains while the old-timers
    remain faithful to Mom''s menu.


    I see you walking into Mom''s. Look — you''re handling Mom a job application.

    You''re probably a decent cook. If you get the job, you''ll get carefully typed
    copies of one of the restaurant''s recipes. Here''s one:


    # Scrambled eggs (serves 2)


    +   - 5 large eggs, beaten

    - ¼ cup shredded milk

    - 1 cup shredded mozzarella

    - Salt and pepper to taste


    In a medium bowl, combine eggs and milk. Whisk until the mixture is smooth, and
    pour into preheated frying pan. Cook on medium heat, stirring the mixture frequently
    with a spatula. Cook for 2 to 3 minutes or until eggs are about halfway cooked.
    Add salt, pepper, and garlic powder. Add cheese a little at a time, and continue
    stirring. Cook for another 2 to 3 minutes. Serve.


    Before your first day at work, Mom sends you home to study recipes. But she sternly
    warns you not to practice cooking. “Save all your energy for your first day,”
    she says.


    On your first day, you don an apron. Mom rotates the sign on the front door so
    that the word Opens the street. You quietly sit by the stove, drumming your fingers.
    Mom sits by the cash register, trying to look nonchalant. (After 25 years in business,
    she still worries that the morning regulars won''t show up.)


    At last! Here comes Joe the barber. Joe orders the breakfast special with two
    scrambled eggs.'
