  md: 'Inside a constructor method, a parameter shadows identically named field. So,
    outside the constructor declaration, the word kind refers to the field name. Inside
    the constructor declaration, however, the word kind refers only to the parameter
    name. In the horrible code with duplicate names, the statement


    ```

    kind = kind;

    ```


    does nothing to the kind field. Instead, this statement tells Java to make the
    kind parameter refer to the same string that the kind parameter already refers
    to.


    If this explanation sounds like nonsense to you, it is.


    The kind variable in the constructor''s parameter list is local to the constructor.
    Use of the word kind outside the constructor cannot refer to the constructor''s
    local kind variable.


    Fields are different. You can refer to a field anywhere in the class''s code.
    For example, in Listing 9-8, the second constructor has no local kind variable
    of its own. Inside that constructor''s body, the word kind refers to the class''s
    field.


    One or another, the second constructor in Listing 9-8 is cumbersome. Do you have
    to make peculiar names like kind for a constructor''s parameters? No, you do not.
    To find out why, see the "This is it!" section, in this chapter.


    # # default constructor


    I don''t see any constructors in Listing 9-1. So why can I make a constructor
    call (the new BagOfCheese()) in Listing 9-2? I can call new BagOfCheese() without
    explicitly adding text to the code in Listing 9-1, Java simply creates a parameterless
    constructor for me.


    Listing 9-8 is different. If I didn''t explicitly type the parameterless constructor
    in my code, Java wouldn''t have created a parameterless constructor for me. A
    call to new BagOfCheese() with no parameters would be illegal. If I add a new
    BagOfCheese() call, Android Studio''s editor would tell me that BagOfCheese()
    cannot be applied. Sounds bad? Does it?


    Here''s how it works: When you declare a class, Java creates a parameterless constructor
    (known formally as a default constructor) and, only if, you haven''t explicitly
    declared any constructors in your class''s code. When Java encounters Listing
    9-1, Java automatically adds a parameterless constructor to your BagOfCheese class.
    But when Java encounters Listing 9-8, with its 4-parameter'
