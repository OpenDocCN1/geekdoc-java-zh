  md: 'What you see in the Editor depends on the kind of file that you''re editing:


    +   When you edit a Java program file, the editor displays the file''s text.

    (Refer to Figure 2-7.)


    You can cut, copy, and paste text as you would in other editors.


    The text editor can have several tabs. Each tab contains a file''s open for editing.
    To open a file for editing, double-click the file''s branch in the Project tool
    window. To close the file, click the x next to the file''s name in the Editor
    tab.


    +   When you edit a layout file, the Editor displays the Designer tool.


    A typical Android app contains one or more layout files. A layout file describes
    the buttons, text fields, and other components that appear on a device''s when
    a device runs your app. A layout file isn''t written in Java.


    The Designer tool presents a visual representation of the layout file to help
    you arrange app''s buttons, text fields, and other components.


    For a careful look at Android Studio''s Designer tool, see Chapter 3.


    Continuing your tour of the areas in Figure 2-7 . . .


    ![](img/95a31530e90066e5e41d72a5efed3158_59_0.png)


    # The lower area


    Below the Project tool window and the editor is another area that contains several
    tool windows. The tool window you use most often is the Android Monitor window.
    (Refer to the lower portion of Figure 2-7.)


    The Android Monitor window displays information about the run of an Android app.
    This tool window appears automatically when your app starts running on an Android
    device.


    An Android device isn''t necessarily a real phone or a real tablet. Your development
    computer can calculate the behavior of an Android device. For details, see this
    chapter''s later section "Creating an Android virtual device."


    ![](img/95a31530e90066e5e41d72a5efed3158_59_1.png)


    The Android Monitor window has the Logcat, the Monitors pane, and possibly others.
    (Note the tabs with labels earlier, in Figure 2-7.) The pane that I find most
    useful is the Logcat pane. In the Logcat pane, you see all messages logged by
    the Android device that''s running your app. If your app isn''t running correctly,
