  md: '# Conditions in statements


    The condition in an if statement must be enclosed in parentheses. The condition
    must be a boolean expression — an expression whose value is true or false. For
    example, the following condition is:


    ```

    if (numberOffries < 17) {

    ```


    The strange kind of condition that you can use in other (non-Java) languages —
    languages as C++ — is not okay:


    ```

    if (17) { //This is incorrect.

    ```


    ![](img/95a31530e90066e5e41d72a5efed3158_203_0.png)


    See Chapter 5 for information about Java''s primitive types, including the boolean
    type.


    # Omitting braces


    You can omit an if statement''s curly braces when only one statement appears between
    the condition and the word else. You can also omit braces when only one statement
    appears after the word else. For example, the following chunk of code is proper
    and:


    ```

    if (age < 18 || 65 < age) && !isSpecialShowing)

    price = 7.00;

    else

    price = 10.00;

    ```


    The code is correct because only one statement (price = 7.00) appears between
    the condition and the else, and only one statement (price = 10.00) appears after
    the word else.


    An if statement can also enjoy a full and happy life without an else part. The
    following code snippet contains an assignment statement followed by a complete
    statement:


    ```

    price = 10.00;

    if (age < 18 || 65 < age) && !isSpecialShowing)

    price = 7.00;

    ```


    # Compound statements


    An if statement is one of Java''s compound statements normally contains other
    Java statements. For example, the if statement in Listing 8-1 contains the two
    assignment statements price = 7.00 and price = 10.00.'
