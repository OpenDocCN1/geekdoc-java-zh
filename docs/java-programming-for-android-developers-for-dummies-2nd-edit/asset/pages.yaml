  md: "+   The UI thread: The thread that displays components on the screen\n\nIn\
    \ an Android program, your main activity runs primarily in the UI thread.\n\n\
    The UI in UI thread stands for user interface. Another name for the UI thread\
    \ is the main thread. The use of this terminology predates the notion of a main\
    \ activity in Android.\n\n![](img/95a31530e90066e5e41d72a5efed3158_379_0.png)\n\
    \n+   A background thread: Any thread other than the UI thread\n\nIn an Android\
    \ program, when you create an AsyncTask class, some of that class's code runs\
    \ in a background thread.\n\nIn addition to all the terminology, you should know\
    \ about two rules concerning threads:\n\n+   Any time-consuming code should be\
    \ in a background thread — not in the UI thread.\n\nThis chapter's example reaches\
    \ out on the Internet and posts a tweet or grabs a Twitter user's timeline. As\
    \ a result, the app components might take a noticeable amount of time to come\
    \ to a standstill while the app waits for a response from the Internet. The entire\
    \ user interface is temporarily frozen. The app looks like poorly designed, paralyzed\
    \ robot. You don't want that to happen.\n\n+   Any code that modifies a property\
    \ of the screen must be in the UI thread.\n\nIf, in a background thread, you have\
    \ code that modifies that on screen, you're either gumming up the UI thread or\
    \ creating code that doesn't compile. Either way, you don't want to do it.\n\n\
    # Understanding Android's AsyncTask\n\nA class that extends Android's AsyncTask\
    \ looks like the outline in Listing 13-5.\n\nLISTING 13-5: The Outline of an AsyncTask\
    \ Class\n\n```\npublic class MyAsyncTaskName extends AsyncTask<Type1, Type2, Type3>\
    \ {\n  @Override\n  protected void onPreExecute() {\n    // Execute statements\
    \ in the UI thread before starting background thread.\n    // For example, display\
    \ an empty progress bar.\n  }\n```"
