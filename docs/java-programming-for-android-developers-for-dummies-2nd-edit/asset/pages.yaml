- img_proc: true
  md: 'protein, and i eat these things only at regularly scheduled meals. Sounds sensible,
    doesn''t it?


    I''m making a sincere effort. I''ve been eating right for about two weeks. My
    feelings of health and well-being are steadily improving. I''m only slightly hungry.
    (Actually, by "slightly hungry," I mean "extremely hungry." Yesterday I suffered
    a brief hallucination, believing that my computer keyboard was a giant Hershey''s
    bar. This morning I felt like gnawing on my office furniture. If I start trying
    to pull my mouse, I''ll stop writing and go out for a snack.


    One way or another, the gustatory arena provides many fine metaphors for java
    programming. A method''s declaration is like a recipe. A declaration sits quite,
    doing nothing, waiting to be executed. If you create a declaration but no one
    ever calls your declaration, then — like a recipe for worm stew — your declaration
    goes unexecuted.


    On the other hand, a method call is a call to action — a command to follow the
