  md: '# # Introducing the Hungry Burds Game


    When the game begins, the screen is blank. Then, for a random amount time (averaging
    one second), a Burd fades into view, as shown in Figure 14-1.


    ![](img/95a31530e90066e5e41d72a5efed3158_395_0.png)


    FIGURE 14-1:

    A Burd fades into view.


    If the user does nothing, the Burd disappears after fading into full view. But
    if the user touches the Burd before it disappears, the Burd gets a cheeseburger
    and remains onscreen, as shown in Figure 14-2.


    ![](img/95a31530e90066e5e41d72a5efed3158_395_1.png)


    FIGURE 14-2:

    You''ve fed

    this Burd.


    After ten Burds have faded in (and the unfed ones have disappeared), the screen
    displays a Game Over pop-up message. (See Figure 14-3.)


    Two icons serve as menu items at the top of the screen. If the user selects the
    Info icon, a pop-up message shows the number of fed Burds in the current run of
    the game. The message also shows the high score for all runs of the game. (See
    Figure 14-4.) If the user selects the Rewind icon, the game begins again.'
