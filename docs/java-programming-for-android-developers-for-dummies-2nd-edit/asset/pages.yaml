    # Chapter 12

    Dealing with a Bunch of Things at a Time


    All the world''s a class,

    And all the data, merely objects.

    — JIMMY SHAKESPEARE, 11-YEAR-OLD COMPUTER GEEK


    class is a blueprint for things, and an object is a thing made from the blue-print.
    By thing, I mean a particular employee, an Android activity, or a more ethereal
    element, such as SQLiteOpenHelper.


    Android''s SQLiteHelper class assists developers in the creation of databases.
    An SQLiteOpenHelper doesn''t look like anything in particular, certainly not like
    an employee or a bag of cheese. Nevertheless, SQLiteOpenHelper is a class.


    This chapter covers another thing that you might not consider a class or an object
    — namely, a bunch of things. I use the word bunch, by the way, to avoid the formal
    terminology. (There''s nothing wrong with the formal terminology, but I want to
    save it for this chapter''s official grand opening, in the first section.)'
