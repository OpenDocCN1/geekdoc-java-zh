  md: '+   >> If it isn''t, Java skips the catch clause and moves on to the next catch
    in line.


    +   >> If it is, Java executes the catch clause and then skips all other catch
    clauses that come with this try clause.


    Java goes on and executes whatever statements come after the whole try / catch
    statement.


    Look at this section''s code snippet. Java starts executing the numberOfTweets
    / averagePerDay calculation. If averagePerDay is, the calculation fails and the
    code throws an ArithmeticException. As a result, Java skips the status = statement.
    If there were any other statements between the failed calculation and the catch
    word, Java would skip those statements.


    Java goes directly to the catch clauses, starting with the topmost catch clause.
    The topmost catch clause is for TwitterException instances, dividing by zero doesn''t
    throw a TwitterException. Java marches onward toward the next catch clause.


    The next catch clause is for ArithmeticException instances. When, dividing by
    zero throws an ArithmeticException. Java executes the statement inside that clause.
    Java sets result to the string that R.string.divide_by_zero represents.


    Then Java jumps out of the try / catch statement. Java executes the statement
    immediately after the try / catch statement, adding the end-of-line character
    "\n" to the result string. Java executes any other-statements after the result
    += "\n" statement.


    In the sample code with three catch clauses, the end of chain clauses with an
    Exception e clause. Java''s Exception class is an ancestor of Twitter Exception
    and ArithmeticException and all the other classes. No matter what kind of your
    code throws inside a try clause, that exception matches the Exception catch clause.
    You can always rely on an Exception e clause as a last resort for handling a problem.


