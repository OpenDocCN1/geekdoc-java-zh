  md: '# XML


    If you find View Source among your web browser''s options one day and decide to
    use it, you''ll see a bunch of HyperText Markup Language (HTML) tags. A tag is
    some text, enclosed in angle brackets, that describes something about its neighboring
    content.


    For example, to create boldface type on a web page, a web designer writes


    ```

    <b>Look at this!!</b>

    ```


    The b tags in angle brackets turn boldface type on and off.


    The M in HTML stands for Markup – a general term describing any extra text that
    annotates a document''s content. When you annotate a document''s content, you
    embed information about the content, the code is Look at this! The markup, for
    example, in the previous line of the code, the markup consists of the tags `<b>`
    and `</b>`.


    The HTML standard is an outgrowth of Standard Generalized Markup Language (SGML),
    an all-things-to-all-people technology for marking up documents for all kinds
    of people running all kinds of software and by all kinds of vendors.


    In the mid-1990s, a working group of the World Web Consortium (W3C) began developing
    the Extensible Markup Language, commonly known as XML. The working group''s goal
    was to create a subset of SGML for use in transmitting data over the Internet.
    It succeeded. XML is now a well-established standard for encoding information
    of all kinds.


    For an overview of XML, see the sidebar "All about XML files" in Chapter 3.


    Java is good for describing step-by-step instructions, and XML is good for describing
    the ways they are (or what they should be). A Java program says, "Do this and
