  md: '# Using Permissions


    Some apps require explicit permissions. For example, the app in Chapter 13 talks
    to Twitter''s servers over the Internet. This doesn''t work unless you add a <uses-permission>
    element to the app''s AndroidManifest.xml file:


    ```

    <uses-permission android:name="android.permission.INTERNET"/>

    ```


    If you forget to add the <uses-permission> element to your AndroidManifest.xml
    file, the app can''t communicate with Twitter''s servers. The app fails displaying
    a useful error message. Too bad!


    # The Activity Not Found


    If you create a second activity for your app, you must add a new <activity> element
    in the app''s AndroidManifest.xml file. The element can be as simple as


    ```

    <activity android:name="MySecondActivity"/>

    ```


    but, in most cases, the element is a bit more complicated.


    If you don''t add this <activity> element, Android can''t find the MySecondActivity
    class, even though the MySecondActivity.java file is in the app''s project directory.
    Your app crashes with an ActivityNotFoundException.


    And that makes all the difference.'
  merge: -1
