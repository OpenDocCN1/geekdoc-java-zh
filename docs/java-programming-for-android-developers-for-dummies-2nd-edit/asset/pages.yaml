  md: '# Java''s Primitive Types


    | Type Name | What a Literal Looks Like | Range of Values |

    | --- | --- | --- |

    | Integral types | | |

    | byte | (byte)42 | -128 to 127 |

    | short | (short)42 | -32768 to 32767 |

    | int | 42 | -2147483648 to 2147483647 |

    | long | 42L | -922337203685477508 to 922337203685477807 |

    | Character type (which is, technically, an Integral) | | |

    | char | ''A'' | Thousands of characters, glyphs, and symbols |

    | Floating-point types | | |

    | float | 42.0F | -3.4 × 10³ to 3.4 × 10³ |

    | double | 42.0 or 0.314159e1 | -1.8 × 10³⁰⁸ to 1.8 × 10³⁰⁸ |

    | Logical type | | |

    | boolean | true | true, false |


    You can divide Java''s primitive types into three categories:


    +   ** Integral


    The integral types represent whole numbers — numbers with no digits to the right
    of the decimal point. For example, the number 42 in a Java program represents
    the int value 42, as in 42 cents or 42 clowns or 42 eggs. A family can''t possibly
    have 2.5 children, so an int variable is a good place to store the number of kids
    in a particular family.


    The thing that distinguishes one integral type from another is the range of values
    you can represent with each type. For example, a variable of type int represents
    a number from -2147483648 to +2147483647.


    When you need a number with no digits to the right of the decimal point, you can
    almost always use the int type. Java''s byte, short, and long types are reserved
    for special range needs (and for finicky programmers).'
