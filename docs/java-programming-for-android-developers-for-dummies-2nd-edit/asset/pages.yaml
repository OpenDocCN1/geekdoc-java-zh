    A .zip file is an example of a compressed file. Other examples of compressed archives
    include .tar,.gz files, and .7z files. When you uncompress a file, you extract
    the original files and folders inside the larger archive file. (For a .zip file,
    another for uncompressing is unzipping) Uncompressing normally re-creates the
    folder structure in the archive file. So, after uncompressing my Java4Android_Projects.zip
    file, the hard drive has folders named 02_01, 03_04, with subfolders named gradle,
    build, and app, which in turn contain files named proguard-rules.pro, build.gradle,
    and so on.


    When you download Java4Android_Projects.zip, the web browser may uncompress the
