    # A FIST OF BITS


    If you''re a user, the www.oracle.com/technet.work/java/javase/downloads pages
    offer you a choice between 32-bit and 64-bit Java. The 32-bit alternative might
    have the digits 586 in its name. More sensibly, the 64-bit alternative probably
    has the digits 64 in its name. So the question is, which version of Java should
    you choose?


    If you''re like most computer users, use the 64-bit version of Java. Most computers
    sold in the past several years have 64-bit processors. If you''re not sure which
    version of Java to download, try the 64-bit version.


    Some older computers have 32-bit operating systems. Some newer computers have
    64-bit. If your Windows computer falls into one of these categories, an attempt
    to install 64-bit Java will generate an error message. At best, the message says
    that this installation file isn''t compatible with your version of Windows. At
    worst, the message says that you''re trying to run an app that won''t work. In
    either case, use the 32-bit version of Java.


    If you want to be safe, you can check how many bits your Windows system has. Search
    for Control Panel in order to launch the Control Panel search. In the Control
    Panel''s search field, type About. When you do, Windows offers System as one of
    its alternatives. After choosing this System option, you will see a panel showing
    how many of your computer''s properties. Somewhere in this list of properties,
    you''ll see 32-bit or 64-bit.


    ![](img/95a31530e90066e5e41d72a5efed3158_48_0.png)'
