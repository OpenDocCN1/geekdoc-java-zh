  md: '# Using OAuth


    When you run this chapter''s example, the code has to talk to Twitter on your
    behalf. And normally, to talk to Twitter, you supply a username and password.
    But should you be sharing your Twitter password with any app that comes your way?
    Probably not. Your password is similar to the key to your house. You don''t want
    to give copies of your house key to strangers, and you don''t want an Android
    to remember your Twitter password.


    So how you can post a tweet without having your Twitter password? One answer is
    OAuth, a standardized way to have apps log on to computers.


    The big, ugly strings in Listing 13-3 are OAuth strings. You get strings like
    this from the Twitter website. If you copy the globbledygcode acquires revoke
    permission to act on behalf of the Twitter user. And the app gets hold of the
    user''s password.


    Now, here come the disclaimers:


    +   A discussion of how OAuth works, and why it''s safer than using ordinary passwords,
    is far beyond the scope of this book.


    I don''t pretend to explain OAuth and its mysteries in this chapter.


    +   True app security requires more than what you see in Listing 13-3.


    The goal of this chapter is to show how an app can talk to a social media site.
    In this chapter''s code, I use OAuth and Twitter|commands to achieve that goal
    as quickly as I can, without necessarily showing you the "right" way to do. For
    more comprehensive coverage of OAuth, visit http.tps://oauth.; the official website
    for OAuth developers.


    +   The long strings of characters in Listing 13-3 don''t work.


    I''m prepared to share my OAuth strings with the general public, to create Listing
    13-3, I took the general outline of my real ConfigurationBuilder code and then
    pressed my nose against the keyboard to replace the characters in the OAuth strings.


    To run this chapter''s app, you must create your own set of OAuth keys and copy
    them into your Java code. The last section "Getting OAuth keys and tokens" outlines
    the steps.


    # Making a ConfigurationBuilder


    In Listing 13-3, the chaining of set method calls, one after another, is called
    the builder pattern.'
