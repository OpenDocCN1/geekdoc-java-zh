  md: '# IN THIS CHAPTER

    >> Tweaking your code

    >> Adding new life to old code

    >> Making changes without spending a fortune


    # Chapter 10

    Saving Time and Money:

    Reusing Existing Code


    Wouldn''t it be nice if every piece of software did just what you wanted to do?
    In an ideal world, you could simply buy a program, make it work right away, plug
    it seamlessly into new situations, and update it easily whenever your needs changed.
    Unfortunately, software of this kind doesn''t exist. (Nothing of this kind exists.)
    The truth is that no matter what you want to do, you can find software that does
    some of it, but not all of it.


    This is one reason that object-oriented programming has been successful. For years,
    companies were buying prewritten code only to discover that the code didn''t do
    what they wanted to do. So the companies began messing with the code. Their programmers
    dug deep into the program files, changed variable names, moved subprograms around,
    reworked formulas, and generally made the code worse. The reality was that if
    they didn''t already do what you wanted (even if it did something so close to
    it), you could never improve the situation by mucking around inside the code.
    The best option was to chuck the whole program (expensive as that) and start over.
    What a state of affairs!


    Object-oriented programming has brought about a big change. An object-oriented
    program is, at its heart, designed to be modified. Using correctly written software,
    you can take advantage of features that are already built in, add new features
