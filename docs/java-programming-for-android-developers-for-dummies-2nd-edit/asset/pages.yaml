    # Finding the EditText and TextViewn components


    In Listing 3-2, the line


    ```

    EditText editText;

    TextView textView;

    ```


    alert Java to the fact that you use the names editText and textView in your code.

    The line


    ```

    EditText editText;

    ```


    says that the name editText refers to an EditText type of component (a place

    where the user can type some text). This line might seem redundant, but it''s
    not.

    You can modify the second word on the line like this:


    ```

    EditText userTypesText;

    ```


    But if you make this change, you can change the name EditText in other parts

    of Listing 3-2.


    In Listing 3-2, you can change the name editText to another name, but you can''t

    change EditText (starting with an uppercase E) to another name. In an

    Android program, the name EditText (starting with an uppercase E) stands

    for a place where the user can type a single line of text. Similarly, the name
    Buttonnstands for a button, and TextView stands for a place where Android displays
    text.


    > REMEMBER


    ```

    editText = (EditText) findViewById(R.id.editText);

    ```


    finds the EditText component that you create in the steps in the earlier section

    "Creating the ''look''."


