    To call one of an object''s methods, follow a reference to the object with a dot
    and then the method''s.


    ![](img/95a31530e90066e5e41d72a5efed3158_258_0.png)


    # Members of a class


    Consider the similarity between fields and methods:


    > As I said earlier in this chapter, the "Creating objects" section:


    To refer to one of an object''s fields, follow a reference to the object with
    a dot and then the field''s name.


    > As I said earlier in this chapter, the "Giving an object more responsibility"
    section:


    To call one of an object''s methods, follow a reference to the object with a dot
    and then the method''s.


    The similarity between fields and methods stretches far and wide in object-oriented
    programming. The similarity is so strong that special terminology is necessary
    to describe it. In addition to BagOfCheese object having its own values for the
    four fields, you can think of each object as having its own copy of the toString
    method. So the **BagOfCheese** class in Listing **9-10** has **five members**.
    Four of the members are the fields *kind*, *daysAged*, and *isDomestic*, and the
    remaining member is the *toString* method.


