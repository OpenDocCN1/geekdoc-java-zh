    you can''t write


    ```

    //Don''t do this:

    char theLastLetter = "Z";

    ```


    Even though it contains only one character, the expression "Z" is a String value,
    so you can''t initialize a char variable with the expression "Z".


    # Java''s primitive types


    Java has two kinds of types: primitive and reference. Primitive types are the
    atoms — the basic building blocks. In contrast, reference types are the things
    you create by combining primitive types (and by combining other reference types).


    ![](img/95a31530e90066e5e41d72a5efed3158_153_0.png)


    This chapter (mostly) Java''s primitive types. Chapter 9 introduces Java''s reference
    types.


    ![](img/95a31530e90066e5e41d72a5efed3158_153_1.png)


    Throughout this chapter, I give some attention to Java''s String type. The String
    type in reality belongs in Chapter 9 Java''s String is a reference type, not a
    primitive type. But I can''t wait until Chapter 9 to use strings of characters
    in my examples. So consider this chapter''s String material to be an informal
    (but useful) preview of Java''s String type.


    Table 5-1 describes all eight primitive Java types.'
