    # Java’s wrapper classes


    Chapters 5 and 9 describe primitive types and reference types:


    +   >> Each primitive type is baked into the language.


    Java has eight primitive types.


    +   >> Each reference type is a class or an interface.


    You can define your own reference type. So the number of reference types in Java
    is potentially endless.


    The difference between primitive types and reference types is one of Java’s most
    controversial features. Here’s one of the primitive-versus-reference-type “gotchas”:
    You can’t store a primitive value in an ArrayList. You can write


    ```

    // THIS IS OKAY

    ArrayList<String> list = new ArrayList<>();

    ```


    because String is a reference type. But you can write


    ```

    // DO NOT DO THIS

    ArrayList<int> list = new ArrayList<>();

    ```


    because int is a primitive type. Fortunately, each of Java’s primitives has a
    wrapper type, which is a reference type whose purpose is to contain another type’s
    value. For example, an object of Integer contains a single int value. An object
    of Java’s Double contains a single double value. An object of Java’s Character
    type contains a single character value. You can’t create an ArrayList of int,
    but you can create an ArrayList of Integer values:


    ```

    // THIS IS OKAY

    ArrayList<Integer> list = new ArrayList<>();

    ```


    ![](img/95a31530e90066e5e41d72a5efed3158_338_0.png)


    Every primitive type’s name begins with a lowercase letter. Each of the corresponding
    wrapper types’ names begin with an uppercase letter.'
