    # Java selects a case clause


    When you run the code in Listing 8-2, you can click any of the four buttons. If
    you click the time-sign button, Java looks for a match between the time-sign button''s
    id and the values in the case expressions. Java skips the statements in the case
    R.id.buttonAdd clause then skips the statements in the R.id.buttonSubtract clause.
    The program hits pay dirt when it reaches the case R.id.buttonMultiply clause
    and executes that clause''s statements, making operatorSymbol=\x and making result=numberLeft.
    Then the case R.id.buttonMultiply clause''s break statement makes the program
    skip the rest of the stuff in the switch statement.


    # The default clause


    A switch statement''s optional default clause is a catch for values that don''t
    match any of the case values. You might enhance the calculator app by adding a
    square root button to the activity''s screen then and click to create a case clause
    for the new button. Then, if you run the app and click the square root button,
    Java skips fix any of the case cases and executes the code in the default clause,
    making operatorSymbol=? and making result=0.


    When you create a switch statement, your switch statement doesn''t have to have
    a default clause. If it doesn''t, you probably haven''t planned for all possible
    contingencies. Good planning makes a good, sturdy app, and a good, sturdy gets
    high ratings on Google.


    The last break statement in Listing 8-2 tells you to jump to the end of the switch
    statement, skipping any statements after the default clause. But look again. Nothing
    comes after the default clause in the switch statement! Which statements are being
    skipped? The answer is none. Put a break at the end of the default clause for
    good measure. This extra break statement doesn''t do anything, but it doesn''t
    harm any,


