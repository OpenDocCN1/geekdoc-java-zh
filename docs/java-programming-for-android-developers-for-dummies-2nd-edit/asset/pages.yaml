- img_proc: true
  md: 'The robot continues to stare vacantly because the robot executes only one set
    of instructions at a time. You wave your hands in front of the robot''s glassy
    eyes, but nothing happens. You robot seems to be paralyzed during the long, laborious
    download.


    Life would be better if the robot could perform two threads of execution at once.
    With two threads of execution, the robot would share its time between two different
    of instructions.


    +   1. Visit allmycode.com/JavaAndroid.

    2. Download the code listings.

    3. Uncompress the downloaded file. | 1. Go to the refrigerator.

    2. Pour a glass of orange juice.

    3. Bring the glass to me.


    How would the robot manage to perform two threads of execution at the same time?
    It doesn''t matter how. In one scenario, the robot has two brains and each brain
    works on one of the threads. In another scenario, the robot''s single brain jumps
    back and forth from one thread to the other, devoting a bit of time to one thread,
