  md: "With this modified code (and with view.getId() equal to R.buttonAdd), the program\
    \ sets operatorSymbol to \"+\", sets result to numberLeft + numberRight, sets\
    \ operatorSymbol to \"-\", sets result to numberLeft - numberRight, and, finally,\
    \ breaks out of the switch statement (skipping past all other clauses and the\
    \ default clause). The upshot of the whole thing is that operatorSymbol has the\
    \ value \"-\" (not \"+\") and that result is numberRight - numberLeft + numberRight.\n\
    \nThis phenomenon of jumping from one case to another (in the absence of a break\
    \ statement) is called fall-through, and, sometimes, it's useful. Imagine a dice\
    \ game in which 7 and 11 are instant wins; 2, 3, and sometimes 12 are instant\
    \ losses; and any other number (4 to 10) tells you to continue playing. The code\
    \ for such a game looks like:\n\n```\nswitch (roll) {\ncase 11:\n  message = \"\
    win\"\n  break;\ncase 2:\ncase 3:\ncase 12:\n  message = \"lose\"\n  break;\n\
    case 4:\ncase 5:\ncase 6:\ncase 8:\ncase 9:\ncase 10:\n  message = \"continue\"\
    \n  break;\ndefault:\n  message = \"not a valid dice roll\"\n  break;\n}\n```\n\
    \nIf you roll a 7, you execute all statements immediately after case 7 (of which\
    \ there are none), and then you fall-through to case 11, executing the statement\
    \ that assigns \"win\" to the variable message.\n\nEvery beginning Java programmer\
    \ forgets to put a break statement at the end of a case clause. When you make\
    \ this mistake, don't beat yourself up about it. Just remember what's causing\
    \ your program's unexpected behavior, add break statements to your code, and move\
    \ on. As you experience in Java\n\n![](img/95a31530e90066e5e41d72a5efed3158_208_0.png)"
