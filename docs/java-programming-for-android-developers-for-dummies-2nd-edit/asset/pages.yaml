  md: '# # Constructing Burd


    Android''s ImageView class represents objects that contain images. Normally, you
    put an image file (a .png file, a .jpg file, or a .gif file) in your project res/drawable
    directory, and a call to the ImageView object''s setImage method associates the
    ImageView object with the image file. In Listing 14–2, the following lines fulfill
    this role:


    ```

    ImageView burd = new ImageView();nburd.setImageResource(R.drawable.burd);

    ```


    Because of the R.drawable.burd parameter, Android looks in the project''s app/res/drawable
    directory for a file name burd.png, burd.jpg, or burd.gif.


    ![](img/95a31530e90066e5e41d72a5efed3158_408_0.png)


    You can find burd.png in the stuff you download from this book''s website (www.mycode.com/Java4Android).


    The statement


    ```

    burd.setVisibility(View.INVISIBLE);

    ```


    makes the Burd be completely transparent. The next statement


    ```

    layout.addView(burd);

    ```


    normally makes a component appear on the user''s screen. But with the View. VISIBLE
    property, the Burd doesn''t show up. It''s not until I start the code''s fade-in
    animation that the user begins seeing a Burd on the screen.


    When the user clicks on a Burd, Android calls the onClick method in Listing 14–2.
    The onClick method''s view parameter represents the ImageView object that the
