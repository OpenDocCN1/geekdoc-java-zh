  md: 'When an Android device ends an activity run, the device calls three additional
    methods: the activity''s onPause, onStop, and onDestroy methods. So, complete
    sweep of the activity, from birth to death, involves the run of at least six methods:
    onCreate, then onStart, then onResume, and onPause, and then onStop, and finally,
    onDestroy. As it is with all life forms, "ashes to ashes, dust to dust."


    Don''t despair. For an Android activity, reincarnation is a common phenomenon.
    For example, if you''re running several apps at a time, the device might run low
    on memory. In this case, Android can kill some running activities. As the device''s
    user, you have no idea that any activities have been destroyed. When you navigate
    back to a killed activity, Android re-creates the activity for you and you''re
    none wiser. A call to super.onCreate(savedInstanceState) helps bring things back
    to the way they were before Android destroyed the activity.


    Here''s another fact: When you turn a phone from Portrait mode to Landscape mode,
    the phone destroys the current activity (the activity that''s in Portrait mode)
    and re-creates that same activity in Landscape mode. The phone calls all six of
    the activity''s lifecycle methods (onPause, onStop, and so on) in order to turn
    the activity''s display sideways. It''s similar to starting on the transporter
    deck of the Enterprise and being a different person after being beamed down to
    the planet (except that you act like yourself and think like yourself, so no one
    knows that you''re a completely different person).


    Indeed, methods like onCreate in this book''s examples are the workhorses of Android
    development.'
