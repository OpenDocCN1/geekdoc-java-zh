    \ name of the class, as shown in Listing 9-20.\n\n# LISTING 9-20: Referring to\
    \ a Static Field\n\n```\npackage com.allcode.a09_20;\n\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.widget.TextView;\n\nimport com.allcode.a09_19.BagOfCheese;\n\
