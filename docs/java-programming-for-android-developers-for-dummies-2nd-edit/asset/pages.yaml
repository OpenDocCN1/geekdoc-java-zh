    # Primitive Types and Pass-by Value


    Java has two kinds of types: primitive and reference. The eight primitive types
    are the atoms — the basic building blocks. In contrast, the reference types are
    the things you create by combining primitive types (and by combining other reference
    types).


    I cover Java''s primitive types in Chapter 5, and my coverage of Java''s reference
    types begins in Chapter 9.


    ![](img/95a31530e90066e5e41d72a5efed3158_190_1.png)


    There are two concepts you should remember when you think about primitive types
    and method parameters:


    +   When you assign a value to a variable with a primitive type, you''re identifying
    that variable with the value.


    +   The same is true when you initialize a primitive type variable to a particular
    value.


    +   When you call a method, you''re making copies of each of the call''s values
    and initializing the declaration''s parameters with those copied values.


