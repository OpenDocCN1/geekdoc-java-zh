    In Design mode, shown in Figure 3-10, the Designer tool has five parts:


    +   * The leftmost preview screen is a place to drop new components onto your
    app''s screen.

    * I call this leftmost preview screen the wysiwyg (what you see is what you get)
    preview screen.

    * To the right of the wysiwyg preview screen is the blueprint preview screen.

    * The blueprint screen is good for adjusting the positions of components. However,
    you can drop new components onto both the wysiwyg and blueprint screens. You can
    also adjust the positions of components on both the wysiwyg and blueprint screens.
    Whatever you do to a component on one preview screen automatically changes that
    component on the other preview screen.

    * The palette on the left side of the Designer tool is a place to get the components
    that you drop onto the preview screens.

    * The palette has components such as TextView, Button, CheckBox, and many others.

    * The component tree (immediately below the palette) lists all components on your
    activity''s screen.


    When you create a project and select Empty Activity, Android Studio places a few
    of these components on your activity''s screen. You may have dropped other components
    from the palette.

    Some components can live inside other components. That''s why the component tree
    isn''t a simple list. Instead, it''s a tree with branches within branches.


    +   * The Properties pane on the right displays facts about the components in
    your layout. You can change the layout by modifying the values that you find here.


    In Text mode (shown in this sidebar''s figure), the Designer tool has two parts:


    +   * The left half of the Text mode Designer tool is an editor.


