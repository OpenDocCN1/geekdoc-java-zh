    # Twitter4j API jar file


    Android has no built-support for communicating with Twitter. Yes, the raw materials
    are contained in Android''s libraries, to deal with all of Twitter''s requirements,
    someone has to paste together those raw materials in a useful way. Fortunately,
    several developers have done all the pasting and made their libraries available
    for others. The library that I use in this chapter is Twitter4j. Its website is
    http://twitter4j.org.


    .jar file is a compressed archive containing a useful bunch of Java classes. For
    this chapter''s example to work, your project must include a .jar file containing
    the Twitter4j libraries. If you''ve successfully imported this book''s code into
    Android Studio, the 13_0 project contains the .jar file.


    You can see the contents of a .jar file using WinZip or Stuff Expander or the
    operating system''s built-in unzipping utility. To do so, you may or may not change
    the filename from whatever.jar to whatever.zip.


