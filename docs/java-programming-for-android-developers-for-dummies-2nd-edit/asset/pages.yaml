  md: '# DISPLAYING THINGS ON THE

    DEVICE''S SCREEN


    When you create an Android activity, you fill most of the activity''s screen with
    something called a view group. A view group holds components such as Button components,
    EditText components, TextView components, ImageView components, and other things.
    To make a particular component appear on an activity''s screen, you add that component
    to the activity''s view group.


    The Android API has several kinds of view groups, including these:


    +   * LinearLayout: Arranges components in a line across the screen, or in a column
    down the screen.


    +   * GridLayout: Arranges components in a rectangular grid (that is, in the cells
    of a table whose borders are invisible).


    +   * RelativeLayout: Arranges components by describing their positions relative
    to one another. For example, you can place button2 to the right of button1 or
    make the top of button2 50 pixels below the bottom of button1.


    +   * ConstraintLayout: Has more features than LinearLayout for describing components''
    relative positions. For example, you can center a component in a layout by constraining
    the component to the top, bottom, left, and right of the layout. You can move
    the component from the center by assigning a bias constraint.


    To add a component to a view group, you have two alternatives:


    +   * In a file as activity_main.xml, you can use XML code to describe the component.


    I do that in most of this book''s examples without making a big fuss about it.


    +   * In a file as MainActivity.java, you can use Java code to describe the component.


    I do that in Listing 14-2 because each component (each Bird) appears at a different
    time during the app''s run.


    With Android Studio''s Designer tool, you drag components onto a preview screen.
    When you do, Android Studio composes the activity_main.xml file for you. You see
    the activity_main.xml file''s code when you switch to the Designer''s Text tab.'
