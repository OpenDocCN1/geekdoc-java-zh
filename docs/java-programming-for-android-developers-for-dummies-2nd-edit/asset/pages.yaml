  md: "| Class Name | Characteristic |\n| --- | --- |\n| ArrayList | A resizable array.\
    \ |\n| LinkedList | A list of values, each having a field from bottom to top to\
    \ the next one in the list. |\n Stack | A structure (which grows from top) that's\
    \ optimized for the topmost value. You can easily add a value to the top or remove\
    \ it from the top. |\n Queue | A structure (which grows at one end) that's optimized\
    \ for adding values to one end (rear) and removing values from the other end (the\
    \ front). |\n| PriorityQueue | A structure, like a queue, that lets certain (higher-priority)\
    \ values move toward the front. |\n| HashSet | A collection containing no duplicates.\
    \ |\n| HashMap | A collection of key/value pairs.\n\nEach collection has its own\
    \ set of methods (in addition to the methods that it inherits from AbstractCollection,\
    \ the ancestor of all collection classes).\n\nTo find out which collection best\
    \ meet your needs, visit the Android API documentation pages at http://developer.android.com/reference.\n\
    \n![](img/95a31530e90066e5e41d72a5efed3158_346_0.png)\n\n# # Arrays\n\nIn the\
