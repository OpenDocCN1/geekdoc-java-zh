  md: 'To make a spinner do its job, you create a listener and an adapter.


    # The listener


    A spinner''s listener is much like a button''s listener. It''s a piece of code
    that listens for user actions and responds when an appropriate action occurs.
    (See Chapter 11.)


    In Listing 12-11, I create a listener (an instance of my MySelectedItemListener
    class) and tell Android to notify the listener when the user selects one of the
    spinner''s items:


    ```

    spinner.setOnSelectedItemListener(new MySelectedItemListener());

    ```


    The MySelectedItemListener class''s onItemSelected method must tell Android what
    to do in response to the user''s selection.


    # The adapter


    You may guess that you add an item to a spinner with a call like this:


    ```

    // Don''t do this:

    spinner.addRow("Monteverdi");

    ```


    But that''s not how it works. When an Android developer thinks about a spinner,
    the developer thinks about two different concepts:


    +   A spinner has data.


    In Figure 12-7, the spinner''s data consists of the values "Select a composer",
    "Monteverdi", "Pachelbel", and so on.


    +   A spinner has a "look."


    This section''s spinner has a simple look. In Figure 12-6, the spinner has text
    on the left side and a tiny downward arrow on the right side. In Figure 12-7,
    each of the spinner''s items has on the left side.


    A spinner''s incarnation on the screen (the "look") is an object in and of itself.
    An instance of Android''s Adapter class. A similar-sounding thing, an instance
    of the SpinnerAdapter class, connects a spinner''s data with a spinner''s "look".
    See Figure 12-9.'
