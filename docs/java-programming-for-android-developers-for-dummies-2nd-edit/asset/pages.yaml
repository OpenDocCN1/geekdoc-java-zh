  md: "# All About Android Activities\n\nIf you look in the app/manifests branch in\
    \ Android Studio's Project tool window, you see an AndroidManifest.xml file. The\
    \ file isn't written in Java; it's written in XML. I don't write much about XML\
    \ files in this book. Still, I have to write about an app's manifest file.\n\n\
    Listing 4-5 contains some code from an AndroidManifest.xml file to accompany Listing\
    \ 4-1. With minor tweaks, this code could accompany almost any example in this\
    \ book.\n\n# LISTING 4-5: The Activity element in an AndroidManifest.xml file\n\
    \n```\n<activity android:name=\"MainActivity\">\n  <intent-filter>\n    <action\
    \ android:name=\"android.intent.action.MAIN />\n    <category android:name=\"\
    android.intent.category.LAUNCHER\"/>\n  </intent-filter>\n</activity>\n```\n\n\
    ![](img/95a31530e90066e5e41d72a5efed3158_136_0.png)\n\nFor a quick introduction\
    \ to the niceties of XML code, refer to Chapter 3.\n\nHere's what the code in\
    \ Listing 4-5 \"says\" to your Android device:\n\n> The code's action element\
    \ indicates that the activity that's set forth in Listing 4-1 (the MainActivity)\
    \ is MAIN.\n\nBeing MAIN means that the program in Listing 4-1 is the starting\
    \ point of an app's execution. When a user launches the app described in Listing\
    \ 4-1, the Android device reaches inside the Listing-4-1 code and executes the\
    \ code's onCreate method. In addition, the device executes several other methods\
    \ that do not appear in Listing 4-1.\n\n> The code's category element adds an\
    \ icon to the device's Application Launcher screen.\n\nOn Android devices, the\
    \ user sees the Home screen. Then, by touching one element or another on the Home\
    \ screen, the user gets to see the Launcher screen, which contains several apps'\
    \ icons. By scrolling this screen, the user can find an appropriate app's icon.\
    \ When the user taps the icon, the app starts running.\n\nIn Listing 4-5, the\
    \ category element's value makes an icon for running the MainActivity class available\
    \ on the device's launcher.\n\nCHAPTER 4 An Ode to Code 123"
