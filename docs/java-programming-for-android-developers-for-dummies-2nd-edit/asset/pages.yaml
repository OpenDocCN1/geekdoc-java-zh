  md: '# HOW TO PUT THE CART BEFORE THE HORSE


    To run Android''s app development software, you need software for creating Java
    programs. Normally, you install Java and then you install Android''s app development
    software.


    Of course, you may already have the required Java software on your laptop or desktop
    computer. And Google bundles Java with the Android developer software. You may
    get lucky and download Java and Android in one big gulp.


    So if you''re in a hurry to get started, you can try skipping this "Setting Up
    Java" section and go straight to the section titled "Setting up Android Studio
    and the Android SDK." If you see error messages indicating that Java isn''t installed
    on your computer, come back to this section when you install a fresh, new copy
    of Java.


    ![](img/95a31530e90066e5e41d72a5efed3158_47_0.png)


    Look for the Standard Edition JDK. Don''t bother with the Enterprise Edition or
    any other edition. Don''t bother to give any other software as NetBeans with your
    download. Also, go for the JDK, not the JRE.


    ![](img/95a31530e90066e5e41d72a5efed3158_47_1.png)


    When you visit Oracle''s website, you choose between Java''s JRE download and
    Java''s JDK download. Technically, the JRE has the software that you need in order
    to run Java programs, but not to create Java programs. The JDK has software that
    you need in order to create new Java programs.


    ![](img/95a31530e90066e5e41d72a5efed3158_47_2.png)


    There''s one tiny flaw in the wording on Oracle''s website. The site seems to
    give you a choice between Java''s JRE and Java''s JDK. What the site really offers
    is a choice between downloading only Java''s JRE and downloading both the JRE
    and the JDK. When you choose the JDK option, you get both Java''s JRE and Java''s
    JDK. That''s just fine.


    Figure 2–2 shows you the page that you might see after you click the button in
    Figure 2–1. The page in Figure 2–2 lists several versions of Java, each for a
    different operating system.'
