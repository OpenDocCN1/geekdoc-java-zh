    # The Consumer Perspective


    A consumer considers the alternatives:


    +   >> Possibility #1: No mobile phone


    Advantages: Inexpensive; no interruptions from callers.

    Disadvantages: No instant contact with friends and family; no calls to services
    in case of emergencies.


    +   >> Possibility #2: A feature phone


    This type of mobile phone isn''t a smartphone. Though no official rule defines
    the boundary between feature phone and smartphone, feature phone generally has
    an inflexible menu of Home screen options, compared with a smartphone''s "desktop"
    of downloaded apps.

    Advantage: Less expensive than a smartphone.

    Disadvantages: Less versatile than a smartphone, not nearly as cool as a smartphone,
    and nowhere near as fun as a smartphone.


    +   >> Possibility #3: An iPhone


    Advantages: Great-looking graphics.

    Disadvantages: Little or no flexibility with the single-vendor iOS operating system;
    only a handful of models to choose from.


    +   >> Possibility #4: A Windows phone or another non-Android, non-Apple smartphone


    Advantage: Having a smartphone without having to belong to a crowd.

    Disadvantage: The possibility of owning an orphan product when the smartphone
    was come to a climax.


