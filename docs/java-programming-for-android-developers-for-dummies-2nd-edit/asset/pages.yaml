  md: '# # Introduction


    Android is everywhere. In mid-2016, Android runs on 65 percent of all smartphones
    in the United States, on 75 percent of all smartphones in EU5 countries, and on
    77 percent of all smartphones in China.¹ In a study that spans the Americas, Europe,
    Asia, and the Middle East, GlobalWebindex reports “Android is the most favored
    OS when it comes to tablets, being used by almost a fifth of internet users and
    leading iPad by 5 points.² More than 2.2 million apps are available for download
    at the Google Play store.³ And 9 million developers write code using Java, the
    language that powers Android devices.⁴


    If you read this book in a public place (on a commuter train, the beach, or on
    a dance floor at the Coyote Saloon, for example), you can read proudly, with a
    chip on your shoulder and with your head held high. Android is hot stuff, and
    you''re cool because you''re reading about it.


