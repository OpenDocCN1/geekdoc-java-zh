    \ message is \"win\", it's the end of the if statement. When the message isn't\
    \ \"win\", Java goes on to check whether the message is \"lose\". When the execution\
    \ of these if statements doesn't change either of the talisman' values.\n\n# Some\
    \ formalities concerning Java for statements\n\nA for statement has the following\
    \ form:\n\n```\nfor (initialization ; condition ; update) {\n    statements inside\
    \ the loop\n}\n```\n\n+   * An initialization (such as i = 1 in Listing 8-5) defines\
    \ the action to be taken before the first iteration.\n* A condition (such as i\
    \ <= 100 in Listing 8-5) defines the value to be checked before an iteration.\
    \ If the condition is true, Java executes the iteration, and if the condition\
    \ is false, Java doesn't execute the iteration, and it moves on to execute whatever\
    \ code comes after the statement.\n* An update (such as i++ in Listing 8-5) defines\
    \ an action to be taken at the end of each loop iteration.\n\nYou can omit the\
    \ curly braces when only one statement is inside the loop.\n\n# What's Next?\n\
    \nThis chapter describes several ways to jump from one place in your code to another.\n\
