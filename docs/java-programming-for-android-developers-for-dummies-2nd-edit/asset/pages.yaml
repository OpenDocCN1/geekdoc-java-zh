    +   Each XML document contains a root element — one element in which all other
    elements are nested.


    In Listing 3-2 (a little later in this chapter), the root element is the android.support.constraint.ConstraintLayout
    element. The listing''s other elements (the EditText, Button, and TextView elements)
    are nested inside that android.support.constraint.ConstraintLayout element.


    +   Different XML documents use different element names.


    In HTML document, the <br /> element stands for line break. In XML, names such
    as android.support.constraint.ConstraintLayout and EditText elements are particular
    to Android documents. The names portfolio and trade are particular to financial
    product XML (FpML) documents. The names prompt and pene are peculiar to voice
    XML (VoiceXML). Each kind of document has its own list of element names.


    +   The text in an XML document is case-sensitive.


    For example, if you change EditText to eEDITTEXT in Listing 3-2, you won''t run.


    +   Start and empty element tags may contain attributes.


    > An attribute is a name-value pair. Each attribute has the form name="value".
    The quotation marks around the value are required.


    In Listing 3-1, the start tag (android.support.ConstraintLayout) has seven attributes,
    for example the empty element tag (EditText) has seven of its own attributes.
    For the EditText empty element tag "content" is the first attribute. This attribute
    has the name android:layout_width="content" and the value "content".


    +   A non-empty XML element may contain content.


