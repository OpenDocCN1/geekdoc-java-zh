    # Things You Might Eventually Have to Do


    When you download Android Studio, you get the code library (API) for the current
    release of Android. You also get several developer tools — tools for compiling,
    testing, and debugging Android code.


    Here''s what you don''t:


    +   **You don''t get older Android APIs or older versions of the developer tools.**

    Sometimes you have to work with older versions of Android. The version of Android
    that I used to create the book''s examples will be an older version. You''ll open
    one of the examples that you download from this book''s web page, and you''ll
    see Android Studio prompting you to install an older Android API. You''ll accept
    the prompt''s advice and you''ll be on your way to running the apps that I describe
    in this book.


    +   **You don''t get future Android APIs or future versions of the developer tools.**
    (You couldn''t possibly get those things.)

    Google updates Android frequently, and you might want to follow the latest trends.
    So, in the near future, you might install a newer release of Android than the
    one you have now.'
