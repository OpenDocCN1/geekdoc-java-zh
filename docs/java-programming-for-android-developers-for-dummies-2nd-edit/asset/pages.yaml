  md: '# Reference types


    Here’s a near-quotation from the earlier section “Creating objects:"


    > In Listing 9-2, the initialization of bag1 makes the bag1 variable refer to
    the newly created bag.


    In the quotation, I choose my words carefully. “The initialization makes the bag1
    variable refer to the newly created bag.” Notice how I italicize the words refer
    to. A variable of type int stores an int value, but the bag1 variable in Listing
    9-2 refers to an object.


    What’s the difference? The difference is similar to holding an object in your
    hand versus pointing to it in the room. Figure 9-16 shows what I mean.


    ```

    int daysAged;

    30

    ```


    ![](img/95a31530e90066e5e41d72a5efed3158_259_0.png)


    FIGURE 9-16: Primitive types versus reference types.


    | "Cheddar" | 2.43 | 30 | true |


    Java has two kinds of types: primitive types and reference types.


    +   - I cover primitive types in Chapter 5. Java’s eight primitive types are int,
    double, boolean, char, short, long, and float.

    - A reference type is the name of a class (or as you see in Chapter 10) an interface.


    In Figure 9-16, the variable daysAged contains the value 30 (indicating that the
    cheese in a particular bag has been aged for 30 days). I imagine the value 30
    right inside the daysAged box because the daysAged variable has type int — a primitive
    type.'
