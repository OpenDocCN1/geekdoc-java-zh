    # # Creating the “look”


    A general guideline in app development tells you to separate logic from presentation.
    In less technical terms, the guideline warns against what an app does with how
    an app looks. The guideline applies to many aspects of life. For example, if you''re
    designing a website, artists do the layout and have gets the coding. If you''re
    writing a report, get the ideas written first. Later, you can worry about fonts
    and paragraph styles.(I wonder whether this book''s copy editor would agree with
    about fonts and styles.)


    The literature on app describes specific techniques and frameworks to help you
    separate form from function. But in this chapter I do the simplest — I chop an
    app''s creation into sets of instructions. The first set is about creating an
    app''s look; the second set is about coding the app''s behavior.


    To add buttons, boxes, and others that go to your app, do the following:


