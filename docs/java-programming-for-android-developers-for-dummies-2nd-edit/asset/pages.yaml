  md: 'You can use lowercase letters in any variable, including final variables. Java
    programmers seldom write this code way. To keep from looking like a complete newbie,
    use only uppercase letters and digits in a final variable''s name. Use underscores
    to separate words.


    A loophole in the Java language specification allows you, under certain circumstances,
    to use an assignment to give a variable its initial value. For a variable, such
    as amount, declared inside a method''s body, you can write final int amount; and
    then write amount = 0; on another line. Your advice? Ignore this loophole. Don''t
    even read this Technical Stuff icon!


    # Expressions and literals


    In a program, an expression is a bunch of text that has a value. In Listing 5-1
    each occurrence of 74 is an expression, each occurrence of anInteger and each
    occurrence of aCharacter is an expression. Listing 5-1 is unusual in that all
    of these expressions have the same value, namely the numeric value 74.


    If I use anInteger in ten different places in my Java program, I have expressions,
    and each expression has a value. If I decide to type anInteger + 17 somewhere
    in my program, then anInteger + 17 is an expression because anInteger + 17 has
    a value.


    In Java, single quotation marks stand for a character. You can change the declaration
    in Listing 5-1 this way:


    ```

    char aCharacter = ''J'';

    ```


    With this change, the program''s run doesn''t change. The second I/System.out
    line in Figure 5-2 contains the letter J.


    In Java, a char value is a number in disguise. In Listing 5-1, you do get the
    result if the change type declaration is char aCharacter = ''J''. You can even
    do arithmetic with char values. For example, in 5-1, if you change the declaration
    to char aCharacter = ''J'' + 2, you get the letter L.'
