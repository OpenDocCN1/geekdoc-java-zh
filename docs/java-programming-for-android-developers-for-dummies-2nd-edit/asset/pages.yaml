    # # The trouble with threads


    Imagine you''re talking to a poorly designed robot. The robot executes only one
    set of instructions at a time. You give this robot the full set of instructions:


    +   1. Visit allycode.com/Java4Android.

    2. Download the code listings.

    3. Uncompress the downloaded file.


    You have a slow Internet connection, so the robot takes a long time to download
    the code listings (The robot stares vacantly into the air during the download.)
    In the middle of the download, you have a craving for a glass of orange juice.
    You say the following:


    +   1. Go to the refrigerator.

    2. Pour a glass of orange juice.

    3. Bring the glass to me.'
