- img_proc: true
  md: 'In truth, Android has two SDK managers. The one I describe in this section
    is embedded inside Android Studio''s Settings dialog box. The other runs on its
    own, with no help from the Android Studio IDE. The two SDK managers perform roughly
    the same tasks.


    In the Android SDK Manager, you see tabs labeled SDK Platforms, SDK Tools, and
    SDK Update Sites.


    +   >> SDK Platforms tabs list versions of Android.


    In Figure 2-12, the list includes Nougat, a preview release of Nougat when it
    was called Android, two versions of Android Lollipop, and many others. The list''s
    rightmost column tells which Android versions are installed (either fully or partially)
    on your development computer. The rightmost column may also indicate that an update
    to an Android version is available for downloading. Adding a check mark next to
    a version tells the SDK Manager to install that version on your computer.


    +   >> SDK Tools tabs list software tools that are already installed, and some
    that aren''t installed but are available for download.


    +   >> The Update Sites tabs list the URLs of the places where SDK Manager looks
    for updates.


    To run this book''s examples, you may have to visit the SDK Platforms tab. But
    you probably won''t need the SDK Tools tab. And you''re very unlikely to need
    the SDK Update Sites tabs.


    Sometimes, you need a version of Android that''s not already installed on your
    development computer. Somebody sends you a project that requires Android 3.2 and
    you haven''t installed Android 3.2 on your machine. Then put a check mark next
    to 3.2 in the SDK Platforms tab of the Android SDK Manager. Click OK and watch
    Android 3.2 being installed.


    # Creating an Android virtual device


    You might be itching to run some code, but first you must have something that
    can run an Android program. By something, I mean either a physical device or an
    emulated device.


    +   >> A physical device is a piece of hardware that''s meant to run Android.
    It''s a phone, a tablet, an Android-enabled toaster — whatever.


    Another name for a physical device is a real device.


    ![](img/95a31530e90066e5e41d72a5efed3158_63_0.png)'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'An emulated device is a picture of a phone or a tablet on your development
    computer''s screen.


    With an emulated device, Android is made to run on your development computer''s
    processor. The emulated device shows you how your code will probably behave when
    you later run your code on a real phone, a real tablet, or another Android device.


    # MIMMICK A PHYSICAL DEVICE


    An emulated image is really three pieces of software rolled into one:


    +   * A system image is a copy of one version of the Android operating system.


    For example, a particular system image might be for Android Marshmallow (API Level
    23) running on an Intel x86,64 processor.


    +   * An emulator bridges the gap between the system image and the processor on
    your development computer.


    You might have a system image for an Atom_64 processor, but your development computer
    runs a Core i5 processor. The emulator translates instructions for the Atom_64
    processor into instructions that the Core i5 processor can execute.


    +   * An Android Virtual Device (AVD) is a piece of software that describes a
    (physical) device''s hardware.


    An AVD contains a bunch of settings, telling the emulator all the details about
    the device to be emulated. What is the screen resolution of the device? Does the
    device have a physical keyboard? Does it have a camera? How much memory does it
    have? Does it have an SD card? All these choices belong to a particular AVD.


    Android Studio''s menus and dialog boxes make it easy to confuse these three items.
    When you download a new AVD, you often download a new system image to go with
    that. But Android Studio''s dialog boxes blur the distinction between the AVD
    and the system image. You''ll also see the word emulator, when the correct term
    is AVD. If the subtle differences between system images, emulators, and AVDs don''t
    bother you, don''t worry about them.


    A seasoned Android developer typically has several system images and several AVDs
    on the development computer, but only one Android emulator program.'
  merge: -1
