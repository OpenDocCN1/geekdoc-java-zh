  md: 'Getter and setter methods aren''t built-in features in Java — they''re ordinary
    methods. But this pattern (having a method whose purpose is to access an otherwise
    inaccessible field''s value) is used so often that programmers use the term getter
    and setter to describe it.


    Getter and setter methods are accessor methods. Java programmers almost follow
    the convention of starting an accessor name with get or set and capitalizing the
    name of the field being accessed. For example, the field internalNumber has access
    getInternalNumber and setInternalNumber. The field renderingValue has access named
    getRenderingValue and setRenderingValue.


    ![](img/95a31530e90066e5e41d72a5efed3158_272_0.png)


