  md: '# Coding behavior


    Assuming you''ve followed the instructions in the earlier section "Creating the
    look," what''s next? Well, what''s next depends on how much you want to work.
    This section describes the way. If you read the later section "Going Pro," you''ll
    find out how to do it the not-so-easy way.


    Android 1.6 (also known as Donut) introduced an android:onClick attribute that
    streamlines the coding of an app''s apps. Here''s what you do:


    +   1. Follow the steps in this chapter''s earlier section "Creating the look."


    +   2. If you don''t see the Designer tool with its preview screens, double-click
    the app/res/activity_main.xml branch in the Project tool window. When the Designer
    tool appears, select the Design tab.


    For details, refer to Steps 2 and 3 in "Creating the look".


    +   3. Make note of the labels on the branches of the tree.


    The component tree is on the left side of the Designer tool, immediately below
    the palette. The labels on the branches of the tree. Each element on the screen
    has an id (a name to identify element). In Figure 3-14, the ids of the screen''s
    elements are editText, button, and textView.


    FIGURE 3-14:

    The component tree.


    ![](img/95a31530e90066e5e41d72a5efed3158_96_0.png)


    You may be wondering why, in place of the word "identification," I use the strange
    abbreviation id instead of the more conventional English abbreviation ID. To find
    out what''s going on, select the Text tab in Android Studio''s designer tool.
    In the XML code for the activity''s layout you''ll find lines such as android:id="+id/textView".
    In Android''s XML files, id is a code word.


    When you drop a component onto the preview screen, you can experiment with this
    by dropping a second TextView component onto the preview screen. If you do, the
    component tree has an additional branch, and the label on the branch (the id of
    the new component) is likely to be textView2.


