  md: "![](img/95a31530e90066e5e41d72a5efed3158_264_0.png)\n\nFIGURE 9-21:\nThe original\
    \ bag is aged 31 days.\n\n# # Java’s Modifiers\n\nThroughout this book, you see\
    \ words like public and protected peppered throughout the code listings. You might\
    \ wonder what these words mean. (Actually, if you’re reading from front to back,\
    \ you might have grown accustomed to seeing them and started thinking of them\
    \ as background noise.) In the next few sections, I tackle some of these modifier\
    \ keywords.\n\n# ## Public classes and default-access classes\n\nMost of the classes\
