  md: 'A stream is a little like a person working in a bucket brigade. A stream takes
    things in, makes few changes to the things if necessary, and then sends out the
    other end. A stream modifies what it receives and passes the modified goods on
    to the next stream in the line.


    In Listing 12-7, the expression ArrayList.stream() represents a stream that sends
    out the things in the ArrayList. Each ends up in the forEach method call. And
    the forEach method call does something with each of those.


    What does the forEach method call do with each thing that it receives? To each
    thing, the forEach method call applies the lambda expression string -> textView.append(string).


    Lambda expressions pop up in the conversation in Chapter 11.


    ![](img/95a31530e90066e5e41d72a5efed3158_345_0.png)


    The lambda expression string -> textView.append(string) takes whatever it receives,
    calls that by the parameter name string, and then applies the textView.append
    method to string. In other words, the lambda expression displays (in the activity''s
    textView component) whatever you give it.


    Java''s streams are an example of the functional programming style. With functional
    programming, you do this, then that do solutions to problems. Instead, you call
    methods, which handle their results to other methods, which in turn may help their
    results to other methods, and so on. You chain methods one after another the result
    that you pops out in the end.


    Streams work only on devices running Android SDK 24 or higher. If you intend to
    use streams in a project, then you create the project, then the Minimum SDK to
    24. If you''ve already created a project with Minimum SDK less than 24, open the
    project''s Gradle Scripts/build.gradle (Module: app) file. In that file, look
    for a number after the minSdkVersionVersion. Change that number to 24.


    ![](img/95a31530e90066e5e41d72a5efed3158_345_1.png)


