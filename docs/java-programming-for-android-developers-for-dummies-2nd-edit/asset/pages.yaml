  md: "# LISTING 13-7: (continued)\n\n```\n@Override\nprotected void onPostExecute(String\
    \ result) {\n    editTextBoxName.setText(\"\");\n    viewTimeline.setText(result);\n\
    }\n```\n\nIn 13-7, the getResult method's header contains a throws clause. With\
    \ this clause, the getResult method says \"If I experience a Twitter Exception,\
    \ I won't deal with exception in my own try / catch statement. Instead, I'll pass\
    \ the exception on whichever method called me.\" Because the doInBackground method\
    \ calls getResult, Java insists that the doInBackground method contains code to\
    \ acknowledge the possibility of a TwitterException. To fulfill this responsibility,\
    \ the doInBackground method surrounds the getResult call with a try / catch statement.\n\
    \nIn this example, the buck must stop with my doInBackground method. My doInBackground\
    \ method's header has no throws clause. Instead, the doInBackground method must\
    \ contain a catch clause for the TwitterException. My code's doInBackground method\
    \ overrides Android's doInBackground method, and Android's doInBackground method\
    \ doesn't throw a TwitterException. Here's the rule: Imagine some exception that\
    \ I'll catch XYZException. If a method doesn't say throws XYZException, you can't\
    \ override that method with a header that throws XYZException.\n\nOf course, the\
    \ buck doesn't always have to stop after the first throws clause. You could say,\
    \ \"Don't blame me — tell my supervisor to deal with the problem.\" And then your\
    \ supervisor could say, \"Don't blame me — tell my supervisor to deal with the\
