  md: '# More casting


    Notice of the use of casting in Listing 12-1.


    ```

    textView.append((String) array.get(i));

    ```


    When you create an ArrayList the way I did in Listing 12-1, Java assumes that
    the list contains things of type Object. In Java''s class hierarchy, the Object
    class is the ancestor of all other classes. In fact, the parent class of Java''s
    String class is the Object class.


    When you call


    ```

    arrayList.add("Hello");

    ```


    Java says "That''s nice. The developer has added a kind of Object to the arrayList."
    And Java is happy.


    Notice what Java doesn''t say. Java doesn''t say "I''ll remember that the developer
    added something of type String to the arrayList. In fact, Java forgets about this.
    By the time you get to the statement


    ```

    textView.append((String) array.get(i));

    ```


    Java has forgotten all the string "Hello". All Java knows that you''re trying
    to get an Object of some kind from the arrayList. So Java would get upset if you
    wrote


    ```

    // With ArrayList declared as in Listing 12-1, don''t do this:

    textView.append(arrayList.get(i));

    ```


    The append method wants its parameter to be a character sequence of some kind,
    and an Object that you obtain when you call the arrayList object''s method isn''t
    necessarily a character sequence. That''s why, in Listing 12-1, I have to cast
    the result of arrayList.get(i). This telling Java that, this time around, I think
    the thing it gets from the arrayList to be a String.


    > Casting isn''t a magic-cure. The casting in Listing 12-1 is okay because all
    the objects in the arrayList have type String. But, for some reason, the thing
    that Java obtains from (String) arrayList.get(i) isn''t a String, the call to
    textView.append crashes and the person using your app gives you a bad rating on
    Google Play. You don''t want that to happen.


    ![](img/95a31530e90066e5e41d72a5efed3158_333_0.png)'
