    }\n\n```\n\nWhen you run the code in Listing 11-3, you see the results shown earlier,\
    \ in Figures 11-1 and 11-2.\n\nNotice the relative simplicity of the new MyOnClickListener\
    \ class in Listing 11-3. Going from the old MyOnClickListener class (refer to\
    \ Listing 11-2) to the new MyOnClickListener inner class (refer to Listing 11-3),\
    \ you reduce the number of files from two to one. But aside from the shrinkage,\
    \ the complexity of Figure 11-6 is absent from Listing 11-3. The caller, and when\
    \ you pull both ends of the rope feels like a tangled rope. you find that the\
    \ rope isn't knotted.\n\nAn inner class has no fancy bookkeeping in order to keep\
    \ track of its enclosing class's fields. Near the end of Listing 11-3, the line\n\
    \n```\ntextView.setText(R.string.you_clicked);\n```\n\nrefers to the MainActivity\
    \ class's textView field, which is exactly what you want. It's that straightforward.\n\
    \nIn this section, I show how a class can live inside of another class. An interface\
    \ can live inside of a class, too. Look at two of the import declarations in Listing\
    \ 11-3:\n\n```\nimport android.view.View;\nimport android.view.View.OnClickListener;\n\
    ```\n\nAndroid's View class is in the android.view package. And Android's OnClickListener\
    \ interface is an interface that's declared inside the View class.\n\n![](img/95a31530e90066e5e41d72a5efed3158_322_0.png)\n\
    \n# No Publicity, Please!\n\nNotice the code in Listing 11-3 uses the MyOnClickListener\
    \ class only once. (The only use is in a call to button.setOnClickListener.) So\
    \ I ask: Do you really need a name for something that's used only once? No, you\
    \ don't. (If there's one cat in the house, you can name it \"Cat.\")\n\nCHAPTER\
    \ 11 The Inside Story 309"
