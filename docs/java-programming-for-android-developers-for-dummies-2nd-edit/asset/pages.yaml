  md: 'But in so many of this book''s examples, you prevent this failure. You appease
    the Java gods by adding a casting operator to the code. You tell Java to convert
    what-ever pops out of the findViewById method call into a TextView object.


    ```

    TextView = (TextView) findViewById(R.id.textView);

    ```


    While you''re typing the code, Java humors you and says, "Casting operator shows
    me that you are aware of the difference between a TextView and any old View. I''ll
    do my best to interpret the View that I find at runtime as a TextView object."
    (Actually, while you''re typing the code, Java says nothing. The fact that Java
    doesn''t display any error messages when you use this casting trick is a good
    sign. Java''s casting feature saves the day!)


    Casting you from seeing an error message while you develop your code. In that
    way, casting is quite a useful feature of Java. But casting can''t save you if
    your code contains runtime errors. When you type


    ```

    TextView = (TextView) findViewById(R.id.textView);

    ```


    you verify that the name textView represents a TextView widget. When the app runs,
    Java grabs the R.id.textView widget from the activity_main.xml file, and everything
    works just fine. But you sometimes forgets to check your Java names against the
    components in the XML file. A call to findViewById surprisingly spits out a Button
    component when casting Java to expect a TextView widget. When this happens, Java
    chokes on the casting operator and your app crashes during its run. Back to the
    drawing board!


    For a complete discussion of casting, see Chapter 6.'
