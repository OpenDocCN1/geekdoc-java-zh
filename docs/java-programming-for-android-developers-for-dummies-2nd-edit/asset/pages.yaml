  md: "the MyOnClickListener class changes the text in the MainActivity class's textView\
    \ variable. That's not good programming practice. It's sneaking into someone's\
    \ house and moving some furniture around. It may be okay, but it's always disconcerting.\n\
    \nIs there a better way to handle a simple button click?\n\nThere is. You can\
    \ define a class inside another class. When you do, you're creating an inner class.\
    \ It's like any other class. But within an inner class's code, you can refer to\
    \ the enclosing class's fields with none of the froufru in Listing 11-2. That's\
    \ why, at the beginning of this chapter, I sing the praises of insider knowledge.\n\
    \nOne big class with its own inner class can replace Listings 11-1 and 12. The\
    \ new inner class requires none of the exotic gyrations you see in the old MyOnOnClickListener\
    \ class. Listing 11-3 contains this wonderfully improved code.\n\n# LISTING 11-3:\
    \ A Class within a Class\n\n```\nimport com.allmycode.at1_03;\nimport android.support.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\nimport android.view.view.OnClickListener;\n\
    import android.widget.Button;\nimport android.widget.TextView;\n\npublic class\
    \ MainActivity extends AppCompatActivity {\n    Button button;\n    TextView textView;\n\
    \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n  \
    \      super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \n        button = (Button) findViewById(R.id.button);\n        button.setOnClickListener(new\
    \ MyOnOnClickListener());\n\n        textView = (TextView) findViewById(R.id.textView);\n\
    \    }\n\nclass MyOnOnClickListener implements OnClickListener {\n```"
