    # # Chapter 14


    # # Hungry Burds: A Simple Android Game


    What started as a simple pun involving the author''s last name has turned into
    Chapter 14 — the most self-indulgent writing in the history of technical publishing.


    The scene takes place in south Philadelphia in the early part of the 20th century.
    My father (then a child) sees his father (my grandfather) handling an envelope.
    The envelope has just arrived from the old country. My grandmother grabs the envelope
    out of my grandfather''s hands. The look on her face is one of superiority. "I
    opens the letters around here," she says with her eyes.


    While my grandmother opens the letter, my father glances at the envelope. The
    last name is written in Cyrillic characters, so my father can''t read it. But
    he notices a short last name in the envelope''s address. Whatever the characters
    are, they''re more likely to be a name like Burd than a longer name like Burdinski
    or Burdakov.


    The Russian word for bird is ptitsa, so there''s no etymological connection between
    my last name and our avian friends. As I grew up, I would often hear kids yell,
    "Burd is the word" or "Hey, Burdman" from across the street. Today, my one-person
    Burd Brain Consulting firm takes in a small amount of change every year.


    CHAPTER 14 Hungry Burds: A Simple Android Game 381'
