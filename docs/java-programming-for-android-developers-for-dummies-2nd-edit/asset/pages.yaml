    # Testing String values for equality


    Java has several ways to test for equality: “Is this value the same as that value?”
    None of these are the first one you’d consider. In particular, to find out someone’s
    age is 35, you would write if (age = 35). Instead, use a double equal sign (==):
    if (age == 35). In Java, the single equal sign (=) is reserved for assignment.
    So age = 35 means “Let age stand for the value 35”, and age == 35 means “True
    or false: Does age stand for the value 35?”


    Comparing two is a different story. When you compare two strings, don’t use the
    double equal sign. A double equal sign would ask a question that’s not what you
    want to ask: “Is this string stored in exactly the same place in memory as that
    other?” Instead, want to ask, “Does this string have the same characters in it
    as that other?” To ask the second question use Java’s equals method. To call this
    method, follow one of the two strings with a dot and the word equals, and then
    with a parameter list containing the other string:


    ```

    while (message.equals("continue")) {

