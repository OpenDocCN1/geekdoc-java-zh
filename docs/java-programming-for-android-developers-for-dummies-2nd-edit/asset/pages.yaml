  md: "Here's the basic idea. A configuration builder has lots of properties, and\
    \ you can imagine several different ways of setting those properties. For example,\
    \ you can have one enormous constructor:\n\n```\n// This is not correct Twitter4\
    \ code:\nConfigurationBuilder builder = new ConfigurationBuilder(\n    \"0000000000000000\"\
    , \"!!!!!!!!!!!!!!!!!!!!!!!!\",\n    \"22222222-3333333333333333\", \"aaaaaaaaaaaaaaaaaaaa\"\
    );\n```\n\nThis approach is cumbersome because you must remember which string\
    \ belongs to which position. If it gets wrong, a configuration builder has 46\
    \ different properties, and you may want to set more than four of these properties.\
    \ However, a constructor with 46 parameters would be truly awful.\n\nAnother possibility\
    \ is to create a blank-slate configuration builder and then set each of its properties\
    \ with separate method calls:\n\n```\n// This is not correct Twitter4j code:\n\
    ConfigurationBuilder builder = new ConfigurationBuilder();\nbuilder.setOAuthConsumerKey(\"\
    00000000000000000000\");\nbuilder.setOAuthConsumerSecret(\"!!!!!!!!!!!!!!!!!!!!!!!!\"\
    );\nbuilder.setOAuthAccessToken(\"22222222-33333333333333333333\");\nbuilder.setOAuthAccessTokenSecret(\"\
    aaaaaaaaaaaaaaaaaaaa\");\n```\n\nThis is less awkward having a giant constructor,\
    \ but there's a better way. In the Twitter4j API, the ConfigurationBuilder class\
    \ has 46 set methods. Each method applies to an existing ConfigurationBuilder\
    \ instance. And each method returns, as its result, a new ConfigurationBuilder\
    \ instance. So, in Listing 13-3, the statement\n\n```\nConfigurationBuilder builder\
    \ = new ConfigurationBuilder();\n```\n\ncreates a blank-slate configuration builder.\
    \ The next piece of code\n\n```\nbuilder\n.setOAuthConsumerKey(\"00000000000000000000\"\
    );\n```\n\napplies to the blank-slate instance. But the value of this piece of\
    \ code is a ConfigurationBuilder instance with a particular OAuth consumer key.\
    \ To this enhanced instance you apply\n\n```\n.setOAuthConsumerSecret(\"!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\"\
    );\n```\n\nThe combined code's value is even better ConfigurationBuilder instance\
    \ — one with a particular OAuth consumer key and an OAuth consumer secret."
