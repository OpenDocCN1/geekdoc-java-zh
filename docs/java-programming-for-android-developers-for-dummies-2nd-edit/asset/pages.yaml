  md: '# Variable names


    The identifiers anInteger aCharacter in Listing 5-1 are variable names, or simply
    variables. A variable name is a nickname for a value (like the value 74).


    I made up variable names for the example in Listing 5-1, and I intentionally made
    up informative names. Instead of anInteger aCharacter in Listing 5-1, I could
    have chosen flower and goose. But I use anInteger aCharacter because informative
    names help other people read and understand my code. In fact, informative names
    help me read and understand my own code!


    Like most of the names in a Java program, variable names can''t have spaces. The
    only allowed punctuation is the underscore (_). Finally, you can''t start a variable''s
    name with a digit. For example, you can name your variable close2Call, but you
    can''t name it 2CloseCall.


    If you want to look like a seasoned programmer, start every variable name with
    a lowercase and use uppercase letters to separate words within the name. For example,
    numberOfBunnies starts with a lowercase and separates words by using the uppercase
    letters O and B. This mixing of upper- and lowercase is called camel because of
    its resemblance to a camel''s humps.


    ![](img/95a31530e90066e5e41d72a5efed3158_146_0.png)


    Experienced Android programmers begin variable names with the lower-letter m.
    For more info on, refer to Chapter 9.


    ![](img/95a31530e90066e5e41d72a5efed3158_146_1.png)


    # Type names


    In Listing 5-1, the words int and char are type names. The word int (in the first
    type declaration) tells Java to interpret whatever anInteger has as a "number"
    (a value with no digits to the right of the decimal point). And the word char
    (in the second type declaration) tells Java to interpret whatever aCharacter has
    as a character value (a letter, a punctuation symbol, or maybe a single digit).
    So in Listing 5-1, the line


    ```

    System.out.println(anInteger);

    ```


    tells Android to display the value of anInteger, and Android displays the number
    74. (Refer to Figure 5-2.) And then the line


    ```

    System.out.println(aCharacter);

    ```


    tells Android to display the value of aCharacter, and Android displays the letter.'
