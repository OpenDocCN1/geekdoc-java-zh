  md: "```\nprivate static int count = 0;\n\npublic static int getCount() {\n  return\
    \ count;\n}\n\npublic BagOfCheese() {\n  count++;\n}\n```\n\nListing9-21 contains\
    \ a static field and a static method. The static count field is private, another\
    \ class's code can't refer to BagOfCheese.count. But the method getCount is public.\
    \ In place of BagOfCheese.count, another class can obtain the information by calling\
    \ BagOfCheese.count().\n\n![](img/95a31530e90066e5e41d72a5efed3158_276_0.png)\n\
    \nAndroid's official code guidelines, posted at http://source.android.com/source/code-style.html,\
    \ tell you to start every nonpublic, nonstatic field name with a lowercase letter\
    \ m. In an introductory Java book, I depart from these guidelines. That's why,\
    \ in a professionally written Android program, you'll see so many starts with\
    \ the letter m.\n\n# # To dot, or not\n\nThe three ways to refer to a member (a\
    \ field or an object):\n\n> >> You can prefer the member name with a name that\
    \ refers to an object.\n\nFor example, in Listing 9-11, I preface calls to toString\
    \ with the names bag1 and bag2, each which refers to an object:\n\n```\ntextView.append(bag1.toString());\n\
    textView.append(bag2.toString());\n```\n\nWhen you do this, you're referring to\
    \ something that belongs to each indent object (You're referring to the object's\
    \ nonstatic field, or calling the object's nonstatic method.)\n\n> >> You can\
    \ prefer the member name with a name that refers to a class.\n\nFor example, in\
    \ Listing 9-20, I preface the name count with the class name BagOfCheese.\n\n\
    When you do this, you're referring to something that belongs to the entire class\
    \ (You're referring to the class's static field, or calling the class's static\
    \ method.)\n\nCHAPTER 9 Why Object-Oriented Programming Is Like Selling Cheese\
    \ 263"
