    Java is an object-oriented programming language. When you write Java code, you
    deal with things called classes and objects. I don''t start describing classes
    and objects in detail until Chapter 9, so at this point I have to blur the terminology.
    I refer to classes and objects as object-oriented things.


    > In Java, every method belongs to an object-oriented thing.


    That''s important, so I''ll type it again:


    > In Java, every method belongs to an object-oriented thing.


    To call a method, you write


    ```

    the_thing_to_which_the_method_belongs . simple_name_of_the_method

    ```


    For example, in Android, each TextView component has hundreds of methods. One
    of them is named setText, and another is named append. In Listing 4-3, the TextView
    variable has methods named setText and append. That''s why you use a dot to call
