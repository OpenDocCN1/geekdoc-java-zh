  md: 'But the variable bag1 has type BagOfCheese, BagOfCheese isn''t a primitive
    type. (I know no computer programming language in which bag of cheese is a built-in,
    primitive type!) So the bag1 doesn''t contain "Cheddar" 2.43 30 true. Instead,
    the variable bag1 contains the information required to locate the "Cheddar" 2.43
    30 true object. The variable bag1 stores information that refers to the "Cheddar"
    2.43 30 true object.


    The types int, double, boolean, char, short, long, and float are primitive types.
    A primitive type (int daysAge, double weight, and boolean isDomestic) stores a
    value. In contrast, a class is a reference type, such as String, which is defined
    in Java''s API, and BagOfCheese, which you or I declare. A reference type variable
    (BagOfCheese bag and String kind, for example) refers to an object.


    ![](img/95a31530e90066e5e41d72a5efed3158_260_0.png)


    REMEMBER


    The String type is a reference type, so Figure 9-16 would be slightly more accurate
    if the bottom box had another hand pointing to the letters ''C'', ''h'', ''e'',
    ''d'', ''d'', ''a'', and ''r''. (See Figure 9-17.) To keep my diagrams uncluttered,
    I don''t put that other hand in Figure 9-16 and I don''t put the other hand in
    similar diagrams in this chapter.


    ![](img/95a31530e90066e5e41d72a5efed3158_260_1.png)


    TECHNICAL STUFF


    BagOfCheese bag1;


    > (Where like I''m pointing.)


    Figure 9-17:

    The String type is also a reference type:


    | (Where like I''m pointing.) | 2.43 | 30 | true |

    | ''C'' ''h'' ''e'' ''d'' ''d'' ''a'' ''r'' | | |


    ![](img/95a31530e90066e5e41d72a5efed3158_260_2.png)


    TECHNICAL STUFF


    In this section, I say that the bag1 variable refers to the "Cheddar" 2.43 30
    object. It''s also common to say that the bag1 variable points to the "Cheddar"
    2.43 30 true object. Alternatively, you can say that the bag1 variable stores
    the number of the memory address where the "Cheddar" 2.43 30 true object''s values
    begin. Neither the pointing language nor the language expresses the truth of the
    butter, but if the right terminology helps you understand what''s going on, there''s
    no harm in using it.


    # Pass by reference


    In the previous section, I emphasize that classes are reference types. A variable
    whose type is a class contains something that refers to blah, blah, blah. You
    might ask, "Why should I care?"


