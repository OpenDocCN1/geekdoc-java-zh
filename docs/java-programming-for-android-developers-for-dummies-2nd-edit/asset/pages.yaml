  md: 'In addition to primitive values, wrapper classes provide useful methods for
    working with primitive values. For example, the Integer wrapper class contains
    parseInt and other useful methods for working with int values:


    ```

    String string = "17";nint number = Integer.parseInt(string);

    ```


    On the downside, working with wrapper types can be clumsy. For example, you can''t
    use arithmetic operators with Java''s numeric wrapper types. Here''s the way I
    usually create two Integer values and add them together:


    ```

    Integer myInteger = new Integer(3);

    Integer myOtherInteger = new Integer(15);


    Integer sum = myInteger.intValue() + myOtherInteger.intValue();

    ```


    A call to intValue gets an ordinary primitive int from an Integer. I can use the
    plus sign to add these values. Java lets me assign the resulting int value to
    the Integer variable.


    # Stepping Through a Collection


    The program in Listing 12-1 uses a for loop with indices to step through a collection.
    The code does what it''s supposed to do, but it''s a bit awkward. When you''re
    piling objects into a collection, you shouldn''t have to worry about which object
    is first in the collection, which is second, and is third, for example.


    Java has a few features that make it easier to step through a collection of objects.
    This section covers those features.


