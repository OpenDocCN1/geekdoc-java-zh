  md: 'Sometimes you need a name for a value that doesn''t change during the program''s
    run. In such situations, the keyword final signals a variable whose value can''t
    be reassigned.


    ```

    final int NUMBER_OF_PLANETS = 9;

    ```


    A final variable is a variable whose value doesn''t vary. (As far as I know, no
    one has ever seriously suggested calling these invariants.)


    You can initialize a final variable''s value, but after the initialization, you
    can''t change the variable''s value with an assignment statement. In other words,
    after you declare final int NUMBER_OF_PLANETS = 9, this assignment statement isn''t
    legal:


    ```

    NUMBER_OF_PLANETS = 8;

    ```


    If Pluto is no longer a planet, you can''t accommodate the change without changing
    the 9 in the final int NUMBER_OF_PLANETS = 9 declaration.


    In Java, the final is one of Java''s modifiers. A modifier is like an adjective
    in English. A modifier causes a slight change in the meaning of a declaration.
    For example, in this section, the word final modifies the NUMBER_OF_PLANETS declaration,
    making the value of NUMBER_OF_PLANETS unchangeable.


    For more information about Java, see Chapters 9 and 10.


    You use final variables, as a rule, to give names to values that never (or rarely)
    change. For example, in a Java program, 6.626068e-34 stands for 6.626068 × 10^-34,
    which is as this follows:


    ```

    0.00000000000000000000006626068

    ```


    In quantum physics, you probably don''t want to retype the number 6.626068e-34
    several times in your code. (You can type the number wrong or make a mistake when
    you copy-and-paste.) To keep errors from creeping into your code, you declare


    ```

    final double PLANCK_CONSTANT = 6.626068e-34;

    ```


    From that point on, rather than type 6.626068e-34 multiple times in your code,
    you can type only the name PLANCK_CONSTANT when needed.'
