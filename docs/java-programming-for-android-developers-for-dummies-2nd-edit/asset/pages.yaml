    \        textView.setText(BagOfCheese.count + \" bags\");\n    }\n}\n```\n\nFields\
    \ are the only things that can be static. Methods can be static too. Consider\
    \ the code in Listing 9-21.\n\n# LISTING 9-21: A Static Field and a Static Method\n\
    \n```\npackage com.allcode.a09_21;\n\npublic class BagOfCheese {\n    public String\
    \ kind;\n    public double weight;\n    public int daysAged;\n    public boolean\
