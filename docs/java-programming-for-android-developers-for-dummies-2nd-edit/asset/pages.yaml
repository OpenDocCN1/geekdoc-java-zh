    third time is a charm. On rare occasions, my first three attempts fail, but my
    fourth attempt succeeds.


    +   If you have access to a computer with more RAM, try running your app on it.


    Horsepower matters.


    +   Try a different AVD.


    The "Creating an Android device" section, back in Chapter 2, tells you how to
