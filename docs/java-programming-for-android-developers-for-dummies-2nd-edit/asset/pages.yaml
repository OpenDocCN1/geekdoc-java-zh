  md: '# ANDROID STUDIO''S DESIGNER TOOL


    A typical Android app has at least one layout file. A layout file describes the
    look of an Android device''s screen. A layout file also describes the positions
    of text fields, buttons, images, and other items. The layout file can describe
    other properties of components on the screen. For example, a layout file can indicate
    the piece of Java code that Android calls when the user clicks a particular button.


    Layout files aren''t written in Java. They''re written in XML. So you don''t do
    anything with layout files in this book. But you can do some simple, fun things
    with layouts by dragging and dropping components (buttons, text fields, and so
    on) in Android Studio''s Designer tool.


    One of the layouts in a typical Android app is named activity_main.xml. You may
    also see a file named content_main.xml. When you expand the app/res/layout branches
    in the Project window and you double-click the activity_main.xml item inside those
    branches, Android Studio displays the Designer tool. The tool has two modes: Design
    and Test mode. Refer to Figure 3-10 to see the figure in the sidebar.


    ![](img/95a31530e90066e5e41d72a5efed3158_89_0.png)


    76 PART 1 Getting Started with Java Programming for Android Developers'
