    daysAged = 30\nisDomestic = true\ncount = 0 |\n\n| BagOfCheese |\n| kind = \"\
    Blue\"\nweight = 5.987\ndaysAged = 90\nisDomestic = false\ncount = 0 |\n\nInside\
