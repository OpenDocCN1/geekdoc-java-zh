  md: "With Java’s pass-by-value feature, you make a copy of each parameter value\
    \ in a call. You initialize the declaration-parameters with the copied values.\
    \ So, immediately after making the call, you have two pairs of variables: the\
    \ original score and points variables in the onCreate method and the new score\
    \ and points variables in the addPoints method. The new score and points variables\
    \ have copies of values from the onCreate method. (See Figure 7-6).\n\n# PERILS\
    \ AND PITFALLS OF PARAMETER PASSING\n\nHow would you like to change the value\
    \ of 2 + 2? What would you like 2 + 2 to be Six? Ten? Three hundred? In certain\
    \ versions of the FORTRAN programming language, you could make 2 + 2 almost anything\
    \ wanted. For example, the following code (translated to look like java code)\
    \ would display 6 for the value of 2 + 2:\n\n```\nvoid increment(int score) {\n\
    \  score++;\n  ...\nincrement(2);\nprint(2 + 2);\n```\n\nWhen computer variables\
    \ were first being developed, their creators didn’t realize how complicated parameter\
    \ passing can be. They weren’t as careful about specifying the rules for copying\
    \ parameters’ values or for whatever they wanted to do with parameters. As a result,\
    \ some versions of FORTRAN indiscriminately passed addresses rather than values.\
    \ Though address-passing alone isn’t a terrible idea, things might become ugly\
    \ if the language designer isn’t careful.\n\nIn early FORTRAN implementations,\
    \ the computer automatically (and without warning) turned the literal 2 into a\
    \ variable named two.(In fact, the newly created variable probably wasn’t named\
    \ two. But in this story, the actual name of the variable doesn’t matter.) FORTRAN\
    \ would substitute the variable name two in any place where the programmer used\
    \ the literal 2. Then, while running this sidebar’s code, the computer would send\
    \ the address of the two variable to the increment method. The method would add\
    \ 1 to whatever was stored in the two variable and continue its work. Now the\
    \ two variable stored the number 3. By the time you reached the print call, the\
    \ computer would add it to whatever was in two, getting 3 + 3, which is 6.\n\n\
    If you think parameter passing is a no-brainer, think again. Different languages\
    \ use all different kinds of parameter passing. And in many situations, the minute\
    \ details of the way parameters are passed make a big difference."
