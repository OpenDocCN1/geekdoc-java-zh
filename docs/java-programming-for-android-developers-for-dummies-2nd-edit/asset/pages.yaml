  md: '# Going from primitive types to strings


    Chapter 5 gives you one way to get a String value from a numeric value: Put a
    plus sign between the numeric value and some other String value. For example,
    the expression


    ```

    "" + 81

    ```


    doesn''t stand for the numeric value 81 (the amount eighty-one). Instead, it stands
    for the string "81" — a string consisting of the two digit characters, ''8'' followed
    by ''1''.


    Another way to go from a primitive type to a string is with using Java''s toString
    methods. Imagine that in your code, the variable amountTextView refers to a TextView
    component that operates on the user''s screen and the variable howMany refers
    to an int value such as 21 or 456. To display the number howMany in the TextView
    component, you write


    ```

    amountTextView.setText(Integer.toString(howMany));

    ```


    If howMany refers to the number 21, the expression Integer.toString(howMany) refers
    to the Java value "21", and you can set a TextView component''s text to the String
    value "21".


    For an introduction to TextView components, Chapter 3.


    The kind of thing works for other primitive type. For example, if the double variable
    howMuch refers to the value 32.785, then the expression Double.toString(howMuch)
    refers to the String value "32.785". If the boolean variable isGood refers to
    the value true, then Boolean.toString(isGood) refers to the String value "true".
    If the char variable oneLetter refers to the single letter ''x'', then the expression
    Character.toString(oneLetter) refers to the String value "x".


    The words Integer, Double, Boolean, and Character are names of wrapper types.
    These wrap the primitive types in additional functionality. For information about
    types, see Chapter 12.


    > Java''s System.out.println displays just any kind of value, including String
    values, int values, double values, and others. But the display doesn''t appear
    on an Android device''s screen, unless you put the value into something like a
    TextView component or EditText component. And Android''s components can directly
    display int values or double values.


    158 PART 2 Writing Your Own Java Programs


    *'
