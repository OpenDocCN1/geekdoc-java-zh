  md: "# This is a callback\n\nThe pattern that I use in Listings 11-1 and 11-2 is\
    \ known as a callback. When the user clicks the button, the MyOnClickListener\
    \ object in 11-2 calls back to the activity that created it. This callback is\
    \ possible for two reasons:\n\n+   Android's built-in setOnClickListener method\
    \ expects its parameter to implement Android's OnClickListener interface.\n\n\
    I looked online for the first line of the setOnClickListener method's code. Here's\
    \ what I found:\n\n```\npublic void setOnClickListener(OnClickListener listener)\
    \ \n```\n\nRemember that OnClickListener is an interface, not a class.\n\nWhen\
    \ you call setOnClickListener, you pass an object to the method. The setOnClickListener\
    \ method does not know much about that object's class. The method does not know\
    \ whether you will pass one of your MyOnClickListener objects or a BagOfCheese\
    \ object whatever else. The setOnClickListener method wants the flexibility to\
    \ accept any of those objects as its parameter.\n\nAll the setOnClickListener\
    \ method knows is that it is the object that you pass to implement Android's OnClickListener\
    \ interface. In 11-2, the MyOnClickListener implements the OnClickListener.\n\n\
    +   The MyOnClickListener object knows how to call back the activity that constructed\
    \ it.\n\nAgain, in Listing 11-1, the MyOnClickListener constructor passes this\
    \ to its new MyOnClickListener object (\"Call me back,\" says your activity's\
    \ code in Listing 11-1.) Refer to Figure 11-5.\n\nIn 11-2, the MyOnClickListener\
    \ constructor makes a mental of who gets called back, storing a reference to your\
    \ object in its own caller field. So, when push comes to shove, the code in Listing\
    \ 11-2 calls back caller.textView.setText, which changes the words displayed in\
    \ the original activity's textView.\n\n# Android string resources (A slight 두고)\n\
