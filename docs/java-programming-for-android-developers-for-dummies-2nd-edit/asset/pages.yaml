  md: 'For any condition you want to express, you always have several ways to express
    it. For example, rather than test numberOfCats != 3, you can be more long-winded
    and test (numberOfCats == 3). Rather than test myAge < yourAge, you can get the
    same answer by testing yourAge > myAge (myAge >= yourAge). Rather than type a
    = b && c != d, you can get the same result with (a == b || c == d). (A guy named
    AugustusMorgan told me about this trick.)


    ![](img/95a31530e90066e5e41d72a5efed3158_168_0.png)


    # Parenthetically speaking...


    The big condition in List 5-5 (the condition age < 18 || 65 <= && isSpecialShowing)
    illustrates the need for (and the importance of) parentheses (but only when parentheses
    are needed (or when they help people understand your code).


    When you use parentheses, Java''s precedence rules settle arguments about the
    meaning of the expression. They tell you which line


    ```

    age < 18 || 65 <= age && !isSpecialShowing

    ```


    stands for the expression


    ```

    (age < 18 || (65 <= age && !isSpecialShowing

    ```


    or for this one:


    ```

    age < 18 || (65 <= age && !isSpecialShowing

    ```


    According to the precedence rules, in the absence of parentheses, Java evaluates
    && before evaluating || If you omit the parentheses, Java first checks to find
    out 65 <= age && !isSpecialShowing. Then Java combines the result with a test
    of the age < 18. Imagine a 16-year-old buying a movie ticket on the day of a special
    showing. The condition 65 <= age && !isSpecialShowing is false, but the condition
    age < 18 is true. Because one of the conditions on either side of the || operator
    is true, the nonparenthesized condition is true — and, to the theater management''s
    dismay, the 16-year-old gets a discount ticket.


    Sometimes, you can take advantage of Java''s precedence rules and omit parentheses
    in an expression. But I have a problem: I don''t like memorizing precedence rules,
    and when I visit Java''s online language specifications document (https://docs.oracle.com/javase/specs/jls/se8/html),
    I don''t like figuring out how the rules apply to a particular condition.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'When I create an expression like the one in Listing 5-5, I almost always use
    parentheses. In general, I use parentheses if I have any doubt about the way Java
    behaves without them. I also add parentheses when doing so makes the code easier
    to read.


    Sometimes, if I''m not sure about stuff and I''m in a curious frame of mind, I
    write a quick Java program to test the precedence rules. For example, I run Listing
    5-5 with and without the condition''s parentheses. I send a 16-year-old kid to
    the movie theater when there''s a special showing and see whether the kid ever
    gets a discount ticket. This little experiment shows me that the parentheses aren''t
    optional.'
