  md: '# >> Floating-point


    The floating-point types represent numbers with digits to the right of the decimal
    point, even if those digits are all zeroes. For example, an old wooden measuring
    stick might be 1.001 meters long, and a precise measuring stick might be 1.000
    meters long.


    The double type has a much larger range than the float type and is much more accurate.


    In spite of their names, Java programmers almost use double rather than float,
    and when you write an ordinary literal (such as 42.0), literal is a double value.
    (On the chance that you want to create a float value, write 42.F)


    # >> Logical


    A boolean variable has one of two values: true or false. You can assign 74 to
    an int, and you can assign true (for example) to a boolean variable:


    ```

    int numberOfPopsicles;

    boolean areLemonFlavored;

    numberOfPopsicles = 22;

    areLemonFlavored = true;

    ```


    You can do arithmetic with numeric values, and you can do a kind of "arithmetic"
    with boolean values. For more information, see the next section.


    # Things You Can Do with Types


    You can do arithmetic with Java’s operators. The most commonly used arithmetic
    operators are + (addition), – (subtraction), + (multiplication), / (division),
    and % (remainder division).


    # >> When you use an arithmetic operator to combine two int values, the result
    is another int value.


    For example, the value of 14 / 5 is 2 (because 5 "goes into" 14 two times, and
    even though the remainder is bigger than 1, the remainder is omitted). The value
    of 14 % 5 is 4 (because 14 divided by 5 leaves a remainder of 4).


    The kind of rules apply to all the integral types. For example, when you add a
    long value to a long value, you get another long value.'
