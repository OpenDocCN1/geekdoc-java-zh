  md: '> >> When you use an arithmetic operator to combine two double values, the
    result is another double value.


    For example, the value of 4.0 + 15.0 is 19.0. The value of 14.0 / 5.0 is 2.8.


    The same kind of rule applies to float values. For example, a float value plus
    a float value is another float value.


    > >> When you use an arithmetic operator to combine an int value with a double
    value, the result is another double value.


    Java widens the int value in order to combine it with the double value. For example,
    4 + 15.0 is the same as 4.0 + 15.0, which is 19.0. And 14 / 5.0 is the same as
    14.0 / 5.0,


    This widening also happens when you combine two different kinds of integral values
    or two different kinds of floating-point values. For example, the number 9000000000000000000
    is too large to be an int value, so


    ```

    9000000000000000000L + 1

    ```


    is the same as


    ```

    9000000000000000000L + 1L

    ```


    which is as


    ```

    9000000000000000000L

    ```


    Two popular operators are increment ++ and decrement --. The most common use of
    the increment and decrement operators looks like this:


    ```

    x++;

    y--;

    ```


    But you can also place the operators before the variables:


    ```

    ++x;

    --y;

    ```


    Placing the operator after the variable is called postincrementing (or decrementing).
    Placing the operator before the variable is called preincrementing (or predecrement).


    Both forms (before and after the variable) have the same effect on the variable''s
    value; namely, the increment ++ operator always adds 1 to the value, and the decrement
    -- operator subtracts 1 from the value. The only difference is what happens if
    you display (or otherwise examine) the value of something like x++. Figure 5–3
    illustrates this unsettling idea.


