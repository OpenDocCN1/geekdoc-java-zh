    # # Java''s Exceptions


    Have I ever had something wrong during the run of a program? (Hint: The answer
    is yes.) Have you ever tried to visit a website and been unable to pull up the
    page? (Indubitably, the answer is yes.) Is it possible that Java statements fail
    when they try to access the Twitter server? (Absolutely!)


    In Java, most of the things that go wrong during execution of a program are exceptions.
    When something goes wrong, your code throws an exception. If your code provides
    a way to respond to an exception, your code catches the exception.


    Everything else in Java, an exception is an object. Every exception is an instance
    of Java''s Exception class. When your code can''t access a database, your code
    throws divide by zero (which is always a "no-no"), your code throws an ArithmeticException.
    When your code can''t read from a stored file, your code throws an instance of
    the IOException class. When your code throws an instance of the SQLException class.
    And when your Twitter4 code gets a bad response from the Twitter servers, your
    code throws an instance of the TwitterException class.


    The classes ArithmeticException, IOException, SQLException, TwitterException and
    many others are subclasses of Java''s Exception class. Each of the classes Exception,
    ArithmeticException, IOException, and SQLException are part of Java''s standard
    API library. The class TwitterException is declared separately in the Twitter4
    API.


    Java has two kinds of exceptions: unchecked exceptions and checked exceptions.
    The easiest way to tell one kind of exception from the other is to watch Android
    Studio''s response when you type and run your code:


    > > When you execute a statement that can throw an unchecked exception, you don''t
    have to add additional code.'
