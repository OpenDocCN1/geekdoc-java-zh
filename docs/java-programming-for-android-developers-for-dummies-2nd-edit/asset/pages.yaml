  md: "# Creating a Collection Class\n\nA collection class is a class whose job is\
    \ to store a bunch of objects at a time - a bunch of String objects, a bunch of\
    \ BagOfCheese objects, a bunch of tweets, or whatever. You can create a collection\
    \ class with the code in Listing 12-1.\n\n# LISTING 12-1: Making an ArrayList\n\
    \n```\npackage com.myappcode.ad2;\n\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.widget.TextView;\n\nimport java.util.ArrayList;\n\
    \npublic class MainActivity extends AppCompatActivity {\n    TextView textView;\n\
    \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n  \
    \      super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
