    This chapter''s "Coding the behavior" section describes a way to make your app
    respond when the user clicks a button. The story isn''t complicated: You type
    a name in the button''s onClick field in the Properties pane, and then you use
    that name in the app''s Java code. That''s the easy way.


    The problem with the easy way is that hard-core Android developers don''t do things
    that way. Using a onClick property doesn''t work well for more complicated apps.
    So professional Android developers use a technique that comes from the Java programming
    world.


    In most of this book''s examples, the easy way is to respond to button clicks.
    If you want to use the more professional way, read on:


    +   1. Follow the steps in this chapter''s "Creating the ''look'' section.

    2. Make note of the labels on the branches in the component tree, but don''t follow
    any other instructions in the "Coding the behavior" section.


    In particular, don''t bother the button''s onClick property.


    +   3. Modify the activity''s code, as shown in Listing 3-4.


    The lines that you type set in boldface in Listing 3-4. Use the labels that you
    found in Step 2. For example, if your TextView component''s id is textView2, modify
    a line in Listing 3-4 as follows:


    ```

    textView = (TextView) findViewById(R.id.textView2);

    ```


    +   4. Run the app.'
