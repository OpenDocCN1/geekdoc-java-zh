    # Linux


    An operating system is a big program that manages the overall running of a process
    or a device. Most operating systems are built in layers. An operating system''s
    outer layers are usually in the user''s face. For example, both Windows and MacOS
    X have standard desktops. From the desktop, the user launches programs, manages
    windows, and does other important things.


    An operating system''s inner layers are (for the most part) invisible to the user.
    While the user plays Solitaire, for example, the operating system juggles processes,
    files, keeps an eye on security, and generally does the kinds of things that the
    user shouldn''t have to micage.


    At the deepest level of an operating system is the kernel. The kernel runs directly
    on the processor''s hardware and does the low-level work required to make the
    processor. In a truly layered system, higher layers accomplish by making calls
    to lower layers. An app with a specific hardware request sends the request (directly
    or indirectly) through the kernel.


    The best-known, best-loved general purpose operating systems are Windows, Macintosh
    OS X (which is really Unix), and Linux. Both Windows and Mac OS X are the properties
    of their respective companies. But Linux is open source. That''s one reason why
    your TiVo runs Linux and why the creators of Android based their platform on the
    Linux kernel.


