  md: "Here's how member access works:\n\n+   - A default member of a class (a member\
    \ whose declaration doesn't contain the words public, private, or protected) can\
    \ be used by any code inside the same package as that class.\n- A private member\
    \ of a class cannot be used in any code outside the class.\n- A public member\
    \ of a class can be used wherever the class itself can be used that:\n  - Any\
    \ program in any package can refer to a public member of a class.\n  - For a program\
    \ to reference a public member of a default access class, the program must be\
    \ inside the same package as the class.\n\nTo see these rules in action, check\
    \ out the public class in Listing 9-16.\n\n# LISTING 9-16: A Class with Public\
    \ Access\n\n```\npackage com.allyourcode.bank;\n\npublic class Account {\n   \
    \ public String customerName;\n    private int internalNumber;\n    String address;\n\
    \    String phone;\n    public int socialSecurityNumber;\n    int accountType;\n\
    \    double balance;\n\n    public static int findById(int internalNumber) {\n\
    \        Account foundAccount = new Account();\n        // Code to find the account\
    \ goes here.\n        return foundAccount.internalNumber;\n    }\n}\n```\n\nThe\
    \ code in Figures 9-23 and 9-24 uses the Account class and its fields."
