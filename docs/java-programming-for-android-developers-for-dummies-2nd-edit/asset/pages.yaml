  md: 'And so on. Each application of a set method takes an existing instance and
    yields an instance with more and better properties.


    Notice how readable Listing 13-3 is compared to the incorrect code snippets in
    this section. This elegant way of adding properties to an object is the builder
    pattern.


    After adding enough properties to a configuration builder, you call the builder''s
    own method to create a factory. Then you can use the factory to create an instance
    of the Twitter class:


