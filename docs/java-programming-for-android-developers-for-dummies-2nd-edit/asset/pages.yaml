    # ## The code name is of interest to the creators of Android.


    A code name refers to the work done by the creators of Android to bring Android
    to the next official level. Android''s code names are desserts, working in alphabetical
    order starting with Cupcake, Donut, Eclair, and so on. Picture Google''s engineers
    working for months closed doors on Project Marshmallow.


    In recent years, this naming scheme became a lot more transparent. For example,
    Google created an online poll to help decide on N as the successor to Android
    Marshmallow. After a month of voting, Android Nougat was announced.


    An Android version may have variations. For example, plain ol'' Android 6.0 has
    an established set of features. To plan ''ol'' Android 6.0 can add the Google
    Play Services (the ability to install apps from Google Play) and still be using
    platform 6.0. You can also add a special of features tailored for various phone
    manufacturers.


    As a developer, your job is to balance portability with feature-richness. When
    you create an app, you specify a minimum Android version. (You can read more about
    this topic in Chapter 3.) The higher the version, the more features your app can
    have. On the flip side, the higher the version, the fewer devices that can run
    your app.


    # # The Developer Perspective


    Android is a multifaceted beast. When you develop for the Android platform, you
    use many toolsets. This section gives you a brief rundown.


    # Java


    James Gosling of Sun Microsystems created the Java programming language in the
    mid-1990s. (Sun Microsystems has since been bought by Oracle.) Java''s meteoric
    rise in stemmed from the elegance of the language and its well-conceived platform
    architecture. After a blaze of glory with applets and'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'the web, Java settled into being a solid, general-purpose language with a special
    strength in servers and middleware.


    In the meantime, Java was quietly seeping into embedded processors. Sun Microsystems
    was developing Java Mobile Edition (Java ME) for creating small apps to run on
    mobile phones. Java became a major technology in Blu-ray disc players. So the
    decision to make Java the primary language for Android apps is no surprise.


    An embedded processor is a computer chip that is hidden from the user as part
    of a special-purpose device. The chips in cars are now embedded processors. and
    the silicon that powers the photocopier at your workplace is an embedded processor.
    Pretty soon, the flowerpots on your windowsill will have embedded processors.


    ![](img/95a31530e90066e5e41d72a5efed3158_29_0.png)


    Figure 1-2 describes the development of new Java versions over time. Like Android,
    each Java version has several names. The product version is an official name that''s
    used for the world in general, and the developer version is a name that identifies
    versions so that programmers can keep track of them. (In casual conversation,
    developers use all kinds of names for the various Java versions.) The code name
    is a more playful name that identifies a version while it''s being created.


    The asterisks in Figure 1-2 mark changes in the formulation of Java product-version
    names. Back in 1998, the product versions were Java Kit 1.0 and Java Development
    Kit 1.1. In 1999, someone decided to christen the product Java 2 Standard Edition
    1.2, which confuses everyone to this day. At the time, anyone using the term Java
    Development Kit was asked to use Software Development Kit (SDK) instead.


    In 2004 the business went away from the platform version name, and in 2006, Java
    platform lost the 2 and the .o. For Java SE 9, the developer versions stopped
    numbers like 1.9 and became plain 0.


    By far the most significant changes for Java developers came with JSE 5.0 and
    Java SE 8. With the release of JSE 5.0, the overseers of Java made changes to
    the language by adding many new features — features as generic types, annotations,
    varags, and the enhanced for statement. With Java SE 8 came new functional programming
    features.


    To see Java annotations in action, go to Chapter 10. For examples of the use of
    generic types, varags, and the enhanced for statement, see Chapter 12. To read
    about functional programming features, see Chapter 11.


