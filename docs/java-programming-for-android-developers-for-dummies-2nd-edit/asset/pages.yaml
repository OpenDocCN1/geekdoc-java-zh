    # Using an interface


    The relationship between a class and its subclass is one of inheritance. In many
    real-life families, a child inherits assets from a parent. That''s the way it
    works.


    But consider the relationship between an editor and an author. The editor says,
    "By signing this contract, you agree to submit a completed manuscript by the fifteenth
    of August.\ Despite these excuses that the author gives before the deadline, the
    relationship between the editor and the author is one of obligation. The author
    agrees to take certain responsibilities; and, in order to continue being an author,
    the must fulfill all responsibilities. (By the way, there''s no subtext in this
    paragraph—none at all)


    Now consider Barry Burd. Who? Barry Burd—that writes Java Programming For Developers,
    2nd Edition, and certain other For Dummies books (all from Wiley Publishing).
    He''s a college professor, and he''s also an author. You want to mirror this situation
    in a Java program, but Java doesn''t support multiple inheritance. You can''t
    extend both a Professor and an Author class at the same time.


    Fortunately for Barry, Java has interfaces. A class can extend only one parent
    class, but a class can implement multiple interfaces. A parent class is a bunch
    of staff that a class inherits. On the other hand, as the relationship between
    an editor and an author, an interface is a bunch of staff that a class is obliged
    to provide.


    Here''s another example. Listings 10–2 through 10–5 describe what it means to
    be an employee of various kinds. Though a company might hire consultants, consultants
    who work for the company aren''t employees. Consultants are normally employed.
    They show up temporarily to help companies solve problems and then leave the company
    elsewhere. In the United States, differentiating between an employee and a consultant
    is important: labeling a consultant "employee" of any kind would subject the company
    to considerable legal risk.


    To consult with employees in your code, you need a Consultant class that separates
    from your existing Employee class hierarchy. On the other hand, consultants have
    a lot in common with a company''s regular employees. For example, every consultant
    has a String method. You want to represent this commonality in your code, so you
    create an interface. The interface obligates a class to give meaning to the method
    name getPayString, as shown in Listing 10–7.'
