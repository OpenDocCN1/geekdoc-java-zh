    # # The chicken or the egg


    Which comes from the first method or the method declaration? Look again at Figure
    4-9. The figure contains a call to the shout method. The method makes Android
    execute the statements inside the shout method''s body.


    But the statements inside the shout method''s body are themselves methods. They''re
    calls to a method named append. The first append adds the word Help to the textView
    component''s text. The second append adds three exclamation points and a blank
    space to the textView component''s text.


    You don''t see the append method''s declaration, because the append method is
    part of Android''s build-in API. As an Android developer, you don''t deal directly
    with the method''s declaration. All you do is call the method when you need it.


    # # How many parameters?


    In Java, double quotation marks denote a string of characters. So the call


    ```

    shout("I''m trapped inside a smartphone");

    ```


    contains one parameter. That single parameter is a string of characters.


    Some functions have one parameter. Other functions have more than one parameter.
    Still other functions have no parameters. Listing 4-2 has an example.'
