    # # What''s Barry''s excuse?


    For years, I''ve been telling my students to put all kinds of comments in their
    code, and for years, I''ve been creating sample code (as the code in Listing 4–3)
    containing few comments. Why?


    Three little words: "Know your audience." When you write complicated, real-life
    code, your audience consists of other programmers, information technology managers,
    and people who need help deciphering what you do. But when I write simple samples
    of code for this book, my audience is you — the novice programmer. Rather read
    my comments, your best strategy is to stare at my Java statements — the statements
    that Java''s compiler deciphers. That''s why I put so few comments in this book''s
    listings.


    Besides, I''m a little lazy.'
