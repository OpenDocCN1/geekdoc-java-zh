  md: 'instructions on any processor. If you write a Java program and compile that
    Java program into Dalvik bytecode, your Android phone can run the bytecode, your
    Android tablet can run the bytecode, your Chromebook can run the bytecode, and
    even your grandmother''s supercomputer can run the bytecode. If your grandmother
    wants to do this, she should install Remix OS, a special port of the Android operating
    system, on her Intel-based machine. Tell her to visit www.jide.com/remixos-for-pc.


    You never have to write or decipher Java bytecode or Dalvik bytecode. Writing
    bytecode is the compiler''s job. Deciphering bytecode is the virtual machine''s
    job.


    ![](img/95a31530e90066e5e41d72a5efed3158_38_0.png)


    Both Java bytecode and Dalvik bytecode have virtual machines. Java bytecode''s
    virtual machine is called (big surprise) the virtual machine (JVM). Dalvik-s virtual
    machine is called the Android runtime (ART).


    With the Android runtime, you can take a file that you created for one Android
    device, copy the bytecode to another Android device, and run the bytecode with
    no trouble. That''s one of the many reasons Android has become popular quickly.
    This outstanding feature, which lets you run on many different kinds of processors,
    is portability.


    Imagine that you''re the Intel representative to the United Security Council,
    as shown in Figure 1-3. The ARM representative is seated to your right, and the
    representative from Qualcomm is to your left. (Naturally, you don''t get along
    with either of these people. What do you expect? It''s politics!) The distinguished
    representative from Dalvik is at the podium. The Dalvik representative speaks
    in Dalvik bytecode, and neither you nor your fellow ambassadors (ARM and Qualcomm)
    understand a word of Dalvik bytecode.


    Each of you has an interpreter. Your interpreter translates from Dalvik-to Intel
    instructions as the Dalvik representative speaks. Another interpreter translates
    from bytecode to "ARM-ese." And a third interpreter translates bytecode into "Qualcomm-speak.".


    Think of your interpreter as a virtual ambassador. The interpreter doesn''t really
    represent your country, but the interpreter performs one important task that a
    real ambassador performs: It listens to Dalvik bytecode on your behalf. The interpreter
    does what you would if your native language were Dalvik bytecode. The interpreter,
    pretending to be the Intel ambassador, endures the boring bytecode speech, taking
    in every word and processing each one in some way or other.


