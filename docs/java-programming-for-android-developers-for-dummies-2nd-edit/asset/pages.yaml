    Of course, these two statements only serve as a summary, and matter is never the
    same as the material it summarizes. Imagine standing on the street in Times Square
    and shouting this statement: "Twitter dot update status: This is my tweet." Nothing
    good happens because you''re issuing the correct command in the wrong context.
    In the same way, the context surrounding a call to twitter.updateStatus in an
    app matters an awful lot.


    This chapter covers all the context surrounding your calls to twitter.updateStatus
    and twitter.getUserTimeline. In the process, you can read about Java''s exceptions
    a vital feature that is available to all Java programmers.


    # The Twitter App''s Files


