    # Using Android Studio


    Android Studio is the Swiss army knife for Android developers. Android Studio
    is a customized version of IntelliJ IDEA — a general-purpose IDE with tools for
    Java development, C/C++ development, PHP development, modeling, project management,
    testing, debugging, and much more.


    In this section, you will get an overview of Android Studio''s main window. I
    focus on the most useful features that help you build Android apps, but keep in
    mind that Android Studio has hundreds of features and many ways to access each
    feature.


    # Starting up


    Each app belongs to a project. You can have dozens of projects on your computer''s
    hard drive. When you run Android Studio, each of your projects is either open
    or closed. An open project appears in a window (its own window) over your computer
    screen. A closed project doesn''t appear in a window.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Several of your projects can be open at the same time. You can switch between
    projects by moving from window to window.


    I often refer to an open project''s window as Android Studio''s main window. This
    can be slightly misleading because, with several projects open at a time, you
    have several main windows open at a time. None of these windows is more “main”
    than the others.


    If Android Studio is running and no projects are open, Android Studio displays
    its Welcome screen. (Refer to Figure 2-4) The Welcome screen may display recently
    closed projects. If so, you can open a project by clicking its name on the Welcome
    screen. For an app''s not on the Recent Projects list, you can click the Welcome
    screen Open an Existing Android Studio Project.


    If you have any projects open, Android Studio does not display the Welcome screen.
    In that case, you can open another project by choosing File:Open in an open project''s
    window. To close a project, you can choose File:Close Project, or do whatever
    you need to close one of the windows on your computer. (On a PC, click the X in
    the window''s upper-right corner. On a Mac, click the red button in the window''s
    upper-left corner).


    Android Studio remembers which projects were open from last time. If any projects
    were open when you quit Android Studio, those projects open again (with their
    main windows showing) the next time you launch Android Studio. In Android Studio
    on a Windows computer, start by choosing Settings: Appearance and Behavior: System
    Settings. In Android Studio on a Mac, choose Android Studio: Preferences: Appearance
    and Behavior. In either case, uncheck the Reopen Last Project on Startup box.


    # The main window


    Android Studio''s main window is divided into several areas. Some of these areas
    can appear and disappear upon your command. What comes next is a description of
    the areas in Figure 2-7, moving from the top of the main window to the bottom.


    The areas that you see on your computer screen may be different from the areas
    in Figure 2-7. Usually, that''s okay. You can make areas and go by choosing certain
    menu options, including the View option on Android Studio''s main menu bar. You
    can also click the little tool buttons on the edges of the main window.


