    icon, you can see your beautiful (and informative) documentation pages.


    You can find the documentation pages for Android''s built-in API classes by visiting
    https://developer.android.com/reference/packages.html. Android''s API contains
    thousands of classes, so don''t memorize the names of the classes and their methods.
    Instead, you simply visit these online documentation pages.


