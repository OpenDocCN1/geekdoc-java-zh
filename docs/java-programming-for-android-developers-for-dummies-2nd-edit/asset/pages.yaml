  md: '# THE GREATEST? YES! THE LATEST?

    MAYBE NOT!


    In mid-2016, the page https://developer.android.com/studio/install.html observes
    "..! known stability issues in Android Studio on Mac when using JDK 1.8. Until
    these issues are resolved, you can improve stability by downgrading your JDK to
    an older version (no lower than JDK 1.6). To make things even trickier, I''ve
    tried running Android Studio with the soon-to-released Java 9 and it''s complete
    "no go." If you''re squamish about Java versions, you might want to install Java
    7 instead of whatever version is foremost on Oracle''s download page. Follow the
    link for Archives or Legacy on https://oracle.com/network/java/javase/downloads
    page, and follow the links to download older versions of the Java JDK.


    Should you remove existing versions of Java before installing new versions? Not
    necessarily. Different versions of Java can coexist on a single computer. But
    sometimes, when you have more than one version, Android Studio can''t find the
    most appropriate version. In this case, you can''t install Android Studio. Or,
    if you can install Android Studio, you''ll get a message saying your computer
    has no version of the Java JDK or the wrong version of the Java JDK. I recommend
    uninstalling all versions of Java except the one that you most recently. Here''s
    how:


    +   * On Windows, search for Control Panel in order to install the Control Panel
    screen. In the Control Panel''s search field, type Programs and Features or Add
    Remove Programs. When you''ve reached the Programs and Features or Add or Remove
    Programs, look for anything with the word Java in its name, such as Java 8 Update
    91 or Java SE Development Kit 8 Update 9. Try double-clicking, or right-clicking
    any item that you want to uninstall.

    * On a Mac, use the Terminal app in the Utilities subfolder of your Applications
    folder. In the Terminal''s search, type


    ```

    cd /Library/Java/VirtualMachines

    ```


    In the computer''s response, look for names like jdk-9.jdk, jdk1.8._0_06, jdk,
    or 1.7._0. jdk. Say, for the sake of argument, that you want to remove Java 8
    from your Mac. Then type the following command in the Terminal:


    ```

    sudo rm -rf jdk1.8._0_06.jdk

    ```


    After you do so, the Terminal asks for your password. After typing your password
    and pressing Enter, you''re all set.'
