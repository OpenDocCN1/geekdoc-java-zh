    ![](img/95a31530e90066e5e41d72a5efed3158_332_1.png)


    The statement ArrayList ArrayList = new ArrayList() creates an empty list

    of things and makes the ArrayList refer to that empty list. What does a

    look like when it''s empty? I don''t know. It looks like a blank sheet of

    paper. The difference between having an empty list and having no list is

    important. Before executing ArrayList ArrayList = new ArrayList(), you have

    no list. After executing ArrayList ArrayList = new ArrayList(), you have a list

    that happens to be.


    After calling ArrayList.add, the list is no longer empty. The code in Listing
    12-1

    calls arraylist.add four times in order to put these four objects (all strings)
    into

    the list:


    +   - "Hello"

    - ""

    - "readers"

    - "!"


    Each object in the list has an index — a number from 0 to 3. You can think of

    object''s index as the position in the list. The string "Hello" has index 0,

    the string " " has index 1, the string "readers" has index 2, and the string "!"

    has index 3.


    ![](img/95a31530e90066e5e41d72a5efed3158_332_2.png)


    In a Java collection, the initial index is always 0, not 1.


    An ArrayList instance''s get method fetches the object for a particular index.
    So,

    in Listing 12-1, arrayList.get(0) is "Hello", ArrayList.get(1) is "", and so

    on. To display all the strings in the list, the for statement in Listing 12-1
    marches

    from index 0 to index 1, and then 2, and finally 3.


