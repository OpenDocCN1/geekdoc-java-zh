  md: '# Shared preferences


    When a user selects the Scores menu item (the Info icon), the app displays the
    score for the current game and the high score for all games. (Refer to Figure
    14-3.) The high score display applies to only one device — the device that''s
    running the current game. To remember the high score from one run to another,
    I use Android''s Shared Preferences feature.


    Android provides several ways to store information from one run of the app to
    the next. In addition to using shared preferences, you can store information in
    the device''s SQLite database. (Every Android device has SQLite database software.)
    You can also store information in an ordinary Linux file or on a network host
    of some kind.


    ![](img/95a31530e90066e5e41d72a5efed3158_416_0.png)


    Here''s how you wield a set of shared preferences:


    +   ** create shared preferences, you call the activity''s getShared Preferences
    method.


    In fact, the getSharedPreferences method belongs to Android''s Context class,
    and the Activity class is a subclass of the Context class.


    In Listing 14-2, I call getSharedPreferences in the activity''s showScores method.
    The parameter, MODE_PRIVATE, tells Android that no other app can read or write
    to this shared preferences. (I know — there is nothing ''shared'' about something
    that no other app can use. But that''s the way Android''s terminology works.)


    Aside from MODE_READABLE, the alternatives are described in this list:


    +   - MODE_WORLD_READABLE: Other apps can read from these preferences.

    - MODE_WORLD_WRITEABLE: Other apps can write to these preferences.

    - MODE_MULTI_PROCESS: Other apps can write to these preferences even when an app
    is in the middle of a read operation. Weird things can happen with this concurrency.
    If you use MODE_MULTI_PROCESS, watch out!


    You can combine modes with Java''s bitwise or operator (|). A call such as


    ```

    getSharedPreferences(MODE_WORLD_READABLE | MODE_WORLD_WRITEABLE);

    ```


    makes your preferences both readable and writable for all other processes.


    +   ** start adding values to a set of shared preferences, you use an instance
    of the SharedPreferences.Editor class.


    In Listing 14-2, I make a new editor object. Then I use the editor to add ("highScore",
    highScore) to the shared preferences. Taken together, ("highScore", highScore)
    is a key/value pair. The value (whatever number'
