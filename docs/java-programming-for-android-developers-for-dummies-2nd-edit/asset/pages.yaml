    # Take a break


    This might surprise you: The end of a case clause (the beginning of another

    case clause) doesn''t automatically make the program jump out of the switch

    statement. If you forget to add a break statement at the end of a case clause,
    the

    program finishes the statements in the next case clause and then continues executing
    the

    statements in the next. Imagine that the following code (omit

    R.id.buttonAdd''s break statement):


    ```

    case R.id.buttonAdd:

    operatorSymbol = "+";

    result = numberLeft + numberRight;

    R.id.buttonSubtract:

    operatorSymbol = "-";

    result = numberLeft - numberRight;

    break;

    ...etc.

    ```'
