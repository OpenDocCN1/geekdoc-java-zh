  md: '# IN THIS CHAPTER

    >> Making decisions with Java statements

    >> Repeating actions with Java statements


    # Chapter 8

    What Java Does (and When)


    Human thought centers around nouns and verbs. Nouns are the “stuff,” and verbs
    are the stuff’s actions. Nouns are the pieces, and verbs are the glue. Nouns are,
    and verbs do. When you use nouns, you say “book,” “room,” or “stuff.” When you
    use verbs, you say “do this,” “do that,” “tote barge,” or “lift bale.


    Java also has nouns and verbs. Java’s nouns include int and String, along with
    Android-specific terms such as AppCompatActivity, EditText, and TextView. Java’s
    verbs involve assigning values, choosing among alternatives, repeating actions,
    and taking other courses of action.


    This chapter covers some of Java’s verbs. (In the next chapter, I bring the nouns.)


