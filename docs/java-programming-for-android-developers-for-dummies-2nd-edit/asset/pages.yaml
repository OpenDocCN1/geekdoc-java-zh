    # What is a virtual machine?


    In the section "What is a compiler?" earlier in this chapter, I make a big fuss
    about phones and other devices following instructions the ones in Listing 1-3.
    As it goes, it''s a nice fuss. But if you don''t read every word, you may be-guided.
    The text says "... processors follow cryptic instructions like the ones in Listing
    "blah-blah-blah.". The instructions in Listing 1-3 are a like instructions that
    a phone or tablet can execute, but computers generally do not execute Java instructions,
    and phones do not execute Dalvik instructions. Instead, each processor has its
    own set of executable instructions, and each operating system uses the processor’s
    instructions in a slightly different way.


    Imagine that you have two devices: a smartphone and a tablet computer. The devices
    have two different kinds of processors: The phone has an ARM processor, and the
    tablet has an Intel Atom processor. (The acronym ARM stood for Advanced RISC Machine.
    These days, ARM stands for ARM Holdings, a company who employs design processors.)
    The multi-instruction is 00000. On an Intel processor, the multiply instructions
    are D8, DC, F6, F7, and others. Many ARM instructions have no counterparts in
    the Atom architecture, and many Atom instructions have no equivalents on an ARM
    processor. An ARM processor’s instructions make no sense to your tablet’s Atom
    processor, and an Atom processor’s instructions would give your phone’s ARM processor
    a virtual headache.


    What’s a developer to do? Does a developer provide translations of every app into
    every processor’s instruction set?


    No. Virtual machines create order from all this chaos. Dalvik bytecode is similar
    to the code in Listing 1-3, but Dalvik bytecode isn''t specific to a single kind
    of processor or a single operating system. Instead, a set of Dalvik bytecode


