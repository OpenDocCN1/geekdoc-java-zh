  md: 'As in English and most other spoken languages, the names of items are reusable.
    For example, a recent web search turns up four people in the United States named
    Barry Burd (with the uncommon spelling). You can even reuse well-known names.
    (A fellow student at Temple University had the name John Wayne, and in the 1980s
    two textbooks were titled Pascalogriths.) The Android API has a prewritten class
    named MainActivity, but that doesn''t stop you from defining another name for
    MainActivity.


    Of course, duplicating names can lead to trouble, so intentionally reusing a well-known
    name is a bad idea (If you create your own thing named MainActivity, you''ll find
    it difficult to refer to the prewritten MainActivity class in Android. As for
    my fellow Temple University student, everyone laughed when the teacher called
    roll.)


    # The names of classes


    I''m known by several different names. My first name, used for informal conversation,
    is Barry. A longer name, used on this book''s cover, is Barry Burd. The legal
    name that I use on tax forms is Barry A. Burd, and my passport (the most official
    document I) sports the name Barry Abram Burd.


    In the same way, elements in a Java program have several different names. For
    example, the class that''s created in Listing 4-1 has the name MainActivity. The
    class''s simple name counts because, well, it''s simple and it''s


    Listing 4-1 begins with the line package org.allcode.a04_01. The first line is
    a package declaration. Because of this declaration, the newly created MainActivity
    is inside a package named org.allcode.a04_01. Soorg.allcode.a04_01 MainActivity
    is the class''s fully qualified name.


    If you''re sitting with me in my living room, you probably call me Barry. If you''ve
    never met me and you''re looking for me in a crowd of thousands people, you probably
    out the name Barry Burd. In the same way, the choice between class''s simple name
    and its fully qualified name depends on the context.


    In 4-1, the lines


    ```

    import android.os.Bundle;

    import android.support.v7.app.AppCompatActivity;

    ```


    two import declarations. An import declaration uses a class''s fully qualified
    name. In Android''s API, the Bundle class is in the android.os package, and the
    AppCompatActivity class is in the android.support.v7.app package.'
