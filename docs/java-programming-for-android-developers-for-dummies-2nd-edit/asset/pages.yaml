    # >> To adding values to a set of shared preferences, you call the editor''s commit
    method.


    In the Shows method in Listing 14-2, the statement editor.commit() does the job.


    # >> To read values from an existing set of shared preferences, you call get,
    getInt, getFloat, or one of the other methods belonging to the SharedPreferences
    class.


    In the Shows method in Listing 14-2, the call to getInt takes parameters. The
    first parameter (the string "highscore") value identifies a particular piece of
    information. The second parameter (the int value=0) is a default value. So when
    you call prefs.getInt("highScore", 0), the following applies:


    +   - if prefs has no key with "highscore", the method returns 0.

    - if prefs has a previously stored "highscore" value, the method returns that
    value.


    # Informing the user


    Near the bottom of Figure 14-3, a capsule-shaped pop-up contains the words Game
    Over. Figure 14-4 has a similar pop-up. These pop-ups illustrate the use of Android''s
    Toast class. A toast is an unobrusive little view that displays useful information
    for a brief period. A Toast view pops up on the screen with a hot piece of bread
    pops from a toaster. (Rumor it has that the Android class name Toast comes from
    this analogy.)


    The Toast has two extremely useful methods: makeText and show.


    # >> The Static Toast.makeText method creates an instance of the Toast class.


    The makeText method has three parameters:


    +   - The first parameter is a context (the word in this makeText calls in Listing
    14-2).'
