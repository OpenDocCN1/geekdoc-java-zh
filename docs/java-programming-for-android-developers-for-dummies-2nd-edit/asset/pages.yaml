    # What does static mean?


    This chapter begins with a discussion of cheese and its effects on Andy''s business
    practices. Andy has a blank form that represents a class. He also has a bunch
    of filled-in forms, each of which represents an individual bag-of-cheese object.


    One day, Andy decides to take inventory of his cheese by counting all the bags
    of cheese. (See Figure 9-28).


    Bag of Cheese

    | | |

    |---||

    | Kind: | |

    | Weight (in pounds): | |

    | Age (in days): | |

    | Domestic?: | [drop down] |

    | Bag count: | 377 |


    ![](img/95a31530e90066e5e41d72a5efed3158_273_1.png)


    Compare the various fields shown in Figure 9-28. From the object-oriented point
    of view, how the daysAged field so different from the count field?


    The answer is that a single bag can keep track of how many days it has been aged,
    but it shouldn''t count all the bags. As far as Listing 9-1, a BagOfCheese object
    has its own daysAged field. That makes sense. (Well, it makes sense to an object-oriented
    programmer.


    But giving a particular object responsibility of counting all in its class doesn''t
    seem fair. To have each BagOfCheese object speak on behalf of all the others violates
    a primitive directive of computer programming: The structure of the program should
    imitate the real-life data. For example


    A field to count all bags of cheese belongs in one central place. That''s why,
    in Figure 9-29, I have one, and only one, count field. Each object has its own
    daysAged value, but only the class itself has a count value.


    260 PART 3 Working with the Big Picture: Object-Oriented Programming'
