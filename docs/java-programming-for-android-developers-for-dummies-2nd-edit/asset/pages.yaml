    # Getting OAuth keys and tokens


    For your Android app to communicate with Twitter servers, you need your OAuth
    keys and tokens. To get them, follow this section''s steps.


    The following instructions apply to the Twitter web pages for developers at the
    time of this book''s publication. Twitter might change the design of its website
    at any time without notice. (At any rate, it won''t notify you!)


    ![](img/95a31530e90066e5e41d72a5efed3158_368_0.png)


    +   - Sign in to your Twitter user account (or register for an account if you
    don''t already have one).


    +   - Visit https://dev.twitter.com/apps/new.


    > If the stars are aligned harmoniously, you should see Twitter''s Create an Application
    page.


    +   - On the Create an Application page, fill in all required fields along with
    the (misleadingly) Callback URL field.


    When I visit the page, I see the Name field, the Description field, the Website
    field, and the Callback URL field. All but the Callback URL field are listed as
    being required.


    Typing your app''s name in the Name field is a no-brainer. But what do you use
    for the other fields? After all, you''re creating an industrial-strength Android
    app. You''re creating only a test app—an app you hope to use Twitter4j.


    The good news is that you can type almost anything in the Description field. The
    same is true for the Website and Callback URL fields, as long as you type things
    that look like real URLs.'
