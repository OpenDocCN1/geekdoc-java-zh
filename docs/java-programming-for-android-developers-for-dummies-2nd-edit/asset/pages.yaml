  md: '# What does Mom''s Restaurant have to do with Java?


    When you drill down inside the code of a Java class, you find these two important
    elements:


    +   - **Method declaration:** The "recipe"

    - "If anyone ever asks, here''s how to make scrambled eggs."

    - **Method call:** The "customer order"


    Joe says, "I''ll have the breakfast special with two scrambled eggs." It''s time
    for you to follow the recipe.


    ![](img/95a31530e90066e5e41d72a5efed3158_119_0.png)


    Almost every programming language has elements akin to Java''s methods. If you''ve
    worked with other languages, you may recall terms like subprogram, procedure,
    function, subroutine, subprocedure, and PERFORM statement. Whatever you call a
    method in your favorite programming language it''s a bunch of instructions, collected
    in one place and waiting to be executed.


    A method declaration is a plan describing the steps that Java will take and when
    the method is called into action. A method call is one of those to call as action.
    As a Java developer, you write both method declarations and method calls. Figure
    4–5 shows you a method declaration and method calls.


    4–5 doesn''t contain a complete Java program, so you can''t run the figure''s
    code in Android Studio. But the figure illustrates some facts about method declarations
    and method calls.


    ![](img/95a31530e90066e5e41d72a5efed3158_119_1.png)


    If I''m being lazy, I refer to the code in the upper box in Figure 4–5 as a method.
    If I''m not being lazy, I refer to it as a method declaration.


    # Method declaration


    One of Mom''s recipes, a method declaration is a list of instructions: "Do this,
    then do that, and then do this other thing." And, like each of Mom''s recipes,
    each has a name. In Figure 4–5, the method declaration''s name is shout. You won''t
    find the shout method in any of Android''s API documentation. I made up the shout
    method especially for this chapter.


    Another term for an instruction in a Java program is a Java statement, or simply
    a statement. In Figure 4–5, the shout method contains two statements. The first
    statement tells Java to append a message to the text in a particular component
    (whatever component the text refers to). The second statement tells Java to append
    three asterisks and a blank space to the text in that component.


    ![](img/95a31530e90066e5e41d72a5efed3158_119_2.png)


    106 PART 2 Writing Your Own Java Programs'
