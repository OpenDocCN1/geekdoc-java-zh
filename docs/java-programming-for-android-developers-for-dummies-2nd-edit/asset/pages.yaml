  md: "# Lambda Expressions\n\nIf you open Listing 11-4 in Android Studio's editor\
    \ and hover the mouse over the words OnClickListener, you get an interesting surprise.\
    \ (See Figure 11-15.) Android Studio tells you that you can replace the anonymous\
    \ inner class with a lambda expression.\n\n![](img/95a31530e90066e5e41d72a5efed3158_326_0.png)\n\
    \n```\nbutton = (Button) findViewById(R.id.button);\nbutton.setOnClickListener(new\
    \ OnClickListener() {\n    // Anonymous new OnClickListener can be replaced with\
    \ a lambda more... (111)\npublic void onClick(View view) {\n```\n\nOkay. What's\
    \ a lambda expression? lambda is a letter in the Greek alphabet, and the term\
    \ lambda expression comes from papers written in the 1930s by mathematician Alonzo\
    \ Church.\n\nIn 2013, Oracle released Java 8, adding lambda expressions to the\
    \ Java language. In 2016, Google made Java 8 features available to Android developers.\n\
    \nI still haven't told you what a lambda expression is. A lambda expression is\
    \ a concise way of declaring an interface that contains only one method. In Listing\
    \ 11-4, the anonymous OnClickListener has only one method, the only onClick method.\
    \ You can replace this anonymous OnClickListener with a lambda expression.\n\n\
    If you respond to the message in Figure 11-15 by pressing Alt-Enter, Android Studio\
    \ offers a Replace with Lambda option. If you accept this option, Android Studio\
    \ turns your code into the style shown in Listing 11-5.\n\n# LISTING 11-5: Using\
    \ a Lambda Expression\n\n```\npackage com.myappcode.ai_01;\n\nimport android.os.Bundle;\n\
    import android.support.v7.app.AppCompatActivity;\nimport android.widget.Button;\n\
    import android.widget.TextView;\n\npublic class MainActivity extends AppCompatActivity\
    \ {\n    Button button;\n    TextView textView;\n\n(continued)\n```"
