  md: 'You can get older software and newer software by clicking links in Android
    Studio''s notifications, but you can also be proactive and reach out for different
    versions of Android''s tools and APIs. To help you do this, you will have two
    “manager” tools—the SDK Manager and the AVD Manager. The next few sections cover
    these tools in depth.


    When you first install Android Studio, you can quickly skip the next two sections.
    Return to these sections when Google updated versions of Android or when you work
    on a project that requires older versions of Android (versions that you haven''t
