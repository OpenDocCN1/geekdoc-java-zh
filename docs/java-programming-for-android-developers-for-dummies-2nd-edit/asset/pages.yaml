    ![](img/95a31530e90066e5e41d72a5efed3158_348_0.png)


    In Listing 12-8, the ordinary for loop uses indices, each index marked by square
    brackets. As it is with all Java collections, the initial value''s index is 0,
    not 1. Notice also the number 4 in the array the declaration - it indicates that

    "you store 4 values in the array." The number 4 doesn''t indicate that "you

    assign a value to myArray[4]." In fact, if you add a statement as myArray[4] =

    "Oops!" to the code in Listing 12-8, you get a nasty error (Array

    IndexOutOfBoundsException) when you run the program.


    The statement String[] myArray = new String[4] creates an empty array and

    makes the myArray variable refer to that empty array. The array can potentially

    store as many as four values. But, initially, that variable refers to an array

    contains no values. It is not until Java executes the first assignment

    myArray[0] = "Hello" that the array contains any values.


    You can easily find the 100th value stored in an array

    (myArray[100]) or the 1,000,000th value stored in an array (myArray[1000000]).

    Not bad for a day''s work. So, what''s the downside of using an array? The biggest

    dadvantage of an array is that each array has a fixed limit on the number of

    values it can hold. When you create the array in Listing 12-8, Java reserves

    as many as five String values. If, later in the program, you decide that you

    store a fifth element in the array, you need some clumsy, inefficient code

    to make yourself a larger array. You can also overestimate the size you need for
    an

    array, as shown in this example:


    ```

    String[] myArray = new String[2000000];

    ```


    When you overestimate, you probably waste a lot of memory space.


    Another unpleasant feature of an array is the difficulty you can have in inserting

    ew values. Imagine having a wooden box for each year in your collection of

    emperor Constantine Comics. The series dates back to the year 307 A.D., when Con-

    stine became head of the Roman Empire. You have only 1700 boxes because

    You''re missing about six years (from the years 1150 to 1155). The boxes

    aren''t numbered, but they''re stacked one after another in chronological order

    a a line that''s 200 meters long. (The line is as long as the 55th floor of a
    sky-

    scraper is all.)


