  md: '# WORDS, WORDS, WORDS


    The Java language uses two kinds of words: keywords and identifiers. You can tell
    which words are keywords, because Java has only 50 of them. Here''s the complete
    list:


    | abstract | continue | new | switch |

    |---|---|---|---|

    | assert | default | goto | package | synchronized |

    | boolean | do | if | private | this |

    | break | double | implements | protected | throw |

    | byte | else | import | public | throws |

    | case | enum | instanceof | return | transient |

    | catch | extends | interface | short | void |

    | char | | static | | |

    | class | finally | long | strictfp | volatile |

    | const | | float | super | while |


    As a rule, a *keyword* is a word whose meaning never changes (from one Java program
    to another). For example, in English, you can''t change the meaning of the word
    *if*. It doesn''t make sense to say, "I think that I shall if/ A poem lovely as
    a riff." The same concept holds in a Java program: You can type `if (x > 5)` to
    mean "If x is greater than 5," but when you type `if (x > if)`, the computer finds
    that the code doesn''t make sense.


    In addition to keywords, Java has other words that play special roles in the language.
    You can''t make your own meanings for the words false, `null`, and `true`, but
    for technical reasons, these words aren''t considered keywords. The words *module,
    requires, exports, dynamic, to, uses, provides,** are restricted keywords. You
    can make meanings for them in some parts of your Java code, but not in other parts.


    In Listing 4-1, the words *class, import, public, extends, protected, and super*
    are keywords. Almost every other word in that listing is an *identifier*, which
    is generally a name for something. The identifiers in the listing include `MainActivity`,
    `AppCompatActivity,onCreate`, and a bunch of others.


    In programming language, words such as *Wednesday, Barry,* and *university* in
    the following sentence are identifiers, and the other words (*if, it, is, at,
    and the*) are keywords:


    > *If Wednesday, Barry, is at the university.*'
