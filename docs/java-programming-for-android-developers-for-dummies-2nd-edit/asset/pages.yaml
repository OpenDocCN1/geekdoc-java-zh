    # # Repeating Instructions

    Over and Over Again


    In 1966, the company that brings you Head & Shoulders shampoo made history. On

    t back of the bottle, the directions for using the shampoo read, "Lather, rinse

    repeat," Never before had a complete set of directions (for doing anything, let\alone
    shampooing hair) been summarized so succinctly. People in the direction-

    writing business hailed it as a monumental achievement. Directions like these

    stood in stark contrast to others of the time. (For instance, the first sentence
    on a

    can of spray brush, "Turn this so that it points away from your face." Puh!


    Aside from their bravery, the characteristic that made the Head & Shoulders direc-

    s so cool was, with three simple words, they managed to capture a notion

    that''s at the head of all step-by-step instruction-giving, namely, the notion
    of

    petition. That last word, repeat, turned an otherwise bland drone

    to a sophisticated recipe.


    When you follow directions, you usually don''t follow one instruction after

    another. Instead, you make turns in the road. You make decisions ("If HAIR IS

    DRY, then use CONDITIONER," and you repeat steps ("LATHER-RINSE, and

    then LATHER-RINSE again."). In application development, you use decision-

    making and repetition all the time.'
