  md: '# The game restarts whenever you change the device''s orientation.


    If you tilt the device from Portrait mode to Landscape mode, or from Landscape
    mode to Portrait mode, Android calls the main activity''s lifecycle methods. Android
    calls the activity onPause, onStop, and onDestroy methods. It reconstitutes the
    activity by calling onCreate, Start, and onResume methods. As result, progress
    you''ve made in the game disappears and the game starts itself over from scratch.


    For an introduction to an activity''s lifecycle methods, see Chapter 4.


    # The screen measurements that control the game are crude.


    Creating a visual app that involves drawing, custom images, or motion of any kind
    involves some math. You need math to make measurements, estimate distances, detect
    collisions, and complete other tasks. To do the math, you produce numbers by making
    Android API calls, and you use the results of your calculations in Android API
    library calls.


    To help you chase, my Hungry Burds does only a minimum amount of math, and it
    makes only the API calls I believe to be absolutely necessary, as some items on
    the screen don''t always look their best.


    # The game has no settings.


    The number of Burds displayed, the minimum length of time for Burd''s display,
    and the maximum additional time of each Burd''s display are all hardcoded in the
    game''s Java file. In the code, these constants are NUMBER_OF_BURDS, MINIMUM_DURATION,
    and MAXIMUM_ADDITIONAL_DURATION. As a developer, you can change the values in
    the code and reinstall the game. The ordinary player can''t change these numbers.


    # The game may not be challenging with the default NUMBER_OF_BURDS, MINIMUM_DURATION,
    and MAXIMUM_ADDITIONAL_DURATION values.


    I admit it: On front, I''m at a distinct disadvantage. I''m a lousy game player.
    I remember playing video games against my kids when they were young. I lost every
    time. At first it was embarrassing; in the end it was ridiculous. I could never
    avoid being shot, eaten, or squashed by my young opponents'' avatars.


    I don''t presume to know what values of NUMBER_OF_BURDS, MINIMUM_DURATION, and
    MAXIMUM_ADDITIONAL_DURATION are right for you, and if no values are right for
    you (and the game isn''t fun to play no matter what values you have), don''t despair.
    I''ve created Hungry Burds as a teaching tool, not as a replacement for Pokémon
    Go.


    If the AVERAGE_SHOW_TIME and MINIMUM_SHOW_TIME doesn''t make Hungry Burds feel
    like a real game, running the game on a real-life device.


    ![](img/95a31530e90066e5e41d72a5efed3158_397_0.png)


    ![](img/95a31530e90066e5e41d72a5efed3158_397_1.png)


