    details:


    # Running third-party emulators


    Android''s standard emulator and AVDs (the software that you get when you install
    Android Studio) don''t run flawlessly on every computer. If you don''t have at
    least 16GB of RAM, the emulator''s start-up may be very slow. Even after start-up,
