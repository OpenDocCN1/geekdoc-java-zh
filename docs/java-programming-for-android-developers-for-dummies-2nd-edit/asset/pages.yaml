    ```\n\nremoves all Birds from the activity's view group in preparation for the\
    \ start of the Hungry Birds game.\n\n# Android animation\n\nAndroid has two types\
    \ of animation:\n\n+   **View animation:** A system that comes in two different\
    \ flavors:\n\n+   Tweening:** tell Android how an object should look initially\
    \ and how the object should look eventually. You also tell Android how to change\
    \ from the initial appearance to the eventual appearance. (Is the change gradual\
    \ or sudden? If the object moves, does it move in a straight line or a curve of\
    \ some sort? It will bounce a bit when it reaches the end of its path?)\n Tweening,\
    \ Android considers all your requirements and figures exactly how the object looks\
    \ between the start and the finish of the object's animation.\n\n+   **Frame-by-frame\
    \ animation:** You provide several snapshots of the object along its path. Android\
    \ displays these snapshots in rapid succession, one after another, giving the\
    \ appearance of movement or of another change in the object's appearance.\n\n\
    +   Movie cartoons are the classic example of frame-by-frame animation, even though,\
    \ in modern filmmaking, graphics specialists use tweening to create sequences\
    \ of frames.\n\n+   **Property animation:** A system in which you can modify any\
    \ property of an object over a period of time.\n\n+   With property animation,\
    \ you can change anything about any kind of object, whether the object appears\
    \ on the device's screen or not. For example, you can increase each earth object's\
    \ average temperature from 15° Celsius to 18° Celsius over a period of ten minutes.\
    \ Rather than display that object,\n\n398 PART 4 Powering Android with Java Code"
