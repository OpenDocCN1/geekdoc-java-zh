    more than Twitter tweets — for example, search for tweets, look for users, view
    trends, check friends and followers, gather suggestions, and do lots of other
    things that Twitter users want done. For simplicity, I have the app perform only
    two tasks: tweet and display a timeline.


    I can summarize the essence of this chapter''s Twitter code in two short statements.
    To post a tweet, the app executes


