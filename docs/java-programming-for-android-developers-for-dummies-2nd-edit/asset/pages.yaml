  md: 'An AVD is a piece of software that tells your development computer all about
    a particular phone, a particular tablet, or some other kind of device. When you
    install Android Studio, the installer creates an AVD for you to use. You can create
    several AVDs and use several different AVDs to run and test your Android apps.


    You use the AVD Manager to create and customize your Android virtual devices.
    To use the AVD Manager, go to Android Studio''s main menu bar and choose Tools:Android:AVD
    Manager.


    Figures 2-13 through 2-16 show the dialog boxes that you might find in the AVD
    Manager.


    I''m reluctant to list instructions using the AVD Manager, because the look of
    the AVD Manager screen is constantly in flux. Chances are, what you see on your
    computer’s screen doesn’t look much like the mid-2016 screen shots in Figures
    2-13 to 2-16.


    ![](img/95a31530e90066e5e41d72a5efed3158_65_0.png)


    > FIGURE 2-13:

    The opening page of the AVD Manager.


    Instead of giving explicit instructions, my general advice when creating a new
    AVD is to select the new phones or tablets or the higher-numbered API levels,
    and to accept defaults whenever you''re tempted to play meeny-meeny-money. Just
    keep clicking Next until you can click Finish. If you don''t like the AVD you''ve
    created, you can always recover the AVD Manager and select different options to
    create another AVD. When you reach the level of proficiency where you''re finicky
    about your AVD’s characteristics, you’ll probably know your around many the AVD
    Manager’s options and you''ll be able to choose wisely.'
