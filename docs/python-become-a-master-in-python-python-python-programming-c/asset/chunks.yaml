    the code that you have entered. However, it cannot perform the action that you
    are requesting it to perform because of an outside source that is acting upon
    the code. One of these issues would be if you were trying to access the Internet
    through Python, but you do not have any Internet access. Python knows what you
    are telling it to do, but it just cannot perform the task because you do not have
    everything that is required to complete it.


    In dealing with exceptions, you are going to find that they are not like syntax
    errors because they are not going to be fatal every time. Exceptions have the
    ability to be handled by using a try statement.


    Look at the following code that is used to display HTML for a website. When you
