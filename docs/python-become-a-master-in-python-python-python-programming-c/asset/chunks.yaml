    and practice using it as well as being diligent with the coding you are building
    on, it will become simple for you to use as you learn the ropes.


    When you are first reading how to code, you may want to consider getting a program
    that is free and straightforward for you to practice with as you are learning.
    The program will thrive on being as simple as possible, and you will even be able
    to make a few shortcut commands.


    For example, if you want to input the command for Enumerate, which will return
    an enumerate object to a list, the code is going to look like this:


    *i = 0*


    *for item in iterable:*


    *print i, item*


    *i += 1*


    An alternative coding option is as follows:


    *for i, item in enumerate(iterable):*


    *print i, item*


    Also, Emulate can even take on a second argument like as follows:


    *>>> list(enumerate(‘abc’))*


    *[(0, ‘a’), (1, ‘b’), (2, ‘c’)]*


    *>>> list(enumerate(‘abc’, 1))*


    *[(1, ‘a’), (2, ‘b’), (3, ‘c’)]*


