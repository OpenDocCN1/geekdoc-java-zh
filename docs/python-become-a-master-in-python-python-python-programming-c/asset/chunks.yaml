    ## Python 中的字符串格式化


    字符串模块包含不同的有用常量和类；它们甚至可以包含仅作为方法提供的过时函数。Python 在其编程中内置了字符串类型，以支持序列类型方法。


    为了对字符串的输出进行格式化，你将使用模板或百分比符号（`%`）。还有另一个内置函数旨在帮助你在 Python 中格式化字符串。Python 中的 `str`
    和 `Unicode` 类被放置那里是为了帮助多变量替换，以及通过 `.format()` 技术对字符串中的值进行格式化。


    你在字符串模块中找到的格式化类将帮助你自定义字符串的格式化方式及其行为，使用位于 `format()` 方法中的相同技术。


    ### 字符串格式化类


    要遵循公共方法，可以使用此格式化器。


    `Format(format_string, *args, **kwargs)`：这是主要方法。它接收你刚刚格式化的字符串，以及一组随机的关键字参数和位置。这只是你格式化字符串的封装，它使用了
    `vformat()`。


    格式化器还将帮助定义各种你可以使用的方法来替换子类。


    `Parse(format_string)`：你将遍历格式化字符串，然后返回可迭代的元组 `(literal_text, field_name, format_spec,
    conversion)`。配合 `vformat()` 使用此方法将字符串带入替换字段或字面文本。

