  trans: "\nPython 使用的语法和命令与其他任何解释型语言都不同。例如，Perl 正在被 PHP 成为快速快速的 Web 开发程序的通用语言。但与\
    \ Perl 甚至 PHP 不同的是，Python 不仅更容易遵循，而且更容易阅读。\n\nPerl 和 PHP 共同的怪异代码是这两个程序的主要缺陷之一。PHP\
    \ 和 Perl 的语法导致编写超过 50 到 100 行的代码变得困难。然而，Python 由于其极高的可读性，使得扩展和维护代码变得变得容易。这是植于\
    \ Python 语言核心的内置模块之一。\n\n对于一种更通用的面向 Web 的编程语言，PHP 是目前最优秀的语言之一。PHP 实际上代表“超文本处理器（Hypertext\
    \ Processor）”，这意味着它本应该输出 Web 可读的信息而不是系统级任务。但你可以使用 Python 开发一个实际上能够理解 PHP 语言的 Web\
    \ 服务器。遗憾的是，这并无法反过来让 PHP 学习 Python。\n\nPython 是一个面向对象的程序，而 PHP 不是。正如此，可维护性、扩展性甚至可读性都会影响程序的编写方式。\n\
    \n当你观察现有的编程语言时，你会发现它们可以并被用于不同的职业领域，如下：\n\n### 人工智能开发\n这专门用于制作能够与人类行为交互并学习其被设定学习内容的的\
    \ AI 或认知系统。这里产生的程序包括电脑游戏中的角色交互、做出决策的程序部分以及可以回复发送者的聊天框。\n\n### 应用与程序开发\n这涉及到你每天与之交互的程序。你用于查看喜好网页的浏览器浏览器程序，以及允许你在\
    \ Kindle 上浏览此类电子书的应用程序，都是这种方式制作的程序示例。\n\n### 数据库开发\n这不言而喻。你创建并维护小型数据库，存储大量的数字信息供人们查找和使用。这些数据库对于网站非常重要，以便它们可以汇总信息。\n\
    \n### 游戏开发\n这同样不言而喻。电脑游戏和其他娱乐软件可以使用 `Java` 等语言程序编写。你在网上看到的 Flash 游戏使用的是完全相同的脚本。\n\
    \n### 计算机驱动程序或任何硬件开发\n这些是专注于心理支持设备功能性的应用程序。\n\n### 互联网与网页创建\n这是互联网的命脉。没有开发者，就没有网页；没有网页，就没有互联网。\n\
    \n### 脚本开发\n编写脚本的知识将有利于任何公司的生产力。\n\n如你所见，Python 在我们日常生活的不同方面都非常有帮助。我们每天都在使用由 Python\
    \ 编写的东西，甚至没有意识到这一点。Python 字面上帮助维持着我们生活的运行，因为没有它，我们就没有那些构成用于在线银行、娱乐甚至使用电脑等不同任务程序的易读代码。\n\
    \n你将从 Python 中学到的非凡之处是，它是一种解释型且交互式的编程语言。解释型仅意味着它在执行之前不需要编译，但它仍然需要一个解释器以便修改脚本。Python\
    \ 还是一种面向对象的编码语言，使得同时交互甚至执行多个程序成为可能。\n\nPython 的额外优点是，它是创建以来最简单且最终最易于的编程语言。它并不是为了设计得像某些其他计算机程序那样丑，而是为了看起来美观。该程序是明确而非模糊的，即使你没有任何\
    \ Python 技能，也很读。然而，不要低估你可以随时轻松使用 Python 的。它仍然是一种设计用于创建复杂程序和网站的编程语言。但是，如果你投入时间、耐心和练习，并对你正在构建的代码保持勤奋，随着你掌握门径，它对你来说将变得简单。\n\
    \n当你开始学习如何编码时，你可能想要考虑找一个免费且简单的程序供你在学习时练习。该程序将以尽可能简单为发展目标，你甚至可以制作几个快捷命令。\n\n例如，如果你想输入\
    \ `Enumerate` 的命令，它将向列表返回一个 `enumerate` 对象，代码看起来像这样：\n\n```\ni = 0\nfor item in\
    \ iterable:\n    print i, item\n    i += 1\n```\n\n另一种编码选项如下：\n\n```\nfor i, item\
    \ in enumerate(iterable):\n    print i, item\n```\n\n此外，`Emulate` 甚至可以接受第二个参数，如下：\n\
    \n```\n>>> list(enumerate(‘abc’))\n[(0, ‘a’), (1, ‘b’), (2, ‘c’)]\n>>> list(enumerate(‘abc’,\
    \ 1))\n[(1, ‘a’), (2, ‘b’), (3, ‘c’)]\n```\n\n由于 Python 易于使用，学习如何使用它很容易。Python\
    \ 的整体结构对于编程初学者来说是可以掌握的，并且其运行方式非常清晰。由于 Python 运行在高级语言之上，字符串以清晰直观的语法组合在一起，这种语法只有少数命令。当你学习如何掌握\
    \ Python 时，你会发现你将拥有编写更复杂脚本的知识，而这些脚本通常需要别人花费几到几小时才能编写。Python 使用的脚本语言使编程变体快速且简单。\n"
