    ## 第 1 章


    ![logo](img/00003.jpeg)


    ### Python —— 什么是以及你为什么应该使用它


    Python 是一种计算机编程代码，用于所有平台以及代码编写者使用的机器。Python 具有不同的功能，实际上可以帮助编码变得更简单，同时让代码看起来更好且更易于阅读。如果以后有人需要回来重写这些代码，这将非常有用。


    当我们思考 Python 是什么时，通常会想到一种体型巨大、身体沉重的蟒蛇，但这不是我们书中所讨论的内容。然而，Python 这种计算机编程语言并不是以我们经常想到的那种蛇命名的。相反，在
    1990 年，当 Guido von Rossum 创建该程序时，它是以英国喜剧剧《蒙提 Python 的马团》（Monty Python’s Flying
    Circus）命名的。


    这是一种易于获取的程序，有助于在遇到计算机问题时简化寻找解决方案的过程。这个程序的运行方式就像你花时间坐在纸上写下问题的解决方案一样，只不过它是在计算机上完成的。


    Python 最大的优势是它可以在任何计算机上运行，一旦编写完成，就不需要更改程序。


    当该程序在 90 年代最初开发时，是由一个志愿者团队运行。你可以通过网站 https://www.Python.org 获取该程序以及任何支持。2006 年
    9 月，Python 2.5 发布了。这是当时的最新版本。


    当你查看 Python 的不同版本时，你会发现有一个 Java 版本，被称为 `Jython`。Jython 是在用户 Java 时使用的。


    Iron Python 使用适用于 Mono 平台的 C# 版本。任何使用 C# 的人都拥有 Python 同样的灵活性和力量，而无需使用它。


    但正如任何程序员所知，每个程序的行为都是不同的。虽然 Python 是用一种语言编写的，但它以该语言为主要与其他语言进行交互。这只是在开发期间构建 Python
    的许多模块中的一小部分。


    `PyPy` 项目成立于 2003 年，旨在帮助 Python 程序员改变 Python 与各种语言通信的解释器方式。该项目是一个开源项目，因此允许开发者社区对其进行免费分发和修改，以应对调整需求。该项目还得到了
    Python 基金会以及欧盟的资助。这是 `FP6` 项目下 `STReP`（特定研究计划）的一部分。


    Python 可以在任何现代操作系统上访问，并可处理如下内容：


    - 科学数据

    - 图像

    - 文本

    - 数字

    - 或者你选择保存在计算机上的任何其他


    许多人不知道我们每天使用的网站实际上是用 Python 编写的。像 `YouTube` 甚至 `Google` 这样的网站都是使用 Python 创建的。`NASA`
    和纽约证券交易所也使用了 Python 进行加密。然而，这些只是 Python 使我们能够访问的众多网站示例。企业、政府和非营利组织的网站也在运行 Python
    代码。


    由于 Python 是翻译后的记录，因此它在运行时不需要进行转换。这与过去那些需要转换的脚本语言不同。脚本语言的设计是为了模仿执行需要完成的平凡和琐碎任务的方式。


