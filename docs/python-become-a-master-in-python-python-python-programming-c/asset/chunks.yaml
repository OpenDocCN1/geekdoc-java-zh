  raw: 'If you want to make something more visually appealing, you will want to incorporate
    some HTML files. This will return the HTML pages instead of just plain strings
    of text.


    This is where you will learn how to return HTML pages with the render_template
    method.


    You should see that there is not any plain text and that the text you have can
    have various formats. This is made by returning the HTML template rather than
    the plain text from Python.


    To do this, you will want to create an empty file with the name of something similar
    to home.html and put the following code into it.


    <!DOCTYPE html>


    <html>


    <body>


    <h1>My Personal Website</h1>


    <p>Hi, this is my personal website.</p>


    </body>


    </html>


    HTML is the language that web pages use. You will need to make sure that you remember
    these three important things when it comes to creating HTML pages.


    -Any visible part of the HTML will be between <body> and </body>. The areas outside
    of this are used in reference to Javascript files, CSS, or any similar features.


    -The HTML document needs to start with a declaration that will specify the document
    type: <!DOCTYPEhtml>


    -HTML documents will always begin with <html> and end with </html/>


    In the flask framework, it should be written in a folder where it can specifically
    look for the HTML template files. This folder should be called templates.


    Any Python scripting will stay outside of the templates folder as it is not HTML.


    The code to be able to read the HTML templates will look similar to this. Note:
    this is the updated code from our flask code earlier.


    from flask import Flask, render_template


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return render_template(‘home.html’)


    if __name__ == ‘__main__’:


    app.run(debug=True)


    You will notice that the code was maintained by using the imported render_template
    method within the flak framework. It is from here that the HTML files are on the
    flask framework. This will generate a jinja 2 template then return the model to
    the browser whenever the users visit your URL.


    If you want to create an “about” page, you will need to create another HTML file
    in the template folder. The coding for this is going to look a little something
    like this:


    <!DOCTYPE html>


    <html>


    <body>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a portfolio.</p>


    </body>


    </html>


    It is from here that you will be able to render the HTML you created with Python
    by joining a secondary function to the template. The new code for this looks like
    this:


    from flask import Flask, render_template


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return render_template(‘home.html’)


    @app.route(‘/about/’)


    def about():


    return render_template(‘about.html’)


    if __name__ == ‘__main__’:


    app.run(debug=True)


    Once you have put the last string of codes in, you will then need to run the script
    localhost:5000/about, and this will open a new page. At a later date, this template
    can have CSS styling applied to it in order to make it resemble what you want
    it to look.


    The updated coding for about.html is going to look something similar to this:


    <!DOCTYPE html>


    <html>


    <body>


    <div class=“about”>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a collection.</p>


    </div>


    </body>


    </html>


    You’ll have to do this for your home.html as well.


    <!DOCTYPE html>


    <html>


    <body>


    <div class=“home”>


    <h1>About me</h1>


    <p>This website was built with Python via the Flask framework.</p>


    </div>


    </body>


    </html>


    When you run your Python script now, you will have two URLs open. Now, you should
    have two HTML pages as well as the Python script that has resulted in your HTML
    pages being two different URLs. These two URLs are your home page as well as your
    about page.


    If you need to design an area in each page, you will then need to add in the HTML
    code that will cause a header to generate for each file. However, before you do
    this, the smart thing would be to create a parent HTML template that your following
    templates will then inherit the code from. This is done by simply linking the
    parent model to each HTML page so that they can inherit the code.


    The first action is to create a new page that you will call layout.html, and the
    coding will look like this:


    <!DOCTYPE html>


    <html>


    <body>


    <header>


    <div class=“container”>


    <h1 class=“logo”>Ardit’s web app</h1>


    <strong><nav>


    <ul class=“menu”>


    <li><a href=“{{ url_for(‘home’) }}”>Home</a></li>


    <li><a href=“{{ url_for(‘about’) }}”>About</a></li>


    </ul>


    </nav></strong>


    </div>


    </header>


    </body>


    </html>


    Python will then modify the home.html and about.html pages as well as your layout.html
    files. At this point, you will then need to link both about.html and home.html
    to layout.html. This is going to take a few lines of coding, and you are going
    to start with the layout.html.


    <!DOCTYPE html>


    <html>


    <body>


    <header>


    <div class=“container”>


    <h1 class=“logo”>Ardit’s web app</h1>


    <strong><nav>


    <ul class=“menu”>


    <li><a href=“{{ url_for(‘home’) }}”>Home</a></li>


    <li><a href=“{{ url_for(‘about’) }}”>About</a></li>


    </ul>


    </nav></strong>


    </div>


    </header>


    <div class=“container”>


    {% block content %}


    {% end block %}


    </div>


    </body>


    </html>


    You will notice that a new div section was added to your layout.html. The two
    lines within the curly brackets will then be replaced on demand in either the
    home.html or the about.html code, depending on which URL the user is using at
    the time. But, in order for these to work, you will then need to edit both your
    about and home pages so that they will connect to your layout page.


    Your home.html code will look like this:


    {% extends “layout.html” %}


    {% block content %}


    <div class=“home”>


    <h1>A Python product</h1>


    <p>This website was built with Python via the Flask framework.</p>


    </div>


    {% end block %}


    And this is what your about.html will look like:


    {% extends “layout.html” %}


    {% block content %}


    <div class=“about”>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a portfolio.</p>


    </div>


    {% end block %}


    Congratulations!


    You now have a functional website! However, you are still missing some of your
    website. These were just the basics of how to make a website by using Python coding.
    You can still add more to your site like CSS styling and, finally, the steps that
    you will need to make your site public in the lessons that can be found on [www.Pythonhow.com](http://www.Pythonhow.com)


    **Chapter 11**


    ![logo](images/00003.jpeg)


    Additional Uses for Python


    When you look at all the different things that you can do with Python, you will
    learn that you can actually create video games with the Python source coding as
    well as use Python for hacking into computer systems.


    Note: It is important to not hack into any system without the expressed written
    permission from the system administrator.


    **Game Creation**


    When you are creating a game using Python, you are going to use PyGame. This software
    adds the functionality on top of the SDL library. It permits you to design fully
    featured games and multimedia applications by using the Python language.


    Pygame allows the game to be highly portable and run off of nearly every platform
    and operating system.


    There are numerous examples and documentation of games that were created by using
    PyGame that have been successful. You will also notice that it is easy to write
    games as well as graphic-intensive programs by using PyGame.


    If you want to make a high-level game that is in 3D, you will use PySoy. This
    works with the engine that is used in Python 3\. Python 3 tightly binds the rendering
    physics, networking, and even the animation.


    Python-Ogre is the complete Python wrapper for the OGRE 3D engine that includes
    15 other graphics as well as gaming-related libraries that are used for GUI, special
    effects, sound, physics, and much more.'
