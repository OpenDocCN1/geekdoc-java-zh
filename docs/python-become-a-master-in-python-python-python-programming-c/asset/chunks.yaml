  trans: "\n\n如果你想让内容视觉上更有吸引力，你将需要整合一些 HTML 文件。这将返回 HTML 页面，而不仅仅是纯文本字符串。\n\n在这里，你将学习如何使用\
    \ `render_template` 方法返回 HTML 页面。\n\n你应该能看到不再有纯文本了，而且你拥有的文本可以有各种格式。这是通过从 Python\
    \ 返回 HTML 模板而不是纯文本来实现的。\n\n完成这一点，你需要创建一个名称类似于 `home.html` 的空文件，并将以下代码放入其中。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>My Personal Website</h1>\n<p>Hi,\
    \ this is my personal website.</p>\n</body>\n</html>\n```\n\nHTML 是网页使用的语言。在创建\
    \ HTML 页面时，你必须务必确保自己记住了这三件重要的事情：\n\n-   HTML 的任何可见部分都位于 `<body>` 和 `</body>` 之间。这些区域之外的区域被用于引用\
    \ Javascript 文件、`CSS` 或任何类似的特性。\n-   HTML 文档需要以一个声明作为开始，该声明将指定文档类型：`<!DOCTYPE\
    \ html>`。\n-   HTML 文档始终以 `<html>` 开始，并以 `</html>` 结束。\n\n在 `flask` 框架中，它应该写在一个可以专门查找\
    \ HTML 模板文件的文件夹中。该文件夹应该名为 `templates`。\n\n任何 Python 脚本都留在 `templates` 文件夹之外，因为它们不是\
    \ HTML。\n\n读取 HTML 模板的代码看起来像这样。注意：这是从我们之前的 flask 代码基础上更新后的代码。\n\n```python\nfrom\
    \ flask import Flask, render_template\n\napp = Flask(__name__)\n\n@app.route('/')\n\
    def home():\n    return render_template('home.html')\n\nif __name__ == '__main__':\n\
    \    app.run(debug=True)\n```\n\n你会注意到，代码是通过使用 `flask` 框架中导入的 `render_template`\
    \ 方法来维护的。HTML 文件在 `flask` 框架中就是从这里开始。每当用户访问你的 URL 时，它将生成一个 `jinja 2` 模板，并将模型返回给浏览器。\n\
    \n如果你想创建一个“关于”（about）页面，你需要在模板文件夹中创建另一个 HTML 文件。这部分的代码看起来大致如下：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<h1>About me</h1>\n<p>This is a portfolio site about\
    \ anything that can be put in a portfolio.</p>\n</body>\n</html>\n```\n\n通过向模板连接一个次级函数，你将能够通过\
    \ Python 渲染你创建的 HTML。对应的新代码看起来如下：\n\n```python\nfrom flask import Flask, render_template\n\
    \napp = Flask(__name__)\n\n@app.route('/')\ndef home():\n    return render_template('home.html')\n\
    \n@app.route('/about/')\ndef about():\n    return render_template('about.html')\n\
    \nif __name__ == '__main__':\n    app.run(debug=True)\n```\n\n一旦你放入了最后一段代码，你就需要运行脚本\
    \ `localhost:5000/about`，这将打开一个新页面。在稍后的日子里，可以给这个模板应用 `CSS` 样式，使其看起来像你想要的样子。\n\n\
    `about.html` 的更新代码将类似于这样：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div class=\"\
    about\">\n<h1>About me</h1>\n<p>This is a portfolio site about anything that can\
    \ be put in a collection.</p>\n</div>\n</body>\n</html>\n```\n\n你也必须对 `home.html`\
    \ 执行此操作。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div class=\"home\">\n<h1>About\
    \ me</h1>\n<p>This website was built with Python via the Flask framework.</p>\n\
    </div>\n</body>\n</html>\n```\n\n现在当你运行你的 Python 脚本时，你将打开两个 URL。现在，你应该有两个 HTML\
    \ 页面以及一个导致你的 HTML 页面成为两个不同 URL 的 Python 脚本。这两个 URL 分是你的首页和关于页面。\n\n如果你需要在每个页面中设计一个区域，你将需要添加\
    \ HTML 代码来为每个文件生成页头。然而，在你这样做之前，最明智的做法是创建一个父 HTML 模板，你的后续模板将从中继承代码。这是通过简单地将父模型链接到每个\
    \ HTML 页面来实现，以便它们继承代码。\n\n第一个动作是创建一个名为 `layout.html` 的新页面，代码看起来如下：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<header>\n<div class=\"container\">\n<h1 class=\"\
    logo\">Ardit’s web app</h1>\n<strong><nav>\n<ul class=\"menu\">\n<li><a href=\"\
    {{ url_for('home') }} }}\">Home</a></li>\n<li><a href=\"{{ url_for('about') }}\
    \ }}\">About</a></li>\n</ul>\n</nav></strong>\n</div>\n</header>\n</body>\n</html>\n\
    ```\n\nPython 然后将修改 `home.html`。随后，你将修改 `home.html` 和 `about.html` 以便它们连接 `layout.html`。在这一点上，你需要通过\
    \ `layout.html` 来修改这些 home。\n\n 看起来如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <\n>\n<div class=\"container\">\n<h1 class=\"logo\">Ardit’s web app</h1>\n<strong><nav>\n\
    <ul class=\"menu\">\n<li><a href=\"{{ url_for('home') }} }}\">Home</a></li>\n\
    <li><a href=\"{{ url_for('about') }} }}\">About</a></li>\n</ul>\n</nav></strong>\n\
    </div>\n</header>\n\nThese were just the basics of how to make a website. You\
    \ can still add more to your site like `CSS` styling and, finally, the steps that\
    \ you need to make your site public.\n\n## 第 11 章\n\n![logo](img/00003.jpeg)\n\
    \n### Python 的其他用途\n\n当你查看 Python 可以做的所有不同事情时，你将了解到你实际上可以使用 Python 源代码创建视频游戏，并用\
    \ Python 破解计算机系统。\n\n注意：在没有系统管理员明确书面许可的情况下，不要破解任何系统。\n\n### 游戏制作\n\n当你使用 Python\
    \ 创建游戏时，你将使用 `Pygame`。该软件在 `SDL` 库之上增加了功能。它允许你使用 Python 语言设计功能齐全的游戏和多媒体应用程序。\n\
    \n`Pygame` 允许游戏具有高度移植性，并运行在几乎所有的平台和平台上。\n\n有许多使用 `Pygame` 创建的成功示例和文档。你也会注意到使用\
    \ `Pygame` 编写游戏以及图形密集型程序是很容易的。\n\n如果你想创建一个 3D 高级游戏，你将使用 `PySoy`。它与 Python 3 中使用的引擎配合。Python\
    \ 3 紧密结合了渲染、物理、网络甚至动画。\n\n"
- fmt: "\nThere are several other libraries that you can look at or are going to need\
    \ in order to make a game. If you are wanting to look into these libraries, you\
    \ can go to [www.wiki.Python.org/moin/PythonGames](http://www.wiki.Python.org/moin/PythonGames).\n\
    \nYou will also see that there is something called `PyWeek`, which is a bi-annual\
    \ challenge that will produce several great games. It is a challenge where you\
    \ are able to show off your programming skills and create a game that will go\
    \ up against other games in proving that you are the best.\n\n## Hacking\n\nWe\
    \ have all see hacking in the movies and on TV shows and how exciting it looks\
    \ and that there are meaningless ones and zeros just flying across the screen.\
    \ Watching it makes it seem like hacking is magical.\n\nHowever, it is not magical.\
    \ It is based on computers, and when it comes to computers, everything that is\
    \ done has sound principles behind it so that it can be learned and understood.\
    \ Even if you do not understand why a computer does what it does, there is also\
    \ going to be a reason why it did that.\n\nIt is not hard to learn why a computer\
    \ does what it does. All it takes is a little time and patience in learning.\n\
    \nWhen you are hacking, you are attempting to get into someone’s operating system.\
    \ This is done by hacking into the encrypted coding that is surrounding the computer.\
    \ Once you have done this, you are then able to look at the files that are on\
    \ the system that you have hacked into.\n\nBy using `Python`, you are able to\
    \ change the code so that you are able to get into the operating system. The unfortunate\
    \ thing about this is that if you are changing things within an operating system,\
    \ the system administrator will be able to notice that you have changed things\
    \ and then will know that they have been hacked.\n\nIf you are going to hack someone,\
    \ as we have mentioned at the beginning of this section, you need to get the expressed\
    \ permission of the system administrator before you attempt to hack their system.\n\
    \nIt is best that you get their approval in writing so that you are able to have\
    \ solid proof that you had permission to break into their system.\n\n## Chapter\
    \ 12\n\n![logo](images/00003.jpeg)\n\n### Tricks for Using Python\n\nThe first\
    \ step to programming on Python is having it type back the words you send to it.\
    \ The `>>>` you see is what the program directs you to type in your codes and\
    \ commands. When you type `>>> print Hello World, SLUAST`, it will return `Hello\
    \ World, SLUAST`.\n\nIt always helps to know the basics, such as knowing that\
    \ whatever you print can be sent back to you.\n\nThe cool thing is that Python\
    \ can also act as your calculator. When you `print 5`, you will just get the number.\
    \ But if you enter `print 5 + 22`, you can expect to see `27` as the response.\n\
    \nNow let’s take it a step further and enter a word phrase with strings and numbers.\
    \ When you `print “I am elite,”+1337`, you’ll actually get an error like this:\n\
    \n```\nTraceback (most recent call):\nFile \"<pyshell#6>\", line 1, in <module>\n\
    \  print “I am elite”+1337\nTypeError: cannot concatenate ‘str’ and ‘int’ objects\n\
    ```\n\nThe part that begins with `File` says which file and where in the file\
    \ the error is located. Then, it will show the code and a little brief description\
    \ of the error. This is a mistake where you cannot add strings to integers (only\
    \ numbers).\n\nLuckily coding with language programs is flexible; you just have\
    \ to solve it like the other programmers do. To solve this particular error, you\
    \ can turn the user you want into a variable. Like with regular math, `X` is a\
    \ placeholder, so let’s make `X = 1337`. Then `print “I am elite” + X` and enter.\n\
    \nExcept not yet. Otherwise, you get the same error.\n\nThat’s because we haven’t\
    \ changed the variable `X`’s number (`1337`) into a string by connecting quotation\
    \ marks (“”) and apostrophes (‘‘) together like this:\n\n```\nX = ‘1337’ (note\
    \ the apostrophes)\nprint “I am elite “+X (note the quotation marks)\n```\n\n\
    The result will finally read as follows: I am elite 1337 (note that there is no\
    \ error!)\n\n## Dict/Set Comprehensions\n\nList comprehensions may be familiar\
    \ to you, but for dict/set comprehensions, this is something you may not be aware\
    \ of. They are simple, as well as effective, to use. Take this example below:\n\
    \n```\nmy_dict = {i: i * i for i in xrange (100)}\nmy_set = {i * 15 for i in xrange\
    \ (100)}\n```\n\nThe only difference in both is ‘:’.\n\n## Forcing Float Division\n\
    \nBack to the mathematics, you can divide numbers using the backslash key (`/`).\
    \ Generally, division will always give out whole number answers. Normally for\
    \ Python 2, you have to do something like this:\n\n```\nresult = 1.0/2\n```\n\n\
    But there’s a handy trick you can do instead to forgo the .0 right here:\n\n```python\n\
    from __future__ import division\nresult = 1/2\n# print(result)\n# 0.5*\n```\n\n\
    Of course, you don’t have to fret about this if using Python 3 as it is handled\
    \ by default.\n\n## Conclusion\n\n![logo](images/00003.jpeg)\n\nThanks for making\
    \ it through to the end of *Python*. Let’s hope it was informative and able to\
    \ accommodate you with all of the tools you need to achieve your goals whatever\
    \ it may be.\n\nThe next step is to take all of the information that you have\
    \ learned in this book and begin your journey with Python. It is not going to\
    \ be easy, but if you are patient, you are going to discover that you are going\
    \ to make your life better!\n\nThank you and good luck!\n\nFinally, if you found\
    \ this book useful in any way, a review on Amazon is always appreciated!\n"
