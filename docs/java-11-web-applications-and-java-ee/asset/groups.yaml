- md: "\n# JAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\nJSP\n\n\
    ## 5.2 FUNCTIONS\n\n![](img/589e4f95edc213964881c85e009923c9_76_0.png)\n\nIt is\
    \ also possible to call a static method in a class and apply the return value\
    \ in the JSP page, but it requires the method to be registered in a Tag Library\
    \ Descriptor, which is also called a TLD. The BeanFunction program opens the window\
    \ above. There is a single input field that is bound to a property in a Java bean\
    \ and there is a submit. Clicking on the button sets the value of the field to\
    \ the server and the program inserts the text is not a prime or is a prime. This\
    \ happens by calling a static method whose argument is the value of above proper.\
    \ The bean class follows the code and looks like the same bean from the previous\
    \ example, but is just simpler:\n\n```java\npackage beanfunction.beans;\n\nimport\
    \ java.io.*;\n\npublic class PrimeBean implements Serializable {\n    private\
    \ long prime = 0;\n\n    public PrimeBean() {\n}\n\n    public long getPrime()\
    \ {\n    return prime;\n}\n\n    public void setPrime(long n) {\n    prime = n;\n\
    }\n}\n```\n\nDownload free eBooks at bookymoon.com\n\n```java\npublic static boolean\
    \ isPrime(long n)\n{\n  if (n == 2 || n == 3 || n == 5 || n == 7) return true;\n\
    \  if (n < 11 || n % 2 == 0) return false;\n  for (long t = 3, m = (long)Math.sqrt(n)\
    \ + 1; t <= m; t += 2) {\n    if (n % t == 0) return false;\n  }\n  return true;\n\
    }\n```\n\nNote that this method I used does not validate the value. To create\
    \ a Tag Library Descriptor, I have added a directory named tlds to WEB-INF and\
    \ then added the descriptor to this directory:\n\n![](img/589e4f95edc213964881c85e009923c9_77_0.png)\n\
    \nThis sub directory is not necessary, but it is recommended to create such a\
    \ directory as a larger application may have many Tag Descriptors. The descriptor\
    \ itself is called functions.tld in an XML document:\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<taglib version=\"2.1\" xmlns=\"http://java.sun.com/ns/javaee\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
    http://java.sun.com/ns/javaee\nhttp://java.sun.com/ns/javaee/web-jsptaglibrary_2_1.xsd\"\
    >\n<taglib-version>1.0</taglib-version>\n<short-name>f</short-name>\n<url>WEB-INF/tlds/functions.tld</url>\n\
    <function>\n<name>isPrime</name>\n<function-class>beanfunction.beans.PrimeBean</function-class>\n\
    <function-signature>boolean isPrime(long)</function-signature>\n</function>\n\
    </taglib>\n```\n\nIn this case the functions.tld has a so-called short-name called\
    \ f. It is used to refer to a method. A single function has been defined, and\
    \ the definition includes the function's name, the function's class and its signature.\
    \ The document must contain a description for each static method that must be\
    \ available for the JSP pages. Below is the code for the JSP page:\n\n```jsp\n\
    <page contentType=\"text/html\" pageEncoding=\"UTF-8\">\n<!DOCTYPE html %>\n<taglib\
    \ prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<taglib uri=\"WEB-INF/tlds/functions.tld\"\
    \ prefix=\"f\" %>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n<title>JSP Page</title>\n</head>\n<body>\n<jsp:use\
    \ id=\"prim\" scope=\"request\" class=\"beanfunction.beans.PrimeBean\"/>\n<jsp:setProperty\
    \ name=\"prim\" property=\"prime\"/>\n<h1>${prim.prime}</h1>\n<form name=\"form1\"\
    \ method=\"post\">\n<p>Enter a prime: <input type=\"text\" name=\"prime\" value=\"\
    ${prim.prime}\"></p>\n<br/>\n<input type=\"submit\" value=\"OK\"/>\n</form>\n\
    <p>\nc:choose</p>\n```\n\n```jsp\n<c:when test=\"${f:isPrime(prim.prime)}\">\n\
    \  is a prime\n</c:when>\n<c:otherwise>\n  is not a prime\n</c:otherwise>\n</c:choose>\n\
    <p>\n</body>\n</html>\n```\n\nFirst, note definition of two TLDs:\n\n```jsp\n\
    <%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<%@ taglib\
    \ uri=\"WEB-INF/tlds/functions.tld\" prefix=\"f\" %>\n```\n\nA tag library expands\
    \ JSP with new elements in the form of Java features, which can subsequently be\
    \ used on the page. Here is the first that make it possible to introduce conditions\
    \ and loops on the JSP page, while the latter is the descriptor defined above\
    \ and is part of the project. The two TLDs are referenced on the page using prefix,\
    \ which is c and f respectively.\n\nIf you choose body, you can see that a bean\
    \ is defined and its properties must be updated. Next, there is a form with an\
    \ input field and submit button, and compared to the previous example there is\
    \ nothing here. Next, condition follows:\n\n```jsp\n<c:choose>\n<c:when test=\"\
    ${f:isPrime(prim.prime)}\">\n  is a prime\n</c:when>\n<c:otherwise>\n  is not\
    \ a prime\n</c:otherwise>\n</c:choose>\n```\n\nchoose is a construct that is defined\
    \ in the tag library, which is defined by prefix c, and corresponds to switch\
    \ statement. When each element is controlled by condition, in this case the value\
    \ returned from the bean is a number. The method isPrime() is defined in the library\
    \ that has prefix f and you should note how to write the condition. If the condition\
    \ is met, the HTML is inserted into the document. Or, the subsequent otherwise\
    \ as if/else, but all the elements may be needed.\n\n## PROBLEM 1\n\nYou must\
    \ solve the same task as in book 2, but this time it should be a web application.\
    \ This means that you must write a loan calculation program, where the user must\
    \ enter parameters for a loan (cost, loan amount, interest rate, number of years\
    \ and periods per year). The program should then calculate the payment. The program\
    \ should start with a form as shown below. If illegal values are entered:\n\n\
    - the costs must not be negative\n- the loan amount must not be negative\n- number\
    \ of years must be between 1 and 60\n- number of periods a year must be between\
    \ 1 and 12\n- the interest rate must be greater than 0 and less than 25\n\nyou\
    \ should instead be redirected to an error page.\n\nIf you click on the Clear\
    \ button, the form fields may be blank.\n\n![](img/589e4f95edc213964881c85e009923c9_80_0.png)\n\
    \nIf legal loan parameters are entered and loan calculation is made, an additional\
    \ button must be displayed and clicking this button should redirect you to a page\
    \ showing an amortization plan. The individual pages (home page and page with\
    \ the amortization plan) must be written as JSP pages, and the loan should be\
    \ represented by a Java bean.\n\n![](img/589e4f95edc213964881c85e009923c9_81_0.png)\n\
    \n## 5.3 JSP DOCUMENTS\n\nWhen you create a jsp page in NetBeans you get the window\
    \ as shown below, where for Options as default is JSP File (Standard Syntax),\
    \ and in most cases you will probably stick to it, but you can also select JSP\
    \ Document (XML Syntax). The result is a JSP page which has the extension jspx,\
    \ which resembles a standard JSP page, but it is a requirement that the page is\
    \ wellformed XML. The above examples are already wellformed, there will be no\
    \ big difference besides a requirement. Most importantly, however, a JSP document\
    \ does not allow the use of scriptlets, forcing the programmer to place all Java\
    \ code in Java beans and other classes, and that is the exact goal of this variation\
    \ of JSP pages.\n\n## New JSP\n\n| Steps | Name and Location |\n| :--- | :---\
    \ |\n| 1. Choose File Type | start |\n| 2. Name and Location | Project: DateTimeServer<br>Location:\
    \ Web Pages<br>Folder: [ Browse... ]<br>Created File: /home/ba/work/java/java\
    \ 11/source1/DateTimeServer/web/start.jsp<br>Options: [x] JSP File (Standard Syntax)\
    \ [ ] Create as a JSP Segment<br>[x] JSP Document (XML Syntax) |\n| Description\
    \ | A JSP file using XML syntax. |\n\nAs an example, I will show the first program\
    \ in this chapter (the web application DateServer), where the start.jsp is replaced\
    \ by a page start.jsp. The program is called DateTimeServer Bean and performs\
    \ exactly same as the application DateServer. It uses the same Java bean DateBean,\
    \ and additionally, the following simple bean is added:\n\n```java\npackage datetimserver.beans;\n\
    \nimport java.util.*;\n\npublic class CurrentTime implements java.io.Serializable\n\
    {\n    public CurrentTime() {\n    }\n\n    public String getTime() {\n      \
    \  Calendar dt = Calendar.getInstance();\n        return String.format(\"%02d-%02d-%04d\
    \ %02d:%02d:%02d\", dt.get(Calendar.DATE),\ndt.get(Calendar.MONTH) + 1, dt.get(Calendar.YEAR),\n\
    dt.get(Calendar.HOUR_OF_DAY), dt.get(Calendar.MINUTE),\ndt.get(Calendar.SECOND));\n\
    \    }\n}\n```\n"
