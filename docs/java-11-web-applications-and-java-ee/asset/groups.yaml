    As mentioned above, HTTP defines seven methods, and GET and POST are the most
    important. GET is the simplest and simply consists of sending a request to a server
    that it should send a document with a given document address. There is no data
    block in connection with a GET. The document that GET refers may be a program
    – for example a servlet – and you can transfer data to such a program. This happens
    part of URL:


    ```

    GET /index.xhtml?code=7800&date=20030423 HTTP/1.1

    ```


    and you would be in the browser''s address field types


    ```

    http://server:8080/index.xhtml?code=7800&date=20030423

    ```'
  - '[PAGE 211]


    # JAVA 11: WEB APPLICATIONS AND

    JAVA EE: SOFTWARE DEVELOPMENT


    # APPENDIX B: HTTP


    Here two data elements are transferred to the page index.xhtml. The question mark
    after

    the document address indicates that a parameter is sent in pairs


    keyword=value


    If more parameters are sent, each pair must be separated by &.


    POST is different as data it is encapsulated in the data block and the method
    is used when

    larger and more complex data sizes are sent to the server. With POST it is possible
    to

    enclose data of different types in the same request as well as to send binary
    data to the

    server. Another important difference between GET and POST is that when GET data
    is

    added to the URL, they are also visible to the user in the browser’s address bar,
    which is

    not always desirable. This is not the case with the POST method. In addition,
    it should be

    ned that the server may have limitations regarding the length of an URL, and thus
    how

    many data can be sent with GET.


