    # APPENDIX B: HTTP


    Here www.eadania.dk is the server name, while education/it/index.xhtml is the
    name of the

    file on the server relative to a directory determined by the server. Exactly an
    URL format is


    http://Servernav:port/Filenavn


    where port is the port number used by the web server, but if nothing is specified,
    the browser

    will use port 80, which is standard on the Internet.


    In HTTP, a client request and response from a server consist of three parts:


    +   - request- or response line

    - a header

    - data


    A web-transaction consist of


    +   - a client request

    - a server response


    and it is initiated by the client by establishing a connection to the server at
    a predetermined

    port. Default is, as mentioned, port 80. The client sends an HTTP command followed

    by the document address and the version of the protocol that is used. It could,
    for example, be


    ```

    GET /index.htm HTTP/1.1

    ```


    Next, the header is sent, consisting of a number of lines of the form


    Keyword: Value


    where each line ends with a carriage return and a line feed. As an example, it
    could be


    ```

    User-Agent:Lynx/2.4 libwww/5.1k

    Accept:image/gif, image/x-bitmap, image/jpeg, /*

    ```


    After the last header line is sent, which it may follow data to be sent to

    the server and it all ends with another blank line.'
  - '[PAGE 208]


    # JAVA 11: WEB APPLICATIONS AND

    JAVA EE: SOFTWARE DEVELOPMENT


    # APPENDIX B: HTTP


    A command associated with a request is also called for a method and there are
    7 methods:


    | Method | Description |

    | --- | -- |

    | OPTIONS | Used to ask a server about what options it offers. |

    | GET | Asks the server to return the document that the document address specifies.
    |

    | HEAD | In principle, as GET, the server does not return the actual content of
    the document. It is used to test if the document has been changed since the last
    request. |

    | POST | Used to send a data block to the server along with a request. |

    | PUT | It is the opposite command to GET and stores the data block on the document
    address. |

    | DELETE | Deletes the document on the server that the document address specifies.
    |

    | TRACE | Used to track a request''s route through different firewalls and proxy
    servers and used in connection with debugging of complex network issues. |


    As mentioned, a response from a server also consists of three parts. The first
    line has the format


    Protocol Statuscode Description


    and as example it be


    ```

    HTTP/1.1 200 OK

    ```


    Then, the server''s header contains information about the server and the document
    that is being sent. The header consists of lines of according to the same pattern
    as a request, and it ends in the same way with a blank line. After the header
    comes the data block, which may be a document, an output from a program or possibly
    an error message.


    One of the differences between HTTP / 1.0 and HTTP / 1.1 is that in 1., the connection
    is not terminated after the server has completed its response. The reason is that
    many HTML documents contain references to other files such as images, etc., and
    the client may therefore request such resources without having to re-establish
    the connection.


    The HTTP protocol defines many headers, but the most important is the following
    where Q stands for request while S is for response:'
