    ## 6.3 TEMPLATES


    As mentioned, a web application will consist in practice of many pages or views,
    and typically they are similar to each other and have a common design. In addition,
    templates can be used, and the following application shows how. Specifically,
    I will show the development of an application step by step, including how to use
    templates. The example also shows a number of other details regarding web development,
    and especially the ability to use components, which are code that can be used
    in multiple views. In addition, the example shows how to apply images. The application
    is called PaWeb and will illustrate a very simple personal website where a person
    (and the author) wishes to share private information using a public website.


    The application is created as all other web applications in this chapter, and
    a Facelet is created, index.xml, which serves as the applications launcher. Note
    that after the application has been created, in addition to index.xml, a descriptor
    web.xml has also been created, basically that it is a JSF application. I have
    edited index.xml, so the finished code of the following, which shows a welcome
