    </attribute>

    <attribute>

    <name>master2</name>

    <rtexprvalue>true</rtexprvalue>

    <required>false</required>

    </attribute>

    </tag>

    <taglib>

    ```


    Note, as a short-name, I have used the letter t. The file defines a single element

    called webmaster, and in addition to the class, you must define the element’s

    attributes, and in this case there are two. An attribute is defined by the name,
    and where

    it is required. The name rtexprvalue specifies whether the attribute must be initialized
    with

    a $ server value.


    With this custom item in page, the header can be defined as the following JSP
    page,

    header.jsp:


    ```

    <@taglib uri="WEB-INF/tlds/taglib.tld" prefix="t" %>

    <html xmlns:jsp="http://java.sun.com/JSP/Page" version="2.0">

    <jsp:directive.page contentType="eBooks at bookhoon" pageEncoding="UTF-8"/>

    <div class="header-class" style="height: 40px;">

    <table>

    <tr>

    <td style="font-size: xx-large; font-weight: bold; color: navy;">

    Borrome voldsted</td>

    <td style="font-size: small; color: gray;">

    <:webmaster master1=Knud den Store master2=Regnar Lodbrog//></td>

    </tr>

    </table>

    <br/>

    </div>

    </html>

    ```


    You should note that the tag library described above is defined by a directive,
    but otherwise

    y should notice that there is no body. It’s not a real JSP page, but some JSP
    that is

    intended to be inserted into another JSP page.'
