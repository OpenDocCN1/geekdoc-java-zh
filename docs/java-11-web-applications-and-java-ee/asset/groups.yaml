  - "[PAGE 126]\n\n# JAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\
    \nAs a conclusion, JSF application connects a number of XHTML pages that contain\n\
    primarily JSF elements as well as one or more named beans and optionally a configuration\n\
    file called faces-config.xml. As the following examples show, there may also be\
    \ other Java\nclasses, which typically represent model classes.\n\nAs part of\
    \ the project, NetBeans has a web.xml configuration file:\n\n```\n<?xml version=\"\
    UTF-8\"?>\n<web-app version=\"3.1\" xmlns=\"http://xmlns.jcp.org/xml/javaee\"\n\
    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nsxi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/javaee/web-app_3_1.xsd\">\n<context-param>\n  <param-name>javax.faces.PROJECT_STAGE</param-name>\n\
    \  <param-value>Development</param-value>\n</context-param>\n<servlet>\n  <servlet-name>Faces\
    \ Servlet</servlet-name>\n  <servlet-class>javax.faces.webapp.FacesServlet</servlet-class>\n\
    \  <load-on-startup>true</load-on-startup>\n</servlet>\n<servlet-mapping>\n  <servlet-name>Faces\
    \ Servlet</servlet-name>\n  <url-pattern>/faces/*</url-pattern>\n</servlet-mapping>\n\
    <session-config>\n  <session-timeout>\n    30\n  </session-timeout>\n</session-config>\n\
    <welcome-file-list>\n  <welcome-file>faces/index.xhtml</welcome-file>\n</welcome-file-list>\n\
    </web-app>\n```\n\nThere is not much to note, and it is rarely maintained this\
    \ file, but initially a context-param element was inserted that defines a param\
    \ value with the Development, which means adding some debug information to the\
    \ project. It is not interested in a finished\napplication, and the value can\
    \ then be changed to Production. Also note that web.xml\ndefines the start page.\n\
    \nDownload for free eBooks at bookoon.com"
