    # 5 JSP


    Above I have introduced servlets and shown how they can be used (and are used)
    to write dynamic websites, but it is also clear that it is a big and difficult
    task to develop complex web applications alone using servlets. Therefore JSP pages
    are introduced, which you can briefly characterize as documents as a mixture of
    HTML and Java code. The Java code will be executed on the server before the document
    is sent to the client''s browser. This is best explained with an example.


    I have inBeans created a new web application, which I have called DateServer,
    and the result is as before an application with a homepage called index.html.
    Next, I rightclicked the Web Pages folder and select New and JSP and added a new
    JSP page, which I have called start, and the result is that a file named start.jsp
    is added to the project, whose content is an initial comment:


    ```

    <@page contentType="text/html" pageEncoding="UTF-8%">

    <!DOCTYPE html>

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>JSP</title>

    </head>

    <body>

    <h1>Hello World!</h1>

    </body>

    </html>

    ```


    As you can see, it looks like a regular HTML document, and there are only two
    differences, which is the first line, and so the extension jsp. The latter is
    as important as it tells the web server that the document is to be translated
    before it is sent to the browser. If rightclick on the name of the Projects tab
    and select Run File, the document will automatically be translated and opened
    in the browser.


    Currently, there is Java, but as the next step, I have right-clicked the Packages
    folder and added a class named DateBean. The code is the Java bean, as I have
    shown in the previous chapter. This Java bean can then be used from the JSP page
    as follows:


    ```

    <@page contentType="text/html" pageEncoding="UTF-8%">

    <!DOCTYPE html>

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    ```


