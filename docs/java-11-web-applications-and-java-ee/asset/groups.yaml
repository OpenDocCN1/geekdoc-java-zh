    \nI want to start with the class, which represents an address. The class is called\
    \ Person, and is a usual model class and in fact it is a Java bean:\n\n```\npackage\
    \ changeaddress.models;\npublic class Person implements java.io.Serializable\n\
    {\n    private String firstName;\n    private String lastName;\n    private String\
    \ address;\n    private String code;\n    private String city;\n    private String\
