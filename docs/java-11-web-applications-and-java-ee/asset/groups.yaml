    # JAVA 11：Web应用程序与 Java EE：软件开发 JSF


    程序必须使用 Java Faces 编写。除了写入访客簿的表单外，还必须有一个 JSF 页面，主页链接到该页面显示访客簿的内容。


    ## 6.3 模板


    如所述，Web应用程序在实践中由许多页面或视图组成，通常它们之间彼此相似并且具有共同的设计。此外，可以使用模板，下面的应用程序展示了如何使用模板。具体而言，我将逐步展示应用程序的开发过程，包括如何使用模板。该示例还展示了关于
    Web 开发的许多细节，特别是使用组件的能力，组件是可以在多个视图中使用的代码。此外，示例还展示了如何应用图像。该应用程序名为 PaWeb，它将展示一个非常简单的个人网站，某个人（以及作者）希望通过公共网站分享私人信息。


    该应用程序的创建方式与本章中的所有 Web应用程序一样，创建了一个 Facelet 文件 `index.xml`，作为应用程序的启动器。请注意，在创建应用程序后，除了
    `index.xml` 之外还创建了描述符 `web.xml`，基本上说明这是一个 JSF 应用程序。我编辑了 `index.xml`，以下是完成的代码显示了一个欢迎页：


    ```xml

    <?xml version=''1.0'' encoding=''UTF-8'' ?>

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN"> <html xmlns="http://www.w3.org/1999/xhtml"
    xmlns="http://xmlns.jcp.org/jsf/">

    <head>

    <title>Facelet Title</title>

    </head>

    <body style="color: darkblue; background: bisque">

    <form>

    <div style="font-size: 144pt; font-weight: bold; text-align: center">Welcome</div>

    <div style="font-size: 72pt; text-align: center">to my website</div>

    <div style="font-size: 36pt; text-align: center">关于我生活中点滴事的网站</>

    <p style="text-align: center"><h:commandLink value="听起来很有趣，请在此继续阅读" action="gallery/

    ```


    # JAVA 11：Web应用程序与 Java EE：软件开发


    没有什么需要解释的，但你应该注意，代码是复杂的 HTML 元素和如下所示 JSF 元素的混合：


    ```

    <h:code ...>...</h:code>

    ```


    JSF 元素是服务器端代码，因此是由服务器翻译为 HTML 并作为服务器响应一部分的元素。有许多这样的 JSF 元素，混合 JSF 元素和 HTML 元素并没有问题。同样请注意，上面的
    JSF 视图定义了样式。样式将在下一书中处理，但当你看到上面的代码时，很容易解释每个视图使用了什么。注意，使用此类视图可以定义非常大的字体。该视图是一个表单，因为它包含单个元素，该元素包含一个
    `commandLink`，该链接会被服务器翻译成一个普通的链接元素。该项目有一个 `action` 属性，如果你点击链接，则视图应该显示名为 `gallery.xhtml`
    的视图。虽然此视图尚未创建，但应用程序可以很容易地被翻译并在浏览器中打开。


