    | Accept-Encoding: | x | Specifies what types of encodings the client knows. If
    this is omitted, the header, the client will accept all encodings. |

    | Accept-Language: | x | Specifies which languages the client accepts. |

    | Age: | x | Used in conjunction with cache control. |

    | Allow: | x | Specifies what methods the resource on the document address can
