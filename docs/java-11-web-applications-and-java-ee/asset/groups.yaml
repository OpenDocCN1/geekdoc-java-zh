    \ has a named bean. The class is simple and consists primarily of get set methods,\
    \ where I have only shown a few examples:\n\n```\npackage changeaddress.beans;\n\
    \n...\n\n@Named(value = \"indexController\")\n@SessionScoped\npublic class IndexController\
    \ implements Serializable\n{\n    private Person person = new Person();\n    private\
    \ List<Person> persons = new ArrayList();\n\n    public IndexController()\n  \
    \  }\n\n    public String getFirstName()\n{\n        return person.getFirstName();\n\
    \    }\n\n    public void setFirstName(String firstName)\n{\n        person.setFirstName(firstName);\n\
    \    }\n\n...\n\n    public List<Person> getPersons()\n{\n        return persons;\n\
    \    }\n\n    public void add()\n{\n        if (person.isLegal()) {\n        \
    \    persons.add(person);\n            person = new Person();\n        }\n   \
    \ }\n```\n\nSeen from index.xhtml is the most important method add() as the method\
    \ that is performed when clicking the Send button. It tests whether a person is\
    \ legal, and if that is the case, the method adds a Person object to the list,\
    \ after which a New object is created.\n\nI have chosen this bean session scope\
    \ that means the bean exists for the current HTTP request. That is, it must be\
    \ created for each request.\n\n- 1. Request which means the bean exists for the\
    \ current HTTP request.\n- 2. Session which means the bean object exists within\
    \ a single user HTTP session.\n- 3. Conversation which means the bean exists across\
    \ multiple HTTP requests.\n- 4. Application which means the same bean is available\
    \ to all users of the application across multiple user sessions.\n- 5. Dependent\
    \ which means the bean is created every time there is a need.\n\nThen index.xhtml\
    \ is a typical example of a form:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
