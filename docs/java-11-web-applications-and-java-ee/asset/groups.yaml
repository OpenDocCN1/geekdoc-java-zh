- md: "\n## JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT\n\n### JSF\n\
    \n# New JSF Composite Component\n\n| Steps | |\n|---|---|\n| 1. Name and Location\
    \ | File Name: search |\n| Project: PaWeb | Location: PaWeb - Web Pages |\n| Folder:\
    \ resources/ezcomp | Browse |\n| Created File: src/java/Java 11/source11/PaWeb/web/ezcomp/search.xhtml\
    \ | |\n| Prefix: | |\n| Implementation Section: | |\n\nHere I enter the name (in\
    \ this case *search*) and where the component is to be placed. NetBeans suggests\
    \ *resources/ezcomp*, and it is recommended to keep this name. When you click\
    \ *Finish*, NetBeans creates a file *search.xhtml*.\n\n![](img/589e4f95edc213964881c85e009923c9_161_0.png)\n\
    \nEmpowering People. Improving Business. BI Norwegian Business School is one of\
    \ Europe's largest business schools welcoming more than 20,000 students. Our programmes\
    \ provide a stimulating and multi-cultural learning environment with an international\
    \ outlook providing professional skills to meet the increasing needs of businesses.\
    \ BI offers four two-year Master of Science (MSc) programs that are taught in\
    \ English and have been designed to provide professional skills to meet the growing\
    \ need of businesses. The MSc programs provide a stimulating and multi-cultural\
    \ learning environment to give you the best platform to launch your career.\n\n\
    - MSc in Business\n- MSc in Financial Economics\n- MSc in Strategic Marketing\
    \ Management\n- MSc in Leadership and Organisational Psychology\n\nwww.bi.edu/master\n\
    \nDownload free eBooks at ebook.com\n\n# JAVA 11: WEB APPLICATIONS AND JAVA EE:\
    \ SOFTWARE DEVELOPMENT JSF\n\n```xml\n<?xml version='1.0' encoding='UTF-8' ?>\n\
    <!DOCTYPE html PUBLIC \"-W3C//DTD HTML 1.0 Transitional/EN\"> ...\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\"\nxmlns:cc=\"http://xmlns.jcp.org/jsf/composite\"\
    >\n<!-- INTERFACE ---\n<cc:interface>\n</cc:interface>\n<!-- IMPLEMENTATION ---\n\
    <cc:implementation>\n</cc:implementation>\n</html>\n```\n\nIt is nothing but a\
    \ simple skeleton, in which an interface part must define the component's attributes,\
    \ while in the implementation section it is necessary to define the code to be\
    \ rendered by the browser. The finished component is shown below:\n\n```xml\n\
    <?xml version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"-W3C//DTD HTML\
    \ 1.0 Transitional/EN\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"\
    http://xmlns.jcp.org/jsf/html\"\nxmlns:f=\"http://xmlns.jcp.org/jsf/core\"\nxmlns:cc=\"\
    http://xmlns.jcp.org/jsf/composite\">\n<cc:interface>\n<cc:attribute name=\"searchList\"\
    />\n<cc:attribute name=\"searchAction\"\ndefault=\"#{searchController.searchData(cc.attrs.searchList)}\"\
    \nmethod-signature=\"java.lang.String action(java.util.List)\" />\n</cc:interface>\n\
    <cc:implementation>\n<h:form id=\"searchForm\">\n<h:outputText id=\"error\" value=\"\
    #{searchController.errorText}\"/>\n<h:inputText id=\"searchText\" class=\"searchBox\"\
    \ style=\"width: 200px\"\nvalue=\"#{searchController.searchText}\" />\n<h:commandButton\
    \ id=\"searchButton\" value=\"Search\"\naction=\"#{cc.attrs.searchAction}\" />\n\
    <h:commandLink value=\"#{searchController.foundText}\" action=\"photoview\">\n\
    <f:param name=\"imagename\" value=\"#{searchController.imageText}.jpg\" />\n</h:commandLink>\n\
    </h:form>\n</cc:implementation>\n</html>\n```\n\nDownload free eBooks at bookbom.com\n\
    \n# JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT\n\nNote, first\
    \ I have added the two default namespaces regarding JSF elements. Then, two attributes\
    \ are defined, the first being a attribute searchList. The other is called searchAction\
    \ and defines a method. It has a default value which is a method defined in a\
    \ named bean SearchController that has the value of the searchList attribute as\
    \ a parameter. In addition, there is a definition of the method signature as a\
    \ method that returns a String and has a List as a parameter. The implementation\
    \ section starts with an OutputStream, to be used for an error message from searchController\
    \ (if you are looking for something that does not exist). Next, there is an inputText\
    \ where the user can enter a search text and subsequently a commandButton whose\
    \ action is the method defined in the interface section. Finally, there is a commandLink\
    \ whose value is bound to a property in searchController and whose action is photoview.xhtml.\
    \ This link defines a parameter that is also bound to a property in searchController.\n\
    \nAs be seen, this component uses a named bean:\n\n```java\npackage paweeb.beans;\n\
    \nimport java.util.*;\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n\nimport paweeb.models.*;\n\n@Named(value = \"searchController\"\
    )\n@SessionScoped\npublic class SearchController implements Serializable {\n\n\
    \    private String searchText;\n    private String errorText;\n    private String\
    \ imageText;\n    private String foundText;\n\n    public SearchController() {\n\
    }\n\n    public void searchData(List<Data> list) {\n        errorText = \"\";\n\
    \        for (Data data : list) {\n            if (data.get().toLowerCase().contains(searchText.toLowerCase()))\
    \ {\n                imageText = data.getName();\n                foundText =\
    \ data.getText();\n                return;\n            }\n        }\n       \
    \ imageText = \"\";\n        foundText = \"\";\n        setErrorText(\"Not found\"\
    );\n    }\n```\n\n```java\npublic String getSearchText(){\n    return searchText;\n\
    }\n```\n\n```java\npublic void setSearchText(String searchText){\n    this.searchText\
    \ = searchText;\n}\n```\n\n```java\npublic String getErrorText(){\n    return\
    \ errorText;\n}\n```\n\n![](img/589e4f95edc213964881c85e009923c9_164_0.png)\n\n\
    ```java\npublic void setErrorText(String errorText)\n{\n    this.errorText = errorText;\n\
    }\n```\n\n```java\npublic String getImageText()\n{\n    return imageText;\n}\n\
    ```\n\n```java\npublic String getFoundText()\n{\n    return foundText;\n}\n```\n\
    \nIt defines four properties, and must be used for:\n\n1. searchText, like is\
    \ searched for\n2. errorText, which is an error message in the case that nothing\
    \ is found\n3. imageText, which is the text of found\n4. foundText, which is the\
    \ name of found\n\nOtherwise the component is complete. After the component is\
    \ complete, it must be used in search.xhtml:\n\n```xml\n<?xml version='1.0' encoding='UTF-8'\
    \ ?>\n<!DOCTYPE html PUBLIC \"-W3C//DTD HTML 1.0 Transitional/EN\">\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\"\nxmlns:ui=\"http://xmlns.jcp.org/jsf/facelets\"\
    \nxmlns:f=\"http://xmlns.jcp.org/jsf/core\"\nxmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    \nxmlns:ez=\"http://xmlns.jcp.org/jsf/composite\">\n<body>\n<ui:composition template=\"\
    ../mainTemplate.xhtml\">\n<ui:define name=\"top\">\n<h2>Poursite website</h2>\n\
    <ez:search id=\"searchGallery\" listBox=\"#{gallerycontroller.photos}\"/>\n</ui:define>\n\
    </ui:composition>\n</body>\n</html>\n```\n\n# JAVA 11: WEB APPLICATIONS AND JAVA\
    \ EE: SOFTWARE DEVELOPMENT\n\n```xml\n<ui:define name=\"content\">\n  <form>\n\
    \    <html>Some pictures from Africa/</html>\n    <h:dataTable value=\"#{galleryController.photos}\"\
    \ var=\"img\">\n      <f:facet name=\"header\">Photos</f:facet>\n      <h:column>\n\
    \        <h:commandLink value=\"#{img.text}\" action=\"photoview\">\n        \
    \  <f:param name=\"imagename\" value=\"#{img.name}.jpg\" />\n        </h:commandLink>\n\
    \      </h:column>\n    </h:dataTable>\n  </form>\n</ui:define>\n```\n\nHere you\
    \ should note how to use the component and here specifically how to specify the\
    \ list to be searched using the attribute defined in the component's interface\
    \ part.\n\nThen the first part of the application is completed and I have to implement\
    \ the part corresponding to the first menu item in the left sector. It is in principle\
    \ a repeat of much of the above, but the following is made.\n\nI have created\
    \ a model class completely identical to *Photo:*\n\n```java\npackage paweb.models;\n\
    \npublic class Car extends Data {\n  public Car(String name, String text) {\n\
    \    super(name, text);\n  }\n\n  public String toString() {\n    return getText();\n\
    \  }\n}\n```\n\nThere is of no reason for this class, and it is included only\
    \ to show that in practice, the contents of this class would be different from\
    \ *Photo.*.\n"
