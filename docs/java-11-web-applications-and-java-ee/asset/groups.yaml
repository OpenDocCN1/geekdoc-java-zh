    styles.css\" />\n</head>\n<body>\n<h1>Change address</h1>\n<form>\n  <h:panelGrid\
    \ columns=\"3\" columnClasses=\"rightalign,leftalign,left\">\n    <h:outputLabel\
    \ value=\"First name:\" for=\"firstName\" />\n    <h:inputText id=\"firstName\"\
    \ label=\"First name\" required=\"true\" style=\"width:300px\" value=\"#{indexController.firstName}\"\
    \ />\n    <h:message for=\"firstName\" class=\"error-message\" />\n    <h:outputLabel\
    \ value=\"Last name:\" for=\"lastName\" />\n    <h:inputText id=\"lastName\" label=\"\
    Last name\" required=\"true\" style=\"width:200px\" value=\"#{indexController.lastName}\"\
    \ />\n    <h:message for=\"lastName\" class=\"error-message\" />\n    <h:outputLabel\
    \ value=\"Address:\" for=\"address\" />\n    <h:inputText id=\"address\" label=\"\
    Address\" required=\"true\" style=\"width:300px\" value=\"#{indexController.address}\"\
    \ />\n    <h:message for=\"address\" class=\"error-message\" />\n    <h:outputLabel\
    \ value=\"Zip code:\" for=\"code\" />\n    <h:inputText id=\"code\" label=\"zipcode\"\
    \ />\n  </h:panelGrid>\n  <h:commandButton value=\"Send\" action=\"#{indexController.add}\"\
    \ />\n</form>\n</body>\n</html>\n```\n"
