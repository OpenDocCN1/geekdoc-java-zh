    # JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT A LAST EXAMPLE


    The first function is simple and can only be performed by a user with administrator
    privileges.

    It includes two views:


    - brands.xhtml, which shows an overview of all the car brands that have been created
    and where you are editing a car brand by clicking on it

    - brand.xhtml which are used to create and maintain car brands


    The next function is the most comprehensive and can be performed by everyone,
    but if you are not created with administrator right, only your own cars will be
    displayed.

    The function has three views:


    - cars.xhtml, which shows an overview of all cars grouped by the car brand, so
    if you click on a car brand, you get all the cars for this brand and click on
    a car, you get all the car details and there is also a link so you can edit the
    information about the car

    - car.xhtml, which is used to create and maintain information about a car

    - showc.xhtml, which shows details about a car and including any pictures


    When this feature is complex, it is partly because of uploading of images, where
    it should be possible to edit the caption as well as showc.xhtml being able to
    display an image (the contents of a file). The last problem is solved with a servlet.


    The third function reminds of the first function and can be performed by all users
    with administrator privileges. The function has two views:


    - owners.xhtml, showing an overview of all owners

    - owner.xhtml, used to create and edit owner (member) information


    After implementing these functions, I have written the code to the public page.


    # The public side


    From the welcome page you will get to main.xhtml, which is the web site''s central
    page. Here you can click on cars using a left-hand menu where all cars are grouped
    by car brand. You also search for a car using any text that searches for the car
    brand, name, model and text. The cars that match are shown in a drop-down box
    from which you can choose a car.


    At the top there is also a link to the guestbook, which consists of two views:


    - guests.xhtml, which allows to search the guestbook you can search by date or
    enter a search text for name and in it itself

    - guest.xhtml, which allows you to write in the guestbook


    # Completion of the administration part


    Lastly, I have completed the administration part. The password change function
    is simple and consists only of a single view with a controller. The last feature
    also has just a single view and is virtually identical to guests.xhtml and uses
    the same controller. The only difference is that it is possible to delete a page
    in the guestbook.


    # 7.4 DEPLOYMENT


    In order for a web application to be executed (opens in the browser), the application
    must be installed on the Glassfish server, a process called deployment. For the
    time being, I have ignored everything about it, as NetBeans does it quite automatically
    on a local running Glassfish server. I will now, as an example, show how you can
    deploy the current application on another machine. The prerequisite is that the
    machine has a running Glassfish server as well as a running database server. The
    process requires two files:


    - 1. veteran.sql, which is the SQL script to create the database

    - 2. VeteranCars.war, which is the war file with the web application (found in
    the project''s dist directory)


    ![](img/589e4f95edc213964881c85e009923c9_194_0.png)


    The first step is to create the database, which simply consists of running the
    above script. Next, a directory must be created for images. Note that if you want
    a database of data, you can backup the database from the developer machine and
    create a restore of it, while also remembering to copy the images from the developer
    machine.


    For deployment, open the admin program in the browser:


    ![](img/589e4f95edc213964881c85e009923c9_195_0.png)


    Here you have to click on Applications on the left side and on the tab Deploy
    ... and then you can browse to the file (see below). All other settings can be
    retained as default, and then click OK, the application will be deployed.


    ![](img/589e4f95edc213964881c85e009923c9_196_0.png)


    All that remains is to ensure that the parameters of web.xml for the database
    server and the directory for images, are correct. You can edit the file by clicking
    on the application name and selecting the Descriptor tab (see below). Here is
    a link to web.xml, where you can edit the file.


    ![](img/589e4f95edc213964881c85e009923c9_196_1.png)


    Then everything should be ready and the application can be opened in the browser
    (on another machine) by typing (assuming that the IP address is correct):


    ```

    http://192.168.1.48:8080/VeteranCars

    ```


    ![](img/589e4f95edc213964881c85e009923c9_197_0.png)


    # 8 A FINAL REMARK


    The example in the previous chapter should be perceived as a form of status of
    this introduction to web applications, and it is also a classic example of a web
    application. The question is what''s missing before you''re fully trained as a
    web developer – and there''s more and more than I get in these books. I would
    like to end up with a little on the above application, and in particular the shortcomings
    of the application and the requirements for web applications in practice and those
    topics that are dealt with some degree in the following two books. I will look
    at the program in relation to the following 5 headings:


    - 1. Maintenance friendly

    - 2. Attractive user side interfaces

    - 3. Client side programming

    - 4. Authentication and security

    - 5. Distributor programmer


    # Maintenance friendly


    In this context, thinking about maintenance, I do not think so much about the
    program''s beans and other Java classes, where there is not much to add to what
    is said otherwise about in the previous books in this series, but instead the
    maintenance of the individual facets. Let me instantly confirm that the application
    leaves much to be desired at this point. Perhaps this example is ok, as it is
    a small application, but a larger application developed in the same way as the
    above will be hopeless to maintain. The problem is the use of styles, where styles
    are used in many elements around the individual views. There is nothing wrong
    with styles and that''s exactly the meaning, that the layout and feel of a web
    application''s views should be implemented using styles but it should be done
    using class''s defined in style sheets and not enough with that, it must be based
    on a well-defined plan.


    In fact, I have not mentioned styles yet, but just used as needed. This is one
    of the following where I generally will focus on client side of web applications.


    # Attractive user interfaces


    Looking at web applications, one quickly recognizes that much energy has been
    used for a web application to be great (whatever it is) and user-friendly, so
    users want to visit the site. How to achieve it is not the subject of these books,
    although it is based on individualism and fortunate beliefs, there are theories
    for how a web site should be developed to make it user-friendly and easy to use.
    These include the use of colors, font and font size, graphics, and ease of navigating
    the site.


    The current example is missing a lot at point, and as another problem, the application
    is hard-coded to a large screen (the individual view elements have a fixed size)
    that does not work.


    # Client side programming


    Often, you will be interested in something dynamic on the client side and without
    the need for a request to the server. It requires the browser to execute program
    code, and here is the preferred JavaScript, which is interpreted code. Today''s
    web applications can simply not be developed without the use of client code, and
    the next book will therefore include an introduction to JavaScript, which is a
    simple programming language with the same syntax as Java.


    # Authentication and security


    A very central issue in developing web applications is security. As mentioned
    under the design, it is also a place where this application leaves much to be
    desired, simply because I have not yet addressed what it takes, but it is also
    a subject dealt with later.

    '
