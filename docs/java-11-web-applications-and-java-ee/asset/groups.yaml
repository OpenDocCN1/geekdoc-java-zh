    ## APPENDIX B: HTTP


    HTTP stands for Hyper Transfer Protocol and is a protocol belonging to the application
    layer, and typically implemented implemented TCP / IP. It is a stateless protocol
    that, as mentioned, is based on request and response, when a client application
    sends a request to the server. The protocol is stateless means that after the
    server has sent the response, it has forgotten everything about the client. Whenever
    a client requests the server, it is perceived by the server as a new request.
    The HTTP protocol is thus stateless, presents many challenges in web applications,
    and there are several techniques to cope with these challenges, which I have already
