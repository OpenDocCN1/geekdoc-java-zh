    ## 3.2 SESSIONS\n\nHTTP is a stateless protocol. This means that each request\
    \ from the client is independent and the server does not remember any previous\
    \ requests. However, in many web applications, we need to store information about\
    \ the user across multiple requests. This is where sessions come in. A session\
    \ is a way to store information about a user across multiple requests. The session\
    \ is typically started when the user logs into the application and is ended when\
    \ the user logs out or the session times out.\n\n![](img/589e4f95edc213964881c85e009923c9_38_0.png)\n\
    \nTo implement sessions in Java EE, we use the HttpSession interface. The HttpSession\
    \ interface provides methods to create, get, and destroy sessions. For example,\
    \ you can create a session with the following code:\n\n```java\nHttpSession session\
    \ = request.getSession(true);\n```\n\nThe `true` parameter indicates that a new\
    \ session should be created if one does not already exist. If a session already\
    \ exists, the existing session will be returned. To store data in a session, you\
    \ use the setAttribute method:\n\n```java\nsession.setAttribute(\"key\", value);\n\
    ```\n\nTo retrieve data from a session, you use the getAttribute method:\n\n```java\n\
    Object value = session.getAttribute(\"key\");\n```\n\nTo remove an attribute from\
    \ a session, use the removeAttribute method:\n\n```java\nsession.removeAttribute(\"\
    key\");\n```\n\nTo invalidate a session, use the invalidate method:\n\n```java\n\
    session.invalidate();\n```\n\nIn Java EE, the session is identified by a session\
    \ ID, which is typically stored in a cookie on the client. The client sends the\
    \ session ID back with each request, and the server uses it to identify the correct\
    \ session.\n\n![](img/589e4f95edc213964881c85e009923c9_39_0.png)\n\nDownload free\
    \ eBooks at bookboom.com\n\nJAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT\
    \ PARAMETERS AND SESSIONS AND MORE\n\nThe session ID is stored in a cookie named\
    \ `JSESSIONID` by default. However, this can be changed in the web.xml file. Another\
    \ option is to store the session ID in the URL, but this is generally considered\
    \ less secure.\n\nSession timeout is the amount of time a session can remain inactive\
    \ before it is automatically invalidated. The session timeout can be configured\
    \ in the web.xml file:\n\n```xml\n<session-config>\n  <session-timeout>\n    30\n\
    \  </session-timeout>\n</session-config>\n```\n\nIn this example, the session\
    \ timeout is set to 30 minutes. This means that if a user does not make a request\
    \ for 30 minutes, their session will be invalidated.\n\n"
