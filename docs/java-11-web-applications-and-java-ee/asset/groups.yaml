    <h:outputLabel value=\"First name:\" for=\"firstname\" />\n<h:inputText id=\"\
    firstname\" label=\"first name\" required=\"true\"\nstyle=\"width:300px\" value=\"\
    #{indexController.firstname}\" />\n<h:message for=\"firstname\" class=\"error-message\"\
    \ />\n```\n\n第一个语句定义了标签，同时带有 `for` 属性的文本关联到了输入字段 `firstname` 上。当此字段具有 `label`\
    \ 属性时，是因为它与错误消息配合使用。注意字段的值是如何绑定到 `indexController` 中的属性的。最后，最后一个语句用于错误消息的，你应该注意带有\
    \ `for` 属性的元素关联到了输入字段上。如果你考虑这个输入字段，它有一个属性\n\n`required=\"true\"`\n\n这意味着验证器被关联到字段上，意味着必须输入姓名。如果没有，字段将显示错误消息。这是一个预定义验证器的示例。例如，如果你查看邮政码字段，它也有验证器来验证字段值的长度。这实际上是一个非常有用的验证器。如果你考虑输入字段\
    \ `date`，它使用了一个自定义验证器，Date 对象：\n\n```xml\n<h:inputText id=\"date\" label=\"Change\
    \ date\"\nrequired=\"true\" style=\"width:100px\"\nvalue=\"#{indexController.date}\"\
    \ immediate=\"true\" onchange=\"submit()\"\n<f:validator validatorId=\"dateValidator\"\
    />\n</h:inputText>\n```\n\n通常情况下，验证是在执行方法之前进行的。重要的是验证发生在服务端，并且向服务器发送了请求。如果所有字段未通过验证，则不执行执行方法，但会返回到\
    \ `index.xml` 并显示错误消息。你应该注意在这种情况下，输入具有两个属性：\n\n```xml\nimmediate=\"true\" onchange=\"\
    submit()\"\n```\n\n这意味着字段内容在失去焦点后立即进行验证，而不是在提交表单时。这个选项并不常用，因为你可以通过 ajax 做得更好。最后注意\
    \ `title` 字段，它没有验证器。\n\n如前，示例中的组件使用 `panelGrid` 放置，这是一个 JSF 元素，会被转换为 HTML 表格。还有一个\
    \ `panelGroup` 元素用于收集多个项目作为表格中的单个单元格。这里有一个 `panelGroup`，意味着一个空单元格。点击上面的链接将显示一个包含输入地址概述的页面。这也是一个\
    \ JSF 页面（即 Facelet）`list.xhtml`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE html PUBLIC \"-DTD GlassFish Application Server 3.1 Servlet\
    \ 3.0//EN\" \"http://glassfish.org/dtds/glassfish-web-app_3_0-1.dtd\">\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\" >\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\"/>\n<title>Facelet Title</title>\n<h:outputStylesheet\
    \ library=\"css\" name=\"styles.css\"/>\n</head>\n<body>\n<h:form>\n<h:messages\
    \ global=\"{true}\"\n```\n\n```xml\n<facet>\n<h:column id=\"nameCol\">\n  <facet\
    \ name=\"header\">Name</facet>\n  <h:outputText id=\"name\" value=\"${addr.firstname}\
    \ ${addr.lastname}\"/>\n</h:column>\n<h:column id=\"addrCol\">\n  <facet name=\"\
    header\">Address</facet>\n  <h:outputText id=\"addr\" value=\"${addr.address}\"\
    />\n</h:column>\n<h:column id=\"cityCol\">\n  <facet name=\"header\">City</facet>\n\
    \  <h:outputText id=\"city\" value=\"${addr.city}\"/>\n</h:column>\n<h:column\
    \ id=\"jobCol\">\n  <facet name=\"header\">Title</facet>\n  <h:outputText id=\"\
    job\" value=\"${addr.title}\"/>\n</h:column>\n<h:column id=\"mailCol\">\n  <facet\
    \ name=\"header\">Mail</facet>\n  <h:outputText id=\"mail\" value=\"${addr.email}\"\
    />\n</h:column>\n<h:column id=\"dateCol\">\n  <facet name=\"header\">Date</facet>\n\
    \  <h:outputText id=\"date\" value=\"${addr.date}\"/>\n</h:column>\n```\n\n![](img/589e4f95edc213964881c85e009923c9_137_0.png)\n\
