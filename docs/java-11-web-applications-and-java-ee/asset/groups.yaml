    When you see the code, it is easy to understand, and immediately notice that it
    is an XML document and much of the code is similar to HTML. However, many new
    elements are used, which are not standard HTML elements, but elements that are
    defined in two tags library are usually called JSF elements:


    ```

    xmlns:f="http://xmlns.jcp.org/jsf/core"

    xmlns:h="http://xmlns.jcp.org/jsf/html"

    ```


    Such an element defines different attributes that can be initialized and the element
    is translated into standard HTML. For example, there is an


    ```

    <h:messages errorStyle="color: red" infoStyle="color: green" globalOnly="true"/>

    ```


    which generally does not result in any code, but if there is an error in the calculation
    (division with 0) the following text is added to the document:


    +   <ul><li style="color: red">Invalid Calculation </li></ul>


    It is important to be aware that these new elements do not mean that you cannot
    use standard HTML. This is possible in the same way as before. It is just a matter
    of the new elements giving new opportunities and opportunities to generate the
    desired HTML easier than to write it from scratch. For an example how the dropdown
    list is defined:


    ```

    <h:selectMenu id="calculation"

    value="#{calculationController.calculation}"

    <f:selectItems value="#{calculationController.calculations}"/>

    </h:selectMenu>

    ```


