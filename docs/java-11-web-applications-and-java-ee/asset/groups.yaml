    \ isLegal()\n{\nreturn firstname != null && firstname.length() > 0 && lastname\
    \ != null &&\nlastname.length() > 0 && date != null && date.length() > 0;\n}\n\
    ```\n\nThere is not much to explain, and I have not shown the class's get and\
    \ set methods, as they are all trivial. You must note the last method, which states\
    \ that a Person is legal if the object has a first name, a last name and a date.\
    \ The purpose of the class is primarily to show that a web application can use\
    \ model classes in the same way as other Java applications and here especially\
    \ where the class is used from JSF pages.\n\nAs the next example, I will show\
    \ a Validator class, which in this case is used to validate an input field and\
    \ here the field's value must be a legal date:\n\n```\npackage changeaddress.validators;\n\
    ...\n\n@Faces(value=\"dateValidator\")\npublic class DateValidator implements\
    \ Validator\n{\n@Override\npublic void validate(FacesContext facesContext, UIComponent\
    \ uiComponent,\nObject value) throws ValidatorException\n{\nHtmlInputText inputText\
    \ = (HtmlInputText) uiComponent;\nString label = inputText.getLabel() == null\
    \ ||\ninputText.getLabel().trim().equals(\"\") ?\ninputText.getId() : inputText.getLabel();\n\
    if (!isDate((String) value))\nFacesMessage facesMessage =\n```\n\n```\nnew FacesMessage(label\
    \ + \": Illegal value for date\");\nthrow new ValidatorException(facesMessage);\n\
    }\n```\n\n```\nprivate boolean isDate(String text)\n{\n....\n}\n```\n\nFirst,\
    \ note that the class is decorated with an annotation telling that it is a Validator\
    \ class. Also note that the class implements the Validator interface, which defines\
    \ a single method validate(), which is the method that validates the field's value\
    \ that is the parameter value. uiComponent is the component whose value must be\
    \ validated and the method starts by determining the value of an attribute for\
    \ this component (either its ID or label). Next, the value is tested using a private\
    \ helper method called isDate(). I have not shown the code because it contains\
    \ nothing but what I have shown in other. If the value can not be validated correctly,\
