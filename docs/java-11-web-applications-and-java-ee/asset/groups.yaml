    # JAVA 11：WEB 应用程序与 Java EE：软件开发


    # 引言


    客户端是一个带有浏览器的普通工作站。浏览器类似于任何其他 PC 程序的程序，但通过浏览器，用户可以在浏览器的地址栏输入 Web 地址来向 Web 服务器发送请求。Web
    服务器是运行在某些机器上的程序。它是一个持续运行并监听请求的程序。请求意味着客户端浏览器想要收回一个 HTML 文档，Web 服务器将加载该文档并将其作为响应发送回客户端浏览器。一旦客户端获取到文档，浏览器就会对其进行渲染并显示在屏幕上。这意味着浏览器会解释
    HTML 代码，并根据代码决定文档在屏幕上应该什么样子。


    这至少是其基本的原理，尽管它在万维网（World Wide Web）诞生之初是这样工作的，但今天已经包含了多得内容。请求不仅涉及到发送回一个 HTML 文档，通常还会随请求发送数据（这些数据可能是关于购物车中项目的数据），还可能包含发送给服务器以查找特定数据的信息（例如来自搜索标准的信息）。这意味着服务器必须执行许多其他工作，例如在数据库中保存数据、从数据库中检索数据并动态构建要发送给客户端的响应。换句话说，Web
    服务器必须运行软件，这些程序基本上像任何其他程序一样被开发和执行，但仅运行在托管 Web 服务器的机器上。


    因此，Web 应用程序的特点是：程序代码在服务器上执行，然后以动态生成的 HTML 文档的形式将结果发回客户端。然而，客户端程序也可以包含由浏览器执行的代码。有几种选项，但最重要的是
    JavaScript，它是脚本代码（仅仅是文本），是作为 HTML 文档的一部分发送的。当然，这要求浏览器能够解释并执行 JavaScript 代码，但所有现代浏览器都能做到。另一个选项是向浏览器发送实际的翻译后的代码，例如
    Java applet，它的编写和翻译方式与 Swing 程序完全相同。人们可能将一个 Java applet 视作运行在浏览器窗口中的 Java 应用程序。当然，这需要为浏览器安装插件（扩展程序）。然而，由于
    Java applet 被翻译成二进制代码并在客户端机器上进行下载和执行，这种技术确保了一个许多让许多人并不乐意的安全风险。因此，Web 应用程序可以同时包含在服务器端执行的代码和在客户端执行的代码，但其代码的大部分是服务器端代码。因此，它们被称为用于客户端/服务器应用程序的
    Web 应用程序。


    # JAVA 11：WEB 应用程序与 Java EE：软件开发引言


    如上述，Web 应用程序构建在网络流量之上，每当用户发出请求时，获取响应之前存在延迟。Web 应用程序的运行方式与传统的桌面应用程序不同。尽管如此，以前由运行在客户端机器上的程序解决许多任务现在由
    Web 应用程序接管。这有几个原因。最重要的一点是，无论你在哪里都可以访问数据，而且不需要在用户的机器上安装程序。然后是另一个另一个方向的延迟，但它与以前不同了，在其他因素中，我们现在的互联网速度比以前快得多，而且我们也习惯了
    Web 应用程序以这种方式工作。最后，在技术上，已经采取了一些措施来确保延迟不再那么严重，确保数据不再像以前这样敏感。可以说，Web 应用程序的目标一直是让它在用户看来，就像安装在用户计算机上的普通程序一样。


    本书的目标是展示如何用 Java 开发 Web 应用程序。然而，这需要对 HTML 有适度的了解，我不想涉及这一点，尽管即使没有这些基础，你可能也能跟上示例的开发，因为我使用的相对较少，而且开发工具（NetBeans）提供了巨大的帮助。


    最后，应该提到的是 Web 应用程序并不是万能的，仍然有一些程序应该开发为经典的 PC 应用程序，主要是因为它们无法忍受延迟。现在，常见的 PC 应用程序也可以通过互联网与服务器通信，从而成为企业级应用程序的一部分，但这需要另一种技术，我将在后续书中介绍它。还应该提到，如今手机等手持计算机起着非常重要的作用，并再次对程序员提出了新要求，这个主题在《Java
    15》一书中有所涉及。


    ## 1.1 开发工具


    为了开发和测试 Web 应用程序，你必须有一个 Web 服务器。有很多选项，但在情况下，我需要一个支持 Java 开发的 Web 应用程序的 Web 服务器。到为止，所有程序都是使用
    NetBeans 编写的，当你下载该产品时，可以从几个包中选择：


    ![](img/589e4f95edc213964881c85e009923c9_10.png)


    到为止，我使用的是第一个，但现在我需要 Java EE，它代表 Java 企业版。Java EE 扩展包含了许多适用于企业应用程序的开发工具，后者支持 Web
    应用程序。区别是 Java EE 是一个常见的 Web 服务器，这对于本书是足够的。那是 GlassFish 服务器，我将使用它（除非你想尝试 Tomcat）。


    当你下载带有 Java EE 的 NetBeans 包时，你会得到一个自解压脚本，通常安装 Java EE 非常简单，书中附方法。


    ## 2. SERVLET


    Java 应用程序的基本概念是 Servlet，它是一个可以以 HTML 格式响应的 Java 类。由于它是一个普通的 Java 类，其方法在服务器上执行，它可以执行任何类可以的操作，例如从数据库中读取数据。因此，Servlet
    可以动态生成取决于情况的 HTML 文档。事实上，在实践中你很少查看这些 Servlet，因为你通常开发的是 JSP 页面或 Facelets（后文介绍），但在两种情况下，页面都会翻译成
    Servlet，所以本节介绍了什么是 Servlet，以及如何使用 NetBeans 编写 Servlet。在打开 NetBeans 后，我选择 File
    | New Project：


    ![](img/589e4f95edc213964881c85e009923c9_11.png)


    ![](img/589e4f95edc213964881c85e009923c9_12.png)


    此时，Categories 必须是 Java Web，而 Projects 应该是 Web Application。点击 Next 后，你会进入熟悉的窗口，需要在输入项目名称并选择创建项目的文件夹。我将项目命名为
    TimeServer。点击 Next 后，你会看到一个选择托管应用程序服务器的窗口：


    ![](img/589e4f95edc213964881c85e009923c9_12_1.png)


    它可能已经适用于 GlassFish 服务器了，所以不需要做任何操作，直接点击 Finish 即可。


    '
