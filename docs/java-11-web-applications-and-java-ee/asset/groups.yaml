- md: "\nJAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\nJSP\n\n# EXERCISE\
    \ 4\n\nStart by creating a copy of the web application ChangeAddress2. You must\
    \ expand the application to add a Delete button to the edit page:\n\n![](img/589e4f95edc213964881c85e009923c9_114_0.png)\n\
    \nThe button should only be there if you edit an existing employee. When you click\
    \ the button, the employee must be deleted from the database. The easiest thing\
    \ is to let the button post to a new servlet, which then deletes the employee.\n\
    \nJAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\nJSF\n\n# 6 JSF\n\
    \nThe whole idea behind JSF is to separate the presentation part from the application's\
    \ business logic so that the individual pages of a web application are written\
    \ as JSP pages, which then perform their data processing by sending requests to\
    \ servlets, and as mentioned, the JSP page itself is translated into a servlet.\
    \ The data to be manipulated is represented by a Java bean, which is a Java class\
    \ whose properties can be immediately linked to the JSP page's fields. With this\
    \ model you are able to develop effective dynamic websites. The technology has\
    \ been refined, and today we talk about JSF, that stands for Java Server Faces,\
    \ and it makes it easier to develop modern web applications and make it easier\
    \ to use new web technologies. It replaces FacesServlet. One can also say that\
    \ a JSP page is not much more than a natural development of a technology driven\
    \ by the many new demands that constantly arise in the development of effective\
    \ web applications.\n\nI will start by showing how a web application with JSF\
    \ can be written using NetBeans. The application is basically the same as I previously\
    \ shown, where the user must enter two numbers, after the program can perform\
    \ a calculation:\n\n![](img/589e4f95edc213964881c85e009923c9_115_0.png)\n\nThe\
    \ calculation is one of the four calculation types, and there are two buttons,\
    \ clear the fields (the two input fields and the result), while the other performs\
    \ the calculation.\n\nThe project is called CalculationPage and is created in\
    \ NetBeans as other web applications, but in the Server Settings window, I click\
    \ Next and then I come to the window for selecting Frameworks. Here you tick the\
    \ JavaServer Faces field (see below). The rest must remain as it is and when you\
    \ click Finish, a JSF web application has been created that consists of a single\
