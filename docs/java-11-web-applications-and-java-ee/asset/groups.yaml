- md: "\nJAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\n```xml\n\
    <jboss-web-app error-url=\"\">\n  <class-loader delegate=\"true\"/>\n  <jsp-config>\n\
    \    <property name=\"keepgenerated\" value=\"true\">\n      <description> ...\
    \ </description>\n    </property>\n  </jsp-config>\n  <parameter-encoding default-charset=\"\
    UTF-8\" />\n</jboss-web-app>\n```\n\nwhere I have added the blue line. The application\
    \ is the finish.\n\n## 6.2 PAGE NAVIGATION\n\nA typical web application consists\
    \ of many pages (or views) and works while the user navigating between different\
    \ pages often by performing an action with either h:commandButton or h:commandLink\
    \ element. In both cases, it means calling a named bean. For large applications,\
    \ it can actually be complicated to control, especially because a page may depend\
    \ on a condition. For these reasons, a special descriptor file has been introduced\
    \ that specifies how navigation can take place. The example ViewNavigation has\
    \ the following index.xhtml:\n\n![](img/589e4f95edc213964881c85e009923c9_139_0.png)\n\
    \nwhere there are three buttons, each of which has the type h:commandButton and\
    \ has an action. If you click on the first button, you get the following window,\
    \ which is another-view (called info.xhtml):\n\n![](img/589e4f95edc213964881c85e009923c9_140_0.png)\n\
    \n> “I studied English for 16 years but...I finally learned to speak it in just\
    \ six lessons\"\nJane, Chinese architect\n\nENGLISH OUT THERE\nClick to hear me\
    \ talking before after my unique course download\n\nDownload free eBooks at bookboom.com\n\
    \n## JAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\nJSF\n\nand\
    \ clicking on the button, you return to *index.xhtml*. If you click on the middle\
    \ button on the start screen, you get the following window:\n\n![](img/589e4f95edc213964881c85e009923c9_141_0.png)\n\
    \ncalled *login.xhtml* and clicking the button you comes to the *data.xhtml* window:\n\
    \n![](img/589e4f95edc213964881c85e009923c9_141_1.png)\n\nClicking this button\
    \ will return to the start page (*index.xhtml*). If you click on the middle button\
    \ again, you will get directly to *data.xhtml* without having to go to *login.xhtml*.\
    \ The last button on start page is used for logout, and if you click it and then\
    \ on the middle button, you has to go to *login.xhtml*.\n\nTo control it, a named\
    \ bean, called *NavigationController*, is used:\n\n```java\npackage viewnavigation.beans;\n\
    \nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n```\n\nDownload free eBooks at bookhoon.com\n\n\
    ## JAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\n```java\n@Named(value\
    \ = \"navigationController\")\n@SessionScoped\npublic class NavigationController\
    \ implements Serializable\n{\n    private boolean isLoggedIn = false;\n\n    public\
    \ NavigationController() {\n    }\n\n    public String toStart() {\n        return\
    \ \"START\";\n    }\n\n    public String toInfo() {\n        return \"INFO\";\n\
    \    }\n\n    public String nextPage() {\n        if (isLoggedIn) return \"data\"\
    ; else return \"login\";\n    }\n\n    public String login() {\n        isLoggedIn\
    \ = true;\n        return \"LOGIN\";\n    }\n\n    public void logout() {\n  \
    \      isLoggedIn = false;\n    }\n}\n```\n\n## JAVA 11: WEB APPLICATIONS AND\n\
    JAVA EE: SOFTWARE DEVELOPMENT JSF\n\nIt defines methods that return a string and\
    \ can be called as an action. The class has a variable to simulate if the user\
    \ is logged in. There are two types of navigation. The first is called explicit\
    \ navigation, where the action method references a string (key) that refers to\
    \ a faces-config.xml configuration file, then indicates which view should be displayed.\
    \ The other is called implicit navigation, where the action method returns the\
    \ name of the current view (but without extension). For example, if you consider\
    \ the toStart() and toInfo() methods, they return a string using faces-config.xml\
    \ and are examples of explicit navigation. As another example, the nextPage()\
    \ is an example of implicit navigation as it simply returns the name of a view\
    \ (which depends on a condition). Also note the two last methods, the first one\
    \ also used as an action method for explicit navigation, but it first modifies\
    \ the login variable to simulate that the user is logged in. The last one is actually\
    \ an action method, but does not return anything, which means that there is no\
    \ forward to another view.\n\nThen there is the configuration file (added to WEB-INF):\n\
    \n```xml\n<?xml version='1.0' encoding='UTF-8'?><faces-config version=\"2.2\"\
    \ ...>\n<navigation-rule>\n<from-view-id>index.xhtml</from-view-id>\n```\n\n![](img/589e4f95edc213964881c85e009923c9_143_0.png)\n\
    \nDownload free eBooks at bookoon.com\n\n```xml\n<navigation-case>\n<from-outcome>INFO</from-outcome>\n\
    <to-view-id>info.xhtml</to-view-id>\n</navigation-case>\n</navigation-rule>\n\
    <navigation-rule>\n<from-view-id>info.xhtml</from-view-id>\n<navigation-case>\n\
    <from-outcome>START</from-outcome>\n<to-view-id>index.xhtml</to-view-id>\n</navigation-case>\n\
    </navigation-rule>\n<navigation-rule>\n<from-view-id>login.xhtml</from-view-id>\n\
    <navigation-case>\n<from-outcome>LOGIN</from-outcome>\n<to-view-id>data.xhtml</to-view-id>\n\
    </navigation-case>\n</navigation-rule>\n</faces-config>\n```\n\nIn this case,\
    \ three navigation rules are defined. The first is interpreted as follows. If\
    \ you come from (the action has taken place) index.xhtml, there is a single navigation\
    \ case that says if the value (key) is INFO, you must navigate to the info.xhtml\
    \ page. You should note that a navigation rule may have (many) navigation-case\
    \ entries.\n\nBy using a faces-config.xml file, you can completely control how\
    \ to navigate between individual views in a web application, but it can mean a\
    \ very large file where you need to write a lot. Therefore, the concept of implicit\
    \ navigation has been introduced, which does not use the configuration file.\n\
    \nBelow is the code of index.xhtml:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\" >\n\
    <html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    >\n<head>\n<title>Facetlet Title</title>\n</head>\n<body>\n<h:form id=\"form\"\
    >\n<h1>Hello World</h1>\n<h2>Demonstrates page navigation</h2>\n<br/>\n<h:commandButton\
    \ style=\"width: 150px\" action=\"#{navigation.toInfo}\"\nvalue=\"Go To Information/&nbsp;\"\
    />\n<h:commandButton style=\"width: 150px\"\naction=\"#{navigation.nextPage}\"\
    \ value=\"Goto data page/&nbsp;\"/>\n<h:commandButton style=\"width: 150px\" action=\"\
    #{navigation.logout}\"\nvalue=\"Logout\"/>\n</h:form>\n</body>\n</html>\n```\n\
    \nThere is not much to explain, but you should note that there have three commands.\
    \ The first one will always forwards to info.xhtml (by explicit navigation). The\
    \ other forwards to either login.xhtml or data.xhtml with the help of implicit\
    \ navigation. Finally, the last one will not make a forward as the method logout()\
    \ does not return a value. Finally, I want to show data.xhtml:\n\n```xml\n<?xml\
    \ version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML\
    \ 1.0 Transitional//EN\" >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:h=\"\
    http://xmlns.jcp.org/jsf/html\">\n<head>\n<title>Facetlet Title</title>\n</head>\n\
    <body>\n<form>\n<h1>The data</h1>\n<ul>\n<li>Gorm den Gamle</li>\n<li>Harald Blåtånd</li>\n\
    <li>Svend Tverskøg</li>\n</ul>\n<br/>\n<h:commandButton action=\"index\" value=\"\
    Go to start\"/>\n</form>\n</body>\n</html>\n```\n\nYou should note that implicit\
    \ navigation is used, but instead of calling a method, the name of the view is\
    \ directly listed as an argument for the action attribute.\n\n## JAVA 11: WEB\
    \ APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT JSF\n\n## PROBLEM 2\n\nIn this\
