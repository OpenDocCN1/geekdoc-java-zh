  mdcn: "\n\n# JAVA 11: Web 应用与\nJAVA EE: 软件开发 JSP\n\n![](img/589e4f95edc213964881c85e009923c9_61_0.png)\n\
    \n在 JSP 页面中以此方式包含代码（使用脚本）有其用处，但通常被认为是糟糕的编程方式。原因是因为 JSP 页面非常难以维护。因此，建议你尽可能地使用 Java\
    \ beans。\n\n现在我将对页面进行最后一次扩展：\n\n```\n<@page import=\"java.util.*\"\n<%@page contentType=\"\
    text/html\" pageEncoding=\"UTF-8%\">\n<!DOCTYPE html>\n<% Calendar dato = null;\n\
    String tekst = null;\n%>\n\nString getTime(Calendar dt)\n{\n    return String.format(\"\
    %02d-%02d-%04d %02d:%02d:%02d\", dt.get(Calendar.DATE),\ndt.get(Calendar.MONTH)\
    \ + 1, dt.get(Calendar.YEAR),\ndt.get(Calendar.HOUR_OF_DAY), dt.get(Calendar.MINUTE),\n\
    dt.get(Calendar.SECOND);\n}\nn\n<% dato = Calendar.getInstance();\ntekst = getTime(dato);\n\
    %>\n\n<html\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n<title>JSP Page</title>\n</head>\n<body\n```\n\n# JAVA 11: Web 应用与\nJAVA EE:\
    \ 软件开发\n\n```jsp\n<jsp:Bean id=\"dateBean\" scope=\"page\" class=\"dateserver.DateBean\"\
    />\n<jsp:setProperty name=\"dateBean\" property=\"*\"/>\n<h1>Hello World!</h1>\n\
    <h2 style=\"color:red\">当前时间: <%=text%></h2>\n<h3>日期是 ${dateBean.date}</h3>\n\
    <h3>时间为: ${dateBean.time}</h3>\n<form method=\"post\">\n<table>\n<tr>\n<td>日期</td>\n\
    <td><input type=\"text\" id=\"date\" name=\"date\" style=\"width:120px\"/></td>\n\
    </tr>\n<tr>\n<td>时间&nbsp;&nbsp;</td>\n<td><input type=\"text\" name=\"time\" style=\"\
    width:120px\"/></td>\n</tr>\n</table>\n<input type=\"submit\" value=\"更新\"/>\n\
    </form>\n</body>\n</html>\n```\n\n![](img/589e4f95edc213964881c85e009923c9_62_0.png)\n\
    \n# JAVA 11: Web 应用与 JAVA EE: 软件开发 JSP\n\n这里添加了一个表单。注意，表单元素没有定义任何 action。这意味着页面通过提交时会向自身发送请求。表单定义了两个输入组件。在这里，重要的是它们必须具有相同的\
    \ name 属性，这些名称应当是 DateBean 中两个属性的名称。此外，请注意此语句：\n\n```\n<jsp:setProperty name=\"\
    dateBean\" property=\"*\"/>\n```\n\n它表示在执行提交时，DateBean 类中所有的 set 方法都必须执行，并用相应输入字段的值进行更新。如果你打开页面，结果可能如下，我在两个输入字段中输入了值：\n\
    \n![](img/589e4f95edc213964881c85e009923c9_63_0.png)\n\n# JAVA 11: Web 应用与 JAVA\
