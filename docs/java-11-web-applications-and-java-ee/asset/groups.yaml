    # JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT


    # INTRODUCTION


    The client is an ordinary workstation with a browser. A browser is a program similar
    to any other PC program, but using the browser, the user can enter a request to
    a web server by entering a web address in the browser''s address bar. A web server
    is a program that runs on some machine. it is a program that is constantly running
    and listening for a request. A request means that the client''s browser wants
    an HTML document to be sent back and the web server will load the document and
    send it back to the client''s browser as a response. Once the client gets the
    document, the browser will rendering and display it on the screen. This means
    that the browser interprets the HTML code and based on the code what the document
    should appear over the screen.


    It is least the basic principle, and as it works in the beginning with World Wide
    Web, but today there is a lot more. A request regarding not only to send an HTML
    document back, but often data is sent along with the request (that could be data
    about items to a shopping cart) and it may also be information to the server to
    find specific data (for example from search criteria to). This means that the
    server has to do a lot of other things, it, for example, to save data in databases,
    retrieve data from a database and dynamically build the response to be sent to
    the client. In other words, the web server must perform software, programs that
    are basically developed and executed like any other program, but only programs
    that run on the machine hosting the web server.


    Web application is thus characterized by, the program''s code being executed on
    the server, which then sends the result back to the client in the form of a dynamically
    generated HTML document. However, a client-side program can also contain code
    that is executed by the browser. There are several options, but the most important
    is JavaScript, which is script code (which is just text) that is sent part of
    the HTML document. Of course, it requires that the browser is able to interpret
    and execute the JavaScript code, but all modern browsers can. Another option is
    to send actual translated code to the browser, for example, a Java applet that
    is written and translated in exactly the same way as for a Swing program. One
    might think of a Java applet as a Java application that runs in the browser window.
    Of course, it requires installing a plugin (extension) for the browser. However,
    since a Java applet is translated into binary code and downloaded and executed
    on the client''s machine, this technology ensures a security risk that many are
    not happy about. Thus, a web application can include both code executed on the
    server side and code executed on the client side, but such that the largest part
    of the code is server code. One are therefore called web applications for client-server
    applications.


    # JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT INTRODUCTION


    As described above, a web application builds on network traffic, every time a
    user makes a request, there is a delay before getting a response. Web applications
    run different from a traditional desktop application. Nevertheless, many of the
    tasks that previously were solved by programs running on the client machine are
    taken over by web applications. There are several reasons for this. The most important
    one is the advantage that you can access data regardless of where you are located,
    and it is not necessary to install the program on the user''s machine. Then there
    is the delay that draws in the other direction, but it is not the same as before,
    and among other things that today we have a much higher rate on the Internet than
    before, but also we have used to use the fact that web applications works that
    way. Finally, technically, a number of measures have been taken to ensure that
    the delay is not so much by ensuring that no more data is sensitive than current.
    One could say that it has always been the goal of getting a web application to
    appear to the user, as it was a usual program installed on the user''s computer.


    The goal of this book is to show how to develop web applications in Java. However
    it requires a modest knowledge of HTML that I do not want to touch on, although
    it should not be in place, you will probably be able to follow the development
    of the examples anyways, as it is relatively small that I use, and also the development
    tools (NetBeans) provides great help.


    Finally, it should be mentioned that web applications are not the solution to
    everything and there are still programs that should be developed as classical
    PC applications, primarily because they cannot not live with the adobe delay.
    Now, a common PC application can also communicate with a server over the Internet
    and thus be part of an enterprise application, but it requires another technology
    that I return to in subsequent books. It should also be mentioned that handheld
    computers such as mobile phones today play a very important role and again set
    new requirements for the programmer, a topic that is dealt with in the book Java
    15.


    ## 1.1 THE DEVELOPMENT TOOL


    In order to develop and test web applications, you must have a web server. There
    are many options, but in this case I need a web server that supports web applications
    developed in Java. So far all programs have been written using NetBeans, and when
    you download the product you can choose from several packages:


    ![](img/589e4f95edc213964881c85e009923c9_10_0.png)


    So far, I''ve used the first one, but now I need Java EE, which stands for Java
    Enterprise Edition. It expands with Java EE, which contains a lot of development
    tools for enterprise applications including web applications and HTML5 that support
    the development of applications. The difference is that the latter is a common
    web server that supports Java web applications and is sufficient for the sake
    of this book, but it is not an application server. That is the GlassFish server,
    and it is necessary for the following books, I will use it everywhere. Both servers
    are included, but you can decide if you want to install both (there is no need
    to install Tomcat unless you want to experiment with it).


    When you download NetBeans bundle with Java EE, you get a self-extracting script,
    and generally it is easy to install Java EE and GlassFish, but the book has an
    appendix that shows how.


    ## 2. SERVLET


    The basic concept of a Java web application is a servlet, which is a Java class
    that has methods that can generate response to the client in the form of HTML.
    Since it is a regular Java class, whose methods are performed on the server, it
    can perform anything a class and it nit can, for example, read data in a database.
    A servlet can therefore dynamically generate a HTML document whose content depend
    on the situation. In fact, it is rare, in practice, you look at these servlets
    as you usually develop dynamic websites like JSP pages or Facelets (explained
    later), but in both cases the pages are translated to servlets, so this section
    about what a servlet is, but also how you write a servlet using NetBeans. After
    I opens NetBeans, I choose File | New Project:


    ![](img/589e4f95edc213964881c85e009923c9_11_0.png)


    ![](img/589e4f95edc213964881c85e009923c9_12_0.png)


    By this time, Categories must be Java Web, while Projects should be Web Application.
    When you click Next, you get the usual window where need to enter a project name
    and select the folder where the project is to be created. I have called the project
    TimeServer. When you click Next, you get a window to select the server where the
    application is to be hosted:


    ![](img/589e4f95edc213964881c85e009923c9_12_1.png)


    It is probably already available for the GlassFish server, so there is no need
    to do anything and just click Finish. After, that a project for a web application
    has been created with folders for the different types of files that the project
    may consist of, but for the time there is only one single file named index.html,
    which is a common HTML document, and it can be perceived as the application''s
    home page.

