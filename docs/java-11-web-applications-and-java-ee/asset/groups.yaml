    \n# FOREWORD\n\n# FOREWORD\n\nThis book is the eleventh in a series of books on\
    \ software development. The programming language is Java, and the language and\
    \ semantics fills obviously much, but the books have also largely focused on the\
    \ process and how to develop good and robust applications. This book deals with\
    \ the development of web applications where the focus is on the server side and\
    \ how to develop dynamic web pages. The book starts with an introduction to servlets,\
    \ followed by a brief presentation of Java Server Pages. The rest of the book\
    \ deals with writing web applications using Java Server Faces, and after reading\
    \ the book, you should be able to write classic web applications. However, the\
    \ book contains little about the client side, which is dealt with in the next\
    \ book. The book is not a reference to JSF elements, and the aim is, through examples,\
    \ to show what you are doing and it is necessary that you examine the online documentation\
    \ to get an overview of the many JSF elements that exist.\n\nThe title says this\
    \ series of books deals with software development, and the goal is to teach the\
    \ reader how to develop applications in Java. It can be learned by reading about\
    \ the subject and by studying complete programs, but most importantly by yourself\
    \ to do it and write your own programs from scratch. Therefore, an important part\
    \ of the books is exercises and problems, and where the reader has to write programs\
    \ that correspond to the substance being treated in the books. All books in the\
    \ series is built around the same skeleton and will consist of test examples and\
    \ exercises and problems that are placed in the text where they naturally belong.\
    \ The difference between exercises and problems is that the exercises largely\
    \ deals with repetitions of the substance that is presented in the text, and furthermore\
    \ it is accurately described what to do. Problems are in more loosely described,\
    \ and are typically a little bigger and there is rarely any clear solution. These\
    \ books are to be read from start to finish, but the many code examples, including\
    \ exercises and problems plays a central role, and it is important that the reader\
    \ predict in detailing the code to the many examples and also solves the exercises\
    \ and problems or possibly just studying the recommended solutions.\n\nAll books\
    \ end with one or two larger sample programs, which focus primarily is on process\
    \ and an explanation of how the program is written. On the other hand appears\
    \ the code only to a limited extent – if at all – and the reader should instead\
    \ study the finished program code perhaps while testing the program. In addition\
    \ to show the development of programs that are larger than the examples, which\
    \ otherwise is presented, the aim of the concluding examples is also to show program\
    \ examples from varying fields of application.\n\n# JAVA 11: WEB APPLICATIONS\
    \ AND JAVA EE: SOFTWARE DEVELOPMENT\n\n# JAVA 11: WEB APPLICATIONS AND JAVA EE:\
    \ SOFTWARE DEVELOPMENT\n\nEverything in the previous books that have been said\
    \ about system development, and programming and Java have been aimed at applications\
    \ running on a single computer. In the following books, I will treat the development\
    \ of applications that run on multiple machines and exchange data over a network,\
    \ which is often the Internet, and in fact, such programs are the most common\
    \ in practice – at least if you look at programs used in companies or public institutions.\
    \ Besides running the programs on a network, they are characterized by having\
    \ many concurrent users and typically included in an IT solution that includes\
    \ several programs that work together to solve the desired tasks. Development\
    \ of such programs requires new technical solutions and, on the other hand, they\
    \ make demands for the system development process itself, but fortunately everything\
    \ so far is valid, but it is necessary to expand with new concepts.\n\nIn the\
    \ literature, such programs are generally referred to as enterprise applications,\
    \ and without it being precisely defined what it is, it covers programs for large\
    \ companies and organizations, but perhaps you should think about it in that way\
    \ that a program is not just program but a solution to a work situation or task\
    \ in a larger company. I will start by looking at the development of web applications,\
    \ which are applications that run through the Internet, and although it's not\
    \ the only kind of enterprise applications, and even maybe it not even sharp among\
    \ what are web applications and what are not, then at least there is a talk of\
    \ some technology and applications that are developed and run in a way other than\
    \ traditional office programs.\n\nWeb applications have been around for many years\
    \ and, as a result of a long development, more and widely distributed from simple\
