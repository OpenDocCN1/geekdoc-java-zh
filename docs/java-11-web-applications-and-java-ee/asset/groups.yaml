    - 附录 B：HTTP 206\n\nJAVA 11：WEB 应用 JAVA EE：软件开发\n\n# 前言\n\n# 前言\n\n本书是软件开发系列书籍中的第十一本。编程语言是\
    \ Java，虽然语言和语义显然涵盖了大量内容，但这些书籍在很大程度上也关注过程以及如何开发良好且健壮的应用程序。本书涉及 Web 应用的开发，重点是服务端以及如何开发动态网页。书从介绍\
    \ Servlet 开始，随后简要介绍了 Java Server Pages (JSP)。其余部分讨论了如何使用 Java Server Faces (JSF)\
    \ 编写 Web 应用，读完本书后，你应该能够编写经典的 Web 应用。然而，书中关于客户端的介绍较少，该部分将在下一本书中处理。本书并非 JSF 元素的参考书，其目的是通过示例展示你正在做什么，你有必要查阅在线文档以获得大量存在的\
    \ JSF 元素的概述。\n\n书名显示该系列书籍涉及软件开发，目标是教导读者如何使用 Java 开发应用程序。可以通过阅读相关主题和学习完整的程序来掌握，但最重要的是通过亲手实践并从零开始编写自己的程序。因此，书籍中的一个重要部分是练习和问题，读者在这些编写与书中处理的内容对应的程序。该系列中的所有书籍都围绕同一个骨架构建，由测试示例、练习和问题组成，这些内容被放置在文中自然的位置。练习和问题的区别在于，练习很大程度上是对文中阐述内容的重复，并且准确地描述了要做什么。问题的描述较为松散，通常规模更大，且很少有明确的解决方案。这些书籍应该从头到尾阅读，但大量的代码示例（包括练习和问题）起着核心作用，读者详细地预测许多示例中的代码，并解决练习和问题，或者可能只是学习推荐的解答。\n\
