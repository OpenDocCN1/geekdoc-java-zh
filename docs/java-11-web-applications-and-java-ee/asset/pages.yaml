  md: "# JAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\nNote that\
    \ line 2 refers to an error page. In principle, you should never come to this\
    \ page because the server validates data, but you will be sent to the error page\
    \ in case of one or more serious errors, and that is, when an exception occurs.\
    \ Also note how the LoginBean is applied and how its properties are linked to\
    \ the input fields as well as a div element at the end of the document. It is\
    \ used to show a possible error message. Please note that the scope of the particular\
    \ bean is a session. That is, the value of the assigned objects is preserved throughout\
    \ the session. Finally, you should note that the page only reads the bean object,\
    \ but does not update it. Otherwise, you may notice that the page uses the style\
    \ sheet, and that one input field has the type password.\n\nHowever, the most\
    \ important thing is the form element, where its action indicates that the form\
    \ should be sent to PersonServlet, and finally the form element states that before\
    \ submitting, the JavaScript function encryptPassword() must be performed. The\
    \ user's password must be stored encrypted in the database, and I have previously\
    \ shown (in the book Java 7) how to do it. Java has classes for it, which determines\
    \ a message digest of the password and stores it in the database. However, it\
    \ causes a problem as it only happens on the server side, and the password must\
    \ therefore be sent to the server in clear, allowing others to intercept it. The\
    \ encryption must therefore be done on the client side, and here I only have JavaScript\
    \ available. A message digest is determined by means of a complex algorithm, and\
    \ there are several that can be used and which differ in their strength and thus\
    \ how difficult they are to break. The algorithm is well described on the Internet,\
    \ and you can easily find an example where it is implemented in JavaScript. The\
    \ file scripts.js implements an algorithm (SHA-1 algorithm). I do not want to\
    \ review the algorithm here or show the code but briefly the idea is to modify\
    \ the text in a way that it can not be recognized and that you will not regret\
    \ and not for that message digest determine the password. However, there is a\
    \ problem as it happens on the client side, so everyone can see what's happening\
    \ and therefore that it is discussed whether it's safe to encrypt a password using\
    \ script code, because such a code is irreproachable, but in relation to this\
    \ example, it must be sufficient. Though encryption be safe, one will usually\
    \ require another approach (another implementation) than what this example shows.\n\
