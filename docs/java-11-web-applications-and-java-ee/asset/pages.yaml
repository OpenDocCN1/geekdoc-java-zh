    In general, validation is performed before the action method is performed. It
    is important to beware that validation takes place on the server side and that
    a request is made to the server. If all fields can not be validated, the action
    method is not executed, but there is a return to index.xml and an error messages
    are displayed. You should note that in this case, the input has two attributes:


    ```

    immediate="true" onchange="submit()"

    ```


    They mean that the content of the field must be validated immediately after the
    field loses focus, and not when submitting the form. This option is not used as
    often as a request to the server still occurs and because you can do it better
    with ajax (the next book). Lastly note the input field for title and it has no
    validator.


    As mentioned, the components in this example are placed using a panelGrid, which
    is a JSF element that is translated into an HTML table. There is also a panelGroup
    element used to collect multiple items as a single cell in the table. Here is
