    A particular issue is security and to ensure that unauthorized persons can change
    the content of the database. In this case, security must be given a low priority.
    Partly because the content of the page does not require special protection and
    one cannot expect anyone to use to attack the page, and partly because (primarily)
    I have not yet addressed how security issues are addressed. To access the administration
    section, a member (car owner) must enter his membership number and password. It
    must be the responsibility of the member to create an appropriate password and
    it is stored encrypted in the database. In addition to claiming the strength of
    the password and that it is the member''s responsibility to create a password,
    the biggest weakness is that the password is sent in clear text (unencrypted)
    from client to server, and can then be captured by an attacker.


