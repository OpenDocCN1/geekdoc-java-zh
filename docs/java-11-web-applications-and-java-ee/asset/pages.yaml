    It should illustrate a simple login page. In this case, the user must enter his
    employee number and password and when the button is clicked, this information
    will be sent to the server. If the user only enter a password (there is no employee
    number), it is perceived as creating a new employee, and otherwise it means that
    you can edit the employee information. For practical use, it may not be appropriate,
    but I do not want to make the application more extensive than necessary. The page
    is of course basically a and, and in principle, it is a very simple page, which
    simply consists of sending a form to the server, but there is nevertheless one
    having to be resolved.


    When the form is sent to the server, the server must validate if the entered data
    is legal. In this case, the employee number must be a 4-digit integer (automatically
    assigned by the database server) and there must be a password. If the employee
    number is blank, the server must create a new employee and assign it an auto generated
    number. If an employee number has been entered, the server must validate the number
    and, if it is legal, the server must check if the database has an employee with
    that number and password and, if necessary, load the employee''s data. If the
    form''s data is illegal, the program must return to the login with an error message
    and the form fields must retain content so that the user can edit the content.
    If data can be accepted, the server instead has to go to the editing page so that
    the user can edit the data in question.


    All that requires some Java code, and I want to start with a simple bean that
    can represent data to the login page:


