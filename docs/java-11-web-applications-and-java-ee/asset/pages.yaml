    It is this page that shows the form. A *form* is defined in HTML with a *form*
    element. In this case, the *form''s* fields are placed in a table, and it is alone
    to have the fields placed neatly underneath each two columns. The table has 7
    rows, and the first 6 rows have a label and an *input* element. A label shows
    a text, whereas an *input* element that in this case has the type of text is input
    field. Each field has a name and an identifier defined by an *id* and *name* attribute,
    respectively. In this case, only the last one is necessary, but it is slightly
    different when an element is identified by an *id* or a *name*, attribute that
    is used. You should, refer to an element from a style sheet, it is the *id* attribute
    that is used. Therefore, it would be a good idea to locate both. The last in the
    table has two input components, but both components are rendered by the browser
    as a button, and the *value* attribute specifies that the button shows. The first
    component clear the form''s input fields while the other (*submit*) component
    submits to the server.


    If you consider the *form* element, it has two attributes, *action* indicates
    which page on the server the request should be. In this case, it *AddressServlet*
    is a servlet. The other method indicates what kind of request it is and here is
    *POST*. The elements of the form are sent together with the request as *key/value
    pair*, where the key is the value of the *name* attribute which is value of the
    *value* attribute, which for an input field is the entered text.


    As mentioned, *AddressServlet* refers to a servlet. It is created in the same
    way as in the previous example, and I have called it on the *Configure Servlet
    Deployment* screen, I have not changed the values for *Servlet Name* and *URL
    Pattern (s)* this time, and I have created a package for the servlet. The completed
    code is shown below, where I have deleted all comments as well as the last method
    *getServletInfo()*.


    ```

