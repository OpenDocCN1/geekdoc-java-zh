    # INTRODUCTION


    The client is an ordinary workstation with a browser. A browser is a program similar
    to any other PC program, but using the browser, the user can enter a request to
    a web server by entering a web address in the browser''s address bar. A web server
    is a program that runs on some machine. it is a program that is constantly running
    and listening for a request. A request means that the client''s browser wants
    an HTML document to be sent back and the web server will load the document and
    send it back to the client''s browser as a response. Once the client gets the
    document, the browser will rendering and display it on the screen. This means
    that the browser interprets the HTML code and based on the code什么样的 the document
    should appear over the screen.


    It is least the basic principle, and as it works in the beginning with World Wide
    Web, but today there is a lot more. A request regarding not only to send an HTML
    document back, but often data is sent along with the request (that could be data
    about items to a shopping cart) and it may also be information to the server to
    find specific data (for example from search criteria to). This means that the
    server has to do a lot of other things, it, for example, to save data in databases,
    retrieve data from a database and dynamically build the response to be sent to
    the client. In other words, the web server must perform software, programs that
    are basically developed and executed like any other program, but only programs
    that run on the machine hosting the web server.


    Web application is thus characterized by, the program''s code being executed on
    the server, which then sends the result back to the client in the form of a dynamically
    generated HTML document. However, a client-side program can also contain code
    that is executed by the browser. There are several options, but the most important
    is JavaScript, which is script code (which is just text) that is sent part of
    the HTML document. Of course, it requires that the browser is able to interpret
    and execute the JavaScript code, but all modern browsers can. Another option is
    to send actual translated code to the browser, for example, a Java applet that
    is written and translated in exactly the same way as for a Swing program. One
    might think of a Java applet as a Java application that runs in the browser window.
    Of course, it requires installing a plugin (extension) for the browser. However,
    since a Java applet is translated into binary code and downloaded and executed
    on the client''s machine, this technology ensures a security risk that many are
    not happy about. Thus, a web application can include both code executed on the
    server side and code executed on the client side, but such that the largest part
    of the code is server code. One are therefore called web applications for client-server
    applications.'
