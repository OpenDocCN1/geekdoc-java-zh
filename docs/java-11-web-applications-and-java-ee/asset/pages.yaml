  md: '# JAVA 11: WEB APPLICATIONS AND

    JAVA EE: SOFTWARE DEVELOPMENT INTRODUCTION


    As described above, a web application builds on network traffic, every time a
    user makes a request, there is a delay before getting a response. Web applications
    run different from a traditional desktop application. Nevertheless, many of the
    tasks that previously were solved by programs running on the client machine are
    taken over by web applications. There are several reasons for this. The most important
    one is the advantage that you can access data regardless of where you are located,
    and it is not necessary to install the program on the user''s machine. Then there
    is the delay that draws in the other direction, but it is not the same as before,
    and among other things that today we have a much higher rate on the Internet than
    before, but also we have used to use the fact that web applications works that
    way. Finally, technically, a number of measures have been taken to ensure that
    the delay is not so much by ensuring that no more data is sensitive than current.
    One could say that it has always been the goal of getting a web application to
    appear to the user, as it was a usual program installed on the user''s computer.


    The goal of this book is to show how to develop web applications in Java. However
    it requires a modest knowledge of HTML that I do not want to touch on, although
    it should not be in place, you will probably be able to follow the development
    of the examples anyways, as it is relatively small that I use, and also the development
    tools (NetBeans) provides great help.


    Finally, it should be mentioned that web applications are not the solution to
    everything and there are still programs that should be developed as classical
    PC applications, primarily because they cannot not live with the adobe delay.
    Now, a common PC application can also communicate with a server over the Internet
    and thus be part of an enterprise application, but it requires another technology
    that I return to in subsequent books. It should also be mentioned that handheld
    computers such as mobile phones today play a very important role and again set
    new requirements for the programmer, a topic that is dealt with in the book Java
    15.


    # 1.1 THE DEVELOPMENT TOOL


