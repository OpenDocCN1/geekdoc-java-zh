    It defines methods that return a string and can be called as an action. The class
    has a

    variable to simulate if the user is logged in. There are two types of navigation.
    The first is

    called explicit navigation, where the action method references a string (key)
    that refers to

    a faces-config.xml configuration file, then indicates which view should be displayed.

    The other is called implicit navigation, where the action method returns the name
    of

    the current view (but without extension). For example, if you consider the toStart()
    and

    toInfo() methods, they return a string using faces-config.xml and are examples
    of explicit

    navigation. As another example, the nextPage() is an example of implicit navigation

    as it simply returns the name of a view (which depends on a condition). Also note
    the two

    last methods, the first one also used as an action method for explicit navigation,
    but

    it first modifies the login variable to simulate that the user is logged in. The
    last one

    is actually an action method, but does not return anything, which means that there
    is no

    forward to another view.


    Then there is the configuration file (added to WEB-INF):


    ```

    <?xml version=''1.0'' encoding=''UTF-8''?>n<faces-config version="2.2" ...>

    <navigation-rule>

    <from-view-id>index.xhtml</from-view-id>

    ```


    ![](img/589e4f95edc213964881c85e009923c9_143_0.png)


