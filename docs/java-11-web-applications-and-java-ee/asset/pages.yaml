    # 5.3 JSP DOCUMENTS


    When you create a jsp page in NetBeans you get the window as shown below, where
    for Options as default is selected JSP File (Standard Syntax), and in most cases
    you will probably stick to it, but you can also select JSP Document (XML Syntax).
    The result is a JSP page, which has the extension jspx, which resembles a standard
    JSP page, but it is a requirement that the page is welformed XML. The above examples
    are already wellformed, there will be no big difference besides a requirement.
    Most importantly, however, a JSP document does not allow the use of scriptlets,
    then forcing the programmer to place all Java code in Java beans and other classes,
    and that is the exact goal of this variation of JSP pages.'
