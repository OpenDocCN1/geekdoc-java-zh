    JSF


    # 6 JSF


    The whole idea behind JSF is to separate the presentation part from the application''s
    business logic so that the individual pages of a web application are written as
    JSP pages, which then perform their data processing by sending requests to servlets,
    and as mentioned, the JSP page itself is translated into a servlet. The data to
    be manipulated is represented by a Java bean, which is a Java class whose properties
    can be immediately linked to the JSP page''s fields. With this model you are able
    to develop effective dynamic websites. The technology has been refined, and today
    we talk about JSF, that stands for Java Server Faces, and it makes it easier to
    develop modern web applications and make it easier to use new web technologies.
    It replaces FacesServlet. One can also say that a JSP page is not much more than
    a natural development of a technology driven by the many new demands that constantly
    arise in the development of effective web applications.


    I will start by showing how a web application with JSF can be written using NetBeans.
    The application is basically the same as I previously shown, where the user must
    enter two numbers, after the program can perform a calculation:


