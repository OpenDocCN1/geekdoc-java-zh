  md: '# JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT


    # APPENDIX B: HTTP


    HTTP stands for Hyper Transfer Protocol and is a protocol belonging to the application
    layer, and typically implemented over TCP / IP. It is a stateless protocol that,
    as mentioned, is based on request and response, when a client application sends
    a request to a server and where the server responds to the client with a response.
    The protocol is stateless means that after the server has sent the response, it
    has forgotten everything about the client. The server stores no information about
    its clients, and whenever a client requests the server, it is perceived by the
    server as a new request. The HTTP protocol is thus stateless, presents many challenges
    in connection with web applications, and there are several techniques to cope
    with these challenges, which I have already mentioned both cookies and session
    objects. The current version of http is called version 1.1.


    A URL is a reference to a particular resource (file) on the Internet and generally
    has the following format:


    ```

    http://Servernavn/Filenames

    ```


    An example of an URL could be


    ```

    http://www.eadania.dk/education/it/index.html

    ```


