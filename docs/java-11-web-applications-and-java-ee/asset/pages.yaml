    There are, of course, many syntactical details related to style sheets, but when
    you read

    tindividual styles, they are easy enough to understand, and NetBeans style keeps

    also provides assistance to the individual styles. In practice, a style sheet
    can be very

    prehensive and the whole idea is to move the definition of how the individual
    HTML

    elements should be displayed from the HTML and JSP documents. This means, on the
    one

    hand, that these documents become simpler and easier to understand, and partly
    that it is

    eier to maintain how websites appear, you only have to modify the style sheet.
    The idea

    t is that the HTML and JSP documents should only define the content, while style
    sheets

    defines how the content is rendered in the browser. A style sheet is thus a text
    document\sent with the page, as the browser uses to render the document. A style
    sheet is not used

    on the server side.


    In this case, 9 styles are defined. The first three are very simple and defines
    the for

    body element (and thus the entire document) as default should apply, and how wide
    a

    paragraph should be (such a text line does not necessarily fill the screen), and
    a li

    ment must have an upper margin of 10. The next two define a so-called class that
    can be

    associated with specific elements. For example header-class that is used in the
    above header:


    ```

    <div class="header-class">

    ```


    The last three styles are more complex and define styles that can be used in a
    HTML table,

    Will return to them. These styles are used by all documents that use that style
    sheet.

