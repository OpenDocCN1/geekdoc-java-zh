    JSP


    +   1. session which means the bean object can be used from all JSP pages regarding
    the same session - however, the page that creates the object must have a page
    directive with session = "true"

    2. application indicating that the bean object can be used from all JSP pages
    in the application


    When a request is received for a JSP page, the page is automatically translated
    into a servlet if it is not already. Here the web server will automatically check
    if the JSP page is newer than any servlet, and the page will be translated again.
    This means that a JSP page will only be translated into a servlet if needed.


    You also insert Java code into a JSP page using so-called scriptlets. I have expanded
    the example in the following way:


    ```

    <@page import="java.util.*">

    <@page contentType="text/html" pageEncoding="UTF-8">

    <!DOCTYPE html>

