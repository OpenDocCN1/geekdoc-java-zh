  md: "# JAVA 11: WEB APPLICATIONS AND JAVA EE: SOFTWARE DEVELOPMENT PARAMETERS AND\
    \ SESSIONS AND MORE\n\nWhen a user opens the browser and sends a request to a\
    \ new page, the server will investigate whether a session ID is included. It does\
    \ not matter if it is for a new page entered in the browser's address bar, and\
    \ the server will generate a session ID and send it with the response back to\
    \ the client. If the client performs a submit or, for example, on a link that\
    \ refers to a page in the same web application, the browser will send the session\
    \ ID, and the server will include it in its response. The term called session\
    \ has been introduced that exists as long as the server refers to pages within\
    \ the same web application.\n\nThis can be used to define data that live throughout\
    \ the session. When the server creates a session ID, it also creates a session\
    \ object and this object contains a collection of Object objects. The server can\
    \ create and save objects in this collection, and these objects live as long as\
    \ the session lives, and therefore they can be used by all pages within that session.\
    \ It is important to note that the objects are only known on the server side and\
    \ are not sent to the client. Only one session is sent to the session ID, which\
    \ is sent back and forth for each request/response pair.\n\nThe individual session\
    \ lives on the server until they are explicitly removed or until they are removed\
    \ by a timeout (for example, it may be 30 minutes). This means, on the other hand,\
    \ the server can have many session objects that are no longer used, thus using\
    \ space, and partly that session objects (such as a shopping cart) may disappear\
    \ if you stop working.\n\nTo illustrate the use of sessions, I have created a\
    \ web application called Sessions. For this application I will add three servlets.\
    \ When adding a servlet to a web application, it should not be placed in the project's\
    \ default package (what has been done above in the first example). 'Typically,\
    \ I created a package named projectname.servlets (in this case, sessions.servlets)\
    \ and I have also created a package sessions.data, and I have added the following\
    \ class that can represent a person with a name and a job title:\n\n```\npackage\
    \ sessions.data;\n\npublic class Person {\n    private String name;\n    private\
    \ String title;\n\n    public Person(String name, String title) {\n        this.name\
    \ = name;\n        this.title = title;\n    }\n}\n```"
