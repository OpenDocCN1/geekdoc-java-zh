    ```

    <title>JSP Page</title>

    </head>

    <body>

    <jsp:useBean id="dateBean" scope="page" class="dateserver.dateBean"/>

    <h1>Hello World!</h1>

    <h3>The date is: ${dateBean.date}</h3>

    <h3>The time is: ${dateBean.time}</h3>

    </body>

    </html>

    ```


    The code is expanded with a jsp:useBean element, and as you see it, it defines
    a reference to the class dateserver.dateBean and calls this reference for dateBean.
    Finally, it defines a scope that tells you DateBean object can be used. In addition,
    two lines are defined that insert the relevant values in the page. For example,
    inserts


    ${dateBean.date}


    the property in the HTML code. You should note the reference and you write date
    which is the property name, which means that it is the method getDate() that is
    being executed and if you open the JSP page in the browser, the result is


    ![](img/589e4f95edc213964881c85e009923c9_58_0.png)


    and you can see that the bean class is instantiated and the object''s values (the
    current date and time are inserted in the document). In particular, if you click
    on F5 (refresh of the browser), the browser will update the clock and the object
    will be reinstated. You can use other public methods in a Java bean in the same
    way, but in this case there are no other. With regard of the value of attribute
    scope there are four options:


    +   1. page which is default and indicates that the bean object can be used solely
    from the current page

    2. request indicating that the bean object can be used from all JSP pages that
    concerns the same request'
