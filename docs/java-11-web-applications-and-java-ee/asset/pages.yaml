  md: "# JAVA 11: WEB APPLICATIONS AND\nJAVA EE: SOFTWARE DEVELOPMENT\n\n```\n<c:when\
    \ test=\"${f:isPrime(prim.prime)}\">\n  is a prime\n</c:when>\n<c:otherwise>\n\
    \  is not a prime\n</c:otherwise>\n</c:choose>\n<p>\n<body>\n</html>\n```\n\n\
    First, note definition of two TLDs:\n\n```\n<@taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %>\n<%@tag uri=\"WEB-INF/tlds/functions.tld\" prefix=\"f\" %>\n```\n\nA tag\
    \ library descriptor expands JSP with new elements in the form of Java features,\
    \ which can subsequently be used on the page. Here is the first of extensions\
    \ that make it possible to introduce conditions and loops on the JSP page, while\
    \ the latter is the descriptor defined above and is part of the project. The two\
    \ TLDs are referenced on the page using a prefix, which is c and f respectively.\n\
    \nIf you choose the body part, you can see that a bean is defined and its properties\
    \ must be updated. Next, there is a form with an input field and a submit button,\
    \ and compared to the previous example there is nothing here new. Next, a condition\
    \ follows:\n\n```\n<c:choose>\n<c:when test=\"${f:isPrime(prim.prime)}\">\n  is\
    \ a prime\n</c:when>\n<c:otherwise>\n  is not a prime\n</c:otherwise>\n</c:choose>\n\
    ```\n\nchoose is a construct that is defined in the tag library, which is defined\
    \ by the prefix c, and it corresponds to a switch statement. When each element\
    \ is controlled by a condition, and in this case, it is the value returned from\
    \ the bean object is a prime number. The method isPrime() is defined in the library\
    \ that has the prefix f and you should note not how to write the condition. You\
    \ should also note how to state the argument for isPrime(). If the condition is\
    \ met, the forming HTML (here just text) is inserted into the document. Or, the\
    \ subsequent otherwise functions as an if/else, but there may be all the when\
    \ elements that may be needed."
