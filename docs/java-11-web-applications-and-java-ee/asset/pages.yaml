    # 3.2 SESSIONS


    When you request a web page from the browser and the server answers back with
    a response, it will be done as already mentioned in accordance with the HTTP protocol.
    This protocol is basically stateless, which means that after the server has replied
    with the response, the server has “forgotten” all about the request, and next
    time a request for the same page is received, the server will perceive it as a
    new request. This model fits badly with modern web applications, and you can,
    among other things, solve the problem using the session concept.


    ![](img/589e4f95edc213964881c85e009923c9_38_1.png)


