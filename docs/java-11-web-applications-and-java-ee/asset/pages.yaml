    FOREWORD


    # FOREWORD


    This book is the eleventh in a series of books on software development. The programming
    language is Java, and the language and semantics fills obviously much, but the
    books have also largely focused on the process and how to develop good and robust
    applications. This book deals with the development of web applications where the
    focus is on the server side and how to develop dynamic web pages. The book starts
    with an introduction to servlets, followed by a brief presentation of Java Server
    Pages. The rest of the book deals with writing web applications using Java Server
    Faces, and after reading the book, you should be able to write classic web applications.
    However, the book contains little about the client side, which is dealt with in
    the next book. The book is not a reference to JSF elements, and the aim is, through
    examples, to show what you are doing and it is necessary that you examine the
    online documentation to get an overview of the many JSF elements that exist.


    The title says this series of books deals with software development, and the goal
    is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, and where the reader has to write
    programs that correspond to the substance being treated in the books. All books
    in the series is built around the same skeleton and will consist of test examples
    and exercises and problems that are placed in the text where they naturally belong.
    The difference between exercises and problems is that the exercises largely deals
    with repetitions of the substance that is presented in the text, and furthermore
    it is accurately described what to do. Problems are in more loosely described,
    and are typically a little bigger and there is rarely any clear solution. These
    books are to be read from start to finish, but the many code examples, including
    exercises and problems plays a central role, and it is important that the reader
    predict in detailing the code to the many examples and also solves the exercises
    and problems or possibly just studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily is
    on process and an explanation of how the program is written. On the other hand
    appears the code only to a limited extent – if at all – and the reader should
    instead study the finished program code perhaps while testing the program. In
    addition to show the development of programs that are larger than the examples,
    which otherwise is presented, the aim of the concluding examples is also to show
    program examples from varying fields of application.'
