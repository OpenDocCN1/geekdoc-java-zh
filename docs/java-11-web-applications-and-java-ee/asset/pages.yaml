    This sub directory is not necessary, but it is recommended to create such a directory
    as a larger application may have many Tag Descriptors. The descriptor itself is
    called functions.tld in an XML document:


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <taglib version="2.1" xmlns="http://java.sun.com/ns/javaee"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    sxsi:schemaLocation="http://java.sun.com/ns/javaee

    http://java.sun.com/ns/javaee/web-jspptaglibrary_2_1.xsd">

    <taglib-version>1.0</taglib-version>

    <short-name>f</short-name>

    <url>WEB-INF/tlds/functions.tld</url>

    <function>

    <name>isPrime</name>

    <function-class>beanfunction.beans.PrimeBean</function-class>

    <function-signature>boolean isPrime(long)</function-signature>

    </function>

    </taglib>

    ```


    In this case the functions.tld has a so-called short-name called f. It is used
    to refer to a method. A single function has been defined, and the definition includes
    the function''s name, the function''s class and its signature. The document must
    contain a description for each static method that must be available for the JSP
    pages. Below is the code for the JSP page:


    ```

    <@page contentType="text/html" pageEncoding="UTF-8">

    <!DOCTYPE html %>

    <taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    <taglib uri="WEB-INF/tlds/functions.tld" prefix="f" %>

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>JSP Page</title>

    </head>

    <body>

    <jsp:use id="prim" scope="request" class="beanfunction.beans.PrimeBean"/>

    <jsp:setProperty name="prim" property="prime"/>

    <h1 number="{prim}\</h1>

    <form name="form1" method="post">

    <p>Enter a prime: <input type="text" name="prime" value="${prim.prime}\/></p>

    <br/>

    <input type="submit" value="OK"/>

    </form>

    <p>

    c:choose</p>

    ```


