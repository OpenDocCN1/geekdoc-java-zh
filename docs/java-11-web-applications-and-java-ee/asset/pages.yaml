  md: '# APPENDIX B: HTTP


    Before I go on, I will add a few remarks about the HTTP protocol. A web application,
    as already described, consists of a number of files (web pages) located on a web
    server. These files (web pages, images, etc.) are used by clients who download
    the files and display them in a browser. That client is a regular PC with a browser
    while a server is a computer (server) that runs a program (a service) called a
    web server. The web server constantly listens on a port (for example 8080) for
    requests from clients, and in case of a request (a request on a particular page),
    the web server sends a response as an HTML document to the address to which the
    client''s request relates. Specifically, the client enters the address of a web
    page in his browser, for example.


    www.torus.dk and the browser will then convert the name to an IP address using
    the DNS system, which the browser opens a socket to the server via a port (the
    default is 80). Then the web server can reply back with a response in the form
    of HTML, which the browser can then interpret and display as a web page.


    From the server, more things can happen. In simplest cases a client request regarding
    a static HTML page, and if so, the server should do nothing but load the page
    from the machine''s disk and send it to the client''s browser. Today, however,
    it will often be a dynamic web page – for example a servlet and client request
    requesting then in reality a program. The web server loads that application and
    executes it. Often it will involve database operations either because the application
    requires data from a database or also because the client has sent data with the
    request, which must be stored in a database. In any case, the program that the
    web server executes generates HTML (whose content may be dynamically based on
    the content of a database) and sends this HTML to the client.


    In order for this client/server architecture to work, agreements or rules that
    exactly determine the format of the client requests and server responses are required,
    and this is where HTTP enters the picture as the name of protocol (a protocol
    is a set of rules), which indicates how the communication between client and server
    should be.'
