    mission in a debate in the Security Council, Dag was talking with the British


    Ambassador Sir Pierson Dixon in the corridor behind the podium. Sir Pierson


    suggested that the Secretary-General should make a statement in support of the


    British position. Dag refused. The ambassador insisted that, “After all, there
    is


    something called political sense.” I stood there together with Dixon’s assistant,


    Douglas Hurd (later to become Mrs. Thatcher’s foreign secretary), when Dag,


    stressing each syllable, declared, “And there is something called integrity,”
    turned


    around and closed the door behind him.^(17)


    As this personal memory illustrates, there is all too often a thin line between


    fact and fiction, which not only this book finds difficult to walk. Is this nice


    incident recalled by the narrator a true story? Who could verify it, in the


    absence of any other proof than the witness report? Many of those who have


    so far engaged with related subjects had either preconceived ideas or a selec-


    tive approach (and often both, the latter a result of the earlier). Goethe once


    said that you only know what you see. But the opposite, that you only see what


    you know, is equally true.


