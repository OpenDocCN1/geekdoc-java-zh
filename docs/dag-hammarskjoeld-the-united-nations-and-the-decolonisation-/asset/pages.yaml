    *Katanga and the Plane Crash*


    Dag Hammarskjöld, together with all but one of his companions, died in the


    wreckage of the *Albertina* on the night of 17/18 September 1961\. Most pas-


    sengers were burnt beyond recognition in the blaze of the debris, though


    Hammarskjöld’s body was found almost undamaged, reportedly leaning


    against an anthill.⁹ As photos taken of the body revealed, an ace of spades was


    stuck in his shirt collar.^(10) The bodyguard Harold Julien was the only survivor.


    He died six days later in a local hospital. Evidence suggests that he could have


    been saved if treated properly.


    Suspicions were immediately aroused that there might have been foul play.


    Not only did investigative journalists already point in this direction.^(11) Even


    former US President Harry S.


    Truman was quoted in the *New York Times* of


    20


    September 1961^(12) as stating: “Dag Hammarskjöld was on the point of


    getting something done when they killed him. Notice that I said ‘When they


    killed him’.” Pressed for a further explanation, he maintained: “That’s all I’ve


    got to say on the matter. Draw your own conclusions.”


    The natural resources of the Congo, and in particular Katanga, were then


    as now one of the country’s major attractions. By far the most important were


    rich deposits of uranium in Katanga’s Shinkolobwe mine. They had fuelled


    since the 1940s the US nuclear programme in the Cold War arms race.'
