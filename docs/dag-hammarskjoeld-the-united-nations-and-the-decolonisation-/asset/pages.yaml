    is therefore on the creation and execution of the mandate in the Congo. They


    demonstrate the role Hammarskjöld was able to play in a concrete situation


    with fundamentally conflicting interests presenting challenges and limits to


    his office—and where this role had its flaws.³ As so often, such events and the


    actors involved invite very different stories and judgements: while some com-


    mentators praise Hammarskjöld for his diplomatic skills and relative success,


