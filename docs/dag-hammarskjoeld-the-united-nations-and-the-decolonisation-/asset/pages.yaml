    (b) The claims by two persons regarding hearing alleged intercepts or reading


    transcripts of intercepts of radio transmissions relating to a possible aerial


    or ground attack on SE-BDY;


    (c) Additional information that has emerged on the air capability of the pro-


    vincial government of Katanga in 1961 and its use of foreign military and


