    values that would make a difference. We know from his many speeches and


    writings what his ethical values were. We know where he had to compromise.


    But we do not know (and may never be able to establish beyond speculation)


    how much of a difference he really made. All we know is that he was often at


    loggerheads with some of the most powerful states in global politics, and that


    he seemed to believe that taking sides with the less influential members of the


    world community would be in many (if not most) cases the right thing to do.


    Any tribute should remain modestly reluctant to make final judgements.


    Hammarskjöld was fascinated by the novels of Joseph Conrad, his narra-


    tives of the inner struggle reflecting “the solitary individual’s situation in
    life”,


    which emphasised “moral and psychological issues, responsibility and duty”,


    and whose key concepts were solidarity and solitude.^(31) His last piece of writ-


    ing, an essay written in Swedish just before his death for the Swedish Tourist


    Association (whose vice-chairman he was) and published in its yearbook for


    1962, recalls his upbringing. He ends with reflections on the annual gathering


    of former and current graduates awarded doctorates by Uppsala University in


    a ceremony held at the end of the academic year:


    you can see them—the jubilee doctor, still with the laurel wreath on his brow,


    and the young one who has just received his degree and is looking forward to his


    lectureship. There are fifty years between them. One goes over the hill in order


    to see, once more before leaving, the town where he has spent many a long year


    laying the foundation of his life’s work. The other, about to encounter the town


    of his youth, measures the distance between what he once hoped for and what


    he achieved. How many return as victors?


    How many come back?^(32)


    At the end of September 1961, Dag Hammarskjöld’s body was laid to rest


    in the family grave in the town’s old cemetery. In an entry in his notebook, he


    had once declared: “I believe that we should die with decency so that at least


    decency will survive.”^(33)'
