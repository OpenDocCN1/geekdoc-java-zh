    responsibilities of the great Powers. The fact that such precepts had contradictory


    implications meant that they could not provide automatic answers to particular


    problems, but rather that they served as criteria which had to be weighed and


    balanced in order to achieve a rational solution of the particular problem.^(26)


    And the longest-serving staff member of the United Nations, who joined


    the organisation in 1945 and worked closely with five Secretary-Generals until


    his retirement, observed in retrospect:


    Integrity was a quality to which Hammarskjöld attached the highest impor-


    tance, and it was the keynote of his approach to political and diplomatic action.


    He would not, indeed could not, undertake an action he thought dishonest or


    unworthy, and he was thus valued as a friend and interlocutor even by those with


    whom he strongly disagreed. Within this imperative of integrity, Hammarskjöld


    was extraordinarily sensitive to the difficulties and sensibilities of the people


    with whom he was dealing. He had an exceptional talent for suggesting effective


    solutions that could be accepted without offence by the parties to a conflict.


    One key to his success as a negotiator was his ability to retain his mobility
    and


    to avoid either getting himself boxed in or committing others to rigid public


    positions that they would have difficulty in changing. By preserving his freedom,


    he could often make local progress even in situations that appeared hopeless.
    His


    keen sense of timing allowed him both to keep alternatives open and, at the right


    moment, to create new and unexpected options for the parties. In an apparent


    deadlock he had a talent for spinning a new concept that the conflicting parties


    might be able to grasp at without losing face.^(27)


    As Rowan Williams, former Anglican Archbishop of Canterbury, con-


    cluded in a review: “Hammarskjöld was one of the most significant moral


    influences in international politics in the decades immediately after the war”,


    who “almost single-handedly shaped the vision for international co-operation


    and crisis management that we struggle to realise and, however reluctantly,


    take for granted across a great deal of the globe … Hammarskjöld … told us, as


    loudly and clearly as he could, that the vision of a world in which interests


    converge was a necessary exercise of the imagination.”^(28)


    After being reappointed as Secretary-General, Hammarskjöld ended his


    first speech to staff by citing the opening words of one of his favourite Swedish


    folksongs, “Will the flowers of joy ever grow?” He then cited the poet Gunnar


    Ekelöf, who adapted the wording by asking, “Will the day ever come when joy


    is great and sorrow is small?” and continued:


    Looking at it in terms of humanity, looking at it in terms of the development
    of


    human society, it can be said, of course, that what we are trying to do here is
    to


    make our small contribution, during our short time, to a development which


    will finally lead us to the day “when joy is great and sorrow is small.”'
