    The following pages seek to make the case that his visions were at variance


    with the interests of the big powers of his time—that he was a kind of “anti-


    hegemonic” Secretary-General. By doing so, my arguments engage occasion-


    ally with some of the more critical assessments that associate him with


    Western imperialist interests. I offer a more nuanced conclusion: while


    Hammarskjöld was the product of a Western (Nordic) socialisation, he was at


    the same time an internationalist whose aspirations were much more far-


    reaching than promoting a Western agenda in global governance, guided as he


    was by notions of international solidarity and respect for and recognition of


    otherness. In doing so, the study assesses Hammarskjöld’s space for manoeu-


    vring (or, rather, its limits) and his efforts to recognise what he considered
    the


    legitimate interests of the newly independent African states. It shows his


    strategy to seek close collaboration with the new African as well as other non-


    aligned states emerging vis-à-vis the power blocs in the East and the West, and


    also highlights his concept in terms of support for development. This adds


    further aspects to the ongoing debate, explaining why Hammarskjöld may


    have been in the way of big power interests and that his untimely death might


    have been not only a welcome tragedy for many, but the result of active inter-


    vention by some.


    My aim is at the same time to generate more awareness of the scope as well


    as the limits of a person’s influence and policy in relation to processes within


    the context of global governance. I focus on the role of the United Nations


    during this era, its inherent contradictions and challenges, and the limited


    space for solutions to conflicts, given the essential interests of the big powers


    during the Cold War. Unfortunately, there remains a lack of African voices


    and perspectives on record. As a result of such a deficit, the literature tends
    to


    document and reflect the mainstream of Western policy of the 1950s vis-à-vis


    other continents and people. It is not possible in this study to transcend the


    hegemonic tendency in global governance of the day. Instead, it tries to look


    in more nuanced detail at how this hegemonic tendency and the space for


    manoeuvring were dealt with. In this sense it is another “mainstream” contri-


    bution. There remains a lot to be done to bring other actors and their voices


    more adequately into the picture. The decolonisation of Africa, within the


    limited purpose of this study, remains a predominantly Western affair. But as


    it tries to show, there were different approaches and options within such


    Western worldviews and in the thoughts and principles that were translated


