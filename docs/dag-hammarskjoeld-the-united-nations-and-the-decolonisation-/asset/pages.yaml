    INTRODUCTION


    HISTORY BETWEEN FACT AND FICTION


    *The madman shouted in the market place.*


    *No one stopped to answer him.*


    *Thus it was confirmed that his thesis was incontrovertible*.¹


    This study seeks to fill a gap in the current literature on the role of the second


    Secretary-General of the United Nations, who served the institution from


    1953 until his death in 1961\. Much has already been published on


    Hammarskjöld. In a pioneering way, Brian Urquhart presented an early


    insightful account. It is based on his personal interaction with Hammarskjöld


    and on many documents he had left behind in his office. For a long time, this


    was the most authoritative study, which focused almost exclusively on the


    political and diplomatic skills of the Secretary-General.² This rather system-


    atic and detailed account was far superior to the many other publications


    immediately published after Hammarskjöld’s death and the years following,


    which mainly paid him less detailed and more uncritical homage.³ But


    Urquhart’s comprehensive volume also had its limitations in that it offered


    the perspectives of someone who was part of the very history he was describ-


    ing. After all, first-hand accounts of those involved in events are not always


    the most neutral ones.


    The published thesis in German of Manuel Fröhlich, with its much shorter


    English version, which unfortunately had to sacrifice a lot of the nuanced


    Dag Hammarskjöld, The United Nations and the Decolonisation of Africa. Henning
    Melber,


