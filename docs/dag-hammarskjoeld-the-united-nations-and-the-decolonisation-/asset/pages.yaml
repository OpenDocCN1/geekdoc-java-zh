    SERVICE AS DUTY


    DAG HAMMARSKJÖLD’S UPBRINGING, ETHICS,


    AND EARLY CAREER


    *Never look down to test the ground before taking your next step: only he who
    keeps*


    *his eye fixed on the far horizon will find his right road*.¹


    *Life only demands from you the strength you possess.*


    *Only one feat is possible—not to have run away*.²


    Dag Hjalmar Agne Carl Hammarskjöld was born on 29


    July 1905 in the


    Swedish town of Jönköping, the youngest of four sons of Agnes (1867–1940)


    and Hjalmar (1862–1953). At the time of his birth, his father—previously


