    Concluding Observations


    Several issues raised in this case study seem of continuing relevance. The


    dynamics in the unfolding crisis of the Congo invite a few final observations.


    With foresight, Hammarskjöld commented in an internal communication


    as early as 19 July 1960:


    Congo operation is likely to go far beyond Suez story in all directions. If we


    succeed and if Seco [Security Council] accepts lines and philosophy devel-


    oped in my report … it will probably mean the opening of a new and decisive


    chapter in the history of under-developed countries and the UN. For the first


    time we come to grips with the realities of post-colonial era, and I hope that


    we will not fail.^(136)


    Hammarskjöld’s concerns were certainly not far-fetched. As an observer


    said, the Congo “was simultaneously a hotbed of inter-African intrigue, a


    playground for the superpowers and a turning point in the decolonization


    process”.^(137) Like the Suez crisis, the situation prompted some strategic posi-


    tioning by the influential member states. The US, while immediately engaging


    with a massive presence of the CIA on the ground, preferred not to involve


    itself too much in the peacekeeping mission. Rather, it responded to appeals


    for help by the Congolese government, “which it hoped would obviate any


    Congolese request for Soviet military assistance”.^(138) Washington’s primary
    aim


    was to replace the Belgian presence by that of the United Nations and “repli-


    cate the 1956 Suez mission, when a multi-country UN coalition had success-


    fully restored order” by forcing Israel out of Egypt: “This was the essence of


    containment: the United States would remain on the sidelines, but so too


    would the Soviet Union.”^(139)


    In the course of events, this turned out to be wishful thinking, while


    Hammarskjöld understood and executed his office more as a General than as


    a Secretary. Claiming to be a proactive guardian of the Charter, he took the


    initiative when the Security Council was reluctant to act. It is very likely that


    a mandate would have not been adopted if it had not been for his personal


    initiative. This brings to the fore the relevant role a Secretary-General is able


    to play if he or she is willing. Not by coincidence, ever since Hammarskjöld’s


    terms in office, the role of his successors has often been measured against his


    performance. This alerts us to the need to define the interaction between the


    member states and the Secretariat. In interpreting and executing the man-


    date, Hammarskjöld claimed he was jealously guarding the independent role


    of the Secretariat.'
