    impact and legacy have bothered to look closely at the numerous statements


    and speeches of the Secretary-General during his time in office. After all, these


    fill four edited volumes totalling some 2,000 pages.^(16) While there are always


    discrepancies between what is said and what is done—as so often in politics


    and diplomacy, and in private life too—these documents offer insights into


    concepts and convictions and are indicative of Hammarskjöld’s values and


    principles. By repeatedly emphasising them, as he consistently did over eight


    years in office, they form part of a policy.


    As I argue and try to document, Dag Hammarskjöld was indeed a person


    of integrity, whose moral and political views reflected the humanist spirit of


    the United Nations Charter which he always considered as the ultimate com-


    pass. But given the complexity of matters and the few reliable sources at hand,


    a final judgement in the absence of verifiable factual evidence risks being


    speculative. One might, for example, trust or else doubt the degree of “truth”


    in the following anecdote, shared by one of his assistants at the time:


    In addition to his knowledge, intelligence and efficiency, his most typical char-


    acteristic was integrity. He was utterly sensitive to what he saw as any attempt
    to


