    *Values vs Realpolitik*


    However, as compelling as these arguments might look at first sight, they seem


    to suggest an all-too-easy way out—especially for a person so driven by a fun-


    damental belief as Dag Hammarskjöld was. His passionate advocacy of values


    was unable to eliminate the latent conflict between his own convictions and


    the mandate he had to execute, which was not completely of his own making.


    The interpretation of such a mandate leaves room for definition. And that


    room is occupied and claimed by a variety of potentially antagonistic stake-


    holders in global policy-making and their colliding interests. These include the


    values of the office-bearer, and also those of others with at times very different


    agendas and motives. Who then holds the power of definition? To resort, as


    Hammarskjöld occasionally did in such situations, to the ultimate dogma


    enshrined in the Charter did not really offer a way out of the dilemma. Rather,


    at times his appeals sounded more like appeals of ultimate desperation, for


    example when during the Suez crisis he stated before the Security Council in


    no uncertain terms:


