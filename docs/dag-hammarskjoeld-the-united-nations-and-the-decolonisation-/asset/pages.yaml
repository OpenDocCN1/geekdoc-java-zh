    PREFACE


    It was at the annual African Studies Conference of the African Studies


    Association in the UK at Leeds in September 2016\. As before on such occa-


    sions, I met Michael Dwyer at the Hurst Publishers book display. He asked


    me about my plans when retiring at the end of October the same year from the


    Dag Hammarskjöld Foundation. I mentioned that among other things I


    would like to write an account of Dag Hammarskjöld’s role during the initial


    stages of decolonisation in Africa. Michael nodded and remarked: I will send


    you a contract. A few days later I realised that he had not been joking …


    Thanks to Michael, I had the opportunity to bring a decade as executive


    director and senior advisor at the Foundation, which was established 1962 in


    Hammarskjöld’s name, to a kind of scholarly closure. Now I was finally forced


    to take up a position myself between glorification and castigation of the role


    the United Nations’ second Secretary-General had played while in office


    between 1953 and 1961\. My balancing act is herewith presented to the public


    for judgement.


    Hammarskjöld was not flawless: no human being is. He was aware of his


    limitations in living up to the values he believed in. But there are few other


    people whom I admire in a similar way. The only exception perhaps (apart


    from Sue and Tulinawa, the loves of my life) is Albert Camus, whose photo


    stands alongside Hammarskjöld’s on my desk. For me, both share as their most


    outstanding feature and conviction the belief that integrity, decency, human


    dignity, humanism, rights and justice matter. While they lived their short lives


    in parallel, their paths hardly crossed. They had different visions, but pursued


    them in similar fashion in an effort to live up to these values in their own lives.


    For both, a fitting characterisation might be what the poet Carl Sandburg, in


    a tribute to Abraham Lincoln, called a blend of steel and velvet.'
