    detail, was able to add important further dimensions.⁴ He managed to recon-


    cile the “political” Hammarskjöld with the “spiritual” Hammarskjöld (hardly


    visible in Urquhart’s biography) and included references to Hammarskjöld’s


    “inner world” hitherto largely ignored in the political accounts. These aspects


    were until recently left all too often to more spiritual—at times esoteric—


    deliberations not linked to the political role Hammarskjöld had. This litera-


    ture, while legitimate in its own right, does not play a role in the chapters


    following. Finally, the biography by Roger Lipsey emphasised in a far more


    detailed and powerful way than others the synthesis between the socialisation


    of Hammarskjöld, his career as a Swedish and international civil servant, and


    his spiritual world, which shaped and guided his ethics and moral values in his


    diplomacy as well.⁵ The complex layers of Hammarskjöld’s motives cannot be


    adequately characterised as “ideology”. Rather, they were guiding principles


    for his convictions and perhaps also served as a moral compass. These inter-


    related dimensions have largely been deconstructed and dealt with by the


    three insightful, though not necessarily neutral, analyses of Urquhart, Fröhlich


    and Lipsey. In their distinct ways they are by far the most intimate engage-


    ment with the policies of Hammarskjöld. Their recognition of his role also


    testifies in very differing ways to their recognition of and admiration for a


    remarkable person and diplomat.


    The variety of aspects that ought to be recognised in a comprehensive


    assessment of Hammarskjöld’s personality and policy, including his often-


    neglected background as an economist as well as his interest in culture and art,


    have also been analysed in more detail in many of the contributions to two


    edited volumes.⁶ In addition, the mediation style of Hammarskjöld and his


    efforts at conflict management are often the subject of peace and security


    studies. His specific understanding of the role of the Secretary-General as a


    visionary has also been a subject of comparative studies within the fields of


    international relations and global governance.⁷ Many of the insightful contri-


    butions in this area are only mentioned in this book in passing, if at all, since


    it seeks to fill a gap not covered by them.⁸


