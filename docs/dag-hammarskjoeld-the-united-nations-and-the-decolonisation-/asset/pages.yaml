    member states. Like his predecessor, Trygve Lie, he used the opportunity of


    an introduction to present his major annual policy statement and review.


    After a long general assessment, outlining his understanding of the organisa-


    tion and the international civil service, he devoted attention to three aspects


    under the headings “Collective Security and Reconciliation”, “Economic


    Development” and “Programme for Social Advancement and Human


    Rights”. Notably, his thoughts on economic development occupied more


    room than the other two aspects together. Even at that stage he emphasised


    the role of the United Nations in linking economics, sovereignty and inter-


    national collaboration by recognising


    the vital importance, for sound development of the world community, of orderly


    progress of the nations towards a state of full economic development, self-gov-


    ernment, and independence. And, finally, international cooperation is recog-


    nized as an essential instrument for a guided development towards greater social


    justice within the nations.


    …


    Of the multitude of United Nations programmes in the economic and social


