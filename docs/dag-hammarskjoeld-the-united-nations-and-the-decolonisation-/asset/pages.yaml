    Hammarskjöld’s role in the decolonisation of Africa within the wider frame-


    work of the time and the formative years of the United Nations.


    The special attention and prominence given, for understandable reasons, to


    the Congo (which also plays a prominent role in chapter six of this book) has


    indirectly contributed to the reduced focus on Hammarskjöld’s more general


    role as regards the entire African continent. As a result, there has not been
    a


    wider assessment of his diplomacy and policy as Secretary-General when “the


    winds of change” (in Harold Macmillan’s phrase) were blowing. On a closer


    look, evidence suggests that Hammarskjöld’s support for the independence of


    African colonies and in particular his role in the Congo were not only increas-


    ingly attacked by the Soviet Union. His role was seemingly also less and less


    appreciated by the dominant Western powers, and he was always despised by


    the racist minority regimes of southern Africa. His early popularity among the


    more influential Western governments rapidly declined during his second


    term in office.


    Following these introductory reflections, this study summarises


    Hammarskjöld’s socialisation, background and his understanding of public


    service as duty as well as his role in the Swedish administration, before facing


    global policy challenges as the most senior international civil servant (chapter


    two). Chapter three engages with the United Nations’ normative framework


    as a point of departure for considering Hammarskjöld’s terms in office there


    from 1953 to 1961\. Chapter four documents, with reference to many of his


    speeches, his moral compass in terms of his fundamental conviction about the


    purpose of the United Nations. How he turned this into a concept of solidar-


    ity, an emphasis on the sovereignty of states and the importance of the right


    to self-determination and development for the decolonisation process emerg-


    ing on the African continent is the focus of chapter five. The Suez crisis and


    the intervention in the Congo serve in chapter six as case studies to illustrate


    Hammarskjöld’s efforts to translate values into politics. This is followed by
    a


    detailed summary of the investigations following the plane crash near Ndola,


    where he and fifteen others lost their lives (chapter seven). The concluding


    chapter eight seeks to give recognition to Hammarskjöld’s role in the face of


    the growing number of more critical assessments of his time in office.'
