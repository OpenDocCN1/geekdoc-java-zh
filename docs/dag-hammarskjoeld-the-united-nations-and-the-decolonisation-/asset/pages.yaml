    However, you can also look at those words in a much more personal and inti-


    mate sense. I think it is possible to interpret them superficially but it is also


    possible to interpret them in a sense which goes to the very heart of our way
    of


    settling our relation to life. And then I would say that, on the day we feel that
    we


    are living with a duty, well fulfilled and worth our while, on that day joy is
    great


    and we can look on sorrow as being small.^(29)


    A word of caution is needed in this final appraisal. Hammarskjöld’s ethics


    have been for obvious reasons a major reference point in most appraisals of


    him in his role as Secretary-General. After all, they played a central role in
    his


    own arguments. As we have seen, his ever-visible moral compass drew very


    opposite conclusions. He was either praised for his uncompromising values


    and principles or considered an unscrupulous “fake” moralist. One must,


    however, resist the temptation to accept his ethics only at face value, inde-


    pendent of the conclusions drawn. As this book has tried to show, the convic-


    tions of the Secretary-General of the United Nations can (and should) matter.


    But they are anything but decisive elements when it comes to steering and


    navigating an institution of global governance, in which the conflicting, at


    times antagonistic, interests of influential players are manifest. Like any other


    leader of an institution with multiple interests and matters at stake,


    Hammarskjöld was constantly confronted with the limitations of his office.


    As we know from those with whom he closely interacted, the permanent con-


    flicts requiring the art of diplomacy and the trading of compromises left their


    marks. Towards the end of his time in office Hammarskjöld showed signs of


    wear and tear. While he often used the example of a mountaineer to illustrate


    the uphill battles, he resorted to a similar analogy at the end of 1960:


    The Assembly session had been a disillusioning experience, reflecting certain


    ugly underlying tendencies and trends in world politics that he was determined


    to resist from whatever quarter they came. “The job”, he wrote to Hans Engen,


    who was now State Secretary for Foreign Affairs of Norway, “has become a bit


    like fighting an avalanche; you know the rules—get rid of the skis, don’t try
    to


    resist but swim on the surface and hope for a rescuer. (Next morning historians


    will dig up the whole rotten mess and see how many were buried.) A consolation


    is that avalanches, after all, automatically always come to a stop and that thereaf-


    ter you can start behaving like an intelligent being again—provided you have


    managed to keep afloat.”^(30)


    Among the questions that need further investigation is whether


    Hammarskjöld indeed managed not to be among the buried, but to keep afloat


    by following his own course and convictions. Another question is the extent to


    which he was able to rescue and protect what he treasured as substantial core'
