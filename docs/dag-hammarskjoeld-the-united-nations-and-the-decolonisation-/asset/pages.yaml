    ACKNOWLEDGEMENTS


    Many have accompanied me on the way into and through this book. I would


    like to acknowledge a few of them. I am grateful to the other “musketeers”,


    with whom I have been involved since 2012 in efforts to come closer to the


    truth of what really happened on that fatal night of 17/18


    September 1961


    near Ndola: Susan Williams, Hans-Kristian Simensen and David Wardrop,


    with Gervase Hood, Roger Lipsey and Inga-Lill Hammarskjöld as part of the


    extended musketeer family.


    I appreciate the recognition and support of Henrik Hammargren, the cur-


    rent executive director of the Dag Hammarskjöld Foundation, who shares


    with me the commitment to keep the Hammarskjöld values alive. I am also


    grateful to the other staff at the Foundation’s Secretariat, in particular Karin


    Abbor-Svensson, who is in charge of promoting the Hammarskjöld legacy.


    They all make me feel welcome to remain on board and to join them occasion-


    ally in activities as a senior advisor. I also fondly remember Sven Hamrell, for


    decades executive director of the Foundation until 1995, who so generously


    welcomed and supported me at the Foundation.


    I am grateful to Iina Soiri and her colleagues at the Nordic Africa Institute,


    who provided me, as the Institute’s previous research director and current


    senior research associate, with a supportive and pleasant working environment


    without which I would have been unable to deliver many of the outcomes of


    my work during the last few years.


    I also treasure the collaboration with my colleagues Maxi Schoeman at the


    University of Pretoria and Heidi Hudson at the University of the Free State


    in Bloemfontein, who both took the initiative to secure my affiliation to their


    institutions as extraordinary professor.'
