  md: 'ACKNOWLEDGEMENTS


    174


    I thank Philip Murphy, Sue Onslow and Mandy Banton, with whom I


    interact as senior research fellow at the Institute of Commonwealth Studies/


    Centre for Advanced Study at the University of London. This affiliation


    means a lot to me, in view of the Institute’s role during the days when solidar-


    ity with the struggles for liberation in Southern Africa mattered.


    Special thanks go to the Centre of Excellence: Cultural Foundations of


    Social Integration at the University of Konstanz, which hosted me for the


    third time (after 2013 and 2015) in April/May 2018 in a wonderful environ-


    ment so that I could concentrate on this book, among other things.


    I owe much to Michael Dwyer and his team at Hurst. They never indicated


    any doubt that I would deliver and even announced the book at a time when


    the manuscript was not yet in sight—as if this was of any comfort to me! I


    hope they do not feel let down by the result I have delivered. Its final version


    benefited from some very constructive observations by two competent review-


    ers. I thank them for their fair assessments. I am also grateful to Russell Martin


    for his professional language editing.


    I remember with gratitude the personal encounters and exchanges I had


    with Jean Gazarian, Knut Hammarskjöld, Per Lind, Sture Linnér, Wilhelm


    Wachtmeister and Sverker Åström. Having interacted with Hammarskjöld,


    they were a source of inspiration. I would therefore like to dedicate this work


    to their memory and that of “the boss”, as the Secretary-General was fondly


    called by his staff.


    Most importantly, this publication, like so many others before, would not


    have been possible without the never-ending support of Sue. I cannot thank


    her enough for her labour of love: for her care, understanding, patience and


    tolerance, when more often than usual “the light was on but nobody was at


    home” because I was once again deeply absorbed in thought. This book, there-


    fore, is as much hers as it is mine.'
