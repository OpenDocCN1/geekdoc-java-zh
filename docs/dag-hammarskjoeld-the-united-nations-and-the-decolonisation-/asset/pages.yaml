    they are embodied, and the aims which they are to safeguard are holier than the


    policies of any single nation or people … [T]he discretion and impartiality …


    imposed on the Secretary-General … may not degenerate into a policy of expedi-


    ency. He must also be a servant of the principles of the Charter, and its aims


    must ultimately determine what for him is right or wrong.^(72)


