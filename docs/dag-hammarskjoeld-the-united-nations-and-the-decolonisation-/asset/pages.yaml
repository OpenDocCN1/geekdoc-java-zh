    Hammarskjöld was certainly pro-Western but did not always go along with the


    United States, particularly when he determined (or was forced to see) that its


    goals were not conducive to overall international security (as he saw it). Yet


    Hammarskjöld was also a diplomat extraordinaire, and had he lived longer the


    crisis might have ended sooner or more peacefully. A major problem with his


    legacy is that his imprint on ONUC was so subtly managed and dependent on


    his personal relationships that it was impossible for others to follow. He was
    not


    supposed to die, and his untimely death threw into jeopardy all he had carefully


    crafted and managed in the Congo.^(131)


    The complicated mix of domestic political rivalries, external influence by


    other states, an unclear framework for the mandated intervention and person-


    ality clashes ended not only in deadly consequences for Lumumba. But while


    Hammarskjöld and the United Nations failed to end the conflict in the


    Congo, the intervention at least managed to prevent further escalation which


    might have provoked a much larger inter-state military battle for the control


    of geostrategic resources: “Whatever its failings, the UN remained the last


    best chance of keeping the Cold War at bay in the Congo.”^(132) Put differently:


    “The Congo crisis could easily have provoked armed conflicts in other parts


    of Africa, even led to a world war. It was Dag Hammarskjöld and no one else


    who prevented that.”^(133) On the other hand, one should be careful not to over-


    emphasise the impact and influence of an individual limited in the scope of


    his actions by the political environment in which his office was forced to oper-


    ate: “One can speculate that the Congo drama might have turned out quite


    differently if Hammarskjold had not died …, but evidence suggests that the


    outcome depended less on the personality of the Secretary-General than on


    the interplay of external and Congolese interests.”^(134)


    This is a sobering but necessary reminder that one should not expect a


    Secretary-General to achieve miracles in the midst of a polarised world. It also


    points to the fact that while persons and personalities matter, the decisive


    factors determining the scope for success ultimately lie outside the direct


    influence of an individual and can only be used favourably depending on an


    individual’s skill and ability to accommodate differing interests. After all,
    “The


    Secretary-General was never given authority to impose a political solution on


    the Congo.”^(135) A mandate that remains as open and unspecific as the one for


    the first Congo mission of the United Nations is potentially a recipe for fail-


    ure, if not disaster. Instead of blaming Hammarskjöld, one should rather


    wonder at how much he was able to make out of it. While of late it seems *en*


    *vogue* to be harshly critical of Hammarskjöld’s role, such conclusions seem as


    unjustified as those praise songs that award him the status of a hero.'
