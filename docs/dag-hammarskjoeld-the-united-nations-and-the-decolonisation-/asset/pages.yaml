    *Fact or Fiction?*


    It seems a fair assessment that Dag Hammarskjöld has been “the subject of


    extensive legend building” in the half a century or so since his death.^(12) But


    legends are not only constructed through a kind of selective heroic narrative


    by those contemporaries close to him or others in the admiration club.^(13) The


    selective narrative also applies to those with opposite motives, both within the


    “inner circle” of his time^(14) and those since then who describe Hammarskjöld


    either as a dishonest, opportunistic broker or as the unscrupulous personifica-


    tion of a global governance institution they dismiss as biased and an instru-


    ment of imperialism. What has been rightly observed about the “fan club” of


    Hammarskjöld applies as much to those who launch scathing attacks on his


    role. Both ignore the complexity of the environment in which he operated,


    which set limits to individual responsibility: “precious little of this evidence


    appears to disturb the mostly uncritical and laudatory—sometimes bordering


    on hagiographical—accounts of Hammarskjöld’s ethical approach to diplo-


    macy. In theoretical terms, these oversights prevent a full appreciation of the


    dilemmas faced by international civil servants in managing the conflicting


    demands of diverse missions and broad constituencies.”^(15)


    Most of the attempts on both sides—the uncritical “praise songs” as well


    as the damning “disclosures” debunking the “Hammarskjöld cult”—conveni-


    ently ignore the complexity of the man as well as the structures in which he


    operated. To associate Dag Hammarskjöld with hegemonic policy because


    the United Nations as an institution of global governance has been con-


    structed in a way that reproduces hegemonic rule is an undue simplification


    of the dynamics of international organisations. Asymmetrical power relations


    influencing institutions do not make everyone in such organisations—


    including the highest international civil servant—by definition an agent of


    imperialism or of other dominant interests. Someone operating in such envi-


    ronment is still the owner of his or her mind. But at the same time he or she


    is not protected from being a prisoner of circumstances and at times


    *Sachzwang* (practical constraint).


    I maintain that personal values and integrity do matter, even if they face


    limitations in the execution of office or other daily practice. It is noteworthy


    in this regard that few of those who draw conclusions about Hammarskjöld’s'
