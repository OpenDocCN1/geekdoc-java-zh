    In contrast, there is a major source that can provide a fair assessment of


    Hammarskjöld’s approach. The collected four volumes of the statements and


    speeches of Hammarskjöld during his eight years in office remain a reliable


    body of evidence of his analyses and arguments, at the same time indicating


    his convictions—unless one is convinced that this is the testimony of a notori-


    ous liar, who managed to mislead the world. This book therefore uses often


    this source to convey Hammarskjöld’s approach in his own words, even at the


    risk of quoting lengthy passages from the original.


    Readers are invited to judge their own feelings and conclusions at the end


    of the book, to which version of Hammarskjöld’s role as Secretary-General of


    the United Nations they tend. I confess upfront that while I do not consider


    the main actor in the following chapters as flawless, I continue to admire his


    values, principles and integrity, despite the situations in which he seemingly


    failed. Nobody is perfect: why should Hammarskjöld have been so?


    Finally, there are other questions which readers should keep in mind when


    engaging with the arguments of this book. What might have happened if


    Hammarskjöld and the United Nations had not intervened in the Suez crisis?


    Would the people of the Congo have been better off without the United


    Nations peacekeeping force and Hammarskjöld? Would it have been better


    not to “leave it to Dag”? I hope that the pages that follow will make it easier


    to find answers to questions like these.'
