  \n## 12.1 表格模型\n\n在前面的示例中，表格数据存储在二维数组中。然而，通常你不应该在你的代码中使用这种策略。相反，考虑使用自己的表格模型。表格模型的实现非常简单，因为你可以利用实现了大部分方法的\
  \ `TableModel` 类。你只需要提供三个方法：\n\n```\npublic int getRowCount();\npublic int getCount();\n\
  public Object getValueAt(int row, int column);\n```\n\n实现 `getValueAt` 方法有很多种。例如，如果你想显示\
  \ `ResultSet` 的内容，只需提供此方法：\n\n```java\npublic Object getValueAt(int r, int c) {\n\
  \    try {\n        rowSet.absolute(r + 1);\n        return rowSet.getObject(c +\
  \ 1);\n    } catch (SQLException e) {\n        e.printStackTrace();\n        return\
  \ null;\n    }\n}\n```\n\n我们的示例程序更加简单。我们构造了一个显示计算值的表格——即在不同利率场景下的投资增长（参见图 12.4）。\n\
  \n![Figure](img/fig06-08.jpg)图 12.4：投资的增长\n\n`getValueAt` 方法计算相应的值并对其格式化：\n\n```java\n\
  public Object getValueAt(int r, int c) {\n    double rate = (c + minRate) / 100.0;\n\
  \    int nperiods = r;\n    double futureBalance = INITIAL_BALANCE * Math.pow(1\
  \ + rate, nperiods);\n    return \"%.2f\".formatted(futureBalance);\n}\n```\n\n\
  `getRowCount` 和 `getColumnCount` 方法简单的返回行数和列数：\n\n```java\npublic int getRowCount()\
  \ { return years; }\npublic int getCount() {  return maxRate - minRate + 1; }\n\
  ```\n\n如果你不提供列名，`AbstractTableModel` 的 `getColumnName` 方法会将列命名为 A、B、C 等。要更改默认列名，请重写\
  \ `getColumnName` 方法。在本示例中，我们简单地为每列标记利率：\n\n```java\npublic String getColumnName(int\
  \ c) { return (c + minRate) + \"%\"; }\n```\n\n你可以在列表 12.2 中找到完整的源代码。\n\n\n\n\n\
  # Listing 12.2 v2ch12/tableModel/InvestmentTable.java\n\n```java\npackage v2ch12.tableModel;\n\
  \nimport module java.desktop;\n\n/**\n * 此程序展示了如何从表格模型构建表格。\n */\nclass InvestmentTable\
  \ {\n    void main() {\n        EventQueue.invokeLater(() -> {\n            var\
  \ frame = new InvestmentTableFrame();\n            frame.setTitle(\"InvestmentTable\"\
  );\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        \
  \    frame.setVisible(true);\n        });\n    }\n}\n\n/**\n * 此框架包含一个投资表格。\n */\n\
  class InvestmentTableFrame extends JFrame {\n    public InvestmentTableFrame() {\n\
  \        var model = new InvestmentTableModel(30, 5, 10);\n        var table = new\
  \ JTable(model);\n        add(new JScrollPane(table));\n        pack();\n    }\n\
  }\n\n/**\n * 该表格模型在每次请求时计算单元格条目。表格内容\n * 显示了在不同利率下投资在若干年内的增长情况。\n */\nclass InvestmentTableModel\
  \ extends AbstractTableModel {\n    private static double INITIAL_BALANCE = 100000.0;\n\
  \n    private int years;\n    private int minRate;\n    private int maxRate;\n\n\
  \    /**\n     * 构建一个投资表格模型。\n     * @param y 年数\n     * @param r1 用于列表的最低利率\n \
  \    * @param r2 用于列表的最高利率\n     */\n    public InvestmentTableModel(int y, int\
  \ r1, int r2) {\n        years = y;\n        minRate = r1;\n        maxRate = r2;\n\
  \    }\n\n    public int getRowCount() {\n        return years;\n    }\n\n    public\
  \ int getColumnCount() {\n        return maxRate - minRate + 1;\n    }\n\n    public\
  \ Object getValueAt(int r, int c) {\n        double rate = (c + minRate) / 100.0;\n\
  \        int nperiods = r;\n        double futureBalance = INITIAL_BALANCE * Math.pow(1\
  \ + rate, nperiods);\n        return \"%.2f\".formatted(futureBalance);\n    }\n\
  \n    public String getColumnName(int c) {\n        return (c + minRate) + \"%\"\
  ;\n    }\n}\n```\n\n`javax.swing.table.TableModel`1.2\n\n*   `int getRowCount()`\n\
  *   `int getColumnCount()`\n    获取表格模型中的行数和列数。\n*   `Object getValueAt(int row,\
  \ int column)`\n    获取指定行和列的值。\n*   `void setValueAt(Object newValue, int row, int\
  \ column)`\n    在指定的行和列设置一个新值。\n*   `boolean isCellEditable(int row, int column)`\n\
  \    如果指定行和列的单元格可编辑，则返回 `true`。\n*   `String getColumnName(int column)`\n    获取列标题。\n\
  \n## 12.2. 行与列的操作处理\n\n在接下来的小节中，你将看到如何操作表格中的行和列。在阅读这些材料时，请记住 Swing 表格是相当不对称的——你对行和列可以执行的操作是不同的。表格组件经过优化，用于显示具有相同结构的信息行（例如数据库查询的结果），而不是任意的对象的二维网格。你将在整个小节中看到这种不对称性。\n\
  \n### 12.2.1. 列类\n\n在下一个示例中，我们再次显示我们的行星数据，但这次我们想为表格提供更多关于列类型的信息。这是通过定义表格模型的方法来实现的：\n\
  \n```\nClass<?> getColumnClass(int columnIndex)\n```\n\n该方法返回一个描述列类型的类。\n\n`JTable`\
  \ 类使用这些信息来为该类选择合适的渲染器。表 12.1 显示了默认的渲染操作。\n\n表 12.1: 默认渲染操作\n\n| 类型 | 渲染为 |\n| ---\
  \ | --- |\n| `Boolean` | 复选框 |\n| `Icon` | 图像 |\n| `Object` | 字符串 |\n\n你可以在 图 12.5\
  \ 中看到这些复选框和图像。（感谢 Jim Evins 提供的行星图片！）\n\n![Figure](img/fig06-09.jpg)图 12.5：带有行星数据的表格\n\
  \n要渲染其他类型，你可以安装自定义渲染器——参见第 12.3 节。\n\n### 12.2.2. 访问表格列\n\n`JTable` 类将 `TableColumn`\
  \ 的对象存储列的信息。`TableColumnModel` 对象管理列。（图 12.6 显示了最重要的表格类之间的关系。）如果你不想动态插入或删除列，你就不会经常使用列模型。列模型最常见的用途仅仅是获取一个\
  \ `TableColumn` 对象：\n\n```\nint columnIndex = . . .;\nTableColumn column = table.getColumnModel().getColumn(columnIndex);\n\
