  \n`Graphics2D` 是一个功能强大的绘图类，它继承自 `Graphics`。它提供了许多比 `Graphics` 类更强大的功能，允许对线条、填充、变换和裁剪等进行精细的控制。\n\
  \n### 12.5.1 渲染流水线\n\n原始 JDK 1.0 的绘制机制非常简单。你选择颜色和模式，调用 `Graphics` 的方法如 `drawRect`\
  \ 或 `fillOval`。Java 2D API 支持更多：\n\n* 你可以创建各种形状。\n* 你可以控制 `stroke`——绘制边界的笔笔。\n*\
  \ 你可以使用使用色颜色、变化的色调或重复填充来填充填充形状。\n* 你可以使用变换来移动、缩放、旋转或拉伸形状。\n* 你可以对任意区域进行裁剪。\n* 你可以使用组合规则来描述如何将新形状的像素与现有像素组合。\n\
  \n要绘制形状，请按照以下步骤操作：\n\n1. 获取 `Graphics2D` 类的对象。该类是 `Graphics` 类的子类。从 Java 1.2 开始，`paint`\
  \ 和 `paintComponent` 方法会自动接收一个 `Graphics2D` 对象。只需如下进行强制转换：\n\n```java\npublic void\
  \ paintComponent(Graphics g) {\n    var g2 = (Graphics2D) g;\n    . . .\n}\n```\n\
  \n2. 使用 `setRenderingHints` 方法设置渲染提示——在速度和绘制质量之间的权衡。\n\n```java\nRenderingHints\
  \ hints = . . .;\ng2.setRenderingHints(hints);\n```\n\n3. 使用 `setStroke` 方法设置描触。描触负责绘制形状的轮廓。你可以选择粗细并在实线和虚线之间切换。\n\
  \n```java\nStroke stroke = . . .;\ng2.setStroke(stroke);\n```\n\n4. 使用 `setPaint`\
  \ 方法设置填充颜色。填充填充描触或形状的内部。\n\n```java\nPaint paint = . . .;\ng2.setPaint(paint);\n\
  ```\n\n5. 使用 `clip` 方法设置裁剪区域。\n\n```java\nShape clip = . . .;\ng2.clip(clip);\n\
  ```\n\n\n\n\n6. 使用 `transform` 方法设置从用户空间到设备空间的 `transformation`（变换）。如果你觉得在自定义坐标系中定义形状比使用像素坐标更方便，请使用变换。\n\
  \n```\nAffineTransform transform = . . .;\ng2.transform(transform);\n```\n\n7. 使用\
  \ `setComposite` 方法设置 `composition rule`（组合规则），该规则了如何将新像素与现有像素结合。\n\n```\nComposite\
  \ composite = . . .;\ng2.setComposite(composite);\n```\n\n8. 创建一个形状。Java 2D API\
  \ 提供了许多形状对象和用于组合形状的方法。\n\n```\nShape shape = . . .;\n```\n\n9. 绘制或填充形状。如果你绘制形状，它的轮廓将被描边；如果你填充形状，它的内部将进行上涂色。\n\
  \n```\ng2.draw(shape);\ng2.fill(shape);\n```\n\n当然，在许多实际情况下，你并不需要所有的步骤。2D 图形上下文中文的设置有合理的默认值；只有在你想要偏离默认设置时，才更改它们。\n\
  \n在接下来的章节中，你将看到如何描述形状、描边、涂色、变换和组合规则。\n\n各种 `set` 方法仅仅是设置 2D 图形上下文的状态。它们不会引起任何绘制。同样，当你构造\
  \ `Shape` 对象时，不会发生绘制操作。只有当你调用 `draw` 或 `fill` 时，形状才会渲染。此时，新形状将在 `rendering pipeline`（渲染流水线）中计算（参见图\
  \ 12.31）。\n\n.图 12.31：渲染流水线\n\n在渲染流水线中，执行以下步骤来渲染形状：\n\n1. 对形状的路径进行描边。\n2. 对形状进行变换。\n\
  3. 对形状进行裁剪。如果形状与裁剪区域之间没有交集，则处理停止。\n4. 对裁剪后剩余的形状进行填充。\n5. 将填充形状的像素与现有像素进行组合。（在图 12.31\
  \ 中，圆是现有像素的一部分，而杯子形状叠加在其上方。）\n\n在下一下一节中，你将看到如何定义形状。然后，我们将转向 2D 图形上下文的设置。\n\n###\
  \ `java.awt.Graphics2D` 1.2\n\n* `void draw(Shape s)`\n  用当前涂色绘制给定形状的轮廓。\n* `void\
  \ fill(Shape s)`\n  用当前涂色填充给定形状的内部。\n\n### 12.5.2. `Shape` 类层次结构\n\n这里是 `Graphics`\
  \ 类中用于绘制形状的一些方法：\n\n```\ndrawLine\ndrawRectangle\ndrawRoundRect\ndraw3DRect\ndrawPolygon\n\
  drawPolyline\ndrawOval\ndrawArc\n```\n\n还有对应的 `fill` 方法。这些方法从 JDK 1.0 以来一直存在于 `Graphics`\
  \ 类中。Java 2D API 使用了完全不同的、面向对象的方法。它不是方法，而是类：\n\n```\nLine2D\nRectangle2D\nRoundRectangle2D\n\
  Ellipse2D\nArc2D\nQuadCurve2D\nCubicCurve2D\nGeneralPath\n```\n\n这些类都实现了 `Shape`\
  \ 接口，我们将在接下来的章节中检查它。\n\n`Line2D`、`Rectangle2D`、`RoundRectangle2D`、`Ellipse2D` 和\
  \ `Arc2D` 类分别对应 `drawLine`、`drawRectangle`、`drawRoundRect`、`drawOval` 和 `drawArc`\
  \ 方法。（“3D 矩形”的概念已经走向了它应有的终结——没有等同于 `draw3DRect` 方法的设计）。Java 2D API 提供了两个额外的类——二次和三次曲线，我们将在本节中讨论它们。没有\
  \ `Polygon2D` 类；相反，`GeneralPath` 类描述了由线、二次和三次曲线组成的路径。你可以使用 `GeneralPath` 来描述多边形；我们将在本节稍后部分展示如何操作。\n\
  \n要绘制形状，首先创建一个实现 `Shape` 接口的类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。\n\n这些类\n\n```\n\
  Rectangle2D\nRoundRectangle2D\nEllipse2D\nArc2D\n```\n\n都继承自一个公共父类 `RectangularShape`。诚然，椭圆和弧不是矩形，但它们有一个\
  \ `bounding rectangle`（包围矩形）（参见图 12.32）。\n\n.图 12.32：椭圆和弧的包围矩形\n\n每个以“2D”结尾的类都有两个子类，用于指定\
  \ `float` 或 `double` 类型的坐标。在第一卷中，你已经遇到过 `Rectangle2D.Float` 和 `Rectangle2D.Double`。\n\
  \n其他类也使用相同的方案，例如 `Arc2D.Float` 和 `Arc2D.Double`。\n\n内部，所有图形类都使用 `float` 坐标，因为 `float`\
  \ 数字使用的存储空间较少，但对于几何计算具有足够的精度。然而，Java 编程语言处理 `float` 数字变得有些麻烦。因此，图形类的大多数方法使用 `double`\
  \ 参数和返回值。只有在构造 2D 对象时，你才需要在 `float` 或 `double` 之间选择。\n\n```java\nvar floatRect =\
  \ new Rectangle2D.Float(5, 10, 7.5, 15);\nvar doubleRect = new Rectangle2D.Double(5,\
  \ 10, 7.5, 15);\n```\n\n\n\n结果是一个位于 `-180` 和 `180` 之间的值。通过这种方式计算偏移的起始角度和结束角度。然后，计算这两个偏移角度之间的差。如果起始角度或差值为负，则给起始角度加上\
  \ `360`。最后，将起始角度和差传递给弧构造函数。\n\n如果你运行本节末尾的示例程序，可以直观地检查此计算是否为弧构造函数产生了正确的值（参见图 12.39）。\n\
  \nJava 2D API 支持 `quadratic`（二次）和 `cubic`（三次）曲线。在本章中，我们不涉及这些曲线的数学原理。你可以通过运行列表 12.15\
  \ 中的程序来直观感受曲线的外观。二次曲线由两个`end points`和一个`control point` 定义（参见图 12.37）。三次曲线（图 12.38）有两个控制点。移动控制点会改变曲线的形状。\n\
  \n图 12.37：二次曲线。图 12.38：三次曲线。\n\n要构造二次和三次曲线，请提供端点和控制点的坐标。例如：\n\n```\nvar q = new\
  \ QuadCurve2D.Double(startX, startY, controlX, controlY, endX, endY);\nvar c = new\
  \ CubicCurve2D.Double(startX, startY, control1X, control1Y,\n    control2X, control2Y,\
  \ endX, endY);\n```\n\n二次曲线并不灵活，在实践中并不常用。然而，三次曲线（例如由 `CubicCurve2D` 类绘制的贝塞尔曲线）是非常常见的。通过组合许多三次曲线并使连接处的斜率匹配，你可以创建复杂且看起来平滑的弯曲形状。更多信息，请参阅\
  \ John F. Hughes 等人编写的 *Computer Graphics: Principles and Practice, Third Edition*。\n\
  \n你可以构建任意序列的线段、二次和三次曲线，并将它们存储在 `GeneralPath` 对象中。使用 `moveTo` 方法指定路径的第一个坐标，例如：\n\n\
  ```\nvar path = new GeneralPath();\n.moveTo(10, 20);\n```\n\n然后你可以通过调用 `lineTo`、`quadTo`\
  \ 或 `curveTo` 方法之一来扩展路径。这些方法分别通过直线、二次曲线或三次曲线来扩展路径。调用 `lineTo` 时提供端点。对于两个曲线方法，提供控制点，然后提供端点。例如：\n\
  \n```\npath.lineTo(20, 30);\npath.curveTo(control1X, control1Y, control2X, control2Y,\
  \ endX, endY);\n```\n\n调用 `closePath` 方法关闭路径。它会绘制一条返回路径起始点的直线。\n\n要创建一个多边形，只需调用\
  \ `moveTo` 移动到第一个顶点，然后重复调用 `lineTo` 访问其他顶点。最后，调用 `closePath` 关闭多边形。列表 12.15 中的程序更更详细地展示了这一点。\n\
  \n通用路径并不非要是连接的。你可以任何时候调用 `moveTo` 来开始一个新路径段。\n\n最后，你可以使用 `append` 方法向通用路径添加任意的 `Shape`\
  \ 对象。形状的轮廓被添加到路径末尾。`append` 方法的第二个参数如果新形状应连接到路径上的上一点，则为 `true`，否则为 `false`。例如，调用：\n\
  \n```\nRectangle2D r = . . .;\npath.append(r, false);\n```\n\n这会将矩形的轮廓添加到路径中，但不将其与现有路径连接。但是\n\
  \n```\npath.append(r, true);\n```\n\n这会添加一条从路径端点到矩形起始点的直线，然后将矩形轮廓添加到路径中。\n\n列表 12.15\
  \ 中的程序允许你创建示例路径。从组合框中选择一个形状生成器。该程序包含以下形状的生成器：\n\n*   直线\n*   矩形、圆矩形和椭圆\n*   弧（除了弧本身，还显示边界矩形以及起始和结束角度的线）\n\
  *   多边形（使用 `GeneralPath`）\n*   二次和三次曲线\n\n使用鼠标调整控制点。当你移动它们时，形状会不断重绘。\n\n该程序有点复杂，因为它处理了多种形状并支持拖动控制点。\n\
  \n抽象父类 `ShapeMaker` 封装了形状生成器类的共性。每个形状都有固定数量的控制点，用户可以移动它们。`getPointCount` 方法返回该值。抽象方法\n\
  \n```\nShape makeShape(Point2D[] points)\n```\n\n根据控制点的当前位置计算实际形状。`toString` 方法返回类名，以便\
  \ `ShapeMaker` 对象可以简单地放入 `JComboBox` 中。\n\n为了启用控制点的拖动，`ShapePanel` 类处理了鼠标点击和鼠标移动事件。如果鼠标在矩形上按下，随后的鼠标拖动将移动矩形。\n\
  \n大多数形状生成器类都是简单的——它们的 `makeShape` 方法只是构造并返回请求的形状。然而，`ArcMaker` 类需要计算偏移的起始和结束角度。此外，为了证明计算确实正确，返回的形状是一个\
  \ `GeneralPath`，包含弧本身、边界矩形以及从弧圆心到角度控制点的线（参见图 12.39）。\n\n![Figure](img/fig07-09.jpg)图\
