  \ 定义了许多数据类型，并让你找到能够打印这些类型的打印服务。这些数据类型包括：\n\n*   GIF、JPEG 或 PNG 格式的图像\n\n*   文本、HTML、PostScript\
  \ 或 PDF 格式的文档\n\n*   原始打印机代码数据\n\n\n\n\n\n*   实现了 `Printable`、`Pageable` 或 `RenderableImage`\
  \ 的类对象\n\n数据本身可以存储在字节或字符的源中，例如输入流、URL 或数组。`document flavor`（文档风味）描述了数据源和数据类型的组合。`DocFlavor`\
  \ 类为各种数据源定义了若干个内部类。每个内部类都定义了常量来指定特定的风味。例如，常量\n\n```\nDocFlavor.INPUT_STREAM.GIF\n\
  ```\n\n描述了一幅从输入流中读取的 GIF 图像。表 12.4 列出了这些组合。\n\n表 12.4：用于打印服务的文档风味\n\n| 数据源 | 数据类型\
  \ | MIME 类型 |\n| --- | --- | --- |\n| `INPUT_STREAM` | `GIF` | `image/gif` |\n|\
  \ `URL` | `JPEG` | `image/jpeg` |\n| `BYTE_ARRAY` | `PNG` | `image/png` |\n| | `POSTSCRIPT`\
  \ | `application/postscript` |\n| | `PDF` | `application/pdf` |\n| | `TEXT_HTML_HOST`\
  \ | `text/html` (使用主机编码) |\n| | `TEXT_HTML_US_ASCII` | `text/html; charset=us-ascii`\
  \ |\n| | `TEXT_HTML_UTF_8` | `text/html; charset=utf-8` |\n| | `TEXT_HTML_UTF_16`\
  \ | `text/html; charset=utf-16` |\n| | `TEXT_HTML_UTF_16LE` | `text/html; charset=utf-16le`\
  \ (小端序) |\n| | `TEXT_HTML_UTF_16BE` | `text/html; charset=utf-16be` (大端序) |\n| |\
  \ `TEXT_PLAIN_HOST` | `text/plain` (使用主机编码) |\n| | `TEXT_PLAIN_US_ASCII` | `text/plain;\
  \ charset=us-ascii` |\n| | `TEXT_PLAIN_UTF_8` | `text/plain; charset=utf-8` |\n\
  | | `TEXT_PLAIN_UTF_16` | `text/plain; charset=utf-16` |\n| | `TEXT_PLAIN_UTF_16LE`\
  \ | `text/plain; charset=utf-16le` (小端序) |\n| | `TEXT_PLAIN_UTF_16BE` | `text/plain;\
  \ charset=utf-16be` (大端序) |\n| | `PCL` | `application/vnd.hp-PCL` (惠尔 打印机控制语言) |\n\
  | | `AUTOSENSE` | `application/octet-stream` (原始打印机数据) |\n| `READER` | `TEXT_HTML`\
  \ | `text/html; charset=utf-16` |\n| `STRING` | `TEXT_PLAIN` | `text/plain; charset=utf-16`\
  \ |\n| `CHAR_ARRAY` | | |\n| `SERVICE_FORMATTED` | `PRINTABLE` | N/A |\n| | `PAGEABLE`\
  \ | N/A |\n| | `RENDERABLE_IMAGE` | N/A |\n\n假设你想打印位于文件中的 GIF 图像。首先，查找是否存在能够处理该任务的\
  \ `print service`。`PrintServiceLookup`类的静态方法 `lookupPrintServices` 返回一个 `PrintService`\
  \ 对象的数组，这些对象可以处理指定的文档风味。\n\n```\nDocFlavor flavor = DocFlavor.INPUT_STREAM.GIF;\n\
  PrintService[] services = PrintServiceLookup.lookupPrintServices(flavor, null);\n\
  ```\n\n`lookupPrintServices` 方法的第二个参数为 `null`，表示我们不希望通过指定打印机属性来限制搜索。我们将在下一节中介绍属性。\n\
  \n如果查找返回了一个包含多个元素的数组，请从列出的打印服务中进行选择。你可以调用 `PrintService` 类的 `getName` 方法来获取打印机名称并让用户选择。\n\
  \n接下来，从服务获取一个文档打印作业：\n\n```\nDocPrintJob job = services[i].createPrintJob();\n```\n\
  \n为了打印，你需要一个实现了 `Doc` 接口的对象。Java 库提供了一个 `SimpleDoc` 类用于此目的。`SimpleDoc` 构造函数需要数据源对象、文档风味以及可选的属性集。例如，\n\
  \n```\nvar in = new FileInputStream(fileName);\nvar doc = new SimpleDoc(in, flavor,\
  \ null);\n```\n\n最后，你就可以准备好打印了：\n\n```\njob.print(doc, null);\n```\n\n如之前一样，`null`\
  \ 参数可以用属性集替换。\n\n注意，此打印过程与前一节非常不同。它没有通过打印对话框进行用户交互。例如，你可以实现一种服务器端的打印机制，用户通过 Web\
  \ 表单提交打印作业。\n\n`javax.print.PrintServiceLookup`1.4\n\n*   `PrintService[] lookupPrintServices(DocFlavor\
  \ flavor, AttributeSet attributes)`\n    查找可以处理给定文档风味和属性的打印服务。如果没有需要考虑的属性，`attributes`\
  \ 参数可以为 `null`。\n\njavax.print.PrintService1.4\n\n*   `DocPrintJob createPrintJob()`\n\
  \njavax.print.DocPrintJob1.4\n\n*   `void print(Doc doc, AttributeSet attributes)`\n\
  \    使用属性打印给定的文档。\n\n`javax.print.SimpleDoc1.4`\n\n*   `SimpleDoc(Object data, DocFlavor\
  \ flavor, AttributeSet attributes)`\n    构造 `SimpleDoc` 对象。\n\n### 12.7.4 流服务\n\n\
  打印服务发送打印数据。流服务生成相同的打印数据，但将其发送到流中，以便延迟打印。特别是如果打印数据是 PostScript，将打印数据保存到文件可能是非常有用的。枚举流服务比查找打印服务稍微麻烦一点。你需要打印对象的\
  \ `DocFlavor` 以及流输出的 MIME 类型。然后获取一个 `StreamServiceFactory` 数组。\n\n```\nDocFlavor\
  \ flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\nString mimeType = \"application/postscript\"\
  ;\nStreamServiceFactory[] factories\n    = StreamServiceFactory.lookupStreamServiceFactories(flavor,\
  \ mimeType);\n```\n\n`StreamServiceFactory` 类没有区分工厂的方法，因此我们直接取 `factories[0]`。我们带上输出流调用\
  \ `getPrintService` 方法来获取 `StreamPrintService` 对象。\n\n```\nvar out = new FileOutputStream(fileName);\n\
  StreamPrintService service = factories[0].getPrintService(out);\n```\n\n`StreamPrintService`\
  \ 类是 `PrintService` 的子类。产生输出只需按照上一节的步骤操作。\n\n`javax.print.StreamServiceFactory`1.4\n\
  \n*   `StreamServiceFactory[] lookupStreamServiceFactories(DocFlavor flavor, String\
  \ mimeType)`\n    查找可以打印给定文档风味并产生给定 MIME 类型输出流的流打印服务。\n\n*   `StreamPrintService\
  \ getPrintService(OutputStream out)`\n    获取将打印输出发送到给定输出流的打印服务。\n\n列表 12.29 中的程序演示了如何使用流打印服务将\
  \ Java 2D 形状打印到 PostScript 文件。你可以将示例绘制代码替换为生成任何 Java 2D 形状的代码，并将形状转换为 PostScript。然后你可以轻松将结果转换为\
  \ PDF 或 EPS。（的是，Java 不支持直接打印到 PDF。）\n\n在示例中，我们调用了一个 `draw` 方法在 `Graphics2D` 对象上绘制\
  \ Java 2D 形状。如果你想绘制组件的表面（例如表格或树），请使用以下代码：\n\n```\nprivate static int IMAGE_WIDTH\
  \ = component.getWidth();\nprivate static int IMAGE_HEIGHT = component.getHeight();\n\
  public static void draw(Graphics2D g2) { component.paint(g2); }\n```\n\n列表 12.29\
  \ v2ch12/printService/PrintServiceDemo.java\n\n\n\n\n\n```java\npackage v2ch12.printService;\n\
  \nimport module java.base;\nimport module java.desktop;\n\n/**\n * 此程序演示了流打印服务的使用。该程序将\
  \ Java 2D\n * 形状打印到 PostScript 文件。如果你没有在命令行上提供文件名，输出\n * 将保存到 out.ps。\n */\nclass\
  \ PrintServiceDemo {\n    // 在此处设置图像尺寸\n    int IMAGE_WIDTH = 300;\n    int IMAGE_HEIGHT\
  \ = 300;\n\n    void main(String[] args) throws Exception {\n        String fileName\
  \ = args.length > 0 ? args[0] : \"out.ps\";\n        DocFlavor flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\n\
  \        String mimeType = \"application/postscript\";\n        StreamPrintServiceFactory[]\
