  \n然而，这通常不是存储和传输的最佳形式。归一化形式 C（Form C）首先应用分解，然后按照标准顺序将重音符号组合回。根据 W3C 的规定，这是在互联网上传输数据的推荐模式。\n\
  \nListing 7.3 中的程序让你能够实验排序顺序。书的配套代码还有一个 GUI 版本。在文本字段中输入一个单词并点击 Add 按钮将其添加到单词列表中。每当你添加另一个单词或更改语言区域（locale）、强度（strength）或分解模式时，单词列表都会重新排序。`=`\
