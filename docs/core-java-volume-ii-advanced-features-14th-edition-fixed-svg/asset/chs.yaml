  \ toString(TableModel model, int row, int column)`\n  将给定位置的模型值转换为字符串；你可以重写此方法。\n\
  \n`javax.swing.RowFilter<M, I>`\n* `boolean include(RowFilter.Entry<? extends M,?\
  \ extends I> entry)`\n  指定要保留的行；你可以重写此方法。\n* `static <M,I> RowFilter<M,I> numberFilter(RowFilter.ComparisonType\
  \ type, Number number, int... indices)`\n* `static <M,I> RowFilter<M,I> dateFilter(RowFilter.ComparisonType\
  \ type, Date date, int... indices)`\n  返回一个过滤器，包含包含与给定数字或日期的给定比较匹配值的行。比较类型为 `EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一。如果提供了任何列模型索引，则只搜索这些列；否则搜索所有列。对于数字过滤器，单元格值的类必须与 `number` 的类匹配。\n\
  * `static <M,I> RowFilter<M,I> regexFilter(String regex, int... indices)`\n  返回一个过滤器，包含具有匹配给定正则表达式的字符串值的行。如果提供了任何列模型索引，则只搜索这些列；否则搜索所有列。注意，匹配的是\
