  \        clipShape.append(outline, false);\n\n        g2.draw(clipShape);\n    \
  \    g2.clip(clipShape);\n\n        final int NLINES = 50;\n        var p = new\
  \ Point2D.Double(0, 0);\n        for (int i = 0; i < NLINES; i++) {\n          \
  \  double x = (2 * getWidth() * i) / NLINES;\n            double y = (2 * getHeight()\
  \ * (i)) / NLINES;\n            p.setLocation(x, y);\n            g2.draw(clipShape);\n\
  \        }\n    }\n\n    public Dimension getPreferredSize() {\n        return PREFERRED_SIZE;\n\
  \    }\n}\n```\n\n### 12.7.2. 多页打印\n\n在实践中，你通常不会向打印作业传递原始的 `Printable` 对象。相反，你应该获取一个实现了\
  \ `Pageable` 接口的类对象。Java 平台提供了这样一个类，称为 `Book`。一个 `Book` 由多个部分组成，每个部分都是 `Printable`\
  \ 对象。要制作书籍，请添加 `Printable` 对象及其页数。\n\n```java\nvar book = new Book();\nPrintable\
  \ coverPage = . . .;\nPrintable bodyPages = . . .;\nbook.append(coverPage, pageFormat);\
  \ // 添加 1 页\nbook.append(bodyPages, pageFormat, pageCount);\n```\n\n然后，使用 `setPageable`\
  \ 方法将 `Book` 对象传递给打印作业。\n\n```java\nprintJob.setPageable(book);\n```\n\n\n\n\n现在打印任务确切地知道要打印多少页，因此打印对话框会显示准确的页范围，用户可以选择整个范围或子范围。\n\
  \n当打印任务调用 `Printable` 部分的 `print` 方法时，它传递的是 `book` 的当前页码，而不是每个 `section` 的页码作为当前页码。这是一个非常头疼的问题——每个\
  \ `section` 都必须知道之前章节的页数，才能使页码参数具有意义。\n\n从程序员的角度来看，使用 `Book` 类最大的挑战在于，你必须在打印时知道每个\
  \ `section` 会产生多少页。你的 `Printable` 类需要一个 `layout algorithm`（布局算法）来计算材料在打印页面上的布局。在打印开始之前，调用该算法来计算分页符和总页数。你可以保留这些布局信息，以便在打印过程中能够随取随用。\n\
  \n你必须防止用户更改了页面格式的情况。如果发生了了这种情况，即使你想要打印的内容没有变化，也必须重新计算布局。\n\nListing 12.26 显示了如何生成多页打印输出。该程序在若干页面上打印非常大字符的消息（参见图\
  \ 12.63）。然后你可以修剪边距并将页面胶在一起形成一个横幅。\n\n.图 12.63: 一个横幅\n\n`Banner` 类的 `layoutPages`\
  \ 方法计算布局。我们首先使用 72 点字体布局消息字符串。然后我们计算结果字符串的高度，并将其与页面的可打印高度进行比较。我们从这两个测量值中派出一个比例因子。在打印字符串时，我们通过该比例因子对其放大。\n\
  \n为了精确地布局你的信息，通常需要访问打印机图形上下文。遗憾的是，在打印实际开始之前没有办法获取该图形上下文。在我们的示例程序中，我们使用屏幕图形上下文，并希望屏幕和打印机的字体指标是匹配。\n\
  \n`Banner` 类的 `getPageCount` 方法首先调用布局方法。然后它放大字符串的宽度并将其除以每页的可打印宽度。商的结果向上取整到下一个整数即为页数。\n\
  \n听起来打印横幅可能很难，因为字符可能会跨越多个页面。然而，得益于 Java 2D API 的强大功能，事实证明这完全不是问题。当请求特定页面时，我们只需使用\
  \ `Graphics2D` 类的 `translate` 方法将字符串的左上角向左移动。然后，设置一个等于当前页面的裁剪矩形（参见图 12.64）。最后，使用布局方法计算出的比例因子对图形上下文进行缩放。\n\
  \n.图 12.64: 打印横幅页\n\n这个示例展示了变换的力量。绘制代码保持简单，而变换完成了所有将绘制放在适当位置的工作。最后，裁剪切掉了落在页面之外图像。该程序展示了变换的另一个引人注目的用途——显示打印预览。\n\
  \nListing12.25 v2ch12/book/BookDemoFrame.java\n\n```java\npackage v2ch12.book;\n\
  \nimport module java.desktop;\n\n/**\n * 此框架有一个用于横幅文本的文本字段，以及用于打印、页面设置和\n * 打印预览的按钮。\n\
  \ */\npublic class BookDemoFrame extends JFrame {\n    private JTextField text;\n\
