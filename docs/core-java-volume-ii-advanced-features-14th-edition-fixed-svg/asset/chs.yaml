  \"\");\n        for (int i = 0; i < str.length(); i++) {\n            char ch =\
  \ str.charAt(i);\n            String replacement = replacements.get(ch);\n     \
  \       if (replacement == null)\n                result.append(ch);\n         \
  \   else\n                result.append(replacement);\n        }\n        result.append(\"\
  \\\"\");\n        return result;\n    }\n}\n```\n\n`java.net.http.HttpClient` 11\n\
