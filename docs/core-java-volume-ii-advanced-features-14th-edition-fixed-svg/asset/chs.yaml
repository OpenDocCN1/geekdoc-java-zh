  \ new Line2D.Double(startX, startY, endX, endY);\n```\n\n列表 10.3 中的程序绘制了一个矩形、一个包含在矩形内的椭圆、矩形的对角线，以及一个与矩形中心相同的圆。图\
  \ 10.8 显示了结果。\n\n![Figure](img/drawtest.jpg)图 10.8: 绘制几何形状列表 10.3 v2ch10/draw/DrawDemo.java\n\
