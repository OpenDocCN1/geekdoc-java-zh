  \n`TreeModel` 接口只有几个方法。第一组方法允许 `JTree` 通过首先获取根节点，然后获取子节点来查找树节点。`JTree` 类仅在用户实际展开节点时才会调用这些方法。\n\
  \n```\nObject getRoot()\nint getChildCount(Object parent)\nObject getChild(Object\
  \ parent, int index)\n```\n\n这个示例展示了了为什么 `TreeModel` 接口和 `JTree` 类本身一样，不需要显式的节点概念。根节点及其子节点可以是任何对象。`TreeModel`\
  \ 负责告诉 `JTree` 是如何连接的。\n\n`TreeModel` 接口的下一个方法是 `getChild` 的反向操作：\n\n```\nint getIndexOfChild(Object\
