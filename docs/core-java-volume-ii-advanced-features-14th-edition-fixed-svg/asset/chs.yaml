  \    }\n\n    private static Map<Character, String> replacements = Map.of('\\b',\
  \ \"\\\\b\", '\\f', \"\\\\f\", '\\n',\n            \"\\\\n\", '\\r', \"\\\\r\",\
  \ '\\t', \"\\\\t\", '\"', \"\\\\\\\"\", '\\\\', \"\\\\\\\\\");\n\n    private static\
