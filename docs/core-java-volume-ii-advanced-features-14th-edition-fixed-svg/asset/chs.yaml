  \n语言区域名称使用默认区域的排序器按排序顺序显示。如果你用美国英语语言区域运行此程序，请注意“Norwegian (Norway,Nynorsk)”在“Norwegian\
  \ (Norway)”之前。标准的字符串比较会反转这个顺序，因为逗号字符的 Unicode 值大于右括号的 Unicode 值。\n\n### 7.5.1 格式化和日期\n\
  \n这是一个开始，但并不完美。我们不希望显示“12:00 AM”时间，并且我们希望以货币格式打印金额。我们实现这一目标是通过为某些占位符提供可选格式：\n\n\
  ```\n\"On {2,date,long}, a {0} destroyed {1} houses and caused {3,number,currency}\
  \ of damage.\"\n```\n\n此示例代码输出：\n\n```\nOn January 1, 1999,一场飓摧毁了 99 栋房屋并造成了 $100,000,000\
  \ 的损失。\n```\n\n通常，占位符索引后面可以跟一个*类型*和一个*样式*。用逗号分隔索引、类型和样式。类型可以是以下任意之一：\n\n```\nnumber\n\
  time\ndate\nchoice\n```\n\n如果类型是 `number`，则样式可以是\n\n```\ninteger\ncurrency\npercent\n\
  ```\n\n或者是一个 `DecimalFormat` 模式，如 `$,##0`——参见第 7.2.2 节](#index.xhtml_decimalformat)可能的格式。\n\
  \n如果类型是 `time` 或 `date`，则样式可以是：\n\n```\nshort\nmedium\nlong\nfull\n```\n\n或者是日期格式模式，如\
  \ `yyyy-MM-dd`。（请参见 `SimpleDateFormat` 类的文档获取可能的格式。）\n\n要在消息格式字符串中包含大括号，用单引号将其括起来，例如：`\"\
  A {0} 被包含在 '{' 和 '}' 符号之间\"`。对于文本，使用弯单引号最佳：`\"{0}’ 最喜欢的符号是大括号\"`。但如果你必须使用直单引号，则需要将其双倍：\n\
  \n```\nString template = \"<a href=''{0}''>{1}</a>\";\n```\n\n\n\n\n静态 `MessageFormat.format`\
  \ 方法使用当前本地化来格式化值。要使用任意本地化进行格式化，你需要多花努力，因为没有你可以使用的“可变参数”方法。你需要将要格式化的值放入一个 `Object[]`\
  \ 数组中，如下：\n\n```\nvar formatter = new MessageFormat(pattern, locale);\nString message\
  \ = formatter.format(new Object[] { values });\n```\n\n`java.text.MessageFormat`\
  \ 1.1\n\n*   `MessageFormat(String pattern)`\n*   `MessageFormat(String pattern,\
  \ Locale locale)`\n    使用指定的模式和本地化构造一个消息格式对象。\n\n*   `void applyPattern(String pattern)`\n\
  \    将消息格式对象的模式设置为指定的模式。\n\n*   `void setLocale(Locale locale)`\n*   `Locale getLocale()`\n\
  \    设置或获取用于消息中占位符的本地化。该本地化仅用于通过调用 `applyPattern` 方法设置的后续模式。\n\n*   `static String\
  \ format(String pattern, Object... args)`\n    使用 `args[i]` 作为占位符 `{i}` 的输入来格式化模式字符串。\n\
  \n*   `StringBuffer format(Object args, StringBuffer result, FieldPosition pos)`\n\
  \    格式化此 `MessageFormat` 的模式。`args` 参数必须是一个对象数组。格式化后的字符串附加到 `result` 中并返回 `result`。如果\
  \ `pos` 等于 `new FieldPosition(MessageFormat.Field.ARGUMENT)`，它的 `beginIndex` 和 `endIndex`\
  \ 属性将被设置为替换 `{1}` 占位符文本的位置。如果你不需要位置信息，请提供 `null`。\n\n`java.text.Format` 1.1\n\n\
  *   `String format(Object obj)`\n    根据此格式化规则格式化给定对象。此方法调用 `format(obj, new StringBuffer(),\
  \ new FieldPosition(0)).toString()`。\n\n### 7.5.2. 选择格式 (Choice Formats)\n\n让我们仔细观察一下上一节的模式：\n\
  \n```\n\"On {2}, a {0} destroyed {1} houses and caused {3} of damage.\"\n```\n\n\
  如果我们将灾害占位符 `{0}` 替换为 `\"earthquake\"`，句子在英语中是不符合语法的：\n\n```\nOn January 1, 1999,\
  \ a earthquake destroyed . . .\n```\n\n我们真正想做的是将冠词“a”整合到占位符中：\n\n```\n\"On {2},\
  \ {0} destroyed {1} houses and caused {3} of damage.\"\n```\n\n此时 `{0}` 将替换为 `\"\
  a hurricane\"` 或 `\"an earthquake\"`。如果消息需要翻译成一种单词性别影响冠词的语言，这将特别合适。例如，在德语中，模式将是\n\
  \n```\n\"{0} zerstörte am {2} {1} Häuser und richtete einen Schaden von {3} an.\"\
  \n```\n\n占位符将被替换为语法上正确的冠词和名词组合，例如 `\"Ein Wirbelsturm\"` 或 `\"Eine Naturkatastrophe\"\
  `。\n\n现在让我们转向 `{1}` 参数。如果灾害并不那么严重，`{1}` 可能会被替换为数字 1，消息将是：\n\n```\nOn January 1,\
  \ 1999, a mudslide destroyed 1 houses and . . .\n```\n\n理想情况下，我们希望消息根据占位符的值而变化，使其读变为：\n\
  \n```\nno houses\none house\n2 houses\n. . .\n```\n\n取决于占位符的值。`choice` 格式化选项正是为此设计的。\n\
  \n选择格式是一系列对，每对包含：\n\n*   一个下限\n*   一个格式字符串\n\n下限和格式字符串由 `#` 字符分隔，对与对之间由 `|` 字符分隔。\n\
  \n例如，\n\n```\n{1,choice,0#no houses|1#one house|2#{1} houses}\n```\n\n表 7.10 显示了此格式字符串对于各种\
  \ `{1}` 值的效果。\n\n表 7.10：由选择格式格式化的字符串\n\n| `{1}` | 结果 | `{1}` | 结果 |\n| --- | ---\
  \ | --- | --- |\n| `0` | `\"no houses\"` | `3` | `\"3 houses\"` |\n| `1` | `\"one\
  \ house\"` | `-1` | `\"no houses\"` |\n\n为什么我们在格式字符串中使用两次 `{1}`？当消息格式对 `{1}` 占位符应用选择格式且值为\
  \ `2` 时，选择格式返回 `\"{1} houses\"`。该字符串然后由消息格式再次格式化，答案被拼接到结果中。\n\n这个例子说明选择格式的设计者有点不可糊涂。如果你有三个格式字符串，你需要两个界限来分隔它们。通常情况下，需要的界限比格式字符串的数量少一个。正如你在表\
  \ 7.10 中看到的，`MessageFormat` 类忽略了第一个界限。\n\n如果该类的设计者意识到界限应该位于选项之间，语法将会清晰得多，例如：\n\n\
  ```\nno houses|1|one house|2|{1} houses // true 实际格式\n```\n\n你可以使用 `<` 符号表示，如果下限严格小于值，则应选择该选项。\n\
  \n\n\n\n\n为了猜测用户偏好的编码，可以使用源自执行 Java 虚拟机的系统“原生编码”（native encoding）。从 Java 18 开始，它的名称是系统属性\
  \ `native.encoding` 的值。\n\n在 Java 18 之前，原生编码是默认字符集，你可以通过静态方法 `Charset.defaultCharset()`\
  \ 来获取它。\n\n### 7.7.2. 行结束符\n\n这不是区域化的问题，而是平台的问题。在 Windows 上，文本文件预计在每行行末尾使用 `\\r\\\
  n`，而基于 UNIX 的系统只需要一个 `\\n` 字符。如今，大多数 Windows 程序可以仅处理 `\\n`，但旧的程序和控制台可能会给你的用户带来困扰。\n\
  \n使用 `println` 方法写入的任何行都会被正确终止。唯一的问题是你打印了包含 `\\n` 字符的字符串。这些字符不会被自动修改为平台的行结束符。\n\n\
  与其在字符串中使用 `\\n`，不如使用 `printf` 和 `%n` 格式说明符来产生依赖于平台的行结束符。例如，\n\n```\nout.printf(\"\
  Hello%nWorld%n\");\n```\n\n在 Windows 上会产生\n\n```\nHello\\r\\nWorld\\r\\n\n```\n\n\
  在其他地方产生\n\n```\nHello\\nWorld\\n\n```\n\n### 7.7.3. 控制台\n\n如果你编写了通过 `IO`、`System.in`/`System.out`\
  \ 或 `System.console()` 与用户通信的程序，你必须面对控制台可能使用与默认字符集不同的字符编码的可能性。这在 Windows 上使用 `cmd`\
  \ 壳时尤为明显。在美版 Windows 11 中，命令外壳仍然使用过时的 `IBM437` 编码，该编码源于 1982 年的 IBM 个人电脑。`Charset.defaultCharset()`\
  \ 方法将返回 `Windows-1252` 字符集，这非常不同。例如，欧元符号 € 存在于 `Windows-1252` 中但在 `IBM437` 中不存在。当你调用\n\
  \n```\nIO.println(\"100 €\");\n```\n\n控制台将显示\n\n```\n100 ?\n```\n\n理想情况下，你的用户应该将控制台切换到\
  \ UTF-8。在 Windows 中，命令是\n\n```\nchcp 65001\n```\n\n从 Java 18 开始，这就足够让 Java 在控制台中使用\
  \ UTF-8。在之前的版本中，还有必要通过系统属性 `file.encoding` 设置平台编码：\n\n```\njava -Dfile.encoding=UTF-8\
  \ MyProgram\n```\n\n如果你无法让用户更改控制台的字符编码，你可以查出它是什么。从 Java 18 开始，系统属性 `stdout.encoding`\
  \ 和 `stderr.encoding` 为你提供了这些信息。你也可以在命令行上更改设置。\n\n你也可以调用 `System.console().charset()`，前提是\
  \ `System.console()` 不为 `null`。\n\n如果你从 `new Scanner(System.in)` 获取用户输入，扫描器使用的是默认字符集而不是控制台编码。如果它们不匹配，这对于键盘输入将无效。如果\
  \ `System.console()` 不为 `null`，请使用 `new Scanner(System.console().reader())` 代替。\n\
  \n### 7.7.4. UTF-8 字节顺序标记 (BOM)\n\n如前提到的，当可能为文本文件使用 UTF-8 是一个好主意。然而，如果你的应用程序必须读取其他程序创建的\
  \ UTF-8 文本文件，就会遇到另一个潜在问题。将“字节顺序标记”字符 U+FEFF 作为文件的第一个字符是完全合法的。在 UTF-16 编码中，每个代码单元都是两个字节量，字节顺序标记告诉读取者文件使用的是“大端序”还是“小端序”字节序。UTF-8\
  \ 是单字节编码，因此没有需要指定字节序。但如果文件以字节 `0xEF 0xBB 0xBF`（U+FEFF 的 UTF-8 编码）开头，这强烈地表明它使用的是\
  \ UTF-8。由于这个原因，Unicode 标准鼓励这种做法。任何读取器都应该丢弃初始的字节顺序标记。\n\n这里只是有一个美中瑕。Oracle Java 的实现固执地拒绝遵循\
  \ Unicode 标准，理由是潜在的兼容性问题。这意味着你，作为程序员，必须做平台不愿做的事。当你读取文本文件并在开头遇到 `U+FEFF` 时，请忽略它。\n\
  \n遗憾的是，JDK 实现者并没有遵循这一建议。当你向 `javac` 编译器传递一个以字节顺序标记开头的有效 UTF-8 源文件时，编译会失败并报错错误信息“illegal\
  \ character: \\65279”。\n\n### 7.7.5. 源文件的字符编码\n\n你，作为程序员，需要与 Java 编译器进行通信——你通过本地系统上的工具做到这一点。例如，如果你使用中文或日文版的\
  \ Windows，你的 Java 源代码文件可能是用本地字符编码编码的。此类源代码文件不是可移植的。（只有编译后的类文件是可移植的——它们对标识符和字符串使用“修改\
  \ UTF-8”编码。）\n\n不可移植的源文件不是理想的。如今，配置文本编辑器和开发环境对源文件使用 UTF-8 很容易。从 Java 18 开始，`javac`\
  \ 编译器默认期望 UTF-8 编码的源文件。对于早期版本，请如下运行运行编译器：\n\n```\njavac -encoding UTF-8 MyProgram\n\
  ```\n\n要编译不是 UTF-8 的源文件，请以相同的方式指定编码。\n\n## 7.8. 资源包 (Resource Bundles)\n\n在本地化应用程序时，你可能会产生大量的消息字符串、标签等需要翻译的内容。为了使这项任务可行，你可能希望将字符串定义在外部位置，通常称为资源。\n\
  \n在 Java 中，你可以使用属性文件指定字符串资源，并可以使用类来实现其他类型的资源。\n\nJava 技术资源与 Macintosh 或 Windows\
  \ 资源不同。Macintosh 或 Windows 可执行程序将资源（如菜单、对话框、图标和消息）存储在代码之外的部分。资源编辑器可以检查并更新这些资源。\n\
  \n第 5 卷描述了 JAR 文件资源的概念，其中数据文件、声音和图像可以放在 JAR 文件。`Class` 的 `getResource` 方法找到文件、打开它并返回资源的\
  \ URL。通过将文件放入 JAR 文件，你将查找文件的工作留给了类加载器——它已经知道如何定位 JAR 文件中的项。\n\n### 7.8.1. 定位资源包\n\
  \n在本地化应用程序时，你产生一组资源包。每个包都是一个描述特定区域项（如消息、标签等）的属性文件或类。对于每个包，你必须为所有支持的区域提供版本。\n\n你需要为这些资源包使用特定的命名约定。例如，针对德国的资源进入\
  \ `baseName_de_DE` 文件，而所有德语国家共享的资源进入 `baseName_de`。通常，使用\n\n```\nbaseName_language_country\n\
  ```\n\n用于所有特定国家的资源，并使用\n\n```\nbaseName_language\n```\n\n用于所有特定语言的资源。最后作为回退，你可以将默认值放在一个没有任何后缀的文件中。\n\
  \n要加载包，请使用命令\n\n```\nResourceBundle currentResources = ResourceBundle.getBundle(baseName,\
  \ currentLocale);\n```\n\n`getBundle` 方法尝试加载匹配当前区域语言和国家的包。如果未成功，则依次放弃国家和语言。然后对默认区域进行相同的搜索，最后，查询默认包文件。即使该尝试也失败，该方法也会抛出\
  \ `MissingResourceException`。\n\n也就是说，`getBundle` 方法尝试加载以下包：\n\n\n\n\n```\nbaseName_currentLocaleLanguage_currentLocaleCountry\n\
  baseName_currentLocaleLanguage\nbaseName_defaultLocaleLanguage_defaultLocaleCountry\
  \ \nbaseName_defaultLocaleLanguage\nbaseName\n```\n\n一旦 `getBundle` 方法定位了一个包（例如，`baseName_de_DE`），它仍然会继续查找\
  \ `baseName_de` 和 `baseName`。如果这些包存在，它们将成为资源层级结构（resource hierarchy）中 `baseName_de_DE`\
  \ 包的父级（parents）。此后，在查找资源时，如果在当前包中查找未成功，则会搜索父级。也就是说，如果在 `baseName_de_DE` 中没有找到特定的资源，则也会查询\
  \ `baseName_de` 和 `baseName`。\n\n这显然是一个非常有用的服务——而且用手动编程的话将非常繁琐。Java 编程语言的资源包机制会自动定位与给定区域语言（locale）最匹配的项。向现有程序中添加越来越多的本地化是很容易的——你只需要创建额外的资源包即可。\n\
  \n如果区域语言包含脚本或变体，查找过程就会复杂得多。详细细节请参阅方法 `ResourceBundle.Control.getCandidateLocales`\
  \ 的文档。\n\n你不需要将应用程序的所有资源都放入单个包中。你可以为按钮标签准备一个包，为错误消息准备一个包，等等。\n\n### 7.8.2. 属性文件\
  \ (Property Files)\n\n字符串的国际化非常简单。你将所有字符串放入属性文件中，例如 `MyProgramStrings.properties`。这是一个简单的文本文件，每行一个键值对。一个典型文件看起来如下：\n\
  \n```\ncomputeButton=Rechnen\ncolorName=black\ndefaultPaperSize=210×297\n```\n\n\
  然后按照前一节描述的方法命名你的属性文件，例如：\n\n```\nMyProgramStrings.properties\nMyProgramStrings_en.properties\n\
  MyProgramStrings_de_DE.properties\n```\n\n你可以简单地加载包：\n\n```java\nResourceBundle\
  \ bundle = ResourceBundle.getBundle(\"MyProgramStrings\", locale);\n```\n\n要查找特定字符串，调用：\n\
  \n```java\nString computeButtonLabel = bundle.getString(\"computeButton\");\n```\n\
  \n属性文件采用 UTF-8 编码。\n\n在 Java 9 之前，存储属性的文件必须是 ASCII 文件，非 ASCII 字符必须使用 `\\uxxxx` 表示法进行编码。例如，`\"\
  colorName=Grün\"` 必须指定为：\n\n```\ncolorName=Gr\\u00FCn\n```\n\n### 7.8.3. 包类 (Bundle\
  \ Classes)\n\n为了提供不是字符串的资源，请定义扩展 `ResourceBundle` 类的类。使用标准的命名约定命名你的类，例如：\n\n```\n\
  MyProgramResources.java\nMyProgramResources_en.java\nMyProgramResources_de_DE.java\n\
  ```\n\n使用与加载属性文件相同的 `getBundle` 方法来加载该类：\n\n```java\nResourceBundle bundle = ResourceBundle.getBundle(\"\
  MyProgramResources\", locale);\n```\n\n在搜索包时，当两个包具有相同的基名称时，类中的包优先级高于属性文件。\n\n每个资源包类都实现了一个查找表。你需要实现一个查找表来检索资源。实现资源包的最简单方法是扩展\
  \ `ResourceBundle`。例如：\n\n```java\npublic class ProgramResources_de extends ResourceBundle\
  \ {\n    private final Object[][] data = {\n        {\"backgroundColor\", \"Blau\"\
  },\n        {\"paperSize\", \"210×297\"}\n    };\n    @Override\n    public Object\
  \ getObject(String key) {\n        for (Object[] pair : data) {\n            if\
  \ (key.equals(pair[0])) return pair[1];\n        }\n        return null;\n    }\n\
  \    @Override\n    public Enumeration<String> getKeys() {\n        // ... 实现\n\
  \    }\n}\n```\n\n\n\n\n图 7.5 显示了德语输出。要显示中文（如图 7.6 所示），请确保您的 Java 运行时安装并配置了中文字字体。否则，中文字符将显示为“缺失字符”图标。\n\
  \n列表 7.4 显示了简化文本版本的代码，遗憾没有颜色。列表 7.5 是英语字符串的属性文件。本地化字符串分别位于列表 7.6（德语）和列表 7.7（中文）中。\n\
  \n![Figure](img/fig05-05.jpg)图 7.5：德语版的退休计算器![Figure](img/fig05-06.jpg)图 7.6：中文版的退休计算器\n\
  \n### 列表 7.4 `v2ch07/retire2/Retire2.java`\n\n```\npackage v2ch07.retire2;\n\nimport\
  \ module java.base;\n\nimport v2ch07.util.Choices;\n\n/**\n * 此程序显示了一个退休计算器。提示信息以英语、德语或\n\
  \ * 中显示。\n */\nclass Retire2 {\n    void main() throws Exception {\n        // 获取本地区域\n\
  \        ResourceBundle bundle = ResourceBundle.getBundle(\"v2ch07.retire.RetireStrings\"\
  ,\n                Locale.getDefault());\n        IO.println(bundle.getString(\"\
  language\"));\n        Locale[] locales = { Locale.US, Locale.CHINA, Locale.GERMANY\
  \ };\n        Locale currentLocale = Choices.choose(locales, Locale::getDisplayName);\n\
  \        bundle = ResourceBundle.getBundle(\"v2ch07.retire.RetireStrings\", currentLocale);\n\
  \        NumberFormat integerFormat = NumberFormat.getIntegerInstance(currentLocale);\n\
  \        NumberFormat numberFormat = NumberFormat.getNumberInstance(currentLocale);\n\
  \n        // 提示参数\n        double savings = numberFormat.parse(\n              \
  \  IO.readln(bundle.getString(\"savings\") + \": \")).doubleValue();\n        double\
  \ contributions = numberFormat.parse(\n                IO.readln(bundle.getString(\"\
  contrib\") + \": \")).doubleValue();\n        double income = numberFormat.parse(\n\
  \                IO.readln(bundle.getString(\"income\") + \": \")).doubleValue();\n\
  \        int currentAge = integerFormat.parse(\n                IO.readln(bundle.getString(\"\
  currentAge\") + \": \")).intValue();\n        int retireAge = integerFormat.parse(\n\
  \                IO.readln(bundle.getString(\"retireAge\") + \": \")).intValue();\n\
  \        int deathAge = integerFormat.parse(\n                IO.readln(bundle.getString(\"\
  deathAge\") + \": \")).intValue();\n        double inflationPercent = numberFormat.parse(\n\
  \                IO.readln(bundle.getString(\"inflationPercent\") + \": \")).doubleValue();\n\
  \        double investPercent = numberFormat.parse(\n                IO.readln(bundle.getString(\"\
  investPercent\") + \": \")).doubleValue();\n\n        // 显示值\n        var retireMsg\
  \ = new MessageFormat(\"\");\n        retireMsg.setLocale(currentLocale);\n    \
  \    retireMsg.applyPattern(bundle.getString(\"retire\"));\n\n        double balance\
  \ = savings;\n        for (int year = currentAge; year <= deathAge; year++) {\n\
  \            Object[] msgArgs = { year, balance };\n            IO.println(retireMsg.format(msgArgs));\n\
  \            if (year < retireAge)\n                balance += contributions;\n\
  \            else\n                balance -= income;\n            balance = balance\
  \ * (1 + (investPercent - inflationPercent));\n        }\n    }\n}\n```\n\n### 列表\
  \ 7.5 `v2ch07/retire2/RetireStrings.properties`\n\n```\nlanguage=Language\ncomputeButton=Compute\n\
  savings=Prior Savings\ncontributions=Annual Contribution\nincome=Retirement Income\n\
  currentAge=Current Age\nretireAge=Retirement Age\ndeathAge=Life Expectancy\ninflationPercent=Inflation\n\
  investPercent=Investment Return\nretire=Age: {0,number} Balance: {1,number,currency}\n\
  ```\n\n### 列表 7.6 `v2ch07/retire2/RetireStrings_de.properties`\n\n```\nlanguage=Sprache\n\
  computeButton=Rechnen\nsavings=Vorherige Ersparnisse\ncontributions=Jährliche Einzahlung\n\
  income=Einkommen nach Ruhestand\ncurrentAge=Jetziges Alter\nretireAge=Ruhestandsalter\n\
  deathAge=Lebenserwartung\ninflationPercent=Inflation\ninvestPercent=Investitionsgewinn\n\
  retire=Alter: {0,number} Guthaben: {1,number,currency}\n```\n\n### 列表 7.7 `v2ch07/retire2/RetireStrings_zh.properties`\n\
  \n```\nlanguage=语言\ncomputeButton=计算\nsavings=现有\ncontributions=每年存金\nincome=退休收入\n\
  currentAge=现龄\nretireAge=退休年龄\ndeathAge=预期寿命\ninflationPercent=通货膨涨\ninvestPercent=投资报酬\n\
  retire=年龄: {0,number} 总结: {1,number,currency}\n```\n\n你已经了解了如何使用 Java 语言的国际化功能。你现在可以使用资源包（resource\
  \ bundles）提供多种语言的翻译，并使用格式化器（formatters）和排序器（collators）进行特定区域的文本处理。\n\n在下一章中，我们将深入研究脚本和编译。\n\
  \n# 第 8 章 ▪ 编译与脚本\n\n本章介绍了两种处理代码的技术。当你想要在应用程序内部编译 Java 代码时，可以使用编译器 API。脚本 API 则允许你调用如\
  \ JavaScript 或 Groovy 等脚本语言中的代码。\n\n## 8.1. 编译器 API\n\n有很多工具需要编译 Java 代码。显显然，开发环境和教授\
  \ Java 编程的程序位于其中，还包括测试和构建自动化工具。另一个例子是处理 Jakarta Server Pages（JSP）——即嵌入了 Java 语句的网页。\n\
  \n### 8.1.1. 调用编译器\n\n调用编译器非常简单。这里有一个示例调用：\n\n```\nJavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\
  OutputStream outStream = . . .;\nOutputStream errStream = . . .;\nint result = compiler.run(null,\
  \ outStream, errStream,\n    \"-sourcepath\", \"src\", \"MyProg.java\");\n```\n\n\
  `result` 值为 `0` 表示编译成功。\n\n编译器会将它的输出和错误消息发送到提供的流中。你可以将这些参数设置为 `null`，此时将使用 `System.out`\
  \ 和 `System.err`。`run` 方法的第一个参数是输入流。由于编译器不接受输入，你可以始终将其留为 `null`。（`run` 方法继承自 `javax.tools.Tool`\
  \ 接口，该接口允许读取输入的工具。）\n\n`run` 方法的剩余参数是你在命令行调用 `javac` 时传递的参数。这些可以是选项或文件名。\n\n###\
  \ 8.1.2. 启动编译任务\n\n你可以通过 `CompilationTask` 对象对编译过程进行更多控制。如果你想从字符串提供源码、在内存中捕获类文件或处理错误消息，这将有用。\n\
  \n要获取 `CompilationTask`，从上节的 `compiler` 对象开始。然后调用：\n\n```\nJavaCompiler.CompilationTask\
  \ task = compiler.getTask(\n    errorWriter, // 为 null 则使用 System.err\n    fileManager,\
  \ // 为 null 则使用标准文件管理器\n    diagnosticListener, // 为 null 则使用 System.err\n    options,\
  \ // 无选项则为 null\n    classes, // 用于注解处理；无则是 null\n    sources);\n```\n\n最后三个参数是\
  \ `Iterable` 实例。例如，一组选项可以指定为：\n\n```\nIterable<String> options = List.of(\"-d\"\
  , \"bin\");\n```\n\n`sources` 参数是 `JavaFileObject` 对象的 `Iterable`。如果你想编译磁盘文件，请获取\
  \ `StandardJavaFileManager` 并调用它的 `getJavaFileObjects` 方法：\n\n```\nStandardJavaFileManager\
  \ stdFileManager\n    = compiler.getStandardFileManager(null, null, null);\nIterable<JavaFileObject>\
  \ sources\n    = stdFileManager.getJavaFileObjectsFromStrings(List.of(\"File1.java\"\
  , \"File2.java\"));\nJavaCompiler.CompilationTask task\n    = compiler.getTask(null,\
  \ null, null, options, null, sources);\n```\n\n`classes` 参数仅用于注解处理。在这种情况下，你还需要调用\
  \ `task.processors(annotationProcessors)` 并传入 `Processor` 对象列表。参见第一卷第 11 章 的注解处理示例。\n\
  \n\n\n\n`getTask` 方法返回任务对象，但尚未启动编译过程。`CompilationTask` 类继承了 `Callable<Boolean>`。你可以将其提交给\
  \ `ExecutorService` 进行并发执行，你也可以直接进行同步调用：\n\n```\nBoolean result = task.call();\n\
  ```\n\n### 8.1.3. 捕获诊断信息\n\n若要监听错误消息，请安装一个 `DiagnosticListener`。每当编译器报告警告或错误消息时，监听器就会接收到一个\
  \ `Diagnostic` 对象。`DiagnosticCollector` 类实现了此接口。它简单地收集所有的诊断信息，以便你可以在编译完成后对其进行遍历。\n\
  \n```\nvar collector = new DiagnosticCollector<JavaFileObject>();\ncompiler.getTask(null,\
  \ fileManager, collector, null, null, sources).call();\nfor (Diagnostic<? extends\
  \ JavaFileObject> d : collector.getDiagnostics())  {\n    IO.println(d);\n}\n```\n\
  \n`Diagnostic` 对象包含有关问题位置的信息（包括文件名、行号和列号）以及一个人类可读的描述。\n\n你也可以将 `DiagnosticListener`\
  \ 安装到标准文件管理器，以防你需要捕获关于文件缺失的消息：\n\n```\nStandardJavaFileManager stdFileManager\n\
  \    = compiler.getStandardFileManager(diagnosticsListener, null, null);\n```\n\n\
  ### 8.1.4. 从内存读取源文件\n\n如果你动态生成源代码，可以让它从内存中编译，而无需将文件保存到磁盘。使用此类来持有代码：\n\n```\npublic\
  \ class StringSource extends SimpleJavaFileObject {\n    private String code;\n\n\
  \    StringSource(String name, String code) {\n        super(URI.create(\"string:///\"\
  \ + name.replace(\".\", \"/\") + \".java\"), Kind.SOURCE);\n        this.code =\
  \ code;\n    }\n\n    public CharSequence getCharContent(boolean ignoreEncodingErrors)\
  \ {\n        return code;\n    }\n}\n```\n\n然后为你的类生成代码，并给编译器提供一个 `StringSource`\
  \ 对象列表：\n\n```\nList<StringSource> sources = List.of(\n    new StringSource(className1,\
  \ class1CodeString),\n    new StringSource(className2, class2CodeString),\n    .\
  \ . .);\ntask = compiler.getTask(null, fileManager, diagnosticsListener, null, null,\
  \ sources);\n```\n\n### 8.1.5. 将字节码写入内存\n\n如果你动态编译类，则无需将类文件保存到磁盘。你可以将它们保存到内存并立即加载。\n\
  \n首先，这是一个用于持有字节的类：\n\n```\npublic class ByteArrayClass extends SimpleJavaFileObject\
  \ {\n    private ByteArrayOutputStream out;\n\n    ByteArrayClass(String name) {\n\
  \        super(URI.create(\"bytes:///\" + name.replace(\".\", \"/\") + \".class\"\
  ), Kind.CLASS);\n    }\n\n    public byte[] getCode()  {\n        return out.toByteArray();\n\
  \    }\n\n    public OutputStream openOutputStream() throws IOException {\n    \
  \    out = new ByteArrayOutputStream();\n        return out;\n    }\n}\n```\n\n\
  接下来，你需要配置文件管理器以使用这些类作为输出：\n\n```\nvar classes = new ArrayList<ByteArrayClass>();\n\
  StandardJavaFileManager stdFileManager\n    = compiler.getStandardFileManager(null,\
  \ null, null);\nJavaFileManager fileManager\n    = new ForwardingJavaFileManager<>(stdFileManager)\
  \ {\n        public JavaFileObject getJavaFileForOutput(Location location,\n   \
  \             String className, Kind kind, FileObject sibling)\n               \
  \ throws IOException {\n            if (kind == Kind.CLASS) {\n                \
  \ ByteArrayClass outfile = new ByteArrayClass(className);\n                 classes.add(outfile);\n\
  \                 return outfile;\n            }\n            else\n           \
  \      return super.getJavaFileForOutput(location, className, kind, sibling);\n\
  \        }\n    };\n```\n\n要加载这些类，你需要一个加载器（参见第 9 章）：\n\n```\npublic class ByteArrayClassLoader\
  \ extends ClassLoader {\n    private Iterable<ByteArrayClass> classes;\n\n    public\
  \ ByteArrayClassLoader(Iterable<ByteArrayClass> classes) {\n        this.classes\
  \ = classes;\n    }\n\n    public Class<?> findClass(String name) throws ClassNotFoundException\
  \ {\n        for (ByteArrayClass cl : classes) {\n            if (cl.getName().equals(\"\
  /\" + name.replace(\".\", \"/\") + \".class\")) {\n                byte[] bytes\
  \ = cl.getCode();\n                return defineClass(name, bytes, 0, bytes.length);\n\
  \            }\n        }\n        throw new ClassNotFoundException(name);\n   \
  \ }\n}\n```\n\n编译完成后，使用该类加载器调用 `Class.forName` 方法：\n\n```\nByteArrayClassLoader\
  \ loader = new ByteArrayClassLoader(classes);\nClass<?> cl = Class.forName(className,\
  \ true, loader);\n```\n\n### 8.1.6. 示例：动态 Java 代码生成\n\n在用于动态网页的 Jakarta Server Pages\
  \ (JSP) 技术中，你可以将 HTML 与 Java 代码段混合，例如：\n\n```\n<p>The current date and time is <b><%=\
  \ LocalDateTime.now() %></b>.</p>\n```\n\nJSP 引擎动态将 Java 代码编译为 servlet。在我们的示例应用程序中，我们使用了一个更简单的示例，并为非常简单的工作表格式生成代码。作者将文本、Java\
  \ 表达式（用反引号包围）和 Java 语句（用三个反引号包围）引入工作表中。`???` 表示一行输入。工作表被编译为一个 Java 类，该类打印文本和表达式的值，并执行\
  \ Java 语句。这是一个示例工作表：\n\n```\nWhat is your name?\n```\n\nString name = ???;\n\n```\n\
  How old are you?\n```\n\nint age = Integer.parseInt(???);\n\n```\nHello, `name`!\
  \ Next year, you will be `age + 1`.\n```\n\n这是一个编程笔记本（[`docs.jupyter.org/en/latest/#what-is-a-notebook`](https://docs.jupyter.org/en/latest/#what-is-a-notebook)）的极简文本版本。工作表转换为类，其\
  \ `main` 方法输出文本和表达式值。语句被原样包含。可以想象对该程序进行增强，使其像真正的编程笔记本一样显示图像和表格。\n\n`buildSource`\
  \ 方法在列表 8.1 的程序中构建这些代码并将其放入 `StringSource` 对象中。该对象被传递给 Java 编译器。\n\n如前所述，我们使用 `ForwardingJavaFileManager`\
  \ 为每个编译的类构造一个 `ByteArrayClass` 对象。这些对象捕获了编译时生成的类文件。编译后，我们使用前节中的加载器加载该类并执行其 `main`\
  \ 方法。\n\n此示例演示了如何使用内存源和类文件进行动态编译。\n\n列表 8.1 v2ch08/compiler/CompilerDemo.java\n\n\
  \n\n\n\n```java\npackage v2ch08.compiler;\n\nimport module java.base;\nimport module\
  \ java.compiler;\n\nimport javax.tools.JavaFileObject.Kind;\nimport javax.tools.ToolProvider;\n\
  \n/**\n * 此程序演示了如何在 Java 程序中编译 Java 代码。\n */\npublic class CompilerDemo {\n    void\
  \ main(String[] args) throws Exception {\n        JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\
  \n        var classFileObjects = new ArrayList<ByteArrayClass>();\n\n        var\
  \ diagnosticsListener = new DiagnosticCollector<JavaFileObject>();\n\n        JavaFileManager\
  \ fileManager \n            = compiler.getStandardFileManager(diagnosticsListener,\
  \ null, null);\n        fileManager = new ForwardingJavaFileManager<>(fileManager)\
  \ {\n            public JavaFileObject getJavaFileForOutput(Location location, String\
  \ className,\n                    Kind kind, FileObject sibling) throws IOException\
  \ {\n                if (kind == Kind.CLASS) {\n                    var fileObject\
  \ = new ByteArrayClass(className);\n                    classFileObjects.add(fileObject);\n\
  \                    return fileObject;\n                }\n                else\n\
  \                    return super.getJavaFileForOutput(location, className, kind,\
  \ sibling);\n            }\n        };\n\n        String mainClassName = \"v2ch08.compiler.Main\"\
  ;\n        String worksheetName = args.length > 0 ? args[0] : \"v2ch08/compiler/worksheet\"\
  ;\n\n        StandardJavaFileManager stdFileManager = compiler.getStandardFileManager(null,\
  \ null,\n                null);\n        var sources = new ArrayList<JavaFileObject>();\n\
  \        for (JavaFileObject file : stdFileManager.getJavaFileObjectsFromStrings(\n\
  \                List.of(mainClassName.replace(\".\", \"/\") + \".java\")))\n  \
  \          sources.add(file);\n\n        JavaFileObject source = buildSource(mainClassName,\
  \ Path.of(worksheetName));\n        JavaCompiler.CompilationTask task = compiler.getTask(null,\
  \ fileManager,\n                diagnosticsListener, null, null, List.of(source));\n\
  \        Boolean result = task.call();\n\n        for (Diagnostic<? extends JavaFileObject>\
  \ d : diagnosticsListener.getDiagnostics())\n            IO.println(d.getKind()\
  \ + \": \" + d.getMessage(null));\n        fileManager.close();\n        if (!result)\
  \ {\n            IO.println(\"Compilation failed.\");\n            System.exit(1);\n\
  \        }\n\n        var loader = new ByteArrayClassLoader(classFileObjects);\n\
  \        Class<?> mainClass = loader.loadClass(mainClassName);\n        mainClass.getMethod(\"\
  main\").invoke(null);\n    }\n\n    /**\n     * 构建实现工作单操作的类的源码。\n     * @param className\
  \ 要构建的类的类名\n     * @param worksheet 包含工作单指令的文件\n     * @return 包含在字符串构建器源码的文件对象\n\
  \     */\n    JavaFileObject buildSource(String className, Path worksheet) throws\
  \ IOException {\n        var builder = new StringBuilder();\n        int n = className.lastIndexOf(\"\
  .\");\n        if (n >= 0) {\n            String packageName = className.substring(0,\
  \ n);\n            className = className.substring(n + 1);\n            builder.append(\"\
  package \").append(packageName).append(\";\\n\\n\");\n        }\n        builder.append(\"\
  public class \").append(className).append(\" {\\n\");\n        builder.append(\"\
  public static void main() {\\n\");\n        boolean verbatim = false;\n        for\
  \ (String line : Files.readAllLines(worksheet)) {\n            if (line.equals(\"\
  ```\"))\n\n                verbatim = !verbatim;\n\n            else if (verbatim)\n\
  \n                builder.append(line.replace(\"???\", \"IO.readln()\")).append(\"\
  \\n\");\n\n            else {\n\n                String[] fragments = line.split(\"\
  `\");\n\n                for (int i = 0; i < fragments.length; i++) {\n\n      \
  \              builder.append(\"IO.print(\");\n\n                    if (i % 2 ==\
  \ 0)\n                        builder.append(\"\\\"\").append(\n               \
  \                 fragments[i].replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\"\
  , \"\\\\\\\"\"))\n                                .append(\"\\\"\");\n\n       \
  \             else\n                        builder.append(fragments[i]);\n\n  \
  \                  builder.append(\");\\n\");\n\n                }\n\n         \
  \       builder.append(\"IO.println()\\n;\");\n\n            }\n\n        }\n\n\
  \        builder.append(\"} }\\n\");\n\n        return new StringSource(className,\
  \ builder.toString());\n\n    }\n\n}\n```\n\n\n\n\n### `javax.tools.Tool6`\n\n*\
  \ `int run(InputStream in, OutputStream out, OutputStream err, String... arguments)`\n\
  \  使用给定的输入、输出、错误流以及给定参数运行工具。成功返回 `0`，失败返回非零值。\n\n### `javax.tools.JavaCompiler6`\n\
  \n* `StandardJavaFileManager getStandardFileManager(DiagnosticListener<? super JavaFileObject>\
  \ diagnosticListener, Locale locale, Charset charset)`\n  获取此编译器的标准文件管理器。你可以为默认错误报告、区域和字符集提供\
  \ `null`。\n\n* `JavaCompiler.CompilationTask getTask(Writer out, JavaFileManager\
  \ fileManager, DiagnosticListener<? super JavaFileObject> diagnosticListener, Iterable<String>\
  \ options, Iterable<String> classesForAnnotationProcessing, Iterable<? extends JavaFileObject>\
  \ sourceFiles)`\n  获取一个编译任务，调用该任务将编译给定的源文件。详情请参见前一节的讨论。\n\n### `javax.tools.StandardJavaFileManager6`\n\
  \n* `Iterable<? extends JavaFileObject> getJavaFileObjectsFromStrings(Iterable<String>\
  \ fileNames)`\n\n* `Iterable<? extends JavaFileObject> getJavaFileObjectsFromPaths(Collection<?\
  \ extends Path> paths)`13\n\n* `Iterable<? extends JavaFileObject> getJavaFileObjectsFromFiles(Iterable<?\
  \ extends File> files)`\n  将文件名序列或文件序列转换为 `JavaFileObject` 实例序列。\n\n### `javax.tools.JavaCompiler.CompilationTask6`\n\
  \n* `Boolean call()`\n  执行编译任务。\n\n### `javax.tools.DiagnosticCollector<S>`6\n\n\
  * `DiagnosticCollector()`\n  构造一个空的收集器。\n\n* `List<Diagnostic<? extends S>> getDiagnostics()`\n\
  \  获取收集到的诊断信息。\n\n### `javax.tools.Diagnostic<S>`6\n\n* `S getSource()`\n  获取与此诊断信息相关的源对象。\n\
  \n* `Diagnostic.Kind getKind()`\n  获取此诊断信息的类型——`ERROR`、`WARNING`、`MANDATORY_WARNING`、`NOTE`\
  \ 或 `OTHER` 之一。\n\n* `String getMessage(Locale locale)`\n  获取描述此诊断信息中提出的问题消息。传递\
  \ `null` 则使用默认区域。\n\n* `long getLineNumber()`\n\n* `long getColumnNumber()`\n  获取此诊断信息中提出的问题的位置。\n\
  \n### `javax.tools.SimpleJavaFileObject`6\n\n* `CharSequence getCharContent(boolean\
  \ ignoreEncodingErrors)`\n  对于代表源文件并产生源代码的文件对象，请重写此方法。\n\n* `OutputStream openOutputStream()`\n\
  \  对于代表类文件的对象，请重写此方法以产生一个可以写入字节码的流。\n\n### `javax.tools.ForwardingJavaFileManager<M\
  \ extends JavaFileManager>`6\n\n* `protected ForwardingJavaFileManager(M fileManager)`\n\
  \  构造一个将所有调用委托给给定文件管理器的 `JavaFileManager`。\n\n* `FileObject getJavaFileForOutput(JavaFileManager.Location\
  \ location, String className, JavaFileObject.Kind kind, FileObject sibling)`\n \
  \ 如果你想用一个文件对象来写入类文件，请拦截此调用；`kind` 是 `SOURCE`、`CLASS`、`HTML` 或 `OTHER` 之一。\n\n##\
  \ 8.2. Java 平台的脚本化编程\n\n脚本语言是一种通过在运行时解释程序文本来避免通常的编辑/编译/链接/运行循环的语言。脚本语言具有许多优势：\n\n\
  * 快速迭代，鼓励实验\n* 改变正在运行程序的行为\n* 允许用户进行自定义\n\n另一方面，大多数脚本语言缺乏有利于编写复杂应用程序的特性，例如强类型、封装和模块化。\n\
  \n因此，将脚本语言和传统语言的优势结合是非常人的。脚本 API 允许你在 Java 平台上来实现。它允许从 Java 程序调用用 JavaScript、Groovy、Ruby\
  \ 甚至 Scheme 和 Haskell 等特殊语言编写的脚本。例如，Renjin 项目 ([`www.renjin.org`](https://www.renjin.org))\
  \ 提供了 R 编程语言的 Java 实现，以及脚本 API 的“引擎”。\n\n在寻找喜喜语言的兼容实现时，请搜索 JSR 223 支持。（Java 规范请求\
  \ 223 在集成到 Java 之前开发了脚本 API。）\n\nJMeter 性能分析工具 ([`jmeter.apache.org/`](https://jmeter.apache.org/))\
  \ 是一个允许用户用支持 Java 脚本的任何语言编写脚本的示例。Maven 构建工具有一个插件 ([`maven.apache.org/plugins/maven-scripting-plugin/index.html`](https://maven.apache.org/plugins/maven-scripting-plugin/index.html))\
  \ 用于用任何带有 Java 脚本引擎的语言编写构建步骤。\n\n在后续章节中，我将向你展示如何为特定语言选择引擎、如何执行脚本以及如何利用某些脚本引擎提供的高级功能。\n\
  \n### 8.2.1. 获取脚本引擎\n\n脚本引擎是一个可以执行特定语言脚本的库。当虚拟机启动时，它会发现这些脚本引擎。要列出它们，构造一个 `ScriptEngineManager`\
  \ 并调用 `getEngineFactories` 方法。你可以询问每个引擎工厂以支持的引擎名称、MIME 类型和文件扩展名。表 8.1 显示了典型值。\n\n\
  本章中的示例使用了 Rhino 脚本引擎，地址位于 [`github.com/mozilla/rhino`](https://github.com/mozilla/rhino)，它实现了一个旧版本的\
  \ JavaScript。\n\n表 8.1: 脚本引擎的属性\n\n| 引擎 | 名称 | MIME 类型 | 扩展名 |\n| --- | --- | ---\
  \ | --- |\n| Rhino (JavaScript) | rhino, JavaScript, javascript | `application/javascript`,\
  \ `application/ecmascript`, `text/javascript`, `text/ecmascript` | `js` |\n| Groovy\
  \ | groovy | None | `groovy` |\n| Renjin | Renjin | `text/x-R` | `R` |\n\n通常情况下，你知道需要哪个引擎，只需通过名称、MIME\
  \ 类型或扩展名请求它即可。例如：\n\n```\nvar manager = new ScriptEngineManager();\nScriptEngine\
  \ engine = manager.getEngineByName(\"rhino\");\n```\n\n你需要在类路径上提供实现脚本引擎的 JAR 文件。Oracle\
  \ JDK 曾经包含一个名为 Nashorn 的 JavaScript 引擎，但它在 Java 15 中已被移除。作为一个独立项目 [`github.com/openjdk/nashorn`](https://github.com/openjdk/nashorn)可用。\n\
  \n`javax.script.ScriptEngineManager`6\n\n* `List<ScriptEngineFactory> getEngineFactories()`\n\
  \  获取所有发现的引擎工厂列表。\n\n* `ScriptEngine getEngineByName(String name)`\n* `ScriptEngine\
  \ getEngineByExtension(String extension)`\n* `getEngineByMimeType(String mimeType)`\n\
  \  根据给定的名称、脚本文件扩展名或 MIME 类型获取脚本引擎。\n\n`javax.script.ScriptEngineFactory`6\n\n* `List<String>\
  \ getNames()`\n* `List<String> getExtensions()`\n* `List<String> getMimeTypes()`\n\
  \  获取该工厂已知的名称、脚本文件扩展名和 MIME 类型。\n\n### 8.2.2. 脚本评估与绑定\n\n一旦你有了引擎，只需通过调用即可执行脚本：\n\
  \n```\nObject result = engine.eval(scriptString);\n```\n\n如果脚本存储在文件中，打开一个 `Reader`\
  \ 并调用\n\n```\nObject result = engine.eval(reader);\n```\n\n你可以在同一个引擎上调用多个脚本。如果一个脚本定义了变量、函数或类，大多数脚本引擎会保留这些定义以供以后使用。例如，\n\
  \n```\nengine.eval(\"n = 1728\");\nObject result = engine.eval(\"n + 1\");\n```\n\
  \n将返回 `1729`。\n\n要确定在多线程中并发执行脚本是否安全的，请调用\n\n```\nObject param = factory.getParameter(\"\
  THREADING\");\n```\n\n\n\n\n返回值是以下内容之一：\n\n- `null`：并发执行是不安全的。\n- `\"MULTITHREADED\"\
  `：并发执行是安全的。一个线程的影响可能对另一个线程可见。\n- `\"THREAD-ISOLATED\"`：除了 `\"MULTITHREADED\"` 之外，每个线程还维护了不同的变量绑定。\n\
  - `\"STATELESS\"`：除了 `\"THREAD-ISOLATED\"` 之外，脚本不会更改变量绑定。\n\n你通常可能想向引擎添加变量绑定。一个绑定由一个名称和一个关联的\
  \ Java 对象组成。例如，以下语句：\n\n```\nengine.put(\"k\", 1728);\nObject result = engine.eval(\"\
  k + 1\");\n```\n\n脚本代码从“引擎作用域”（engine scope）中的绑定读取 `k` 的定义。这特别重要，因为大多数脚本语言都可以访问\
  \ Java 对象，且语法通常比 Java 语法更简单。例如，\n\n```\nengine.put(\"d\", LocalDate.now());\nObject\
  \ result = engine.eval(\"d.month\"); // 调用 getMonth\n```\n\n相反，你可以检索由脚本语句绑定的变量：\n\
  \n```\nengine.eval(\"n = 1728\");\nObject result = engine.get(\"n\");\n```\n\n除了引擎作用域外，还有一个全局作用域。你添加到\
  \ `ScriptEngineManager` 的任何绑定对所有引擎都是可见的。\n\n与其将绑定添加到引擎或全局作用域，你可以将它们收集在一个 `Bindings`\
  \ 类型的对象中，并将其传递给 `eval` 方法：\n\n```\nBindings scope = engine.createBindings();\nscope.put(\"\
  d\", LocalDate.now());\nengine.eval(scriptString, scope);\n```\n\n如果一组绑定不应该在未来的\
  \ `eval` 方法调用中持续存在，这种方法就很有用。\n\n你可能希望拥有引擎和全局作用域之外的作用域。例如，Web 容器可能需要请求作用域和会话作用域。然而，你需要自己负责。你需要编写一个实现\
  \ `ScriptContext` 接口的类，来管理作用域集合。每个作用域由一个整数标识，应该先搜索数字较小的作用域。（标准库提供了一个 `SimpleScriptContext`\
  \ 类，但它只持有全局和引擎作用域。）\n\n### `..script.ScriptEngine`\n\n- `Object eval(String script)`\n\
  - `Object eval(Reader reader)`\n- `Object eval(String script, Bindings bindings)`\n\
  - `Object eval(Reader reader, Bindings bindings)`\n    根据字符串或 reader 执行脚本，并受给定的绑定。\n\
  - `Object get(String key)`\n- `void put(String key, Object value)`\n    在引擎作用域中获取或放置绑定。\n\
  - `Bindings createBindings()`\n    创建一个适用于此引擎的空 `Bindings` 对象。\n\n### `javax.script.ScriptEngineManager`\n\
  \n- `Object get(String key)`\n- `void put(String key, Object value)`\n    在全局作用域中获取或放置绑定。\n\
  \n### `javax.script.Bindings`\n\n- `Object get(String key)`\n- `void put(String\
  \ key, Object value)`\n    向此 `Bindings` 对象代表的作用域获取或放置绑定。\n\n### 8.2.3. 重定向输入和输出\n\
  \n你可以通过调用脚本上下文的 `setReader` 和 `setWriter` 方法来重定向脚本的标准输入和输出。例如，\n\n```\nvar writer\
  \ = new StringWriter();\nengine.getContext().setWriter(new PrintWriter(writer, true));\n\
  ```\n\n任何使用 JavaScript 的 `print` 或 `println` 函数写入的输出都会发送到 `writer`。\n\n`setReader`\
  \ 和 `setWriter` 方法只影响脚本引擎的标准输入和输出源。例如，如果你执行 JavaScript 代码\n\n```javascript\nprintln(\"\
  Hello\");\njava.lang.System.out.println(\"World\");\n```\n\n只有第一个输出被重定向了。\n\nRhino\
  \ 引擎没有标准输入的概念。调用 `setReader` 没有效果。\n\n### `javax.script.ScriptEngine`\n\n- `ScriptContext\
  \ getContext()`\n    获取此引擎的默认脚本上下文。\n\n### `javax.script.ScriptContext`\n\n- `Reader\
  \ getReader()`\n- `void setReader(Reader reader)`\n- `Writer getWriter()`\n- `void\
  \ setWriter(Writer writer)`\n- `Writer getErrorWriter()`\n- `void setErrorWriter(Writer\
  \ writer)`\n    获取或设置用于输入的 reader 或用于正常或错误输出的 writer。\n\n### 8.2.4. 调用脚本函数和方法\n\n\
  对于某些脚本引擎，你可以直接在 Java 代码中调用脚本语言函数，而无需评估执行该调用的脚本代码段。如果你允许用户使用他们选择的脚本语言实现服务，以便你可以从\
  \ Java 调用它，那么这将非常用。\n\n提供此功能的脚本引擎实现了 `Invocable` 接口。特别是，Rhino 引擎实现了 `Invocable`。\n\
  \n要调用函数，请调用 `invokeFunction` 方法并传入函数名以及函数参数：\n\n```javascript\n// 在 JavaScript 中定义\
  \ greet 函数\nengine.eval(\"function greet(how, whom) { return how + ', ' + whom +\
  \ '!' }\");\n// 使用参数 \"Hello\", \"World\" 调用函数\nresult = ((Invocable) engine).invokeFunction(\"\
  greet\", \"Hello\", \"World\");\n```\n\n如果脚本语言是面向对象的，调用 `invokeMethod`：\n\n```javascript\n\
  // 在 JavaScript 中定义 Greeter 类\nengine.eval(\"\"\"\nfunction Greeter(how) { this.how\
  \ = how }\nGreeter.prototype.welcome =\n    function (whom) { return this.how +\
  \ ', ' + whom + '!' }\n\"\"\");\n// 实例化\nObject yo = engine.eval(\"new Greeter('Yo')\"\
  );\n// 在实例上调用 welcome 方法\nresult = ((Invocable) engine).invokeMethod(yo, \"World\"\
  );\n```\n\nRhino 不支持现代 JavaScript 类语法。有关如何用老办法在 JavaScript 中定义类的更多信息，请参阅 Douglas\
  \ Crockford (2008) 的 *JavaScript—The Good Parts*。\n\n如果脚本引擎没有实现 `Invocable` 接口，你可能仍然能够独立语言的方式调用方法。`ScriptEngineFactory`\
  \ 接口的 `getMethodCallSyntax` 方法可以生成一个你可以传递给 `eval` 方法的字符串。然而，对于这一点，所有方法参数必须绑定名称，而\
  \ `invokeMethod` 可以使用任意值调用。\n\n你可以更进一步要求脚本引擎实现一个 Java 接口。然后你就可以使用 Java 方法调用语法调用脚本函数和方法。\n\
  \n细节取决于脚本引擎，但通常你需要为接口的每个方法提供一个函数。例如，考虑一个 Java 接口\n\n```java\npublic interface Greeter\
  \ {\n    String welcome(String whom);\n}\n```\n\n如果你在 Rhino 中定义了一个同名的全局函数，你可以通过此接口调用它：\n\
  \n```javascript\n// 在 JavaScript 中定义 welcome 函数\nengine.eval(\"function welcome(whom)\
  \ { return 'Hello, ' + whom + '!' }\");\n// 获取 Java 对象并调用 Java 方法\nGreeter g = ((Invocable)\
  \ engine).getInterface(Greeter.class);\nresult = g.welcome(\"World\");\n```\n\n\
  在面向对象的脚本语言中，你可以通过匹配的 Java 接口访问脚本类。例如，这里是使用 Java 语法调用 JavaScript `Greeter` 类对象的方法：\n\
  \n```java\nGreeter g = ((Invocable) engine).getInterface(yo, Greeter.class);\nresult\
  \ = g.welcome(\"World\");\n```\n\n\n\n总结来说，如果你想从 Java 调用脚本代码，而不必担心脚本语言的语法，`Invocable`\
  \ 接口就会非常有用。\n\n`javax.script.Invocable`\n\n*   `Object invokeFunction(String name,\
  \ Object... args)`\n*   `Object invokeMethod(Object thiz, String name, Object...\
  \ args)`\n    使用给定的名称和给定的参数调用该函数或方法。\n\n*   `<T> T getInterface(Class<T> clasz)`\n\
  \    返回给定接口的实现类，通过脚本引擎中的函数来实现这些方法。\n\n*   `<T> T getInterface(Object thiz, Class<T>\
  \ clasz)`\n    返回给定接口的实现类，通过给定对象的方法来实现这些方法。\n\n### 8.2.5. 编译脚本\n\n某些脚本引擎可以将脚本代码编译为中间形式以便进行高效执行。这些引擎实现了\
  \ `Compilable` 接口。下面的示例展示了如何编译并评估包含在脚本文件中的代码：\n\n```\nif (engine instanceof Compilable\
  \ compilableEngine) {\n    Reader reader = Files.newBufferedReader(path);\n    CompiledScript\
  \ script = compilableEngine.compile(reader);\n    script.eval();\n}\n```\n\n当然，只有当你需要重复执行脚本时，编译它才有意义。\n\
  \n`javax.script.Compilable`\n\n*   `CompiledScript compile(String script)`\n*  \
  \ `CompiledScript compile(Reader reader)`\n    通过字符串或 reader 编译指定的脚本。\n\n`javax.script.CompiledScript`\n\
  \n*   `Object eval()`\n*   `Object eval(Bindings bindings)`\n    评估此脚本。\n\n### 8.2.6.\
  \ 示例：脚本表（Script Sheets）\n\n查看列表 8.2 中的程序，它执行的表格格式与第 8.1.6 节 中的示例相同。然而，这次代码是用脚本语言编写的，并在程序运行时进行评估。\n\
  \n类路径中必须包含一个脚本引擎。请从 https://mvnrepository.com/artifact/org.mozilla/rhino 和 https://mvnrepository.com/artifact/org.mozilla/rhino-engine\
  \ 下载 Rhino 和 Rhino 引擎 JAR 包，并将它们放入 `jars` 目录中。像如下所示启动程序：\n\n```\njava -classpath\
  \ .:v2ch08/script/rhino-1.7.14.jar:v2ch08/script/rhino-engine-1.7.14.jar \\\n  \
  \  v2ch08/script/ScriptDemo.java rhino v2ch08/script/worksheet\n```\n\n列表 8.2 `v2ch08/script/ScriptDemo.java`\n\
  \n```\npackage v2ch08.script;\n\nimport module java.base;\nimport module java.scripting;\n\
  \n/**\n * 此程序演示了 Java 脚本引擎。\n */\nclass ScriptDemo {\n    void main(String[] args)\
  \ throws Exception {\n        var manager = new ScriptEngineManager();\n       \
  \ String language;\n\n        if (args.length == 0) {\n            IO.println(\"\
  Available factories: \");\n            for (ScriptEngineFactory factory : manager.getEngineFactories())\n\
  \                IO.println(factory.getEngineName());\n            return;\n   \
  \     }\n        else\n            language = args[0];\n\n        ScriptEngine engine\
  \ = manager.getEngineByName(language);\n        if (engine == null) {\n        \
  \    System.err.println(\"No engine for \" + language);\n            System.exit(1);\n\
  \        }\n\n        String sheetName = args[1];\n        boolean verbatim = false;\n\
  \        var verbatimCode = new StringBuilder();\n\n        for (String line : Files.readAllLines(Path.of(sheetName)))\
  \ {\n            if (line.equals(\"```\")) {\n                verbatim = !verbatim;\n\
  \                if (!verbatim) {\n                    engine.eval(verbatimCode.toString());\n\
  \                    verbatimCode.delete(0, verbatimCode.length());\n          \
  \      }\n            }\n            else if (verbatim)\n                verbatimCode.append(line).append(\"\
  \\n\");\n            else {\n                String[] fragments = line.split(\"\
  `\");\n                for (int i = 0; i < fragments.length; i++) {\n          \
  \          IO.print(i % 2 == 0 ? fragments[i] : engine.eval(fragments[i]));\n  \
  \              }\n                IO.println();\n            }\n        }\n    }\n\
  }\n```\n\n列表 8.3 `v2ch08/script/worksheet`\n\n```\nvar name = java.lang.IO.readln(\"\
  What is your name? \");\nvar age = 1 * java.lang.IO.readln(\"How old are you? \"\
  );\n```\nHello, `name`! Next year, you will be `age + 1`.\n```\n\n# 第 9 章 ▪ 安全\n\
  \n当 Java 技术首次出现时，人们兴奋的焦点并不是一个精巧的设计，而是能够安全地运行通过网络传输的 applet。安全一直是 Java 设计者和用户关注的焦点，这意味着确保代码不会对他们的机器造成破坏。与其他语言相比，Java\
  \ 的安全机制是不可或缺的一部分。\n\n安全架构由三部分组成：\n\n1.  语言特性（数组边界检查、未检查类型转换等）。\n2.  安全管理器，控制代码的操作（文件访问、网络访问）。\n\
  3.  代码签名，通过标准加密算法对代码进行验证并确保其未被篡改。\n\n第一部分取得了巨大的成功。然而，另外两部分表现不佳。安全管理器非常复杂且存在巨大的攻击面，它在\
  \ Java 17 中已被废弃。代码签名也随着 applet 和 Java Web Start 等客户端机制的终结而作废。\n\n在本书之前的版本中，安全管理器和代码签名是本章的重点，但显然这些需求已经消失。我们将首先讨论在加载时检查类文件完整性的加载器。我将演示这种机制如何检测篡改。然后，你将学习用于许多安全操作的认证框架和加密算法。\n\
  \n## 9.1 类加载器\n\nJava 编译器将源码转换为虚拟机代码。虚拟机代码存储在扩展名为 `.class` 的类文件中。每个类文件包含一个类或接口的定义和实现代码。在下一节中，你将看到虚拟机如何加载这些文件。\n\
  \n### 9.1.1 类加载过程\n\n虚拟机只加载执行程序所需的类文件。例如，假设执行从 `MyProgram` 开始。虚拟机执行以下步骤：\n\n1. \
  \ 虚拟机具有加载类文件的机制——例如从磁盘读取文件或从 Web 请求；它使用该机制加载 `MyProgram` 类的内容。\n2.  如果 `MyProgram`\
  \ 类具有其他类型的字段或父类，它们的类文件也将加载。（加载一个类所依赖的所有类的过程被称为*解析*该类。）\n3.  随后虚拟机执行 `MyProgram`\
  \ 中的 `main` 方法。\n4.  如果 `main` 方法或 `main` 调的方法需要额外的类，这些类将被加载。\n\n然而，类加载机制并不只使用单个类加载器。每个\
  \ Java 程序至少包含三个类加载器：\n\n*   启动类加载器（Bootstrap class loader）\n*   平台类加载器（Platform\
  \ class loader）\n*   系统类加载器（System class loader，也称为应用加载器）\n\n\n\n\n启动类加载器（bootstrap\
  \ class loader）加载模块中包含的平台类：\n\n```\njava.base\njava.datatransfer\njava.desktop\n\
  java.instrument\njava.logging\njava.management\njava.management.rmi\njava.naming\n\
  java.prefs\njava.rmi\njava.security.sasl\njava.xml\n```\n\n以及许多 JDK 内部模块。\n\n不存在与启动类加载器相对应的\
  \ `ClassLoader` 对象。例如：\n\n```\nStringBuilder.class.getClassLoader()\n```\n\n返回 `null`。\n\
  \n在 Java 9 之前，Java 平台类位于一个名为 `rt.jar` 的文件中。如今，Java 平台是模块化的，每个平台模块都包含在一个 `JMOD` 文件中（请参阅第一卷第\
  \ 9 章）。平台类加载器负责加载所有未被启动类加载器加载的 Java 平台类。\n\n系统类加载器（system class loader）从模块路径（module\
  \ path）和类路径（class path）加载应用程序类。\n\n在 Java 9 之前，“扩展类加载器”（extension class loader）从\
  \ `jre/lib/ext` 目录加载“标准扩展”，并且一种“被认可的标准覆盖”（endorsed standards override）机制提供了一种用新版本覆盖某些平台类（包括\
  \ CORBA 和 XML 实现）的方法。这两种机制均已被移除。\n\n### 9.1.2. 类加载器层级结构\n\n类加载器之间存在`父/子`关系。除了启动类加载器外，每个类加载器都有一个父类加载器。类加载器会给父类机会去加载任何指定的类，只有当父类加载失败时，它才会加载。例如，当要求系统类加载器加载平台类（例如\
  \ `java.lang.StringBuilder`）时，它首先询问平台类加载器。该类加载器首先询问启动类加载器。启动类加载器找到并加载了该类，因此其他类加载器都不会再继续搜索。\n\
  \n某些程序具有插件架构，其中代码的某些部分封装为可选插件。如果插件被封装为 JAR 文件，你只需使用 `URLClassLoader` 实例来加载插件类。\n\
  \n```\nvar url = new URL(\"file:///path/to/plugin.jar\");\nvar pluginLoader = new\
  \ URLClassLoader(new URL[] { url });\nClass<?> cl = pluginLoader.loadClass(\"mypackage.MyClass\"\
  );\n```\n\n由于 `URLClassLoader` 构造函数中没有指定父类，因此 `pluginLoader` 的父类是系统类加载器。图 9.1 显示了该层级结构。\n\
  \n图 9.1：类加载器层级结构\n\n在 Java 9 之前，系统类加载器是 `URLClassLoader` 的实例。某些程序员使用强制转换来访问 `getURLs`\
  \ 方法，或者通过反射调用保护的 `addURLs` 方法将 JAR 文件添加到类路径中。这现在已不再可能。\n\n大多数情况下，你不需要担心类加载器的层级结构。通常，类的加载是因为它们被其他类需要，而这个过程对你来说是透明的。\n\
  \n然而，有时你需要干预并指定一个类加载器。考虑以下示例：\n\n*   你的应用程序代码包含一个调用 `Class.forName(classNameString)`\
  \ 的辅助方法。\n*   该方法是从插件类中调用的。\n*   `classNameString` 指定了一个包含在插件 JAR 中的类。\n\n插件的作者希望加载该类。然而，辅助方法的类是由系统类加载器加载的，而\
  \ `Class.forName` 使用的正是该类加载器。插件 JAR 中的类是不可见的。这种现象被称为“类加载器反转”（classloader inversion）。\n\
  \n为了解决这个问题，辅助方法需要使用正确的类加载器。它可以将类加载器作为参数传递。或者，它可以要求将正确的类加载器设置为当前线程的上下文类加载器（context\
  \ class loader）。许多框架（如 JAXP 和 JNDI）使用了这种策略。\n\n每个线程都有一个类加载器的引用，称为上下文类加载器。主线程的上下文类加载器是系统类加载器。创建一个新线程时，它的上下文类加载器被设置为创建线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将被设置为系统类加载器。\n\
  \n然而，你可以通过调用以下代码设置任何类加载器：\n\n```\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n\
  ```\n\n随后辅助方法可以获取上下文类加载器：\n\n```\nThread t = Thread.currentThread();\nClassLoader\
  \ loader = t.getContextClassLoader();\nClass<?> cl = loader.loadClass(className);\n\
  ```\n\n如果你编写了一个按名称加载类的方法，那么为调用者提供显式传递类加载器和使用上下文类加载器之间的选择是一个好主意。不要仅仅使用方法所在类的加载器。\n\
  \n### 9.1.3. 使用类加载器作为命名空间\n\n每个 Java 程序员都知道包名用于消除命名冲突。标准库中有两个名为 `Date` 的类，但它们的真实全名是\
  \ `java.util.Date` 和 `java.sql.Date`。简单名只是为了方便程序员，需要包含适当的 `import` 语句。在运行的程序中，所有类名都包含它们的包名。\n\
  \n然而，令你惊讶的是，在同一个虚拟机中存在两个具有相同`类名和包名`的不同类。一个类是由其全名以及类加载器决定的。这种技术对于从多个源加载代码非常有用。例如，应用程序服务器为每个应用程序使用单独类加载器。这允许虚拟机区分来自不同应用程序的类。图\
  \ 9.2 显示了一个示例。假设应用程序服务器加载了两个不同的应用程序，每个程序都有一个名为 `Util` 的类。由于每个类都由单独的类加载器加载，这些类是不冲突的。\n\
  \n图 9.2：两个类加载器加载了同名的类\n\n### 9.1.4. 编写自己的类加载器\n\n你可以为了特殊目的编写自己的类加载器。这允许你在将字节码传递之前之前执行自定义检查。例如，你的类加载器可以拒绝加载未标记为“已付费”的类。\n\
  \n要编写你自己的类加载器，只需扩展 `ClassLoader` 类并重写方法\n\n```\nfindClass(String className)\n```\n\
  \n`ClassLoader` 基类的 `loadClass` 方法处理委托逻辑，并且仅在类尚未加载且父类加载器无法加载该类时才调用 `findClass`。\n\
  \n你的方法的实现必须执行以下操作：\n\n1.  从本地文件系统或其他源加载类的字节码。\n2.  调用 `ClassLoader` 基类的 `defineClass`\
  \ 方法将字节码呈现给虚拟机。\n\n在列表 9.1](#index.xhtml_ch09list01)的程序中，我们实现了一个加载加密类的加载器。程序询问用户要加载的第一个类名（即包含\
  \ `main` 方法的类）以及解密密钥。然后它使用一个特殊的类加载器加载指定的类并调用 `main` 方法。该类加载器解密指定的类以及其引用的所有非系统类。\n\
  \n为了简单起见，我们忽略了密码学领域 2000 年的进步，并使用古老的凯撒加密法来加密类文件。\n\nDavid Kahn 的经典著作《密码破译者》（Macmillan,\
  \ 1967, p. 84）引用苏提乌斯作为凯撒加密的历史来源。凯撒将罗马字母表中的 24 个字母移动了 3 个位置，这在当时让他的对手们一无措措。\n\n\n\
  \n\n\n当本章首次编写时，美国政府限制强加密方法的出口。因此，我在示例中使用了凯撒加密法，因为它在出口方面是明确合法的。\n\n我们版本的凯撒加密使用一个一个\
  \ 1 到 255 之间的整数作为密钥。要进行解密，只需将该密钥加到每个字节上并对 256 取模即可。显示列表 9.2 中的 `Caesar.java` 程序执行了加密操作。\n\
  \n为了不与常规类加载器混淆，我们为加密的类文件使用了不同的扩展名 `.caesar`。\n\n要进行解密，类加载器简单地从每个字节中减去密钥。在本书的配套代码中，你会找到四个类文件，它们使用值为\
  \ `3` 的密钥进行加密——这是一个传统的选择。要运行加密后的程序，你需要使用我们在 `ClassLoaderDemo` 程序中定义的自定义类加载器。\n\n\
  尝试使用类名 `Calculator` 和解密密钥 `3` 运行该程序。会弹出一个计算器。但如果你使用不同的密钥，类加载器将抛出异常。\n\n加密类文件具有许多实际用途（当然，前提是你使用了比凯撒加密更强的方法）。没有解密密钥，这些类文件就是毫无用的。它们既无法被标准虚拟机执行，也无法被轻易反编译。\n\
  \n这意味着你可以使用自定义类加载器来验证类使用者的身份，或者在允许程序运行之前确保其已付费。当然，加密只是自定义类加载器的应用之一。你还可以使用其他类型的类加载器来解决其他问题——例如将类文件存储在数据库中。\n\
  \nListing 9.1 v2ch09/classLoader/ClassLoaderDemo.java\n\n```java\npackage v2ch09.classLoader;\n\
  \nimport module java.base;\n\n/**\n * 此程序演示了一个可以解密类文件的自定义类加载器。\n */\nclass ClassLoaderDemo\
  \ {\n    void main(String[] args) throws Exception {\n        String className =\
  \ IO.readln(\"Class name: \");\n        int decryptionKey = Integer.parseInt(IO.readln(\"\
  Decryption key: \"));\n        var loader = new CryptoClassLoader(decryptionKey);\n\
  \        Class<?> c = loader.loadClass(className);\n        Method m = c.getMethod(\"\
  main\", String[].class);\n        m.invoke(null, (Object) new String[] {});\n  \
  \  }\n}\n\n/**\n * 此类加载器加载加密的类文件。\n */\nclass CryptoClassLoader extends ClassLoader\
  \ {\n    private int key;\n\n    /**\n     * 构建一个加密类加载器。\n     * @param k 解密密钥\n\
  \     */\n    public CryptoClassLoader(int k) {\n        key = k;\n    }\n\n   \
  \ protected Class<?> findClass(String name) throws ClassNotFoundException {\n  \
  \      try {\n            byte[] classBytes = loadClassBytes(name);\n          \
  \  Class<?> cl = defineClass(name, classBytes, 0, classBytes.length);\n        \
  \    if (cl == null) throw new ClassNotFoundException(name);\n            return\
  \ cl;\n        }\n        catch (IOException e) {\n            throw new ClassNotFoundException(name);\n\
  \        }\n    }\n\n    /**\n     * 加载并解密类文件字节。\n     * @param name 类名\n     *\
  \ @return 包含类文件字节的数组\n     */\n    private byte[] loadClassBytes(String name) throws\
  \ IOException {\n        String cname = name.replace(\".\", \"/\") + \".caesar\"\
  ;\n        // 从此类加载器相同的目录读取加密的类文件\n        byte[] bytes = getClass().getResourceAsStream(cname).readAllBytes();\n\
  \        for (int i = 0; i < bytes.length; i++)\n            bytes[i] = (byte) (bytes[i]\
  \ - key);\n        return bytes;\n    }\n}\n```\n\nListing 9.2 v2ch09/classLoader/Caesar.java\n\
  \n```java\npackage v2ch09.classLoader;\n\nimport module java.base;\n\n/**\n * 使用凯撒加密对文件进行加密或解密。在命令行上提供输入文件、输出文件\n\
  \ * 以及加密密钥（解密时使用负值）。\n */\nclass Caesar {\n    void main(String[] args) throws Exception\
  \ {\n        try (var in = new FileInputStream(args[0]); var out = new FileOutputStream(args[1]))\
  \ {\n            int key = Integer.parseInt(args[2]);\n            boolean done\
  \ = false;\n            while (!done) {\n                int ch = in.read();\n \
  \               if (ch == -1)\n                    done = true;\n              \
  \  else\n                    out.write((byte) (ch + key));\n            }\n    \
  \    }\n    }\n}\n```\n\n`java.lang.Class`1.0\n\n*   `ClassLoader getClassLoader()`\n\
  \    获取加载此类的类加载器。\n\n`java.lang.ClassLoader`1.0\n\n*   `ClassLoader getParent()`1.2\n\
  \    返回父类加载器，如果父类加载器是引导类加载器，则返回 `null`。\n\n*   `static ClassLoader getSystemClassLoader()`1.2\n\
  \    获取系统类加载器——即用于加载第一个应用程序类的类加载器。\n\n*   `protected Class findClass(String name)`1.2\n\
  \    应由类加载器重写此方法，以查找类的字节码，并通过调用 `defineClass` 方法将其呈现给虚拟机。在类名中，使用 `.` 作为包名分隔符，不要使用\
  \ `.class` 后缀。\n\n*   `Class defineClass(String name, byte[] byteData, int offset,\
  \ int length)`\n    向虚拟机添加一个新类，其字节码位于提供的字节数据范围内。\n\n`java.net.URLClassLoader`1.2\n\
  \n*   `URLClassLoader(URL[] urls)`\n\n*   `URLClassLoader(URL[] urls, ClassLoader\
  \ parent)`\n    构建一个从给定 URL 加载类的加载器。如果 URL 以 `/` 结尾，则假设它是目录，否则是 JAR 文件。\n\n`java.lang.Thread`1.0\n\
  \n*   `ClassLoader getContextClassLoader()`1.2\n    获取创建此线程线程指定的执行时最合理的类加载器。\n\n\
  *   `void setContextClassLoader(ClassLoader loader)`1.2\n    设置此线程使用的类加载器。如果在启动线程时没有显式设置类加载器，则使用父线程的上下文类加载器。\n\
  \n### 9.1.5 字节码验证\n\n当类加载器将新加载的 Java 平台类字节码呈现给虚拟机时，这些字节码首先由验证器检查。验证器检查指令不会执行明显破坏的操作。除了平台类外，所有类都经过验证。\n\
  \n以下是验证器执行的一些检查：\n\n*   变量在使用前已初始化。\n*   方法调用与对象的引用类型匹配。\n*   没有违反访问私有数据和方法的规则。\n\
  *   局部变量访问落在运行时栈范围内。\n*   运行时栈不会溢出。\n\n如果任何一个检查失败，该类将被认为已损坏且不会加载。\n\n如果你熟悉哥德尔定理，可能会疑惑验证器如何证明一个类文件没有类型不匹配、未初始化变量和栈溢出。哥德尔定理指出，设计一种算法来处理程序并判断其是否具有特定属性（例如无栈溢出）是不可能的。这是\
  \ Oracle 公关部门与逻辑法则之间的冲突吗？不——事实上，验证器并不是哥德尔意义上的算法。如果验证器接受了程序，它确实是安全的。然而，验证器可能会拒绝某些实际上是安全的指令。\n\
  \n\n\n\n这种严格的验证是一个重要的安全考量。意外错误（例如未初始化的变量）如果不被捕获，很容易导致灾难性的后果。更重要的是，在开放的互联网世界中，你必须防范那些故意制造恶意影响的程序员。例如，通过修改运行时堆栈上的值或通过向平台对象的私有实例字段写入数据，程序可以突破浏览器的安全系统。\n\
  \n然而，你可能会想，为什么需要一个特殊的验证器来检查所有这些特性呢？毕竟，编译器永远不会允许你生成一个使用了未初始化变量、或从另一个类访问私有实例字段的类文件。事实上，Java\
  \ 编程语言编译器生成的类文件总是能通过验证的。但是，类文件中使用的字节码格式有详细的文档记录，对于具有汇编编程和十六进制编辑器经验的人来说，手动生成一个包含\
  \ Java 虚拟机有效但不安全指令的类文件是非常容易的。验证器始终在防止恶意篡改的类文件——而不仅仅是检查编译器产生的类文件。\n\n下面是如何构造这样一个修改过的类文件的示例。我们从\
  \ Listing 9.3 中的程序 `VerifierDemo.java` 开始。这是一个简单的调用方法并显示方法结果的程序。`fun` 方法本身计算 `1\
  \ + 2`。\n\n```\nstatic int fun() {\n    int m;\n    int n;\n    m = 1;\n    n =\
  \ 2;\n    int r = m + n;\n    return r;\n}\n```\n\n作为一个实验，尝试编译该程序的以下修改版本：\n\n```\n\
  static int fun() {\n    int m = 1;\n    int n;\n    m = 1;\n    m = 2;\n    int\
  \ r = m + n;\n    return r;\n}\n```\n\n在这里，`n` 没有被初始化，因此它可以是任何随机值。当然，编译器检测到了这个问题并拒绝编译该程序。要创建一个糟糕的类文件，我们需要多下点功夫。首先，运行\
  \ `javap` 程序查看编译器是如何翻译 `fun` 方法的。命令\n\n```\njavap -c v2ch09.verifier.VerifierDemo\n\
  ```\n\n以助记符形式显示类文件中的字节码。\n\n```\nMethod int fun()\n    0 iconst_1\n    1 istore_0\n\
  \    2 iconst_2\n    3 istore_1\n    4 iload_0\n    5 iload_1\n    6 iadd\n    7\
  \ istore_2\n    8 iload_2\n    9 ireturn\n```\n\n使用十六进制编辑器将指令 3 从 `istore_1` 改为\
  \ `istore_0`。这意味着局部变量 0（即 `m`）被初始化了两次，而局部变量 1（即 `n`）完全没有被初始化。我们需要知道这些指令的十六进制值；这些值可以从\
  \ Java 虚拟机规范([`docs.oracle.com/javase/specs/jvms/se21/html/index.html`](https://docs.oracle.com/javase/specs/jvms/se21/html/index.html))\
  \ 中轻松获得。\n\n```\n0 iconst_1 04\n1 istore_0 3B\n2 iconst_2 05\n3 istore_1 3C\n4 iload_0\
  \  1A\n5 iload_1  1B\n6 iadd     60\n7 istore_2 3D\n8 iload_2  1C\n9 ireturn  AC\n\
  ```\n\n你可以使用任何十六进制编辑器执行修改。在图 9.3 中，你看到类文件 `VerifierDemo.class` 被载入 Gnome 十六进制编辑器，`fun`\
  \ 方法的字节码被高亮。\n\n![Figure](img/fig09-04.jpg)图 9.3：使用十六进制编辑器修改字节码\n\n将 `3C`改为 `3B`\
  \ 并保存类文件。然后尝试运行 `VerifierDemo` 程序。你会得到一个错误消息：\n\n```\nException in thread \"main\"\
  \ java.lang.VerifyError:\n    (class: VerifierDemo, method:fun signature: ()I)\n\
  \    Accessing value from uninitialized register 1\n```\n\n这很好——虚拟机检测到了我们的修改。\n\n\
  现在使用 `-noverify`（或 `-Xverify:none`）选项运行程序：\n\n```\njava -noverify v2ch09.verifier.VerifierDemo\n\
  ```\n\n`fun` 方法返回了一个看似随机的值。这实际上是 `2` 加上恰好存储在变量 `n` 中的值，而该变量从未被初始化。\n\n这是一个典型的输出：\n\
  \n```\n1 + 2 == 15102330\n```\n\n`-noverify` 和 `-Xverify:none` 选项已弃用并可能被移除，但在它们可用期间，它们展示了损坏造成的影响。\n\
  \nListing 9.3 v2ch09/verifier/VerifierDemo.java\n\n```\npackage v2ch09.verifier;\n\
  \n/**\n * 此应用程序演示了虚拟机的字节码验证器。如果你使用十六进制\n * 编辑器修改类文件，那么虚拟机应该检测到篡改。\n */\nclass VerifierDemo\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  1 + 2\");\n    }\n\n    /**\n     * 计算 1 的函数\n     * @return 结果\n     */\n    public\
  \ static int fun() {\n        int m;\n        int n;\n        m = 1;\n        n\
  \ = 2;\n        int r = m + n;\n        return r;\n    }\n}\n```\n\n## 9.2 用户认证\n\
  \nJava API 提供了一个名为 Java 认证与授权服务（JAAS）的框架，它提供了平台提供的和自定义的认证机制。\n\n### 9.2.1 JAAS 框架\n\
  \n从其名称可以看出，JAAS 有两个部分。“认证”部分负责确定用户的身份。“授权”部分与安全管理器相关，我们不讨论它。\n\n这里是登录的基本框架：\n\n\
  ```\ntry {\n    LoginContext context = new LoginContext(\"Login1\"); // 定义在 JAAS\
  \ 配置中\n    context.login();\n    // 获取 Subject\n    Subject subject = context.getSubject();\n\
  \    context.logout();\n} catch (LoginException e) { // 如果登录失败则抛出\n    e.printStackTrace();\n\
  }\n```\n\n现在 `subject` 表示经过认证的个人。\n\n`LoginContext` 的字符串参数 `\"Login1\"` 指向 JAAS\
  \ 配置中的项。这是一个示例配置：\n\n```\nLogin1 {\n    com.sun.security.auth.module.UnixLoginModule\
  \ required;\n    com.whizzbang.auth.module.RetinaScanModule sufficient=\"true\"\
  ;\n};\n\nLogin2 {\n};\n\nother {\n};\n```\n\n模块类名和标志后面可以跟随任意传递给模块构造函数的选项。\n\n特殊名称\
  \ `other` 用于当登录上下文名称不匹配配置中的任何名称时。\n\n当然，JDK 不包含生物识别登录模块。以下模块位于 `com.sun.security.auth.module`\
  \ 包中：\n\n```\nUnixLoginModule\nNTLoginModule\nKrb5LoginModule\nJndiLoginModule\n\
  KeyStoreLoginModule\n```\n\n登录策略由一系列登录模块组成，每个标记为 `required`、`sufficient`、`requisite`\
  \ 或 `optional`。这些关键字的含义由以下算法给出：\n\n1. 按顺序执行模块，直到 `sufficient` 模块成功、`requisite` 模块失败或到达模块列表结束。\n\
  \n2. 如果所有 `required` 和 `requisite` 模块都成功，或者在没有执行这些模块的情况下，至少有一个 `sufficient` 或 `optional`\
  \ 模块成功，则认证成功。\n\n登录认证一个 *subject*，该 subject 可以有多个 *principals*。principal 描述了 subject\
  \ 的某些属性，例如用户名、组 ID 或角色。`com.sun.security.auth.UnixPrincipal` 描述 UNIX 登录名，`UnixNumericGroupPrincipal`\
  \ 可以测试是否属于某个 UNIX 组。\n\nListing 9.4](#index.xhtml_ch09list06) 中的程序显示当前登录用户的 principals。以以下方式运行程序\n\
  \n\n\n\n\n```\njava -Djava.security.auth.login.config=v2ch09/auth/jaas.config v2ch09.auth.AuthDemo\n\
  ```\n\nListing 9.5 显示了登录配置。\n\n在 Windows 上，将 `jaas.config` 中的 `UnixLoginModule`\
  \ 改为 `NTLoginModule`。\n\nListing 9.4 v2ch09/auth/AuthDemo.java\n\n```java\npackage\
  \ v2ch09.auth;\n\nimport module java.base;\n\n/**\n * 此程序获取用户的 Unix 登录信息。\n */\n\
  class AuthDemo {\n    void main() {\n        try {\n            var context = new\
  \ LoginContext(\"Login1\");\n            context.login();\n            IO.println(\"\
  Authentication successful.\");\n            Subject subject = context.getSubject();\n\
  \            for (Principal p : subject.getPrincipals()) {\n                IO.println(p.getClass().getName()\
  \ + \": \" + p.getName());\n            }\n            context.logout();\n     \
  \   }\n        catch (LoginException e) {\n            IO.println(\"Authentication\
  \ failed.\");\n            e.printStackTrace();\n        }\n    }\n}\n```\n\nListing\
  \ 9.5 v2ch09/auth/jaas.config\n\n```config\nLogin1 \n{       \n   com.sun.security.auth.module.UnixLoginModule\
  \ required;\n};\n```\n\n`javax.security.auth.login.LoginContext`1.4\n\n*   `LoginContext(String\
  \ name)`\n\n    构造一个登录上下文。`name` 对应 JAAS 配置文件中的登录描述符。\n\n*   `void login()`\n\n\
  \    建立登录，如果登录失败则抛出 `LoginException`。调用 JAAS 配置中模块的 `login` 方法。\n\n*   `void logout()`\n\
  \n    注销主体系（subject）。调用 JAAS 配置中模块的 `logout` 方法。\n\n*   `Subject getSubject()`\n\
  \n    返回经过身份验证的主体。\n\n`javax.security.auth.Subject`1.4\n\n*   `Set<Principal> getPrincipals()`\n\
  \n    获取此主体的主体角（principals）。\n\njava.security.Principal1.1\n\n*   `String getName()`\n\
  \n    返回该主体的标识名称。\n\n### 9.2.2. JAAS 登录模块\n\n在本节中，我们将查看一个 JAAS 示例，它将向你展示\n\n*  \
  \ 如何实现自己的登录模块\n*   如何实现基于角色的授权\n\n如果你在数据库中存储登录信息，那么提供自己的登录模块将很有用。\n\n登录模块的一个工作是填充正在进行身份验证的主体的\
  \ principal 集合。如果登录模块支持角色，它会添加描述角色的 `Principal` 对象。Java 库没有提供为此目的的类，因此我编写了自己的类（参见\
  \ Listing 9.6）。\n\n登录模块在文本文件中查找用户、密码和角色，该文件包含如下所示行：\n\n```text\nharry|secret|admin\n\
  carl|guessme|HR\n```\n\n当然，在实际的登录模块中，你会将这些信息存储在数据库或目录中。并且你会对密码进行哈希处理——参见第 9.3.2\
  \ 节。\n\n你可以在 Listing 9.7 中找到 `SimpleLoginModule` 的代码。`checkLogin` 方法检查用户名和密码是否与密码文件中的记录匹配。如果是，我们向主体的\
  \ principal 集合添加两个 `Principal` 对象：\n\n```java\nSet<Principal> principals = subject.getPrincipals();\n\
  principals.add(new UserPrincipal(username));\nprincipals.add(new RolePrincipal(role));\n\
  ```\n\n`UserPrincipal` 类声明在 `com.sun.security.auth` 包中。\n\n`SimpleLoginModule` 的其余部分是简单的管道连接工作。`initialize`\
  \ 方法接收：\n\n*   正在进行身份验证的 `Subject`\n*   用于检索登录信息的处理程序（handler）\n*   一个可以用于登录模块之间通信的\
  \ `sharedState` 映射\n*   一个包含登录配置中设置的键值对的 `options` 映射\n\n例如，我们这样配置模块：\n\n```config\n\
  SimpleLoginModule required passwordFile=\"jaas/password.txt\" debug=true;\n```\n\
  \n`initialize` 方法从 `options` 参数中检索 `passwordFile` 和 `debug` 设置。\n\n登录模块不收集用户名和密码；那是单独处理程序的工作。这种分离允许你使用同一个登录模块，而无需担心登录信息是来自\
  \ GUI 对话框、控制台提示还是配置文件。\n\n在构造 `LoginContext` 时指定处理程序，例如：\n\n```java\nvar context\
  \ = new LoginContext(\"Login1\",\n    new com.sun.security.auth.callback.TextCallbackHandler());\n\
  ```\n\n`TextCallbackHandler` 类会在控制台提示输入用户名和密码。\n\n然而，你通常会有自己的用户界面来收集用户名和密码。在这种情况下，回调机制显得大多一举，但没有其他方法可以传输这些信息。Listing\
  \ 9.8 中的示例应用程序使用了一个简单的处理程序，仅存储并返回这些信息。\n\n处理程序有一个方法 `handle`，它处理一个 `Callback` 对象数组。许多预定义的类（如\
  \ `NameCallback` 和 `PasswordCallback`）实现了 `Callback`。你也可以添加自己的类，例如 `RetinaScan`。处理程序的代码有点不好看，因为它需要分析回调的类型：\n\
  \n```java\npublic void handle(Callback[] callbacks) {\n    for (Callback callback\
  \ : callbacks) {\n        switch (callback) {\n            case NameCallback c ->\
  \ c.setName(username);\n            case PasswordCallback c -> c.setPassword(password);\n\
  \            default -> {}\n        }\n    }\n}\n```\n\n`SimpleLoginModule` 的 `login`\
  \ 方法准备了它身份验证所需的回调数组：\n\n```java\nvar nameCallback = new NameCallback(\"username:\
  \ \");\nvar passwordCallback = new PasswordCallback(\"password: \", false);\ncallbackHandler.handle(new\
  \ Callback[] { nameCallback, passwordCallback });\n```\n\n根据处理器的不同，`handle` 方法询问用户或从某处检索信息。当\
  \ `handle` 方法返回时，`nameCallback` 和 `passwordCallback` 对象已设置。然后 `login` 方法检索用户名和密码并检查它们是否有效。\n\
  \nListing 9.9 中的程序使用 `TextCallbackHandler` 或自定义登录，用户名位于命令行上，密码则有提示。当登录成功时，将显示主体。以以下方式运行程序：\n\
  \n```bash\njava -Djava.security.auth.login.config=v2ch09/auth/jaas.config v2ch09.auth.AuthDemo\n\
  ```\n\n或者\n\n```bash\njava -Djava.security.auth.login.config=v2ch09/auth/jaas.config\
  \ v2ch09.auth.AuthDemo harry\n```\n\n支持更复杂的两阶段协议是可能的，如果登录配置中的所有模块都成功，则登录将被*提交*（committed）。更多信息，请参阅登录模块开发者指南：[`docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASLMDevGuide.html`](https://docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASLMDevGuide.html)。\n\
  \nListing 9.6 v2ch09/jaas/RolePrincipal.java\n\n```java\npackage v2ch09.jaas;\n\n\
  import module java.base;\n\n/**\n * 带有命名角色的主体。\n */\npublic record RolePrincipal(String\
  \ name) implements Principal {\n    /**\n     * @return 角色名称。\n     */\n    public\
  \ String getName() {\n        return name;\n    }\n}\n```\n\nListing 9.7 v2ch09/jaas/SimpleLoginModule.java\n\
  \n\n\n\n\n```java\npackage v2ch09.jaas;\n\nimport module java.base;\nimport com.sun.security.auth.UserPrincipal;\n\
  \n/**\n * 此登录模块通过从文本文件中读取用户名、密码和角色来验证用户身份验证。\n */\npublic class SimpleLoginModule\
  \ implements LoginModule {\n    private Subject subject;\n    private CallbackHandler\
  \ callbackHandler;\n    private boolean debug;\n    private String passwordFile;\n\
  \n    public void initialize(Subject subject, CallbackHandler callbackHandler,\n\
  \            Map<String, ?> sharedState, Map<String, ?> options) {\n        this.subject\
  \ = subject;\n        this.callbackHandler = callbackHandler;\n        debug = options.get(\"\
  debug\").equals(\"true\");\n        passwordFile = \"\" + options.get(\"passwordFile\"\
  );\n    }\n\n    public boolean login() throws LoginException {\n        var nameCallback\
  \ = new NameCallback(\"username: \");\n        var passwordCallback = new PasswordCallback(\"\
  password: \", false);\n        try {\n            if (debug) {\n               \
  \ System.Logger logger = System.getLogger(\"com.horstmann.corejava\");\n       \
  \         logger.log(System.Logger.Level.INFO, \"Invoking handler\");\n        \
  \    }\n            if (callbackHandler == null) throw new LoginException(\"no handler\"\
  );\n\n            callbackHandler.handle(new Callback[] { nameCallback, passwordCallback\
  \ });\n            return checkLogin(nameCallback.getName(), passwordCallback.getPassword());\n\
  \        }\n        catch (UnsupportedCallbackException | IOException e) {\n   \
  \         var e2 = new LoginException();\n            e2.initCause(e);\n       \
  \     throw e2;\n        }\n    }\n\n    /**\n     * 检查身份验证信息是否有效。如果有效，主体主体获取用户名和角色的主体（principals）。\n\
  \     * @param username 用户名\n     * @param password 包含密码的字符数组\n     * @return 如果身份验证信息有效返回\
  \ true\n     */\n    private boolean checkLogin(String username, char[] password)\
  \ throws IOException {\n        try (var in = new Scanner(Path.of(passwordFile)))\
  \ {\n            while (in.hasNextLine()) {\n                String[] inputs = in.nextLine().split(\"\
  \\\\|\");\n                if (inputs[0].equals(username)\n                    \
  \    && Arrays.equals(inputs[1].toCharArray(), password)) {\n                  \
  \  String role = inputs[2];\n                    Set<Principal> principals = subject.getPrincipals();\n\
  \                    principals.add(new UserPrincipal(username));\n            \
  \        principals.add(new RolePrincipal(role));\n                    return true;\n\
  \                }\n            }\n            return false;\n        }\n    }\n\
  \n    public boolean logout() {\n        return true;\n    }\n\n    public boolean\
  \ abort() {\n        return true;\n    }\n\n    public boolean commit() {\n    \
  \    return true;\n    }\n}\n```\n列表 9.8 `v2ch09/jaas/SimpleCallbackHandler.java`\n\
  \n```java\npackage v2ch09.jaas;\n\nimport module java.base;\n\n/**\n * 此简单的回调处理器提供给定的用户名和密码。\n\
  \ */\npublic class SimpleCallbackHandler implements CallbackHandler {\n    private\
  \ String username;\n    private char[] password;\n\n    /**\n     * 构造回调处理器。\n \
  \    * @param username 用户名\n     * @param password 包含密码的字符数组\n     */\n    public\
  \ SimpleCallbackHandler(String username, char[] password) {\n        this.username\
  \ = username;\n        this.password = password;\n    }\n\n    public void handle(Callback[]\
  \ callbacks) {\n        for (Callback callback : callbacks) {\n            switch\
  \ (callback) {\n                case NameCallback c -> c.setName(username);\n  \
  \              case PasswordCallback c -> c.setPassword(password);\n           \
