  \ `GridBagConstraints`。此构造函数仅适用于自动代码生成器，因为它会让源代码变得难以阅读。\n\n## 11.7. 自定义布局管理器\n\n\
  你可以设计自己的 `LayoutManager` 类来以特殊方式管理组件。作为一个有趣的示例，让我们把容器中的所有组件排列成圆形（参见图 11.29）。\n\n\
  ![Figure](img/circlelayouttest.jpg) 图 11.29：圆形布局\n\n你的布局管理器必须实现 `LayoutManager`\
  \ 接口。你需要重写以下五个方法：\n\n```java\nvoid addLayoutComponent(String s, Component c)\nvoid\
  \ removeLayoutComponent(Component c)\nDimension preferredLayoutSize(Container parent)\n\
  Dimension minimumLayoutSize(Container parent)\nvoid layoutContainer(Container parent)\n\
  ```\n\n在前两个方法或组件时调用。如果你没有关于组件的任何附加信息，可以让它们什么都不做。接下来两个方法计算最小和首选布局所需的空间。这些空间通常是相同的。第五方法执行实际工作并对所有组件调用\
  \ `setBounds`。\n\n AWT 有第二个接口，称为 `LayoutManager2`，需要实现十个方法而不是五个。`LayoutManager2`\
  \ 接口的主要点是允许在使用约束使用 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 实现了 `LayoutManager2`\
  \ 接口。\n\n列表 11.9 显示了 `CircleLayout` 管理器的代码，它无用地将组件沿容器内部的圆形进行布局。示例程序的框架类在列表 11.10\
  \ 中。\n\n列表 11.9 v2ch11/circleLayout/CircleLayout.java\n\n\n\n\n\n```java\npackage\
  \ v2ch11.circleLayout;\n\nimport module java.desktop;\n\n/**\n * 一个沿圆形布局组件的布局管理器。\n\
  \ */\npublic class CircleLayout implements LayoutManager {\n    private int minWidth\
  \ = 0;\n    private int minHeight = 0;\n    private int preferredWidth = 0;\n  \
  \  private int preferredHeight = 0;\n    private boolean sizesSet = false;\n   \
  \ private int maxComponentWidth = 0;\n    private int maxComponentHeight = 0;\n\n\
  \    public void addLayoutComponent(String name, Component comp) {\n    }\n\n  \
  \  public void removeLayoutComponent(Component comp) {\n    }\n\n    public void\
  \ setSizes(Container parent) {\n        if (sizesSet) return;\n        int n = parent.getComponentCount();\n\
  \n        preferredWidth = 0;\n        preferredHeight = 0;\n        minWidth =\
  \ 0;\n        minHeight = 0;\n        maxComponentWidth = 0;\n        maxComponentHeight\
  \ = 0;\n\n        // 计算组件的最大宽度和高度\n        //并将首选尺寸设置为组件尺寸之和\n        for (int i\
  \ = 0; i < n; i++) {\n            Component c = parent.getComponent(i);\n      \
  \      if (c.isVisible()) {\n                Dimension d = c.getPreferredSize();\n\
  \                maxComponentWidth = Math.max(maxComponentWidth, d.width);\n   \
  \             maxComponentHeight = Math.max(maxComponentHeight, d.height);\n   \
  \             preferredWidth += d.width;\n                preferredHeight += d.height;\n\
  \            }\n        }\n        minWidth = preferredWidth / 2;\n        minHeight\
  \ = preferredHeight / 2;\n        sizesSet = true;\n    }\n\n    public Dimension\
  \ preferredLayoutSize(Container parent) {\n        setSizes(parent);\n        Insets\
  \ insets = parent.getInsets();\n        int width = preferredWidth + insets.left\
  \ + insets.right;\n        int height = preferredHeight + insets.top + insets.bottom;\n\
  \        return new Dimension(width, height);\n    }\n\n    public Dimension minimumLayoutSize(Container\
  \ parent) {\n        setSizes(parent);\n        Insets insets = parent.getInsets();\n\
  \        int width = minWidth + insets.left + insets.right;\n        int height\
  \ = minHeight + insets.top + insets.bottom;\n        return new Dimension(width,\
  \ height);\n    }\n\n    public void layoutContainer(Container parent) {\n     \
  \   setSizes(parent);\n\n        // 计算圆的中心\n\n        Insets insets = parent.getInsets();\n\
  \        int containerWidth = parent.getSize().width - insets.left - insets.right;\n\
  \        int containerHeight = parent.getSize().height - insets.top - insets.bottom;\n\
  \n        int xcenter = insets.left + containerWidth / 2;\n        int ycenter =\
  \ insets.top + containerHeight / 2;\n\n        // 计算圆的半径\n\n        int xradius\
  \ = (containerWidth - maxComponentWidth) / 2;\n        int yradius = (containerHeight\
  \ - maxComponentHeight) / 2;\n        int radius = Math.min(xradius, yradius);\n\
  \n        // 沿圆形布局组件\n\n        int n = parent.getComponentCount();\n        for\
  \ (int i = 0; i < n; i++) {\n            Component c = parent.getComponent(i);\n\
  \            if (c.isVisible()) {\n                double angle = 2 * Math.PI *\
  \ i / n;\n\n                // 组件的中心点\n                int x = xcenter + (int) (Math.cos(angle)\
  \ * radius);\n                int y = ycenter + (int) (Math.sin(angle) * radius);\n\
  \n                // 移动组件使其中心位于 (x, y)\n                // 且尺寸为其首选尺寸\n         \
  \       Dimension d = c.getPreferredSize();\n                c.setBounds(x - d.width\
  \ / 2, y - d.height / 2, d.width, d.height);\n            }\n        }\n    }\n\
  }\n```\n\nListing 11.10 v2ch11/circleLayout/CircleLayoutFrame.java\n\n```java\n\
  package v2ch11.circleLayout;\n\nimport module java.desktop;\n\n/**\n * 显示沿圆形排列按钮的框架。\n\
  \ */\npublic class CircleLayoutFrame extends JFrame {\n    public CircleLayoutFrame()\
  \ {\n        setLayout(new CircleLayout());\n        add(new JButton(\"Yellow\"\
  ));\n        add(new JButton(\"Blue\"));\n        add(new JButton(\"Red\"));\n \
  \       add(new JButton(\"Green\"));\n        add(new JButton(\"Orange\"));\n  \
  \      add(new JButton(\"Fuchsia\"));\n        add(new JButton(\"Indigo\"));\n \
  \       pack();\n    }\n}\n```\n\njava.awt.LayoutManager1.0\n\n* `void addLayoutComponent(String\
  \ name, Component comp)`\n  向布局中添加组件。\n\n* `void removeLayoutComponent(Component\
  \ comp)`\n  从布局中移除组件。\n\n* `Dimension preferredLayoutSize(Container cont)`\n  返回该布局下容器的首选尺寸。\n\
  \n* `Dimension minimumLayoutSize(Container cont)`\n  返回该布局下容器的最小尺寸。\n\n* `void layoutContainer(Container\
  \ cont)`\n  对容器中的组件进行布局。\n\n## 11.8 对话框\n\n在 GUI 应用中，你通常希望弹出独立的对话框来提供信息或获取信息。正与窗口系统一样，AWT\
  \ 区分了*模态*（modal）和*非模态*（modeless）对话框。模态对话框在关闭之前会阻塞应用程序的输入，而非模态对话框则允许用户与其他窗口交互。\n\n\
  让我们从简单的对话框开始本节——带有单个消息的模态对话框。接下来，你将看到如何编写复杂的对话框。最后，你将看到如何在对话框之间传输数据。我们将通过查看 `JFileChooser`\
  \ 来结束对对话框的讨论。\n\n### 面\n\nSwing 提供了一组现成的简单对话框，适用于向用户请求信息。`JOptionPane` 类提供了静态方法来显示这些简单对话框：\n\
  \n* `showMessageDialog`: 显示消息并等待用户点击确定。\n* `showConfirmDialog`: 显示消息并获取确认（如确定/取消）。\n\
  * `showOptionDialog`: 显示消息并获取选项（通常来自一组按钮）。\n* `showInputDialog`: 显示消息并获取用户输入（通常来自输入框或组合框）。\n\
  \n图 11.30 显示了一个典型的对话框。如你所示，对话框具有以下组件：\n\n*   一个图标\n*   一条消息\n*   一个或多个选项按钮\n\n输入对话框还有一个额外的用户输入组件。它可以是一个允许用户输入任意字符串的文本字段，也可以是一个用户从中选择一个项目的组合框。\n\
  \n这些对话框的精确布局以及标准消息类型的图标选择取决于可插的外观（look-and-feel）。左侧的图标取决于五种消息类型之一：\n\n```\nERROR_MESSAGE\n\
  INFORMATION_MESSAGE\nWARNING_MESSAGE\nQUESTION_MESSAGE\nPLAIN_MESSAGE\n```\n\n`PLAIN_MESSAGE`\
  \ 类型没有图标。每种对话类型都有一个方法允许你提供自己的图标来代替。对于每种对话类型，你都可以指定一个消息。此消息对象的显示方式如下：\n\n* `String`:\
  \ 绘制字符串。\n* `Icon`: 显示图标。\n* `Component`: 显示组件。\n* `Object[]`: 显示数组中的所有对象，堆叠在一起。\n\
  \n\n\n\n\n| 其他任何对象 | 应用 `toString` 并显示生成的字符串 |\n\n当然，提供一个消息字符串目前是最常见的情况。提供一个 `Component`\
  \ 则可以带给你极大的灵活性，因为你可以让 `paintComponent` 方法绘制你想要的任何内容。\n\n底部的按钮取决于对话框类型和 `option type`。当调用\
  \ `showMessageDialog` 和 `showInputDialog` 时，你只会得到一组标准的按钮（分别为 OK 和 OK/Cancel）。当调用\
  \ `showConfirmDialog` 时，你可以从四种选项类型中进行选择：\n\n```\nDEFAULT_OPTION\nYES_NO_OPTION\n\
  YES_NO_CANCEL_OPTION\nOK_CANCEL_OPTION\n```\n\n使用 `showOptionDialog`，你可以指定任意一组选项。你只需提供一个对象数组作为选项。每个数组元素的渲染方式如下：\n\
  \n| `String` | 创建一个以该字符串为标签的按钮 |\n| `Icon` | 创建一个以图标为标签的按钮 |\n| `Component` | 显示该组件\
  \ |\n| 其他任何对象 | 应用 `toString` 并以生成的字符串为标签创建一个按钮 |\n\n这些函数的返回值如下：\n\n| `showMessageDialog`\
  \ | 无 (None) |\n| `showConfirmDialog` | 表示所选选项的整数 |\n| `showOptionDialog` | 表示所选选项的整数\
  \ |\n| `showInputDialog` | 用户提供或选择的字符串 |\n\n`showConfirmDialog` 和 `showOptionDialog`\
  \ 返回整数以指示用户选择了哪个按钮。对于选项对话框，这只是所选选项的索引；如果用户关闭了对话框而不是选择选项，则返回 `CLOSED_OPTION`。对于确认对话框，返回值可以是以下任意之一：\n\
  \n```\nOK_OPTION\nCANCEL_OPTION\nYES_OPTION\nNO_OPTION\nCLOSED_OPTION\n```\n\n这听起来像是一组令人困惑的选择，但在实践中非常简单。请按照以下步骤操作：\n\
  \n1. 选择对话框类型（消息、确认、选项或输入）。\n2. 选择图标（错误、信息、警告、问号、无或自定义）。\n3. 选择消息（字符串、图标、自定义组件或它们的组合[堆栈]）。\n\
  4. 对于确认对话框，选择选项类型（默认、是/否、是/否/取消或确定/取消）。\n5. 对于选项对话框，选择选项（字符串、图标或自定义组件）和默认选项。\n6.\
  \ 对于输入对话框，在文本字段和组合框之间进行选择。\n7. 在 `JOptionPane` API 中找到相应的调用方法。\n\n例如，假设你想在图 11.30\
  \ 中显示对话框。该对话框显示消息并请求用户确认或取消。因此，这是一个确认对话框。图标是一个问号图标。消息是一个字符串。选项类型是 `OK_CANCEL_OPTION`。以下是你将进行的调用：\n\
  \n```\nint selection = JOptionPane.showConfirmDialog(parent,\n    \"Message\", \"\
  Title\",\n    JOptionPane.OK_CANCEL_OPTION,\n    JOptionPane.QUESTION_MESSAGE);\n\
  if (selection == JOptionPane.OK_OPTION) . . .\n```\n\n消息字符串可以包含换行符 (`'\\n'`)。此类字符串将多行显示。\n\
