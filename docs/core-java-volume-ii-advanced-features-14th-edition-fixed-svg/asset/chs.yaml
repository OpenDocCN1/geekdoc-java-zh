  \ setPaintTrack(boolean b)`\n- `void isInverted(boolean b)`\n\n## 11.5 菜单\n\n本章介绍了你可能想要放入窗口的常用组件，例如按钮、文本字段和组合框。Swing\
  \ 还支持另一种用户界面类型——下拉菜单，这在 GUI 程序中很常见。\n\n窗口顶部的*菜单栏*包含下拉菜单的名称。点击名称会打开所有菜单，并向程序发送消息。\n\
  \n### 11.5.1 菜单构建\n\n构建菜单非常简单。首先，创建一个菜单栏：\n\n```java\nvar menuBar = new JMenuBar();\n\
  ```\n\n菜单栏只是可以添加到任何地方的组件。通常，你希望它出现在帧的顶部。你可以使用 `setJMenuBar` 方法将其添加那里：\n\n```java\n\
  frame.setJMenuBar(menuBar);\n```\n\n对于每个菜单，你创建一个菜单对象：\n\n```java\nvar editMenu =\
  \ new JMenu(\"Edit\");\n```\n\n将顶层菜单添加到菜单栏：\n\n```java\nmenuBar.add(editMenu);\n\
  ```\n\n将菜单项、分隔符和子菜单添加到菜单对象：\n\n```java\nvar pasteItem = new JMenuItem(\"Paste\"\
  );\neditMenu.add(pasteItem);\neditMenu.addSeparator();\nJMenu optionsMenu = . .\
  \ .; // 子菜单\neditMenu.add(optionsMenu);\n```\n\n你可以在图 11.17 中看到 Paste 和 Read-only\
  \ 菜单项下面的分隔符。\n\n![Figure](img/menu2.jpg)图 11.17：带有子菜单的菜单\n\n当用户选择菜单项时，会触发动作事件。你需要为每个菜单项安装动作监听器：\n\
  \n```java\nActionListener listener = . . .;\npasteItem.addActionListener(listener);\n\
  ```\n\n`JMenu.add(String s)` 方法方便地将菜单项添加到菜单的末尾。例如：\n\n```java\neditMenu.add(\"Paste\"\
  );\n```\n\n该 `add` 方法返回创建的菜单项，因此你可以捕获它并添加监听器，如下所示：\n\n```java\nJMenuItem pasteItem\
  \ = editMenu.add(\"Paste\");\npasteItem.addActionListener(listener);\n```\n\n\n\n\
  \n\n菜单项经常会触发命令，这些命令也可以通过其他用户界面元素（如工具栏按钮）激活。在第 10 章中，你看到了如何通过 `Action` 对象指定命令。你定义一个实现\
  \ `Action` 接口的类（通常通过扩展 `AbstractAction` 便利类），在 `AbstractAction` 对象的构造函数中指定菜单项标签，并重写\
  \ `actionPerformed` 方法以持有菜单动作处理器。例如：\n\n```\nvar exitAction = new AbstractAction(\"\
  Exit\") { // menu item text goes here\n    public void actionPerformed(ActionEvent\
  \ event) {\n        // action code goes here\n        System.exit(0);\n    }\n};\n\
  ```\n\n然后你可以将动作添加到菜单中：\n\n```\nJMenuItem exitItem = fileMenu.add(exitAction);\n\
  ```\n\n该命令使用动作名称向菜单添加了一个菜单项。动作对象成为其监听器。这只是为了操作方便提供的快捷方式：\n\n```\nvar exitItem =\
  \ new JMenuItem(exitAction);\nfileMenu.add(exitItem);\n```\n\n#### `javax.swing.JMenu`\
  \ 1.2\n\n*   `JMenu(String label)`: 使用给定的标签构造菜单。\n*   `JMenuItem add(JMenuItem item)`:\
  \ 添加一个菜单项（或菜单）。\n*   `JMenuItem add(String label)`: 向此菜单添加一个带有给定标签的菜单项并返回该项。\n*\
  \   `JMenuItem add(Action a)`: 向此菜单添加一个带有给定动作的菜单项并返回该项。\n*   `void addSeparator()`:\
  \ 向菜单添加一条分隔线。\n*   `JMenuItem insert(JMenuItem menu, int index)`: 在指定的索引处向菜单添加一个新的菜单项（或子菜单）。\n\
  *   `JMenuItem insert(Action a, int index)`: 在指定的索引处向菜单添加带有给定动作的菜单项。\n*   `void\
  \ insertSeparator(int index)`: 在菜单添加分隔符。\n*   `void remove(int index)`\n*   `void\
  \ remove(JMenuItem item)`: 从菜单中移除特定项。\n\n#### `javax.swing.JMenuItem` 1.2\n\n* \
  \  `JMenuItem(String label)`: 使用给定的标签构造菜单项。\n*   `JMenuItem(Action a)` 1.3: 为给定的动作构造菜单项。\n\
  \n#### `javax.swing.AbstractButton` 1.2\n\n*   `void setAction(Action a)` 1.3: 为此按钮或菜单项设置动作。\n\
  \n#### `javax.swing.JFrame` 1.2\n\n*   `void setJMenuBar(JMenuBar menubar)`: 为此框架设置菜单栏。\n\
  \n### 11.5.2. 菜单项中的图标\n\n菜单项与按钮非常相似。事实上，`JMenuItem` 类继承了 `AbstractButton` 类。就像按钮一样，菜单可以只有文本标签、只有图标或两者兼有。你可以通过\
  \ `JMenuItem(String, Icon)` 或 `JMenuItem(Icon)` 构造函数指定图标，也可以使用 `JMenuItem` 类继承自\
  \ `AbstractButton` 类的 `setIcon` 方法来设置。这里是一个示例：\n\n```\nvar cutItem = new JMenuItem(\"\
  Cut\", new ImageIcon(\"cut.gif\"));\n```\n\n在图 11.17 中，你可以看到几个菜单项旁边有图标。默认情况下，菜单项文本放置在图标右侧。如果你希望将文本放在左侧，请调用\
  \ `JMenuItem` 类继承自 `AbstractButton` 类的 `setHorizontalTextPosition` 方法。例如，调用\n\n\
  ```\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n```\n\n会将菜单项文本移动到图标的左侧。\n\
  \n你也可以为动作添加图标：\n\n```\ncutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"cut.gif\"\
  ));\n```\n\n每当你根据一个动作构造菜单项时，`Action.NAME` 值将成为菜单项的文本，而 `Action.SMALL_ICON` 值将成为图标。\n\
  \n或者，你也可以可以在 `AbstractAction` 的构造函数中设置图标：\n\n```\ncutAction = new AbstractAction(\"\
  Cut\", new ImageIcon(\"cut.gif\")) {\n        public void actionPerformed(ActionEvent\
  \ event) {\n            . . .\n        }\n    };\n```\n\n#### `javax.swing.JMenuItem`\
  \ 1.2\n\n*   `JMenuItem(String label, Icon icon)`: 使用给定的标签和图标构造菜单项。\n\n#### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `void setHorizontalTextPosition(int pos)`: 设置文本相对于图标的水平位置。`pos` 参数是\
  \ `SwingConstants.RIGHT`（文本在图标右侧）或 `SwingConstants.LEFT`。\n\n#### `javax.swing.AbstractAction`\
  \ 1.2\n\n*   `AbstractAction(String name, Icon smallIcon)`: 使用给定的名称和图标构造抽象动作。\n\n\
  ### 11.5.3. 复选框和单选按钮菜单项\n\n*复选框*和*单选按钮*菜单项在名称旁边显示复选框或单选按钮（参见图 11.17）。当用户选择菜单项时，该项会自动在选中和未选中状态之间切换。\n\
  \n除了按钮装饰外，像处理其他菜单项一样处理这些菜单项。例如，这里是如何创建一个复选框菜单项：\n\n```\nvar readonlyItem = new JMenuItem(\"\
  Read-only\");\noptionsMenu.add(readonlyItem);\n```\n\n复选框和单选按钮菜单项在名称旁边显示复选框或单选按钮。当用户选择菜单项时，该项会自动在选中和未选中状态之间切换。\n\
  \n除了按钮装饰外，像处理其他菜单项一样处理这些菜单项。例如，这里是如何创建一个复选框菜单项：\n\n```\nvar readonlyItem = new JMenuItem(\"\
  Read-only\");\noptionsMenu.add(readonlyItem);\n```\n\n单选按钮菜单项像普通按钮一样工作。你必须将它们添加到组中。当其中一个按钮被选中时，所有其他按钮都会取消选中。\n\
  \n```\nvar group = new ButtonGroup();\nvar insertItem = new JMenuItem(\"Insert\"\
  );\ngroup.add(insertItem);\nvar overtypeItem = new JMenuItem(\"Overtype\");\ngroup.add(overtypeItem);\n\
  optionsMenu.add(insertItem);\n```\n\n`javax.swing.JMenuItem` 1.2\n\n*   `JCheckBoxMenuItem(String\
  \ label)`: 使用给定的标签构造复选框菜单项。\n*   `JCheckBoxMenuItem(String label, boolean state)`:\
  \ 使用给定的标签和初始状态（`true` 为选中）构造复选框菜单项。\n*   `JRadioButtonMenuItem(String label)`: 使用给定的标签构造单选按钮菜单项。\n\
  *   `JRadioButtonMenuItem(String label, boolean state)`: 使用给定的标签和初始状态（`true` 为选中）构造单选按钮菜单项。\n\
  \n`javax.swing.AbstractButton` 1.2\n\n*   `boolean isSelected()`\n*   `void setSelected(boolean\
  \ state)`: 获取或设置此项的选中状态（`true` 为选中）。\n\n### 11.5.4. 弹出菜单\n\n*弹出菜单*（pop-up menu）不是附加到菜单栏上而是浮浮在某处的菜单（参见图\
  \ 11.18）。\n\n![Figure](img/menu3.jpg)图 11.18: 弹出菜单\n\n创建弹出菜单就像创建普通菜单一样，只是弹出菜单没有标题。\n\
  \n```\nvar popup = new JPopupMenu();\n```\n\n然后像通常一样添加你的菜单项：\n\n```\nvar item =\
  \ new JMenuItem(\"Cut\");\nitem.addActionListener(listener);\npopup.add(item);\n\
  ```\n\n与始终显示在框架顶部的普通菜单栏不同，你必须使用 `show` 方法显式地弹出菜单。指定父组件和弹出菜单的位置，使用父组件的坐标系。例如：\n\n\
  ```\npopup.show(panel, x, y);\n```\n\n通常，你希望在用户点击特定的鼠标按钮时弹出菜单——被称为*弹出触发器*（pop-up\
  \ trigger）。在 Windows 和 Linux 中，弹出触发器是非主（通常是右键）鼠标按钮。要让用户点击组件时使用弹出触发器弹出菜单，只需调用方法\n\
  \n```\ncomponent.setComponentPopupMenu(popup);\n```\n\n在极少数情况下，你将一个组件放在另一个具有弹出菜单的组件内部。子组件可以通过调用以下方法继承父组件的弹出菜单：\n\
  \n```\nchild.setInheritsPopupMenu(true);\n```\n\n`javax.swing.JPopupMenu` 1.2\n\n\
  *   `void show(Component c, int x, int y)`\n\n\n\n\n在组件 `c` 之上显示弹出菜单，其左上角位于 `(x,\
  \ y)`（在 `c` 的坐标系中）。\n\n* `boolean isPopupTrigger(MouseEvent event)` 1.3\n  如果鼠标事件是弹出菜单的触发器，则返回\
  \ `true`。\n\n`java.awt.event.MouseEvent` 1.1\n\n* `boolean isPopupTrigger()`\n \
  \ 如果此鼠标事件是弹出菜单的触发器，则返回 `true`。\n\n`javax.swing.JComponent` 1.2\n\n* `JPopupMenu\
  \ getComponentPopupMenu()` 5.0\n* `void setComponentPopupMenu(JPopupMenu popup)`\
  \ 5.0\n  获取或设置此组件的弹出菜单。\n* `boolean getInheritsPopupMenu()` 5.0\n* `void setInheritsPopupMenu(boolean\
  \ b)` 5.0\n  获取或设置 `inheritsPopupMenu` 属性。如果属性已设置且此组件的弹出菜单为 `null`，则使用其父组件的弹出菜单。\n\
  \n### 11.5.5. 键盘记忆键和加速键\n\n对于经验用户来说，通过键盘记忆键选择菜单项是非常方便的。你可以在菜单项的构造函数中指定一个记忆字母，为菜单项创建一个键盘记忆键：\n\
  \n```java\nvar aboutItem = new JMenuItem(\"About\", 'A');\n```\n\n键盘记忆键会自动显示在菜单中，且记忆字母带有下划线（参见图\
  \ 11.19）。例如，在在上一个示例中定义的项中，标签将显示为“About”，并带有下划线的字母‘A’。当菜单显示时，用户只需按下 A 键即可选中该菜单项。（如果记忆字母不是菜单字符串的一部分，输入该字母仍然可以选中该项，但记忆键不会显示在菜单中。自然地，这种不可见的记忆键其用性存疑。）\n\
  \n![Figure](img/menu4.jpg) 图 11.19: 键盘记忆键\n\n有时，你不想为匹配记忆键的菜单项的第一个字母加上下划线。例如，如果你为“另存为”（Save\
  \ As）设置了记忆键“A”，那么下划第二个“A”（Save As）会更有意义。你可以通过调用 `setDisplayedMnemonicIndex` 方法来指定你想为哪个字符添加下划线。\n\
  \n如果你有一个 `Action` 对象，可以将记忆键作为 `Action.MNEMONIC_KEY` 键的值添加如下所示：\n\n```java\naboutAction.putValue(Action.MNEMONIC_KEY,\
  \ Integer.valueOf('A'));\n```\n\n你可以在菜单项的构造函数中提供记忆字母，但不能在菜单的构造函数中提供。要为菜单附加记忆键，请调用\
  \ `setMnemonic` 方法：\n\n```java\nvar helpMenu = new JMenu(\"Help\");\nhelpMenu.setMnemonic('H');\n\
  ```\n\n要从菜单栏中选择顶级菜单，请同时按下 Alt 键和记忆字母。例如，按下 Alt+H 从菜单栏选择“帮助”菜单。\n\n键盘记忆键允许你从当前打开的菜单中选择子菜单或菜单项。相比之下，加速键（accelerators）是键盘快捷键，让你可以在无需打开菜单的情况下选择菜单项。例如，许多程序将加速键\
  \ Ctrl+O 和 Ctrl+S 绑定到“文件”菜单中的“打开”和“保存”项。使用 `setAccelerator` 方法将加速键绑定到菜单项。`setAccelerator`\
  \ 方法接收一个 `Keystroke` 类型的对象。例如，以下调用将加速键 Ctrl+O 绑定到 `openItem` 菜单项：\n\n```java\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n```\n\n输入加速键组合会自动选中菜单选项并触发动作事件，就像用户手动选择了该菜单选项一样。\n\n你可以将加速键绑定到菜单项，而不能绑定到菜单。加速键实际上不会打开菜单。相反，它们会直接触发与菜单关联的动作事件。\n\
  \n从概念上讲，向菜单项添加加速键与向 Swing 组件添加加速键的技术相似。然而，当加速键被添加到菜单项时，按键组合会自动显示在菜单中（参见图 11.20）。\n\
  \n![Figure](img/menu5.jpg) 图 11.20: 加速键\n\n在 Windows 下，Alt+F4 会关闭窗口。但这不是要在 Java\
  \ 中编写的加速键。它是由操作系统定义的快捷键。无论菜单上是否有“关闭”项，此按键组合始终会触发活动窗口的 `WindowClosing` 事件。\n\n`javax.swing.JMenuItem`\
  \ 1.2\n\n* `JMenuItem(String label, int mnemonic)`\n  使用给定的标签和记忆键构造菜单项。\n* `void\
  \ setAccelerator(KeyStroke k)`\n  将按键 `k` 设置为此菜单项的加速键。加速键显示在标签旁边。\n\n`javax.swing.AbstractButton`\
  \ 1.2\n\n* `void setMnemonic(int mnemonic)`\n  为按钮设置记忆字符。该字符将在标签中带有下划线。\n* `void\
  \ setDisplayedMnemonicIndex(int index)` 1.4\n  设置按钮文本中要带上下划线的字符索引。如果你不希望第一个出现的记忆字符带上下划线，请使用此方法。\n\
  \n### 11.5.6. 启用和禁用菜单项\n\n有时，菜单项应仅在特定上下文中被禁用。例如，当文档被设置为只读模式时，你可以找到“保存”和“另存为”项并禁用它们。禁用的项以灰色显示，且无法选中（参见图\
  \ 11.21）。\n\n![Figure](img/menu6.jpg) 图 11.21: 禁用的菜单项\n\n要启用或禁用菜单项，请使用 `setEnabled`\
  \ 方法：\n\n```java\nsaveItem.setEnabled(false);\n```\n\n启用和禁用菜单项有两种策略。每当情况发生时，你都可以在相关的菜单项上调用\
  \ `setEnabled`。另一种，你可以在显示菜单之前禁用项。要做到这一点，你必须为“菜单选中”事件注册一个监听器。`javax.swing.event`\
  \ 包定义了 `MenuListener` 接口，它包含三个方法：\n\n```java\nvoid menuSelected(MenuEvent event)\n\
  void menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n```\n\n\
  `menuSelected` 方法在菜单显示之前被调用。因此，它可以用于禁用菜单项。以下代码显示了每当“只读”复框菜单项被选中时，如何禁用“保存”和“另存为”动作：\n\
  \n```java\npublic void menuSelected(MenuEvent event) {\n    saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \    saveAsAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n在显示菜单之前禁用菜单项是一个聪明的主意，但它对于也带有加速键的菜单项无效。因为按下加速键时菜单从未打开，因此动作不会被禁用，并且仍然可以通过加速键触发。\n\
  \n`javax.swing.JMenuItem` 1.2\n\n* `void setEnabled(boolean b)`\n  启用或禁用该菜单项。\n\n\
  `javax.swing.event.MenuListener` 1.2\n\n* `void menuSelected(MenuEvent e)`\n  在菜单被选中、打开之前被调用。\n\
  * `void menuDeselected(MenuEvent e)`\n  在菜单被取消选中、关闭之后被调用。\n* `void menuCanceled(MenuEvent\
  \ e)`\n  在菜单取消时（例如通过用户点击菜单外部）被调用。\n\n列表 11.6 是一个生成一组菜单的示例程序。它展示了在本节看到的所有功能：嵌套菜单、禁用的菜单项、复选框和单选按钮菜单项、弹出菜单以及键盘记忆键和加速键。\n\
  \n列表 11.6 v2ch11/menu/MenuFrame.java\n\n\n\n\n\n```java\npackage v2ch11.menu;\n\n\
