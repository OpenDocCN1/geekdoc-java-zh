  \ 类实现了 `SupportedValuesAttribute` 接口。该类的对象可能描述打印机支持 1 到 99 份打印输出。\n\n### 属性层级\n\n\
  属性层级\n\nattribute hierarchy\n\n除了单个属性的接口和类外，打印服务 API 还定义了属性集的接口和类。父接口 `AttributeSet`\
  \ 有四个子接口：\n\n```\nPrintRequestAttributeSet\nDocAttributeSet\nPrintServiceAttributeSet\n\
  PrintJobAttributeSet\n```\n\n这些接口每个都有一个实现类，产生了以下五个类：\n\n```\nHashAttributeSet\n\
  HashPrintRequestAttributeSet\nHashDocAttributeSet\nHashPrintServiceAttributeSet\n\
  HashPrintJobAttributeSet\n```\n\n图 12.66\n\n例如，你可以这样构造打印请求属性集：\n\n```\nvar attributes\
  \ = new HashPrintRequestAttributeSet();\n```\n\n构造集合后，你就不需要担心 `Hash` 前缀了。\n\n为什么要这些接口？它们使得检查属性的使用成为可能。例如，`DocAttributeSet`\
  \ 只接受实现 `DocAttribute` 接口的对象。任何添加另一个属性的尝试都会导致运行时错误。\n\n属性集是一种特殊的 map，其键的类型为 `Class`，值属于实现\
  \ `Attribute` 接口的类。例如，如果你将一个对象\n\n```\nnew Copies(10)\n```\n\n插入属性集，那么它的键就是 `Class`\
  \ 对象 `Copies.class`。该键被称为属性的*类别*（category）。`Attribute` 接口声明了一个方法：\n\n```\nClass\
  \ getCategory()\n```\n\n返回属性的类别。`Copies` 类定义了返回对象 `Copies.class` 方法，但并不要求类别与属性的类相同。\n\
  \n当属性被添加到属性集时，类别会自动提取。只需添加属性值即可：\n\n```\nattributes.add(new Copies(10));\n```\n\n\
  如果你随后添加另一个相同类别的属性，它将覆盖第一个。\n\n要检索属性，你需要使用类别作为键，例如：\n\n```\nAttributeSet attributes\
  \ = job.getAttributes();\nvar copies = (Copies) attributes.get(Copies.class);\n\
  ```\n\n最后，属性按它们可以拥的值进行组织。`Copies` 属性可以是任何整数值。`Copies` 类继承自 `IntegerSyntax` 类，该类处理所有整数值属性。`getValue`\
  \ 方法返回属性的整数值，例如：\n\n```\nint n = copies.getValue();\n```\n\n类\n\n```\nTextSyntax\n\
  DateTimeSyntax\nURISyntax\n```\n\n封装了字符串、日期和时间值或 URI。\n\n\n\n\n最后，许多属性可以取有限数量的值。例如，`PrintQuality`\
  \ 属性有三个设置：草稿（draft）、普通（normal）和高质量（high）。它们由三个常量表示：\n\n```\nPrintQuality.DRAFT\n\
  PrintQuality.NORMAL\nPrintQuality.HIGH\n```\n\n具有有限值的属性类扩展了 `EnumSyntax` 类，该类提供了许多便利方法，以类型安全的方式设置这些枚举。在使用此类属性时，你无需担心其内部机制。只需将具名值添加到属性集中即可：\n\
  \n```\nattributes.add(PrintQuality.HIGH);\n```\n\n以下是检查属性值的方法：\n\n```\nif (attributes.get(PrintQuality.class)\
  \ == PrintQuality.HIGH)\n    . . .\n```\n\n表 12.5 列出了打印属性。第二列列出了属性类的父类（例如，`Copies`\
