  \n```\ntable.setCellSelectionEnabled(true);\n```\n\n![Figure](img/fig06-11.jpg)图\
  \ 12.7: 选择单元格范围\n\n运行列表 12.3 中的程序以查看单元格选择的操作。在“选择”（Selection）菜单中启用行、列或单元格选择，并观察选择行为如何变化。\n\
  \n你可以通过调用 `getSelectedRows` 和 `getSelectedColumns` 方法来获取选择了哪些行和列。这两个方法都返回一个包含所选项索引的\
  \ `int[]` 数组。注意，索引值是表格视图的索引，而不是底层表格模型的。尝试选择行和列，然后将列拖动到不同的位置，并通过点击列头对行进行排序。使用“打印选择”（Print\
  \ Selection）菜单项查看哪些行和列被报告为已选中。\n\n如果你需要将表格索引值转换为表格模型索引值，请使用 `JTable` 的 `convertRowIndexToModel`\
  \ 和 `convertColumnIndexToModel` 方法。\n\n### 12.2.6. 行排序\n\n正如我们在第一个表格示例所示，只需调用 `setAutoCreateRowSorter`\
  \ 方法即可轻松地为 `JTable` 添加行排序。然而，为了对排序行为进行更细粒度的控制，可以向 `JTable` 安装 `TableRowSorter<M>`\
  \ 对象并对其进行自定义。类型参数 `M` 表示表格模型，它需要是 `TableModel` 接口的子类型。\n\n```\nvar sorter = new\
  \ TableRowSorter<TableModel>(model);\ntable.setRowSorter(sorter);\n```\n\n某些列不应该是排序的，例如行星数据中的图像列。通过调用以下代码关闭排序：\n\
  \n```\nsorter.setSortable_\n```\n\n你可以为每列安装自定义的比较器。在我们的示例中，我们将对 `Color` 列中的颜色进行排序，优先考虑蓝色和绿色而非红色。当你点击\
  \ `Color` 列时，你会发现蓝色行星移动到了表格底部。这是通过以下调用实现的：\n\n```\nsorter.setComparator(COLOR_COLUMN,\
  \ new Comparator<Color>() {\n    public int compare(Color c1, Color c2) {\n    \
  \    int d = c1.getBlue() - c2.getBlue();\n        if (d != 0) return d;\n     \
  \   d = c1.getGreen() - c2.getGreen();\n        if (d != 0) return d;\n        return\
  \ c1.getRed() - c2.getRed();\n    }\n});\n```\n\n如果你没有为列指定比较器，则排序顺序确定如下：\n\n1. \
  \ 如果列类型为 `String`，则使用由 `Collator.getInstance()` 返回的默认排序器（collator）。它以适用于当前区域设置的方式对字符串进行排序。（有关区域和排序器的更多信息，请参见第\
  \ 7 章）。\n\n2.  如果列类实现了 `Comparable`，则使用它的 `compareTo` 方法。\n\n3.  如果为排序器设置了 `TableStringConverter`，则使用默认排序器对转换器的\
  \ `toString` 方法返回的字符串进行排序。如果你想使用这种方法，可以如下定义一个转换器：\n\n    ```\n    sorter.setStringConverter(new\
  \ TableStringConverter() {\n        public String toString(TableModel model, int\
  \ row, int column) {\n            Object value = model.getValueAt(row, column);\n\
  \            // 将 value 转换为字符串并返回\n        }\n    });\n    ```\n\n4.  否则，对单元格值调用\
  \ `toString` 方法并使用默认排序器对其进行排序。\n\n### 12.2.7. 行过滤\n\n除了排序行，`TableRowSorter` 还可以选择性地隐藏行——这一过程被称为*过滤*（filtering）。要激活过滤，请设置\
  \ `RowFilter`。例如，要包含所有至少有一个月的行，调用：\n\n```\nsorter.setRowFilter(RowFilter.numberFilter(ComparisonType.NOT_EQUAL,\
  \ 0, MOONS_COLUMN));\n```\n\n在这里，我们使用了一个预定义的数字过滤器。要构造数字过滤器，需要提供：\n\n*   比较类型（`EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一）。\n*   一个 `Number` 子类的对象（例如 `Integer` 或 `Double`）。只有与给定的 `Number`\
  \ 对象具有相同类的对象才会被考虑。\n*   零或多个列索引值。如果没有提供索引值，则搜索所有列。\n\n静态方法 `RowFilter.dateFilter`\
  \ 以相同的方式构造日期过滤器；你需要提供一个 `Date` 对象而不是 `Number` 对象。\n\n最后，静态方法 `RowFilter.regexFilter`\
  \ 构造一个查找匹配正则表达式字符串的过滤器。例如：\n\n```\nsorter.setRowFilter(RowFilter.regexFilter(\"\
  .*[^s]$\", PLANET_COLUMN));\n```\n\n这仅显示那些名称不以“s”结尾的行星。（有关正则表达式的更多信息，请参见第 2 章。）\n\
  \n你还可以结合使用 `andFilter`、`orFilter` 和 `notFilter` 方法来组合过滤器。要过滤出不以“s”结尾且至少有一个月的行星，你可以使用此过滤器组合：\n\
  \n```\nsorter.setRowFilter(RowFilter.andFilter(\n    RowFilter.regexFilter(\".*[^s]$\"\
  , PLANET_COLUMN),\n    RowFilter.numberFilter(ComparisonType.NOT_EQUAL, 0, MOONS_COLUMN)\n\
  ));\n```\n（注：此处原文代码逻辑似乎存在断层或重复，已根据语境调整翻译）\n\n要实现自己的过滤器，提供 `RowFilter` 的子类并实现 `include`\
  \ 方法以指示哪些行。例如，此过滤器显示每隔一行：\n\n```\nvar filter = new RowFilter<TableModel, Integer>()\
  \ {\n    public boolean include(Entry<? extends TableModel, extends Integer> entry)\
  \ {\n        return entry.getIdentifier() % 2 == 0;\n    }\n};\n```\n\n如果你只想包含具有偶数个月份的行星，你应该测试：\n\
  \n```\n((Integer) entry.getValue(MOONS_COLUMN)) % 2 == 0\n```\n\n在我们的程序中，我们允许用户隐藏任意行。我们将隐藏的行索引存储在一个集中。行过滤器显示所有索引不在集合中的行。\n\
  \n过滤机制并没有设计用于随时间变化的过滤器。在我们的程序中，每当隐藏行发生变化时，我们都会调用：\n\n```\nsorter.setRowFilter(filter);\n\
  ```\n\n设置过滤器会立即生效。\n\n### 12.2.8. 隐藏和显示列\n\n正如我们在前一节所示，你可以通过内容或行标识符来过滤表格行。隐藏表格列使用完全不同的机制。\n\
  \n`JTable` 类的 `removeColumn` 方法从表格视图中移除列。列数据并未从模型中删除——它们只是在视图中隐藏了。`removeColumn`\
  \ 方法的参数类型为 `TableColumn`。如果你有列索引（例如通过 `getSelectedColumns` 获取），你需要向表格模型请求表格列对象：\n\
  \n```\nTableColumnModel columnModel = table.getColumnModel();\nTableColumn column\
  \ = columnModel.getColumn(i);\ntable.removeColumn(column);\n```\n\n如果你记得该列，稍后可以添加回来：\n\
  \n```\ntable.addColumn(column);\n```\n\n此方法将列添加到末尾。如果你希望它出现在其他位置，请调用 `moveColumn`\
  \ 方法。\n\n你还可以通过添加新的 `TableColumn` 对象来添加对应于表格模型中列索引的新列：\n\n\n\n\n```\ntable.addColumn(new\
  \ TableColumn(modelColumnIndex));\n```\n\n你可以拥有多个表格列，它们视图模型中的同一列。\n\n代码列表 12.3 中的程序演示了行和列的选择与过滤。\n\
