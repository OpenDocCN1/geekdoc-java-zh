  {       \n   jaas.SimpleLoginModule required passwordFile=\"jaas/password.txt\"\
  \ debug=true;\n};\n```\n`javax.security.auth.callback.CallbackHandler`\n\n*   `handle(Callback[]\
  \ callbacks)`\n    处理给定的回调，根据需要与用户交互，并将安全信息存储在回调中。\n\n`javax.security.auth.callback.NameCallback`\n\
  \n*   `NameCallback(String prompt)`\n*   `NameCallback(String prompt, String defaultName)`\n\
  \    使用给定的提示和默认名称构造 `NameCallback`。\n*   `getName()`\n*   `setName(String name)`\n\
  \    获取或设置回调获取的名称。\n*   `getPrompt()`\n    获取查询此名称时使用的提示。\n*   `getDefaultName()`\n\
  \    获取查询此名称时使用的默认名称。\n\n`javax.security.auth.callback.PasswordCallback`\n\n*  \
  \ `PasswordCallback(String prompt, boolean echoOn)`\n    使用指定的提示和指示是否显示密码的标志构造 `PasswordCallback`。\n\
  *   `getPassword()`\n*   `setPassword(char[] password)`\n    获取或设置回调获取的密码。\n*  \
  \ `getPrompt()`\n    获取查询此密码时使用的提示。\n*   `isEchoOn()`\n    获取查询此密码时使用的显示标志。\n\n\
  `javax.security.auth.spi.LoginModule`\n\n*   `initialize(Subject subject, CallbackHandler\
  \ handler, Map<String,?> sharedState, Map<String,?> options)`\n    初始化此 `LoginModule`\
  \ 以验证给定的 `subject`。在登录过程中，使用给定的处理器收集登录信息。使用 `sharedState` 映射与其他登录模块通信。`options`\
  \ 映射包含登录配置中为此模块实例指定的键值对。\n*   `login()`\n    执行验证过程并填充主体的主体（principals）。如果登录成功则返回\
  \ true。\n*   `commit()`\n    在所有登录模块都成功后调用，用于需要两阶段提交的登录场景。如果操作成功则返回 true。\n*   `abort()`\n\
  \    当另一个登录模块的失败导致登录过程中止时调用。如果操作成功则返回 true。\n*   `logout()`\n    注销此主体。如果操作成功则返回\
  \ true。\n\n\n\n\n\n正如前面提到的，小程序（applets）是引发 Java 热潮的起点。在实践中，人们发现尽管他们可以编写动画小程序（例如著名的“神经文本”），但在\
  \ `JDK 1.0` 安全模型下，小程序无法完成很多有用的操作。例如，由于 `JDK 1.0` 下的小程序受到非常严格的监控，尽管从公司安全的内部网中执行小程序的风险很小，它们在企业内网中也做不了什么。Sun\
  \ 公司很快意识到，要让小程序变得真正有用，用户需要能够根据小程序的来源分配不同级别的安全权限。如果一个小程序来自受信任的供应商且未被篡改，该小程序的用户就可以决定是否赋予它更多权限。\n\
  \n为了对小程序给予更多的信任，我们需要知道两点：\n\n*   小程序来自哪里？\n*   代码在传输过程中是否损坏了？\n\n在过去的 50 年里，数学家和计算机科学家开发了复杂的算法来确保数据的完整性并创建电子签名。`java.security`\
  \ 包包含了其中许多算法的实现。幸运的是，使用 `java.security` 包中的算法时，你理解底层的数学原理。在接下来的章节中，我将为你展示消息摘要（message\
  \ digests）如何检测数据文件的变化，以及数字签名如何证明签名者的身份。\n\n### 9.3.1 消息摘要\n\n消息摘要是数据块数字指纹。例如，所谓的\
  \ SHA-1（安全哈希算法 #1）可以将任何数据块（无论多长）压缩成 160 位（20 字节）的序列。就像真实的指纹一样，人们希望没有两个不同的消息具有相同的\
  \ SHA-1 指纹。当然，这并不可能——只有 `2¹⁶⁰` 个 SHA-1 指纹，因此某些消息一定具有相同的指纹。但 `2¹⁶⁰` 是巨大的，以至于碰撞的概率可以忽略不计。微小到什么程度？根据\
  \ James Walsh 在*真实概率：风险如何影响你的日常生活*（Merritt Publishing, 1996）中的说法，你被雷劈死的概率大约是 3 万分之一。现在，想另外九个人——例如你最不喜欢的九位经理或教授。你和他们所有人被雷劈死的概率高于伪造消息与原始消息具有相同\
  \ SHA-1 指纹的概率。（当然，会有超过十个人（其中你可能一个都不认识）死于雷劈。然而，我们谈论的是你所选择的这些人被消灭的概率要小得多。）\n\n消息摘要有两个基本属性：\n\
  \n*   如果数据的某位或几位发生了变化，消息摘要也会随之改变。\n*   拥有给定消息的伪造者无法构造出一个与原始消息具有相同消息摘要的假消息。\n\n第二个属性同样是一个概率问题。考虑这条来自亿富翁父亲的消息：\n\
  \n> “在我去世后，我的财产应平均分配给我的孩子们；然而，我的儿子 George 将一无所获。”\n\n这条消息（带有一个最后的换行符）的 SHA-1 指纹为：\n\
  \n```\n12 5F 09 03 E7 31 30 19 2E A6 E7 E4 90 43 84 B4 38 99 8F 67\n```\n\n不信任的父亲将消息留给了一位律师，将指纹留给了另一位律师。现在，假设\
  \ George 贿赂了持有消息的律师。他想修改消息让 Bill 一无所获。当然，这会将指纹变为一个完全不同的位模式：\n\n```\n7D F6 AB 08\
  \ EB 40 EC CD AB 74 ED E9 86 F9 ED 99 D1 45 B1 57\n```\n\nGeorge 能找到其他匹配该指纹的措辞吗？如果他从地球形成之初就是十亿台计算机的所有者，且每台计算机每秒计算百万条消息，直到现在他还没有找到可以替换的消息。\n\
  \n已经有很多算法被设计计算此类消息摘要。其中 SHA-1（由美国国家标准与技术研究院开发的安全哈希算法）和 MD5（由麻理工学院的 Ronald Rivest\
  \ 发明的算法）。这两种算法都以巧妙的方式打乱消息的位。关于这些算法的细节，请参考例如 William Stallings 编写的*密码学与网络安全，第七版》（Pearson,\
  \ 2017）。然而，在两种算法中都发现了细微的规律性，NIST 建议切换到更强的替代方案。Java 支持 SHA-2 和 SHA-3 算法集。\n\n`MessageDigest`\
  \ 类是一个创建封装指纹算法对象的工厂。它有一个名为 `getInstance` 的静态方法，返回一个扩展了 `MessageDigest` 类的对象。这意味着\
  \ `MessageDigest` 类承担着双重职责：\n\n*   作为工厂类\n*   作为所有消息摘要算法的父类\n\n例如，这里是获取可以计算 SHA\
  \ 指纹对象的方法：\n\n```\nMessageDigest alg = MessageDigest.getInstance(\"SHA-1\");\n```\n\
  \n获取 `MessageDigest` 对象后，通过反复调用 `update` 方法将消息中的所有字节传递给它。例如，以下代码将文件中的所有字节传递给新创建的\
  \ `alg` 对象以进行指纹计算：\n\n```\nInputStream in = . . .;\nint ch;\nwhile ((ch = in.read())\
  \ != -1)\n    alg.update((byte) ch);\n```\n\n或者，如果你在数组中有字节，可以一次性更新整个数组：\n\n```\n\
  byte[] bytes = . . .;\nalg.update(bytes);\n```\n\n完成后，调用 `digest` 方法。该方法会根据指纹算法的要求对输入进行填充，执行计算，并将摘要作为字节数组返回。\n\
  \n```\nbyte[] hash = alg.digest();\n```\n\n列表 9.11 中的程序计算消息摘要。你可以在命令行上指定文件和算法：\n\
  \n```\njava v2ch09.hash.Digest v2ch09/hash/input.txt SHA-1\n```\n\n如果你不提供命令行参数，将提示提示输入文件和算法名称。\n\
  \n列表 9.11 v2ch09/hash/Digest.java\n\n```java\npackage v2ch09.hash;\n\nimport module\
  \ java.base;\n\n/**\n * 此程序计算消息摘要。\n */\nclass Digest {\n    /**\n     * @param\
  \ args args[0] 是文件名，args[1] 是可选的算法 \n     * (SHA-1, SHA-256, 或 MD5)\n     */\n \
  \   void main(String[] args) throws Exception {\n        String filename = args.length\
  \ >= 1 ? args[0] : IO.readln(\"File name: \");\n        String algname;\n      \
  \  if (args.length >= 2)\n            algname = args[1];\n        else {\n     \
  \       IO.println(\"选择以下算法之一: \");\n            for (Provider p : Security.getProviders())\n\
  \                for (Provider.Service s : p.getServices())\n                  \
  \  if (s.getType().equals(\"MessageDigest\")) IO.println(s.getAlgorithm());\n  \
  \          algname = IO.readln(\"Algorithm: \");\n        }\n        MessageDigest\
  \ alg = MessageDigest.getInstance(algname);\n        byte[] input = Files.readAllBytes(Path.of(filename));\n\
  \        byte[] hash = alg.digest(input);\n        for (byte h : hash)\n       \
  \     IO.print(\"%02X \".formatted(h & 0xFF));\n        IO.println();\n    }\n}\n\
  ```\n\n\n\n\n\n出于明显的安全考虑，绝不以明文形式存储密码。相反，应该存储密码的哈希值。当用户登录时，对用户输入的密码也应进行哈希处理。如果两个值匹配，则用户通过身份验证。\n\
  \n然而，你在前一节中看到的哈希算法并不适用于密码哈希。为了防止暴力破解攻击，哈希机制应该使用多轮计算。此外，为了避免预计算密码表（彩虹表），每个密码都应该使用随机“盐”（salt）值进行修改。\n\
  \nJava 提供了用于密码哈希的`PBKDF2`算法。该算法有四个参数：\n\n*   一个持有密码的 `char` 数组\n*   一个随机盐值的字节数组\n\
  *   迭代次数\n*   输出的位长度（bits）\n\n加盐的密码不是一条消息，因此你不需要使用 `MessageDigest` 接口。相反，请像下面一样使用\
  \ `SecretKeyFactory`：\n\n```\nvar spec = new PBEKeySpec(password, salt, ITERATIONS,\
  \ 8 * HASH_BYTES);\nSecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\"\
  );\nbyte[] hash = skf.generateSecret(spec).getEncoded();\n```\n\n缩写 `PBE` 表示“基于密码的加密”（password\
  \ based encryption），因为派生的字节也可以作为加密密钥。`PBKDF` 是“基于密码的密钥派生函数”（password based key derivation\
  \ function），它将短密码转换为更长的加密密钥。我们对加密并不感兴趣，只存储生成的字节。对于密码验证，存储盐值也很重要。由于随着处理器的增强随时间推移增加迭代次数是一个良好的做法，因此你也应该存储该值。\n\
  \n在将哈希存储为字符串时，应将字节编码为十六进制（hex）或更高效地编码为 base64：\n\n```\nBase64.Encoder encoder =\
  \ Base64.getEncoder();\nString hashedPassword = ITERATIONS + \"|\" + encoder.encodeToString(salt)\
  \ + \"|\"\n    + encoder.encodeToString(hash);\n```\n\n要验证用户输入的密码，从存储的哈希中获取迭代次数和盐，并重新计算哈希。\n\
  \n### 9.3.3. 消息签名\n\n在第 9.3.1 节中，你了解了如何计算消息摘要——即消息的指纹。如果消息被篡改，被修改后消息的指纹将与原始消息的指纹不匹配。如果消息和其指纹分别投送，接收者可以检查消息是否被篡改过。然而，如果消息和指纹都被截获，那么修改消息并重新计算指纹就是轻而易举的。毕竟，消息摘要算法是公开的，不需要密钥。在这种情况下，伪造消息和重新计算的指纹的接收者将永远不知道消息已被篡改。数字签名解决了这个问题。\n\
  \n为了帮助你理解数字签名是如何工作的，让我们来看来自“公钥密码学”（public key cryptography）领域的几个概念。公钥密码学基于公钥和私钥的概念。其核心思想是向世界上所有人公布你的公钥。然而，只有你本人持有私钥，重要的是要保护好它，不要泄露给其他人。密钥之间通过数学关系相互匹配，尽管这些关系的精确性质对我们来说并不重要。（如果你感兴趣，可以在《*应用密码学手册*》（*The\
  \ Handbook of Applied Cryptography*）的 [`cacr.uwaterloo.ca/hac/`](https://cacr.uwaterloo.ca/hac/)\
  \ 中查找。）\n\n密钥非常长且复杂。例如，这里有一对匹配的数字签名算法（DSA）公私钥密钥。\n\n公钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\ny: c0b6e67b4ac098eb1a32c5f8c4c1f0e7e6fb9d832532e27d0bdab9ca2d2a8123ce5a8018b8161a760480fadd0\n\
  40b927281ddb22cb9bc4df596d7de4d1b977d50\n```\n\n私钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\ny: c0b6e67b4ac098eb1a32c5f8c4c1f0e7e6fb9d832532e27d0bdab9ca2d2a8123ce5a8018b8161a760480fadd0\n\
  40b927281ddb22cb9bc4df596d7de4d1b977d50\n```\n\n### 9.3.4. 验证签名\n\nJDK 自带了 `keytool`\
  \ 程序，这是一个用于生成和管理一组证书的命令行工具。我们预计最终该工具的功能将嵌入到其他更友好的程序中。但现在，我们将使用 `keytool` 来展示 Alice\
  \ 如何对文档进行签名并发送给 Bob，以及 Bob 如何验证该文档确实是由 Alice 而非冒充者签署的。\n\n`keytool` 程序管理密钥库（keystores）——证书和私公钥对的数据库。密钥库中的每个条目都有一个别名（alias）。以下是\
  \ Alice 创建密钥库 `alice.jks` 并生成别名为 `alice` 的密钥对的方法：\n\n```\nkeytool -genkeypair -keyalg\
  \ DSA -keystore alice.jks -alias alice\n```\n\n在创建或打开密钥库时，会提示输入密钥库密码。对于本示例，只需使用\
  \ `secret` 即可。如果你要在任何正式用途中使用 `keytool` 生成的密钥库，你需要选择良好的密码并妥善保护该文件。\n\n在生成密钥时，会提示输入以下信息：\n\
  \n\n\n\n\n```\nEnter keystore password:  secret\nReenter new password:  secret\n\
  What is your first and last name?\n  [Unknown]:  Alice Lee\nWhat is the name of\
  \ your organizational unit?\n  [Unknown]:  Engineering\nWhat is the name of your\
  \ organization?\n  [Unknown]:  ACME Software\nWhat is the name of your City or Locality?\n\
  \  [Unknown]:  San Francisco\nWhat is the name of your State or Province?\n  [Unknown]:\
  \  CA\nWhat is the two-letter country code for this unit?\n  [Unknown]:  US\nIs\
  \ <CN=Alice Lee, OU=Engineering, O=ACME Software, L=San Francisco, ST=CA, C=US>\
  \ correct?\n  [no]:  yes\n```\n\n`keytool` 使用 X.500 格式的名称，其组件包括通用名称（CN）、组织单元（OU）、组织（O）、地点（L）、州/省（ST）和国家（C），这些这些名称被用来识别密钥所有者和证书颁发者。\n\
  \n假设 Alice 想要将她的公钥给 Bob。她需要导出一个证书文件：\n\n```\nkeytool -exportcert -keystore alice.jks\
  \ -alias alice -file alice.cer\n```\n\n现在 Alice 可以将证书发送给 Bob。当 Bob 接收证书时，他可以打印它：\n\
  \n```\nkeytool -printcert -file alice.cer\n```\n\n输出内容如下：\n\n```\nOwner: CN=Alice\
  \ Lee, OU=Engineering, O=ACME Software, L=San Francisco, ST=CA, C=US\nIssuer: CN=Alice\
  \ Lee, OU=Engineering, O=ACME Software, L=San Francisco, ST=CA, C=US\nSerial number:\
  \ b2b46ccd99479da2\nValid from: Tue Jan 16 08:11:22 CET 2024 until: Mon Apr 15 09:11:22\
  \ CEST 2024\nCertificate fingerprints:\n  SHA1: 41:38:E6:F2:9D:FA:90:FE:CB:36:85:F1:E6:39:62:A1:5A:DD:16:BC\n\
  \  SHA256: 14:CC:AD:BC:83:D5:0C:F9:98:24:52:29:B3:AF:B2:B9:05:A7:C0:61:15:63:EA:FB:13:4F:73:37:D2:FD:8D:FB\n\
  Signature algorithm name: SHA256withDSA\nSubject Public Key Algorithm: 2048-bit\
  \ DSA key\nVersion: 3\n```\n\n如果 Bob 想要检查他获得的是正确的证书，他可以联系 Alice 并通过电话验证证书指纹。\n\n\
  某些证书颁发者会在其网站上发布证书指纹。例如，要检查 `var jdk/lib/security/cacerts` 目录下的 DigiCert 证书，可以使用\
  \ `-list` 参数：\n\n```\nkeytool -list -v -keystore $JAVA_HOME/lib/security/cacerts\n\
  ```\n\n该密钥库的密码为 `changeit`。该密钥库中的证书之一是：\n\n```\nOwner: CN=DigiCert Assured ID Root\
  \ G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nIssuer: CN=DigiCert Assured ID\
  \ Root G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nSerial number: ba15afa1ddfa0b54944afcd24a06cec\n\
  Valid from: Thu Aug 01 14:00:00 CEST 2013 until: Fri Jan 15 13:00:00 CET 2038\n\
  Certificate fingerprints:\n         SHA1: F5:17:A2:4F:9A:48:C6:C9:F8:A2:00:26:9F:DC:0F:48:2C:AB:30:89\n\
  \         SHA256: 7E:37:CB:8B:4C:47:09:0C:AB:36:55:1B:A6:F4:5D:B8:40:68:0F:BA:\n\
  \                 16:6A:95:2D:B1:00:71:7F:43:05:3F:C2\n```\n\n你可以通过访问网站检查你的证书是否有效：[`www.digicert.com/kb/digicert-root-certificates.htm`](https://www.digicert.com/kb/digicert-root-certificates.htm)。\n\
  \n一旦 Bob 信任该证书，他就可以将其导入自己的密钥库：\n\n```\nkeytool -importcert -keystore bob.jks -alias\
  \ alice -file alice.cer\n```\n\n永远不要向密钥库导入你不完全信任的证书。一旦证书被添加到密钥库，任何使用该密钥库的程序都会认为该证书可以用于验证签名。\n\
  \n现在 Alice 可以开始向 Bob 发送签名文档了。jarsigner` 工具用于签名和验证 JAR 文件。Alice 只需将需要签名的文档添加到 JAR\
  \ 文件中：\n\n```\njar cvf document.jar document\n```\n\n### 9.3.5 身份验证问题\n\n确定发送者身份的问题被称为*身份验证问题*。\n\
  \n解决身份验证问题的通常方法很简单。假设陌生人和你共同信任一个熟人。假设该陌生人面见你的熟人，并交给他一个包含公钥的 U 盘。你的熟人随后与你见面，保证该陌生人确实在软件公司工作，并将\
  \ U 盘交给你（见图 9.5）。这样，你的熟人就为陌生人提供了担保。\n\n（图 9.5）\n\n事实上，你的熟人并不需要和你见面。相反，他可以使用他的私钥对陌生人的公钥文件进行签名（见图\
  \ 9.6）。\n\n（图 9.6）\n\n当你获得公钥文件时，你验证朋友的签名，因为信任他，所以确认他确实检查过陌生人的凭据。\n\n然而，你可能并没有共同的熟人。某些信任模型假设存在一条“信任链”一条相互认识的人链，以便你信任链中的每一个成员。在实践中，情况并非总是如此。你可能信任你的朋友\
  \ Alice，你知道 Alice 信任 Bob，但你并不认识 Bob，也不确定是否信任他。其他信任模型假设存在一个仁慈的大哥——一家我们都信任的公司。像 DigiCert、GlobalSign\
  \ 和 Entrust 等拥有令人信赖名称的公司提供了验证服务。\n\n\n\n\n然而，你对实际身份验证的内容应该有合理的预期。你只需填写一个表单并支付一小笔费用即可获得“1\
  \ 级”身份。密钥将发送到证书中包含的电子邮箱地址。因此，你可以合理地认为该电子邮件地址是真实的，但请求者可能填写了 `any` 姓名和组织。还有更严格的身份级别。例如，对于“3\
  \ 级”身份，证书颁发机构将要求个人请求者出现在公证员面前，并会检查企业请求者的财务状况。其他身份验证器会有不同的程序。因此，当你收到一条经过身份验证的消息时，了解实际上是什么经过了验证是非常重要的。\n\
  \n### 9.3.6. 证书签名\n\n在第 9.3.4 节中，你看到了 Alice 如何使用证书向 Bob 分发公钥。然而，Bob 需要通过与 Alice\
  \ 比对指纹来确保该证书的有效性。\n\n假设 Alice 想给她的同事 Cindy 发送一条签名消息，但 Cindy 不想费精力验证大量的签名指纹。现在假设有一个\
  \ Cindy 信任的验证签名的实体。在这个例子中，Cindy 信任 ACME 软件的信息资源部门。\n\n该部门运行着一个*证书颁发机构*（CA）。ACME\
  \ 的每个人的密钥库中 CA 的公钥，由一个仔细检查过密钥指纹的系统管理员安装。CA 对 ACME 员工的密钥进行签名。当他们安装彼此的密钥时，密钥库将无条件信任它们，因为它们是由信任的密钥签名的。\n\
  \n以下是你可以模拟这一过程的方法。创建一个密钥库 `acmesoft.jks`。生成密钥对并导出公钥：\n\n```\nkeytool -genkeypair\
  \ -keystore acmesoft.jks -keyalg DSA -alias acmeroot\nkeytool -exportcert -keystore\
  \ acmesoft.jks -alias acmeroot -file acmeroot.cer\n```\n\n公钥被导出为“自签名”证书。然后，将其添加到每个员工的密钥库中：\n\
  \n```\nkeytool -importcert -keystore cindy.jks -alias acmeroot -file acmeroot.cer\n\
  ```\n\n为了让 Alice 能向 Cindy 以及 ACME 软件的其他人发送消息，她需要向信息资源部门提交证书的签名请求，并让她的密钥通过签名。步骤如下：\n\
  \n```\nkeytool -keystore alice.jks -alias alice -certreq -file alice.req\nkeytool\
  \ -storepass secret -keystore acmesoft.jks -gencert -alias acmeroot \\\n    -infile\
  \ alice.req -outfile alice_signed_by_acmeroot.cer\n```\n\nAlice 将文件 `alice_signedby_acmeroot.cer`\
  \ 给 Cindy 以及 ACME 软件的任何其他人。或者，ACME 软件也可以简单地将文件存储在公司目录中。记住，此文件包含了 Alice 的公钥以及 ACME\
  \ 软件对该密钥确实属于 Alice 的断言。\n\n现在 Cindy 将签名的证书导入她的密钥库中：\n\n```\nkeytool -importcert\
  \ -keystore cindy.jks -alias alice -file alice_signedby_acmeroot.cer\n```\n\n密钥库验证该密钥是由密钥库中已存在的信任根密钥签名的。Cindy*不需要*被要求验证证书指纹。\n\
  \n一旦 Cindy 添加了根证书以及经常向她发送文档的人员证书，在这些证书过期之前，她就不需要再担心证书了。\n\n### 9.3.7. 代码签名\n\n身份验证技术的常见用途是对可执行程序签名。如果你下载了一个程序，你自然会担心它可能造成的破坏。例如，该程序可能被病毒感染。如果你知道代码的来源\
  \ `and` 知道它自离开源点以来未被篡改，那么你的安全感将比没有这些知识时高得多。\n\n在本节中，我将向你展示如何签名 JAR 文件，以及如何配置 Java\
  \ 来验证签名。这种功能是为 applet 和 Java Web Start 应用设计的。这些不再是常用的技术，但你可能在旧产品中仍需要支持它们。\n\n当 Java\
  \ 最初发布时，applet 在加载后立即在“沙箱”中运行，权限有限。如果用户想要可以使用访问本地文件系统、建立网络连接等的 applet，他们必须明确同意。为了确保\
  \ applet 代码在传输过程中未被篡改，必须对其进行数字签名。\n\n这是一个具体的示例。假设在浏览互联网时，你遇到了一个提供运行未知供应商 applet\
  \ 的网站，前提是你授予其相应权限（参见图 9.7）。此类程序由 Java 运行时信任的证书颁发机构颁发的*软件开发者*证书签名。弹出对话框识别了软件开发者和证书颁发者。现在你需要决定是否授权该程序。\n\
  \n![Figure](img/fig09-17.jpg)图 9.7：启动已签名的 applet\n\n你掌握哪些可能影响决策的事实？以下是你所知的：\n\n\
  *   Thawte 向该软件开发者出售了一个证书。\n*   程序确实是用该证书签名的，并且在传输过程中没有被修改。\n*   该证书确实是由 Thawte\
  \ 签名的——它通过本地 `cacerts` 文件中的公钥进行了验证。\n\n当然，这些都不能告诉你代码是否安全。如果你只知道供应商名称以及 Thawte 向他们出售了软件开发者证书的事，你能信任这个供应商吗？这种方法从未有意义。\n\
  \n对于内网部署，证书更为可行。管理员可以在本地机器上安装策略文件和证书，这样启动信任的代码就不需要用户交互。然而，随着安全管理器的弃用，这种方法不再可行。\n\
  \n## 9.4. 加密\n\n到目前为止，我们讨论了 Java 安全 API 实现的一种密码学技术——即通过数字签名进行身份验证。安全的另一个重要方面是加密。即使经过了身份验证，信息本身也是可见的。数字签名仅验证信息没有发生变化。相反，当信息被加密时，它是不可见的。它只能用匹配的密钥解密。\n\
  \n身份验证对于代码签名已经足够——不需要隐藏代码。然而，当应用程序传输机信息（如信用卡和其他个人数据）时，加密是必要的。\n\n过去，专利和出口控制限制了许多公司提供强加密。坦率地说，现在的出口控制已宽松得多，重要算法的专利已经过期。如今，Java\
  \ 作为标准库的一部分提供了优秀的加密支持。\n\n### 9.4.1. 对称密码\n\nJava 密码学扩展包含一个 `Cipher` 类，它是所有加密算法的父类。要获取加密对象，调用\
  \ `getInstance` 方法：\n\n```\nCipher cipher = Cipher.getInstance(algorithmName);\n\
  ```\n\n或者\n\n```\nCipher cipher = Cipher.getInstance(algorithmName, providerName);\n\
  ```\n\nJDK 带有由名为 `\"SunJCE\"` 的提供者提供的算法。如果你不指定另一个提供者名称，它就是默认提供者。如果你需要 Oracle 不支持的特殊算法，你可能需要另一个提供者。\n\
  \n算法名称是一个字符串，例如 `\"AES\"` 或 `\"DES/CBC/PKCS5Padding\"`。\n\n\n\n\n数据加密标准 (DES) 是一种古老的块密码，密钥长度为\
  \ 56 位。如今，DES 算法被认为是过时的，因为可以通过暴力破解来破解。一个更好的替代方案是它的继任者高级加密标准 (AES)。有关 AES 算法的详细描述，请参见\
  \ [`nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf`](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf)。我在示例示例使用了\
  \ AES。\n\n一旦你获得了一个加密对象，可以通过设置模式和密钥来初始化它：\n\n```\nint mode = . . .;\nKey key = .\
  \ . .;\ncipher.init(mode, key);\n```\n\n模式有以下几种：\n\n```\nCipher.ENCRYPT_MODE\nCipher.DECRYPT_MODE\n\
  Cipher.WRAP_MODE\nCipher.UNWRAP_MODE\n```\n\n封装（wrap）和解封装（unwrap）模式用一个密钥加密另一个密钥——请参见下一节的示例。\n\
  \n现在你可以反复调用 `update` 方法来加密数据块：\n\n```\nint blockSize = cipher.getBlockSize();\n\
  var inBytes = new byte[blockSize];\n. . . // 读取 inBytes\nint outputSize= cipher.getOutputSize(blockSize);\n\
  var outBytes = new byte[outputSize];\nint outLength = cipher.update(inBytes, 0,\
  \ outputSize, outBytes);\n. . . // 写入 outBytes\n```\n\n完成后，你必须调用一次 `doFinal` 方法。如果有最后的输入数据块（字节少于\
  \ `blockSize` 字节），调用：\n\n```\noutBytes = cipher.doFinal(inBytes, 0, inLength);\n\
  ```\n\n如果所有输入数据都已加密，则调用：\n\n```\noutBytes = cipher.doFinal();\n```\n\n调用 `doFinal`\
  \ 是为了对最后一个块进行填充（padding）。考虑一下 DES 加密算法。它的块大小为八字节。假设输入数据的最后一个块少于八字节。当然，我们可以用 `0`\
  \ 填充剩余字节，以获得一个八字节的最后一个块并对其进行加密。但当块被解密时，结果将在末尾附加几个 `0` 字节，因此与原始输入文件略有不同。为了避免这个问题，我们需要一种填充方案。一种常用的填充方案是\
  \ RSA Security, Inc. 在《公钥密码标准》(PKCS) #5 中描述的（[`datatracker.ietf.org/doc/html/rfc2898`](https://datatracker.ietf.org/doc/html/rfc2898)）。\n\
  \n在该方案中，最后一个块不是用零值填充，而是用等于填充字节数的数值进行填充。换句话说，如果 `L` 是最后一个（不完全的）块，它的填充方式如下：\n\n```\n\
  L 01                                if length(L) = 7\nL 02 02                  \
  \           if length(L) = 6\nL 03 03 03                          if length(L) =\
  \ 5\n. . .\nL 07 07 07 07 07 07 07              if length(L) = 1\n```\n\n最后，如果输入的长度实际上能被\
  \ 8 整除，则会在输入末尾附加并加密一个块：\n\n```\n08 08 08 08 08 08 08 08\n```\n\n解密后，明文的最后一个字节是需要丢弃的填充字符计数。\n\
  \n### 9.4.2. 密钥生成\n\n为了加密，你需要生成一个密钥。每个加密算法的密钥格式都不同，你需要确保密钥的生成是随机的。遵循以下步骤：\n\n1.\
  \ 为你的算法获取一个 `KeyGenerator`。\n2. 使用随机数源初始化生成器。如果加密算法的块长度是可变的，还要指定所需的块长度。\n3. 调用 `generateKey`\
  \ 方法。\n\n例如，这里是生成 AES 密钥的方法：\n\n```\nKeyGenerator keygen = KeyGenerator.getInstance(\"\
  AES\");\nvar random = new SecureRandom(); // 见下文\nkeygen.init(random);\nKey key\
  \ = keygen.generateKey();\n```\n\n或者，你可以从一个固定的原始数据集中生成密钥（可能派自密码或击键计时）。像这样构造 `SecretKeySpec`（它实现了\
  \ `SecretKey` 接口）：\n\n```\nbyte[] keyData = . . .; // AES 使用 16 字节\nvar key = new\
  \ SecretKeySpec(keyData, \"AES\");\n```\n\n在生成密钥时，确保你使用的是真正的随机数。例如，`Random` 类中的普通随机数生成器以当前日期和时间为种子，其随机性还不够。假设计算机时钟的精确到\
  \ 1/10 秒。那么每天最多只有 864,000 个种子。如果攻击者知道密钥颁发的日期（这通常可以从消息日期或证书过期日期推断出来），生成该当天所有可能的种子是非常容易的。\n\
  \n`SecureRandom` 类生成的随机数比 `Random` 类生成的安全得多。你仍然需要提供一个种子，以便从随机位置开始数字序列。执行此操作的最好方法是从硬件设备（如白噪声生成器）获取随机输入。另一个合理的随机输入源是让用户漫无目的地敲击键盘。这种方法通过随机输入来传递给\
  \ `setSeed` 方法：\n\n```\nvar random = SecureRandom();\nvar b = new byte[20];\n//\
  \ 填充 b 随机位\nrandom.setSeed(b);\n```\n\n这种算法是已知安全的。过去，依赖于计算机组件（如磁盘访问时间）算法是不安全的。这种方法将\
  \ AES 加密算法投入工作。本节末尾的程序通过让线程睡眠并测量它们唤醒的精确时间来获取随机位。如果你不为随机数生成器设置种子，它将是随机的。`crypt` 方法在\
  \ Listing 9.12 中将被重用。要使用该程序，你首先需要生成一个密钥。运行：\n\n```\njava v2ch09.aes.AESDemo -genkey\
  \ secret.key\n```\n\n密钥保存在 `secret.key` 文件中。现在你可以使用命令加密：\n\n```\njava v2ch09.aes.AESDemo\
  \ -encrypt plaintextFile encryptedFile\n```\n\n使用命令解密：\n\n```\njava v2ch09.aes.AESDemo\
  \ -decrypt encryptedFile decryptedFile\n```\n\n程序非常直观。`-genkey` 选项产生一个新的密钥并将其序列化到文件中。`-encrypt`\
  \ 和 `-decrypt` 选项都调用同一个 `crypt` 方法。注意当输入块具有完整长度时调用 `update` 方法，而 `doFinal` 方法要么带有部分输入块（然后进行填充），要么不带额外数据（以生成一个填充块）。\n\
  \nListing 9.12 v2ch09/aes/AESDemo.java\n\n```java\npackage v2ch09.aes;\n\nimport\
  \ module java.base;\n\n/**\n * 此程序测试 AES 加密。它可以生成密钥，\n * 或加密或解密文件。\n */\nclass AESDemo\
  \ {\n    void main(String[] args) throws Exception {\n        if (args[0].equals(\"\
  -genkey\")) {\n            KeyGenerator keygen = KeyGenerator.getInstance(\"AES\"\
  );\n            var random = new SecureRandom();\n            keygen.init(random);\n\
  \            SecretKey key = keygen.generateKey();\n            try (var out = new\
  \ ObjectOutputStream(new FileOutputStream(args[1]))) {\n                out.writeObject(key);\n\
  \            }\n        }\n        else {\n            int mode;\n            if\
  \ (args[0].equals(\"-encrypt\"))\n                mode = Cipher.ENCRYPT_MODE;\n\
  \            else\n                mode = Cipher.DECRYPT_MODE;\n\n            try\
  \ (var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n          \
  \          var in = new FileInputStream(args[1]);\n                    var out =\
  \ new FileOutputStream(args[2])) {\n                var key = (Key) keyIn.readObject();\n\
  \                Cipher cipher = Cipher.getInstance(\"AES\");\n                cipher.init(mode,\
  \ key);\n                Util.crypt(in, out, cipher);\n            }\n        }\n\
  \    }\n}\n```\n\nListing 9.13 v2ch09/aes/Util.java\n\n\n\n\n```java\npackage v2ch09.aes;\n\
  \nimport module java.base;\n\npublic class Util {\n    /**\n     * 使用加密算法变换输入流中的字节，并将这些变换后的字节\n\
  \     * 发送到输出流。\n     * @param in 输入流\n     * @param out 输出流\n     * @param cipher\
  \ 用于变换字节的加密算法实例\n     */\n    public static void crypt(InputStream in, OutputStream\
  \ out, Cipher cipher)\n            throws IOException, GeneralSecurityException\
  \ {\n        int blockSize = cipher.getBlockSize();\n        int outputSize = cipher.getOutputSize(blockSize);\n\
  \        var inBytes = new byte[blockSize];\n        var outBytes = new byte[outputSize];\n\
  \n        int inLength = 0;\n        boolean done = false;\n        while (!done)\
  \ {\n            inLength = in.read(inBytes);\n            if (inLength == blockSize)\
  \ {\n                int outLength = cipher.update(inBytes, 0, blockSize, outBytes);\n\
  \                out.write(outBytes, 0, outLength);\n            }\n           \
  \ else\n                done = true;\n        }\n        if (inLength > 0)\n   \
  \         outBytes = cipher.doFinal(inBytes, 0, inLength);\n        else\n     \
  \       outBytes = cipher.doFinal();\n        out.write(outBytes);\n    }\n}\n```\n\
  \n### `javax.crypto.Cipher` 1.4\n\n* `static Cipher getInstance(String algorithmName)`\n\
  * `static Cipher getInstance(String algorithmName, String providerName)`\n    返回一个实现了指定算法的\
  \ `Cipher` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n* `int getBlockSize()`\n\
  \    返回加密块的大小（以字节为单位），如果加密算法不是块加密，则返回 `0`。\n* `int getOutputSize(int inputLength)`\n\
  \    返回如果下一个输入具有给定数量的字节，则所需的输出缓冲区大小。此方法考虑了加密对象中任何缓冲的字节。\n* `void init(int mode,\
  \ Key key)`\n    初始化加密算法对象。模式为 `ENCRYPT_MODE`、`DECRYPT_MODE`、`WRAP_MODE` 或 `UNWRAP_MODE`\
  \ 之一。\n* `byte[] update(byte[] in)`\n* `byte[] update(byte[] in, int offset, int\
  \ length)`\n* `int update(byte[] in, int offset, int length, byte[] out)`\n    变换一个块输入数据。前两个方法返回输出结果。第三个方法返回放入\
  \ `out` 中的字节数。\n* `byte[] doFinal()`\n* `byte[] doFinal(byte[] in)`\n* `byte[] doFinal(byte[]\
  \ in, int offset, int length)`\n* `int doFinal(byte[] in, int offset, int length,\
  \ byte[] out)`\n    变换最后块输入数据并冲刷该算法对象的缓冲区。前三个方法返回输出结果。第四个方法返回放入 `out` 中的字节数。\n\n\
  ### `javax.crypto.KeyGenerator` 1.4\n\n* `static KeyGenerator getInstance(String\
  \ algorithmName)`\n    返回一个实现了指定算法的 `KeyGenerator` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n\
  * `void init(SecureRandom random)`\n* `void init(int keySize, SecureRandom random)`\n\
  \    初始化密钥生成器。\n* `SecretKey generateKey()`\n    生成新密钥。\n\n### `javax.crypto.spec.SecretKeySpec`\
  \ 1.4\n\n* `SecretKeySpec(byte[] key, String algorithmName)`\n    构造一个密钥规范。\n\n\
  ### 9.4.3. 加密流\n\nJCE 库提供了一组方便的流类，自动加密或解密流数据。例如，以下是如何将数据加密到文件的方法：\n\n```\nCipher\
  \ cipher = . . .;\ncipher.init(Cipher.ENCRYPT_MODE, key);\nvar out = new CipherOutputStream(new\
  \ FileOutputStream(outputFileName), cipher);\nvar bytes = new byte[BLOCKSIZE];\n\
  int inLength = getData(bytes); // 从数据源获取数据\nwhile (inLength != -1) {\n     out.write(bytes,\
  \ 0, inLength);\n     inLength = getData(bytes); // 从数据源获取更多数据\n}\nout.flush();\n\
  ```\n\n同样，你可以使用 `CipherInputStream` 从文件中读取并解密数据：\n\n```\nCipher cipher = . . .;\n\
  cipher.init(Cipher.DECRYPT_MODE, key);\nvar in = new CipherInputStream(new FileInputStream(inputFileName),\
  \ cipher);\nvar bytes = new byte[BLOCKSIZE];\nint inLength = in.read(bytes);\nwhile\
  \ (inLength != -1) {\n    putData(bytes, inLength); // 将数据放入目的地\n    inLength =\
  \ in.read(bytes);\n}\n```\n\n加密流类透明地处理了对 `update` 和 `doFinal` 的调用，这显然非常方便。\n\n###\
  \ `javax.crypto.CipherInputStream` 1.4\n\n* `CipherInputStream(InputStream in, Cipher\
  \ cipher)`\n    构造一个输入流，从 `in` 读取数据并使用给定的 cipher 对其进行解密或加密。\n* `int read()`\n* `int\
  \ read(byte[] b, int off, int len)`\n    从输入流读取数据，并会自动进行解密或加密。\n\n### `javax.crypto.CipherOutputStream`\
  \ 1.4\n\n* `CipherOutputStream(OutputStream out, Cipher cipher)`\n    构造一个输出流，将数据写入\
  \ `out` 并使用给定的 cipher 进行加密或解密。\n* `void write(int ch)`\n* `void write(byte[] b,\
  \ int off, int len)`\n    写入输出流，并会自动进行加密或解密。\n* `void flush()`\n    冲刷缓冲区，如果需要进行填充。\n\
  \n### 9.4.4. 公钥加密\n\n对称加密的致命缺陷是密钥分发。公钥加密解决了这个问题。在公钥加密中，Bob 拥有一对密钥：公钥和匹配私钥。Bob 可以将公钥发布在任何地方，但必须严密保护私钥。Alice\
  \ 使用公钥加密消息。\n\n实际上，情况并非如此简单。所有知的公钥算法都比 DES 或 AES 等对称算法慢得多。使用公钥算法加密大量信息是不切行的。但是通过结合公钥算法和对称算法可以轻松解决这个问题：\n\
  \n1. Alice 生成一个随机对称密钥。她使用它加密明文。\n2. Alice 用 Bob 的公钥加密密钥。\n3. Alice 将加密后的密钥和加密后的明文发送给\
  \ Bob。\n4. Bob 使用他的私钥解密密钥。\n5. Bob 使用解密后的密钥解密消息。\n\n只有 Bob 能解密对称密钥，因为只有 Bob 有解密的私钥。因此，昂贵的公钥加密仅用于少量的密钥数据。\n\
  \n最常用的公钥算法是是由 Rivest、Shamir 和 Adleman 发明的 RSA 算法。直到 2000 年，该算法一直受属于 RSA Security,\
  \ Inc. 的专利保护。许可费用并不便宜——通常为 3% 的使用费，每年最低支付额为 5 万美元。现在该算法已进入公共领域。\n\n使用 RSA 算法需要一对公/私钥。像如下所示使用\
  \ `KeyPairGenerator`：\n\n```java\nKeyPairGenerator pairgen = KeyPairGenerator.getInstance(\"\
  RSA\");\nvar random = new SecureRandom();\npairgen.initialize(KEYSIZE, random);\n\
  KeyPair keyPair = pairgen.generateKeyPair();\nKey publicKey = keyPair.getPublic();\n\
  Key privateKey = keyPair.getPrivate();\n```\n\n列表 9.14 程序有三个选项。`-genkey` 产生密钥对。`-encrypt`\
  \ 生成一个 AES 密钥并用公钥将其封装。\n\n```java\nKey key = . . .; // 一个 AES 密钥\nKey publicKey\
  \ = . . .; // 一个 RSA 公钥\nCipher cipher = Cipher.getInstance(\"RSA\");\ncipher.init(Cipher.WRAP_MODE,\
  \ publicKey);\nbyte[] wrappedKey = cipher.wrap(key);\n```\n\n\n\n\n它随后生成一个包含以下内容的文件：\n\
  \n*   封装密钥的长度\n*   封装密钥字节\n*   使用 `AES` 密钥加密的明文\n\n`-decrypt` 选项用于解密此类文件。要尝试该程序，首先生成\
  \ RSA 密钥：\n\n```\njava v2ch09.rsa.RSADemo -genkey public.key private.key\n```\n\n\
  然后加密一个文件：\n\n```\njava v2ch09.rsa.RSADemo -encrypt plaintextFile encryptedFile public.key\n\
  ```\n\n最后，解密它并验证解密后的文件是否与明文匹配：\n\n```\njava v2ch09.rsa.RSADemo -decrypt encryptedFile\
  \ decryptedFile private.key\n```\n\n列表 9.14 `v2ch09/rsa/RSADemo.java`\n\n```java\n\
  package v2ch09.rsa;\n\nimport module java.base;\n\nimport v2ch09.aes.Util;\n\n/**\n\
  \ * 此程序测试 RSA 加密算法。它可以生成公钥和私钥对，\n * 或对文件进行加密或解密。\n */\nclass RSADemo {\n    final\
  \ int KEYSIZE = 512;\n\n    void main(String[] args) throws Exception {\n      \
  \  if (args[0].equals(\"-genkey\")) {\n            KeyPairGenerator pairgen = KeyPairGenerator.getInstance(\"\
  RSA\");\n            var random = new SecureRandom();\n            pairgen.initialize(KEYSIZE,\
  \ random);\n            KeyPair keyPair = pairgen.generateKeyPair();\n         \
  \   try (var out = new ObjectOutputStream(new FileOutputStream(args[1]))) {\n  \
  \              out.writeObject(keyPair.getPublic());\n            }\n          \
  \  try (var out = new ObjectOutputStream(new FileOutputStream(args[2]))) {\n   \
  \             out.writeObject(keyPair.getPrivate());\n            }\n        }\n\
  \        else if (args[0].equals(\"-encrypt\")) {\n            KeyGenerator keygen\
  \ = KeyGenerator.getInstance(\"AES\");\n            var random = new SecureRandom();\n\
  \            keygen.init(random);\n            SecretKey key = keygen.generateKey();\n\
  \n            // 使用 RSA 公钥进行封装\n            try (var keyIn = new ObjectInputStream(new\
  \ FileInputStream(args[3]));\n                    var out = new DataOutputStream(new\
  \ FileOutputStream(args[2]));\n                    var in = new FileInputStream(args[1]))\
  \ {\n                var publicKey = (Key) keyIn.readObject();\n               \
  \ Cipher cipher = Cipher.getInstance(\"RSA\");\n                cipher.init(Cipher.WRAP_MODE,\
  \ publicKey);\n                byte[] wrappedKey = cipher.wrap(key);\n         \
  \       out.writeInt(wrappedKey.length);\n                out.write(wrappedKey);\n\
  \n                cipher = Cipher.getInstance(\"AES\");\n                cipher.init(Cipher.ENCRYPT_MODE,\
  \ key);\n                Util.crypt(in, out, cipher);\n            }\n        }\n\
  \        else {\n            try (var in = new DataInputStream(new FileInputStream(args[1]));\n\
  \                    var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n\
  \                    var out = new FileOutputStream(args[2])) {\n              \
  \  int length = in.readInt();\n                var wrappedKey = new byte[length];\n\
  \                in.read(wrappedKey, 0, length);\n\n                // 使用 RSA 私钥进行解封装\n\
  \                var privateKey = (Key) keyIn.readObject();\n\n                Cipher\
  \ cipher = Cipher.getInstance(\"RSA\");\n                cipher.init(Cipher.UNWRAP_MODE,\
  \ privateKey);\n                Key key = cipher.unwrap(wrappedKey, \"AES\", Cipher.SECRET_KEY);\n\
  \n                cipher = Cipher.getInstance(\"AES\");\n                cipher.init(Cipher.DECRYPT_MODE,\
  \ key);\n\n                Util.crypt(in, out, cipher);\n            }\n       \
  \ }\n    }\n}\n```\n\n在本章中，你初步接触了类加载器，并了解了 Java 库提供的身份验证和加密服务。在此过程中，你或许曾流下泪水，因为那种基于安全管理器和代码签名的经典\
  \ Java 安全架构现在已成为遥远的记忆。\n\n在下一章中，我们将深入探讨高级的 Swing 和图形编程。\n\n# 第 10 章 图形用户界面编程\n\n\
  Java 诞生时，大多数计算机用户通过图形用户界面（GUI）与桌面应用程序进行交互。如今，基于浏览器的移动应用已更为常见，但在某些情况下，提供桌面应用程序仍然很有用的。此外，许多教师和学生喜欢通过\
  \ GUI 应用程序学习 Java。在本章及接下来的章节中，我将使用 `Swing` 工具包讨论用户界面编程的基础。\n\n`第 12 章` 涵盖了更多生成服务器图像的高技巧。如果你对编写\
  \ GUI 和图形程序不感兴趣，可以安全地跳过这些章节。\n\n## 10.1 Java 用户界面工具包的历史\n\n当 Java 1.0 引入时，它包含一个名为抽象窗口工具包（`AWT`）的类库，用于基本的\
  \ GUI 编程。基础的 `AWT` 库通过将元素的创建和行为委托给每个目标平台（Windows、Linux、Macintosh 等）上的原生 GUI 工具包来处理用户界面元素。例如，如果你使用原始\
  \ `AWT` 在 Java 窗口上放置文本框，底层的“对等（peer）”文本框实际上负责文本输入。理论上，生成的程序可以在这些任何一个平台上运行，并具有目标平台的“外观和感觉”。\n\
  \n基于对等（peer-based）的方法对于简单应用程序效果良好，但很快发现，要编写一个依赖原生用户界面元素的高质量可移植图形库是极其困难的。菜单、滚动条和文本字段等用户界面元素在不同平台上可能存在细微差异。因此，通过这种方法很难给用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ X11/Motif）并不像 Windows 或 Macintosh 那样拥有丰富的组件。这进一步限制了基于“最小公约”方法的库。结果是，使用 `AWT` 构建的\
  \ GUI 应用程序并不像原生 Windows 或 Macintosh 应用那样，也不具备用户期待的功能。更令人沮丧的是 `AWT` 用户界面库在不同平台上存在不同的\
  \ Bug。开发者抱怨他们必须在每个平台上测试应用程序——这种做法被讽刺地称为“编写一次，到处调试”。\n\n1996 年，Netscape 创建了一个名为 `IFC`\
  \ 的 GUI 库，它采用了完全不同的方法。用户界面元素（如按钮、菜单等）被绘制在空白窗口上。底层窗口系统只需要能够显示窗口并在上面进行绘制。因此，Netscape\
  \ 的 `IFC` 组件无论程序运行在哪个平台上，其外观和行为都是相同的。太阳公司与 Netscape 合作完善了这种方法，创建了一个代号为“Swing”的用户界面库。Swing\
  \ 作为 Java 1.1 的扩展可用，并在 Java 1.2 中成为标准库的一部分。\n\n`Swing` 现在是这种非对等 GUI 工具包的官方名称。\n\n\
  `Swing` 并不是完全替代 `AWT`——它是构建在 `AWT` 架构之上的。`Swing` 只是提供了更强大的用户界面组件。每当你编写一个 `Swing`\
  \ 程序时，你都会使用 `AWT` 的基础——特别是事件处理。从现在起，当我说“Swing”时，指的是那些“绘制”的用户界面类；而当我说“AWT”时，指的是窗口工具包的底层机制，例如事件处理。\n\
  \n\n\nSwing 必须努力工作来绘制用户界面的每一个像素。当 Swing 首次发布时，用户抱怨它很慢。（如果你在树莓派等硬件上运行 Swing 应用程序，仍然能感受到这个问题。）过了一段时间，台式电脑变得越来越快，用户又抱怨\
  \ Swing 丑了——事实上，它已经落后于那些经过动画和华丽效果装饰的原生控件。更令人不安的是，Adobe Flash 被越来越多地创建具有更酷炫效果的用户界面，而这些界面完全没有使用原生控件。\n\
  \n2007 年，太阳微系统公司（Sun Microsystems）引入了一个完全不同的用户界面工具包，称为 `JavaFX`，作为 Flash 的竞争对手。它运行在\
  \ `Java VM` 上，但有其自己的编程语言，称为 `JavaFX Script`。该语言针对编程动画和华丽效果进行了优化。程序员对需要学习一种新语言感到不满，他们大量流失。2011\
  \ 年，甲骨文（Oracle）发布了新版本 `JavaFX 2.0`，它拥有 `Java API`且不再需要单独的编程语言。从 `Java 7` 更新 6 开始，`JavaFX`\
  \ 被封装在 `JDK` 和 `JRE` 中。然而，从 `Java 11` 开始，这种封装被停止了。\n\n由于这是一本关于 Java 核心语言和 API 的书，我将专注于\
  \ Swing 的用户界面编程。\n\n## 10.2. 显示 Frame\n\n顶层窗口（即不包含在另一个窗口内的窗口）在 Java 中被称为 `frame`。`AWT`\
  \ 库有一个名为 `Frame` 的类用于这种顶层窗口。该类的 Swing 版本被称为 `JFrame`，它并继承自 `Frame` 类。`JFrame` 是少数几个不是在画布上绘制的\
  \ Swing 组件之一。因此，装饰（按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由 Swing 绘制。\n\n大多数 Swing 组件类以“J”开头：`JButton`、`JFrame`\
  \ 等。存在如 `Button` 和 `Frame` 这样的类，但它们是 `AWT` 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing\
  \ 和 `AWT` 组件的混合会导致视觉和行为上的不一致。\n\n### 10.2.1. 创建 Frame\n\n在本节中，我们将介绍处理 Swing `JFrame`\
  \ 的最常用方法。列表 10.1 列出了一个简单的程序，在屏幕上显示一个空 frame，如图 10.1 所示。\n\n![Figure](img/simpleframetest.jpg)图\
  \ 10.1: 最简单的可见 frame 列表 10.1 v2ch10/simpleFrame/SimpleFrameDemo.java\n\n```\npackage\
  \ v2ch10.simpleFrame;\n\nimport module java.desktop;\n\nclass SimpleFrameDemo {\n\
  \    void main() {\n        EventQueue.invokeLater(() -> {\n            var frame\
  \ = new SimpleFrame();\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\nclass SimpleFrame\
  \ extends JFrame {\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n    public SimpleFrame() {\n       \
  \ setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\n让我们逐行分析这个程序。\n\nSwing\
  \ 类存放在 `javax.swing` 包中。包名 `java.x` 表示这是一个 Java 扩展包，而不是核心包。出于历史原因，Swing 被认为是一个扩展。然而，自\
  \ 1.2 版本以来，它在每个 Java 实现中都存在。\n\n默认情况下，frame 的大小是相当没意义的 0×0 像素。我们定义了一个子类 `SimpleFrame`，其构造函数将大小设置为\
  \ 300×200 像素。这是 `SimpleFrame` 和 `JFrame` 之间唯一的区别。\n\n在 `SimpleFrameDemo` 类的 `main`\
  \ 方法中，我们构造了一个 `SimpleFrame` 对象并使其可见。\n\n在每个 Swing 程序中，我们都需要处理两个技术问题。\n\n首先，所有的 Swing\
  \ 组件都必须从*事件分发线程*（event dispatch thread）进行配置，该线程是将鼠标点击和按键等事件传递给用户界面组件的控制线程。以下代码片段用于在事件分发线程中执行语句：\n\
  \n```\nEventQueue.invokeLater(() -> {\n    statements\n});\n```\n\n你会看到许多 Swing\
  \ 程序没有在事件分发线程中初始化用户界面。过去在主线程中进行初始化是完全可以的。遗憾的是，随着 Swing 组件变得越来越复杂，`JDK` 的开发者不再能保证那种方法的安全性。错误发生的概率极低，但你不想成为那少数遇到间歇性问题的倒霉蛋之一。做正确的事情比较好，即使代码看起来相当神秘。\n\
  \n接下来，我们定义了当用户关闭应用程序的 frame 时应该发生什么。对于这个特定的程序，我们希望程序退出。为了选择这种行为，我们使用语句：\n\n```\n\
  frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n在其他具有多个 frame 的程序中，你不希望程序因为用户关闭了其中一个\
  \ frame 就退出。默认情况下，当用户关闭 frame 时，它会被隐藏，但程序不会终止。（如果程序在*最后一个* frame 变得不可见时能够终止可能会很好，但这不是\
  \ Swing 的工作方式。）\n\n仅仅构造 frame 不会自动显示它。Frame 的生命开始时是隐藏的。这给了程序员在显示它之前向 frame 添加组件的机会。要显示\
  \ frame，`main` 方法调用 frame 的 `setVisible` 方法。\n\n调度初始化后，`main` 方法退出。运行的程序如图 10.1\
  \ 所示——它是真正的顶层窗口。如如图所示，标题栏和周围的装饰（如调整角）是由操作系统绘制的，而不是 Swing 库。Swing 库绘制 frame 内部的一切。\n\
  \n### 10.2.2. Frame 属性\n\n`JFrame` 类本身只有几个更改 frame 外的方法。当然，通过继承的魔法，处理 frame 大小和位置的方法大多来自各种父类。这里是一些重要的方法：\n\
  \n*   `setLocation` 和 `setBounds` 方法用于设置 frame 的位置\n*   `setIconImage` 方法用于告诉窗口系统在标题栏、任务切换器等处显示哪个图标\n\
  *   `setTitle` 方法用于更改标题栏中的文本\n*   `setResizable` 方法，接受一个 `boolean` 值来判断 frame 是否可以由用户调整\n\
  \n图 10.2 展示了 `JFrame` 类的继承层次。\n\n正如 API 注释所示，`Component` 类（所有 GUI 对象的祖先）和 `Window`\
  \ 类（`Frame` 类的父类）是你需要查找调整和重塑 frame 方法的地方。例如，`Component` 类中的 `setLocation` 方法是重新定位组件的一种方法。如果你调用\n\
  \n```\nsetLocation(x, y)\n```\n\n左上角将横向 `x` 像素、向下 `y` 像素，其中 (0, 0) 是屏幕的左上角。同样，`Component`\
  \ 中的 `setBounds` 方法允许在一步内调整大小并定位组件（特别是 `JFrame`），如下：\n\n```\nsetBounds(x, y, width,\
  \ height)\n```\n\n许多类的方法以 getter/setter 对的形式出现，例如 `Frame` 类的以下方法：\n\n\n\n\n\n```\n\
  public String getTitle()\npublic void setTitle(String title)\n```\n\n这样的 getter/setter\
  \ 方法对被称为一个 `property`（属性）。一个属性有一个名称和一种类型。名称通过将 `get` 或 `set` 之后的第一个字母改为小写来获得。例如，`Frame`\
  \ 类有一个名为 `title` 类型为 `String` 的属性。\n\n从概念上说，`title` 是帧（frame）的一个属性。当我们设置该属性时，我们期望用户屏幕上的标题会发生变化。当我们获取该属性时，我们期望获得之前设置的值。\n\
  \n`get`/`set` 惯例有一个例外：对于 `boolean` 类型的属性，getter 以 `is` 开头。例如，以下两个方法定义了 `resizable`\
  \ 属性：\n\n```java\npublic boolean isResizable()\npublic void setResizable(boolean\
  \ resizable)\n```\n\n要确定帧合适的尺寸，首先要找到屏幕尺寸。调用 `Toolkit` 类的静态方法 `getDefaultToolkit`\
  \ 来获取 `Toolkit` 对象。（`Toolkit` 类是各种与原生窗口系统接口的方法的汇聚地。）然后调用 `getScreenSize` 方法，该方法返回一个\
  \ `Dimension` 对象的屏幕尺寸。一个 `Dimension` 对象同时存储宽度和高度，存储在公共(!) 的实例字段 `width` 和 `height`\
  \ 中。然后你可以使用屏幕尺寸的适当比例来调整帧的大小。以下是代码：\n\n```java\nToolkit kit = Toolkit.getDefaultToolkit();\n\
  Dimension screenSize = kit.getScreenSize();\nint screenWidth = screenSize.width;\n\
  int screenHeight = screenSize.height;\nsetSize(screenWidth / 2, screenHeight / 2);\n\
  ```\n\n你还可以提供一个帧图标：\n\n```java\nImage img = new ImageIcon(\"icon.gif\").getImage();\n\
  setIconImage(img);\n```\n\n### `java.awt.Component` 1.0\n\n* `boolean isVisible()`\n\
  * `void setVisible(boolean b)`: 获取或设置 `visible` 属性。组件初始是可见的，顶层组件（如 `JFrame`）除外。\n\
  * `void setSize(int width, int height)` 1.1: 将组件调整为指定的宽度的高度。\n* `void setLocation(int\
  \ x, int y)` 1.1: 将组件移动到新位置。如果组件不是顶层组件，则 `x` 和 `y` 坐标使用容器的坐标；如果组件是顶层的（例如 `JFrame`），则使用屏幕坐标。\n\
  * `void setBounds(int x, int y, int width, int height)` 1.1: 移动并调整此组件的大小。\n* `Dimension\
  \ getSize()` 1.1\n* `void setSize(Dimension d)` 1.1: 获取或设置此组件的 `size` 属性。\n\n###\
  \ `java.awt.Frame` 1.0\n\n* `boolean isResizable()`\n* `void setResizable(boolean\
  \ b)`: 获取或设置 `resizable` 属性。设置属性后，用户可以调整帧的大小。\n* `String getTitle()`\n* `void setTitle(String\
  \ s)`: 获取或设置 `title` 属性，该属性决定帧标题栏中的文本。\n* `Image getIconImage()`\n* `void setIconImage(Image\
  \ image)`: 获取或设置 `iconImage` 属性，该属性决定帧的图标。窗口系统可能会将图标作为帧装饰的一部分或其他位置显示。\n\n### `java.awt.Toolkit`\
  \ 1.0\n\n* `static Toolkit getDefaultToolkit()`: 返回此平台的默认工具包。\n* `Dimension getScreenSize()`:\
  \ 获取用户屏幕的尺寸。\n\n### `javax.swing.ImageIcon` 1.2\n\n* `ImageIcon(String filename)`:\
  \ 构造一个图像存储在文件中图标。\n* `Image getImage()`: 获取此图标的图像。\n\n## 10.3. 在组件中显示信息\n\n在本节中，我将向你展示如何在帧内部显示信息（图\
  \ 10.3）。\n\n![Figure](img/nothelloworld.jpg)图 10.3: 显示信息的帧\n\n你可以直接将消息字符串绘制到帧上，但这被认为不是良好的编程实践。在\
  \ Java 中，帧的设计实际上是为了作为组件的容器，例如菜单栏和其他用户界面元素。你通常在添加到帧中的另一个组件上进行绘制。\n\n`JFrame` 的结构复杂得惊人。看一眼图\
  \ 10.4，它显示了 `JFrame` 的组成部分。如你所见，四个面板在 `JFrame` 中层层堆叠的。根面板（root pane）、分层面板（layered\
  \ pane）和玻璃面板（glass pane）对我们没有意义；它们用于组织菜单栏和内容面板并实现外观和感觉（look-and-feel）。Swing 程序员最关注的部分是内容面板\
  \ `content pane`。你添加到帧的任何组件都会自动放入内容面板中：\n\n```java\nComponent c = . . .;\nframe.add(c);\
  \ // 添加到内容面板\n```\n\n.图 10.4: JFrame 的内部结构\n\n在我们的情况下，我们想向帧添加一个单一组件，并在其上绘制消息。要在组件上绘制，你需要定义一个扩展\
  \ `JComponent` 的类，并重写该类中的 `paintComponent` 方法。\n\n`paintComponent` 方法有一个 `Graphics`\
  \ 类型的参数。`Graphics` 对象记得绘制设置，例如字体或当前颜色。我们的 `paintComponent` 方法如下：\n\n```java\nclass\
  \ NotHelloWorldComponent extends JComponent {\n    public void paintComponent(Graphics\
  \ g) {\n        g.drawString(\"Not a Hello, World program\", 75, 100);\n    }\n\
  }\n```\n\n每当窗口需要重绘时，所有组件的 `paintComponent` 方法都会被执行。永远不要自己调用 `paintComponent` 方法。它是自动调用的。\n\
  \n如果你需要强制重绘屏幕，请调用 `repaint` 方法而不是 `paintComponent`。`repaint` 方法会导致所有组件调用 `paintComponent`，并传入一个配置适当的\
  \ `Graphics` 对象。\n\n最后，组件应该告诉用户它希望有多大。重写 `getPreferredSize` 方法并返回一个 `Dimension`\
  \ 类对象，其中包含首选的宽度高度：\n\n```java\npublic class NotHelloWorldComponent extends JComponent\
  \ {\n    private static final int DEFAULT_WIDTH = 300;\n    private static final\
  \ int DEFAULT_HEIGHT = 200;\n    . . .\n    public Dimension getPreferredSize()\
  \ {\n        return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\
  \n当你用一个或多个组件填充帧并且简单地使用它们的首选尺寸时，请调用 `pack` 方法而不是 `setSize` 方法。\n\n\n\n\n\n```java\
  \ class NotHelloWorldFrame extends JFrame {\n    public NotHelloWorldFrame() {\n\
  \        add(new NotHelloWorldComponent());\n        pack();\n    }\n}\n```\n\n\
  列表 10.2 显示了完整的代码。\n\nListing 10.2 v2ch10/notHelloWorld/NotHelloWorld.java\n\n```java\n\
  package v2ch10.notHelloWorld;\n\nimport module java.desktop;\n\nclass NotHelloWorld\
  \ {\n    void main() {\n        EventQueue.invokeLater(() -> {\n            var\
  \ frame = new NotHelloWorldFrame();\n            frame.setTitle(\"NotHelloWorld\"\
  );\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        \
  \    frame.setVisible(true);\n        });\n    }\n}\n\n/**\n * 一个包含消息面板的帧。\n */\n\
  class NotHelloWorldFrame extends JFrame {\n    public NotHelloWorldFrame() {\n \
  \       add(new NotHelloWorldComponent());\n        pack();\n    }\n}\n\n/**\n *\
  \ 一个显示消息的组件。\n */\nclass NotHelloWorldComponent extends JComponent {\n    public\
  \ static final int MESSAGE_X = 75;\n    public static final int MESSAGE_Y = 100;\n\
  \n    private static final int DEFAULT_WIDTH = 300;\n    private static final int\
  \ DEFAULT_HEIGHT = 200;\n\n    public void paintComponent(Graphics g) {\n      \
  \  g.drawString(\"Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n    }\n\n\
  \    public Dimension getPreferredSize() {\n        return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n    }\n}\n```\n\n`javax.swing.JFrame` 1.2\n\n*   `Component\
  \ add(Component c)`\n    将给定的组件添加到此帧的内容面板并返回该组件。\n\n`java.awt.Component` 1.0\n\n\
  *   `void repaint()`\n    导致组件“尽快”进行重绘。\n\n*   `Dimension getPreferredSize()`\n\
  \    是要重写的方法，用于返回此组件的首选尺寸。\n\n`javax.swing.JComponent` 1.2\n\n*   `void paintComponent(Graphics\
  \ g)`\n    是要重写的方法，用于描述你的组件如何如何绘制。\n\n`java.awt.Window` 1.0\n\n*   `void pack()`\n\
  \    调整此窗口的大小，并考虑其组件的首选尺寸。\n\n### 10.3.1. 使用 2D 形状\n\n从 Java 1.0 开始，`Graphics` 类已经有了绘制直线、矩形、椭圆等的方法。但那些绘制操作非常有限。相反，我们将使用\
  \ `Java 2D` 库中的形状类。\n\n要使用此库，你需要获取一个 `Graphics2D` 类的对象。该类是 `Graphics` 类的子类。从 Java\
  \ 1.2 开始，像 `paintComponent` 等方法会自动接收一个 `Graphics2D` 类的对象。只需进行类型转换，如下：\n\n```java\n\
  \ public void paintComponent(Graphics g) {\n    Graphics2D g2 = (Graphics2D) g;\n\
  \    . . .\n}\n```\n\nJava 2D 库以面向对象的方式组织几何形状。特别是，有类来表示线、矩形和椭圆：\n\n```\nLine2D\n\
  Rectangle2D\nEllipse2D\n```\n\n这些类都实现了 `Shape` 接口。Java 2D 库支持更复杂的形状——弧、二次和三次曲线以及通用路径——这些在本章中不会讨论。\n\
  \n要绘制一个形状，你首先创建一个实现 `Shape` 接口的类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```java\n\
  Rectangle2D rect = . . .;\ng2.draw(rect);\n```\n\nJava 2D 库使用浮点坐标而不是整数作为像素。内部计算使用单精度\
  \ `float` 数值进行。单精度就足够了——毕竟，几何计算的终极目的是在屏幕或打印机上设置像素。只要任何舍入误差保持在一个像素以内，视觉结果就不会受到影响。\n\
  \n然而，对于程序员来说，操作 `float` 值有时是不方便的，因为 Java 固执要求在将 `double` 值转换为 `float` 值时必须进行类型转换。例如，考虑以下语句：\n\
  \n```java\nfloat f = 1.2; // 错误--可能会丢失精度\n```\n\n该语句无法编译，因为常量 `1.2` 的类型是 `double`，编译器担心丢失精度。解决办法是给浮点常量添加一个\
  \ `F` 后缀：\n\n```java\nfloat f = 1.2F; // 正确\n```\n\n现在考虑这条语句：\n\n```java\nfloat\
  \ f = r.getWidth(); // 错误\n```\n\n该语句同样无法编译，原因相同。`getWidth` 方法返回一个 `double`。这次的解决办法是提供一个类型转换：\n\
  \n```java\nfloat f = (float) r.getWidth(); // 正确\n```\n\n这些后缀和转换有点麻烦，所以 2D 库的设计者决定为每个形状类提供`两个版本`：一个是带有\
  \ `float` 坐标的（为了节省程序员），另一个带有 `double` 坐标的（为了懒程序员）（在书中，我们属于第二阵营，尽可能使用 `double` 坐标。）\n\
  \n库的设计者选择了一种奇妙的机制来封装这些选择。考虑 `Rectangle2D` 类。这是一个抽象类，有两个具体的子类，这些子类也是静态嵌套类：\n\n```\n\
  Rectangle2D\nRectangle2D\n```\n\n图 10.5 显示了继承关系。\n\n.图 10.5: 2D 矩形\n\n对于 `Rectangle2D`\
  \ 讨论的内容适用于其他形状类。此外，还有一个 `Point2D` 类，拥有 `Point2D.Float` 和 `Point2D.Double` 子类。创建点的方法如下：\n\
  \n```java\nvar p = new Point2D.Double(10, 20);\n```\n\n`Rectangle2D` 和 `Ellipse2D`\
  \ 都继承自父类 `RectangularShape`。诚然，椭圆不是矩形，但它们有一个*边界矩形*（参见图 10.6）。\n\n.图 10.6: 椭圆的边界矩形\n\
  \n`RectangularShape` 类定义了 20 多个适用于这些形状的方法，例如 `getWidth`、`getHeight`、`getCenterX`\
  \ 和 `getCenterY`（遗憾的是，在此时，还没有一个以 `Point2D` 对象形式返回中心的 `getCenter` 方法）。\n\n最后，一些来自\
