  \ Object showInternalInputDialog(Component parent, Object message, String title,\
  \ int messageType, Icon icon, Object[] values, Object default)`\n* `static String\
  \ showInternalInputDialog(Component parent, Object message, String title, int messageType)`\n\
  * `static String showInternalInputDialog(Component parent, Object message)`\n  显示输入对话框或内部输入对话框。（内部对话框完全在其所有者的框内渲染）。返回用户输入的字符串，如果用户取消了对话框，则返回\
  \ `null`。父组件可以为 `null`。在对话框上显示的消息可以是字符串、图标、组件或它们的数组。`messageType` 参数是 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`\
  \ 或 `PLAIN_MESSAGE` 之一。\n\n\n\n\n在上一节中，你已经看到如何使用 `JOptionPane` 类来显示简单的对话框。在本节中，你将看到如何手动创建一个这样的对话框。\n\
  \n图 11.31 显示了一个典型的模态对话框——当用户点击“关于（About）”按钮时显示的程序信息框。\n\n![Figure](img/dialogtest.jpg)图\
  \ 11.31：关于对话框\n\n要实现对话框，你需要扩展 `JDialog` 类。这与为应用程序的主窗口扩展 `JFrame` 的过程本质上是相同的。具体步骤如下：\n\
  \n1. 在你的对话框的构造函数中，调用父类 `JDialog` 的构造函数。\n2. 添加对话框的用户界面组件。\n3. 添加事件处理器。\n4. 设置对话框的大小。\n\
  \n当你调用父类构造函数时，你需要提供*所有者帧（owner frame）*、对话框的标题以及*模态（modality）*。\n\n所有者帧控制对话框显示的位置。你可以提供\
  \ `null` 作为所有者；这样，对话框将由一个隐藏的帧所有。\n\n模态指定了在对话框显示时应用程序的哪些其他窗口会被阻塞。非模态对话框（modeless\
  \ dialog）不会阻塞其他窗口。模态对话框（modal dialog）会阻塞应用程序的所有其他窗口（对话框的子窗口除外）。你可以可以使用用户可以始终访问的工具框。相反，如果你想强制用户在继续之前提供必需的信息，则应使用模态对话框。\n\
  \n以下是对话框的代码：\n\n```\npublic class AboutDialog extends JDialog {\n    public AboutDialog(JFrame\
  \ owner) {\n        super(owner, \"About DialogTest\", true);\n        add(new JLabel(\n\
  \            \"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"),\n\
  \            BorderLayout.CENTER);\n        var panel = new JPanel();\n        var\
  \ ok = new JButton(\"OK\");\n\n        ok.addActionListener(_ -> setVisible(false));\n\
  \        panel.add(ok);\n        add(panel, BorderLayout.SOUTH);\n        setSize(250,\
  \ 150);\n    }\n}\n```\n\n如你所示，构造函数添加了用户界面元素——在本例中，是标签和按钮。它为按钮添加了处理器，并设置了对话框的大小。\n\
  \n要显示对话框，创建一个新的对话框对象并使其可见：\n\n```\nvar dialog = new AboutDialog(this);\ndialog.setVisible(true);\n\
  ```\n\n实际上，在下面的示例代码中，我们只创建了一次对话框，当用户点击“关于”按钮时都可以复用它。\n\n```\nif (dialog == null)\
  \ // 第一次\n    dialog = new AboutDialog(this);\ndialog.setVisible(true);\n```\n\n\
  当用户点击 OK 按钮时，对话框应该关闭。这在 OK 按钮的事件处理器中处理：\n\n```\nok.addActionListener(_ -> setVisible(false));\n\
  ```\n\n当用户点击关闭按钮关闭对话框时，对话框也会隐藏。就像 `JFrame` 一样，你可以通过 `setDefaultCloseOperation` 方法覆盖此行为。\n\
  \n列表 11.11 是测试程序帧类的代码。列表 11.12 显示了对话框类。\n\n列表 11.11 v2ch11/dialog/DialogFrame.java\n\
  \n```java\npackage v2ch11.dialog;\n\nimport module java.desktop;\n\n/**\n * 一个带有菜单的帧，其\
  \ File->About 操作会显示一个对话框。\n */\npublic class DialogFrame extends JFrame {\n    private\
  \ static final int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT\
  \ = 200;\n    private AboutDialog dialog;\n\n    public DialogFrame() {\n      \
  \  setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 构建一个 File 菜单\n\n      \
  \  var menuBar = new JMenuBar();\n        setJMenuBar(menuBar);\n        var fileMenu\
  \ = new JMenu(\"File\");\n        menuBar.add(fileMenu);\n\n        // 添加 About\
  \ 和 Exit 菜单项\n\n        // About 项显示 关于对话框\n\n        var aboutItem = new JMenuItem(\"\
  About\");\n        aboutItem.addActionListener(_ -> {\n            if (dialog ==\
  \ null) // 第一次\n                dialog = new AboutDialog(DialogFrame.this);\n  \
  \          dialog.setVisible(true); // 弹出对话框\n        });\n        fileMenu.add(aboutItem);\n\
  \n        // Exit 项退出程序\n\n        var exitItem = new JMenuItem(\"Exit\");\n   \
  \     exitItem.addActionListener(_ -> System.exit(0));\n        fileMenu.add(exitItem);\n\
  \    }\n}\n```\n\n列表 11.12 v2ch11/dialog/AboutDialog.java\n\n```java\npackage v2ch11.dialog;\n\
  \nimport module java.desktop;\n\n/**\n * 一个示例模态对话框，用于显示一条消息并等待用户点击 OK 按钮。\n */\n\
  public class AboutDialog extends JDialog {\n    public AboutDialog(JFrame owner)\
  \ {\n        super(owner, \"About DialogTest\", true);\n\n        // 添加 HTML 标签到中心\n\
  \n        add(new JLabel(\"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"\
  ),\n                BorderLayout.CENTER);\n\n        // OK 按钮关闭对话框\n\n        var\
  \ ok = new JButton(\"OK\");\n        ok.addActionListener(_ -> setVisible(false));\n\
  \n        // 将 OK 添加到南部\n\n        var panel = new JPanel();\n        panel.add(ok);\n\
  \        add(panel, BorderLayout.SOUTH);\n\n        pack();\n    }\n}\n```\n\n`javax.swing.JDialog`\n\
  `public JDialog(Frame parent, String title, boolean modal)`\n构造一个对话框。在显式显示之前，它是不可见的。\n\
  \n### 11.8.3 数据交换\n\n弹出对话框的最常见目的是从用户那里获取信息。你已经看到如何创建一个对话框对象：现在让我们看看如何在对话框之间传输数据。考虑\
  \ 图 11.32 中可能用于连接某些在线服务的对话框。\n\n![Figure](img/dataexetest.jpg)图 11.32：密码对话框\n\n\
  你的对话框应该提供设置默认值的方法。例如，示例程序的 `PasswordChooser` 类有一个方法 `setUser` 用于将默认值填入字段：\n\n```\n\
  public void setUser(User u) {\n    username.setText(u.getName());\n}\n```\n\n一旦设置了默认值（如果需要），通过调用\
  \ `setVisible(true)` 显示对话框。现在对话框已显示。\n\n用户随后填写信息并点击 OK 或取消按钮。这两个按钮的事件处理器都会调用 `setVisible(false)`，从而终止\
  \ `setVisible(true)` 的调用。或者，用户可能会关闭对话框。如果你没有为对话框安装窗口监听器，则执行默认操作：对话框变为不可见，这也会终止 `setVisible(true)`\
  \ 的调用。\n\n关键问题是 `setVisible(true)` 的调用会阻塞直到用户关闭对话框。这使得实现模态对话框变得简单。\n\n你想知道用户是接受还是取消了对话框。我们的示例代码在显示对话框之前会将\
  \ `ok` 标记设置为 `false`。只有 OK 按钮的事件处理器会将 `ok` 标记设置为 `true`；这就是你从对话框检索用户输入的方法。\n\n从非模态对话框传输数据并不简单。当显示非模态对话框时，`setVisible(true)`\
  \ 的调用不会阻塞，程序在对话框显示期间继续运行。如果用户在非模态对话框上选择项目并点击 OK，对话框需要向程序中的某些监听器发送事件。\n\n示例程序包含另一个有用的改进。当你构造\
  \ `JDialog` 对象时，你需要指定所有者帧。然而，通常你想用不同的所有者帧显示同一个对话框。更好的做法是在准备好显示对话框时选择所有者帧，而不是在构造\
  \ `PasswordChooser` 对象时。\n\n技巧是让 `PasswordChooser` 继承 `JPanel` 而不是 `JDialog`。在 `showDialog`\
  \ 方法中构建 `JDialog` 对象。\n\n\n\n\n```java\npublic boolean showDialog(Frame owner, String\
  \ title) {\n    ok = false;\n\n    if (dialog == null || dialog.getOwner() != owner)\
  \ {\n        dialog = new JDialog(owner, true);\n        dialog.add(this);\n   \
  \     dialog.pack();\n    }\n\n    dialog.setTitle(title);\n    dialog.setVisible(true);\n\
  \    return ok;\n}\n```\n\n注意，`owner` 等于 `null` 是安全的。\n\n你可以做得更好。有时，所有者框架（owner\
  \ frame）并不直接可用。你可以从任何 `parent` 组件轻松地计算出它，如下：\n\n```java\nFrame owner;\nif (parent\
  \ instanceof Frame)\n    owner = (Frame) parent;\nelse\n    owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n```\n\n我们在示例程序使用了这种增强功能。`JOptionPane` 类也使用了这种机制。\n\n许多对话框都有一个`默认按钮`（default\
  \ button），当用户按下触发键时（在大多数外观外观实现中为 Enter 键），该按钮会被选中。默认按钮会被特别标记，通常有一个粗轮廓。\n\n在对话框的`根面板`（root\
  \ pane）中设置默认按钮：\n\n```java\ndialog.getRootPane().setDefaultButton(okButton);\n```\n\
  \n如果你遵循在面板中布局对话框的建议，那么你必须小心，在将面板封装进对话框之后再设置默认按钮。面板对话框本身没有根面板。\n\nListing 11.13 是程序的框架类，它说明了进入和流出对话框的数据流。Listing\
  \ 11.14 显示了对话框类。\n\nListing 11.13 v2ch11/dataExchange/DataExchangeFrame.java\n\n\
  ```java\npackage v2ch11.dataExchange;\n\nimport module java.desktop;\n\n/**\n *\
  \ 一个带有菜单的框架，其 File->Connect 操作会显示密码对话框。\n */\npublic class DataExchangeFrame extends\
  \ JFrame {\n    public static final int TEXT_ROWS = 20;\n    public static final\
  \ int TEXT_COLUMNS = 40;\n    private PasswordChooser dialog = null;\n    private\
  \ JTextArea textArea;\n\n    public DataExchangeFrame() {\n        // 构建一个 File\
  \ 菜单\n\n        var mbar = new JMenuBar();\n        setJMenuBar(mbar);\n       \
  \ var fileMenu = new JMenu(\"File\");\n        mbar.add(fileMenu);\n\n        //\
  \ 添加 Connect 和 Exit 菜单项\n\n        var connectItem = new JMenuItem(\"Connect\");\n\
  \        connectItem.addActionListener(new ConnectAction());\n        fileMenu.add(connectItem);\n\
  \n        // Exit  few 退出程序\n\n        var exitItem = new JMenuItem(\"Exit\");\n\
  \        exitItem.addActionListener(_ -> System.exit(0));\n        fileMenu.add(exitItem);\n\
  \n        textArea = new JTextArea(TEXT_ROWS, TEXT_COLUMNS);\n        add(new JScrollPane(textArea),\
  \ BorderLayout.CENTER);\n        pack();\n    }\n\n    /**\n     * Connect 操作会弹出密码对话框。\n\
  \     */\n    private class ConnectAction implements ActionListener {\n        public\
  \ void actionPerformed(ActionEvent event) {\n            // 如果是第一次，构建对话框\n\n   \
  \         if (dialog == null) dialog = new PasswordChooser();\n\n            //\
  \ 设置默认值\n            dialog.setUser(new User(\"yourname\", null));\n\n         \
  \   // 弹出对话框\n            if (dialog.showDialog(DataExchangeFrame.this, \"Connect\"\
  )) {\n                // 如果接受，获取用户输入\n                User u = dialog.getUser();\n\
  \                textArea.append(\"user name = \" + u.getName() + \", password =\
  \ \"\n                        + (new String(u.getPassword())) + \"\\n\");\n    \
  \        }\n        }\n    }\n}\n```\n\nListing 11.14 v2ch11/dataExchange/PasswordChooser.java\n\
  \n```java\npackage v2ch11.dataExchange;\n\nimport module java.desktop;\n\n/**\n\
  \ * 在对话框内部显示的密码选择器。\n */\npublic class PasswordChooser extends JPanel {\n    private\
  \ JTextField username;\n    private JPasswordField password;\n    private JButton\
  \ okButton;\n    private boolean ok;\n    private JDialog dialog;\n\n    public\
  \ PasswordChooser() {\n        setLayout(new BorderLayout());\n\n        // 构建一个包含用户名和密码字段的面板\n\
  \n        var panel = new JPanel();\n        panel.setLayout(new GridLayout(2, 2));\n\
  \        panel.add(new JLabel(\"User name:\"));\n        panel.add(username = new\
  \ JTextField(\"\"));\n        panel.add(new JLabel(\"Password:\"));\n        panel.add(password\
  \ = new JPasswordField(\"\"));\n        add(panel, BorderLayout.CENTER);\n\n   \
  \     // 创建终止对话框的 Ok 和 Cancel 按钮\n\n        okButton = new JButton(\"Ok\");\n  \
  \      okButton.addActionListener(_ -> {\n            ok = true;\n            dialog.setVisible(false);\n\
  \        });\n\n        var cancelButton = new JButton(\"Cancel\");\n        cancelButton.addActionListener(_\
  \ -> dialog.setVisible(false));\n\n        // 将按钮添加到南部边界\n\n        var buttonPanel\
  \ = new JPanel();\n        buttonPanel.add(okButton);\n        buttonPanel.add(cancelButton);\n\
  \        add(buttonPanel, BorderLayout.SOUTH);\n    }\n\n    /**\n     * 设置对话框默认值。\n\
  \     * @param u 默认用户信息\n     */\n    public void setUser(User u) {\n        username.setText(u.getName());\n\
  \    }\n\n    /**\n     * 获取对话框默认值。\n     * @return 代表对话框状态的 User 对象\n     */\n\
  \    public User getUser() {\n        return User(username.getText(), password.getPassword());\n\
  \    }\n\n    /**\n     * 显示对话对话框。\n     * @param parent 组件或 null\n     * @param\
  \ title 对话框标题\n     */\n    public boolean showDialog(Component parent, String title)\
  \ {\n        ok = false;\n\n        // 定位所有者\n\n        Frame owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n\n        // 如果是第一次或所有者发生了变化，创建对话框\n        if (dialog == null || dialog.getOwner()\
  \ != owner) {\n            dialog = new JDialog(owner, true);\n            dialog.add(this);\n\
  \            dialog.pack();\n        }\n\n        dialog.getRootPane().setDefaultButton(okButton);\n\
  \n        // 设置标题并显示对话框\n        dialog.setTitle(title);\n        dialog.setVisible(true);\n\
  \        return ok;\n    }\n}\n```\n\n`javax.swing.SwingUtilities`12\n\n*   `Container\
  \ getAncestorOfClass(Class c, Component comp)`\n\n    返回属于给定类或其子类的给定组件的最内层父容器。\n\
  \n`javax.swing.JComponent`12\n\n*   `JRootPane getRootPane()`\n\n    获取封装此组件的根面板，如果组件没有根面板则返回\
  \ `null`。\n\n`javax.swing.JRootPane`12\n\n*   `void setDefaultButton(JButton button)`\n\
  \n    设置此根面板的默认按钮。要禁用默认按钮，请带 `null` 参数调用此方法。\n\n`javax.swing.JButton`12\n\n*   `boolean\
  \ isDefaultButton()`\n\n    如果此按钮是其根面板的默认按钮，则返回 `true`。\n\n### 11.8.4 文件对话框\n\n\
  在应用程序中，你通常希望能够打开和保存文件。显示文件和目录并允许用户浏览文件系统的良好对话框很难编写，你绝对不想重复发明轮子。幸运的是，Swing 提供了 `JFileChooser`\
  \ 类，允许你显示与大多数原生应用程序类似的的文件对话框。`JFileChooser` 对话框是模态的。注意 `JFileChooser` 类不是 `JDialog`\
  \ 的子类。与其调用 `setVisible(true)`，不如调用 `showOpenDialog` 显示用于打开文件的对话框，或者调用 `showSaveDialog`\
  \ 显示用于保存文件的对话框。接受文件的按钮随后会被自动标记为 Open 或 Save。你也可以通过 `showDialog` 方法提供自己的按钮标签。图 11.33\
  \ 显示了文件选择器对话框的一个示例。\n\n![Figure](img/filedialog.jpg)图 11.33: 文件选择器对话框\n\n以下是弹出文件对话框并从框中恢复用户选择内容的的步骤：\n\
  \n\n\n\n\n### 1. 创建一个 `JFileChooser` 对象\n与 `JDialog` 类的构造函数不同，你不需要提供父组件。这允许你在多个窗口之间复用文件选择器对话框。\n\
  \n例如：\n```\nvar chooser = new JFileChooser();\n```\n\n复用文件选择器对象是一个好主意，因为 `JFileChooser`\
  \ 的构造函数可能会非常慢，尤其是在 Windows 上用户拥有许多映射网络驱动器的情况下。\n\n### 2. 通过调用 `setCurrentDirectory`\
  \ 方法设置目录。\n例如，要使用当前工作目录：\n```\nchooser.setCurrentDirectory(new File(\".\"));\n```\n\
  \n你需要提供一个 `File` 对象。`File` 对象在 第 2 章 中有详细解释。你现在只需要知道，构造函数 `File(String filename)`\
  \ 会将文件或目录名称转换为 `File` 对象。\n\n### 3. 如果你有一个期望用户选择的默认文件名，请使用 `setSelectedFile` 方法提供它：\n\
  ```\nchooser.setSelectedFile(new File(filename));\n```\n\n### 4. 若要允许用户在对话框中选择多个文件，请调用\
  \ `setMultiSelectionEnabled` 方法。这当然完全是可选的，而且并不常见。\n```\nchooser.setMultiSelectionEnabled(true);\n\
  ```\n\n### 5. 如果你想将对话框中显示的文件限制为特定类型（例如，所有扩展名为 `.gif` 的文件），你需要设置一个文件过滤器。我们将在本节稍后的部分讨论文件过滤器。\n\
  \n### 6. 默认情况下，用户使用文件选择器只能选择文件。如果你想让用户选择目录，请使用 `setFileSelectionMode` 方法。使用 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES` 调用它。\n\n### 7. 通过调用 `showOpenDialog` 或\
  \ `showSaveDialog` 方法显示对话框。在这些调用中，你必须提供父组件：\n```\nint result = chooser.showOpenDialog(parent);\n\
  ```\n或者\n```\nint result = chooser.showSaveDialog(parent);\n```\n\n这些调用唯一的区别在于“确认按钮”的标签——即用户点击以完成文件选择的按钮。你也可以调用\
  \ `showDialog` 方法并为确认按钮传递显式文本：\n```\nint result = chooser.showDialog(parent, \"\
  Select\");\n```\n\n这些调用只有在用户确认、取消或关闭了文件对话框时才会返回。返回值为 `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION`\
  \ 或 `JFileChooser.ERROR_OPTION`。\n\n### 8. 使用 `getSelectedFile()` 或 `getSelectedFiles()`\
  \ 方法获取选定的文件或文件。这些方法返回单个 `File` 对象或一个 `File` 对象数组。如果你只需要文件对象的名称，请调用其 `getPath` 方法。例如：\n\
  ```\nString filename = chooser.getSelectedFile().getPath();\n```\n\n在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于如何从用户应该从中选择的文件中指定一个子集。例如，假设用户应该选择\
  \ GIF 图像文件。那么，文件选择器应该只显示扩展名为 `.gif` 的文件。它还应该给用户提供某种反馈，说明显示的文件属于特定类别，例如“GIF 图片”。但情况可能会更复杂。如果用户应该选择\
  \ JPEG 图像文件，扩展可以是 `.jpg` 或 `.jpeg`。为了而不是用编码的方式来处理这些复杂性，文件选择器的设计者提供了一种更优雅的机制：为了限制显示的文件，提供一个扩展抽象类\
  \ `javax.swing.filechooser.FileFilter` 的对象。文件选择器将每个文件传递给文件过滤器，并只显示过滤器接受的文件。\n\n\
  在编写本文时，提供了两个这样的子类：接受所有文件的默认过滤器，以及接受所有具有给定扩展名文件的过滤器。然而，编写临时的文件过滤器是很容易的。只需实现 `FileFilter`\
  \ 超类的两个抽象方法即可：\n```\npublic boolean accept(File f);\npublic String getDescription();\n\
  ```\n\n第一个方法测试是否应该接受某个文件。第二个方法返回可以在文件选择器对话框中显示的文件类型描述。\n\n`java.io` 包中一个不相关的 `FileFilter`\
  \ 接口有一个单一方法 `boolean accept(File f)`。它被用于 `File` 类的 `listFiles` 方法，以列出目录中的文件。我不知道为什么\
  \ Swing 的设计者没有扩展这个接口——也许 Java 类库在 1998 年就变得如此复杂，以至于他们不再了解所有的标准类和接口。\n\n如果你同时导入了\
  \ `java.io` 和 `javax.swing.filechooser` 包，你需要解决这两个同名类型之间的名称冲突。最简单的解决办法是导入 `javax.swing.filechooser.FileFilter`，而不是\
  \ `javax.swing.filechooser.*`。\n\n一旦你有了文件过滤器对象，使用 `JFileChooser` 类的 `setFileFilter`\
  \ 方法将其安装到文件选择器对象：\n```\nchooser.setFileFilter(new FileNameExtensionFilter(\"Image\
  \ files\", \"gif\", \"jpg\"));\n```\n\n你可以通过调用以下方法为文件选择器安装多个过滤器：\n```\nchooser.addChoosableFileFilter(filter1);\n\
  chooser.addChoosableFileFilter(filter2);\n```\n. . .用户从对话框底部的组合框选择过滤器。默认情况下，“所有文件”过滤器总是存在的。这是一个好主意——以防用户需要选择非标准扩展的文件。如果你想抑制“所有文件”过滤器，调用\n\
  ```\nchooser.setAllFilter(false);\n```\n如果你复用文件选择器加载不同的文件类型，调用\n```\nchooser.resetChoosableFilters();\n\
  ```\n\n最后，你可以通过为每个文件提供图标图标描述来自定义文件选择器。通过提供一个扩展 `FileView` 类的对象来实现。这绝对是一项高级技术。通常，你不需要提供文件视图——可插件的外（look-and-feel）会为你提供。但如果你想为文件类型显示不同的图标，你可以安装自己的文件视图。你需要扩展\
  \ `FileView` 类并实现五个方法：\n```\nIcon getIcon(File f);\nString getName(File f);\nString\
  \ getDescription(File f);\nString getTypeDescription(File f);\nBoolean isTraversable(File\
  \ f);\n```\n\n然后，使用 `setFileView` 方法将你的文件视图安装到文件选择器。\n\n文件选择器会对它想要显示的每个文件或目录调用你的方法。如果你的方法对图标、名称或描述返回\
  \ `null`，则文件选择器会咨询默认的文件视图。这很好，因为这意味着你只需要处理你想进行不同操作的文件类型。\n\n文件选择器调用 `isTraversable`\
  \ 方法来决定在用户点击时是否打开目录。注意这个方法返回一个 `Boolean` 对象，而不是 `boolean` 值！这听起来很奇怪，但实际上非常方便——如果你不想偏离默认的文件视图，只需返回\
  \ `null`。文件选择器将会咨询默认的文件视图。换句话之，该方法返回一个 `Boolean` 来让你在三个选项之间选择：真（`Boolean.TRUE`）、假（`Boolean.FALSE`）或忽略（`null`）。\n\
  \n示例程序包含一个简单的文件视图类。当文件匹配文件过滤器时，该类会显示特定的图标。我们使用它为所有图像文件显示调色板图标。\n\n\n\n\n\n```java\n\
  class FileIconView extends FileView {\n    private FileFilter filter;\n    private\
  \ Icon icon;\n\n    public FileIconView(FileFilter aFilter, Icon anIcon) {\n   \
  \     filter = aFilter;\n        icon = anIcon;\n    }\n\n    public Icon getIcon(File\
  \ f) {\n        if (!f.isDirectory() && filter.accept(f))\n            return icon;\n\
  \        else return null;\n    }\n}\n```\n\n使用 `setFileView` 方法将此文件视图安装到文件选择器中：\n\
  \n```java\nchooser.setFileView(new FileIconView(filter,\n    new ImageIcon(\"palette.gif\"\
  )));\n```\n\n文件选择器将在所有通过 `filter` 的文件旁边显示调板图标，并使用默认文件视图显示所有其他文件。自然地，我们使用了在文件选择器中设置的同一个过滤器。\n\
  \n最后，你可以通过添加 `accessory` 组件来自定义文件对话框。例如，图 11.34 显示在文件列表旁边有一个预览辅助组件。该组件显示当前选中文件的缩略图视图。\n\
  \n![Figure](img/filedialog2.jpg)图 11.34：带有预览辅助组件的文件对话框\n\n辅助组件可以是任何 Swing 组件。在我们的情况下，我们扩展了\
  \ `JLabel` 类并将其图标设置为图形图像缩放后的副本：\n\n```java\nclass ImagePreviewer extends JLabel\
  \ {\n    public ImagePreviewer(JFileChooser chooser) {\n        setPreferredSize(new\
  \ Dimension(100, 100));\n        setBorder(BorderFactory.createEtchedBorder());\n\
  \    }\n\n    public void loadImage(File f) {\n        var icon = new ImageIcon(f.getPath());\n\
  \        if(icon.getIconWidth() > getWidth())\n            icon = new ImageIcon(icon.getImage().getScaledInstance(\n\
  \                getWidth(), -1, Image.SCALE_DEFAULT));\n        setIcon(icon);\n\
  \        repaint();\n    }\n}\n```\n\n挑战只有一个。我们希望每当用户选择不同的文件时更新预览图像。文件选择器使用“JavaBeans”机制，当它的任何属性发生变化时通知感兴趣的监听器。选中的文件是一个你可以通过安装\
  \ `PropertyChangeListener` 来监控的属性。以下是拦截这些通知所需的代码：\n\n```java\nchooser.addPropertyChangeListener(_\
  \ -> {\n    if (event.getPropertyName() == JFileChooser.SELECTED_FILE_CHANGED_PROPERTY)\
  \ {\n        var newFile = (File) event.getNewValue();\n        // update 辅助组件\n\
  \        . . .\n    }\n});\n```\n\n### `javax.swing.JFileChooser` 1.2\n\n*   `JFileChooser()`\n\
  \    创建一个可用于多个帧的文件选择器对话框。\n*   `void setCurrentDirectory(File dir)`\n    设置文件对话框的初始目录。\n\
  *   `void setSelectedFile(File file)`\n*   `void setSelectedFiles(File[] file)`\n\
  \    设置文件对话框的默认文件选择。\n*   `void setMultiSelectionEnabled(boolean b)`\n    设置或清除多选模式。\n\
  *   `void setFileSelectionMode(int mode)`\n    允许用户仅选择文件（默认值）、仅选择目录或同时选择文件和目录。`mode`\
  \ 参数是 `JFileChooser.FILES_ONLY`、`JFileChooser.DIRECTORIES_ONLY` 和 `JFileChooser.FILES_AND_DIRECTORIES`\
  \ 之一。\n*   `int showOpenDialog(Component parent)`\n*   `int showSaveDialog(Component\
  \ parent)`\n*   `int showDialog(Component parent, String approveButtonText)`\n \
  \   显示一个对话框，其中确认按钮标记为“打开”、“保存”或 `approveButtonText` 字符串。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消按钮或关闭了对话框）或\
  \ `ERROR_OPTION`（如果发生错误）。\n*   `File getSelectedFile()`\n*   `File[] getSelectedFiles()`\n\
  \    获取用户选择的一个或多个文件（如果用户没有选择文件，则返回 `null`）。\n*   `void setFileFilter(FileFilter\
  \ filter)`\n    设置文件对话框的文件掩码。所有 `filter.accept` 返回 `true` 的文件都将被显示。同时，将过滤器添加到可选过滤器列表中。\n\
  *   `void addChoosableFileFilter(FileFilter filter)`\n    将文件过滤器添加到可选过滤器列表中。\n*\
  \   `void setAcceptAllFileFilterUsed(boolean b)`\n    在过滤器组合框中包含或抑制“所有文件”过滤器。\n\
  *   `void resetChoosableFileFilters()`\n    清除可选过滤器列表。除非被显式抑制，否则只保留“所有文件”过滤器。\n\
  *   `void setFileView(FileView view)`\n    设置文件视图以提供有关文件选择器显示的文件的信息。\n*   `void\
  \ setAccessory(JComponent component)`\n    设置辅助组件。\n\n### `javax.swing.filechooser.FileFilter`\
  \ 1.2\n\n*   `boolean accept(File f)`\n    如果文件选择器应该显示此文件，则返回 `true`。\n*   `String\
  \ getDescription()`\n    返回此文件过滤器的描述——例如`\"Image files (*.gif,*.jpeg)\"`\n\n###\
  \ `javax.swing.filechooser.FileNameExtensionFilter` 6\n\n*   `FileNameExtensionFilter(String\
  \ description, String... extensions)`\n    使用给定的描述构建文件过滤器，该过滤器接受给定的扩展名字符串之一。\n\n\
  \n\n\n`JTable` 并不存储自己的数据，而是从一个*表格模型*（table model）中获取数据。`JTable` 类有一个构造函数，可以将一个对象的二维数组封装进默认模型中。这就是我们在第一个示例中使用的策略；在本章的稍后部分中，我们将转向使用表格模型。\n\
  \n图 12.1 显示了一个典型的表格，描述了太阳系行星的属性。（如果一个行星主要由氢和氦气组成，则它是*气态的*。你应该保留意见看待“颜色”这一列条目——添加这一列是因为它在随后的代码示例中会很有用。）\n\
  \n![Figure](img/fig06-05.jpg)图 12.1：一个简单的表格\n\n如你从列表 12.1 中的代码所示，表格数据被存储为 `Object`\
  \ 值的二维数组：\n\n```\nObject[][] cells = {\n    { \"Mercury\", 2440.0, 0, false, Color.YELLOW\
  \ },\n    { \"Venus\", 6052.0, 0, false, Color.YELLOW },\n    . . .\n};\n```\n\n\
  在这里，我们利用了自动装箱（autoboxing）。第二、第三和第四列的条目被自动转换为 `Double`、`Integer` 和 `Boolean` 类型的对象。\n\
  \n表格简单地调用每个对象的 `toString` 方法来显示它。这就是为什么颜色显示为 `java.awt.Color[r=. . .,g=. . .,b=.\
  \ . .]`。\n\n在一个在一个独立的字符串数组中提供列名：\n\n```\nString[] columnNames = { \"Planet\", \"\
  Radius\", \"Moons\", \"Gaseous\", \"Color\" };\n```\n\n然后，根据单元格和列名数组构造表格：\n\n```\n\
  var table = new JTable(cells, columnNames);\n```\n\n你可以按照通常的方法添加滚动条——通过将表格封装在 `JScrollPane`\
  \ 中：\n\n```\nvar pane = new JScrollPane(table);\n```\n\n当滚动表格时，表格表头不会滚出视图。\n\n接下来，点击其中一个列头并将其向左或向右拖动。观察整个列是如何分离的（参见图\
  \ 12.2）。你可以将其放在不同的位置。这仅重新排列了*视图中*的列顺序。数据模型不受影响。\n\n![Figure](img/fig06-06.jpg)图\
  \ 12.2：移动列\n\n要要*调整*列的大小，只需将光标置于两列之间，直到光标形状变为箭头。然后，将列边界拖到所需的位置（参见图 12.3）。\n\n![Figure](img/fig06-07.jpg)图\
  \ 12.3：调整列大小\n\n用户可以通过点击行中的任何位置来选择行。选中的行会被高亮显示；你稍后将看到如何获取选择事件。用户还可以通过点击单元格并在其中输入来编辑表格条目。然而，在\
  \ own 代码示例中，编辑不会改变底层数据。在你的程序中，你应该要么将单元格设置为不可编辑，要么处理单元格编辑事件并更新你的模型。我们将在本节稍后部分讨论这些主题。\n\
  \n最后，点击列头。行会自动进行排序。再次点击，排序顺序将反转。这种行为通过以下调用激活：\n\n```\ntable.setAutoCreateRowSorter(true);\n\
  ```\n\n你可以通过以下调用打印表格：\n\n```\ntable.print();\n```\n\n如果你没有将表格封装到滚动面板中，则需要显式添加表头：\n\
  \n```\nadd(table.getTableHeader(), BorderLayout.NORTH);\n```\n\nListing12.1 v2ch12/table/TableDemo.java\n\
  \n```\npackage v2ch12.table;\n\nimport module java.desktop;\n\n/**\n * 此程序演示如何显示一个简单的表格。\n\
  \ */\nclass TableDemo {\n    void main() {\n        EventQueue.invokeLater(() ->\
  \ {\n            var frame = new PlanetTableFrame();\n            frame.setTitle(\"\
  TableTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\n/**\n * 此框架包含一个行星数据表格。\n\
  \ */\nclass PlanetTableFrame extends JFrame {\n    private String[] columnNames\
  \ = { \"Planet\", \"Radius\", \"Moons\", \"Gaseous\", \"Color\" };\n    private\
  \ Object[][] cells = { { \"Mercury\", 2440.0, 0, false, Color.YELLOW },\n      \
  \      { \"Venus\", 6052.0, 0, false, Color.YELLOW },\n            { \"Earth\",\
  \ 6378.0, 1, false, Color.BLUE }, { \"Mars\", 3397.0, 2, false, Color.RED },\n \
  \           { \"Jupiter\", 71492.0, 16, true, Color.ORANGE },\n            { \"\
  Saturn\", 60268.0, 18, true, Color.ORANGE },\n            { \"Uranus\", 25559.0,\
  \ 17, true, Color.BLUE },\n            { \"Neptune\", 24766.0, 8, true, Color.BLUE\
  \ },\n            { \"Pluto\", 1137.0, 5, false, Color.GRAY } };\n\n    public PlanetTableFrame()\
  \ {\n        var table = new JTable(cells, columnNames);\n        table.setAutoCreateRowSorter(true);\n\
  \        add(new JScrollPane(table), BorderLayout.CENTER);\n        add(table.getTableHeader(),\
  \ BorderLayout.NORTH);\n\n        var printButton = new JButton(\"Print\");\n  \
  \      printButton.addActionListener(e -> {\n            table.print();\n      \
