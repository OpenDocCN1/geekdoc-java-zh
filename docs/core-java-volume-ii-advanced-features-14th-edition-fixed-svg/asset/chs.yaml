  \n## 10.4. 事件处理\n\n任何支持 GUI 的操作系统环境都会持续监控按键或鼠标点击等事件。这些事件会被报告给正在运行的程序。每个程序然后决定对这些事件采取什么行动（如果有）。\n\
  \n### 10.4.1. 基本事件处理概念\n\n在 Java AWT 中，`事件源`（event sources，如按钮或滚动条）拥有允许你注册`事件监听器`（event\
  \ listeners）的方法——即执行所需响应的对象。\n\n（注：原文此处存在大量重复段落，已根据要求仅保留核心逻辑并消除重复输出）\n\n\n\n\n```\n\
  \ var yellowButton = new JButton(\"Yellow\");\nvar blueButton = new JButton(\"Blue\"\
  );\nvar redButton = new JButton(\"Red\");\n\nbuttonPanel.add(yellowButton);\nbuttonPanel.add(blueButton);\n\
  buttonPanel.add(redButton);\n```\n\n图 10.14 显示了结果。\n\n![Figure](img/buttontest1.jpg)图\
  \ 10.14：一个填充了按钮的面板\n\n接下来，我们需要添加代码来监听这些按钮。这需要实现 `ActionListener` 接口的类，正如我刚才提到的，该接口有一个方法：`actionPerformed`，其签名如下：\n\
  \n```\npublic void actionPerformed(ActionEvent event)\n```\n\n在所有情况下，使用 `ActionListener`\
  \ 接口的方法都是一致的：`actionPerformed` 方法（它是 `ActionListener` 中唯一的方法）接收一个类型为 `ActionEvent`\
  \ 的对象作为参数。这个事件对象可以提供有关所发生事件的信息。\n\n当按钮被点击时，我们希望面板的背景颜色变为某种特定的颜色。我们将所需的颜色存储在监听器类中。\n\
  \n```\n class ColorAction implements ActionListener {\n    private Color backgroundColor;\n\
  \n    public ColorAction(Color c) {\n        backgroundColor = c;\n    }\n\n   \
  \ public void actionPerformed(ActionEvent event) {\n        // 设置面板背景颜色\n      \
  \  . . .\n    }\n}\n```\n\n然后我们为每种颜色创建一个对象，并将这些对象设为按钮的监听器。\n\n```\n var yellowAction\
  \ = new ColorAction(Color.YELLOW);\nvar blueAction = new ColorAction(Color.BLUE);\n\
  var redAction = new ColorAction(Color.RED);\n\nyellowButton.addActionListener(yellowAction);\n\
  blueButton.addActionListener(blueAction);\nredButton.addActionListener(redAction);\n\
  ```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction` 对象的 `actionPerformed` 方法会被调用。它的 `backgroundColor`\
  \ 实例字段被设置为 `Color.YELLOW`，现在它就可以继续设置面板的背景颜色。\n\n还剩下一个问题。`ColorAction` 对象无法访问 `buttonPanel`\
  \ 变量。你可以通过两种方法解决这个问题：将面板存储在 `ColorAction` 对象中，并在 `ColorAction` 构造函数中对其进行设置；或者更方便的方法是，将\
  \ `ColorAction` 写为 `ButtonFrame` 类的内部类。这样它的方法就可以自动访问外部面板。\n\n代码列表 10.6 包含了完整的框架类。每当你点击其中一个按钮时，相应的动作监听器就会更改面板的背景颜色。\n\
  \n代码列表 10.6 v2ch10/button/ButtonFrame.java\n\n```\npackage v2ch10.button;\n\nimport\
  \ module java.desktop;\n\n/**\n * 一个带有按钮面板的框架。\n */\npublic class ButtonFrame extends\
  \ JFrame {\n    private JPanel buttonPanel;\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n    public ButtonFrame()\
  \ {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 创建按钮\n      \
  \  var yellowButton = new JButton(\"Yellow\");\n        var blueButton = new JButton(\"\
  Blue\");\n        var redButton = new JButton(\"Red\");\n\n        buttonPanel.add(yellowButton);\n\
  \        buttonPanel.add(blueButton);\n        buttonPanel.add(redButton);\n\n \
  \       var yellowAction = new ColorAction(Color.YELLOW);\n        var blueAction\
  \ = new ColorAction(Color.BLUE);\n        var redAction = new ColorAction(Color.RED);\n\
  \n        yellowButton.addActionListener(yellowAction);\n        blueButton.addActionListener(blueAction);\n\
  \        redButton.addActionListener(redAction);\n    }\n\n    class ColorAction\
  \ implements ActionListener {\n        private Color backgroundColor;\n\n      \
  \  public ColorAction(Color c) {\n            backgroundColor = c;\n        }\n\n\
  \        public void actionPerformed(ActionEvent event) {\n            // 设置面板背景颜色\n\
  \            . . .\n        }\n    }\n}\n```\n\n\n\n\n当然，我们可以定义一个实现接口的类，在 `windowClosing`\
  \ 方法中添加对 `System.exit(0)` 的调用，并为其他六个方法编写空函数。然而，为六个无作用的方法编写代码是没人喜欢的枯燥杂事。为了简化这项任务，每个具有多个方法的\
  \ AWT 监听器接口都带有一个配套的 `adapter` 类，该类实现了接口中的所有方法，但对这些方法均不执行任何操作。例如，`WindowAdapter`\
  \ 类有七个空方法。你可以扩展适配器类来对接口中的某些（但不是所有）事件类型指定所需的响应。（像 `ActionListener` 这样只有一个只有一个方法的接口是不需要适配器类的。）\n\
  \n以下是我们如何定义一个重写了 `windowClosing` 方法的窗口监听器：\n\n```java\nclass Terminator extends\
  \ WindowAdapter {\n    public void windowClosing(WindowEvent e) {\n        if (user\
  \ agrees)\n            System.exit(0);\n    }\n}\n```\n\n现在，你可以将 `Terminator` 类型的对象注册为事件监听器：\n\
  \n```java\nvar listener = new Terminator();\nframe.addWindowListener(listener);\n\
  ```\n\n如今，人们会将 `WindowListener` 接口的空方法实现为默认方法（default methods）。然而，Swing 的发明是在默认方法出现多年之前的。\n\
  \n`java.awt.event.WindowListener`1.1\n\n*   `void windowOpened(WindowEvent e)`\n\
  \    在窗口打开后调用。\n\n*   `void windowClosing(WindowEvent e)`\n    当用户向窗口管理器发出关闭命令时调用。注意，只有当调用了其\
  \ `hide` 或 `dispose` 方法时，窗口才会关闭。\n\n*   `void windowClosed(WindowEvent e)`\n   \
  \ 在窗口关闭后调用。\n\n*   `void windowIconified(WindowEvent e)`\n    在窗口被最小化后调用。\n\n* \
  \  `void windowDeiconified(WindowEvent e)`\n    在窗口恢复最小化后调用。\n\n*   `void windowActivated(WindowEvent\
  \ e)`\n    在窗口变为激活状态后调用。只有帧或对话框可以是激活状态。通常情况下，窗口管理器会对激活的窗口进行装饰——例如通过高亮标题栏。\n\n* \
  \  `void windowDeactivated(WindowEvent e)`\n    在窗口变为非激活状态后调用。\n\n`java.awt.event.WindowStateListener`1.4\n\
  \n*   `void windowStateChanged(WindowEvent event)`\n    在窗口最大化、最小化或恢复到正常尺寸后调用。\n\
  \n### 10.4.5. Actions\n\n通过多种方式激活同一个命令是常见做法。用户可以通过菜单、按键或工具栏上的按钮来选择某个功能。在 AWT 事件模型中这很容易实现：将所有事件链接到同一个监听器。例如，假设\
  \ `blueAction` 是一个动作监听器，其 `actionPerformed` 方法将背景颜色更改为蓝色。你可以将同一个对象作为监听器附加到多个事件源：\n\
  \n*   一个标记为“Blue”的工具栏按钮\n*   一个标记为“Blue”的菜单项\n*   按键 `Ctrl+B`\n\n颜色更改命令现在将统一的方式处理，无论它是由按钮点击、菜单选择还是按键引起的。\n\
  \nSwing 包提供了一个非常有用的机制来封装命令并将其附加到多个事件源：`Action` 接口。一个 `action` 是封装了以下内容的对象：\n\n*\
  \   命令的描述（作为文本字符串和可选图标）；以及\n*   执行命令所需的参数（例如我们示例中请求的颜色）。\n\n`Action` 接口具有以下方法：\n\
  \n```java\nvoid actionPerformed(ActionEvent event)\nvoid setEnabled(boolean b)\n\
  boolean isEnabled()\nvoid putValue(String key, Object value)\nObject getValue(String\
  \ key)\nvoid addPropertyChangeListener(PropertyChangeListener listener)\nvoid removePropertyChangeListener(PropertyChangeListener\
  \ listener)\n```\n\n第一个方法是 `ActionListener` 接口中熟悉的方法；事实上，`Action` 接口扩展了 `ActionListener`\
  \ 接口。因此，在任何需要 `ActionListener` 对象的地方，你都可以使用 `Action` 对象。\n\n接下来两个方法允许你启用或禁用动作，并检查动作当前是否已启用。当动作附加到菜单或工具栏且动作被禁用时，该选项将变为灰色。\n\
  \n`putValue` 和 `getValue` 方法允许你在动作对象中存储和检索任意名称/值对。两个重要的预定义字符串，即 `Action.NAME` 和\
  \ `Action.SMALL_ICON`，将动作名称和图标存储到动作对象中：\n\n```java\naction.putValue(Action.NAME,\
  \ \"Blue\");\naction.putValue(Action.SMALL_ICON, new ImageIcon(\"blue-ball.gif\"\
  ));\n```\n\nTable 10.1 显示了所有预定义的动作表名。\n\n表 10.1：预定义动作表名\n\n| Name | Value |\n| ---\
  \ | --- |\n| `NAME` | 动作的名称，显示在按钮和菜单项上。 |\n| `SMALL_ICON` | 用于在按钮、菜单项或工具栏中显示的小图标。\
  \ |\n| `SHORT_DESCRIPTION` | 用于在工具提示（tooltip）中显示的图标短描述。 |\n| `LONG_DESCRIPTION`\
  \ | 用于可能在在线帮助中的图标长描述。没有 Swing 组件使用此值。 |\n| `MNEMONIC_KEY` | 用于在菜单项中显示的助记缩写。 |\n\
  | `ACCELERATOR_KEY` | 用于存储快捷键的地方。 |\n| `ACTION_COMMAND_KEY` | 历史上，用于 `registerKeyboardAction`\
  \ 方法。 |\n| `DEFAULT` | 潜在有用的全能属性。 |\n\n如果将动作对象添加到菜单或工具栏中，名称和图标将被自动检索并显示在菜单项或工具栏按钮中。`SHORT_DESCRIPTION`\
  \ 值将变为工具提示。\n\n注意 `Action` 是一个 `interface`，而不是类。任何实现此接口的类必须实现我们讨论的七个方法。幸运的是，一位热心的人提供了一个\
  \ `AbstractAction` 类，它实现了除 `actionPerformed` 之外的所有方法。该类负责存储所有名称/值对并管理属性监听器。你只需要扩展\
  \ `AbstractAction` 并提供一个 `actionPerformed` 方法即可。\n\n让我们构建一个可以执行颜色更改命令的动作对象。我们存储命令的名称、图标和所需的颜色。我们将颜色存储在\
  \ `AbstractAction` 类提供的名称/值对表中。这里是 `ColorAction` 类的代码。构造函数设置了名称/值对，`actionPerformed`\
  \ 方法执行颜色更改动作。\n\n```java\npublic class ColorAction extends AbstractAction {\n  \
  \  public ColorAction(String name, Icon icon, Color c) {\n        putValue(Action.NAME,\
  \ name);\n        putValue(Action.SMALL_ICON, icon);\n        putValue(\"color\"\
  , c);\n        putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  \    }\n\n    public void actionPerformed(ActionEvent event) {\n        Color c\
  \ = (Color) getValue(\"color\");\n        buttonPanel.setBackground(c);\n    }\n\
  }\n```\n\n我们的测试程序创建了该类的三个对象，例如\n\n```java\nvar blueAction = new ColorAction(\"Blue\"\
  , new ImageIcon(\"blue-ball.gif\"), Color.BLUE);\n```\n\n接下来，我们将此动作与按钮关联。这很容易，因为我们可以使用接受\
  \ `Action` 对象的 `JButton` 构造函数。\n\n```java\nvar blueButton = new JButton(blueAction);\n\
  ```\n\n\n\n该构造函数从动作（action）中读取名称和图标，将短描述设置为工具提示，并将该动作设置为监听器。你可以在图 10.15 中看到图标和工具提示。\n\
  \n正如下一章所示，向菜单中添加相同的动作同样简单。\n\n![Figure](img/actiontest.jpg)图 10.15：按钮显示了来自动作对象的图标。\n\
  \n最后，我们想要将动作对象绑定到按键上，以便用户在输入键盘命令时执行相应的动作。要将动作与按键关联，你首先需要生成 `KeyStroke` 类的对象。这个便利类封装了按键的描述。要生成\
  \ `KeyStroke` 对象，不要调用构造函数，而要使用 `KeyStroke` 类的静态方法 `getKeyStroke`。\n\n```\nKeyStroke\
  \ ctrlBKey = KeyStroke.getKeyStroke(\"ctrl B\");\n```\n\n要理解下一步，你需要理解`键盘焦点`（keyboard\
  \ focus）的概念。用户界面可以有很多按钮、菜单、滚动条和其他组件。当你按下按键时，它会被发送到拥有焦点的组件。该组件通常（但并非总是）在视觉上有所区分。例如，在\
  \ Java 视图外观（look-and-feel）中，拥有焦点的按钮在其文本周围有一个细的矩形框。你可以使用 Tab 键在组件之间移动焦点。当你按下空格键时，具有焦点按钮会被点击。其他键执行不同的动作；例如，方向键可以移动滚动条。\n\
  \n然而，在我们的情况下，我们不想将按键发送到拥有焦点的组件。否则，每个按钮都需要知道如何处理 Ctrl+Y、Ctrl+B 和 Ctrl+R 键。\n\n这是一个常见问题，Swing\
  \ 设计者想出了方便的解决方案。每个 `JComponent` 都有三个输入映射（input maps），每个映射都将 `KeyStroke` 对象映射到关联的动作。三个输入映射对应三个不同的条件（参见表\
  \ 10.2）。\n\n表 10.2：输入映射条件\n\n| Flag | Invoke Action |\n| --- | --- |\n| `WHEN_FOCUSED`\
  \ | 当此组件拥有键盘焦点时 |\n| `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT` | 当此组件包含拥有键盘焦点的组件时 |\n\
  | `WHEN_IN_FOCUSED_WINDOW` | 当此组件与拥有键盘焦点的组件位于同一个窗口内时 |\n\n按键处理按以下顺序检查这些映射：\n\n1.\
  \ 检查拥有焦点组件的 `WHEN_FOCUSED` 映射。如果按键存在且其对应的动作已启用，则执行该动作并停止处理。\n2. 从拥有焦点的组件开始，检查其父组件的\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT` 映射。一旦发现具有该按键且对应启用动作的映射，立即执行该动作并停止处理。\n3.\
  \ 查看输入焦点窗口中所有`visible` 且`enabled` 的组件，这些组件在 `WHEN_IN_FOCUSED_WINDOW` 映射中注册了该按键。给这些组件（按照其按键注册的顺序）执行对应动作的机会。一旦执行了第一个启用的动作，立即停止处理。\n\
  \n要从组件获取输入映射，请使用 `getInputMap` 方法。这是一个示例：\n\n```\nInputMap imap = panel.getInputMap(JComponent.WHEN_FOCUSED);\n\
  ```\n\n`WHEN_FOCUSED` 条件意味着当当前组件拥有键盘焦点时会查询此映射。在我们的情况下，这不是我们想要的映射。拥有输入焦点的是其中按钮之一，而不是面板。另外两个映射选择中的任何一个对于插入颜色更改按键都是可行的。我们在示例程序中使用\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`。\n\n`InputMap` 不直接将 `KeyStroke` 对象映射到 `Action`\
  \ 对象。相反，它映射到任意对象，而另一个由 `ActionMap` 类实现的映射则将对象映射到动作。这使得在来自不同输入映射的按键之间共享相同动作变得更容易。\n\
  \n因此，每个组件都有三个输入映射和一个动作映射。为了将它们连接在一起，你需要为动作命名。以下是将按键绑定到动作的方法：\n\n``````\nimap.put(KeyStroke.getKeyStroke(\"\
  ctrl Y\"), \"panel.yellow\");\nActionMap amap = panel.getActionMap();\namap.put(\"\
  panel.yellow\", yellowAction);\n```\n\n按照习惯，使用字符串 `\"none\"` 作为无操作动作。这使得禁用某个按键变得简单：\n\
  \n```\nimap.put(KeyStroke.getKeyStroke(\"ctrl C\"), \"none\");\n```\n\nJDK 文档建议使用动作名称作为动作的键。我不认为这是一个好主意。动作名称显示在按钮和菜单项上；因此，它可以根据\
  \ UI 设计者的意愿改变，并可能被翻译成多种语言。这种不稳定的字符串是不良的查找键，我建议你设计独立于显示名称的动作名称。\n\n总结一下，以下是响应按钮、菜单项或按键执行相同动作的步骤：\n\
  \n1. 实现一个继承自 `AbstractAction` 类的类。你可能可以使用它。\n2. 构造一个 `KeyStroke` 对象。\n3. 构造一个按钮或菜单项。\n\
  4. 获取组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT` 输入映射。\n5. 将键对（按键, 动作键）添加到输入映射中。\n\
  6. 将键对（动作键, 动作对象）添加到映射中。\n\n### 10.4.6 鼠标事件\n\n如果你只是想让用户能够点击按钮或菜单，不需要显式处理鼠标事件。这些鼠标操作由用户界面中的各种组件内部处理。然而，如果你想让用户能够使用鼠标绘图，将需要捕获鼠标移动、点击和拖拽事件。\n\
  \n在本节中，我将向你展示一个简单的图形编辑器应用程序，允许用户在画布上放置、移动和删除正方形（参见图 10.16）。\n\n\n\n\n\n当用户点击鼠标按钮时，会调用三个监听器方法：在鼠标首次按下时调用\
  \ `mousePressed`，在释放鼠标时调用 `mouseReleased`，最后调用 `mouseClicked`。如果你只感兴趣完整的点击操作，可以忽略前两个方法。通过使用\
  \ `MouseEvent` 参数上的 `getX` 和 `getY` 方法，你可以获取鼠标被点击时鼠标指针的 `x` 和 `y` 坐标。要区分单击、双击和三击（!），请使用\
  \ `getClickCount` 方法。\n\n在我们的示例程序中，我们同时提供了 `mousePressed` 和 `mouseClicked` 方法。当你点击不在任何已绘制的正方形内部的像素时，会添加一个新的正方形。我们将此功能实现在\
  \ `mousePressed` 方法中，这样用户就能获得即时反馈，而不需要等到鼠标按钮释放。当用户在现有的正方形内部双击时，该正方形会被擦除。我们将此实现在\
  \ `mouseClicked` 方法中，因为我们需要获取点击次数。\n\n```java\n public void mousePressed(MouseEvent\
  \ event) {\n    current = find(event.getPoint());\n    if (current == null) // not\
  \ inside a square\n        add(event.getPoint());\n}\n\npublic void mouseClicked(MouseEvent\
  \ event) {\n    current = find(event.getPoint());\n    if (current != null && event.getClickCount()\
  \ >= 2)\n        remove(current);\n}\n```\n\n当鼠标在窗口上移动时，窗口会接收到连续的鼠标移动事件。请注意，存在独立的\
  \ `MouseListener` 和 `MouseMotionListener` 接口。这样做是为了效率考虑——当用户移动鼠标时会产生大量的鼠标事件，而只关心鼠标点击的监听器不会被不需要的鼠标移动所干扰。\n\
  \n我们的测试应用程序捕获鼠标移动事件，当鼠标悬停在正方形上方时将光标改为不同的形状（十字星）。这是通过 `Cursor` 类的 `getPredefinedCursor`\
  \ 方法实现的。表 10.3 列出了配合此方法使用的常量，以及这些光标在 Windows 下的外。\n\n### 表 10.3: 示例光标形状\n\n| 图标\
  \ | 常量 | 图标 | 常量 |\n| --- | --- | --- | --- |\n| ![.jpg](img/351fig01.jpg) | `DEFAULT_CURSOR`\
  \ | ![.jpg](img/351fig08.jpg) | `NE_RESIZE_CURSOR` |\n| ![.jpg](img/351fig02.jpg)\
  \ | `CROSSHAIR_CURSOR` | ![.jpg](img/351fig09.jpg) | `E_RESIZE_CURSOR` |\n| ![.jpg](img/351fig03.jpg)\
  \ | `HAND_CURSOR` | ![.jpg](img/351fig10.jpg) | `SE_RESIZE_CURSOR` |\n| ![.jpg](img/351fig04.jpg)\
  \ | `MOVE_CURSOR` | ![.jpg](img/351fig07.jpg) | `S_RESIZE_CURSOR` |\n| ![.jpg](img/351fig05.jpg)\
  \ | `TEXT_CURSOR` | ![.jpg](img/351fig08.jpg) | `SW_RESIZE_CURSOR` |\n| ![.jpg](img/351fig06.jpg)\
  \ | `WAIT_CURSOR` | ![.jpg](img/351fig09.jpg) | `W_RESIZE_CURSOR` |\n| ![.jpg](img/351fig07.jpg)\
  \ | `N_RESIZE_CURSOR` | ![.jpg](img/351fig10.jpg) | `NW_RESIZE_CURSOR` |\n\n以下是示例程序中\
  \ `MouseMotionListener` 的 `mouseMoved` 方法：\n\n```java\n public void mouseMoved(MouseEvent\
  \ event) {\n    if (find(event.getPoint()) == null)\n        setCursor(Cursor.getDefaultCursor());\n\
  \    else\n        setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  }\n```\n\n如果用户在鼠标移动时按下鼠标按钮，生成的将是 `mouseDragged` 调用而不是 `mouseMoved` 调用。我们的测试应用程序允许用户拖动光标下的正方形。我们只需更新当前正在拖动的矩形，使其中心位于鼠标位置下方。然后，我们重绘画布显示新的鼠标位置。\n\
  \n```java\n public void mouseDragged(MouseEvent event) {\n    if (current != null)\
  \ {\n        int x = event.getX();\n        int y = event.getY();\n\n        current.setFrame(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n        repaint();\n\
  \    }\n}\n```\n\n`mouseMoved` 方法只有在鼠标留在组件内部时才会被调用。然而，当鼠标被拖到组件外部时，`mouseDragged`\
  \ 方法仍会不断被。\n\n还有两个鼠标事件方法：`mouseEntered` 和 `mouseExited`。这些方法在鼠标进入或离开组件时被调用。\n\n\
  最后，让我们看看如何监听鼠标事件。鼠标点击通过 `mouseClicked` 方法报告，它是 `MouseListener` 接口的一部分。许多应用程序只对鼠标点击感兴趣而不关心鼠标移动；由于鼠标移动事件发生频繁，鼠标移动和拖拽事件被定义在独立的\
  \ `MouseMotionListener` 接口中。\n\n在我们的程序中，对这两种鼠标事件都感兴趣。我们定义了两个内部类：`MouseHandler` 和\
  \ `MouseMotionHandler`。`MouseHandler` 类继承自 `MouseAdapter` 类，因为它只定义了五个 `MouseListener`\
  \ 方法中的两个（`MouseAdapter` 类将所有方法都定义为空方法）。`MouseMotionHandler` 实现了 `MouseMotionListener`\
  \ 并定义了该接口的所有方法。列表 10.7 是程序代码列表。\n\nListing 10.7 v2ch10/mouse/MouseComponent.java\n\
  \n\n\n\n\n```java\npackage v2ch10.mouse;\n\nimport module java.base;\nimport module\
  \ java.desktop;\nimport java.awt.event.MouseEvent;\n\n/**\n * 一个带有鼠标操作的组件，用于添加和移除矩形。\n\
  \ */\npublic class MouseComponent extends JComponent {\n    private static final\
  \ int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\
  \n    private static final int SIDELENGTH = 10;\n    private ArrayList<Rectangle2D>\
  \ squares;\n    private Rectangle2D current; // 包含鼠标光标矩形\n\n    public MouseComponent()\
  \ {\n        squares = new ArrayList<>();\n        current = null;\n\n        addMouseListener(new\
  \ MouseHandler());\n        addMouseMotionListener(new MouseMotionHandler());\n\
  \    }\n\n    public Dimension getPreferredSize() {\n        return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n    }\n\n    public void paintComponent(Graphics g) {\n    \
  \    var g2 = (Graphics2D) g;\n\n        // 绘制所有矩形\n        for (Rectangle2D r :\
  \ squares)\n            g2.draw(r);\n    }\n\n    /**\n     * 找到包含点的第一个矩形。\n   \
  \  * @param p 一个点\n     * @return 包含 p 的第一个矩形\n     */\n    public Rectangle2D find(Point2D\
  \ p) {\n        for (Rectangle2D r : squares) {\n            if (r.contains(p))\
  \ return r;\n        }\n        return null;\n    }\n\n    /**\n     * 向集合添加矩形。\n\
  \     * @param p 矩形的中心\n     */\n    public void add(Point2D p) {\n        double\
  \ x = p.getX();\n        double y = p.getY();\n\n        current = new Rectangle2D.Double(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH,\n                SIDELENGTH);\n\
  \        squares.add(current);\n        repaint();\n    }\n\n    /**\n     * 从集合中移除矩形。\n\
  \     * @param s 要移除的矩形\n     */\n    public void remove(Rectangle2D s) {\n    \
  \    if (s == null) return;\n        if (s == current) current = null;\n       \
  \ squares.remove(s);\n        repaint();\n    }\n\n    private class MouseHandler\
  \ extends MouseAdapter {\n        public void mousePressed(MouseEvent event) {\n\
  \            // 如果光标不在矩形内，则添加新矩形\n            current = find(event.getPoint());\n\
  \            if (current == null) add(event.getPoint());\n        }\n\n        public\
  \ void mouseClicked(MouseEvent event) {\n            // 如果双击，则移除当前矩形\n         \
  \   current = find(event.getPoint());\n            if (current != null && event.getClickCount()\
  \ >= 2) remove(current);\n        }\n    }\n\n    private class MouseMotionHandler\
  \ implements MouseMotionListener {\n        public void mouseMoved(MouseEvent event)\
  \ {\n            // 如果鼠标光标在矩形内，则将光标设置为十字星形状\n\n            if (find(event.getPoint())\
  \ == null)\n                setCursor(Cursor.getDefaultCursor());\n            else\n\
  \                setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \        }\n\n        public void mouseDragged(MouseEvent event) {\n           \
  \ if (current != null) {\n                int x = event.getX();\n              \
  \  int y = event.getY();\n\n                // 拖动当前矩形使其中心对齐 (x, y)\n           \
  \     current.setFrame(x - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH,\n   \
  \                     SIDELENGTH);\n                repaint();\n            }\n\
  \        }\n    }\n}\n```\n\n`java.awt.event.MouseEvent` 1.1\n\n* `int getX()`\n\
  * `int getY()`\n* `Point getPoint()`\n\n  返回事件发生点的 `x`（水平）和 `y`（垂直）坐标，该坐标是从作为事件源的组件左上角测量的。\n\
  \n* `int getClickCount()`\n\n  返回与此事件相关的连续鼠标点击次数。（构成分何为“连续”的时间间隔取决于系统。））\n\n`java.awt.Component`\
  \ 1.0\n\n* `public void setCursor(Cursor cursor)` 1.1\n\n  将光标图像设置为指定的光标。\n\n###\
  \ 10.4.7 AWT 事件层次结构\n\n`EventObject` 类有一个子类 `AWTEvent`，它是所有 AWT 事件类的父类。图 10.17 显示了\
  \ AWT 事件的继承图。\n\n.图 10.17：AWT 事件类的继承图\n\n某些 Swing 组件会生成更多类型的事件对象；这些对象直接扩展 `EventObject`，而不是\
  \ `AWTEvent`。\n\n事件对象封装了事件源向其监听器通信的关于事件的信息。在需要时，你可以分析传递给监听器对象的事件对象，就像我们在按钮示例中使用\
  \ `getSource` 和 `getActionCommand` 方法做的那样。\n\n某些 AWT 事件类对 Java 程序员来说没有实际用途。例如，AWT\
  \ 会将 `PaintEvent` 对象插入事件队列，但这些对象不会被投递给监听器。Java 程序员并不监听重绘事件；相反，他们通过重写 `paintComponent`\
  \ 方法来控制重绘。AWT 还会生成许多事件\n\nAWT 在`低级（low-level）`和`语义（semantic）`事件之间做了有用的区分。`语义` 事件表达了用户正在的操作，例如“点击按钮、选择菜单项或在文本字段输入”。`低级`\
  \ 事件是系统提供输入所需的。以下是 `java.awt.event` 包中最常用的语义类：\n\n* `ActionEvent`（用于按钮）\n* `AdjustmentEvent`（用户调整了滚动条）\n\
  * `ItemEvent`（用户选择了复选框）\n* `FocusEvent`（组件获得或失去焦点）\n* `KeyEvent`（按按下或释放）\n* `MouseEvent`（鼠标按钮按下、释放、移动或拖拽）\n\
  * `MouseWheelEvent`（鼠标轮旋转）\n* `WindowEvent`（窗口状态改变）\n\n表 10.4 显示了最重要的 AWT 监听器接口、事件和源。\n\
  \n表 10.4：事件处理摘要\n\n| 接口 | 方法 | 参数/访问器 | 生成自 |\n| --- | --- | --- | --- |\n| `ActionListener`\
  \ | `actionPerformed` | `ActionEvent` | `getActionCommand`, `getModifiers` | `AbstractButton`,\
  \ `JComboBox`, `JTextField`, `Timer` |\n| `AdjustmentListener` | `adjustmentValueChanged`\
  \ | `AdjustmentEvent` | `getAdjustable`, `getAdjustmentType`, `getValue` | `JScrollbar`\
  \ |\n| `ItemListener` | `itemStateChanged` | `ItemEvent` | `getItem`, `getItemSelectable`,\
  \ `getStateChange` | `AbstractButton`, `JComboBox` |\n| `FocusListener` | `focusGained`,\
  \ `focusLost` | `FocusEvent` | `isTemporary` | `Component` |\n| `KeyListener` |\
  \ `keyPressed`, `keyReleased`, `keyTyped` | `KeyEvent` | `getKeyChar`, `getKeyCode`,\
  \ `getKeyModifiersText`, `getKeyText`, `isActionKey` | `Component` |\n| `MouseListener`\
  \ | `mousePressed`, `mouseReleased`, `mouseEntered`, `mouseExited`, `mouseClicked`\
  \ | `MouseEvent` | `getClickCount`, `getX`, `getY`, `getPoint`, `translatePoint`\
  \ | `` |\n| `MouseMotionListener` | `mouseDragged`, `mouseMoved` | `MouseEvent`\
  \ | `Component` |\n| `MouseWheelListener` | `mouseWheelMoved` | `MouseWheelEvent`\
  \ | `getWheelRotation`, `getScrollAmount` | `Component` |\n| `WindowListener` |\
  \ `windowClosing`, `windowOpened`, `windowIconified`, `windowDeiconified`, `windowClosed`,\
  \ `windowActivated` | | `Component` |\n\n\n\n\n\n| `windowDeactivated` | `WindowEvent`\
  \ |\n| `getWindow` | `Window` |\n| `WindowFocusListener` | `windowGainedFocus`,\
  \ `windowLostFocus` | `WindowEvent` |\n| `getOppositeWindow` | `Window` |\n| `WindowStateListener`\
  \ | `windowStateChanged` | `WindowEvent` |\n| `getOldState`, `getNewState` | `Window`\
  \ | |\n\n# 10.5. 首好 API (Preferences API)\n\n我通过对 `java.util.prefs` API 的讨论来结束章。在桌面程序中，你通常希望存储用户偏好，例如用户处理过的最后一个文件、最后一个窗口位置等。\n\
  \n正如你在第一卷第 9 章中所看到的，`Properties` 类使得加载和保存程序的配置信息变得非常简单。然而，使用属性文件有以下缺点：\n\n* 某些操作系统没有“主目录”的概念，这使得很难为配置文件找到一个统一的位置。\n\
  * 配置文件的命名没有标准惯例，当用户安装多个 Java 应用程序时，增加了名称冲突的概率。\n\n某些操作系统拥有配置信息的中央存储库。最著名的例子是 Microsoft\
  \ Windows 中的注册表。`Preferences` 类以一种与平台无关的方式提供了这样一个中央存储库。在 Windows 中，`Preferences`\
  \ 类使用注册表进行存储；而在 Linux 上，信息存储在本地文件系统中。当然，对于使用 `Preferences` 类的程序员来说，存储库的实现是透明的。\n\
  \n`Preferences` 存储库具有树结构，带有如 `/com/mycompany/myapp` 的节点路径名称。与包名一样，只要程序员以反转的域名开头路径，就可以避免名称冲突。事实上，该\
  \ API 的设计者建议配置节点路径与你程序中的包名匹配。\n\n存储库中的每个节点都有一个独立的键/值对表，你可以用它存储数字、字符串或字节数组。该 API\
  \ 未提供存储序列化对象的规定。API 设计者认为序列化格式对于长期存储来说太脆弱了。当然，如果你不同意，可以将序列化对象保存在字节数组中。\n\n为了额外的灵活性，存在多个并行的树。每个程序用户拥有一个树；还有一个被称为“系统树”的树，用于所有用户通用的设置。`Preferences`\
  \ 类使用操作系统“当前用户”的概念来访问相应的的用户树。\n\n要访问树中的节点，从用户根或系统根开始：\n\n```\nPreferences root =\
  \ Preferences.userRoot();\n```\n\n或者\n\n```\nPreferences root = Preferences.systemRoot();\n\
  ```\n\n然后访问该节点。你可以直接提供节点路径名称：\n\n```\nPreferences node = root.node(\"/com/mycompany/myapp\"\
  );\n```\n\n一个方便的快捷方法可以获取路径名称等于类包名的节点。只需获取该类的对象并调用：\n\n```\nPreferences node = Preferences.userNodeForPackage(obj.getClass());\n\
  ```\n\n或者\n\n```\nPreferences node = Preferences.systemNodeForPackage(obj.getClass());\n\
  ```\n\n通常，`obj` 将是 `this` 引用。\n\n一旦你有了节点，可以使用以下方法访问键/值表：\n\n```\nString get(String\
  \ key, String def)\nint getInt(String key, int def)\nlong getLong(String key, long\
  \ def)\nfloat getFloat(String key, float def)\ndouble getDouble(String key, double\
  \ def)\nboolean getBoolean(String key, boolean def)\nbyte[] getByteArray(String\
  \ key, byte[] def)\n```\n\n注意，在读取信息时必须指定一个默认值，以防存储库数据不可用。需要默认值有几个原因：数据可能缺失是因为用户从未指定过偏好；某些资源受限的平台可能没有存储库，移动设备可能临时与存储库断开连接。\n\
  \n相反，你可以使用 `put` 方法将数据写入存储库，例如：\n\n```\nput(String key, String value)\nputInt(String\
  \ key, int value)\n```\n\n等等。\n\n你可以使用方法列出节点中存储的所有键：\n\n```\nString[] keys()\n```\n\
  \n目前还没有办法可以找到特定键值的类型。\n\n节点名称和键限制在 80 个字符以内，字符串值限制在 8,192 个字符以内。\n\n像 Windows 注册这样的中央存储库传统上有两个问题：\n\
  \n* 它们会变成充满过时信息的“垃圾场”。\n* 配置数据交织在存储库中，使得很难将偏好移动到新平台。\n\n`Preferences` 类对第二个问题有一个解决方案。你可以通过调用以下方法导出子树（或较少见的，单个节点）的偏好：\n\
  \n```\nvoid exportSubtree(OutputStream out)\nvoid exportNode(OutputStream out)\n\
  ```\n\n数据以 XML 格式保存。你可以通过调用以下方法将其导入到另一个存储库：\n\n```\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这是一个示例文件：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\">\n<preferences\
  \ EXTERNAL_XML_VERSION=\"1.0\">\n   <root type=\"user\">\n      <map/>\n      <node\
  \ name=\"com\">\n         <map/>\n         <node name=\"horstmann\">\n         \
  \   <map/>\n            <node name=\"corejava\">\n               <map>\n       \
  \     <entry key=\"height\" value=\"200.0\"/>\n            <entry key=\"left\" value=\"\
  1027.0\"/>\n            <entry key=\"filename\" value=\"/home/cay/books/cj11/code/v1ch11/raven.html\"\
  />\n            <entry key=\"top\" value=\"380.0\"/>\n            <entry key=\"\
  width\" value=\"300.0\"/>\n               </map>\n            </node>\n        </node>\n\
  \      </node>\n   </root>\n</preferences>\n```\n\n如果你的程序使用了偏好设置，你应该给用户导出和导入它们的机会，这样他们就可以轻松地从一台计算机迁移到另一台。列表\
  \ 10.8 中的程序演示了这种技术。程序只需保存窗口位置最后加载的文件。调整窗口大小，然后导出你的偏好，移动窗口，退出并重启应用程序。窗口将像你退出时完全一样。导入你的偏好，窗口将恢复到之前的位置。\n\
  \n列表 10.8 `v2ch10/preferences/ImageViewer.java`\n\n\n\n\n\n```java\npackage v2ch10.preferences;\n\
  \nimport module java.base;\nimport module java.desktop;\nimport module java.prefs;\n\
  \n/**\n * 用于测试偏好设置的程序。该程序记录框架的位置、大小和\n * 最后选择的文件。\n */\nclass ImageViewer {\n  \
  \  void main() {\n        EventQueue.invokeLater(() -> {\n            var frame\
  \ = new ImageViewerFrame();\n            frame.setTitle(\"ImageViewer\");\n    \
  \        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \        });\n    }\n}\n\n/**\n * 一个从用户偏好中恢复位置、大小和图像，并在退出时更新\n * 偏好设置。\n */\nclass\
  \ ImageViewerFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n    private String\
  \ image;\n\n    public ImageViewerFrame() {\n        Preferences root = Preferences.userRoot();\n\
  \        Preferences node = root.node(\"/com/horstmann/corejava/ImageViewer\");\n\
  \        // 从属性中获取位置、大小、标题\n        int left = node.getInt(\"left\", 0);\n     \
  \   int top = node.getInt(\"top\", 0);\n        int width = node.getInt(\"width\"\
  , DEFAULT_WIDTH);\n        int height = node.getInt(\"height\", DEFAULT_HEIGHT);\n\
  \        setBounds(left, top, width, height);\n        image = node.get(\"image\"\
  , null);\n        var label = new JLabel();\n        if (image != null) label.setIcon(new\
  \ ImageIcon(image));\n\n        addWindowListener(new WindowAdapter() {\n      \
  \      public void windowClosing(WindowEvent event) {\n                node.putInt(\"\
  left\", getX());\n                node.putInt(\"top\", getY());\n              \
  \  node.putInt(\"width\", getWidth());\n                node.putInt(\"height\",\
  \ getHeight());\n                if (image != null) node.put(\"image\", image);\n\
  \            }\n        });\n\n        // 使用标签显示图像\n        add(label);\n\n    \
  \    // 设置文件选择器\n        var chooser = new JFileChooser();\n        chooser.setCurrentDirectory(new\
  \ File(\".\"));\n\n        // 设置菜单栏\n        var menuBar = new JMenuBar();\n   \
  \     setJMenuBar(menuBar);\n\n        var menu = new JMenu(\"File\");\n       \
  \ menuBar.add(menu);\n\n        var openItem = new JMenuItem(\"Open\");\n      \
  \  menu.add(openItem);\n        openItem.addActionListener(_ -> {\n            //\
  \ 显示文件选择对话框\n            int result = chooser.showOpenDialog(null);\n\n        \
  \    // 如果选择了文件，将其设置为标签的图标\n            if (result == JFileChooser.APPROVE_OPTION)\
  \ {\n                image = chooser.getSelectedFile().getPath();\n            \
  \    label.setIcon(new ImageIcon(image));\n            }\n        });\n\n      \
  \  var exitItem = new JMenuItem(\"Exit\");\n        menu.add(exitItem);\n      \
  \  exitItem.addActionListener(_ -> System.exit(0));\n    }\n}\n```\n\n`java.util.prefs.Preferences`\
  \ 1.4\n\n*   `Preferences userRoot()`\n    返回调用程序的用户的用户的根偏好节点。\n\n*   `Preferences\
  \ systemRoot()`\n    返回系统级的根偏好节点。\n\n*   `Preferences node(String path)`\n    返回一个可以通过给定路径从当前节点到达的节点。如果\
  \ `path` 是绝对路径（即以 `/` 开头），则该节点从包含此偏好节点的树根开始定位。如果没有具有给定路径的节点，则创建它。\n\n*   `Preferences\
  \ userNodeForPackage(Class cl)`\n\n*   `Preferences systemNodeForPackage(Class cl)`\n\
  \    返回当前用户树或系统树中的一个节点，其绝对节点路径对应类 `cl` 的包名。\n\n*   `String[] keys()`\n    返回所有属于此节点的键。\n\
  \n*   `String get(String key, String def)`\n\n*   `int getInt(String key, int def)`\n\
  \n*   `long getLong(String key, long def)`\n*   `float getFloat(String key, float\
  \ def)`\n*   `double getDouble(String key, double def)`\n*   `boolean getBoolean(String\
  \ key, boolean def)`\n\n*   `byte[] getByteArray(String key, byte[] def)`\n    返回与给定键关联的值——如果没有与该键关联的值、关联的值类型不正确，或者偏好存储不可用，则返回提供的默认值。\n\
  \n*   `void put(String key, String value)`\n*   `void putInt(String key, int value)`\n\
  *   `void putLong(String key, long value)`\n*   `void putFloat(String key, float\
  \ value)`\n*   `void putDouble(String key, double value)`\n*   `void putBoolean(String\
  \ key, boolean value)`\n*   `void putByteArray(String key, byte[] value)`\n    在此节点上存储一个键/值对。\n\
  \n*   `void exportSubtree(OutputStream out)`\n    将此节点及其子节点的偏好写入指定的输出流。\n\n*   `void\
  \ exportNode(OutputStream out)`\n    将此节点的偏好（但不包括其子节点）写入指定的输出流。\n\n*   `void importPreferences(InputStream\
  \ in)`\n    导入指定流中包含的偏好设置。\n\n我们对图形用户界面编程的介绍此结束。下一章将向你展示如何使用最常用的 Swing 组件。\n\n\n\
  \n\n\n该模式精确地规定了这三个对象是如何交互的。模型存储内容且*没有用户界面*。对于按钮来说，内容非常简单——只是一小组标记位，用于指示按钮当前是按下状态还是弹起状态、激活状态还是非激活状态等。对于文本字段，内容就稍微有趣一点。它是一个持有当前文本的字符串对象。这与内容的视图*不是一回事*——如果内容大于文本字段，用户只能看到显示的部分文本（请参见图\
  \ 11.1）。\n\n.图 11.1：文本字段的模型和视图\n\n模型必须实现用于更改内容和发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次强调，请记住模型是完全非视觉化（non-visual）的。绘制存储在模型中的数据是视图的工作。\n\
  \n“模型（model）”这个术词可能并不十分恰当，因为我们通常认为模型是某个抽象概念的表示。汽车和飞机设计师建造模型来模拟真实的汽车和飞机。但在考虑模型-视图-控制器（MVC）模式时，这种类比实际上会误导你。在这种设计模式中，模型存储完整内容，而视图提供了该内容的（完整或不完全的）视觉表示。一个更好的类比可能是为艺术家摆姿的模特。观察模特并创建视图取决于艺术家。根据艺术家的不同，视图可能是一幅正式肖像、一幅印象派绘画，或者一幅肢体奇异扭曲的立体主义画。\n\
  \n模型-视图-控制器模式的优势之一是一个模型可以拥有多个视图，每个视图显示完整内容的不同部分或方面。例如，HTML 编辑器可以提供相同内容的两个*同时*视图：一个所见所得（WYSIWYG）视图和一个“原始标签”视图（请参见图\
  \ 11.2）。当通过其中一个视图的控制器更新模型时，它会通知所有关联的视图发生了变化。当视图收到通知时，它们会自动刷新自己。当然，对于像按钮这样简单的用户界面组件，你不会为同一个模型拥有多个视图。\n\
  \n.图 11.2：同一个模型的两个独立视图\n\n控制器处理用户输入事件，如鼠标点击和击键。然后它决定是否将这些事件转换为模型或视图的更改。例如，如果用户在文本框中按下一个字符键，控制器会调用模型的“插入字符”命令。然后模型告诉视图更新自己。视图永远不知道文本变化的原因。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件的发生。\n\
  \n图 11.3 显示了模型、视图和控制器对象之间的交互作用。\n\n.图 11.3：模型、视图和控制器对象之间的交互\n\n对于大多数 Swing 组件，模型类实现了一个以\
  \ `Model` 结尾的接口；在这种情况下，该接口被称为 `ButtonModel`。实现该接口的类可以定义各种类型按钮的状态。实际上，按钮并没有那么复杂，Swing\
  \ 库包含一个名为 `DefaultButtonModel` 的单一类，它实现了该接口。\n\n你可以通过查看 `ButtonModel` 接口的属性来了解按钮模型维护的某类数据——请参见表\
  \ 11.1。\n\n表 11.1：`ButtonModel` 接口的属性\n\n| 属性名称 | 值 |\n| --- | --- |\n| `actionCommand`\
  \ | 与此按钮关联的动作命令字符串 |\n| `mnemonic` | 此按钮的键盘快捷键 |\n| `armed` | 如果按钮按下且鼠标仍悬停在按钮上，则为\
  \ `true` |\n| `enabled` | 如果按钮可选，则为 `true` |\n| `pressed` | 如果按钮已被按下但鼠标按钮尚未释放，则为\
  \ `true` |\n| `rollover` | 如果鼠标悬停在按钮上，则为 `true` |\n| `selected` | 如果按钮已切换为开启（用于复选框和单选按钮），则为\
  \ `true` |\n\n每个 `JButton` 对象都存储了一个你可以获取的按钮模型对象。\n\n```\nvar button = new JButton(\"\
  Blue\");\nButtonModel model = button.getModel();\n```\n\n在实际实践中，你并不会关心——按钮状态的细微细节只对绘制它的视图感兴趣。所有重要信息——例如按钮是否启用——都可以从\
  \ `JButton` 类获取。（当然，`JButton` 随后会请求它的模型来获取该信息。）\n\n再看一遍 `ButtonModel` 接口，看看里面*没有*什么。模型*并不*存储按钮标签或图标。无法通过查看模型来发现按钮表面显示的内容。（实际上，如你将在第\
  \ 11.4.2 节中看到的，这种设计的纯洁性给程序员带来了一些烦恼。）\n\n同样重要的是，*同一个*模型（即 `DefaultButtonModel`）被用于推入按钮、单选按钮、复选框甚至菜单项。当然，每种按钮类型都有不同的视图和控制器。所以，在阅读了关于\
  \ `JButton` 内部实现的简短介绍后，你可能会想：`JButton` 到底是什么？它只是继承自 `JComponent` 的封装类，持有 `DefaultButtonModel`\
  \ 对象、一些视图数据（如按钮标签和图标）以及一个负责按钮视图的 `BasicUI` 对象。\n\n## 11.2. 布局管理简介\n\n在讨论具体的组件之前，让我们简要介绍如何在框架内安排这些组件。\n\
  \n当然，Java 开发环境具有拖放 GUI 构建器。然而，确切了解内部原理是重要的，因为即使是最好的工具也需要手动调整。\n\n### 11.2.1. 布局管理器\n\
  \n让我们从回顾第 10 章中用于按钮更改框架背景色的程序开始。\n\n按钮包含在 `JPanel` 对象中，并由流式布局管理器管理，这是面板的默认布局管理器。图\
  \ 11.4 显示了当向面板中添加更多按钮时会发生什么。正如你所见，当没有空间时会开启新的一行。\n\n![Figure](img/buttontest2.jpg)图\
  \ 11.4：由流式布局管理的带有六按钮的面板\n\n此外，即使用户调整框架大小，按钮也保持在面板中居中（参见图 11.5）。\n\n![Figure](img/buttontest3.jpg)图\
  \ 11.5：更改面板大小会自动重新排列按钮。\n\n\n\n\n遗憾的是，继承层次结构在两个方面并不完美。首先，顶层窗口（如 `JFrame`）是 `Container`\
  \ 的子类，因此也是 `Component`，但它们不能被放在其他容器内部。此外，`JComponent` 是 `Container` 的子类，而不是 `Component`。因此，你可以将其他组件添加到\
  \ `JButton` 中。（然而，这些组件将不会显示。）\n\n每个容器都有一个默认的布局管理器，但你始终可以设置自己的布局管理器。例如，以下语句：\n\n\
  ```\npanel.setLayout(new GridLayout(4, 4));\n```\n\n使用 `GridLayout` 类将组件排列为四行四列。当你向容器中添加组件时，容器的\
  \ `add` 方法会将组件和任何位置方向传递给布局管理器。\n\n### `java.awt.Container` 1.0\n\n*   `void setLayout(LayoutManager\
  \ m)`\n    为此容器设置布局管理器。\n*   `Component add(Component c)`\n*   `Component add(Component\
  \ c, Object constraints)` 1.1\n    向此容器中添加一个组件并返回该组件的引用。\n\n### `java.awt.FlowLayout`\
  \ 1.0\n\n*   `FlowLayout()`\n*   `FlowLayout(int align)`\n*   `FlowLayout(int align,\
  \ int hgap, int vgap)`\n    构造一个新的 `FlowLayout`。`align` 参数是 `LEFT`、`CENTER` 或 `RIGHT`\
  \ 之一。\n\n### 11.2.2 边界布局 (Border Layout)\n\n`边界布局管理器` 是每个 `JFrame` 内容面板的默认布局管理器。与完全控制每个组件位置的流布局管理器不同，边界布局管理器允许你选择想要放置每个组件的位置。你可以选择将组件放置在内容面板的中心、北、南、东或西（请参见\
  \ 图 11.7）。\n\n.图 11.7: 边界布局\n\n例如：\n\n```\nframe.add(component, BorderLayout.SOUTH);\n\
  ```\n\n首先布局边缘组件，剩余的可用空间由中心占据。当容器调整大大同时，边缘组件的尺寸保持不变，但中心组件会改变大小。通过指定 `BorderLayout`\
  \ 类的常量 `CENTER`、`NORTH`、`SOUTH`、`EAST` 或 `WEST` 来添加组件。并不是所有位置都需要被占据。如果你不提供任何值，则假设为\
  \ `CENTER`。\n\n`BorderLayout` 常量定义为字符串。例如，`BorderLayout.SOUTH` 被定义为字符串 `\"South\"\
  `。这比直接使用字符串更安全。如果你不小心拼错了字符串，例如 `frame.add(component, \"south\")`，编译器不会捕获该错误。\n\n\
  与流布局不同，边界布局会扩展所有组件以填充可用空间。（流布局让每个组件保持其首选尺寸）。当你添加按钮时，就会出现问题：\n\n```\nframe.add(yellowButton,\
  \ BorderLayout.SOUTH); // 不要这么做\n```\n\n图 11.8 显示了使用上述代码段时发生的情况。按钮已经增大并填充了框架整个南部区域。而且，如果你在南部区域添加另一个按钮，它将只会挤掉第一个按钮。\n\
  \n![Figure](img/buttontest4.jpg)图 11.8: 由边界布局管理的单个按钮\n\n要解决这个问题，请使用额外的面板。例如，查看 图\
  \ 11.9。屏幕底部的三个按钮都包含在一个面板中。该面板被放入内容面板的南部区域。\n\n![Figure](img/buttontest5.jpg)图 11.9:\
  \ 放置在框架南部区域的面板\n\n要实现这种配置，首先创建一个新的 `JPanel` 对象，然后将各个按钮添加到面板中。面板的默认布局管理器是 `FlowLayout`，这对于这种情况是一个很好的选择。使用你之前见过的\
  \ `add` 方法将各个按钮添加到面板中。按钮的位置和大小由 `FlowLayout` 管理器控制。这意味着按钮在面板内居中显示，而不会扩展以填充整个面板区域。最后，将面板添加到框架的内容面板中。\n\
  \n```\nvar panel = new JPanel();\npanel.add(yellowButton);\npanel.add(blueButton);\n\
  panel.add(redButton);\nframe.add(panel, BorderLayout.SOUTH);\n```\n\n边界布局扩展了面板的大小以填充整个南部区域。\n\
  \n### `java.awt.BorderLayout` 1.0\n\n*   `BorderLayout()`\n*   `BorderLayout(int\
  \ hgap, int vgap)`\n    构造一个新的 `BorderLayout`。\n\n### 11.2.3 网格布局 (Grid Layout)\n\
  \n网格布局像电子表格一样按行和列排列所有组件。所有组件具有相同的尺寸。图 11.10 中的计算器程序使用网格布局来排列计算器按钮。当你调整窗口大同时，按钮会增大缩小，但所有按钮的大小都是相同的。\n\
  \n![Figure](img/calculator.jpg)图 11.10: 计算器\n\n在网格布局对象的构造函数中，指定需要的行和列。\n\n```\n\
  panel.setLayout(new GridLayout(4, 4));\n```\n\n添加组件，从第一行的第一个项目开始，然后是第一行的第二个项目，依此类推。\n\
  \n```\npanel.add(JButton(\"1\"));\npanel.add(JButton(\"2\"));\n```\n\n当然，很少有应用程序像计算器界面那样有僵板的布局。在实践中，小型网格（通常只有一行或一列）对于组织窗口的部分区域非常有用。例如，如果你想有一行大小相同的按钮，可以将按钮放在一个由单行网格布局管理的面板内部。\n\
  \n### `java.awt.GridLayout` 1.0\n\n*   `GridLayout(int rows, int columns)`\n*  \
  \ `GridLayout(int rows, int columns, int hgap, int vgap)`\n    构造一个新的 `GridLayout`。`rows`\
  \ 和 `columns` 其中之一（但不同时）可以为零，表示每行或每列组件任意。\n\n## 11.3 文本输入\n\n我们终于准备好引入用户界面组件了。让我们从用户输入和编辑文本的组件开始。你可以使用\
  \ `JTextField` 和 `JTextArea` 组件进行文本输入。文本字段只能接受一行文本；文本区域可以接受多行文本。`JPasswordField`\
  \ 接受一行文本但不显示其内容。\n\n这三个类都继承自一个名为 `JTextComponent` 的类。你无法自己构造 `JTextComponent`，因为它是一个抽象类。另一方面，正如\
  \ Java 中常见的情况一样，当你查阅 API 文档时，可能会发现你寻找的方法实际上在父类 `JTextComponent` 中而不是派生类中。例如，获取或设置文本字段或文本区域文本的方法实际上在\
  \ `JTextComponent` 中。\n\n### `javax.swing.text.JTextComponent` 1.2\n\n*   `String\
  \ getText()`\n*   `void setText(String text)`\n    获取或设置此文本组件的文本。\n*   `boolean\
  \ isEditable()`\n*   `void setEditable(boolean b)`\n    获取或设置 `editable` 属性，该属性决定用户是否可以编辑此文本组件的内容。\n\
  \n### 11.3.1 文本字段\n\n向窗口添加文本字段的通常方法是将其添加到面板或其他容器中——就像添加按钮一样：\n\n```\nvar panel =\
  \ new JPanel();\nvar textField = new JTextField(\"Default input\", 20);\npanel.add(textField);\n\
  ```\n\n\n\n\n这段代码添加了一个文本字段，并通过在其中放入 `\"Default input\"` 字符串来对其初始化。该构造函数的第二个参数设置了宽度。在这种情况下，宽度为\
  \ 20 个“列”。遗憾的是，“列”是一个相当不精确的测量单位。一列是你所用于文本的字体中一个字符的预期宽度。其理念是，如果你预计输入少于或等于 `n` 个字符，就应该指定\
  \ `n` 为列宽。在实践中，这种测量方法并不理想，为了保险起见，你应该在最大输入长度上增加 1 或 2。此外，请记住，列数只是给 AWT 的一个关于 `preferred`（首选）的提示。如果布局管理器需要放大或缩小文本字段，它可以调整其大小。你在\
  \ `JTextField` 构造函数中设置的列宽并不是用户可以输入的字符数的上限。用户仍然可以输入更长的字符串，但当文本超过字段长度时，输入会滚动。用户往往会认为滚动文本字段令人困恼，因此你应该为字段留出足够宽裕的尺寸。如果你需要在运行时重置列数，可以使用\
  \ `setColumns` 方法。\n\n在使用 `setColumns` 方法更改文本框的大小后，调用周围容器的 `revalidate` 方法。\n\n\
  ```java\ntextField.setColumns(10);\npanel.revalidate();\n```\n\n`revalidate` 方法会重新计算容器中所有组件的大小和布局。在你使用\
  \ `revalidate` 方法后，布局管理器会调整容器的大小，文本字段改变后的尺寸将变得可见。\n\n`revalidate` 方法属于 `JComponent`\
  \ 类。它不会立即调整组件的大小，而仅仅将其标记为需要调整大小。这种方法避免了在多个组件请求调整大小时的重复计算。然而，如果你想重新计算 `JFrame` 内部的所有组件，你必须调用\
  \ `validate` 方法——`JFrame` 并没有继承 `JComponent`。\n\n通常情况下，用户在文本字段中添加文本（或编辑现有文本）。这些文本字段经常是空白的。要创建一个空白的文本字段，只需不要为\
  \ `JTextField` 构造函数提供字符串参数即可：\n\n```java\nvar textField = new JTextField(20);\n\
  ```\n\n你可以通过使用上一节提到的父类 `JTextComponent` 中的 `setText` 方法随时更改文本字段的内容。例如：\n\n```java\n\
  textField.setText(\"Hello!\");\n```\n\n而且，正如上一节中提到的，你可以通过调用 `getText` 方法获取用户输入了什么。该方法返回用户输入的精确文本。要移除文本字段数据中任何多余的前导和尾空格，应对\
  \ `getText` 的返回值应用 `strip` 方法：\n\n```java\nString text = textField.getText().strip();\n\
  ```\n\n要更改用户文本显示的字体，请使用 `setFont` 方法。\n\n### `javax.swing.JTextField` 1.2\n\n* \
  \  `JTextField(int columns)`\n    构造一个具有指定列数的空空 `JTextField`。\n*   `JTextField(String\
  \ text, int columns)`\n    构造一个具有初始字符串和指定列数的新 `JTextField`。\n*   `int getColumns()`\n\
  *   `void setColumns(int columns)`\n    获取或设置此文本字段应该使用的列数。\n\n### `javax.swing.JComponent`\
  \ 1.2\n\n*   `void revalidate()`\n    导致组件的位置和大小重新计算。\n*   `void setFont(Font f)`\n\
  \    设置此组件的字体。\n\n### `java.awt.Component` 1.0\n\n*   `void validate()`\n    重新计算组件的位置和大小。如果该组件是容器，则重新计算其内部组件的位置和大小。\n\
  *   `Font getFont()`\n    获取此组件的字体。\n\n### 11.3.2 标签与标记组件\n\n标签是持有文本的组件。它们没有装饰（例如，没有边界）。它们也不会对用户输入做出反应。你可以使用标签来标识组件。例如，与按钮不同，文本字段没有标签来标识它们。要为一个本身不带标识符的组件标记：\n\
  \n1.  构造一个带有正确文本的 `JLabel` 组件。\n2.  将其放置在你想要标识的组件足够近的位置，以便用户能够看到该标签标识了正确的组件。\n\n\
  `JLabel` 的构造函数允许你指定初始文本或图标，以及可选的内容对齐方式。使用 `SwingConstants` 接口中的常量来指定对齐。该接口定义了许多常量，如\
  \ `LEFT`、`RIGHT`、`CENTER`、`NORTH`、`EAST` 等。`JLabel` 类是实现此接口的 Swing 类之一。因此，你可以通过以下方式指定右对齐标签：\n\
  \n```java\nvar label = new JLabel(\"User name: \", SwingConstants.RIGHT);\n```\n\
  \n或者\n\n```java\nvar label = new JLabel(\"User name: \", JLabel.RIGHT);\n```\n\n\
  `setText` 和 `setIcon` 方法允许你在运行时设置标签的文本和图标。\n\n你可以在按钮、标签和菜单项中使用纯文本和 HTML 文本。我不建议在按钮中使用\
  \ HTML——它会干扰视觉效果。但标签中使用 HTML 可以非常有效。只需将标签字符串用 `<html>. . .</html>` 包起来即可，如下所示：\n\
  \n```java\nlabel = new JLabel(\"<html><b>Required</b> entry:\");\n```\n\n注意，带有 HTML\
  \ 的标签显示可能需要时间，因为必须加载渲染 代码。\n\n标签可以像其他组件一样放置在容器中。这意味着你可以使用之前过的技术将标签放在需要的地方。\n\n###\
  \ `javax.swing.JLabel` 1.2\n\n*   `JLabel(String text)`\n*   `JLabel(Icon icon)`\n\
  *   `JLabel(String text, int align)`\n*   `JLabel(String text, Icon icon, int align)`\n\
  \    构造标签。`align` 参数是 `SwingConstants` 常量 `LEFT`、`CENTER` 或 `RIGHT` 之一。\n*   `String\
  \ getText()`\n*   `void setText(String text)`\n    获取或设置此标签的文本。\n*   `Icon getIcon()`\n\
  *   `void setIcon(Icon icon)`\n    获取或设置此标签的图标。\n\n### 11.3.3 密码字段\n\n密码字段是文本字段的一种特殊类型。为了防止旁人看到密码，用户输入的字符不会实际显示。相反，每个输入的字符都由一个显示字符表示，例如圆点（•）。Swing\
  \ 提供了一个实现此类文本字段的 `JPasswordField` 类。\n\n密码字段是模型视图-控制器架构的另一个示例。密码字段使用与文本字段相同的模型来存储数据，但其视图已被更改为显示所有字符为字符。\n\
  \n### `javax.swing.JPasswordField` 1.2\n\n*   `JPasswordField(String text, int columns)`\n\
  \    构造一个新的密码字段。\n*   `void setEchoChar(char echo)`\n    设置此密码字段的显示字符。值 `0` 将显示字符重置为默认。\n\
  *   `char[] getPassword()`\n    返回此密码字段包含的文本。为了增强安全性，你应该在使用后覆盖返回数组的内容。\n\n### 11.3.4\
  \ 文本区域\n\n有时，你需要收集多一行的用户输入。正如之前提到的，你可以使用 `JTextArea` 组件来实现此。当你向程序中放置一个文本区域组件时，用户可以输入任意行的文本，并使用回车键将它们分隔。每行都以\
  \ `'\\n'` （即使在 Windows 上也是如此）。图 11.11 显示了文本区域的工作。\n\n![Figure](img/textcomponenttest.jpg)图\
  \ 11.11: 文本组件\n\n\n\n\n在 `JTextArea` 组件的构造函数中，指定文本区域的行数和列数。例如\n\n```\ntextArea =\
  \ new JTextArea(8, 40); // 8 行，每行 40 列\n```\n\n其中 `columns` 参数的作用与之前一样——为了安全起见，你仍然需要多添加几列。同样与之前一样，用户并不受到行数和列数的限制；当用户输入内容过多时，文本会进行滚动。你还可以使用\
  \ `setColumns` 方法更改列数，并使用 `setRows` 方法更改行数。这些数字仅表示首选大小——布局管理器仍然可以放大或缩小文本区域。\n\n\
  如果文本多于文本区域能够显示的范围，剩余的文本将直接裁剪。你可以通过开启自动换行来避免长行被裁剪：\n\n```\ntextArea.setLineWrap(true);\
  \ // 长行将换行\n```\n\n这种换行仅是视觉效果；文档中的本身不会发生变化——不会在文本中自动插入 `'\\n'` 字符。\n\n### 11.3.5.\
  \ 滚动面板 (Scroll Panes)\n\n在 Swing 中，文本区域没有滚动条。如果你需要滚动条，则必须将文本区域放在滚动面板内部。\n\n```\n\
  textArea = new JTextArea(8, 40);\nvar scrollPane = new JScrollPane(textArea);\n\
  ```\n\n现在滚动面板管理文本区域的视图。如果文本多于文本区域能够显示的范围，滚动条会自动出现；当文本被删除且剩余文本能够放入区域内时，滚动条会再次消失。滚动由滚动面板内部处理——你的程序不需要处理滚动事件。\n\
  \n这是一个适用于任何组件的通用机制，而不只是文本区域。要为组件添加滚动条，请将其放入滚动面板中。\n\n代码列表 11.1 展示了各种文本组件。该程序显示了一个文本字段、一个密码字段以及一个带有滚动条的文本区域。文本字段和密码字段都有标签。点击“插入\
  \ (Insert)”可以将字段内容插入到文本区域中。\n\n`JTextArea` 组件仅显示纯文本，没有特殊字体或格式。要显示格式化文本（如 HTML），你可以使用\
  \ 第 12 章 中讨论的 `JEditorPane` 类。\n\n代码列表 11.1 v2ch11/text/TextComponentFrame.java\n\
  \n```java\npackage v2ch11.text;\n\nimport module java.desktop;\n\n/**\n *  own 带有示例文本组件的框架。\n\
  \ */\npublic class TextComponentFrame extends JFrame {\n    private static final\
  \ int TEXTAREA_ROWS = 8;\n    private static final int TEXTAREA_COLUMNS = 20;\n\n\
  \    public TextComponentFrame() {\n        var textField = new JTextField();\n\
  \        var passwordField = new JPasswordField();\n\n        var northPanel = new\
  \ JPanel();\n        northPanel.setLayout(new GridLayout(2, 2));\n        northPanel.add(new\
  \ JLabel(\"User name: \", SwingConstants.RIGHT));\n        northPanel.add(textField);\n\
  \        northPanel.add(new JLabel(\"Password: \", SwingConstants.RIGHT));\n   \
  \     northPanel.add(passwordField);\n\n        add(northPanel, BorderLayout.NORTH);\n\
  \n        var textArea = new JTextArea(TEXTAREA_ROWS, TEXTAREA_COLUMNS);\n     \
  \   var scrollPane = new JScrollPane(textArea);\n\n        add(scrollPane, BorderLayout.CENTER);\n\
  \n        // 添加按钮以将文本追加到文本区域\n\n        var southPanel = new JPanel();\n\n     \
  \   var insertButton = new JButton(\"Insert\");\n        southPanel.add(insertButton);\n\
  \        insertButton\n                .addActionListener(_ -> textArea.append(\"\
  User name: \" + textField.getText()\n                        + \" Password: \" +\
  \ new String(passwordField.getPassword()) + \"\\n\"));\n\n        add(southPanel,\
  \ BorderLayout.SOUTH);\n        pack();\n    }\n}\n```\n\n`javax.swing.JTextArea`1.2\n\
  \n*   `JTextArea()`\n*   `JTextArea(int rows, int columns)`\n*   `JTextArea(String\
  \ text, int rows, int columns)`\n    构造一个新的文本区域。\n\n*   `void setColumns(int columns)`\n\
  \    告诉文本区域它应该使用的理想列数。\n\n*   `void setRows(int rows)`\n    告诉文本区域它应该使用的理想行数。\n\n\
  *   `void append(String newText)`\n    将给定文本追加到文本区域中已有文本的末尾。\n\n*   `void setLineWrap(boolean\
  \ wrap)`\n    开启或关闭行换行。\n\n*   `void setWrapStyleWord(boolean word)`\n    如果 `word`\
  \ 为 `true`，则长行会在单词边界换行。如果为 `false`，则长行在不考虑单词边界的情况下折断。\n\n*   `void setTabSize(int\
  \ c)`\n    设置每 `c` 列一个制表位。请注意，制表符不会被转换为空格，而是会导致与下一个制表位对齐。\n\n`javax.swing.JScrollPane`1.2\n\
  \n*   `JScrollPane(Component c)`\n    创建一个显示指定组件内容的滚动面板。当组件尺寸大于视图时，将提供滚动条。\n\n##\
  \ 11.4. 选择组件 (Choice Components)\n\n你现在知道如何从用户那里收集文本输入，但在许多情况下，你更倾向于给用户一组有限的选择，而不是让他们在文本组件中输入数据。使用一组按钮或列表可以告诉用户他们有哪些选择。（这还为你节省了进行错误检查的麻烦。）在在本节中，你将学习如何编写复选框、单选按钮、列表和滑块。\n\
  \n### 11.4.1. 复选框 (Checkboxes)\n\n如果你只想收集“是”或“否”的输入，请使用复选框组件。复选框会自动带有标识它们的标签。用户可以通过点击内部来勾选框框，通过再次点击内部来取消勾选标记。当焦点在复选框时，按下空格键也可以切换勾选状态。\n\
  \n图 11.12 显示了一个带有两个复选框的简单程序，一个用于开启或关闭字体的斜体属性，另一个用于加粗。注意第二个复选框具有焦点，如标签周围的矩形所示。每当用户点击其中一个一个复选框时，屏幕都会刷新，并使用新的字体属性。\n\
  \n![Figure](img/checkboest.jpg)图 11.12: 复选框\n\n复选框旁边需要一个标签来标识其用途。在构造函数中提供标签文本：\n\
  \n```java\nbold = new JCheckBox(\"Bold\");\n```\n\n使用 `setSelected` 方法来开启或关闭复选框。例如：\n\
  \n```java\nbold.setSelected(true);\n```\n\n`isSelected` 方法随后获取每个复选框的当前状态。未勾选则为 `false`，勾选则为\
  \ `true`。\n\n当用户点击复选框时，这将触发一个动作事件。一既往，你为复选框添加动作监听器。在我们的程序中，两个复选框共享同一个监听器。\n\n```java\n\
  ActionListener listener = . . .;\nbold.addActionListener(listener);\nitalic.addActionListener(listener);\n\
  ```\n\n监听器查询 `bold` 和 `italic` 复选框的状态，并将面板的字体设置为普通、加粗、斜体或同时加粗且斜体。\n\n```java\nActionListener\
  \ listener = _ -> {\n    int mode = 0;\n    if (bold.isSelected()) mode += Font.BOLD;\n\
  \    if (italic.isSelected()) mode += Font.ITALIC;\n    label.setFont(new Font(Font.SERIF,\
  \ mode, FONTSIZE));\n};\n```\n\n代码列表 11.2 是复选框示例的程序列表。\n\n代码列表 11.2 v2ch11/checkBox/CheckBoxFrame.java\n\
  \n\n\n\n```\npackage v2ch11.checkBox;\n\nimport module java.desktop;\n\n/**\n *\
  \ 一个带有示例文本标签和用于选择字体属性的复选框的框架\n */\npublic class CheckBoxFrame extends JFrame {\n\
  \    private JLabel label;\n    private JCheckBox bold;\n    private JCheckBox italic;\n\
  \    private static final int FONTSIZE = 24;\n\n    public CheckBoxFrame() {\n \
  \       // 添加示例文本标签\n\n        label = new JLabel(\"The quick brown fox jumps over\
  \ the lazy dog.\");\n        label.setFont(new Font(\"Serif\", Font.BOLD, FONTSIZE));\n\
  \        add(label, BorderLayout.CENTER);\n\n        // 此监听器根据复选框的状态\n        //\
  \ 设置标签的字体属性\n\n        ActionListener listener = _ -> {\n            int mode =\
  \ 0;\n            if (bold.isSelected()) mode += Font.BOLD;\n            if (italic.isSelected())\
  \ mode += Font.ITALIC;\n            label.setFont(new Font(\"Serif\", mode, FONTSIZE));\n\
  \        };\n\n        // 添加复选框\n        var buttonPanel = new JPanel();\n\n   \
  \     bold = new JCheckBox(\"Bold\");\n        bold.addActionListener(listener);\n\
  \        bold.setSelected(true);\n        buttonPanel.add(bold);\n\n        italic\
  \ = new JCheckBox(\"Italic\");\n        italic.addActionListener(listener);\n  \
  \      buttonPanel.add(italic);\n\n        add(buttonPanel, BorderLayout.SOUTH);\n\
  \        pack();\n    }\n}\n```\n\n`javax.swing.JCheckBox`1.2\n\n*   `JCheckBox(String\
  \ label)`\n\n*   `JCheckBox(String label, Icon icon)`\n\n    构造一个初始未选中的复选框。\n\n\
  *   `JCheckBox(String label, boolean state)`\n\n    构造一个给定标签和初始状态的复选框。\n\n*   `boolean\
  \ isSelected()`\n\n*   `void setSelected(boolean state)`\n\n    获取或设置复选框的选择状态。\n\
  \n### 11.4.2. 单选按钮\n\n在以前的示例中，用户可以勾选两个复选框中的任意一个、两个或两个都不勾选。在很多情况下，我们希望用户只勾选几个框中的一个。当另一个框被选中时，之前的框会自动取消选中。这样一组框通常被称为`单选按钮组`（radio\
  \ button group），因为这些按钮的工作就像收音机上的电台选择按钮。当你按下其中一个按钮时，之前按下的按钮就会弹出。图 11.13 显示了一个典型的示例。我们允许用户从可选范围——小、中、大或特大中选择字体号，但当然，我们允许一次只选择一种大小。\n\
  \n![Figure](img/radiobuttontest.jpg)图 11.13：单选按钮组\n\n在 Swing 中实现单选按钮组非常简单。你为每组按钮构造一个\
  \ `ButtonGroup` 类型的对象。然后，你将 `JRadioButton` 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时关闭之前设置的按钮。\n\
  \n```\nvar group = new ButtonGroup();\n\nvar smallButton = new JRadioButton(\"Small\"\
  , false);\ngroup.add(smallButton);\n\nvar mediumButton = new JRadioButton(\"Medium\"\
  , true);\ngroup.add(mediumButton);\n. . .\n```\n\n构造函数的第二个参数对于初始应选中的按钮为 `true`，对于所有其他按钮为\
  \ `false`。注意，按钮组只控制按钮的`行为`；如果你是为了布局目的而对按钮分组，还需要将它们添加到诸如 `JPanel` 等容器中。\n\n如果你再次查看图\
  \ 11.12，你会注意到单选按钮的外观与图 11.13 中的复选框不同。复选框是正方形的，选中时包含标记。单选按钮是圆形的，选中时包含一个点。\n\n单选按钮的事件通知机制与其他按钮相同。当用户选中单选按钮时，该按钮会产生一个事件。在我们的示例程序中，我们定义了一个监听器将字体大小设置为特定的值：\n\
  \n```\nActionListener listener = _ -> label.setFont(new Font(\"Serif\", Font.PLAIN,\
  \ size));\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮获得一个不同的监听器对象。每个监听器对象都确切知道需要做什么——将字体大小设置为特定值。对于复选框，我们使用了不同的方法：两个复选框拥有同一个动作监听器，该监听器调用一个方法查看两个复选框当前的状态。\n\
  \n我们在这里采用同样的方法吗？我们可以有一个单一的监听器如下计算大小：\n\n```\nif (smallButton.isSelected()) size\
  \ = 8;\nelse if (mediumButton.isSelected()) size = 12;\n. . .\n```\n\n然而，我们倾向于使用单独的动作监听器对象，因为它们大小值与按钮结合得更紧密。\n\
  \n如果你有一组单选按钮，你知道其中只有一个被选中。如果能够快速找到是哪一个，而不需要查询组中的所有按钮，那就好了。`ButtonGroup` 对象控制所有按钮，如果这个对象可以为我们被选中按钮的引用，将非常方便。事实上，`ButtonGroup`\
  \ 类有一个 `getSelection` 方法，但该方法返回的不是选中的单选按钮，而是返回一个 `ButtonModel` 引用。\n\n\n\n\n\n*\
  \ `ButtonModel getSelection()`\n    返回所选按钮的按钮模型。\n\n`javax.swing.ButtonModel` 1.2\n\
  \n* `String getActionCommand()`\n    返回此按钮模型的动作命令。\n\n`javax.swing.AbstractButton`\
  \ 1.2\n\n* `void setActionCommand(String s)`\n    设置此按钮及其模型的动作命令。\n\n### 11.4.3.\
  \ 边界 (Borders)\n\n如果你在窗口中有组单选按钮，你可能需要在视觉上指示哪些按钮是分组的。Swing 提供了一组有用的 `borders` 用于此目的。你可以将边框应用于任何扩展自\
  \ `JComponent` 的组件。最常用的用法是在面板周围放置边框，并在面板中填充其他用户界面元素，如单选按钮。\n\n你可以选择许多边框，但对所有边框都需要遵循相同的步骤。\n\
  \n1. 调用 `BorderFactory` 的静态方法来创建边框。你可以从以下样式中选择（参见图 11.14）：\n\n    * 凹斜角 (Lowered\
  \ bevel)\n    * 凸斜角 (Raised bevel)\n    * 刻蚀 (Etched)\n    * 线条 (Line)\n    * 哑光\
  \ (Matte)\n    * 空白（Empty，仅在组件周围留出一些空间）\n\n    ![Figure](img/bordertest.jpg)图 11.14:\
  \ 边界类型测试\n\n2. 如果需要，可以通过将边框传递给 `BorderFactory.createTitledBorder` 为你的边框添加标题。\n\n\
  3. 如果你真的想到位，可以通过调用 `BorderFactory.createCompoundBorder` 组合多个边框。\n\n4. 通过调用 `JComponent`\
  \ 类的 `setBorder` 方法将生成的边框添加到你的组件中。\n\n例如，以下是如何向面板添加带标题的刻蚀边框的：\n\n```\nBorder etched\
  \ = BorderFactory.createEtchedBorder();\nBorder titled = BorderFactory.createTitledBorder(etched,\
  \ \"A Title\");\npanel.setBorder(titled);\n```\n\n不同的边框具有设置边框宽度和颜色的不同选项；详情请参见 API\
  \ 说明。真正的边框爱好者会发现，还有一个 `SoftBevelBorder` 类用于圆角软化的斜角边框，并且 `LineBorder` 也可以具有圆角。你只能通过使用类构造函数之一来构造这些边框——它们没有对应的\
