  )\nprivate DataSource source;\n```\n\n# 第 6 章 日期和时间 API\n\n时光飞逝如箭，我们可以轻松地设置一个起点，并向前或向后计算秒。那么，为什么处理时间这么困难呢？问题在于人类。如果我们能互相告诉对方：“在\
  \ 1523793600 见我，不要迟到！”那一切都会简单了。但我们希望时间与日光和季节相关联。Java 1.0 有一个 `Date` 类，从回过来看，它是幼稚的，并且在\
  \ Java 1.1 引入 `Calendar` 类时，它的大部分方法都被弃用了了。它的 API 并不完美，其实例是可变的，而且没有处理闰秒等问题。事事三次为师，Java\
  \ 8 引入的 `java.time` API 弥补了过去的缺陷，并且应该足够我们使用很长一段时间了。\n\n## 6.1. 时间线\n\n从历史上看，基本时间单位——秒源于地球绕自轴的旋转。一个完整的转圈有\
  \ 24 小时，即 24 × 60 × 60 = 86400 秒，因此精确定义秒似乎只是天文学测量的问题。不幸的是，地球会轻微晃动，需要更精确的定义。1967\
  \ 年，一种与历史定义匹配的新精确秒定义源于 133 铯原子的内在属性。从那时起，一个原子钟网络维持着官方时间。\n\n\n\n\n官方计时器经常会使绝对时间与地球自转保持同步。起初，官方会对“秒”进行微调，但从\
  \ 1972 年开始，偶尔会插入“闰秒”（在理论上，偶尔可能需要删除一秒，但这种情况尚未发生）。目前有关于再次更改该系统的讨论。显然，闰秒是一件麻烦事，许多计算机系统转而使用“平滑”处理，即在闰秒发生之前人为地减慢或加速时间，以保持每天\
  \ 86,400 秒。这样做之所以有效，是因为计算机的本地时间并不精确，而且计算机习惯了与外部时间服务进行同步。\n\nJava 日期时间 API 规范要求 Java\
  \ 使用的时间尺度必须满足：\n\n*   每天有 86,400 秒\n*   每天中午与官方时间完全匹配\n*   在其他地方以精确定义的方式与官方时间密切匹配\n\
  \n这使得 Java 具有灵活性，可以适应未来官方时间的变更。\n\n在 Java 中，`Instant` 代表时间线上的一个点。一个称为 `epoch`（纪元）的起点被任意设置为\
  \ 1970 年 1 月 1 日午夜，即通过伦敦格林尼治皇家天文台的天子线。这与 UNIX/POSIX 时间使用的约定相同。从该起点开始，时间以每天 86,400\
  \ 秒向前或向后测量，精度达到纳秒。`Instant` 值可以追溯到十亿年前（`Instant.MIN`）。这还不足以表达宇宙的年龄（约 135 亿年），但对于所有实际用途来说已经足够了。毕竟，十亿年前地球还被冰川覆盖，居住着今天植物动物的微型祖先。最大值\
  \ `Instant.MAX` 是 1,000,000,000 年 12 月 31 日。\n\n静态方法调用 `Instant.now()` 提供当前实例。你可以按照通常的方式使用\
  \ `equals` 和 `compareTo` 方法比较两个实例，因此你可以将实例用作时间戳。\n\n要找两个两个实例 之间的差值，请使用静态方法 `Duration.between`。例如，以下是衡量一个算法运行时间的方法：\n\
  \n```\nInstant start = Instant.now();\nrunAlgorithm();\nInstant end = Instant.now();\n\
  Duration timeElapsed = Duration.between(start, end);\nlong millis = timeElapsed.toMillis();\n\
  ```\n\n`Duration` 是两个实例之间的时间量。你可以通过调用 `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours`\
  \ 或 `toDays` 以传统单位获取 `Duration` 的长度。\n\n在 Java 8 中，你需要调用 `getSeconds` 而不是 `toSeconds`。\n\
  \n如果你需要纳秒精度，请注意溢出。一个 `long` 值几乎可以存储 300 年的纳秒。如果你的持续时间比这短，只需将其转换为纳秒即可。你可以使用更长的持续时间——`Duration`\
  \ 对象用一个 `long` 存储秒数，用额外的 `int` 存储纳秒数。`Duration` API 拥有许多用于算术运算的方法，显示在本节末尾。\n\n例如，如果你想检查一个算法是否比另一个算法至少快十倍，你可以计算：\n\
  \n```\nDuration timeElapsed2 = Duration.between(start2, end2);\nboolean overTenTimesFaster\n\
  \     = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n```\n\n\
  这只是为了展示语法。由于算法不会运行几百年，你可以简单地使用：\n\n```\nboolean overTenTimesFaster = timeElapsed.toNanos()\
  \ * 10 < timeElapsed2.toNanos();\n```\n\n`Instant` 和 `Duration` 类是不可变的，所有的方法（如 `multipliedBy`\
  \ 或 `minus`）都会返回一个新实例。\n\nListing 6.1 中的示例程序使用了 `Instant` 和 `Duration` 类对两个算法进行计时。\n\
  \n该示例程序的方法在实践中太简单了，因为它没有处理诸如 JVM 中即时编译器的“预热”等问题。如果你需要比较算法，应该使用专门的基准测试工具，例如 Java\
  \ 微基准框架（JMH）。[`www.oracle.com/technical-resources/articles/java/architect-benchmarking.html`](https://www.oracle.com/technical-resources/articles/java/architect-benchmarking.html)\
  \ 文章提供了实用的建议。\n\nListing 6.1 v2ch06/Timeline.java\n\n```java\npackage v2ch06;\n\n\
  /**\n * 此程序演示了实例和持续时间。\n */\n\nimport module java.base;\n\npublic class Timeline\
  \ {\n    RandomGenerator generator = RandomGenerator.getDefault();\n\n    void main()\
  \ {\n        Instant start = Instant.now();\n        runAlgorithm();\n        Instant\
  \ end = Instant.now();\n        Duration timeElapsed = Duration.between(start, end);\n\
  \        long millis = timeElapsed.toMillis();\n        IO.println(\"%d milliseconds\"\
  .formatted(millis));\n\n        Instant start2 = Instant.now();\n        runAlgorithm2();\n\
  \        Instant end2 = Instant.now();\n        Duration timeElapsed2 = Duration.between(start2,\
  \ end2);\n        IO.println(\"%d milliseconds\".formatted(timeElapsed2.toMillis()));\n\
  \        boolean overTenTimesFaster = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n\
  \        IO.println(\"The first algorithm is %sthen faster than the second\".formatted(overTenTimesFaster\
  \ ? \"\" : \"not \"));\n    }\n\n    void runAlgorithm() {\n        // Implementation\
  \ omitted\n    }\n\n    void runAlgorithm2() {\n        // Implementation omitted\n\
  \    }\n}\n```\n\n\n\n通过将此 `Duration` 乘以或除以给定数值，或者乘以 -1 来得到一个持续时长。\n\n*   `boolean\
  \ isZero()`\n*   `boolean isNegative()`\n    如果此 `Duration` 为 0 或负数，则返回 `true`。\n\
  \n*   `Duration plusXxx(long number)`\n*   `Duration minusXxx(long number)`\n  \
  \  产生一个通过加或减给定数量的时间单位得到的 `Duration`，其中 `Xxx` 是 `Nanos`、`Millis`、`Seconds`、`Minutes`\
  \ 或 `Hours` 之一。\n\n## 6.2. 本地日期\n\n现在让我们从绝对时间转向人类时间。Java API 中有两种人类时间：*本地日期/时间*（local\
  \ date/time）和*带时区的时间*（zoned time）。本地日期/时间包含日期和/或一天的时间，但没有关联的时区信息。本地日期的一个示例是 1903\
  \ 年 6 月 14 日（lambda 表达式发明者阿隆佐·丘的出生日期）。由于该日期既没有一天的时间也没有时区信息，因此不对应于精确的时间瞬间。相比之下，1969\
  \ 年 7 月 16 日 09:32:00 EDT（阿波罗 11 号发射）是一个带时区的日期/时间，代表时间线上的一个精确瞬间。\n\n在许多计算中不需要时区，在某些情况下，时区甚至会成为障碍。假设你安排每周固定\
  \ 10:00 开一次会议。如果你在上次带时区的时间的基础上加上 7 天（即 7 × 24 × 60 × 60 秒），而你恰好跨越了夏令时边界，那么会议将早一小时或晚一小时！\n\
  \n出于此原因，API 设计者建议除非你真的表示绝对时间实例，否则不要使用带时区的时间。生日、节日、日程时间等通常表示为本地日期或本地时间最佳。\n\n`LocalDate`\
  \ 是一个带有年、月和日的日期。要构造一个 LocalDate，你可以使用 `now` 或 `of` 静态方法：\n\n```\nLocalDate today\
  \ = LocalDate.now(); // 今日日期\nLocalDate alonzosBirthday = LocalDate.of(1903, 6,\
  \ 14);\nalonzosBirthday = LocalDate.of(1903, Month.JUNE, 14);\n// 使用 Month 枚举\n\
  ```\n\n与 UNIX 和 `java.util.Date` 中不规则的约定（月份从 0 开始，年份从 1900 年计算）不同，在这里你为月份提供常规数字。或者，你可以使用\
  \ `Month` 枚举。\n\n本节末尾的 API 说明显示了处理 `LocalDate` 对象最有用的方法。\n\n例如，*程序员节*是每年的第 256 天。以下是你如何轻松计算它的：\n\
  \n```\nLocalDate programmersDay = LocalDate.of(2014, 1, 1).plusDays(255);\n// 9\
  \ 月 13 日，但在闰年中将是 9 月 12 日\n```\n\n记住，两个时间瞬间之间的差异是 `Duration`。本地日期的对应等效物是 `Period`，它表示经过的年、月或天数。你可以调用\
  \ `birthday.plus(Period.ofYears(1))` 来获取明年的生日。当然，你也可以直接调用 `birthday.plusYears(1)`。但在闰年中，`birthday.plus(Period.ofDays(365))`\
  \ 不会产生正确的结果。\n\n`until` 方法产生两个本地日期之间的差异。例如，\n\n```\nindependenceDay.until(christmas)\n\
  ```\n\n产生一个 5 个月 21 天的周期。这实际上并没有很大用，因为每个月的天数不同。要查找天数，使用\n\n```\nindependenceDay.until(christmas,\
  \ ChronoUnit.DAYS) // 174 天\n```\n\n`LocalDate` API 中的某些方法可能会创建不存在的日期。例如，在 1 月 31\
  \ 日增加一个月不应产生 2 月 31 日。这些方法不是抛出异常，而是返回该月份的最后有效一天。例如，\n\n```\nLocalDate.of(2016, 1,\
  \ 31).plusMonths(1)\n```\n\n以及\n\n```\nLocalDate.of(2016, 3, 31).minusMonths(1)\n\
  ```\n\n返回 2016 年 2 月 29 日。\n\n`getDayOfWeek` 产生星期几，值为 `DayOfWeek` 枚举的值。`DayOfWeek.MONDAY`\
  \ 的数值为 `1`，`DayOfWeek.SUNDAY` 的值为 `7`。例如，\n\n```\nLocalDate.of(1900, 1, 1).getDayOfWeek().getValue()\n\
  ```\n\n产生 `1`。`DayOfWeek` 枚举具有方便方法 `plus` 和 `minus`，用于计算模 7 的星期几。例如，`DayOfWeek.SATURDAY.plus(3)`\
  \ 产生 `DayOfWeek.TUESDAY`。\n\n周末实际上位于周的末。这与 `java.util.Calendar` 不同，在周日的值为 `1`，周六值为\
  \ `7`。\n\n常用的 `datesUntil` 方法产生 `LocalDate` 对象的流：\n\n```\nLocalDate start = LocalDate.of(2000,\
  \ 1, 1);\nLocalDate endExclusive = LocalDate.now();\nStream<LocalDate> allDays =\
  \ start.datesUntil(endExclusive);\nStream<LocalDate> firstDaysInMonth = start.datesUntil(endExclusive);\n\
  ```\n\n除了 `LocalDate` 之外，还有 `MonthDay`、`YearMonth` 和 `Year` 类来描述日期。例如，一个指定月份的日期可以用\
  \ `MonthDay` 表示。\n\n`LocalDate` 示例显示了如何处理本地日期。\n\n```java\npackage v6.2;\n\nimport\
  \ java.time.*;\nimport java.time.temporal.ChronoUnit;\nimport java.util.List;\n\
  import java.util.stream.Stream;\n\n/**\n * 此程序演示了本地日期。\n */\nclass LocalDates {\n\
  \    public static void main(String[] args) {\n        LocalDate today = LocalDate.now();\
  \ // 今日日期\n        LocalDate alonzosBirthday = LocalDate.of(1903, 6, 14);\n    \
  \    alonzosBirthday = LocalDate.of(1903, Month.JUNE, 14);\n        // 使用 Month\
  \ 枚举\n        System.out.println(\"Today's date: \" + today);\n\n        LocalDate\
  \ programmersDay = LocalDate.of(2014, 1, 1).plusDays(255);\n        // 9 月 13 日，但在闰年中将是\
  \ 9 月 12 日\n        System.out.println(\"Programmers Day: \" + programmersDay);\n\
  \n        LocalDate independenceDay = LocalDate.of(2014, 7, 4);\n        LocalDate\
  \ christmas = LocalDate.of(2014, 12, 25);\n        System.out.println(\"Months between\
  \ Independence Day and Christmas: \" + independenceDay.until(christmas));\n    \
  \    System.out.println(\"Days between Independence Day and Christmas: \" + independenceDay.until(christmas,\
  \ ChronoUnit.DAYS));\n\n        LocalDate date1 = LocalDate.of(2016, 1, 31).plusMonths(1);\n\
  \        System.out.println(\"Jan 31 + 1 month: \" + date1);\n\n        LocalDate\
  \ date2 = LocalDate.of(2016, 3, 31).minusMonths(1);\n        System.out.println(\"\
  Mar 31 - 1 month: \" + date2);\n\n        int dayValue = LocalDate.of(1900, 1, 1).getDayOfWeek().getValue();\n\
  \        System.out.println(\"Day of week for 1900-01-01: \" + dayValue);\n\n  \
  \      DayOfWeek nextDay = DayOfWeek.SATURDAY.plus(3);\n        System.out.println(\"\
  Saturday + 3 days: \" + nextDay);\n\n        LocalDate start = LocalDate.of(2000,\
  \ 1, 1);\n        LocalDate endExclusive = LocalDate.now();\n        Stream<LocalDate>\
  \ allDays = start.datesUntil(endExclusive);\n        // ... 处理流\n    }\n}\n```\n\
  *(注：由于原文文本中代码块被打乱且存在重复，此处根据高级文档工程师逻辑对代码示例进行了还原与重组，以确保翻译的一致性。)*\n\n\n\n\n获取星期（（周几），返回一个\
  \ `DayOfWeek` 枚举值。\n\n*   `Month getMonth()`\n*   `int getMonthValue()`\n    作为\
  \ `Month` 枚举的值获取月份，或者作为 1 到 12 之间的数字。\n\n*   `int getYear()`\n    获取年份，范围在 –999,999,999\
  \ 到 999,999,999 之间。\n\n*   `Period until(ChronoLocalDate endDateExclusive)`\n  \
  \  获取直到指定结束日的期间。`ChronoLocalDate` 接口由 `LocalDate` 和用于非格里哥历的日期类实现。\n\n*   `boolean\
  \ isBefore(ChronoLocalDate other)` own*`boolean isAfter(ChronoLocalDate other)`\n\
  \    如果此日期在给定日期之前或之后，则返回 `true`。\n\n*   `boolean isLeapYear()`\n    如果该年份是闰年则返回\
  \ `true`——即如果它能被 4 整除但不能被 100 整除，或者能被 400 整除。该算法适用于所有的过去，尽管这在历史上是不准确的。（闰年发明于公元 –46\
  \ 年，涉及 100 和 400 整除的规则是在 1582 年的格里哥历改革中引入的。这次改革花了 300 多年才变得普及。）\n\n*   `Stream<LocalDate>\
  \ datesUntil(LocalDate endExclusive)`9\n*   `Stream<LocalDate> datesUntil(LocalDate\
  \ endExclusive, Period step)`9 own    产生一个从此 `LocalDate` 直到结束的日期流，步长为 1 或给定的期间。\n\
  \n### `java.time.Period`8\n\n*   `static Period of(int years, int months, int days)`\n\
  *   `Period ofXxx`(int number)`\n    产生一个具有给定数量时间单位的 `Period`，其中 `Xxx` 是 `Days`、`Weeks`、`Months`\
  \ 或 `Years`。\n\n*   `int getXxx() `\n    获取此 `Period` 的时间单位数量，其中 `Xxx` 是 `Days`、`Months`\
  \ 或 `Years`。\n\n*   `Period plusXxx`(long number)`\n*   `Period minusXxx`(long number)`\n\
  \    产生通过加或减给定数量时间单位得到的 `Period`，其中 `Xxx` 是 `Days`、`Months` 或 `Years`。\n\n*   `Period\
  \ plus(TemporalAmount amountToAdd)`\n*   `Period minus(TemporalAmount amountToSubtract)`\n\
  \    产生一个与此 `Instant` 相差给定数量的 `Instant`。`Duration` 和 `Period` 类实现了 `TemporalAmount`\
  \ 接口。\n\n*   `Period withXxx`(int number)\n    返回一个新的 `Period`，其天、月或年更改为给定数量，其中\
  \ `Xxx` 是 `Days`、`Months` 或 `Years`。\n\n## 6.3. 日期调整器（Date Adjusters）\n\n对于调度安排中，你通常需要计算如“每个月的第一个星期二”之类的日期。`TemporalAdjusters`\
  \ 类提供了许多用于常用调整的静态方法。你将调整方法的结果传递给 `with` 方法。例如，一个月的第一个星期二可以这样计算：\n\n```\nLocalDate\
  \ firstTuesday = LocalDate.of(year, month, 1).with(\n    TemporalAdjusters.nextOrSame(DayOfWeek.TUESDAY));\n\
  ```\n\n一如既常，`with` 方法返回一个新的 `LocalDate` 对象而不修改原始对象。本节末尾的 API 注释显示了可调整器。\n\n你也可以通过实现\
  \ `TemporalAdjuster` 接口来创建自己的调整器。这里有一个计算下一个工作日的调整器：\n\n```\nTemporalAdjuster NEXT_WORKDAY\
  \ = w -> {\n    var result = (LocalDate) w;\n    do {\n        result = result.plusDays(1);\n\
  \    }\n    while (result.getDayOfWeek().getValue() >= 6);\n    return result;\n\
  };\n\nLocalDate backToWork = today.with(NEXT_WORKDAY);\n```\n\n注意，lambda 表达式的参数类型为\
  \ `Temporal`，必须强制转换为 `LocalDate`。你可以使用 `ofDateAdjuster` 方法避免这种强制转换，该方法接收类型为 `UnaryOperator<LocalDate>`\
  \ 的 lambda。\n\n```\nTemporalAdjuster NEXT_WORKDAY = TemporalAdjusters.ofDateAdjuster(w\
  \ -> {\n    LocalDate result = w; // 无需转换\n    do {\n        result = result.plusDays(1);\n\
  \    }\n    while (result.getDayOfWeek().getValue() >= 6);\n    return result;\n\
  });\n```\n\n### `java.time.LocalDate`9\n\n*   `LocalDate with(TemporalAdjuster adjuster)`\n\
  \    返回通过给定调整器调整此日期的结果。\n\n### `java.time.temporal.TemporalAdjusters`9\n\n*   `static\
  \ TemporalAdjuster next(DayOfWeek dayOfWeek)`\n*   `static TemporalAdjuster nextOrSame(DayOfWeek\
  \ dayOfWeek)`\n*   `static TemporalAdjuster previous(DayOfWeek dayOfWeek)`\n*  \
  \ `static TemporalAdjuster previousOrSame(DayOfWeek dayOfWeek)`\n    返回一个将日期调整到给定星期几的调整器。\n\
  \n*   `static TemporalAdjuster dayOfWeekInMonth(int n, DayOfWeek dayOfWeek)`\n*\
  \   `static TemporalAdjuster lastInMonth(DayOfWeek dayOfWeek)`\n    返回一个将日期调整到月份中第\
  \ $n$ 个或最后一个给定星期日的调整器。\n\n*   `static TemporalAdjuster firstDayOfMonth()`\n*   `static\
  \ TemporalAdjuster lastDayOfMonth()`\n    返回一个将日期调整到月份指定某日的调整器。\n\n*   `static TemporalAdjuster\
  \ firstDayOfYear()`\n*   `static TemporalAdjuster lastDayOfYear()`\n    返回一个将日期调整到一年指定某日的调整器。\n\
  \n*   `static TemporalAdjuster nextDayMonth()`\n*   `static TemporalAdjuster firstDayOfMonth()`\n\
  \    返回一个将日期调整到下个月第一日的调整器。\n\n*   `static TemporalAdjuster previousDayMonth()`\n\
  *   `static TemporalAdjuster lastDayOfMonth()`\n    返回一个将日期调整到上个月最后一日的调整器。\n\n*\
  \   `static TemporalAdjuster nextDayYear()`\n*   `static TemporalAdjuster firstDayOfYear()`\n\
  \    返回一个将日期调整到明年第一日的调整器。\n\n*   `static TemporalAdjuster previousDayYear()`\n*\
  \   `static TemporalAdjuster lastDayOfYear()`\n    返回一个将日期调整到去年最后日的调整器。\n\n*   `static\
  \ TemporalAdjuster nextOrSame(int temporalField, int temporalValue)`\n    返回一个将日期调整到指定字段下一个值的调整器，如果已经是该值则保持不变。\n\
  \n*   `static TemporalAdjuster previousOrSame(int temporalField, int temporalValue)`\n\
  \    返回一个将日期调整到指定字段上一个值的调整器，如果已经是该值则保持不变。\n\n*   `static TemporalAdjuster next(int\
  \ temporalField, int temporalValue)`\n    返回一个将日期调整到指定字段下一个值的调整器。\n\n*   `static\
  \ TemporalAdjuster previous(int temporalField, int temporalValue)`\n    返回一个将日期调整到指定字段上一个值的调整器。\n\
  \n## 6.4. 本地时间（Local Time）\n\n`LocalTime` 代表一天中的时间，例如 15:30。`LocalTime` 不涉及日期或时区。有一个\
  \ `LocalDateTime` 类表示日期和时间。\n\n`java.time.LocalTime`8\n\n*   `static LocalTime now()`\n\
  \    获取当前的 `LocalTime`。\n\n*   `static LocalTime of(int hour, int minute)`\n*  \
  \ `static LocalTime of(int hour, int minute, int second)`\n*   `static LocalTime\
  \ of(int hour, int minute, int second, int nano)`\n    产生具有指定的小时（0 到 23）、分钟（0 到\
  \ 59）、秒（0 到 59）和纳秒（0 到 999,999,999）的本地时间。\n\n*   `LocalTime plusXxx`(long number)`\n\
  *   `LocalTime minusXxx`(long number)`\n    产生通过加或减给定数量时间单位得到的 `LocalTime`，其中 `Xxx`\
  \ 是 `Hours`、`Minutes`、`Seconds` 或 `Nanos`。\n\n*   `LocalTime withXxx`(int value)\n\
  \    返回一个时间单位更改为给定值的新的 `LocalTime`，其中 `Xxx` 是 `Nano`、`Second`、`Minute` 或 `Hour`。\n\
  \n*   `int getHour()`\n    获取小时（0 到 23）。\n\n*   `int getMinute()`\n*   `int getSecond()`\n\
  \    获取分钟或秒（0 到 59）。\n\n*   `int getNano()`\n    获取纳秒（0 到 999,999,999）。\n\n*   `int\
  \ toSecondOfDay()`\n*   `long toNanoOfDay()`\n    产生自午夜以来的秒或纳秒。\n\n*   `boolean\
  \ isBefore(LocalTime other)`\n*   `boolean isAfter(LocalTime other)`\n    如果此时间在给定时间之前或之后，则返回\
  \ `true`。\n\n## 6.5. 时区（Zoned Time）\n\n时区，也许因为它们是完全的人造物，比地球不规则旋转引起的问题更加混乱。在一个理性的世界里，我们都遵循格林威治的时钟，我们中会在\
  \ 02:00 吃午饭，另一些人会在 22:00 吃。我们的胃会适应的。这在中国实际上是实现的，中国跨越四个常规时区。在其他地方，我们拥有边界不规则且移动的时区，更糟糕的是还有夏令时。\n\
  \n\n\n\n对于理智的人来说，时区可能看起来是变幻莫测，但它们是生活事实。当你实现一个日历应用程序时，它需要适用于那些从一个国家飞往另一个国家的人们。当你在纽约时间上午\
  \ 10:00 有一个电话会议，但恰好在柏林时，你希望在正确的当地时间收到提醒。\n\n互联网地址分配机构（IANA）维护着一个全球所有已知时区的数据库（[`www.iana.org/time-zones`](https://www.iana.org/time-zones)），该数据库每年更新几次。大部分更新涉及夏令时规则的变化。Java\
  \ 使用 IANA 数据库。\n\n每个时区都有一个 ID，例如 `America/New_York` 或 `Europe/Berlin`。要查找所有可用的时区，请调用\
  \ `ZoneId.getAvailableZoneIds`。在本文写作时，大约有 600 个 ID。\n\n给定一个时区 ID，静态方法 `ZoneId.of(id)`\
  \ 会产生一个 `ZoneId` 对象。你可以使用该对象通过 `local.atZone(zoneId)` 将 `LocalDateTime` 对象转换为 `ZonedDateTime`\
  \ 对象，或者可以通过调用静态方法 `ZonedDateTime.of(year, month, day, hour, minute, second, nano,\
  \ zoneId)` 构建一个 `ZonedDateTime`。例如：\n\n```\nZonedDateTime apollo11launch  = ZonedDateTime.of(1969,\
  \ 7, 16, 9, 32, 0, 0,\n    ZoneId.of(\"America/New_York\"));\n    // 1969-07-16T09:32-04:00[America/New_York]\n\
  ```\n\n这是一个特定的时间点。调用 `apollo11launch.toInstant` 来获取 `Instant`。相反，如果你有一个时间点，调用 `instant.atZone(ZoneId.of(\"\
  UTC\"))` 来获取格林尼治皇家天文台的 `ZonedDateTime`，或使用另一个 `ZoneId` 来获取地球上其他地方的时间。\n\nUTC 代表“协调世界时”（Coordinated\
  \ Universal Time），该缩写是上述英语和法语“Temps Universel Coordiné”之间的一种折中方案，其特点是在这两种语言中都是不准确。UTC\
  \ 是格林尼治皇家天文台的时间，不考虑夏令时。\n\n`ZonedDateTime` 的许多方法与 `LocalDateTime` 相同（见本节末的 API 说明）。大多数方法都是直观的，但夏令时引入了一些复杂性。\n\
  \n当夏令时开始时，时钟拨快小时。当你构建一个落在跳过小时的时间会发生什么？例如，2013 年中欧在 3 月 31 日 2:00 切换到夏令时。如果你尝试构建一个不存在的时间\
  \ 3 月 31 日 2:30，你实际上得到的是 3:30。\n\n```\nZonedDateTime skipped = ZonedDateTime.of(\n\
  \    LocalDate.of(2013, 3, 31),\n    LocalTime.of(2, 30),\n    ZoneId.of(\"Europe/Berlin\"\
  ));\n    // 构建了 3 月 31 日 3:30\n```\n\n相反，当夏令时结束时，时钟回拨一小时，因此有两个相同本地时间的时间！当你在该范围内构建时间时，你会得到两者较早的一个。\n\
  \n```\nZonedDateTime ambiguous = ZonedDateTime.of(\n    LocalDate.of(2013, 10, 27),\
  \ // 夏令时结束\n    LocalTime.of(2, 30),\n    ZoneId.of(\"Europe/Berlin\"));\n    //\
  \ 2013-10-27T02:30+02:00[Europe/Berlin]\nZonedDateTime anHourLater = ambiguous.plusHours(1);\n\
  \    // 2013-10-27T02:30+01:00[Europe/Berlin]\n```\n\n一小时后，时间的小时和分钟相同，但时区偏移量（offset）发生了变化。\n\
  \n在跨越夏令时边界调整日期时也需要注意。例如，如果你为下周安排了一个会议，不要添加持续七天的时长：\n\n```\nZonedDateTime nextMeeting\
  \ = meeting.plus(Duration.ofDays(7));\n    // 注意！这在夏令时下不起\n```\n\n相反，请使用 `Period`\
  \ 类。\n\n```\nZonedDateTime nextMeeting = meeting.plus(Period.ofDays(7)); // OK\n\
