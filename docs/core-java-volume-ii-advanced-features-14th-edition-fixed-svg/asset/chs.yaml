  \n### `javax.imageio.ImageReader` 1.4\n\n- `void setInput(Object input)`\n- `void\
  \ setInput(Object input, boolean seekForwardOnly)`\n  设置读取器的输入源。`input` 参数是 `ImageInputStream`\
