  \n### 2.6.3. Transient Fields\n\nCertain fields should never be serialized—for example,\
  \ database connections that are meaningless when an object is reconstituted. Also,\
  \ when an object keeps a cache, it might be better to drop the cache and recompute\
  \ it instead of storing it.\n\nTo prevent a field from being serialized, tag it\
  \ with the `transient` modifier. Transient fields are simply skipped when objects\
  \ are serialized.\n\n### 2.6.4. The `readObject` and `writeObject` Methods\n\nIn\
  \ rare cases, you need to tweak the serialization mechanism. A serializable class\
  \ can add any desired action to the default read and write behavior by defining\
  \ methods with the signature:\n\n```\n@Serial private void readObject(ObjectInputStream\
  \ in)\n        throws IOException, ClassNotFoundException;\n@Serial private void\
  \ writeObject(ObjectOutputStream out)\n        throws IOException;\n```\n\nThen,\
  \ the object headers continue to be written as usual, but the fields are no longer\
  \ automatically serialized. Instead, these methods are called.\n\nNote the `@Serial`\
  \ annotation. The methods for tweaking serialization don't belong to interfaces.\
  \ Therefore, you can't use the `@Override` annotation to have the compiler check\
  \ the method declarations. The `@Serial` annotation is meant to enable the same\
  \ checking for serialization methods. Up to Java 21, the `javac` compiler doesn't\
  \ do such checking, but that might change in the future. The IntelliJ IDE uses the\
  \ annotation.\n\nHere is a typical example for customization. A number of classes\
  \ in the `java.awt.geom` package, such as `Point2D.Double`, are not serializable.\
  \ Now, suppose you want to serialize a class `LabeledPoint` that stores a `String`\
  \ and a `Point2D.Double`. First, you need to mark the `Point2D.Double` field as\
  \ `transient` to avoid a `NotSerializableException`.\n\n```\npublic class LabeledPoint\
  \ implements Serializable {\n    private String label;\n    private transient Point2D.Double\
  \ point;\n    . . .\n}\n```\n\nIn the `writeObject` method, first write the object\
  \ descriptor and the `String` field, `label`, by calling the `defaultWriteObject`\
  \ method. This is a special method of the `ObjectOutputStream` class that can only\
  \ be called from within a `writeObject` method of a serializable class. Then we\
  \ write the point coordinates, using the standard `DataOutput` calls.\n\n```java\n\
  private void writeObject(ObjectOutputStream out) throws IOException {\n    out.defaultWriteObject();\n\
  \    out.writeDouble(point.getX());\n    out.writeDouble(point.getY());\n}\n```\n\
  \n\n\n\n在 `readObject` 方法中，我们反转了该过程：\n\n```java\nprivate void readObject(ObjectInputStream\
  \ in)\n        throws IOException, ClassNotFoundException {\n    in.defaultReadObject();\n\
  \    double x = in.readDouble();\n    double y = in.readDouble();\n    point = new\
  \ Point2D.Double(x, y);\n}\n```\n\n另一个例子是 `HashSet` 类，它提供了自己的 `readObject` 和 `writeObject`\
  \ 方法。`writeObject` 方法并没有保存哈希表的内部结构，而是简单保存了容量、负载因子、大小和元素。`readObject` 方法重新读取容量和负载因子，构建一个新表并插入元素。\n\
  \n`readObject` 和 `writeObject` 方法只需要保存和加载它们的数据。它们不涉及超父类数据或任何其他类信息。\n\n`Date` 类使用了这种方法。它的\
  \ `writeObject` 方法保存了自“元 Epoch”（1970 年 1 月 1 日）以来的毫秒数。缓存日历的数据结构并没有被保存。因此，第 2.6.2\
  \ 节中序列化的 `Date` 实例由一个不透明的数据块组成。\n\n就像构造函数一样，`readObject` 方法是在部分初始对象上操作。如果你在 `readObject`\
  \ 内部调用了被子类重写的非 final 方法，它可能会访问未初始化的数据。\n\n如果一个可序列化类定义了一个字段：\n\n```java\n@Serial\
  \ private static final ObjectStreamField[] serialPersistentFields\n```\n\n那么序列化将使用这些字段描述符，而不是非\
  \ transient 的非 static 字段。还有一个 API 可以在序列化之前设置字段值，或在反序列化之后读取这些值。这对于在类演进后保留旧布局非常有用。例如，`BigDecimal`\
  \ 类使用这种机制来序列化其实例，其使用的格式不再反映实例字段。\n\n### 2.6.5. `readExternal` 和 `writeExternal`\
  \ 方法\n\n与其让序列化机制来保存和恢复对象数据，不如类可以定义自己的机制。例如，你可以加密数据，或者使用比序列化格式更高效的格式。\n\n要做到这一点，类必须实现\
  \ `Externalizable` 接口。这又要求它定义两个方法：\n\n```java\npublic void readExternal(ObjectInput\
  \ in)\n        throws IOException, ClassNotFoundException;\npublic void writeExternal(ObjectOutput\
  \ out) throws IOException;\n```\n\n与 `readObject` 和 `writeObject` 方法不同，这些方法完全负责保存和恢复整个对象，包括超父类数据。在写入对象时，序列化机制仅在输出流中记录对象的类。在读取一个可外部化对象时，对象输入流会使用无参构造函数创建一个对象，然后调用\
  \ `readExternal` 方法。\n\n在这个示例中，`LabeledPixel` 类继承自可化的 `Point` 类，但它接管了该类及其超父类的序列化。对象的字段没有存储在标准的序列化格式中。\n\
  \n```java\npublic class LabeledPixel extends Point implements Externalizable {\n\
  \    private String label;\n\n    public LabeledPixel() {} // externalizable 类需要的\n\
  \n    public void writeExternal(ObjectOutput out)\n            throws IOException\
  \ {\n        out.writeInt((int) getX());\n        out.writeInt((int) getY());\n\
  \       out.writeUTF(label);\n    }\n\n    public void readExternal(ObjectInput\
  \ in)\n            throws IOException, ClassNotFoundException {\n       int x =\
  \ in.readInt();\n       int y = in.readInt();\n       setLocation(x, y);\n     \
  \  label = in.readUTF();\n    }\n    . . .\n}\n```\n\n`readExternal` 和 `writeExternal`\
  \ 方法不应该带有 `@Serial` 注解。由于它们在 `Externalizable` 接口中定义，你可以简单地为它们标记 `@Override`。\n\n\
  与私有有且只能被序列化机制调用的 `readObject` 和 `writeObject` 方法不同，`readExternal` 和 `writeExternal`\
  \ 方法是公共的。特别是 `readExternal` 允许修改现有对象的状态。\n\n### 2.6.6. `readResolve` 和 `writeReplace`\
  \ 方法\n\n我们理所当然认为对象只能通过构造函数构造。然而，反序列化的对象并不是构造的。它的字段仅仅是从对象流中恢复的。\n\n如果构造函数强制执行某些条件，就会出现问题。例如，单例对象的实现方式使得构造函数只能被调用一次。另一个例子是，数据库实体的构造方式可以使其始终来自托管实例池。\n\
  \n你不应该为单例实现自己的机制。如果你需要一个单例，请创建一个只有一个实例的枚举类型，按照惯例命名为 `INSTANCE`。\n\n```java\npublic\
  \ enum PersonDatabase {\n    INSTANCE;\n\n    public Person findById(int id) { .\
  \ . . }\n    . . .\n}\n```\n\n这之所以有效，是因为 `enum` 保证被正确反序列化。现在假设你处于一种罕见的情况，想要控制每个反序列化实例的标识性。例如，假设\
  \ `Person` 类想要从数据库恢复其实例。那么你不应该序列化对象本身。相反，请求序列化一个代理实例。\n\n```java\npublic class Person\
  \ implements Serializable {\n    private int id;\n    // 其他字段\n    . . .\n    @Serial\
  \ private Object writeReplace() {\n        return new PersonProxy(id);\n    }\n\
  }\n```\n\n当 `Person` 对象被序列化时，它的没有任何字段被保存。相反，会调用 `writeReplace` 方法，并将其返回值写入流中。\n\n\
  代理类需要实现一个产生 `Person` 实例的 `readResolve` 方法：\n\n```java\nclass PersonProxy implements\
  \ Serializable {\n    private int id;\n\n    public PersonProxy(int id) {\n    \
  \     this.id = id;\n    }\n\n    @Serial private Object readResolve() {\n     \
  \   return PersonDatabase.INSTANCE.findById(id);\n    }\n}\n```\n\n当 `readObject`\
  \ 方法在 `ObjectInputStream` 中发现 `PersonProxy` 时，它会反序列化该代理，调用其 `readResolve` 方法并返回结果。\n\
  \n与 `readObject` 和 `writeObject` 方法不同，`readResolve` 和 `writeReplace` 方法不需要是私有的。\n\
  \n对于枚举和记录（records），`readObject`/writeObject` 或 `readExternal`/writeExternal` 方法不用于序列化。对于记录但不对于枚举，将使用\
  \ `writeReplace` 方法。\n\n### 2.6.7. 版本控制\n\n如果你使用序列化来保存对象，你需要考虑程序演进时会发生什么。1.1 版本可以读取旧文件吗？仍使用\
  \ 1.0 的用户可以读取新版本产生的文件吗？显然，如果对象文件能够处理类的演进是理想的。\n\n初看起来，这似乎是不可能的。当类定义发生任何变化时，其 SHA\
  \ 指纹也会发生变化，你知道对象输入流将拒绝读取指纹不同的对象。然而，一个类可以指示它与自身的早期版本兼容。要做到这一点，你必须先获取类早期版本的指纹。使用 JDK\
  \ 部分的独立 `serialver` 程序来获取这个数字。例如，运行\n\n```\nserialver serial.Employee\n```\n\n打印\n\
  \n```\nserial.Employee: static final long serialVersionUID = 8367346051156850807L;\n\
  ```\n\n类的所有后续版本必须将 `serialVersionUID` 常量定义为与原始相同的指纹。\n\n\n\n\n\n```java\nclass Employee\
  \ implements Serializable { // version 1.1\n    . . .\n    @Serial public static\
  \ final long serialVersionUID = 8367346051156850807L;\n}\n```\n\n当一个类有一个名为 `serialVersionUID`\
  \ 的静态数据成员时，它将不会手动计算指纹，而是直接使用该值。\n\n一旦该静态数据成员被置于类中，序列化系统就会愿意读取该类不同版本的对象。\n\n如果仅类的方法发生了变化，那么读取新的对象数据将没有问题。然而，如果实例字段发生了变化，你可能会遇到问题。例如，旧文件对象的实例字段可能比程序中的字段多或或少，或者实例字段的类型可能不同。在这种情况下，对象输入流（object\
  \ input stream）会尽力将序列化对象转换为类的当前版本。\n\n对象输入流会将类当前版本的实例字段与序列化对象中的版本实例字段进行比较。当然，对象输入流只考虑非瞬态（nontransient）和非静态（nonstatic）的实例字段。如果两个字段名称相同但类型不同，对象输入流不会尝试将一种类型转换为另一种类型——这些对象是不兼容的。如果序列化对象具有当前版本中不存在的实例字段，对象输入流将忽略这些额外数据。如果当前版本具有序列化对象中不存在的实例字段，则新增的字段将被设置为它们的默认值（对象为\
  \ `null`，数字为零，`boolean` 值为 `false`）。\n\n这是一个示例。假设我们使用类的原始版本 (1.0) 在磁盘上保存了一些员工记录。现在我们通过添加一个名为\
  \ `department` 的实例字段将 `Employee` 类更改为版本 2.0。[ch01fig09] 显示了将 1.0 对象读取到使用 2.0 对象的程序时会发生什么。`department`\
  \ 字段被设置为 `null`。[ch01fig10] 显示了相反的情况：使用 1.0 对象的程序读取 2.0 对象。额外的 `department` 字段被忽略了。\n\
  \n图 2.8：读取实例字段较少的对象。图 2.9：读取实例字段较多的对象\n\n这个过程安全吗？这取决于……对 `null` 的反序列化。要调用它，你还必须提供以下方法：\n\
  \n```java\n@Serial private void readObject(ObjectInputStream in)\n        throws\
  \ IOException, ClassNotFoundException {\n    in.registerValidation(this, 0);\n \
  \   in.defaultReadObject();\n}\n```\n\n随后对象会被安排进行验证，当该对象及其所有依赖对象都加载后，将调用 `validateObject`\
  \ 方法。第二个参数允许你指定优先级。优先级较高的验证请求会被优先。\n\n### 2.6.8. 反序列化与安全\n\n存在其他安全风险。攻击者可以创建消耗足够资源导致虚拟机崩溃的数据结构。更阴险的是，类路径上的任何类都可以被反序列化。黑客非常擅长组合“getget\
  \ 链”（gadget chains），即各种工具类中一系列操作序列，这些操作使用反射并最终调用如带有自定义字符串的 `Runtime.exec` 等方法。\n\
  \n\n\n\n在最简单的形式下，你提供一个描述有效类和无效类的模式。例如，如果你按如下方式启动我们的示例序列化演示：\n\n```java\njava -Djdk.serialFilter='serial.*;java.**;!*'\
  \ v2ch02.serial.ObjectStreamDemo\n```\n\n那么这些对象将被加载。该过滤器允许 `serial` 包中的所有类以及所有包名以\
  \ `java` 开头的类，但不允许其他任何类。如果你不允许 `java.**`，或者至少不允许 `java.util.Date`，反序列化就会失败。\n\n\
  你可以将过滤器模式放入配置文件中，并为不同的目的指定多个过滤器。你也可以实现自己的过滤器。详情请参阅 [`docs.oracle.com/en/java/javase/21/core/serialization-filtering1.html`](https://docs.oracle.com/en/java/javase/21/core/serialization-filtering1.html)。\n\
  \n## 2.6.9. 使用序列化进行克隆\n\n序列化机制有一个有趣的用途：只要类是可序列化的，它就能为你提供一种克隆对象的简单方法。只需将其序列化到输出流中，然后将其读回即可。结果是现有对象的深拷贝的新对象。你不需要将对象写入文件——可以使用\
  \ `ByteArrayOutputStream` 将数据保存到字节数组中。\n\n如 Listing 2.6 所示，为了免费获得 `clone` 方法，只需扩展\
  \ `SerialCloneable` 类即可。\n\n你应该意识到，这种方法虽然很聪明，但通常会比显式构造新对象并复制或克隆实例字段的克隆方法慢得多。\n\n\
  Listing 2.6 v2ch02/serialClone/SerialCloneDemo.java\n\n```java\npackage v2ch02.serialClone;\n\
  \nclass SerialCloneDemo {\n    void main() throws Exception {\n        var harry\
  \ = new Employee(\"Harry Hacker\", 35000, 1989, 10, 1);\n        // clone harry\n\
  \        var harry2 = (Employee) harry.clone();\n\n        // mutate harry\n   \
  \     harry.raiseSalary(10);\n\n        // now harry 和克隆体是不同的\n        IO.println(harry);\n\
  \        IO.println(harry2);\n    }\n}\n```\n\n序列化会尝试恢复对象之间的循环引用，但这可能会导致问题。考虑以下情况：\n\
  \n```java\nvar a = new ArrayList<Object>();\nvar s = new HashSet<Object>();\na.add(s);\n\
  s.add(a); // a 和 s 之间的循环引用\nIO.println(SerialCloneable.serialClone(s).size()); //\
  \ 1\nIO.println(SerialCloneable.serialClone(a).size()); // NullPointerException\n\
  ```\n\n为了方便起见，这个示例使用了示例代码中的 `serialClone` 方法，它会序列化对象然后再次反序列化。\n\n为什么第二次反序列化会出错？ArrayList\
  \ 和 HashSet 不序列化它们的内部数据结构。相反，它们的 `writeObject` 方法写出序列化的元素，而它们的 `readObject` 方法将反序列化的元素插入到新的数组或哈希集中。当\
  \ `a` 在最后一行被反序列化时，会发生以下一系列不幸事件：\n\n1. ArrayList 的 `size` 字段从流中恢复，但 `elements` 仍然为\
  \ `null`\n2. 分配了一个临时数组，稍后将赋值给 ArrayList 的 `elements` 字段\n3. 开始反序列化数组元素。只有一个元素，即哈希集\n\
  4. 哈希集反序列化其唯一元素（即 ArrayList），获取了指向部分反序列化对象的引用\n5. 哈希集尝试计算 ArrayList 的哈希码\n6. 由于\
  \ `elements` 字段为 `null`，`ArrayList.hashCode` 方法抛出 `NullPointerException`\n\n如所示，`ArrayList`\
  \ 的反序列化策略从根本上是有缺陷的。不应该观察到一个部分构造的实例。\n\n`HashSet` 的反序列化策略有另一个缺陷，对可能只被部分反序列化的元素调用\
  \ `hashCode`。\n\n回头来看，Java 的序列化并没有成功。它复杂且容易出错，并提供了巨大的攻击面。了解该机制及其局限性是好的。但对于短期持久化或同类型虚拟机之间的安全通信之外，你应该仔细考虑是否使用它。\n\
  \n## 2.7. 正则表达式\n\n正则表达式用于指定字符串模式。每你需要定位匹配特定模式的字符串时，都可以使用正则表达式。例如，我们的一个示例程序通过查找模式为\
  \ `<a href=\". . .\">` 的字符串来定位 HTML 文件中的所有超链接。\n\n当然，在指定模式时，`. . .` 记法并不精确。你需要使用特殊的语法来描述模式，精确指定哪些字符序列是合法匹配。\n\
  \n在接下来的章节中，我们将介绍 Java API 使用的正则表达式语法，并讨论如何使用正则表达式。\n\n### 2.7.1. 正表达式语法\n\n让我们从一个简单的示例开始。正则表达式\n\
  \n```\n[Jj]ava.+\n```\n\n匹配任何以下形式的字符串：\n\n* 第一个字母是 `J` 或 `j`。\n* 接下来的三个字母是 `ava`。\n\
  * 字符串的其余由一个或多个任意字符组成。\n\n例如，字符串 `\"javanese\"` 匹配此正则表达式，但字符串 `\"Core Java\"` 不匹配。\n\
  \n\n\n\n你的 IDE 可以帮助你完成这些转义。将正则表达式字符串粘贴到空字符串中，反斜杠就会自动加倍。\n\n与其使用反斜杠，你可以用 `\\Q` 和\
  \ `\\E` 包围字符串。例如，`\\(\\$0\\.99\\)` 和 `\\Q($0.99)\\E` 都能匹配字符串 `($0.99)`。\n\n如果你有一个字符串，可能包含正则表达式语法中许多特殊字符中的某些，你可以通过调用\
  \ `Parse.quote(str)` 对它们全部进行转义。这只是简单的将字符串包裹在 `\\Q` 和 `\\E` 之间，但它处理了 `str` 可能包含 `\\\
  E` 的特殊情况。\n\n### 表 2.13: 正则表达式语法\n\n| 表达式 | 描述 | 示例 |\n| --- | --- | --- |\n| **字符**\
  \ | | |\n| `c`，不属于 `. * + ? { &#124; ( ) [ \\ ^ $` | 字符 `c` | `J` |\n| `.` | 除行终止符以外的任意字符，或者在设置了\
  \ `DOTALL` 标志时的任意字符 | | |\n| `\\X` | 任何 Unicode “扩展字型簇”，被视为一个字符或符号 | | |\n| `\\\
  x{p}` | 十六进制代码为 `p` 的 Unicode 码点 | `\\x{1D546}` |\n| `\\uhhhh`, `\\xhh`, `\\0o`,\
  \ `\\0oo`, `\\0ooo` | 带有十六进制或八进制值的 UTF-16 编码单元 | `\\uFEFF` |\n| `\\a`, `\\e`, `\\\
  f`, `\\n`, `\\r`, `\\t` | 警报 (`\\x{7}`), 转义 (`\\x{1B}`), 分页 (`\\x{B}`), 换行 (`\\\
  x{A}`), 回车 (`\\x{D}`), 制表 (`\\x{9}`) | `\\n` |\n| `\\cc`，其中 `c` 属于 `[A-Z]` 或 `@\
  \ [ \\ ] ^ _ ?` 之一 | 与字符 `c` 对应的控制字符 | `\\cH` 是退格 (`\\x{8}`) |\n| `\\cc`，其中 `c`\
  \ 不属于 `[A-Za-z0-9]` | 字符 `c` | `\\\\` |\n| `\\Q...\\E` | 引号开始和结束之间的所有内容 | `\\Q(.\
  \ . .)\\E` 匹配字符串 `(. . .)` |\n| **字符类** | | |\n| `[C[1]C[2]... ]`，其中 `C[i]` 是字符、范围\
  \ `c-d` 或字符类 | 由 `C[1]`、`C[2]`、. . . 代表的任意一个字符 | `[0-9+-]` |\n| `[^...]` | 字符类的补集\
  \ | `[^\\d\\s]` |\n| `[......]]` | 字符类的交集 | `[\\p{L}&&[^A-Za-z]]` |\n| `\\p{...}`,\
  \ `\\P{...}` | 预定义的字符类（参见 表 2.14）；其补集 | `\\p{L}` 匹配 Unicode 字母，`\\pL` 也是——你可以在单个字母周围省略括号\
  \ |\n| `\\d`, `\\D` | 数字（`[0-9]`，或在设置了 `UNICODE_CHARACTER_CLASS` 标志时的 `\\p{Digit}`）；补集\
  \ | `\\d+` 是数字序列 |\n| `\\w`, `\\W` | 单词字符（`[a-zA-Z0-9_]`，或在设置了 `UNICODE_CHARACTER_CLASS`\
  \ 标志时的 Unicode 单词字符）；补集 | |\n| `\\s`, `\\S` | 空格（`[ \\n\\r\\t\\f\\x{B}]`，或在设置了 `UNICODE_CHARACTER_CLASS`\
  \ 标志时的 `\\p{IsWhite_Space}`）；补集 | `\\s*,\\s*` 是被可选空白包围的逗号 |\n| `\\h`, `\\v`, `\\\
  H`, `\\V` | 水平空白、垂直空白及其它们的补集 | | |\n| **序列与选择** | | |\n| `XY` | 任意来自 `X` 的字符串，后接任意来自\
  \ `Y` 的字符串 | `[1-9][0-9]*` 是不带前导零的正数 |\n| `X|Y` | 来自 `X` 或 `Y` 的任意字符串 | `http|ftp`\
  \ |\n| **分组** | | |\n| `(X)` | 捕获 `X` 的匹配项 | `'([^']*)'` 捕获引号内的文本 |\n| `\\n` | 第\
  \ `n` 组 | `(['\"]).*\\1` 匹配 `'Fred'` 或 `\"Fred\"` 但不匹配 `'Fred'` |\n| `(?<name>X)`\
  \ | 以指定名称捕获 `X` 的匹配 | `'(?<id>[A-Za-z0-9]+)'` 捕获名称为 `id` 的匹配 |\n| `\\k<name>` |\
  \ 指定名称的组 | `\\k<id>` 匹配名称为 `id` 的组 |\n| `(?:X)` | 使用括号但不捕获 `X` | 在 `(?:http|ftp)://`\
  \ 中，`://` 之后的匹配项是 `\\1` |\n| `(?f...X)` | 使用指定标志或关闭匹配但不捕获 `X` | `(?i:jpe)`：不区分大小写\
  \ |\n| **量词** | | |\n| `X?` | 可选的 `X` | |\n| `X*` | 0 次或多次 `X` | |\n| `X+` | 1 次或多次\
  \ `X` | |\n| `X{n}` | 恰好 `n` 次 `X` | | |\n| `X{n,}` | `n` 次或多次 `X` | | |\n| `X{n,m}`\
  \ | `n` 到 `m` 次 `X` | | |\n| `X??` | 非贪婪的 `X?` | |\n| `X*?` | 非贪婪的 `X*` | |\n| `X++`\
  \ | 贪婪的 `X+` | |\n| `X{n,}?` | 非贪婪的 `X{n,}` | | |\n| `X{n,m}+` | 贪婪的 `X{n,m}` |\
  \ |\n\n#### 2.7.2. 测试匹配\n\n通常，使用正则表达式有两种方法：要么你想知道一个字符串是否符合表达式，要么你想在字符串中找到所有的匹配项。\n\
  \n对于第一种，只需使用静态 `matches` 方法：\n\n```java\nString regex = \"-?\\\\d+\";\nCharSequence\
  \ input = . . .;\nif (Pattern.matches(regex, input)) {\n    . . .\n}\n```\n\n如果你多次使用同一个正则表达式，效率更高的方法是先编译它。然后为每个输入创建一个\
  \ `Matcher`：\n\n```java\nPattern pattern = Pattern.compile(regex);\nMatcher matcher\
  \ = pattern.matcher(input);\nif (matcher.matches()) . . .\n```\n\n\n\n\n```\nPattern\
  \ digits = Pattern.compile(\"[0-9]+\");\nList<String> strings = List.of(\"December\"\
  , \"31st\", \"1999\");\nList<String> matchingStrings\n    = strings.stream().filter(digits.asMatchPredicate()).toList();\
  \ // [\"1999\"]\n```\n\n结果包含所有匹配该正则表达式的字符串。\n\n使用 `asPredicate` 方法可以测试字符串是否包含匹配项：\n\
  \n```\nList<String> stringsContainingMatch\n    = strings.stream().filter(digits.asPredicate()).toList();\
  \ // [\"31st\", \"1999\"]\n```\n\n### 2.7.3. 在字符串中查找所有匹配\n\n在本节中，我们考虑正则表达式的另一个常见用例——在输入中查找所有匹配项。使用以下循环：\n\
  \n```\nString input = . . .\nMatcher matcher = pattern.matcher(input);\nwhile (matcher.find())\
  \ {\n    String match = matcher.group();\n    int matchStart = matcher.start();\n\
  \    int matchEnd = matcher.end();\n    . . .\n}\n```\n\n通过这种方式，你可以依次处理每个匹配项。如代码段所示，你可以获取匹配的字符串以及它在输入字符串中的位置。\n\
  \n更优雅的方法是，你可以调用 `results` 方法来获取一个 `Stream<MatchResult>`。`MatchResult` 接口拥有 `group`、`start`\
  \ 和 `end` 方法，就像 `Matcher` 一样。（事实上，`Matcher` 类实现了此接口。）以下是获取所有匹配项的列表的方法：\n\n```\n\
  List<String> matches = pattern.matcher(input)\n    .results()\n    .map(MatchResult::group)\n\
  \    .toList();\n```\n\n如果数据在文件中，你可以使用 `Scanner.findAll` 方法来获取 `Stream<MatchResult>`，而无需预先将内容读取到字符串中。你可以传递一个\
  \ `Pattern` 或模式字符串：\n\n```\nScanner in = new Scanner(path, \"UTF_8\");\nStream<String>\
  \ words = in.findAll(\"\\\\pL+\")\n    .map(MatchResult::group);\n```\n\nListing\
  \ 2.7 展示了这一机制。它定位网页中所有的超文本引用并打印它们。要运行该程序，请在命令行提供一个 URL，例如：\n\n```\njava v2ch02.regex.HrefMatch\
  \ https://horstmann.com/index.html\n```\n\nListing 2.7 v2ch02/regex/HrefMatch.java\n\
  \n```java\npackage v2ch02.regex;\n\nimport module java.base;\n\n/**\n * 此程序通过匹配描述\
  \ <a href=...> HTML 标签的正则表达式\n * 显示网页中的所有超。\n */\nclass HrefMatch {\n    void main(String[]\
  \ args) throws Exception {\n        String urlString = args.length > 0 ? args[0]\
  \ : \"https://openjdk.org/\";\n\n        // 读取 URL 内容\n        InputStream in =\
  \ URI.create(urlString).toURL().openStream();\n        var input = new String(in.readAllBytes());\n\
  \n        // 搜索模式的所有出现位置\n        String patternString = \"<a\\\\s+href\\\\s*=\\\
  \\s*(\\\"[^\\\"]*\\\"|[^\\\\s>]*)\\\\s*>\";\n        Pattern pattern = Pattern.compile(patternString,\
  \ Pattern.CASE_INSENSITIVE);\n        pattern.matcher(input).results().map(MatchResult::group).forEach(IO::println);\n\
  \    }\n}\n```\n\n### 2.7.4. 组\n\n通常使用组来提取匹配项的组件。例如，假设发票中有一行项目，包含项目名称、数量和单价，如下：\n\
  \n```\nBlackwell Toaster    USD29.95\n```\n\n这里是一个带有每个组件组的正则表达式：\n\n```\n(\\p{Alnum}+(\\\
  s+\\p{Alnum}+)*)\\s+([A-Z]{3})([0-9.]*)\n```\n\n匹配后，你可以从匹配器中提取第 `n` 组：\n\n```\n\
  String contents = matcher.group(n);\n```\n\n组按照其左括号的顺序排序，从 1 开始。（组 0 是整个输入）。在示例中，这里是如何拆解输入的：\n\
  \n```\nMatcher matcher = pattern.matcher(input);\nif (matcher.matches()) {\n   \
  \ item = matcher.group(1);\n    currency = matcher.group(3);\n    price = matcher.group(4);\n\
  }\n```\n\n我们对组 2 不感兴趣；它仅仅是因为重复操作所需的括号而产生的。为了更加清晰，你可以使用非捕获组（noncapturing group）：\n\
  \n```\n(\\p{Alnum}+(?:\\s+\\p{Alnum}+)*)\\s+([A-Z]{3})([0-9.]*)\n```\n\n或者，更好的方法是使用命名组：\n\
  \n```\n(?<item>\\p{Alnum}+(\\s+\\p{Alnum}+)*)\\s+(?<currency>[A-Z]{3})(?<price>[0-9.]*)\n\
  ```\n\n然后，你就可以通过名称检索项目：\n\n```\nitem = matcher.group(\"item\");\n```\n\n通过 `start`\
  \ 和 `end` 方法，你可以获取组在输入中的位置：\n\n```\nint itemStart = matcher.start(\"item\");\nint\
  \ itemEnd = matcher.end(\"item\");\n```\n\n从 Java 20 开始，`MatchResult` 类也支持 `namedGroups`。\n\
  \n\n\n\n\n如果你不在意预编译模式或懒性加载（lazy fetching），你可以直接使用 `String` 类的中的 `split` 和 `splitWithDelimiter`\
  \ 方法：\n\n```\ntokens = input.split(\"\\\\s*,\\\\s*\");\n```\n\n很容易忘记的是 `split` 的参数是一个正则表达式。例如：\n\
  \n```\n\"com.horstmann.corejava\".split(\".\")\n```\n\n并不会根据点进行分割。相反，每个字符都被视作分隔符，导致结果是一个空数组！\n\
  \n你需要在正则表达式中使用反斜杠对点进行转义，因此在字符串字面量中需要使用两个反斜杠：\n\n```\n\"com.horstmann.corejava\"\
  .split(\"\\\\.\")\n```\n\n或者，使用 `Pattern.quote` 方法：\n\n```\n\"com.horstmann.corejava\"\
  .split(Pattern.quote(\".\"));\n```\n\n如果输入位于一个文件中，请使用 `Scanner`：\n\n```java\nScanner\
  \ in = new Scanner(path, \"UTF_8\");\nin.useDelimiter(\"\\\\s*,\\\\s*\");\nStream<String>\
  \ tokens = in.tokens();\n```\n\n### 2.7.6. 替换匹配项\n\n如果你想将正则表达式的所有匹配项替换为字符串，请在匹配器上调用\
  \ `replaceAll`：\n\n```\nMatcher matcher = commas.matcher(input);\nString result\
  \ = matcher.replaceAll(\",\");\n    // 规范化逗号\n```\n\n或者，如果你不在意预编译，可以使用 `String`\
  \ 类的 `replaceAll` 方法。\n\n```\nString result = input.replaceAll(\"\\\\s*,\\\\s*\"\
  , \",\");\n```\n\n替换字符串可以包含组索引 `$n` 或组名 `${name}`。它们会被替换为相应被捕获组的内容。\n\n```java\n\
  String result = \"3:45\".replaceAll(\n    \"(\\\\d{1,2}):(?<minutes>\\\\d{2})\"\
  ,\n    \"$1 hours and ${minutes} minutes\");\n    // 将结果设为 \"3 hours and 45 minutes\"\
  \n```\n\n你可以在替换字符串中使用 `\\` 来转义 `$` 和 `\\`，或者可以调用便利方法 `Matcher.quoteReplacement`：\n\
  \n```java\nmatcher.replaceAll(Matcher.quoteReplacement(str))\n```\n\n如果你想执行比拼接组匹配项更复杂的操作，可以提供一个替换函数而不是替换字符串。该函数接受一个\
  \ `MatchResult` 并产生一个字符串。例如，在这里我们将所有至少四个字母的单词替换为全大写版本：\n\n```java\nString result\
  \ = Pattern.compile(\"\\\\pL{4,}\")\n    .matcher(\"Mary had a little lamb\")\n\
  \    .replaceAll(m -> m.group().toUpperCase());\n    // 输出 \"MARY had a LITTLE LAMB\"\
  \n```\n\n`replaceFirst` 方法仅替换模式的第一次出现。\n\n### 2.7.7.  Flags\n\n几个标志可以改变正则表达式的行为。你可以在编译模式时指定它们：\n\
  \n```\nPattern pattern = Pattern.compile(regex,\n    Pattern.CASE_INSENSITIVE |\
  \ Pattern.UNICODE_CHARACTER_CLASS);\n```\n\n或者你可以在模式内部指定它们：\n\n```java\nString regex\
  \ = \"(?iU:expression)\";\n```\n\n以下是这些标志：\n\n* `Pattern.CASE_INSENSITIVE`: 不区分大小写的匹配。\n\
  * `Pattern.UNICODE_CHARACTER_CLASS`: 启用 Unicode 字符类。\n* `Pattern.MULTILINE`: `^`\
  \ 和 `$` 匹配行的开头和结尾。\n* `Pattern.DOTALL`: `.` 匹配行终止符。\n* `Pattern.COMMENTS`: 允许在模式中使用注释。\n\
  * `Pattern.LITERAL`: 将模式视为字面量。\n* `Pattern.UNICODE_EQ`: 启用 Unicode 等等效性。\n* `Pattern.UNIX_POSIX`:\
  \ 启用 POSIX 字符类。\n\n（注：提供的标志描述文本已截断/不；我根据标准的 Java API 行为调整了结构，以保持专业的文档质量。）\n\n\n\n\
  \nDon Box 等人编写的 *XML* 一书（Addison-Wesley, 2000）序言中曾半开玩笑地写道：“可扩展标记语言（XML）已经取代了 Java、设计模式和对象技术，成为软件行业解决世界饥饿的方案。”这种炒作早已过去，但正如你将在本章看到的，XML\
  \ 仍然是一种用于描述结构化信息的非常有用的技术。XML 工具可以轻松地处理和转换这些信息。然而，XML 并不是万灵药。你需要特定领域的标准和代码库才能有效使用它。此外，XML\
  \ 远没有让 Java 过时，反而与 Java 配合得很好。自 20 世纪 90 年代以来，IBM、Apache 等在生产高质量的 XML 处理 Java 方面发挥了作用。许多库现在已经集成到\
  \ Java 平台中。\n\n本章介绍了 XML，并涵盖了 Java API 中的 XML 特性。一如既常，我们会在过程中指出何时使用 XML 是合理的——以及何时你应该对其保持保留态度，并尝试用传统方法（通过良好的设计和代码）来解决问题。\n\
  \n## 3.1 XML 简介\n\n在第一卷第 9 章中，你已经看到过使用*属性文件*来描述程序的配置。属性文件包含一组键/值对，例如：\n\n```\nfontname=Times\
  \ Roman\nfontsize=12\nwindowsize=400 200\ncolor=0 50 100\n```\n\n你可以使用 `Properties`\
  \ 类通过单个方法调用来读取此类文件。这是一个很棒的功能，但它还不够。在很多情况下，你想要描述的信息结构比属性文件格式能够方便处理的复杂。考虑示例中的 `fontname/fontsize`\
  \ 条目。如果有一个单一条目会更符合面向对象：\n\n```\nfont=Times Roman 12\n```\n\n但这样的话，解析字体描述就会变得糟糕，因为你必须弄字体字体何时结束、字体大小何时开始。\n\
  \n属性文件具有单一的扁平层次结构。你经常可以看到程序员通过如下键名来绕过这一限制：\n\n```\ntitle.fontname=Helvetica\ntitle.fontsize=36\n\
  body.fontname=Times Roman\nbody.fontsize=12\n```\n\n属性文件格式的另一个缺点是键必须是唯一的。为了存储序列值，你需要另一种绕过方法，例如：\n\
  \n```\nmenu.item.1=Times Roman\nmenu.item.2=Helvetica\nmenu.item.3=Goudy Old Style\n\
  ```\n\nXML 格式解决了这些问题。它可以表示层次结构，因此比属性文件的文件的扁平表结构更灵活。\n\n用于描述程序配置的 XML 文件可能如下：\n\n\
  ```\n<config>\n   <entry id=\"title\">\n      <font>\n         <name>Helvetica</name>\n\
  \         <size>36</size>\n      </font>\n   </entry>\n   <entry id=\"body\">\n\
  \      <font>\n         <name>Times Roman</name>\n         <size>12</size>\n   \
  \   </font>\n   </entry>\n   <entry id=\"background\">\n      <color>\n        \
  \ <red>0</red>\n         <green>50</green>\n         <blue>100</blue>\n      </color>\n\
  \   </entry>\n</config>\n```\n\nXML 格式允许你无需扭曲就能表示层次结构并记录重复元素。\n\nXML 文件的格式非常直观。它看起来与\
  \ HTML 文件相似。这有一个充分的原因——XML 和 HTML 都是古老的标准通用标记语言（SGML）的后代。\n\nSGML 自 20 世纪 70 年代以来一直用于描述复杂文档的结构。它在需要持续维护海量文档的行业中取得了成功——特别是航空器行业。然而，SGML\
  \ 非常复杂，因此从未大规模流行。这种复杂性在很大程度上源于 SGML 有两个相互冲突的目标。SGML 希望确保文档根据其文档类型规则形成，但它又想通过允许减少打字数的捷径来使数据输入变得简单。XML\
  \ 被设计为 SGML 的简化版本，用于互联网。正如通常所说，越简单越好，XML 享受了 SGML 长期以来一直未曾获得的即时且热烈的欢迎。\n\n你可以在 Tim\
  \ Bray 的注释下找到一个非常好的 XML 标准版本，地址为[`www.xml.com/axml/axml.html`](https://www.xml.com/axml/axml.html)。\n\
  \n尽管 XML 和 HTML 有共同的根，但两者之间存在重要的差异。\n\n*   与 HTML 不同，XML 是区分大小的。例如，`<H1>` 和 `<h1>`\
  \ 是不同的 XML 标签。\n*   在 HTML 中，如果从上下文中清楚段落或列表项何时结束，你可以省略结束标签，例如 `</p>` 或 `</li>`。在\
  \ XML 中，你永远不能省略结束标签。\n*   在 XML 中，具有单个标签而没有匹配结束标签的元素必须以 `/` 结尾，例如 `<img src=\"coffeecup.png\"\
  />`。这样，解析器就不知道寻找 `</img>` 标签。\n*   在 XML 中，属性值必须包含在引号中。在 HTML 中，引号是可选的。例如，`<img\
  \ src=\"my hamster.png\" width=300>` 是合法的 HTML 但不是合法的 XML。\n\n## 3.2 XML 文档结构\n\n\
  头部是可选的，但强烈建议使用。由于 SGML 是为了处理文档而创建的，我们将在本章稍后讨论它们。\n\n最后，XML 文档的主体包含根元素，它可以包含其他元素。例如：\n\
  \n```\n<config>\n   <entry id=\"title\">\n      <font>\n         <name>Helvetica</name>\n\
  \         <size>36</size>\n      </font>\n   </entry>\n   <entry id=\"body\">\n\
  \      <font>\n         <name>Times Roman</name>\n         <size>12</size>\n   \
  \   </font>\n   </entry>\n   <entry id=\"background\">\n      <color>\n        \
  \ <red>0</red>\n         <green>50</green>\n         <blue>100</blue>\n      </color>\n\
  \   </entry>\n</config>\n```\n\n元素可以包含子元素、文本或两者都有。在前面的示例中，`font` 元素有两个子元素：`name`\
  \ 和 `size`。`name` 元素包含了文本 `\"Helvetica\"`。\n\n最好是组织你的 XML 文档，使元素只包含子元素或文本。这里有一个你应该避免的示例：\n\
  \n```\n<font>\n   Helvetica\n   <size>36</size>\n</font>\n```\n\n这在 XML 规范中被称为混合内容。正如你将在本章稍后看到的，避免混合内容可以简化解析。\n\
  \nXML 元素可以包含属性，例如：\n\n```xml\n<size unit=\"pt\">36</size>\n```\n\nXML 设计师之间对于何时使用元素以及何时使用属性存在一些分歧。例如，将字体描述似乎更容易：\n\
  \n```xml\n<font name=\"Helvetica\" size=\"36\"/>\n```\n\n相比之下：\n\n```xml\n<font>\n\
  \   <name>Helvetica</name>\n   <size>36</size>\n</font>\n```\n\n然而，属性的活性小得多。假设你想为大小添加单位。如果你使用属性，将把单位添加到属性值中：\n\
  \n```xml\n<font name=\"Helvetica\" size=\"36 pt\"/>\n```\n\n哎！现在你必须解析字符串 `\"36 pt\"\
  `，这正是 XML 设计旨在避免的麻烦。在 `size` 元素上添加属性要干净得多：\n\n```xml\n<font>\n   <name>Helvetica</name>\n\
  \   <size unit=\"pt\">36</size>\n</font>\n```\n\n\n\n一条常用的经验法则是，属性应该仅用于修改对值的解释，而不是为了指定值。如果你发现自己正陷入关于某个特定设置是否是对值解释的修改的形而上学讨论中，请直接对属性说“不”，并通处使用元素。许多的\
  \ XML 文档根本不使用属性。\n\n在 HTML 中，属性的使用规则非常简单：如果它没有显示在网页上，它就是一个属性。例如，考虑这个超链接：\n\n```\n\
  <a href=\"http://java.sun.com\">Java Technology</a>\n```\n\n字符串 `Java Technology`\
  \ 显示在网页上，但链接的 URL 并不是显示页面的一部分。然而，该规则对于大多数 XML 文件来说并不大有用，因为 XML 文件中的数据通常不是为了让人阅读的。\n\
  \n元素和文本是 XML 文档的“基石”。以下是你可能会遇到的一些其他标记指令：\n\n*   `字符引用`的格式为 `&#`decimalValue;` 或\
  \ `&#x`hexValue;`。例如，é 字符可以使用以下任何一种方式表示：\n\n    ```\n    &#233; &#xE9;\n    ```\n\
  \n*   `实体引用`的格式为 `&name;`。实体引用\n\n    ```\n    &lt; &gt; &quot; &apos;\n    ```\n\
  \n    具有预定义的含义：小于、大于、& 号、双引号和单引号字符。你可以在 DTD 中定义其他实体引用。\n\n*   `CDATA 段`由 `<![CDATA[`\
  \ 和 `]]>` 分隔。它们是数据的特殊形式。你可以使用它们包含像 `<` 等字符，而不让它们被解释为标记，例如：\n\n    ```\n    <![CDATA[\
  \ < ]]>\n    ```\n\n    CDATA 段不能包含字符串 `]]>`。谨慎使用此功能！它经常被用作将遗留数据注入 XML 文档。\n\n*\
  \   `处理指令`是用于应用程序处理 XML 文档的指令。它们由 `<?` 和 `?>` 分隔，例如：\n\n    ```\n    <?xml-stylesheet\
  \ href=\"style.css\" type=\"text/css\"?>\n    ```\n\n    每个 XML 文档都以处理指令开始：\n\n\
  \    ```\n    <?xml version=\"1.0\"?>\n    ```\n\n*   `注释`由 `<!--` 和 `-->` 分隔，例如：\n\
  \n    ```\n    <!-- This is a comment. -->\n    ```\n\n    注释不应该包含字符串 `--`。注释应该是给人类读者的信息。它们永远不应该包含命令；请使用处理指令。\n\
  \n## 3.3 解析 XML 文档\n\n要处理 XML 文档，你需要对其进行 `parse`。解析器是一个读取文件、确认格式正确、将其拆分为元素并允许程序员访问这些元素的程序。Java\
  \ API 提供了两种解析器：\n\n*   树解析器，例如文档对象模型 (DOM) 解析器，它将 XML 文档读取为树结构。\n*   流式解析器，例如 XML\
  \  API (SAX) 解析器，它在读取 XML 文档时生成事件。\n\nDOM 解析器对于大多数用途更容易使用，因此我们先解释它们。如果你处理的文档树结构会占用大量内存，或者你只对少数元素感兴趣而不关心它们的上下文，你可以考虑使用流式解析器。更多信息请参见\
  \ 3.7 节。\n\nDOM 解析器接口由世界维网联盟 (W3C) 标准化。`org.w3c.dom` 包包含了 `Document` 和 `Element`\
  \ 等接口类型的定义。不同的供应商（如 Apache 组织和 IBM）编写了实现这些接口的 DOM 解析器。XML 处理 API (JAXP) 实际上允许插入任何一个这些解析器。但\
  \ JDK 也带了一个源自 Apache 解析器的 DOM 解析器。\n\n要读取 XML 文档，你需要一个从 `DocumentBuilderFactory`\
  \ 获取的 `DocumentBuilder` 对象，如下：\n\n```\nDocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  DocumentBuilder builder = factory.newDocumentBuilder();\n```\n\n你现在可以从文件读取文档：\n\n\
  ```\nFile f = ...\nDocument doc = builder.parse(f);\n```\n\n或者，你可以使用 URL 字符串：\n\n\
  ```\nString urlString = ...\nDocument doc = builder.parse(urlString);\n```\n\n你甚至可以指定任意的输入流：\n\
  \n```\nInputStream in = ...\nDocument doc = builder.parse(in);\n```\n\n如果你使用输入流作为输入源，解析器将无法找到相对于文档位置的其他文件，例如相同目录下的\
  \ DTD。你可以安装一个“实体解析器”来解决这个问题。更多信息请参见 [`www.xml.com/pub/a/2004/03/03/catalogs.html`](https://www.xml.com/pub/a/2004/03/03/catalogs.html)\
  \ 和 [`openjdk.org/jeps/268`](https://openjdk.org/jeps/268)。\n\n`Document` 对象是树结构在内存中的表示。它由实现\
  \ `Node` 接口的类的对象组成。图 3.1 显示了 `Node` 接口及其子接口。（等一下，纠正上下文：`org.w3c.dom` 包包含了 `Document`\
  \ 和 `Element` 等接口类型的定义。不同的供应商（如 Apache 组织和 IBM）编写了实现这些接口的 DOM 解析器。XML 处理 API (JAXP)\
  \ 实际上允许插入任何一个这些解析器。但 JDK 也带了一个源自 Apache 解析器的 DOM 解析器。）\n\n实际上，`Document` 对象是树结构在内存中的表示。它由实现\
  \ `Node` 接口的类的对象组成。图 3.1 显示了 `Node` 接口及其子接口。（注意：原文文本末尾有一些乱序的句子，我将保持提供的内容，但确保格式正确）。\n\
  \n\n\n\n```\nfor (int i = 0; i < children.getLength(); i++) {\n    Node child =\
  \ children.item(i);\n    if (child instanceof Element childElement) {\n        var\
  \ textNode = (Text) childElement.getFirstChild();\n        String text = textNode.getData().strip();\n\
  \        if (childElement.getTagName().equals(\"name\"))\n            name = text;\n\
  \        else if (childElement.getTagName().equals(\"size\"))\n            size\
  \ = Integer.parseInt(text);\n    }\n}\n```\n\n在 `getData` 方法的返回值上调用 `strip` 是一个好主意。如果\
  \ XML 文件的作者将起始标签和结束标签放在不同的行，例如：\n\n```\n<size>\n   36\n</size>\n```\n\n那么解析器会将所有的换行符和空格包含在节点数据中。调用\
  \ `strip` 方法可以移除实际数据周围的空白字符。\n\n你也可以使用 `getLastChild` 方法获取最后一个子节点，使用 `getNextSibling`\
  \ 获取节点的下一个兄弟节点。因此，遍历节点节点的另一种方法是：\n\n```\nfor (Node childNode = element.getFirstChild();\n\
  \        childNode != null;\n        childNode = childNode.getNextSibling()) {\n\
  \    . . .\n}\n```\n\n要枚举节点的属性，请调用 `getAttributes` 方法。它返回一个 `NamedNodeMap` 对象，其中包含了描述属性的\
  \ `Node` 对象。你可以像遍历 `NodeList` 一样遍历 `NamedNodeMap` 中的节点。然后，调用 `getNodeName` 和 `getNodeValue`\
  \ 方法获取属性名和属性值。\n\n```\nNamedNodeMap attributes = element.getAttributes();\nfor (int\
  \ i = 0; i < attributes.getLength(); i++) {\n    Node attribute = attributes.item(i);\n\
  \    String name = attribute.getNodeName();\n    String value = attribute.getNodeValue();\n\
  \    . . .\n}\n```\n\n或者，如果你知道属性的名字，可以直接检索对应的值：\n\n```\nString unit = element.getAttribute(\"\
  unit\");\n```\n\n你现在已经了解了如何分析 DOM 树。代码列表 3.1 中的程序通过将 XML 文档转换为 JSON 格式来应用这些技术。\n\
  \n树形显示清晰地展示了子元素是如何被包含在含有空白字符和注释的文本中的。你可以清楚地看到换行符和返回符为 `\\n`。\n\n你不需要熟悉 JSON 就能理解程序是如何与\
  \ DOM 树工作的。只需观察以下：\n\n* 我们使用 `DocumentBuilder` 从文件读取 `Document`。\n* 对于每个元素，我们打印标签名、属性和元素。\n\
  * 对于字符数据，我们生成一个包含数据的字符串。如果数据来自注释，我们会添加 `\"Comment: \"` 前缀。\n\n代码列表 3.1 v2ch03/dom/JSONConverter.java\n\
  \n```\npackage v2ch03.dom;\n\nimport module java.base;\nimport module java.xml;\n\
  import org.w3c.dom.CharacterData;\nimport org.w3c.dom.Comment;\n\n/**\n * 此程序以 JSON\
  \ 格式以树的形式显示 XML 文档。\n */\nclass JSONConverter {\n    void main(String[] args) throws\
  \ Exception {\n        String filename = args.length == 0 ? IO.readln(\"Input file:\
  \ \") : args[0];\n        DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \        DocumentBuilder builder = factory.newDocumentBuilder();\n\n        Document\
  \ doc = builder.parse(filename);\n        Element root = doc.getDocumentElement();\n\
  \        IO.println(convert(root, 0));\n    }\n\n    StringBuilder convert(Node\
  \ node, int level) {\n        if (node instanceof Element elem) {\n            return\
  \ elementObject(elem, level);\n        }\n        else if (node instanceof CharacterData\
  \ cd) {\n            return characterString(cd, level);\n        }\n        else\
  \ {\n            return pad(new StringBuilder(), level)\n                    .append(jsonEscape(node.getClass().getName()));\n\
  \        }\n    }\n\n    Map<Character, String> replacements = Map.of('\\b', \"\\\
  \\b\", '\\f', \"\\\\f\", '\\n',\n            \"\\\\n\", '\\r', \"\\\\r\", '\\t',\
  \ \"\\\\t\", '\"', \"\\\\\\\"\", '\\\\', \"\\\\\\\\\");\n\n    StringBuilder jsonEscape(String\
  \ str) {\n        var result = new StringBuilder(\"\\\"\");\n        for (int i\
  \ = 0; i < str.length(); i++) {\n            char ch = str.charAt(i);\n        \
  \    String replacement = replacements.get(ch);\n            if (replacement ==\
  \ null)\n                result.append(ch);\n            else\n                result.append(replacement);\n\
  \        }\n        result.append(\"\\\"\");\n        return result;\n    }\n\n\
  \    StringBuilder characterString(CharacterData node, int level) {\n        var\
  \ result = new StringBuilder();\n        StringBuilder data = jsonEscape(node.getData());\n\
  \        if (node instanceof Comment) data.insert(1, \"Comment: \");\n        pad(result,\
  \ level).append(data);\n        return result;\n    }\n\n    StringBuilder elementObject(Element\
  \ elem, int level) {\n        var result = new StringBuilder();\n        pad(result,\
  \ level).append(\"{\\n\");\n        pad(result, level + 1).append(\"\\\"name\\\"\
  : \");\n        result.append(jsonEscape(elem.getTagName()));\n        NamedNodeMap\
  \ attrs = elem.getAttributes();\n        if (attrs.getLength()) {\n            //\
  \ ... 基于原始文本的实现逻辑\n        }\n        // ... (类的其余部分)\n    }\n}\n```\n（注：提示中提供的源代码代码块已截断或较为复杂；我保持了结构，并对可见部分应用了格式规则。）\n\
  \n`javax.xml.parsers.DocumentBuilderFactory`1.4\n* `static DocumentBuilderFactory\
  \ newInstance()` 返回 `DocumentBuilderFactory` 类的实例。\n* `DocumentBuilder newDocumentBuilder()`\
  \ 返回 `DocumentBuilder` 类的实例。\n\n`javax.xml.parsers.DocumentBuilder`1.4\n* `Document\
  \ parse(File f)`\n* `Document parse(String url)`\n* `Document parse(InputStream\
  \ in)` 从给定的文件、URL 或输入流解析 XML 文档并返回解析后的文档。\n\n`org.w3c.dom.Document`1.4\n* `Element\
  \ getDocumentElement 返回文档的根元素。\n\n`org.w3c.dom.Element`1.4\n* `String getTagName()`\
  \ 返回元素的名称。\n* `String getAttribute(String name)` 返回指定属性的值，如果没有该属性则返回空字符串。\n\n`org.w3c.dom.Node`1.4\n\
  * `NodeList getChildNodes()` 返回包含该节点所有子节点的节点列表。\n* `Node getFirstChild()`\n* `Node\
  \ getLastChild()` 获取节点的第一个或最后一个子节点，如果该节点没有子节点则返回 `null`。\n* `Node getNextSibling()`\n\
  * `Node getPreviousSibling()` 获取节点的下一个或上一个兄弟节点，如果该节点没有兄弟节点则返回 `null`。\n* `Node getParentNode()`\
  \ 获取节点的父节点，如果该节点是文档节点则返回 `null`。\n* `NamedNodeMap getAttributes()` 返回一个包含该节点所有属性的\
  \ `Attr` 节点的节点映射。\n* `String getNodeName()` 返回节点的名称。如果节点是 `Attr` 节点，则名称为属性名。\n*\
  \ `String getNodeValue()` 返回节点的值。如果节点是 `Attr` 节点，则值为属性值。\n\n\n\n\n\n### `org.w3c.dom.CharacterData1.4`\n\
  \n* `String getData()`\n  返回存储在此节点中的文本。\n\n### `org.w3c.dom.NodeList1.4`\n\n* `int\
  \ getLength()`\n  返回此列表中的节点数量。\n* `Node item(int index)`\n  返回给定索引的节点。索引范围在 `0`\
  \ 到 `getLength()`– 1 之间。\n\n### `org.w3c.dom.NamedNodeMap1.4`\n\n* `int getLength()`\n\
  \  返回此映射中的节点数量。\n* `Node item(int index)`\n  返回给定索引的节点。索引范围在 `0` 到 `getLength()`–\
  \ 1 之间。\n\n## 3.4. 验证 XML 文档\n\n在上一节中，你学习了如何遍历 DOM 文档的树结构。然而，使用那种方法，你必须进行大量的繁燥编程和错误检查。你不仅需要处理元素之间的空白字符，还需要检查文档是否包含你预期的节点。例如，假设你正在读取这个元素：\n\
  \n```\n<font>\n   <name>Helvetica</name>\n   <size>36</size>\n</font>\n```\n\n你获取了第一个子节点。哎……它是一个包含空白字符\
  \ `\"\\n \"` 的文本节点。你跳过文本节点并找到了第一个元素节点。然后，你需要检查它的标签名是否为 `\"name\"`，以及它是否有一个类型为 `Text`\
  \ 的子节点。你移动到下一个非空白子节点并进行相同的检查。如果文档作者交换了子节点的顺序或添加了另一个子元素怎么办？编写所有这些错误检查代码是繁琐的——但跳过检查是鲁莽的。\n\
  \n幸运的是，XML 解析器的主要优势之一是它可以自动验证文档是否具有正确的结构。这使得解析变得简单得多。例如，如果你知道 `font` 片段已经通过了验证，你只需获取两个孙子节点，将它们强制转换为\
  \ `Text` 节点并获取文本数据，无需任何额外的检查。\n\n要指定文档结构，你可以提供 DTD 或 XML Schema 定义。DTD 或 schema\
  \ 包含了规则，这些规则解释了文档应该如何形成，通过指定每个元素的合法子元素和属性。例如，DTD 可能会包含如下规则：\n\n```\n<!ELEMENT font\
  \ (name,size)>\n```\n\n该规则表示 `font` 元素必须包含两个元素，即 `name` 和 `size` 元素。XML Schema 语言用以下方式表达相同的约束：\n\
  \n```\n<xsd:element name=\"font\">\n   <xsd:sequence>\n      <xsd:element name=\"\
  name\" type=\"xsd:string\"/>\n      <xsd:element name=\"size\" type=\"xsd:int\"\
  />\n   </xsd:sequence>\n</xsd:element>\n```\n\nXML Schema 比 DTD 可以表达更复杂的验证条件（例如\
  \ `size` 元素必须包含一个整数这一事实）。与 DTD 语法不同，XML Schema 语法本身使用 XML，如果你需要处理 schema 文件，这将是一个优势。\n\
  \n在下一节中，我们将详细讨论 DTD，然后简要介绍 XML Schema 支持的基础知识。最后，我们将展示一个完整的应用程序，演示验证如何简化 XML 编程。\n\
  \n### 3.4.1. 文档类型定义\n\n提供 DTD 有几种方法。你可以像这样将 DTD 包含在 XML 文档中：\n\n```\n<?xml version=\"\
  1.0\"?>\n<!DOCTYPE config [\n   <!ELEMENT config . . .>\n   more rules\n   . . .\n\
  ]>\n<config>\n   . . .\n</config>\n```\n\n如你所示，规则包含在 `DOCTYPE` 声明内部，位于由 `[. . .]`\
  \ 限定的块中。文档类型必须与根元素的名称匹配，例如我们示例中的 `config`。\n\n在 XML 文档内部提供 DTD 并不常见，因为 DTD 可能会变得很长。将\
  \ DTD 存储在外部更有意义。`SYSTEM` 声明可以为此。指定一个包含 DTD 的 URL，例如：\n\n```\n<!DOCTYPE config SYSTEM\
  \ \"config.dtd\">\n```\n\n或者\n\n```\n<!DOCTYPE config SYSTEM \"http://myserver.com/config.dtd\"\
  >\n```\n\n如果你为 DTD 使用相对 URL（如 `\"config.dtd\"`），请给解析器提供 `File` 或 `URL` 对象，而不是 `InputStream`。如果你必须从输入流进行解析，请提供一个实体解析器（见下文）。\n\
  \n识别已知 DTD 的机制源于 SGML。这里有一个示例：\n\n```\n<!DOCTYPE web-app\n   PUBLIC \"-//Sun Microsystems,\
  \ Inc.//DTD Web Application 2.2//EN\"\n   \"http://java.sun.com/j2ee/dtds/web-app_2_2.dtd\"\
  >\n```\n\n如果 XML 处理器知道如何通过公共标识符定位 DTD，它就不需要访问 URL。\n\nDTD 的系统标识符 URL 可能实际上无法运行，或者被刻意放慢。后者的例子是\
  \ XHTML 1.0 Strict DTD 的系统标识符：`http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd`。如果你解析一个\
  \ XHTML 文件，DTD 可能需要一两分钟才能提供服务。\n\n解决方法是使用*实体解析器*（entity resolver），将公共标识符映射到本地文件。你提供一个实现\
  \ `entity resolver` 的类的对象。\n\n\n\n\n然而，在一种常见的情况下，你无法将规则定义得像你希望的那样灵活。当一个元素可以包含文本时，只有两种有效情况：该元素只包含文本，例如：\n\
  \n```\n<!ELEMENT name (#PCDATA)>\n```\n\n或者该元素包含`文本和标签的任意顺序组合`，例如：\n\n```\n<!ELEMENT\
  \ para (#PCDATA|em|strong|code)*>\n```\n\n指定任何其他包含 `#PCDATA` 的类型规则都是非法的。例如，以下内容是非法的：\n\
  \n```\n<!ELEMENT captionedImage (image,#PCDATA)>\n```\n\n你必须重写此类规则，要么引入另一个 `caption`\
  \ 元素，要么允许任何 `image` 元素与文本的组合。\n\n这种限制简化了 XML 解析器在解析`混合内容`（标签和文本的混合）时的工作。由于允许混合内容会让你失去一些控制权，因此最好设计\
  \ DTD，使得所有元素要么包含其他元素，要么只包含文本。\n\n实际上，说你可以在 DTD 规则中指定任意元素的正则表达式并不完全准确。XML 解析器可能会拒绝某些会导致非确定性解析的复杂规则集。例如，正则表达式\
  \ `((x,y)|(x,z))` 是非确定性的。当解析器看到 `x` 时，它不知道选择两个备选中的哪一个。这个表达式可以以确定性形式重写为 `(x,(y|z))`。然而，某些表达式无法重构，例如\
  \ `((x,y)*|x?)`。Java XML API 中的解析器在遇到歧义的 DTD 时不会给出警告；它在解析时只需选择第一个匹配的备选项，这会导致它拒绝一些正确的输入。解析器完全可以这样做，因为\
  \ XML 标准允许解析器假设 DTD 是无歧义的。\n\n你还可以指定规则来描述元素的合法属性。通用语法为：\n\n```\n<!ATTLIST element\
  \ attribute type default>\n```\n\n#ch02table02 显示了法的属性类型，而 #ch02table03 显示了默认值的语法。\n\
  \n### 表 3.2：属性类型\n\n| 类型 | 含义 |\n| --- | --- |\n| `CDATA` | 任意字符字符串 |\n| `(``A`[`1`]`&#124;``A`[`2`]`&#124;\
  \ . . . &#124;``A`[`n`]*`)` | 字符串属性 `A[1]`, `A[2]`, ..., `A[n]` 中的其中一个 |\n| `NMTOKEN`,\
  \ `NMTOKENS` | 一个或多个名称标记 |\n| `ID` | 唯一的 ID |\n| `IDREF`, `IDREFS` | 一个或多个对唯一 ID\
  \ 的引用 |\n| `ENTITY`, `ENTITIES` | 一个或多个未解析的实体 |\n\n### 表 3.3：属性默认值\n\n| 默认值 | 含义\
  \ |\n| --- | --- |\n| `#REQUIRED` | 属性是所需的。 |\n| `#IMPLIED` | 属性是可选的。 |\n| `A` |\
  \ 属性可选的；如果没有指定，解析器将其报告为 `A`。 |\n| `#FIXED` `A` | 属性必须未指定或为 `A`；无论何种情况，解析器都报告其为 `A`。\
  \ |\n\n以下是两个典型的属性规范：\n\n```\n<!ATTLIST font style (plain|bold|italic|bold-italic)\
  \ \"plain\">\n<!ATTLIST size unit CDATA #IMPLIED>\n```\n\n第一个规范描述了 `font` 元素的 `style`\
  \ 属性。有四种法的属性值，默认值是 `plain`。第二个规范表示 `size` 元素的 `unit` 属性可以包含任何字符数据序列。\n\n通常建议使用元素而不是属性来描述数据。因此，字体样式应该是一个独立的元素，例如\
  \ `<font><style>plain</style>. . .</font>`。然而，属性对于枚举类型具有不可否认的优势，因为解析器可以验证值是否合法的。例如，如果字体样式是一个属性，解析器会检查它是否是允许四个值之一，并在未提供值的情况下提供默认值。\n\
  \n`CDATA` 属性值的处理方式与你之前看到的 `#PCDATA` 处理略有不同，且与 `<![CDATA[. . .]]>` 完全无关。属性值首先被`归一化`（normalized）——即解析器处理字符和实体引用（例如\
  \ `&#233;` 或 `&lt;`）并将空白替换为空格。\n\n`NMTOKEN`（或名称标记）与 `CDATA` 类似，但不允许大多数非字母数字字符和内部空白，且解析器会移除头部和尾部的空白。`NMTOKENS`\
  \ 是由空格分隔的名称标记列表。\n\n`ID` 结构非常有用。`ID` 是在文档中必须唯一的名称标记——解析器会检查唯一性。你将在下一个示例程序看到它的应用。`IDREF`\
  \ 是对同一文档中存在的 ID 的引用，解析器也会进行检查。`IDREFS` 是由空格分隔的 ID 引用列表。\n\n`ENTITY` 属性值引用一个“未解析的外部实体”。这是\
  \ SGML 的遗留，在实践中很少使用。`https://www.xml.com/axml/axml` 中的注释 XML 规范提供了详细信息。\n\n\n\n\n\
  \n*   `void setEntityResolver(EntityResolver resolver)`\n    设置解析器以定位正在解析的 XML 文档中引用的实体。\n\
  \n*   `void setErrorHandler(ErrorHandler handler)`\n    设置处理程序以报告解析过程中出现的错误和警告。\n\
  \n`org.xml.sax.EntityResolver`1.4\n\n*   `public InputSource resolveEntity(String\
  \ publicID, String systemID)`\n    返回一个包含给定 ID(s) 所引用的数据的输入源，或者返回 `null` 表示此解析器不知道如何解析特定名称。如果未提供公共\
  \ ID，则 `publicID` 参数可能为 `null`。\n\n`org.xml.sax.InputSource`1.4\n\n*   `InputSource(InputStream\
  \ in)`\n*   `InputSource(Reader in)`\n*   `InputSource(String systemID)`\n    从流、读取器或系统\
  \ ID（通常是相对或或绝对 URL）构建输入源。\n\n`org.xml.sax.ErrorHandler`1.4\n\n*   `void fatalError(SAXParseException\
  \ e)`\n*   `void error(SAXParseException e)`\n*   `void warning(SAXParseException\
  \ e)`\n    重写这些方法为致命错误、非致命错误和警告提供处理程序。\n\n`org.xml.sax.SAXParseException`1.4\n\n\
  *   `int getLineNumber()`\n*   `int getColumnNumber()`\n    返回导致异常的已处理输入的行号和列号。\n\
  \n`javax.xml.catalog.CatalogManager`9\n\n*   `static CatalogResolver catalogResolver(CatalogFeatures\
  \ features, URI... uris)`\n    产生一个使用位于提供的 URI 处的目录文件的解析器。此类实现了 `EntityResolver`，以及\
  \ StAX、架构验证和 XSL 转换器使用的解析器类。\n\n`javax.xml.catalog.CatalogFeatures`9\n\n*   `static\
  \ CatalogFeatures defaults()`\n    产生一个具有默认设置的实例。\n\n`javax.xml.parsers.DocumentBuilderFactory`1.4\n\
  \n*   `boolean isValidating()`\n*   `void setValidating(boolean value)`\n    获取或设置工厂的\
  \ `validating` 属性。如果设置为 `true`，由此工厂生成的解析器将验证它们的输入。\n\n*   `boolean isIgnoringElementContentWhitespace()`\n\
  *   `void setIgnoringElementContentWhitespace(boolean value)`\n    获取或设置工厂的 `ignoringElementContentWhitespace`\
  \ 属性。如果设置为 `true`，此工厂生成的解析器将忽略没有混合内容（即元素和 `#PCDATA` 的混合）的元素节点之间的空白。\n\n### 3.4.2.\
  \ XML 架构 (Schema)\n\nXML Schema 比 DTD 语法复杂得多，因此我们仅涵盖基础知识。有关更多信息，我们建议参考 [`www.w3.org/TR/xmlschema-0`](https://www.w3.org/TR/xmlschema-0)\
  \ 教程。\n\n要在文档中引用架构文件，请为根元素添加属性，例如：\n\n```xml\n<?xml version=\"1.0\"?>\n<config xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\"\n      xsi:noNamespaceSchemaLocation=\"\
  config.xsd\">\n   . . .\n</config>\n```\n\n此声明表示应使用架构文件 `config.xsd` 来验证文档。如果你的文档使用了命名空间，语法会复杂——详情请参见\
  \ XML Schema 教程。（`xsi` 前缀是命名空间别名；更多信息请参见第 3.6 节。）\n\n架构为每个元素和属性定义了一种类型。简单类型是字符串，可能对其内容有限制。其他所有内容都是*复杂*类型。具有简单类型的元素可以没有属性且没有子元素。否则，它必须具有复杂类型。相反，属性始终具有简单类型。\n\
  \n某些简单类型是内置在 XML Schema 中的，包括：\n\n```xml\nxsd:string\nxsd:int\nxsd:boolean\n```\n\
  \n我们使用前缀 `xsd:` 来表示 XML Schema 定义命名空间。一些作者也使用前缀 `xs:`。\n\n你可以定义自己的简单类型。例如，这是一个枚举类型：\n\
  \n```xml\n<xsd:simpleType name=\"StyleType\">\n   <xsd:restriction base=\"xsd:string\"\
  >\n      <xsd:enumeration value=\"PLAIN\" />\n      <xsd:enumeration value=\"BOLD\"\
  \ />\n      <xsd:enumeration value=\"ITALIC\" />\n      <xsd:enumeration value=\"\
  BOLD_ITALIC\" />\n   </xsd:restriction>\n</xsd:simpleType>\n```\n\n当定义元素时，你指定其类型：\n\
  \n```xml\n<xsd:element name=\"name\" type=\"xsd:string\"/>\n<xsd:element name=\"\
  size\" type=\"xsd:int\"/>\n<xsd:element name=\"style\" type=\"StyleType\"/>\n```\n\
  \n类型限制了元素的内容。例如，元素\n\n```xml\n<size>10</size>\n<style>PLAIN</style>\n```\n\n将通过通过验证，但元素\n\
  \n```xml\n<size>default</size>\n<style>SLANTED</style>\n```\n\n将被解析器拒绝。\n\n你可以将类型组合成复杂类型，例如：\n\
  \n```xml\n<xsd:complexType name=\"FontType\">\n   <xsd:sequence>\n      <xsd:element\
  \ ref=\"name\"/>\n      <xsd:element ref=\"size\"/>\n      <xsd:element ref=\"style\"\
  />\n   </xsd:sequence>\n</xsd:complexType>\n```\n\n`FontType` 是 `name`、`size` 和\
  \ `style` 元素的序列。你也可以嵌套元素：\n\n```xml\n<xsd:complexType name=\"FontType\">\n   <xsd:sequence>\n\
  \      <xsd:element ref=\"name\"/>\n      <xsd:element ref=\"size\"/>\n      <xsd:element\
  \ ref=\"style\"/>\n   </xsd:sequence>\n</xsd:complexType>\n```\n\n注意用于 `style` 元素的\
  \ `xsd:sequence`。`xsd:sequence` 是连接的等价物。例如：\n\n```xml\n<xsd:complexType name=\"\
  contactinfo\">\n   <xsd:choice>\n      <xsd:element ref=\"email\"/>\n      <xsd:element\
  \ ref=\"phone\"/>\n   </xsd:choice>\n</xsd:complexType>\n```\n\n这是 `email|phone`\
  \ 的等价物。\n\n要允许重复元素，使用 `minoccurs` 和 `maxoccurs` 属性。例如，`item*` 是\n\n```xml\n<xsd:element\
  \ name=\"item\" type=\". .\" minoccurs=\"0\" maxoccurs=\"unbounded\">\n```\n\n指定属性，在\
  \ `complexType` 中添加 `xsd:attribute` 元素：\n\n```xml\n<xsd:element name=\"size\">\n\
  \   <xsd:complexType>\n      . . .\n      <xsd:attribute name=\"unit\" type=\"xsd:string\"\
  \ use=\"optional\" default=\"cm\"/>\n   </xsd:complexType>\n</xsd:element>\n```\n\
  \n这是 DTD 语句\n\n```xml\n<!ATTLIST size CDATA #IMPLIED \"cm\">\n```\n\n将架构的元素和类型定义封装在\
  \ `xsd:schema` 元素中：\n\n```xml\n<xsd:schema xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
  >\n   . . .\n</xsd:schema>\n```\n\n使用架构解析 XML 文件与 DTD 类似，但有两个区别：\n\n1.  你需要开启命名空间支持，即使你的文件中没有使用它们。\n\
  \n    ```java\n    factory.setNamespaceAware(true);\n    ```\n\n2.  你需要为工厂准备好架构，使用以下魔法指令：\n\
  \n    ```java\n    final String JAXP_SCHEMA_LANGUAGE =\n          \"http://java.sun.com/xml/jaxp/properties/schemaLanguage\"\
  ;\n    final String W3C_XML_SCHEMA = \"http://www.w3.org/2001/XMLSchema\";\n   \
  \ factory.setAttribute(JAXP_SCHEMA_LANGUAGE, W3C_XML_SCHEMA);\n    ```\n\n### 3.4.3.\
  \ 实际示例\n\n在本节中，我们将通过一个实际示例来展示在真实设置下使用 XML。\n\n假设应用程序需要指定任意对象的配置数据，而不仅仅是文本字符串。我们提供了两种实例化对象的机制：使用构造函数和使用工厂方法。以下是使用构造函数创建\
  \ `Color` 标的方法：\n\n```xml\n<construct class=\"java.awt.Color\">\n   <int>55</int>\n\
  \   <int>200</int>\n   <int>100</int>\n</construct>\n```\n\n这里是使用工厂方法的示例：\n\n\n\n\
  \n\n```xml\n<factory class=\"java.nio.file.Path\" method=\"of\">\n   <string>logging.properties</string>\n\
  </factory>\n```\n\n如果省略工厂方法名，它将默认为 `getInstance`。\n\n如你所见，有描述字符串和整数的元素。我们还支持 `boolean`\
  \ 类型，并以相同的方式添加其他原始类型。\n\n为了展示语法，对于原始类型还有第二种机制：\n\n```xml\n<value type=\"int\">30</value>\n\
  ```\n\n配置是一条目序列。每个条目都有一个 ID 和一个对象：\n\n```xml\n<config>\n   <entry id=\"background\"\
  >\n      <construct class=\"java.awt.Color\">\n         <value type=\"int\">55</value>\n\
  \         <value type=\"int\">200</value>\n         <value type=\"int\">100</value>\n\
  \      </construct>\n   </entry>\n   . . .\n</config>\n```\n\n解析器会检查 ID 是否唯一。\n\n\
  Listing 3.2 中的程序显示了如何解析配置文件。示例配置定义在 Listing 3.3 中。\n\n如果你选择一个包含字符串 `-schema` 的文件，程序将使用\
  \ schema 而不是 DTD。\n\nListing 3.4 显示的 DTD 是直观的。\n\nListing 3.5 包含了等效 schema。在 schema\
  \ 中，我们可以提供额外的检查：`int` 或 `boolean` 元素只能包含整数或布尔内容。请注意使用 `xsd:group` 构造来定义被重复使用的复杂类型部分。\n\
  \n这个示例是 XML 的典型用法。XML 格式足够能够表达复杂的关系。XML 解析器通过接管常规的有效性检查工作并提供默认值增加了价值。\n\nListing\
  \ 3.2 v2ch03/read/XMLReadDemo.java\n\n```java\npackage v2ch03.read;\n\nimport module\
  \ java.base;\nimport module java.xml;\nimport  org.w3c.dom.CharacterData;\n\n/**\n\
  \ * 此程序显示了如何使用 XML 文件来描述 Java 对象。\n */\nclass XMLReadDemo {\n    void main(String[]\
  \ args) throws Exception {\n        String filename = args.length == 0 ? IO.readln(\"\
  Input file: \") : args[0];\n\n        DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \        factory.setValidating(true);\n\n        if (filename.contains(\"-schema\"\
  )) {\n            factory.setNamespaceAware(true);\n            final String JAXP_SCHEMA_LANGUAGE\
  \ \n                = \"http://java.sun.com/xml/jaxp/properties/schemaLanguage\"\
  ;\n            final String W3C_XML_SCHEMA = \"http://www.w3.org/2001/XMLSchema\"\
  ;\n            factory.setAttribute(JAXP_SCHEMA_LANGUAGE, W3C_XML_SCHEMA);\n   \
  \     }\n\n        factory.setIgnoringElementContentWhitespace(true);\n\n      \
  \  DocumentBuilder builder = factory.newDocumentBuilder();\n\n        builder.setErrorHandler(new\
  \ ErrorHandler() {\n            public void warning(SAXParseException e) throws\
  \ SAXException {\n                System.err.println(\"Warning: \" + e.getMessage());\n\
  \            }\n\n            public void error(SAXParseException e) throws SAXException\
  \ {\n                System.err.println(\"Error: \" + e.getMessage());\n       \
  \         System.exit(0);\n            }\n\n            public void fatalError(SAXParseException\
  \ e) throws SAXException {\n                System.err.println(\"Fatal error: \"\
  \ + e.getMessage());\n                System.exit(0);\n            }\n        });\n\
  \n        Document doc = builder.parse(filename);\n        Map<String, Object> config\
  \ = parseConfig(doc.getDocumentElement());\n        IO.println(config);\n    }\n\
  \n    Map<String, Object> parseConfig(Element e) throws ReflectiveOperationException\
  \ {\n        var result = new HashMap<String, Object>();\n        NodeList children\
  \ = e.getChildNodes();\n        for (int i = 0; i < children.getLength(); i++) {\n\
  \            var child = (Element) children.item(i);\n            String name =\
  \ child.getAttribute(\"id\");\n            Object value = parseObject((Element)\
  \ child.getFirstChild());\n            result.put(name, value);\n        }\n   \
  \     return result;\n    }\n\n    Object parseObject(Element e) throws ReflectiveOperationException\
  \ {\n        String tagName = e.getTagName();\n        if (tagName.equals(\"factory\"\
  ))\n            return parseFactory(e);\n        else if (tagName.equals(\"construct\"\
  ))\n            return parseConstruct(e);\n        else {\n            String childData\
  \ = ((CharacterData) e.getFirstChild()).getData();\n            if (tagName.equals(\"\
  int\"))\n                return Integer.valueOf(childData);\n            else if\
  \ (tagName.equals(\"boolean\"))\n                return Boolean.valueOf(childData);\n\
  \            else\n                return childData;\n        }\n    }\n\n    Object\
  \ parseFactory(Element e) throws ReflectiveOperationException {\n        String\
  \ className = e.getAttribute(\"class\");\n        String methodName = e.getAttribute(\"\
  method\");\n        Object[] args = parseArgs(e.getChildNodes());\n        Class<?>[]\
  \ parameterTypes = getParameterTypes(args);\n        Method method = Class.forName(className).getMethod(methodName,\
  \ parameterTypes);\n        return method.invoke(null);\n    }\n\n    Object parseConstruct(Element\
  \ e) throws ReflectiveOperationException {\n        String className = e.getAttribute(\"\
  class\");\n        Object[] args = parseArgs(e.getChildNodes());\n        Class<?>[]\
  \ parameterTypes = getParameterTypes(args);\n        Constructor<?> constructor\
  \ = Class.forName(className).getConstructor(parameterTypes);\n        return constructor.newInstance(args);\n\
  \    }\n\n    Object[] parseArgs(NodeList elements) {\n        Object[] result =\
  \ new Object[elements.getLength()];\n        for (int i = 0; i < elements.length();\
  \ i++) {\n            result[i] = parseObject((Element) elements.item(i));\n   \
  \     }\n        return result;\n    }\n\n    Class<?>[] getParameterTypes(Object[]\
  \ args) {\n        Map<Class<?>, Class<?>> toPrimitive = Map.of(Integer.class, int.class,\
  \ Boolean.class, boolean.class);\n        Class<?>[] result = new Class<?>[args.length];\n\
  \        for (int i = 0; i < result.length; i++) {\n            Class<?> cl = args[i].getClass();\n\
  \            result[i] = toPrimitive.get(cl);\n            if (result[i] == null)\
  \ result[i] = cl;\n        }\n        return result;\n    }\n}\n```\n\nListing 3.3\
  \ v2ch03/read/config.xml\n\n```xml\n<?xml version=\"1.0\"?>\n<!DOCTYPE config SYSTEM\
  \ \"config.dtd\">\n<config>\n  <entry id=\"background\">\n    <construct class=\"\
  java.awt.Color\">\n      <int>55</int>\n      <int>200</int>\n      <int>100</int>\n\
  \    </construct>\n  </entry>\n  <entry id=\"currency\">\n    <factory class=\"\
  java.util.Currency\">\n      <string>USD</string>\n    </factory>\n  </entry>\n\
  </config>\n```\n\nListing 3.4 v2ch03/read/config.dtd\n\n```dtd\n<!ELEMENT config\
  \ (entry)*>\n\n<!ELEMENT entry (string|int|boolean|construct|factory)>\n<!ATTLIST\
  \ entry id ID #IMPLIED>\n\n<!ELEMENT construct (string|int|boolean|construct|factory)*>\n\
  <!ATTLIST construct class CDATA #IMPLIED>\n\n<!ELEMENT factory (string|int|boolean|construct|factory)*>\n\
  <!ATTLIST factory class CDATA #IMPLIED>\n<!ATTLIST factory method CDATA \"getInstance\"\
  >\n\n<!ELEMENT string (#PCDATA)>\n<!ELEMENT int (#PCDATA)>\n<!ELEMENT boolean (#PCDATA)>\n\
  ```\n\nListing 3.5 v2ch03/read/config.xsd\n\n\n\n\n\n```xml\n<xsd:schema xmlns:xsd=\"\
  http://www.w3.org/2001/XMLSchema\">\n   <xsd:element name=\"config\">\n      <xsd:complexType>\n\
  \         <xsd:sequence>\n            <xsd:element name=\"entry\" minOccurs=\"0\"\
  \ maxOccurs=\"unbounded\">\n               <xsd:complexType>\n                 \
