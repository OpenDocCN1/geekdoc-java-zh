  \ `IndexOutOfBoundsException`。\n\n*   `ImageReaderSpi getOriginatingProvider()`\n\
  \    获取构建此读取器的服务提供者。\n\n`javax.imageio.spi.IIOServiceProvider` 1.4\n\n*   `String\
  \ getVendorName()`\n\n*   `String getVersion()`\n    获取此服务提供者的厂商名称和版本。\n\n`javax.imageio.spi.ImageReaderWriterSpi`\
  \ 1.4\n\n*   `String[] getFormatNames()`\n\n*   `String[] getFileSuffixes()`\n\n\
  *   `String[] getMIMETypes()`\n    获取此服务提供者创建的读取器或写入器所支持的格式名称、文件后缀和 MIME 类型。\n\n\
  `javax.imageio.ImageWriter` 1.4\n\n*   `void setOutput(Object output)`\n    设置写入器的输出目标。`output`\
  \ 参数是一个 `ImageOutputStream` 对象或此写入器接受的其他对象。\n\n*   `void write(IIOImage image)`\n\
  \n*   `void write(RenderedImage image)`\n    将单个图像写入输出目标。\n\n*   `void writeInsert(int\
  \ index, IIOImage image, ImageWriteParam param)`\n    向多图像文件写入图像。\n\n*   `boolean\
  \ canInsertImage(int index)`\n    如果可以在给定索引插入图像，则返回 `true`。\n\n*   `ImageWriterSpi\
  \ getOriginatingProvider()`\n    获取构建此写入器的服务提供者。\n\n`javax.imageio.IIOImage` 1.4\n\
  \n*   `IIOImage(RenderedImage image, List thumbnails, IIOMetadata metadata)`\n \
  \   从图像、可选缩略图和可选元数据构建 `IIOImage`。\n\n### 12.6.4. 图像处理\n\n假设你有一幅图像并想改进它的外观。你需要访问图像的单个像素并将其替换为其他像素。或者可能你想从头计算图像的像素——例如为了显示物理测量或数学计算的结果。`BufferedImage`\
  \ 类允许你控制图像中的像素，而实现 `BufferedImageOp` 接口的类允许你转换图像。\n\nJDK 1.0 拥有一个完全不同且远为复杂的图像框架，该框架针对从\
  \ Web 下载的图像进行增量渲染进行了优化（一次处理一行扫描线）。然而，操纵那些图像非常困难。我们在此书中不讨论该框架。\n\n你所操作的大多数图像是从图像文件中读取的——它们是由数字相机或扫描仪等设备产生的，或者是由绘图程序构建的。在本节中，我们将为你展示一种不同的构建图像的技术——即逐像素地构建图像。\n\
  \n要创建图像，按通常方式构造一个 `BufferedImage` 对象。\n\n```java\nimage = new BufferedImage(width,\
  \ height, BufferedImage.TYPE_INT_ARGB);\n```\n\n现在，调用 `getRaster` 方法获取 `WritableRaster`\
  \ 类型的对象。你将使用该对象来访问和修改图像的像素。\n\n```java\nWritableRaster raster = image.getRaster();\n\
  ```\n\n`setPixel` 方法允许你设置单个像素。这里的复杂性在于你不能简单地将像素设置为 `Color` 值。你必须知道缓冲区如何指定颜色值。这取决于图像的类型。如果你的图像类型为\
  \ `TYPE_INT_ARGB`，则每个像素由四个值描述——红、绿、蓝和 Alpha（透明度），每个值都在 `0` 到 `255` 之间。你必须以一个包含四个整数的数组提供它们：\n\
  \n```java\nint[] black = { 0, 0, 0, 255 };\nraster.setPixel(i, j, black);\n```\n\
  \n在 Java 2D API 的术语中，这些值被称为像素的样本值（sample values）。\n\n还有参数类型为 `float[]` 和 `double[]`\
  \ 的 `setPixel` 方法。然而，你需要放入这些数组的值并不是 `0.0` 到 `1.0` 之间的归一化颜色值。\n\n```java\nfloat[]\
  \ red = { 1.0F, 0.0F, 0.0F, 1.0F };\nraster.setPixel(i, j, red); // 错误\n```\n\n\
  无论数组类型是什么，你都需要提供 `0` 到 `255` 之间的值。\n\n你可以使用 `setPixels` 方法提供一批像素。指定起始像素位置以及你想要设置的矩形的宽度和高度。然后提供一个包含所有像素样本值的数组。例如，如果你的缓冲区图像类型为\
  \ `TYPE_INT_ARGB`，先提供第一个像素的红、绿、蓝和 Alpha 值，然后提供第二个像素的红、绿、蓝和 Alpha 值，依此类推。\n\n```java\n\
  var pixels = new int[4 * width * height];\npixels[0] = . . .; // 第一个像素的红色值\npixels[1]\
  \ = . . .; // 第一个像素的绿色值\npixels[2] = . . .; // 第一个像素的蓝色值\npixels[3] = . . .; //\
  \ 第一个像素的 Alpha 值\n. . .\nraster.setPixels(x, y, width, height, pixels);\n```\n\n\
  相反，要读取像素，使用 `getPixel` 方法。提供一个包含四个整数的数组来存放样本值。\n\n```java\nvar sample = new int[4];\n\
  raster.getPixel(x, y, sample);\n```\n\n从该整数构造一个 `Color` 值：\n\n```java\nvar rgb =\
  \ image.getRGB(x, y);\nvar color = new Color(rgb, true);\n```\n\n你可以使用 `getPixels`\
  \ 方法读取多个像素。\n\n```java\nvar pixels = new int[width * height];\nimage.getPixels(x,\
  \ y, width, height, pixels);\n```\n\n如果你使用了 `TYPE_INT_ARGB` 以外的类型，仍然可以使用 `getPixel`/`setPixel`\
  \ 方法。\n\n\n\n\n\n```\nint argb = model.getRGB(data);\nvar color = new Color(argb,\
  \ true);\n```\n\n要将像素设置为特定的颜色，请反向执行这些步骤。`Color` 类的 `getRGB` 方法会产生一个包含 alpha、红、绿、蓝值的\
  \ `int` 值。将该值传递给 `ColorModel` 类的 `getDataElements` 方法。返回值是一个包含与特定颜色模型相关的颜色值描述的 `Object`。将该对象传递给\
  \ `WritableRaster` 类的 `setDataElements` 方法。\n\n```\nint argb = color.getRGB();\n\
  Object data = model.getDataElements(argb, null);\nraster.setDataElements(x, y, data);\n\
  ```\n\n为了阐明如何使用这些方法从单个像素构建图像，我们遵循了传统惯例，绘制了一个曼德博罗集（Mandelbrot set），如图图 12.56 图 12.56:\
  \ 曼德博罗集\n\n曼德博罗集的构想是：平面上的每个点都与一组数字相关。如果该序列保持有界，则给该点上色。如果它“逃向无穷大”，则让其保持透明。\n\n以下是构造最简单的曼德博罗集的方法。对于每个点\
  \ (*a*, *b*)，观察从 (*x*, *y*) = (0, 0) 开始迭代的序列：\n\n`x[new] = x² – y² + a`\n\n`y[new]\
  \ = 2 · x · y + b`\n\n结果证明，如果 *x* 或 *y* 任何何时大于 2，那么序列就会逃向无穷大。只有对应于导致有界序列的点 (*a*,\
  \ *b*) 的像素才会被上色。（数字序列的公式最终源于复数数学；我们直接接受它们即可。）\n\n代码列表显示了具体代码。该程序演示了如何使用 `ColorModel`\
  \ 类将 `Color` 值转换为像素数据。该过程独立于图像类型。为了好玩，可以将缓冲图像的颜色类型更改为 `TYPE_BYTE_GRAY`。你不需要更改任何其他代码——图像的颜色模型会自动处理从颜色到样本值的转换。\n\
  \nListing 12.21 v2ch12/rasterImage/RasterImageFrame.java\n\n```\npackage v2ch12.rasterImage;\n\
  \nimport module java.desktop;\n\n/**\n * 此帧显示了一个带有曼德博罗集的图像。\n */\npublic class RasterImageFrame\
  \ extends JFrame {\n    private static final double XMIN = -2;\n    private static\
  \ final double XMAX = 2;\n    private static final double YMIN = -2;\n    private\
  \ static final double YMAX = 2;\n    private static final int MAX_ITERATIONS = 16;\n\
  \    private static final int IMAGE_WIDTH = 400;\n    private static final int IMAGE_HEIGHT\
  \ = 400;\n\n    public RasterImageFrame() {\n        BufferedImage image = makeMandelbrot(IMAGE_WIDTH,\
  \ IMAGE_HEIGHT);\n        add(new JLabel(new ImageIcon(image)));\n        pack();\n\
  \    }\n\n    /**\n     * 制作曼德博罗图像。\n     * @param width 宽度\n     * @parah height\
  \ 高\n     * @return 图像\n     */\n    public BufferedImage makeMandelbrot(int width,\
  \ int height) {\n        var image = new BufferedImage(width, height, BufferedImage.TYPE_INT_ARGB);\n\
  \        WritableRaster raster = image.getRaster();\n        ColorModel model =\
  \ image.getColorModel();\n\n        Color fractalColor = Color.RED;\n        int\
  \ argb = fractalColor.getRGB();\n        Object colorData = model.getDataElements(argb,\
  \ null);\n\n        for (int i = 0; i < width; i++)\n            for (int j = 0;\
  \ j < height; j++) {\n                double a = XMIN + i * (XMAX - XMIN) / width;\n\
  \                double b = YMIN + j * (YMAX - YMIN) / height;\n               \
  \ if (!escapesToInfinity(a, b)) raster.setDataElements(i, j, colorData);\n     \
  \       }\n        return image;\n    }\n\n    private boolean escapesToInfinity(double\
  \ a, double b) {\n        double x = 0.0;\n        double y = 0.0;\n        int\
  \ iterations = 0;\n        while (x <= 2 && y <= 2 && iterations < MAX_ITERATIONS)\
  \ {\n            double xnew = x * x - y * y + a;\n            double ynew = 2 *\
  \ x * y + b;\n            x = xnew;\n            y = ynew;\n            iterations++;\n\
  \        }\n        return x > 2 || y > 2;\n    }\n}\n```\n\n`java.awt.image.BufferedImage`1.2\n\
