  \ `a`[`20`]`a[`19`] .a` 的 21 位代码点。UTF-8 的优势在于 ASCII 集合中的所有字符只占用一个字节。\n\n每个 Unicode\
  \ “代码点”都有一个 21 位的整数。有不同的`字符编码`——将这些 21 位数字封装成字节的方法。\n\n最常见的编码是 UTF-8，它将每个 Unicode\
  \ 代码点编码为一到四个字节的序列。表 2.1 详细展示了如何编码位 `a`[`20`]`a[`19`] .a` 的 21 位代码点。UTF-8 的优势在于 ASCII\
  \ 集合中的所有字符只占用一个字节。\n\n另一种常见的编码是 UTF-16，它将每个 Unicode 代码点编码为一个或两个 16 位值（参见表 2.2）。这是\
  \ Java 使用的编码。实际上，UTF-16 有两种形式被称为“大端”和“小端”。考虑 16 位值 `0x2122`。在大端格式中，高位字节在前：`0x21`\
  \ 后跟 `0x22`。在小端格式中，情况反过来：`0x22 0x21`。为了指示使用的是哪一种，文件可以以“字节顺序标记”或 BOM，即 16 位数值 `0xFEFF`\
  \ 开始。读取可以使用此值来确定字节顺序，然后丢弃它。\n\n有些程序会在 UTF-8 编码文件的开头添加 BOM。显然，这是没有必要的，因为 UTF-8 没有字节顺序问题。但\
  \ Unicode 标准允许这样做，某些程序员认为这是一个好主意，因为它减少了对编码的疑虑。在读取 UTF-8 编码文件时，任何 BOM 都应该被忽略。遗憾的是，Java\
  \ 没有这样做，针对此问题的错误报告已被关闭为“不修复”。你最好的办法是移除输入中发现的任何领先 `\\uFEFF`。\n\n除了 UTF 编码外，还有部分编码涵盖了适用于特定用户群的字符范围。例如，ISO\
  \ 8859-1 是一种包含西欧语言使用的重音字符的单字节编码。Shift-JIS 是日语字符的变变长度编码。许多此类编码仍然在使用。\n\n没有可靠的方法可以从字节流中自动检测字符编码。有时，编码在其他地方指定。例如，在读取网页时，检查\
  \ `Content-Type` 头部。\n\n`StandardCharsets` 类具有每个 Java 虚拟机必须支持的字符编码的 `Charset` 类型静态变量：\n\
  \n\n\n\n\n```\nStandardCharsets.UTF_8\nStandardCharsets.UTF_16\nStandardCharsets.UTF_16BE\n\
  StandardCharsets.UTF_16LE\nStandardCharsets.UTF_32\nStandardCharsets.UTF_32BE\n\
  StandardCharsets.UTF_32LE\nStandardCharsets.ISO_8859_1\nStandardCharsets.US_ASCII\n\
  ```\n\n要获取另一种编码的 `Charset`，请使用静态方法 `forName`：\n\n```\nCharset shiftJIS = Charset.forName(\"\
  Shift-JIS\");\n```\n\n静态方法 `Charset.availableCharsets` 返回所有可用的 `Charset` 实例，其形式为从规范名称到\
  \ `Charset` 对象的映射。\n\n每当你需要指定字符编码时，请使用 `Charset` 对象。例如，你可以如下将字节数组转换为字符串：\n\n```\n\
  var str = new String(bytes, StandardCharsets.ISO_8859_1);\n```\n\n许多方法允许你使用字符串而不是\
  \ `CharSet` 来指定字符编码。对于标准字符编码，请使用 `StandardCharsets` 常量，这样任何拼写错误都会在编译时被捕获。\n\n在 Java\
  \ 17 之前，使用名称 `\"default\"` 调用 `Charset.forName` 会产生 `StandardCharsets.US_ASCII`！现在，该调用会导致抛出\
  \ `UnsupportedCharsetException`。\n\n### 2.1.9. 默认字符编码\n\n如果你没有指定字符编码，且操作需要在字节和字符串之间进行转换，它将选择一个默认值。对于\
  \ `java.nio.file` 包中的许多方法，该默认值是 UTF-8。\n\n但其他方法在未指定字符编码时会使用默认字符集。这些包括：\n\n* `java.io`\
  \ 中 reader 和 writer 类的方法\n* `String(byte[])` 构造函数和 `String` 类的 `getBytes` 方法\n*\
  \ `java.util` 包中的 `Scanner` 和 `Formatter`\n* `java.net` 包中的 `URLEncoder` 和 `URLDecoder`\n\
  \n在 Java 18 之前，默认字符集是“原生编码”（native encoding），它取决于执行 Java 虚拟机的系统。在 Linux 和 Mac OS\
  \ 上，该是 UTF-8，除非另有特定配置。然而，在 Windows 上，在大多数情况下，原生编码是像 `Cp1252` 这样的旧编码。（从 Java 17 开始，系统属性\
  \ `native.encoding` 会产生原生编码的名称。）\n\n在 Java 18 之前，Oracle 的 Java 实现有一个系统属性 `file.encoding`\
  \ 用于覆盖默认字符集。这虽然不是一个官方支持的属性，但它仍然被广泛使用。\n\n从 Java 18 开始，该属性已成为标准化。你可以在命令行上将 `file.encoding`\
  \ 属性设置为这些值：\n\n* `COMPAT`：将默认字符集设置为原生编码，并将 `file.encoding` 系统属性设置为其名称。\n* `UTF-8`：将默认字符集设置为\
  \ UTF-8。\n* 其他字符编码如 `US-ASCII`：对于某些未指定的旧字符集名称，可能会将默认字符集设置为指定的编码。\n\n`file.encoding`\
  \ 属性必须在命令行上设置。通过 `System.setProperty` 设置不会更新默认字符集。\n\n实际使用的默认字符集由静态方法 `Charset.defaultCharset`\
  \ 返回。\n\n最后，Windows 控制台使用的字符编码比文件编码使用的编码还要老旧。在将输出重定向到文件时，你可能想要覆盖它。从 Java 18 开始，你可以通过设置系统属性\
  \ `stdout.encoding` 和 `stderr.encoding` 来这样做。\n\n这些系统属性的命名可能令人困惑。该编码并不适用于 `stdout`\
  \ 和 `stderr`（它们是字节流），而是适用于 `System.out` 和 `System.err` 对象。它们都是 `PrintStream` 的实例，其\
  \ `print` 和 `println` 方法需要一个将字符转换为字节的编码。\n\nJava 25 增加了 `stdin.encoding` 属性，用于指定从\
  \ `System.in` 读取时的编码。它被 `IO` 和 `Console` 类使用，但未被 `Scanner` 使用。\n\n要快速查看各种编码的当前设置，请运行：\n\
  \n```\njava -XshowSettings:properties\n```\n\n查找以 `.encoding` 结尾的属性。以下是 Java 25\
  \ 的典型属性值：\n\n| 属性 | Windows | Linux/Mac OS |\n| --- | --- | --- |\n| `native.encoding`\
  \ | `Cp1252` | `UTF-8` |\n| `file.encoding` | `UTF-8` | `UTF-8` |\n| `stdin.encoding`\
  \ | `cp437` | `UTF-8` |\n| `stdout.encoding` | `cp437` | `UTF-8` |\n| `stderr.encoding`\
  \ | `cp437` | `UTF-8` |\n\n### 2.1.10. 读取字符输入\n\n如果你读取具有 JSON 或 XML 等结构化格式的文件，你将使用由理解该格式复杂细节的人编写的解析器。此类解析器通常一次读取一个字符。\n\
  \n在需要实现此类解析器的罕见情况下，请使用 `BufferedReader` 以提高效率。持续调用其 `read` 方法，该方法返回一个 `char` 值或在输入结束时返回\
  \ -1。读取器产生 UTF-16 代码单元。如果你对代码点（code points）感兴趣，你需要处理 UTF-16 编码：\n\n```\nint ch =\
  \ reader.read();\nif (ch != -1) {\n    int codePoint;\n    if (Character.isHighSurrogate(ch))\
  \ {\n        int ch2 = reader.read();\n        if (Character.isLowSurrogate(ch2))\
  \ {\n            codePoint = Character.toCodePoint(ch, ch2);\n        } else {\n\
  \            throw new MalformedInputException();\n        }\n    } else {\n   \
  \     codePoint = ch;\n    }\n}\n```\n\n`Character` 类包含了一些方法来判断代码点是否具有给定属性。例如，\n\
  \n```\nCharacter.isLetter(codePoint)\n```\n\n如果代码点是字母则返回 `true`。这里是一些其他方法：\n\n```\n\
  isUpperCase\nisLowerCase\nisDigit\nisSpaceChar\nisEmoji\n```\n\n分析代码点后，你通常需要将它们存储在字符串中，将其转换为\
  \ UTF-16。`StringBuilder` 的 `appendCodePoint` 方法将代码点转换为一个或两个 `char` 值。\n\n## 2.2\
  \ 读取二进制数据\n\n文本格式便于测试和调试，因为它是人类可读的，但传输不如高效。在后面的章节中，你将学习如何进行二进制输入输出。\n\n### 2.2.1.\
  \ `DataInput` 和 `DataOutput` 接口\n\n`DataOutput` 接口定义了以下方法，用于二进制格式写入数字、字符、布尔值或字符串：\n\
  \n```\nwriteChars          writeFloat\nwriteByte           writeDouble\nwriteInt\
  \            writeChar\nwriteShort          writeBoolean\nwriteLong           writeUTF\n\
  ```\n\n例如，`writeInt` 无论位数多少，始终将整数写入 4 字节，`writeDouble` 始终将 `double` 写入 8 字节。生成的输出不是人类可读的，但读取它比解析文本更快。\n\
  \n在内存中存储整数和浮点数有两种不同的方法，取决于你使用的处理器。假设你正在处理一个 4 字节的 `int`，例如十进制 1234，即十六进制的 4D2（1234\
  \ = 4 × 256 + 13 × 16 + 2）。该值可以如下所示存储，内存中四个字节中的第一个持有数值的最有效字节（MSB）：`00 00 04 D2`。这就是所谓的大端（big-endian）方法。或者，我们可以从最低有效字节（LSB）开始：`D2\
  \ 04 00 00`。这自然而然被称为小端（little-endian）方法。例如，SPARC 使用大端；Intel 处理器使用小端。在 Java 中，所有值都以大端方式写入，无论使用什么处理器。这使得\
  \ Java 数据文件平台无关。\n\n\n\n\n\n`writeUTF` 方法使用一种修改后的 8 位 Unicode 转换格式来写入字符串数据。它并不是简单地使用标准的\
  \ UTF-8 编码，而是先将 Unicode 码单元序列表示为 UTF-16，然后使用 UTF-8 规则对结果进行编码。这种修改后的编码方式对于代码大于 `0xFFFF`\
  \ 的字符会有所不同。它是为了与那些在 Unicode 增长到 16 位之前构建的虚拟机保持向后兼容性。\n\n由于没有其他地方使用这种 UTF-8 的修改版本，您应该只使用\
  \ `writeUTF` 方法写入用于 Java 虚拟机的字符串——例如，在生成字节码的程序中。对于其他用途，请使用 `writeChars` 方法。\n\n\
  要读回这些数据，请使用 `DataInput` 接口定义的以下方法：\n\n```\nreadInt            readDouble\nreadShort\
  \          readChar\nreadLong           readBoolean\nreadFloat          readUTF\n\
  ```\n\n`DataInputStream` 类实现了 `DataInput` 接口。要从文件中读取二进制数据，请将 `DataInputStream` 与字节源（如\
  \ `FileInputStream`）结合使用：\n\n```\nvar in = new DataInputStream(new FileInputStream(\"\
  employee.dat\"));\n```\n\n同样，要写入二进制数据，请使用实现 `DataOutput` 接口的 `DataOutputStream`\
  \ 类：\n\n```\nvar out = new DataOutputStream(new FileOutputStream(\"employee.dat\"\
  ));\n```\n\n### java.io.DataInput 1.0\n\n* `boolean readBoolean()`\n* `byte readByte()`\n\
  * `char readChar()`\n* `double readDouble()`\n* `float readFloat()`\n* `int readInt()`\n\
  * `long readLong()`\n* `short readShort()`\n  读取一个给定类型的值。\n\n* `void readFully(byte[]\
  \ b)`\n  将字节读入数组 `b` 中，阻塞直到所有字节都读完。\n\n* `void readFully(byte[] b, int off, int\
  \ len)`\n  将最多 `len` 个字节存于数组 `b` 中，从 `off` 位置开始，阻塞直到所有字节都读完。\n\n* `String readUTF()`\n\
  \  读取一个“修改后的 UTF-8”格式的字符字符串。\n\n* `int skipBytes(int n)`\n  跳过 `n` 个字节，阻塞直到所有字节都跳过。\n\
  \n### java.io.DataOutput 1.0\n\n* `void writeBoolean(boolean b)`\n* `void writeByte(int\
  \ b)`\n* `void writeChar(int c)`\n* `void writeDouble(double d)`\n* `void writeFloat(float\
  \ f)`\n* `void writeInt(int i)`\n* `void writeLong(long l)`\n* `void writeShort(int\
  \ s)`\n  写入一个给定类型的值。\n\n* `void writeChars(String s)`\n  写入字符串中的所有字符。\n\n* `void\
  \ writeUTF(String s)`\n  写入一个“修改后的 UTF-8”格式的字符字符串。\n\n## 2.2.2 随机访问文件\n\n`RandomAccessFile`\
  \ 类允许你在文件的任何位置读取或写入数据。磁盘文件是随机访问的，但与网络套接字通信的输入/输出流则不是。您可以以只读模式或读写混合模式打开随机访问文件；通过在构造函数的第二个参数中使用字符串\
  \ `\"r\"`（读取访问）或 `\"rw\"`（读写访问）来指定选项。\n\n```\nvar in = new RandomAccessFile(\"employee.dat\"\
  , \"r\");\nvar inOut = new RandomAccessFile(\"employee.dat\", \"rw\");\n```\n\n\
  还有 `\"rwd\"` 和 `\"rws\"` 模式，可以将数据更新或数据和元数据的更新刷新到磁盘。这种方式较慢，但可以防止程序或计算机崩溃时数据丢失。\n\n\
  当使用 `RandomAccessFile` 打开一个存在的文件时，它不会被删除。\n\n随机访问文件有一个*文件指针*，用于指示下一个要读取或写入的字节的位置。`seek`\
  \ 方法可以将文件指针设置到文件内的任意字节位置，该位置由 `long` 类型的值指定。\n\n`getFilePointer` 方法返回文件指针的当前位置。\n\
  \n`RandomAccessFile` 类实现了 `DataInput` 和 `DataOutput` 接口。要从随机访问文件读写数据，请使用我们在前一节中讨论过的\
  \ `readInt`/`writeInt` 以及 `readChar`/`writeChar` 等方法。\n\n让我们来看一个示例程序，该程序在随机访问文件中存储员工记录。每条记录\
  \ own 都相同。这使得读取任意记录变得变得非常简单。假设您想将文件指针定位到第三条记录。只需将文件指针设置为相应的字节位置并开始读取即可。\n\n```\n\
  long n = 3;\nin.seek((n - 1) * RECORD_SIZE);\nvar e = new Employee();\ne.readData(in);\n\
  ```\n\n如果您想修改记录并将其保存回原位置，请记住将文件指针设回记录的开头：\n\n```\nin.seek((n - 1) * RECORD_SIZE);\n\
  e.writeData(out);\n```\n\n要确定文件中的总字节数，请使用 `length` 方法。记录总数是文件长度除以每条记录的大小。\n\n```\n\
  long nbytes = in.length(); // 字节为长度\nint nrecords = (int) (nbytes / RECORD_SIZE);\n\
  ```\n\n整数和浮点值在二进制格式中具有固定的大小，但处理字符串时我们必须付出更多努力。我们提供了两个辅助方法来写入和读取固定长度的字符串。`writeFixedString`\
  \ 方法写入指定数量的码单元，如果字符串不足，则使用零值进行填充。\n\n```java\npublic static void writeFixedString(String\
  \ s, int size, DataOutput out)\n        throws IOException {\n    for (int i = 0;\
  \ i < size; i++) {\n        char ch = 0;\n        if (i < s.length()) ch = s.charAt(i);\n\
  \        out.writeChar(ch);\n    }\n}\n```\n\n`readFixedString` 方法从输入流读取字符，直到读取了\
  \ `size` 个码单元或遇到零值字符。为了增加效率，该方法使用 `StringBuilder` 类来读取字符串。\n\n```java\npublic static\
  \ String readFixedString(int size, DataInput in)\n        throws IOException {\n\
  \    var b = new StringBuilder(size);\n    int i = 0;\n    var done = false;\n \
  \   while (!done && i < size) {\n        char ch = in.readChar();\n        i++;\n\
  \        if (ch == 0) done = true;\n        else b.append(ch);\n    }\n    in.skipBytes(2\
  \ * (size - i));\n    return b.toString();\n}\n```\n\n我们将 `writeFixedString` 和 `readFixedString`\
  \ 方法放在 `DataIO` 辅助类中。\n\n要写入固定大小的记录，我们只需以二进制格式写入所有字段。\n\n```\nDataIO.writeFixedString(e.getName(),\
  \ Employee.NAME_SIZE, out);\nout.writeDouble(e.getSalary());\nLocalDate hireDay\
  \ = e.getHireDay();\nout.writeInt(hireDay.getYear());\nout.writeInt(hireDay.getMonthValue());\n\
  out.writeInt(hireDay.getDayOfMonth());\n```\n\n读回数据同样简单。\n\n```\nString name = DataIO.readFixedString(Employee.NAME_SIZE,\
  \ in);\ndouble salary = in.readDouble();\nint y = in.readInt();\nint m = in.readInt();\n\
  int d = in.readInt();\n```\n\n在列表 2.2 所示的程序将三条记录写入数据文件，然后按反序从文件中读取这些记录。为了高效实现这一点，需要随机访问——我们需要先到达最后一条。\n\
  \nListing 2.2 v2ch02/randomAccess/RandomAccessDemo.java\n\n\n\n\n\n```java\npackage\
  \ v2ch02.randomAccess;\n\nimport module java.base;\nimport com.horstmann.corejava.*;\n\
  \npublic class RandomAccessDemo {\n    final int NAME_SIZE = 40;\n    final int\
  \ RECORD_SIZE = 2 * NAME_SIZE + 8 + 4 + 4 + 4;\n\n    void main() throws Exception\
  \ {\n        var staff = new Employee[3];\n\n        staff[0] = new Employee(\"\
  Carl Cracker\", 75000, 1987, 12, 15);\n        staff[1] = new Employee(\"Harry Hacker\"\
  , 50000, 1989, 10, 1);\n        staff[2] = new Employee(\"Tony Tester\", 40000,\
  \ 1990, 3, 15);\n\n        try (var out = new DataOutputStream(new FileOutputStream(\"\
  employee.dat\"))) {\n            // 将所有员工记录保存到文件 employee.dat\n            for (Employee\
  \ e : staff)\n                writeData(out, e);\n        }\n\n        try (var\
  \ in = new RandomAccessFile(\"employee.dat\", \"r\")) {\n            // 将所有记录读入一个新数组\n\
  \n            // 计算数组大小\n            int n = (int) (in.length() / RECORD_SIZE);\n\
  \            var newStaff = new Employee[n];\n\n            // 反逆顺序读取员工\n      \
  \      for (int i = 0; i < n; i++) {\n                in.seek((n - 1 - i) * RECORD_SIZE);\n\
  \                newStaff[i] = readData(in);\n            }\n\n            // 打印新读取的员工记录\n\
  \            for (Employee e : newStaff)\n                IO.println(e);\n     \
  \   }\n    }\n\n    /**\n     * 将员工数据写入数据输出流。\n     * @param out 数据输出流\n     * @param\
  \ e 员工\n     */\n    void writeData(DataOutput out, Employee e) throws IOException\
  \ {\n        DataIO.writeFixedString(e.getName(), NAME_SIZE, out);\n        out.writeDouble(e.getSalary());\n\
  \n        LocalDate hireDay = e.getHireDay();\n        out.writeInt(hireDay.getYear());\n\
  \        out.writeInt(hireDay.getMonthValue());\n        out.writeInt(hireDay.getDayOfMonth());\n\
  \    }\n\n    /**\n     * 从数据输入流读取员工数据。\n     * @param in 数据输入流\n     * @return\
  \ 员工\n     */\n    Employee readData(DataInput in) throws IOException {\n      \
  \  String name = DataIO.readFixedString(NAME_SIZE, in);\n        double salary =\
  \ in.readDouble();\n        int y = in.readInt();\n        int m = in.readInt();\n\
  \        int d = in.readInt();\n        return new Employee(name, salary, y, m,\
  \ d);\n    }\n}\n```\n\n`java.io.RandomAccessFile` 1.0\n\n- `RandomAccessFile(String\
  \ file, String mode)`\n- `RandomAccessFile(File file, String mode)`\n  打开给定文件进行随机访问。`mode`\
  \ 字符串 `\"r\"` 表示只读模式，`\"rw\"` 表示读写模式，`\"rws\"` 表示读写模式且每次更新都会同步写入磁盘数据和元数据，`\"rwd\"\
  ` 表示读写模式且仅同步写入磁盘数据。\n\n- `long getFilePointer()`\n  返回文件指针的当前位置。\n\n- `void seek(long\
  \ pos)`\n  将文件指针设置为距离文件开始 `pos` 字节处。\n\n- `long length()`\n  返回文件的字节长度。\n\n### 2.2.3\
  \ ZIP 存档\n\nZIP 存档以（通常是）压缩格式存储一个或多个文件。每个 ZIP 存档都有一个头，其中包含每个文件名和使用的压缩方法等信息。在 Java\
  \ 中，你可以使用 `ZipInputStream` 读取 ZIP 存档。你需要查看存档中的各个条目（entries）。`getNextEntry` 方法返回一个\
  \ `ZipEntry` 类型的对象，描述该条目。从流中读取到结束（实际上是当前条目的结束），然后调用 `closeEntry` 读取下一个条目。在读取最后一个条目之前不要关闭\
  \ `ZipInputStream`。以下是遍历 ZIP 文件的典型代码序列：\n\n```java\nvar zin = new ZipInputStream(new\
  \ FileInputStream(zipname));\nboolean done = false;\nwhile (!done) {\n    ZipEntry\
  \ entry = zin.getNextEntry();\n    if (entry == null) done = true;\n    else {\n\
  \        // 读取 zin 的内容\n        zin.closeEntry();\n    }\n}\nzin.close();\n```\n\
  \n要写入 ZIP 文件，请使用 `ZipOutputStream`。对于想要放入 ZIP 文件的每个条目，创建一个 `ZipEntry` 对象。将文件名传递给\
  \ `ZipEntry` 构造函数；它会设置文件日期和解压方法等其他参数。你可以根据需要覆盖这些设置。然后，调用 `ZipOutputStream` 的 `putNextEntry`\
  \ 方法开始写入新文件。将文件数据发送到 ZIP 输出流。完成后，调用 `closeEntry`。对所有想要存储的文件重复此操作。以下代码骨架：\n\n```java\n\
  var fout = new FileOutputStream(\"test.zip\");\nvar zout = new ZipOutputStream(fout);\n\
  for all files {\n    var ze = new ZipEntry(filename);\n    zout.putNextEntry(ze);\n\
  \    // 将数据发送到 zout\n    zout.closeEntry();\n}\nzout.close();\n```\n\nJAR 文件（在第\
  \ 4 章中讨论过）仅仅是带有特殊清单（manifest）的 ZIP 文件。\n\n`java.util.zip.ZipInputStream` 1.1\n\n\
  - `ZipInputStream(InputStream in)`\n  创建一个 `ZipInputStream`，允许你从 `InputStream` 解压缩数据。\n\
  \n- `ZipEntry getNextEntry()`\n  返回下一个条目的 `ZipEntry` 对象，如果没有条目则返回 `null`。\n\n- `void\
  \ closeEntry()`\n  关闭 ZIP 文件中的当前条目。\n\n`java.util.zip.ZipOutputStream` 1.1\n\n-\
  \ `ZipOutputStream(OutputStream out)`\n  创建一个 `ZipOutputStream`，你可以用它将压缩数据写入到指定的\
  \ `OutputStream`。\n\n- `void putNextEntry(ZipEntry ze)`\n  将给定的 `ZipEntry` 中的信息写入输出流，并为数据准备流的位置。\n\
  \n- `void closeEntry()`\n  关闭 ZIP 文件中当前打开的条目。\n\n- `void setLevel(int level)`\n\
  \  设置后续 `DEFLATED` 条目的默认压缩级别，范围从 `Deflater.NO_COMPRESSION` 到 `Deflater.BEST_COMPRESSION`。默认值为\
  \ `Deflater.DEFAULT_COMPRESSION`。如果级别无效则抛出 `IllegalArgumentException`。\n\n- `void\
  \ setMethod(int method)`\n  设置此 `ZipOutputStream` 对于未指定方法的条目的默认压缩方法；可以是 `DEFLATED`\
  \ 或 `STORED`。\n\n`java.util.zip.ZipEntry` 1.1\n\n- `ZipEntry(String name)`\n  构造一个给定名的\
  \ ZIP 条目。\n\n- `long getCrc()`\n  返回此 `ZipEntry` 的 CRC32 校验和。\n\n- `String getName()`\n\
  \  返回此条目的名称。\n\n- `long getSize()`\n  返回条目的未压缩大小，如果未知则返回 -1。\n\n- `boolean isDirectory()`\n\
  \  如果此条目是目录则返回 `true`。\n\n- `void setMethod(int method)`\n  将条目的压缩方法设置为 `DEFLATED`\
  \ 或 `STORED`。\n\n- `void setSize(long size)`\n  设置条目的大小。只有在压缩方法为 `STORED` 时才需要。\n\
  \n- `void setCrc(long crc)`\n  设置此条目的 CRC32 校验和。使用 `CRC32` 类计算此校验和。只有在压缩方法为 `STORED`\
  \ 时才需要。\n\n\n\n\n你已经学习了如何从文件中读写数据。然而，文件管理并不仅仅是读写操作。`Path` 接口和 `Files` 类封装了在用户机器上进行文件系统操作所需的功能。例如，可以使用\
  \ `Files` 类来删除或重命名文件，或者查找文件最后修改的时间。换句话说，输入/输出流类关注的是文件的内容，而我们在这里讨论的类关注的是文件在磁盘上的存储。\n\
  \n`Path` 接口和 `Files` 类比一直可以追溯到 JDK 1.0 的 `File` 类要方便得多。除非是为了与旧留代码交互，否则你不应该使用 `File`\
  \ 类。\n\n### 2.3.1. 路径 (Paths)\n\n`Path` 是目录名称的序列，可选地跟随着一个文件名。路径的第一个组件可以是`根组件`（root\
  \ component），例如 `/` 或 `C:\\`。允许的根组件取决于文件系统。以根组件开头的路径是**绝对路径**（absolute）。否则，它是**相对路径**（relative）。例如，在这里我们构建了一个绝对路径和一个相对路径。对于绝对路径，我们假设使用的是类\
  \ Unix 文件系统。\n\n```\nPath absolute = Path.of(\"/home\", \"harry\");\nPath relative\
  \ = Path.of(\"myprog\", \"conf\", \"user.properties\");\n```\n\n静态方法 `Path.of` 接收一个或多个字符串，并将它们与默认文件系统的路径分隔符（类\
  \ Unix 文件系统为 `/`，Windows 为 `\\`）连接。然后它解析结果，如果结果在给定的文件系统中不是有效路径，则抛出 `InvalidPathException`。结果是一个\
  \ `Path` 对象。\n\n`of` 方法可以获取包含多个组件的单个字符串。例如，你可以这样从配置文件中读取路径：\n\n```\nString baseDir\
  \ = props.getProperty(\"base.dir\");\n// 可能是类似于 /opt/myprog 或 c:\\Program Files\\\
  myprog 的字符串\nPath basePath = Path.of(baseDir); // baseDir 包含分隔符是允许的\n```\n\n路径并不对应于实际存在的文件。它仅仅是一个抽象的序列。正如你将在下一节中看到的，当你想要创建一个文件时，首先创建一个路径，然后调用一个方法来创建相应的文件。\n\
  \n组合或 `resolve`（解析）路径是非常常见的。调用 `p.resolve(q)` 根据以下规则返回路径：\n\n- 如果 `q` 是绝对的，则结果为\
  \ `q`。\n- 如果 `q` 没有根节点，则结果通过连接 `p` 和 `q` 。\n- 否则，结果取决于文件系统的规则。\n\n例如，假设你的应用程序需要相对于从配置文件读取的给定基目录查找其工作目录，如前面的示例所示。\n\
  \n```\nPath workRelative = Path.of(\"work\");\nPath workPath = basePath.resolve(workRelative);\n\
  ```\n\n`resolve` 方法有一个快捷方式，可以接收字符串而不是路径：\n\n```\nPath workPath = basePath.resolve(\"\
  work\");\n```\n\n`resolve` 方法不会简化结果。例如，\n\n```\nPath.of(\"/usr/bin\").resolve(\"\
  ../local\")\n```\n\n是一个路径 `/usr/bin/../local`。\n\n有一个便利方法 `resolveSibling`，它相对于路径的父目录进行解析，从而产生一个兄弟路径。例如，如果\
  \ `workPath` 是 `/opt/myapp/work`，调用\n\n```\nPath tempPath = workPath.resolveSibling(\"\
  temp\");\n```\n\n将创建 `/opt/myapp/temp`。\n\n`resolve` 的反向操作是 `relativize`（相对化）。调用\
  \ `p.relativize(r)` 产生路径 `q`，当它与 `p` 解析时会产生 `r`。例如，将 `/home/harry` 相对于 `/home/fred/input.txt`\
  \ 相对化得到 `../fred/input.txt`。在这里，我们假设 `..` 表示文件系统中的父目录。\n\n`normalize` 方法移除任何冗余的\
  \ `.` 和 `..` 组件（或文件系统可能认为冗余的任何内容）。例如，规范路径 `/home/harry/../fred/./input.txt` 得到 `/home/fred/input.txt`。\n\
  \n`toAbsolutePath` 方法产生给定路径的绝对路径，从根组件开始，例如 `/home/fred/input.txt` 或 `c:\\Users\\\
  fred\\input.txt`。\n\n`Path` 接口有很多用于分解路径的方法。这段代码示例展示了一些最实用的方法：\n\n```\nPath p = Path.of(\"\
  /home\", \"fred\", \"myprog.properties\");\nPath parent = p.getParent(); // 路径 /home/fred\n\
  Path file = p.getFileName(); // 路径 myprog.properties\nPath root = p.getRoot(); //\
  \ 路径 /\n```\n\n`getFileName` 方法简单地返回给定路径的最后一个组件。如果路径描述的是目录，那么它是目录名，而不是文件名。\n\n正如你在第一卷中已经看到的，你可以从\
  \ `Path` 对象构造一个 `Scanner`：\n\n```\nvar in = new Scanner(Path.of(\"/home/fred/input.txt\"\
  ));\n```\n\n偶尔，你可能需要与使用 `File` 类而不是 `Path` 接口的旧 API 交互。`Path` 接口有一个 `toFile` 方法，而\
  \ `File` 类有一个 `toPath` 方法。\n\n### 2.3.2. 读写文件 (Reading and Writing Files)\n\n`Files`\
  \ 类可以快速处理常见的文件操作。例如，你可以轻松地将整个内容读取为字节数组、字符串、行列表或行流：\n\n```\nbyte[] bytes = Files.readAllBytes(path);\n\
  String content = Files.readString(path);\nList<String> lines = Files.readAllLines(path);\n\
  Stream<String> lineStream = Files.lines(path);\n```\n\n相反，对于写入：\n\n```\nFiles.write(path,\
  \ bytes);\nFiles.writeString(path, content);\nFiles.write(path, lines);\n```\n\n\
  要向给定文件追加内容，使用\n\n```\nFiles.write(path, content, StandardOpenOption.APPEND);\n```\n\
  \n调用\n\n```\nlong pos = Files.mismatch(path1, path2);\n```\n\n产生文件内容不同的第一个字节的位置。\n\
  \n要获取文件的 MIME 类型（例如 `\"text/html\"` 或 `\"image/png\"`），调用\n\n```\nString mimeType\
  \ = Files.probeContentType(path);\n```\n\n具体行为取决于 Java 的实现。每个实现都有一组 `FileTypeDetector`\
  \ 实例，按未指定的顺序进行尝试。每个检测器可能会检查文件扩展、、特定的元数据或内容的前几个字节。\n\n以下方法允许你与使用经典输入输出流或读取器/写入器的\
  \ API 交互：\n\n```\nInputStream in = Files.newInputStream(path);\nOutputStream out\
  \ = Files.newOutputStream(path);\nReader in = Files.newBufferedReader(path);\nWriter\
  \ out = Files.newBufferedWriter(path);\n```\n\n这些便利方法让你免于处理 `FileInputStream`、`FileOutputStream`、`BufferedReader`\
  \ 或 `BufferedWriter`。\n\n\n\n\n`java.nio.file.Files`7\n\n*   `static byte[] readAllBytes(Path\
  \ path)`\n*   `static String readString(Path path, Charset charset)`\n*   `static\
  \ List<String> readAllLines(Path path, Charset charset)`\n  读取文件内容。\n*   `static\
  \ Path write(Path path, byte[] contents, OpenOption... options)`\n*   `static Path\
  \ write(Path path, String contents, Charset charset, OpenOption... options)`\n*\
  \   `static Path writeString(Path path, CharSequence contents, Charset cs, OpenOption...\
  \ options)`11\n*   `static Path write(Path path, Iterable<? extends CharSequence>\
  \ contents, Charset cs, OpenOption... options)`\n  将给定内容写入文件并返回 `path`。\n*   `static\
  \ long mismatch(Path path, Path path2)`12\n  返回文件内容不同的第一个字节位置。\n*   `static String\
  \ probeContentType(Path path)`12\n  返回安装的文件类型检测器对文件内容 MIME 类型的最佳猜测，如果无法确定类型则返回 `null`。\n\
  *   `static InputStream newInputStream(Path path, OpenOption... options)`\n*   `static\
  \ OutputStream newOutputStream(Path path, OpenOption... options)`\n*   `static BufferedReader\
  \ newBufferedReader(Path path, Charset charset)`\n*   `static BufferedWriter newBufferedWriter(Path\
  \ path, Charset charset, OpenOption... options)`\n  打开文件进行读取或写入。\n\n### 2.3.3. 创建文件和目录\n\
  \n要创建一个新目录，请调用\n\n```\nFiles.createDirectory(path);\n```\n\n路径中除最后一个组件以外的所有部分必须已经存在。如果要也创建中间目录，请使用\n\
  \n```\nFiles.createDirectories(path);\n```\n\n可以使用以下方法创建一个空文件：\n\n```\nFiles.createFile(path);\n\
  ```\n\n如果文件已存在，该调用将抛出异常。存在性检查和创建是原子的。如果文件不存在，它将在其他人有机会执行相同操作之前被创建。\n\n提供了一些便利方法，可以在给定或系统特定的位置创建临时文件或目录。\n\
  \n```\nPath newPath = Files.createTempFile(dir, prefix, suffix);\nPath newPath =\
  \ Files.createTempFile(prefix, suffix);\nPath newPath = Files.createTempDirectory(dir,\
  \ prefix);\nPath newPath = Files.createTempDirectory(prefix);\n```\n\n在这里，`dir`\
  \ 是一个 `Path`，而 `prefix`/`suffix` 是可以是 `null` 的字符串。例如，调用 `Files.createTempFile(null,\
  \ \".txt\")` 可能会返回类似 `/tmp/1234405522364837194.txt` 的路径。\n\n在创建文件或目录时，你可以指定属性，例如所有者或权限。然而，细节取决于文件系统，我们在这里不进行介绍。\n\
  \n`java.nio.file.Files`7\n\n*   `static Path createFile(Path path, FileAttribute<?>...\
  \ attrs)`\n*   `static Path createDirectory(Path path, FileAttribute<?>... attrs)`\n\
  *   `static Path createDirectories(Path path, FileAttribute<?>... attrs)`\n  创建文件或目录。`createDirectories`\
  \ 方法也会创建任何中间目录。\n*   `static Path createLink(Path link, Path existing)`\n*   `static\
