  \ prefix, FileAttribute<?>... attrs)`\n*   `static Path createTempDirectory(Path\
  \ parentDir, String prefix, FileAttribute<?>... attrs)`\n  在适合临时文件的位置或给定的父目录中创建临时文件或目录。返回创建的文件或目录的路径。\n\
  \n### 2.3.4. 复制、移动和删除文件\n\n要将文件从一个位置复制到另一个位置，只需调用\n\n```\nFiles.copy(fromPath, toPath);\n\
  ```\n\n如果改为移动文件，请调用\n\n```\nFiles.move(fromPath, toPath);\n```\n\n如果目标存在，则复制或移动将失败。如果你想覆盖现有的目标，请使用\
  \ `REPLACE_EXISTING` 选项。如果你想复制所有文件属性，请使用 `COPY_ATTRIBUTES` 选项。你可以这样提供两个选项：\n\n```\n\
  Files.copy(fromPath, toPath, StandardCopyOption.REPLACE_EXISTING,\n    StandardCopyOption.COPY_ATTRIBUTES);\n\
  ```\n\n你可以指定移动应该是原子的。这样你就能确保移动要么成功完成，要么源文件继续存在。使用 `ATOMIC_MOVE` 选项：\n\n```\nFiles.move(fromPath,\
  \ toPath, StandardCopyOption.ATOMIC_MOVE);\n```\n\n你也可以将输入流复制到 `Path`，这意味着将输入流保存到磁盘。同样，你可以将\
  \ `Path` 复制到输出流。使用以下调用：\n\n```\nFiles.copy(inputStream, toPath);\nFiles.copy(fromPath,\
  \ outputStream);\n```\n\n与其他的 `copy` 调用一样，你可以根据需要提供复制选项。\n\n最后，要删除文件，只需调用\n\n```\n\
  Files.delete(path);\n```\n\n如果文件不存在，该方法将抛出异常，因此你可能想使用\n\n```\nboolean deleted =\
  \ Files.deleteIfExists(path);\n```\n\n该方法也可以用于删除空目录。\n\n表 2.4 文件操作标准选项\n\n| 选项 |\
  \ 描述 |\n| --- | --- |\n| `READ` | 用于读取。 |\n| `WRITE` | 用于写入。 |\n| `APPEND` | 用于写入，追加到末尾。\
  \ |\n| `TRUNCATE_EXISTING` | 用于写入，删除现有内容。 |\n| `CREATE_NEW` | 如果文件已存在则失败。 |\n| `CREATE`\
  \ | 如果不存在则原子地创建一个新文件。 |\n| `DELETE_ON_CLOSE` | 在关闭时尽力删除。 |\n| `SPARSE` | 暗文件系统该文件是稀疏的。\
  \ |\n| `DSYNC` 或 `SYNC` | 要求文件数据或元数据同步写入存储设备。 |\n\n表 2.4 复制标准选项\n\n| 选项 | 描述 |\n\
  | --- | --- |\n| `ATOMIC_MOVE` | 原子地移动文件。 |\n| `COPY_ATTRIBUTES` | 复制文件属性。 |\n|\
  \ `REPLACE_EXISTING` | 如果目标存在则替换它。 |\n\n表 2.4 链接选项\n\n| 选项 | 描述 |\n| --- | --- |\n\
  | `NOFOLLOW_LINKS` | 不跟随符号链接。 |\n| `FOLLOW_LINKS` | 跟随符号链接。 |\n\n`java.nio.file.Files`7\n\
  \n*   `static Path copy(Path from, Path to, CopyOption... options)`\n*   `static\
  \ Path move(Path from, Path to, CopyOption... options)`\n  将 `from` 复制或移动到给定目标并返回\
  \ `to`。\n*   `static long copy(InputStream from, Path to, CopyOption... options)`\n\
  *   `static long copy(Path from, OutputStream to, CopyOption... options)`\n  从输入流复制到文件，或从文件复制到输出流，返回复制的字节数。\n\
  *   `static void delete(Path path)`\n*   `static boolean deleteIfExists(Path path)`\n\
  \  删除给定文件或空目录。如果文件或目录不存在，第一个方法将抛出异常。在这种方法在这种情况下返回 false。\n\n### 2.3.5. 获取文件信息\n\n\
  以下静态方法返回 boolean 值以检查路径的属性：\n\n*   `exists`\n*   `isHidden`\n*   `isReadable`, `isWritable`,\
  \ `isExecutable`\n*   `isRegularFile`, `isDirectory`, `isSymbolicLink`\n\n`size`\
  \ 方法返回文件中的字节数。\n\n```\nlong fileSize = Files.size(path);\n```\n\n`getOwner` 方法返回文件的所有者，其为\
  \ `java.nio.file.attribute.UserPrincipal` 实例。\n\n所有文件系统都会报告一组基本属性，由 `BasicFileAttributes`\
  \ 接口封装，这与上述信息部分重叠。基本文件属性是\n\n\n\n\n\n*   文件的创建、最后访问和最后修改时间，作为 `java.nio.file.attribute.FileTime`\
  \ 类的实例存在。\n*   文件是否为普通文件、目录、符号链接或上述者皆非。\n*   文件大小\n*   文件键（file key）——某个特定文件系统的类对象，它可能或无法唯一标识一个文件。\n\
  \n要获取这些属性，请调用：\n\n```\nBasicFileAttributes attributes = Files.readAttributes(path,\
  \ BasicFileAttributes.class);\n```\n\n如果你知道用户文件系统是符合 POSIX 标准的，你可以改为获取 `PosixFileAttributes`\
  \ 实例：\n\n```\nPosixFileAttributes attributes = Files.readAttributes(path, PosixFileAttributes.class);\n\
  ```\n\n然后你可以找到文件的组所有者以及所有者、组和世界（world）的访问权限。我们不再详细介绍这些细节，因为这些信息中大部分在不同操作系统之间是不可移植的。\n\
  \n### `java.nio.file.Files`7\n\n*   `static boolean exists(Path path)`\n*   `static\
  \ boolean isHidden(Path path)`\n*   `static boolean isReadable(Path path)`\n*  \
  \ `static boolean isWritable(Path path)`\n*   `static boolean isExecutable(Path\
  \ path)`\n*   `static boolean isRegularFile(Path path)`\n*   `static boolean isDirectory(Path\
  \ path)`\n*   `static boolean isSymbolicLink(Path path)`\n    检查路径给定的文件的指定属性。\n\
  *   `static long size(Path path)`\n    获取以字节为单位的文件大小。\n*   `A readAttributes(Path\
  \ path, Class<A> type, LinkOption... options)`\n    读取类型为 `A` 的文件属性。\n\n### `java.nio.file.attribute.BasicFileAttributes`7\n\
  \n*   `FileTime creationTime()`\n*   `FileTime lastAccessTime()`\n*   `FileTime\
  \ lastModifiedTime()`\n*   `boolean isRegularFile()`\n*   `boolean isDirectory()`\n\
  *   `boolean isSymbolicLink()`\n*   `boolean isOther()`\n*   `long size()`\n*  \
  \ `Object fileKey()`\n    获取请求的属性。\n\n### `java.nio.file.attribute.FileTime`7\n\n\
  *   `Instant toInstant()`8\n    产生与此 `FileTime` 表示相同时间的 `Instant`。\n\n### 2.3.6.\
  \ 访问目录条目\n\n静态方法 `Files.list` 返回一个读取目录条目的 `Stream<Path>`。该目录是惰性加载的，使得高效处理包含海量条目的目录成为可能。\n\
  \n由于读取目录涉及一种需要关闭的系统资源，你应该使用 `try` 块：\n\n```\ntry (Stream<Path> entries = Files.list(pathToDirectory))\
  \ {\n    . . .\n}\n```\n\n`list` 方法不会进入子目录。要处理目录的所有后代节点，请改用 `Files.walk` 方法。\n\n\
  ```\ntry (Stream<Path> entries = Files.walk(pathToRoot)) {\n    // 包含所有后代，按深度优先顺序访问\n\
  }\n```\n\n以下是对解压后的 `src.zip` 树的遍历示例：\n\n```java\njava/nio\njava/nio/DirectCharBufferU.java\n\
  java/nio/ByteBufferAsShortBufferRL.java\njava/nio/MappedByteBuffer.java\n. . .\n\
  java/nio/ByteBufferAsDoubleBufferB.java\njava/nio/charset\njava/nio/charset/CoderMalfunctionError.java\n\
  java/nio/charset/CharsetDecoder.java\njava/nio/charset/UnsupportedCharsetException.java\n\
  java/nio/charset/spi\njava/nio/charset/spi/CharsetProvider.java\njava/nio/charset/StandardCharsets.java\n\
  java/nio/charset/Charset.java\n. . .\njava/nio/charset/CoderResult.java\njava/nio/HeapFloatBufferR.java\n\
  . . .\n```\n\n如你所示，每当遍历产生一个目录时，会在继续处理兄弟节点之前进入它。\n\n你可以通过调用 `Files.walk(pathToRoot,\
  \ depth)` 来限制想要访问的树深度。两个 `walk` 方法都有一个类型为 `FileVisitOption...` 的可变参数，但你只能提供一个选项：`FOLLOW_LINKS`\
  \ 用于跟踪符号链接。\n\n如果你过滤了 `walk` 返回的路径，且你的过滤标准涉及存储在目录中的文件属性（例如大小、创建时间或类型（文件、目录、符号链接）），请使用\
  \ `find` 方法代替 `walk`。调用该方法时，传入一个接受路径和 `BasicFileAttributes` 对象的谓词函数。唯一的优势是效率。因为目录本身会被读取，属性是直接可用的。\n\
  \n这段代码片段使用 `Files.walk` 方法将一个目录拷贝到另一个：\n\n```\nFiles.walk(source).forEach(p -> {\n\
  \    try {\n        Path q = target.resolve(source.relativize(p));\n        if (Files.isDirectory(p))\n\
  \            Files.createDirectory(q);\n        else\n            Files.copy(p,\
  \ q);\n    }\n    catch (IOException e) {\n        throw new UncheckedIOException(e);\n\
  \    }\n});\n```\n\n遗憾的是，你无法轻松地使用 `Files.walk` 方法删除目录树，因为你需要在删除父目录之前删除子节点。第 2.3.8\
  \ 节 向你展示了如何克服这个问题。\n\n`Files.walk` 方法在任何子目录不可读时抛出异常。如果你只想访问可读目录，请使用下文介绍的 `fileTree`。\n\
  \n### 2.3.7. Glob 模式\n\n有时，使用 `glob` 语法来过滤路径比正则表达式更有用。表 2.5 显示了 glob 模式。\n\n| 模式\
  \ | 说明 | 示例 |\n| --- | --- | --- |\n| `*` | 匹配路径组件中的零多个字符。 | `*.java` 匹配 Java 文件。\
  \ |\n| `**` | 跨目录边界匹配零多个字符。 | `**.java` 匹配任何子目录。 |\n| `?` | 匹配单个字符。 | `????.java`\
  \ 匹配四个字符（不计后缀）。 |\n| `[. .]` | 匹配字符集。 | `Test[0-9]` 匹配数字。 |\n| `[!0-9]` | 否定。 |\
  \ `[!0-9]` 匹配非数字。 |\n| `{.}` | 逗号分隔的备选项。 | `*.java,class}` 匹配 Java 和 class 文件。 |\n\
  | `\\` | 转义上述任何字符。 | `*\\**` 匹配文件名包含 `*` 的文件。 |\n\n要按此类模式过滤，请构造 `PathMatcher` 并使用其\
  \ `matches` 方法。如果你在 Windows 上使用 glob 语法，必须双写反斜杠——一次是为了 glob 语法，一次是为了 Java 字符串：`Files.newDirectoryStream(dir,\
  \ \"C:\\\\\")`。\n\n```PathMatcher javaSource = FileSystems.getDefault().getPathMatcher(\"\
  glob:**/*.java\");\nList<Path> sourcePaths = Files.walk(root).filter(javaSource::matches).toList();\n\
  ```\n\n### `java.nio.file.FileSystem`7\n\n*   `PathMatcher getPathMatcher(String\
  \ syntaxAndPattern)`\n    获取给定语法和模式的匹配器。`syntaxAndPattern` 字符串以语法名称开头，跟着该语法的模式。每个文件系统都支持\
  \ `glob` 和 `regex` 语法。\n\n### `java.nio.file.FileSystems`7\n\n*   `static FileSystem\
  \ getDefault()`\n    获取默认文件系统。\n\n### `java.nio.file.PathMatcher`7\n\n*   `boolean\
  \ matches(Path path)`\n    如果给定路径匹配则返回 `true`。\n\n### 2.3.8. 目录流\n\n正如你在第 2.3.6\
  \ 节 中所看到的，`Files.walk` 方法产生一个遍历目录后代的 `Stream<Path>`。有时，你需要对遍历过程进行更精细的控制。在这种情况下，请改用\
  \ `Files.newDirectoryStream` 对象。它产生一个 `DirectoryStream`。注意，它不是 `java.util.stream.Stream`\
  \ 的子接口，而是一个专门用于目录遍历的接口。它是 `Iterable` 的子接口，因此你可以在增强型 `for` 循环中使用目录流。以下是用法模式：\n\n\
  ```\ntry (DirectoryStream<Path> entries = Files.newDirectoryStream(dir)) {\n   \
  \ for (Path entry : entries)\n        处理条目\n}\n```\n\n`try`-with-resources 块确保了目录流被正确关闭。\n\
  \n\n\n\n目录项的访问没有特定的顺序。\n\n你可以使用 glob 模式来过滤文件：\n\n```\ntry (DirectoryStream<Path>\
  \ entries = Files.newDirectoryStream(dir, \"*.java\"))\n```\n\n如果你想访问目录的所有后代节点，请改用\
  \ `walkFileTree` 方法并提供一个 `FileVisitor` 类型的对象。该对象会在以下情况被通知：\n\n* 当遇到文件时：`FileVisitResult\
  \ visitFile(T path, BasicFileAttributes attrs)`\n* 在处理目录之前：`FileVisitResult preVisitDirectory(T\
  \ dir, IOException e)`\n* 在处理目录之后：`FileVisitResult postVisitDirectory(T dir, IOException\
  \ e)`\n* 当尝试访问文件或目录时发生错误时（例如尝试在没有相应权限的情况下打开目录）：`FileVisitResult visitFileFailed(T\
  \ path, IOException e)`\n\n在每种情况下，你都可以指定想要执行什么操作：\n\n* 继续访问下一个文件：`FileVisitResult.CONTINUE`\n\
  * 继续遍历，但不访问该目录下的项：`FileVisitResult.SKIP_SUBTREE`\n* 继续遍历，但不访问该文件的兄弟节点：`FileVisitResult.SKIP_SIBLINGS`\n\
  * 终止遍历：`FileVisitResult.TERMINATE`\n\n如果任何方法抛出异常，遍历也将终止，并且该异常将从 `walkFileTree` 方法抛出。\n\
  \n`FileVisitor` 接口是一个泛型类型，但你可能不需要 `FileVisitor<Path>` 以外的类型。`walkFileTree` 方法可以接受\
  \ `FileVisitor<? super Path>`，但 `Path` 并没有许多超类型。\n\n便利类 `SimpleFileVisitor` 实现了\
  \ `FileVisitor` 接口，其方法非常简单，会继续访问或在发生异常时终止访问。你可以扩展它并根据需要重写这些方法。\n\n例如，这里是如何打印给定目录的所有子目录：\n\
  \n```\nFiles.walkFileTree(Path.of(\"/\"), new SimpleFileVisitor<Path>() {\n    \
  \    public FileVisitResult preVisitDirectory(Path path, BasicFileAttributes attrs)\n\
  \                throws IOException {\n            IO.println(path);\n         \
  \   return FileVisitResult.CONTINUE;\n        }\n\n        public FileVisitResult\
  \ postVisitDirectory(Path dir, IOException e) {\n            return FileVisitResult.CONTINUE;\n\
  \        }\n\n        public FileVisitResult visitFileFailed(Path path, IOException\
  \ e)\n                throws IOException {\n            if (e != null) throw e;\n\
  \            return FileVisitResult.SKIP_SUBTREE;\n        }\n    });\n```\n\n注意我们需要重写\
  \ `postVisitDirectory` 和 `visitFileFailed`。否则，一旦访问器遇到不允许打开的目录或不允许访问的文件，访问就会失败。\n\
  \n另外请注意，路径的属性作为参数传递给 `preVisitDirectory` 和 `visitFile` 方法的。访问器已经必须进行一次系统调用来获取属性，因为需要区分文件和目录。这样，你就不需要再次进行调用了。\n\
  \n如果你需要在进入或离开目录时执行某些工作，`FileVisitor` 接口的其他方法将非常有用用。例如，当你删除一个目录树时，你需要在删除其所有文件后删除当前目录。这里是删除目录树的完整代码：\n\
  \n```\n// 删除从根节点开始的目录树\nFiles.walkFileTree(root, new SimpleFileVisitor<Path>() {\n\
  \        public FileVisitResult visitFile(Path file, BasicFileAttributes attrs)\n\
  \                throws IOException {\n            Files.delete(file);\n       \
  \     return FileVisitResult.CONTINUE;\n        }\n\n        public FileVisitResult\
  \ postVisitDirectory(Path dir, IOException e)\n                throws IOException\
  \ {\n            if (e != null) throw e;\n            Files.delete(dir);\n     \
  \       return FileVisitResult.CONTINUE;\n        }\n    });\n```\n\n`java.nio.file.Files`\n\
  \n* `static DirectoryStream<Path> newDirectoryStream(Path path)`\n* `static DirectoryStream<Path>\
  \ newDirectoryStream(Path path, String glob)`\n  获取给定目录中文件和目录的迭代器。第二个方法只接受匹配给定 glob\
  \ 模式的项。\n* `static Path walkFileTree(Path start, FileVisitor<? super Path> visitor)`\n\
  \  遍历给定路径的所有后代节点，并将访问器应用于所有后代节点。\n\n`java.nio.file.SimpleFileVisitor<T>`\n\n* `static\
  \ FileVisitResult visitFile(T path, BasicFileAttributes attrs)`\n  在访问文件或目录时调用；返回\
  \ `CONTINUE`、`SKIP_SUBTREE`、`SKIP_SIBLINGS` 或 `TERMINATE` 之一。默认实现什么都不做并继续。\n* `static\
  \ FileVisitResult preVisitDirectory(T dir, BasicFileAttributes attrs)`\n* `static\
  \ FileVisitResult postVisitDirectory(T dir, IOException exc)`\n  在访问目录之前和之后调用。默认实现什么都不做并继续。然而，如果\
  \ `exc` 不为空空，则会将其抛出，导致访问因该异常终止。\n* `static FileVisitResult visitFileFailed(T path,\
  \ IOException exc)`\n  在尝试获取给定文件信息时抛出异常时调用。默认实现会重新抛出异常，导致访问因该异常终止。如果你想继续，请重写该方法。\n\
  \n### 2.3.9. ZIP 系统\n\n`Paths` 类在默认文件系统（本地磁盘上的文件）中查找路径。你可以拥有其他文件系统。其中非常有用的是 ZIP\
  \ 文件系统。如果 `zipname` 是一个 ZIP 文件的路径，那么调用\n\n```\nFileSystem fs = FileSystems.newFileSystem(zippath);\n\
  ```\n\n建立包含 ZIP 中所有文件的文件系统。如果你知道文件名，从该归档拷贝文件是很容易的：\n\n```\nFiles.copy(fs.getPath(sourceName),\
  \ targetPath);\n```\n\n在这里，`fs.getPath` 是任意文件系统的 `Path.of` 的模拟。要列出 ZIP 中的所有文件，可以遍历树：\n\
  \n```\nFiles.walk(fs.getPath(\"/\")).forEach(IO::println);\n```\n\n要创建一个 ZIP 文件，调用：\n\
  \n```\nFileSystem fs = FileSystems.newFileSystem(zippath, Map.of(\"create\", \"\
  true\"));\n```\n\n然后将文件拷贝到文件系统。完成后，调用\n\n```\nfs.close();\n```\n\n以便将更改写入磁盘。\n\n\
  ZIP 文件系统比 2.2.3 节的 API 更好，后者需要特殊的类来处理 ZIP。\n\n`java.nio.file.FileSystems`\n\n* `static\
  \ FileSystem newFileSystem(Path path)`\n* `static FileSystem newFileSystem(Path\
  \ path, Map<String, ?> env)`\n  由接受给定路径第一个文件系统提供者创建。默认情况下，有一个接受 .zip 或 .jar 结尾文件的\
  \ ZIP 文件系统提供者。使用 `env` 映射作为取决于文件系统提供者的配置参数。\n* `void close()`\n  关闭此文件系统并永久写入任何更改。\n\
  \n`java.nio.file.FileSystem`\n\n* `static Path getPath(String first, String... more)`\n\
  \  通过连接给定的字符串创建路径。\n\n## 2.4 内存映射文件\n\n大多数操作系统可以利用虚拟内存实现将文件或文件区域“映射”到内存中。然后就可以像内存数组一样访问文件，这比传统的文件操作要快得多。\n\
  \n### 2.4.1 内存映射文件性能\n\n在本节末尾，你可以找到一个程序，它使用传统的文件输入和内存映射文件计算文件的 CRC32 校验和。在某台机器上，当计算\
  \ JDK `lib` 目录下 51MB 文件 `src.zip` 的校验和时，我们得到了表 2.6 所示的时间数据。\n\n表 2.6: 文件操作计时数据\n\
  \n| 方法 | 时间 |\n| --- | --- |\n| 纯输入流 | 15.1 秒 |\n\n\n\n\n| 缓冲输入流 | 0.8 秒 |\n| 随机访问文件\
  \ | 11.9 秒 |\n| 内存映射文件 | 0.2 秒 |\n\n如你所见，在这一特定的机器上，内存映射比使用缓冲顺序输入快一点，并且比使用 `RandomAccessFile`\
  \ 快得多。\n\n当然，具体的数值在不同机器之间会有很大差异，但显而易见，与随机访问相比，性能提升是巨大的。\n\n内存映射使用的 API 比随机访问文件稍微不直观一些。以下是操作步骤：\n\
  \n首先，获取该文件的 `channel`（通道）。`channel` 是磁盘文件的抽象，允许你访问操作系统的功能，例如内存映射、文件锁定以及文件之间的快速数据传输。\n\
  \n```\nFileChannel channel = FileChannel.open(path, options);\n```\n\n然后，通过调用 `FileChannel`\
  \ 类的 `map` 方法从通道获取一个 `ByteBuffer`。指定你想要映射的文件区域和 `mapping mode`（映射模式）。支持支持模式模式：\n\
  \n*   `FileChannel.MapMode.READ_ONLY`：生成的缓冲区是只读的。任何写入缓冲区的尝试都会导致 `ReadOnlyBufferException`。\n\
  *   `FileChannel.MapMode.READ_WRITE`：生成的缓冲区是可写的，更改将在以后某个时间写回文件。注意，其他映射了相同文件的程序可能不会立即看到这些更改。多个程序同时进行文件映射的精确行为取决于操作系统。\n\
  *   `FileChannel.MapMode.PRIVATE`：生成的缓冲区是可写的，但任何更改对此缓冲区都是私有的，不会传播到文件中。\n\n例如，\n\n\
  ```\nMappedByteBuffer buffer = channel.map(FileChannel.MapMode.READ_ONLY, 0, channel.size());\n\
  ```\n\n一旦获取了缓冲区，你就可以使用 `ByteBuffer` 类和 `Buffer` 超类的方法来读写数据。\n\n缓冲区支持顺序访问和随机数据访问。缓冲区有一个\
  \ `position`（位置），它会随着 `get` 和 `put` 操作而向前移动。例如，你可以按顺序遍历缓冲区中的所有字节：\n\n```\nwhile\
  \ (buffer.hasRemaining()) {\n    byte b = buffer.get();\n    . . .\n}\n```\n\n或者，你可以使用随机访问：\n\
  \n```\nfor (int i = 0; i < buffer.limit(); i++) {\n    byte b = buffer.get(i);\n\
  \    . . .\n}\n```\n\n你还可以使用以下方法读写字节数组：\n\n```\nget(byte[] bytes)\nget(byte[] bytes,\
  \ int offset, int length)\n```\n\n最后，还有这些方法：\n\n```\ngetInt            getChar\n\
  getLong           getFloat\ngetShort          getDouble\n```\n\n用于读取以 `binary`（二进制）值存储在文件中原始类型值。正如我们已经提到的，Java\
  \ 对二进制数据使用大端序（big-endian ordering）。然而，如果你需要处理一个包含小端序二进制数字的文件，只需调用：\n\n```\nbuffer.order(ByteOrder.LITTLE_ENDIAN);\n\
  ```\n\n要查找缓冲区当前的字节序，调用：\n\n```\nByteOrder b = buffer.order();\n```\n\n要向缓冲区写入数字，请使用以下方法之一：\n\
  \n```\nputInt            putChar\nputLong           putFloat\nputShort         \
  \ putDouble\n```\n\n在某个时刻，且肯定在通道关闭时，这些更改会被写回文件。\n\n列表 2.3 计算了文件的 32 位循环冗余校验和 (CRC32)。该校验和通常用于判断文件是否被损坏。文件的损坏极有可能导致校验和发生变化。`java.util.zip`\
  \ 包包含一个 `CRC32` 类，它使用以下循环计算字节序列的校验和：\n\n```\nvar crc = new CRC32();\nwhile (more\
  \ bytes) {\n    crc.update(next byte);\n}\nlong checksum = crc.getValue();\n```\n\
  \nCRC 计算的细节并不重要。我们只是将其作为一个有用的文件操作的示例。（在实践中，你会以较大的块读取和更新数据，而不是一个字节一个字节地处理。那样速度差异就不会那么显著了。）\n\
  \n运行程序的方式：\n\n```\njava v2ch02.memoryMap.MemoryMapDemo filename\n```\n\n列表 2.3 `v2ch02/memoryMap/MemoryMapDemo.java`\n\
  \n```java\npackage v2ch02.memoryMap;\n\nimport module java.base;\n\n/**\n * 此程序用四种方式计算文件的\
  \ CRC 校验和。\n */\npublic class MemoryMapDemo {\n    void main(String[] args) throws\
  \ Exception {\n        Path filename = Path.of(args.length > 0 ? args[0]\n     \
  \           : IO.readln(\"Enter the path to a large file: \"));\n        IO.println(\"\
  Input Stream:\");\n        long start = System.nanoTime();\n        long crcValue\
  \ = checksumInputStream(filename);\n        long end = System.nanoTime();\n    \
  \    IO.println(Long.toHexString(crcValue));\n        IO.println(\"%.3f seconds\"\
  .formatted((end - start) * 1E-9));\n\n        IO.println(\"Buffered Input Stream:\"\
  );\n        start = System.nanoTime();\n        crcValue = checksumBufferedInputStream(filename);\n\
  \        end = System.nanoTime();\n        IO.println(Long.toHexString(crcValue));\n\
  \        IO.println(\"%.3f seconds\".formatted((end - start) * 1E-9));\n\n     \
  \   IO.println(\"Random Access File:\");\n        start = System.nanoTime();\n \
  \       crcValue = checksumRandomAccessFile(filename);\n        end = System.nanoTime();\n\
  \        IO.println(Long.toHexString(crcValue));\n        IO.println(\"%.3f seconds\"\
  .formatted((end - start) * 1E-9));\n\n        IO.println(\"Mapped File:\");\n  \
  \      start = System.nanoTime();\n        crcValue = checksumMappedFile(filename);\n\
  \        end = System.nanoTime();\n        IO.println(Long.toHexString(crcValue));\n\
  \        IO.println(\"%.3f seconds\".formatted((end - start) * 1E-9));\n    }\n\n\
  \    long checksumInputStream(Path filename) throws IOException {\n        try (InputStream\
  \ in = Files.newInputStream(filename)) {\n            var crc = new CRC32();\n \
  \           boolean done = false;\n            while (!done) {\n               \
  \ int c = in.read();\n                if (c == -1)\n                    done = true;\n\
  \                else\n                    crc.update(c);\n            }\n     \
  \       return crc.getValue();\n        }\n    }\n\n    long checksumBufferedInputStream(Path\
  \ filename) throws IOException {\n        try (var in = new BufferedInputStream(Files.newInputStream(filename)))\
  \ {\n            var crc = new CRC32();\n            boolean done = false;\n   \
  \         while (!done) {\n                int c = in.read();\n                if\
  \ (c == -1)\n                    done = true;\n                else\n          \
  \          crc.update(c);\n            }\n            return crc.getValue();\n \
  \       }\n    }\n\n    long checksumRandomAccessFile(Path filename) throws IOException\
  \ {\n        try (var file = new RandomAccessFile(filename.toFile(), \"r\")) {\n\
  \            long length = file.length();\n            var crc = new CRC32();\n\
  \            for (long p = 0; p < length; p++) {\n                int c = file.readByte();\n\
  \                crc.update(c);\n            }\n            return crc.getValue();\n\
  \        }\n    }\n\n    long checksumMappedFile(Path filename) throws IOException\
  \ {\n        try (FileChannel channel = FileChannel.open(filename)) {\n        \
  \    var crc = new CRC32();\n            int length = (int) channel.size();\n  \
  \          MappedByteBuffer buffer = channel.map(FileChannel.MapMode.READ_ONLY,\
  \ 0, length);\n            for (int p = 0; p < length; p++) {\n                int\
  \ c = buffer.get(p);\n                crc.update(c);\n            }\n          \
  \  return crc.getValue();\n        }\n    }\n}\n```\n\n\n\n为给定路径打开文件通道。默认情况下，通道以读取模式打开。参数\
  \ `options` 是 `StandardOpenOption` 枚举中的 `WRITE`、`APPEND`、`TRUNCATE_EXISTING`、`CREATE`\
  \ 值之一。\n\n*   `MappedByteBuffer map(FileChannel.MapMode mode, long position, long\
  \ size)`\n\n    将文件的区域映射到内存。参数 `mode` 是 `FileChannel.MapMode` 类中的常量 `READ_ONLY`、`READ_WRITE`\
  \ 或 `PRIVATE` 之一。\n\n`java.nio.Buffer` 1.4\n\n*   `boolean hasRemaining()`\n\n \
  \   如果当前缓冲区位置尚未达到缓冲区的限制位置，则返回 `true`。\n\n*   `int limit()`\n\n    返回缓冲区的限制位置——即不再有可用值的第一个位置。\n\
  \n`java.nio.ByteBuffer` 1.4\n\n*   `byte get()`\n\n    从当前位置获取一个字节，并将当前位置移动到下一个字节。\n\
  \n*   `byte get(int index)`\n\n    从指定的索引获取一个字节。\n\n*   `ByteBuffer put(byte b)`\n\
  \n    在当前位置放入一个字节，并将当前位置移动到下一个字节。返回此缓冲区的引用。\n\n*   `ByteBuffer put(int index, byte\
  \ b)`\n\n    在指定的索引处放入一个字节。返回此缓冲区的引用。\n\n*   `ByteBuffer get(byte[] destination)`\n\
  \n*   `ByteBuffer get(byte[] destination, int offset, int length)`\n\n    用来自缓冲区的字节填充字节数组（或字节数组的一个区域），并根据读取的字节数移动当前位置。如果缓冲区中剩余字节数不足，则不读取任何字节，并抛出\
  \ `BufferUnderflowException`。返回此缓冲区的引用。\n\n*   `ByteBuffer put(byte[] source)`\n\
  \n*   `ByteBuffer put(byte[] source, int offset, int length)`\n\n    将字节数组中的所有字节（或字节数组某个区域的字节）放入缓冲区，并根据写入的字节数移动当前位置。如果缓冲区中剩余字节不足，则不写入任何字节，并抛出\
  \ `BufferOverflowException`。返回此缓冲区的引用。\n\n*   `Xxx getXxx()`\n\n*   `Xxx getXxx(int\
  \ index)`\n\n*   `ByteBuffer putXxx(Xxx value)`\n\n*   `ByteBuffer putXxx(int index,\
  \ Xxx value)`\n\n    获取或放入一个二进制数字。`Xxx` 是 `Int`、`Long`、`Short`、`Char`、`Float` 或\
  \ `Double` 之一。\n\n*   `ByteBuffer order(ByteOrder order)`\n\n*   `ByteOrder order()`\n\
  \n    设置或获取字节序。`order` 的值是 `ByteOrder` 类中的常量 `BIG_ENDIAN` 或 `LITTLE_ENDIAN`。\n\n\
  *   `static ByteBuffer allocate(int capacity)`\n\n    构造一个具有给定容量的缓冲区。\n\n*   `static\
  \ ByteBuffer wrap(byte[] values)`\n\n    构造一个由给定数组支持的缓冲区。\n\n*   `CharBuffer asCharBuffer()`\n\
  \n    构造一个以此缓冲区为基础的字符缓冲区。对字符缓冲区的更改反映在此缓冲区中，但字符缓冲区有自己的位置、限制和标记。\n\n`java.nio.CharBuffer`\
  \ 1.4\n\n*   `char get()`\n\n*   `CharBuffer get(char[] destination)`\n\n*   `CharBuffer\
  \ get(char[] destination, int offset, int length)`\n\n    从缓冲区的位置开始获取一个 `char` 值或一个\
  \ `char` 值范围，并将位置移过已读取的字符。后两个方法返回 `this`。\n\n*   `CharBuffer put(char c)`\n\n* \
  \  `CharBuffer put(char[] source)`\n\n*   `CharBuffer put(char[] source, int offset,\
  \ int length)`\n\n*   `CharBuffer put(String source)`\n\n*   `CharBuffer put(CharBuffer\
  \ source)`\n\n    从缓冲区的位置开始放入一个 `char` 值或一个 `char` 值范围，并将位置移过已写入的字符。从 `CharBuffer`\
  \ 读取时，将读取所有剩余字符。所有方法均返回 `this`。\n\n### 2.4.2. 缓冲区数据结构\n\n当你使用内存映射时，你会创建一个跨整个文件或你感兴趣的文件区域的缓冲区。你也可以使用缓冲区来读写较小块的信息。\n\
  \n在本节中，我们将简要描述对 `Buffer` 对象的各种操作。缓冲区是相同类型值的数组。`Buffer` 类是一个抽象类，其具体子类包括 `ByteBuffer`、`CharBuffer`、`DoubleBuffer`、`FloatBuffer`、`IntBuffer`、`LongBuffer`\
  \ 和 `ShortBuffer`。\n\n`StringBuffer` 类与这些缓冲区无关。\n\n在实践中，你最常用的是 `ByteBuffer` 和 `CharBuffer`。如\
  \ #ch01fig11 所示，缓冲区具有：\n\n*   永远不会的 `capacity`（容量）\n*   读取或写入下一个值的 `position`（位置）\n\
  *   超过此位置读写无意义的 `limit`（限制）\n*   可选的用于重复读或写操作的 `mark`（标记）\n\n图 2.5：缓冲区\n\n这些值满足条件\n\
  \n`0 ≤ mark ≤ position ≤ limit`\n\n### 2.5. 文件锁\n\n当多个同时执行的程序需要修改同一个文件时，它们需要以某种方式进行通信，否则文件很容易损坏。文件锁可以解决这个问题。文件锁控制对文件或文件内部某个字节范围的访问。\n\
  \n\n\n\n假设你的应用程序保存了一个带有系统级偏好的文件。如果用户启动了应用程序的两个实例，可能会发生两个实例都想要写入该文件的情况。在这种情况下，第一个实例应该锁定该文件。当第二个实例发现文件被锁定时，它可以决定等待文件被解锁，或者简单地跳过写入过程。\n\
  \n要锁定文件，请调用 `FileChannel` 类的 `lock` 或 `tryLock` 方法。\n\n```\nFileChannel channel\
  \ = FileChannel.open(path);\nFileLock lock = channel.lock();\n```\n\n或者\n\n```\n\
  FileLock lock = channel.tryLock();\n```\n\n第一次调用会阻塞，直到锁可用。第二次调用会立即返回，返回锁或者在锁不可用时返回\
  \ `null`。文件将保持锁定状态，直到通道关闭或在锁上调用了 `release` 方法。\n\n你也可以通过以下调用锁定文件的部分：\n\n```\nFileLock\
  \ lock(long start, long size, boolean shared)\n```\n\n或者\n\n```\nFileLock tryLock(long\
  \ start, long size, boolean shared)\n```\n\n`shared` 标志为 `false` 时表示对文件进行读写锁。标志为\
  \ `true` 时表示共享锁，它允许多个进程从文件中读取内容，同时防止任何进程获取排他锁。并不是所有的操作系统都支持共享锁。即使你只请求共享锁，也可能获得排他锁。调用\
  \ `FileLock` 类的 `isShared` 方法可以确定你拥有的是哪种锁。\n\n如果你锁定了文件的尾部，随后文件增长超过了锁定部分，则额外的区域不会被锁定。要锁定所有字节，请使用\
  \ `Long.MAX_VALUE` 作为大小。\n\n完成后务必解锁。一如既往，这最好通过 `try`-with-resources` 语句完成：\n\n```\n\
  try (FileLock _ = channel.lock()) {\n    access the locked file or segment\n}\n\
  ```\n\n请记住，文件锁定是取决于系统的。以下是一些需要注意的点：\n\n* 在包括 Linux 在内的某些系统中，文件锁定仅仅是建议性的。如果应用程序未能获取锁，它仍然可以写入另一个应用程序当前已锁定的文件。\n\
  * 在某些系统中，你不能同时锁定一个文件并将其映射到内存中。\n* 文件锁对于 Java 虚拟机是全局的。并发线程不能各自获取同一个同一个文件的锁。如果另一个线程已持有相同文件或重叠范围的锁，`lock`\
  \ 和 `tryLock` 方法将抛出 `OverlappingFileLockException`。\n* 在某些系统中，关闭通道会释放底层文件上的所有锁。因此，你应该避免在同一个锁定文件上使用多个通道。\n\
  * 在网络文件系统上锁定文件高度取决于系统，应该尽量避免。\n* 文件锁定仅对 Java 程序有保证。用其他语言编写的程序可能使用不同且不兼容的锁定机制。\n\n\
  Listing 2.4 中的程序展示了文件锁定的一个简单示例。多个用户想要在一个公共文件中注册他们的密码。程序读取文件，添加用户名和哈希后的密码，然后写入生成的文件。确保这种更新是原子的是至关重要的。否则，如果两个用户并发更新该文件，密码文件可能会损坏。\n\
  \n参见 第 9 章 了解更多关于密码哈希的信息。这与文件锁定无关，但我不想展示一个保存未哈希化密码的示例程序。\n\n该程序展示了文件锁定 API 的局限性。它紧密于\
  \ `FileChannel` API，而该 API 是基于字节缓冲的读写。程序必须将那些字节缓冲区转换为读取器和写入器。\n\n另一种替代方案是使用 `RandomAccessFile`，其\
  \ `getChannel` 方法会产生一个指向文件的通道。但同样不方便。你需要将文件读取到字节数组中，并准备一个字节数组来写入修改后的文件。\n\nListing\
  \ 2.4 v2ch02/fileLock/FileLockDemo.java\n\n```\npackage v2ch02.fileLock;\n\nimport\
  \ module java.base;\n\n/**\n * 此程序将用户名和密码写入 passwords.properties 文件。该文件是\n * 原子化更新的。在\
  \ Linux 下，尝试 \n * for f in $(seq 1 100) ; do (java fileLock.FileLockDemo user$f\
  \ secret$f &) ; done \n * 当所有 Java 进程结束后，passwords.properties\n * 为其中每个进程都有一个条目。\n\
  \ */\n\npublic class FileLockDemo {\n    void main(String[] args) throws Exception\
  \ {\n        Path path = Path.of(\"password.properties\");\n        FileChannel\
  \ channel = FileChannel.open(path, StandardOpenOption.READ,\n                StandardOpenOption.WRITE,\
  \ StandardOpenOption.CREATE);\n        try (FileLock _ = channel.lock()) {\n   \
  \         // 从文件读取字节\n            ByteBuffer readBuffer = ByteBuffer.allocate((int)\
  \ channel.size());\n            channel.read(readBuffer);\n\n            // 从字节中读取属性\n\
  \            Reader in = new StringReader(new String(readBuffer.array()));\n   \
  \         Properties props = new Properties();\n            props.load(in);\n\n\
  \            // 从参数或用户输入获取用户名、密码\n            String username;\n            char[]\
  \ password;\n            if (args.length >= 2) {\n                username = args[0];\n\
  \                password = args[1].toCharArray();\n            }\n            else\
  \ {\n                Console console = System.console();\n                username\
  \ = console.readLine(\"User name: \");\n                password = console.readPassword(\"\
  Password: \");\n            }\n\n            // 哈希密码\n            final int ITERATIONS\
  \ = 210_000;\n            final int SALT_BYTES = 16;\n            final int HASH_BYTES\
  \ = 32;\n            SecureRandom random = new SecureRandom();\n            byte[]\
  \ salt = new byte[SALT_BYTES];\n            random.nextBytes(salt);\n\n        \
  \    PBEKeySpec spec = new PBEKeySpec(password, salt, ITERATIONS, 8 * HASH_BYTES);\n\
  \            SecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2HmacSHA256\"\
  );\n            byte[] hash = skf.generateSecret(spec).getEncoded();\n         \
  \   Base64.Encoder encoder = Base64.getEncoder();\n\n            // 将用户名和哈希密码放入属性\n\
  \            props.put(username, ITERATIONS + \"|\" + encoder.encodeToString(salt)\
  \ + \"|\"\n                    + encoder.encodeToString(hash));\n\n            //\
  \ 将属性写入字节\n            StringWriter out = new StringWriter();\n            props.store(out,\
  \ null);\n            byte[] outBytes = out.toString().getBytes();\n\n         \
  \   // 将字节写入文件\n            channel.truncate(0);\n            ByteBuffer writeBuffer\
  \ = ByteBuffer.wrap(outBytes);\n            channel.write(writeBuffer);\n      \
  \  }\n    }\n}\n```\n\n`java.nio.channels.FileChannel`1.4\n\n* `lock()`\n\n    获取整个文件的排他锁。此方法会阻塞直到锁可用。\n\
  * `tryLock()`\n\n    获取整个文件的排他锁，或者在锁不可用时返回 `null`。\n* `lock(long position, long\
  \ size, boolean shared)`\n\n* `tryLock(long position, long size, boolean shared)`\n\
  \n    获取文件区域的锁。第一个方法阻塞直到获取锁，第二个方法在锁不可用时返回 `null`。参数 `shared` 为 `true` 表示共享锁，为 `false`\
  \ 表示排他锁。\n* `truncate(long size)`\n\n    如果文件大于给定大小，则将其截断为该大小。\n\n`java.nio.channels.FileLock`1.4\n\
  \n* `close()`\n\n    释放此锁。\n\n`java.io.RandomAccessFile`1.0\n\n* `getChannel()`\n\
  \n    产生指向此随机访问文件的通道。\n\n\n\n\n\n在 Section 2.1.7 和 Section 2.2.2 中，你已经了解了如何以文本或二进制格式存储\
  \ `Employee` 对象。然而，你在面向对象的程序中创建的对象很少全都是同一种类型。例如，你可能有一个名为 `staff` 的数组，它名义上是一个 `Employee`\
  \ 记录数组，但其中包含的对象实际上是 `Manager` 等子类的实例。\n\n完全可以设计出允许你存储此类多态集合的数据格式——但幸运的是，我们不必这样做。Java\
  \ 语言支持一种非常通用的机制，称为`对象序列化`，它可以将任何对象写入输出流并在稍后再次读取它。（你将在后续章节中看到“序列化”一词的来源。）\n\n###\
  \ 2.6.1 保存和加载可序列化对象\n\n要保存对象数据，你首先需要打开一个 `ObjectOutputStream` 对象：\n\n```\nvar out\
  \ = new ObjectOutputStream(new FileOutputStream(\"employee.dat\"));\n```\n\n现在，要保存一个对象，只需像下面的代码片段那样使用\
  \ `ObjectOutputStream` 类的 `writeObject` 方法即可：\n\n```\nvar harry = new Employee(\"\
  Harry Hacker\", 50000, 1989, 10, 1);\nvar boss = new Manager(\"Carl Cracker\", 80000,\
  \ 1987, 12, 15);\nout.writeObject(harry);\nout.writeObject(boss);\n```\n\n要将对象读回，首先获取一个\
  \ `ObjectInputStream` 对象：\n\n```\nvar in = new ObjectInputStream(new FileInputStream(\"\
  employee.dat\"));\n```\n\n然后，使用 `readObject` 方法按照写入时的相同顺序检索对象：\n\n```\nvar e1 =\
  \ (Employee) in.readObject();\nvar e2 = (Employee) in.readObject();\n```\n\n然而，对于任何想要保存到输出流并从对象输入流中恢复的类，你需要进行一个更改。该类必须实现\
  \ `Serializable` 接口：\n\n```\nclass Employee implements Serializable { . . . }\n\
  ```\n\n`Serializable` 接口没有方法，因此你不需要以任何方式更改你的类。在这方面方面，它与我们在第一卷第 6 章中讨论过的 `Cloneable`\
  \ 接口相似。但是，要使类可克隆，你仍然需要覆盖 `Object` 类的 `clone` 方法。而要使类可序列化，你不需要做其他操作。\n\n你只能使用 `writeObject/readObject`\
  \ 方法读写对象。对于基本类型值，请使用如 `writeInt/readInt` 或 `writeDouble/readDouble` 等方法。（对象输入/输出流类实现了\
  \ `DataInput/DataOutput` 接口。）\n\n在背后，`ObjectOutputStream` 会查看对象的所有字段并保存它们的内容。例如，在写入\
  \ `Employee` 对象时，姓名、日期和薪水字段会被写入输出流。\n\n然而，有一个重要的情况需要考虑：当一个对象作为多个对象状态的一部分被共享时，会发生什么？\n\
  \n为了说明这个问题，让我们对 `Manager` 类进行微调。让我们怀旧地假设，每个经理都有一个秘书：\n\n```\nclass Manager extends\
  \ Employee {\n    private Employee secretary;\n    . . .\n}\n```\n\n每个 `Manager`\
  \ 对象现在包含一个指向秘书的 `Employee` 对象的引用。当然，两个经理可以共享同一个秘书，正如 #ch01fig06 和下面的代码所示：\n\n```\n\
  var harry = new Employee(\"Harry Hacker\", . . .);\nvar carl = new Manager(\"Carl\
  \ Cracker\", . . .);\ncarl.setSecretary(harry);\nvar tony = new Manager(\"Tony Tester\"\
  , . . .);\ntony.setSecretary(harry);\n```\n\n图 2.6：两个经理可以共享同一个员工。\n\n保存这样的对象网络是一个挑战。当然，我们无法保存和恢复秘书对象的内存地址。当对象被重新加载时，它占据的内存地址可能与原始完全不同。\n\
  \n相反，每个对象在保存时都带有一个`序列号`——这就是该机制被称为`对象序列化`的原因。算法如下：\n\n1. 为你遇到的每个对象引用关联一个序列号（如 #ch01fig07\
  \ 所示）。\n\n   图 2.7：对象序列化的示例\n\n2. 当第一次遇到对象引用时，将对象数据写入输出流。\n\n3. 如果之前保存过，则只需写入“与之前保存的序列号为\
  \ `x` 的对象相同”。\n\n在读回对象时，过程是反的。\n\n1. 当对象输入流中第一次指定某个对象时，构造它，使用流数据对其进行初始化，并记住序列号与对象引用之间的关联。\n\
  \n2. 当遇到“与之前保存的序列号为 `x` 的对象相同”标签时，检索该序列号的对象引用。\n\n在本章中，我们将使用序列化将对象集合保存到磁盘文件，并完全按照我们存储的方式检索它。另一个非常重要的应用是跨网络传输对象集合。\n\
  \n如果可序列化类的父类不是可序列化的，则它必须有一个可访问的无参构造函数。考虑这个例子：\n\n```\nclass Person // 不序列化\nclass\
  \ Employee extends Person implements Serializable\n```\n\n当 `Employee` 对象反序列化时，其实例字段是从流中读取的，但\
  \ `Person` 的实例字段是由 `Person` 构造函数设置的。2.5 是一个保存并加载 `Employee` 和 `Manager` 对象网络（其中某些共享同一个员工作为秘书）的程序。注意，重新加载后，秘书对象是唯一的——当\
  \ `newStaff[1]` 获得加薪时，这反映在经理的 `secretary` 字段中。\n\n列表 2.5 v2ch02/serial/ObjectDemo.java\n\
  \n```\npackage v2ch02.serial;\n\nimport module.base;\n\nclass ObjectDemo {\n   \
  \ void main() throws Exception {\n        var harry = new Employee(\"Harry Hacker\"\
  , 50000, 1989, 10, 1);\n        var carl = new Manager(\"Carl Cracker\", 80000,\
  \ 1987, 12, 15);\n        carl.setSecretary(harry);\n        var tony = new Manager(\"\
  Tony Tester\", 40000, 1990, 3, 15);\n        tony.setSecretary(harry);\n\n     \
  \   var staff = new Employee[3];\n\n        staff[0] = carl;\n        staff[1] =\
  \ harry;\n        staff[2] = tony;\n\n        // 将所有员工记录保存到文件 employee.ser\n   \
  \     try (var out = new ObjectOutputStream(new FileOutputStream(\"employee.ser\"\
  ))) {\n            out.writeObject(staff);\n        }\n\n        try (var in = new\
  \ ObjectInputStream(new FileInputStream(\"employee.ser\"))) {\n            // 将所有记录检索到一个新数组\n\
  \n            var newStaff = (Employee[]) in.readObject();\n\n            // 给秘书加薪\n\
  \            newStaff[1].raiseSalary(10);\n\n            // 打印新读取的员工记录\n       \
  \     for (Employee e : newStaff)\n                IO.println(e);\n        }\n \
  \   }\n}\n```\n\njava.io.ObjectOutputStream`1.1\n\n*   `ObjectOutputStream(OutputStream\
  \ out)`\n\n    创建一个 `ObjectOutputStream`以便将对象写入指定的 `OutputStream`。\n\n*   `void\
  \ writeObject(Object obj)`\n\n    将指定的对象写入 `ObjectOutputStream`。此方法保存了对象的类、类的签名以及该类及其父类中任何非静态、非瞬态字段的值。\n\
  \n`java.io.ObjectInputStream`1.1\n\n*   `ObjectInputStream(InputStream in)`\n\n\
  \    创建一个 `ObjectInputStream`以便从指定的 `InputStream` 读回对象信息。\n\n\n\n\n* `Object readObject()`\n\
  \n从 `ObjectInputStream` 中读取一个对象。特别是，此方法会读回对象的类、类的签名以及该类及其所有父类的非传输（nontransient）和非静态（nonstatic）字段的值。它执行反序列化，以便可以恢复多个对象引用。\n\
  \n### 2.6.2. 理解对象序列化文件格式\n\n对象序列化以特定的文件格式保存对象数据。当然，你可以直接使用 `writeObject`/`readObject`\
  \ 方法，而无需知道表示文件中对象的精确字节序列。尽管如此，我们发现研究数据格式对于深入理解对象序列化过程非常有帮助。由于细节具有某种技术性，如果你对实现不感兴趣，可以随时跳过本节。\n\
  \n每个文件都以两个字节的“魔数”开始：\n\n```\nAC ED\n```\n\n随后是对象序列化格式的版本号，目前为：\n\n```\n00 05\n```\n\
  \n（在本节中，我们始终使用十六进制数表示字节。）然后，它包含按照保存顺序的一系列对象。\n\nString 对象的保存方式为：\n\n* `74`\n* 两个字节长度\n\
  * “修改后的 UTF-8”格式的字符\n\n例如，字符串“Harry”被保存为：\n\n```\n74 00 05 Harry\n```\n\n当保存一个对象时，该对象的类也必须被保存。类描述符具有以下格式：\n\
  \n* `72`\n* 类名的 2 字节长度\n* 类名\n* 8 字节指纹\n* 1 字节标志\n* 2 字节实例字段描述符计数\n* 实例字段描述符\n*\
  \ `78`（结束标记）\n* 父类描述符（若无则为 `70`）\n\n指纹是通过对类、父类、接口、字段类型和方法签名的描述以标准方式进行排序，然后对该数据应用安全哈希算法版本\
  \ 1（`SHA-1`）得到的。\n\nSHA-1 提供了一个数据块的“指纹”。无论原始数据的大小如何，该指纹始终是一个 20 字节的数据包。它是通过对数据进行一系列巧妙的位操作创建的，这使得如果信息发生任何更改，指纹极有可能发生变化。序列化机制仅使用\
  \ SHA-1 代码的前八字节作为类的指纹。如果实例字段或方法发生变化，类指纹极有可能发生变化。\n\n读取对象时，会将其指纹与类的当前指纹进行比较。如果它们不匹配，意味着类定义在对象写入后发生了变化，并将生成一个异常。当然，在实践中，类会演进，程序可能需要读取旧版本的对象。我们将在第\
  \ 2.6.7 节 中讨论这一点。\n\n标志字节由 `java.io.ObjectStreamConstants` 中定义的位掩码组成，见表 2.7。\n\n\
  表 2.7：位掩码\n\n|  own | 值 | 描述 |\n| --- | --- | --- |\n| `SC_WRITE_METHOD` | 1 | 类定义了\
  \ `writeObject` 方法。 |\n| `SC_SERIALIZABLE` | 2 | 类实现了 `Serializable` 接口。 |\n| `SC_EXTERNALIZABLE`\
  \ | 4 | 类实现了 `Externalizable` 接口。 |\n| `SC_BLOCK_DATA` | 8 | 作为“块数据”写入的不透明数据（自 JDK\
  \ 1.2 起默认）。 |\n| `SC_ENUM` | 16 | 类是一个枚举。 |\n\n我们编写的类实现了 `Serializable` 接口，其标志位值为\
  \ `02`。可序列化的 `java.util.Date` 类的标志位为 `03`，因为它定义了自己的 `writeObject` 方法（见第 2.6.4 节）。我们将在第\
  \ 2.6.5 节 中讨论 `Externalizable` 接口。\n\n每个实例字段描述符的格式为：\n\n* 1 字节类型代码\n* 字段名的 2 字节长度\n\
  * 字段名\n* 类名（如果字段是对象）\n\n类型代码是以下内容之一：\n\n| `B` | `byte` |\n| `C` | `char` |\n| `D`\
  \ | `double` |\n| `F` | `float` |\n| `I` | `int` |\n| `J` | `long` |\n| `L` | object\
  \ |\n| `S` | `short` |\n| `Z` | `boolean` |\n| `[` | array |\n\n当类型代码为 `L` 时，字段名后面是字段类型。类名和字段名字符串不以代码\
  \ `74` 开头，但字段类型是。字段类型对其名称使用略有不同的编码——即原生方法使用的格式。\n\n例如，`Employee` 类的 `salary` 字段编码为：\n\
  \n```\nD 00 06 salary\n```\n\n以下是 `Employee` 类的完整类描述符，包含在我们示例程序的 `serial` 包中：\n\n\
  | | |\n| --- | --- |\n| `72 00 0F serial.Employee` | |\n| `74 1E C8 E6 C3 F8 B8\
  \ 77` | |\n| `40 05 D6 7E 3B BB F2 50 02` | |\n| `00 00` | |\n| `00 00` | |\n| `00\
  \ 06` | |\n| `00 07` | |\n| `00 12` | |\n| `00 04` | |\n| `00 08` | |\n| `00 00\
  \ 00 03` | |\n\n（注：上述表格根据提供的碎片化文本重构的）\n\n\n\n我们已经看到，任何给定的类的全完整的类描述符只会出现一次。随后的描述符会引用它。例如，在我们上一个示例中，对\
  \ `Date` 类的重复引用被编码为：\n\n```\n71 00 7E 00 08\n```\n\n对象也使用了相同的机制。如果写入了对之前保存过的对象的引用，它将以完全相同的方式被保存——即\
  \ `71` 后跟序列号。从上下文中总是清楚地看出特定的序列引用表示的是类描述符还是一个对象。\n\n某些类（例如 `Date` 类）将对象状态存储在一个不透明的二进制块中，编码如下：\n\
  \n* `77`（短块）或 `7A`（长块）\n* 1 字节或 4 字节的块长度\n* 块内容\n* `78`\n\n最后，空引用存储为：\n\n```\n70\n\
  ```\n\n这里是前一节中 `ObjectStreamDemo` 程序带有注释的输出。运行该程序，查看其数据文件 `employee.ser` 的十六进制转储，并将其与带注释的列表进行比较。最重要的行位于输出的末尾。它们显示了对之前保存过的对象的引用。\n\
  \n| 十进制 | 描述 |\n| :--- | :--- |\n| `AC ED 00 05` | 文件头 |\n| `75` | 数组 `staff`（序列号\
  \ #1） |\n| `72 00 12 [Lserial.Employee;` | 新类，字符串长度，类名 `Employee[]`（序列号 #0） |\n\
  | `40 05 D6 7E 3B BB F2 50 02` | 指纹和标志 |\n| `00 00` | 实例字段数量 |\n| `78` | 结束标记 |\n\
  | `70` | 无超类 |\n| `00 00 00 03` | 数组项数 |\n| `73` | `staff[0]`—新对象（序列号 #7） |\n| `72\
  \ 00 0E serial.Manager` | 新类，字符串长度，类名（序列号 #2） |\n| `2F FF 1F 1D E8 7A A9 74 02`\
  \ | 指纹和标志 |\n| `00 01` | 实例字段数量 |\n| `L 00 09 secretary` | 实例字段类型和名称 |\n| `74 00\
  \ 11 Lserial/Employee;` | 实例字段类名：`String`（序列号 #3） |\n| `78` | 结束标记 |\n| `72 00 0F\
  \ serial.Employee` | 超类：新类，字符串长度，类名（序列号 #4） |\n| `74 1E C8 E6 C3 F8 B8 77 02` |\
  \ 指纹和标志 |\n| `00 03` | 实例字段数量 |\n| `D 00 06 salary` | 实例字段类型和名称 |\n| `L 00 07 hireDay`\
  \ | 实例字段类型和名称 |\n| `74 00 10 Ljava/util/Date;` | 实例字段类名：`String`（序列号 #5） |\n| `L\
  \ 00 04 name` | 实例字段类型和名称 |\n| `74 00 12 Ljava/lang/String;` | 实例字段类名：`String`（序列号\
  \ #6） |\n| `78` | 结束标记 |\n| `70` | 无超类 |\n| `40 F3 88 00 00 00 00 00` | `salary`\
  \ 字段值：`double` |\n| `73` | `hireDay` 字段值：新对象（序列号 #9） |\n| `72 00 0E java.util.Date`\
  \ | 新类，字符串长度，类名（序列号 #8） |\n| `68 6A 81 01 4B 59 74 19 03` | 指纹和标志 |\n| `00 00` |\
  \ 无实例字段 |\n| `78` | 结束标记 |\n| `70` | 无超类 |\n| `77 08` | 外部存储，字节数 |\n| `00 00 00\
  \ 83 E7 4B 7D 80` | 不透明字节 |\n| `78` | 结束标记 |\n| `74 00 0C Carlacker` | `name` 字段值：`String`（序列号\
  \ #10） |\n| `73` | `secretary` 字段值：新对象（序列号 #11） |\n| `71 00 7E 00 04` | 现有类（使用序列号\
