  \n```java\npackage v2ch12.tableCellRender;\n\nimport module java.desktop;\n\n/**\n\
  \ * 此编辑器弹出颜色对话框以编辑单元格值。\n */\npublic class ColorTableCellEditor extends AbstractCellEditor\
  \ implements TableCellEditor {\n    private JColorChooser chooser;\n    private\
  \ JDialog dialog;\n    private JPanel panel;\n\n    public ColorTableCellEditor()\
  \ {\n        // 准备颜色\n        panel = new JPanel();\n        chooser = new JColorChooser();\n\
  \    }\n\n    public Component getTableCellEditorComponent(JTable table, Object\
  \ value,\n            boolean isSelected, int row, int column) {\n        // 在这里获取当前的颜色值\n\
  \        chooser.setColor((Color) value);\n        return panel;\n    }\n\n    public\
  \ boolean shouldSelectCell(EventObject anEvent) {\n        // 开始编辑\n        dialog.setVisible(true);\n\
  \n        // 允许选择此单元格\n        return true;\n    }\n\n    public void cancelCellEditing()\
  \ {\n        // 取消编辑--隐藏对话框\n        dialog.setVisible(false);\n        super.cancelCellEditing();\n\
  \    }\n\n    public boolean stopCellEditing() {\n        // 编辑完成--隐藏对话框\n     \
  \   dialog.setVisible(false);\n        super.stopCellEditing();\n\n        // 允许使用颜色值\n\
  \        return true;\n    }\n\n    public Object getCellEditorValue() {\n     \
  \   return chooser.getColor();\n    }\n}\n```\n\n\n\n\n开始编辑过程。如果编辑后的单元格应该被**选中**，则返回\
  \ `true`。通常情况下，你希望返回 `true`，但如果你不希望编辑过程改变单元格的选择，则可以返回 `false`。\n\n*   `void cancelCellEditing()`\n\
  \    取消编辑过程。你可以放弃部分编辑内容。\n\n*   `boolean stopCellEditing()`\n    停止编辑过程，并意图使用结果。如果编辑后的值处于可检索的正确，则返回\
  \ `true`。\n\n*   `Object getCellEditorValue()`\n    返回编辑后的结果。\n\n*   `void addCellEditorListener(CellEditorListener\
  \ l)`\n*   `void removeCellEditorListener(CellEditorListener l)`\n    添加或移除强制单元格编辑器监听器。\n\
  \n## 12.4. 树\n\n每个工作过分层文件系统的计算机用户都见过树形显示。当然，目录和文件只是许多树形组织结构的例子之一。日常生活中存在许多树形结构，例如图\
  \ 12.11 中所示的国家、州和城市的层级结构。\n\n.图 12.11: 国家、州和城市的层级结构。\n\n作为程序员，我们经常需要显示树形结构。幸运的是，Swing\
  \ 库有一个为此设计的 `JTree` 类。`JTree` 类（同它的辅助类）负责树的布局以及处理用户展开和折叠节点的请求。在本节，你将学习如何使用 `JTree`\
  \ 类。\n\n与其他复杂的 Swing 组件一样，我们必须关注常见且实用的情况，无法涵盖每一个细节。如果你想实现某些不常的功能，我们建议参考 David M.\
  \ Geary 写的 *Graphic Java^™, Third Edition* 或 Kim Topley 写的 *Core Swing*。\n\n在继续之前，让我们先确定一些术语（参见图\
  \ 12.12）。`tree`（树）由`nodes`（节点）组成。每个节点要么是`leaf`（叶节点），要么拥有子节点。除了根节点外，每个节点恰好有一个`parent`（父节点）。树只有一个根节点。有时你拥有一组树，每棵树都有自己的根节点。这样的集合被称为`forest`（森林）。\n\
  \n.图 12.12: 树术语。\n\n### 12.4.1. 简单树\n\n在第一个示例程序中，我们将简单地显示一个包含几个节点的树（参见图 12.14）。与其他许多\
  \ Swing 组件一样，你需要提供一个数据模型，由组件为你显示它。要构造一个 `JTree`，可以在构造函数中提供树模型：\n\n```\nTreeModel\
  \ model = . . .;\nvar tree = new JTree(model);\n```\n\n还有一些从元素集合中构造树的构造函数：\n\n```\n\
  JTree(Object[] nodes)\nJTree(Vector<?> nodes)\nJTree(Hashtable<?, ?> nodes) // 值变为节点\n\
  ```\n\n这些构造函数并不好用。它们只是构建了一个树森林，每棵树只有一个节点。第三个构造函数似乎特别没用，因为节点按照键的哈希值决定的看似随机的顺序出现。\n\
  \n如何获取树模型？你可以通过创建一个实现 `TreeModel` 接口的类来构建自己的模型。你将在本章稍后的部分看到如何这样做。现在，我们将坚持 Swing\
  \ 库提供的 `DefaultTreeModel`。\n\n要构造默认树模型，你必须提供一个根节点。\n\n```\nTreeNode root = . . .;\n\
  var model = new DefaultTreeModel(root);\n```\n\n`TreeNode` 是另一个接口。用实现该接口的任意类填充默认树模型。现在，我们将使用\
  \ Swing 提供的具体节点类——即 `DefaultMutableTreeNode`。该类实现了 `MutableTreeNode` 接口，它是 `TreeNode`\
  \ 的子接口（参见图 12.13）。\n\n.图 12.13: 树类。\n\n默认变树节点持有一个对象——用户对象。树渲染所有节点的用户对象。除非你指定渲染器，否则树将显示\
  \ `toString` 方法的结果字符串。\n\n在我们的第一个示例中，我们使用字符串作为用户对象。在实践中，你通常会用更有表现力的用户对象填充树。例如，在显示目录树时，使用\
  \ `File` 对象作为节点是有意义的。\n\n你可以在构造函数中指定用户对象，也可以稍后用 `setUserObject` 方法设置它。\n\n```\n\
  var node = new DefaultMutableTreeNode(\"Texas\");\n. . .\nnode.setUserObject(\"\
  California\");\n```\n\n接下来，你需要建立节点之间的父/子关系。从根节点开始，使用 `add` 方法添加子节点：\n\n```\nvar\
  \ root = new DefaultMutableTreeNode(\"World\");\nvar country = new DefaultMutableTreeNode(\"\
  USA\");\nroot.add(country);\nvar state = new DefaultMutableTreeNode(\"California\"\
  );\ncountry.add(state);\n```\n\n图 12.14 展示了树的样貌。\n\n![Figure](img/fig06-18.jpg)图\
  \ 12.14: 一棵简单的树。\n\n以这种方式连接所有节点。然后，用根节点构造一个 `DefaultTreeModel`。最后，用根节点构造一个 `JTree`。\n\
  \n```\nvar treeModel = new DefaultTreeModel(root);\nvar tree = new JTree(treeModel);\n\
  ```\n\n或者作为快捷方法，你可以直接将根节点传递给 `JTree`：\n\n```\nvar tree = new JTree(root);\n```\n\
  \n列表 12.8 包含了代码。\n\nListing 12.8 v2ch12/tree/SimpleTreeFrame.java\n\n```\npackage\
  \ v2ch12.tree;\n\nimport java.desktop;\n\n/**\n * 此框架包含一个手动构建并显示的简单树。\n */\nclass\
  \ SimpleTreeFrame extends JFrame {\n    private static final int DEFAULT_WIDTH =\
  \ 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n    public SimpleTreeFrame()\
  \ {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 设置模型数据\n\n  \
  \      var root = new DefaultMutableTreeNode(\"World\");\n        var country =\
  \ new DefaultMutableTreeNode(\"USA\");\n        root.add(country);\n        var\
  \ state = new DefaultMutableTreeNode(\"California\");\n        country.add(state);\n\
  \        var city = new DefaultMutableTreeNode(\"San Jose\");\n        state.add(city);\n\
  \        city = new DefaultMutableTreeNode(\"Cupertino\");\n        state.add(city);\n\
  \        state = new DefaultMutableTreeNode(\"Michigan\");\n        country.add(state);\n\
  \        city = new DefaultMutableTreeNode(\"Ann Arbor\");\n        state.add(city);\n\
  \        country = new DefaultMutableTreeNode(\"Germany\");\n        root.add(country);\n\
  \        state = new DefaultMutableTreeNode(\"Schleswig-Holstein\");\n        country.add(state);\n\
  \        city = new DefaultMutableTreeNode(\"Kiel\");\n        state.add(city);\n\
  \n        // 构造树并放入滚动面板\n\n        var tree = new JTree(root);\n        add(new\
  \ JScrollPane(tree));\n    }\n}\n```\n\n当你运行程序时，树起初看起来如图 12.15。只有根节点及其子节点可见。点击圆形图标（句柄）来展开子树。从句柄伸出的线在子树折叠时指向右侧，在子树展开时向下（参见图\
  \ 12.16）。\n\n![Figure](img/fig06-19.jpg)图 12.15: 树的初始显示![Figure](img/fig06-20.jpg)图\
  \ 12.16: 折叠和展开的子树。\n\n当然，树的显示取决于所选外观（look-and-feel）。我们刚刚描述了 Metal 界面。在 Windows 界面中，句柄具有更熟悉的样式——框中的“`–`”或“`+`”（参见图\
  \ 12.17）。\n\n![Figure](img/fig06-21.jpg)图 12.17: 使用 Windows 外观的树。\n\n\n\n\n\n你可以使用以下魔法咒语来关闭父子节点之间的连接线（参见图\
  \ 12.18）：\n\n```\ntree.putClientProperty(\"JTree.lineStyle\", \"None\");\n```\n\n\
  ![Figure](img/fig06-22.jpg)图 12.18：没有连接线的树\n\n相反，若要确保显示连接线，请使用\n\n```\ntree.putClientProperty(\"\
  JTree.lineStyle\", \"Angled\");\n```\n\n另一种线条样式 `\"Horizontal\"` 在图 12.19 中显示。树的显示方式为仅用水平线分隔根节点的直接子节点。我不太确定这有什么用。\n\
  \n![Figure](img/fig06-23.jpg)图 12.19：具有水平线样式的树\n\n默认情况下，没有用于折叠树根节点的句柄。如果你需要，可以通过调用以下方法添加句柄：\n\
  \n```\ntree.setShowsRootHandles(true);\n```\n\n图 12.20 显示了结果。现在你可以将整棵树折叠为根节点。\n\n\
  ![Figure](img/fig06-24.jpg)图 12.20：具有根句柄的树\n\n相反，你可以完全隐藏根节点。这将会显示一个*森林*——一组树，每棵树都有自己的根节点。你仍然必须将森林中的所有树连接到一个公共根节点；然后使用指令隐藏根节点：\n\
  \n```\ntree.setRootVisible(false);\n```\n\n查看图 12.21。那里似乎有两个根节点，分别标记为“USA”和“Germany”。连接这两个节点的实际根节点被设为不可见。\n\
  \n![Figure](img/fig06-25.jpg)图 12.21：森林\n\n让我们从根节点转向树的叶子节点。注意，叶子节点的图标与其他节点不同（参见图\
  \ 12.22）。\n\n![Figure](img/fig06-26.jpg)图 12.22：叶子和文件夹图标\n\n当显示树时，每个节点都用一个图标绘制。实际上有三种图标：叶子图标、打开的非叶子图标和关闭的非叶子图标。为了简单起见，我们将后两种称为文件夹图标。\n\
  \n节点渲染器需要知道为每个节点应该使用哪种图标。默认情况下，该决策过程如下：如果节点的 `isLeaf` 方法返回 `true`，则使用叶子图标；否则，使用文件夹图标。\n\
  \n`DefaultMutableTreeNode` 类的 `isLeaf` 方法在节点没有子节点时返回 `true`。因此，有子节点的节点获得文件夹图标，没有子节点的节点获得叶子图标。\n\
  \n有时，这种行为并不合适。假设我们在示例树中添加了一个名为“Montana（蒙大拿州）”的节点，但我们不知道应该添加哪些城市。我们不希望该州节点获得叶子图标，因为从概念上说，只有城市才是叶子。\n\
  \n`JTree` 类并不知道哪些节点应该是叶子节点。它询问树模型。如果一个没有子节点的节点自动不是概念上的叶子，你可以要求树模型使用不同的标准来判断叶子属性——即查询“允许子节点”节点属性。\n\
  \n对于那些不应该有子节点的节点，调用\n\n```\nnode.setAllowsChildren(false);\n```\n\n然后，告诉树模型询问“允许子节点”属性的值来判断节点是否应该用叶子图标显示。使用\
  \ `DefaultTreeModel` 类的 `setAsksAllowsChildren` 方法来设置此行为：\n\n```\nmodel.setAsksAllowsChildren(true);\n\
  ```\n\n使用此决策标准后，允许子节点的节点获得文件夹图标，而不允许子节点的节点获得叶子图标。\n\n或者，如果你从根节点构造树，可以在构造函数中提供“询问允许子节点”属性的设置。\n\
  \n```\nvar tree = new JTree(root, true); // 不允许子节点的节点获得叶子图标\n```\n\n### `javax.swing.JTree`\
  \ 1.2\n\n*   `JTree(TreeModel model)`：从树模型构建树。\n*   `JTree(TreeNode root)`\n*  \
  \ `JTree(TreeNode root, boolean asksAllowChildren)`：使用默认树模型构建树，该模型显示根节点及其子节点。\n\
  *   `void setShowsRootHandles(boolean b)`：如果 `b` 为 `true`，则根节点具有用于折叠或展开其子节点的句柄。\n\
  *   `void setRootVisible(boolean b)`：如果 `b` 为 `true`，则显示根节点。否则将其隐藏。\n\n### `javax.swing.tree.TreeNode`\
  \ 1.2\n\n*   `boolean isLeaf()`：如果此节点在概念上是叶子，则返回 `true`。\n*   `boolean getAllowsChildren()`：如果此节点可以有子节点，则返回\
  \ `true`。\n\n### `javax.swing.tree.MutableTreeNode` 1.2\n\n*   `void setUserObject(Object\
  \ userObject)`：设置树节点用于渲染的“用户对象”。\n\n### `javax.swing.tree.TreeModel` 1.2\n\n*  \
  \ `boolean isLeaf(Object node)`：如果此节点在概念上是叶子，则返回 `true`。\n\n### `javax.swing.tree.DefaultTreeModel`\
  \ 1.2\n\n*   `void setAsksAllowsChildren(boolean b)`：如果 `b` 为 `true`，作为叶子显示。\n\n\
  ### `javax.swing.tree.DefaultMutableTreeNode` 1.2\n\n*   `void setAllowsChildren(boolean\
  \ b)`：设置节点是否可以子节点。\n\n### `javax.swing.JComponent` 1.2\n\n*   `void putClientProperty(Object\
  \ key, Object value)`：为组件添加键/值对。\n\n### 12.4.2 编辑树与树路径\n\n在下一个示例中，你将看到如何编辑树。图 12.23\
  \ 显示了用户界面。如果你点击“添加兄弟节点”或“添加子节点”，程序将添加一个新节点。如果你点击“删除”，程序将删除当前选中的节点。\n\n\n\n\n\n```\n\
  var selectedNode = (DefaultMutableTreeNode) tree.getLastSelectedPathComponent();\n\
  ```\n\n此方法没有命名为 `getSelectedNode`，因为树并不知道自己包含节点——它的树模型只处理对象的路径。\n\n树路径是 `JTree`\
  \ 类描述节点的两种方式之一。相当多的 `JTree` 方法接收或返回整数索引——即“行位置”（`row position`）。行位置仅仅是节点在树显示器中的行号（从\
  \ 0 开始）。只有可见的节点才有行号，而且如果该节点之前的节点被展开、折叠或修改，该节点的行号就会发生变化。出于这个原因，你应该避免使用行位置。所有使用行位置的\
  \ `JTree` 方法都有使用树路径的等效方法。\n\n一旦你获取了选中的节点，就可以对其进行编辑。但是，不要简单地向树节点添加子节点：\n\n```\nselectedNode.add(newNode);\
  \ // 不要！\n```\n\n如果你更改了节点的结构，你更改了模型，但关联的视图不会收到通知。你可以自己发送通知，但如果你使用 `DefaultTreeModel`\
  \ 类的 `insertNodeInto` 方法，模型类会处理该问题。例如，下面的调用会将新节点作为所选节点的最后一个子节点，并通知树视图：\n\n```\n\
  model.insertNodeInto(newNode, selectedNode, selectedNode.getChildCount());\n```\n\
  \n相应的调用 `removeNodeFromParent` 会移除一个节点并通知视图：\n\n```\nmodel.removeNodeFromParent(selectedNode);\n\
  ```\n\n如果你保持节点结构不变但更改了用户对象，则应该调用以下方法：\n\n```\nmodel.nodeChanged(changedNode);\n\
  ```\n\n自动通知是使用 `DefaultTreeModel` 的一个主要优势。如果你提供自己的树模型，就必须手动实现自动通知。（详情请参见 Kim Topley\
  \ 编写的 *Core Swing*。）\n\n`DefaultTreeModel` 类有一个 `reload` 方法，可以重新加载整个模型。但是，不要仅仅在做了一些少量更改后就调用\
  \ `reload` 来更新树。当树重新生成时，根节点之外的所有节点都会再次被折叠。如果用户在每次更改后都必须反复展开树，对他们来说将非常困扰。\n\n当视图收到结构变化的通知时，它会更新显示，但不会自动展开节点以显示新添加的子节点。特别是，如果我们示例程序中的用户为一个当前处于折叠状态的节点添加新子节点，新节点将静静地添加到折叠的子树中。这使得用户无法获得任何命令已实际执行的反馈。在这种情况下，你应该特意展开所有父节点，以便新添加的节点变得可见。使用\
  \ `JTree` 类的 `makeVisible` 方法来实现此目的。`makeVisible` 方法期望一个指向应显示节点的树路径。\n\n因此，你需要构建一个从根到新插入节点的树路径。要获取树路径，首先调用\
  \ `DefaultTreeModel` 类的 `getPathToRoot` 方法。它返回一个包含从节点到根节点所有节点的 `TreeNode[]` 数组。将该数组传递给\
  \ `TreePath` 构造函数。\n\n例如，以下让新节点可见的方法：\n\n```\nTreeNode[] nodes = model.getPathToRoot(newNode);\n\
  var path = new TreePath(nodes);\ntree.makeVisible(path);\n```\n\n有趣的是`DefaultTreeModel`\
  \ 类几乎完全忽略了 `TreePath` 类，尽管它的工作是与 `JTree` 通信。`JTree` 类频繁使用树路径，而且从不使用节点对象的数组。\n\n\
  现在，假设你的树包含在一个滚动面板中。在树节点展开后，新节点可能仍然可见，因为超出了视口。为了解决这个问题，请调用\n\n```\ntree.scrollPathToVisible(path);\n\
  ```\n\n而不是调用 `makeVisible`。此调用会展开路径上的所有节点，并告诉周围的滚动面板将路径末尾的节点滚动到视图中（参见图 12.25）。\n\
  \n![Figure](img/fig06-29.jpg)图 12.25: 滚动面板滚动以显示新节点。\n\n默认情况下，树节点是编辑的。但是，如果你调用：\n\
  \n```\ntree.setEditable(true);\n```\n\n用户只需通过双击、编辑字符串并按回车键即可编辑节点。双击会调用默认单元格编辑器（`default\
  \ cell editor`），它由 `DefaultCellEditor` 类实现（参见图 12.26）。可以使用在讨论表格单元格编辑器时看到的相同过程来安装其他单元格编辑器。\n\
  \n![Figure](img/fig06-30.jpg)图 12.26: 默认单元格编辑器\n\nListing 12.9 显示了树编辑程序的完整源代码。运行程序，添加几个节点，并通过双击进行编辑。观察折叠的节点如何展开以显示已添加的子节点，以及滚动面板如何保持添加的节点在视口内。\n\
  \nListing 12.9 v2ch12/treeEdit/TreeEditFrame.java\n\n\n\n\n\n```java\npackage v2ch12.treeEdit;\n\
  \nimport module java.desktop;\n\n/**\n * 一个包含树和编辑树按钮的帧。\n */\npublic class TreeEditFrame\
  \ extends JFrame {\n    private static final int DEFAULT_WIDTH = 400;\n    private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n    private DefaultTreeModel model;\n\
  \    private JTree tree;\n\n    public TreeEditFrame() {\n        setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n        // 构建树\n\n        TreeNode root = makeSampleTree();\n\
  \        model = new DefaultTreeModel(root);\n        tree = new JTree(model);\n\
  \        tree.setEditable(true);\n\n        // 添加带有树的滚动面板\n\n        var scrollPane\
  \ = new JScrollPane(tree);\n        add(scrollPane, BorderLayout.CENTER);\n\n  \
  \      makeButtons();\n    }\n\n    public TreeNode makeSampleTree() {\n       \
  \ var root = new DefaultMutableTreeNode(\"World\");\n        var country = new DefaultMutableTreeNode(\"\
  USA\");\n        root.add(country);\n        var state = new DefaultMutableTreeNode(\"\
  California\");\n        country.add(state);\n        var city = new DefaultMutableTreeNode(\"\
  San Jose\");\n        state.add(city);\n        city = new DefaultMutableTreeNode(\"\
