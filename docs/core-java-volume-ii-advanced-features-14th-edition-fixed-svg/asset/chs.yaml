  \ 事务\n\n你可以将一组语句组合成一个 `transaction`（事务）。当一切顺利时，该事务可以被 `committed`（提交）——或者，如果其中一个语句发生错误，可以进行\
  \ `rolled back`（回滚），就像这些语句都没有执行过一样。\n\n将语句分组为事务的主要原因是 `database integrity`（数据库完整性）。例如，假设我们想从一个银行账户转账到另一个。此时，同时对一个账户扣款并向另一个账户存款是非常重要的。如果系统在扣除第一个账户但在向另一个账户存款之前失败，则撤销扣款操作。\n\
  \n如果你将更新语句分组到一个事务中，该事务要么完全成功并可以 `committed`（提交），要么在中间某个失败。在这种情况下，你可以执行 `rollback`（回滚），数据库会自动撤销自上一次提交事务以来发生的所有更新影响。\n\
  \n### 5.9.1. 使用 JDBC 编写事务\n\n默认情况下，数据库连接处于 `autocommit mode`（自动提交模式），每个 SQL 语句在执行后立即提交到数据库。一旦语句被提交，你就无法对其进行回滚。关闭此默认设置以便使用事务：\n\
  \n```java\nconn.setAutoCommit(false);\n```\n\n按照通常方式创建一个语句对象：\n\n```java\nStatement\
  \ stat = conn.createStatement();\n```\n\n多次调用 `executeUpdate`：\n\n```java\nstat.executeUpdate(command1);\n\
  stat.executeUpdate(command2);\nstat.executeUpdate(command3);\n. . .\n```\n\n如果所有语句都无错误地执行完毕，调用\
  \ `commit` 方法：\n\n```java\nconn.commit();\n```\n\n然而，如果发生错误，调用：\n\n```java\nconn.rollback();\n\
  ```\n\n然后，自上一次提交以来的所有语句都会自动反转。你通常在事务被 `SQLException` 中断时执行回滚。\n\n### 5.9.2. 保存点\
  \ (Save Points)\n\n对于某些数据库和驱动程序，你可以通过使用 `save points`（保存点）来对回滚过程进行更细粒度的控制。创建保存点标记了一个点，你可以稍后返回该点，而无需放弃整个事务。例如：\n\
  \n```java\nStatement stat = conn.createStatement(); // 开始事务; rollback() 在这里执行\n\
  stat.executeUpdate(command1);\nSavepoint svpt = conn.setSavepoint(); // 设置保存点; rollback(svpt)\
  \ 在这里\nstat.executeUpdate(command2);\n\nif (. . .) conn.rollback(svpt); // 撤销 command2\
  \ 的影响\n. . .\nconn.commit();\n```\n\n当你不再需要保存点时，应该释放它：\n\n```java\nconn.releaseSavepoint(svpt);\n\
  ```\n\n### 5.9.3. 批量更新 (Batch Updates)\n\n假设一个程序需要执行许多 `INSERT` 语句来填充数据库表。你可以通过使用\
  \ `batch update`（批量更新）来提高程序的性能。在批量更新中，一组语句被收集并作为一个批次提交。\n\n使用 `DatabaseMetaData`\
  \ 接口的 `supportsBatchUpdates` 方法来确定你的数据库是否支持此功能。\n\n批次中的语句可以是 `INSERT`、`UPDATE` 或\
  \ `DELETE` 等操作，也可以是如 `CREATE TABLE` 或 `DROP TABLE` 等数据定义语句。如果在批次中添加 `SELECT` 语句，则抛出异常。（从概念上讲，`SELECT`\
  \ 语句在批中没有意义，因为它返回的是结果集而不更新数据库。）\n\n要执行批次，首先按通常方式创建一个 `Statement` 对象：\n\n```java\n\
  Statement stat = conn.createStatement();\n```\n\n现在，不要调用 `executeUpdate`，而是调用 `addBatch`\
  \ 方法：\n\n```java\nString command = \"CREATE TABLE . . .\"\nstat.addBatch(command);\n\
  \nwhile (. . .) {\n    command = \"INSERT INTO . . . VALUES (\" + . . . + \")\"\
  ;\n    stat.addBatch(command);\n}\n```\n\n最后，提交整个批次：\n\n```java\nint[] counts =\
  \ stat.executeBatch();\n```\n\n`executeBatch` 的调用返回所有提交语句的行数数组。\n\n为了在批模式下进行正确的错误处理，请将批量执行视为单个事务。如果批次在中间失败，你想回滚到开始之前的状态。首先关闭自动提交，然后收集批次，执行它，最后恢复自动提交：\n\
  \n```java\nboolean autoCommit = conn.getAutoCommit();\nconn.setAutoCommit(false);\n\
  Statement stat = conn.createStatement();\n. . .\n// keep stat.addBatch(.);\n. .\
  \ .\nstat.executeBatch();\nconn.setAutoCommit(autoCommit);\n```\n\n#### java.sql.Connection\n\
  \n*   `boolean getAutoCommit()`\n*   `void setAutoCommit(boolean b)`\n    获取或设置自动提交模式。如果为\
  \ `true`，所有语句在执行后立即提交。\n*   `void commit()`\n    提交自上一次提交以来的所有语句。\n*   `void rollback()`\n\
  \    撤销自上一次提交以来的所有语句。\n*   `Savepoint setSavepoint()`\n*   `Savepoint setSavepoint(String\
  \ name)`\n    设置无名或命名的保存点。\n*   `void rollback(Savepoint svpt)`\n    回滚到指定的保存点。\n\
  *   `void releaseSavepoint(Savepoint svpt)`\n    释放指定的保存点。\n\n#### java.sql.Savepoint\n\
  \n*   `int getSavepointId()`\n    获取无名保存点的 ID，如果是命名保存点则抛出 `SQLException`。\n*   `String\
  \ getSavepointName()`\n    获取命名保存点的名称，如果是无名保存点则抛出 `SQLException`。\n\n#### java.sql.Statement\n\
  \n*   `void addBatch(String command)`\n    将命令添加到此语句的当前批次中。\n*   `int[] executeBatch()`\n\
  *   `long[] executeLargeBatch()`\n    执行当前批次中的所有命令。返回数组中的每个值对应批次语句之一。如果是非负数，则是行数。如果是\
  \ `SUCCESS_NO_INFO`，表示语句执行成功但行数可用。如果是 `EXECUTE_FAILED`，表示语句失败。\n\n#### java.sql.DatabaseMetaData\n\
  \n*   `boolean supportsBatchUpdates()`\n    如果驱动程序支持批量更新，则返回 `true`。\n\n## 5.9.4.\
