  \ 类的 `setPaint` 方法允许你选择颜色，用于图形上下文上后续的所有绘图操作。例如：\n\n```\n g2.setPaint(Color.RED);\n\
  g2.drawString(\"Warning!\", 100, 100);\n```\n\n你可以填充封闭形状（如矩形或椭圆）的内部。你可以使用 `g2.setPaint(Color.RED);`\
  \ 填充封闭形状。\n\n你可以使用 `g2.fill(rect);` 填充。要设置组件的背景颜色，使用 `Component` 类的 `setBackground`\
  \ 方法。\n\n```\n var component = new MyComponent();\ncomponent.setBackground(Color.PINK);\n\
