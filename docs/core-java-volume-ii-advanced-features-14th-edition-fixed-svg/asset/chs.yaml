  \ |\n| 希腊语 | `el` | 土其语 | `tr` |\n\n表 7.2：常用 ISO 3166-1 国家代码\n\n| 国家 | 代码 | 国家 |\
  \ 代码 |\n| :--- | :--- | :--- | :--- |\n| --- | --- | --- | --- |\n| 奥地利 | `AT` |\
  \ 日本 | `JP` |\n| 比利 | `BE` | 韩国 | `KR` |\n| 加拿大 | `CA` | 荷兰 | `NL` |\n| 中国 | `CN`\
  \ | 挪威 | `NO` |\n| 丹麦 | `DK` | 葡萄牙 | `PT` |\n| 芬兰 | `FI` | 西班牙 | `ES` |\n| 德国 |\
  \ `DE` | 瑞典 | `SE` |\n| 英国 | `GB` | 瑞士 | `CH` |\n| 希腊 | `GR` | 台湾 | `TW` |\n| 爱尔兰\
  \ | `IE` | 土耳其 | `TR` |\n| 意大利 | `IT` | 美国 | `US` |\n\n语言和国家的代码似乎有些随机，因为其中一些源自本地语言。德语在德语里是\
  \ Deutsch，中文在中文里是 zhongwen：因此是 `de` 和 `zh`。瑞士是 `CH`，源自拉丁术语 Helvetica。区域设置由标签（tags）描述——即由区域设置元素组成的连字符字符串，如\
  \ `en-US`。在德国，你会使用区域设置 `de-DE`。瑞士有四种官方语言（德语、法语、意大利语和罗马语）。瑞士的德语使用者会使用区域设置 `de-CH`。该区域设置使用德语的规则，但货币值使用瑞士法而非欧元。\n\
  \n如果你只指定语言，例如 `de`，那么该区域设置将无法用于特定国家的问题（如货币）。你可以从像这样的标签字符串构造一个 `Locale` 对象：\n\n```\n\
  Locale usEnglish = Locale.forLanguageTag(\"en-US\");\n```\n\n在仅指定语言或语言和国家的常见情况下，你可以使用\
  \ `Locale.of` 工厂方法：\n\n```\nLocale german = Locale.of(\"de\");\nLocale swissGerman\
  \ = Locale.of(\"de\", \"CH\");\n```\n\n`toLanguageTag` 方法产生给定区域设置的语言标签。例如，`Locale.US.toLanguageTag()`\
  \ 是字符串 `\"en-US\"`。为了方便起见，为不同的国家预定义的区域设置对象：\n\n```\nLocale.CANADA\nLocale.CANADA_FRENCH\n\
  Locale.CHINA\nLocale.FRANCE\nLocale.GERMANY\nLocale.ITALY\nLocale.JAPAN\nLocale.KOREA\n\
  Locale.PRC\nLocale.TAIWAN\nLocale.UK\nLocale.US\n```\n\n一些预定义的区域设置仅指定语言而不指定位置：\n\
  \n```\nLocale.CHINESE\nLocale.ENGLISH\nLocale.FRENCH\nLocale.GERMAN\nLocale.ITALIAN\n\
  Locale.JAPANESE\nLocale.KOREAN\nLocale.SIMPLIFIED_CHINESE\nLocale.TRADITIONAL_CHINESE\n\
  ```\n\n`Locale.ROOT` 具有语言中立规则，可以用于机器处理。最后，静态 `getAvailableales` 方法返回虚拟机所有知的区域设置数组。`availableLocales`\
  \ 方法返回一个流。你可以通过 `Locale.getISanguages()` 获取所有语言代码，通过 `Locale.getountries()` 获取所有国家代码。\n\
  \n\n\n\n\n打印\n\n```\nDeutsch (Schweiz)\n```\n\n此示例展示了为什么你需要 `Locale` 对象。你将它们传递给感知区域的方法（locale-aware\
  \ methods），这些方法会生成面向不同位置用户的文本。你将在后续章节中看到许多此类示例。\n\n即使是是将字符串转换为小写或大写这种普通的操作，也可能是特定区域的。例如，在土耳其区域设置，字母\
  \ `I` 的小写是不带点的 `ı`。那些试图通过将字符串存储为小写来规范化字符串的程序在土耳其客户那里莫名其妙地失败了，因为那里 `I` 和带点的 `i` 没有相同的小写版本。始终使用带有\
  \ `Locale` 参数的 `toUpperCase` 和 `toLowerCase` 变体是一个好习惯。例如，尝试一下：\n\n```java\nString\
  \ command = \"QUIT\".toLowerCase(Locale.of(\"tr\"));\n    // \"quıt\" 带有不带点的 ı\n\
  ```\n\n当然，在土耳其，`Locale.getDefault()` 返回的就是该区域，因此 `\"QUIT\".toLowerCase()` 不等同于 `\"\
  quit\"`。\n\n如果你想将英语字符串规范化为小写，应该向 `toLowerCase` 方法传递一个英语区域设置。对于语言无关的处理，请使用 `Locale.ROOT`。\n\
  \n你可以显式地为输入输出操作设置区域。\n\n*   当从 `Scanner` 读取数字时，可以使用 `useLocale` 方法设置其区域设置。\n*  \
  \ `String.format` 和 `PrintWriter.printf` 方法具有带有 `Locale` 参数的重载形式。\n\n### `java.util.Locale`\
  \ 1.1\n\n*   `static Locale.of(String language)`19\n*   `static Locale.of(String\
  \ language, String country)`19\n    根据给定的语言和国家创建一个区域设置。\n*   `static Locale forLanguageTag(String\
  \ languageTag)`7\n    创建一个与给定的语言标签对应的区域设置。\n*   `static Locale getDefault()`\n \
  \   返回默认区域设置。\n*   `static void setDefault(Locale newLocale)`\n    设置默认区域设置。\n*\
  \   `String getDisplayName()`\n    返回描述该区域的名称，用当前区域语言表示。\n*   `String getDisplayName(Locale\
  \ inLocale)`\n    返回描述该区域的名称，用给定的区域语言表示。\n*   `String getLanguage()`\n    返回语言代码——一个小写的双字母\
  \ ISO 639 代码。\n*   `String getDisplayLanguage()`\n    返回语言的名称，用当前区域语言表示。\n*   `String\
  \ getDisplayLanguage(Locale inLocale)`\n    返回语言的名称，用给定的区域语言表示。\n*   `String getCountry()`\n\
  \    返回国家代码——一个大写的双字母 ISO 3166 代码。\n*   `static String[] getISOCountries()`\n* \
  \  `static Set<String> getISOCountries(Locale.IsoCountryCode type)`9\n    获取所有双字母国家代码，或所有长度为\
  \ 2、3 或 4 的国家代码。`type` 是枚举常量 `PART1_ALPHA2`、`PART1_ALPHA3` 和 `PART3` 之一。\n*   `String\
  \ getDisplayCountry()`\n    返回国家的名称，用当前区域语言表示。\n*   `String getDisplayCountry(Locale\
  \ inLocale)`\n    返回国家的名称，用给定的区域语言表示。\n*   `String toLanguageTag()`7\n    返回该区域设置的\
  \ IETF BCP 47 语言标签——例如 `\"de-CH\"`。\n*   `String toString()`\n    返回区域设置的描述，语言和国家用下划线分隔（例如\
  \ `\"de_CH\"`）。仅将此方法用于调试。\n\n## 7.2. 数字格式\n\n我已经提到过数字和货币格式化是高度依赖区域设置的。Java 库在 `java.text`\
  \ 包中提供了一组格式化对象，可以格式化和解析数值。\n\n### 7.2.1 格式化数值\n\n按照以下步骤为特定区域格式化数字：\n\n1.  按照前一节所述获取区域设置对象。\n\
  2.  使用“工厂方法”获取格式化对象。\n3.  使用该格式化对象进行格式化和解析。\n\n工厂方法是 `NumberFormat` 类中带有 `Locale`\
  \ 参数的静态方法。共有三个工厂方法：`getNumberInstance`、`getCurrencyInstance` 和 `getPercentInstance`。这些方法分别返回可以格式化和解析数字、货币金额百分比的对象。例如，这里是如何用德语格式化货币值：\n\
  \n```java\nLocale locale = Locale.GERMAN;\nNumberFormat formatter = NumberFormat.getCurrencyInstance(locale);\n\
  double amount = 123456.78;\nString result = formatter.format(amount);\n```\n\n结果是\n\
  \n> 123.456,78 €\n\n注意货币符号是 € 且它位于字符串末尾。此外，注意小数点和小逗号的对调。\n\nJava 12 添加了“紧凑型”格式，包含两种样式：短\
  \ (123K) 和 长 (123 thousand)。以下是获取短样式的方法：\n\n```java\nformatter = NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT);\n```\n\n相反，要读取按照特定区域习惯输入或存储的数字，请使用 `parse` 方法。例如，以下代码解析了用户在文本字段中输入的值。`parse`\
  \ 方法可以处理小数点、逗号以及其他语言的数字。\n\n```java\nTextField inputField;\n. . .\nNumberFormat\
  \ formatter = NumberFormat.getNumberInstance();\n// 获取默认区域设置的格式化器\nNumber input\
  \ = formatter.parse(inputField.getText().strip());\ndouble x = input.doubleValue();\n\
  ```\n\n`parse` 的返回类型是抽象类 `Number`。返回的对象是 `Double` 或 `Long`，取决于解析出的数字是否为浮点数。`Number`\
  \ 类型的对象不会自动拆箱——你不能简单地将 `Number` 赋值给原始类型。相反，请使用 `doubleValue` 或 `intValue`。\n\n如果数字格式不正确，方法将抛出\
  \ `ParseException`。例如，字符串开头的空格是不允许的（调用 `strip` 移除）。然而，字符串中数字后的任何字符都将被简单忽略，因此不会抛出异常。\n\
  \n注意由 `XXXInstance` 工厂方法返回的实例并不是 `NumberFormat`。`NumberFormat` 是一个抽象类，实际的格式化器属于它的某个子类。工厂方法仅知道如何定位属于特定区域的对象。\n\
  \n你可以通过静态方法 `getAvailableLocales` 获取支持的区域设置列表。该方法返回一个可以获取格式化对象的区域设置数组。\n\n你可以使用\
  \ `Scanner` 读取本地化的整数和浮点数。调用 `useLocale` 方法设置其区域设置。\n\n书籍配套代码包含一个 GUI 程序，可以让你尝试数字格式化器（参见图\
  \ 7.1](#index.xhtml_ch05fig01)）。图顶部的组合框包含所有带有数字格式器的区域。你可以在数字、货币和百分比格式化器之间切换。每当你做出选择，文本字段中的数字就会重新格式化。你还可以输入不同的数字并点击\
  \ Parse 按钮调用 `parse` 方法，它会尝试解析你输入的内容。如果输入解析成功，它将传递给 `format` 并显示结果。如果解析失败，文本字段将显示“Parse\
  \ error”消息。\n\n![Figure](img/NumberFormatTest.jpg)图 7.1：`NumberFormatDemo` 程序\n\n\
  Listing 7.1 显示了数字格式探索器的文本版本，稍微更容易理解。\n\n```java\nListing 7.1 v2ch07/numberFormat/NumberFormatDemo2.java\n\
  ```\n\n\n\n\n\n```java\npackage v2ch07.numberFormat;\n\nimport module java.base;\n\
  import v2ch07.util.Choices;\n\n/**\n * 此程序演示了在不同区域下的数字格式化。\n */\nclass NumberFormatDemo2\
  \ {\n    void main() {\n        var locales = (Locale[]) NumberFormat.getAvailableLocales().clone();\n\
  \        Arrays.sort(locales, Comparator.comparing(Locale::getDisplayName));\n \
  \       Locale locale = Choices.choose(locales, Locale::getDisplayName);\n\n   \
  \     var formatters = new LinkedHashMap<NumberFormat, String>();\n        formatters.put(NumberFormat.getNumberInstance(locale),\
  \ \"Number\");\n        formatters.put(NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT),\n                \"Compact Short\");\n        formatters.put(NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.LONG),\n                \"Compact Long\");\n        formatters.put(NumberFormat.getPercentInstance(locale),\
  \ \"Percent\");\n        formatters.put(NumberFormat.getCurrencyInstance(locale),\
  \ \"Currency\");\n        NumberFormat formatter = Choices.choose(formatters);\n\
  \n        String operation = Choices.choose(\"Format\", \"Parse\");\n        if\
  \ (operation.equals(\"Format\")) {\n            double number = Double.parseDouble(\n\
  \                    IO.readln(\"输入一个需要格式化的浮点数: \"));\n            System.out.println(formatter.format(number));\n\
  \        }\n        else {\n            String text = IO.readln(\"输入一个需要解析的浮点数:\
  \ \");\n            try {\n                System.out.println(formatter.parse(text));\n\
  \            }\n            catch (ParseException e) {\n                System.out.println(\"\
  ParseException \" + e.getMessage());\n            }\n        }\n    }\n}\n```\n\n\
  `java.text.NumberFormat` 1.1\n\n*   `static Locale[] getAvailableLocales()`\n  \
  \  返回一个 `Locale` 对象数组，这些区域提供了 `NumberFormat` 格式化器。\n*   `static NumberFormat getNumberInstance()`\n\
  *   `static NumberFormat getNumberInstance(Locale inLocale)`\n*   `static NumberFormat\
  \ getCurrencyInstance()`\n*   `static NumberFormat getCurrencyInstance(Locale inLocale)`\n\
  *   `static NumberFormat getPercentInstance()`\n*   `static NumberFormat getPercentInstance(Locale\
  \ inLocale)`\n    返回一个用于当前区域或指定区域的数字、货币金额或百分比值的格式化器。\n*   `static NumberFormat getCompactNumberInstance()`\
  \ 12\n*   `static NumberFormat getCompactNumberInstance(Locale locale, NumberFormat.Style\
  \ formatStyle)` 12\n    返回当前区域下 `SHORT` 样式的紧凑数字格式化器，或者指定区域和样式（`SHORT` 或 `LONG`）的紧凑数字格式化器。\n\
  *   `String format(double number)`\n*   `String format(long number)`\n    返回格式化给定浮点数或整数生成的字符串。\n\
  *   `Number parse(String source)`\n    解析给定字符串并返回数字值。如果输入字符串描述的是浮点数，则返回 `Double`，否则返回\
  \ `Long`。字符串开头必须包含数字；不允许有前导空格。数字后面可以跟随其他字符，这些字符会被忽略。如果解析失败，则抛出 `ParseException`。\n\
  *   `void setParseIntegerOnly(boolean value)`\n*   `boolean isParseIntegerOnly()`\n\
  \    设置或获取标记，指示此格式化器是否只解析整数值。\n*   `void setGroupingUsed(boolean newValue)`\n* \
  \  `boolean isGroupingUsed()`\n    设置或获取标记，指示此格式化器是否输出并识别分组分隔符（例如 `100,000`）。\n\
  *   `void setMinimumIntegerDigits(int newValue)`\n*   `int getMinimumIntegerDigits()`\n\
  *   `void setMaximumIntegerDigits(int newValue)`\n*   `int getMaximumIntegerDigits()`\n\
  *   `void setMinimumFractionDigits(int newValue)`\n*   `int getMinimumFractionDigits()`\n\
  *   `void setMaximumFractionDigits(int newValue)`\n*   `int getMaximumFractionDigits()`\n\
  \    设置或获取数字的整数部分或小数部分允许的最大或最小位数。\n\n### 7.2.2. `DecimalFormat` 类\n\n在大多数区域中，你在上一节中看到的\
  \ `NumberFormat` 工厂方法返回的是 `DecimalFormat` 类的实例。该类描述了世界范围内发生的各种格式化变化。你可以修改单个设置，也可以创建一个全新的格式化器。模式语法使得这一切变得更加方便。\n\
  \n模式描述了必需和可选的位数，以及正负数的前缀和后缀。还有一些更冷门的设置——请参阅 表 7.3。\n\n考虑这个示例：\n\n```java\nvar formatter\
  \ = new DecimalFormat(\"0.00;(#)\");\n```\n\n分号分隔了正数和可选的负数部分。从正部分可以看出，整数部分至少有一位数字，小数部分至少有两个数字。这适用于所有数字，无论正负号如何。负数使用会计格式——前缀为\
  \ `(` 后缀为 `)`。\n\n前缀或后缀可能包含一个 `¤` 货币符号（U+00A4），用于表示货币符号应该所在的位置。\n\n如果你需要在前缀或后缀中插入特殊字符，请在它前面加一个单引号。例如，前缀\
  \ `'#` 是一个字面量上的哈希符号，而 `o''clock` 包含两个引号。\n\n表 7.3：`DecimalFormat` 属性\n\n| 属性名称 |\
  \ 描述 | 模式 |\n| --- | --- | --- |\n| `groupingSize` | 整数分组的位数（通常为 3） | `###` 分组大小为\
  \ 3 |\n| `minimum`/`maximumFractionDigits` | 小数部分的最小和最大位数 | `.00##` |\n| `minimumIntegerDigits`\
  \ | 整数部分的最小位数 | `000` |\n| `maximumIntegerDigits` | 整数部分的最大位数 | `###,##0` |\n| —\
  \ | 指数部分的最小位数 | `00E0` |\n| `multiplier` | 百分比的倍数 | `%` 每千 |\n| `positivePrefix`/`Suffix`,\
  \ `negativePrefix`/`Suffix` | 正负数的前缀和后缀 | `+#0.00;(#)` 对正数使用 `+` 前缀且无后缀，负数放在括号内\
  \ |\n| `decimalSeparatorAlwaysShown` | 如果小数部分为零，则显示分隔符 | 无法在模式中设置 |\n\n数字、分隔符和杂项部分的实际符号来自\
  \ `DecimalFormatSymbols` 对象，你也可以自定义该对象。表 7.4 列出了它的属性。\n\n表 7.4：`DecimalFormatSymbol`\
  \ 属性\n\n| 属性 | 类型 | 描述 |\n| --- | --- | --- |\n| `currencySymbol` | `String` | 如\
  \ `\"$\"` 或 `\"EUR\"` 的字符串，用于在前缀或后缀有 `¤` 货币符号的地方 |\n| `decimalSeparator`, `monetaryDecimalSeparator`\
  \ | `char` | 用于数字或货币的小数分隔符 |\n| `exponentSeparator` | `String` | 指数前的字符串，通常为 `\"\
  E\"` |\n| `groupingSeparator`, `monetaryGroupingSeparator`（自 Java 15） | `char` |\
  \ 用于数字或货币的分组分隔符 |\n| `infinity`, `naN` | `String` | 用于格式化 `Double.POSITIVE_INFINITY`、`Double.NEGATIVE_INFINITY`\
  \ 和 `Double.NaN` 的字符串 |\n| `internationalCurrencySymbol` | String | ISO 4217 货币符号——参阅\
  \ 第 7.2.3 节 |\n| `minusSign` | `char` | 当没有负模式时使用的减号 |\n\n\n\n\n\n| `percent`, `perMill`\
  \ | `char` | 用于百分比或千分比的字符 |\n| `zeroDigit` | `char` | 数字 0 的字符。其他九个数字是随后的九个 Unicode\
  \ 字符。 |\n\n假设，你想以美国风格显示数字，无论区域设置如何，都使用 `,` 作为分组分隔符，使用 `.` 作为小数点分隔符。你可以自定义 `DecimalFormatSymbols`\
  \ 和格式化器：\n\n```java\nDecimalFormatSymbols symbols = new DecimalFormatSymbols(locale);\n\
  symbols.setGroupingSeparator(',');\nsymbols.setDecimalSeparator('.');\nDecimalFormat\
  \ formatter = (DecimalFormat) NumberFormat.getNumberInstance(locale);\nformatter.setDecimalFormatSymbols(symbols);\n\
  ```\n\n### 7.2.3 货币\n\n要格式化货币值，你可以使用 `NumberFormat.getCurrencyInstance` 方法。然而，该方法并不灵活——它返回一个用于单一货币的格式化器。假设你为一位美国客户准备一份发票，其中某些金额是美元，另一些是欧元。你不能直接使用两个格式化器：\n\
  \n```java\nNumberFormat dollarFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  NumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  ```\n\n你的发票看起来会非常奇怪，某些值显示为 $100,000，而另一些显示为 100.000 €。（注意，欧元值使用的是小数点，而不是逗号。）\n\n\
  相反，使用 `Currency` 类来控制格式化器使用的货币。你可以通过向静态方法 `Currency.getInstance` 传递货币标识来获取 `Currency`\
  \ 对象。然后为每个格式化器调用 `setCurrency` 方法。以下是为你为你的美国客户设置欧元格式化器：\n\n```java\nNumberFormat\
  \ euroFormatter = NumberFormat.getCurrencyInstance(Locale.US);\neuroFormatter.setCurrency(Currency.getInstance(\"\
  EUR\"));\n```\n\n货币标识符由 ISO 4217 定义（参见 [`www.iso.org/iso-4217-currency-codes.html`](https://www.iso.org/iso-4217-currency-codes.html)）。[表\
  \ 7.5] 提供了一个部分列表。\n\n表 7.5：货币标识符\n\n| 货币值 | 标识符 | 数字代码 |\n| --- | --- | --- |\n\
  | 美国元 | USD | 840 |\n| 欧元 | EUR | 978 |\n|  英镑 | GBP | 826 |\n| 日元 | JPY | 392 |\n\
  | 人民币（元） | CNY | 156 |\n| 卢比 | INR | 356 |\n| 俄罗斯卢布 | RUB | 643 |\n\n`java.util.Currency`\
