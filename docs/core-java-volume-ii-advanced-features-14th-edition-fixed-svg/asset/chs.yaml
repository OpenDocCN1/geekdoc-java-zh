  \n### 10.3.3 使用字体\n\n本章开始的“不是 Hello World”程序使用默认字体显示字符串。有时，你希望用不同的字体显示文本。你可以通过*字体名称*来指定字体。字体名称由一个*字体族名称*（如“Helvetica”）和一个可选的后缀组成。例如，“Helvetica”和“Helvetica\
  \ Bold”字体都被认为属于“Helvetica”字体族。\n\n要确定特定计算机上可用的字体，请调用 `GraphicsEnvironment` 类的 `getAvailableFontFamilyNames`\
  \ 方法。该方法返回包含所有可用字体名称的字符串数组。要获取描述用户系统图形环境的 `GraphicsEnvironment` ，请使用静态方法 `getLocalGraphicsEnvironment`。以下程序打印系统上所有的字体：\n\
  \n```\n import java.awt.*;\n\nvoid main() {\n    String[] fontNames = GraphicsEnvironment\n\
  \        .getLocalGraphicsEnvironment()\n        .getAvailableFontFamilyNames();\n\
  \    for (String fontName : fontNames)\n        IO.println(fontName);\n}\n```\n\n\
  AWT 定义了五个*逻辑*字体名称：\n\n```\n SansSerif\nSerif\nMonospaced\nDialog\nDialogInput\n\
  ```\n\n\n\n[content]\n\n这些名称始终映射到客户端机器上实际存在的字体。例如，在 Windows 系统上，`SansSerif` 被映射到\
  \ Arial。\n\n此外，`Oracle JDK` 始终包含三个名为“Lucida Sans”、“Lucida Bright”和“Lucida Sans Typewriter”的字体族。\n\
  \n要用某种字体绘制字符，你必须先创建一个 `Font` 类的对象。指定字体名称、字体样式和字号。以下是如何构造 `Font` 对象的示例：\n\n```\n\
  \ var sansbold14 = new Font(\"SansSerif\", Font.BOLD, 14);\n```\n\n第三个参数是字号。点（Points）在排版中常用于指定字体大小。每英寸\
  \ 72 点。\n\n你可以在 `Font` 构造函数中使用逻辑字体名称来代替字体名称。通过将 `Font` 构造函数的第二个参数设置为以下值之一，可以指定样式（普通、`bold`、`italic`\
  \ 或 `bold italic`）：\n\n```\n Font.PLAIN\nFont.BOLD\nFont.ITALIC\nFont.BOLD + Font.ITALIC\n\
  ```\n\n以下代码使用系统中的标准无衬线字体，以 14 点加粗字体显示字符串“Hello, World!”：\n\n```\n var sansbold14\
  \ = new Font(\"SansSerif\", Font.BOLD, 14);\ng2.setFont(sansbold14);\nvar message\
  \ = \"Hello, World!\";\ng2.drawString(message, 75, 100);\n```\n\n接下来，让我们在组件中居中（`center`）字符串，而不是绘制在任意位置。我们需要知道字符串以像素为单位的宽度高度。这些维度取决于三个因素：\n\
  \n* 使用的字体（在我们的例中，是无衬线字体、加粗、14 点）；\n* 字符串（在本例中为“Hello, World!”）；以及\n* 绘制字体的设备（在本例中为用户的屏幕）。\n\
  \n要获取表示屏幕设备字体特征的对象，请调用 `Graphics2D` 类的 `getFontRenderContext` 方法。它返回一个 `FontRenderContext`\
  \ 类的对象。只需将该对象传递给 `Font` 类的 `getStringBounds` 方法即可：\n\n```\n FontRenderContext context\
  \ = g2.getFontRenderContext();\nRectangle2D bounds = sansbold14.getStringBounds(message,\
  \ context);\n```\n\n`getStringBounds` 方法返回一个包含字符串的矩形。\n\n为了解释该矩形的维度，你应该了解一些基本的排版术语（参见图\
  \ 10.9）。`baseline`（基线）是一条虚线，例如，字母‘e’等字符的底部位于此处。`ascent`（升部）是从基线到 `ascender`（升部字母）顶部的距离，升部是字母‘b’或‘k’或大写字母的上部。`descent`（下降部）是从基线到\
  \ `descender`（下降字母）的距离，下降部是字母‘p’或‘g’的底部。\n\n图 10.9：排版术语图\n\n`Leading`（行间距）是一行下降部与下一行升部之间的空间。（该术语源于排字工人用于分隔行行的铅条。）字体的\
  \ `height`（高度）是相邻基线之间的距离，等于 `descent + leading + ascent`。\n\n`getStringBounds` 方法返回的矩形的宽度是字符串的水平跨度。矩形的高度是\
  \ ascent、descent 和 leading 之和。矩形的原点位于字符串的基线上。矩形顶部的 `y` 坐标为负值。因此，你可以如下获取字符串宽度、高度和升部：\n\
  \n```\n double stringWidth = bounds.getWidth();\ndouble stringHeight = bounds.getHeight();\n\
  double ascent = -bounds.getY();\n```\n\n如果你需要知道 descent 或 leading，请使用 `Font` 类的\
  \ `getLineMetrics` 方法。该方法返回一个 `LineMetrics` 类对象，该类拥有获取 descent 和 leading 方法：\n\n\
  ```\n LineMetrics metrics = f.getLineMetrics(message, context);\nfloat descent =\
  \ metrics.getDescent();\nfloat leading = metrics.getLeading();\n```\n\n当需要在 `paintComponent`\
  \ 方法之外计算布局维度时，你无法从 `Graphics2D` 对象获取字体渲染上下文。相反，调用 `JComponent` 类的 `getFontMetrics`\
  \ 方法，然后调用 `getFontRenderContext`。\n\n```\n FontRenderContext context = getFontMetrics(f).getFontRenderContext();\n\
  ```\n\n为了证明定位是准确的，Listing 10.4 中的示例程序将字符串在框架中居中，并绘制了基线和边界矩形。图 10.10 显示了屏幕内容。\n\n\
  ![Figure](img/fonttest.jpg)图 10.10：绘制基线和字符串边界 Listing 10.4 v2ch10/font/FontDemo.java\n\
  \n```\npackage v2ch10.font;\n\nimport module java.desktop;\n\nclass FontDemo {\n\
  \    void main() {\n        EventQueue.invokeLater(() -> {\n            var frame\
  \ = new FontFrame();\n            frame.setTitle(\"FontTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\nclass FontFrame extends\
  \ JFrame {\n    FontFrame() {\n        add(new FontComponent());\n        pack();\n\
  \    }\n}\n\nclass FontComponent extends JComponent {\n    private static final\
  \ int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\
  \    private String message = \"Hello, World!\";\n\n    protected void paintComponent(Graphics\
  \ g) {\n        Graphics2D g2 = (Graphics2D) g;\n        Font sansbold14 = new Font(\"\
  SansSerif\", Font.BOLD, 14);\n        g2.setFont(sansbold14);\n        FontRenderContext\
  \ context = g2.getFontRenderContext();\n        Rectangle2D bounds = sansbold14.getStringBounds(message,\
  \ context);\n        double x = (getWidth() - bounds.getWidth()) / 2;\n        double\
  \ y = (getHeight() - bounds.getHeight()) / 2 + (bounds.getAscent() - bounds.getDescent())\
  \ / 2 + bounds.getAscent();\n        g2.setPaint(Color.GRAY);\n        g2.drawString(message,\
  \ (int) x, (int) y);\n        g2.setColor(Color.BLACK);\n        g2.draw(new Rectangle2D.Double(x,\
  \ y - bounds.getAscent(), bounds.getWidth(), bounds.getHeight()));\n        g2.draw(new\
  \ Line2D.Double(x, y, x + bounds.getWidth(), y));\n    }\n\n    public Dimension\
  \ getPreferredSize() {\n        return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \    }\n}\n```\n[/content]\n\n\n\n获取字体行距（font leading）——一行文本底部与下一行文本顶部之间的空间。\n\n\
  *   `float getHeight()`\n\n    获取字体的总高度——文本两个基线之间的距离（下降部 descent + 行距 leading +\
  \ 上升部 ascent）。\n\n`java.awt.Graphics2D` 1.2\n\n*   `FontRenderContext getFontRenderContext()`\n\
  \n    获取一个字体渲染上下文，用于指定此图形上下文中的字体特征。\n\n*   `void drawString(String str, float x,\
  \ float y)`\n\n    用当前的字体和颜色绘制一个字符串。\n\n`javax.swing.JComponent` 1.2\n\n*   `FontMetrics\
  \ getFontMetrics(Font f)` 5.0\n\n    获取给定字体的字体度。`FontMetrics` 类是 `LineMetrics` 类的前身。\n\
  \n`java.awt.FontMetrics` 1.0\n\n*   `FontRenderContext getFontRenderContext()` 1.2\n\
  \n    获取该字体的字体渲染上下文。\n\n### 10.3.4. 显示图像\n\n你可以使用 `ImageIcon` 类从文件中读取图像：\n\n```\n\
