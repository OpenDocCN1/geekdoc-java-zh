  \ 12.5.6. 填充\n\n当你填充形状时，其内部会被*漆样式*覆盖。使用 `setPaint` 方法将漆样式设置为实现 `Paint` 接口的类的对象。Java\
  \ 2D API 提供了三个这样的类：\n\n*   `Color` 类实现了 `Paint` 接口。要用纯色填充形状，只需调用 `setPaint` 并传入一个\
  \ `Color` 对象，例如\n\n\n\n\n\n```\ng2.setPaint(Color.red);\n```\n\n* `GradientPaint`\
  \ 类通过在两个指定的颜色值之间进行插值来改变颜色（参见图 12.45）。\n\n    ![Figure](img/fig07-15.jpg)图 12.45:\
  \ 渐变填充\n\n* `TexturePaint` 类通过重复图像填充区域（参见图 12.46）。\n\n    ![Figure](img/fig07-16.jpg)图\
  \ 12.46: 纹理填充\n\n你可以通过指定两个点以及在这两个点上的颜色来构造一个 `GradientPaint` 对象。\n\n```\ng2.setPaint(new\
  \ GradientPaint(p1, Color.RED, p2, Color.YELLOW));\n```\n\n颜色沿着连接两点的直线进行插值。在与该连接线垂直的直线上，颜色保持不变。超出线条端点的点将赋予该端点的相同的颜色。\n\
  \n或者，如果你在调用 `GradientPaint` 构造函数时将 `cyclic` 参数设置为 `true`：\n\n```\ng2.setPaint(new\
  \ GradientPaint(p1, Color.RED, p2, Color.YELLOW, true));\n```\n\n那么，颜色变化将循环，并在超出端点后持续变化。\n\
  \n要构造 `TexturePaint` 对象，需要指定一个 `BufferedImage` 和一个锚点矩形。\n\n```\ng2.setPaint(new\
  \ TexturePaint(bufferedImage, anchorRectangle));\n```\n\n我将在本章稍后详细讨论图像时介绍 `BufferedImage`\
  \ 类。获取缓冲图像简单的方法是读取图像文件：\n\n```\nbufferedImage = ImageIO.read(new File(\"blue-ball.gif\"\
  ));\n```\n\n锚点矩形在 `x` 和 `y` 方向上无限扩展，以平铺整个坐标平面。图像被缩放以适应锚点，然后复制到每个瓦瓷块中。\n\n### `java.awt.Graphics2D`\
  \ 1.2\n\n* `void setPaint(Paint s)`\n\n    将此图形上下文的绘制画设置为实现 `Paint` 接口的给定对象。\n\n\
  ### `java.awt.GradientPaint` 1.2\n\n* `GradientPaint(float x1, float y1, Color color1,\
  \ float x2, float y2, Color color2)`\n\n* `GradientPaint(float x1, float y1, Color\
  \ color1, float x2, float y2, Color color2, boolean cyclic)`\n\n* `GradientPaint(Point2D\
  \ p1, Color color1, Point2D p2, Color color2)`\n\n* `GradientPaint(Point2D p1, Color\
  \ color1, Point2D p2, Color color2, boolean cyclic)`\n\n    构造一个渐变填充对象，用颜色填充形状，使得起点用\
  \ `color1` 填充，终点用 `color2` 填充，中间的颜色进行线性插值。在连接起点和终点的线垂直的直线上，颜色保持不变。默认情况下，渐变填充不是循环的——也就是说，超出起点和终点的点将与起点或终点的颜色相同。如果渐变填充是循环的，则颜色将继续插值，首先返回到起点颜色，然后在两个方向上无限重复。\n\
  \n### `java.awt.TexturePaint` 1.2\n\n* `TexturePaint(BufferedImage texture, Rectangle2D\
  \ anchor)`\n\n    创建一个纹理填充对象。锚点矩形定义了要绘制空间的平铺方式；它在 `x` 和 `y` 方向上无限重复，纹理图像被缩放以填充每个瓦瓷块。\n\
  \n### 12.5.7. 坐标变换\n\n假设你需要画一个物体，例如汽车。根据制造商的规格，你知道高度、轴距和总长度。当然，你可以计算所有的像素位置，假设每米有若干个像素。然而，有一种更简单的方法：你可以要求图形上下文为你完成转换。\n\
  \n```\ng2.scale(pixelsPerMeter, pixelsPerMeter);\ng2.draw(new Line2D.Double(coordinates\
  \ in meters)); // 转换为像素并\n                                                   //\
  \ 绘制缩后的线条\n```\n\n`Graphics2D` 类的 `scale` 方法将图形上下文的坐标设置为缩放变换。该变换将用户坐标（用户指定的单位）转换为设备坐标（像素）。图\
  \ 12.47 显示了变换是如何工作的。\n\n.图 12.47: 用户坐标和设备坐标\n\n坐标变换在实践中非常有用。它们允许你使用方便的坐标值工作。图形上下文负责将它们转换为像素的脏活工作。\n\
  \n有四种基本的变换。\n\n* 缩放：放大或缩小所有到固定点的距离。\n* 旋转：绕固定中心旋转所有点。\n* 平移：按固定量移动所有点。\n* 剪切：固定一条直线，并使其与其平行的行进行“滑动”，滑动量与到固定线的距离成正比。\n\
  \n图 12.48 显示了这四种基本变换如何作用于单位正方形。\n\n.图 12.48: 基本变换\n\n`Graphics2D` 类的 `scale`、`rotate`、`translate`\
  \ 和 `shear` 方法将图形上下文的坐标变换设置为其中之一。\n\n你可以组合变换。例如，你可能想旋转形状并使其尺寸翻倍；同时提供旋转和缩放：\n\n```\n\
  g2.rotate(angle);\ng2.scale(2, 2);\n```\n\n在这种情况下，以何种顺序提供变换并不重要。然而，对于大多数变换，顺序是重要的。例如，考虑以下变换序列：\n\
  \n```\ng2.translate(x, y);\ng2.rotate(angle);\ng2.translate(-x, -y);\n```\n\n最后一个变换（最应用的）将点\
  \ (`x`, `y`) 移动到原点。第二个变换绕原点以角度 `a` 旋转。最终变换将原点移回 (`x`, `y`)。由于绕原点以外的点进行旋转是一个非常常见的操作，因此有一个捷径——参见图\
  \ 12.49：\n\n```\ng2.rotate(angle, x, y);\n```\n\n.图 12.49: 组合变换\n\n如果你熟悉一些矩阵理论，你可能知道所有的旋转、平移、缩放、剪切以及它们的组合都可以用如下形式的变换矩阵表示：\n\
  \n$\\begin{bmatrix} x_{\\text{new}} \\\\ y_{\\text{new}} \\\\ 1 \\end{bmatrix} =\
  \ \\begin{bmatrix} a & c & e \\\\ b & d & f \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot\
  \ \\begin{bmatrix} x \\\\ y \\\\ 1 \\end{bmatrix}$\n\n这种变换被称为仿射变换。在 Java 2D API\
  \ 中，`AffineTransform` 类描述了这种变换。如果你知道特定变换矩阵的组件，可以直接构造它：\n\n```\nvar t = new AffineTransform(a,\
  \ b, c, d, e, f);\n```\n\n此外，工厂方法 `getRotateInstance`、`getScaleInstance`、`getTranslateInstance`\
  \ 和 `getShearInstance` 构建表示这些类型的矩阵。例如，调用\n\n```\nt = AffineTransform.getScaleInstance(2.0F,\
  \ 0.5F);\n```\n\n返回一个对应于矩阵 $\\begin{bmatrix} 2 & 0 & 0 \\\\ 0 & 0.5 & 0 \\\\ 0 &\
  \ 0 & 1 \\end{bmatrix}$ 的变换。\n\n最后，实例方法 `setToRotation`、`setToScale`、`setToTranslation`\
  \ 和 `setToShear` 将变换对象设置为新类型。例如：\n\n```\nt.setToRotation(angle); // 设置 t 为旋转\n```\n\
  \n你可以将图形上下文的坐标变换设置为 `AffineTransform` 对象。\n\n```\ng2.setTransform(t); // 替换当前变换\n\
  ```\n\n\n\n\n然而，在实践中，你不应该调用 `setTransform` 操作，因为它会替换图形上下文可能具有任何现有变换。例如，用于横向模式打印的图形上下文已经包含了一个\
  \ 90 度的旋转变换。如果你调用 `setTransform`，就会抹除该旋转。相反，请调用 `transform` 方法。\n\n```\ng2.transform(t);\
  \ // 将当前变换与 t 组合\n```\n\n它将现有的变换与新的 `AffineTransform` 对象组合。\n\n如果你只是想临时应用变换，请先获取旧变换，将其与新变换组合，最后在完成后恢复旧变换。\n\
  \n```\nAffineTransform oldTransform = g2.getTransform(); // 保存旧变换\ng2.transform(t);\
  \ // 应用临时变换\n在 g2 上绘图\ng2.setTransform(oldTransform); // 恢复旧变换\n```\n\n### `java.awt.geom.AffineTransform`\
  \ 1.2\n\n*   `AffineTransform(double a, double b, double c, double d, double e,\
