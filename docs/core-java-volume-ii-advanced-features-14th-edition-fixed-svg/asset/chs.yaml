  \n## 4.5. 简单的服务器\n\n从 Java 6 开始，JDK 在 `com.sun.net.httpserver` 包中提供了一个简单的服务器。在 Java\
  \ 18 中，了一个基于该包的静态文件服务器工具。当时添加了一些便利类，并且 JEP 408 确认了该包受“官方支持”。该服务器用于测试和调试。\n\n###\
  \ 4.5.1. 命令行工具\n\n要启动文件服务器，使用命令\n\n```\njwebserver\n```\n\n它服务于当前目录及其子目录，端口为 8000。当提供文件时，会打印一条消息。你可以通过\
  \ `-d` 和 `-p` 选项更改目录和端口：\n\n```\njwebserver -d /tmp -p 8189\n```\n\n你还可以通过 `-o`\
  \ 命令行选项设置消息级别。选项有 `info`（默认）、`verbose` 和 `none`。要杀死服务器，按下 Ctrl+C 或使用 `kill`/`pkill`\
  \ 命令。此服务器仅用于提供文件。它类似于 `python -m http.server` 命令。事实上，你也可以通过 `java -m jdk.httpserver`\
  \ 调用 Java 文件服务器。\n\n### 4.5.2. HTTP 服务器 API\n\n你可以通过编程方式启动简单的文件服务器：\n\n```java\n\
  import com.sun.net.httpserver.*;\n. . .\nHttpServer server = SimpleFileServer.createFileServer(new\
  \ InetSocketAddress(port),\n    Path.of(\"/tmp\"), OutputLevel.VERBOSE);\nserver.start();\n\
  ```\n\n现在你可以以各种方式对其自定义。或者，如果你不想提供文件，可以获取一个什么都不做的服务器：\n\n```java\nHttpServer server\
  \ = HttpServer.create(new InetSocketAddress(port), 0);\n```\n\n第二个参数是服务器套接字的“积压”，即队列连接请求的最大数量。对于零参数，将使用默认值。\n\
  \n你可以设置处理请求的执行器：\n\n```java\nserver.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\n\
  ```\n\n为了让服务器做一些有趣的事，你需要创建上下文。\n\n上下文有\n\n\n\n\n\n*   一个 `path`，必须是请求路径的前缀\n*  \
  \ 一个用于计算响应的 `handler`\n*   一个 `filters` 列表，可以转换请求或响应（参见第 4.5.4 节）\n\n如果一个请求匹配多个上下文（context），则执行路径最长的那个。例如，在这里我们为\
  \ `/static/` 和 `/` 路径安装了两个处理器：\n\n```\nserver.createContext(\"/static/\", SimpleFileHandler.createFileHandler(staticRoot));\n\
  server.createContext(\"/\", HttpHandlers.of(301,\n    Headers.of(\"Location\", \"\
  https://horstmann.com/corejava\"), \"\"));\n```\n\n注意，你可以利用现有的处理器，例如简单文件服务器的处理器。\n\
  \n静态方法 `HttpHandlers.of` 产生一个返回固定响应的简单处理器。你传递状态码、响应头和响应体即可。\n\n静态方法 `HttpHandlers.handleOrElse`\
  \ 使用 `Predicate<Request>` 在两个处理器之间进行选择：\n\n```\nHttpHandler handler = HttpHanders.handleOrElse(\n\
  \    request -> request.getRequestMethod().equals(\"GET\"),\n    SimpleFileHandler.createFileHandler(staticRoot).\n\
  \    HttpHandlers.of(500, Headers.of(), \"Bad request method\"))\n```\n\n对于更复杂的处理器，你需要提供一个\
  \ `HttpHandler` 子类的实例。详细信息请见下一节。\n\n### 4.5.3. 处理器 (Handlers)\n\n处理器在其方法中产生 HTTP\
  \ 请求的响应\n\n``````\npublic void handle(HttpExchange exchange)\n```\n\n`HttpExchange`\
  \ 实例同时持有请求和响应数据。处理器必须按照以下特定顺序使用该对象：\n\n1.  读取请求方法、URI 和请求头：\n\n    ```\n    String\
  \ method = exchange.getRequestMethod();\n    URI uri = exchange.getRequestURI();\n\
  \    Headers requestHeaders = exchange.getRequestHeaders();\n    String userAgent\
  \ = requestHeaders.getFirst(\"user-agent\");\n    ```\n\n2.  为 `POST`、`PUT` 和 `PATCH`\
  \ 请求读取请求体：\n\n    ```\n    InputStream in = exchange.getRequestBody();\n    String\
  \ body = new String(in.readAllBytes());\n    in.close();\n    ```\n\n3.  设置响应头：\n\
  \n    ```\n    Headers responseHeaders = exchange.getResponseHeaders();\n    responseHeaders.add(\"\
  Content-type\", \"text/plain\");\n    . . .\n    ```\n\n4.  设置状态码和响应体长度：\n\n   \
  \ ```\n    exchange.sendResponseHeaders(200, responseBytes.length);\n    ```\n\n\
  5.  写入响应体（如果存在）：\n\n    ```\n    OutputStream responseBody = exchange.getResponseBody();\n\
  \    responseBody.write(responseBytes);\n    responseBody.close();\n    ```\n\n\
  请求头和响应头是 `Headers` 类的实例，该类实现了 `Map<String, List<String>>` 接口。请记住，每个头可以有多个值。\n\n\
  `Headers` 类与你在第 4.4 节中看到的 `HttpHeaders` 类似，但它直接直接实现了 `Map<String, List<String>>`\
  \ 接口。与 `HttpHeaders` 一样，键（key）是不区分大小写的。\n\n如果你知道某个键最多只有一个值，请调用 `getFirst` 来获取它。要向响应映射中添加键值对，请使用如上面代码段所示的\
  \ `add` 方法。\n\n列表 4.12 中的示例程序包含一个处理器的示例，产生带有请求所有的文本响应。\n\n### 4.5.4. 过滤器 (Filters)\n\
  \n除了处理器外，上下文还可以有一个过滤器链。过滤器可以修改请求或响应，或者执行额外工作如日志记录或身份验证。例如，简单的 Web 服务器使用过滤器来显示请求。\n\
  \n要实现过滤器，需要扩展抽象类 `Filter` 并实现两个方法。`description` 方法应该返回某些描述性字符串。通常，`doFilter` 方法看起来如下：\n\
  \n```\npublic void doFilter(HttpExchange exchange, Filter.Chain chain) {\n    //\
  \ 请求处理\n    chain.doFilter(exchange);\n    // 响应处理\n}\n```\n\n通过调用 `chain.doFilter(exchange)`，触发剩余的过滤器和处理器。\n\
  \n过滤器可以中止后续的过滤和处理——例如，如果身份验证失败。此时它不应该调用 `chain.doFilter(exchange)`，而是在 `exchange`\
  \ 对象中产生响应。\n\n你可以这样添加过滤器：\n\n```\ncontext.getFilters().add(filter);\n```\n\n如你所见，HTTP\
  \ 服务器 API 稍微有些粗糙且过时。在自己的代码中，不要提供返回内部可变数据结构引用的方法，就像 `Context.getFilters` 方法所做的那样。\n\
  \n`Filter` 类有三个用于过滤器的静态工厂方法：\n\n```\npublic Filter beforeHandler(String description,\
  \ Consumer<HttpExchange> operation)\npublic Filter afterHandler(String description,\
  \ Consumer<HttpExchange> operation)\npublic Filter adaptRequest(String description,\
  \ UnaryOperator<Request> requestOperator)\n```\n\n前两个方法将 `exchange` 对象（在请求之前或之后）传递给可以对其检查或修改的消费者。\n\
  \n第三个方法使得向请求添加标头变得更加方便：\n\n```\nFilter f = Filter.adaptRequest(\"Adding header\"\
  ,\n    request -> request.with(headerName, List.of(headerValue)));\n```\n\n当然，与\
  \ Tomcat 或 Jetty 等成熟的 Web 服务器相比，这个服务器相当原始。\n\n列表 4.12 程序展示了一个返回纯文本响应的简单服务器。启动它并将浏览器指向\
  \ `http://localhost:8189` 以查看请求头。该服务器对于原型设计和测试非常有用。列表 4.10。\n\n## 4.6. 发送电子邮件\n\n\
  过去，通过连接到邮件服务器的 25 端口（SMTP 端口）来发送电子邮件是简单的。简单邮件传输协议 (SMTP) 描述了电子邮件的格式。一旦连接到服务器，发送邮件头（SMTP\
  \ 格式，很容易生成），然后是邮件内容。\n\n详细信息如下：\n\n1.  向你的主机打开套：\n\n    ```\n    var s = new Socket(\"\
  mail.yourserver.com\", 25); // 25 是 SMTP\n    var out = new PrintWriter(s.getOutputStream());\n\
  \    ```\n\n2.  向打印流发送以下信息：\n\n\n\n\n\n```\nHELO sending host\nMAIL FROM: sender\
  \ e-mail address\nRCPT TO: recipient e-mail address\nDATA\nSubject: subject\n(blank\
  \ line)\nmail message (any number of lines)\n.\nQUIT\n```\n\nSMTP 规范（`RFC 821`）规定行必须以\
  \ `\\r` 结尾，随后紧跟 `\\n`。\n\n过去，SMTP 服务器通常愿意路由来自任何人的电子邮件。然而，在如今垃圾邮件泛滥的时代，大多数服务器都内置了检查机制，并且仅接受来自其信任的用户或\
  \ IP 地址范围的请求。身份验证通常在安全套接连接上进行。\n\n手动实现这些身份验证方案会非常麻烦。相反，我们将向你如何使用 `Jakarta Mail API`\
  \ 从 Java 程序发送电子邮件。\n\n要使用 `Jakarta Mail`，你需要设置一些取决于你邮件服务器的属性。例如，使用 `GMail` 时，你使用：\n\
  \n```\nmail.transport.protocol=smtps\nmail.smtps.auth=true\nmail.smtps.host=smtp.gmail.com\n\
  mail.smtps.user=accountname@gmail.com\n```\n\n我们的示例程序从属性文件中读取这些内容。\n\n出于安全考虑，我们不会将密码放入属性文件中，而是通过提示输入。\n\
  \n对于大多数邮件提供商，你需要生成并使用特殊的应用程序密码，而不是使用你的普通邮件密码。\n\n从属性文件中读取，然后如所示获取邮件会话：\n\n```\n\
  Session mailSession = Session.getDefaultInstance(props);\n```\n\n创建一个包含所需的发件者、收件人、主题和消息正文的消息：\n\
  \n```\nvar message = new MimeMessage(mailSession);\nmessage.setFrom(new InternetAddress(from));\n\
  message.addRecipient(RecipientType.TO, new InternetAddress(to));\nmessage.setSubject(subject);\n\
  message.setText(builder.toString());\n```\n\n然后将其发送：\n\n```\nTransport tr = mailSession.getTransport();\n\
  tr.connect(null, password);\ntr.sendMessage(message, message.getAllRecipients());\n\
  tr.close();\n```\n\n程序从格式如下的文本文件中读取消息：\n\n```\nSender\nRecipient\nSubject\nMessage\
  \ text (any number of lines)\n```\n\n在写下本文时，`GMail` 并不检查信息的真实性——你可以提供任何你喜欢的发件者。（当你下次收到来自\
  \ `president@whitehouse.gov` 的邮件，邀请你参加前院的黑色晚装活动时，请记住这一点。）\n\n由于程序需要外部 JAR 文件，它没有包含在\
  \ `corejava-bookcode.zip` 文件中，而是包含在 `corejava-modulechapter.zip` 中。不需要使用模块来运行程序。只需按照如下方式编译并运行：\n\
  \n```\ncd corejava-modulechapter/v2ch04.mail\njavac -classpath .:../jars/\\* com/horstmann/mail/MailDemo.java\n\
  java -classpath .:../jars/\\* com.horstmann.mail.MailDemo path/to/message.txt\n\
  ```\n\n或者，如果你愿意，可以使用模块：\n\n```\ncd corejava-modulechapter/\njavac -p v2ch04.mail:jars/jakarta.mail-api-2.1.3.jar:jars/jakarta.activation-api-2.1.3.jar\
  \ \\\n    v2ch04.mail/com/horstmann/mail/MailDemo.java v2ch04.mail/module-info.java\n\
  java -p v2ch04.mail:jars/jakarta.mail-api-2.1.3.jar:jars/jakarta.activation-api-2.1.3.jar\\\
  \n:jars/angus-activation-2.0.2.jar:jars/angus-mail-2.0.3.jar \\\n    -m v2ch04.mail/com.horstmann.mail.MailDemo\
  \ path/to/message.txt\n```\n\n如果你无法确定为什么你的邮件连接无法工作，请调用：\n\n```\nmailSession.setDebug(true);\n\
  ```\n\n并检查消息。此外，`Jakarta Mail API` 的 FAQ [`eclipse-ee4j.github.io/angus-mail/FAQ`](https://eclipse-ee4j.github.io/angus-mail/FAQ)\
  \ 提供了一些的调试提示。\n\n在本章中，你已经了解如何在 Java 中编写网络客户端和服务器，以及如何从 Web 服务器获取信息。下一章将介绍数据库连接。你将学习如何使用\
  \ `JDBC API` 在 Java 中与关系型数据库工作。\n\n# 第 5 章 ▪ 数据库编程\n\n1996 年，Sun 发布了第一个版本的 `JDBC\
  \ API`。该 API 允许程序员连接到数据库并使用结构化查询语言（`SQL`）对其进行查询或更新。（`SQL` 通常读作“sequel”，是关系型数据库访问的行业标准。）`JDBC`\
  \ 自此以后成为 Java 库中最常用的 API 之一。\n\n`JDBC` 已经更新了多次。在本书出版时，Java 9 包含的 `JDBC 4.3` 是最新版本。\n\
  \n在本章中，我将解释 `JDBC` 背后的核心思想。我将向你介绍（或让你重温）`SQL`，即这种用于关系型数据库的行业标准结构化查询语言。本章提供了足够的细节和示例，让你能够在常见的编程场景中使用\
  \ `JDBC`。\n\n根据 Oracle 的说法，`JDBC` 是一个注册商标，而不是 Java Database Connectivity 的缩写。它的命名是为了让人想起\
  \ `ODBC`，这是一种由微软开创的标准数据库 API。\n\n## 5.1 JDBC 的设计\n\n从一开始，Java 技术的开发者就意识到 Java 在处理数据库方面的潜力。1995\
  \ 年，他们开始扩展标准 Java 库，以便程序仅使用“纯”Java 就可以与数据库通信。他们很快意识到这是一个无法完成的任务：市上有太多的数据库，使用了太多的协议。此外，尽管数据库供应商都希望\
  \ Java 提供标准网络协议，但只有在 Java 使用他们的网络协议时才会。\n\n所有数据库供应商和工具供应商都同意，提供一个纯 Java API 是很有用的，并配备一个驱动管理器以允许第三方驱动连接到特定的数据库。这样数据库供应商就可以提供自己的驱动程序接入驱动管理器。\n\
  \n这种组织遵循了微软 `ODBC` 的成功模型，它为数据库访问提供了 C 语言接口。`JDBC` 和 `ODBC` 都基于相同的理念：根据 API 编写的程序与管理器通信，管理器转使用驱动进行通信。\n\
  \n这意味着大多数程序员只需要处理 `JDBC API`。\n\n### 5.1.1 JDBC 驱动类型\n\n`JDBC` 规范将驱动程序分类为以下*类型*：\n\
  \n-   **1 型驱动程序**将 `JDBC` 翻译为 `ODBC` 并依赖 `ODBC` 驱动程序与数据库通信。Java 的早期版本包含了这样一个驱动程序，即\
  \ `JDBC/ODBC 桥接`。然而，桥接需要 `ODBC` 驱动程序的部署和正确配置。当 JDBC 最初发布时，该桥接对于测试非常方便，但它从未打算用于生产环境。现在已经有了许多更好的驱动程序，且\
  \ JDK 不再提供 `JDBC/ODBC 桥接`。\n\n-   **2 型驱动程序**部分用 Java 编写，部分用原生代码；它与数据库的客户端 API 通信。使用此类驱动程序，除了\
  \ Java 库外，你还需要在客户端安装某些平台特定的代码。\n\n-   **3 型驱动程序**是一个纯 Java 客户端库，它使用数据库无关的协议向服务器组件发送数据库请求，然后由该组件将请求转换为特定的数据库协议。这简化了部署，因为平台特定的代码仅位于服务器上。\n\
  \n-   **4 型驱动程序**是一个纯 Java 库，它直接将 `JDBC` 请求翻译为特定的数据库协议。\n\n\n\n\n\n大多数数据库供应商在提供其数据库时都会提供\
  \ 3 型或 4 型驱动程序。此外，许多第三方公司专门生产驱动程序，这些数据库供应商提供的驱动程序具有更好的标准符合性、支持更多平台、更好的性能，或者在某些情况下仅仅比数据库供应商提供的驱动程序更可靠。\n\
  \n总而言之，JDBC 的最终目标是实现以下目标：\n\n*   程序员可以使用 Java 编程语言编写应用程序，使用标准 SQL 语句（甚至是 SQL 的特殊扩展）访问任何数据库，同时仍遵循\
  \ Java 语言规范。\n*   数据库供应商和数据库工具供应商可以提供底层驱动程序。这样，他们就可以针对自己的特定产品优化其驱动程序。\n\n如果你好奇 Java\
  \ 为什么不直接采用 ODBC 模型，在 1996 年的 JavaOne 大会上给出的理由如下：\n\n*   ODBC 很难学习。\n*   ODBC 拥有一些带有大量复杂选项的命令。Java\
  \ 编程语言的偏好风格是拥有简单直观的方法，并且要尽可能多。\n*   ODBC 依赖于 `void*` 指针和其他 C 语言特性，这些特性在 Java 编程语言中并不自然。\n\
  *   基于 ODBC 的解决方案在本质上比纯 Java 解决方案更安全且更难部署。\n\n## 5.1.2 JDBC 的典型用途\n\n传统的客户端/服务器模型在客户端有一个丰富的\
  \ GUI，在服务器上有一个数据库（参见图 5.1）。在这种模型中，JDBC 驱动程序部署在客户端。\n\n.图 5.1: 传统的客户端/服务器应用程序\n\n\
  然而，现在三层模型更为常见，客户端应用程序不进行数据库调用。相反，它调用服务器上的中间件层，再由中间件层执行数据库查询。三层模型有两个优势。它将*视觉呈现*（在客户端）与*业务逻辑*（在中间层）以及原始数据（在数据库中）分离。因此，可以从多个客户端（如\
  \ Java 桌面应用程序、网页浏览器或移动应用）访问相同的数据和相同的业务规则。\n\n客户端与中间层之间的通信通常通过 HTTP 进行。JDBC 管理中间层与后端数据库之间的通信。图\
  \ 5.2 显示了基本架构。\n\n.图 5.2: 三层应用程序\n\n## 5.2 结构化查询语言\n\nJDBC 允许你使用 SQL 与数据库通信，SQL\
  \ 是本质上所有关系型数据库服务器的命令语言。Microsoft Access 等桌面数据库具有查询和更新的 GUI，但 JDBC 侧于基于服务器的数据库，如\
  \ Oracle、PostgreSQL、MySQL、Microsoft SQL Server 等。\n\n`JDBC` 包可以被认为仅仅是向数据库通信 SQL\
  \ 语句的 API。我们将在本节中简要介绍 SQL。如果你以前从未见过 SQL，你可能会觉得这些材料不够。如果是这样，请转到该主题的许多学习资源之一；我推荐 Alan\
  \ Beaulieu 编写的 *Learning SQL*（O’Reilly, 2009）或位于 [`sql.learncodethehardway.org`](https://sql.learncodethehardway.org)\
  \ 的在线书籍 *Learn SQL The Hard Way*。\n\n你可以将数据库看作一组带有行和列的命名的表。每列都有一个*列名*。每行包含一组相关数据。\n\
  \n作为本书的示例数据库，我们使用了一组描述经典计算机科学书籍的数据库表。\n\n表 5.1: `Authors` 表\n\n| Author_Id | Name\
  \ | Fname |\n| --- | --- | --- |\n| `ALEX` | `Alexander` | `Christopher` |\n| `BROO`\
  \ | `Brooks` | `Frederick P.` |\n| `. . .` | `. . .` | `. . .` |\n\n表 5.2: `Books`\
  \ 表\n\n| Title | ISBN | Publisher_Id | Price |\n| --- | --- | --- | --- |\n| `A\
  \ Guide to the SQL Standard` | `0-201-96426-0` | `0201` | `47.95` |\n| `A Pattern\
  \ Language: Towns, Buildings, Construction` | `0-19-501919-9` | `019` | `65.00`\
  \ |\n| `. . .` | `. . .` | `. . .` | `. . .` |\n\n表 5.3: `BooksAuthors` 表\n\n| ISBN\
  \ | Author_Id | Seq_No |\n| --- | --- | --- |\n| `0-201-96426-0` | `DATE` | `1`\
  \ |\n| `0-201-96426-0` | `DARW` | `2` |\n| `0-19-501919-9` | `ALEX` | `1` |\n| `.\
  \ . .` | `. . .` | `. . .` |\n\n表 5.4: `Publishers` 表\n\n| Publisher_Id | Name |\
  \ URL |\n| --- | --- | --- |\n| `0201` | `Addison-Wesley` | `www.aw-bc.com` |\n\
  | `0407` | `John Wiley & Sons` | `www.wiley.com` |\n| `. . .` | `. . .` | `. . .`\
  \ |\n\n图 5.3 显示了 `Books` 表的视图。图 5.4 显示了连接 `Publishers` 表的 `Books` 表。使用 SQL 访问 `Books`\
  \ 表。许多供应商提供通过填充表单来表达列名的工具。这种工具通常被称为*示例查询*（QBE）工具。相比之下，使用 SQL 的查询是用文本编写的，例如：\n\n\
  ```sql\nSELECT Books.Title, Books.Publisher_Id, Books.Price, Publishers.Name, Publishers.URL\n\
  FROM Books, Publishers\nWHERE Books.Publisher_Id = Publishers.Publisher_Id\n```\n\
  \n在本节剩余部分，你将学习编写此类查询。如果你已经熟悉 SQL，请跳过本节。\n\n按照习惯，SQL 关键字使用大写，尽管这并非必须。\n\n`SELECT`\
  \ 语句非常灵活。你可以简单地通过以下查询选择 `Books` 表中的所有行：\n\n```sql\nSELECT * FROM Books\n```\n\n\
  `FROM` 子句在每个 SQL `SELECT` 语句中都是必须的。它告诉数据库从哪些表中查找数据。\n\n你可以选择你需要的列：\n\n```sql\nSELECT\
  \ ISBN, Price, Title\nFROM Books\n```\n\n你可以使用 `WHERE` 子句限制行：\n\n```sql\nSELECT\
  \ ISBN, Price, Title\nFROM Books\nWHERE Price <= 29.95\n```\n\n注意“相等”比较。SQL 使用 `=`\
  \ 和 `<>` 进行等性测试，而不是像 Java 编程语言中的 `==` 或 `!=`。\n\n某些数据库供应商支持使用 `!=` 进行不等性测试。这符合标准\
  \ SQL，因此我不建议这样使用。\n\n`WHERE` 子句还可以通过 `LIKE` 运算符使用模式匹配。然而，通配符字符并不是常用的 `*` 和 `?`。使用\
  \ `%` 表示零或多个字符，使用下划线 `_` 表示单个字符。例如，\n\n```sql\nSELECT ISBN, Price, Title\nFROM Books\n\
  WHERE Title NOT LIKE '%n_x%'\n```\n\n排除标题中包含 Unix 或 Linux 等单词的书籍。\n\n\n\n\n请注意，字符串包含在单引号中，而不是双引号。字符串内部的单引号用一对单引号来表示。例如，\n\
  \n```\nSELECT Title\nFROM Books\nWHERE Title LIKE '%''%'\n```\n\n该查询会报告所有包含单引号的标题。\n\
  \n你可以从多个表中选择数据：\n\n```\nSELECT * FROM Books, Publishers\n```\n\n在没有 `WHERE` 子句的情况下，这个查询毫无意义。它列出了两个表中所有行的`所有组合`。在我们的案例中，`Books`\
  \ 表有 20 行，`Publishers` 表有 8 行，结果是一个包含 20 × 8 条目的行集合，并且存在大量的重复项。我们确实希望限制查询，说明我们只对与与其出版社`匹配`的书籍感兴趣：\n\
  \n```\nSELECT * FROM Books, Publishers\nWHERE Books.Publisher_Id = Publishers.Publisher_Id\n\
  ```\n\n此查询结果有 20 行，每本书对应一行，因为每本书在 `Publisher` 表中都只对应一个出版社。\n\n每当你在查询中使用多个表时，相同的列名可能会出现在两个不同的地方。这在我们的示例中就发生了。在\
  \ `Books` 和 `Publishers` 表中都有名为 `Publisher_Id` 的列。当发生歧义时，你必须在每个列名前加上其所属表的前缀，例如 `Books.Publisher_Id`。\n\
  \n你也可以使用 SQL 来更改数据库内部的数据。例如，假设你想将标题中包含“C++”的所有书籍当前价格降低 5.00 美元：\n\n```\nUPDATE Books\n\
  SET Price = Price - 5.00\nWHERE Title LIKE '%C++%'\n```\n\n同样，要删除所有 C++ 书籍，请使用 `DELETE`\
  \ 查询：\n\n```\nDELETE FROM Books\nWHERE Title LIKE '%C++%'\n```\n\nSQL 带有有内置函数，用于计算平均值、查找列中的最大值和最小值等，这些内容在本文中不再讨论。\n\
  \n通常情况下，要向表中插入值，你可以使用 `INSERT` 语句：\n\n```\nINSERT INTO Books\nVALUES ('A Guide to\
  \ the SQL Standard', '0-201-96426-0', '0201', 47.95)\n```\n\n对于表中插入的每一行，都需要单独的 `INSERT`\
  \ 语句。\n\n当然，在你能够查询、修改和插入数据之前，你必须有一个存储数据的地方。使用 `CREATE TABLE` 语句创建一个新表。为每一列指定名称和数据类型。例如，\n\
  \n```\nCREATE TABLE Books\n(\n   Title VARCHAR(60),\n   ISBN CHAR(13),\n   Publisher_Id\
  \ VARCHAR(6),\n   Price DECIMAL(10,2)\n)\n```\n\n表 5.5 显示了最常用的 SQL 数据类型。\n\n表 5.5：常见\
  \ SQL 数据类型\n\n| 数据类型 | 说明 |\n| --- | --- |\n| `INTEGER` 或 `INT` | 通常是 32 位整数 |\n\
  | `SMALLINT` | 通常是 16 位整数 |\n| `NUMERIC(m,n)`, `DECIMAL(m,n)` 或 `DEC(m,n)` | 具有\
  \ `m` 位总数字和 `n` 位小数的固定定点小数 |\n| `FLOAT(n)` | 具有 `n` 位二进制精度的浮点数 |\n| `REAL` | 通常是\
  \ 32 位浮点数 |\n| `DOUBLE` | 通常是 64 位浮点数 |\n| `CHARACTER(n)` 或 `CHAR(n)` | 长度为 `n`\
  \ 的固定长度字符串 |\n| `VARCHAR(n)` | 最大长度为 `n` 的变长字符串 |\n| `BOOLEAN` | 布尔值 |\n| `DATE`\
  \ | 日历日期，取决于实现 |\n| `TIME` | 一天中的时间，取决于实现 |\n| `TIMESTAMP` | 日期和时间，取决于实现 |\n| `BLOB`\
  \ | 二进制大对象 |\n| `CLOB` | 字符大对象 |\n\n在本书中，我们不讨论在使用 `CREATE TABLE` 语句时可以额外子句，例如键和约束。\n\
  \n## 5.3 JDBC 配置\n\n当然，你需要一个提供可用 JDBC 驱动程序的数据库程序。有很多优秀的选择，例如 IBM DB2、Microsoft SQL\
  \ Server、MySQL、Oracle 和 PostgreSQL。\n\n你还必须为你的实验使用创建一个数据库。我们假设将其命名为 `COREJAVA`。创建一个新数据库，或者让你的数据库管理员创建一个具有相应权限的数据库。你需要在数据库中能够创建、更新和删除表。\n\
  \n如果这是你第一次接触数据库，我建议你使用 Apache Derby 数据库，你可以从 `https://db.apache.org/derby` 获取。\n\
  \n或者，如果你熟悉 Docker，可以很容易在 docker 镜像中运行 PostgreSQL：\n\n```\ndocker pull postgres\n\
  docker run -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=COREJAVA -p 5432:5432 -d postgres\n\
  ```\n\n在编写第一个数据库程序之前，你需要收集若干项目。后续章节将涵盖这些项目。\n\n### 5.3.1 数据库 URL\n\n在连接数据库时，你必须使用各种特定的数据库参数，如主机名、端口号和数据库名称。\n\
  \nJDBC 使用与普通 URL 类似的语法来描述数据源。以下是语法示例：\n\n```\njdbc:derby://localhost:1527\njdbc:postgresql:COREJAVA\n\
  ```\n\n这些 JDBC URL 指定了 Derby 数据库和名为 COREJAVA 的 PostgreSQL 数据库。通用格式为：\n\n```\njdbc:derby://localhost:1527/COREJAVA;create=true\n\
  jdbc:postgresql:COREJAVA\n```\n\n`other stuff` 部分取决于使用的协议。\n\n### 5.3.2 JAR 文件\n\
  \n在编写第一个数据库程序之前，你需要获取位于驱动程序中的 JAR 文件。如果你使用 Derby，你需要 `derbyclient.jar`。对于其他数据库，你需要找到相应的驱动。例如，PostgreSQL\
  \ 驱动可以在 `https://postgresql.org` 获取。运行访问数据库的程序时，将驱动 JAR 文件包含在类路径中：\n\n```\njava\
  \ -classpath driverPath\n```\n\n在 Windows 上，使用分号分隔当前目录和驱动 JAR 路径。\n\n### 5.3.3 启动数据库\n\
  \n在连接数据库之前，需要启动数据库服务器。对于 Derby 数据库，按照以下步骤操作：\n\n1. 打开命令行并切换到存储数据库文件的目录。\n2. 在 Derby\
  \ 安装目录找到 `derbyrun.jar` 文件。我们将包含 `derbyrun.jar` 的目录标记为 `derby`。\n3. 运行命令：\n```\n\
  server start\n```\n4. 检查数据库是否工作正常。创建一个 `ij.properties` 文件，包含以下内容：\n```\nij.driver=org.apache.derby.jdbc.ClientDriver\n\
  ij.protocol=jdbc:derby://localhost:1527/\nij.database=COREJAVA;create=true\n```\n\
  从另一个命令行，通过执行以下命令运行 Derby 的交互式脚本工具（称为 `ij`）：\n\n```\njava -jar derby/derbyrun.jar\
  \ ij -p ij.properties\n```\n\n现在你可以发布 SQL 命令，例如：\n\n```\nCREATE TABLE Greetings\
  \ (Message VARCHAR(20));\nINSERT INTO Greetings VALUES ('Hello, World!');\nSELECT\
  \ * FROM Greetings;\nDROP TABLE Greetings;\n```\n\n注意每个命令必须以分号结束。要退出，输入：\n\n```\n\
  EXIT;\n```\n\n5. 使用完数据库后，使用命令停止服务器：\n```\nserver shutdown\n```\n\n\n\n\n驱动程序管理器会遍历已注册的驱动程序，以寻找可以使用数据库\
  \ URL 中指定的子协议的驱动程序。\n\n`getConnection` 方法返回一个 `Connection` 对象。在接下来的章节中，你将看到如何使用\
  \ `Connection` 对象来执行 SQL 语句。\n\n要连接数据库，你需要数据库的用户名和密码。\n\n默认情况下，Derby 允许你使用任何用户名连接，并且不检查密码。它为每个用户生成一套独立的表。默认用户为\
  \ `app`。\n\nListing 5.1 中的测试程序实现了这些步骤。它从名为 `database.properties` 的文件中加载连接参数并连接到数据库。示例代码提供的\
  \ `database.properties` 文件包含 Derby 数据库的连接信息。如果你使用不同的数据库，请将特定数据库的连接信息放入该文件中。这是一个连接\
  \ PostgreSQL 数据库的示例：\n\n```\njdbc.drivers=org.postgresql.Driver\njdbc.url=jdbc:postgresql:COREJAVA\n\
  jdbc.username=dbuser\njdbc.password=secret\n```\n\n连接到数据库后，测试程序将执行以下 SQL 语句：\n\n\
  ```\nCREATE TABLE Greetings (Message VARCHAR(20))\nINSERT INTO Greetings VALUES\
  \ ('Hello, World!')\nSELECT * FROM Greetings\n```\n\n`SELECT` 语句的结果将被打印出来，你应该看到如下输出：\n\
  \n```\nHello, World!\n```\n\n然后通过执行以下语句删除该表：\n\n```\nDROP TABLE Greetings\n```\n\
  \n要运行此测试，请按照前面的描述启动数据库，并如下启动程序：\n\n```\njava -classpath driverJarPath:. test.TestDB\n\
  ```\n\n调试 JDBC 相关问题的一种方法是启用 JDBC 跟踪。调用 `DriverManager.setLogWriter` 方法将跟踪消息发送到 `PrintWriter`。跟踪输出包含\
  \ JDBC 活动的详细列表。大多数 JDBC 驱动程序实现都提供了额外的跟踪机制。例如，使用 Derby 时，你可以为 JDBC URL 添加 `traceFile`选项：`jdbc:derby://localhost:1527/COREJAVA;create=true;traceFile=trace.out`。\n\
  \n从 JDBC 4 开始，驱动程序 JAR 文件包含一个 `META-INF/services/java.sql.Driver` 文件，其中包含驱动程序类的名称。\n\
  \n在极少数使用旧版驱动程序 JAR 的情况下，你需要找到供应商所使用的 JDBC 驱动程序类名。然后在命令行上设置 `jdbc.drivers` 属性：\n\n\
  ```\njava -Djdbc.drivers=driverClassName ProgramName\n```\n\nListing 5.1 v2ch05/test/TestDB.java\n\
  \n```java\npackage v2ch05.test;\n\nimport module java.base;\nimport module java.sql;\n\
  import v2ch05.exec.ExecSQL;\n\n/**\n * 此程序测试数据库和 JDBC 驱动程序是否配置正确。\n */\nclass TestDB\
  \ {\n    void main() throws Exception {\n        try {\n            runTest();\n\
  \        }\n        catch (SQLException e) {\n            for (Throwable t : e)\n\
  \                t.printStackTrace();\n        }\n    }\n\n    /**\n     * 通过创建表、添加值、显示表内容和删除表\n\
  \     * 来运行测试。\n     */\n    void runTest() throws SQLException, IOException {\n\
  \        try (Connection conn = ExecSQL.getConnection()) {\n            Statement\
  \ stat = conn.createStatement();\n            stat.executeUpdate(\"CREATE TABLE\
  \ Greetings (Message VARCHAR(20))\");\n            stat.executeUpdate(\"INSERT INTO\
  \ Greetings VALUES ('Hello, World!')\");\n\n            try (ResultSet result =\
  \ stat.executeQuery(\"SELECT * FROM Greetings\")) {\n                if (result.next())\
  \ System.out.println(result.getString(1));\n            }\n            stat.executeUpdate(\"\
  DROP TABLE Greetings\");\n        }\n    }\n}\n```\n\n`java.sql.DriverManager` 1.1\n\
  \n* `static Connection getConnection(String url, String user, String password)`\n\
  \  建立到给定数据库的连接并返回 `Connection` 对象。\n\n## 5.4. 使用 JDBC 语句\n\n在接下来的章节中，你将看到如何使用 JDBC\
  \ `Statement` 执行 SQL 语句、获取结果并处理错误。然后我们将向你展示一个填充数据库的简单程序。\n\n### 5.4.1. 执行 SQL 语句\n\
  \n要执行 SQL 语句，首先首先创建一个 `Statement` 对象。要创建语句对象，请使用调用 `DriverManager.getConnection`\
  \ 获取的 `Connection` 对象。\n\n```\nStatement stat = conn.createStatement();\n```\n\n\
  接下来，将你想要执行的语句放入字符串中，例如：\n\n```\nString command = \"\"\"\nUPDATE Books\nSET Price\
  \ = Price - 5.00\nWHERE Title NOT LIKE '%Introduction%'\n\"\"\";\n```\n\n然后，调用 `Statement`\
  \ 接口的 `executeUpdate` 方法：\n\n```\nstat.executeUpdate(command);\n```\n\n`executeUpdate`\
  \ 方法返回受 SQL 语句影响的行数，或者对于不返回行数的语句返回零。例如，上一个示例中的对 `executeUpdate` 调用返回了价格降低了 $5.00\
  \ 的行数。\n\n`executeUpdate` 方法可以执行 `INSERT`、`UPDATE` 和 `DELETE` 等操作，以及 `CREATE TABLE`\
  \ 和 `DROP TABLE` 等数据定义语句。然而，你需要使用 `executeQuery` 方法来执行 `SELECT` 查询。此外还有一个通用的 `execute`\
  \ 语句可以执行任意 SQL 语句。它通常仅用于用户查询。\n\n当你执行查询时，你感兴趣的是结果。`executeQuery` 方法返回一个 `ResultSet`\
  \ 类型的对象，你可以使用它来逐个遍历结果。\n\n```\nResultSet rs = stat.executeQuery(\"SELECT * FROM\
  \ Books\");\n```\n\n分析结果集的基本循环如下所示：\n\n```\nwhile (rs.next()) {\n    查看结果中的某行\n\
  }\n```\n\n`ResultSet` 的迭代协议与 `Iterator` 略有不同。在这里，迭代器被初始化到第一行之前的位置。你必须调用一次 `next`\
  \ 方法将迭代器移动到第一行。此外，没有 `hasNext` 方法；持续调用 `next` 直到它返回 `false`。\n\n结果集中行的顺序是完全随机的。除非你特意地使用\
  \ `ORDER BY` 子句对结果进行排序，否则你不应该赋予行顺序以任何重要性。\n\n在检查单行时，你可能想知道字段的内容。大量的访问器方法可以提供这些信息。\n\
  \n```\nString isbn = rs.getString(1);\ndouble price = rs.getDouble(\"Price\");\n\
  ```\n\n有针对各种类型的访问器，例如 `getString` 和 `getDouble`。每个访问器都有两种形式，一个接收数字参数，另一个接收字符串参数。当你提供数字参数时，你通过该数字引用列。例如，`rs.getString(1)`\
  \ 返回当前行第一列的值。\n\n与数组索引不同，数据库的列号从 `1` 开始计数。\n\n当你提供字符串参数时，你通过该名称引用结果集中的列。例如，`rs.getDouble(\"\
  Price\")` 返回标签为 `Price` 的列的值。使用数字参数效率稍高，但字符串参数使代码更易读和维护。\n\n每个 `get` 方法在方法类型与列类型不匹配时都会进行合理的类型转换。例如，调用\
  \ `rs.getString(\"Price\")` 将 `Price` 列的浮点值转换为字符串。\n\n`java.sql.Connection` 1.1\n\
  \n* `Statement createStatement()`\n  创建一个 `Statement` 对象，可用于执行不带参数的 SQL 查询和更新。\n\
  \n* `void close()`\n  立即关闭当前连接及其创建的 JDBC 资源。\n\n`java.sql.Statement` 1.1\n\n* `ResultSet\
  \ executeQuery(String sqlQuery)`\n  执行字符串中给出的 SQL 语句并返回一个 `ResultSet` 对象以查看查询结果。\n\
  \n* `int executeUpdate(String sqlStatement)`\n\n\n\n\n\n*   `long executeLargeUpdate(String\
  \ sqlStatement)`8\n    执行字符串指定的 SQL `INSERT`、`UPDATE` 或 `DELETE` 语句。还会执行数据定义语言（DDL）语句，如\
  \ `CREATE TABLE`。返回受影响的行数，对于没有更新计数的语句，返回 `0`。\n\n*   `boolean execute(String sqlStatement)`\n\
  \    执行字符串指定的 SQL 语句。可能会产生多个结果集和更新计数。如果第一个结果是结果集，则返回 `true`；如果结果是更新计数，则返回 `false`。调用\
  \ `getResultSet` 或 `getUpdateCount` 来获取第一个结果。处理多个结果详细信息请参见文档。\n\n*   `ResultSet\
  \ getResultSet()`\n    返回上一个查询语句的结果集，如果上一个语句没有结果集，则返回 `null`。每个执行的语句仅调用一次此方法。\n\n\
  *   `int getUpdateCount()`\n\n*   `long getLargeUpdateCount()`8\n    返回上一个更新语句受影响的行数；如果上一个语句是没有更新计数的语句，则返回\
  \ `-1`。每个执行的语句仅调用一次此方法。\n\n*   `void close()`\n    关闭此语句对象及其关联的结果集。\n\n*   `boolean\
  \ isClosed()`6\n    如果此语句已关闭，则返回 `true`。\n\n*   `void closeOnCompletion()`7\n  \
  \  导致此语句在所有结果集都关闭后自动关闭。\n\njava.sql.ResultSet1.1\n\n*   `boolean next()`\n    使结果集中的当前行向前移动一行。在最后一行之后返回\
  \ `false`。注意，你必须调用此方法才能移动到第一行。\n\n*   `Xxx` `getXxx(int columnNumber)`\n\n*   `Xxx`\
  \ `getXxx(String columnLabel)`\n    (`Xxx` 是如 `int`、`double`、`String`、`Date`等类型）\n\
  \n*   `<T> T getObject(int columnIndex, Class<T> type)`7\n\n*   `<T> T getObject(String\
  \ columnLabel, Class<T> type)`7\n\n*   `void updateObject(int columnIndex, Object\
  \ x, SQLType targetSqlType)`8\n\n*   `void updateObject(String columnLabel, Object\
  \ x, SQLType targetSqlType)`8\n    返回或更新具有给定列索引或标签的列值，并转换为指定的类型。列标签是 SQL `AS` 子句中指定的标签，如果未使用\
  \ `AS`，则为列名。\n\n*   `int findColumn(String columnName)`\n    给出与列名关联的列索引。\n\n* \
  \  `void close()`\n    立即关闭当前的结果集。\n\n*   `boolean isClosed()`6\n    如果此语句已关闭，则返回\
  \ `true`。\n\n### 5.4.2. 管理连接、语句和结果集\n\n每个 `Connection` 对象都可以创建一个或多个 `Statement`\
  \ 对象。你可以对同一个 `Statement` 对象用于多个互不相关的命令和查询。然而，一个语句*最多有一个*打开的结果集。如果你发布了多个并发并发分析其结果的查询，你则需要多个\
  \ `Statement` 对象。\n\n但请注意，每个连接的语句数量是有限制的。使用 `DatabaseMetaData` 接口的 `getMaxStatements`\
  \ 方法可以找出你的 JDBC 驱动支持的并发打开语句的数量。\n\n在实践中，你可能不需要纠结于多个并发的结果集。如果结果集是相关的，你应该能够发布一个组合查询并分析单个结果。让数据库组合查询比让\
  \ Java 程序遍历多个结果集要高效得多。\n\n在对 `Statement` 对象发布新查询或更新之前，请务必完成对任何结果集的处理。先前的查询的结果集会自动关闭。\n\
  \n当你完成使用一个 `ResultSet`、`Statement` 或 `Connection` 时，立即调用 `close` 方法是一个好主意。这些对象使用了消耗数据库服务器有限资源的大型数据结构。\n\
  \n`Statement` 对象的 `close` 方法会关闭任何关联的结果集。同样，`Connection` 类的 `close` 方法会关闭该连接的所有语句。\n\
  \n相反，你可以在 `Statement` 上调用 `closeOnCompletion` 方法，它将在所有结果集都关闭后立即自动关闭。\n\n如果你的连接是短寿命的，不必担心关闭语句和结果集。为了确保连接对象不可能保持打开，请使用\
  \ `try`-with-resources 语句：\n\n```\n\ntry (Connection conn = . . .) {\n    Statement\
  \ stat = conn.createStatement();\n    ResultSet result = stat.executeQuery(queryString);\n\
  \    process query result\n}\n``````\n\n### 5.4.3. 分析 SQL 异常\n\n每个 `SQLException`\
  \ 都有一个通过 `getNextException` 方法获取的 `SQLException` 对象链。这个异常链是在每个异常都拥有的 `Throwable`\
  \ 对象“原因”链之外的。（详情请参见 第一卷第七章 中的 Java 异常。）需要两个嵌套循环才能完全列出所有这些异常。幸运的是，`SQLException`\
  \ 类已增强以实现 `Iterable<Throwable>` 接口。`iterator()` 方法产生一个遍历这两个链的 `Iterator<Throwable>`：它从遍历第一个\
  \ `SQLException` 的原因链开始，然后移动到下一个 `SQLException`，依此类推。你可以简单地使用增强型 `for` 循环：\n\n```\n\
  for (Throwable t : sqlException) {\n    do something with t\n}\n```\n\n你可以在 `SQLException`\
  \ 上调用 `getSQLState` 和 `getErrorCode`。`getSQLState` 返回的是一个标准化的错误代码（取决于驱动使用的 SQL:2003\
  \ 标准）。错误代码是供应商特定的。\n\nSQL 异常组织成继承树（见图 5.5）。这允许以独立于供应商的方式特定的异常类型。\n\n此外，数据库驱动程序可以将非致命条件报告为警告。你可以从连接、语句和结果集中检索警告。与异常类似，警告是链式的。要检索所有警告，请使用此循环：\n\
  \n```\nSQLWarning w = stat.getWarning();\nwhile (w != null) {\n    do something\
  \ with w\n    w = w.nextWarning();\n}\n```\n\n`SQLWarning` 的子类 `DataTruncation`\
  \ 用于从数据库读取的数据意外意外。如果在更新语句中发生数据截断，则抛出 `DataTruncation` 异常。\n\njava.sql.SQLException1.1\n\
  \n*   `SQLException getNextException()`\n    获取与此异常链的异常；在链的末尾返回 `null`。\n\n*   `Iterator<Throwable>\
  \ iterator()`\n    产生一个遍历异常及其原因的迭代器。\n\n*   `String getSQLState()`\n    获取“SQL 状态”—一个标准化的错误代码。\n\
  \n*   `int getErrorCode()`\n    获取供应商特定的错误代码。\n\njava.sql.SQLWarning1.1\n\n*   `SQLWarning\
  \ getNextWarning()`\n    返回与此警告链的下一个警告；在链的末尾返回 `null`。\n\njava.sql.Connection1.1java.sql.Statement1.1java.sql.ResultSet1.1\n\
  \n*   `SQLWarning getWarnings()`\n    返回第一个等待的警告；如果没有等待警告，则返回 `null`。\n\njava.sql.DataTruncation1.1\n\
  \n*   `boolean getParameter()`\n    如果数据截断适用于参数，则返回 `true`；适用于列，则返回 `false`。\n\n\
  *   `int getIndex()`\n    返回被截断参数或列的索引。\n\n*   `int getDataSize()`\n    返回应该传输的字节数；如果未知，则返回\
  \ `-1`。\n\n*   `int getTransferSize()`\n    返回实际传输的字节数；如果未知，则返回 `-1`。\n\n\n\n\n\n\
  ### 5.4.4. 填充数据库\n\n我们现在准备好编写第一个真实的 JDBC 程序了。当然，如果能尝试之前讨论过的那些花哨查询就好了，但我们面临一个问题：目前数据库中没有任何数据。我们需要填充数据库，一种简单的方法是使用一组\
  \ SQL 指令来创建表并向其中插入数据。大多数数据库程序可以处理来自文本文件的 SQL 指令集，但在语句终止符和其他语法问题上存在一些烦人的差异。\n\n因此，我们将使用\
  \ JDBC 编写简单的程序，读取包含 SQL 指令的文件（每行一条指令）并执行它们。\n\n具体来说，程序从如下格式的文本文件中读取数据：\n\n```\n\
  CREATE TABLE Publishers (Publisher_Id VARCHAR(6), Name VARCHAR(30), URL VARCHAR(80));\n\
  INSERT INTO Publishers VALUES ('0201', 'Addison-Wesley', 'www.aw-bc.com');\nINSERT\
  \ INTO Publishers VALUES ('0471', 'John Wiley & Sons', 'www.wiley.com');\n. . .\n\
  ```\n\n`Listing 5.2` 包含了读取 SQL 语句文件并执行它们的程序。你不需要通读代码；只需使用该程序即可填充数据库，并运行本章剩余部分的示例。\n\
  \n确保你的数据库服务器正在运行，并按照如下方式运行程序：\n\n```\njava -classpath driverJarPath:. v2ch05.exec.ExecSQL\
  \ v2ch05/Books.sql\njava -classpath driverJarPath:. v2ch05.exec.ExecSQL v2ch05/Authors.sql\n\
  java -classpath driverJarPath:. v2ch05.exec.ExecSQL v2ch05/Publishers.sql\njava\
  \ -classpath driverJarPath:. v2ch05.exec.ExecSQL v2ch05/BooksAuthors.sql\n```\n\n\
  在运行程序之前，检查 `database.properties` 文件是否已为环境正确配置（参见 `Section 5.3.4`）。\n\n你的数据库可能也有一个处理\
  \ SQL 文件的工具。例如，使用 Derby，你可以运行：\n\n```\njava -jar derby/lib/derbyrun.jar ij -p ij.properties\
  \ v2ch05/Books.sql\n```\n\n（`ij.properties` 文件在 `Section 5.3.3` 中进行过描述）。\n\n在 `ExecSQL`\
  \ 命令的数据格式中，我们允许每行末尾有一个可选的分号，因为大多数数据库工具都期望这种格式。\n\n以下步骤简要描述了 `ExecSQL` 程序：\n\n1.\
  \  连接到数据库。`getConnection` 方法读取 `database.properties` 文件中的属性，并将 `jdbc.drivers` 属性添加到系统属性中。驱动使用\
  \ `jdbc.drivers` 属性加载适当的数据库驱动程序。`getConnection` 方法使用 `jdbc.url`、`jdbc.username`\
  \ 和 `jdbc.password` 属性打开数据库连接。\n2.  打开包含 SQL 语句的文件。如果没有提供文件名，则提示用户在控制台上输入语句。\n3.\
  \  使用通用的 `execute` 方法执行每条语句。如果返回 `true`，则说明该语句有一个结果集。为书中的数据库提供的四个 SQL 文件都以 `SELECT\
  \ *` 语句结束，以便你可以看到数据已成功插入。\n4.  如果存在结果集，则打印结果。由于这是一个通用的结果集，我们需要使用元数据（metadata）来查找结果有多少列。更多信息，请参见\
  \ `Section 5.8`。\n5.  如果发生任何 SQL 异常，打印该异常以及可能包含其中的任何链式异常。\n6.  关闭与数据库的连接。\n\n`Listing\
  \ 5.2` 显示了程序的代码。\n\nListing 5.2 v2ch05/exec/ExecSQL.java\n\n```java\npackage v2ch05.exec;\n\
  \nimport module java.base;\nimport module java.sql;\n\n/**\n * 执行文件或控制台中所有的 SQL\
  \ 语句。\n */\npublic class ExecSQL {\n    void main(String[] args) throws Exception\
  \ {\n        try (Scanner in = args.length == 0 ? new Scanner(System.in)\n     \
  \           : new Scanner(Path.of(args[0]));\n            Connection conn = getConnection())\
  \ {\n\n            Statement stat = conn.createStatement();\n            while (true)\
  \ {\n                if (args.length == 0) IO.println(\"Enter command or EXIT to\
  \ exit:\");\n\n                if (!in.hasNextLine()) return;\n\n              \
  \  String line = in.nextLine().strip();\n                if (line.equalsIgnoreCase(\"\
  EXIT\")) return;\n                if (line.endsWith(\";\")) // 移除末尾的分号\n       \
  \             line = line.substring(0, line.length() - 1);\n                try\
  \ {\n                    boolean isResult = stat.execute(line);\n              \
  \      if (isResult) {\n                        try (ResultSet rs = stat.getResultSet())\
  \ {\n                            showResultSet(rs);\n                        }\n\
  \                    } else {\n                        int updateCount = stat.getUpdateCount();\n\
  \                        IO.println(updateCount + \" rows updated\");\n        \
  \            }\n                }\n                catch (SQLException e) {\n  \
  \                  for (Throwable t : e)\n                        t.printStackTrace();\n\
  \                }\n            }\n        }\n        catch (SQLException e) {\n\
  \            for (Throwable t : e)\n                t.printStackTrace();\n     \
  \   }\n    }\n\n    /**\n     * 从 database.properties 文件中指定的属性获取连接\n     * @return\
  \ 数据库连接\n     */\n    public static Connection getConnection() throws SQLException,\
  \ IOException {\n        var props = new Properties();\n        try (Reader in =\
  \ Files.newBufferedReader(\n                Path.of(\"v2ch05\", \"database.properties\"\
  ))) {\n            props.load(in);\n        }\n        String drivers = props.getProperty(\"\
  jdbc.drivers\");\n        if (drivers != null) System.setProperty(\"jdbc.drivers\"\
  , drivers);\n\n        String url = props.getProperty(\"jdbc.url\");\n        String\
  \ username = props.getProperty(\"jdbc.username\");\n        String password = props.getProperty(\"\
  jdbc.password\");\n\n        return DriverManager.getConnection(url, username, password);\n\
  \    }\n\n    /**\n     * 打印结果集。\n     * @param result 要打印的结果集\n     */\n    void\
  \ showResultSet(ResultSet result) throws SQLException {\n        ResultSetMetaData\
  \ metaData = result.getMetaData();\n        int columnCount = metaData.getColumnCount();\n\
  \n        for (int i = 1; i <= columnCount; i++) {\n            if (i > 1) IO.print(\"\
  , \");\n            IO.print(metaData.getColumnLabel(i));\n        }\n        IO.println();\n\
  \n        while (result.next()) {\n            for (int i = 1; i <= columnCount;\
  \ i++) {\n                if (i > 1) IO.print(\", \");\n                IO.print(result.getString(i));\n\
  \            }\n            IO.println();\n        }\n    }\n}\n```\n\n## 5.5. 查询执行\n\
  \n在本节中，我们将编写一个针对 `COREJAVA` 数据库执行查询的程序。为了让此程序工作，你必须按照上一节的描述填充 `COREJAVA` 数据库。\n\n\
  在查询数据库时，你可以选择作者和出版社，或者将任一留为 `Any`。\n\n你还可以更改数据库中的数据。选择一个出版社并输入一个金额。该出版社的所有价格将根据你输入的金额进行调整，程序会显示更新了多少行。在更改价格后，你可能想运行查询来验证新价格。\n\
  \n### 5.5.1. 准备语句\n\n在这个程序中，我们使用了一个新特性：准备语句。考虑针对特定出版社的所有书籍的 SQL 查询，无论作者是谁：\n\n```sql\n\
  SELECT Books.Price, Books.Title\nFROM Books, Publishers\nWHERE Books.Publisher_Id\
  \ = Publishers.Publisher_Id\nAND Publishers.Name = 列表框中的名称\n```\n\n\n\n\n\n与其在用户每次启动此类查询时都构建一个独立的查询语句，我们可以使用带有主机变量的\
  \ `prepare` 查询查询并多次使用它，每次为变量填充不同的字符串。这种技术可以提高性能。每当数据库执行查询时，它首先会计算一个高效执行的策略。通过预处理查询并重用它，你可以确保规划步骤只执行一次。\n\
  \n预处理查询中的每个主机变量都用一个 `?` 表示。如果有多个变量，在设置值时，你必须跟踪 `?` 的位置。例如，我们的预处理查询变为：\n\n```\nString\
  \ publisherQuery = \"\"\"\nSELECT Books.Price, Books.Title\nFROM Books, Publishers\n\
  WHERE Books.Publisher_Id = Publishers.Publisher_Id AND Publishers.Name = ?\n\"\"\
  \";\nPreparedStatement pstat = conn.prepareStatement(publisherQuery);\n```\n\n在执行预处理语句之前，你必须使用\
  \ `set` 方法将主机变量绑定到实际值。与 `ResultSet` 接口的 `get` 方法一样，不同类型有不同的 `set` 方法。在这里，我们要为出版商名称设置字符串：\n\
  \n```\npstat.setString(1, publisher);\n```\n\n第一个参数是我们想要设置的主机变量的位置数字。位置 `1` 表示第一个\
  \ `?`。第二个参数是我们要赋值给主机变量的值。\n\n如果你重用一个已经执行过的预处理查询，除非你通过 `set` 方法更改了它们或调用了 `clearParameters`\
  \ 方法，否则所有主机变量都保持绑定。这意味着你只需要对那些在连续查询之间发生变化机变量调用 `setXxx` 方法。\n\n一旦所有变量都绑定了值，你就可以执行预处理语句了：\n\
  \n```\nResultSet rs = pstat.executeQuery();\n```\n\n通过拼接字符串手动构建查询既枯燥又具有潜在危险。你必须担心引号等特殊字符——而且，如果你的查询涉及用户输入，你必须防范注入攻击。因此，只要查询涉及变量，请始终使用预处理语句。\n\
  \n价格更新功能被实现为一个 `UPDATE` 语句。注意，我们调用的是 `executeUpdate` 而不是 `executeQuery`，因为 `UPDATE`\
  \ 语句不返回结果集。`executeUpdate` 的返回值是受影响行数。\n\n```\nint r = stat.executeUpdate();\nIO.println(r\
  \ + \" rows updated\");\n```\n\n在关联的 `Connection` 对象关闭后，`PreparedStatement` 对象将失效。然而，许多数据库会自动\
  \ `cache` 预处理语句。如果预处理两次相同的查询，数据库将简单地重用该查询策略。因此，不必担心调用 `prepareStatement` 的开销。\n\n\
  以下列表简要描述了示例程序的结构：\n\n- 作者和出版商数组通过运行两个查询来填充，这两个查询返回数据库中所有的作者和出版商名称。\n- 涉及作者的查询是复杂的。一本书可能有多个作者，因此\
  \ `BooksAuthors` 表存储了作者与书籍之间的关系。例如，ISBN 为 `0-201-96426-0` 的书有两个代码为 `DATE` 和 `DARW`\
  \ 的作者。`BooksAuthors` 表具有以下行：\n\n```\n0-201-96426-0, DATE, 1\n0-201-96426-0, DARW,\
  \ 2\n```\n以指示这一事实。第三列列出了作者的顺序。（我们不能直接使用表中的行位置。关系型表中没有固定的行顺序。）因此，查询必须连接 `Books`、`BooksAuthors`\
  \ 和 `Authors` 表，以便将作者名称与用户选择的名称进行比较。\n\n```\nSELECT Books.Price, Books.Title FROM\
  \ Books, BooksAuthors, Authors, Publishers\nWHERE Authors.Author_Id = BooksAuthors.Author_Id\
  \ AND BooksAuthors.ISBN = Books.ISBN\nAND Books.Publisher_Id = Publishers.Publisher_Id\
  \ AND Authors.Name = ?\nAND Publishers.Name = ?\n```\n一些 Java 程序员会避免像这样复杂的 SQL 语句。一种意料之外但非常低效的替代方法是编写大量的\
  \ Java 代码来遍历多个结果集。但数据库执行查询代码的能力远比 Java 程序要 `好得多`——这是数据库的核心竞争力。一个经验法则：如果你可以在 SQL\
  \ 中完成，就不要在 Java 中完成。\n- `changePrices` 方法执行一个 `UPDATE` 语句。注意 `UPDATE` 语句的 `WHERE`\
  \ 子句需要出版商 `code`，而我们只知道出版商的 `name`。这个问题通过嵌套子查询解决：\n\n```\nUPDATE Books\nSET Price\
  \ = Price + ?\nWHERE Books.Publisher_Id = (SELECT Publisher_Id FROM Publishers WHERE\
  \ Name = ?)\n```\n\nListing 5.3 是完整的程序代码。\n\nListing 5.3 v2ch05/query/QueryDemo.java\n\
  \n\n\n\n\n```java\npackage v2ch05.query;\n\nimport module java.base;\nimport module\
  \ java.sql;\nimport v2ch05.exec.ExecSQL;\n\n/**\n * 此程序演示了几个复杂的数据库查询。\n */\nclass\
  \ QueryDemo {\n    String allQuery = \"SELECT Books.Price, Books.Title FROM Books\"\
  ;\n\n    String authorPublisherQuery = \"\"\"\nSELECT Books.Price, Books.Title\n\
  FROM Books, BooksAuthors, Authors, Publishers\nWHERE Authors.Author_Id = BooksAuthors.Author_Id\n\
  \    AND BooksAuthors.ISBN = Books.ISBN\n    AND Books.Publisher_Id = Publishers.Publisher_Id\n\
  \    AND Authors.Name = ?\n    AND Publishers.Name = ?\n\"\"\";\n\n    String authorQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title FROM Books, BooksAuthors, Authors\n\
  WHERE Authors.Author_Id = BooksAuthors.Author_Id\"\n    AND BooksAuthors.ISBN =\
  \ Books.ISBN\"\n    AND Authors.Name = ?\n\"\"\";\n\n    String publisherQuery =\
  \ \"\"\"\nSELECT Books.Price, Books.Title FROM Books, Publishers\nWHERE Books.Publisher_Id\
  \ = Publishers.Publisher_Id\n    AND Publishers.Name = ?\n\"\"\";\n\n    String\
  \ priceUpdate = \"\"\"\nUPDATE Books SET Price = Price + ? \"\nWHERE Books.Publisher_Id\
  \ =\n    (SELECT Publisher_Id FROM Publishers WHERE Name = ?)\n\"\"\";\n\n    ArrayList<String>\
  \ authors = new ArrayList<>();\n    ArrayList<String> publishers = new ArrayList<>();\n\
  \n    void main() throws Exception {\n        try (Connection conn = ExecSQL.getConnection())\
  \ {\n            authors.add(\"Any\");\n            publishers.add(\"Any\");\n \
  \           try (Statement stat = conn.createStatement()) {\n                //\
  \ 填充 authors 列表\n                String query = \"SELECT Name FROM Authors\";\n\
  \                try (ResultSet rs = stat.executeQuery(query)) {\n             \
  \       while (rs.next())\n                        authors.add(rs.getString(1));\n\
  \                }\n\n                // 填充 publishers 列表\n                query\
  \ = \"SELECT Name FROM Publishers\";\n                try (ResultSet rs = stat.executeQuery(query))\
  \ {\n                    while (rs.next())\n                        publishers.add(rs.getString(1));\n\
  \                }\n            }\n            boolean done = false;\n         \
  \   while (!done) {\n                String input = IO.readln(\"Q)uery C)hange prices\
  \ E)xit: \").toUpperCase();\n                if (input.equals(\"Q\"))\n        \
  \            executeQuery(conn);\n                else if (input.equals(\"C\"))\n\
  \                    changePrices(conn);\n                else\n               \
  \     done = true;\n            }\n        }\n        catch (SQLException e) {\n\
  \            for (Throwable t : e)\n                IO.println(t.getMessage());\n\
  \        }\n    }\n\n    /**\n     * 执行选定的查询。\n     * @param conn 数据库连接\n     */\n\
  \    void executeQuery(Connection conn) throws SQLException {\n        String author\
  \ = select(\"Authors:\", authors);\n        String publisher = select(\"Publishers:\"\
  , publishers);\n        PreparedStatement stat;\n        if (!author.equals(\"Any\"\
  ) && !publisher.equals(\"Any\")) {\n            stat = conn.prepareStatement(authorPublisherQuery);\n\
  \            stat.setString(1, author);\n            stat.setString(2, publisher);\n\
  \        }\n        else if (!author.equals(\"Any\") && publisher.equals(\"Any\"\
  )) {\n            stat = conn.prepareStatement(authorQuery);\n            stat.setString(1,\
  \ author);\n        }\n        else if (author.equals(\"Any\") && !publisher.equals(\"\
  Any\")) {\n            stat = conn.prepareStatement(publisherQuery);\n         \
  \   stat.setString(1, publisher);\n        }\n        else\n            stat = conn.prepareStatement(allQuery);\n\
  \n        try (ResultSet rs = stat.executeQuery()) {\n            while (rs.next())\n\
  \                IO.println(rs.getString(1) + \", \" + rs.getString(2));\n     \
  \   }\n    }\n\n    /**\n     * 执行更新语句以更改价格。\n     * @param conn 数据库连接\n     */\n\
  \    void changePrices(Connection conn) throws SQLException {\n        String publisher\
  \ = select(\"Publishers:\", publishers.subList(1, publishers.size()));\n       \
  \ double priceChange = Double.parseDouble(IO.readln(\"Change prices by: \"));\n\
  \        PreparedStatement stat = conn.prepareStatement(priceUpdate);\n        stat.setDouble(1,\
  \ priceChange);\n        stat.setString(2, publisher);\n        int r = stat.executeUpdate();\n\
  \        IO.println(r + \" records updated.\");\n    }\n\n    /**\n     * 请求用户选择一个字符串。\n\
  \     * @param prompt 要显示的提示信息\n     * @param options 用户可以从中选择的选项\n     * @return\
  \ 用户选择的选项\n     */\n    String select(String prompt, List<String> options) {\n \
  \       while (true) {\n            IO.println(prompt);\n            for (int i\
  \ = 0; i < options.size(); i++)\n                IO.println(\"%2d) %s\".formatted(i\
  \ + 1, options.get(i)));\n            int sel = Integer.parseInt(IO.readln());\n\
  \            if (sel > 0 && sel <= options.size()) return options.get(sel - 1);\n\
  \        }\n    }\n}\n```\n\n`java.sql.Connection1.1`\n\n*   `PreparedStatement\
  \ prepareStatement(String sql)`\n    返回一个包含预编译语句的 `PreparedStatement` 对象。字符串 `sql`\
  \ 包含一个有一个或多个由 `?` 字符表示的参数占位符的 SQL 语句。\n\n`java.sql.PreparedStatement1.1`\n\n*  \
  \ `void setString(int n, String x)`\n    设置第 `n` 个参数为 `x`。\n*   `void setDouble(int\
  \ n, double x)`\n    设置第 `n` 个参数为 `x`。\n*   `void clearParameters()`\n    清除所有参数。\n\
  *   `ResultSet executeQuery()`\n    执行查询并返回一个 `ResultSet` 对象。\n*   `int executeUpdate()`\n\
  \    执行 `INSERT`、`UPDATE` 或 `DELETE` 语句。返回影响的行数，或者对于 DDL 语句返回 `0`（如 `CREATE TABLE`）。\n\
  ...\n\n### 5.5.2 读取和写入 LOB\n\n除了数字、字符串和日期外，许多数据库还可以存储大对象（LOB），例如图像或其他数据。取决于应用程序是将大对象存储在数据库中还是文件系统中。在\
  \ SQL 中，二进制大对象被称为 BLOB，字符大对象被称为 CLOB。\n\n读取 LOB 需要执行 `SELECT` 语句并在 `ResultSet` 上调用\
  \ `getBlob` 或 `getClob` 方法。这将得到一个 `Blob` 或 `Clob` 类型的对象。例如，如果你有一个封面表，可以这样检索图片：\n\
  \n```java\nPreparedStatement stat\n    = conn.prepareStatement(\"SELECT Cover FROM\
  \ BookCovers WHERE ISBN=?\");\n// ...\nstat.set(1, isbn);\ntry (ResultSet result\
  \ = stat.executeQuery()) {\n    if (result.next()) {\n       Blob coverBlob = result.getBlob(1);\n\
  \       Image coverImage = ImageIO.read(coverBlob.getBinaryStream());\n    }\n}\n\
  ```\n\n同样，如果你检索到一个 `Clob` 对象，可以通过调用 `getSubString` 或 `getCharacterStream` 方法获取字符数据。\n\
  \n写入 LOB 需要在 `Connection` 对象上调用 `createBlob` 或 `createClob`，获取 LOB 的输出流或写入器，写入数据并存储在数据库中。例如，这是存储图像的方法：\n\
  \n```java\nBlob coverBlob = connection.createBlob();\nint offset = 0;\nOutputStream\
  \ out = coverBlob.setBinaryStream(offset);\nImageIO.write(coverImage, \"PNG\", out);\n\
  PreparedStatement pstat = conn.prepareStatement(\"INSERT INTO Cover VALUES (?, ?)\"\
  );\npstat.set(1, isbn);\npstat.set(2, coverBlob);\npstat.executeUpdate();\n```\n\
  \n`java.sql.ResultSet1.1`\n\n*   `Blob getBlob(int columnIndex)`1.2\n*   `Blob getBlob(String\
  \ columnLabel)`1.2\n*   `Clob getClob(int columnIndex)`1.2\n*   `Clob getClob(String\
  \ columnLabel)`1.2\n    获取指定列的 BLOB 或 CLOB。\n\n`java.sql.Blob1.2`\n\n*   `long length()`\n\
  \    获取此 BLOB 的长度。\n*   `byte[] getBytes(long startPosition, long length)`\n   \
  \ 从此 BLOB 获取给定范围内的数据。\n*   `InputStream getBinaryStream()`\n\n\n\n\n\n* `InputStream\
  \ getBinaryStream(long startPosition, long length)`\n\n    返回一个流，用于从此 BLOB 或指定范围读取数据。\n\
  \n* `OutputStream setBinaryStream(long startPosition)` 1.4\n\n    返回一个输出流，用于向此 BLOB\
  \ 写入，从给定的位置开始。\n\n`java.sql.Clob`1.4\n\n* `long length()`\n\n    获取此 CLOB 的字符数。\n\
  \n* `String getSubString(long startPosition, long length)`\n\n    获取此 CLOB 中指定范围内的字符。\n\
  \n* `Reader getCharacterStream()`\n\n* `Reader getCharacterStream(long startPosition,\
  \ long length)`\n\n    返回一个读取器（不是流），用于从此 CLOB 或指定范围读取字符。\n\n* `Writer setCharacterStream(long\
  \ startPosition)` 1.4\n\n    返回一个写入器（不是流），用于向此 BLOB 写入，从给定的位置开始。\n\n`java.sql.Connection`1.1\n\
  \n* `Blob createBlob()` 6\n\n* `Clob createClob()` 6\n\n    创建一个空的 BLOB 或 CLOB。\n\
  \n### 5.5.3. SQL 转义（SQL Escapes）\n\n数据库通常支持“转义”语法功能，但使用的是特定数据库的语法变体。JDBC 程序的工作是将转义语法翻译为特定数据库的语法。\n\
  \n以下功能提供了转义：\n\n*   日期和时间字面量\n*   调用标量函数\n*   调用存储过程\n*   外连接\n*   `LIKE` 子句中的转义字符\n\
  \n日期和时间字面量在数据库之间差异很大。要嵌入日期或时间字面量，请按下方所示 ISO 8601/RFC 3339 之一指定值，其中毫秒是可选的。驱动程序随后将其转换为原生格式。使用\
  \ `d`、`t`、`ts` 分别 `DATE`、`TIME` 或 `TIMESTAMP` 值：\n\n```\n{d '2024-01-24'}\n{t '23:59:59'}\n\
  {ts '2024-01-24 23:59:59.999'}\n```\n\n*标量函数*（scalar function）是返回单个值的函数。许多函数在数据库中广泛可用，但名称各异。JDBC\
  \ 规范提供了标准名称并将其翻译为特定数据库的名称。要调用函数，请如下所示嵌入标准函数名和参数：\n\n```\n{fn left(?, 20)}\n{fn user()}\n\
  ```\n\n你可以在 JDBC 规范中找到支持的函数名的完整列表。\n\n两个表的*外连接*（outer join）并不要求每个表的行都根据连接条件进行匹配。例如，查询\n\
  \n\n\n```\nSELECT * FROM {oj Books LEFT OUTER JOIN Publishers\nON Books.Publisher_Id\
  \ = Publisher.Publisher_Id}\n```\n\n包含了某些 `Publisher_Id` 在 `Publishers` 表中没有匹配项的书籍，并用\
  \ `NULL` 值表示不存在匹配。你需要使用 `RIGHT OUTER JOIN` 来包含没有匹配书籍的出版者，或者使用 `FULL OUTER JOIN`\
  \ 返回这两者。大多数数据库都支持所有形式的外连接，但某些并不支持。`oj` 转义允许 JDBC 程序程序定位并重写任何不支持的外连接操作。如果你的数据库支持所有形式的外连接，则无需担心这种转义。\n\
  \n最后，`_` 和 `%` 字符在 `LIKE` 子句中具有特殊含义——用于匹配单个字符或字符序列。没有标准方法可以字面地使用它们。如果你想匹配包含 `_`\
  \ 的所有字符串，请使用此结构：\n\n```\n. . . WHERE ? LIKE %!_% {escape '!'}\n```\n\n在这里我们将 `!`\
  \ 定义为转义字符。组合 `!_` 表示字面上的下划线。\n\n*存储过程*（stored procedure）是在数据库中执行的程序，使用特定数据库的语言编写。要调用存储过程，请使用\
  \ `call` 转义。如果过程没有参数，则不需要提供括号。使用 `=` 来捕获返回值：\n\n```\n{call PROC1(?, ?)}\n{call PROC2}\n\
  {call ? = PROC3(?)}\n```\n\n你需要使用 `CallableStatement` 接口来执行存储过程。设置所有输入参数并指定任何输出的类型。\n\
  \n```\nCallableStatement cstat = conn.prepareCall(\"{call PROC4(?, ?)}\")\ncstat.setInt(1,\
  \ id);\ncstat.registerOutParameter(2, java.sql.Types.VARCHAR);\ncstat.execute();\n\
  String name = cstat.getString(2);\n```\n\n### 5.5.4. 多结果\n\n查询可能会返回多个结果集或更新计数。这发生在执行存储过程时，或者允许在单个查询中提交多个\
  \ `SELECT` 语句的数据库中。以下是检索所有结果集的方法：\n\n1. 使用 `execute` 方法执行 SQL 语句。\n2. 获取第一个结果集或更新计数。\n\
  3. 重复调用 `getMoreResults` 方法移动到下一个结果集或更新计数。\n4. 当没有更多结果集或更新计数时结束。\n\n如果链中的下一项是结果集，则\
  \ `execute` 和 `getMoreResults` 方法返回 `true`。如果链中的下一项不是更新计数，则 `getUpdateCount` 方法返回\
  \ `-1`。\n\n以下循环遍历了所有结果：\n\n```\nboolean isResult = stat.execute(command);\nboolean\
  \ done = false;\nwhile (!done) {\n    if (isResult) {\n        ResultSet result\
  \ = stat.getResultSet();\n        do something with result\n    } else {\n     \
  \   int updateCount = stat.getUpdateCount();\n        if (updateCount >= 0)\n  \
  \          do something with updateCount\n        else\n            done = true;\n\
  \    }\n    if (!done) isResult = stat.getMoreResults();\n}\n```\n\n`java.sql.Statement`1.1\n\
  \n* `getMoreResults()`\n\n* `getMoreResults(int current)`\n\n    获取此语句的下一个结果。`current`\
  \ 参数为 `CLOSE_CURRENT_RESULT`、`KEEP_CURRENT_RESULT` 或 `CLOSE_ALL_RESULTS` 之一。如果下一个结果是结果集，则返回\
  \ `true`。\n\n### 5.5.5. 获取自动生成键\n\n大多数数据库支持行的自动编号。遗憾的是，机制差异很大。这些自动数字通常用于主键。虽然 JDBC\
  \ 没有提供生成无关的解决方案，但提供了检索它们的方法。当你向表中插入新行并生成键时，可以使用以下代码检索：\n\n```\nstat.executeUpdate(insertStatement,\
  \ Statement.RETURN_GENERATED_KEYS);\nResultSet rs = stat.getGeneratedKeys();\nif\
  \ (rs.next()) {\n    int key = rs.getInt(1);\n    . . .\n}\n```\n\n`java.sql.Statement`1.1\n\
  \n* `execute(String statement, int autogenerated)` 1.4\n\n* `executeUpdate(String\
  \ statement, int autogenerated)` 1.4\n\n    如之前所述执行指定的 SQL 语句。如果 `autogenerated`\
  \ 设置为 `Statement.RETURN_GENERATED_KEYS` 且语句是 `INSERT` 语句，则第一列包含生成的键。\n\n## 5.6.\
  \ 可滚动和更新的结果集\n\n默认情况下，结果集是不可滚动且不可更新的。为了从查询获取可滚动的结果集，你必须使用方法获取不同的 `Statement` 对象\n\
  \n```\nStatement stat = conn.createStatement(type, concurrency);\n```\n\n对于准备语句，使用调用\n\
  \n```\nPreparedStatement pstat = conn.prepareStatement(command, type, concurrency);\n\
  ```\n\n### 5.6.1. 可滚动结果集\n\n\n\n\n\n`type` 和 `concurrency` 的可能值列在 表 5.6 中。你有以下选择：\n\
  \n* 你希望结果集是可滚的吗？如果不，请使用 `ResultSet.TYPE_FORWARD_ONLY`。\n* 如果结果集是可滚的，你希望它反映在产生该结果集的查询之后发生的数据库更改吗？（在讨论中，我们假设可滚结果集使用了\
  \ `ResultSet.TYPE_SCROLL_INSENSITIVE` 设置。这意味着结果集不会“感知”查询执行后发生的数据库更改。）\n* 你是否希望通过编辑结果集来更新数据库？（详细信息请参阅下一节。）\n\
  \n### 表 5.6：`ResultSet` 类型和并发性值\n\n| 值 | 解释 |\n| --- | --- |\n| `TYPE_FORWARD_ONLY`\
  \ | 结果集不可滚（默认值）。 |\n| `TYPE_SCROLL_INSENSITIVE` | 结果集是可滚的，但对数据库更改不敏感。 |\n| `TYPE_SCROLL_SENSITIVE`\
  \ | 结果集是可滚的，且对数据库更改敏感。 |\n| `CONCUR_READ_ONLY` | 结果集不能用于更新数据库（默认值）。 |\n| `CONCUR_UPDATABLE`\
  \ | 结果集可以用于更新数据库。 |\n\n例如，如果你只是想要能够滚动结果集但不想编辑其数据，请使用：\n\n```\nStatement stat = conn.createStatement(\n\
  \    ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n```\n\n所有由调用返回的结果集\n\
  \n``````\nResultSet rs = stat.executeQuery(query);\n```````\n\n现在都是可滚的。可滚结果集有一个指示当前位置的\
  \ `cursor`。\n\n并不是所有的数据库驱动程序都支持可滚或可更新的结果集。（`DatabaseMetaData` 接口的 `supportsResultSetType`\
  \ 和 `supportsResultSetConcurrency` 方法将告诉使用特定驱动程序的数据库支持哪些类型和并发模式。）即使数据库支持所有结果集模式，特定的查询也可能无法产生你所要求的所有属性的结果集。（例如，复杂查询的结果集可能是不可更新的。）在这种情况下，`executeQuery`\
  \ 方法将返回一个能力较弱的 `ResultSet`，并向连接对象添加一个 `SQLWarning`。（Section 5.4.3 显示了如何检索警告。）或者，你可以使用\
  \ `ResultSet` 接口的 `getType` 和 `getConcurrency` 方法来查找结果集实际拥模式。如果你没有检查结果集的能力并执行了不支持的操作（例如在不可滚的结果集上执行\
  \ `previous`），操作将抛出 `SQLException`。\n\n滚动非常简单。使用：\n\n```\nif (rs.previous()) . ./;\n\
  ```\n\n来向后滚动。如果游标位于实际行上，则返回 `true`；如果现在位于第一行之前，则返回 `false`。\n\n你可以通过调用将游标向后移动任意行：\n\
  \n```\nrs.relative(n);\n```\n\n如果 `n` 为正数，游标向前移动。如果 `n` 为负数，则向后移动。如果 `n` 为零，则调用没有影响。如果你尝试将游标移动到当前行集之外，它将设置为指向最后一行之后或第一行之前，取决于\
  \ `n` 的正负号。然后，方法返回 `false` 且游标不会移动。如果游标位于实际行上，则方法返回 `true`。\n\n或者，你可以将游标设置为特定的行号：\n\
  \n```\nrs.absolute(n);\n```\n\n要获取当前行号，请调用：\n\n```\nint currentRow = rs.getRow();\n\
  ```\n\n结果集中的第一行数字为 `1`。如果返回值为 `0`，则游标当前不在行上——它位于第一行之前或最后一行之后。便利方法 `first`、`last`、`beforeFirst`\
  \ 和 `afterLast` 将游标移动到第一行、最后一行、第一行之前或最后一行之后。\n\n最后，方法 `isFirst`、`isLast`、`isBeforeFirst`\
  \ 和 `isAfterLast` 测试游标是否位于这些特殊位置。\n\n使用可滚结果集非常简单。缓存查询数据的复杂工作由数据库驱动程序在后台完成。\n\n###\
  \ 5.6.2. 可更新的结果集\n\n如果你想编辑结果集中的数据并让更改自动反映在数据库中，请创建一个更新的结果集。可更新的结果集不必是可滚的，但如果你向用户展示数据以便编辑，你通常也希望允许滚动。\n\
  \n要获取可更新的结果集，请如下方式创建语句：\n\n```\nStatement stat = conn.createStatement(\n    ResultSet.TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n```\n\n随后调用 `executeQuery` 返回的结果集将是可更新的。\n\n并不是所有查询都返回可更新的结果集。如果你的查询涉及多个表的连接，结果可能不可更新的。然而，如果你的查询仅涉及单个表，或者通过主键连接了多个表，你应该预期结果集是可更新的。注意，你无法影响新数据在结果集或数据库中添加的*位置*。\n\
  \n如果你在插入行中未指定列值，它将被设置为 SQL `NULL`。然而，如果该列具有 `NOT NULL` 约束，将抛出异常且不会插入该行。\n\n最后，你可以删除游标所在的行：\n\
  \n```\nrs.deleteRow();\n```\n\n`deleteRow` 方法会立即从结果集和数据库中删除该行。\n\n\n\n\n\n`ResultSet`\
  \ 接口的 `updateRow`、`insertRow` 和 `deleteRow` 方法提供了与执行 `UPDATE`、`INSERT` 和 `DELETE`\
  \ SQL 语句相同的功能。然而，Java 程序员可能会发现，通过结果集操作数据库内容比通过构建 SQL 语句更自然。\n\n如果你不小心，使用可更新的结果集可能会写出执行效率极低的代码。直接执行一个\
  \ `UPDATE` 语句比执行查询并在遍历结果的过程中不断修改数据要高效`much`**多得多**。可更新的结果集对于用户可以进行任意更改的交互式程序是有意义的，但对于大多数程序化的更改，SQL\
  \ `UPDATE` 更为合适。\n\nJDBC 2 对结果集进行了进一步增强，例如，如果数据已被另一个并发数据库连接修改，则允许使用最新数据更新结果集的能力。JDBC\
  \ 3 进一步增加了另一项改进，规定了在事务提交时结果集的行为。然而，这些高级级功能超出了本介绍性章节的范围。有关更多信息，请参阅 Maydene Fisher、Jon\
  \ Ellis 和 Jonathan Bruce 编写的 *JDBC^™ API Tutorial and Reference, Third Edition*（Addison-Wesley,\
  \ 2003）以及 JDBC 规范。\n\n### `java.sql.Connection`\n\n* `Statement createStatement(int\
  \ type, int concurrency)`\n* `PreparedStatement prepareStatement(String command,\
  \ int type, int concurrency)`\n  创建一个语句或预编译语句，产生具有给定类型和并发性的的结果集。`type` 参数为常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一，`concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一，这些常量都定义在 `ResultSet` 接口中。\n\n### `java.sql.ResultSet`\n\n* `int getType()`\n\
  \  返回此结果集的类型——`TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`\
  \ 之一。\n* `int getConcurrency()`\n  返回此结果集的并发设置——`CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一。\n* `boolean previous()`\n  将游标移动到上一行。如果游标位于某行，则返回 `true`；如果游标位于第一行之前，则返回 `false`。\n\
  * `int getRow()`\n  获取当前行号。行从 `1` 开始编号。\n* `boolean absolute(int r)`\n  将游标移动到第\
  \ `r` 行。如果游标位于某行，则返回 `true`。\n* `boolean relative(int d)`\n  将游标移动 `d` 行。如果 `d`\
  \ 为负数，游标向后移动。如果游标位于某行，则返回 `true`。\n* `boolean first()`\n* `boolean last()`\n  将游标移动到第一行或最后一行。如果游标位于某行，返回\
  \ `true`。\n* `void beforeFirst()`\n* `void afterLast()`\n  将游标移动到第一行之前或最后一行之后。\n\
  * `boolean isFirst()`\n* `boolean isLast()`\n  测试游标是否在第一行或最后一行。\n* `boolean isBeforeFirst()`\n\
  * `boolean isAfterLast()`\n  测试游标是否在第一行之前或最后一行之后。\n* `void moveToInsertRow()`\n\
  \  将游标移动到插入行。插入行是一个用于通过 `updateXxx` 和 `insertRow` 方法插入新数据的特殊行。\n* `void moveToCurrentRow()`\n\
  \  将游标从插入行移回调用 `moveToInsertRow` 方法时所占据的行。\n* `void insertRow()`\n  将插入行的内容插入数据库和结果集。\n\
  * `void deleteRow()`\n  从数据库和结果集中删除当前行。\n* `void updateXxx(int column, Object data)`\n\
  * `void updateXxx(String columnName, Object data)`\n  (`Xxx` 是某种类型，如 `int`、`double`、`String`、`Date`\
  \ 等）\n  更新结果集当前行中的某个字段。\n* `void updateRow()`\n  将当前行的更新发送到数据库。\n* `void cancelRowUpdates()`\n\
  \  取消当前行的更新。\n\n### `java.sql.DatabaseMetaData`\n\n* `boolean supportsResultSetType(int\
  \ type)`\n  如果数据库支持给定类型的结果集，则返回 `true`；`type` 是 `ResultSet` 接口的常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一。\n* `boolean supportsResultSetConcurrency(int type,\
  \ int concurrency)`\n  如果数据库支持给定类型和并发组合的结果集，则返回 `true`。`type` 参数是常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一，`concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一，这些常量都定义在 `ResultSet` 接口中。\n\n## 5.7. Row Sets\n\n可滚动的结果集非常强大，但它们有一个主要的缺点：你需要在整个用户交互期间保持数据库连接开启。然而，用户可能会离开电脑很长时间，导致连接被占用。这并不好——数据库连接是稀缺资源。在这种情况下，请使用\
  \ `row set`（行集）。`RowSet` 接口扩展了 `ResultSet` 接口，但行集不需要绑定到数据库连接。行集适用于用户可以进行任意更改的交互式程序，但对于大多数程序化的更改，SQL\
  \ `UPDATE` 更为合适。\n\nJDBC 2 对结果集进行了进一步增强，例如，如果数据已被另一个并发数据库连接修改，则允许使用最新数据更新结果集。JDBC\
  \ 3 进一步增加了另一项改进，规定了在事务提交时结果集的行为。然而，这些高级功能超出了本介绍性章节的范围。有关更多信息，请参阅 Maydene Fisher、Jon\
  \ Ellis 和 Jonathan Bruce 编写的 *JDBC^™ API Tutorial and Reference, Third Edition*（Addison-Wesley,\
  \ 2003）以及 JDBC 规范。\n\n### 5.7.1. Constructing Row Sets\n\n`javax.sql.rowset` 包提供了以下扩展\
  \ `RowSet` 的接口：\n\n* `CachedRowSet` 允许离线操作。我们将在后续章节讨论缓存行集。\n* `WebRowSet` 是可以保存到\
  \ XML 文件的缓存行集。该 XML 文件可以移动到应用程序的另一层，由另一个 `WebRowSet` 对象打开。\n* `FilteredRowSet` 和\
  \ `JoinRowSet` 接口支持轻量级操作，等同于 SQL `SELECT` 和 `JOIN` 操作。这些操作在存储在行集中的数据上执行，无需建立数据库连接。\n\
  * `JdbcRowSet` 是对 `ResultSet` 的薄封装。它增加了来自 `RowSet` 接口的实用方法。\n\n要获取缓存行集，调用：\n\n```\n\
  RowSetFactory factory = RowSetProvider.newFactory();\nCachedRowSet crs = factory.createCachedRowSet();\n\
  ```\n\n获取其他行集类型的方法类似。\n\n### 5.7.2. Cached Row Sets\n\n缓存行集包含了结果集的所有数据。由于 `CachedRowSet`\
  \ 是 `ResultSet` 接口的子接口，你可以像使用结果集一样使用缓存行集。缓存行集带来了一个重要的好处：你可以关闭连接并继续使用行集。正如我们在 Listing\
  \ 5.4 中所示，这极大地简化了交互式程序的实现。每个用户命令只需打开数据库连接，执行查询，将结果放入缓存行集，然后关闭数据库连接。\n\n甚至可以修改缓存行集中的数据。当然，修改不会立即反映在数据库中；你需要显式地请求接受积累的更改。随后\
  \ `CachedRowSet` 会重新连接到数据库并执行 SQL 语句来写入这些积累的更改。\n\n你可以从结果集填充 `CachedRowSet`：\n\n\
  ```\nResultSet result = . . .;\nRowSetFactory factory = RowSetProvider.newFactory();\n\
  CachedRowSet crs = factory.createCachedRowSet();\ncrs.populate(result);\nconn.close();\
  \ // 现在可以关闭数据库连接了\n```\n\n\n\n或者，你可以让 `CachedRowSet` 对象自动建立连接。设置数据库参数：\n\n```\n\
  crs.setURL(\"jdbc:derby://localhost:1527/COREJAVA\");\ncrs.setUsername(\"dbuser\"\
  );\ncrs.setPassword(\"secret\");\n```\n\n然后设置查询语句和任何参数：\n\n```\ncrs.setCommand(\"\
  SELECT * FROM Books WHERE Publisher_Id = ?\");\ncrs.setString(1, publisherId);\n\
  ```\n\n最后，用查询结果填充行集：\n\n```\ncrs.execute();\n```\n\n此调用会建立数据库连接、发布查询、填充行集并断开连接。\n\
  \n如果你的查询结果非常大，你可能不想将其全部放入行集中的。毕竟，你的用户可能只查看某几行。在这种情况下，请指定一个页面大小：\n\n```\nCachedRowSet\
  \ crs = . . .;\ncrs.setCommand(command);\ncrs.setPageSize(20);\n. . .\ncrs.execute();\n\
  ```\n\n现在你将只会获得 20 行。要获取下一批行，请调用\n\n```\ncrs.nextPage();\n```\n\n你可以使用与处理结果集相同的方法来检查和修改行集。如果你修改了行集的内容，必须通过调用以下方法将其写回数据库：\n\
  \n```\ncrs.acceptChanges(conn);\n```\n\n或者\n\n```\ncrs.acceptChanges();\n```\n\n\
  只有当你在配置行集时包含了连接到数据库所需的信息（如 URL、用户名和密码）时，第二次调用才有效。\n\n在 第 5.6.2 节 中，你已经看到并不是所有的结果集都是可更新的。同样，包含复杂查询结果的行集将无法将其更改写回数据库。如果你的行集包含来自单个表的数据，那么通常是安全的。\n\
  \n如果你是从结果集填充行集的，那么行集并不知道要更新的表名。你需要调用 `setTableName` 来设置表名。\n\n如果你在填充完行集之后，数据库中的数据发生了变化，就会出现另一个复杂性。这显然是可能导致数据不一致的故障迹象。参考实现会检查原始行集值（即编辑前的值）与数据库中的当前值是否相同。如果是，它们将用编辑后的值替换；否则，将抛出\
  \ `SyncProviderException` 且所有更改都不会写入。其他实现可能使用其他策略进行同步。\n\n### `javax.sql.RowSet1.4`\n\
  \n* `String getURL()`\n* `void setURL(String url)`\n  获取或设置数据库 URL。\n* `String getUsername()`\n\
  * `void setUsername(String username)`\n  获取或设置连接数据库的用户名。\n* `String getPassword()`\n\
  * `void setPassword(String password)`\n  获取或设置连接数据库的密码。\n* `String getCommand()`\n\
  * `void setCommand(String command)`\n  获取或设置用于填充此行集的执行执行命令。\n* `void execute()`\n\
  \  通过发布用 `setCommand` 设置的语句来填充此行集。为了让驱动管理器获取连接，必须设置 URL、用户名和密码。\n\n### `javax.sql.rowset.CachedRowSet5.0`\n\
  \n* `void execute(Connection conn)`\n  通过发布用 `setCommand` 设置的语句来填充此行集。此方法使用给定的连接*并关闭它*。\n\
  * `void populate(ResultSet result)`\n  用给定结果集的数据填充此缓存行集。\n* `String getTableName()`\n\
  * `void setTableName(String tableName)`\n  获取或设置填充此缓存行集的表名。\n* `int getPageSize()`\n\
  * `void setPageSize(int size)`\n  获取或设置页面大小。\n* `boolean nextPage()`\n* `boolean\
  \ previousPage()`\n  加载下一页或上一页行。如果有下一页或上一页，则返回 `true`。\n* `void acceptChanges()`\n\
  * `void acceptChanges(Connection conn)`\n  重新连接到数据库并写入编辑行集产生的更改。如果因为数据库数据已更改而无法写回，可能会抛出\
  \ `SyncProviderException`。\n\n### `javax.sql.rowset.RowSetProvider7`\n\n* `static\
  \ RowSetFactory newFactory()`\n  创建一个行集工厂。\n\n### `javax.sql.rowset.RowSetFactory7`\n\
  \n* `CachedRowSet createCachedRowSet()`\n* `FilteredRowSet createFilteredRowSet()`\n\
  * `JdbcRowSet createJdbcRowSet()`\n* `JoinRowSet createJoinRowSet()`\n* `WebRowSet\
  \ createWebRowSet()`\n  创建一个指定类型的行集。\n\n## 5.8. 元数据\n\n在前面的节中，你学习了如何填充、查询和更新数据库表。然而，JDBC\
  \ 可以为你提供关于数据库及其表*结构*的额外信息。例如，你可以获取特定数据库中的表列表，或者某个表的列名和类型。当你实现一个具有预定义数据库的业务应用程序时，这些信息并不是用的。毕竟，如果你设计了这些表，你就知道它们的结构了。然而，结构信息对于编写适用于任何数据库的工具的程序员来说是非常有用的。\n\
  \n在 SQL 中，描述数据库或其部分的数据被称为*元数据*（以区别于存储在数据库中的实际数据）。你可以获取三种元数据：关于数据库的、关于结果集的以及关于预编译语句参数的。\n\
  \n要了解更多关于数据库的信息，请从数据库连接请求 `DatabaseMetaData` 类型的对象。\n\n```\nDatabaseMetaData meta\
  \ = conn.getMetaData();\n```\n\n使用此对象获取有关数据库的信息。例如，调用\n\n```\nResultSet mrs = meta.getTables(null,\
  \ null, null, new String[] { \"TABLE\" });\n```\n\n返回一个包含数据库中所有表信息的结果集。（请参本节末尾的\
  \ API 注释了解该方法的其他参数。）\n\n结果集中的每一行都包含数据库中表的信息。第三列是表名。（再次参阅 API 注释了解其他列。）以下循环收集了所有表名：\n\
  \n```\nwhile (mrs.next())\n    tableNames.add(mrs.getString(3));\n```\n\n数据库元数据还有第二个重要用途。数据库是复杂的，SQL\
  \ 标准为变体留下了大量的空间。`DatabaseMetaData` 接口中有一百多个方法可以查询数据库，包括一些非常奇特的调用，如\n\n```\nmeta.supportsCatalogsInPrivileges()\n\
  ```\n\n和\n\n```\nmeta.nullPlus()\n```\n\n显然这些是针对有特殊需求的高级用户的——特别是那些需要编写适用于多个数据库的可移植代码的用户。\n\
  \n`DatabaseMetaData` 接口提供有关数据库的数据。第二个元数据接口 `ResultSetMetaData` 报告结果集的信息。当你从查询获得结果集时，可以查询列数以及每列的名称、类型和字段宽度。这是一个典型的循环：\n\
  \n```\nResultSet rs = stat.executeQuery(\"SELECT * FROM \" + tableName);\nResultSetMetaData\
  \ rsmd = rs.getMetaData();\nfor (int i = 1; i <= rsmd.getColumnCount(); i++) {\n\
  \    String columnName = rsmd.getColumnLabel(i);\n    int columnWidth = rsmd.getColumnDisplaySize(i);\n\
  \    . . .\n}\n```\n\n如果你有一个预编译语句，可以获取执行语句时返回的结果集的元数据：\n\n```\nPreparedStatement\
  \ pstat = conn.prepareStatement(. . .);\nResultSetMetaData rsmd = pstat.getMetaData();\n\
  ```\n\n第三种元数据描述预编译语句的参数：\n\n```\nParameterMetaData pmd = pstat.getParameterMetaData();\n\
  for (int i = 1; i <= pmd.getParameterCount(); i++) {\n    IO.println(pmd.getParameterTypeName(i));\n\
  }\n```\n\n列表 5.4 中的程序使用元数据让你浏览数据库中的所有表并执行简单的编辑。该程序还演示了缓存行集的用法。\n\n\n\n\n配套代码有一个更美观的\
  \ GUI 版本。顶部的组合框显示数据库中的所有表。选择其中一个，框架的中心就会填充该表的字段名和第一行的值，如图 5.6 所示。点击 `Next`（下一个）和\
  \ `Previous`（上一个）可以遍历表中的行。你还可以删除一行并编辑 `String` 类型的值。点击 `Save`（保存）按钮将更改保存到数据库。\n\n\
  ![Figure](img/fig04-08.jpg)图 5.6：`ViewDB` GUI 应用程序\n\n示例向你展示了如何实现用于处理任意表的工具。许多数据库和\
  \ IDE 都带有更复杂的工具来查看和编辑表。如果你倾向于使用独立程序，可以查看 DBeaver ([`dbeaver.io`](https://dbeaver.io))\
  \ 或 SQuirreL ([`squirrelsql.org`](https://squirrelsql.org))。这些程序可以用于任何 `JDBC` 数据库。\n\
  \n### 列表 5.4 `v2ch05/view/ViewDB2.java`\n\n```\npackage v2ch05.view;\n\nimport module\
  \ java.base;\nimport module java.sql;\nimport module java.sql.rowset;\nimport v2ch05.exec.ExecSQL;\n\
  import v2ch07.util.Choices;\n\n/**\n * 此程序使用元数据显示数据库中的任意表。\n */\nclass ViewDB2 {\n\
  \    CachedRowSet crs;\n\n    record Column(String label, int width, String columnClass)\
  \ {\n    }\n\n    List<Column> columns = new ArrayList<>();\n\n    void main() {\n\
  \        try (Connection conn = ExecSQL.getConnection()) {\n            DatabaseMetaData\
  \ meta = conn.getMetaData();\n            var tableNames = new ArrayList<String>();\n\
  \n            try (ResultSet mrs = meta.getTables(null, null, null, new String[]{\
  \ \"TABLE\" })) {\n                while (mrs.next())\n                    tableNames.add(mrs.getString(3));\n\
  \            }\n            IO.println(\"Choose a table\");\n            String\
  \ selected = Choices.choose(tableNames);\n            showTable(selected, conn);\n\
  \            executeCommands();\n            crs.acceptChanges(conn);\n        }\n\
  \        catch (SQLException e) {\n            for (Throwable t : e)\n         \
  \       t.printStackTrace();\n        }\n        catch (IOException e) {\n     \
  \       e.printStackTrace();\n        }\n    }\n\n    /**\n     * 为显示新表准备列列表，并显示第一行。\n\
  \     * @param tableName 要显示的表表名\n     * @param conn 数据库连接\n     */\n    void showTable(String\
  \ tableName, Connection conn) throws SQLException {\n        try (Statement stat\
  \ = conn.createStatement();\n             ResultSet result = stat.executeQuery(\"\
  SELECT * FROM \" + tableName)) {\n            // 拷贝到缓存行集\n            RowSetFactory\
  \ factory = RowSetProvider.newFactory();\n            crs = factory.createCachedRowSet();\n\
  \            crs.setTableName(tableName);\n            crs.populate(result);\n\n\
  \            ResultSetMetaData rsmd = result.getMetaData();\n            for (int\
  \ i = 1; i <= rsmd.getColumnCount(); i++) {\n                columns.add(new Column(rsmd.getColumnLabel(i),\
  \ rsmd.getColumnDisplaySize(i),\n                        rsmd.getColumnClassName(i)));\n\
  \            }\n\n            showNextRow();\n        }\n    }\n\n    void executeCommands()\
  \ throws SQLException {\n        while (true) {\n            String selection =\
  \ Choices.choose(\"Next\", \"Previous\", \"Edit\", \"Delete\", \"Quit\");\n    \
  \        switch (selection) {\n                case \"Next\" -> showNextRow();\n\
