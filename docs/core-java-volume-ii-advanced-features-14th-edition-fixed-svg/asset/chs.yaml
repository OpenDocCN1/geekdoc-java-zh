  \        add(panel, BorderLayout.SOUTH);\n    }\n}\n```\n\n### javax.swing.JTree\n\
  - `TreePath getSelectionPath()`: 获取当前选中节点的路径；如果选中了多个节点，则获取第一个选中节点的路径。如果没有选中节点，则返回\
  \ `null`。\n- `Object getLastSelectedPathComponent()`: 获取代表当前选中节点的节点对象；如果选中了多个节点，则获取第一个节点。如果没有选中节点，则返回\
  \ `null`。\n- `void makeVisible(TreePath path)`: 展开路径上的所有节点。\n- `void scrollPathToVisible(TreePath\
  \ path)`: 展开路径上的所有节点，如果树包含在滚动面板中，则滚动以确保路径上的最后一个节点可见。\n\n### javax.swing.tree.TreePath\n\
  - `Object getLastPathComponent()`: 获取此路径上的最后一个对象——即该路径代表的节点对象。\n\n### javax.swing.tree.TreeNode\n\
  - `TreeNode getParent()`: 返回该节点的父节点。\n- `TreeNode getChildAt(int index)`: 查找指定索引处的子节点。索引必须在\
  \ 0 到 `getChildCount()`– 1 之间。\n- `int getChildCount()`: 返回该节点的子节点数量。\n- `Enumeration\
  \ children()`: 返回一个遍历该节点所有孩子的枚举对象。\n\n### javax.swing.tree.DefaultTreeModel\n- `void\
  \ insertNodeInto(MutableTreeNode newChild, MutableTreeNode parent, int index)`:\
  \ 在指定的索引处将 `newChild` 插入 `parent` 的子节点，并通知树模型监听器。\n- `void removeNodeFromParent(MutableTreeNode\
  \ node)`: 从此模型中移除 `node` 并通知树模型监听器。\n- `void nodeChanged(TreeNode node)`: 通知树模型监听器\
  \ `node` 已经发生变化。\n- `void nodesChanged(TreeNode parent, int[] changedIndexes)`:\
  \ 通知树模型监听器 `parent` 的指定子节点已发生变化。\n- `void reload()`: 重新加载所有节点。这是一个剧烈的操作，仅当节点由于外部影响发生完全变化时使用。\n\
  \n### 12.4.3 节点枚举\n有时你需要在树中从根节点开始遍历节点，直到找到匹配项。`DefaultMutableTreeNode` 类提供了用于遍历节点的便利方法。\n\
  \n`breadthFirstEnumeration` 和 `depthFirstEnumeration` 方法返回枚举对象，这些对象的 `nextElement`\
  \ 方法以广度优先或深度优先的方式访问当前节点的所有孩子。12.27 显示示例树的遍历情况。\n\n图 12.27：树遍历顺序\n\n广度优先枚举容易理解。树按层遍历：首先访问根节点，然后是所有的孩子，接着是孙子，以此类推。\n\
  \n为了可视化深度优先枚举，想象一只被困在树形迷宫中的鼠。它沿着第一条路径冲，直到遇到叶节点。然后，它回溯并转向另一条路径，以此类推。\n\n计算机科学家称为*后序遍历*，因为搜索过程在访问父节点之前访问了孩子。`postOrderEnumeration`\
  \ 方法是 `depthFirstEnumeration` 的同义词。为了完整性，还有一个 `preOrderEnumeration`，是一种在访问父节点之前访问孩子的深度搜索。\n\
  \n以下是典型的用法模式：\n\n```\nEnumeration breadthFirst = node.breadthFirstEnumeration();\n\
  while (breadthFirst.hasMoreElements())\n    do something with breadthFirst.nextElement();\n\
  ```\n\n最后，一个相关方法 `pathFromAncestorEnumeration` 寻找从祖先到给定节点的路径，并枚举路径上的节点。这并不困难——它不断调用\
  \ `getParent` 直到找到祖先，然后以反向呈现路径。\n\n\n\n\n在本示例中，我们利用了树节点的用户对象（user objects）可以是任意类型对象的特性。由于我们的节点描述的是类，因此我们在节点中存储了\
  \ `Class` 对象。\n\n我们不想重复添加同一个类对象，因此需要检查类是否已经存在于树中。以下方法可以在树中查找具有给定用户对象的节点（如果它存在的话）：\n\
  \n```\npublic DefaultMutableTreeNode findUserObject(Object obj) {\n    Enumeration\
  \ e = root.breadthFirstEnumeration();\n    while (e.hasMoreElements()) {\n     \
  \   DefaultMutableTreeNode node = (DefaultMutableTreeNode) e.nextElement();\n  \
  \      if (node.getUserObject().equals(obj))\n            return node;\n    }\n\
  \    return null;\n}\n```\n\n### 12.4.4. 渲染节点\n\n在你的应用程序中，你通常需要更改树组件绘制节点的方式。最常见的更改是为节点和叶子节点选择不同的图标。其他更改可能涉及节点标签的字体或在节点处绘制图像。所有这些更改通过向树中安装一个新的\
  \ `tree cell renderer`（树单元渲染器）来实现。默认情况下，`JTree` 类使用 `DefaultTreeCellRenderer` 对象来绘制每个节点。`DefaultTreeCellRenderer`\
  \ 类继承自 `JLabel` 类。标签包含了节点图标和节点标签。\n\n单元渲染器并不绘制用于展开和折叠子树的“句柄”（handles）。句柄是外观（look-and-feel）的一部分，建议不要更改它们。\n\
  \n你可以通过三种方式自定义显示：\n\n*   你可以更改 `DefaultTreeCellRenderer` 使用的图标、字体和背景颜色。这些设置适用于树中的所有节点。\n\
  *   你可以安装一个扩展 `DefaultTreeCellRenderer` 类的渲染器，并为每个节点改变图标、字体和背景颜色。\n*   你可以安装一个实现\
  \ `TreeCellRenderer` 接口的渲染器，为每个节点绘制自定义图像。\n\n让我们逐一查看这些可能性。简单的自定义是构造一个 `DefaultTreeCellRenderer`\
  \ 对象，更改图标并将其安装到树中：\n\n```\nvar renderer = new DefaultTreeCellRenderer();\nrenderer.setLeafIcon(new\
  \ ImageIcon(\"blue-ball.gif\")); // 用于叶子节点\nrenderer.setClosedIcon(new ImageIcon(\"\
  red-ball.gif\")); // 用于折叠的节点\nrenderer.setOpenIcon(new ImageIcon(\"yellow-ball.gif\"\
  )); // 用于展开的节点\ntree.setCellRenderer(renderer);\n```\n\n你可以在图 12.28 中看到效果。我们只是使用“球”图标作为占位符——假设你的用户界面设计师会为你提供适用于应用程序的适当图标。\n\
  \n我们不建议你更改整棵树的字体或背景颜色——这真的是外观（look-and-feel）的工作。\n\n然而，更改树中某些节点的字体以突出显示它们可能是很有帮助的。如果你仔细观察图\
  \ 12.28，你会注意到 `abstract` 类被设置成了*斜体*。\n\n要更改单个节点的显示，请安装树单元渲染器。树单元渲染器与我们在本章较之前讨论的列表单元渲染器非常相似。`TreeCellRenderer`\
  \ 接口只有一个方法：\n\n```\nComponent getTreeCellRendererComponent(JTree tree, Object value,\
  \ boolean selected,\n        boolean expanded, boolean leaf, int row, boolean hasFocus)\n\
  ```\n\n`DefaultTreeCellRenderer` 类的 `getTreeCellRendererComponent` 方法返回 `this`——换句话说，一个标签。（`DefaultTreeCellRenderer`\
  \ 类继承自 `JLabel` 类。）要自定义组件，请扩展 `DefaultTreeCellRenderer` 类。重写 `getTreeCellRendererComponent`\
  \ 方法如下：调用父类方法以便其准备标签数据，自定义标签属性，并最后返回 `this`。\n\n```\nclass MyTreeCellRenderer extends\
  \ DefaultTreeCellRenderer {\n    public Component getTreeCellRendererComponent(JTree\
  \ tree, Object value,\n            boolean selected, boolean expanded, boolean leaf,\
  \ int row, boolean hasFocus) {\n        Component comp = super.getTreeCellRendererComponent(tree,\
  \ value, selected,\n            expanded, leaf, row, hasFocus);\n        DefaultMutableTreeNode\
  \ node = (DefaultMutableTreeNode) value;\n        look at node.getUserObject();\n\
  \        Font font = appropriate font;\n        comp.setFont(font);\n        return\
  \ comp;\n    }\n}\n```\n\n`getTreeCellRendererComponent` 方法的 `value` 参数是 `node`\
  \ 对象，*不是*用户对象！记住用户对象是 `DefaultMutableTreeNode` 的特性，且 `JTree` 可以包含任意类型的节点。如果你的树使用\
  \ `DefaultMutableTreeNode` 节点，你必须在第二步中获取用户对象，就像我们在前面的代码示例中所做的那样。\n\n`DefaultTreeCellRenderer`\
  \ 为所有节点使用相同的*标签对象，仅更改每个节点的标签文本。如果你更改了特定节点的字体，必须在再次调用该方法时将其设置回默认值。否则，所有后续节点都将使用更改后的字体绘制！查看代码列表\
  \ 12.10 中的代码，了解如何将字体恢复为默认。\n\n代码列表 12.10 中的 `ClassNameTreeCellRenderer` 根据树的 `ABSTRACT`\
  \ 修饰符，以普通字体或斜字体设置类名。我们需要保留原始字体，并在下一次调用 `TreeCellRenderer` 时恢复它。\n\n### 12.4.5. 监听树事件\n\
  \n最常见的情况下，树组件与其他某些组件配对。当用户选择树节点时，某些信息会出现在另一个窗口中。请参图 12.29 示例。当用户选择一个类时，该类的实例和静态变量将显示在右侧的文本区域中。\n\
  \n![Figure](img/fig06-33.jpg)图 12.29：类浏览器\n\n要获得这种行为，你需要安装一个 `tree selection listener`（树选择监听器）。该监听器必须实现\
  \ `TreeSelectionListener` 接口——这是一个具有单一方法的接口：\n\n```\nvoid valueChanged(TreeSelectionEvent\
  \ event)\n```\n\n每当用户选择或取消选择树节点，该方法就会被调用。\n\n以普通方式将监听器添加到树中：\n\n```\ntree.addTreeSelectionListener(listener);\n\
  ```\n\n\n\n\n你可以指定是否允许用户选择单个节点、连续的节点范围或一组任意的、可能不连续的节点集合。`JTree` 类使用 `TreeSelectionModel`\
  \ 来管理节点选择。你需要获取模型，并将选择状态设置为 `SINGLE_TREE_SELECTION`、`CONTIGUOUS_TREE_SELECTION`\
  \ 或 `DISCONTIGUOUS_TREE_SELECTION` 之一。（不连续选择模式为默认值）。例如，在我们的类浏览器中，我们希望允许选择单个类：\n\n\
  ```\nint mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\ntree.getSelectionModel().setSelectionMode(mode);\n\
  ```\n\n除了设置选择模式外，你不需要担心树选择模型。\n\n用户如何选择多个项目取决于外观特性（look-and-feel）。在 Metal 外观中，在按住\
  \ `Ctrl` 键的同时点击某个项目，可以将其添加到选择中，或者如果该项目已被选中，则将其移除。在按住 `Shift` 键的同时点击某个项目，可以选择一个范围内的项目，范围从上一个选中的项目扩展到新项目。\n\
  \n要查找当前选择，请使用 `getSelectionPaths` 方法查询树：\n\n```\nTreePath[] selectedPaths = tree.getSelectionPaths();\n\
  ```\n\n如果你将用户限制为单项选择，你可以使用便利方法 `getSelectionPath`，它返回第一个选中的路径，或者在没有选择路径时返回 `null`。\n\
  \n`TreeSelectionEvent` 类有一个 `getPaths` 方法，返回一个 `TreePath` 对象的数组，但该数组描述的是选择的变化，而不是当前的选择。\n\
  \n代码列表 12.10 显示了类树程序的框架类。程序显示继承层次结构并自定义了显示，用*斜体*显示抽象类。（单元格渲染器请参见 代码列表 12.11）。你可以在框架底部的文本框中输入任何类的名称。按回车键或点击\
  \ Add 按钮将该类及其父类添加到树中。你必须输入完整的包名，例如 `java.util.ArrayList`。\n\n这个程序稍微有点复杂，因为它使用反射来构建类树。这项工作是在\
  \ `addClass` 方法内部完成的。（细节并不重要。我们在这个示例中使用类树是因为继承可以提供丰富的树源，而无需费力的编码。当你在应用程序中显示树时，你将会有自己的层次结构数据源。）该方法使用广度优先搜索算法，通过调用我们在上一节实现的\
  \ `findUserObject` 方法来查找当前类是否已在树中。如果该类不在树中，我们将父类添加到树中，然后将新类节点设置为子节点并使该节点可见。\n\n\
  当你选择一个树节点时，右侧的文本区域将被所选类的字段填充。在框架构造函数中，我们将用户限制为单项选择并添加了一个树选择监听器。当 `valueChanged`\
  \ 方法被调用时，我们忽略它的事件参数，直接向树请求当前选择路径。像既往一样，我们需要获取路径的最后一个节点并查找其用户对象。然后我们调用 `getFieldDescription`\
  \ 方法，该方法使用反射组合出一个包含所选类所有字段的字符串。\n\nListing 12.10 v2ch12/treeRender/ClassTreeFrame.java\n\
  \n\n\n\n```java\npackage v2ch12.treeRender;\n\nimport module java.base;\nimport\
  \ module java.desktop;\n\n/**\n * 此框架显示了类树、一个文本字段以及一个“添加”按钮，用于向树\n * 中添加更多类。\n */\n\
  public class ClassTreeFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 400;\n    private static final int DEFAULT_HEIGHT = 300;\n\n    private DefaultMutableTreeNode\
  \ root;\n    private DefaultTreeModel model;\n    private JTree tree;\n    private\
  \ JTextField textField;\n    private JTextArea textArea;\n\n    public ClassTreeFrame()\
  \ {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 类树的根节点是 Object\n\
  \        root = new DefaultMutableTreeNode(java.lang.Object.class);\n        model\
  \ = new DefaultTreeModel(root);\n        tree = new JTree(model);\n\n        //\
  \ 添加此类以向树填充数据\n        addClass(getClass());\n\n        // 设置节点图标\n        var renderer\
  \ = new ClassNameTreeCellRenderer();\n        renderer.setClosedIcon(new ImageIcon(\"\
  images/red-ball.gif\"));\n        renderer.setOpenIcon(new ImageIcon(\"images/yellow-ball.gif\"\
  ));\n        renderer.setLeafIcon(new ImageIcon(\"images/blue-ball.gif\"));\n  \
  \      tree.setCellRenderer(renderer);\n\n        // 设置选择模式\n        tree.addTreeSelectionListener(_\
  \ -> {\n            // 用户选择了不同的节点--更新描述\n            TreePath path = tree.getSelectionPath();\n\
  \            if (path == null) return;\n            var selectedNode = (DefaultMutableTreeNode)\
  \ path.getLastPathComponent();\n            Class<?> c = (Class<?>) selectedNode.getUserObject();\n\
  \            String description = getFieldDescription(c);\n            textArea.setText(description);\n\
  \        });\n        int mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\n   \
  \     tree.getSelectionModel().setSelectionMode(mode);\n\n        // 此文本区域持有类描述\n\
  \        textArea = new JTextArea();\n\n        // 添加树和文本区域\n        var panel =\
  \ new JPanel();\n        panel.setLayout(new GridLayout(1, 2));\n        panel.add(new\
  \ JScrollPane(tree));\n        panel.add(new JScrollPane(textArea));\n\n       \
  \ add(panel, BorderLayout.CENTER);\n\n        addTextField();\n    }\n\n    /**\n\
  \     * 添加文本字段和“添加”按钮以添加新类。\n     */\n    public void addTextField() {\n       \
  \ var panel = new JPanel();\n\n        ActionListener addListener = _ -> {\n   \
  \         // 添加文本字段中类名的类\n            try {\n                String text = textField.getText();\n\
  \                addClass(Class.forName(text)); // 清空文本字段以表示成功\n               \
  \ textField.setText(\"\");\n            }\n            catch (ClassNotFoundException\
  \ e) {\n                JOptionPane.showMessageDialog(null, \"未找到类\");\n       \
  \     }\n        };\n\n        // 新类名输入到此文本字段\n        textField = new JTextField(20);\n\
  \        textField.addActionListener(addListener);\n        panel.add(textField);\n\
  \n        var addButton = new JButton(\"Add\");\n        addButton.addActionListener(addListener);\n\
  \        panel.add(addButton);\n\n        add(panel, BorderLayout.SOUTH);\n    }\n\
  \n    /**\n     * 在树中查找对象。\n     * @param obj 要查找的对象\n     * @return 包含对象的节点，如果树中不存在该对象则返回\
  \ null\n     */\n    public DefaultMutableTreeNode findUserObject(Object obj) {\n\
  \        // 查找包含用户对象的节点\n        var e = (Enumeration<TreeNode>) root.breadthFirstEnumeration();\n\
  \        while (e.hasMoreElements()) {\n            var node = (DefaultMutableTreeNode)\
  \ e.nextElement();\n            if (node.getUserObject().equals(obj)) return node;\n\
  \        }\n        return null;\n    }\n\n    /**\n     * 添加新类以及任何尚未加入树的父类。\n \
  \    * @param c 要添加的类\n     * @return 新添加的节点\n     */\n    public DefaultMutableTreeNode\
  \ addClass(Class<?> c) {\n        // 向树中添加新类\n\n        // 跳过非类类型\n        if (c.isInterface()\
  \ || c.isPrimitive()) return null;\n\n        // 如果类已经在树中，则返回其节点\n        DefaultMutableTreeNode\
  \ node = findUserObject(c);\n        if (node != null) return node;\n\n        //\
  \ 类不存在--首先递归添加类的父类\n\n        Class<?> s = c.getSuperclass();\n\n        DefaultMutableTreeNode\
  \ parent;\n        if (s == null)\n            parent = root;\n        else\n  \
  \          parent = addClass(s);\n\n        // 将类作为父节点的子节点\n        var newNode\
  \ = new DefaultMutableTreeNode(c);\n        model.insertNodeInto(newNode, parent,\
  \ parent.getChildCount());\n\n        // 使节点可见\n        var path = new TreePath(model.getPathToRoot(newNode));\n\
  \        tree.makeVisible(path);\n\n        return newNode;\n    }\n\n    /**\n\
  \     * 返回类字段的描述。\n     * @param c 要描述的类\n     * @return 包含所有字段类型和名称的字符串\n     */\n\
  \    public static String getFieldDescription(Class<?> c) {\n        // 使用反射查找字段的类型和名称\n\
  \        var r = new StringBuilder();\n        Field[] fields = c.getDeclaredFields();\n\
  \        for (int i = 0; i < fields.length; i++) {\n            Field f = fields[i];\n\
  \            if (Modifier.isStatic(f.getModifiers())) r.append(\"static \");\n \
  \           r.append(f.getType().getName());\n            r.append(\" \");\n   \
  \         r.append(f.getName());\n            r.append(\"\\n\");\n        }\n  \
  \      return r.toString();\n    }\n}\n```\n\n*(注：由于你提供的文本后半部分是重复的 Java 代码逻辑和混淆描述，我已根据上述逻辑翻译了上方完整的\
