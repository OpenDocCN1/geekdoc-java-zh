  \n*   `GeneralPath()`\n    构造一个空的通用路径。\n\n`java.awt.geom.Path2D.Float` 6\n\n*  \
  \ `void moveTo(float x, float y)`\n    将 (`x`, `y`) 设置为*当前点*——即下一段的起始点。\n*   `void\
