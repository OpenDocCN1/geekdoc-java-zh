  \ formatter)`\n  解析给定字符串并返回其中描述的 `LocalDate`、`LocalTime`、`LocalDateTime` 或 `ZonedDateTime`。如果解析失败，则抛出\
  \ `DateTimeParseException`。\n\n## 7.4. 排序与归一化\n\n大多数程序员都知道如何使用 `String` 类的 `compareTo`\
  \ 方法来比较字符串。遗憾的是，在人类用户交互时，这个方法并不好用。`compareTo` 方法使用字符串的 UTF-16 编码值，这导致即使在英语中也会出现荒谬的结果。例如，以下五个字符串按照\
  \ `compareTo` 方法的排序如下：\n\n```\nAmerica\nZulu\nable\nzebra\nÅngström\n```\n\n对于字典排序，你可能希望将大写和小写字母视为等同。对于英语使用者来说，示例单词列表的顺序应该是：\n\
  \n```\nable\nAmerica\nÅngström\nzebra\nZulu\n```\n\n然而，这个顺序对于瑞典用户来说是不可接受的。在瑞典语中，字母\
  \ `Å` 与字母 `A` 不同，它排在字母 `Z` 之后！这意味着瑞典用户希望单词按以下顺序排序：\n\n```\nable\nAmerica\nzebra\n\
  Zulu\nÅngström\n```\n\n要获取一个区域敏感的比较器，请调用静态方法 `Collator.getInstance`：\n\n```\nCollator\
  \ coll = Collator.getInstance(locale);\nwords.sort(coll); // Collator 实现了 Comparator<Object>\n\
  ```\n\n从 Java 21 开始，你可以通过扩展指定特殊的排序器。例如，语言标记为 `sv-u-co-trad` 的区域使用传统的瑞典语排序，它不区分“v”和“w”。\n\
  \n由于 `Collator` 类实现了 `Comparator` 接口，你可以将 `Collator` 对象传递给 `List.sort(Comparator)`\
  \ 方法来对字符串列表进行排序。\n\n排序器有几个高级设置。你可以设置排序器的*强度*（strength）来调整其选择性。字符之间的差异被分类为*初级*（primary）、*次级*（secondary）或*三级*（tertiary）。例如，在英语中，“A”和“Z”之间的差异被认为是初级的，“A”和“Å”之间的差异是次级的，而“A”和“a”之间的差异是三级的。\n\
  \n通过通过将排序器的强度设置为 `Collator.PRIMARY`，你告诉它只关注初级差异。通过将强度设置为 `Collator.SECONDARY`，你指示排序器考虑次级差异。也就是说，当强度设置为“次级”或“三级”时，两个字符串更容易被视为不同的，如表\
  \ 7.8 所示。\n\n表 7.8：不同强度的排序（英语区域）\n\n| 初级 | 次级 | 三级 |\n| --- | --- | --- |\n| Angstrom\
  \ = Ångström | Angstrom ≠ Ångström | Angstrom ≠ Ångström |\n| Able = able | Able\
  \ = able | Able ≠ able |\n\n当强度被设置为 `Collator.IDENTICAL` 时，允许任何差异。这种设置主要与一种技术性的排序器设置配合，即*分解模式*（decomposition\
  \ mode），我们将在接下来讨论。\n\n偶尔，一个字符或字符序列可以用多种方式来描述。例如，“Å”可以是 Unicode 字符 U00C5，也可以表示为普通字母“A”（U0065）后跟一个“°”（组合环形；U+030A）。可能令人惊讶的是，字母序列“ffi”可以使用单个字符“拉丁小连字\
  \ ffi” UFB03 来描述。（人们认为这是一个导致不同字符显示的问题。）\n\nUnicode 标准为字符串定义了四种*归一化形式*（normalization\
  \ forms）：D、KD、C 和 KC。详情请参见 [`www.unicode.org/reports/tr15/tr15-23.html`](https://www.unicode.org/reports/tr15/tr15-23.html)。在归一化形式\
  \ C 中，重音字符总是组合在一起的。例如，一个“A”和一个组合环形“°”的序列会被组合成单个字符“Å”。在形式 D 中，重音字符总是被分解为基础字母和组合重音。KC\
  \ 和 KD 还会分解如连字或商标符号之类的字符。\n\n你可以选择希望排序器使用的归一化程度。`Collator.NO_DECOMPOSITION` 不对字符串进行任何归一化。此选项更快，但可能不适用于以多种形式表示字符的文本。默认值\
  \ `Collator.CANONICAL_DECOMPOSITION` 使用归一化形式 D。对于包含重音但不包含连字的很有用。最后，“全分解”使用归一化形式\
  \ KD。示例请参见表 7.9。\n\n表 7.9：分解模式之间的差异\n\n| 无分解 | 规范分解 | 全分解 |\n| --- | --- | --- |\n\
  | Å ≠ A° | Å = A° | Å = A° |\n| ™ ≠ TM | ™ ≠ TM | ™ = TM |\n\n多次让排序器分解同一个字符串是浪费资源的。如果一个字符串需要与其他字符串进行多次比较，你可以将分解保存在*排序*键对象中。`getCollationKey`\
  \ 方法返回一个 `CollationKey` 对象，你可以用它进行进一步、更快的比较。这是一个示例：\n\n\n\n\n\n```\nString a = .\
  \ . .\nCollationKey aKey = coll.getCollationKey(a);\nif(aKey.compareTo(coll.getCollationKey(b))\
  \ == 0) //快速比较\n    . . .\n```\n\n最后，你可能想要将字符串转换为它们的归一化形式，即使你没有进行排序——例如为了将字符串存储在数据库中或与另一个程序通信。`java.text.Normalizer`\
  \ 类执行归一化过程。这里有一个示例：\n\n```\nString name = \"Ångström\";\nString normalized = Normalizer.normalize(name,\
  \ Normalizer.Form.NFD);\n    // 使用归一化形式 D\n```\n\n归一化字符串包含十个字符。“Å”和“ö”被“A°”和“o¨”序列替换。\n\
  \n然而，这通常不是存储和传输的最佳形式。归一化形式 C（Form C）首先应用分解，然后按照标准顺序将重音符号组合。根据 W3C 的规定，这是在互联网上传输数据的推荐模式。\n\
  \nListing 7.3 中的程序让你能够实验排序顺序。书的配套代码还有一个 GUI 版本。在文本字段中输入一个单词并点击 Add 按钮将其添加到单词列表中。每当你添加另一个单词或更改语言区域（locale）、强度（strength）或分解模式时，单词列表都会重新排序。`=`\
  \ 符号表示被视为相同的单词（参见图 7.3）。\n\n![Figure](img/fig05-03.jpg)图 7.3: `CollationDemo` 程序\n\
  \n语言区域名称使用默认区域的排序器按排序顺序显示。如果你用美国英语语言区域运行此程序，请注意“Norwegian (Norway,Nynorsk)”在“Norwegian\
  \ (Norway)”之前。标准的字符串比较会反转这个顺序，因为逗号字符的 Unicode 值大于右括号的 Unicode 值。\n\n代码列表 7.3 v2ch07/collation/CollationDemo2.java\n\
  \n```\npackage v2ch07.collation;\n\nimport module java.base;\nimport v2ch07.util.Choices;\n\
  \n/**\n * 此程序演示了在不同语言区域下对字符串进行排序。\n */\nclass CollationDemo2 {\n   void main() {\n\
  \      var locales = (Locale[]) NumberFormat.getAvailableLocales().clone();\n  \
