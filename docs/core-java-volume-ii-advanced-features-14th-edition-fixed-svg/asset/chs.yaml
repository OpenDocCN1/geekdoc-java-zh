  列表 9.9 `v2ch09/jaas/JAASDemo.java`\n\n```java\npackage v2ch09.jaas;\n\nimport module\
  \ java.base;\nimport module jdk.security.auth;\n\n/**\n * 此程序展示了如何通过自定义登录来验证用户\n\
  \ */\nclass JAASDemo {\n    void main(String[] args) {\n        CallbackHandler\
  \ handler;\n        if (args.length == 0)\n            handler = new TextCallbackHandler();\n\
