  \ 12.12 展示了示例程序的框架类。\n\nListing 12.12 v2ch12/treeModel/ObjectInspectorFrame.java\n\
  \n```\npackage v2ch12.treeModel;\n\nimport module java.desktop;\n\n/**\n * 此框架持有对象树。\n\
