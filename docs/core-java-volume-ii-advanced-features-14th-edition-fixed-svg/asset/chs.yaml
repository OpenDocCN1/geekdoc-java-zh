  打印 API 的早期版本引入了 `JobAttributes` 和 `PageAttributes` 类，其目的与本节介绍的打印属性相似。这些类现在已过时。\n\
  \n`javax.print.attribute.Attribute1.4`\n\n* `Class getCategory()`\n  获取此属性的类别。\n\
  * `String getName()`\n  获取属性的名字。\n\n`javax.print.attribute.AttributeSet1.4`\n\n\
  * `boolean add(Attribute attr)`\n  向此集合添加属性。如果集合具有相同类别的属性，则该属性将被指定的属性替换。如果此操作导致集合变化，则返回\
  \ `true`。\n* `Attribute get(Class category)`\n  检索给定类别键的属性，如果不存在此类属性，则返回 `null`。\n\
  * `boolean remove(Attribute attr)`\n* `boolean remove(Class category)`\n  从集合删除指定的属性或给定类别的属性。如果此操作导致集合变化，则返回\
  \ `true`。\n* `Attribute[] toArray()`\n  返回包含此集合中所有属性的数组。\n\n`javax.print.PrintService1.4`\n\
  \n* `PrintServiceAttributeSet getAttributes()`\n  获取打印服务的属性。\n\n`javax.print.DocPrintJob1.4`\n\
  \n* `PrintJobAttributeSet getAttributes()`\n  获取打印作业的属性。\n\n你现在已经完成了这个涵盖高级 Swing\
  \ 和 AWT 特性的漫长章节。在最后一章中，我们将转向 Java 编程的另一个方面：在同一台机器上与不同编程语言的“原生”代码进行交互。\n\n# 第 13\
  \ 章 ▪ 异构函数与内存 API\n\n\n\n特别是在 Java 早期，许多人认为使用 `C` 或 `C++` 来加速 Java 应用的关键部分是一个好主意。然而，在实践中，这很少有用。1996\
  \ 年 JavaOne 大会上的一个演示清楚地说明了这一点。Sun Microsystems 加密库的开发人员报告说，其加密函数的纯 Java 平台实现已经绰绰有余。代码速度确实没有\
  \ `C` 实现那么快，但事实证明这并不重要。Java 平台的实现远快于网络 I/O，而这才是真正的性能瓶颈。\n\n从那时起，即时编译器（JIT compiler）已经变得强大得多，仅仅为了性能而转向原生代码已不再常见。但也有其他正当的理由，例如：\n\
  \n-   你的应用程序需要访问 Java 平台无法访问的系统功能或设备。\n-   你已经在另一种语言中拥有大量经过测试和调试的代码。\n\n例如，考虑使用一个用\
  \ `C` 或 `C++` 编写并使用 GPU 的人工智能库。在 Java 中重新实现它可能并不切实际。在这种情况下，Java 和原生代码之间的桥接就变得必要的。\n\
  \n自 Java 1.1 以来，Java 平台一直有一个与原生 `C` 代码相互操作的 API，称为 Java Native Interface（`JNI`）。\n\
  \n然而，正如你将看到的，使用 `JNI` 涉及某些繁琐的操作。Java 17 引入了一个预览特性，一个用于访问“外部”函数和内存的 API，它比 `JNI`\
  \ 方便得多。这个 FFM API 现在已成为 Java 25 的正式特性。\n\n我们将本章的开头先让你简要了解一下 `JNI` 的特点，然后转向 FFM API。对于新项目，你应该使用该\
  \ API。在未来的某个时间点，`JNI` 可能会被弃用。\n\n当然，使用原生代码是有缺点的。如果你的应用程序部分是用另一种语言编写的，你必须为你想要支持的每个平台提供一个独立的原生库。用\
  \ `C` 或 `C++` 编写的代码无法防止通过无效指针使用来覆盖内存。很容易编写出损坏你的程序或感染操作系统的原生方法。\n\n出于此原因，从 Java 22\
  \ 开始，你必须手动开启原生访问（无论通过 `JNI` 还是 FFM API）。如果不使用模块，请按以下方式启动程序：\n\n```bash\njava --enable-native-access=ALL-UNNAMED\
  \ ...\n```\n\n在模块化程序中，列出允许原生访问的模块：\n\n```bash\njava --enable-native-access=module1,\
  \ module2 ...\n```\n\n## 13.1. 使用 JNI 从 Java 程序调用 C 代码\n\n假设你有一个 `C` 函数，它执行着你喜欢的操作，并且由于某种原因，你不想费力在\
  \ Java 中重新实现它。为了说明起，我们将调用一个带有一个参数的 `C` `printf` 函数。\n\n使用 `JNI`，你需要使用 `native` 关键字声明一个代理方法，并且你显然需要将该方法放在类中。结果显示在\
  \ Listing 13.1 中。\n\n`native` 关键字告知编译器该方法将在外部定义。当然，原生方法将不包含任何 Java 代码，且方法头后面紧跟一个结束分号。因此，原生方法的声明看起来与抽象方法的声明相似。\n\
  \nListing 13.1 v2ch13/jnidemo/HelloNative.java\n\n```java\npackage v2ch13.jnidemo;\n\
  \nclass HelloNative {  \n    public static native int printf(String str);\n}\n```\n\
  \n在这个特定的示例中，原生方法也被声明为 `static`。原生方法既可以是静态的，也可以是非静态的。\n\n你实际上可以编译这个类，但如果你尝试在程序中使用它，虚拟机会告诉你它不知道如何找到\
  \ `printf`——报告 `UnsatisfiedLinkError`。要实现原生代码，请编写一个对应的 `C` 函数。你必须*完全*按照 Java 虚拟机期望的方式来命名该函数。规则如下：\n\
  \n1. 使用完整的 Java 方法名，例如 `jnidemo.HelloNative.printf`。\n2. 将每个点替换为下划线，并加上前缀 `Java_`。例如，`Java_jnidemo_HelloNative_printf`。\n\
  3. 如果类名包含不是 ASCII 字母或数字的字符——即 `'_'`、`'$'` 或代码大于 `\\u007F` 的 Unicode 字符——将它们替换为 `_0xxxx`，其中\
  \ `xxxx` 是字符 Unicode 值的四位十六进制序列。\n\n如果你*重载*了原生方法——即如果你提供了多个同名的原生方法——你必须附加双下划线，后跟编码后的参数类型。例如，如果你有一个原生方法\
  \ `greeting()` 和另一个原生方法 `greeting(int repeat)`，那么第一个被称为 `Java_jnidemo_HelloNative_greeting__`，第二个是\
  \ `Java_jnidemo_HelloNative_greeting__I`。\n\n实际上，没有人会手动执行这些；相反，使用 `-h` 标志运行 `javac`，并提供头文件应该放置的目录：\n\
  \n```bash\njavac -h v2ch13/jnidemo v2ch13/jnidemo/HelloNative.java\n```\n\n此命令创建一个头文件\
  \ `v2ch13_jnidemo_HelloNative.h`，如 Listing 13.2 所示。\n\nListing 13.2 v2ch13/jnidemo/HelloNative.h\n\
  \n```c\n/* DO NOT EDIT THIS FILE - it is generated */\n#include <jni.h>\n/* Header\
  \ for class v2ch13_jnidemo_HelloNative */\n\n#ifndef _Included_v2ch13_jnidemo_HelloNative\n\
  #define _Included_v2ch13_jnidemo_HelloNative\n\n#ifdef __cplusplus\nextern \"C\"\
  \ {\n#endif\n\n/*\n * Class:     v2ch13_jnidemo_HelloNative\n * Method:    printf\n\
  \ * Signature: (Ljava/String;)I\n */\nJNIEXPORT jint JNICALL Java_v2ch13_jnidemo_HelloNative_printf\n\
  \  (JNIEnv *, jclass, jstring);\n\n#ifdef __cplusplus\n}\n#endif\n#endif /* _Included_v2ch13_jnidemo_HelloNative\
  \ */\n```\n\n正如你所，此文件包含了 `Java_v2ch13_jnidemo_HelloNative_printf` 的声明。（`JNIEXPORT`\
  \ 和 `JNICALL` 宏在头文件中定义，表示来自动态加载库的编译器限定符。）\n\n现在，将头文件中的函数原型复制到源文件中，并给出该函数的实现代码，如\
  \ Listing 13.3 所示。\n\n你可以使用 C++ 来实现原生方法。然而，你必须将实现原生方法的函数声明为 `extern \"C\"`。（这可以阻止\
  \ C++ 编译器对方法名进行修饰。）例如，\n\n```cpp\nextern \"C\"\nJNIEXPORT int JNICALL Java_v2ch13_jnidemo_HelloNative_printf(JNIEnv*\
  \ env,\n    jclass cl, . . .) { . . }\n```\n\nListing 13.3 v2ch13/jnidemo/HelloNative.c\n\
  \n```c\n#include \"v2ch13_jnidemo_HelloNative.h\"\n#include <stdio.h>\n\nJNIEXPORT\
  \ jint JNICALL Java_v2ch13_jnidemo_HelloNative_printf(\n        JNIEnv *env, jclass\
  \ cl, jstring jstr) {\n    const char *cstr = (*env)->GetStringUTFChars(env, jstr,\
  \ NULL);\n    int numchars = printf(cstr);\n    (*env)->ReleaseStringUTFChars(env,\
  \ jstr, cstr);\n    return numchars;\n}\n```\n\n我们不会深入探讨这段代码，但有两个亮点。\n\n每个原生函数都会接收一个\
  \ `env` 参数，它是访问原生调用 C API 所需的。你可以在调用 `(*env)->GetStringUTFChars(...)` 中看到示例。\n\n\
  `cl` 参数是 Java 类的描述符。在实例方法中，你将得到一个调用该原生方法的对象的描述符。\n\n\n\n\n接下来，让我们来看看如何将字符串传递给原生方法。带有\
  \ `String` 参数的原生方法会接收一个名为 `jstring` 的不透明类型的值。字符串在两种语言中非常不相同：在 Java 中，字符串是 UTF-16\
  \ 代码点的序列，而 C 字符串是空终止结尾的字节序列。JNI 提供了两组用于操作字符串的函数：一组将 Java 字符串转换为“修改后的 UTF-8”（modified\
  \ UTF-8）字节序列，另一组则将它们转换为 UTF-16 值数组。（UTF-8、“修改后的 UTF-8”和 UTF-16 格式在第二章 中讨论过。请记住，UTF-8\
  \ 和“修改后的 UTF-8”编码保持 ASCII 字符不变，但所有其他 Unicode 字符都被编码为多字节序列。）\n\n标准 UTF-8 编码和“修改后的\
  \ UTF-8”编码对于代码高于 `0xFFFF` 的字符存在差异。在标准 UTF-8 编码中，这些字符被编码为 4 字节序列。在“修改后”编码中，每个此类字符首先被编码为\
  \ UTF-16 编码中的一对“代理”（surrogates），然后每个代理用 UTF-8 编码，总共产生 6 个字节。这很笨拙，但这是一个历史性的偶然——当\
  \ JVM 规范编写时，Unicode 仍被限于 16 位。\n\n在我们的示例中，我们调用了 `printf`，因此转换为 UTF-8。如果我们使用“宽”版本\
  \ `wprintf`，那么 UTF-16 就会合适。\n\n要读取现有 `jstring` 对象的内容，请使用 `GetStringUTFChars` 函数。该函数返回一个指向描述字符串的“修改后的\
  \ UTF-8”字符的指针。注意，特定的虚拟机可以为其内部字符串表示选择这种字符编码，因此你可能会得到指向实际 Java 字符串的字符指针。由于 Java 字符串是不可变的，因此*非常*重要的是你要认真对待\
  \ `const`，不要尝试写入此字符数组。另一方面，如果虚拟机使用 UTF-16 或 UTF-32 字符作为内部字符串表示，此函数调用将分配一个新的内存块，并填充“修改后的\
  \ UTF-8”等效项。\n\n虚拟机必须知道你何时结束使用字符串，以便对其进行垃圾回收。（垃圾回收器在单独线程中运行，它可以中断原生方法的执行。）出于此原因，你必须调用\
  \ `ReleaseStringUTFChars` 函数。\n\n将原生 C 代码编译成动态加载库。细节取决于你的编译器。\n\n例如，在 Linux 上使用\
  \ GNU C 编译器，使用以下命令：\n\n```\ngcc -fPIC -I $JAVA_HOME/include -I $JAVA_HOME/include/linux\
  \ -shared \\\n    -o v2ch13/jnidemo/libHelloNative.so v2ch13/jnidemo/HelloNative.c\n\
  ```\n\n在 Windows 下使用 Microsoft 编译器，命令为：\n\n```bash\ncd v2ch13/jnidemo\ncl -I %JAVA_HOME%\\\
  include -I %JAVA_HOME%\\include\\win32 ^\n    -LD HelloNative.c -FeHelloNative.dll\n\
  ```\n\n最后，在你的程序中添加对 `System.loadLibrary` 方法的调用。为了确保虚拟机在类类之前加载库，请使用静态初始化块，如列表 13.4\
  \ 所示。\n\n图 13.1：处理原生代码\n列表 13.4 v2ch13/jnidemo/HelloNativeDemo.java\n\n```java\n\
  package v2ch13.jnidemo;\n\nclass HelloNativeDemo {  \n    void main() {\n      \
  \  int result = HelloNative.printf(\"Hello, Native World!\\n\");\n        IO.println(\"\
  Printed %d characters.\".formatted(result));\n    }\n\n    static {  \n        System.loadLibrary(\"\
  HelloNative\");\n    }\n}\n```\n\n图 13.1 提供了原生代码处理的摘要。\n\n当你运行此程序时，终端窗口中会显示“Hello,\
  \ Native World!”消息。这是 C 代码的结果。下一行“Printed 21 characters.”是由 Java 代码产生的。我们已经向跨越两种语言之间的鸿沟迈出了第一步！\n\
  \n如果你运行 Linux，必须将当前目录添加到库路径中。可以设置环境变量 `LD_LIBRARY_PATH`：\n\n```bash\nexport LD_LIBRARY_PATH=v2ch13/jnidemo:$LD_LIBRARY_PATH\n\
  ```\n\n或者设置系统属性 `java.library.path`：\n\n```bash\njava -Djava.library.path=v2ch13/jnidemo\
  \ v2ch13.jnidemo.HelloNativeDemo\n```\n\n总结来说，通过 JNI，你遵循以下步骤将原生方法链接到 Java 程序：\n\n\
  1. 在 Java 类中声明原生方法。\n2. 运行 `javac -h` 以获取包含该方法 C 声明的头文件。\n3. 在 C 中实现原生方法。\n4. 将代码放在共享库中。\n\
  5. 在 Java 程序中加载该库。\n\n`java.lang.System` 1.0\n\n*   `void loadLibrary(String libname)`\n\
  \    加载给定名称的库。该库位于库搜索路径中。定位库的具体方法取决于操作系统。\n\n## 13.2. 使用 FFM 调用原生方法\n\nProject Panama\
  \ 极大地简化了这一点。使用 JNI 时，你必须编写 C 代码。而“Project Panama”开发的内存访问 API 比 JNI 更以 Java 为中心。在接下来的章节中，你将看到连接器（linkers）、方法句柄（method\
  \ handles）、区域（arenas）以及内存段。\n\n要访问 C 函数，你首先创建一个 `Linker` 对象。`Linker` 可以根据其地址和类型描述产生\
  \ `MethodHandle`。\n\n列表 13.5 中的程序非常简单。它只是调用了 `printf` 函数。你在之前的示例程序中见过一个例子。在这里，我们使用了受限（confined）区域。\n\
  \n要编译并运行演示，使用以下命令：\n\n```bash\njavac v2ch13/ffmdemo/HelloForeign.java\njava --enable-preview\
  \ --enable-access=ALL-UNNAMED v2ch13.ffmdemo.HelloForeign\n```\n\n列表 13.5 v2ch13/ffmdemo/HelloForeign.java\n\
  \n```java\npackage v2ch13.ffmdemo;\n\nimport java.lang.invoke.*;\nimport java.lang.foreign.*;\n\
  \npublic class HelloForeign {\n    void main() throws Throwable {\n        Linker\
  \ linker = Linker.nativeLinker();\n        MethodHandle printf = linker.downcallHandle(\n\
  \            linker.defaultLookup().findOrThrow(\"printf\"),\n            FunctionDescriptor.of(ValueLayout.JAVA_INT,\
  \ ValueLayout.ADDRESS));\n\n        try (Arena arena = Arena.ofConfined()) {\n \
  \           MemorySegment str = arena.allocateFrom(\"Hello, Foreign World!\\n\"\
  );\n            int result = (int) printf.invoke(str);\n            System.out.printf(\"\
  Printed %d characters.%n\", result);\n        }\n    }\n}\n```\n\n## 13.3. 区域 (Arenas)\n\
  \n与外部函数交互，Java 程序部分需要处理堆外内存；即不是通过调用 `new` 分配的内存。\n\n区域（arena）管理堆外内存段的生命周期。你在之前的示例程序中见过一个例子。\n\
  \n```java\ntry (Arena arena = Arena.ofConfined()) {\n    MemorySegment str = arena.allocateFrom(.\
  \ . .);\n    . . .\n} // 区域关闭\n```\n\n`Arena` 类实现了 `AutoCloseable`，`arena` 实例在 `try`\
  \ 块结束时关闭。此后任何分配的段将失效。尝试访问它们将导致异常。\n\n\n\n在这里，使用了 `confined`（受限）arena。`confined`\
  \ arena 分配的内存段只能在 arena 的 `owner thread`（所有者线程）中使用，通常是创建该 arena 的线程。arena 也必须在该线程中关闭，否则将抛出异常。\n\
  \n如果内存段必须被多个线程共享，则不能使用 `confined` arena。一种方案是使用 `shared`（共享）arena，它会在你对其调用 `close`\
  \ 之前一直有效。在适当的时间关闭 arena 取决于你。\n\n或者，你可以使用 `automatic`（自动）arena。当内存段及其 arena 都不再引用时，垃圾回收器最终会释放这些内存段。这很方便，但预测性较低。你无法关闭一个\
  \ `automatic` arena。\n\n```\nMemorySegment segment = Arena.ofAuto().allocate(. .\
  \ .);\n. . .\nsegment = null; // 内存最终会被释放\n```\n\n在这个示例中，自动 arena 只使用了一次，用于分配单个内存段。\n\
  \n最后，`global arena`（全局 arena）永远不会被关闭，它分配的内存段也永远不会被释放。\n\n你不能释放单个内存段。要释放一个内存段，你需要关闭分配它的（受限或共享）arena。\n\
  \n`表 13.1` 总结了四种 arena 类型的特征。\n\n**表 13.1：Arena 类型\n\n| 类型 | 是否可从多个线程访问 | 如何关闭 |\n\
  | --- | --- | --- |\n| Confined |   | 通过调用 `close` |\n| Shared | ✓ | 通过调用 `close`\
  \ |\n| Automatic | ✓ | 通过垃圾回收器 |\n| Global | ✓ | 永远不 |\n\n`java.lang.foreign.Arena22`\n\
  \n*   `static void ofConfined()`\n*   `static void ofShared()`\n*   `static void\
  \ ofAuto()`\n    返回一个受限、共享或自动 arena。\n\n## 13.4 内存段 (Memory Segments)\n\n内存段（Memory\
  \ segment）是一块连续的内存。它可以位于 Java 堆上并由垃圾回收器管理，也可以是 `native`（原生的），分配在 Java 堆之外。堆外内存段具有固定的物理地址。堆段与任何\
  \ Java 对象一样，通过引用来定位，但没有固定地址，因为垃圾回收器可能会移动它。为了与外部函数一起使用，我们通常对堆外内存段感兴趣。\n\n你使用 arena\
  \ 对象来分配堆外段。正如你已经看到的，调用：\n\n```\nString javaString = . . .;\nMemorySegment cString\
  \ = arena.allocateFrom(javaString);\n```\n\n会将 Java 字符串编码为 UTF-8 并分配一个包含这些字节（包括空终止符）的内存段。\n\
  \n要分配数组，你需要指定元素布局（layout）和元素数量。你将看到如何在第 13.5 节` 中使用 `MemoryLayout` 接口。目前，我们将利用 `ValueLayout`\
  \ 类中定义的布局常量。例如，这里是分配一个 `float` 数值数组的方法：\n\n```\nMemorySegment audioIn = arena.allocate(ValueLayout.JAVA_FLOAT,\
  \ sampleCount);\n```\n\n如果你已经在数组中拥有了这些值，请使用 `allocateFrom` 方法：\n\n```\nfloat[] samples\
  \ = . . .;\nMemorySegment audioOut = arena.allocateFrom(ValueLayout.JAVA_FLOAT,\
  \ samples);\n```\n\n当将内存段传递给 C 函数时，该函数会接收该段的地址。然后它可以处理字符串或数组的内容。\n\n相反，假设一个 C 函数已向内存段填充了数据。要将一个空终止的\
  \ UTF-8 字符串转换为 Java 字符串，你向 `getString` 方法传递偏移量 0：\n\n```\nString javaString = cString.getString(0);\n\
  ```\n\n若要在数组索引处进行读取或写入，请提供内存布局和索引：\n\n```\nfloat sample = audioIn.getAtIndex(ValueLayout.JAVA_FLOAT,\
  \ i);\naudioIn.setAtIndex(ValueLayout.JAVA_FLOAT, i, 0f);\n```\n\n你也可以获取一个包含所有值的\
  \ Java 数组：\n\n```\nfloat[] samples = audioIn.toArray(ValueLayout.JAVA_FLOAT);\n\
  ```\n\n`elements` 方法产生一个内存段流，每个元素对应一个内存段。你可以将其中每一个段映射为一个值，然后进一步处理该流。\n\n```\nDoubleStream\
  \ samples = audioIn.elements(ValueLayout.JAVA_FLOAT)\n    .mapToDouble(ValueLayout.JAVA_FLOAT));\n\
  ```\n\n`get` 方法产生一个内存段流，每个元素对应一个内存段。你可以将其中每一个段映射为一个值，然后进一步处理该流。\n\n`get` 方法类似于 `AtIndex`，但它接收\
  \ `layout`。注意，`segment` 不会保留关于 `layout` 的任何信息。\n\n`java.lang.foreign.Segment22`\n\
  \n*   `MemorySegment allocate(MemoryLayout)`\n    分配到堆外。\n*   `MemorySegment allocate(MemoryLayout,\
  \ long count)`\n    分配堆外元素。\n*   `MemorySegment allocateFrom(String str)`\n    带上\
  \ `str` 分配到堆外。\n*   `MemorySegment allocate(long size, long alignment)`\n    根据大小和对齐方式分配到堆外。\n\
  *   `Stream<MemorySegment> elements(MemoryLayout)`\n    产生一个顺序切片流。\n\n`java.lang.foreign.MemorySegment22`\n\
  \n*   `String getString(long offset)`\n    将指定 `offset` 处的空终止 UTF-8 字符串转换为 Java\
  \ 字符串。\n*   `long getAtIndex(MemoryLayout layout, long index)`\n    在索引处读取原始类型。\n\
  *   `void setAtIndex(MemoryLayout layout, long index, long value)`\n    在索引处写入原始类型。\n\
  *   `long get(MemoryLayout layout, long offset)`\n    在指定偏移量处读取原始类型。\n*   `void\
  \ set(MemoryLayout layout, long offset, long value)`\n    在指定偏移量处写入原始类型。\n*   `long[]\
  \ toArray(MemoryLayout layout)`\n    将此段的内容转换为原始类型数组。\n\n## 13.5 内存布局 (Memory Layout)\n\
  \n在前节中，你已经学会了如何处理 UTF-8 字符串和原始值的内存段。\n\n在 C 中，你使用 `struct` 处理复杂数据。例如，`libsndfile`（[`github.com/libsndfile`](https://github.com/libsndfile)）产生如下结构：\n\
  \n```\nstruct SF_INFO {\n    long frames;\n    int samplerate;\n    int channels;\n\
  \    int format;\n    int sections;\n    int seekable;\n}\n```\n\n你可以如下定义该结构的布局：\n\
  \n```\nimport static java.lang.foreign.ValueLayout.*;\n. . .\nStructLayout SF_INFO\
  \ = MemoryLayout.structLayout(\n    JAVA_LONG.withName(\"frames\"),\n    JAVA_INT.withName(\"\
  samplerate\"),\n    JAVA_INT.withName(\"channels\"),\n    JAVA_INT.withName(\"format\"\
  ),\n    JAVA_INT.withName(\"sections\"),\n    JAVA_INT.withName(\"seekable\")\n\
  );\n```\n\n在匹配 C 和 Java 类型时，字节长度需要匹配。但无符号 C 类型被映射为等尺寸的 Java 类型。如果你在 Java 中处理这些值，你需要自己处理无符号值。\n\
  \n表达式 `Linker.nativeLinker().canonicalLayouts()` 产生从常用类型名称到内存布局的映射。例如，在 64 位平台上，`\"\
  size_t\"` 被映射为字节大小 8 的 `MemoryLayout`，因此你知道使用 `JAVA_LONG` 在 Java 中表示 C 类型 `size_t`。\n\
  \n映射类型包括：`bool`, `char`, `short`, `int`, `long`, `long long`, `float`, `double`,\
  \ `size_t`, `wchar_t`, `void*`。\n\n假设你有一个具有刚才定义的 `SF_INFO` 布局的内存段 `info`。以下是获取其中一个组件的方法：\n\
  \n```\nint channels = info.get(JAVA_INT,\n    SF_INFO.byteOffset(PathElement.groupElement(\"\
  channels\")));\n```\n\n\n\n你已经看到过 `get` 方法，它接收一个内存布局和一个字节偏移量。`StructLayout` 可以确定每个元素的偏移量。在这种情况下，偏移量为\
  \ 12，因为 `\"channels\"` 元素之前是大小为 8 和 4 的元素。\n\n为了处理嵌套结构，有许多接口来描述布局——参见图 13.2。\n\n\
  `ValueLayout` 接口有子类型 `ValueLayout.OfInt`、`ValueLayout.ofLong` 等，每个原始类型各对应一个子类型。`ValueLayout`\
  \ 接口中的常量 `JAVA_INT`、`JAVA_LONG` 等是这些类型的实例。`AddressLayout` 持有一个内存地址。\n\n.图 13.2:\
  \ 内存布局层级结构（The MemoryLayout Hierarchy）\n\n正如你所看到的，`StructLayout` 描述了 C 结构体的布局。同样，`UnionLayout`\
  \ 描述了 C 联合体（union）。这并不常见，但如果你需要处理联合体，使用 `UnionLayout` 接口不会有任何问题。它与 `StructLayout`\
  \ 完全对应。\n\n`PaddingLayout` 描述填充字节（padding bytes）。你有时需要插入它们以确保后续元素能够正确对齐。\n\n让我们使用\
  \ `SequenceLayout` 来建模结构体数组：\n\n```\nlong count = . . .;\nSequenceLayout arrayOfPointLayout\
  \ = MemoryLayout.sequenceLayout(count,\n    MemoryLayout.structLayout(\n       \
  \ JAVA_FLOAT.withName(\"x\"),\n        JAVA_FLOAT.withName(\"y\")));\n```\n\n要访问索引为\
  \ i 的点的单个 x 组件或 y 分量，我们需要计算字节偏移量：\n\n```\nlong offset = arrayOfPointLayout.byteOffset(\n\
  \    PathElement.sequenceElement(i), PathElement.groupElement(\"y\"));\n```\n\n\
  `byteOffset` 方法接收一个 `MemoryLayout.PathElement` 对象序列，用于导航到所选值。\n\n现在，给定具有该布局的内存段，我们可以获取或设置值：\n\
  \n```\nMemorySegment arrayOfPoints = Arena.global().allocate(arrayOfPointLayout);\n\
  arrayOfPoints.set(JAVA_FLOAT, offset, yvalue);\n```\n\n关于内存布局和访问内存段中的值还有更多内容需要了解，但你现在看到的已经足够在\
  \ Java 和原生函数之间传递复杂数据。我们将在下一节中讨论。更多信息请参见第 13.8.1 节。\n\n### java.lang.foreign.MemoryLayout22\n\
  \n*   `static StructLayout structLayout(MemoryLayout... elements)`\n*   `static\
  \ UnionLayout unionLayout(MemoryLayout... elements)`\n    为具有给定元素的 `struct` 或 `union`\
  \ 创建布局。\n*   `static SequenceLayout sequenceLayout(long elementCount, MemoryLayout\
  \ elementLayout)`\n    为给定长度的数组创建布局，其元素具有给定的布局。\n*   `static PaddingLayout unionLayout(long\
  \ byteSize)`\n    为具有给定字节数的填充创建布局。\n*   `long byteOffset(MemoryLayout.PathElement...\
  \ elements)`\n    产生该布局中由给定路径指定的第一个值的偏移量。\n\n### java.lang.foreign.MemoryLayout.PathElement22\n\
  \n*   `static MemoryLayout.PathElement groupElement(String name)`\n    产生一个指向组布局中具有给定名称的元素的路径。\n\
  *   `static MemoryLayout.PathElement sequenceElement(long index)`\n    产生一个指向序列布局中具有给定索引的元素的路径。\n\
  \n### java.lang.foreign.ValueLayout22\n\n*   `ValueLayout withName(String name)`\n\
  \    产生一个具有给定名称的此布局副本。\n\n## 13.6. 查找和调用原生函数\n\n在编译 C 代码时，*链接器*（linker）会执行将编译后的文件与库函数的预编译代码相结合的关键步骤，生成一个可执行文件。\n\
  \nFFM API 中的 `Linker` 抽象并不完全是做同样的事情。它查找库函数并准备用于调用它们的 `MethodHandle` 对象。\n\n实际上，“查找”部分被委托给了一个\
  \ `SymbolLookup` 实例。若要在一些标准库中查找函数，请使用默认查找：\n\n```\nLinker linker = Linker.nativeLinker();\
  \ // 针对底层平台的链接器\nSymbolLookup stdlib = linker.defaultLookup();\n```\n\n默认查找所感知的库取决于平台。在\
  \ Linux 上，它们包括 `libc` 和 `libm`。这种查找对于 `printf` 和 `malloc` 等已知函数已经足够了。\n\n要与特定库配合使用，请按如下方式创建查找器：\n\
  \n```\nSymbolLookup sndfile = SymbolLookup.libraryLookup(\n    \"/lib/x86_64-linux-gnu/libsndfile.so\"\
  , arena);\n```\n\n你指定库文件的路径（作为字符串或 `Path` 对象）以及一个 arena。`libraryLookup` 方法加载该库。当\
  \ arena 关闭时，该库会被卸载。\n\n还有一个*加载器查找*（loader lookup），由 `SymbolLookup.loaderLookup()`\
  \ 返回，它用于查找通过调用 `System.load` 和 `System.loadLibrary` 加载的库中的函数。\n\n现在你准备好查找函数了：\n\n\
  ```\nMemorySegment mallocAddr = stdlib.findOrThrow(\"malloc\");\nMemorySegment sfOpenAddr\
  \ = sndfile.findOrThrow(\"sf_open\");\n```\n\n如果未找到函数，`findOrThrow` 方法将抛出 `NoSuchElementException`。还有一个\
  \ `find` 方法，它返回一个 `Optional<MemorySegment>` 作为替代。内存段包含了要调用的地址。\n\n关于内存布局和访问内存段中的值还有更多内容需要了解，但你现在看到的已经足够在\
  \ Java 和原生函数之间传递复杂数据。我们将在将在节中讨论。更多信息请参见第 13.8.1 节。\n\n### java.lang.foreign.MemoryLayout22\n\
  \n*   `static StructLayout structLayout(MemoryLayout... elements)`\n*   `static\
  \ UnionLayout unionLayout(MemoryLayout... elements)`\n    为具有给定元素的 `struct` 或 `union`\
  \ 创建布局。\n*   `static SequenceLayout sequenceLayout(long elementCount, MemoryLayout\
  \ elementLayout)`\n    为给定长度的数组创建布局，其元素具有给定的布局。\n*   `static PaddingLayout unionLayout(long\
  \ byteSize)`\n    为具有给定字节数的填充创建布局。\n*   `long byteOffset(MemoryLayout.PathElement...\
  \ elements)`\n    产生该布局中由给定路径指定的第一个值的偏移量。\n\n### java.lang.foreign.MemoryLayout.PathElement22\n\
  \n*   `static MemoryLayout.PathElement groupElement(String name)`\n    产生一个指向组布局中具有给定名称的元素的路径。\n\
  *   `static MemoryLayout.PathElement sequenceElement(long index)`\n    产生一个指向序列布局中具有给定索引的元素的路径。\n\
  \n### java.lang.foreign.ValueLayout22\n\n*   `ValueLayout withName(String name)`\n\
  \    产生一个具有给定名称的此布局副本。\n\n## 13.6. 查找和调用原生函数\n\n在编译 C 代码时，*链接器*（linker）会执行将编译后的文件与库函数的预编译代码相结合的关键步骤，生成一个可执行文件。\n\
  \nFFM API 中的 `Linker` 抽象并不完全是做同样的事情。它查找库函数并准备用于调用它们的 `MethodHandle` 对象。\n\n实际上，“查找”部分被委托给了一个\
  \ `SymbolLookup` 实例。若要在一些标准库中查找函数，请使用默认查找：\n\n```\nLinker linker = Linker.nativeLinker();\
  \ // 针对底层平台的链接器\nSymbolLookup stdlib = linker.defaultLookup();\n```\n\n默认查找所感知的库取决于平台。在\
  \ Linux 上，它们包括 `libc` 和 `libm`。这种查找对于 `printf` 和 `malloc` 等已知函数已经足够了。\n\n要与特定库配合使用，请按如下方式创建查找器：\n\
  \n```\nSymbolLookup sndfile = SymbolLookup.libraryLookup(\n    \"/lib/x86_64-linux-gnu/libsndfile.so\"\
  , arena);\n```\n\n你指定库文件的路径（作为字符串或 `Path` 对象）以及一个 arena。`libraryLookup` 方法加载该库。当\
  \ arena 关闭时，该库会被卸载。\n\n还有一个*加载器查找*（loader lookup），由 `SymbolLookup.loaderLookup()`\
  \ 返回，它用于查找通过调用 `System.load` 和 `System.loadLibrary` 加载的库中的函数。\n\n现在你准备好查找函数了：\n\n\
  ```\nMemorySegment mallocAddr = stdlib.findOrThrow(\"malloc\");\nMemorySegment sfOpenAddr\
  \ = sndfile.findOrThrow(\"sf_open\");\n```\n\n如果未找到函数，`findOrThrow` 方法将抛出 `NoSuchElementException`。还有一个\
  \ `find` 方法，它返回一个 `Optional<MemorySegment>` 作为替代。内存段包含了要调用的地址。\n\n（注：此处由于原文中存在部分重复内容，已根据指令要求去重处理，确保翻译逻辑的逻辑性。）\n\
  \n对于返回类型为 `void` 的函数，你使用 `FunctionDescriptor.ofVoid` 代替：\n\n```\n// void free(void\
  \ *ptr)\nMethodHandle freeHandle = linker.downcallHandle(\n    stdlib.findOrThrow(\"\
  free\"),\n    FunctionDescriptor.ofVoid(ADDRESS));\n```\n\n这里，我们请求一个用于从 Java 代码调用\
  \ C 函数的*下行句柄*（downcall handle）。在第 13.7 节中，你将看到如何使用内存句柄从 C 调用 Java 方法。\n\n\n\n\n\n\
  向 C 函数传递指针或接收指针结果时，你需要使用 `ValueLayout.ADDRESS`。内存块的类型并不重要。\n\n你必须准确地描述函数的返回类型和参数类型。链接器无法验证这些信息。如果你提供了错误的信息，虚拟机可能会崩溃。\n\
  \n最后，我们准备好调用该方法了。\n\n```\nMemorySegment block = mallocHandle.invoke(blockSize);\n\
  \nMemorySegment info = arena.allocate(SF_INFO);\nMemorySegment cInputPath = arena.allocateFrom(inputFile);\n\
  MemorySegment inFile = (MemorySegment) sf_open.invoke(cInputPath, SFM_READ, info);\n\
  ```\n\n当外部函数返回指针时，它会被封装进“零长度”的内存段中。要从该内存段中读取数据，你需要关于其大小和结构的一些外部知识。\n\n例如，你知道 `malloc`\
  \ 分配的内存块的大小，因此你可以设置：\n\n```\nblock = block.reinterpret(blockSize);\n```\n\n显然，这是一个潜在的不安全操作。如果你使用了超出实际边界的任何内存段，可能会损坏不相关的内存或导致虚拟机崩溃。\n\
  \n你可以在 [`github.com/openjdk/jextract`](https://github.com/openjdk/jextract) 找到 `jextract`\
  \ 工具，它可以根据 C 头文件自动生成外部调用的内存布局和封装。\n\n现在你已经足够了解 FFM API，可以编写调用原生库的非平凡程序。Listing 13.6\
  \ 中的程序就是一个典型的示例。它使用 `libsndfile` 库读取音频文件，反转采样，并将结果写入另一个文件。\n\n程序首先为 `SF_INFO` 结构设置布局，并为四个\
  \ C 函数设置内存句柄：\n\n```\nSNDFILE* sf_open(const char *path, int mode, SF_INFO *sfinfo)\n\
  int sf_close(SNDFILE *sndfile)\nsf_count_t sf_read_float(SNDFILE *sndfile, float\
  \ *ptr, sf_count_t items)\nsf_count_t sf_write_float(SNDFILE *sndfile, const float\
  \ *ptr, sf_count_t items)\n```\n\n然后，程序打开输入文件并从 `SF_INFO` 结构中获取帧数和通道数。\n\n接下来，对\
  \ `sf_read_float` 的调用将预先分配的内存段填充了采样数据。\n\n为了在 Java 中方便处理，将内存段转换为 Java 数组。处理后，数据被写入输出文件。\n\
  \nListing 13.6 v2ch13/sound/SoundFileReverser.java\n\n```java\npackage v2ch13.sound;\n\
  \nimport module java.base;\n\nimport static java.lang.foreign.ValueLayout.*;\n\n\
  class SoundFileReverser {\n    static final int SFM_READ = 0x10;\n    static final\
  \ int SFM_WRITE = 0x20;\n\n    void main(String[] args) throws Throwable {\n   \
  \     String inputFile = args.length > 0 ? args[0] : \"sound/input.mp3\";\n    \
  \    String outputFile = args.length > 1 ? args[1] : \"sound/output.mp3\";\n\n \
  \       Linker linker = Linker.nativeLinker();\n        SymbolLookup sndfile = SymbolLookup.libraryLookup(\n\
  \            \"/lib/x86_64-linux-gnu/libsndfile.so\", Arena.ofAuto());\n\n     \
  \   StructLayout SF_INFO = MemoryLayout.structLayout(\n            JAVA_LONG.withName(\"\
  frames\"),\n            JAVA_INT.withName(\"samplerate\"),\n            JAVA_INT.withName(\"\
  channels\"),\n            JAVA_INT.withName(\"format\"),\n            JAVA_INT.withName(\"\
  sections\"),\n            JAVA_INT.withName(\"seekable\")\n        );\n\n      \
  \  MethodHandle sf_open = linker.downcallHandle(\n            sndfile.findOrThrow(\"\
  sf_open\"),\n            FunctionDescriptor.of(ADDRESS, ADDRESS, JAVA_INT, ADDRESS)\n\
  \        );\n\n        MethodHandle sf_close = linker.downcallHandle(\n        \
  \    sndfile.findOrThrow(\"sf_close\"),\n            FunctionDescriptor.of(JAVA_INT,\
  \ ADDRESS)\n        );\n\n        MethodHandle sf_readf_float = linker.downcallHandle(\n\
  \            sndfile.findOrThrow(\"sf_readf_float\"),\n            FunctionDescriptor.of(JAVA_LONG,\
  \ ADDRESS, ADDRESS, JAVA_LONG)\n        );\n\n        MethodHandle sf_writef_float\
  \ = linker.downcallHandle(\n            sndfile.findOrThrow(\"sf_writef_float\"\
  ),\n            FunctionDescriptor.of(JAVA_LONG, ADDRESS, ADDRESS, JAVA_LONG)\n\
  \        );\n\n        try (Arena arena = Arena.ofConfined()) {\n            MemorySegment\
  \ info = arena.allocate(SF_INFO);\n            MemorySegment cInputPath = arena.allocateFrom(inputFile);\n\
  \n            // Open sound file\n            MemorySegment inFile = (MemorySegment)\
  \ sf_open.invoke(cInputPath, SFM_READ, info);\n            if (inFile == MemorySegment.NULL)\n\
  \                throw new RuntimeException(\"sf_open: Failed for \" + inputFile);\n\
  \            long frames = info.get(JAVA_LONG,\n                SF_INFO.byteOffset(PathElement.groupElement(\"\
  frames\")));\n            int channels = info.get(JAVA_INT,\n                SF_INFO.byteOffset(PathElement.groupElement(\"\
  channels\")));\n            long totalSamples = frames * channels;\n\n         \
  \   // Allocate native memory for audio samples\n            MemorySegment audioIn\
  \ = arena.allocate(JAVA_FLOAT, totalSamples);\n\n            // Read samples\n \
  \           long actualFrames = (long) sf_readf_float.invoke(\n                inFile,\
  \ audioIn, frames);\n            if (frames != actualFrames)\n                throw\
  \ new RuntimeException(\n                    \"sf_readf_float: Expected %d frames\
  \ but read %d frames.\"\n                    .formatted(frames, actualFrames));\n\
  \n            // Copy native array to Java and process\n            float[] audioSamples\
  \ = audioIn.toArray(JAVA_FLOAT);\n\n            // Reverse the frames\n        \
  \    for (int f = 0; f < frames / 2; f++) {\n                for (int c = 0; c <\
  \ channels; c++) {\n                    int i = f * channels + c;\n            \
  \        int j = (int)((frames - 1 - f) * channels + c);\n                    float\
  \ temp = audioSamples[i];\n                    audioSamples[i] = audioSamples[j];\n\
  \                    audioSamples[j] = temp;\n                }\n            }\n\
  \n            // Write to sound file\n            MemorySegment cOutputPath = arena.allocateFrom(outputFile);\n\
  \            MemorySegment outFile = (MemorySegment) sf_open.invoke(\n         \
  \       cOutputPath, SFM_WRITE, info);\n            if (outFile == MemorySegment.NULL)\n\
  \                throw new RuntimeException(\"sf_open: Failed for \" + outputFile);\n\
  \n            // Copy Java array to native and write\n            MemorySegment\
  \ audioOut = arena.allocateFrom(JAVA_FLOAT, audioSamples);\n\n            actualFrames\
  \ = (long) sf_writef_float.invoke(\n                outFile, audioOut, frames);\n\
  \            if (frames != actualFrames)\n                throw new RuntimeException(\n\
  \                    \"sf_writef_float: Expected to write %d frames but wrote %d\
  \ frames.\"\n                    .formatted(frames, actualFrames));\n\n        \
  \    sf_close.invoke(inFile);\n            int error = (int) sf_close.invoke(outFile);\n\
  \            if (error != 0)\n                throw new RuntimeException(\"sf_close:\
  \ Failed with error code \" + error);\n            System.out.println(\"Reversed\
  \ \" + inputFile + \" to\" + outputFile);\n        }\n    }\n}\n```\n\n\n\n根据给定名称返回符号，如果未找到符号，则返回空的\
  \ `Optional` 或抛出 `NoSuchElementException`。\n\n`java.lang.foreign.FunctionDescriptor`22\n\
  \n*   `static FunctionDescriptor ofVoid(MemoryLayout... argLayouts)`\n*   `static\
  \ FunctionDescriptor of(MemoryLayout resLayout, MemoryLayout... argLayouts)`\n \
  \   返回具有给定参数布局和返回类型 `void` 的函数描述符，或者给定返回布局的描述符。\n\n`java.lang.invoke.MethodHandle`7\n\
  \n*   `Object invoke(Object... args)`\n    使用给定参数调用方法句柄。\n\n`java.lang.foreign.MemorySegment`22\n\
  \n*   `MemorySegment reinterpret(long newSize)`\n    返回此内存段的给定大小的拷贝。\n\n## 13.7.\
  \ 回调函数 (Callbacks)\n\n有时，你会调用一个外部函数，该函数在事件发生时想要调用另一个函数；例如，当麦克风或摄像头检测到输入时。我更倾向于用一个真实的示例来演示这一点，但这需要大量的模板代码和配置。相反，这里有一个使用标准库中\
  \ `qsort` 函数的示例：\n\n```\nvoid qsort(void *base, size_t nmemb, size_t size,\n   \
  \ int (*compar)(const void *, const void *));\n```\n\n最后一个参数是一个指向函数的指针，该函数每比较两个元素时被调用一次。\n\
  \n我们希望以下 Java 方法被回调：\n\n```\nstatic int comp(MemorySegment a, MemorySegment b) {\n\
  \    return Float.compare(a.get(JAVA_FLOAT, 0), b.get(JAVA_FLOAT, 0));\n}\n```\n\
  \n如前提到的，请记住这是一个用于展示回调机制的演示性示例。通常不会将这项工作拆分在 Java 和 C 语言之间。\n\n下面的代码段以通常的方式获取外部函数的方法句柄：\n\
  \n```\nLinker linker = Linker.nativeLinker();\nMethodHandle qsort = linker.downcallHandle(\n\
  \    linker.defaultLookup().findOrThrow(\"qsort\"),\n    FunctionDescriptor.of(ADDRESS,\
  \ JAVA_LONG, JAVA_LONG, ADDRESS));\n```\n\n在调用函数时，我们提供一个数组、其长度、每个元素的字节大小以及回调的地址。\n\
  \n为了生成该地址，首先获取静态 Java 方法的 `MemoryHandle`：\n\n```\nMethodHandle compHandle = MethodHandles.lookup()\n\
  \    .findStatic(UpcallDemo.class, \"comp\",\n        MethodType.methodType(\n \
  \           int.class, MemorySegment.class, MemorySegment.class));\n```\n\n这与外部函数无关。你可以获取任何\
  \ Java 方法的方法句柄，并在之后调用它。\n\n链接器可以为 C 函数生成存根代码（stub code），随后会调用回调的方法句柄：\n\n```\nMemorySegment\
  \ compStub = linker.upcallStub(\n    compHandle,\n    FunctionDescriptor.of(JAVA_INT,\n\
  \        ADDRESS.withTargetLayout(ValueLayout.JAVA_FLOAT),\n        ADDRESS.withTargetLayout(ValueLayout.JAVA_FLOAT)),\n\
  \    arena);\n```\n\n注意 `withTargetLayout` 调用。它们配置了内存布局，以便链接器能够生成代码来配置 Java 回调接收到的\
  \ `MemorySegment` 实例。如果你不这样做，Java 回调中的 `a.get(JAVA_FLOAT, 0)` 和 `b.get(JAVA_FLOAT,\
  \ 0)` 将将失败，因为内存段 `a` 和 `b` 的大小为零。\n\n最后，你已经准备好使用回调地址调用外部函数了：\n\n```\nfloat[] samples\
  \ = . . .;\nMemorySegment csamples = arena.allocateFrom(JAVA_FLOAT, samples);\n\
  qsort.invoke(csamples, samples.length, JAVA_FLOAT.byteSize(), compStub);\n```\n\n\
  你可以在 Listing 13.7 中找到完整的程序。\n\nListing 13.7 v2ch13/upcall/UpcallDemo.java\n\n```java\n\
  package v2ch13.upcall;\n\nimport module java.base;\n\nimport static java.lang.foreign.ValueLayout.*;\n\
  \nclass UpcallDemo {\n    static int comp(MemorySegment a, MemorySegment b) {\n\
  \        return Float.compare(a.get(JAVA_FLOAT, 0), b.get(JAVA_FLOAT, 0));\n   \
  \ }\n\n    void main() throws Throwable {\n        Linker linker = Linker.nativeLinker();\n\
  \        MethodHandle qsort = linker.downcallHandle(\n            linker.defaultLookup().findOrThrow(\"\
  qsort\"),\n            FunctionDescriptor.ofVoid(ADDRESS, JAVA_LONG, JAVA_LONG,\
  \ ADDRESS));\n\n        MethodHandle compHandle = MethodHandles.lookup()\n     \
  \       .findStatic(UpcallDemo.class, \"comp\", \n                MethodType.methodType(\n\
  \                    int.class, MemorySegment.class, MemorySegment.class));\n\n\
  \        MemorySegment compStub = linker.upcallStub(\n            compHandle,\n\
  \            FunctionDescriptor.of(JAVA_INT,\n                ADDRESS.withTargetLayout(ValueLayout.JAVA_FLOAT),\n\
  \                ADDRESS.withTargetLayout(ValueLayout.JAVA_FLOAT)),\n          \
  \  Arena.ofAuto());\n\n        float[] samples = new float[100];\n        RandomGenerator\
  \ generator = RandomGenerator.getDefault();\n        for (int i = 0; i < samples.length;\
  \ i++)\n            samples[i] = generator.nextFloat();\n        try (Arena arena\
  \ = Arena.ofConfined()) {\n            MemorySegment csamples = arena.allocateFrom(JAVA_FLOAT,\
  \ samples);\n            qsort.invoke(csamples, samples.length, JAVA_FLOAT.byteSize(),\
  \ compStub);\n            System.out.println(Arrays.toString(csamples));\n     \
  \   }\n    }\n}\n```\n\n`java.lang.foreign.FunctionDescriptor`22\n\n*   `static\
  \ FunctionDescriptor ofVoid(MemoryLayout... argLayouts)`\n*   `static FunctionDescriptor\
  \ of(MemoryLayout resLayout, MemoryLayout... argLayouts)`\n    返回具有给定参数布局和返回类型 `void`\
  \ 的函数描述符，或者给定返回布局的描述符。\n\n`java.lang.invoke.MethodHandle`7\n\n*   `Object invoke(Object...\
  \ args)`\n    使用给定参数调用方法句柄。\n\n`java.lang.foreign.MemorySegment`22\n\n*   `MemorySegment\
  \ reinterpret(long newSize)`\n    返回此内存段的给定大小的拷贝。\n\n## 13.8. 高级主题\n\n你已经学习了足够的\
  \ FFM API 来编写复杂的程序。API 为一些更复杂的情况提供了解决方案，我们将在后续章节中进行。\n\n### 13.8.1 使用变量句柄访问内存\n\n\
  *变量句柄*（variable handle）允许获取或设置单个值，或通过*坐标*设置多个值。这些坐标可以是数组索引、映射键或任何描述位置的对象。\n\n```\n\
  VarHandle vh = . . .;\nObject value = vh.get(coord1, coord2, . . .);\nvh.set(coord1,\
  \ coord2, . . ., newValue);\n```\n\n在第 13.5 节中，你已经见过如何通过计算元素偏移量来访问结构中的元素。我们查看了 `SF_INFO`\
  \ 结构布局的示例，它有一个 `channels` 元素。\n\n```java\nlong channelsOffset = SF_INFO.byteOffset(PathElement.groupElement(\"\
  channels\"));\nint channels = info.get(JAVA_INT, channelsOffset);\n```\n\n与其计算偏移量，可以使用变量句柄。例如，这里是\
  \ `channels` 元素的变量句柄：\n\n```java\nVarHandle channelsHandle = SF_INFO.varHandle(PathElement.groupElement(\"\
  channels\"));\n```\n\n该变量句柄有一个坐标——持有结构的内存段。以下是在内存段 `info` 内部读取字段值：\n\n```java\n\
  int channels = (int) channelsHandle.get(info);\n```\n\n使用变量句柄并不比计算字节偏移量简单，但更安全一点。毕竟，很容易不小心使用错误的偏移量。\n\
  \n现在考虑一个数组布局：\n\n```java\nlong count = . . .;\nStructLayout pointLayout = MemoryLayout.structLayout(\n\
  \    JAVA_FLOAT.withName(\"x\"),\n    JAVA_FLOAT.withName(\"y\"));\nSequenceLayout\
  \ arrayOfPointLayout = MemoryLayout.sequenceLayout(count, pointLayout);\n```\n\n\
  \n\n这是一个用于数组中点 x 坐标的变量句柄：\n\n```\nVarHandle xHandle = arrayOfPointLayout.varHandle(\n\
  \    PathElement.sequenceElement(),\n    PathElement.groupElement(\"x\"));\n```\n\
  \n`PathElement.sequenceElement()` 调用返回一个开放路径元素，它在变量句柄中产生了另一个坐标。现在你可以通过以下方式访问第 `i`\
  \ 个 x 坐标：\n\n```\nMemorySegment pointSegment = . . .;\nlong i = . . .;\nfloat xi\
  \ = (float) xHandle.get(pointSegment, i);\n```\n\n现在，假设你有一个指针数组，每个指针都指向一个点结构。\n\n\
  ```\nMemoryLayout arrayOfPointPointersLayout = MemoryLayout.sequenceLayout(count,\n\
  \    ValueLayout.ADDRESS.withTargetLayout(pointLayout));\n```\n\n注意 `withTargetLayout`\
  \ 方法，它附加了地址所指向的内存段的布局。过去我们在处理 `ADDRESS` 时没有这样做，因为我们无法利用其类型信息。但现在有一个特殊的路径元素可以跟进指针：\n\
  \n```\nVarHandle xHandle = arrayOfPointPointersLayout.varHandle(\n    PathElement.sequenceElement(),\n\
  \    PathElement.dereferenceElement(),\n    PathElement.groupElement(\"x\"));\n\
  ```\n\n`MemoryLayout` 还可以产生一个用于计算字节偏移量方法句柄，这对于带有开放路径元素的路径可能非常方便。\n\n```\nMethodHandle\
  \ xByteOffsetHandle = arrayOfPointLayout.byteOffsetHandle(\n    PathElement.sequenceElement(),\n\
  \    PathElement.groupElement(\"x\"));\n```\n\n现在你可以这样计算偏移量：\n\n```\nlong offset\
  \ = (long) xByteOffsetHandle(0, i);\n```\n\n第一个参数是基础偏移量，通常为零。\n\n当然，当路径不包含间接层时，这种方法不起作用。\n\
  \n### 13.8.2. 调用外部变参数函数\n\n在 C 中，带有变参数的函数使用特殊的调用约定。经典的例子是：\n\n```\nint printf(const\
  \ char *format, ...);\n```\n\n为了调用此类函数，`FunctionDescriptor` 必须知道固定参数结束和变长参数开始的位置。\n\
  \n你必须为每种参数模式创建一个单独的方法句柄。例如，假设你想调用：\n\n```\nprintf(\"Hello, %s! Next year, you'll\
  \ be %d\\n\", name, age);\n```\n\n你将传递一个格式字符串、另一个字符串和一个整数。\n\n```\nMethodHandle\
  \ printf = linker.downcallHandle(\n    linker.defaultLookup().findOrThrow(\"printf\"\
  ),\n        FunctionDescriptor.of(JAVA_INT, ADDRESS, ADDRESS, JAVA_INT),\n     \
  \   Linker.Option.firstVariadicArg(1));\n```\n\n链接器选项指定了第一个变长参数的索引。\n\n### 13.8.3.\
  \ 捕获 `errno`\n\n某些 C 函数通过将整数错误代码放置在可以使用 `errno` 宏检索的位置来信号错误条件。\n\n要捕获此值，请使用另一个链接器选项：\n\
  \n```\nMethodHandle fopen = linker.downcallHandle(\n    linker.defaultLookup().findOrThrow(\"\
  fopen\"),\n    FunctionDescriptor.of(ADDRESS, ADDRESS, ADDRESS),\n    Linker.Option.captureCallState(\"\
  errno\"));\n```\n\n在调用外部函数之前，为捕获状态分配一个内存段：\n\n```\nStructLayout captureStateLayout\
  \ = Linker.Option.captureStateLayout();\nMemorySegment captureState = arena.allocate(captureStateLayout);\n\
  ```\n\n在调用方法句柄时，将该内存段作为第一个参数传递：\n\n```\nvar result = (MemorySegment) fopen.invoke(captureState,\n\
  \    arena.allocateFrom(\"woozle.txt\"),\n    arena.allocateFrom(\"rw\"));\n```\n\
  \n返回后，你可以从捕获状态读取 `errno`：\n\n```\nlong errnoOffset = capturedStateLayout.byteOffset(PathElement.groupElement(\"\
  errno\"));\nint errno = (int) capturedState.get(JAVA_INT, errnoOffset);\n```\n\n\
  或者使用变量句柄：\n\n```\nVarHandle errnoHandle = captureStateLayout.varHandle(PathElement.groupElement(\"\
  errno\"));\nint errno = (int) errnoHandle.get(capturedState, 0);\n```\n\n要获取可以捕获的值，请查看：\n\
  \n```\nList<MemoryLayout> layouts = Linker.Option.captureStateLayout().memberLayouts();\n\
  ```\n\n在 Linux 上，目前你只能获取 `errno`。\n\n#### java.lang.foreign.MemoryLayout22\n\n-\
  \ `VarHandle varHandle(MemoryLayout.PathElement... elements)` 产生一个用于查找路径指向值的变量句柄。\n\
  - `MethodHandle byteOffsetHandle(MemoryLayout.PathElement... elements)` 产生一个用于计算路径指向值的字节偏移的方法句柄。\n\
  \n#### java.lang.foreign.MemoryLayout.PathElement22\n\n- `static MemoryLayout.PathElement\
  \ sequenceElement()` 产生一个“开放”路径元素，用于选择序列中的一个元素。\n- `static MemoryLayout.PathElement\
  \ dereferenceElement()` 产生一个选择地址布局目标布局的路径元素。\n\n#### java.lang.foreign.AddressLayout22\n\
  \n- `AddressLayout withTargetLayout(MemoryLayout layout)` 产生此布局的副本，带有给定的目标布局；即该地址指向的内存段的布局。\n\
  \n#### java.lang.foreign.Linker.Option22\n\n- `static Linker.Option firstVariadicArg(int\
  \ index)` 产生一个链接器选项，描述在下调用中要链接的函数的第一个变长参数的索引。\n- `static Linker.Option captureCallState(String...\
  \ capturedState)` 产生一个链接器选项，重定向下调用以捕获给定名称的状态项。\n- `static StructLayout captureStateLayout()`\
  \ 产生捕获状态的布局。\n\n你现在已经到达了《Java Java》第二卷的末尾，完成了一段遇到许多高级 API 的漫漫旅程。我从每个 Java 程序员需要知道的话题开始：流、XML、网络、数据库和国际化。我以关于安全、注解处理、高级图形和原生方法等非常技术性的章节作为结束。我希望你喜欢这段\
  \ Java API 广阔领域的之旅，并能够在你的项目中应用新学到的知识。\n\n\n\n# 符号\n\n- `≤` 运算符 7.5.2\n- `methodof`\
