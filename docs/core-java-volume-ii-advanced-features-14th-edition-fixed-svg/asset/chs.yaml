  ...（此处省略重复部分）\n\n### 11.4.4. 下拉框 (Combo Boxes)\n\n如果你有许多备选方案，单选按钮不是一个好选择，因为它们占据了大量的屏幕空间。相反，你可以使用下拉框。当用户点击此组件时，选项列表会弹出来，用户可以选择其中一个（见`图\
  \ 11.15`）。\n\n如果下拉框被设置为*editable*（可编辑），你可以像文本字段一样编辑当前选择。由于这个原因，此组件被称为*combo box*（下拉框）——它将文本字段的灵活性与定义的选项结合在一起。`JComboBox`\
  \ 类提供了下拉框。\n\n从 Java 7 开始，`JComboBox` 类是泛型的。例如，`JComboBox<String>` 持 `String` 对象，而\
  \ `JComboBox<Integer>` 持整数。\n\n调用 `setEditable` 方法使下拉框变为可编辑。注意，编辑仅影响所选项目。它不会以任何方式更改选项列表。\n\
  \n你可以通过 `getSelectedItem` 方法获取当前选择（如果下拉框是可编辑的，它可能已被编辑）。然而，对于可编辑的下拉框，该项目可以是任何类型，取决于获取用户并将结果转换为对象的编辑器。（关于编辑器的讨论请参见第十二章。）如果你的下拉框不可编辑，最好调用：\n\
  \n```\ncombo.getItemAt(combo.getSelectedIndex())\n```\n\n这将为你提供正确类型的选中项目。\n\n在示例程序中，用户可以从样式列表（Serif,\
  \ Sansifif, Monospaced 等）中选择字体样式。用户也可以输入另一种字体。\n\n使用 `addItem` 方法添加选择项。在我们的程序中，`addItem`\
  \ 只在构造函数中调用，但你可以随时调用它。\n\n```\nvar faceCombo = new JComboBox<String>();\nfaceCombo.addItem(\"\
  Serif\");\nfaceCombo.addItem(\"Sansifif\");\n. . .\n```\n\n此方法将字符串添加到列表末尾。你可以使用\
  \ `insertItemAt` 方法在列表的任何位置添加新项目：\n\n```\nfaceCombo.insertItemAt(\"Monospaced\"\
  , 0); // 在开头添加\n```\n\n你可以添加任何类型的项目——下拉框会调用每个项目的 `toString` 方法来显示它。\n\n如果你需要在运行时删除项目，请使用\
  \ `removeItem` 或 `removeItemAt` 方法，取决于你提供的是要删除的项目还是它的位置。\n\n```\nfaceCombo.removeItem(\"\
  Monospaced\");\nfaceCombo.removeItemAt(0); // 移除第一个项目\n```\n\n`removeAllItems` 方法一次性删除所有项目。\n\
  \n\n\n\n\n如果你需要向组合框添加大量项目，`addItem` 方法的性能会很差。相反，应该构造一个 `DefaultComboBoxModel`，通过调用\
  \ `addElement` 填充它，然后调用 `JComboBox` 类的 `setModel` 方法。\n\n当用户从组合框中选择一个项时，组合框会产生一个动作事件（action\
  \ event）。要确定选择了哪个项，可以在事件参数上调用 `getSource` 以获取发送事件的组合框引用。然后调用 `getSelectedItem` 方法检索当前选中的项。你需要将返回值强制转换为适当类型，通常是\
  \ `String`。\n\n```\nActionListener listener = _ ->\n    label.setFont(new Font(\n\
  \        faceCombo.getItemAt(faceCombo.getSelectedIndex()),\n        Font.PLAIN,\n\
  \        DEFAULT_SIZE));\n```\n\nListing 11.4 显示了完整的程序。\n\nListing 11.4 v2ch11/comboBox/ComboBoxFrame.java\n\
  \n```java\npackage v2ch11.comboBox;\n\nimport module java.desktop;\n\n/**\n * 一个带有示例文本标签和用于选择字体的组合框的框架。\n\
  \ */\npublic class ComboBoxFrame extends JFrame {\n    private JComboBox<String>\
  \ faceCombo;\n    private JLabel label;\n    private static final int DEFAULT_SIZE\
  \ = 24;\n\n    public ComboBoxFrame() {\n        // 添加示例文本标签\n\n        label =\
  \ new JLabel(\"The quick brown fox jumps over the lazy dog.\");\n        label.setFont(new\
  \ Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n        add(label, BorderLayout.CENTER);\n\
  \n        // 创建一个组合框并添加字体名称\n\n        faceCombo = new JComboBox<>();\n        faceCombo.addItem(\"\
  Serif\");\n        faceCombo.addItem(\"SansSerif\");\n        faceCombo.addItem(\"\
  Monospaced\");\n        faceCombo.addItem(\"Dialog\");\n        faceCombo.addItem(\"\
  DialogInput\");\n\n        // 组合框监听器将标签字体更改为选字体名称\n\n        faceCombo.addActionListener(_\
  \ -> label.setFont(new Font(\n                faceCombo.getItemAt(faceCombo.getSelectedIndex()),\
  \ Font.PLAIN, DEFAULT_SIZE)));\n\n        // 将组合框添加到框架南部边界的面板中\n\n        var comboPanel\
  \ = new JPanel();\n        comboPanel.add(faceCombo);\n        add(comboPanel, BorderLayout.SOUTH);\n\
  \        pack();\n    }\n}\n```\n\n`javax.swing.JComboBox`1.2\n\n*   `boolean isEditable()`\n\
  \n*   `void setEditable(boolean b)`\n\n    获取或设置此组合框的 `editable` 属性。\n\n*   `void\
  \ addItem(Object item)`\n\n    向项目列表添加一个项。\n\n*   `void insertItemAt(Object item,\
  \ int index)`\n\n    在指定的索引处向项目列表插入一项。\n\n*   `void removeItem(Object item)`\n\n\
  \    从项目列表中移除一项。\n\n*   `void removeItemAt(int index)`\n\n    移除索引处的项。\n\n*   `void\
  \ removeAllItems()`\n\n    移除项目列表中的所有项。\n\n*   `Object getSelectedItem()`\n\n  \
  \  返回当前选中的项。\n\n### 11.4.5. 滑动块\n\n组合框允许用户从离散的值集中进行选择。滑动块提供了从连续值中进行选择——例如，1 到 100\
  \ 之间的任何数字。\n\n构造滑动块最常见方式如下：\n\n```\nvar slider = new JSlider(min, max, initialValue);\n\
  ```\n\n如果你省略了最小值、最大值和初始值，它们将分别初始化为 `0`、`100` 和 `50`。\n\n或者如果你想让滑动块垂直方向，使用以下构造函数调用：\n\
  \n```\nvar slider = new JSlider(SwingConstants.VERTICAL, min, max, initialValue);\n\
  ```\n\n这些构造函数创建一个普通的滑动块，例如图 11.16 顶部的滑动块。你现在将看到如何为滑动块添加装饰。\n\n![Figure](img/slidertest.jpg)图\
  \ 11.16: 滑动块\n\n当用户滑动条时，滑动块的 `value` 在最小值和最大值之间移动。当值改变时，一个 `ChangeEvent` 会发送给所有变化监听器。要通知更改，请调用\
  \ `addChangeListener` 方法并安装一个实现 `ChangeListener` 接口的对象。在回调中，获取滑动块的值：\n\n```\nChangeListener\
  \ listener = _ -> {\n    JSlider slider = (JSlider) event.getSource();\n    int\
  \ value = slider.getValue();\n    . . .\n};\n```\n\n你可以通过显示刻度（ticks）来装饰滑动块。例如，在示例程序中，第二个滑动块使用了设置：\n\
  \n```\nslider.setMajorTickSpacing(20);\nslider.setMinorTickSpacing(5);\n```\n\n\
  滑动块每隔 20 个单位有一个大刻度，每隔 5 个单位有一个小刻度。单位指的是滑动块的值，而不是像素。\n\n这些指令仅设置了刻度的单位。要让刻度实际出现，请调用\n\
  \n```\nslider.setPaintTicks(true);\n```\n\n主刻度和小刻度是相互独立的。例如，你可以设置每隔 20 个单位一个主刻度，每\
  \ 7 个单位一个小刻度，但这将给你一个非常混乱的刻度。\n\n你可以强制滑动块吸附到刻度。每当用户在吸附模式下拖动滑动块时，它立即移动到最近的刻度处。你通过调用激活此模式：\n\
  \n```\nslider.setSnapToTicks(true);\n```\n\n“吸附到刻度”的行为并没有你想象的那么好。在滑动块实际吸附之前，变化监听器仍然报告不对应刻度的滑动块值。如果你点击滑动块旁边——此操作通常会使滑动块向点击方向移动一点——带有“吸附到刻度”的滑动块不会移动到下一个刻度。\n\
  \n你可以通过调用来显示主刻度的刻度标签：\n\n```\nslider.setPaintLabels(true);\n```\n\n例如，对于一个范围从 0\
  \ 到 100 且主刻度间距为 20 的滑动块，刻度标记为 0,20,40,60,80 和 100。\n\n你还可以提供其他刻度标签，例如字符串或图标（参见图\
  \ 11.16）。这个过程稍微有点复杂。你需要填充一个键键类型为 `Integer`、值类型为 `Component` 的哈希表。然后你调用 `setLabelTable`\
  \ 方法。这些组件被放置在刻度下方。通常使用 `JLabel` 对象。以下是你可以如何将刻度标记为 A、B、C、D、E 和 F：\n\n```\nvar labelTable\
  \ = new Hashtable<Integer, Component>();\nlabelTable.put(0, new JLabel(\"A\"));\n\
  labelTable.put(20, new JLabel(\"B\"));\n. . .\nlabelTable.put(100, new JLabel(\"\
  F\"));\nslider.setLabelTable(labelTable);\n```\n\nListing 11.5 还显示了一个带有图标刻度标签的滑动块。\n\
  \n如果你的刻度或标签没有显示，请双检你是否调用了 `setPaintTicks(true)` 和 `setPaintLabels(true)`。\n\n图 11.16\
  \ 中的第四个滑动块没有轨道（track）。要抑制滑动块移动的“轨道”，请调用\n\n```\nslider.setPaintTrack(false);\n```\n\
  \n第五个滑动块通过调用反转了方向：\n\n```\nslider.setInverted(true);\n```\n\nListing 11.5 中的示例程序通过一组滑动块展示了所有视觉效果。每个滑动块都安装了一个变化事件监听器，将当前滑动块值放置在框架底部的字段中。\n\
  \n\n\n\n\n```java\npackage v2ch11.slider;\n\nimport module java.base;\nimport module\
  \ java.desktop;\n\n/**\n * 一个包含多个滑块和一个用于滑块值的文本字段的帧。\n */\npublic class SliderFrame\
  \ extends JFrame {\n    private JPanel sliderPanel;\n    private JTextField textField;\n\
  \    private ChangeListener listener;\n\n    public SliderFrame() {\n        sliderPanel\
  \ = new JPanel();\n        sliderPanel.setLayout(new GridBagLayout());\n\n     \
  \   // 所有滑块的通用监听器\n        listener = event -> {\n            // 当滑块值改变时更新文本字段\n\
  \            JSlider source = (JSlider) event.getSource();\n            textField.setText(\"\
  \" + source.getValue());\n        };\n\n        // 添加一个普通滑块\n\n        var slider\
  \ = new JSlider();\n        addSlider(slider, \"Plain\");\n\n        // 添加一个带有主刻度和次刻度线的滑块\n\
  \n        slider = new JSlider();\n        slider.setPaintTicks(true);\n       \
  \ slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n    \
  \    addSlider(slider, \"Ticks\");\n\n        // 添加一个可以吸附到刻度线上的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setSnapToTicks(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \        addSlider(slider, \"Snap to ticks\");\n\n        // 添加一个没有轨道的滑块\n\n   \
  \     slider = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        slider.setPaintTrack(false);\n\
  \        addSlider(slider, \"No track\");\n\n        // 添加一个反向的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        slider.setInverted(true);\n   \
  \     addSlider(slider, \"Inverted\");\n\n        // 添加一个带有数字标签的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setPaintLabels(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \        addSlider(slider, \"Labels\");\n\n        // 添加一个带有字母标签的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintLabels(true);\n        slider.setPaintTicks(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \n        var labelTable = new Hashtable<Integer, Component>();\n        labelTable.put(0,\
