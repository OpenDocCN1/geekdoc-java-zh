  \ 为 `true`，则用直线将通用路径的当前点与所添加形状的起始点连接起来。\n*   `void closePath()`\n    通过从当前点到路径中的第一个点绘制一条直线来关闭路径。\n\
  \n### 12.5.4. Areas\n\n在前节中，你已经看到如何通过构造由线和曲线组成的通用路径来指定复杂的形状。通过使用足够数量线和曲线，你可以绘制本质任何形状。例如，你在屏幕和打印输出上看到的字体字符形状是由线和二次或三次曲线组成的。\n\
  \n有时，通过由*区域*（如矩形、多边形或椭圆）组合来描述一个形状更为简单。Java 2D API 支持四种*构造性区域几何*操作，可以将两个区域合并为一个新区域。\n\
  \n*   `add`：合并后的区域包含位于第一个区域或第二个区域中的所有点。\n*   `subtract`：合并后的区域包含位于第一个区域但不在第二个区域中的所有点。\n\
  *   `intersect`：合并后的区域包含位于第一个和第二个区域中的所有点。\n*   `exclusiveOr`：合并后的区域包含位于第一个区域或第二个区域，但不同于两者都有的所有点。\n\
  \n图 12.40 显示了这些操作。\n\n图 12.40：构造性区域几何操作\n\n要构造一个复杂的区域，从默认区域对象开始。\n\n```\nvar a =\
  \ new Area();\n```\n\n然后，将区域与任何形状合并。\n\n```\na.add(new Rectangle2D.Double(. . .));\n\
  a.subtract(path);\n. . .\n```\n\n`Area` 类实现了 `Shape` 接口。你可以使用 `draw` 方法绘制区域的边界，或者使用\
  \ `Graphics2D` 类的 `fill` 方法填充内部。\n\n`java.awt.geom.Area`\n\n*   `void add(Area other)`\n\
  *   `void subtract(Area other)`\n*   `void intersect(Area other)`\n*   `void exclusiveOr(Area\
  \ other)`\n    对此区域和另一个区域执行构造性区域几何操作，并将此区域设置为结果。\n\n### 12.5.5. Strokes\n\n`Graphics2D`\
  \ 类的 `draw` 操作通过当前选的*笔画*（stroke）绘制形状的边界。默认情况下，笔画是 11 像素宽的实线。你可以通过调用 `setStroke`\
  \ 方法并提供实现 `Stroke` 接口的类对象来选择不同的笔画。Java 2D API 只定义这样一个类，称为 `BasicStroke`。在本节中，我们将查看\
  \ `BasicStroke` 类的功能。\n\n你可以构造任意厚度的笔画。例如，这里是绘制宽度为 10 像素的线的方法：\n\n\n\n该程序与代码列表 12.15\
  \ 中的程序相似。鼠标监听器记录了你对线段端点的点击，而鼠标移动监听器则监控端点的拖动。一组单选按钮用于信号用户对端点线样式（cap style）、连接样式（join\
  \ style）以及实线或虚线的选择。`StrokePanel` 类的 `paintComponent` 方法构造了一个 `GeneralPath`，它由两个线段组成，这两个线段连接了用户可以用鼠标移动的三个点。然后，它根据用户的选择构造一个\
  \ `BasicStroke`，最后绘制该路径。\n\n### 代码列表 12.16 v2ch12/stroke/StrokeDemo.java\n\n```java\n\
