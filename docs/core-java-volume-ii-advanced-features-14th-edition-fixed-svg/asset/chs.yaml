  \ 12.7.5. 打印属性\n\n打印服务 API 包含一组复杂的接口和类，用于指定各种类型的属性。属性分为四个重要组。前两组指定了对打印机的请求。\n\n\
  - `打印请求属性`（Print request attributes）为打印作业中的所有 `doc` 对象请求特定的功能，例如双面打印或纸张尺寸。\n- `Doc\
  \ 属性`（Doc attributes）是仅适用于单个 `doc` 对象的请求属性。\n\n另外两类属性包含关于打印机和作业状态的信息。\n\n- `打印服务属性`（Print\
  \ service attributes）提供有关打印服务的信息，例如打印机的品牌和型号或打印机当前是否接受作业。\n- `打印作业属性`（Print job\
  \ attributes）提供有关特定打印作业状态的信息，例如作业是否已经完成。\n\n为了描述各种属性，有一个接口 `Attribute`，它包含以下子接口：\n\
  \n```\nPrintRequestAttribute\nDocAttribute\nPrintServiceAttribute\nPrintJobAttribute\n\
  SupportedValuesAttribute\n```\n\n各个属性类实现了这些接口中的一个或多个。例如，`Copies` 类的对象描述了打印输出副本的数量。该类同时实现了\
  \ `PrintRequestAttribute` 和 `PrintJobAttribute` 接口。显然，一个打印请求可以包含对多个副本的请求。相反，打印作业的属性可能是这些副本中实际打印了多少份。该数字可能较小，也许因为打印机的限制，或者因为打印机缺纸。\n\
  \n`SupportedValuesAttribute` 接口表示属性值并不反映实际的请求或状态数据，而是反映服务的技能。例如，`CopiesSupported`\
  \ 类实现了 `SupportedValuesAttribute` 接口。该类的对象可能描述打印机支持 1 到 99 份打印输出。\n\n图 12.65\n\n\
