  *   `long getCount()`\n*   `xxx getSum()`\n*   `double getAverage()`\n*   `xxx getMax()`\n\
  *   `xxx getMin()`\n    返回收集到的元素的计数、和、平均值、最大值和最小值。\n\n## 1.13. 并行流\n\n流使得并行化批量操作变得简单。该过程大部分是自动的，但你需要遵循一些规则。首先，你必须有一个并行流。你可以通过\
  \ `Collection.parallelStream()` 方法从任何集合获取并行流：\n\n```\nStream<String> parallelWords\
  \ = words.parallelStream();\n```\n\n此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\n```\nStream<String>\
  \ parallelWords = Stream.of(wordArray).parallel();\n```\n\n只要在执行终端方法时流处于并行模式，所有的中间流操作都将并行化。\n\
  \n当流操作并行并行运行时，其意图是返回与串行执行相同的结果。确保操作是`无状态的` 并且可以按任意顺序执行是非常重要的。\n\n这里有一个你不能做的示例。假设你想统计字符串流中所有的短单词：\n\
  \n```\nvar shortWords = new int[12];\nwords.parallelStream().forEach(\n    s ->\
  \ { if (s.length() < 12) shortWords[s.length()]++; });\n        // 错误竞态条件！\nIO.println(Arrays.toString(shortWords));\n\
  ```\n\n这是非常非常糟糕的代码。传递给 `forEach` 的函数在多个线程中并发运行，每个线程都在更新共享数组。正如你在第一卷第 10 章中看到的，这是一个经典的\
  \ `竞态条件`。如果你多次运行此程序，你很可能在每次运行中得到不同的计数序列——而且每一个结果都是错误的。\n\n确保你传递给并行流操作的任何函数都是安全的并行执行的是你的责任。最好的方法是远离可变状态。在这个示例中，如果你通过长度对字符串进行分组并计数，你可以安全地并行计算：\n\
  \n```\nMap<Integer, Long> shortWordCounts\n    = words.parallelStream()\n      \
  \  .filter(s -> s.length() < 12)\n        .collect(groupingBy(\n            String::length,\n\
  \            counting()));\n```\n\n默认情况下，来自有序集合（数组和列表）、范围、生成器和迭代器，或调用 `Stream.sorted`\
  \ 的流都是`有序的`。结果按照原始元素的顺序积累，并且是完全预测的。如果你运行两次相同的操作，将得到完全相同的结果。\n\n排序并不排除并行化。例如，在计算\
  \ `stream.map(fun)` 时，流可以被划分为 `n` 段，每段都被并行处理。然后结果按顺序重新组合。\n\n当丢弃排序要求时，某些操作可以更有效地并行化。通过调用\
  \ `Stream.unordered` 方法，你表示对排序不感兴趣。一个从中受益的操作是 `Stream.distinct`。在有序流上，`distinct`\
  \ 保留第一个元素。如果允许保留*任何*唯一元素，则所有段都可以并发处理（使用共享集合来跟踪重复）。\n\n你也可以通过丢弃排序来加速 `limit` 方法。如果你只需要从流中获取\
  \ `n` 个元素而不在乎是哪些，调用：\n\n```\nStream<String> sample = words.parallelStream().unordered().limit(n);\n\
  ```\n\n正如 1.9.2 节所示，合并 map 是昂贵的。因此，`Collectors.groupingByConcurrent` 使用共享并发 map。为了从\
  \ map，map 值的顺序将与流顺序不同。\n\n```\nMap<Integer, List<String>> result = words.parallelStream().collect(\n\
  \    Collectors.groupingByConcurrent(String::length));\n    // 值按流顺序收集\n```\n\n\
  当然，如果你使用独立于排序的下游收集器，你就不关心了，例如\n\n```\nMap<Integer, Long> wordCounts\n    = words.parallelStream()\n\
  \        .collect(\n            groupingByConcurrent(\n                String::length,\n\
  \                counting()));\n```\n\n不要为了加速操作而将所有的流都转换为并行流。请记住这些问题：\n\n*   并行化存在巨大的开销，只有对于非常大的数据集才有划算。\n\
  *   只有当底层数据源可以被有效地拆分为多个部分时，并行化流才有收益。\n*   并行流使用的线程池会被阻塞操作（如文件 I/O 或网络访问）耗饿。\n\n\
  并行流在处理巨大的内存数据集合和计算密集型处理时效果最好。\n\n如果你处理大文件的行，并行化流可能会提高性能。`Files.lines` 方法使用内存映射文件来使分割变得有效。\n\
  \n\n\n\n如果你在并行流中需要随机数，可以从 `RandomGenerator.SplittableGenerator.of` 工厂方法获取一个生成器。\n\
  \n默认情况下，并行流使用由 `ForkJoinPool.commonPool` 返回的全局 fork-join 池。如果你的操作是非阻塞的且没有与其他任务共享该池，那么这就是的。有一个技巧可以替换为不同的\
  \ fork-join 池：在该池的线程中执行并行流操作：\n\n```\nForkJoinPool customPool = . . .;\nresult =\
  \ customPool.submit(() ->\n    stream.parallel().map(. . .).collect(. . .)).get();\n\
  ```\n\n或者，以异步方式：\n\n```\nCompletableFuture.supplyAsync(() ->\n        stream.parallel().map(.\
  \ . .).collect(. . .), customPool)\n    .thenAccept(result -> . . .);\n```\n\n这仅适用于\
  \ fork-join 池，不适用于任意的执行器。\n\nListing 1.10 中的示例程序演示了如何使用并行流。\n\nListing 1.10 `v2ch01/parallel/ParallelStreams.java`\n\
  \n```\npackage v2ch01.parallel;\n\nimport static java.util.stream.Collectors.*;\n\
  \nimport module java.base;\n\nclass ParallelStreams {\n    void main() throws Exception\
  \ {\n        String contents = Files.readString(Path.of(\"gutenberg\", \"alice30.txt\"\
  ));\n        List<String> wordList = List.of(contents.split(\"\\\\PL+\"));\n\n \
  \       // 前面是非常糟糕的代码\n        var shortWords = new int[10];\n        wordList.parallelStream().forEach(s\
  \ -> {\n            if (s.length() < 10) shortWords[s.length()]++;\n        });\n\
  \        IO.println(Arrays.toString(shortWords));\n\n        // 试一次——结果可能不同（也是错误的）\n\
  \        Arrays.fill(shortWords, 0);\n        wordList.parallelStream().forEach(s\
  \ -> {\n            if (s.length() < 10) shortWords[s.length()]++;\n        });\n\
  \        IO.println(Arrays.toString(shortWords));\n\n        // 补救：分组并计数\n     \
  \   Map<Integer, Long> shortWordCounts = wordList.parallelStream()\n           \
  \     .filter(s -> s.length() < 10).collect(groupingBy(String::length, counting()));\n\
  \n        IO.println(shortWordCounts);\n\n        // 下游顺序是不确定的\n        Map<Integer,\
  \ List<String>> result = wordList.parallelStream()\n                .collect(Collectors.groupingByConcurrent(String::length));\n\
  \n        IO.println(result.get(14));\n\n        result = wordList.parallelStream()\n\
  \                .collect(Collectors.groupingByConcurrent(String::length));\n\n\
  \        IO.println(result.get(14));\n\n        Map<Integer, Long> wordCounts =\
  \ wordList.parallelStream()\n                .collect(groupingByConcurrent(String::length,\
  \ counting()));\n\n        IO.println(wordCounts);\n    }\n}\n```\n\n`java.util.stream.BaseStream<T,S\
  \ extends BaseStream<T,S>>8`\n\n*   `S parallel()`\n    产生一个与此流具有相同元素的并行流。\n\n*\
  \   `S unordered()`\n    产生一个与此流具有相同元素的无序流。\n\n`java.util.Collection<E>1.2`\n\n\
  *   `Stream<E> parallelStream()`\n    产生一个包含该集合元素的并行流。\n\n在本章中，你学习了如何使用流库。下一章将涵盖另一个重要主题：输入输出处理。\n\
  \n# 第 2 章 ▪ 输入与输出\n\n在本章中，我们将涵盖用于输入输出的 Java 应用程序接口（API）。你将学习如何访问文件和目录，以及如何以二进制和文本格式读写数据。本章还展示了对象序列化机制，该机制让你能像存储文本或数值数据一样容易存储对象。我们以讨论正则表达式结束本章，尽管它们实际上与输入输出没有直接关系。我们找不到更好的地方来处理这个主题，显然\
  \ Java 团队也无法找到——正则表达式 API 规范被附带在一个关于“新 I/O”特性的规范请求中。\n\n## 2.1. 输入/输出流\n\n在 Java\
  \ API 中，可以从其读取字节序列的对象称为输入流（input stream）。可以向其写入字节序列的对象称为输出流（output stream）。这些字节序列的源和目的地可以是文件（而且通常也是文件），但也可以是网络连接甚至是内存块。抽象类\
  \ `InputStream` 和 `OutputStream` 是输入/输出（I/O）类层次结构的基础。\n\n这些输入输出流与你在上一章中看到的流无关。为了清晰起见，当我们讨论用于输入输出的流时，将使用输入流、输出流或输入输出流等术语。\n\
  \n面向字节的输入输出流对于处理存储在 Unicode 中的信息是不方便的（请记住 Unicode 每个字符使用多个字节）。因此，另一个单独的层次结构提供了继承自抽象\
  \ `Reader` 和 `Writer` 类的类，用于处理 Unicode 字符。这些类具有读和写操作，基于双字节 `char` 值（即 UTF-16 代码单元）而不是\
  \ `byte` 值。\n\n### 2.1.1. 字节的读写\n\n`InputStream` 类有一个抽象方法：\n\n```\nabstract int\
  \ read()\n```\n\n该方法读取一个字节并返回所读取的字节，如果遇到输入结束则返回 `-1`。具体输入流的设计者重写此方法以提供有用的功能。例如，在\
  \ `FileInputStream` 类中，此方法从文件中读取一个字节。`System.in` 是 `InputStream` 子类的一个预定义对象，允许你从“标准输入”（即控制台或重定向的文件）读取。\n\
  \n`InputStream` 有一个非常有用的方法可以读取所有字节：\n\n```\nbyte[] bytes = in.readAllBytes();\n\
  ```\n\n还有读取指定数量字节的方法——请参见 API 说明。这些方法调用抽象 `read` 方法，因此子类只需要重写一个方法。\n\n同样，`OutputStream`\
  \ 类定义了抽象的\n\n```\nabstract void write(int b)\n```\n\n向输出位置写入字节。如果你有一个字节数组，可以一次性写入它们：\n\
  \n```\nbyte[] values = . . .;\nout.write(values);\n```\n\n`transferTo` 方法将输入流的所有字节传输到输出流：\n\
  \n```\nin.transferTo(out);\n```\n\n`read` 和 `write` 方法都会阻塞直到字节实际读取或写入。这意味着如果输入流无法立即访问（通常是因为网络连接繁忙），当前线程会阻塞。这使得其他线程在等待输入流可用时有机会执行有用的工作。\n\
  \n`available` 方法让你检查当前可读的字节数。这意味着像下面的代码片段可能会阻塞：\n\n```\nint bytesAvailable = in.available();\n\
  if (bytesAvailable > 0) {\n    var data = new byte[bytesAvailable];\n    in.read(data);\n\
  }\n```\n\n当你完成输入输出流的读写后，调用 `close` 方法将其关闭。此调用释放了有限的操作系统资源。如果应用程序打开了太多输入输出流而不关闭，系统资源可能会耗尽。关闭输出流还会冲刷输出使用的缓冲区：任何临时存放在缓冲区中以便作为数据包交付的字节都会发送出去。特别是，如果你不关闭文件，最后一个数据包可能永远无法被交付。你也可以使用\
  \ `flush` 方法手动刷新输出。\n\n即使输入输出流类提供了处理原始 `read` 和 `write` 函数的具体方法，应用程序程序员也很少使用它们。\n\
  \n与其处理字节，你可以使用许多构建在基础 `InputStream` 和 `OutputStream` 类之上的输入输出类。\n\n\n\n\n# `java.io.InputStream`\
  \ 1.0\n\n*   `abstract int read()`\n    读取一个字节的数据并返回读取的字节；在输入流末尾返回 `-1`。\n*   `int\
  \ read(byte[] b)`\n    将数据读取到字节数组中，并返回实际读取的字节数，或在输入流末尾返回 `-1`；此方法最多读取 `b.length`\
  \ 个字节。\n*   `int read(byte[] b, int off, int len)`\n*   `int readNBytes(byte[] b,\
  \ int off, int len)` 9\n    读取最多 `len` 个字节，如果可以在不阻塞的情况下可用（使用 `read`），或者阻塞直到所有值都被读取（使用\
  \ `readNBytes`）。值被放入 `b` 中，从 `off` 开始。返回实际读取的字节数。\n*   `byte[] readAllBytes()` 9\n\
  \    产生一个可以从此流读取的所有字节的数组。\n*   `long transferTo(OutputStream out)` 9\n    将此输入流的所有字节传输到给定的输出流，并返回传输的字节数。两个流都不会被关闭。\n\
  *   `long skip(long n)`\n    尝试在输入流中跳过 `n` 个字节，返回实际跳过的字节数（由于任何原因，可能小于 `n`）。\n* \
  \  `long skipNBytes(long n)` 12\n    在输入流中跳过 `n` 个字节，返回实际跳过的字节数（如果遇到输入流的末尾，则可能小于\
  \ `n`）。\n*   `int available()`\n    返回可用的字节数，且不阻塞（注意，阻塞意味着当前线程失去了它的执行机会）。\n*   `void\
  \ close()`\n    关闭输入流。\n*   `void mark(int readlimit)`\n    在输入流的当前位置放置标记（并非所有流都支持此功能）。如果从输入流中读取的字节超过了\
  \ `readlimit` 字节，则允许流忘记该标记。\n*   `void reset()`\n    返回上一个标记。随后的 `read` 调用将重新读取这些字节。如果没有当前标记，则输入流不会被重置。\n\
  *   `boolean markSupported()`\n    如果输入流支持标记，则返回 `true`。\n*   `static InputStream\
  \ nullInputStream()` 11\n    返回一个没有任何字节的输入流。\n\n# `java.io.OutputStream` 1.0\n\n\
  *   `abstract void write(int n)`\n    写入一个字节的数据。\n*   `void write(byte[] b)`\n*\
  \   `void write(byte[] b, int off, int len)`\n    在数组 `b` 中写入所有字节，或从 `off` 开始的 `len`\
  \ 个字节。\n*   `void close()`\n    刷新并关闭输出流。\n*   `void flush()`\n    刷新输出流——即将任何缓冲区数据发送到其目的地。\n\
  *   `static OutputStream nullOutputStream()` 11\n    返回一个丢弃所有字节的输出流。\n\n## 2.1.2.\
  \ 完整的流动物园 (Complete Stream Zoo)\n\nC 语言只需要单一类型 `FILE*` 就能运行良好，而 Java 则拥有一整个超过 60\
  \ 个 (!) 用于输入输出的类和接口。\n\n图 2.1：输入输出流层级结构。图 2.2：读取器和写入器层级结构\n\n让我们根据使用方式对输入输出动物园中的动物进行分类。处理字节和字符的类有独立的层级结构。正如你所看到的，`InputStream`\
  \ 和 `OutputStream` 类允许你读写单个字节和字节数组。这些类构成了 #ch01fig01 所示层级结构的基础。为了读写字符串和数字，你需要更强大的子类。例如，`DataInputStream`\
  \ 和 `DataOutputStream` 允许你以二进制格式读写所有的 Java 原始类型。最后，还有用于特殊任务的输入/输出流；例如，`ZipInputStream`\
  \ 和 `ZipOutputStream` 允许你以熟悉的 ZIP 压缩格式读写文件。\n\n对于 Unicode 文本，另一方面你可以使用抽象类 `Reader`\
  \ 和 `Writer` 的子类（参见 #ch01fig02）。`Reader` 和 `Writer` 类的基础方法与 `InputStream` 和 `OutputStream`\
  \ 相似。\n\n```\nabstract int read()\nabstract void write(int c)\n```\n\n`read` 方法返回一个\
  \ UTF-16 代码单元（作为 `0` 到 `65535` 之间的整数），或者在到达文件末尾时返回 `-1`。`write` 方法使用 Unicode 代码单元调用。（参见\
  \ 第一卷第三章 关于 Unicode 代码单元的讨论。）\n\n还有四个额外的接口：`Closeable`、`Flushable`、`Readable` 和\
  \ `Appendable`（参见 #ch01fig03）。前两个接口非常简单，分别拥有方法\n\n```\nvoid close() throws IOException\n\
  ```\n\n和\n\n```\nvoid flush()\n```\n\n`InputStream`、`OutputStream`、`Reader` 和 `Writer`\
  \ 类都实现了 `Closeable` 接口。\n\n`java.io.Closeable` 接口扩展了 `java.lang.AutoCloseable` 接口。因此，你可以对任何\
  \ `Closeable` 使用 `try`-with-resources 语句。为什么要两个接口？`Closeable` 接口的 `close` 方法只抛出\
  \ `IOException`，\n\n`OutputStream` 和 `Writer` 实现了 `Flushable` 接口。\n\n图 2.3：`Closeable`、`Flushable`、`Readable`\
  \ 和 `Appendable`\n\n`Readable` 接口有一个单一方法\n\n```\nint read(CharBuffer)\n```\n\n`CharBuffer`\
  \ 类具有顺序和随机访问的方法。它表示一个内存缓冲区或内存映射文件。（详情参见 2.4.2。）\n\n`Appendable` 接口有两个用于追加字符和字符序列的方法：\n\
  \n```\nAppendable append(char c)\nAppendable append(CharSequence cs)\n```\n\n`CharSequence`\
  \ 接口描述了 `char` 值序列的基本属性。它由 `String`、`StringBuilder` 和 `StringBuffer` 实现。\n\n输入流类中，只有\
  \ `Writer` 实现了 `Appendable`。\n\n`java.io.Closeable` 5\n\n*   `void close()`\n  \
  \  关闭此 `Closeable`。此方法可能会抛出 `IOException`。\n\n`java.io.Flushable` 5\n\n*   `void\
  \ flush()`\n    刷新此 `Flushable`。\n\n`java.lang.Readable` 5\n\n*   `int read(CharBuffer\
  \ cb)`\n    尝试将多个 `char` 值读取到 `cb` 中。返回读取的数值，或者如果此 `Readable` 不再有可用值则返回 `-1`。\n\n\
  `java.lang.Appendable` 5\n\n*   `Appendable append(char c)`\n*   `Appendable append(CharSequence\
  \ cs)`\n    将给定的代码单元或给定序列中的所有代码单元追加到此 `Appendable`；返回 `this`。\n\n`java.lang.CharSequence`\
  \ 1.4\n\n*   `char charAt(int index)`\n    返回指定索引处的代码单元。\n*   `int length()`\n \
  \   返回序列中代码单元的数量。\n*   `CharSequence subSequence(int startIndex, int endIndex)`\n\
  \    返回由从 `startIndex` 到 `endIndex - 1` 的的代码单元组成的 `CharSequence`。\n*   `String toString()`\n\
  \    返回由此序列的代码单元组成的字符串。\n\n## 2.1.3. 输入输出流过滤器\n\n`FileInputStream` 和 `FileOutputStream`\
  \ 提供了连接到磁盘文件的输入和输出流。你需要将文件名或完整路径名传递给构造函数。例如，\n\n```\nvar fin = new FileInputStream(\"\
  employee.dat\");\n```\n\n相对路径名从*工作目录*开始。你可以通过调用 `System.getProperty(\"user.dir\"\
  )` 获取此目录。它在虚拟机启动时设置，此后无法更改。如果你从命令行启动程序，工作目录就是终端中的当前目录。在 IDE 中，你可以在运行配置中设置工作目录。\n\
  \n\n\n\n由于反斜杠 `\\` 是 Java 字符串中的转义字符，请务必使用 `\\\\` 来表示 Windows 风格的路径名（例如 `C:\\\\Windows\\\
  \\win.ini`）。在 Windows 中，你也可以使用单正斜杠（`C:/Windows/win.ini`），因为大多数 Windows 文件处理系统调用会将正斜杠解释为文件分隔符。然而，并不建议这样做——Windows\
  \ 系统函数的行为可能会发生变化。相反，对于可移植程序，请使用运行程序平台上对应的文件分隔符。它可以通过常量字符串 `java.io.File.separator`\
  \ 来获取。\n\n与抽象的 `InputStream` 和 `OutputStream` 类一样，这些类仅支持字节层级的读写。也就是说，我们只能从对象 `fin`\
  \ 中读取字节和字节数组。\n\n```java\nbyte b = (byte) fin.read();\n```\n\n正如你将在下一节中看到的，如果我们持有一个\
  \ `DataInputStream`，我们就可以读取数值类型：\n\n```\nDataInputStream din = . . .;\ndouble x\
  \ = din.readDouble();\n```\n\n但就像 `FileInputStream` 没有读取数值类型的方法一样，`DataInputStream`\
  \ 也没有从文件中获取数据的方法。\n\nJava 使用一种巧妙的机制来分离两种职责。某些输入流（如 `FileInputStream` 和通过 `URL` 类\
  \ `openStream` 方法返回的输入流）可以从文件和其他更奇的位置检索字节。其他输入流（如 `DataInputStream`）可以将字节组装成更有用的数据类型。Java\
  \ 程序员必须将两者结合起来。例如，为了能够从文件中读取数字，首先创建一个 `FileInputStream`，然后将它传递给 `DataInputStream`\
  \ 的构造函数。\n\n```java\nvar fin = new FileInputStream(\"employee.dat\");\nvar din =\
  \ new DataInputStream(fin);\ndouble x = din.readDouble();\n```\n\n如果你再次查看 #ch01fig01，你可以看到\
  \ `FilterInputStream` 和 `FilterOutputStream` 类。这些类的子类用于为处理字节的输入/输出流添加功能。\n\n你可以通过嵌套过滤器来添加多个功能。例如，默认情况下，输入流不是带缓冲的。这意味着，每次调用\
  \ `read` 都会请求操作系统再次分发一个字节。请求块数据并将其存储在缓冲区中会更高效。如果你既需要缓冲*又*需要文件的数据输入方法，请使用以下相当庞异的构造函数序列：\n\
  \n```java\nvar din = new DataInputStream(\n    new BufferedInputStream(\n      \
  \  new FileInputStream(\"employee.dat\")));\n```\n\n注意，我们将 `DataInputStream` 放在构造函数链的*最后*，因为我们想使用\
  \ `DataInputStream` 的方法，并且我们希望*它们*使用缓冲的 `read` 方法。\n\n有时，当你将输入流链在一起时，需要跟踪中间输入流。例如，在读取输入时，你通常需要查看下一个字节，看它是否是你预期的值。Java\
  \ 提供了 `PushbackInputStream`为此目的。\n\n```java\nvar pbin = new PushbackInputStream(\n\
  \    new BufferedInputStream(\n        new FileInputStream(\"employee.dat\")));\n\
  ```\n\n现在你可以推测性地读取下一个字节\n\n```java\nint b = pbin.read();\n```\n\n如果它不是你想要的，就将其推回。\n\
  \n```java\nif (b != '<') pbin.unread(b);\n```\n\n`unread` 方法实际上不会改变流读取字节的源。未读取的字节存储在缓冲区中，并由下一次\
  \ `read` 操作返回。默认情况下，缓冲区长度为 1，但你可以在 `PushbackInputStream` 构造函数中指定更长的缓冲区。\n\n读取和未读取是适用于推回输入流的*唯一*方法。如果你想向前查看并读取数字，那么你同时需要一个推回输入流和一个数据输入流引用。\n\
  \n```java\nvar pbin = new PushbackInputStream(\n    new BufferedInputStream(\n \
  \       new FileInputStream(\"employee.dat\")));\nvar din = new DataInputStream(pbin);\n\
  ```\n\n当然，在其他编程语言的输入/输出库中，缓冲和前瞻等便利功能会被自动处理——因此在 Java 中，诉诸组合流过滤器有点麻烦。然而，通过混合匹配过滤器类来构建有用的输入/输出流序列，确实赋予了你极大的灵活性。例如，你可以使用以下输入流序列从压缩的\
  \ ZIP 文件读取数字（参见 #ch01fig04）：\n\n```java\nvar zin = new ZipInputStream(new FileInputStream(\"\
  employee.zip\"));\nvar din = new DataInputStream(zin);\n```\n\n.图 2.4：一组过滤输入流序列\n\
  \n（关于 Java 处理 ZIP 文件的更多信息，请参见 Section 2.2.3。）\n\n`java.io.FileInputStream`1.0\n\n\
  *   `FileInputStream(String name)`\n*   `FileInputStream(File file)`\n    使用由 `name`\
  \ 字符串指定路径的文件或旧的 `File` 类对象创建新的文件输入流。\n\n`java.io.FileOutputStream`1.0\n\n*   `FileOutputStream(String\
  \ name)`\n*   `FileOutputStream(String name, boolean append)`\n*   `FileOutputStream(File\
  \ file)`\n*   `FileOutputStream(File file, boolean append)`\n    使用 `name` 字符串或\
  \ `file` 对象指定新的文件输出流。如果 `append` 参数为 `true`，则不会删除同名的现有文件。否则，数据将添加到文件末尾。\n\n`java.io.BufferedInputStream`1.0\n\
  \n*   `BufferedInputStream(InputStream in)`\n    创建一个缓冲输入流。缓冲输入流从流中读取字节而不会每次访问设备。当缓冲区为空时，读取一块数据到缓冲区中。\n\
  \n`java.io.BufferedOutputStream`1.0\n\n*   `BufferedOutputStream(OutputStream out)`\n\
  \    创建一个缓冲输出流。缓冲输出流收集要写入的字节而不会每次访问设备。当缓冲区满或流刷新时，数据将被写入。\n\n`java.io.PushbackInputStream`1.0\n\
  \n*   `PushbackInputStream(InputStream in)`\n*   `PushbackInputStream(InputStream\
  \ in, int size)`\n    构造一个具有单字节前瞻或指定大小推回缓冲区的输入流。\n*   `void unread(int b)`\n   \
  \ 推回一个字节，下次调用 `read` 时将检索。\n\n### 2.1.4 文本输出\n\n在保存数据时，你可以在二进制和文本格式之间进行选择。例如，如果整数\
  \ 1234 以二进制形式保存，它被写入字节序列 `00 00 04 D2`（十六进制）。在文本格式下，它被保存为字符串 `\"1234\"`。虽然二进制 I/O\
  \ 快速高效，但人类难以阅读。我们将在 2.2 节先讨论文本 I/O。\n\n保存文本字符串时，你需要考虑字符编码。在 Java 内部使用的 UTF-16 编码中，字符串\
  \ `\"José\"` 编码为 `00 4A 00 6F 00 73 00 E9`（十六进制）。然而，许多程序期望文本文件使用不同的编码。在互联网上最常用的\
  \ UTF-8 编码中，该字符串将写写为 `4A 6F 73 C3 A9`。\n\n`OutputStreamWriter` 类将 Unicode 单元的输出流转换为字节流。相反，`InputStreamReader`\
  \ 类将包含字节（指定某些字符编码的字符）的输入流转换为发射 Unicode 单元的读取器。\n\n从 Java 18 开始，这些类默认使用 UTF-8 编码。在\
  \ Java 18 之前，或者如果你需要支持旧编码，请在构造函数中指定编码，例如：\n\n```java\nvar in = new InputStreamReader(new\
  \ FileInputStream(\"data.txt\"), StandardCharsets.UTF_8);\n```\n\n\n\n\n有关字符编码的更多信息，请参见第\
  \ 2.1.8 节。\n\n`Reader` 和 `Writer` 类仅具有读取和写入单个字符的基本方法。与流一样，你应当使用子类来处理字符串和数字。\n\n\
  ### 2.1.5. 如何读取文本输入\n\n你可以像这样将一个短文本文件读取到字符串中：\n\n```java\nString content = Files.readString(path);\n\
  ```\n\n但如果你想将文件视为行的序列，请调用：\n\n```java\nList<String> lines = Files.readAllLines(path);\n\
  ```\n\n如果文件很大，可以使用 `Stream<String>`  惰性地处理这些行：\n\n```java\ntry (Stream<String> lines\
  \ = Files.lines(path)) {\n    . . .\n}\n```\n\n如果在流在获取行时发生 `IOException`，该异常将被封装成\
  \ `UncheckedIOException` 并从流操作抛出。这种处理手段是必要的，因为流操作没有声明抛出任何检查异常（checked exceptions）。\n\
  \n处理任意文本最简单的方法是使用 `Scanner` 类。这段代码处理文件中的所有行：\n\n```java\ntry (var in = new Scanner(path))\
  \ {\n    while (in.hasNextLine()) {\n        String line = in.nextLine();\n    \
  \    // 处理行\n    }\n}\n```\n\n你还可以使用扫描器来读取 `tokens`——即由分隔符分隔的字符串。默认分隔符是空白字符。你可以将分隔符更改为任何正则表达式。例如，这里是如何配置扫描器使其使用任何非\
  \ Unicode 字母作为分隔符的。\n\n```java\nScanner in = . . .;\nin.useDelimiter(\"\\\\PL+\"\
  );\n```\n\n现在该扫描器接受仅由 Unicode 字母组成的 token。\n\n调用 `next` 方法可以获取下一个 token：\n\n```java\n\
  while (in.hasNext()) {\n    String word = in.next();\n    . . .\n}\n```\n\n或者，你也可以如下方式获取所有\
  \ token 的流：\n\n```java\nStream<String> words = in.tokens();\n```\n\n在遗留代码中，你可能会发现通过重复调用\
  \ `BufferedReader` 的 `readLine` 方法来读取行的代码。现在，没有理由那样做了。\n\n`nextInt` 和 `nextDouble`\
  \ 方法产生输入中的下一个整数或浮点数。先调用 `hasNextInt` 或 `hasNextDouble` 以确保下一个 token 是一个数字。\n\n`next`、`nextInt`\
  \ 和 `nextDouble` 方法仅消耗开头的空白字符和一个 token。尾部的空白字符会留在输入中。如果你还调用了 `nextLine`，请记住这一点。如果你的输入是：\n\
  \n```\n29.95\nBlackwell Toaster\n```\n\n而你调用：\n\n```java\ndouble price = in.nextDouble();\n\
  double description = in.nextLine(); // 错误\n```\n\n那么 `description` 将为空！对 `nextLine`\
  \ 的调用只读取了数字后面的换行符。\n\n只需添加另一个 `nextLine` 调用来消耗尾部的空白字符。\n\n### 2.1.6. 如何写入文本输出\n\n\
  对于文本输出，请使用 `PrintWriter`。该类具有以文本格式打印字符串和数字的方法。为了写入文件，请通过文件名构造 `PrintWriter`：\n\n\
  ```java\nvar out = new PrintWriter(\"employee.txt\");\n```\n\n奇怪的是，你不能从 `Path` 构造\
  \ `PrintWriter`。\n\n在 Java 18 之前，请务必将字符编码指定为第二个参数：\n\n```java\nvar out = new PrintWriter(\"\
  employee.txt\", StandardCharsets.UTF_8);\n```\n\n否则，将使用平台编码，使得你的程序行为取决于主机操作系统的配置。\n\
  \n要写入 `PrintWriter`，请使用 `print` 和 `println` 方法。你可以使用这些方法打印数字（`int`、`short`、`long`、`float`、`double`）、字符、`boolean`\
  \ 值、字符串和对象。\n\n例如，考虑这段代码：\n\n```java\nString name = \"Harry Hacker\";\ndouble salary\
  \ = 75000;\nout.print(name);\nout.print(' ');\nout.println(salary);\n```\n\n这向写入器\
  \ `out` 写入字符：\n\n```\nHarry Hacker 75000.0\n```\n\n这些字符随后被转换为字节并进入文件 `employee.txt`\
  \ 中。\n\n`println` 方法会在行尾添加目标系统正确的行结束符（Windows 上为 `\"\\r\\n\"`，UNIX 上为 `\"\\n\"`）。这是通过调用\
  \ `System.getProperty(\"line.separator\")` 获取的字符串。\n\n如果写入器被设置为*自动刷新模式*（autoflush\
  \ mode），每当调用 `println` 时，缓冲区中的所有字符都会发送到目的地（打印器总是缓冲的）。默认情况下，自动刷新未启用。你可以通过使用 `PrintWriter(Writer\
  \ writer, boolean autoFlush)` 构造函数来启用或禁用自动刷新：\n\n```java\nvar out = new PrintWriter(\n\
  \    new OutputStreamWriter(\n        new FileOutputStream(\"employee.txt\")),\n\
  \    true); // autoflush\n```\n\n`print` 方法不会抛出异常。你可以调用 `checkError` 方法查看输出流是否出现问题。\n\
  \nJava 资深人士可能会好奇 `PrintStream` 类和 `System.out` 发生了什么。在 Java 1.0 中，`PrintStream`\
  \ 类简单地通过丢弃高字节将所有 Unicode 字符截断为 ASCII 字符。（当时，Unicode 仍然是 16 位编码）。显然，这不是一种整洁或可移植的方法，它随着读取器的引入得到了修复。`System.in`、`System.out`\
  \ 和 `System.err` 仍然是输入输出流。但现在 `PrintStream` 类允许你像 `PrintWriter` 使用 `print` 和 `println`\
  \ 那样输出原始字节。\n\n*   `PrintWriter(OutputStream out)`\n*   `PrintWriter(OutputStream\
  \ out, boolean autoFlush)`\n*   `PrintWriter(Writer writer)`\n*   `PrintWriter(Writer\
  \ writer, boolean autoFlush)`\n    构造一个写入指定输出流或写入器的 `PrintWriter`。如果 `autoFlush`\
  \ 指定为 `true`，`println` 和 `printf` 会刷新输出。\n*   `PrintWriter(String filename, String\
  \ encoding)`\n*   `PrintWriter(File file, String encoding)`\n    构造一个使用指定字符编码写入指定文件的\
  \ `PrintWriter`。\n*   `void print(Object obj)`\n    通过打印 `toString` 的结果打印对象。\n*\
  \   `void print(String s)`\n    打印包含 Unicode 单元的字符串。\n*   `void println(String s)`\n\
  \    打印字符串后跟行终止符。如果处于自动刷新状态则会刷新。\n*   `void print(char[] s)`\n    打印数组中的所有 Unicode\
  \ 单元。\n*   `void print(char c)`\n    打印一个 Unicode 单元。\n*   `void print(int i)`\n\
  *   `void print(long l)`\n*   `void print(float f)`\n*   `void print(double d)`\n\
  *   `void print(boolean b)`\n    以文本格式打印给定值。\n*   `void printf(String format, Object...\
  \ args)`\n    按照格式字符串指定的打印给定值。格式字符串的规范请参见卷 I 第 3 章。\n*   `boolean checkError()`\n\
  \    如果发生格式化或输出错误则返回 `true`。一旦输出流遇到错误，它就会被污染，所有 `checkError` 的调用都会返回 `true`。\n\n\
  ### 2.1.7. 以文本格式保存对象\n\n在本节中，我们将讨论一个在文本文件中存储 `Employee` 记录数组的示例程序。每个记录存储在单独的一行。实例字段之间由分隔符分隔。使用竖线（`|`）作为分隔符。（冒号`:`）是另一个流行的选择。有趣的地方在于每个人使用不同的分隔符。）自然地，对于在保存的字符串中实际上出现\
  \ `|` 可能会发生的问题暂不讨论。\n\n这里有一组示例记录：\n\n```\nHarry Hacker|35500.0|1989-10-01\nCarl\
  \ Cracker|75000.0|1987-12-15\nTony Tester|38000.0|1990-03-15\n```\n\n\n\n\n写入记录非常简单。由于我们将数据写入文本文件，因此我们使用\
  \ `PrintWriter` 类。我们只需要写入所有字段，每个字段后跟着一个 `|`，如果是最后一个字段，则跟一个换行符。这些工作在以下方法中完成：\n\n\
  ```java\npublic static void writeEmployee(PrintWriter out, Employee e) {\n    out.println(e.getName()\
  \ + \"|\" + e.getSalary() + \"|\" + e.getHireDay());\n}\n```\n\n读取记录时，我们每次读取一行并分离字段。我们使用\
  \ `Scanner` 读取每一行，然后使用 `String.split` 方法将行拆分为多个标记。\n\n```java\npublic static Employee\
  \ readEmployee(Scanner in) {\n    String line = in.nextLine();\n    String[] tokens\
  \ = line.split(\"\\\\|\");\n    String name = tokens[0];\n    double salary = Double.parseDouble(tokens[1]);\n\
  \    LocalDate hireDate = LocalDate.parse(tokens[2]);\n    int year = hireDate.getYear();\n\
  \    int month = hireDate.getMonthValue();\n    int day = hireDate.getDayOfMonth();\n\
  \    return new Employee(name, salary, year, month, day);\n}\n```\n\n`split` 方法的参数是一个描述分隔符的正则表达式。我们将在本章末尾详细讨论正则表达式。恰好的是，竖线字符在正则表达式中有特殊含义，因此它需要用\
  \ `\\` 字符进行转义。该字符本身需要用另一个 `\\` 转义，从而产生 `\"\\\\|\"` 表达式。\n\n完整的程序在列表 2.1 中。静态方法\n\
  \n```\nvoid writeData(Employee[] e, PrintWriter out)\n```\n\n首先写入数组的长度，然后写入每条记录。静态方法\n\
  \n```\nEmployee[] readData(Scanner in)\n```\n\n首先读取数组的长度，然后读取每条记录。这似乎有点棘手：\n\n```\n\
  int n = in.nextInt();\nin.nextLine(); // 消耗换行符\nvar employees = new Employee[n];\n\
  for (int i = 0; i < n; i++) {\n    employees[i] = readEmployee(in);\n}\n```\n\n\
  对 `nextInt` 的调用读取了数组长度，但没有读取尾的换行符。我们必须消耗掉这个换行符，以便 `readEmployee` 方法在调用 `nextLine`\
  \ 方法时能够获取下一行输入。\n\n列表 2.1 v2ch02/textFile/TextFileDemo.java\n\n```java\npackage\
  \ v2ch02.textFile;\n\nimport com.horstmann.corejava.*;\nimport module java.base;\n\
  \nclass TextFileDemo {\n    void main() throws Exception {\n        var staff =\
  \ new Employee[3];\n\n        staff[0] = new Employee(\"Carl Cracker\", 75000, 1987,\
  \ 12, 15);\n        staff[1] = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n\
  \        staff[2] = new Employee(\"Tony Tester\", 40000, 1990, 3, 15);\n\n     \
  \   // 将所有员工记录保存到文件 employee.dat\n        try (var out = new PrintWriter(\"employee.dat\"\
  )) {\n            writeData(staff, out);\n        }\n\n        // 将所有记录检索到一个新数组\n\
  \        try (var in = new Scanner(new FileInputStream(\"employee.dat\"))) {\n \
  \           Employee[] newStaff = readData(in);\n\n            // 打印新读取的员工记录\n \
  \           for (Employee e : newStaff)\n                IO.println(e);\n      \
  \  }\n    }\n\n    void writeData(Employee[] employees, PrintWriter out) throws\
  \ IOException {\n        // 写入员工人数\n        out.println(employees.length);\n\n \
  \       for (Employee e : employees)\n            writeEmployee(out, e);\n    }\n\
  \n    Employee[] readData(Scanner in) {\n        // 检索数组大小\n        int n = in.nextInt();\n\
  \        in.nextLine(); // 消耗换行符\n\n        var employees = new Employee[n];\n \
  \       for (int i = 0; i < n; i++) {\n            employees[i] = readEmployee(in);\n\
  \        }\n        return employees;\n    }\n\n    void writeEmployee(PrintWriter\
  \ out, Employee e) {\n        out.println(e.getName() + \"|\" + e.getSalary() +\
  \ \"|\" + e.getHireDay());\n    }\n\n    Employee readEmployee(Scanner in) {\n \
  \       String line = in.nextLine();\n        String[] tokens = line.split(\"\\\\\
  |\");\n        String name = tokens[0];\n        double salary = Double.parseDouble(tokens[1]);\n\
  \        LocalDate hireDate = LocalDate.parse(tokens[2]);\n        int year = hireDate.getYear();\n\
  \        int month = hireDate.getMonthValue();\n        int day = hireDate.getDayOfMonth();\n\
  \        return new Employee(name, salary, year, month, day);\n    }\n}\n```\n\n\
