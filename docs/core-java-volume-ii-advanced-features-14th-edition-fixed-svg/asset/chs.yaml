  unbounded\"/>\n      </xsd:sequence>\n   </xsd:group>\n</xsd:schema>\n```\n\n##\
  \ 3.5. 使用 XPath 定位信息\n\n如果你想在 XML 文档中定位特定的信息，导航 DOM 树的节点可能会有些麻烦。XPath 语言使得访问树节点变得简单。例如，假设你有这样一个\
  \ XHTML 文档：\n\n```\n<html\n   <head>\n      . . .\n      <title>. . .</title>\n\
  \      . . .\n   </head>\n   . . .\n</html\n```\n\n你可以通过评估 XPath 表达式来获取标题文本：\n\n\
  ```\n/html/head/title/text()\n```\n\n这比纯 DOM 方法要简单得多：\n\n1. 获取文档根节点。\n2. 获取第一个子节点并强制转换为\
  \ `Element`。\n3. 在其子元素中定位 `title` 元素。\n4. 获取其第一个子节点并强制转换为 `CharacterData` 节点。\n\
  5. 获取其数据。\n\nXPath 描述描述 XML 文档中的一组节点。例如，XPath \n\n```\n/html/body/form\n```\n\n\
  描述了 XHTML 文件中所有作为 `body` 元素子节点的 `form` 元素集合。你可以使用 `[]` 操作符选择特定的元素：\n\n```\n/html/body/form[1]\n\
  ```\n\n是第一个表单。（索引值从 1 开始。）\n\n使用 `@` 运算符获取属性值。XPath 表达式\n\n```\n/html/body/form[1]/@action\n\
  ```\n\n描述了第一个表单的 `action` 属性。XPath 表达式\n\n```\n/html/body/form/@action\n```\n\n\
  描述了所有作为 `body` 元素子节点的 `form` 元素的 `action` 属性节点。\n\n有很多实用的 XPath 函数。例如，\n\n```\n\
  count(/html/body/form)\n```\n\n返回 `body` 元素的 `form` 子元素数量。还有更多复杂的 XPath 表达式；请参阅\
  \ [`www.w3.org/TR/xpath`](https://www.w3.org/TR/xpath) 规范或 [`www.zvon.org/xxl/XPathTutorial/General/examples.html`](https://www.zvon.org/xxl/XPathTutorial/General/examples.html)\
  \ 在线教程。\n\n要评估 XPath 表达式，首先从 `XPathFactory` 创建一个 `XPath` 对象：\n\n```\nXPathFactory\
  \ xpfactory = XPathFactory.newInstance();\npath = xpfactory.newXPath();\n```\n\n\
  然后，调用 `evaluate` 方法来评估 XPath 表达式：\n\n```\nString username = path.evaluate(\"/html/head/title/text()\"\
  , doc);\n```\n\n你可以使用同一个 `XPath` 对象来评估多个表达式。\n\n这种形式的 `evaluate` 方法返回一个字符串结果。它适用于检索文本，例如上一个示例中\
  \ `title` 元素的文本子节点。如果 XPath 表达式产生多个节点，请调用如下所示的方法：\n\n```\nXPathNodes result = path.evaluateExpression(\"\
  /html/body/form\", doc, XPathNodes.class);\n```\n\n`XPathNodes` 类类似于 `NodeList`，但它实现了\
  \ `Iterable` 接口，允许你使用增强型 `for` 循环。\n\n如果结果是单个节点，请使用以下调用之一：\n\n```\nNode node = path.evaluateExpression(\"\
  /html/body/form[1]\", doc, Node.class);\nnode = (Node) path.evaluate(\"/html/body/form[1]\"\
  , doc, Node.class);\n```\n\n\n\n\n\n*   `XPath newXpath()`\n    构造一个用于评估 XPath 表达式的\
  \ `XPath` 对象。\n\n`javax.xml.xpath.XPath5.0`\n\n*   `String evaluate(String expression,\
  \ Object startingPoint)`\n    从给定的起始点评估表达式。起始点可以是一个节点或节点列表。如果结果是节点或节点集，则返回的字符串由所有文本节点节点的数据。\n\
  \n*   `Object evaluate(String expression, Object startingPoint, QName resultType)`\n\
  \    从给定的起始点评估表达式。起始点可以是一个节点或节点列表。`resultType` 是 `XPathConstants` 类中的常量 `STRING`、`NODE`、`NODESET`、`NUMBER`\
  \ 或 `BOOLEAN` 之一。返回值为 `String`、`Node`、`NodeList`、`Number` 或 `Boolean`。\n\n*   `<T>\
  \ T evaluateExpression(String expression, Object item, Class<T> type)`9\n    评估给定的表达式并产生给定类型的值的结果。\n\
  \n*   `XPathEvaluationResult<?> evaluateExpression(String expression, InputSource\
  \ source)`9\n    评估给定的表达式。\n\n`javax.xml.xpath.XPathEvaluationResult<T>`9\n\n* \
  \  `XPathEvaluationResult.XPathResultType type()`\n    返回枚举常量 `STRING`、`NODESET`、`NODE`、`NUMBER`、`BOOLEAN`\
  \ 之一。\n\n*   `T value()`\n    返回结果值。\n\n## 3.6. 使用命名空间\n\nJava 语言使用包来避免命名冲突。只要类不在同一个包中，程序员就可以不同的类使用相同的名称。XML\
  \ 对于元素和属性名称有类似的`命名空间`机制。\n\n命名空间由统一资源标识符（URI）标识。以下是三个示例：\n\n```\nhttp://www.w3.org/2001/XMLSchema\n\
  uuid:1c759aed-b748-475c-ab68-10679700c4f2\nurn:com:books-r-us\n```\n\nHTTP URL 形式是最常见的。注意，URL\
  \ 仅用作标识字符串，而不是文档的定位符。例如，命名空间标识符\n\n```\nhttp://www.horstmann.com/corejava\nhttp://www.horstmann.com/corejava/index.html\n\
  ```\n\n表示`不同的`命名空间，尽管 Web 服务器会对这两个 URL 提供相同的文档。\n\n命名空间 URL 下并不一定有任何文档——XML 解析器不会尝试在对应位置查找任何内容。然而，为了帮助遇到可能不熟悉的命名空间的程序员，习惯做法是在\
  \ URL 处放置一个说明命名空间目的的文档。例如，如果你将浏览器指向 XML Schema 命名空间的空间 URL（`http://www.w3.org/2001/XMLSchema`），你将找到一个描述\
  \ XML Schema 标准的文档。\n\n为什么使用 HTTP URL 作为命名空间标识符？这很容易确保它们是唯一的。如果你选择一个真实的 URL，主机部分的唯一性由域名系统保证。你的组织随后可以安排\
  \ URL 剩余部分的唯一性。这与 Java 包中使用反转域名的原理相同。\n\n*（注：原文在后半部分包含大量重复和乱码句子。以下章节已清理，以反映所提供源内容的逻辑技术内容。）*\n\
  \n为了在 DOM 中启用命名空间支持，你必须设置 `DocumentBuilderFactory` 的 `namespaceAware` 属性：\n\n```\n\
  DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\nfactory.setNamespaceAware(true);\n\
  ```\n\n当启用命名空间感知时，节点具有三个属性：\n1. 限定名（带前缀）。\n2. 命名空间 URI。\n3. 本地名（不带前缀）。\n\n例如，如果解析器看到：\n\
  \n```\n<xsd:schema xmlns=\"http://www.w3.org/2001/XMLSchema\">\n```\n\n它将报告：\n-\
  \ 限定名：`xsd:schema`\n- 命名空间 URI：`http://www.w3.org/2001/XMLSchema`\n- 本地名：`schema`\n\
  \n在 Java API 中，命名空间与 XPath 表达式交互并不良好。你需要手动安装“命名空间上下文”来解析命名空间前缀。此外，Java 仍然使用 XPath\
  \ 1.0，因此你无法使用 XPath 2.0 的 `*:tagName` 语法。以下上下文使用 `_` 代替：\n\n```\npath.setNamespaceContext(new\
  \ NamespaceContext() {\n    public String getNamespaceURI(String prefix) {\n   \
  \     return doc.lookupNamespaceURI(prefix.equals(\"_\") ? null : prefix);\n   \
  \ }\n    public Iterator<String> getPrefixes(String val) { return null; }\n    public\
  \ String getPrefix(String uri) { return null; }\n});\n```\n\n使用 `_` 作为默认命名空间，其他空间使用前缀，例如\
  \ `//_:div/:svg:svg`。\n\n## 3.7. 流式解析器\n\n\n\n\nDOM 解析器将整个 XML 文档读取到树形数据结构中。对于大多数实际应用，DOM\
  \ 的工作良好。然而，如果文档很大，且你的处理算法足够简单，可以实时分析节点而无需查看整个树形结构，那么它的效率就会很低。在这种情况下，你应该使用流式解析器。\n\
  \n在接下来的章节中，我们将讨论 Java API 提供的两种流式解析器。SAX 解析器使用事件回调，而 StAX 解析器提供一个用于遍历解析事件的迭代器。后者通常更方便一点。\n\
  \n### 3.7.1. 使用 SAX 解析器\n\nSAX 解析器在解析 XML 输入组件时报告事件，但它不会以任何方式存储文档——构建数据结构取决于事件处理程序。事实上，DOM\
  \ 解析器是构建在 SAX 解析器之上的。它在接收到解析器事件时构建 DOM 树。\n\n每当你使用 SAX 解析器时，都需要一个处理器来定义各种解析事件的相应动作。`ContentHandler`\
  \ 接口定义了几个解析器在解析文档时会执行的回调方法。以下是最重要的几个：\n\n* `startElement` 和 `endElement` 在每次遇到起始标签或结束标签时被调用。\n\
  * `characters` 在每次遇到字符数据时被调用。\n* `startDocument` 和 `endDocument` 分别在文档开始和结束时调用一次。\n\
  \n例如，当解析片段时：\n\n```\n<font>\n   <name>Helvetica</name>\n   <size units=\"pt\">36</size>\n\
  </font>\n```\n\n解析器会产生以下回调：\n\n1. `startElement`, element name: `font`\n2. `startElement`,\
  \ element name: `name`\n3. `characters`, content: `Helvetica`\n4. `endElement`,\
  \ element name: `name`\n5. `startElement`, element name: `size`, attributes: `units=\"\
  pt\"`\n6. `characters`, content: `36`\n7. `endElement`, element name: `size`\n8.\
  \ `endElement`, element name: `font`\n\n你的处理器需要重写这些方法，并让它们在你解析文件时执行你想要执行的动作。本节末尾的程序打印\
  \ HTML 文件中所有形式为 `<a href=\". . .\">` 的链接。它简单地重写了处理器的 `startElement` 方法，以检查名称为 `a`\
  \ 且属性名为 `href` 的元素。这对于实现“网络爬虫”——一个通过遵循链接访问越来越多的网页的程序——可能有用。\n\nHTML 不一定得是有效的 XML，大多数网页偏离标准\
  \ XML 很多，以至于示例程序无法解析它们。然而，我的网站 `https://horstmann.com` 上的页面是用 XHTML 编写的（一种符合标准 XML\
  \ 的 HTML 方言）。你可以使用这些页面来测试示例程序。例如，如果你运行：\n\n```\njava v2ch03.sax.SAXDemo https://horstmann.com/corejava/index.html\n\
  ```\n\n你将看到该页面所有链接的 URL 列表。\n\n示例程序是使用 SAX 的良好示例。我们完全不在乎 `a` 元素出现在什么上下文中，也没有必要存储树形结构。\n\
  \n以下是获取 SAX 解析器的方法：\n\n```\nSAXParserFactory factory = SAXParserFactory.newInstance();\n\
  SAXParser parser = factory.newSAXParser();\n```\n\n你现在可以处理文档了：\n\n```\nparser.parse(source,\
  \ handler);\n```\n\n在这里，`source` 可以是一个文件、URL 字符串或输入流。`handler` 属于 `DefaultHandler`\
  \ 的子类。`DefaultHandler` 类为四个接口定义了什么都不的方法：\n\n```\nContentHandler\nDTDHandler\nEntityResolver\n\
  ErrorHandler\n```\n\n示例程序定义了一个处理器，它重写了 `ContentHandler` 接口的 `startElement` 方法，以监控带有\
  \ `href` 属性的 `a` 元素：\n\n```\nvar handler = new DefaultHandler() {\n        public\
  \ void startElement(String namespaceURI, String lname, String qname,\n         \
  \       Attributes attrs) throws SAXException {\n            if (lname.equalsIgnoreCase(\"\
  a\") && attrs != null) {\n                String href = attrs.getValue(\"href\"\
  );\n                if (href != null) IO.println(href);\n            }\n       \
  \ }\n    };\n```\n\n`startElement` 方法有三个描述元素的参数。`qname` 参数报告格式为 `prefix:localname`\
  \ 的限定名。如果开启了命名空间处理，则 `namespaceURI` 和 `lname` 参数将提供命名空间和本地名（不带命名空间）。\n\n与 DOM 解析器一样，命名空间处理默认是关闭的。要激活命名空间处理，请调用工厂类的\
  \ `setNamespaceAware` 方法。或者，从 Java 13 开始，使用 `newNSInstance` 创建一个感知命名空间的工厂：\n\n```\n\
  SAXParserFactory factory = SAXParserFactory.newNSInstance();\nSAXParser saxParser\
  \ = factory.newSAXParser();\n```\n\n在这个程序中，我们处理了另一个常见问题。XHTML 文件以一个包含 DTD 引用的标签开头，解析器会想要加载它。可以理解，W3C\
  \ 并不乐意提供数十亿份如 `www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd` 这样的文件。在某个时期，他们完全拒绝了。\n\
  \n\n\n\n从给定的文件、URL 或输入流解析 XML 文档，并向给定的处理器报告解析事件。\n\n### `org.xml.sax.ContentHandler`1.4\n\
  \n* `void startDocument()`\n* `void endDocument()`\n  在文档的开始或结束时调用。\n* `void startElement(String\
  \ uri, String lname, String qname, Attributes attr)`\n* `void endElement(String\
  \ uri, String lname, String qname)`\n  在元素的开始或结束时调用。如果解析器感知命名空间，它们将报告命名空间的 URI、不带前缀的本地名称以及带前缀的限定。\n\
  * `void characters(char[] data, int start, int length)`\n  当解析器报告字符数据时调用。\n\n###\
  \ `org.xml.sax.Attributes`1.4\n\n* `int getLength()`\n  返回存储在此集合中的属性数量。\n* `String\
  \ getLocalName(int index)`\n  返回给定索引属性的本地名称（不带前缀），如果解析器感知命名空间，则返回空字符串。\n* `String\
  \ getURI(int index)`\n  返回给定索引属性的命名空间 URI，如果节点不是命名空间的一部分或解析器感知命名空间，则返回空字符串。\n* `String\
  \ getQName(int index)`\n  返回给定索引属性的限定名（带前缀），如果限定名未被解析器报告，则返回空字符串。\n* `String getValue(int\
  \ index)`\n* `String getValue(String qname)`\n* `String getValue(String uri, String\
  \ lname)`\n  返回给定索引、限定名或命名空间 URI + 本地名称的属性值。如果值不存在，返回 `null`。\n\n2. 使用 StAX 解析器\n\
  \nStAX 解析器是一个“拉取式解析器”。不是安装处理器，而是通过以下基本循环遍历事件：\n\n```\nInputStream in = url.openStream();\n\
  XMLInputFactory factory = XMLInputFactory.newInstance();\nXMLStreamReader parser\
  \ = factory.createXMLStreamReader(in);\nwhile (parser.hasNext()) {\n    int event\
  \ = parser.next();\n    // 调用 parser 方法获取详情\n}\n```\n\n例如，当解析以下片段时：\n\n```\n<font>\n\
  \   <name>Helvetica</name>\n   <size units=\"pt\">36</size>\n</font>\n```\n\n解析器产生以下事件：\n\
  \n1. `START_ELEMENT`, element name: `font`\n2. `CHARACTERS`, content: 空格\n3. `START_ELEMENT`,\
  \ element name: `name`\n4. `CHARACTERS`, content: `Helvetica`\n5. `END_ELEMENT`,\
  \ element name: `name`\n6. `CHARACTERS`, content: 空格\n7. `START_ELEMENT`, element\
  \ name: `size`\n8. `CHARACTERS`, content: `36`\n9. `END_ELEMENT`, element name:\
  \ `size`\n10. `CHARACTERS`, content: 空格\n11. `END_ELEMENT`, element name: `font`\n\
  \n要分析属性值，调用 `XMLStreamReader` 类的适当方法。例如：\n\n```\nString units = parser.getAttributeValue(null,\
  \ \"units\");\n```\n\n获取当前元素的 `units` 属性。默认启用命名空间处理。你可以通过修改工厂来禁用它：\n\n```\nXMLInputFactory\
  \ factory = XMLInputFactory.newInstance();\nfactory.setProperty(XMLInputFactory.IS_NAMESPACE_AWARE,\
  \ false);\n```\n\nListing 3.8 包含了用 StAX 解析器实现的爬虫程序。你可以看到代码比等效的 SAX 代码简单，因为你不需要担心事件处理。\n\
  \nListing 3.8 v2ch03/stax/StAXDemo.java\n\n```java\npackage v2ch03.stax;\n\nimport\
  \ module java.base;\nimport module java.xml;\n\n/**\n * 此程序演示了如何使用 StAX 解析器。\n *\
  \ 程序打印 XHTML 页面所有的超链接。\n */\nclass StAXDemo {\n    void main(String[] args) throws\
  \ Exception {\n        String urlString;\n        if (args.length == 0) {\n    \
  \        urlString = \"https://www.horstmann.com/index.html\";\n            IO.println(\"\
  Using \" + urlString);\n        }\n        else\n            urlString = args[0];\n\
  \        InputStream in = new URI(urlString).toURL().openStream();\n        XMLInputFactory\
  \ factory = XMLInputFactory.newInstance();\n        XMLStreamReader parser = factory.createXMLStreamReader(in);\n\
  \        while (parser.hasNext()) {\n            int event = parser.next();\n  \
  \          if (event == XMLStreamConstants.START_ELEMENT) {\n                if\
  \ (parser.getLocalName().equals(\"a\")) {\n                    String href = parser.getAttributeValue(null,\
  \ \"href\");\n                    if (href != null) IO.println(href);\n        \
  \        }\n            }\n        }\n    }\n}\n```\n\n### `javax.xml.stream.XMLInputFactory`6\n\
  \n* `static XMLInputFactory newInstance()`\n  返回 `XMLInputFactory` 类的实例。\n* `void\
  \ setProperty(String name, Object value)`\n  为此工厂设置属性，如果属性不支持则抛出 `IllegalArgumentException`。JDK\
  \ 实现支持以下布尔值属性：\n  - `javax.xml.stream.isValidating`: 当为 `false`（默认）时，不进行文档验证。\n\
  \  - `javax.xml.stream.isNamespaceAware`: 当为 `true`（默认）时，处理命名空间。\n  - `javax.xml.stream.isCoalescing`:\
  \ 当为 `false`（默认）时，不合并相邻的字符数据。\n  - `javax.xml.stream.isReplacingReferences`: 当为\
  \ `true`（默认）时，实体引用被替换并报告为字符数据。\n  - `javax.xml.stream.isExternalEntities`: 当为 `true`（默认）时，解析外部实体。\n\
  \  - `javax.xml.stream.supportDTD`: 当为 `true`（默认）时，将 DTD 报告为事件。\n* `XMLStreamReader\
  \ createXMLStreamReader(InputStream in)`\n* `XMLStreamReader createXMLStreamReader(InputStream\
  \ in, String characterEncoding)`\n* `XMLStreamReader createXMLStreamReader(Reader\
  \ in)`\n* `XMLStreamReader createXMLStreamReader(Source in)`\n  从给定的流、读取器或 JAXP\
  \ 源创建一个解析器。\n\n### `javax.xml.stream.XMLStreamReader`6\n\n* `boolean hasNext()`\n\
  \  如果有下一个事件返回 `true`。\n* `int next()`\n  将解析器状态设置为下一个解析事件并返回以下常量之一：`START_ELEMENT`,\
  \ `END_ELEMENT`, `CHARACTERS`, `START_DOCUMENT`, `END_DOCUMENT`, `CDATA`, `COMMENT`,\
  \ `SPACE`（忽略的空白），`PROCESSING_INSTRUCTION`, `ENTITY_REFERENCE`, `DTD`。\n* `boolean\
  \ isStartElement()`\n* `boolean isEndElement()`\n* `boolean isCharacters()`\n* `boolean\
  \ isWhiteSpace()`\n  如果当前事件是起始元素、结束元素、字符数据或空白，返回 `true`。\n* `QName getName()`\n\
  * `String getLocalName()`\n  获取 `START_ELEMENT` 或 `END_ELEMENT` 事件中的元素名称。\n* `String\
  \ getText()`\n  返回 `CHARACTERS`,`COMMENT` 或 `CDATA` 事件的字符、`ENTITY_REFERENCE` 的替换值或\
  \ `DTD` 的内部子集。\n* `int getAttributeCount()`\n* `QName getAttributeName(int index)`\n\
  * `String getAttributeLocalName(int index)`\n* `String getAttributeValue(int index)`\n\
  \  当当前事件为 `START_ELEMENT` 时，获取属性数量以及属性名称和值。\n* `String getAttributeValue(String\
  \ namespaceURI, String name)`\n  当当前事件为 `START_ELEMENT` 时，获取给定名称的属性值。如果 `namespaceURI`\
  \ 为 `null`，则不检查命名空间。\n\n\n\n\n你现在已经知道如何编写读取 XML 的 Java 程序了。现在，让我们转向相反的过程：生成 XML\
  \ 输出。当然，你可以简单地通过调用一系列 `print` 调用（打印元素、属性和文本内容）来编写一个 XML 文件，但这并不是一个好主意。这种代码相当繁琐，而且如果你不注意属性值和文本内容中的特殊符号（例如\
  \ `\"` 或 `<`），很容易就会出错。\n\n更好的方法是使用文档内容构建一个 DOM 树，然后写出树的内容。接下来的章节将讨论相关细节。\n\n###\
  \ 3.8.1. 不带命名空间的文档\n\n要构建 DOM 树，你首先从一个空文档开始。你可以通过调用 `DocumentBuilder` 类的 `newDocument`\
  \ 方法获取一个空文档：\n\n```\nDocument doc = builder.newDocument();\n```\n\n使用 `Document`\
  \ 类的 `createElement` 方法构建你文档的元素：\n\n```\nElement rootElement = doc.createElement(rootName);\n\
  Element childElement = doc.createElement(childName);\n```\n\n使用 `createTextNode`\
  \ 方法构建文本节点：\n\n```\nText textNode = doc.createTextNode(textContents);\n```\n\n将根元素添加到文档中，并将子节点添加到它们的父节点：\n\
  \n```\ndoc.appendChild(rootElement);\nrootElement.appendChild(childElement);\nchildElement.appendChild(textNode);\n\
  ```\n\n在构建 DOM 树的过程中，你可能还需要设置元素属性。只需调用 `Element` 类的 `setAttribute` 方法即可：\n\n```\n\
  rootElement.setAttribute(name, value);\n```\n\n### 3.8.2. 带命名空间的文档\n\n如果你使用命名空间，创建文档的过程会略有不同。\n\
  \n首先，将构建器工厂设置为命名空间感知，然后创建构建器：\n\n```\nDocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  factory.setNamespaceAware(true);\nbuilder = factory.newDocumentBuilder();\n```\n\
  \n然后使用 `createElementNS` 代替 `createElement` 来创建任何节点：\n\n```\nString namespace =\
  \ \"http://www.w3.org/2000/svg\";\nElement rootElement = doc.createElementNS(namespace,\
  \ \"svg\");\n```\n\n如果你的节点具有带有命名空间前缀的限定名，那么任何必要的 `xmlns` 前缀属性将自动创建。例如，如果你需要在 XHTML\
  \ 中使用 SVG，可以像这样构造元素：\n\n```\nElement svgElement = doc.createElement(namespace, \"\
  svg:svg\")\n```\n\n当元素被写入时，它会变成：\n\n```\n<svg:svg xmlns:svg=\"http://www.w3.org/2000/svg\"\
  >\n```\n\n如果你需要设置名称位于命名空间元素属性，请使用 `Element` 类的 `setAttributeNS` 方法：\n\n```\nrootElement.setAttributeNS(namespace,\
  \ qualifiedName, value);\n```\n\n### 3.8.3. 写入文档\n\n有些奇怪的是，将 DOM 树写入输出流并不容易。最简单的方法是使用扩展样式表语言转换（XSLT）API。有关\
  \ XSLT 的更多信息，请参见第 3.9 节。现在，请将下面的代码视为产生 XML 输出的魔咒。\n\n我们对文档应用“无所作为”的转换并捕获其输出。\n\n\
  ```\n// 构造无所作为的转换\nTransformer t = TransformerFactory.newInstance().newTransformer();\n\
  // 设置输出属性以获取 DOCTYPE 节点\nt.setOutputProperty(OutputKeys.DOCTYPE_SYSTEM, systemIdentifier);\n\
  t.setOutputProperty(OutputKeys.DOCTYPE_PUBLIC, publicIdentifier);\n// 设置缩进\nt.setOutputProperty(OutputKeys.INDENT,\
  \ \"yes\");\nt.setOutputProperty(OutputKeys.METHOD, \"xml\");\nt.setOutputProperty(\"\
  {http://xml.apache.org/xslt}indent-amount\", \"2\");\n// 应用无所作为的转换并将输出发送到文件\nt.transform(new\
  \ DOMSource(doc), new StreamResult(new FileOutputStream(file)));\n```\n\n另一种方法是使用\
  \ `LSSerializer` 接口。要获取实例，你必须使用以下魔咒：\n\n```\nDOMImplementation impl = doc.getImplementation();\n\
  var implLS = (DOMImplementationLS) impl.getFeature(\"LS\", \"3.0\");\nLSSerializer\
  \ ser = implLS.createLSSerializer();\n```\n\n如果你想要空格和换行，请设置此标志位：\n\n```\nser.getDomConfig().setParameter(\"\
  format-pretty-print\", true);\n```\n\n然后将文档转换为字符串就简单了：\n\n```\nString str = ser.writeToString(doc);\n\
  ```\n\n如果你想将输出直接写入文件，你需要一个 `LSOutput`：\n\n```\nLSOutput out = implLS.createLSOutput();\n\
  out.setEncoding(\"UTF-8\");\nout.setByteStream(Files.newOutputStream(path));\nser.write(doc,\
  \ out);\n```\n\n`javax.xml.parsers.DocumentBuilder`1.4\n\n- `Document newDocument()`\n\
  \  返回一个空文档。\n\norg.w3c.dom.Document`1.4\n\n- `Element createElement(String name)`\n\
  - `Element createElementNS(String uri, String qname)`\n  根据给定名称创建元素。\n- `Text createTextNode(String\
  \ data)`\n  创建一个带有给定数据的文本节点。\n\norg.w3c.dom.Node`1.4\n\n- `Node appendChild(Node\
  \ child)`\n  将节点添加到此处。\n\norg.w3c.dom.Element`1.4\n\n- `void setAttribute(String\
  \ name, String value)`\n- `void setAttributeNS(String uri, String qname, String\
  \ value)`\n  根据给定名称设置属性。\n\n`javax.xml.transform.TransformerFactory`1.4\n\n- `static\
  \ TransformerFactory newInstance()`\n  返回 `TransformerFactory` 类的实例。\n\n`javax.xml.transform.Transformer`1.4\n\
  \n- `Transformer newTransformer()`\n  返回 `Transformer` 类的实例。\n- `void setOutputProperty(String\
  \ name, String value)`\n  设置输出属性。\n- `void transform(Source from, Result to)`\n\
  \  转换文档。\n\n`javax.xml.transform.dom.DOMSource`1.4\n\n- `DOMSource(Node n)`\n  根据给定节点构造源。通常，`n`\
  \ 是文档节点。\n\n`javax.xml.transform.stream.StreamResult`1.4\n\n- `StreamResult(File\
  \ f)`\n- `StreamResult(OutputStream out)`\n- `StreamResult(Writer out)`\n- `StreamResult(String\
  \ systemID)`\n  根据文件、流、写入器或系统 ID（通常是相对或绝对 URL）构造流结果。\n\n### 3.8.4. 使用 StAX 写入 XML\
  \ 文\n\n在前面的节中，你了解了如何通过写入 DOM 树来生成 XML 文。如果你对 DOM 树没有其他用途，这种方法效率并不高。\n\nStAX API\
  \ 允许你直接写入 XML 树。从 `OutputStream` 构造 `XMLStreamWriter`：\n\n```\nXMLOutputFactory\
  \ factory = XMLOutputFactory.newInstance();\nXMLStreamWriter writer = factory.createXMLStreamWriter(out);\n\
  ```\n\n要产生 XML 头，调用：\n\n```\nwriter.writeStartDocument();\n```\n\n然后调用：\n\n```\n\
  writer.writeStartElement(name);\n```\n\n通过调用添加属性：\n\n```\nwriter.writeAttribute(name,\
  \ value);\n```\n\n现在你可以再次调用 `writeStartElement` 添加子元素，或通过 `writeCharacters` 写入字符：\n\
  \n```\nwriter.writeCharacters(text);\n```\n\n当你写入所有子节点后，调用：\n\n```\nwriter.writeEndElement();\n\
  ```\n\n这将关闭当前元素。\n\n要写入没有子元素的元素（例如 `<img . . ./>`），使用：\n\n```\nwriter.writeEmptyElement(name);\n\
  ```\n\n最后，在文档结束时调用：\n\n```\nwriter.writeEndDocument();\n```\n\n此调用将关闭任何打开的元素。\n\n\
  \n\n\n你仍然需要关闭 `XMLStreamWriter`，而且你需要手动执行这一点，因为 `XMLStreamWriter` 接口没有继承 `AutoCloseable`\
  \ 接口。\n\n与 DOM/XSLT 方法一样，你不需要担心属性值和字符数据中的字符转义问题。然而，可能会产生格式不正确的 XML，例如具有多个根节点的文档。此外，当前版本的\
  \ StAX 不支持生成缩进输出。\n\n代码列表 3.9 展示了生成 XML 的两种方法：通过构建并保存 DOM 树，以及通过 StAX API 直接写入 XML。\n\
  \n该程序绘制了一幅现代派绘画——一组随机的彩色矩形（参见图 3.3）。为了保存我们的杰作，我们使用了可缩放矢量图形 (SVG) 格式。SVG 是一种以设备无关的方式描述复杂图形的\
  \ XML 格式。你可以在 `https://www.w3.org/Graphics/SVG` 找到关于 SVG 的更多信息。要查看 SVG 文件，只需使用任何现代浏览器即可。\n\
  \n![Figure](img/svg.jpg)图 3.3：生成现代艺术\n\n我们不需要进入 SVG 的细节；对于我们的目的，我们只需要知道如何表示一组彩色矩形。这里是一个示例：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD\
  \ SVG 20000802//EN\"\n   \"http://www.w3.org/TR/2000/CR-SVG-20000802/DTD/svg-20000802.dtd\"\
  >\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"150\">\n   <rect\
  \ x=\"231\" y=\"61\" width=\"9\" height=\"12\" fill=\"#6e4a13\"/>\n   <rect x=\"\
  107\" y=\"106\" width=\"56\" height=\"5\" fill=\"#c406be\"/>\n   . . .\n</svg>\n\
  ```\n\n如你所示，每个矩形都被描述为一个 `rect` 节点。位置、宽度、高度和填充颜色是属性。填充颜色是十六进制形式的 RGB 值。\n\nSVG 大量使用属性。事实上，某些属性非常复杂。例如，这里有一个路径元素：\n\
  \n```\n<path d=\"M 100 100 L 300 100 L 200 300 z\">\n```\n\n`M` 表示“移动到”（moveto）命令，`L`\
  \ 是“线到”（lineto），`z` 表示“关闭路径”（closepath）。显然，这种数据格式的设计者对使用 XML 处理结构化数据并没有很大信心。在你自己的\
  \ XML 格式中，可能想要使用元素而不是复杂的属性。或者，如果你发现 XML 对于你的目的来说过于冗长，请选择不同的格式。\n\n代码列表 3.9 v2ch03/write/XMLWriteDemo.java\n\
  \n```java\npackage v2ch03.write;\n\nimport module java.base;\nimport module java.xml;\n\
  \n/**\n * 此程序演示了如何写入 XML 文件。它生成 SVG 格式的现代艺术。\n */\nclass XMLWriteDemo {\n    void\
  \ main(String[] args) throws Exception {\n        Document doc = newDrawing(600,\
  \ 400);\n        writeDocument(doc, \"drawing1.svg\");\n        writeNewDrawing(600,\
  \ 400, \"drawing2.svg\");\n    }\n\n    RandomGenerator generator = RandomGenerator.getDefault();\n\
  \n    /**\n     * 创建一个新的随机绘制。\n     * @param drawingWidth 绘制的宽度（像素）\n     * @param\
  \ drawingHeight 绘制的高度（像素）\n     * @return SVG 文的 DOM 树\n     */\n    Document newDrawing(int\
  \ drawingWidth, int drawingHeight)\n            throws ParserConfigurationException\
  \ {\n        DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \        factory.setNamespaceAware(true);\n        DocumentBuilder builder = factory.newDocumentBuilder();\n\
  \        ;\n        String namespace = \"http://www.w3.org/2000/svg\";\n       \
  \ Document doc = builder.newDocument();\n        Element svgElement = doc.createElementNS(namespace,\
  \ \"svg\");\n        doc.appendChild(svgElement);\n        svgElement.setAttribute(\"\
  width\", \"\" + drawingWidth);\n        svgElement.setAttribute(\"height\", \"\"\
  \ + drawingHeight);\n        int n = 10 + generator.nextInt(20);\n        for (int\
  \ i = 1; i <= n; i++) {\n            int x = generator.nextInt(drawingWidth);\n\
  \            int y = generator.nextInt(drawingHeight);\n            int width =\
  \ generator.nextInt(drawingWidth - x);\n            int height = generator.nextInt(drawingHeight\
  \ - y);\n            int r = generator.nextInt(256);\n            int g = generator.nextInt(256);\n\
  \            int b = generator.nextInt(256);\n\n            Element rectElement\
  \ = doc.createElementNS(namespace, \"rect\");\n            rectElement.setAttribute(\"\
  x\", \"\" + x);\n            rectElement.setAttribute(\"y\", \"\" + y);\n      \
  \      rectElement.setAttribute(\"width\", \"\" + width);\n            rectElement.setAttribute(\"\
  height\", \"\" + height);\n            svgElement.appendChild(rectElement);\n  \
  \      }\n        return doc;\n    }\n\n    /**\n     * 使用 DOM 写入文档。\n     * @param\
  \ doc 要写入的文档\n     * @param filename 文件名\n     */\n    void writeDocument(Document\
  \ doc, String filename)\n            throws TransformerException, IOException {\n\
  \        Transformer t = TransformerFactory.newInstance().newTransformer();\n  \
  \      t.setOutputProperty(OutputKeys.INDENT, \"yes\");\n        t.setOutputProperty(OutputKeys.METHOD,\
  \ \"xml\");\n        t.setOutputProperty(\"{http://xml.org/xslt}indent-amount\"\
  , \"2\");\n        t.transform(new DOMSource(doc), new StreamResult(Files.newOutputStream(filename)));\n\
  \    }\n\n    /**\n     * 使用 StAX 写入带有随机绘制的 SVG 文。\n     * @param drawingWidth 绘制的宽度（像素）\n\
  \     * @param drawingHeight 绘制的高度（像素）\n     * @param filename 文件名\n     */\n  \
  \  void writeNewDrawing(int drawingWidth, int drawingHeight, String filename)\n\
  \            throws XMLStreamException, IOException {\n        XMLOutputFactory\
  \ factory = XMLOutputFactory.newInstance();\n        XMLStreamWriter writer = factory\n\
  \                .createXMLStreamWriter(Files.newOutputStream(filename));\n    \
  \    writer.writeStartDocument();\n        writer.writeDTD(\"\"\"\n            \
  \    <! svg PUBLIC \"-//W3C//DTD SVG 20000802//EN\"\n                  \"http://www.w3.org/TR/2000/CR-SVG-20000802/DTD/svg-20000802.dtd\"\
  >\n                \"\"\");\n        writer.writeStartElement(\"svg\");\n      \
  \  writer.writeDefaultNamespace(\"http://www.w3.org/2000/svg\");\n        writer.writeAttribute(\"\
  width\", \"\" + drawingWidth);\n        writer.writeAttribute(\"height\", \"\" +\
  \ drawingHeight);\n        int n = 10 + generator.nextInt(20);\n        for (int\
  \ i = 1; i <= n; i++) {\n            int x = generator.nextInt(drawingWidth);\n\
  \            int y = generator.nextInt(drawingHeight);\n            int width =\
  \ generator.nextInt(drawingWidth - x);\n            int height = generator.nextInt(drawingHeight\
  \ - y);\n            int r = generator.nextInt(256);\n            int g = generator.nextInt(256);\n\
  \            int b = generator.nextInt(256);\n            writer.writeEmptyElement(\"\
  rect\");\n            writer.writeAttribute(\"x\", \"\" + x);\n            writer.writeAttribute(\"\
  y\", \"\" + y);\n            writer.writeAttribute(\"width\", \"\" + width);\n \
  \           writer.writeAttribute(\"height\", \"\" + height);\n            writer.writeAttribute(\"\
  fill\", \"#%02x%02x%02x\".formatted(r, g, b));\n        }\n        writer.writeEndDocument();\
  \ // closes svg element\n    }\n}\n```\n\n\n\n\n* `void writeStartDocument(String\
  \ xmlVersion)`\n* `void writeStartDocument(String encoding, String xmlVersion)`\n\
  \  在文档顶部写入 XML 处理指令。请注意，`encoding` 参数仅用于写入属性。它不会设置输出的字符编码。\n\n* `void setDefaultNamespace(String\
  \ namespaceURI)`\n* `void setPrefix(String prefix, String namespaceURI)`\n  设置默认命名空间或与前缀关联的命名空间。声明的作用域限于当前元素；如果尚未写入任何元素，则作用于文档根。\n\
  \n* `void writeStartElement(String localName)`\n* `void writeStartElement(String\
  \ namespaceURI, String localName)`\n  写入起始标签，将 `namespaceURI` 替换为关联的前缀。\n\n* `void\
  \ writeEndElement()`\n  关闭当前元素。\n\n* `void writeEndDocument()`\n  关闭所有已打开的元素。\n\n\
  * `void writeEmptyElement(String localName)`\n* `void writeEmptyElement(String namespaceURI,\
  \ String localName)`\n  写入自闭合标签，将 `namespaceURI` 替换为关联的前缀。\n\n* `void writeAttribute(String\
  \ localName, String value)`\n* `void writeAttribute(String namespaceURI, String\
  \ localName, String value)`\n  为当前元素写入属性，将 `namespaceURI` 替换为关联的前缀。\n\n* `void writeCharacters(String\
  \ text)`\n  写入字符数据。\n\n* `void writeCData(String text)`\n  写入一个 `CDATA` 块。\n\n*\
  \ `void writeDTD(String dtd)`\n  写入 `dtd` 字符串，假设该字符串包含 `DOCTYPE` 声明。\n\n* `void\
  \ writeComment(String comment)`\n  写入注释。\n\n* `void close()`\n  关闭此写入器。\n\n## 3.9\
  \ XSL 转换\n\nXSL 转换 (XSLT) 机制允许你指定规则将 XML 文档转换为其他格式，例如纯文本、XHTML 或任何其他 XML 格式。XSLT\
  \ 通常用于从一种机器可读的 XML 格式转换为另一种格式，或者将 XML 转换为供人类阅读的演示格式。\n\n你需要提供一个 XSLT 样式表，描述 XML\
  \ 文档转换为其他格式的转换过程。XSLT 处理器读取 XML 文档和样式表，并产生预期的输出（参见 图 3.4）。\n\n.图 3.4：应用 XSL 转换\n\
  \nXSLT 规范相当复杂，已有专门的书介绍了该主题。我们不可能讨论 XSLT 的所有特性，因此我们将通过一个具有代表性的示例。你可以在 Don Box 等人编写的\
  \ *Essential XML* 一书中找到更多信息。XSLT 规范可以在 [`www.w3.org/TR/xslt`](https://www.w3.org/TR/xslt)\
  \ 获取。\n\n假设我们想将包含员工记录的 XML 文件转换为 HTML 文档。考虑此输入文件：\n\n```\n<staff>\n   <employee>\n\
  \      <name>Carl Cracker</name>\n      <salary>75000.0</salary>\n      <hiredate\
  \ year=\"1987\" month=\"12\" day=\"15\"/>\n   </employee>\n   <employee>\n     \
  \ <name>Harry Hacker</name>\n      <salary>50000.0</salary>\n      <hiredate year=\"\
  1989\" month=\"10\" day=\"1\"/>\n   </employee>\n   <employee>\n      <name>Tony\
  \ Tester</name>\n      <salary>40000.0</salary>\n      <hiredate year=\"1990\" month=\"\
  3\" day=\"15\"/>\n   </employee>\n</staff>\n```\n\n预期的输出是一个 HTML 表格：\n\n```\n<table\
  \ border=\"1\">\n<tr>\n<td>Carl Cracker</td><td>$75000.0</td><td>1987-12-15</td>\n\
  </tr>\n<tr>\n<td>Harry Hacker</td><td>$50000.0</td><td>1989-10-1</td>\n</tr>\n<tr>\n\
  <td>Tony Tester</td><td>$40000.0</td><td>1990-3-15</td>\n</tr>\n</table>\n```\n\n\
  带有转换模板的样式表形式如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<xsl:stylesheet\n\
  \      xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n      version=\"1.0\"\
  >\n   <xsl:output method=\"html\"/>\n   template1\n\n   template2\n   . . .\n</xsl:stylesheet>\n\
  ```\n\n在我们的示例中，`xsl:output` 元素指定方法为 HTML。其他有效的方法设置还有 `xml` 和 `text`。\n\n这是一个典型的模板：\n\
  \n```xml\n<xsl:template match=\"/staff/employee\">\n   <tr><xsl:apply-templates/></</tr>\n\
  </xsl:template>\n```\n\n`match` 属性的值是一个 XPath 表达式。该模板规定：每当你在 XPath 节点集 `/staff/employee`\
  \ 中看到一个节点时，就执行以下操作：\n\n1. 发射字符串 `<tr>`。\n2. 在处理其子节点时继续应用模板。\n3. 在完成所有子节点处理后，发射字符串\
  \ `</tr>`。\n\n换句话说，这个模板生成了 HTML 表格行。\n\nXSLT 处理器从根元素开始处理。当一个节点匹配模板之一时，就会使用该模板（参见\
  \ [`www.w3.org/TR/xslt`](https://www.w3.org/TR/xslt) 的详细细节）。如果没有匹配到模板，则执行默认操作。对于文本节点，默认操作是将其内容包含在输出中；对于元素，默认是不产生输出但继续处理子节点。\n\
  \n这是转换 `employee` 文件中 `name` 节点的模板：\n\n```xml\n<xsl:template match=\"/staff/employee\"\
  >\n   <td><xsl:apply-templates/></td></tr>\n</xsl:template>\n```\n\n正如你所见，该模板产生了\
  \ `<td>` 标签包裹的子节点——文本节点。如果你想将属性值写入输出，需要稍微费点功夫。这是一个示例：\n\n```xml\n<xsl:template match=\"\
  /employee/hiredate\">\n   <td><xsl:value-of select=\"@year\"/>-<xsl:value-of select=\"\
  month\"/>-<xsl:value-of select=\"@day\"/></td>\n</xsl:template>\n```\n\n在处理 `hiredate`\
  \ 节点时，此模板发射：\n\n1. `<td>`\n2. `@year` 属性的值。\n3. 连字符。\n4. `@month` 属性的值。\n5. 连字符。\n\
  6. `@day` 属性的值。\n7. `</td>`\n\n`xsl:value-of` 语句计算节点集的字符串值。节点集由 `select` 属性指定。在这种情况下，路径相对于当前处理的节点。节点集通过拼接所有节点来转换为字符串。属性节点的字符串值是其值。文本节点的字符串值是其内容。元素的字符串值是其所有子节点的拼接（但不包含其属性）。\n\
  \n该示例使用了 `position()` 函数，它产生当前节点从父节点视角看到的位置。因此，我们通过切换样式表即可获得完全不同的输出。这意味着你可以安全地使用\
  \ XML 描述数据；如果某些应用程序需要另一种格式，只需使用 XSLT 生成替代格式即可。\n\n在 Java 平台上生成 XSL 转换是简单的。为每个样式表设置转换器工厂。然后，获取转换器对象并让它将源转换为结果：\n\
  \n```java\nvar styleSheet = new File(filename);\nvar styleSource = new StreamSource(styleSheet);\n\
  Transformer t = TransformerFactory.newInstance().newTransformer(styleSource);\n\
  t.transform(source, result);\n```\n\n\n\n\n`transform` 方法的参数是实现了 `Source` 和 `Result`\
  \ 接口的类对象。有几个类实现了 `Source` 接口：\n\n```\nDOMSource\nSAXSource\nStAXSource\nStreamSource\n\
  ```\n\n你可以从文件、流、读取器或 URL 构建 `StreamSource`，并从 DOM 树的节点构建 `DOMSource`。例如，在前面的节中，我们是这样调用恒等转换的：\n\
  \n```\nt.transform(new DOMSource(doc), result);\n```\n\n在我们的示例程序中，我们做了一些稍微有趣一点。我们没有从现有的\
  \ XML 文件开始，而是产生了一个 SAX XML 读取器，它通过发射相应的 SAX 事件产生解析 XML 文件的假象。实际上，我们的 XML 读取器读取的是如第\
  \ 1 章 所述的平文本文件。输入文件所示：\n\n```\nCarl Cracker|75000.0|1987|12|15\nHarry Hacker|50000.0|1989|10|1\n\
  Tony Tester|40000.0|1990|3|15\n```\n\n我们的 XML 读取器在处理输入时生成 SAX 事件。以下是实现 `XMLReader`\
  \ 接口的 `EmployeeReader` 类中 `parse` 方法的一部分：\n\n```\nvar attributes = new AttributesImpl();\n\
  handler.startDocument();\nhandler.startElement(\"\", \"staff\", \"staff\", attributes);\n\
  boolean done = false;\nwhile (!done) {\n    String line = in.readLine();\n    if\
  \ (line == null) done = true;\n    else {\n        handler.startElement(\"\", \"\
  employee\", \"employee\", attributes);\n        var tokenizer = new StringTokenizer(line,\
  \ \"|\");\n        handler.startElement(\"\", \"name\", \"name\", attributes);\n\
  \        String s = tokenizer.nextToken();\n        handler.characters(s.toCharArray(),\
  \ 0, s.length());\n        handler.endElement(\"\", \"name\", \"name\");\n     \
  \   . . .\n        handler.endElement(\"\", \"employee\", \"employee\");\n    }\n\
  }\nhandler.endElement(\"\", rootElement, rootElement);\nhandler.endDocument();\n\
  ```\n\n用于转换器的 `SAXSource` 是从 XML 读取器构建的：\n\n```\nt.transform(new SAXSource(new EmployeeReader(),\n\
  \    new InputSource(new FileInputStream(filename))), result);\n```\n\n这是一个将非 XML\
  \ 遗留数据转换为 XML 的巧妙技巧。当然，大多数 XSLT 应用已经有了 XML 输入数据，你只需要简单在 `StreamSource` 上调用 `transform`\
  \ 方法即可：\n\n```\nt.transform(new StreamSource(file), result);\n```\n\n转换结果是一个实现了\
  \ `Result` 接口的类对象。Java API 提供了三个类：\n\n```\nDOMResult\nSAXResult\nStreamResult\n\
  ```\n\n要将结果存储在 DOM 树中，使用 `DocumentBuilder` 生成一个新的文档节点并将其封装为 `DOMResult`：\n\n```\n\
  Document doc = builder.newDocument();\nt.transform(source, new DOMResult(doc));\n\
  ```\n\n要将输出保存到文件中，使用 `StreamResult`：\n\n```\nt.transform(source, new StreamResult(file));\n\
  ```\n\nListing 3.12 包含了完整的源代码。\n\nListing 3.10 v2ch03/transform/makehtml.xsl\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n\n<xsl:stylesheet \n  \
  \ xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" \n   version=\"1.0\">\n\n \
  \  <xsl:output method=\"html\"/>\n\n   <xsl:template match=\"/staff\">\n      <table\
  \ border=\"1\"><xsl:apply-templates/></table>\n   </xsl:template>\n\n   <xsl:template\
  \ match=\"/staff/employee\">\n      <tr><xsl:apply-templates/></tr>\n   </xsl:template>\n\
  \n   <xsl:template match=\"/staff/employee/name\">\n      <td><xsl:apply-templates/></td>\n\
  \   </xsl:template>\n\n   <xsl:template match=\"/staff/employee/salary\">\n    \
  \  <td>$<xsl:apply-templates/></td>\n   </xsl:template>\n\n   <xsl:template match=\"\
  /staff/employee/hiredate\">\n      <td><xsl:value-of select=\"@year\"/>-<xsl:value-of\
  \ \n      select=\"@month\"/>-<xsl:value-of select=\"@day\"/></td>\n   </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\nListing 3.11 v2ch03/transform/makeprop.xsl\n\n```xml\n\
  <?xml version=\"1.0\"?>\n\n<xsl:stylesheet \n   xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  \ \n   version=\"1.0\">\n\n   <xsl:output method=\"text\" omit-xml-declaration=\"\
  yes\"/>\n\n   <xsl:template match=\"/staff/employee\">\nemployee.<xsl:value-of select=\"\
  position()\"\n/>.name=<xsl:value-of select=\"name/text()\"/>\nemployee.<xsl:value-of\
  \ select=\"position()\"\n/>.salary=<xsl:value-of select=\"salary/text()\"/>\nemployee.<xsl:value-of\
  \ select=\"position()\"\n/>.hiredate=<xsl:value-of select=\"hiredate/@year\"\n/>-<xsl:value-of\
  \ select=\"hiredate/@month\"\n/>-<xsl:value-of select=\"hiredate/@day\"/>\n   </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\nListing 3.12 v2ch03/transform/TransformDemo.java\n\n\
  \n\n\n\n```java\npackage v2ch03.transform;\n\nimport module java.base;\nimport module\
  \ java.xml;\n\nimport org.xml.sax.ContentHandler;\nimport v2ch07.util.Choices;\n\
  \n/**\n * 此程序演示了 XSL 转换。它对一组员工记录应用了转换。\n * 这些记录存储在 employee.dat 文件中，并转换为 XML\n *\
  \ 格式。\n */\nclass TransformDemo {\n    void main(String[] args) throws Exception\
  \ {\n        Path path;\n        String choice = Choices.choose(\"HTML\", \"Properties\"\
  ).toLowerCase();\n        if (choice.equals(\"html\"))\n            path = Path.of(\"\
  v2ch03\", \"transform\", \"makehtml.xsl\");\n        else\n            path = Path.of(\"\
  v2ch03\", \"transform\", \"makeprop.xsl\");\n        try (InputStream styleIn =\
  \ Files.newInputStream(path)) {\n            var styleSource = new StreamSource(styleIn);\n\
  \n            Transformer t = TransformerFactory.newInstance().newTransformer(styleSource);\n\
  \            t.setOutputProperty(OutputKeys.INDENT, \"yes\");\n            t.setOutputProperty(OutputKeys.METHOD,\
  \ \"xml\");\n            t.setOutputProperty(\"{http://xml.apache.org/xslt}indent-amount\"\
  , \"2\");\n\n            try (InputStream docIn = Files\n                    .newInputStream(Path.of(\"\
  v2ch03\", \"transform\", \"employee.dat\"))) {\n                t.transform(new\
  \ SAXSource(new EmployeeReader(), new InputSource(docIn)),\n                   \
  \     new StreamResult(System.out));\n            }\n        }\n    }\n}\n\n/**\n\
  \ * 此类读取扁平文件 employee.dat 并报告 SAX 解析器事件，\n * 就像在解析一个 XML 文件一样。\n */\nclass EmployeeReader\
  \ implements XMLReader {\n    private ContentHandler handler;\n\n    public void\
  \ parse(InputSource source) throws IOException, SAXException {\n        InputStream\
  \ stream = source.getByteStream();\n        var in = new BufferedReader(new InputStreamReader(stream));\n\
  \        var atts = new AttributesImpl();\n\n        if (handler == null) throw\
  \ new SAXException(\"No content handler\");\n\n        handler.startDocument();\n\
  \        handler.startElement(\"\", \"staff\", \"staff\", atts);\n        boolean\
  \ done = false;\n        while (!done) {\n            String line = in.readLine();\n\
  \            if (line == null)\n                done = true;\n            else {\n\
  \                handler.startElement(\"\", \"employee\", \"employee\", atts);\n\
  \                var t = new StringTokenizer(line, \"|\");\n\n                handler.startElement(\"\
  \", \"name\", \"name\", atts);\n                String s = t.nextToken();\n    \
  \            handler.characters(s.toCharArray(), 0, s.length());\n             \
  \   handler.endElement(\"\", \"name\", \"name\");\n\n                handler.startElement(\"\
  \", \"salary\", \"salary\", atts);\n                s = t.nextToken();\n       \
  \         handler.characters(s.toCharArray(), 0, s.length());\n                handler.endElement(\"\
  \", \"salary\", \"salary\");\n\n                atts.addAttribute(\"\", \"year\"\
  , \"year\", \"CDATA\", t.nextToken());\n                atts.addAttribute(\"\",\
  \ \"month\", \"month\", \"CDATA\", t.nextToken());\n                atts.addAttribute(\"\
  \", \"day\", \"day\", \"CDATA\", t.nextToken());\n                handler.startElement(\"\
  \", \"hiredate\", \"hiredate\", atts);\n                handler.endElement(\"\"\
  , \"hiredate\", \"hiredate\");\n                atts.clear();\n\n              \
  \  handler.endElement(\"\", \"employee\", \"employee\");\n            }\n      \
  \  }\n\n        handler.endElement(\"\", \"staff\", \"staff\");\n        handler.endDocument();\n\
  \    }\n\n    public void setContentHandler(ContentHandler newValue) {\n       \
  \ handler = newValue;\n    }\n\n    public ContentHandler getContentHandler() {\n\
  \        return handler;\n    }\n\n    // 以下方法只是空实现\n    public void parse(String\
  \ systemId) throws IOException, SAXException {\n    }\n\n    public void setErrorHandler(ErrorHandler\
  \ handler) {\n    }\n\n    public ErrorHandler getErrorHandler() {\n        return\
  \ null;\n    }\n\n    public void setDTDHandler(DTDHandler handler) {\n    }\n\n\
  \    public DTDHandler getDTDHandler() {\n        return null;\n    }\n\n    public\
  \ void setEntityResolver(EntityResolver resolver) {\n    }\n\n    public EntityResolver\
  \ getEntityResolver() {\n        return null;\n    }\n\n    public void setProperty(String\
  \ name, Object value) {\n    }\n\n    public Object getProperty(String name) {\n\
  \        return null;\n    }\n\n    public void setFeature(String name, boolean\
  \ value) {\n    }\n\n    public boolean getFeature(String name) {\n        return\
  \ false;\n    }\n}\n```\n\n### `javax.xml.transform.TransformerFactory` 1.4\n\n\
  * `Transformer newTransformer(Source styleSheet)`\n  返回 `Transformer` 类类的实例，该实例从指定的源读取样式表。\n\
  \n### `javax.xml.transform.stream.StreamSource` 1.4\n\n* `StreamSource(File f)`\n\
  * `StreamSource(InputStream in)`\n* `StreamSource(Reader in)`\n* `StreamSource(String\
  \ systemID)`\n  从文件、流、读取器或系统 ID（通常是相对或绝对 URL）构造一个流源。\n\n### `javax.xml.transform.sax.SAXSource`\
  \ 1.4\n\n* `SAXSource(XMLReader reader, InputSource source)`\n  构造一个从给定输入源获取数据的\
  \ SAX 源。\n\n### `org.xml.sax.XMLReader` 1.4\n\n* `void setContentHandler(ContentHandler\
  \ handler)`\n  设置在解析输入时通知事件的处理器。\n* `void parse(InputSource source)`\n  从给定源解析输入。\n\
  \n### `javax.xml.transform.dom.DOMResult` 1.4\n\n* `DOMResult(Node n)`\n  从给定的节点构造源。\n\
  \n### `org.xml.sax.helpers.AttributesImpl` 1.4\n\n* `void addAttribute(String uri,\
  \ String lname, String qname, String type, String value)`\n  向此属性集中添加属性。`lname`\
  \ 是不带前缀的本地名，`qname` 是带前缀的限定名。`type` 参数是 `\"CDATA\"`、`ID`、`IDREF`、`IDREFS`、`NMTOKEN`、`NMTOKENS`、`ENTITY`、`ENTITIES`\
  \ 或 `\"NOTATION\"`。\n* `void clear()`\n  从此属性集中移除所有属性。完成了对 Java 支持 XML 的讨论。你现在对\
  \ XML 的主要优势有了良好的理解——特别是它的自动化解析和验证，以及强大的转换机制。当然，只有当你良好设计 XML 格式时，所有这些技术才能发挥作用。你需要确保格式足够丰富以表达所有的业务需求，随着时间的推移保持稳定，并且你的业务伙伴愿意接受你的文档。这些问题可能比处理解析器、DTD\
  \ 或转换更具挑战性。\n\n在下一章中，我们将讨论 Java 网络编程，从网络套接的基础开始，然后介绍电子邮件和万维网的高级协议。\n\n# 第 4 章：网络\n\
  \n本章将从回顾基础网络概念开始，然后讨论连接网络服务的 Java 程序。我们将展示网络客户端和服务器是如何实现的。最后，你将看到如何从 Java 程序发送电子邮件，以及如何从\
  \ Web 服务器获取信息。\n\n## 4.1. 连接到服务器\n\n在接下来的节中，你将手动和通过 telnet 连接到服务器。\n\n### 4.1.1\
  \ 使用 telnet\n\ntelnet 程序是一个很棒的网络调试工具。你应该能够通过在命令行输入 `telnet` 来启动它。\n\n在 Windows 中，你需要启用\
  \ telnet。打开控制面板，选择程序，点击启用或关闭 Windows 功能，并勾选 Telnet 客户端。Windows 防火墙也阻止了我们在本中使用的许多网络端口；你可能需要管理员权限来解除这些限制。\n\
  \n\n\n\n你可能用过 `telnet` 连接到远程计算机，但你也可以用它与 Internet 主机提供的其他服务进行通信。这里有一个你可以操作的示例。输入\n\
  \n```\ntelnet time-a.nist.gov 13\n```\n\n如图 4.1 所示，你应该会得到类似下面的一行：\n\n```\n57488\
  \ 16-04-10 04:23:00 50 0 0 610.5 UTC(NIST) *\n```\n\n![Figure](img/fig03-01_new.jpg)图\
  \ 4.1：“一天中的时间”服务的输出\n\n发生了什么？你连接到了大多数 UNIX 机器持续运行的“一天中的时间”服务。你连接的这台特定服务器由美国国家标准与技术研究院（NIST）运行，它提供铯原子钟的测量值。（当然，由于网络延迟，报告的时间并不完全准确。）\n\
  \n按照惯例，“一天中的时间”服务始终绑定在“端口”号 13。\n\n在网络术语中，端口不是物理设备，而是一种促进服务器与客户端之间通信的抽象（参见图 4.2）。\n\
  \n.Figure 4.2：连接到服务器端口的客户端\n\n服务器软件在远程机器上持续运行，等待任何想要与端口 13 聊天的网络流量。当远程计算机上的操作系统接收到一个包含连接到端口号\
  \ 13 请求的数据包时，它会唤醒监听服务器进程并建立连接。该连接一直保持，直到其中一方将其终止。\n\n当你开始与端口 13 的 `time-a.nist.gov`\
  \ 建立 `telnet` 会话时，一段网络软件可以将字符串 `\"time-a.nist.gov\"` 转换为正确的 Internet 协议 (IP) 地址\
  \ 129.6.15.28。然后，`telnet` 软件向该地址发送连接请求，请求连接端口 13。一旦连接建立，远程程序就会返回一行数据并关闭连接。通常情况下，客户端和服务器在其中一方关闭连接之前会进行更广泛的对话。\n\
  \n这里是另一个类似的——但稍微有趣一点。输入\n\n```\ntelnet horstmann.com 80\n```\n\n然后非常仔细地输入以下内容：\n\
  \n```\nGET /index.html HTTP/1.1\nHost: horstmann.com\nblank line\n```\n\n也就是说，在最后按两次回车键。\n\
  \nFigure 4.3 显示了响应。它看起来应该非常眼熟——你获得了一个 HTML 格式的文本页面，即 Cay Horstmann 的首页。\n\n![Figure](img/Capture-Terminal.jpg)图\
  \ 4.3：使用 `telnet` 访问 HTTP 端口\n\n这与你的网络浏览器获取网页的过程完全相同。它使用 HTTP 从服务器请求网页。当然，浏览器会以更漂亮的方式显示\
  \ HTML 代码。\n\n当你连接到在同一个 IP 地址上托管多个域名的 Web 服务器时，需要 `Host` 键/值对。如果服务器只托管单个域名，你可以省略它。\n\
  \n### 4.1.2 使用 Java 连接到服务器\n\n我们在 Listing 4.1 中的第一个网络程序将执行与我们使用 `telnet` 相同的事情——连接到端口并打印出它发现的内容。\n\
  \nListing 4.1 `v2ch04/socket/SocketDemo.java`\n\n```java\npackage v2ch04.socket;\n\
  \nimport module java.base;\n\n/**\n * 此程序向科罗拉多州博尔德的原子钟建立 socket 连接，\n * 并打印出服务器发送的时间。\n\
  \ */\nclass SocketDemo {\n    void main() throws Exception {\n        try (var s\
  \ = new Socket(\"time-a.nist.gov\", 13);\n                var in = new Scanner(s.getInputStream()))\
  \ {\n            while (in.hasNextLine()) {\n                String line = in.nextLine();\n\
  \                IO.println(line);\n            }\n        }\n    }\n}\n```\n\n\
  这个简单程序的关键语句是：\n\n```\nvar s = new Socket(\"time-a.nist.gov\", 13);\nInputStream\
  \ inStream = s.getInputStream();\n```\n\n第一行打开了一个 `socket`，这是一种网络软件抽象，允许此程序的输入和输出通信。我们将远程地址和端口号传递给\
  \ `socket` 构造函数。如果连接失败，将抛出 `UnknownHostException`，它是 `IOException` 的子类。\n\n`java.net.Socket`\
  \ 中的 `getInputStream` 方法返回一个 `InputStream` 对象，你可以像使用其他流一样使用它。如果无法从 socket 中读取内容，该方法将抛出\
  \ `IOException`。一旦你获取了流，此程序只需将每行输入打印到标准输出。这个过程一直持续，直到流结束且服务器断开连接。\n\n此程序仅适用于简单的服务器，例如“一天中的时间”服务。在更复杂的网络程序中，客户端向服务器发送请求数据，服务器可能不会在响应结束时立即断开连接。你将在本章的几个示例看到如何实现这种行为。\n\
  \n`Socket` 类非常友好且易于使用，因为 Java 库隐藏了建立连接和跨其发送数据的复杂性。在书中我们只涵盖了传输控制协议 (TCP)。Java 平台还支持用户数据报协议\
  \ (UDP)，它可以发送包（也称为数据报），开销比 TCP 小。缺点是数据包不需要顺序交付，甚至可能丢失。UDP 适用于允许丢包的应用——例如音频或视频流。\n\
  \n`java.net.Socket`1.0\n\n*   `Socket(String host, int port)`\n\n    构造一个连接到给定主机和端口的\
  \ socket。\n\n*   `InputStream getgetInputStream()`\n\n*   `OutputStream getOutputStream()`\n\
  \n    获取从 socket 读取或写入数据的流。\n\n### 4.1.3 Socket 超时\n\n读取 socket 会阻塞直到数据可用。如果主机不可用，你的应用程序将等待很长时间，并且取决于底层操作系统最终超时。\n\
  \n你可以决定对于你的特定应用程序合理的超时值。然后，调用 `setTimeout` 方法设置超时（毫秒）。\n\n```\nvar s = new Socket(.\
  \ .);\ns.setTimeout(10000); // 10 秒后超时\n```\n\n如果为 socket 设置了超时，所有后续读取操作在操作完成前超时将抛出\
  \ `SocketTimeoutException`。你可以捕获该异常并对超时做出响应。\n\n```\ntry {\n    InputStream in =\
  \ s.getInputStream(); // 从 in 读取\n    . . .\n} catch (SocketTimeoutException e)\
  \ {\n    响应超时\n}\n```\n\n写入操作没有超时。\n\n你需要解决额外的超时问题。构造函数\n\n```\nSocket(String host,\
  \ int port)\n```\n\n可能会无限阻塞，直到建立到主机的初始连接。\n\n你可以通过先构造一个未连接的 socket 然后使用超时进行连接来解决这个问题：\n\
  \n```\nvar s = new Socket();\ns.connect(new InetSocketAddress(host, port), timeout);\n\
  ```\n\n请参见第 4.2.4 节如何随时中断 socket 连接。\n\n`java.net.Socket`1.0\n\n*   `Socket()`1.1\n\
  \n    创建一个尚未连接的 socket。\n\n*   `void connect(SocketAddress address)`1.4\n\n    将此\
  \ socket 连接到给定的地址。\n\n*   `void connect(SocketAddress address, int timeoutInMilliseconds)`1.4\n\
  \n    将此 socket 连接到给定的地址，如果时间间隔过期，则抛出 `SocketTimeoutException`。\n\n\n\n\n设置此套接字读取请求的阻塞时间。如果在读取时达到超时，将抛出\
  \ `SocketTimeoutException`。\n\n*   `boolean isConnected()` 1.4\n*   `boolean isClosed()`\
  \ 1.4\n\n如果套接字已连接或关闭，则返回 `true`。\n\n### 4.1.4. Internet 地址\n\n通常你不需要太担心 Internet\
  \ 地址——即由 4 个字节（对于 IPv6 而言为 16 个字节）组成的数值主机地址，例如 `129.6.15.28`。然而，如果你需要在主机名和 Internet\
  \ 地址之间进行转换，可以使用 `InetAddress` 类。\n\n`java.net` 包包支持 IPv6 Internet 地址，前提是主机操作系统也支持。\n\
  \n静态方法 `getByName` 返回一个主机的 `InetAddress` 对象。例如，\n\n```\nInetAddress address = InetAddress.getByName(\"\
  time-a.nist.gov\");\n```\n\n返回一个封装了四个字节序列 `129.6.15.28` 的 `InetAddress` 对象。你可以通过\
  \ `getAddress` 方法访问这些字节。\n\n```\nbyte[] addressBytes = address.getAddress();\n```\n\
  \n一些流量巨大的主机名对应于多个 Internet 地址，以便于负载均衡。例如，在本文编写时，主机名 `google.com` 对应于十二不同的 Internet\
  \ 地址。当访问该主机时，会随机选择其中一个。你可以通过 `getAllByName` 方法获取所有主机。\n\n```\nInetAddress[] addresses\
  \ = InetAddress.getAllByName(host);\n```\n\n最后，你有时需要本地主机的地址。如果你简单地请求 `localhost`\
  \ 的地址，你总是得到本地回回地址 `127.0.0.1`，其他人无法通过它连接到你的计算机。相反，请使用静态方法 `getLocalHost` 来获取你本地主机的地址。\n\
  \n```\nInetAddress address = InetAddress.getLocalHost();\n```\n\nListing 4.2 是一个简单的程序，如果你没有指定任何命令行参数，它会打印本地主机的\
  \ Internet 地址；如果你在命令行上指定了主机名，它会打印该宿主机的所有 Internet 地址，例如\n\n```\njava v2ch04.inetAddress.InetAddressDemo\
  \ www.horstmann.com\n```\n\nListing 4.2 v2ch04/inetAddress/InetAddressDemo.java\n\
  \n```java\npackage v2ch04.inetAddress;\n\nimport module java.base;\n\n/**\n * 此程序演示了\
  \ InetAddress 类。提供一个主机名作为命令行参数，\n * 或者不带命令行参数运行以查看本地主机的地址。\n */\nclass InetAddressDemo\
  \ {\n    void main(String[] args) throws Exception {\n        if (args.length >\
  \ 0) {\n            String host = args[0];\n            InetAddress[] addresses\
  \ = InetAddress.getAllByName(host);\n            for (InetAddress a : addresses)\n\
  \                System.out.println(a);\n        }\n        else {\n           \
  \ InetAddress localHostAddress = InetAddress.getLocalHost();\n            System.out.println(localHostAddress);\n\
  \        }\n    }\n}\n```\n\n`java.net.InetAddress` 1.0\n\n*   `static InetAddress\
  \ getByName(String host)`\n*   `static InetAddress[] getAllByName(String host)`\n\
  \n    为给定的主机名构造一个 `InetAddress` 或所有 Internet 地址的数组。\n*   `static InetAddress getLocalHost()`\n\
  \n    为本地主机构造一个 `InetAddress`。\n*   `byte[] getAddress()`\n\n    返回一个包含数值地址的字节数组。\n\
  *   `String getHostAddress()`\n\n    返回一个用点分隔的十进制数字字符串，例如 `\"129.6.15.28\"`。\n*\
  \   `String getHostName()`\n\n    返回主机名。\n\n### 4.2. 实现服务器\n\n现在我们已经实现了一个从 Internet\
  \ 接收数据的基本网络客户端，让我们编写一个可以向客户端发送信息的简单服务器。\n\n### 4.2.1. 服务器套接字 (ServerSocket)\n\n\
  服务器程序启动时会等待客户端连接到其端口。对于我们的示例程序，我们选择了端口号 8189，它没有被任何标准服务使用。`ServerSocket` 类建立了一个套接字。在我们的情况下，命令\n\
  \n```\nvar s = new ServerSocket(8189);\n```\n\n建立了一个监控 8189 端口的服务器。\n\n```\nSocket\
  \ incoming = s.accept();\n```\n\n告诉程序无限期等待，直到客户端连接到该端口。一旦有人通过网络发送正确的请求连接到该端口，此方法将返回一个表示所建立连接的\
  \ `Socket` 对象。你可以使用该对象来获取输入输出流，如下代码所示：\n\n```\nInputStream inStream = incoming.getInputStream();\n\
  OutputStream outStream = incoming.getOutputStream();\n```\n\n服务器发送到服务器输出流的所有内容都成为客户端程序的输入，而客户端程序的所有输出都进入服务器的输入流中。\n\
  \n在本章的所有示例中，我们都通过套接字传输文本。因此，我们将流转换为扫描器（Scanner）和写入器（Writer）。\n\n```\nvar in = new\
  \ Scanner(inStream);\nvar out = new PrintWriter(new OutputStreamWriter(outStream),\
  \ true /* autoFlush */);\n```\n\n给客户端发送一个问候吧：\n\n```\nout.println(\"Hello!\");\n\
  ```\n\n\n\n等待连接。此方法会阻塞（即空闲）当前线程，直到连接建立。该方法返回一个 `Socket` 对象，程序可以通过该对象与连接的客户端进行通信。\n\
  \n*   `void close()`\n\n关闭服务器套接字。\n\n### 4.2.2 服务多个客户端\n\n前一个示例中的简单服务器存在一个问题。假设我们允许多个客户端同时连接到我们的服务器。通常，服务器持续运行在服务器计算机上，来自互联网各处的客户端可能想同时使用它。如果没有对多连接的支持，任何客户端都可能通过长时间连接来垄断服务。通过线程的魔力，我们可以做得得多。\n\
  \n每当我们知道程序已经建立了一个新的 socket 连接时——也就是说，每当调用 `accept()` 返回一个 socket 时，我们都会启动一个新的线程来处理服务器与*该*客户端之间的连接。主程序将返回并等待下一个连接。它会一直运行下去，直到服务器进程被杀死：\n\
  \n```java\nExecutorService service = Executors.newVirtualThreadPerTaskExecutor();\n\
  while (true) {\n    Socket incoming = s.accept();\n    service.submit(() -> serve(incoming));\n\
  }\n```\n\n`serve` 方法包含了与客户端通信的循环：\n\n```java\npublic void serve(Socket incoming)\
  \ {\n    try (var in = new Scanner(incoming.getInputStream());\n            var\
  \ out = new PrintWriter(incoming.getOutputStream(),\n            true /* autoFlush\
  \ */)) {\n        // 输入并发送响应\n    }\n    catch (IOException e) {\n       // 处理异常\n\
  \    }\n}\n```\n\n当每个连接都启动一个新线程时，多个客户端可以同时连接到服务器。你可以轻松检查这一点。\n\n1.  编译并运行服务器程序（列表\
  \ 4.4）。\n2.  像图 4.5 所示打开几个 telnet 窗口。\n3.  在窗口之间切换并输入命令。注意，你可以同时通过所有窗口进行通信。\n4.\
  \  完成后，切换到启动服务器程序的窗口并按 Ctrl+C 将其杀死。\n\n![Figure](img/fig03-05_alt.jpg)图 4.5: 多个同时通信的\
  \ telnet 窗口 列表 4.4 v2ch04/threaded/EchoServer.java\n\n```java\npackage v2ch04.threaded;\n\
  \nimport module java.base;\n\n/**\n * 此程序实现了一个多线程服务器，监听端口 8189 并回显所有\n * 客户端输入。\n\
  \ */\nclass EchoServer {\n    void main() throws Exception {\n        try (var s\
  \ = new ServerSocket(8189)) {\n            int i = 1;\n            ExecutorService\
  \ service = Executors.newVirtualThreadPerTaskExecutor();\n\n            while (true)\
  \ {\n                Socket incoming = s.accept();\n                IO.println(\"\
  Spawning \" + i);\n                service.submit(() -> serve(incoming));\n    \
  \            i++;\n            }\n        }\n    }\n\n    void serve(Socket incoming)\
  \ {\n        try (var in = new Scanner(incoming.getInputStream());\n           \
  \     var out = new PrintWriter(incoming.getOutputStream(), true /* autoFlush */))\
  \ {\n            out.println(\"Hello! Enter BYE to exit.\");\n\n            // 回显客户端输入\n\
  \            boolean done = false;\n            while (!done && in.hasNextLine())\
  \ {\n                String line = in.nextLine();\n                out.println(\"\
  Echo: \" + line);\n                if (line.strip().equals(\"BYE\")) done = true;\n\
  \            }\n        }\n        catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n### 4.2.3 半关闭\n\n半关闭（Half-Close）允许套接字连接的一端终止其输出，同时仍接收另一端的数据。\n\
  \n这是一个典型的情况。假设你向服务器传输数据，但起初并不知道有多少数据。对于文件，你只需要在数据结束时关闭文件即可。然而，如果你关闭了套接字，你将立即与服务器断开且无法读取响应。\n\
  \n半关闭解决了这个问题。你可以关闭套接字的输出流，从而向服务器指示请求数据的已结束，但保持输入流打开。\n\n客户端端看起来如下：\n\n```java\n\
  try (var socket = new Socket(host, port)) {\n    var in = new Scanner(socket.getInputStream());\n\
  \    var writer = new PrintWriter(socket.getOutputStream());\n    // 发送请求数据\n  \
  \  writer.print(. . .);\n    writer.flush();\n    socket.shutdownOutput();\n   \
  \ // 现在套接字处于半关闭状态\n    // 读取响应数据\n    while (in.hasNextLine()) {\n        String\
  \ line = in.nextLine();\n        . . .\n    }\n}\n```\n\n服务器端只需读取输入直到到达输入流末尾。然后发送响应。\n\
  \n当然，这种协议仅适用于一次性服务，例如 HTTP，其中客户端连接、发布请求、捕获响应然后断开连接。\n\n`java.net.Socket` 1.0\n\n\
  *   `void shutdownInput()`1.3\n*   `void shutdownOutput()`1.3\n\n将输入或输出流设置为“流末端”。\n\
  \n*   `boolean isInputShutdown()`1.4\n*   `boolean isOutputShutdown()`1.4\n\n如果输入或输出已关闭，则返回\
  \ `true`。\n\n### 4.2.4 可中断的套接字\n\n当你连接到套接字时，当前线程会阻塞直到连接建立。同样，当你通过套接字读取数据时，当前线程会阻塞直到操作成功或超时。（写入数据没有超时限制。）\n\
  \n在交互式应用程序中，你希望给用户提供一个选项，简单地取消一个没有产生结果的套接字连接。然而，如果平台线程阻塞在一个无响应的套接字上，你无法通过调用 `interrupt`\
  \ 来解除阻塞。\n\n当使用虚拟线程时，套接字操作是可以中断的，你不需要本节讨论的技术。\n\n要中断套接字操作，请使用 `java.nio` 包中的功能 `SocketChannel`。如下打开\
  \ `SocketChannel`：\n\n```java\nSocketChannel channel = SocketChannel.open(new InetSocketAddress(host,\
  \ port));\n```\n\n通道没有关联的流。相反，它有使用 `Buffer` 对象的 `read` 和 `write` 方法。（关于 NIO 区的更多信息请参见第\
  \ 2 章）。这些方法声明在接口 `ReadableByteChannel` 和 `WritableByteChannel` 中。\n\n如果你不想处理缓冲区，可以使用\
  \ `Scanner` 类进行读取，因为 `Scanner` 有一个带有 `ReadableByteChannel` 参数的构造函数：\n\n```java\n\
  var in = new Scanner(channel);\n```\n\n要将通道转换为输出流，使用静态方法 `Channels.newOutputStream`。\n\
  \n```java\nOutputStream outStream = Channels.newOutputStream(channel);\n```\n\n\
  这就是你需要做的一切。每当线程在打开、读取或写入操作期间被中断时，操作不会阻塞，而是以异常终止。\n\n列表 4.5 中的程序对比了可中断和阻塞的套接字。服务器发送数字并在第十个数字后假装卡住。被询问想使用套接字还是通道。你也可以在平台线程和虚拟线程之间选择。启动了一个客户端线程连接到服务器并打印输出。按回车中断客户端线程。如果你在前十个数字内这样做，你就可以中断线程。\n\
  \n然而，如果你使用套接字和平台线程，在前十个数字之后中断将不起作用。阻塞线程会一直阻塞直到服务器最终关闭连接。补救措施是使用通道或虚拟线程。\n\n列表 4.5\
  \ v2ch04/interruptible/InterruptibleSocketDemo.java\n\n\n\n\n```java\npackage v2ch04.interruptible;\n\
  \nimport module java.base;\n\n/**\n * This program shows how to interrupt a socket\
  \ channel.\n */\nclass InterruptibleSocketDemo {\n    void main() {\n        Thread.ofPlatform().start(new\
  \ TestServer());\n        boolean socket = IO.readln(\"Socket or channel? (S/C)\
  \ \").equalsIgnoreCase(\"S\");\n        boolean platform = IO.readln(\"Platform\
  \ or virtual? (P/V) \").equalsIgnoreCase(\"P\");\n        Runnable client = socket\
  \ ? this::useSocket : this::useChannel;\n        Thread clientThread = platform\
  \ ? Thread.ofPlatform().start(client)\n                : Thread.ofVirtual().start(client);\n\
  \n        IO.readln(\"Hit Enter to interrupt client\");\n        clientThread.interrupt();\n\
  \    }\n\n    /**\n     * Connect to the test server, using a channel.\n     */\n\
  \    void useChannel() {\n        IO.println(\"Channel:\\n\");\n        try (SocketChannel\
  \ channel = SocketChannel\n                .open(new InetSocketAddress(\"localhost\"\
  , 8189));\n                Scanner in = new Scanner(channel)) {            \n  \
  \          while (!Thread.currentThread().isInterrupted()) {\n                IO.print(\"\
  Reading \");\n                if (in.hasNextLine()) {\n                    String\
  \ line = in.nextLine();\n                    IO.println(line);\n               \
  \ }\n            }\n        }\n        catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n        finally {\n            IO.println(\"Channel closed\\n\");\n\
  \        }\n    }\n\n    /**\n     * Connect to the test server, using a socket.\n\
  \     */\n    void useSocket() {\n        IO.println(\"Socket:\\n\");\n        try\
  \ (var sock = new Socket(\"localhost\", 8189); \n                Scanner in = new\
  \ Scanner(sock.getInputStream())) {\n            while (!Thread.currentThread().isInterrupted())\
  \ {\n                IO.print(\"Reading \");\n                if (in.hasNextLine())\
  \ {\n                    String line = in.nextLine();\n                    IO.println(line);\n\
  \                }\n            }\n        }\n        catch (IOException e) {\n\
  \            e.printStackTrace();\n        }\n        finally {\n            IO.println(\"\
  Socket closed\\n\");\n        }\n    }\n\n    /**\n     * A server that listens\
  \ to port 8189 and sends numbers to the client, simulating a hanging\n     * server\
  \ after 10 numbers.\n     */\n    static class TestServer implements Runnable {\n\
  \        public void run() {\n            try (var s = new ServerSocket(8189); Socket\
  \ incoming = s.accept()) {\n                serve(incoming);\n            }\n  \
  \          catch (Exception e) {\n                e.printStackTrace();\n       \
  \         ;\n            }\n            finally {\n                IO.println(\"\
  Closing connection\\n\");\n            }\n        }\n\n        private void serve(Socket\
  \ incoming) throws IOException, InterruptedException {\n            int counter\
  \ = 0;\n            try (var out = new PrintWriter(incoming.getOutputStream(), true\
  \ /* autoFlush */)) {\n                while (counter < 100) {\n               \
  \     counter++;\n                    if (counter <= 10) out.println(counter);\n\
  \                    Thread.sleep(100);\n                }\n            }\n    \
  \    }\n    }\n}\n```\n\n`java.net.InetSocketAddress` 1.4\n\n* `InetSocketAddress(String\
  \ hostname, int port)`\n  使用给定的主机名和端口构造地址对象，并在构造期间解析主机名。如果无法解析主机名，则地址对象的 `unresolved`\
  \ 属性被设置为 `true`。\n* `boolean isUnresolved()`\n  如果此地址对象无法解析，则返回 `true`。\n\n`java.nio.channels.SocketChannel`\
  \ 1.4\n\n* `static SocketChannel open(SocketAddress address)`\n  打开套接字通道并连接到远程地址。\n\
  \n`java.nio.channels.Channels` 1.4\n\n* `static InputStream newInputStream(ReadableByteChannel\
  \ channel)`\n  构造一个从给定通道读取的输入流。\n* `static OutputStream newOutputStream(WritableByteChannel\
  \ channel)`\n  构造一个向给定通道写入的输出流。\n\n### 4.2.5 安全套接字通信\n\n当你跨越互联网实现客户端和服务并交换机密信息时，你不希望使用明文流量。相反，你应该使用安全的通信机制。安全通信包含以下三个方面：\n\
  \n* 通信是加密的，因此第三方无法读取。\n* 服务器的身份通过数字签名进行认证，并由客户端进行验证。可选地，客户端也可以提供数字签名，但这在 Web 应用中并不常见。\n\
  * 传输的数据由发送者进行数字签名并由接收者进行验证，保证没有第三方修改或替换数据。\n\n`TLS`（传输层安全性）协议是最常用的安全通信机制。它是 `SSL`（安全套接字层）协议的继任者。\n\
  \n在 Java 中，你使用 `javax.net.ssl` 包中的类来建立安全连接。以下是如何构造用于安全连接的套接字：\n\n```java\nSocketFactory\
  \ factory = SSLSocketFactory.getDefault();\nSocket s = factory.createSocket(host,\
  \ port);\n```\n\n对于安全的服务器套接字，你也使用了工厂：\n\n```java\nServerSocketFactory factory =\
  \ SSLServerSocketFactory.getDefault();\nServerSocket s = factory.createServerSocket(port);\n\
  ```\n\n如果你需要配置客户端或服务器套接字的安全连接参数，可以将工厂返回的对象强制转换为 `SSLSocket` 或 `SSLServerSocket`：\n\
  \n```java\n((SSLServerSocket) s).setClientAuth(true);\n```\n\n客户端和服务器套接字使用共享加密密钥加密流量。然而，它们需要知道自己是在与对方通信，而不是与“中间人”。服务器呈现一个证书以证明其真实性。该证书需要由客户端已知的证书颁发机构签名。通常，你会从这些机构获取服务器证书并将其安装到服务器中。然而，为了测试，我们将生成自己的证书。\n\
  \n参见第 9 章 关于证书和管理它们的 `keytool` 程序的详细描述。这里是生成证书并将其放入“密钥库”的命令。\n\n首先，生成服务器证书：\n\n\
  ```bash\nkeytool -genkeypair -alias servercert -keyalg RSA -keysize 2048 -sigalg\
  \ SHA256withRSA \\\n    -keystore server.jks -storepass secret -ext san=ip:127.0.0.1\n\
  ```\n\n你会遇到关于服务器组织的问题。对于演示，你可以将它们都留为默认值“unknown”。\n\n接下来，导出证书并将其导入客户端：\n\n```bash\n\
  keytool -exportcert -keystore server.jks -storepass secret -alias servercert -rfc\
  \ \\\n    -file servercert.pem\nkeytool -import -trustcacerts -file servercert.pem\
  \ -keystore client.jks \\\n    -storepass secret -keypass secret\n```\n\n在导入未由已知证书颁发机构签名的证书时，会询问你是否信任它。回答\
  \ `yes`。\n\n现在启动服务器。你需要指定包含服务器证书的密钥库。\n\n```bash\njava -Djavax.net.ssl.keyStore=server.jks\
  \ -Djavax.net.ssl.keyStorePassword=secret \\\n    v2ch04.ssl.EchoServer\n```\n\n\
  然后运行客户端，指定客户端信任的证书所在的密钥库。如果证书是由 JDK 已知的证书颁发机构签名的，这将是不必要的。\n\n```bash\njava -Djavax.net.ssl.trustStore=client.jks\
  \ -Djavax.net.ssl.trustStorePassword=secret \\\n    v2ch04.ssl.EchoClient\n```\n\
  \n如果出现连接问题，尝试使用 `-Djavax.net.debug=ssl` 命令行选项运行客户端。\n\n列表 4.6 v2ch04/ssl/EchoClient.java\n\
  \n\n\n\n```java\npackage v2ch04.ssl;\n\nimport module java.base;\n\n/**\n * 此程序通过\
  \ SSL 连接到服务器并回显服务器响应.\n */\nclass EchoClient {\n    void main(String[] args) throws\
  \ Exception {\n        int port = args.length >= 1 ? Integer.parseInt(args[0]) :\
  \ 8189;\n        SocketFactory factory = SSLSocketFactory.getDefault();\n      \
  \  String message = \"\"\"\nHello\nWorld\nBYE\n\"\"\";\n        try (Socket s =\
  \ factory.createSocket(InetAddress.getLocalHost(), port);\n                OutputStream\
  \ os = s.getOutputStream();\n                var in = new Scanner(s.getInputStream()))\
  \ {\n            os.write(message.getBytes());\n            os.flush();\n      \
  \      boolean done = false;\n            while (!done) {\n                String\
  \ line = in.nextLine();\n                System.out.println(line);\n           \
  \     if (line.equals(\"Echo: BYE\")) done = true;\n            }\n        }\n \
  \   }\n}\n```\n\n列表 4.7 `v2ch04/ssl/EchoServer.java`\n\n```java\npackage v2ch04.ssl;\n\
  \nimport module java.base;\n\n/**\n * 此程序实现了一个简单的服务器，监听 8189 端口 \n * 或作为参数提供的端口，并回显所有客户端输入.\n\
  \ */\nclass EchoServer {\n    void main(String[] args) throws Exception {\n    \
  \    int port = args.length >= 1 ? Integer.parseInt(args[0]) : 8189;\n        //\
  \ 建立服务器 socket\n        ServerSocketFactory factory = SSLServerSocketFactory.getDefault();\n\
  \        try (ServerSocket s = factory.createServerSocket(port)) {\n           \
  \ ExecutorService service = Executors.newVirtualThreadPerTaskExecutor();\n\n   \
  \         while (true) {\n                // 等待客户端连接\n                Socket incoming\
  \ = s.accept();\n                service.submit(() -> serve(incoming));\n      \
  \      }\n        }\n    }\n\n    void serve(Socket incoming) {\n        try (var\
  \ in = new Scanner(incoming.getInputStream());\n             var out = new PrintWriter(incoming.getOutputStream(),\n\
  \                     true /* autoFlush */)) {\n            out.println(\"Hello!\
  \ Enter BYE to exit.\");\n\n            // 回显客户端输入\n            boolean done = false;\n\
  \            while (!done && in.hasNextLine()) {\n                String line =\
  \ in.nextLine();\n                out.println(\"Echo: \" + line);\n            \
  \    if (line.strip().equals(\"BYE\"))\n                    done = true;\n     \
  \       }\n        }\n        catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n`javax.net.ServerSocketFactory`1.4\n\n*   `static ServerSocket\
  \ createServerSocket(int port)`\n\n    产生一个给定端口的服务器 socket。\n\n`javax.net.ssl.SSLServerSocketFactory`1.4\n\
  \n*   `static ServerSocketFactory getDefault()`\n\n    返回一个产生 `SSLServerSocket`\
  \ 实例的工厂。\n\n`javax.net.ssl.SSLSocketFactory`1.4\n\n*   `static SocketFactory getDefault()`\n\
  \n    返回一个产生 `SSLSocket` 实例的工厂。\n\n`javax.net.SocketFactory`1.4\n\n*   `static Socket\
  \ createSocket(InetAddress host, int port)`\n*   `static Socket createSocket(String\
  \ host, int port)`\n\n    产生一个连接到给定主机和端口的 socket。\n\n## 4.3. 获取网络数据\n\n在 Java 程序中访问网络服务器，你可能希望在\
  \ socket 连接和 HTTP 请求更高的层次上工作。在接下来的章节中，我们将讨论 Java 库为此目的提供的类。\n\n### 4.3.1. URLs 和\
  \ URIs\n\n`java.net` 包在 `URLs`（统一资源定位符）和 `URIs`（统一资源标识符）之间做了非常有用的区分。\n\n`URI` 是一个纯粹的语法结构，包含了用于指定网络资源的字符串的各个部分。`URL`\
  \ 是一种特殊的 `URI`，即具有足够信息来定位资源的 `URI`。其他的 `URIs`，例如\n\n```\nmailto:cay@horstmann.com\n\
  ```\n\n并不是定位符——从这个标识符中没有数据可以进行定位。此类种的 `URI` 被称为 `URN`（统一资源名）。\n\n在 Java 库中，`URI`\
  \ 类没有访问该标识符所指定资源的方法——它的唯一用途是解析。相比之下，`URL` 类可以打开一个通往资源的流。由于这个原因，`URL` 类仅适用于 Java\
  \ 库知道如何处理的方案，例如 `http:`、`https:`、`ftp:`、本地文件系统（`file:`）和 JAR 文件（`jar:`）。\n\n你可以从\
  \ `URI` 构造一个 `URL` 对象：\n\n```\nvar url = new URI(urlString).toURL();\n```\n\n`URL`\
  \ 构造函数在 Java 20 中被弃用了。它们有各种技术问题，导致可能构造出无效的 URL。相反，先构造一个 `URI`，然后获取 `URL`，如所示。\n\n\
  如果你只是想获取资源的内容，使用 `URL` 类的 `openStream` 方法。该方法产生一个 `InputStream` 对象。按通常的方式使用它——例如，构造一个\
  \ `Scanner`：\n\n```\nInputStream inStream = url.openStream();\nvar in = new Scanner(inStream);\n\
  ```\n\n在下一节中，你将看到如何使用 `URLConnection` 类对连接进行更多控制。\n\n让我们回到 `URIs`。为了理解为什么解析并非易事，请考虑\
  \ `URIs` 可能有多复杂。例如，\n\n```\nmailto:cay@horstmann.com\n```\n\n并不是定位符——从这个标识符中没有数据可以进行定位。此类种的\
  \ `URI` 被称为 `URN`（统一资源名）。\n\n在 Java 库中，`URI` 类没有访问该标识符所指定资源的方法——它的唯一用途是解析。相比之下，`URL`\
  \ 类可以打开一个通往资源的流。由于这个原因，`URL` 类仅适用于 Java 库知道如何处理的方案，例如 `http:`、`https:`、`ftp:`、本地文件系统（`file:`）和\
  \ JAR 文件（`jar:`）。\n\n你可以从 `URI` 构造一个 `URL` 对象：\n\n```\nvar url = new URI(urlString).toURL();\n\
  ```\n\n`URL` 构造函数在 Java 20 中被弃用了。它们有各种技术问题，导致可能构造出无效的 URL。相反，先构造一个 `URI`，然后获取 `URL`，如所示。\n\
  \n如果你只是想获取资源的内容，使用 `URL` 类的 `openStream` 方法。该方法产生一个 `InputStream` 对象。按通常的方式使用它——例如，构造一个\
  \ `Scanner`：\n\n```\nInputStream inStream = url.openStream();\nvar in = new Scanner(inStream);\n\
  ```\n\n在下一节中，你将看到如何使用 `URLConnection` 类对连接进行更多控制。\n\n\n\n\n\n```\nsetDoInput\nsetDoOutput\n\
  setIfModifiedSince\nsetUseCaches\nsetAllowUserInteraction\nsetRequestProperty\n\
  setConnectTimeout\nsetReadTimeout\n```\n\n我们将在本节稍后的部分以及 API 注意事项中讨论这些方法。\n\n###\
  \ 3. 调用 `connect` 方法连接到远程资源：\n\n```\nconnection.connect();\n```\n\n除了与服务器建立 socket\
  \ 连接外，该方法还会查询服务器的头部信息。\n\n### 4. 连接到服务器后，你可以查询头部信息。通过 `getHeaderFieldKey` 和 `getHeaderField`\
  \ 两个方法可以列出所有的头部字段。`getHeaderFields` 方法获取一个包含所有头部字段的标准 `Map` 对象。为了方便起见，以下方法查询了标准字段：\n\
  \n```\ngetContentType\ngetContentLength\ngetContentEncoding\ngetDate\ngetExpiration\n\
  getLastModified\n```\n\n### 5. 最后，你可以访问资源数据。使用 `getInputStream` 方法获取一个用于读取信息的输入流。（这与\
  \ `URL` 类的 `openStream` 方法返回的输入流相同）。另一个方法 `getContent` 在实践中并不实用。对于 `text/plain`\
  \ 和 `image/gif` 等标准内容类型返回的对象需要 `com.sun` 层次结构中的类进行处理。你可以注册自己的内容处理器，但我们书中书中书中讨论这种技术。\n\
  \n一些程序员在在使用 `URLConnection` 类时会产生一种错误的心理认知，认为 `getInputStream` 和 `getOutputStream`\
  \ 方法与 `Socket` 类的方法相似。但事实并非如此。`URLConnection` 类在后台做了很多“魔术”工作——特别是对请求和响应头部的处理。因此，遵循连接的设置步骤是非常关重要的。\n\
  \n现在让我们详细查看一些 `URLConnection` 方法。有几个方法在连接到服务器之前设置连接的属性。最重要的方法是 `setDoInput` 和 `setDoOutput`。默认情况下，连接提供一个用于从服务器读取的输入流，但没有用于写入的输出流。如果你需要一个输出流（例如为了向\
  \ Web 服务器发布数据），你需要调用：\n\n```\nconnection.setDoOutput(true);\n```\n\n接下来，你可能想要设置一些请求头部。请求头部会随请求命令一起发送到服务器。这里是一个示例：\n\
  \n```\nGET www.server.com/index.html HTTP/1.0\nReferer: https://www.somewhere.com/links.html\n\
  Proxy-Connection: Keep-Alive\nUser-Agent: Mozilla/5.0 (X11; U; Linux i686; en-US;\
  \ rv:1.8.1.4)\nHost: www.server.com\nAccept: text/html, image/gif, image/jpeg, image/png,\
  \ */*\nAccept-Language: en\nAccept-Charset: iso-8859-1,*,utf-8\nCookie: orangemilano=19221888782198\n\
  ```\n\n`setIfModifiedSince` 方法告诉连接你只对自某个日期以来修改的数据感兴趣。\n\n最后，你可以使用通用的 `setRequestProperty`\
  \ 方法设置对特定协议有意义的任何键/值对。关于 HTTP 请求头部的格式，请参考 RFC 2616。这些属性中的某些没有良好的文档记录，是在程序员之间口口相传的。例如，如果你想访问受密码保护的网页，你必须执行以下操作：\n\
  \n1. 将用户名、冒号和密码拼接起来。\n\n```\nString input = username + \":\" + password;\n```\n\n\
  2. 计算结果字符串的 Base64 编码。（Base64 编码将字节序列编码为可打印的 ASCII 字符序列。）\n\n```\nBase64.Encoder\
  \ encoder = Base64.getEncoder();\nString encoding = encoder.encodeToString(input.getBytes());\n\
  ```\n\n3. 调用 `setRequestProperty` 方法，名称为 `\"Authorization\"`，值为 `\"Basic \" + encoding`。\n\
  \n```\nconnection.setRequestProperty(\"Authorization\", \"Basic \" + encoding);\n\
  ```\n\n你刚刚看到了如何访问受密码保护的网页。若要通过 FTP 访问受密码保护的文件，则使用完全不同的方法：构建格式如下的 URL：\n\n```\nftp://username:password@ftp.yourserver.com/pub/file.txt\n\
  ```\n\n一旦你调用了 `connect` 方法，就可以查询响应头部信息。首先，让我们看看如何列出所有的响应头部字段。该类的实现者认为有必要通过引入另一种迭代协议来表达他们的个性。调用：\n\
  \n```\nString key = connection.getHeaderFieldKey(n);\n```\n\n可以获取响应头部的第 `n` 个键，其中\
  \ `n` 从 `1` 开始！如果 `n` 小于 1 或大于头部字段的总数，则返回 `null`。没有方法可以返回字段的数量；你只需不断调用 `getHeaderFieldKey`\
  \ 直到获取 `null`。同样地，调用：\n\n```\nString value = connection.getHeaderField(n);\n```\n\
  \n返回第 `n` 个值。\n\n`getHeaderFields` 方法返回响应头部字段的 `Map`。\n\n```\nMap<String,List<String>>\
  \ headerFields = connection.getHeaderFields();\n```\n\n这里是一组典型 HTTP 请求的响应头部字段：\n\
  \n```\nDate: Wed, 27 Aug 2008 00:15:48 GMT\nServer: Apache/2.2.2 (Unix)\nLast-Modified:\
  \ Sun, 22 Jun 2008 20:53:38 GMT\nAccept-Ranges: bytes\nContent-Length: 4813\nConnection:\
  \ close\nContent-Type: text/html\n```\n\n尽管 `connection.getHeaderFieldKey(0)` 返回\
  \ `null`，但你可以调用 `connection.getHeaderField(0)` 来获取状态行（例如 `\"HTTP/1.1 200 OK\"`）。当你调用\
  \ `headerFields.get(null)` 时也会得到它。\n\n为了方便起见，有六个方法查询常见头部类型的值并在适当时转换为数值类型。表 4.1 显示了这些方便方法。返回类型为\
  \ `long`的方法返回自 1970 年 1 月 1 日 GMT 以来的秒数。\n\n表 4.1：头部值的方便方法\n\n| 键名称 | 方法名称 | 返回类型\
  \ |\n| --- | --- | --- |\n| `Date` | `getDate` | `long` |\n| `Expires` | `getExpiration`\
  \ | `long` |\n| `Last-Modified` | `getLastModified` | `long` |\n| `Content-Length`\
  \ | `getContentLength` | `int` |\n| `Content-Type` | `getContentType` | `String`\
  \ |\n| `Content-Encoding` | `getContentEncoding` | `String` |\n\n列表 4.8 中的程序让你对\
  \ URL 连接进行实验。在运行程序时，在命令行提供一个 URL 以及可选的用户名和密码，例如：\n\n```\njava urlConnection.URLConnectionDemo\
  \ https://horstmann.com/corejava/secret user password\n```\n\n该程序打印：\n\n* 所有头部的键和值\n\
  * 表 4.1 中六个方便方法的返回值\n* 请求资源的前十行\n\n 列表 4.8 v2ch04/urlConnection/URLConnectionDemo.java\n\
  \n\n\n\n\n```java\npackage v2ch04.urlConnection;\n\nimport module java.base;\n\n\
  /**\n * 此程序连接到 URL 并显示响应头头数据以及请求数据的\n * 前 10 行。\n * \n * 在命令行上提供 URL 以及可选的用户名和密码（用于\
  \ HTTP 基础认证）。\n */\nclass URLConnectionDemo {\n    void main(String[] args) throws\
  \ Exception {\n        String urlName = args.length > 0 ? args[0] : \"http://horstmann.com\"\
  ;\n\n        var url = new URI(urlName).toURL();\n        URLConnection connection\
  \ = url.openConnection();\n\n        // 如果在命令行上指定，则设置用户名和密码\n\n        if (args.length\
  \ > 2) {\n            String username = args[1];\n            String password =\
  \ args[2];\n            String input = username + \":\" + password;\n          \
  \  Base64.Encoder encoder = Base64.getEncoder();\n            String encoding =\
  \ encoder.encodeToString(input.getBytes());\n            connection.setRequestProperty(\"\
  Authorization\", \"Basic \" + encoding);\n        }\n\n        connection.connect();\n\
  \n        // 打印头部字段\n\n        Map<String, List<String>> headers = connection.getHeaderFields();\n\
  \        for (Map.Entry<String, List<String>> entry : headers.entrySet()) {\n  \
  \          String key = entry.getKey();\n            for (String value : entry.getValue())\n\
  \                IO.println(key + \": \" + value);\n        }\n\n        // 打印便利函数\n\
  \n        IO.println(\"----------\");\n        IO.println(\"getContentType: \" +\
  \ connection.getContentType());\n        IO.println(\"getContentLength: \" + connection.getContentLength());\n\
  \        IO.println(\"getContentEncoding: \" + connection.getContentEncoding());\n\
  \        IO.println(\"getDate: \" + connection.getDate());\n        IO.println(\"\
  getExpiration: \" + connection.getExpiration());\n        IO.println(\"getLastModifed:\
  \ \" + connection.getLastModified());\n        IO.println(\"----------\");\n\n \
  \       String encoding = connection.getContentEncoding();\n        if (encoding\
  \ == null) encoding = \"UTF-8\";\n        try (var in = new Scanner(connection.getInputStream(),\
  \ encoding)) {\n            // 打印内容的前十行\n\n            for (int n = 1; in.hasNextLine()\
  \ && n <= 10; n++)\n                IO.println(in.nextLine());\n            if (in.hasNextLine())\
  \ IO.println(\". . .\");\n        }\n    }\n}\n```\n\n### `java.net.URL` 1.0\n\n\
  * `InputStream openStream()`\n  打开一个输入流以读取资源数据。\n* `URLConnection openConnection()`\n\
  \  返回一个管理与资源连接的 `URLConnection` 对象。\n\n### `java.net.URLConnection` 1.0\n\n* `void\
  \ setDoInput(boolean doInput)`\n* `boolean getDoInput()`\n  如果 `doInput` 为 `true`，用户可以从此\
  \ `URLConnection` 接收输入。\n* `void setDoOutput(boolean doOutput)`\n* `boolean getDoOutput()`\n\
  \  如果 `doOutput` 为 `true`，用户可以向此 `URLConnection` 发送输出。\n* `void setIfModifiedSince(long\
  \ time)`\n* `long getIfModifiedSince()`\n  `ifModifiedSince` 属性此 `URLConnection`\
  \ 仅获取自给定时间以来修改的数据。时间是以自 GMT 1970 年 1 月 1 日午夜以来的秒数。\n* `void setConnectTimeout(int\
  \ timeout)` 5.0\n* `int getConnectTimeout()` 5.0\n  设置或获取连接超时时间（毫秒）。如果在建立连接之前已超时，则关联输入流的\
  \ `connect` 方法将抛出 `SocketTimeoutException`。\n* `void setReadTimeout(int timeout)`\
  \ 5.0\n* `int getReadTimeout()` 5.0\n  设置或获取读取数据的超时时间（毫秒）。如果在读取操作成功之前已超时，则 `read`\
  \ 方法将抛出 `SocketTimeoutException`。\n* `void setRequestProperty(String key, String\
  \ value)`\n  设置请求头字段。\n* `Map<String,List<String>> getRequestProperties()` 1.4\n\
  \  返回请求属性的映射。相同键的所有值都存放在列表中。\n* `void connect()`\n  连接到远程资源并检索响应头信息。\n* `Map<String,List<String>>\
  \ getHeaderFields()` 1.4\n  返回响应头的映射。相同键的所有值都存放在列表中。\n* `String getHeaderFieldKey(int\
  \ n)`\n  获取第 `n` 个响应头字段的键，如果 `n` ≤`0` 或大于响应头字段数量，则返回 `null`。\n* `String getHeaderField(int\
  \ n)`\n  获取第 `n` 个响应头字段的值，如果 `n` 为 0，则返回响应状态行；如果 `n` <`0` 或大于响应头字段数量，则返回 `null`。\n\
  * `int getContentLength()`\n  可用时获取内容长度，未知则返回 `-1`。\n* `String getContentType()`\n\
  \  获取内容类型，例如 `text/plain` 或 `image/gif`。\n* `String getContentEncoding()`\n  获取内容编码，例如\
  \ `gzip`。此值并不常用，因为默认的 `identity` 编码不应在 `Content-Encoding` 头部中指定。\n* `long getDate()`\n\
  * `long getExpiration()`\n* `long getLastModified()`\n  获取日期、过期时间和最后修改时间。日期是以自 GMT\
  \ 1970 年 1 月 1 日午夜以来的秒数。\n* `InputStream getInputStream()`\n* `OutputStream getOutputStream()`\n\
  \  返回用于从读取或写入资源的流。\n* `Object getContent()`\n  选择适当的内容处理器读取资源并转换为对象。对于 `text/plain`\
  \ 或 `image/gif` 标准类型，除非你安装了自己的内容处理器，否则此方法不可用。\n\n### 4.3.3 表单数据\n\n在前面的节中，你看到了如何从\
  \ Web 服务器读取数据。现在我们将展示你的程序如何向服务器发送数据。\n\n为了从 Web 浏览器向服务器发送信息，用户填写一个*表单*，如图 4.6 4.6:\
  \ HTML 表单\n\n当用户点击提交按钮时，文本框中的内容以及框、单选按钮和其他元素的设置将发送回服务器。服务器处理提交的值。\n\n然后产生另一个 HTML\
  \ 页面并发送回浏览器。这一序列如图 [4.7](#index.xhtml_ch0310）所示。\n\n.4.7: 表单执行期间的数据流\n\n\n\n\n\n\
  在本文写作时，Google Maps 网站 ([`www.google.com/maps`](https://www.google.com/maps)) 接受名为\
  \ `q` 和 `hl` 的查询参数，其值对应于位置查询和响应的人类语言。要获取位于旧金山 1 Market Street 的地图且响应语言为德语，请使用以下\
  \ URL：\n\n```\nhttps://www.google.com/maps?q=1+Market+Street+San+Francisco&hl=de\n\
  ```\n\n非常长的查询字符串在浏览器中看起来可能并不美观，而且旧的浏览器和代理对 `GET` 请求中包含的字符数量有限制。因此，对于包含大量数据的表单通常使用\
  \ `POST` 请求。在 `POST` 请求中，你不需要将参数附加到 URL 上；而是从 `URLConnection` 获取一个输出流，并向该输出流写入键名/值对。你仍然需要对值进行\
  \ URL 编码，并用 `&` 字符将它们分隔。\n\n让我们详细查看这一过程。要向服务器端程序发布数据，首先建立一个 `URLConnection`：\n\n\
  ```\nURL url = new URI(\"https://host/path\").toURL();\nURLConnection connection\
  \ = url.openConnection();\n```\n\n然后，调用 `setDoOutput` 方法为输出设置连接：\n\n```\nconnection.setDoOutput(true);\n\
  ```\n\n接下来，调用 `getOutputStream` 获取一个你可以通过该流向服务器发送数据的流。如果你正在向服务器发送文本，将该流封装进 `PrintWriter`\
  \ 会非常方便。\n\n```java\nvar out = new PrintWriter(connection.getOutputStream());\n\
  ```\n\n现在你已经准备好向服务器发送数据了：\n\n```\nout.print(name1 + \"=\" + URLEncoder.encode(value1,\
  \ StandardCharsets.UTF_8) + \"&\");\nout.print(name2 + \"=\" + URLEncoder.encode(value2,\
  \ StandardCharsets.UTF_8));\n```\n\n关闭输出流：\n\n```\nout.close();\n```\n\n最后，调用 `getInputStream`\
  \ 并读取服务器响应。\n\n静态方法 `URLEncoder.encode` 和 `URLDecoder.decode` 有一个使用默认字符集的版本，但它们在\
  \ Java 6 中就已被弃用，因为它们应该始终配合 UTF-8 使用。遗憾的是，尽管 Java 18 将默认字符编码更改为 UTF-8，但它们仍然被弃用。\n\
  \n让我们运行一个实际示例。[`tools.usps.com/zip-code-lookup.htm?byaddress`](https://tools.usps.com/zip-code-lookup.htm?byaddress)\
  \ 网站包含一个用于查找街道地址邮编的表单（参见图 4.6）。要在 Java 程序中使用此表单，你需要知道 `POST` 请求的 URL 和参数。\n\n你可以通过查看表单的\
  \ HTML 代码获取这些信息，但通常使用网络监视器“监控”请求更容易。大多数浏览器的开发工具包都包含网络监视器。例如，图 4.8 显示了向示例网站提交数据时\
  \ Firefox 网络监视器的截图。你可以找到提交的 URL 以及参数名和值。\n\n![Figure](img/devtools.jpg)图 4.8: 监控表单提交\n\
  \n在提交表单数据时，HTTP 头包含了内容类型：\n\n```\nContent-Type: application/x-www-form-urlencoded\n\
  ```\n\n你也可以以其他格式发布数据。例如，当发送 JavaScript 对象表示法（JSON）数据时，将内容类型设置为 `application/json`。\n\
  \n`POST` 的头还必须包含内容长度，例如\n\n```\nContent-Length: 124\n```\n\nListing 4.9 中的程序向任何服务器端程序发送\
  \ `POST` 表单数据。将数据放入如下的 `.properties` 文件中：\n\n```\nurl=https://tools.usps.com/tools/app/ziplookup/zipByAddress\n\
  User-Agent=HTTPie/0.9.2\naddress1=1 Market Street\naddress2=\ncity=San Francisco\n\
  state=CA\ncompanyName=\n. . .\n```\n\n程序移除 `url` 和 `User-Agent` 条目，并将所有其他条目发送到 `doPost`\
  \ 方法。\n\n在 `doPost` 方法中，我们首先打开连接并设置代理。（邮编服务不支持包含字符串 `Java` 的默认 `User-Agent` 请求参数，也许是因为由于邮政部门不想响应程序化的请求。）\n\
  \n然后我们调用 `setDoOutput(true)` 并打开输出流。接着我们枚举所有的键和值。对于每一个项，我们发送 `key`、`=` 字符、`value`\
  \ 和 `&` 分隔符：\n\n```\nout.print(key);\nout.print(\"=\");\nout.print(URLEncoder.encode(value,\
  \ StandardCharsets.UTF_8));\nif (more pairs) out.print(\"&\");\n```\n\n当从写入切换到读取响应的任何部分时，与服务器的实际交互就会发生。`Content-Length`\
  \ 头设置为输出的大小。除非指定了不同的内容类型，否则 `Content-Type` 头设置为 `application/x-www-form-urlencoded`。头和数据被发送到服务器。然后读取响应头和服务器响应。\n\
  \n尽管重定向会被自动处理，但在某些情况下你需要手动处理它们。出于安全考虑，HTTP 和 HTTPS 之间的重定向是不支持的。重定向还可能由于更微妙的原因失败。例如，早期版本的邮编服务使用了重定向。记得我们设置了\
  \ `User-Agent` 请求参数，以便邮政部门不会认为我们是通过 Java API 发起的请求。虽然可以在初始请求中将用户代理设置为不同的字符串，但该设置在自动重定向中并不生效。相反，自动重定向总是发送一个包含\
  \ `Java` 单词的通用代理字符串。\n\n在这些情况下，你可以手动执行重定向。在连接服务器之前，关闭自动重定向：\n\n```\nconnection.setInstanceFollowRedirects(false);\n\
  ```\n\n请求完成后，获取响应码：\n\n```\nint responseCode = connection.getResponseCode();\n```\n\
  \n检查它是否为以下之一：\n\n```\nHttpURLConnection.HTTP_MOVED_PERM\nHttpURLConnection.HTTP_MOVED_TEMP\n\
  HttpURLConnection.HTTP_SEE_OTHER\n```\n\n如果是，获取 `Location` 响应头以获得重定向的 URL。然后断开连接并建立新\
  \ URL 的连接：\n\n```\nString location = connection.getHeaderField(\"Location\");\n\
  if (location != null) {\n    URL base = connection.getURL();\n    connection.disconnect();\n\
  \    URL url = base.toURI().resolve(location).toURL();\n    connection = (HttpURLConnection)\
  \ url.openConnection();\n    . . .\n}\n```\n\n\n\n\n\n本程序所演示的技术在任何需要从现有网站查询信息时都非常有用。你只需要找到需要发送的参数，然后从响应中剥离\
  \ HTML 标签和其他不必要的信息即可。\n\n### 列表 4.9 v2ch04/post/PostDemo.java\n\n```java\npackage\
  \ v2ch04.post;\n\nimport module java.base;\n\n/**\n * 此程序演示了如何使用 URLConnection 类进行\
  \ POST 请求。\n */\npublic class PostDemo {\n    void main(String[] args) throws Exception\
  \ {\n        String propsFilename = args.length > 0 ? args[0] : \"v2ch04/post/post.properties\"\
  ;\n        var props = new Properties();\n        try (Reader in = Files.newBufferedReader(Path.of(propsFilename)))\
  \ {\n            props.load(in);\n        }\n        String urlString = props.remove(\"\
  url\").toString();\n        Object userAgent = props.remove(\"User-Agent\");\n \
  \       Object redirects = props.remove(\"redirects\");\n        CookieHandler.setDefault(new\
  \ CookieManager(null, CookiePolicy.ACCEPT_ALL));\n        String result = doPost(new\
  \ URI(urlString).toURL(), props,\n                userAgent == null ? null : userAgent.toString(),\n\
  \                redirects == null ? -1 : Integer.parseInt(redirects.toString()));\n\
  \        IO.println(result);\n    }\n\n    /**\n     * 执行 HTTP POST 请求。\n     *\
  \ @param url 要 POST 的目标 URL\n     * @param nameValuePairs 查询参数\n     * @param userAgent\
  \ 要使用的用户代理，或为 null 使用默认用户代理\n     * @param redirects 手动跟随的重定向数量，或为 -1 表示自动重定向\n\
  \     * @return 服务器返回的数据\n     * @throws URISyntaxException\n     */\n    String\
  \ doPost(URL url, Map<Object, Object> nameValuePairs, String userAgent, int redirects)\n\
  \            throws IOException, URISyntaxException {\n        var connection =\
  \ (HttpURLConnection) url.openConnection();\n        if (userAgent != null) connection.setRequestProperty(\"\
  User-Agent\", userAgent);\n\n        if (redirects >= 0) connection.setInstanceFollowRedirects(false);\n\
  \n        connection.setDoOutput(true);\n\n        try (var out = new PrintWriter(connection.getOutputStream()))\
  \ {\n            boolean first = true;\n            for (Map.Entry<Object, Object>\
  \ pair : nameValuePairs.entrySet()) {\n                if (first)\n            \
  \        first = false;\n                else\n                    out.print(\"\
  &\");\n                String name = pair.getKey().toString();\n               \
  \ String value = pair.getValue().toString();\n                out.print(name);\n\
  \                out.print(\"=\");\n                out.print(URLEncoder.encode(value,\
  \ StandardCharsets.UTF_8));\n            }\n        }\n        String encoding =\
  \ connection.getContentEncoding();\n        if (encoding == null) encoding = \"\
  UTF-8\";\n\n        if (redirects > 0) {\n            int responseCode = connection.getResponseCode();\n\
  \            if (responseCode == HttpURLConnection.HTTP_MOVED_PERM\n           \
  \         || responseCode == HttpURLConnection.HTTP_MOVED_TEMP\n               \
  \     || responseCode == HttpURLConnection.HTTP_SEE_OTHER) {\n                String\
  \ location = connection.getHeaderField(\"Location\");\n                if (location\
  \ != null) {\n                    URL base = connection.getURL();\n            \
  \        connection.disconnect();\n                    return doPost(base.toURI().resolve(location).toURL(),\
  \ nameValuePairs,\n                            userAgent, redirects - 1);\n    \
  \            }\n            }\n        }\n        else if (redirects == 0) { throw\
  \ new IOException(\"Too many redirects\"); }\n\n        var response = new StringBuilder();\n\
  \        try (var in = new Scanner(connection.getInputStream(), encoding)) {\n \
  \           while (in.hasNextLine()) {\n                response.append(in.nextLine());\n\
  \                response.append(\"\\n\");\n            }\n        }\n        catch\
  \ (IOException e) {\n            InputStream err = connection.getErrorStream();\n\
  \            if (err == null) throw e;\n            try (var in = new Scanner(err))\
  \ {\n                response.append(in.nextLine());\n                response.append(\"\
  \\n\");\n            }\n        }\n\n        return response.toString();\n    }\n\
  }\n```\n\n`java.net.HttpURLConnection`1.0\n\n* `InputStream getErrorStream()`\n\
  \    返回一个可以从其中读取服务器错误信息的流。\n\n`java.net.URLEncoder`1.0\n\n* `static String encode(String\
  \ s, String encoding)`1.4\n    使用给定的字符编码方案返回字符串 `s` 的 URL 编码形式。（推荐的方案是 `\"UTF-8\"\
  `。）在 URL 编码中，字符 `A`–`Z`、`a`–`z`、`0`–`9`、`- _ . ~` 不变。空格被编码为 `+`，所有其他字符被编码为形式如 `%XY`\
  \ 的编码字节序列，其中 `0xXY` 是该字节的十六进制值。\n\n`java.net.URLDecoder`1.2\n\n* `static string\
  \ decode(String s, String encoding)`1.4\n    根据给定的字符编码方案返回 URL 编码字符串 `s` 的解码结果。\n\
  \n## 4.4. HTTP 客户端\n\n`URLConnection` 类在 HTTP 成为 Web 通用协议之前的设计。它支持许多协议，但其对 HTTP\
  \ 的支持相当繁琐。当决定支持 HTTP/2 时，显然最好的做法是提供一个现代的客户端接口，而不是重构现有的 API。`HttpClient` 提供了 HTTP/2\
  \ 支持，并且比 `URLConnection` 类更方便的 API。\n\n### 4.4.1. HttpClient 类\n\n`HttpClient` 可以发送请求并接收响应。通过以下方式获取客户端：\n\
  \n```java\nHttpClient client = HttpClient.newHttpClient()\n```\n\n或者，如果你需要配置客户端，可以使用构建器\
  \ API：\n\n```java\nHttpClient client = HttpClient.newBuilder()\n    .followRedirects(HttpClient.ALWAYS)\n\
  \    .build();\n```\n\n也就是说，你获取一个构建器，调用方法来定制要构建的项目，然后调用 `build` 方法完成构建过程。这是构建不可变对象的常用模式。选择\
  \ HTTP 2 以及控制 Cookie、SSL、代理设置和身份验证有很多高级选项。`HttpClient` 是可关闭的，因此可以声明在 `try` 语句中。它的\
  \ `close` 方法会等待已提交请求完成并关闭连接池。\n\n### 4.4.2. HttpRequest 类和请求发布器\n\n你同样遵循构建模式来制定请求。这是一个\
  \ `GET` 请求：\n\n```java\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(new\
  \ URI(urlString))\n    .GET()\n    .build();\n```\n\nURI 是“统一资源标识符”，在使用 HTTP 时它与\
  \ URL 相同。然而，在 Java 中，`URL` 类具有实际打开连接的方法，而 `URI` 类仅关注语法（方案、主机、端口、路径、查询、片段等）。\n\n\
  对于 `POST` 请求，你需要一个“请求体发布器”来将请求数据转换为要发布的数据。存在字符串、字节数组和文件的体发布器。例如，如果你的请求是 JSON 格式，只需将字符串提供给字符串发布器即可。\n\
  \n```java\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(new URI(urlString))\n\
  \    .header(\"Content-Type\", \"application/json\")\n    .POST(HttpRequest.BodyPublishers.ofString(jsonString))\n\
  \    .build();\n```\n\n遗憾的是 API 不支持常见内容类型所需的格式。列表 4.10 中的示例程序提供了表单数据和文件上传的体发布器。\n\
  \n在该程序中，你可以看到如何使用发布器发送字符串和文件。文件上传需要两者，它采用 `BodyPublishers.concat` 方法连接多个体发布器以生成请求体。\n\
  \n\n\n\n`HttpRequest.Builder` 类也拥有用于不常用的 `PUT`、`DELETE` 和 `HEAD` 请求的构建方法。\n\nJava\
  \ 16 增加了一个构建器用于过滤现有 `HttpRequest` 的标头。你提供请求以及一个接收标头名称和值的函数，对于应该保留的标头返回 `true`。例如，在此处我们修改内容类型：\n\
  \n```\nHttpRequest request2 = HttpRequest.newBuilder(request, (name, value) ->\n\
  \        !name.equalsIgnoreCase(\"Content-Type\")) // 移除旧的内容类型\n    .header(\"Content-Type\"\
  , \"application/xml\") // 添加新的内容类型\n    .build();\n```\n\n### 4.4.3. `HttpResponse`\
  \ 接口和主体处理器\n\n在发送请求时，你必须告诉客户端如何处理响应。如果你只需要作为字符串的正文，请使用 `HttpResponse.BodyHandlers.ofString()`\
  \ 发送请求，如下：\n\n```\nHttpResponse<String> response\n    = client.send(request, HttpResponse.BodyHandlers.ofString());\n\
  ```\n\n`HttpResponse` 是一个泛型接口，其类型参数表示响应正文类型。你可以通过以下方式获取响应正文字符串：\n\n```\nString bodyString\
  \ = response.body();\n```\n\n还有其他响应正文处理器可以将响应获取字节数组或输入流。`BodyHandlers.ofFile(filePath)`\
  \ 生成一个将响应保存到指定文件的处理器，而 `BodyHandlers.ofFileDownload(directoryPath)` 则使用 `Content-Disposition`\
  \ 标头中的文件名将响应保存到指定目录。最后，从 `BodyHandlers.discarding()` 获取的处理器直接丢弃响应。\n\n处理响应的内容不被视为\
  \ API 的一部分。例如，如果你接收到 JSON 数据，你需要一个 JSON 库来解析内容。\n\n`HttpResponse` 对象还产生状态码和响应标头。\n\
  \n```\nint status = response.statusCode();\nHttpHeaders responseHeaders = response.headers();\n\
  ```\n\n你可以将 `HttpHeaders` 对象转换为一个映射：\n\n```\nMap<String, List<String>> headerMap\
  \ = responseHeaders.map();\n```\n\n映射的值是列表，因为在 HTTP 中，每个键可以有多个值。\n\n如果你只需要特定键的值，并且知道不会有多个值，请调用\
  \ `firstValue` 方法：\n\n```\nOptional<String> lastModified = responseHeaders.firstValue(\"\
  Last-Modified\");\n```\n\n你会获得响应值，或者如果没有提供，则获得一个空的可选。\n\n`HttpHeaders` 类感知到 HTTP\
  \ 参数的键是不区分大小写的。如果你调用 `responseHeaders.firstValue(\"Last-Modified\")`，即使它是作为 `last-modified`\
  \ 发送的，你也能获得所需的标头值。\n\n### 4.4.4. 异步处理\n\n你可以异步处理响应。在构建客户端时，提供一个执行器：\n\n```\nExecutorService\
  \ executor = Executors.newCachedThreadPool();\nHttpClient client = HttpClient.newBuilder().executor(executor).build();\n\
  ```\n\n构建一个请求，然后在客户端上调用 `sendAsync` 方法。你接收到一个 `CompletableFuture<HttpResponse<T>>`，其中\
  \ `T` 是主体处理器的类型。按照 第一卷第 10 章 中描述使用 `CompletableFuture` API：\n\n```\nHttpRequest\
  \ request = HttpRequest.newBuilder().uri(uri).GET().build();\nclient.sendAsync(request,\
  \ HttpResponse.BodyHandlers.ofString())\n    thenAccept(response -> . . .);\n```\n\
  \n要为 `HttpClient` 启用日志，请在你的 JDK 的 `net.properties` 中添加此行：\n\n```\njdk.httpclient.HttpClient.log=all\n\
  ```\n\n除了 `all` 之外，你可以指定以下事件类型的逗号分隔列表：\n\n- `channel`\n- `content`\n- `errors`\n\
  - `frames`，可选地跟随一个或多个 `:control`、`:data`、`:window` 或 `:all`\n- `headers`\n- `requests`\n\
  - `ssl`\n- `trace`\n\n不要使用任何空格：\n\n```\njdk.httpclient.HttpClient.log=headers,requests,frames:control:data\n\
  ```\n\n然后，将名为 `jdk.httpclient.HttpClient` 的日志器的日志级别设置为 `INFO`，例如通过向你的 JDK 中的 `logging.properties`\
  \ 文件中添加此行：\n\n```\njdk.httpclient.HttpClient.level=INFO\n```\n\n示例 4.10 中的程序显示了如何向不同的服务发送同步请求。示例\
  \ 4.11 中的类实现了用于表单、文件上传和 JSON 的主体发布器。按如下方式运行程序：\n\n```bash\njavac v2ch04/httpClient/HttpClientDemo.java\n\
  java v2ch04.httpClient.HttpClientDemo v2ch04/httpClient/form.properties\njava v2ch04.httpClient.HttpClientDemo\
  \ v2ch04/httpClient/fileupload.properties\njava v2ch04.httpClient.HttpClientDemo\
  \ v2ch04/httpClient/json.properties\n```\n\n每次运行时，由于一个“Hello, World”程序会被发送到 CodeCheck\
  \ 服务，并显示其运行结果。该服务可以接受表单提交、文件上传和 JSON 提交。注意来自 `HttpClient` 的日志输出。\n\n示例 4.10 v2ch04/httpClient/HttpClientDemo.java\n\
  \n```java\npackage v2ch04.httpClient;\n\nimport module java.base;\nimport module\
  \ java.net.http;\nimport java.net.http.HttpRequest.BodyPublisher;\n\n/**\n * 此程序演示了\
  \ HTTP client */\nclass HttpClientDemo {\n    void main(String[] args) throws Exception\
  \ {\n        System.setProperty(\"jdk.httpclient.HttpClient.log\", \"headers,requests,content\"\
  );\n        // 注意：下方的逻辑遵循提供的文本结构\n        // ... (其余逻辑见提供的片段)\n    }\n}\n```\n\n\
  \n\n\n```java\npackage v2ch04.httpClient;\n\nimport module java.base;\nimport java.net.http.HttpRequest.*;\n\
  \npublic class MoreBodyPublishers {\n    public static BodyPublisher ofFormData(Map<Object,\
  \ Object> data) {\n        boolean first = true;\n        var builder = new StringBuilder();\n\
