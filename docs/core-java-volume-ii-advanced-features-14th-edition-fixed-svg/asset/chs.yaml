  \n*   `Kernel(int width, int height, float[] matrixElements)` constructs a kernel\
  \ for the given matrix.\n\n## 12.7. Printing\n\nIn the following sections, I'll\
  \ show you how you can easily print a drawing on a single sheet of paper, how you\
  \ can manage a multipage printout, and how you can save a printout as a PostScript\
  \ file.\n\n### 12.7.1. Graphics Printing\n\nIn this section, we will tackle what\
  \ is probably the most common printing situation: printing a 2D graphic. Of course,\
  \ the graphic can contain text in various fonts or even consist entirely of text.\n\
  \n\n\n\n要生成打印输出，你必须处理以下两个任务：\n\n* 提供一个实现了 `Printable` 接口的对象\n* 启动一个打印任务\n\n`Printable`\
  \ 接口有一个方法：\n\n```\nint print(Graphics g, PageFormat format, int page)\n```\n\n每当打印引擎需要对页面进行格式化处理时，就会调用该方法。你的代码将要打印的文本和图像绘制到图形上下文。`page\
  \ format`（页面格式）告知你纸张大小和打印边距。`page number`（页码）告知你要渲染哪一页。\n\n要启动打印任务，请使用 `PrinterJob`\
  \ 类。首先，调用静态方法 `getPrinterJob` 来获取打印任务对象。然后，设置你想要打印的 `Printable` 对象。\n\n```\nPrintable\
  \ canvas = . . .;\nPrinterJob job = PrinterJob.getPrinterJob();\njob.setPrintable(canvas);\n\
  ```\n\n`PrintJob` 类处理 JDK 1.1 风格的打印。该类现在已经过时。不要将其与 `PrinterJob` 类混淆。\n\n在启动打印任务之前，你应该调用\
  \ `printDialog` 方法来显示打印对话框（参见图 12.60）。该对话框让用户有机会选择要使用的打印机（如果有多个打印机可用）、打印页范围以及各种打印机设置。\n\
  \n![Figure](img/fig07-32.jpg)图 12.60：跨平台打印对话框\n\n在实现了 `PrintRequestAttributeSet`\
  \ 接口的类对象中收集打印设置，例如 `HashPrintRequestAttributeSet` 类。\n\n```\nvar attributes = new\
  \ HashPrintRequestAttributeSet();\n```\n\n添加属性设置并将 `attributes` 对象传递给 `printDialog`\
  \ 方法。\n\n如果用户点击确定，`printDialog` 方法返回 `true`；如果用户取消对话框，则返回 `false`。如果用户接受，调用 `PrinterJob`\
  \ 类的 `print` 方法启动打印过程。`print` 方法可能会抛出 `PrinterException`。以下是打印代码的结构：\n\n```\nif\
  \ (job.printDialog(attributes)) {\n    try {\n        job.print(attributes);\n \
  \   }\n    catch (PrinterException e) {\n        . . .\n    }\n}\n```\n\n在 JDK 1.4\
  \ 之前，打印系统使用主机平台的原生打印和页面设置对话框。要显示原生打印对话框，请在不带参数的情况下调用 `printDialog` 方法。（没有办法在属性集中收集用户设置。）\n\
  \n在打印期间，`PrinterJob` 类的 `print` 方法会反复调用与任务关联的 `Printable` 对象的 `print` 方法。\n\n由于任务并不知道你想打印多少页，它只会持续调用\
  \ `print` 方法。只要 `print` 方法返回值 `Printable.PAGE_EXISTS`，打印任务就会继续生成页面。当 `print` 方法返回\
  \ `Printable.NO_SUCH_PAGE` 时，打印任务停止。\n\n打印任务传递给 `print` 方法的页码从 0 页开始。\n\n因此，在打印输出完成之前，打印任务没有准确的页数。由于由于原因，打印对话框无法显示正确的页范围——相反，它显示“第\
  \ 1 到第 1 页”。你将在下一节中看到如何通过向打印任务提供一个 `Book` 对象来避免这一缺陷。\n\n在打印过程中，打印任务反复调用 `Printable`\
  \ 对象的 `print` 方法。打印任务允许对*同一页进行多次调用*。因此，你不应该在 `print` 方法内部计算页数，而应始终依赖页码参数。打印任务可能对同一页反复调用\
  \ `print` 方法有一个充分的原因。某些打印机（特别是针式打印机和喷墨打印机）使用*带扫描（banding）*。它们一次打印一个带，进纸，然后打印下一个带。即使对于一次打印一整页的激光打印机，打印任务也可能使用带扫描——这为打印任务提供了一种管理缓冲区文件大小的方法。\n\
  \n如果打印任务需要 `Printable` 对象来打印一个带，它会将图形上下文的裁剪区域设置为请求的带，并调用 `print` 方法。它的绘制操作将根据带状矩形进行裁剪，只有那些在带中显示的绘图元素会被渲染。你的\
  \ `print` 方法不需要感知该过程，但有一个例外：它*不应该*干扰裁剪区域。\n\n你的 `print` 方法获取的 `Graphics` 对象也根据页面边距进行了裁剪。如果你替换了裁剪区域，你就可以在边距之外绘图。特别是在打印机图形上下文中，必须尊重裁剪区域。调用\
  \ `clip` 而不是 `setClip` 来进一步限制裁剪区域。如果你必须移除裁剪区域，请确保在 `print` 方法开始时调用 `getClip` 并恢复该裁剪区域。\n\
  \n`print` 方法的 `PageFormat` 参数包含有关打印页的信息。`getWidth` 和 `getHeight` 方法返回纸张大小，单位是*点（points）*。（1\
  \ 点等于 1/72 英寸；1 英寸等于 25.4 毫米。）例如，A4 纸约为 595 × 842 点，美国信纸大小为 612 × 792 点。\n\n点是美国打印行业中常用的测量单位。令世界其他地方感到遗憾的是，打印包使用的是点。这有两个目的：纸张尺寸和边距是以点衡量的，而且点是所有打印上下文的默认单位。你可以在本节末尾的示例程序验证这一点。程序打印了两行间距为\
  \ 72 的文本。运行示例程序并测量基线之间的距离；它们正好是 1 英寸或 25.4 毫米。\n\n`PageFormat` 类的 `getWidth` 和 `getHeight`\
  \ 方法提供完整的纸张大小。并不是所有的纸张区域都是可打印的。用户通常会选择边距，即使他们这样做，打印机也需要抓抓纸，因此边缘会有不可打印区域。\n\n`getImageableWidth`\
  \ 和 `getImageableHeight` 方法告诉你你可以实际填充的区域尺寸。然而，边距并不对称，因此你必须知道打印区域的左上角（参见图 12.61），这可以通过\
  \ `getImageableX` 和 `getImageableY` 方法获得。\n\n图 12.61：页面格式测量\n\n你在 `print` 方法中接收到的图形上下文已裁剪掉边距，但坐标系的原点仍然是纸张的左上角。将坐标系移动到打印区域的左上角是有意义的。只需在\
  \ `print` 方法开始时\n\n```\ng.translate(pageFormat.getImageableX(), pageFormat.getImageableY());\n\
  ```\n\n如果你希望用户选择页面边距设置或在不设置其他打印属性的情况下切换横纵幅方向，请调用 `PrinterJob` 类的 `pageDialog` 方法：\n\
  \n```\nPageFormat format = job.pageDialog(attributes);\n```\n\n打印对话框的一个选项卡包含页面设置对话框（参见图\
  \ 12.62）。你可能仍然想在打印前给用户设置页面格式的选项，特别是当你的程序为待打印页面提供“所见即所得”显示时。`pageDialog` 方法返回一个带有用户设置的\
  \ `PageFormat` 对象。\n\n本节末尾的程序了如何在屏幕和打印页面上渲染相同的形状集合。`JPanel` 的子类实现了 `Printable` 接口。`paintComponent`\
  \ 和 `print` 方法都调用同一个方法来执行实际绘制。\n\n\n\n\n```java\nclass PrintPanel extends JPanel\
  \ implements Printable {\n    public void paintComponent(Graphics g) {\n       \
  \ super.paintComponent(g);\n        var g2 = (Graphics2D) g;\n        drawPage(g2);\n\
  \    }\n\n    public int print(Graphics g, PageFormat pf, int page) throws PrinterException\
  \ {\n        if (page >= 1) return Printable.NO_SUCH_PAGE;\n        var g2 = (Graphics2D)\
  \ g;\n        g2.translate(pf.getImageableX(), pf.getImageableY());\n        drawPage(g2);\n\
  \        return Printable.PAGE_EXISTS;\n    }\n\n    public void drawPage(Graphics2D\
  \ g2) {\n        // shared drawing code goes here\n        . . .\n    }\n    . .\
  \ .\n}\n```\n\n此示例显示并打印了图 12.50 所示的图像——即“Hello, World”消息的轮廓，被用作线条图案的裁剪区域。\n\n点击`Print`（打印）按钮开始打印，或者点击`Page\
  \ setup`（页面设置）按钮打开页面设置对话框。Listing 12.23 显示了代码。\n\n要显示原生页面设置对话框，请将默认的`PageFormat`对象传递给`pageDialog`方法。该方法克隆该对象，根据用户在对话框中的选择对其修改，并返回克隆后的对象。\n\
  \n```\nPageFormat defaultFormat = printJob.defaultPage();\nPageFormat selectedFormat\
  \ = printJob.pageDialog(defaultFormat);\n```\n\nListing 12.23 v2ch12/print/PrintDemoFrame.java\n\
  \n```java\npackage v2ch12.print;\n\nimport module java.desktop;\n\n/**\n * 此框架显示包含\
