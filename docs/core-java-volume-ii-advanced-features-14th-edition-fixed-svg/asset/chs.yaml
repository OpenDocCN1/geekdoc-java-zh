  \ Horstmann\n德国杜塞尔多夫夫\n2025 年 9 月\n\n# 第 1 章 ▪ 流（Streams）\n\n与集合（collections）相比，流提供了一种数据视图，允许你在更高层级的概念层面上指定计算任务。通过流，你指定你想要*做什么*，而不是*如何做*。你将操作的调度留给实现。例如，假设你想计算某个属性的平均值。你指定数据源和该属性，流库就可以优化计算，例如通过使用多个线程来计算和和计数并合并结果。\n\
  \n在本章中，你将学习如何使用 Java 流库，它允许你以“做什么，而不是怎么做”的方式处理值序列。\n\n## 1.1 从迭代到流操作\n\n当你处理一个集合时，通常会遍历它的元素并对每个元素执行某些操作。例如，假设我们想统计一书中所有的长单词。首先，让我们它们放入一个列表：\n\
  \n```\nString contents = Files.readString(Path.of(\"alice.txt\")); // 将文件读入字符串\n\
  String[] words = contents.split(\"\\\\PL+\"); // 拆分为单词\n```\n\n`split` 方法根据用于分隔符的正则表达式将字符串拆分成部分。（关于正则表达式的更多信息，请参见第\
  \ 2 章）。目前，只需相信 `\\PL+` 表达式是有效的即可。）\n\n现在我们准备好进行迭代了：\n\n```\nint count = 0;\nfor\
  \ (String w : words) {\n    if (w.length() > 12) count++;\n}\n```\n\n使用流，相同的操作看起来如下：\n\
  \n```\nlong count = Stream.of(words)\n    .filter(w -> w.length() > 12)\n    .count();\n\
  ```\n\n现在你不再需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码的意图。此外，循环以极其详细规定了操作的顺序，而流能够以它想要的任何方式调度操作，只要结果是正确的即可。\n\
  \n只需将 `stream` 更改为 `parallelStream`，允许流库并行执行过滤和计数。\n\n```\nlong count = words.parallelStream()\n\
  \    .filter(w -> w.length() > 12)\n    .count();\n```\n\n流遵循“做什么，而不是怎么做”的原则。在我们的流示例中，我们描述了需要做什么：获取长单词并对它们计数。我们没有指定这应该以什么顺序或在哪个线程中发生。相比之下，本节开头的循环精确地指定了计算应该如何工作。\n\
  \n流在表面上看起来像集合，但之间存在显著差异：\n\n1. 流不存储它的元素。元素可能根据需要生成。\n2. 流操作不会改变其源。例如，`filter` 方法不会从流中删除元素。\n\
  3. 流操作尽可能是惰性的（lazy）。这意味着在需要结果之前，它们不会被执行。\n\n这种工作流在你处理流时是典型的。你通过三个阶段设置操作的流水线：\n\n\
  1. 创建流。\n2. 指定中间操作来转换初始流，可能涉及多个步骤。\n3. 应用终端操作以产生结果。该操作会强制执行先前的惰性操作。之后，该流无法再次使用。\n\
  \n在列表 1.1 的示例中，流通过 `stream` 或 `parallelStream` 方法创建。`filter` 方法对其进行转换，而 `count`\
  \ 是终端操作。\n\n在下一节中，你将看到如何创建流。随后的三个章节将处理中间操作。然后我们转向终端操作。\n\n\n\n\n产生此集合中元素的顺序或并行流。\n\
  \n## 1.2. 流的创建\n\n你已经看到，可以通过 `Collection` 接口的 `stream` 方法将任何集合转换为流。如果你有一个数组，请使用静态的\
  \ `Stream.of` 方法。\n\n```\nStream<String> words = Stream.of(contents.split(\"\\\\\
  PL+\"));\n```\n\n在上一个示例中，我们根据 `split` 方法返回的数组创建了一个流。`of` 方法具有可变长度参数，因此你可以从任意数量的参数构造一个流：\n\
  \n```\nStream<String> song = Stream.of(\"gently\", \"down\", \"the\", \"stream\"\
  );\n```\n\n使用 `Arrays.stream(array, from, to)` 从数组的一部分创建流。\n\n要创建一个没有任何元素的流，请使用静态的\
  \ `Stream.empty` 方法：\n\n```java\nStream<String> silence = Stream.empty();\n// 通用类型\
  \ <String> 被自动推断；等同于 Stream.<String>empty()\n```\n\n`Stream` 接口有两个静态方法用于创建无限流。`generate`\
  \ 方法接受一个无参数的函数（或者从技术上讲，是一个 `Supplier<T>` 接口的对象）。每当需要流值时，就会调用该函数产生一个值。你可以这样获取一个常量值流：\n\
  \n```java\nStream<String> echos = Stream.generate(() -> \"Echo\");\n```\n\n或者获取一个随机数流：\n\
  \n```java\nStream<Double> randoms = Stream.generate(Math::random);\n```\n\n要产生如\
  \ `0 1 2 3 . . .` 这样的序列，请使用 `iterate` 方法。它接受一个“种子”值和一个函数（技术上讲是 `UnaryOperator<T>`），并重复地将该函数应用于上一个结果。例如：\n\
  \n```java\nStream<BigInteger> integers\n    = Stream.iterate(BigInteger.ZERO, n\
  \ -> n.add(BigInteger.ONE));\n```\n\n序列中的第一个元素是种子 `BigInteger.ZERO`。第二个元素是 `f(seed)`，它产生\
  \ `1`（作为一个大整数）。下一个元素是 `f(f(seed))`，它产生 `2`，以此类推。\n\n要产生一个有限流，请添加一个谓词来指定迭代何时结束：\n\
  \n```java\nvar limit = new BigInteger(\"10000000\");\nStream<BigInteger> integers\n\
  \    = Stream.iterate(BigInteger.ZERO,\n        n -> n.compareTo(limit) < 0,\n \
  \       n -> n.add(BigInteger.ONE));\n```\n\n一旦谓词拒绝了迭代生成的值，流就会结束。\n\n最后，`Stream.ofNullable`\
  \ 方法可以根据对象创建一个非常短的流。如果对象为 `null`，则流的长度为 0；否则长度为 1，仅包含该对象。这在配合 `flatMap` 使用时非常有用——参见第\
  \ 1.7.7 节 的示例。\n\nJava API 中的许多方法产生流。例如，`String` 类有一个 `lines` 方法，可以产生该字符串中包含的行的流：\n\
  \n```java\nStream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n\
  ```\n\n`Pattern` 类有一个方法 `splitAsStream`，可以根据正则表达式分割 `CharSequence`。你可以使用以下语句将字符串拆分为单词：\n\
  \n```java\nStream<String> words = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n\
  ```\n\n`Scanner.tokens` 方法产生扫描器的标记（tokens）流。另一种从字符串获取单词流的方法是：\n\n```java\nStream<String>\
  \ words = new Scanner(contents).tokens();\n```\n\n静态的 `Files.lines` 方法返回文件中所有行的\
  \ `Stream`：\n\n```java\ntry (Stream<String> lines = Files.lines(path)) {\n    Process\
  \ lines\n}\n```\n\n注意，`try`-with-resources 块对于关闭文件是必要的。\n\n在 Java API 中以流的形式提供数据变得越来越常见。例如，Java\
  \ 21 添加了一个静态的 `availableLocales` 方法，产生一个 `Locale` 对象的流。\n\n要产生一个有限流，你始终可以将元素添加到列表中，然后将其转换为流。对于该目的，`Stream.Builder`\
  \ 接口效率略高：\n\n```java\nStream<Integer> digits(int n) {\n    Stream.Builder<Integer>\
  \ builder = Stream.builder();\n    while (n != 0) {\n        builder.add(n % 10);\n\
  \        n = n / 10;\n    }\n    return builder.build();\n}\n```\n\n要查看本节中引入的流之一的内容，可以使用\
  \ `toList` 方法，它将流的元素收集到列表中。像 `count` 一样，`toList` 是一个终端操作。如果流是无限的，先用 `limit` 方法对其截断：\n\
  \n```java\nIO.println(Stream.generate(Math::random).limit(10).toList());\n```\n\n\
  为了将 `Iterator` 或不是集合的通用 `Iterable` 转换为流，你需要使用 `spliterators` 的辅助方法。`spliterator`\
  \ 与 `iterator` 类似，但它可以被拆，使得每个生成的 `spliterator` 都能产生元素的一部分。这种拆用于并行处理元素——参见第 1.13\
  \ 节。\n\n如果你有一个 `Iterator` 并想要获取其结果的流，请使用：\n\n```java\nStreamSupport.stream(Spliterators.spliteratorUnknownSize(\n\
  \    iterator, Spliterator.ORDERED), false);\n```\n\n如果你有一个不是集合的 `Iterable`，可以通过调用以下方法将其转换为流：\n\
  \n```java\nStreamSupport.stream(iterable.spliterator(), false);\n```\n\n在执行流操作时，不要修改流背后的集合是非常重要的。记住，流并不收集数据——数据始终在单独的集合中。如果你修改了该集合，流操作的结果将变得未。JDK\
  \ 文档将这一要求称为 `noninterference`（非干扰）。\n\n准确来说，由于中间流操作是惰性的，因此在终端操作执行之前修改集合是可能的。例如，以下代码虽然不推荐，但可以运行：\n\
  \n```java\nList<String> wordList = . . .;\nStream<String> words = wordList.stream();\n\
  wordList.add(\"END\");\nlong n = words.distinct().count();\n```\n\n但这段代码是错误的：\n\n\
  ```java\nStream<String> words = wordList.stream();\nwords.forEach(s -> {if (s.length()\
  \ < 12) wordList.remove(s);});\n    // 错误--干扰 (interference)\n```\n\n列表 1.2 中的示例展示了创建流的各种方法。\n\
  \nListing 1.2 v2ch01/streams/CreatingStreams.java\n\n\n\n\n```java\npackage v2ch01.streams;\n\
  \nimport module java.base;\n\nclass CreatingStreams {\n    void main() throws Exception\
  \ {\n        Path path = Path.of(\"gutenberg\", \"alice30.txt\");\n        String\
  \ contents = Files.readString(path);\n        Stream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n\n        show(\"words\", words);\n        Stream<String> song = Stream.of(\"\
  gently\", \"down\", \"the\", \"stream\");\n        show(\"song\", song);\n     \
  \   Stream<String> silence = Stream.empty();\n        show(\"silence\", silence);\n\
  \n        Stream<String> echos = Stream.generate(() -> \"Echo\");\n        show(\"\
  echos\", echos);\n\n        Stream<Double> randoms = Stream.generate(Math::random);\n\
  \        show(\"randoms\", randoms);\n\n        Stream<BigInteger> integers = Stream.iterate(BigInteger.ONE,\n\
  \                n -> n.add(BigInteger.ONE));\n        show(\"integers\", integers);\n\
  \n        Stream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n\
  \        show(\"greetings\", greetings);\n\n        Stream<String> wordsAnotherWay\
  \ = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n        show(\"wordsAnotherWay\"\
  , wordsAnotherWay);\n\n        try (Stream<String> lines = Files.lines(path)) {\n\
  \            show(\"lines\", lines);\n        }\n\n        Iterable<Path> iterable\
  \ = FileSystems.getDefault().getRootDirectories();\n        Stream<Path> rootDirectories\
  \ = StreamSupport.stream(iterable.spliterator(), false);\n        show(\"rootDirectories\"\
  , rootDirectories);\n\n        Iterator<Path> iterator = Path.of(\"/usr/share/dict/words\"\
  ).iterator();\n        Stream<Path> pathComponents = StreamSupport.stream(\n   \
  \             Spliterators.spliteratorUnknownSize(iterator, Spliterator.ORDERED),\
  \ false);\n        show(\"pathComponents\", pathComponents);\n    }\n\n    <T> void\
  \ show(String title, Stream<T> stream) {\n        final int SIZE = 10;\n       \
  \ List<T> firstElements = stream.limit(SIZE + 1).toList();\n        IO.print(title\
  \ + \": \");\n        for (int i = 0; i < firstElements.size(); i++) {\n       \
  \     if (i > 0) IO.print(\", \");\n            if (i < SIZE)\n                IO.print(firstElements.get(i));\n\
  \            else\n                IO.print(\"...\");\n        }\n        IO.println();\n\
  \    }\n\n}\n```\n\n### java.util.stream.Stream<T>\n\n*   `static <T> Stream<T>\
  \ of(T... values)`\n    产生一个其元素为给定值的流。\n\n*   `static <T> Stream<T> empty()`\n \
  \   产生一个不包含任何元素的流。\n\n*   `static <T> Stream<T> generate(Supplier<T> s)`\n    产生一个无限流，其元素通过重复调用函数\
  \ `s` 构建。\n\n*   `static <T> Stream<T> iterate(T seed, UnaryOperator<T> f)`\n\n\
  *   `static <T> Stream<T> iterate(T seed, Predicate<? super T> hasNext, UnaryOperator<T>\
  \ f)`\n    产生一个流，其元素为 `seed`、对 `seed` 调用 `f`、对前一个元素调用 `f`，以此类推。第一种方法产生无限流。第二种方法的流在第一个不符合\
  \ `hasNext` 谓词的元素结束。\n\n*   `static <T> Stream<T> ofNullable(T t)`\n    如果 `t` 为\
  \ `null` 则返回空流，否则返回一个包含 `t` 的流。\n\n### java.util.Spliterators\n\n*   `static <T>\
  \ Spliterator<T> spliteratorUnknownSize(Iterator<? extends T> iterator, int characteristics)`\n\
  \    将迭代器转换为未知大小的拆拆分迭代器，并具有给定的特性（一个包含 `Spliterator.ORDERED` 等常量的位模式）。\n\n### java.util.Arrays\n\
  \n*   `static <T> Stream<T> stream(T[] array, int startInclusive, int endExclusive)`\n\
  \    产生一个其元素为数组指定范围的流。\n\n### java.lang.String\n\n*   `String[] split(String regex)`\n\
  \    查找正则表达式的所有匹配项并通过移除它们来分割字符串。返回一个包含片段的数组，但不会包含末尾的空字符串。\n\n*   `static Stream<String>\
  \ lines()`\n    产生一个其元素为该字符串各行的流。\n\n### java.util.regex.Pattern\n\n*   `Stream<String>\
  \ splitAsStream(CharSequence input)`\n    产生一个其元素为由此模式分隔的输入部分的流。\n\n### java.nio.file.Files\n\
  \n*   `static Stream<String> lines(Path path)`\n\n*   `static Stream<String> lines(Path\
  \ path, Charset cs)`\n    产生一个其元素为指定文件的行的，使用 UTF-8 字符集或指定的字符集。\n\n### java.util.stream.StreamSupport\n\
  \n*   `static <T> Stream<T> stream(Spliterator<T> spliterator, boolean parallel)`\n\
  \    产生一个包含由指定的可拆分迭代器产生的值的流。\n\n### java.lang.Iterable\n\n*   `Spliterator<T> spliterator()`\n\
  \    产生一个可拆分的迭代器。\n\n### java.util.Scanner\n\n*   `public Stream<String> tokens()`\n\
  \    产生一个标记（tokens）的流。\n\n### java.util.function.Supplier\n\n*   `T get()`\n   \
  \ 提供一个值。\n\n### filter, map, and flatMap 方法\n\n`filter` 过滤元素，`map` 转换元素，而 `flatMap`\
  \ 将单个元素转换为多个元素。\n\n#### filter\n\n`filter` 方法接受一个 `Predicate` 并返回一个只包含符合谓词元素的流。\n\
  \n```java\nStream<String> longWords = words.filter(w -> w.length() > 5);\n```\n\n\
  #### map\n\n`map` 方法接受一个 `Function` 并返回一个对每个元素应用该函数的结果的流。\n\n```java\nStream<String>\
  \ lowercaseWords = words.map(String::toLowerCase);\n```\n\n#### flatMap\n\n`flatMap`\
  \ 方法接受一个为每个元素返回流的 `Function`，并将产生的流合并为一个流。\n\n```java\nStream<String> flatResult\
  \ = words.flatMap(w -> graphemeClusters(w));\n```\n\n### mapMulti\n\n`mapMulti`\
  \ 方法是 `flatMap` 的替代方案，适用于避免创建中间流更高效的情况。它使用 `ForEachConsumer` 将元素推送到收集器中。\n\n```java\n\
  words.mapMulti((word, consumer) -> {\n    for (String gc : graphemeClusters(word))\
  \ {\n        consumer.accept(gc);\n    }\n});\n```\n\n\n\n\n调用 `mapMulti` 时，你提供一个函数，该函数将通过流元素和收集器（collector）调用。在你的函数中，将结果传递给收集器。\n\
  \n```\nStream<String> result = words.stream().mapMulti((s, collector) -> {\n   \
  \ iter.setText(s);\n    int start = iter.first();\n    int end = iter.next();\n\
  \    while (end != BreakIterator.DONE) {\n        String gc = s.substring(start,\
  \ end);\n        start = end;\n        end = iter.next();\n        collector.accept(gc);\n\
  \    }\n});\n```\n\njava.util.stream.Stream<T>8\n\n*   `Stream<T> filter(Predicate<?\
  \ super T> predicate)`\n\n    产生一个包含此流中符合谓词元素的流。\n\n*   `<R> Stream<R> map(Function<?\
  \ super T,? extends R> mapper)`\n\n    产生一个包含将 `mapper` 应用于此流元素的结果流。\n\n*   `<R>\
  \ Stream<R> flatMap(Function<? super T,? extends Stream<? extends R>> mapper)`\n\
  \n    产生一个通过连接将 `mapper` 应用于此流元素的结果得到的流。（注意每个 `mapper` 结果都是一个流。）\n\n*   `<R> Stream<R>\
  \ mapMulti(BiConsumer<? super T,? super Consumer<R>> mapper)`16\n\n    对于每个流元素，都会调用\
  \ `mapper`，并在调用期间传递给 `Consumer` 的所有元素都会添加到结果流中。\n\n## 1.4. 提取子流和合并流\n\n调用 `stream.limit(n)`\
  \ 返回一个新的在 `n` 个元素后结束的流（如果原始流较短，则在原始流结束时结束）。该方法对于将无限流裁剪为特定大小特别有用。例如，\n\n```\nStream<Double>\
  \ randoms = Stream.generate(Math::random).limit(100);\n```\n\n产生一个包含 100 个随机数的流。\n\
  \n调用 `stream.skip(n)` 的操作恰恰相反。它丢弃前 `n` 个元素。这在我们的书籍示例中非常有用，因为由于 `split` 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用\
  \ `skip` 让它消失：\n\n```\nStream<String> words = Stream.of(contents.split(\"\\\\PL+\"\
  )).skip(1);\n```\n\n`stream.takeWhile(predicate)` 调用在谓词为 `true` 时获取流中的所有元素，然后停止。\n\
  \n例如，假设我们使用前一节的 `graphemeClusters` 方法将字符串拆分为字符，并且我们想要收集所有的初始数字。`takeWhile` 方法可以做到这一点：\n\
  \n```\nStream<String> initialDigits = graphemeClusters(str).takeWhile(\n    s ->\
  \ \"0123456789\".contains(s));\n```\n\n`dropWhile` 方法的操作相反，它在条件为 `true` 时丢弃元素，并产生一个从第一个条件为\
  \ `false` 的元素开始的所有元素的流。例如，\n\n```\nStream<String> withoutInitialWhiteSpace = graphemeClusters(str).dropWhile(\n\
  \    s -> s.strip().length() == 0);\n```\n\n你可以使用 `Stream` 类的静态方法 `concat` 合并两个流：\n\
  \n```\nStream<String> combined = Stream.concat(\n    graphemeClusters(\"Hello\"\
  ), graphemeClusters(\"World\"));\n    // 产生流 [\"H\", \"e\", \"l\", \"l\", \"o\"\
  , \"W\", \"o\", \"r\", \"l\", \"d\"]\n```\n\n当然，第一个流不应该是无限的——否则第二个流将永远没有机会。\n\n\
  java.util.stream.Stream<T>8\n\n*   `Stream<T> limit(long maxSize)`\n\n    产生一个包含此流最多\
  \ `maxSize` 个初始元素的流。\n\n*   `Stream<T> skip(long n)`\n\n    产生一个元素为此流除初始 `n` 个元素以外的所有元素的流。\n\
  \n*   `Stream<T> takeWhile(Predicate<? super T> predicate)`9\n\n    产生一个元素为此流中符合谓词的初始元素的流。\n\
  \n*   `Stream<T> dropWhile(Predicate<? super T> predicate)`9\n\n    产生一个元素为此流中除符合谓词的初始元素以外元素的流。\n\
  \n*   `static <T> Stream<T> concat(Stream<? extends T> a, Stream<? extends T> b)`\n\
  \n    产生一个元素为 `a` 的元素后跟 `b` 的元素的流。\n\n## 1.5. 其他流转换\n\n`distinct` 方法返回一个产生原始流中元素的流，保持相同的顺序，但压制了重复项。重复项不需要相邻。\n\
  \n```\nStream<String> uniqueWords\n    = Stream.of(\"merrily\", \"merrily\", \"\
  merrily\", \"gently\").distinct();\n    // 只保留了一个 \"merrily\"\n```\n\n为了对流进行排序，`sorted`\
  \ 方法有几种变体。一种适用于 `Comparable` 元素的流，另一种接受一个 `Comparator`。在这里，我们对字符串进行排序，使得最长的在前面：\n\
  \n```\nStream<String> longestFirst\n    = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n\n与所有的流转换一样，`sorted` 方法产生一个新流。`sorted` 方法产生一个元素为此流按排序顺序排列元素的流。该方法要求元素是 `Comparable`\
  \ 实例。\n\n最后，`peek` 方法产生一个具有相同元素的流，并在每个元素时将其传递给 `action`。\n\njava.util.stream.Stream<T>8\n\
  \n*   `Stream<T> distinct()`\n\n    产生此流去重后的元素流。\n\n*   `Stream<T> sorted()`\n\n\
  *   `Stream<T> sorted(Comparator<? super T> comparator)`\n\n    产生一个元素为此流按比较器排序顺序元素的流。\n\
  \n*   `Stream<T> peek(Consumer<? super T> action)`\n\n    产生一个具有相同元素的流，并将每个元素传递给\
  \ `action`。\n\n## 1.6. 简单约\n\n现在你已经了解了如何创建和转换流，我们终于进入最重要的部分——从流数据中获取答案。本节涵盖的方法被称为“约”（reductions）。约是*终端操作*。它们将流还原为非流值。\n\
  \n你已经见过一个简单的约：`count` 方法，它返回流元素的数量。\n\n其他简单的约还有 `max` 和 `min`，它们返回最大值或最小值。有一个变化——这些方法返回一个\
  \ `Optional<T>` 值，该值封装了答案，或者指示没有（因为流恰好为空）。在过去，在这种情况下返回 `null` 是很常见的。但当它在测试不完全的程序中发生时，会导致空指针异常。`Optional`\
  \ 类型是指示缺失返回值的更好方法。我们将在下一节详细讨论 `Optional` 类型。这里是你可以获取流的最大值的方法：\n\n```\nOptional<String>\
  \ largest = words.max(String::compareToIgnoreCase);\nIO.println(\"largest: \" +\
  \ largest.orElse(\"\"));\n```\n\n`findFirst` 返回非集合中的第一个值。它在与 `filter` 结合时通常非常有用。例如，在这里我们找到字母\
  \ Q 开头的第一个单词，如果存在的话：\n\n```\nOptional<String> startsWithQ\n    = words.filter(s\
  \ -> s.startsWith(\"Q\")).findFirst();\n```\n\n\n如果你对任何匹配项都可以，而不只是第一个，请使用 `findAny`\
  \ 方法。当你对流进行并行处理时这种方法非常有效，因为流可以报告找到的任何匹配项，而不是受限于第一个。\n\n```\nOptional<String> startsWithQ\n\
  \    = words.parallel().filter(s -> s.startsWith(\"Q\")).findAny();\n```\n\n如果你只是想知道是否有匹配，请使用带有谓词参数的终端操作\
  \ `anyMatch`：\n\n```\nboolean aWordStartsWithQ\n    = words.parallel().anyMatch(s\
  \ -> s.startsWith(\"Q\"));\n```\n\n存在 `allMatch` 和 `noneMatch` 方法，当所有元素或没有元素匹配谓词时，它们返回\
  \ `true`。这些方法在并行运行时也能获益。\n\n`java.util.stream.Stream<T>8`\n\n* `Optional<T> max(Comparator<?\
  \ super T> comparator)`\n* `Optional<T> min(Comparator<? super T> comparator)`\n\
  \    返回此流的最大或最小元素，使用由给定比较器定义的排序；如果流为空，则返回一个空 `Optional`。这些是终端操作。\n* `Optional<T>\
  \ findFirst()`\n* `Optional<T> findAny()`\n    返回此流的第一个或任意元素；如果流为空，则返回一个空 `Optional`。这些是终端操作。\n\
  * `boolean anyMatch(Predicate<? super T> predicate)`\n* `boolean allMatch(Predicate<?\
  \ super T> predicate)`\n* `boolean noneMatch(Predicate<? super T> predicate)`\n\
  \    如果此流的任何、所有或没有元素匹配给定的谓词，则返回 `true`。这些是终端操作。\n\n## 1.7. Optional 类型\n\n`Optional<T>`\
  \ 对象是类型 `T` 的对象或无对象的封装。在一种情况下，我们说该值是 `present`（存在）的。`Optional<T>` 类型旨在作为类型 `T` 引用的更安全的替代方案，该引用要么指向对象要么为\
  \ `null`。但只有在你正确使用它时，它才是安全的。接三个章节将向你展示如何。\n\n### 1.7.1. 获取 Optional 值\n\n有效使用 `Optional`\
  \ 的关键是使用一种方法，该方法在值不存在时`产生备选方案`，或者仅在值存在时`消费该值`。\n\n在本节中，我们来看第一种策略。通常，当没有匹配时你可能想要使用一个默认值，例如空字符串：\n\
  \n```\nString result = optionalString.orElse(\"\");\n    // 封装的字符串，如果没有则为 \"\"\n\
  ```\n\n你也可以调用代码来计算默认值：\n\n```\nString result = optionalString.orElseGet(() -> System.getProperty(\"\
  myapp.default\"));\n    // 函数只有在需要时才被调用\n```\n\n或者在没有值时抛出异常：\n\n```\nString result\
  \ = optionalString.orElseThrow(IllegalStateException::new);\n    // 提供一个产生异常对象的方法\n\
  ```\n\n`java.util.Optional`8`\n\n* `T orElse(T other)`\n    \n    返回此 `Optional`\
  \ 的值，如果此 `Optional` 为空，则返回 `other`。\n* `T orElseGet(Supplier<? extends T> other)`\n\
  \    返回此 `Optional` 的值，如果此 `Optional` 为空，则返回调用 `other` 的结果。\n* `<X extends Throwable>\
  \ T orElseThrow(Supplier<? extends X> exceptionSupplier)`\n    返回此 `Optional` 的值，如果此\
  \ `Optional` 为空，则抛出调用 `exceptionSupplier` 的结果。\n\n### 1.7.2. 消费 Optional 值\n\n在上一节中，你已经看到了如何在值不存在时产生备选方案。处理可选值的另一种策略是仅在值存在时消费该值。\n\
  \n`ifPresent` 方法接受一个函数。如果 Optional 值存在，则将它传递给该函数。否则，什么都不会发生。\n\n```\noptionalValue.ifPresent(v\
  \ -> Process v);\n```\n\n例如，如果你想在值存在时将其添加到集合中，请调用\n\n```\noptionalValue.ifPresent(v\
  \ -> results.add(v));\n```\n\n或者简单地：\n\n```\noptionalValue.ifPresent(results::add);\n\
  ```\n\n如果你想在 `Optional` 有值时执行一个操作而在没值时执行另一个操作，请使用 `ifPresentOrElse`：\n\n```\noptionalValue.ifPresentOrElse(\n\
  \    v -> IO.println(\"Found \" + v),\n    () -> logger.warning(\"No match\"));\n\
  ```\n\n`java.util.Optional`8`\n\n* `void ifPresent(Consumer<? super T> action)`\n\
  \    如果此 `Optional` 非空，则将其值传递给 `action`。\n* `void ifPresentOrElse(Consumer<? super\
  \ T> action, Runnable emptyAction)`9\n    如果此 `Optional` 非空，则将其值传递给 `action`，否则调用\
  \ `emptyAction`。\n\n### 1.7.3. Optional 值的管道化\n\n在前面的章节中，你看到了如何从 `Optional` 对象中获取值。另一个有效的策略是保持\
  \ `Optional` 完整。你可以通过使用 `map` 方法转换 `Optional` 内部的值：\n\n```\nOptional<Path> transformed\
  \ = optionalString.map(Path::of);\n```\n\n如果 `optionalString` 为空，那么 `transformed`\
  \ 也是空的。\n\n这个 `map` 方法类似于你拥有的 `Stream` 接口中的 `map` 方法。同样，你可以使用 `flatmap` 来扁平化嵌套的\
  \ `Optional` 值。\n\n\n\n\n-   类型为 `Optional` 的方法参数是值得商榷的。在请求的值存在的常见情况下，它们会让调用变得不愉快。相反，可以考虑该方法的两个重载版本，一个带参数，一个不带参数。（另一方面，返回一个\
  \ `Optional` 是可以的。它是指示函数可能没有结果的正确方式。）\n-   不要将 `Optional` 对象放入 `set` 中，也不要将其作为 `map`\
  \ 的键。相反，应该收集这些值。\n\n`java.util.Optional`8\n\n- `T get()`\n- `T orElseThrow()`\n\
  \  返回此 `Optional` 的值，如果它为空，则抛出一个 `NoSuchElementException`。\n- `boolean isEmpty()`\n\
  - `boolean isPresent()`\n  如果此 `Optional` 为空或不为空，则返回 `true`。\n\n### 1.7.5. 创建 Optional\
  \ 值\n\n到目前为止，我们讨论了如何使用别人创建的 `Optional` 对象。如果你想写一个创建 `Optional` 对象的方法，有几个静态方法可以此目的，包括\
  \ `Optional.of(result)` 和 `Optional.empty()`。例如，\n\n```\npublic static Optional<Double>\
  \ inverse(Double x) {\n    return x == 0 ? Optional.empty() : Optional.of(1 / x);\n\
  }\n```\n\n`ofNullable` 方法旨在作为从可能为 `null` 值到可选值的桥梁。如果 `obj` 不是 `null`，则 `Optional.ofNullable(obj)`\
  \ 返回 `Optional.of(obj)`，否则返回 `Optional.empty()`。\n\n`java.util.Optional`8\n\n- `static\
  \ <T> Optional<T> of(T value)`\n- `static <T> Optional<T> ofNullable(T value)`\n\
  \  产生一个带有给定值的 `Optional`。如果 `value` 为 `null`，第一个方法会抛出 `NullPointerException`，而第二个方法产生一个空的\
  \ `Optional`。\n- `static <T> Optional<T> empty()`\n  产生一个空的 `Optional`。\n\n### 1.7.6.\
  \ 使用 `flatMap` 组合 Optional 值函数\n\n假设你有一个产生 `Optional<T>` 的方法 `f`，并且目标类型 `T` 有一个产生\
  \ `Optional<U>` 的方法 `g`。如果它们是普通方法，你可以通过调用 `s.f().g()` 来组合它们。但这种组合不可行，因为 `s.f()`\
  \ 的类型是 `Optional<T>`，而不是 `T`。相反，调用\n\n```\nOptional<U> result = s.f().flatMap(T::g);\n\
  ```\n\n如果 `s.f()` 存在，则对它应用 `g`。否则，返回一个空的 `Optional<U>`。\n\n显然，如果你有更多产生 `Optional`\
  \ 值的方法或 lambda 表达式，你可以重复该过程。你可以通过链式调用 `flatMap` 来构建一个步骤管道，该管道只有在所有部分都成功时才会成功。\n\n\
  例如，考虑上一节中安全的 `inverse` 方法。假设我们还有一个安全的平方根方法：\n\n```\npublic static Optional<Double>\
  \ squareRoot(Double x) {\n    return x < 0 ? Optional.empty() : Optional.of(Math.sqrt(x));\n\
  }\n```\n\n那么你就可以这样计算 `inverse` 的平方根：\n\n```\nOptional<Double> result = inverse(arg).flatMap(x\
  \ -> squareRoot(x));\n```\n\n我们可以通过从一个 `Optional` 开始来让这样的链看起来更规则：\n\n```\nOptional<Double>\
  \ result\n    = Optional.of(arg).flatMap(x -> inverse(x)).flatMap(x -> squareRoot(x));\n\
  ```\n\n使用方法表达式看起来会更整洁：\n\n```\nOptional<Double> result\n    = Optional.of(arg).flatMap(this::inverse).flatMap(this::squareRoot);\n\
  ```\n\n如果 `inverse` 方法或 `squareRoot` 方法任一返回 `Optional.empty()`，则结果为空。\n\n在这个示例中（取自\
  \ Listing 1.3），`inverse` 和 `squareRoot` 方法是实例方法。因此，方法表达式以 `this::` 开头。如果这些是静态方法，它们将以\
  \ `ClassName::` 前缀。\n\n你已经在 `Stream` 接口中见过 `flatMap` 方法（参见 第 1.3 节）。该方法将产生流的方法映射到流的所有元素上，然后平铺产生的流的流。`Optional.flatMap`\
  \ 方法的工作原理相同。通过将产生可选的方法映射到可选值，你得到一个可选的可选，然后它被平铺。\n\n`java.util.Optional`8\n\n- `<U>\
  \ Optional<U> flatMap(Function<? super T,? extends Optional<? extends U>> mapper)`\n\
  \  如果此 `Optional` 中的值存在，则产生将 `mapper` 应用于值的结果，否则产生空可选。\n\n### 1.7.7. 将 Optional\
  \ 转换为 Stream\n\n`stream` 方法将 `Optional<T>` 转换为具有零或一个元素的 `Stream<T>`。当然，为什么不呢，但你为什么要需要它？\n\
  \n这在返回 `Optional` 结果的方法中变得有用。假设你有一个用户 ID 流和一个方法\n\n```\nOptional<User> lookup(String\
  \ id)\n```\n\n你如何获取用户流，并跳过那些无效的 ID？\n\n当然，你可以过滤掉无效的 ID，然后对剩余部分应用 `get`：\n\n```\n\
  Stream<String> ids = . .\nStream<User> users = ids.map(Users::lookup)\n    .filter(Optional::isPresent)\n\
  \    .map(Optional::get);\n```\n\n但这使用了我们警告过的 `isPresent` 和 `get` 方法。更优雅的方法是调用\n\
  \n```\nStream<User> users = ids.map(Users::lookup)\n    .flatMap(Optional::stream);\n\
  ```\n\n每次调用 `stream` 都返回一个包含零或一个元素的流。`flatMap` 方法将它们全部合并。这意味着不存在的用户直接被丢弃了。\n\n在这一节中，我们考虑的是返回\
  \ `Optional` 值的理想情况。如今，许多方法在没有有效结果时返回 `null`。假设 `Users.classicLookup(id)` 返回一个 `User`\
  \ 对象或 `null`，而不是 `Optional<User>`。那么你当然可以过滤掉 `null` 值：\n\n```\nStream<User> users\
  \ = ids.map(Users::classicLookup)\n    .filter(Objects::nonNull);\n```\n\n但如果你更喜欢\
  \ `flatMap` 方法，可以使用\n\n\n\n```\nStream<User> users = ids.flatMap(\n    id -> Stream.ofNullable(Users.classicLookup(id)));\n\
  ```\n\n或者\n\n```\nStream<User> users = ids.map(Users::classicLookup)\n    .flatMap(Stream::ofNullable);\n\
  ```\n\n调用 `Stream.ofNullable(obj)` 在 `obj` 为 `null` 时产生一个空流，否则产生一个仅包含 `obj` 的流。\n\
  \n示例程序 Listing 1.3 演示了 `Optional` API。\n\nListing 1.3 v2ch01/optional/OptionalDemo.java\n\
  \n\n\n\n\n```java\npackage v2ch01.optional;\n\nimport module java.base;\n\nclass\
  \ OptionalDemo {\n    void main() throws Exception {\n        String contents =\
  \ Files.readString(Path.of(\"gutenberg\", \"alice30.txt\"));\n        List<String>\
  \ wordList = List.of(contents.split(\"\\\\PL+\"));\n\n        Optional<String> optionalValue\
  \ = wordList\n                .stream()\n                .filter(s -> s.contains(\"\
  fred\"))\n                .findFirst();\n        IO.println(optionalValue.orElse(\"\
  No word\") + \" contains fred\");\n\n        Optional<String> optionalString = Optional.empty();\n\
  \        String result = optionalString.orElse(\"N/A\");\n        IO.println(\"\
  result: \" + result);\n        result = optionalString.orElseGet(() -> Locale.getDefault().getDisplayName());\n\
  \        IO.println(\"result: \" + result);\n        try {\n            result =\
  \ optionalString.orElseThrow(IllegalStateException::new);\n            IO.println(\"\
  result: \" + result);\n        }\n        catch (Throwable t) {\n            t.printStackTrace(System.out);\n\
  \        }\n\n        optionalValue = wordList.stream().filter(s -> s.contains(\"\
  red\")).findFirst();\n        optionalValue.ifPresent(s -> IO.println(s + \" contains\
  \ red\"));\n\n        var results = new HashSet<String>();\n        optionalValue.ifPresent(results::add);\n\
  \        Optional<Boolean> added = optionalValue.map(results::add);\n        IO.println(added);\n\
  \n        IO.println(inverse(4.0).flatMap(this::squareRoot));\n        IO.println(inverse(-1.0).flatMap(this::squareRoot));\n\
  \        IO.println(inverse(0.0).flatMap(this::squareRoot));\n        Optional<Double>\
  \ result2 = Optional.of(-4.0)\n                .flatMap(this::inverse)\n       \
  \         .flatMap(this::squareRoot);\n        IO.println(result2);\n    }\n\n \
  \   Optional<Double> inverse(Double x) {\n        return x == 0 ? Optional.empty()\
  \ : Optional.of(1 / x);\n    }\n\n    Optional<Double> squareRoot(Double x) {\n\
  \        return x < 0 ? Optional.empty() : Optional.of(Math.sqrt(x));\n    }\n}\n\
  ```\n\n`java.util.Optional` 8\n\n- `<U> Optional<U> flatMap(Function<? super T,Optional<U>>\
  \ mapper)` 9\n  产生将 `mapper` 应用于此 `Optional` 值的的结果；如果此 `Optional` 为空，则返回一个空的 `Optional`。\n\
  \n## 1.8. 收集结果\n\n当你完成流操作后，通常想要查看结果。你可以调用 `iterator` 方法，它会产生一个旧式的迭代器，你可以用它来访问元素。\n\
  \n或者，你可以调用 `forEach` 方法对每个元素应用一个函数：\n\n```\nstream.forEach(IO::println);\n```\n\n\
  在并行流上，`forEach` 方法以任意顺序遍历元素。如果你想按照流的顺序处理它们，请改用 `forEachOrdered`。当然，你可能会因此放弃部分或全部并行带来的益处。\n\
  \n但大多数情况下，你可能希望将结果收集到数据结构中。你已经见过 `toList` 方法，它会产生一个流元素的列表。\n\n调用 `toArray` 来获取流元素的数组。\n\
  \n由于无法在运行时创建泛型数组，表达式 `stream.toArray()` 返回一个 `Object[]` 数组。如果你需要正确类型的数组，请传入数组构造函数：\n\
  \n```\nString[] result = stream.toArray(String[]::new);\n// stream.toArray() 的类型为\
  \ Object[]\n```\n\n为了将结果收集到其他数据结构中，`Stream` 接口有一个泛型的 `collect` 方法。你可以将结果拼接成字符串，将它们存储在任何集合中，并插入\
  \ map 中。通过实现你自己的收集器（collector），你可以以任意方式消耗流数据。你将在后续章节中看到细节。\n\n`java.util.stream.BaseStream`\
  \ 8\n\n- `Iterator<T> iterator()`\n  产生一个用于获取此流元素的迭代器。这是一个终端操作。\n\n`java.util.stream.Stream<T>`\
  \ 8\n\n- `List<T> toList()` 16\n  产生此流中元素的列表。\n- `void forEach(Consumer<? super\
  \ T> action)`\n  对流中的每个元素调用 `action`。\n- `Object[] toArray()`\n- `<A> A[] toArray(IntFunction<A[]>\
  \ generator)`\n  产生一个对象数组，或者当传入构造器引用 `A[]::new` 时产生类型 `A` 的数组。这些都是终端操作。\n- `<R,A>\
  \ R collect(Collector<? super T,A,R> collector)`\n  使用指定的收集器收集流中的元素。`Collectors`\
  \ 类为许多收集器提供了工厂方法。\n\n## 1.9. Collectors (Collectors)\n\n为了将流元素收集到另一个目标，有一个方便的 `collect`\
  \ 方法接收 `Collector` 接口的实例。`collector` 是累积元素并产生结果的对象。`Collectors` 类为常见的收集器提供了大量的工厂方法。\n\
  \n假设你想通过拼接流中所有的字符串。你可以调用：\n\n```\nString result = stream.collect(Collectors.joining());\n\
  ```\n\n如果你想在元素之间添加分隔符，请将其传递给 `joining` 方法：\n\n```\nString result = stream.collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你的流包含除字符串以外的对象，你需要先将它们转换为字符串，如下：\n\n```\nString result = stream.map(Object::toString).collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你想将流结果归约为和、计数、平均值、最大值或最小值，请使用其中一个 `summarizing`(`Int`|`Long`|`Double`)\
  \ 方法。这些方法接收一个将流对象映射为数字的函数，并产生类型为 (`Int`|`Long`|`Double`) `SummaryStatistics` 的结果，同时计算和、计数、平均值、最大值和最小值。\n\
  \n```\nIntSummaryStatistics summary = stream.collect(\n    Collectors.summarizingInt(String::length));\n\
  double averageWordLength = summary.getAverage();\ndouble maxWordLength = summary.getMax();\n\
  ```\n\n注意，你并不是流上调用 `joining` 和 `summarizingInt` 方法。这些是 `Collectors` 类的静态方法。它们产生\
  \ `Collector` 实例并将其传递给 `Stream` 接口的 `collect` 方法。\n\n`joining` 收集器产生字符串，而 `summarizing`\
  \ 收集器产生四个数字。然而，大多数收集器会将值收集在数据结构中，正如你将在后续章节看到的。\n\nListing 1.5 中的示例程序展示了如何从流中收集元素。\n\
  \nListing 1.4 v2ch01/collecting/CollectingResults.java\n\n\n\n\n\n```java\npackage\
  \ v2ch01.collecting;\n\nimport module java.base;\n\nclass CollectingResults {\n\
  \    void main() throws Exception {\n        // 将流 转换为迭代器\n        Iterator<Integer>\
  \ iter = Stream.iterate(0, n -> n + 1).limit(10).iterator();\n        while (iter.hasNext())\n\
  \            IO.println(iter.next());\n\n        Object[] numbers = Stream.iterate(0,\
  \ n -> n + 1).limit(10).toArray();\n        IO.println(\"Object array: \" + numbers\
  \ + \" \" + Arrays.toString(numbers));\n        // 注意它是一个 Object[] 数组\n\n      \
  \  try {\n            var number = (Integer) numbers[0]; // OK\n            IO.println(\"\
  number: \" + number);\n            IO.println(\"The following statement throws an\
  \ exception:\");\n            var _ = (Integer[]) numbers; // 抛出异常\n        }\n\
  \        catch (ClassCastException e) {\n            IO.println(e);\n        }\n\
  \n        Integer[] numbers3 = Stream.iterate(0, n -> n + 1).limit(10).toArray(Integer[]::new);\n\
  \        IO.println(\"Integer array: \" + numbers3 + \" \" + Arrays.toString(numbers3));\n\
  \        // 注意它是一个 Integer[] 数组\n\n        String result = noVowels().limit(10).collect(Collectors.joining());\n\
  \        IO.println(\"Joining: \" + result);\n        result = noVowels().limit(10).collect(Collectors.joining(\"\
  , \"));\n        IO.println(\"Joining with commas: \" + result);\n\n        IntSummaryStatistics\
  \ summary = noVowels()\n                .collect(Collectors.summarizingInt(String::length));\n\
  \        double averageWordLength = summary.getAverage();\n        double maxWordLength\
  \ = summary.getMax();\n        IO.println(\"Average word length: \" + averageWordLength);\n\
  \        IO.println(\"Max word length: \" + maxWordLength);\n        IO.println(\"\
  forEach:\");\n        noVowels().limit(10).forEach(IO::println);\n    }\n\n    Stream<String>\
  \ noVowels() throws IOException {\n        String contents = Files.readString(Path.of(\"\
  gutenberg\", \"alice30.txt\"));\n        Stream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n        return words.map(s -> s.replaceAll(\"[aeiouAEIOU]\", \"\"\
  ));\n    }\n\n    <T> void show(String label, Set<T> set) {\n        IO.print(label\
  \ + \": \" + set.getClass().getName());\n        IO.println(\"[\"\n            +\
  \ set.stream().limit(10).map(Object::toString).collect(Collectors.joining(\", \"\
  ))\n            + \"]\");\n    }\n}\n```\n\n`java.util.stream.Collectors`8\n\n*\
  \   `static Collector<CharSequence,?,String> joining()`\n*   `static Collector<CharSequence,?,String>\
  \ joining(CharSequence delimiter)`\n*   `static Collector<CharSequence,?,String>\
  \ joining(CharSequence delimiter, CharSequence prefix, CharSequence suffix)`\n\n\
  \    返回一个连接字符串的收集器。分隔符放在字符串之间，前缀和后缀放在第一个字符串之前和最后一个字符串之后。如果未指定，这些将为空字符串。\n\n*   `static\
  \ <T> Collector<T,?,IntSummaryStatistics> summarizingInt(ToIntFunction<? super T>\
  \ mapper)`\n*   `static <T> Collector<T,?,LongSummaryStatistics> summarizingLong(ToLongFunction<?\
  \ super T> mapper)`\n*   `static <T> Collector<T,?,DoubleSummaryStatistics> summarizingDouble(ToDoubleFunction<?\
  \ super T> mapper)`\n\n    返回产生（`Int`|`Long`|`Double`）`SummaryStatistics` 对象的收集器，通过该对象你可以获取将\
  \ `mapper` 应用于每个元素的结果计数、总和、平均值、最大值和最小值。\n\n`java.util.IntSummaryStatistics`8\n\n\
  `java.util.LongSummaryStatistics`8\n\n`java.util.DoubleSummaryStatistics`8\n\n*\
  \   `long getCount()`\n\n    返回汇总元素的计数。\n*   `xxx` `getSum()`\n*   `double getAverage()`\n\
  \n    返回汇总元素的总和或平均值，如果没有元素则返回零。\n*   `xxx` `getMax()`\n*   `xxx` `getMin()`\n\n\
  \    返回汇总元素的最大值或最小值，如果没有元素则返回 (`Integer`|`Long`|`Double`).(`MAX`|`MIN`)`_VALUE`。\n\
  \n### 1.9.1. 收集到集合\n\n在 Java 16 添加 `toList` 方法之前，你必须使用由 `Collectors.toList()` 产生的收集器：\n\
  \n```\nList<String> result = stream.collect(Collectors.toList());\n```\n\n同样，这里是你可以将流元素收集到集合的方法：\n\
  \n```\nSet<String> result = stream.collect(Collectors.toSet());\n```\n\n这些调用会给你一个列表或集合，但无法无法任何进一步的假设。该集合可能是不可变的、可序列化的或线程安全的。如果你想控制获取什么种类型的集合，请使用以下调用：\n\
  \n```\nTreeSet<String> result = stream.collect(Collectors.toCollection(TreeSet::new));\n\
  ```\n\nListing 1.5 中的示例展示了如何将流元素放入集合。\n\nListing 1.5 v2ch01/collecting/CollectingResults.java\n\
  \n```java\npackage v2ch01.collecting;\n\nimport module java.base;\n\nclass CollectingResults\
