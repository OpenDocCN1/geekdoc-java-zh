  \ 接口以及二进制流之间进行调解。详情请参阅 `SQLXML` 类的 API 文档。\n\n我们不再进一步讨论这些高级 SQL 类型。你可以在 *JDBC API\
  \ Tutorial and Reference* 以及 JDBC 规范中找到关于这些主题的更多信息。\n\n## 5.10. Web 和企业级应用中的连接管理\n\
  \n前节介绍的通过 `database.properties` 文件的简单数据库连接设置适用于小型测试程序，但对于较大的应用程序来说无法扩展。\n\n当 JDBC\
  \ 应用部署在 Web 或企业环境中时，数据库连接的管理将集成到一个名为 JNDI（Java 命名和目录接口）的服务中。跨越整个企业的数据源属性可以存储在目录中。使用目录可以对用户名、密码、数据库名称和\
  \ JDBC URL 进行集中管理。\n\n在这样的环境中，你可以使用以下代码来建立数据库连接：\n\n```java\nvar jndiContext = new\
  \ InitialContext();\nvar source = (DataSource) jndiContext.lookup(\"java:comp/env/jdbc/corejava\"\
  );\nConnection conn = source.getConnection();\n```\n\n注意，`DriverManager` 不再参与其中。相反，JNDI\
