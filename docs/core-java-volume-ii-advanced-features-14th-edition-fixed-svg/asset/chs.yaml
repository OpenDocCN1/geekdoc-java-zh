  \n## 栅格图像\n\nJava2D 允许你创建由线条、曲线和区域组成的图形。它是一个“矢量”API，因为你指定形状的数学属性。然而，对于处理由像素组成的图像，你需要处理“栅格”数据。\n\
  \n### 图像的读取器和写入器\n\n`javax.imageio` 包对某些常见格式提供了内置支持，并提供了一个允许第三方添加其他格式的读取器和写入器的框架。GIF、JPEG、PNG、BMP（Windows\
  \ 位图）和 WBMP（无线位图）格式都是支持的。\n\n该库的基础非常简单。要加载图像，使用 `ImageIO` 类的静态 `read` 方法：\n\n```java\n\
  File f = . . .;\nBufferedImage image = ImageIO.read(f);\n```\n\n`ImageIO` 类根据文件类型选择合适的读取器。它可能会咨询文件扩展来实现目的。如果没有找到合适的读取器，或者读取器无法解码文件内容，`read`\
  \ 方法将返回 `null`。\n\n将图像写入文件同样简单：\n\n```java\nFile f = . . .;\nString format = . .\
  \ .;\nImageIO.write(image, format, f);\n```\n\n在这里，format 是识别图像格式的字符串（例如 `\"JPEG\"\
  ` 或 `\"PNG\"`）。`ImageIO` 类选择合适的写入器并保存文件。\n\n### 获取图像文件类型的读取器和写入器\n\n对于超出 `ImageIO`\
  \ 静态 `read` 和 `write` 方法的高级图像操作，你首先需要获取 `ImageReader` 和 `ImageWriter` 对象。`ImageIO`\
  \ 类列出匹配以下任意内容的读取器和写入器：\n\n*   图像格式（例如 `\"JPEG\"`）\n\n*   文件后缀（例如 `\"jpg\"`）\n\n\
  *   MIME 类型（例如 `\"image/jpeg\"`）\n\nMIME 是多用途邮件扩展标准。MIME 定义了常见的数据格式，例如 `image/jpeg`\
  \ 和 `application/pdf`。\n\n例如，你可以获取一个读取 JPEG 文件的读取器：\n\n\n\n\n\n```\nImageReader\
  \ reader = null;\nIterator<ImageReader> iter = ImageIO.getImageReadersByFormatName(\"\
  JPEG\");\nif (iter.hasNext()) reader = iter.next();\n```\n\n`getImageReadersBySuffix`\
  \ 和 `getImageReadersByMIMEType` 方法会列出匹配文件扩展名或 MIME 类型的读取器。\n\n`ImageIO` 类可能会找到多个都能读取特定图像类型的读取器。在这种情况下，你必须从中选择一个，但目前并不清楚如何决定哪一个是最好的。要获取有关读取器的更多信息，可以获取其服务提供者接口（SPI）：\n\
  \n```\nImageReaderSpi spi = reader.getOriginatingProvider();\n```\n\n然后你就可以获取厂商名称和版本号：\n\
  \n```\nString vendor = spi.getVendor();\nString version = spi.getVersion();\n```\n\
  \n也许这些信息可以帮助你在多个选项中做出决定——或者你也可以直接向程序用户展示读取器列表，让他们让他们自己选择。目前，我们假设第一个列出的读取器就足够了。\n\
  \n在 Listing 12.20 的示例程序中，我们想要找到所有可用读取器的所有文件后缀，以便将它们用于文件过滤器。请使用静态方法 `ImageIO.getReaderFileSuffixes`\
  \ 来实现此目的：\n\n```\nString[] extensions = ImageIO.getWriterFileSuffixes();\nchooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"Image files\", extensions));\n```\n\n对于保存文件，我们需要更大的努力。我们希望向用户展示包含所有支持的图像类型的菜单。遗憾的是，`ImageIO`类的\
  \ `getWriterFormatNames` 返回的是一个相当奇怪的列表，其中包含冗余名称，例如\n\n```\njpg, BMP, bmp, JPG, jpeg,\
  \ wbmp, png, JPEG, PNG, WBMP, GIF, gif, TIFF, tif, tiff\n```\n\n这不是人们希望在菜单中看到的内容。需要的是一个“首选”格式名称列表。Listing\
  \ 12.20 中的辅助方法 `getWriterFormats` 会查找与每个格式名称关联的第一个写入器，并询问它的格式名称是什么，以希望它能将最流行的格式列在最前面。事实上，对于\
  \ JPEG 写入器，这种方法运行良好——它在其他选项之前列出了 `\"JPEG\"`。另一方面，PNG 写入器在 `\"PNG\"` 之前列出了小写的 `\"\
  png\"`。因此，为了一致性，辅助方法强制将小写名称转换为大写。\n\n### 12.6.3. 使用多幅图像读写文件\n\n某些文件——特别是动画 GIF 文件——包含多个图像。`ImageIO`\
  \ 类的 `read` 方法读取单个图像。要读取多个图像，请将输入源（例如输入流或文件）转换为 `ImageInputStream`。\n\n```\nInputStream\
  \ in = . . .;\nImageInputStream imageIn = ImageIO.createImageInputStream(in);\n\
  ```\n\n然后，将图像输入流附加到读取器：\n\n```\nreader.setInput(imageIn, true);\n```\n\n第二个参数表示输入处于“仅允许向前寻”模式。否则，将使用随机访问，通过在读取时缓冲流输入或使用随机文件访问来实现。某些操作需要随机访问。例如，要找到\
  \ GIF 文件中的图像数量，你需要读取整个文件。如果你随后想获取图像，则必须再次读取输入。\n\n这种考虑仅在你从流中读取、输入包含多个图像，且图像格式没有在头文件中包含你所请求的信息（如图像计数）时才重要。如果你从文件读取，简单地使用：\n\
  \n```\nFile f = . . .;\nImageInputStream imageIn = ImageIO.createImageInputStream(f);\n\
  reader.setInput(imageIn);\n```\n\n一旦你有了读取器，就可以通过调用来读取输入中的图像：\n\n```\nBufferedImage\
  \ image = reader.read(index);\n```\n\n其中 `index` 是图像索引，从 `0` 开始。\n\n如果输入处于“仅允许向前寻”模式，你将继续读取图像，直到\
  \ `read` 方法抛出 `IndexOutOfBoundsException` 为止。否则，你可以调用 `getNumImages` 方法：\n\n```\n\
  int n = reader.getNumImages(true);\n```\n\n在这里，参数表示你允许搜索输入以确定图像数量。如果输入处于“仅允许向前寻”模式，该方法将抛出\
  \ `IllegalStateException`。或者，你可以将“允许搜索”参数设置为 `false`。那么如果无法在不搜索的情况下确定图像数量，`getNumImages`\
  \ 方法将返回 `-1`。在这种情况下，你将不得不切换到 B 计划并继续读取图像直到获取 `IndexOutOfBoundsException`。\n\n某些文件包含缩略图——用于预览的图像较小版本。你可以通过调用获取图像的缩略图数量：\n\
  \n```\nint count = reader.getNumThumbnails(index);\n```\n\n然后你获取特定索引：\n\n```\nBufferedImage\
  \ thumbnail = reader.getThumbnail(index, thumbnailIndex);\n```\n\n有时你可能想在实际获取图像之前先获取图像尺寸——特别是当图像非常巨大或来自缓慢的网络连接时。使用以下调用：\n\
  \n```\nint width = reader.getWidth(index);\nint height = reader.getHeight(index);\n\
  ```\n\n来获取给定索引图像的尺寸。\n\n要写入带有多幅图像的文件，首先你需要一个 `ImageWriter`。`ImageIO` 类可以列出能够写入特定格式的写入器：\n\
  \n```\nString format = . . .;\nImageWriter writer = null;\nIterator<ImageWriter>\
  \ iter = ImageIO.getWritersByName(format);\nif (iter.hasNext()) writer = iter.next();\n\
  ```\n\n接下来，将输出流或文件转换为 `ImageOutputStream` 并将其附加到写入器。例如：\n\n```\nFile f = . . .;\n\
  ImageOutputStream imageOut = ImageIO.createImageOutputStream(f);\nwriter.setOutput(imageOut);\n\
  ```\n\n你必须将每个图像封装成 `IIOImage` 对象。你可以可选地提供缩略图列表和元数据（如压缩算法和颜色信息）。在示例中，我们对两者都使用 `null`；更多信息请参见\
  \ API 文档。\n\n```\nIIOImage iioImage = new IIOImage(images[i], null, null);\n```\n\
  \n写入*第一*幅图像使用 `write` 方法：\n\n```\nwriter.write(new IIOImage(images[0], null, null));\n\
  ```\n\n对于后续图像，使用：\n\n```\nif (writer.canInsertImage(i))\n    writer.writeInsert(i,,\
  \ null);\n```\n\n第三个参数可以包含 `ImageWriteParam` 对象以设置图像写入细节，例如分块和压缩；使用 `null` 使用默认值。\n\
  \n并不是所有文件格式都能处理多幅图像。在这种情况下，当 `i > 0` 时，`canInsertImage` 方法返回 `false`，并且只保存单幅图像。\n\
  \nListing 12.20 中的程序允许你加载和保存 Java 库提供的格式的文件。该程序显示多幅图像（参见图 12.55），但不显示缩略图。\n\n![Figure](img/fig07-27.jpg)图\
  \ 12.55: 一幅动画 GIF 图像\n\n\n\n\n\n```java\npackage v2ch12.imageIO;\n\nimport module\
  \ java.base;\nimport module java.desktop;\nimport java.util.List;\n\n/**\n * 此框架显示加载的图像。菜单包含加载和保存文件的菜单项。\n\
  \ */\npublic class ImageIOFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
