  \ APIs）。\n\n### 7.1.2. 指定区域设置 (Locales)\n\n区域设置由最多五个组件组成：\n\n1.  一种语言，由两个或三个小写字母指定，如\
  \ `en`（英语）、`de`（德语）或 `zh`（中文）。表 7.1 显示了常用代码。\n\n2.  可选的脚本（script），由首字母大写的四个字母指定，如\
  \ `Latn`（拉丁语）、`Cyrl`（西里字母）或 `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁字母或西里字母编写，而且某些中文读者更倾向于繁体字而非简体字。\n\
  \n3.  可选的国家或地区，由两个大写字母或三个数字指定，如 `US`（美国）或 `CH`（瑞士）。表 7.2 显示了常用代码。\n\n4.  可选的变体（variant），用于指定方言或拼写规则等杂项特征。变体现在很少使用。挪威语曾有一个“尼诺挪尔语”（Nynorsk）变体，但现在用不同的语言代码\
  \ `nn` 表示。以前用于日本皇历和泰国数字的变体现在被用扩展来表示（见下一项）。\n\n5.  可选的扩展（extension）。扩展描述了对日历（如日本历）、数字（使用泰国数字而非西方数字）等的本地偏好。Unicode\
  \ 标准规定了其中一些扩展。扩展以 `u-` 开头，后跟一个两个字母的代码，指定该扩展处理日历（`ca`）、数字（`nu`）等。例如，扩展 `u-nu-thai`\
  \ 表示使用泰国数字。其他扩展完全任意的，并以 `x-` 开头，例如 `x-java`。\n\n区域设置的规则在互联网工程任务组的“最佳当前实践”备录 BCP\
  \ 47 中制定（[`www.rfc-editor.org/info/bcp47`](https://www.rfc-editor.org/info/bcp47)）。你可以在\
  \ [`www.w3.org/International/articles/language-tags`](https://www.w3.org/International/articles/language-tags)\
  \ 找到更易于理解的总结。\n\n表 7.1：常用 ISO 639-1 语言代码\n\n| 语言 | 代码 | 语言 | 代码 |\n| :--- | :---\
