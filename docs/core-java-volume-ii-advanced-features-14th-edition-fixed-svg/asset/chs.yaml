  \n*   `int getRGB(Object data)`\n    返回与传入 `data` 数组的样本数据对应的 ARGB 值。其元素类型和长度取决于颜色模型。\n\
  \n*   `Object getDataElements(int argb, Object data)`\n    返回颜色值的样本数据。如果 `data`\
  \ 不是 `null`，则假设它是一个适合持有样本数据的数组并会被填充。如果 `data` 是 `null`，则分配新数组。`data` 是一个填充了像素样本数据的数组。其元素类型和长度取决于颜色模型。\n\
  \n`java.awt.Color`1.0\n\n*   `Color(int argb, boolean hasAlpha)`1.2\n    如果 `hasAlpha`\
  \ 为 `true`，则带有指定组合 ARGB 值的颜色；如果 `hasAlpha` 为 `false`，则带有指定 RGB 值的。\n\n*   `int getRGB()`\n\
  \    返回对应此颜色的 ARGB 颜色值。\n\n### 12.6.5. 过滤图像\n\n在前面的节中，你看到了如何从零构建图像。然而，通常你访问图像数据是为了另一个原因：你已经有了一张图像，并想以某种方式改进它。\n\
  \n\n\n\n当然，你可以使用上一节中看到的 `getPixel/getDataElements` 方法来读取图像数据、对其进行处理并写回。幸运的是，Java\
  \ 2D API 已经提供了许多 `filters`，可以为你完成常见的图像处理操作。\n\n所有的图像处理操作都实现了 `BufferedImageOp` 接口。在构建好操作后，只需调用\
  \ `filter` 方法即可将一个图像转换为另一个图像。\n\n```\nBufferedImageOp op = . . .;\nBufferedImage\
  \ filteredImage\n    = new BufferedImage(image.getWidth(), image.getHeight(), image.getType());\n\
  op.filter(image, filteredImage);\n```\n\n某些操作可以在原地转换图像（`op.filter(image, image)`），但大多数操作不能。\n\
  \n有五个类实现了 `BufferedImageOp` 接口：\n\n```\nAffineTransformOp\nRescaleOp\nLookupOp\n\
  ColorConvertOp\nConvolveOp\n```\n\n`AffineTransformOp` 对像素执行仿射变换。例如，以下是关于绕图像中心旋转图像：\n\
  \n```\nAffineTransform transform = AffineTransform.getRotateInstance(Math.toRadians(angle),\n\
  \    image.getWidth() / 2, image.getHeight() / 2);\nvar op = new AffineTransformOp(transform,\
  \ interpolation);\nop.filter(image, filteredImage);\n```\n\n`AffineTransformOp`\
  \ 构造函数需要一个仿射变换和一个 `interpolation` 策略。如果源像素变换到了目标像素之间的位置，就需要插值来确定目标图像像素。例如，如果你旋转源像素，它们通常不会正好落在目标像素上。有三种插值策略：`AffineTransformOp.TYPE_BICUBIC`、`AffineTransformOp.TYPE_BILINEAR`\
  \ 和 `AffineTransformOp.TYPE_NEAREST_NEIGHBOR`。双立方插值花费的时间稍长，但视觉效果比另外两种更好。\n\n列表 12.22\
  \ 中的程序允许你将图像旋转 5 度（参见图 12.57）。\n\n![Figure](img/fig07-29.jpg)图 12.57：旋转后的图像\n\n\
  `RescaleOp` 对图像中的每个颜色分量执行缩放操作\n\n`x[new] = a · x + b`\n\n（Alpha 分量不受影响）。使用 `a >\
  \ 1` 进行缩放的效果是调亮图像。通过指定缩放参数和可选的渲染提示来构建 `RescaleOp`。在列表 12.22 中，我们使用了：\n\n```\nfloat\
  \ a = 1.1f;\nfloat b = 20.0f;\nvar op = new RescaleOp(a, b, null);\n```\n\n你也可以为每个颜色分量提供单独的缩放值——参见\
  \ API 说明。\n\n`LookupOp` 操作允许你指定采样值的任意映射。提供一个表来指定每个值如何映射。在示例程序中，我们计算所有颜色的 `negative`（反色），将颜色\
  \ `c` 变为 `255 - c`。\n\n`LookupOp` 构造函数需要一个 `LookupTable` 类型的对象和一个可选提示的映射。`LookupTable`\
  \ 类是抽象类，有两个子类：`ByteLookupTable` 和 `ShortLookupTable`。由于颜色值是字节，因此 `ByteLookupTable`\
  \ 就足够了。以下是我们为示例构建 `LookupOp` 的方式：\n\n```\nvar negative = new short[256];\nfor (int\
  \ i = 0; i < 256; i++) negative[i] = (short) (255 - i);\nvar table = new ShortLookupTable(0,\
  \ negative);\nvar op = new LookupOp(table, null);\n```\n\n\n\n\n```java\npackage\
