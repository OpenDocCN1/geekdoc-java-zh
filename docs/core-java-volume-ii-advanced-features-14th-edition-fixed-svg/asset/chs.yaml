  \    }\n}\n```\n\n### 11.5.7. 工具栏\n\n工具栏是一个按钮栏，提供了快速访问程序中最常用命令的方法（参见图 11.22）。\n\n\
  ![Figure](img/toolbar1.jpg)图 11.22：工具栏\n\n工具栏特殊之处在于你可以将其移动到其他地方。你可以将工具栏拖到框架的四个边界之一（参见图\
  \ 11.23）。当你释放鼠标按钮时，工具栏将落在新位置（参见图 11.24）。\n\n![Figure](img/toolbar2.jpg)图 11.23:\
  \ 拖动工具栏![Figure](img/toolbar3.jpg)图 11.24: 工具栏已拖动到另一个边界\n\n如果工具栏位于具有边界布局（border\
  \ layout）的容器内，或者任何支持 `North`、`East`、`South` 和 `West` 的布局管理器中，工具栏拖动就可以生效。工具栏甚至可以从框架中分离（参见图\
  \ 11.25）。当关闭框架时，工具栏会包含在框架中。\n\n![Figure](img/toolbar4.jpg)图 11.25：工具栏\n\n按钮是工具栏中最常见的组件。但对你可以其中添加的组件没有限制。例如，你可以向工具栏添加组合框。\n\
  \n### 11.5.8. 提示\n\n工具栏的一个缺点是用户往往对工具栏中微小图标的含义感到困惑。为了解决这个问题，用户界面设计师发明了*提示（tooltips）*。当光标悬停在按钮上一会儿时，提示就会激活。提示文本显示在颜色的矩形内。当用户移动鼠标时，提示就会消失（参见图\
  \ 11.26）。\n\n![Figure](img/toolbar5.jpg)图 11.26：提示\n\n在 Swing 中，你只需通过调用 `setToolTipText`\
  \ 方法即可为任何 `JComponent` 添加提示：\n\n```\nexitButton.setToolTipText(\"Exit\");\n```\n\
  \n或者，如果你使用 `Action` 对象，则将提示与 `SHORT_DESCRIPTION` 键关联：\n\n```\nexitAction.putValue(Action.SHORT_DESCRIPTION,\
  \ \"Exit\");\n```\n\n`javax.swing.JToolBar`1.\n\n*   `JToolBar()`\n\n*   `JToolBar(String\
  \ titleString)`\n\n*   `JToolBar(int orientation)`\n\n*   `JToolBar(String titleString,\
  \ int orientation)`\n\n    根据给定的标题字符串和方向创建一个工具栏。`orientation` 是 `SwingConstants.HORIZONTAL`（默认值）或\
  \ `SwingConstants.VERTICAL` 之一。\n\n*   `JButton add(Action a)`\n\n    根据给定的动作从名称、图标、短描述和动作回调，在工具栏内部创建一个新按钮，并将该按钮添加到工具栏的末尾。\n\
  \n*   `void addSeparator()`\n\n    在工具栏末尾添加一个分隔符。\n\n`javax.swing.JComponent`1.\n\
  \n*   `void setToolTipText(String text)`\n\n    设置当鼠标悬停在组件上时应作为提示显示的文本。\n\n\n\n\n\
  \n到为止，我们在示例应用程序的用户界面中只使用了边界布局（border layout）、流布局（flow layout）和网格布局（grid layout）。对于更复杂的任务，这些是不够的。\n\
  \n自 Java 1.0 以来，AWT 就包含了 `grid bag layout`，它以行和列的形式来布局组件。行和列的大小是灵活的，组件可以跨越多行多列。这种布局管理器非常灵活，但也非常复杂。仅仅是“grid\
  \ bag layout”这几个词，就让许多 Java 程序员感到恐惧。\n\n在尝试设计一种能让程序员从 grid bag layout 的暴政中解脱出来的布局管理器的尝试中，Swing\
  \ 设计者提出了 `box layout`。根据 `BoxLayout` 类的 JDK 文档：“将多个具有不同水平和垂直[*sic*]组合的面板嵌套在一起，可以产生类似于\
  \ `GridBagLayout` 的效果，而不会具有其复杂性。”然而，由于每个框都是独立布局的，你无法使用 box 布局同时在水平和垂直方向上排列相邻的组件。\n\
  \nJava 1.4 出现了另一个尝试设计 grid bag layout 替代方案的尝试——`spring layout`，你使用虚拟的弹簧来连接容器中的组件。当容器调整大小时，弹簧会拉伸或收缩，从而调整组件的位置。这听起来既乏味又混乱，事实也如此。spring\
  \ layout 很快就被淘汰了。\n\nNetBeans IDE 结合了一个布局工具（称为“Matisse”）和一个布局管理器。用户界面设计师使用该工具将组件拖入容器中，并指示哪些组件应该对齐。该工具将设计者的意图翻译成针对\
  \ `group layout manager` 的指令。这比手动编写布局管理代码要方便得多。\n\n在接下来的章节中，我将介绍 grid bag layout，因为它被广泛使用，并且仍然通过程序生成布局代码最简单的机制。我将向你展示一种策略，让\
  \ grid bag layout 在常用情况下变得相对不那么痛苦。\n\n### 11.6.1 Grid Bag 基础\n\ngrid bag layout\
  \ 是所有布局管理器的母体。你可以将 grid bag layout 想象成没有限制的网格布局。在 grid bag layout 中，行和列可以有不同的尺寸。你可以合并相邻的单元格为更大的组件留出空间。（许多文字处理器以及\
  \ HTML 都为表格提供了类似的功能：你可以从网格开始，然后根据需要合并相邻单元格。）组件不需要填充整个单元格区域，你可以指定它们在单元格内的对齐方式。\n\n\
  考虑图 11.27 中的字体选择器。它由以下组件组成：\n\n*   两个用于指定字体类型和大小的组合框框（combo boxes）\n*   用于这两个组合框的标签\n\
  *   两个用于选择粗体和斜体的复选框\n*   一个用于示例字符串的文本区域\n\n![Figure](img/gridbaglayouttest.jpg)图\
  \ 11.27：字体选择器\n\n现在，将容器分割成一个单元格网格，如图图 11.28 所示。（行和列的大小不需要相等。）每个复选框跨越两列，文本区域跨越四行。\n\
  \n.图 11.28：设计中使用的对话框网格\n\n要向 grid bag 管理器描述布局，请使用以下步骤：\n\n1. 创建一个类型为 `GridBagLayout`\
  \ 的对象。你不需要告诉它底层网格有多少行和多少列。相反，布局管理器将尝试从你之后提供的信息中进行猜测。\n2. 将此 `GridBagLayout` 对象设置为该组件的布局管理器。\n\
  3. 对于每个组件，创建一个类型为 `GridBagConstraints` 的对象。设置 `GridBagConstraints` 对象的字段值，以指定组件在\
  \ grid bag 中的布局方式。\n4. 最后，通过调用调用添加每个带约束的组件：\n\n```\nadd(component, constraints);\n\
  ```\n\n这里是所需的代码示例。（我们将在随后的章节中详细详细介绍各种约束——所以如果你不知道某些约束的作用，请不要担心。）\n\n```\nvar layout\
  \ = new GridBagLayout();\npanel.setLayout(layout);\nvar constraints = new GridBagConstraints();\n\
  constraints.weightx = 100;\nconstraints.weighty = 100;\nconstraints.gridx = 0;\n\
  constraints.gridy = 2;\nconstraints.gridwidth = 2;\nconstraints.gridheight = 1;\n\
  panel.add(component, constraints);\n```\n\n诀窍在于知道如何设置 `GridBagConstraints` 对象的状态。我们将在随后的章节中讨论这个对象。\n\
  \n### 11.6.2 `gridx`, `gridy`, `gridwidth`, 和 `gridheight` 参数\n\n`gridx`、`gridy`、`gridwidth`\
  \ 和 `gridheight` 约束定义了组件在网格中的位置。`gridx` 和 `gridy` 值指定要添加组件的左上角的列和行位置。`gridwidth`\
  \ 和 `gridheight` 值决定了组件占据的列数行数。\n\n左上角的 `gridx = 0` 且 `gridy = 0`。我们示例中的文本区域 `gridx\
  \ = 2`、`gridy = 0`，因为它从第 0 行的第 2 列（即第三列）开始。它具有 `gridwidth = 1` 和 `gridheight = 4`，因为它跨越了一列和四行。\n\
  \n### 11.6.3 Weight 字段\n\n你总是需要为 grid bag 中的每个区域设置 `weight` 字段（`weightx` 和 `weighty`）。如果你将权重设置为\
  \ `0`，该区域就不会超过其初始大小。在 11.27 的 grid bag 布局中，我们将标签的 `weightx` 字段设置为 `0`。这使得标签在调整窗口大小时保持不变。另一方面，如果你将所有区域的权重设置为\
  \ `0`，容器将聚集在区域中心，而不是填充它。\n\n从概念上讲，权重参数的问题在于权重是行和列的属性，而不是单个单元格的属性。但你需要为单元格指定它们，因为\
  \ grid bag 布局并不暴露行和列。行和列权重计算为每行中单元格权重的最大值。因此，如果你想让某行或某列保持固定大小，需要将其中所有组件的权重设置为零。\n\
  \n注意，权重并没有给出列的相对大小。它们告诉当容器超过其首选尺寸时，应该分配给每个区域的剩余空间比例。这并不特别直观。我建议你将所有权重设置为 `100`。然后，运行程序查看布局效果。调整对话框查看行和列如何变化。如果你发现某个特定行或列不应该增长，请将其中所有组件的权重设置为零。\n\
  \n### 11.6.4 `fill` 和 `anchor` 参数\n\n如果你不想让组件拉伸并填充整个区域，请设置 `fill` 约束。该参数有四种可能：有效值为\
  \ `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n如果组件没有填充整个区域，可以通过设置 `anchor` 字段来指定它位于区域的哪个位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认值）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTHEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n### 11.6.5 内边距（Padding）\n\n通过设置 `GridBagConstraints` 的 `insets` 字段为组件周围提供额外的空白空间。设置\
  \ `Insets` 对象的 `left`、`top`、`right` 和 `bottom` 值为你想要在组件周围的空间。这被称为*外边距*。\n\n\n\n\n\
  \n`ipadx` 和 `ipady` 值设置了*内部内边距*。这些值会被加上组件的最小宽度和高度。这确保了组件不会缩小到最小尺寸。\n\n### 11.6.6.\
  \ 指定 `gridx`、`gridy`、`gridwidth` 和 `gridheight` 参数的替代方法\n\nAWT 文档建议不要将 `gridx` 和\
  \ `gridy` 值设为绝对位置，而是将它们设置为常量 `GridBagConstraints.RELATIVE`。然后，按照标准顺序将组件添加到 grid\
  \ bag 布局中：从第一行从左到右，然后移动到下一行，依此类推。\n\n你仍然可以通过提供相应的 `gridheight` 和 `gridwidth` 字段来指定跨越的行和列数。然而，如果组件延伸到*最后*一行或列，你不需要指定实际数字，而是使用常量\
  \ `GridBagConstraints.REMAINDER`。这告诉布局管理器该组件是其行中的最后一个。\n\n这种方案似乎确实有效。但向布局管理器隐藏实际位置信息并希望它能重新发现这些信息，听起来确实非常笨拙。\n\
  \n### 11.6.7. Grid Bag 布局配方\n\n在实践中，以下配方可以使 grid bag 布局变得相对容易处理：\n\n1. 在纸上画出组件布局。\n\
  2. 找到一个网格，使得小型组件各包含在一个单元格中，而较大的组件跨越多个单元格。\n3. 用 0, 1, 2, 3, . . . 为网格的行和列标记。现在你可以读取\
  \ `gridx`、`gridy`、`gridwidth` 和 `gridheight` 值了。\n4. 对于每个组件，问自己它是否需要水平或垂直方向填充其单元格。如果没有，你想让它如何对齐？这决定了\
  \ `fill` 和 `anchor` 参数。\n5. 将所有权重设置为 `100`。然而，如果你希望某特定行或列始终保持其默认大小，则将属于该行或该列的所有组件的\
  \ `weightx` 或 `weighty` 设置为 `0`。\n6. 编写代码。仔细检查你的 `GridBagConstraints` 设置。一个错误的约束就会破坏你的整个布局。\n\
  7. 编译、运行并享受其中。\n\n### 11.6.8. 用于驯服 Grid Bag 约束的辅助类\n\ngrid bag 布局中最机械的部分是编写设置约束的代码。大多数程序员为此编写了辅助函数或一个小型辅助类。我在字体对话框示例完整代码之后展示了这样一个类。该类具有以下特性：\n\
  \n* 它的名字很短：`GBC` 而不是 `GridBagConstraints`。\n* 它继承自 `GridBagConstraints`，因此你可以使用较短的名字，如常量\
  \ `GBC.EAST`。\n* 在添加组件时使用 `GBC` 对象，例如：\n\n```\nadd(component, new GBC(1, 2));\n\
  ```\n* 有两个构造函数来设置最常用的参数：`gridx` 和 `gridy`，或者 `gridx`、`gridy`、`gridwidth` 和 `gridheight`。\n\
  ```\nadd(component, new GBC(1, 2, 1, 4));\n```\n对于成对 `x`/`y` 出现的字段提供了方便的 setter\
  \ 方法：\n```\nadd(component, new GBC(1, 2).setWeight(100, 100));\n```\n* setter 方法返回\
  \ `this`，因此你可以链式调用：\n```\nadd(component, new GBC(1, 2).setAnchor(GBC.EAST).setWeight(100,\
  \ 100));\n```\n* `setInsets` 方法为你构建 `Insets` 对象。要获得 1 像素的内边距，只需调用：\n```\nadd(component,\
  \ new GBC(1, 2).setAnchor(GBC.EAST).setInsets(1));\n```\n\n[Listing 11.7] 显示了字体对话框示例的帧类。`GBC`\
  \ 辅助类位于 [Listing 11.8]。以下是将组件添加到 grid bag 的代码：\n\n```\nadd(faceLabel, new GBC(0,\
  \ 0).setAnchor(GBC.EAST));\nadd(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100,\
  \ 0).setInsets(1));\nadd(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\nadd(size,\
  \ new GBC(1, 1).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\nadd(bold,\
  \ new GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\nadd(italic, new\
  \ GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\nadd(sample, new GBC(2,\
  \ 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\n```\n\n一旦你理解了 grid bag 约束，这段代码就非常易读。\n\
