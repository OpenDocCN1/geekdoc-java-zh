- "# Java 核心第二卷：高级特性，第 14 版 (修复 SVGs)\n\n\n\n![](img/cover.jpg)\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n# 前言\n\n## 致读者\n\n你手中的这本书是《核心 Java》第 13 版的第二卷，已针对 `Java 25`\
  \ 进行了全面更新。第一卷涵盖了语言的基础特性；本卷则处理程序员在进行专业软件开发时需要的高级主题。因此，与第一卷以及本书之前的版本一样，我们的目标仍然是想要将\
  \ Java 技术应用到实际项目中的程序员。\n\n随着 Java 类库的爆炸式增长，要在一卷书中涵盖严谨程序员所需要的所有 Java 特性是不可能的。因此，本书被分成了两卷。\n\
  \n第一卷集中在 Java 语言的基础概念上：\n\n*   面向对象编程\n*   反射与代理\n*   接口与内部类\n*   异常处理\n*   泛型编程\n\
  *   集合框架\n*   并发\n*   注解\n*   Java 平台模块系统\n\n第二卷进一步探讨了最重要的库。在过去的十二个版本中，用户界面编程被认为是基础性的，但现在已经将其移动到第二卷了。本卷详细讨论了以下主题：\n\
  \n*   Stream API\n*   文件处理与正则表达式\n*   数据库\n*   XML 处理\n*   脚本与编译 API\n*   国际化\n\
  *   网络编程\n*   图形界面设计\n*   图形编程\n*   本地函数与内存\n\n正如任何书籍一样，错误和不准确不可避免的。如果你在书中发现任何错误，我们非常希望听到。当然，我们希望只听到一次。出于这个原因，我们在\
  \ `horstmann.com/corejava` 建立了一个网站，包含常见问题解答、错误修复和解决方案。在错误报告网页的末尾（为了鼓励你阅读之前的报告）放置了一个表单，你可以用它报告问题并对未来的版本提出建议。\n\
  \n## 本书简介\n\n书中大部分章节是相互独立的。你可以深入你最感兴趣的主题，并按任何顺序阅读章节。\n\n**第 1 章**中，你将学习 Java 流库，它通过指定你想要而不是详细描述如何获取结果，为数据处理带来了现代感。这使得流库能够关注优化评估策略，这对于多核并行计算特别有益。\n\
  \n**第 2 章**的主题是输入输出处理（I/O）。在 Java 中，所有的输入输出都通过输入/输出流来处理。这些流（不要与第 1 章中的流混淆）让你以统一的方式处理各种数据源（如文件、网络连接或内存块）之间的通信。我们包含了对读取和写入类的详细介绍，这些类使得处理\
  \ Unicode 变得简单。我们展示了在使用对象序列化机制时底层发生了什么，这使得保存和加载对象变得简单方便。然后我们讨论了正则表达式以及文件和路径的操作。在本章中，你会发现最近\
  \ Java 版本欢迎改进。\n\n**3 章涵盖了 XML。我们展示了如何解析 XML 文件、如何生成 XML 以及如何使用 XSL 转换。作为一个实用的示例，我们展示了如何在\
  \ XML 中指定 Swing 表单的布局。我们还讨论了 XPath API，它让在 XML 堆中寻找针变得容易得多。**\n\n\n\n\n\n# 第 4 章涵盖了网络\
  \ API。Java 让进行复杂的网络编程变得异常简单。我们将向你展示如何与服务器建立网络连接、如何实现自己的服务器，以及如何建立 HTTP 连接。本章还包含了新的\
  \ HTTP 客户端的内容。\n\n# 第 5 章涵盖了数据库编程。重点是 `JDBC`，即 Java 数据库连接 API，它允许 Java 程序连接到关系型数据库。我们将向你展示如何使用\
  \ `JDBC` API 的核心子集编写实用的程序来处理现实中的数据库任务。（对 `JDBC` API 的完整介绍需要一本几乎和这本书一样大的书。）\n\nJava\
  \ 在处理日期和时间库方面曾有过两次尝试。第三次尝试在 Java 8 中一举成功。在`第 6 章`中，你将学习如何使用新的日期和时间库来处理日历和时区的复杂性。\n\
  \n# 第 7 章讨论了一个我们认为重要性只会增加的特性：国际化。Java 编程语言是少数从一开始就设计用于处理 Unicode 的语言之一，但 Java 平台上的国际化支持要远得多。因此，你可以让\
  \ Java 应用程序国际化，使其不仅能够跨平台，还能跨越国界。例如，我们将向你展示如何编写一个可以使用英语、德语或中文的退休金计算器。\n\n# 第 8 章讨论了脚本和编译器\
  \ API，这些 API 允许你的程序调用 JavaScript 或 Groovy 等脚本语言的代码，并编译 Java 代码。\n\n# 第 9 章涉及了 Java\
  \ 安全模型、用户身份验证以及 Java 安全库中的加密函数。你将学习如消息签名和代码签名、授权与认证以及加密等重要特性。我们以使用 `AES` 和 `RSA`\
  \ 加密算法的示例作为结束。\n\n# 第 10 章介绍了 GUI 编程。我将向你展示如何创建窗口、如何在窗口上绘图、如何用几何形状绘图、如何使用多种字体格式化文本，以及如何显示图像。接下来，你将看到如何编写响应事件（如鼠标点击或按键）的代码。\n\
  \n# 第 11 章详细讨论了 `Swing` GUI 工具包。`Swing` 工具包允许你构建跨平台的图形用户界面。你将学习有关各种类型的按钮、文本组件、边框、滑块、列表框、菜单和对话框。\n\
  \n# 第 12 章包含了高级 Swing 内容，特别是重要但复杂的树和表格组件。我们还涵盖了 `Java 2D` API，你可以用它来创建真实的图形和特殊特效。当然，现在没有多少程序员需要编写\
  \ `Swing` 用户界面了，因此我们特别关注那些对服务器上生成的图像非常有用的特性。\n\n# 第 13 章涉及了外部函数，它允许你调用用其他编程语言编写的代码。当你与\
  \ Java 不支持的设备或服务交互时，你可能需要转向目标平台操作系统的 API。或者，你可能想调用一个经过测试的机器学习或数据分析库。\n\n一如既往，所有章节都已针对最新版本的\
  \ Java 进行了完全重写。过时的内容已被删除，并详细涵盖了直到 Java 25 的新 API。\n\n## 惯例\n\n与许多计算机书籍一样，我使用`等宽字体`来表示计算机代码。\n\
  \n注释（Notes）带有像这样的“note”图标。\n\n提示（Tips）带有像这样的“tip”图标。\n\n当前方有危险时，我会用“caution”图标警告你。\n\
  \n计划在未来成为语言或 API 部分的预览特性将用此图标标记。\n\nJava 自带了一个大型编程库，或称应用程序接口（API）。当第一次使用 API 调用时，我会在章节末尾添加一个简短的总结描述。这些描述稍微正式一些，但希望比官方在线\
  \ API 文档中的描述更具信息量。接口名称使用*斜体*，与官方文档一样。类、接口或方法名称后的数字是引入该特性的 JDK 版本，如下例所示：\n\n`java.lang.IO`\
  \ 25\n\n*   `println(Object obj)`\n\n    将对象转换为字符串并打印到控制台上，随后紧跟一个换行符。\n\n本书配套代码中包含了源代码的程序被列为示例，例如：\n\
  \n`Listing NotHelloWorld.java`\n\n```\nvoid main() {\n    System.out.println(\"\
  We will not use 'Hello, World!'\");\n}\n```\n\n你可以从 `https://horstmann.com/corejava`\
  \ 下载配套代码。\n\n# 致谢\n\n写一本书总是一项艰巨工程，而重写似乎并不容易多少，尤其在 Java 技术变化如此迅速的情况下。将一本书变为现实需要许多专注的人，我非常荣幸能感谢整个\
  \ `Core Java` 团队的贡献。\n\n感谢我的编辑 Harry Misthos 以及来自 Pearson 的 Julie Nahil，他们引导书籍完成了整个制作过程。我使用\
  \ HTML 和 CSS 编写了这本书，由 Prince (`https://princexml.com`) 将其转换为 PDF——我非常推荐这种工作流。\n\n\
  感谢早期版本的许多读者，他们报告了尴尬的错误，并为改进提出了许多周到的建议。我特别感谢优秀的评审团队，他们以惊人的细节关注审阅了手稿，使我免于犯更多尴尬的错误。\n\
