  - 前言
- - '##'
  - 致读者
- - '##'
  - 本书简介
- - '#'
  - 第 4 章涵盖了网络 API。Java 让进行复杂的网络编程变得异常简单。我们将向你展示如何与服务器建立网络连接、如何实现自己的服务器，以及如何建立 HTTP
    连接。本章还包含了新的 HTTP 客户端的内容。
- - '#'
  - 第 5 章涵盖了数据库编程。重点是 `JDBC`，即 Java 数据库连接 API，它允许 Java 程序连接到关系型数据库。我们将向你展示如何使用 `JDBC`
    API 的核心子集编写实用的程序来处理现实中的数据库任务。（对 `JDBC` API 的完整介绍需要一本几乎和这本书一样大的书。）
- - '#'
  - 第 7 章讨论了一个我们认为重要性只会增加的特性：国际化。Java 编程语言是少数从一开始就设计用于处理 Unicode 的语言之一，但 Java 平台上的国际化支持要远得多。因此，你可以让
    Java 应用程序国际化，使其不仅能够跨平台，还能跨越国界。例如，我们将向你展示如何编写一个可以使用英语、德语或中文的退休金计算器。
- - '#'
  - 第 8 章讨论了脚本和编译器 API，这些 API 允许你的程序调用 JavaScript 或 Groovy 等脚本语言的代码，并编译 Java 代码。
- - '#'
  - 第 9 章涉及了 Java 安全模型、用户身份验证以及 Java 安全库中的加密函数。你将学习如消息签名和代码签名、授权与认证以及加密等重要特性。我们以使用
    `AES` 和 `RSA` 加密算法的示例作为结束。
- - '#'
  - 第 10 章介绍了 GUI 编程。我将向你展示如何创建窗口、如何在窗口上绘图、如何用几何形状绘图、如何使用多种字体格式化文本，以及如何显示图像。接下来，你将看到如何编写响应事件（如鼠标点击或按键）的代码。
- - '#'
  - 第 11 章详细讨论了 `Swing` GUI 工具包。`Swing` 工具包允许你构建跨平台的图形用户界面。你将学习有关各种类型的按钮、文本组件、边框、滑块、列表框、菜单和对话框。
- - '#'
  - 第 12 章包含了高级 Swing 内容，特别是重要但复杂的树和表格组件。我们还涵盖了 `Java 2D` API，你可以用它来创建真实的图形和特殊特效。当然，现在没有多少程序员需要编写
    `Swing` 用户界面了，因此我们特别关注那些对服务器上生成的图像非常有用的特性。
- - '#'
  - 第 13 章涉及了外部函数，它允许你调用用其他编程语言编写的代码。当你与 Java 不支持的设备或服务交互时，你可能需要转向目标平台操作系统的 API。或者，你可能调用一个经过测试的机器学习或数据分析库。
