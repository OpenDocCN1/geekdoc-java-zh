  - 区域的快速复习：每个区域都有一个语言代码（例如英语的 `en`）和一个国家代码（例如美国的 `US`）。区域 `en_US` 描述的是在美国使用的英语，而
    `en_IE` 是爱尔兰使用的的英语。某些国家有多个区域。例如，`ga_IE` 是爱尔兰的盖尔克语，正如前面的示例所示，JDK 至少知道瑞士的三个区域。
