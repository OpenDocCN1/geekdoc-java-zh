    在此实现中，我们使用泛型类型 `E` 以允许栈存储任何类型的元素。我们还定义了一个嵌套的 `node` 类来表示元素。


    `push` 方法通过创建一个带有指定元素并将当前头节点作为其 `next` 节点新 `node`，将新元素添加到栈顶，并将新节点设置为新的头节点。

