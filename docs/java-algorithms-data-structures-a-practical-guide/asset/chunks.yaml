    # Chapter 8: Sorting Algorithms


    ![image](d2d_images/chapter_title_bottom.png)


    Chapter 8 of the book covers sorting algorithms in detail. Sorting algorithms
    are used to arrange a collection of data in a specific order. There are many sorting
    algorithms, each with its own advantages in terms of performance and ease of implementation.


    This chapter covers the following sorting algorithms:


    1. `Bubble Sort`: a simple algorithm that repeatedly swaps adjacent elements if
    they are in the wrong order.

    2. `Selection Sort`: an algorithm that repeatedly finds the minimum element from
    the unsorted part of the array and puts it at the beginning.

    3. `Insertion Sort`: an algorithm that builds the final sorted array one item
    at a time, by inserting each item into its proper place.

    4. `Merge Sort`: a divide-and-conquer algorithm that divides the array into two
    halves, sorts each half, and then merges the two halves.

    5. `Quick Sort`: a divide-and-conquer algorithm that picks an element as a pivot
    and partitions the array around the pivot.

    6. `Heap Sort`: an algorithm that builds a binary heap and repeatedly extracts
    the minimum element from it to build a sorted array.

    7. `Counting Sort`: a non-comparison based sorting algorithm that works on integers,
    counting the number of occurrences of each value.

    8. `Radix Sort`: a non-comparison based sorting algorithm that sorts elements
    by comparing digits of each element.


    For each sorting algorithm, the chapter provides a detailed explanation of the
    algorithm, including its time and space complexity. Additionally, the chapter
    provides sample code in `Java` for each algorithm.


    ## 8.1. Bubble Sort


    `Bubble Sort` is a simple sorting algorithm that repeatedly steps through a collection
    of elements, compares adjacent elements and swaps them if they are in the wrong
    order. The pass through the collection is repeated until the collection is sorted.
    `Bubble Sort` is not very efficient and is generally not used in practical applications,
    but it is a good introduction to the concept of sorting algorithms and can be
    useful in cases where the data set is small.


    The basic idea behind `Bubble Sort` is to compare adjacent elements and swap them
    if they are not in the desired order. The algorithm iterates over the list of
    elements multiple times, with each iteration moving the largest remaining element
    to its correct position at the end of the list.


    Here is an example implementation of `Bubble Sort` in `Java`:


    ![image](d2d_images/image072.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    In this implementation, the outer loop runs `n-1` times, where `n` is the length
