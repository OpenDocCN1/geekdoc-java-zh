    In this example, the `KruskalAlgorithm` class defines an `Edge` class to store
    the source, destination, and weight of each edge, and a `Subset` class to store
    the parent and rank of each subset. The `kruskalMST` method constructs the minimum
    spanning tree using Kruskal''s algorithm. It sorts the edges by weight, initializes
    the subsets, and iteratively adds the edges to the result while avoiding cycles.


    ## 14.3. Dynamic Programming


    Dynamic programming is an optimization technique that solves problems by breaking
    them down into simpler, overlapping subproblems and using a bottom-up or top-down
    approach to store and reuse the solutions to these subproblems.


    ### Example 1: Fibonacci Sequence (Top-Down Approach)


    The Fibonacci sequence can be calculated using dynamic programming with a top-down
    approach, also known as memoization. In this example, an array is used to store
    the computed values of the Fibonacci sequence to avoid redundant calculations.


    ![image](d2d_images/image083.png)


    ### Example 2: Longest Common Subsequence (Bottom-Up Approach)


    The longest common subsequence problem can be solved using dynamic programming
    with a bottom-up approach. In this example, a 2D array is used to store the lengths
    of the longest common subsequences between the prefixes of two strings, and the
    solution is built iteratively.


    ![image](d2d_images/image022.png)


    These examples demonstrate the use of dynamic programming to optimize the solutions
    to the Fibonacci sequence and longest common subsequence problems. Both top-down
    (memoization) and bottom-up approaches are employed to store and reuse the solutions
    to overlapping subproblems.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## 14.4. Backtracking


    Backtracking is an algorithm technique used to solve problems that involve searching
    for all possible solutions or configurations. It incrementally builds candidates
    for a solution and abandons a partial candidate ("backtracks") as soon as it determines
    that the candidate cannot be extended to a valid solution.


    ### Example 1: N-Queens Problem


    The N-Queens problem involves placing N queens on an N×N chessboard such that
    no two queens threaten each other. This problem can be solved using backtracking
    by placing queens row by row and checking if the current placement is safe.


    ––––––––


    ```

    import java.util.ArrayList;

    ```


    ![image](d2d_images/image041.png)

    ![image](d2d_images/image070.png)


    In this example, the `NQueens` class implements a backtracking algorithm to solve
    the N-Queens problem. The `solve` method places queens row by row and checks if
    the current placement is safe using the `isSafe` method. If a safe placement is
    found, the algorithm proceeds to the next row; otherwise, it backtracks and tries
    a different placement in the previous row. The `createBoard` method generates
    the final board configurations.


    This example demonstrates how backtracking can be used to solve a problem by incrementally
    building candidates for a solution and abandoning them when they cannot be extended
    to a valid solution.


    ## 14.5. Branch and Bound


    Branch and Bound is an algorithm technique used for solving optimization problems
    by systematically exploring the search space of possible solutions. It maintains
    an upper and lower bound on the optimal solution and prunes branches of the search
    space when they cannot lead to a better solution than the current best-known solution.


    ### Example 1: Traveling Salesman Problem


    The Traveling Salesman Problem (TSP) seeks to find the shortest possible route
    for a salesman who must visit a number of cities exactly once before returning
    to the starting city. This problem can be solved using the Branch and Bound method
    by exploring the possible permutations of cities and pruning branches when their
    cost exceeds the best-known solution.


    ![image](d2d_images/image018.png)

    ![image](d2d_images/image144.png)

    ![image](d2d_images/image020.png)


    In this example, the `TravelingSalesman` class implements a Branch and Bound algorithm
    to solve the TSP. The `tsp` method recursively explores the permutations of cities
    and prunes branches when their cost exceeds the best-known solution. The `getShortestTour`
    method returns the minimum cost of the shortest tour.


    This example demonstrates how the Branch and Bound technique can be used to explore
    the search space of possible solutions for an optimization problem, maintaining
    upper and lower bounds on the optimal solution, and pruning branches when they
    cannot lead to a better solution.


    ## 14.6. Randomized Algorithms


    Randomized algorithms are algorithms that use random numbers to make decisions
    during their execution. They can provide average-case performance better than
    deterministic algorithms and can also handle certain problems more effectively
    due to their randomized nature.


    ### Example 1: QuickSelect Algorithm


    QuickSelect is a randomized algorithm used to find the k-th smallest element in
    an unordered list. It is similar to the QuickSort algorithm but only processes
    the partition containing the element.


    ![image](d2d_images/image044.png)

    ![image](d2d_images/image074.png)


    In this example, the `QuickSelect` class implements a randomized algorithm to
    find the k-th smallest element in an unordered list. The `quickSelect` method
    chooses a random pivot index and uses the `partition` method to split the input
    array into two parts. Depending on the desired k-th smallest element, it recursively
    processes the partition containing that element.


    This example demonstrates how randomized algorithms can be used to solve problems
    efficiently by making decisions based on random numbers. Randomized algorithms
    can provide better average-case performance compared to deterministic algorithms
    and handle certain problems more effectively due to their randomized nature.

