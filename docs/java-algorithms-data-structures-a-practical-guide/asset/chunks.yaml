    # Chapter 6. Queues


    ![image](d2d_images/chapter_title_below.png)


    Queues are another important data structure in computer science that are used
    to store a collection of elements in a specific order. In a queue, elements are
    added to one end and removed from the other end. The end where elements are added
    is called the `back` or `tail` of the queue, while the end where elements are
    removed is called the `front` or `head` of the queue. The order in which elements
    are added to the queue is preserved, and the first element added is the first
    to be removed.


    In this chapter, we will cover the basics of queues, including their definition,
    properties, and applications. We will also discuss various implementations of
    queues in Java, and some common algorithms that use queues.


    ## 6.1. Queue ADT


    The Queue abstract data type (ADT) is a collection of elements that supports two
    fundamental operations: `enqueue` and `dequeue`. `enqueue` adds an element to
    the back of the queue, while `dequeue` removes and returns the element at the
    front of the queue. The order in which elements are dequeued is the same as the
    order in which they were enqueued. This ordering property is known as first-in,
    first-out (FIFO).


    In addition to the basic `enqueue` and `dequeue` operations, a queue ADT may also
    support other operations such as `peek`, `isEmpty`, and `size`. The `peek` operation
    allows us to inspect the element at the front of the queue without removing it.
    The `isEmpty` operation checks whether the queue is empty or not, while the `size`
    operation returns the number of elements in the queue.


    Here is an example of how to define a basic `Queue` interface in Java:


    ![image](d2d_images/image134.png)


    This interface defines the basic operations that any implementation of a queue
    must support. The `enqueue` method adds an element to the back of the queue, the
    `dequeue` method removes and returns the element at the front of the queue, and
    the `peek` method returns the element at the front of the queue without removing
    it. The `isEmpty` method checks whether the queue is empty or not, and the `size`
    method returns the number of elements in the queue.


    By defining a `Queue` interface, we can write code that is independent of the
    specific implementation of the queue. This allows us to switch between different
    implementations of the queue without changing the rest of our code.


    ## 6.2. Array-based Queue Implementation


    An array-based queue is a queue implementation that uses a fixed-size array to
    store the elements of the queue. The `front` of the queue is at index 0 of the
    array, and the `back` of the queue is at the highest index used. When elements
    are dequeued, the `front` index is incremented, and when elements are enqueued,
    the `back` index is incremented. If the `back` index reaches the end of the array,
    it wraps around to the beginning of the array.


    Here is an example of an array-based queue implementation in Java:


    ![image](d2d_images/image004.png)


    In this implementation, we use an array elements to store the elements of the
    queue. We also keep track of the `front` and `back` indices of the queue, as well
    as the current `size` of the queue.


    The `enqueue` method adds an element to the back of the queue by incrementing
    the `back` index, wrapping around if necessary, and inserting the element at the
    new `back` index.


    The `dequeue` method removes and returns the element at the front of the queue
    by retrieving the element at the `front` index, incrementing the `front` index,
    wrapping around if necessary, and decrementing the `size`.


    The `peek` method returns the element at the front of the queue without removing
    it.


    The `isEmpty` method checks whether the queue is empty or not by checking the
    `size`.


    The `size` method returns the current `size` of the queue.


    Note that this implementation uses a fixed-size array, so if the array becomes
    full, it will throw an `IllegalStateException` when trying to enqueue a new element.

