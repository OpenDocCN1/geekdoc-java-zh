    from which we want to find the shortest paths. Then, we initialize the distance
    array to infinity and set the distance from the source node to itself to 0.


    ### 12.5.3. Floyd-Warshall Algorithm in java


    here is an implementation of the Floyd-Warshall algorithm:


    ![image](d2d_images/image118.png)


    The floydWarshall method takes an int[][] array as input, which represents the
    graph as an adjacency matrix. The method first initializes a dist array with the
    same values as the input graph. It then updates the dist array by considering
    all possible paths through each intermediate vertex k. Finally, the method prints
    the resulting dist array, which represents the shortest path between each pair
    of vertices.


    Note that in the implementation, Integer.MAX_VALUE is used to represent infinity
    (i.e., there is no edge between two vertices). Also, the time complexity of the
    Floyd-Warshall algorithm is O(V^3), where V is the number of vertices in the graph.


    ## 12.6. Minimum Spanning Tree Algorithms in java


    Minimum Spanning Tree (MST) is a subgraph of an undirected graph that is a tree
    and connects all the vertices with the minimum possible total edge weight. There
    are two well-known algorithms to find the Minimum Spanning Tree of a graph: Kruskal''s
    Algorithm and Prim''s Algorithm.


    ### 12.6.1. Kruskal''s Algorithm


    Kruskal''s Algorithm is a greedy algorithm that finds a Minimum Spanning Tree
    for a connected weighted graph. The algorithm works by sorting the edges by their
    weight and then adding them one by one to the MST as long as they do not form
    a cycle. The process continues until all vertices are connected.


    The implementation of Kruskal''s Algorithm requires the use of a Disjoint Set
    data structure to keep track of the connected components of the graph.


    Here is the Java code for Kruskal''s Algorithm:


