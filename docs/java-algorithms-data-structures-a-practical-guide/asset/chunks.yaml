    # Chapter 4. Linked Lists


    ![image](d2d_images/chapter_title_below.png)


    Linked lists are another common data structure in computer science, and they provide
    a way to store and manipulate a collection of elements in a dynamic and flexible
    manner. Unlike arrays, linked lists don''t require contiguous memory allocation,
    which allows them to easily grow or shrink as needed.


    A linked list consists of a sequence of nodes, where each node contains an element
    and a reference (or pointer) to the next node in the list. The last node in the
    list typically points to `null`, indicating the end of the list. The first node
    in the list is called the head of the list.


    There are several types of linked lists, including singly linked lists, doubly
    linked lists, and circular linked lists. In a singly linked list, each node only
    has a reference to the next node in the list. In a doubly linked list, each node
    has references to both the next and previous nodes in the list. In a circular
    linked list, the last node in the list points back to the first node, forming
    a circular chain.


    Linked lists can be used to implement various data structures and algorithms,
    such as stacks, queues, hash tables, and graph representations. They are also
    useful for certain types of problems, such as traversing a tree or graph in a
    depth-first or breadth-first manner.


    ## 4.1. Singly Linked Lists


    A singly linked list is the simplest type of linked list, where each node in the
    list contains an element and a reference to the next node in the list. The last
    node in the list points to `null`, indicating the end of the list. The first node
    in the list is called the head of the list.


