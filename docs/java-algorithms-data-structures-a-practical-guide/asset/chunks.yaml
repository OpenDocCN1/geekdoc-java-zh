    # Chapter 13. Hashing


    ![image](d2d_images/chapter_title_below.png)


    ## 13.1. Introduction to Hashing


    Hashing is a technique used to map data to a fixed-size output using a specific
    hash function. This process allows for efficient searching, insertion, and deletion
    of data elements in data structures such as hash tables. The primary goal of hashing
    is to achieve constant-time complexity for these operations.


    ## 13.2. Hash Functions


    A hash function is a mathematical algorithm that maps data of arbitrary size to
    a fixed-size output, known as a hash. The hash function should have the following
    properties:


    1. Deterministic: For a given input, the output should always be the same.

    2. Fast: The function should compute the hash in a short amount of time.

    3. Uniform distribution: The outputs should be evenly distributed across the range
    of possible hash values.

    4. Minimal collisions: The function should minimize the number of times different
    inputs produce the same output.


    ### Example 1: The Division Method


    A simple hash function is the division method, which takes the input value modulo
    a prime number, i.e. `h(x) = x % p`, where `p` is a prime number. This method
    provides good distribution when the input data is random.


    ![image](d2d_images/image013.png)


    ### Example 2: The Multiplication Method


    The multiplication method involves multiplying the input by a constant, followed
    by extracting a range of bits from the result. This method is effective when the
    input data is uniformly distributed.


    ![image](d2d_images/image061.png)


    ### Example 3: Java String Hash Function


    Java''s default String hash function is a variation of the DJB2 algorithm, which
    iterates through each character in the string and calculates the hash using a
    combination of bitwise operations and arithmetic.


    ![image](d2d_images/image151.png)


    ### Example 4: MurmurHash3


    MurmurHash3 is a non-cryptographic hash function that provides good performance
    and low collision rates. It is widely used in various applications, including
    databases and distributed systems.


    ![image](d2d_images/image031.png)


    ## 13.3. Collision Resolution Strategies


    Collisions occur when two different inputs produce the same hash. There are several
    strategies to resolve collisions:


    ### 13.3.1. Separate Chaining


    Separate chaining involves using a linked list or another data structure to store
    the colliding elements in the same index of the hash table. When a collision occurs,
    the new element is added to the list at the corresponding index.


    Example 1: Separate Chaining


    ![image](d2d_images/image145.png)


    ### 13.3.2. Open Addressing


    Open addressing resolves collisions by finding the next available slot in the
    hash table. This method includes linear probing, quadratic probing, and double
    hashing.


    Example 2: Linear Probing


    ![image](d2d_images/image126.png)


    ## 13.4. Hash Table Performance


    Hash table performance depends on the quality of the hash function, the load factor,
    and the collision resolution strategy. The load factor is the ratio of the number
    of elements in the hash table to the size. It affects the average number of elements
    per bucket and impacts the performance of searching, inserting, and deleting.


    Average-case time complexity for hash table operations:

    * Search: O(1)

    * Insert: O(1)

    * Delete: O(1)


    Worst-case time complexity for hash table operations:

    * Search: O(n)

    * Insert: O(n)

    * Delete: O(n)


    To achieve optimal performance, a hash table should maintain a load factor below
    a certain threshold (e.g., 0.75) by resizing the table when necessary. Resizing
    involves creating a new, larger table and reinserting all elements into the new
    table.


    ### 13.5. Java HashMap and HashSet Classes


    Java provides built-in implementations of hash-based data structures: HashMap
    and HashSet. HashMap is an implementation of a hash table that stores key-value
    pairs, while HashSet is a hash-based implementation of the Set interface that
    stores unique elements.


    Example 1: Using HashMap


    ![image](d2d_images/image065.png)


    These examples demonstrate the usage of HashMap and HashSet, which are built-in
    Java classes that provide efficient hash-based data structures for storing key-value
    pairs and unique elements.

