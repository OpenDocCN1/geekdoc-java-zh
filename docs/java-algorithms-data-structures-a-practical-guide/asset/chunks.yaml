    ## 6.3. 基于链表的队列实现


    基于链表的队列是一种使用链表来存储队列元素的队列实现方式。链表的每个节点都包含一个元素和一个指向下一个节点的引用。队列的头部是链表的表头，队列的尾部是链表的尾尾。当元素入队（enqueue）时，一个新节点会被添加到链表的尾部；当元素出队（dequeue）时，链表的表头会被移除。


    以下是一个 Java 中基于链表的队列实现的示例：


    ![image](img/image117.png)


    在 particular 实现中，我们使用链表来存储队列元素。我们还维护了链表的头部和尾部，以及队列的当前大小。


    `enqueue` 方法通过创建一个包含元素的新节点，并将当前尾部节点的 `next` 引用指向新节点，从而将元素添加到链表的尾部。如果链表为空，则将头部和尾部引用指向新节点。


    `dequeue` 方法通过获取头部节点的元素，移除并返回链表头部的元素，更新 `head` 引用指向下一个节点，并递减 `size`。如果移除头部节点后链表变空，则
    `tail` 引用也会被设置为 `null`。


    `peek` 方法在不移除元素的情况下返回链表头部的元素。


    `isEmpty` 方法通过检查 `size` 来判断队列是否为空。


    `size` 方法返回队列的当前大小。


    注意，这种实现使用了动态数据结构，因此它可以根据需要增长或缩小以容纳元素。


    ## 6.4. 循环队列


    循环队列是一种使用环形缓冲区（circular buffer）作为底层数据结构的队列。循环缓冲区是一个固定大小的缓冲区，其行为就像头部和尾部环形连接在一起一样。这意味着当缓冲区满时，新元素将覆盖缓冲区中最旧的元素；而当缓冲区为空时，尝试出队元素将导致错误。


    循环队列像普通队列一样有一个 `front`（头）和一个 `rear`（尾），但当 `front` 和 `rear` 索引到达末尾时，它们会回到缓冲区开头。这允许循环队列重用缓冲区中之前被出队元素占据的空间。


    以下是一个 Java 中循环队列实现的示例：


    ![image](img/image086.png)


    在 particular 实现中，我们使用环形缓冲区来存储队列元素。我们还维护了 `front` 和 `rear` 索引，以及队列的当前大小。


    `enqueue` 方法通过将 `rear` 索引处的值设置为新元素，并将 `rear` 索引更新为循环缓冲区中的下一个位置，从而将元素添加到缓冲区的尾部。如果缓冲区满，将抛出一个异常。


    `dequeue` 方法通过获取 `front` 索引处的值、将值设置为 `null` 并更新 `front` 索引为循环缓冲区中的下一个位置，从而移除并返回缓冲区头部的元素。如果缓冲区为空，将抛出一个异常。


    `peek` 方法在不移除元素的情况下返回缓冲区头部的元素。


    `isEmpty` 方法通过检查 `size` 来判断队列是否为空。


    `isFull` 方法通过比较 `size` 和缓冲区长度来判断队列是否满。


    `size` 方法返回队列的当前大小。


    注意，这种实现使用了固定大小的缓冲区，因此它无法超出初始容量增长或缩小。此外，由于环形缓冲区的实现，缓冲区始终至少有一个空位，以区分空状态和满状态。


    ## 6.5. 优先级队列


    优先级队列是一种抽象数据类型，类似于队列，但增加了一个特性：每个元素都有一个与其相关的优先级。优先级高的元素先出队，而优先级相同的元素则按照它们被加入队列的顺序进行出队。


    优先级队列可以使用各种数据结构来实现，例如堆（heaps）、二叉搜索树，甚至是未排序数组。优先级队列的一种流行实现是使用二叉堆，二叉堆是一种满足堆属性的完全二叉树。


    在 Java 中，`PriorityQueue` 类是优先级队列的一种实现，它使用二叉堆来存储元素。以下是在 Java 中使用 `PriorityQueue`
    的示例：


    ![image](img/image122.png)


    在这个示例中，我们创建了一个整数类型的 `PriorityQueue`，并使用 `offer` 方法向添加了一些元素。`PriorityQueue` 会自动维护堆属性，因此元素按其优先级进行排序。


    然后，我们使用 `toString` 方法打印队列，它显示了元素将要出队的顺序。


    接下来，我们使用 `poll` 方法移除优先级最高的元素，该方法会返回并移除队列的头部。我们打印该元素的值，然后再次打印队列以显示它已被移除。


    最后，我们使用 `peek` 方法查看优先级最高的元素，该方法返回队列的头部但不移除它。我们打印该元素的值，以显示它是下一个将要出队的元素。


    ## 6.6. Java Queue 接口和 PriorityQueue 类


    在 Java 中，`Queue` 接口是一种用于在处理前持有元素的集合。它类似于现实世界中的队列，先加入队列的元素先被移除。`Queue` 接口扩展了 `Collection`
    接口，并增加了插入、移除和检查元素的方法。


    `Queue` 接口的一种实现是 `PriorityQueue` 类，它是一个基于最小堆的优先级队列。`PriorityQueue` 类根据自然顺序或实例化时提供的自定义
    `Comparator` 来维护元素的排序。


    以下是在 Java 中使用 `Queue` 接口和 `PriorityQueue`类的示例：


    ![image](img/image009.png)


    在这个示例中，我们首先使用 `Queue` 接口创建一个 `PriorityQueue` 实例。然后使用 `add` 方法向队列添加多个元素。


    我们使用 `toString` 方法打印队列元素，它返回按元素出队顺序排列的字符串表示。


    接下来，我们使用 `remove` 方法移除队列头部，并将移除的值存储在名为 `head` 的变量中。我们打印 `head` 的值，显示它是队列中的最小值。


    我们再次打印队列元素，显示最小元素已被移除。


    最后，我们使用 `peek` 方法查看队列头部，该方法返回队列头部但不移除它。我们打印 `peek` 的值，以显示它是下一个将要出队的元素。


    ## 6.7. 队列的应用


    队列在计算机科学中有许多应用，特别是在需要按先入先出（FIFO）顺序处理数据的情况下。队列的一些常见应用包括：


    1. **作业调度**：队列用于操作系统管理作业调度。每个作业被添加到队列中并按照它们被加入的顺序执行。

    2. **广度优先搜索**：队列用于图遍历算法，如广度优先搜索（BFS）。BFS 按层遍历图，在访问距离起始节点为 $k$ 的所有节点之前，先访问距离为 $k+1$
    的节点。队列用于存储已访问但尚未处理的节点。

    3. **缓存**：队列用于缓存淘汰策略。当缓存满且需要添加新项时，将从缓存中移除最近最使用的项。这可以使用队列来跟踪项添加到缓存的顺序来实现。

