    # 第 4 章 链表


    ![image](img/chapter_title_below.png)


    链表是计算机科学中另一种常见的数据结构，它们提供了一种动态且灵活的方式存储和操作元素集合。与数组不同，链表不需要连续的内存分配，这允许它们根据需要轻松地增长或缩小。


    链表由一系列节点组成，每个节点包含一个元素以及指向列表中下一个节点的引用（或指针）。列表中的末尾节点通常指向 `null`，表示列表的结束。列表中的第一个节点被称为列表的头（head）。


    链表有几种类型，包括单链表、双链表和循环链表。在单链表中，每个节点只有一个指向列表中下一个节点的引用。在双链表中，每个节点都有指向列表中后一个节点和上一个节点的引用。在循环链表中，列表的末尾节点指向第一个节点，形成一个环链。


    链表可以用于实现各种数据结构和算法，如栈、队列、哈希表和图的表示。它们对于某些类型的问题也有用，例如以深度优先或广度优先的方式遍历树或图。


    ## 4.1. 单链表


    单链表是最简单的链表类型，列表中的每个节点包含一个元素和一个指向列表中下一个节点的引用。列表中的末尾节点指向 `null`，表示列表的结束。列表中的第一个节点被称为列表的头。


    这是一个单链表的示例：


    ![image](img/image127.png)


    在这个示例中，头指向包含元素 A 的第一个节点，该节点指向包含元素 B 的下一个节点，该节点指向包含元素 C 的下一个节点，该节点指向 `null`，表示列表的结束。


    单链表可以用于实现各种数据结构和算法，如栈、队列和哈希表。它们对于某些类型的问题也有用，例如以深度优先或广度优先的方式遍历链式结构。


    单链表上的一些常用操作包括：


    - `get(index)`: 返回列表中指定索引处的元素。

    - `add(element)`: 在列表末尾添加元素。

    - `add(index, element)`: 在列表的指定索引处插入元素。

    - `remove(index)`: 从列表中删除指定索引处的元素。

    - `size()`: 返回列表中的元素数量。


    这是一个单链表的 Java 实现示例：


