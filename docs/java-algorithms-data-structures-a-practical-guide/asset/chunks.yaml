    # 第 7 章：递归


    递归是一种强大的编程技术，函数通过调用自己来解决问题。在 Java 中，递归通过调用带有不同参数的自身方法来实现。


    递归的核心思想是将问题分解为更小的子问题，直到这些子问题简单到可以直接解决的程度。当达到基准情况（即最简单的子问题）时，递归停止，并组合子问题的解决方案来解决原始问题。


    这是一个计算数字阶乘的递归函数示例：


    ![image](img/image068.png)


    该函数接收一个整数 `n` 并递归地计算它的阶乘。基准情况是 `n` 等于 0，此时函数返回 `1`。否则，函数会对 `factorial(n - 1)`
    进行递归调用，并将结果乘以 `n`。


    递归可以是某些问题的优雅解决方案，但它的效率可能低于迭代方法。每次递归调用都会创建一个新的栈帧（stack frame），如果递归很深，可能会消耗大量的内存。此外，某些问题可能不适合递归，可能需要不同的方法。


    确保递归函数具有基准情况且递归能够终止是非常关重要的，否则可能会导致无限循环和栈溢出错误。


    ## 7.1. 理解递归


    要理解递归，理解函数调用栈（function call stack）的概念非常重要。函数调用栈是程序用于跟踪函数调用的数据结构。当函数被调用时，栈顶端会添加一个新帧。当函数返回时，该帧从栈中移除。


    当一个函数递归地调用自己时，每次都会向栈中添加一个新帧。在执行新的函数调用期间，原函数的执行会被挂。一旦达到基准情况，函数将返回，每个先前的函数调用将恢复执行。


    让我们来看一个例子来更好地理解递归是如何工作的。这里有一个计算第 n 个斐波那契数的递归函数：


    ![image](img/image148.png)


    该函数接收一个整数 `n` 并返回第 n 个斐波那契数。基准情况是 `n` 等于 0 或 1，此时函数返回 `n`。否则，函数会对 `fibonacci(n-1)`
    和 `fibonacci(n-2)` 进行两次递归调用，并返回它们结果之和。


    如果我们调用 `fibonacci(5)`，函数调用栈将如下所示：


    ![image](img/image101.png)


    该函数首先调用 `fibonacci(5)`，它对 `fibonacci(4)` 和 `fibonacci(3)` 进行递归调用。`fibonacci(4)`  又对
    `fibonacci(3)` 和 `fibonacci(2)` 进行递归调用，依此类推，直到达到基准情况。


    一旦达到基准情况，函数返回其结果，每个先前的函数调用将恢复执行，最终返回最终结果。


    ## 7.2. 递归解决方案与迭代解决方案


    递归和迭代解决方案是编程中解决问题的两种常见方法。递归解决方案使用函数调用将问题分解为更小的子问题，而迭代解决方案使用循环在问题空间上迭代，直到找到解决方案为止。


    递归解决方案可以非常优雅且易于理解，但它们的效率可能低于迭代解决方案。每次递归函数调用都会创建一个新的栈帧，如果递归很深，可能会消耗大量的内存。此外，某些问题可能不适合递归，可能需要不同的方法。


    另一方面，迭代解决方案使用循环在问题空间上迭代，直到找到解决方案。它们通常比递归解决方案高效，因为它们避免了函数调用和栈帧的开销。然而，迭代解决方案有时比递归解决方案更难阅读和理解。


    这是一个用递归和迭代解决方案计算数字阶乘的示例：


    递归解决方案：


    ![image](img/image038.png)


    迭代解决方案：


    ![image](img/image076.png)


    这两个函数都计算数字 `n` 的阶乘，但它们使用了不同的方法。递归解决方案使用较小的参数调用自身，直到达到基准情况，而迭代解决方案则使用循环在问题空间上迭代。


    通常情况下，为当前的问题选择合适的解决方案是重要的。对于某些问题，递归解决方案可能是优雅且易于的，但对于其他问题，迭代解决方案可能更高效。


    ## 7.3. 尾递归


    尾递归是一种特殊的递归，其中函数的最后一个操作是递归调用。换句话说，函数的返回值直接由递归调用的返回值决定，没有任何额外的计算或处理。


    尾递归很重要，因为编译器和解释器可以对其进行优化，以避免创建新的栈帧。相反，每次调用可以重用同一个栈帧，从而提高性能并减少内存占用。


