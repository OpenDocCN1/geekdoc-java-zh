    ## 6.4. Circular Queues


    A circular queue is a type of queue that uses a circular buffer as its underlying
    data structure. A circular buffer is a fixed-size buffer that behaves as if its
    head and tail were connected together in a circle. This means that when the buffer
    is full, new elements will overwrite the oldest elements in the buffer, and when
    the buffer is empty, trying to dequeue an element will result in an error.


    A circular queue has a `front` and a `rear`, just like a regular queue, but the
    `front` and `rear` indices wrap around to the beginning of the buffer when they
    reach the end. This allows the circular queue to reuse the space in the buffer
    that was previously occupied by dequeued elements.


