    ## 3.1. 数组简介


    数组是一种存储相同数据类型固定大小元素序列的数据结构。数组对于组织和处理数据非常有用，因为它们通过索引直接访问元素，索引代表每个元素在数组中的位置。这种直接访问使得在检索或更新数组中的元素时具有常数时间复杂度
    (O(1))。


    在 Java 中，可以为任何数据类型创建数组，包括基本数据类型（例如 `int`、`char` 和 `double`）和引用类型（例如对象和其他数组）。数组在
    Java 中是对象，并分配在堆上。它们有一个名为 `length` 的内置属性，用于存储数组中的元素数量。


