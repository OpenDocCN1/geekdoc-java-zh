    4. **Message Queues**: Queues are used in message passing systems to store messages
    until they can be processed. Messages are added to the queue by the sender and
    removed from the queue by the receiver.

    5. **Simulation**: Queues are used in simulation software to model systems that
    have a limited capacity. For example, a queue can be used to simulate a checkout
    line at a store or a waiting list for a concert.


    # Chapter 7. Recursion


    Recursion is a powerful programming technique where a function calls itself to
    solve a problem. In Java, recursion is implemented using methods that call themselves
    with different arguments.


    The idea behind recursion is to break a problem into smaller sub-problems until
    the sub-problems become simple enough to be solved directly. When the base case
    is reached (i.e., the simplest sub-problem), the recursion stops and the solutions
    of the sub-problems are combined to solve the original problem.


    Here is an example of a recursive function that calculates the factorial of a
    number:


    ![image](d2d_images/image068.png)


    This function takes an integer `n` and calculates its factorial recursively. The
    base case is when `n` is equal to zero, in which case the function returns `1`.
    Otherwise, the function makes a recursive call to `factorial(n - 1)` and multiplies
    the result by `n`.


    Recursion can be an elegant solution to certain problems, but it can also be less
    efficient than an iterative approach. Each recursive call creates a new stack
    frame, which can use a significant amount of memory if the recursion is deep.
    Additionally, some problems may not be well-suited for recursion and may require
    a different approach.


