    ## 11.2. Java 中的二叉堆


    二叉堆（Binary Heaps）是一种特殊的堆数据结构，它满足堆的属性，并且元素存储在二叉树结构中。二叉堆有两种类型：最小堆和最大堆。在最小堆中，父节点始终小于或等于其子节点，且根节点包含堆中的最小元素。在最大堆中，父节点始终大于或等于其子节点，且根节点包含堆中的最大元素。


    在 Java 中，我们可以使用数组来实现二叉堆。我们可以将二叉堆表示为一棵完全二叉树，其中每一层都从左到右填充，最后底层可能不完全满。我们可以使用以下公式来计算父节点和子节点的位置：


    * 索引为 `i` 的节点的父节点索引为 `(i - 1) / 2`。

    * 索引为 `i` 的节点的左子节点索引为 `(2 * i) + 1`。

    * 索引为 `i` 的节点的右子节点索引为 `(2 * i) + 2`。


