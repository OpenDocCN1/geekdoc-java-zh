    to place the elements in the correct order in the output array.


    Counting Sort has a time complexity of `O(n + k)`, where `n` is the number of
    elements in the input array and `k` is the range of the elements, and a space
    complexity of `O(n + k)`. However, it can only be used to sort integer or small
    range data sets, as its space and time complexity increase significantly for larger
