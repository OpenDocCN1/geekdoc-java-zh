    in the order they will be dequeued.


    Next, we remove the element with the highest priority using the `poll` method,
    which returns and removes the head of the queue. We print the value of this element
    and then print the queue again to show that it has been removed.


    Finally, we peek at the element with the highest priority using the `peek` method,
    which returns the head of the queue without removing it. We print the value of
    this element to show that it is the next element that will be dequeued.


    ## 6.6. Java Queue Interface and PriorityQueue Class


    In Java, the `Queue` interface is a collection designed for holding elements prior
    to processing. It is similar to a real-world queue, where the first element that
    is added to the queue is the first one to be removed. The `Queue` interface extends
    the `Collection` interface and adds methods for inserting, removing, and inspecting
    elements in the queue.


    One implementation of the `Queue` interface is the `PriorityQueue` class, which
    is a priority queue based on a min-heap. The `PriorityQueue` class maintains the
