    ## 14.2. Greedy Algorithms


    Greedy algorithms make locally optimal choices at each step with the hope of finding
    a globally optimal solution. They are often simpler and more efficient than other
    techniques but may not always produce the best solution.


    ### Example 2: Kruskal''s Algorithm for Minimum Spanning Tree


    Kruskal''s algorithm is a greedy approach to find the minimum spanning tree of
    an undirected, connected graph. It sorts the edges by weight and adds them to
    the tree while avoiding cycles.


    ![image](d2d_images/image039.png)

    ![image](d2d_images/image000.png)

    ![image](d2d_images/image102.png)

