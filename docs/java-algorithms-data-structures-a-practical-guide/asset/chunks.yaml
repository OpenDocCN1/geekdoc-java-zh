    ## 7.1. Understanding Recursion


    To understand recursion, it''s important to understand the concept of a function
    call stack. A function call stack is a data structure used by the program to keep
    track of function calls. When a function is called, a new frame is added to the
    top of the stack. When the function returns, the frame is removed from the stack.


    When a function calls itself recursively, a new frame is added to the stack each
    time. The function''s execution is suspended while the new function call is executed.
    Once the base case is reached, the function returns and each previous function
    call resumes execution.


