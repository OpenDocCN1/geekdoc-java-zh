  trans: "\n\n对于大型数组，二分查找比线性查找更高效，因为它的时间复杂度为 `O(log n)`，而线性查找的复杂度为 `O(n)`。然而，它要求数组先进行排序，如果数组频繁更新，这会产生额外的开销。\n\
    \n以下是在 Java 中实现二分查找的几个示例：\n\n### 示例 1：使用递归实现二分查找\n\n![image](img/image094.png)\n\
    \n在此示例中，`binarySearch` 方法通过递归实现。它接受四个参数：要搜索的数组、目标值、搜索范围的左索引以及搜索范围的右索引。在每次递归调用中，它计算搜索范围的中间索引，并将中间元素与目标值进行比较。如果它们相等，则返回中间元素的索引。否则，如果中间元素大于目标值，则通过递归调用方法并传入左索引和\
    \ `mid - 1` 索引在搜索范围的左半部分搜索。如果中间元素小于目标值，则通过递归调用方法并传入 `mid + 1` 和 `right` 索引在搜索范围的右半部分搜索。\n\
    \n### 示例 2：使用迭代实现二分查找\n\n![image](img/image099.png)\n\n## 9.3. 插值查找\n\n插值查找是另一种在均匀分布数据上效果最好的搜索算法。它是对二分查找的改进，因为它使用所搜索键的值来估计该键在排序数组中的位置。\n\
    \n插值查找算法的工作原理是首先计算目标值所在索引的估计值。这是通过使用以下公式估计位置的：\n\n![image](img/image100.png)\n\
    \n其中 `left` 和 `right` 是正在搜索的子数组的边界，`target` 是要搜索的值，而 `arr` 是排序后的数组。\n\n一旦完成估算，算法会检查该索引处的值。如果该值等于目标值，则算法返回该索引。如果该值小于目标值，算法在右子数组中继续搜索。如果该值大于目标值，算法在左子数组中继续搜索。\n\
    \n如果算法到达子数组末尾仍未找到目标值，则返回 `-1` 表示未找到该值。\n\n以下是 Java 中插值查找的一个示例实现：\n\n![image](img/image021.png)\n\
    \n在此实现中，我们首先检查目标值是否在正在搜索的子数组范围内。如果是，我们使用上述公式计算估计位置。如果估算位置处的值等于目标值，我们返回该索引。如果该值小于目标值，我们在右子数组中搜索。如果该值大于目标值，我们在左子数组中搜索。如果算法到达子数组末尾仍未找到目标值，则返回\
    \ `-1` 表示未找到该值。\n\n## 9.4. 指数查找\n\n指数查找是一种工作在排序数组上的搜索算法。它从将搜索键与数组的第一个元素进行比较开始。如果键小于第一个元素，则终止搜索，因为在数组中将无法找到该键。否则，算法将搜索范围的上界设置为大于数组长度的下一个\
    \ 2 的幂，将下界设置为小于数组长度的最后一个 2 的幂。然后，在这些边界之间的子数组上执行二分查找，如果键存在于数组中，该子数组保证包含它。\n\n以下是指数查找的实现：\n\
    \n![image](img/image152.png)\n\n在此实现中，函数接收一个整数数组 `arr` 和一个搜索键 `key` 作为输入，如果键存在于数组，则返回其在数组中的索引，否则返回\
    \ `-1`。\n\n算法首先检查 `key` 是否等于数组的第一个元素。如果是，函数返回 `0`。否则，它将索引 `i` 设置为 `1`，并在每次迭代中将其翻倍，直到找到一个在该索引处的元素大于或等于搜索键的索引\
    \ `i`，或者 `i` 超过数组长度。此时，函数在 `i/2` 和 `i` 与数组长度的最小值之间的子数组上执行二分查找，如果键存在于数组中，该子数组保证包含它。使用\
    \ `Arrays.binarySearch` 函数来执行二分查找，如果键存在于子数组中，它返回其在子数组中的索引，否则返回负值。\n\n以下是使用 `exponentialSearch`\
    \ 函数的几个示例：\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image109.png)\n\
    \n输出：\n\n![image](img/image011.png)\n\n## 9.5. 搜索算法比较\n\n当在数据集中查找一个元素时，有多种算法可用，每种算法都有其优缺点。选择哪种算法通常取决于所搜索数据的特征以及应用的特定需求。在本节中，我们将比较最常用搜索算法的时间空间复杂度以及它们的优劣。\n\
    \n1. **线性查找（Linear Search）**：\n    * 时间复杂度：`O(n)`\n    * 空间复杂度：`O(1)`\n    * 适用于小型数组或无序列表。\n\
    \    * 性能随输入规模的增大而下降。\n\n2. **二分查找（Binary Search）**：\n    * 时间复杂度：`O(log n)`\n\
    \    * 空间复杂度：`O(1)`\n    * 适用于排序数组或列表。\n    * 为较大的数组提供了快速搜索。\n\n3. **插值查找（Interpolation\
    \ Search）**：\n    * 时间复杂度：`O(log log n)`（最好情况），`O(n)`（最坏情况）\n    * 空间复杂度：`O(1)`\n\
    \    * 对于均匀分布的数据，性能优于二分查找。\n    * 对于非均匀分布的数据，性能逊于二分查找。\n\n4. **指数查找（Exponential\
    \ Search）**：\n    * 时间复杂度：`O(log n)`\n    * 空间复杂度：`O(1)`\n    * 适用于无边界排序数组。\n\
