    two halves and then calls the merge function to merge the sorted halves. The merge
    function merges two sorted subarrays into a single sorted subarray.


    Merge Sort has a space complexity of O(n), as it requires additional memory to
    store the temporary arrays used during the merge step. While this may make it
    less efficient than algorithms like Insertion Sort, it can be useful in cases
    where stability and a guaranteed worst-case time complexity are important.


    ## 8.5. Quick Sort


    Quick Sort is another divide-and-conquer sorting algorithm that works by selecting
    a pivot element from the array and partitioning the other elements into two sub-arrays,
    according to whether they are less than or greater than the pivot. The sub-arrays
    are then recursively sorted.


    Quick Sort has a time complexity of O(n log n) in the average case, but can have
    a worst-case time complexity of O(n^2) if the pivot is chosen poorly. However,
    randomized versions of Quick Sort can reduce the likelihood of the worst-case
    scenario.


    Here is an example implementation of Quick Sort in Java:


    ![image](d2d_images/image054.png)


    In this implementation, the quickSort function recursively partitions the array
    into two halves based on a pivot element, which is chosen as the right-most element
    in the array. The partition function partitions the array by comparing each element
    to the pivot and moving it to the left sub-array if it is less than the pivot,
    and to the right sub-array if it is greater than or equal to the pivot. The function
    then returns the index of the pivot element, which is used to recursively partition
    the sub-arrays.


    Quick Sort has a space complexity of O(log n) due to the recursive call stack,
    making it more memory-efficient than Merge Sort. However, it can have a worst-case
    time complexity of O(n^2) and is not stable.


    ## 8.6. Heap Sort


    Heap Sort is another comparison-based sorting algorithm that works by building
    a max heap or a min heap from the input array and repeatedly extracting the root
    element to place it at the end of the sorted array.


    In Heap Sort, a heap is a binary tree where each parent node is larger or smaller
    than its children, depending on whether it is a max heap or a min heap. The root
    node of the heap is either the largest or smallest element in the heap, depending
    on whether it is a max heap or a min heap, respectively.


    Heap Sort has a time complexity of O(n log n) and a space complexity of O(1).
    However, it is not stable, meaning that the order of equal elements may not be
    preserved in the sorted array.


    Here is an example implementation of Heap Sort in Java:


    ![image](d2d_images/image078.png)


    In this implementation, the heapSort function first builds a max heap from the
    input array by calling the heapify function on each parent node in the heap. The
    heapify function recursively swaps parent nodes with their larger child nodes
    until the parent node is larger than both of its children. Once the max heap is
    built, the function repeatedly extracts the root element by swapping it with the
    last element in the heap, decreasing the size of the heap by one, and calling
    heapify on the root node to restore the max heap property.


    Heap Sort is an in-place sorting algorithm, meaning that it does not require extra
    memory to store the sorted array. However, it is slower than other O(n log n)
    sorting algorithms in practice due to poor cache performance.


    ## 8.7. Counting Sort


    Counting Sort is a non-comparison based sorting algorithm that works by counting
    the number of occurrences of each element in the input array and using this information
    to place the elements in the correct order in the output array.


    Counting Sort has a time complexity of O(n + k), where n is the number of elements
    in the input array and k is the range of the elements, and a space complexity
    of O(n + k). However, it can only be used to sort integer or small range data
    sets, as its space and time complexity increase significantly for larger data
    sets.


    Here is an example implementation of Counting Sort in Java:


    ![image](d2d_images/image135.png)


    In this implementation, the countingSort function first creates a count array
    with the length of the range of the elements in the input array. It then iterates
    through the input array to count the occurrences of each element and stores this
    information in the count array. It then calculates the prefix sums of the count
    array to determine the positions of each element in the output array. Finally,
    it iterates through the input array in reverse order, placing each element in
    the correct position in the output array and decreasing the count of that element
    by one. Once all elements are placed in the output array, the function copies
    the sorted elements back to the input array.


    Counting Sort is a stable sorting algorithm, meaning that the order of equal elements
    is preserved in the sorted array. It is often used as a subroutine in other sorting
    algorithms, such as Radix Sort.


    ## 8.8. Radix Sort


    Radix Sort is a non-comparison based sorting algorithm that works by sorting elements
    based on their digits or characters. It sorts the elements by grouping them into
    buckets according to the values of their digits or characters at a particular
    position, and then repeatedly sorts the elements by their next digits or characters
    until all the digits or characters have been sorted.


    Radix Sort has a time complexity of O(k * n), where k is the maximum number of
    digits or characters in the input elements and n is the number of elements. However,
    it can only be used to sort elements with a fixed number of digits or characters,
    and its time complexity can become very high if the number of digits or characters
    is very large.


    Here is an example implementation of Radix Sort in Java:


    ![image](d2d_images/image097.png)


    In this implementation, the radixSort function first finds the maximum element
    in the input array to determine the number of digits required for sorting. It
    then iterates through each digit, from the least significant to the most significant,
    and performs a counting sort on the elements based on that digit. It uses the
    getMax function to determine the maximum element in the array and calculates the
    prefix sums of the count array to determine the positions of each element in the
    output array. It then places the elements in the correct order in the output array
    and copies the sorted elements back to the input array.


    Radix Sort is a stable sorting algorithm, meaning that the order of equal elements
    is preserved in the sorted array. It is often used to sort elements with fixed-width
    fields, such as strings or integers.'
