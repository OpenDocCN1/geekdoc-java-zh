    `addEdge` 方法用于向图中添加边。每条边由一个源顶点、一个目的顶点和一个权重表示。


    `primMST` 方法用于寻找最小生成树。它首先将 `root` 顶点添加到优先级队列中，距离为 0。然后，重复地从优先级队列中移除距离最小的顶点，将其标记为已访问，如果其未访问的邻居到根顶的距离小于其当前距离，则将这些邻居添加到优先级队列中。


