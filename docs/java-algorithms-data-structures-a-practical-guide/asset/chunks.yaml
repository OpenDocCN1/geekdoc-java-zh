    ## 8.9. 排序算法的比较


    有很多不同的排序算法，每种都有自己的优缺点。以下是一些常见排序算法的简要比较：


    1. **冒泡排序 (Bubble Sort)**：`Bubble Sort` 是一种简单的排序算法，如果相邻元素顺序错误，就反复交换它们。它的最坏情况时间复杂度为
    `O(n²)`，因此对于大型数组来说效率较低。


    2. **选择排序 (Selection Sort)**：`Selection Sort` 是一种排序算法，它反复从数组的未排序部分选择最小元素，并将其放在已排序部分的开头。它的最坏情况时间复杂度为
    `O(n²)`，因此对于大型数组来说效率较低。


    3. **插入排序 (Insertion Sort)**：`Insertion Sort` 是一种排序算法，它通过不断将新元素插入数组已排序部分的正确位置，逐个构建最终的排序数组。它的最坏情况时间复杂度为
    `O(n²)`，因此对于大型数组来说效率较低。


    4. **归并排序 (Merge Sort)**：`Merge Sort` 是一种排序算法，它将输入数组分为两部分，递归地对每部分进行排序，然后合并这两个已排序部分。它的最坏情况时间复杂度为
    `O(n log n)`，因此对于大型数组来说效率很高。


    5. **快速排序 (Quick Sort)**：`Quick Sort` 是一种选择一个元素作为基准并围绕其划分数组的算法，使得所有小于基准的元素在其之前，所有大于基准的元素在其之后。然后递归地对两个子数组进行排序。它的最坏情况时间复杂度为
    `O(n²)`，但平均时间复杂度为 `O(n log n)`，对大多数输入都很高效。


    6. **堆排序 (Heap Sort)**：`Heap Sort` 是一种排序算法，它从输入数组构建一个二堆，并反复提取最大元素将其放在已排序部分的末尾。它的最坏情况时间复杂度为
    `O(n log n)`，因此对于大型数组来说效率很高。


    7. **计数排序 (Counting Sort)**：`Counting Sort` 是一种通过统计每个元素出现的次数并利用这些信息确定每个元素在排序数组中的位置的算法。它的时间复杂度为
    `O(n + k)`，其中 `k` 是输入元素的范围，因此对于范围较小的输入非常高效。


    8. **基数排序 (Radix Sort)**：`Radix Sort` 是一种根据元素在特定位置的数字或字符值将它们分组到桶中排序的算法，然后反复根据下一个数字或字符对元素进行排序，直到所有数字或字符都排序完毕。它的时间复杂度为
    `O(k * n)`，其中 `k` 是输入元素中最大的位数或位数，`n` 是元素个数。


    总来说，`Merge Sort`、`Quick Sort`、`Heap Sort` 和 `Radix Sort` 被认为比 `Bubble Sort`、`Selection
    Sort` 和 `Insertion Sort` 更高效，特别是对于大型数组。然而，排序算法的选择还取决于应用的具体需求，例如稳定性、内存使用和实现的难易性。


    ## 8.10. Java 排序工具类


    Java 提供了一个名为 `Arrays` 的内置工具类，其中包含各种数组排序算法。以下是 `Arrays` 类中可用的一些排序方法：


    1. `Arrays.sort()`：该方法按升序排列指定的数组。它对原始数据类型使用双基准快速排序算法，对对象类型使用归并排序算法。


    2. `Arrays.parallelSort()`：该方法并行地排序指定的数组，这在多核处理器上对于大型数组来说速度更快。


    3. `Arrays.sort(array, comparator)`：该方法根据提供的 `Comparator` 对指定的数组进行排序。


