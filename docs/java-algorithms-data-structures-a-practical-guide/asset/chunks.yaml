    Binary Heaps are a specific type of heap data structure where the heap property
    is satisfied, and the elements are stored in a binary tree structure. There are
    two types of binary heaps: min heap and max heap. In a min heap, the parent node
    is always less than or equal to its children, and the root node contains the minimum
    element in the heap. In a max heap, the parent node is always greater than or
    equal to its children, and the root node contains the maximum element in the heap.


    In Java, we can implement binary heaps using an array. We can represent a binary
    heap as a complete binary tree where each level is filled from left to right,
    and the last level may not be completely filled. We can use the following formulas
    to calculate the parent and child nodes'' positions:


    *   The parent node of a node at index i is at index (i - 1) / 2.


    *   The left child node of a node at index i is at index (2 * i) + 1.


    *   The right child node of a node at index i is at index (2 * i) + 2.


