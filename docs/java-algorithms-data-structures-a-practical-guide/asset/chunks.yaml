    ![image](d2d_images/image132.png)


    ![image](d2d_images/image119.png)


    ### 12.6.2. Prim''s Algorithm


    Prim''s Algorithm is a greedy algorithm that finds a minimum spanning tree for
    a weighted undirected graph. It starts with an arbitrary vertex as the root of
    the tree and then iteratively adds the edge with the minimum weight that connects
    a vertex in the tree to a vertex outside of the tree. This process continues until
    all vertices are included in the tree.


    Here is an implementation of Prim''s algorithm:


