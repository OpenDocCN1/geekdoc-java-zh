    ![image](img/image056.png)


    - `Arrays.deepToString(array)`, `Arrays.deepEquals(array1, array2)` 和 `Arrays.deepHashCode(array)`:
    这些方法类似于 `toString()`、`equals()` 和 `hashCode()`，但它们是专为多维数组设计的。


    这些工具函数通过为常用操作提供方便的方法，使得在 Java 中处理数组变得更容易。在处理数组时使用这些函数可以帮助你编写更高效、可读性的代码。


    ## 3.5. 基于数组的列表


    在 Java 中，`java.util` 包中的 `ArrayList` 类提供了一个由数组支持的列表实现。`ArrayList` 与数组相似，因为它维护了一个有序的元素集合，但它可以在添加或删除元素时动态调整自身的大小。


    要创建一个 `ArrayList`，你可以使用默认构造函数或指定初始容量的构造函数：


    ![image](img/image114.png)


    你可以使用 `add()` 方法向 `ArrayList` 添加元素：


    ![image](img/image049.png)


    你可以使用 `get()` 方法访问 `ArrayList` 中的元素，该方法接收要检索的元素索引：


    ![image](img/image115.png)


    你可以使用 `remove()` 方法从 `ArrayList` 中删除元素，该方法接收要删除的元素索引：


    ![image](img/image042.png)


    `ArrayList` 还提供了各种工具方法，如 `size()`、`contains()` 和 `indexOf()`，它们的工作方式与数组中的对应方法类似。


    `ArrayList` 相比数组的一个优势是，你可以从列表中添加或删除元素，而不必担心底层数组的调整。`ArrayList` 会根据需要自动调整数组，这使得在某些情况下处理起来更加方便。然而，与数组相比，`ArrayList`
    有一些开销，例如存储列表元数据所需的额外内存，并且在某些用例下的性能可能较差。


    总的来说，`ArrayList` 是一种有用且多功能的数据结构，可以简化 Java 程序中数据集合的操作。


