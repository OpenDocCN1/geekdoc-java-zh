    ## 11.4. Heapify and Build-Heap Operations


    Heapify and Build-Heap are two important operations used in heap data structures
    to create a heap from a given array. These operations are commonly used in sorting
    algorithms and priority queue implementations.


    Heapify is an operation that restores the heap property of a binary tree. This
    operation assumes that the binary trees rooted at the left and right subtrees
    of a given node are already max heaps, but the value at the given node may violate
    the heap property. Heapify starts at a node and recursively adjusts the node and
    its descendants to satisfy the heap property. In a max heap, the largest element
    is at the root of the tree.


    Build-Heap is an operation that creates a heap from a given array. It starts by
    heapifying the bottom-most nodes and works its way up to the root node. It is
    an efficient way to create a heap from an unsorted array. The time complexity
    of this operation is O(n), which is faster than inserting each element into a
    heap individually, which has a time complexity of O(nlogn).


    Here is an implementation of Heapify and Build-Heap operations for a max heap
    using an array-based implementation in Java:


