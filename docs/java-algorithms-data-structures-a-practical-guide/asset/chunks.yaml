    ## 11.4. Heapify and Build-Heap Operations


    Heapify and Build-Heap are two important operations used in heap data structures
    to create a heap from a given array. These operations are commonly used in sorting
    algorithms and priority queue implementations.


    Heapify is an operation that restores the heap property of a binary tree. This
    operation assumes that the binary trees rooted at the left and right subtrees
    of a given node are already max heaps, but the value at the given node may violate
    the heap property. Heapify starts at a node and recursively adjusts the node and
    its descendants to satisfy the heap property. In a max heap, the largest element
    is at the root of the tree.


    Build-Heap is an operation that creates a heap from a given array. It starts by
    heapifying the bottom-most nodes and works its way up to the root node. It is
    an efficient way to create a heap from an unsorted array. The time complexity
    of this operation is `O(n)`, which is faster than inserting each element into
    a heap individually, which has a time complexity of `O(nlogn)`.


    Here is an implementation of Heapify and Build-Heap operations for a max heap
    using an array-based implementation in Java:


    ![image](d2d_images/image088.png)


    In this implementation, the `heapify` method takes an index of a node in the array-based
    heap and recursively calls itself to make sure that the subtree rooted at the
    given node is a max heap. The `buildHeap` method starts with the bottom-most level
    of the tree and works its way up to the root, calling the `heapify` method on
    each node along the way to make sure that the entire tree is a max heap. The `getSize`
    method returns the size of the heap, and the `getMax` method returns the maximum
    element in the heap, which is the root element.


    ## 11.5. Heap-based Priority Queue


    Heap-based priority queue is a type of data structure that allows insertion and
    removal of elements with priority. It is implemented using the heap data structure,
    which is a complete binary tree with the heap property. The heap property is a
    condition where the parent node has a higher or lower priority than its children,
    depending on whether it''s a max-heap or min-heap, respectively.


    The most common operations in a heap-based priority queue are insertion and deletion
    of elements with the highest or lowest priority, depending on the type of heap
    used. In a max-heap, the element with the highest priority is at the root, while
    in a min-heap, the element with the lowest priority is at the root.


    To insert an element in a heap-based priority queue, we first add it to the end
    of the heap and then perform a sift-up operation, where we compare the element
    with its parent and swap them if necessary to maintain the heap property.


    To delete an element with the highest or lowest priority, we remove the root of
    the heap and replace it with the last element. Then, we perform a sift-down operation,
    where we compare the new root with its children and swap it with the child with
    the highest or lowest priority, depending on the type of heap used, until the
    heap property is restored.


    In Java, the `PriorityQueue` class implements a heap-based priority queue using
    binary heap. It allows elements to be added using the `add` method and removed
    using the `remove` method, both with `O(log n)` time complexity. The element with
    the highest or lowest priority can be accessed using the `peek` method. The `PriorityQueue`
    also allows custom comparators to be used for non-natural ordering.


    Here is an example of using `PriorityQueue` to implement a max-heap-based priority
    queue in Java:


    ![image](d2d_images/image131.png)


    In this example, we create a generic class `MaxHeapPriorityQueue` that uses `PriorityQueue`
    with a reverse natural ordering comparator to implement a max-heap-based priority
    queue. The `insert` method adds an element to the queue, the `deleteMax` method
    removes and returns the element with the highest priority, the `getMax` method
    returns the element with the highest priority without removing it, the `size`
    method returns the number of elements in the queue, and the `isEmpty` method returns
    whether the queue is empty or not.


    ## 11.6. D-ary Heaps


    A d-ary heap is a variant of a binary heap, where each node has `d` children instead
    of 2. The number `d` is called the "arity" of the heap. A 2-ary heap is equivalent
    to a binary heap, and a 3-ary heap is a common alternative.


    The main advantage of a d-ary heap is that it reduces the depth of the tree compared
    to a binary heap, which can result in faster operations. However, it also has
    a disadvantage of requiring more memory, as each node now has `d` pointers instead
    of 2.


    To implement a d-ary heap in Java, we can use an array to store the heap elements
    and a variable to store the arity. The formulas for getting the parent and child
