    # Chapter 9\. Searching Algorithms


    ![image](d2d_images/chapter_title_below.png)


    Chapter 9 of this book covers various searching algorithms that can be used to
    find a specific element within a collection of data. Searching is a fundamental
    operation in computer science, and it''s an important tool for solving a wide
    range of problems.


    The chapter begins with an introduction to the concept of searching and its importance,
    followed by an overview of some of the most common searching algorithms used in
    computer science. These include linear search, binary search, interpolation search,
    and exponential search. For each algorithm, we will discuss its basic principles,
    its time complexity, and its strengths and weaknesses.


    By the end of this chapter, you will have a solid understanding of the most common
    searching algorithms used in computer science, and you will be able to choose
    the appropriate algorithm for different types of data sets and applications.


    ## 9.1. Linear Search


    Linear search is a simple search algorithm that sequentially checks each element
    of the list until the desired element is found. It is also known as a sequential
    search. This algorithm works well for small lists or when the element being searched
    for is near the beginning of the list. In Java, linear search can be implemented
    using a for loop or while loop to iterate through the elements of an array or
    a list.


    Here''s an example of how to perform linear search :


    ![image](d2d_images/image136.png)


    In the code above, the linearSearch method takes an array arr and an integer x
    as input parameters. It then uses a for loop to iterate through the array and
    checks if each element is equal to x. If it finds a match, it returns the index
    of the element. If it reaches the end of the array without finding a match, it
    returns -1.


    Let''s test this method with an example:


    ![image](d2d_images/image006.png)


    In the code above, we create an array arr with values {1, 3, 5, 7, 9} and a variable
    x with value 5. We then call the linearSearch method with these inputs and store
    the result in a variable index. Finally, we check if index is -1 (meaning the
    element was not found) and print a message accordingly. If index is not -1, we
    print the index at which the element was found.


    This code will output Element found at index 2 since 5 is found at index 2 in
    the array arr.


    ## 9.2. Binary Search


    Binary search is a searching algorithm that works efficiently on sorted arrays
    or lists. It follows the divide-and-conquer approach, dividing the search interval
    in half at each step. It starts by comparing the middle element of the array with
    the target value. If the middle element is equal to the target value, the search
    is successful. Otherwise, if the middle element is greater than the target value,
    the search is repeated on the left half of the array. If the middle element is
    less than the target value, the search is repeated on the right half of the array.
    This process continues until the target value is found or the search interval
    is empty.'
