    # 第四部分：高级数据结构


    第四部分：高级数据结构涵盖了计算机科学各个领域广泛使用的更复杂的数据结构，如树、堆、图和哈希。这些数据结构对于解决许多高级编程问题和优化程序性能至关重要。在书的这部分，我们将讨论每种数据结构的基础、应用以及它们在
    Java 中的实现。我们还将探索用于这些数据结构的各种算法和技术。在本部分的结束时，读者应该对高级数据结构有良好的理解，并在程序中有效地使用它们。


    # 第 10 章：树


    在计算机科学中，树是一种广泛使用的具有层次结构的数据结构。树被用于计算机科学、工程以及其他需要数据层次结构的许多应用中。


    树是节点的集合，其中每个节点包含某些数据和一组子节点。树的顶端节点称为 `root`（根节点），每个节点可以有零或多个子节点。没有子节点的节点被称为 `leaf
    node`（叶子节点）。


    树根据节点可以拥有的子节点数量进行分类。二叉树是每个节点最多有两个子节点的树，而三叉树是每个节点最多有三个子节点的树。


    在本章中，我们将讨论不同类型的树、如何在 Java 中实现它们，以及可以在树上执行的操作。


    ## 10.1 树引引


    在计算机科学中，树是一种广泛使用的数据结构，它表示数据元素的层次结构，其中每个元素被称为 `node`（节点）。树中的每个节点可以有零或多个子节点，并且有一个没有父节点的
    `root` 节点。没有孩子的节点被称为 `leaf nodes`（叶子节点），而有一个或多个孩子的节点被称为 `internal nodes`（内部节点）。


    树用于自然地表示数据，例如家谱、组织结构图和文件系统目录。树也可以用于搜索、排序和索引算法。树有许多类型，每种类型都有自己的属性和用途。


    在二叉树中，每个节点最多有两个孩子，称为 `left child`（左孩子）和 `right child`（右孩子）。在二叉搜索树 (`BST`) 中，左子树中节点的值小于父节点的值，右子树中节点的值大于父节点的值。


    其他类型的树包括 `AVL 树`、`红黑树`、`B 树` 和 `堆`。`AVL 树`是自平衡二叉搜索树，为每个节点维护一个平衡因子。`红黑树`是另一种使用颜色编码来平衡树的自平衡二叉搜索树。`B
    树`用于在磁盘或其他辅助存储设备上存储大量数据。`堆`用于维护一个部分有序的元素集合，可以轻松访问最小或最大的元素。


