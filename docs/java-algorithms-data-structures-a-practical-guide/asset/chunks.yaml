    归并排序是一种分治算法，它递归地将数组分为两半，对它们进行排序，然后合并这些部分以产生最终的排序数组。


    ![image](img/image125.png)


    ## 14.2. 贪心算法


    贪心算法在每一步都做出局部最优选择，期望找到全局最优解。它们通常比其他技术更简单、更高效，但并不总是能产生最优。


    ### 示例 2：最小生成树的 Kruskal 算法


    Kruskal 算法是一种用于寻找无向连通图最小生成树的贪心方法。它按权重对边进行排序，并在避免循环的同时将它们添加到树中。


    ![image](img/image039.png)

    ![image](img/image000.png)

    ![image](img/image102.png)

    ![image](img/image090.png)


    在这个示例中，`KruskalAlgorithm` 类定义了一个 `Edge` 类来存储每条边的源节点、终点和权重，以及一个 `Subset` 类来存储每个子集的父节点和秩。`kruskalMST`
    方法使用 Kruskal 算法构建最小生成树。它按权重对边进行排序，初始化子集，并迭代地将边添加到结果中，同时避免循环。


    ## 14.3. 动态规划


    动态规划是一种优化技术，通过将问题分解为更简单、重叠的子问题，并使用自底向上或自顶向下的方法存储和重用这些子问题的解决方案来解决问题。


    ### 示例 1：斐波纳契数列（自顶向下方法）


    可以使用自顶向下的动态规划（也称为备忘录）来计算斐波纳契数列。在这个示例中，使用一个数组来存储计算出的值以避免重复计算。


    ![image](img/image083.png)


    ### 示例 2：最长公共子序列（自底向上方法）


    最长公共子序列问题可以使用自底向上的动态规划来解决。在这个示例中，使用二维数组来存储两个字符串前缀之间最长公共子序列的长度，并迭代地构建解决方案。


    ![image](img/image022.png)


    这些示例演示了如何使用动态规划优化斐波纳契数列和最长公共子序列问题的解决方案。自顶向下（备忘录）和自底向上的方法都被用于存储和重用重叠子问题的解决方案。


    ––––––––


    ![image](img/scene_break.png)


    ## 14.4. 回溯


    回溯是一种用于解决涉及搜索所有可能的解决方案或配置问题的算法技术。它增量地构建候选解决方案，一旦确定候选无法扩展为有效解决方案，就会放弃部分候选（“回溯”）。


    ### 示例 1：皇后问题


    N 皇后问题涉及在 N×N 的棋盘上放置 N 个皇后，使得任意两个皇后互不威胁。可以通过逐行放置皇后并检查当前放置是否安全，使用回溯解决这个问题。


    ––––––––


    ```

    import java.util.ArrayList;

    ```


    ![image](img/image041.png)

    ![image](img/image070.png)


    在这个示例中，`NQueens` 类实现了回溯算法来解决 N 皇后问题。`solve` 方法逐行放置皇后，并使用 `isSafe` 方法检查当前放置是否安全。如果找到安全的放置，算法将进入下一行；否则，它将回溯并在上一行尝试不同的放置方式。`createBoard`
    方法生成最终的棋盘配置。


    这个示例演示了如何使用回溯通过增量地构建候选解决方案，并在它们无法扩展为有效解决方案时放弃它们来解决问题。


    ## 14.5. 分支限界


    分支界法是一种用于通过系统探索可能解决方案的搜索空间来解决优化问题的算法技术。它维护最优解的上界和下界，当搜索空间的分无法无法比已知最优解更好的解时，剪掉这些分支。


    ### 示例 1：旅行员问题


    旅行员问题（TSP）寻求为旅行员寻找最短路线，旅行员必须在返回起点之前恰恰访问每个城市一次。可以通过分支界法探索城市的可能排列，并在其成本超过已知最优解时剪掉分支来解决这个问题。


    ![image](img/image018.png)

    ![image](img/image144.png)

    ![image](img/image020.png)


    在这个示例中，`TravelingSalesman` 类实现了分支限界算法来解决 TSP。`tsp` 方法递归地探索城市的排列，并在其成本超过已知最优解时剪掉分支。`getShortestTour`
    方法返回最短行程的最小成本。


    这个示例演示了如何使用分支界法探索优化问题的可能解决方案的搜索空间，维护最优解的上界和下界，并在分支无法产生更好解时剪掉它们。


    ## 14.6. 随机算法


    随机算法是在执行过程中使用随机数来做决策的算法。它们可以提供比确定性算法更好的平均情况性能，并且由于其随机性，还可以更有效地处理某些问题。


    ### 示例 1：QuickSelect 算法


    QuickSelect 是一种用于在无序列表中寻找第 k 小元素的随机算法。它与快速排序算法类似，但只处理包含目标元素的划分。


    ![image](img/image044.png)

    ![image](img/image074.png)


    在这个示例中，`QuickSelect` 类实现了一种随机算法，用于在无序列表中寻找第 k 小元素。`quickSelect` 方法选择一个随机基准索引并使用
    `partition` 方法将输入数组分为两部分。根据所需的第 k 小元素，它递归地处理包含该元素的划分。


    这个示例演示了如何使用随机算法通过基于随机数的决策来高效解决问题。与确定性算法相比，随机算法可以提供更好的平均性能，并由于其随机性更有效地处理某些问题。

