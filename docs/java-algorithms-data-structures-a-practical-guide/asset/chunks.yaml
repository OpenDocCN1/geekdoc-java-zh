    ## 12.7. 最大流算法


    在本节中，我们将讨论 Java 中的最大流算法。最大流是网络流理论中的一个基本概念，用于找到通过流网络传输的最大流量。流网络是一个有向图，其中每条边都有容量和流量，目标是在满足边容量限制的约束下，使从源顶点到汇点顶点的流量最大化。有多种算法可以解决最大流问题，包括
    Ford-Fulkerson 算法和 Edmonds-Karp 算法，我们将在本节中讨论它们。


    ### 12.7.1. Java 中的 Ford-Fulkerson 算法


    Ford-Fulkerson 算法是一种用于解决网络最大流问题的经典算法。它由 L.R. Ford 和 D.R. Fulkerson 于 1956 年提出。该算法通过迭代寻找从源点到汇点的增广路径，并增加沿路径的流量。当没有增广路径时，算法终止。


