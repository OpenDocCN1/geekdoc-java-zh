  trans: "\n\n# 深度优先搜索 (DFS)\n\nDFS 是一种用于遍历图或树的算法。它从根节点（或图中的任意节点）开始，在回溯之前，尽可能地沿着每个分支深层探索。\n\
    \n在 DFS 中，我们使用一个栈（stack）来跟踪已访问的节点以及访问它们的顺序。当我们访问一个节点时，将其标记为已访问，然后将其所有未访问的邻居推入栈中。我们继续从栈中弹出节点并访问它们未访问的邻居，直到栈为空。\n\
    \n以下是 DFS 在 Java 中的一个实现示例代码：\n\n![image](img/image063.png)\n\n这段代码创建了一个具有 4 个顶点的图并添加了一些边。然后它从顶点\
    \ `2` 开始执行 DFS 并打印遍历顺序。输出将是：\n\n![image](img/image133.png)\n\n这是 DFS 算法访问顶点的顺序。\n\
    \n## 12.4.2. 广度优先搜索\n\n广度优先搜索 (`BFS`) 是一种图遍历算法，它按广度优先顺序遍历图的所有顶点，这意味着它在移动到下一层之前会先访问同一层的所有顶点。\n\
    \n要在图上执行 `BFS`，我们首先选择一个顶点开始搜索。然后我们访问该顶点的所有邻居并将它们加入队列（queue）。接着，我们访问队列中的下一个顶点并重复该过程，直到访问了图中的所有顶点。\n\
    \n以下是 `BFS` 在 Java 中的一个实现示例，假设图是用邻接表（adjacency list）表示的：\n\n![image](img/image003.png)\n\
    \n在这个示例中，我们定义了一个 `Graph` 类，它使用邻接表作为数据结构来存储图。`addEdge` 方法在两个顶点之间添加边，而 `BFS` 方法从给定的起始顶点\
    \ `start vertex` 开始执行广度优先搜索。\n\n`visited` 布尔数组用于跟踪顶点是否已被访问，`queue` 用于存储需要访问的顶点。我们首先将\
    \ `start vertex` 添加到队列并将其标记为已访问。然后从队列中出队顶点并访问它们的邻居，如果它们尚未被访问过，则将它们加入队列。\n\n##\
    \ 12.5. 最短路径算法\n\n最短路径算法用于找到图中两个节点之间的最短路径。用于此目的最常用的两种算法是 `Dijkstra's algorithm`\
    \ 和 `Bellman-Ford algorithm`。`Floyd-Warshall algorithm` 也是一种用于寻找图中所有节点对之间最短路径的流行算法。\n\
    \n### 12.5.1. Dijkstra 算法\n\nDijkstra 算法是一种单源最短路径算法。它用于找到从单源节点到图中所有其他节点的最短路径。该算法的工作原理是维护一个节点集合，这些节点到源节点的最短路径已经找到。算法迭代地扩展这个集合，每一步都选择距离源节点最近的节点。\n\
    \nDijkstra 算法的伪代码如下：\n\n1. 创建未访问节点集合，并将到源节点的距离初始化为 `0`，所有其他距离初始化为无穷大。\n2. 当存在未访问节点时：\n\
    \   a. 选择距离源节点距离最小的未访问节点。\n   b. 对于所选节点的每个邻居：\n      i. 计算通过所选节点到达邻居的距离。\n   \
    \   ii. 如果此距离小于当前到邻居的距离，则更新该距离。\n3. 此时，每个节点的距离均为从源节点的最短距离。\n\nDijkstra 算法的 Java\
    \ 代码：\n\n![image](img/image092.png)\n\n![image](img/image087.png)\n\n### 12.5.2.\
    \ Bellman-Ford 算法\n\nBellman-Ford 算法用于找到加权图中节点之间的最短路径，即使图中包含负权边。它通过迭代地松弛图中的所有边，直到无法进一步改进为止。\n\
    \n该算法的工作原理如下：\n\n1. 将源节点的距离初始化为 `0`，所有其他节点的距离初始化为无穷大。\n2. 对于图中的每个顶点 `v`（顺序任意），松弛所有离开\
    \ `v` 的边 `(u, v)`。如果通过边 `(u, v)` 可以缩短到 `u` 的距离，则相应地更新 `u` 的距离。\n3. 重复步骤 2 `|V|-1`\
    \ 次，其中 `|V|` 是图中顶点的数量。这确保了找到所有的最短路径。\n4. 检查是否存在负权循环。可以通过再次执行一次步骤 2 来完成。如果任何距离可以被进一步缩短，则图中存在负权循环。\n\
    \n以下是 Bellman-Ford 算法的 Java 代码：\n\n![image](img/image075.png)\n\n![image](img/image111.png)\n\
    \n在此实现中，我们首先从标准输入读取节点数、边数以及边本身。我们还读取了想要寻找最短路径的源节点。然后，我们将 `distance` 数组初始化为无穷大，并将从源节点到自身的距离设为\
    \ `0`。\n\n### 12.5.3. Java 中的 Floyd-Warshall 算法\n\n这里是 Floyd-Warshall 算法的实现：\n\
    \n![image](img/image118.png)\n\n`floydWarshall` 方法接收一个 `int[][]` 数组作为输入，该数组表示图。方法首先初始化一个与输入相同的\
    \ `dist` 数组。然后通过考虑所有中间顶点 `k` 来更新 `dist` 数组。最后，该方法打印生成的 `dist` 数组，它代表每对顶点之间的最短路径。\n\
    \n注意，在实现中，使用 `Integer.MAX_VALUE` 来表示无穷大。此外，Floyd-Warshall 算法的时间复杂度为 `O(V³)`，其中\
    \ `V` 是顶点的数量。\n\n最小生成树（MST）是无向图的一个子图，它是一棵树并以最小可能的边权重连接所有顶点。有两种著名的算法可以找到图的最小生成树：`Kruskal's\
    \ Algorithm` 和 `Prim's Algorithm`。\n\n### 12.6.1. Kruskal 算法\n\nKruskal 算法是一种贪心算法，用于为连通加权图寻找最小生成树。算法通过对边进行排序并在不形成循环的情况下将其逐个加入\
    \ MST。该过程持续到所有顶点连通。\n\nKruskal 算法的实现需要使用并集（Disjoint Set）数据结构来跟踪图的连通分量。\n\n以下是\
    \ Kruskal 算法的 Java 代码：\n\n![image](img/image047.png)\n\n![image](img/image132.png)\n\
    \n![image](img/image119.png)\n\n### 12.6.2. Prim 算法\n\nPrim 算法是一种贪心算法，用于为加权无向图寻找最小生成树。它从任意顶点作为树的根开始，迭代地添加连接树内顶点和树外顶点的最小权重边。此过程持续到所有顶点都被包含在树中。\n\
    \n以下是 Prim 算法的实现：\n\n![image](img/image103.png)\n\n![image](img/image137.png)\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image153.png)在此实现中，`V`\
    \ 是图中顶点的数量`visited` 数组用于标记已访问的顶点，`dist`数组存储从根到每个顶点的最小距离，`parent`数组存储每个顶点在最小生成树中的父节点。\n\
    \n`pq` 变量是一个优先级队列，按到根的距离递增存储顶点。`adj` 变量是存储图边的邻接表。\n\n"
