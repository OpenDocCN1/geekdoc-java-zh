    2. **函数调用栈**：当编程语言中调用函数时，函数的局部变量和参数被存储在调用栈上。这允许函数访问自己的变量，而不会干扰可能正在并发运行的其他函数的变量。

    3. **解析**：栈可以用于解析和验证结构化数据，例如 XML 或 HTML。在此应用中，栈用于跟踪元素的开始标签和结束标签，并确保文档的结构正确。

