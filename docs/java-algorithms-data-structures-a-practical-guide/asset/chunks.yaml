    # 第 13 章. 哈希


    ![image](img/chapter_title_below.png)


    ## 13.1. 哈希简介


    哈希是一种使用特定哈希函数将数据映射到固定大小输出的技术。这个过程允许对哈希表等数据结构中的数据元素进行高效的搜索、插入和删除。哈希的主要目标是实现这些操作常数时间复杂度。


    ## 13.2. 哈希函数


    哈希函数是一种数学算法，将任意大小的数据映射到固定大小的输出（称为哈希值）。哈希函数应具有以下属性：


    1. 确定性：对于给定的输入，输出应该始终相同。

    2. 快速：函数应该在短时间内计算出哈希值。

    3. 均匀分布：输出应该均匀地分布在可能的哈希值范围内。

    4. 最小冲突：函数应尽可能减少不同输入产生相同输出的次数。


    ### 示例 1：除法法


    一种简单的哈希函数是除法法，它对输入值对质数取模，即 `h(x) = x % p`，其中 `p` 是质数。当输入数据是随机时，这种方法提供了良好的分布。


    ![image](img/image013.png)


    ### 示例 2：乘法法


    乘法法涉及将输入乘以常数，然后从结果中提取一系列位。当输入数据均匀分布时，这种方法是有效的。


    ![image](img/image061.png)


    ### 示例 3：Java String 哈希函数


    Java 默认的 String 哈希函数是 DJB2 算法的变体，它遍历字符串中的每个字符，并结合位运算和算术运算计算哈希。


    ![image](img/image151.png)


    ### 示例 4：MurmurHash3


    MurmurHash3 是一种非加密哈希函数，提供了良好的性能和低冲突率。它被广泛应用于数据库和分布式系统等各种应用中。


    ![image](img/image031.png)


    ## 13.3. 冲突解决策略


    当两个不同的输入产生相同的哈希时，就会发生冲突。有几种策略可以解决冲突：


    ### 13.3.1. 分链法


    分链法涉及使用链表或其他数据结构来存储哈希表中相同索引处的冲突元素。当发生冲突时，新元素被添加到对应索引的列表中。


    示例 1：分链法


    ![image](img/image145.png)


    ### 13.3.2 开放寻址


    开放寻址通过在哈希表中寻找下一个可用槽来解决冲突。这种方法包括线性探测、二次探测和双重哈希。


    示例 2：线性探测


    ![image](img/image126.png)


    ## 13.4. 哈希表性能


    哈希表的性能取决于哈希函数的质量、负载因子和冲突解决策略。负载因子是哈希表中元素数量与大小的比例。它影响每个桶的平均元素数量，并影响搜索、插入和删除的性能。


    哈希表操作的平均复杂度：

    * 搜索：O(1)

    * 插入：O(1)

    * 删除：O(1)


    哈希表操作的最坏情况复杂度：

    * 搜索：O(n)

    * 插入：O(n)

    * 删除：O(n)


    为了获得最佳性能，哈希表应保持负载因子低于特定阈值（例如 0.75），并在需要时调整表大小。调整大小涉及创建一个更大的表并将所有元素重新插入新表中。


    ### 13.5. Java HashMap 和 HashSet 类


    Java 提供了哈希数据结构的内置实现：HashMap 和 HashSet。HashMap 是一个用于存储键值对的哈希表实现，而 HashSet 是 Set
    接口的哈希实现，用于存储唯一元素。


    示例 1：使用 HashMap


    ![image](img/image065.png)


    这些示例演示了 HashMap 和 HashSet 的用法，它们是 Java 内置类，提供了高效的哈希数据结构来存储键值对和唯一元素。

