    该实现包含了添加和删除元素、获取大小以及根据索引元素的方法。它还重写了 `toString()` 方法以提供列表的字符串表示。


    ## 4.2. 双链表


    双链表是链表的一种类型，每个节点包含一个元素、指向下一个节点的引用以及指向上一个节点的引用。列表的第一个节点的上一个引用为 `null`，列表的末尾节点的下一个引用为
    `null`。


