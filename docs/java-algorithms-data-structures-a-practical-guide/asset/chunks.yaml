    Space complexity is a measure of the amount of memory an algorithm uses as a function
    of the input size. It takes into account the memory required by the input data,
    any auxiliary data structures, and the memory used by the algorithm itself (e.g.,
    function call stack). Like time complexity, space complexity is typically expressed
    using asymptotic notation. Some common space complexity classes include:


    - `O(1)`: Constant space complexity, meaning the algorithm uses a fixed amount
    of memory regardless of the input size.

    - `O(log n)`: Logarithmic space complexity, meaning the algorithm''s memory usage
    grows logarithmically with the input size.

    - `O(n)`: Linear space complexity, meaning the algorithm''s memory usage grows
    linearly with the input size.


    When analyzing an algorithm''s efficiency, both time and space complexity should
    be considered. Depending on the problem and the constraints of the system, it
    may be more important to optimize for time or space. In some cases, a trade-off
    between the two may be necessary, such as using a faster algorithm that requires
    more memory or vice versa.


    ## 1.6. Best, Average, and Worst-Case Analysis


    When analyzing an algorithm''s efficiency, it is important to consider its performance
    under different scenarios. Best, average, and worst-case analysis help developers
    understand an algorithm''s behavior in various situations, which is crucial when
    choosing the most appropriate algorithm for a particular task or problem.


    ### Best-Case Analysis


    Best-case analysis considers the scenario where the algorithm performs optimally,
    requiring the least amount of time or resources. This situation usually occurs
    when the input data is arranged in a way that is most favorable to the algorithm.
    The best-case analysis is represented using the Big Omega (`Ω`) notation. While
    best-case analysis provides valuable insights into an algorithm''s potential performance,
    it is often not very useful in practice, as the best-case scenario rarely occurs.


    ### Average-Case Analysis


    Average-case analysis estimates the algorithm''s performance when considering
    all possible input data distributions. This analysis is more realistic than the
    best-case analysis, as it provides a better understanding of how the algorithm
    will perform in practice. The average-case analysis is represented using the Big
    Theta (`Θ`) notation. However, calculating the average-case complexity can be
    challenging, as it requires considering all possible input data distributions
    and their probabilities.


    ### Worst-Case Analysis


    Worst-case analysis considers the scenario where the algorithm performs least
    optimally, requiring the most amount of time or resources. This situation occurs
    when the input data is arranged in a way that is least favorable to the algorithm.
    The worst-case analysis is represented using the Big O (`O`) notation. Worst-case
    analysis is the most widely used and practical form of analysis, as it provides
    an upper bound on an algorithm''s performance, ensuring that the algorithm will
    not perform worse than the specified complexity in any situation.


    ![image](d2d_images/scene_break.png)


    ## 1.7. Solving Recurrences


    Recurrence relations are mathematical expressions that define a sequence in terms
    of its previous elements. They are commonly used to describe the time complexity
    of recursive algorithms. Solving recurrences means finding a closed-form expression
    that represents the sequence without referring to previous elements. This closed-form
    expression allows developers to better understand an algorithm''s performance
    and to compare it with other algorithms. Several techniques can be used to solve
    recurrence relations, including:


    1. **Substitution Method**: The substitution method involves recursively substituting
    the recurrence relation until a pattern emerges or a base case is reached. The
    resulting expression can then be simplified to find the closed-form solution.
    This method often requires some intuition or guessing and can be time-consuming
    for complex recurrences.


    2. **Iteration Method**: The iteration method, also known as the expansion method,
    involves expanding the recurrence relation step by step, replacing each term with
    its definition based on previous terms. After several iterations, a pattern may
    emerge, which can then be generalized to obtain the closed-form solution. This
    method can also be time-consuming for complex recurrences, but it can provide
    useful insights into the algorithm''s behavior.


    3. **Master Theorem**: The Master Theorem is a powerful technique for solving
    recurrences that arise in divide-and-conquer algorithms. It provides a closed-form
    solution for recurrences of the form:


    ```

    T(n) = aT(n/b) + f(n)

    ```


    where `a ≥ 1`, `b > 1`, and `f(n)` is an asymptotically positive function. The
    Master Theorem allows developers to quickly determine the time complexity of a
    wide range of divide-and-conquer algorithms, such as merge sort, quick sort, and
    many others.


    4. **Recursion Tree Method**: The recursion tree method involves visualizing the
    recurrence as a tree, where each node represents a term in the recurrence, and
    the tree''s depth corresponds to the number of recursive calls. By analyzing the
    tree''s structure, developers can identify patterns and derive the closed-form
    solution. This method provides an intuitive way to understand the behavior of
    recursive algorithms, although it can become unwieldy for complex recurrences.


    5. **Generating Functions**: Generating functions are mathematical tools that
    can be used to represent and manipulate sequences, including those defined by
    recurrence relations. By defining a generating function for the sequence and manipulating
    it algebraically, developers can often derive a closed-form solution for the recurrence.
    This method is particularly useful for complex recurrences, but it requires a
    solid understanding of generating functions and their properties.


    ## 1.8. Amortized Analysis


    Amortized analysis is a technique used to determine the average performance of
    an algorithm over a sequence of operations. It differs from traditional worst-case
    analysis, which considers the maximum time or resources required for a single
    operation. Amortized analysis provides a more accurate representation of an algorithm''s
    real-world performance, particularly when some operations are more expensive than
    others, but occur infrequently.


    The three primary methods for performing amortized analysis are:


    1. **Aggregate Method**: The aggregate method involves calculating the total cost
    of a sequence of n operations and dividing it by n to obtain the average cost
    per operation. This method is simple to apply and provides an intuitive understanding
    of the algorithm''s performance. However, it may not be suitable for complex algorithms
    or those with varying operation costs.


    Example: In a dynamic array, the array''s size is doubled whenever it becomes
    full. While individual insertions can be expensive (`O(n)`) due to resizing, the
    cost of n insertions is `O(n)`, making the amortized cost per insertion `O(1)`.


    2. **Accounting Method**: The accounting method, also known as the banker''s method,
    assigns a "charge" to each operation, representing its actual cost plus an additional
    "credit" that is stored for future use. The credits are used to pay for expensive
    operations, ensuring that the total cost of the sequence remains within the specified
    bounds. The accounting method provides a more accurate representation of the algorithm''s
    performance, but it requires careful management of credits and a deeper understanding
    of the algorithm''s behavior.


    Example: In the dynamic array case, each insertion can be assigned a charge of
    2, with one unit covering the actual cost of the insertion and the other unit
    being stored as credit. When the array needs to be resized, the stored credits
    cover the cost, ensuring that the amortized cost per insertion remains `O(1)`.


    3. **Potential Method**

