    ## 3.1. Introduction to Arrays


    An array is a data structure that stores a fixed-size sequence of elements of
    the same data type. Arrays are useful for organizing and manipulating data, as
    they provide direct access to elements using their indices, which represent the
    position of each element in the array. This direct access allows for constant-time
    complexity (O(1)) when retrieving or updating elements in the array.


    In Java, arrays can be created for any data type, including primitive types (e.g.,
    `int`, `char`, and `double`) and reference types (e.g., objects and other arrays).
    Arrays are objects in Java and are allocated on the heap. They have a built-in
    property called `length`, which stores the number of elements in the array.


    Example of declaring and initializing an array in Java:


    ![image](d2d_images/image014.png)


    In Java, arrays can also be initialized with a predefined set of values:


    ![image](d2d_images/image110.png)


    Once an array is created, its size cannot be changed. If you need a dynamic data
    structure with a resizable array, you can use the `ArrayList` class in Java.


    Arrays are the foundation for many algorithms and data structures, as they provide
    a simple and efficient way to store and manipulate data. Understanding arrays
    is crucial for developing efficient algorithms and building more advanced data
    structures.


    ## 3.2. Array Operations


    There are several common operations that can be performed on arrays in Java. These
    operations include:


    1. **Initializing an array**: Declare and allocate memory for the array with a
    specified size or initialize it with predefined values.

    ![image](d2d_images/image130.png)


    2. **Accessing elements**: Retrieve or update an element in the array using its
    index.

    ![image](d2d_images/image084.png)


    3. **Iterating through an array**: Loop through each element in the array using
    a `for` loop or an enhanced `for` loop (for-each loop).

    ![image](d2d_images/image066.png)


    4. **Searching for an element**: Find the index of an element in the array by
    iterating through the array and comparing each element to the target value.

    ![image](d2d_images/image141.png)


    5. **Copying an array**: Create a new array and copy the elements from an existing
    array.

    ![image](d2d_images/image128.png)


    6. **Sorting an array**: Rearrange the elements in an array in a specific order,
    such as ascending or descending.

    ![image](d2d_images/image120.png)


    These operations form the basis for working with arrays in Java. Mastering these
    operations will help you efficiently store, access, and manipulate data in your
    programs.


    ## 3.3. Multi-Dimensional Arrays


    Multi-dimensional arrays are arrays of arrays, where each element is an array
    itself. The most common type of multi-dimensional array is a two-dimensional array,
    which can be thought of as a table or matrix with rows and columns.


    In Java, multi-dimensional arrays are created and accessed using nested square
    brackets. The following example demonstrates how to declare, initialize, and access
