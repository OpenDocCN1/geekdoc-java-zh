    ## 4.5. Java LinkedList 类


    Java 中的 `LinkedList` 类是双向链表的标准实现。它是 Java 集合框架的一部分，并提供了许多用于在列表中添加、删除和访问元素的方法。


    以下是 `LinkedList` 类中一些最常用的方法：


    * `addFirst(E element)`: 将指定的元素添加到列表的开头。

    * `addLast(E element)`: 将指定的元素添加到列表的末尾。

    * `removeFirst()`: 移除并返回列表中的第一个元素。

    * `removeLast()`: 移除并返回列表中的最后一个元素。

    * `getFirst()`: 返回列表中的第一个元素。

    * `getLast()`: 返回列表中的最后一个元素。

    * `isEmpty()`: 如果列表为空返回 `true`，否则返回 `false`。

    * `size()`: 返回列表中元素的数量。

    * `clear()`: 移除列表中的所有元素。


