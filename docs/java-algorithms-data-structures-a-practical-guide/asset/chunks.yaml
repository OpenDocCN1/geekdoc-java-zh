    ## 3.5. Array-backed Lists


    In Java, the `ArrayList` class in the `java.util` package provides a list implementation
    backed by an array. An `ArrayList` is similar to an array in that it maintains
    an ordered collection of elements, but it can dynamically resize itself when elements
    are added or removed.


