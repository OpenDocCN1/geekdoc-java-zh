    # 第 6 章 队列


    ![image](img/chapter_title_below.png)


    队列是计算机科学中另一种重要的数据结构，用于按特定顺序存储一组元素。在队列中，元素从一端添加并从另一端移除。添加元素的端称为队列的尾部（`back` 或 `tail`），而移除元素的端称为队列的头部（`front`
    或 `head`）。元素添加到队列的顺序被保留，第一个添加的元素是第一个被移除的。


    在本章中我们将涵盖队列的基础知识，包括它们的定义、属性和应用。我们还将讨论 Java 中队列的各种实现，以及使用队列的一些常用算法。


    ## 6.1. 队列 ADT


    队列抽象数据类型（ADT）是一个支持两个基本操作元素集合：`enqueue`入队）和 `dequeue`出队）。`enqueue` 将元素添加到队列尾部，而
    `dequeue` 移除并返回队列头部的元素。元素出队的顺序与它们入队的顺序相同。这种排序属性被称为先进先（FIFO）。


    除了基本的 `enqueue` 和 `dequeue` 操作外，队列 ADT 可能还支持其他操作，如 `peek`查看、`isEmpty`判空和 `size`大小。`peek`
    操作允许我们在不移除元素的情况下检查头部的元素。`isEmpty` 检查队列是否为空，而 `size` 返回队列的大小。


    以下是在 Java 中定义基础 `Queue` 接口的示例：


    ![image](img/image34.png)


    该接口定义了任何队列实现必须支持的基本操作。`enqueue` 方法将元素添加到尾部，`dequeue` 方法移除并返回头部的元素，`peek` 方法在不移除元素的情况下返回头部的元素。`isEmpty`
    方法检查队列是否为空，`size` 方法返回队列元素数量。


    通过定义 `Queue` 接口，我们可以编写独立于队列实现的代码。


    ## 6.2. 基于数组的队列实现


    基于数组的队列是通过固定大小数组存储队列元素的队列实现。队列的头部位于数组索引 0，队列的尾部位于使用的最高索引处。当元素出队时，头部索引增加；当元素入队时，尾部索引增加。如果尾部索引到达数组末尾，它将回绕到数组开头。


    这是一个 Java 中基于数组的队列实现的示例：


    ![image](img/image004.png)


    在这个实现中，我们使用一个数组元素来存储队列元素。我们还跟踪队列的头部和尾部索引，以及队列的当前 `size`。


    `enqueue` 方法通过增加尾部索引（在必要时回绕）并将元素插入新的尾部索引处，将元素添加到队列尾部。


    `dequeue` 方法通过获取头部索引元素、增加头部索引（在必要时回绕）并减少 `size` 来移除并返回头部的元素。


    `peek` 方法在不移除元素的情况下返回头部的元素。


    `isEmpty` 方法通过检查 `size` 来判断队列是否为空。


    `size` 方法返回队列的大小。


    注意，此实现使用了固定大小的数组，因此当数组满时，尝试入队新元素将抛出 `IllegalStateException`。


