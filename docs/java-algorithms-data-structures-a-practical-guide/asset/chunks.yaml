- fmt: "\nBinary search is more efficient than linear search for large arrays because\
    \ it has a time complexity of `O(log n)` compared to linear search's `O(n)`. However,\
    \ it requires the array to be sorted beforehand, which can be an additional overhead\
    \ if the array is frequently updated.\n\nHere are some examples of how binary\
    \ search can be implemented in Java:\n\n### Example 1: Binary Search using recursion\n\
    \n![image](d2d_images/image094.png)\n\nIn this example, the `binarySearch` method\
    \ is implemented using recursion. It takes four parameters: the array to be searched,\
    \ the target value, the left index of the search interval, and the right index\
    \ of the search interval. At each recursive call, it calculates the middle index\
    \ of the search interval and compares the middle element with the target value.\
    \ If they are equal, it returns the index of the middle element. Otherwise, if\
    \ the middle element is greater than the target value, it searches in the left\
    \ half of the search interval by calling the method recursively with the left\
    \ and `mid - 1` indices. If the middle element is less than the target value,\
    \ it searches in the right half of the search interval by calling the method recursively\
    \ with the `mid + 1` and `right` indices.\n\n### Example 2: Binary Search using\
    \ iteration\n\n![image](d2d_images/image099.png)\n\n## 9.3. Interpolation Search\n\
    \nInterpolation search is another search algorithm that works best on uniformly\
    \ distributed data. It is an improvement over binary search as it uses the value\
    \ of the key being searched to estimate the position of the key in the sorted\
    \ array.\n\nThe interpolation search algorithm works by first calculating an approximation\
    \ of the index at which the target value is located. This is done by estimating\
    \ the position using the formula:\n\n![image](d2d_images/image100.png)\n\nwhere\
    \ `left` and `right` are the left and right boundaries of the subarray being searched,\
    \ `target` is the value being searched for, and `arr` is the sorted array.\n\n\
    Once the approximation is made, the algorithm checks the value at that index.\
    \ If the value is equal to the target value, the algorithm returns the index.\
    \ If the value is less than the target value, the algorithm continues searching\
    \ in the right subarray. If the value is greater than the target value, the algorithm\
    \ continues searching in the left subarray.\n\nIf the algorithm reaches the end\
    \ of the subarray without finding the target value, it returns `-1` to indicate\
    \ that the value was not found.\n\nHere's an example implementation of interpolation\
    \ search in Java:\n\n![image](d2d_images/image021.png)\n\nIn this implementation,\
    \ we first check if the target value is within the range of the subarray being\
    \ searched. If it is, we calculate the estimated position using the formula described\
    \ above. If the value at the estimated position is equal to the target value,\
    \ we return the index. If the value is less than the target value, we search in\
    \ the right subarray. If the value is greater than the target value, we search\
    \ in the left subarray. If the algorithm reaches the end of the subarray without\
    \ finding the target value, it returns `-1` to indicate that the value was not\
    \ found.\n\n## 9.4. Exponential Search\n\nExponential search is a searching algorithm\
    \ that works on a sorted array. It starts by comparing the search key with the\
    \ first element of the array. If the key is smaller than the first element, the\
    \ search is terminated because the key will not be found in the array. Otherwise,\
    \ the algorithm sets the upper bound of the search range to the next power of\
    \ two greater than the length of the array, and the lower bound to be the last\
    \ power of two smaller than the length of the array. It then performs a binary\
    \ search on the subarray between these bounds, which is guaranteed to contain\
    \ the search key if it is present in the array.\n\nHere is an implementation of\
    \ Exponential Search :\n\n![image](d2d_images/image152.png)\n\nIn this implementation,\
    \ the function takes an integer array `arr` and a search key `key` as input, and\
    \ returns the index of the key in the array if it is present, or `-1` if it is\
    \ not.\n\nThe algorithm starts by checking if the `key` is equal to the first\
    \ element of the array. If it is, the function returns `0`. Otherwise, it sets\
    \ the index `i` to `1`, and doubles it in each iteration until it finds an index\
    \ `i` such that the element at that index is greater than or equal to the search\
    \ key, or until `i` exceeds the length of the array. At this point, the function\
    \ performs a binary search on the subarray between `i/2` and the minimum of `i`\
    \ and the length of the array, which is guaranteed to contain the search key if\
    \ it is present in the array. The `Arrays.binarySearch` function is used to perform\
    \ the binary search, which returns the index of the key in the subarray if it\
    \ is present, or a negative value if it is not.\n\nHere are some examples of how\
    \ to use the `exponentialSearch` function:\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n![image](d2d_images/image109.png)\n\nOutput:\n\n![image](d2d_images/image011.png)\n\
    \n## 9.5. Comparison of Searching Algorithms\n\nWhen it comes to searching for\
    \ an element in a collection of data, there are several algorithms available,\
    \ each with its own advantages and disadvantages. The choice of which algorithm\
    \ to use often depends on the characteristics of the data being searched and the\
    \ particular requirements of the application. In this section, we will compare\
    \ the time and space complexities of the most common searching algorithms and\
    \ their strengths and weaknesses.\n\n1. **Linear Search**:\n    * Time Complexity:\
    \ `O(n)`\n    * Space Complexity: `O(1)`\n    * Suitable for small arrays or unordered\
    \ lists.\n    * Performance degrades with an increase in input size.\n\n2. **Binary\
    \ Search**:\n    * Time Complexity: `O(log n)`\n    * Space Complexity: `O(1)`\n\
    \    * Suitable for sorted arrays or lists.\n    * Provides a fast search for\
    \ larger arrays.\n\n3. **Interpolation Search**:\n    * Time Complexity: `O(log\
    \ log n)` (best case), `O(n)` (worst case)\n    * Space Complexity: `O(1)`\n \
    \   * Performs better than Binary Search for uniformly distributed data.\n   \
    \ * Performs worse than Binary Search for non-uniformly distributed data.\n\n\
    4. **Exponential Search**:\n    * Time Complexity: `O(log n)`\n    * Space Complexity:\
    \ `O(1)`\n    * Suitable for unbounded, sorted arrays.\n    * Performs better\
    \ than Binary Search when the element is closer to the beginning of the array.\n\
    \nIt's important to note that the actual performance of these algorithms can vary\
    \ depending on the specific implementation and the characteristics of the data\
    \ being searched. Additionally, some algorithms may have other advantages or disadvantages\
    \ beyond their time and space complexity, such as simplicity or ease of implementation.\
    \ Therefore, it's important to carefully consider the requirements of the application\
    \ and the properties of the data when choosing a searching algorithm.\n\n## 9.6.\
    \ Java Searching Utilities\n\nJava provides several built-in classes and methods\
    \ for searching elements in collections and arrays. Some of the commonly used\
    \ classes and methods are:\n\n1. `Arrays.binarySearch()` method: This method is\
    \ used to search an element in a sorted array. It returns the index of the element\
    \ if it is found, otherwise, it returns a negative number representing the insertion\
    \ point of the element.\n\nExample:\n\n![image](d2d_images/image150.png)\n\n2.\
    \ `Collections.binarySearch()` method: This method is used to search an element\
    \ in a sorted list. It returns the index of the element if it is found, otherwise,\
    \ it returns a negative number representing the insertion point of the element.\n\
    \nExample:\n\n![image](d2d_images/image080.png)\n\n3. `Arrays.asList()` method:\
    \ This method is used to convert an array into a `List`. The returned `List` is\
    \ a fixed-size list backed by the original array.\n\nExample:\n\n![image](d2d_images/image139.png)\n"
