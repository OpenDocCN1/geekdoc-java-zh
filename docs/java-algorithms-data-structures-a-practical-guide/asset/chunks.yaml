    # 第二部分：基础数据结构


    在本书的范围内，我们将深入探讨计算机编程中使用的基础数据结构。这些基础数据结构是更复杂、高级的数据结构以及各种算法的基础。我们将探索并理解它们的属性、操作和用例。本节涵盖的数据结构包括：


    1. **数组 (Arrays)**：数组是固定大小的连续内存块，存储相同类型的元素。它们可以通过索引对元素进行常数时间访问，使其在各种操作中都非常高效。我们将学习不同类型的数组以及可以在它们上执行的操作。

    2. **链表 (Linked Lists)**：链表是由节点动态数据结构，每个节点包含一个数据元素和一个指向序列中下一个节点的引用。它们允许高效的插入和删除，但不能提供对单个元素的常数时间访问。我们将讨论单链表、双向链表和循环链表，以及哨兵节点和伪头。

    3. **栈 (Stacks)**：栈遵循后进先出（LIFO）原则的线性数据结构，这意味着最后添加的元素是最被移除的元素。它们通常用于解析表达式、实现撤销/重做功能等。我们将涵盖使用数组和链表实现的栈，以及
    `Stack` 类和 `Deque` 接口。

    4. **队列 (Queues)**：队列遵循先进先出（FIFO）原则的线性数据结构，其中队列中最旧的元素是最被移除的元素。它们用于任务管理、调度和其他需要按特定顺序处理元素的场景。我们将讨论各种类型的队列，包括优先级队列以及在
    Java 中的实现。

    5. **递归 (Recursion)**：递归是一种强大的编程技术，涉及函数调用自己来解决问题的较小规模实例。我们将探索递归的概念，比较递归和迭代解决方案，并学习尾递归、记忆化和动态规划。


    在本部分的结束时，你将对这些基础数据结构有坚固的理解，并能够在 Java 中有效地实现和操作它们。


