    # Chapter 12. Graphs


    ![image](d2d_images/chapter_title_below.png)


    Chapter 12 of the book discusses Graphs and their implementation in Java. A graph
    is a collection of vertices or nodes that are connected by edges. Graphs are widely
    used in computer science for modeling and solving problems related to networks,
    routing, pathfinding, and more. In this chapter, we will cover the basic terminologies
    associated with graphs, different ways to represent them, and various algorithms
    to traverse, find the shortest path, and create the minimum spanning tree in a
    graph. We will also cover the implementation of these algorithms in Java.


    ## 12.1. Introduction to Graphs in java


    Graphs are a fundamental data structure used to represent networks or relationships
    between objects. In Java, graphs are commonly used in a wide range of applications,
    including social networks, computer networks, and transportation networks. A graph
    consists of a set of vertices, also known as nodes or points, and a set of edges,
    which connect pairs of vertices. Edges can be either directed, meaning they have
    a specific direction, or undirected, meaning they can be traversed in both directions.


    In Java, graphs can be represented using various data structures, including adjacency
    lists, adjacency matrices, and edge lists. Each data structure has its advantages
    and disadvantages, depending on the specific application requirements. Graph traversal
    algorithms are used to visit all vertices in a graph in a particular order. Two
    common traversal algorithms are depth-first search (`DFS`) and breadth-first search
    (`BFS`).


    Graph algorithms are used to solve various problems related to graphs, such as
    finding the shortest path between two vertices, finding the minimum spanning tree
    of a graph, and finding the maximum flow between two vertices. These algorithms
    include Dijkstra''s algorithm, Bellman-Ford algorithm, Floyd-Warshall algorithm,
    Kruskal''s algorithm, Prim''s algorithm, Ford-Fulkerson algorithm, and Edmonds-Karp
    algorithm.


    Java provides various libraries and frameworks for working with graphs, including
    `JGraphT`, `Jung`, and `GraphStream`. These libraries provide a wide range of
    functionalities for creating, manipulating, and visualizing graphs.


    ## 12.2. Graph Terminology in java


    In Java, graph terminology is used to describe the components and properties of
    graphs. Here are some of the commonly used terms:


    * Vertex: A vertex, also known as a node, is a fundamental unit of a graph. It
    can have a name, value, or other attributes associated with it.

    * Edge: An edge connects two vertices and can have a weight or other attributes
    associated with it.

    * Directed vs. Undirected: A directed graph has edges that point from one vertex
    to another, whereas an undirected graph has edges that connect two vertices without
    any direction.

    * Weighted vs. Unweighted: A weighted graph has edges with a weight or cost associated
    with them, whereas an unweighted graph has no weights on its edges.

    * Path: A path is a sequence of edges that connect a sequence of vertices in a
    graph.

    * Cycle: A cycle is a path that starts and ends at the same vertex.

    * Degree: The degree of a vertex is the number of edges connected to it.

    * Connected Graph: A graph is connected if there exists a path between any two
    vertices in the graph.

    * Disconnected Graph: A graph is disconnected if there exist two vertices in the
    graph that have no path connecting them.


    These terms are used to describe the structure and behavior of graphs in Java
    programs, which can be implemented using various data structures and algorithms.


    ## 12.3. Graph Representations


    Graphs can be represented in various ways, each with its own advantages and disadvantages.
    Some of the commonly used graph representations are:


    1. Adjacency Matrix: This is a 2D matrix where each element `(i, j)` represents
    an edge between vertices `i` and `j`. If the graph is weighted, the element `(i,
    j)` represents the weight. If the graph is directed, the matrix will be asymmetric.
    An adjacency matrix requires `O(V^2)` space, where `V` is the number of vertices
    in the graph.

    2. Adjacency List: This is a list of lists where each vertex `i` has a list of
    all the vertices adjacent to it. If the graph is weighted, each element of the
    list will also contain the weight of the edge. This representation requires `O(E
    + V)` space, where `E` is the number of edges in the graph.

    3. Edge List: This is a list of all the edges in the graph, represented as pairs
    of vertices. If the graph is weighted, each element of the list will also contain
    the weight of the edge. This representation requires `O(E)` space.


    In Java, these representations can be implemented using various data structures.
    For example, an adjacency matrix can be implemented using a 2D array, an adjacency
    list can be implemented using an `ArrayList` of `ArrayLists`, and an edge list
    can be implemented using an `ArrayList` of pairs.


    ## 12.4. Graph Traversals


    Graph traversal is the process of visiting all the vertices or nodes of a graph
    in a particular order. It is an important algorithmic task and is used as a building
    block for many graph algorithms.


    There are two commonly used methods for graph traversal:


    1. Depth-First Search (`DFS`)

    2. Breadth-First Search (`BFS`)


    Both `DFS` and `BFS` are used to traverse the graph and visit all the nodes, but
    they differ in the order in which they visit the nodes.


    DFS starts at the root node (or any arbitrary node) and explores as far as possible
    along each branch before backtracking. This is done by using a stack to keep track
    of the nodes to be visited.


    BFS, on the other hand, starts at the root node (or any arbitrary node) and visits
    all the nodes at the current depth before moving on to the next level. This is
    done by using a queue to keep track of the nodes to be visited.


    In both cases, a visited array or map is used to keep track of which nodes have
    already been visited to prevent revisiting the same node multiple times.


    Graph traversal can be used for many applications, such as finding the shortest
    path between two nodes, determining if a graph is connected, and discovering all
    the nodes that can be reached from a particular node.


