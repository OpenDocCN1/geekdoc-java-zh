    在此实现中，外部循环运行 `n-1` 次，其中 `n` 是数组的长度。内部循环通过不断将元素与前一个元素交换，直到它处于正确位置，从而将其移动到数组已排序部分的适当位置。


    插入排序（Insertion Sort）的空间复杂度为 `O(1)`，因为它只需要常数量的额外内存来存储排序过程中使用的临时变量。虽然插入排序的效率不高，但在数组已经部分排序或接近有序的情况下，它可能非常有用，因为对于这类输入，它的平均时间复杂度为
    `O(n)`。


    ## 8.4. 合并排序


    合并排序（Merge Sort）是一种分治法排序算法，其工作原理是将无序列表划分为 `n` 个子列表，每个子列表包含一个元素（单元素的列表被认为是有序的）。然后，它重复地合并这些子列表以生成新的排序子列表，直到只下一个子列表。这个最终的子列表就是排序后的列表。


    合并排序的时间复杂度为 `O(n log n)`，其中 `n` 是数组中元素的数量。这使得它比冒泡排序和选择排序等二次算法更高效。


    以下是合并排序在 Java 中的示例实现：


    ![image](img/image089.png)


    在此实现中，`mergeSort` 函数递归地将数组一分为两半，然后调用 `merge` 函数来合并已排序的半。`merge` 函数将两个排序的子数组合并成单个排序的子数组。


    合并排序的空间复杂度为 `O(n)`，因为它需要额外的内存来存储合并步骤中使用的临时数组。虽然这可能导致它的效率低于插入排序等算法，但在稳定性和保证最坏情况时间复杂度重要的情况下，它是很有用的。


    ## 8.5. 快速排序


    快速排序（Quick Sort）是另一种分治法排序算法，其工作原理是从数组中选择一个基准元素（pivot），并根据其他元素是否小于或大于基准将它们划分为两个子数组。然后递归地对子数组进行排序。


    快速排序在平均情况下的时间复杂度为 `O(n log n)`，但如果基准选择不当，最坏情况的时间复杂度可能达到 `O(n²)`。然而，随机化的快速排序版本可以降低最坏情况发生的概率。


    以下是快速排序在 Java 中的示例实现：


    ![image](img/image054.png)


    在此实现中，`quickSort` 函数根据基准元素递归地将数组分为两部分，基准元素被选择为数组中最右侧的元素。`partition` 函数通过将每个元素与基准进行比较来划分数组：如果元素小于基准，则移动到左子数组；如果大于或等于基准，则移动到右子数组。该函数随后返回基准元素的索引，该索引用于递归地划分子数组。


    由于递归调用栈，快速排序的空间复杂度为 `O(log n)`，使其比合并排序更节省内存。然而，它的最坏情况时间复杂度可能为 `O(n²)` 且不是稳定的。


    ## 8.6. 堆排序


    堆排序（Heap Sort）是另一种基于比较的排序算法，其工作原理是从输入数组构建一个最大堆或最小堆，并重复提取根元素将其放置在排序数组的末尾。


    在堆排序中，堆是一个二叉树，取决于是最大堆还是最小堆，每个父节点都大于或小于它的子节点。堆的根节点是堆中的最大或最小元素，这取决于具体是最大堆还是最小堆。


    堆排序的时间复杂度为 `O(n log n)`，空间复杂度为 `O(1)`。然而，它不是稳定的，这意味着相等元素在排序数组中的顺序可能无法保持。


    以下是堆排序在 Java 中的示例实现：


    ![image](img/image078.png)


    在此实现中，`heapSort` 函数首先通过对堆中的每个父节点调用 `heapify` 函数，从输入数组构建一个最大堆。`heapify` 函数递归地将父节点与其较大的子节点进行交换，直到父节点大于它的两个子节点。一旦构建了最大堆，该函数通过将根元素与堆中的最后一个元素交换来重复提取，并将堆的大小减一，并在根节点上调用
    `heapify` 以恢复最大堆属性。


    堆排序是一种原地排序算法，这意味着它不需要额外的内存来存储排序后的数组。然而在实践中，由于缓存性能较差，它比其他 `O(n log n)` 排序算法慢。


    ## 8.7. 计数排序


    计数排序（Counting Sort）是一种非比较的排序算法，其工作原理是统计输入数组中每个元素的次数，并利用这些信息将元素放在输出数组的正确顺序上。


    计数排序的时间复杂度为 `O(n + k)`，其中 `n` 是输入数组中的元素数量，`k` 是元素的范围，空间复杂度为 `O(n + k)`。然而，它只能用于排序整数或小范围的数据集，因为对于较大的数据集，其空间和时间复杂度会显著增加。


    以下是计数排序在 Java 中的示例实现：


    ![image](img/image135.png)


    在此实现中，`countingSort` 函数首先创建一个长度为输入元素范围的计数数组。然后遍历输入数组以统计每个元素的出现次数，并将这些信息存储在计数数组中。接着计算计数数组的前缀和以确定每个元素在输出数组中的位置。最后，它反向遍历数组，将每个元素放在正确的位置并减少该元素的计数。一旦所有元素都放入输出，该函数将元素复制回输入数组。


    计数排序是一种稳定的排序算法，意味着相等元素在排序数组中的顺序会被保持。它通常用作其他算法（如基数排序）的子程序。


    ## 8.8. 基数排序


    基数排序（Radix Sort）是一种非比较的排序算法，通过根据数字或字符对元素进行排序。它根据特定位置的数字或字符将元素分组（桶），然后重复地根据下一个数字或字符对元素进行排序，直到所有数字或字符都排序完毕。


    基数排序的时间复杂度为 `O(k * n)`，其中 `k` 是输入元素中数字或字符的最大，`n` 是元素数量。然而，它只能用于排序具有固定位数或字符数的元素，且如果位数或字符数很大，其时间复杂度可能会变得非常高。


    以下是基数排序在 Java 中的示例实现：


    ![image](img/image097.png)


    在此实现中，`radixSort` 函数首先找到输入数组中的最大元素，以确定排序所需的位数。然后它从低位到高位遍历每一位，并根据该数位对元素执行计数排序。它使用
    `getMax` 函数确定数组中的最大元素，并计算计数数组的前缀和以确定每个元素在输出数组中的位置。然后它按照正确顺序将元素放入输出数组中，并将排序后的元素复制回输入数组。


