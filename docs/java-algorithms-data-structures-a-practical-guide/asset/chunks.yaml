    # Chapter 5. Stacks


    ![image](d2d_images/chapter_title_below.png)


    A stack is a data structure that stores a collection of elements, and provides
    operations for adding and removing elements from one end of the collection, known
    as the "top" of the stack. Stacks follow the "last-in, first-out" (LIFO) principle,
    which means that the most recently added element is the first one to be removed.


    In Java, the `Stack` class is a standard implementation of a stack. It is part
    of the Java Collections Framework, and provides many methods for adding, removing,
    and accessing elements in the stack.


    Here are some of the most commonly used methods in the `Stack` class:


    * `push(E element)`: Adds the specified element to the top of the stack.

    * `pop()`: Removes and returns the element at the top of the stack.

    * `peek()`: Returns the element at the top of the stack without removing it.

    * `isEmpty()`: Returns true if the stack is empty, false otherwise.

    * `size()`: Returns the number of elements in the stack.


    Here''s an example usage of the `Stack` class:


    ![image](d2d_images/image143.png)


    In this example, we create a `Stack` object, push some elements onto the stack,
    pop the top element from the stack, and print the top element and the stack after
    each operation.


    In addition to the `Stack` class, Java also provides a `Deque` interface, which
    stands for "double-ended queue". A deque is a more general data structure that
    supports adding and removing elements from both ends, and can be used to implement
    a stack. The `ArrayDeque` and `LinkedList` classes in Java are implementations
    of `Deque` that can be used as a stack.


    ## 5.1. Array-based Implementation


    An array-based stack implementation uses an array to store the elements of the
    stack. The top of the stack is represented by an index into the array, and new
    elements are added and removed by updating this index.


    To implement an array-based stack in Java, we can define a class that has an array
    field to store the elements, and an integer field to keep track of the top index.
    Here''s an example implementation:


    ![image](d2d_images/image124.png)


    In this implementation, we use a generic type `E` to allow the stack to store
    elements of any type. We also define a default capacity for the array, and use
    `Arrays.copyOf` to resize the array if it is full.


    The `push` method adds a new element to the top of the stack by incrementing the
    top index and assigning the element to the corresponding position in the array.
    If the array is full, we double its capacity before adding the new element.


    The `pop` method removes and returns the element at the top of the stack by retrieving
    it from the corresponding position in the array, setting that position to `null`
    to release any references to the element, and decrementing the top index. If the
    stack is empty, we throw a `NoSuchElementException`.


    The `peek` method returns the element at the top of the stack without removing
    it. If the stack is empty, we throw a `NoSuchElementException`.


    The `isEmpty` method returns true if the stack is empty, false otherwise.


    The `size` method returns the number of elements in the stack.


    ## 5.2. Linked List-based Implementation


    A linked list-based stack implementation uses a linked list to store the elements
    of the stack. The top of the stack is represented by the head node of the linked
    list, and new elements are added and removed by updating the head node.


    To implement a linked list-based stack in Java, we can define a class that has
    a `node` class to represent the elements of the stack, and a `node` field to keep
    track of the head node of the linked list. Here''s an example implementation:


    ![image](d2d_images/image057.png)


    In this implementation, we use a generic type `E` to allow the stack to store
    elements of any type. We also define a nested `node` class to represent the elements
    of the stack.


    The `push` method adds a new element to the top of the stack by creating a new
    `node` with the specified element and the current head node as its `next` node,
    and setting the new node as the new head node.

