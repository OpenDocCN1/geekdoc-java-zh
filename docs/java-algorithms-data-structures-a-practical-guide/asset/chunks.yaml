    # 第 5 章. 栈（Stacks）


    ![image](img/chapter_title_below.png)


    栈是一种存储元素集合的数据结构，并提供了从集合的一一端添加和移除元素的操作，这一端被称为栈的“栈顶”（top）。栈遵循“后进先出”（LIFO）原则，这意味着最近添加的元素是第一个被移除的元素。


    在 Java 中，`Stack` 类是栈的标准实现。它是 Java 集合框架的一部分，并提供了许多用于在栈中添加、删除和访问元素的方法。


    以下是 `Stack` 类中一些最常用的方法：


    * `push(E element)`: 将指定的元素添加到栈顶。

    * `pop()`: 移除并返回栈顶的元素。

    * `peek()`: 返回栈顶的元素但不将其移除。

    * `isEmpty()`: 如果栈为空返回 `true`，否则返回 `false`。

    * `size()`: 返回栈中元素的数量。


    这里是 `Stack` 类的使用示例：


    ![image](img/image143.png)


    在这个示例中，我们创建了一个 `Stack` 对象，将一些元素推入栈中，从栈弹出顶部元素，并在每次操作后打印栈顶元素和栈。


    除了 `Stack` 类外，Java 还提供了 `Deque` 接口，它代表“双端队列”（double-ended queue）。deque 是一种更通用的数据结构，支持从两端添加和移除元素，并用于实现栈。Java
    中的 `ArrayDeque` 和 `LinkedList` 类都是 `Deque` 的实现。


    ## 5.1. 基于数组的实现


    基于数组的栈实现使用数组来存储元素。栈顶由数组的索引表示，通过更新该索引来添加和移除元素。


    在 Java 中实现基于数组的栈，我们可以定义一个拥有数组字段用于存储元素和一个整数字段用于跟踪栈顶索引的类。这里有一个实现示例：


    ![image](img/image124.png)


    在此实现中，我们使用泛型类型 `E` 以允许栈存储任何类型的元素。我们还为数组定义了一个默认容量，并在数组满时使用 `Arrays.copyOf` 对其进行扩展。


    `push` 方法通过增加索引并将元素赋值给数组的相应位置将新元素添加到栈顶。如果数组满了，我们在添加新元素之前将其容量翻倍。


    `pop` 方法通过从数组相应位置获取元素将其移除并返回，将该位置设置为 `null` 以释放对元素的引用，并递减索引。如果栈为空，我们抛出 `NoSuchElementException`。


    `peek` 方法返回栈顶的元素但不将其移除。如果栈为空，我们抛出 `NoSuchElementException`。


    `isEmpty` 方法如果栈为空返回 `true`，否则返回 `false`。


    `size` 方法返回栈中元素的数量。


    ## 5.2. 基于链表的实现


    基于链表的栈实现使用链表来存储元素。栈顶由链表的头节点表示，通过更新头节点来添加和移除元素。


    在 Java 中实现基于链表的栈，我们可以定义一个拥有 `node` 类用于表示元素和一个 `node` 字段用于跟踪链表头节点的类。这里有一个实现示例：


