    The potential method involves defining a potential function that measures the
    "potential energy" of the data structure at any given point in time. The potential
    energy represents the work done so far that can be used to offset future expensive
    operations. The amortized cost of an operation is calculated as the sum of its
    actual cost and the change in potential energy. The potential method provides
    a more general and formal approach to amortized analysis, but it requires a deeper
    understanding of the algorithm and the ability to define a suitable potential
    function.


    Example: For the dynamic array case, a potential function can be defined as the
    difference between the number of elements and half the array''s capacity. The
    potential energy increases with each insertion and decreases when the array is
    resized, ensuring that the amortized cost per insertion remains `O(1)`.


    # Chapter 2: Introduction to Data Structures


    Data structures are fundamental building blocks in computer programming, providing
    a means of organizing and storing data in a way that enables efficient access
    and modification. The choice of data structure can have a significant impact on
    the performance of an algorithm or application. This chapter introduces the concept
    of data structures and provides an overview of their various types and applications.


    ## 2.1. What is a Data Structure?


    A data structure is a specific way of organizing and storing data in a computer''s
    memory so that it can be accessed and modified efficiently. Data structures are
    essential in computer programming, as they provide a foundation for designing
    algorithms and implementing various software applications. The choice of data
    structure can significantly affect an algorithm''s performance and the overall
    efficiency of a software application.


    Data structures enable programmers to manage complex data, making it easier to
    perform operations such as searching, sorting, inserting, updating, and deleting
    elements. By selecting the appropriate data structure for a specific problem or
    use case, programmers can optimize the performance of their applications and ensure
    efficient utilization of system resources.


    ## 2.2. Types of Data Structures


    Data structures can be broadly categorized into two types: linear and non-linear
    data structures.


    ### Linear Data Structures

    These data structures store data elements in a sequential manner. Elements are
    arranged in a linear order, with each element having a unique predecessor and
    successor, except for the first and last elements. Examples of linear data structures
    include:


    1. `Arrays`: Fixed-size, contiguous blocks of memory that store elements of the
    same data type.

    2. `Linked Lists`: Dynamic data structures consisting of nodes that hold an element
    and a reference to the next node in the sequence.

    3. `Stacks`: Last-In-First-Out (LIFO) data structures that allow elements to be
    added and removed from the top.

    4. `Queues`: First-In-First-Out (FIFO) data structures that allow elements to
    be added at the rear and removed from the front.


    ### Non-Linear Data Structures

    These data structures store data elements in a hierarchical or interconnected
    manner. Elements are organized based on relationships or associations between
    them rather than a linear sequence. Examples of non-linear data structures include:


    1. `Trees`: Hierarchical data structures consisting of nodes connected by edges,
    with a single root node and no cycles.

    2. `Graphs`: Data structures that represent relationships between pairs of elements
    using vertices (nodes) and edges (connections between nodes).

    3. `Hash Tables`: Data structures that use hash functions to map keys to corresponding
    values, enabling efficient insertion, deletion, and search operations.


    Each data structure has its own set of advantages and disadvantages, making it
    more suitable for specific use cases and problem domains. By understanding the
    characteristics of various data structures, programmers can choose the most appropriate.


    ## 2.3. Abstract Data Types


    An abstract data type (ADT) is a high-level description of a collection of data
    and the operations that can be performed on that data. ADTs provide a way to describe
    the behavior of a data structure without specifying its underlying implementation.
    By focusing on the essential properties and operations of a data structure, ADTs
    enable programmers to design algorithms and applications that are independent
    of the specific data structure implementations. This abstraction makes it easier
    to change or optimize the underlying data structures as needed without affecting
    the overall functionality of the application.


    Common abstract data types include:


    1. `List`: A collection of elements with a linear order, allowing insertion, deletion,
    and access to elements at specific positions.

    2. `Set`: An unordered collection of distinct elements, supporting insertion,
    deletion, and membership testing operations.

    3. `Map`: A collection of key-value pairs, enabling efficient retrieval of values
    based on their corresponding keys, as well as insertion and deletion of key-value
    pairs.

    4. `Queue`: A collection that maintains elements in a First-In-First-Out (FIFO)
    order, allowing elements to be added at one end (rear) and removed from the other
    end (front).

    5. `Stack`: A collection that maintains elements in a Last-In-First-Out (LIFO)
    order, allowing elements to be added and removed from the top.

    6. `Graph`: A collection of vertices (nodes) and edges (connections between nodes)
    representing relationships between pairs of elements.


    By using abstract data types, programmers can design more modular and maintainable
    code, as the specific details of data structure implementations are encapsulated
    and hidden from other parts of the application. This separation of concerns allows
    developers to focus on the high-level functionality of their applications and
    easily adapt their code to changes in data structure implementations or requirements.


    ## 2.4. Java Collections Framework


    The Java Collections Framework is a set of interfaces and classes in the Java
    standard library that provide implementations of various data structures and algorithms.
    The framework simplifies the process of handling collections of data by offering
    ready-to-use, efficient, and flexible data structures. By using the Java Collections
    Framework, developers can take advantage of the built-in data structures and algorithms,
    reducing the need to implement custom data structures and improving the overall
    efficiency and maintainability of their applications.


    The framework includes interfaces for common abstract data types, such as:


    1. `List`: An ordered collection that allows duplicate elements and provides access,
