    value at the `rear` index to the new element and updating the `rear` index to
    the next position in the circular buffer. If the buffer is full, an exception
    is thrown.


    The `dequeue` method removes and returns the element at the front of the buffer
    by retrieving the value at the `front` index, setting the value to `null`, and
