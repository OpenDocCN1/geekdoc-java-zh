    In this example, the head points to the first node containing the element A, which
    points to the next node containing the element B, which points to the next node
    containing the element C, which points to `null`, indicating the end of the list.


    Singly linked lists can be used to implement various data structures and algorithms,
    such as stacks, queues, and hash tables. They are also useful for certain types
    of problems, such as traversing a linked structure in a depth-first or breadth-first
    manner.


    Some common operations on singly linked lists include:


    - `get(index)`: Returns the element at the specified index in the list.

    - `add(element)`: Adds an element to the end of the list.

    - `add(index, element)`: Inserts an element at the specified index in the list.

    - `remove(index)`: Removes the element at the specified index from the list.

    - `size()`: Returns the number of elements in the list.


