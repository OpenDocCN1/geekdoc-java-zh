    ## 4.3. Circular Linked Lists


    A circular linked list is a linked list in which the last node points to the first
    node, forming a circle. This means that the next pointer of the last node points
    to the first node, instead of being `null`. Circular linked lists can be either
    singly linked or doubly linked.


    To implement a circular linked list, we need to keep track of the first and last
    nodes in the list. When adding a new node to an empty list, both the first and
    last nodes should point to the new node. When adding a new node to a non-empty
    list, the next pointer of the last node should point to the new node, and the
    next pointer of the new node should point to the first node.

