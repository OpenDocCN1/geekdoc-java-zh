    \n## 1.1. 什么是算法？\n\n算法是一个定义良好的、逐步执行的程序，用于解决问题或完成特定任务。它由一系列有限的指令组成，遵循这些指令可以保证获得正确的解决方案或输出。算法是计算机程序的根本构建块，被应用于计算机科学、数学和日常生活等多个领域。\n\
