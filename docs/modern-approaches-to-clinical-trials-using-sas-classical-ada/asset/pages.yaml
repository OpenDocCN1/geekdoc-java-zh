  md: '# ### 5.3 Bayesian Model Averaging Continual Reassessment Method


    In the CRM, the prespecified skeleton $(p1,..., pj)$ is usually arbitrary and
    subjective. As a result, the performance of the CRM may be compromised by model
    misspecifications, which is a common drawback of parametric models. To enhance
    the robustness of the CRM, we can construct multiple CRM models in parallel, such
    that each model is equipped with a different skeleton representing uncertainty
    in the parametric modeling structure [3]. If there is no preference over different
    modeling structures, then we assign a discrete uniform prior probability to each
    CRM model. Through the Bayesian model averaging (BMA) procedure [4, 5], we let
    the data determine the weight of each model based on the posterior model probability.
    Automatically, the BMA-CRM assigns a larger weight to a model with a better fit,
    which ensures the robustness of the estimated toxicity probabilities even when
    some CRM models are misspecified.


    To be more specific, let $M_k$ denote the CRM model that is associated with the
    $k$th skeleton $(p_{k1},...,p_{kj})$ for $k=1,...,K$. Under the working model
    $M_k$, the toxicity probability at dose level $j$ is defined


    $$\Pi_{kj}(\alpha_k)=\exp(\alpha_k), \quad j=1,...,J$$


    where $\alpha_k$ is the unknown parameter that is associated with model $M_k$.
    Suppose that at a certain stage of the trial, $y_j$ patients have experienced
    the DLT among the $n_j$ patients treated at dose level $j$. Based on the observed
    data $D$, the likelihood function under model $M_k$ is


    $$L[\alpha_k|D, M_k] \equiv P(D|\alpha_k, M_k) \prod_{j=1}^J \frac{\exp(\alpha_k)^{p_{kj}})^{y_j}}{\{1-\exp(\alpha_k)\}^{n_j-y_j}}$$


    In the Bayesian hierarchical modeling framework, we specify $P(M_k)$ to be the
    prior probability that model $M_k$ is the true model. If there is no preference
    *a priori* for any single CRM model, we simply take a discrete uniform distribution
    for the prior model probability; that is, $P(M_k)=1/K$; otherwise, prior information
    can be incorporated by assigning a higher probability to a more preferred model.
    Under model $M_k$, we further'
