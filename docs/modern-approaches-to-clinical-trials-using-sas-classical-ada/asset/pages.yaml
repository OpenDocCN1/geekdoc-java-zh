  md: "# Inputs\n\nBelow are the requirements for BSMED:\n\n# Required Inputs\n\n\
    +   1. `curr`: data set with the seven columns, $K$ (trial ID) in the same format\
    \ as for the historical data, $n$ (the total sample size), $p$ (the proportion\
    \ of subjects in the control arm), $r$ (the annualized event rate), TD (the trial\
    \ duration), and TA (the accrual time), where all variables should be arranged\
    \ in columns. TF (the minimal follow-up time) is easily calculated using TA and\
    \ TD.\n\n+   2. `delta`: indicates a prespecified design margin of non-inferiority\
    \ trial.\n\n+   3. `eta0`: indicates the user's choice of a Bayesian credible\
    \ level in calculating the Bayesian type I error and power.\n\n+   4. `nmcs`:\
    \ indicates the number of Markov chain Monte Carlo (MCMC) samples.\n\n+   5. `abi`:\
    \ indicates the number of burn-in samples in each run of PROC MCMC.\n\n+   6.\
    \ `a0`: indicates a discounting parameter for the historical survival meta-experimental\
    \ data.\n\n+   7. `rep`: indicates the number of simulated data sets.\n\n+   8.\
    \ `sigma0`: indicates the initial prior variance of the parameter $\theta_0$.\n\
    \n+   9. `sigma1`: indicates the initial prior variance of the parameter $\theta_1$.\n\
    \n+   10. `tau0`: indicates the initial prior variance of the parameters, $\t\
    heta_{0K}$, for the historical data sets."
  merge: -1
  pgno: 244
- img_proc: true
  md: "11. $\tau$ indicates the initial prior variance of the parameters, $\theta_k$,\
    \ for the current data sets.\n\n12. SEEDGEN: indicates the initial seed to generate\
    \ sets of seed numbers in generating predictive data and running MCMC.\n\n# Optional\
    \ Inputs\n\n+   1. HIST: data set with the first three columns, $K$ (trial ID),\
    \ $y$ (total subject year duration), $v$ (total number of events), and an additional\
    \ column for treatment index ($x$), where $K$, $y$, and $v$ should be arranged\
    \ in the first, second, and third columns, and $x$ should be placed after column\
    \ 3. Note that $x$ is an indicator variable of the treatment arm, which takes\
    \ a value of 0 if it comes from the control arm and 1 if it comes from the experimental\
    \ arm. The values of $K$ should be consecutive integers starting with 1. For example,\
    \ if the total number of historical data sets is 5, the values of $K$ should be\
    \ enumerated as 1, 2, 3, 4, and 5.\n\n+   2. OUTPUT: name of the output text file\
    \ (RTF). One can also specify a directory/folder in the file will be stored. For\
    \ example, the output file named $output\\_a0$ will be stored in $c:\\...\\BSMED\\\
    BSMED(OUTPUT=...BSMED)$. If OUTPUT is not specified, the file will be indexed\
    \ by the name $BSMED\\_Output\\_a0$ as default. In the filename, $a0$ indicates\
    \ a discounting parameter for the historical survival meta-experimental data that\
    \ the user specifies in the macro.\n\n# Notes\n\n+   1. The name of the $K$ (trial\
    \ ID) variable in HIST should be the same as that of the $K$ (trial ID) variable\
    \ in CURR.\n\n+   2. TD and TA should be in the same time unit such as years.\n\
    \n+   3. TD is always greater than TA, and TD is allowed to be greater than or\
    \ equal to less or equal to the sum of TA and TF.\n\n+   4. The indicator variable\
    \ $x$ must be coded as 0 and 1.\n\n+   5. No missing values are allowed in both\
    \ data sets. However, it is"
