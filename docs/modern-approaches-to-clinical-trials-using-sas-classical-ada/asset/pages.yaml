  md: 'amount of a therapeutic agent that causes the therapeutic effect to the amount
    that causes toxicity [6]. Clearly, a drug with a wide therapeutic window (a high
    TI) is preferred. If a drug has a narrow therapeutic window, then the drug will
    need to be developed even more carefully, and physicians will prescribe the drug
    with caution.


    Oftimes, products developed for life-threatening diseases (e.g., cancer) tend
    to have narrow therapeutic windows. On the other hand, drugs developed to treat
    chronic diseases (e.g., high blood pressure, depression, high cholesterol, or
    arthritis) are required to have wide therapeutic windows because these drugs are
    frequently used in older patients, or patients with other concurrent diseases,
    and sometimes used in children.


    In clinical development, phase III trials are designed to confirm product efficacy.
    Results obtained from phase III studies provide evidence to help regulatory agencies
    make decisions on whether to approve a product, while the phase III program engaged
    significant resources. Therefore, it is critical that dose-ranging trials from
    phase II deliver the information to help with phase III design. In other words,
    if the appropriate dose or doses for product registration is not included in phase
    III trials, it is very likely that the product candidate will miss the opportunity
    of being approved for market authorization according to plan. Hence, information
    obtained from dose-ranging trials needs to provide sufficient support for dose
    selection in phase III study designs.'
