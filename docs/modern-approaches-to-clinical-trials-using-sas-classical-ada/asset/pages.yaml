  md: "# 10.5 Power and Sample Size for Response-Adaptive Randomization\n\nFor a randomized\
    \ design with a fixed predetermined allocation $\rho$ (e.g. $\rho=1/2$ or $\r\
    ho=2/3$), both the total sample size $n$ and the treatment group sizes $n_E=np$\
    \ and $n_C=n(1-\rho)$ are fixed quantities, appropriately chosen to achieve the\
    \ desired power of a test. A RAR trial, the total sample size $n$ is fixed, but\
    \ the treatment group sizes $N_E(n)$ and $N_C(n)$ are random. Therefore, when\
    \ planning a RAR trial, some special considerations are required for sample size\
    \ and power.\n\nHu and Rosenberger in [14] presented an approach to determine\
    \ an appropriate sample size for a RAR design with target allocation $\rho(p_E,\
    \ p_C)$. Considering testing the one-sided hypothesis $H_0: p_E=p_C$ versus $H_a:\
    \ p_E>p_C$. For a given level $\\alpha, H_0$ is rejected if the test statistic\n\
    \n```\n$\\frac{\\hat{p}_E-\\hat{p}_C}{\\sqrt{\\frac{\\hat{p}_E(1-\\hat{p}_E)}{N_E(n)}+\\\
    frac{\\hat{p}_C(1-\\hat{p}_C)}{N_C(n)}}} > z_{1-\\alpha}$\n```\n\nwhere $z_{1-\\\
    alpha}$ is the $100(1-\\alpha)$th quantile of the standard normal distribution.\
    \ Under the assumptions $N_k(n) \to \\infty$ almost surely, $\\hat{p}_{kn}\\hat{q}_{kn}\
    \ \to p_k q_k$ in probability, and $\\sqrt{n_k}(\\hat{p}_{kn}-p_k) \to N(0, p_k\
    \ q_k)$ in distribution for $k=E,C$ (which holds true for RAR procedures considered\
    \ in Sections 10.3.2, 10.3.3, and 10.3.4), the power function can be approximated\
    \ as\n\n```\n$P[p_E, p_C, N_E(n), N_C(n)] = Pr\\left( \\frac{\\hat{p}_E-\\hat{p}_C}{\\\
    sqrt{\\frac{\\hat{p}_E(1-\\hat{p}_E)}{N_E(n)}+\\frac{\\hat{p}_C(1-\\hat{p}_C)}{N_C(n)}}}\
    \ > z_{1-\\alpha} \\right) = \\Phi\\left( \\frac{p_E-p_C}{\\sqrt{\\frac{p_E(1-p_E)}{N_E(n)}+\\\
    frac{p_C(1-p_C)}{N_C(n)}}} - z_{1-\\alpha} \\right)$ \\n\\n(10.11)$\n```\n\nwhere\
    \ $\\Phi$ is the cumulative distribution function of the standard normal distribution.\n\
    \n Importantly, quantity (10.11) is a random variable because $N_E(n)$ and $N_C(n)$\
    \ are random. Under further asymptotic assumptions (that are met for RAR procedures\
    \ considered thus far):"
  merge: -1
  pgno: 501
- img_proc: true
  md: "+   - $E_N(n)/n-\rho\\in(0,1)$ almost surely and\n\n+   - $\\sqrt{n(E_N(n)/n-\r\
    ho)} \to N(0, \\sigma^2)$ in distribution for some $\\sigma^2>0$.\n\none can obtain\
    \ a second-order Taylor's approximation to the power function of a RAR design\
    \ [14]. It is shown that the power of a RAR design with target allocation $\r\
    ho$ is mainly determined by the power of a fixed allocation design with allocation\
    \ $\rho$ and the values of $N_E(n)/n-\rho$ and $(N_E(n)/n-\rho)^2$ (the expected\
    \ value of the latter is the variance of the allocation proportion). Therefore,\
    \ one can facilitate the planning of a sample size for RAR designs based on asymptotic\
    \ approximations.\n\nThree types of sample size can be distinguished: 1) sample\
    \ size to achieve power $1-\beta$ for a fixed allocation design (type I sample\
    \ size), 2) sample size to achieve power $1-\beta$ on average (type II sample\
    \ size), and 3) sample size to achieve power with probability $1-\\xi$ (for some\
    \ positive $\\xi$) (type III sample size) [14].\n\nIf consider a type I sample\
