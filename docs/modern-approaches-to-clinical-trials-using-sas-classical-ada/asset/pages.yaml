  md: '# 1.4 Emergence of Adaptive Designs in the 90s


    Sequential and group sequential designs are a special kind of adaptive designs.
    While group sequential designs originated in the 60s, one can probably credit
    Bauer''s work as the origin of what some refer to today as adaptive design [38].
    Bauer first described sample size adaptation based on results of an unblinded
    interim analysis [38]. Bauer and coauthors gave a historical overview of confirmatory
    adaptive designs over the 25 years since 1989 [39]. They describe the early days
    of adaptive design research, review the key methodological concepts, and summarize
    regulatory and industry perspectives on adaptive designs. The overview includes
    an extensive list of references (178 of them) and discusses the concepts of conditional
    power, conditional error and combination tests as the cornerstones for many approaches.
    It concludes with a critical review of how expectations at the beginning of the
    adaptive design journey were fulfilled, and it discusses potential reasons why
    the expectations were not fulfilled in some cases. Another good reference for
    adaptive designs is the book edited by He, Pinheiro and Kuznetsova [40].


    Major reasons for adaptations include: (1) adapting sample size because of uncertainties
    concerning design parameters (variability, background rate, treatment effect)
    at the planning stage; (2) choosing among multiple possible treatments; and (3)
    adapting to a subpopulation where study treatment is the most effective. Choosing
    among treatments includes selecting doses in dose-finding studies and selecting
    among different treatment regimens. Both types of treatment selection are covered
    in this book.


    Initial research on adaptive designs focused heavily on modifying sample size
    of a clinical trial. Sample size adaptation is discussed in great detail in Chapter
    3. Early methods use conditional power [38,41,42]. These approaches led to discussions
    regarding design efficiency, which in turn led to improvements such as the promising
    design [43,44]. While there are other techniques for sample size adaptation, not
    all of them have received the same level of software support as methods based
    on conditional error/combination tests. Examples include optimized sample size
    adaptation methods [45-48].'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'One approach is to use information-based group sequential design to adapt sample
    size [49]. Wan and coauthors suggest a relatively efficient sample size adaptation
    allowing only one sample size in order to limit potential reverse engineering
    that could produce an estimate for the interim treatment effect [48,50]. This
    strategy is implemented using the promising zone code of Chapter 3 by setting
    the conditional power needed to adapt very high and setting an appropriate maximum
    sample size.


    Another class of adaptive methods that emerged early focuses on response-based
    adaptive randomization. Response-based adaptive randomizations such as play-the-winner
    or randomized play-the-winner adaptive randomization were proposed as early as
    the 60s and 70s [51,52]. This class of adaptive randomization is discussed in
    Chapters 9 and 10. As noted by the authors for those two chapters, response-based
    randomization can be particularly valuable in studies where patients have a high
    risk of significant short-term outcomes, allowing a study to focus on the most
    effective treatments. While Chapter 10 focuses on binary outcomes, it references
    the broader applications of adaptive randomizations in the monograph by Hu and
    Rosenberger [53].'
