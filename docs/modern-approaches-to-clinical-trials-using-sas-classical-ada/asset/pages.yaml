  md: '# 9.4.2 Covariate-Adaptive Randomization by Minimization


    When there are a large number of prognostic factors in a trial, it becomes difficult
    to achieve overall balance across all of the covariates. Taves [6] and Pocock
    and Simon [7] proposed the minimization method (also known as dynamic allocation,
    covariate-adaptive, or adjusted randomization) for sequential treatment assignment.
    During the randomization process, the allocation probability of each subject is
    determined by the current overall balance among the treatment groups.


    In detail, let $l$ denote the total number of prognostic factors, among which
    continuous factors need to be categorized into meaningful ordinal levels. In a
    two-arm trial, let $n_{i1}$ be the number of subjects assigned to arm 1 and $n_{i2}$
    assigned to arm 2, then the difference for factor $i$ is given by


    $g_i = |n_{i1} - n_{i2}|, i=1, \dots$$


    The total imbalance is measured by a weighted sum over the marginal imbalance
    for each factor $G = \sum_{i=1}^{l} w_i g_i$, where $w_i$ is a weight characterizing
    the importance of the $i$th factor. Based on previous allocations of patients,
    each new patient is more likely to be assigned to the treatment arm that would
    lead to the least imbalance $G$. Illustration of the Minimization Method shows
    an illustration of the minimization method, with 40 patients distributed across
    two prognostic factors of sex and tumor stage.


    Table 9.7 Illustration of the Minimization Method


    | Prognostic Factor | Level | Imbalance | New Patient | Potential Imbalance |

    | | | | | | |

    | | | A B | | Assigned to A Assigned to B |

    | Sex | Male | 9 7 | 2 | 1 | 3 1 |

    | | Female | 10 14 | 4 | | 4 4 |

    | Tumor | l | 7 6 | 1 | 2 | 0 |'
  merge: -1
  pgno: 437
- img_proc: true
  md: '| II | 10 | 13 | 3 | | 3 | 3 |

    |---|---|---|---|---|---|---||

    | III | 2 | 2 | 0 | | Total | 12 | 8 |


    For illustration, we present an example to demonstrate how to achieve balance
    on two prognostic factors: sex and tumor stage. Assuming equal weights W1=W2=1
    for sex and tumor stage, suppose 40 subjects have been enrolled and the next subject
    entering the trial is a male patient with tumor stage I. If this new participant
    were assigned to arm B, the total imbalance between the two treatment groups would
    be minimized, in contrast to being assigned to arm A. Therefore, this subject
    will be assigned to arm B with a larger probability, say 0.75, in order to reduce
    the imbalance of treatment assignment.


    % The MinimizationRandom macro performs the minimization method to sequentially
    allocate the newly recruited subjects. To invoke the macro, users need to specify
    four input parameters:


    +   1. TreatedPatients is the data set that contains the information of the patients
    who have already been assigned treatments. The first column in the data set indicates
    the treatment for each patient, and the remaining columns correspond to prognostic
    factors, whose values should be discrete integers starting from 1.


    +   2. FactorWeight is the data set that specifies the weights for prognostic
    factors.


    +   3. NewPatient is the data set that stores the covariate information of the
    new patient.


    +   4. p is a large probability (ρ > 0.5) which is specified to reduce the imbalance
    of prognostic factors.


    The following code utilizes the % MinimizationRandomize macro to allocate three
    newly recruited subjects: a male with tumor stage I, a male with tumor stage II
    and a female with tumor stage II. These subjects will be assigned to the treatment
    arm that leads to a smaller imbalance with'
