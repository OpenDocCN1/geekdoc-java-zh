  md: '# 4.3.1 Model for Future Survival Data


    In this section, we discuss the meta-regression survival model under the general
    survival meta-experimental design setting discussed in 4.2 Meta Design Setting.
    Let $y_{ijk}$ denote the subject-level time-to-event (failure time) and $v_{ijk}$
    denote the right censoring indicator such that $v_{ijk}=1$ if $y_{ijk}$ is a failure
    time and $v_{ijk}=0$ if $y_{ijk}$ is right censored for, the subject in the $j$-th
    arm and the $k$-th trial for $i=1,\dots,n_{jk}$, $j=1,2,\dots,K$. We write $y_{jk}
    = \sum_{i=1}^{n_{jk}} y_{ijk}$ and $v_{jk} = \sum_{i=1}^{n_{jk}} v_{ijk}$ which
    denote the total subject duration and the total number of subject years, respectively,
    for $j=1,2,\dots,K$. We let $x_{jk}=0$ for $j=1$ (control) or 1 for $j=2$ (experimental).
    Then, we have the observed aggregate meta-survival data denoted by $D_K = \{y_{jk},
    v_{jk}, x_{jk}\}$, $j=1,2,\dots,K$.


    We further assume that, individual-level failure time follows an exponential distribution
    with mean $1/\lambda_{ijk}$, $Y_{ijk}\sim Exp(\lambda_{ijk})$, where $\lambda_{ijk}>0$
    is the hazard rate. The density function of $f(y_{jk}, v_{jk})$ is given by


    > $f(y_{jk}, v_{jk}) = \lambda_{jk}^{v_{jk}}e^{-\\lambda_{jk}y_{jk}}$. (4.2)


    The log-linear model for $\lambda_{jk}$ assumes


    > $$\log(\lambda_{jk}) = \gamma_0 + \gamma_1x_{jk} + \theta_k$. (4.3)


    where $x_{jk}=0$ for $j=1$ (control) or 1 for $j=2$ (experimental) for $k=1,\dots,K$.
    To ensure model identifiability in (4.2), we impose the constraint $\sum_{k=1}^K\theta_k=0$.
    For simplicity, we take $\theta_K = --\sum_{k=1}^{K-1}\theta_k$. In (4.2), $\theta_k$
    captures the differences among the trials. Note that under the exponential model,
    the design parameter $\gamma_1$ is the log hazard ratio of the treatment in the
    experimental arm. We set $\theta={\theta_1,\dots,\theta_K}$ and $\gamma={\gamma_0,\gamma1}$.
    Then the likelihood function based on the meta-survival data $D_K$ is given by


    > $L({\gamma,\theta}|D_K) = \Pi_{k=1}^K \Pi_{j=1}^2 exp\{y_{jk}(\gamma_0+\gamma_1x_{jk}+\theta_k)\}$


    > $\times exp\{-exp(\gamma_0+\gamma_1x_{jk}+\theta_k)y_{jk}\}$. (4.4)'
