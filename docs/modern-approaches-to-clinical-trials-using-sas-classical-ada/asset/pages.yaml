  md: '# 3.5 Summary and Conclusions


    Several different methods for blinded and unblinded sample size estimations were
    presented in this chapter for normally distributed data. Blinded methods reviewed
    included the one-sample variance method and the adjusted one-sample variance method.
    Unblinded SSR methods included Fisher''s combination test, the inverse normal
    method, CHW procedure, the promising zone design and conditional type error preserving
    procedures (Proscan and Hansberger, Müller and Schäfer). With the exception of
    the promising zone and the Müller and Schäfer procedure, all the other unblinded
    methods can be viewed as a special form of a combination test.


    These procedures can be extended to the case of a binary endpoint based on the
    asymptotic normal approximation of binomial distribution in situations where such
    approximation is appropriate. In cases where exact binomial distribution has to
    be used, the problem of SSR becomes more complicated and was not investigated
    within this chapter.


    Except for the promising zone and the Proscan and Hunsberger methods, unblinded
    SSR approaches reviewed were presented under the assumption that sample size adjustment
    is the only decision to be made at the interim analysis. This was chosen for the
    sake of simplicity (i.e. to focus on the concept of SSR under each method). In
    practice, other decisions such early stop for utility or efficacy often accompany
    SSR. For more real-life situations, the approaches presented in this section remain
    generally applicable, but the type I and II error rate calculation needs to be
    adjusted to reflect opportunities for early stopping.


    When a design includes the opportunity for an early efficacy stop, the need to
    preserve the overall type I error rate is well accepted. Early stopping due to
    utility is more subtle. It is common knowledge that stopping for utility can,,
    reduce the false positive rate, making it possible to use a higher significance
    level at the final analysis while maintaining the overall type I error rate at
    the desired level [38]. While the latter is theoretically justified, regulators
    are unwilling to accept a higher significance level at the final analysis due
    to a planned interim futility analysis because utility rules are not binding and
    may'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'be rigorously enforced by a sponsor.


    Many original manuscripts describing the unblinded SSR methodology focus solely
    on type I error control, because it is the most important topic to regulators
    (at least in a confirmatory trial setting). When considering SSR, one has to address
    not only type I error control but also the rules to select the new sample size
    and how to estimate the treatment effect at the end of the trial. We did not get
    the opportunity to address these issues in detail within this chapter. Some general


    **Sample size.** With the exception of the promising zone design, a user is free
    to choose the method to re-estimate the sample size. It is commonly accepted to
    revise the sample size based on the desired conditional power (similar to how
    zone design does). Even though in theory the sample size M does not have to be
    restricted, but in practice trials with unblinded SSR employ a cap on the maximum
    allowable sample size increase. The competing forces in selecting a maximum allowable
    sample size (MASS) are obvious. To maximize the chance of success in a trial (purely
    in terms of statistical power) we would select a value for the MASS that is as
    large as possible. This could potentially lead to increased costs and duration
    and carry a regulatory risk of achieving statistical significance for a treatment
    difference that is not clinically relevant. On the other hand, selecting too small
    a value for MASS could make the SSR effort useless, because power would not be
    maintained in situations of early departures from the assumptions used in the
    original sample size planning. As statisticians, we need to ensure that the selected
    value of the MASS is large enough to ensure the usefulness of a proposed SSR plan,
    while keeping in mind the implications of a large sample size increase to trial
    operations and interpretation.


    **Estimation.** In a two-stage design, naïve estimates from Stage 1 and Stage
    2 are unbiased. But because the Stage 2 sample size is determined by Stage 1 data,
    the naïve estimation approach based on data from both stages yields a biased estimate
    [39]. Final study inference (treatment difference estimate and associated confidence
    intervals) following a trial with unblinded SSR remains an active area of research.
    For some methods analytical solutions exist and for others simulation remains
    the only way of quantifying the bias in estimation. For'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'these reasons the authors did not attempt to give a comprehensive review of
    estimation methods here. With exception of the promising zone design, for most
    methods with a normal endpoint treatment effect estimation is usually accomplished
    by relying on the duality between Cis and a hypothesis test. Brann and coauthors
    [19] extended the repeated confidence interval approach of [20] to flexible designs.


    The promising zone design stands out from the other methods because it specifies
    the condition under which it can be used and does not require users to modify
    the test statistic or rejection region in the final analysis. The latter has an
    appealing property of simplicity. For example, one can use the standard Wald test
    statistic for final inference. All associated decisions that one has to make are
    “organically built into the promising-zone design,” including the new sample size
    selection rule and early utility/efficacy stop boundaries [3]. We would generally
    recommend the promising zone design, but with one word of caution. Because of
    the very feature of simplicity mentioned above, the duality property between hypothesis
    testing and confidence intervals is lost and treatment effect estimation at the
    end of such trials remains an open problem. For trials implementing the promising
    zone design, we suggest using simulation to carefully assess the amount of bias
    in treatment effect estimates at the end of trial on a case-by-case basis.


    Finally, we want to point out that in the unblinded SSR methodology literature,
    $n, N$ and $M$ often represent the total number of patients at the interim analysis,
    the original planned total sample size, and the revised total sample size, respectively.
    To be consistent with the notations used in this chapter, we used these symbols
    to note their counterparts per group in this section. Because we assume two treatment
    groups with equal allocation in this chapter, the unblinded SSR methods reported
    in the literature apply equally with the use of our notations even though the
    two sets of numbers differ by a factor of two.'
