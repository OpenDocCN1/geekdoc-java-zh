    \ the Emax Model\n\n```\ndata dose;\n    input dose@;\n    datalines;\n    0 2.5\
    \ 10 20\nrun;\n\n%macro simu(n=, sd=, e0=10, emax=80, ed50=5.5, h=1, outdst=dstcon)\n\
    ** n is the sample size in each dose group;\n    proc sql noprint;\n        select\
    \ count(dose)into:ngrp\n        from dose;\n    quit;\n    %let ngrp=&ngrp;\n\n\
    \    data_null;\n        set dose;\n        mean=&e0.+(&emax.*dose*&h)/(dose**&h.\
    \ + &ed50.**&h);\n        call sympt(compress(\"mean\"|put(n_, 1)), compress(mean));\n\
    \        call sympt(compress(\"dose\"|put(n_, 1)), compress(dose));\n    run;\n\
