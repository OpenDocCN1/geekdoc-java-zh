- img_proc: true
  md: "# 2.3.1 General Framework\n\nIn this section, we define the test statistic\
    \ to be monitored and specify its distributional properties. This distributional\
    \ theory is presented first in terms of a general framework which is then applied\
    \ to studies with normal, binomial, and time-to-failure outcomes.\n\nIn the simplest\
    \ situation, if we consider a two-arm randomized clinical trial comparing a test\
    \ treatment with a control treatment, we can denote the treatment difference by\
    \ a parameter $\theta$, which is also sometimes known as the effect metric. Depending\
    \ on the stochastic model one chooses for the endpoint of interest, the choice\
    \ of the parameter $\theta$ will also be different. For example, if a normal endpoint\
    \ is considered, then $\theta$ represents the difference of means. For a binomial\
    \ endpoint, $\theta$ will be a difference of proportions, a ratio of proportions,\
    \ an odds ratio, or a log odds ratio. For a survival endpoint, $\theta$ may represent\
    \ a difference of medians, a difference of survival rates for a given time point,\
    \ a hazard ratio, or a log hazard ratio. In general, we can also consider $\t\
    heta$ as the coefficient of the treatment effect in a regression model, as linear\
    \ regression, logistic regression or Cox proportional hazard models. Further,\
    \ we assume to design a trial with interim monitoring up to a maximum of $j$ stages\
    \ and data are analyzed cumulatively $l_1, l_2,...,l_j$ units of statistical information\
    \ about $\theta$. Sometimes, $l_j$ is also called the Fisher information at the\
    \ $j$th stage. Since $l_j$ is the maximum information that we can obtain from\
    \ the planned trial, we can also denote the information fraction by $t_j = l_j\
    \ / L_j$. For normal and binomial endpoint, $l_j$ is proportional to $n_j$ which\
    \ is the total number of subjects accrued by the $j$th monitoring stage, and similarly,\
    \ $t_j = n_j / n$. However for survival endpoint, $l_j$ is approximately proportional\
    \ to $d_j$, the total number of events observed by the $H_0: \theta = 0$ monitoring\
    \ stage. It is apparent that $H_0: \theta = 0$. This information fraction is therefore\
    \ necessarily bounded by $t_j \\in [0, 1]$ during the entire course of the trial.\n\
    \nAt each interim monitoring time point, $t_j$, we can obtain an estimator $\\\
    hat{\theta}(t_j)$ for the effect parameter $\theta$ and another estimator $\\\
    widehat{Var}[\\hat{\theta}(t_j)]$ for the variance of $\\hat{\theta}(t_j)$. We\
    \ assume the sample size at time point $t_j$ is large"
  merge: -1
  pgno: 76
- img_proc: true
  md: "enough that these estimators are consistent so that\n\n$\\frac{1}{l_j}=Var[\\\
    hat{\theta}(t_j)]$.\n\nIf these estimators are maximum likelihood estimators,\
    \ they are also asymptotically normal and efficient. The estimates produced by\
    \ most SAS procedures are maximum likelihood estimators and they are efficient.\
