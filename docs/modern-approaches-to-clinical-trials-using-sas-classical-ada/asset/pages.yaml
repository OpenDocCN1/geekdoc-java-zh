  md: '# 10.3.2 Sequential Maximum Likelihood Estimation Design


    With the sequential maximum likelihood estimation (SMLE) design, treatment randomization
    probabilities are set equal to the current estimates of the target allocation
    proportions [22,46]. In particular, Rosenberger and co-authors in [10] proposed
    the following SMLE procedure targeting the RSIHR allocation (10.2):


    ```

    $\phi_{m+l} E = \frac{\sqrt{\hat{p}_{Em}}}{\sqrt{\hat{p}_{Em}} + \sqrt{\hat{p}_{Cm}}}}
    \quad (10.7)$

    ```


    They proved strong consistency and asymptotic normality of both estimators and
    the sample allocation proportions with the procedure (10.7) and showed that the
    Wald test $

    Z_W = (\hat{p}_{Em} - \hat{p}_{Cm}) \left( \frac{\hat{p}_{Em}q_{Em}}{N_E(m)} +
    \frac{\hat{p}_{Cm}q_{Cm}}{N_C(m)} \right)^{-1/2}$ is asymptotically standard


    normal under $H_0 p_E = p_C$. They also showed via simulation that the procedure
    (10.7) can lead to a modest reduction in treatment failures with minimal or no
    loss in power compared to equal randomization designs. A limitation of the SMLE
    design is that it can be quite variable, which can have a negative impact on power.
    More elaborate RAR procedures are described in Sections 10.3.3 and 10.3.4.'
