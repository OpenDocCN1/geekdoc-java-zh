    \ x_{jk} + \theta_k)v_{jk}\\}$\n```\n\n```\n$times \\{\\Pi_{k=1}^{K_0} \\Pi_{j=x01k}^{x02k}\
    \ (\\exp \\{y_{0,j} + l_k(\\gamma_0 + \\gamma_1 + \theta_k\\})\\}$\n```\n\n```\n\
    $times \\exp\\{-(\\gamma_0 + \\gamma_1 l_k)y_{0,j} + l_k^2\\}^{\\alpha_0} \\pi_0^{(f)}(\\\
    theta_0)\\pi_\\gamma^{(f)}(\\gamma).(4.11)\n```\n\nWe use the Gibbs sampling algorithm\
    \ to sample from the posterior distribution in (4.11) given $D_K$ and $D_0$. The\
    \ Gibbs sampling algorithm requires sampling from the full conditional distribution\
    \ of each parameter given the other parameters. First, the full conditional density\
    \ for $[\\gamma_l, \tilde{\theta}_0, \theta_k, D_K, D_0, \\alpha_0]$ is given\
    \ by\n\n```\n$\\pi[\\gamma | \\tilde{\theta}_0, \\theta_k, D_K, D_0, \\alpha_0]\
    \ \\propto \\Pi_{k=1}^K \\Pi_j^2 \\exp \\{v_{jk}(\\gamma_0 + \\gamma_1 x_{jk}\
