  md: '# 2.1 Introduction


    One of the major advances in modern clinical trials is the invention and application
    of sequential analysis in experimental design. This type of design is often called
    the group sequential design. A group sequential design consists of multiple stages
    and employs a repeated significance testing strategy. It is one of the most commonly
    used adaptive designs. The Encyclopaedic Companion to Medical Statistics [1] defines
    sequential analysis as “a method allowing hypothesis tests to be conducted on
    a number of occasions as data accumulate through the course of a trial. A trial
    monitored this is usually called a sequential trial.” For example, in a phase
    III randomized clinical trial that has several stages; an interim analysis is
    planned at each stage. An interim analysis is an analysis intended to assess the
    treatment effect with respect to efficacy or safety based on accumulated data
    at a planned time prior to the completion of a clinical trial. Based on results
    from the interim analysis, such as a given test statistic is compared to a critical
    boundary, a decision can be made either to stop to reject the null hypothesis
    of no treatment effect, to accept the null hypothesis, or to continue on the next
    stage.


    There are three different types of group sequential designs: (1) early efficacy
    stopping design permitting only claiming of efficacy, (2) early utility stopping
    design permitting only claiming of futility, and (3) early efficacy or utility
    stopping design permitting either an efficacy or futility claim. Based on prior
    knowledge, if we believe that the test treatment is promising, an early efficacy
    stopping design should be used. If we are concerned that the test treatment may
    not work, an


    early utility stopping design should be employed.


    In clinical studies, there is great interest in sequential procedures for ethical,
    economic, and administrative reasons and the methodology has a role to play in
    all phases of clinical research. Therefore, this type of trial design is attractive
    to clinical scientists and researchers because it provides a method to add flexibility
    to the analysis of ongoing trial data. The most compelling reason for monitoring
    trial data is, ethically, it is desirable to terminate or modify a trial when
    evidence has emerged concerning the particular hypothesis of interest. Armitage
    [2] argued that ethical considerations demand a trial be stopped as soon as there
    is'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'clear evidence that one of the treatments is to be preferred and that this
    leads to the use of sequential trial. For a trial with a positive result, early
    stopping ensures that a new product can be exploited sooner. If a negative result
    is indicated, early stopping avoids wasting resources and does not subject patients
    to inefficacious treatments. Sequential methods typically lead to savings in average
    sample size, time, and cost compared to a classical design with a fixed sample
    size. This is especially true if investigators are not certain of the effect size
    of the new treatment. If the true effect size is in fact larger, early stopping
    will be desirable; if the true effect size is smaller than expected, the trial
    may continue or even stop for early utility.



    On the other hand, there are situations when a fixed sample design may be preferred
    to a group sequential design. In practice, if we have good knowledge regarding
    the effect size, a classical design with a fixed sample size may be more efficient.
    In this case, it does not require periodic monitoring and can lighten the administrative
    burden. Also, in some trials, if safety of the test treatment was not adequately
    assessed in previous trials, using the group sequential design to stop early for
    efficacy may lead to insufficient exploration of potential safety concerns. In
    this case, not only is the safety population too small to answer safety questions,
    but if secondary outcomes are also important, early stopping for the primary efficacy
    outcome may not give adequate power for testing these secondary hypotheses. Also,
    the success of using group sequential methods necessitates that responses on the
    outcomes be readily measured for decision-making regarding trial termination before
    the recruitment of the next group of subjects, and so delayed responses may present
    a challenge to trial monitoring. Last, if obtaining an unbiased estimator of the
    effect size is one of the objectives, group sequential methods will be inadequate
    to achieve this goal by shifting sampling distribution across stages. Therefore,
    it is important to consider these factors carefully before deciding on adopting
    the sequential testing approach.



    If the group sequential testing strategy is appropriate, it can be executed in
    two phases - the design phase and the interim monitoring phase. At the design
    stage, the user specifies the following:


    +   - statistical process generating the data,'
  merge: -1
  pgno: 64
- img_proc: true
  md: '+   - the null and alternative hypotheses being tested,

    - the desired type I error,

    - the power of the sequential testing procedure,

    - the shape parameters for the spending functions of stopping boundaries,

    - the planned number of interim looks,

    - and the timing of the interim looks.


    To facilitate the design, the maximum number of interim looks at the data is pre-specified.
    At the interim monitoring phase, the interim looks or interim analyses can be
    conducted at precisely equally spaced intervals or when outcomes of equal number
    of subjects are ascertained. During the course of a trial, many factors may influence
    the frequency and timing of interim analyses. If the frequency or timing of the
    analyses is to be substantially altered from the planned schedule then the designs
    described above will become inappropriate. There are two distinct approaches to
    monitoring: continuous monitoring and discrete. As an abstract concept, continuous
    monitoring refers to the test statistic on a continuous scale as a function of
    the continuous information fraction. In the context of clinical trial, continuous
    monitoring means monitoring after observing the outcome of every single subject.
    In practice, this is seldom performed. Discrete monitoring, however, refers to
    monitoring after observing the outcomes of a group of subjects. This type of sequential
    group monitoring is the focus of this chapter.


    During the actual conduct of the group sequential trial, one may want to allow
    for flexibility in the analysis, while maintaining the integrity of the trial
    as bias may be introduced during interim examinations of accrued data. In this
    case, the role of a data and safety monitoring board (DSMB) should not be understated.
    For instance, it may be necessary to set the dates of the interim monitoring looks
    so as to accommodate the schedule of the DSMB. Typically, the DSMB plans to meet
    after equal increments of calendar time, which do not necessarily coincide with
    the information fractions specified at the design stage. Again, it may be necessary
    to alter the planned number of looks at the data,'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'either for safety reasons or if the accrual assumptions are not met, or for
    other administrative reasons. These alterations can change the operating characteristics
    of the study unless suitable adjustments are made in the interim monitoring phase.
    Therefore, in the interim monitoring phase, adjustments by implementing the error
    spending function methodology are necessary. In addition, the DSMB can serve to
    regularly monitor whether the correct study population is being recruited and
    if blinding among study subjects and personnel is maintained by looking at potential
    inconsistency throughout the stages. Any negative impact of each interim analysis
    on the conduct of the trial to the next stages should also be assessed and minimized
    if continuation is warranted.


    In a group sequential design, the control of type I error is of great importance,
    because repeated significant tests at a fixed level on accumulating data increase
    the probability of a type I error [3]. Therefore, the same critical value for
    a fixed sample test cannot be applied to each stage of sequential design. For
    example, with a fixed-sample two-sided test, the critical values ±1.6 for a standardized
    statistic produce a type I error probability level $\alpha = 0.05$. For a two-sided
    sequential test with two equally spaced stages, if the critical values are used
    to reject the null hypothesis at these two stages, the type I error probability
    level is $\alpha = 0.083$, larger than the fixed-sample $\alpha$.


    There are several types of methods for calculating boundary values or critical
    values. The first type is the fixed boundary shape method which derives boundaries
    based on specific boundary shapes. Examples of fixed boundary shape methods are
    the unified family methods and the Haybitt-Peto method. The unified family methods
    [4] derive boundaries from specified boundary shapes. These methods employ the
    Pocock method [5] and the O’Brien-Fleming (OBF) method [6] as special cases, among
    others. The Haybitt-Peto method [7, 8] uses a value of 3 for the critical values
    on the scale of the $z$-statistic in interim stages, so the critical value at
    the final stage is close to the critical value for the fixed-sample design. The
    second type is the Whitehead method which adjusts boundaries derived for continuous
    monitoring so that they apply to discrete monitoring [9]. With continuous monitoring,
    the values for each boundary fall in a straight line when plotted on the score
    statistic scale. By subtracting the expected'
  merge: -1
  pgno: 66
- img_proc: true
  md: "overshoot from the continuous boundary, the discrete boundary is derived to\
    \ obtain the desired type I and type II error probabilities. This approach proposed\
    \ by Whitehead is also known as the Christmas-tree correction. For a design with\
    \ early stopping to reject or accept the null hypothesis, the boundaries form\
    \ a triangle when plotted on the score statistic scale. The last test is the error\
    \ (also known as $\\alpha$ or $\beta$) spending methods. For every sequential\
    \ design, the type I error $\\alpha$ and the type II error $\beta$ at each stage\
    \ can be computed from the boundary values. Therefore, reversibly, you can derive\
    \ the boundary values from specified errors for each stage. The error spending\
    \ function approach [10] uses spending functions to specify the errors at each\
    \ stage for each boundary and derives the boundary values accordingly. Within\
    \ each type of method, you can choose approaches that create boundary values that\
    \ range from conservative stopping boundary to liberal stopping boundary values\
    \ at early stages.\n\nThe control of type I and II errors is applied rigorously\
    \ in later phases of clinical development and,, most of our examples in this chapter\
    \ will be in the context of phase II or III trials. This methodology has been\
    \ developed with reference to two-arm clinical trials, it applies with some modifications\
    \ to the one-sample setting well. For multi-arm trials in which two or more treatments\
    \ are compared to a common control arm, the two-arm approach to control for multiple\
    \ looks can still be applied if supplemented by multiple testing procedures (such\
    \ as Bonferroni or Hochberg) to control for multiple comparisons. A thorough coverage\
    \ of group sequential methods for clinical trials is offered in the textbook by\
    \ Jennison and Turnbull, which is an excellent source of indepth methods for sequential\
    \ analysis [11]. In addition, Todd also provided a comprehensive 25-year review\
    \ of the application of sequential methods [12].\n\nIn order to illustrate the\
    \ practical aspects of group sequential methods, this chapter is organized in\
    \ the following sections. 2.2 Examples of Classical Fixed-Sample Designs presents\
    \ four examples of typical clinical trials that have used the fixed-sample design\
    \ to calculate the total sample size. 2.3 Theories of Group Sequential Tests explains\
    \ the distributional theories of group sequential testing with a focus on normal,\
    \ binomial, and time-to-event endpoints. 2.4 Types of Stopping Boundaries provides\
    \ more details on the derivation of stopping boundary"
