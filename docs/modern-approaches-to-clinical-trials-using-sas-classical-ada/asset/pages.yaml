- img_proc: true
  md: '# 4.2.1 Notation


    We consider $K$ randomized trials where each trial has two treatment arms denoted
    by control and experimental and $K \ge 1$. The control arm may be a placebo or
    an active control, and the experimental arm may be an investigative drug in the
    clinical trial setting. However, in the medical device application, the control
    arm may be an old generation medical device and the experimental arm may refer
    to a new generation medical device. For ease of presentation, we generically call
    these two arms as control and experimental.


    $n_{jk}$ denote the sample size for the $j^{th}$ treatment arm in the $k^{th}$
    randomized trial, where $j=1$ and $j=2$ denotes control and experimental, respectively,
    for $k=1, \dots, K$. We write $n_k = n_{1k} + n_{2k}$ which denotes the total
    sample size for $k^{th}$ randomized trial. We also let $p_k$ and $r_k$ denote
    the proportion of subjects and the annualized event rate, respectively, for $k=1,
    \dots, K$. The proportion of subjects in the control arm, which is also called
    the randomization ratio, plays a role to allocate the sample size to the control
    and experimental arms. Using this quantity, we have $n_{1k} = \lceil p_k n_k \rceil$
    and $n_{2k} = n_k - n_{1k}$ where $\lceil p_k n_k \rceil$ is the largest integer
    than or equal to $p_k n_k$. The annualized event rate is a prespecified probability
    that an event will occur in less than a year. It is also used to specify the design
    value of the mean survival time in the sampling prior discussed in 4.6 Computational
    Algorithms. Finally, we let $\tau_k^A$ and $\tau_k^F$ denote accrual time and
    minimal follow-up time, respectively, for $k=1, \dots, K$.'
