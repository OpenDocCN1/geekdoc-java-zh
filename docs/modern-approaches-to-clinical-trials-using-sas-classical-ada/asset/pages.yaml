  md: '# ## 10.7.2 Implementing DBCD


    # ### 10.7.2.1 Three Cohort Design


    Here we describe two examples that can be modified by the reader in order to implement
    RAR designs in practice. Sample results are provided in the supplemental materials.


    Supplementary program `ch10.7.2.sas` illustrates a practical implementation of
    the DBCD ($\gamma=2$) for a three cohort design. In this example, 60 patients
    are randomized to either $E$ or $C$ using PBD with block size 4, with responses
    generated from a Bernoulli distribution with a probability of 0.4 or 0.2, respectively.
    The second cohort (20 patients) is randomized to either $E$ or $C$ given the data
    from Cohort 1. Responses are generated from a Bernoulli distribution with probability
    of 0.4 or 0.2 for $E$ or $C$, respectively. The last cohort is randomized to $E$
    or $C$ using the DBCD ($\gamma=2$) given data from Cohorts 1 and 2.


    # ## 10.7.2.2 Two Cohort Sequential Design


    Supplementary program `ch10.7.2.sas` also illustrates a two cohort sequential
    design using DBCD ($\gamma=2$). A total of 60 patients will be randomized into
    the first cohort (20 patients) is randomized to $E$ or $C$ using PBD with block
    size 4, with responses generated from a Bernoulli distribution with a probability
    of 0.4 or 0.2, respectively. After this cohort is complete, further allocation
    is sequentially: every patient is randomized to $E$ or $C$ using DBCD ($\gamma=2$),
    given the data from all previous patients and assuming responses are instantaneous.
    Patient responses are generated from a Bernoulli distribution with probability
    of 0.4 or 0.2 for $E$ or $C$, respectively.'
