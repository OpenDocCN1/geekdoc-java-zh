  md: '# 11.1 Introduction'
  merge: -1
  pgno: 527
- img_proc: true
  md: '# 11.1.1 Background


    Traditional clinical development of an experimental therapy utilizes the "one-size-fits-all"
    approach by testing the regimen in an unselected untargeted patient population
    with a specific disease. The assumption is that response in the population with
    the disease is homogeneous. With the advent of molecular targeted therapies, genetic
    engineering such as DNA sequencing and mRNA transcript profiling makes a finer
    taxonomy of disease possible, which enables the development of precise diagnostic,
    prognostic, and therapeutic paradigms for specific subsets of patients, i.e. personalized
    medicine. Therefore, these targeted therapies may benefit only subset of the entire
    population and may not benefit or even harm the rest of the population. On the
    other hand, proteomic and genomic biomarkers have the potential to provide substantial
    added value to the current medical practice. For instance, in oncology, some biomarkers
    provide the possibility to integrate an accurate predictor of efficacy with a
    specific mechanism-based therapy using the genetic makeup of the tumor and the
    genotype of each individual patient to guide the selection of cancer treatment
    [Some Oncology Drugs Approved in the US for Patient Populations by Molecular Targets].


    As a result of these new opportunities and challenges, the traditional paradigm
    of drug development not taking into account response heterogeneity may be suboptimal.
    To embark on the mission of personalized medicine, innovative statistical designs
    beyond the interaction test of a traditional fixed design are becoming increasingly
    attractive, which allow assessment of treatment effects due to phenotypic or genomic
    heterogeneity of patients. Furthermore, focused clinical trials using a biomarker
    strategy may result in smaller sizes, higher probability of trial success, enhancement
    of the benefit-risk relationship, and potentially mitigating ever-escalating development
    costs.


    In 2012, the FDA released a draft guidance on enrichment strategies for clinical
    trials to support approval of human drugs and biological products. In their guidance,
    the term enrichment is defined as "the prospective use of any patient characteristic
    to select a study'
  merge: -1
  pgno: 528
- img_proc: true
  md: 'population in which detection of a drug effect (if one is in fact present)
    is more likely than it would be in an unselected population.” Further, enrichment
    strategies fall into three broad categories (excerpts from the guidance):


    +   Strategies to decrease heterogeneity – These include selecting patients with
    baseline measurements in a narrow range (decreased inter-patient variability)
    and excluding patients whose disease or improve spontaneously or whose measurements
    are highly variable (decreased intra-patient variability). The decreased variability
    provided by these strategies increase power.


    +   Prognostic enrichment strategies – choosing patients with a greater likelihood
    of having a disease-related endpoint event (for event-driven studies) or a substantial
    worsening in condition (for continuous measurement endpoints). These strategies
    will increase the absolute effect difference between groups but will not alter
    relative effect.


    +   Predictive enrichment strategies – choosing patients more likely to respond
    to the drug treatment than other patients with the condition being treated. Such
    selection can lead to a larger effect size (both absolute and relative) and permit
    use of a smaller study population. Selection of patients could be based on a specific
    aspect of a patient’s physiology or a disease characteristic that is related in
    some manner to the study drug’s mechanism, or it could be empiric (e.g., the patient
    has previously appeared to respond to a drug in the same class).


    In this chapter, we give an overview of population enrichment designs that are
    growing in the statistical literature, with a focus on designs of predictive enrichment
    strategies so as to increase the power and efficiency to detect an effective therapy
    with regard to a predictive biomarker in a clinical trial. A predictive biomarker
    is a type of biomarker that identifies patients who are likely to benefit from
    treatment, in contrast to a prognostic biomarker which is associated with only
    the disease outcome. The focus of this chapter is on the efficacy endpoint of
    interest; design issues with respect to predictive biomarkers on safety will not
    be discussed.'
  merge: -1
  pgno: 529
