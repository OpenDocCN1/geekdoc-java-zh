    \ decision criteria prior to data access and data analysis, and understanding\
    \ the risks that are associated to it (i.e., to stop a promising drug and to carry\
    \ forward an ineffective drug).\n\n# 6.2.7.3 Choice of Type I and Type II Errors\n\
    \nIn clinical development of new products, it is well known that $\\alpha$ is\
    \ the probability of making a type I error; i.e., the probability of developing\
    \ a placebo. $\beta$ is the probability of making a type II error, or the probability\
    \ of stopping development of a potentially good product. In most phase III development\
    \ programs, Authorities generally expect the $\\alpha$ to be set at a two-sided\
    \ 0.05 (or one-sided at 0.025). In phase III, $\\alpha$ can be thought of as a\
    \ regulatory risk because it represents the risk of approving a product without\
    \ sufficient efficacy for the targeted patient population, but could cause adverse\
    \ events or other safety concerns. On the other hand, $\beta$ can be thought of\
    \ as the sponsor’s risk because"
