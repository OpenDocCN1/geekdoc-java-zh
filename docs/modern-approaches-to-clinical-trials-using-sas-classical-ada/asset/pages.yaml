- img_proc: true
  md: '# 9.5.1 Play-the-Winner Rule


    From an ethical standpoint, clinical trials should utilize the evidence accumulated
    from the data to assign more patients to the superior arm, so that more patients
    will benefit from the better treatment. Response or outcome-based adaptive randomization
    aims to achieve this goal by skewing the number of patients to a potentially better
    treatment group.


    The play-the-winner rule attempts to allocate more patients to the potentially
    better treatment: staying with the winner until a failure outcome occurs and then
    switching to the alternative treatment [10]. This rule is often applied to the
    dichotomous cases, where the outcome is either a success or failure. In a study
    comparing two treatments A and B, the procedure is displayed in Figure 9.2 Play-the-Winner
    Rule with Dichotomous Outcomes with Treatments A and B: the first patient is randomized
    to either treatment A or B with an equal probability. If the previous patient''s
    response is a success, the treatment for that patient retains for the next patient;
    while in the case of a failure, the next patient will receive the other treatment.
    Success is a solid circle and failure is an open circle.


    Figure 9.2 Play-the-Winner Rule with Dichotomous Outcomes with Treatments A and
    B


    ![](img/f4ec2665c3484c528370923aeb5cb99f_448_0.png)


    Such an alternating process continues until the total sample size is exhausted.
    The ratio of the numbers of subjects assigned to treatments A and B tends to $(1-pb)/(1-pa)$
    as the number of patients in the trial goes to infinity, where $p_A$ and $p_B$
    denote the response rates of treatments A and B, respectively.'
  merge: -1
  pgno: 448
- img_proc: true
  md: "# 9.5.2 Randomized Play-the-Winner Rule\n\nThe original play-the-winner rule\
    \ as discussed above lacks randomness because each treatment assignment is fully\
    \ determined by the outcome of the previous patient, regardless of the outcomes\
    \ of other patients in the trial. Such a deterministic rule would increase the\
    \ potential for selection bias. As a remedy, Wei and Durham introduced the randomized\
    \ version of the play-the-winner rule; that is, to switch to the other treatment\
    \ with a higher probability in the case of observing a failure outcome, instead\
    \ of a definitive switch [11]. As a well-known example, the Michigan extracorporeal\
    \ membrane oxygenator (ECMO) trial used such a scheme to allocate infants to conventional\
    \ therapy or the ECMO [12].\n\nThe randomized play-the-winner rule can be illustrated\
    \ with an urn model (Figure 9.3 Urn Model Under Randomized Play-the-Winner Rule).\
    \ Suppose that there are two types of balls, marked as A or B, in the urn. Starting\
    \ with $m$ balls of each type, a ball is randomly drawn with replacement to determine\
    \ the treatment for a new patient. If the ball of type A, the subject is assigned\
    \ to arm A, and if the response is a success, additional $\\alpha$ balls of type\
    \ A and $\beta$ balls of type B are added to the urn, with $\\alpha \\ge \beta\
    \ \\ge 0$. Therefore, the next ball to be drawn would have a higher probability\n\
    \n$Pr(\\text{Treatment A}) = \\frac{\\alpha+m}{\\alpha+\beta+2m} \\ge 0.5,$\n\n\
    to be a ball of type A, and the next patient would be more likely to be assigned\
    \ to arm A. On the other hand, if the response of the subject that is assigned\
    \ to arm A is a failure, additional $\beta$ balls of type A and $\\alpha$ balls\
    \ of type B are added to the urn, such that the next ball to be drawn would have\
    \ a lower probability of\n\n$Pr(\\text{Treatment A}) = \\frac{\\beta+m}{\\alpha+\\\
    beta+2m} \\le 0.5,$\n\nto be a ball of type A, and so is the probability of the\
    \ next patient assigned to arm A."
  merge: -1
  pgno: 449
- img_proc: true
  md: "![](img/f4ec2665c3484c528370923aeb5cb99f_450_0.png)\n\nExample Code 9.7 Randomized\
    \ Play-the-Winner Rule carries out the randomized play-the-winner rule to determine\
    \ the next treatment assignment. For example, suppose that 20 patients have been\
    \ assigned to treatment A and 13 assigned to treatment B. Among the treated patients,\
    \ 14 from treatment A and 5 from treatment B have a favorable response. We start\
    \ with an empty urn (i.e., $m=0$), and set $\\alpha=1$ and $\\beta=0$. The RPrandomize\
    \ macro can be utilized to determine the treatment group for the next patient.\n\
    \nExample Code 9.7 Randomized Play-the-Winner Rule\n\n```\n%macro RPrandomize(n1,y1,n2,y2,m,alpha,beta,seed);\n\
    proc in;\n  call rand(&seed);\n  /* # of balls of type A /\n  nball=m+y1*alpha*(n2-y2)*&alpha+y2*beta+(n1-y1)*&beta;\n\
    \  /* # of balls of type B /\n  nball=m+y2*alpha*(n1-y1)*&alpha+y1*beta+(n2-y1)*&beta;\n\
    \  /* Probability that next drawn ball is A */\n```"
