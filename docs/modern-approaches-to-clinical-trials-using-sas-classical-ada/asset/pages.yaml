  md: "# 10.7.1 Redesigning a Real Clinical Trial\n\nIn this section we give an example\
    \ of a published clinical trial where an optimal RAR design could be useful. Connor\
    \ and co-authors in [66] reported the results of a randomized, double-blind, placebo-controlled\
    \ trial of the efficacy and safety of zidovudine (AZT) in reducing the risk of\
    \ maternal-infant transmission of the human immunodeficiency virus (HIV) type\
    \ 1. In this trial, 477 pregnant women were enrolled and randomized equally between\
    \ AZT [$nc=239$] and placebo [$nc=238$]. In the study, 409 women gave birth to\
    \ 415 live-born infants. The estimated proportions of uninfected infants at 18\
    \ months was 0.917 for the AZT group and 0.745 for the placebo group; that, the\
    \ AZT treatment reduced the risk of maternal-infant HIV transmission by approximately\
    \ two thirds compared to placebo. An optimal RAR design would assign the AZT treatment\
    \ more often, thereby achieving a more ethical trial design.\n\nWe consider a\
    \ redesign of this trial by simulation. Four competing randomization procedures\
    \ will be compared:\n\n+   1. Completely Randomized Design (CRD): Every patient\
    \ is randomized between the treatment groups with a probability 1/2. (While such\
    \ design would not be used in practice, it is included here to enable a comparison\
    \ of variability with two RAR designs.)\n\n+   2. Permuted Block Design (PBD):\
    \ Randomization is applied in blocks of size 4 such that treatment numbers are\
    \ equalized after every four patients.\n\n+   3. RSIHR Design: The target allocation\
    \ $\rho=\\sqrt{\rho_{PE}}/(\\sqrt{\rho_{PE}}+\\sqrt{\rho_{PC}})$ is implemented\
    \ using ERADE (Section 10.3.4) with $\\varrho=0.5$.\n\n+   4. Compound Optimality\
    \ Design: The target allocation (obtained as the unique solution to equation (10.4)\
    \ with $\\omega=0.5$) is implemented by using the ERADE procedure (Section 10.3.4)\
    \ with $\\varrho=0.5$.\n\nThe true success probabilities are assumed to be $\r\
    ho_E=0.917$ (AZT) and"
  merge: -1
  pgno: 511
- img_proc: true
  md: '$p_C = 0.745 (placebo)$, implying $p_E - p_C = 0.172$. With these numbers,
    the target allocation proportion (unknown to the investigator at the outset) the
    AZT treatment is 0.525 for the RSIHR and 0.607 for the compound optimization.
    We use the total sample $n=477$ to match the real trial setup in [66]. In the
    simulation of RAR designs, the first four patients are assigned to the AZT or
    placebo using the PBD with block size 4; afterwards, the allocation is performed
    using the ERADE procedure with the corresponding target allocation. In our simulation,
    we assume that each patient''s outcome is observed before the next patient is
    enrolled in the study, and randomization probabilities are updated sequentially
    by RAR algorithms. In practice, the outcome data from some patients may not be
    available yet at the time of the current patient''s entry (i.e. responses are
    delayed), in which case one would just use the data accrued thus far to update
    parameter estimates and randomization probabilities. However, this scenario is
    not explored here.


    Table 10.5 (supplemental program ch10.7.1.sas) shows the simulated operating characteristics
    of the four designs. All four designs achieved their target allocation and are
    very similar in terms of quality estimation. The RSIHR design is more variable
    than CRD (empirical standard deviation of the allocation proportion for RSIHR,
    compound optimal, and CRD is 0.006, 0.033, and 0.023, respectively). On average,
    the RSIHR design assigns 12 more patients to the AZT treatment, and the compound
    optimal design assigns 53 more patients to the AZT treatment compared to the balanced
    randomization designs (CRD and PBD). Also, on average, the RSIHR design results
    in 2 fewer treatment failures, and the compound optimal design results in 8 fewer
    treatment failures than the balanced designs. Therefore, in this example, the
    ethical gains of the RSIHR design are rather modest, whereas the compound optimal
    design provides the best balance between individual and collective ethics.


