  md: '# 1.5.2 Multiplicity in Adaptive Designs


    Multiplicity arises frequently in multi-stage trials when conclusions be based
    on interim data. For confirmatory trials, it is important to strongly control
    the overall type I error rate over multiple hypotheses tested or the number of
    times a hypothesis is tested. While solutions to some of these problems appeared
    in the 80s and 90s [27,Ch 15 and 16], a simple way to consider this group sequential
    trials is to use a generalization of graphical methods for strong type I error
    control [57]. The graphical approach has also been extended to adaptive group
    sequential designs in Sugitani, Bretz, and Maurer [58].


    Multiplicity also arises when researchers attempt to identify a subpopulation
    that experiences a better response (or experiences less side effects) to a treatment.
    Subpopulations could be defined by disease state at baseline or by a proteomic
    or genetic biomarker. Chapter 11 offers an extensive literature review on population
    enrichment designs and discusses enrichment strategies from a frequentist, Bayesian
    or a frequentist-Bayesian hybrid perspective.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 1.5.3 Formation of the Adaptive Design Working Group


    The intense interest in adaptive designs during the first decade of the 21st century
    motivated the formation of an Adaptive Designs Working Group (ADWG) in the spring
    of 2005 [59]. This was a collaboration that included contributions from industry,
    academia and regulatory authorities. Other than the group sequential design, adaptive
    design was still a relatively new concept for many drug companies at that time.
    Operational support such as randomization and drug supply management to support
    adaptive trials was not available in many organizations. Furthermore, regulatory
    acceptance of the new adaptive designs was generally unknown. The objectives of
    the ADWG were to foster and facilitate wider usage and regulatory acceptance of
    properly designed and executed adaptive trials to support product development
    through a fact-based evaluation of the benefits and challenges associated with
    these designs [60]. The Group was initially sponsored by the Pharmaceutical Research
    and Manufacturers of America (PhRMA). In order to address the many aspects related
    to the design and implementation of adaptive trials, ADWG initiated many workstreams
    to kick off a broad range of activities. The activities included sponsoring workshops,
    giving short courses, and publishing research and consensus papers. A workstream
    reached out to regulators to discuss best design practice and share experience
    from implementing such designs [61]. A seminal white paper on best practice for
    adaptive trials was published by the Group in 2009 [62]. Workstreams that completed
    their objectives were sunset. New workstreams were initiated to tackle emerging
    issues.


    The sponsorship for ADWG was officially transitioned from PhRMA to the Drug Information
    Association (DIA) in 2010. The name of the group was changed to the Adaptive Design
    Scientific Working Group (ADSWG) with expanded membership.


    Because new investigators continue to join the clinical trial community, there
    is always a need for education and training. A long-running education and training
    activity of the Group is a monthly key opinion leader lecture series. The lecture
    series is free to all who are interested'
  merge: -1
  pgno: 37
- img_proc: true
  md: in adaptive designs. Early lectures focused on the theory underlying adaptive
    designs. Over time, the lectures expanded to practice and lessons learned from
    implementation. Some lectures focused on adaptive trials that were used to support
    regulatory submissions. A recurring theme is the importance of thorough upfront
    planning required of adaptive trials. The lecture series was still ongoing in
    October 2015 when this chapter went into printing.
  merge: -1
