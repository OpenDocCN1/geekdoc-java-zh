  md: "# 4.6.3 Power Calculation\n\nWe discuss how to calculate the type I error and\
    \ power discussed in [6]. Let $n_0$ and $a_0$ denote prespecified Bayesian credible\
    \ level and discounting parameter for the historical meta-experimental survival\
    \ data, respectively. We also let $\\{\\gamma_1^{(m)}\\}_{m=1, \\dots, NMCS}$\
    \ denote a Gibbs sample of $\\gamma_1$ from the posterior distribution $\\pi(\\\
    gamma_1 | D_K, D_0, a_0)$, where $NMCS$ is the Gibbs sample size. Using this Gibbs\
    \ sample, we obtain a Monte Carlo estimate of $P(\\hat{\\epsilon}^1 < \\delta\
    \ | \\pi^{(f)})$ given by\n\n```\n$$\\hat{P}_f = \\frac{1}{NMCS} \\sum_{m=1}^{NMCS}\
    \ I(\\\\epsilon_1^{(m)} < \\delta), (4.14)$\n```\n\nwhere $\\pi^{(f)}$ is the\
    \ fitting prior. To simultaneously compute the Bayesian type I error and power,\
    \ $\\hat{\beta}_{sl}^{(f)}$ in (4.9), we use the following computational algorithm:\n\
    \n+   1. Set $l=0$ and input $D, D_0, n_0, a_0, NMCS, nbi$, and $REP$.\n\n+  \
    \ 2. Generate $\\{(\\gamma, \\theta)-\\pi^{(s)}(\\gamma, \\theta)\\}$ for $s=0,1$.\n\
    \n+   3. Generate $D_K$ via the predictive data generation algorithm in Section\
    \ 4.6.1.\n\n+   4. Run the Gibbs sampler to generate a Gibbs sample $\\{\\gamma_1^{(m)}\\\
    }_{m=1, \\dots, NMCS}$ of size $NMCS$ from the posterior distribution $\\pi(\\\
    gamma, \\theta | D_K, D_0, a_0)$.\n\n+   5. Compute $\\hat{P}_f$ and repeat Steps\
    \ 2 through 5. $REP$ times.\n\n+   6. Compute the proportions of $\\{\\hat{P}_f\
    \ \\geq 0.90\\}$, $\\{\\hat{P}_f \\geq 0.95\\}$ and $\\{\\hat{P}_f \\geq 0.975\\\
    }$ (the default option) and the proportion of $\\{\\hat{P}_f \\geq n_0\\}$ (the\
    \ user's choice) in these $REP$ runs, which gives the estimates of $\\beta_{sl}^{(n)}$."
