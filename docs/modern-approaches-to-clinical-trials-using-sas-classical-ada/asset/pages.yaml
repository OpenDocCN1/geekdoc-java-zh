  md: "# ### 9.5.3 Optimal Adaptive Randomization\n\nAdaptive randomization can be\
    \ optimized by minimizing the variance or minimizing the number of nonresponders\
    \ in a trial [13-15]. As an illustration, let us consider a two-arm trial with\
    \ dichotomous responses. Let $p_1$ and $p_2$ be the response rates of treatments\
    \ 1 and 2, respectively. We are interested in testing $H_0: p_1=p_2$ versus $H_1:\
    \ p_1 \neq p_2$.\n\nNeyman’s allocation is obtained by minimizing the variance\
    \ of the test statistic, which results in the allocation ratio between arm 1 and\
    \ arm 2 as\n\n```\n$Neyman = \\frac{\\sqrt{p_1(1-p_1)}}{\\sqrt{p_2(1-p_2)}}$\n\
    ```\n\nFrom an ethical perspective, Rosenberg et al. [12] proposed an optimal\
    \ allocation scheme that minimizes the expected number of nonresponders while\
    \ fixing the variance of the test statistic, which leads to an optimal allocation\
    \ ratio of\n\n```\n$N_{opt} = \\frac{\\sqrt{p_1}}{\\sqrt{p_2}}$\n```\n\nFor continuous\
    \ outcomes, we assume normality for patients’ responses in arms 1 and 2, $Y_1\
    \ \\sim N(\\mu_1, \\sigma_1^2)$ and $Y_2 \\sim N(\\mu_2, \\sigma_2^2)$. We are\
    \ interested in testing $H_0: \\mu_1=\\mu_2$ versus $H_1: \\mu_1 \\neq \\mu_2$.\n\
    \nBy minimizing the variance of the estimated treatment difference, Neyman’s allocation\
    \ ratio is given by\n\n```\n$Neyman = \\frac{\\sigma_1}{\\sigma_2}$\n```\n\nIf\
    \ a smaller response is preferred, we may minimize the total expected response\
    \ $n_1\\mu_1 + n_2\\mu_2$, subject to fixing the variance as a constant. This\
    \ leads to an allocation ratio of"
  merge: -1
  pgno: 452
- img_proc: true
  md: "$r_{opt} = \\frac{\\sigma_1\\sqrt{\\mu_2}}{\\sigma_2\\sqrt{\\mu_1}}$\n\nThe\
    \ SAS macros % NeymanRandomize and % OptimalRandomize generate the next treatment\
    \ assignment based on the Neyman's and optimal randomization schemes. The example\
    \ is the same as the one used in the randomized play-the-win rule.\n\n# Example\
    \ Code 9.8 Neyman's and Optimal Randomization Schemes\n\n```\n%macro NeymanRandomize(nl,y1,n2,y2,seed);\n\
    proc iml;\n  call randseed(&seed);\n  /* Estimate of p1 */\n p1=y1/nl;\n  /* Estimate\
    \ of p2 */\n p2=y2/n2;\n  /* Neyman's allocation ratio *\n r1=sqrt(p1/(1-p1)/(1-p2));\n\
    \ pl1=r1/(1+r1);\n  /* Assign the next patient based on p */\n Assignment=rand(1);\n\
    \  call randgen(Assignment,\"BERNOULLI\",pl1);\n  if Assignment=1 then Assignment='A';\n\
    \  else Assignment='B';\n  print pl1[colname=\"Allocation probability to arm A\"\
    \ label=\"\"]\n  print Assignment[colname=\"Next assignment\" label=\"\"]\nquit;\n\
