  md: 'type I error under such a decision is controlled at a level less than α. If
    an observed p-value is large (p greater than α) and a No Go decision is made,
    then the probability of making a type II error is smaller than β.


    In phase III, the selection of β reflects the commitment of moving the candidate
    product forward (a smaller β implies a stronger commitment). It also represents
    the degree of investment that the sponsor is willing to spend. However, in phase
    II, the choice of β may need to be balanced with a choice of α. In most situations,
    β is set at a higher level than α. For example, a typical α may be 0.05, while
    a β is set at 0.2 (indicating 80% power). This does not necessarily have to be
    the case in phase II designs. In practice, phase II studies are designed with
    an α of 0.025, 0.05, 0.1, or sometimes a one-sided value of 0.15. A β of greater
    than 0.2 is rare. But β values of 0.15, 0.1 or 0.05 are not uncommon. The project
    team must discuss and agree with the level of risk that the team is willing to
    take — give up a good product, or to develop a placebo. It is very important to
    note that these discussions should take place at the study design stage after
    seeing the study results, the coin has landed, and it would be too late to discuss
    probabilities or risks.


    # 6.2.7.4 Sample Size Calculation


    Once the statistical hypothesis, and the corresponding α and β have been determined,
    sample size for a given dose ranging trial can be calculated. Based on the above
    discussion, the sample size of a dose-ranging study can be calculated using the
    formula below [21]:


    ```

    n = \left(\frac{(z_{1-\alpha}+z_{1-\beta})\sigma}{\delta}\right)^2 \sum_{i=1}^k
    \frac{2}{f_i}

    ```


    where


    +   1. $n$ is the total sample size of all treatment groups combined


    +   2. $z_{1-\alpha}$ and $z_{1-\beta}$ are the critical values of the standard
    normal distribution corresponding to type I and type II error, respectively'
  merge: -1
  pgno: 311
- img_proc: true
  md: '+   3. $\delta$ is the weighted sum of the effect based on all doses


    +   4. $\sigma$ is the standard deviation


    +   5. $f_i$ is the fraction of number of patients in treatment group


    +   6. $c_j$ is the contrast coefficient that is associated with treatment group


    +   7. $k$ is the number of dose groups, plus placebo, where placebo is denoted
    as the 0 dose group.


    In the calculation of sample sizes for a dose-ranging study, two popular types
    of patient allocation are possible – balanced allocation where each treatment
    group receives an equal number of patients, or imbalanced allocation where the
    highest dose and the placebo groups receive more patients, and other dose groups
    receive fewer patients per group. The sample size formula above works well with
    either type of patient allocation. Examples of these types of allocation can be
    found in [20]. The above formula applies to cases where the primary endpoint is
    a continuous variable. In fact, a sample size formula based on other of response
    variables such as binary or time-to-event, can also be found in [21].


    In order to demonstrate how an early II dose-ranging trial is designed, a real-world
    example is discussed in the next section. This example reflects three key features
    of the thinking process: (1) dose-range; (2) number of treatment groups; and (3)
    sample size. Note that in the real-world setting, other considerations are also
    important – selection of primary endpoints, choice of clinically meaningful differences
    ($\delta$), determination of type I and II error rates, as well as statistical
    hypothesis to be tested. However, all of these considerations are part of Step
    3 – sample size calculation. Therefore, in dose-ranging study designs, the dose-range
    and number of treatment groups are determined, the other design considerations
    are very similar to those for designing an ordinary clinical trial.'
