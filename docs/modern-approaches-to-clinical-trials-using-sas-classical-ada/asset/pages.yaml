  md: '# 3.3 Unblinded SSR Methods'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# ### 3.3.1 Overview


    Unlike blinded section, the unblinded SSR procedures utilize both the nuisance
    parameter and explicit treatment effect estimates in order to calculate the new
    sample size for the remainder of the trial. The methods vary in how they perform
    such adaptation but they all share a common feature: the methodology is focused
    on rigorously controlling the type I error. Type I error is very important to
    regulators in confirmatory trials (the majority of unblinded SSR trials are performed
    in confirmatory setting). Type I error inflation can potentially arise from multiple
    looks at the data (interim and final analyses) and data-driven sample size changes.


    There are two major issues concerning unblinded SSR: 1) controlling the type I
    error rate mentioned earlier and 2) operational issues arising from interim unblinding
    (the potential to compromise the integrity of the trial). The first issue is statistical
    in nature and can be addressed by implementing an appropriate methodology assuring
    type I control. The second concern is operational, which is much harder to address
    because it is largely based on perception. While one can implement certain procedures
    to minimize the chances of accidental unblinding and loss of study integrity,
    the concerns can never be eliminated completely. Operational issues can very easily
    become an extensive discussion on their own; for that reason we will not discuss
    here and refer the reader to [17-18] for discussion of best practices for adaptive
    designs (unblinded SSR included).


    Blinded SSR methods do not cause concerns about unblinding and their impact on
    type I error is minimal, so they don''t suffer from the key issues of unblinded
    SSR as much. For that reason, they were classified as "well-understood" by the
    FDA guidance [1]. It is important to understand the circumstances under which
    the "less-well understood" procedure of unblinded SSR became preferred over the
    "well-understood" blinded SSR procedure.


    The first reason to consider for unblinded SSR is that blinded methods may confound
    increased variability with increased treatment effect. An increase in the actual
    (but unobserved) treatment difference at the time'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'of the (blinded) interim analysis leads to an increase in estimated variance.
    As a result, sample size may be potentially increased (compared to the original
    planned size). Conversely, in an unrestricted blinded SSR, a decrease in the actual
    treatment difference leads to reduced variance estimate, and a potential decrease
    in the sample size compared to the original planned size. These changes are the
    opposite to those that are actually needed. This can happen because blinded estimate
    of variance essentially ignores the between-treatment difference in its calculation.
    They are efficient only when there is a reason to believe that actual treatment
    difference is not too far from what was assumed at the design stage. In situations
    where there is great uncertainty about the underlying treatment effect, the unblinded
    SSR procedure may be well worth the effort to implement.


    A second reason to consider an unblinded SSR procedure is that a sample size modification
    may not be the only objective of an interim analysis. In other words, other types
    of adaptation may be of interest. In more trials routinely implement early stopping
    for efficacy or futility (e.g. classical GSD), both of which would require unblinding.
    If unblinding is already considered in the study plan, then using an unblinded
    SSR is a lot more precise than a blind SSR. In fact, many unblinded SSR methodologies
    evolved as an adaptation to increase sample size on top of GSD-like boundaries
    for early stopping, i.e., as a way to expand the list of adaptation options available
    at the time of interim analysis. In general, it is very hard to get an overall
    recommendation on when to use one adaptation versus another. Each trial should
    be evaluated on a case-by-case basis, preferably by simulation that includes a
    good variety of reasonable treatment effect/variance scenarios. Based on the resulting
    operating characteristics and the likelihood of underlying assumptions, a final
    choice between blinded vs unblinded SSR procedures should be made.


    For the remainder of this section, we focus on the statistical issues e.g. controlling
    type I error rate resulting from multiple looks at the data) surrounding unblinded
    SSR. There are three main statistical issues to address (and pre-specify) when
    considering a method for unblinded SSR:


    +   1. How to determine the new sample size?'
  merge: -1
  pgno: 150
- img_proc: true
  md: '+   2. How to set the final decision rule to accept/reject the null hypothesis
    so that type I error is preserved?


    +   3. How to estimate the treatment effect in the final analysis?


    Among these three issues, type I error control is probably the most researched
    topic in the statistical literature. The issue of determining the new sample is
    closely related to controlling type I error (just like power and type I error
    are related when planning a fixed-size trial) but it has some "degree-of-freedom."
    Most type I error control methodologies focus on defining an end-of-study rule
    for accepting or rejecting the null hypothesis following the unbiased SSR, but
    they leave some freedom as to how the new sample size is actually selected. This
    is understandable since sample size decisions are often influenced by non-statistical
    considerations such as budget, regulatory, and market requirements. Because of
    the close relationship between issues #1 and #2 for some methods, we will discuss
    SSR methods in conjunction with type I error control, on a method-by-method basis.


    Concerns over the final study analysis (estimation and confidence intervals) are
    not discussed here because the related literature is generally less mature and
    is still an active area of research for some methods. Nonetheless, estimation
    deserves attention because computing classic-point estimates and associated confidence
    intervals (CIs) following a trial with unbiased SSR may lead to biased results.
    Even if the final study inference is well defined and preserves the type I error
    rate, the methodology to compute point estimates and associated confidence intervals
    still needs to be addressed. At a minimum, simulations should be performed to
    quantify the magnitude of bias (often very small). For some methods, the theoretical
    framework addressing estimation at the end of trial is available [19-20].'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# 3.3.2 Classification of Methods Used to Control Type I Error Rate


    Historically, most of the original methods were developed and published as a standalone
    work referencing only closely related methodology. As the number of adaptive designs
    with SSR grew, so did the confusion about them and the need for a systematic review
    emerged. Perhaps one of the most comprehensive approaches to provide a unified
    view of type I error control in adaptive designs is the work by Posch, Bauer and
    Brannath [21]. They argue that most of the type I control methods in adaptive
    trials that involve SSR can be viewed as some form of combination test, making
    it the cornerstone of the methodology. This is the approach that we will follow.
    A less philosophical and more pragmatic view is to break all methods into two
    categories: either performing a non-standard analysis by modifying test statistic/rejection
    region or performing a standard analysis, but restricting conditions under which
    this analysis can be done. Some examples are given bellow; the list is by no means
    exhaustive:


    +   1. Perform a non-standard analysis at the end of the trial:


    +   a. Adjust the test statistic ([22]) down-weighs the 2nd stage data in case
    of a sample size increase


    +   b. Adjust critical region [23]


    +   c. Preserve conditional error function [24]


    +   d. Combine p-values for the 2 stages (before and after the SSR) and re-define
    the critical region for the combined value [25]


    +   e. Dual test (elaborates on the p-value combination test addressing some of
    its potential pitfalls) [26]


    +   2. Perform a standard analysis at the end but state conditions which sample
    size can be increased [3, 27, 28].'
  merge: -1
