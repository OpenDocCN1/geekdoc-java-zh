  md: '# ### 1.5.1 Early Phase Oncology Designs


    For many oncology development programs, the first clinical trials in humans are
    in cancer patients with a primary objective to estimate the maximum tolerated
    dose (MTD). A review paper by Le Tourneau et al. provides an overview of dose
    escalation methods for phase I oncology trials [54]. A 3+3 design has traditionally
    been used and continues to be used to estimate the MTD by many sponsors. A 3+3
    design tests 3 patients at a dose initially. If none of the 3 patients have what
    is referred to as a dose limiting toxicity (DLT), the next dose will be studied.
    If 2 or out of 3 patients have a DLT, the dose is considered toxic and will be
    excluded from further consideration. If 1 out of the 3 patients at a dose has
    a DLT, 3 patients will be enrolled in the same dose. If no more patients among
    the cohort have the DLT, the dose is considered tolerable and the study can escalate
    to the next dose. Otherwise, the dose is considered intolerable and will be excluded.
    If an intolerable dose is identified, if the dose it has only been studied in
    3 patients, another 3 will be given the same dose. If more than 1 patient has
    a DLT, then the dose is considered toxic and excluded. The maximum tolerated dose
    is the highest dose studied that was not discontinued by the algorithm above.
    Once an MTD is determined, some employing the 3+3 design will enroll additional
    patients (e.g. 12 or 24) at the MTD to investigate early signs of efficacy. Dose-escalation
    under the 3+3 design algorithm, while safe, often escalates through doses slowly
    and be ineffective in finding an MTD.


    One popular approach that has been proposed to improve upon the algorithm-based
    3+3 design is the continual reassessment method (CRM) [55]. This approach is covered
    in Chapter 5 with further developments and SAS programs to support implementation.
    CRM is a Bayesian dose-finding method that adapts the up-and-down dose selection
    during a trial based on a modeled dose-toxicity profile interval alternative to
    the 3+3 design is the modified toxicity interval proposed by Ji at al. [56]. The
    latter makes dose adjustments based on a table that can be generated at the beginning
    of the study to a specified target DLT rate. The dose adjustment decisions have
    been implemented in Excel by Ji and coauthors.'
  merge: -1
  pgno: 34
