  md: '# ## 11.4.2 Frequentist Methods


    # ### 11.4.2.1 Adaptive Signature Design


    The classical designs discussed earlier involve only one biomarker and it is assumed
    that this biomarker positive set can be determined priori. The adaptive signature
    design [29] is a design proposed to select the subgroup using a large number of
    potential biomarkers. This design is appropriate when both the potential biomarkers
    and the cut off are unknown; however, there is some evidence that the targeted
    therapy may work in some of the shortlisted biomarkers. The method was proposed
    initially using a combination of genetic markers and, hence, is also called the
    adaptive “gene” signature design. Recent developments in Genomic technologies
    (especially Pharmacogenetics) have the potential of identifying subgroups of patients
    who are likely to benefit from a certain targeted therapy. The design and implementation
    of studies with a large number of gene signatures are challenging. There are three
    elements: (a) trial powered to detect the overall treatment effect at the end
    of the trial; (b) identification of the subgroup of patients who are likely to
    benefit from the targeted therapy at the first stage of the trial; (c) statistical
    hypothesis test to test the treatment difference based on the subgroup of patients
    who are randomized in the lower half of the trial. These elements are pre-specified
    prospectively. Appropriate tests are conducted for multiplicity in order to control
    for type error rate. The initial null hypothesis to test the benefit of the targeted
    therapy against the control is conducted in the overall population. This is conducted
    at a slightly lower significance level than the alpha of 0.05 (example: 0.04 or
    0.03). If the initial hypothesis is rejected at the lower significance level,
    then the targeted therapy is declared superior than the control treatment for
    the overall population. The hypothesis testing and analysis is complete at this
    stage. If the first hypothesis is not rejected, then the signature component of
    the design is used to select a potentially promising biomarker subgroup.


    It is done by the following steps: The study population is split into a training
    or developmental sub-sample and a validation sub-sample of'
  merge: -1
  pgno: 558
- img_proc: true
  md: 'patients. The training sub-sample is used to develop a model to predict the
    treatment difference between targeted therapy and control as a function of baseline
    covariates. This model is also called the benefit function, which is used to validate
    the results from the validation-sample. The benefit function used with this design
    is the minimum odds ratio [29] for the treatment marker interaction with a pre-specified
    number of biomarkers and the significance level. The risk difference is another
    benefit function that has been used which is the difference between the targeted
    therapy and the control in the probability of response as a function of baseline
    variables [20, 30-31]. The prediction is done for each subject in this sample
    and a predicted score is calculated to classify the subject as sensitive or non-sensitive.
    The subgroup is selected using a pre-specified cut-off for this predicted score.
    The second hypothesis test is conducted in this subgroup to see the benefit of
    the targeted therapy against the control. This test is conducted at a much lower
    significance (example: 0.01 or 0.02).


    Generally, as the proportion of the sensitive patients increases, so does the
    difference in the objective response rates of the experimental arm and the control
    arm. Therefore, for prevalence above a certain threshold, the power of the overall
    effect test will dominate the power of the sensitive subset. The adaptive signature
    design preserves the ability to detect the overall effect in this case. However,
    its advantage over the traditional design (testing for overall effect with broad
    eligibility) is reduced. The formulas that can assist the investigators in assessing
    the power relation between the sensitive subset and the overall test are presented
    in [25].


    The *power* macro is developed for calculating power based on formula (1.1) in
    [25]. When calculating the power of the overall test, the following parameters
