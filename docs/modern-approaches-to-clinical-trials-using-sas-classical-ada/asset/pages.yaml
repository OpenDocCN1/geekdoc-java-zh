  md: '# 4.8 Summary


    In this chapter, we presented a general Bayesian methodology and a detailed development
    of a SAS macro, BMED, for meta-experimental design for survival data. Throughout
    this chapter, we only consider the exponential regression model, which is a potential
    limitation of the SAS macro BMED. However, the exponential model is attractive
    in the sense that the individual patient-level survival data is not required.
    Another major motivation for using the exponential model in this chapter is that
    the historical data itself were often only available in aggregate form. Thus,
    the exponential model was most natural in this setting, even if we had individual
    patient-level data for the the trials themselves.


    We note that the assumed meta-regression survival model in the SAS macro BMED
    is a log-linear fixed-effects model. There are several advantages of the fixed
    effects model over the random effects model. First, the fixed effects model is
    easier and more convenient to implement in PROC MIXED. Second, the fixed effects
    model does not require the specification of the design values for the variability
    of the random effects, which is a major task from a design perspective. Third,
    the fixed effects model is more flexible to accommodate different annualized event
    rates of historical meta-survival data across previous trials. In addition, as
    shown in [11, 12], the fixed effects model and the random effects model essentially
    yield a similar sample size. If individual patient-level meta-survival data are
    available, then the Bayesian methodology discussed in this chapter can be easily
    extended to other survival regression models discussed in [17].


    As future project, we will extend the SAS macro BMED to allow different survival
    models, such as the Weibull regression model and other survival models discussed
    in [17] for the setting of the meta-design with individual patient level data.


    # Acknowledgements


    The research of JGI and MHC was partially supported by NIH grants #GM 70335 and
    #P01 CA42538.'
