  md: '# 8.4 Analysis Example for a Binary Endpoint


    Planning for a phase IIb study in the indication of systemic lupus erythematosus
    (SLE) has begun. This study will use the systemic lupus erythematosus responder
    index (SRI) as the primary endpoint. The SRI is a composite binary endpoint. In
    order to be considered a responder, a subject must show a 4-reduction on the primary
    symptom score (SLEDAI-2K), no worsening symptoms based on a physician''s assessment,
    and no new organ domain scores in the two highest categories of a secondary symptom
    score (BILAG). All three criteria must be met in order to be considered a responder.
    It has been decided that three active dose groups and one placebo group will be
    included in this study, with 60 subjects in each dosing group. Initial sample
    size estimates a placebo response of 0.4, a treatment response of 0.65 at $\alpha=0.05$
    and 80% power using a two-sample test of proportions. The dose response of the
    new compound will be evaluated after 24 weeks of dosing to estimate the optimal
    dose to carry into phase III testing, assuming the study is successful. A Bayesian
    model has been proposed for this analysis.


    The last drug approved in SLE was belimumab, which used the binary endpoint of
    SRI for registration. Across two phase III studies, placebo subjects were responders
    of 562 subjects tested or a response rate of 0.388. Assuming placebo subjects
    in the new trial will respond at the same rate as seen in these phase III trials,
    this estimate of 0.388 can be used for the prior distribution of $E_0$. Thus,
    logit(0.388) will be used as the estimate of central tendency for an informative
    normal prior on the $E_0$ parameter. The proposed study for a new compound is
    smaller than these studies and assumed to be more variable. Also, only two studies
    were used to inform the expected placebo response, so a weak informative prior
    will be used. In order to make the prior fairly diffuse, a variance of 4 is employed.


