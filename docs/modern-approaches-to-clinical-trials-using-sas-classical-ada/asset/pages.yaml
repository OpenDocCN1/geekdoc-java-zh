  md: "# 10.3.3 Doubly Adaptive Biased Coin Design\n\nThe Doubly Adaptive Biased Coin\
    \ Design (DBCD) is a class of RAR procedures that can target any allocation proportion\
    \ $\rho$ provided that some mild regularity conditions are met [47,48]. The key\
    \ ingredient of DBCD is the allocation function $g(x, \rho)$, defined on $[0,1]\
    \ \times [0,1]$. Hu and Zhang [48] proposed the following allocation function:\n\
    \n```\n$g(x, \\rho) = \\begin{cases} \\frac{\\rho^\\gamma}{x^\\gamma} & 0 < x\
    \ < 1, \\ \\frac{(1-\\\rho)^\\gamma}{(1-x)^\\gamma} \\cdot (1-x), & x=0,1. \\\
    end{cases} \\quad (10.8)$\n```\n\nThe user-defined parameter $\\gamma \\geq 0$\
    \ controls the degree of randomness ( $\\gamma=0$ is most random and $\\gamma\
    \ \\to \\infty$ is almost a deterministic procedure). The role of $\\gamma$ will\
    \ become clear momentarily.\n\nSuppose the target allocation has been chosen as\
    \ $\\rho = \\rho(\\rho_E, \\rho_C)$. After $m$ patients, the target allocation\
    \ is estimated as $\\hat{\\rho}}_m = \\rho(\\hat{\\rho}_{Em}, \\hat{\\rho}_{Cm})$.\
    \ The DBCD assigns the $\\langle m+1 \\rangle$ patient to $E$ with probability\n\
    \n```\n$\\phi_{m+1} E = g\\left(\\frac{NE(m)}{m}, \\hat{\\rho}_m\\right)$\n```\n\
    \nwhere $g(x, \\rho)$ is as in (10.8). If $\\gamma=0$, the DBCD is equivalent\
    \ to $\\phi_{m+1} E = \\hat{\rho}$, the SME model.\n\nHu and Zhang in [48] proved\
    \ that under the condition $\\rho = \\rho(\\rho_E, \\rho_C)$ is continuous in\
    \ its arguments and is continuously differentiable in its small neighborhood of\
    \ the true value of $(\\rho_E, \\rho_C)$, both the sample treatment proportions\
    \ and the estimators are strongly consistent and asymptotically normal. In particular,\
    \ $NE(m)/m$ has an asymptotically normal distribution with mean $\\rho$ and asymptotic\
    \ variance\n\n```\n$\\sigma_{\\gamma}^2 = \\frac{\\rho(1-\\rho)}{1+2\\gamma} +\
    \ \\frac{2(1+\\gamma)}{1+2\\gamma} \\left( \\frac{\\partial\\rho}{\\partial\\\
    rho_E})^2 \\frac{\\rho E_E}{\\rho} +(\\frac{\\partial\\rho}{\\partial\\rho_C})^2\
    \ \\frac{(1-\\rho) E_C}{1-\\rho} \\right)$\n```"
  merge: -1
  pgno: 486
- img_proc: true
  md: "A small value of $\\sigma_{\\gamma}^2$ is desirable from the standpoint of\
    \ statistical power. Clearly, $\\sigma_{\\gamma}^2$ is decreasing in $\\gamma$.\
    \ When $\\gamma=0$, $\\sigma_{\\gamma}^2$ is largest. When $\\gamma\\to\\infty$,\
    \ $\\sigma_{\\gamma}^2$ is smallest, but the procedure is almost deterministic.\
    \ Rosenberger and Hu in [35] recommended using $\\gamma=2$ as a tradeoff between\
    \ power and randomness.\n\nLet us describe the DBCD procedure with $\\gamma=2$\
    \ targeting the RSIHR allocation (10.2). After $m$ patients, the target is estimated\
    \ as $\\hat{\rho}_m=\\sqrt{\\hat{\rho}_{Em}}/(\\sqrt{\\hat{\rho}_{Em}}+\\sqrt{\\\
    hat{\rho}_{Cm}})$. Then the $\\langle m+1\\rangle$st patient is randomized to\
    \ $E$ with probability\n\n```\n$$\\phi_{m+1}E=\\frac{\\hat{\rho}_m{\\{\\left\\\
    frac{\\hat{\rho}_m}{N_E(m)/m}\\right\\}^2}{\\hat{\rho}_m{\\{\\left\\frac{\\hat{\r\
    ho}_m}{N_E(m)/m}\\right\\}^2+(1-\\hat{\rho}_m)\\{\\left\\frac{1-\\hat{\rho}_m}{N_C(m)/m}\\\
    right\\}^2}}$\n```"
