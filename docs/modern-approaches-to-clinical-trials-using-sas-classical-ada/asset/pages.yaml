    ```

    * Analysis of 1.3 criterion at end of Stage 1 (20% info)

    and interim analyses at 50% and 75% for Stage 2 /

    * proc seqdesign errspend nstages stoppopp boundaryscale=mle plots=all;

    stagepower: design nstages=3 method=errfuncpow(rho=3) alt-twosided

    alpha=0.05=cum(0.2 0.75 1)

    samplesize=twamplesurv(nullhazard=1.3 1.0 hazard=1.0);

