  md: '# 1.2 Evolution of Clinical Trials and the Emergence of Guidance Documents


    It took the pharmaceutical industry many years to reach the relatively mature
    state of drug development today. In 1962, the US Congress passed the Kefauver-Harris
    (KH) Amendment to the Federal Food, Drug, and Cosmetic Act of 1938 [11]. The amendment
    required drug manufacturers to prove the effectiveness and safety of their drugs
    in adequate and well-controlled investigations before receiving marketing approvals.
    Prior to the amendment, a manufacturer did not have to prove the effectiveness
    of a drug before marketing it.


    It is not hard to imagine what drug manufacturers had to go through to comply
    with the KH Amendment initially. Thanks to the large vaccine trials in the 50s
    and 60s, the medical community was generally aware of the importance to randomize
    trial subjects in order to assess the effect of a new treatment against a comparator
    when the Amendment took effect. Still, the early randomized and controlled trials
    conducted by manufacturers were relatively simple and took place in a single center
    or a few centers. It was unusual for investigators to analyze data collected at
    their sites at that time. This practice began to change as drug companies began
    to employ statisticians in the mid 60s. Industry statisticians were initially
    hired to develop randomization codes and analyze data. It took several years for
    statisticians to get involved in designing drug trials. All early industry-sponsored
    trials used fixed designs, meaning that once a trial was started, the trial would
    continue until the planned number of patients was enrolled. While a trial could
    be stopped for safety reasons, there was no chance to stop the trial early for
    efficacy, for utility, or to make modifications to the trial based on unblinded
    interim results. The concept of a pre-specified statistical analysis plan, signed
    off prior to database lock, did not exist.


    While drug companies took steps to develop infrastructure for adequate and well-controlled
    trials, the National Institutes of Health (NIH) in the US led the way in increasing
    the standards for the design and conduct of clinical trials. In the 60s and 70s,
    the National Heart Institute within the NIH launched several ambitious projects
    to understand and manage an individual''s risk for cardiovascular events. Randomized
    trials launched for this goal were typically large and required enrollment at
    multiple sites'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'for the trials to complete within a reasonable time period. This practical
    need began the era of multi-center trials. Besides recruiting at a faster pace,
    multi-center trials allowed trial findings to generalize more broadly to the target
    population because trial results came from many investigators.


    Even though the NIH provided oversight to these early multi-center cardiovascular
    trials sponsored by the Institute, statistical leadership at the NIH realized
    the need for a more organized way to monitor such trials and to potentially terminate
    the trials early for non-safety-related reasons. For example, it would be unethical
    to continue a trial if interim data clearly demonstrated one treatment was much
    better than the other. The same statistical leaders also recognized that by looking
    trial data regularly and allowing the trial to stop early to declare efficacy,
    one could inflate the overall type I error rate. The above thinking led to the
    formation of a committee to formally review, at regular intervals, accumulating
    data on safety, efficacy, and trial conduct. The proposed committee is the forethought
    of the data monitoring committee (DMC) as it is known today [12]. The experiences
    led to the Greenberg Report in 1967, which was subsequently published in 1988
    [13]. The Greenberg Report discusses the organization, review, and administration
    of cooperative studies. Another document of historical importance is the report
    from the Coron Drug Project Research Group on the practical aspects of decision
    making in clinical trials [14]. The need to control the overall type I error rate
    due to multiple testing of the same hypothesis motivated statistical researchers
    at the NIH and elsewhere to initiate research on methods to control the type I
    error rate in the presence of interim efficacy analyses.


    Pharmaceutical companies began testing cardiovascular drugs and cancer regimens
    in the late 70s. Following the NIH model, drug recruited patients from multiple
    centers. It did not take long for multi-center trials to become the standard for
    clinical trials to evaluate drugs in other therapeutic areas also. Furthermore,
    it was a common practice by the 90s to have a DMC for an industry-sponsored trial
    with mortality or serious morbidity as the primary endpoint.


    Many regulatory guidance documents were issued in the 80s and 90s. For example,
    the Committee for Proprietary Medicinal Products (CPMP) in Europe issued a guidance
    entitled “Biostatistics Methodology in'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Clinical Trials in Applications for Marketing Authorisations for Medicinal
    Products" (December, 1994). The Japanese Ministry of Health and Welfare issued
    "Guidelines on the Statistical Analysis of Clinical Studies" (March, 1992). The
    US FDA issued a guidance entitled "Guideline for the Format and Content of the
    Clinical and Statistical Sections of a New Drug Application" (July, 1988). To
    harmonize the technical requirements for registration of pharmaceuticals for human
    use worldwide, regulators and representatives from the pharmaceutical industry
    in Europe, Japan, and the US jointly developed common scientific and technical
    aspects of drug registration at the beginning of the 90s. The collaboration led
    to the formation of the International Conference on (ICH) and the publication
    of many guidance documents on quality, safety, and efficacy pertaining to drug
    registration. ICH issued a guidance document on statistical principles for clinical
    trials (ICH E9) for adoption in all ICH regions in 1998 [15]. ICH E9 drew from
    the respective guidance documents in the regions mentioned above.


    At the time that ICH E9 was issued, group sequential design was the most commonly
    applied design that included an interim analysis. ICH E9 acknowledges that changes
    in inclusion and exclusion criteria may result from medical knowledge external
    of the trial or interim analyses of the ongoing trial. However, E9 states that
    changes should be made without breaking the blind and should always be described
    by a protocol amendment that covers any statistical consequences arising from
    the changes. E9 also acknowledges the potential need to check the assumptions
    underlying the original sample size calculation and adjust the sample size if
    necessary. However, the discussion on sample size adjustment in E9 pertains to
    blinded sample size adjustment that does not require unblinding treatment information
    for individual patients.


    In 2007, the Committee for Medicinal Products for Human Use (CHMP, previously
    the CPMP) of the European Medicines Agency published a reflection paper on adaptive
    designs for confirmatory trials [16]. In 2010, the US FDA issued its own draft
    guidance on adaptive designs [17]. Both giành caution about operational bias and
    adaptation-induced type I error inflation for confirmatory trials. The US draft
    guidance places adaptive designs into two categories: generally "well-understood"
    and "less well-understood" designs. "Less well-understood" adaptive designs include
    dose-selection, sample size re-estimation'
  merge: -1
  pgno: 26
- img_proc: true
  md: based on observed treatment effect, population or endpoint adaptation based
    on observed treatment effect, adaptation of multiple design features in one study,
    among others. It has been more than five years since the publication of the draft
    guidance and much knowledge has been gained on designs originally classified as
    “less well-understood.” As experience accumulates, we expect some of the “less
    well-understood” designs will become “well-understood”.
