    # Example 4: Non-Insulin Therapy for Type 2 Diabetes Mellitus


    In this example, we present some event and sample size calculations for fixed-sample,
    non-inferiority trials for time-to-event endpoints. This example is motivated
    by the recent US Food and Drug Administration (FDA) guidance on assessing cardiovascular
    (CV) risk for therapies'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'used to treat type 2 diabetes mellitus (T2DM) [17]. For non-insulin T2DM therapies,
    the risk of major adverse cardiovascular events (MACE), which includes CV death,
    non-fatal myocardial infarction, and non-fatal stroke events, can be assessed
    in two Stages, as suggested in the guidance document. Here we capitalize “Stage”
    to distinguish the usage in the T2DM example from the interim analyses or “stages”
    that are used elsewhere in the chapter. The first Stage is a pre-market evaluation
    of the novel compound to placebo testing the following Stage 1 hypotheses using
    all accumulated pre-market trial data:


    ```

    $H_{10}: \frac{\lambda_T}{\lambda_C} \geq 1.8 \text{ versus } H_{11}: \frac{\lambda_T}{\lambda_C}
    < 1.8 \text{ (2.2)}$

    ```


    where $\lambda_T$ and $\lambda_C$ are the hazard rates of MACE for the novel treatment
    and control arms, Assuming the new drug application (NDA) is otherwise acceptable,
    if the CV criterion is met, the sponsor obtains full marketing approval for the
    new drug. In the second Stage, the sponsor must evaluate the post-marketing criteria
    Stage 2 hypotheses combining new post-market trial data and pre-market trial data:


    ```

    $H_{20}: \frac{\lambda_T}{\lambda_C} \geq 1.3 \text{ versus } H_{21}: \frac{\lambda_T}{\lambda_C}
    < 1.3 \text{ (2.3)}$

    ```


    This approach strikes a balance between providing evidence on cardiovascular safety
    to reassure patients and excessive delay of novel therapies reaching the marketplace.
    Each Stage is tested at $\alpha = 0.05$


