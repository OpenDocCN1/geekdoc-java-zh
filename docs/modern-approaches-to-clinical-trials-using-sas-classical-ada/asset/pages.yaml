- img_proc: true
  md: '# Purpose


    Modern Approaches to Clinical Trials Using SAS®: Classical, Adaptive, and Bayesian
    Methods is unique and multifaceted, covering several domains of modern clinical
    trial design, including classical, group sequential, adaptive, and Bayesian methods
    that are applicable to and widely used in various phases of pharmaceutical development.
    Topics covered include, but are not limited to, dose-response and dose-escalation
    designs; sequential methods to stop trials early for overwhelming efficacy, safety,
    or utility; Bayesian designs that incorporate historical data; adaptive sample
    size re-estimation; adaptive randomization to allocate subjects to more effective
    treatments; and trials from diverse therapeutic areas, including dermatology,
    endocrinology, infectious disease, neurology, oncology, and rheumatology. Individual
    chapters are authored by renowned contributors, experts, and key opinion leaders
    from the pharmaceutical/medical device industry or academia.


    Numerous real-world examples and sample SAS code enable users to readily apply
    novel clinical trial design and analysis methodologies in practice.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Is This Book for You?


    This book is intended for biostatisticians, pharmacometricians, clinical developers,
    and statistical programmers involved in the design, analysis, and interpretation
    of clinical trials. Further, students in graduate and post-graduate programs in
    statistics or biostatistics will benefit from the many practical illustrations
    of statistical concepts.'
