    Adopting similar notations as normal and binomial endpoints, we design a sequential
    trial that uses a time-to-event endpoint and monitor it up to J interim stages.
    We denote the monitoring calendar times as $c_1, c_2, \dots c_j$. At calendar
    time $c_j$, we observe $f_j$ failures or events of interest, with their corresponding
    event times (on patients'') follow-up time-scale, not calendar time-scale) denoted
    by $e_1(c_j), e_2(c_j), \dots, e_j(c_j)$.


    We further let $d_{\mathcal{T}}(e_i(c_j))$ be the number of events on treatment
    $\mathcal{T}$ and $n_{\mathcal{T}}(e_i(c_j))$ be the number of subjects at risk
    for the treatment arm $\mathcal{T}$ where $i=1, 2, \dots, f_j$. As for the control
    arm, $d_{\mathcal{C}}(e_i(c_j))$ and $n_{\mathcal{C}}(e_i(c_j))$ are defined similarly.
    We also let $d(e_i(c_j)) = d_{\mathcal{T}}(e_i(c_j)) + d_{\mathcal{C}}(e_i(c_j))$
    be the total number of events observed in both arms, and $n(e_i(c_j)) = n_{\mathcal{T}}(e_i(c_j))
    + n_{\mathcal{C}}(e_i(c_j))$ be the total number of subjects at risk for failure
    in both arms, at at calendar time $c_j$.


