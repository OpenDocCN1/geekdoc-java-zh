  md: '# Prerequisites


    Based on the above audience, users will benefit most from this book with some
    graduate training in statistics or biostatistics, and some experience or exposure
    to clinical trials. Some experience with simulation may be useful, though this
    is not required to use this book. Some experience with SAS/STAT procedures, SAS/IML,
    and the SAS macro language is expected.'
