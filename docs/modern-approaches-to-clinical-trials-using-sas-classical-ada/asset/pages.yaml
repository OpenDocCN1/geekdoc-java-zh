  md: '# 11.3 Efficiency of Classical Enrichment Designs


    Simon and Maitournamn [24] and Maitournamn and Simon [25] considered a phase III
    randomized trial setting to evaluate molecular targeted treatment using a binary
    endpoint or continuous endpoint. The evaluations were done under the assumption
    that the assay was predictive of a subset of patients who benefited from the targeted
    therapy. They compared the all-comers design where all the patients are allowed
    to participate in the trial with the enrichment design with restricted subset
    population. They compared the operating characteristics based on average screened
    and randomized sample size.


    For a binary endpoint, the relative efficiency of the targeted design versus the
    untargeted design can be expressed as


    ```

    $\frac{n}{n^T}=\left[\frac{\zeta_1^2}{\zeta_0^2+(1-\gamma)\zeta_1^2}\right]^2f$

    ```


    where $2nT$ and $2n$ denote the number of patients that are needed to randomize
    in the enrichment and all-comers design, respectively, to achieve the same statistical
    power for testing the null hypothesis. $\zeta_1$ and $\zeta_0$ represent the effect
    size (e.g. difference in response rate) of the treatment group versus the control
    group in the biomarker positive and biomarker negative groups. $\gamma$ accounts
    for the proportion of the biomarker negative group of the population, and $f$
    is the relative efficiency factor close to 1 in [24]. For the calculation of relative
    efficiency in light of the number of screened patients, simply multiply the equation
    by $(1-\gamma)$.


