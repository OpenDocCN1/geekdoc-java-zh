  md: '# 7.4 Further Considerations on MCP-Mod


    The original MCP-Mod procedure from Bretz et al. was motivated by the work of
    Tukey et al., who proposed to use several trend tests simultaneously based on
    different functional dose-response descriptions and subsequently to adjust the
    resulting p-values for multiplicity [2,13]. Since then, the methodology has been
    the subject of several investigations. Thomas and Wakana et al. investigated extensions
    to Bayesian methods for estimating the dose-response curve from a sparse dense
    data [14, 15]. Klingenberg applied the MCP-Mod approach to proof-of-concept studies
    with binary responses [16]. Benda proposed a time-dependent dose finding approach
    with repeated binary data [17]. Akacha and Benda investigated the impact of dropouts
    on the analysis with recurrent event data [18]. Wouter extended the MCP-Mod approach
    to investigate longitudinal toxicological data [19]. Tao et al. incorporated both
    efficacy and safety endpoints through point modeling [20]. Dette et al., Baenen
    et al., and Gutjahr and Bornkamp investigated the use of likelihood ratio tests
    instead of multiple contrast tests [21-23]. Miller, Tanaka, and Franchetti et
    al. extended the MCP-Mod approach to flexible, two-stage designs that include
    the possibility to perform adaptations (e.g. adding or dropping doses) under a
    strict FWER control [24-26]. Dragalin et al., Bornkamp et al., and Vandemueleebroecke
    et al. investigated the MCP-Mod procedure in response-adaptive designs, addressing
    two major challenges in dose-finding studies: uncertainty about the dose-response
    models and large variability in parameter estimates [27-29].'
  merge: -1
  pgno: 354
