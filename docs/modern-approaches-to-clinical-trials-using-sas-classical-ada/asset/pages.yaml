    be clearly defined and should be the only subgroup to be examined for efficacy.
    There is a null and alternative hypothesis associated with each of the populations
    ($H_0^{OP}$ and $H_0^{SP}$). The null hypotheses of no difference between the
    experimental treatment and the control are for the final endpoint (overall survival
    in this case), while the alternate hypotheses ($H_1^{OP}$ and $H_1^{SP}$) indicate
    that


