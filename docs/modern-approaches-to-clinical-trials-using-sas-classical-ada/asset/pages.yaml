    present the prior predictive data generation in the macro. SAS code to generate
    $\gamma_0$ and $\gamma_1$ from the sampling priors is shown in the first part
    of the Example Code 4.1 Generation of the Prior Predictive Survival Data. For
    $s=0$ and $s=1$, we generate $\gamma_1$ from the sampling prior'
