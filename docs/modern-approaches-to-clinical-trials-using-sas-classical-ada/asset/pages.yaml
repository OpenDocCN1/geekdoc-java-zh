  md: "The first table in Figure 2.1 Output for Example Code 2.5 describes the stated\
    \ design aspects of this trial. The maximum information percentage is 101.4% which\
    \ is also known as the inflation factor, indicating a small 1.4% increase from\
    \ total sample size N=212 in fixed-sample design (see 2.2 Examples of Classical\
    \ Fixed-Sample Designs) to be at N=216 here.\n\nIt can be noted that the cumulative\
    \ `proc seqdesign`, unlike `proc power`, uses the standard deviation as a known\
    \ parameter in calculating the information without adjustment to loss of freedom\
    \ freedom. Under the specified alternative hypothesis, the expected sample size\
    \ in this sequential trial is only 78.8% of the fixed sample size, due to early\
    \ stopping for efficacy. The second table `stopProb` shows the expected cumulative\
    \ stopping probabilities under four hypothetical treatment effect scenarios. Parameter\
    \ $c$ represents a fraction of the originally specified hypothesis effect size\
    \ (i.e. $\theta_1=0.02$). For example, if $c=0$ it makes the first scenario $c\\\
    theta_1=0$ identical to the null situation. Under the null scenario, the cumulative\
    \ stopping probability at the final stage is 0.025. If $c=1.5$, it makes $c\\\
    theta_1=0.03$. Under this treatment effect scenario, the design can achieve a\
    \ cumulative power greater than 80% (0.8041) as early as the third stage. In addition,\
    \ it can be expected under this optimistic alternative situation that the trial\
    \ can stop at stage 2.5, on average, meaning that this trial is likely to stop\
    \ before reaching the third stage. The next default table summarizes the alternative\
    \ references and boundary values under the default boundary Z scale. The alternative\
    \ reference (also known as the drift) for the first stage is calculated as $\t\
    au$ and so on. Using the Haybittle-Peto method, the boundary values of the first\
    \ four stages are set to a constant at 3 and that for the final stage is 1.99.\
    \ The next table `Errband` displays the cumulative error spending by stage under\
    \ the null hypothesis. The last two tables as requested by the samplesize statement,\
    \ show a summary of sample size calculation and the total sample size required\
    \ rounded up to 216, as well as the cumulative sample size by stage and treatment\
    \ arm. Saving in patient recruitment occurs if this sequential trial is able to\
    \ stop early to declare efficacy.\n\nHowever, a major critique of renewing this\
    \ pediatric FH trial into a sequential framework is that it has a long follow-up\
    \ period of 2 years. It implies that subjects may still be steadily recruited\
    \ while we wait for the responses of an earlier group of subjects to be measured\
    \ and analyzed. This happens if the recruitment rate is faster than the rate at\
    \ which"
