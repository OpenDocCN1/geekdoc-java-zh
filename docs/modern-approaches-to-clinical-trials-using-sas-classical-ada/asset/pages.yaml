    |

    |---|---|---|

    | Restricted randomization | Aims to balance the numbers of subjects among treatment
    arms. | Permuted block design, Biased design |

    | Covariate-adaptive randomization (CAR) | Desires to balance the treatment assignments
    across selected covariates. | Stratified scheme, CAR by minimization, Model-based
    optimal CAR |

    | Response-adaptive randomization (RAR) | Allows the allocation probability to
    change as the trial proceeds, so that the chance for a patient to be assigned
    to a better arm increases. | Play-the-winner rule, Optimal RAR, Bayesian RAR |

    | Covariate-adjusted response-adaptive randomization | Combines CAR and RAR, which
    skews the randomization probability to the potentially better treatment, as well
    as controlling patient heterogeneity. | Bayesian CARA |'
