- img_proc: true
  md: '# 6.4.1 Brief Introduction to the Emax Model


    This section describes two simulated practical examples for continuous and binary
    endpoints. The simulated data assume that there are 5 dose groups, 0mg (placebo),
    2.5mg, 5mg, 10mg, and 20mg, in a phase II dose ranging trial. The sample size
    in each dose group is 60. The mixed procedure is used to fit 4-parameter models
    to analyze the data. Note that proc mix in SAS could be used to fit the 4-parameter
    model as well, which is dedicated to the nonlinear regression model. Both procedures
    produce very similar estimates and results. In addition, code for trend tests
    for PoC, using the contrast (generated with the polyorth macro) accounting for
    equal or unequal dose spacing, are included for practical purpose for readers
    on both the continuous and binary endpoint cases.


    The model is one of the commonly used nonlinear endpoint in dose response studies
    [24]. The model is shown below,


    $y_i = E_0 + E_{max} \tilde{A} - \frac{D_i^h}{ED_{50}^h + D_i^h} + \mu_i$,


    where


    +   1. $i$ is the subject ID


    +   2. $y_i$ is the observed continuous response variable for the $th$ patient


    +   3. $E_0$ is the basal effect, i.e., the response when the dose is 0 mg


    +   4. is the maximum effect attributable to the drug


    +   5. $ED_{50}$ is the dose that produces half of


    +   6. $h$ is the hill parameter, or slope, which measures the sensitivity of
    the response to the dose range of the drug, determining the steepness of the dose–response
    curve ($N > 0$)'
  merge: -1
  pgno: 323
- img_proc: true
  md: '7. $D_i$ is the dose-level for the $i$th patient


    8. $\epsilon_i$ is the random error for the $i$th patient. A standard assumption,
    adopted here, is that the $\epsilon_i$ terms are independent and identically distributed
    with a mean of 0 and a variance $\sigma_{\epsilon}^2$. An additional standard
    assumption is that the error terms are normally distributed.


    [Figure 6.5 Emax Model Dose-Response Curve](https://example.com), shows a typical
    dose-response curve, based on a monotonic increase assumption. Note that the model
    dose-response curve can be either increasing or decreasing relative to an increase
    in dose. If the response is decreasing, the value of the parameter will be negative.


    Figure 6.5 Emax Model Dose-Response Curve


    ![](img/f4ec2665c3484c528370923aeb5cb99f_324_0.png)


    The above model is a traditional 4-parameter model (also called the sigmoidal
    model) that is commonly used in dose-response study analysis. With 4 parameters
    ($E_0$, $ED_{50}$ and $h$), the model provides great flexibility to fit various
    shapes of the dose-response relationship and makes it one of the popular dose-response
    models. However, there are'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'some limitations in the applications of this model. First, because the model
    has 4 parameters, it requires at least 5 doses (could include a placebo as dose
    0) and assumes a monotonic dose-response curve. Second, the 4-parameter model
    sometimes does not converge. In the case that the 4-parameter model does not converge
    or a study is designed with only 4 dose level, a common practice is to remove
    the hill parameter, e.g., by the slope parameter $h=\uparrow$. The model then
    becomes a 3-parameter model (i.e., the so-called hyperbolic),


    ```

    $y_i = E_0 + E_{max} \tilde{A} - \frac{D_i}{ED_{50} + D_i} + I\mu_i$,

    ```


    where the terms are defined as above for the sigmoidal model.


    The above model assumes that the response variable is continuous, but sometimes,
    the response variable could be binary, e.g., a response rate. In this case, the
    model can be readily revised to be a generalized model using a log link,


    ```

    $$\log(\frac{\pi}{1-\\pi}) = E_0 + E_{max} \tilde{A} - \frac{D^h}{ED_{50} + D^h}$$

    ```


    where $\pi$ is the observed response rate.


    In the next two sections, we use the above described models to analyze the simulated
    data as a demonstration of applications. The data sets are simulated as `detcon`
    (for a continuous endpoint) and `detbin` (for a binary endpoint).'
  merge: -1
  pgno: 325
