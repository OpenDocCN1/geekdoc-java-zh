  md: '# 11.1.2 Issues to Consider


    There are a number of issues (Issues to Consider in Selecting a Design with Predictive
    Biomarker Component) that one needs to consider before designing a trial with
    a predictive biomarker component. It''s an important step as we are armed with
    alternative design options in a rapidly growing literature.


    First, we need to evaluate the strength of preclinical evidence for a potential
    predictive biomarker. If there is compelling preliminary evidence that the experimental
    therapy does not provide benefit to all the patients, and the benefit is restricted
    to a subset of patients expressing a molecular or genetic value, an enrichment
    strategy may be adopted. Otherwise, an unselected or all-comers strategy may be
    so wise that there is no missed opportunity for drug development, patients, and
    the marketplace. The second issue is whether the prevalence (percentage) of the
    biomarker positive group is high, moderate or low. If the prevalence is high,
    population enrichment may be redundant and a traditional design could render the
    greatest commercial value and market reach. Likewise, an all-comers design may
    not be feasible for a low-prevalence situation. Thirdly, the accuracy of the measurements
    that are used to identify the enrichment population and the sensitivity and specificity
    of the enrichment criterion in distinguishing responders and non-responders are
    also critical issues. An accurate, reproducible, and adequately validated assay
    is essential for establishing desired therapeutic activity and clinical validation
    of the biomarker (usually realized by a companion diagnostic kit from a central
    lab to identify the patients) in a prospective manner. In addition, the feasibility
    and timing to obtain a biopsy (de-novo or archived) or serum sample at baseline
    prior to randomization determines whether the biomarker can be prospectively validated.


    Table 11.2 Issues to Consider in Selecting a Design with Predictive Biomarker
    Component


    | Strength of preclinical evidence for a marker | Whether we should use/targeted
    strategy (e.g. crizotinib in ALK+ non-cell lung cancer) or an unselected/all-comers
    strategy (e.g. cetuximab and panitumumab in wild-type KRAS) |'
  merge: -1
  pgno: 531
- img_proc: true
  md: '| Prevalence of the marker | Percentage of the population having the biomarker
    positive (such as mutation or aberration) status |

    |---| Reproducibility and validity of assays | Whether the assay is accurate,
    reliable, and has been analytically validated (local or central lab) |

    | Feasibility and timing of assessments for the biomarker status | Whether the
    biomarker can be prospectively validated or retrospectively validated |


    We will further discuss these issues in this chapter when reviewing the existing
    methods of population enrichment designs.'
