    groups. Of course, if the interest is to write a contrast that reflects the underlying
    model, more variety of contrasts can be considered.


    # 6.2.7.2 Selecting a Treatment Difference from a Placebo


    The concept of identifying the MCID is necessary in designing dose-ranging clinical
    trials. Although, in practice, it is sometimes difficult to objectively establish
    a widely accepted MCID, it is critical to use a treatment difference ($\delta$)
    as the target when calculating sample sizes for a clinical trial. In other words,
    without $\delta$, sample size cannot be calculated. Hence, if there is a MCID
    for a given indication, it will be very helpful in clinical development of new
    products.


    Typically in phase III clinical trials, the treatment differences used for trial
    design are mainly based on those observed from earlier studies from this product.
    But in early phase II, such $\delta$ is not easily obtained. In general, there
    are three ways used in practice to obtain a $\delta$ for designing an early phase
    clinical trial. One popular way is to use data from other products. Especially
    when there are products already approved for general patient population use. In
    the US, after a product is approved, the Food and Drug Administration (FDA) publishes
    a summary basis for approval (SBA). In Europe, the European Medicinal Agency (EMA)
    publishes European Public Assessment Report (EPAR) to explain why a product is
    approved for public use. Typically, the treatment difference can be observed from
    either SBA or EPAR. In some situations, information on treatment difference of
    other products can be found from publications, product labels or a registries
    website, such as clinicaltrial.gov. Therefore, by using observed treatment differences
    from other products, a $\delta$ could be selected to help the design of this new
    study.


    A second way of selecting a treatment difference is by evaluating earlier data
    observed from the products under development. Project team members use pre-clinical
    data, PK data, biomarkers, or other data obtained from this product and propose
    a reasonable $\delta$ such that it'
