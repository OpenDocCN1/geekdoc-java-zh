- img_proc: true
  md: '#  11.4.3 Bayesian Methods


    #  11.4.3.1 Bayesian Adaptive Randomization (BAR) Enrichment Design


    An important feature of an adaptive clinical trial is to continually update the
    design by using the accumulated information from interim data, which fits naturally
    into the Bayesian paradigm. The Bayesian approach was actually developed specifically
    to deal with new data as come in by updating prior beliefs to provide direct probability
    statements about the treatment effect. Moreover, in contrast to frequentist adaptive
    designs that require the type I error rate to be controlled, Bayesian inference
    is not affected by the number or timing of the interim analyses [55], allowing
    multiple analyses of the accumulating study data that update the probabilities
    under investigation. As a result, Bayesian designs are appealing to adaptive enrichment
    designs where adaptations in enrollment, randomization ratio, and subgroup selection
    are carried out based on emerging data, particularly in exploratory studies to
    screen biomarkers.


    In contrast to the equal (or fixed ratio) randomization approach in a frequentist
    design, this type of Bayesian design [56-57] implements an adaptive randomization
    method that allows the evaluation of treatments and biomarkers simultaneously,
    providing more patients with potentially more effective treatments according to
    the patients'' marker profiles. The Bayesian design is usually based on a hierarchical
    model for the endpoint of interests. The model parameters are also random variables
    modeling the random effects regarding the association of treatments and biomarkers
    with the outcomes of interest. With the use of hierarchical models, information
    can be borrowed across different subgroups as a means to increase efficiency.


    In the common set of evaluating two treatments and one binary biomarker, the BAR
    can be applied to achieve the following three goals: (1) test whether the marker
    is prognostic or predictive, (2) test whether the new treatment works better than
    the standard treatment in all patients or in patients within certain marker subsets,
    and (3) treat'
  merge: -1
  pgno: 572
- img_proc: true
  md: 'patients better in the trial by assigning more patients to the more effective
    treatment based on the patients'' marker status. Most of the frequentist designs
    can also achieve the first 2 goals.


    The BAR enrichment design can be naturally extended to multiple treatments and
    multiple markers. For a patient with a baseline characteristic following into
    marker group $j$, assuming the posterior estimate of effect size in treatment
    $i$ is $\delta_{ij}$, the randomization ratio to treatment $i$ can be expressed
    in the form of $q_i/\sum q_j$, where $\lambda$ is the tuning parameter. Note that
    when $\lambda=0$, it corresponds to equal randomization. When $\lambda=\infty
    it becomes the "play-the-winner" design, in which the next patient is assigned
    to the current winner treatment based on the available data, and no randomization
    is involved. The larger the $\lambda$ is, the more imbalance the randomization
    will have.


    The BAR enrichment design has been implemented successfully in several high-profile
    clinical trials in oncology. One example is the Biomarker-integrated approaches
    of targeted therapy of the lung cancer elimination (BATTLE) trial [56]. The BATTLE
    project consists of one umbrella trial and four parallel II studies with biomarker-based
    targeted therapies in advanced NSCLC previously treated with chemotherapy but
    subsequently failed. The main objective of the study was to estimate and test
    the disease control rate at 8 weeks for each treatment given the patients'' biomarker
    profiles. The Bayesian probit model was used to characterize the disease control
    rate for each treatment by a marker subgroup with adaptive randomization. Another
    notable example is the I-SPY 2 (investigation of serial studies to predict your
    therapeutic response with imaging and molecular analysis) 2 phase II trial in
    the neoadjuvant setting for locally advanced breast cancer. It is designed to
    test investigative agents in combination with standard chemotherapies in a curious
    population. By employing an innovative BAR design, the study aims to test new
    treatments in half the time, at a fraction of the cost and with significantly
    fewer participants [58]. Regimens that show a high predictive probability of being
    more effective than the standard therapy will graduate from the trial with their
    corresponding biomarker signature(s). Regiments will be dropped if they show a
    low probability of improved efficacy with any biomarker signature. New drugs will
    enter as those that have undergone testing are graduated or dropped.'
  merge: -1
  pgno: 573
- img_proc: true
  md: 'One obvious limitation of the BAR design is that adaptive randomization requires
    a quick turnaround time to learn from the interim data and adjust the randomization
    rate. As a result, the BAR design is applicable only for trials when the endpoint
    can be assessed in a relative short period of time.


    Korn and Freidlin [59] conducted designs comparing the outcome-adaptive randomization
    with the fixed 1:1 or 2:1 randomization design in a randomized two-arm setting.
    The comparisons were done in terms of required sample sizes, the numbers and proportions
    of patients having an inferior outcome. The authors found no benefits to outcome-adaptive
    randomization over 1:1 or 2:1 randomization and, as such, recommended using a
    fixed 2:1 randomization design when a higher proportion of patients being randomly
    assigned to the experimental treatment is preferred. In a commentary paper, Berry
    [60] argued that the greatest potential for adaptive randomization is in multi-armed
    trials, as in the BATTLE and I-SPY 2 studies, despite that in two-arm trials the
    benefit of adaptive randomization is limited.


    # 11.4.3.2 Bayesian/Frequentist Design for Biomarker Treatment Interaction


    In the setting of survival endpoint and only 1 biomarker, Karurui and Simon [61]
    proposed a two-stage Bayesian design similar to the frequentist designs of Freidlin
    and Simon [29] and Wang et al. [45]. Specifically, it is a Bayesian version of
    the adaptive design of Wang et al. [45] where the posterior distribution of treatment
    effects within the marker-positive and marker-negative strata based on an interim
    analysis where the first stage data is used to make decisions on patient recruitment
    and trial progression. It is essentially a hybrid Bayesian/frequentist design
    that takes advantage of the flexibility of Bayesian methods of incorporating prior
    confidence in the candidate predictive biomarker, and at the same time controls
    the type I and II error rates that meet the standards for conventional frequentist
    phase III trials. At the interim analysis, the posterior probabilities are compared
    to a prespecified threshold value, and 3 possible actions are taken:


    +   1. Stop the trial'
  merge: -1
  pgno: 574
- img_proc: true
  md: '+   2. Stop recruitment to the marker negative group at the interim stage


    +   3. Continue recruitment of both negative and positive patients.


    The Karurui and Simon design enables limiting the number of test negative patients
    to the test drug if data suggest no benefit. It is also demonstrated that the
    design offers a number of advantages over the frequentist version of the Wang
    et al. [45] design.'
