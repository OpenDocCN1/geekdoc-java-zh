    \    stage=-2;\n    keep_scale_stage_parameter estimate stderr;\nrun;\nproc print\
    \ data=paraest2; run;\nproc secqtest boundary=boundaryinfo parms(testvar=trt)=paraest2\n\
    infoadj=none boundaryscale=mle;\nods output Test=boundaryinfo3;\nrun;\n```\n\n\
    In Example 2.8 Efficacy and Utility Boundaries for the Psoriasis Trial, we had\
    \ a sequential trial designed with the objective of comparing the anti-TNF treatment\
    \ to a placebo. The clinical outcome is a binary response. In the design statement,\
    \ this modified design has four stages with power at 86% (beta=0.14) as in the\
    \ fixed-sample design. Additionally, we want to conduct a trial with options for\
    \ early rejection or acceptance of the null hypothesis; therefore the option stop\
    \ is used. However, the monitoring approach for efficacy is based on the Pocock\
    \ boundary while for utility is based on the OBF boundary: method(alpha)=poc and\
    \ method(beta)=obf, respectively. In the samples statement, we specify the twosamplefreq\
    \ option for testing two proportions with a null proportion of 7% and an alternative\
    \ proportion at 40%. The test available in proc seqdesign is the binomial test,\
    \ which relies on normal approximation to the binomial distribution. Fisher’s\
    \ exact test is not available in sequential design because it does not follow\
    \ canonical"
