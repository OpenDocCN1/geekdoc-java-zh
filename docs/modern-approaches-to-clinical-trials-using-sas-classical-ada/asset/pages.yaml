- img_proc: true
  md: However, a drawback of the permuted block randomization is that potential selection
    bias might be introduced if the practitioner is aware of the block size. By the
    end of each block, the treatment assigned to the last participant in the block
    is known as long as the previous treatment assignments have been kept track of.
    A natural remedy to prevent such selection bias is to randomly mix blocks of different
    sizes so that the block size is unpredictable as well.
  merge: -1
