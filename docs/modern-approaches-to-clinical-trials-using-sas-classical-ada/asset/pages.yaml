  md: '# 3.3.5 Methods Based on the Conditional Type I Error Principle


    This group of methods computes the probability of rejecting the null hypothesis
    at the end of the trial or interim data and uses it to guide interim decisions.
    One of the most well-known methods from this category is the conditional error
    probability method by Prochan and Hunsberger [23]. The conditional rejection probability
    is defined as


    ```

    $CP_\zeta(N-n, z_{\\alpha}|Z_n) = Pr(Z_n > z_{\\alpha}|Z_n, \zeta)$

    ```


    where $n$ and $N-n$ are the Stage 1 and Stage 2 sample sizes per group, respectively
    $Z_n$ is a standardized normal test statistic under the original design and $\zeta$
    is a standardized hypothesized effect size. When the above conditional probability
    is calculated under a non-zero $\zeta$ (either hypothesized effect size or observed),
    it becomes a conditional power. If it is calculated under $\zeta=0$, then it becomes
    a conditional error probability. Integrated over all possible realizations of
    $Z_n$, the conditional error probability becomes the overall type I rate. One
    could reduce the type I error inflation resulting from data-driven sample size
    adjustment by selecting a larger critical value $z_{\alpha}$ at the final stage
    and agreeing to continue the trial only if the first stage p-value $p_1<p^*, p^*
    \in(0, 0.5]$ (e.g. if $p^*$ is set to 0.15, which would translate into accepting
    the probability of futility stop in case the p-value from the first stage $p_1
    \geq p^*$). However, these measures would only keep overall type I error below
    $\alpha$, but not an exact $\alpha$-level procedure.


    The key idea of the Prochan and Hunsberger method is to create an exact $\alpha$-level
    test at the end. They rewrite type I error rate as


    ```

    $$\int_{-\infty}^{\infty} A(Z_n)\phi(Z_n) = \alpha, \quad (3.4)$

    ```


    where $A(Z_n)$ could be any increasing function with range $[0,1]$, with the integration
    in (3.4) over all possible realizations of $Z_n$ under the null hypothesis. Prochan
    and Hunsberger suggest using the following circular function:'
  merge: -1
  pgno: 181
- img_proc: true
  md: "```\n$A(z_n) = 1 - \\frac{1}{\\sqrt{\rho}} \\sqrt{k^2 - z_n^2} \\quad z_n \\\
    cdot \\le z_n < k. \\n z_n \\ge k$\n```\n\nIn the above equation, $\rho^*$ is\
    \ the cut-off for the Stage 1 futility stop and the critical value $k$ for the\
    \ Stage 1 test statistic $z_n$ is selected (given $\rho^*$) so that condition\
    \ (3.4) holds. The function $A(Z_n)$ dictates how much conditional type I error\
    \ rate to allow at the end of the study given the observed interim results $Z_n=z_n$.\n\
    \nWhen the design includes an unblinded SSR in addition to early stopping (efficacy/or\
    \ futility), the critical value $c$ for the final testing and new sample size\
    \ per group for second stage $n_2=M-n$ are selected so that $CP_0(n_2, c_n)=A(z_n)$\
    \ and $CP_\\delta(n_2, c_n)=1-\beta$.\n\nIt is important to note that the rule\
    \ lets users decide how to select $n_2$ (e.g. how high the conditional power should\
    \ be or whether to use empirical vs effect size). If the rule is set, the type\
    \ I error rate is guaranteed at level $\\alpha$. This method can also be viewed\
    \ as a special case of the p-value combination principle.\n\nAnother method in\
    \ the same category is Müller and Schäfer [24]. The Müller and Schäfer method\
    \ is a lot more general than the method by Prochan and Hunsberger and can be extended\
    \ to multistage trials with adaptations other than sample size (e.g. hypotheses/endpoint\
    \ changes). The latter allows an unplanned interim analysis to be inserted into\
    \ a sequence of pre-planned interim analyses in a group-sequential trial. Even\
    \ though such extensions are beyond the scope of this chapter, the simple 2-stage\
    \ procedure for SSR highlights a fundamental role of the conditional error function\
    \ shared That is, after the Stage 1 data have been observed, the conditional error\
    \ probability (or conditional rejection probabilities, CRP, in their terminology)\
    \ given $Z_n=z_n$ is all the information from Stage 1 that needs to be carried\
    \ into Stage 2 of the study. As long as the Stage 2 in the new design has conditional\
    \ type I error rate equal to the CRP calculated from Stage 1, the overall type\
    \ I error will be preserved. Müller and Schäfer also recommend selecting Stage\
    \ 2 sample size based on the conditional power argument [24]. When it comes to\
    \ type I"
