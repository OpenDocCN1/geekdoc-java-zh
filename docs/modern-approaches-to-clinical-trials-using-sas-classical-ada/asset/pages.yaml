  md: "# 4.7.1 Implementation of BSMED\n\n# 4.7.1.1 Detailed Macro Options\n\nIn this\
    \ section, we present the details of SAS macro, BSMED, for Bayesian survival meta-experimental\
    \ design. As discussed in 4.2 Meta Design Setting, the macro BSMED requires two\
    \ input data sets, namely the current and the historical data (optional), 11 input\
    \ variables, and one output file (optional). Names and Descriptions of Input Variables\
    \ and Design Values shows the names and descriptions of the input variables and\
    \ design values in the SAS macro.\n\nTable 4.4 Names and Descriptions of Input\
    \ Variables and Design Values\n\n| Data | Names in macro | Description |\n|---|---|---|\n\
    | Historical | a0 | Discounting parameter ($a_0$) |\n| | sigma0 | Initial variance\
    \ of $\\gamma_0$ ($\\sigma_0^2$) |\n| | sigma1 | Initial variance of $\\gamma_1$\
    \ ($\\sigma_1^2$) |\n| Current | tau0 | Initial variance of $\theta_{UK}$ ($\t\
    heta_{UK}^2$) |\n| | tau | Initial variance of $\theta_K$ ($\theta_K^2$) |\n|\
    \ Design | delta | Design non-inferiority margin ($\\delta$) |\n| | eta0 | User-defined\
    \ Bayesian credible level ($\\eta_0$) |\n\nThe input variables, including the\
    \ number of MCMC runs (NMCMC), the number of simulation data sets (RESP), and\
    \ the number of burn-in samples (nbi), are required to run MCMC and generate predictive\
    \ data in the macro. We also include an initial seed number (SEEDGEN) as the input\
    \ variable. The input historical data should use SAS variable names $\\kappa,\
    \ y, v,$ and $\\kappa$ for the TID, the total subject year duration, the treatment\
    \ arm indicator, where 0 denotes control and 1 corresponds to experimental. The\
    \ input current data requires the SAS variable names $k, n, p, x, TA$ and $TD$\
    \ for the trial ID, the total sample size,"
  merge: -1
  pgno: 225
- img_proc: true
  md: 'the proportion of subjects in the control arm, the annualized event rate, the
    accrual time, and the trial duration. The structure of the macro BSMED is given
    as follows:


    ```

    %macro BSMED(hist,curr,delta0,NMCS,nbi,a0,REP,sigma0,sigmal,tau0,tau,SEEDGEN,output);

    ```


    +   1. Generate predictive survival data


    +   2. Sample from the posterior distribution


    +   3. Calculate type I error and power


    +   4. Produce the desired output


    ```

    %mend BSMED;

    ```


    The BSMED macro does not require an input file for the historical data. If historical
    data are available, we can use


    ```

    %BSMED(HIST=hist,curr,delta=1.3,a0=0.10,eta0=0.96,NMCS=20000,nbi=5000,REP=5000,sigma0=

    ```


    and if no data are available, we simply use


    ```

    %BSMED(curr,delta=1.3,a0=0.10,eta0=0.96,NMCS=20000,nbi=5000,REP=5000,sigma0=

    ```


    As seen in the above macro, BSMED consists of the four main parts: generating
    predictive survival data, running PROC MCMC to sample from posterior distribution,
    calculating the type I error and power using posterior estimates, and producing
    the desired output. In the subsequent subsections, we provide a detailed development
    for each of these components of the macro except for the desired output step using
    PROC REPORT.


    # 4.7.7.2 Predictive Survival Data Generation


