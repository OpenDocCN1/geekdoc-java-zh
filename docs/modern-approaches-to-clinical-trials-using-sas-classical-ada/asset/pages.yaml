  md: '# 3.4 Information-Based Design


    Traditional sample size calculation takes into account both the magnitude of the
    treatment effect ( and values of the nuisance parameter (e.g., the variance for
    continuous endpoints or the placebo response for binary endpoints), with the best
    guesses of the nuisance parameter used for the initial sample size calculation.
    However, if initial estimates of the nuisance parameters are incorrect, this can
    adversely impact the statistical power to detect a clinically meaningful difference,
    if indeed a treatment difference exists. One way of addressing this uncertainty
    around nuisance parameters is to utilize an information-based design. Information-based
    design and analysis is based on the statistical information (defined below) that
    is available. In other words, the study continues until the required statistical
    information is achieved. Here, design and analysis is based on the statistical
    information or precision instead of the sample size scale. Information-based designs
    are based on the work of several authors, which is itself based on the fundamental
    concept that statistical information is obtained in the same manner irrespective
    of the parameter [35-37].


    For the classical design, information is defined as $I = \frac{(z_{\alpha/2}+z_{\delta})^2}{\delta^2}$.
    Here, the statistical information depends on both the sample size and the magnitude
    of the nuisance parameter. For binary endpoints, information depends on the magnitude
    of the placebo response. For time-to-event (survival) endpoints, information is
    based on numerous factors, including accrual rate, event rate, length of follow
    up, and drop out rates. In longitudinal studies, information also depends on the
    number of time points observed per subject. In general, statistical information
    ($I$) is inversely related to the standard error of the estimator $\delta$ of
    the parameter $\delta$; that is, $I = \frac{1}{(SE^2)}$. Hence, the greater the
    information that is available, the higher the precision and the smaller standard
    error. In a multistage design, the maximum information available is $I_{max} =
    I^*F$, where $F$ is the inflation factor, a multiplicative constant which is a
    function of $K$ (number of stages), the form of the error spending boundary (e.g.
    O''Brien Fleming or Pocock), and the type I ($\alpha$) and type II ($\beta$) errors.
    Tsiatis provides a table of inflation factors for different combinations of $K$,
    error spending boundaries, $\alpha$ and $\beta$ [37].'
