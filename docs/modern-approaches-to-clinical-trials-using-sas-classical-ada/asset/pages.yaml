    \ significance level is 0.05 and the total sample size is 100, then the power\
    \ of the overall test is calculated by Example Code 11.4 Power for Adaptive Signature\
    \ Design. In this example, the power is 94.3%.\n\n# Example Code 11.4 Power for\
    \ Adaptive Signature Design\n\n```\n%macro power(pe, pc, alpha, N);\ndata result;\n\
    \    pe=&pe;\n    pc=&pc;\n    alpha=&alpha;\n    N=&N;\n    b=1&alpha;\n    pbar=(pe+pc)/2;\n\
    \    za=quantile('Normal', b);\n    num=(pe-pc)-za*sqrt(pbar*(1-pbar)*4/N);\n\
    \    den=sqrt(pe*(1-pe)*2/N+pc*(1-pc)*2/N);\n    alpha=num/den;\n    power=CDF('Normal',\
    \ a);\nend;\nrun;\nproc print noobs;\n    var pe pc N alpha power;\nrun;\n%mend;\n\
    %power(0.5, 0.2, 0.05, 100);\n```\n\nThe advantage of this design is its ability\
    \ to de-risk losing the label of the broader population in pivotal trials. According\
    \ to Freidlin and Simon [29], this design may ideal to use for phase II clinical\
    \ trials for developing an assay or signatures for patients who respond better\
    \ to targeted therapies. One drawback is that half of the patients are used for\
    \ development or validation. If prevalence of the subgroup of biomarker sensitive\
    \ patients is low then this design will require a large number of patients to\
    \ be screened. This may not be economically feasible, and it will be operationally\
    \ challenging and will extend the enrollment period. The other drawback is that\
    \ with a larger number of sub-groups-lead to high dimensional data, a large sample\
    \ size may be needed to adequately power the trial."
