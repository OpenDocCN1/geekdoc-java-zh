- img_proc: true
  md: '# 5.1 Dose Finding in Oncology


    In cancer drug development, phase I clinical trials are mainly designed to determine
    the maximum tolerated dose (MTD), which is typically defined as the maximum dosage
    that can be administered to patients without exceeding the unacceptable level
    of toxicity. In practice, the investigators specify a toxicity rate so so that
    the toxicity probability of the identified MTD should be closest to the target
    among all the doses under investigation. Phase I trials, often known as dose-escalation
    studies, involve only a single arm. The collected data are typically binary, indicating
    whether patients have experienced the dose-limiting toxicity (DLT). The DLTs are
    predefined drug-related toxicities that would prohibit continuing the treatment.


    In phase I trials, a common assumption is that toxicity monotonically increases
    with the dose, and so does efficacy. Once the MTD is determined, the treatment
    would exert the maximum effectiveness as long as patients can tolerate the dosage.
    For practicality, patients are typically grouped into cohorts according to their
    enrollment dates and each cohort is adaptively assigned to the most appropriate
    dose based on the cumulative data. The first cohort of patients may be treated
    at the lowest dose level or that specified by investigators.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 5.2 Continual Reassessment Method


    To incorporate the monotonic toxicity order, a dose-toxicity curve or a parametric
    model is often assumed. In contrast to algorithm-based designs, such as the 3+3
    design, where dose escalation or deescalation is solely on the data collected
    at the current dose level, model-based designs can pool all the information across
    different doses for decision making. Among a variety of model-based finding methods,
    the continual reassessment method (CRM) is a very popular approach which is often
    cast in the Bayesian framework [1]. The CRM may take a single-parameter power
    model, a two-parameter logistic regression, or a probit model. Different parametric
    models represent different patterns of the dose-toxicity curve, while the underlying
    true curve is typically unknown.


    With a focus on the one-parameter power model $[p_1 < \dots < p_j]$ denote the
    specified toxicity probabilities of a set of $j$ doses for the drug under consideration,
    which is often known as the skeleton of the CRM. Let $\phi$ denote the target
    toxicity probability specified by the investigator. We model the toxicity probability
    at dose level $j, j=1,...,$ in the form of


    $P(\text{toxicity at dose level } j) = \pi_j(\\alpha) = p_j^{\exp(\alpha)}$


    where $\alpha$ is an unknown parameter. Suppose that at a certain stage of the
    trial, we observe the data that $y_j$ patients have experienced the DLT among
    the $n_j$ patients treated at dose level $j, j=1,...,$. If we let $\D$ denote
    the observed data, the binomial likelihood function is given by


    ```

    $L(\alpha|\D) \propto \prod [\pi_j^{\exp(\alpha))^{y_j} (1-\pi_j^{\exp(\alpha))))^{n_j-y_j}$

    ```


    In the Bayesian paradigm, we often take a normal prior distribution for $\alpha$,
    i.e. $\alpha \sim N(0, \sigma^2)$, with a prior mean of zero and a prior variance
    $\sigma^2$. Using Bayes'' theorem, we can estimate the toxicity probability at
    dose level $j$ by the corresponding posterior mean,


    ```

    $\tilde{\pi}_j = \int p_j^{\exp(\alpha)} \frac{L(\alpha|\D)f(\alpha)}{\int L(\alpha|\D)f(\alpha)}
    d\alpha$.

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: "Once a cohort of patients is treated, the toxicity data would be updated in\
    \ light of the new information, and so would the likelihood function $L(\\alpha|D)$\
    \ which includes all the patients enrolled in the trial far. As a result, we re-estimate\
    \ the toxicity probabilities at all the dose levels using the posterior means\
    \ $\\hat{\\pi}_1, \\dots, \\hat{\\pi}_J$.\n\nIn detail, the CRM dose-finding procedure\
    \ is described as follows:\n\n+   1. Treat the first cohort of patients at the\
    \ lowest or the physician-specified dose level.\n2. Denote the current dose level\
    \ as $j^{curr}$. Based on the data observed thus far, we obtain the posterior\
    \ means of the toxicity probabilities for all the doses under consideration, $\\\
    hat{\\pi}_1, \\dots, \\hat{\\pi}_J$. We then find the dose level $j^*$ that has\
    \ a toxicity probability closest to $\\phi$, $j^* = \\text{argmin}_{j\\in\\{1..J\\\
    }} |hat{\\pi}_j - \\phi|$, and make decisions as follows:\n   a. if $j^{curr}\
    \ > j^*$, de-escalate to dose level $j^{curr} - 1$;n   b. if $j^{curr} < j^*$,\
    \ escalate to dose level $j^{curr} + 1$;n   c. otherwise, the dose stays at the\
    \ same level for the next cohort of patients.\n3. Once the maximum sample size\
    \ is reached, the dose with the toxicity probability closest to $\\phi$ is selected\
    \ as the MTD.\n\nThe sample size for the CRM trial is calibrated through simulation\
    \ studies in order to achieve desirable characteristics. In addition, if the lowest\
    \ dose is too toxic, as noted by\n\n```\n$P[\\hat{\\pi}_1 > \\phi|D] = \\frac{\\\
    log{\\log(\\phi)/\\log(\\rho_1)}}{\\f(\\alpha|D)}}d\\alpha} > 0.9$\n```\n\nthe\
    \ trial would be terminated for safety. The tuning parameter 0.9 can be adjusted\
    \ to control how stringent the safety rule is.\n\nAs an example, we illustrate\
    \ the CRM with a phase I clinical trial to find"
  merge: -1
  pgno: 252
- img_proc: true
  md: "the MTD of grey macro. Six dose levels of the drug are considered, and the\
    \ CRM skeleton is specified as $(p_1, p_2, p_3, p_4, p_5, p_6) = (0.05, 0.10,\
    \ 0.25, 0.55, 0.65)$. The MTD is defined as the dose that has a toxicity probability\
    \ closest to the target toxicity $\\phi = 30\\%$. Suppose the trial treated 5\
    \ cohorts with a cohort size of 3, and the toxicity outcomes and dose assignments\
    \ are listed below in Toxicity Outcomes and Dose Assignments for First Hypothetical\
    \ Trial.\n\n# Table 5.1 Toxicity Outcomes and Dose Assignments for First Hypothetical\
    \ Trial\n\n| Cohort Sequence | Dose Level | Cohort Size | # of DLTs |\n|---|---|---|--|\n\
    | 1 | 1 | 3 | 0 |\n| 2 | 2 | 3 | 1 |\n| 3 | 2 | 3 | 0 |\n| 4 | 3 | 3 | 2 |\n|\
    \ 5 | 2 | 3 | 0 |\n\nThe SAS Macro $_{CRM}$ in Example Code 5.1 Continual Reassessment\
    \ Method can be used to analyze the cumulative data and determine the next dose\
    \ assignment under the CRM framework. The input parameters for the $_{CRM}$ macro\
    \ are `currentdata`, `skeleton`, `target`, and `toxstop`. The `currentdata` parameter\
    \ stores the observed data set based on the treated patients, and each row corresponds\
    \ to the accumulated information for each cohort, where the three entries in each\
    \ cohort, dose level, and number of DLTs observed for each cohort, respectively.\
    \ The user must also specify the `skeleton` parameter, which is the specified\
    \ $(p_1, p_j)$. The target toxicity is denoted as `target` in the $_{CRM}$ macro,\
    \ which is set to be 0.3 as the default. In addition, the user can adjust the\
    \ toxicity tolerance by changing the value of `toxstop`. $_{CRM}$ creates a plot\
    \ that overlays the curves for the initial guess and the posterior estimate of\
    \ toxicity probability for each dose level. The output variable of $_{CRM}$ macro\
    \ is the suggested dose for the next cohort of patients.\n\n# Example Code 5.1\
    \ Continual Reassessment Method Macro\n\n```\n%macro CRM(currentdata,skeleton,target=0.3,toxstop=0.9);\n\
    proc iml;\n    use &currentdata;\n```"
  merge: -1
  pgno: 253
- img_proc: true
  md: '```

    read all;

    use &skeleton;

    read all;

    pihat={};

    dose=nrow(p);

    dosecurr=doselevel[nrow(doselevel)];

    stop=0;

    /* use posterior-likelihood * prior */\nstart posterior (alpha) global (DLT,doselevel,p,cohortsize);

    sigma=2;

    lik=1;

    nrow=nrow(p);

    do k=1 to n

    pi=[doselevel[k]]##exp(alpha);

    lik-lik=(pi##(DLT))*(1-pi)##cohortsize[k-DLT[k]);

    end;

    lik=exp(-0.5*alpha*alpha/sigma2);

    return(lik);

    finish;

    ```


    ```

    /* used to calculate the posterior mean of pi */

    start postmaxx(alpha) global (j,DLT,doselevel,p,cohortsize);

    post[j]##exp(alpha)posterior(alpha);

    return(post);

    finish;

    ```


    ```

    call quad(marginal,"posterior",{.M P})eps=1E-4 peak=0.1;

    pi={};

    do j=1 to ndose

    call quad(pi,"posttox",{.M P});

    pij=pij/marginal;

    pi=pi/pij;

    end;

    ```


    ```

    lb10(log(&target)/log(p[1]));

    call quad(postover,"posterior",-35|lb) eps=1E-4 peak=0.5;

    postover=postover/marginal;

    ```


    ```

    if postover>toxstop then stop=1;

    ```


    ```

    diff=abs(pi-&target)

    dosebest=diff[]:<

    dosenext=doseosecurr

    ```


    ```

    if dosebest<dosecurr then

    if dosecurr<ndose then do

    dosenext=dosecurr+1;

    end;

    ```


    ```

    if dosebest>dosecurr then

    if dosecurr>1 then do

    dosenext=dosecurr-1;

    end;

    ```


    ```

    if stop=1 dosenext="The trial should be terminated early"

    print dosenext;

    doselevel=;ndose;

    doselevel=doselevel;

    create doselevel from doselevel[colname="doselevel"]

    append from doselevel;

    ```


    ```

    create pi from pi[colname="pi"]

    append from pi;

    quit;

    ```'
