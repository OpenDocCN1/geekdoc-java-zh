  md: "# 7.5.3 Example 2: neurodeg Data for Generalized MCP-Mod Approach with Model\
    \ Averaging\n\nThe second concern concerns simulated data from [4] to illustrate\
    \ the use of the generalized MCP-Mod approach. The data set is available under\
    \ the name neurodeg from the DoseFinding R package. The SAS code used for the\
    \ computations and summarization of all results can be found in Appendix D.\n\n\
    This example refers to a phase II clinical study for a neurodegenerative disease.\
    \ The disease status is measured through a functional scale, with smaller values\
    \ corresponding to more severe neurodegeneration. The goal of the drug is to reduce\
    \ the rate of disease progression, which is measured by the linear scale over\
    \ time.\n\nThe trial design includes a placebo and four doses: 1, 3, 10, and 30\
    \ mg, with balanced allocation of 50 patients per arm. Patients are followed up\
    \ for one year, with measurements of the functional scale being taken at baseline\
    \ and every three months thereafter. The study goals are to (i) test for a dose-response\
    \ signal, (ii) estimate the dose-response, and (iii) select a dose to be brought\
    \ into the confirmatory stage of the development program.\n\nThe functional scale\
    \ response is assumed to be normally distributed and, based on historical data,\
    \ it is believed that the longitudinal progression of the functional scale over\
    \ the one year of follow up can be modeled by a simple linear trend. A mixed model\
    \ is assumed for the functional scale for the measurement $Y_{ij}$ at patient\
    \ $i$ at time $j$,\n\n```\n$Y_{ij} = (\beta_0 + b_{0j}) + (\\mu(x) + b_{uj})x_{ij}\
    \ + \\epsilon_{ij}$, $[b_j] \\sim N(0, \\Omega)$ and $\\epsilon_{ij} \\sim N(0,\
    \ \\sigma^2)$.\n```\n\nConsequently, the dose-response parameter of interest in\
    \ this situation is $\\mu(d)$, the slope of disease progression associated with\
    \ the dose $d$. Assume that the candidate models for $\\mu(x)$ in this example\
    \ include a model with $ED_{50} = 1.11$, a quadratic model with maximum effect\
    \ at 23 mg $(\\delta = -0.022)$, an exponential model with $\\delta = 8.867$ and\
    \ a linear model. Fitting the mixed model above using the `proc glmix` call in\
    \ Example Code"
  merge: -1
  pgno: 364
- img_proc: true
  md: "# 7.3 Mixed-Model of Dose Response for neurodeg Data, one obtains the estimated\
    \ slopes $\\hat{\\mu}=\\{-5.099, -4.581, -3.220, -2.879, -3.520\\}$ with corresponding\
    \ estimated variance-covariance $\\hat{\\Sigma}$ of compound symmetry structure\
    \ with diagonal elements 0.149 and off-diagonal elements 0.0094. Calculation of\
    \ the contrast test statistics and p-values using `proc glmix` for the MCP step\
    \ gives the result displayed in Contrast Test Statistics for the neurodeg Data.\
    \ `proc glmix` is used here because it allows for the calculation of the desired\
    \ multiplicity-adjusted p-values.\n\nExample Code 7.3 Mixed-Model of Dose Response\
    \ for neurodeg Data\n\n```\nproc glmix data=neurodeg;\n  class id;\n  model resp=dose*time/solution\
    \ COVB;\n  random intercept time / type=UN subject=id;\n  estimate &m_mod. / adjust=simulate(nsamp=100000\
    \ seed=1) uppertailed;\n```\n\nTable 7.5 Contrast Test Statistics for the neurodeg\
    \ Data\n\n| Model | Test Statistic | Adjusted p-value |\n|---|---|--|\n| $ED_{50}=1.11$\
    \ | 4.56 | <.0001 |\n| Quadratic $\\delta=-0.022$ | 3.68 | 0.0003 |\n| Exponential\
    \ $\\zeta=8.867$ | 1.28 | 0.1826 |\n| Linear | 2.27 | 0.0252 |\n\nIt can be seen\
    \ that all models, apart from the exponential one, achieve a small p-value. Thus,\
    \ there is evidence for the existence of a dose-response effect, with the linear\
    \ and quadratic shape obtaining the highest test statistics.\n\nThe Mod step in\
    \ this example implements a bootstrap model averaging approach. The idea is to\
    \ simulate a large number $b$ of values $\\hat{\\mu}^{(b)}$ from the 5-dimensional\
    \ normal distribution with mean $\\hat{\\mu}$ and covariance matrix $\\hat{\\\
    Sigma}$. For each of the generated bootstrap data sets, each of the four dose-response\
    \ models are fitted to the simulated summaries per group using the generalized\
    \ least squares approach discussed in [4]. That is the function $\\Psi_{m|\\theta_m}=(f_m[d,\
    \ \\theta_m]-\\mu^{(b)})'\\hat{\\Sigma}^{-1}(f_m[d, \\theta_m]-\\mu^{(b)})$ is\
    \ minimized with respect to $\\theta$ for all candidate models. An AIC-type value\
    \ to compare the model adequacy can be calculated by using"
  merge: -1
  pgno: 365
- img_proc: true
  md: "$\\Psi_m(\\hat{\theta}_m) + 2 \\dim(\\hat{\theta}_m)$. At the end one can select\
    \ for each simulated replication the dose-response model that provides the best\
    \ fit and use this to predict the quantity of interest (for example a target dose\
    \ or the dose-response estimate at specific doses). The bootstrapping approach\
    \ is implemented in $\\text{procimal}$, and details can be found in Appendix D.\
    \ In some of the bootstrap resamples for some models the optimization fails with\
    \ a warning message. We suspect this happens for models that cannot fit or are\
    \ inadequate for the current bootstrap resample. In this case these error messages\
    \ had no impact on the overall results.\n\nFigure 7.3 Estimated Dose-Response\
    \ Curve for Slopes of Disease Progression for neurodeg Data one can observe the\
    \ bootstrapped dose-response curve shows a slight unimodality, which is introduced\
    \ based on 5,000 bootstrap samples. One can see that the estimated point for the\
    \ slope at 30mg is slightly smaller than for 10mg and 3mg. Looking at how often\
    \ each model was selected in the bootstrap resamples, one obtains 54% of for the\
    \ model and 46% for the quadratic model. For the neurodeg data set the linear\
    \ and exponential model can clearly be ruled out, but both the as well as the\
    \ quadratic model seem to describe the data adequately. Selecting one model over\
    \ another model in such a situation is potentially problematic, because it does\
    \ not represent the underlying uncertainty adequately. Using a model-averaging\
    \ approach seems more realistic in this example.\n\n**Figure 7.3 Estimated Dose-Response\
    \ Curve for Slopes of Disease Progression for neurodeg Data**"
