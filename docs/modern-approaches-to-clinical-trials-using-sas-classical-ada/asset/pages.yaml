  md: '# 1.3 Emergence of Group Sequential Designs in the 70s and 80s


    While the theory of group sequential design dates back to 1969, actual application
    began in the 1970s [18,19]. Canner notes the early evolution of applying multiplicity-adjusted
    analyses along with an external monitoring board in the Coronary Drug Project
    (CDP) [20]. For the first two years of CDP, investigators were informed of interim
    data by treatment group. Subsequently, perhaps the first external data and safety
    monitoring committee (DSMC) was formed to be the only reviewers of data summary
    by treatment group for the remainder of the trial. This trial also had what we
    might call an executive committee (termed the CDP Policy Board then) that was
    charged with acting on DSMC recommendations. While formal stopping rules were
    not in place, there was an awareness of multiplicity issues associated with multiple
    active treatment groups and analyses at multiple time points, which may have resulted
    in an overall type I error rate on the order of 30% to 35%, if nominal ≥ cutoff
    for a two-sided significance level of 0.05 had been used repeatedly.


    DeMats, Furberg and Friedman note that the Greenberg Report ensured that all cooperative
    groups studied by the National Heart Institute and its successors had a separate
    monitoring committee to review interim results [21, p5]. A commonly cited example
    is the BHAT trial that began in 1978 and employed an O’Brien-Fleming boundary
    for group sequential monitoring of efficacy every 6 months [19]. The trial was
    stopped in 1981 after the O’Brien-Fleming efficacy boundary was crossed at an
    interim analysis.


    Several papers summarize the early data-monitoring practice at one of the National
    Cancer Institute’s cooperative groups, the Southwest Oncology Group (SWOG) [22,23].
    They note that prior to 1984, unblinded interim results were regularly shared
    with study investigators and often published. The philosophy at the time was that
    those responsible for the study should also be involved in the interim evaluations
    of safety and efficacy. Cancer researchers felt that the model of independent
    DMCs used in other institutes was not feasible in trials conducted by the cancer
    cooperative groups [22]. There were noted examples where interim results were
    later reversed and'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'situations where studies results could not be completed due to the public sharing
    of interim results. As a result, starting in 1985, SWOG established a formal DMC.
    While toxicity was still shared with investigators in an unblinded fashion, formal
    group sequential stopping rules for efficacy were implemented using either Haybible-Peto
    or O''Brien-Fleming bounds [24-26]. Interim efficacy results were reviewed by
    the DMC only.


    Jenision and Turnbull provide a brief history of the theory and methods for sequential
    and group sequential designs, including citations for more complete histories
    [27, pp 5-11]. They note the work of Pocock as a key motivator for the use of
    group sequential designs by providing “clear guidelines for the implementation
    of group sequential designs attaining type I error and power requirements” [28].
    The commonly used O''Brien and Fleming stopping rules came shortly thereafter,
    followed by developments that allow more flexible timing of interim analyses,
    such as the spending function methods of Lan and Deets [26,29]. Pampallona and
    Tsiatis use boundary families to allow early stopping based on futility in demonstrating
    superiority of a new therapy over a standard [30]. Pampallona, Tsiatis and Kim
    extend the word of Pampallona and Tsiatis [31].


    The 90s saw aggressive pursuits of drugs to treat patients with the human immunodeficiency
    virus (HIV). The urgency in developing promising medicines provided a strong incentive
    for early monitoring of HIV trials for efficacy. This was supported by the cooperative
    groups and pharmaceutical industry, which was engaged in HIV trials, by patient
    advocacy groups, and by regulators at the FDA [32]. Finkelstein notes, for example,
    that the AIDS Clinical Trial Group #981 initiated in 1989 applied a one-sided
    group sequential boundary based on the Lan-Deets spending function approximation
    to an O''Brien-Fleming design [33].


    One of the authors of this chapter worked at Centocor in the 90s. We share two
    Centocor development programs as an example to illustrate the move to group sequential
    design by an industry sponsor. The example highlights the potential perils of
    inadequate documentation related to interim monitoring and benefits of group sequential
    design [32]. Both programs were to develop monoclonal antibodies to treat conditions
    that had irreversible consequences for patients. The'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'conditions had few treatment options and, therefore, represented an urgent
    unmet medical need. As such, studies that investigated new treatment options merited
    interim monitoring to determine when study objectives had been achieved or if
    risk was excessive. In a pivotal trial for one program, FDA reviewers felt that
    the company had not adequately documented that an interim change in the statistical
    analysis plan was made without incorporating information from unblinded interim
    results and, therefore, asked the company to perform a second pivotal trial. The
    second pivotal trial was unsuccessful when excess mortality was demonstrated at
    its first interim analysis. In a subsequent program, group sequential designs
    were incorporated into trials studying abciximab (a platelet inhibitor) to prevent
    acute ischemic events in patients undergoing coronary interventions. Three trials
    (EPIC, EPILOG, and CAPTURE) were conducted in the abciximab program. Both EPIC
    and EPILOG compared abciximab-containing treatments to a standard therapy while
    CAPTURE was a two-arm trial [34-36]. The treatment regimens studied, particularly
    in the first trial (EPIC), had the potential for both substantial efficacy and
    substantial risk and thus merited interim monitoring for both safety and efficacy.
    EPIC proceeded past interim analyses and demonstrated efficacy at the final analysis.
    EPILOG and CAPTURE were stopped early due to demonstrated efficacy at interim
    analyses. These trials were all performed as industry collaborations with academic
    research organizations who were experienced in randomized clinical trials. All
    trials used independent external DMCs. Innovations to accommodate comparisons
    of multiple experimental arms were achieved with modifications of the freely available
    FORTRAN programs from the University of Wisconsin [37].


    Many statisticians found career opportunities in the pharmaceutical industry in
    the 90s. The influx of statisticians to the industry greatly expanded in-house
    statistical support to clinical trials. Statisticians'' presence and the establishment
    of ICH increased the rigor of industry-sponsored clinical trials. In addition
    to contributing to the design, conduct, analysis, and interpretation of clinical
    trials, pharmaceutical statisticians also engaged in methodology research to help
    make the drug development process more efficient.


    Group sequential designs are covered extensively in Chapter 2.'
