    \  set postout;\n  proportion=(exp(gammal)<<delta&)\nrun;\n\nproc means data=indicator\
    \ n mean noprint;\n  var proportion;\n  output out=outpower mean=pfhat;\nrun;\n\
    \ndata outpower;\n  set outpower;\n  simid&m;\n  keep simid&m pfhat;\nrun;\n\n\
