    \ We apply Bayes' theorem to calculate the posterior model probability of $M_k$,\n\
    \n```\n$P(M_k|D) = \\frac{P(D|M_k)P(M_k)}{\\sum_{i=1} P(D|M_i)P(M_i)}$\n```\n\n\
    where $P(D|M_k)$ is the marginal likelihood of model $M_k$ obtained by integrating\
    \ out $a_k$ with respect to the corresponding prior distribution,\n\n```\n$P(D|M_k)\
    \ = \\int P(a_k, M_k)f(a_k|M_k)da_k$.\n```\n\nThe BMA estimate of the toxicity\
    \ probability at dose level $j$ is then given by a weighted average,\n\n```\n\
    $\\pi_j = \\sum_{k=1}^K \\tilde{\\pi}_{kj}P(M_k|D), \\quad j=1, \\dots, J$,\n\
    ```\n\nwhere $\tilde{\\pi}_{kj}$ is the posterior mean of the toxicity probability\
    \ at dose level $j$ under model $M_k$,\n\n```\n$\\tilde{\\pi}_{kj} = \\int p_{kj}\
