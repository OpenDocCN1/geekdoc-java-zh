  md: "# 2.4.2 P-value or Haybittle-Peto Boundaries\n\nThe P-value or Haybittle-Peto\
    \ boundaries are used for early rejection of the null hypothesis. It was first\
    \ proposed by Haybittle [7]. These boundaries are calculated by pre-specifying\
    \ a fixed rejection boundary value for the p-value or the z-statistic for the\
    \ first $j-1$ stages. For example, we can specify a small p-value $p_1$ for $j-1$\
    \ as a stopping criterion. If the first observed p-value in the sequence of the\
    \ first $j-1$ p-values appears to be smaller than $p_1$, then the trial will be\
    \ stopped to declare rejection of the null hypothesis. Otherwise, the trial will\
    \ go to the final stage (i.e. $j$th stage) and a final p-value, $p_2$ is computed\
    \ in such a way that the overall type I error is controlled at the $\\alpha$ level.\
    \ If we denote the $p$th quantile of the standard normal distribution as $z_p$,\
    \ then we know $1-\\Phi(z_p)=p$. In the one-sided setting, the trial will be stopped\
    \ at the $j$th interim stage if $Z(l_j)\\geq z_{p_1}$ or if $(l_j) \\geq \\sqrt{t_{ij}}z_{p_1}$.\
    \ Otherwise, the trial will be successful in the final stage only if $Z(l_j)\\\
    geq z_{p_2}$ or if $(l_j) \\geq \\sqrt{t_{ij}}z_{p_2}$. Given the pre-specified\
    \ $p_1$, the value of $p_2$ needs to preserve the type I error and it can be obtained\
    \ by solving the following equation:\n\n> $1-P_{\\eta=0}(S(l_1)<\\sqrt{t_{1j}}z_{p_1}\
    \ \\cdots S(l_{j-1})<\\sqrt{t_{(j-1)j}}z_{p_1}, S(l_j)<\\sqrt{t_{ij}}z_{p_2})=\\\
    alpha$\n\nwhere $P_{\\eta=0}(\\cdot)$ represents the probability evaluated under\
    \ the null joint distribution, that is, the distribution when $\\eta=0$. The solution\
    \ of $p_2$ can be obtained using a numerical method for recursive integration.\
    \ Once the value of $p_2$ is determined, the maximum information $l_j$ needed\
    \ is obtained by invoking the same numerical method to solve for the drift parameter\
    \ $\\eta_1$ in the following equation under the specified target power of $1-\b\
    eta$:\n\n```\n$P_{\\eta=\\eta_1}(S(l_1)<\\sqrt{t_{1j}}z_{p_1} \\ \\cdots S(l_{j-1})<\\\
    sqrt{t_{(j-1)j}}z_{p_1}, S(l_j)<\\sqrt{t_{ij}}z_{p_2})=\\beta$.\n```\n\nUsing\
    \ this value of drift parameter $\\eta_1$, evaluated under alternative hypothesis,\
    \ we can evaluate $l_j$ using\n\n![](img/f4ec2665c3484c528370923aeb5cb99f_92_0.png)"
