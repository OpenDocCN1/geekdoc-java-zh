  md: '# 2.2 Examples of Classical Fixed-Sample Designs


    Before we develop the theories of group sequential procedures in the next section,
    we will describe four examples of clinical trials that were planned using the
    classical fixed-sample design. However, these trials can be modified into new
    designs that use the group sequential methods. Detailed interpretations will accompany
    programming codes to introduce the different approaches and to compare designs
    with varying parameters. Readers can adapt these codes to further explore design
    specifications.


    # Example 1: Pravastatin Therapy in Children with Familial Hypercholesterolemia


    Familial hypercholesterolemia (FH) is a genetic disorder characterized by high
    cholesterol levels in the blood, specifically very high levels of low-density
    lipoprotein cholesterol (LDL-C). LDL-C is an undesirable type of cholesterol and
    therefore, FH increases the risk of early cardiovascular disease. Accumulation
    of LDL-C in FH leads to deterioration of the vascular morphology and gives rise
    to increased intima-media thickness (IMT) of the carotid arteries. As a result,
    myocardial ischemia coronary artery stenosis have been documented in young adults
    with this disorder. A clinical trial was designed to answer questions regarding
    the long-term (2 years) efficacy and safety of a cholesterol-lowering medication,
    pravastatin [13].


    In this clinical trial, children aged between 8 and 18 years with FH were recruited
    from a medical center. The intervention of interest was pravastatin 20mg taken
    daily for children younger than 14 years or 40mg taken daily for those who were
    14 years or older. This trial was placebo-controlled and double-blinded with children
    randomized to either pravastatin treatment or placebo. These children followed
    regularly over a period of 2 years. The primary outcome was defined as a change
    from baseline mean carotid IMT, comparing pravastatin and placebo groups after
    2 years follow-up. The alternative hypothesis was that the pravastatin group has
    a greater reduction in carotid IMT from baseline than the placebo group. Under
    a classical fixed-sample design, assuming equal allocation, we can calculate the
    sample size per arm as follows:'
  merge: -1
  pgno: 69
- img_proc: true
  md: "```\n$n_T = n_C = \\frac{2(z_a+z_g)^2\\sigma^2}{\\delta^2} \\quad (2.1)$\n\
    ```\n\n$n_T$ and $n_C$ are the sample sizes for the pravastatin and placebo, respectively.\
    \ $z_a$ is the $(1-\\alpha)100\\%$ percentile of the standard normal distribution,\
    \ and similarly $z_\beta$. The parameter $\\sigma$ is the standard deviation of\
    \ the primary outcome assumed known for both groups, and $\\delta$ is the treatment\
    \ difference in the primary outcome that we are interested in detecting. In this\
    \ case, we allow a one-sided type rate $\\alpha=0.025(z_a=1.96)$ and power of\
    \ $90\\%$ such that $\beta=0.1(z_\beta=1.28)$. Samples of measurements with without\
    \ FH were obtained to provide initial estimates for $\\sigma$ which was $0.045$\
    \ mm and the treatment difference $\\delta$ was $0.02$mm. Therefore, the sample\
    \ size per arm to achieve the target statistical power of $90\\%$ is $n_T=_C=106$.\
    \ The results of this trial are tabulated in Table 2.1 and Example Code 2.1 below\
    \ using the exact two-sample Student's $t$-test. In SAS, `proc power` adjusts\
    \ the sample size slightly upwards to $n_T=n_C=108$ for the loss of degree of\
    \ freedom in estimating the standard deviation in the Student's $t$-test.\n\n\
    # Example Code 2.1 Sample Size Calculation for Familial Hypercholesterolemia\n\
    \n```\nproc power;\ntwosamplemeans test=diff\nmeandiff=-0.02 stddev=0.045\nalpha=0.025,\
