    Carcinoma


    It has been postulated that drugs that inhibit the mTOR pathway may help advanced
    progressive HER2-positive breast cancer patients with resistance to trastuzumab.
    Everolimus, as an mTOR inhibitor, has been shown to potentiate the effect of trastuzumab.
    Dose response of combining everolimus and trastuzumab was established in a previous
    phase II study with an estimated 34% clinical complete response [15]. A confirmatory
    randomized, placebo-controlled trial was designed to test'
  merge: -1
  pgno: 71
