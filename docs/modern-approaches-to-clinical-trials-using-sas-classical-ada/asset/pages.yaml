  md: "# 10.3.4 Efficient Randomized-Adaptive Design\n\nHu and co-authors in [50]\
    \ considered the following question: Can a RAR procedure be found that preserves\
    \ randomness, and can target any pre-specified allocation and has minimal variability?\
    \ They proposed a class of efficient randomized-adaptive designs (ERADE) for which\
    \ the $(m+1)$ patient is randomized to $E$ with probability\n\n```\n$\\phi_{m+1}\
    \ E = \\begin{cases} \\hat{\\phi}_m, & N_E(m) | m > \\hat{\\phi}_m \\ \\hat{\\\
    phi}_m, & N_E(m) | m = \\hat{\\phi}_m \\ 1-\\zeta(1-\\hat{\\phi}_m), & N_E(m)\
    \ | m < \\hat{\\phi}_m \\end{cases}$\n```\n\nwhere $0 \\le \\zeta \\le 1$ is a\
    \ user-defined parameter that controls the degree of randomness(\\zeta=0$ is most\
    \ deterministic and most random). Hu and co-authors recommended setting $\\zeta$\
    \ between 0.4 and 0.7 [50]. ERADE is an extension of the biased-coin design [5]\
    \ which is used to target equal allocation.\n\nThe theoretical properties of ERADE\
    \ are similar to those of DBCD: both sample proportions and estimators are strongly\
    \ consistent and asymptotically normal. However, a fundamental difference between\
    \ the two designs is that the allocation function for ERADE is discrete, whereas\
    \ for DBCD it is continuous in $\rho$. In fact, ERADE is equivalent to DBCD with\
    \ $\\gamma \\to \\infty$ and it is an asymptotically best procedure [51]. The\
    \ sample proportion $N_E(m)/m$ for ERADE is asymptotically normal with mean $\\\
    rho$ and asymptotic variance $(\\frac{\\partial \\rho}{\\partial E})^2 \\frac{\\\
    rho P_E}{\\rho} + (\\frac{\\partial \\rho}{\\partial C})^2 \\frac{\\rho P_C}{1-\\\
    rho}$, which is the lower bound on the variance of a RAR procedure targeting allocation\
    \ $\\rho$."
  merge: -1
  pgno: 488
- img_proc: true
  md: "# 10.3.5 Theoretical Comparison of Various RAR Designs\n\nHu and Rosenberger\
    \ in [34] derived a relationship between optimality, variability and power that\
    \ can be used to facilitate a comparison among various RAR designs. They considered\
    \ a second-order Taylor series expansion of a non-centrality parameter of the\
    \ chi-square test following RAR, and showed that three important factors that\
    \ have an impact on power of the test are the allocation target for a fixed design,\
    \ the speed of convergence to the target, and the variability of the sample allocation\
    \ proportion. For RAR procedures with the same allocation target, only variability\
    \ of the sample proportions can be compared. A procedure with small variability\
    \ is desirable. Hu and co-authors in [51] defined an asymptotically best RAR procedure\
    \ as one that the smallest possible asymptotic variance of $N_E(m)/m$. A version\
    \ of Theorem 1 of [51] for binary outcome trials can be formulated as follows:\n\
    \n**Theorem 1** Consider a two-arm binary outcome trial using a RAR procedure\
    \ with target allocation $\rho = \rho(\rho_E, \rho_C)$. Suppose the following\
    \ regular conditions hold:\n\n+   1. $\rho_E, \\rho_C \\in(0,1)$\n\n+   2. $N_E(m)/n\
    \ \\rightarrow \\rho \\in(0,1)$ almost nearly\n\n+   3. $\\sqrt{N_E(m)/n-\\rho}\
    \ \\rightarrow N(0, \\sigma^2)$ in distribution, where $\\sigma^2 > 0$.\n\nThen\
    \ we have $\\sigma^2 \\geq B(\\rho_E, \\rho_C) = (\\frac{\\partial \\rho}{\\partial\
    \ \\rho_E})^2 \\frac{\\rho_E \\rho_C}{\\rho} + (\\frac{\\partial \\rho}{\\partial\
    \ \\rho_C})^2 \\frac{\\rho_E \\rho_C}{1-\\\rho}$. The quantity $B(\\rho_E, \\\
    rho_C)$ is called the lower bound for the variance of RAR procedures with allocation\
    \ target $\\rho$. A RAR procedure that attains the lower bound is called an asymptotically\
    \ best RAR procedure.\n\nFor illustration, let us consider three RAR designs targeting\
    \ the RSIHR allocation $\\rho = \\rho_{RSIHR}$: 1) SMLE procedure (Section 10.3.2),\
    \ 2) DBCD with $\\gamma=2$ (Section 10.3.3), and 3) ERADE (Section 10.3.4). Clearly,\
    \ $\\rho = \\rho_{RSIHR}$ is a twice continuously differentiable function of $(\\\
    rho_E, \\rho_C)$ with"
  merge: -1
  pgno: 489
- img_proc: true
  md: "$\\frac{\\partial \rho_P}{\\partial p_E} = \\frac{\rho(1-\rho_P)}{2p_E}$ and\
    \ $\\frac{\\partial \rho_P}{\\partial p_C} = -\\frac{\rho(1-\rho_P)}{2p_C}$. One\
    \ can easily show that the lower bound for the variance of $N_E(m)/m$ (the asymptotic\
    \ variance of ERADE) is\n\n```\n$\\sigma^2_{ERADE} = B(p_E, p_C) = \\frac{1}{4(\\\
    sqrt{p_E}+\\sqrt{p_C})^2 \\left( \\frac{\rho_{GE}}{\\sqrt{p_E}} + \\frac{\rho_{QC}}{\\\
    sqrt{p_C}} \right)}. (10.9)$\n```\n\nThe asymptotic variance of DBCD$(\\gamma)$\
    \ (Section 10.3.3) is\n\n```\n$\\sigma^2_{DBCD(\\gamma)} = \\frac{\\sqrt{\rho_{PC}}}{(1+\\\
    gamma)(\\sqrt{p_E}+\\sqrt{p_C})^2} + \\frac{2(1+\\gamma)}{1+2\\gamma}\\sigma^2_{ERADE}.\
    \ (10.10)$\n```\n\nThe asymptotic variance of the SMLE procedure, $\\sigma^2_{SMLE}$,\
    \ is obtained by calculating $\\sigma^2_{DBCD(\\gamma)}$ with $\\gamma=0$. Clearly,\
    \ $\\sigma^2_{SMLE} > \\sigma^2_{DBCD(\\gamma=2)} > \\sigma^2_{ERADE}$:\n\nFigure\
    \ 10.2 is a plot of asymptotic variance $N_E(m)/m$ of three RAR designs (SMLE,\
    \ DBCD$(\\gamma)$, and ERADE) for a range of scenarios when $p_C=0.4$ and $0.2\
    \ \\le p_E \\le 0.9$. Interestingly, the variance is monotone decreasing as $p_E$\
    \ is increasing from 0.2 to 0.9. For SMLE the variance is decreasing from 0.6\
    \ to 0.38; for DBCD$(\\gamma=2)$ it is decreasing from 0.26 to 0.12; and for ERADE\
    \ it is decreasing from 0.18 to 0.06. For a completely randomized design (CRD)\
    \ targeting 1:1 allocation (a non-adaptive procedure for which every allocation\
    \ is made independently with probability 1/2), the variance is constant, 0.25,\
    \ for any values of $p_C$ and $p_E$. As such, in the considered scenarios both\
    \ DBCD$(\\gamma=2)$ and ERADE are overall less variable than CRD.\n\n# Figure\
    \ 10.2 Asymptotic Variance of the Sample Proportion for Three RAR Designs"
