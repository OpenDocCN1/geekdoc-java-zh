  md: '# 4.7.2 Illustrative Examples


    # 4.7.2.1 Evaluating Cardiovascular Risk


    In this section, we illustrate the BMED macro discussed in the previous section.
    As an illustrative example, we use the motivating case study for designing a phase
    II/III development program of a new T2DM therapy. A more detailed setting of this
    illustrative example can be found in [10,11].


    Several authors considered a hypothetical drug development program for treating
    type 2 diabetes mellitus [10-12]. The program includes eight randomized control
    efficacy superiority trials and one large randomized CV outcome non-inferiority
    trial. For those traditional diabetes HbA1c superiority trials, the target subjects
    are at low or moderate CV risk with an assumed annualized event rate of 1.2%.
    On the other hand, for the non-inferiority trial, the subjects are at high risk
    with an assumed annualized event rate of 1.5% as the FDA guidance advocates the
    inclusion of such a population. A detailed description of the data can be found
    in [10 -12].


