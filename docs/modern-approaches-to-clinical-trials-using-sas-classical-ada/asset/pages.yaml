  md: '# 10.6 Additional Considerations'
  merge: -1
  pgno: 505
- img_proc: true
  md: '# 10.6.1 More Than Two Treatments and Non-Binary Outcomes


    Many RCTs involve more than two treatment arms. For instance, in a phase II dose
    ranging study, the treatment arms may be a placebo and/or an active control and
    several doses of an investigational drug. The study objectives may include estimation
    of various treatment contrasts and testing hypotheses of equality of treatment
    effects. Frequently, the optimal allocation ratio is unequal across treatment
    arms [53]. As noted in [33], “...the adaptive randomization shines brightest in
    complicated multi-arm settings,” and indeed, optimal RAR designs are expected
    to provide more substantial gains over equal randomization in trials with more
    than two treatment arms (e.g. by placing more patients at the “most informative”
    dose levels). A general framework for finding optimal allocation designs to minimize
    a weighted sum of treatment sample sizes subject to constraints on power in a
    multi-arm setting was proposed by Tymofyev and co-authors in the context of a
    binary outcome trial [17]. Subsequently, their approach was extended to multi-arm,
    multi-objective clinical trials with normal and time-to-event outcomes [18,19,54,55].
    For trials where the primary objectives involve estimation of multiple treatment
    contrasts, one can use the $D_{\Delta}$-optimal allocation [56]. For implementing
    optimal allocation in a multi-arm trial, one can use the DBCD procedure [48] or
    an immigrated urn model [26]. Both the DBCD and the immigrated urn model are RAR
    designs that yield consistent and asymptotically normal estimators and sample
    allocation proportions under widely satisfied conditions.'
  merge: -1
  pgno: 506
- img_proc: true
  md: '# 10.6.2 Delayed Response


    One assumption for developing the theory of RAR is that each patient’s outcome
    is instantaneous. In practice, patient outcomes are measured at certain time points
    after the treatment has been administered. If the recruitment period is long enough
    and the outcomes are observed relatively quickly after randomization, RAR can
    still be applied successfully. This was justified theoretically in [57,58]. Simulation
    studies show that when approximately 60% or more of the patient outcome data are
    observed during the recruitment phase and used for purposes of adaptation, the
    large-sample properties of RAR designs are unaffected by delayed response [18,59].
    However, if a delay in observing response is significant, convergence to the target
    allocation can be slowed down, which can diminish the advantages of RAR.'
  merge: -1
  pgno: 507
- img_proc: true
  md: '# 10.6.3 Misclassified Response


    RAR requires access to accumulating primary outcome data from patients in the
    trial. These data must be of excellent quality to enable accurate estimation and
    adaptation throughout the trial. In some trials, binary responses may be misclassified
    and this may introduce bias into the design. Li and Wang in [60] considered a
    problem of finding optimal allocation for RAR designs where responses are subject
    to misclassification. While their approach can be useful for mitigating certain
    biases, efforts should always be made to ensure a high quality assessment of data
    in RAR trials.'
  merge: -1
  pgno: 508
- img_proc: true
  md: '# 10.6.4 Time Trends


    In some clinical trials there may be systematic trends in unknown prognostic factors
    over time. For instance, the earliest enrolled patients may have a worse prognosis
    than the patients enrolled later due to changing aspects in the disease, standards
    of care, and other factors. One of the major criticisms of RAR is that it can
    lead to biased estimates and an inflated probability of type I error in the presence
    of time trends [35]. Several approaches to mitigate these issues have been proposed
    in the literature. The authors of [61,62] suggested applying RAR in blocks such
    that randomization probabilities are held constant within each block of patients
    but change adaptively between blocks. The Simon and Simon in [63] developed randomization
    tests to analyze data following RAR trials. Their approach ensures control of
    the type I error rate in the presence of time trends. Hu and Roseberger in [64]
    proposed applying weighted likelihood techniques to reduce bias and mean squared
    error introduced by time trends. Finally, if covariates that cause heterogeneity
    are known in advance, one can consider using covariate-adjusted, response-adaptive
    randomization designs [14,65].'
  merge: -1
  pgno: 509
