  md: '# 10.1 Introduction'
  merge: -1
  pgno: 465
- img_proc: true
  md: '# 10.1.1 Randomized Clinical Trials


    The most common goal of a randomized clinical trial (RCT) is to compare the effects
    of one or more experimental treatments versus control treatment (standard of care)
    in the target patient population. Randomization plays a fundamental role in the
    RCT design. By introducing a deliberate element of chance into the assignment
    of treatments, one increases the likelihood that important patient characteristics
    (known and unknown) that may affect the outcome of interest are similarly distributed
    across the treatment groups, and therefore, any observed treatment difference
    should be attributed to the treatment effects, not the effects of study patients
    [1]. Importantly, randomization by itself is not sufficient to achieve the goals
    of a RCT and it should be complemented by other techniques such as masking, allocation
    concealment, stratification or adjustment of randomization for covariates (when
    appropriate), covariate-adjusted analysis and the careful conduct of the trial
    [2].


    When designing an RCT, it is essential to formulate the primary scientific question
    to be answered in the trial. This requires careful consideration of the disease,
    the target patient population, the choice of experimental and control treatments,
    and the primary outcome variable. This primary question is frequently questioned
    in the form of testing a hypothesis of the difference of treatment effects. The
    trial should have sufficient sample size to provide a reliable answer to the primary
    question [3]. One can also include additional research questions that are less
    important but still within the scope of the trial) as secondary objectives.


    Once the trial objectives are formalized, there are several important statistical
    considerations, including but not limited to: 1) the choice of the target allocation
    ratio; 2) the choice of the randomization procedure; 3) the choice of the study
    sample size; 4) the choice of statistical methodology for data analysis. Let us
    consider the first two items in more detail. Many RCTs employ equal allocation
    designs, such as 1:1 allocation for a two-arm study. Equal allocation is frequently
    recommended in practice because it often maximizes the power of statistical tests
    and it is also consistent with the view of clinical equipoise at the beginning
    of the trial [3, pg. 98]. A number of'
  merge: -1
  pgno: 466
- img_proc: true
  md: 'randomization procedures for implementing equal allocation are available. These
    include complete (simple) randomization, permuted block randomization, the maximal
    procedure [4], and biased coin designs [5]. On the other hand, there are a number
    of situations where a fixed unequal allocation may be preferred. For instance,
    the 2:1 allocation, where twice as many patients are assigned to the experimental
    treatment compared to the control, may have an ethical advantage over the 1:1
    allocation if the experimental treatment turns out to be beneficial [6,7]. Unequal
    allocation may also be preferred for gaining more information on the safety profile
    of the experimental treatment, for economic efficiency, or for accounting for
    possible differential drop-outs of study patients [8]. Randomization procedures
    to implement fixed unequal allocation include, for example, permuted block designs
    and brick trunk randomization [9].


    In some trials, the choice of an allocation ratio is not straightforward. For
    instance, if variability of the outcome is different across the treatment arms,
    equal allocation may not be an optimal choice. In a two-arm trial, the allocation
    minimizing variance of the estimated treatment difference (Neyman allocation)
    is proportional to the standard deviations of the outcome are frequently unknown
    at the outset, how should one go about designing a trial in this case? On the
    other hand, at the trial design stage there may be some prior evidence (albeit
    definitive) suggesting that the experimental treatment will be an improvement
    over standard of care. In this case, the true equipo no longer exists and an investigator
    may want to consider a design with, say, 2:1 or 3:1 allocation ratio favoring
    experimental treatment. However, why a ratio of 2:1 or 3:1? Such choices are based
    on the investigator''s expectation of the treatment effect which is a judgment
    call. These examples of clinical trials where statistical efficiency and ethics
    are of central concern highlight that fixed equal or unequal allocation designs
    lack flexibility. This motivates the introduction of response-adaptive randomization
    into the trial design.'
  merge: -1
  pgno: 467
- img_proc: true
  md: '# 10.1.2 Response-Adaptive Randomization


    With response-adaptive randomization (RAR), treatment randomization probabilities
    are modified according to the history of treatment assignments and responses from
    patients in the trial to achieve some pre-determined experimental objective (e.g.
    to achieve an allocation ratio that is desirable from the standpoint of statistical
    efficiency and ethics), while maintaining validity and integrity of the trial
    results. For instance, an objective may be to reduce the number of treatment failures
    with no loss of statistical power [10].


    RAR has a long history in the biostatistics literature [11,12]. However, its use
    in practice has been limited, mainly due to a negative experience with a poorly
    designed ECMO trial in the 1980s [13]. At the same time, in the past decades research
    on RAR has advanced substantially—many new methodologies have various RAR designs
    have been established. The monograph by Hu and Rosenberger provides a modern theory
    of RAR in clinical trials [14]. Recent statistical research has focused on the
    development of optimal RAR procedures that can simultaneously address the objectives
    related to statistical efficiency and ethics. Optimal RAR procedures should be
    contrasted with heuristic RAR procedures such as the randomized-the-winner rule
    [12] or Bayesian adaptive randomization [15]. The former procedures target explicitly
    the objectives of statistical efficiency and ethics, whereas the latter ones are
    primarily concerned with assigning more patients to the empirically better treatment.


    It is instructive to review clinical trial scenarios where RAR can be applied
    with the most benefit. Palmer and Rosenberger in [16] provide an excellent discussion
    of the delicate balance between individual ethics (doing what is best for every
    subject in the trial) and collective ethics (doing what is best for future patients
    who stand to benefit from the trial results). They consider two dimensions of
    disease characteristics—severity and prevalence—and suggest that individual ethics
    should definitely outweigh collective ethics when disease is severe or life threatening
    and when disease is rare or very rare. Indeed, when disease is (very) rare, the
    majority of patients with the disease will be'
  merge: -1
  pgno: 468
- img_proc: true
  md: 'treated within trial and very few patients will be treated outside the trial.
    Also, if disease outcome is severe or life threatening, then even modest reduction
    in treatment failures in the trial is desirable and can be viewed as a significant
    contribution from an ethical standpoint. RAR is aligned with the principle of
    individual ethics, it can be an attractive research design in trials for rare
    diseases and trials with grave outcomes.


    The ethical objective is one reason for using RAR. Another important reason is
    the pursuit of statistical efficiency. By applying RAR in trials with heteroscedastic
    outcomes, one can target allocations that lead to more accurate estimates of the
    treatment effects or more powerful tests compared to equal randomization [17-19].
    In the draft considering adaptive designs, the FDA provides the following view
    on RAR: “...more recently the approach has been revised to suit the objective
    of dose-response evaluation” and it is “...particularly valuable for exploratory
    studies” [20]. Indeed, RAR can be used in phase II dose-ranging studies to increase
    allocation frequency at dose levels that carry the information on the shape of
    a dose-response curve or at dose levels of special interest. One good example
    where these ideas were applied is the ASTIN trial, an adaptive dose-ranging study
    in acute ischemic stroke which evaluated 15 different levels and the placebo,
    with the goal to determine the dose producing 95% of the maximum treatment effect
    (ED95) [21]. The ASTIN study used Bayesian RAR design where the randomization
    probability to any dose level was set proportional to posterior probability that
    the given dose is the ED95. The doseresponse curve was found to be flat and the
    study was terminated for futility, thereby achieving substantial savings in the
    cost and patient resources.


    By discussing various RAR designs, it is instructive to state key assumptions
    for RAR trials [2,22]:


    +   - “Statement of the obvious”: Better treatment will actually perform better
    in the trial.


    +   - The treatment with better outcome does not cause serious toxicity.


    +   - Study outcomes should be observable relatively quickly, and the patient
    inclusion rate should be relatively low to enable adaptations'
  merge: -1
  pgno: 469
- img_proc: true
  md: 'in the design.


    +   - Data must be of excellent quality to enable accurate estimation and adaptation
    throughout the trial.


    +   - The disease is stable over time (there is no drift in patient characteristics).


    +   - The trial is carefully planned with extensive simulations run under different
    experimental scenarios.


    Clearly, RAR designs are more complex experiments and require more upfront planning
    than designs with fixed-schedule randomization [2].'
  merge: -1
  pgno: 470
- img_proc: true
  md: '# 10.1.3 A Classification of Response-Adaptive Randomization Designs


    # 10.1.3.1 RAR Urn Models


    The FDA draft guidance on adaptive designs classifies RAR methods as "adaptive
    study designs whose properties are less well understood" [20]. Indeed, there is
    a limited number of trials which successfully implemented RAR and, to our knowledge,
    none of the RAR trials have been run in a confirmatry (phase III) setting. However,
    as the knowledge on statistical properties, merits, and limitations of RAR is
    increasing, it is likely that more trials using RAR will be performed in the future
    [2,23]. In this subsection we briefly discuss three types of RAR designs: 1) RAR
    urn models, 2) Bayesian adaptive randomization, and 3) optimal RAR procedures.
    In terms of maturity levels, the first two can be viewed as "established methods"
    with some examples of real-life applications, whereas the third type includes
    the procedures whose potential is yet to be demonstrated in practice.


    Urn models provide a useful probabilistic mechanism for implementing RAR in clinical
    trials [24]. The most famous RAR urn model is the randomized play-the-winner rule
    (RPWR), developed in 1978 by Wei and Durham [12]. The method assumes a two-arm
    comparative trial with binary outcomes, where a patient''s treatment assignment
    is determined by randomly drawing a ball from the urn, and the urn composition
    is sequentially updated based on the outcomes from previous patients in the trial
    such that representing more successful treatment are chosen more frequently. The
    RPWR has a heuristic appeal of assigning fewer patients to the less successful
    therapy—the limiting allocation proportion of study students assigned to a given
    treatment is inversely proportional to the failure rate of that treatment. However,
    such allocation is not optimal in terms of any statistical criterion (in particular,
    statistical power with this approach may be lower than 1:1 allocation). The RPWR
    was used to design a pediatric trial of extracorporeal membrane oxygenation (ECMO),
    which compared the ECMO therapy versus the conventional therapy [13]. At the outset
    there was a strong ethical rationale for implementing a skewed'
  merge: -1
  pgno: 471
- img_proc: true
  md: 'allocation in favor of the ECMO arm. In the actual trial, the RPWR stopped
    after 12 infants were randomized (one infant was randomized to the conventional
    therapy and died, and 11 infants were randomized to ECMO treatment and all survived).
    As such, the study failed it did not provide conclusive results about the relative
    merits of the two therapies. According to the modern theory of RAR, the failure
    of the ECMO trial can be explained by the trial''s small sample size, the RPWR''s
    high variability, and the dependence on the initial composition of the balls (initially
    the urn contained one ball of each type, and after several assignments the urn
    composition became extremely skewed in favor of the ECMO arm, leaving almost no
    chance for the conventional therapy to be chosen). Despite this experience, the
    ECMO trial is a good setting where RAR designs with robust statistical properties
    could have been used. One method that could have been beneficial in this setting
    is the drop-the-loser, an urn design with the same limiting allocation as the
    RPWR, but with much lower variability and higher speed of convergence to the target
    allocation [25]. Many other urn models with established statistical properties
    available; refer to §10.5 of [22], Chapter 4 of [14], and [26] for further details.


    # 10.1.3.2 Bayesian Adaptive Randomization


    Bayesian adaptive randomization, originally proposed by Thompson in [27], is another
    heuristic approach to facilitate RAR. Let $p_E$ and $p_C$ denote the success probabilities
    for experimental (E) and control (C) treatments, respectively. Assume that $p_E$
    and $p_C$ follow independent beta distributions, and the posteriors of $p_E$ and
    $p_C$ are updated sequentially by accumulating patient outcome data. The current
    patient is randomized between treatments E and C with probabilities $\lambda_E
    = P(p_E > p_C|data)$ and $\lambda_C = 1 - \lambda_E$. In other words, the current
    patient is assigned with higher probability to the treatment that is viewed more
    successful given current data. Thall and Wathen in [15] noted that such a randomization
    procedure, while holding ethical promise, can be highly variable due to the random
    nature of $\lambda_E, \lambda_C$. The authors suggested stabilizing the treatment
    allocation probabilities as follows:


    ```

    $\lambda_E = \frac{\{Pr(p_E > p_C|data)\}}{\{Pr(p_E > p_C|data)\}+\{Pr(p_E < p_C|data)\}}
    \text{ and } \lambda_C = 1-\lambda_E$

    ```'
