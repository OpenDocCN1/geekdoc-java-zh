  md: '# 8.5 Summary


    The Bayesian model is a flexible tool that can be used to better understand the
    dose response. In some cases, it may converge where a traditional maximum likelihood
    model may not converge [2]. Moreover, there may be examples where the maximum
    likelihood model converges but estimates for the parameters as ED50 may be nonsensical.
    In such situations, a Bayesian analysis may yield robust estimates of the model
    parameters. Like all Bayesian analyses, the results are dependent on the assumed
    priors, so careful consideration should be given to the center and spread of the
    prior distribution. For clinical trials, this means that the prior range should
    make biological and/or clinical sense. In small studies or studies with few doses,
    frequentist estimation utilizing an model may not yield robust estimates [2].
    A Bayesian model could be explored in these cases to see if the convergence properties
    to support drug registration, the agency is open to Bayesian techniques of analysis
    and it reiterates the importance of Bayesian dose-response analysis [1]. Bayesian
    inference is particularly well suited to clinical trial development because prior
    clinical and pre-clinical studies may be included in the estimation of the effect
    of the most recent trial, though reconciliation may be required if there are variable
    effects from trial to trial. Being able to change the prior information also provides
    an opportunity to assess the robustness of the conclusions that may be drawn for
    the current study.'
  merge: -1
