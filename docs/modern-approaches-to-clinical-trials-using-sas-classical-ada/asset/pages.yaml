    # 3.3.3.3 Example of the CHW Method


    Let us consider a hypothetical two-arm trial with equal allocation to be designed
    to test the efficacy of an experimental new treatment compared to a control, which
    is also the standard of care. The primary endpoint is a binary outcome with a
    higher rate indicating improvement of the disease state. We denote $p_t$ as the
    rate of response in the treatment and $p_C$ as the rate of response in the control
    arm. The control treatment is based on findings from previous studies and is expected
    to have a response rate of 9%, while it is hypothesized that the new experimental
    treatment is expected to increase the response by 40%. Though an improvement of
    40% is very desirable, in practice, even an improvement of 32% has clinical value.
    Hence, the sponsor would like to have an insurance policy to cover for improvement
    in range of clinical relevance.


    While designing this study, we consider a few design options including a classical
    design (fixed sample size), a group sequential design, and an adaptive design
    with sample size re-estimation. There are pros and cons for each of the design
    options; however, we specifically explore scenarios under which adaptive design
    with sample size re-estimation would be beneficial.'
