    distribution: It is typically parameterized by a scale parameter $\lambda$ and
    shape parameter $\alpha$, neither of which is easily interpretable. The purpose
    of interpretability, the model could be re-parameterized in terms of the median
    time to event $\mu = \log 2^{1/\alpha}$ and $\alpha$, and then use $\mu$ as an
    interpretable dose-response parameter.


    Let $\mu$ denote the function of estimated dose-response parameters under an analysis-of-variance
    (ANOVA) parameterization, obtained using the appropriate estimation method for
    the generic parametric model above via maximum likelihood (ML), generalized estimating
    equations, partial likelihood, the key assumption needed for the general version
    of MCP-Mod to work is that the response estimates $\hat{\mu}$ at the doses are
    asymptotically multivariate normally-distributed with covariance matrix $\Sigma$.
    This approximation has been shown to hold for most parametric estimation problems,
    such as generalized linear models, parametric time-to-event models, mixed-effects
    models, etc. The MCP step consists of specifying a set of candidate models for
    the dose-response relationship $\mu(d)$. Similar to the original MCP-Mod approach,
    each of the candidate model shapes determines an optimal contrast for a trend
    test to evaluate the dose-response model signal. The optimal contrasts are applied
    to the previously described ANOVA-type estimates $\hat{\mu}$, with the associated
    asymptotic distribution used for implementing the corresponding tests (i.e., critical
    values and p-values). It can be shown that the (optimal) contrast for testing
    the hypothesis $c^*_\mu = 0$ is proportional to $\Sigma^{-1/2}(\hat{\mu} - \mu(d))^T\Sigma^{-1/2}\dot{\mu}(d)$,
    which generalizes the formula


    given in 7.2.1 Generic MCP-Mod Approach [4]. From the formula it can be seen that
    $\Sigma$ does only have to be known up to proportionality. Once a dose-response
