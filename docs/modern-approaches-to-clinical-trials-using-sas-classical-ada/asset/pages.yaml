    \ gender two levels—male or female, and the blood pressure has 3 levels—high,\
    \ normal, and low. In conjunction with permuted block randomization, the stratification\
    \ based on the two factors results in six mutually exclusive groups. If we take\
    \ the block size of 4, the output of Example Code 9.4 Stratified Randomization\
    \ produces a stratified block randomization scheme for such a trial (Output from\
    \ Example Code 9.4).\n\n# Example Code 9.4 Stratified Randomization\n\n```\nproc\
    \ plan seed=123;\n    factors Block=1 random Gender=2 ordered Pressure=3 ordered\
    \ Sequence=4\n    ordered/noprint;\n    treatments Treatment=4 random;\n    stratifiedRandomization\
