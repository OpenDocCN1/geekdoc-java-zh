- img_proc: true
  md: '# 9.4.1 Stratified Randomization


    Prior to randomization, there are some baseline prognostic factors (covariates)
    collected, such as age, gender, and disease severity, which may have an important
    impact on the treatment outcomes. It is thus desirable to balance treatment allocation
    over these covariates so that valid and efficient treatment comparisons can be
    conducted.


    The simplest way to balance the treatment assignment over important covariates
    is through stratification. As shown in Figure 9.1 Illustration of Stratified Randomization,
    trial participants are first grouped into mutually exclusive strata based on the
    values of their prognostic variables, and then they are randomly allocated to
    each treatment within each stratum.


    Figure 9.1 Illustration of Stratified Randomization


    ![](img/f4ec2665c3484c528370923aeb5cb99f_434_0.png)


    If the number of strata is small, stratified randomization can strike a balance
    with respect to various combinations of the covariates. However, if the number
    of strata is relatively large in comparison to the number of subjects, stratification
    can be meaningless. Because the number of strata increases multiplicatively with
    the number of stratification factors, some strata may become very sparse or even
    empty. This, in turn, may yield a considerable imbalance among treatment arms
    [5].


    proc plan can be used to design a stratified randomization procedure. Suppose
    that a trial has enrolled 24 patients, and we need to stratify'
  merge: -1
  pgno: 434
- img_proc: true
