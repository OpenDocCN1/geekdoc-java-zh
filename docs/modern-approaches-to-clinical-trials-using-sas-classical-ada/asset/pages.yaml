    of Asthma Trial with 100 Patients Per Group. The prec mcm call with new priors
    is provided in Example Code 8.3 Analysis of Asthma Trial with 100 Patients Per
    Group. The prior for E0 remains unchanged. This is a prior distributed with mean
    0.15 and a low precision of 1 (as opposed to a precision of 10 for the previous
    example). The ED50 is also diffused assuming a flat uniform prior between 0 and
    20. In this example there is no prior clinical information on the drug, hence
    we assume a flat uniform prior from 0 to 20. If we had more information on the
    drug (similar to the previous example), we could have assumed a bounded beta distribution
    - for example, bounded at 20 and tweaking the parameters of the beta distribution
