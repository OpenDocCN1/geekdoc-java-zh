    \ \\alpha, \beta, J) + C_L(\\cap_\\emptyset, \\alpha, \beta, J)$\n\nSimilarly,\
    \ the maximum information $I_j$ and hence the maximum sample size $n_j$ or the\
    \ maximum number of events $D(C_J)$ can be estimated accordingly for a given value\
    \ of $\\eta_1$. For the two-sided setting, the rejection of the null hypothesis,\
    \ the boundaries will be a set of top outer boundaries and bottom outer boundaries,\
    \ while for the rejection of the alternative hypothesis, the boundaries will be\
    \ a set of inner wedge boundaries.\n\nAnother approach that is different from\
    \ using the power or shape parameter on $t_j$ is the triangular boundary method\
    \ proposed by Kittelson and Emerson [4]. This boundary set takes on the following\
    \ shape\n\n$c(t_j) = C_L(\\phi, \\alpha, J)(1 + \tau \\frac{j}{J})$\n\nThe boundary\
    \ function is a linear function on $t_j$ with a variable slope parameter of $\t\
    au$. When a trial is testing a one-sided hypothesis, with an early decision to\
    \ stop to reject or accept the null hypothesis, this method produces a triangular\
    \ continuation region on the scale of the score statistic $S(t_j)$.\n\n# **Example:\
