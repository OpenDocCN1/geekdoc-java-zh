  md: '# 10.8 Summary


    In this chapter we gave an exposition on optimal RAR designs for clinical trials
    with binary outcomes. These designs use accumulating data from patients in the
    trial to modify treatment randomization probabilities to achieve an allocation
    that is optimal for some pre-specified experimental objective(s). A common objective
    is to minimize the number of treatment failures in the study subject to a constraint
    on power of a statistical test. Optimal RAR designs can result in a modest reduction
    in treatment failures in the trial, while maintaining important statistical properties
    as power and estimation efficiency. Therefore, such designs can be attractive
    in clinical trials where outcomes are grave and even a modest reduction in treatment
    failures is viewed as highly desirable from the individual ethics perspective.
    The advantages of optimal RAR designs over balanced randomization are more pronounced
    when the treatment difference is large; however, when the treatment effects are
    the same, RAR reduces to equal allocation randomization. Optimal RAR designs have
    well-established asymptotic properties: under widely satisfied conditions, both
    estimators and sample allocation proportions are strongly consistent and follow
    asymptotically normal distributions. Therefore, standard asymptotic inference
    procedures can be applied for data analysis following RAR trials.


    The main objective of this chapter is to provide an exposition to the methodology
    of optimal RAR designs, but not to give a comprehensive guidance on how to choose
    the “best” design for use in practice. Our discussion focused primarily on two-arm
    binary outcome trials “adaptive randomization is inferior to 1:1 randomization”
    in terms of benefit to future patients, and it offers “modest to no benefit” to
    the patients in the trial [32]. In [67], the maximum possible ethical gain of
    the allocation (measured by the percentage of reduction in the expected number
    of nonresponders) was quantified. Such a reduction is found to be, in general,
    quite small (typically 3% or less compared to 1:1 randomization). This finding
    is also confirmed by our simulation study (cf. Section 10.7). Note that the papers
    [32,67] examined only two specific types of RAR procedures (Bayesian adaptive
    randomization Tall and Wathen’s approach [15], and the RAR design targeting RSIHR
    allocation [10]). However, the scope of optimal RAR designs is much'
  merge: -1
  pgno: 515
- img_proc: true
  md: 'broader—it also includes other types of optimal allocation (e.g. compound optimality
    design—Design IV in Section 10.7), and multi-arm RAR trials, and trials with binary,
    count, continuous, and time-to-event outcomes [14]. In more general settings,
    RAR can provide more substantial improvements, both in terms of statistical efficiency
    and ethics, over equal allocation randomization [17-19,31]. One important topic
    that we have not discussed in this chapter is a combination of RAR with group-sequential
    designs that allow stopping the trial early for futility (if there is lack of
    treatment effect) or efficacy (if treatment effect is pronounced). Some authors
    theoretically showed advantages of group-sequential RAR designs [68-71].


    It is important to note that RAR designs are operationally more complex and require
    more upfront planning than designs with fixed randomization schedules. RAR is
    applicable in trials where the recruitment period is relatively long and the outcomes
    can be observed quickly; the data must be of high quality to mitigate the potential
    for bias throughout the trial conduct. See [2,22,45] for further considerations
    on implementing RAR designs in practice. In conclusion, if used judicious, optimal
    RAR designs can be useful in randomized comparative clinical trials with objectives
    primarily related to statistical efficiency and ethics.'
  merge: -1
