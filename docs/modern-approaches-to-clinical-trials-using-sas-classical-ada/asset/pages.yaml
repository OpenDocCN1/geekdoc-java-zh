    \ is 0.92-0.93.\n\nOverall, in this example, RAR designs provide some reduction\
    \ in treatment failures that are almost identical in terms of quality of estimation\
    \ and power to balanced randomization designs. While in our simulation we considered\
    \ the Wald test, other tests can be considered as well. Gu and Lee in [52] performed\
    \ a comprehensive simulation study to explore the properties of nine different\
    \ test statistics in two-arm binary outcome RAR trials. They found that for small\
    \ trials $(n=30)$, the Cook’s correction to the chi-square test and Williams’\
    \ correction to the log-likelihood ratio test have the best performance."
