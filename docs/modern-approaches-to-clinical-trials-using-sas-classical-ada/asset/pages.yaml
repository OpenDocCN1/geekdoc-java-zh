  md: '# 4.5.2 Sampling Priors


    Now, we turn to our attention to specify the sampling priors. Under the proposedproposed
    model in (4,3), we take the sampling priors

    $\pi_l^{(S)}[\gamma_l, \theta_l] \propto \alpha^{(S)}(\theta_l)\pi^{(S)}(\gamma_l)$
    for $l=0,1$. In the sampling prior, we first

    specify a point mass prior for $\gamma_1$ as $\pi_0^{(S)}(\theta_0) = \Delta{\{\gamma_1=\log(\theta_0)\\}}$
    for $l=0$ and

    $\pi_1^{(S)}(\gamma_1) = \Delta{\{\gamma_1=\Delta_1\\}}$ for $l=1$, where $\Delta{\{\gamma_1=\gamma_1^*\}}$
    denotes a degenerate

    distribution at $\gamma_1=\gamma_1^*$, i.e., $P[\gamma_1=\gamma_1^*]=1$. We then
    specify a point mass

    prior for each of $\pi^{(S)}(\gamma_0)$ and $\pi^{(S)}(\theta_0)$ as well. Note
    that the choices of

    design values, $\gamma_0, \theta_0$ are obtained by solving the following simultaneous

    equations:


    ```

    $1-\exp\{-exp(\\gamma_0+\theta_k)\}=r_k$ and $\sum_{k=1}^K\theta_k=0$,

    ```


    where $r_k$ is a pre-determined annualized event rate for $k=1..,K$. As in

    the example discussed in 4.7 SAS MACRO BSMED, we assume that

    the number of studies is $K=9$ and the annualized event rates are

    $r_k=0.012$ for $k=1..8$ and $r_g=0.015$. Then, by solving the above

    equations, we obtain $\gamma_0=-4.392, \theta_k=-0.025$ for $k=1..\beta$, and
    $\theta_g=0.2$.

    Therefore, we can specify the point mass priors based on those

    values.'
