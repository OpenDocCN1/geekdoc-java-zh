- img_proc: true
  md: "# 11.4.2.2 Biomarker-Adaptive Threshold Design\n\nIn this design [32], the\
    \ test for overall treatment effect is combined with the development and validation\
    \ of a cutpoint for a pre-specified biomarker-based subgroup believed to be most\
    \ sensitive to the targeted treatment. The statistical hypothesis test is carried\
    \ out by splitting the overall type I error rate $\\alpha$. First, compare the\
    \ treatment response on the overall population at $\\alpha$1, and if not significant,\
    \ perform the second test at $\\alpha-\\alpha$1. For example, if the null hypotheses\
    \ of no benefit (a) is rejected at a desired significance level of, say 0.04,\
    \ then the testing is stopped or else the testing is carried out to the hypothesis\
    \ in (b) at 0.01 to control an overall $\\alpha$ below 0.05. A simplified cutoff\
    \ model proposed by Altman et al. [33] is used to develop the proposed procedure.\
    \ The overall patient population is divided into two groups: biomarker-based (sensitive)\
    \ and non-biarker-based (non-sensitive). This categorization may result in some\
    \ loss of information, but the proposed testing procedure is robust to departures\
    \ from the simplified cut-off model. A permutation resampling approach is used\
    \ for selection of the optimal cutpoint to avoid multiplicity problems [34].\n\
    \nAn approach to sample planning for clinical trials when the treatment effect\
    \ is restricted to a subpopulation is presented in Appendix B in [32]. Assume\
    \ that in a trial with time-to-event outcomes, the required number of observed\
    \ events for the overall test to detect the target treatment effect (at significance\
    \ level $\\alpha$) with power $1-\beta$ could be calculated by the events macro\
    \ in Example Code 11.5 Number of Events for Biomarker-Adaptive Threshold Design.\n\
    \n# Example Code 11.5 Number of Events for Biomarker-Adaptive Threshold Design\n\
    \n```\n%macro events(delta, alpha, beta, pi);\ndata result;\nal=&alpha;\npower=1-&beta;\n\
    delta=&delta;\np=&pi;\nz=quantile('Normal', 1-&alpha);\nz=quantile('Normal', 1-&beta);\n\
    logd=log(delta)/log(delta);\nD=4*(za+zb)/log(delta)**2;\nDs=D/(pi**2);\nlabel\
    \ delta='hazard ratio';\nlabel pi='treatment effect fraction';\nlabel Ds='events\
    \ required';\nrun;\n```"
