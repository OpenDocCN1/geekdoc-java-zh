  md: '# Group Sequential Design


    While considering the flexible designs, group sequential is the first natural
    consideration for any pivotal trial due to regulatory comfort in these designs.
    We consider a GSD with one interim look to detect an improvement of 32% with a
    possibility of stopping early for efficacy or futility. Group sequential designs
    can be a very safe and attractive option. However, the study population, the time
    at which the endpoint is observed, and the enrollment rate should be taken into
    consideration. In other words, the saving in the potential duration for the study
    should be balanced with the saving in the sample size. In our hypothetical example,
    we perform an interim analysis when approximately 50% of the subjects have observed
    the primary endpoint. We now choose the error spending function to evaluate the
    interim. In most cases, the type I or type II error is spent very conservatively
    in the early look so that the decision of efficacy or futility is triggered only
    if the results are compelling towards or against the new treatment.


    The stopping boundaries can be chosen in several different ways and should be
    aligned to the project objectives. In this example, we choose the interim futility
    boundary such that the study can be stopped at interim if there is no difference
    between control and the test treatment, i.e., no improvement in the condition
    while the interim efficacy boundary is chosen such that the trial will be stopped
    at the interim if there is overwhelming efficacy. To achieve this objective, Example
    Code 3.1 Sequential Design with Efficacy and Futility Boundaries uses an error
    spending funding using the conservative O''Brien-Fleming boundary with γ=-4 to
    control type II. and an error spending funding using a gamma boundary. In the
    program, proc seqdesign uses the method(alpha)=errfuncob for the type I error
    and the method(beta)=errfuncamma(gamma=-4) option for the type II error. Hwang,
    Shih, and DeCani have shown that γ=-4 error spending is similar to using the conservative
    O''Brien Fleming boundary [31,32]. The option stop=both(futility=nonbinding) gives
    a non-binding futility boundary. The non-binding futility means that the trial
    could be a slight penalty that needs to be paid at the final analysis if the futility
    rule is non-binding as to the binding rule. The penalty is usually very negligible;
    for using the above boundaries, the final critical value for the non-binding futility
    would be 1.969 when it would be 1.962 for a futility boundary.'
