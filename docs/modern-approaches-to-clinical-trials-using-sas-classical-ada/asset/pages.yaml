    size is selected by equating the conditional power above to some reasonable number
    (e.g. 80%) and solving for $M$.


    # 3.3.3.2 CHW Procedure as a Special Case of the Combination Test


    The method of Cui, Hung, and Wang (CHW) was originally presented in [22]; we reproduce
    a simplified description of it here. Suppose an interim analysis with a decision
    to possibly increase the sample size is after $2n$ patients and the originally
    planned sample size is $N$ per group. Let $Z_n$ be the normalized test statistic
    comparing the means of the two treatment groups based on the interim data. Under
    the null hypothesis $\zeta=0$, the statistic $Z_n$ follows a normal distribution.
    If the sample size does not increase, the test statistic at the final analysis,
    denoted by $Z_N$, can be written as the weighted sum of the test statistics from
    the two stages $Z_n$ and $Z_{N-n}$:


    ```

    $Z_N = \sqrt{\frac{n}{N}}Z_n + \sqrt{\frac{N-n}{N}}Z_{N-n}$.

    ```


    If after the interim analysis, the sample size is increased to $M(M>N)$ per group,
    the same statistic becomes'
