  md: '![](img/f4ec2665c3484c528370923aeb5cb99f_294_0.png)


    Therefore, the MinD is a very important concept in product development. Unfortunately,
    there is not a universally accepted definition of this term [8]. Finding MinD
    is critical as it is generally believed that toxicity increases as dose increases.
    Hence, a lower dose that is effective implies that it could be safer than higher
    doses.


    Clinical results obtained from phase III studies are used to obtain an investigative
    product marketing authorization. Based on these data, if a dose is efficacious
    and safe, then that dose can be approved, and the product label specifies the
    dose or the range of doses that the product is approved for. However, after approval
    and broader use, excessive adverse events are observed that impact the benefit-risk
    balance for patients, then a question as to whether the approved dose is low enough
    could be raised. At this time, it would be very challenging to ask what the MinD
    is for this product. Therefore, it is critical to find MinD in phase II, before
    it is too late.


    Drug price in the US is not directly associated with dosage. However, in many
    other countries, the price of a medicinal product is linked to its dose. In other
    words, if the dose of the product is higher, then it is'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'expensive. Now suppose that a certain product is approved in such a country,
    and the price is set based on the lowest approved dose. If later it was detected
    that the MinED for the product is in fact, lower than the approved dose, then
    a dose reduction is needed at a post-market stage. Accordingly, the price of this
    product has to be lowered further. When this happens, there is a huge impact on
    the earnings of such a product. Therefore, from a marketing strategy point of
    view, it would be critical to identify the MinED before the product enters its
    phase III development.


    Finding the MinED is a phase II practice. As discussed above, if the MinED was
    not identified at phase II, it would be very difficult and expensive to find the
    MinED at a later stage of product development. In fact, phase II could be the
    only opportunity to characterize the relationship between doses and efficacy.
    Therefore, it is very important to pay more attention to phase II, and to carefully
    design dose-ranging clinical trials during this critical phase of clinical development
    for a new product.


    Although there is a definition of MinED from ICH E4, in that the MinED is the
    “smallest dose with a discernible useful effect,” the interpretation and implementation
    of such a definition varies a lot in practice [4]. The first question is the understanding
    of a “useful effect.” It is difficult to achieve consensus about the smallest
    magnitude of an effect that is useful. One approach is to follow a well-established
    treatment effect such as lowering 5 mmHg blood pressure in developing an antihypertensive
    drug. Another is to consider the concept of minimally important difference (MCID).
    This is the magnitude of the treatment effect above and beyond a placebo effect
    that is large enough to be perceived by a subject. It is a commonly used concept
    in outcomes research.


    However, the implementation of a discernible effect could be more difficult. Various
    authors recommend different ways of calling a dose as MinED based on the difference
    in treatment effect from a given dose compared with a placebo. Some authors suggest
    the use of a dose-response model to help estimate MinED [9,10]. Others suggest
    the use of pairwise comparisons [11,12].


    Even among those authors who recommend the use of pairwise'
