  md: '# 6.2.2 Finding the Effective Dose


    ICH E4 defines the minimum effective dose (MinED) as the "smallest dose with a
    discernible useful effect" [4]. Finding the MinED is an important step in drug
    development. To illustrate, let''s consider the following reported example. In
    a clinical development program for a test drug to treat osteoarthritis [7], the
    first dose-response study included a placebo, 80 mg, 120 mg, and 160 mg of the
    test drug. Results from this study indicate that all three doses are efficacious
    (the left panel of Figure 6.2 Dose-Response Results from the Three Studies of
    Osteoarthritis). These results also show that 80 mg may have already been at the
    high side of the dose-response curve. A second study was designed to explore the
    40 mg dose, and results from this second study are given in the middle panel of
    Figure 6.2. With these findings, the project started phase III studies using a
    dose of 120 mg to confirm the long-term efficacy of this drug.


    An end-of-phase II meeting with the Food and Drug Administration (FDA) commented
    that the minimum effective dose (MinED) was not found. The main issue here is
    that the efficacy response does not change as the dose level changes and all the
    three testing doses almost equally reach the full efficacy effect, so the dose-response
    relationship was not detected. The project team designed a third-response study
    to explore the lower dose range. Doses included in the third study are 2.5 mg,
    10 mg, and 40 mg. As shown in the right panel of Figure 6.2 Dose-Response Results
    from the Three Studies of Osteoarthritis Drug, the third study successfully established
    the dose-response relationship, i.e., the response increases as dose increases.
    Based on these results, it is clear that the phase III studies are designed with
    a dose being too high. The impact of this process can cause a major delay in the
    development program and considerable waste of resources.


    Figure 6.2 Dose-Response Results from the Three Studies of Osteoarthritis Drug'
