  md: '# ## 1.1 Introduction


    Clinical testing of a drug to support its marketing authorization is often characterized
    by four phases. Here, we use the word "drug" broadly for a drug or a biologic.
    Three of the four phases are before the drug is marketed (pre-marketing) and one
    is afterwards (post-marketing). During the first phase (phase I), researchers
    investigate what the human body will do to a drug in terms of drug absorption,
    distribution, metabolism and excretion. The investigation is typically conducted
    in healthy human volunteers, except for cytotoxic drugs. For cytotoxic drugs,
    phase I is often conducted in patients with very few therapeutic options due to
    the anticipated toxicities and uncertainty about a drug''s benefits. When a drug
    is designed to target a receptor or induce a certain biomarker response, phase
    I trials can sometimes investigate what the drug does to the body. Phase I investigation
    usually consists of single-dose and multi-dose escalations to understand the common
    adverse reactions of a drug and what would be the judge''s dose-limiting toxicities.
    If the drug''s safety profile is judged to be acceptable relative to its potential
    (and yet to be observed) at this stage, the development will progress to the second
    stage (phase II) with a recommended dose range. The number of volunteers included
    in phase I testing ranges between 20 and 80, but could be higher if phase I includes
    an assessment of the drug''s mechanism of action or an early investigation of
    the drug''s efficacy.


    The second phase focuses on a drug''s efficacy in patients with a targeted disorder.
    Clinical trials at this stage are also designed to determine dose(s), whose benefit-risk
    profile warrants further investigation in a confirmatory setting. Multiple doses
    within the dose range identified from phase I are typically studied during this
    phase. Occasionally, a sponsor may have to conduct more than one study if the
    doses chosen initially in the initial dose-response study are not adequate to
    estimate the dose-response relationship. This could occur if the doses selected
    initially are too high (e.g. near the plateau of the dose-response curve). To
    reduce the chance of having to repeat a dose-response study, it is generally recommended
    to include 4-7 doses in a wide dose range (the ratio of the maximum dose to the
    minimum dose ideally will be at least 10) in the dose-finding study. The analysis
    of a dose-finding study should focus on modeling the dose-response'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'relationship instead of making pairwise comparisons between each dose and the
    control [1].


    Phase II is typically the time when researchers first learn about the beneficial
    effect of a drug. It also has the highest attrition rate among the three pre-marketing
    phases. Therefore, if a drug is not a viable candidate, it is best to recognize
    it as soon as possible. This objective plus fewer regulatory requirements at this
    stage offer opportunities for out-of-the-box thinking. For example, some developers
    have divided Phase II into two stages. The first stage tests the proof of concept
    (POC) of the drug, using a high dose (e.g., the maximum tolerated dose identified
    in phase I) to investigate a drug''s efficacy. If the drug does not demonstrate
    a clinically meaningful efficacy compared to the control in the POC study, there
    will be no need to conduct a dose-response study. Otherwise, the drug will be
    further tested in a dose-ranging study. This two-step process is often referred
    to as phase IIa and phase IIb (see, for example, [2]). To streamline work that
    is required to initiate studies and obtain approvals from multiple institutional
    review boards, some sponsors combine POC and dose-response studies in one protocol
    with an unblinded interim analysis at the end of the POC stage. The sponsor will
    review results from the POC stage but use only data from the second stage to estimate
    the dose-response relationship. This strategy has the potential to reduce the
    so-called “white space” between phase IIa and phase IIb where the POC would be
    fully evaluated first and then the dose-response study would be planned.


    Depending on the target disorders, phase II traditionally consists of 100-300
    patients. Despite strong advocacy by researchers [2] to use a modeling approach
    to analyzing dose-response data, some sponsors continue to rely on pairwise comparisons
    to design and analyze dose-response studies. There has been renewed emphasis that
    the selection of dose(s) is an estimation problem, and this problem could be addressed
    more efficiently by using a modeling approach [3]. In addition, Pinheiro et al.
    have shown that 300 patients in a dose-ranging study may not be enough to adequately
    identify the optimal dose based on a pre-criterion [4].


    If a drug meets the efficacy requirement and passes the initial benefit-risk assessment,
    it will be further tested to confirm its efficacy. This is'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'the final stage of clinical testing before most drugs receive regulatory approval
    for marketing. This phase (phase III) enrolls a greater number of patients who
    are more heterogeneous in their demographic and baseline disease status. It is
    also at this stage that the majority of pre-marketing safety data are collected.
    Since a major objective of phase III is to confirm a drug''s effect, analyses
    focus on testing pre-specified hypotheses with adequate control for the chance
    of making an erroneous claim of a positive drug effect. Operations at this stage
    require protecting a trial''s integrity so that trial results could be interpreted
    with confidence. The number of patients included in this stage typically ranges
    between 1,000 and 5,000. Drugs for orphan diseases will enroll much fewer patients
    than drugs that are designed to reduce the risk of a clinical endpoint may require
    thousands, if not tens of thousands of patients. In addition, more patients will
    be needed if the drug is developed for multiple disorders simultaneously. An example
    for developing multiple indications simultaneously is antibiotics.


    After a drug''s effect is confirmed and benefit-risk assessment supports its use
    in the target population, the manufacturer of the drug will file a marketing application
    with regulatory agencies, typically in multiple countries. Nearly all applications
    are for the adult population initially. If the product is expected to be used
    in the pediatric population, a manufacturer will often have a plan to initiate
    pediatric trials at the time of the initial marketing application. The marketing
    application may be for a single indication or for multiple indications. If the
    application is approved, the drug will be commercially available to the public.
    A manufacturer could choose to conduct additional studies to further test the
    drug in the population(s), or in pediatric patients with the indicated disorder(s),
    or comparing the drug head-to-head with an approved drug for the same disorder(s),
    or for additional usages. Sometimes, a manufacturer conducts post-marketing studies
    to meet regulatory requirements as a condition for the marketing approval. This
    phase is often referred to as phase IV.


    Another way to characterize the four phases of drug development is by the type
    of studies that are conducted during these 4 phases [5]. The types of studies
    conducted can be described as human pharmacology studies (phase I), therapeutic
    exploratory studies (phase II), therapeutic confirmatory studies (phase III),
    and therapeutic use studies (phase IV).'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'There are notable exceptions to the process described above. Many cancer drugs
    were initially granted accelerated approval based on tumor response rates observed
    in phase II trials. Some may be single-arm studies. A condition for the accelerated
    approval is that the observed efficacy in phase II needs to be confirmed in randomized
    phase III trials. Depending on the type of cancer, the endpoint used in phase
    III trials can be progression-free survival or overall survival. When overall
    survival is not the primary endpoint in a phase III study, regulators often require
    that the new drug does not compromise overall survival. Drugs used to treat rare
    diseases could be approved based on phase II results. The development pathway
    for each drug requires careful planning with input from regulatory agencies.


    On 09 July 2012, the US Congress signed the Food and Drug Administration (FDA)
    Safety and Innovation Act. The Act allows the FDA to designate a drug as a breakthrough
    therapy if (1) the drug, used alone or in combination with other drugs, is intended
    to treat a serious or life-threatening disease or condition; and (2) preliminary
    clinical evidence indicates the drug may demonstrate substantial improvement over
    existing therapies on at least one clinically significant endpoint. A manufacturer
    can submit the breakthrough designation request to the FDA for their drug and
    the agency has 60 days to grant or deny the request. Once a drug is designated
    as a breakthrough therapy, the FDA will expedite the development and review of
    such drug. The breakthrough development can be withdrawn after granting [6].


    Drug development has always been a high-risk enterprise. The success rate of developing
    an approved drug has decreased in recent years [7-9]. In 2004, the FDA in the
    United States (US) issued a Critical Path Initiative Document, in which the FDA
    quoted a “current” success rate of around 8% and a historical success rate of
    14% [10]. To help lift the stagnation around drug development, the FDA encouraged
    innovations in many areas of drug discovery, development, and manufacturing. In
    the area of clinical development, the FDA encouraged, among several designs, more
    efficient clinical trial designs. While looking for more efficient study designs
    has always been an area of intense interest for many scientists, the need to look
    for new design options has accelerated since 2004. A class of designs beyond the
    traditional group sequential design has emerged from these efforts. A common feature
    of these designs is to use interim data of a trial to modify certain aspects


