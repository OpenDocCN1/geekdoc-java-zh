  md: '# 7.6 Conclusions


    Current dose-finding practices often are not satisfactory: Many dose-finding studies
    are not properly designed (too few doses, dose-ranges too narrow, sample sizes
    not large enough, etc.) and the inferences drawn from them are not adequately
    accurate, leading to major consequences in drug development that are undesirable
    (e.g., high failure rate in phase III, need for label changes after approval,
    etc.).


    Here, we have described a unified strategy for analyzing dose-finding studies,
    including the selection of one or more doses to take into further development.
    The proposed methodology combines the advantages of the multiple comparison and
    modeling approaches, consisting of a multistage procedure. Dose-response is tested
    in the first stage, using multiple comparison methods to identify statistically
    significant contrasts corresponding to a set of candidate models. If a dose-response
    signal is established in the first stage, the best model is used for dose-response
    and target-dose estimation. Different model-based dose selection methods, incorporating
    both statistical significance and clinical relevance, were presented and evaluated
    via the analysis of real and simulated data.


    The MCP part of the proposed method is to maintain the FWER at its nominal level,
    has power comparable to the standard trend tests under monotone dose-response
    settings, and is better under non-monotone scenarios, provided the set of candidate
    models is broad enough. The clear advantage of this new approach, in comparison
    to traditional multiple comparison dose-finding methods, is its added flexibility
    in searching for and identifying an adequate dose for future drug development
    through the use of modeling techniques. Several variants of the proposed methods
    are possible and have been investigated in the literature.


    Compared to traditional ANOVA-based pairwise multiple comparisons, MCP-Mod has
    the advantage of enabling the use of more doses in the design, without requiring
    a much larger number of patients. In an ANOVA-type approach, only the information
    from the respective dose is used to estimate the dose-response, which means that
    the required'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'sample size depends strongly on the doses studied, when a fixed MCP precision
    is required at each dose. By using modeling techniques MCP-Mod allows us to interpolate
    information across dose-levels, and the total sample size will not depend strongly
    on the number of doses studied. The possibility of using more doses will typically
    result in information-rich dose-finding designs and a better basis for decision
    making at end of phase II.


    MCP-Mod can be applied to a broad class of parametric models beyond the standard
    setup of a normally distributed endpoint in a standard ANOVA model. For example,
    the response variable might be a count, binary, or time-to-event variable instead
    of being distributed. For the generalized MCP-Mod all that is needed is an estimate
    of the response at the doses, as well as the associated covariance matrix. In
    SAS, different methods can be used to produce these estimates. proc glmmix is
    probably the most general procedure and might thus be recommended for most situations.
    Another advantage is that it produces the adequate adjusted p-values. The Mod
    step of the procedure can then be performed using the proc code provided, which
    is quite flexible, and does not depend on the underlying distribution of the endpoint.
    Of course, other procedures, such as proc nlin or proc mixed could also be used
    for the Mod step. In addition, the final analysis has usually to be adjusted for
    relevant covariates (e.g. region, age, etc.), patients'' measurements are often
    recorded over time (necessitating the use of longitudinal models), and patients
    might receive more than one treatment (such as in cross-over or incomplete block
    designs). In this chapter we have illustrated with real data sets, how to use
    the MCP-Mod approach in practice. Furthermore, we have provided relevant SAS code
    to implement and perform the MCP-Mod approach in many situations of practical
    relevance. An alternative possibility to implement MCP is via the DoseFinding
    R package [11], which contains extensive functionality for both the design and
    the analysis of dose-finding studies. The commercial software package ADDPLAN-DF
    contains extensive tools for designing dose-finding studies using MCP-Mod [12].
    In addition, Cytel has developed PROC MCPMOD as an add-on to SAS that focuses
    on the analysis of dose-finding studies using MCP-Mod.'
