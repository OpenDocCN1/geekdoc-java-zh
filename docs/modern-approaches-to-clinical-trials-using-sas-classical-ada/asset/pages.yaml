  md: "# 4.6.1 Predictive Data Generation\n\nIn this section, we extend the computational\
    \ algorithm discussed in [6] and [10] to generate the prior predictive survival\
    \ data by incorporating the trial duration $\\hat{\tau}_k^D$ and accrual time\
    \ $\\hat{\tau}_k^A$ discussed in 4.2 Meta Design Setting. Specifically, we use\
    \ $\\hat{\tau}_k^D$ and $\\hat{\tau}_k^A$ to construct the censoring time in the\
    \ generation of the predictive survival data $D_K$ in addition to the sampling\
    \ prior $\\pi^{(S)}(\\{\\gamma, \theta\\})$. Our new predictive data generation\
    \ algorithm is given as follows:\n\n+   1. Generate $[\\{\\gamma, \theta\\} \\\
    sim \\pi^{(S)}(\\{\\gamma, \theta\\})]$.\n\n+   2. Generate $Y_{ijk} \\sim f(Y_{ijk}|\\\
    gamma_{jk}, \theta, x_{ijk})$ independently for $i=1 \\dots n_{jk}, j=1, 2, k=1\
    \ \\dots K$.\n\n+   3. Set $\tau_{ijk}^{*A}=0$ if $\\hat{\tau}_k^A=0$ and generate\
    \ the accrual time $\tau_{ijk}^{*A}-U(0, \\hat{\tau}_k^A)$ independently if $\\\
    hat{\tau}_k^A>0$ for $i=1 \\dots n_{jk}, j=1, 2, k=1 \\dots K$.\n\n+   4. Set\
    \ $C_{ijk}^{*A}=\tau_k^D-\tau_{ijk}^{*A}$ for $i=1 \\dots n_{jk}, j=1, 2, k=1\
    \ \\dots K$.\n\n+   5. Compute $y_{jk}=\\sum_{i=1}^{n_{jk}} \\min(Y_{ijk}, C_{ijk}^{*A})$\
    \ and $v_{jk}=\\sum_{i=1}^{n_{jk}} \\{Y_{ijk} \\le C_{ijk}^{*A}\\}$, where the\
    \ indicator function $1\\{Y_{ijk} \\le C_{ijk}^{*A}\\}=1$ and 0 otherwise for\
    \ $i=1 \\dots n_{jk}, j=1, 2, k=1 \\dots K$.\n\n+   6. Set $D_K=\\{y_{jk} \\cdot\
    \ v_{jk}, n_{jk} \\cdot x_{ijk}\\}, j=1, 2, k=1 \\dots K$."
