    \ using `method=peto(z=3)` to set the boundary constant at 3 for the first four\
    \ stages. This is the default. Alternatively, for the example discussed earlier,\
    \ one can specify a fixed p-value using `method=peto(pvalue=0.001)` to set $\r\
