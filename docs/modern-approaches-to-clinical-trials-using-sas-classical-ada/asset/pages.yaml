  md: '# Figure 2.18 Conditional Power Plot for the Psoriasis Trial Based on Observed
    Stage 1 Data


    # Conditional Power Plot


    ![](img/f4ec2665c3484c528370923aeb5cb99f_131_0.png)


    The conditional power of 96.02% refers to the hypothetical reference when it is
    the observed MLE. Since the MLE in the first stage is 0.3788, slightly larger
    than the original reference of 0.4-0.07=0.33, therefore the calculated $c = 0.3788/0.33
    = 1.1478$. If the hypothetical reference is $1.25^*=0.33 = 0.4125$, the conditional
    power is 97.98%. These estimated conditional powers suggests strong evidence of
    continuing the trial to the next stage. The predictive power of 75.41%, although
    smaller than the conditional powers, still implies strong evidence to continue.
    The next table is the same as before, displaying the rejection of the null hypothesis
    at the second stage and therefore, neither conditional nor predictive power needs
    to be calculated.


    Another important issue that arises from sequential testing is the provision of
    unbiased estimation of the mean effect size of an experimental drug. For a fixed-sample
    design without interim analyses for early termination, it is possible to achieve
    unbiased quantitative evaluation of treatment difference. However, under sequential
    design, the usual maximum likelihood estimator for the mean usually produces'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'over-estimation because of the choice of stopping rules and therefore the sampling
    distribution of the test statistic is no longer the same as the one from fixed-sample
    design. Jennison and Turnbull [11] gave a brief exposition of this issue. Methods
    have been proposed to adjust for this bias and this topic is beyond the scope
    of this chapter. However, as for median, an unbiased median estimator can be available
    in SAS. The last table of the output displays the unbiased median estimator of
    0.4548 based on default stagewise ordering. The corresponding p-value of the trial
    is 0.0075 based on the end of the second stage.


    Occasionally, some clinical trials will include multiple groups such as multiple
    doses of an investigational drug. In this case, utility analysis plays an important
    role to drop doses that do not exhibit clear evidence of efficacy, however, since
    multiple comparisons are being conducted, measures to control the inflation of
    type I error must be in place to account for multiplicity. In fact, dropping doses
    cannot be addressed in a classical group-sequential framework and requires completely
    different methodology, similar to the one described in Chapter 3, “Sample Size
    Re-estimation.” The latter extends the distributional theory and methods of preserving
    type 1 error that we have reviewed to situations when a trial''s total maximum
    information can be adjusted upward as well as downward during the interim analysis.
    This flexibility in direction of adjustment is unique to unblinded sample size
    re-estimation and is often used to contrast it with the group sequential methods
    discussed here: the group-sequential method can only adjust the sample size downward
    by stopping early.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 2.6 Summary


    Over the last couple of decades, the theories of group sequential testing have
    been well-established, particularly in the context of clinical trials. The US
    Food and Drug Administration (FDA) released a draft guidance for industry on "Adaptive
    Design Clinical Trials for Drugs and Biologics" in 2010 [31] and stated that "group
    sequential designs are among the other adaptive designs considered well-understood
    designs, offering valid approaches to clinical trial implementation." This chapter
    has provided an exposition of both theoretical and practical aspects of designing
    and monitoring a clinical trial adopting the sequential testing procedure. The
    sequential testing methodologies we have surveyed are able to preserve the type
    I error under nominal α level. With an independent DSMB, it is possible to maintain
    study integrity during the course of a trial. The SAS procedures and the examples
    discussed in this chapter provide a solid introduction to the sequential testing
    framework and programming tools for scientists, clinicians, statisticians, and
    programmers to investigate if group sequential methods can be effectively used
    in their clinical studies.'
  merge: -1
