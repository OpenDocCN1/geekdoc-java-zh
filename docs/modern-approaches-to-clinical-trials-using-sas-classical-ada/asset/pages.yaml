- img_proc: true
  md: '# 9.6 Summary


    This chapter reviews various types of adaptive-randomization designs in clinical
    trials. When used appropriately, adaptive designs may improve the efficiency and
    reduce the cost of a trial. Also, the information from the recruited patients
    can be maximally utilized, and the risk to the patients can be substantially reduced.


    However, in practice, randomized trials are still dominated by the conventional
    fixed-randomization scheme due to the following concerns:


    +   - Patients may not be balanced on certain covariates, especially those with
    possible time trends.

    - Hypothesis tests during interim monitoring and at the trial completion are unconventional
    and difficult.

    - Delayed outcomes may affect the practical implementation of adaptive randomization
    designs.


    To facilitate practical use of adaptive randomization, more automatic and frequent
    updating systems should be built. Necessary infrastructures and cooperation between
    statisticians and clinicians need to be established. Further investigation on
    the statistical properties of various types of randomized design is warranted
    [19].'
  merge: -1
