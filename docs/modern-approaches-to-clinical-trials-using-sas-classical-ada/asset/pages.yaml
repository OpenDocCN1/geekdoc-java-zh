  md: 'outcomes are ascertained and this situation is called “overrunning.

    Unless the recruitment rate is slow, re-designing a trial with a long follow-up
    period into a sequential trial may not reap additional benefits compared to a
    fixed-stage design. As a general rule of thumb, if the calculated recruitment
    period is four times longer than the treatment follow-up period, then a group
    sequential or adaptive design that has up to four interim stages can be more beneficial.'
