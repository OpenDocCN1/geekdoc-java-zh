    \ treatment difference $\\hat{\\Delta}(n) = \\hat{\rho}_E - \\hat{\rho}_C$;\n\n\
    +   - Empirical (average) power of the Wald test (with 2-sided $\\alpha=0.05$).\n\
    \nSupplemental program ch10.4.sas was used to run the simulating characteristics\
