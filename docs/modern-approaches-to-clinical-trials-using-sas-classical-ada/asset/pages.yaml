  md: 'randomizing 2m₀ patients (m₀ is some small positive integer) equally between
    E and C using some restricted randomization procedure, such as the permuted design.
    This is to ascertain some initial data to estimate pₑ and pC. We make an assumption
    that each patient’s outcome is available immediately after randomization. While
    this is quite a restrictive assumption in practice time must pass before a patient’s
    response is observable, it serves as a useful starting point for developing RAR
    theory [14]. Consider that m≥ patients have been treated and the (m+1)st patient
    is ready to be randomized into the trial. The treatment assignment for the (m+1)st
    patient will depend on the data acquired far. For j=1,...,m, let cⱼ=1 (or 0) if
    the jth patient''s outcome is success (or failure). Note let Yⱼ=1 (or 0) if the
    j. Note that pE=Pr(Yⱼ=1|cⱼ=1) and pC=Pr(Yⱼ=1|cⱼ=0). Given Δm=(c₁,,...,cm) and
    Ym=(Y₁,...,Ym), the treatment assignment for the (m+1)st patient will have to
    be determined.


    Hu and Rosenberger in [14] define a RAR procedure as one for randomization probability
    to treatment E for the (m+1)st patient is determined as


    φm₁=Pr(m+1=1Δm, Ym), m≥m₀. (10.5)


    Therefore, the randomization probability to treatment E is random because ϕm₁C=1-ϕm₁E.
    Note that the quantity in (10.5) depends on Δm and Ym which are random variables.
    Based on Δm and Ym, NE(m)=∑ⱼ=₁mcⱼ and NC(m)=∑ⱼ=₁m(1-cⱼ) denote the number of patients
    assigned to E and C, and SE(m)=∑ⱼ=₁mYⱼ and SC(m)=∑ⱼ=₁m(1-cⱼ)Yⱼ denote the number
    of successes on E and C. Success probabilities pₑ and pC are estimated as follows:


    ```

    pEm=SE(m)/NE(m) and pCm=SC(m)/NC(m). (10.6)

    ```


    It should be noticed that pₑ and pCm in (10.6) are not usual estimators of binomial
    proportions with RAR treatment assignments c,...,cm are correlated and the denominators
    NE(m) and NC(m) are random variables. Martingale theory is used to establish asymptotic
    properties of the estimators in this case [14].'
