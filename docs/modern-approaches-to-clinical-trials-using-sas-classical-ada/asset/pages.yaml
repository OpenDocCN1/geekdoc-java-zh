  md: '# 6.2.4 Was the Concept Proven?


    Sometimes it is desirable to combine the PoC and the dose-ranging studies into
    single study with clearly defined objectives, hypotheses, and decision criteria.
    The advantage of such a design is to first make a “Go/No Go” decision on PoC.
    If the decision is “Go”, then the same study would sequentially provide dose-ranging
    information to identify the dose that could achieve the target treatment effect
    and help design the next study. When well designed and analyzed, the combined
    study saves development time by providing a range of efficacious doses going forward.
    The disadvantage is that more investment is at risk before the concept is proven.


    When a simple PoC is examined under a single hypothesis test, there is not much
    discussion about PoC study design with regard to statistical design principles.
    In contrast, there are a variety of design and analysis strategies for dose-ranging
    trials. There exist three major categories of dose ranging methods: multiple comparison
    procedures (MCP); modeling approaches; and MCP-Mod, which combines the first two
    [13,14].


    The MCP method takes dose as a discrete factor and generally makes few assumptions
    about the underlying dose-response relationship. When there is no ordering imposed
    on the testing of multiple doses, multiplicity adjustment is necessary to protect
    the family-wise-error rate (FWER). Popular procedures such as the Bonferroni,
    Dunnett, Holm and Hochberg require α splitting, which results in an increased
    sample size. The modeling approach treats dose as a continuous variable and assumes
    a functional relationship between the response and the dose. Sometimes the multiplicity
    is avoided as a result of the functional relationship (e.g., non-decreasing dose-response
    relationship). The problem is that potential bias can be caused by model misspecification.
    The third approach, the MCP-Mod, addresses this issue by first selecting the dose-response
    model using MCP to protect the FWER; then the selected model is used to estimate
    the dose-response relationship. This approach is flexible in the sense of model
    selection; however, it pays the price of α at the model selection step.'
