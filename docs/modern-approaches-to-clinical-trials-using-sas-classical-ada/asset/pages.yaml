  md: "# 9.2 Simple Randomization\n\nThe simplest way of randomization, simple randomization\
    \ fixes the assignment probabilities throughout the trial with no regard to historical\
    \ allocation and response information. Nevertheless, the assignment probabilities\
    \ can be equal or different across treatment arms. For a trial with K treatments,\
    \ each trial participant is simply assigned with probability 1/K to one of the\
    \ K arms under equal randomization. If a certain treatment is believed to be more\
    \ beneficial, or investigators are interested in learning more about a specific\
    \ drug, more patients can be randomized to that treatment arm. For instance, the\
    \ allocation ratio to a new therapy versus the standard-of-care can be specified\
    \ as 2:1 or 3:1.\n\nIn SAS, the SimpleRandomize macro can be utilized to design\
    \ a simple randomized trial. The input variables include n, the total sample size\
    \ of the trial, and groupdata, the set that stores the identities of the treatments\
    \ and their corresponding allocation ratios.\n\nAs an illustration, we consider\
    \ a three-arm trial with treatments A, B, and C. Based on the allocation ratio\
    \ of 1:1:2, we can randomize 100 patients by calling the SimpleRandomize macro\
    \ as shown in Example Code 9.1 Simple Randomization.\n\n# Example Code 9.1 Simple\
    \ Randomization\n\n```\n%macro SimpleRandomize(n,groupdata, seed);\nproc iml;\n\
    \  use &groupdata;\n  read all;\n  call randseed(&seed);\n\n  u=j(&n,1);\n  prob=ratio/sum(ratio);\n\
    \  agroup=j(&n,1);\n  call randgen(u,\"Uniform\");\n  cprob=j(nrow(group),i);\n\
    \  do j=1 to nrow(group);\n    cprob[j]=sum(prob[1:j]);\nend;\n\ndo j=1 to &n;\n\
    \  k=1;\n  do while (u[j]>cprob[k])\n    k=k+1;\nend;\n  agroup[j]=k;\n```"
  merge: -1
  pgno: 424
