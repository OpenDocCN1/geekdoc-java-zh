  md: '# 6.2.3 Determining the Dose Range to Study


    In non-adaptive design practice, usually the first dose ranging study covers a
    wide dose range, and then the next dose ranging study will be designed with a
    narrower dose range, filtering out the target doses to be assessed in phase III.
    Dose range in a clinical trial is defined as the ratio of the highest dose divided
    by the lowest dose included in the design. For example, if the doses in trial
    A are placebo, 20 mg, 40 mg, and 80 mg, then the dose range is 4 (= 80/20). If
    the doses in trial B are placebo, 0.1 mg, 1 mg and 10 mg, then the dose range
    is 100 (= 10/0.1). Although the doses used in trial A are higher than doses used
    in trial B, in fact trial B has a much wider dose range – 25 times wider than
    trial A. It is critical to cover a wide dose range in the first dose ranging study.
    Inappropriate selection of dose range may result in a potential waste of costs
    and resources and delay the time to market launch.


    The key lesson learned from the above particular development program is that a
    very low dose was not explored in early phase II. In other words, if a dose at
    or below 10 mg was explored in the first study, a narrower dose range could have
    been established using the second study. Then the phase III studies could be designed
    with the appropriate dose range.


    In general, the most difficult challenge in designing the first dose ranging trial
    in developing a new intervention is the selection of doses to be included. Generally,
    the study is designed with two very important assumptions:


    +   1. The MTD was correctly estimated from earlier trials


    +   2. Efficacy response is monotonic to ascending doses.


    However, it is unclear what range of doses the efficacy activities would be in.
    At this stage, the best guidance available is the data obtained from pre-clinical
    experiments or from phase I using biomarkers. Even under the assumptions that
    the MTD was correctly estimated, and there'
