- img_proc: true
  md: '# 4.1 Introduction


    A typical drug development program may consist of multiple clinical studies with
    different study objectives, endpoints, and possibly different patient populations.
    There is rich literature for single Bayesian sample size determination [1-8].
    Sutton et al. proposed a hybrid frequentist-Bayesian approach for sample size
    determination for a future randomized clinical trial (RCT) using the results of
    meta-analyses reported in the literature and suggested that the power can be highly
    dependent on the statistical model used for meta-analysis, and even very large
    studies may have little impact on a meta-analysis when there is considerable study
    heterogeneity [9]. This raises a critical issue regarding how to appropriately
    account for between-study heterogeneity in a statistical model for meta-analysis.
    Recently, a Bayesian meta-analysis approach using survival models was developed
    for planning a phase II/III diabetes drug program [10-12]. Their approach focuses
    on sample size level by taking into account between-study heterogeneity within
    a meta-analysis framework. The authors considered the fitting and sampling priors
    of Wang & Gelfand for designing a Bayesian meta-analysis clinical trial with a
    focus on controlling the type error and power [1]. Their approach allows the incorporation
    of historical meta-survival data via the power priors of Ibrahim and Chen [13].


    Built upon work of [10-12], the goal of this chapter is the general and novel
    implementation of their proposed methodology into a user-friendly SAS macro, called
    BSMED, for Bayesian Survival Meta-Experimental Design using historical meta-survival
    data. In the development of the SAS macro, we extend the model and methodology
    of [10-12] for incorporating historical data. We note that in [10-12], it is assumed
    that the historical data are available only for the control arm from previous
    studies. As elaborated in Sections 4.2, 4.3, and 4.5 and illustrated in Section
    4.7, the SAS macro BSMED allows for the incorporation of various types of historical
    meta-survival data, including for the control arm only, those for the experimental
    arm only, those historical meta-survival data for both the control and experimental
    arms, or mixed historical meta-survival data of these three types from previous
    studies. In addition, the SAS macro BSMED allows users to input various randomization'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'ratios between control and experimental arms, various accrual times across
    follow-up times, as well as different annualized event rates across studies. Furthermore,
    SAS macro BSMED allows a single trial for the current data along with the historical
    data from one or previous trials. Therefore, the macro can be used for the design
    of a Bayesian time-to-event clinical trial in the meta-meta setting. Finally,
    we extend the computational algorithm discussed in [6, 10] to generate the predictive
    survival data by incorporating the trial duration, accrual time, and minimal follow-up
    time.


    The rest of the chapter is organized as follows. 4.2 Meta Design Setting presents
    the general meta-experimental design setting. 4.3 Meta-Regression Survival Models
    discusses meta-regression survival models. 4.4 Bayesian Meta-Experimental Design
    outlines the general methodology of Bayesian meta-experimental design. 4.5 Specification
    of Prior Distributions gives a detailed discussion of the specification of prior
    distributions. 4.6 Computational Algorithms presents the computational algorithms.
    4.7 SAS MACRO BSMED gives a detailed description and several illustrations of
    the SAS macro BSMED. We conclude this chapter with some discussion in 4.8 Summary.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 4.2 Meta Design Setting'
  merge: -1
