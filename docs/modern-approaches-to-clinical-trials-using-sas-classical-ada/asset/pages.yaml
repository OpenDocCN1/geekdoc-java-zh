- img_proc: true
  md: "# 9.3.2 Biased Coin Design\n\nAnother well-known restricted randomization method\
    \ is the biased coin design (BCD), which aims to provide an approximated balance\
    \ among the treatment arms [2]. Each step of the BCD favors the treatment that\
    \ has been underrepresented in the trial thus far. For illustration, $n_1$ and\
    \ $n_2$ denote the number of subjects that are assigned to arm 1 and arm 2, respectively.\
    \ Let $\rho$ be the prescribed randomization probability for arm 1. As the trial\
    \ proceeds, a new patient will be allocated to arm 1 with a probability of\n\n\
    ```\n$p(\\text{patient assigned to arm 1}) = \\begin{cases} \\rho, & n_1 < n_2\
    \ \\ 1/2, & n_1 = n_2 \\ 1-\\rho, & n_1 > n_2. \\end{cases}$\n```\n\nThere are\
    \ many choices for the selection of $p$: Efron recommended $p=2/3$, such that\
    \ the trial can be simply conducted by tossing a biased coin [2]. Based on a constant\
    \ $\rho$, the treatment allocation cannot characterize the extent of unbalance\
    \ between the two groups. To accommodate the sample size information, Wei recommended\
    \ the allocation probability to arm 1 as\n\n```\n$p = \\frac{1}{2}(1-\\frac{\\\
    Delta}{n})$\n```\n\nwhere $\\Delta = n_1-n_2$ and $n = n_1+n_2$ [3]. As one step\
    \ further, Antognini and Giovagnoli proposed an adjustable BCD to correct the\
    \ patient distribution towards balance: the more unbalanced the two groups, the\
    \ more strength is to pull the samples back to balance [4].\n\nThe `\\BCDRandomize`\
    \ macro implements the BCD of Wei [3] to generate the treatment assignment for\
    \ each new patient. Users need to input the accumulated number of patients in\
    \ each group ($n_1$ and $n_2$). At the beginning of a two-arm trial, no patient\
    \ has been recruited. We use the following code to randomize the first patient\
    \ with an equal probability to each arm, and by, the first patient is assigned\
    \ to treatment B (New Trial for Example Code 9.3)."
  merge: -1
  pgno: 430
- img_proc: true
  md: '# Example Code 9.3 Biased Coin Design


    ```

    * f(x)=1-x <- probability of assignment to A */

    * g(x)=x <- probability of assignment to B */

    * where x <- (diff in num of subjects in each trt)/(total num of subjects) */


    %macro BCDandomize(n1, n2, seed);

    data Assignment;

    %let number=EVAL(n1+&n2);

    %let denom=EVAL(n1+&n2);


    * assign subject to B with probability x, A with prob 1-x */

    if %SYSEVAL(n1&=0) & %SYSEVAL(n2&=0) then %let DiffRatio = %SYSEVALF(0)

    %let DiffRatio=%SYSEVALF(&number/&denom);

    %let Allocprob=%SYSEVALF(1/2-&DiffRatio/2);

    %let RandNum = %SYFSUNC(ranuni&=seed); *uniform[0,1] random var;

    if %SYSEVALF(&RandNum <&Allocprob) then %let Assign-A=;

    else %let Assign-B=B;

    * create subject num var * */

    %let AssignNum = %EVAL(n1+&n2+=1);

    groupA = &n1;

    groupB = &n2;

    allop = &Allocprob;

    newGroup = "Assign";


    label group = "Number in arm A"

    groupB = "Number in arm B"

    allop = "Allocation probability to arm A"

    newGroup = "Next assignment";

    run;


    proc print data=Assignment label noobs;

    run;

    %end BCDandomize;


    %BCDandomize(n1=0,n2=0,seed=123);

    %BCDandomize(n1=5,n2=10,seed=123);

    ```


