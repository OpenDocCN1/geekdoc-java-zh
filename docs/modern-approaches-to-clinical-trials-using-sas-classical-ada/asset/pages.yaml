  md: 'a potentially good product stopped for further development due to a wrong decision,
    then the sponsor''s investment on this candidate would have been wasted. For this
    reason, regulatory agencies do not strictly require any particular β to be used
    in any phase of the clinical studies. Hence, the choice of β is usually left for
    the sponsor to determine. Usually in phase III, sponsors tend to choose a smaller
    β (or higher power) for study designs so that a larger sample size will increase
    the likelihood of meeting the decision criteria with more accurate estimates (i.e.,
    narrower confidence interval around the estimates).


    However, the choice of α or β in phase II trial designs can be flexible. The two
    main reasons are: (i) decisions after a phase II clinical trial is primarily a
    sponsor decision rather than a regulatory decision and, hence the sponsor gets
    to select the level of risks that they are willing to take; (ii) there is insufficient
    evidence at phase II for the sponsor to commit a huge amount of investment. Accordingly,
    the sponsor might accept higher risks (i.e., the α or β being larger) and contain
    the level of investment directly associated to the maximum sample size.


    When designing a phase II study, if the σ has been determined, and the sample
    size is limited, then the only choice left with the project team would be whether
    to take a larger risk of making a Type I error or a larger risk of making a Type
    II error. This choice is critical because a discussion about probability of making
    a wrong decision should take place at the design stage, not after the study is
    unblinded and ready. From a frequentist toss can only be contemplated before the
    coin has landed. After the coin has landed, the observation is either a head,
    or a tail. There would be no probability associated with it. In clinical trials,
    the coin has landed when the blind is broken. At that time, clinical data are
    ready for statistical analysis, and statistics used to assess the Go/No Go criteria
    can be calculated (e.g., p-value, observed statistics, lower or upper limit of
    confidence interval). It is important to understand that such a Go/No Go statistic
    (e.g., p-value, confidence interval) is an observed statistic with the data in
    hand, and there is no uncertainty associated with it. The underlying truth test
    product is in fact efficacious or not – is still unknown. However, a Go or No
    decision will have to be made. What can be concluded at this stage, using for
