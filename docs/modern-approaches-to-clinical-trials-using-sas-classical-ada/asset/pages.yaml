  md: '# 6.2.8 Example of the Design Stage


    Rofecoxib® is a medication developed by Merck & Co. Inc. (Whitehouse Station,
    NJ, USA) for the treatment of rheumatoid arthritis (RA) and osteoarthritis (OA).
    In late 2004, Merck withdrew Rofecoxib® from the market because of concerns with
    excessive cardiovascular events. After this withdrawal, the drug development environment
    for any new antiinflammatory agents became more and challenging. For every new
    product developed to treat RA or OA, both drug safety and efficacy were followed
    very closely to ensure that the efficacy of this new product can be well established,
    while there is no signal of any safety concerns. Here, in the clinical development
    plan, after the PoC and early dose-dosing studies to demonstrate drug efficacy,
    there will be large scale, long-term phase III studies to follow for efficacy,
    cardiovascular safety, and gastrointestinal (GI) safety.


    A true case study of developing a drug to treat osteoarthritis (OA) is introduced
    here as an example [16]. This is a four-week study where patients first go through
    a screening visit. Then, after a wash-out of the current OA medication, patients
    are randomized between the treatment arms. Baseline measurements (demographic,
    medical history, background medications, efficacy, and other data) are collected
    prior to the first dose of the study drug. Thereafter, over the four-week treatment
    period, efficacy and safety measurements are continuously collected at each stage.
    Note that at the early stage of clinical development, the maximum length of the
    study is constrained by the length of animal studies completed in the non-clinical
    experiments. In this case study, the animal toxicity studies are followed up to
    4 weeks, and hence, the current clinical study is designed with a four-week study
    period.


    In order to offer the best opportunity for the new compound to show efficacy at
    the early phase II stage, the test dose to be used in the PoC should be as high
    as possible. In a typical development program for drugs treating OA, both the
    efficacy dose response and the safety dose-response relationships are assumed
    to be monotonic. Hence, the very high dose of this new product, if it does not
    demonstrate drug efficacy, the sponsor can stop this product, and then allocate'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'investments and resources into developing other compounds that have greater
    potential to become successful.


    Given the requirements of demonstrating long-term drug safety, it is critical
    for the new compound to offer doses low enough so that in the phase III studies
    where patients are exposed to long-term treatment, there is no safety concern,
    and patients can still experience the treatment benefit of efficacy. Hence, it
    is desirable in the PoC study, some dose of this new compound are explored to
    help detect a minimum effective dose (MinED). For these reasons, it is of interest
    to study a wide range of doses (so that the high dose is close to MTD to help
    with PoC, and the low dose is low enough to establish MinED).


    In this example, the project team decides to study 5 parallel dose groups covering
    a wide range. In addition to these 5 dose groups, a placebo control and an active
    control are also used to confirm the efficacy and explore drug safety. In some
    of the early phase II clinical studies, there is no active control group. Active
    controls are more likely to be used in phase III development. The reason to choose
    an active control in this case study is that, if the results fail to distinguish
    between a placebo and the tested doses, it will be unclear as to whether the test
    drug is truly ineffective, or happens to be a very high placebo response (i.e.
    placebo effect). Under this situation, the comparison between an active control
    and the placebo helps the project team to differentiate the two conditions given
    above – if the active control is clearly superior to a placebo, then it can be
    concluded that the test drug is not efficacious. On the other hand, if the data
    cannot differentiate between the active control and the placebo, then this study
    is not informative because it is still unknown as to whether the test drug is
    beneficial or not. Hence, in this study, the active control is used for reference
    purposes only. When a treatment is already available on the market for the same
    indication and targeted population, it would be unethical to consider a placebo
    arm. In such circumstances, the choice of the low dose is important to demonstrate
    the dose response together with other pragmatic considerations to ensure patients''
    care.


    For this test drug, the MTD was estimated from results observed in previous studies.
    Furthermore, the formulation group already prepared tablets with fixed drug strengths.
    Let the dose at MTD be 100% of the'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'dose strength, and the formulated tablets be at the 2.5% and the 12.5% strengths
    of MTD. Given this, five doses are selected using the BDS approach (see section
    6.2-5) by selecting the doses: placebo, 2.5%, 5%, 12.5%, 25%, and 75% of MTD,
    plus an active control. Based on this design, the dose range is 30 (= 75%/2%).
    The active control group was selected to be a popular NSAID (non-steroidal anti-inflammatory
    drug).


    Although osteoarthritis is considered an inflammatory disease, the symptom that
    an OA patient to the doctor is usually joint pain. Hence, in clinical studies
    of OA, the primary measure of efficacy on pain, or symptoms related to pain. One
    of the widely accepted clinical measures for OA is the Western Ontario and McMaster
    University (WOMAC) Osteoarthritis index [22]. The WOMAC score includes 24 questions,
    5 of these questions relate to the pain domain, 2 relate to the stiffness domain,
    and 17 relate to the function domain. In this true case study, the WOMAC pain
    domain is selected as the primary endpoint for efficacy analysis.


    From the $\alpha$-protection point of view, it is important that each study is
    designed with one primary efficacy endpoint, one primary comparison, one primary
    analysis set, and one primary time point. Under these specified conditions, it
    is less likely that the probability of a type I error will be artificially inflated.
    In this case study, the primary endpoint is change in the pain domain of the WOMAC
    score from baseline to week 4 (the primary time point for analysis). The primary
    analysis set is the intent-to-treat set. Typically, this set is defined to include
    all patients who received at least one of the randomized study treatment.


    At this point, one of the most important considerations in α control is the primary
    comparison. Given the design with five test doses placebo and an active control,
    the question is how to set the primary comparison so that the PoC decision can
    be made regarding this test drug.


    In this case study, a trend contrast with discrete doses is proposed to serve
    as the primary comparison. In this contrast, the active control is not included
    in the comparison. As discussed earlier, the NSAID to be used in this study is
    only for validation purposes, in case the concept is not proven. Hence, the proposed
    trend contrast includes only the five dosing groups plus the placebo. Here only
    one contrast is used and,'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'hence, there is no MCP adjustment. For a simple trend contrast with discrete
    doses, the treatment groups are simply ordered from low to high. The placebo response
    is assumed to be 0, the lowest dose (2.5% of MTD) is assumed to have 20% response,
    the next lowest (5% of MTD) is assumed to have 40% response, the medium dose (12.5%
    of MTD) is assumed to have 60% response, the second highest (25% of MTD) is assumed
    to have 80% response, and the high dose (75% of MTD) is assumed to have 100% response.
    Then the coefficients -5, -3, -1, 1, 3, and 5 are assigned to these treatment
    groups [16]. Hence, the first hypothesis to be tested is:


    ```

    $H_0: -5\mu_0 - 3\mu_1 + 3\mu_4 + 5\mu_5 \le 0$.

    $H_1: -5\mu_0 - 3\mu_1 + 3\mu_4 + 5\mu_5 > 0$,

    ```


    where $\mu_0$ denotes the mean of placebo group, $\mu_2$ denotes the mean of the
    5% dose group, $\mu_3$ denotes the mean of the 12.5% dose group, $\mu_4$ denotes
    the mean of the 25% dose group, and $\mu_5$ denotes the mean of the 75% dose group.


    In the case of a dose-response study with $k$ dose groups and a placebo, the sample
    size estimates based on a contrast can be derived as follows [21]. Let $\mu_i$
    be the population mean for group $i, i=0, \dots, k$, where $\mu_0$ is the mean
    from the placebo group, and let $c_i$ be the corresponding coefficients in the
    contrast. The null hypothesis of no treatment effect (i.e., weight sum of treatment
    effect across all doses) can be written as:


    ```

    $H_0: L(\mu) = \sum_{i=0}^k c_i\mu_i \le 0$ vs $H_1: L(\mu) = \sum_{i=0}^k c_i\mu_i
    > 0$, with $\sum_{i=0}^k c_i^2 = 0$.

    ```


    Under the alternative hypothesis and the condition of homogeneous variances, the
    sample size per group (i.e., equal sample size in each group) can be obtained
    as


    ```

    $n = \left[ \frac{(z_{1-\\alpha} + z_{1-\beta})^2}{\delta^2}\sum_{i=0}^k c_i^2
    \right]$

    ```


    where $z_{1-\\alpha}$ and $z_{1-\beta}$ are the corresponding quantile points
    of a standard normal distribution.'
