  md: '# 8.3.1 Asthma Trial with 75 Patients Per Group


    Consider a phase IIb study in asthma assessing the response of a new entity in
    a clinical trial. The typical phase II endpoint of interest is FEV1 (forced expiratory
    volume in 1 second) which is a common spirometry test that is used in asthma studies.
    An advantage of the FEV1 endpoint is that the length of follow-up required to
    observe changes is shorter than the typical phase III endpoint of exacerbations.
    The FEV1 endpoint is continuous and can be assumed to be normally distributed.
    The sponsor ran a couple of phase II studies for this experimental drug; the first
    study tested the effect of the maximum tolerated dose (MTD), the second study
    tested another closer to the MTD and a low dose. Based on these two previous clinical
    studies we have some understanding of the. The pre-clinical studies on this compound
    and the two phase II provide some understanding of the ED50.


    ```

    prior e0:~normal(mean=0, precision=10)

    prior emax:~normal(mean=0.20, precision=10)

    prior tau:~gamma(shape=0.001, scale=0.001)

    prior lned50:~normal(mean=0.69, precision=0.4);

    ```


    Due to knowledge around the maximum effect and the ED50 we assume an informative
    prior around the and a vague informative prior around ED50. For a Bayesian analysis,
    the precision τ=1/σ is modeled instead of the variance. For all the parameters
    in the code we notify the precision around the parameter rather than the variance.
    The prior distribution for is assumed to be normal with a mean of 0.2 (closer
    to the maximum effect) and precision equal to 10. Instead of the ED50 we model
    the exponential logarithm of ED50 in order to restrict the parameter space to
    positive. The prior distribution for the exponential also follows a normal distribution
    with mean equal to 0.69. This would correspond to an ED50 of 2. Assuming that
    a gamma distribution for τ is a standard distribution to model the precision parameter.
    It is a conjugate prior on the precision.


    The current study with the experimental drug explores a wide dosing range with
    a dosing ratio of 81. Let us assume that the trial data are available from this
    study and we analyze the data in light of the knowledge that we gained in the
    previous trials; i.e. utilizing some prior'
