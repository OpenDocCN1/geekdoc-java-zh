  md: '# 6.2.5 How to Space the Test Dosages


    Hamlett et al. proposed to use a binary dose spacing (BDS) for dose allocation,
    since this method of dose allocation is based on dividing dose intervals into
    halves [15]. Over the years, BDS has been applied successfully in many dose ranging
    designs [12,16]. In order to determine the doses using the BDS approach, it is
    assumed that the MTD is $\mathcal{T}$, thus the dose space is $[0, \mathcal{T}]$.
    Without loss of generality, $\mathcal{T}$ can be taken as 1. It is assumed that
    the dose-response relationship is monotonic. It is further assumed that the number
    of doses is known. Given this setting, doses are chosen from the interval $[0,
    1]$. Suppose we want a design with three treatment groups, including a placebo,
    a low dose and a high dose. The placebo dose is taken to be zero. The challenge
    then is to select a low and a high dose, keeping in mind that we may not want
    a high dose close to 1 (the assumed MTD). An intuitive approach might be to split
    this interval into two intervals $[0/2]$ and $(1/2,]$ and select a dose in each
    of these intervals. A natural choice is to select the midpoint of each interval
    (split each interval in half), giving the test doses $x_1=1/2^2=1/4$ and $x_2=3/2^2=3/4$.
    Note that if we choose doses in the upper (greater than 1) then these doses will
    be toxic and are generally not of primary interest in the dose-selection process.
    On the other hand, activities of the lower doses are very important information
    for drug development. Hence, the basic idea for BDS is to search for the lower
    end of the dose range.


    In another case, suppose we want to consider a design with four treatment groups
    including a placebo, low, medium and high doses. In order to avoid selecting too
    high dose, which can be toxic, we want to keep $3/2^2$ as the high dose; that
    is, leave the interval $(1/2,2]$ unchanged. Since we want to use some low doses
    to help identify the MinED, we can divide the lower interval $[0,1/2]$ and $[1/2,1]$
    in half, giving us the midpoint of these two intervals and split the two intervals
    into halves — giving the three doses $x_1=1/2^3, x_2=3/2^3$ and $x_3=3/2^2$. We
    continue in this fashion splitting the lower interval into half and taking the
    midpoint of each interval, until all the doses are allocated. In general, let
    there be $m$ test'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'doses in addition to placebo, then the test doses are given by $x_1=1/2^m$,
    $x_2=3/2^m, x_3=3/2^{m-1}, x_4=3/2^{m-2}, \dots, x_m=3/2^2$.


    Other ways of subdividing into are also possible. Instead of splitting the initial
    interval $[0, T/2]$ and $(T/2, T]$, we may use a $1/p$ cut — $[0, T/p]$ and $(T/p,
    T]$ — where $p \ge 2$ and then repeat the procedure described above. The BDS design
    is nonparametric because it does not depend on any underlying models other than
    the two assumptions: knowledge of MTD and a non-decreasing dose-response relationship.
    It provides a way to identify doses that are below the MTD and a means to potentially
    estimate the MinED.


    In addition to BDS, other algorithms could be useful, e.g., log-dose spacing,
    the Fibonacci series, and the modified Fibonacci series approach can also be considered
    [17,18]. However, it is important to note that most of these methods propose dose
    spacing from lower doses to higher doses. In practice, dose spacing should be
    considered starting with the MTD, and move down to lower doses. Hence, when applying
    any of these algorithms, the dose allocation would be reversed (from high to low,
    instead from low to high).'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# 6.2.6 Number of Doses and Control Groups


    As discussed in the previous sections, a wide dose range is critical in phase
    II dose ranging studies. Once the MTD is estimated from phase I and a wide dose
    range is considered, the natural questions to think about how many doses should
    be included in the study, whether a placebo control group is sufficient, or whether
    an active control group is also needed.


    A single test dose plus a placebo arm design may be able to demonstrate the proof-of-concept,
    but cannot, by essence, the dose-response relationship. Any attempt to interpolate
    a dose-response relationship between the placebo and the test dose would require
    very strong assumptions, which oftimes are not realistic. Therefore, a dose-ranging
    study typically needs several test dose levels. One very commonly used design
    is a four-group study with a placebo, low dose, medium dose and high dose group
    of the candidate under development. Authors suggest that more doses could help;
    that, in the first dose-ranging study, adding more doses to the study design [19].
    However, the number of doses to be used might be limited by practical and logistical
    considerations (e.g., available formulations of test doses, dose frequencies,
    convenience for outpatients to use on their own or blinding complexity, etc.).
    Given many treatment groups already included in a study, it may not be practical
    to add many test doses into the same study.


    In an early phase II dose-ranging trial design, typically the total sample size
    is limited depending on budget, availability of patients, and difficulty in recruitment.
    Under this circumstance, more treatment groups in a design imply fewer patients
    per treatment group provides a smaller precise estimate of treatment effect. Hence,
    blinding adding dose groups to a study design does not necessarily make the design
    more likely to deliver more informative results. A well-thought-out design strategy
    is needed before the dose groups can be determined.


    In our opinion, for the first dose-ranging study design, it is more important
    to cover a wide dose range, rather than simply adding more'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'doses to a narrow range of doses. This is both practical, and scientifically
    sound. In practice, a trial with 4 to 5 test doses, plus a placebo control will
    deliver a good understanding of where the test medication is most active, if the
    dose range is wide enough, and if the dose spacing is reasonable. Some simulation
    studies suggest that among the number of treatment arms (4, 5, 6, or 7, placebo
    arm included), three test doses (the 4-arm design) could be insufficient in some
    cases because it significantly limits the space of potentially relevant models
    to fit the data with clear potential impact on the ability to identify the optimal
    dose [16]. The performance increases when more than three doses are are studied.
    On the other hand, six test doses (the 7-arm design) may not necessarily deliver
    better results than the four or five test doses (the 5-arm or 6-arm design) comparisons.
    When the total sample size is fixed, the 7-arm design a smaller sample size per
    group when an equal total sample size is used, and the precision would be sacrificed.
    It may also be a good idea to consider an unbalanced sample-size allocation, e.g.,
    allocate more subjects to the extreme doses (i.e., higher dose(s) and a placebo
    arm).


    Consequently, a dose ranging including four to five test doses (in addition to
    a placebo) and covering a wide dose range provides a very useful and pragmatic
    basis in designing the dose ranging clinical trial [20].'
