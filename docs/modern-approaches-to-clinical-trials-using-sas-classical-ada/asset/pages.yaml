    As described above, this analysis approach is to strike a balance between providing
    evidence on CV safety to reassure patients and excessive delay of novel therapies
    reaching the marketplace. For any analysis strategy, one that utilizes sequential
    methodologies or not, is to maintain confidentiality of the CV results at the
    end of Stage 1 to minimize bias for the ongoing or additional trials needed to
    assess cardiovascular safety at the 1.3 margin. This includes the public, because
    knowledge of the point estimates and confidence intervals may affect the enrollment
    of current or future trials, but also includes sponsor personnel, since trial
    integrity may be compromised. It is recommended that unblinded sponsor personnel
    be independent of the study team, and limited to those individuals needed to initiate
    activities. Additional details on the confidentiality of interim results of CVOT
    trials for T2DM are available in [27, 28].'
