  md: '# 7.1 Introduction


    A well-known problem of failed phase III programs is poor dose selection resulting
    from inappropriate knowledge of the dose-response relationship (efficacy and safety)
    at the end of the learning phase of drug development, i.e., phase II. Selection
    of a dose (or doses) to carry into confirmatory phase III trials is the most difficult
    decisions in drug development. Although the exact numbers are unknown, it is believed
    that the high attrition rate plaguing the pharmaceutical industry in phase III
    studies are due, at least in part, to inadequate selection for confirming safety
    and efficacy in the intended population – doses that are too low to achieve adequate
    benefit, as well as doses that are too high and lead to dose-related safety events.


    The basic difficulty in getting the right dose is the trade-off between wanted
    and un-wanted effects. A prerequisite for informed decision making and dose selection
    at the end of phase II is, hence, a solid characterization of the dose-response
    relationships. Historically, dose finding studies were designed and analyzed based
    on multiple pairwise comparisons of the active doses against a placebo. Such traditional
    methods are mostly performed within the analysis-of-variance hypothesis testing
    paradigm and known to be inefficient in the sense that they fail to fully incorporate
    the available information across doses [1]. Modeling approaches assume a functional
    relationship between response and dose, taken as a quantitative factor, according
    to a certain parametric model, such as the model. The fitted model is then used
    to describe the dose-response relationship and estimate target doses of interest.
    Such an approach will often lead to more precise estimates of the dose-response
    relationship, due to the interpolation of information across doses. In addition,
    it provides flexibility in investigating the effects not used in the actual study.
    However, the validity of its conclusions will highly depend on an appropriate
    choice of the dose-response model, which in practice is often known.


    The MCP-Mod approach considered in this chapter is an approach for dealing with
    this model uncertainty by combining principles of multiple comparisons with modeling
    techniques to overcome some of the shortcomings of applying either approach alone
    [2]. MCP-Mod has recently been qualified as an efficient statistical methodology
    for model-'
  merge: -1
  pgno: 340
- img_proc: true
  md: based design and analysis of phase II dose finding studies under model uncertainty
    [3]. The MCP-Mod approach impacts both the design and the analysis of dose-finding
    studies. At the trial design stage, a suitable set of candidate models is identified,
    which also impacts decisions on the number of doses, required sample sizes, patient
    allocations, etc. At the trial analysis stage, dose-response is tested using suitable
    trend tests deduced from the set of candidate models. Once a dose-response signal
    is established, the best model out of the pre-specified candidate model set is
    then used for dose-response and target dose estimation. In the remainder of this
    chapter, we describe the core methodology of MCP-Mod in more detail, including
    an extension to general parametric models, illustrate its application with two
    examples, and provide the underlying SAS code.
  merge: -1
