    among the prognostic factors across different groups. For a more balanced design,
    covariate-adjusted and response-adaptive randomization procedures can be used
    to address concerns with both response and covariates. Under such a randomization
    scheme, the allocation probability is skewed to more effective treatments, and
    the distributions of the covariates are simultaneously adjusted toward balance
    [17, 18].
