    \ simply replace $S(t_j)$ in the above equations with $|S(t_j)|$.\n\nOn the other\
    \ hand, the Pampallona-Tsiatis boundaries [23] allow for early rejection of either\
    \ the null or alternative hypothesis. That means we additionally include the possibility\
    \ of stopping the trial based on convincing evidence of futility. Therefore, at\
    \ each of the first $J-1$ stages, we have two stopping boundaries, the upper stopping\
    \ boundary for early rejection of the null hypothesis and a lower stopping boundary\
    \ for early rejection of the alternative hypothesis. In the one-sided setting,\
    \ we can denote these boundaries as $C_U$ and $C_L$ respectively which satisfy\n\
    \n```\n$S(t_j) \\geq C_U(\\phi, \\alpha, \beta) t_j^{\\phi U}$\n```\n\n```\n$S(t_j)\
    \ - \\eta_j < -C_L(\\phi, \\alpha, \beta) t_j^{\\phi L}$\n```\n\nWe emphasize\
    \ that both $C_U$ and $C_L$ are positive constants, and indexed by shape parameters\
    \ of $\\phi_U$ and $\\phi_L$, that may take on different values. We also impose\
    \ one more constraint\n\n```\n$C_U(\\phi, \\alpha, \beta, J) = \\eta - C_L(\\\
    phi, \\alpha, \beta, J)$\n```\n\nso that the boundaries at the last interim look\
    \ at $t_j$ will be the same, thereby ensuring that a decision is made to reject\
    \ either of the two hypotheses. In order to calculate the stopping boundaries,\
    \ a numerical method can be applied to the boundary values using a set of two\
    \ equations\n\n```\n$P_0(S(t_1) \\geq u_1) + P_0(l_1 < S(t_1) < u_1, S(t_2) \\\
    geq u_2) + + P_0(l_1 < S(t_1) < u_1, l_2 < S(t_2) < u_2 \\sim l_{j-1} < S(t_{j-1})\
    \ < u_{j-1}, S(t_j) \\geq u_j) = \\alpha\nP_{n1}(S(t_1) \\leq l_1) + P_{n1}(l_1\
    \ < S(t_1) < u_1, S(t_2) \\leq l_2) + + P_{n1}(l_1 < S(t_1) < u_1, l_2 < S(t_2)\
    \ < u_2 \\sim l_{j-1} < S(t_{j-1}) < u_{j-1}, S(t_j) \\leq l_j) = \beta$\n```\n\
    \nwhere\n\n```\n$u_j = C_U(\\phi, \\alpha, \beta) t_j^{\\phi U}$\n```\n\nand\n\
    \n```\n$l_j = \\eta_j t_j - C_L(\\phi, \\alpha, \beta) t_j^{\\phi L}$\n```\n\n\
