  md: '# 11.4.1 Introduction


    It has been well recognized and documented that increased spending in pharmaceutical
    and biotech research does not reflect an increase of the success rate of clinical
    development. Woodcock [26] outlined some of the reasons for the declining success
    rate of pharmaceutical development namely (i) high bar for proving drug benefits
    due to diminished margin for improvement, (ii) increased costs and complexity
    potentially decreasing the ability to bring many candidates forward into the clinic,
    (iii) genetics and related disciplines are not yet fully developed, (iv) chronic
    diseases are harder for the study sponsor to choose easy targets for investigation
    and investment. The United States Food and Drug Administration (FDA) hosted a
    “Critical Path Initiative” to identify key scientific challenges underlying the
    medical product problems and then released a Critical Path Opportunities List
    in 2006 that encouraged advancement of innovative clinical trials, especially
    learning from prior experience and accumulated data. The innovation implies the
    use of adaptive design methods and the potential use of a Bayesian approach. Chow
    et al. [27] define “Adaptive design as a design that allows adaptations to trial
    and/or statistical procedures of the trial after its initiation without undermining
    the validity and integrity of the trial”. The PHRMA Working Group paper by Gallo
    et al. [28] refer to “An adaptive design as a clinical trial that uses accumulating
    data to decide on how to modify the aspects of the study as it continues, without
    undermining the validity and integrity of the trial.” In the past decade, the
    application of adaptive design methods in clinical trials has become very popular
    due to its flexibility and efficiency. This efficiency is at times gained at a
    cost of increased complexity, logistical challenges especially for adequate drug
    supply, and other operational issues. In cases, intensive planning must be undertaken
    to carefully define go/no-go criteria, which is likely to delay the start of the
    trial. The sponsor should have the adequately trained resources to implement and
    execute adaptive designs. All eventualities should be considered including the
    risk and benefits in case the trial is terminated at the interim analysis. Given
    the continuous evaluation of the electronic with several improvements in computing,
    data collection and dynamic drug supply, the frequent use of this design is not
    a distant anymore. Some of the commonly used prospective-specified'
