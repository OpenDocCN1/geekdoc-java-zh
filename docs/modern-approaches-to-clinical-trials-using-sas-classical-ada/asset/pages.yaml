  md: 'maximum sample size () of a multistage design is a function of the maximum
    information () and a nuisance parameter. For example, a test for the difference
    between two normally distributed means has $N_{max\hat{\Delta}}=4s^2/I$; a test
    for the difference between two binomial proportions $N_{max}=2(p_T)(1-p_T) + p_C(1-p_C)/I$,
    for treatments T and C.


    We replicate an example for a binary endpoint described in Tsiatiis [37]. Consider
    a hypothetical two-arm trial with equal allocation designed to test the efficacy
    of an experimental new treatment compared to the standard of care (control). We
    denote $p_T$ as the rate of response in the treatment and $p_C$ as the rate of
    response in the control arm.


    The best guess for the response on the control arm is 0.15. In order to detect
    a meaningful difference of 0.15 with $p_T=0.30$, 316 subjects are required for
    90% power for a one-sided $\alpha=0.025$ classical design. The information required
    is approximately 468. Partial output from [Example Code 3.5 Information Based
    Design - Fixed Sample Size] is presented in Figure 3.1 Output for Example 3.5.


