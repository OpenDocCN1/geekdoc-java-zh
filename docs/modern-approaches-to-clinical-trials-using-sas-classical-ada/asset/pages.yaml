  md: '# 10.1.4 Organization of this Chapter


    The purpose of this chapter is to provide an exposition on the methodology of
    optimal RAR designs to a statistician or a clinical trialist who is new to this
    subject, and to provide some SAS code to simulate treatment allocation sequences
    and operating characteristics of selected RAR designs. A particular class of RAR
    designs (optimal RAR for two-arm binary outcome trials) is chosen because it is
    quite basic, but at the same time, it incorporates all of the key elements of
    RAR, and is well suited for illustration purposes. The chapter is not meant to
    be a comprehensive study on how to choose the best RAR design for use in practice.
    For book-length discussions on this subject please refer to [14,37].


    In Section 10.2, we review and compare several optimal allocation rules for two-arm
    binary outcome trials. Section 10.3 describes RAR designs that can be used to
    converge to the chosen optimal allocation. We also discuss theoretical aspects
    of optimal RAR designs - the relationship between optimality, variability and
    power, asymptotically best RAR procedures, and statistical inference following
    RAR. In Section 10.4, we discuss Monte Carlo simulation of optimal RAR designs.
    In Section 10.5, we discuss Section 10.6 describes some additional important considerations
    and practical issues for RAR trials. In Section 10.7, we illustrate utility of
    RAR by redesigning a real life clinical trial. Concluding remarks are given in
    Section 10.8.'
