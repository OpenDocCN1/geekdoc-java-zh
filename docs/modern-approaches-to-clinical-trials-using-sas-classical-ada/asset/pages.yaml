    \ Sequential Tests for Assessing Cardiovascular Risk for Type 2 Diabetes Mellitus\n\
    \nWhen evaluating CV risk for T2DM, many development options are possible; we\
    \ limit our focus to a single cardiovascular outcomes trials (CVOT) to further\
    \ illustrate the methods used for group sequential designs. The pros and cons\
    \ of various approaches to assess CV risk for T2DM are discussed elsewhere [26,\
    \ 27]. As described above, for Stage 1 we can re-write the non-inferiority null\
    \ hypothesis $H_{10}: \\theta \\le 0$ where $\theta = -ln(\\hat{\theta} / \\lambda_C)\
    \ + 0.5878$ and $ln(1.8)=0.5878$. The alternative hypothesis becomes $H_{11}:\
    \ \\theta > 0$. This is the preferred parameterization in SAS and the code below\
    \ is used to illustrate this example.\n\nExample Code 2.11 Sequential Analysis\
    \ for Cardiovascular Outcome Trial of Type 2 Diabetes Mellitus\n\n```\n* Fixed-design\
    \ sample for Stage 1 testing, default: beta=0.1 *\nproc seqdesign;\n stagelfixed\
    \ stages=1 alt=twosided alpha=0.05;\n samplesize model=twamplesv(nullhazard=1.8\
    \ 1.0 hazard=1.0);\n```"
