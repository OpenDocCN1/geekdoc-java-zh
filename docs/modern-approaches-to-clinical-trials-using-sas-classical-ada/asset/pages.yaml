  md: '# 1.5.4 Opportunities in the Learning Phase


    An equally influential working group formed about the same time as the ADWG with
    the Adaptive Dose Ranging Studies Working Group (ADRS WG), again under the auspices
    of PhRMA. ADRS WG focused on the quantitative evaluation of adaptive designs and
    model-based methods for estimating dose-response relationships. A major objective
    of ADRS WG was to recommend when adaptive dose-ranging studies could be used and
    how much benefit they could be expected to gain. A series of white papers was
    published by the ADRS WG including [4, 63]. Major recommendations from the Group
    include the need to place selection in the broader context of the overall development
    program, and not restrict it to only the phase IIB stage. In addition, the WG
    recommends evaluating the impact of the choice of dose-ranging design and analysis
    on the probability of success (PoS) of phase III, and ultimately, the expected
    net present value of a drug candidate. The ADRS WG was merged with the DIA ADSWG
    in 2010. The work by the ADWG and continuing work by researchers on dose-response
    studies reminds researchers of the many opportunities to improve how we design
    and analyze dose-response studies.


    Thomas et al. analyzed dose-response studies conducted by a large pharmaceutical
    company for small molecules over a 10-year period (1998-2009) [64]. They also
    examined dose-response studies conducted by other drug companies [65]. They concluded
    that the dosing range and the number of doses tested were generally inadequate
    to characterize the dose-response relationship appropriately. They found that
    more than half of the studies they examined had a dose range (maximum dose divided
    by the minimum dose) less than 20. In many cases, lower doses were omitted from
    the original studies, causing the need for additional dose-response studies before
    phase III or a marketed dose to be lowered after product launch. Thomas et al.
    consider dose less than 20-fold dubious to estimate parameters of the model, the
    dose-response curve most commonly observed to fit the data. A dose range close
    to 100-fold would be more appropriate, in their opinion.


    Dose-response is a critical stage in drug development. Getting the dose'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'right at this stage critically impacts the chance of success in the confirmatory
    stage. Some simple deatons at this stage could be useful [66]. For example, trialists
    could add a lower dose or a higher dose after an interim analysis. They could
    add a dose that is between two doses already included in the study to better estimate
    the sharpest part of a dose-response curve. These types of simple adaptations
    could help us better estimate the dose-response curve and select a dose or doses
    for phase III trials if the development program moves into the confirmatory phase.


    More general dose-finding designs for studies outside of oncology are considered
    in Chapter 6 from the classical dose-finding perspective. Chapters 7 and 8 cover
    flexible modeling approaches.'
