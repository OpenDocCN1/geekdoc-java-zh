    to trastuzumab alone [16]. The primary endpoint was locally assessed progression-free
    survival (PFS), defined as time from randomization to first radiologically documented
    tumor progression or death according to Response Evaluation Criteria In Solid
    Tumors (RECIST, v1.0). It could be assumed that the median PFS time for the group
    was 6 months, while for the treatment group was 8.25 months, but about 37.5% improvement.
