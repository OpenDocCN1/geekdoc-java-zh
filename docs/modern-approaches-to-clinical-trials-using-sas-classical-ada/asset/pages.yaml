  md: "# 9.4.3 Model-Based Optimal Covariate-Adaptive Randomization\n\nTo implement\
    \ the minimization method, continuous covariates need to be categorized. However,\
    \ it is often arbitrary to determine the number of categories and the corresponding\
    \ cutoff values. As an alternative, one can develop an optimal randomization procedure\
    \ that the variance of the estimated treatment effect in the presence of covariates\
    \ is minimized. Specifically, let $Y_j$ be the outcome of the $j$th patient, $X_j$\
    \ be the $p$-dimensional covariates (including the intercept), $Z_j$ be the treatment\
    \ indicator that takes a value of 1 if the $j$th patient is assigned to the treatment\
    \ group, and -1 if to the control group. For continuous outcome $Y_j$, we assume\
    \ a linear model,\n\n```\n$Y_j = X_j^T\beta + Z_j\\epsilon_j.$\n```\n\nwhere $\\\
    epsilon_j$ is the random error that follows a normal distribution with mean 0\
    \ and variance $\\sigma^2$, $\beta$ and $\\zeta$ are the parameters to be estimated\
    \ with $\\zeta$ denoting the treatment effect. The variance of the estimated treatment\
    \ effect is\n\n```\n$Var(\\hat{\\zeta}) = \\frac{\\sigma^2}{n-Z^TX(X^TX)^{-1}Z^T}$.\n\
    ```\n\nwhere $X$ denotes the $n \times p$ matrix of covariates and $Z$ is the\
    \ $n \times 1$ vector of $Z_j, j=1..n$. Therefore, minimizing $Var(\\hat{\\zeta})$\
    \ can be achieved by minimizing the loss function\n\n```\n$L_n = Z^TX(X^TX)^{-1}Z^T.$\n\
    ```\n\nwhich can be interpreted as the number of units lost due to inefficiency\
    \ of treatment allocation.\n\nSuppose that $n$ patients have already been assigned\
    \ to the two treatment groups, and the covariates $X_{n+1}$ of the $(n+1)$th patient\
    \ have been collected. To construct a sequential randomization procedure,"
  merge: -1
  pgno: 442
- img_proc: true
  md: 'treatment assignment of the $(n+1)$th patient is chosen to minimize the loss
    $\mathcal{L}_{n+1}$ with a high probability. Atkinson [8] claimed that the allocation
    depends on


    ```

    $R_{n+1} = X_{n+1}^T(X^T X)^{-1}X^T Z$

    ```


    For example, the probability that the $(n+1)$th patient is assigned to the treatment
    group can be specified as


    ```

    $Pr(Z_{n+1}=1|R_{n+1}) = \frac{(1-n^{-1}R_{n+1})}{(1-n^{-1}R_{n+1})+(1+n^{-1}R_{n+1})}$

    ```


    where $\gamma \ge 0$ is a prescribed tuning parameter to control the degree of
    randomness [9]. Obviously, if $\gamma = 0$, the above procedure reduces to equal
    randomization; if $\gamma = \infty$, it becomes a deterministic allocation rule.
    Typically, $\gamma = 5$ is recommended to achieve a balance between the selection
    bias and the loss.


    To illustrate the model-based CAR, we apply it to assign patients with different
    prognostic factors based on the macro OptRandomize. Users need to input the data
    set of the previously treated patients (`TreatedPatients`), including their covariates
    and treatment assignments (last column). The macro then invokes the model-based
    optimal CAR to assign new patients based on their prognostic factors (`NewPatient`).
    Consider a two-arm trial with treatments A and B, and the three important prognostic
    factors are, the standardized blood pressure, and the standardized injury severity
    score. Suppose that 20 patients have been enrolled, and three more subjects enter
    the trial sequentially with their covariates provided in Example Code 9.6 Model-Based
    Optimal CAR. The OptRandomize macro carries out the model-based optimal CAR to
    examine the potential treatment assignments for the three new patients. Once the
    model is implemented for a new patient, the ModelOptRandomize macro would update
    the trial set (`TreatedPatients`) by concatenating the covariates of the new participant
    to the design matrix (`Output from Example 9.6`).


    # Example Code 9.6 Model-Based Optimal CAR


    ```

    data TreatedPatients;

    input Intercept Gender Pressure Treatment;

    ```'
