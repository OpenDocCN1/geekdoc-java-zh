  md: 'error rate control, the core idea of both methods is that the stronger evidence
    is contained in $Z_n$, the less the burden of showing significance in the final
    test statistic.


    Because of the extensive computations required of the conditional type I error
    approach, this approach is seldom used in practice. However, with software development
    for SSR on the rise, this statement is likely to change in the future. Another
    reason why these methods are seldom used in practice is probably due to the fact
    that they are too flexible. For example, the Müller and Schäfer principle allows
    not just SSR change at interim but other extensive changes such as hypothesis/endpoint
    changes and recursive insertion of interim analyses. While such flexibility is
    valuable in theory, it is rarely preferred by regulatory reviewers, especially
    for registration trials. Limited practical experience with such trial designs
    exist. One area where they may be of value is vaccine efficacy trial designs (see
    [34] for example). Because such trials typically rely on exact binomial distributions
    rather than a normal approximation for testing the null hypothesis, the flexibility
    of the Müller and Schäfer method could allow harnessing more precision in $\alpha$-spending
    when using discrete (binomial) boundaries for stopping and sample size calculations.'
