    # 11.4.2.4 Adaptive Seamless Phase II/III Design


    A seamless design combines objectives traditionally addressed in separate trials
    into a single trial. This type of design eliminates the time that would have occurred
    between the trials they had been conducted separately and may provide additional
    efficiencies in terms of the total number of patients or long-term follow-up.


    An adaptive seamless design is the combination of trials and analysis where the
    final analysis uses data from patients before and after the'
  merge: -1
  pgno: 567
- img_proc: true
  md: 'adaptation. Though this design seems very promising, the statistical methodology
    for such designs must take into consideration potential biases and account for
    multiplicity, multiple looks at the data (interim analysis), and the combination
    of data from independent stages. In previous years several adaptive seamless design
    methods have been proposed in the literature.


    One of the commonly used methods is the adaptive p-value combination method and
    its variations [38-42]. Using these methods, mid-trial design modifications including
    population selection are possible without compromising the family-wise type I
    error rate. The p-based combination methods for seamless designs have been restricted
    to a single endpoint. Another approach that has been proposed [43] uses the multivariate
    normal method which is a modification to the group sequential computation. Stallard
    and Todd extended their work to incorporate a change of endpoint. Royston et al
    [44] proposed an approach along the same lines but include related survival outcomes
    in the design. These approaches make some assumptions about the joint distributions
    of test statistics in the interim and the final stage, and between subgroup populations
    and hence, can get complicated when used for the population selection.


    In the FDA guidance on adaptive designs, seamless phase II/III designs are considered
    as a type of design "not well-understood due to both statistical and operational
    issues. In addition, seamless designs exploratory studies with "adequate and well
    controlled studies." As a result, the FDA requires that the sponsor conduct extensive
    simulations and communicate with the health authority as early as possible if
    such a design is proposed.


    # 11.4.2.5 Flexible Adaptive Seamless (Enrichment) Design


    In this design, the trial is carried out in two stages: In Stage I, all the subjects
    are recruited into the trial. On basis of interim data, it is decided to either
    continue the study in all subjects or only the biomarker-based subgroup population.
    Based on the results from the interim analysis, the Stage II test would conducted
    either on the full population, only the subgroup population or both the full and
    subgroup as a co-primary population. This is the setting of the design proposals
    by'
  merge: -1
  pgno: 568
- img_proc: true
  md: '[45-49].


    For example, Jenkins et al. [48] proposed an adaptive seamless phase II/III design
    with subpopulation selection that can be more flexible. It allows the trial to
    select the appropriate subgroup at the interim analysis or continue in all patients
    with both the subgroup and the full population. With this method, a combination
    of test statistics for the final endpoint from each stage is used for hypothesis
    testing. The decision to extend to the second stage is based on an intermediate
    or surrogate endpoint correlated to the final endpoint. This method is presented
    in the context of oncology with the progression free survival (PFS) and overall
    survival (OS) as interim and final endpoints, though it can be extended to other
    indications. In this design, having a co-primary endpoint recognizes the uncertainty
    at the interim look on the best possible endpoint and population. The additional
    flexibility is in the fact that the testing can still be done on the overall population,
    subpopulation, or the co-primary endpoint at the final analysis and also stopping
    the trial at the interim analysis for futility. This mitigates the risk of dropping
    a promising subgroup early in the trial which could be detrimental from an ethical
    and commercial perspective. The proposed design uses PFS as the intermediate endpoint
    and overall survival as though PFS has been accepted as a confirmatory endpoint
    in many cancer types. The design can be viewed as a special case or extension
    of the existing seamless design methods which combines the populations and endpoints
    of both stages in support of the licensing claims. This is done by combining the
    test statistic clinically meaningful hypothesis and the two endpoints are combined
    without any additional bias. Suppose we have a randomized, two parallel arm trial.
    We partition the trial into a learning stage and a confirmatory stage like seamless
    phase II/III trial. After collecting enough data (~50%) on the interim outcome
    (say PFS) on the first stage subjects, an interim analysis is conducted where
    both the overall population ($O_P$) and the pre-specified subgroup population
