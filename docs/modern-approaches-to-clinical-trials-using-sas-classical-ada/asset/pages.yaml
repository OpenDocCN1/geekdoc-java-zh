    # 11.4.2.3 Cross-Validated Adaptive Signature Design


    This design which is an extension of the adaptive signature design was proposed
    to optimize the efficiency of both the development and validation components of
    the adaptive signature design [36]. This design enables complete cross-validation
    of the entire sample available in the study. This procedure preserves the overall
    study-wise type I error rate and increases the statistical power to detect a clinically
    meaningful treatment difference in the subgroup of patients who benefit from the
    targeted therapy.


    Similar to the adaptive signature design, the initial null hypothesis to test
    the benefit of the targeted therapy against the control is conducted in the overall
    population, which is conducted at a slightly lower significance level α than the
    overall α. If this hypothesis is rejected, the targeted therapy is declared superior
    to the control treatment for the overall population and analysis is completed.
    If the first hypothesis is not rejected; then the signature component of the design
    is select a potentially promising biomarker subgroup, also known as the sensitive
    subset. The sensitive subset is determined by developing the classifier using
    the full population. It is done by the following steps:'
