  md: '# ### 3.3.4 Sample Size Re-estimation Based on Promising Zone


    # #### 3.3.4.1 Overview


    This method builds on a series of work by several authors [3, 27, 28]; we will
    base our description on [3]. The core idea of this method is to derive a sample
    size re-estimation rule based on the conditional power, and use a standard (i.e.
    non-modified) statistic to test the null hypothesis at the end of trial. In order
    to protect type I error, the authors of [3, 27, 28] restrict the set of conditions
    under which such procedures can be performed rather than modifying the final analysis.


    The idea of using conditional power for interim decisions is not really new or
    unique to this method. For example, the extensive discussion in [21] who, among
    other things, point out that when observed treatment effect is small, the resulting
    SSR procedure based completely on the fact that the conditional power has undesirable
    properties of the new sample size being too large. Also, the fact that most SSR
    methods have to use a non-standard test statistic at the end of the trial to control
    for type I error creates some room for potential inconsistency in the final study
    inference between classical methods (GSD) and most unblinded SSR designs.


    The promising zone design of Mehta and Pocock attempts to alleviate these concerns
    by using a conventional (in a sense of a GSD) Wald test statistic $Z_M$ for the
    final decision, arguing that if the final sample size is increased in a data-dependent
    manner, the overall type I error rate will not be inflated, provided that the
    sample size modifications are not too extreme [3]. The sample size modification
    rule is based on the conditional power assuming the treatment effect $CP_\delta$
    in future observations:


    ```

    $CP_\delta(Z_n, N-n) = CP_\delta(Z_N > z_\alpha | Z_n = z_n). (3.3)$

    ```


    Chen, DeMeets and Lan have shown that if sample size is increased only 50%, then
    one can use'
  merge: -1
  pgno: 167
- img_proc: true
  md: "conventional statistics for the final testing and the type I error rate will\
    \ not be inflated [28]. Mehta and Pocock took this approach further by lowering\
    \ the 50% CP threshold as described below [3].\n\nThe new sample size M$ per group\
    \ is selected so that $CP_{\\zeta}[Z_n, M-n]=1-\beta$. A not too extreme sample\
    \ size increase is quantified as (1) implementing a conservative cap on the total\
    \ sample size and (2) increasing sample size only if $CP_{\\min} \\leq CP < 1-\b\
    eta$, where $1-\beta$ is the targeted study power and is the minimally acceptable\
    \ conditional power that would still ensure type error preservation while using\
    \ the conventional Wald statistic at the end of the trial. The precise value of\
    \ $\beta$ is determined based on the ratios $N_{\\max}/N$ and $n/N$ on the targeted\
    \ trial $1-\beta$. For most commonly used trials, will be in a range of 30-40%.\
    \ For example, for a two-fold maximum allowed sample size increase, $N_{\\max}/N=2$,\
    \ and one interim look midway through the trial, the would be 36% for 90% overall\
    \ power [3].\n\nOne important (and controversial) point is which value of treatment\
    \ effect to use in calculating the conditional power in equation (3.3). Should\
    \ it be the treatment effect $\\Delta_0$ used to determine the original sample\
    \ size or its interim estimate $\\hat{\\Delta}$? There is no consensus or uniformly\
    \ agreed upon answer. Mehta and Pocock recommend using the observed treatment\
    \ difference, which may be justifiable somewhat restrictive requirements under\
    \ which the SSR is carried out [3]. Under their method, sample size adjustment\
    \ will occur only if the observed treatment effect is in the ballpark of what\
    \ was hypothesized, so it is unlikely to cause problems. Ghosh, Bauer, and Brannath\
    \ give pros and cons of both approaches, pointing out that neither is perfect\
    \ in practice [221]. Other authors advise against plugging-in an estimated treatment\
    \ effect into equation (3.3) and prefer the originally planned effect size, citing\
    \ lack of stability of mid-trial estimates and undesirable sample size properties\
    \ of the former [4].\n\nAs a good rule of thumb, neither option should be ruled\
    \ out a priori, and simulations should be conducted to evaluate operating characteristics\
    \ of both options. The result may very well depend on the meaningful range of\
    \ possible underlying treatment effects. If that range is too wide (i.e. extends\
    \ beyond clinically meaningful differences and the range of therapeutic value)\
    \ then it is probably impossible to settle on a SSR result that would give a uniformly\
    \ good performance."
