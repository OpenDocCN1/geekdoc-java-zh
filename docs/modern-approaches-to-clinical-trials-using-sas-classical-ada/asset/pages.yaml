  md: '# 6.2.1 Dose-Response Relationship


    In most cases, phase II features a learning period when the patient population
    may be first exposed to the test therapy for evidence of clinical benefit and
    risk; it is also a period to explore and recommend alternative doses to be tested
    in the later phase (e.g., phase III) confirmatory clinical trials. In the development
    of a first-in-class new chemical entity, the first phase Ia study is referred
    to as a proof-of-concept (PoC) study followed by phase Ib called dose-ranging
    studies. A PoC study is often faster and cheaper because it only requires a well-tolerated
    dose of test therapy plus a control group (e.g., placebo), as appropriate. A dose-ranging
    study, needs multiple doses of the test therapy to characterize the dose-response
    relationship. Therefore, a classical phase II development program usually consists
    of a small-scale PoC trial followed by moderately sized dose-ranging studies.


    Dose ranging studies are too often designed with a very small number of doses
    [5]. A dose ranging typically includes a placebo (representing zero dose), and
    several doses of the test product. One common design is a four-group study with
    placebo, low dose, medium dose, and high dose groups of the drug candidate under
    development. When designing a dose ranging study, it is important to keep the
    following questions in mind to achieve the study objective:


    +   1. What dose-range should be considered in the study?


    +   2. Was the concept proven?


    +   3. How do you space the test dosages from the placebo to the maximum tolerated
    dose (MTD)?


    +   4. How many treatment arms or dosage levels should be included?


    +   5. What are the total sample size and allocation schedule?


    Conceptually, the efficacy of a drug increases as the dose increases'
