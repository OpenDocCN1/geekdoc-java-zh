  md: '# 9.3.1 Permuted Block Randomization


    With equal probabilities of assignment, the number of patients in each arm is
    supposed to be close. Nevertheless, simple randomization typically cannot guarantee
    a perfect balance across different arms, especially when the sample size is small.
    By contrast, the restricted randomization aims aims to achieve an equal number
    of subjects in each treatment arm, for which two such procedures are introduced
    below.


    The most popular technique for restricted randomization is the so-called permuted
    block randomization. Considering a sequence of blocks, each block contains a prespecified
    number of treatment assignments, which are permuted in a random order. For illustration,
    in a three-arm randomized trial with treatments, A, B, and C, the possible permutation
    sequences using a block size of three are the following:


    +   1. ABC


    +   2. ACB


    +   3. BAC


    +   4. BCA


    +   5. CAB


    +   6. CBA.


    At the randomization step, a block is chosen randomly, and suppose that the third
    block is selected, BAC; that means, the first patient in the block receives treatment
    B, the second receives A, and the third receives C. This procedure ensures that
    exactly one patient is assigned to each treatment arm within the block. Obviously,
    such permuted randomization guarantees the number of patients allocated to each
    treatment arm to be the same. The permuted block is particularly useful in multi-center
    trials, where it can be used to balance treatments within each study center and,
    thus, has benefits for'
  merge: -1
  pgno: 427
- img_proc: true
  md: "understanding between-center effects.\n\nproc plan can be utilized to generate\
    \ the entire randomization scheme based on permuted block randomization. For example,\
    \ in a two-arm trial, eight patients are enrolled for treatment assignment. With\
    \ a block size of 4, there are six possible block patterns, i.e., $\binom{4}{2}=6$.\
    \ To invoke proc plan, we need to specify the number of blocks, the block size,\
    \ and the number of treatments, as shown in [Example Code 9.2 Permuted Block Randomization]()\n\
    \n# Example Code 9.2 Permuted Block Randomization\n\n```\nproc plan seed=3;\n\
    factors Block=2 sequence=4 ordered / noprint;\ntreatments Treatment=4;\noutput\
    \ out=PermutedBlock Treatment cvals=('A' 'A' 'B' 'B') random;\nrun;\nproc sort\
    \ data = PermutedBlock;\nby block sequence;\nrun;\nproc print data = PermutedBlock;\n\
    run;\n```\n\nThe output for this permuted block design represents the treatment\
    \ assignments of the eight patients. The result result shows that the first block\
    \ selected in the trial is block 2, and the first two patients in block 2 receive\
    \ treatment B and the other two receive treatment A ([Output for Example Code\
    \ 9.2]()).\n\n# Table 9.3 Output for Example Code 9.2\n\n| Block | Sequence |\
    \ Treatment |\n| --- | --- | --- |\n| 1 | 1 | A |\n| 1 | 2 | B |\n| 1 | 3 | B\
    \ |\n| 1 | 4 | A |\n| 2 | 1 | B |\n| 2 | 2 | B |\n| 2 | 3 | A |"
