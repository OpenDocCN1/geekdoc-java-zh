  md: 'of the trial so that the trial can better address the questions it is designed
    to answer.


    In 1.2 Evolution of Clinical Trials and the Emergence of Guidance Documents through
    1.5 Widespread Research on Adaptive Designs Since the Turn of the 21st Century,
    we discuss the evolution of clinical trials conducted with fixed trials, often
    done in a single or a few centers, to the more complex multicenter adaptive trials
    conducted by many manufacturers today. Group sequential design, which is an adaptive
    design, emerged in the early 70s. As the trial community began to embrace group
    sequential design adaptive reassessment methods to search for the maximum tolerated
    dose in Phase I trials. Sample size re-estimation, both blinded and unblinded,
    was developed in the 90s and early part of the 21st century. During the first
    decade of the 21st century, significant efforts were dedicated to adaptive dose-ranging
    studies. Many of these designs are discussed in great detail in this book with
    companion SAS code to assist in their implementation.


    As treatment became more personalized, adaptive designs have been proposed to
    help select the patient population for whom a new drug may be more effective.
    As better computational tools became more readily available, designs that incorporate
    information outside of the trial using Bayesian methodology have been explored
    and implemented. Despite the tremendous progress made over the past three decades,
    challenges and opportunities in designing, conducting, and analyzing adaptive
    trials remain. We discuss some of them in 1.6 Opportunities and Challenges in
    Designing, Conducting, and Analyzing Adaptive Trials.


    We conclude this chapter with a discussion of the future adaptive trials to support
    drug development in 1.7 The Future of Adaptive Trials in Clinical Drug Development.'
