  md: '# 5.4 Fractional Continual Reassessment Method


    Most of the dose-finding methods, including the aforementioned CRM and BMA-CRM,
    require the DLT outcomes to be ascertainable shortly after treatment. In other
    words, the toxicity outcomes of all the previously treated patients must be available
    in order to determine the next dose assignment. However, it may take a long period
    of time to measure the DLT outcomes after treatment. In a more common scenario,
    if the patient accrual is fast and the toxicity enrollment, missing toxicity data
    arise as the outcomes of the patients under treatment may still be unavailable
    when that information is needed. For example, in radiotherapy trials, DLTs often
    occur long after the treatment is finished. In a phase I trial with pancreatic
    cancer, the goal was to determine the MTD of oxaliplatin with combination with
    gemcitabine and the concurrent radiation therapy [7]. The accrual rate was one
    patient every two weeks, whereas it took on average nine weeks to assess the toxicity
    outcome of each patient after the treatment was initiated. Consequently, at the
    moment of dose assignment for a newly arrived patient, the patients under treatment
    might not have completed the full assessment period and, thus, the non-toxicity
    outcomes could be considered missing or censored at that.


    To accommodate late-onset toxicity, we can model the underlying times to toxicity
    through the well-known Kaplan-Meier estimator [8,9]. An alternative approach to
    handling censored data is to redistribute the mass of each censored observation
    to the right [10,11]. Typically, there is a prespecified toxicity evaluation window
    to determine the DLT outcome. Within the evaluation window [0, τ], if a patient
    experiences the DLT, we take y=1; if a patient still has not experienced the DLT
    after time τ, we take y=0. Due to continual decision making on dose assignment
    for each new cohort, patients currently under treatment may not have experienced
    the DLT when a new cohort of patients is ready for treatment. Under such circumstances,
    the toxicity event can be viewed as censored data, and we adopt the redistribution
    to the right approach by splitting the mass of 1 between the censoring point and
    beyond τ (anywhere that is larger than τ). In the construction of the likelihood
    function, only the weight assigned to the censoring time point within [0, τ]'
  merge: -1
  pgno: 267
- img_proc: true
  md: "makes the contribution, and the weight assigned beyond $\tau$ does not contribute\
    \ to the likelihood. Thus due to censoring, we can only count on fractional information\
    \ of the censored data. In contrast, the naive method may simply discard the missing\
    \ data as if no toxicity would ever occur in the future, which inevitably loses\
    \ useful information for decision making.\n\nTo fully utilize the follow-up time\
    \ information, more data need to be collected during the trial conduct, for example,\
    \ patients' enrollment dates, decision-making dates (censoring times), and the\
    \ dates of toxicity occurrences (event times). For subject $i$, let $t_i$ denote\
    \ the time to toxicity occurrence, and let $u_i (u_i \\le \tau)$ denote the actual\
    \ follow-up time (up to the decision-making time on dose assignment for the next\
    \ cohort) that censor $t_i$. We assume $u_i$ to be independent of $t_i$, because\
    \ the arrival time of a new cohort is typically independent of the time to toxicity\
    \ due to patients' staggered entry. Censoring arises when patients have not noticed\
    \ $(u_i < t_i)$ and not completed the follow-up to $\tau (u_i < \tau)$. If the\
    \ toxicity event of subject $i$ is censored, the fractional contribution of this\
    \ subject is given by\n\n$Pr(t_i < \\tau | t_i > u_i) = \\frac{Pr(u_i < \\tau)}{Pr(t_i\
    \ > u_i)}$\n\nwhich is the conditional probability of occurrence of the toxicity\
    \ event in $(u_i, \\tau)$ given that no toxicity has occurred yet by time $u_i$.\
    \ As a result, the collected data in the trial include 0, 1, and some fraction\
    \ between 0 and 1. The fractional contribution for a censored toxicity outcome\
    \ can be easily estimated by\n\n$$\\hat{y}_i = \\frac{\\hat{S}(u_i) - \\hat{S}(\\\
    tau)}{\\hat{S}(u_i)}$\n\nwhere $\\hat{S}(\\cdot)$ is the usual Kaplan-Meier estimator.\
    \ More specifically, for subject $i$, we define $y_i=0$ if the DLT has not occurred\
    \ by time $\tau$, $y_i=1$ if the DLT has occurred by time $\tau$, or $y_i=\\hat{y}_i$\
    \ if the DLT is censored before time $\tau$. For not clarity, denote $p_{j(i)}=p_j$\
    \ if subject $i$ is treated at dose level $j$, let $n$ be the total number of\
    \ patients treated in the trial far, and let $D$ denote the observed data. Based\
    \ on the fractional scheme, the likelihood function under the CRM power model\
    \ can be written as"
