    a fixed trial (Example Code 2.4), assuming 90% power and two-sided $\alpha=0.05$
    per Stage, and equal allocation between the two arms. Only the hazard for the
    treatment arm needs to be specified in the hazard option. A two-sided test is
    implied by the literature, stopping boundaries can be limited to the one-sided
