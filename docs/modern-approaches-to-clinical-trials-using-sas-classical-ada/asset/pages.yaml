  md: '# 11.2 Classical Designs'
  merge: -1
  pgno: 533
- img_proc: true
  md: '# 11.2.1 Retrospective Design


    Classical population enrichment designs fall into two categories: retrospective
    enrichment design and prospective enrichment design.


    Retrospective enrichment design is a traditional all-comers design with retrospective
    validation of a biomarker, usually not available or assess at the beginning of
    the trial, making prospective testing unfeasible. Retrospective validation is
    conducted after the completion of the study and may involve previously conducted
    trials in the same patient population. As stated by Mandrekar and Sargent [1]
    when conducted appropriately, this design can aid in bringing forward effective
    treatments to marker-defined patient populations in a timely manner that might
    otherwise be impossible due to ethical and logistical considerations. For such
    large trial and long time to complete analysis to be valid and to minimize bias,
    Mandrekar and Sargent [1] summarized a list of essential elements that are critical
    to retrospective validation studies.


    +   1. Data from a well-conducted randomized controlled trial


    +   2. Availability of samples on a large majority of patients to avoid selection
    bias


    +   3. Prospectively stated hypothesis, analysis techniques, and patient population


    +   4. Predefined and standardized assay and scoring system


    +   5. Upfront sample size and power justification


    The development of EGFR-inhibitors cetuximab and panitumumab for metastatic colorectal
    cancer (CRC) as an example. Cetuximab and panitumumab were initially marketed
    for the indication of EGFR+ CRC, which represents 65% of advanced colorectal cancer
    patients. Based on retrospective analysis of previously conducted randomized phase
    III II trials [2-4], it has been demonstrated that cetuximab significantly'
  merge: -1
  pgno: 534
- img_proc: true
  md: improves the overall survival for patients with wild-type KRAS (a protein that
    in humans is encoded by the KRAS gene), with no survival benefit in patients harboring
    KRAS-mutant status. As a result, in July 2009, the FDA approved cetuximab for
    treatment of KRAS-wild type colon cancer. Similarly, in a prospectively specified
    analysis of data from a previous [5], the randomized phase III trial of panitumumab
    versus best supportive care the hazard ratio for progression-free survival (PFS)
    comparing panitumumab with best supportive care in the KRAS wild type and mutant
    subgroups was 0.45 and 0.99, respectively, with a statistically significant treatment
    by KRAS status interaction (p<0.0001). Given the lack of activity in the KRAS-mutant
    group, the label was changed to include wild-type patients only in 2009.
  merge: -1
  pgno: 535
- img_proc: true
  md: '# 11.2.2 Prospective Design


    # 11.2.2.1 Enrichment/Targeted Design


    Although retrospective evaluation of predictive biomarkers could save resources
    and time, and make effective treatments available to patients in a much expedited
    timeframe, it may introduce serious bias due to the nature of retrospective selection
    of patient subgroups and lack of controlled validation of biomarkers. Hence, prospectively
    designed trials are still the gold standard in the clinical development of targeted
    therapies and predictive biomarkers.


    Enrichment design is also referred to as biomarker-enrichment design or gene-enrichment
    design. All patients in the trial may not generally benefit from the study treatment
    under consideration. The goal of the enrichment designs is to study the clinical
    benefit in a subgroup of the patient population defined by a specific biomarker
    status. In this design, the patients are screened for the presence or absence
    of a biomarker(s) profile. After extensive screening, only patients with the presence
    of a certain biomarker characteristic or profile are enrolled in the clinical
    trial [6–7]. In principle, this design essentially consists of an additional criterion
    for patient inclusion in the trial (Figure 11.1 Enrichment Design).


    Figure 11.1 Enrichment Design


    ![](img/f4ec2665c3484c528370923aeb5cb99f_536_0.png)


    A recent example for the enrichment design was of mutated BRAF-kinase [8]. Almost
    50% of melanomas have an activating V600E BRAF mutation. This leads to the hypothesis
    that inhibition of mutated BRAF'
  merge: -1
  pgno: 536
- img_proc: true
  md: 'kinase will have meaning clinical benefit. Hence, only patients who tested
    positive for V600E BRAF mutation were enrolled in the study. Patients were randomized
    to an inhibitor of mutated BRAF-kinase or control treatment. As hypothesized,
    the large treatment benefit was observed in the pre-specified subgroup. Another
    example for enriched design was used in the HER2 trial with patients with HER2+
    breast cancer [9]. During the conduct of the study, it is important to have rapid
    turnaround times for the assay results in order to enroll patients faster. In
    addition, the assay testing should be consistent between different labs. For example:
    a high discordance was found between the local and central testing for HER2 status.
    Hence, the Herceptin therapy may have benefitted a potentially larger group than
    defined as HER2+ by central testing.


    The following considerations should be taken into account in this design – 1)
    a smaller sample size is usually required but the screening may still take the
    same amount of time (or even longer as explained below) with an all-comers designs
    given the extensive pre-screening testing that will be conducted before enrollment;
    2) the marketing label will be restricted; 3) there may still be a subset of patients
    who benefit with the new treatment; 4) restricted enrollment does not provide
    data to establish that treatment is ineffective in biomarker negative patients;
    5) a low prevalence of the marker may be challenging operationally and financially.
    Operationally, the biggest challenge is in recruitment, and financially it may
    not be commercially attractive.


    The efficiency of this design is a function of the percent of biomarker positive
    patients who are likely to benefit by the target treatment, and the reliability
    and reproducibility of the assay also plays a pivotal role. This design is appropriate
    when the mechanistic behavior of drug is known and there is compelling preliminary
    evidence of a benefit to a subset population.


    The rest of Section 11.2.2 focuses on the all-comers/unselected design and its
    variations. These designs differ from each other by the primary hypothesis test,
    randomization, and multiplicity approaches, which, in turn, affect the operating
    characteristics of the design, including sample size, power and type I error rate.'
  merge: -1
  pgno: 537
- img_proc: true
  md: '# 11.2.2.2 Marker by Treatment Interaction Design


    Marker by Treatment Interaction Design is also called biomarker-stratified design
    [7]. This design is chosen when there is no preliminary evidence to strongly favor
    the trial to patients with a specific biomarker profile that would necessitate
    a biomarker-enrichment design. This design is prospective and leads to a definitive
    marker validation strategy. In such cases, marker by treatment or stratified design
    is more informative than biomarker-enrichment design. In this design, the patients
    are tested for biomarker status and then randomized separately according to their
    positive or negative status of the marker [6]. Thus, the randomization is done
    using marker status; however, only the patients with a valid measurable marker
    results are randomized. Patients in each marker group are randomized to two separate
    treatments (Figure 11.2 Marker by Treatment Interaction Hypotheses). Two separate
    hypotheses are conducted to determine the superiority of one treatment over the
    separately within each marker group. The sample size is calculated separately
    to power the testing within each marker sub-group. Another variation to the hypothesis
    within the same design is to conduct a formal marker by treatment interaction
    test to see if the treatment effect varies within each marker status subgroup.
    In this case, the study is viewed as two stand-alone trials; however, it is different
    from a large clinical trial by the calculation of the sample size and restriction
    of the randomization to only patients with a valid marker result [1].


    Figure 11.2 Marker by Treatment Interaction Design


    ![](img/f4ec2665c3484c528370923aeb5cb99f_538_0.png)


    # 11.2.2.3 Sequential Testing Strategy Design'
  merge: -1
  pgno: 538
- img_proc: true
  md: 'In principle, sequential testing designs can be considered as a special case
    of the classical randomized clinical trial for all comers or unselected patients.


    # Test Overall Difference Followed by Subgroup


    Simon and Wang [10] proposed an analysis strategy where see if there is a difference
    in the response in new treatment versus the control group. If there is no difference
    and the response is not significant at a pre-specified significance level (for
    example 0.01), then the new treatment is compared to the control group in the
    biomarker status positive patients. The second comparison uses a threshold of
    significance, which is the proportion of the traditional 0.05 not utilized by
    the initial test. This approach is useful when the new treatment is believed to
    be effective in a wider population, and the subset analysis is supplementary and
    used as a fallback option.


    For example, if the trial is planned for having 90% power for detecting a uniform
    overall hazard using a two-sided significance level of .03, then the overall analysis
    will take place when there are 297 events. If the test is positive in 25% of patients
    and the test is not prognostic, then at the time of the analysis there will be
    approximately 75 events among the test positive patients. If the overall test
    of treatment effect is not significant, then the subset test will have 75% power
    for detecting a 50% reduction in hazard at a two-sided .02 significance level.
    By delaying the treatment evaluation in the test positive patients, 80% power
    can be achieved when there are 84 events and 90% power can be achieved when there
    are 109 events in the test positive subset.


    Song and Chi [11] later proposed a modification of the above method. Their method
    takes into account the correlation between the test statistics of the hypotheses
    of the overall population and the biomarker positive population.


    # Test Subgroup Followed by the Overall Population


    Bauer [12] investigated the multiple testing in the sequential sampling. Here
    the hypothesis for the treatment is first tested in the biomarker positive status
    patients and then tested in the overall population. This'
  merge: -1
  pgno: 539
- img_proc: true
  md: 'strategy is appropriate when there is a preliminary biological basis to believe
    that the biomarker status patients will benefit more from the new drug and there
    is sufficient marker prevalence to appropriately power the trial. In this closed
    testing procedure, the final type I error is always preserved. The approach of
    first testing in the subgroup defined by marker status has been implemented in
    the ongoing US-based phase III trial cetuximab, in addition to infusional fluorourouracil,
    leucovorin, and oxaliplatin as adjuvant therapy in stage III colon cancer [13].
    While the trial has now been amended to accrue only patients with KRAS–wild-type
    tumors, approximately 800 patients with KRAS mutant tumors have already been enrolled.
    In this trial, the primary analysis would be conducted at the 0.05 level in the
    patients with wildtype KRAS. A sample size of 1,035 patients with wild-type KRAS
    per arm would result in 515 total events, providing 90% power to detect a hazard
    ratio of 0.75 for this comparison using a two-sided, log-rank test at a significance
    level of 0.05. If this subset analysis is statistically significant at P =0.05,
    then the efficacy of the regimen in the entire population will also be tested
    at level 0.05, as this is a closed testing procedure. This comparison using all
    2,910 patients will have 90% power to detect a hazard ratio of 0.79 comparing
    the two treatment arms, based on a total of 735 events.


    # 11.2.2.4 Biomarker-Analysis Design


    Biomarker-analysis design [14] essentially has two elements. The first element
    is a randomized trial with the presence or absence of the biomarker examined in
    all participants followed by the identification of a promising subgroup. This
    is done by using a plot of treatment benefit versus cut-points or intervals of
    the biomarker. It is critical in this design that the specimen is at least collected
    at the randomization event if it is not examined, though it is preferred that
    is examined at randomization. Collection of the specimens priori can mitigate
    the risk of non-compliance with the treatment due to the incoming knowledge of
    the marker data [15]. As the data trickles in, the investigators need to assess
    the risk and benefit especially from an ethical perspective of concealing the
    new information.


    This design can assist in understanding the following hypothesis test: (a) Targeted
    Treatment versus Standard of Care in the overall population; (b) Targeted Treatment
    versus Standard of Care in the biomarker'
  merge: -1
  pgno: 540
- img_proc: true
  md: 'positive population; (c) Targeted Treatment versus Standard of Care in the
    biomarker negative population; (d) marker-based treatment selection versus targeted
    therapy and (e) versus standard of care. With multiple hypotheses that can be
    tested for (a) to (e), the significance levels and confidence intervals need to
    be adjusted according to the type and the number of hypotheses under consideration.


    The biomarker subgroup selection using the cut-points can be done using plots.
    Various plots have been proposed in the literature which assists in better visualization
    and understanding of the cut-points and intervals. Some of these plots present
    confidence intervals that adjust for multiplicity. The following are some of the
    commonly used plots:


    +   1. Marker-by-treatment predictivity curves [16] - the risk of the response
    is plotted separately under targeted therapy and standard-of-care treatments for
    subjects with a marker in the interval.


    +   2. Selection impact curve [17] - benefit of marker-based treatment selection
    is plotted directly as a function of marker cut-points.


    +   3. Tail-oriented subgroup plot [18] - The estimated benefit of targeted therapy
    against the standard of care is plotted among subjects with a marker level greater
    than a cut-point as a function of different clinically meaningful cut-points.
    Hence, the tail of the distribution is specified when the estimated benefit is
    plotted for a marker level above a certain cut point.


    +   4. Sliding-window subgroup plot [19] - The estimated benefit of targeted therapy
    against the standard of care is plotted among subjects with a marker level within
    an interval as a function of marker level. Hence, the sliding window is specified
    when the estimated benefit is plotted for a marker level within a certain interval.


    The tail-oriented subgroup plot and sliding window plots [20] give confidence
    intervals that account for multiple testing of several cut-points or intervals.'
  merge: -1
  pgno: 541
- img_proc: true
  md: 'Baker and Kramer [21] proposed a special case of biomarker analysis design
    for rare events. In this design, all subjects are randomized to either the targeted
    therapy or the control. The specimens are collected but not examined at the time
    of randomization. Subjects are randomly selected at the end of the trial to test
    for the presence or absence of the marker. The probability of random selection
    is ascertained based on the positive outcome of interest. King et al. [22] proposed
    testing the marker only for the subjects with a positive outcome of interest.
    This type of design can be referred to as biomarker-nested case-control design.


    # 11.2.2.5 Marker-Based Strategy Design


    In this design, patients are randomly assigned to treatment dependent or independent
    of the marker status (Figure 11.3 Marker-Based Strategy Design). All patients
    randomized to the non-biomarker based arm receive the control treatment. In the
    biomarker based arm, the patients receive the targeted or experimental therapy
    if the marker is positive or negative. The outcome of all patients in the marker
    based subgroup is compared to that of all patients in the non-marker sub-group
    to investigate the predictive value of the marker. One downside of this design
    is that patients treated with the same regimen are included on both the marker-based
    and the non-marker-based subgroup, resulting in a substantial redundancy, which
    leads to many patients receiving the same treatment regimen in both subgroups.
    Hence, this design can reduce the treatment effect especially if the prevalence
    of the marker is high requiring a large sample size. This is illustrated in the
    following example, in the ERCC1 trial [23] and presented in [6] about 57% of the
    biomarker-based strategy patients were assigned to the same regimen of cisplatin+docetaxel
    as in the standard of care arm. Thus, the comparison weakens the between treatment
    effect difference and reduces the statistical power to reject null hypotheses.
    This can lead to getting incomplete information or it may miss a valuable biomarker
    in addition to delaying the evaluation of the biomarker due to the increased sample
    size required to achieve a desired power. One disadvantage of this design is the
    inability to examine the effect of targeted therapy in patients in the negative
    marker status group as none of these patients receive it. Even if the patients
    in the negative marker status group respond to the targeted therapy, this'
  merge: -1
  pgno: 542
- img_proc: true
  md: 'cannot be assessed. The treatment difference between the new treatment and
    the control treatment can be diluted by marker-based treatment selection and sometimes
    it can be a poor choice as compared to the randomized design.


    A modified version of this design has been proposed where the negative marker
    status group undergo randomization and receive the targeted therapy or the control.
    Thus, the modified design allows assessment of the targeted therapy in both the
    biomarker positive and the negative subgroup. It helps to assess whether the efficacy
    of the marker positive patients to therapy is because of the marker status being
    positive or due to an improved treatment regardless of marker status. The assessment
    can also be done retrospectively if the classification of marker needs to be revisited.


    # Figure 11.3 Marker-Based Strategy Design


    ![](img/f4ec2665c3484c528370923aeb5cb99f_543_0.png)


    # 11.2.2.6 Hybrid Design


    Hybrid designs should be considered when there is strong evidence from pre-clinical
    or prior studies that there is efficacy of some treatment(s) on the marker-based
    sub-group [1]. This makes it almost impossible, due to ethical reasons, to randomize
    patients with a particular marker to other treatment options. It is very similar
    to the enrichment designs, and all patients are examined for marker status and
    randomly assigned to treatment or assigned to standard-of-care treatment for patients
    with positive biomarker values. However, only a marker-positive subgroup of patients
    are randomly assigned to treatments, whereas patients in the marker-negative group
    are assigned to a control or standard-of-care treatment (Figure 11.4 Hybrid Design).
    The study is powered to detect treatment difference only in the marker-positive
    group. Samples are collected from all of the subjects to help testing for additional
    markers in the future.'
