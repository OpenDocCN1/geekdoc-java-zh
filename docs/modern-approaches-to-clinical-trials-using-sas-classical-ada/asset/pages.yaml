  md: '# 7.2.2 MCP-Mod for General Parametric Models


    In this section we describe an extension of the MCP-Mod procedure to acknowledge
    the fact that in practice the modeling situation and study design are more complex
    than described above for a normally distributed endpoint. For example, the response
    variable might be a count, binary, or time-to-event variable instead of being
    normally distributed. In, the final analysis usually has to be adjusted for relevant
    covariates (e.g. region, age, ...), patients'' measurements are often recorded
    over time (necessitating the use of longitudinal models), and patients might receive
    more than one treatment (such as cross-over or incomplete block designs). The
    core ideas of MCP-Mod remain applicable in these situations, as described here
    and laid out in [4] more detail.


    Let $y$ denote the response vector of an experimental unit in the trial (e.g.,
    a patient) which has been assigned a dose $d$ (the formulation can be easily extended
    to the case of multiple doses). We assume that the residual distribution function
    is given by $y-F(z, \eta, \mu(d))$ where $\mu(d)$ denotes the dose-response parameter,
    $\eta$ the nuisance parameters, and $z$ possible covariates. The key features
    of MCP-Mod can then be formulated with respect to $\mu(d)$, including:


    +   - accounting for uncertainty in the dose-response model via a set of candidate
    dose-response models


    +   - testing for a dose-response signal via optimal contrasts based on plausible
    dose-response shapes


    +   - model selection or model averaging to combine different models


    +   - dose-response estimation and dose selection using nonlinear regression.


    Because all dose-response information is assumed to be represented by $\mu(d)$,
    the interpretability of this parameter is critical for communicating with clinical
    teams, choosing candidate dose-response shapes,'
  merge: -1
  pgno: 348
- img_proc: true
