  md: '# 1.6 Opportunities and Challenges in Designing, Conducting, and Analyzing
    Adaptive Trials'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 1.6.1 Logistics in Trial Execution


    Implementing an adaptive trial requires operational support on many fronts. These
    include a versatile randomization system, nimble drug supply management, data
    monitoring support, timely access to fit-for-use data, process and documentation
    control. A detailed document that describes the rationale and execution of the
    pre-planned adaptations should be prepared in advance. The document should also
    describe the interim analysis plan including who will conduct the interim analysis
    and whether an internal or external DMC will review the interim data. For confirmatory
    trials, access to interim results by the sponsor should be strictly controlled.
    If sponsor access is foreseen for unique circumstances, the interim plan should
    describe in detail within the sponsor may have access and under what circumstances.
    The plan should describe steps taken to prevent additional access of information
    within the sponsor organization. If sponsor access did occur, it should be clearly
    documented in the clinical study report. In the latter case, the clinical study
    report should discuss steps taken to minimize potential bias that may be introduced
    to the trial as a result of sponsor’s access to interim data.


    In general, interim analysis should be conducted by a statistician independent
    of the study team, or by a statistician who is a member of the DMC for the study.
    The detailed document mentioned above should be endorsed by the DMC. When recommendations
    requiring actions for a confirmatory study arise, final decisions on actions are
    often made by the trial’s executive (or steering) committee that normally includes
    sponsor representatives. Antonjevic et al. recommend that a single DMC with all
    necessary expertise be convened to monitor and execute the pre-planned adaptation(s)
    [69]. In other words, they advise against having a separate monitoring committee
    whose sole responsibility is to look after the implementation of pre-planned adaptations.


    One key challenge in implementing adaptive trials is the management of drug supply
    if adaptations result in drug supply change. A member from the drug supply organization
    should be part of the clinical team that plans an adaptive trial. Manufacturing
    of clinical study supplies, especially when they need to be matched or blinded,
    is costly and can'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'be resource intensive. In addition to upfront costs, issues such as expiry
    dates for existing drug must be considered. Therefore, it is important to get
    drug supply personnel involved in the planning of an adaptive trial as early as
    possible. The extent that drug supply and associated allocation (randomization)
    procedures can accommodate design changes is an important factor when considering
    an adaptive design.


    Adaptive design requires timely access to fit-for-use data for interim decisions.
    If time-to-event endpoint requires adjudication, adjudication on the number of
    events required for the interim analysis to take place prior to the planned interim
    analysis. Failure in timely access to fit-for-use data could compromise the effectiveness
    of an adaptation plan. However, we want to point out that the need for fit-to-use
    data for interim analysis for an adaptive trial is the same as that needed for
    a trial using a traditional group sequential design.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# 1.6.2 Open Research Questions


    There are many opportunities for continuous improvement to increase the value
    and acceptance of adaptive design in the next two decades. We cite 4 as examples
    below.


    +   1. Statisticians have generally solved the problem of controlling the overall
    type I error rate for confirmatory adaptive trials although debates on whether
    simulations can sufficiently demonstrate type I error control. The challenge of
    estimating treatment effect in the presence of adaptations, on the other, remains
    a research question for some designs such as the promising zone design.


    +   2. Statisticians should help set the right mindset about adaptive designs
    through education and training. There are many occasions when a classic fixed
    design is the best choice for a situation. Statisticians should work with internal
    and external decision makers to help lead the discussion on what are appropriate
    design options for a particular situation.


    +   3. Statisticians need to be aware of the operational support needed to implement
    an adaptive trial. If the design is too complicated or if the infrastructure needed
    to support its implementation is not available, a team needs to consider carefully
    whether an adaptive trial is a good choice even if the planned adaptations can
    result in some benefit.


    +   4. Statisticians need to remember the assumptions underlying adaptive designs.
    For example, the assumption of a stationary population is critical for an adaptive
    trial. If some of the fundamental assumptions are in question, one needs to think
    about whether an adaptive design is appropriate for a situation.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# 1.7 The Future of Adaptive Trials in Clinical Drug Development


    A recent study released by the Tufts''s Center for the Study of Drug Development
    suggests that the average pre-tax industry cost to bring a new medicine to market
    is now around $2.56 billion USD [70]. The study included 106 investigational new
    drugs from 10 mid- to large-size pharmaceutical companies and the drugs were first
    tested in humans during 1995-2007. Cost included clinical development up to 2013.
    By comparison, 2003, the cost was about $1.04 billion in 2013 dollars.


    DiMasi stated that the higher cost comes from clinical trials that are larger
    and more complex. In our opinion, the higher costs also resulted from increased
    regulations [70]. For example, since the FDA issued a guidance document on evaluating
    cardiovascular risk in new antidiabetic therapies to treat Type 2 diabetes mellitus
    (T2DM) in December 2008, all new drugs for T2DM approved since 2008 have been
    or are evaluated in cardiovascular outcome trials [71]. In the context of these
    large cardiovascular trials for T2DM, Chapter 4 utilizes Bayesian methodologies
    to take advantage of historical information to improve trial efficiency. These
    outcome trials enroll thousands, if not tens of thousands, of diabetic patients
    who are at an increased risk for cardiovascular events. Despite the new requirement,
    manufacturers continue to pursue anti-diabetic drugs because as Gregg et al. predicted,
    lifetime risk of diagnosed diabetes from age 20 years onwards is about 40%, nearly
    doubling the risk of those born a decade or so earlier [72]. Another factor contributing
    to the higher cost is a higher failure rate during the clinical development phase
    in recent years. For example, there has been no drug approved for Alzheimer’s
    disease (AD) in the US since 2003 when memantine was last approved [73]. Decades
    of investment in AD drugs by many companies, either as symptomatic enhancing or
    disease-modifying agents, have failed to produce a single new approved product
    or a new product close to be approved as of 2015.


    While drug developers have always been aware of the high risk associated with
    drug development, the substantial increase in development cost has begun to change
    the business operating models'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'for the industry. In recent years, there has been a strategic move towards
    co-development between pharmaceutical companies, to share financial burdens for
    product development between the private and public sectors. The high cost has
    also motivated many companies to look for data-driven quantitative approaches
    to make better decisions that if a development program is to fail, it can be terminated
    earlier and more efficiently. This new direction will further increase interest
    in adaptive trials.


    Against the backdrop of high cost for large development programs, there is also
    a shift for industry to invest more heavily in precision medicine or medicines
    for rare diseases. In 2014, the FDA approved 41 new molecular entities for marketing.
    According to Gulfo of Breakthrough Medical Innovations, 40% of the new molecular
    entities approved for rare diseases, underscoring the industry''s shift to niche
    products [74]. There are several reasons for this shift. First, a large number
    of products that are highly effective in treating common disorders (e.g. high
    cholesterol, high blood pressure, CNS disorders) have become generic in the past
    decade. It is hard to demonstrate extra value beyond what the generic products
    could offer. On the other hand, value proposition is easier for rare diseases,
    which have received less attention in the past and continue to represent unmet
    medical needs. The smaller populations affected with rare diseases require out-of-box
    thinking and nimble applications of innovative approaches to clinical development.
    Carefully planned adaptive design serves this nicely.


    Another emerging trend is the use of a platform (umbrella) trial to screen multiple
    product candidates in a single trial. This is in contrast to traditional trials
    that typically investigate a new treatment (with multiple doses in some cases)
    in a generally homogeneous population. A platform trial could used to investigate
    a product in patients with different genotypes or phenotypes (enriched subpopulations),
    or could also be used to investigate different treatments in one population. A
    more sophisticated platform trial could study multiple treatments in multiple
    enriched patient subpopulations. Interim analyses are conducted in platform trials
    to decide if a particular treatment (together with a subpopulation in some cases)
    could graduated from the trial and further investigated in a confirmatory setting.
    Alternatively, a treatment could be dropped from the trial and a new treatment
    added to the trial,'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'continuing the trial beyond the original set of treatments. Platform trials
    that allow the introduction of new treatments are sometimes called perpetual trials
    for this reason. Platform trials are also called "master protocol" trials because
    one protocol governs the testing of many drugs.


    A well-known platform trial in the oncology area is the I-SPY 2 trial [75]. This
    is phase II neoadjuvant trial for women with large cancers of the breast. Breast
    tumor is characterized by its response to three receptors (estrogen, progesterone,
    and HER2), resulting in 8 tumor signatures. The trial investigates multiple regimes
    including investigational products from pharmaceutical companies. The primary
    endpoint is pathologic complete response at 6 months after treatment initiation.
    Within each tumor signature, adaptive randomization to regimens is employed. The
    trial may graduate or terminate a regimen according to a pre-specified rule based
    on an interim Bayesian prediction of phase III success probability for a (regimen,
    signature) combination. If the regimen remains in the trial after the interim
    decision, assignment to that regimen will continue but be capped at a specified
    maximum. One major advantage of a trial like I-SPY 2 is the ability to learn during
    the trial on what regimen benefits which patient subpopulations, and learn this
    by borrowing information from other (regimen, signature) combinations.


    Another example is the Lung-MAP (lung master protocol) trial, a multi-arm, biomarker-driven
    clinical trial for patients with advanced squamous cell lung cancer that was initiated
    in June 2014 [76]. Lung-MAP is a public-private collaboration. Lung-MAP plans
    to test five experimental drugs—four targeted therapies and an anti-PD-1 immunotherapy.
    Patients will be screened for over 200 cancer-related genes for genomic alterations.
    The results of the test will be used to assign each patient to the trial arm that
    is best matched to their tumor’s genomic profile. The study can test up to 5-7
    drugs at one time and can be amended to add additional new drugs as current drugs
    exit the trial. In addition to the efficiency gain from using the same control
    group from the design aspect, a trial using a master protocol takes advantage
    of existing infrastructure and patient outreach efforts on the operational side.


    The potential value of platform trials is not limited to the oncology area. Across
    the globe, the pace of development of new antibiotic products'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'has slowed noticeably from its peak in the 80s, creating a public health crisis
    with the rapid development of drug-resistant bacteria. In the US, the President''s
    Council of Advisors on Science and Technology (2014) published a Report to the
    President on Combating Antibiotic Resistance in September 2014 [77]. The Report
    offers practical recommendations to the US Federal government for strengthening
    the US''s ability to combat the rise in antibiotic-resistant bacteria. In the
    area of clinical trials to test new antibiotics, the Report recommends increasing
    trial efficiency through improved infrastructure and focusing on patient populations
    with the most urgent. On ways to make clinical testing more efficient, the Council
    suggested the formation of a robust, lasting clinical trials network for antibiotic
    testing. The recommended action plan for the network includes the development
    of platform trials for antibiotics, where multiple new agents from different sponsors
    can be evaluated concurrently. As the utility of platform trials for screening
    product candidates becomes better understood, we are likely to see more trials
    in the future.


    Other adaptive designs that have received increasing attention by researchers
    include multiple assignment randomized trials (SMARTs) and sequential parallel
    comparison designs (SPCDs) [78, 79]. Both classes of designs involve additional
    randomizations, based on patients'' response following the initial randomization.
    SPCDs are also viewed as a way to address high placebo response rates in trials
    involving the central nervous system. SMARTs were originally proposed to increase
    efficiency in behavior science trials and to investigate optimal treatment strategies,
    but the concept can be applied to other types of trials as well.


    Elßer et al. examined 59 scientific advice letters by the Scientific Advice Working
    Party (SAWP) of the CHMP that addressed adaptive study designs in phase II and
    phase III clinical trials between 01 Jan 2007 and 08 May 2012 [80]. According
    to the authors, most frequently proposed adaptation was size re-estimation, followed
    by dropping of treatment arms, and population enrichment. Among the 59 proposals,
    15 were accepted (25%) and 32 were conditionally accepted (54%) by CHMP/SAWP.
    Elßer and coauthors concluded that despite critical comments in some cases, a
    majority of the proposed adaptive clinical trials received an overall positive
    opinion. Among the 41 more recent cases (out of 59) with more information in the
    advice'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'letters, CHMP/SAWP noted insufficient justifications of the proposed adaptations,
    type I error rate control, and bias in treatment effect estimate as the most frequent
    concerns.


    By the end of the first decade in the 21st century, there was a wide-spread interest
    in adaptive trials in the pharmaceutical industry. In an article, Burman and Chuang-Stein
    asked whether the interest in adaptive designs was a short-lived fascination or
    a reflection that adaptive designs could become part of the future of clinical
    research [81]. Since 2009, the clinical trial research community has made tremendous
    progress in understanding when adaptive trials add value and when they do not.
    Some hard lessons were learned in the process. We have seen some products approved
    using evidence from pivotal adaptive trials. Some of the adaptive features such
    as futility analysis and some form of sample size re-estimation have become routine
    features of many registration trials.


    Based on our own experience, we can confidently predict that properly designed
    and carefully executed adaptive trials that are not overly complicated and fit
    well in the context of a development program will have a firm place in the clinical
    research. They will become important tools in our trial design armamentarium as
    we continue to look for more nimble and efficient strategies to develop new and
    valued products.'
  merge: -1
