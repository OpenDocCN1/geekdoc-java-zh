    There are few important implications following from this result. First, in most
    clinical trials that use normal, binomial, or survival endpoint, the test statistic
    $Z(t_j)$ is often utilized. Therefore, by the above theorem, the distributional
    structure of these statistics after transformation above is asymptotically the
    same as $S(t_j)$s. Therefore, one can construct group sequential stopping boundaries
    for the $S(t_j)$ stochastic process using the property that the overall probability
    of crossing a boundary is limited to the desired I error rate, $\alpha$, under
    the null hypothesis $H_0: \theta = \theta_0$ or equivalently when $\eta=0$. This
    efficacy or rejection boundaries will then be applied to the test statistics developed
    to monitor trials with normal, binomial, or survival endpoint, or even more general
    endpoints. Details on boundary construction will be given in 2.4 Types of Stopping
    Boundaries.


    Second, having generated the appropriate boundaries, one may compute efficacy
    crossing probabilities for the stochastic process $S(t_j)$ under the alternative
    hypothesis $H_1: \theta = \theta_1$ or equivalently when $\eta = \eta_1$, where
    $\eta_1 = (\theta_1 - \theta_0)\sqrt{t_j}$. One can, therefore, search for the
    value of $\eta_1$ at which the overall boundary crossing probability equals the
    desired power, $1 - \beta$. By substituting this value of $\eta_1$ into equation


    ```

    $l_j = \left[ \frac{\eta_1}{\theta_1 - \theta_0} \right]^2$.

    ```


    one can estimate $l_j$ and $n_j$, the maximum sample size needed to attain the
    desired power, $1 - \beta$, at any pre-specified clinically meaningful treatment
    difference $\theta = \theta_1$.'
