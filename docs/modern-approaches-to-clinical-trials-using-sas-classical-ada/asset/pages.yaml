  md: "# 2.4.4 Spending Function Boundaries\n\nError spending functions are the most\
    \ flexible and general way of deriving the stopping boundaries. The $\\alpha$-spending\
    \ functions where the $\\alpha$ level is pre-specified are used to control the\
    \ type I error in the trial. They are monotonic functions that are defined on\
    \ the unit interval with $\\alpha(t)=0$ and $\\alpha(t=1)=\\alpha$. Similarly,\
    \ the $\beta$-spending functions, with pre-specified $\beta$ level, are used to\
    \ control the type II error. They are defined on the unit interval with $\beta(t=0)=0$\
    \ and $\beta(t=1)=\beta$. This idea of using an error spending function was first\
    \ introduced by Lan and DeMets [10]. One can use either the $\\alpha$ or the $\b\
    eta$ spending function singly or combine both of them in sequentially monitoring\
    \ a single trial. They can be used for either one-sided or two-sided hypotheses,\
    \ and produce either symmetric or asymmetric boundaries.\n\nThere are numerous\
    \ proposed error spending functions, and we will briefly describe three of the\
    \ most commonly used spending functions and their properties. The forms of the\
    \ functions are expressed as $\\alpha(t)$ and $\beta(t)$ where $t(0 < t < 1)$\
    \ is the information fraction. Here we illustrate the $\\alpha$-spending function,\
    \ but it can also apply to the $\beta$-spending function.\n\n+   1. The Lan-DeMets\
    \ spending function has two possible forms. The first one closely resembles the\
    \ OBF boundaries:\n\n```\n$\\alpha(t) = 2 - 2\\Phi\\left(\\frac{Z_{\\alpha/2}}{\\\
    sqrt{t}}\\right)$ for one-sided tests, and\n```\n\n```\n$\\alpha(t) = 4 - 4\\\
    Phi\\left(\\frac{Z_{\\alpha/4}}{\\sqrt{t}}\\right)$ for two-sided tests.\n```\n\
    \nThe second one closely resembles the Pocock boundaries:\n\n```\n$\\alpha(t)\
    \ = \\alpha\\ln<1 + |\\theta - 1|t>\n```\n\n+   2. The Gamma spending function\
    \ was first proposed by Hwang, Shih and DeCani [24]. The functional form is"
  merge: -1
  pgno: 114
- img_proc: true
  md: "```\n$a(t) = \\begin{cases} \\frac{(1-e^{-\\gamma t})}{(1-e^{-\\gamma})} &\
    \ \\gamma \\neq 0 \\ at, & \\gamma = 0 \\end{cases}$\n```\n\nNegative values of\
    \ $\\gamma$ yield spending functions that make stopping early more difficult as\
    \ $\\gamma$ decreases. Positive values of $\\gamma$ yield concave spending functions\
    \ that favor stopping early as $\\gamma$ increases. The choice of $\\gamma = 0$\
    \ spends the error linearly. When $\\gamma = -4$, it resembles the OBF boundaries,\
    \ while $\\gamma = 1$ produces boundaries that resemble those of Pocock.\n\n+\
    \   3. The Rho spending function was first proposed by Kim and DeM [25], and was\
    \ further generalized. The functional form is simply represented as\n\n```\n$a(t)\
    \ = at^\\rho, \\rho > 0$.\n```\n\nWhen $\\rho = 1$, the corresponding stopping\
    \ boundaries resemble the Pocock stopping boundaries, but when $\\rho = 3$, the\
    \ boundaries resemble the OBF boundaries. Large values of $\\rho$ yield boundaries\
    \ make early stopping more difficult, while $0 < \\\rho < 1$ favors early stopping.\n\
    \nHere we want to illustrate using an example that will derive boundaries for\
    \ early rejection of either the null or the alternative hypothesis given the one-sided\
    \ setting. There are two sets of stopping boundaries for this design. The upper\
    \ boundary set corresponds to the early rejection of the null hypothesis, while\
    \ the lower boundary refers to the early rejection of the alternative hypothesis.\
    \ At the $j^{th}$ interim stage, the test statistic crosses the upper boundary,\
    \ then the trial will be stopped for efficacy, but if it crosses the lower boundary,\
    \ the trial is stopped for utility. We impose the constraint that upper and lower\
    \ boundaries should meet at $t_j$ at the end of the trial, in order to ensure\
    \ that a decision is made to reject either of the hypotheses. The upper and lower\
    \ boundaries therefore form a triangular continuation region.\n\nWe specify that\
    \ these stopping boundaries will be able to preserve the type I error at the $\\\
    alpha$ level under the null hypothesis when $\\theta = 0$, but they can offer\
    \ a target power of $1 - \\\beta$ under the alternative hypothesis when $\\theta\
    \ = \\\theta_1$ or when the drift parameter is $\\eta_1$, therefore,"
  merge: -1
  pgno: 115
- img_proc: true
  md: "protecting trial by the type II error of $\beta$. We let the upper boundary\
    \ at the $j$th interim stage as $u_j$ and the lower boundary as $l_j$ for $j=1,\
    \ 2, \\dots, J$. Again, we will be able to use a numerical method to evaluate\
    \ the set of boundaries which should satisfy the following equations at $t_1$\n\
    \n$P_0(S(t_1) \\geq u_1) = \\alpha(t_1)$.\n\n$P_{\\eta_1}(S(t_1) \\leq l_1) =\
    \ \beta(t_1)$.\n\nSimilar conditions are evaluated subsequently at $t_2, t_3,\
    \ \\dots, t_j$ as follows. If we have calculated the pair of stopping boundaries\
    \ up to $t_{j-1}$, $(l_{j-1}, u_{j-1})$, then we can find $(l_j, u_j)$ using the\
    \ following equation and numerical method\n\n$P_0(l_1 < S(t_1) < u_1, l_2 < S(t_2)\
    \ < \\dots < l_{j-1} < S(t_{j-1}) < u_{j-1}, S(t_j) \\geq u_j) = \\alpha(t_j)\
    \ - \\alpha(t_{j-1})$\n\n$P_{\\eta_1}(l_1 < S(t_1) < u_1, l_2 < S(t_2) < u_2,\
    \ \\dots < l_{j-1} < S(t_{j-1}) < u_{j-1}, S(t_j) \\leq l_j) = \beta(t_j) - \b\
    eta(t_{j-1})$\n\nFor the final stage at $t_j$, we set $u_j = l_j$, so they meet\
    \ and a definitive decision at the end of a trial is guaranteed. The desired maximum\
    \ information $l_j$ can be evaluated and translated into the maximum sample size\
    \ $n_j$ or the maximum number of events $D(c_j)$ (in case of a survival endpoint).\
    \ The two-sided testing can be similarly derived by replacing $S(t_j)$ with $|S(t_j)|$\
    \ which gives symmetric boundaries. In other cases, we may be interested in asymmetric\
    \ boundaries, the the $\\alpha$ will be split into two parts that $\\alpha_U +\
    \ \\alpha_L = \\alpha$ and two different $\\alpha$-spending functions can be specified,\
    \ $\\alpha_U(t)$ and $\\alpha_L(t)$. Similarly, this can be applied to $\beta$\
    \ spending functions.\n\n# Example: Redesigning the Psoriasis Trial Using Gamma\
    \ Spending Functions\n\nExample Code 2.9 Psoriasis Trial Using Gamma Spending\
    \ Functions demonstrates the use of the gamma spending function in testing the\
    \ two proportions in the psoriasis trial.\n\nExample Code 2.9 Psoriasis Trial\
    \ Using Gamma Spending Functions\n\n```\nproc seqdesign boundaryscale=mle plots=;\n\
    ```"
  merge: -1
  pgno: 116
- img_proc: true
  md: 'gammadesignforso: design nstages=4 alt=upper alpha=0.025 beta=0.14

    stop-method (alpha)=errfuncgamma(gamma=0.5)

    method(beta)=errfuncgamma(gamma=1.5);

    samples model=twosamplefreq (nullprop=0.07 prop=0.4 test=prop weight=2)

    run;


    In this case, the type I error is monitored using the gamma function with $\gamma=0.5$
    which is close to lower error spending, while type II error is monitored using
    $\gamma=1.5$ which is closer to the Pocock boundary, allowing more aggressive
    stopping due to futility in early stages.


