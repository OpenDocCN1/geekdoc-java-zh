  md: '# Foreword


    Recent years, and perhaps particularly the past decade, have seen a rapid evolution
    in the statistical methodology available to be used in clinical trials, from both
    technical and implementation standpoints. Certain practices as they might have
    been performed not too far into the past in fact now somewhat primitive or naïve.
    Much, but certainly by no means all, of the recent development is related to interest
    in adaptive trial designs. The term itself is quite broad, and encompasses a wide
    variety of techniques and applications. Many trial aspects are potential candidates
    for adaptation, including but not limited to: sample size or information requirements,
    dose or treatment regimen selection, targeted patient population selection, the
    randomization allocation scheme; and within each of these categories there may
    be multiple and fundamentally different technical and strategic approaches that
    are now available for practitioners to consider.


    Classical procedures as well have undergone advancements in the statistical details
    of their implementation, and their usage in analysis and interpretation of trial
    results. Enhancements in classical approaches, and the progress made or envisioned
    in utilization of novel adaptive and Bayesian designs and methodologies, are reflective
    of the current interest in the transition to personalized medicine approaches,
    by which optimal therapies corresponding to particular patient characteristics
    are sought. A categorization of designs and methods into classical, adaptive,
    and Bayesian methods is by no means mutually exclusive, as a number of methodologies
    have aspects of more than one of these classes. Just to cite one example, group
    sequential designs are a familiar feature in current trial practice that fall
    both under the classical and adaptive headings; this is also certainly an area
    that has seen an evolution in recent years. Aspects of clinical trial or program
    design such as dose finding or population enrichment may contain aspects that
    are adaptive, or Bayesian, or both, as is communicated in this volume.


    The interest in novel adaptive and Bayesian approaches certainly does not preclude
    the possibility that classical approaches will be preferred in many situations;
    they maintain the attributes which led to their widespread adoption in the first
    place. As has been pointed out by many authors, the best use of these novel approaches
    will be realized by a full'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'understanding of their behavior and an objective evaluation of their advantages
    and relevant tradeoffs in particular situations. This point is clearly and objectively
    conveyed throughout this volume, as approaches of varied types are presented not
    to promote or endorse their casual routine use, but rather are described with
    sufficient explanations to help practitioners make the best choices for their
    situations, and of course to have the computational tools to implement them.


    It seems inevitable that the availability to users of software and computational
    capabilities is inextricably linked with increased consideration of and interest
    in alternative design and analysis strategies, and ultimately their implementation.
    Certainly, if a novel methodology is seen as adding value in such an important
    arena as clinical trials, it will spur development of the computational tools
    necessary to implement it. However, in a cycle, the increased availability leads
    to increased consideration and implementation, which spurs further interest, enables
    learnings from experience, perhaps motivates further research, and ultimately
    leads to further methodological and in-practice improvements and evolution.


    Just as a simple illustration of this phenomenon: questions regarding how clinical
    sites should be accounted for in main statistical analysis models that had undergone
    some debate in past decades, with occasional flurries of literature activity,
    but evolution in conventional practices was limited. The introduction of SAS proc
    in the early 1990s provided a platform for more widespread consideration and usage
    of some approaches that were less utilized at that time, which incorporated clinical
    site as a random effect in analysis models in various manners. There were implications
    for important issues, such as sample size determination and targeted center-size
    distributions, and for certain practices that were in use at the time as small
    center pooling algorithms. Given the presence of the new computational tool available
    to users in the form of the SAS it may not be a coincidence that by the latter
    part of that decade there was vigorous dialogue taking place in the literature
    on matters involving how best to design multicenter studies and accommodate center
    in analysis models, and within a relatively short period of time there were notable
    changes in conventional practices.


    Given the extent of recent methodological advances, and the wide'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'knowledge of and usage of SAS throughout the clinical trials community, a focused
    volume such as this is particularly timely in this regard. it integrates a broad
    coherent summary of current approaches for clinical trial design and analysis,
    with particular emphasis on important recently developed ones, along with specific
    illustrations of how they can be implemented and performed in SAS. In some cases
    this involves relatively straightforward calls to SAS procedures; in many others,
    sophisticated SAS macros developed by the authors are presented. Motivating examples
    are described, and SAS outputs corresponding to those examples are explained to
    help guide readers through the most accurate understandings and interpretations.
    This text well function effectively as a technical resource on state-of-the-art
    clinical trials methodology even if it did not contain the SAS illustrations and
    explanations; and it could also fit within a useful niche if focused solely on
    the SAS illustrations without the methodological and practical explanations. The
    fact that it contains both aspects, well integrated in chapters prepared by experienced
    subject matter experts, makes it a particularly valuable resource. The ability
    that the material contained here offers to practitioners to test and compare different
    design and analysis options to choose the one that seems best for a given situation
    can help drive the most impactful usage of these new technologies; and, along
    the lines of the methodology-computational tools cycle described earlier, this
    perhaps may assist in leading to further experience-driven methodological or implementation
    advancements.


    Paul Gallo


    Novartis


    October 2015'
