  md: "# 10.4.1 Simulating a Single RAR Sequence\n\nThe target allocation ratio is\
    \ pre-specified (e.g. 1:1 or 2:1), a treatment randomization sequence can be pre-generated\
    \ before any subject is enrolled into a trial. In contrast, a RAR sequence cannot\
    \ be pre-generated because treatment randomization probabilities are adaptively\
    \ modified throughout the trial based on cumulative patient data.\n\nStandard\
    \ computer packages such as SAS as R have built-in random number generators that\
    \ can be used to simulate RAR designs under certain assumptions on outcomes from\
    \ patients in trial. We start with a simulation of a single randomization sequence.\
    \ Program ch10.4.1.sas in the supplemental material generates a sequence of treatment\
    \ assignments for a trial with $n=40$ patients using the DBCD($\\gamma=2$) procedure\
    \ (Section 10.3) targeting the RSIHR allocation (10.2). We assume that the true\
    \ success probabilities for the treatments are $p_E=0.7$ and $p_C=0.4$, and therefore,\
    \ $\rho=\\sqrt{0.7}/\\sqrt{0.7+0.4}=0.57$. The first $2m_0$ patients are randomized\
    \ between $E$ and $C$ using equal randomization (in Program ch10.4.1.sas, we set\
    \ $2m_0=10$). Specifically, randomization probability to $E$ for the first 10\
    \ patients is set to\n\n```\n$\\phi_E=\\frac{1}{2}, \\phi_{m+1}=\\frac{5-N_E(m)}{10-m},\
    \ m=1..9$\n```\n\nwhere $N_E(m)$ is the number of treatment $E$ assignments among\
    \ the $m$ patients. The response-adaptive part starts from the 11th patient. The\
    \ randomization probability for the $(m+1)$th patient $[m=10, 39]$ is determined\
    \ as follows. Assuming that all outcome data from previous $m$ patients are available,\
    \ obtain $N_E(m), N_C(m), S_E(m), S_C(m)$, and estimate treatment success probabilities\
    \ as $\\hat{p}_{k,m}=(S_k(m)/N_k(m))$. Note that $\\hat{p}_{k,m}$ are Bayesian\
    \ estimates under a noninformative prior, to avoid estimated success probabilities\
    \ equal to zero or one. The estimated target allocation is updated as $\\hat{\r\
    ho}_m=\\sqrt{\\hat{p}_{E,m}}/\\sqrt{\\hat{p}_{E,m}+\\hat{p}_{C,m}}$, and the randomization\
    \ probability to $E$ for the $(m+1)$th patient is set to"
