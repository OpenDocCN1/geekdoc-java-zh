  md: "# 10.2 Optimal Allocation\n\nConsider a binary outcome clinical trial to compare\
    \ an experimental treatment, $E$, versus a control treatment, $C$. Let $p_E$ denote\
    \ the probability of success on $E$ ($q_E=1-p_E$) and $p_C$ denote the probability\
    \ of success on $C$ ($q_C=1-p_C$). Suppose the trial has a sample size $n$ which\
    \ is fixed and predetermined. Let $\rho$ denote the allocation proportion for\
    \ the experimental treatment where $0 < \rho < 1$. This means roughly $n_E=n\r\
    ho$ patients are assigned to $E$ and $n_C=n(1-\rho)$ patients are assigned to\
    \ $C$. An experimental design problem is to find an optimal allocation $\rho^*$\
    \ as a solution to some formal optimization problem. In a two-arm comparative\
    \ trial, a common objective is to have sufficient power to test the primary study\
    \ hypothesis. Consider testing the hypothesis $H_0: p_E=p_C$ versus $H_1: p_E\
    \ \\neq p_C$ using the Wald\n\n```\n$Z_W = \\frac{\\frac{p_E-p_C}{\\sqrt{\\frac{p_E\
    \ q_E}{n_E} + \\frac{p_C q_C}{n_C}}}}$\n```\n\nwhere $\\hat{p}_E, \\hat{q}_E,\
    \ \\hat{p}_C, \\hat{q}_C$ are consistent estimators of the corresponding parameters.\
    \ Under $H_1, Z_W$ has asymptotically normal distribution with mean $d=(p_E-p_C)\\\
    left{\\sqrt{\\frac{p_E q_E}{n_E} + \\frac{p_C q_C}{n_C}}\\right\\}^{-2}$ and unit\
    \ variance. The allocation that maximizes power for a fixed sample size $n$ and\
    \ fixed $p_E, q_E, p_C, q_C$ is one that minimizes the value of $\\left{\\frac{p_E\
    \ q_E}{n\\rho} + \\frac{p_C q_C}{n(1-\\rho)}}\right\\}$ for $\rho\\in(0,1)$. This\
    \ optimal solution is called the Neyman allocation and it is given by\n\n```\n\
    $\\rho_N = \\frac{\\sqrt{p_E q_E}}{\\sqrt{p_E q_E} + \\sqrt{p_C q_C}} (10.1)$\n\
    ```\n\nThe Neyman allocation assigns a greater proportion of patients to a more\
    \ variable treatment group. Unfortunately, when $p_E+p_C>1$, the Neyman allocation\
    \ is skewed in favor of the less successful treatment, which is inappropriate\
    \ for an individual ethics perspective.\n\nRosenberger and co-authors in [10]\
    \ considered the following question: For fixed variance of the Wald test statistic\
    \ under the alternative hypothesis, which allocation minimizes the expected number\
    \ of treatment failures? The optimization problem in this case is formulated"
