  md: '# 6.5 Summary


    There are a lot of challenges in designing the first dose-ranging clinical trial.
    The two main problems are: (1) there is not much information about the efficacy
    of the candidate product available and; (2) too many answers are expected for
    this trial to deliver. Project team members tend to anticipate that such a study
    will establish the PoC, identify the MinED, characterize the dose-response relationship,
    and recommend doses for phase III designs. Fundamental statistical training points
    out that the best design is one that answers only one question. Hence, the nature
    of a dose-ranging trial makes it a very difficult design in order to address so
    many scientific questions, and so little information to begin with.


    In fact, there should be a logical sequence of thinking in addressing these questions.
    The first step is to consider how wide a dose range should be. This is also the
    most critical step. In order to approach this question, information about the
    drug under development (pre-clinical and clinical phase I), other marketed drugs
    in a similar class, the indication that this study is designed for, and the target
    product profile, can provide a better understanding of the potential dose range
    that needs to be explored. In practice, it is also important to have a good understanding
    of dosing frequency (from phase I results), formulation (from CMC), and other
    relevant issues.


    Once the dose range is determined, the next step would be to consider the number
    of treatment groups – will there be need of an active control? How many doses
    should be included in this design? What dose spacing should be considered? Basically
    speaking, a trial with 4 to 5 test doses, plus a placebo control will deliver
    a good understanding of where the test medication is most active, if the dose
    range is enough, and if the dose spacing is reasonable. Six or more test doses
    (in addition to a placebo) design may not necessarily deliver better results a
    study with too many doses may introduce additional complexities from a practical
    and logistical point of view (e.g., formulation, blinding, or others).


    Sample size calculation is needed for almost every clinical trial. Considerations
    in sample size calculations for a dose-ranging trial are'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'very similar to those for other trials. However, because the nature of a dose-ranging
    trial is that it includes multiple treatment groups, this may cause some level
    of confusion – both to statisticians and nonstatisticians. However, if the decision
    is to only use a single degree of freedom contrast test as the primary comparison,
    then the situation can be simplified to lot. In the case of one contrast, the
    two major challenges would be what assumptions of dose-response relationship that
    the team is willing to make, and sample size allocation – either a balanced approach
    or an imbalanced approach. After these decisions are made, the statistician would
    then follow up and calculate the sample size for the study.


    Suppose a contrast with one degree of freedom is selected, and the sample size
    allocation is determined, the typical sample size considerations, such as choice
    of treatment difference, choice of alpha and beta can then be specified. With
    this information, sample size can be calculated using an existing formula. An
    example of a real study design in a test product developed for treatment of osteoarthritis
    is included in this manuscript to demonstrate how these methods can be applied
    in a real-world situation.'
  merge: -1
