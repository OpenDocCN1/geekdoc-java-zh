    # Adaptive Design with Unblinded Sample Size Re-estimation


    In this design there is an opportunity to start with the optimistic total sample
    size of 2,326 and invest adaptively if the trial is not stopped for futility or
    efficacy. In this specific example, neither of the classical designs gives us
    any flexibility. For example, in the first case when the improvement is 40%, a
    trial with 2,326 would lead to an underpowered trial if the true improvement is
    32%, while the trial with 3,532 subjects would be overpowered if the true improvement
    is 32. As subjects earlier, the GSD suffers from a large initial commitment of
    cost, and not sufficient gain if the trial recruits rapidly with a delayed endpoint.
    Some of these drawbacks encountered by a GSD can be mitigated by an adaptive design
    with sample size re-estimation. It provides an opportunity to start with an initial
    sample size of 2,326 subjects as in the optimistic scenario (design delta of 40%)
    of the classical design and adapt at an interim analysis. The interim analysis
    will be conducted about 50% of the subjects complete the induction period.


    At the interim analysis, one of the following decisions would be made:


    +   1. Trial would be stopped for futility ($Z_1 < b_1$).


    +   2. Trial would be stopped for efficacy ($Z_1 > c_1$), or


    +   3. Trial would continue with a sample size re-estimation if neither futility
    nor efficacy is met ($b_1 \le Z_1 \le c_1$).


    In this example, as done in GSDs, we choose the interim futility boundary such
    that there is no observed difference between control and the test for. For example,
    no improvement in the condition while the interim efficacy boundary is chosen
    such that the trial can be stopped at the interim if the improvement (i.e. the
    interim estimate) is at least 40%. If the interim statistic $Z1$ is between $b1$
    and $c1$; then the sample size would be increased using the interim estimate up
    to a maximum total sample size'
