- img_proc: true
  md: '# 3.1.1 Motivation. Why Sample Size Re-estimation?


    Sample size re-estimation (SSR) has received a lot of attention in recent years
    as a result of exploding interest in adaptive clinical trial designs in general.
    In February 2010, the Food and Drug Administration (FDA) issued a draft guidance
    on Adaptive Clinical Trials for Drugs and Biologics, which defined an adaptive
    drug trial as "a study that includes a prospectively planned opportunity for modification
    of one or more specified aspects of the study design and hypotheses based on analysis
    of data (usually interim data) from subjects in the study. Analyses of the accumulating
    study data are performed at prospectively planned time points within the study,
    can be performed in a fully blinded manner or in an unblinded manner, and can
    occur with without formal statistical hypothesis testing" [1]. By definition,
    an adaptive design can have many different types of adaptations and rules [2].
    Sample size re-estimation is a specific sub-class of adaptive designs focusing
    on modifying a trial''s sample size based on interim analysis results. It can
    be performed in either a blinded or unblinded manner. A blinded SSR does not require
    the knowledge of treatment assignment at the individual patient level, while an
    unblinded SSR procedure uses treatment assignment knowledge.


    When sample size is planned for clinical trials, it depends heavily on assumptions
    used in sample size calculations, as the hypothesized treatment effect size and
    the values of nuisance parameters. There is usually a considerable degree of uncertainty
    either or both of these parameters at the trial planning stage. This translates
    into a wide range of possibilities for the study sample size needed to achieve
    a desired power level (e.g. 80%). The best guesses for effect size and nuisance
    parameter are utilized in power calculations in order to narrow down the choices
    for sample size to a single number.

    Unfortunately, when these assumptions are violated, the power of the study is
    negatively affected, sometimes quite dramatically. If the trial does not have
    an interim analysis (i.e. a fixed trial design), it is impossible to detect the
    gap between our assumptions and reality until the study ends and all available
    resources are used. The SSR methodology attempts to address this problem by looking
    at the interim estimates of the nuisance parameter alone (blinded SSR) or the'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'treatment effect and nuisance parameter (unblinded SSR), and adjusting the
    sample size to maintain the originally planned study power. For example, in case
    of a normal end point with an unknown variance, the blinded SSR procedure will
    estimate only the variance using interim data. The originally hypothesized mean
    treatment difference along with the updated variance estimate will be used to
    calculate the adjusted sample size. In contrast, unblinded SSR will look at the
    patient-level unblinded data at the time of the interim analysis and calculate
    both the treatment effect and variability estimates, using both in the adjusted
    sample size calculations.


    It is worthwhile to note that the unblinded SSR methodology is closely related
    to that of group sequential designs (GSDs) discussed in Chapter 2. In fact, unblinded
    SSR was originally developed as an extension of GSDs. Because of this relationship,
    these two classes of adaptive design are often compared and contrasted.


    Even though GSDs satisfy the definition of adaptive design from FDA guidance described
    earlier, many people prefer to refer to them as classical rather than adaptive
    because their methodological development preceded that of unblinded SSR. There
    are important similarities and differences between GSD and unblinded SSR: the
    methodology for the latter builds upon the same distribution theory that was developed
    for GSDs (Chapter 2), allowing sponsors to adjust sample size upwards as well
    as downwards. In contrast, GSD only allows sample size reduction through early
    stopping. For that reason, the unblinded SSR methods are particularly appealing
    to developers with limited initial budgets. In such cases, the study can be initially
    sized and additional sample size invested only if the interim results look promising
    [3]. Even if a larger budget is available upfront, more and more sponsors are
    exploring SSR options (both blinded and unblinded) in order to use their drug
    development resources efficiently.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 3.1.2 Overview of Considerations and Issues


    When considering a trial design SSR (statistical, regulatory, and implementation)
    that are associated with such designs. The specifics of these issues differ quite
    a bit between blinded and unblinded SSR procedures; therefore, we will discuss
    them in detail within their respective sections. In general, the core statistical
    issue for all methods is type I error arising from multiple loops (interim and
    final) at the same data. The unblinded SSR procedure is more prone to type error
    inflation than blinded SSR. Regulatory issues revolve primarily around classification
    of adaptive designs by FDA guidance [1] into “well-understood” (blinded SSR) and
    “less well-understood” (unblinded SSR). This classification is based on the maturity
    of the methodology and consequent regulatory experience with submissions involving
    each type of SSR. This classification is also closely related to implementation
    challenges: with unblinded SSR, there is always the risk of an accidental interim
    result leak or treatment effect reverse-engineering that results in compromised
    study integrity. Reverse-engineering refers to the ability of someone familiar
    with the interim decision algorithm to make guesses about the observed treatment
    effect based on the interim decision that was made. The blinded SSR procedure
    is less affected by such concerns. Because unblinded SSR methods are still considered
    “less well-understood”, additional planning time for regulatory consideration
    should be factored-in when considering such studies.


    Other than budgetary considerations discussed in [3], Chuang-Stein et al. [4]
    describe several scientific reasons why SSR may be desirable. These include (1)
    lack of information on how a new product candidate may affect a long-term clinical
    endpoint in the target population; (2) a newly approved product has become part
    of a treatment regimen to which a product candidate under development will be
    added; (3) emerging new medical or diagnostic practice that renders information
    from historical trials out of date; (4) newly issued regulatory guidance that
    departs from previous endpoint selection and statistical approaches. In addition,
    confirmatory trials are increasingly designed to be global trials to support global
    product registration. Depending on where phase II trials were conducted, a sponsor
    may face a situation'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'where data from some geographic regions will contribute substantially to the
    registration trials, but no prior information is available on how patients in
    these regions respond to the product candidate.


    For the above reasons, it is often prudent to use interim data to check the validity
    of the assumptions made at the design stage. If the assumptions appear to be erroneous,
    one should consider making a midcourse sample size adjustment to improve the chance
    that the trial will reach a definitive conclusion.


    The main focus of this chapter will be unblinded SSR methodology, though we will
    give a brief overview of blinded methods in 3.2 Blinded SSR Methods, in order
    to compare and contrast with unblinded SSR methods in 3.3 Unblinded SSR Methods.
    We conclude with summary and discussion in Section 3.4.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 3.2 Blinded SSR Methods


    A blinded SSR does not require knowledge of the treatment assignment at the individual
    patient level. It is designed to modify sample size due to inaccurate assumptions
    of the variability associated with a continuous endpoint or an assumed background
    event rate in the control arm for trials with a binary endpoint. Even though the
    treatment assignment information is very helpful in assessing such parameters,
    methods have been developed to allow their estimation without the actual treatment
    assignment information.


    Because blinded SSR does not involve treatment unblinding and can be conducted
    without worrying about introducing bias into a trial, blinded SSR is classified
    as a "well-understood" adaptive feature in the FDA guidance. From a practical
    standpoint, it is also easier to implement than unblinded SSR. For example, there
    is no risk of trial integrity loss due to accidental interim results, and no independent
    data monitoring committee (DMC) required. However, this simplicity comes at a
    cost: most blinded SSR methodologies rely implicitly on initially assumed effect
    value to hold. In case of the actual treatment effect being larger than planned,
    these methods can mistakenly infer that the variance is larger than expected and
    increase the sample size unnecessarily. Alternatively, if the treatment effect
    is smaller than expected, the sample size increase will be insufficient, resulting
    in an overpowered trial, unable to reach meaningful conclusions. In other words,
    when nuisance parameters are assessed at the time of interim analysis in a blinded
    manner, it is impossible to determine for sure whether increased/decreased variability
    in the pooled data results from changes in the treatment effect alone or if it
    is also a consequence of changes in the treatment effect. For this reason, blinded
    SSR methods are typically reserved for situations where there is reasonable confidence
    to believe that treatment effect assumptions will hold and only nuisance parameter
    assumptions need to be reassessed at the interim analysis.


    For the case of a two-treatment comparison of a normal endpoint, there are a few
    methods available to estimate the variance (nuisance parameter) in a blinded manner.
    The most popular is the one-sample variance method [5]. This method computes the
    overall estimate of variability from two treatment groups (active and control)
    essentially'
  merge: -1
  pgno: 145
- img_proc: true
  md: "ignoring the different treatment assignments. For simplicity we discuss the\
    \ case of equal allocation to treatment groups. For two normal samples with (unknown)\
    \ means $\\mu_{trl}$ and $\\mu_{ctrl}$, the common variance $\\sigma^2$ (nuisance\
    \ parameter) can be estimated as follows:\n\n```\n$\\hat{\\sigma}^2 = s_{OS}^2\
    \ = \\frac{1}{n-1}\\sum_{i=1}^{n}(X_{ij} - \bar{X})^2$,\n```\n\nwhere $n$ is an\
    \ interim-group sample size and $X_{ij}$ is the observed data with unknown mean\
    \ $\bar{X}$. The key idea here is that the overall variability is a sum of between-\
    \ and within-group variability, and the former is substantially smaller in clinical\
    \ trials than the latter. Even though the above estimator of variance $s_{OS}^2$\
    \ is ignoring the between-treatment variability component (and therefore is biased\
    \ upward when treatment difference is non-zero), it is still a practically useful\
    \ estimate because the impact of this bias is small for typical noise-to-signal\
    \ ratios encountered in clinical trials.\n\nA natural extension of this method\
    \ correcting for the bias is given in an adjusted one-sample variance method [6]:\n\
    \n```\n$S_{adj}^2 = S_{OS}^2 - \\frac{n}{2(2n-n)}\\Delta^2$.\n```\n\nThe magnitude\
    \ of correction depends on the interim sample size $n$ and the value of $\\Delta\
    \ = \\mu_{trl} - \\mu_{ctrl}$, where $\\Delta$ is the hypothesized treatment effect\
    \ for which the study was powered. Following the interim analysis, the originally\
    \ planned sample size $N=f(\\alpha, 1-\beta, \\hat{\\sigma}^2, \\Delta)$ is replaced\
    \ by $M=f(\\alpha, 1-\beta, \\hat{\\sigma}^2, \\Delta)$, where $\\hat{\\sigma}^2$\
    \ is calculated as $S_{adj}^2$ or $s_{OS}^2$ and function $f(\\cdot)$ refers to\
    \ standard sample size calculations for a two-sample $t$ test. Alternatively,\
    \ a restricted $M<N$ can be placed on the sample size adjustment requiring the\
    \ new sample size is $\\max\\{M,N\\}$, resulting in a restricted design. The operating\
    \ characteristics (power and type I error) depend much on which version (restricted\
    \ or unrestricted) is specified. It has been shown by simulation that blinded\
    \ SSR trials using unrestricted design can lead to slight power losses and negligible\
    \ type error inflation [5]. They suggest using the more conservative one-sample\
    \ variance method or using a restricted design to prevent inflation. Kieser and\
    \ Friede also explored sensitivity of the adjusted one-sample variance"
  merge: -1
  pgno: 146
- img_proc: true
  md: 'estimator $adj$ to different values of $\Delta$ (ranging from null to alternative
    hypotheses values) and found that the impact was very minimal [5]. Additionally,
    they have shown that differences in samples and operating characteristics between
    one-sample and adjusted one-sample SSR procedures are minimal. This finding is
    likely to be attributed to treatment effect sizes they explored: in most clinical
    trials signal ratio is fairly high, i.e. between-group variability is much smaller
    than within-group variability. This is particularly true for non-inferiority trials
    (i.e. trials where very small treatment effect is expected and the success of
    the trial really depends on how well the variability can be nailed down). Such
    an assumption would also hold for superiority trials powered for a minimal clinically
    effect size. With the landscape of clinical trials constantly changing, this assumption
    has to be evaluated carefully on a case-by-case basis; as budgets tighter and
    competition increases, many sponsors are forcing into their trials more aggressively
    for larger commercially viable effect sizes. In these situations, blinded SSR
    methods should be applied with caution, as the key assumptions driving their performance
    (i.e. low signal to ratio) may get violated and they are likely to increase sample
    size unnecessarily or fail to increase sample size when needed.


    Additional methods for blinded SSR with normal endpoints include the EM (expectation
    minimization) algorithm, the block-sum estimation of variance, and the unequal
    allocation within blocks method [7-9]. These methods are less commonly used due
    to various statistical issues. In general, we will not discuss these challenges
    here instead refer the reader to published reviews. For example, several references
    have a back-and-forth debate over the EM method [10-12].


    For trials with a binary endpoint, several methods are also available. Gould describe
    a procedure for updating a sample size using the observed overall response rate
    at the interim analysis [13,14]. A similar strategy in the context of a non-inferiority
    trial with binary endpoint is described in [15]. Variance estimation using blocks
    of unequal treatment allocation for binary data is proposed in [16].'
