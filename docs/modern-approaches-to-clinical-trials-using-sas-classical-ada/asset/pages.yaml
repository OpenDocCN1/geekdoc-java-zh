  md: '# 4.5.1 Fitting Priors


    We extend the fitting prior in (4.8) to the partial borrowing power prior approach
    formally proposed in [6] and [10]. The partial borrowing prior is that the historical
    data are borrowed only through the common parameters shared in the model for the
    historical data and the current data. Thus, the strength of the historical data
    is borrowed only through the common parameters. The fitting prior for $(\gamma,
    \theta)$ under the meta-survival model in (4.3) is given


    ```

    $$\pi^{(f)}\{(\gamma, \theta)|\mathbf{D}_0, a_0\\} \propto \prod_{j=1}^{K} \pi_{j}^{x_{0k}}(\exp\{l_j+lk(\gamma_0+\gamma_1+\theta_k)\})\

    \times \exp\\{-gamma_0+\gamma_1+\theta_k)/l_j+lk\}\pi_0^{(f)}(\theta_0)d\theta_0\pi_0^{(f)}(\gamma,
    \theta).$ (4.10)$

    ```


    where $0 \le a_0 \le 1$, $\pi_0^{(f)}(\theta_0)$ and $\pi_0^{(f)}(\gamma, \theta)$
    are the initial priors. In (4.10), independent initial priors, $N(0, \sigma_{\theta_0}^2)$,
    $N(0, \sigma_{\gamma_0}^2)$, $N(0, \tau_{\gamma_0}^2)$ and $N(0, \tau^2)$ are
    assumed for $\gamma_0, \gamma_1, \theta_k$, and $\theta_k$.


    In (4.10), the parameter $a_0$ controls the influence of the historical meta-survival
    data $\mathbfmathbfD}_0$ on the current data $D_K$. The parameter $a_0$ can be
    interpreted as a discounting parameter for the historical meta-survival data.
    It is reasonable to restrict the range of $a_0$ between 0 and 1, and thus we take
    $0 \le a_0 \le 1$. One of the main features of $a_0$ is that it controls the heaviness
    of the tails for the prior for $\gamma_0$ and $\gamma_1$ in the model. As $a_0$
    becomes smaller, the tails of (4.10) become heavier. If $a_0=0$, the prior does
    not depend on historical meta-survival data. That is, $a_0=0$ is equivalent to
    a prior specification with no incorporation of historical meta-survival data for
    the current study. Thus, the parameter $a_0$ controls the influence of the historical
    meta-survival data on the current study. Such control is important in the case
    where there is heterogeneity between the historical and current meta-survival
    data, or when the sample sizes of the historical and current meta-survival data
    are quite different.


    In (4.10), we prefer to consider a fixed $a_0$. When $a_0$ is fixed, we know'
  merge: -1
  pgno: 215
- img_proc: true
  md: exactly how much historical meta-data are incorporated in the new meta-experimental
    trial, and also how the type I error and power are related to $a_0$. As shown
    in the simulation study in 4.7 SAS MACRO BSMED, a fixed $a_0$ provides us additional
    flexibility in controlling the type error. In addition, our informative prior
    specification only allows us to borrow historical meta-experimental data for the
    models for the historical and current data. Thus, the historical meta-experimental
    data has the most influence on $\gamma_0$ and $\gamma_1$. For this reason, [6]
    and [10] call the power priors given in (4.10) “partial borrowing power priors."
