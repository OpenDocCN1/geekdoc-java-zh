  md: '# 6.2.7 Sample Size Considerations


    # 6.2.7.1 Statistical Hypothesis for Determining PoC


    Whenever sample size calculation is needed for a given study, the first point
    is to understand the hypothesis to be tested. In the process of designing a phase
    II dose ranging program, the initial statistical hypothesis is typically a proof
    of concept hypothesis. In the case when the study is designed with only two treatment
    groups – a placebo group is compared to the MTD of study product - the hypothesis
    can be expressed in a straight-forward fashion comparing the response from the
    test treatment against the response from the placebo. If the comparison is based
    on means, then the hypothesis can be written as


    $H_0 \mu_T = \mu_P \text{ VS. } H_1 \mu_T > \mu_P$


    where $\mu_T$ is the test treatment group mean, and $\mu_P$ is the placebo treatment
    group mean. In other words, if the mean responses from the test treatment group
    are statistically significantly different from the mean responses from the placebo
    group, then the concept is considered proven.


    However, in a dose-ranging trial design including more than two treatment groups,
    the PoC hypothesis is not necessarily straightforward. This is because it might
    not be the most efficient to just test the general hypothesis that at least one
    group is different from the others, but rather use a contrast as a primary objective.
    A typical dose-ranging design consists of the highest dose of the test product
    (could be the MTD) on the upper end, and it consists of the placebo representing
    the zero dose group. Ideally, such design includes three or four different doses
    in between these two groups. Under this scenario, two possible contrast options
    could be considered in specifying the PoC hypothesis. One option is to use the
    contrast comparing two doses, keeping the hypothesis the same as that the two-group
    setting – only test the highest dose (may be MTD) against placebo, as expressed
    in the hypothesis above. Another option is to use a contrast that includes more
    than two treatment groups in order to perform the PoC hypothesis test.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'If the second option is selected, then there could be many varieties in writing
    such a contrast.


    For example, in a four-group design with a placebo, low dose, medium dose and
    high dose, the PoC can only be based on the high dose versus a placebo (let $\mu_L$
    be the mean response of low dose, $\mu_M$ be the mean response for the medium
    dose, and $\mu_H$ be the mean response of high dose):


    $H_0: \mu_H = \mu_P \text{ VS. } H_1: \mu_H > \mu_P$.


    Or, the contrast can be a trend test, which is based on all doses [12,16], assuming
    a monotonic dose-response relationship and equally spaced doses:


    $H_0: -3\mu_P - \mu_L + \mu_M + 3\mu_H = 0 \text{ VS. } H_1: -3\mu_P - \mu_L +
    \mu_M + 3\mu_H > 0$.


    Another possible PoC contrast may also include equal weight to each dose (i.e.,
    testing the weighted sum of the three doses versus placebo):


    $H_0: -3\mu_P + \mu_L + \mu_M + \mu_H = 0 \text{ VS. } H_1: -3\mu_P + \mu_L +
    \mu_M + \mu_H > 0$.


    Assuming only the high dose is effective (i.e., testing the highest dose versus
    the weighted sum of the other groups):


    $H_0: -\mu_P - \mu_L - \mu_M + 3\mu_H = 0 \text{ VS. } H_1: -\mu_P - \mu_L - \mu_M
    + 3\mu_H > 0$.


    As can be found from the above examples, if a contrast (that includes more than
    two treatment groups) is used for the PoC hypothesis, then there could be many
    possible ways of writing such a contrast, but it is really important that the
    project team reflect choosing the most meaningful one for the particular compound
    and therapeutic area.


