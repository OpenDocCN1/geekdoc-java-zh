  md: '# 9.5.4 Bayesian Response-Adaptive Randomization


    In the aforementioned randomization methods, the allocation probability ratios
    only depend on the point estimates of the response probabilities.

    However, at the early stage of a clinical trial, the variabilities of these point
    estimates are typically large due to the small sample size. To address this problem,
    there is usually a pre-phase of equal randomization at the beginning of a trial,
    such that more stable allocation probabilities can be attained. On the other hand,
    the Bayesian approaches can naturally incorporate the estimation variability in
    determining the randomization probabilities.


    Specifically, let $p_1$ and $p_2$, denote the rates of the two treatments, respectively.
    Based on the accumulated data ($D$) in the trial, the posterior probability that
    treatment 2 has a higher response rate than treatment 2 is $\lambda=P(p_1>p_2|D)$.


    By comparing the posterior distributions $p_1$ and $p_2$, $\lambda$ automatically
    accounts for both the point and variance estimates of the treatment response rates.
    Thall and Wathen [16] suggested randomizing each treatment to treatment 1 through
    a power transformation,


    $\lambda(\gamma) = \frac{\lambda^\gamma}{\lambda^\gamma+(1-\lambda)^\gamma}$


    where $0\le\gamma\le 1$. If $\gamma=0$, the randomization scheme reduces to equal
    randomization regardless of the value of $\lambda$. In contrast to using a constant
    value for $\gamma$, the power parameter $\gamma$ may be allowed to depend on the
    accumulating sample size $n$, e.g., $\gamma_n=n/2N$, where $N$ is the maximum
    sample size planned for the study. We apply the Bayesian adaptive randomization
    to the previous example by using the macro BayesianRandomize`. To implement the
    procedure, one needs to specify the following parameters:


    +   1. $n_1,n_2,y_2$ are the total sample size and number of successes for treatment
    A and B, respectively.


    +   2. $alpha1,beta1,alpha2,beta2$ are the hyperparameters in the beta prior'
  merge: -1
  pgno: 457
- img_proc: true
  md: "distributions for the success probabilities under the two treatment groups,\
    \ respectively.\n\n+   3. design is the design parameter, design=1 means using\
    \ a constant tuning parameter. If design=1 is utilized, it requires that you specify\
    \ the value of γ. On the other hand, design=2 allows to vary with the sample size,\
    \ i.e., γn = n/2N. Users need to input the maximum sample size (n) if design=2.\n\
    \nWe illustrate the method by setting a constant γ=1, as well as a varying γ in\
    \ Example Code 9.9 Bayesian Response Adaptive Randomization. Results are summarized\
    \ in Output from Example Code 9.9.\n\n# Example Code 9.9 Bayesian Response Adaptive\
    \ Randomization\n\n```\n%macro BayesianRandomize(n1,y1,n2,y2,beta=0.5,alpha2=0.5,beta2=0.5,Gamma=1,n=150,seed=123)\n\
