- img_proc: true
  md: '# 6.1 Introduction


    In the drug development process, a candidate compound needs to go through a stringent
    series of testing for toxicity, pharmacokinetics/pharmacodynamics, efficacy, and
    safety before it can be released to the market for patient use. The process involves
    different phases of nonclinical studies on animals and clinical studies in healthy
    volunteers and the targeted patient population with the disease [1, 2]. Clinical
    studies can be categorized into 4 phases (phase I-IV), corresponding to four levels
    of stage-gate drug development: human pharmacology, therapeutic exploratory, therapeutic
    confirmatory, and therapeutic studies [3]. Phases I and II are generally considered
    exploratory and learning phases. The goal of phase III studies is mainly for therapeutic
    confirmation. Phase IV trials are post marketing studies. Because phase III pivotal
    studies are typically large scale and so very high cost (the cost in some of phase
    III studies could be even more than the total cost spent from the very beginning
    of a compound to the end of phase II studies), phase II studies are one of the
    most critical components before entering the phase III confirmatory stage. In
    addition, regulatory agencies generally recommend that a full dose range of the
    test therapy has been explored prior to initiating phase III and that identification
    of minimum effective dose (MinED) should be encouraged [4]. Given the substantial
    resources invested in phase III and beyond, a well-designed phase II study could
    be beneficial to both patients and sponsors, and consequently, reduce the time
    to market launch and/or increase the probability of success.


    This chapter describes the general consideration in a classical dose response
    study, and demonstrates two simulated examples for the analysis of such data using
    the model approach in SAS.'
