  md: '# 11.5 Summary


    Clinical researchers face increasing challenges and are presented with unique
    opportunities in the new era of personalized/precision medicine to meet the needs
    of patients, payers, and the ever increasing costs of health economics. In this
    chapter, we gave an overview of population enrichment designs that are growing
    in the statistical literature, with a focus on designs of predictive enrichment
    strategies as to increase the power and efficiency to detect an effective therapy
    with regard to a predictive biomarker in a clinical trial. We categorized the
    existing designs into classical designs, frequentist adaptive designs, and Bayesian
    adaptive designs. We also discussed the efficiency of a biomarker enrichment design
    compared to a traditional all-comers population, sensitivity/specificity of the
    assay, and the relative treatment effect of the biomarker positive group versus
    the biomarker negative group.


    Our focus was on designs that involved one or multiple predictive biomarkers that
    correlate with clinical efficacy endpoints of interest and the experimental treatment.
    The case of biomarkers that relate to safety outcomes is an important research
    area but not covered in this chapter. In addition, prognostic biomarkers, pharmacometric
    biomarkers, and surrogate biomarkers were out of the scope of this chapter.'
