  md: '# 8.1 Introduction and Background


    Phase II is an exciting and challenging phase where efficacy is initially tested
    for a new drug. This may include efficacy assessments for a single dose or multiple
    doses, possibly in separate studies (traditional phase Ia and IIb studies) or
    in a single study, such as a seamless phase Ia or IIb study.


    When testing multiple doses, one of the key strategic decisions is how wide of
    a dosing range will be tested and what doses should be tested across that interval.
    Though many dose-ranging studies are powered for pairwise comparisons, the strength
    of dose-response modeling is in the ability to better understand the drug effect
    a wide dose range or higher dose ratio helps adequately characterize the dose-response
    curve and enable better evaluation of doses not tested in a phase II study.


    For example, assume that the first study is designed with 3 doses and a placebo
    where the doses are selected in the following manner: two near the maximal dose
    effect () and around one the dose that produces 50% of the effect (ED₅₀); however,
    it does not incorporate any doses near the minimally effective dose. The second
    study includes a placebo and two doses with one near the minimally effective dose
    and one close to the ED₅₀. These two studies may be combined in the Bayesian framework
    to adequately characterize the dose response. The first study data could be incorporated
    as an informative prior when analyzing the second study. This will help to characterize
    the dose response of the compound adequately through borrowing information. This
    requires the assumption of exchangeability for this analysis, i.e. the data from
    the first and the second trial are exchangeable. While dose ranging studies are
    not often designed with multiple doses near a minimally or maximally effective
    dose, the results of phase II studies may appear to indicate that more than one
    dose achieved a minimal or maximum effect. The Bayesian dose-response design enables
    the seamless combination of study results.


    Consider a second example that uses the information on the dose response of the
    compound in a pre-clinical study using a biomarker or a pre-clinical assay for
    determining efficacy of the compound. The next'
  merge: -1
  pgno: 390
- img_proc: true
  md: 'clinical study is designed to estimate the same dose-response curve. If there
    is confidence in the translatability of the pre-clinical assay, a weakly informative
    prior based on the pre-clinical data can be utilized to calculate the posterior
    distribution of the dose response of the compound.


    Another example where Bayesian dose-response analysis can be helpful when testing
    compounds with the same endpoints in the same indication. If another internal
    compound has been tested for a particular indication, information from this compound
    could be utilized to construct an informative prior distribution for the next
    dose-response study in the same indication and endpoint. If there is reluctance
    to use the other compound''s dose response, prior results could be used as informative
    priors for modeling the placebo response. These examples are a few of the ways
    Bayesian techniques allow the use of prior information so the dose-response curve
    is characterized with fewer patients or is estimated with greater precision.


    The ICH E4 Dose response information to support drug registration guidelines state
    that “knowledge of the relationship among dose, drug concentration in blood, and
    response (effectiveness and undesirable effects) is important for the safe and
    effective use of drugs in individual patients” [1]. The guidelines further state
    that “agencies should also be open to the use of various statistical and pharmacometric
    techniques such as Bayesian and population methods, modeling, and pharmacokinetic-pharmacodynamic
    approaches.” This further emphasizes the importance and value of Bayesian dose-response
    analysis.


    In the case of dose-response studies with limited doses and small sample size
    designs, the asymptotic-based maximum likelihood estimators (MLE) may not estimate
    the parameters of the model adequately, whereas the Bayesian model does not have
    such a drawback. There are some examples of sparsely designed response clinical
    studies where the ED50 parameter estimates using the asymptotic-based maximum
    likelihood here were negative [2]. However, a Bayesian sigmoid model utilizing
    adequate prior information was able to obtain reasonable estimates for the ED50
    and parameters.


    During the learning phase of the clinical trial, i.e. phase II,'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'implementation of a Bayesian dose-response analyses allows for appropriate
    decisions by utilizing external belief and/or data and provides precise estimates
    for the dose response relation even with smaller sample sizes.


    Typically, responses for clinical trials in the inflammation and immunology area
    are binary in nature, i.e. a success or failure of the outcome. Although there
    are continuous scales that are available in these disease areas, the clinicians
    prefer to define success on the basis of whether a subject has responded or remitted.
    Apart from a model for continuous endpoint we also provide an example for a Bayesian
    model for binary data.'
