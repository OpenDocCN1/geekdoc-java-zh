- img_proc: true
  md: '$Z_M = \sqrt{M}Z_n + \sqrt{\frac{M-n}{M}}Z_{M-n}$


    where $Z_{M-n}$ is the test statistic based on the last $2(M-n)$ subjects. $Z_M$
    is sometimes called a naïve statistic because it is based on the standard calculation
    of the final test statistic following a two-stage design calculated as if data-driven
    sample size adjustment did not take place. The naïve test statistic $Z_M$ could
    inflate the overall type I error rate, sometimes quite drastically. To counter
    the effect on the type I error rate, CHW methods propose modifying the weights
    on $Z_n$ and $Z_{M-n}$ as shown below:


    $Z_M = \sqrt{N}Z_n + \sqrt{\frac{N-n}{N}}Z_{M-n}. \quad (3.2)$


    A closer explanation of rule (3.2) and comparison with (3.1) reveals that the
    CHW method is a special case of a p-value combination method with $w_1=\sqrt{n/N}$
    and $w_2=\sqrt{(N-n)/N}$. The type I error rate property of the CHW test does
    not depend on what rule is used to determine the sample size $M$ per group and
    it does not require any cap on $M$. The original CHW paper suggests selecting
    size $M$ based on the conditional power argument or setting $M=g(\Delta_0/\Delta_L)^2$,
    where $\Delta_L$ is the estimated treatment effect at the interim analysis and
    $\Delta_0$ is the treatment effect used to determine the original sample size.
    Another way to select the sample size $M$ is to plug-in an interim estimate of
    treatment effect $\Delta_L$ into a sample size calculation formula for a normally-distributed
    endpoint. Regardless of how the sample size is selected, the type I error rate
    will be preserved as long as the sample size adjustment is the only modification.


    The only difference between the naïve statistic $Z_M$ and the CHW statistic $Z''_M$
    is that the result from the second part of the trial (i.e. $Z_{M-n}$) is down-weighted
    when $N < M$. This has led to numerous criticisms of CHW statistics as violating
    the principle of "all patients being equal". The same argument expressed in mathematical
    terms states that the CHW statistic $Z''_M$ is different from the sufficient statistics
    $Z_M$, therefore leading to a loss of efficiency. While the debate over the loss
    of efficiency has generated a lot of theoretical research and publications, in
    practice this loss is not huge, especially if the sample size re-estimation rule
    is implemented reasonably, e.g. without multiple fold increase from $N$ to $M$'
