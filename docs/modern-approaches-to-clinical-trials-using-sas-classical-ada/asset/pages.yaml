  md: 'where $\gamma\in[0,1]$ is a tuning parameter ($\gamma=0$ corresponds to 1:1
    randomization and $\gamma=1$ is the original Thompson''s procedure [27]). Based
    on empirical evidence, Thall and Waten recommended using in practice $\gamma=1/2$
    or $\gamma=n/(2N)$ (where $n$ is the current sample size and $N$ is the maximum
    allowable sample size). An application of this approach in a soft tissue sarcoma
    trial is described in [28]. Some authors applications of Bayesian adaptive randomization
    in multi-arm randomized clinical trials in oncology where it was imperative to
    maximize individual patients'' benefit from participating in the trial [29-31].
    Korn and Freidlin in [32] argued that ethical benefits due to the reduction of
    number of non-responders (in the trial) are typically very modest compared to
    a fixed-schedule 1:1 or 2:1 randomization, and even these benefits can be outweighed
    by other complexities inherent to adaptive randomization (e.g. outcomes must be
    observed fast, patient inclusion rate must be low, and data must be periodically
    updated to modify randomization probabilities). In a follow-up note, Berry in
    [33] acknowledged that gains of Bayesian adaptive randomization are indeed somewhat
    limited in two-arm trials, but they can be much more pronounced in multi-objective,
    multi-arm trials. The potential gains of RAR should be assessed not only in terms
    of ethics (e.g. reduction in the number of non-responders), but also in terms
    of statistical efficiency criteria (e.g. enhanced precision or increased power
    of statistical tests). In particular, phase II dose-ranging trials and randomized
    phase II trials evaluating different experimental therapeutics with the common
    control arm provide a nice setting where RAR can provide a dual benefit of placing
    more patients on better-performing treatment arms and an increasing amount of
    statistical information for the chosen experimental objectives [21,31].


    # 10.1.3.3 Optimal Response-Adaptive Randomization


    As was mentioned in Section 10.1.2, modern research on RAR has focused on the
    development of optimal RAR procedures for multi-objective clinical trials with
    two or more treatment arms and different types of primary outcomes (binary, continuous
    (Gaussian), and time-to-event). The idea is to determine an allocation design
    that is optimal for selected trial objectives and construct a RAR procedure with
    minimal variability that converges to the chosen optimal allocation [34]. The
    RAR component is required because optimal allocation typically depends on'
  merge: -1
  pgno: 473
- img_proc: true
  md: model parameters that are to be estimated using accumulating outcome data from
    the trial. Optimal RAR designs have firm theoretical basis, and they can frequently
    be more efficient and more ethical than conventional equal allocation randomization
    designs [14,17-19]. Under widely satisfied conditions, optimal RAR designs have
    similar asymptotic properties (e.g. consistency and asymptotic normality of both
    allocation randomization designs designs [35]. A recent review of proper statistical
    inferential procedures following optimal RAR designs can be found in [36]. It
    should be acknowledged that many optimal RAR designs are relatively new methods
    that have not yet demonstrated their potential in practice. To facilitate implementation
    of these designs, validated information systems (to perform interactive data entry
    and dynamic update of treatment randomization probabilities) must be developed.
    In addition, input from the health authorities (FDA, EMA) will be essential for
    successful implementation of optimal RAR designs in clinical trials.
