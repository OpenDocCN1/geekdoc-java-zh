    \ proportion&;\n  set proportion& outpower;\nrun;\n%end;\n\ndata TypeError;\n\
    \  set proportion0;\n  keep pfhat BP1 BP2 BP3 BP4;\n  BP1=0;BP2=0;BP3=0;BP4=0;\n\
