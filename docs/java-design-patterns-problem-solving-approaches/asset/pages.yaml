  md: '# 34. TRANSFER OBJECT PATTERN


    The Transfer Object pattern is used when we want to pass data with multiple attributes
    in one shot from client to server. Transfer object is also known as Value Object.
    Transfer Object is a simple POJO class having getter/setter methods and is serializable
    so that it can be transferred over the network. It does not have any behavior.
    Server class normally fetches data from the database and fills the POJO and send
    it to the client or pass it by. For client, transfer object is read-only. Client
    can create its own transfer object and pass it to server to update values in database
    in one shot. Following are the entities of this type of design pattern.


    +   - Business Object - Business Service fills the Transfer Object with data.

    - Transfer Object - Simple POJO having methods to set/get attributes only.

    - Client - Client requests or sends the Transfer Object to Business Object.


    # Implementation


    We are going to create a StudentBO as Business Object, Student as Transfer Object
    representing its entities.


    TransferObjectPatternDemo, our demo class is acting as a client here and will
    use StudentBO and Student to demonstrate Transfer Object Design Pattern.


