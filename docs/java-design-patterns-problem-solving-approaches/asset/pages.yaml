  md: '# 8. BRIDGE PATTERN


    Bridge is used when we need to decouple an abstraction from its implementation
    so that the two can vary independently. This type of design pattern comes under
    structural pattern as this decouples implementation class and abstract class by
    providing a bridge structure between them.


    This pattern involves an interface which acts as a bridge which makes the functionality
    of concrete classes independent from interface implementer classes. Both types
    of classes can be altered structurally without affecting each other.


    We are demonstrating use of Bridge pattern via following example in which a circle
    can be drawn in different colors using same abstract class method but different
    bridge implementer classes.


    # Implementation


    We haveDrawAPI interface which is acting as a bridge implementer and concrete
    classes RedCircle, GreenCircle implementing the DrawAPI interface. Shape is an
    abstract class and will use object of DrawAPI. BridgePatternDemo, our demo class,
    will use Shape to draw different colored circle.


    ![](img/6426660228f292f87ed477d27e961d81_43_0.png)


