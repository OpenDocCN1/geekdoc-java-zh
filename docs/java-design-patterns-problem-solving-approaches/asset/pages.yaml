  md: '# 15. CHAIN OF RESPONSIBILITY PATTERN


    As the name suggests, the chain of responsibility pattern creates a chain of receiver
    objects for a request. This pattern decouples sender and receiver of a request
    based on type of request. This pattern comes under behavioral patterns.


    In this pattern, normally each receiver contains reference to another receiver.
    If one object cannot handle the request then it passes the same to the next receiver
    and so on.


    # Implementation


    We have created an abstract class AbstractLogger with level of logging. Then we
    have created three types of loggers extending the AbstractLogger. Each logger
    checks the level of message to its level and prints accordingly otherwise does
    not print and pass the message to its next logger.


    | ChainPatternDemo | AbstractLogger | <<abstract class>> |

    | --- | --- | --- |

    | uses | +INFO : int | |

    | +main() : void | +DEBUG : int | |

    | | +ERROR : int | |

    | | +level : int | |

    | | +nextLogger : AbstractLogger |

    | | +setNextLogger() : void |

    | | +logMessage() : void |

    | | -write() : void | |


    | ConsoleLogger | ErrorLogger | FileLogger |

    | --- | --- | --- |

    | +ConsoleLogger() | +ErrorLogger() | +FileLogger() |

    | +setNextLogger() : void | +setNextLogger() : void | +setNextLogger() : void
    |

    | +logMessage() : void | +logMessage() : void | +logMessage() : void |

    | -write() : void | -write() : void | -write() : void |'
