  md: '# 25. TEMPLATE PATTERN


    In Template pattern, an abstract class defines ways(s)/template(s) to execute
    its methods. Its subclasses can override the method implementation as per need
    but the invocation is to be in the same way as defined by an abstract class. This
    pattern comes under behavior pattern category.


    # Implementation


    We are going to create a Game abstract class defining operations with a template
    method set to be final so that it cannot be overridden. Cricket and Football are
    concrete classes that extend Game and override its methods.


    TemplateDemo, our demo class, will use Game to demonstrate use of template pattern.


    ![](img/6426660228f292f87ed477d27e961d81_117_0.png)


