  md: "# 28. BUSINESS DELEGATE PATTERN\n\nBusiness Delegate Pattern is used to decouple\
    \ presentation tier and business tier. It is basically use to reduce communication\
    \ or remote lookup functionality to business tier code in presentation tier we\
    \ have following entities. \n\n+   * **Client** - Presentation tier code may be\
    \ JSP, servlet or UI java code.\n* **Business Delegate** - A single entry point\
    \ class for client entities to provide access to Business Service methods.\n*\
    \ **Lookup Service** - Lookup service object is responsible to get relative business\
    \ implementation and provide business object access to business delegate object.\n\
    * **Business Service** - Concrete classes implement this business service to provide\
    \ actual business implementation logic.\n\n# Implementation\n\nWe are going to\
    \ create a `Client`, `BusinessDelegate`, `BusinessService`, `LookupService`, `JMSService`\
    \ and `EJBService` representing various entities of Business Delegate patterns.\n\
    \n`BusinessDelegatePatternDemo`, our demo class, will use `BusinessDelegate` and\
    \ `Client` to demonstrate use of Business Delegate pattern."
