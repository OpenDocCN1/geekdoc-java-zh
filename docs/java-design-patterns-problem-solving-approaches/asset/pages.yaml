    import java.util.List;\n\npublic class Subject {\n\n    private List<Observer>\
    \ observers\n        = new ArrayList<Observer>();\n    private int state;\n\n\
    \    public int getState() {\n        return state;\n    }\n\n    public void\
    \ setState(int state) {\n        this.state = state;\n        notifyAllObservers();\n\
    \    }\n\n    public void attach(Observer observer) {\n        observers.add(observer);\n\
