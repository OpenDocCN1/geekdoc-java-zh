    Interpreter pattern provides a way to evaluate language grammar or expression.
    This type of pattern comes under behavioral pattern. This pattern involves implementing
    an expression interface which tells to interpret a particular context. This pattern
    is used in SQL parsing, symbol processing engine etc.


    # Implementation


    We are going to create an interface Expression and concrete classes implementing
    the Expression interface. A class TerminalExpression is defined which acts as
    a main interpreter of context in question. Other classes are OrExpression and
    AndExpression which are used to create combinational expressions.


    InterpreterPatternDemo, our demo class, will use Expression class to create rules
    and demonstrate parsing of expressions.


