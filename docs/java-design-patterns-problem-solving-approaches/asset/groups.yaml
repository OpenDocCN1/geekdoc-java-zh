    \n# 26. VISITOR PATTERN\n\nIn Visitor pattern, we use a visitor class which changes\
    \ the executing algorithm of an element class. By this way, execution algorithm\
    \ of element can vary as when visitor varies. This pattern comes under behavior\
    \ pattern category. As per the pattern, element object has accept the visitor\
    \ object so that visitor object handles the operation on the element object.\n\
    \n# Implementation\n\nWe are going to create a ComputerPart interface defining\
    \ accept operation. Keyboard, Mouse, Monitor, and Computer are concrete classes\
    \ implementing ComputerPart interface. We will define another interface ComputerPartVisitor\
    \ which will define a visitor class operations. Computer uses concrete visitor\
    \ to do corresponding action.\n\nVisitorPatternDemo, our demo class, will use\
    \ Computer and ComputerPartVisitor classes to demonstrate use of visitor pattern.\n\
    \n```interface\n<<interface>\nComputerPartVisitor\n+visit(Computer) : void\n+visit(Mouse)\
    \ : void\n+visit(Keyboard) : void\n+visit(Monitor) : void\n```\n\n```interface\n\
    ComputerPartDisplayVisitor\n+visit(Computer) : void\n+visit(Mouse) : void\n+visit(Keyboard)\
    \ : void\n+visit(Monitor) : void\n```\n\n```\nVisitorPatternDemo\n+main() : void\n\
    ```\n\n![](img/6426660228f292f87ed477d27e961d81_121_0.png)\n\n![](img/6426660228f292f87ed477d27e961d81_121_1.png)\n\
    \n# Step 1\n\nDefine an interface to represent element.\n\n# ComputerPart.java\n\
    \n```java\npublic interface ComputerPart {\n    public void accept(ComputerPartVisitor\
    \ computerPartVisitor);\n}\n```\n\n# Step 2\n\nCreate concrete classes extending\
    \ the above class.\n\n# Keyboard.java\n\n```java\npublic class Keyboard implements\
    \ ComputerPart {\n    @Override\n    public void accept(ComputerPartVisitor computerPartVisitor)\
    \ {\n        computerPartVisitor.visit(this);\n    }\n}\n```\n\n# Monitor.java\n\
    \n```java\npublic class Monitor implements ComputerPart {\n    @Override\n   \
    \ public void accept(ComputerPartVisitor computerPartVisitor) {\n        computerPartVisitor.visit(this);\n\
    \    }\n}\n```\n\n# Mouse.java\n\n```java\npublic class Mouse implements ComputerPart\
    \ {\n    @Override\n    public void accept(ComputerPartVisitor computerPartVisitor)\
    \ {\n        computerPartVisitor.visit(this);\n    }\n}\n```\n\n![](img/6426660228f292f87ed477d27e961d81_122_0.png)\n\
