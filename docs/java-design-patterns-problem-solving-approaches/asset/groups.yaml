    \n# Step 1\n\nCreate an interface.\n\nStrategy.java\n\n```java\npublic interface\
    \ Strategy {\n    public int doOperation(int num1, int num2);\n}\n```\n\n# Step\
    \ 2\n\nCreate concrete classes implementing the same interface.\n\n# OperationAdd.java\n\
    \n```java\npublic class OperationAdd implements Strategy{\n    @Override\n   \
