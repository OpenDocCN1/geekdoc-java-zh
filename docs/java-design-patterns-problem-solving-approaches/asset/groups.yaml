    1\");\n        System.out.println(\"Shape : \" + clonedShape.getType());\n\n \
    \       Shape clonedShape2 = (Shape) ShapeCache.getShape(\"2\");\n        System.out.println(\"\
    Shape : \" + clonedShape2.getType());\n\n        Shape clonedShape3 = (Shape)\
    \ ShapeCache.getShape(\"3\");\n        System.out.println(\"Shape : \" + clonedShape3.getType());\n\
    \    }\n}\n```\n\n# Step 5\n\nVerify the output.\n\n```\nShape : Circle\nShape\
    \ : Square\nShape : Rectangle\n```\n\n![](img/6426660228f292f87ed477d27e961d81_35_0.png)\n\
    \n# 7. ADAPTER PATTERN\n\nAdapter pattern works as a bridge between two incompatible\
    \ interfaces. This type of design pattern comes under structural pattern as it\
    \ combines the capability of two independent interfaces. This pattern involves\
    \ a single class which is responsible to join functionalities of independent or\
    \ incompatible interfaces. A real life example could be a case of card reader\
    \ which acts as an adapter between memory card and a laptop. You plugin the memory\
    \ card into card reader and card reader into the laptop so that memory card can\
    \ be read via laptop.\n\nWe are demonstrating use of Adapter pattern via following\
    \ example in which an audio player device can play mp3 files and only wants to\
    \ use an advanced audio player capable of playing vlc and mp4 files.\n\n# Implementation\n\
    \nWe have a MediaPlayer interface and a concrete class AudioPlayer implementing\
    \ theMediaPlayer interface. AudioPlayer can play mp3 format audio files by default.\n\
    \nWe are having another interface AdvancedMediaPlayer and concrete classes implementing\
    \ the AdvancedMediaPlayer interface. These classes can play vlc and mp4 format\
    \ files.\n\nWe want to make AudioPlayer to play other formats as well. To attain\
    \ this, we have created an adapter class MediaAdapter which implements the MediaPlayer\
    \ interface and uses AdvancedMediaPlayer objects to play the required format.\n"
