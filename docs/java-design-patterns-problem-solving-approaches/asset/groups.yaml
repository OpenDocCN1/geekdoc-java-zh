    \ : Wrapper, Price : 50.5 | Total Cost: 85.5 |\n| Item : Pepsi, Packing : Bottle,\
    \ Price : 35.0 | |\n\n# 6. PROTOTYPE PATTERN\n\nPrototype pattern refers to creating\
    \ duplicate object while keeping performance in mind. This type of design pattern\
    \ comes under creational pattern as it provides one of the best ways to create\
    \ an object. This pattern involves implementing a prototype interface which tells\
