    \n# 7. 适配器模式 (ADAPTER PATTERN)\n\n适配器模式作为不兼容接口之间的桥梁。这种设计模式属于结构模式，因为它结合了两个独立接口的能力。该模式涉及一个类，负责连接独立或不兼容接口的功能。现实生活中的例子可以是读卡器，它作为内存卡和笔记本电脑之间的适配器。你将内存卡插入读卡器，然后将读卡器插入笔记本电脑，就可以通过笔记本读取内存卡。\n\
