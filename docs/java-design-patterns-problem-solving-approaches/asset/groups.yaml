    \nVerify the output.\n\n| Customers |\n| :--- |\n| Rob |\n| Not Available in Customer\
    \ Database |\n| Julie |\n| Not Available in Customer Database |\n\n# 24. STRATEGY\
    \ PATTERN\n\nIn Strategy pattern, a class behavior or its algorithm can be changed\
    \ at run time. This type of design pattern comes under behavior pattern.\n\nIn\
    \ Strategy pattern, we create objects whose represent various strategies and a\
    \ context object whose behavior varies as per its strategy object. The strategy\
    \ object changes the executing algorithm of the context object.\n\n# Implementation\n\
    \nWe are going to create a Strategy interface defining an action and concrete\
    \ strategy classes implementing the Strategy interface. Context is a class which\
