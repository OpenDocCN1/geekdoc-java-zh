    \ |\n| 2 | 结构模式：这些设计模式涉及类和对象的组合。继承的概念被用于组合接口并定义了组合对象的方式以获取新的功能。 |\n| 3 | 行为模式：这些设计模式专门关注对象之间的通信。\
