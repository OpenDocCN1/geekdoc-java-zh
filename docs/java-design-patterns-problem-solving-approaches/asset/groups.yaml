    \n```\n10 + 5 = 15\n10 - 5 = 5\n10 * 5 = 50\n```\n\n# 25. TEMPLATE PATTERN\n\n\
    In Template pattern, an abstract class defines ways(s)/template(s) to execute\
    \ its methods. Its subclasses can override the method implementation as per need\
    \ but the invocation is to be in the same way as defined by an abstract class.\
    \ This pattern comes under behavior category.\n\n# Implementation\n\nWe are going\
    \ to create a Game abstract class defining operations with a template method set\
    \ to be final so that it cannot be overridden. Cricket and Football are concrete\
    \ classes that extend Game and override its methods.\n\nTemplateDemo, our demo\
    \ class, will use Game to demonstrate use of template pattern.\n\n![](img/6426660228f292f87ed477d27e961d81_117_0.png)\n\
    \n# Step 1\n\nCreate an abstract class with a template method being final.\n\n\
    ```java\npublic abstract class Game {\n    abstract void initialize();\n    abstract\
    \ void startPlay();\n    abstract void endPlay();\n\n    //template method\n \
    \   public final void play(){\n\n        //initialize the game\n        initialize();\n\
    \n        //start game\n        startPlay();\n\n        //end game\n        endPlay();\n\
    \    }\n}\n```\n\n# Step 2\n\nCreate concrete classes extending the above class.\n\
    \n# Cricket.java\n\n```java\npublic class Cricket extends Game {\n\n    @Override\n\
    \    void endPlay() {\n        System.out.println(\"Cricket Game Finished!\");\n\
    \    }\n\n    @Override\n    void initialize() {\n        System.out.println(\"\
    Cricket Game Initialized! Start playing.\");\n    }\n}\n```\n\n![](img/6426660228f292f87ed477d27e961d81_118_0.png)\n"
