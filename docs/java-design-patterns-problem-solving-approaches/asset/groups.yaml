    - 34. TRANSFER OBJECT PATTERN....................................................................\
    \ 157\n- Implementation ............................................................................................................157\n\
    \n## 1. DESIGN PATTERN OVERVIEW\n\nDesign patterns represent the best practices\
    \ used by experienced object-oriented software developers. Design patterns are\
    \ solutions to general problems that software developers faced during software\
    \ development. These solutions were obtained by trial and error by numerous software\
    \ developers over quite a substantial period of time.\n\n## What is Gang of Four\
    \ (GOF)?\n\nIn 1994, four authors Erich Gamma, Richard Helm, Ralph Johnson and\
    \ John Vlissides published a book titled **Design Patterns - Elements of Reusable\
    \ Object-Oriented Software** which initiated the concept of Design Pattern in\
    \ Software development.\n\nThese authors are collectively known as **Gang of Four\
    \ (GOF)**. According to these authors design patterns are primarily based on the\
    \ following principles of object oriented design.\n\n- Program to an interface\
    \ not an implementation\n- Favor object composition over inheritance\n\n## Usage\
    \ of Design Pattern\n\nDesign Patterns have two main usages in software development.\n\
    \n## Common platform for developers\n\nDesign patterns provide a standard terminology\
    \ and are specific to particular scenario. For example, a singleton design pattern\
    \ signifies the use of single object so all developers familiar with single design\
    \ pattern will make use of single object and can tell each other that program\
    \ is following a singleton pattern.\n\n## Best Practices\n\nDesign patterns have\
    \ been evolved over a long period of time and they provide best solutions to certain\
    \ problems faced during software development. Learning these patterns help inexperienced\
    \ developers to learn software design in an easy and fast way.\n\n## Types of\
    \ Design Patterns\n\nAs per the design pattern reference book **Design Patterns\
    \ - Elements of Reusable Object-Oriented Software**, there are 23 design patterns\
    \ which can\n\n![](img/6426660228f292f87ed477d27e961d81_6_0.png)\n\nbe classified\
    \ in three categories: Creational, Structural and Behavioral patterns.\nWe will\
    \ also discuss category of design pattern: J2EE design patterns.\n\n| S.N. | Pattern\
    \ & Description |\n| :--- | :--- |\n| 1 | Creational Patterns: These design patterns\
    \ provide a way to create objects while hiding the creation logic, rather than\
    \ instantiating objects directly using new operator. This gives more flexibility\
    \ to the program in deciding which objects need to be created for a given use\
    \ case. |\n| 2 | Structural Patterns: These design patterns concern class and\
    \ object composition. Concept of inheritance is used to compose interfaces and\
    \ define ways to compose objects to obtain new functionalities. |\n| 3 | Behavioral\
    \ Patterns: These design patterns are specifically concerned with communication\
    \ between objects. |\n| 4 | J2EE Patterns: These design patterns are specifically\
    \ concerned with the presentation tier. These patterns are identified by Sun Java\
    \ Center. |\n\n## 2. FACTORY PATTERN\n\nFactory pattern is one of most used design\
    \ patterns in Java. This type of design pattern comes under creational pattern\
    \ as this pattern provides one of the best ways to create an object.\n\nIn Factory\
    \ pattern, we create objects without exposing the creation logic to the client\
    \ and refer to newly created object using a common interface.\n\n## Implementation\n\
    \nWe are going to create a Shape interface and concrete classes implementing the\
    \ Shape interface. A factory class ShapeFactory is defined as a next step.\n\n\
    FactoryBeanDemo, our demo class, will use ShapeFactory to get a Shape object.\
    \ It will pass information (CIRCLE / RECTANGLE / SQUARE) to ShapeFactory to get\
    \ the type of object it needs.\n\n![](img/6426660228f292f87ed477d27e961d81_8_0.png)\n\
    \n## Step 1\n\nCreate an interface.\n\nShape.java\n\n```java\npublic interface\
    \ Shape {\n    void draw();\n}\n```\n```\n\n## Step 2\n\nCreate concrete classes\
    \ implementing the same interface.\n\n### Rectangle.java\n\n```java\npublic class\
    \ Rectangle implements Shape {\n\n  @Override\n  public void draw() {\n    System.out.println(\"\
    Inside Rectangle::draw() method.\");\n  }\n}\n```\n\n### Square.java\n\n```java\n\
    public class Square implements Shape {\n\n  @Override\n  public void draw() {\n\
    \    System.out.println(\"Inside Square::draw() method.\");\n  }\n}\n```\n\n###\
    \ Circle.java\n\n```java\npublic class Circle implements Shape {\n\n  @Override\n\
    \  public void draw() {\n    System.out.println(\"Inside Circle::draw() method.\"\
    );\n  }\n}\n```\n\n## Step 3\n\nCreate a Factory to generate object of concrete\
    \ class based on given information.\n\n### ShapeFactory.java\n\n```java\npublic\
    \ class ShapeFactory {\n\n    //use getShape method to get object of type shape\n\
    \    public Shape getShape(String shapeType){\n        if(shapeType == null){\n\
    \            return null;\n        }\n        if(shapeType.equalsIgnoreCase(\"\
    CIRCLE\"))\n            return new Circle();\n        } else if(shapeType.equalsIgnoreCase(\"\
    RECTANGLE\"))\n            return new Rectangle();\n        } else if(shapeType.equalsIgnoreCase(\"\
    SQUARE\"))\n            return new Square();\n        }\n        return null;\n\
    \    }\n}\n```\n\n## Step 4\n\nUse the Factory to get object of concrete class\
    \ by passing an information such as type.\n\n### FactoryPatternDemo.java\n\n```java\n\
    public class FactoryPatternDemo {\n\n    public static void main(String[] args)\
    \ {\n        ShapeFactory shapeFactory = new ShapeFactory();\n\n        Shape\
    \ shape1 = shapeFactory.getShape(\"CIRCLE\");\n        shape1.draw();\n\n    \
    \    Shape shape2 = shapeFactory.getShape(\"RECTANGLE\");\n        shape2.draw();\n\
    \n        Shape shape3 = shapeFactory.getShape(\"SQUARE\");\n        shape3.draw();\n\
    \    }\n}\n```\n\n## Step 5\n\nVerify the output.\n\n| Inside Circle::draw() method\
    \ |\n| Inside Rectangle::draw() method |\n| Inside Square::draw() method |\n"
  mdcn: "\n\n- 33. 服务定位器模式.....................................................................\
    \ 151\n- 实现 ............................................................................................................151\n\
    - 34. 传输对象模式...................................................................................\
    \ 157\n- 实现 ............................................................................................................157\n\
    \n## 1. 设计模式概述\n\n设计模式代表了丰富的面向对象软件开发人员所使用的最佳实践。设计模式是软件开发人员在软件开发过程中面临的通用问题的解决方案。这些解决方案是许多软件开发人员在相当长的时间内通过试错获得的。\n\
    \n## 什么是四人帮 (GOF)？\n\n1994年，四位作者 Erich Gamma、Richard Helm、Ralph Johnson 和 John\
    \ Vlissides 出版了一本名为**《设计模式：可用面向对象软件的要素》**的书书，这本书开启了软件开发中设计模式的概念。\n\n这些作者被统称为**四人帮（GOF）**。根据这些作者的观点，设计模式主要基于以下面向对象的设计原则：\n\
    \n- 面向接口编程而非面向实现\n- 优先使用对象组合优于继承\n\n## 设计模式的使用\n\n设计模式在软件开发中有两个主要用途。\n\n## 开发人员的通用平台\n\
    \n设计模式提供了标准的术语，并针对特定的场景。例如，单例设计模式表示使用单个对象，因此所有熟悉单例设计的开发人员都会使用单对象，并可以相互告诉对方程序遵循了单例模式。\n\
    \n## 最佳实践\n\n设计模式经过了长时间的演变，它们为软件开发过程中遇到的某些问题提供了最佳解决方案。学习这些模式可以帮助缺乏经验的开发人员以简单、快速的方式学习软件设计。\n\
