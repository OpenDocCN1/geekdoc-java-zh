    \ getName() {\n        return name;\n    }\n\n    @Override\n    public boolean\
    \ isNil() {\n        return false;\n    }\n}\n```\n\n# NullCustomer.java\n\n```java\n\
    public class NullCustomer extends AbstractCustomer {\n```\n\n![](img/6426660228f292f87ed477d27e961d81_110_0.png)\n\
