    \n80\n\n# 17. INTERPRETER PATTERN\n\nInterpreter pattern provides a way to evaluate\
    \ language grammar or expression. This type of pattern comes under behavioral\
    \ pattern. This pattern involves implementing an expression interface which tells\
    \ to interpret a particular context. This pattern is used in SQL parsing, symbol\
    \ processing engine etc.\n\n# Implementation\n\nWe are going to create an interface\
    \ Expression and concrete classes implementing the Expression interface. A class\
    \ TerminalExpression is defined which acts as a main interpreter of context in\
    \ question. Other classes are OrExpression and AndExpression which are used to\
    \ create combinational expressions.\n\nInterpreterPatternDemo, our demo class,\
    \ will use Expression class to create rules and demonstrate parsing of expressions.\n\
    \n![](img/6426660228f292f87ed47d27e961d81_86_0.png)\n\n# Step 1\n\nCreate an expression\
    \ interface.\n\nExpression.java\n\n```java\npublic interface Expression {\n  \
    \  public boolean interpret(String context);\n}\n```\n\n# Step 2\n\nCreate concrete\
    \ classes implementing the above interface.\n\nTerminalExpression.java\n\n```java\n\
    public class TerminalExpression implements Expression {\n\n    private String\
    \ data;\n\n    public TerminalExpression(String data){\n        this.data = data;\n\
    \    }\n\n    @Override\n    public boolean interpret(String context) {\n    \
    \    if(context.contains(data)){\n            return true;\n        }\n      \
    \  return false;\n    }\n}\n```\n\nOrExpression.java\n\n```java\npublic class\
    \ OrExpression implements Expression {\n\n    private Expression expr1 = null;\n\
    \    private Expression expr2 = null;\n```\n\n![](img/6426660228f292f87ed47d27e961d81_87_0.png)\n\
    \n```java\npublic OrExpression(Expression expr1, Expression expr2) {\n    this.expr1\
    \ = expr1;\n    this.expr2 = expr2;\n}\n\n@Override\npublic boolean interpret(String\
    \ context) {\n    return expr1.interpret(context) || expr2.interpret(context);\n\
    }\n}\n```\n\n# AndExpression.java\n\n```java\npublic class AndExpression implements\
    \ Expression {\n    private Expression expr1 = null;\n    private Expression expr2\
    \ = null;\n\n    public AndExpression(Expression expr1, Expression expr2) {\n\
    \        this.expr1 = expr1;\n        this.expr2 = expr2;\n    }\n\n    @Override\n\
    \    public boolean interpret(String context) {\n        return expr1.interpret(context)\
    \ && expr2.interpret(context);\n    }\n}\n```\n\n# Step 3\n\nInterpreterPatternDemo\
    \ uses Expression class to create rules and then parse them.\n\n# InterpreterPatternDemo.java\n\
