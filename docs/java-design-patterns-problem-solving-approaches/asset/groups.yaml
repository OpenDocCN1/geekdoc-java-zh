    # 30. DATA ACCESS OBJECT PATTERN


    Data Access Object Pattern or DAO pattern is used to separate low level data accessing
    API or operations from high level business services. Following are the participants
    in Data Access Object Pattern.


    +   - Data Access Object Interface - This interface defines the standard operations
    to be performed on a model object(s).

    - Data Access Object concrete class - This class implements above. This class
    is responsible to get data from a data source which can be database / xml or any
    other storage mechanism.

    - Model Object or Value Object - This object is simple POJO containing get/set
    methods to store data retrieved using DAO class.


    # Implementation


    We are going to create a Student acting as a Model or Value Object.StudentDao
    is Data Access Object Interface. StudentDaoImpl is concrete implementing Data
    Access Object Interface. DaoPatternDemo, our demo class, will use StudentDao to
    demonstrate the use of Data Access Object pattern.


