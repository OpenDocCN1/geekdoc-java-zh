    \n# Step 1\n\nCreate an abstract class implementing Cloneable.\n\n# Shape.java\n\
    \n```java\npublic abstract class Shape implements Cloneable {\n\n    private String\
    \ id;\n    protected String type;\n\n    abstract void draw();\n\n    public String\
    \ getType() {\n        return type;\n    }\n\n    public String getId() {\n  \
    \      return id;\n    }\n\n    public void setId(String id) {\n        this.id\
    \ = id;\n    }\n\n    public Object clone() {\n        Object clone = null;\n\
    \        try {\n            clone = super.clone();\n        } catch (CloneNotException\
    \ e) {\n            e.printStackTrace();\n        }\n        return clone;\n \
    \   }\n}\n```\n\n# Step 2\n\nCreate concrete classes extending the above class.\n\
    \n# Rectangle.java\n\n```java\npublic class Rectangle extends Shape {\n\n    public\
    \ Rectangle() {\n        type = \"Rectangle\";\n    }\n\n    @Override\n    public\
    \ void draw() {\n        System.out.println(\"Inside Rectangle::draw.\");\n  \
    \  }\n}\n```\n\n# Square.java\n\n```java\npublic class Square extends Shape {\n\
    \n    public Square() {\n        type = \"Square\";\n    }\n\n    @Override\n\
    \    public void draw() {\n        System.out.println(\"Inside Square::draw.\"\
    );\n    }\n}\n```\n\n# Circle.java\n\n```java\npublic class Circle extends Shape\
    \ {\n\n    public Circle() {\n        type = \"Circle\";\n    }\n\n    @Override\n\
    \    public void draw() {\n        System.out.println(\"Inside Circle::draw.\"\
    );\n    }\n}\n```\n\n![](img/6426660228f292f87ed477d27e961d81_33_0.png)\n\n# Step\
    \ 3\n\nCreate a class to get concrete classes from database and store them in\
    \ a Hashtable.\n\n# ShapeCache.java\n\n```java\nimport java.util.Hashtable;\n\n\
    public class ShapeCache {\n\n    private static Hashtable<String, Shape> shapeMap\
    \ = new Hashtable<String, Shape>();\n\n    public static Shape getShape(String\
    \ shapeId) {\n        Shape cachedShape = shapeMap.get(shapeId);\n        return\
    \ (Shape) cachedShape.clone();\n    }\n\n    // for each shape run database query\
    \ and create shape\n    // shapeMap.put(shapeKey, shape);\n    // for example,\
    \ we are adding three shapes\n    public static void loadCache() {\n        Circle\
    \ circle = new Circle();\n        circle.setId(\"1\");\n        shapeMap.put(circle.getId(),circle);\n\
    \n        Square square = new Square();\n        square.setId(\"2\");\n      \
    \  shapeMap.put(square.getId(),square);\n\n        Rectangle rectangle = new Rectangle();\n\
    \        rectangle.setId(\"3\");\n        shapeMap.put(rectangle.getId(),rectangle);\n\
    \    }\n}\n```\n\n# Step 4\n\nPrototypePatternDemo uses ShapeCache class to get\
    \ clones of shapes stored in a Hashtable.\n\n# PrototypePatternDemo.java\n\n```java\n\
    public class PrototypePatternDemo {\n    public static void main(String[] args)\
