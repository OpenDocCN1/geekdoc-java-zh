    \n# 18. ITERATOR PATTERN\n\nIterator pattern is a commonly used design pattern\
    \ to access elements of a collection sequentially without exposing its underlying\
    \ representation. It falls under behavioral category.\n\n# Implementation\n\n\
    We are going to create an Iterator interface and concrete classes implementing\
    \ the Iterator interface to access a collection. IteratorPatternDemo, our demo\
    \ class, will use NameRepository to print stored names.\n\n![](img/6426660228f292f87ed47d27e961d81_90_0.png)\n\
    \n# Step 1\n\nCreate interfaces.\n\nIterator.java\n\n```java\npublic interface\
    \ Iterator {\n    public boolean hasNext();\n    public Object next();\n}\n```\n\
    \n# Step 2\n\nCreate concrete classes implementing the Container interface. This\
    \ class has inner class NameIterator.\n\nContainer.java\n\n```java\npublic interface\
    \ Container {\n    public Iterator getIterator();\n}\n```\n\n# NameRepository.java\n\
    \n```java\npublic class NameRepository implements Container {\n    public String\
    \ names[] = {\"Robert\", \"John\", \"Julie\", \"Lora\"};\n\n    @Override\n  \
    \  public Iterator getIterator() {\n        return new NameIterator();\n    }\n\
    \n    private class NameIterator implements Iterator {\n        int index;\n\n\
    \        @Override\n        public boolean hasNext() {\n            if(index <\
    \ names.length) {\n                return true;\n            }\n            return\
    \ false;\n        }\n\n        @Override\n        public Object next() {\n   \
    \         if(hasNext()) {\n                return names[index++];\n          \
    \  }\n            return null;\n        }\n    }\n}\n```\n\n# Step 3\n\nUse NameRepository\
    \ to get iterator and print names.\n\nIteratorPatternDemo.java\n\n```java\npublic\
    \ class IteratorPatternDemo {\n  public static void main(String[] args) {\n  \
    \  NameRepository namesRepository = new NameRepository();\n\n    for(Iterator\
    \ iter = namesRepository.getIterator();iter.hasNext();){\n      String name =\
    \ (String)iter.next();\n      System.out.println(\"Name : \" + name);\n    }\n\
    \  }\n}\n```\n\n# Step 4\n\nVerify the output.\n\n```\nName : Robert\nName : John\n\
    Name : Julie\nName : Lora\n```\n\n# 19. MEDIATOR PATTERN\n\nMediator pattern is\
