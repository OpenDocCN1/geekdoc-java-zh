    工厂模式是 Java 中最常用的设计模式之一。这种设计模式属于创建模式，因为这种模式提供了创建对象的最佳方式之一。\n\n在工厂模式中，我们创建对象而不向客户端暴露创建逻辑，并使用公共接口引用新创建的对象。\n\
