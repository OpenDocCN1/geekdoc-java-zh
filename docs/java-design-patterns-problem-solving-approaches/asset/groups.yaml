    # 4. SINGLETON PATTERN


    Singleton pattern is one of the simplest design patterns in Java. This type of
    design comes under creational pattern as this pattern provides one of the best
    ways to create an object.


    This pattern involves a single class which is responsible to create an object
    while making sure that only single object gets created. This class provides a
    way to access its only object which can be accessed directly without instantiating
    the object of the class.


    # Implementation


    We are going to create a SingletonObject class which has its constructor private
    and a static instance of itself.


    SingletonObject class provides a static method to get its static instance to outside
    world. SingletonPatternDemo, our demo class, will use SingletonObject class to
    get a SingletonObject object.


