    \    this.data = data;\n    }\n\n    public String getData() {\n        return\
    \ data;\n    }\n}\n```\n\n### Dependent2.java\n\n```java\npublic class Dependent2\
    \ {\n    private String data;\n\n    public void setData(String data) {\n    \
    \    this.data = data;\n    }\n\n    public String getData() {\n        return\
    \ data;\n    }\n}\n```\n\n# Step 2\n\n创建粗粒度对象。\n\n### CoarseGrainedObject.java\n\
