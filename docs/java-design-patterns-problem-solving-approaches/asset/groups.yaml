    \ (Model Object or Value Object)** - 该对象是包含 get/set 方法的简单 POJO，用于存储通过 DAO 类检索的数据。\n\
    \n# 实现\n\n我们将创建一个作为模型对象或值对象的 Student。`StudentDao` 是数据访问对象接口，`StudentDaoImpl` 是实现该接口的具体类。我们的演示类\
