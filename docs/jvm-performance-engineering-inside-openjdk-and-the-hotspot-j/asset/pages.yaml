  md: "# Chapter 3 From Monolithic to Modular Java: A Retrospective and Ongoing Evolution\n\
    \n# Instantiating Service Implementations\n\nWhen iterating over the ServiceLoader\
    \ instance, the API automatically instantiates the service implementations provided\
    \ by the service providers. In our example, the BrickProvider class is instantiated,\
    \ and its build() method is called when iterating over the ServiceLoader instance.\n\
    \n# Encapsulating Implementation Details\n\nBy using JPMS, the com.example.brickprovider\
    \ module can encapsulate its implementation details, exposing only the BrickHouse\
    \ service that it provides. This allows the com.example.builder module to consume\
    \ the service without depending on the concrete implementation, creating a more\
    \ robust and maintainable system.\n\n# Adding More Service Providers\n\nOur example\
    \ can be easily extended by adding more service providers implementing the BrickHouse\
    \ interface. As long as the new service providers are properly declared in their\
    \ respective module-info.java files, the com.example.builder module will be able\
    \ to discover and use them automatically through the ServiceLoader API. This allows\
    \ for a more modular and extensible system that can adapt to changing requirements\
    \ or implementations.\n\nFigure 3.4 is a use-case diagram that depicts the interactions\
    \ between the service consumer and service provider. It includes two actors: Service\
    \ Consumer and Service Provider.\n\n+   * **Service Consumer**: This uses the\
    \ services provided by the Service Provider. The Service Consumer interacts with\
    \ the Modular JDK in the following ways:\n    * **Discover Service Implementations**:\
    \ The Service Consumer uses the Modular JDK to find available service implementations.\n\
    \    * **Instantiate Service Implementations**: Once the service implementations\
    \ are discovered, the Service Consumer uses the Modular JDK to create instances\
    \ of them.\n    * **Encapsulation Implementation Details**: The Service Consumer\
    \ benefits from the encapsulation provided by the Modular JDK, which allows it\
    \ to use services without needing to know their implementation.\n* **Service Provider**:\
    \ This implements and provides the services. The Service Provider interacts with\
    \ the Modular JDK in the following ways:\n    * **Implement Service Interface**:\
    \ The Service Provider uses the Modular JDK to implement the service interface,\
    \ which defines the contract for the service.\n    * **Encapsulation Implementation\
    \ Details**: The Service Provider uses the Modular JDK to hide its service implementation,\
    \ exposing only the service interface.\n    * **Add More Service Providers**:\
    \ The Service Provider can use the Modular JDK to add more providers for the service,\
    \ enhancing the modularity and extensibility of the system."
