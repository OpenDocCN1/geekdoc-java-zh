  md: "# Beyond Java 17: Project Valhalla\n\nNOTE The klass will be compressed compressed\
    \ if -XX:+UseCompressedOops is enabled.\n\n# Analyzing Object Memory Layout with\
    \ Java Object Layout (JOL)\n\nJava Object Layout JOL^4 is a powerful tool for\
    \ understanding the memory allocation of objects. It provides a clear breakdown\
    \ of the overhead associated with each object, including the object header and\
    \ fields. Here is how we analyze the layout of an 8-byte array using JOL:\n\n\
    ```\nimport org.openjdk.jol.info.ClassLayout;\nimport org.openjdk.jol.vm.VM;\n\
    import static java.lang.System.out;\n```\n\n```\npublic class ArrayLayout {\n\
    \    public static void main(String[] args) throws Exception {\n        out.println(VM.current().details());\n\
    \        byte[] ba = new byte[8];\n        out.println(ClassLayout.parse(ba).toPrintable());\n\
    \    }\n}\n```\n\nFor more information on how to print internal details, refer\
    \ to the following two jol-core files:5\n\n```\norg/openjdk/jol/info/ClassLayout.java\n\
    org/openjdk/jol/info/ClassData.java\n```\n\nFor simplicity, let's run this code\
    \ on 64-bit hardware with a 64-bit operating system and a 64-bit VM with -XX:+UseCompressedOops\
    \ enabled. This option has been enabled by default since Java 6, update 23. If\
    \ you are unsure which options are enabled by default, use the -XX:+PrintFlags\
    \ to check. Here's the output from JOL:\n\n```\n# Running 64-bit HotSpot VM.\n\
    # Using compressed oops with 3-bit shift.\n# Using compressed klass with 3-bit\
    \ shift.\n# WARNING | Compressed references base/shifts are guessed by the experiment!\n\
    # WARNING | Therefore, computed addresses are just guesses, and ARE RELIABLE.\n\
    # WARNING | Make sure to attach ServiceAgent to get the reliable addresses.\n\
    # Objects are 8 bytes aligned.\n# Field sizes by type: 4, 1, 1, 2, 2, 4, 8, 8\
    \ [bytes]\n# Array element sizes: 4, 1, 1, 2, 2, 4, 8, 8 [bytes]\n```\n\n^4 OpenJDK.\
    \ \"Code Tools: jol.\" https://openjdk.org/projects/code-tools/jol/\n\n^5 Maven\
    \ Repository. \"Java Object Layout Core.\" https://mvn.repository.com/org.openjdk.jol/jol-core."
