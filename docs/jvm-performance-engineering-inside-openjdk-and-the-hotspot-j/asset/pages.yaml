  md: "# The Importance of Performance Benchmarking\n\nIn benchmarking scenario, we\
    \ will use the AtomicInteger class from the java.util.concurrent package. The\
    \ benchmark features two methods: testAtomicIntegerAlways and testAtomicIntegerNever.\
    \ The former swaps a value; the latter never commits a change and simply retrieves\
    \ the existing value. This benchmarking exercise aims to illustrate how processors\
    \ and locking primitives with scalability can potentially reap substantial benefits\
    \ from the new LSE instructions.\n\nIn the context of Arm processors, LSE provide\
    \ more efficient atomic operations. with minimal overhead—an outcome sustained\
    \ by extreme use. In the case of LSE, Arm processors revert to load-link/store-conditional\
    \ (LL/SC) operations, specifically using exclusive load-acquire (LDAXR) and store-release\
    \ (STLXR) instructions for atomic read-modify-write operations. Atomic read-modify-write\
    \ operations, such as CAS, the backbone of many synchronization primitives. They\
    \ involve reading a value from memory, comparing it with an expected value, possibly\
    \ modifying it and writing back to memory—all atomically.\n\nIn the LL/SC model,\
    \ the LDAXR instruction reads a value from memory and marks the location as reserved.\
    \ The STLXR instruction writes to a new value into memory only if no other memory\
    \ location has changed since the LDAXR operation.\n\nHowever, LL/SC operations\
    \ can experience performance bottlenecks due to potential contention and retries\
    \ when multiple threads access the same memory location. This challenge is effectively\
    \ addressed by the LSE instructions, which are designed to improve the performance\
    \ of atomic operations and enhance the overall scalability of multithreaded applications.\n\
    \nHere's relevant code snippet from the OpenJDK JMH micro-benchmarks:\n\n```\n\
    package org.openjdk.jhm.bench.java.util.concurrent;\n\nimport org.openjdk.jhm.annotations.*;\n\
    import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\n\
    \n@BenchmarkMode(Mode.AverageTime)\n@OutputUnit(TimeUnit.NANOSECONDS)\n@State(Scope.Benchmark)\n\
    public class Atomic {\n\n    public AtomicInteger atomicInteger;\n\n    @Setup(Level.Iteration)\n\
    \    public void setUp() {\n        atomicInteger = new AtomicInteger(0);\n  \
    \  }\n\n    /** Always swap in value. This test should be compiled into a CAS\
    \ */\n@Benchmark\n@OperationsPerInvocation(2)\n```"
