    # ZGC Core Concepts: ZPages


    A ZPage is a contiguous chunk of memory within the heap, designed to optimize
    memory management and the GC process. It can have three different dimensions—small,
    medium, and large. The exact sizes of these pages can vary based on the JVM configuration
    and the platform on which it’s running. Here’s a brief overview:


    +   - **Small pages:** These are typically used for small object allocations.
    Multiple small pages can exist, and each page can be managed independently.


    +   - **Medium pages:** These are larger than small pages and are used for medium-sized
    object allocations.


    +   - **Large pages:** These are reserved for large object allocations. Large
    pages are typically used for objects that are too big to fit into small or medium
    pages. An object allocated in a large page occupies the entire page.


    Figures 6.15 and 6.16 show the usage of ZPages in a benchmark, highlighting the
    frequency and volume of each page type. Figure 6.15 shows a predominance of small
    pages and Figure 6.16 is a zoomed-in of the same graph to focus on the medium
    and large page types.


    ![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_230_0.png)


