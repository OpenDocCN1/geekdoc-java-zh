    \          <arg>jdk.incubator.vector</arg>\n        </compilerArgs>\n      </configuration>\n\
    \    </plugin>\n  </plugins>\n</build>\n```\n\n# The Foreign Function and Memory\
    \ API\n\nAnother crucial aspect of Project Panama is the FFM API (also called\
    \ the FF&M API), which allows a program written in Java to call routines or services\
    \ written in another program. With the scope of Project Panama, the FFM API allows\
    \ Java code to operate seamlessly with native libraries. This glue-less interface\
    \ to foreign code also supports direct calls to foreign functions and is integrated\
    \ with the JVM's method handling and linking mechanisms. Thus, it is designed\
    \ to supersede the JNI by offering a more robust, Java-centric development model,\
    \ and by facilitating seamless interactions between Java programs and code or\
    \ data outside the Java runtime.\n\nThe FFM API offers a comprehensive suite of\
    \ classes and interfaces that empower developers to interact with foreign code\
    \ and data. As of the writing of this book, it is part of the java.lang foreign\
    \ module in JDK 21 early-access builds. This interface provides tools that enable\
    \ client code in libraries and applications to perform the following functions:\n\
    \n+   **Memory allocation**: FFM allows Java applications to allocate memory space\
    \ outside of the Java heap. This space can be used to store data that will be\
    \ processed by foreign functions.\n\n+   **Structured memory access**: FFM provides\
    \ methods for reading and writing to the allocated foreign memory. This includes\
    \ support for structured memory access, so that Java applications can interact\
    \ with complex data structures in foreign memory."
