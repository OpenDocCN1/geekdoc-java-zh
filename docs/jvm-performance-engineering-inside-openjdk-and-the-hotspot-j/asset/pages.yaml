  md: '# Chapter 4


    # The Unified Java Virtual Machine Logging Interface


    The Java HotSpot Virtual Machine (VM) is a treasure trove of features and flexibility.
    Command-line options allow for enabling its experimental or diagnostic features
    and exploring VM and garbage collection activities. Within the HotSpot VM, there
    are distinct builds tailored for different purposes. The primary version is the
    product build, optimized for performance and used in production environments.
    In addition, there are debug builds, which include the fast-debug and the slow-debug
    variants.


    > NOTE The ased-fast-debug build offers additional debugging capabilities with
    minimal performance overhead, making it suitable for development environments
    where some level of diagnostics is needed without significantly compromising performance.
    On the other hand, the slow-debug build includes comprehensive debugging tools
    and checks, ideal for in-depth analysis with native debuggers but with significant
    performance trade-off.


    Until JDK 9, the logging interface of the HotSpot VM was fragmented, lacking unification.
    Developers had to combine various print options to retrieve detailed logging information
    with appropriate timestamps and context. This chapter guides you through the evolution
    of this feature, focusing on the unified logging system introduced in JDK 9, which
    was further enhanced in JDK 11 and JDK 17.


    # The Need for Unified Logging


    The Java HotSpot VM is rich in options, but its lack of a unified logging interface
    was a significant shortcoming. Various command-line options were necessary to
    retrieve specific logging details, which could have been clearer and more efficient.
    A brief overview of these options illustrates the complexity (many more options
    are available, aside from those listed here):


    +   - Garbage collection (GC) event timestamp: -XX:+PrintGCTimeStamps or -XX:+PrintGCDateamps

    - GC event details: -XX:+PrintGCDetails

    - GC event cause: -XX:+PrintGCCause'
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   - GC adaptiveness:-XX:+PrintAdaptiveSizePolicy


    +   - GC-specific options (e.g., for the Garbage [G1] GC):-XX:+G1HeapRegions


    +   - Compilation levels:-XX:+PrintCompilation


    +   - Inlining information:-XX:+PrintInlining


    +   - Assembly code:-XX:+PrintAssembly (requires -XX:+UnlockDiagnosticVMOptions)


    +   - Class histogram:-XX:+PrintClassHistogram


    +   - Information on java.util.concurrent locks:-XX:+PrintConcurrentLocks


    Memorizing each aspect and determining whether the information is at info, debug,
    or tracing level is challenging. Thus, JDK Enhancement Proposal (JEP) 158: Unified
    JVM Logging¹ was introduced in JDK 9. It was followed by JEP 271: Unified GC Logging²,
    which offered a comprehensive logging framework for GC activities.


    # Unification and HotSpot Infrastructure


    The Java JVM has a logging interface that provides a familiar look and approach
    to all logging for the JVM. All log messages are characterized using tags. This
    enables you to request the level of information necessary for your level of investigation,
    from "error" and "warning" tags to "info," "trace," and "debug" levels.


    To enable logging, you need to provide the -Xlog option. By default (i.e., when
    no -Xlog is specified), only warnings and errors are logged to stderr. So, the
    default configuration looks like this:


    ```

    -Xlog:all=warning:stderr:uptime,level,tags

    ```


    Here we see all, which is simply an alias for all tags.


    The unified logging system is an all-encompassing system that provides a consistent
    interface for all JVM logging. It is built around four main components:


    +   - Tags: Used to categorize log messages, with each message assigned one or
    more tags. Tags makes it easier to find find specific log messages. Some of the
    predefined tags include compiler, gc, and threads.


    +   - Levels: Define the severity or importance of a log message. Six levels are
    available: debug, error, info, off, trace, and warning.


    +   - Decorators: Provide additional context to a log message, such as timestamps,
    process IDs, and more.


    +   - Outputs: The destinations where the log messages are written, as stdout,
    stderr, or a file.


    > ¹https://openjdk.org/jeps/158


    > ²https://openjdk.org/jeps/271'
