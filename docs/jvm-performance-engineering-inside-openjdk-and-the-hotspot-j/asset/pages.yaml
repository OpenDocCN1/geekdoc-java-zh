    the *eden space of the young generation*. An allocating thread may encounter an
    allocation failure when this eden space is near its capacity, indicating that
    the GC must step in and reclaim space.


    During the first *young collection*, the eden space undergoes a scavenging process
    in which live objects are identified and subsequently moved into the *to survivor
    space*. The survivor'
