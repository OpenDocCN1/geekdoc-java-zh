  md: '# Chapter 1 The Performance Evolution of Java: The Language and the Virtual
    Machine


    The output of the -XX:+PrintCompilation option is a log of the HotSpot VM''s compilation
    tasks. Each line of the log represents a single compilation task and includes
    several pieces of information:


    +   - The timestamp in milliseconds the JVM started and this compilation task
    was logged.

    - The unique identifier for this compilation task.

    - Flags indicating certain properties of the method being compiled, such as whether
    it''s synchronized (s), whether it has an exception handler (!), whether it''s
    blocking (b), or whether it''s native (n).

    - The tiered compilation level, indicating the level of optimization applied to
    the method.

    - The fully qualified name of the method being compiled.

    - For O methods, the bytecode index where the compilation started. This is usually
    the start of a loop.

    - The size of the method in the bytes.


    Here are a few examples of the output of -XX:+PrintCompilation option:


    | 567 | 693 % | 3 | org.h2.cmd.dml:insertRows @ 76 (153 bytes) |

    | 656 | 797 | n | java.lang.Object::clone (native) |

    | 779 | 835 | s | java.lang.StringBuilder::append (13 bytes) |


    These logs provide valuable insights into the behavior of the HotSpot VM''s adaptive
    optimization, helping us understand how our Java applications are optimized at
    runtime.


    # Tiered Compilation


    Tiered compilation, which was introduced in Java 7, provides multiple levels of
    optimized compilations, ranging from T0 to T4:


    +   - T0: Interpreted code, devoid of compilation. This is where the code starts
    and moves on the T1, T2, or T3 level.

    - T1-T3: Client-compiled mode. T1 is the first step where the method invocation
    counters and loop-back counters are used. At T2, the client includes profiling
    information, referred to as profile-guided optimization; it may be familiar to
    readers who are conversant in static compiler optimizations. The T3 compilation,
    completely profiled code can be generated.

    - T4: The highest level of optimization provided by the HotSpot VM''s server compiler.


    Prior to tiered compilation, the server compiler would employ the interpreter
    to collect profiling information. With the introduction of tiered compilation,
    the code reaches client compilation levels faster, and now the profiling information
    is generated by client-compiled methods themselves, providing better start-up
    times.'
