  md: '# Chapter 6 Advanced Memory Management and Garbage Collection in OpenJDK


    +   2. Concurrent Mark/Remap: During this phase, ZGC traces the application''s
    live object graph and marks non-root objects. It employs a load barrier to assist
    in loading unmarked object pointers. Concurrent reference processing is also carried
    out, and thread-local handshakes are used.


    +   3. STW Remark (Pause Mark End): ZGC executes a quick pause to complete the
    marking of objects that were in-flight during the concurrent phase. The duration
    of this phase is tightly controlled to minimize pause times. As of JDK 16, the
    amount of work is capped at 200 microseconds. If marking work exceeds this time
    limit, ZGC will continue marking concurrently, and another “pause mark end” activity
    will be attempted until work is complete.


    +   4. Concurrent Prepare for Relocation: During this phase, ZGC identifies the
    regions that will be the collection/relocation set. It also processes weak roots
    and non-strong references and performs class unloading.


    +   5. STW Relocate (Pause Relocate Start): In this phase, ZGC finishes unloading
    any leftover metadata and methods. It prepares for relocation by setting up the
    necessary structures, including the use of a remap map. This mask is part of ZGC''s
    forwarding mechanism, ensures that any references to relocated objects are updated
    to their new locations. Application threads are briefly paused to capture roots
    into the collection/relocation set.


    +   6. Concurrent Relocate: ZGC concurrently performs the actual work of relocating
    objects from the “from” to the “to” space. This phase can employ a technique called
    self-healing, in which the application assists itself in the relocation process
    when it encounters an object that needs to be relocated. This approach reduces
    the amount of work that needs to be done during the STW phase, leading to shorter
    GC pause times and improved application performance.


