  md: '# Diving into Levels, Outputs, and Decorators


    Let''s take a closer look at the available log levels, examine the use of decorators,
    and discuss ways to redirect outputs.


    # Levels


    The JVM unified logging system provides various logging levels, each corresponding
    to a different amount of detail. To understand these levels, you can use the -Xlog:help
    command, which offers information on all available options:


    Available log levels:


    off, trace, debug, info, warning, error


    Here:


    +   - off: Critical logging.

    - error: Critical issues that might warrant attention.

    - warning: Potential issues within JVM operations.

    - info: General information about JVM operations.

    - debug: Detailed information useful for debugging. This level provides in-depth
    insights into the JVM''s behavior and is typically used when troubleshooting specific
    issues.

    - trace: The most verbose level, providing detailed logging. Trace is often used
    for the most granular insights in JVM operations, especially when a detailed step-by-step
    account of events is required.


    As shown in our previous examples, the default log level is set to info if no
    specific log level is given for a tag. When we run it, we observed very little
    for the monitoring when we used the default info log level. We can explicitly
    set the log level to access additional information, as shown here:


    ```

    $ java -Xlog:monitorinflation=trace LockLoops

    ```


    The output logs now contain detailed information about the various logs, as shown
    in the following example:


    ```

    [3.07s][trace][monitorinflation ] Checking in use_list:

    [3.07s][trace][monitorinflation ] count=3, max=3

    [3.07s][trace][monitorinflation ] in_use_count=3 equals ck_in_use_count=3

    [3.07s][trace][monitorinflation ] in_max=3 equals ck_in_use_max=3

    [3.07s][trace][monitorinflation ] No errors found in use_list checks.

    [3.07s][trace][monitorinflation ] In-use monitor info:

    [3.07s][trace][monitorinflation ] (B -> is_busy, H -> has code, L -> lock status)

    ```'
