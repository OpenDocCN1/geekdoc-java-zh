    # # Top-Down Methodology


    The top-down methodology is an overarching approach that begins with a comprehensive
    understanding of the system''s high-level objectives and works downwards, leveraging
    our in-depth understanding of the holistic stack. The method thrives when we have
    a wide spectrum of knowledge—from the high-level architecture and user interaction
    patterns to the finer details of hardware behavior and system configuration.


    The approach benefits from its focus on "known-knowns”—the familiar faces at play,
    including operational workflows, access patterns, application processes, and tunables.
    These "known-knowns" represent aspects or details about the system that we already
    understand. They might include the structure of the system, how its various components
    interact, and the general behavior of the system under normal conditions. The
    strength of the top-down methodology lies in its ability to reveal the "known-unknowns”—that
    is, aspects or details about the system that we do not exist, but do not understand
    well yet. They might include potential performance bottlenecks, unpredictable
    system behaviors under certain conditions, or the impact of specific system changes
    on performance.


    > NOTE The investigative process embedded in the top-down methodology aims to
    transform the "known-unknowns" into "known-unknowns," providing the knowledge
    necessary for continual system optimization. While our domain knowledge of the
    subsystems provides a foundational understanding, effectively identifying and
    addressing various bottlenecks requires more detailed and specific information
    that goes beyond this initial knowledge to help us achieve our performance and
    scalability goals.'
