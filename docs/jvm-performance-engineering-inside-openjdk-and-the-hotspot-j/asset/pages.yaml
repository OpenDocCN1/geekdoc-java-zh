    \ a fundamental shift from traditional class structures. They lack identity, they\
    \ differ from objects in the conventional sense. They are proposed to be immutable,\
    \ which would mean they cannot be synchronized or mutated post creation—attributes\
    \ that are critical to maintaining consistency. In the Java type system, to create\
    \ an immutable class, as in the MorningExample, you would typically declare the\
    \ class as final (extending primitive), make all fields final (disallowing direct\
    \ access), omit setter methods, make all fields final initialize all fields via\
    \ a constructor, and ensure exclusive access to mutable components.\n\nValue classes\
    \ envision a streamlined process and provide a more memory-efficient storage by\
    \ eliminating the need for an object header, enabling inline storage as primitive\
    \ types. This results in several key benefits:\n\n+   - Reduced memory footprint:\
    \ Inline storage significantly reduces the required memory footprint.\n\n+   -\
    \ Improved locality of reference: Inline storage ensures that all the fields of\
    \ a value class are located close to each other in memory. This locality of reference\
    \ can significantly enhance the performance of our programs by optimizing the\
    \ CPU cache usage.\n\n+   - Versatile field types: Value classes are predicted\
    \ to support fields of any type, including primitives, references, and nested\
    \ value classes. This flexibility to have user-defined primitive types allows\
