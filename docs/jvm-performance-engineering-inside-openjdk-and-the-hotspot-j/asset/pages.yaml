    In this code, we''ve defined a BookProgress class to track the progress of writing
    a book, which is divided into chapters. Each chapter has a total number of pages
    and a current count of pages written. The class provides methods to add chapters,
    update progress, and calculate the progress of each chapter and the overall book.


    The Main class creates a BookProgress object for a book titled "JVM Performance
    Engineering." It adds chapters, each with 100 pages, and simulates the book writing
    by updating the progress of each in a round-robin fashion, writing two pages at
    a time. After each update, it calculates and prints the progress of the current
    chapter, and once all pages are written, the overall progress of the book.


    The getProgress(String chapter) and updateProgress(String chapter, int pages))
    are identified as as-- methods methods. frequent invocation makes them them for
    optimization by the Hot the VM, illustrating how certain methods in a program
    may require more attention for performance optimization due to their high frequency
    of use.


    # Interpreter and JIT Compilation


    The HotSpot VM provides an interpreter that converts bytecode into native code
    based on the TemplateTable. Interpretation is the first step in adaptive optimization
    offered by this VM and is the slowest form of bytecode execution. To make the
    execution faster, the HotSpot VM utilizes adaptive JIT compilation. The JIT-optimized
    code replaces the template code for methods that are identified as performance
    critical.


    As mentioned in the previous section, the HotSpot VM monitors code for performance-critical
    methods based on two keys—method entry counts and loop-back branches. The VM assigns
    all calls to individuals in the Java application. When the entry count exceeds
    a prestablished value, the method is chosen for asynchronous JIT compilation.
    Similarly, there is a counter for each loop in the code. Once the HotSpot VM determines
    that the loop-back branches (also known as loop-back edges) have crossed the threshold,
    JIT optimizes that particular loop. This optimization is called on-stack-replacement
    (OSR). With OSR, only the loop for which the loop-back branch counter overflowed
    is compiled and executed asynchronously on the execution stack.


    # JIT Compilation


    A very handy command-line option that can help us better understand adaptive optimization
    in the HotSpot VM is -XX:+PrintCompilation. This option also returns information
    on different optimization levels, which are provided by an adaptive optimization
    called tiered compilation (discussed in the next subsection).'
