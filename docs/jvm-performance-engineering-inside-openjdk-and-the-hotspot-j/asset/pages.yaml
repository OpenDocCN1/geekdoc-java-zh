  md: "# Case Studies 331\n\n+   - Life-cycle management of foreign resources: FFM\
    \ includes mechanisms for tracking and managing the life cycle of foreign resources.\
    \ This ensures that memory is properly deallocated when it is no longer needed,\
    \ preventing memory leaks.\n\n+   - Foreign function invocation: FFM allows Java\
    \ applications to directly call functions in foreign libraries. This provides\
    \ a seamless interface between Java and other programming languages, enhancing\
    \ interoperability.\n\nThe FFM API also brings about several nonfunctional benefits\
    \ that can enhance the overall development experience:\n\n+   - Better performance:\
    \ By enabling direct invocation of foreign functions and access to memory, FFM\
    \ bypasses the overhead associated with JNI. This results in performance improvements,\
    \ especially for applications that rely heavily on interactions with native libraries.\n\
    \n+   - Security and safety measures: FFM provides a safer avenue for interacting\
    \ with foreign code and data. Unlike JNI, which can lead to unsafe operations\
    \ if misused, FFM is designed to ensure safe access to foreign memory. This reduces\
    \ the risk of memory-related errors and security vulnerabilities.\n\n+   - Better\
    \ reliability: FFM provides a more robust interface for interacting with foreign\
    \ code, increasing the reliability of Java applications. It mitigates the risk\
    \ of application crashes and runtime errors that occur when using JNI.\n\n+  \
    \ - Ease of development: FFM simplifies the process of interacting with foreign\
    \ code. It offers a pure-Java development model, which is more intuitive to use\
    \ and understand than JNI. This facilitates developers in writing, debugging,\
    \ and maintaining code that interacts with native libraries.\n\nTo illustrate\
    \ the use of the FFM API, let's consider another example from the field of adaptive\
    \ optics. We are working on a system for controlling the secondary mirror of a\
    \ telescope, and we want to call a native function to adjust the mirror. Here's\
    \ how we could do this using FFM:\n\n```\nimport java.lang.foreign.*;\nimport\
    \ java.util.logging.*;\n```\n\n```\npublic class MirrorController {\n    public\
    \ static void adjustMirror(float[] secondaryMirrorAdjustments) {\n        // Get\
    \ a lookup object from the Linker\n        var lookup = Linker.defaultLookup();\n\
    \        // Find the native function \"adjustMirror\"\n        var adjustMirrorSymbol\
    \ = lookup.find(\"adjustMirror\").get();\n        // Create a memory segment from\
    \ the array of adjustments\n        var adjustmentArray = MemorySegment.ofArray(secondaryMirrorAdjustments);\n\
    \        // Define the function descriptor for the native function\n        var\
    \ function = FunctionDescriptor.ofVoid(ValueLayout.ADDRESS);\n```"
