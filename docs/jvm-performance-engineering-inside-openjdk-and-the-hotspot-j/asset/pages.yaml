  md: '# The Role of Hardware in Performance 143


    Venturing further into the NUMA landscape, we encounter various critical traffic
    patterns, including cross-traffic, local traffic, and interleaved memory traffic
    patterns. These patterns significantly influence memory access latency, and consequently,
    data processing speed (Figure 5.10).


    Cross-traffic refers to instances where a processor accesses data in another processor''s
    bank. This cross-node movement introduces latency but is an inevitable reality
    of multiprocessing systems. A key consideration in such cases is efficient handling
    through intelligent memory allocation, facilitated by the NUMA-aware memory controller
    and observing paths with the least latency, without crowding the buffers.


    Local traffic, by contrast, occurs when a processor retrieves data from its local
    memory bank—a process faster than cross-traffic due to the elimination of the
    interconnect network''s demands. Optimizing a system to increase local traffic
    while minimizing cross-traffic latencies is a cornerstone of efficient NUMA systems.


    Interleaved memory adds another layer of complexity to NUMA systems. Here, successive
    memory addresses scatter across various memory banks. This scattering balances
    the load across nodes, reducing bottlenecks and enhancing performance. However,
    it can inadvertently increase cross-traffic—a possibility that requires careful
    management of the memory controllers.


    NUMA architecture addresses the scalability limitations inherent in shared memory
    models, wherein all processors share a single memory space. As the number of processors
    increases, the bandwidth to the shared memory becomes a bottleneck, limiting the
    scalability of the system. However, programming for NUMA systems can be challenging,
    as developers need to consider memory locality when designing algorithms and data
    structures. To assist developers modern operating systems, memory management systems,
    such as databases and GCs, are becoming increasingly NUMA-aware. This awareness
    is crucial for maximizing system performance and was a key in my work at AMD,
    Sun Microsystems, and Arm.


