    # Performance: A Key Quality Attribute


    Among the various architectural requirements, performance holds a distinctive
    position. It measures how effectively a system—referred to as the “system under
    test” (SUT)—executes a specific task or a “unit of work” (UoW). Performance is
    not merely a nice-to-have feature; its fundamental quality attribute. It influences
    both the efficiency of operations and the user experience, and it plays a pivotal
    role in determining user satisfaction.


    To fully comprehend the concept of performance, we must understand the various
    system components and their impacts on performance. In the context of a managed
    runtime system like the JVM, a key component that significantly affects performance
    is the garbage collector (GC). I define the unit of work for GC in performance
    parlance as “GC work,” referring to the specific tasks each GC must perform to
    meet its requirements. For example, a type of GC that I categorize as “throughput-maximizing,”
    exemplified by the Parallel GC in OpenJDK HotSpot, in contrast, “latency-optimizing”
    collector, as I define it, requires greater control over its tasks to guarantee
    sub-millisecond pauses. Hence, understanding the individual attributes and contributions
    of these components is critical, as they create a holistic picture of system performance.


    # Understanding and Evaluating Performance


    Performance evaluation isn’t a measure of how fast or slow a system operates.
    Instead, it involves the interactions between the SUT and the UoW. The UoW could
    be a single request, a batch of requests, or any task the system needs to perform.
    Performance depends on how effectively and efficiently the SUT can execute the
    UoW under various conditions. It factors such as the system’s resource utilization,
    throughput, and response time, as well as how these parameters change as the workload
    increases.


    Evaluating performance also requires engaging with the system’s users, including
    what makes them happy and what causes their dissatisfaction. Their insights can
    reveal hidden performance issues or suggest potential improvements. Performance
    isn’t just about speed—it’s about ensuring the system consistently meets user
    expectations.


    # Defining Quality of Service


    Quality of Service (QoS) is a broad term that represents the user’s perspective
    on the service’s performance and availability. In today’s dynamic software landscape,
    aligning QoS with service level agreements (SLAs) and incorporating modern site
    reliability engineering (SRE) concepts like service level objectives (SLOs) and
    service level indicators (SLIs) is crucial. These elements work together to ensure
    a shared understanding of what constitutes satisfactory performance.


    SLAs define the expected level of service, typically including metrics for system
    performance and availability. They serve as formal agreements between service
    providers and users'
