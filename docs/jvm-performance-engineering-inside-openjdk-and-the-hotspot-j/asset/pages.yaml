  md: '# Performance Metrics


    In the context of JVM performance engineering, the unified logging system provides
    valuable insights into various performance metrics. These metrics include GC activities,
    just-in-time (JIT) compilation events, and system resource usage, among others.
    By monitoring these metrics, developers can identify performance issues and preempt
    necessary actions to optimize the performance of their Java applications.


    # Tags in the Unified Logging System


    In the unified logging system, tags are for segregating and identifying different
    types of log messages. By enabling specific tags, users can tailor the logging
    output to focus on areas of interest.


    # Log Tags


    The unified logging system provides a myriad of tags to capture granular information.
    Tags such as for garbage collection, for thread operations, class loading, for
    CPU-related events, for operating interactions, and more are highlighted here:


    ```

