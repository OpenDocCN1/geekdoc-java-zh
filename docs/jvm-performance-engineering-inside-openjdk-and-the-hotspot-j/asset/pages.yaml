    process itself requires computational resources, and its impact should be assessed
    in the context of the specific application requirements and performance characteristics.


    # Reducing Strings’ Footprint


    Java has always been at the forefront of runtime optimization, and with the growing
    need for efficient memory management, Java community have introduced several enhancements
    to reduce the memory footprint of strings. This optimization was delivered in
    two significant parts: (1) the in-fication of string concatenation and (2) the
    introduction of compact strings by changing backing array from [] to byte[].


    # In-fication of String Concatenation


    In-fication involves the use of the invokedynamic feature for JSR 292,⁵ which
    introduced support for dynamic languages into JVM as part of Java SE 7. JSR 292
    changed the JVM specification by adding a new instruction, invokedynamic, that
    supports dynamic typed by deferring the translation to the runtime engine.


    > ⁶Chapter 4, The Unified Java Virtual Machine Logging Interface, provides an
    in-depth explanation of the unified logging tags and levels.

    ⁷://jcp.org/en/jsr/detail?id=292'
