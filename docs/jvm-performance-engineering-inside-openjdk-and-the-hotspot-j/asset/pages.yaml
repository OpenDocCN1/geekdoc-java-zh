  md: '# Optimizing Memory Access with NUMA-Aware Garbage Collection


    For Generational GCs in HotSpot, it is crucial to ensure proper sizing of the
    generations and allow for appropriate aging of the objects based on the application''s
    allocation rate. This approach ensures that mostly (and possibly only) long-lived-static
    and transient objects are tenured ("promoted”). Occasionally, spikes in the allocation
    rate may unnecessarily increase the promotion rate, which could trigger an old-generation
    collection. A properly tuned GC has enough headroom that such spikes can be easily
    accommodated without triggering a stop-the-world (STW) GC event, which is a fail-safe
    or fallback collection for some of the newer GCs.


    To tune PLABs, you can use the following options, although these are less frequently
    used because PLABs are mostly self-tuned by the JVM:


    +   - XX:GCTimeRatio=<value>: Adjusts the ratio of GC time to allocation time.
    Lower values result in larger PLABs, potentially reducing GC time at the cost
    of increased heap usage.

    - ResizePLAB: Enables or disables the adaptive resizing of PLABs. By default,
    it is enabled.

    - XX:PLABWeight=<value>: Sets the percentage of the current PLAB size added to
    the average PLAB size when computing the new PLAB size. The default value is 75.


    PLABs can help improve GC by reducing contention and providing a faster promotion
