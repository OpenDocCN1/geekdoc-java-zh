  md: '# Chapter 3 From Monolithic to Modular Java: A Retrospective and Ongoing Evolution


    # Jlink


    jlink is a tool that helps link modules and their transitive dependencies to create
    custom modular runtime images. These custom images can be packaged and deployed
    without needing the entire Java Runtime Environment (JRE), which makes your application
    lighter and faster to start.


    To use the jlink command, this tool needs to be added to your path. First, ensure
    that the JAVA_HOME/bin is in the path. Next, type jlink on the command line:


    ```

    $ jlink

    Error: --module-path must be specified

    Usage: jlink <options> --module-path <modulepath> --add-modules <module>{<module>,...}

    Use --help for a list of possible options

    ```


    Here is how you can use jlink for the code in "Implementing Modular Services with
    JDK 17":


    ```

    $ jlink --module-path $JAVA_HOME/jmods/modules --add-modules com.example.com.builder
    --output consumer.services --bind-services

    ```


    A few notes on this example:


    +   - The command includes a directory called $JAVA_HOME/jmods in the module-path.
    This directory contains the java.base.jmod for all applications modules.

    - Because the module is a consumer of services, it''s necessary to link the service
    providers (and their dependencies). The --bind-services option is used.

    - The runtime image will be available in the consumer.services directory as shown
    here:


    ```

    $ ls consumer.services/

    bin conf include lib release

    ```


    Let''s now run the image:


    ```

    $ consumer.services/bin/java -m com.example.com.example.builder.Builder

    Building a house with bricks...

    ```


    With jlink, you can create lightweight, custom, stand-alone runtime images tailored
    to your modular Java applications, simplifying the deployment and reducing the
    size of your distributed application.


