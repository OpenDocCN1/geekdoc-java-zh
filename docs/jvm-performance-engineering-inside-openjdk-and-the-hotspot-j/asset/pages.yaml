  md: "# HotSpotGarbage Collector: Memory Management Unit\n\nspace as a transitional\
    \ area where surviving objects are copied, aged, and moved back and forth between\
    \ the from and to spaces until they cross a tenuring threshold. Once an object\
    \ crosses this threshold, it is promoted to the old generation. The underlying\
    \ objective is to promote only those objects that have proven their longevity,\
    \ creating a “Teenage Wasteland,” as Charlie Hunt’s would explain. \n\nThe generational\
    \ garbage collection is based on two main characteristics related to the weak-generational\
    \ hypothesis:\n\n+   1. Most objects young: This means that most objects are only\
    \ long-lived objects. If generational GC is efficient, we don't promote transients,\
    \ nor do we promote medium-lived objects. This usually results in smaller long-lived\
    \ data sets, keeping promotions, fragmentation, evacuation failures, and similar\
    \ degenerative issues at bay.\n2. Maintenance of generations: The generational\
    \ algorithm has proven to be a great help to OpenJDK GCs, but it comes with a\
    \ cost. The young-generation collector works separately and more often than the\
    \ old-generation collector, it ends moving up live data. Therefore, generational\
    \ GCs incur maintenance/bookkeeping overhead to ensure that they mark reachable\
    \ objects—a feat achieved through the use of “write barriers” that track cross-generational\
    \ references.\n\nFigure 1.1 depicts the key concepts of generational GCs, providing\
    \ a visual reinforcement of the information described. The word cloud contains\
    \ the following phrases:\n\n+   * Objects die young: Highlighting the idea that\
    \ most objects are short-lived and only long-lived objects are promoted.\n* Small\
    \ long-lived data sets: Emphasizing the efficiency of the generational GC in not\
    \ promoting transients or medium-lived objects, resulting in smaller long-lived\
    \ data sets.\n* Maintenance barriers: Highlighting the overhead and bookkeeping\
    \ required by generational GCs to mark all reachable objects, achieved through\
