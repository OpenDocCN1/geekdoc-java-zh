    deduplication objects. These candidates are instances of String that have identical
    char[] and have been evacuated from the eden regions into the survivor regions
    or promoted into the old-generation regions. Dedup entails reassigning the value
    field of one String instance to another, thereby threshold. avoiding the need
    for a duplicate backing array.


    It''s crucial to note that most of the work happens in a VM internal thread called
    the "dedplication thread". This thread runs concurrently with your application
    threads, processing the dedup queues by computing hash codes and deduplicating
    strings as needed.


    Figure 7.5 captures the essence when if String1 equals String2 character-by-character,
    and both are managed by the G1 GC, the duplicate arrays can be replaced with a
    single shared array.


    The G1 GC''s string dedup feature is not enabled by default and can be controlled
    through JVM command-line options. -XX:+UseStringDeduplication option. Also, you
    can customize the age threshold for a String object''s eligibility for dedup using
    the -XX:StringDeduplicationAgeThreshold=<age> option.


    ![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_251_0.png)


    Figure 7.5 String Deduplication Optimization in Java'
