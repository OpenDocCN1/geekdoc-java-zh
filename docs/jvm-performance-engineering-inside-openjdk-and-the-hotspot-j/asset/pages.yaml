    # Emerging Technologies: CRIU and Project CRac Checkpoint/Restore Functionality


    OpenJDK continues to innovate via projects such as CRIU and Crac. Together they
    contribute to reducing the time to steady-state, expanding the realm of high-performance
    Java applications.


    CRIU (Checkpoint/Restore in Userspace) is a pioneering Linux tool; it was initially
    crafted by Virtuoso and subsequently made available as an open-source program.
    CRIU''s designed to support the live migration feature of OpenVZ, a server virtualization
    solution.10 The brilliance of CRIU lies in its ability to momentarily freeze an
    active application, creating a checkpoint stored as files on a hard drive. This
    checkpoint can later be utilized to resurrect and execute the application from
    its frozen state, eliminating the need for any alterations or specific configurations.


    The following command sequence creates a checkpoint of the process with the specified
    PID and stores it in the specified directory. The process can then be restored
    from this checkpoint.


    ```

    # Install CRIU

    $ apt-get install criu

    ```


    ```

    # Check a running process

    $ criu dump -t [PID] -D /checkpoint/directory-v4 -o dump.log

    ```


    ```

    # Restore a checkpointed process

    $ criu restore -D /checkpoint/directory-v4 -o restore.log

    ```


    Recognizing the potential of CRIU, Red Hat introduced it as a stand-alone project
    in OpenJDK. The aim was to provide a way to freeze the state of a Java application,
    store it, and then restore it later on a different system. This capability could
    be used to migrate running applications between systems, restore complex applications''
    state for debugging purposes, and create snapshots of applications for later analysis.


