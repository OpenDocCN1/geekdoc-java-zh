- pgno: 193
  md: '# The Importance of Performance Benchmarking


    This is where benchmarking harness comes into the picture. A benchmarking harness
    provides a standardized framework that not only helps to circumvent common benchmarking
    pitfalls, but also streamlines the build, run, and timing processes for benchmarks,
    thereby ensuring that we obtain precise and insightful performance evaluations.
    Recognizing this need, the Java community—most notably, Oracle engineers—has provided
    its open-source benchmarking harness, encompassing a suite of micro-benchmarks,
    as referred to in JDK Enhancement Proposal (JEP) 230: *Microbenchmark Suite*.^14
    Next, we will examine the nuances of this benchmarking harness and explore its
    importance in achieving reliable performance measurements.


    # The Role of the Java Micro-Benchmark Suite in Performance Optimization


    Performance optimization plays a critical role in the release cycle, especially
    the introduction of features intended to boost performance. For instance, JEP
    143: *Improve Concurrent Locking*^15 employed 22 benchmarks to gauge performance
    improvements related to object monitors. A core component of performance testing
    is regression analysis, which compares benchmark results between different releases
    to identify nontrivial performance regressions.


    The Java Microbenchmark Harness (JMH) brings stability to the rigorous benchmarking
    process that accompanies each JDK release. JMH, which was added to the JDK 12,
    provides scripts and benchmarks that compile and run for both current and previous
    releases, making regression studies easier.


    # Key Features of JMH for Performance Optimization


    +   - Benchmark modes: JMH supports various benchmarking modes, such as Average
    Time, Sample Time, Single Shot Time, Throughput, and All. Each of these modes
    provides a different perspective on the performance characteristics of the benchmark.


    +   - **ithreaded benchmarks**: JMH supports both single-threaded and multithreaded
    benchmarks, allowing performance testing under various levels of concurrency.


    +   - **Compiler control**: JMH offers mechanisms to ensure the JIT compiler doesn''t
    interfere with the benchmarking process by over-optimizing or eliminating the
    benchmarking code.


    +   - **Profilers**: JMH comes with a simple interface plus several default profilers,
    including the GC profiler, Compiler profiler, and Classloader profiler. These
    profilers provide more in-depth information about how the benchmark is running
    and where potential bottlenecks lie.


    JMH is run as a stand-alone project, with dependencies on user benchmark JAR files.
    For readers who are unfamiliar with Maven templates, we''ll begin with an overview
    of Maven and the information required to set up the benchmarking project.


    ^14 https://openjdk.org/jeps/230


    ^15 https://openjdk.org/jeps/143'
