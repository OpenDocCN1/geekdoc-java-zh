  md: '# Chapter 7 Runtime Performance Optimizations: A Focus on Strings, Locks, and
    Beyond


    Project Loom,¹17 introduced in JDK 21,¹18 aims to rethink concurrency in Java.
    It introduces virtual threads, which are lightweight, efficient threads managed
    by the JVM that allow Java to achieve better scalability without resorting to
    the asynchronous or reactive approach.


    # Virtual Threads in Project Loom


    Virtual threads, also known as lightweight threads, are a new kind of Java thread.
    Unlike traditional threads, which are managed by the OS, virtual threads are managed
    by the JVM. This allows Java to create and switch between virtual threads much
    more efficiently than the OS with traditional threads. Virtual threads design
    have a low memory footprint and fast start-up time, making them ideal for tasks
    that demand intense.


    Let''s build on the previous diagrams to further our understanding and establish
    a visual representation. Figure 3.37 is a high-level overview of the new model
    introduced by Project Loom. In this model, a large number of Java virtual threads
    (jvt0, jvt1, jvtn) can be created within a single JVM process. These virtual threads
    are not directly mapped to OS threads. Instead, they are managed by the JVM, which
    can schedule them onto a smaller number of OS threads as needed.


    Figure 3.37 also introduces the concept of carrier threads. Each virtual thread
    is scheduled onto a carrier thread, which is a traditional Java thread mapped
    one-to-one to an OS thread. The JVM can switch a carrier thread between multiple
    virtual threads, allowing it to manage multiple virtual threads concurrently.
    This model also highlights the work-stealing algorithm, in which carrier threads
    can steal tasks from the queues of busy carrier threads, leading to better utilization
    of system resources.


    ![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_294_0.png)


    Figure 3.37 Java Virtual Threads


    # Virtual Threads and Their Carriers


    A virtual thread''s life cycle may involve scheduled onto different carrier threads.
    Despite this, the virtual thread remains oblivious to the specific carrier thread
    it''s scheduled on any given moment.


