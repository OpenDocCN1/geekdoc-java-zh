    # Why Do We Need a Benchmark Harness?


    Throughout this chapter, we have emphasized the symbiotic relationship between
    hardware and software, and how their interplay influences their performance. When
    benchmarking our software to identify bottlenecks, we must acknowledge this dynamic
    synergy. Benchmarking should be viewed as an exploration of the entire system,
    factoring in the innate optimizations across different levels of the Java application
    stack.


    Recall our previous discussions of the JVM, garbage collection, and concepts as
    JIT compilation, tiered compilation threads, and code cache sizes. All of these
    elements play part in defining the performance landscape of software. For instance,
    as highlighted in the hardware-software interaction section, the processor cache
    hierarchies and processor memory model can significantly influence performance.
    Thus, a benchmark designed to gauge performance across different cloud architectures
    (for example) should be sensitive to these factors across the stack, ensuring
    that we are not merely measuring and operating in silos, but rather taking full
    advantage of the holistic system and its built-in optimizations.'
