  md: '# Chapter 3 From Monolithic to Modular Java: A Retrospective and Ongoing Evolution


    +   - Service abstraction: Both Java layers (with the ServiceLoader and OSGi provide
    abstractions that enable loose coupling between components. This allows for greater
    flexibility when switching between different implementations of a service.


    # Differences


    +   - Maturity: OSGi is a more mature and battle-tested technology, with a rich
    ecosystem and tooling support. Java module layers, which were introduced in JDK
    9, are comparatively newer and never have the same level of tooling and library
    support as OSGi.


    +   - Integration with Java platform: Java module layers are part of the Java
    platform, providing a native solution for modularity and extensibility. OSGi,
    by contrast, is a separate framework built on top of the Java platform.


    +   - Complexity: OSGi can be more complex than Java module layers, with a steeper
    learning curve and more advanced features. Java module layers, while still providing
    powerful functionality, may be more straightforward and easier to use for developers
    who need no modularity concepts.


    +   - Runtime environment: OSGi applications run inside an OSGi container, which
    manages the life cycle of the bundles and enforces modularity rules. Java module
    layers run directly on the Java platform, with the module system handling the
    loading and unloading of modules.


    +   - Versioning: OSGi provides built-in support for multiple versions of a module
    or bundle, concurrently. This is achieved by qualifying modules with versions
    and applying "constraints" to ensure safe class namespaces for each module. However,
    dealing with versions in OSGi can introduce unnecessary complexity for module
    resolution and for end users. In contrast, Java module layers do not natively
    support multiple versions of a module, but by creating separate module layers
    for each version.


    +   - Strong encapsulation: Java module layers, as first-class citizens in the
    JDK, provide strong encapsulation by issuing error messages when unauthorized
    access to non-exported functionality occurs, via reflection. In OSGi, non-exported
    functionality can be "hidden" using class loaders, but the module internals are
    still available for reflection unless a special mechanism is set. OSGi was limited
    by pre-JPMS features of Java SE and could not provide the same level of strong
    encapsulation as Java module layers.


    When it comes to achieving modularity and extensibility in Java applications,
    developers typically have two main options: Java module layers and OSGi. Remember,
    the choice between Java module layers and OSGi is not always binary and can depend
    on many factors. These include the specific requirements of your project, the
    existing technology stack, and your team''s familiarity with the technologies.
    It''s also noting that Java module layers and OSGi are not the only options for
    achieving modularity in Java applications. Depending on your needs and context,
    other solutions might be more appropriate. It is crucial to thoroughly evaluate
    the pros and cons of all available options before making a decision for your project.
    Your choice should be based on the specific demands and restrictions of your project
    to ensure optimal outcomes.'
