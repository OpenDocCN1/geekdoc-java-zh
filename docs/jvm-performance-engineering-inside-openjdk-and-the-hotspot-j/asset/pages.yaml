    Node 3 or Node 2''s memory, then it''s just one away. A local memory access needs
    no hops. An architecture like depicted in Figure 6.1 is called NUMA.


    If we were to divide the eden space of Java so that we have areas for each node
    and also threads running on a particular node out of those non-allocated areas,
    then we would be able to hop-free access to node-local memory (provided the scheduler
    doesnt move the thread to a different node). This is the principle behind the
    NUMA-aware allocation—basically, the TLABs are allocated from the closest memory
    areas, which allows for faster allocations.


    In the initial stages of an object''s life cycle, it resides in the eden space
    allocated specifically from its NUMA node. Once few of the objects have survived
    or the objects need to be promoted to the old generation, they might be shared
    between threads across different nodes. At this point, allocation occurs in node-interleaved
    manner, meaning memory chunks are sequentially and evenly distributed across nodes,
    from Node 0 to the highest-numbered node, until all of the memory space has been
    allocated.


    Figure 6.2 illustrates a NUMA-aware eden. Thread 0 and Thread 1 allocate out of
    the eden area for Node 0 because they are running on Node 0. Meanwhile, Thread
    2 allocates out of the eden area for Node 1 because it''s running on Node 1.


    To enable NUMA-aware GC in JDK 8 and later, use the following command-line option:


    ```

    -XX:+UseNUMA

    ```


    This option enables NUMA-aware memory allocations, allowing the JVM to optimize
    memory access for NUMA architectures.


    To check if your JVM is running with NUMA-aware GC, you can use the following
    command-line option:


    ```

    -XX:+PrintFlagsFinal

    ```'
