    particular, the JVM has had to adapt and optimize its execution strategies to
    efficiently handle these new language features. As you read this book, bear in
    mind the historical context and the driving forces that led to Java''s inception.
    The evolution of Java and its virtual machine have profoundly influenced the developers
    write and optimize software for various platforms.


    In this chapter, we will thoroughly examine the history of Java and JVM, highlighting
    the technological advancements and key milestones that have significantly shaped
    its development. From its early days as a solution for platform independence,
    through the introduction of new language features, to the ongoing improvements
    to the JVM, Java has evolved into a powerful and versatile tool in the arsenal
    of modern software development.


    # A New Ecosystem Is Born


    In the 1990s, the internet was emerging, and web pages became more interactive
    with the introduction of Java applets. Java applets were small applications that
    ran within web browsers, providing a "real-time" experience for end users.


    Applets were not only platform independent but also "secure," in the sense that
    the user needed to trust the applet writer. When discussing security in the context
    of the JVM, it''s essential to understand that direct access to memory should
    be forbidden. As a result, Java introduced its own memory management system, called
    the garbage collector (GC).


    > NOTE In this book, the acronym GC is used to refer to both garbage collection,
    the process of automatic memory management, and garbage collector, the module
    within the JVM performs this process. The specific meaning will be clear based
    on the context in which GC is used.


    Additionally, an abstraction layer, known as Java bytecode, was added to any executable.
    Java applets quickly gained popularity because their bytecode, residing on the
    web server, could be transferred and executed as its own process during web page
    rendering. Although the Java bytecode is platform independent, it is interpreted
    and compiled into native code specific to the underlying platform.


    # A Few Pages from History


    The JDK included tools such as a Java compiler that translated Java code into
    bytecode. Java bytecode is the executable handled by the Java Runtime Environment
    (JRE). Thus, for different environments, only the runtime needed to be updated.
    As a JVM for a specific environment, the bytecode could be executed. The JVM and
    the GC served as the execution engines. For Java versions 1.0 and 1.1, the bytecode
    was interpreted to the native machine code, and there was no dynamic compilation.


    Soon after the release of Java versions 1.0 and 1.1, it became apparent that Java
    needed to be more performant. Consequently, a just-in-time (JIT) compiler was
    introduced in Java 1.2. When'
