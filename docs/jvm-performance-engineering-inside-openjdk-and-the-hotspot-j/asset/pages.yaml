    # Understanding Spin-Loop Hints and PAUSE Instructions


    In a multiprocessor (MP) system, such as x86-64 architectures, when a field or
    variable is locked and a thread secures the lock, other threads vying for the
    same enter a wait loop (also called busy-wait loop, spin-wait loop, or spin-loop).
    These threads are said to be actively powering. Active polling has its merit:
    A thread can instantly access a lock once it is available. However, the flip side
    is that such looping consumes a significant amount of power while the thread is
    merely waiting to perform its task. Moreover, MP systems have a processing pipeline
    that speculates about loop execution based on always-taken or never-taken branches
    and simplifying the loop based on speculation. When the looping thread gets to
    the lock, the pipeline needs to be cleared (a process known as pipeline flushing)
    because the speculations made by the processor are no longer valid. This can impose
    a performance penalty on MP systems.


    To address this issue, Streaming SIMD Extensions (SSE2)¹¹⁵ https://www.intel.com/content/www/us/en/support/articles/000005779/processors.html
    on the x86-64 architecture introduced the PAUSE instruction. This instruction
    hints at a spin-loop, allowing the addition of a predetermined delay to the loop.
    Java 9 embraced this development in java.lang.Thread, allowing the Java runtime
    to intrinsically invoke the PAUSE instruction on supporting CPUs.


    > ¹⁵ https://www.intel.com/content/www/us/en/support/articles/000005779/processors.html'
