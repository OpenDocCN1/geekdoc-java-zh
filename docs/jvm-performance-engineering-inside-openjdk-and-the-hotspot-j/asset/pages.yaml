  md: '# Chapter 1 The Performance Evolution of Java: The Language and the Virtual
    Machine


    The JDK GCs employ several different GC algorithms:


    +   - **Stop-the-world (STW) algorithms:** STW algorithms pause application threads
    for the entire duration of the garbage collection work. Serial, Parallel, (Mostly)
    Concurrent Mark and Sweep (CMS), and Garbage First (G1) GCs use STW algorithms
    in specific phases of their collection cycles. The STW approach can result in
    longer pauses when the heap fills up and runs out of allocation space, especially
    in nongenerational heaps, which treat the heap as a single continuous space without
    segregating it into generations.

    - **Concurrent algorithms:** These aim to minimize pauses by performing most of
    their work concurrently with the application threads. CMS is an example of a collector
    using concurrency. However, CMS does not perform compaction, fragmentation can
    become an issue over time. This can lead to longer pauses or even cause a fallback
    to a full GC using the Serial collector, which includes compaction.

    - **Incremental compaction:** The G1 GC introduced incremental compaction to deal
    with the fragmentation issue in CMS. G1 divides the heap into smaller regions
    and performs garbage collection on a subset of regions during a cycle. This approach
    helps maintain more predictable times while also handling compaction.

    - **Thread-local handshakes:** New GCs like Shenandoah and ZGC leverage thread-local
    handshakes to minimize STW pauses. By employing this mechanism, they can perform
    certain GC operations on a per-thread basis, allowing application threads to continue
    while the GC works. This approach helps to reduce the overall impact of garbage
    collection on application performance.

    - **Ultra-low-pause-time collectors:** The Shenandoah and the ZGC aim to have
    ultra-low-pause times by performing concurrent marking, relocation, and compaction.
    Both minimize the STW pauses to a small fraction of the overall garbage collection
    work, offering consistent latency for applications. While these GCs are not generational
    in the traditional sense, they divide the heap into regions and collect different
    regions at times. This approach builds upon the principles of incremental and
    "garbage first" collection. As of this writing, efforts are ongoing to further
    develop these new collectors into generational ones, but they are included in
    this section due to their innovative strategies that enhance the principles of
    generational garbage collection.


    Each collector has its advantages and trade-offs, allowing developers to choose
    the one that best suits their application requirements.


