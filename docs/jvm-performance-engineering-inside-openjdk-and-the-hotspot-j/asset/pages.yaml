    # Decorators


    Decorators are another critical aspect of JVM logging. Decorators enrich log messages
    with additional context, making them more informative. Specifying -Xlog:help on
    the command line will yield the following decorators:


    Available log decorators:

    time (t), utctime (utc), uptime (u), timemillis (tm), upemillis (um), timanos
    (tn),

    uptimenanos (un), hostname (hn), pid (p), tid (ti), level (l), tags (tg)

    Decorators can be specified as ''none'' for no decoration.


    These decorators provide specific information in the logs. By default, uptime,
    level, and tags are selected, which is why we saw these three decorators in the
    log output in our earlier examples. However, you might sometimes want to use different
    decorators, as such


    +   - pid (p): Process ID. Useful in distinguishing logs from different JVM instances.'
