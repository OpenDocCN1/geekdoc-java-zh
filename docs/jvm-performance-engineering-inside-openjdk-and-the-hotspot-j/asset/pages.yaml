  md: '# Chapter 6


    # Advanced Memory Management and Garbage Collection in OpenJDK


    # Introduction


    In this chapter, we will dive into the world of JVM performance engineering, examining
    advanced memory management and garbage collection techniques in the OpenJDK Hotspot
    VM. Our focus will be on the evolution of optimizations and algorithms from JDK
    11 to JDK 17.


    Automatic memory management in modern OpenJDK is a crucial aspect of the JVM.
    It empowers developers to leverage optimized algorithms that provide efficient
    allocation paths and adapt to the applications'' demands. Operating within a managed
    runtime environment minimizes the chances of memory leaks, dangling pointers,
    and other memory-related bugs that can be challenging to identify and resolve.


    My journey with GCs started during my tenure at Advanced Micro Devices (AMD) and
    then gained wings at Sun Microsystems and Oracle, where I was deeply involved
    in the evolution of garbage collection technologies. These experiences provided
    me with a unique perspective on the development and optimization of garbage collectors,
    which I''ll share with you in this chapter.


    Among the many enhancements to the JVM, JDK 11 introduced significant improvements
    to garbage collection, such as aforementioned collections, which improved GC responsiveness,
    and the Z Garbage Collector, which aimed to achieve sub-millisecond pauses.


    This chapter explores these developments, including optimizations like Thread-Local
    Allocation Buffers and Non-Uniform Memory Architecture-aware GC. We will also
    delve into various transactional workloads, examining their interplay with in-memory
    databases and their impact on the Java heap.'
