    [0057s][info][gc,metaspace] Narrow class base: 0x000000013100000, Narrow class
    shift: 0, Narrow

    klass range: 0x100000000

    ```


    Similarly, you might be interested in the thread tag if your application has heavy
    multi-threading. Running your application with the -Xlog:thread* option will produce
    log messages related to thread operations:


    ```

    $ java -Xlog:thread*

    [0109s][info][os, thread] Thread attached (tid: 7427, pthread id: 123145528827904).

    [0038s][info][os, thread] Thread "GC Thread#0" started (pthread id: 123145529888768,
    attributes:

    stacksize: 1024k, turnout: 4k, detached).

