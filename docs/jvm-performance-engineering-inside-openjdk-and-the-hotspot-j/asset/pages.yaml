    # ZGC Core Concepts: Off-Heap Forwarding Tables


    ZGC introduces off-heap forwarding tables—that is, data structures that store
    the new locations of relocated objects. By allocating these tables offheap, ZGC
    ensures that the memory used by the forwarding tables does not impact the available
    heap space for the application. This allows for the immediate return of both virtual
    and physical memory, leading to more efficient memory usage. Furthermore, off-heap
    forwarding tables enable ZGC to handle larger heap sizes, as the size of the forwarding
    tables is not constrained by the size of the heap.


    Figure 6.14 is a diagrammatic representation of the off-heap forwarding tables.
    In this figure,


    +   * Live objects reside in heap memory.

    * These live objects are relocated, and their new locations are recorded in forwarding
    tables.

    * The forwarding tables are allocated in off-heap memory.

    * The relocated objects, now in their new locations, can be accessed by application
    threads.


