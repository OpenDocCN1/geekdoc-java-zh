  img_proc: true
- pgno: 112
  md: "# Chapter 3 From Monolithic to Modular Java: A Retrospective and Ongoing Evolution\n\
    \nHowever, this compatibility does not extend to the source level, and the JPMS\n\
    \ not introduce versioning at this level, either. Instead, versioning is managed\
    \ at the\nlevel, using artifact management systems like Maven or Gradle. These\
    \ systems handle version-\ning and dependency management for the libraries and\
    \ frameworks used in Java, ens-\\uring the correct versions of the dependencies\
    \ are included in the build process. But what\nhapp when a Java application depends\
    \ on multiple third-party libraries, which in turn may\ndepend on different versions\
    \ of any library? This can lead to conflicts and runtime errors if\nmultiple versions\
    \ of the same library are present on the classpath.\n\nSo, although JPMS has certainly\
    \ improved modularity and code organization in Java, the \"JAR\nell problem can\
    \ still be relevant when dealing with versioning at the artifact level. Let's\
    \ look\nat an example (shown in Figure 3.5) when a Java application depends on\
    \ two third-party libraries\n(Foo and Baz), which in turn depend on different\
    \ versions of another library (Baz).\n\nIf both versions of the Baz library are\
    \ placed on the classpath, it becomes unclear which\nof the library will be used\
    \ at runtime, resulting in unavoidable version conflicts. To address\nthis issue,\
    \ JPMS prohibits such situations by detecting split packages, which are not allowed\
    \ in\nJPMS, in support of its \"reliable configuration\" goal (Figure 3.6).\n\n\
    While detecting versioning problems early is useful, JPMS does not provide a recommended\n\
    \ to resolve them. One approach to address these problems is to use the latest\
    \ version of the\nlicting library, assuming it is backward compatible. However,\
    \ this might not always be\npossible due to introduced incompatibilities.\n\n\
    To address cases, JPMS offers the ModuleLayer feature, which allows for the installation\n\
    a module sub-graph into the module system in an ordered manner. When different\
    \ ver-\ns of the conflicting library are placed into separate layers, both of\
    \ those versions can be\nloaded by JPMS. Although there is no direct way to access\
    \ a module of the child layer from\nthe parent layer, this can be achieved indirectly—by\
    \ implementing a service provider in the\nchild layer module, which the parent\
    \ layer module can then use. (See the earlier discussion of\n\"Implementing Modular\
    \ Services with JDK 17\" for more details).\n\n![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_112_0.png)"
