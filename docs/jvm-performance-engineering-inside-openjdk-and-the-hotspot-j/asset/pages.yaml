    # Experimental Design


    Experimental design is a systematic approach used to test hypotheses about performance.
    It emphasizes data collection and promotes evidence-based decision making. This
    method is employed in both top-down and bottom-up methodologies to establish baseline
    and peak performance measurements and to precisely evaluate the impact of incremental
    or specific enhancements. The baseline performance represents the system''s capabilities
    under normal or expected loads, whereas the peak or stress performance highlights
    its resilience under extreme loads. Experimental design aids in distinguishing
    variables, assessing performance impacts, and gathering crucial monitoring and
    profiling data.


    Inherent to experimental design are the control and treatment conditions. The
    control condition represents the baseline scenario, often corresponding to the
    system''s performance under a typical load, such as with the current software
    version. In contrast, the treatment condition introduces experimental variables,
    such as a different software version or load, to observe their impact. The comparison
    between the control and the treatment conditions helps gauge the impact of the
    experimental variables on system performance.


    One specific type of experimental design is A/B testing, in which two versions
    of a product are compared to determine which performs better in terms of a specific
    metric. All A/B tests are a form of experimental design, not all experimental
    designs are A/B tests. The broader field of experimental design can involve multiple
    conditions and is used across various domains, from marketing to medicine.


    A crucial aspect of setting these conditions involves understanding and controlling
    the state of the system. For instance, when measuring the impact of a new JVM
    feature, it''s essential to ensure that the JVM''s state is consistent across
    all trials. This could include the state of the GC, the JVM-managed threads, the
    interaction with the OS, and more. This consistency ensures reliable results and
    accurate interpretations.


