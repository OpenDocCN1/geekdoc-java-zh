  md: '# Metrics for Measuring Java Performance 127


    By comparing the two timelines (uninterrupted and interrupted) side by side, as
    shown in Figure 5.3, we can quantify the impact of these STW events. Let''s focus
    on two key metrics: the total work done in both scenarios within the same period
    and the throughput.


    +   1. Work done:

    * In the uninterrupted scenario, the total work done is $A_{cw}$.

    * In the interrupted scenario, the total work done is the sum of $A_{cw0}$ and
    $A_{cw1}$.

    2. Throughput ($W_{dd}$):

    * In the uninterrupted timeline, the throughput ($W_{dd}$) is calculated as the
    total work done ($A_{cw}$) divided by the duration from stimulus arrival to response
    dispatch ($T_1 - T_0$).

    * In the interrupted timeline, the throughput ($W_{dd}$) is the sum of the work
    done in each segment ($A_{cw0} + A_{cw1}$) divided by the duration ($T_2 - T_0$).


    Given the interruptions caused by the STW pauses $A_{cw0} + A_{cw1}$, being less
    than $A_{cw}$, $W_{db}$ will consequently be lower than $W_{dd}$. This effectively
    illustrates the reduction in throughput during the response window from $T_0$
    to $T1$, highlighting how STW events impact the application''s efficiency in processing
    tasks and ultimately prolong the response time.


