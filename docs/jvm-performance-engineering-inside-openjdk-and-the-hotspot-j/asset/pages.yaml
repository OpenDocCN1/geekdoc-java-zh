  md: "# Java’s Type System Evolution: Java 11 to Java 17\n\n# Switch Expressions\n\
    \nJava 12 introduced a significant enhancement to the traditional switch statement\
    \ with the concept of switch expressions. This feature was further refined and\
    \ finalized in Java 14. Switch expressions simplify the coding patterns for handling\
    \ multiple cases by automatically inferring the type of the returned value. The\
    \ yield keyword (introduced in Java 13) is used to return a value from a switch\
    \ block.\n\nOne of the key improvements was the introduction of the arrow colon\
    \ syntax (--) for case labels, which replaced the traditional colon syntax (:).\
    \ This syntax not only makes the code more readable but also eliminates the need\
    \ for break statements, reducing the risk of fall-through cases.\n\nHere’s an\
    \ example of how switch expressions can be used:\n\n```\npublic enum Day {\n \
    \   MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY\n}\n\npublic\
    \ String getName(Day day) {\n    return switch (day) {\n        case MONDAY ->\
    \ \"Monday\";\n        case TUESDAY -> \"Tuesday\";\n        case WEDNESDAY, THURSDAY\
    \ -> {\n            String s = day == Day ? \"Midweek\" : \"Almost Weekend\";\n\
    \            yield s; // yield is used to return a value from a block of code\n\
    \        }\n        // Other cases ...\n        default -> throw new IllegalArgumentException(\"\
    Invalid day: \" + day);\n    }\n}\n```\n\nIn this example, the switch expression\
    \ is used to return the name of a day based on the value of the variable. The\
    \ yield keyword is used to return a value from a block of code in the case of\
    \ WEDNESDAY and THURSDAY.\n\nSwitch expressions also improve the compiler's exhaustiveness\
    \ checking. As a result, the compiler can detect whether all possible cases are\
    \ covered in a switch expression and issue a warning if any are missing. This\
    \ feature is especially beneficial when you are dealing with enum values. In a\
    \ traditional switch statement, if a new value is introduced, it could easily\
    \ be overlooked in the corresponding switch cases, leading to potential bugs or\
    \ unexpected behavior. However, with switch expressions, the compiler will prompt\
    \ you to explicitly handle these new cases. This not only ensures correctness\
    \ but also enhances maintainability by making it easier to accommodate later changes\
    \ in your enum definitions.\n\nFrom a maintainability perspective, switch expressions\
    \ can significantly improve the readability of your code. The compiler can optimize\
    \ the execution of switch expressions effectively as is"
