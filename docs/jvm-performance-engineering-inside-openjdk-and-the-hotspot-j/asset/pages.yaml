  md: "# Benchmarking Modes in JMH\n\nJMH provides several benchmarking modes, and\
    \ the choice of mode depends on which aspect of performance you're interested\
    \ in.\n\n+   - Throughput: Measures the benchmark method's throughput, focusing\
    \ on how many times the method can be called within a given time unit. This mode\
    \ is useful when you want to measure the raw speed, such as operations in a data\
    \ stream.\n- Average Time: Measures the average time taken per benchmark invocation,\
    \ offering insights into how long it typically takes to execute a single method\
    \ call. This mode is useful for understanding the performance of discrete operations,\
    \ such as a request to a web server.\n- Sample Time: Measures the time it takes\
    \ for each benchmark invocation and calculates the distribution of invocation\
    \ times. This mode is useful when you want to understand the distribution of times,\
    \ not just the average, but as latency of a network call.\n- Single Shot Time:\
    \ Measures the time it takes for a single invocation of the benchmark method.\
    \ This mode is useful for benchmarks that take a significant amount of time to\
    \ execute, such as a complex algorithm or a large database query.\n- All: Runs\
    \ the benchmark in all modes and reports the results for each mode. This mode\
    \ is useful when you want a comprehensive view of your method's performance.\n\
    \nTo specify the benchmark mode, use the @BenchmarkMode annotation on your benchmark\
    \ method. For instance, to benchmark a method in throughput mode, you would use\
    \ the following code:\n\n```\n@Benchmark\n@BenchmarkMode(Mode.Throughput)\npublic\
    \ void myMethod() {\n    // ...\n}\n```\n\n# Understanding the Profilers in JMH\n\
    \nIn addition to supporting the creation, building, and execution of benchmarks,\
    \ JMH provides inbuilt profilers. Profilers can help you gain a better understanding\
    \ of how your code behaves under different circumstances and configurations. In\
    \ the case of JMH, these profilers provide insights into various aspects of the\
    \ JVM, such as garbage collection, method compilation, class loading, and code\
    \ generation.\n\nYou can specify a profiler using the -prof command-line option\
    \ when running the benchmarks. For instance, java -jar target/benchmarks.jar -prof\
