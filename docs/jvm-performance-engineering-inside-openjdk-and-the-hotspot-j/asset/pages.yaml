    # Java 10: Local Variable Inference and G1 Parallel GC


    Java 10 introduced local-variable inference with the var keyword. This feature
    simplifies code by allowing the Java compiler to infer the variable''s type from
    its initializer. This results in less verbose code, making it more readable and
    reducing boilerplate. Here''s an example:


    ```

    // Before Java 10

    List<Student> admittedStudentsGPA = new ArrayList<>();


    // With ''var'' in Java 10

    var admittedStudentsGPA = new ArrayList<Student>();

    ```


    In this example, the var keyword is used to declare the variable admittedStudentsGPA.
    The compiler infers the type of admittedStudentsGPA from its initializer new ArrayList<Student>(),
    so you don''t need to explicitly declare it.


