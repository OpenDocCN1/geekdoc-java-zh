    # Jmod


    jmod is a tool used to create, describe, and list JMOD files. JMOD files are an
    alternative to JAR files for packaging modular Java applications, which offer
    additional features such as native code and configuration files. These files can
    be used for distribution or to create custom runtimes with jlink.


    Here''s how you can use jmod to create a JMOD file for the brickhouse example.
    Let''s first create and package the module specific to this:


    ```

    $ java --module-source-path src -d build/modules $(find src -name "*.java")

    $ jmod create --class-path build/modules/com.codekaram.brickhouse com.codekaram.jmod

    ```


    Here, the jmod create command is used to create a JMOD file named com.codekaram.brickhouse.jmod
    from the com.codekaram.brickhouse module located in the build/modules directory.
    You can then use the jmod describe command to display information about the JMOD
    file:


    ```

    $ jmod describe com.codekaram.brickhouse.jmod

    ```


    This command will output the module descriptor and any additional information
    about the JMOD file.


    Additionally, you can use the jmod list command to display the contents of the
    created JMOD file:


    ```

    $ jmod list com.codekaram.brickhouse.jmod

    com/codekaram/brickhouse/

    com/codekaram/brickhouse/loadLayers.class

    com/codekaram/brickhouse/loadLayers1.class

    ```


    The output lists the contents of the com.codekaram.brickhouse.jmod file, showing
    the package structure and class files.


    By using jmod to create JMOD files, describe their contents, and list their individual
    files, you can gain a better understanding of your application''s structure and
    streamline the process of creating runtime images with jlink.'
