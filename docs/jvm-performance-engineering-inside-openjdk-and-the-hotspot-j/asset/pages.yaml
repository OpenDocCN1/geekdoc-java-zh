    * **Concurrent marking time:** G1 anticipates the time to complete the concurrent
    marking phase. This foresight is critical in the initiation of the marking phase
    by dynamically adjusting the IHOP—the initiating heap occupancy percent (-XX:InitiatingHeapOccupancyPercent).
    The adjustment of IHOP is based on real-time analysis of the generation''s occupancy
    and the application''s memory allocation.

    * **Mixed garbage collection time:** G1 predicts the time for mixed garbage collections
    to strategically select a set of regions to collect along with the young generation.
    This estimation helps G1 in maintaining a balance between reclaiming sufficient
    space and adhering to pause-time targets.

    * **Young garbage collection time:** G1 calculates the time for young-only collections
    to guide the resizing of the young generation. G1 adjusts the size of the young
    generation based on these predictions to optimize pause times based on the desired
    and adapt to the application''s changing allocation patterns.

    * **Amount of reclaimable space:** G1 estimates the space that will be reclaimed
    by collecting specific regions. This estimate informs the decision-making process
    for including old regions in mixed collections, optimizing memory utilization,
    and minimizing the risk of heap fragmentation.


    # Core Scaling


    G1''s design inherently supports multithreading, allowing it to scale with the
    number of available cores. This has the following implications:


    +   * **Parallelized young-generation collections:** Ensuring quick reclamation
    of short-lived objects.

    * **Parallelized old-generation collections:** Enhancing the efficiency of space
    reclamation in the old generation.

    * **Concurrent threads during the marking phase:** Speeding up the identification
