    # Simplifying Native Image Generation


    GraalVM''s AOT compilation limits its performance credentials. By precompiling
    bytecode to code, it minimizes the overhead of the JVM''s interpreter during start-up.
    Furthermore, by bypassing the traditional JIT compilation phase, applications
    experience a faster warm-up, reaching peak performance in a shorter span of time.
    This is invaluable for architectures like microservices and serverless environments,
    for both rapid start-up and quick warm-up are of essence.


    In recent versions of GraalVM, the process of creating native images has been
    simplified the native image capacity is now included within the GraalVM distribution
    itself. This enhances the process for developers:


