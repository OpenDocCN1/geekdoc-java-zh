  md: '# Metrics for Measuring Java Performance


    Each metric provides a unique lens through which the performance of a Java application
    can be examined and optimized. For instance, latency metrics are crucial in real-time
    processing environments where timely responses are desired. Meanwhile, scalability
    metrics are vital not just in assessing an application''s capacity to grow and
    manage peak loads, but also for determining its scaling factor—a measure of how
    effectively the application can expand its capacity in response to increased demands.
    This scaling factor is integral to capacity planning as it helps prepare the necessary
    resources and adjustments needed to support and sustain the application''s growth.
    By understanding both the present and potential scaling scenarios, you can ensure
    that the application remains robust and efficient, adapting seamlessly to current
    and future operational challenges.


    A particularly insightful aspect of evaluating responsiveness and latency is understanding
    the call depth in an application. Every stage in a call chain can introduce its
    delay, and these delays can accumulate and amplify as they propagate down the
    chain. This effect means that an issue at an early stage can significantly exacerbate
    the overall latency, affecting the application''s end-to-end responsiveness. Such
    dynamics are crucial to understand, especially in complex applications with multiple
    interacting components.


    In the ecosystem, these metrics are not only used to monitor and optimize applications
    in production environments, but also play a pivotal role in the development and
    testing phases. Tools and frameworks within the Java world, such as JMH, offer
    specialized functionalities to measure and analyze these performance indicators.


    For the purpose of this book, acknowledging the diversity and importance of various
    performance metrics in Java, we will concentrate on four key areas: footprint,
    responsiveness, throughput, and availability. These metrics have been chosen due
    to their broad applicability and impact on Java applications:


    # Footprint


    Footprint pertains to the space and resources required to run your software. It''s
    a crucial factor, especially in environments with limited resources. The footprint
    comprises several aspects:


    +   **Memory footprint:** The amount of memory your software consumes during execution.
    This includes both the Java heap for object storage and native memory used by
    the JVM itself. The footprint encompasses runtime data structures, which constitute
    the application system footprint. Native memory tracking (NMT) in the JVM can
    play a key role, providing detailed insights into the allocation and usage of
    native memory. This is essential for diagnosing potential memory inefficiencies
    or leaks outside of the Java heap. In Java applications, optimizing memory allocation
    and garbage collection strategies is key to managing this footprint effectively.


    +   **Code footprint:** The size of the actual executable code of your software.
    Large codebases can require more memory and storage resources, impacting the system''s
    overall footprint. In managed runtime environments, such as those provided by
    the JVM, the code footprint can have direct impact on the process, influencing
    overall performance and resource utilization.'
