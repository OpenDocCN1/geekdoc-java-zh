  md: '# From Monolithic to Modular: The Evolution of the JDK


    Before the introduction of the modular JDK, the bloating of the JDK led to overly
    complex and difficult-to-read applications. In particular, complex dependencies
    and cross-dependencies made it difficult to maintain and extend applications.
    JAR (Java Archives) hely (i.e., problems related to loading classes in Java) arose
    due to the lack of simplicity and JARs'' lack of awareness about what they contained.


    The sheer footprint of the JDK also posed a challenge, particularly for smaller
    devices or other situations where the entire monolithic JDK wasn''t needed. The
    modular JDK came to the rescue, transforming the JDK landscape.


    # Continuing the Evolution: Modular JDK in JDK 11 and Beyond


    The Java Platform Module System (JPMS) was first introduced in JDK 9, and its
    evolution has continued in subsequent releases. JDK 11, the first long-term support
    (LTS) release after JDK 8, further refined the modular platform. Some of the notable
    improvements and changes made in JDK 11 are summarized here:


    +   - Removal of deprecated modules: Some Java Enterprise Edition (EE) and Common
    Object Request Broker Architecture (CORBA) modules that had been deprecated in
    JDK 9 were finally removed in JDK 11. This change promoted a leaner Java platform
    and reduced the maintenance burden.

    - Matured module system: The JPMS has matured over time, benefiting from the feedback
    of developers and real-world usage. Never JDK releases have addressed issues,
    improved performance, and optimized the module system''s capabilities.

    - Refined APIs: APIs and features have been refined in subsequent releases, providing
    a more consistent and coherent experience for developers using the module system.

    - Continued enhancements: JDK 11 and subsequent releases have continued to enhance
    the module system—example, by offering better diagnostic messages and error reporting,
    improved JVM performance, and other incremental improvements that benefit developers.


    # Implementing Modular Services with JDK 17


    With the JDK''s modular approach, we can enhance the concept of services (introduced
    in Java 1.6) by decoupling modules that provide the service interface from their
    provider module, eventually creating a fully decoupled consumer. The type is usually
    declared as an interface or an abstract class, and the service providers need
    to be clearly identified in their modules, enabling them to be recognized as providers.
    Lastly, consumer modules are required to utilize providers.'
