  md: '# Tuning the Marking Threshold


    As mentioned earlier, Java 9 introduced an adaptive marking threshold, known as
    the IHOP. However, certain pathological cases, such as burst allocations of short-lived
    (possibly humongous) objects, seen when building a short-lived transactional cache,
    could lead to suboptimal behavior. In such scenarios, a low IHOP might result
    in a premature concurrent marking phase, which completes without triggering the
    needed mixed collections—especially if the bursty allocations occur afterward.
    Alternatively, a highly adaptive IHOP that doesn''t decrease quickly could delay
    the concurrent marking phase initiation, leading to regular evacuation failures.


    To address these, you can disable the adaptive marking threshold and set it to
    a steady value by adding the following option to your command line:


    ```

    -XX:+UseAdaptiveIHOP -XX:InitiatingHeapOccupancyPercent=<pc>

    ```


    In Figure 6.9, after the mixed GC pause at approximately 486.4 seconds, there
    is a young GC pause followed by a marking cycle (the line after the young GC pause
    is the marking pause). After the initial marking phase, we observe 23 young GC
    pauses, a “to-space exhausted” failure, and a fully GC pause. In this pattern,
    which a mixed collection cycle has just completed and a new concurrent marking
    cycle begins but is unable to finish while the size of the young generation is
    being reduced (hence the young collections), indicates with the adaptive marking
    threshold. The threshold may be too long, delaying the marking cycle to a point
    where back-to-back concurrent marking and mixed collection cycles are needed,
    or the concurrent cycle may be too long due to a low number of concurrent marking
    threads that can''t keep up with the workload.


    ![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_224_0.png)


    Figure 6.9 A1 Garbage Collector Pause Timeline Showing Incomplete Marking Cycle'
