  md: '# Chapter 7 Runtime Performance Optimizations: A Focus on Strings, Locks, and
    Beyond


    Impact of Compact Strings

    JDK 9 introduced a substantial change to address the issue, JEP 254: Compact Strings
    altering the internal representation of the String class. Instead of a char[],
    a byte[] was used to back a string. This fundamental modification reduced memory
    usage for Latin-1-encoded strings while keeping the public-facing APIs unchanged.


    Reflecting on my time at Sun/Oracle, we had attempted a similar optimization in
    Java 6 called compressed strings. However, the approach taken in Java 6 was not
    as effective as the compression was done during the construction of the String
    object, but the String operations were still performed on char[]. Thus, a "decompression"
    step was necessary, limiting the usefulness of the optimization.


    In contrast, compact strings optimization eliminated the need for decompression,
    providing a more effective solution. This change also benefits the APIs used for
    string manipulation, such as StringBuilder and StringBuffer, along with the JIT
    compiler intrinsics related to String operations.


