    # Exotic Hardware in the Cloud


    The availability of cloud computing has made it convenient for users to gain access
    to specialized or heterogeneous hardware. In the past, leveraging the power of
    exotic hardware often required a significant upfront investment in physical hardware.
    This requirement was a formidable for many developers and organizations, particularly
    those with limited resources.


    In recent years, the cloud computing revolution has dramatically changed this
    landscape. Now, developers can access and leverage the power of exotic hardware
    without making a substantial investment. This has been made possible by major
    cloud service providers, including Amazon Web Services (AWS), Google Cloud, Microsoft
    Azure, and Oracle Infrastructure. These providers have extended their offerings
    with virtual machines that can be equipped with GPUs and other accelerators, enabling
    developers to harness the power of exotic hardware in a flexible and cost-effective
    manner. NVIDIA has been at the forefront of GPU virtualization, offering a flexible
    approach to video encoding/decoding and broad hypervisor support, but AMD and
    Intel also have their own distinct methods and capabilities.


    To address the virtualization complexities, many "provisioners" ensure that only
    one GPU is deployed on physical hardware, thus gaining full and exclusive access
    to it. This approach allows others (non-GPU) hosts to utilize the CPUs, it does
    speak to some of the underlying complexities of utilizing exotic hardware in the
    cloud. Indeed, harnessing specialized hardware components in the cloud presents
    its own set of challenges, particularly from a software and runtime perspective.
    Some of these challenges are summarized in the following subsections.


