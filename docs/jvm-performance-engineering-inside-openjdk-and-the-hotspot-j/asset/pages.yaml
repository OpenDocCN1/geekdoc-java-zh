- pgno: 185
  md: '# Performance Engineering Methodology: A Dynamic and Detailed Approach


    # System Profilers and Performance Monitoring Units


    Within the realm of performance engineering, system profilers—such as perf, OProfile,
    Intel''s VTune Profiler, and other architecture-geared profilers—provide invaluable
    insights into hardware''s functioning that can help developers optimize both system
    and application performance. They interact with the hardware subsystem to provide
    a comprehensive view that is unattainable without standard monitoring tools.


    A key source of data for these profilers is the performance monitoring units (PMUs)
    within the CPU. PMUs, including both fixed-function and programmable PMUs, provide
    a wealth of low-performance information that can be used to identify bottlenecks
    and optimize system performance.


    System profilers can collect data from PMUs to generate a detailed performance
    profile. For example, the perf command can be used to sample stack traces across
    the entire system, creating a "flat profile" that summarizes the time spent in
    each function across the entire system. This kind of performance profile can be
    used to identify functions that are consuming a disproportionate amount of CPU
    time. By providing both inclusive and exclusive times for each function, a flat
    profile offers a detailed look at where the system spends its time.


    However, system profilers are not limited to CPU performance; they can also monitor
    other system components, such as memory, disk I/O, and network I/O. For example,
    tools like iostat and vmstat provide detailed information about disk I/O and memory
    usage, respectively.


    Once we have identified problematic patterns, bottlenecks, or opportunities for
    improvement through monitoring states, we can employ advanced profiling tools
    for deeper analysis.


    # Java Application Profilers


    Java application profilers like async-profiler¹ (a low-overhead sampling profiler)
    and VisualVM (a tool that integrates several command-line JDK tools and provides
    lightweight capabilities) provide a wealth of profiling data on JVM performance.
    They can perform different types of profiling, such as CPU profiling, memory profiling,
    and thread profiling. When used with other system profilers, these tools can provide
    a more complete picture of application performance, from the JVM level to the
    system level.


    By collecting data from PMUs, profilers like async-profiler can provide low-level
    performance information that helps developers identify bottlenecks. They allow
    developers to get stack and generated code-level details for the بعمل, enabling
    them to compare the time spent in the generated code and compiler optimizations
    for different architectures like Intel and Arm.


    To use async-profiler effectively, we need hsdis,² a disassembler plug-in for
    OpenJDK VM. This plugin is used to disassemble the machine code generated by the
    JIT compiler, offering a deeper understanding of how the Java code is executed
    at the hardware level.


    > ¹https://github.com/async-profiler/async-profiler


    > ²https://blogs.oracle.com/javamagazine/post/java-hotspot-hsdis-disassembler'
