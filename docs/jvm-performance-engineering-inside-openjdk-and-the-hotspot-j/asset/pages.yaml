- pgno: 125
  md: 'We navigated the intricacies of creating, packaging, and managing modules,
    and explored the use of module layers to enhance application flexibility. These
    practices can help address common challenges faced when migrating to newer JDK
    versions (e.g., JDK 11 or JDK 17), including updating project structures and ensuring
    dependency compatibility.


    # Performance Implications


    The use of modular Java carries significant performance implications. By including
    only the necessary modules in your application, the JVM loads fewer classes, which
    improves start-up performance and reduces the memory footprint. This is particularly
    beneficial in resource-limited environments such as microservices running in containers.
    However, it is important to note that modularity can improve performance, it also
    introduces a level of complexity. For instance, improper modular design can lead
    to cyclic dependencies, negatively impacting performance. Therefore, careful design
    and understanding of modules are essential to fully reap the benefits.


    # Tools and Future Developments


    We examined the use of powerful tools like jeps, jdepscan, jmod, and jlink, which
    are instrumental in identifying and addressing compatibility issues, creating
    runtime images, and streamlining the deployment of modular applications. Looking
    ahead, we can anticipate more advanced options for creating custom runtime images
    with jlink, and more detailed and accurate dependency analysis with jeps.


    As more developers adopt modular Java, new practices and patterns will emerge,
    alongside-new tools and libraries designed to work with JPMS. The Java community
    is continuously improving JPMS, with future Java versions expected to refine and
    expand its capabilities.


    # Embracing the Modular Programming Paradigm


    Transitioning to modular Java can present unique challenges, especially in understanding
    and implementing modular structures in large-scale applications. Compatibility
    issues may arise with third-party libraries or frameworks that may not be fully
    compatible with JPMS. These challenges, part of the journey toward modernization,
    are often outweighed by the benefits of modular Java, such as improved performance,
    enhanced scalability, and better maintainability.


    In conclusion, by leveraging the knowledge gained from this chapter, you can confidently
    migrate your projects and fully harness the potential of modular Java applications.
    The future of modular Java is exciting, and embracing this paradigm will equip
    you to meet the evolving needs of the software development landscape. It''s an
    exciting time to be working with modular Java, and we look forward to seeing how
    it evolves and shapes the future of robust and efficient applications.


    > ²https://openjdk.org/projects/jigsaw/spec/issues/#CyclicDependencies'
