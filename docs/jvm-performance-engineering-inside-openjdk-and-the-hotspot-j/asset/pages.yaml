    # Ahead-of-Time Compilation


    Ahead-of-time AOT compilation is a technique that plays a significant role in
    managing state and improving the time-performance in the managed runtimes. Introduced
    in JDK 9, AOT aimed to enhance start-up performance by compiling methods to native
    code before the JVM was invoked. This provocation means that the native code was
    ready before rebehind and eliminated the need for interpretation of the bytecode.
    This approach is particularly beneficial for short-lived applications where the
    JIT compiler might not have enough time to effectively optimize the code.


    > NOTE Before we get into the intricacies of AOT, it''s crucial to understand
    its counterpart, JIT compilation. In the HotSpot VM, the interpreter is the first
    to execute, but it doesn''t optimize the code. The JIT-ing process begins in the
    optimizations, but it requires time to gather profiling data for frequently executed
    methods and loops. As a result, there''s a delay, for code that needs an optimized
    state for its efficient execution. Several components contribute to transitioning
    the code to its optimized state. For instance, the (segmented) code maintains
    the JIT code in its various states (for example, profiled and non-profiled). Additionally,
    compilation threads manage via adaptive and speculative optimizations. Notably,
    the HotSpot VM speculatively optimizes dynamic states, effectively converting
    them into static states.¹ The transition of code from its initial interpreted
    state to its optimized form, which can be viewed as the overhead of JIT compilation.


    ¹John Rose pointed out this behavior in his presentation at JMVLS 2023: https://cr.openjdk.org/~jrose/pres/202308-Leyden-JVMLS.pdf.'
