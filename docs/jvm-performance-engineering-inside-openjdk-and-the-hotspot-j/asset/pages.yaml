    Specifying all instead of a tag combination matches all tag combinations.


    If you want to run your application with all log messages, you can execute your
    program with

    -Xlog, which is equivalent to -Xlog:all. This option will log all messages to
    stdout with the

    level set at info, where warnings and errors go to stderr.'
