    # Purpose and Functionality


    ZGC uses pages to facilitate its multithreaded, concurrent, and region-based approach
    to garbage collection.


    +   - Region spanning: A single ZPage (for example, a large ZPage) can cover numerous
    regions. When ZGC allocates a ZPage, it marks the corresponding regions that the
    ZPage spans as being used by that ZPage.


    +   - Relocation: During the relocation phase, live objects are moved from one
    ZPage to another. The regions that objects previously occupied in the source ZPage
    are then made available for future allocations.


    +   - Concurrency: ZPages enable ZGC to concurrently operate on distinct pages,
    enhancing scalability and minimizing pause durations.'
