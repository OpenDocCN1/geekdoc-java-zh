  md: '# Boosting Warm-up Performance with OpenJDK HotSpot VM


    won''t be freed. This is how properly managed class loaders can lead to memory
    leaks.


    +   Class loader leaks occur in several other ways. For example, suppose a class
    loader loads a class that starts a thread, and the thread doesn''t stop when the
    class is no longer needed. In that case, the active thread will maintain a reference
    to the class loader, preventing it from being garbage collected. Similarly, a
    class loaded by a class loader registers a static hook (for example, a shutdown
    hook or a JDBC driver), and doesn''t deregister the hook when it''s done. This
    can also prevent the class loader from being garbage collected.


    +   In the context of garbage collection, the class loader is a GC root. Any object
    that is reachable from a GC root is considered alive and is not eligible for garbage
    collection. So, as long as the class loader remains alive, all the classes it
    loaded (and any objects these classes reference reference) are also considered
    alive and are not eligible for garbage collection.


    **OutOfMemoryError: Metaspace:** If memory leaks accumulate, the Metaspace could
    fill up. Under that condition, the JVM will trigger a full GC collection to clear
    out unused classes and loaders. If this doesn''t free enough space, the JVM will
    attempt to expand the Metaspace. If OutOfMemoryError: Metaspace cannot be expanded
    because not native memory is available, it will be thrown.


    It''s crucial to monitor Metaspace usage and adjust the maximum size as needed.
    Several JVM options can be used to control the size of the Metaspace:


    +   - XX:MetaspaceSize=[size] sets the initial size of the Metaspace. If it is
    not specified, the Metaspace can be dynamically resized based on the application''s
    demand.

    - XX:MaxMetaspaceSize=[size] sets the maximum size of the Metaspace. If it is
    not specified, the Metaspace can grow without limit, using the amount of available
    native memory.

    - XX:MinMetaspaceFreeRatio=[percentage] and XX:MaxMetaspaceFreeRatio=[percentage]
    control the amount of free space allowed in the Metaspace after GC before it will.
    If the percentage of free space is less or greater than these thresholds, the
    Metaspace will shrink or grow.


    Tools such as VisualVM, Jconsole, and Mission Control can be used to monitor Metaspace
    usage and provide valuable insights into memory usage, GC activity, and potential
    memory leaks. These tools also help identify class loader leaks by showing the
    number of classes loaded and the total space occupied by these classes.


    Java 16 brought a significant upgrade to Metaspace with the introduction of JEP
    387: Elastic Metaspace.*¹² The primary objectives of JEP 387 were threefold:


    +   - Elinquiously reclaim unused class-metadata memory back to the OS

    - Minimize the overall memory footprint of Metaspace

    - Streamline the Metaspace for enhanced maintainability


    ¹² https://openjdk.org/jep/387'
