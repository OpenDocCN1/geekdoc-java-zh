  md: '# Chapter 5 End-to-End Java Performance Optimization


    +   - Physical resources: The use of resources such as storage, network bandwidth,
    and, especially CPU usage. CPU footprint, or the amount of CPU resources consumed
    by your application, is a critical factor in performance and cost-effectiveness,
    especially in cloud environments. In the context of Java applications, the choice
    of GC algorithms can significantly affect CPU usage. Stefano notes that appropriate
    optimization of the GC algorithm sometimes results in high CPU usage, leading
    to considerable savings in cloud-based deployments.


    These aspects of the footprint can significantly influence your system''s efficiency
    and operational costs. For instance, a larger footprint can lead to longer start-up
    times, which is critical in contexts like container-based and serverless architectures.
    In such environments, each container includes the application and its dependencies,
    dictating a specific footprint. If this footprint is large, it can lead to inefficiencies,
    particularly in scenarios when multiple containers are running on the same host.
    Such situations give rise to "noisy neighbor" issues, where one container''s resource-intensive
    operations monopolize system resources, affecting the performance of others. Hence,
    optimizing the footprint is not just about improving individual container efficiency;
    it is also about managing resource contention and ensuring more efficient usage
    on shared platforms.


    In serverless computing, although resource management is automatic, an application
    with a large footprint may experience longer start-up times, known as "cold starts."
    This can impact the responsiveness of server functions, so footprint optimization
    is crucial for better performance. Similarly, for most Java applications, the
    memory footprint often directly correlates with the workload of the GC, which
    can impact performance. This is particularly true in cloud environments and with
    microservices architecture, where resource consumption directly affects responsiveness
    and operational overhead and requires careful capacity planning.


    # Monitoring Non-Heap Memory with Native Memory Tracking


    Building on our earlier discussion on NMT on the JVM, let''s take a look at how
    NMT can be effectively employed to monitor non-heap memory. NMT provides valuable
    options for your purpose: a summary view—offering an overview of aggregate usage,
    and a detailed view—presenting a breakdown of usage by individual calls.


    ```

    -XX:NativeMemoryTracking=[off | summary | detail]

    ```


    NOTE Enabling NMT, especially at the detail level, may introduce some performance
    overhead. Therefore, it should be used judiciously, particularly in production
    environments.'
