  md: '# Chapter 3 From Monolithic to Modular Java: A Retrospective and Ongoing Evolution


    and leverage the latest JDK innovations. Through this exploration, the goal is
    to demonstrate how Java applications can significantly benefit from modularization.


    # Understanding the Java Platform Module System


    As just mentioned, the JPMS is a strategic response to the mounting complexity
    and unwieldness of the monolithic JDK. The primary goal when developing it was
    to create a scalable platform that could efficiently manage security at the API
    level while enhancing performance. The advantage of modularity in the Java ecosystem
    empowered developers with the flexibility to select and scale modules based on
    the specific needs of their applications. This transformation allowed Java platform
    to use a more modular layout when managing the Java APIs, fostering a system that
    was not only more maintainable but also more efficient. A significant advantage
    of this modular approach is that developers can utilize those parts of the JDK
    that are necessary for their applications; this selective usage reduces the size
    of their applications and improves load times, leading to more efficient and performant
    applications.


    # Demystifying Modules


    In Java, a module is a cohesive unit comprising packages, resources, and a module
    descriptor (module-info.java) that provides information about the module. The
    module serves as a container for these elements. This, a module


    +   **Encapsulates its packages**: A module can declare which of its packages
    should be accessible to other modules and should be hidden. This encapsulation
    improves code maintainability and security by allowing developers to clearly express
    their code''s intended usage.

    **Expresses dependencies**: A module can declare dependencies on other modules,
    making it clear which modules are required for that module to function correctly.
    This explicit dependency management simplifies the deployment process and helps
    developers identify problematic issues early in the development cycle.

    **Enforces strong encapsulation**: The module system enforces strong encapsulation
    at both compile time and runtime, making it difficult to break encapsulation either
    accidentally or maliciously. This enforcement leads to better security and maintainability.

    **Boosts performance**: The module system allows the JVM to optimize the loading
    and execution of code, leading to improved start-up times, lower memory consumption,
    and faster execution.


    The adoption of the module system has greatly improved the Java platform''s maintainability,
    security, and performance.'
