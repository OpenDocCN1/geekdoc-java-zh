    # Aparati and the JVM


    Aparati offers a seamless integration with the JVM by converting Java bytecode
    into executable OpenCL code that can be executed on the GPU or other hardware
    accelerators. This translation is performed by the Aparati compiler and runtime,
    which are optimized for OpenCL. The JVM then offloads the execution of this code
    to the GPU via Aparati and OpenCL, enabling Java applications to receive significant
    performance improvements for data parallel workloads.


    Figure 9.2 illustrates the flow from a Java application using Aparati to computation
    offloading. The left side of the diagram shows the JVM, within which our Java
    application operates. The application (on the right) utilizes Aparati to define
    a Kernel⁵ performs the computation we want to offload. The "OpenCL-Enabled Compiler
    and Runtime" then translates this Kernel from Java bytecode into OpenCL code.
    The resultant OpenCL code is executed on the GPU or another OpenCL-capable device,
    as depicted by the OpenCL arrow leading to the GPU.


