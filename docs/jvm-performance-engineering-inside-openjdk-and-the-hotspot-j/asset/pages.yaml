  md: '# Chapter 8 Accelerating Time to Steady State with OpenJDK HotSpot VM


    AOT introduced static compilation to dynamic languages. Prior to HotSpot VM, platforms
    like IBM''s J9 and Excelsior JET had successfully employed AOT. Execution engines
    that rely on profile-guided techniques to provide adaptive optimizations can potentially
    suffer from slow start-up times until a warm-up phase. In HotSpot VM''s case,
    the compilation always begins in interpreted mode. AOT compilation, with its precompiled
    methods and shared libraries, is a great solution to warm-up challenges. With
    AOT at the forefront and the adaptive optimizer in the background, the application
    can achieve its performance in an expedited fashion.


    In JDK 9, the AOT feature had exceptional status and was built on top of the Graal
    compiler. Graal is a dynamic compiler that is written in Java, HotSpot VM is written
    in C++. To support Graal, HotSpot VM needed to support a new JVM compiler interface,
    JVMCI¹. A first pass at this was completed for a few known libraries such as java.base,
    jdk, jdk.compiler, and a few others.


    The AOT code added to JDK 9 worked at two levels—tiered and non-tiered, where
    non-tiered was the default mode of execution and was geared toward increasing
    responsiveness. The tiered mode was akin to the T2 level of HotSpot VM''s tiered
    compilation, which is the client compiler with profiling information. After that,
    the methods that met the AOT thresholds were compiled by the client compiler at
    the T3 level and full compiling was carried out by the server compiler at the
    T4 level.


    AOT compilation could be used in conjunction with CDS to improve startup performance.
    The CDS feature allows the JVM to share class metadata across different Java processes,
    while AOT compilation allows the JVM to use precompiled code instead of interpreting
    bytecode. When used, these features could significantly reduce start-up time and
    memory footprint.


    However, AOT compilation (within the context of the OpenJDK HotSpot VM) faced
    certain limitations. For instance, AOT-compiled code had to be stored in shared
    libraries, necessitating the use of position-independent code (PIC). This requirement
    was due to the fact that where the code was loaded into memory could not be predetermined,
    preventing the AOT compiler from making location-based optimizations. In contrast,
    the JIT compiler is allowed to make more assumptions about the execution environment
    and optimizes the code accordingly.


    The JIT compiler can directly reference symbols, eliminating the need for indirections
    and resulting in more efficient code. However, these optimizations by the JIT
    compiler increase start-up time, as the compilation process happens during application
    execution. By comparison, an interpreter, which executes bytecode directly, does
    not need to spend time compiling the code, but the execution speed of interpreted
    code is generally slower than that of


