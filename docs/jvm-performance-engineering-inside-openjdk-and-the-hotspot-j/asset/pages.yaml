    # The Mechanics of Response Time with an Application Timeline


    To better understand response time, consider Figure 5.1, which depicts an application
    timeline. The timeline illustrates two key events: the arrival of a stimulus $S_0$
    at time $T_0$, the application sending back a response $R_0$ at time $T_1$. Upon
    receiving the stimulus, the application continues to work ($A_{cw}$) to process
    this stimulus, and then sends back a response $R_0$ at $T_1$. The work happening
    before the stimulus is denoted as $A_{ws}$. Thus, Figure 5.1 illustrates the concept
    of response time in the context of application work.


    # Understanding Response Time and Throughput in the Context of Pauses


    Stop-the-world (STW) pauses refer to periods when all application threads are
    suspended. These pauses, which are required for garbage collection, can interrupt
    application work and impact response time and throughput. Considering the application
    timeline in the context of STW pauses helps us better understand how response
    time and throughput are affected by such events.


    Let''s consider a scenario where STW events interrupt the application''s continuous
    work ($A_{cw}$). In Figure 5.2, two portions of the uninterrupted $A_{cw}-A_{cw}$
    and $A_{cw}$—are separated by STW events. In this altered timeline, the response
    $R_0$ that was supposed to be sent at time $T_1$ in the uninterrupted scenario
    is now delayed until time $T_2$.


