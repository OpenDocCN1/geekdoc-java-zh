  md: '# Chapter 6 Advanced Memory Management and Garbage Collection in OpenJDK


    Fine-tune TLAB performance, the JVM provides several options for configuring TLAB
    behavior. These options can be used to optimize TLAB usage for specific application
    workloads and requirements. Some of the key tuning options include


    +   - UseTLAB: Enables or disables TLABs. By default, TLABs are enabled in HotSpot
    VM. To disable TLABs, use -XX:-UseTLAB.

    - -XX:TLABSize=<value>: Sets the initial size of TLABs in bytes. By adjusting
    this value can balance TLAB size with the activation rate of individual threads.
    For example, -XX:TLABSize=16384 sets the initial TLAB size to 16 KB.

    - ResizeTLAB: Controls whether TLABs are resizable. To disable TLAB resizing,
    use -XX:-ResizeTLAB.

    - -XX:TLABRefillWasteFraction=<value>: Specifies the maximum allowed waste for
    TLAB, as a fraction of the TLAB size. This value influences the frequency of resizing,
    with smaller values leading to more frequent resizing. For example,-XX:TLABRefillWasteFraction=64
    sets the maximum allowed waste to 1/64 of the TLAB size.


    By experimenting with these tuning options and monitoring the effects on your
    application''s performance, you can optimize TLAB usage to better suit your application''s
    allocation patterns and demands, ultimately improving its performance. To monitor
    TLAB usage, you can use tools such as Flight Recorder (JFR) and JVM logging.


    For Java Flight Recorder in JDK 11 and later, you can start recording using this
    command-line option:


    -XX:StartFlightRecording-duration=300s, jdk.ObjectAllocationInTLABEnabled=true,
    jdk.ObjectAllocationOutsideTLABEnabled=true, filename=myrecording.jfr


    This command will record a 300-second profile of your application and save it
    as myrecording.jfr. You can then analyze the recording with tools like JDK Mission
    Control¹ to visualize TLAB-related statistics.


    For JVM logging, you can enable TLAB-related information with the Unified Logging
    system using the following:


    ```

    -Log:gc*,gc+tlab=file=gc.log,tags

    ```


    This configuration allows all GC-related information (gc*) along with TLAB information
    (gc+tlab=debug) to a named file gc.log. The time decorators are used to include
    timestamps and tags in the log. You can then analyze the log to see the effects
    of TLAB tuning on your application''s performance.


    Similar to TLABs, the OpenJDK HotSpot VM employs Promotion-Local Allocation Buffers
    (PLABs) for GC to promote objects. Many GC algorithms perform deep-first copying
    into these PLABs to enhance co-location. However, not all promoted objects are
    copied into PLABs; some objects might be directly promoted to the old generation.
    Like TLABs, PLABs are automatically resized based on the application''s promotion
    rate.


