  md: '# Chapter 1 The Performance Evolution of Java: The Language and the Virtual
    Machine


    Most HotSpot GCs employ the renowned "scavenge" algorithm for young collections.
    The Serial GC in HotSpot JVM employs a single garbage collection thread to efficiently
    reclaim memory within the young-generation space. In contrast, generational collectors
    such as the Parallel GC (throughput collector), G1 GC, and CMS GC leverage multiple
    GC threads.


    # Old-Generation Collection and Reclamation Triggers


    Old-generation reclamation algorithms in HotSpot VM''s generational GCs are optimized
    for throughput, responsiveness, or a combination of both. The Serial GC employs
    a single-threaded mark-sweep-compacting (MSC) GC. The Parallel GC uses a similar
    MSC with multiple threads. The CMS GC performs concurrently marking, dividing
    the process into STW or concurrent phases. After marking, CMS reclaims old-generation
    space by performing in-place deallocation without compaction. If fragmentation
    occurs, CMS falls back to the serial GC.


    G1 GC, introduced in Java 7 update 4 and refined over time, is the incremental
    collector. Specifically, it incrementally reclaims and compacts the old-generation
    space, as opposed to performing the monolithic reclamation and compaction that
    is part of MSC. G1 divides the heap into smaller regions and performs garbage
    collection on a subset of regions during a collection cycle, which helps maintain
    more predictable pause times while also handling compaction.


    After multiple young-generation collections, the old generation starts filling
    up, and garbage collection kicks in to reclaim space in the old generation. To
    do so, a full marking cycle must be triggered by (1) a promotion failure, (2)
    a promotion of a regular-sized object that makes the old generation or the total
    heap cross the marking threshold, or (3) a large object allocation (also known
    as humongous allocation in G1 GC) that causes the heap occupancy to cross a predetermined
    threshold.


    Shenandoah GC and ZGC—introduced in JDK 12 and JDK 11, respectively—are ultra-low-pause-time
    collectors that aim to minimize STW pauses. In JDK 17, they are single-generational
    collectors. Apart from using thread-local handshakes, these collectors know how
    to optimize for low-pause scenarios by either employing the application threads
    to help out or by asking the application threads to back off. This GC technique
    is known as graceful degradation.


    # Parallel GC Threads, Concurrent GC Threads, and Their Configuration


    In the HotSpot VM, the total number of GC worker threads (also known as parallel
    GC threads) is calculated as a fraction of the number of processing cores available
    to the Java process at start-up. Users can adjust the Parallel GC thread count
    by assigning it to the command line using -XX:ParallelGCThreads=


    This configuration flag enables developers to define the number of GC threads
    for GC algorithms that use parallel collection phases. It is particularly useful
    for tuning generational GCs, such as the Parallel GC and G1 GC. Recent additions
    like Shenandoah and ZGC, also use multiple GC worker threads and perform garbage
    collection concurrently with the application threads to minimize pause times.
    They benefit from load balancing, work sharing, and work stealing, which enhance
    performance and efficiency by parallelizing the garbage collection'
