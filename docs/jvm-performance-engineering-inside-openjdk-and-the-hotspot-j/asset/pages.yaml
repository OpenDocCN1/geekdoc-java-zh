    # Project Leyden: A New Dawn for Java Performance


    While AOT promoted performance gains, the complexity it added to the Hot VM overshadowed
    its benefits. The challenges of maintaining a separate AOT compiler, the additional
    maintenance burden due to its reliance on the Graal compiler, and the inefficiencies
    of generating PIC made it clear that a different approach was needed. This led
    to the inception of Project Leyden.


    The essence of Java application performance lies in understanding and managing
    the various particulars through capturing snapshots of variables, objects, and
    resources, and ensuring they''re efficiently utilized. This is where Project Leyden
    steps in. In JDK 17, Leyden aims to address the challenges of Java''s slow start-up
    time, slow time-to-peak performance, and large footprint. It''s not just about
    faster start-ups; it''s about ensuring that the entire life cycle of a Java application,
    from start-to-state, is optimized.


    # Training Run: Capturing Application Behavior for Optimal Performance


    Project Leyden introduces the concept of a "training run," which is similar to
    the step in which we generate the archive of preprocessed classes for CDS. In
    a training run, we aim to capture all of the application''s behavior, especially
    during the start-up and warm-up phases. This recorded behavior, encompassing method
    calls, resource allocations, and other runtime intricacies, is then harnessed
    to generate a custom runtime. Tailored to the application''s specific needs, this
    ensures faster start-ups and a quicker ascent to peak performance. It''s Leyden''s
    way of ensuring that Java applications are not just performing adequately, but
    optimally.


    Leyden''s precompiled runtime images mark a shift towards enhanced predictability
    in performance, which is particularly beneficial for applications where traditional
    JIT compilation might not fully optimize the code due to short runtimes. This
    advancement represents a leap in Java''s evolution, streamlining the start-up
    process and enabling consistent performance.


