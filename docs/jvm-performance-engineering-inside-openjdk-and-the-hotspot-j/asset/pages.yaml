    perceived by others, varies across architectures. At one end of the spectrum are
    architectures with strong memory models like x86-64 and SPARC, which utilize TSO.⁷
    Conversely, the Arm V8-A architecture has a more relaxed model that allows for
    more flexible reordering of memory operations. This flexibility can lead to higher
