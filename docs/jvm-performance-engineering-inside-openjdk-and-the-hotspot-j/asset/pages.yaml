    # Java 11: New HTTP Client and String Methods, Epsilon and Z GC


    Java 11, a long-term support (LTS) release, introduced a variety of improvements
    to the Java platform, enhancing its performance and utility. One significant JVM
    addition in this release was the Epsilon GC,²⁵ an experimental no-GC introduced
    to test the performance of applications with minimal GC interference. The Epsilon
    GC allows developers to understand the impact of garbage collection on their application''s
    performance, helping them make informed decisions about tuning and optimization.


    ```

    $ java -XX:+UnlockExperimentalOptions -XX:+UseEpsilonGC -jar MyApp.jar

    ```


    Epsilon GC is a unique addition to the JVM. It manages memory allocation, but
    doesn''t implement any actual memory reclamation process. With this GC, once the
    Java heap is used, the JVM will shut down. Although this behavior might seem unusual,
    it''s actually quite useful in certain scenarios—for instance, with extremely
    short-lived microservices. Moreover, for ultra-latency applications that can afford
    the heap footprint, Epsilon GC can help avoid all marking, moving, and compaction,
    thereby eliminating performance overhead. This streamlined behavior makes it an
    excellent tool for performance testing an application''s memory pressures and
    understanding the overhead associated with VM/memory barriers.


    Another JVM enhancement in Java 11 was the Z Garbage Collector (ZGC), which was
    initially available as an experimental feature. ZGC is a low-latency, scalable
    GC designed to handle large heaps with minimal pause times. By providing better
    garbage collection performance for applications with large memory requirements,
    ZGC enables developers to create high-performance applications that can effectively
    manage memory resources.(We''ll take a deep dive into ZGC in Chapter 6 of this
    book.)


    Keep in mind that these GCs are experimental in JDK 11, so using +XX:+UnlockExperimentalVMOptions
    flag is necessary to enable them. Here''s an example for ZGC:


    ```

    $ java -XX:+UnlockExperimentalOptions -XX:+UseZGC -jar MyApp.jar

    ```


    > ²⁵https://blogs.oracle.com/magazine/post/epsilon-the-jks-do-nothing-garbage-collector'
