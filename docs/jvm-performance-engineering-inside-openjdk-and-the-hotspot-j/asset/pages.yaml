  md: '# String Optimizations 227


    constant pool. With the BSM''s assistance and by passing a runtime parameter,
    it becomes possible to precisely place the parameter within the prebuilt string.


    The adoption of invokeddynamic for string concatenation brings several benefits.
    For starters, special strings, as empty and null strings are now individually
    optimized. When dealing with an empty string, the JVM can bypass unnecessary operations,
    simply returning the nonempty counterpart. Similarly, the JVM can efficiently
    handle null strings, potentially sidestepping the creation of new string objects
    and avoiding the need for conversions.


    One notable challenge with traditional string concatenation, especially when using
    StringBuilder, was the advice to calculate the total length of the resulting string.
    This step aimed at ensuring StringBuilder''s internal buffer didn''t undergo multiple
    performance-costly resizes. With invokeddynamic, this concern is alleviated—the
    JVM is equipped to dynamically determine the optimal size for the resulting string,
    ensuring efficient memory allocation without the overhead of manual length estimations.
    This functionality is especially beneficial when the lengths of the strings being
    concatenated are unpredictable.


    Furthermore, invokeddynamic''s inherent flexibility means that string concatenation
    can continuously benefit from JVM advancements. As the JVM evolves, introducing
    new optimization techniques, string concatenation can seamlessly reap these benefits
    without necessitating bytecode or source code modifications. This not only ensures
    that string operations remain efficient across JVM versions, but also future-proofs
    applications against potential bottlenecks.


    For developers keen on performance, the shift to invokeddynamic represents a significant
    advancement. It reduces the developer need for explicit performance patterns for
    string concatenation, and ensures that string operations are automatically optimized
    by the JVM. This reliance on the JVM''s evolving intelligence not only yields
    immediate performance gains but also aligns your code with future enhancements,
    making it a smart, long-term investment for writing faster, cleaner, and more
    efficient Java code.


    # Compact Strings


    Before diving into compact strings, it''s essential to understand the broader
    context. Although computing often revolves around metrics like response time or
    throughput, improvements related to the String class in Java have mostly focused
    on a slightly different domain: memory efficiency. The ubiquity of strings in
    applications, from XML processing, enhancing their memory footprint can significantly
    impact an application''s overall efficiency.


    In JDK 8 and earlier, the JVM used a character array (char[]) to store objects
    internally. Java''s UTF-16 encoding for characters, each char uses 2 bytes in
    memory. As noted in JSP 254: Compact Strings, the majority of strings are encoded
    using the Latin-1 character set (an 8-bit extension of 7-bit ASCII), which is
    the default character set for HTML. Latin-1 can store a character using only 1
    byte—so JDK 8 essentially wasted 1 byte of memory for each Latin-1 character stored.


    > https://openjdk.org/jsp/254'
