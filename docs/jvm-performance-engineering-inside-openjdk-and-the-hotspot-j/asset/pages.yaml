  md: '# The Evolution from PermGen to Metaspace: A Leap Forward Toward Peak Performance


    In the history of Java, prior to the advent of Java 8, the JVM included a space
    known as the Permanent Generation (PermGen). This segment of memory was designated
    for storing class metadata and statistics. However, the PermGen model was not
    without its flaws. It had a fixed size, which could lead to java.OutOfMemoryError:
    PermGen space errors if the space allocated was inadequate for the demands of
    the application.


    # Start-up Implications


    The fixed nature of PermGen meant that the JVM had to allocate and deallocate
    memory during start-up, to lower start-up times. In an effort to rectify these
    shortcomings, Java 8 introduced a significant change: the replacement of PermGen
    with Metaspace.¹¹ Metaspace, unlike its predecessor, is not a contiguous heap
    space, but is located in the native memory used for class metadata storage. It
    grows automatically by default, and its maximum limit is the amount of available
    native memory, which is much larger than the typical PermGen size. This crucial
    modification has contributed to more efficient memory management during start-up,
    potentially accelerating start-up times.


    # Warm-up Implications


    The dynamic nature of Metaspace, which allows it to grow as needed, ensures that
    the JVM can quickly adapt to the demands of the application during the warm-up
    phase. This flexibility reduces the chances of memory-related bottlenecks during
    this critical phase.


    When the Metaspace is filled, a full garbage collection (GC) is triggered to clear
    unused class loaders and classes. If GC cannot reclaim enough space, the Metaspace
    is expanded. This dynamic nature avoids the out-of-memory errors that were common
    with PermGen.


    # Steady-State Implications


    The shift from PermGen to Metaspace ensures that the JVM reaches a steady-state
    more efficient. By eliminating the constraints of a fixed memory space for class
    metadata and statistics, the JVM can manage its resources and mitigate the risk
    of out-of-memory errors, resulting in Java applications that are more robust and
    reliable.


    However, although Metaspace can grow as needed, it''s not immune to memory leaks.
    If class loaders are not handled properly, the native memory can fill up, resulting
    in an OutOfMemoryError: Metaspace. Here''s:


    +   1. Class loader life cycle and potentials:


    +   a. Each class loader has its own segment of the Metaspace where it loads class
    metadata. When a class loader is garbage collected, its corresponding Metaspace
    segment is also freed. However, if live references to the class loader (or to
    any classes it loaded) persist, the class loader won''t be garbage collected,
    and the Metaspace memory it is using


    > ¹¹ www.infoq.com/articles/Java-PERGEN-Removed/'
