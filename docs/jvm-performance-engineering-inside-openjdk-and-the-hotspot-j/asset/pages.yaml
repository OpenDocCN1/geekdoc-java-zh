    # Key Annotations in JMH


    JMH provides a variety of annotations to guide the execution of your benchmarks:


    +   - @Benchmark: This annotation denotes a method as a benchmark target. The
    method with this annotation will be the one the performance metrics are collected.


    +   - @BenchmarkMode: This annotation specifies the benchmarking mode (for example,
    Throughput, Average Time). It determines how JMH runs the benchmark and calculates
    the results.


    +   - @OutputTimeUnit: This annotation specifies the unit of time for the benchmark''s
    output. It allows you to control the time granularity in the benchmark results.


    +   - @Fork: This annotation specifies the number of JMH forks for each benchmark.
    It allows you to isolate each benchmark in its own process and avoid interactions
    between benchmarks.


    +   - @Warmup: This annotation specifies the number of warm-up iterations, and
    optionally the amount of time that each warm-up iteration should last. Warm-up
    iterations are used to get the JVM up to speed before measurements are taken.


    +   - @Measurement: This annotation specifies the number of measurement iterations,
    and optionally the amount of time that each measurement iteration should last.
    Measurement iterations are the actual benchmark runs whose results are aggregated
    and reported.


    +   - @State: This annotation is used to denote a class containing benchmark state.
    The state instance''s life-cycle¹⁸ is managed by JMH. It allows you to share common
    setup code, variables and thread-local or shared scope to control state sharing
    between benchmarks.


    +   - @Setup: This annotation marks a method that should be executed to set up
    a benchmark or state object. It''s a life-cycle method that is called before the
    benchmark method is executed.


    +   - @Teardown: This annotation marks a method that should be executed to tear
    down a benchmark or state object. It''s a life-cycle method that is called after
    the benchmark is executed.


    +   - @OperationsPerInvocation: This annotation indicates the number of operations
    a benchmark method performs in each invocation. It''s used to inform JMH about
    the number of operations in a benchmark method, which is useful to avoid distortions
    from loop optimizations.


    > ¹⁸''Lifecycle'' refers to the sequence of stages (setup, execution, teardown)
    a benchmark goes through.'
