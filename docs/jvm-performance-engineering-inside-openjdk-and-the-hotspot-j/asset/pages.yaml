  md: '# Chapter 2


    # Performance Implications of Java’s Type System Evolution


    The type system is a fundamental aspect of any programming language, and Java
    is no exception. It governs how variables are declared, how they interact with
    each other, and how they can be used in your code. Java is known for its (strongly)
    static-typed nature. To better understand what that means, let''s break down this
    concept:


    +   - Java is a statically type-checked language: That means the variable types
    are checked (mostly) at compile time. In contrast, dynamically type-checked languages,
    like JavaScript, perform type checking at runtime. This static type-checking contributes
    to Java''s performance by catching type errors at compile time, leading to more
    robust and efficient code.


    +   - Java is a strongly typed language: This implies that Java will produce errors
    at compile time if the variable declared does not match the type of the value
    assigned to it. In comparison, languages like C may implicitly convert the value''s
    type to match the variable type. For example, because C performs implicit conversions,
    it can be considered a (weakly) static-typed language. In contrast, languages
    such as assembly are untyped.


    Over the years, Java''s type system has evolved significantly, with each new version
    bringing the language not only more powerful, but also easier to use and understand.
    For instance, the introduction of generics in Java SE 5.0 allowed developers to
    write more type-safe code, reducing the likelihood of runtime errors and improving
    the robustness of applications. The introduction of annotations in Java SE 5.0
    provided a way for developers to embed metadata directly into the code; this metadata
    can be used by the JVM or other tools to optimize functionality or scalability.
    For example, the @FunctionalInterface introduced in Java SE 8 indicates that an
    interface is intended for use with lambda expressions, adding code clarity.


    The introduction of variable handled references in Java 9 provided a more efficient
    way to access variables, such as static or instance fields, array elements, and
    off-heap areas, through their handles. These handles are references to their variables
    and maintain a minimum viable access set that is compatible with the current state
    of the Java Memory Model'
