  md: '# Diving into Levels, Outputs, and Decorators


    +   - tid (ti): Thread ID. For tracing actions of specific threads, aiding in
    debugging concurrency issues or thread-specific behavior.


    +   - uptimemillis (um): JVM uptime in milliseconds. Helps in correlating events
    with the timeline of the application''s operation, especially in performance monitoring.


    Here''s how we add the decorators:


    ```

    $ java -Xlog:gc=uptimemillis,pid,tid Lockloops

    [0.006s][32622] Using G1 GC

    [0.008s][32622] Version: 17.0.8-LTS-211 (release)

    [0.008s][32622] CPUs: 16, 16 available [0.02s][32033][9987] Memory: 16384M


    [0.057s][32622] Compressed class space mapped at: 0x000000012a000000-0x000000016a000000,

    reserved size: 103741824

    [0.075s][32622] Narrow class base: 0x0000000129000000, Narrow class shift: 0,
    Narrow class

    ratio: 0x00000000

    ```


    Decorators like pid and tid are particularly valuable in debugging. When multiple
    JVMs are running, pid helps identify which JVM instance generated the log. tid
    is crucial in multithreaded applications for tracking the behavior of individual
    threads, which is vital in diagnosis issues like deadlocks or race conditions.


    Use uptimemillis for a time reference for events, enabling a clear timeline of
    operations. uptimemillis is essential in performance analysis to understand when
    specific events occur relative to the application''s start. hostname can be valuable
    in distributed systems to identify the source machine of log entries.


    Decorators enhance readability and analysis in several ways:


    +   - Contextual clarity: By providing additional details such as timestamps,
