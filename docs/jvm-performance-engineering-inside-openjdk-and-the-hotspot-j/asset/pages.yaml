    # HotSpot VM Optimizations


    +   - Biased locking (Java 6): Biased locking was a strategy aimed at improving
    the performance of uncontended locks. With this approach, the JVM employed a single
    atomic CAS operation to embed the thread ID in the object header, indicating the
    object''s bias toward that specific thread. This eliminated the need for atomic
    operations in subsequent accesses by the biased thread, providing a performance
    boost in scenarios where the thread repeatedly acquired a lock.


    NOTE Biased locking was introduced to enhance performance, but it brought complexities
    to the JVM. One significant challenge was the unexpected latencies during bias
    revocation, which could lead to unpredictable performance in certain scenarios.
    The evolution of modern hardware and software patterns, which diminished the advantages
    of biased locking, led to its deprecation in JDK 15, paving the way for more consistent
    and predictable synchronization techniques. If you try to use it in versions later
    than Java 15, the following warning:


    Java HotSpot™ 64-Bit Server VM: Option UseBiasedLocking was deprecated in version
    15.0 and will likely be removed in a future release.


    +   - Lock elision: This technique harnesses the JVM''s escape analysis optimization.
    The JVM checks whether the lock object "escapes" from its current scope—that is,
    whether it''s accessed outside the method or thread where it was created. If the
    lock object remains confined, the JVM can eliminate the lock and associated overhead,
    retaining the value in a register (scalar replacement).


    Example: A method in which an object is created, locked, modified, and then unlocked.
    If this object does not escape the method, the JVM can elide the lock.


    +   - Lock coarsening: We often encounter contention with multiple synchronized
    statements. However, these could be locking on the same object. Rather than issuing
    multiple locks, the JVM can combine these into a single, coarser lock, reducing
    the locking overhead over contended and uncontended locks.


    Example: In a loop where each iteration has a synchronized block locking on the
    same object, the JVM coarsens these into one lock outside the loop.'
