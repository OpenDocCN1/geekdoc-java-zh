    where p is a percentage of the total Java heap. With a heap size of 1 GB and a
    default value of 10% (i.e., -Xmx -XX:G10dCSetRegionThresholdPercent=10), the count
    of old regions added to the collection would be 10% of 1 GB (which is rounded
    up), so we get a count of 103. By reducing the percentage to 7%, the maximum count
    drops to 72, which would enough to bring the last-mixed collection within the
    acceptable GC response time SLO. This change also may increase the total number
    of mixed collections, which might be a concern.


