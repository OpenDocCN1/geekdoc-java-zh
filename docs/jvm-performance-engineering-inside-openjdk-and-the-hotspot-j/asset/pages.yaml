  md: '# Implementing Modular Services with JDK 17


    ![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_109_0.png)


    Figure 3.3 Modular Services


    Figure 3.3 depicts the relationships between the modules and classes in a module
    diagram. The module diagram represents the dependencies and relationships between
    the modules and classes:


    +   - The com.example.builder module contains the Builder.java class, which uses
    the BrickHouse interface from the com.example.brickhouse module.

    - The com.example.bricksprovider module contains the BricksProvider.java class,
    which implements and provides the BrickHouse interface.


    # Implementation Details


    The ServiceLoader API is a powerful mechanism that allows the com.example.builder
    module to discover and instantiate the BrickHouse implementation provided by the
    com.example.bricksprovider module at runtime. This allows for more flexibility
    and better separation of concerns between modules. The following subsections focus
    on some implementation details that can help us better understand the interactions
    between the modules and the role of the ServiceLoader API.


    # Discovering Service Implementations


    The ServiceLoader.load() method takes a service interface as an argument—in our
    case, BrickHouse.class—and returns a ServiceLoader instance. This instance is
    an iterable object containing all available service implementations. The ServiceLoader
    relies on the information provided in the module-info.java files to discover the
    service implementations.'
