  md: '# Envisioning the Future of JVM and Project Panama 335


    +   * Parquet columnar storage file format: The Parquet columnar storage format
    for the Hadoop ecosystem could potentially benefit from the Vector API. The compressed
    format of Parquet files could be efficiently processed using vector operations,
