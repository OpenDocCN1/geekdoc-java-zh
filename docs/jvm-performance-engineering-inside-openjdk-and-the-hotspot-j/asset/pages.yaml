  md: '# Beyond Java 17: Project Valhalla


    Project Valhalla is a highly anticipated enhancement to Java''s type system. It
    aims to revolutionize the way we understand and use the object model and generics.
    The main goals are to introduce inline classes (also known as classes or types)
    and user-defined primitives. The project aims to make generics more versatile
    to support these new types. These changes are expected to lead improved performance
    characteristics, particularly for small, immutable objects and generic APIs. To
    fully appreciate the potential of these changes, we need to take a closer look
    at the current performance implications of Java''s type system.


    # Performance Implications of the Current Type System


    Java''s type system distinguishes between primitive data types and reference types
    (objects). Primitive data types do not possess an identity; they represent pure
    data values. The JVM assigns identity only to aggregate objects, as classes and
    arrays, such that each instance is distinct and can be independently tracked by
    the JVM.


    This distinction has notable performance implications. Identity allows us to mutate
    the state of an object, but it comes with a cost. When considering an object''s
    state, we need to account for the object header size and the locality implications
    of the pointers to objects. Even for an immutable object, we still need to account
    for its identity and provide support for operations like System.hashCode(), as
    the JVM needs to be prepared for potential synchronization with respect to object.


    To better understand this, let''s visualize a Java object (Figure 2.2). It consists
    of a header and a body of fields or, in the case of an array object, array elements.
    The object header includes a mark word and a klass, which points to the class''s
    metadata (Figure 2.3). For arrays, the header also contains a length word.


