    # Digging Deeper into Response Time and Availability


    SLAs are essential in setting benchmarks for response time. They might include
    metrics such as average time, maximum (worst-case) response time, 99th percentile
    response time, and other high percentiles (commonly referred to as the ''4-9s''
    and ''5-9s'').


    A visual representation of response times across different systems can reveal
    significant insights. In particular, capturing the worst-case scenario can identify
    potential availability issues that go unnoticed when looking at average or best-case
    scenarios. As an example, consider Table 5.1, which presents recorded response
    times across four different systems.


    Table 5.1 Example: Monitoring Response Times


    | Number of GC Events | Minimum (ms) | Average (ms) | 99th Percentile (ms) | Maximum
    (ms) |

    |---|---|---|---|---||

    | System 1 | 36,562 | 7,622 | 310.415 | 945.901 | 2932.333 |

    | System 2 | 34,920 | 7,258 | 320.778 | 1006.677 | 2744.587 |

    | System 3 | 36,270 | 6,432 | 321.483 | 1004.183 | 1681.305 |

    | System 4 | 40,636 | 7,533 | 325.670 | 1041.272 | 18,598,557 |


    The initial examination of the minimum, average, and 99th percentile response
    times in Table 5.1 might not raise any immediate concerns. However, the maximum
    response time for System 4, reaching a pause as long as18.6 seconds, warrants
    a deeper investigation. Initially, extended pause times might suggest GC inefficiencies,
    but they could also stem from broader system latency issues, potentially triggering
    failover mechanisms in highly available distributed systems. Understanding this
    scenario is critical, as frequent occurrences can severely impact the MTBF and
    MTTR, pushing these metrics beyond acceptable thresholds.'
