    from bleeding across modules.


    # Introduction to Jdeps, Jlink, Jdeprscan, and Jmod


    This section covers four tools that aid in the development and deployment of modular
    applications: jdeps, jlink, jdeprscan, and jmod. Each of these tools serves a
    unique purpose in the process of building, analyzing, and deploying Java applications.


    # Jdeps


    Jdeps is a tool that facilitates the analysis of the dependencies of Java classes
    or packages. It''s particularly useful when you''re trying to create a module
