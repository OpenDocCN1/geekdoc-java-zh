    simplest type system in Java. The language has reserved keywords for these primitive
    types, such as int, short, long, and byte for integer types. Floating-point numbers
    use float and double keywords; boolean represents boolean values; char is used
    for characters. String objects are essentially groups of characters and are immutable
    in nature; they have their own class in: Java.String. The various types of integers
    and floating-point numbers are differentiated based on their size and range, as
    shown in Table 2.1.


