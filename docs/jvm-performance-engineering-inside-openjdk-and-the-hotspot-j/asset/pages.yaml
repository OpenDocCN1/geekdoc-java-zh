    # Improved Java Monitor Enter and Fast Exit Operations


    Contended locking is a resource-intensive operation, and any enhancement that
    reduces the time spent in contention directly impacts the efficiency of Java applications.
    Over time, the JVM has been meticulously refined to improve synchronization performance,
    with notable advancements from Java 8 to Java 17. A critical aspect of JVM performance
    engineering involves unraveling and understanding these runtime enhancements.


    In Java 8, an entering contended lock invokes the InterpreterRuntime::monitorenter
    (Figure 7.20). If the lock is not immediately available, the slower ObjectSynchronizer::slow_enter
    method is invoked. The introduction of enhancements through JEP 143 has refiner
    this method, with improvements clearly evident by Java 17. The ObjectSynchronizer::enter
    method in Java 17 optimizes frequently used code paths—for example, by setting
    the displaced header to a value that indicates the type of lock in use. This adjustment
    provides a streamlined path for the efficient management of common lock types,
    as illustrated by the “optimized ObjectSynchronizer::enter” route in Figure 7.21.


    The process of exiting a lock has also undergone optimization. Java 8''s Interpreter::monitorexit
    can defer slower exit routines, while Java 17''s optimized Object-Synchronizer::exit
    method ensures a faster path to releasing locks.'
