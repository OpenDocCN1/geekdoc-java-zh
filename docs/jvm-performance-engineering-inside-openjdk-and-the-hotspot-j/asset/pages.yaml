    # Transitioning from the Thread-per-Task Model to More Scalable Models


    After exploring locks and spin-wait hints, it''s essential to understand the evolution
    of concurrency models in Java. In the realm of Java, the traditional thread-per-task
    model, in which each new task spawns a new thread, has its limitations. While
    straightforward, this approach can become resource-intensive, especially for applications
    juggling short-lived tasks. As we transition from this model, two primary approaches
    to scalability emerge:


    +   * Asynchronous/reactive style: This approach breaks up a large task into smaller
    tasks that run in a pipeline. While it offers scalability, it may not always align
    seamlessly with the Java platform''s features.


    ¹⁶https://openjdk.org/jeps/285'
