    and VisualVM.


    # Garbage Collectors


    When we talk about performance, we inevitably land on a vital topic: optimization
    of GCs. Three elements are crucial in this process:


    +   - Adaptive reactions: The ability of the GC to adjust its behavior based on
    the current state of the system, such as adapting to higher allocation rates or
    increased long-lived data pressures.


    +   - Real-time predictions: The ability of the GC to make predictions about future
    memory usage based on current trends and adjust its behavior accordingly. Most
    latency-geared GCs have this prediction capability.


    +   - Fast recovery: The ability of the GC to quickly recover from situations
    where it is unable to keep up with the rate of memory allocation or promotion,
    such as by initiating an evacuation failure or a full garbage collection cycle.'
