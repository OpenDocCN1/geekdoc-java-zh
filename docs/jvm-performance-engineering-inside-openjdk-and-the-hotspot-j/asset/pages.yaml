  md: '# How to Use This Book


    +   1. Sequential Reading for Comprehensive Understanding: This book is designed
    to be read from beginning to end, as each chapter builds upon the knowledge of
    the previous ones. This approach is especially recommended for new readers to
    deepen their JVM performance engineering.


    +   2. Modular Approach for Specific Topics: Experienced readers may prefer to
    jump directly to chapters that address their specific interests or challenges.
    The table of contents and index can guide you to relevant sections.


    +   3. Practical Examples and Code: Throughout the book, practical examples and
    code snippets are provided to illustrate key concepts. To get the most out of
    these examples, readers are encouraged to build upon and run the code themselves.
    (Item 5.)


    +   4. Visual Aids for Enhanced Understanding: In addition to written explanations,
    this book employs a variety of textual and visual aids to deepen your understanding.


    +   a. Case Studies: Real-world scenarios that demonstrate the application of
    JVM performance techniques.


    +   b. Screenshots: Visual outputs depicting profiling as well as visual GC plots,
    which are essential for understanding the GC process and phases.


    +   c. Use-Case Diagrams: Visual representations that map out the system''s requirements,
    showing how different entities interact with each other.


    +   d. Block Diagrams: Illustrations that outline the architecture of a particular
    JVM or system component, highlighting performance features.


    +   e. Class Diagrams: Detailed object-oriented designs of various code examples,
    showing relationships and hierarchies.


    +   f. Flowcharts: Step-by-step diagrams that walk you through various performance
    optimization processes and components.


    +   g. Timelines: Visual representations of the different phases or state changes
    in an activity and the sequence of actions that are taken.


    +   5. Utilizing the Companion GitHub Repository: A significant portion of the
    book''s value lies in its practical application. To facilitate this, we have created
    JVM Performance Engineering GitHub Repository (https://github.com/mo-beck/JVM-Performance-Engineering).
    Here, you will find


    +   a. Complete Code Lists: All the code snippets mentioned in the book are available.
    This allows you to see the code and experiment with it. Use it as a launchpad
    for your projects and improve it.


    +   b. Additional Resources and Updates: The field of JVM Performance Engineering
    is evolving. The repository will be periodically updated with new scripts, resources,
    and information to keep you ahead of the latest developments.


    +   c. Interactive Learning: Engage with the material by cloning the repository,
    running the GC scripts against your GC logs, and modifying them to see how outcomes
    better suit your GC learning and understanding journey.'
