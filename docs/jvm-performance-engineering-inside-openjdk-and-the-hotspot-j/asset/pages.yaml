  md: "# Java's Type System Evolution from J2SE 5.0 until Java SE 8\n\n# Other Notable\
    \ Enhancements (Java SE 8)\n\nAs discussed in Chapter 1, the Java language provides\
    \ some predefined annotation types, such as @SuppressWarnings, @Override, and\
    \ @Deprecated. Java SE 7 and Java SE 8 introduced two more predefined annotation\
    \ types: @SafeVarargs and @FunctionalInterface. There are a few other annotations\
    \ that apply to annotations; they are called meta-annotations.\n\nIn Java SE 8,\
    \ generics took a step further by helping the compiler infer parameter type using\
    \ \"target-type\" inference. Java SE 8 introduced type annotations that extended\
    \ the usage of annotations from declarations to anywhere a type is used. Let's\
    \ look at an example of how we could use Java SE 8's \"generalized target-type\
    \ inference\" to our advantage:\n\n```\nHashMap<NonNull, NullList<ReadOnly String>>\
    \ allergyKeys;\n```\n\nIn this snippet, @NonNull annotation is used to indicate\
    \ that the keys and values of the allergyKeys HashMap should never be null. This\
    \ can help prevent NullPointerException at runtime. The @ReadOnly annotation on\
    \ the String elements of List indicates that these should not be modified. This\
    \ can be useful in situations where you want to ensure the integrity of the data\
    \ in your HashMap.\n\nBuilding on these enhancements, Java SE 8 introduced another\
    \ significant feature: lambda expressions. Lambda brings a new level of expressiveness\
    \ and conciseness to the Java language, particularly in the context of functional\
    \ programming.\n\nA key example of the evolution is the concept of \"target typing.\"\
    \ In the context of lambda expressions, target typing refers to the ability of\
    \ the compiler to infer the type of a lambda expression from its target context.\
    \ The target context can be a variable declaration, an assignment, a return statement,\
    \ an array initializer, a method or constructor invocation, or a ternary condition.\n\
    \nFor example, we can sort the allergens by their seasons using a lambda expression:\n\
    \n```\nList<Allergy> sortedAllergens = allergens.stream(allergens.values())\n\
    \    .sorted(Comparator.comparing(Allergy::getSeason))\n    .collect(Collectors.toList());\n\
    ```\n\nIn this example, the lambda Allergy::getSeason is a method reference that\
    \ is equivalent to the lambda expression allergen -> allergen.getSeason(). The\
    \ compiler uses the target type Comparator<Allergy> to infer the type of the lambda\
    \ expression.\n\nJava SE 7 and Java 8 introduced several other enhancements, such\
    \ as the use of the underscore \"_ character to enhance code readability by separating\
    \ digits in numeric literals. Java SE 8 added the ability to use int for unsigned\
    \ 32-bit integers (range: 0 to 232 - 1) and expanded the interface to include\
    \ static and default methods, in addition to method declarations. These enhancements\
    \ benefit classes that are implemented by the interface by providing default and\
    \ static methods with their own implementations.\n\nLet's look at an example of\
    \ how the interface enhancements can be used:"
