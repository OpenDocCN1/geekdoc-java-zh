    # The Role of Language Design and Toolchains


    To effectively utilize the capabilities of exotic hardware, both language design
    and toolchains need to adapt to their demands. This involves several key considerations:


    +   **Language abstractions**: The programming language should offer intuitive
    high-level abstractions, enabling developers to craft code that can execute efficiently
    on different types of hardware. This involves designing language features that
    can express parallelism and take advantage of the unique features of exotic hardware.
    For example, the Vector API in Project Panama provides a way for developers to
    express computations that are vectorized on hardware that supports vector operations.


    +   **Compiler optimizations**: The toolchain, and in particular the compiler,
    plays a crucial role in translating high-level abstractions into efficient low-level
    code that can run on exotic hardware. This involves developing sophisticated optimization
    techniques that can take advantage of the unique features of different types of
    hardware. For example, the TornadoVM compiler can generate OpenCL, CUDA, and SPIR-V
    code. Furthermore, it produces code optimized for FPGAs, RISC-V with vector instructions,
    and Apple M1/M2 chips. This also allows TornadoVM to be executed on a vast array
    of computing systems, from IoT devices like NVIDIA Jetsons to PCs, cloud environments,
    and even the latest consumer-grade processors.'
