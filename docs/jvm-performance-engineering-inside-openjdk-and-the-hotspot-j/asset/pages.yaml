- pgno: 137
  md: 'Optimizing and Managing the Unified Logging System


    # Optimizing and Managing the Unified Logging System


    Although the unified logging system is an indispensable tool for diagnostics and
    monitoring, its use demands careful consideration, particularly in regard to applications''
    performance. Excessive logging can lead to performance degradation, as the system
    spends additional resources writing to the log files. Moreover, extensive logging
    can consume significant amounts of disk space, which could be a concern in environments
    with limited storage. To help manage disk usage, log files can be compressed,
    rotated, or moved to secondary storage as necessary.


    Thus, balancing the need for detailed logging and the potential performance is
    crucial. One approach to do so is to adjust the logging level to include only
    the important messages in production environments. For instance, logging some
    of the messages at the error and warning levels might be more appropriate than
    logging all messages at the info, debug, or trace in high-traffic scenarios.


    Another consideration is the output destination for the logging. During the application''s
    development stages, it is recommended that log messages be directly output on
    stdout—why it''s the default for the logging system. However, writing log messages
    to a file might be more suitable in a production environment, so that messages
    can be archived and analyzed as needed.


    One advanced feature of the unified logging system is its ability to adjust logging
    levels at runtime dynamically. This capability is particularly beneficial for
    troubleshooting issues in live applications. For example, you might run your application
    with standard logging to maximize performance. However, during traffic surges
    or you observe an increase in specific patterns, you can temporarily change the
    logging level to get more relevant information. Once the issue is resolved and
    normalcy is restored, you can revert to the original logging level without restarting
    the application.


    This dynamic logging feature is facilitated by the jcmd utility, which allows
    you to send commands to a running JVM. For instance, to increase the logging level
    for the gc* tag to trace, and to add some useful decorators, you can use the following
    command:


    ```

    $ jcmd <pid> vm.log -gc=*:trace decorators=uptimemillis, tid, hostname

    ```


    Here, <pid> is the process ID of the JVM. After executing this command, the JVM
    will start all garbage collection activities at the trace level, including the
    uptime in milliseconds, thread ID, and hostname decorators. This provides us with
    comprehensive diagnostic information.


    To explore the full range of configurable options, you can use the following command:


    ```

    $ jcmd <pid> help vm.log

    ```


    Although the unified logging system provides a wealth of information, it is essential
    to use it wisely. You can effectively manage the trade-off between logging detail
    and system performance by adjusting the logging level, choosing an appropriate
    output, and leveraging the dynamic logging feature.'
