  md: "# The Importance of Performance Benchmarking 169\n\nIn this example, JMH first\
    \ performs five warm-up iterations, running the benchmark method but not recording\
    \ the results. This warm-up phase is analogous to the ramp-up phase in the application's\
    \ life cycle, where the JVM is gradually improving the application's performance\
    \ until it reaches peak performance. The warm-up phase in JMH is designed to reach\
    \ this steady-state before the measurements are taken.\n\nAfter the warm-up, JMH\
    \ does five measurement iterations, where it does record the results. This corresponds\
    \ to the steady-state phase of the application's life cycle, where the application\
    \ executes its main workload at peak performance.\n\nIn combination, these features\
    \ make JMH a powerful tool for performance optimization, enabling developers to\
    \ better understand the behavior and performance characteristics of your Java\
    \ code. For detailed learning, it is recommended to refer to the official JMH\
    \ documentation and sample codes provided by the OpenJDK project.¹⁷\n\n# Loop\
    \ Optimizations and @OperationsPerInvocation\n\nWhen dealing with a loop in a\
    \ benchmark, you must be aware of loop optimizations. The JVM's JIT compiler can\
    \ recognize when the result of a loop doesn't affect the program's outcome and\
    \ remove the loop entirely during optimization. To ensure that the loop is not\
    \ removed, you can use the @OperationsPerInvocation annotation. This annotation\
    \ tells JMH how many operations your benchmark is performing, preventing the JIT\
    \ compiler from skipping the loop.\n\nThe Blackhole class is used to \"consume\"\
    \ values that you don't need but want to prevent from being optimized. This outcome\
    \ is achieved by passing the value to the blackhole.consume() method, which ensures\
    \ the JIT compiler won't optimize away the code that produced it. Here's an example:\n\
    \n```\n@Benchmark\n@BenchmarkMode(Mode.AverageTime)\n@OutputTimeUnit(TimeUnit.NANOSECONDS)\n\
    @OperationsPerInvocation(10000)\npublic void measureLoop(Blackhole blackhole)\
    \ {\n\tfor (int i = 0; i < 10000; i++) {\n\t\tblackhole.consume(i);\n\t}\n}\n\
    ```\n\nIn this example, the @OperationsPerInvocation(10000) annotation informs\
    \ JMH that the measureLoop() method performs 10,000 operations. The blackhole.consume(i)\
    \ call ensures the loop isn't removed by JIT optimizations, leading to accurate\
    \ benchmarking of the loop's performance.\n\n¹⁷https://github.com/openjdk/jmh"
