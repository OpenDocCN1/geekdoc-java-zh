    G1 represents an important milestone in the evolution of GCs in the Java ecosystem.
    It introduced a regional heap and enabled users to use realistic pause time goals
    and maximize desired heaps. G1 predicts the total number of regions per collection
    (young and mixed) to meet the target pause. However, the actual pause time might
    still vary due to factors such as the density of data structures, the popularity
    of regions or objects in the collected regions, and the amount of live data per
    region. This variability can make it challenging for applications to meet their
    already defined SLOs and creates a demand for a near-real-time, predictable, scalable,
    and low-latency garbage collector.


    # Z Garbage Collector: A Scalable, Low-Latency GC for Multi-terabyte Heaps


    To meet the need for real-time responsiveness in applications, the Z Garbage Collector
    (ZGC) was introduced, augmenting OpenJDK'' garbage collection capabilities. ZGC
    incorporates innovative concepts into the OpenJDK universe—some of which have
    precedents in other collectors like Azul''s C4 collector. Among ZGC''s pioneering
    features are concurrent compaction, colored pointers, off-heap forwarding tables,
    and load barriers, which collectively enhance performance and predictability.


    ZGC was first as an experimental collector in JDK 11 and reached production readiness
    with JDK 15. In JDK 16, concurrent stack processing was enabled, allowing ZGC
    to guarantee that pause times would remain below the millisecond threshold, independent
    of LDS and heap size. This advancement enables ZGC to support a wide spectrum
    of heap sizes, ranging from as little as 8 MB to as much as 16 TB, allowing it
    to cater to a diverse array of applications from lightweight microservices to
    memory-intensive tasks like big data analytics, machine learning, and graphics
    rendering.


    In this section, we''ll take a look at some of the core concepts of ZGC that have
    enabled this collector to achieve ultra-low pauses and high predictability.


    # ZGC Core Concepts: Colored Pointers


    One of the key innovations of ZGC is its use of colored pointers, a form of metadata
    tagging that allows the garbage collector to store additional information directly
    within the pointers. This technique, known as virtual address mapping or tagging,
    is achieved through multimapping on the x86-64 and aarch64 architectures. The
    colored pointers can indicate the state of an object, whether it is to be marked,
    whether it is pointing into the relocation set, or whether it is reachable only
    through a Finalizer (Figure 6.10).


