  md: '# Understanding JavaHotSpot VM and Its Compilation Strategies


    NOTE Tiered compilation has been enabled by default since Java 8.


    # Client and HotSpot Compilers


    The HotSpot VM provides two flavors of compilers: the fast client compiler (also
    known as the C1 compiler) and the server compiler (also known as the C2 compiler).


    +   1. Client compiler (C1): Aims for fast start-up times in a client setup. JIT
    invocation thresholds are lower for a client compiler than for a server compiler.
    This compiler is designed to compile code quickly, providing a fast start-up time,
    but the code it generates is less optimized.

    2. Server compiler (C2): Offers many more adaptive optimizations and better thresholds
    geared towards higher performance. The counters determine when a method/loop needs
    to be compiled is the same, but the invocation thresholds are different (much
    lower) for a client compiler than for a server compiler. The server compiler takes
    longer to compile methods but produces highly optimized code that is beneficial
    for long-running applications. Some of the optimizations performed by the C2 compiler
    include inlining (replacing methods with the method''s body), loop unrolling (increasing
    the loop size to decrease the overhead of loops and to potentially apply other
    optimizations such as loop vectorization), dead code elimination (removing code
    that does not affect the program results), and range-check elimination (removing
    checks for index-of-bounds errors if it can be assured that the array index never
    crosses its bounds). These optimizations help to improve the execution speed of
    the code and reduce the overhead of certain operations.


    # Segmented Code Cache


    As we delve into the intricacies of the HotSpot VM, it''s important to revisit
    the concept of the code cache. Recall that the code cache is a storage area for
    native code generated by the JIT compiler or the interpreter. With the introduction
    of tiered compilation, the code cache also becomes a repository for profiling
    information gathered at different levels of tiered compilation. Interestingly,
    even the TemplateTable, which the interpreter uses to look up the native code
    sequence for each bytecode, is stored in the code cache.


    The size of the code cache is fixed-up but can be modified on the command line
    by passing the maximum value to XX:ReservedCodeSize. Prior to Java 7, the default
    value for this was 48 MB. Once the code cache was filled, all compilation would
    cease. This posed a significant problem when tiered compilation was enabled, the
    code cache could contain not only JIT-compiled code (represented as nmethod in
    HotSpot VM) but also profiled code. The nmethod refers to the internal representation
    of a method that has been compiled into machine by the JIT compiler. In contrast,
    the profiled code is the code that has been analyzed and optimized based on its
    runtime behavior.


    > *What is the JIT? Anatomy of the OpenJDK HotSpot VM.\* infoq.com.'
