    # Working Example: JAR Hell


    In this section, a working example is provided to demonstrate the use of module
    layers addressing the JAR hell problem in the context of JDK 17 (this strategy
    is applicable to JDK 11 users). This example builds upon Nikita''s explanation
    and the house service provider implementation we discussed earlier. It demonstrates
    how you can work with different versions of a library (tiered basic and high-quality
    implementations) within a modular application.


    First, let''s take a look at the sample code provided by Java SE 9 documentation:¹


    +   1 ModuleFinder finder = ModuleFinder.of(dir1, dir2, dir3);

    2 ModuleLayer parent = ModuleLayer.boot();

    3 Configuration scl = parent.configuration().resolve(finder, ModuleFinder.of(),
    Set.of("myapp"));

    4 ClassLoader scl = ClassLoader.getSystemClassLoader();

    5 ModuleLayer layer = parent.defineModulesWithOneLoader(cf, scl);


    In this example:


    +   * At line 1, a ModuleFinder is set up to locate modules from specific directories
    (dir1, dir2, and dir3).

    * At line 2, the boot layer is established as the parent layer.

    * At line 3, the boot layer''s configuration is resolved as the parent configuration
    for the modules found in the directories specified in line 1.

    * At line 5, a new layer with the resolved configuration is created, using a single
    class loader with the system class loader as its parent.


    > ¹https://docs.oracle.com/javase/9/docs/api/java/lang/ModuleLayer.html'
