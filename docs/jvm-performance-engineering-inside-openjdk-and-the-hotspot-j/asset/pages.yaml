    \nOur discussion will further explore the latter's practical applications, focusing\
    \ on Java's concurrency enhancements.\n\n# Traditional One-to-One Thread Mapping\n\
    \nTo better understand the traditional thread-per-task model, let's look at a\
    \ typical thread creation example. When a new task needs execution, we create\
    \ a Java process thread (ept):\n\n```\n// Traditional thread creation\nThread\
    \ thread = new Thread(() -> {\n    // Thread to be executed in the thread\n}\n\
    thread.start();\n```\n\nFigure 7.33 illustrates the runtime structure and the\
    \ interactions between the JVM process and OS when a thread is introduced by the\
    \ JVM process. The diagram showcases the convention threading model in Java. Each\
    \ Java thread (jpt0, jpt1, jptn) is typically mapped one-to-one to an OS thread.\
    \ Every Java thread possesses its own Java Stack, program counter (PC) register,\
    \ native stack, and runtime data. Java manages synchronization, locks, wait queues,\
    \ and thread pools. The standard practice of mapping Java threads to OS threads\
    \ in a one-to-one ratio can pose challenges. For instance, when a Java process\
    \ thread (jpt) is blocked, it can also block the corresponding OS thread, thereby\
    \ diminishing scalability.\n\n![](img/b73fc03bf3f04a230ffa48f9ffca9e1a_288_0.png)\n\
