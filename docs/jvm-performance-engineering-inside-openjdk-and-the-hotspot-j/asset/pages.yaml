    +   - Counter management:

    - For threads of DECREASING, the counter of the sharedResource is checked. If
    it''s zero, the thread enters a waiting state until another thread modifies the
    counter and sends a notification.

    - Conversely, for threads of INCREASING, the counter is checked against its maximum
    value (ten). If the counter is maxed, the thread waits until another thread modifies
    the counter and sends a notification. Once notified, it increments the counter
    and prints the status.


    +   - Notification: After modifying the counter, the thread sends a wake-up signal
    to all other threads on the sharedResource object''s monitor using the sharedResource.notifyAll().


    # Advancements in Java''s Locking Mechanisms


    Java locking have seen significant refinements over the years, both at the API
    level and in the HotSpot VM. This section provides a structured overview of these
    enhancements to Java.


    # API-Level Enhancements


    +   - ReentrantLock (Java 5): ReentrantLock, which is part of the java.util.concurrent
    locks package, offers more flexibility than the intrinsic locking provided by
    the synchronized keyword. It supports features such timed lock waits, interruptible
    lock waits, and the ability to create fair locks.


    Thanks to ReentrantLock, we have ReadWriteLock, which uses pairs of locks: one
    for supporting concurrent read-only operations and another exclusive lock for
    writing.


    > NOTE Although ReentrantLock offers advanced capabilities, it''s not a direct
    replacement for synchronized. Developers should weigh the benefits and trade-offs
    before choosing them.


    +   - StampedLock (Java 8): StampedLock provides a mechanism for optimistic reading,
    which can improve throughput under the condition of high contention. It supports
    both read and write locks, like ReentrantReadWriteLock, but with better scalability.
    Unlike other locks, StampedLock does not have an "owner." This means any thread
    can release a lock, not just the thread that acquired it. Careful management to
    avoid potential issues is critical when StampedLock is used.'
