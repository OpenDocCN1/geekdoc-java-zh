  md: 'Additionally, LWGL''s reliance on JNI to interface with native libraries comes
    with its set of challenges. These challenges are highlighted by the insights of
    Gary Frost, an architect at Oracle, who brings a rich history in bridging Java
    with exotic hardware:


    +   - **Memory mismatch:** The JVM is highly autonomous in managing memory. It
    controls the memory allocation and deallocation cycle, providing automatic garbage
    collection to manage object lifetimes. This, however, can clash with the behavior
    of native libraries and hardware APIs that require manual control over memory.
    APIs for GPUs and other accelerators often rely on asynchronous operations, which
    can lead to a mismatch with the JVM''s memory management style. These APIs allow
    data memory requests and kernel dispatches to run immediately, with actual operations
    being queued for later execution. This latency-hiding mechanism is crucial for
    achieving peak performance on GPUs and similar hardware, which ours nature conflicts
    with the JVM''s garbage collector, which may relocate objects at any time. The
    pointers passed to the GPU through JNI may become invalid in operation, necessitating
    the use of functions like GetPrimitiveArrayCritical to "pin" the objects and prevent
    them from being moved. However, this function can pin only until the JNI call
    returns, forcing Java applications to artificially wait until data transfers complete,
    thereby hindering the benefits of asynchronous operations. It''s worth noting
    that this memory mismatch is not unique to LWGL. Other frameworks and tools, such
    as Aparapi, and TornadoVM (of this writing), also face similar challenges in this
    regard.


    +   - **Performance overhead:** Transitions between Java and native code via JNI
    are generally slower than pure calls due to the need to convert data types and
    manage different calling conventions. This overhead can be relatively minor for
    applications that have frequent calls to native methods. However, for performance-critical
    tasks that rely heavily on native APIs, JNI overhead can become a substantial
    performance bottleneck. The forced synchronization between the JVM and native
    libraries merely exacerbates this issue.


    +   - **Complexity and maintenance:** Using JNI requires a firm grasp of both
    Java and C/C++ developers must write "glue code" to bridge the two languages.
    This need for bilingual proficiency and the translation between differing paradigms
    can introduce complexities, making writing, debugging, and maintaining JNI code
    a challenging task.


    LWGL and JNI remain instrumental in Java applications to access native libraries
    and exotic hardware capabilities, understanding their nuances is crucial, especially
    in performance-critical contexts. Careful design and a thorough understanding
    of both the JVM and the target native libraries help developers navigate these
    challenges and harness the full power of exotic hardware through Java. LWGL provides
    a baseline against which we can compare other approaches, such as Aparapi, Project
    Sumatra, and TornadoVM, which we will discuss in the following sections.


