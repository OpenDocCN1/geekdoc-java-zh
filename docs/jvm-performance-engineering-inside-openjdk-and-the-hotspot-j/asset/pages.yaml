    As this book''s writing, the Vector API resides in the jdk.incubator.vector module
    in the Project Panama allows early-access builds. It provides several benefits:


    +   * **Vector compression expression**: The API offers a suite of vector operations
    that can be employed to articulate computations over vectors. Each operation is
    applied element-wise, ensuring uniformity in the processing of each element of
    the vector.


    +   * **Optimal hardware instruction compilation → enhanced portability**: The
    API is ingeniously designed to compile these computations at runtime into the
    most efficient vector hardware instructions on applicable architectures. This
    unique feature allows the same Java vector instructions across a diverse range
    of CPUs, without necessitating modifications.


    +   * **Leveraging SIMD instructions → performance boost**: The API harnesses
    the power of SIMD instructions, which can dramatically enhance the performance
    of computations over large data sets.


    +   * **Correspondence of high-level instructions to low-level instructions →
    increased developer productivity**: The API is architected in such a way that
    high-level vector operations correspond directly to low-level SIMD instructions
    via intrinsics. Thus, developers can write code at a high level of abstraction,
    while still reaping the performance benefits of low-level hardware instructions.'
