  md: '# Chapter 1 The Performance Evolution of Java: The Language and the Virtual
    Machine


    to manage both of these types of code, leading to increased complexity and potential
    performance issues.


    To address these problems, the default value for ReservedCodeSize was increased
    to 240 MB in JDK 7 update 40. Furthermore, the code cache occupancy crosses a
    preset CacheMinimumFreeSpace where the JIT compilation halts and the JVM runs
    a sweeper; the nmethod sweeper replaces space by evacuating older compilations.
    However, sweeping the entire code cache data structure can be time-consuming,
    especially when the code cache is large and fully.


    Java 9 introduced a significant change to the code cache: It was segmented into
    different regions based on the type of code. This not only reduced the sweeping
    time but also minimized fragmentation of the long-lived code by shorter-lived
    code. Co-locating the code cache of the same type also reduced hardware-level
    instruction misses.


    The current implementation of the segmented code cache includes the following
    regions:


    +   - Non-code cache heap region: This region is reserved for VM internal data
    that are not related to Java methods. For example, the TemplateTable, which is
    a VM data structure. This region doesn''t contain compiled Java methods.

    - Non-profile method code heap: This region contains Java methods that have been
    compiled by the JIT compiler without profiling information. These methods are
    fully optimized and are expected to be long-lived, meaning they will not be recompiled
    frequently and may need to be recompiled infrequently by the sweeper.

    - Profiled method code heap: This region contains Java methods that have been
    compiled with profiling information. These methods are not as optimized as those
    in the non-profile region. They are transient because they can be recompiled into
    more optimized versions and moved to the non-profile region as more profiling
    information becomes available. They can also be recompiled by the sweeper as needed.


    Each of these regions has a fixed size that can be set by their respective command-line
    options:


    | Heap Region Type | Size Command-Line Option |

    | Non-method code heap | -XX:NonMethodCodeHeapSize |

    | Non-profile method code heap | -XX:NonProfiledCodeHeapSize |

    | Profiled method code heap | -XX:ProfileCodeHeapSize |


    Going forward, the hope is that the segmented code caches can accommodate additional
    regions for heterogeneous code as ahead-of-time (AOT)–compiled code and code for
    hardware accelerators.³ There''s also the expectation that the fixed sizing thresholds
    can be upgraded to utilize adaptive resizing, thereby avoiding wastage of memory.


    > ³JEP 197: Segmented Code Cache. https://openjdk.org/jeps/197.'
