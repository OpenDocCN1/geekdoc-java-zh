  md: '# Specific Tags


    By default, running your application with -Xlog but without specific tags will
    produce a large volume of log messages from various system parts. If you want
    to focus on specific areas, you can do so by specifying the tags.


    For instance, if you are interested in log messages related to garbage collection,
    the heap, and compressed oops, you could specify the gc tag. Running your application
    in JDK 17 with the -Xlog:gc* option will produce log messages related to garbage
    collection:


    ```

    $ java -Xlog:gc*

    [0006s][info][gc] Using G1

    [0007s][info][gc,init] Version: 17.0.8+9-LTS-21 (release)

    [0007s][info][gc,init] CPUs: 16, total 16 available

