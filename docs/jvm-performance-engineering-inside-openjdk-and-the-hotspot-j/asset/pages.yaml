    # ZGC Core Concepts: Utilizing Thread-Local Handshakes for Improved Efficiency


    ZGC is notable for its innovative approach to garbage collection, especially in
    how it utilizes thread-local handshakes. Thread-local handshakes enable the JVM
    to execute actions on individual threads without requiring a global STW pause.
    This reduces the impact of STW events and contributes to ZGC''s ability to deliver
    low pause times—a crucial consideration for latency-sensitive applications.


    ZGC''s adoption of thread-local handshakes is a significant departure from the
    traditional garbage collection STW techniques (the two are compared in Figure
    6.11). In essence, they enable ZGC to adapt and scale the collections, making
    it suitable for applications with larger heap sizes and latency requirements.
    However, while ZGC''s concurrent processing approach optimizes for lower latency,
    it could have implications for an application''s maximum throughput. ZGC is designed
    to balance these aspects, ensuring that the throughput degradation remains within
    acceptable limits.


    # ZGC Core Concepts: Phases and Concurrent Activities


    Like other OpenJDK collectors, ZGC is a tracing collector, but it stands out because
    of its ability to perform both marking and compaction. It addresses the challenge
    of moving objects from the "from" space to the "to" space within a running application
    through a set of specialized phases, innovative optimization techniques, and a
    unique approach to garbage collection.


    ZGC refines the concept of a regionalized heap, pioneered by G1, with the introduction
    of Pages—dynamically sized regions that are allocated and managed according to
    memory usage patterns. This flexibility in region sizing is part of ZGC''s strategy
    to optimize memory management and accommodate various allocation rates efficiently.


