  md: '# 110 Part II: Writing Your Own Java Programs


    As you type a program in Eclipse''s editor, Eclipse tries to compile the program.
    When Eclipse finds a compile-time error, Eclipse usually displays at least three
    red markers (see Figure 5-6). The marker in the editor''s left margin has an X-like
    marking and sometimes a tiny light bulb. The marker in the right margin is a small
    rectangle. The marker in the middle is a jagged red underline.


    If you hover your mouse over any of these markers, Eclipse displays a message
    that attempts to describe the nature of the error. If you hover over the jagged
    line, Eclipse displays a message and a list of suggested solutions. Each suggested
    solution is called a *quick fix*. If you right-click the left margin (or control-click
    on a Mac) and choose Quick Fix in the resulting context menu, Eclipse displays
    the suggested solutions. To modify your code automatically (using a suggestion
    from the quick-fix list), either single-click or double-click the item in the
    quick-fix list. That is, single-click anything that looks like a link; double-click
    anything that doesn''t look like a.


    # Omitting punctuation


    In English and Java, using the; proper! punctuation is important


    Take, for, the semicolons in Listing 5-1. What happens if you forget to type a
    semicolon?


    ```

    ```//The following code is incorrect:

    System.out.println(keyboard.nextLine()

    ```

    ```


    If you leave off the semicolon, you get the message shown in Figure 5-7.


