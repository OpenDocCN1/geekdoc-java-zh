  md: '# Chapter 3: Running Programs


    # # What can possibly go wrong?


    Riding the editor of jagged underlines is for celebration. Eclikes like the look
    of your code, so from that point on, it''s smooth sailing. Right?


    Well, it isn''t necessarily so. In addition to some conspicuous compile-time errors,
    your code can have other, less obvious errors.


    Imagine someone telling you to "go to the intersection, and then run right." You
    notice immediately that the speaker made a mistake, and you respond with a polite
    "Huh?" The nonsensical run phrase is like a compile-time error like the jagged
    underlines in Eclipse''s editor. As a listening human, you might be able to guess
    what run means, but Eclipse''s editor dares to fix your mistakes.


    In addition to compile-time errors, other kinds of gremlins hide inside a Java
    program:

    * **Unchecked runtime exceptions**: You have no compile-time errors, but when
    you run your program, the run ends prematurely. Somewhere in the middle of the
    run, your instructions tell Java to do something that can''t be done. For example,
    while you''re running the Mortgage program in the "Running a Canned Java Program"
    section, you type 1,000,000.00 instead of 100,000.00. Java doesn''t like the comma,
    so your program crashes and displays a loading-message, as shown in the figure.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_82_0.png)


    This is an example of an *unchecked runtime exception*—the equivalent of someone
    telling you to run right at the intersection when the only thing to right is a
    brick wall. Eclipse''s editor doesn''t warn you about an unchecked runtime exception
    because, until you run the program, the computer can''t predict that the exception
    will occur.


    **Logic errors**: You see no error markers in Eclipse''s editor, and when you
    run your code, the program runs to completion. But the answer is incorrect. Instead
    of $552.20, the output is $552,200,000.00. The program wrongly tells you to pay
    thousands of times what your house is worth and every month! It''s the equivalent
    of being told to turn right instead of left. You can drive in the wrong direction
    for a long time.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_82_1.png)


    (continued)'
