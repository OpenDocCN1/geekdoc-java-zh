  md: "# Chapter 16: Using Loops and Arrays 329\n\n# Deleting Several Files\n\nA program\
    \ in Chapter 15 deletes a file named importantData.txt. The code to delete the\
    \ file looks like this:\n\n```\nnew File(\"importantData.txt\").delete();\n```\n\
    \nIn that code, the new File calls to a single file. It's very nice code, but\
    \ it doesn't tell you how to delete a bunch of files. How can you write code to\
    \ deal with several files at once?\n\nFortunately, Java provides ways to deal\
    \ with bunches of files. One way uses an array of File objects. Listing 16-6 contains\
    \ a program that illustrates this idea.\n\n+   Listing 16-6: Deleting All .txt\
    \ Files\n\nimport java.io.File;\nclass IHateTxtFiles {\n    public static void\
    \ main(String[] args[]) {\n        File folder = new File(\".\");\n        for\
    \ (File file : folder.listFiles()) {\n            if (file.getName().endsWith(\"\
    .txt\")) {\n                file.delete();\n            }\n        }\n    }\n\
    }\n\nIn many operating systems (including Windows, Mac OS, and Linux), a single\
    \ dot stands for the current directory: the place where a program starts looking\
    \ for files. For a java program running in Eclipse, this working directory is\
    \ the project's root directory. For example, imagine the code in Listing 16-6\
    \ in an Eclipse project named 16-06. Then your hard drive contains a folder named\
    \ 16-06, which in turn, contains a folder named src; in turn, contains the IHateTxtFiles.java\
    \ file. (See Figure 16-8.) The program's working directory is the 16-06 directory,\
    \ so, in Listing 16-6, the code\n\n```\nfolder = new File(\".\")\n```\n\nmakes\
    \ folder refer to the directory named 16-06."
