    If you''re married with fewer than three children, and your income is higher than
    the EQ (Estimated Income Quota), or if you''re single and living in a non-residential
    area (as defined by Section 10, Part iii of the Uniform Zoning Act), and you''re
    either self-employed as an LLC (Limited Liability Company) or you qualify for
    veterans benefits, skip Steps 3 and 4 or 5, and 6, depending on your answers to
    Questions 2a and 3d.


    No wonder I have time to write! I''m too busy interpreting these tax forms.


    Anyway, this chapter deals with the potential complexity of if statements. This
    chapter has nothing as complex as Form 12432-89B, but if you ever encounter something
    complicated, you''ll be ready for it.


    # # Forming Bigger and Better Conditions


    In Listing 9-2 (refer to Chapter 9), the code chooses a course of action based
    on one call to the Random class''s nextInt method. That''s fine for the electronic
    oracle program described in Chapter 9, but what if you''re rolling a pair of dice?
    In Blackjack and other dice games, rolling 3 and 5 isn''t the same as rolling
    4 and 4, even though the total for both is 8. The next move varies, depending
    on whether you roll doubles. To get the computer to roll two dice, you execute
    Random.nextInt($)+1 two times. Then you combine the two rolls into a larger, more
    complicated if statement.'
