  md: '# 18 Part I: Getting Started with Java Programming


    That''s how it works in many programming languages, but that''s not how it works
    in Java. With Java, the computer executes a different set of instructions. The
    computer executes instructions like the ones in Figure 1-4.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_33_0.png)


    Figure 1-4:

    How a computer runs a Java program..


    The instructions in Figure 1-4 tell the computer how to follow other instructions.
    Instead of starting with Get columnNumber, the computer''s first instruction is,
    "Do what it says to the bytecode file." (Of course, in the bytecode file, the
    first instruction happens to be Get columnNumber from memory.)


    There''s a special piece of software that carries you to follow That special piece
    of software is called the Java Virtual Machine (JVM). The JVM walks you through
    the execution of some bytecode instructions. When you run a Java program, the
    computer is really running the JVM. That JVM examines your bytecode, zero by zero,
    and one carries out the instructions described in the bytecode.


    Many methors can describe the JVM. Think of the JVM as a proxy, an errand boy,
    a go-between. One way or another, you have the situation in Figure 1-5. On the
    (a) side is the story you get with most programming languages — the computer runs
    some object code. On the (b) side is the story with Java — the computer runs the
    JVM, and the JVM follows the bytecode''s instructions.'
  merge: -1
