  md: '# Beginning Programming with Java For Dummies, 4th Edition


    # How to Use This Book


    If I could say, "Open to a random page of this book and start writing Java code.
    Just fill in the blanks and don''t look back." In a sense, this is true. You can''t
    break anything by writing Java code, so you''re always free to experiment.


    But I have to be honest, if you don''t understand the bigger picture, writing
    a program is difficult. That''s true with chunks—not just Java. If you''re typing
    code without knowing what it''s about, and the code doesn''t exactly do what you
    want it to, then you''re just plain stark.


    So in this book, I divide programming into manageable chunks. Each chunk is (more
    or less) a chapter. You can jump in anywhere you want—Chapter 5, Chapter 10, or
    wherever. You can start by poking around in the middle of a chapter depend on
    another. I''ve tried to make the examples interesting without making one depend.
    When I use an important idea from another chapter, I include a note to help you
    find your way around.


    In general, my already know something, don''t bother reading about it.


    +   - If you already know something, don''t bother reading about it.

    - If you''re curious, don''t be afraid to skip ahead. You can always sneak a peek
    at an earlier chapter if you really need to do so.


    # Conventions Used in This Book


    Almost every technical book starts with a little typeface legend, and Beginning
    Programming with Java For Dummies, 4th Edition is no exception. What follows is
    a brief explanation of the typefaces used in this book:


    +   - New terms are in italics.

    - When you want to type something short or perform a step, use bold.

    - You''ll also see computerese font. I use the computer font for Java code, filenames,
    web page addresses (URLs), screen messages, and other things. Also, if something
    you need to be really long, it appears in computerese font on its own line (or
    lines).

    - You need to change things when you type them on your own computer keyboard.
    For example, I may ask you to type


