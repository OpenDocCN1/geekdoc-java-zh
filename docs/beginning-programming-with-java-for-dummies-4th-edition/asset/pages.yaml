  md: '# 108 Part II: Writing Your Java Programs


    +   - Be patient.

    Every good programming effort takes a long time to get right. If you don''t understand
    something right away, be persistent. Stick with it (or put it away for a while
    and come back to it). There''s nothing you can''t understand if you put in enough
    time.


    +   - Don''t be frustrated.

    Don''t throw your pie crust. Frustration (not lack of knowledge) is your enemy.
    If you''re frustrated, you can''t accomplish anything.


    +   - Don''t think you''re the only person who''s slow to understand.

    I''m slow, and I''m proud of it. (Melba, Chapter 6 will be a week late.)


    +   - Don''t be timid.


    If your code isn''t working and you can''t figure out why it''s not, then ask
