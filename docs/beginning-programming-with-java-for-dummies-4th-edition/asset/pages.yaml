    To generate numbers in a truly random fashion, you need a big of ping-pong balls,
    like the kind they use in state lottery drawings. The problem is, most computers
    dont have big of ping-pong balls among their peripherals. So strictly speaking,
    the numbers generated by Java''s Random class aren''t random. Scientists call
    these numbers pseudorandom.


    +   - There''s no obvious to predict what number comes next


    +   - No number occurs much often than any of the others.


    +   - It surpasses us all, but knowing one randomly generated value is of no helping
    the next generated value.


