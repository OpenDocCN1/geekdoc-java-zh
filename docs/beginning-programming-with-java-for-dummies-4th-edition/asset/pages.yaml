  md: '# Chapter 2: Setting Up Your Computer


    According to the Eclipse Foundation''s website, Eclipse is "a universal tool platform
    — an open extensible IDE for anything and nothing in particular." Indeed, Eclipse
    is versatile. Programmers generally think of Eclipse as an IDE for developing
    Java programs, but Eclipse has tools for programming in C++, PHP, and many other
    languages. I have even seen incarnations of Eclipse that have nothing to do with
    program development. (One such product is the Lively Browser — a web browser whose
    tabs are built from Eclipse components.)


    # Downloading Eclipse


    Here''s how you download Eclipse:


    +   1. Visit www.eclipse.org.

    2. Look for a way to download Eclipse for your operating system.


    Today, I visit www.eclipse.org and see a big button displaying the words Get Now
    ... Download Eclipse (see Figure 2-8). Tomorrow, who knows what it is on this
    ever-changing website!


    After clicking the Download Eclipse button, I see a list of downloads for my computer''s
    operating system (see Figure 2-9).

    Eclipse''s download page directs you to versions of Eclipse that are specific
    to your operating system. For example, if you visit the page on a Windows computer,
    the page shows you downloads for Windows only. If you''re downloading Eclipse
    use for another computer, you may want to override the automatic choice of operating
    system. Look for a little dropown list containing the name of your computer''s
    operating system. You can change the selected operating system in drop-down list.


