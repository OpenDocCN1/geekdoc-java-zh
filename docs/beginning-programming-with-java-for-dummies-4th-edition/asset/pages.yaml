    # Those pesky filename extensions


    The files displayed in Windows File Explorer or in a Finder can be misleading.
    You may browse one of your directories and see the name Mortgage.s real name might
    be Mortgage.java, Mortgage.something.class, or old Mortgage. File extensions like
    .java, and .class are called filename extensions.


    In the resulting search box, type Folder Options and press Enter. Then follow
    the instructions in the In All Versions of Windows bullet.


    +   In all versions of Windows (XP and newer): Follow the instructions in one
    of the preceding bullets.


    The ugly truth is that, by default, Windows and Macs hide many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here''s how you do it:


    In the Finder dialog box, click the View tab. Look for the Hide Extensions for
    Known File Types option. Make sure that this check is not selected.


    +   In Windows XP: Choose Start>Control Panel>Appearance and Themes: Follow the
    options in the In All Versions of Windows bullet.


    +   In Mac OS X: In the Finder application''s menu, select Preferences. In the
    resulting dialog box, select the Advanced tab and look for the All File Extensions
    option. Make sure that this check is selected.


    +   In Windows 7: Choose Start>Control Panel>Appearance and Personalization>Folder
    Options. Then follow the instructions in the In All Versions of Windows bullet.


    +   In Linux: Linux distributions tend not to hide filename extensions. So, if
    you use Linux, you don''t have to worry about it! But I haven''t checked Linux
    distributions. So, if your files are named instead of Mortgage.java or Mortgage.class,
    check the documentation specific to your Linux distribution.


    +   In Windows 8: In the Start screen, hold down the Windows key while pressing
    Q.'
