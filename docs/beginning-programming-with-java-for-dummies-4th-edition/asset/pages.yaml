  md: '# 194 Part III: Controlling the Flow


    So to simulate a Backgammon game (and many others, more practical situations)
    you need to combine conditions.


    ```

    If die1 + die2 equals 8 and die1 equals die2, ...

    ```


    You need things like and and or — things that can win conditions together. Java
    has operators to represent these concepts, which are described in Table 10-1 and
    illustrated in Figure 10-1.


    | Operator Symbol | Meaning | Illustration |

    | --- | --- | --- |

    | && | and | 4 < age && age < 8 | Figure 10-1(a) |

    | || | or | age < 4 || 8 < age | Figure 10-1(b) |

    | ! | not | leachKidGetsTen | Figure 10-1(c) |


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_209_0.png)


    Combined conditions, like the ones in Table 10-1, can be quite confusing. That''s
    why I tread carefully when I use such things. Here''s a short explanation of each
    example in the table:


    +   * 4 < age && age < 8

    The value of the age variable is greater than 4 and is less than 8. The numbers
    5, 6, 7, 8, 9 ... are all greater than 4. But among these numbers, only 5, 6,
    and 7 are less than 8. So only the numbers 5, 6, and 7 satisfy this combined condition.'
  merge: -1
  pgno: 209
