  md: '# Chapter 15


    # The Old Runaround


    In This Chapter


    +   - Creating repetitive actions

    - Improving your nesting techniques

    - Insisting on a valid response from the user

    - Looping through enumerated values


    I remember distinctly — the sense of dread I would feel on the way to Aunt Edna’s
    house. She was a kind old woman, and her intentions were good. But visits to her
    house were always agonizing.


    First, we’d sit in the living room and talk about other relatives. That was okay,
    as long as I understood what people were talking about. Sometimes, the gossip
    would be about adult topics, and I’d become very bored.


    After all the family chatter, my father would find Aunt Edna with her bills. That
    was fun to watch because Aunt Edna had genetically inherited family ailment. Like
    me and many of my ancestors, Aunt Edna couldn’t keep track of paperwork to save
    her life. If it was the paper that had allergens that made Edna’s skin crawl.
    After ten minutes of bill paying, my father would find a mistake, an improper
    tally, or something else in the ledger that needed attention. He’d ask Aunt Edna
    about it, and she’d shrug her shoulders. He’d become agitated trying to track
    down the problem, while Aunt Edna rolled her eyes and smiled with ignorant fascination.
    It was great entertainment.


    Then, when the bill paying was done, we’d sit down to eat dinner. That’s when
    I would remember when I dreaded these visits. Aunt Edna believed in Fletcherism
