    # What''s behind all this findWithinHorizon

    nonsense?


    Without wallowing in too much detail, here''s how the findWithinHorizon(". 0).

    charAt(0) technique works:


    Java''s findWithinHorizon method looks for things in the input. The method

    dends on the stuff you put in parentheses. For example, a call to findWithinHorizon

    ("\\d\\\\d", 0) looks for a group of three things. With the following line of
    code


    ```

    System.out.println(keyboard);

    findWithinHorizon("\\d\\\\d", 0));

    ```


    I can


    +   * Testing 123 Testing Testing

    and the computer returns by displaying


    123


    In the call findWithinHorizon("\\d\\\\d", 0), each d stands for a single digit.

    This \d is one of many abbreviations in special code like regular expressions.


    Now here''s something strange. In the world of regular expressions, a dot stands
    for any

    character at all. (That is, a dot for "any character, not necessarily a dot.")

    findWithinHorizon(".", 0) tells the computer to find the next character of any

    kind that the user uses on the keyboard. When you''re trying to find a single
    character,

    findWithinHorizon(".", 0) is mighty useful.


    In the call findWithinHorizon("\\d\\\\d", 0), the \ tells findWithinHorizon

    keep searching until the end of the input. The value 0 is a special case anything
    other

    th limits the search to a number of characters. (That''s why the method name contains

    t word horizon. The horizon is as far as the method sees.) Here are a few examples:


    +   * With the same input, the call findWithinHorizon("\\d\\\\d", 10) also

    returns null. It returns null because the first ten characters of the input (characters
    Testing 123—seven letters, a blank space, and

    digit) don''t contain three consecutive digits. These characters don''t match
    the pattern

    (\d\\\\d).


    +   * With the same input, the call findWithinHorizon("\\d\\\\d", 11) returns

    123 It returns the first 11 characters of the input (characters Testing 123)

    then these 3 consecutive digits.


    +   * With the input A57B442123 Testing, the call findWithinHorizon("\\d\\\\d",

    d\\d", 12) returns 442 because the first 12 characters of the input

    (characters) A57B442123 Test), the first sequence consisting of 3 consecutive
    digits

    is the sequence 442.


    (continued)'
