    # Understanding the big picture


    Your tour of Eclipse begins with a big Bird''s eye of view.


    +   Workbench: The Eclipse desktop (refer to Figure 3-3). The workbench is the
    environment in which you develop code.


    +   Area: A section of the workbench. The workbench in Figure 3-3 contains five
    areas. To illustrate the point, I''ve drawn borders around each of the areas (see
    Figure 3-15).


    +   Window: A copy of the Eclipse workbench. With Eclipse, you can have several
    copies of the workbench open at once. Each copy appears in its own window.


    +   Action: A choice that''s offered to you, typically when you click something.
    For example, when you choose File:New in Eclipse''s main bar, you see a list of
    new things you can create. The list usually includes Project, Folder, File, and
    others may also include things like Package, Class, and Interface. Each of these
