  md: '# 260 Part III: Controlling the Flow


    # A quick look at Java''s disk access facilities


    Templates like the ones in Listings 13-3 and 13-4 are very nice. But knowing how
    the works is even better. Here are a few bits describing the inner workings of
    Java''s disk access code.


    In Listing 13-2, the added words FileNotFoundException form a throws clause. A
    throws clause is a kind of disclaimer. Putting a throws clause in your code is
    like, "Realize that if you put things new can run into trouble."


    +   * A PrintStream is something you can use for writing output.


    A PrintStream is like a Scanner. The big difference is that a Scanner is for reading
    input and a PrintStream is for writing output. To see what I mean, look at Listing
    13-2: Notice the similarity between the statements that Scanner and the statements
    that PrintStream.


    Of course, in the legal realm, you have no choice about signing disclaimers. If
    you don''t sign this disclaimer, then the surgeon won''t operate on you. "Okay,
    then I''ll sign it. The same is true with a Java throws clause. If you put PrintStream("cookedData.txt")
    in your code, and you don''t add anything like throws FileNotFoundException, then
    the Java compiler completes your code.


    The PrintStream is defined in the Java API.


    So when you need this throws FileNotFound clause, and when you should do with
    out it? Well, having things in your code - like new PrintStream("cookedData.txt")
    forces you to create a throws clause. You can spend some time learning all the
    kinds of things that demand clauses. But at this point, it''s better to concentrate
    on other programming issues. As a Java programmer, the safest thing is to do follow
    the templates in Listings 13-3 and 13-4.


    +   * In Listing 13-2, the expression File("rawData.txt") plays the same role
    as System.in in many other programs.


    Just as System stands for the computer''s keyboard, the expression File("rawData.txt")
    stands for a file on your computer''s hard drive. When the computer calls new
    File("rawData.txt"), the computer creates something like System. - something you
    can use inside the Scanner (().


    The FileNotFoundException is... defined in the Java API.


    The File is defined in the Java API.


    +   * A FileNotFoundException is something that may go wrong during an attempt
    to read from a disk file (or an attempt to write to a disk file)


    +   * To create this chapter''s code, I made the names diskScanner and diskWriter.


    Disk access is loaded with pitfalls. Even the best programs run into disk access
    trouble occasionally. To brace against such pitfalls, Java insists on adding some
    extra words to your code.


    The diskScanner and diskWriter don''t come from the Java API. In place of diskscanner
    and


