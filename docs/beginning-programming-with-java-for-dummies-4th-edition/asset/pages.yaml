    When you use a view to change something, the change takes immediately. For example,
    when you choose Delete in the Package Explorer''s context menu, whatever item
    you''ve selected is deleted immediately. In a way, this behavior is nothing new.
    The same kind of happens when you recycle a file using Windows Explorer or a trash
    using the Macintosh Finder.


    +   **Editor:** A part of the Eclipse workbench that displays information for
    you to modify. A typical editor displays information in the form of text. This
    text can be the contents of a file. For example, an editor in Figure 3-10 displays
    the contents of the MyFirstFitClass.java file.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_86_1.png)


    When you use an editor to change something, the change doesn''t take immediately.
    For example, look at the editor in Figure 3-10. This editor displays the contents
    of the MyFirstFitClass.java. You can type all kinds of things in the editor. Nothing
    happens to MyFirstFitClass.java until you choose File>Save from Eclipse''s menu
    bar. Of course, this behavior is nothing new. The same kind of happens when you
    work in Microsoft Word or in any other wordprocessing program.


    Like others, I occasionally become lazy and use the word "view" when I really
    mean "editor." When you catch me doing this, shake your head and move onward.
    When I''m being very careful, I use the official Eclipse terminology. I refer
    to views and editors as part of the Eclipse workbench. Unfortunately, this "parts"
    terminology doesn''t stick in people''s minds very well.


    An area of the Eclipse workbench might contain several views or editors. Most
    Eclipse users get along fine without giving this "several views" business a second
    thought (or even a first thought). But if you are about the terminology surrounding
    tabs and views, here''s the scoop:


    +   **Tab:** Tabbing is impossible to describe except by calling it "Tab." That
    which we call a tab by any name would move us from one view to another or from
    editor to another. The important thing is, views can be stacked on top of one
    another. Eclipse displayed views as if they''re in a tabbed notebook. For example,
    Figure 3-14 displays one area of the Eclipse workbench. The area contains five
    views (the Problems view, the Javadoc view, the Declaration view, the Search view,
    and the Console view). Each view has its own tab.


    A bunch of stacked views is called a tab group. To bring a view in the stack to
    the front, you click that view''s tab.


    And, by way, all this about tabs and views holds true for tabs and editors. The
    only interesting thing is the way Eclipse uses the word "editor." In Eclipse,
