  md: '# Chapter 16: Using Loops and Arrays 321


    Using an array saves you from having to declare ten separate variables: guestsIn0,
    guestsIn1, guestsIn2, and so on. To declare an array with ten values in it, you
    can write two short lines of code:


    ```

    int guestsIn[];

    guests = new int[10];

    ```


    You can even squash these two lines into one longer:


    ```

    int guestsIn[] = new int[10];

    ```


    In either of these code snippets, notice the use of the number 10. This number
    tells the computer to make the guestsIn array its own. Each component of the array
    has a name of its own. The starting component is named guestsIn[0], the next is
    named guestsIn[1], and so on. The last of the ten components is named guestsIn[9].


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_336_0.png)


    In creating an array, you always specify the number of components. The array''s
    indices start with 0 and end with the number''s one less than the total number
    of components. For example, if your array has ten components (and you declare
    the array with new int[10]), the array''s indices go 0 to 9.


    # Storing values in an array


    After you created an array, you can put values into the array''s components. For
    example, the guests in Room 6 are fed with all those mint candies that you put
    on peoples'' beds. They check out, and Room 6 becomes vacant. You should put the
    value 0 into the 6 component. You can do it with this assignment statement:


    ```

    guestsIn[6] = 0;

    ```


