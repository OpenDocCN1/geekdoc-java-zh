  md: '# Chapter 17


    # Programming with Objects

    and Classes


    In This Chapter


    +   * Programming with class (with style and finesse)

    * Making objects from classes

    * Joining the exclusive “I understand classes and objects” society


    > Chapters 6, 7, and 8 introduce Java’s primitive types — things like int, double,
    char, and boolean. That’s great, but how often does a real-problem deal exclusively
    with such simple values? Consider an exchange between a merchant and a customer.
    The customer makes a purchase, which can involve item names, model numbers, credit
    card info, sales tax rates, and lots of other stuff.


    In older programming languages, you treat an entire purchase like a big pile of
    unbound laundry. Imagine a mound of socks pieces of clothing. You have no basket,
    so you grab as much as you can. As you walk to the washer, you wash a few things
    — a sock and a cloth. This is like the older way of storing the values in a purchase.
    In older languages, there’s no purchase. There are only double values, char values,
    and other items. You put the amount in one variable, the customer’s name in another
    and the sales tax somewhere else. But that’s awful. You need to drop things on
    your way to the cooler. With small errors, you can easily drop an amount here
    and a customer’s name there.


    With laundry and computer programming, you’re better off if you have a basket.
    The newer programming languages, like Java, allow you to combine values and make
    new, more useful kinds of values. For example, in Java, you can combine double
    values, boolean values, and other kinds of values to create something that you
    call a Purchase. Because your purchase is all in one big bundle, keeping track
    of the purchase’s pieces is easier. That’s the start of an important computer
    programming concept — the notion of object-


    oriented programming.'
