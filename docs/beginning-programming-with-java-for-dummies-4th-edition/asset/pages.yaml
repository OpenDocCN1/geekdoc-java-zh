    This book''s examples are pretty simple. If you omit a close method call in one
    of these examples, you might get a warning message from Eclipse, but the world
    doesn''t.(That is, your program still runs correctly.) However, in a serious,
    make-or-break application, the proper placement of close calls is important. These
    calls ensure the proper completion of the program''s input and output actions
    and help free up disk resources for use by other running programs.


    +   - A call to the close method ends the connection between your program and
    the file.


    In many of this book''s examples, you sever the connection between your program
    and the computer keyboard by calling keyboard.close(). The same is true when you
    call the close method for a disk file''s scanner or a disk file''s PrintStream
    instance. Calling the close method reminds Java to finish all reading or write
    operations to


