  md: "# Part IV: Using Program Units\n\nThe Java API has a class named NumberFormat,\
    \ and the NumberFormat class has a static method getCurrencyInstance. When you\
    \ call NumberFormat.getCurrencyInstance() with nothing inside the parentheses,\
    \ you get an object that can mold numbers into U.S. currency amounts. Listing\
    \ 18 has an example.\n\n# Listing 17-7: The Right Way to Display a Dollar Amount\n\
    \n```\nimport java.text.NumberFormat;\nimport java.util.Scanner;\nclass BetterProcessData\
    \ {\n    public static void main(String args[]) {\n        Scanner keyboard =\
    \ new Scanner(System.in);\n        double amount;\n        boolean taxable;\n\
    \        double total;\n        NumberFormat currency =\n            NumberFormat.getCurrencyInstance();\n\
    \        String niceTotal;\n\n        System.out.print(\"Amount: \");\n      \
