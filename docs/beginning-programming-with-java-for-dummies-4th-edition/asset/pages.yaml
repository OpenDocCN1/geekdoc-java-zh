    you must always retype Listing 5-1 exactly as it appears. Some changes are okay;
    others are not. Keep reading for "frinstances".


    # Case sensitivity


    Java is case-sensitive. Among other things, case-sensitive means that, in a Java
    program, the letter P isn''t the same as the letter p. If you send me fan mail
    and start with "Dear Barry" instead of "Dear Barry," I still know what you mean.
    But Java doesn''t work that way.'
