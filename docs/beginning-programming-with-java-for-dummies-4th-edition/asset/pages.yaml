    ```

    COLUMN-NUMBER IS GREATER THAN 60 THEN

    PERFORM WRAP-TO-NEXT-LINE

    ELSE

    PERFORM CONTINUE-SAME-LINE

    END-IF.

    ```


    At the other end of the spectrum, you find languages like Haskell. Here''s a short
    Haskell program, with your program''s input and output:


    ```

    median =

    [ x | x <- alist,

    length((y) | y <- alist, y < x]) ==

    length((y) | y <- alist, y > x)])

    *Main median [4,7,2,1,0,9,6]

    [4]

    ```


    Computer languages can be very different from one another, but in some ways, they''re
    all the same. When you get used to writing IF COLUMN-NUMBER IS GREATER THAN 60,
