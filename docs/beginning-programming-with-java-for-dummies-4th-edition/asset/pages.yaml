  md: '# The Java class


    Have you heard the term object-oriented programming (also known as OOP?) OOP is
    a way of thinking about computer programming problems — a way that''s supported
    by different programming languages. OOP started in the 1960s with a language called
    Simula. It was reinforced in the 1970s with another language named Smalltalk.
    In the 1980s, OOP took off big time with the language C++.


    Some people want to change the acronym, and call it COP — class-oriented programming.
    Because object-oriented programming begins with something called a class. In Java,
    everything starts with classes, everything is enclosed in classes, and everything
    is based on classes. You can''t do anything in Java unless you''ve created a class
    of some kind. It''s like being on Jeopardy, hearing Alex Trebek say,"Let''s go
    to a commercial" and then interrupting him by saying, "I''m sorry, Alex. You can''t
    issue an instruction without putting your instruction inside a class.


    It''s important for you to understand what a class really is, I dare not give
    a haphazard explanation in this chapter. Instead, I devote much of Chapter 17
    to the question,"What is a class?” In Java, your main method has to be inside
    a class. I wrote the code in Listing 4-1, so I got to make up a name for my new
