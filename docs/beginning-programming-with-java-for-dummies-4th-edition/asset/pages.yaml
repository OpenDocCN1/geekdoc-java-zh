    \ with System.in and System.out. But what about\nSystem.getProperty? The getProperty\
    \ method reveals all kinds of infor-\nabout your computer. Some of the information\
    \ you can find includes\nyour operating system's name, your processor's architecture,\
    \ your Java Virtual\nMachine version, your classpath, your username, and whether\
    \ your system\nuses a backslash or a forward slash to separate folder names from\
    \ one another.\nSure, you may already know all this stuff. But does your Java\
    \ code need to\ndiscover it on the fly?"
