    # Generating words


    Most programs don''t work the first time you run them, and some programs don''t
    work without extensive trial and error. This section''s code is a case in point.


    To store this section''s code, I needed a way to generate three-letter words randomly.
    After a dozen attempts, I got the code to work. But I didn''t stop there. I kept
    working for a few hours looking for a simple way to generate three-letter words
    randomly. In the end, it generated the following code (in List 19-3):


    ```

    anAccount.lastName = " + (char)(myRandom.nextInt(26) + ''A'') + (char)(myRandom.nextInt(26)
    + ''a'') + (char)(myRandom.nextInt(26) + ''a'');

    ```


    This code isn''t simple, but it''s not as ready as my original version working.
    Anyway, here is how the code works:


    +   - Each call to my Random.nextInt(26) generates a number from 0 to 25.


    +   - Adding ''A'' gives you a number from 65 to 90.


    To store a ''A'', the computer puts the number 65 in its memory. That''s why ''A''
    to 0 gives you 65 and adding ''A'' to 25 gives you 90. (For more information on
    letters being stored, see the discussion of Unicode characters at the end of Chapter
    8.)


    +   - Applying (char) to turn the number into a char value.


    To store the letters ''A'' through ''Z'', the computer puts the numbers 65 through
    90 in its memory. So casting (char) to a number from 65 to 90 turns the number
    into an uppercase letter. For more information about things like (char), see the
    discussion of casting in Chapter 7.


    Pause for a brief moment. The expression (char)(myRandom.nextInt(26) + ''A'')
    represents a randomly generated uppercase letter. In similar way, (char)(myRandom.nextInt(26)
    + ''a'') represents a randomly generated lowercase letter.


    Watch out! The next couple of steps can be tricky.


    +   - Java doesn''t allow you to assign a char value to a string variable.


    So in List 19-3, the following statement would lead to a compiler error:


    ```

    // Bad statement:

    anAccount.lastName = (char)(myRandom.nextInt(26) + ''A'');

    ```


    +   - In Java, you can use a plus to add a char to a string. When you do, the
    result is a string


    So " + (char)(myRandom.nextInt(26) + ''A'') is a string containing randomly generated
    uppercase character. When you add (char)(myRandom.nextInt(26) + ''a'') onto the
    end of that string, you get another string — a string containing randomly generated
    characters. Finally, when you add another (char)


