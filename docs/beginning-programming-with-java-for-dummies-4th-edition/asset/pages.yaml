  md: '# Chapter 8: Numbers? Who Needs Numbers?


    A run of the enhanced code is shown in Figure 8-13. As you can see, the computer
    misses its. Instead of the expected value 69.8, the computer''s value for 9.0
    / 5.0 * 21 + 32.0 is 69.80000000000001. That''s the way the cookie crumbles. The
    computer does all its arithmetic with zeros and ones, so the computer''s arithmetic
    doesn''t look like the base-10 armetic in Figure 8-11. The computer''s answer
    isn''t wrong. The answer is just inaccurate.


    | Figure 8-13: The fahrenheit variable''s full value. | Enter the Celsius temperature:
    21 Fahrenheit: 69.80000000000001 Room temperature? false |


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_184_0.png)


    In an example in Chapter 7, Java''s remainder operator (%) gives you the answer
    0.129999999999999 instead of 0.13 that you expect. The same kind of thing happens
    in this example. This section''s code doesn''t use an exotic remainder—division,
    multiplication, and addition.


    So be careful when you compare two numbers for equality (==) or for inequality
    (!=). Little inaccuracies can creep in anywhere when you work with Java''s double
    type or with Java''s float type. Several little inaccuracies build up on one another
    to become very large inaccuracies. When you compare double values or float values,
    the values are almost never de-equal to one another.


    If your program isn''t doing what you think it should, check your suspicions about
    the values of variables. Add print and println statements to your code.


    When you compare double values, give yourself some leeway. Instead of comparing
    for exact equality, ask whether a particular value is reasonably close to the
    expected value. For example, use a condition fahrenheit >= 69.8 - 0.01 && fahrenheit
    <= 69.8 + 0.01 to find whether fahrenheit is within 0.01 of the value 69.8. To
    read more about conditions containing Java''s && operator, see Chapter 10.'
