    that repeated letters), to our experience." Another reader, Alan Wilson, had two
    cents to discuss: "the phrase ''Skinning a Cat...'' actually has an older but
    equally interesting British origin. It refers to the act of attaching the nine
    ropes to the whip used to punish recalcitrant sailors up to. The ''O Nine Tails''
    was the name of the whip and there was more than one way to attach the ropes or
