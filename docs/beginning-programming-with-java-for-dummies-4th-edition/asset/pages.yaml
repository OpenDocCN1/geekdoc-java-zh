    # Variations on the Theme


    I don''t like to skin cats. But I''ve heard that, if I ever need to skin one,
    I have a choice of several techniques. I''ll keep that in mind the next time my
    cat Histamine mistakes the carpet for a litter box.


    Anyway, you''re skinning catfish, skinning kitties, or writing computer programs,
    the same principle holds true. You always have alternatives. Listing 9-2 shows
    you one way to write an if statement. The rest of this chapter (and of Chapter
    10) show you some other ways to create if statements.


    # ... Or else?


    You can create an statement without an else clause. For example, imagine a web
    page on which one in ten randomly chosen visitors receives a special offer. To
    keep visitors guessing, I call the Random class''s nextInt method, and make the
    offer to anyone whose name is lucky 7.


    +   if MyRandom.nextIntInt(10) + 1 generates the number 7, display a special offer.


    +   if MyRandom.nextIntInt(10) + 1 generates any number other than 7, do nothing.
    Don''t display a special offer and display a discouraging, "Sorry, no offer for
    you,".


    > * Rick Ross, who read about skinning cats in one of my other books, sent me
    this information via email—"you refer to ''skinning the cat'' and go on to discuss
    litter boxes and what. Note that the phrase ''more than one way to skin a cat''
    refers to the difficulty in removing the skin from catfish, and there is more
