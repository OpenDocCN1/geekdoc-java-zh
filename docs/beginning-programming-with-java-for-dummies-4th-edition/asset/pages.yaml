    standard Java.


    +   JavaFX The newest set of GUI classes in Oracle standard Java. JavaFX contains
    newer(er) versions of Java 7 and with all versions of Java 8.


    Classes in this set belong to packages whose name begin with org.eclipse.


    Classes in this set belong to packages whose name begin with javafx.


    The SWT takes an “all or nothing” approach. When you create an exotic operating
    system doesn''t have, the SWT draws the component the Swing does. That is, SWT
