  md: "# Chapter 9: Forks in the Road\n\nIn fact, it's hard to imagine useful instructions\
    \ that don't involve choices. If you're a homeowner with two dependents earning\
    \ more than $30,000 per year, check here. If you don't remember how to use braces\
    \ in Java programs, see Chapter 4. Did the user correctly type his password? If\
    \ yes, let the user log in; if no, then kick the bum out. If you think the market\
    \ will go up, then buy stocks; otherwise, buy bonds. And if you buy stocks, which\
    \ should you buy? And when should you sell?\n\n# Making Decisions (Java if Statements)\n\
    \nWhen you work with computer programs, you make one decision after another. Almost\
    \ every programming language has a way of branching in one of two directions.\
    \ In Java (and in many other languages), the branching feature is called an *if\
    \ statement*. Check out Listing 9-1 to see an if.\n\n# Listing 9-1: An if Statement\n\
    \n```\nif (randomNumber > 5) {\n    System.out.println(\"Yes. Isn't it obvious?\"\
    );\n} else {\n    System.out.println(\"No, and don't ask again.\");\n}\n```\n\n\
    To see a complete program containing the code from Listing 9-1, skip to Listing\
    \ 9-2 (or, if you prefer, walk, jump, or run to Listing 9-2).\n\nThe statement\
    \ in Listing 9-1 represents a branch, a decision, two alternative courses of action.\
    \ In plain English, this statement has the following meaning:\n\n> if the randomNumber's\
    \ value is greater than\n    display \"Yes. Isn't it obvious?\" on the screen.\n\
    Otherwise,\n    display \"No, and don't ask again.\" on the screen.\n\nPictially,\
    \ you get the fork shown in Figure 9-2.\n\n# Looking carefully at if statements\n\
    \nAn if statement can take the following form:\n\n```\nif (Condition) {\n    SomeStatements\n\
    } else {\n    OtherStatements\n}\n```"
