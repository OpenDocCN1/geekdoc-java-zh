    \ 1 to the number of times that I've chewed.\n- Go back to \"I have chewed\"\n\
    - To find out if I'm done yet.\n\n# Repeating Statements a Certain Number of Times\
    \ (Java for Statements)\n\nLife is filled with examples of counting loops. And\
    \ computer programming mirrors life (... or is it the other way around?). When\
    \ you tell a computer what to do, you're often telling the computer to print three\
    \ lines, process accounts, dial a phone numbers, or whatever. Because counting\
    \ loops are so common in programming, the people who create programming languages\
    \ have developed statements just for loops of this kind. In Java, the statement\
    \ that repeats something a certain number of times is called a *for* statement.\
    \ An example of a *for* statement is in Listing 15-1.\n\nListing 15-1: Horace\
    \ Fletcher's Revenge\n\n```\nimport java.lang.System.*;\nclass AuntEdnaSettlesForTen\
