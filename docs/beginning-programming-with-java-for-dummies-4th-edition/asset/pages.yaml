    1\" GridPane.rowIndex=\"0\"\n    </Label>\n    <Label text=\"Alice\">\n      GridPane.columnIndex=\"\
    0\" GridPane.rowIndex=\"1\"\n    </Label>\n    <Label text=\"555-1234\">\n   \
    \   GridPane.columnIndex=\"1\" GridPane.rowIndex=\"1\"\n    </Label>\n    <Label\
    \ text=\"Bob\">\n      GridPane.columnIndex=\"0\" GridPane.rowIndex=\"2\"\n  \
    \  </Label>\n    <Label text=\"555-3000\">\n      GridPane.columnIndex=\"1\" GridPane.rowIndex=\"\
    2\"\n    </Label>\n  </children>\n</GridPane>\n```"
