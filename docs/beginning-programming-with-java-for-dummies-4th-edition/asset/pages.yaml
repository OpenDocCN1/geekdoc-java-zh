    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_130_0.png)


    Figure 5-10: Three error messages.


    Eclipse is confused by the call to System.out.println is completely out of place.
    Eclipse displays three messages — something about the parenthesis, something about
    very cryptic misplaced constructs. None of these messages address the cause of
    the problem. Eclipse is trying to make the best of a bad situation, but at this
    this point, you shouldn''t believe a word that Eclipse says.


    Computers aren''t smart animals, and if someone programs Eclipse to misplaced
    construct(), that''s exactly what Eclipse says. (Some people that computers make
    them feel stupid. For me, the opposite. A computer remembers how dumb a machine
    can be, and how smart a person can be. I like this)


    So when you have a bunch of error messages, read each error message carefully.
    Ask yourself what you can learn from each message. Don''t take each message as
    the authoritative truth. When you''ve exhausted your efforts return to your efforts
    to stare carefully at the code.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_130_1.png)


    If you get more than one error, always look carefully at each message in the bunch.
    Sometimes a very helpful message hides among a bunch of not-helpful messages.


    # Misspelling words (and other missteps)


    You''ve found an old recipe for deviled eggs (one of my favorites). You follow
    every step as carefully as you can, but you leave out the salt because of grandmother''s
    high blood pressure. You hand your grandmother an egg (a finished masterpiece).
    Not enough pepper," she says, and walks away.


    The next course is beef bourignon. You took an unsalted slice to slice dear Granny.
    "Not sweet enough," she groans, and she leaves the room. "But that''s impossible,"
    you think. "There''s no sugar in beef bourignon. I left out the salt." Even so,
    you go back to the kitchen and prepared mashed potatoes. You use unsalted butter,
    of course. "She''ll love it time," you think.'
