    \ and don't ask again.\");\n        }\n        keyboard.close();\n    }\n}\n```\n\
    \nFigure 9-4 shows several runs of the program in Listing 9-2. The program's action\
    \ has four parts:\n\n+   1. Prompt the user.\n   System.out.print, telling the\
