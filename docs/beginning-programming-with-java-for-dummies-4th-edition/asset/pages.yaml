  md: '# 410 Part IV: Using Program Units


    When you open any copy of eclipse, the program prompts you for a place

    on your hard drive for the Eclipse workspace (your collection of Eclipse projects).
    At this point, you have a choice:


    +   - You can have two different folders for two different workspaces — one

    workspace for your original copy of Eclipse, and a second workspace

    for your new copy of Eclipse.


    Doing keeps your original work (for preceding chapters) separate

    from this chapter’s work. Also, with two different workspaces, you can

    run both copies of Eclipse simultaneously.


    +   - Alternatively, you can point both versions of Eclipse to the same

