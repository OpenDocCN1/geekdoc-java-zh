  md: '# 138 Part II: Writing Your Java Programs


    You should notice a couple of things about Listing 7-2. First, you can read an
    int value with the nextInt method. Second, you can issue successive calls to Scanner
    methods. In Listing 7-2, I call nextInt twice. I have to do separate the numbers
    I type by blank spaces. In Figure 7-2, I put one blank space between my 80 and
    my 6, but more blank spaces would work well.


    This blank space rule applies to many of the Scanner methods. For example, here''s
    some code that reads three numeric values:


    ```

    gumballs = keyboard.nextInt();

    costOfGumballs = keyboard.nextDouble();

    kids = keyboard.nextInt();

    ```


