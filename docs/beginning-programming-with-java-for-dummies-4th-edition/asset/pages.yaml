  md: '# Chapter 17: Programming with Objects and Classes 337


    # Running code that straddles two separate files


    From Eclipse''s point of view, a project that contains two Java source files is
    no big deal. You create two classes in the same project, and then you choose Run
    As Java Application. Everything works the way you expect it to work.


    The only time things becomes tricky is when you have two methods in the one project.
    This section''s example (Listings 17-2 and 17-3) doesn''t suffer from that malady.
    But by experiment with your code, you can easily add classes with additional methods.
    You may also create a large application with several starting points.


    When a project has more than one method, Eclipse may prompt you and ask which
    main method you want to run. Sometimes Eclipse arbitrarily picks one of the methods
    and ignores all the others. This can be very confusing. You add a print call to
    the wrong main method, and nothing appears in the Console view. Hey, what gives?


    You can fix the problem by following these steps:


    +   1. Expand the project''s branch in the Package Explorer.

    2. Expand the src folder within your project''s branch.

    3. Expand the (default package) branch within the src branch.

    The (default package) branch contains .java files.

    4. (In Windows) Right-click the .java file whose main method you want to run.
    (On Mac) Control-click the .java file whose main method you want to run.

    5. In the resulting context menu, choose Run As Java Application.


    You cannot run a project that has no main method. If you try, you get a message
    box like the one shown earlier in Figure 17-2.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_352_0.png)


    # Why bother?


    On the surface, the code in Listing 17-3 is longer, more complicated, and harder
    to read. Think about a pile of laundry. You might take time to find a basket and
    put socks into the basket. The clothes are much easier to carry. It''s the same
    way with the code in Listing 17-3. When you have your data in a Purchase basket,
    it''s much easier to do complicated things with purchases.'
