  md: '# 272 Part III: Controlling the Flow


    # 2. I run the code for in Listing 13-5.


    The call to new PrintStream in Listing 13-5 creates a file named approval.txt.
    Initially, the new approval.txt file contains no characters. In Listing 13-5,
    calls to print and println put characters in the file. So, after running the code,
    the approval.txt file contains two letters: the letters OK.


    # 3. I run the code from Listing 13-5 a second time.


    At this point, I could imagine seeing OKOK in the approval.txt file. But that''s
    not what I see in Figure 13-8. After running the code twice, the approval.txt
    file contains just one OK. Here''s why:


    +   - The call to new PrintStream in Listing 13-5 deletes my existing approval.txt
    file. The call creates a new, empty approval.txt file.

    - After creating a new approval.txt file, the print method call drops the letter
    O into the new file.

    - The println method adds the letter K to the same approval.txt file.


    So that''s the story. Each time you run the program, it trashes whatever approval.txt
    file is already on the hard drive. Then the program adds data to a newly created
    approval.txt file.'
