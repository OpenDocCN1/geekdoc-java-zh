  md: '# 116 Part II: Writing Your Java Programs


    "Sour potatoes! Huck! Granny says, as she goes to the sink to spit it all out.
    Because you have a strong ego, you''re not insulted by your grandmother''s behavior.
    You''re somewhat confused. Why is she saying things about unsalted recipes?Maybe
    there are some subtle differences that you don''t know about.


    Well, the same kind of thing happens when you''re writing computer programs. You
    can make the same kind of mistake twice (or at least, make what you think is the
    same kind of mistake twice) and get different error messages each time.


    For example, if you change the spelling or capitalization of println in Listing
    5-1, Eclipse tells you the method is undefined for the type PrintStream. But if
    you change System to system, Eclipse says that system cannot be resolved. With
    System misspelled, Eclipse doesn''t notice whether println is spelled correctly.


    If you change the spelling of args, nothing goes wrong. The program compiles and
    runs correctly. But if you change the spelling of main, you make some unusual
    difficulties. (If you don''t believe me, read the "Runtime errors" section, later
    in this chapter.).


    Still in 5-1, change the number equal signs in the Scanner keyboard = new Scanner(System.in)
    line. With one equal sign, everybody''s happy. If you accidentally type two equal
    signs (Scanner keyboard = new Scanner(System.in)), Eclipse steers you back on
    course, telling you Syntax error on token "=" expected (see Figure 5-11). If you
    go crazy and try four equal signs or if you type no equal signs at all, Eclipse
    misinterprets your everything and suggests that you insert "; to complete BlockStatements.
    Unfortunately, inserting a semicolon not help at all (see Figure 5-12).


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_131_0.png)


    So remember: Java responds to errors in different ways. In your code might look
    alike, but similar changes don''t always lead to similar results. Each problem
    in your code requires its own individualized attention.'
