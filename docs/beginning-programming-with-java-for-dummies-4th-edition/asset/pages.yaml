  md: "# Chapter 15: The Old Runaround 295\n\n```\nwhile (Condition) {\n  Code that\
    \ gets repeatedly executed\n}\n```\n\nThis way of writing a while statement is\
    \ no accident. The look of statement emphasizes an important point — that the\
    \ computer always checks the condition before executing any of the repeated code.\n\
    \nIf the loop's condition is never true, then the stuff inside the loop is never\
    \ executed — not even once. In fact, you can easily copy a while loop whose statements\
    \ are never executed (although I can't think of a reason why you would ever want\
    \ to do it):\n\n```\n//This code doesn't print anything:\nint twoPlusTwo = 2;\n\
    while (twoPlusTwo == 5) {\n  System.out.println(\"Are you kidding?\");\n  System.out.println(\"\
    +2 doesn't equal 5.\");\n  System.out.print(\"Everyone knows that\");\n  System.out.print(\"\
    +2 equals 3.\");\n}\n```\n\nIn this story of twoPlusTwo example, the while statement\
    \ turns out to be the most useful of your loops constructing. In particular, the\
    \ loop is good for situations in which you must look before you leap. For example:\
    \ \"Money is in my account, write a mortgage check every month.\" When you encounter\
    \ this statement, if your account has a zero balance, you don't want to write\
    \ a mortgage check — not even once check.\n\nBut at times (not many), you want\
    \ to leap before you look. In a situation when you're asking the user for a response,\
    \ maybe the user's response makes sense, but it doesn't. Maybe the user's finger\
    \ slipped, or perhaps the user didn't understand the question. In many situations,\
    \ it's important to correctly interpret the user's response. If the user's response\
    \ doesn't make sense, you must ask again.\n\n# Getting a trustworthy response\n\
    \nConsider a program that deletes a file. Before deleting the file, the program\
    \ asks for confirmation from the user. If the user types Y, then delete: if the\
    \ user types N, then don't delete. Of course, deleting a file is serious stuff.\
    \ Mistaking a bad keystroke for a \"yes\" answer can delete the company's records.\
    \ (And mistake a bad keystroke for a \"no\" answer can preserve the company's\
    \ incriminating evidence.) So if there's any doubt about the user's response,\
    \ the program should ask the user to respond again."
