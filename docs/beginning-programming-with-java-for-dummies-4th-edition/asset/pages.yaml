    Problem! None at all! You''ll display an answer randomly. The user won''t know
    the difference. (Hah, hah!) You can do this as long as you generate random numbers.
    The numbers from 1 to 10 will just do fine.


    In Listing 9-2, the stuff about Random and myRandom looks very like the familiar
    Scanner code. From a beginning programmer''s point of view, Random and Scanner
    work almost the same way. Of course, there is an important difference. A call
    to the Random class''s nextInt(10) method doesn''t fetch anything from the keyboard.
    Instead, nextInt(10) gets a number out of the blue.


    The name Random is defined in the Java API. The call to myRandom.nextInt(10) in
    Listing 9-2 gets a number from 0 to 9. Then my code adds 1 (making a number from
    1 to 10) and assigns that number to the variable randomNumber. When that''s done,
    you''re ready to answer the user''s question.


    In Java''s API, the word Random is the name of a Java class, and nextInt is the
    name of a Java method. For more information on the relationship between classes
    and methods, see Chapters 17, 18, and 19.


    +   4. Answer yes or no.


    Calling myRandom, nextInt(10) is like spinning a wheel on a TV game show. The
    wheel has slots numbered 1 to 10. If the statement in Listing 9-2 turns your number
    into yes or no alternative. If you roll a number that''s greater than 5, the program
    answers yes. Otherwise (if you roll a number that''s less than or equal to 5),
    the program answers no.


    You can trust us on this. I''ve made lots of important decisions based on my AnswerYesNo
    program.


    # Indenting statements in your code


    Notice how, in Listing 9-2, the println calls inside the if statement are indented.
    Strictly speaking, you don''t have to indent the statements that are inside an
    statement. For all the compiler cares, you can write your program on a single
    line or all your statements in an artful, misshapen zigzag. The problem is, if
    you don''t indent your statements in some logical fashion, then neither you nor
    else can make sense of your code. In Listing 9-2, the indenting of the println
    helps you (and brain) see that these statements are subordinate to the overall
    if/else flow.


    In a small program, unind or poorly indented code is barely tolerable. But in
    a complicated program, indentation that doesn''t follow a neat, logical pattern
    is a big, ugly nightmare.


    Always indent your code to make the program''s flow apparent at a glance.'
