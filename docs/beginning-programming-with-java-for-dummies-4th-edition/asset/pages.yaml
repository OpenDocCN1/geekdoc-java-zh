  md: '# 80 Part II: Writing Your Java Programs


    # # The Elements in a Java Program


    Both English and Java are called languages is no coincidence. You use a language
    to express ideas. English expresses ideas to people, and Java expresses ideas
    to computers. What''s more, both English and Java have things like words, names,
    and punctuation. In fact, the biggest difference between the two languages is
    that Java is easier to learn than English. (If English were easier, then computers
    would understand English. Unfortunately, they can''t.)


    Take an ordinary English sentence and compare it with the code in Listing 4-1.

    Here''s the sentence:


    Suzanne says "eh" because, as you know, she lives in Canada.


    In your school grammar class, you worried about verbs, adjectives, and other things.
    But in this book, you''ll think in terms of keywords and identifiers, as summarized
    in Figure 4-2.


    | Keywords:

    | Suzanne says "eh" because, as you know, she lives in Canada. |

    | Identifier that you can define:

    | Suzanne says "eh" because, as you know, she lives in Canada. |

    | Identifier with a commonly agreed upon meaning:

    | Suzanne says "eh" because, as you know, she lives in Canada. |

    | Figure 4-2: The things you find in a simple sentence. | A noun:

    | Suzanne says "eh" because, as you know, she lives in Canada. |

    | Punctuation:

    | Suzanne says "eh" because, as you know, she lives in Canada. |

    | A comment:

    | Suzanne says "eh" because, as you know, she lives in Canada. |


    Suzanne''s sentence has all kinds of things in it. They''re the same kinds of
    things that you find in a computer program. Here''s the plan: Compare the elements
    in Figure 4-1 with similar elements in Listing 4-1. You already understand English,
    so you use this to figure out some new things about Java.


    But first, here''s a friendly reminder: In the next paragraphs, I draw comparisons
    between English and Java. As you read these paragraphs, it''s important to keep
    an open mind. For example, in comparing Java with English, I may write that "names
    of things are not the same as dictionary words.\ Sure, you can argue that some
    dictionaries list proper nouns and that some people have first names like Hope,
    Prudence, and Spike, but please don''t. You''ll get out of the reading if you
    avoid nitpickings. Okay? Are we still friends?'
