  md: "# Chapter 15: The Old Runaround\n\n# Using Java's do statement\n\nTo write\
    \ the program in Listing 15-4, you need a loop — a loop that repeatedly asks the\
    \ user whether the importantData.txt file should be deleted. (The action of the\
    \ loop in Listing 15-4 is illustrated in Figure 15-7.) The loop continues to ask\
    \ until the user gives a meaningful response. The loop tests its condition at\
    \ the end of each iteration, after each of the user's responses.\n\n![](img/3dfa2b9aa99d9382a4f137c07d48246e_314_0.png)\n\
    \nThat's why the program in Listing 15-4 has a do loop (also known as while loop).\
    \ With a do loop, the program jumps right in, executes some statements, and then\
    \ checks a condition. If the condition is true, the program goes back to the top\
    \ of the loop for another go-around. If the condition is false, the computer leaves\
