  md: '# 168 Part II: Writing Own Java Programs


    If you do the arithmetic by hand, the value you get for 9.0 / 5.0 * 21 + 32.0
    is exactly 69.8. So run the code in Listing 8-5 and give celsius the value 21.
    You should get true when you display the value of fahrenheit == 69.8, right?


    Well, take a look at the run in Listing 8-12. When the computer evaluates fahrenheit
    == 69.8, the value turns out to be false, not true. What''s going on there?


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_183_0.png)


    Grouping separators vary from one country to another. The run shown in Figure
    8-12 works almost everywhere in the world. But if the Celsius temperature is twenty-one-and-a-half
    degrees, you type 21.5 (with a dot) in countries and 21,5 (with a comma) in others.
    Your computer''s hardware doesn''t have a built-in "country-meter"; when you install
    the computer''s operating system, you tell it what country you live in. Java programs
    access this information and use it to customize the way the nextDouble method
    works.


    A little detective can go a long way. So view the results:


    +   * Fact: The value of fahrenheit should be exactly 69.8.

    * Fact: If fahrenheit is 69.8, then fahrenheit == 69.8 is true.

    * Fact: In Figure 8-12, the computer displays the word false. So the expression
    fahrenheit == 69.8 is not.


    How do you reconcile these facts? Can there be little doubt that fahrenheit ==
    69.8 is false, so what does that say about the value of fahrenheit? Nowhere in
    Listing 8-5 is the value of fahrenheit displayed. Could that be the problem?


    At this point, use a popular programmer''s trick. Add some statements to display
    the value of fahrenheit.


    ```

    fahrenheit = 9.0 / 5.0 * celsius + 32.0;

    System.out.print("fahrenheit: "); //Added

    System.out.println(fahrenheit); //Added

    ```'
