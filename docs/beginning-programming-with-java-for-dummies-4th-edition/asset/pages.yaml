    # Some questions and object-oriented programming FAQ


    Here''s the world''s briefest object-oriented programming FAQ:


    +   - Can I have an object without a class?

    No, you can. In Java, every object is an instance of a class.


    +   - Can I have a class without having an object?

    Yes, you can. In fact, almost every program in this book creates a class without
    an object. Listing 17-5, for example the code in Listing 17-5 defines a class
    named ProcessPurchases. And nowhere in Listing 17-5 (or anywhere else) do I create
    an instance of the ProcessPurchases I have a class with no objects. That''s just
    fine. It''s business as usual.


    +   - After I''ve created a class and an instance, can I add more instances to
    the class?

    Yes, you can. In Listing 17-5, I create one instance, then another, and a third.
    If I went one time around the for loop I''d have a fourth instance, and I''d put
    a fourth row in the table of Figure 17-8. With no objects, three objects, four
    objects, or more objects, I still have the same Purchase class.


    +   - Can an object come from more than one class?

    ite your tongue! Maybe other object-oriented languages allow this nasty class
    cross-breeding, but in Java, it''s strictly forbidden. That''s one of things that
    distinguishes Java from some of the languages that preceded it. Java is cleaner,
    more uniform, and easier to understand.'
