    # Installing e(fx)eclipse


    Eclipse has its own elaborate facility for incorporating new functionality. An
    Eclipse tool is called an Eclipse plug-in. When you first install Eclipse, you
    get many-plugins by default. Then, to enhance Eclipse''s power, you can install
    many additional-plugins.


    Eclipse''s e(fx)eclipse plug-in facilitates the creation of JavaFX applications.
    You can add the plug-in to your existing installation of Eclipse, but it''s simpler
    to download a new copy of Eclipse e(fx)eclipse already installed. Here''s how
    you get the new copy of Eclipse:


    +   1. Visit eclipse.bestsolution.at.


    +   2. Look for the page containing All-In downloads.


    +   3. On the All-In downloads page, look for a way to download a copy of Eclipse
    for your operating system.


    Your Eclipse''s word length (32-bit or 64-bit) must match your Java version''s
    word length. For the full lowdown on 32-bit and 64-bit word lengths, see Chapter
    2.


    +   4. Follow the appropriate links or click to begin the download.


    +   5. Follow the instructions in Chapter 2 to install this new copy of Eclipse
    on your computer.


    Place the new copy of Eclipse in a brand-new folder. Then, you don''t have to
    uninstall your old copy of Eclipse (In fact, it''s helpful to have separate Eclipse
    installations on your computer). On Windows computer, I have a c:\eclipse folder
    and a c:\EclipseFX folder. Both folders have their own subfolders with names configuration,
    features, and plugins. Both folders have their own eclipse.exe file. Similarly,
    my Mac has both eclipse and e(fx)eclipse folders inside the Applications folder.


