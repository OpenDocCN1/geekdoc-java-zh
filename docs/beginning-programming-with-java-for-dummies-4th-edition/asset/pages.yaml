  md: '# Part IV: Using Program Units


    A run of the code in Listing 18-2 is shown in Figure 18-2. The code stores Barry
    A. Burd in a variable called fullName and displays the fullName variable''s content
    as part of the output. To make this program work, you have to store Barry A. Burd
    somewhere. After all, the program follows a certain outline:


    ```

    Get a name.

    Get some other stuff.

    Compute the total.

    Display the name (along with some other stuff).

    ```


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_365_0.png)


    If you don''t have the program store the name somewhere, by the time it''s getting
    other stuff and computing the total, it forgets the name (so the program can''t
    display the name).


    # Reading and writing strings


    To read a String value from the keyboard, you can call either next or nextLine:


    +   The method next reads up to the next blank space.

    For example, with input Barry A. Burd, the statements

    ```java

    firstName = keyboard.next();

    middleInit = keyboard.next();

    lastName = keyboard.next();

    ```


    assign Barry to firstName.A. to middleInit, and Burd to lastName.


    +   The method next reads up to the end of the current line.

    For example, with input Barry A. Burd, the statement

    ```java

    fullName = keyboard.nextLine();

    ```


    assigns Barry A. Burd to the variable fullName. (Hey, being an author has hidden
    perks.)'
