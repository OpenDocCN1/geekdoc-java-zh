    # Creating New Values by Applying Operators


    What could be more comfortable than your old friend, the plus sign? It was the
    first thing you learned about elementary school math. Almost everybody knows how
    to add two and two. In fact, in English usage, adding two is a metaphor for something
    that''s easy to do. Whenever you use a plus sign, one of your brain cells says
    "Thank goodness, it could be much more complicated."


    So Java has a plus sign. You can use the plus sign to add two numbers:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    ```


    Of course, the old minus sign is available, and a forward slash for division:


    ```

    apples = fruit - oranges;

    ```


    Use an asterisk for multiplication and withholding:


    ```

    double rate, pay, withholding;

    int hours;


    rate = 6.25;

    hours = 35;

    pay = rate * hours;

    withholding = pay / 3.0;

    ```


    When you add an int value by another int value, you get an int value. The computer
    doesn''t round. Instead, the computer chops off any remainder. If you put System.out.println(11
    / 4) in your program, the computer prints 2, not 2.75. If you need a decimal answer,
    make either (or both) the'
