    \n\n```\n\nAt the core of Listing 12-1 is a thing called a while statement (also\
    \ known as a loop). A while statement has the following form:\n\n```\nwhile (Condition)\
    \ {\n  Statements\n}\n```\n\nRephrased in English, the while statement in Listing\
    \ 12-1 would be\n\n```\nwhile the sum of the two dice isn't 7 and isn't 11\nkeep\
    \ doing all the stuff in curly braces: {\n\n```\n\n\nThe stuff in curly braces\
    \ (the stuff that's repeated over and) is the code that gets two new numbers and\
