  md: '# 170 Part II: Writing Own Java Programs


    # Automated debugging


    If your program is not working correctly, you can try something called a debugger.
    A debugger automatically makes invisible print and println to your suspicious
    code. In fact, debuggers have all kinds of features to help you diagnose problems.
    For example, a debugger can pause a run of your program and accept special commands
    to display variables values. With some debuggers, you can pause a run and change
    a variable''s value (just to see if things go better when you do).


    An Eclipse perspective is a collection of views to help you with a certain aspect
    of program development. By default, Eclipse starts in the Java perspective — the
    arrangement of views to help you create programs. Another perspective — the Debug
    perspective — helps you diagnose errors in your.


    In this book, I don''t promote the use of an automated debugger. But for any programming
    project, automated debugging is an essential tool. If you plan to write bigger
    and better programs, please use Eclipse''s Debug perspective a try. For a small
    sample of the Debug perspective''s capabilities, do the following:


    +   1. In the editor (where you see your code) double-click in the margin to the
    left of a line of code.


    A little blue dot appears in the margin (see first figure). This indicates a breakpoint
    in the code. In the steps that follow, you''ll make the run of the program at
    this breakpoint. In fact, I click the last line of code from Listing 8-5.


    ```

    14 System.out.print("Room temperature?");

    15 System.out.println(fahrenheit == 69.8);

    17 }

    18

