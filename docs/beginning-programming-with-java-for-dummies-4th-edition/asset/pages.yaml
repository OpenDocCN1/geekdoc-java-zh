  md: '# 64 Part I: Getting Started with Java Programming


    # ## Do I see formatting in my Java program?


    When you use Eclipse''s editor to write a Java program, you see words in various
    colors. Certain words are always blue. Other words are always black. You even
    see bold and italic phrases. But you don''t. Now, what you see is syntax coloring
    or syntax highlighting.


    program file. Instead, the editor displays each word in a way that makes the Java
    program easy to read.


    For example, in a Java program, certain words (like class, public, and void) have
    their own special meanings. So Eclipse''s editor displays class, public, and in
    bold, reddish colors. When I save my Java program file, the computer stores nothing
    about bold, colored letters in my Java program file. But the editor uses its discretion
    to highlight special words with red-coloring.


    No matter what you call it, the issue is as follows:


    +   - With Microsoft Word, things like formatting are marked inside a document.
    When you save myPersonalDiary.docx, the instructions to make the words "love"
    and "hate" are bold recorded inside myPersonalDiary.docx file.


    +   - With a Java program, things like formatting and coloring are not marked
    inside the Java


    Some other editors may display the words in a blue font. Another editor (like
    Windows Notepad) displays all words in plain old black.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_79_0.png)


    Java is case-sensitive, which means that system.out.println isn''t the same as
    System.out.println. If OuType system.out.println, your program won''t work. Be
    sure to capitalize your code in Listing 3-1.


    If you copy and paste code from an ebook, check to make sure that the quotation
    marks in the code are straight quotation marks (""), not curly quotation marks
    (""). In a Java program, straight quotation marks are good; curly quotation marks
    are troublesome.


    If you typed everything, you see the stuff in Figure 3-11.


    Figure 3-11: A Java program in the Eclipse editor.


    ```

    MyFirstClass.java

    1 public class MyFirstClass {

    2

    3 @param args

    4

    5 public static void main(String[] args) {

    6 system.out.println("chocolate, reptiles, sleep");

    7}

    8}

    9

    10

    11

    ```'
