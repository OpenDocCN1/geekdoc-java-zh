  md: '# What is bytecode, anyway?


    Look at Listing 1-1 and the listing''s translation into bytecode in Figure 1-1.
    You may be tempted to think that a bytecode file is just a cryptogram — substituting
    zeros for ones the letters in boxes, like if and else. But it doesn''t work that
    way at all. In fact, the most important part of a bytecode file is the encoding
    of a program''s logic.


    The zeros and ones in Figure 1-1 describe the flow of data from one part of your
    computer to another. Illustrate this figure in the following figure. Remember,
    this figure is an illustration. Your computer doesn''t look at this particular
    figure, or at anything like it. Instead, your computer reads a bunch of zeros
    and ones to decide what to do next.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_31_0.png)


    Dont bother to absorb the details in my attempt at graphical representation in
    figure. It''s not worth your time. The thing you should glean from my mix of text,
    boxes, and arrows is that bytecode (the stuff in a .class file) contains a complete
    description of the operations that the computer is to perform. When you write
    a


    computer program, your source code describes an overall strategy — a big picture.
    The compiled bytecode turns the overall strategy into hundreds of tiny, step-by-step
    details. When the computer “runs your program,” the computer examines this bytecode
    and carries out each of the little step-by-step details.'
