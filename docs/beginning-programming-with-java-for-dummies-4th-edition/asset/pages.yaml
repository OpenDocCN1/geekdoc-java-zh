  md: '# Chapter 8


    # # Numbers? Who Needs Numbers?


    **In This Chapter**


    +   - Working with characters

    - Dealing with “true” or “false” values

    - Rounding out your knowledge of Java’s primitive types


    I don''t particularly like machines. They''re so inefficient. Send a short fax,
    and what do you have? You have two slices of a tree — one at the sending end,
    and another at the receiving end. You also have millions of dots — dots that scan
    tiny lines across the printed page. The dots distinguish patches of darkness.
    What a waste!


    Compare a fax with an e-mail message. Using email, I can send a 25-word contest
    with 2,500 zeros and ones, and I don''t waste any paper. Best of all, an e-mail
    message doesn''t describe light and dark dots. An e-message contains codes for
    each of the letters — a short sequence of zeros and ones for the letter A, a different
    sequence of zeros and ones for the letter B, and so on. What could be simpler?


    Now imagine sending a one-word fax. The word “true,” which is understood to mean,
    “true,” I accept your offer to write Beginning Programming with Java For Dummies,
    4th Edition. A fax with this message sends a picture of the four letters t-r-u-e,
    with the fuzzy lines where dirt gets on the paper and white dots where the cartridge
    runs short.


    But really, what''s the essence of the “true” message? There are just two possibilities,
    aren''t there? The message could be “true” or “false,” and to represent those
    possibilities, I need very little fanfare. How about 0 for “false” and 1 for “true”?


    > They ask, “Do you accept our offer to write Beginning Programming with Java
    For Dummies, 4th Edition”


    “1,” I reply.


    Too bad I didn''t think of that few months ago. Anyway, this chapter deals with
    letters, truth, falsehood, and other such things.'
