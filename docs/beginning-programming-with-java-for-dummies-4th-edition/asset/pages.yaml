    # 315


    # Grabbing input here and there


    Listing 16-2 illustrates some pithy issues surrounding the input of data. For
    one thing, the program gets input from the keyboard and a disk file. (The program
    gets a number from the keyboard and the number of guests in that room occupancy.)
    To make this happen, Listing 16-2 sports two declarations — one to declare keyboard,
    and a second to declare diskScanner.


    the code in Listing 16-2, I go to my old 16-01 project in Eclipse''s Package Explorer.
    I rightclick the occupancy file in 16-01 project and Select Copy from the context
    menu. I right-click the new 16-02 project branch and Select Paste from the context
    menu. As Mac users use control-click instead of right-click.


    Later in the program, we call keyboard.nextInt reads and diskScanner.nextInt reads
    from the file. Within the program, you can read from the keyboard or the disk
    as many times as you want. You can inline the integers — reading once from the
    keyboard, three times from the disk, then twice and so on. All you have to remember
    to use keyboard and use diskScanner whenever you read from the disk.


    In real life, having several copies of a data file can be dangerous. You can modify
    one and then accidentally read out-of-date data from a different copy. You should
    have backup copies, but you should only have one "master" copy — the copy with
    which all programs get the same name.


    Another interesting thing in Listing 16-2 concerns the occupancy file. Many of
    this examples read from an occupancy file, and I use the same data in each of
    the examples (I use the data shown in Figure 16-1). To run an example, I copy
    the occupancy file from one Eclipse to another. Before running


    So in a real-life program, you don''t copy the occupancy file from one project
    to another. What do you do? You put an occupancy file in one place on your hard
    drive and then have each program refer to the file name of the files'' directories.
    For example, if your occupancy file is in the c:\Oct2 directory, you use


    ```

    Scanner diskScanner = new Scanner(File("c:\2\occupancy"));

    ```


    A sidebar in Chapter 13 has more details about filenames and backslashes.


    As you stare the runs in Figure 16-3, it''s important to remember the unusual
    numbering of rooms. Room 3 has two guests because Room 3 is the fourth room in
    the occupancy file of Figure 16-1. That''s because the motel''s rooms are numbered
    0 through 9.


