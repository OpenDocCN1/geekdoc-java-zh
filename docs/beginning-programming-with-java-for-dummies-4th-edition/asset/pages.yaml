    # #ish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you''re probably okay. If all these assumptions are
    incorrect... well, buy the book anyway.


    +   - I assume that you have access to a computer. Here''s good news. You can
    run the code in this book on almost any computer. The only computers you can''t
    use to run this code are ancient that are more than eight years old (give or take
    a few). You can run the latest version of Java on Windows, Macintosh, and Linux
    computers.

    - I assume that you can navigate through your computer''s menus and dialog boxes.
    You don''t have to be a Windows, Linux, or Macintosh power user, but you should
    be able to start a program, find a file, put a file into a certain directory...
    that sort of thing. Most of the time, when you practice the stuff in this book,
