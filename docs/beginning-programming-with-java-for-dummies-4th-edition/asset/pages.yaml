  md: "# Part III: Controlling the Flow\n\n# Troubleshooting problems with disk files\n\
    \nWhen you run the code in Listing 13-2, the computer executes new Scanner (new\
    \ File(`rawData.txt`)). If the Java virtual machine can't find the rawData.txt\
    \ file, you see a message like the one shown in Figure 13-6. This error message\
    \ can be very frustrating. In many cases, you know well that a `rawData.txt` file\
    \ is on your hard drive. But the computer simply can't find it.\n\nFigure 13-6:\
    \ The computer can't find your file.\n\n![](img/3dfa2b9aa99d9382a4f137c07d48246e_279_0.png)\n\
    \nThere's no quickfire way to fix this problem. But you should always check the\
    \ following things first:\n\n+   * Check for a file named `rawData.txt`.\nOpen\
    \ My Computer (on Windows) or Finder (on a Mac) and poke around for a file with\
    \ that name.\nnThe filenames displayed in My Computer and Finder can be misleading.\
    \ You may see the name `rawData.txt`, even though the file's real name is `rawData.txt`.\
    \ To fix this problem once and for all, refer to Chapter 2.\n* Check the spelling\
    \ of the file's name.\n sure that the name in your program is exactly the same\
    \ as the name on your hard drive. One misplaced letter can keep the computer from\
    \ finding a file.\n* If you use Linux (or a flavor of UNIX other than Mac OS),\
    \ check the capitalization of the file's name.\nIn Linux, and in many versions\
    \ of UNIX, the difference between uppercase and lowercase can baffle the computer.\n\
    * Check that the file is in the correct directory.\nSure, you have a file named\
    \ `rawData.txt`. But don't expect your Java program to look in every folder on\
    \ your hard drive to find the file. How do you know which folder should house\
    \ files like `rawData.txt`?\n\n![](img/3dfa2b9aa99d9382a4f137c07d48246e_279_1.png)"
