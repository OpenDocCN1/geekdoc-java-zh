  md: '# # Chapter 13


    # # Piles of Files: Dealing with Information Overload


    **In This Chapter**


    +   - Using data on your hard drive

    - Writing code to access the hard drive

    - Troubleshooting input/output behavior


    Consider these scenarios:


    > > You''re a business owner with hundreds of invoices. To avoid boxes full of
    paper, you store invoice data in a file on your hard drive. You need customized
    code to sort and classify the invoices.

    > You''re an astronomer with data from scans of the night sky. When you''re ready
    to analyze a chunk of data, you load the chunk onto your computer''s hard drive.

    > You''re the author of a popular self-help book. Last year''s craze was the Self
    Mirroring Method. This year''s craze is the Make Your Cake System. You cannot
    modify your manuscript without converting to the publisher''s new specifications.
    You need software to make the task bearable.


    Each situation calls for a new computer program, and on top of all that, each
    program creates a new file containing bright, shiny results.


    In previous chapters, the examples get input from the keyboard and send output
    to the Eclipse Console view. That''s fine for small tasks, but you can''t have
    the computer prompt for each bit of night sky data. For big problems, you need
    lots of data, and the best place to store the data is on a computer''s hard drive.'
