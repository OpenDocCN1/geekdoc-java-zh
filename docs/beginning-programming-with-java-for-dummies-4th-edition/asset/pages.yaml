    \ frozen snack:\n\n+   - Microwave cooking directions:\n Place on microwave-safe\
    \ plate. Microwave on high for 2 minutes. Turn product. Microwave on high for\
    \ 2 more minutes.\n- Conventional oven directions:\n Preheat oven to 350 degrees.\
