  md: "# Chapter 20: Ooey GUI Was a Worm 399\n\nHere's the scoop on the JFrame methods\
    \ in Listing 20-1:\n\n+   - The call `frame.add(label)` plops the label onto the\
    \ frame. The label displays my `androidBook.jpg` picture, so this call makes the\
    \ picture appear on the frame.\n- A call to `frame.setCloseOperation` tells Java\
    \ what to do when you try to close the frame. (In Windows, you click the \"x\"\
    \ in the upper-right corner. On a Mac, the \"x\" in the frame's upper-left corner.)\
    \ For a frame that's part of a larger application, you may want the frame to disappear\
    \ when you click the \"x\", but you probably't want the application to stop running.\n\
    - But in Listing 20-1, the frame is the entire application — the whole enlisted.\
    \ So when you click the \"x\", you want the Java Virtual Machine to shut down.\
    \ To make this happen, you call the `setDefaultCloseOperation` method with parameter\
    \ `JFrame.EXIT_ON_CLOSE`. The alternatives are as follows:\n    - `JFrame.HIDE_ON_CLOSE`:\
    \ The frame disappears, but it still exists in the computer's memory.\n    - `JFrame.DISPOSE_ON_CLOSE`:\
    \ The frame disappears and no longer exists in the computer's memory.\n    - `JFrame.DO_NOTHING_ON_CLOSE`:\
    \ The frame still stands, and does everything before you clicked the \"x\". Nothing\
    \ happens when you click \"x\". So with this `DO_NOTHING_ON_CLOSE` option, you\
    \ can become very confused.\n\n![](img/3dfa2b9aa99d9382a4f137c07d48246e_414_0.png)\n\
    \nIf you don't call `setDefaultCloseOperation`, Java automatically chooses the\
    \ `HIDE_ON_CLOSE` option. When you click the \"x\", the frame disappears, but\
    \ the Java program keeps running. In course, with no visible frame, the running\
    \ of Listing 20-1 doesn't do the much. The only noticeable effect of the run is\
    \ your development environment's behavior. With Eclipse, the square in the Console\
    \ view retains its red color. When you hover over the square, you see the Terminate\
    \ tooltip. So to end the Java program's run (and return the square to washed-out\
    \ reddish-grey hue), simply click this little square.\n\n+   - A frame's pack\
    \ method shrink-wraps the frame around whatever has been added to the frame. Without\
    \ calling pack, the frame can be much bigger or much smaller than is necessary.\n\
    - Unfortunately, the default is to make a frame smaller than necessary. If, in\
    \ Listing 20-1, you forget to call `frame.pack`, you get the tiny frame shown\
    \ in Figure 20-3. Sure, you can enlarge the frame by dragging the frame's edges\
    \ with your mouse. But why should you have to do that? Just call `frame.pack`,\
    \ instead."
