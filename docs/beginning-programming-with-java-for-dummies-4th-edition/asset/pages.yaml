  md: '# 166 Part II: Writing Your Own Java Programs


    Of course, the greater-than-or-equal-to comparison gets you only so far.

    Table 8-1 shows you the operators you can use to compare things with another.


    Table 8-1 Comparison Operators

    | Operator Symbol | Meaning | Example |

    | == | is equal to | yourGuess == winningNumber |

    | != | is not equal to | 5 != numberOfCows |

    | < | is less than | strikes < 3 |

    | > | is greater than | numberOfBoops > 1000 |

    | <= | is less than or equal | numberOfCows + numberOfBulls <= 5 |

    | >= | is greater than equal to | gumballsPerKid >= 10 |


    With the operators in Table 8-1, you can compare both numbers and characters.


    Notice the double sign in the first row of Table 8-1. Don''t try to use a single
    sign to compare two values. The expression yourGuess = winningNumber (with a single
    equal sign) doesn''t compare yourGuess with winningNumber. Instead, yourguess
    = winningNumber changes the value of yourGuess. (It assigns the value of winningNumber
    to the == yourGuess.)


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_181_0.png)


    You can compare other things (besides numbers and characters) with the == and
    ! operators. When you do, you will have to be careful. For more information, see
    Chapter 18.


    # Comparing numbers


    Nothing is humdrum than comparing numbers. "True or false? Five is greater than
    or equal to ten." False. Five is neither greater nor equal to ten. See what I
    mean? Bo-ring.


    Comparing numbers is an open-and-shut case. But unfortunately, when you compare
    decimal numbers, there''s a wrinkle. Take a program for converting from Celsius
    to Fahrenheit. Wait! Don''t take just such program; take the program in Listing
    8-5.'
