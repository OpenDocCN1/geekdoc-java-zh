    # Shedding light on the static darkness


    I love to quote myself. When I quote my own words, I don''t need written permission.
    I don''t have to think about copyright infringement, and I never hear from lawyers.
    Best of all, I can change and distort anything I say. When I paraphrase my own
    ideas, I can''t be misquoted.


    With that in mind, here''s a quote from the previous section:


    > Anything that static belongs to a whole class, not to any particular instance
    of the class.... To call a static method, you use a class''s name along with a
    dot.


    How profound! In Listing 18-6, I introduce a static method named parseInt. Here''s
    the same quotation applied to the static parseInt method:


    > The static parseInt method belongs to the whole Integer class, not to any particular
    instance of the Integer class.... To call the static out method, you use the Integer
    class''s name along with a dot. You write something like Integer.parseInt(reply).


    That''s very nice! How about System.out business that I introduce in Chapter 3?
    Can I apply my quotation to that,


    > The out variable belongs to the whole System class, not to any particular instance
    of the System class.... To refer to the out variable, you use the System''s name
    along with a dot. You write something like System.out.println().


    If you think about what System.out means, then static business makes sense. After
    all, the name System.out refers to the place where a Java program sends text output
    (When you use Eclipse, System.out refers to Eclipse''s Console view). A typical
    program has only one place to send its text output. So a Java program has only
    one variable. No matter how many objects you create — three, ten, or one — you
    have just one out variable. And when you make static, you ensure that the program
    has only one of those things.


    All right, The out variable is static.


    To abbreviate the name of a static variable (or a static method), you don''t abbreviate
    an ordinary import declaration. Instead, you use a static import declaration.
    That''s why, in Chapter 9 and beyond, I use the word static to import the out
    variable:


    ```

    import static java.lang.System.out;

    ```'
