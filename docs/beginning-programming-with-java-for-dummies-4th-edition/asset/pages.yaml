  md: '# Chapter 8: Numbers? Who Needs Numbers?


    decisions. They made some obvious choices, and they also made some unexpected
    choices. No one knows everything about Java''s features, so don''t expect to cram
    all the answers into your head.


    The Java documentation is great, but for every question the documentation answers,
    it ignores three others. So don''t be afraid to tinker. Write lots of short, experimental
    programs. You can''t break the computer, so your inquisitive spirit will always
    pay off.


    Reading and understanding Java''s API documentation is an art, not a science.
    For advice on making the most of these docs, read my article "Making Sense of
    Java''s API Documentation," at http://www.dummies.com/extras/programmingjava.


    # One character only, please


    A char variable stores only one character. If you''re tempted to write the following
    statements


    ```

    char smallLetters = ''barry''; //Don''t do this

    ```


    please resist the temptation. You can''t store more than one letter at a time
    in a char variable, and you can''t put more than one letter between a pair of
    single quotes. If you''re trying to store words or sentences (not just single
    letters), then you need to use something called a String. For a look at String
    type, see Chapter 18.


    # Variables and recycling


    In Listing 8-2, I use smallLetter twice, and I use bigLetter twice. That''s why
    we call these variables. First, the value of smallLetter is R. Later, I vary the
    value of smallLetter so that the value of smallLetter becomes 3.


    When I assign a new value to smallLetter, the old value of smallLetter gets obliterated.
    For example, in Figure 8-4, the second smallLetter assignment puts 3 into smallLetter.
    When the computer executes this second assignment statement, the old value R is
    gone.'
