  md: '# Chapter 1: Getting Started


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_34_0.png)


    Figure 1-5: Two ways to run a computer program.


    Your computer''s hard drive may have files named javac and java (or javac.exe
    and java.exe). A java (or java.exe) file contains the instructions illustrated
    previously in Figure 1-4 — the instructions in the JVM. As a Java programmer,
    you often tell your computer to run a Java program. Your computer fulfills this
    wish by going behind the scenes and running the instructions in the java file.


    # Write once, run anywhere


    Java first hit the tech scene in 1995, the language became popular almost immediately.
    This happened in part because of the JVM. The JVM is like a foreign language interpreter,
    turning bytecode into native language a particular computer understands. So if
