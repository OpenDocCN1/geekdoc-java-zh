  md: "# Part IV: Using Program Units\n\nWhen you type MyFrame extends JFrame, you\
    \ declare that your new MyFrame class has all the methods and other things that\
    \ are built into Java's own JFrame class, and possibly more. For example, a JFrame\
    \ instance has setDefaultCloseOperation, pack, and setVisible methods, so every\
    \ new MyFrame instance has setDefaultCloseOperation, pack, and setVisible methods\
    \ (see Figure 20-6).\n\n```\npublic class MyFrame extends JFrame {\n    MyFrame()\
    \ {\n        \n    }\n}\n```\n\n![](img/3dfa2b9aa99d9382a4f137c07d48246e_419_0.png)\n\
    \nFigure 20-6:\n\n+   A MyFrame\ninstancenhas many methods.\n\n| frame (object)\
    \ |\n| --- |\n| add |\n| pack |\n| setDefaultCloseOperation |\n| setVisible |\n\
    | ...and many more! |\n\nWhen you put the words extends JFrame in your code, you\
    \ get all of the MyFrame methods for free. The MyFrame class's code doesn't need\
    \ declarations for methods, such as setDefaultCloseOperation, pack, and setVisible.\
    \ These declarations are already in the JFrame class in Java's API. The only declarations\
    \ in the MyFrame class's code are for brand-new things that are specific to your\
    \ newly declared MyFrame class. It's as though Listing 20-2 contained the following\
    \ information:\n\n```\npublic class MyFrame is a kind of JFrame {\n    In addition\
    \ what's in JFrame, MyFrame also has\n    a new constructor:\n    public MyFrame()\
    \ {\n        // Etc.\n    }\n}\n```\n\n*}"
