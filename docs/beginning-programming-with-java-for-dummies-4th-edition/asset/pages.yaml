  md: "# Chapter 20: Oooey GUI Was a Worm\n\nIn Listing 20-2, the words new MyFrame()\
    \ get the MyFrame constructor to do its work. and the constructor in Listing 20-2\
    \ does quite a bit of work! The constructor does the stuff that the main method\
    \ does in Listing 20-1.\n\n+   * The constructor creates an ImageIcon containing\
    \ the androidBook.jpg picture.\n* The constructor creates a JLabel object and\
    \ puts the androidBook.jpg on the new label's face.\n* The constructor adds the\
    \ JLabel object.\n\nTime's out added to what? In Listing 20-1, the statement\n\
    frame.add(label);\nadds the JLabel to the frame. But in Listing 20-2, there's\
    \ no frame variable. In Listing 20-2, all you have\nadd(label);\n\nWell, here's\
    \ the good news: Inside a constructor declaration, the object you're constructing\
    \ is a \"given\". You don't name new object in order to refer to it. It's as though\
    \ the constructor's code looks like this:\n\n```\nMyFrame() {\n    ImageIcon icon\
    \ = new ImageIcon(\"androidBook.jpg\");\n    JLabel label = new JLabel(icon);\n\
    \    new_frame_that_is_constructed.add(label);\n    new_frame_that_is_constructed.\n\
    \    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    new_frame_that_is_constructed.pack();\n\
    \    new_frame_that_is_constructed.\n    setVisible(true);\n}\n```\n\nHere's how\
    \ the constructor in Listing 20-2 finishes its work:\n\n+   * The constructor\
    \ adds the JLabel object to the MyFrame object that's being constructed.\n* The\
    \ constructor tells the Java Virtual Machine to shut itself down when you close\
    \ the frame.\n* The constructor shrink-wraps the frame around the image that appears\
    \ on the frame.\n* The constructor makes the frame appear on your screen.\n\n\
    The extends keyword adds a very important idea to Java programming — the notion\
    \ of inheritance. In Listing 20-2, the newly created MyFrame class inherits the\
    \ methods (and other things) are declared in the existing JFrame class. Inheritance\
    \ is a pivotal feature of an object-oriented language."
