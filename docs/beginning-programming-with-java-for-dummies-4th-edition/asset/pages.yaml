    # How the NumberFormat works


    For my current purposes, the code in Listing 18-7 contains three interesting variables:


    +   * The variable total stores a number, such as 21.0.

    * The variable currency stores an object that can mold numbers into U.S. currency
    amounts.

    * The variable niceTotal is set up to store a bunch of characters.


    The currency object has a format method. To get the appropriate bunch of characters
    into the niceTotal variable, you call the currency object''s format method. You
    apply this format method to the variable total.


    # Your country; your currency


    The code in Listing 18-7 works well in the United States. But in another country,
    the currency symbol might not be the dollar sign ($), and you might represent
    twenty with characters other than 20.00.'
