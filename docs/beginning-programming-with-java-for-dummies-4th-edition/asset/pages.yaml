    ```


    precisely, a number is random if the process used to generate the number follows
    the two preceding trends. When they''re being careful, scientists avoid the term
    random number and use the term generated number instead.


    +   - It''s hard to generate random numbers. Computer programs do the best they
    can, but ultimately, today''s programs follow a pattern, and that pattern is isnt
