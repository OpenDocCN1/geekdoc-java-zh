  md: '# 270 Part III: Controlling the Flow


    # Name that file


    What if a file that contains data isn''t in your program''s project folder? If
    that''s the case, when you call File, the file''s name must include folder names.
    For example, in Windows, your TallyComputer.java program might be in c:\Users\UserName\workspace\13-09
    folder, and a file named totals might be in a folder named c:\advertisements.
    (See the following figure.)


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_285_0.png)


    Then, to refer to the totals file, you include the folder name, the filename,
    and (to be on the safe side) the drive letter:


    ```

    Scanner diskScanner = new Scanner

    (new File("c:\advertisements\totals\));

    ```


    Notice that I would look at the sidebar entitled "Escapism" in Chapter 12. The
    string "\totals" with a single backslash for a tab, followed by *totals*. In this
    example, the file''s name is totals, not totals. With a single backslash, the
    name ...advertisements\totals* would not work correctly.


    Inside quotation marks, you use the double backslash to indicate what would usually
    be a single backslash. The string "c:\advertisements\totals" stands for c:\advertisements\totals.
    That''s good because c:\advertisements\totals is the way you normally refer to
    a file in Windows.


    If you want to avoid all this confusion, you use forward slashes to specify each
    file''s location. Windows responds exactly the same way to new File("c:/advertisements/totals").
    And if you use UNIX, Linux, or a Macintosh, the double backslash nonsense doesn''t
    apply to you. Just write


    ```

    Scanner diskScanner =

    new File(

    "/Users/me/advertisements/totals"));

    ```


    or something that reflects your system''s directory structure.'
