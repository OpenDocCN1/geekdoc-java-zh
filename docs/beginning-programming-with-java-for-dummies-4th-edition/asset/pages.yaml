  md: '# Chapter 6: Using the Building Blocks: Variables, Values, and Types


    As the programmer, your job is to combine the prompting and the next-ing. You
    can combine prompting and next-ing in all kinds of ways. Some ways are helpful
    to the user, and some ways aren''t.


    doesn''t wait for the user to type anything. The program races to execute whatever
    statement comes immediately after the print or println.


    +   If you don''t have a call to print or println, the user sees no prompt. A
    blinking cursor sits quietly and waits for the user to type what kind of input
    to. Occasionally that''s okay, but usually it isn''t.


    +   If your prompt displays a misleading message, then you mislead the user. Java
    has no built-in feature that checks the attentarness of a prompt. That''s not
    surprising. Most computer languages have no prompt-checking feature.


    +   If you call print or println, you don''t call a keyboard.next Something thing,
    then the computer


    So be careful with your prompts. Be nice to your user. Remember, you were once
    a humble computer user, too.


    # Variations on a Theme


    In Listing 6-1, it takes two lines to give the variable its first value:


    ```

    double amount;

    amount = 5.95;

    ```


    You can do the same thing with one line:


    ```

    double amount = 5.95;

    ```


    When you do this, you don''t say that you''re "assigning" a value to a variable.
    The line double amount=5.95 is not called an "assignment statement.\ Instead,
    this is called a declaration with an initialization. You''re initializing the
    amount variable. You can do all sorts of things with this-initializations, even
    arithmetic.


    ```

    double gasBill = 174.59;

    double elecBill = 84.21;

    double H2Bill = 22.88;

    double total = gasBill + elecBill + H2Bill;

    ```


    # Moving variables from place to place


    It helps to remember the difference between initializations and assignments. For
    one thing, you can drag a declaration with its initialization outside of a method.'
