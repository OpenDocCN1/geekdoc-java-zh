    Anyway, each row in Figure 18-6 has three items — a value, count, and an equals
    method. Each row of the table contains more than just data. Each row contains
    an equals method, a way of doing something useful with the data. It''s as though
    each object (each instance of the String class) has three features:


    +   - A bunch of characters (the object''s value)

    - A number (the object''s count)

    - A way of being compared with other strings (the object''s equals method)


    That''s the essence of object-oriented programming. Each string has its own copy
    of the equals method. For example, in Listing 18-5, the password string has its
    own equals method. When you call the password string''s equals method and put
    the userInput in parentheses, the method compares the two strings to see if they
