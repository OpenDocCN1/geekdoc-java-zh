    numbers you''re dividing double values. For example, if you put System.

    out.println(11.0 / 4) in your program, the computer divides a double

    value, 11.0, by an int value, 4. Because at least one of the two values is

    double, the computer prints 2.75.


    # Finding a remainder


    There''s a usual arithmetic operator called the remainder operator. The symbol

    of the remainder operator is the percent sign (%). When you put System.

    out.println(11 % 4) in your program, the computer prints 3. It does so

    because 4 goes into 11 who-cares-how-many-times, with a remainder of 3.


    Another name for the remainder operator is the modulus operator.


    The remainder operator turns out to be fairly useful. After all, a remainder is

    the amount you have left over after you divide two numbers. What if you''re

    making change for $138? After dividing 138 by 25, you have 13 cents left over,

    as shown in Figure 7-5.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_155_0.png)


