    Handy as they are, all computers do the same damn thing. They do exactly what
    you tell them to do, and that''s very unfortunate. For example, in 1962, a Mariner
    spacecraft to Venus was destroyed by a missing keystroke in its launch. Why? It
    was destroyed because around the same time, NASA scientists caught an error that
    could have trashed the Mercury space flights. (Yup! These were flights with people
    board!) The error was with a period instead of a comma. (A computer programmer
    wrote DO 10 I=1.10 instead of DO 10 I-1,10.)


    With all due to my buddy RoboJeeves, and his computer cousins are incredibly stupid.
    Sometimes they look as they''re second-guessing us, but actually they''re just
    doing what other humans told them to do. They can toss virtual coins and use elaborate
