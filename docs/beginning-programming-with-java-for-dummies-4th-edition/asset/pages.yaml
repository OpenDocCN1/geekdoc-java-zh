    # Escapism


    In Figure 12-5, you see the numbers 8, then 6 14 (and so on) displayed. I wanted
    these numbers to be right under the heading headings Card and Total, so I used
    a trick to make the lines line up correctly. Normally, I can get vertical columns
    by pressing the tab key, but a computer program creates the nicely-aligned output
    in Figure 12-5. How did I get a computer program to press the tab key?


    In the first statement, the computer displays Card, then jumps to the next tab
    on the screen, and displays Total. In the next three statements, the computer
    displays a card number (like the number 6), then jumps to the next tab (directly
    under the word Total), and displays a total value (like the number 14).


    In Java, there''s a way. You can insert a tab in your output by putting \t inside
    double quote marks.


    The \t combination of characters is an example of an escape sequence. Another
    of Java''s escape sequences, the \n, moves the cursor to a new line. In other
    words, System.out.print("Hello\n") does the same thing as System.out.println("Hello").


    ```

    System.out.println("Card\tTotal");

    ```


    ```

    System.out.print(card);

    System.out.print("t");

    ```


    # Thinking about Loops (Priming)


    I remember when I was a young boy. We lived on Front Street in Philadelphia, near
    where the El train turned onto Kensington Avenue. Come early morning, I''d had
    to go outside and get water from the well. I''d pump several times before any
    water come out. Ma and Pa called "priming the pump."


    These days I don''t prime pumps. I prime while loops. Consider the case of a busy
    network administrator. She needs a program that extracts a username from an e-mail
    address. For example, the program reads


    ```

    John@BurdBrain.com

    ```


    and writes


    John


    How does the program do it? Like other examples in the chapter, this involves
    repetition:


    ```

    Repeatedly do the following:

    Read a character.

    Write the character.

    ```'
