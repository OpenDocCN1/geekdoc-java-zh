  md: '# Chapter 15: The Old Runaround


    Figure 15-1 shows you what you get when you run the program of Listing 15-1:


    +   - The for statement in Listing 15-1 starts by setting the count variable equal
    to 0.

    - The for statement tests to make sure that count is less than 10 (which it certainly
    is).

    - The for statement dives ahead and executes the statements between the braces.
    At this early stage of the game, the computer prints I''ve chewed 0 time(s).

    - The for statement executes count++— that last thing inside the for''s parentheses.
    This last action adds 1 to the value of count.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_302_0.png)


    ```

    <Console> AuntEdnaSettle

    I''ve chewed 2 time(s).

    I''ve chewed 3 time(s).

    I''ve chewed 4 time(s).

    I''ve chewed 5 time(s).

    I''ve chewed 6 time(s).

    I''ve chewed 7 time(s).

    I''ve chewed 8 time(s).

    I''ve chewed 9 time(s).

    10! Hooray!

    I can swallow

    ```


    This ends the first iteration of the for statement in Listing 15-1. Of course,
    this loop has to it than just one iteration:


    +   - With count equal to 1, the for statement checks again to make sure count
    is less than 10. (Yes, 1 is smaller than 10.)

    - Because the test turns out okay, the for statement marches back into the curly
    braced statements and prints I''ve chewed 1 time(s) on the screen.

    - Then the for statement executes that last count++ inside the parentheses. The
    statement adds 1 to the value of count, increasing the value of count.


    And so on. This whole thing keeps being repeated over and again until, after ten
    iterations, the value of count finally reaches 10. When this happens, the check
    for count being less than 10 fails, and the loop''s execution ends.'
