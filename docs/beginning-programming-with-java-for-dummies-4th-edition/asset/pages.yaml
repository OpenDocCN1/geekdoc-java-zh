  md: '# 118 Part II: Writing Your Java Programs


    Sure, your program has something named Main, but does it have anything named main?
    (Yes, I''ve heard of a famous poet e. e. cummings, but who he is E. E. Cummings?)
    The computer does not presume that your word Main means the same thing as the
    expected word name. You need to change back to main. Then everything will be okay.


    But in the meantime (or in the meantime), how does this improper capitalization
    make it pass compile? Why don''t you get error messages when you compile the program?
    And if a capital M doesn''t upset the compiler, why does this capital M mess everything
    up at runtime?


    The answer goes back to the different kinds of words in the Java language. As
    I say in Chapter 4, Java has identifiers and keywords.


    The keywords are cast in stone. If you change class to public to, you get something
    new — something that the computer probably can''t understand. That''s why the
    compiler chokes on improper keyword capitalizations. It''s the compiler''s job
    to make sure that all the keywords are used properly.


    On the other hand, the identifiers can bounce all over the place. Sure, there''s
    an identifier named main, but you can make a new identifier named Main. (You shouldn''t
    do it, though. It''s too confusing to know who Java''s usual meaning for the word
    main.) When the compiler sees a mistyped line, like public static void Main, the
    compiler just assumes that you''re making a brand-new name. So the compiler lets
    you pass. You get no complaints from your old friend, the compiler.


    But then, when you try to run the code, the computer goes ballistic. The Java
    Virtual Machine (JVM) runs your code. (For details, see Chapter 1.) The JVM needs
    to find a path to start executing statements in your code, so the JVM looks for
    a starting point named main, with a small m. If the JVM doesn''t see anything
    named main, the JVM gets upset. "Main not found in class EchoLine." says the JVM.
    So at runtime, the JVM, and not the compiler, gives you an error message.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_133_0.png)


    A better error message would be method not found in class EchoLine, with a lowercase
    m in main. And there, and the people who create the error messages overlook a
    detail or two.


    # What problem? I don''t see a problem


    I end this chapter on an upbeat note by showing you some of the things you can
    change in Listing 5-1 without rocking the boat.'
