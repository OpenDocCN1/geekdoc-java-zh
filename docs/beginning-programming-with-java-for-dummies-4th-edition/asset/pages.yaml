  md: '# Chapter 18: Using Methods and Variables from a Java Class


    So in Listing 18-6, you call the Scanner class''s nextLine, allowing a user to
    enter any characters at all — not just digits. If the user types Not playing,
    don''t give the killjoy chips.


    If the user types some digits, you''re stuck holding these digits in the string
    variable named reply. You can''t add them to a string like reply. So you call
    the Integer class''s parseInt method, which uses your string and handles your
    back a nice int value. From there, you can add it to the int value.


    Java has a foothold that allows you to add a number to a string. The problem is,
    don''t get real addition. Adding the number 10 to the string "30" gives you "3010",
    not 40.


    Don''t confuse Integer with int. In Java, int is the name of a primitive type
    (a type that I use throughout this book). But Integer is the name of a class.
    Java''s Integer class contains many methods for dealing with int values. For example,
    in Listing 18-6, the Integer class''s parseInt method makes an int value from
    a string.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_376_0.png)


