    # Statements and blocks (plagiarizing my own sentences from Chapter 9)


    Java''s while statements have a lot in common with if statements. Like an if statement,
    a while statement is a compound statement that is, it includes other statements
    within it. Also, both if and while statements typically include blocks of statements.
    When you surround a bunch of statements with braces, you''ve called a block, which
    behaves, in all respects, like a single statement.


    ```

    diel=myRandom.nextInt(6)+1;

    die2=myRandom.nextInt(6)+1;


    out.print(diel);

    out.print(" " ");

    out.println(die2);

    ```


    In a typical while statement, you want the computer to repeat several smaller
    statements over and again. To repeat several smaller statements, you combine those
    statements into one big statement. To do this, you make a block using braces.


    is a single statement. It''s seen that, within it five smaller statements. So
    this block (this single statement) serves as one big statement inside the while
    statement in Listing 12-1.


    That''s the story about how while statements and blocks work. Find out how this
    stuff applies to if statements, see the "Statements and blocks" near the end of
    Chapter 9.


