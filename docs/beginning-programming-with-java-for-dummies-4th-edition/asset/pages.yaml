  md: '# 320 Part IV: Using Program Units


    Well, you can write loops of this kind. All you need are some square brackets.
    When you add square brackets to the idea shown in the preceding code, you get
    what''s called an array. An array is a row of values, like the row of rooms in
    a one-floor motel. To picture the array, just the Java Motel:


    +   - First, picture the rooms, lined up next to another.

    - Next, the same rooms with their front walls missing. Inside each room, you can
    see a number of guests.

    - If you, forget that the two guests in Room 9 are putting piles of bills into
    a big fridge. Ignore the fact that the guest in Room 5 hasn''t moved away from
    the TV set in a day and a half. Instead of all these details, just see numbers.
    In each room, a number representing the count of guests in that room. (If freeform
    visualization isn''t your strong point, take a look at Figure 16-6.)


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_335_0.png)


    In the lingo of Java programming, the entire row of rooms is called an array.
    Each room in the array is called a component of the array (also known as an array
    element). Each component has two numbers associated with it:


    +   - Index: In the case of the Java Motel array, the index is the room number
    (a number from 0 to 9).

    - Value: In the Java Motel array, the value is the number of guests in a given
    room (a number stored in a component of the array).'
