    Listing 10-2 has two if statements whose conditions involve characters:


    +   * In the first statement, the computer checks to see whether the variable
    stores the letter Y or the letter y. If either is the case, it subtracts 2 from
    the price. (For information on operators like -= see Chapter 7.)


    +   * The second statement has a hefty condition. The computer tests to see whether
    the variable stores any reasonable value at all. If the reply isn''t Y, and isn''t
    y, and isn''t n, the computer expresses its concern by displaying "Huh?" (As a
    paying customer, the word "Huh?" on the automated ticket seller''s screen will
    get your attention.)


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_216_0.png)


    When you create a multipart condition, you have several ways to think about the
    condition. For example you can rewrite the last condition in Listing 10-2 as if
    (reply == ''Y'' || reply == ''y'' || reply == ''N'' || reply == ''n''). If its
    not the case that the reply is either Y, y, N, or n, then display "Huh?" So which
    of writing the condition is better — the way I do in Listing 10-2, or the way
    I do in this tip? It depends on your taste. Whoever makes the logic easiest for
    you to understand is the better way.


    # Using boolean variables


