    # # Exploring the Parts of a Program


    **In This Chapter**


    +   - Identifying the words in a Java program

    - Using punctuation and indentation

    - Understanding Java statements and methods


    I work in the science building at a liberal arts college. When I walk past the
    biology lab, I always say a word of thanks under my breath. I''m thankful for
    not having to dissect small animals. In my line of work, I dissect computer programs
    instead. Computer programs smell much better than preserved dead animals. Besides,
    when I dissect a program, I''m not reminded of my own mortality.


    In this chapter, I invite you to dissect a program with me. I have a special program,
    named ThingsLike. I cut apart the program and carefully investigate the program''s
    innards. Get your scalp ready. Here we go!


    # # Checking Out Java Code for the First Time


    I have a confession to make. The first time I look at somebody''s computer program,
    I feel a bit uneasy. The realization that I don''t understand something (or many
    things) in the code makes me nervous. I have written hundreds (thousands) of programs,
    but I still feel insecure when I start reading someone''s code.


    The truth is, learning about a computer program is a bootstrapping experience.
    First, I gawked in awe of the program. Then I run the program to see what it does.
    Then I start the program for a while or read someone''s explanation of the program
    and its parts. Then I gaw a little more and run the program again. Eventually,
    I come to terms with the program. Don''t believe the wise guys who say they never
    go through these steps. Even experienced programmers approach a new project slowly
    and carefully.'
