    Being told to "turn when you reach the intersection." The direction may be just
    fine. If you''re suspicious, you ask, "Which way should I turn? Left or right?


    When you''re sure that you know what you''re doing, you can ignore warnings and
    worry about them at some later time. But a warning can be an indicator that something
    more serious is with your code. My sweeping recommendation is this: Pay attention
    to warnings. But, if you can''t figure out why you''re getting a particular warning,
    don''t let it prevent you from moving forward.


