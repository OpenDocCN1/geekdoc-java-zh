  md: '# Chapter 6: Using the Building Blocks: Variables, Values, and Types


    Figure 6-2 gives a before-and-after picture of the code in Listing 6-1. When the
    computer computes amount = 5.95, the variable amount has the number 5.95 in it.
    Then, after the amount = amount + 25.00 statement is executed, the variable amount
    suddenly has 30.95 in it. When you think about a variable, place it in the computer''s
    memory where wires and transistors store 5.95, 30.95, or whatever. In Figure 6-2,
    imagine that each box is surrounded by millions of other boxes.


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_138_0.png)


    **Figure 6-2** A variable (before and after).


    Before executing amount = amount + 25.00; After executing amount = amount + 25.00;


    Now you need some terminology. (You can follow along in Figure 6-3.) The thing
    stored in a variable is called a *value*. A variable''s value can change during
    the run of a program (when SwiftSoft adds the shipping and handling cost, for
    example). The value stored in a variable isn''t necessarily a number. (You can,
    for example, create a variable that always stores a letter.) The kind of value
    stored in a variable is a variable''s *type*. (You can read more about types in
    the rest of this chapter and in the next two chapters as well.)


    ![](img/3dfa2b9aa99d9382a4f137c07d48246e_138_1.png)


    **Figure 6-3:** A variable, its value, and its type.'
