    # Conversion and Convergence: New Voices in Jewish Song


    Anthony Mordechai Zvai Russell is, in his words, “African American by birth, Jewish
    by choice.” Raised in Baptist and Pentecostal (Assemblies of God) traditions,
    Mr Russell converted in 2011, and in the years since he became a Jew, critics
    have already appointed him “the new voice of Yiddish song” (Chensof 2012). Though
    he is quick to dismiss any such titles, his relationship with Yiddish repertoire
    is intense, and it has become central to his identity. For Russell, Yiddish song
    is as much his new voice as he is his new voice.


    His self-description, “African American by birth, Jewish by choice,” emphasizes
    the ways in which his identity complicates reductive understandings of Ashkenazi
    (Eastern European) Jewishness as white, and as an ethnic heritage only genetically
    transmitted. It provokes questions about identity and choice, history, and lived
    experience. “As far as African American culture is concerned,”


    I''m not deciding to be part of it, I opted in just by being born . . . [but]
    it''s really important for me to establish the fact that Judaism is a choice for
    me, is a choice to accept the texts and the experiences that connect me with a
    continuity of the Jewish people.... I chose. Just like I chose these songs to
    represent a part of me. My voice. I chose these songs to be my voice. (interview,
    January 29, 2014)


    The idea of choice has always been important to Jews, the “chosen” people, but
    the 21st century, in its ideal form, has so far been choosing people—people making
    choices. And it''s noteworthy that with the songs, Mr. Russell has chosen as a
    Black man and as an out gay man to take on yet another history, to shoulder the
    additional weight of Jewish suffering. His singing thus illuminates a particular
    position of intersectionality, his voice a multivocal instrument and one of many
    that must daily confront multiple oppressive systems that span the globe, as well
    as the past and present.'
