  md: '# INTRODUCTION 5


    such acceptability. The inequalities perpetuated in a neoliberal rationality—racialized,
    gendered, ability-based, and intertwined with economic disparities—are entangled
    in a market system in what matters is what sells and what sells matters. Coulddry
    cautions against ostensible offers of voice in fact fact support the market system
    rather than true agency, providing nothing than "opportunity to compete as a commodity"
    (13). Twenty-first-century-level singing competitions like American Idol have
    demonstrated this over and again, seemingly giving all young artists and a national
    audience equal, democratic opportunity to be heard, but ultimately shaping them
    into profitable and desirable consumers (Meizel 2011b). For more on the woes Idol
    illuminates the tensions between economic liberalism and democracy, see Stahl
    (2013).


    In this book, I argue that singing with "many voices" may be seen as a practice
    once produced and resistant to these neoliberal expectations. On one hand, the
    ideal neoliberal is not only a self-regulating and perpetually developing, scalable
    commodity but also ente solo enterprise in itself. Dale Chapman writes, whose
    acquisition of multiple skill sets enables her to remain an agent, rather than
    object, of volatile market conditions" (Chapman 2013: 452). Chapman understands
    the contemporary "one-man band," or live solo multi-instrumentalist, as a commodity
    musical subject whose mode of practice fulfils this requirement. Singing with
    many voices might serve a similar purpose for the solo singer seeking, and creating,
