- pgno: 24
  md: 'highlighting the role of borders as sites of struggle where the right to become
    can be expressed, the borderscapes method opens a new space of political possibilities,
    a space within which new kinds of political subjectivities become possible. (29;
    emphasis in original)


    If voice can be a borders, then vocalities offer multiple, often compound paths
    to navigate it. Multivocality explores singing voices as sites of struggle and
    becoming, negotiating material and sonic borders between musical genres, between
    ideologies, cultures. Examining the border experiences of singers, the book aims
    to illuminate the role of voice in multiple types of epistemologies and ontological
    processes.


    It is also crucial to recognize that for many singers, including Ms. Giddens,
    multivality—as the enactment of multiple voices of being—can figure as a sonic
    negotiation of intersectionality, a strategic intervention that supports the political
    use of voice against multiple, intertwined systems of oppression. As I suggested
    earlier in this introduction, multivality can be a form of resistance.


    Recently, some writers on voice have concentrated their work on the relationship
    between singing and listening practices, or in particular, Nina Eidsheim elucidates
    both the act of singing and the act of listening as cultivated, vibratory practices
    (Eidsheim 2015) and highlights the contribution of listening to the collective
    voice (Eidsheim 2019). In this book, though listeners are often present, they
    are largely contextualized in the experience of the singer. While vocal performance
    is a multidirectional experience, the primary goal of this project is to thoroughly
    explore the ways in which singers experience voice in the negotiation of their
    identities. My interest in these experiences stems from part of my own singing
    life, and the ways in which voice and vocality have consistently formed the fulcrum
    of my self-knowledge. I include descriptions of those processes at points throughout
    the book, though my own experience is not the primary; I represent only one in
    a sea of voices, in a multivocal body of narratives about singing. In the process
    of my ethnographic research, I reached out to friends and colleagues alongside
    whom I studied in voice-major years, as well as to singers whom I did not previously
    know, and I encountered consistently the myriad unique stories of voices this
    common association between voice and sense of self.


    Bramilla locates the study of bordersscapes in “the era of globalization and transnational
    flows” and cites its potential contribution “to the understanding of new forms
    of belonging and becoming” (Bramilla 2015: 14). Multivocality attempts a study
    of voices in such a context, located within and without bodies, at once confining
    and liberating.'
