    > —Ovid, Metamorphoses Book III: 339–358


    "I sold my voice," my friend casually told me in 2013, slipping the news into
    the middle of a Facebook chat (personal communication, June 10, 2013). Caught
    in the time lag common to instant-messaging conversations, I was still writing
    about my dog when her comment posted, but I quickly backtracked. "What?" I typed,
    baffled.


    "I sold my voice and now people over the world are random things with it," she
    supplied.


    I wrote, less than articulately, "Wait, what???, what???"

    A successful singer and teacher in California, Nichole Dechaine had signed a contract
    that allowed the use of her voice as the basis of a sampling library called Voices
    of Rapture. The software, by Soundirian, provides building blocks of vocal composers,
    so Dr. Dechaine spent three long days in a Bay Area range, recording studio improvising,
    working through twelve keys and her entire range, producing sets of single pitches
    on vowels, melodic phrases without text, and phrases spoken or in English, Latin,
    and French. She sang hours at a time, pianissimo and forte, with without vibrato,
    legato intervals from step to octave, chromatic and whole-tone scales. Now, anyone
    with $19 to spare can borrow her acoustic voice from the library—a body detached
    from her performing body—and 17,310 samples to produce music that has never actually
    issued from her throat.


    Her experience is that of a quintessential 21st-century neoliberal subject—a subject
    Türken et al. explain as an "entrepreneur of herself" (Türken et al. 2016: 34;
    my emphasis). As noted in chapter 1, the neoliberal subject is “incredibly constructed
    as a free, autonomous, self-regulating actor understood as a source of capital;
    human capital” (34) and as such is expected to practice continuous self-development,
    “to act to increase her value" (34). I argued in chapter 1 knowledge of classical
    singing and the ability to switch vocals are both understood as paths to continuous
    development, and to marketability. Though her singing for Soundirian did not venture
    outside'
