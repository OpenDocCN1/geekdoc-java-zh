  md: '# INTRODUCTION 19


    vocal technique and personal emotion—embodied practice—that shapes it

    (Chana 2013).


    Chana is part of the rising tide of scholarship in ethnomusicological voice

    studies, a field described by Eidsheim and Meisel—“work concerned with the

    material, sonorous and sensory voice as it is made and imagined in human life"\(Eidsheim
    and Meisel 2019). It is a transdisciplinary area of research stretching

    across the performing arts, humanities, and social sciences, and across med-

    cicine, physics, and the study of technology. Scholars in voice

    studies tend to rely upon multiple approaches from these areas in pursuit of

    a more holistic view of voice in the world. That said, there is no uni-

    way of doing voice studies, of asking or answering the floods of questions

    raised when we wonder what voice is. Contradictions abound—“The voice is

    both materially grounded and ideologically enacted. It is a sounded phenomenon—.silently
    inscribed”(Eidsheim and Meisel 2019)—and to add them,

    voice scholarship must employ and celebrate a multiplicity of approaches. In

    Multivality, I have applied methodologies rooted in ethnomusicology, lit-

    erary studies, media studies, identity studies, disability studies, and, at times,

    voice science.


    In the ethnographic study of singing, ethnomusicologists must apostle to

    the same kind of rigorous reflection as we undertake in other specializations.

    Though we vividly advocate the integration of emic terminologies in other

    music culture, when it comes to vocal sounds we to fall back on the vo-

    cabulary of western classical singing. That reflex, without reflexivity or critical

    consideration of the discourse, can cause us to overlook the nuanced meanings

    of voice in culture-specific contexts. Furthermore, much of the western clas-

    vocal voice lacks any standardized meaning or correlation to productive

    processes—for example, register terminology such as “head voice” and “chest

    voice” yields a stunning variety of definitions among practitioners, or may

    de denied entirely by some western classical singers and researchers. Other

