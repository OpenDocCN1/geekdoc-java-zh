  md: '# MULTIVOCALITY


    vocolinguistic border crossing. (Rampton cites Bakhtin''s double-voicedness as
    a parallel. Young draws on W. E. B. Du Bois''s concept of double consciousness
    [Du Bois 1903$^{11}$].


    Multivocality, in this book, constitutes border crossings within the context of
    singing. Mult singers are those who must continuously identify and cross borders
    in their everyday lives—singers of color, singers who are immigrants, or singers
    navigating gender, ethnic, even religious boundaries. But even singers fitting
    a hegemonic profile must confront, although certainly with less at the stake,
    vocal borders of identity.


    # Navigating Borderscape Through Multivocality


    Martha Feldman observes that voices tend to exist "the interstices of encounters,
    the spaces of transition, the spaces in between" (Feldman 2015: 658). At once
    delineating and mitigating the internal-external borders of the body as it sounds,
    and working similarly across the geographical and ideological borders of cultural
    spaces, voices make exquisitely instruments of de-bordering and re-bordering,
    of border-dwelling and border-crossing. They do not merely exist in existential
    spaces; they help to create, re-create, and reshape the spaces in which they resonate—intertwined
    with the construction of bodies, identities, relationships. And the need to voice
    border experiences can generate singers. Living in "a state of psychic unrest"$^{12}$
    Gloria Anzáldúa wrote, "what makes poets write and artists create" (Anzáldúa 1987:
    73). Of her own creativity, translating from Nahuatl in Cantares Mexicanos, she
    continued:


    +   My flowers shall not cause to live;

    My songs shall never end;

    i, a, intend them;

    They became scattered, they are spread out. (73)


