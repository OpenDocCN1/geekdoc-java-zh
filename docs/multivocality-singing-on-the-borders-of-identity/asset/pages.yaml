    as a technology of such self-development, and that both knowledge of classical
    singing and the ability to switch vocalities are seen as paths to authentic selfhood
    and vocal well-being, and therefore to marketability.


    The concept of finding one''s voice, "recognizing one''s individuality and self-worth,
    is at this point so deeply embedded in U.S. culture that it seems timeless, without
    history. But today individuality is a key element in the foundational mythologies
    of Americanness, and the equation of voice with agency is in itself not new, the
    explicit articulation of the metaphor may be traced to certain trends in writing
    analysis and pedagogy, and the pivotal movements that shaped the nation''s social,
    economic, political, philosophical, and cultural climate in the late 20th and
    early 21st centuries. It is only a short distance between a narrative concept
    of voice (as an author''s voice) and an agentive one (as a voice of author one''s
    own life); both developments have dialectically contributed to the discourse of
    "finding a voice."


    The 1970s social movements—including second-wave feminism—inspired by the struggle
    for African civil rights in the 1960s were largely driven through the rhetoric
    of "gaining a [sociopolitical] voice" (Bauman 2008a: 3). Examining the view of
    textbooks of this time, Darcy Bowen (1995) pinpoints Donald Stewart''s *The Authentic
    Voice* as a seminal document. Stewart argued students: "Your authentic voice is
    that voice which sets you apart from every living being despite the common or
    shared experiences you have with many others" (Stewart 1972: 2, cited in Bowen
    1995: 175). Other "voicist" (Bowen: 1995: 18) scholars interested by meaning view
    of language and voice, where "all discourse is inhibited by meaning from other
    contexts and uses" (186). In their 1997 analysis Femininity and Shame: Women,
    Men, and Giving Voice to the Feminine, Barbara L. Eurich-Rascoe and Hendrika Vande
    Kemp offer a (third-wave) feminist perspective, defining literary voice as "self-declaration
    in an interpersonal context that has the primary goal of maintaining interpersonal
    connection" (Rascoe and Vande Kemp 1997: 7; emphasis in original). These are formulations
    that help my understanding of multivocality in the process of negotiating a personal
    identity through a network of vocal interubjectivities.


    By the late 1980s, when neoliberalism secured a firm political and cultural foothold,
    journalists were asking writers and performing artists the question "When did
    you find your voice?", as in a 1989 Interview with Ann Landers (Taylor 1989) and
    a 1990 interview in *Guitar Player* with the Kinks'' Dave Davies (Resnicoff 1990).
