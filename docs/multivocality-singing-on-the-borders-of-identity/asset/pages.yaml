    nThe Journey

    Voice and Identity in Gender Transition


    “It’s not worth the sacrifice,”

    you’ve heard that line a thousand times.


    —Joshua Klipp, “Little Girl”


    In Hans Christian Andersen’s enduring 1837 tale “The Little Mermaid,” a voice
    is famously sacrificed for the acquisition of an immortal soul. The protagonist
    is told that as a mermaid, she cannot live for eternity in heaven; but if a human
    man were to love her enough, he would marry her, impart his soul to her, and thus
    grant her immortality. To accomplish this, the little mermaid, has “loeliest voice
    of all, in the sea or on the land” (Andersen 1983[1837]: n.p.), becomes human
    through a set of painful and permanent bodily changes from a sea-witch, paid with
    her voice. The sea-witch warns her that if the prince marries another, the mermaid
    will become nothing but foam on the ocean. “I shall take that risk,” the mermaid
    answers. The story ends in hopeless tragedy, but by the last moment the mermaid
    is swept away by “daughters of the air” for a chance to earn a soul—this, instead
    of marriage, through three hundred years of good deeds. She has a newly transparent
    body, and a new voice—one “spiritual [in Danish aandigt, the adjectival form of
    *spirit*] that no music on earth could ever match” (Andersen 1983[1837]: n.p.).nA
    final moral statement ensures listening to be good, lest their misbehavior afford
    the mermaid’s three hundred years.


    Andersen writes the mermaid’s happy ending as a kind of literary ghostdom, her
    voice a to haunt children’s moral consciousness, her new theology not an arrival
    but a long journey of becoming. A *transparent* body, being is *gennemsigtig*
    in Danish, see–through–the world around her is through her body and she must see
    the journey through. In the English language, the Latin prefix *trans-* is also,
    of course, to mean “across,” and *parent*, from *parere* (“appearing”) so that
    in translation the mermaid might also be *crossing appearances*. She is still
    one herself, and her voice will now sound in freer ways along her transformative
    journey.


    Multivocity. Katherine Meisel, Oxford University Press (2020). © Oxford University
    Press.

