  md: '# 50 MULTIVOCALITY


    Among many markers of the component genres and styles, popera singers and their
    audiences especially rely on the connotations of vocality, and they manipulate
    to acknowledge and blur the imagined borders associated with related musical epistemologies.


    This chapter examines how popera singers have negotiated intertwined social and
    aesthetic discourses through this multivocal work. Like much of mass-mediated
    culture in the 21st century, popera is a global phenomenon, sounding within local
    contexts. Among its roots are intertwined the geopolitics of European song competitions
    and the difficult politics of race and immigration which have shaped American
    popular singers since the 19th century. Because of the breadth and extensive timeline
    of vocal crossover, I have chosen to narrow my focus; this chapter is concerned
    with the primacy of male singers—children’s voices have contributed vitally to
    popera, particularly in the iconic tenor category. Tenors constitute an exceptionally
    operatic area of study; in range, audience, practices, and cultural context, they
    provide a rich nexus where the heroic idol of 19th-century opera meets the pop
    idol of the 20th and early 21st centuries.


    Classical crossover, as a product of the neoliberal music industry, demonstrates
    Coldplay’s “crisis of voice” (Couldry 2014: 1–2), offering a panorama of often-marginalized
    vocities which simultaneously maintaining the classed, racial, and gendered structures
    of power that have long marginalized voices from being heard. Importantly, though,
    some of marginalized voices have chosen to capitalize on the borderland status
    of crossover to find a marketable artistic niche, and to resist the silencing
    force of market-centered art. In this chapter, I investigate popera as a space
    in which popular music is colonized at once by the voices and bodies that dominate
    conventional operatic spaces and the voices barred from operatic spaces which
    create their own (see figure 2.1).


    # Defining Popera


    The term “popera,” of course, implies an elision or a hybrid form, and though
    it can be difficult to separate what is “pop” about it and what is “operatic,”
    popera juxtaposes elements of distinct vocalities as genre generators. A significant
    history is at work here, of course, the codifying of opera as something other
    than popular-is a relatively recent plot development, with the genre removed deliberately
    from its early duality as part of both public and elite life sometime between
    the 1860s and the 1930s, depending on which historians you follow. Opera, as John
    Storey writes, “did not become unpopular, rather it was made unpopular” (Storey
    2002: 37).'
