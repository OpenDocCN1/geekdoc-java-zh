    Stephen Foster’s “Old Folks at Home” in 1905). Operatic singing had a place in
    the earliest American-grown forms of popular culture, particularly the minstrel
    show, as well as in the vaudeville formats that followed. In both contexts, the
    imagination of race through vocal expression played a significant role.


