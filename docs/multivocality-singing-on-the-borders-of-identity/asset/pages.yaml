    my vocal voice, my poet’s voice. I will overcome the tradition of silence” (Anzldúa
    1999:81). The landscapes of Anzldúa’s voice is sounded in many ways, within and
    across boundaries of identity and of place. The silence she will overcome an externally
    imposed internalized silencing of self—the space to sound all aspects of identity,
