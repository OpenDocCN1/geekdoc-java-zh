    # Mandy Harvey


    In 2006, Ms. Harvey had begun college studying vocal music education; then, after
    a lifetime of recurrent hearing difficulties, she became profoundly deaf. She
    left school and her career plans began in 2007, she stopped singing for a year
    (Harris 2012), until the process of making a home recording with her father inspired
    her to music.


    With that return, Ms. Harvey had to make adjustments to her musical practices.
    Removing shoes onstage, she can feel the vibrations of instruments through the
    floor. She gathers a great deal of information through this technique, including
    the pulse and the progress of the music¹⁰—“the differences between which instrument
    is playing, based off how it feels and where the feeling is coming from”(personal
    communication, August 28, 2013). The importance of this practice in her singing
    journey is made clear in the title of her autobiography: Sing the Rhythm: Finding
    My Voice in a World Without Sound (Harvey and Atteberty 2017).


    She has also upon the foundation of her preexisting talents. Her absolute pitch
    permits her to learn new repertoire directly from sheet music without the assistance
    of recordings, and once she has established middle C with the help of a tuner
    or an available human ear, she can be certain of any other pitches. Learning by
    sight has its benefits, she says. She can’t rely on listening to others’ interpretations
    now, she is able to focus on cultivating her own. But the process of learning
    has changed in frustrating ways, too; formerly she was able to memorize a song
    after hearing one. “Now if I not paying attention I can forget the whole thing”(personal
    communication, August 28, 2013).


