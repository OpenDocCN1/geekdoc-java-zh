    In this chapter, I suggest that control is where the material voice (physological
    and acoustic) and the metaphorical voice (embodying agency) intersect in the experiences
    of singers, and the crossing of the borders creates sites of instability where
    control is particularly challenged. I have learned that in many lives, voice and
    agency are so tightly intertwined that a break in one may be felt as a break in
    the other. Those who experience trauma or intensive impact on their sense of identity
    may find themselves unable to sing; and in a voice cycle, those who depend cannot
    sing may feel a loss of self. The singing voice, for those who depend upon it,
    serves as an ontological and epistemological crucible. As such, singing is often
    thought to communicate more fully authentic speech than speech, and to forge more
    intimate relationships with others. So, when a voice escapes control, the failure
    can become catastrophically total.


    The chapter also juxtaposes the ideas of ability and disability perceive western
    understandings of music, and intersect in the borderscape of voice. Western classical
    and capitalist frameworks—and the popular—music discourses they have impacted—position
    musical ability as real and valuable, extraordinary. It is something not required,
    expected, and that is cultivated in places and in ways that exclude. Vocal ability,
    given its own distinct character, is simultaneously understood as universal (“everyone
    can sing”) and exceptional (only a few are marketable). Disability is perceived
    as simultaneously universal and exceptional—something that happens to everyone,
    especially if the individual is fortunate enough to survive to old age, but at
    the same time pushed aside, along with the people who experience it, in the margins.
    Thus ability and disability are both, in overlapping and discrete ways, stories
    about people seen as exceptional, who may or not be allowed a place in the space
