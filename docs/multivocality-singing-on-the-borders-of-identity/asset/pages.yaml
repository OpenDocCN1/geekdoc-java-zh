    with bitter humor his heartbreak, left him waking each morning in tears, and writing
    letters to my friends during the summer about how my own body was cutting off
    from my destiny” (Derfner 2009: 139). Reading this, I felt a pang of experiential
    (and vocal) resonance. “It made me feel shackled,” he told me, when I asked him
    about it.


    Before, I could do anything—I couldn''t do anything, I had a lot of limitations
    as a singer—but… the vessel was, it was clear… and then it started to get hunk
    in it… and trapped is not the right word, but shackled I think maybe is the right
    word. (interview, June 7, 2014)


    He apologized for his poetic words, before adding, poetically, “it’s like, you
    know, how your wings clipped. I am now very happy with the life I created with
    my clipped wings.” However, he reflected, that his life now is better than it
    would have been with unclipped wings, “having wings was nice. Nice is a gross
    understatement. Glorious!” (interview, June 7, 2014). In chapter 6, I quote Mr.
    Derfner describing the ecstatic sensations he experienced while singing, before
