    Vox Populi, Vox Divo


    # Voicing Genre Politics in Classical Crossover


    That''s why I''m going to

    Sing in op’ra, sing in op’ra,

    Sing in op-pop-pop-pop-pop-popera.

    —Aldous Huxley, Crome Yellow (1921)


    Four young singers with matinee-idol features stole onto the stage at the Fox
    Theater in Detroit, met by an explosion of flashbulbs and Beatle-maniacal screaming.
    But in spite of these pop trappings, and though they blew out a string of ''90s
    hits from Mariah Carey and Toni Braxton, this is no boy band. Instead, the group,
    Il Divo, is known as a pop quartet—a portmanteau ensemble for the portmanteau
    culture of the 21st century—comprising two operatic tenors and a baritone, and
    a French pop star who is strikingly branded in the international press as “vox
    populi.” The smoothing over the internal division between opera and pop—what is
    being crossed in Billboard’s “classical crossover” charts—reflects more than the
    transgression of genre boundaries. As I began this, I envisioned finding intersecting
    ideologies of genre and class, and I have encountered some; however, it became
    clear that there is more at stake. The genre-border of popera offers a stage of
    interlaced ideological lines to cross: lines from old dialogues about class, culture,
    industry pickup lines to woo female consumers, and the gender and color lines
    woven through the tapestry of popular music history.


    “Popera” is a neology over the past decade and a half has grown into an umbrella
    category applied by music critics to a number of international, genre-bending
    contexts, old and new—the Three Tenors, the Irish Tenors, the American Tenors,
    the Twelve Irish Tenors (a record of numbers!), Il Divo, and quartets like Spain’s
    Lírica Pópera (one of rare examples in which the term “popera” has been willingly
    applied by the singers; the other is the Bulgarian singer Krasimir Avramov)—as
    well as Il Divo. It is a voice-centric branch under the music industry’s umbrella
    category of classical crossover, which has encompassed myriad ways (instrumental
    and vocal) of combining classical and popular musics.


    Multivoality. Katherine Meizel, Oxford University Press (2020). © Oxford University
