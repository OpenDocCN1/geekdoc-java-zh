- pgno: 11
  md: '# MULTIVOCALITY


    neoliberal doctrine, in its market-centered framework rhetorically offers voice—in
    the sense of political, economic, and cultural agency—but in reality does not
    bestow it (2) and, in fact, works against the full practice of democracy. Neoliberalism,
    as its core revival of nineteenth-century free trade, has assigned many definitions
    in the contexts of ideology, discourse, political economy, and governance; For
    geographer anthropologist David Harvey, it is a political-economic theory that
    holds up “the maximization of entrepreneurial freedoms” as the ultimate vehicle
    for human well-being (Harvey 2007: 22) and impacts all aspects of society. In
    the 1980s for its potential to restore global capital accumulation after the recession
    and discontent of the 1970s, neoliberalism argues for institutional decentralization,
    privatization, and the individualization of entrepreneurship and consumerism.
    As, Luigi Esposito and Lauren Finley term it, the “dominant political-economic
    paradigm of our time” (Esposito and Finley 2014: 76). And Harvey remarks that
    it has globally normalized partly because its rhetoric positions as a solution
    to perceived threats against individual freedoms (Harvey 2007)—perceived threats
    not only from foreign political forces but also from any state policies favoring
    collective well-being of citizens over the integrity of financial institutions
    (331). Harvey suggests that the application of neoliberalism, instead of solving
    the global capital crisis, despite rhetoric promising fair competition, only served
    to revitalize the dominance of the upper classes (29). As economic inequality
    is entangled with other ideologies of dominance, particularly the colonial legacy
    and white supremacy, neoliberalism also reinforces the marginalization of racialized,
    gendered, and disabled identities.


    In order to comprehend argues, voice is best understood as both a process and
    a value. At its core, voice as a process comprises the “act of acting as oneself
    [after Butler 2005], and the immediate conditions and qualities of process” (Couldry
    2010: 3): a kind of reflexive agency. The idea of voice as a value is one that
    supports this practice of giving account (8). Valuing voice recognizes every person
    as a “narratable self” (Cavarero 2000: 34, cited in Couldry 2010: 99), and defends
    “the potential of voices to matter” (Couldry 2010: 9). Failing consideration of
    voice as a value, the only voices allowed to matter are those embedded in the
    bodies to matter, in the selves and are deemed acceptable narr, and in the gazes
    that determine


    > As Marnie Harlow writes, “[w]hat neoliberalism says and what it constantly diverge”
    (Holborov 2015:9).


    > Robert McChesney, in his foreword to Noam Chomsky’s Profit over People: Neoliberalism
    and Global Order, similarly writes, “Neoliberalism is the defining political economic
    paradigm of our time” (McShesney 1999: 7).'
