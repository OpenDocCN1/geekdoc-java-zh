  md: 'importantly, movement between vocalities can illustrate the intersection of
    ideologies about corporeal and agentive voice where stylistic choices are made
    because of the need for "cultural and psychic and political survival" (Butler
    2000: 36). The present volume has been an effort undertaken with these thoughts
    in mind, with the goal to study the lived voices of singers in their internal
    and social interactions with identity, agency and power. I have learned, overall,
    to listen to the material, corporeal, metaphysical, political, polysemic ways
    in which singers liberate and withhold their vocal ways of being in the negotiation
    of self. I''ve learned to listen to lived experiences of voice, and to voices
    of lived experience.'
