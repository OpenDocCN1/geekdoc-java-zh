    Deborah Wong, in her essay “The Asian American Body in Performance,” remarks that
    “[t]the social drama of the body” is, in the 21st century, the focus of “new ideas
    of performativity linking corporeality and social transformation” (Wong 2000:
    60). Ms. Lim’s embodied voice is the site of such a social drama, suggesting that
    the material/corporeal and the social/metaphysical might themselves constitute
    dual vocalities—and once again, if vocality is a “vocal way of being,” then using
    one’s voice to transform oppressive social structures might be seen as a form
    of multifocality.


    # Singers and Political Vocality


    Musicians are often positioned, or position themselves, as sociopolitical leaders.
    Singers in part owing to their use of language in performance, have particular
    potential to act as Seth Hague and colleagues call “truth-bearers” for cases,
    “authoritative and representative voices” for their fans (Hague et al. 2008: 20–21).
    But as Bakhtin argues—“Truth is not born to be found inside the head of an individual
    person, it is born inside people collectively searching for truth, in the process
    of their dialogic interaction” (1984: 110). So truth-bearers, perhaps most importantly,
    a leader may act as a community organizer for those audiences, encouraging their
    voices in public participation—as in flash-mob experiences—or in the offer of
    assistance on MILCK’s website for the organization of choirs and performances
    of “Quiet.


    Ms. Lim herself feels a connection between her ownal voice and the voices of those
    who sing with her. When she sang “Quiet” with ChoirChoir! Choir! in Toronto, her
    voice was reflected and carried forward:


    The idea of thousands of other voices singing my song is a tremendous concept,
    beyond my own expectation and understanding. And I think the universe ever day
    for the opportunity to feel that type of energy . . . having 1300 Canadians sing
    the lyrics I worked hard to create, back to me . . . And coming up with the phrase
    *I can''t keep quiet* really took me to get to. I think I had been trying to express
    that feeling for a very long time. So I just feel grateful and really in awe of
    the power of song, and I also feel like there is this confirmation that we are
    all more similar than we think, and at the core of it we are all emotionally intelligent
    beings who can understand each other’s experiences no matter how different we
    are. (personal communication, June 20, 2017)'
