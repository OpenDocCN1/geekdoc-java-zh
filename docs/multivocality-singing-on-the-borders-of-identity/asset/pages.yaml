    # Phonocentrism


    The equation of voice with agency is rooted in the long association, in western
    thinking, between speech and existence. Within such metaphorical frameworks, voice
    figures as a site of selfness and self-empowerment. Jonathan Rée, in his landmark
    work I See a Voice: Deafness, Language, and the Senses, considers this trope and
    the binary thinking that pervades discourse outside of Deaf experiences: “[voices]
    are both expression and communication, both feeling and intellect, both body and
    mind, both nature and culture. The whole of it, is seen in the compass of the
    human voice” (Rée 1999: 16). But much more than self-epistemology is assigned
    to voice: it has been positioned not as a way of being but also being itself,
    as an index of, in Jacques Derrida’s framework, “presence as substance/essence/existence”
    (Derrida 1997[1967]: 13).


    Derrida, on Of Gramatology, employs the idea of phonocentrism to critique the
    privilege of speech over writing. Derrida attributes the history of polycentric
    thought to a semiological and metaphysical association between voice and the concept
    of self-presence—an association that translator Gayatri Spivak notes, also observed
    in Speech and Phenomena (in French La Voix et le Phénomène—The Voice and the Phenomena),
    his collection of essays on Husserl’s theory of signs: Why is the phenomenon most
    ‘ideal’ of signs? When I speak, it belongs to the phenomenological essence of
    that I hear myself [mënt] at the same time that I speak” (Derrida 1973: 77, cited
    by Spivak in her preface to Of Gramatology). For Derrida, phonocentrism results
    from a human desire to imagine some kind of “central presence at beginning and
    end” (Spivak, in Derrida 1997[1967]: lxviii).


