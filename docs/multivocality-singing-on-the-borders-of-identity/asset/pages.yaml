  md: '# Methodology: An Ethnography of Singing


    My study of multivocality draws on discourses in the ethnography of communication,
    but that its goal is to understand how ways of singing might reflect and shape
    ways of living. My understanding of vocalities as ways of singing, or vocal of
    being, recalls the work of Dell Hymes, writing in 1974 in "Ways of Speaking.\
    In this essay, Hymes explains his preference for studying ways of speaking. The
    phrase, for him, presents the act of speech as a "complex social act," and recalls
    both Wharf’s "fashions of speaking" and the notion of "ways of life" (Hymes 1974:
    445)—the latter understood to be the foundations of culture. Research in ways
    of speaking must also, consider, not only "means of speech and meaning" but also
    the "norms of interaction that go beyond choice of style, and the attitudes and
    beliefs that underlie both" (446). Hymes also references the roles of voice—its
    pitch and contour—can play in ways of singing, using the example of Woolf communities
    in Senegal. He describes a contrast between two modes of speech—restrained and
    unrestrained—a contrast that, in distinct uses of voice, also divides the speech
    of men and women, adults and children, and members of low and high social castes
    (442). He urges ethnographers to study linguistic modes in addition to linguistic
    structure, noting that "It would be a mistake to assume that the essential principle
    of a form of speech is always structure, never mode" (443). Hymes turns to music
    here (as elsewhere in the essay), positioning practices as equally important to
    form: "one may say something that is not a song, and present a song without it"
    (443).


    Muriel Saville-Troike, elucidating the primary tenets and approaches to the ethnography
    of communication, writes that ethnographers of language tend to study how ways
    of singing are patterned, and how those patterns interrelate and "derive meaning
    from other aspects of culture" (Saville-Troike 2003:11). A handful of previous
    literature in ethnomusology and folklore has employed the idea. It follows, then,
    that an ethnography of vocality should investigate ways of singing—not merely
    as practice but also of making-making. Studies, such as Edward Kerr Miller’s dissertation
    An Ethnography of Singing: The Use and Meaning of Song Within a Scottish Family
    (1981), declare a focus on the singers. Others—for example Ellen Cohane and Kenneth
    S. Goldstein in "Folksongs and the Ethnography of Singing in Patrick Kennedy’s
    Banks of the Boro," emphasize "the description of song context" (Cohane and Golds
    1996: 426). In an unpublished paper presented as an "Embodied Approach to the
    Ethnography of Singing," ethnusicologist Nadia Chana centers her search on a specific
    voice teacher’s worldview, and on the relationship between'
