  md: 'new trends in the constructive processes of cultural identity. Culture itself,
    he observed, was a term under fire in his discipline, because “in today’s world
    of massive flows of people, capital, and ideas, a ‘culture’ can’t easily be thought
    of as something that people in a certain place on the globe or are in common”
    (Mathews 2000: 3–4). He recognized that contemporary identity involves not only
    the conventional ideal of culture as a shared way of life but also “the information
    and identities available the global cultural supermarket” (Mathews 2000: 4, after
    Hall 1992). Mathews examined the fragmented and eclectic cultural practices to
    mark the Zeitgeist of the new 21st century, and suggested that “people throughout
    the affluent, mass-mediated world today may be molded by the material and cultural
    supermarkets as the state” (Mathews 2000: 9). Those who can reach the wide array
    of consumer choices available in the cultural supermarket free to incorporate
    their selections into their sense of self.


    Mathews surveyed anthropological processes of self. Clifford Geertz had erroneously
    asserted in 1975 that “the Western connection of the person as a bounded, unique,
    more or less integrated motivational and cognitive universe becomes ‘a rather
    peculiar idea within the context of the world’s cultures” (Geertz 1973: 31; cited
    in Mathews 2000: 11). Scholars at the turn of the millennium saw an unbounded
    postmodern self heavily shaped by mass media—a “protean self, as Robert Lifton
    wrote, “fluid and many-sided” (Lifton 1999/1993: 1; cited in Mathews 2000). “Any
    one of us,” Lifton continued, “at any moment, have access to any image or idea
    originating anywhere in the contemporary world, or from any moment of the entire
    human past” (Lifton 1999/1993: 1; cited in Mathews 2000: 12). For Mathews, the
    eclecticism tied to success—Richard A. Peterson identified as a cultural shift
    to “omnivore” from “snob” (Peterson 1996)—is “the most shallow and fully conscious”
    level in the shaping of the self (Mathews 2000: 15), the one experienced most
    clearly as free choice. The two levels before it he identified as the “deep shaping
    taking place beyond the self’s control and by indirect comprehension,” the “middle-level
    shaping taking place beyond the self’s fully within its comprehension” (15; my
    emphasis).


    Mathews’s “shallow” of self-making—essentially, consumer choice—can feel deep,
    though. Living in the rural Midwestern States, I encountered two types of supermarkets
    (the physical kind): tiny stores that seem to barely accommodate any person, and
    huge stores that seem to stretch the width of airports. In a small shop, I will
    choose a tube of toothpaste from two or three options; in a “big box” store, it
    will take me an hour to find any toothpaste, and when I do, I will be introduced
    to twenty brands (not to mention several completely unrelated items on the way).
    My choice seems however more significant, more personal, more considered,'
