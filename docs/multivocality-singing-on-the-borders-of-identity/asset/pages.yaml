  md: 'Gathering the multiple strands of her cultural roots and interests, she has
    been able to freely locate her identity in place. “Where I found my identity was
    I realized that I’m from North Carolina” (Jones 2015). And the varied voices of
    North Carolina constitute her heritage. She has said:


    I’m a good ol’ mixed-race North Carolian. . . . There’s an area in North Carolina
    where there are a lot of Blacks and Indians, and of course, a lot of mixing. I
    wouldn''t be able to say exactly what I am of, that, or whatever, but we know,
    what I know? I know history and I know family lore and the way we know. I’m not
    interested if I would ever put myself forward as an Indian woman, but I’m always
    interested in finding out musically about these different pieces. I don’t know
    if I have Celtic roots, but it doesn’t matter to me, because the music of North
    Carolina has Celtic roots; that’s all I need to know. (Murg 2015)


    Additionally, in her recent work (such as her 2017 Freedom Highway), first amid
    the rise of the Black Lives Movement and then the surge in panic white supremacist
    activity since the 2016 election, she has focused on singing for those voices
    have been silenced. In particular, she has created original songs from slave narratives
    of the 19th century. When pressed about these songs at a concert in Greensboro,
    NC, she told her audience, “Someone asked me why I’m here. It’s not to be on Nashville—that’s
    fun. And it’s not to play with [country music] Eric Church—that’s fun. It’s to
    get voices out” (Harrison 2017). She not only sings with the many voices of her
    own body but also becomes a voice telling the story of cultural history—“my history,”
    she says, “where I come from” (interview, November 3, 2012)—and she is an agent
    of voices silenced by enslavement, violence, marginalization, and the passage
    of time. This process of singing purely, and of singing in a body through its
    very existence implies shaped her identity; it has also become a part of M. Givens’
    strategy of self, narrated through multiple vocal subjectivities in ways that
    have become especially pervasive and especially crucial in the 21st century.


    # A Crisis of Voice


    “We are experiencing a contemporary crisis of voice” in the West, critical sociologist
    Nick Couldry wrote in 2010, “across political, economic, and cultural domains,
    that has been growing for at least three decades” (Couldry 2010: 1–2; emphasis
    in original). For Couldry, this crisis is rooted in the hegemony of'
