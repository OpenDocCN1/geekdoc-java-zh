- pgno: 14
  md: '# INTRODUCTION 7


    This book centers on singers like Ms. Giddens, whose many voices are perhaps best
    understood as multiple vocities: multiple ways of being and acting in the world
    through voice, and of applying the intersubjectivity and interstitiality of voice
    to navigate the in-betweens and border crossings of 21st-century identities. My
    research has intersections of the material and the metaphorical, cultural consciousness
    in the vocal negotiation of identity. In studying vocities as vocal of being.
    Locate sounds, practices, techniques, and meanings in the context of singers⁵
    experiential truths, in the complex epistemologies of voice that reflect and shape
    self culture. Furthermore, when singers habituate perform across stylistic, genre,
    cultural, and historical borders, I suggest that not only are they performing
    in multiple vocities but, more critically, they are performing multivocality—that
    is, negotiating their narrative selves by singing with many voices.


    # Brief History of Vocality


    Vocality, in its most common usage, simply denotes the presence andor use of voice,
    having emanated from a human body⁶ However, as Berberian notes, its corporeality,
    its materiality, makes up only half the story. A cross-disciplinary reexamination
    of the term''s reading past presents highlights ways of singing as vocal of being,
    and at sites where the production of sound intersects with colonial structures
    of power.


    Vocality seems to have entered the academic lexicon when the beginning of the
    twentieth century, with the earliest iterations I have found occurring in divergent
    contexts. Scholars of psychoacoustics in the 1910s and 1920s (e.g., Model and
    Rich 1915; Weiss 1920) hypothesized a structural correlation between tuning-fork
    tones and vowels, a vocal of acoustic configuration, or a vowelness, a human sound
    perceived within the “pure tone” of the tuning fork''s sinusoidal wave. But later
    that empirical definition was revealed with a performance that suggests ways of
    singing as sites of power relations. When a group of musicologists (Bairstow al.
    1929) breached the idea of vocality in Music and Letters, they were inquiring
    how one might determine whether a piece of music was suitable for singing—a question
    of its vocality or unvocality. In the printed conversation, British scholar Edward
    J. Dent raised issues of status and appropriate practices as important factors
    in such judgments. Taking up the


    +   ⁵ In this study, I am working with a definition of singer that includes those
    who generally selfidentify as singers and also those who have self-identified
    within the framework of any specific musical context. Though many of my consultants
    have sung professionally, not all of them have.

    ⁶ Some text in this section was previously published in “A Powerful Voice: Studying
    Vocality and Identity” (Meizel 2011a: 267–273). Used with permission.www.tandonline.com'
