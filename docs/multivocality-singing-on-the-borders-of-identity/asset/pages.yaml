    it. Additionally, we should note that “nasality” is a culturally loaded concept,
    undesirable and marginalized in western discourse and often understood as a marker
    of Others (students often describe any non western as “nasal”). If we are aware
    of vocality’s inextricable link with structures of power, we can neither imagine
    it independent of them nor familiar but unexamined frameworks to overshadow other
    culture-merging ones. Though many participants in my study locate themselves within
    western discourses of singing, it is important to view those discourses as only
    part of the picture of voice. Because my work focuses on individual singers, in
    each chapter 1 I strive to use the terminology they have used, within the framework
    of their own experiences.


    Ethnomusicologists have long acknowledged a need to examine the processes of representation
    in scholarship. But, especially considering the rhetorical associations between
    voice and political representation, I would suggest that a study of singers requires
    special attention to issues. Representing the experiences of others through research
    is often positioned as “giving voice” (Ashby 2011). Bogdan and Bilen, for example,
    describe giving voice as “empowering people to be heard who might remain silent”
    (Bogdan and Bilen 1998: 204, cited in Ashby 2011). Many of the singers I write
    about face a network of oppressive systems that work to suppress voice, by virtue
    of their resistance through vocalization, through multivocality, they are definitely
    not silent. Christy Ashby, whose centers on non-speaking disabled people, critiques
    the concept of giving voice for its complex implications of agency and power.
    She cautions researchers against the belief that they must uncover or “excavate
    an individual’s authentic voice (Ashby 2011, after DeVault 1999), and urges them
    to hear or “read” silences, as well as speech. I have written Multality with these
    ideas in mind. Because the participating singers do through many voices, there
    is no single authentic voice to locate. I have also tried to listen to the silences
    as they can—for example, as I discuss in chapter 5, one participant in my study
    withdrew entirely owing to a religious conversion, and another withdrew as a result
    of increased celebrity status—and I have tried to include my own singing experiences
    only where my voice seemed relevant. Overall, as in any ethnomusicological research,
    just as in any novel Bakhtin studied, it is the multiplicity of voices that allows
    the author’s owning to sound.'
