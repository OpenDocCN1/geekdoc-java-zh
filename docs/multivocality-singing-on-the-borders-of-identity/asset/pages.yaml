    vocalization and hearing of identity. She identifies as Latina, and like Ms. Forsberg,
    is keenly aware of racialized body language in her interpretive work:


    > if someone singing like, you know, a little kid very quietly singing "you are
    my sunshine, my sunshine, we''re gonna sign it like this, sort of sing-song [head
    tipping clearly from side to side, her hands bouncing while signing], and happy,
    and [it] will match. But if I have a little girl with a lot of soul and a riot
    of rhythm, if some Latina comes out, and she''s like [sings phrase from "You Are
    My Sunshine in a strong voice, ornamenting the melody with vocal "scooping''],
    I''m gonna sign [broader gestures, wider smile, head swivel], I''m gonna bring
    it, I''m gonna have to match her intent, she''s trying to emote [for] the audience,
    with her intention; I have to make my signs bigger or smaller. (interview, June
    22, 2014)


    I also asked Ms. Spurlock how she indicates the vocal improvisations known as
