    occupied a privileged position in the history of voice discourse, and are often
    presumed to institute "correct" or "healthy" modes of singing, in opposition to
    other modes. As ballet has at times been understood as the foundation of any dance
    style, western classical vocal training has been positioned as the necessary groundwork
    for all singing, without which one cannot vocalize in a safe or acceptable way.
    Singing classically, our teachers told my student colleagues and me in the 1990s,
    was the only way to save our voices from damage; it was taught "healthy" in the
    same moralizing manner as was witnessed awareness of one’s body mass index.


    In a compelling and elegant analysis, Afua Osseo-Asare draws a connection between
    the pedagogical approach to vocal health, the voice conceived as medical clinic,
    and western constructs of health which were developed in the 19th and 20th centuries.
    Osseo-Asare observes that the 19th-century medical gaze contributed to the construction
    of health and "unhealth" as purely biological, and therefore were "absololved
    of all relation to or consequence from social contexts, despite the disease—and
    violence-producing capacities of social contexts such as poverty and imperialism
    (Osseo-Asare 2018: 50). It is this medical gaze that has helped to construct gender
    and dis/abled bodies; and with the emergence of Manuel García’s laryngealoscope
    in the 1850s, to the newly visible internal workings of voice. García’s legacy
    has guided generations of voice workers, voice teachers, and their students (though,
    I would have also considered singers who reject it as a hyper-intellectual and
    anti-religious approach). Osseo-Asare observes that, today in the United States,
