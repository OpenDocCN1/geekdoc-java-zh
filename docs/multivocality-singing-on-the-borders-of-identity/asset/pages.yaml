  md: '# MULTIVOCALITY


    Multivocality is an idea most associated with Victor Turner’s studies of ritual
    and with studies of Mikhail Bakhtin’s literary theory.⁸ For Turner, it describes
    a concept with diverse or ambiguous meanings and transformative power; the singing
    voice itself is nothing, if not. Though the precise term multivocality does not
    appear in a complete English-language translation of Bakhtin’s writing, it has
    nonetheless become, through later scholars'' analyses, a popular way of referring
    to his understanding of interubjectivity in Dostoevsky’s novels. For Bakhtin,
    voice comprises not the linguistic and sonic aspects of speech utter also its
    embedded ideologies (Park-Full 1986); it is “the speaking personality, the speaking
    consciousness. A voice always has a will or desire behind it, its own timbre and
    overtones” (Bakhtin 1981: 434). In his framework, all utterance contains traces
    of multiple languages (heteroglossia) and multiple voices (polyphony). A Dostoevsky
    novel, Bakhtin argues, is characterized by a collective, dialogical authorial
    voice that highlights the ability of a person’s utterance to another while nevertheless
    remaining itself, creating a dialogic relationship between the two voices (Park-Full
    1986). Bakhtin locates inostoevsky’s work “[4] plurality of independent and unmerged
    voices and consciousness, a genuine polyphony of fully valid voices” (1984: 6;
    emphasis in original). Bakhtin’s concept has been translated, as here, as polyphony,
    but also as multivocality and multi-voiced (Belova et al. 2008: 494)—or, as in
    Jacob Meyinf’s influential analysis, as multivocality (May 1998)—all referring
    to the management of the many voices inherent in dialogic speech.


    Emphasize that the “multiplicity of social voices” (Bakhtin 1981: 263; May 1998:
    154) in Bakhtin, each is autonomous, and they do not blend together to make a
    cohesive whole, though they may be “orchestrated” by an author to create his novel’s
    narrative text (May 1998: 154) and achieve a “unity of a higher order than in
    homophony” (Bakhtin 1984: 21). Bakhtin understands that all the heterogloss in
    this text, the writer’s “own voice must also sound; these voices create the background
    necessary” for this to happen, and cannot be truly heard without (Bakhtin 1981:
    278).


    Voice itself, to Bakhtin, is “the speaking personality, the speaking consciousness.
    A voice always has a will or desire behind it, its own timbre and overtones” (Bakhtin
    1981: 434). The notions of multi-voicedness and of polyphony in Dostoevsky’s novels
    never indicate any kind of singular unity but, rather, always a dialogue, with
    different voices independently working “as a communion of unmerged souls” (Bakhtin
    1984: 26). Nevertheless, many have sought sought to translate this model to the


    ⁸ A small portion of the text in this section is drawn from my chapter “Find Your
    Voice: Narratives of Women’s Voice Loss in American Popular Culture,” (Meizel
    2019).'
