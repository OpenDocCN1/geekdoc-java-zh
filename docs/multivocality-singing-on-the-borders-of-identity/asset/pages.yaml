    It isn''t only the body that''s at stake for Dr. Dechaune, either; she says, "I
    feel like I lost a piece of my soul or something" (June 10, 2013). Some of the
    most persistently voiced stories in western cultures engage with frequently gendered
    discourses of voice and agency in relation to body and soul—with the metaphorical
    location of identity in the voice and the idea that, a voice is in a body, not
    only of a body and corrupted, and that it is something enough, to be detached,
    stolen, or even transplanted. Ovid''s Metamorphoses, for example, tells the tale
    of the nymph Echo, when the epic introduces her has been punished by Juno for
    prattling in order to tell her other nymphs, who have illicitly lain with Juno''s
    husband (and brother) Jupiter, Echo''s chastity is at center of Juno chastisement,
    and as punishment, her vocal freedom is severely limited so that she can only
    repeat what says. Unable to pursue crush (Narcissus), who is afraid when he hears
    her, and the shame of it causes her body to waste away. After that, her remaining
    bones turned to stone, Echo exists only as a embodied voice bouncing among those
    stones, inert and only pinched into motion by, and always subject to, the force
    applied by others. Her condition is also explicitly described by Ovid, in the
    words of A. S. Kline''s translation, as "no longer to be seen on the hills, but
    to be heard by everyone. It is sound that lives in her" (http://ovid.lib.virginia.edu/trans/Metamorph3.ht).
    She is condemned not to speak in another voice'
