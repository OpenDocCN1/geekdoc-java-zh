    # Kavanah


    In our interviews, Anthony Russell, cantorial soloist, and Sharon Azrieli-Perez,
    cantor—both trained as opera singers—framed intent within the Jewish concept of
    kavanah in prayer. In *The Lord’s Song in a Strange Land: Music and Identity in
    Contemporary Jewish Worship*, ethnomusologist and rabbi Jeffrey A. Summit, in
    brief, defines kavanah as “Sincere devotion, concentration and intention in prayer”
    (Summit 2000: 178). Throughout his study, though, he discusses the more nuanced
    meanings he encountered in his ethnographic work. For one student, he entailed
    “personal confrontation and interaction with the text of the liturgy”, the consideration
    of the text’s means aligning his own life and his historical connection to it
    (114). A rabbi told that in the application of musach—a Hebrew term, in this context,
    understood as the melodic modes specifically to liturgical cantill (105)—“the
    music gets the words and across kavanah in teillah [your prayers] are much stronger”
    (125).


    Mr. Russell, comparing sung prayer in his Christian experiences with Jews, feels
    that *kavanah* has been present for him in both settings:


    I’d say it isn’t the same. I’d say the same kind of feels all over me. When I
    recall how I used to feel about singing in church, it that combination of melody
    and both things coming together to create intention, you know, kavanah, as you
    would say (interview, January 29, 2014).


    When I asked Azrieli-Perez, whether she felt any differences between sacred and
    secular singing, she brought up the concept of *kavanah*, explaining that the
    job of a cantor in a Reform synagogue is not only to lead a congregation—especially
    one who may not understand Hebrew or Aramaic—but also to help those praying do
    so with the proper *kavanah*. A cantor’s role is not intercessory between congregant
    and God, “he is supposed to be helping us like an operator with the telephone,”
    she says. She acknowledges that in opera, one may have a spiritual moment—for
    example “in a particularly gorgeous phrase where you access God—but that prayer
    sung with kavanah is “directly” spiritual. Evoking a similar history to Summit’s
    study, she observes the impact of one perfect liturgical singing on prayerful
    intention: the knowledge of a mode or melody’s age, passed down from generation
    to generation. It’s not possible to accomplish what does visceral to your gut
    just with words” (interview, January 26, 2014). In spite of her earlier participation
    in the tradition of classically informed cantorial singing, in the congregation
    she has brought together herself in Montreal, she prefers to sing “as a folk singer
    . . with different production,” and in a lower range, in order to make sure everyone
    can sing comfortably together.'
