    It is worth noting that in ASL, as public attitudes about race, ethnicity, and
    difference have shifted, as global connections have formed geographically and
    linguistically separate Deaf communities, relevant signs have changed. Where early
    signers marked identities based on perceived physical distinctions—a “K” made
    at corner of the eye to indicate “Korean,” and flattening the nose for “Black”
    (“Negro”)today they tend to focus on cultural attributes or geography; indicating
    a hat brim for “Mexican” or the shape of Japan for “Japanese.” Many of the new
    identity signs are adopted from the relevant culture’s language, as well (interview
    with Michelle Spurlock, July 28, 2014; see also 1999). Some signs considered to
    be less offensive, still engender controversy and underline the problems inherent
    in embodied representations.


