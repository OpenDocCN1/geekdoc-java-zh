    This journey across has not gone unmarked as allegory for transformation in human
    lives. Leland G. Spencer offers a close “transgender reading” (Spencer 2014: 113)
    of the tale. For Spencer, though the story was not purposefully written about
    transgender identity, it contains significant parallels with the mermaid’s experience
    and transgender experiences. Most broadly, he points out, that the little mermaid
    performs a gender identity “other than that which is socially assumed or assigned
    for her character” (113). Grounding his argument in the Butlerian tenet that all
    identities are “fabrications manufactured and sustained through corporeal signs
    and other discursive means (Butler 1970: 173), Spencer writes that:


    The mermaid’s performative permeability on the nature/human/culture divide suggests
    that identity performance drives the narrative.... From the mermaid’s fascination
    with water, the painful changes that she decides to make to her body, the challenge
    of coming out to her family and friends, to her relationship with the prince—in
    one case [Andersen’s version], the ultimate rejection of her identity, and in
    the other [Disney’s film], a consummate acceptance—both reflect the excitement,
    anticipation, struggle, pain, silence, and beauty of coming out, of performing
    transgender identities, and of the search for identity that she seeks to fit best.
    (Spencer 2014: 124)


    Spencer focuses on the voice as a metaphor for identity and agency, and compares
    the mermaid’s silencing to the social and self-censorship experienced by transgender
    individuals. He also positions the material voice on the same level of significance
    as the metaphorical—the physical/physiological intertwined with the culture. For
    some transgender singers choose to transition, the journey of engineered voice
    is similarly, if less fantastically, entangled and complex. The mermaid may give
    her voice to get a man, but there are many nonfiction people who are willing to
    take grave risks in order to be or not to be. And in late 2018 the risk has become
    excruciatingly more literal, the White House planning an erasure of transgender
    identities no less devastating than to ocean foam.


