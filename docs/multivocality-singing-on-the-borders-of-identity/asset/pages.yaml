  md: '# FINAL REFLECTIONS: HEAR OUR VOICE 199


    As in previous times of American civil unrest, singing has played a prominent
    role in the recent multifarious resistance movements, resonating in all three
    of Couldry’s forms of voice. Individuals have expressed their personal perspectives—the
    individual form. They have sung towards a common goal—in a collective voice, singing
    with. And they have together created, documented, and posted networks of songs
    on the internet. They have sung in their own voices, and metaphorically in silenced
    ones—singing for. They have tweeted and retweeted the voices of others. This chapter
    presents examples of singing in two recent movements, to highlight the multivocity
    of 21st-century musical resistance.


    # Taking the Mic


    The “taking the mic” has long served as a metaphor for agency and for declaring
    a shifting balance of power. It’s a way of making one’s voice heard. But when
    there’s no actual mic to take, a different kind of electric current can signal,
    even effect, that shift in power. Political demonstrations in the 21st century
    have highlighted a method of address known as the “peoples microphone (also called
    the “human microphone” or “human megaphone”), in which an individual’s words are
    repeated by nearby listeners in the crowd to ensure that the message reaches those
    at the back. Though versions of the system have been in use since the 1970s, it
    has gained special currency in the United States the Seattle World Trade Organization
    protests in 1999, and in the age of social media, the Occupupy Wall movement,
    for which it was famously implemented in Zuccotti Park owning the policing of
    electric amplification in public spaces.


    The people’s microphone is not an echo of voices, gradually fading away in the
    distance. Rather, each repetitive voice of speech is meant to strengthen the message,
    with perhaps even more clarity than a megaphone could offer. Homay King calls
    the practice “less than a mode of speech.” He continues, “It involves a special
    kind of speech-act, an actualization of principles in viva voce”—in living voice,
    or in live voice (2012: 239). Furthermore, King writes, after J. L. Austin (1975),
    the people’s microphone is a performative utterance: it enacts that it invokes.
    As an example, he invokes the popular chant, “This is what democracy looks like”
    (2012: 239). I suggest that it is likewise the enactment of agency political voice,
    one voice amplified by dozens or even hundreds more—Couldry’s “distributed voice”—to
    form an literal “voice of the people,” sounding in viva voce.


    The increasing use of social media as a revolutionary platform has greatly extended
    the reach of such voices, allowing them to resound (re-sound) and resonate beyond
    physical sites of resistance, in cyber spaces. Alexander Halavais'
