    The phrase “high lonesome sound” made its way into bluegrass discourse through
    a 1963 documentary by John Cohen of the New City Ramblers (The Kentucky Mountain),
    featuring white banjo player and singer Roscoe Holcomb. In Tom Davenport''s 2003
    documentary Remembering the Lonesome Heights, Cohen calls his first encounter
    with Holcomb: “my hair stood up on end. It was the most moving, touching, dynamic,
    powerful song I—not the itself, but the way he sang, and it was just astounding”
    (Davenport 2003). “High Lonesome sound” has come to encapsulate the expressive,
    mournful singing, with a high range and sorrowful lyrics, that characterizes Appalachian
    “old-time” or later bluegrass style, or a sound reminiscent of either. These genres
    have been popularized as well with working-class culture—white supremacy—historically
