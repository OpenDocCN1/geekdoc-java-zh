- pgno: 13
  md: '# 6 MULTIVOCALITY


    neoliberal subjectivity as “monocultural” and therefore lesser. Multicultural
    reference sustains both sides of the new privilege/stigma dichotomy. (Melamed
    2006: 18)


    Musical performance that reflects an eclectic, superficial multiculturalism—such
    as a white singer''s adoption and appropriation of multiple music cultures and
    vocal practices—can reinforce this dichotomy.


    On the other hand, singers, especially artists of color like Ms. Giddens, they
    use ways of singing to create otherwise-denied spaces where their selfnarrations
    can sound. Such narrations are always unique to each person, they are also intersubjective.
    Cudry observes that due to its inherently relational nature, as a value cannot
    be individualist (2010: 9). And because a neoliberal society tends to celebrate
    all a competitive (hyper-)individualism denies the intersubjective complexity
    of self and identity, I suggest that singing with many voices can also become
    a form of resistance: a way to narrate oneself through the intersubjective process
    of voice, therefore functioning as a counter-rational tactic against neoliberalism.


    Furthermore, it can help bolster democratic principles against what Foundry calls
    the “fiction of neoliberal democracy” (Caudry 2010: 47). Adriana Cavarero points
    to *plural*, which she names “pluriphony,” as a foundation of democracy—rather
    than the discursively persistent idea of the masses in unison. In the age of “post-truth,”
    she argues, it isn’t the voice of the people but rather, the *voices of people*
    that generate the “landscape of democracy-in-the-making” (Cavarero et al. 2018:
    84). Thus, the sounding of any person’s multiple, intersubjective voices might
    be heard as democratic, as well. And when singers like Ms. Giddens raise their
    voices for those who have been silenced by death, time, and history, that soundscape
    of democracy in progress is broadened and more clearly defined.


    Given the work it does, singing in any voice may be considered a social practice
    of being-in-the-world (Heidegger 1962) and of acting in the world. In 1966, avant-garde
    composer and singer Cathy Berisian associated this function with the concept of
    *vocality*, encouraging classical singers to explore diverse ways of vocal aspects
    and capabilities—as “ways of being for the voice and to develop a “New Vocality”
    (Berisian 2014[1966]: 47). Vocality also forms a crucial part of Feld’s notion
    of *acoustology*, which constitutes an elapsed, “sonic way of knowing and being
    in the world” (Feld and Brenneis 2004: 462). For many singers, voice as epistemology
    and ontology encompasses not only the discrete sets of linguistic and vocal practices
    and sounds embedded in the various music cultures they invoke, but also the many
    points of view and the many stories that informed their personal experiences of
    identity.'
