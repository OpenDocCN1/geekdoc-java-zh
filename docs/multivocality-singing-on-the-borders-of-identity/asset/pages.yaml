    of a Jesuit congregation Adventist leader; I sang regularly for a Community of
    Christ congregation,¹ where I eventually became soloist and songwriter; and at
    times I performed guest spots at Lutheran, Unitarian Universalist, Catholic, Presbyterian,
    and Seventh-day Adventist institutions. Because I grew up in a small-town Conservative/Reform
    Jewish congregation (that there weren''t enough of us to divide into denominations),
    each of these became a kind of miniature ethnographic experience—participant-observer
    in a music culture foreign to me. Most of the time, the congregation’s music director
    and even the congregation were aware of my Jewish identity, and I often encountered
    some curiosity or mild tension, was to feel welcome. I was often told that I had
    a divinely gift for choosing the right song. When I left for an academic job across
