  md: '# Why Are Singing Voices Lost?


    By the time these films emerged in the late 20th and 21st centuries, singing had
    come to be heard as a predominantly feminine attribute. In 1989 (the same year
    Disney''s The Little Mermaid premiered), J. Terry Gates outlined the generic practices
    of American public singing beginning in the 18th century, arguing that women gradually
    took traditionally male social roles, they also began to dominate public singing
    (Waters 1989). In Schools, Gates wrote, girls and boys joined choir in equal numbers
    in the 1930s, but after the upheaval of the following years that young men went
    to war and to work, singing came to be understood as a woman''s pastime. Gates
    also worried that women''s adoption of male values—such as an enthusiasm for public
    singing—would lead to an eventual decline in women''s singing; because men had
    disinterested in singing, women would follow.


    In 1998 Flick Rock, Maris Bayton observes the prominence of vocalists (rather
    than instrumentalists) in popular music—technologies such as electric guitar generally
    to men, while the feminine voice is seen-orehetically, as the instrument that
    only a woman has. Since women''s bodies are viewed as desirable in popular music,
    and the voice resides in bodies, women are allowed to sing, even expected to do
    so (Bayton 1999). Women''s bodies are also expected to dance, even while singing—a
    test that has frequently led to lipsyncing and attendant scandals about liveness
    and authenticity. In lip-syncing and the much-maligned guiding tracks commonly
    used by dancing singers, a technological Svengali replaces a woman''s voice with
    a more perfect simulacrum of her own. The bottom line is that if women''s bodies
    are policed, then their singing voices must be, as well. And if women want to
    recover and affirm their own control of their bodies, finding a singing voice
    onscreen meets an effective method of resistance.


    # Conclusions


    though the little mermaid renders all vocal communication, none of her cinematic
    daughters seem to lose the ability to speak. Marie de Nardi shouts at her son;
    Marian argues with her protégé; Bobbie talks with her aunt Ella; Terra''s confession
    of singing is self-imposed; Lewellen is subdued but still speaks when she is spoken
    to. This pattern suggests the question of why women''s singing voices are so often
    silenced onscreen, rather than their speech. The loss of a singing voice, produces
    a kind of vocality in negative.


    If there is anything to learn from the history of lost voices in film, it is that
    a woman''s voice sounds in, and is silenced within, discourses about gender and
    agency. Onscreen, the singing voice voice has symbolized the vulnerability of
    identity'
