- pgno: 15
  md: '# 8 MULTIVOCALITY


    of folk song seemed "vocal enough but difficult to sing well" (Bairstow et al.
    1929: 235), Dent, instead of merely citing aesthetics, pointed to class relations.

    He wrote that:


    People may possibly have come by now to acquire folksongs as national possessions,
    but for a long time it was as much a matter of pretence [sic] as Marie Antoinette''s
    dairymaking. Cultivated singers had . . . to acquire a style that suggested the
    manner of the imaginary peasants ... and at the same time to sing their songs
    sufficiently well . . . to make them a success in the concert-room.

    The difficulty of singing folksongs is mainly a matter of self-consciousness,
    vanity and snobbery. (Bairstow et al. 1929: 240–241)


    For Dent, the appropriateness of folk songs to the voice was never itself in question;
    instead, he argued, the trouble classically trained singers had was due to an
    inevitable awareness of lower-class cultural practices and a hyper-awareness of
    economic distinctions. "Folk" and "concert-room" of singing, he believed, involved
    irreconcilable differences of class and practice and, critically, power.


    Feld et al have examined ways in which voice is constructed as a "metaphor for
    difference" and as a "key representational trope for identity, power, conflict-social
    position, and agency," a framework that positions vocal as a social practice understood
    as an implicit index of authority, and experiential truth" (Feld et al. 2004:
    341). Ontological and epistemological discourse about vocals has long been tied
    up in discourses of power, within a set of interrelated histories, European modernity,
    colonialism, and the institutionalized study of humanity. Documents from the early
    years of Europe’s colonial project show that voices were heard even as markers
    of cultural identity and difference. In the 16th century, for example, the voice
    became a locus for Calvinist missionary Jean de Léry’s experience of difference
    in Portuguese Brazil, as he watched ritual participants dancing and shifting voices
    from what he called "tuneable" and "pleasing" to "muttering," "trembling," and
    "howling[]," signaling to Léry what he believed must be possession by the Devil
    (de Léry 158)—a vocalized and embodied difference, essentially, of the soul.


    By the time European colonial expanded in the second half of the 19th century,
    the inscription of voices with difference had become an ideological instrument
    of dominion. And it has remained so. In 1992, invoking the legacy of 19th-century
    geopolitics, voice coach Patsy been cautioned performers against what she called
    "vocal imperialism," or the belief in "one right voice" (Rodenburg 1992: 105)—a
    hegemony similar to what John Potter identifies as "vocal authority" (Potter 2006
    [1998]). This imperialism is not metaphorical but, rather, a literality. Ana María
    Ochoa Gautier, in her groundbreaking study'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# INTRODUCTION 9


    of the intertwined production and hearing of voice in 19th-century Colombia, positions
    colonizedality as "untamed" in the eyes of European colonizers, part of an orality
    she understands as a "historical mode of audibility of the voice" strategically
    controlled by state orality (Ochoa Gautier 2014). And considering musicologist
    Nina Sun Eidsheim''s argument that voice is created by the listener as much as
    by the singer (2019: 157), orality and the listening gaze of colonizing powers
    paramount in the discussion of vocality. For example, during the period when the
    British Empire was staking its most expansive graphical claims, the voice came
    to be treated explicitly as a site of difference among the world''s peoples. Ideas
    about nation and race were tangled then; but to some, the racialized body, including
    its vocality as constructed by the British gaze, was indicative of national or
    regional character. In 1869, laryngeologist Sir G Duncan Gibb delivered a paper
    on the voice to the Anthropological Society of London (published in 1870). He
    spoke his plainly, identifying Europe as "the cradle of song" and the European
    voice as superior to the "Asiatic and African" (Gibb 1870: 258). Some deemed him
    to be "powerful"—German and Tart (Tatar) voices, both male and female—and some
    to be "weak"—Chinese, Japanese, and perhaps most significantly the colonized Indian
    voice. He guessed that such weakness, and the differences lie in the structure
    of the larynx (see also Meichel 2011b for further discussion of Gibb''s). Gibb''s
    views, based largely on anecdotal stories and unsystematic observations, are untenable
    in the the 21st century, particularly because no scientific evidence has ever
    found of any morphological or skeletal characteristics indicative of race. Musicologist
    Nina Eidsheim has explained that, instead, any racialized differences listeners
    hear are "based on the flexibility and possibility of the instrument, and the
    choices made" as to the vocal qualities emphasized (Eidsheim 2008: 33). In other
    words, racializations of vocality, like race itself, are perhaps best considered
    as social constructs.


    Some have also argued that the sonic characteristics of different languages shape
    distinct vocalities, creating disparate ways of singing among cultures. At the
    height of the Enlightenment, as cultural tensions strained the relations between
    France and Italy, and as the seeds planted for the rise of the nation-state, Jean-Jacques
    Rousseau famously proved proto-national identity in the voice as shaped by language.
    He said in his Dictionary de Musique that dissimilarities between spoken French
    and Italian led directly to


