  md: '# 8


    # # Lost Voices


    "But if you take my voice," said the little mermaid, "what will be left to me?"


    —Hans Christian Andersen, *The Little Mermaid*


    When I was 16, I left my family for the first time to go to a summer arts camp.
    At night in my narrow dorm room, I began to have a recurring nightmare in which
    I was murdered. That wasn''t the scary part, though. That dream-me understood
    was dead, but my family wouldn''t believe me, so I tried to stay with them and
    live my life as I nevertheless slipped away, I think I''ve died, I told my father,
    but they wouldn''t believe me. After a while, I would realize that my parents
    and sister couldn''t see me anymore. For a while they went on a sort of facsimile
    of normality, but one day in the dream I realized that while my mother, my sister
    could still see me, they''d stopped hearing—first, my singing voice, then my speaking
    voice. I felt unmoored, somehow existing and not-existing in air that felt like
    water, horrified as my voice made no sound, and then I eventually faded into nothing.
    When I was 20 and at college, the dream came true.


    At least was the truth I lived, for nearly a decade, as a then-undiagn connective-tissue
    disorder pulled me apart from the self I thought was me, and I fought to adapt
    and to believe. I lost my voice. Or maybe more accurately, I held onto it desperately
    as it fell away from me in slow motion. It took years for me to get it, and then
    years for to let it go. I wasn''t silenced. My vocal cords are fundamentally fine,
    have never been anything other than fine, while my body grew less and less able
    to compel them to produce a consistent sound. I had no trouble speaking, though
    others, including my family, constantly asked me to repeat myself at a higher
    volume. I could make singing sounds, but I could no longer trust the voice that
    emerged from my body, alien and outside of it, each time I opened my mouth. I
    had less power than necessary over the multiple sets of muscles involved in singing,
    and their weakness compounded the problem. Even after I had a diagnosis and medical
    treatment, I still had no stamina, and couldn''t shake the fact that no one could
    hear me. I was living with an unwanted multivocality: the voice before and the
    voice after, one I nostalgically idealized in my head and struggled


