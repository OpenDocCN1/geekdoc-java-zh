    # Voice and Embodiment in Conversion


    Ethnomusicologist Eve McPherson has written about the role of the muezzin''s voice
    as a catalyst for conversion to Islam (McPherson et al. 2014). In Turkey, she
    explains, it is believed that when a “beautiful voice”—one which meets certain
    aesthetic and spiritual expectations—is heard reciting the call to pray, it has
    the power to draw listeners into the faith. But if voices can sound a religion
    in this way, I suggest that they have not only an oral impact on initiating conversion
    but a performative one in its process, as well. Religious scholar Rebecca Sachs
    noted that for converts, the “performance” of Jewishness is especially imperative,
    “since they are forever denied the possibility of being Jewish by birth” (Norris
    2003: 174). For Mr. Russell, as a former opera singer, the idea of “performance”
    has especially connotations. To him, the act of singing is fundamental to the
    religious practice of Judaism. Though he can relate his memories of praying in
    church to his experience of kavanah (the intent, or mindset), or in Judaism David
    Levin writes, “[t]the sacred language is woven, is insinuated, into the very fibers
    and bones of the body” (Levin 2015: 225; Norris 2003: 178). The kinetic adaptation
    of new rituals—the sign of the cross, the act of prostration, or in Judaism, the
    physicality of davening—is key to the process of conversion, and I would suggest
    that the notion of new sonic gestures, of new vocalities, constitutes an essentially
    essential (sometimes essentializing) enactment of embodied change. Furthermore,
    the purposeful relation of vocality undermines discourses of identity—“the “Black
    voice” for example—that are falaciously predicated on assumptions of fixed bodily
    traits.


    # (En)voicing Intersectionality


    The story of Mr. Russell''s encounter with Yiddish song illustrates how shifts
    in vocal serve as indicators of multivocal identity work, and for the performance
    of intersectionality—how of voices have been sounded, silenced, and reshaped through
    interlocking systems of oppression and hegemony. Classically trained since he,
    Mr. Russell felt constrained by the gendered performative prescriptions for his
    Fach (voice and character type). He wanted to vocalize'
