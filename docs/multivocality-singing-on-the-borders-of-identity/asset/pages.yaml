- pgno: 123
  md: '# 120 MULTIVOCALITY


    but it is also related to faith-based sensations and performances of the spirit,
    movements beyond rationality and perception to the outside of knowing, and creation
    of new imaginations of our place in the world” (Shubin 2012: 616). In this chapter,
    I reconfigure the concept of spiritual mobility to indicate a kind of portable
    accessibility to spiritual experience, located and carried in the voice as borderscape.
    In the United States, the nation''s history of colonization, immigration, and
    migration is one of the foundations of its religious fluidity. And the structure
    of American capitalism makes migration nearly a requirement: geographic mobility—the
    leaving of a home—to seek economic mobility. American singers, then, are particularly
    well positioned to negotiate their own communities and self-identities across
    categorical and religious boundaries.


    In Shubin''s study, he considers the sensory aspect of religious experience as
    “faith-based sensations.” Barbara Mandy writes about the primacy of sensory experience
    in religion: “ritual practice is felt more than it is ever thought. It is felt
    in the register of experiences received by the body, like the smell of burning
    incense or the sight of elaborate garbed ritual specialists. Or it is felt in
    enacted ones, as moving through the steps of a dance learned through apprenticeship
    or singing a song long remembered that it is deeply intertwined with one''s sense
    of self” (Mundy 2014: 516). Singing is an exquisite sensory, vibratory experience,
    and Nina Eidsheim has discussed in Sensing Sound: Singing and Listening as Vibrational
    Practice (2015), and a singer''s sense of self is intertwined with those sensations.
    Singing, is, like the performance of ritual, also as a kinesthetic experience.
    Thus, the sensory phenomenology of singing, of spirituality, and self-identity
    may intersect easily and be conflated or experienced together.


    Several singers I interviewed discussed changes in religious context by the movement
    of their own lives, as they left their families of birth to attend college or
    move for work to a new city, state, or country, or joined a partner in a new religion.
    Many moved from institution to institution, as I did, to find steady musical employment.
    A few moved from institution to institution, searching for a religious practice
    with which they felt a connection—experiencing Roof’s (2000) “spiritual marketplace,”
    or what one called a “smorgasboard” (anonymous interview, July 13, 2016)—that
    both imply a form of consumption.


    Another interviewee, who asked to remain anonymous, told me that he has taken
    hallucinogens since he was 15, and after a while in the Marine Corps he moved
    in a spiritual direction with the practice. He began to understand psychoactive
    mushrooms and other psychedelics as entheogens—not experienced as recreational
    or party drugs but, as substances that generate an experience interpreted as divine.
    After he moved from the United States to Finland, it was difficult to acquire
    entheogens, until he discovered an emerging, imported practice there: the Church
    of Santo Daime.'
