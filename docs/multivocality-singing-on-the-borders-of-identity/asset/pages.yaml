    this in an 1897 essay, "The Struggles of the Negro People," published in *The
    Atlantic Monthly*, August, pp. 194–197.


    $^{12}$ Through capitalization of the initial b, Anzáldúa distinguishes between
    geographical borders/psychological borders. For the sake of simplicity, I have
    not capitalized it in my own usage.


    $^{13}$ *Cantares Mexicanos* is a collection of Nahuatl-language songs, or cuicatl,
