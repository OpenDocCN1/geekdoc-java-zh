  md: '# FINDING A VOICE 39


    more effortful. I do not mean to position vocality here as an analog to toothpaste
    but, rather, to suggest that the profundity of the (problematic) investment white,
    middle-class singers find in the global cultural marketplace might be attributed
    to the vast variety offered to them by neoliberal capitalism.


    My privilege as a, middle-class American woman at an institute of higher education
    allowed me to pick the "high lonesome" vocality through academic study and feel
    though I''d made it my one. There is precedent, of course, as in the folk-revival
    movements of the 1950s and 1960s, when traditional musics were celebrated, even
    fetishized, among the white middle class (see Filene 2000); Old-time music has
    a special place in the history of the popular recording industry as one of its
    earliest mass-marketing successes, and I was one by no means the first singer
    to questionable the temporal (and racial) marketplace for recordings in the service
    of imagining authenticity.


    Ethnomusicologists have long been occupied with self-reflexive questions of cultural
    appropriation, wrestling with our position in oppressive structures and wrestling
    our focus away from the search for authenticity. In the groundbreaking collection
    Performing Ethnology: Teaching and Representation in World Music Ensembles (2004),
    Michelle Kisluk and Kelly Gross wrote about the postcolonial problems of representation
    in a BaAke ensemble at the University of Virginia. The embodiment of the music
    culture through dance and music is a primary pedagogical goal for Kisluk, but
    she and Gross assert that inherently appropriative work requires a redefinition
    of “authenticity” and an aspirational shift from imitative performance to interpretive
    (Kisluk and Gross 2004: 253). And as I learned, the performative choices of self-authenticity
    and the reality of power structures hang in the balance.


    Those structures that underlie vocal borderscap are key in any study of voices
    among genres or styles. In the digital rush of the 21st century’s globalizing
    culture, music forms a primary aisle in the cultural marketplace, and if any identity
    be easily stolen, singers must carefully consider the potential implications of
    finding a voice in that marketplace, as well. The multitudes with not only to
    reach technological advances but also to older libraries of recorded song also
    have immediate access to multiple voices. Jacob Smith (2008), in the book Tracks:
    Performance and Sound Media, traces characteristics of 20th-century recorded vocal
    styles and their cultural meanings, and he discusses how singers learned (for
    example, see Smith 2008: 132, on the implications of microphone and amplification
    technology; and p. 136, on the transmission of vocal performances of Blackness).
    In other words, the voices singers listen to inform their own, and a singer’s
    access to many cultures can provide ways to negotiate the crossing of cultural
    borders.'
