    between material voice and agentive voice, to non-phonemic implications in the
    relationship between language and voice, and to the significance of cultural values
    in the construction and practice of vocality.


    # Janine Roebuck


    Opera singer Janine Roebuck has taken part in some innovative projects conceived
    to integrate oral tradition and sign performance, and to challenge ideas about
    listening. In the Tête à Tête Festival in Hammersmith, London, England, premiered
    an opera, a work in progress, Annie June Cannon (1863–1941), a celebrated American
    astronomer who became deaf in her late twenties. The composer, Stephen Bentley-Klein,
    has a daughter who is deaf, and one of the stars has a deaf son. Janine Roebuck
    participated in the performance, and one deaf choreographer Mark Smith worked
    with Bentley-Klein and leading experimental-theatre producer, and director Sarah
    Grange to create the work. Originally titled A Quiet Life (later The Observatory),
    the piece was advertised as “a multi-sensory opera … suitable for people who can
    hear and people who can’t” (http://www.tete-a-tete.org.uk/the-quiet-life/). It
    was performed by singers with choreography, and with captioning projected onto
    the back of the stage in the varying fonts (see http://www.vimeo.com/47468818).
    The audience moved around the performance, with no chairs to sit in, and could
    experience the music in a variety of ways at multiple locations. Some speakers
    positioned around the room held plates of talcum powder that formed as speakers
    vibrated, while further hanging speakers could be held for a tactile experience
    of the musical vibrations (Wilson 2012). Additional speakers were placed underwater
    in buckets that, as Bentley-Klein explained in an interview on Radio 3 In Tune,
    hearing audience members could imagine a different experience of hearing, perhaps
    closer to that (Rafferty 2012).


    12 Maler''s piece on signed song details the process of Stephen Torrence''s work,
    though it was written before he stopped creating new videos.'
