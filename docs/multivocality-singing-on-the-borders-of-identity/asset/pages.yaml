    20, 2014)


    In this way, she supports voice as an extraordinary experience, one more than
    simply a given in the mundane dynamics of daily life. For Ms. Roebuck, the singing
    voice, which inexricably connected to the speaking voice, is also something from
    speech, with unique effects on both the singing body and the listening one.


    These singers’ experiences highlight the discrete political discourses of liberation
    and agency at both singing and signing, and complicate the practice of defining
    deafness through a negative relationship with voice. Instead, their work and their
    words, including Ms. Forsberg’s “two voices,” indicate that d/Deaf singers operate
    within a particularly comprehensive framework of voice, one that takes into account
    the physiological apparatus identified as voice, the metaphysical conflation of
