  md: '# FINDING A VOICE 47


    of this chapter also discussed a white American singer using “Ya Toyour” as an
    entrée into the Arab music industry, but the singer withdrew from the project
    for religious reasons. I nevertheless mention this because it is important to
    note that the song''s East–West in betweenness makes it conducive for use in both
    directions—in order to find a place in a new cultural context.


    To find a voice, a classically trained singer may navigate multiple vocalities.
    Despite essentialist discourse about voice, they may in some ways leave one vocality
    for another, though performative habits are often difficult to break—or they may
    feel that they embody two or more vocalities as they chart the borderscap of their
    vocal identities. They rely on shifts in vocality to negotiate the boundaries
    and intersections of different geographical, social, and cultural spaces, and
    to sound their intersubjective individuals in new places. Their choices may be
    guided by culture-specific discourses about self, about individualism, and/or
    about a relationship to broader cultural identity.


    In many ways, the freedom to choose a vocal identity is a privilege in the increasingly
    accessible, increasingly messy global sonic marketplace. Sometimes, multivocality
    becomes a strategy for cultural interaction and sometimes a strategy for survival.
    It is important, in the context of multivocality and agency, to remember Judith
    Butler’s question regarding political survival and style (Butler 2000: 36). The
    singers featured in this chapter have demonstrated that vocalities perceived as
    culturally homogenous—within the western classical contexts, for example, or in
    *tarab*—can hold extremely heterogeneous meanings for the complex individuals
    who employ them.'
