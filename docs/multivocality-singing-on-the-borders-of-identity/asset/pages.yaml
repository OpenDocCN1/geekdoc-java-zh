    # # Final Reflections


    # ## Hear Our Voice


    My voice has a quiver.

    That''s where you store the arrows

    Before you shoot


    > —Jim Carroll, “The Child Within,” in Void of Course: Poems 1994–1997 (1998)


    The idea of voice as agent value has had a powerful influence in western and global
    politics, as a deeply intertwined relationship with discourse about democracy.
    Voice and democratic agency are imagined so closely together that in multiple
    languages the nouns vote and voice are indicated with the same word. (In Germanic
    languages: *German*, *Stimme*; in Norwegian and Danish, *stemme*; in Dutch, *stem*;
    in Afrikaans, and in Yiddish *מולט*) In Slavic languages such as Russian, Polish,
    Belarusian, Czech, Bulgarian, Serbian, Macedonian, Slovak, Slovenian and Bosnian,
    the noun voice forms the root of the noun vote—for example, in Bulgarian, *насуване*
    [vote], is grounded in Bulgarian *глас* [voice].¹ Likewise, in Bosnian, the same
    word, written glass [voice] is the basis of glasanje [vote].² In the 18th century,
    the rhetoric of nascent democracy assigned legal authority to “the people” as
    the true authors of a nation (Looby 1997, 2009). To James Wilson, on the U.S.
    Supreme Court’s first significant case (*Chisolm v. Georgia*, 1793), it was the
    people of the United States who spoke it [the republic] into existence (Zink 2009:45)—as
    in the Old Testament, God is said to have spoken the word into existence—offering
    a new Enlightenment implication for the Latin proverb *vox populi, vox Dei*. And
    by Johann Gottfried Herder in the late 1770s, the “voice of the people”³ and its
    song, its *Volkslied*, emerged as tenets of nascent Romanticism (Gibson 2015).


    ¹ Glasnost, a term referring to a voice of public openness, became famous to English
    speakers by Mikhail Gorbachev’s vote in the 1980s; ultimately derives from this,
    and its predecessor, gal (to call), as well.


    ² In English, the word is derived from the Latin votum, meaning a “vow”.


    ³ From Stimmen der Volker im Lied (The Voice of the People in Song), 1778–1779.


    Multicolativity. Katherine Meisel, Oxford University Press (2020). © Oxford University
    Press. DOI: 10.1093/oso/9780190624161.001'
