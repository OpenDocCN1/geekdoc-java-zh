  md: '# INTRODUCTION


    # Overview of Chapters


    Each chapter in this book highlights singers in motion, their voices delineating
    bordersscapes that imply transitions and transgressions across genre and gender
    boundaries, cultural borders, the lines between body and technology, between religious
    and secular contexts, between fondness and lostness. The first chapter addresses
    Ms. Giddens''s vital question, “What is my voice?” investigating how singers who
    practice multvocality act. The voice is often understood as a kind of sonic fingerprint,
    embodying a unique, unalterable, and authentic self. But what dynamic processes
    and ideologies are at stake when one body generates many voices? An African opera
    singer changes her head to respond to Appalachian repertoire; a Canadian-born
    diva learns a different way of singing through the traditional music of her parents''
    Korean homeland; a Syrian soprano and refugee uses a song that showcases multiple
    vocities to negotiate her life in the United States. Such fluidity of genre and
    boundaries necessitates the confrontation of racialized, ethnic, and gendered
    stylistic boundaries, and indicates more than practical or aesthetic adaptability.
    More significantly, it points to the ways in which the voice figures the infinitely
    complicated work of identity. Chapter 1 investigates how singers trained in western
    classical tradition create and experience this kind of multplicity, and explores
    the explicit and implicit sociocultural means they make in the process.


    Chapter 2 examines a specific site of multplicity, a type of performing designated
    as “opera,” or “vocal crossover.” Identifying the various aesthetic characteristics
    and preferred repertoires of popera, the chapter integrates the experiences of
    several participants in well-known crossover productions and groups. They have
    generally shared with their members and thought processes in choosing and performing
    certain types of repertoire, their ideas about vocal technique, and the role multvocality
    has played in their careers. Their work reveals a complex process of code-switching,
    not only moving between vocal and genres but also highlighting and challenging
    existing structures—cultural histories of class, race, and gender—just as opera
    and popular music have always done. Popera, in the end, provides an acoustic space
    for the reunion of the two genres and their social registers, and for the negotiation
    of alterity.


    Some performances of multplicity are quite literal: impersonator actors sometimes
    the adoption of celebrity voices, all sounded from one body in an acumatic sleight
    of hand (or larynx). Vegas has been a national hub of impersonator culture, from
    its abundance of Elvis and its dozens of drag venues, to the perennial pop impressionists
