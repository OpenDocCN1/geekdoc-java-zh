    in voice science—“nasal” refers to a sound in which air flows through the

    nose—but we cannot confirm that quality without some form of acoustic or

    physiological measurement, and sometimes perceptual discourse and practice

    differ differ significantly. For example, when I have played for my students recordings

    described it as “nasal”—a term that in the Mystère des Bulgares obrabotka genre
    in western classical pedagogy describes the

    sound created when air is allowed to flow through the nose during vocalization.

    But I once talked with a Bulgarian singer of that style who teaches Americans,

    and who explained that the first thing she students do is to hold their noses

    to prevent a nasal sound. Ingo Titze has written of a confusion among vocalists'
