  md: '# 112 MULTIVOCALITY


    Musicologist Nina Eidsheim has previously written about an opera (Eidsheim 2011a)
    that danced underwater and was performed for hearing listeners, noting that sound
    waves travel through water and voice is generally heard differently in water because
    water’s increased density and reduced compressibility. She concluded from her
    experience of the work that “[1] the sound ultimately depends partly on what is
    sung, on the medium through which it passes, and how our bodies interact with
    that medium—supporting the notion of sound as a multisensory phenomenon (147).
    Of course, the senses rarely work one at a time, in non-synaesthetic individuals.
    As Joseph Strauss notes, hearing, by itself, is a multisensory experience, instead
    of a "one-to-one mapping of sense perceptions onto a single sensory organ" (Strauss
    2011: 167), and can also involve the tactile, the kinesthetic, and especially
    the visual. Strauss refers to this in the context of what he calls "hearing,"
    as a mode of experiencing music in non-phonocentric ways. Sign interpretation,
    as Ms. Forsberg is aware, can broaden the act of listening for hearing audiences,
    and for singers as well.


