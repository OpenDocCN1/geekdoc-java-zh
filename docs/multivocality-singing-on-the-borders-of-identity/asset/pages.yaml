  md: '# INTRODUCTION 15


    As, despite growing white supremacist and other hegemonic opposition, an increasing
    number of individuals understand their identities as intersectional, identify
    as multiracial (Saulny 2011), live across multiple cultures, move between religions
    (Green 2017), and identify as non-binary, gender-fluid, and transgender, borderland
    voices are sounding more and urgently. The sounding of voices across perceived
    borders—and the capacity of voice, the need for voice, to simultaneously claim
    space for marginalized identities and erode boundaries in resistance to systems
    of oppression—has been thrown into new relief.


    Marie-Célie Bertau, summarizing Hubert J. M. Hermans, observes that “The spatialization
    of self allows for sufficiently different positions, and for movement between
    these positions. The I moves in this, having the capacity to endow each position
    with a voice (Herman 1996), establishing dialogical relationships between positions”
    (Bertau 2007: 96). This movement among subject positions—called voices—Bertau
    writes, to be interpreted as extremely changeable or ever rigid, the two notions
    always in conflict and contemporary (133).


    In the process of multivocal movement between positions or voices, borders come
    into play. In the 2015 colloquy titled “Why Voice Now?, in the Journal of the
    American Sociological Society, convener Martha Feldman discovers Emily Wilbourne’s
    contribution, summarizing her reminder that voice operates over various borders,
    most significantly “the border of the human” (Feldman 2015: 658; emphasis in original).
    Suzanne Cusick, in 1999, wrote that “All voices, especially singing voices, perform
    the borders of the body” (Cusick 1999: 29), also cited in Krell (2015). Elias
    Krell writes about voices in the context of sonic borderlands, which they define
    as “a theoretical and experiential marker for identities and bodies that occupy
    geographic and discursive borderlands” (Krell 2015: 95). Voices separate the human
    internally from the external; they contain and divide bodies, and vocalities function
    as sociopolitical spaces at the borders of the human body. They partition discourses
    of gender, race, class, religion, and in doing so become contested—sites where
    lyrical structures intersect with power structures and where identities are negotiated.
    Thus, in this book, in addition to approaching multivocality as a navigational
    instrument for the borders of identity, I examine voice as a borderscape in itself.


    The idea of the borderscape became popular in the first decade of the 21st century
    across several disciplines, and itself is a multivocal concept. For geographer
    Anne Strüver, it builds upon Arjun Appadurai’s inscription of the -scape with
    implications of flow—cultural flow, information flow, the flow of capital and
    ideas, and significantly, the flow of populations through tourism, labor, and
    both voluntary and forced migrations (Appadurai 1990). A borderscape is'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 16 MULTIVOCALITY


    not a physical place for Strüver but, rather, a site that highlights a confluence
    of processes. The mapping of borders, Strüver writes, “takes place through representations,
    through performative acts, through acts of narration, visualization, and imagination,
    including their interpretations—and can be conceived as borderscaping”, which
    she defines as the application of “practices through which the imagined border
    is established and experienced as real” (Strüver 2005: 170; emphasis in original).


    In a 2007 book Borderscapes: Hidden Geographies and Politics at Territory’s Edge,
    geographers Prem Kumar Rajaram and Carl Grundy-Warr examine the concept of borderscaping,
    reminding readers that geographical “[b]order spaces are zones of specific social
    interactions that give a particular meaning” (Rajaram and Grundy-Warr 2007: xxix).
    Their understanding of the term borderscape¹⁴ highlights “the inherent contestability
    of the meaning of the border between belonging and non-belonging” (xxiii), and
    its continuous generation of resistances (xxix). A borderscape is even identifiable,
    geographically but in these very conflicts that arise to negotiate inclusion and
    exclusion (xxviii). And it is fluid, they, never static, “because it is a zone
    of multiple actors and multiple bodies calling on different histories [and] solidarities
    and invoking “experiences, economies, and politics that are concealed” (xxix).
    In my framework, voice as borderscape work in these ways. Voice is a zone of meaning-making
    social interaction; a battleground of inclusion and exclusion involving multiple
    actors, bodies, histories, and solidarities; the sounding of concealed policies.


    Geographer Chiara Bramilla (2015) proposes a renewed emphasis on borders, studied
    through the three axes of epistemology, and methodology, will push critical border
    studies “towards a new politics of becoming based on a pluripotential and plururical
    interpretation of borders” (29; emphasis in original). In Multivocality, I take
    that literally, to study how singers navigate borderscap through multiple vocal
    ways of being. Border-studies methodology, Bramilla asserts, should be (after
    Hampton 2009) “performative, participatory” (Bramilla2015: 28; emphasis in original);
    research should attend to the performativity of border-making, the researcher’s
    approach should work to empower the political agencies and subjectivities of those
    who cross borders, and the work must advance:


    > a knowledge capable of throwing light on a space of negotiating actors, experiences,
    and representations articulated at the intersection of meeting and even conflicting
    tensions revealing the border also as “site of struggle.”


    ¹⁴ They reference one of the book’s authors, Suvendrini Perera, in this discussion;
    see Perera 2007.'
