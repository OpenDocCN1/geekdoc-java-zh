  md: '# FINAL REFLECTIONS: HEAR OUR VOICE 215


    from whom all future singing, all poetry, was taken. Voices might waver in mourning.
    But then they rise.


    ***


    This book has considered multivocality as the process of singing with many voices,
    as an actuation of the intersubjectivities of voice, and as a mode through to
    navigate the borderscape of voice in the negotiation of identity. It has explored
    multivocality as both a result of and a form of resistance to neoliberal doctrine,
    a way to navigate the promise of agency and its suppression. Informed by the manipulation
    of spaces inside and outside of the body, the possibilities of acoustic functioning
    are myriad. Likewise, the ways in which voices are perceived according to individual
    experience and cultural contexts; in this, listening may function multivocally,
    as well. Vocality can mean choosing to sing and it can mean choosing silence;
    it may involve singing and listening within or without a framework of aurality;
    learning can occur through kinesthetic, mimetic listening, or through vibrational,
    or synesthetic processes. Vocities can become layers—archaeological, temporally
    defined layers of a singer’s vocal ways of being; or layers to be fit together,
    like layers of a cake, into a creative product.


    Where the layers of multivocality press together, the seams boundaries to be crossed,
    transgressed, reinforced, even erased in the borderscapes of voice. Singers consciously
    and unconsciously move between the cultural codes of vocalities as they navigate,
    relying upon the dialogic construction of identities. Vocalities can serve as
    strategies of self, as well as strategies to sell, despite the limitations imposed
    by corporeality voices can, to varying degrees, constitute choices. As ontologies
    and epistemology, they are sites of vulnerability to external manipulation and
    control, and when they are lost, ways of being and knowing can become unmoored.
    When they are suppressed, it is felt as identity theft. Vocalities are sonic velocities,
    and are subject to hegemonic and oppressive silencing. They also serve as crucial
    and effective instruments of disruption and resistance at a moment when intersections
    of neoliberal ideology, white supremacy, assimilation, misogyny, homophobia, and
    transphobia have boiled to the surface of U.S. culture.


    The embodiment and enactment of multiple vocalities reflect the inherently dialogic
    work of identity. Bakhtin’s work cautions readers that individuals cannot be studied
    as isolated units; as Wayne Booth explains it in his introduction to Problems
    of Dostoevsky’s Poetics, “everything that any scientist, of whatever persuasion,
    might say about ‘me’, in isolation from the many voices that constitute me and
    with which I speak, will be essentially faulty” (Bakhtin 1984: xxv). And'
