    paradoxically made him more and aware of his body as he sang—less because of the
    numbness, aware of the failure of his body to provide him with feedback in the
    process of shaping his voice.


    I asked Mr. Derfner the same question I asked: “Since you love your voice, do
    you still think of yourself as a singer?” Unlike others, he answered. “You sort
