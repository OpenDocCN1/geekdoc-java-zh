    vaudeville circuit met the electric circuit: a popular vocal aesthetic as “crooning,”
    today understood as the singing of “popular, sentimental songs in a low, smooth
    voice, especially into a closely-held microphone” (McCracken 2015: 2). McCracken
    associates crooning with early 20th-century aesthetic constructions of whiteness
