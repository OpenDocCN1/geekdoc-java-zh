- pgno: 30
  md: '# INTRODUCTION 23


    experiences collectively underline the idea of “transition” as an ongoing journey
    rather than a destination.


    If one is to understand the notion of finding a voice, one must also address its
    loss. Chapters 7 and 8 discuss the political and personal implications of voice
    loss. I examine the loss of voice through and mediated by technology, tracing
    a history in American cinema and the shifting sociocultural landscapes where it
    has projected its visions and auditions, where the transformation of voices can
    be heard clearly. The singing voice in cinema has moved from symbolizing the vulnerability
    of identity and its susceptibility to manipulation, embodying the affirmation
    of identity and as a individual of agency. Outside of cinema, voice loss in singers
    is subject to discourses no less suffered with ideas about identity and agency.
    Losing a voice can be, in some ways, losing one’s self, or at the least primary
    mode of enacting identity. Chapter 7 explores the loss of voice one experienced
    through selling her voice to a digital sampling library. Chapter 8 focuses on
    the idea of voice loss, through trauma or illness, as a personal loss of control,
    and examines the ways in which singers negotiate such loss.


    Finally, chapter 9 highlights two case studies of multivocality in the political
    climate following the 2016 U.S. presidential election, specifically within the
    contexts of intersectional feminist activism and youth activism against gun violence.


    Though discourse about singing tends to assign fixed, ostensibly biologically
    determined qualities and often value judgments regarding an individual’s vocality,
    to a significant degree voices are made through choices. The borderscape of the
    human voice is, within certain biophysical limits, constructed, shaped in relation
    to individual, interubjective, cultural experiences, and—like geographical borderlands—formed
    according to structures of power. As identities experience the flow and rupture
    of changing intersubjectivities, voices can, too. Multivocality, in its focus
    on the suppressions and soundings of voice in various borderlands of identity,
    works towards a deeper understanding of voice as a technology of the self¹⁵ and
    culture.


    ¹⁵ I use this Foucaultian phrase with a nod to musicologist Nina Eidsheim and
    her dissertation (Eidsheim 2008).'
