  md: 'The SNAP! typically accompanies English words in speech, and it is also used
    in ASL, in the same emphatic role: to underline a statement or to comment nonally
    on a situation or person (Michelle Spurlock, interview, July 13, 2014). These
    interpretive methods underline (1) the important place sign-gestures in the communication
    of hearing people, and (2) the essentializing role assigned to sign-gestures in
    the imagining and performance of racialized and generated bodies. Additionally,
    the translation of an individual''s social identity into the embodied vocabulary
    of sign language and challenges Roland Barthes''s famous complaint that language
    can only interpret music in adjectives, "the poorest of linguistic categories"
    (Barthes 1977: 179). Even if signed adjectives are no more or less successful
    than spoken ones in describing voice, they nevertheless add another, significant
    dimension.


    # Singing Interpretation and Sign-Signing


    Michelle Spurlock interprets for musical theater and cabaret productions in the
    Sacramento area, California. She identifies as Hard of Hearing, and we talked
