    # Size Matters: “Mini” Impersonators


    In Dumbstruck: A Cultural History of Ventriloquism, Steven Connor notes that though
    a voice comes from the body, it can only exist in departing it, and is only recognizable
    as *belonging* to a person “the ways in which it parts or passes from them” them
    (Connor 2000: 7). The ventriloqu voice appears to come from a body that should
    not speak, a doll only animated when the breath of life seems to pour out of it
    in sonic humanity. When a listener is the source of the source, Connor notes,
    the voice serves to engage and utilize the senses of hearing and seeing, but in
    its ability to “put its source in question” the voice may also keep them separate
    (43). If it is “a means both of integration and disturbance” (43), I would suggest,
    a voice with an unexpected source, or a source with an unexpected voice, unlike
    the ventriloquist, sounds from a body that is identifiable as human. But such
    a voice has already a life, first embodied in an originating singer and then disembodied
    by the audiocentric recording processes of music consumption, or even, in the
    case of Elvis, it is then re-embodied, a kind of intangible organ transplant in
    the impersonator. In this process, the shuffling of bodies and voices can produce
    more than an entertaining gimmick. When a human body, like that of the ventriloquist’s
    dummy, is not expected to speak, let alone—a subaltern body, a disembod—it is
    perhaps strategic to take on the voices of others to be heard.


