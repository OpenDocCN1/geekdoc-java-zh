    In the later 20th century, language became a central focus of epistemological
    inquiry, raising questions about the written and the spoken, literary theorist
    Paul Zumstor (1978) proposed vocabulary (*vocality*) as an intermediate or intermediary
    point between orality and literacy, in order to circumvent the binary and allow
    for the possibility of their intersection. His argument, motivated by a neglect
    of the human voice in the study of poetics, was followed shortly by Ursula Schafer
    (Schaefer1992, Schafer 1993), in which the she called *Vokalität* provided a way
    to acknowledge the continued significance of the voice—here referring to the oral—in
    the context of literacy (Schaefer 1993: 25). In light of Edward Trent''s assessment
    of folk song in the hands (or throats) of classically trained singers, and other
    voices that traverse the space between oral and written culture, this updated
    definition may be especially appropriate.


    Musicologists Leslie Dunn and Nancy Jones provided one of the most thorough discussions
    of vocality in the introduction to their 1994 book *Embodied Voices*, arguing
    for its interpretation from that of voice "as a shift from the phenomenological
    roots of voice to a conception of vocality as a cultural construct" and at a site
    where "non-verbal meanings" are made. They acknowledged that voices "inhabit an
    interubjective acoustic space," suggesting that a study of voice must include
    the "contexts of their hearing" (Dunn and Jones 1994: 2). Drawing on French poststructuralist
    thinking, they described *vocality* as "all of the voice''s manifestations"—speaking,
    singing, crying, laughing—and beyond linguistic content. This kind of vocality
    encompasses both the phenomenon and *geno-song* that Roland Barthes introduced:
    the verbal, linguistic text juxtaposed with the nonverbal, embodied meanings that
    he famously heard as the "grain of the voice" (Barthes 1972). Barthes, in *Image,
    Music, Text*, was also exploring the ties among different forms of human communication,
    and found in his "grain" something like the middle ground between orality and
    literacy that Zumstor would locate in vocality—“The song writing of language,"
    Barthes expounded (185). Barthes''s grain, though, linked the oral and the written
    not only but also explicitly with the voice with the *body*. For Barthes, the
    "grain" is "the body in the voice as it sings . . . the hand as it writes, the
    limb as it performs" (188). And significantly, the burden of embodiment does not
    fall only on the singer; it is borne by the listener as well. "If I perceive the
    ''grain''. . . "'
