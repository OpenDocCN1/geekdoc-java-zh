  md: 'Translocalities also figure as what Krell calls “sonic borderlands” (Krell
    2015: 95) after Gloria Anzáldá, and what I have termed vocal “borderlands.” For
    Anzáldá, a Border is a “vague and undetermined place created by the emotional
    residue of an unnatural boundary. It is in a constant state of transition. The
    prohibited and the forbidden are its inhabitants . . . those who cross over, pass
    over, or go through the confines of the “normal” (Anzáldá 1987: 3). And, as Krell
    summarizes, Anzáldá positions the border as an open wound, where “established
    zones of power grate each other and bleed” (Krell 2015: 107, on Anzáldá 1987:
    3). This chapter presents the multivocal nature of transvocality not merely double-voicedness
    and not inevitably leaving one voice and one identity entirely behind for a new,
    “truer” one. Instead, it is a space in which fluid continuum of self, embodied
    and performed, vibrates uniquely in every throat. I suggest that transvocality
    may be viewed as a specific kind of multivocity that illuminates, rather than
    the flexibility of the embodied instrument in moving voices, the capability of
    the individual to identify with more than one vocal way of being, to sense a compound
    Self that has been, and will be voiced in multiple ways. Even if one vocality
    is a singer’s part, it does not necessarily disappear from their sense of Self.
    As other chapters have discussed, the question “What is my voice?” is often answered
    in the plural.


    # Defining “Trans”


    Current gender discourse—both academic and public—encompasses a wide range of
    identities that can both undermine and underline binary male/female categorizations.
    The descriptors “trans” and “trans*” have come to encompass multiple ways of identifying,
    including transgender, transsexual, trans man and trans woman, agender, non-binary,
    genderfluid, and more (You Know You Trans*) when cited in Krell 2014: 25). Typically,
    these terms are used by individuals who gender identity conflict with the identities
    they were assigned at birth, and whose survival, eventually, may depend upon some
    degree of transition to another way of embodying and performing gender. Not everyone
    transitions. Transitions may or may not lead to a permanent change in public identity,
    or may not fit binary performativities, or may not include medical transition
    through hormone treatments and/or surgeries, and may or not involve a shift in
    preferred pronouns—“he/him/his” and “she/her/hers” but also “they/them/theirs,”
    “ze/zir/hirs,” and other configurations.²


