    # Raise Your Voice


    On March 24, 2018, the reach of "Quiet" extended to a whole new resistance movement,
    when a Massachusetts high school choir sang it at the March For Lives in Washington,
    D.C. A nationwide protest led by students and supported in part by those responsible
    for the Women''s March, the March For Lives was one of series of national events
    after a gunman killed seventeen students at Marory Stoneman High School in Parkland,
    Florida. On the issues the young leaders of this movement raised, the capitulation
    of U.S. policymakers to the National Association featured prominently. Parkland
    survivor Emma González, in a public speech three days after the shooting, criticized
    President Trump for accepting $30 million in campaign contributions from the NRA.
    That amount was divided by the number of gun-violence deaths in the first weeks
    of 2018, González noted, each victim''s life was $5,800. "To every politician
    who is taking donations from the NRA, shame on you," she said (González 2018:n.p.).


    Studying gun-control discourse after the 2012 shooting that killed twenty-six
    at Sandy Hook Elementary School in Newtown, Connecticut, sociologists Luigi Esposito
    and Laura L. Finley pointed to the ways in which opposition to firearm policy
    reform is supported by, and intertwined with, neoliberal ideology. The "anti-stat
    individualism" that fuels gun rights advocacy, they observed, is tied to neoliberalism''s
    focus on competitive individualism, its rejection of "government" (for example,
    interference in the Second Amendment right to bear arms), and its prioritization
    of private responsibility over social justice (Esposito and Finley 2014: 75–76).
    In this political environment, the intersubjectivity of voice is illuminated in
    it as a counter-rational tactic against neoliberal hyperindividualism. This section
    of the chapter highlights the multivocality particular to a recent resistance
    movement, a multivocality that carries the burden of lost voices and works to
    move others to sound their own.


