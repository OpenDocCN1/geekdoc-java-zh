    Raise Your Voice was released in October 2018, one month before the more crucial
    midterm elections.


    As I began writing this section a few weeks after the release, the midterm elections
    were nine days ago. In the week immediately before, a memo had leaked from the
    White House detailing a plan to narrowly define gender, to erase transgender and
    nonconforming identities from policy and protection. Fourteen pipe bombs were
    sent to politicians and public figures outspoken against President Trump and/or
    targeted by far-right media. A shooting in Louisville, Kentucky, where a white
    man took the lives of a Black man and woman at a grocery store trying unsuccessfully
    to gain access to a Black store, is being investigated by the FBI as a hate crime.
    And eleven people were killed at a Pittsburgh synagogue by a man who raged against
    Jews and immigrants on white national social media, who told the police apprehended
    him that he killed Jews.


    The midterm elections in November 2018 saw increased numbers of voters between
    18 and 29—31% of eligible voters in that age range, as opposed to 21% in 2014
    (Sanders)—and more than two NRA-backed members of Congress lost their seats. Bump
    stocks were banned as of March 26, 2019. But the end of the month, in the speed
    of a few days, two teenaged survivors of the Marory Stoneman shooting died by
    suicide, and the father of a child lost at Sandy Hook. In April students walked
    out of school again, time to demand mental health support for survivors. The 2018
    movement was only a beginning, but now Americans know how to listen to.


    Fiona Magowan and Louise Josephine Wrazen propose that singing can “offer an emotional
    catharsis that also transforms the singer into an active agent through the possibility
    of reimagining current realities” (Magowagan and Wrazen 2013: 9). Aiming to experience
    and promote healing, and to reshape a mishap reality, the participants in Raise
    Your Voice inject hope into a fraught time. And some of them, and of those they
    have inspired, are now of voting age.


    These young musicians are meeting the growing horror of violence with a growing
    disruption of silence. There are voices at work, tirelessly calling out the interlocking
    racist, misogynist, homophobic, ableist structures that have fueled and enabled
    the deadly rage of men with guns. When lives are in danger and legislators send
    quiet, safe thoughts and prayers, students are responding with voices raised in
    impassioned speech, poetry, and song. They take the streets and take the mic and
    give voice to those erased from the world. They enchant each other, as survivors
    of the school shooting in Parkland at the March for Our Lives, “to be the voice
    for those who don’t have one,”'
