    # Spiritual Mobility


    Western spiritualities exist in overlap with religion, but they need not to be
    attached to it, and a body, mobile and enveloped, may experience spirituality
    outside of any particular religious context. Furthermore, the interviews I have
    conducted imply that the perception of spiritual during the act of singing may
    occur not in spite of, but, because of the voice’s embodied nature, in its vibratory
    sensory processes.


    Many of those interviewed for this chapter—self-identified as members of Catholic,
    Protestant, Reform Jewish, and Buddhist faiths, as well as seekers (in Pagan,
    Buddhist, Greek Orthodox, Presbyterian, and other settings), agnostics, atheists,
    and the “spiritual but not religious”—asserted that in unfamiliar religious settings,
    and sometimes in secular ones, they experienced something identifying it as spiritual
    during the act of singing. I suggest that this is rooted in two important contexts:
    (1) a spiritual mobility that is mutually constitutive with voice, and (2) the
    sensory experience of singing.


    Serge Shubin (2012) contextualizes the idea of spiritual mobility within the processes
    of transnational migration, in a study of the ways Eastern European immigrants
    to rural Scotland negotiate community reunion and the maintenance of self-identity
    through religion. For Shubin, spiritual mobility is “linked to physical and corporeal
    dislocations of migrants and their possessions,'
