  md: 'My body is a body of songs,


    voices to sing them.


    I''m Lucinda Williams under my breath along the cacophony of a music-school corridor,
    when a choral rehearsal washes over me. I can find no card for the piece in the
    catalog of me, but without permission, my prodigal soprano escapes of its own
    accord outside the hall. It knows the score, and it strains to sound and not be
    heard.


    This voice remembers me. I recognize it like a second spine I''d forgotten, holding
    me up all my life silenced and embedded in my flesh. It will take me an hour to
    think of Bruckner. The choir falls silent and I carry the song, in my portmanteau
    voice, home.'
