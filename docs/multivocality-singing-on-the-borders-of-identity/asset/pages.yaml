- pgno: 18
  md: '# INTRODUCTION 11


    Barthes wrote, “I am determined to listen to my relation with the body of the
    man or woman singing” (188; my emphasis). That relationship between the singer
    and the listener is another crucial theme in the study of vocality. In an application
    of linguistic anthropology that recalls Rousseau’s language device, Steven Feld
    at chart vocality as a site where music and language meet, serving among the body’s
    primary technologies of difference—where human beings first learn to hear distinct
    individualities, to aurally separate our voices from others’ (Feld 2004).


    Psychologist Marie-Cécile Bertau and philosopher Volker Schürmann, deate the relative
    significance of both material and abstract conceptions of vocality. Bertau recalls
    psychologist Vygotsky’s assertion that “Through others, we become ourselves” (Vygotsky
    1998); and that one must “go through” others—must be mediated by others—to reach
    a sense of self (Bertau 2008b: 124). In other words, vocality (as Eidsheim observes)
    must be received and interpreted by others in order to identify. Schürmann reasons
    that the identity of vocality as “principle,” an abstraction or as a metaphor,
    is vital if it were only material, then people who live and communicate non-vocally
    or nonverbally—the example of the Deaf community—would have no self, an idea that
    is clearly false (Schürmann 2008). This is, of course, also an idea that has heavy
    force in the oppression of Deaf/disabled people, including non-speaking or other
    disabilities whose voices are sometimes out of voluntary control. Audible speech
    perceived as intelligibles has long been, problematically, associated with cognitive
    and agentive competence.


    Perhaps most significantly for the purposes of this book, Holly Patch and Tomke
    König (2018) emphasize vocality as lived experience. Framing the voices of transgender
    singers within Karen Barad’s model of the phenomenon as “ontological inseparability/entanglement
    of intra-acting ‘agencies’” (Barad 2007: 139; emphasis in original), they explain
    vocality as “the phenomenon that encompasses yet is irreducible to the following
    (non-exhaustive) intra-acting aspects of the vocal: physical, physiological, biological,
    representational, constructed, embodied, performative, and lived” (Patch and König
    2018: 32).


    Given all these interlaced frameworks, in this book I interpret vocality as an
    embodied act and a constructive process—as a way of singing reinscribed with the
    lived experience of vocal sounds (linguistic and extralinginguistic), practices,
    techniques, and meanings that factor into the making of culture and identity,
    and in the negotiation of power. Multivocality, then, denotes the performance
    of many such ways of singing, and highlights the breadth and depth of vocal intersubjectivity.'
