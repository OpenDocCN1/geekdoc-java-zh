    nusach” developed by Debbie Friedman in the late 20th century, a service may contain
    multiple vocalities in one space. Friedman’s liturgical music, first encapsulated
    in her 1972 folk-pop influenced service titled Sing unto God, originated when
    she worked in her early 20s as a counselor at a Wisconsin Reform Jewish summer
    camp. Judah M. Cohen wrote that the guitar-supported style known as “song leading”
    had become the preferred musical expression of Reform Jewish by the time Friedman
    was one of them in the 1960s, and she built on it to develop her own Jewish service.
    Friedman’s music quickly gained a place in Reform, Reconstructionist, Conservative,
    and even Orthodox synagogues, “song leading” had developed a parallel system of
    pedagogy and apprenticeship to the cantorate, with an articulated theoretical
    approach to worship, and prayer, an expanding repertoire, and an idiomatic sound
    (Cohen 2009: 219). That infused synagogues with vocal and guitar styles though
    its use often caused antagonism among traditionalists, is now embedded in Jewish
    participatory worship.


    Some synagogues combine older and newer styles, and even disparate vocalities.
    If there is a classically trained cantor, the cantor may pray in a conventional,
    operationally informed mode of singing, but lead the congregation with a different
    sound. Sometimes, as the Central Synagogue in New York City, a large congregation
    may hire multiple cantors, who pray in different styles. And some institutions,
    as the congregation in my hometown currently does, hold separate services for
    members who prefer more traditional prayer. Synagogues are accommodating not only
    a taste for tradition but also an aesthetic that may include vocality.


