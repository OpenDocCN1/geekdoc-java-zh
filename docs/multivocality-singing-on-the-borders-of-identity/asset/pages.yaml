    The idea of “self-entrepreneurship” implies that the subject is exercising intensified
    agency, when the voice is in some way controlled by another party, that agency
    is in question. In Dr. Dechain’s story resonate deeply embedded in western cultures—colonial
    anxieties about the nature and nurture of humanity, the encroachment of technology,
    by Otherness, the dangers of and the dangers to (especially women’s) bodies. This
    chapter addresses the transfer of voice control from one body to another in two
    particular contexts, drawing parallels between the sale of a voice to 21st-century
    digital thrill and the fictional ceding or appropriation of film.


    # The Soprano


    Voices of Rapture features the voices of solo singers classified by choral voice
    categories; Dr. Dechain is The Soprano. The producers at Soundindon distinguish
    their library from others, like the great juggernaut Vocaloid systems, saying
    that their package focuses on “true legato”—the provision of all those intervals
    means a consistently smoother, more human-sounding transition between pitches.
    Vocaloid voices capitalize on tend not to disguise their technological manipulation;
    the transitions between phonemes, their onset and offsets, can sound mechanical
    to listeners. It’s important to note that Voices of Rapture users cannot shape
    Dr. Dechain’s voice into lyrics not already recorded—a function Vocaloid does
    offer—and this leads composers to write a lot of vocalizations on vocals and to
    use some within the limitations of the pre-packaged poetry.


    Legato is only one of many ways in Soundindon emphasizes the humanization of their
    virtual voices. Nina Eidsheim (2009) writes about the humanizing marketing of
    Zero-G’s early Vocaloids (2003–2004), whose voice providers were profiled (in
    multiple senses of the word) in the product—packaging—for example, recording artist
    Miriam Stockley was pictured on her system’s box. Soundindon’s website offers
    biographical information and photographs of Dr. Dechain in the studio.


    In our first Facebook chat about Voices of Rapture, Dr. Dechain expressed anxiety
    about the images of her on the site and about sounds that had been sampled without
    her explicit knowledge. There are currently (as of 2017) fourteen demo tracks
    on Soundindon’s web page for Voices of Rapture: Soprano, created by'
