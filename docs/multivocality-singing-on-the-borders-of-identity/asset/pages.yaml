    # January 21, 2017


    The event known as the Women’s March on Washington, D.C., held on January 21,
    2017—the day after the inauguration of the 45th U.S. president—became a global
    network of protests involving an estimated 4 million in the United States and
    an estimated 300,000 in other countries (Chenoweth and Pressman 2017). Despite
    its popularity, it generated controversy from its early days. Its initial organizers
    were white, and the protest’s original name, “Million Women March,” was criticized
    for appropriating the previous work of Black women in a 1997 project protest;
    its subsequent title criticized for copying the 1963 March on Washington. The
    2017 march’s official platform had to be amended several times to address issues
    of inclusivity and especially the demand for a shift to focus on intersectional
    feminism, but even then many participants experienced marginalization. And in
    many activist communities for Black, queer, trans, disability, and sex workers’
    rights still feel that millions of women who had never protested were usurping
    and receiving credit for others’ work (Mostof 2017). (As of 2019, many of the
    “women’s marches” organized around the U.S. have disassociated from the original
    Women’s March organization.) Eventually, the 2017 project’s website offered a
    statement that concluded:


    We support the advocacy and resistance movements that reflect multiple and intersecting
    identities. . . . . We will not rest until women have parity and equity at all
    levels of leadership in society. We work peacefully while recognizing there is
    no true peace without justice and equity for all. (https://www.womensmarch.com/mission/)'
