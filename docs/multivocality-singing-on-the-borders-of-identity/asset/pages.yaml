  md: '# 2 MULTIVOCALITY


    acclaimed podcast from the Metropolitan Opera and New York''s WQXR. She has brought
    extensive public attention to the African origins of the banjo, after Yunina Barbour-Payne
    has called, after Frank X Walker, the significance of Affrilachian music (Walker
    2008, cited in Barbour-Payne 2016), and the history of Black and white traditions
    in the rural US. Her first solo album, Tomorrow Is My Turn, like Many Voices,
    contained string band songs, and country music.


    Each track on Many Voices featured singing generated by the same physiological
    apparatus in the same body, shaped and adjusted according to the aesthetics of
    each musical genre and style. But if a similarity constituting "Rhiannon Giddens''
    voice" remained the vehicle all of these, how might the plurality declared in
    the title be accounted for? In western discourse, a singer''s voice is often described
    as if it were a static possession, as if it suited to only one fixed repertory
    or content ("she has an operatic voice" or "she has a country voice") while the
    realities of singing in the post-colonial, continuously glazing, continuously
    commodifying 21st century may allow—even require—movement and the plasticity to
    cross boundaries.


    Those boundaries of genre and identity are complicated in Ms. Giddens'' life,
    as she is in the lives of many Americans. With a white father, a mother of African
    American and Oceaneichi Native American heritage, with her Welsh-derived name,
    the cultural influences of her youth in North Carolina, her classical vocal training,
    Ms. Giddens balanced her classically trained father''s voice for 1960s folk revival
    repertoire balanced a complex web of cultural relationships with interlocking
    systems of oppression. Her parents'' marriage occurred shortly after the 1967
    Loving v Virginia caused de anti-segregation laws, though her father was disinherited
    for his decision (John 2018). They divorced and Ms. Giddens grew up "spending
    equal time" (Davidson 2017) between her parents and their respective white and
    Black identities. And though she does not present herself as Native American,
    in high school she also did to explore the music of that heritage as part of a
    powwow drum. Then, for the years in the 1990s, she was not permitted to venture
    outside of western classical music. But after college she became serious about
    old-time and Celtic traditional music (Scottish and Irish), and blues. Her explorations
    were not without conflict. She has said that before she began to learn from Black
    fiddler Joe Thompson, and before the Carolina Chocolate Drops were formed, she
    felt like I was "sneaking into this music that wasn''t mine.". The persistent
    cultural discourse that has segregated string band music as white and blues as
    Black "led to me feeling like an alien in what I find out is my own cultural tradition"
    (Giddens 2017). She has dedicated years to rediscovering and sharing that tradition.
    Today, Ms. Giddens is one of the world''s foremost performers and historians of
    Black string band, vocal, banjo, and fiddle traditions.'
