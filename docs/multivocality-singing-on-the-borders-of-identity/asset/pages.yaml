    # # Finding a Voice


    Find your own voice & use it


    Use your own voice & find it

    —Jayne Cortez, “Find Your Own Voice” (1994)


    In opera, Wayne Koestenbaum wrote, “The singer’s face is called a mask, as if
    a voice were never capable of telling the truth” (Koestenbaum 1993: 154). Western
    classical vocal pedagogy indeed often recognizes the upper half of the face as
    “the mask”—where a Venetian Carnival disguise might perch—and the location where
    a larger portion of vibratory sensations optimally be felt. Though this is a culturally
    specific view, Koestenbaum’s play on words resonates in any discussion of voice
    and identity. If all vocalities, like implement, involve a fundamental element
    of performativity, their truths can most effectively be viewed in relative terms.
    Ironically, within the variable constraints of individual bodies, singers often
    explore the changeable nature of the voice in search of deeply embedded, unchanging
    authentic self. But even if, as Deborah Cameron observes, “voices are made, rather
    than born” (Cameron 2001: 84, cited in Preston 2016: 48), singers often arise
    at a *feeling of genuine vocal identity. Only, as Katherine Preston has pointed
    out, “genuine does not mean the same as ‘unswilled’” (Preston 2016: 48). This
    chapter examines some of the directions in which singers will be in their search
    for self, and the process of branding itself in the neoliberal music market.


    Ultimately, finding a voice in that market means following a course prescribed
    for the neoliberal subject, whom Türken et al. “increasingly constructed as a
    free, individualized, self-regulating actor understood as a source of capital;
    human capital” and as an entrepreneur of the self (Türken et al. 2016: 34). In
    order to maximize one’s value, neoliberal subjectivity demands continuous self-development,
    self-monitoring, and self-improvement (34). “Largely responsible for their own
    successes and failures,” Türken et continue, “the individual’s wellbeing and development
    becomes the sole responsibility of the neoliberal entrepreneurial subject” (34).
    Most significantly, self-improvement helps the subject to fill the requirements
    of a “flexible and unstable market” (Türken et al. 2016: 34, after Olssen 2006).
    I suggest here that late 20th- and 21st-century discourses of singing having highlighted
