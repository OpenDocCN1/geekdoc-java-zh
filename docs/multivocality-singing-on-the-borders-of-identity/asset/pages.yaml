  md: '# Introduction


    (I am large, I contain multitudes.)


    > —Walt Whitman, "Song of Myself"


    A foggy San Francisco day in 2004, I sat in an empty hallway with a fellow conservatory
    alumna, passing time until auditions began for the fourth season of American Idol.
    We belted out Appalachian ballads and traded tunes sharing her fiddle, against
    a sonic background of nervous would-be pop stars warming up. Though our paths
    had crossed in college, I hadn''t met her until a mutual friend invited her to
    join us at the auditions—I was tagging along while they sang, cattle-call covers
    in front of a judging panel. After we left the stadium, she gave me an autographed
    copy of her just-completed demo album, which she titled Many Voices. The name
    referenced album''s collection of heterogeneous sounds and stories across western
    classical, blues, pop, and Scottish traditions, and the high penchant for trying
    and out different voices she made, she later told me, the "supreme imitator,"
    and by the time she finished her studies in opera, her musical flexibility had
    left her struggling with, "What is my voice?" Many Voices, said later in retrospect,
    her way of turning what could have been an identity crisis into an advantage in
    the music industry (Interview, November 3, 2012). And it turned out to be an advantage.
    American Idol''s judges turned her away from the pop competition''s 2005 season,
    but only a few years later Rhiannon Giddens becoming a famous member of the Grammy
    Award-winning singer band the Carolina Chocolate Drops, then a celebrated solo
    artist, an actress with a recurring role on the CMT series Nashville, was tapped
    to star in a Broadway show, and in 2018 she was the recipient of a MacArthur fellowship
    and


    ¹ By 2018, she released her first two albums, performed on tours that included
    The Late Show with David Letterman, nominated for solo Grammy awards, performed
    on Austin City Limits, and other awards, the Steve Martin Prize for Excellence
    in Blue and Grassgrass. In 2016 she was hired to replace Along on Broadway when
    McDonald left for maternity leave, but those show closed. She portrayed a recurring
    character on Nashville''s final seasons, In 2019, she released Songs of Our Native
    Daughters with Leyla McCalla, Amythyst Kiah, and Allison Russell, as there is
    No Other with Francesco Turrisi.


    Multivacity. Katherine Meisel, Oxford University Press (2020). © Oxford University
    Press. DOI: 10.1093/9780190621469.003.001'
