    But this rhetorical voice has not been fully, meaningfully recognized in western,
    colonizing, capitalist cultures. To Nick Couldry, writing on what he identifies
    as the pressing 21st-century “crisis of voice” (see this book’s introduction),
    voice is the “normative domain that neoliberal doctrine casts into shadow”—voices
    of a diversity of people pushed aside in favor of which supports a market-centered
    political, social, and economic system (effectively, colonization of civil rights
    by the market) (Couldry 2010: 103). Nevertheless, rhetorical offers of voice constitute
    a common neoliberal—and authoritarian—populist—practice. Donald Trump, advocate
    of a neoliberal world order, proclaimed to his followers upon his Republican nomination
    for the U.S. presidency; “I am your voice.” On January 25, 2017, five days after
    his inauguration, he demonstrated exactly whose voice he wanted when he signed
    an executive order that led to the establishment of the Victims of Immigration
    Crime Enforcement, or VOICE (https://www.ice.gov/voice), as part of his administration’s
    pursuit of undocumented immigrants.


    Facing renewed on the agency, and even the existence, of non-white immigrants,
    of women, LGBTQ + people of color, non-Christians, and disabled people, many Americans
    have responded by raising their voices. Those voices have sounded individually
    and on the street, on the air, and online. Nick Cooley’s model of voice is inclusive
    of these multiple modes: “Voice,” he suggests, “requires a material form which
    may be individual, collective, or distributed” (Couldry 2010: 9; my emphasis).
    The individual form of voice retains its insubjectivity. It is also recognizable
    in a collective voice (a person must recognize his or her individual voice in
    a collective political activity, considering anthropologist Jeffrey Juris’s description
    of a network that demonstrates social reorganization “based on horizontal collaboration,
    participatory democracy, and coordination through authority and diversity” (Juris
    2008: 17, cited in Couldry 2010: 102).


    In the late 2000s, Americans have met a surge in political, legislative, and physical
    violence with a surge of silence. There are voices at work, tirelessly calling
    out the interlocking race, misogynist, homophobic, ableist structures that have
    fueled and enabled the continuation of oppression. When are in danger and legislators
    send safe thoughts and prayers, U.S. communities are responding with voices raised
    in speech, poetry, and song. They take to the streets and take the mic and they
    give voice to those erased from the world—gagged, stifled, strangled, torn apart
    by bullets. They treat each other, as survivors of the 2018 school shooting in
