    can be effects from hormone treatments, but the size of the larynx and thus vocal
    range are not impacted. Some must content with a different kind of duality, in
    which listeners hear a typically masculine voice emanating a feminine being. In
    some cases that stability benefits a singer—fans of Laura Jane Grace, of the Athens
    band against Me!, have remained supportive following her recently published transition,
    and reviews of her work frequently note that “sounds the same as ever” (Edwards
    2014). Ethnomusicologist Revell Carr has written about the late singer Louisa
    Killen, renowned as a male sea chant performer, and who only in 2010 at the age
    of 76 began living and performing publicly as a woman. In the sea-music subculture,
    where authenticity has habitually been located in masculinity, the reception of
    Killen''s female identity was mixed.'
