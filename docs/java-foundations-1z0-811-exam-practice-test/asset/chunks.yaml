    \ = java.lang.Math.exp(a, b);`\n**INCORRECT**: `double result = java.lang.Math.exp(b,\
    \ a);`\n**CORRECT**: `double result = java.lang.Math.pow(a, b);`\n**INCORRECT**:\
    \ `double result = java.lang.Math.pow(b, a);`\n\n---\n\n**OBJECTIVE**: 07b - Use\
