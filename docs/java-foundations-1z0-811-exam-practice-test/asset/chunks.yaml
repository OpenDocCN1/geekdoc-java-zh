  trans: "\n\n# 问题 49\n`String` 类的哪种方法返回一个除了头部和尾空格的字符串副本？选择正确的答案：\n\nA. `removeSpace()`\
    \ (错误)\nB. `removeWhiteSpace()` (错误)\nC. `split()` (错误)\nD. `trim()` (正确)\nE.\
    \ `withoutSpace()` (错误)\n\n**目标：** 06a - 开发使用 `String` 类方法的代码\n**参考文献：**\n* [Java\
