  trans: "\n\n# 问题 41\n\n在第 4 行可以放置什么，使得程序的输出为 `Message = 5`？请选择 2 个正确答案。每个答案代表一个完整的解决方案。\n\
    \n```java\nclass ExamPrep {\n  public static void main(String[] args){\n    int\
    \ a = 5;\n    // LINE 4\n  }\n  static void printMessage(String message) {\n \
    \   System.out.println(\"Message = \" + message);\n  }\n}\n```\n\n选择正确答案：\nA.\
    \ `printMessage(a);` 错误\nB. `printMessage(a.toString());` 错误\nC. `printMessage((String)a));`\
    \ 错误\nD. `printMessage(String.valueOf(a));` 正确\nE. `printMessage(Integer.toString(a));`\
    \ 正确\n\n---\n\n**目标:** 06a - 开发使用 `String` 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/converting.html`](https://docs.oracle.com/javase/tutorial/java/data/converting.html)\n\
    \n---\n\n# 问题 42\n\n在第 4 行可以放置什么，使得程序的输出为 `v`？请选择正确答案：\n\n```java\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    String s = \"Java\";\n   \
    \ // LINE 4\n    System.out.println(result);\n  }\n}\n```\n\n选择正确答案：\nA. `char\
    \ result = s[2];` 错误\nB. `char result = s[3];` 错误\nC. `char result = s.charAt(2);`\
    \ 正确\nD. `char result = s.charAt(3);` 错误\n\n---\n\n**目标:** 06a - 开发使用 `String`\
    \ 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/manipstrings.html`](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n---\n\n# 问题 43\n\n在第 4 行可以放置什么，使得程序的输出为 `av`？请选择正确答案：\n\n```java\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    String s = \"Java\";\n   \
    \ // LINE 4\n    System.out.println(result);\n  }\n}\n```\n\n选择正确答案：\nA. `String\
    \ result = s.split(1, 2);` 错误\nB. `String result = s.split(1, 3);` 错误\nC. `String\
    \ result = s.substring(1, 2);` 错误\nD. `String result = s.substring(1, 3);` 正确\n\
    \n---\n\n**目标:** 06a - 开发使用 `String` 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/manipstrings.html`](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n---\n\n# 问题 44\n\n以下程序的输出是什么？\n\n```java\nclass ExamPrep {\n  public static\
    \ void main(String[] args){\n    String s = \"Java\";\n    int result = s.indexOf(\"\
    a\");\n    System.out.println(result);\n  }\n}\n```\n\n选择正确答案：\nA. -1\nB. 0\n\
    C. 1 正确\nD. 2\nE. 3\nF. 4\nG. 此程序无法编译\nH. 此程序将抛出异常\n\n---\n\n**目标:** 06a - 开发使用\
    \ `String` 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/manipstrings.html`](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n---\n\n# 问题 45\n\n以下程序的输出是什么？\n\n```java\nclass ExamPrep {\n  public static\
    \ void main(String[] args){\n    String s = \"Java\";\n    int result = s.indexOf(\"\
    x\");\n    System.out.println(result);\n  }\n}\n```\n\n选择正确答案：\nA. -1 正确\nB. 0\n\
    C. 1\nD. 2\nE. 3\nF. 4\nG. 此程序无法编译\nH. 此程序将抛出异常\n\n---\n\n**目标:** 06a - 开发使用 `String`\
    \ 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/manipstrings.html`](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n---\n\n# 问题 46\n\n以下程序的输出是什么？\n\n```java\nclass ExamPrep {\n  public static\
    \ void main(String[] args){\n    String s = \"Java\";\n    int result = s.lastIndexOf(\"\
    a\");\n    System.out.println(result);\n  }\n}\n```\n\n选择正确答案：\nA. -1\nB. 0\n\
    C. 1\nD. 2\nE. 3 正确\nF. 4\nG. 此程序无法编译\nH. 此程序将抛出异常\n\n---\n\n**目标:** 06a - 开发使用\
    \ `String` 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/manipstrings.html`](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n---\n\n# 问题 47\n\n以下程序的输出是什么？\n\n```java\nclass ExamPrep {\n  public static\
    \ void main(String[] args){\n    String s = \"Java Exam Prep\";\n    boolean result\
    \ = s.contains(\"exam\");\n    System.out.println(result);\n  }\n}\n```\n\n选择正确答案：\n\
    A. true\nB. false 正确（记住：字符串比较是区分大小写的！）\nC. -1\nD. 4\nE. 此程序无法编译\nF. 此程序将抛出异常\n\
    \n---\n\n**目标:** 06a - 开发使用 `String` 类方法的代码\n**参考文献:**\n* [`docs.oracle.com/javase/tutorial/java/data/manipstrings.html`](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n---\n\n# 问题 48\n\n`String` 类的哪个方法返回一个转换为小写的字符串副本？\n\n选择正确答案：\nA. `toLower()`\n\
    B. `toLowerCase()` 正确\nC. `asLower()`\nD. `asLowerCase()`\nE. `lower()`\n\n"
- fmt: "\n# QUESTION 49\nWhich method of the `String` class returns a copy of the\
    \ string with leading and trailing white space removed? Choose the correct answer:\n\
    \nA. `removeSpace()` (INCORRECT)\nB. `removeWhiteSpace()` (INCORRECT)\nC. `split()`\
    \ (INCORRECT)\nD. `trim()` (CORRECT)\nE. `withoutSpace()` (INCORRECT)\n\n**OBJECTIVE:**\
    \ 06a - Develop code that uses methods from the `String` class\n**REFERENCES:**\n\
    * [https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html](https://docs.oracle.com/javase/tutorial/java/data/manipstrings.html)\n\
    \n# QUESTION 50\nWhich of the following lines of code can be used to determine\
    \ if the content of a `String` variable `s` starts with \"java\"? Choose the correct\
    \ answer:\n\nA. `boolean result = s.beginsWith(\"java\");` (INCORRECT)\nB. `boolean\
    \ result = s.hasPrefix(\"java\");` (INCORRECT)\nC. `boolean result = s.startsWith(\"\
    java\");` (CORRECT)\nD. `boolean result = s.prefixEquals(\"java\");` (INCORRECT)\n\
    \n**OBJECTIVE:** 06a - Develop code that uses methods from the `String` class\n\
    **REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/java/data/comparestrings.html](https://docs.oracle.com/javase/tutorial/java/data/comparestrings.html)\n\
    \n# QUESTION 51\nWhich method of the `String` class returns the length of the\
    \ string? Choose the correct answer:\n\nA. `length()` (CORRECT)\nB. `size()` (INCORRECT)\n\
    C. `capacity()` (INCORRECT)\nD. `getLength()` (INCORRECT)\nE. `getSize()` (INCORRECT)\n\
    F. `getCapacity()` (INCORRECT)\n\n**OBJECTIVE:** 06a - Develop code that uses\
    \ methods from the `String` class\n**REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/java/data/strings.html](https://docs.oracle.com/javase/tutorial/java/data/strings.html)\n\
    \n# QUESTION 52\nWhat can you add at LINE 5 to make the program print `JavaExam`?\n\
    \n```java\nclass ExamPrep {\n  public static void main(String[] args){\n    String\
    \ a = \"Java\";\n    String b = \"Exam\";\n    // LINE 5\n    System.out.println(result);\n\
    \  }\n}\n```\nChoose 2 correct answers. Each answer represents a complete solution.\n\
    \nA. `String result = a + b;` (CORRECT)\nB. `String result = a & b;` (INCORRECT)\n\
    C. `String result = a.concat(b);` (CORRECT)\nD. `String result = b.concat(a);`\
    \ (INCORRECT)\nE. `String result = String.concat(a, b);` (INCORRECT)\n\n**OBJECTIVE:**\
    \ 06a - Develop code that uses methods from the `String` class\n**REFERENCES:**\n\
    * [https://docs.oracle.com/javase/tutorial/java/data/strings.html](https://docs.oracle.com/javase/tutorial/java/data/strings.html)\n\
    \n# QUESTION 53\nWhat can you add at LINE 4 to make the program print `Percent\
    \ Complete = 56.79`?\n\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    double a = 56.785;\n    // LINE 4\n    System.out.println(result);\n\
    \  }\n}\n```\nChoose the correct answer:\n\nA. `String result = String.format(\"\
    Percent Complete = %d\", a);` (INCORRECT)\nB. `String result = String.format(\"\
    Percent Complete = %.2d\", a);` (INCORRECT)\nC. `String result = String.format(\"\
    Percent Complete = %f\", a);` (INCORRECT)\nD. `String result = String.format(\"\
    Percent Complete = %.2f\", a);` (CORRECT)\nE. `String result = String.format(\"\
    Percent Complete = %s\", a);` (INCORRECT)\nF. `String result = String.format(\"\
    Percent Complete = %.2s\", a);` (INCORRECT)\n\n**OBJECTIVE:** 06b - Format Strings\
    \ using escape sequences including `%d`, `%n`, and `%s`\n**REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/java/data/numberformat.html](https://docs.oracle.com/javase/tutorial/java/data/numberformat.html)\n\
    \n# QUESTION 54\nWhat can you add at LINE 6 to print the values of `a`, `b`, and\
    \ `c` on separate lines, using the newline character that is appropriate for the\
    \ platform?\n\n```java\nclass ExamPrep {\n  public static void main(String[] args){\n\
    \    int a = 1;\n    int b = 2;\n    int c = 3;\n    // LINE 6\n    System.out.println(result);\n\
    \  }\n}\n```\nChoose the correct answer:\n\nA. `String result = String.format(\"\
    %d%n%d%n%d\", a, b, c);` (CORRECT)\nB. `String result = String.format(\"%d\\n%d\\\
    n%d\", a, b, c);` (INCORRECT)\nC. `String result = String.format(\"%d\\r\\n%d\\\
    r\\n%d\", a, b, c);` (INCORRECT)\nD. `String result = String.concat(a, b, c);`\
    \ (INCORRECT)\n\n# QUESTION 55\nWhat can you add at LINE 6 so that the program\
    \ will print `Java Prep`?\n\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    String a = \"Java\";\n    String b = \"Exam\";\n    String c = \"\
    Prep\";\n    // LINE 6\n    System.out.println(result);\n  }\n}\n```\nChoose the\
    \ correct answer:\n\nA. `String result = String.format(\"%d %d %d\", a, b, c);`\
    \ (INCORRECT)\nB. `String result = String.format(\"%s %s %s\", a, b, c);` (CORRECT)\n\
    C. `String result = String.format(\"%n %n %n\", a, b, c);` (INCORRECT)\nD. `String\
    \ result = String.format(\"%a %b %c\");` (INCORRECT)\n\n# QUESTION 56\nYou run\
    \ the following program:\n\n```java\nimport java.util.Random;\n\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    Random r = new Random(23);\n\
    \    int a = r.nextInt(100);\n    int b = r.nextInt(100);\n  }\n}\n```\n"
