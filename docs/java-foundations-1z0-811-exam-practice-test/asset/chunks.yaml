    \ Java when it is run?\n\nChoose the correct answer:\n\nA. `class ExamPrep {\n\
    \  public void main() {\n    System.out.println(\"Hello Java\");\n  }\n}`\n**INCORRECT**\n\
    \nB. `class ExamPrep {\n  public void main(String[] args) {\n    System.out.println(\"\
    Hello Java\");\n  }\n}`\n**INCORRECT**\n\nC. `class ExamPrep {\n  public static\
    \ void main() {\n    System.out.println(\"Hello Java\");\n  }\n}`\n**INCORRECT**\n\
