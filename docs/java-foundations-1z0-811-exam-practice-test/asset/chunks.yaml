  trans: "\n\n![](img/image_rsrc55C.jpg)\n\n# 关于本书\n感谢您购买本书！\n\n书中的练习题旨在作为帮助您准备 [Java\
    \ 基础考试, 1Z0-811](https://education.oracle.com/java-foundations/pexam_1Z0-811)\
    \ 的工具。它包含的问题涵盖了考试目标中发布的每一个主题。\n\n为了获得最大的成功几率，强烈建议您将此练习题与培训、自学或其他准备方法结合使用，以确保您对考试将涵盖的所有主题都有坚实的理解。\n\
    \n## 反馈\n如果您觉得这本书对您有帮助，请考虑留下积极的评价，或在 Twitter 或 LinkedIn 上发布内容与他人分享。\n\n如果您想发送电子邮件，可以邮件至\
    \ feedback@getcertified.dev。\n\n## 祝您好运！\n再次感谢，祝您考试顺利！\n\n---\n\n### 第 1 题\n以下哪些是\
    \ Java 的特性？选择 3 个正确答案：\nA. 面对象\nB. 平台无关\nC. 上下文无关\nD. 单线程\nE. 多线程\n\n**第 1 题：**\n\
    以下哪些是 Java 的特性？选择 3 个正确答案：\nA. 面对象（正确）\nB. 平台无关（正确）\nC. 上下文无关（错误）\nD. 单线程（错误）\n\
    E. 多线程（正确）\n\n---\n\n## 目标: 01a - 描述 Java 的特性\n\n### 第 2 题\n哪种类型的应用程序**不能**使用\
    \ Java 创建？选择正确答案：\nA. 桌面应用\nB. Web 应用程序\nC. 移动应用\nD. 这些应用程序类型都无法使用 Java 创建\nE.\
    \ 所有这些应用程序类型都可以使用 Java 创建\n\n**第 2 题：**\n哪种类型的应用程序**不能**使用 Java 创建？选择正确答案：\nA.\
    \ 桌面应用（错误）\nB. Web 应用程序（错误）\nC. 移动应用（错误）\nD. 这些应用程序类型都无法使用 Java 创建（错误）\nE. 所有这些应用程序类型都可以使用\
    \ Java 创建（正确）\n\n---\n\n## 目标: 01b - 描述 Java 的现实世界应用\n\n### 第 3 题\n填空：\n__________\
    \ 提供了库、Java 虚拟机以及其他组件，供您运行用 Java 语言编写的 applet 和应用程序。它可以随应用程序一起分发，使其能够独立运行。选择正确答案：\n\
    A. Java 运行环境 (JRE)\nB. Java 执行环境 (JEE)\nC. 即时编译编译器 (JIT)\nD. Java 语言规范 (JLS)\n\
    \n**第 3 题：**\n填空：\n__________ 提供了库、Java 虚拟机以及其他组件，供您运行用 Java 语言编写的 applet 和应用程序。它可以随应用程序一起分发，使其能够独立运行。选择正确答案：\n\
    A. Java 运行环境 (JRE）（正确）\nB. Java 执行环境 (JEE）（错误）\nC. 即时编译编译器 (JIT）（错误）\nD. Java\
    \ 语言规范 (JLS）（错误）\n\n---\n\n## 目标: 02a - 描述 Java 开发工具包 (JDK) 和 Java 运行环境 (JRE)\n\
    参考资料：\n* [`docs.oracle.com/javase/7/docs/technotes/guides/index.html`](https://docs.oracle.com/javase/7/docs/technotes/guides/index.html)\n\
    \n### 第 4 题\n填空：\n__________ 包含了 JRE 加上命令行开发工具（如编译器和调试器），这些工具对于开发 applet 和应用程序是必要的或有用的。选择正确答案：\n\
    A. Java Servlet\nB. Java 开发工具包 (JDK)\nC. Java 编译器\nD. Java 命令行接口 (CLI)\nE. JAR\
    \ 文件\n\n**第 4 题：**\n填空：\n__________ 包含了 JRE 加上命令行开发工具（如编译器和调试器），这些工具对于开发 applet\
    \ 和应用程序是必要的或有用的。选择正确答案：\nA. Java Servlet（错误）\nB. Java 开发工具包 (JDK）（正确）\nC. Java\
    \ 编译器（错误）\nD. Java 命令行接口 (CLI）（错误）\nE. JAR 文件（错误）\n\n---\n\n### 第 5 题\n关于面向对象编程中的对象，以下哪些陈是**正确**的？选择\
    \ 2 个正确答案：\nA. 对象应该只用于表示现实世界的物理对象\nB. 对象使用字段来存储状态\nC. 对象提供方法来操作其内部状态\nD. 对象优化您的代码的性能\n\
    \n**第 5 题：**\n关于面向对象编程中的对象，以下哪些陈是**正确**的？选择 2 个正确答案：\nA. 对象应该只用于表示现实世界的物理对象（错误）\n\
    B. 对象使用字段来存储状态（正确）\nC. 对象提供方法来操作其内部状态（正确）\nD. 对象优化您的代码的性能（错误）\n\n---\n\n## 目标:\
    \ 02b - 描述面向对象编程的组件\n参考资料：\n* [`docs.oracle.com/javase/tutorial/java/concepts/object.html`](https://docs.oracle.com/javase/tutorial/java/concepts/object.html)\n\
    \n### 第 6 题\n在面向对象编程中，创建对象的蓝图或原型是什么？选择正确答案：\nA. 类 (Class)\nB. 实例 (Instance)\n\
    C. 结构体 (Struct)\nD. 类型 (Type)\nE. 变量 (Variable)\n\n**第 6 题：**\n在面向对象编程中，创建对象的蓝图或原型是什么？选择正确答案：\n\
    A. 类（正确）\nB. 实例（错误）\nC. 结构体（错误）\nD. 类型（错误）\nE. 变量（错误）\n\n---\n\n### 第 7 题\n考虑以下代码：\n\
    ```java\nclass MountainBike extends Bicycle\n```\n这是哪种面向对象概念？选择正确答案：\nA. 组合 (Composition)\n\
    B. 封装 (Encapsulation)\nC. 等幂性 (Idempotency)\nD. 继承 (Inheritance)\n\n**第 7 题：**\n\
    考虑以下代码：\n```java\nclass MountainBike extends Bicycle\n```\n这是哪种面向对象概念？选择正确答案：\n\
    A. 组合（错误）\nB. 封装（错误）\nC. 等幂性（错误）\nD. 继承（正确）\n\n---\n\n### 第 8 题\n你有以下接口：\n```java\n\
    interface Bicycle {\n    void changeCadence(int newValue);\n    void changeGear(int\
    \ newValue);\n    void speedUp(int increment);\n    void applyBrakes(int decrement);\n\
    }\n```\n如何定义一个可以在任何需要该接口的地方类？选择正确答案：\nA. class ACMEBicycle extends Bicycle {}\n\
    B. class ACMEBicycle implements Bicycle {}\nC. class ACMEBicycle : Bicycle {}\n\
    D. class ACMEBicycle { }\n\n**第 8 题：**\n你有以下接口：\n```java\ninterface Bicycle {\n\
    \    void changeCadence(int newValue);\n    void changeGear(int newValue);\n \
    \   void speedUp(int increment);\n    void applyBrakes(int decrement);\n}\n```\n\
    如何定义一个可以在任何需要该接口的地方类？选择正确答案：\nA. class ACMEBicycle extends Bicycle {}（错误）\nB.\
    \ class ACMEBicycle implements Bicycle {}（正确）\nC. class ACMEBicycle : Bicycle\
    \ {}（错误）\nD. class ACMEBicycle { }（错误）\n\n---\n\n### 第 9 题\n填空：\n__________ 是用于逻辑方式组织类和接口的命名空间。选择正确答案：\n\
    A. 容器 (Container)\nB. 依赖 (Dependency)\nC. JAR 文件 (JAR File)\nD. 包 (Package)\n\n"
- fmt: "\nA `__________` is a namespace for organizing classes and interfaces in a\
    \ logical manner. Choose the correct answer:\nA. Container (INCORRECT)\nB. Dependency\
    \ (INCORRECT)\nC. JAR File (INCORRECT)\nD. Package (CORRECT)\n\n***\n\n### OBJECTIVE:\
    \ 02b - Describe the components of object-oriented programming\nREFERENCES:\n\
    * [https://docs.oracle.com/javase/tutorial/java/concepts/package.html](https://docs.oracle.com/javase/tutorial/java/concepts/package.html)\n\
    \n#### QUESTION 10: You are creating a new Java program.\nWhich of the following\
    \ will print `Hello Java`? Choose the correct answer:\n\nA.\n```java\nclass ExamPrep\
    \ {\n  public void main(String[] args){\n    System.out.println(\"Hello Java\"\
    );\n  }\n}\n```\nB.\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\nC.\n```java\n\
    class ExamPrep {\n  public void Main(String[] args){\n    System.out.println(\"\
    Hello Java\");\n  }\n}\n```\n(correct: false) D.\n```java\nclass ExamPrep {\n\
    \  public static void Main(String[] args){\n    System.out.println(\"Hello Java\"\
    );\n  }\n}\n```\n\n**QUESTION 10 Result:**\nA.\n```java\nclass ExamPrep {\n  public\
    \ void main(String[] args){\n    System.out.println(\"Hello Java\");\n  }\n}\n\
    ```\n(INCORRECT)\nB.\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\n(CORRECT)\nC.\n\
    ```java\nclass ExamPrep {\n  public void Main(String[] args){\n    System.out.println(\"\
    Hello Java\");\n  }\n}\n```\n(correct: false INCORRECT)\nD.\n```java\nclass ExamPrep\
    \ {\n  public static void Main(String[] args){\n    System.out.println(\"Hello\
    \ Java\");\n  }\n}\n```\n(INCORRECT)\n\n***\n\n### OBJECTIVE: 02c - Describe the\
    \ components of a basic Java program\nREFERENCES:\n* [https://www.oracle.com/java/technologies/compile.html](https://www.oracle.com/java/technologies/compile.html)\n\
    \n#### QUESTION 11: You have created a simple Java program in a file called `hello.java`\
    \ with the following code:\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\nWhich command\
    \ can be used to compile this program, converting it into bytecodes, which are\
    \ platform-independent instructions for the Java VM? Choose the correct answer:\n\
    A. `java hello.java`\nB. `java -c hello.java`\nC. `java -jar hello.java`\nD. `javac\
    \ hello.java`\n\n**QUESTION 11 Result:**\nA. `java hello.java` (INCORRECT)\nB.\
    \ `java -c hello.java` (INCORRECT)\nC. `java -jar hello.java` (INCORRECT)\nD.\
    \ `javac hello.java` (CORRECT)\n\n***\n\n### OBJECTIVE: 02d - Compile and execute\
    \ a Java program\nREFERENCES:\n* [https://www.oracle.com/java/technologies/compile.html](https://www.oracle.com/java/technologies/compile.html)\n\
    \n#### QUESTION 12: You have created a simple Java program in a file called `hello.java`\
    \ with the following code:\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\nYou executed `javac\
    \ hello.java` and see that it produced a file called `ExamPrep.class` in the same\
    \ directory.\nWhich command can you use to execute the program and see the output\
    \ of `Hello Java`? Choose the correct answer:\nA. `java ExamPrep`\nB. `java ExamPrep.class`\n\
    C. `javac ExamPrep`\nD. `javac ExamPrep.class`\n\n**QUESTION 12 Result:**\nA.\
    \ `java ExamPrep` (CORRECT)\nB. `java ExamPrep.class` (INCORRECT)\nC. `javac ExamPrep`\
    \ (INCORRECT)\nD. `javac ExamPrep.class` (INCORRECT)\n\n***\n\n### OBJECTIVE:\
    \ 02d - Compile and execute a Java program\nREFERENCES:\n* [https://www.oracle.com/java/technologies/compile.html](https://www.oracle.com/java/technologies/compile.html)\n\
    \n#### QUESTION 13: Following the Java conventions, which of the following should\
    \ begin with an upper case? Choose 2 answers:\nA. `classes`\nB. `interfaces`\n\
    C. `local variables`\nD. `packages`\nE. `public methods`\n\n**QUESTION 13 Result:**\n\
    A. `classes` (CORRECT)\nB. `interfaces` (CORRECT)\nC. `local variables` (INCORRECT)\n\
    D. `packages` (INCORRECT)\nE. `public methods` (INCORRECT)\n\n***\n\n### OBJECTIVE:\
    \ 03a - Identify the conventions to be followed in a Java program\nREFERENCES:\n\
    * [https://www.oracle.com/java/technologies/javase/codeconventions.html](https://www.oracle.com/java/technologies/javase/codeconventions.html)\n\
    \n#### QUESTION 14: You are a software developer for `Example Corp` where you\
    \ are creating a new package. You need to come up with a name. Which line of code\
    \ follows the Java convention for naming packages?\nA. `ExampleCorp`\nB. `exampleCorp`\n\
    C. `CorpExample`\nD. `com.example`\nE. `example.com`\nF. `www.example`\n\n**QUESTION\
    \ 14 Result:**\nA. `ExampleCorp` (INCORRECT)\nB. `exampleCorp` (INCORRECT)\nC.\
    \ `CorpExample` (INCORRECT)\nD. `com.example` (CORRECT)\nE. `example.com` (INCORRECT)\n\
    F. `www.example` (INCORRECT)\nThe prefix of a unique package is always written\
    \ in all-lowercase and should be one of the top-level domain names.\n\n***\n\n\
    ### OBJECTIVE: 03a - Identify the conventions to be followed in a Java program\n\
    REFERENCES:\n* [https://www.oracle.com/java/technologies/javase/codeconventions.html](https://www.oracle.com/java/technologies/javase/codeconventions.html)\n\
    \n#### QUESTION 15: You are writing a function and need to declare a variable.\
    \ Which of these variable declarations will compile without an error? Choose the\
    \ correct answer:\nA. `String 100`\nB. `String _100`\nC. `String 100_`\nD. `None\
    \ of these are valid`\n\n**QUESTION 15 Result:**\nA. `String 100` (INCORRECT)\n\
    B. `String _100` (CORRECT)\nC. `String 100_` (INCORRECT)\nD. `None of these are\
    \ valid` (INCORRECT)\nIdentifiers can contain an underscore, but cannot start\
    \ with a digit.\n\n***\n\n### OBJECTIVE: 03a - Identify the conventions to be\
    \ followed in a Java program\nREFERENCES:\n* [https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
    \n#### QUESTION 16: You are writing a function and need to declare another variable.\
    \ Which of these variable declarations will compile without an error? Choose the\
    \ correct answer:\nA. `String 200`\nB. `String $200`\nC. `String 200$`\nD. `None\
    \ of these are valid`\n\n**QUESTION 16 Result:**\nA. `String 200` (INCORRECT)\n\
    B. `String $200` (CORRECT)\nC. `String 200$` (INCORRECT)\nD. `None of these are\
    \ valid` (INCORRECT)\nIdentifiers can contain a dollar sign, but cannot start\
    \ with a digit. Usually $ is reserved for automatically generated code, but it\
    \ is valid to be used as part of an identifier.\n"
