  trans: "\n\n## 问题 56\n\n你运行以下程序：\n\n```java\nimport java.util.Random;\n\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    Random r = new Random(23);\n\
    \    int a = r.nextInt(100);\n    int b = r.nextInt(100);\n    int c = r.nextInt(100);\n\
    \    System.out.printf(\"%d,%d,%d%n\", a, b, c);\n  }\n}\n```\n\n输出为 `27,48,83`。\n\
    \n如果你再次运行它，输出将是什么？请选择正确答案：\n\nA. `27,48,83`\nB. 另一组在 0（包含）到 100（不包含）之间的三个随机数\n\
    C. 此代码将无法编译\nD. 此代码将在运行时将抛出异常\n\n**正确**：传递给 `Random` 构造函数的种子 `23` 决定了调用 `nextInt()`\
    \ 返回的伪随机值的顺序。如果你使用相同的种子再次运行代码，将获得相同的数字序列。\n**错误**：另一组在 0（包含）到 100（不包含）之间的三个随机数\n\
    **错误**：此代码将无法编译\n**错误**：此代码将在运行时将抛出异常\n\n---\n\n**目标**：07a - 使用 `Random` 类\n**参考**：\n\
    * [`docs.oracle.com/javase/8/docs/api/java/util/Random.html`](https://docs.oracle.com/javase/8/docs/api/java/util/Random.html)\n\
    \n## 问题 57\n\n你运行以下程序：\n\n```java\nimport java.util.Random;\n\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    Random r = new Random();\n\
    \    int a = r.nextInt(100);\n    int b = r.nextInt(100);\n    int c = r.nextInt(100);\n\
    \    System.out.printf(\"%d,%d,%d%n\", a, b, c);\n  }\n}\n```\n\n输出为 `27,48,83`。\n\
    \n如果你再次运行它，输出将是什么？请选择正确答案：\n\nA. `27,48,83`\nB. 另一组在 0（包含）到 100（不包含）之间的三个随机数\n\
    C. 此代码将无法编译\nD. 此代码将在运行时将抛出异常\n\n**错误**：`27,48,83`\n**正确**：另一组在 0（包含）到 100（不包含）之间的三个随机数。当不带种子调用时，`Random`\
    \ 的构造函数将选择一个唯一的种子，导致每次运行代码时返回的伪随机值顺序不同。\n**错误**：此代码将无法编译\n**错误**：此代码将在运行时将抛出异常\n\
    \n---\n\n**目标**：07a - 使用 `Random` 类\n**参考**：\n* [`docs.oracle.com/javase/8/docs/api/java/util/Random.html`](https://docs.oracle.com/javase/8/docs/api/java/util/Random.html)\n\
    \n## 问题 58\n\n以下哪行代码可以获取变量 `a` 的绝对值？请选择正确答案：\n\nA. `int result = java.lang.Math.abs(x);`\n\
    B. `int result = abs(x);`\nC. `int result = java.lang.Math.absoluteValue(x);`\n\
    D. `int result = absoluteValue(x);`\nE. `int result = !x;`\n\n**正确**：`int result\
    \ = java.lang.Math.abs(x);`\n**错误**：`int result = abs(x);`\n**错误**：`int result\
    \ = java.lang.Math.absoluteValue(x);`\n**错误**：`int result = absoluteValue(x);`\n\
    **错误**：`int result = !x;`\n\n---\n\n**目标**：07b - 使用 `Math` 类\n**参考**：\n* [`docs.oracle.com/javase/8/docs/api/java/lang/Math.html#abs-int-`](https://docs.oracle.com/javase/8/docs/api/java/lang/Math.html#abs-int-)\n\
    \n## 问题 59\n\n你有以下 Java 程序：\n\n```java\nclass ExamPrep {\n  public static void\
    \ main(String[] args){\n    double a = 5.0;\n    double b = 2.0;\n    // LINE\
    \ 5\n    System.out.println(result);\n  }\n}\n```\n\n在 `LINE 5` 放置什么可以得到 `a` 的\
    \ `b` 次幂的结果？请选择正确答案：\n\nA. `double result = a ^ b;`\nB. `double result = b ^ a;`\n\
    C. `double result = java.lang.Math.exp(a, b);`\nD. `double result = java.lang.Math.exp(b,\
    \ a);`\nE. `double result = java.lang.Math.pow(a, b);`\nF. `double result = java.lang.Math.pow(b,\
    \ a);`\n\n**错误**：`double result = a ^ b;`\n**错误**：`double result = b ^ a;`\n**错误**：`double\
    \ result = java.lang.Math.exp(a, b);`\n**错误**：`double result = java.lang.Math.exp(b,\
    \ a);`\n**正确**：`double result = java.lang.Math.pow(a, b);`\n**错误**：`double result\
    \ = java.lang.Math.pow(b, a);`\n\n---\n\n**目标**：07b - 使用 `Math` 类\n**参考**：\n*\
    \ [`docs.oracle.com/javase/8/docs/api/java/lang/Math.html#pow-double`](https://docs.oracle.com/javase/8/docs/api/java/lang/Math.html#pow-double\n\
    \n## 问题 60\n\n可以使用 `java.lang.Math` 的哪个静态函数来返回两个值中的较小值？选择正确答案：\n\nA. `floor`\n\
    B. `lessThan`\nC. `min`\nD. `smallerOf`\n\n**错误**：`floor`\n**错误**：`lessThan`\n\
    **正确**：`min`\n**错误**：`smallerOf`\n\n---\n\n**目标**：07b - 使用 `Math` 类\n**参考**：\n\
    * [https://docs.oracle.com/javase/8/docs/api/java/lang/Math.html#min-double-double](https://docs.oracle.com/javase/8/docs/api/java/lang/Math.html#min-double-double\n\
    \n## 问题 61\n\n判断对或错：`java.lang.Math` 的 `random()` 方法返回一个 0（包含）到 100（不包含）之间的整数值？请选择正确答案：\n\
    \nA. `TRUE`\nB. `FALSE`\n\n**错误**：`TRUE`\n**正确**：`FALSE`。`java.lang.Math.random()`\
    \ 返回 `0.0`（包含）到 `1.0`（不包含）之间的 `double`。它第一次被调用时会创建一个伪随机数生成器，使用 `java.util.Random()`，随后的调用将使用该\
    \ `Random` 实例。\n\n---\n\n**目标**：07b - 使用 `Math` 类\n**参考**：\n* [`docs.oracle.com/javase/8/docs/api/java/lang/Math.html#random-`](https://docs.oracle.com/javase/8/docs/api/java/lang/Math.html#random-\n\
    \n## 问题 62\n\n你正在编写一个生成 0 到 1 之间随机数的程序，如果小于 .5，则打印“less than half”。你有以下代码：\n\n\
    ```java\nimport java.lang.Math;\n\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    double result = Math.random();\n    // LINE 6\n  }\n}\n```\n\n在\
    \ `LINE 6` 添加什么可以在随机数小于 .5 时打印“less than half”？请选择 2 个正确答案。每个答案都代表一个完整的解决方案：\n\
    \nA. \n```java\nif result < .5 {\n  System.out.println(\"less than half\");\n\
    }\n```\nB. \n```java\nif result < .5 then {\n  System.out.println(\"less than\
    \ half\");\n}\n```\nC. \n```java\nif (result < .5) {\n  System.out.println(\"\
    less than half\");\n}\n```\nD. \n```java\nif (result < .5) then {\n  System.out.println(\"\
    less than half\");\n}\n```\nE. \n```java\nif (result < .5) System.out.println(\"\
    less than half\");\n```\n\n**错误**：A\n**错误**：B\n**正确**：C\n**正确**：E\n\n"
