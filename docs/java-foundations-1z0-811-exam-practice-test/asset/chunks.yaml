    \n---\n\n### 问题 90\n在 `LINE 8` 处添加什么可以从 `ArrayList` 中删除 `\"First\"`？选择 2 个正确答案。每个答案代表一个完整的解决方案。\n\
    \nA. `a.delete(\"First\");` (错误)\nB. `a.delete(0);` (错误)\nC. `a.deleteAt(0);`\
    \ (错误)\nD. `a.remove(\"First\");` (正确)\nE. `a.remove(0);` (正确)\nF. `a.removeAt(0);`\
    \ (错误)\n\n```java\nimport java.util.*;\n\nclass ExamPrep {\n  public static void\
    \ main(String[] args) {\n    ArrayList<String> a = new ArrayList<String>();\n\
    \    a.add(\"Java\");\n    a.add(0, \"First\");\n    // LINE 8\n  }\n}\n```\n\n\
