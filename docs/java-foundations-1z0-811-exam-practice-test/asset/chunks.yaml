    \  }\n}\n```\n\nThe output is `27,48,83`.\n\nWhat will the output be if you run\
    \ it again? Choose the correct answer:\n\nA. `27,48,83`\nB. A different set of\
    \ three random numbers between 0 (inclusive) and 100 (exclusive)\nC. This code\
    \ will not compile\nD. This code will fail with an exception at runtime\n\n**INCORRECT**:\
    \ `27,48,83`\n**CORRECT**: A different set of three random numbers between 0 (inclusive)\
    \ and 100 (exclusive). When called without a seed, `Random`'s constructor will\
    \ choose a unique seed, resulting in a different order of pseudorandom values\
    \ to be returned each time the code is run.\n**INCORRECT**: This code will not\
