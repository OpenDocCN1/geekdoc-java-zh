    \ 10a - Identify syntax and logic errors\n\n**REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/getStarted/problems/index.html](https://docs.oracle.com/javase/tutorial/getStarted/problems/index.html)\n\
    \n### QUESTION 80\nAn exception is an event, which occurs during the execution\
    \ of a program, that disrupts the normal flow of the program's instructions. Which\
    \ of the following statements about Java Exceptions are TRUE? Choose 2 correct\
    \ answers:\n\nA. Exceptions can occur in one function, and caught using a `try-catch`\
    \ block in a function that called it or any function higher in the call stack.\
    \ (CORRECT)\nB. Exceptions must be caught using a `try-catch` block in the function\
    \ where they occur. (INCORRECT)\nC. Creating an exception object and handing it\
    \ to the runtime system is called raising an exception (INCORRECT)\nD. Creating\
    \ an exception object and handing it to the runtime system is called throwing\
    \ an exception (CORRECT)\n\n---\n\n### OBJECTIVE: 10b - Use exception handling\n\
    \n**REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/essential/exceptions/definition.html](https://docs.oracle.com/javase/tutorial/essential/exceptions/definition.html)\n\
    \n### QUESTION 81\nYou have the following program in a file called `hello.java`\
    \ that reads the contents of a file called `data.txt` and prints the number of\
    \ lines contained within it.\n\n```java\nimport java.nio.file.*;\nimport java.util.List;\n\
    \nclass ExamPrep {\n  public static void main(String[] args) {\n    Path path\
    \ = Path.of(\"data.txt\");\n    List<String> lines = Files.readAllLines(path);\n\
    \    System.out.println(lines.size());\n  }\n}\n```\n\nWhen you compile this program\
    \ using `javac hello.java`, you get the following error:\n```text\nhello.java:7:\
    \ error: unreported exception IOException; must be caught or declared to be thrown\n\
    \    List<String> lines = Files.readAllLines(path);\n                        \
    \                    ^\n1 error\n```\n\nYou have decided to add a `try/catch`\
    \ block to fix this error. Which code block below shows a syntactically correct\
    \ use of a `try/catch` block and will compile without error? Choose the correct\
    \ answer:\n\nA. \n```java\npublic static void main(String[] args) {\n  Path path\
    \ = Path.of(\"data.txt\");\n  try {\n    List<String> lines = Files.readAllLines(path);\n\
    \  } catch {\n    System.out.println(java.io.IOException.getMessage());\n  }\n\
    \  System.out.println(lines.size());\n}\n``` (INCORRECT)\n\nB. \n```java\npublic\
    \ static void main(String[] args) {\n  Path path = Path.of(\"data.txt\");\n  try\
