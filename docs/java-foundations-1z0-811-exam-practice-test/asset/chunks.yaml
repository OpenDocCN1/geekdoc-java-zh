  trans: "\n\n`__________` 是一个以逻辑方式组织类和接口的命名空间。请选择正确的答案：\nA. 容器（错误）\nB. 依赖（错误）\nC.\
    \ JAR 文件（错误）\nD. 包（正确）\n\n***\n\n### 目标: 02b - 描述面向对象编程的组件\n参考资料：\n* [`docs.oracle.com/javase/tutorial/java/concepts/package.html`](https://docs.oracle.com/javase/tutorial/java/concepts/package.html)\n\
    \n#### 第 10 ：你正在创建一个新的 Java 程序。\n以下哪一项将打印 `Hello Java`？请选择正确的答案：\n\nA.\n```java\n\
    class ExamPrep {\n  public void main(String[] args){\n    System.out.println(\"\
    Hello Java\");\n  }\n}\n```\nB.\n```java\nclass ExamPrep {\n  public static void\
    \ main(String[] args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\n\
    C.\n```java\nclass ExamPrep {\n  public void Main(String[] args){\n    System.out.println(\"\
    Hello Java\");\n  }\n}\n```\n(correct: false) D.\n```java\nclass ExamPrep {\n\
    \  public static void Main(String[] args){\n    System.out.println(\"Hello Java\"\
    );\n  }\n}\n```\n\n**第 10 题结果：**\nA.\n```java\nclass ExamPrep {\n  public void\
    \ main(String[] args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\n\
    （错误）\nB.\n```java\nclass ExamPrep {\n  public static void main(String[] args){\n\
    \    System.out.println(\"Hello Java\");\n  }\n}\n```\n（正确）\nC.\n```java\nclass\
    \ ExamPrep {\n  public void Main(String[] args){\n    System.out.println(\"Hello\
    \ Java\");\n  }\n}\n```\n（正确: false 错误）\nD.\n```java\nclass ExamPrep {\n  public\
    \ static void Main(String[] args){\n    System.out.println(\"Hello Java\");\n\
    \  }\n}\n```\n（错误）\n\n***\n\n### 目标: 02c - 描述基础 Java 程序的组件\n参考资料：\n* [`www.oracle.com/java/technologies/compile.html`](https://www.oracle.com/java/technologies/compile.html)\n\
    \n#### 第 11 ：你在一个名为 `hello.java` 的文件中创建了一个简单的 Java 程序，代码如下：\n```java\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    System.out.println(\"Hello\
    \ Java\");\n  }\n}\n```\n使用哪哪个命令可以编译此程序并将其转换为字节码（字节码是 Java 虚拟机的平台无关指令）？请选择正确的答案：\n\
    A. `java hello.java`\nB. `java -c hello.java`\nC. `java -jar hello.java`\nD. `javac\
    \ hello.java`\n\n**第 11 题结果：**\nA. `java hello.java` （错误）\nB. `java -c hello.java`\
    \ （错误）\nC. `java -jar hello.java` （错误）\nD. `javac hello.java` （正确）\n\n***\n\n\
    ### 目标: 02d - 编译并执行 Java 程序\n参考资料：\n* [`www.oracle.com/java/technologies/compile.html`](https://www.oracle.com/java/technologies/compile.html)\n\
    \n#### 第 12 ：你在一个名为 `hello.java` 的文件中创建了一个简单的 Java 程序，代码如下：\n```java\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    System.out.println(\"Hello\
    \ Java\");\n  }\n}\n```\n你执行了 `javac hello.java` 并发现在同一目录下生成了一个名为 `ExamPrep.class`\
    \ 的文件。\n你可以使用哪个命令执行该程序并看到 `Hello Java` 的输出？请选择正确的答案：\nA. `java ExamPrep`\nB. `java\
    \ ExamPrep.class`\nC. `javac ExamPrep`\nD. `javac ExamPrep.class`\n\n**第 12 题结果：**\n\
    A. `java ExamPrep` （正确）\nB. `java ExamPrep.class` （错误）\nC. `javac ExamPrep` （错误）\n\
    D. `javac ExamPrep.class` （错误）\n\n***\n\n### 目标: 02d - 编译并执行 Java 程序\n参考资料：\n\
    * [`www.oracle.com/java/technologies/compile.html`](https://www.oracle.com/java/technologies/compile.html)\n\
    \n#### 第 13 ：遵循 Java 规范，以下哪些项应该以大写开头？请选择 2 个答案：\nA. `classes`\nB. `interfaces`\n\
    C. `local variables`\nD. `packages`\nE. `public methods`\n\n**第 13 题结果：**\nA.\
    \ `classes` （正确）\nB. `interfaces` （正确）\nC. `local variables` （错误）\nD. `packages`\
    \ （错误）\nE. `public methods` （错误）\n\n***\n\n### 目标: 03a - 识别 Java 程序中需要遵循的规范\n\
    参考资料：\n* [`www.oracle.com/java/technologies/codeconventions.html`](https://www.oracle.com/java/technologies/codeconventions.html)\n\
    \n#### 14：你是 `Example Corp` 的软件开发人员，正在创建一个新包。你需要命名。哪行代码符合 Java 包命名规范？\nA. `ExampleCorp`\n\
    B. `exampleCorp`\nC. `CorpExample`\nD. `com.example`\nE. `example.com`\nF. `www.example`\n\
    \n**第 14 题结果：**\nA. `ExampleCorp` （错误）\nB. `exampleCorp` （错误）\nC. `CorpExample`\
    \ （错误）\nD. `com.example` （正确）\nE. `example.com` （错误）\nF. `www.example` （错误）\n\
    包的前缀总是全小写的，并且应该是顶级域名名称。\n\n***\n\n### 目标: 03a - 识别 Java 程序中需要遵循的规范\n参考资料：\n* [`www.oracle.com/java/technologies/codeconventions.html`](https://www.oracle.com/java/technologies/codeconventions.html)\n\
    \n#### 15：你正在编写一个函数，需要声明一个变量。以下哪些变量声明可以通过编译？请选择正确的答案：\nA. `String 100`\nB. `String\
    \ _100`\nC. `String 100_`\nD. `None of these are valid`\n\n**第 15 题结果：**\nA. `String\
    \ 100` （错误）\nB. `String _100` （正确）\nC. `String 100_` （错误）\nD. `None of these are\
    \ valid` （错误）\n标识可以包含下划线，但不能以数字开头。\n\n***\n\n### 目标: 03a - 识别 Java 程序中需要遵循的规范\n\
    参考资料：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
    \n#### 16：你正在编写一个函数，需要声明另一个变量。以下哪些变量声明可以通过编译？请选择正确的答案：\nA. `String 200`\nB. `String\
    \ $200`\nC. `String 200$`\nD. `None of these are valid`\n\n**第 16 题结果：**\nA. `String\
    \ 200` （错误）\nB. `String $200` （正确）\nC. `String 200$` （错误）\nD. `None of these are\
    \ valid` （错误）\n标识可以包含美元符号，但不能以数字开头。通常 $ 留给自动生成的代码，但作为标识符的一部分是有效的。\n\n"
- fmt: "\n- [https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
    \n### QUESTION 17: Which of these is NOT a Java reserved word?\nChoose the correct\
    \ answer:\nA. `default` (INCORRECT)\nB. `object` (CORRECT)\nC. `import` (INCORRECT)\n\
    D. `new` (INCORRECT)\nE. All of these are Java reserved words (INCORRECT)\n\n\
    ***\n\n### OBJECTIVE: 03b - Use Java reserved words\nREFERENCES:\n- [https://docs.oracle.com/javase/tutorial/java/nutsandbolts/_keywords.html](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/_keywords.html)\n\
    \n### QUESTION 18: You have written the following function to add two numbers:\n\
    ```java\npublic int add(int a, int b) {\n    return a + b;\n}\n```\nNow, you want\
    \ to add a comment saying Add two numbers on the same line as the return statement.\
