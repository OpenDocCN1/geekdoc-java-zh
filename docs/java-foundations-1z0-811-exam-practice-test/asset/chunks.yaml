    \n# 问题 50\n以下哪行代码可以用于判断 `String` 类型的变量 `s` 的内容是否以 \"java\" 开头？选择正确的答案：\n\nA. `boolean\
    \ result = s.beginsWith(\"java\");` (错误)\nB. `boolean result = s.hasPrefix(\"\
    java\");` (错误)\nC. `boolean result = s.startsWith(\"java\");` (正确)\nD. `boolean\
    \ result = s.prefixEquals(\"java\");` (错误)\n\n**目标：** 06a - 开发使用 `String` 类方法的代码\n\
    **参考文献：**\n* [Java 教程：比较字符串](https://docs.oracle.com/javase/tutorial/java/data/comparestrings.html)(https://docs.oracle.com/javase/tutorial/java/data/comparestrings.html)\n\
    \n# 问题 51\n`String` 类的哪种方法返回字符串的长度？选择正确的答案：\n\nA. `length()` (正确)\nB. `size()`\
    \ (错误)\nC. `capacity()` (错误)\nD. `getLength()` (错误)\nE. `getSize()` (错误)\nF. `getCapacity()`\
    \ (错误)\n\n**目标：** 06a - 开发使用 `String` 类方法的代码\n**参考文献：**\n* [Java 教程：字符串](https://docs.oracle.com/javase/tutorial/java/data/strings.html)(https://docs.oracle.com/javase/tutorial/java/data/strings.html)\n\
    \n# 问题 52\n在第 5 行添加什么内容可以使程序打印 `JavaExam`？\n\n```java\nclass ExamPrep {\n  public\
    \ static void main(String[] args){\n    String a = \"Java\";\n    String b = \"\
    Exam\";\n    // LINE 5\n    System.out.println(result);\n  }\n}\n```\n选择 2 个正确答案。每个答案代表一个完整的解决方案。\n\
    \nA. `String result = a + b;` (正确)\nB. `String result = a & b;` (错误)\nC. `String\
    \ result = a.concat(b);` (正确)\nD. `String result = b.concat(a);` (错误)\nE. `String\
    \ result = String.concat(a, b);` (错误)\n\n**目标：** 06a - 开发使用 `String` 类方法的代码\n\
    **参考文献：**\n* [Java 教程：字符串](https://docs.oracle.com/javase/tutorial/java/data/strings.html)(https://docs.oracle.com/javase/tutorial/java/data/strings.html)\n\
    \n# 问题 53\n在第 4 行添加什么内容可以使程序打印 `Percent Complete = 56.79`？\n\n```java\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    double a = 56.785;\n    //\
    \ LINE 4\n    System.out.println(result);\n  }\n}\n```\n选择正确的答案：\n\nA. `String\
    \ result = String.format(\"Percent Complete = %d\", a);` (错误)\nB. `String result\
    \ = String.format(\"Percent Complete = %.2d\", a);` (错误)\nC. `String result =\
    \ String.format(\"Percent Complete = %f\", a);` (错误)\nD. `String result = String.format(\"\
    Percent Complete = %.2f\", a);` (正确)\nE. `String result = String.format(\"Percent\
    \ Complete = %s\", a);` (错误)\nF. `String result = String.format(\"Percent Complete\
    \ = %.2s\", a);` (错误)\n\n**目标：** 06b - 使用包括 `%d`, `%n` 和 `%s` 在内的转义序列格式化字符串\n\
    **参考文献：**\n* [Java 教程：数字格式化](https://docs.oracle.com/javase/tutorial/java/data/numberformat.html)(https://docs.oracle.com/javase/tutorial/java/data/numberformat.html)\n\
    \n# 问题 54\n在第 6 行添加什么内容可以使用适用于平台的换行符，将 `a`、`b` 和 `c` 的值分行打印？\n\n```java\nclass\
    \ ExamPrep {\n  public static void main(String[] args){\n    int a = 1;\n    int\
    \ b = 2;\n    int c = 3;\n    // LINE 6\n    System.out.println(result);\n  }\n\
    }\n```\n选择正确的答案：\n\nA. `String result = String.format(\"%d%n%d%n%d\", a, b, c);`\
    \ (正确)\nB. `String result = String.format(\"%d\\n%d\\n%d\", a, b, c);` (错误)\n\
    C. `String result = String.format(\"%d\\r\\n%d\\r\\n%d\", a, b, c);` (错误)\nD.\
    \ `String result = String.concat(a, b, c);` (错误)\n\n# 问题 55\n在第 6 行添加什么内容可以使程序打印\
    \ `Java Prep`？\n\n```java\nclass ExamPrep {\n  public static void main(String[]\
    \ args){\n    String a = \"Java\";\n    String b = \"Exam\";\n    String c = \"\
    Prep\";\n    // LINE 6\n    System.out.println(result);\n  }\n}\n```\n选择正确的答案：\n\
    \nA. `String result = String.format(\"%d %d %d\", a, b, c);` (错误)\nB. `String\
    \ result = String.format(\"%s %s %s\", a, b, c);` (正确)\nC. `String result = String.format(\"\
    %n %n %n\", a, b, c);` (错误)\nD. `String result = String.format(\"%a %b %c\");`\
    \ (错误)\n\n# 问题 56\n你运行以下程序：\n\n```java\nimport java.util.Random;\n\nclass ExamPrep\
    \ {\n  public static void main(String[] args){\n    Random r = new Random(23);\n\
    \    int a = r.nextInt(100);\n    int b = r.nextInt(100);\n  }\n}\n```\n\n"
