- fmt: "\n![](image_rsrc55C.jpg)\n\n# About this book\nThank you for purchasing this\
    \ book!\n\nThe practice test in this book is meant to be used as a tool to help\
    \ you prepare for the [Java Foundations Exam, 1Z0-811](https://education.oracle.com/java-foundations/pexam_1Z0-811).\
    \ It has questions that cover every topic published in exam objectives.\n\nFor\
    \ the best chance of success, it is highly recommended that you use this practice\
    \ test in conjunction with training, self-study, or other method of preparation\
    \ to make sure you have a firm understanding of all of the topics that will be\
    \ covered on the exam.\n\n## Feedback\nIf you find this book helpful, please consider\
    \ leaving a positive review or posting something on Twitter or LinkedIn to share\
    \ with others.\n\nIf you want to send an email, you can email [feedback@getcertified.dev](mailto:feedback@getcertified.dev).\n\
    \n## Good Luck!\nThanks again, and good luck with the exam!\n\n---\n\n### QUESTION\
    \ 1\nWhich of these are features of Java? Choose 3 correct answers:\nA. Object\
    \ Oriented\nB. Platform Independent\nC. Context Independent\nD. Single Threaded\n\
    E. Multi Threaded\n\n**QUESTION 1:**\nWhich of these are features of Java? Choose\
    \ 3 correct answers:\nA. Object Oriented (CORRECT)\nB. Platform Independent (CORRECT)\n\
    C. Context Independent (INCORRECT)\nD. Single Threaded (INCORRECT)\nE. Multi Threaded\
    \ (CORRECT)\n\n---\n\n## OBJECTIVE: 01a - Describe the features of Java\n\n###\
    \ QUESTION 2\nWhich type of application CANNOT be created using Java? Choose the\
    \ correct answer:\nA. Desktop applications\nB. Web applications\nC. Mobile applications\n\
    D. None of these application types can be created using Java\nE. All of these\
    \ application types can be created using Java\n\n**QUESTION 2:**\nWhich type of\
    \ application CANNOT be created using Java? Choose the correct answer:\nA. Desktop\
    \ applications (INCORRECT)\nB. Web applications (INCORRECT)\nC. Mobile applications\
    \ (INCORRECT)\nD. None of these application types can be created using Java (INCORRECT)\n\
    E. All of these application types can be created using Java (CORRECT)\n\n---\n\
    \n## OBJECTIVE: 01b - Describe the real-world applications of Java\n\n### QUESTION\
    \ 3\nFill in the blank:\nThe __________ provides the libraries, Java virtual machine,\
    \ and other components necessary for you to run applets and applications written\
    \ in the Java programming language. It can be redistributed with applications\
    \ to make them free-standing. Choose the correct answer:\nA. Java Runtime Environment\
    \ (JRE)\nB. Java Execution Environment (JEE)\nC. Just-In-Time Compiler (JIT)\n\
    D. Java Language Specification (JLS)\n\n**QUESTION 3:**\nFill in the blank:\n\
    The __________ provides the libraries, Java virtual machine, and other components\
    \ necessary for you to run applets and applications written in the Java programming\
    \ language. It can be redistributed with applications to make them free-standing.\
    \ Choose the correct answer:\nA. Java Runtime Environment (JRE) (CORRECT)\nB.\
    \ Java Execution Environment (JEE) (INCORRECT)\nC. Just-In-Time Compiler (JIT)\
    \ (INCORRECT)\nD. Java Language Specification (JLS) (INCORRECT)\n\n---\n\n## OBJECTIVE:\
    \ 02a - Describe the Java Development Kit (JDK) and the Java Runtime Environment\
    \ (JRE)\nREFERENCES:\n* [https://docs.oracle.com/javase/7/docs/technotes/guides/index.html](https://docs.oracle.com/javase/7/docs/technotes/guides/index.html)\n\
    \n### QUESTION 4\nFill in the blank:\nThe __________ includes the JRE plus command-line\
    \ development tools such as compilers and debuggers that are necessary or useful\
    \ for developing applets and applications. Choose the correct answer:\nA. Java\
    \ Servlet\nB. Java Development Kit (JDK)\nC. Java Compiler\nD. Java Command Line\
    \ Interface (CLI)\nE. JAR File\n\n**QUESTION 4:**\nFill in the blank:\nThe __________\
    \ includes the JRE plus command-line development tools such as compilers and debuggers\
    \ that are necessary or useful for developing applets and applications. Choose\
    \ the correct answer:\nA. Java Servlet (INCORRECT)\nB. Java Development Kit (JDK)\
    \ (CORRECT)\nC. Java Compiler (INCORRECT)\nD. Java Command Line Interface (CLI)\
    \ (INCORRECT)\nE. JAR File (INCORRECT)\n\n---\n\n### QUESTION 5\nWhich of the\
    \ following statements are TRUE about objects in Object-Oriented Programming?\
    \ Choose 2 correct answers:\nA. Objects should only be used to represent real-world\
    \ physical objects\nB. Objects use fields to store state\nC. Objects provide methods\
    \ to operate on its internal state\nD. Objects optimize performance of your code\n\
    \n**QUESTION 5:**\nWhich of the following statements are TRUE about objects in\
    \ Object-Oriented Programming? Choose 2 correct answers:\nA. Objects should only\
    \ be used to represent real-world physical objects (INCORRECT)\nB. Objects use\
    \ fields to store state (CORRECT)\nC. Objects provide methods to operate on its\
    \ internal state (CORRECT)\nD. Objects optimize performance of your code (INCORRECT)\n\
    \n---\n\n## OBJECTIVE: 02b - Describe the components of object-oriented programming\n\
    REFERENCES:\n* [https://docs.oracle.com/javase/tutorial/java/concepts/object.html](https://docs.oracle.com/javase/tutorial/java/concepts/object.html)\n\
    \n### QUESTION 6\nIn Object-Oriented Programming, what is the blueprint, or prototype\
    \ of from which objects are created? Choose the correct answer:\nA. Class\nB.\
    \ Instance\nC. Struct\nD. Type\nE. Variable\n\n**QUESTION 6:**\nIn Object-Oriented\
    \ Programming, what is the blueprint, or prototype of from which objects are created?\
    \ Choose the correct answer:\nA. Class (CORRECT)\nB. Instance (INCORRECT)\nC.\
    \ Struct (INCORRECT)\nD. Type (INCORRECT)\nE. Variable (INCORRECT)\n\n---\n\n\
    ### QUESTION 7\nConsider the following code:\n```java\nclass MountainBike extends\
    \ Bicycle\n```\nWhich Object-Oriented Programming concept is this? Choose the\
    \ correct answer:\nA. Composition\nB. Encapsulation\nC. Idempotency\nD. Inheritance\n\
    \n**QUESTION 7:**\nConsider the following code:\n```java\nclass MountainBike extends\
    \ Bicycle\n```\nWhich Object-Oriented Programming concept is this? Choose the\
    \ correct answer:\nA. Composition (INCORRECT)\nB. Encapsulation (INCORRECT)\n\
    C. Idempotency (INCORRECT)\nD. Inheritance (CORRECT)\n\n---\n\n### QUESTION 8\n\
    You have the following interface:\n```java\ninterface Bicycle {\n    void changeCadence(int\
    \ newValue);\n    void changeGear(int newValue);\n    void speedUp(int increment);\n\
    \    void applyBrakes(int decrement);\n}\n```\nHow can you define a class that\
    \ can be used wherever this interface is expected? Choose the correct answer:\n\
    A. class ACMEBicycle extends Bicycle {}\nB. class ACMEBicycle implements Bicycle\
    \ {}\nC. class ACMEBicycle : Bicycle {}\nD. class ACMEBicycle { }\n\n**QUESTION\
    \ 8:**\nYou have the following interface:\n```java\ninterface Bicycle {\n    void\
    \ changeCadence(int newValue);\n    void changeGear(int newValue);\n    void speedUp(int\
    \ increment);\n    void applyBrakes(int decrement);\n}\n```\nHow can you define\
    \ a class that can be used wherever this interface is expected? Choose the correct\
    \ answer:\nA. class ACMEBicycle extends Bicycle {} (INCORRECT)\nB. class ACMEBicycle\
    \ implements Bicycle {} (CORRECT)\nC. class ACMEBicycle : Bicycle {} (INCORRECT)\n\
    D. class ACMEBicycle { } (INCORRECT)\n\n---\n\n### QUESTION 9\nFill in the blank:\n\
    A __________ is a namespace for organizing classes and interfaces in a logical\
    \ manner. Choose the correct answer:\nA. Container\nB. Dependency\nC. JAR File\n\
    D. Package\n"
