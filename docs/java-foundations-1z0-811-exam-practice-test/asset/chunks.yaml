  trans: "\n\n# 哪段代码片段可以打印 `customers` 数组中所有客户的名字？\n\n选择正确答案：\n\nA.\n```java\nfor\
    \ (Customer c in customers) {\n  System.out.println(c.getName());\n}\n```\nB.\n\
    ```java\nfor each (Customer c in customers) {\n  System.out.println(c.getName());\n\
    }\n```\nC.\n```java\nfor (Customer c : customers) {\n  System.out.println(c.getName());\n\
    }\n```\nD.\n```java\nfor each (Customer c : customers) {\n  System.out.println(c.getName());\n\
    }\n```\n\n## 问题 72\n`Customer` 是一个拥有 `getName()` 方法以及一个接受名称作为参数的构造函数的类。你有一个 `Customer`\
    \ 对象的数组，定义如下：\n\n```java\nCustomer[] customers = {\n  new Customer(\"a\"),\n \
    \ new Customer(\"b\"),\n  new Customer(\"c\")\n};\n```\n\n哪段代码片段可以打印 `customers`\
    \ 数组中所有客户的名字？选择正确答案：\n\nA.\n```java\nfor (Customer c in customers) {\n  System.out.println(c.getName());\n\
    }\n``` (错误)\n\nB.\n```java\nfor each (Customer c in customers) {\n  System.out.println(c.getName());\n\
    }\n``` (错误)\n\nC.\n```java\nfor (Customer c : customers) {\n  System.out.println(c.getName());\n\
    }\n```\n**正确**\n\nD.\n```java\nfor each (Customer c : customers) {\n  System.out.println(c.getName());\n\
    }\n``` (错误)\n\n***\n\n## 目标：09b - 使用 for 循环包括增强型 for 循环\n**参考：**\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/for.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/for.html)\n\
    \n## 问题 73\n以下哪个代码片段将打印 1 到 10 的数字？选择正确答案：\n\nA.\n```java\nint i = 0;\nwhile (i\
    \ <= 10) {\n  System.out.println(i);\n  i++;\n}\n```\nB.\n```java\nint i = 1;\n\
    while (i <= 10) {\n  System.out.println(i);\n  i++;\n}\n```\nC.\n```java\nint\
    \ i = 0;\nwhile (i < 10) {\n  System.out.println(i);\n}\n```\nD.\n```java\nint\
    \ i = 1;\nwhile (i < 11) {\n  System.out.println(i);\n}\n```\n\n### 问题 73 分析\n\
    以下哪个代码片段将打印 1 到 10 的数字？选择正确答案：\n\nA.\n```java\nint i = 0;\nwhile (i <= 10) {\n\
    \  System.out.println(i);\n  i++;\n}\n``` (错误)\n\nB.\n```java\nint i = 1;\nwhile\
    \ (i <= 10) {\n  System.out.println(i);\n  i++;\n}\n```\n**正确**\n\nC.\n```java\n\
    int i = 0;\nwhile (i < 10) {\n  System.out.println(i);\n}\n``` (错误)\n\nD.\n```java\n\
    int i = 1;\nwhile (i < 11) {\n  System.out.println(i);\n}\n``` (错误)\n\n***\n\n\
    ## 目标：09c - 使用 while 循环\n**参考：**\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/while.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/while.html)\n\
    \n## 问题 74\n以下哪个代码片段将打印 1 到 10 的数字？选择正确答案：\n\nA.\n```java\nint i = 0;\ndo {\n\
    \  System.out.println(i);\n  i++;\n} until (i == 10);\n```\nB.\n```java\nint i\
    \ = 1;\ndo {\n  System.out.println(i);\n  i++;\n} until (i == 10);\n```\nC.\n\
    ```java\nint i = 0;\ndo {\n  System.out.println(i);\n  i++;\n} while (i < 11);\n\
    ```\nD.\n```java\nint i = 1;\ndo {\n  System.out.println(i);\n  i++;\n} while\
    \ (i < 11);\n```\n\n### 问题 74 分析\n以下哪个代码片段将打印 1 到 10 的数字？选择正确答案：\n\nA.\n```java\n\
    int i = 0;\ndo {\n  System.out.println(i);\n  i++;\n} until (i == 10);\n``` (错误)\n\
    \nB.\n```java\nint i = 1;\ndo {\n  System.out.println(i);\n  i++;\n} until (i\
    \ == 10);\n``` (错误)\n\nC.\n```java\nint i = 0;\ndo {\n  System.out.println(i);\n\
    \  i++;\n} while (i < 11);\n``` (错误)\n\nD.\n```java\nint i = 1;\ndo {\n  System.out.println(i);\n\
    \  i++;\n} while (i < 11);\n```\n**正确**\n\n***\n\n## 目标：09d - 使用 do-while 循环\n\
    **参考：**\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/while.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/while.html)\n\
    \n## 问题 75\n哪种 Java 循环类型在代码的每次迭代**之前**评估条件？\n\nA. `for` 循环\nB. `while` 循环\nC.\
    \ `do` 循环\nD. 无\n\n### 问题 75 分析\n哪种 Java 循环类型在代码的每次迭代**之前**评估条件？\n\nA. `for` 循环\
    \ (**正确**)\nB. `while` 循环 (**正确**)\nC. `do` 循环 (错误)\nD. 无 (错误)\n\n***\n\n## 目标：09e\
    \ - 对比 for、while 和 do-while 循环\n**参考：**\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/for.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/for.html)\n\
    \n## 问题 76\n哪种循环类型可以在不使用索引的情况下迭代？\n\nA. `for` 循环\nB. `while` 循环\nC. `do` 循环\n\
    D. 无\n\n### 问题 76 分析\n哪种循环类型可以在不使用索引的情况下迭代？\n\nA. `for` 循环 (**正确**)\nB. `while`\
    \ 循环 (错误)\nC. `do` 循环 (错误)\nD. 无 (错误)\n\n***\n\n## 问题 77\n你有一个返回 `int` 的函数 `getNextId()`。你有以下代码：\n\
    \n```java\nwhile (true) {\n  int id = getNextId();\n  if (id == -1) {\n    break;\n\
    \  }\n  System.out.println(id);\n}\n```\n关于这段代码的哪个描述是正确的？\n\nA. 代码不会退出，因为条件是 `while(true)`。\n\
    B. 如果 `getNextId()` 返回 `-1`，它将打印并跳出循环。\nC. 如果 `getNextId()` 返回 `-1`，它会在该行抛出异常。\n\
    D. 代码无法编译。\n\n### 问题 77 分析\n关于这段代码的哪个描述是正确的？\n\nA. 代码不会退出，因为条件是 `while(true)`。(错误)\n\
    B. 如果 `getNextId()` 返回 `-1`，它将打印并跳出循环。(**正确**)\nC. 如果 `getNextId()` 返回 `-1`，它会在该行抛出异常。(错误)\n\
    D. 代码无法编译。(错误)\n\n***\n\n## 目标：09f - 开发使用 break 和 continue 语句的代码\n**参考：**\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/branch.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/branch.html)\n\
    \n## 问题 78\n你有一个返回 `int` 的函数 `getNextId()`。你有以下代码：\n\n```java\nwhile (true) {\n\
    \  int id = getNextId();\n  if (id == -1) {\n    break;\n  }\n  if (id % 2 ==\
    \ 0) {\n    continue;\n  }\n  System.out.println(id);\n}\n```\n以下关于这段代码的哪个陈述是正确的？\n\
    \nA. 代码只打印奇数。\nB. 代码只打印偶数。\nC. 代码打印除 -1 以外的所有数字。\nD. 如果 `id` 是奇数，它将退出循环（或执行 `continue`）并打印。\n\
    E. 如果 `id` 是偶数，它将退出循环（或执行 `continue`）并打印。\n\n### 问题 78 分析\n以下关于这段代码的哪个陈述是正确的？\n\
    \nA. 代码只打印奇数。(**正确**)\nB. 代码只打印偶数。(错误)\nC. 代码打印除 -1 以外的所有数字。(错误)\nD. 如果 `id` 是奇数，它将退出循环（或执行\
    \ `continue`）并打印。(错误)\nE. 如果 `id` 是偶数，它将退出循环（或执行 `continue`）并打印。(错误)\n\n"
