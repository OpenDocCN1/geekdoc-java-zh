  trans: "\n\n* [变量](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)(https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
    * [数据类型](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html)(https://docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html)\n\
    \n### 问题 24\n你正在运行一个 Java 项目，并在函数中看到以下行代码：\n```java\nfinal int rate = 5;\n```\n\
    `final` 关键字的作用是什么？\n选择正确答案：\nA. 如果有另一行代码尝试给 `rate` 变量赋值，将发生编译时错误。\nB. 如果有另一行代码尝试给\
    \ `rate` 变量赋值，将发生编译时警告。\nC. 如果有另一行代码尝试给 `rate` 变量赋值，将发生运行时错误。\nD. 如果有另一行代码尝试给\
    \ `rate` 变量赋值，将发生运行时警告。\n\n问题 24：你正在运行一个 Java 项目，并在函数中看到以下行代码：\n```java\nfinal\
    \ int rate = 5;\n```\n`final` 关键字的作用是什么？\n选择正确答案：\nA. 如果有另一行代码尝试给 `rate` 变量赋值，将发生编译时错误。**正确**\n\
    B. 如果有另一行代码尝试给 `rate` 变量赋值，将发生编译时警告。**错误**\nC. 如果有另一行代码尝试给 `rate` 变量赋值，将发生运行时错误。**错误**\n\
    D. 如果有另一行代码尝试给 `rate` 变量赋值，将发生运行时警告。**错误**\n\n***\n\n**目标：04a - 声明和初始化变量，包括使用\
    \ final 的变量**\n参考：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
    \n### 问题 25\n以下哪些是 Java 中的基本数据类型（primitive datatypes）？\n选择 5 个正确答案：\nA. bool\n\
    B. boolean\nC. byte\nD. char\nE. date\nF. double\nG. int\nH. single\nI. string\n\
    \n问题 25：以下哪些是 Java 中的基本数据类型？\n选择 5 个正确答案：\nA. bool **错误**\nB. boolean **正确**\n\
    C. byte **正确**\nD. char **正确**\nE. date **错误**\nF. double **正确**\nG. int **正确**\n\
    H. single **错误**\nI. string **错误**\n\n***\n\n**目标：04a - 声明和初始化变量，包括使用 final 的变量**\n\
    参考：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html)\n\
    \n### 问题 26\n以下哪个列表按照容量从从小到大的顺序排列了数据类型？\n选择正确答案：\nA. short, byte, int, long\n\
    B. byte, short, long, int\nC. byte, int, short, long\nD. byte, short, int, long\n\
    \n问题 26：以下哪个列表按照容量从从小到大的顺序排列了数据类型？\n选择正确答案：\nA. short, byte, int, long **错误**\n\
    B. byte, short, long, int **错误**\nC. byte, int, short, long **错误**\nD. byte, short,\
    \ int, long **正确**\n\n***\n\n**目标：04a - 声明和初始化变量，包括使用 final 的变量**\n参考：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html)\n\
    \n### 问题 27\n你需要在变量中存储数字 128 的值。\n可以使用哪些数据类型？\n选择所有正确答案。\nA. boolean\nB. byte\n\
    C. short\nD. int\nE. long\n\n问题 27：你需要在变量中存储 128 的值。\n可以使用哪些数据类型？\n选择所有正确答案。\n\
    A. boolean **错误** (boolean 只能存储 true 或 false)\nB. byte **错误** (byte 的最小值为 -128，最大值为\
    \ 127（包含）))\nC. short **正确** (short 的最小值为 -32,768，最大值为 32,767（包含）))\nD. int **正确**\
    \ (int 的最小值为 -2³¹，最大值为 2³¹ -1)\nE. long **正确** (long 的最小值为 -2⁶³，最大值为 2⁶³ -1)\n\
    \n***\n\n**目标：04a - 声明和初始化变量，包括使用 final 的变量**\n参考：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html)\n\
    \n### 问题 28\n你正在编写一个 Java 函数，代码如下：\n```java\nshort a = 1;\nshort b = 2;\n// LINE\
    \ 3\n```\n在 // LINE 3 处填写什么可以将变量 `a` 和 `b` 相加并将结果存储在另一个变量 `c` 中？\n选择 2 个正确答案：\n\
    A. short c = a + b;\nB. int c = a + b;\nC. short c = (short)(a + b);\nD. short\
    \ c = (short)a + (short)b;\n\n问题 28：你正在编写一个 Java 函数，代码如下：\n```java\nshort a =\
    \ 1;\nshort b = 2;\n// LINE 3\n```\n在 // LINE 3 处填写什么可以将变量 `a` 和 `b` 相加并将结果存储在另一个变量\
    \ `c` 中？\n选择 2 个正确答案：\nA. short c = a + b; **错误**\nB. int c = a + b; **正确**\n\
    C. short c = (short)(a + b); **正确**\nD. short c = (short)a + (short)b; **错误**\n\
    \n***\n\n**目标：04b - 从一种类型转换为另一种类型，包括自动提升**\n参考：\n* [`docs.oracle.com/javase/specs/se11/html/jls-5.1`](https://docs.oracle.com/javase/specs/se11/html/jls-5.1)\n\
    \n### 问题 29\n以下哪些 Java 行可以声明并初始化变量？\n选择 2 个正确答案：\nA. `s = \"Hello\"`\nB. `String\
    \ s = \"Hello\"`\nC. `String s = new String(\"Hello\")`\nD. `String s`\n\n问题 29：以下哪些\
    \ Java 行可以声明并初始化变量？\n选择 2 个正确答案：\nA. `s = \"Hello\"` **错误**\nB. `String s = \"\
    Hello\"` **正确**\nC. `String s = new String(\"Hello\")` **正确**\nD. `String s` **错误**\n\
    \n***\n\n**目标：04c - 声明和初始化 String **\n参考：\n* [`docs.oracle.com/javase/tutorial/java/strings.html`](https://docs.oracle.com/javase/tutorial/java/strings.html)\n\
    \n### 问题 30\n以下哪个不是 Java 中的运算符？\n选择正确答案：\nA. `+`\nB. `-`\nC. `*`\nD. `/`\nE. `\\\
    `\nF. `%`\n\n问题 30：以下哪个不是 Java 中的运算符？\n选择正确答案：\nA. `+` **错误**\nB. `-` **错误**\n\
    C. `*` **错误**\nD. `/` **错误**\nE. `\\` **正确**\nF. `%` **错误**\n\n***\n\n**目标：05a\
    \ - 使用基础算术运算符处理数据**\n参考：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/op1.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/op1.html)\n\
    \n### 问题 31\n哪个运算符是 Java 的取模运算符（modulo operator），返回第一个操作数除以第二个操作数后的余数？\n选择正确答案：\n\
    A. `/`\nB. `\\`\nC. `%`\nD. `^`\n\n问题 31：哪个运算符是 Java 的取模运算符，返回第一个操作数除以第二个操作数后的余数？\n\
    选择正确答案：\nA. `/` **错误**\nB. `\\` **错误**\nC. `%` **正确**\nD. `^` **错误**\n\n***\n\n\
    **目标：05a - 使用基础算术运算符处理数据**\n参考：\n* [`docs.oracle.com/javase/tutorial/java/nutsandbolts/op1.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/op1.html)\n\
    \n### 问题 32\n以下 Java 程序的输出是什么？\n```java\nclass ExamPrep {\n    public static void\
    \ main(String[] args) {\n        int a = 5;\n        int b = a++;\n        System.out.println(b);\n\
    \    }\n}\n```\n选择正确答案：\nA. 4\nB. 5\nC. 6\nD. 该程序将无法编译\nE. 该程序将发生运行时错误\n\n问题 32：以下\
    \ Java 程序的输出是什么？\n```java\nclass ExamPrep {\n    public static void main(String[]\
    \ args) {\n        int a = 5;\n        int b = a++;\n        System.out.println(b);\n\
    \    }\n}\n```\n选择正确答案：\nA. 4 **错误**\nB. 5 **正确** (a 在赋值给 b 之后自增)\nC. 6 **错误**\n\
    D. 该程序将无法编译 **错误**\nE. 该程序将发生运行时错误 **错误**\n\n***\n\n**目标：05b - 使用自增和自减运算符**\n\
