    \ three random numbers between 0 (inclusive) and 100 (exclusive)\nC. This code\
    \ will not compile\nD. This code will fail with an exception at runtime\n\n**CORRECT**:\
    \ The seed, `23` provided to `Random`'s constructor determines the order of pseudorandom\
    \ values that will be returned by calling `nextInt()`. If you run the code again\
    \ using the same seed, you will get the same sequence of numbers.\n**INCORRECT**:\
    \ A different set of three random numbers between 0 (inclusive) and 100 (exclusive)\n\
