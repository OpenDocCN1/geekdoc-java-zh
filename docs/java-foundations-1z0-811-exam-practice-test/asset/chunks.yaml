  trans: "\n\n# 问题 94：哪个程序可以无错误地编译并在运行时打印 Hello Java？\n\n选择正确答案：\n\nA. `class ExamPrep\
    \ {\n  public void main() {\n    System.out.println(\"Hello Java\");\n  }\n}`\n\
    **错误**\n\nB. `class ExamPrep {\n  public void main(String[] args) {\n    System.out.println(\"\
    Hello Java\");\n  }\n}`\n**错误**\n\nC. `class ExamPrep {\n  public static void\
    \ main() {\n    System.out.println(\"Hello Java\");\n  }\n}`\n**错误**\n\nD. `class\
    \ ExamPrep {\n  public static void main(String[] args) {\n    System.out.println(\"\
    Hello Java\");\n  }\n}`\n**正确**\n\n***\n\n### 目标： 12a - 创建一个包含 main 方法的新类\n**参考：**\n\
    * [`docs.oracle.com/javase/tutorial/getStarted/application/index.html`](https://docs.oracle.com/javase/tutorial/getStarted/application/index.html)\n\
    \n***\n\n# 问题 95：你正在处理一个 Java 项目并看到以下代码：\n\n```java\nclass Customer {\n  private\
    \ int id;\n  private String name;\n}\n```\n\nprivate 修饰符的作用是什么？选择正确答案：\n\nA. `id`\
    \ 和 `name` 被加密了。（**错误**）\nB. `id` 和 `name` 只能通过 `Customer` 类内部定义的方法访问。（**正确**）\n\
    C. `id` 和 `name` 只能通过 `Customer` 类内部或任何继承自 `Customer` 的类类内部的方法访问。（**错误**）\nD.\
    \ `id` 和 `name` 只能通过 `Customer` 类内部或在同一包内定义的任何类内部的方法访问。（**错误**）\n\n***\n\n# 目标：\
    \ 12b - 使用 private 修饰符\n**参考：**\n* [`docs.oracle.com/javase/tutorial/java/javaOO/accesscontrol.html`](https://docs.oracle.com/javase/tutorial/java/javaOO/accesscontrol.html)\n\
    \n***\n\n# 问题 96：以下哪些可以使用 private 修饰符定义？选择 4 个正确答案：\n\nA. `class`（**正确**）\nB.\
    \ `method`（**正确**）\nC. `class variable`（**正确**）\nD. `instance variable`（**正确**）\n\
    E. `local variable`（**错误**）\n\n***\n\n# 问题 97：你正在处理一个 Java 项目并看到以下代码：\n\n```java\n\
    class Customer {\n  private int id;\n  private String name;\n\n  public int getId()\
    \ {\n    return id;\n  }\n\n  public void setId(int value) {\n    id = value;\n\
    \  }\n\n  public String getName() {\n    return name;\n  }\n\n  public void setName(String\
    \ value) {\n    name = value;\n  }\n}\n```\n\n如何创建一个 ID 为 12、Name 为 ACME 的 `Customer`\
    \ 类实例？选择正确答案：\n\nA. `Customer c = new Customer(12, \"ACME\");` （**错误**）\nB. `Customer\
    \ c = new Customer(); c.setId(12); c.setName(\"ACME\");` （**正确**）\nC. `Customer\
    \ c = new Customer(); c.id = 12; c.name = \"ACME\";` （**错误**）\nD. `你无法创建此类的实例，因为没有声明构造函数`\
    \ （**错误**）\n\n***\n\n# 目标： 12c - 描述对象与成员之间的关系\n**参考：**\n* [`docs.oracle.com/javase/tutorial/java/javaOO/classvars.html`](https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html)\n\
    \n***\n\n# 问题 98：你正在处理一个包含以下代码的 Java 项目：\n\n```java\nclass Customer {\n  private\
    \ static int customerCount = 0;\n  private int id;\n  private String name;\n\n\
    \  public int getId() {\n    return id;\n  }\n\n  public String getName() {\n\
    \    return name;\n  }\n\n  public int getCustomerCount() {\n    return customerCount;\n\
    \  }\n\n  public Customer(int startId, String startName) {\n    id = startId;\n\
    \    name = startName;\n    customerCount++;\n  }\n}\n```\n\n你创建了两个 `Customer`\
    \ 实例，然后打印这两个实例的 `getCustomerCount()` 输出，如下所示：\n\n```java\nclass ExamPrep {\n \
    \ public static void main(String[] args) {\n    Customer a = new Customer(1, \"\
    cust1\");\n    Customer b = new Customer(2, \"cust2\");\n    System.out.println(a.getCustomerCount());\n\
    \    System.out.println(b.getCustomerCount());\n  }\n}\n```\n\n运行此程序时输出将是什么？选择正确答案：\n\
    \nA. `0, 1` （**错误**）\nB. `1, 1` （**错误**）\nC. `1, 2` （**错误**）\nD. `2, 2` （**正确**）\n\
    \n***\n\n# 问题 99：使用 static 关键字定义的是哪种类型的变量？选择正确答案：\n\nA. `class variable`（**正确**）\n\
    B. `instance variable` （**错误**）\nC. `local variable` （**错误**）\nD. `以上都不是` （**错误**）\n\
    \n"
