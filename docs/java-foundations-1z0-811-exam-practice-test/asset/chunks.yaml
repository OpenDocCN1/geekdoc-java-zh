    \ `id` and `name` are encrypted. (**INCORRECT**)\nB. `id` and `name` can only\
    \ be accessed by methods defined inside the `Customer` class. (**CORRECT**)\n\
    C. `id` and `name` can only be accessed by methods defined inside the `Customer`\
    \ class or inside any class that inherits from `Customer`. (**INCORRECT**)\nD.\
    \ `id` and `name` can only be accessed by methods defined inside the `Customer`\
    \ class or inside any class that is defined within the same package. (**INCORRECT**)\n\
    \n***\n\n# OBJECTIVE: 12b - Use the private modifier\n**REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/java/javaOO/accesscontrol.html](https://docs.oracle.com/javase/tutorial/java/javaOO/accesscontrol.html)\n\
    \n***\n\n# QUESTION 96: Which of the following can be defined using the private\
    \ modifier? Choose 4 correct answers:\n\nA. `class` (**CORRECT**)\nB. `method`\
    \ (**CORRECT**)\nC. `class variable` (**CORRECT**)\nD. `instance variable` (**CORRECT**)\n\
    E. `local variable` (**INCORRECT**)\n\n***\n\n# QUESTION 97: You are working on\
    \ a Java project and see the following code:\n\n```java\nclass Customer {\n  private\
    \ int id;\n  private String name;\n\n  public int getId() {\n    return id;\n\
    \  }\n\n  public void setId(int value) {\n    id = value;\n  }\n\n  public String\
    \ getName() {\n    return name;\n  }\n\n  public void setName(String value) {\n\
    \    name = value;\n  }\n}\n```\n\nHow can you create an instance of the `Customer`\
    \ class with and ID of 12 and Name of ACME? Choose the correct answer:\n\nA. `Customer\
    \ c = new Customer(12, \"ACME\");` (**INCORRECT**)\nB. `Customer c = new Customer();\
    \ c.setId(12); c.setName(\"ACME\");` (**CORRECT**)\nC. `Customer c = new Customer();\
    \ c.id = 12; c.name = \"ACME\";` (**INCORRECT**)\nD. `You cannot create an instance\
    \ of this class because no constructor has been declared` (**INCORRECT**)\n\n\
    ***\n\n# OBJECTIVE: 12c - Describe the relationship between an object and members\n\
    **REFERENCES:**\n* [https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html](https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html)\n\
    \n***\n\n# QUESTION 98: You are working on a Java project that has the following\
    \ code:\n\n```java\nclass Customer {\n  private static int customerCount = 0;\n\
