  \n### 问题 82\n你有一个名为 `hello.java` 的文件，该程序读取 `data.txt` 文件的内容并打印其中包含行数。\n\n```java\n\
  import java.io.IOException;\nimport java.nio.file.*;\nimport java.util.List;\n\n\
  class ExamPrep {\n  public static void main(String[] args) {\n    Path path = Path.of(\"\
  data.txt\");\n    try {\n      System.out.println(countLines(path));\n    } catch\
  \ (IOException e) {\n      System.out.println(e.getMessage());\n    }\n  }\n\n \
  \ static int countLines(Path path) {\n    List<String> lines = Files.readAllLines(path);\n\
  \    return lines.size();\n  }\n}\n```\n\n当你使用 `javac hello.java` 编译此程序时，会得到以下错误：\n\
  ```text\nhello.java:10: error: exception IOException is never thrown in body of\
  \ corresponding try statement\n    } catch (IOException e) {\n      ^\nhello.java:16:\
  \ error: unreported exception IOException; must be caught or declared to be thrown\n\
  \    List<String> lines = Files.readAllLines(path);\n                          \
  \           ^\n2 errors\n```\n\n你想在 `main()` 中捕获错误并显示错误信息。你需要进行什么更改才能使代码通过编译？选择正确答案：\n\
  \n**A.** 将 `static int countLines(Path path) {` 改为 `static int countLines(Path path)\
  \ throws IOException {`（正确）\n**B.** 将 `static int countLines(Path path) {` 改为 `static\
