  \ 应用程序（错误）\nC. 移动应用（错误）\nD. 这些应用程序类型都无法使用 Java 创建（错误）\nE. 所有这些应用程序类型都可以使用 Java 创建（正确）\n\
  \n---\n\n## 目标: 01b - 描述 Java 的现实世界应用\n\n### 第 3 题\n填空：\n__________ 提供了库、Java 虚拟机以及其他组件，供您运行用\
