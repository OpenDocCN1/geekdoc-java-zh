  以下哪些是 Java 的特性？选择 3 个正确答案：\nA. 面对象（正确）\nB. 平台无关（正确）\nC. 上下文无关（错误）\nD. 单线程（错误）\n\
  E. 多线程（正确）\n\n---\n\n## 目标: 01a - 描述 Java 的特性\n\n### 第 2 题\n哪种类型的应用程序**不能**使用 Java\
  \ 创建？选择正确答案：\nA. 桌面应用\nB. Web 应用程序\nC. 移动应用\nD. 这些应用程序类型都无法使用 Java 创建\nE. 所有这些应用程序类型都可以使用\
