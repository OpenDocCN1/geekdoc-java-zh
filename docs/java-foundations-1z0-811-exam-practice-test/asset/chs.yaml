  \ Java 执行环境 (JEE)\nC. 即时编译编译器 (JIT)\nD. Java 语言规范 (JLS)\n\n**第 3 题：**\n填空：\n__________\
  \ 提供了库、Java 虚拟机以及其他组件，供您运行用 Java 语言编写的 applet 和应用程序。它可以随应用程序一起分发，使其能够独立运行。选择正确答案：\n\
  A. Java 运行环境 (JRE）（正确）\nB. Java 执行环境 (JEE）（错误）\nC. 即时编译编译器 (JIT）（错误）\nD. Java 语言规范\
  \ (JLS）（错误）\n\n---\n\n## 目标: 02a - 描述 Java 开发工具包 (JDK) 和 Java 运行环境 (JRE)\n参考资料：\n\
  * [`docs.oracle.com/javase/7/docs/technotes/guides/index.html`](https://docs.oracle.com/javase/7/docs/technotes/guides/index.html)\n\
  \n### 第 4 题\n填空：\n__________ 包含了 JRE 加上命令行开发工具（如编译器和调试器），这些工具对于开发 applet 和应用程序是必要的或有用的。选择正确答案：\n\
  A. Java Servlet\nB. Java 开发工具包 (JDK)\nC. Java 编译器\nD. Java 命令行接口 (CLI)\nE. JAR 文件\n\
  \n**第 4 题：**\n填空：\n__________ 包含了 JRE 加上命令行开发工具（如编译器和调试器），这些工具对于开发 applet 和应用程序是必要的或有用的。选择正确答案：\n\
  A. Java Servlet（错误）\nB. Java 开发工具包 (JDK）（正确）\nC. Java 编译器（错误）\nD. Java 命令行接口 (CLI）（错误）\n\
  E. JAR 文件（错误）\n\n---\n\n### 第 5 题\n关于面向对象编程中的对象，以下哪些陈是**正确**的？选择 2 个正确答案：\nA. 对象应该只用于表示现实世界的物理对象\n\
  B. 对象使用字段来存储状态\nC. 对象提供方法来操作其内部状态\nD. 对象优化您的代码的性能\n\n**第 5 题：**\n关于面向对象编程中的对象，以下哪些陈是**正确**的？选择\
  \ 2 个正确答案：\nA. 对象应该只用于表示现实世界的物理对象（错误）\nB. 对象使用字段来存储状态（正确）\nC. 对象提供方法来操作其内部状态（正确）\n\
  D. 对象优化您的代码的性能（错误）\n\n---\n\n## 目标: 02b - 描述面向对象编程的组件\n参考资料：\n* [`docs.oracle.com/javase/tutorial/java/concepts/object.html`](https://docs.oracle.com/javase/tutorial/java/concepts/object.html)\n\
  \n### 第 6 题\n在面向对象编程中，创建对象的蓝图或原型是什么？选择正确答案：\nA. 类 (Class)\nB. 实例 (Instance)\nC.\
  \ 结构体 (Struct)\nD. 类型 (Type)\nE. 变量 (Variable)\n\n**第 6 题：**\n在面向对象编程中，创建对象的蓝图或原型是什么？选择正确答案：\n\
  A. 类（正确）\nB. 实例（错误）\nC. 结构体（错误）\nD. 类型（错误）\nE. 变量（错误）\n\n---\n\n### 第 7 题\n考虑以下代码：\n\
  ```java\nclass MountainBike extends Bicycle\n```\n这是哪种面向对象概念？选择正确答案：\nA. 组合 (Composition)\n\
  B. 封装 (Encapsulation)\nC. 等幂性 (Idempotency)\nD. 继承 (Inheritance)\n\n**第 7 题：**\n\
  考虑以下代码：\n```java\nclass MountainBike extends Bicycle\n```\n这是哪种面向对象概念？选择正确答案：\n\
  A. 组合（错误）\nB. 封装（错误）\nC. 等幂性（错误）\nD. 继承（正确）\n\n---\n\n### 第 8 题\n你有以下接口：\n```java\n\
  interface Bicycle {\n    void changeCadence(int newValue);\n    void changeGear(int\
  \ newValue);\n    void speedUp(int increment);\n    void applyBrakes(int decrement);\n\
  }\n```\n如何定义一个可以在任何需要该接口的地方类？选择正确答案：\nA. class ACMEBicycle extends Bicycle {}\n\
  B. class ACMEBicycle implements Bicycle {}\nC. class ACMEBicycle : Bicycle {}\n\
  D. class ACMEBicycle { }\n\n**第 8 题：**\n你有以下接口：\n```java\ninterface Bicycle {\n\
  \    void changeCadence(int newValue);\n    void changeGear(int newValue);\n   \
  \ void speedUp(int increment);\n    void applyBrakes(int decrement);\n}\n```\n如何定义一个可以在任何需要该接口的地方类？选择正确答案：\n\
  A. class ACMEBicycle extends Bicycle {}（错误）\nB. class ACMEBicycle implements Bicycle\
  \ {}（正确）\nC. class ACMEBicycle : Bicycle {}（错误）\nD. class ACMEBicycle { }（错误）\n\n\
  ---\n\n### 第 9 题\n填空：\n__________ 是用于逻辑方式组织类和接口的命名空间。选择正确答案：\nA. 容器 (Container)\n\
  B. 依赖 (Dependency)\nC. JAR 文件 (JAR File)\nD. 包 (Package)\n\n\n\n\n\n`__________`\
  \ 是一个以逻辑方式组织类和接口的命名空间。请选择正确的答案：\nA. 容器（错误）\nB. 依赖（错误）\nC. JAR 文件（错误）\nD. 包（正确）\n\
  \n***\n\n## 目标: 02b - 描述面向对象编程的组件\n参考资料：\n* [`docs.oracle.com/javase/tutorial/java/concepts/package.html`](https://docs.oracle.com/javase/tutorial/java/concepts/package.html)\n\
  \n#### 第 10 ：你正在创建一个新的 Java 程序。\n以下哪一项将打印 `Hello Java`？请选择正确的答案：\n\nA.\n```java\n\
  class ExamPrep {\n  public void main(String[] args){\n    System.out.println(\"\
  Hello Java\");\n  }\n}\n```\nB.\n```java\nclass ExamPrep {\n  public static void\
  \ main(String[] args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\nC.\n\
  ```java\nclass ExamPrep {\n  public void Main(String[] args){\n    System.out.println(\"\
  Hello Java\");\n  }\n}\n```\n(correct: false) D.\n```java\nclass ExamPrep {\n  public\
  \ static void Main(String[] args){\n    System.out.println(\"Hello Java\");\n  }\n\
  }\n```\n\n**第 10 题结果：**\nA.\n```java\nclass ExamPrep {\n  public void main(String[]\
  \ args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\n（错误）\nB.\n```java\n\
  class ExamPrep {\n  public static void main(String[] args){\n    System.out.println(\"\
  Hello Java\");\n  }\n}\n```\n（正确）\nC.\n```java\nclass ExamPrep {\n  public void\
  \ Main(String[] args){\n    System.out.println(\"Hello Java\");\n  }\n}\n```\n（正确:\
  \ false 错误）\nD.\n```java\nclass ExamPrep {\n  public static void Main(String[] args){\n\
  \    System.out.println(\"Hello Java\");\n  }\n}\n```\n（错误）\n\n***\n\n## 目标: 02c\
  \ - 描述基础 Java 程序的组件\n参考资料：\n* [`www.oracle.com/java/technologies/compile.html`](https://www.oracle.com/java/technologies/compile.html)\n\
  \n#### 第 11 ：你在一个名为 `hello.java` 的文件中创建了一个简单的 Java 程序，代码如下：\n```java\nclass ExamPrep\
  \ {\n  public static void main(String[] args){\n    System.out.println(\"Hello Java\"\
  );\n  }\n}\n```\n使用哪哪个命令可以编译此程序并将其转换为字节码（字节码是 Java 虚拟机的平台无关指令）？请选择正确的答案：\nA. `java\
  \ hello.java`\nB. `java -c hello.java`\nC. `java -jar hello.java`\nD. `javac hello.java`\n\
  \n**第 11 题结果：**\nA. `java hello.java` （错误）\nB. `java -c hello.java` （错误）\nC. `java\
  \ -jar hello.java` （错误）\nD. `javac hello.java` （正确）\n\n***\n\n## 目标: 02d - 编译并执行\
  \ Java 程序\n参考资料：\n* [`www.oracle.com/java/technologies/compile.html`](https://www.oracle.com/java/technologies/compile.html)\n\
  \n#### 第 12 ：你在一个名为 `hello.java` 的文件中创建了一个简单的 Java 程序，代码如下：\n```java\nclass ExamPrep\
  \ {\n  public static void main(String[] args){\n    System.out.println(\"Hello Java\"\
  );\n  }\n}\n```\n你执行了 `javac hello.java` 并发现在同一目录下生成了一个名为 `ExamPrep.class` 的文件。\n\
  你可以使用哪个命令执行该程序并看到 `Hello Java` 的输出？请选择正确的答案：\nA. `java ExamPrep`\nB. `java ExamPrep.class`\n\
  C. `javac ExamPrep`\nD. `javac ExamPrep.class`\n\n**第 12 题结果：**\nA. `java ExamPrep`\
  \ （正确）\nB. `java ExamPrep.class` （错误）\nC. `javac ExamPrep` （错误）\nD. `javac ExamPrep.class`\
  \ （错误）\n\n***\n\n## 目标: 02d - 编译并执行 Java 程序\n参考资料：\n* [`www.oracle.com/java/technologies/compile.html`](https://www.oracle.com/java/technologies/compile.html)\n\
  \n#### 第 13 ：遵循 Java 规范，以下哪些项应该以大写开头？请选择 2 个答案：\nA. `classes`\nB. `interfaces`\n\
  C. `local variables`\nD. `packages`\nE. `public methods`\n\n**第 13 题结果：**\nA. `classes`\
  \ （正确）\nB. `interfaces` （正确）\nC. `local variables` （错误）\nD. `packages` （错误）\nE.\
  \ `public methods` （错误）\n\n***\n\n## 目标: 03a - 识别 Java 程序中需要遵循的规范\n参考资料：\n* [`www.oracle.com/java/technologies/codeconventions.html`](https://www.oracle.com/java/technologies/codeconventions.html)\n\
  \n#### 14：你是 `Example Corp` 的软件开发人员，正在创建一个新包。你需要命名。哪行代码符合 Java 包命名规范？\nA. `ExampleCorp`\n\
  B. `exampleCorp`\nC. `CorpExample`\nD. `com.example`\nE. `example.com`\nF. `www.example`\n\
  \n**第 14 题结果：**\nA. `ExampleCorp` （错误）\nB. `exampleCorp` （错误）\nC. `CorpExample`\
  \ （错误）\nD. `com.example` （正确）\nE. `example.com` （错误）\nF. `www.example` （错误）\n包的前缀总是全小写的，并且应该是顶级域名名称。\n\
  \n***\n\n## 目标: 03a - 识别 Java 程序中需要遵循的规范\n参考资料：\n* [`www.oracle.com/java/technologies/codeconventions.html`](https://www.oracle.com/java/technologies/codeconventions.html)\n\
  \n#### 15：你正在编写一个函数，需要声明一个变量。以下哪些变量声明可以通过编译？请选择正确的答案：\nA. `String 100`\nB. `String\
  \ _100`\nC. `String 100_`\nD. `None of these are valid`\n\n**第 15 题结果：**\nA. `String\
  \ 100` （错误）\nB. `String _100` （正确）\nC. `String 100_` （错误）\nD. `None of these are\
  \ valid` （错误）\n标识可以包含下划线，但不能以数字开头。\n\n***\n\n## 目标: 03a - 识别 Java 程序中需要遵循的规范\n参考资料：\n\
  * [`docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
  \n#### 16：你正在编写一个函数，需要声明另一个变量。以下哪些变量声明可以通过编译？请选择正确的答案：\nA. `String 200`\nB. `String\
  \ $200`\nC. `String 200$`\nD. `None of these are valid`\n\n**第 16 题结果：**\nA. `String\
  \ 200` （错误）\nB. `String $200` （正确）\nC. `String 200$` （错误）\nD. `None of these are\
  \ valid` （错误）\n标识可以包含美元符号，但不能以数字开头。通常 $ 留给自动生成的代码，但作为标识符的一部分是有效的。\n\n\n\n\n\n- [`docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/variables.html)\n\
  \n### 问题 17：以下哪一个不是 Java 预留关键字？\n请选择正确答案：\nA. `default` (错误)\nB. `object` (正确)\n\
  C. `import` (错误)\nD. `new` (错误)\nE. 以上都是 Java 预留关键字 (错误)\n\n***\n\n## 目标：03b - 使用\
  \ Java 预留关键字\n参考资料：\n- [`docs.oracle.com/javase/tutorial/java/nutsandbolts/_keywords.html`](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/_keywords.html)\n\
  \n### 问题 18：你写了以下函数来计算两个数字之和：\n```java\npublic int add(int a, int b) {\n    return\
  \ a + b;\n}\n```\n现在，你想在与返回语句相同的行上添加一个“Add two numbers”的注释。你应该如何做？请选择 2 个正确答案：\n\
  A. `return a + b; # Add two numbers` (错误)\nB. `return a + b; /* Add two numbers\
  \ */` (正确)\nC. `return a + b; -- Add two numbers` (错误)\nD. `return a + b; // Add\
  \ two numbers` (正确)\n\n***\n\n## 目标：03c - 在 Java 程序中使用单行注释和多行注释\n参考资料：\n- [`www.oracle.com/java/technologies/javase/codeconventions-comments.html`](https://www.oracle.com/java/technologies/javase/codeconventions-comments.html)\n\
  \n### 问题 19：你写了以下函数来计算两个数字之和：\n```java\npublic int add(int a, int b) {\n    return\
  \ a + b;\n}\n```\n现在，你想添加一个多行注释，第一行写“Add two numbers”，第二行写“Returns an integer”。你应该如何做？请选择正确答案：\n\
  A.\n```java\n/*\nAdd two numbers\nReturns an integer\n*/\n``` (正确)\nB.\n```java\n\
  //\nAdd two numbers\nReturns an integer\n//\n``` (错误)\nC.\n```java\n//\nAdd two\
  \ numbers\nReturns an integer\n///\n``` (错误)\nD. 以上都不是。无法添加跨越多行的单个注释 (错误)\n\n***\n\
  \n## 目标：03c - 在 Java 程序中使用单行注释和多行注释\n参考资料：\n- [`www.oracle.com/java/technologies/javase/codeconventions-comments.html`](https://www.oracle.com/java/technologies/javase/codeconventions-comments.html)\n\
  \n### 问题 20：你写了以下代码：\n```java\npackage com.example;\n\n// LINE 2\npublic class Main\
