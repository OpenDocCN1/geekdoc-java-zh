    # 2.2 Shared frameworks


    Recall that convergence on a theory is not a precondition of its ability to yield
    answering; some inquirers may well fail to notice a theory’s noetic promise. What
    is more, philosophy is so difficult that it is rational for inquirers to pursue
    divergent views. Spreading out in this way allows them to cover more terrain.


