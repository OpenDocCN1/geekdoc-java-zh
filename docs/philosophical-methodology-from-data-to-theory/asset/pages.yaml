    It may be that science, philosophy, and neighboring disciplines incorporate other,
    non-epistemic projects as well—e.g., those that are aesthetic, felicific, salvific,
    pragmatic, or political. No doubt philosophers have at times appraised competing
    views by these (and still other) non-epistemic standards. Our intention is not
    to question the legitimacy of such appraisals, or to promote a picture of inquiry
    on which its sole interest derives from the ambition of attaining theoretical
    understanding with respect to its central questions. Rather, our contention is
