  md: '# Introduction


    Our primary goal is to address five central questions about philosophical inquiry,
    understood as a species of theoretical inquiry. The first two can be stated simply:


    +   - What is the structure of philosophical inquiry?

    - What is the principal goal of philosophical inquiry?


    Answering these questions requires developing a model of such inquiry that identifies
    its basic components, how they’re organized, and what those elements, so organized,
    aim to achieve. We do these things in Chapter 1.


    According to the model we develop there, the two main components of philosophical
    inquiry center on data and a method of theorizing—the former being starting points
    of inquiry, and the latter a set of criteria for theory construction and evaluation.
    The principal goal, we''ll argue, is a certain type of understanding, which can
    serve as a measure of philosophical progress. Accordingly, our next three questions
    are:


    +   - What are philosophical data?

    - What is a sound method for philosophical theorizing?

    - Is there reason to think that philosophical progress can be or has been made?


    The remainder of the book, Chapters 2 through 6, takes up these questions.


    We answer the third question, concerning data, by detailing an epistemic theory
    of data that privileges pre-theoretical claims that inquirers have good reason
    to believe. Our discussion highlights the role of data in inquiry, defends philosophical
    data against the charge of theory-ladenness, illustrates the varieties of'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction 5


    data and procedures for data collection, and contrasts our preferred view with
    rivals that analyze data in sociological, metaphysical, psychological, or linguistic
    terms. We do this work in Chapters 2 and 3.


    Our answer to the fourth question, concerning around a specific set of criteria
    for theory construction and evaluation. We''ll argue that a theory that satisfies
    these criteria resolves inquiry by providing a certain type of understanding.
    In arguing for this claim, our project makes some of its normative commitments:
    we do not merely offer an account of what philosophical inquiry is, but take a
    stand on what it is to do well, by charting how its success is possible. This
    enterprise takes up Chapters 4 and 5. In Chapter 4, we review classic and contemporary
    philosophical texts with an eye to identifying a variety of methodological virtues.
    We then consider some prominent philosophical methods, pinpointing both their
    attractions and their shortcomings. This sets the stage, in Chapter 5, for our
    presentation and initial defense of the philosophical method that we endorse,
    which we label the ‘Tri-Level Method.’


    The fifth question, concerning progress, forces us to confront a familiar anxiety
    about philosophy—namely, stable success is largely or entirely beyond reach, despite
    millennia of efforts. In Chapter 6 we attempt to soothe this using the Tri-Level
    Method to illustrate and explain philosophical progress. Moreover, we introduce
    a previously overlooked distinction that allows us to block an invidious comparison
    between advances in philosophy and in other disciplines.


    Philosophical questions about inquiry, data, and theorizing are often grouped
    together, along with other questions, under the heading of ‘methodology.’ We follow
    this practice here. There has'
