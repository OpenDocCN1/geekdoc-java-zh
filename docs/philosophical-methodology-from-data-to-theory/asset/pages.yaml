  md: '# A Third Datum 89


    +   * Support-requiring: it delivers a theory that is epistemically well-supported
    by positive considerations that speak on its behalf.


    +   * Synoptic: it ensures that whichever theory it favors is best positioned
    to expose systematic relationships, including explanatory ones, in the subject
    matter in question.


    +   * Multidimensional: it incorporates multiple criteria.


    +   * Hierarchical: it recognizes that criteria play diverse roles, and that some
    roles possess more significance than others.


    +   * Comparative: it enables assessment of both individual and relative merits
    of rival theories.


    A sound method exemplifies these many virtues as a neutral, inquiry-constraining
    starting point when thinking about method. It merits attention from proponents
    of disparate candidates for a sound method, is well-suited to anchor their theorizing
    about this matter, and is not itself an output of such theorizing. So, despite
    its complexity and novelty, it qualifies as a datum about method; we''ll call
    it the ‘virtues datum’.


    Recall that a method is a set of criteria that provide instructions for theory
    construction and measures for theory evaluation. Moreover, a method is just in
    case satisfying its criteria positions inquirers to achieve inquiry''s ultimate
    goal—where a method does just in case satisfaction of its criteria by a theory
    implies that this theory possesses at least some of that goal''s central features
    and possibly (in nearby worlds) all of them. Given our argument in Chapter 1 (§3)
    that inquiry''s ultimate goal is theoretical understanding, these features will
    include the six characteristics of such understanding discussed there: being accurate,
    robust, reason-based, illuminating, orderly, and coherent.'
