    # Core Data in Contemporary Metaethics


    Since each domain contains a very large number of core data, the threat of cherry-picking
    is genuine. It is good practice for inquirers to occasionally take inventory,
    ensuring that their theorizing at stage two is properly moored.


    To illustrate what this might look like, consider contemporary metaethics, whose
    central questions include "Is morality objective?", "How is moral knowledge possible?",
    and "Why moral?” Inquirers in those domains recognize a wide range of data spanning
    the normative, metaphysical, epistemic, psychological, and semantic dimensions
    of morality. Some of these qualify as core data. For example:


    +   * Correlation: How things are morally correlated with how things are non-morally.

    * Independence: Some moral demands hold regardless of what the subjects of those
    think, feel, desire, hope, fancy, etc.

    * Inescapability: Some moral demands and reasons are inescapable with respect
    to normative assessment.

    * Priority: Moral demands and reasons sometimes have priority over non-moral ones.

    * Non-Arbitrariness: Morality is not arbitrary.

    * Non-Contingency: It''s not deeply contingent that some things have the moral
    features they do.

    * Practicality: Moral judgments have marks of practical attitudes; they direct,
    guide, and motivate action.

    * Declarative: Moral judgments have marks of declarative attitudes; they are predicative,
    truth-evaluable, and apt for inference.

    * Grasp: Moral agents sometimes grasp, or are duly placed to grasp, moral reality.'
