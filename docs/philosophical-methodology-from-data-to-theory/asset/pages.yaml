    # 2. The Existential and Comparative Questions


    We''ve argued that the Tri-Level Method helps to reveal noetic progress is possible
    and how philosophical theories can be evaluated with respect to their ability
    to facilitate such progress. The method thus plays a crucial role in answering
    the how-to and evaluative questions. Our answers to these questions were designed
    to show that, and explain how, noetic progress is possible. But they do not by
    themselves resolve the existential and comparative questions. What remains is
    to address whether philosophy has actually made any noetic progress, and if so,
    how it compares to the leaps and bounds made by the natural sciences. We also
    need to ask whether the Tri-Level Method helps to explain any such progress.


    # 2.1 Fundamental vs. foremost questions


    We believe pessimism about philosophy''s noetic progress to be unwarranted, being
    based on an illicit slide between two different types of questions. The first
    are the fundamental questions of a field, whose resolutions are among the field''s
    ultimate (perhaps even constitutive) aims at any time. The second are a field''s
    foremost questions at a specific time, which are not The.


    First, we canvassed data about data (recall the four basic features of data in
    §1 of Chapter 2), and subsequently showed that the epistemic reasons theory accommodates
    and explains all of them. Second, the method also applies to the choice of method
    (hence, to theorizing about method itself); this is indicated by our efforts to
    collect data about method in Chapter 4 (§1–2), and our discussion of their handling
    by the Tri-Level Method in Chapter 5 (§5; see also to its note 21). As these two
    cases demonstrate, the Tri-Level Method is not only efficacious but also has broad
    scope, applying wherever there are data that constrain philosophical inquiry.'
