    accurate, robust, illuminating, coherent and orderly. Although they comprise only
    a partial view of their target, they already jointly realize the six features
    of theoretical understanding, and so represent substantial noetic progress regarding
    a foremost question of contemporary metaethics.


    | Russell''s challenge and contemporary philosophy of perception What about Russell''s
    challenge? He rightly suggested that philosophers and our scientists could cite
    many truths that draw the consensus of their peers, while perhaps being news to
    non-specialists. |


    21 Note that these claims are not data, as they belong to what we called (in Chapter
    2, §3) a ‘well-formed’ theory of the connection between moral reasons and motivation.'
