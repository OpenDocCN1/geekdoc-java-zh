  md: '# Introduction 3


    well. Philosophy, it may be said, is too difficult, creative, and unpredictable
    for there to be a helpful way of describing how it ought to unfold. So we shouldn''t
    aim to devise a theory of philosophical inquiry. Nor should we be advising other
    philosophers on how to go about their business.


    We agree that the search for a recipe for philosophical success is misguided,
    and issuing recommendations risks immodesty. But it doesn''t follow that there
    is nothing interesting or important to be said about philosophical inquiry.


    For one thing, we can distinguish different types of philosophical inquiry. Philosophy
    can be undertaken in a practical mode, for example, as a means to some personal,
    social, political, or ethical end. It is also possible to philosophize in an aesthetic
    mode; perhaps this is the right way to think of those who engage in philosophical
    activity just because they find it elegant, arresting, or awe-inspiring⁵ Other
    modes are possible. While ourselves are pluralists, endorsing the compatibility
    and legitimacy of these different options, we focus here on philosophical engagement
    in the theoretical mode. As will emerge, we understand this to be the inquiry
    that is aimed at securing an epistemically satisfactory resolution of the questions
    that prompt it.


