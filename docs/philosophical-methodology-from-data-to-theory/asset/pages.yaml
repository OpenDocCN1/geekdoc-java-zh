  md: 'Philosophers sometimes flirt with models of theoretical inquiry that do not
    mark any of its stages. For example, on Robert Stalnaker’s and influential picture
    of “the abstract structure of inquiry,” iners are treated as believers seeking
    to narrow the space of possible worlds to a certain subset, containing those and
    only those worlds that answer the queries that prompted inquiry.⁴ This picture
    looks seriously incomplete. For it not tell us what it is for inquiry to unfold;
    it merely observes that it does. When analyzing the structure of inquiry, what
    is wanted insight into the components of inquiry, and how those components are
    related so to constitute a certain kind of process. Whatever its merits, the possible
    worlds picture of inquiry does not provide such insight.


    The solution isn''t simply to posit multiple stages. Consider, for example, a
    five-stage view of inquiry advanced by John Dewey, which comprises


    +   (i) a felt difficulty, (ii) its location and definition, (iii) suggestion
    of a possible solution, (iv) development by reasoning of the bearing of the suggestions,
    (v) further observation and experiment leading to its acceptance or rejection⁵


    But a process culminating in observation and experiment is insufficient to capture
    inquiries regarding a wide range of theoretical questions. We aren''t going to
    solve the Liar paradox, figure out why there is something rather than nothing,
    or ascertain the distribution of primes through observation and experiment—especially
    if these are empirical undertakings, as Dewey insists.


    > ⁴ Stalnaker (1984, ix), We''ll waive worries about how this picture could account
    for beliefs regarding specific necessary and essential truths.


    > ⁵ Dewey (1910, 72; cp. 1938, Ch. VI).'
  merge: -1
