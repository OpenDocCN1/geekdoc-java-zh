  md: '# Introduction


    This book is an attempt to understand philosophical inquiry.

    We suspect that you, like us, have grappled with a philosophical question—perhaps
    a question about consciousness, or right action, or free will, or the possibility
    of knowledge. You''ve felt its force, as well as the urge to understand, to make
    sense of whatever the question is about. And so commences a familiar philosophical
    venture: to find, or develop, a theory that succeeds in doing just this.


    We are motivated to take up this topic for several reasons, beyond our conviction
    in the value of understanding what we’re doing when we do philosophy. One is that
    commitments regarding inquiry deeply shape philosophical discussion and debate.
    When these commitments diverge, they often do, this can lead to serious misunderstandings
    and incite disagreements downstream—a “battlefield of endless controversies,”
    in Kant’s phrase.¹


    ¹ Kant (1781/1998, Avii).


    Philosophical Methodology: From Data to Theory: John Bengenson, Terence Cuneo,
    and Russ Shafer-Landau, Oxford University Press. © John Bengenson, Terence Cuneo,
    and Russ Shafer-Landau 2022.

    DOI: 10.1093/oso/9780192862464.003.0001'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# 2 Introduction


    And yet these effects are avoidable. Just as Buddhism teaches that a certain kind
    of insight eliminates the source of suffering, we’re convinced that a clearer
    view of philosophical inquiry is apt to help dissolve misunderstandings and disagreements
    whose sources are methodological.


    Another reason to write this book, which takes on special importance when viewed
    against these observations, is to equip philosophers to satisfy the imperative
    to be transparent and explicit about their methodological commitments. Unfortunately,
    this imperative is nowadays honored largely in the breach, leading some to speak
    of a methodological “scandal” or “crisis,” and to express “hope” for a sort of
    “methodological consciousness-raising.”² Such talk may be hyper. But even if it
    is, the problem is very much with us. Peter Godfrey-Smith isn’t far wide of the
    mark when he writes,


    All of philosophy is plagued with discussion and anxiety about philosophical work
    should be done and what a philosophical theory should try to do.³


    At the same time, many philosophers are suspicious of offering anything like a
    recipe for doing philosophy, much less for doing it


    > ² The first of the quoted expressions is from Dummet (1978, 458), the second
    from Collingwood (1933, 4-6; cp. Baz (2017), and the final pair from Williamson
    (2007, 287), whoever elsewhere speaks of a “slow-burning crisis of philosophical
    method” (2018, 4). Much philosophy in the twentieth century occurred in the grip
    (or shadow) of “the linguistic turn” (especially the essays in Rorty 1967). Philosophy
    has traveled a long way since, but without a rigorous articulation of a non-linguistic
    approach to philosophical inquiry.


    > ³ Godfrey-Smith (2003, 5), Wilson (2017, 91) claims that “the absence of fixed
    standards in philosophy” leads to various disciplinary problems.'
