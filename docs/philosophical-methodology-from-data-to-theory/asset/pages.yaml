  md: '# 14 The Nature of Inquiry


    of theoretical inquiry (or its elements) to different degrees and can be evaluated
    by the extent to which they conform to this structure. While our model will find
    a home for the many legitimate things thaters actually do, it is not our intention
    to fully characterize all the workings and difficulties of actual instances of
    theoretical inquiry, but rather to identify its basic components and to specify
    their configuration.³ (hereafter, as in the title of this chapter, we will often
    speak simply of ‘inquiry’, eliding ‘theoretical’ for the sake of brevity).


    To illustrate our two-stage model with an example drawn from philosophy, consider
    a group of inquirer focused on the question of whether God exists. Stage one represents
    their efforts to identify considerations that must somehow be taken into account
    by a theory that adequately answers this question. Such data include: the world
    exists, that many natural objects are highly complex and organized, that the world
    contains a tremendous amount of suffering, that numerous individuals have sincerely
    claimed to experience God, that a great many people report failed to do even after
    making sincere attempts, and so on. Stage two represents the efforts of these
    iners—theists and non-theists alike—to develop theories that account for these
    and other data. If their theories are good enough, this would thereby close the
    question that opened the inquiry.


    > ³ Our model allows that inquirer may inquire without a fully determinate question
    in mind, or in pursuit of an open-ended question such as “What is such and which
    like?” Inquiries can also overlap with, nest in, and combine other inquiries.
    Indeed, thinkers undertake multiple inquiries at once, which combine to form a
    single, evolving inquiry. For example, investigations regarding defeat, context,
    and stakes may target questions uncovered in the course of investigating knowledge
    and justification; all of these inquiries (and others) may be components of one
    and the same inquiry into skepticism.'
