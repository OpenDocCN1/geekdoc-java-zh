  md: '# 6 Introduction


    been no shortage of work on issues under this heading. Indeed, we see our project
    as contributing to a rich history of reflection on philosophical methodology—hence
    the title of this book.


    However, many of the questions we''ve found it important to address when thinking
    about philosophical inquiry have received relatively little attention, especially
    in recent debates about methodology. There has been a lot of discussion of questions
    regarding (for example) the method of intuitions in philosophy, the relation between
    conceivability and possibility, the status of common sense, the prospects of experimental
    philosophy, metaphysics, conceptual engineering, and disputes between naturalists
    and their opponents—not our primary topics. Comparatively few philosophers working
    on methodology have attempted to develop models of the structure of inquiry, or
    possess accounts of philosophical data, or explicitly stated a set of criteria
    for philosophical theory construction and evaluation. These are the central topics
    of this book.


    At center stage is the notion of a philosophical theory, view, or position (we
    will use these terms interchangeably). We won''t attempt to construct a comprehensive
    theory of theories. But we recognize the following necessary condition: a theory
    is a set of claims whose success depends on its ability to adequately handle the
    data. As we discuss in Chapter 4, there is substantial controversy about what
    it is to handle the data. Rather than enter fray


