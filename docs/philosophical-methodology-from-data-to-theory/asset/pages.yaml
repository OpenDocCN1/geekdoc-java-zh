    # 2. The Theory-Ladenness of Data


    Philosophers have long worried that data are not neutral starting points but instead
    theory-laden.³ In that case, the data would be suspect, unduly stacking the deck
    in favor of a particular theory; they couldn''t play the role that data are supposed
    to play. Our characterization of the basic features of data in the previous section
    helps to sharpen the challenge. We noted that data are starting points, bearing
    an asymmetrical relation to theorizing. They are also neutral, being not only
    non-factual but also common currency among theorists. Each of these features is
    threatened if the data have already sided with a given theory. That is why the
    charge that data are theory-laden raises a worry about the very possibility of
    data.


    There are several things to say in reply to this concern. Note, first that the
    idea of the data''s being ''theory-laden'' could mean that the data are infused
    with a theory, or instead partial to a theory. These are importantly different.
    But neither, we, are inherently troublesome. The latter needn itself be in conflict
    with our description of data as neutral starting points, as there are familiar
    cases of unproblematic partiality. That physical data are partial to relativistic
    theory, for example, does not imply that the data are somehow rigged when theorizing
    the subject matter of physics, or that they are the results—rather inputs to—such
    theorizing. Likewise, infusion isn''t problematic, provided that the data are
    infused with commitments from well-supported theories in domains beyond the one
    under investigation. Consider,


