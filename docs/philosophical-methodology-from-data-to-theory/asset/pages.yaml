    disagreement as defeating claims to noetic progress. We encourage those with such
    an inclination to observe that there is substantial convergence in philosophy,
    whose extent goes unnoticed. Philosophers thinking self-consciously about their
    discipline are often attuned to the debates therein. But they shouldn’t overlook
    the vast agreement that subserves those debates. This agreement operates as a
    common framework, whose elements constitute a partial view of the domain under
