    # 5


    # The Tri-Level Method


    A sound method positions inquirers to achieve theoretical understanding. This
    chapter presents a method designed to do just that. We endorse the method not
    because it makes a philosopher’s job easy; indeed, it is quite demanding. Nor
    are we drawn to its constituent criteria because they revolutionize philosophical
    thinking; on the contrary, all of them are familiar from the way many philosophers
    go about their business. However, they have not yet been combined, integrated,
    and clarified in a way that reveals how their conjunction can promote inquiry’s
    ultimate proper goal: theoretical understanding. Because they operate at three
    distinct levels, we call the method they compose the ‘Tri-Level Method.


    Its first level directs theorists to handle the data in a given domain through
    a series of claims and commitments. The second instructs theorists to ensure that
    these claims and commitments, which comprise their theories, are themselves well-grounded,'
  - '[PAGE 115]


    # 108 The Tri-Level Method


    epistemically and explanatorily. The third charges theorists with the task of
    rendering their theories virtuous in certain respects. These are the building
    blocks of the


    **Tri-Level Method**: When constructing a theory of a given domain, theorists
    ought to articulate a set of theses about the domain that (i) accommodate and
    explain the data, (ii) are themselves substantiated and integrated, and (iii)
    possess specific theoretical virtues. All of the criteria for the first two levels,
    given by (i) and (ii), include escape clauses. Each level takes priority over
    its successors. The best theory is the one at these levels (so ordered) to the
    highest degree relative to its rivals.


    This austere formulation of the Tri-Level Method hints at how the method preserves
    insights in the four popular methods from Chapter 4. It does so partly through
    the assignment of important roles to analysis (which may subserve accommodation,
    explanation, or substantiation), argument (as an element of substantiation), equilibrium
    (since coherence is central to integration), and miscellaneous theoretical benefits
    (in the form of virtues). Yet the Tri-Level Method neither repises those rivals
    nor simply joins their disparate criteria. The method calls for much more than
    mere analysis, argument, equilibrium, or theoretical virtues, while also rejecting
    the notion that its criteria are roughly equal and aggregative. This sets it apart.


    We offer the following diagram of the method''s five criteria, which visually
    depicts their organization.'
