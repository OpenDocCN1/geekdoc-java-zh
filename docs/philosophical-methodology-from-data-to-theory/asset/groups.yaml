    # The Structure of Inquiry 21


    Each view makes assumptions about data. Realists typically assume that the metaethical
    data consist of commonsensorial or intuitive claims, some of which appear to imply
    that there is an objective moral reality that thought and discourse represent.
    Expressivists ordinarily assume that the data primarily concern moral language
    and moral judgment, emphasizing connections among moral discourse, moral thought,
    and action.


    Likewise, each view makes assumptions about theorizing. Realists typically hold
    that a satisfactory theory ought to endorse the implications of common sense or
    intuition, abandoning them only when challenges to them cannot be adequately met.
    Expressivists, for their part, typically assume that a satisfactory theory must
    be parsimonious, not positing any features that are explanatorily dispensable.
    They add that a satisfactory theory must be sufficiently continuous with the natural
    sciences tell us about the world.


    These assumptions are not idle; rather, they have fueled much of the debate between
    realists and expressivists. Adherents of each view draw very different conclusions
    because of their divergent assumptions about data and theorizing. Realists typically
    conclude that since their theory endorses the implications of common sense or
    intuition, and has adequately met the relevant challenges, theirs is the view
    to beat.¹10 Expressivists ordinarily conclude that their view alone handles the
