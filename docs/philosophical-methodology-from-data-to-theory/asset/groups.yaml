    of a given datum. The epistemic reasons specify these conditions.


    The challenge is to identify conditions that avoid two extremes. On the one hand,
    it shouldn''t be too easy to qualify as a data disabler. For example, data are
    not rightly rejected just because they conflict with one''s pet theory, or because
    addressing them would be complicated. On the other hand, it shouldn''t be too
    difficult for theorists to identify data disablers, since inquiry shouldn''t be
    biased towards conservative conclusions.


