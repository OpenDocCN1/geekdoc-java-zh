    # ACKNOWLEDGMENTS


    This book has a somewhat unusual origin story. In 2013, the three of us hatched
    a plan to write a book in metaethics, an early version of which was the topic
    of a three-day workshop at the Vrije Universiteit, Amsterdam in 2015. That workshop
    transformed our project. One important critique went something like this: “You’ve
    advertised your book as implementing a distinctive philosophical methodology.
    But you’ve only sketched its contours. Let’s hear more!


    Attempting to respect this admonition proved to be challenging. The more we thought
    about philosophical methodology, the more we felt needed saying. So rather than
    simply fold our views on this topic into a manuscript on moral philosophy, we
    determined to write a self-standing monograph on philosophical inquiry in general.
    The result is the short book before you.


    Our debts to those who helped us are many. We’re especially grateful to René van
    Woudenberg and his colleagues for their contributions to the workshop they organized
    at the Vrije, and to Selim Berker, Anandi Hattiangadi, Tristram McPherson, and
    Mike Ridge for having taken the time to read our work and provide extensive and
    penetrating criticisms of it at this event. Thanks also to Peter Momtchiloff,
    our stellar editor at OUP, who enlisted Chris Daly, Joel Pust, and (once more)
    Tristram McPherson to serve as reviewers; each offered helpful feedback on a draft
    of the manuscript. Addressing their incisive comments extended our project by
    many months—all, we hope, in the aid of a work that is clearer and deeper than
    it would''ve been without the benefit of their critical attention.


    We initially aired some of our ideas on methodology in a pair of articles from
    2019,¹ as well as at numerous venues, including Brown University, Jilin University,
    the German Society of Analytic Philosophy in Berlin, Lingnan University, the LOGOS
    Research Group at the University of Barcelona, Harvard University, MIT, Stockholm
    University, the University of Vermont, the University of Wisconsin–Madison, Washington
    University in St. Louis, and the University of Texas at Austin. Thanks very much
    to all of the participants at these colloquia, conferences, and seminars, as well
    as to many other generous interlocutors, for illuminating discussions that greatly
    improved our work.


    ¹ Bengson, Cuneo, and Shafer-Landau (2019a and 2019b).


    # LIST OF ILLUSTRATIONS


    - 1. Sherlock Holmes collecting data. Sydney Paget, illustration for Sir Arthur
    Conan Doyle’s “The Boscombe Valley Mystery,” The Strand Magazine (October 1891)
    18

    - 2. Nordic and Russian traders bartering. Woodcut illustration for the Library,
    The Met Peoples of Olaus Magnus’ History of the Nordic Peoples (1555) 42

    - 3. Knowledge how to dance. Eadward Muybridge, Animal Locomotion, Plate 187 (1887),
    Rogers Fund, transferred from the Library, The Metropolitan Museum of Art 66

    - 4. Socrates, Aspasia, Pericles, and Alcibiades in debate. Felice Giani, Drawing,
    Socrates, Pericles, Alcibiades, Aspasia in Discussion, 1810–25; designed by Felice
    Giani (Italian, 1758–1823); Italy; pen and brown ink, brush and brown over traces
    of graphite on light-brown laid paper; 14.5 x 16.5 cm (5 11/16 x 6 1/2 in.); museum
    purchase through gift of various donors; 1901-39-3341; Cooper Hewitt, Smithsonian
    Design Museum 81

    - 5. An alleged composite object disassembled. Todd McLellan, Disassembled Bicycle
    (2020). © Todd McLellan—Things Come Apart—www.toddmclellan.com 87

    - 6. Panthera tigris. Hokusai School, India ink painting, Tiger (1805), Fletcher
    Fund, 1938, The Metropolitan Museum of Art 119

    - 7. Descartes on mind–body interaction. Gerard van Gutschoven, illustration for
    René Descartes'' L''homme, Paris (1664) 129


    # Introduction


    This book is an attempt to understand philosophical inquiry. We suspect that you,
    like us, have grappled with a philosophical question—perhaps a question about
    consciousness, free will, or the possibility of knowledge. You''ve felt its force,
    as well as the urge to understand, to make sense of. And so commences a familiar
    venture: to find, or develop, a theory that succeeds in doing this.


    We are motivated to take up this topic for several reasons, beyond our conviction
    in the value of understanding what we do. One is that commitments regarding inquiry
    deeply shape philosophical discussion and debate. When these commitments diverge,
    they often do, this can lead to serious misunderstandings and incite disagreements—a
    “battlefield of endless controversies,” in Kant’s phrase.¹


    ¹ Kant (1781/1998).


    Philosophical Methodology: From Data to Theory: John Bengson, Terence Cuneo, and
    Russ Shafer-Landau, Oxford University Press. © John Benson, Teresa Cuneo, and
    Russ Shafer-Landau 2022.

    DOI: 10.1093/oso/9780192862464.003.0001


    # 2 Introduction


    And yet these effects are avoidable. Just as Buddhism teaches that a certain kind
    of insight eliminates the source of suffering, we’re convinced that a clearer
    view of philosophical inquiry is apt to help dissolve misunderstandings and disagreements
    whose sources are methodological.


    Another reason to write this book, which takes on special importance when viewed
    against these observations, is to equip philosophers to satisfy the imperative
    to be transparent and explicit about their methodological commitments. Unfortunately,
    this imperative is nowadays honored largely in the breach, leading some to speak
    of a methodological “scandal” or “crisis,” and to express “hope” for a sort of
    “methodological consciousness-raising.”² Such talk may be hyper. But even if it
    is, the problem is very much with us. Peter Godfrey-Smith isn’t far wide of the
    mark when he writes,


    All of philosophy is plagued with discussion and anxiety about philosophical work
    should be done and what a philosophical theory should try to do.³


    At the same time, many philosophers are suspicious of offering anything like a
    recipe for doing philosophy, much less for doing it


    ² The first of the quoted expressions is from Dummet (1978, 458), the second from
    Collingwood (1933, 4-6; cp. Baz (2017), and the final pair from Williamson (2007,
    287), whoever elsewhere speaks of a “slow-burning crisis of philosophical method”
    (2018, 4). Much philosophy in the twentieth century occurred in the grip (or shadow)
    of “the linguistic turn” (especially the essays in Rorty 1967).


    ³ Godfrey-Smith (2003, 5), Wilson (2017, 91) claims that “the absence of fixed
    standards in philosophy” leads to various disciplinary problems.

