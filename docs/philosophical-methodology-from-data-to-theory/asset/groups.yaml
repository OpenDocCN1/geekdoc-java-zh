    Or it might involve identifying a data disabler, which supplies an undefeated
    epistemic reason that defeats the reason favoring the datum in question (as discussed
    in Chapter 3, §3).


    Third, a view might satisfy the Accommodation Criterion to a greater or lesser
    degree. There are both quantitative and qualitative dimensions to this last point.
    Quantitatively, a theory might meet this criterion with respect to some but not
    all of the data; it requires supplementation in order to handle the remainders.
    In such a case, theory incurs burdens of accommodation that can be discharged
    only by augmenting the original view. If the amended view manages to discharge
    those burdens, then it fares better than the original by the lights of this criterion.
    Qualitatively, a theory might do a stellar job at satisfying the criterion with
    respect to a data set, perhaps by rendering its members highly likely. Alternatively,
    a theory might render them just barely likely, in which case the theory would
    satisfy the Accommodation Criterion, but only passably.


    ## 1.2 The Explanation Criterion


    It is not enough for a theory to render the data likely. Its job is also to explain
    them. This is the point of the


    > 2 In Chapter 3 (§1), we characterized a good reason as an undefeated epistemic
