    # Introduction


    well. Philosophy, it may be said, is too difficult, creative, and unpredictable
    for there to be a helpful way of describing how it ought to unfold. So we shouldn''t
    aim to devise a theory of philosophical inquiry. Nor should we be advising other
    philosophers on how to go about their business.


    We agree that the search for a recipe for philosophical success is misguided,
    and issuing recommendations risks immodesty. But it doesn''t follow that there
    is nothing interesting or important to be said about philosophical inquiry.


    For one thing, we can distinguish different types of philosophical inquiry. Philosophy
    can be undertaken in a practical mode, for example, as a means to some personal,
    social, political, or ethical end. It is also possible to philosophize in an aesthetic
    mode; perhaps this is the right way to think of those who engage in philosophical
    activity just because they find it elegant, arresting, or awe-inspiring⁵ Other
    modes are possible. While ourselves are pluralists, endorsing the compatibility
    and legitimacy of these different options, we focus here on philosophical engagement
    in the theoretical mode. As will emerge, we understand this to be the inquiry
    that is aimed at securing an epistemically satisfactory resolution of the questions
    that prompt it.


    > ⁴ Therapeutic missions are often read into Socrates'' connection between philosophy
    and "training for death," and attributed to Confucius, the Stoics and Epicureans,
    Kierkegaard, and the late Wittgenstein, while a political one is gleaned from
    Marx''s eleventh thesis on Feuerbach: "Philosophers have hithertoitherto only
    interpreted the world in various ways; the point is to change it." Cp. Hadot (1981/1995)
    and hooks (1991).


    > ⁵ Cp. Nozick (1981, 20).


    # Introduction


    Our primary goal is to address five central questions about philosophical inquiry,
    understood as a species of theoretical inquiry. The first two can be stated simply:


    - What is the structure of philosophical inquiry?

    - What is the principal goal of philosophical inquiry?


    Answering these questions requires developing a model of such inquiry that identifies
    its basic components, how they’re organized, and what those elements, so organized,
    aim to achieve. We do these things in Chapter 1.


    According to the model we develop there, the two main components of philosophical
    inquiry center on data and a method of theorizing—the former being starting points
    of inquiry, and the latter a set of criteria for theory construction and evaluation.
    The principal goal, we''ll argue, is a certain type of understanding, which can
    serve as a measure of philosophical progress. Accordingly, our next three questions
    are:


    - What are philosophical data?

    - What is a sound method for philosophical theorizing?

    - Is there reason to think that philosophical progress can be or has been made?


    The remainder of the book, Chapters 2 through 6, takes up these questions.


    We answer the third question, concerning data, by detailing an epistemic theory
    of data that privileges pre-theoretical claims that inquirers have good reason
    to believe. Our discussion highlights the role of data in inquiry, defends philosophical
    data against the charge of theory-ladenness, illustrates the varieties of data
    and procedures for data collection, and contrasts our preferred view with rivals
    that analyze data in sociological, metaphysical, psychological, or linguistic
    terms. We do this work in Chapters 2 and 3.


    Our answer to the fourth question, concerning around a specific set of criteria
    for theory construction and evaluation. We''ll argue that a theory that satisfies
    these criteria resolves inquiry by providing a certain type of understanding.
    In arguing for this claim, our project makes some of its normative commitments:
    we do not merely offer an account of what philosophical inquiry is, but take a
    stand on what it is to do well, by charting how its success is possible. This
    enterprise takes up Chapters 4 and 5. In Chapter 4, we review classic and contemporary
    philosophical texts with an eye to identifying a variety of methodological virtues.
    We then consider some prominent philosophical methods, pinpointing both their
    attractions and their shortcomings. This sets the stage, in Chapter 5, for our
    presentation and initial defense of the philosophical method that we endorse,
    which we label the ‘Tri-Level Method.’


    The fifth question, concerning progress, forces us to confront a familiar anxiety
    about philosophy—namely, stable success is largely or entirely beyond reach, despite
    millennia of efforts. In Chapter 6 we attempt to soothe this using the Tri-Level
    Method to illustrate and explain philosophical progress. Moreover, we introduce
    a previously overlooked distinction that allows us to block an invidious comparison
    between advances in philosophy and in other disciplines.


    Philosophical questions about inquiry, data, and theorizing are often grouped
    together, along with other questions, under the heading of ‘methodology.’ We follow
    this practice here. There has been no shortage of work on issues under this heading.
    Indeed, we see our project as contributing to a rich history of reflection on
    philosophical methodology—hence the title of this book.


    However, many of the questions we''ve found it important to address when thinking
    about philosophical inquiry have received relatively little attention, especially
    in recent debates about methodology. There has been a lot of discussion of questions
    regarding (for example) the method of intuitions in philosophy, the relation between
    conceivability and possibility, the status of common sense, the prospects of experimental
    philosophy, metaphysics, conceptual engineering, and disputes between naturalists
    and their opponents—not our primary topics. Comparatively few philosophers working
    on methodology have attempted to develop models of the structure of inquiry, or
    possess accounts of philosophical data, or explicitly stated a set of criteria
    for philosophical theory construction and evaluation. These are the central topics
    of this book.


    At center stage is the notion of a philosophical theory, view, or position (we
    will use these terms interchangeably). We won''t attempt to construct a comprehensive
    theory of theories. But we recognize the following necessary condition: a theory
    is a set of claims whose success depends on its ability to adequately handle the
    data. As we discuss in Chapter 4, there is substantial controversy about what
    it is to handle the data. Rather than enter fray


    > 6 See, e.g., Gendler and Hawthorne (2002), Chalmers, Manley, and Wasserman (2009),
    Haug (2013), Overgaard, Gilbert, and Burwood (2013), Daly (2015), Livingood and
    Sytsma (2015), Cappelen, Gendler, and Hawthorne (2016, Part III), D''Oror and
    Overgaard (2017), Machery (2017), and Burgess, Cappelen, and Plunkett (2020).

    > 7 Some of the topics we''ll tackle have received more attention: for example,
    the status of reflective equilibrium, what we can expect philosophical argument
    and analysis to achieve, and whether simplicity and other putative virtues are
    probative in a philosophical context.


    While our discussion covers a fair amount of territory, we have aimed at concision.
    This book is short. Its primary goal is to present an account of philosophical
    methodology without chasing down all the implications of the account or discussing
    the full variety of issues that bear upon it. In particular, we''ll be introducing
    elements in our account that are susceptible to precisification in different ways,
    and we''ll deliberately present these elements at a level of abstraction that
    does not take a stand on every detail, but allows for healthy debate about how
    best to fill them in.


    While we will focus on philosophical inquiry, we believe that a good deal of what’s
    comes can be extended to other genres of theoretical activity, such as science,
    history, and some subfields of mathematics. But we won''t always attempt to make
    these connections or comment on their viability. Nor will we endeavor to canvass
