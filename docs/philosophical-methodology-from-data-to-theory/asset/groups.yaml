    view is likely to be deficient. By contrast, if the remainders are relatively
    few, the theory may be in good shape, poised to provide theoretical understanding
    of its subject matter.


    Indeed, both criteria at level one features of understanding. By satisfying the
    Accommodation Criterion, a view has a greater chance of being *accurate*; by fulfilling
    the Explanation Criterion, it offers a greater promise of being *illuminating*;
    by jointly doing these things with respect to data, the theory achieves *robustness*.⁵


