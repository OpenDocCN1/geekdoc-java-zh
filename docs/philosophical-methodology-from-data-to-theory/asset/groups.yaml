    如果缺乏范围和理性的支持，那么这种权衡将严重削弱该理论促进理解的能力。如果是如此，它的简洁性可能在任何方面都无法胜出，更不用说弥补其他方面的缺陷了。**成本-效益法**纵容了这种可疑的行为，使其不仅显得不完整，而且可能是恶性的。


    接下来转向“反思平衡法”。这种方法显然具有两种方法论上的优点，既是全面的，又具有比较性。它还可能是总括性的。遗憾的是，该方法是不完全的，而且也可能是恶性的。²⁷


    为了理解其原因，请记住，它允许理论者引入各种类型的新主张，只要这样做就能增加平衡。事实上，如果理论者想要避免简单地重复该方法的起点（即最初的经过考虑的判断），他们将被迫进行此类补充。因此，该方法为系统性理论打开了大门，而这些理论的主张除了连贯性之外，没有任何其他支持它们的考量。这引发了担忧：反思平衡法并没有提供足够的支持要求。它认可了那些属于“与谣言和骗局放在一个盒子里”的产出——援用威尔雷德·塞尔斯（Wilfred
    Sellars）针对狭隘关注连贯性的尖刻评价。²⁸


    此外，该方法在维度和层次上似乎显得不足，因为（像成本-效益法一样），它似乎许可了非法的权衡。有时，只有通过放弃外延充分或理性支持的原则，转而采用缺乏这些特征的原则，才能实现平衡。作为一种可能性，想象关于某个领域的准确主张极其复杂；因此，它与各种承诺处于紧张状态。进一步想象，关于该领域的另一种替代且不准确的主张要简单得多，并且不会引发同样的紧张关系。在这种情况下，我们可能通过第二种主张极大增强平衡。即使准确性有时可以与其他特征进行交换，但我们刚刚描述的这种权衡在我们看来是一项糟糕的交易。


    如果这些担忧是合理的，那么反思平衡法未能处理这种德性的数据。由于该方法遗漏并可能阻碍了一个或多个德性方法论的要素，它充其量是不完整的，最坏则是恶性的。


    ## 4.2 实现探究的最终正当目标


    到目前，我们根据这四种方法在方法数据方面的糟糕表现，对这四种方法进行了负面评价。评价的第二个理由，是源于对这些方法交付探究最终正当目标的能力的直接评判。我们将一个“健全的方法”定义为：成功遵循其指令能使探究者处于能够实现这一目标的位置，我们认为这一目标是**理论理解**。这种理解要求对理论有充分把握，且该理论是准确的、基于理性的、稳健的、启发的、有序的且连贯的。我们没有理由认为上述任何方法能够产生具备这六个特征的理论，有理由认为每种方法注定会力不足。


    **分析法**即使在被宽泛解释为：其实施产生了一系列准确、基于理性、连贯并对分析对象提供某些解释性启示的分析时，仍然可能无法产生完成所有所需解释的理论。或者，该方法并未准备产生稳健的（回答某个领域的核心问题，而这些问题是多且多样化的）理论，或是有序的理论（超越一组特定特征的解释，从而提供关于领域内各种元素如何相互关联的更广阔视角）。**论证法**也处于类似的境地。因为它仅仅批准论证的结论，而结论（正如我们在引言中提到的）远未达到理论，更不用说是稳健、有序且启发的理论了。探究者可以分析和论证到“牛回家”，但分析和结论必须经过整合和解释，才能交付一个产生对领域理解的理论。这种整合性和解释性的工作出了分析法和论证法的范畴。


    我们对另外两种方法的担忧呈现出不同的形式。在**成本-效益法**中，从某种意义上说，一切都是可夺取的。它确实选择了同时具备理解的所有六个特征的理论。例如，如果一个理论成功地以准确性的代价获得了高度启发、稳健、有序和连贯，那么该方法就许可将后者视为可弃。在另一种语境下，不同的成本和效益组合可能会使不同的特征变得可弃。相比之下，成功实施反思平衡法可以保证一个理论至少是稳健、有序且连贯的。但该方法臭名地未能让探究者进入实现哪怕是一点点准确性的轨道；也不清楚它所青睐产出是否在指示意义上是基于理性的。事实上，如果帮助探究者实现平衡的修改、增加或放弃偏离了目标、缺乏支持或破坏了稳健性，那么获得的平衡将无法促进理论理解。


    需要明确的是，做出这些判决并不意味着我们认为所有四种方法都是没用的。正如我们所注意到的，这些方法帮助探究者实现探究的正当目标，例如辩护信念或知识。²9 然而，现在的问题在于是否存在一种健全的方法，能够交付一个实现探究最终正当目标的理论，即理论理解。从这来看，我们讨论过的所有方法没有一个达到标准。


    ## 4.3 补救措施


    这些方法的支持者可以自由尝试弥补我们发现的缺陷，以便他们偏好的方法能够充分处理所有三个数据。但并不清楚这些方法是否易于修复。因为此类修订几乎不是偶然；而是相当于方法基本指令的重大更改。


    例如，考虑反思平衡法。为了确保这种方法具有足够的层次性，其指令需要经过修订，以禁止通过糟糕交易（如上所述）获得平衡的可能性。然而，这似乎引入了除平衡之外的其他标准——这是对该方法精神而非仅仅是文字的修订。或者，为了确保成本-效益法不许可非法权衡，支持者需要修改其构成标准，以否认各种利益（相应的成本）是大致相等且可加的。我们的观点是，这种修订是不可能的，而且面临着将该方法变成它不是的东西的风险。


    为了进一步理解挑战，考虑方法防御者可能提供的几种回应。代表成本-效益法时，克里斯·戴利（Chris Daly）写道，该方法的潜在批评者并不是拒绝方法本身，而是拒绝对各种成本和效益的权重……辩论的焦点不在于成本-效益法的适用性，在于哪些因素是成本，哪些是利益，以及给予它们什么样的权重。


