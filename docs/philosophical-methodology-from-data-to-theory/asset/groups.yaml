    # 142 Philosophical Progress


    How-To Question: How is it possible for philosophy to make noetic progress with
    respect to its central questions?

    Evaluative Question: How is it possible to attain a principled evaluation of philosophy’s
    noetic progress (if any) with respect to its central questions?


    These questions are related in interesting ways. Answering the second pair requires
    the provision of a method that can guide the construction of philosophical theories
    poised to furnish theoretical understanding, and to enable a principled assessment
    of the extent to which they deliver this good. If our method-oriented diagnosis
    above is correct, providing such a method is also required to answer the first
    pair of questions in a fully satisfying way. So, although the existential and
    comparative questions have received the bulk of the attention in recent literature,
    we submit that the how-to and evaluative questions identify the root of the problem.


    In this chapter, we''ll discuss how the Tri-Level Method positions us to offer
    answers to all four questions, beginning with the second pair.


    # 1. The How-To and Evaluative Questions


    To appreciate how the method assists with addressing the how-to and evaluative
    questions, it will be helpful to distinguish three interlocking but distinct intellectual
    projects.


    Theory construction consists in developing a candidate theory of a given domain
    by articulating a set of claims about the data in that domain that satisfy the
    Accommodation, Explanation, Substantiation, and Integration Criteria (and the
    Virtue Criterion, as relevant).


    > 4 Many discussions of philosophical progress omit one or more of the questions
    we''ve identified. Chalmers (2014, 3) help distinguishes the first pair while
    also diagnosing the root problem as one of method.


    Theory appraisal consists of applying these criteria to a theory in order to determine
    how well it fares with respect to each of the method''s first two levels. Theory
    comparison consists in placing appraisals of multiple theories side by side to
    determine which view fares best with respect to the criteria at the first two
    levels (and the Virtue Criterion, in case of a tie).


    The Tri-Level Method makes it possible for inquirers to achieve noetic progress
    on each of these intellectual projects. Our answers to the how-to and evaluative
    questions explain how.


    ## 1.1 Answering the how-to question


    The how-to question focuses on theory construction, asking after philosophy''s
    ability to develop theories that make noetic progress with respect to its central
    questions. Our answer should now be clear: by constructing a theory of a domain
    that satisfies the four criteria at levels one and two to a high degree, and (as
    relevant) the fifth criterion at level three.


    We hasten to emphasize that when satisfying these criteria, inquirers may at various
    points need to draw upon work done by theorists working in other areas. This sort
    of division of labor, in which a theorist relies on the contributions of others
    to help execute the method''s instructions, is not illicit, so long as theorists
    are forthcoming about the precise junctures which they do. Because so much of
    philosophy is interconnected, because the call for explanation and defense can
    extend almost indefinitely, and because a showing of internal and external integration
    can be such a complicated matter, it is perfectly legitimate for theorists to
    cite the fruits of others'' labor in lieu of providing complete substantiations
    and integrations themselves. It is a virtue of our preferred method that inquirers
    are encouraged to lean on each other in this way (and to acknowledge when they
    do).


    Our answer to the how-to question leaves much open. In particular, the Tri-Level
    Method does not itself drill down and include precise instructions on how best
    to engage in theory construction. Theorists are called on to accommodate and explain
    the data; they are instructed to substantiate and integrate their claims; they
    must, as needed, craft views with an eye to their virtuosity. But the method itself
    does not dictate specific ways in which to do these things. (For example, as noted
    in Chapter 5 (§2.3), it may be useful to take up the levels in order. But inquirer
    may find cause to revert to the first at any time; after all, handling the data
    is normally an ongoing venture.) Being somewhat open here is an advantage, as
    it offers theorists flexibility in their constructive efforts, allows for a diversity
    of legitimate paths to theory construction, and spurs the creativity of inquirers
    to assemble theories that are sensitive to the method''s constituent criteria.
    While our presentation of these criteria is compatible with many different ways
    of filling in various details, we can afford to remain neutral on them, as they
    don''t affect the basic shape of our answer to the how-to question (or indeed
    any other aspect of the problem of progress).


    ## 1.2 Answering the evaluative question


    While the how-to question is directed to matters of theory construction, the evaluative
    question focuses on theory appraisal and comparison, which are both facets of
    evaluation. How is it possible to attain a principled evaluation of philosophy''s
    noetic progress (if any) with respect to its central questions? By once more following
    the Tri-Level Method: applying its criteria in order to determine the extent to
    which a theory of a given domain has accommodated and explained the data in that
    domain, substantially and integrated its claims and commitments, and (as relevant)
    realized various theoretical virtues. We will first discuss how the method helps
    with theory appraisal before turning to its treatment of comparative evaluation.


    When setting out the method''s criteria in the previous chapter, we proposed that
    a theory is minimally adequate just in case it does modestly well when it comes
    to the criteria at level one, and respectable just in case it also does modestly
    well regarding the criteria at level two. Other categories of appraisal are possible.
    For example, an ideal theory, which satisfies all of the Tri-Level Method''s criteria
    to a maximal degree, would bestow an extraordinary sort of understanding. But
    a theory need not be ideal to be excellent, in the sense of supplying understanding
    of target domain that is both substantial and such that further constructive efforts
    are likely to foster modest improvements. For us inquirers, an excellent theory
    is an eminently worthy goal.


    We recognize that philosophers who agree about the data sometimes disagree about
    what claims yield accommodation and explanation. They also sometimes disagree
    about what an adequate defense or explanation would be, or which claims call for
    explanation. Whether one coheres with another is sometimes contested; whether
    it fits with our best picture of the world, and what the elements of that picture
    include, are subject to further dispute. Such controversies are natural. But they
    don''t threaten the letter or the spirit of the criteria we''ve identified so
    far. In fact, there is a sense in which these criteria are often presupposed in
    such controversies.


    Granted, these controversies can pose a practical challenge to the project of
    appraisal. But the difficulties are mitigated to the extent that there is widespread
    agreement on a broad range of issues. To illustrate, epistemologists have for
    the most part shared the view that any theory of priori knowledge should address
    at least the following topics:


    - (1) how we come to possess such knowledge;

    - (2) whether it is empirically defeasible;

    - (3) whether it can be synthetic and not merely analytic; and

    - (4) the extent to which it coheres with our best picture of the world.


    To be sure, there is sometimes disagreement about which of the items deserves
    the first look when developing a view of the priori. Many skeptics of the priori
    emphasize (2) and (4), while its proponents tend to focus on (1) and (3).


    > 5 Skeptics include Quine (1951), Kitch (2000), and Devitt (2014); proponents
    include Bealer (1992), Bonjour (1997 and 2014), Chalmers (2002), and Peacock (2004,
    Ch. 6).


    Though these disagreements are important, they should not obscure the fact that
    there is very considerable agreement that a satisfactory theory must somehow address
    all four.


    Furthermore, it is now widely accepted that some influential attempts to say what
    a theory''s claims must be like miss the mark. Take, for example, Paul Benaceraf''s
    suggestion that any view that commits itself to a priori knowledge of mathematical
    truths must explain this commitment by identifying a causal relation between

