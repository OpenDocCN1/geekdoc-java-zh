    We do not take a stand here on the comparative merits of specific procedures,
    or on whether their promise will vary depending on the philosophical domain under
    investigation. Nor will we scrutinize traditional procedures or the ways in which
    they might encode systemic prejudices or biases. Our aim is not to settle such
    matters, rather to reveal the structure of stage one of inquiry, and to show that
    the epistemic reasons theory offers a helpful perspective on the inner workings
    of data collection. Accordingly, we leave room for more detailed discussions about
    the viability of specific procedures, which our account of stage one helps to
    discipline. For the distinction between sources and techniques reminds us to keep
    the merits (or demerits) of one element of a procedure from those of another,
    while the epistemic reasons theory explains why the relevant merits (or demerits)
    are epistemic.


    If pursued indefinitely, data collection would likely yield indefinitely many
    data. Since working with such a pool would be impractical, there are compelling
    reasons for theorists to seek out a relatively small data set. This can be done
    by bracketing those data whose handling would shed light on the central questions
    in a given subfield. Foremost among these are miscellaneous data subsumed by other
    data. A domain’s ‘core’ data are not like this. For an example of a datum that
    does not belong to the core, consider the claim that sheltering the homeless tends
    to contribute to a good life. Although this is a prime candidate for a datum about
    the good life, signing it out would be relatively un. After all, it’s also a datum
    that active engagement in rewarding activities tends to contribute to a good life,
    and whatever considerations handle the latter datum would presumably do the same
    for the former, though not vice versa.


    # 68 The Epistemic Theory of Data


    # Core Data in Contemporary Metaethics


    Since each domain contains a very large number of core data, the threat of cherry-picking
    is genuine. It is good practice for inquirers to occasionally take inventory,
    ensuring that their theorizing at stage two is properly moored.


    To illustrate what this might look like, consider contemporary metaethics, whose
    central questions include "Is morality objective?", "How is moral knowledge possible?",
    and "Why moral?” Inquirers in those domains recognize a wide range of data spanning
    the normative, metaphysical, epistemic, psychological, and semantic dimensions
    of morality. Some of these qualify as core data. For example:


    - *Correlation*: How things are morally correlated with how things are non-morally.

    - *Independence*: Some moral demands hold regardless of what the subjects of those
    think, feel, desire, hope, fancy, etc.

    - *Inescapability*: Some moral demands and reasons are inescapable with respect
    to normative assessment.

    - *Priority*: Moral demands and reasons sometimes have priority over non-moral
    ones.

    - *Non-Arbitrariness*: Morality is not arbitrary.

    - *Non-Contingency*: It''s not deeply contingent that some things have the moral
    features they do.

    - *Practicality*: Moral judgments have marks of practical attitudes; they direct,
    guide, and motivate action.

    - *Declarative*: Moral judgments have marks of declarative attitudes; they are
    predicative, truth-evaluable, and apt for inference.

    - *Grasp*: Moral agents sometimes grasp, or are duly placed to grasp, moral reality.

    - *Fallibility*: Moral agents can be mistaken about moral reality.

    - *Evident*: Some moral claims are evident, sometimes highly so.

    - *Agreement*: There is widespread moral agreement about a range of moral issues.

    - *Disagreement*: There is widespread moral disagreement, some of which may be
    unsolvable.


    These data do not exhaustively characterize the metaethical dimensions of moral
    thought, discourse, and reality. Nor are they fully precise, since they—like nearly
    all data—are fairly vague and open to clarification or explication. For example,
    they do not wear on their face their scope or modal force. Given that data are
    inputs to theorizing, as neutral starting points, they can be approached in different
    ways, and further reflection may reveal precifications that are considerably more
    determinate. Quarrels about such matters are fully compatible with recognizing
    all of the above as core data in metaethics.


    Even without an algorithm for identifying core data, we can enlist various heuristics
    to assist us in this project. For example, inquirers can check whether a datum
    in domain D is saturated with minutiae, or is also a datum in many other domains
    besides D, or is entailed by another datum in D; any of these would serve to deifiably
    indicate that the datum is not among the core in D. Alternatively, inquirers can
    ask whether a datum has played a central role in a philosophical debate concerning
    a given domain; its doing so would signal that it is a core datum therein. This
    conservative heuristic is counterbalanced by a more progressive one: should it
    turn out that a datum has been overlooked by those inquiring about a given domain,
    but its handling promises to transform debate regarding that domain, then this
    suggests that it is a core datum therein. Some procedures are likely to be better
    than others at implementing such heuristics, and so pinpointing a domain’s core
    data. In this way, a lot can ride on which procedures are selected for use in
    the process of data collection.


    # 70 The Epistemic Theory of Data


    # 3. Data Imposters, Data Disablers


    We’ve emphasized that data play a central role in the construction and evaluation
    of theories. Because they are neutral starting points that constrain inquiry,
    no theory can simply dismiss or ignore them. But as we’ve emphasized, data are
    not inviolable, and we are fallible collectors of data. So any sound method of
    philosophical theorizing must allow for two possibilities.


    The first is of exposing a putative datum as a mere pret, a datum in name only.
    Doing this is a matter of discovering that there is not, despite appearances,
    a good reason to believe a given claim, at least among inquirers considered collectively.
    Such claims are not data but imposters. They can be unmasked in myriad ways.


    Inquirers might be reminded of a flaw in the procedure they used when collecting
