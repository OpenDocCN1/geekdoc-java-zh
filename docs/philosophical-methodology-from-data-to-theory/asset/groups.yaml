    156 Philosophical Progress


    for a sizeable portion of the pessimism about philosophy, and for a good deal
    of the invidious comparisons between its progress and that of other fields.


    ## 2.3 Forms of noetic progress


    The foregoing remarks do not constitute answers to the existential and comparative
    questions, but do help to set the stage. The next step is to proffer compelling
    examples of noetic progress, which can take several forms.


    First, understanding can be improved by identifying deep difficulties with claims
    or arguments that once seemed viable. Edmund Gettier''s counter-examples deflated
    the JTB analysis of knowledge; logical positivism was undone by work that revealed
    the self-undermining character of its verifiability criterion; hedonism has been
    dogged by the specter of Robert Nozick''s experience machine; after the endorsement
    of the logical problem of evil has largely disappeared, after the incisive analyses
    of Helen Longino and others, the long-standing notion that science is wholly value-free
    has breathed its last.$^{17}$ These instances are instances of manifest progress,
    even if there are pockets of resistance to the lessons to be taken from such work.
    For these negative conclusions sponsor positive views that, while continuing to
    be reason-based, robust, illuminating, orderly, and coherent, are now more accurate
    than the theories that were usurped.


    $^{17}$ Because we take the examples in this paragraph and the rest of this subsection
    to be familiar to many readers, and in order to avoid overwhelming you with footnotes,
    we will pass on our usual custom of offering citations.


    ## The Existential and Comparative Questions 157


    Second, noetic progress can be made by articulating distinctions whose previous
    oversight hampered theorizing about a given domain.¹18 Our understanding of the
    mind has substantially improved as a result of regimenting the difference between
    phenomenal and access consciousness. Prizing apart varieties of multiplicity (e.g.,
    ontological, qualitative, ideological, syntactic, etc.) promotes a better understanding
    of its role(s) in theory choice. The fourfold Hoffman division among types of
    rights and their correlative duties has assisted enquirers in cutting through
    various ambiguities and confusions when theorizing about these normative relations.
    Conceptions of free will have been enhanced by incorporating a distinction between
    agent- and event-causation. In each of these areas, theories attentive to such
    distinctions have a far greater chance of possessing one or more of the six understanding-enabling
    features.


    Third, noetic progress can take the form of incrementally improving the viability
    of existing theories. There are countless examples to choose from. The proto-utilitarianism
    of Hume, or even the codified formulation offered by Bentham, is far less sophisticated
    and comprehensive than the consequentialist theory available in Sidwick''s Methods
    of Ethics. Similarly, today''s versions of metaethical expressivism are light-years
    ahead of the non-cognitivist views they descend from. The philosophy of race has
    also developed in ways that render contemporary theories exponentially better
    than those contemplated in previous generations. Several factors make such innovations
    possible, including expansion of the “explanatory store” that philosophers are
    able to


    > ¹⁸ Cp. Gutting (2009 and 2016).


    # Philosophical Progress


    draw upon when refining their theories.¹19 Recent theorizing has illuminated the
    contents of this store: relations as supervenience, constitution, realization,
    composition, identity, grounding, and more can now be deployed in philosophical
    accounts. With these relations in hand, theorists can amplify and refine their
    views in ways that enhance understanding.


    Fourth, noetic progress may occur by expanding the field of important possibilities
    in a given domain.20 Examples here are also abundant, and include W.D. Ross’s
    theory of prima facie duties in normative ethics, Ernest Sosa’s and Linda Zagzebski’s
    virtue epistemologies, Ruth Barcan Marcus’s contributions to modal logic, and
    Martha Nussbaum’s capabilities approach to well-being. We do not wish to pronounce
    on the veracity of any of these options. But it is safe to say that theories poised
    to respect the insights embodied by (or learn from the misssteps in) innovative
    approaches are more likely to be accurate, reason-based, robust, illuminating,
    orderly, or coherent.


    All forms of progress have broadened and deepened the sort of framework that is
    normally taken for granted in the course of philosophical theorizing. This framework
    is the backbone of an understanding-providing theory, albeit a partial one, of
    a given domain.


