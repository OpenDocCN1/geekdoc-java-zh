    # 引言 9


    注释（exegesis）是历史导向型哲学项目的核心。然而，正如我们所信的的，只要哲学史本身就是哲学，那么这些项目的某些方面确实属于我们的研究范畴。


    尽管我们经常会讨论哲学是如何或过去是如何进行的，但我们的项目首要任务并非为了刻画哲学思考的实践体验，或考察哲学探究中最新的创新。这种探究被视为一种理论性探究，其追求应该是超越在特定历史时刻或特定社会背景下偶然占据显著地位的趋势和信念。良好的方法论应当反映这一点，并指示如何实现这一愿景。此外，在涉及哲学理论化时，并不是无所皆非（anything
    goes）的良好的理论化应当受到稳健方法的引导。这些都是我们为后续章节中将开发的方法论所设定的雄心之一。


    在某种意义上，我们在书中辩护的方法论是新颖的。同时，它并没有预示着对哲学的激进重构。我们的首要目标是推进一种哲学探究模型，开发一套哲学数据理论，并整合一套哲学理论化方法，这种方法在被遵循时能够促进理解。我们将认可的标准在许多哲学家从事其工作时是熟悉的，尽管这些标准尚未被充分地证明、排序和整合，以至于揭示它们如何促进探究的主要目标。该项目不是为了引发一场革命，而是深化我们对哲学探究以及如何做好探究的理解。


    # 1

    ## 探究的本质


    亚里士多德曾著名的写道，哲学始于惊。当然，哲学探究的动力远不止于此。好奇、困惑、恼恼、痛苦，甚至是深层的愤怒都可能促使我们这样做。尽管这些状态高度多样，但它们有这样一个共同点：它们诱导我们提出想要通过探究来解决的问题。


    在哲学中，核心问题涉及诸如下主题：现实的本质、我们认知能力的性质和范围，以及实践规范的内容和地位。这些问题包括但不限于以下内容：


    - 为什么是有胜于无？

    - 上帝存在吗？

    - 我们有自由意志吗？

    - 脑体是什么关系？

    - 是否存在所谓的人性？


    探究的本质 11


    如果对外部世界的知识是可能的，那么它是如何实现的？

    - 如果思维和语言确实指向世界，它们是如何指向的？

    - 意义的本质是什么？

    - 是否存在客观的规范标准？

    - 是否存在一个单一且基本的道德原则，如果是，它是什么？

    - 什么是良好的生活？


    自然地，哲学家们也还在与大量更具体的问题作斗争，例如：


    - 存在是一种属性吗？

    - 全能需要哪些能力？

    - 自由意味着拥有做出选择的能力吗？

    - 什么是信念？

    - 性别是一个生物学范畴吗？

    - 有理由的信念与知识之间的区别是什么？

    - 是否可以引用抽象对象？

    - 意义具有规范性吗？

    - 一个标准的客观性意味着什么？

    - 道德原则与仅仅的权宜原则有何区别？

    - 良好的生活需要具备美德吗？


