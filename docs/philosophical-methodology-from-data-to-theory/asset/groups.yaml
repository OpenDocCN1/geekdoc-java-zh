    # The Structure of Inquiry 19


    This brings us back to the model we''re proposing. There are several reasons to
    prefer a model that incorporates the two stages of inquiry (data collection and
    theorizing) that we distinguished.


    First, doing so furnishes a substantive precification of the idea that inquiry
    consists in a process of reflection aimed at the provision of a theory. Our model
    cracks open this black box, identifying not only the starting point and the endpoint,
    but also two stages in the process that takes inquirers from the former to the
    latter.


    Second, it does while avoiding parochialism. Our model identifies two stages that
    do not themselves enforce a commitment to anything like the Cartesian project
    or Dewey experimentalism. Nor do the stages render either verboten. Rather, our
    model represents steps by which inquirers of any persuasion, and into any topic,
    transition from the opening of a question to the grasp of a theory that resolves
    it.


    Third, a model that highlights data and theorizing is well positioned to account
    for the depth and breadth of inquiry. Both features were on display in our discussion
    of dialectic, which noted that inquiry may incorporate, but is not exhausted by,
    the provision of arguments. This is just what we should expect if inquiry consists
    in constructing a theory (theorizing) that handles a potentially wide range of
    considerations (data).


    Fourth, our model makes sense of a success condition noted in the Introduction:
    a theory is successful only when it handles the data, its inputs. It also explains
    the Holmesian


    > 9 In a pair of rich but neglected essays on philosophical methodology, Collingwood
    (1933, Ch. VIII) and Castañeda (1980, *passim*) also insist on the importance
    of data collection and theorizing. However, neither presents them as the two basic
    stages of inquiry, and their conception of each is markedly different from ours.'
