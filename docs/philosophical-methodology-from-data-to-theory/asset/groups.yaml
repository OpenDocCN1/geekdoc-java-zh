    ## 回答关于方法137的问题


    我们认为，这些表述清晰地刻画了哲学家在构建其理论，或在其所选领域针对竞争理论提出反对时，正当试图预先消除的各种反对意见。


    其次，“三级方法”（Tri-Level Method）的五个标准具有决定性意义：它们在多个符合数据的理论中进行筛选，排除了绝大多数竞争者。因此，该方法通过数据解决了理论的确定性问题。因为它识别了一组指令，一旦成功遵循，就能让探究者锁定某一理论——该理论不仅暗示或概率化了数据，而且为任何完全掌握它的人提供了理解支持。


    第三，“三级方法处理了“德性数据”（virtues datum），展现了第4章（§2）中所确立的可靠方法的特征。该方法是全面的：其针对理论的“调适标准”和“解释标准”不仅关注单一类型的考量，还涵盖了目标领域内广泛的数据。它还需要支持：它授予理论“假定”或“默认”的地位，因为根据“实证标准”（Substantiation
    Criterion）的辩护部分，只有当理论获得充分的理由支持时，才能获得其正向地位。此外，该方法是总括性的：根据该标准的解释部分，它要求对数据以及理论自身的主张和承诺进行解释。因此，它确保了无论它青睐哪种理论，都能最有效地揭示主题中的系统性关系。此外，该方法是直观的多维的：它并没有特权某个特定的理论诉求，而是识别了至少四个（调适、解释、实证和整合）以及根据相关情况可能的第五个维度（德性/virtosity），这是探究者在理论构建和评估中必须关注的。此外，该方法是分层级的：它为这些诉求分配了不同的角色，从而承认某些诉求比其他具有更高的意义（特别是大多数情况下，“德性标准”重要性远低于第一级和第二级的标准）。最后，“三级方法”是比较性的：它能够对单个理论以及竞争理论的相对优劣进行评估。每个候选理论都可以根据其满足该方法的程度来接受评估，竞争理论之间也可以根据它们的表现优劣进行相互衡量。


    因此，我们的主张是，“三级方法”处理了关于方法的三个数据维度。在阐述其标准时，我们指出了这些标准如何在构成上与提供理解的理论的六个特征相关联。因此，我们认为该方法是可靠的，对方法问题给出了满意的回答。我们之前观察到，如果一个方法是可靠的，那么（在其他条件相同）探究者有充分的理由认可其产出。这就是为什么——尽管它设定了高标准——我们仍鼓励在追求哲学问题的答案以及广义的哲学进步时采用“三级方法”。


    > 21 请注意，第4章（§3）中讨论的所有现有方法都缺乏至少一种这些德性。我们还论证，这些方法未能让探究者获得具备理论理解之六大特征的输出，而且其中许多输出并非明显具有决定性，也未针对第4章（§1）中讨论的所有常见哲学活动进行精细调整。这些都是支持我们依赖“三级方法”而非这些熟悉的替代方案来寻求哲学进步（我们下一章的主题）的进一步理由。独立的支持可以从
    Chalmers (2014, §§4–5) 和 Beebee (2018, §II) 的建议中找到，他们认为替代方案（特别是“论证方法”和“成本效益方法”）实际上阻碍而非促进了进步。


    ## 哲学进步


    长期存在且具有影响力的指责是，哲学的进步比不上数学和自然科学的进步。伯特兰·罗塞尔（Bertrand Russell）在《哲学问题》（*The Problems
    of Philosophy*）中著名的担忧：


    如果你问一位数学家、矿物学家、历史学家或任何其他学者，他的科学确定了哪些确定的真理，他的回答只要你愿意听就可以持续多久。但如果你把同样的问题问一个哲学家，如果他是坦诚的，他不得不承认他的研究还没有取得像其他科学那样的积极性成果。¹


    在这里，罗塞尔将科学与哲学的“积极成果”刻画为“一组确定的真理”，而非理解的成就——这才是探究最终的正当目标。


    ¹ Russell (1912/1997, 154–5)。请注意，这段话没有区分“由其科学确定的”作为数据的真理与作为理论组成部分的真理。为了确保公平，我们在随后的内容将关注理论。


    哲学方法论：从数据到理论：John Bengenson, Terence Cuneo, and Russ Shafer-Landau, Oxford University
    Press. © John Bengenson, Terence Cuneo, and Russ Shafer-Landau 2022. DOI: 10.1093/oso/9780192826424.003.007


    但这种刻画只是他核心负面论点的附带，即：哲学在进步方面与其他知识领域相比处于劣势地位。这一论点继续被广泛接受。


    罗塞尔的怀疑是对哲学进步更多担忧的缩影，这种担忧关注不在于哲学相对于“其他科学”的所谓劣越性，而在于哲学是否能够取得任何进步。康德在这方面的焦虑是众所知的。在谈到他所谓的“形而上学”时，康德写道它是一个战场，而且是一个似乎专门注定要在模拟战斗中测试人的力量的战场；没有一个战斗者获得过哪怕一点阵地。因此，毫无疑问，形而上学的程序现在……康德的继承者将这种悲观主义扩展到了形而上学边界之外的哲学本身。


    为什么进步难以捉摸？康德暗示是因为未能开发和实施一种方法。他并不孤单；许多人都将方法视为罪魁祸首。这里的观点并非仅仅是哲学家未能阐述或正确遵循他们的方法承诺：这本身并不是进步的障碍。也不是担心哲学辩论充斥着分歧——在我们看来，共识并不总是学科健康的信号。³相反，深层的问题在于缺乏一种通过正确执行就能促进理解的方法。这种进步（我们称之为“认知进步”，noetic
    progress）似乎遥不可及。


    ³ 参见 Solomon (2001), Beatty and Moore (2010), 以及 Dang (2019)。如果分歧以调和主义观点描述的方式产生辩词，广泛的可能构成额外威胁（参见
    Elga 2007 和 Feldman 2007；关于哲学进步的应用，参见 Kornblit 2013, Goldberg 2013, 2019）。


    关注认知进步是合适的，不仅是因为理论理解是探究最终的正当目标。这种关注还具有一个优点，即认识到哲学调查不必以解决问题的方式来评估。事实上，即使给定领域的一个或多个领先问题是不可解决的，这本身也不会阻止对该领域的理解。认知进步比这更复杂，也更微妙。


    这些言论旨在凸显哲学进步问题的各个层次，一个充分的解决方案必须回答四个问题：


    - 存在性问题：哲学在其核心问题上是否确实取得了认知进步？

    - 比较问题：哲学在其核心问题上取得的认知进步，与其他理论领域取得的进步相比具有可比性吗？


