    # 24 The Nature of Inquiry


    exposing reparable inefficiencies within an organization. Such journalism is done
    well when it succeeds at these aims. By contrast, humiliating personal enemies
    or publicizing boring arcana are improper journalistic goals, for their achievement
    does not imply a job well done. When the activity is theoretical inquiry, undertaken
    for its own sake, success or excellence does not consist in scoring points, winning
    accolades, or cultivating good habits. Rather, it resides in making an intellectual
    improvement, in the form of an epistemic or alethic achievement. In our view,
    this is the telos of inquiry; it is what inquiry is for.


    We call a proper goal ‘ultimate’ just in case its realization is sufficient to
    resolve inquiry in a fully successful way, reaching the point at which, to put
    it simply, there is no more work to be done. The notion of the fully successful
    resolution of inquiry is not purely descriptive, but has a normative component
    as well, which admits various explications. According to one plausible explanation,
    such resolution renders it appropriate for the inquirers'' curiosity, wonder,
    or puzzlement to be relieved thereby.15 Though we wish to remain neutral between
    this and other candidate explications, we affirm that any plausible explication
    will demand not partially and piecemeal insights, but rather comprehensive and
    systematic illumination.


    Not all proper goals are ultimate. For example, to be conscientious at each stage
    of one’s investigation may be a proper goal of inquiry, since it represents a
    type of success or excellence at this activity. But conscientious inquiry may
    produce an erroneous picture of its target, and so does not qualify as an ultimate
    proper


