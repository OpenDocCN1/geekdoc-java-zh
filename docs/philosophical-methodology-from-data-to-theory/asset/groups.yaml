    good.¹13 If theory T is more parsimonious than theory T*, but T''s parsimoniousness
    makes it less likely to promote understanding than T*, then T''s parsimoniousness
    does not win it any credit, less any that could compensate for shortcomings elsewhere.
    More generally, a view cannot be entirely discounted by its doing less well than
    rivals with regard to just one criterion. Nor is the mere fact that a theory fares
    better according to one dimension of evaluation sufficient to make it best (i.e.,
    most likely to further understanding of its subject matter). A theory’s status
    as such is rightly determined only after the application of multiple criteria.


    ## 2.2 The rudiments of a sound method


    Our analysis has uncovered a set of laudable methodological tendencies. Each corresponds
    to a methodological virtue, insofar as it is a feature that enables a position
    inquirers to achieve inquiry’s ultimate proper goal. If our discussion hits the
    mark, a sound philosophical method must be:


    - Comprehensive: it calls for theories to address not just a single consideration,
    or type of consideration, but a wide range of data.

    - Support-requiring: it delivers a theory that is epistemically well-supported
    by positive considerations that speak on its behalf.

    - Synoptic: it ensures that whichever theory it favors is best positioned to expose
    systematic relationships, including explanatory ones, in the subject matter in
    question.

    - Multidimensional: it incorporates multiple criteria.

    - Hierarchical: it recognizes that criteria play diverse roles, and that some
    roles possess more significance than others.

    - Comparative: it enables assessment of both individual and relative merits of
    rival theories.


    > 13 Philosophers such as Quick (1948), Lewis (1986, 4), Churchland (1984, 18),
    Gibbard (2003, xii), Melnyk (2003, 244ff.), and Olson (2014, 147–8) have shown
    sympathy for the view that parsimony is invariably overriding. Distinguish the
    assumption that one criterion reigns supreme from the reasonable position that
    there are certain necessary conditions on the plausibility of theories (e.g.,
    handling the data in the domain). One can endorse the latter position without
    the same time assigning a single criterion overriding importance with respect
    to all others.


    A sound method exemplifies these many virtues as a neutral, inquiry-constraining
    starting point when thinking about method. It merits attention from proponents
    of disparate candidates for a sound method, is well-suited to anchor their theorizing
    about this matter, and is not itself an output of such theorizing. So, despite
    its complexity and novelty, it qualifies as a datum about method; we''ll call
    it the ‘virtues datum’.


    Recall that a method is a set of criteria that provide instructions for theory
    construction and measures for theory evaluation. Moreover, a method is just in
    case satisfying its criteria positions inquirers to achieve inquiry''s ultimate
    goal—where a method does just in case satisfaction of its criteria by a theory
    implies that this theory possesses at least some of that goal''s central features
    and possibly (in nearby worlds) all of them. Given our argument in Chapter 1 (§3)
    that inquiry''s ultimate goal is theoretical understanding, these features will
    include the six characteristics of such understanding discussed there: being accurate,
    robust, reason-based, illuminating, orderly, and coherent.


    To this point, we''ve identified three data that a sound method must handle, noting
    that simple methods are ill-equipped to do so.


    ## Extant Methods 91


    Here we identify austere formulations of four prominent methods that many philosophers
    have followed when theorizing. We call these formulations ''austere'' because
    they abstract away from various details and assumptions in order to make explicit
    each method''s core commitments.¹14 Although the methods we''ll discuss are non-exclusive,
    each is meant to be complete, in that nothing more than following its instructions
    is supposed to be required in order to resolve theoretical inquiry. We ourselves
    think that these methods contain important insights. However, a brief examination
    of their constituent criteria through the lens of the three data we collected
    will allow us to pinpoint challenges each method faces, thereby motivating the
    quest for a more adequate one, which we seek to provide in the next chapter.


    Consider, first, a method that focuses on clarification and instructs theorists
    to define or analyze a range of central terms, concepts, or properties. We call
    it the


    **Method of Analysis:** When constructing a theory about a given domain, theorists
    ought to identify a set of theses about the domain that provide analyses of its
    central terms, concepts, or properties, where such analyses meet some sufficiently
    high standard. The best theory is the one whose proposed analyses meet this standard
    to the highest degree relative to rivals.¹15


    The Method of Analysis takes a variety of forms. Some proponents privilege ordinary
    usage, others formal machinery from contemporary linguistic theory, still others
    the broadly functional style of analysis known as Ramification. Yet another option
    is to


    ¹14 The individualism that often structures treatments of method (and which we
    ourselves reject) is one such assumption.


    ¹15 Proponents or practitioners of this method include Moore (1903), Russell (1914),
    Stebbing (1932–3), Anscombe (1957), Goldman (1970), Chisholm (1977), Feldman (1992),
    Strawson (1992), Jackson (1998), Haslanger (2012, Ch. 6), and Hardimon (2017).


    privilege the “point” of a term or concept, the role that [it] plays, or pursue
    analyses that potentially refine the meaning so as to better realize this purpose.
    A second method, focusing on assembling a rationale, is what we''ll call


    **Method of Argument:** When constructing a theory about a given domain, theorists
    ought to identify a set of theses about the domain that the conclusions meet some
    sufficiently high standard. The best theory is the one whose arguments are supported
    in this way to the highest degree.¹⁶


    > ¹⁶ The quotation is from Craig (1990, 2), Carnap (1950/1962) emphasizes the
    role through an approach. Heidegger (1927) labels “existential analysis.” The
    relevant Benefit for the inferences will be a broadly logical one: being valid,
    say, or being cogent, or such as to provide reason to believe the best. The standard
    for the premises could be being certain or self-evident, being shared by members
    of an ideal audience, being defensible against relevant challenges, and so on.


    A third method focuses on weighing the theory’s merits and demerits through what
    David Armstrong described as “an intellectual cost-benefit analysis.” We call
    it the


    **Cost-Benefit Method:** When constructing a theory about a given domain, theorists
    ought to identify a set of theses about the domain that possess a high ratio of
    positive features (benefits) to negative ones (costs), where these features are
    in themselves roughly equal and aggregative. The best theory is the one that achieves
    the highest such ratio relative to rivals.¹⁹


    Proponents of this method may select among a range of candidate benefits: rational
    support, predictive power, explanatory scope, simplicity, conservativeness, and
    so on. The absence of such features, or possession of contrary ones, would then
    qualify as costs. The explanation of why a given feature is a benefit could invoke
    anything from truth-conduciveness, to utility, to aesthetic excellence.


    A fourth method, focusing on systematization, is what John Rawls called “wide
    reflective equilibrium.”²⁰ It has been a mainstay


    ¹⁸ Armstrong (1989, 19).

    ⁹ Proponents or practitioners of this method include Quine and Ullian (1970, Ch.
    6), Lewis (1983 and 1986), Armstrong (1989, §1,4), Gibbard (2003), Weatherson
    (2003), Godfrey-Smith (2006), Daly (2010, 216–18), Enoch (2011), Paul (2012),
    Rawls (2013), Sider (2013 and 2020), Nolan (2015, §5), Beebee (2018, §II and IV),
    Massimi (2018), and Goldwater (2021).

    ¹⁷ We borrow the ‘method of argument’ from Thomson (1990) and Chalmers (2014).
    Other proponents or practitioners of this method include Harman (1977), Parfit
    (1984), Kamm (1993), Baker (2000), Bogossian (2006), van Inwagen (2006), Siegel
    (2010), Korman (2015), Barnes (2016), Manne (2017), and Khader (2018).

    ²⁰ Raw-ls (1971, 19–20); cp. Rawls (1974 and 1980). See also Goodman (1955, 63–4).

