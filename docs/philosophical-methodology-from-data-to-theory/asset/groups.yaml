    **Explanation Criterion**: A theory of a given domain must explain the data in
    that domain, or at least give an adequate defense of the claim that those data
    require no such explanation, where a theory T ''explains'' $\varphi$ in just case
    that T invokes $\psi$ such that $\varphi$ holds or is true because $\psi$ holds
    or is true. As above, we make three remarks about this criterion.


    First, we leave open the precise analysis of the notion of one entity''s holding
    or being *true* because another entity holds or is true. Presumably, a satisfactory
    analysis will counteract diverse forms of explanation (e.g., causal, unificationist,
    modal, constitutive, grounding, essentialist), each of which implies domain-specific
    conditions of adequacy.^3 As for the epistemology of explanation, it can be perfectly
    appropriate for an explanans to have a weaker epistemic standing than the datum
    it explains—after all, data are often backed by excellent reasons, and it would
    be a tall order to always marshal an explanans with similar credentials.


    Second, the defense cited in the Explanation Criterion''s escape clause can take
    one of three forms: it might involve (i) providing good reason to believe that
    the theory coheres well with an independent set of claims that themselves explain
    the data (in which case the view need not do this itself, as above); (ii) identifying
    a data disabler; or (iii) supplying good reason to believe that the datum does
    not admit of explanation, but is instead explanatively basic.


    Third, as in the case of the previous criterion, a theory might satisfy the Explanation
    Criterion to a greater or lesser degree, both quantitatively and qualitatively.
    Quantitatively, in some cases, a view will explain most but not all of the data—the
    remains


