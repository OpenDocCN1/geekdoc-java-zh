    second reason for evaluation, one that emerges from a direct appraisal of the
    capacity of those methods to deliver inquiry’s ultimate proper goal. We''ve defined
    a sound method as one such that successfully following its instructions positions
    inquirers to achieve this goal, which we take to be theoretical understanding.
    Such understanding requires full grasp of a theory that is accurate, reason-based,
    robust, illuminating, orderly, and coherent. We have no compelling reason to think
    that any of the methods considered above is on track to yield theories possessed
    of all six features, and some reason to think that each is bound to fall short.


    The Method of Analysis, even when generously interpreted so that its implementation
    yields a set of analyses that are accurate, reason-based, coherent, and offer
    some explanatory illumination of the analysanda, may nevertheless fail to yield
    theories that do all the explaining that needs doing. Or not the method poised
    to deliver theories that are robust, answering a domain''s central questions (which
    are many and diverse), or orderly, transcending a set of feature-specific explanations
    to afford a broader view of how the various elements of the domain hang together.
    The Method of Argument is in a similar boat. For it simply ratifies conclusions
    of arguments, which (as we noted in the Introduction) fall far short of theories,
    let alone ones that are robust, orderly, and illuminating. Inquirers can analyze
    and argue till the cows home, but analyses and conclusions must be integrated
    and explained in order to deliver a theory that yields understanding of a domain.
    Such integrative and explanatory work is beyond the purview of the Methods of
    Analysis and Argument.


    Our concerns about the other two methods take a different shape. With the Cost-Benefit
    Method, there is a sense in which everything is up for grabs. It does select theories
    that at once possess all six features of understanding. For example, if a theory
    manages to be highly illuminating, robust, orderly, and coherent at the expense
    of accuracy, then the method licenses treating the last as expendable. In another
    context, a different array of costs and benefits could make different features
    expendable. By contrast, successfully implementing the Method of Reflective Equilibrium
    guarantees that a theory will at least be robust, orderly, and coherent. But the
    method infamiously fails to put inquirers on track to achieve even a modicum of
    accuracy; nor is it clear that it plumps for outputs that are reason-based in
    the indicated sense. Indeed, if the modifications, additions, or abandonments
    that help in inquirers achieve equilibrium are wide of the mark, lack support,
    or undermine robustness, then the equilibrium attained will fail to promote theoretical
    understanding.


    To be clear, rendering these verdicts we''re not claiming that all four methods
    are useless. As we''ve noted, these methods help inquirers achieve a proper goal
    of inquiry, such as justified belief or knowledge.²9 However, the question at
    hand is whether there is a method that is sound, to deliver a theory that realizes
    inquiry''s ultimate proper goal, namely, theoretical understanding. Considered
    in this light, none of the methods we''ve canvassed meets the bar.


    ## 4.3 Remedies


    Advocates of these methods are free to attempt to remedy the deficiencies we''ve
    identified so that their preferred method fully handles all three of the data.
    But it''s unclear whether these methods are amenable to repair. For such revisions
    would hardly be incidental; rather, they''d amount to substantial alterations
    to the method''s basic instructions.


    For example, consider the Method of Reflective Equilibrium. In order to ensure
    this method is sufficiently hierarchical, its instructions would need to be revised
    so as to prohibit the possibility of attaining equilibrium through bad deals (as
    described above). That, however, appears to introduce criteria that privilege
    something other than equilibrium—a revision of the spirit, and not simply the
    letter, of the method. Or to ensure that the CostBenefit Method does not license
    illicit trade-offs, proponents would need to modify its constituent criteria in
    such a way as deny the various benefits (and corresponding costs) are roughly
    equal and aggregative. Our point is that this revision is impossible, but that
    it risks turning the method into something it is not.


    To further appreciate the challenge, consider a few possible responses that defenders
    of these methods might offer. Speaking on behalf of the Cost-Benefit Method, Chris
    Daly writes would-be critics of the method may not so reject the method as reject
    the weighting given various costs and benefits...The locus of the debate...will
    not be over the appropriateness of the cost-benefit method. It will be over which
    factors are costs, which are benefits, and what weightings to give them.


    ²⁷ There have been many critics of a method focused on reflective equilibrium...
    [rest of footnote omitted] ... See, e.g. Hare (1973), Brandt (1979, 19–21 and
    1990), Raz (1982), Copp (1985), Stich (1988), Cummins (1998), Bonevac (2004),
    Kelly and McGrath (2010), McPherson (2015 and 2020), §5.3, and McGrath (2019,
    Ch. 2).

    ²⁸ Sellars (1956, §38).

    ²9 Notably, Rawls (1980, 534) described reflective equilibrium as merely uncovering
    the doctrine that is “most reasonable for us” to accept; similarly, Goodman (1955,
    61–2) and Brink (1989, 140–1) emphasize that reflective equilibrium provides justification,
    allowing that it does not facilitate other, stronger epistemic achievements.

    30 Daly (2010, 217–18).

