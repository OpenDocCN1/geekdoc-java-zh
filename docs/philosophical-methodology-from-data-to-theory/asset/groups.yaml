    # Philosophical Progress


    achievement of understanding, inquiry’s ultimate proper goal. But this characterization
    is incidental to his central negative thesis, namely, that philosophy compares
    unfavorably with other intellectual fields in respect to progress. This thesis
    continues to be widely accepted.


    Russell’s doubts are emblematic of a more worry about philosophical progress,
    which focuses not on the alleged inferiority of philosophy vis-à-vis “the other
    sciences,” but instead on the ability of philosophy to register any progress at
    all. Kant’s anxieties on this score are well-known. Speaking of what he calls
    “metaphysics,” Kant writes that it is


    a battlefield, and indeed one that appears to be specially destined for testing
    one’s powers in mock combat; on this battlefield no combatant has ever gained
    the least bit of ground, nor has any been able to base any lasting session on
    his history. Hence there is no doubt that up to now the procedure of metaphysics
    has been a mere groping....


    Kant’s successors have extended his pessimism well beyond the boundaries of metaphysics
    to philosophy as such.


    Why has progress proven elusive? Kant intimates that it is due to the failure
    to develop and implement an adequate methodology. He is not alone; many have pointed
    to method as the culprit. The idea here is not simply that philosophers have failed
    to articulate, or properly adhere to, their methodological commitments: this by
    itself is not the impediment to progress that troubled Kant and others. Nor is
    the worry that philosophical debates are rife with disagreement—in our view, consensus
    is not always a sign'
  - '[PAGE 148]


    of a discipline’s health, whereas meticulous debate often is.³ Rather, the deep
    problem concerns the absence of any method whose proper execution is likely to
    further understanding regarding philosophy’s central questions. Such progress,
    which we’call ‘noetic,’ would thus seem beyond reach.


    Focusing on noetic progress is appropriate not only because theoretical understanding
    is inquiry’s ultimate proper goal. Such a focus also has the virtue of recognizing
    that philosophical investigation needn''t be assessed in terms of its success
    at problem-solving. In fact, even if one or more of the leading questions about
    a given domain is unsolvable, this would not by itself prohibit understanding
    regarding that domain. Noetic progress is more complicated, and more nuanced,
    than that.


    These remarks are intended to highlight the various layers of the problem of philosophical
    progress, an adequate solution to which must address four questions:


    Existential Question: Has philosophy actually made noetic progress with respect
    to its central questions?


    Comparative Question: Is there noetic progress in philosophy with respect to its
    central questions that is comparable to progress made by other fields of theoretical
    inquiry?


    ³ Cp. Solomon (2001), Beatty and Moore (2010), and Dang (2019). It may be that
    extensive disagreement poses an additional threat if it generates a defeater in
    the way described by conciliationist views (see, e.g., Elga 2007 and Feldman 2007;
    for applications to philosophical progress, see, e.g., Kornblit 2013, Goldberg
    2013, Frances Lycan 2019, and Beebee 2018, §III). We are not convinced that philosophical
    controversy generates such a defeater. Together with the point we make in the
    text, this leads us to not focus on disagreement but on the alleged paucity of
    philosophical progress itself. We return to the topic of disagreement in §2.2.'
