    ## 2. Philosophical Data


    Every theoretical inquiry has its data, considerations that must somehow be handled
    by a theory that resolves the questions that open inquiry. Across philosophy,
    examples abound: in philosophy of language, it is a datum that a user of a proper
    name sometimes knows to nothing about the person being named; in philosophy of
    perception, that we sometimes suffer vivid illusions and hallucinations; in philosophy
    of action, that some attempts are unsuccessful; in metaethics, that moral judgments
    are intimately connected to action; in aesthetics, that certain works of art are
    masterpieces; in feminist philosophy, that a range of social practices and institutions
    promote the interests of men over women; and so on. Our aim in this chapter is
    to achieve greater clarity about the character and role of such data.


    We argue for three main claims. First, philosophical data possess four basic features,
    which set them apart from other types of considerations. Second, familiar worries
    about the “theory-ladenness” of data are not devastating impediments to philosophical
    theorizing, but can be plausibly addressed. Third, philosophical data should be
    conceived of not as what inquirers agree upon, constitutive features of reality,
    claims about how things appear, or descriptions of how language is commonly used.
    Rather, as we argue in the next chapter, they are what inquirers have good epistemic
    reason to take be genuine features of reality itself.


    ### 1. Four Features of Data


    Data possess four basic features, which will play important roles in the ensuing
    discussion.


    First, data are starting points for theoretical reflection on a domain in the
    sense that they are inputs, not outputs, of such theorizing. In this respect,
    the data in a given domain bear an asymmetrical relation to theorizing about that
    domain.


    Second, data are inquiry-constraining with respect to a domain in the sense that
    they comprise a data set that functions to anchor a given theoretical inquiry
    to its subject matter, the domain that such inquiry is about. By saying that they
    ‘anchor’ inquiry to its subject matter, we intend to convey two points. First,
    the data set operates as the principal means by which theorists access that subject
    matter. Second, investigations of a domain that entirely ignore the data set are
    likely, or at least likelier, to be off-track with respect to that domain, and
    consequently to fail to resolve inquiry. Although ignoring one datum might not
    send inquirers on a wild goose chase, those who wholly ignore the data pool are
    much likelier to lose the trail.


    Third, data are collected. While not itself a controversial claim, there is controversy
    regarding the collection of data, especially over appropriate procedures to pursue
    such a task. Among the candidate procedures for data collection are those that
    utilize such sources as perception, intuition, introspection, common sense, linguistic
    judgment, imagination, and inference. There is room to be more or less restrictive
    on this matter; some philosophers recognize only one of these as of an appropriate
    procedure for data collection, while others embrace a pluralism that allows for
    a variety of such procedures. (We devote part of the next chapter to exploring
    these matters, and to defending a version of pluralism.)


    Fourth, data are neutral. There are two respects in which this is so. The first
    is that data is non-active, insofar as a particular datum might be mistaken. Even
    if a pool of data is on the whole correct, there are sometimes errors in the data.
    A data set may be noisy or include outliers that are incompatible with other elements
    of that set. Data are inputs to theorizing, and such inputs may not survive scrutiny
    when all is said and done¹.


    The second respect in which data is neutral is that they function as common currency
