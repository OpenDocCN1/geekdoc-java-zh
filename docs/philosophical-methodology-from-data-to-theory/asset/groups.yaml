    # 3. Data Imposters, Data Disablers


    We’ve emphasized that data play a central role in the construction and evaluation
    of theories. Because they are neutral starting points that constrain inquiry,
    no theory can simply dismiss or ignore them. But as we’ve emphasized, data are
    not inviolable, and we are fallible collectors of data. So any sound method of
    philosophical theorizing must allow for two possibilities.


    The first is of exposing a putative datum as a mere pret, a datum in name only.
    Doing this is a matter of discovering that there is not, despite appearances,
    a good reason to believe a given claim, at least among inquirers considered collectively.
    Such claims are not data but imposters. They can be unmasked in myriad ways.


    Inquirers might be reminded of a flaw in the procedure they used when collecting
    data, which inadvertently issued a counterfeit. Or it may be that they have for
    some time possessed evidence sufficient to rebut a claim they wrongly treated
    as a datum. Perhaps, for example, they had taken it for granted that a given claim
    is metaphysically possible, but now notice that this would contradict a proposition
