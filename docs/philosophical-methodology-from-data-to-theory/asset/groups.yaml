    ## 20 探究的本质


    在缺乏任何数据的情况下反对理论化的禁令。此外，该模型还阐明了特定现实世界探究的各个方面，例如它们可能是不完全的（当它们忽略了数据收集、排除了理论化，或对两者仅做出部分贡献时），或是有缺陷的（当它们对其中某件事表现得很糟糕时）。根据这些观点，我们并不打算设立门槛：不完全或有缺陷的探究仍然属于探究。


    第五，通过区分数据收集和理论化所扮演的角色，我们的模型使得在特定案例中考察探究的基本元素及其关系成为可能。即使许多许多探究实例也只是不完美地实现了这两个阶段，关注它们有助于深化关于在实践中如何从探究的开始到其结束的问题。换句话说，用这两个阶段来对探究进行建模，不仅在理论上有趣，在实践上也同样重要。因为它使我们能够审视完成每项任务需要什么，以及如何良好完成——这是改进我们探究努力的重要第一步。


