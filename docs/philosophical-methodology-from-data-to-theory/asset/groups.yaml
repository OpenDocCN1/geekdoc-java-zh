    ## 20 The Nature of Inquiry


    injunction against theorizing in the absence of any data. Additionally, the model
    sheds light on various aspects of particular real-world inquiries, such as the
    ways in which they can be incomplete (as when they omit data collection, exclude
    theorizing, or make only partial contributions to either) or deficient (as when
    they do at least one of these things poorly). In keeping with these remarks, we’re
    not intent on gate-keeping: incomplete or deficient inquiry still counts as inquiry.


    Fifth, by distinguishing the roles played by data collection and theorizing, our
    model makes it possible to examine the basic elements of inquiry and their relations
    in particular cases. Even many actual instances of inquiry only imperfectly realize
    the two stages, attending to them helps to sharpen questions about how, in practice,
    to get from the opening of inquiry to its closing. In other words, modeling inquiry
    in terms of these two stages is not just theoretically interesting but also practically
    important. For it enables us to scrutinize what it takes to do each, and to do
    each well—an important first step toward improving our efforts at inquiry.


    To appreciate how distinguishing the two stages does this, notice that it helps
    us to pinpoint various methodological commitments, which can be subject to proper
    assessment. In philosophy, the longstanding debate between metaethical realists
    and their expressivist rivals can serve as an illustration.


    Realist views affirm the existence of a moral reality that is objective, in the
    sense that it is not of our own devising in the way that (say) the norms of etiquette
    are. And they hold that thought and discourse sometimes genuinely represent this
    reality. Expressivists typically deny at least one of these claims. Divergent
    methodological commitments lie at the heart of this disagreement.


    ## The Structure of Inquiry 21


    Each view makes assumptions about data. Realists typically assume that the metaethical
    data consist of commonsensorial or intuitive claims, some of which appear to imply
    that there is an objective moral reality that thought and discourse represent.
    Expressivists ordinarily assume that the data primarily concern moral language
    and moral judgment, emphasizing connections among moral discourse, moral thought,
    and action.


    Likewise, each view makes assumptions about theorizing. Realists typically hold
    that a satisfactory theory ought to endorse the implications of common sense or
    intuition, abandoning them only when challenges to them cannot be adequately met.
    Expressivists, for their part, typically assume that a satisfactory theory must
    be parsimonious, not positing any features that are explanatorily dispensable.
    They add that a satisfactory theory must be sufficiently continuous with the natural
    sciences tell us about the world.


    These assumptions are not idle; rather, they have fueled much of the debate between
    realists and expressivists. Adherents of each view draw very different conclusions
    because of their divergent assumptions about data and theorizing. Realists typically
    conclude that since their theory endorses the implications of common sense or
    intuition, and has adequately met the relevant challenges, theirs is the view
    to beat.¹¹⁰ Expressivists ordinarily conclude that their view alone handles the
    data about language and judgment in a way that is sufficiently parsimonious and
    naturalistic, and therefore earns top marks.¹¹¹


    ¹⁰ See, e.g., Nagel (1986, 143–4), McNaughton (1988, 40–1), Brink (1989, Chs.
    1–2), Shafer-Landau (2003, Chs. 1–3), and Enoch (2019, 30–3). While not a realist,
    Harman (2010) promotes a general conservative methodology that squares with the
    approach favored by these authors.


    ¹¹ See, e.g., Blackburn (1993, Part II and 1998, Ch. 3) and Gibbard (2003, Ch.
    1–2). Cp. Ayer (1936, Ch. 6), who adds a commitment to a new-defunct theory of
    meaning.

    ¹² See, e.g., Bealer (1993), Dorr (2007), and Carmichael (2010) on universals,
    and the exchange between Bonjour (2014) and Devitt (2014) on the priori.


    ## 22 The Nature of Inquiry


    Realists and expressivists often fail to make their commitments regarding data
    and theorizing explicit, and rarely pause to defend them even when they do. Nor
    is metaethaphysical debate unique in these respects. To identify just two other
    examples: the debates between realists and nominalists about universals exhibit
    a similar dynamic, as do those between defenders and critics of the priori.¹²
    The former members of each pair frequently begin with an unarticulated commitment
    to intuitive data and conservative theorizing, while the second regularly assume
    that it is safe to prefer a theory that is both parsimonious and naturalistic.


    Here we take a different approach. Though our remarks far have ranged over all
    kinds of theoretical inquiry, our aim will be to explicitly state and defend a
    series of methodological commitments about data and theorizing that, in view,
    anyone engaged in philosophical inquiry should accept. We articulate these commitments
    over the coming chapters, offering detailed accounts of the nature of data, procedures
    for data collection, and the process of theorizing. Along the way we will indicate
    how our commitments relate to those of pragmatists, conceptual analysts, experimental
    philosophers, proponents of reflective equilibrium, fans of modeling, and various
    others. As will become, the commitments we advocate are both substantive and diverge
    in important ways from those that frequently guide philosophical inquiry. At the
    same time, we do not discard current practices, but rather gather and organize
    the bits of methodological wisdom they contain. We''ll argue that when philosophers
    adhere to the commitments we present, the theories they develop are poised to
    realize the goals of inquiry. It is to these goals we now turn.


    ## 2. The Goals of Inquiry 23


    Aristotle''s *Posterior Analytics* is naturally read as proposing that an ultimate
    proper goal of theoretical inquiry is the acquisition of *episteme*—where this
    is not ordinary knowledge, but a special kind of epistemic ideal that many commentators
    designate with the term ''understanding.''¹³ Let us begin by explaining what we
    have in mind an ‘ultimate proper goal’ of inquiry. We allow that the set of possible
    goals is open-ended. It may include psychological states, such as Charles Sanders
    Peirce referred to as "fixation of belief."⁴⁴ accomplishments such as happiness
    or salvation. No doubt it includes epistemic states such as justified belief,
    knowledge, and understanding. We take some goals to be ‘proper’ because, while
    there might be no correct goal of a given activity, some goals are more fitting
    to an activity than others. This is particularly true of goals whose realization
    constitutes a type of success or excellence. As an example, consider investigative
    journalism, which has a variety of proper goals that include uncovering malfeasance,
    identifying social inequalities, or exposing reparable inefficiencies within an
    organization. Such journalism is done well when it succeeds at these aims. By
    contrast, humiliating personal enemies or publicizing arcana are improper journalistic
    goals, for their achievement does not imply a job well done.


    ¹³ See, e.g., Burnyeat (1981, 102–3), who describes Aristotle’s proposal as the
    “vision of Plato’s Republic transferred to the individual sciences."

    ¹⁴ Peirce (1877, §4).


    ## 24 The Nature of Inquiry


    When the activity is theoretical inquiry, undertaken for its own sake, success
    or excellence does not consist in scoring points, winning accolades, or cultivating
    good habits. Rather, it resides in making an intellectual improvement, in the
    form of an epistemic or alethic achievement. In our view, this is the telos of
    inquiry; it is what inquiry is for.


    We call a proper goal ‘ultimate’ just in case its realization is sufficient to
    resolve inquiry in a fully successful way, reaching the point at which, to put
    it simply, there is no more work to be done. The notion of the fully successful
    resolution of inquiry is not purely descriptive, but has a normative component
    as well, which admits various explications. According to one plausible explanation,
    such resolution renders it appropriate for the inquirers'' curiosity, wonder,
    or puzzlement to be relieved thereby. Though we wish to remain neutral between
    this and other candidate explications, we affirm that any plausible explication
    will demand not partially and piecemeal insights, but rather comprehensive and
    systematic illumination.


    Not all proper goals are ultimate. For example, to be conscientious at each stage
    of one’s investigation may be a proper goal of inquiry, since it represents a
    type of success or excellence at this activity. But conscientious inquiry may
    produce an erroneous picture of its target, and so does not qualify as an ultimate
    proper


    ¹⁵ Pritchard (2016, 34). We are wary of non-normative explications, such as those
    that emphasize the first-personal experience of a “Eureka moment” (cp. Trout 2002).

