    by themselves select a single theory, let alone one primed to resolve inquiry.
    To answer the question of method is, among other things, to address such underdetermination
    of the data by. For it is to specify what enables inquirers to home in on a theory
    that is not simply compatible with the data, but inquiry’s ultimate proper goal—theoretical
    understanding.


    Some thinkers believe there is no answer to all the question of method: such skeptics
    deny the existence of a method that will, in suitable conditions, lead philosophers
    follow it from the data to understanding. Others think that there is no principled
    answer to this question: anarchists contend that the best strategy for attaining
    inquiry’s ultimate proper goal is simply for whoever do whatever, however, whenever,
    wherever, whatever. We disagree, and in this chapter and the next will examine
    views with greater methodological ambitions.


