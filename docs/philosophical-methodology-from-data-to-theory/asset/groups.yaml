    ## The Existential and Comparative Questions 161


    Now consider the body of truths contemporary philosophers of perception could
    give if asked to do the same for their field. These include:


    - Seeing is not believing; perceiving an object as having some feature does not
    require believing the object has that feature.

    - Perceiving o''s being F requires more than perceiving o and perceiving.

    - Perceiving o''s being F is not identical to knowledge that o is F, though it
    can serve as the basis for such knowledge.

    - Perception can de re reference and singular thought.

    - Perception is at least sometimes theory-laden.

    - Experts perceive more or better than novices at least partly because the former
    possess a conceptual repertoire than the latter.

    - Something is a perceptual state only if it is capable of providing information
    that guides its subject''s behavior and affects its subject''s non-perceptual
    representational states.

    - Some perceptual states are perceptual experiences, which are individuated by
    their phenomenal character.

    - All perceptual experiences exhibit both phenomenal and access consciousness.

    - Successfully perceiving o requires more than a veridical perceptual experience
    as of o.

    - Two perceptual states can be subjectively indistinguishable yet differ in their
    phenomenal character.

    - Perceptual experiences are corrigible: having a perceptual experience does not
    require believing that one is having that experience.

    - Believing that one is having a certain perceptual experience does not entail
    that one is having that experience.

    - The phenomenal character of perceptual experience is very finely grained.

    - The phenomenal character of perceptual experience is non-transitive.


    And so on—these are just the tip of a sizeable iceberg.


    ## 162 Philosophical Progress


    ### 2.5 The role of the Tri-Level Method


    We''ve seen that the Tri-Level Method plays a central role in answering the how-to
    and evaluative questions. It is natural to ask whether it sheds light on the progress
    just described. We believe that it does. By endorsing all thirteen claims regarding
    the connection between moral reasons and motivation, the contemporary metaethicists
    are better positioned than their predecessors to accommodate and explain data
    about such reasons. They have also substantiated and integrated these claims to
    a greater extent than those asserted by earlier views. In the previous chapter
    we saw that the method''s criteria are constitutively linked to the six features
    of theoretical understanding. So it should come as no surprise that realization
    of these features by the set of claims we''ve listed above correlates with satisfaction
    of the method''s criteria.


    Our examples illustrate how the Tri-Level Method underlies noetic progress with
    respect to the foremost questions in philosophy. They also reveal the method''s
    ability to help how such progress has occurred: namely, through success at accommodation,
    explanation, substantiation, and integration with respect to the subject matters
    of those questions. To be clear, the claim is not that the construction of views
    that satisfy the method''s criteria has always been intentional. Rather, we suspect
    that in many cases philosophers have intended to satisfy criteria invoked by other
    methods. Or they have meant simply to explain in one of the activities that typify
    philosophical practice (arguing, objecting, replying, explaining, etc.). Either
    way, in so doing, they have managed to satisfy the method''s criteria.


    The Tri-Level Method also helps to explain why there has been a relative dearth
    of progress with respect to philosophy''s fundamental questions. For philosophers
    have not constructed well-substantiated views that accommodate and explain most
    or all of the data regarding the subject matters of the fundamental questions
    in a manner that is internally and externally integrated. Still, insofar as they
    have done so with regard to a wide range of the subject matters of the foremost
    questions, they have developed views that vindicate the claim that there has been
    noetic progress in philosophy.


    Let us take stock. The Tri-Level Method''s constitutive link to understanding
    paves the way for answers to the how-to and evaluate questions. Here we have argued
    for three further, interrelated conclusions, in reply to the existential and comparative
    questions.


    The first is the rejection of Russell''s negative thesis, in conjunction with
    a diagnosis of its allure—to wit, a failure to distinguish fundamental questions
    from foremost ones. Our contention is not that philosophy is fully on a par with
    mathematics and the natural sciences regarding their respective questions. Rather,
    our point is that this distinction shows the situation to be not nearly as dire
    as many allege. It would be harmless if philosophy''s progress with respect to
    its fundamental questions compared unfavorably with progress in mathematics and
    the natural sciences with respect to their foremost questions. Although comparing
    apples to oranges in this way is clearly problematic, regularly impels critiques
    of philosophical progress.


    We''ve also argued—as our second conclusion—that when it comes to foremost questions,
    the Tri-Level Method helps to explain philosophical progress by identifying its
    probable source: philosophers have developed views that satisfy the method''s
    criteria better than their predecessors. Unsurprisingly, they have yet to resolve
    philosophy''s fundamental questions, whose scope and complexity render the task
    of constructing respectable (let alone excellent) theories regarding these questions
    extraordinarily difficult. In fact, such questions may be unresolvable; nevertheless,
    even if there is in this sense no “end” to philosophy, were theorists to satisfy
    the method’s criteria to a high degree, this would secure noetic progress with
    respect to the subject matters of those questions.


    But insofar as progress is absent with respect to fundamental questions—this is
    our third conclusion—the Tri-Level Method helps to explain this (and its relative
    innocence).


    Of course, there is a sense in which advancement even with respect to philosophy’s
    foremost questions has been slow and haphazard; while there has been progress
    on these questions, it has come in fits and starts. But this is only to be expected.
    For a method whose basic criteria are constitutively linked to theoretical understanding,
    as the Tri-Level Method’s, has not previously been formulated, much less fully
    implemented. Here, too, we believe that, with suitable methodological discipline,
    progress is within reach.


