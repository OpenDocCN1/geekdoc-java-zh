    # 致谢


    这本书的起源故事有些不寻常。2013年，我们三个人策划写一本关于元伦理学的书，其早期版本是2015年阿姆斯特丹自由大学（Vrije Universiteit）一场为期三天的研讨会的主题。那次研讨会改变了我们的项目。其中一个重要的批评是：“你们推销这本书是为了实现一种独特的哲学方法论。但你们只勾勒了它的轮廓。让我们听听更多！”


    试图遵循这一告诫被证明是挑战性的。我们对哲学方法论思考得越多，就越觉得需要说的话。因此，我们没有简单地将对这一主题的观点并入关于伦理哲学的手稿中，而是决定写一本关于一般哲学探的独立专著。结果就是你面前的这本书。


    我们对帮助过我们的人充满感激。我们特别感谢雷内·范·沃尔登堡（René van Woudenberg）及其同事在自由大学组织的研讨会上做出的贡献，并感谢塞尔利姆·伯克（Selim
    Berker）、阿南迪·哈蒂亚加迪（Anandi Hattiangadi）、特里斯特姆·麦克尔森（Tristram McPherson）和迈克·里奇（Mike
    Ridge）花时间阅读我们的作品，并在活动中对其提供了广泛且深刻的批评。还要感谢牛津大学出版社出色的编辑彼得·莫姆奇洛夫夫（Peter Momtchiloff），他聘请了克里斯·戴利（Chris
    Daly）、乔尔·普斯特（Joel Pust）和（再次）特里斯特姆·麦克尔森担任评审员；他们每个人对手稿草案都提供了有帮助的反馈。回应他们的尖锐意见使我们的项目延长了几个月——我们希望，这一切都是为了让这部作品比在没有他们批判性关注的情况下更清晰、更深邃。


    我们最初在2019年的两篇文章中，¹发表了我们关于方法论的一些观点，并在许多场合也表达过这些观点，包括布鲁根大学、吉林大学、位于柏林的德国分析哲学学会、岭南大学、巴塞罗那大学的LOGOS研究小组、哈佛大学、麻省理工学院（MIT）、斯德哥尔摩大学、佛蒙特大学、威斯康星大学麦迪逊分校、圣路易斯华大学和德克萨斯大学奥斯汀分校。感谢所有这些座讨会、会议和研讨会的参与者，以及许多对我们工作产生启发的对话。感谢本格森、库内奥和谢弗尔-兰道（2019）。


    # 插图清单


    -   [关于侦探的画](https://example.org) 1. 《柯南·斯福尔斯之谜》插图（1891年）

    -   [关于北欧的画](https://example.org) 2. 奥劳斯·马格努斯（Olaus Magnus）的《北欧史》（1555年）

    -   [关于运动的画](https://example.org) 3. 埃德华·迈布里奇（Eadward Muybridge）的《运动》（1887年）

    -   [关于苏格拉特的画](https://example.org) 4. 费利切·吉亚尼（Felice Giani）为《苏格拉底辩论》设计的插图（18世纪）

    -   [关于拆解的画](https://example.org) 5. 托德·麦克伦（Todd McLellan）的《拆解》（2020年）

    -   [关于老虎的画](https://example.org) 6. 葛饰（Hokusai）的《虎图》（1805年）

    -   [关于笛卡尔的画](https://example.org) 7. 杰拉德·范·古特文（Gerard van Guthoven）设计的插图（1664年）


    # 引言


    这本书是对哲学探究的尝试。我们认为你和我们一样，一直在努力应对一个哲学问题——也许是自由意志的问题。因此我们开启了一项熟悉的任务：发现或开发一种理论。


    我们致力于这一主题有几个原因，除了我们相信其价值之外。原因之一是关于探究的承诺深深影响了讨论和辩论。当这些承诺产生分歧时，通常会导致严重的误解并引发争议——正如康德所说，“一个无止境的战场”。¹


    ¹ 康德（1781/1998）。


    《哲学方法论：从数据到理论》，约翰·本格森、库内奥和罗斯·谢弗尔-兰道，牛津大学出版社。© 约翰·本格森、特伦斯·库内奥和罗斯·谢弗尔-兰道 2022。

    DOI: 10.1093/oso/9780192862464.003.0001


    # 2 引言


    然而，这些影响是可以避免的。正如佛教认为某种洞察可以消除痛苦一样，我们相信对哲学探的清晰视角有助于消除源于方法论的误解和分歧。


    写这本书的另一个原因（在这些观察下尤为重要）是为了让哲学家能够透明且明确他们的方法论承诺。遗憾的是，这一要求现在很大程度上被忽视了，导致一些人谈论方法论“丑闻”或“危机”，并对某种“方法论意识提高”表示“希望”。²
    这种说法可能夸张。但即便如此，问题确实存在于我们身上。彼得·戈德里·史密斯（Peter Godfrey-Smith）写得并不错：


    所有的哲学都充随着对哲学工作应该如何进行以及哲学理论应该尝试做什么讨论和焦虑。³


    与此同时，许多哲学家对提供任何类似于哲学配方都表示怀疑，更不用说如何做哲学了。


    ² 引用的表达中的，第一个来自杜梅特（Dummet 1978, 458），第二个来自柯林伍（Collingwood 1933, 4-6;对比 Baz 2017），而最后一对来自威廉姆（Williamson
    2007, 287），无论在其他地方谈论“哲学方法缓慢燃烧的危机”（2018, 4）。二十世纪的许多哲学都发生在“语言转向”的影响（或阴影）之下。³ Godfrey-Smith
    (2003, 5), Wilson (2017, 91) 声称，“哲学中缺乏固定标准”导致了各种学科问题。


