    ## Level Three: Highlighting the Virtues 121


    commitments of the theories are themselves well-grounded. Theorists may proceed
    serially, tackling the criteria at level one before turning to those at level
    two. But they need not. It often makes sense to do some work at level two before
    trying to complete the job at level one. For example, the explansans of a thesis
    introduced to defend a claim that accommodates a datum might double-duty as an
    explanation of that datum.


    The two levels are complementary in at least one further respect. When the Substantiation
    and Integration Criteria, along with the Accommodation and Explanation Criteria,
    are filled to a high degree, the resulting view is not only on track to be accurate,
    illuminating, robust, reason-based, and coherent, but also poised to achieve the
    orderliness that is characteristic of theories that promote understanding of their
    subject matter.


    In §1.3 we said that a theory is minimally adequate if and only if it does modestly
    well with respect to both of level one''s criteria. Suppose that a theory manages
    to modestly well with respect to the criteria at level two. Then, and only then,
    is the theory ‘respectable,’ being on track to deliver a modest level of understanding.
    This means that the two levels are both important, though not equally so. Yet
    the priority of the first level is defeasible in the sense that extensive successes
    at level two may deliver substantial improvements in understanding that are only
    barely diminished by small failures at level one. (The reverse is also true.)


    ## 3. Level Three: Highlighting the Virtues


    Most philosophers have expressed a preference for views that are more virtuous—for
    example, more modest, parsimonious, natural, fruitful, or beautiful—than their
    rivals. We agree that virtues matter under certain conditions. The key question
    is what these conditions are. Suppose that all is more or less equal among multiple
    theories at the Tri-Level Method''s first two levels. In such conditions, and
    only in such conditions, theorists are called on to ascend to the method''s third
    level, which instructs them to attend to the virtues of a theory as a whole. Such
    are the topic of the


    ### Virtue Criterion: All else being equal, a theory of a given domain must be
    more theoretically virtuous than rival theories.


    After making two points about this criterion, we''ll address its motivation.


    First, it bears emphasizing that this criterion targets the virtuosity of a theory,
    and thus concerns the being-theoretically-morevirtuous-than relation and only
    when its relata are whole theories. For all this criterion says, appeals to simplicity
    and various other putative virtues might play different roles when what is at
    issue is, say, the adequacy of a particular explanation advanced by a theory.
    In that case, we might note that one explanation is more virtuous than another,
    and so is more adequate. That might be directly pertinent when considering the
    call for explanation issued by the Explanation and Substantiation Criteria. But
    it would bear upon the wholesale evaluation of the theory only indirectly, if
    at all, since it would not by itself imply that a theory that incorporates this
    explanation is virtuous, or more virtuous than rivals.


    Second, we interpret the prefatory clause ''all else being equal'' to signify
    that the Virtue Criterion plays just a tie-breaking role, and does so only when
    two conditions are in place: (i) the candidate theories are all respectable, doing
    at least modestly well at levels one and two; (ii) the candidates are roughly
    equal—that is, more or less on a par—with respect to the four criteria at those
    levels. This precification is not mandated by the Tri-Level Method itself. But
    for reasons offered below, we find it compelling. Since levels one and two will
    often suffice to identify one theory better than its rivals, there will be a wide
    range of cases (most, suspect) in which this fifth criterion has no role to play.
    Ever, in practice and in principle, the second level of the Tri-Level Method may
    mark the terminus of theorists’ efforts. For it may be that one theory of a given
    domain does superior job accommodating and explaining the domain’s data, and substantiating
    and integrating its claims and commitments.


    There is a long tradition, running from Aristotle through Aquinas, Occam, and
    Kant, that endorses the Virtue Criterion, complete with its ceteris paribus clause.
    Some of these philosophers have maintained that theoretical virtues play a role
    in the theory choice because they assumed that simplicity and other candidate
    virtues are truth-conducive: simplex sigillum veri. We do not help ourselves to
    this assumption. Rather, because our method is designed with an eye toward promoting
    understanding, it ratifies a candidate virtue as genuine if, but only if, its
    possession somehow contributes to or enhances understanding. Any alleged virtues
    that do not meet this bar fail to qualify as theoretical, and thus fail to be
    relevant to the Virtue Criterion. We don’t take a stand on which virtues pass
    muster.


    Our perspective on the role of theoretical virtues follows from the conjunction
    of two claims:


    - (i) None of the theoretical virtues, either by itself or in tandem with others,
    is such that its possession contributes to or enhances the view''s capacity to
    provide understanding of its subject matter.

    - (ii) Once the Accommodation, Explanation, Substantiation, and Integration Criteria
    are satisfied at least modestly well, then a view''s exemplifying a theoretical
    virtue does contribute to or enhance the view''s capacity to provide understanding
    of its subject matter.


    The conjunction can be motivated by the following sorts of considerations.


    Consider the virtue of simplicity as a test case for claim (i). The solipsist
    position introduced by Descartes toward the beginning of his Meditations is strikingly
    simple. This position states that there exists one person—you—and your mental
    states. Solipsism is, at least one construal, a much simpler theory than one that
    posits you and mental states plus an external world. And yet solipsism is a crazy
    view. It is crazy largely because it thoroughly disregards the data that any view
    regarding there must accommodate and explain (including your fellow beings), fails
    to defend its own claims and commitments, and flouts the demand to attain integration
    with our world. Perhaps solipsism can account for these data, substantiate its
    claims and commitments, and achieve internal and external integration, or satisfy
    all of the relevant escape clauses. The point is that the bare fact that solipsism
    is simpler than the external world does not, in and of itself, promote theoretical
    understanding; the relative simplicity of solipsism does not by itself speak in
    this favor.


    This argument for claim (i) can be extended to other putative virtues. It implies
    that while such virtues may play an important methodological role, as many have
    suggested, their significance is more restricted, and more modest, than is sometimes
    assumed. They do not by themselves increase the chance of securing any of the
    four features of a theory that provide understanding: being accurate, illuminating,
    reason-based, or robust. Granted, some virtues may help secure the other pair
    of features, coherence and orderliness, whose contributions to understanding are
    conditional (as noted in Chapter 1, §3). Or they may boost the contributions to
    understanding made by accommodation, explanation, substantiation, and integration.
    We submit that the job of such virtues is plausibly construed in the manner described
    in claim (ii), which implies their role is restricted to that of being tie-breakers
    among respectable theories.


    We recognize that some will see things differently, contending that the methodological
    role of theoretical virtues is more powerful than this construal allows. For example,
