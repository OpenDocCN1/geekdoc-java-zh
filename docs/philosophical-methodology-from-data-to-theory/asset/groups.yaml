    some of those burdens, then the resulting view has a leg up on the original. Qualitatively,
    a theory might deliver a deep explanation, or instead provide a minimally adequate
    explanation, of a datum. The former is obviously better.


    ## 1.3 On the relation between the first two criteria


    While the Accommodation and Explanation Criteria both focus on the data, they
    mark two different, though complementary, intellectual projects: the former criterion
    issues a defeasible norm for theorists to certify the likely truth of a datum,
    where the latter issues a defeasible norm for them to explain why it is true.


    These criteria also potentially diverge, insofar as the theory may render a datum
    likely without explaining it. This is, for example, one way of interpreting the
    charge that nonnaturalist moral realism fails to account for the relation between
    moral and non-moral features, as codified by various moral superience theses:
    the view implies the likelihood of the superience of the moral on the non-moral,
    fails to explain it (or certain of its features). The idea that a theory explains
    a datum without accommodating it is a bit less straightforward. Arguably, in many
    and all cases, if a view explains a datum, then that datum is also going to be
    likely, given that view. Perhaps there are exceptions in which explanation does
    not entail accommodation.⁴ But as this will not affect anything in what follows,
    we can afford to remain neutral about this matter.


    Satisfying the Explanation Criterion without remainder is difficult. In some cases,
    it may be a significant achievement to explain


    ⁴ Cp. Clatterbuck (2020).


