    ## 第三级：突出美德 121


    理论的承诺本身是具有良好基础的。理论者可以按顺序进行，在转向第二级标准之前，先处理第一级的标准。但他们不必这样做。在尝试完成第一级的工作之前，先在第二级做一些工作通常是有意义的。例如，一个为了辩护接纳某数据的主张而引入的理论的解释者（explanans），可能兼任对该数据的解释。


    这两个层级在至少在另一个另一个方面上是互补的。当证实与整合标准（Substantiation and Integration Criteria）以及接纳与解释标准（Accommodation
    and Explanation Criteria）都达到较高程度时，所得的观点不仅有望变得准确、启发性、健壮、基于理性且连贯，而且有望实现促进对其主题产生理解的理论所具有的秩序性。


    在 §1.3 中我们曾说，一个理论当且仅当在第一级的两项标准方面都表现尚平可时，它才是最小程度充分的。假设一个理论在第二级的标准方面也表现尚平可。那么，且仅如此，该理论才是“值得尊敬的”，因为它有望提供适度水平的理解。这意味着这两个层级都是重要的，尽管重要程度并不相等。然而，第一级的优先性是可撤销的，从这个意义上说，第二级的广泛成功可能会带来理解上的实质改进，而这些改进仅会被第一级的微小失败略微削弱。（反之亦然。）


    ## 3. 第三级：突出美德


    大多数哲学家都倾向于比竞争对手更有“美德”的观点——例如，比对手更谦逊、更简洁、更自然、更有成效或更美。我们同意在某些条件下，美德至关重要。关键问题是这些条件是什么。假设在三级法（Tri-Level
    Method）的前两个层级中，多个理论之间基本相等。在这种情况下，且仅在在这种情况下，理论者被要求上升到方法的第三级，该级指示他们关注理论整体的美德。这些是以下的主题：


    ### 美德标准：在其他条件都相等的情况下，给定领域的理论必须比竞争理论在理论上更有美德。


    在对这一标准做出两点说明后，我们将探讨其动机。


    首先，需要强调的是，这一标准针对的是理论的卓越性，因此涉及“比……在理论上更有德”的关系，且仅当其关系对象是完整的理论时如此。就这一标准所言的，对简洁性和其他各种假设美德的诉求，当问题涉及（例如）一个理论所提出的特定解释的充分性时，可能会发挥不同的作用。在这种情况下，我们可能会注意到一个解释比另一个更有美德，因此也更充分。在考虑由“解释与证实标准”所发出的解释要求时，这可能是直接相关的。但对于理论的整体评估而言，它只会产生间接影响，甚至可能根本没有影响，因为其本身并不意味着一个包含了该解释的理论是有美德的，或比竞争对手更有美德。


    其次，我们将序言从句“在其他条件都相等的情况下”（all else being equal）解释为：美德标准仅起到平局的作用，且仅在满足两个条件时才发挥作用：(i)
    候选理论都是值得尊敬的，在第一级和第二级至少表现尚平可；(ii) 候选理论在这些层级的四项标准方面大致相等——也就是说，基本处于平级。这种具体化并非三级法本身强制要求的。但由于下文提供的理由，我们认为它是令人信服的。由于第一级和第二级足以识别出一个优于竞争对手的理论，因此会有很大范围的情况（大多数情况如此）使得这第五项标准没有发挥作用。无论在实践中还是原理上，三级法的第二级都可能是理论者努力的终点。因为可能某个领域的某个理论在接纳和解释该领域的数据、以及证实和整合其主张和承诺方面，做得更为出色。


    有一条从亚里士多德到阿奎那、奥卡姆和康德的长期传统支持美德标准，并连同其“其他条件不变”（ceteris paribus）条款。这些哲学家中的一些认为，理论美德在理论选择中起着作用，因为他们假设简洁性和其他候选美德是有助于导真的：*simplex
    sigillum veri*（简洁是真理的标志）。我们并不采纳这一假设。相反，由于我们的方法旨在促进理解，因此当且仅当拥有某种候选美德在某种程度上有助于或增强了理解时，我们才认可该候选美德是真实的。任何未达到这一标准的所谓美德都未能被视为理论美德，因此与美德标准无关。我们并不对哪些美德能通过审核发表立场。


    我们对理论美德作用的观点源于两个主张的结合：


    - (i) 任何一种理论美德，无论是单独还是与其他美德共同作用，都不足以其拥有有助于或增强该观点提供对其主题的理解的能力。

    - (ii) 一旦接纳、解释、证实和整合标准至少在尚平可的情况下得到满足，那么观点体现理论美德确实有助于或增强该观点提供对其主题的理解的能力。


    这种结合的动机可以通过以下几类考虑来解释。


    将“简洁性”的美德作为主张 (i) 的测试用例。笛卡尔在《沉思集》开始时引入的唯我主义立场极其简单。这一立场认为，只存在一个人——你——以及你的心理状态。至少在一种解释下，唯我主义比一个假定了你、心理状态外加一个外部世界的理论要简单得多。然而，唯我主义是一个疯狂的观点。它之所以疯狂，很大程度上是因为它完全忽视了任何关于存在的观点都必须接纳和解释的数据（包括你的同类），未能捍卫自己的主张和承诺，并蔑视与我们的世界整合的要求。也许唯我主义可以解释这些数据，证实其主张和承诺，并实现内外部整合，或满足所有相关的逃避条款。点在于，唯我主义比外部世界简单的这一事实本身，并不能促进理论理解；唯我主义的相对简洁性本身并不能说明这一点。


    这一主张 (i) 的论证可以扩展到其他假设的美德。它意味着，虽然这些美德可能像许多人暗示的那样发挥重要的方法论作用，但它们的意义比有时假设的更局限、更微小。它们本身并不会增加获得理论提供理解的四种特征（准确、启发性、基于理性或健壮）的机会。诚然，某些美德可能有助于获得另一对特征——连贯性和秩序性，这些特征对理解的贡献是有条件的（如第一章第3节所述）。或者，它们可能会增强接纳、解释、证实和整合对理解的贡献。我们认为，此类美德的工作可以合理地解释为主张
    (ii) 所描述的方式，这意味着其角色被限制在作为尊敬理论之间的平局打破者。


    我们意识到有些人会有不同的观点，认为理论美德的方法论作用比这种解释所允许的强大得多。例如，可能会说：


