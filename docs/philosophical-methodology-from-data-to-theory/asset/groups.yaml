    ## 4. A Brief Illustration


    It may be helpful to illustrate the Tri-Level Method in action. We''ve already
    mentioned the contest between solipsism and the external-world view, in which
    the latter comes out on top: since solipsism fares poorly at the first level,
    it fails to qualify as even minimally adequate, despite its simplicity. (Things
    only get worse at the second level.) What about less straightforward disputes,
    such as those concerning skepticism, free will, morality, or the mind–body problem?
    Given their complexity, and our efforts to keep this book short, any illustration
    involving such disputes must be schematic.¹¹¹


    Our illustration focuses on two prominent theories that endeavor to resolve the
    mind–body problem—that is, to answer the question of the connection between mental
    states and bodily states. According to the identity theory, each type of mental
    state is identical with a type of brain state; by contrast, dualism maintains
    that mental states cannot be wholly accounted for by physical states, including
    brain states.


    How does each theory fare well with respect to accommodating the data, the Tri-Level
    Method''s first criterion at level one? Both the identity theory and dualism seem
    well-positioned to draw on claims that would accommodate data about conscious
    experience and attitudes as belief and desire. Such data might include:


    - (a) attitudes as belief and desire are intentional;

    - (b) many mental states bear only contingent connections to behavior;

    - (c) many mental states bear necessary connections to one another.


    There are also candidate data that, it is often claimed, dualism is able to accommodate
    the identity theory for not, as such:


    - (d) there is “something it is like” to have conscious experience;

    - (e) mental states are multiply realizable.¹²


