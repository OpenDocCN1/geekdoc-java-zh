    # 6


    # Philosophical Progress


    There is a longstanding and influential charge that philosophy’s progress does
    not measure up to that made in mathematics and the natural sciences. Bertrand
    Russell famously pressed the worry in The Problems of Philosophy:


    If you ask a mathematician, a mineralogist, a historian, or any other man of learning,
    what definite body of truths has been ascertained by his science, his answer will
    last as long as you are willing to listen. But if you put the same question to
    a philosopher, he will, if he is candid, have to confess that his study has not
    achieved positive results such as have been achieved by other sciences.¹


    Here Russell characterizes the “positive results” of the sciences and philosophy
    as a “definite body of truths,” rather than as the


    ¹ Russell (1912/1997, 154–5). Notice that this passage does not distinguish between
    truths “ascertained by his science” that are data and those that are part of a
    theory. to ensure a level playing field, we will focus on theories in what follows.


    Philosophical Methodology: From Data to Theory: John Bengenson, Terence Cuneo,
    and Russ Shafer-Landau, Oxford University Press. © John Bengenson, Terence Cuneo,
    and Russ Shafer-Landau 2022. DOI: 10.1093/oso/9780192826424.003.007'
