    ## 132 The Tri-Level Method


    burdens that it fails to discharge—remainders that indicate far the theory falls
    short of delivering theoretical understanding of its subject matter.


    In addition, the Tri-Level Method instructs theorists to craft their views as
    well and fully as they can, rather than to simply exchange arguments and objections
    with their rivals, as sometimes happens when theorists merely shift burdens of
    proof or fixate on admissible moves within a given dialectic. While arguments
    and replies to objections have a place (as part of defense), the method applauds
    theories that accommodate and explain the data, and substantiate and integrate
    their own claims and commitments (or, alternatively, adequately defend the claim
    that they needn''t do one or more of these things). Importantly, doing all this
    is not just a comparative venture, in the sense that it does not involve theorists—whether
    proponents of dualism, the identity theory, or some other view—supporting their
    claims, commitments, and argumentative strategies merely by establishing that
    they compare favorably to those of rival theories. Nor does it consist in theorists
    looking over their shoulder at those rivals, canvassing and responding to objections
    they might pose. Nor is it a matter of inscribers establishing that their view
    exhibits theoretical virtues competing positions do not. In this way, the method
    instructs philosophers to focus not on other theories, but rather on handling
    the data, first and foremost.¹ The view that satisfies the method''s criteria
    to a high degree will be poised to deliver understanding of its subject matter,
    whatever else other theories might or might not accomplish.


    ¹⁸ Castañeda (1980, 133) similarly urges philosophers to focus on the data, as
    opposed to (say) engaging in argumentative hot potato or making interventions
    in local disputes.


    ## 133 Answering the Question of Method


    Finally, the Tri-Level Method''s criteria are non-partisan (at least) [in] the
    the following two respects. First, they do not prefer the theory that fits with
    some comprehensive philosophical view, such as naturalism, theism, pansychism,
    and the like. For such views do not possess default status, and they do not belong
    to our best picture of the world, in our semi-technical sense of notion. Second,
    the method''s criteria do not privilege views that exhibit one or another theoretical
    virtue, such as parsimony or unification. Theoretical virtuosity is relevant only
    when all is equal. A view as the identity theory is free to emphasize its simplicity.
    Likewise, a view as dualism may emphasize its central notions (e.g., pain) are
    joint-carving. But both theories must look elsewhere to earn the claim to enhancing
    your understanding of the relation between mind and body. In short, they must
    do this by accommodating and explaining the data, and by substantiating and integrating
    their own claims and commitments (or, alternatively, by satisfying the corresponding
    escape clauses).


    ## 5. Answering the Question of Method


    We defined a method as a set of criteria for theory construction and evaluation.
    The directions implied by the Tri-Level Method''s constituent criteria supply
    substantial practical guidance for the theory construction. These criteria say
    what theorists need to do in order to develop a theory that handles the data,
    is well-grounded, and (as relevant) is theoretically virtuous. The method also
    provides a means by which to determine a theory''s merits: it is assessable in
    light of how well or poorly it fares with respect to the method''s five criteria.
    This is crucial for theory evaluation.


    Perhaps more importantly, the Tri-Level Method handles all three data about method
    collected in the previous chapter. First, the method accommodates and explains
    the friendliness datum regarding central features of theoretical debate. For the
    method is friendly to the activities in which philosophers engage when they''re
    doing philosophy, such as:


    - advancing arguments

    - raising objections

    - offering replies to these objections

    - providing clarification

    - developing explanations

    - displaying sensitivity to the deliverables of logic, mathematics, science, and
    (to a greater or lesser degree) common sense.


    The Tri-Level Method also explains why it is a good thing for philosophers to
    engage in those activities: doing so conducts to the satisfaction of the method''s
    criteria, which are constitutively linked to inquiry''s ultimate proper goal.
    By advancing arguments and raising or replying to objections, philosophers improve
    their theories through stress tests that produce primary and secondary defenses.¹⁹
    Developing explanations helps to satisfy the other portion of the Substantiation
    Criterion, or instead the Explanation Criterion.


    ¹⁹ The Tri-Level Method also accommodates and explains more specific aspects of
    these elements of philosophical practice, such as the nature of objections (see
    the Box below) and the importance of and limits to arguments (e.g., Nozick 1981;
    van Inwagen 2006. Lecture 3; and Ballantyne 2013) and counterexamples (e.g., Weatherson
    2003 and Bonevac, Dever, and Sossi 2011). For instance, counterexamples are important
    because they expose failure of accommodation; they are limited because the Accommodation
    Criterion can be satisfied even if some of the data are not accommodated—as permitted
    by its escape clause.


    Sensitivity to the deliverables of logic, mathematics, science, and common sense
    positions theorists to fulfill the Integration Criterion. As for clarification,
    this could occur at any point. In some cases, it might be as simple as elucidating
    key terms in claims advanced to one or two, or being explicit about the implications
    of those claims. In other cases, the needed clarification may be more complicated,
    as when theorists sharpen a view by distinguishing from close competitors, or
    by anticipating and forestalling misinterpretations. Clarification might even
    come in the form of an analysis, which in some cases accommodate and explain a
    range of data, thereby serving as the basis of powerful theory that answers a
    variety of questions, including those of the form “What is F?” and “Why is F distinct
    from G?.²⁰


    ## 135 The nature and variety of objections


    The Tri-Level Method suggests a simple and informative characterization of the
    tone of an objection:


    - A consideration is an objection to a philosophical theory if, only, and because
    that consideration provides reason to think that the theory does poorly in some
    regard with respect to one or more of the Tri-Level Method’s criteria.


    The method also sheds light on familiar styles of objections and why they qualify
    as objections. For it identifies which dimension of theory evaluation each could
    be reasonably taken to target. To illustrate:


    ²⁰ We hope these remarks go some way toward indicating that a lot of contemporary
    philosophical work contributes to the satisfaction of the method’s criteria, whether
    directly or indirectly. Insofar as it does, such work is of considerable value.


    - Not really a theory, incomplete: The theory does not accommodate and explain
    sufficiently many data (or adequately defend this lacuna), and so does poorly
    with respect to the Accommodation and Explanation Criteria.

    - Descriptively inadequate, counterintuitive, phenomenologically off-key: The
    theory does not accommodate sufficiently many data (or adequately defend this
    lacuna), and so does poorly with respect to the Accommodation Criterion.

    - Explanatorily inadequate, impoverished, unilluminating: The theory does not
    explain sufficiently many data (or adequately defend this lacuna), and so does
    poorly with respect to the Explanation Criterion.

    - Ad hoc, unmotivated: The theory does not defend one or more of its own claims
    or commitments (or adequately defend this lacuna), and so fares poorly with respect
    to the Substantiation Criterion.

    - Mysterious, stops too soon: The theory does not explain one or more of its own
    claims or commitments (or adequately defend this lacuna), and so fares poorly
    with respect to the Substantiation Criterion.

    - Circular: The theory explains one or more of its own claims or commitments by
    invoking one or more data that those claims or commitments are intended to explain,
    and so does poorly with respect to the Substantiation Criterion.

    - Untenable, implausible, contravenes science or common sense: The theory conflicts
    with our best picture of the world (without adequately defending the claim that
    this conflict is unproblematic), and so does poorly with respect to the Integration
    Criterion.

    - Unparsimonious, inelegant, ugly, unruly, unnatural, intractable, etc.: The theory
    is in some non-trivial respect less theoretically virtuous than rivals, and so
    would do poorly with respect to the Virtue Criterion, were it applicable.

