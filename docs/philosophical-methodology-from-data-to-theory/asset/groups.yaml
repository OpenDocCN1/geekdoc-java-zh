    Having identified at least four forms of noetic progress, let us now offer detailed
    illustrations of the possibility of noetic progress on


    > ¹19 We borrow the quoted term from Kitch (1981, 512).


    > 20 Cp. Nozick (1981, 21–2) and Wilson (2014, 145–50 and 2017, 92).


