    156 哲学进展


    对于对哲学的大部分悲观情绪，以及对于其进展与其他领域进展之间许多不招意的比较。


    ## 2.3 认知进展的形式


    上述言论并不构成对存在性和比较性问题的回答，但它们有助于铺陈背景。下一步是提供认知进展的有力范例，这些进展可以采取多种形式。


    首先，通过识别对曾经看似可行的主张或论点的深层困难，可以提高理解。埃德蒙·格蒂尔（Edmund Gettier）的反例瓦解了知识的JTB（信念、真、证）分析；逻辑实证主义被揭示了其证实性准则具有自我削弱性质的工作所瓦解；享乐主义被罗伯特·诺齐克（Robert
    Nozick）的“体验机器”幽灵所困扰；在对逻辑恶问题的认可很大程度上消失后，在海伦·隆吉诺（Helen Longino）等人的深刻分析之后，科学完全没有价值的这一长期观念已走到了尽头。$^{17}$
    这些实例都是都是显性进展的实例，尽管对于从这些工作中汲取的教训，仍存在一些阻力。这些负面结论支持了积极的观点，这些观点虽然仍然是理性的、稳健的、启发性的、且且贯的，但现在比那些被取代的理论更准确。


    $^{17}$ 由于我们认为本段中的示例以及本节其余部分对许多读者来说是熟悉的，为了避免让脚注淹没你们，我们将放弃提供引用的惯例。


    ## 存在性与比较性问题 157


    其次，通过阐述此前被忽视阻碍了对特定领域理论化的区别，可以实现认知进展。¹18 由于对现象意识与接入意识之间的差异进行了分类管理，我们对心灵的理解得到了大幅提高。区分不同的多样性（例如本体论的、性质的、意识形态的、句法的等）有助于更好地理解其在理论选择中的作用。霍夫曼（Hoffman）对权利类型及其相应义务的四分，协助探究者在理论化这些规范性关系时切除各种模糊和混淆。自由意志的概念通过引入代理人因果与事件因果之间的区分而得到了增强。在这些每一个领域中，关注此类区分的理论更有可能具备六种促进理解的特征中的一种或多种。


    第三，认知进展可以表现为逐渐地提高现有理论的可行性。有无数例子可供选择。休谟（Hume）的原初功用主义，甚至是边沁（Bentham）提供的规范化表述，都比西德威克（Sidwick）《伦理学方法》中的后果论理论要简单且不全面得多。同样，今天的元伦理学表达主义版本比其起源的非认知主义观点领先了几个光年。种族哲学也以这种方式使得当代理论比前几代所设想的指数级更好。几个因素使得这种创新成为可能，包括哲学家在完善其理论时能够利用的“解释库”的扩张：


    > ¹1⁸ 参见 Gutting (2009 and 2016)。


    # 哲学进展


    借鉴之.¹19 最近的理论化阐明了这个库的内容：作为随附、构成、实现、组成、同一、基础等关系，现在可以被应用于哲学论述中。有了这些关系，理论家可以以增强理解的方式来放大和精炼他们的观点。


    第四，认知进展可能通过扩大给定领域内重要可能性的范围而发生。20 这里的例子也十分丰富，包括 W.D. 罗斯（W.D. Ross）规范伦理学中的初步义务理论、恩斯特·索萨（Ernest
    Sosa）和琳达·扎格贝斯基（Linda Zagzebski）的美德认识论、鲁斯·巴尔肯·马库斯（Ruth Barcan Marcus）对模态逻辑的贡献，以及玛莎·努斯鲍姆（Martha
    Nussbaum）的能力方法。我们不想对这些选项的任何一个真实性下定论。但可以说，那些准备尊重创新方法所体现的洞见（或从其错误中学习）的理论，更有可能是准确的、理性的、稳健的、启发性的、有序的或贯的。


    所有形式的进展都宽了并深化了在哲学理论化过程中通常被理所当然的框架。这个框架是对给定领域提供理解的理论的骨干，尽管是不完全。


    ## 2.4 说明认知进展


    在识别了至少四种认知进展的形式后，让我们现在对认知进展的可能性提供详细说明：


    > ¹⁹ 我们从 Kitch (1981, 512) 借用了这个引用的术语。


    > 20 参见 Nozick (1981, 21–2) 和 Wilson (2014, 145–50 and 2017, 92)。


    # 存在性与比较性问题 159


    空间限制我们只有两个——一个在这里提供，关于上述道德理由与动机之间的联系；另一个涉及感知哲学，包含在下方的框中。每个例子都围绕一组连贯的主张，，代表了过去理论化的果实。我们选择的例子并没有特别之处；很容易识别出更多。


    通过对曾经显赫的主张或论点的长期批判过程、做出新颖的区别、逐渐改进领先的竞争者以及探索全新的可能性，暂时的元伦理学家们挖掘了关于道德理由与动机之间联系的以下非显而易见的真理：


    - 某物只有在能够有助于解释代理人的行动时，才是一种动机。

    - （至少）两种类型的动机之间存在区别：某种类型的心理状态，如欲望，它在行动中起因果作用（“动机者”），以及人们在行动时考虑的考量（“动机理由”）。

    - 动机者和动机理由都区别于规范理由，后者支持某种反应。

    - 一项考量之所以是良好的动机理由，因为它也是强有力的规范理由。

    - 某物只有在是规范理由时，才是道德理由。

    - 一个理由只有在它足够强时，违反它才会使其变得不可责。

    - 动机者的强度与规范理由的强度之间没有直接相关。


    # 160 哲学进展


    - 代理人在特定时间即使缺乏动机者或动机理由，也存在行动的道德理由。

    - 当代理人接入她的某个规范理由时，它能够作为动机理由。

    - 在某些条件下，这种能力得到了实现：此时道德理由和动机理由汇合。

    - 当这种情况发生时，代理获得可撤销的道德荣誉。

    - 美德代理人的范例是在很大程度上体现这种汇合的人。

    - 恶德代理人的范例是在道德理由与动机理由之间存在系统性差异的人。


    这只是一个很容易凑成的更长列表的开始。²¹ 注意这些主张不是数据，因为它们属于我们在（第二章第3节）中所说的关于道德理由与动机联系的“良好”理论。| 罗塞尔的挑战与当代感知哲学
    罗塞尔的挑战是什么？他正确地建议哲学家和我们的科学家可以引用许多同行共识的真理，尽管对非专业人士来说可能是新奇。 |


