    ¹⁹ 三级法还涵盖并解释了哲学实践要素中更具体的方面，例如反对的性质（见下表）以及论证的重要性和局限性（例如 Nozick 1981; van Inwagen
    2006. Lecture 3; 以及 Ballantyne 2013）和反例（例如 Weatherson 2003 以及 Bonevac, Dever,
    and Sossi 2011）。例如，反例很重要，因为它们暴露了涵盖的失败；它们的局限性在于即使某些数据没有被涵盖，涵盖标准也可以被满足——正如其逃避条款允许的那样。


    对逻辑、数学、科学和常识产出的敏感性能理论学家能够履行“整合标准”。至于澄清，这可能发生在任何点。在某些情况下，它可能仅仅是阐明前一两个主张中的关键术语，或者明确那些主张的含义。在其他情况下，需要的澄清可能更为复杂，当理论学家通过与紧邻竞争对手进行区分，或通过预判并阻止误解来完善观点时。澄清甚至可能以分析的形式出现，分析在某些情况下涵盖并解释了一系列数据，从而成为回答各种问题的强大理论的基础，包括“什么是
    F?”以及“为什么 F 不同于 G?”这类形式的问题。²⁰


    ## 135 反对的性质与多样性


    三级法对反对的基调提供了一种简单且具有启发性的描述：


    - 一个考量是对哲学理论的反对，仅当且该考量提供了理由认为该理论在三级法的一个或多个标准方面表现糟糕。


    该方法还阐明了常见的反对风格以及它们为何属于反对。因为它识别了每种风格可以合理针对的理论评估维度。例如：


    ²⁰ 我们希望这些说明能在某种程度上表明，许多哲学工作无论是直接还是间接地都贡献了标准的满足。只要做到了，此类工作就具有巨大的价值。


    - 不是真正的理论，不完整：理论没有涵盖和解释足够的数据（或充分辩护这一缺陷），因此在“涵盖”和“解释”标准方面表现糟糕。

    - 描述性不足、违背直觉、现象学偏差：理论没有涵盖足够的数据（或充分辩护这一缺陷），因此在“涵盖标准”方面表现糟糕。

    - 解释性不足、贫乏、缺乏启发性：理论没有解释足够的数据（或充分辩护这一缺陷），因此在“解释标准”方面表现糟糕。

    - 特设的（Ad hoc）、缺乏动机：理论没有维护其一个或多个主张或承诺（或充分辩护这一缺陷），因此在“证实标准”方面表现糟糕。

    - 神秘、过早停止：理论没有解释其一个或多个主张或承诺（或充分辩护这一缺陷），因此在“证实标准”方面表现糟糕。

    - 循环：理论通过调用其主张或承诺旨在解释的一个或多个数据，来解释其一个或多个主张或承诺，因此在“证实标准”方面表现糟糕。

    - 不可维持的、不可信、违反科学或常识：理论与我们对世界的最佳图景相冲突（在未充分辩护这种冲突没有问题的情况下），因此在“整合标准”方面表现糟糕。

    - 不简洁的、不优雅的、丑陋的、不自然的、难以处理的等：理论在某些非琐要方面比竞争对手缺乏理论美德，因此如果适用，在“美德标准”方面会表现糟糕。


