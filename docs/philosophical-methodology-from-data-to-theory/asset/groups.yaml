    [content]

    must be handled by an answer to the question of method. Next, we''ll try to collect
    a third, centering on a constellation of features exhibited by a sound method.
    Doing so will position us to take a careful look at four methods that have dominated
    contemporary philosophy.


    ## 2. A Third Datum


    Our strategy for identifying this constellation of features is indirect. We''ll
    isolate a series of methodological tendencies through critical examination of
    classic and contemporary philosophical work. Many of these tendencies are laudable,
    and combine to form a multifaceted datum regarding a sound method. However, they''re
    closely associated with and can easily devolve into tendencies that are problematic.
    Our task is to disentangle them.


    ### 2.1 Methodological trends in recent philosophy


    We begin with an observation concerning philosophers'' tendency to sniff out potentially
    troubling aspects of rival theories. While it is laudable to engage with other
    positions in ways that seek to identify their shortcomings, such engagement becomes
    problematic when it leads philosophers to conclude that the target of their objection
    is inferior to their own position, absent the comparative work required to legitimate
    such a conclusion.


    Hartry Field''s scrutiny of mathematical realism''s commitment to the existence
    of mind-independent numbers is commendable, as it rightly highlights the fact
    that mathematical realists face the serious challenge of explaining how we could
    grasp numbers so understood. Arguably, however, theorists inspired by Field''s
    discussion would take a wrong step were they to conclude that realism is inferior
    to anti-realism just on the basis of the allegation that realism fails to explain
    the reliability of our mathematical beliefs. To establish such a conclusion would
    require pursuing the question of (say) whether anti-realism suffers from problems
    as severe as those that are thought to be realism.


    A second laudable tendency in philosophical inquiry is to identify central features
    of a domain, and to insist that a theory of that domain should have something
    about what they are and why they obtain. However, attention to phenomena sometimes
    encourages theorists to discuss features of the domain piecemeal, restricting
    their analyses to certain types of considerations, which are treated as if they
    decisively establish one or another theory regarding that domain.


    Sharon Street''s discussion of normative realism displays sensitivity to evolutionary
    considerations pertaining to the origins of normative thought. But it also risks
    falling prey to an illicit temptation when it claims that these considerations
    themselves “settle” the debate against realism. After all, properly assessing
    the merits of philosophical theories for their capacity to facilitate understanding
    of their targets requires taking into account not just a single consideration,
    or type of consideration, but a wide range of data.


    > 5 Field (1989, 25–30 and 230–9; 2005). Field describes his critique of realism
    as a “reconstruction” of an argument presented by Benacerraf (1973).


    > 6 Cp. Wittgenstein (1953, §593); “A main cause of philosophical disease—an unbalanced
    diet: one nourishes one’s thinking with only one kind of example.”


    > 7 Street (2008, 207 and 2015, 692).


    A third, rather different laudable tendency consists in recognizing the importance
    of defending one’s theory in the face of various challenges. In The View from
    Nowhere, Thomas Nagel candidly acknowledges and addresses several influential
    arguments against the normative realist position that he endorses. Appreciation
    of the necessity of defense should, however, be distinguished from the unfounded
    supposition that there is nothing more, beyond replying to such objections in
    a coherent way, that must be done in order for one’s view to merit allegiance
    over rival theories.


    Nagel flirts with a supposition of this kind when he tells us that he need not—indeed,
    cannot—say anything to “render [realism] more plausible than the alternatives,”
    beyond pointing to an initial, unearned “presumption that there are real values
    and reasons” and noting resources to “refute impossibility arguments.”⁸ However,
    while it may be some beliefs (e.g., basic perceptual or introspective ones) enjoy
    a satisfying presumption in their favor, there is little to be said on behalf
    of the idea that a whole philosophical theory, such as normative realism, requires
    no positive support whatsoever. Insofar as a theory provides to provide genuine
    understanding of—and not merely (say) a permissible perspective on—some domain
    or subject matter, its claim to do this must be earned, not presumed.


    Philosophers have been sensitive to the potential theoretical interest of distinctions
    among analyses of central philosophical terms, concepts, or properties—witness
    twentieth-century epistemology’s obsession with the analysis of knowledge in the
    wake of Edmund Gettier’s famous counterexamples to the thesis that justified true
    belief is sufficient for propositional knowledge. Such sensitivity is a fourth
    laudable tendency. But distinction and analysis are not all there is to constructing
    and evaluating philosophical theories. To borrow terminology from H. H. Price,
    besides “analytic clarity” there is also “synoptic clarity,” which consists in
    “bring[ing] out certain systematic relationships” among various elements of a
    given domain.¹⁰ Paradigm of such a relationship is explanation, but others, like
    coherence are also bound to be important. Thus when epistemologists assert or
    assume that “What is knowledge?” is the principal question of their field, they
    not only run the risk of illegitimately downplaying a variety of other epistemic
    phenomena, such as the character of intellectual virtues, epistemic reasons, and
    understanding. They also risk neglecting the importance of providing synoptic
    clarity regarding knowledge itself, including the systematic relationships it
    bears to such things as inquiry, wisdom, expertise, and the good life.


    + ⁸ Nagel (1986, 143–4).

    ⁹ Cp. Korsgaard (1996, 41–2), who raises a similar worry.


    Other tendencies in contemporary philosophy center on the variety and strength
    of the criteria by which theories are evaluated and their merits deserved. Two
    such tendencies are clearly commendable. The first, concerning strength, consists
    in acknowledging that certain criteria take priority over others. Ted Sider, for
    instance, endorses the comparative significance of parsimony when he argues for
    the nihilist thesis that there are no composite objects, on the grounds that “nihilism
    allows us to eliminate ‘part’ from the ideology of our fundamental theories.”¹¹
    The second, concerning variety, consists in recognizing a plurality of criteria,
    such as explanatory power, coherence, and simplicity. Particularly noteworthy
    is David Lewis’ sensitivity to a wide range of disparate criteria (such as fit
    with common sense, unity, and economy), on display in his attempt to defend the
    plausibility of his concrete modal realism.¹²


    ¹⁰ Price (1945, 29). ¹¹ Sider (2013, 240).


    ![img/2ba9cae91083537eea95cedc8859dee2_94_0.png]

    Illustration 5 An alleged composite object disassembled.


    Such sensitivity sometimes tempts theorists to treat several criteria as having
    the same importance as every other. But not all criteria are created equal, as
    the laudable tendency to prioritize some criteria implies. However, this tendency
    can also lead theorists astray. Consider the practice of elevating just one criterion
    above all others, and rendering a judgment about the comparative merits of different
    theories by reference to the privileged criterion alone. The scientificistic allegation
    that a theory’s empirical bona fides solely


    ¹² Lewis (1986, 3–5 and 134–5). See also Lewis (1983, x–xi); cp. Lewis and Lewis
    (1970, 211–12) and Armstrong (1989), §1.4).

