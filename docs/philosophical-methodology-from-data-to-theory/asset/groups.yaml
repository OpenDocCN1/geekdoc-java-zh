    Space limits us to two—one offered here, on the aforementioned connection between
    moral reasons and motivation, and the other, involving the philosophy of perception,
    in the Box that appears below. Each example centers on a coherent set of claims
    that represent the fruits of past theorizing. There is nothing special about the
    examples we''ve chosen; it would have been easy to identify many more.


    Through a long process of critiquing once-prominent claims or arguments, making
    novel distinctions, incrementally improving leading contenders, and exploring
    brand new possibilities, temporary metaethicists have unearthed the following
    non-obvious truths about the connection between moral reasons and motivation:


    - Something is a motivation only if it is capable of contributing to an explanation
    of an agent''s action.

    - There is a distinction between (at least) two types of motivation: a certain
    type of mental state, such as desire, that plays a causal role in action (a ''motivator''),
    and a consideration in light of one acts (a ''motivating reason'').

    - Motivators and motivating reasons are both distinct from normative reasons,
    which favor some response.

    - A consideration is good motivating reason because it is also a strong, normative
    reason.

    - Something is a moral reason only if it is a normative reason.

    - A reason is normative only if, when it is sufficiently strong, flouting renders
    it blameworthy.

    - There is no direct correlation between the strength of a motivator and the strength
    of a normative reason.


    # 160 Philosophical Progress


    - There can be a moral reason for an agent to act at a given time even though
    the agent lacks a motivator or a motivating reason.

    - When an agent accesses one of her normative reasons, it is capable of serving
    as a motivating reason.

    - In certain conditions, that capacity is realized: moral reason and motivating
    reason then converge.

    - When this happens, agents earn defeasible moral credit.

    - A paradigm of a virtuous agent is one who exemplifies such convergence to a
    substantial degree.

    - A paradigm of a vicious agent is one for whom there is a systematic divergence
    between his moral reasons, on the one hand, and his motivating reasons, on the
    other.


