    # 142 哲学的进展


    操作性问题：哲学如何在其核心问题上实现认知上的进步（noetic progress）？

    评估性问题：如何可能对哲学在其核心问题上的认知进步（如果有的话）获得一种有原则的评估？


    这些问题以一种非常有趣的方式相互关联。回答第二组问题需要提供一种方法，该方法可以指导哲学理论的构建，使这些理论能够提供理论性的理解，并能够对这些理论在多大程度上实现了这种益处进行有原则的评估。如果我们上述以方法为导的诊断是正确的，那么提供这种方法也是为了完全满意地回答第一组问题所需的。因此，尽管存在性问题和比较性问题在近期文献中受到了大部分关注，但我们认为，操作性问题和评估性问题识别了问题的根源。


    在本章中，我们将讨论三层方法（Tri-Level Method）如何使我们能够对所有四个问题提供答案，从第二组问题开始。


    # 1. 操作性与评估性问题


    为了理解该方法如何协助解决操作性和评估性问题，区分三个相互交织但又不同的智力项目将很有帮助。


    理论构建是指通过对给定领域的数据阐述一组主张来开发该领域的候选理论，这些主张要满足适应（Accommodation）、解释（Explanation）、证实（Substantiation）和整合（Integration）标准（以及相关的德性准则
    Virtue Criterion）。


    > 4 许多关于哲学进展的讨论遗漏了我们识别出的一个或多个问题。Chalmers (2014, 3) 帮助区分了第一对问题，同时将根源问题诊断为方法问题。


    理论评估包括将这些准则应用于理论，以确定它在方法的前两个层级的每一项标准上表现如何。理论比较是指将多个理论的评估并列放置，以确定哪种观点在前两层的准则上表现最好（如果平局，则考虑德性准则）。


    三层方法使探求者能够在这些智力项目的每一个上上实现认知上的进步。我们对操作性问题和评估性问题的回答解释了如何做到。


    ## 1.1 回答操作性问题


    操作性问题关注理论构建，追问哲学是否能够开发在其核心问题上实现认知进步的理论。我们的答案现在应该很清楚了：通过构建一个在第一层和第二层上高度满足四个标准，并（在相关情况下）在第三层满足第五个准标准的领域理论。


    我们必须强调的是，在满足这些准则时，探求者可能在不同点需要参考其他领域理论者所的工作。这种分工——即理论者依赖他人的贡献来帮助执行方法的指令——只要理论者对他们所参与的精确切点保持透明，就不是非法的。由于哲学的很大程度上是互相关联的，因为对解释和辩护的需求可以几乎无限地延伸，而且对内部和外部整合的展示可能是一个复杂的问题，所以理论者引用他人的劳动成果来代替自己提供完整的证实和整合是完全正当的。我们推崇的方法的一个优越之处在于，它鼓励探求者这样进行相互扶持（并在他们这样做时予以承认）。


    我们对操作性问题的回答留下了许多开放空间。特别是，三层方法本身并没有深入并包含关于如何最好参与理论构建的精确指令。理论者们被要求去适应和解释数据；他们被指示去证实和整合他们的主张；他们必须根据需要，着眼德性（virtuosity）来构建观点。但方法本身并没有规定执行这些事情的具体方式。（例如，如第5章
    (§2.3) 所，按顺序采取这些层级可能是很有用的。但探求者可能随时发现有理由回到第一层；毕竟，处理数据通常是一项持续的活动。）在这里保持某种开放性是一种优势，因为它为理论者在构建工作中提供了灵活性，允许理论构建的合法路径的多样化，并激发了探求者的创造力去组合对方法组成标准敏感的理论。虽然我们对这些准则的描述与许多填充各种细节的不同方式兼容，但我们可以对这些细节保持中立，因为它们不影响我们对操作性问题答案的基本形状（事实上，也不影响进展问题的任何其他方面）。


    ## 1.2 回答评估性问题


    操作性问题指向理论构建事项，而评估性问题关注理论评估和比较，这两者都是评估的维度。如何可能对哲学在其核心问题上的认知进步（如果有的话）获得一种有原则的评估？再次遵循三层方法：按顺序应用其准则，以确定给定领域的理论在多大程度上适应并解释了该领域的数据，实质性地整合了其主张和承诺，并（在相关情况下）实现了各种理论德性。我们将首先讨论该方法如何有助于理论评估，然后转向它对比较性评估的处理。


    在上一章列出方法的准则时，我们提出，一个理论之所以是最低充分的，仅仅是因为它在第一层准则方面表现尚可，而之所以是体面的，仅仅是因为它在第二层准则方面也表现尚可。其他类别的评估也是可能的。例如，一个理想理论（它以最大程度满足三层方法的所有准则）将赋予一种非凡的理解。但一个理论不必是理想的也是卓越的，即为目标领域提供了理解既是实质性的，使得进一步的构建工作可能促进适度的改进。对于我们这些探求者来说，一个卓越的理论是一个极值得追求的目标。


    我们承认，在数据上达成一致的哲学家有时会在哪些主张产生适应和解释上产生分歧。他们有时会对什么是充分的辩护或解释，或者哪些主张需要解释产生意见。一个观点是否与另一个一致有时存在争议；它是否符合我们最好的世界图，以及该图包括哪些元素，也取决于争议。这种争议是自然的。但它们并不威胁到我们目前所识别的准则的字面意思或精神。事实上，在某种意义上，这些准则在争议中往往是被预设的。


    然，这些争议可能给评估项目带来实践挑战。但由于在广泛的问题上存在普遍共识，这些困难得到了缓解。为了说明，认识论者大多数时候认同观点，即任何先验知识理论应该解决以下主题：


    - (1) 我们如何获得这种知识；

    - (2) 它是否可以被经验反驳（empirically defeasible）；

    - (3) 它是否可以是综合性的而不是分析性的；

