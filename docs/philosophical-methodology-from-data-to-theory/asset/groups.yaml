    ## 30 探究的本质


    等同于普通知识。正如上述解释，这种理解的功能，首先，在于以一种稳健、有序、连贯的方式阐明所研究现实的部分，而不仅仅是陈述关于它的系列已知真理或经过证实的信念。理论理解并非认识论上的完美。尽管如此，它是认识论上的卓越。它是探究终极恰当目标的首选者¹¹


