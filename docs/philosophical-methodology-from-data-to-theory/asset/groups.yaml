    # 88 方法的问题


    确定其可行性只是其中一个例子。将简洁性（parsimony）视为不仅是重要的，而且是始终具有优先考虑的，因为简洁性并不总是站在良好的一边。¹13 如果理论
    T 比理论 T* 更简洁，但 T 的简洁性使其比 T* 更无可能促进理解，那么 T 的简洁性就并不能为它赢得任何加分，更不用说能弥补其其他方面的短板了。更广泛地说，一个观点不能因为其在某一个标准上的表现逊于竞争对手就被完全否定。同样，仅仅一个理论在某一个评估维度上表现更好这一事实，不足以使其成为最佳（即最有可能促进对其主题内容的理解）。一个理论作为一种理论的地位，只有在应用了多个标准后才能被正确确定。


    ## 2.2 良好方法的基础


    我们的分析揭示了一系列值得赞誉的方法论倾向。每种倾向都对应一种方法论美德，它是使探究者能够实现探究终极正确目标的特征。如果我们的讨论切中要害，一种良好的哲学方法必须是：


    - 全面的（Comprehensive）：它要求理论不仅要处理单一的考虑因素或类型的考虑因素，还要处理广泛的数据。

    - 需要支持的（Support-requiring）：它提供的理论在认识论上得到了为其辩护的积极考量的良好支持。

    - 概括的（Synoptic）：它确保无论青睐哪种理论，都能最能揭示所涉及主题中的系统性关系（包括解释性关系）。

    - 多维的（Multidimensional）：它整合了多个标准。

    - 层次的（Hierarchical）：它承认标准扮演着不同的角色，且某些角色比其他角色具有更大的意义。

    - 比较的（Comparative）：它能够对竞争理论的个体和相对优点进行评估。


    > 13 哲学家如 Quick (1948)、Lewis (1986, 4)、Churchland (1984, 18)、Gibbard (2003, xii)、Melnyk
    (2003, 244ff.) 以及 Olson (2014, 147–8) 对简洁性始终具有优先考虑的观点表示了赞同。要区分“一个标准至高无上”的假设与“对理论的合理性存在某些必要条件（例如，处理该领域的数据）”这一合理立场。人们可以支持后者的立场，而不需要同时赋予单一标准相对于所有其他标准的优先重要性。


    一种良好的方法在思考方法时，作为一种中立的、约束探究的起点，体现了这些许多美德。它值得那些不同良好方法候选者的支持者关注，非常适合作为他们对此问题进行理论化的锚点，且其本身并非此类理论化的产物。因此，尽管它具有复杂性和新颖性，它也有资格成为关于方法的一项数据；我们称之为“美德数据”。


    回想起方法是一组标准，为理论构建提供指令，并为理论评估提供衡量尺度。此外，一个方法只有在满足其标准并使探究者能够实现探究的终极目标时，它才是公正的——在这里，理论恰好满足了方法的标准，意味着该理论至少拥有该目标的一些核心特征，可能（在邻近的世界中）拥有所有特征。基于我们在第一章（§3）中的论点，即探究的终极目标是理论理解，这些特征将包括那里所讨论的此类理解的六种特征：准确性、健壮性、基于理性的、启发性的、秩序性和连贯性。


    到为止，我们已经识别了良好方法必须处理的三类数据，并注意到简单的方法并不足以胜任。


    ## 现有方法 91


    在这里，我们识别了四种著名方法的简明表述，许多哲学家在进行理论化时遵循了这些方法。我们认为这些表述是“简明”的，因为它们抽离了各种细节和假设，以显化每种方法的核心承诺。¹14
    尽管我们将讨论的方法不是互斥的，但每种方法都被认为是完整的，即为了解决理论探究，除了遵循其指令外，不应有其他要求。我们自己认为这些方法包含了重要的见解。然而，通过我们收集的三类数据的视角，对它们的组成标准进行简要检查，将使我们能够确定每种方法面临的挑战，从而激发我们去寻求更充分的方法，而我们将在下一章提供这种方法。


    首先，考虑一种关注于澄清的方法，它指导理论者定义或分析一系列核心术语、概念或属性。我们称之为：


    **分析法（Method of Analysis）：** 在构建关于给定领域的理论时，理论者应当识别一组关于该领域的论题，提供对其核心术语、概念或属性的分析，且此类分析符合某些足够高的标准。最佳理论是那些所提出的分析相对于竞争对手在最高程度上符合这一标准的理论。¹15


    分析法有多种形式。一些支持者青睐普通用法，另一些人青睐当代语言理论的形式化机制，还有一些人青睐被称为“分支法”（Ramification）的广泛的功能性分析风格。另一种选择是


    ¹14 经常构于方法处理之中的个人主义（我们自己也拒绝它）就是这样一种假设。


    ¹15 这种方法的支持者或实践者包括 Moore (1903)、Russell (1914)、Stebbing (1932–3)、Anscombe (1957)、Goldman
    (1970)、Chisholm (1977)、Feldman (1992)、Strawson (1992)、Jackson (1998)、Haslanger
    (2012, Ch. 6) 以及 Hardimon (2017)。


    青睐一个术语或概念的“点”、它所扮演的角色，或者追求可能完善意义以更好地实现这一目的的分析。第二种方法专注于汇集理由，我们称之为：


    **论证法（Method of Argument）：** 在构建关于给定领域的理论时，理论者应当识别一组关于该领域的论题，其结论符合某些足够高的标准。最佳理论是其论证以这种方式在最高程度上得到支持的理论。¹⁶


    > ¹⁶ 引用自 Craig (1990)。Carnap (1950/1962) 强调了角色。Heidegger (1927) 将其标记为“存在性分析”。推理的收益将是逻辑上的：有效的、有说服力的，或足以让人相信的。前提的标准可以是确定的、显而易见的、被理想观众接受的、能够抵御相关挑战的等等。


    第三种方法通过 David Armstrong 描述的“成本效益分析”来权衡理论的优缺点。我们称之为：


    **成本效益法（Cost-Benefit Method）：** 在构建关于给定领域的理论时，理论者应当识别一组关于该领域的论题，其正面特征（收益）与负面特征（成本）比例很高，其中这些特征本身是相等且可加的。最佳理论是相对于竞争对手实现了最高这种比例的理论。¹⁹


    这种方法的支持者可能从一系列候选收益中选择：理性支持、预测能力、解释范围、简洁性、保守性等等。此类特征的缺失或相反特征的存在将被视为成本。对于为什么给定特征是收益的解释可以从真导性、实用性到美学卓越。


    第四种方法关注系统化，是 John Rawls 所说的“广义反思平衡”（wide reflective equilibrium）。²⁰ 它一直是


    ¹⁸ Armstrong (1989, 19)。

    ⁹ 这种方法的支持者包括 Quine and Ullian (1970, Ch. 6)、Lewis (1983 and 1986)、Armstrong (1989,
    §1,4)、Gibbard (2003)、Weatherson (2003)、Godfrey-Smith (2006)、Daly (2010, 216–18)、Enoch
    (2011)、Paul (2012)、Rawls (2013)、Sider (2013 and 2020)、Nolan (2015, §5)、Beebee
    (2018, §II and IV)、Massimi (2018) 以及 Goldwater (2021)。


    ¹⁷ 我们从 Thomson (1990) 和 Chalmers (2014) 借用了“论证方法”。其他方法的支持者或实践者包括 Harman (1977)、Parfit
    (1984)、Kamm (1993)、Baker (2000)、Bogossian (2006)、van Inwagen (2006)、Siegel (2010)、Korman
    (2015)、Barnes (2016)、Manne (2017) 和 Khader (2018)。


    ²⁰ Raw-ls (1971, 19–20); cp. Rawls (1974 and 1980)。另见 Goodman (1955, 63–4)。


