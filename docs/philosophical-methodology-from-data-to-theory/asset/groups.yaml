    - Ad hoc, unmotivated: The theory does not defend one or more of its own claims
    or commitments (or adequately defend this lacuna), and so fares poorly with respect
    to the Substantiation Criterion.

    - Mysterious, stops too soon: The theory does not explain one or more of its own
    claims or commitments (or adequately defend this lacuna), and so fares poorly
    with respect to the Substantiation Criterion.

    - Circular: The theory explains one or more of its own claims or commitments by
    invoking one or more data that those claims or commitments are intended to explain,
    and so does poorly with respect to the Substantiation Criterion.

