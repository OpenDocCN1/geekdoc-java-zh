    # The Goals of Inquiry 23


    and organize the bits of methodological wisdom they contain. We''ll argue that
    when philosophers adhere to the commitments we present, the theories they develop
    are poised to realize the epistemic goals of inquiry. It is to these goals that
    we now turn.


    # 2. The Goals of Inquiry


    Aristotle''s *Posterior Analytics* is naturally read as proposing that an ultimate
    proper goal of theoretical inquiry is the acquisition of *epistmē*—where this
    is not ordinary knowledge, but a special kind of epistemic ideal that many commentators
    designate with the term ''understanding.''¹¹³ We endorse a version of this proposal.


    Let us begin by explaining what we have in mind an ‘ultimate proper goal’ of theoretical
    inquiry. We allow that the set of possible goals of inquiry is open-ended. It
    may include psychological states, such as what Charles Sanders Peirce referred
    to as the "fixation of belief."¹⁴ or accomplishments such as happiness or salvation.
    No doubt it includes positive epistemic states such as justified belief, knowledge,
    and understanding.


    We take some goals to be ‘proper’ because, while there might be no such thing
    like the correct goal of a given activity, some goals are more fitting to an activity
    than others. This is particularly true of goals whose realization constitutes
    a type of success or excellence at that activity. As an example, consider investigative
    journalism, which has a variety of proper goals that include uncovering official
    malfeasance, identifying social inequalities, or


    > ¹³ See, e.g., Burnyeat (1981, 102–3 and 112), who describes Aristotle’s proposal
    as the “vision of Plato’s Republic transferred to the individual sciences."


    > ¹⁴ Peirce (1877, §4).'
