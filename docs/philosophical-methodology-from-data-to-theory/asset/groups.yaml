    # Introduction 9


    exegesis, which are central to historically oriented philosophical projects. Still,
    insofar as the history of philosophy is philosophy, as we believe, some aspects
    of those projects do fall within our purview here.


    Although we will often discuss how philosophy is or has been conducted, our project
    is not primarily concerned to characterize the lived experience of philosophizing
    or examine the most recent innovations in philosophical inquiry. Such inquiry,
    understood as a species of theoretical inquiry, should aspire to rise above trends
    and convictions that happen to be prominent at a specific historical moment or
    in a particular sociological context. Good methodology should reflect this point,
    and should indicate how the aspiration can be realized. Moreover, when it comes
    to philosophical theorizing, it''s not the case that anything goes; good theorizing
    ought to be guided by a sound method. These are among the ambitions we''ve set
    for the methodology we''ll develop in the following chapters.


    There is a sense in which the methodology we defend over the course of this book
    is novel. At the same time, it doesn''t herald a radical reinvention of philosophy.
    Our primary aims are to advance a model of philosophical inquiry, develop a theory
    of philosophical data, and assemble a method for philosophical theorizing that,
    when followed, promotes understanding. The criteria we''ll endorse are familiar
    from the way many philosophers ply their trade, though these criteria have not
    yet sufficiently justified, ordered, and integrated in a way that reveals how
    they can facilitate the principal aim of inquiry. The project is not to inspire
    a revolution, but to sharpen our understanding of philosophical inquiry, and of
    how to do it well.


    # 1

    ## The Nature of Inquiry


    Aristotle famously wrote that philosophy begins in wonder. Philosophical inquiry
    is, of course, prompted by much more than this. Curiosity, puzzlement, annoyance,
    distress, and even deep anger can prompt us to it. Although these states are highly
    diverse, they have this much in common: they induce us to raise questions that
    we want our inquiry to resolve.


    In philosophy, the central questions concern such topics as the nature of reality,
    the character and extent of our cognitive powers, and the content and status of
    practical norms. These questions include, but are certainly not limited to, the
    following:


    - Why is there something rather than nothing?

    - Does God exist?

    - Do we have free will?

    - How is the mind related to the body?

    - Is there such a thing as human nature?


    The Nature of Inquiry 11


    How is knowledge of the external world possible, if it is?

    - How do thought and language refer to the world, if they do?

    - What is the nature of meaning?

    - Are there objective normative standards?

    - Is there a single, fundamental principle of morality, and if so, what is it?

    - What is it to live well?


    Naturally, philosophers also wrestle with a welter of more circumscribed questions,
    such as:


    - Is existence a property?

    - Which abilities are required for omnipotence?

    - Does free imply the ability to do otherwise?

    - What is belief?

    - Is gender a biological category?

    - What is the difference between justified belief and knowledge?

    - Is it possible to refer to abstract objects?

    - Is meaning normative?

    - What is it for a standard to be objective?

    - What distinguishes moral principles from merely prudential ones?

    - Does living well require being virtuous?


    To engage in philosophical inquiry is to endeavor to address questions such as
    these, and those yet more fine-grained. This means treating such questions as
    open, aiming to respond to them in a satisfying manner as possible. Ideally, the
    culmination will be the successful resolution of those questions, the closing
    of inquiry.


    Our focus is on philosophical inquiry in its theoretical mode. Such inquiry is
    a species of a genus—theoretical inquiry. As such, it will help us understand
    our target by gaining a clearer view of


    The Nature of Inquiry 12


    the genus itself. We''ll do this by tackling two fundamental questions about such
    inquiry. The first concerns its structure: what are the basic elements of, or
    stages in, this enterprise? While sometimes a messy business in practice, we identify
    two common threads in diverse instances of theoretical inquiry. Our second focuses
    focuses the goals of such inquiry: what is its point or purpose? We distinguish
    different types of goals, arguing that successful theoretical inquiry terminates
    in a certain kind of understanding.


    # 1. The Structure of Inquiry


    Inquiry comes in a variety of forms, each involving a process or activity aimed
    at some end or goal. In practical inquiry, we engage in aimed at the performance
    of an action. In theoretical inquiry, we engage in reflection aimed at the provision
    of a theory. We''ll examine the goals of theoretical inquiry in detail in the
    next section. In this section, we analyze its structure.¹


    In our view, theoretical inquiry is best modeled as a process structured around
    two stages. We call the first the data collection stage, since it centers on the
    gathering of considerations (the data) that must somehow be handled when addressing
    a set of questions with which an inquiry is concerned. We call the second the
    theorizing stage, since it is designed to address those questions by developing
    theories that handle the data.


    > ¹ Some maintain that inquiry is best analyzed in terms of a distinctive attitude
    or aim (e.g., Friedman 2017, 302–3 and Smith 2020, 184). We remain neutral on
    this issue, providing an account not inquiry itself but rather of its structure
    (its components and their organization). That said, our account of this structure
    might be parlayed into a novel analysis of inquiry.


    The Structure of Inquiry 13


    Each stage has three main elements. Both data collection and theorizing have inputs,
    outputs, and a procedure or method, which takes one from the former (input) to
    the latter (output).² The two stages are intimately connected as the outputs of
    the first stage are the inputs to the second. Together, when all goes well, they
    constitute the transition from the opening of inquiry—concerning a set of questions—to
    its closing. Inquiry concludes with the provision of a theory, a set of claims
    thatquirers advance in the course of satisfying the method’s criteria in the second
    stage.


