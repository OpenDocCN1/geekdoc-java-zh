    ## 30 The Nature of Inquiry


    equivalent to ordinary knowledge. For, as explained above, the function of such
    understanding is, inter alia, to illuminate, in a robust, orderly, coherent fashion,
    the portion of reality under investigation, and not simply to state a series of
    known truths or justified beliefs about it. Theoretical understanding is not epistemic
    perfection. Still, it is a type of epistemic excellence. And it is a prime candidate
    for an ultimate proper goal of inquiry.¹120


    To appreciate this last claim, notice that it handles the points that challenged
    other aspirants. Theoretical understanding could not be unwarranted or narrowly
    circumscribed, and is neither dissonance-inducing nor compatible with obliviousness.
    It also excludes the sorts of confusion and muddle illustrated by our examples
    involving RATIO and SOCIAL CONSTRUCT. That it ticks these boxes is unsurprising.
    After all, if inquirers fully grasp a theory that is accurate, reason-based, robust,
    illuminating, orderly, and coherent, their grip on the inquiry’s subject matter
    would be both comprehensive and systematic. We would possess accurate replies
    to a wide range of central questions about that subject matter, including explanatory
    ones. Their answers would fit together, and enjoy rational support. Moreover,
    the inquirers would grasp those answers without conceptual confusion. In such
    a case, their curiosity, wonder, or puzzlement would be appropriately relieved.


    Recent epistemology has witnessed a surge of arguments for the value of understanding
    over all other epistemic achievements: see, among others, Elgin (1996, 122ff.),
    Zagzebski (2001), Kvanvig (2003, Ch. 8), and Pritchard (2010, Ch. 4 and 2016,
    §§2–4); cp. Delsén (2016). We will not rely on these arguments here, though they
    may offer independent support for our assessment. See Benson (2017) for a fuller
    treatment of understanding.


    ## Theoretical Understanding 31


    This line of reasoning may be buttressed by observing that a wide range of more
    demanding epistemic or alethic achievements, such as absolute certainty, are unnecessary
    to obtain such relief. Such achievements might be desirable in various respects.
    But even were inquirer to fall short of them, that wouldn''t by itself impug the
    success of their inquiries, so long as they terminated in full grasp of theories
    with the six properties we''ve identified.


    Our arguments in the previous section also cast doubt on the claim that there
    is a less demanding epistemic or alethic achievement—that is an ultimate proper
    goal. Though we certainly haven''t offered a decisive refutation of this claim,
    we have made the case that ordinary knowledge fails to resolve inquiry. (We''ve
    also given reason to believe that less demanding states, such as true belief,
    justified belief, and justified true belief, fail as well.) So any ultimate proper
    goal of inquiry distinct from understanding would have to be stronger than knowledge,
    but at least as strong as understanding. We''re not sure what might be—especially
    given our contention above that anything stronger than understanding is unnecessary.
    In any event, there is an important sense in which this doesn''t matter. For we''ve
    provided reason to think that understanding is the minimal epistemic achievement
    needed to resolve inquiry. And that''s all our arguments in this book require.


    (In order to streamline our discussion, we''ll often write as if the theoretical
    understanding is inquiry''s ultimate proper goal. This should not be read as implying
    that there aren''t any other ultimate proper goals, but rather as shorthand for
    the claim that understanding suffices to resolve inquiry, and no weaker epistemic
    or alethic achievement can do so.)


    The special role we are attributing to understanding can be further motivated
    through a contrast with the popular idea—recently


    ## 32 The Nature of Inquiry


    defended by David Chalmers—that inquirers ought to aim for collective convergence
    on the truth. Chalmers contends that other possible goals, including understanding,
    involve “something of a lowering of our sights.”²21 While we endorse the emphasis
    Chalmers places on collectivity, we reject a narrow focus on truth and agreement.
    In addition to concerns raised earlier (in §2) about the relation between true
    belief and inquiry’s ultimate proper goal, we’d like to register two further worries
    about Chalmers'' proposal. Both rely on drawing attention to the six understanding-enabling
    properties we identified.


    First, collective convergence on the truth appears to be insufficient to resolve
    inquiry. For such convergence would not ensure possession, let alone grasp, of
    a theory that possesses all six of the features described above. But in the absence
    of this, we could hardly deem inquiry complete. There would remain more work to
    do.


    Second, convergence is unnecessary, and so is whether it consists in full or partial
    agreement. Suppose we discovered that human psychology (with its penchant for
    generating agreement) rendered convergence unattainable. Still, were inquirers
    fortunate enough to develop a theory that realized all six features, understanding
    would suffice to resolve inquiry. We conclude that Chalmers'' charge gets backwards.
    Convergence on the truth closes inquiry only when it is accompanied by understanding.
    In this sense, aiming for more agreement is “something of a lowering of our sights.”²21
    Chalmers (2014, 14). By ‘the truth,’ Chalmers is referring to the proposition
    that correctly answers the question under investigation.


    ## Theoretical Understanding 33


    That said, as anticipated above, we support Chalmers'' suggestion that inquiry''s
    aspiration be couched in collective terms. Specifically, we affirm that an ultimate
    proper goal of inquiry must be both capable of being pursued collectively and
    available to collectives. Theoretical understanding meets these conditions. It
    can be realized through data-gathering, theorizing, or both. And the understanding
    that results from those efforts is in principle widely available.


    We''ve been focusing on the importance of understanding. It may be that science,
    philosophy, neighboring disciplines incorporate other epistemic projects as well—e.g.,
    aesthetic, deific, pragmatic, or political. No doubt philosophers have at times
    appraised views by these other epistemic standards. Our intention is not to question
    the legitimacy of such views, or to promote a picture of inquiry without interest
    in understanding. Rather, our contention is simply that understanding is inquiry''s
    ultimate proper goal. This contention should be congenial to those with disparate
    epistemic commitments. Granted, many pragmatists, anarchists, and anti-theorists
    decry the ambitions we have set for inquiry. But their misgivings are


    For two influential works by anti-theorists, see Baier (1985, Ch. 12) and Williams
    (1985). Dewey (1910 and 1938) is a well-known pragmatist, and Feyerabend (1975)
    famously vows anarchism. Urmson (1967, 232) also gives to the anarchist view in
    his summary of J. L. Austin''s work: "No one knows what satisfactory solution
    to such problems as those of free, truth, and human personality would look like,
    and it would be baseless dogmatism to lay down in advance any principles for the
    proper method of solving them."


    ## 34 The Nature of Inquiry


    typically directed at ideas to which we are committed or that we explicitly reject,
    such as an exaggerated sense of the importance of simplicity or an inflated notion
    of objectivity as requiring an “absolute conception of the world.” Moreover, our
    approach coheres with the stated motivations of many pragmatists, anarchists,
    and anti-theorists. These motivations include the historical and cultural situatedness
    of reflective thought, and the wide variety of considerations relevant to such
    reflection. Our contention is also compatible with the position that, in some
    cases, theoretical understanding with respect to certain questions is not achievable
    or at least is not readily available. We agree, for instance, with David when
    he writes that it is “a matter of prolonged and difficult inquiry gradually to
    improve currently accepted standards or conceptions” in philosophy.³³


    If our contention is correct, two conclusions follow. First, a method is sound
    only if it possesses the resources to guide the construction of a theory that
    positions inquirers to acquire understanding, and (concomitantly) to facilitate
    evaluations of candidate theories in this light. Second, because methods take
    data as their input, we must get clear about the nature of data and the means
    by which they are to be collected. We devote the next two chapters to presenting
    views about data in philosophy that are consonant with their role in developing
    a philosophical method poised to yield successful theories. We''ll then devote
    the remainder of the book to assessing extant methods, presenting the method that
    we prefer, and revealing its many benefits.


