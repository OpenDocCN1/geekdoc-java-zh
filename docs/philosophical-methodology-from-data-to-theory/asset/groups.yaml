    ## 152 哲学的进展


    当代哲学者的雷达显示，过去几十年里每个子领域的大量哲学研究，最好被理解为致力于更具体的问题。这些问题在根本性上并不如那样，但被合理地归类为当时的首要问题。这些包括关于意识与行为之间的关系（心灵哲学）、知识的各种性（认识论）、奠基关系的基本特征（形而上学）、约束与许可之间的区别（规范伦理学）、语义与语用之间的关系（语言哲学）以及道德理由与动机之间的联系（元伦理学）。


    应当明确的是，在涉及到自然科学、数学和哲学的根本问题时，探究尚未达到它们所追求的理论理解水平。与此同时，我们认为，这些领域的探究者对于他们处理的许多首要问题已经取得了实质性的理解。尽管哲学的进展可能等同于自然科学和数学的进展，但当我们进行同类项比较，并观察各自在首要问题上取得的进展时，我们可以看到哲学并不是罗塞尔所认为的那样是一个巨大的失望.¹³


    “物质。”相反，根本问题属于斯托尔贾（2017, 11）所说的“大问题”中最大的那些，尽管首要问题在斯托尔贾的意义上也是大。


    > ¹³ 至少有一种对罗塞尔论点的近期辩护明确将数学家在大多数希尔伯特问题上的成功（或部分成功）与罗塞尔文本中处理的哲学问题的缺乏成功相对应（参见 Chalmers
    2014, 9–12）。但正如我们解释的那样，希尔伯特的问题是首要的而非根本的。罗塞尔文本中的所有或几乎所有问题——关于表象与现实的区别、知识的可能性、归纳与先验、普遍性以及真性的本质——都是根本性的。其他类似的、与之下相比是不当的比较是由提出的，例如
    McGinn (1993, 12)、Dietrich (2010, §2)、Gutting (2016, §11) 和 Papineau (2017)。


    ¹十四 我们建立的温和立场与对进展的悲观观点形成对比，后者强调我们内在的认知局限性或哲学问题的理论特征（参见 McGinn 1993 关于“认知封闭”和 Nagel
    1986 关于“观点”）。我们的立场虽然很难说是悲观，但也与斯托尔贾（2017）的高度……


    ## 154 哲学的进展


    ## 2.2 共享框架（重新排序的上下文）


    ## 存在与比较问题 153


    记住，对某一理论的收敛并不是其产生答案能力的先决条件；某些探究者可能根本没有注意到某个理论的认知承诺。此外，哲学是如此困难，探究者追求不同的观点是理性的。这种分散的方式允许他们覆盖更广阔的地带。


    尽管如此，我们承认某些人可能倾向于将持久的哲学分歧视为对认知进展主张的否定。我们鼓励有这种倾向的人观察到，哲学中存在实质性的收敛，其程度未被注意到。有意识地思考自己学科的哲学家通常会对其中的辩论非常敏感。但他们不应该忽视支撑这些辩论的广泛共识。这种共识作为一个共同框架运作，其元素构成了被调查领域的部分视角。哲学辩论中心的（通常是有争议的）理论建立在这些共享框架之之上。


    例如，当哲学家对上帝的存在、因果关系的性质或正义原则产生分歧时，他们通常是在广泛共识的背景下进行的——“身体旋转的轴心。”¹⁵ 该框架统一了这样一种乐观观点：哲学家通过简单将原始问题替换为继任问题的答案，解决了“大问题”（见注12）。由于在每种情况下，原始问题和继任问题被认为都是开启探究的问题实例（该问题被丰富地标记为“大”的），我们发现这种处理哲学进展的方法是令人不满的。此外，虽然斯托尔贾（2017,
    32）对方法论问题保持沉默，但我们对进展的方法伴随着对两个方法问题的答案——操作性问题和评价问题——这些问题识别了问题的根源。


    ¹十五 借用维特根（1969, §152）的一个短语。


    ## 存在与比较问题 155


    每个领域的理论者不可避免包含一系列区别（例如权力与其行使、对象与事件、或行为与特征之间的区别）；被区分项目之间相似性和差异的清单；目标（例如上帝、因果关系或正义）的一系列必要条件，以及各种充分条件；关于这些条件本身的信息，即它们如何（以及如何）被正当地精确化；关于目标的解释作用的各种主张；理论死胡同的记录；开放可能性的列表等等。此类共识往往从缝隙中流逝，而分歧则占据了大部分的注意力。


    在涉及到科学和数学时，情况似乎反转了：在那里，共享框架是最显著的，而争端被认为是专家的保留领域。这种疏忽源于这样一种观察：当人们质疑哲学的进展时，他们倾向于强调其根本问题上答案的缺失。这种倾向忽略了这样可能性：即在首要问题上取得了重大进展；我们认为，这些进展丰富了作为强有力的哲学辩论持续之背景的框架。相比之下，当人们赞扬科学的进展时，他们通常提到其首要问题方面的许多进展，而忽略了根本问题仍然存在的事实.¹⁶


    这种熟悉的动态基于一种双重标准，这种标准无处不在，几乎不可见。如果我们的共享框架假设是正确的，我们可以认为这种双重标准负责……


    > ¹⁶ 当然，科学领域对于许多首要问题也存在相当大的分歧。参见例如 Wolchover (2020) 关于物理学家对粒子的观点。


