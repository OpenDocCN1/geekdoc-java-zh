    ## 133 回答方法问题


    最后，三级法的标准至少在以下两个方面是中立的。首先，它们并不偏好符合某些综合哲学观点的理论，例如自然主义、有神论、泛心论等。因为此类观点并不具备默认地位，而且它们不属于我们半技术意义上对世界的最优图景。其次，该方法的标准并不优待表现出某一种理论美德（如简洁性或统一性）的观点。理论美德仅在一切条件同等时才有意义。像同一性理论这样的观点可以自由强调其简单性。同样，像二元论这样的观点可以强调其核心概念（例如痛苦）是共同划分的（joint-carving）。但两种理论都必须向别处寻求，以获得增强对心身关系理解的声声。简而言之，它们必须通过涵盖和解释数据，以及证实和整合自身的主张与承诺（或者，相反，通过相应的逃避条款）来实现。


    ## 5. 回答方法问题


    我们将方法定义为一组用于理论构建和评估的标准。三级法组成标准所蕴含的指示为理论构建提供了实质性的实践指导。这些标准说明了理论学家需要做什么，以开发出一个能够处理数据、有良好根据且（在相关时）具有理论美德的理论。该方法还提供了一种确定理论优点的手段：可以根据其在方法五个标准上的表现优劣对其进行评估。这对于理论评估至关重要。


    也许更重要的是三级法处理了上一章中收集的关于方法的三个方面数据。首先，该方法涵盖并解释了关于理论辩论核心特征的“友好数据”。因为该方法对哲学家在从事哲学时参与的活动是友好的，例如：


    - 提出论证

    - 提出反对

    - 对这些反对提供回应

    - 提供澄清

    - 开发解释

    - 对逻辑、数学、科学以及（不同程度的）常识的产出表现出敏感性


    三级法还解释了为什么哲学家参与这些活动是一件好事：这样做会导致标准的满足，而这些标准在构成上与探究的终极正确目标相关。通过提出论证和提出或回应反对，哲学家通过产生初级和次级压力测试来改进他们的理论¹⁹
