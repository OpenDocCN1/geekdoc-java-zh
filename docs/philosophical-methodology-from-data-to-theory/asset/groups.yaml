    ## Answering the Question of Method 137


    We submit that these are illuminating characterizations of precisely the sorts
    of objections that philosophers legitimately attempt to head off when constructing
    their theories, or advance against rival theories in their chosen domains.


    Second, the Tri-Level Method’s five criteria are determinative: they select among
    multiple theories that fit the data, eliminating a great many from contention.
    The method thus resolves the determination of theory by data. For it identifies
    a set of instructions that, when successfully followed, allow inquirers to zero
    in on a theory that does not merely imply or probabilify the data, but provides
    understanding to anyone who fully grasps it.


    Third, the Tri-Level Method handles the virtues datum, exhibiting the features
    of a sound method identified in Chapter 4 (§2). The method is comprehensive: its
    Accommodation and Explanation Criteria for theories to address not just a single
    type of consideration, but a wide range of data within the target domain. It is
    also support-requiring: it grants “presumptive” or “default” status, since a theory
    earns its positive status only if it is well supported by reasons, per the defense
    component of the Substantiation Criterion. In addition, the method is synoptic:
    it calls for explanations of both the data and the theory’s own claims and commitments,
    per the explanatory component of that criterion. It thereby ensures whichever
    it favors is best positioned to expose systematic relationships in the subject
    matter in question. Moreover, the method is straightforwardly multidimensional:
    it does not privilege a particular theoretical desideratum, but rather identifies
    at least four (accommodation, explanation, substantiation, and integration) and,
    as relevant, a fifth (virtosity) that inquirers must attend to in theory construction
    and evaluation. Furthermore, the method is hierarchical: it assigns these desiderata
    diverse roles, thereby acknowledging that some desiderata possess more significance
    than others (in particular, the Virtue Criterion is in most cases going to be
    far less important than the criteria at levels one and two). Finally, the Tri-Level
    Method is comparative: it enables assessment of the individual as well as the
    relative merits of rival theories. Each candidate can be evaluated in light of
    the extent to which it satisfies the method''s criteria, and competing theories
    can be measured against one another by reference to how well they do.21


    Our contention, then, is that the Tri-Level Method handles all three of the data
    regarding method. When setting forth its criteria, we pointed out how they are
    constitutively linked to the six features of a theory that provides understanding.
    Accordingly, we submit that the method is sound, yielding a satisfactory answer
    to the question of method. Earlier we observed that if a method is sound, then
    (ceteris paribus) inquirers have strong reason to endorse its outputs. This is
    why—despite the high bar that it sets—we encourage adoption of the Tri-Level Method
    in pursuit of answers to philosophical questions, and of philosophical progress
    generally.


    > 21 Recall that all of the extant methods discussed in Chapter 4 (§3) lack at
    least one of these virtues. We''ve also argued that these methods fail to position
    inquirers to secure outputs possessed of the six features of theoretical understanding,
    and many of those are not obviously deterministic or finely tuned to all of the
    commonplace philosophical activities discussed in Chapter 4 (§1). These are further
    reasons for relying on the Tri-Level Method, rather than any of these familiar
    alternatives, seeking to make philosophical progress (our topic in the next chapter).
    Independent support may be found in Chalmers'' (2014, §§4–5) and Beebee''s (2018,
    §II) suggestions that the alternatives (in particular, the Method of Argument
    and Cost-Benefit Method, respectively) impede rather than facilitate progress.


    ## Philosophical Progress


    There is a longstanding and influential charge that philosophy’s progress does
    not measure up to that made in mathematics and the natural sciences. Bertrand
    Russell famously pressed the worry in *The Problems of Philosophy*:


    If you ask a mathematician, a mineralogist, a historian, or any other man of learning,
    what definite body of truths has been ascertained by his science, his answer will
    last as long as you are willing to listen. But if you put the same question to
    a philosopher, he will, if he is candid, have to confess that his study has not
    achieved positive results such as have been achieved by other sciences.¹


    Here Russell characterizes the “positive results” of the sciences and philosophy
    as a “definite body of truths,” rather than as the achievement of understanding,
    inquiry’s ultimate proper goal.


    ¹ Russell (1912/1997, 154–5). Notice that this passage does not distinguish between
    truths “ascertained by his science” that are data and those that are part of a
    theory. To ensure a level playing field, we will focus on theories in what follows.


    Philosophical Methodology: From Data to Theory: John Bengenson, Terence Cuneo,
    and Russ Shafer-Landau, Oxford University Press. © John Bengenson, Terence Cuneo,
    and Russ Shafer-Landau 2022. DOI: 10.1093/oso/9780192826424.003.007


    But this characterization is incidental to his central negative thesis, namely,
    that philosophy compares unfavorably with other intellectual fields in respect
    to progress. This thesis continues to be widely accepted.


    Russell’s doubts are emblematic of a more worry about philosophical progress,
    which focuses not on the alleged inferiority of philosophy vis-à-vis “the other
    sciences,” but instead on the ability of philosophy to register any progress at
    all. Kant’s anxieties on this score are well-known. Speaking of what he calls
    “metaphysics,” Kant writes that it is a battlefield, and indeed one that appears
    specially destined for testing one’s powers in mock combat; no combatant has ever
    gained the least bit of ground. Hence there is no doubt that up now the procedure
    of metaphysics has been... Kant’s successors have extended his pessimism well
    beyond the boundaries of metaphysics to philosophy as such.


    Why has progress proven elusive? Kant intimates that it is due to the failure
    to develop and implement an methodology. He is not alone; many have pointed to
    method as the culprit. The idea here is not simply that philosophers have failed
    to articulate, or properly adhere to, their methodological commitments: this by
    itself is not the impediment to progress. Nor is the worry that philosophical
    debates are rife with disagreement—in our view, consensus is not always a sign
    of a discipline’s health, whereas meticulous debate often is.³ Rather, the deep
    problem concerns the absence of any method whose proper execution is likely to
    further understanding. Such progress, which we call ‘noetic,’ would thus seem
    beyond reach.


    Focusing on noetic progress is appropriate not only because theoretical understanding
    is inquiry’s ultimate proper goal. Such a focus also has the virtue of recognizing
    that philosophical investigation needn''t be assessed in terms of problem-solving.
    In fact, even if one or more of the leading questions about a given domain is
    unsolvable, this would not by itself prohibit understanding regarding that domain.
    Noetic progress is more complicated, and more nuanced, than that.


    These remarks are intended to highlight the various layers of the problem of philosophical
    progress, an adequate solution to which must address four questions:


    - Existential Question: Has philosophy actually made noetic progress with respect
    to its central questions?

    - Comparative Question: Is there noetic progress in philosophy with respect to
    its central questions that is comparable to progress made by other fields of theoretical
    inquiry?


    ³ Cp. Solomon (2001), Beatty and Moore (2010), and Dang (2019). It may be that
    extensive disagreement poses an additional threat if it generates a defeater in
    the way described by conciliationist views (see, e.g., Elga 2007 and Feldman 2007;
    for applications to philosophical progress, see, e.g., Kornblit 2013, Goldberg
    2013, Frances Lycan 2019, and Beebee 2018, §III). We are not convinced that philosophical
    controversy generates such a defeater. Together with the point we make in the
    text, this leads us to not focus on disagreement but on the alleged paucity of
    philosophical progress itself. We return to the topic of disagreement in §2.2.

