    ## The Question of Method


    Proponents of the Method of Reflective Equilibrium have two replies of their own
    to the charges we''ve raised. The first appeals to a certain interpretation of
    this method, one that emphasizes its flexibility. Kenneth Walden, for example,
    recommends an “anti-essentialist” view whose signature implication is that “the
    method of reflective equilibrium is not, exactly, *anything.*”31 That is,


    > The method of reflective equilibrium should be understood not as a particular
    method that lays out theories about the nature of [data], methodology, and criteria
    for epistemic success, but as what is left over of our methods we deny that we
    can do this.32


    Such a position may well serve as a “tonic corrective” to the “temptation to take
    some…contingent feature of inquiry and cast it as the very essence of inquiry.”33
    However, viewed as a reply to the worry we''ve aired, such a position is inadequate
    for at least two reasons. First, it does not provide any means for securing determinativeness,
    or the virtues that the method lacks. Second, it overreaches. To the extent that
    the point and purpose of method is to guide and constrain theorizing, the sort
    of vacuity countenanceed by this approach must be regarded not as a defense of
    a specific method, but rather as a retreat to *skepticism* about method.


    The second response we''ll consider adverts to the idea that the Method of Reflective
    Equilibrium is the only game in town. Thomas Scanlon writes:


    - 31 Walden (2013, 244). 32 Walden (2013, 255).

    - 33 Walden (2013, 255). Derrida, a general critic of essentialism, famously made
    similar remarks about his preferred method, deconstruction, eventually writing:
    “What is deconstruction? Nothing, of course!” (1991, 275).


    ## Room for Improvement 105


    It seems to me that this method, properly understood, is in fact the best way
    of making up one''s mind about moral matters and about many other subjects. Indeed,
    it is the only defensible method; apparent alternatives to it are illusory.³34


    The last claim of this passage strikes us as incorrect. Think of the different
    methods we''ve examined so far. They privilege conceptual analysis, argument,
    or miscellaneous benefits (such as parsimony or predictive power). In the next
    chapter, we''ll detail a method that privileges accommodation, explanation, substantiation,
    and integration. None of these criteria is equivalent to equilibrium. Consequently,
    if the assertion that there is no alternative to the Method of Reflective Equilibrium
    is to stand a chance of being true, it can be only because it supposes that this
    method need not prioritize equilibrium, but can sometimes give most weight to
    other criteria. That is not, however, an adequate defense of the method, and not
    simply because it drains the method of its distinctive content. For the assertion
    itself does not support the claim that appealing to reflective equilibrium satisfactorily
    answers the question of method.


    What about a method that rejoins the four methods we''ve described—might such
    an "all-inclusive" method evade our objections? Perhaps. But we are not sanguine
    about the prospect. The four methods appear to privilege criteria that point in
    very different directions, making it unclear whether and how they can be consistently
    conjoined. It seems to us that integration could be achieved only at the cost
    of introducing revisions that substantially alter the letter, and violate the
    spirit, of at least some of these methods.


    - ³⁴ Scanlon (2002, 149). Cp. DePaul (1998), as well as Keefe''s (1999, 42) comment:
    "There is, I, suggest, no possible alternative methodology."


    If our critical remarks have been on target, the question of method—how to get
    from data to a theory that realizes inquiry’s ultimate proper goal?—is as yet
    unanswered. In the next chapter, we propose our own solution.


    ## 5

    ## The Tri-Level Method


    A sound method positions inquirers to achieve theoretical understanding. This
    chapter presents a method designed to do just that. We endorse the method not
    because it makes a philosopher’s job easy; indeed, it is quite demanding. Nor
    are we drawn to its constituent criteria because they revolutionize philosophical
    thinking; on the contrary, all of them are familiar from the way many philosophers
    go about their business. However, they have not yet been combined, integrated,
    and clarified in a way that reveals how their conjunction can promote inquiry’s
    ultimate proper goal: theoretical understanding. Because they operate at three
    distinct levels, we call the method they compose the ‘Tri-Level Method.


    Its first level directs theorists to handle the data in a given domain through
    a series of claims and commitments. The second instructs theorists to ensure that
    these claims and commitments, which comprise their theories, are themselves well-grounded,
    epistemically and explanatorily. The third charges theorists with the task of
    rendering their theories virtuous in certain respects. These are the building
    blocks of the:


    **Tri-Level Method**: When constructing a theory of a given domain, theorists
    ought to articulate a set of theses about the domain that (i) accommodate and
    explain the data, (ii) are themselves substantiated and integrated, and (iii)
    possess specific theoretical virtues. All of the criteria for the first two levels,
    given by (i) and (ii), include escape clauses. Each level takes priority over
    its successors. The best theory is the one at these levels (so ordered) to the
    highest degree relative to its rivals.


    This austere formulation of the Tri-Level Method hints at how the method preserves
    insights from Chapter 4. It does so partly through the assignment of roles to
    analysis (which may subserve accommodation, explanation), substantiation (since
    equilibrium is central to integration), and miscellaneous benefits (in the form
    of virtues). Yet the Tri-Level Method neither repises those criteria nor simply
    joins them aggregative. This sets it apart. We offer the following diagram of
    the method''s five criteria, which visually depicts their organization.


    ### Level One: Handling the Data 109


    | Criteria |

    | :--- |

    | 1. Accommodation Criterion |

    | 2. Explanation Criterion |

    | 3. Substantiation Criterion |

    | 4. Integration Criterion |

    | 5. Virtue Criterion |


    The Tri-Level Method levels one and two both feature a pair of criteria. The pair
    at the first level enjoys priority over the second (in a sense we''ll explain
    below). All criteria at the first two levels enjoy priority over the sole criterion
    at the third, which (on our version of the method) plays only a tie-breaking role
    between theories that do well enough.


    Both the austere formulation and the diagram above showcase the basic content
