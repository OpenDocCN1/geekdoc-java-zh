    ## The Epistemic Theory


    question of what it takes to satisfy this condition is both open and often extremely
    difficult to answer.


    The same is true of the question of which claims satisfy the condition. Thus the
    epistemic reasons theory sheds light on disputes over which claims are to be counted
    as data. Such disputes are real, and can be important. If our view is correct,
    these disagreements are predictable. They can be traced to an unfortunate but
    familiar opacity that sometimes attends our efforts to determine the balance of
    reasons lies.


    Some would try to make things easier by restricting philosophical data to a specific
    set of considerations, such as those that are widely accepted, reflected in ordinary
    usage of language, or scientifically verifiable. The epistemic reasons theory
    delivers the (correct) verdict that these views are guilty of chauvinism. For
    they illicitly denying that any other considerations could supply good epistemic
    reason to take the relevant domain to be one way rather than another. We can avoid
    such chauvinism by viewing data as epistemically well-supported considerations,
    whatever those happen to be.


    To reject chauvinism is not to suggest that anything goes. The epistemic reasons
    theory sees philosophical data as delimited by the good reasons possessed by inquirers,
    considered collectively. It clarifies what it takes to precisify a datum. A satisfactory
    precisification of a given datum q must be a claim backed by good epistemic reason,
    while not omitting anything in q that is thus supported. In this way, the epistemic
    reasons theory illuminates the propriety of precisifications.


    The epistemic reasons theory also bears on the propriety of methods. Given that
    inquirers have good reason to take data to be genuine features of the domain under
    investigation, no method of theorizing could qualify as sound were it insensitive
    to the evidence that data provide. Likewise for any method that allows theorists
    to reject the data without justifying their rejection. In effect, our view explains
    why the data have a profound influence on what qualifies as a sound method.


    Finally, consider the character of theoretical inquiry itself. Theoretical inquiry
    is not an epistemically neutral process. Rather, when inquirers partake in it
    properly, they enjoy a certain kind of good epistemic standing; they have good
    epistemic reason to believe a range of claims about the domain. Notice the Moore-paradoxical
    character of the following statement, uttered by inquirers in a given domain:
    “These are data, considerations that must be handled, but we lack reason to take
    them to identify genuine features of the domain.” The epistemic reasons neatly
    explains not only why such a statement is puzzling as it is, but also why properly
    engaging in inquiry is incompatible with the absence of any reasons for belief.


    ## 2. The Process of Data Collection


    Philosophical data do not magically appear in ready-made lists; they must be collected.
    The epistemic reasons helps to illuminate the inner workings of such collection,
    and agrees with best practices for data collection undertaken by individuals or
    groups.


    As we see it, the process of data collection has three basic components. The first
    comprises its inputs, which include whatever is potentially relevant to answering
    the central questions about a domain—for example, actual or hypothetical cases,
    a linguistic corpus, survey results, and the like. The second comprises the outputs
    of data collection, which are the data themselves. The third component is a procedure
    that takes collectors from the former to the latter.


    Procedures for data collection are ways of sifting and windowing so to determine
    what does and does not qualify as a datum in the domain at hand. Examples of procedures
    that have played prominent roles in the collection of philosophical data include:


    - Perception of items in one''s environment

    - Introspection of one''s own phenomenal states

    - Intuitions about thought experiments

    - Linguistic judgments about the grammaticality, meaning, or truth-conditions
    of sample sentences

    - Common sense verdicts about what exists, known, etc.

    - Imagining future possibilities

    - Inductive inference from observed samples

    - Sociological observations about ordinary conversations

    - Attending to the testimony of members of marginalized or oppressed groups

    - Statistical analyses of survey results

    - Selecting, implementing, and analyzing a model of a scenario

    - Searching for the origins of a practice through archival study

    - Interpreting a text using particular hermeneutics


    It goes without saying that these procedures represent only a tiny sample of those
    that are and could be used to collect philosophical data. Note, also, that they
    can overlap, intersect, and be conjoined. We make no claim to either exhaustiveness
    or exclusivity.


    We think of a procedure as the conjunction of two elements. First, there is a
    source: a way of forming thoughts about the various inputs, by means of which
    collectors arrive at a belief to the effect that the domain is a certain way.
    Candidate sources, featured in our examples just above, include perception, introspection,
    linguistic judgment, common sense, imagination, and inference. Second, there is
    a technique, which centrally involves the application of a source to an input.
    Candidate techniques, implicit in the preceding examples, include directing attention
    to one''s environment, focusing on one''s phenomenal states, reflecting on thought
    experiments, mulling over sample sentences, and so forth.


    Sources and techniques can be mixed and matched. To illustrate, reflection on
    thought experiments will utilize intuition; at other times, such reflection will
    be allied with linguistic judgments concerning “what we would say.” As this shows,
    one and the same technique can be combined with different sources, thereby yielding
    distinct procedures. Similarly, we can conjoin one source with different techniques,
    thereby creating additional procedures—as when we employ intuitions to issue a
    verdict about a thought experiment or instead to assess the plausibility of a
    general principle.


    Sources must be in good epistemic standing. For they weren''t, then reliance on
    them would fail to provide collectors with good reasons for belief, thus violating
    the structures imposed by the epistemic reasons theory of data. But reliance on
    sources in good epistemic standing is not enough to constitute a successful procedure
    for data collection. Promising sources must be utilized in tandem with promising
    techniques. While techniques may not be directly assessable for their epistemic
    merits, they can be evaluated with respect to whether they sustain, or instead
    compromise, the good epistemic standing of the source with which they are combined.


    Techniques possess a variety of properties that must factor into such evaluation:
    they can be simple or complex, efficient or inefficient, flexible or rigid, indiscriminate
    or selective. Some techniques will score well, others are bound to thwart the
    effort to gather genuine data. The candidate techniques noted above arguably fall
    on the former side of this divide: reading stars, tea leaves, or Tarot cards,
    even when aligned with a good source such as perception (of the stars, leaves,
    or cards), falls on the latter.


    In our view, there are a wide variety of legitimate combinations of sources and
    techniques (procedures), including many of those listed above. At the same time,
    we recognize, that even bracketing the epistemic doubts, different procedures
    provide reasons for belief of differing strengths. We thus affirm a discriminate
    pluralism, which recognizes multiple procedures possessing degrees of authority.
    One reason to favor this moderate position in philosophy is that philosophical
    data will probably contain both empirical and a priori elements (hence, pluralism),
    and it is plausible that some procedures will be epistemically better than others
    (hence, discriminateness).


    To illustrate our pluralism, consider the variety of data operative in recent
    debates over the nature of know-how, a paradigm example of which is knowledge
    how to dance. Gilbert Ryle famously claimed in The Concept of Mind that know-how
    is not a species of propositional knowledge, but rather a type of ability. Ryle
    is often regarded as having developed his view in light of data collected using
    reflection on ordinary language.

