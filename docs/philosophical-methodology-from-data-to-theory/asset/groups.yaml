    必须通过对方法论问题的回答来处理。接下来，我们将尝试收集第三个维度，核心是健全方法所表现出的一系列特征。这样做使我们能够仔细审视主导了当代哲学的四种方法。


    ## 2. 第三个数据


    我们识别这一特征集合的策略是间接的。我们将通过对经典和当代哲学著作的批判性审查，分离出一系列方法论倾向。这些倾向中许多是值得赞赏的，并共同构成了一个关于健全方法的多维度数据。然而，它们与某些存在问题的倾向密切相关，并很容易演变成这些问题倾向。我们的任务是将它们解耦开来。


    ### 2.1 近期哲学中的方法论趋势


    我们从一个观察开始，即哲学家们倾向于嗅出竞争理论中潜在的麻烦方面。虽然以寻求识别其局限性的方式与其他立场接触是值得赞赏的，但当这种接触导致哲学家得出其所反对的对象劣于自己的立场，而又缺乏使此类结论合理所需的比较工作时，这种接触就变得臭问题了。


    哈特·菲尔德（Hartry Field）对数学实在主义关于独立于心灵的数字存在的承诺的审查是值得赞会的，因为它正确地强调了数学实在主义者面临的严峻挑战，即解释我们如何能够理解这样被定义的数字。然而，可以认为，受菲尔德讨论启发的理论者，如果仅仅基于实在主义未能解释我们数学信念的可靠性的指控，就得出实在主义劣于反实在主义的结论，他们就走错了一步。要建立这样的结论，需要追问（例如）反实在主义是否遭受了与人们认为实在主义同样严重的问题。


    哲学探究中第二个值得赞赏的倾向是识别一个领域的核心特征，并坚持认为关于该领域的理论应该包含关于它们本质以及它们为何存在的某些见解。然而，对现象的关注有时会鼓励理论者碎片化地讨论领域的特征，将他们的分析限制在某些类型的考量上，而这些考量被处理为决定性地确立了关于该领域的某一种理论。


    莎莎·街特（Sharon Street）对规范实在主义的讨论显示了对规范思想起源的演化因素的敏感性。但当她声称这些考虑因素本身就“解决”了反对实在主义的辩论时，也面临着陷入非法诱惑的风险。毕竟，正确评估哲学理论在促进对其目标产生理解方面的优点，不仅需要考虑单一的考量或一种类型的考量，还需要考虑广泛的数据。


    > 5 Field (1989, 25–30 and 230–9; 2005)。Field 将他对实在主义的批判描述为对 Benacerraf (1973)
    提出的论点的“重构”。


    > 6 参见 Wittgenstein (1953, §593)；哲学疾病的一个主要原因——不均衡的饮食：只用一种例子来滋养思想。”


    > 7 Street (2008, 207 and 2015, 692)。


    第三种相当不同的值得赞赏的倾向是承认在面对各种挑战时捍卫自己理论的重要性。在《无处风景》（The View from Nowhere）中，托马斯·内格尔（Thomas
    Nagel）坦诚地承认并应对了反对他所支持的规范实在主义立场的几个有影响力的论点。然而，对防御必要性应当与毫无根据的假设区分开来，这种假设认为除了以连贯的方式回答此类反对意见之外，没有其他必须做的事能使人的观点比竞争理论更值得信赖。


    内格尔在告诉我们时调情了这种假设，他告诉我们不需要——事实上不能——说任何话来“使[实在主义]比替代方案更合理”，除非指出一个最初的、未经证实的“预设存在真实的价值和理由”，并注意到用于“反驳不可可能性论证”的资源。⁸
    然而，尽管可能某些信念（例如基本的感知或内省信念）在支持它们方面拥有一个令人满意的预设，但对于一个整个哲学理论（如规范实在主义）不需要任何积极支持的观点，几乎没什么什么可说的。只要一个理论提供了对某些领域或主题的真正理解——而非仅仅是（例如）一种许可的视角——它实现此点的主张必须是赢得来的，而不是预设的。


    哲学家们对核心哲学术语、概念或属性分析之间的区分具有潜在理论兴趣非常敏感——看看20世纪认识论在埃德蒙··格提尔（Edmund Gettier）对“辩护真信念是命题知识的充分条件”这一假设提出著名的反例后，对知识分析的痴迷。这种敏感性是第四种值得赞赏的倾向。但区分和分析并不是构建和评估哲学理论的全部。借用
    H. H. Price 的术语，除了“分析清晰性”之外，还有“全局清晰性”，它由“引出给定领域内各种元素之间的某些系统关系”。¹⁰ 这种关系的范式是解释，但其他的（如连贯性）也是重要的。因此，当认识论者断或假设“什么是知识？”是他们领域的主要问题时，他们不仅面临着非法贬低各种其他认识现象的风险，例如智力美德性质、认识理由和理解。他们还面临着忽视提供知识本身的全局清晰性的重要风险，包括知识与探究、智慧、专业知识和良好生活等事物所属的系统关系。


    + ⁸ Nagel (1986, 143–4)。

    ⁹ 参见 Korsgaard (1996, 41–2)，她提出了类似的担忧。


    当代哲学中的其他倾向集中在评估理论及其应得价值的标准的多样性和强度上。其中两种倾向显然值得赞赏的。第一个关于强度的倾向在于承认某些标准优于其他标准。例如，泰德·西德（Ted
    Sider）在为不存在复合对象的虚无主义假设辩护时，认可了简洁性的比较意义，理由是“虚无主义允许我们从基础理论的思想中消除‘部分’”。¹¹ 第二个关于多样性的倾向在于承认标准的多元性，例如解释力、连贯性和简单性。特别值得注意的是，大卫·刘易斯（David
    Lewis）对一系列不同标准（如与常识契合、统一性和经济）的敏感性，这体现在他维护具体实在主义合理性的尝试中。²


    ¹⁰ Price (1945, 29)。 ¹¹ Sider (2013, 240)。


    ![img/2ba9cae91083537eea95cedc8859dee2_94_0.png]

    图 5 所谓的复合对象被分解。


    ¹² Lewis (1986, 3–5 and 134–5)。另见 Lewis (1983, x–xi); 比较 Lewis and Lewis (1970,
    211–12) 和 Armstrong (1989), §1.4)。

