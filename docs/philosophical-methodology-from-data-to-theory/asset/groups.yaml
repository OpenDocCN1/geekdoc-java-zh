    # 116 The Tri-Level Method


    By diagnosing and adequately replying to objections, this sort of defense can
    buttress the positive case advanced in a primary defense, strengthening the support
    for the theory’s claims and commitments. But as this suggests, secondary defenses
    ride piggyback on primary ones: the former are not reasons for belief in the view,
    but at most bolster the reasons provided by the latter.


    We dub the call for defense and explanation of a theory’s claims and commitments
    the


    **Substantiation Criterion:** A theory of a given domain must substantiate its
    claims and commitments, or at least give an adequate defense of the claim that
    it is not required to do.


    We make four remarks about this criterion before identifying its primary rationale.


    First, the Substantiation Criterion applies to any claim or commitment made by
    a theory. Among these are ones it makes at the first level, when handling the
    data through satisfaction of the Accommodation and Explanation Criteria. But these
    are not all. The Substantiation Criterion also applies to all further claims and
    commitments enlisted by a theory at levels two and three.


    Second, satisfaction of this criterion’s escape clause can take one of two forms.
    It might involve identifying good reason to think that a theory coheres well with
    an independent set of theses that substantiate the claim or commitment in question
    (which, once more, the theory need not do this itself). Alternatively, it might
    involve providing good reason to believe that a claim or commitment requires no
    substantiation. While we were skeptical that theorists can evade the call for
    defense, they can avail themselves of the escape clause when it comes to explanation
    by citing a good reason to believe that a given claim or commitment is unexplained
    explainer. Any unfinished business—claims or commitments that have not met the
    demand set forth in this criterion—qualify as burdens of substantiation.


    Third, although we leave open the precise analysis of various aspects of the Substantiation
    Criterion, we recognize the following constraint: a theory’s explanations of its
    claims or commitments must not invoke a datum that they themselves explain, on
    pain of circularity. However, we allow that a view’s defenses of its claims and
    commitments may invoke a datum that they themselves handle. They might even invoke
    the fact that they handle it. (Such reasoning may, for instance, be part of an
    abductive defense.) Note, though, that in any scenario it would be neither the
    data nor the fact that they are being handled that alone provided the needed defense;
    additional claims, in all likelihood substantive ones (e.g., that the claim or
    commitment in question provides the best explanation of a datum), would be needed.


    Fourth, the Substantiation Criterion is similar to the criteria at level one in
    that it may be satisfied to a greater or lesser extent. As above, this point has
    two dimensions. Qualitatively, defenses and explanations can be better or worse,
    depending on the strength of the reasons they provide or the degree of illumination
    they offer. Quantitatively, we recognize that a theory of a given domain will
    ideally go on substantiating its claims and commitments until every single one
    that admits of defense and explanation is fully defended and explained, and every
    defensible and explicit claim or commitment enlisted in that enterprise is itself
    fully defended and explained, and so *ad infinitum*. However, at some point the
    claims and commitments may be so far removed from the target domain that defending
    and explaining them will not substantially further understanding of that domain.
    A theory that fails to substantiate such claims and commitments would not be ideal,
    though it may still achieve excellence.


    The rationale for the Substantiation Criterion is straightforward: a theory affords
    greater understanding of its target to the extent that it substantiates its claims
    and commitments. By defending its claims and commitments, a view becomes reason-based;
    by explaining its claims and commitments, it adds robustness and overall illumination.
    Doing these things together enhances the prospect of greater accuracy. Consider
    a view that accommodates and explains all of a domain''s data only by invoking
    a set of undefended and unexplained claims. When forced to choose between such
    a view and an alternative theory that accommodates and explains the same data
    through claims and commitments that receive defense and explanation (substantiation),
    we clearly ought to pick the latter, which will possess these four features of
    understanding to a much greater extent.


    ## 2.2 The Integration Criterion


    We turn now to the other criterion embedded in our method''s second level, which
    we call the


    **Integration Criterion:** A theory of a given domain must ensure that its claims
    and commitments integrate with each other and our best picture of the world, or
    at least give an adequate defense of the claim that such integration is unproblematic,
    where a theory T integrates with φ to, and only to, the extent that T is not just
    consistent with but coheres with. This characterization exposes one of two rationales
    for demanding integration: in its absence, a view lacks the coherence displayed
    by theories that yield understanding. The second rationale is that on the assumption
    that our best picture of the world is in good shape, integration increases the
    prospect of accuracy.


    This assumption is fairly safe given that our best picture of the world is to
    be understood in a broad and relatively non-committal way as designating a range
    of claims supported by good reasons—specifically, those uncontroversial claims
    furnished by common sense and our best physics, biology, chemistry, medicine,
    logic, and mathematics.


    Unsurprisingly, it is a complex matter to specify, at any given time, what is
    furnished by common sense. For present purposes, let''s say that a claim is so
    furnished only if it is accepted by both you and us; additionally, it is a sufficient
    condition that the claim be common ground between your family and our families.
    That lightning tends to signal rain, that tigers have stripes, that being hit
    often hurts, ![img/2ba9cae9108357eea95cedc8859dee2_126_0.png] Illustration 6 Panthera
    tigris.—most human beings know their own names—these make the cut. That a particular
    philosophical view such as libertarianism or hard determinism is true, or that
    a specific philosophical thesis such as the doctrine of double effect is correct,
    does not.


    Some philosophical views contain conflicts, thereby lacking internal integration.
    Others conflict with what is furnished by our best picture of the world, and so
    lack external integration. Whether internal or external, such conflicts do or
    not involve strict incompatibility. When they don''t, theorists may add a claim
    that resolves the tension (e.g., for forging connections between apparently discordant
    claims). When they do, theorists must provide good reason for denying that such
    conflict is problematic—per the Integration Criterion''s escape clause. Either
    strategy would relieve a theory of a burden of integration, which would otherwise
    remain.


