    unpublished treatise, *Rules for the Direction of the Mind*. Consider, in particular,
    Rules 4 and 5:


    We need a method if we are to investigate the truth of things.


    The whole method consists entirely in the ordering and arranging of the objects
    on which we must concentrate our mind''s eye if we are to discover some truth.
    We shall be following this method exactly *if we first reduce complicated and
    obscure propositions step by step to simpler ones, and then, starting with the
    intuition of the simplest ones of all, try to ascend through the same steps to
    a knowledge of the rest.*


    This model posits a structure with two main stages. However, this structure is
    the wrong sort, being narrowly focused on executing the Cartesian project of rendering
