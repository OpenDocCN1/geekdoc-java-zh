    Procedures for data collection are ways of sifting and windowing so to determine
    what does and does not qualify as a datum in the domain at hand. Examples of procedures
    that have played prominent roles in the collection of philosophical data include:


    +   - Perception of items in one''s environment

    - Introspection of one''s own phenomenal states

    - Intuitions about thought experiments

    - Linguistic judgments about the grammaticality, meaning, or truth-conditions
    of sample sentences

    - Common sense verdicts about what exists, known, etc.

    - Imagining future possibilities

    - Inductive inference from observed samples

    - Sociological observations about ordinary conversations

    - Attending to the testimony of members of marginalized or oppressed groups

    - Statistical analyses of survey results

    - Selecting, implementing, and analyzing a model of a scenario

    - Searching for the origins of a practice through archival study

    - Interpreting a text using particular hermeneutics


