    # 4


    ## The Question of Method


    We turn now to method, the engine of inquiry. While the first stage of inquiry
    consists in the collection of data, the second centers on the construction and
    evaluation of theories. We call the latter stage—the topic of this chapter and
    the next—‘theorizing.’


    Chapter 1 surveyed the three constituent elements of theorizing: its inputs, its
    outputs, and the method that takes theorists from the former to the latter. The
    inputs to method are data. The outputs of method are theories. Methods themselves
    comprise a set of criteria that serve a dual role: they provide instructions for
    the construction of a theory, given the data, while also serving as standards
    by reference to which the merits of theories are evaluated. For example, a method
    might involve criteria instructing theorists that are internally coherent, and
    simpler than rivals. These criteria would, in turn, function as means by which
    theories are assessed.


    The principal measure of a method’s success is its ability to position researchers
    to achieve inquiry’s ultimate proper goal. What we label the ''question of method''
    asks us to identify a method that will take theorists from data to a theory that
    realizes such a goal.


