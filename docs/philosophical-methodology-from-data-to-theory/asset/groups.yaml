    这种图看起来严重不完整。因为它没有告诉我们探究展开意味着什么；它仅仅观察到了它发生了。在分析探究结构时，我们需要的是对探究组成部分的洞察，以及这些组件是如何关联并构成某种特定过程的。无论“可能世界”探究模型有何种优点，它都没有提供这种洞察。


    解决方案并不是简单的假设多个阶段。例如，考虑约翰·杜伊（John Dewey）提出的五阶段探究观，它包括：


    - (i) 一种感到的困难，(ii) 困难的定位与定义，(iii) 对可能解决方案的建议，(iv) 通过推理对建议的影响的发展，(v) 进一步的观察和实验并导致对其的接受或拒绝⁵


    但一个以观察和实验为终点的过程，不足以捕捉涉及广泛理论问题的探究。我们不会通过观察和实验来解决谎言者悖论、弄清楚为什么是有而不是虚无，或者确定质数的分布——特别是如果这些是实证性的任务的话，正如杜伊所坚持的那样。


    > ⁴ Stalnaker (1984, ix), 我们可以不必担心这种图如何解释关于特定必要和本质真理的信念。


    > ⁵ Dewey (1910, 72; cp. 1938, Ch. VI)。


    # 16 探究的本质


    另一个问题困扰着笛卡尔未出版著作《心灵指导规则》（*Rules for the Direction of the Mind*）中闻名的探究模型。特别考虑规则
    4 和规则 5：


    如果我们要调查事物的真理，我们就需要一种方法。


    整个方法完全取决于如果我们要发现某些真理，对我们必须集中心智的对象进行排序和安排。如果我们能够严格遵循这种方法，*前提是我们要首先将复杂晦涩的命题逐步简化为更简单的命题，然后从最简单命题的直觉开始，尝试通过相同的步骤获得对其余部分的知识。*


    这种模型设定了一个具有两个主要阶段的结构。然而，这种结构是错误的，因为它狭隘地关注执行笛卡尔计划，即使一系列单一的思想或命题变得清晰明确。虽然这也许是理论探究的一种类型，但显然不是唯一的选择。跨科学和人文科学的探究并没有钻研到什么是“最简单”的，然后利用直觉从那里“攀升”到“对其余部分的知识”。对探究结构的描述应该是完全通用的，适用于该类型的每一个实例。


    比“可能世界”更有前景的是辩证法模型、杜伊式和笛卡尔式方法，根据这些方法，探究在于制定和澄清对开启探究问题的候选答案，然后对发展并评估支持或反对这些答案的论点。


    > ⁶ Descartes (1628/1985; 强调处为添加）。后来，在《方法论》（*Discourse on Method*）中，笛卡尔确定了他青睐方法的四个要素：证据、划分（将问题分为若干部分）、顺序（从最简单的部分开始）和穷尽（不遗漏任何部分）。我们对笛卡尔模型提出的担忧也适用于局限于发现必要或本质真理的模型（如
    Bronstein 2016 第 8 章中描述的苏格拉底式探究）。


    # 探究的结构 17


    这种模型设定了一个结构，似乎避免了前两个模型的局限性。但这种替代方案并没有公正代表探究是如何展开的，或者它旨在揭示什么。在调查谋杀案时，夏洛克·福尔斯并没有简单的列出嫌疑人——即“谁干的？”问题的候选答案——然后支持他们有罪或无罪的论点。相反，正如侦探在《红字》（*A
    Study in Scarlet*）中明确的那样，他的探究始于收集数据：


    - “你似乎对目前的问题并不在意，”我[华生]最后打断福尔斯关于音乐的论述说道。

    - “还没有数据，”他回答道，“在没有[数据]之前进行理论化是一个致命错误。”⁸


    只有在收集数据之后，侦探才追求一种解决他查询的谋杀案观点。这种观点不仅仅是某个嫌疑人有罪的命题。福尔斯可能得出一个不可辩驳的论证，其结论是莫里亚蒂教授在客厅里用一瓶毒药犯了罪，但仍然不知道莫里亚蒂是如何产生杀人心的，他是如何使用那种特定物质的，或者这一犯罪的程度与莫里亚蒂过去的行为如何匹配。通过这些方式，对福尔斯犯罪探究的辩证处理……


    > ⁷ 不同版本的辩证法模型可能会引入重要的细节，例如辩论、提问或矛盾答案的并置的作用。例如，参见 Adler (1927), Bird (1953), Gadamer
    (1960/1989), Mueller (1965), Rosen (1982), Hintikka (1999) 和 Rescher (2006)。


    > ⁸ Doyle (1887, Pt. I, Ch. III)。在《铜房奇险》（*The Adventure of the Copper Beeches*）中，福尔斯声称：“数据！数据！数据！……没有粘土造不了砖。”


    # 18 探究的本质


    ![](img/2ba9cae91083537eea95cedc8859dee2_25_0.png)

    “女仆给我们看了靴子。”插图 1 夏洛克·福尔斯。福尔斯收集数据遗漏了事业的重要维度。同样，对探究的辩证处理错过了或模糊了数据的作用，而数据对于广泛的领域——生物学、经济学和宗教哲学（回想我们上面的例子）是基础性的。辩证法模型也扭曲了处理数据的项目。后者超越了单纯的论点提供：正如我们在引言中提到的，论点的结论并不能说明。因此，尽管辩证法模型描述了一项可能发挥作用的活动，但它绝不是故事的全貌。


    # 探究的结构 19


    这让我们回到我们提议的模型。有几个理由倾向于一个包含我们区分的两个探究阶段（数据收集和理论化）的模型。


    首先，这样做为“探究在于旨在提供理论的反思过程”这一观点提供了实质性的精确化。我们的模型打开了这个黑箱，不仅识别了起点和终点，还识别了引导探究者从前者转向后者的过程中的两个阶段。


    其次，这样做同时避免了局限性。我们的模型识别了两个阶段，这两个阶段本身并不强制要求承诺任何类似于笛卡尔计划或杜伊实验主义的东西。阶段也没有禁止任何一种。相反，我们的模型代表了任何学派、进入任何主题的探究者，从开启问题到掌握解决该问题的理论的步骤。


    第三，一个强调数据和理论化的模型能够很好地解释探究的深度和广度。这两个特征在我们对辩证法的讨论中都有体现，该讨论指出探究可能包含但不局限于论点的提供。如果探究在于构建一个处理可能广泛的考量（数据）的理论（理论化），那么这正是我们所应该预期的。


    第四，我们的模型解释了引言中提到的一个成功条件：理论只有在处理了数据（其输入）时才是成功的。它还解释了


    > 9 在两篇关于哲学方法的、丰富但被忽视的文章中，Collingwood (1933, Ch. VIII) 和 Castañeda (1980, 各处*)
    也强调了数据收集和理论化的重要性。然而，他们都没有将其视为探究的两个基本阶段，而且他们对每个者的构想与我们显著不同。


