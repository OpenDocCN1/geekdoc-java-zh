    ## 132 三级法 (The Tri-Level Method)


    未能承担的负担——这些剩余部分表明，该理论在对其研究对象提供理论理解方面存在很大缺陷。


    此外，三级法指示理论学家尽可能良好且完善地构建他们的观点，而不是简单地与竞争对手进行争论和反驳——这种情况在理论学家仅仅转嫁举证责任，或固着于给定辩证法内部可接受的操作时经常发生。虽然论证和对反对的回应有其地位（作为防御的一部分），但该方法赞赏那些能够涵盖并解释数据，并证实和整合自身主张与承诺的理论（或者，相反，充分辩护其无需做其中一项或多项这些事的主张）。重要的是，完成这一切不仅仅是一项比较性的尝试，因为它并不意味着理论学家们（无论是二元论、同一性理论还是其他观点的支持者）仅仅通过证明自己的主张优于竞争理论，来支持自己的主张、承诺和论证策略。它也不包括理论学家们回头顾及对手，去罗列并回应他们可能提出的反对。这还不是订阅者证明其观点表现出竞争性立场所不具备的理论美德的问题。通过这种方式，该方法指示哲学家不要关注其他理论，而是首要处理数据。¹⁸
