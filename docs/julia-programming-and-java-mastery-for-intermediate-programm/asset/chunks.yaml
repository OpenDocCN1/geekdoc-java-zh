    \ 回调函数，并在控制台上打印一条消息。Gtk 主循环被用来处理 GUI 事件和交互。\n\n### 创建复杂的 GUI\n`Gtk.jl` 允许你创建带有各种各种组件的复杂\
    \ GUI 应用程序，包括按钮、标签、文本框等。你可以设计多窗口应用程序、实现菜单并自定义 GUI 的外观。\n\n```julia\nusing Gtk\n\
    \n# 创建一个新应用程序\napp = Gtk.Application()\n\n# 创建一个主窗口\nmain_window = Gtk.Window(app,\
    \ \"Julia GUI App\")\n\n# 创建一个用于组件的容器\nbox = Gtk.Box(:v)\n\n# 创建一个标签\nlabel =\
    \ Gtk.Label(\"Hello, Julia GUI!\")\n\n# 创建一个按钮\nbutton = Gtk.Button(\"Click me!\"\
    )\n\n# 为按钮创建回调\nfunction on_button_clicked(btn)\n  set_gtk_property!(label, :label,\
    \ \"Button clicked!\")\nend\n\n# 将按钮点击事件连接到回调\nsignal_connect(button, :clicked,\
    \ on_button_clicked)\n\n# 将组件添加到框中\nappend!(box, label)\nappend!(box, button)\n\
    \n# 将框设置为主窗口的子\nset_gtk_property!(main_window, :child, box)\n\n# 显示所有元素\nshowall(app)\n\
    \n# 运行 Gtk 主循环\nrun(app)\n```\n在此示例中，我们创建了一个包含标签和按钮的较复杂的 GUI。当按钮被点击时，标签的内容将进行更新。这段代码展示了如何在容器（box）中排列组件并将组件事件连接到回调函数。\n\
    \n## 部署 GUI 应用程序\n一旦开发了 GUI 应用程序，你可能希望将其部署给用户。Julia 提供了创建应用程序的可执行二进制文件的选项，方便分发给他人。\n\
    \n### 使用 `PackageCompiler`\n`PackageCompiler.jl` 包允许你创建包含所有依赖的独立 Julia 应用程序，适用于\
    \ GUI 应用程序。\n\n```julia\nusing PackageCompiler\n\n# 创建包含所需包的镜像\ncreate_sysimage(\n\
    \  [\"Gtk\", \"Cairo\", \"Fontconfig\", \"Glib\"],\n  sysimage_path=\"my_app_sysimage.so\"\
    ,\n)\n\n# 使用 sysimage 编译应用程序\ncompile_executable(\"my_app.jl\", \"my_app\", sysimage=\"\
    my_app_sysimage.so\")\n```\n该代码使用包含所需包的自定义镜像将 Julia 脚本 (`my_app.jl`) 编译为独立的可执行文件\
    \ (`my_app`)。\n\n"
