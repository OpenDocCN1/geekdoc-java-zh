    \ 以其多重分发（multiple dispatch）系统而闻名，该系统允许函数根据参数的类型具有不同的实现。这种特征被称为方法分发，让你能够编写通用且高效的代码。\n\
    \n### 方法分发\n\n在 Julia 中，函数可以有多个方法，每个方法对应一组不同的参数类型。当你调用一个函数时，Julia 会根据参数类型分发到最具体的方法，以确保执行正确的实现。\n\
    \n以下是方法分发的一个示例：\n\n```julia\n# 定义一个针对整数的 add 函数\nfunction add(a::Int, b::Int)\n\
