    \ 函数——一个针对整数，另一个针对浮点数。Julia 会根据参数类型自动分发到相应的方法。\n\n### 通用函数\n\nJulia 的多重分发系统允许你创建适用于各种数据类型的通用函数。你可以定义一个函数，它根据参数的类型以不同的方式运行。\n\
    \n以下是一个通用 `add` 函数的示例：\n\n```julia\n# 定义一个可以处理各种类型的通用 add 函数\nfunction add(a,\
