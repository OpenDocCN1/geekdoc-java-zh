- fmt: "\nBy understanding file handling and I/O operations, you can effectively manage\
    \ data, process information from files, and build robust and reliable applications.\
    \ As we progress through the book, we will explore more advanced topics related\
    \ to file handling and I/O, along with real-world use cases to further enhance\
    \ your programming skills.\n\n# Chapter 8: Collections and Generics\n\nCollections\
    \ and generics are powerful concepts in programming that enable the efficient\
    \ storage and manipulation of groups of elements and provide type safety for data\
    \ structures. Collections offer a wide range of data structures, such as lists,\
    \ sets, maps, and queues, to accommodate different data storage and retrieval\
    \ needs. Generics, on the other hand, ensure type safety by enabling the use of\
    \ parameterized types in classes and methods. In this chapter, we will explore\
    \ collections and generics in both Java and Python, along with practical examples\
    \ to demonstrate their usage.\n\n## Section 1: Collections in Java\n\n### ArrayList\n\
    \n`ArrayList` is a dynamic array-based implementation of the `List` interface\
    \ that can grow and shrink dynamically as elements are added or removed.\n\n**Java\
    \ Example:**\n\n```java\nimport java.util.ArrayList;\n\npublic class ArrayListExample\
    \ {\n\n    public static void main(String[] args) {\n        // Creating an ArrayList\
    \ of integers\n        ArrayList<Integer> numbers = new ArrayList<>();\n\n   \
    \     // Adding elements to the ArrayList\n        numbers.add(10);\n        numbers.add(20);\n\
    \        numbers.add(30);\n\n        // Accessing elements from the ArrayList\n\
    \        System.out.println(\"First element: \" + numbers.get(0));\n\n       \
    \ // Removing an element from the ArrayList\n        numbers.remove(1);\n    \
    \    System.out.println(\"After removal: \" + numbers);\n    }\n}\n```\n\n###\
    \ HashSet\n\n`HashSet` is an implementation of the `Set` interface that uses a\
    \ hash table to store unique elements, ensuring that duplicates are not allowed.\n\
    \n**Java Example:**\n\n```java\nimport java.util.HashSet;\n\npublic class HashSetExample\
    \ {\n\n    public static void main(String[] args) {\n        // Creating a HashSet\
    \ of strings\n        HashSet<String> names = new HashSet<>();\n\n        // Adding\
    \ elements to the HashSet\n        names.add(\"Alice\");\n        names.add(\"\
    Bob\");\n        names.add(\"Alice\"); // Duplicate, not added\n\n        // Accessing\
    \ elements from the HashSet\n        System.out.println(\"Set size: \" + names.size());\n\
    \n        // Removing an element from the HashSet\n        names.remove(\"Bob\"\
    );\n        System.out.println(\"After removal: \" + names);\n    }\n}\n```\n\n\
    ### HashMap\n\n`HashMap` is an implementation of the `Map` interface that stores\
    \ key-value pairs and allows fast retrieval of values based on their keys.\n\n\
    **Java Example:**\n\n```java\nimport java.util.HashMap;\n\npublic class HashMapExample\
    \ {\n\n    public static void main(String[] args) {\n        // Creating a HashMap\
    \ of integers (ID -> Name)\n        HashMap<Integer, String> students = new HashMap<>();\n\
    \n        // Adding key-value pairs to the HashMap\n        students.put(1, \"\
    Alice\");\n        students.put(2, \"Bob\");\n        students.put(3, \"Charlie\"\
    );\n\n        // Accessing values from the HashMap using keys\n        System.out.println(\"\
    Name of student with ID 2: \" + students.get(2));\n\n        // Removing a key-value\
    \ pair from the HashMap\n        students.remove(1);\n        System.out.println(\"\
    After removal: \" + students);\n    }\n}\n```\n\n## Section 2: Collections in\
    \ Python\n\n### List\n\n`List` is a dynamic array-based data structure in Python\
    \ that can hold elements of different types and can grow or shrink dynamically.\n\
    \n**Python Example:**\n\n```python\n# Creating a list of integers\nnumbers = [10,\
    \ 20, 30]\n\n# Accessing elements from the list\nprint(\"First element:\", numbers[0])\n\
    \n# Adding elements to the list\nnumbers.append(40)\nnumbers.insert(1, 15)\n\n\
    # Removing an element from the list\nnumbers.remove(20)\nprint(\"After removal:\"\
    , numbers)\n```\n\n### Set\n\n`Set` is an unordered collection of unique elements\
    \ in Python, and it is particularly useful for removing duplicates from a list.\n\
    \n**Python Example:**\n\n```python\n# Creating a set of strings\nnames = {\"Alice\"\
    , \"Bob\", \"Alice\"} # Duplicate, not added\n\n# Accessing elements from the\
    \ set\nprint(\"Set size:\", len(names))\n\n# Adding elements to the set\nnames.add(\"\
    Charlie\")\n\n# Removing an element from the set\nnames.remove(\"Bob\")\nprint(\"\
    After removal:\", names)\n```\n\n### Dictionary\n\n`Dictionary` is an associative\
    \ data structure in Python that stores key-value pairs, allowing efficient retrieval\
    \ of values based on their keys.\n\n**Python Example:**\n\n```python\n# Creating\
    \ a dictionary of integers (ID -> Name)\nstudents = {1: \"Alice\", 2: \"Bob\"\
    , 3: \"Charlie\"}\n\n# Accessing values from the dictionary using keys\nprint(\"\
    Name of student with ID 2:\", students.get(2))\n\n# Adding a key-value pair to\
    \ the dictionary\nstudents[4] = \"Dave\"\n\n# Removing a key-value pair from the\
    \ dictionary\ndel students[1]\nprint(\"After removal:\", students)\n```\n\n##\
    \ Section 3: Generics in Java\n\nGenerics in Java enable the creation of parameterized\
    \ classes, interfaces, and methods that can work with different data types while\
    \ ensuring type safety.\n\n### Generic Classes\n\n**Java Example:**\n\n```java\n\
    public class Box<T> {\n    private T content;\n\n    public Box(T content) {\n\
    \        this.content = content;\n    }\n\n    public T getContent() {\n     \
    \   return content;\n    }\n\n    public void setContent(T content) {\n      \
    \  this.content = content;\n    }\n\n    public static void main(String[] args)\
    \ {\n        Box<Integer> integerBox = new Box<>(10);\n        Box<String> stringBox\
    \ = new Box<>(\"Hello\");\n\n        Integer intValue = integerBox.getContent();\n\
    \        String stringValue = stringBox.getContent();\n\n        System.out.println(\"\
    Integer value: \" + intValue);\n        System.out.println(\"String value: \"\
    \ + stringValue);\n    }\n}\n```\n\n### Generic Methods\n\n**Java Example:**\n\
    \n```java\npublic class ArrayUtil {\n    public static <T> void printArray(T[]\
    \ array) {\n        for (T element : array) {\n            System.out.print(element\
    \ + \" \");\n        }\n        System.out.println();\n    }\n\n    public static\
    \ void main(String[] args) {\n        Integer[] intArray = {1, 2, 3, 4, 5};\n\
    \        String[] stringArray = {\"A\", \"B\", \"C\"};\n\n        printArray(intArray);\n\
    \        printArray(stringArray);\n    }\n}\n```\n\n## Section 4: Generics in\
    \ Python\n\nPython does not have explicit syntax for generics like Java, but it\
    \ supports type hints using the `typing` module.\n\n**Python Example:**\n\n```python\n\
    from typing import TypeVar, List\n\nT = TypeVar('T')\n\nclass Box:\n    def __init__(self,\
    \ content: T):\n        self.content = content\n\n    def get_content(self) ->\
    \ T:\n        return self.content\n\n    def set_content(self, content: T):\n\
    \        self.content = content\n\ninteger_box = Box(10)\nstring_box = Box(\"\
    Hello\")\n\nint_value = integer_box.get_content()\nstring_value = string_box.get_content()\n\
    \nprint(\"Integer value:\", int_value)\nprint(\"String value:\", string_value)\n\
    ```\n\n## Section 5: Advantages of Collections and Generics\n\n### Collections\
    \ Advantages\n\n- Collections offer various data structures for different storage\
    \ and retrieval needs.\n- They provide efficient operations for adding, removing,\
    \ and searching elements.\n- Collections facilitate better organization and manipulation\
    \ of data.\n\n### Generics Advantages\n\n- Generics ensure type safety by enabling\
    \ parameterized types in classes and methods.\n- They allow developers to create\
    \ reusable and flexible code that works with different data types.\n- Generics\
    \ help prevent runtime errors by detecting type mismatches at compile-time.\n"
