    \n## 可选参数与关键字参数\n\nJulia 允许定义带有可选参数和关键字参数的函数，增强了函数的灵活性。\n\n### 可选参数\n\n可选参数是在调用函数时不需要提供值的参数。你可以为这些参数指定默认值，如果未提供，将使用默认值。\n\
    \n以下是一个带有可选参数的示例：\n\n```julia\n# 定义一个带有可选参数的函数\nfunction greet(name, greeting=\"\
