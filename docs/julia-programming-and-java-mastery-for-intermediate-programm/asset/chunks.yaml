    # **Chapter 6: Exception Handling**


    Exception handling is a vital aspect of programming that allows developers to
    deal with unexpected or erroneous situations gracefully. Exceptions are raised
    when an error occurs during program execution, and proper handling of these exceptions
    can prevent program crashes and provide useful information to developers for debugging.
    In this chapter, we will explore exception handling in both Java and Python, along
    with practical examples to demonstrate how to handle various types of exceptions.


    ## Section 1: The Basics of Exception Handling


    ### Exception Class Hierarchy


    In both Java and Python, exceptions are organized in a class hierarchy. The base
    class is typically named `Exception`, and various specific exceptions are derived
    from it. This hierarchy allows developers to handle exceptions more effectively
    based on their types.


    ### Java Example:


    ```java


    try {


    // Code that may raise an exception


    } catch (Exception e) {


    // Exception handling code


    }


    ```


    ### Python Example:


    ```python


    try:


    # Code that may raise an exception


    except Exception as e:


    # Exception handling code


    ```


    ## Section 2: Handling Specific Exceptions


    Both Java and Python allow developers to handle specific exceptions individually
    or in groups.


    ### Java Example:


    ```java


    try {


    int result = divide(10, 0);


    System.out.println("Result: " + result);


    } catch (ArithmeticException e) {


    System.out.println("Cannot divide by zero.");


    } catch (Exception e) {


    System.out.println("An unexpected error occurred.");


    }


    ```


    ### Python Example:


    ```python


    try:


    result = divide(10, 0)


    print("Result:", result)


    except ZeroDivisionError:


    print("Cannot divide by zero.")


    except Exception as e:


    print("An unexpected error occurred.")


    ```


    ## Section 3: The Finally Block


    Both Java and Python provide a `finally` block that executes regardless of whether
    an exception is raised or not. This block is used for cleanup activities, such
    as closing files or releasing resources.


    ### Java Example:


    ```java


    try {


    // Code that may raise an exception


    } catch (Exception e) {


    // Exception handling code


    } finally {


    // Cleanup code (always executed)


    }


    ```


    ### Python Example:


    ```python


    try:


    # Code that may raise an exception


    except Exception as e:


    # Exception handling code


    finally:


    # Cleanup code (always executed)


    ```


    ## Section 4: Raising Exceptions


    In both Java and Python, developers can raise exceptions manually using the `throw`
    keyword (Java) or the `raise` statement (Python). This is useful for signaling
    specific errors or situations in the code.


    ### Java Example:


    ```java


    public void processAge(int age) throws InvalidAgeException {


    if (age < 0) {


    throw new InvalidAgeException("Age cannot be negative.");


    }


    // Code to process the age


    }


    ```


    ### Python Example:


    ```python


    def process_age(age):


    if age < 0:


    raise ValueError("Age cannot be negative.")


    # Code to process the age


    ```


    ## Section 5: Custom Exceptions


    Developers can create custom exception classes to handle specific scenarios that
    are not covered by the built-in exceptions.


    ### Java Example:


    ```java


    public class CustomException extends Exception {


    public CustomException(String message) {


    super(message);


    }


    }


    // Usage


    try {


    if (someCondition) {


    throw new CustomException("Custom error message.");


    }


    } catch (CustomException e) {


    // Custom exception handling code


    }


    ```


    ### Python Example:


    ```python


    class CustomException(Exception):


    def __init__(self, message):


    super().__init__(message)


    # Usage


    try:


    if some_condition:


    raise CustomException("Custom error message.")


    except CustomException as e:


    # Custom exception handling code


    ```


    ## Section 6: Nested Exception Handling


    Both Java and Python support nested exception handling, where exceptions can be
    caught at different levels of the code.


