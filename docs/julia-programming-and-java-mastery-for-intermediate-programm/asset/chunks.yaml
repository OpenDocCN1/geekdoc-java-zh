    # **Chapter 7: File Handling and I/O Operations**


    File handling and Input/Output (I/O) operations are essential aspects of programming
    that involve reading data from files, writing data to files, and performing various
    operations on files. File handling enables programs to store and retrieve data
    persistently, making it crucial for tasks like data storage, configuration, and
    data processing. In this chapter, we will delve into file handling and I/O operations
    in both Java and Python, with practical examples to demonstrate how to work with
    files effectively.


    ## Section 1: File Handling in Python


    ### Opening and Closing Files


    In Python, files can be opened using the `open()` function, and they should be
    properly closed after processing using the `close()` method.


    **Python Example:**


    ```python


    # Opening a file in write mode


    file = open("data.txt", "w")


    # Writing data to the file


    file.write("Hello, world!\n")


    file.write("This is a sample text.\n")


    # Closing the file


    file.close()


    ```


    ### Reading Data from Files


    Data can be read from files using different modes: "r" (read), "w" (write), "a"
    (append), "r+" (read and write), etc.


    **Python Example:**


    ```python


    # Opening a file in read mode


    file = open("data.txt", "r")


    # Reading data from the file


    content = file.read()


    print(content)


    # Closing the file


    file.close()


    ```


    ### Reading Line by Line


    Files can be read line by line using the `readline()` method.


    **Python Example:**


    ```python


    # Opening a file in read mode


    file = open("data.txt", "r")


    # Reading data line by line


    line1 = file.readline()


    line2 = file.readline()


    print(line1)


    print(line2)


    # Closing the file


    file.close()


    ```


    ## Section 2: File Handling in Java


    ### Reading and Writing Files


    In Java, file handling involves using classes like `File`, `FileReader`, `FileWriter`,
    `BufferedReader`, and `BufferedWriter` to perform file operations.


    **Java Example:**


    ```java


    import java.io.File;


    import java.io.FileReader;


    import java.io.FileWriter;


    import java.io.BufferedReader;


    import java.io.BufferedWriter;


    import java.io.IOException;


    public class FileHandler {


    public static void main(String[] args) {


    try {


    // Writing data to a file


    FileWriter writer = new FileWriter("data.txt");


    writer.write("Hello, world!\n");


    writer.write("This is a sample text.\n");


    writer.close();


    // Reading data from a file


    FileReader reader = new FileReader("data.txt");


    BufferedReader bufferedReader = new BufferedReader(reader);


    String line;


    while ((line = bufferedReader.readLine()) != null) {


    System.out.println(line);


    }


    bufferedReader.close();


    reader.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 3: File Modes and Exception Handling


    ### File Modes in Python


    In Python, the `open()` function can be used with different modes for reading,
    writing, and appending to files.


    **Python Example:**


    ```python


    # Reading from a file


    with open("data.txt", "r") as file:


    content = file.read()


    print(content)


    # Writing to a file (existing content will be overwritten)


    with open("data.txt", "w") as file:


    file.write("Hello, world!\n")


    # Appending to a file (data will be added at the end)


    with open("data.txt", "a") as file:


    file.write("This is a sample text.\n")


    ```


    ### File Exception Handling in Java


    In Java, file handling can raise exceptions, such as `IOException`, which should
    be properly handled using try-catch blocks.


    **Java Example:**


    ```java


    import java.io.File;


    import java.io.FileReader;


    import java.io.FileWriter;


    import java.io.BufferedReader;


    import java.io.BufferedWriter;


    import java.io.IOException;


    public class FileHandler {


    public static void main(String[] args) {


    try {


    // Writing data to a file


    FileWriter writer = new FileWriter("data.txt");


    writer.write("Hello, world!\n");


    writer.close();


    // Reading data from a file


    FileReader reader = new FileReader("data.txt");


    BufferedReader bufferedReader = new BufferedReader(reader);


    String line;


    while ((line = bufferedReader.readLine()) != null) {


    System.out.println(line);


    }


    bufferedReader.close();


    reader.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 4: Working with Directories


    Both Python and Java provide functionality to work with directories (folders),
    including creating, deleting, and navigating through directories.


    ### Directory Operations in Python


    **Python Example:**


    ```python


    import os


    # Create a directory


    os.mkdir("my_folder")


    # Check if a directory


    exists


    if os.path.exists("my_folder"):


    print("my_folder exists.")


    # Change current directory


    os.chdir("my_folder")


    # Get current directory


    print("Current directory:", os.getcwd())


    # List files in a directory


    files = os.listdir()


    print("Files in current directory:", files)


    # Change back to the parent directory


    os.chdir("..")


    # Remove the directory


    os.rmdir("my_folder")


    ```


    ### Directory Operations in Java


    **Java Example:**


    ```java


    import java.io.File;


    public class DirectoryHandler {


    public static void main(String[] args) {


    // Create a directory


    File dir = new File("my_folder");


    if (dir.mkdir()) {


    System.out.println("my_folder created.");


    }


    // Check if the directory exists


    if (dir.exists()) {


    System.out.println("my_folder exists.");


    }


    // Change current directory


    if (dir.isDirectory()) {


    System.setProperty("user.dir", dir.getAbsolutePath());


    }


    // Get current directory


    System.out.println("Current directory: " + System.getProperty("user.dir"));


    // List files in the current directory


    File[] files = dir.listFiles();


    System.out.println("Files in current directory:");


    for (File file : files) {


    System.out.println(file.getName());


    }


    // Change back to the parent directory


    File parentDir = dir.getParentFile();


    System.setProperty("user.dir", parentDir.getAbsolutePath());


    // Remove the directory


    if (dir.delete()) {


    System.out.println("my_folder deleted.");


    }


    }


    }


    ```


    ---


    This chapter covered file handling and I/O operations in both Java and Python,
    emphasizing their importance in data storage, retrieval, and processing tasks.
    Proper file handling ensures data persistence and enables programs to work with
    external files for configuration and data management purposes.


    Both Python and Java offer similar functionalities for working with files and
    directories, such as opening and closing files, reading and writing data, and
    performing operations on directories. The examples provided demonstrate common
    file handling scenarios, along with proper exception handling to deal with potential
    errors during I/O operations.'
