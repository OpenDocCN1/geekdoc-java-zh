    ## Section 3: Executing SQL Queries


    ### Executing Statements


    Once the database connection is established, you can create a `Statement` object
    to execute SQL queries.


    **Example:**


    ```java


    import java.sql.*;


    public class SQLQueryExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "SELECT * FROM employees";


    ResultSet resultSet = statement.executeQuery(sql);


    while (resultSet.next()) {


    String name = resultSet.getString("name");


    int age = resultSet.getInt("age");


    System.out.println("Name: " + name + ", Age: " + age);


    }


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error executing SQL query: " + e.getMessage());


    }


    }


    }


    ```


    ### Prepared Statements


    Prepared statements are a more efficient way to execute SQL queries, especially
    for parameterized queries.


    **Example:**


    ```java


    import java.sql.*;


    public class PreparedStatementExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    String sql = "INSERT INTO employees (name, age) VALUES (?, ?)";


    PreparedStatement statement = connection.prepareStatement(sql);


    statement.setString(1, "John");


    statement.setInt(2, 30);


    statement.executeUpdate();


    statement.setString(1, "Alice");


    statement.setInt(2, 28);


    statement.executeUpdate();


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error executing prepared statement: " + e.getMessage());


    }


    }


    }


    ```


    ## Section 4: Database Operations


    ### Inserting Data


    To insert data into a database, you can use an SQL `INSERT` statement.


    **Example:**


    ```java


    import java.sql.*;


    public class InsertDataExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "INSERT INTO employees (name, age) VALUES (''John'', 30)";


    int rowsAffected = statement.executeUpdate(sql);


    System.out.println(rowsAffected + " row(s) inserted.");


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error inserting data: " + e.getMessage());


    }


    }


    }


    ```


    ### Updating Data


    To update existing data in a database, you can use an SQL `UPDATE` statement.


    **Example:**


    ```java


    import java.sql.*;


    public class UpdateDataExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "UPDATE employees SET age = 31 WHERE name = ''John''";


    int rowsAffected = statement.executeUpdate(sql);


    System.out.println(rowsAffected + " row(s) updated.");


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error updating data: " + e.getMessage());


    }


    }


    }


    ```


    ### Deleting Data


    To delete data from a database, you can use an SQL `DELETE` statement.


    **Example:**


    ```java


    import java.sql.*;


    public class DeleteDataExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "DELETE FROM employees WHERE name = ''John''";


    int rowsAffected = statement.executeUpdate(sql);


    System.out.println(rowsAffected + " row(s) deleted.");


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error deleting data: " + e.getMessage());


    }


    }


    }


    ```


    ## Conclusion


    JDBC provides a powerful and standardized way to connect to and interact with
    relational databases in Java applications. In this chapter, we explored the fundamentals
    of JDBC, including connecting to databases, executing SQL queries using statements
    and prepared statements, and performing common database operations such as inserting,
    updating, and deleting data. Armed with this knowledge, you can efficiently work
    with databases in your Java applications and build robust and data-driven software
    systems.


    # **Chapter 14: Web Development with Java Servlets**


    Java Servlets are an essential part of web development using Java. Servlets provide
    a server-side solution for handling HTTP requests and generating dynamic content
    on the web. In this chapter, we will explore the fundamentals of Java Servlets,
    including handling HTTP methods, working with request and response objects, session
    management, and practical examples to demonstrate how to build web applications
    using Servlets.


    ## Section 1: Introduction to Java Servlets


    ### What are Java Servlets?


    Java Servlets are Java classes that run on the server-side to handle HTTP requests
    and produce dynamic content for web applications.


    ### Servlet Lifecycle


    Servlets follow a lifecycle with methods like `init()`, `service()`, and `destroy()`.


    ## Section 2: Setting Up a Servlet


    ### Servlet Configuration in web.xml


    Servlets need to be configured in the `web.xml` deployment descriptor.


    **Example: web.xml**


    ```xml


    <?xml version="1.0" encoding="UTF-8"?>


    <web-app xmlns="http://java.sun.com/xml/ns/javaee"


    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"


    xsi:schemaLocation="http://java.sun.com/xml/ns/javaee


    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd"


    version="3.0">


    <servlet>


    <servlet-name>HelloServlet</servlet-name>


    <servlet-class>com.example.HelloServlet</servlet-class>


    </servlet>


    <servlet-mapping>


    <servlet-name>HelloServlet</servlet-name>


    <url-pattern>/hello</url-pattern>


    </servlet-mapping>


    </web-app>


    ```


    ### Creating a Simple Servlet


    **Example: HelloServlet.java**


    ```java


    package com.example;


    import javax.servlet.*;


    import java.io.IOException;


    public class HelloServlet implements Servlet {


    @Override


    public void init(ServletConfig config) throws ServletException {


    // Initialization code


    }


    @Override


    public void service(ServletRequest req, ServletResponse res) throws ServletException,
    IOException {


    res.setContentType("text/html");


    res.getWriter().println("<html><body><h1>Hello, Servlet!</h1></body></html>");


    }


    @Override


    public void destroy() {


    // Cleanup code


    }


    @Override


    public ServletConfig getServletConfig() {


    return null;


    }


    @Override


    public String getServletInfo() {


    return null;


    }


    }


    ```


    ## Section 3: Handling HTTP Methods


    ### HTTP GET Method


    Servlets can handle GET requests using the `doGet()` method.


