    \        animal1.makeSound(); // Output: Dog barks\n        animal2.makeSound();\
    \ // Output: Cat meows\n    }\n}\n```\n\n### Python Example:\n```python\n# Polymorphism\
    \ in Python\nanimals = [Dog(), Cat()]\nfor animal in animals:\n    animal.make_sound()\n\
    # Output:\n# Dog barks\n# Cat meows\n```\n\n## Section 4: Encapsulation\n\nEncapsulation\
    \ is the principle of hiding the internal implementation details of a class and\
