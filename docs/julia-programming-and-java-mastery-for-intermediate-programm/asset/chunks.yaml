    \ `Dog` and `Cat` classes inherit from the `Animal` class. This means that we\
    \ can treat objects of `Dog` and `Cat` as objects of the `Animal` class.\n\n###\
    \ Java Example:\n```java\npublic class Main {\n    public static void main(String[]\
