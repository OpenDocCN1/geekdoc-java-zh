  trans: "\n\n对象是类的实例，代表一个特定的实体。它有自己独特的状态（数据）和行为（方法）。在 Java 和 Python 中创建对象，我们使用类的构造函数。\n\
    \n### Java 示例：\n```java\n// Creating a Car object\nCar car1 = new Car(\"Toyota\"\
