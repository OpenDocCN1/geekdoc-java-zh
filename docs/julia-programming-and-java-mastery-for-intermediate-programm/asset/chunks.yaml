    System.out.println("Consumer is consuming data...");


    } catch (InterruptedException e) {


    e.printStackTrace();


    }


    }


    });


    producer.start();


    consumer.start();


    }


    }


    ```


    ## Section 7: Thread Safety


    ### Thread Safety in Java


    Thread safety refers to the ability of a program to perform correctly and safely
    in a multithreaded environment.


    ### Immutable Objects


    Immutable objects are inherently thread-safe as their state cannot be modified
    after creation.


    **Example:**


    ```java


    public final class ImmutablePoint {


    private final int x;


    private final int y;


    public ImmutablePoint(int x, int y) {


    this.x = x;


    this.y = y;


    }


    public int getX() {


    return x;


    }


    public int getY() {


    return y;


    }


    }


    ```


    ## Conclusion


    Concurrency is a crucial aspect of modern programming, and Java provides powerful
    tools and APIs to manage threads and concurrent programming effectively.


    # **Chapter 11: Networking with Java**


    Networking is an essential part of modern applications, enabling communication
    between different devices and systems over the internet. Java provides robust
    networking capabilities through its networking APIs, allowing developers to create
    client-server applications, transfer data, and communicate across networks. In
    this chapter, we will explore the fundamentals of networking in Java, covering
    socket programming, URL handling, and HTTP communication, with practical examples
    to demonstrate how to build networked applications.


    ## Section 1: Introduction to Networking in Java


    ### What is Networking?


    Networking involves the communication between different devices or systems over
    a network, such as the internet or an intranet.


    ### Java Networking API


    Java provides a comprehensive set of classes and interfaces in the `java.net`
    package to facilitate network programming.


    ### Client-Server Model


    The client-server model is a common networking architecture where one device (the
    client) requests services from another device (the server).


    ## Section 2: Socket Programming


    ### Understanding Sockets


    Sockets are the endpoints for communication between two devices over a network.
    In Java, socket programming enables the establishment of connections and data
    transfer between client and server applications.


    ### Socket Types


    Java supports two types of sockets: client sockets and server sockets. Client
    sockets initiate connections to servers, while server sockets listen for incoming
    client connections.


    ### Client Socket Example


    **Example: Client.java**


    ```java


    import java.io.*;


    import java.net.*;


    public class Client {


    public static void main(String[] args) {


    try {


    Socket clientSocket = new Socket("localhost", 1234);


    PrintWriter out = new PrintWriter(clientSocket.getOutputStream(), true);


    BufferedReader in = new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));


    out.println("Hello, server!");


    String response = in.readLine();


    System.out.println("Server response: " + response);


    clientSocket.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ### Server Socket Example


    **Example: Server.java**


    ```java


    import java.io.*;


    import java.net.*;


    public class Server {


    public static void main(String[] args) {


    try {


    ServerSocket serverSocket = new ServerSocket(1234);


    System.out.println("Server is listening on port 1234...");


    Socket clientSocket = serverSocket.accept();


    PrintWriter out = new PrintWriter(clientSocket.getOutputStream(), true);


    BufferedReader in = new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));


    String message = in.readLine();


    System.out.println("Received from client: " + message);


    out.println("Hello, client!");


    clientSocket.close();


    serverSocket.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 3: URL Handling


    ### Working with URLs


    URLs (Uniform Resource Locators) are used to identify resources on the internet
    or intranet.


    ### URL Class


    Java provides the `URL` class in the `java.net` package to work with URLs.


    **Example:**


    ```java


    import java.net.*;


    public class URLExample {


    public static void main(String[] args) {


    try {


    URL url = new URL("https://www.example.com/index.html");


    System.out.println("Protocol: " + url.getProtocol());


    System.out.println("Host: " + url.getHost());


    System.out.println("Port: " + url.getPort());


    System.out.println("Path: " + url.getPath());


    } catch (MalformedURLException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 4: HTTP Communication


    ### HTTP Basics


    HTTP (Hypertext Transfer Protocol) is the foundation of data communication on
    the internet.


    ### HttpURLConnection Class


    Java provides the `HttpURLConnection` class in the `java.net` package for making
    HTTP requests and processing responses.


    **Example:**


    ```java


    import java.io.*;


    import java.net.*;


    public class HTTPExample {


    public static void main(String[] args) {


    try {


    URL url = new URL("https://api.example.com/data");


    HttpURLConnection conn = (HttpURLConnection) url.openConnection();


    conn.setRequestMethod("GET");


    int responseCode = conn.getResponseCode();


    System.out.println("Response Code: " + responseCode);


    BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));


    String inputLine;


    StringBuffer response = new StringBuffer();


    while ((inputLine = in.readLine()) != null) {


    response.append(inputLine);


    }


    in.close();


    System.out.println("Response Data: " + response.toString());


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 5: DatagramSocket and DatagramPacket


    ### UDP Communication


    UDP (User Datagram Protocol) is a connectionless protocol for sending and receiving
    data packets.


    ### DatagramSocket Class


    The `DatagramSocket` class in the `java.net` package is used for UDP communication.


    ### DatagramPacket Class


    The `DatagramPacket` class in the `java.net` package represents a data packet
    used in UDP communication.


    **Example:**


    ```java


    import java.net.*;


    import java.util.Arrays;


    public class UDPExample {


    public static void main(String[] args) {


    try {


    DatagramSocket socket = new DatagramSocket();


    byte[] sendData = "Hello, server!".getBytes();


    InetAddress serverAddress = InetAddress.getByName("localhost");


    int serverPort = 1234;


    DatagramPacket sendPacket = new DatagramPacket(sendData, sendData.length, serverAddress,
    serverPort);


    socket.send(sendPacket);


    byte[] receiveData = new byte[1024];


    DatagramPacket receivePacket = new DatagramPacket(receiveData, receiveData.length);


    socket.receive(receivePacket);


    String response = new String(receivePacket.getData(), 0, receivePacket.getLength());


    System.out.println("Server response: " + response);


    socket.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Conclusion


    Networking is a vital aspect of modern applications, and Java provides a robust
    set of APIs for handling networking tasks. In this chapter, we covered the fundamentals
    of networking in Java, including socket programming, URL handling, HTTP communication,
    and UDP communication. With the knowledge gained, you can build networked applications,
    client-server systems, and interact with resources across networks using Java.


