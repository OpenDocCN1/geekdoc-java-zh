    # **Chapter 10: Concurrency in Java**


    Concurrency is the ability of a system to execute multiple tasks concurrently,
    enabling programs to perform multiple operations simultaneously. In Java, concurrency
    is achieved using threads, which are lightweight sub-processes that can run independently
    and share resources. The Java platform provides powerful APIs and tools to manage
    concurrent programming efficiently. In this chapter, we will explore the fundamentals
    of concurrency in Java, discuss thread management, synchronization, and concurrent
    collections, and provide practical examples to demonstrate how to write concurrent
    programs.


    ## Section 1: Introduction to Concurrency


    ### What is Concurrency?


    Concurrency refers to the ability of a program to handle multiple tasks simultaneously,
    making use of multiple threads to execute different operations concurrently.


    ### Threads and Multithreading


    A thread is the smallest unit of execution within a process. Multithreading allows
    a program to run multiple threads concurrently, enabling more efficient use of
    CPU resources.


    ### Benefits of Concurrency


    Concurrency offers several advantages, including improved performance, responsiveness,
    and resource utilization. It is particularly beneficial for tasks involving I/O
    operations, where threads can perform non-blocking operations while other threads
    continue execution.


    ## Section 2: Creating Threads


    ### Extending the `Thread` Class


    Threads can be created by extending the `Thread` class and overriding the `run()`
    method.


    **Example:**


    ```java


    public class MyThread extends Thread {


    @Override


    public void run() {


    System.out.println("Thread running");


    }


    public static void main(String[] args) {


    MyThread thread = new MyThread();


    thread.start();


    }


    }


    ```


    ### Implementing the `Runnable` Interface


    Another way to create threads is by implementing the `Runnable` interface and
    passing it to a `Thread` object.


    **Example:**


    ```java


    public class MyRunnable implements Runnable {


    @Override


    public void run() {


    System.out.println("Thread running");


    }


    public static void main(String[] args) {


    MyRunnable myRunnable = new MyRunnable();


    Thread thread = new Thread(myRunnable);


    thread.start();


    }


    }


    ```


    ## Section 3: Thread Management


    ### Thread States


    Threads in Java can be in different states, such as `NEW`, `RUNNABLE`, `BLOCKED`,
    `WAITING`, `TIMED_WAITING`, and `TERMINATED`, depending on their execution status.


    ### Thread Priority


    Threads can be assigned different priorities using the `setPriority()` method,
    but it is platform-dependent, and its usage is limited.


    **Example:**


    ```java


    public class PriorityExample {


    public static void main(String[] args) {


    Thread thread1 = new Thread(() -> {


    for (int i = 0; i < 5; i++) {


    System.out.println("Thread 1 - Priority: " + Thread.currentThread().getPriority());


    }


    });


    Thread thread2 = new Thread(() -> {


    for (int i = 0; i < 5; i++) {


    System.out.println("Thread 2 - Priority: " + Thread.currentThread().getPriority());


    }


    });


    thread1.setPriority(Thread.MAX_PRIORITY);


    thread2.setPriority(Thread.MIN_PRIORITY);


    thread1.start();


    thread2.start();


    }


    }


    ```


    ### Daemon Threads


    Daemon threads are threads that run in the background and do not prevent the program
    from exiting when all non-daemon threads have finished.


    **Example:**


    ```java


    public class DaemonThreadExample {


    public static void main(String[] args) {


    Thread daemonThread = new Thread(() -> {


    while (true) {


    System.out.println("Daemon Thread is running...");


    }


    });


    daemonThread.setDaemon(true);


    daemonThread.start();


    System.out.println("Main thread is exiting...");


    }


    }


    ```


    ## Section 4: Thread Synchronization


    ### Thread Interference


    Thread interference occurs when multiple threads access shared resources concurrently,
    leading to unpredictable behavior.


    ### Synchronized Methods


    Synchronized methods ensure that only one thread can access the method at a time,
    preventing thread interference.


    **Example:**


    ```java


    public class Counter {


    private int count = 0;


    public synchronized void increment() {


    count++;


    }


    public synchronized int getCount() {


    return count;


    }


    }


    ```


    ### Synchronized Blocks


    Synchronized blocks allow more fine-grained control over synchronization by locking
    on specific objects.


    **Example:**


    ```java


    public class SynchronizedBlockExample {


    private final Object lock = new Object();


    private int count = 0;


    public void increment() {


    synchronized (lock) {


    count++;


    }


    }


    public int getCount() {


    synchronized (lock) {


    return count;


    }


    }


    }


    ```


    ## Section 5: Concurrent Collections


    ### ConcurrentHashMap


    `ConcurrentHashMap` is a thread-safe version of `HashMap`, suitable for concurrent
    access.


    **Example:**


    ```java


    import java.util.concurrent.ConcurrentHashMap;


    public class ConcurrentHashMapExample {


    public static void main(String[] args) {


    ConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();


    map.put("one", 1);


    map.put("two", 2);


    map.forEach((key, value) -> System.out.println(key + " : " + value));


    }


    }


    ```


    ### CopyOnWriteArrayList


    `CopyOnWriteArrayList` is a thread-safe version of `ArrayList`, optimized for
    read-heavy workloads.


    **Example:**


    ```java


    import java.util.List;


    import java.util.concurrent.CopyOnWriteArrayList;


    public class CopyOnWriteArrayListExample {


    public static void main(String[] args) {


    List<String> list = new CopyOnWriteArrayList<>();


    list.add("Alice");


    list.add("Bob");


    list.forEach(System.out::println);


    }


    }


    ```


    ## Section 6: Thread Communication


    ### Using `wait()` and `notify()`


    `wait()` and `notify()` methods allow threads to communicate and coordinate their
    activities.


