    \ Java 虚拟机 (`JVM`) 实现的，它将 Java 字节码转换为特定底层平台的机器码。\n\n### Java 的起源与演变\n\nJava 的开发始于\
    \ 1991 年，当时名为“Oak”，旨在用于消费电子设备。然而，随着万维网的兴起，重点转向了使用 Java 开发网络小程序（Applets）。1995 年，该语言作为\
