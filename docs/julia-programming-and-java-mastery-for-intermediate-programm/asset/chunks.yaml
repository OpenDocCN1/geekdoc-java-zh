    \n## Section 4: Working with Directories\n\nBoth Python and Java provide functionality\
    \ to work with directories (folders), including creating, deleting, and navigating\
    \ through directories.\n\n### Directory Operations in Python\n\n**Python Example:**\n\
    \n```python\nimport os\n# Create a directory\nos.mkdir(\"my_folder\")\n# Check\
    \ if directory exists\nif os.path.exists(\"my_folder\"):\n    print(\"my_folder\
    \ exists.\")\n# Change current directory\nos.chdir(\"my_folder\")\n# Get current\
    \ directory\nprint(\"Current directory:\", os.getcwd())\n# List files in directory\n\
    files = os.listdir()\nprint(\"Files in directory:\", files)\n# Change back to\
    \ parent directory\nos.chdir(\"..\")\n# Remove the directory\nos.rmdir(\"my_folder\"\
    )\n```\n\n### Directory Operations in Java\n\n**Java Example:**\n\n```java\nimport\
    \ java.io.File;\n\npublic class DirectoryHandler {\n    public static void main(String[]\
    \ args) {\n        // Create a directory\n        File dir = new File(\"my_folder\"\
    );\n        if (dir.mkdir()) {\n            System.out.println(\"my_folder created.\"\
    );\n        }\n        // Check if directory exists\n        if (dir.exists())\
