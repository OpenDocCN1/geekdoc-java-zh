    Alice\")               # 使用默认问候\nmessage2 = greet(\"Bob\", \"Hi\")          #\
    \ 使用提供的问候\nprintln(message1)                      # 打印 \"Hello, Alice!\"\nprintln(message2)\
    \                      # 打印 \"Hi, Bob!\"\n```\n\n在这个示例中，`greet` 函数有一个可选参数 `greeting`，默认值为\
    \ \"Hello\"。你可以带或不带 `greeting` 参数来调用函数。\n\n### 关键字参数\n\n关键字参数允许你在调用函数时通过名称指定参数，清楚地表明哪个参数对应哪个值。\n\
    \n以下是一个带有关键字参数的示例：\n\n```julia\n# 定义一个带有关键字参数的函数\nfunction compute_total(price;\
    \ tax_rate=0.10, discount=0.0)\n  total = price * (1 + tax_rate) * (1 - discount)\n\
    \  return total\nend\n\n# 使用关键字参数调用函数\ntotal1 = compute_total(100.0, tax_rate=0.08)\
    \             # 指定 tax_rate 为关键字参数\ntotal2 = compute_total(100.0, discount=0.15)\
    \             # 指定 discount 为关键字参数\ntotal3 = compute_total(100.0, tax_rate=0.08,\
    \ discount=0.15) # 指定两个参数\nprintln(total1)  # 打印 108.0\nprintln(total2)  # 打印\
    \ 85.0\nprintln(total3)  # 打印 92.4\n```\n\n在这段代码中，`compute_total` 函数对 `tax_rate`\
    \ 和 `discount` 使用关键字参数。调用函数时，你可以显式地通过名称指定这些参数。\n\n## 匿名函数 (Lambdas)\n\nJulia 允许使用\
    \ `->` 语法创建匿名函数，也称为 lambda 函数。这些函数没有名称，通常用于短而简单的操作。\n\n以下是一个匿名函数的示例：\n\n```julia\n\
    # 定义一个对输入平方的匿名函数\nsquare = x -> x²\nresult = square(5)  # 打印 5\n```\n\n## 广播 (Broadcasting)\n\
    \nJulia 提供了一项强大的功能称为广播（broadcasting），允许你对集合应用操作。\n\n以下是广播的示例：\n\n```julia\n# 定义一个平方函数\n\
    square(x) = x²\nnumbers = [1, 2, 3, 4, 5]\n# 对数组应用平方函数\nsquared_numbers = square.(numbers)\n\
    println(squared_numbers) # 打印 [1, 4, 9, 16, 25]\n```\n\n## 结论\n\n函数和方法是 Julia\
    \ 的基础组成部分。它们允许你封装逻辑、提高重用性并利用 Julia 的多重分发系统。\n\n# 第 5 章：处理数组与矩阵\n\n数组和矩阵是 Julia\
    \ 中的基础数据结构，在科学和计算任务中扮演着核心角色。在本章中，我们将探索如何处理数组和矩阵，涵盖数组创建、索引、切片、操作等主题。\n\n## 数组创建\n\
    \n在 Julia 中，你可以使用多种方法创建数组。数组可以包含相同或不同类型的元素，使其在不同的应用中非常通用。\n\n### 使用字面量语法创建数组\n\
    \n在 Julia 中创建数组最简单的方法是使用方括号并用逗号分隔指定的元素：\n\n```julia\n# 创建一个整数数组\nnumbers = [1,\
    \ 2, 3, 4, 5]\n\n# 创建一个字符串数组\nfruits = [\"apple\", \"banana\", \"cherry\"]\n```\n\
    \n你可以创建任何数据类型的数组，或在同一个数组中混合不同的类型。\n\n### 创建空数组\n\n要创建一个空数组，你可以使用 `[]` 语法或 `Array{T}(undef,\
    \ dims)` 构造函数，其中 `T` 是元素类型，`dims` 是指定数组维度的元组：\n\n```julia\n# 使用 [] 语法创建空数组\nempty_array\
    \ = []\n\n# 使用构造函数创建空数组\nempty_float_array = Array{Float64}(undef, (3, 4))\n```\n\
    \n### 创建范围\n\n你可以使用 `start:step:stop` 语法创建顺序数值数组：\n\n```julia\n# 创建从 1 到 10 的整数数组\n\
    integers = 1:10\n\n# 创建从 2 到 20 的偶数数组\neven_numbers = 2:2:20\n```\n\n### 从函数创建数组\n\
    \nJulia 提供了 `zeros`、`ones` 和 `rand` 等函数来创建特定值的数组：\n\n```julia\n# 创建全零数组\nzeros_array\
    \ = zeros(3, 3)\n\n# 创建全 1 数组\nones_array = ones(2, 4)\n\n# 创建一个 0 到 1 之间的随机数组\n\
    random_array = rand(4, 3)\n```\n\n这些函数在填充数据之前初始化数组非常有用。\n\n## 数组索引与切片\n\n"
