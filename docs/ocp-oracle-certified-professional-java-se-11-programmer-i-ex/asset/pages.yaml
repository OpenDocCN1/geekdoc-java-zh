  md: "# Using pre and post increment operations in the if condition\n\nYou will see\
    \ conditions that use pre and post increment (decrement) operators in the exam.\
    \ Something like this:\n\n```\nint x = 0;\nif(x++ > 0){ // line 2\n x--; // line\
    \ 3\n}\n\nif (++x == 2){ // line 6\n x++; // line 7\n}\nSystem.out.println(x);\n\
    ```\n\nYou can spot the trick easily if you have understood the difference between\
    \ the value of an expression and the value of a variable used in that expression\
    \ (I explained this in the \"Using Operators\" chapter). At line 2, x will be\
    \ incremented to 1 but value of the expression x++ is 0 and therefore, the condition\
    \ will be evaluated to false. Thus, line 3 will not be executed. At line 6, x\
    \ is incremented to 2 and the value of the expression ++x is also 2. Therefore,\
    \ the condition will be evaluated to true and line 7 will be executed, thereby\
    \ increasing the value of x to 3. Thus, the above code will print 3.\n\nRemember\
    \ that conditions are used in ternary expressions and loops as well, so, you need\
    \ to watch out for this trick there also."
