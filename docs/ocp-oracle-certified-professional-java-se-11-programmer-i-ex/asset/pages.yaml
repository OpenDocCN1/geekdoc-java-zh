    # 2.3.3 The import statement


    If all of your classes are in the same package, you can use the simple name of
    a class to refer to that class

    another. But to refer to a class in one package from another, you need to use
    its "fully qualified name" or FQCN. FQCN of a class is basically the package name
    + + the class name. For example,

    the package statement in your class Test package com.enumerate.opc; the FQCN of
    this class is

    com.enumerate.opc.Test.


    If you want to refer to this class name from another different package, say com.xyz.abc,
    you need to

    the FQCN, i.e.,com.enumerate.opc.Test t = new

    com.enumerate.opc.Test();


    If you try to use the simple class name, i.e.,Test = new Test(); the compiler
    will assume that you

    mean to use the Test from the same package, i.e.,com.xyz.abc and if it doesn''t
    find that class

    com.xyz.abc package, it will complain that it doesn''t understand what you mean
    by "Test". FQCN tells

    compiler exactly which class you intend to use.


    If you refer to this class several times in your code, you can see that it will
    lead to many repetitions of

    com.enumerate.opc in the code. The import statement solves this problem. If you
    add an import statement

    import com.enumerate.opc.Test; you can use just the simple name Test in your class
    to refer

    com.enumerate.opc.Test class.


    If you refer multiple classes of the same package, you can use either one import
    statement for

    class or you use just one import statement with a wildcard * for the whole package.
    For

    example,import com.enumerate.opc.*; The compiler will try to find the simple class
    names used in

    your code in the imported package(s). You have as many import statements as you
    need. You can also have

    redundant imports or imports that are not needed.'
