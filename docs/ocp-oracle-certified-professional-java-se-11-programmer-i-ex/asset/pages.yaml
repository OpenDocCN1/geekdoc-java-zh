  md: '# Array cloning


    All array classes also have a public method clone. This creates a copy of the
    array object. Note that it doesn''t create copies of the objects referred to by
    the array elements. It merely creates a new array object of the same length and
    copies the contents of the existing array into the new array. Which means, if
    the existing array contains primitive values, those values will be copied to the
    elements of the new array. Then, elements of the new array will also point to
    the same objects. This is also known as "shallow copy".


    For example, the following figure shows exactly what happens when you clone an
    array of five ints referred to the variable myIntArr using the statement int[]
    myIntArr2 = (int[]) myIntArr.clone(); Don''t worry about the explicit copy for
    now, but observe that new array object with the same number of slots is created
    and the contents of the existing array are copied to the slots of the new array.


    | myIntArr1 | 2 | 4 | 100 | -1 | 5 |

    |---|---|---|---|---||}{

    | myIntArr2 | 2 | 4 | 100 | -1 | 5 |


    Cloning an array of ints


    The following figure shows what happens when you clone an array of Strings referred
    to the variable myStringArr using the statement String[] myStringArr2 = (String[])
    myStringArr.clone(); Observe that the references are copied into the new array
    and that no new String objects are created in the heap space.


    ![](img/f7bc00fabb8855fa5663a81b5e778ee0_203_0.png)


    Cloning an array of Strings


    Cloning is not required for the exam but it is an important aspect of arrays anyway.


    # Members inherited from Object class


    Remember that java.lang.Object is the root class of all classes, it is the root
    class of all array classes as well and therefore, array classes inherit the members
    of the Object class. This includes toString, equals, and hashCode methods.'
