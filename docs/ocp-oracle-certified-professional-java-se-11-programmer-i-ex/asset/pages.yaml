    \ //inserted by the compiler\n    }\n    public static void main(String args[]){\n\
    \        Employee ee = new Employee();\n    }\n}\n```\n\nObserve that this no-args\
    \ constructor also contains a call to super(); (See how invoking a super class's\
    \ constructor is?). But as discussed above, Person doesn't have a no-args constructor\
    \ and therefore, the above code will not compile!\n\nSince an object can be initialized\
    \ only once, call to super(<arguments>); can also be made once. If you try to\
