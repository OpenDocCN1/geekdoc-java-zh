  md: '# 9.1 Declare, instantiate, initialize and use a one-dimensional array


    # 9.1.1 Declaring variables


    An array is an object that holds a fixed number of values. You can think of an
    array as a carton of eggs. If you have a carton with 6 slots, then that carton
    can only hold six eggs. Each slot of the carton can either have an egg or be empty.
    Observe that the carton is not an egg. Similarly, if you have an array of size
    six of int values (or, for short), then that array can hold six ints but the array
    itself is not int.


    An array of any type can hold anything except the values of that type. For example,
    if you have an array of long or dimensional values. Similarly, if you have an
    array of Strings, this array can only hold references to String objects. An important
    point to note here is that even though you call it an "array of strings", it does
    not actually contain String objects. It contains only references to String objects.
    You cannot have an array that contains actual objects.


    # Array declaration


    When you declare an array, you are basically specifying the type of values that
    you want to deal with that variable. The way to specify that in Java is to [],
    i.e., square brackets to the type of the values. For example, if you want an array
    through which you will write int[] Arrays can be multi-dimensional and will have
    one of opening and closing brackets for each dimension. For example,


    ```

    int i; // i is an int

    int[] ia1, ia2; // ia1 and ia2 are dimensional arrays of ints

    int[][] iaa; // iaa is two dimensional array of ints and so on

    ```


    An array declaration can never include the size of the array. Thus, the following
    declarations will not compile:


    ```

    int[2] invalid1;

    int[3][] invalid2;

    int[][][4] invalid3;

    ```


    Unfortunately, the method is not the only way to declare arrays. Java allows you
    to apply square brackets to the variable name instead of type. For example,


    ```

    int i, ia[]; // i is an int but ia is a one dimensional array of int values

    int[] ia, iaa[]; // iaa is a one dimensional array of ints but iaa is a two dimensional

    ```


    Observe that the rule of thumb one size of square brackets still holds. In the
    case of iaa, you set one on the type and one on the variable, therefore iaa is
    a two dimensional array.


    Arrays of objects are declared the way. For example,


    ```

    Object[] obj, obj[]; // obj is a one dimensional array of Objects but obj

    String[] strA; // strA is a one dimensional array of strings

    ```


    Note that the statements shown above only declare array variables. They don''t
    actually create arrays. Array creation and statements is a topic in its own right
    and that is what I will discuss next.


    # 9.1.2 Creating and initializing array objects'
