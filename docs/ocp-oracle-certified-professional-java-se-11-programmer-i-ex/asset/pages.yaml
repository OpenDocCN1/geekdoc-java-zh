  md: "Well, why do you need a switch statement, you may ask. To begin with, as you\
    \ can see, an if/else statement is a lot more verbose than a switch statement.\
    \ The switch version is also a little easier to comprehend than the if/else version.\
    \ and underneath this syntactic ease lies a complicated beast. This is evident\
    \ when we look at the moving parts involved in a switch statement more.\n\n# The\
    \ switch expression\n\nSwitch must evaluate to one of the following kinds:\n\n\
    +   1. a limited set of integral types (byte, char, short, int), and their wrapper\
    \ classes. Observe that even though long is an integral type, cannot be the type\
    \ of a switch variable. boolean, Float, and double are not integral types anywhere\
    \ and cannot be the type of a switch variable either.\n2. enum type\n3. java.lang.String\
    \ - Generally, references are not allowed as switch expressions but an exception\
    \ for java.lang.String was made in Java 7. Now, you can use String as a switch\
    \ expression.\n\nCompare this to an if/else statement where branching is based\
    \ on the value of a boolean expression. This limits an if/else to at most two\
    \ branches. Of course, as we saw earlier, you can cascade multiple if/else statements\
    \ to achieve multiple branches.\n\n# The case labels\n\nCase labels must be of\
    \ constant types that are assignable to the type of switch expression. For example,\
    \ if your switch expression is of type byte, you cannot have a case label with\
    \ a value that is larger than a byte. Similarly, if your switch expression is\
    \ of String, the case labels must be constant string values as illustrated in\
    \ the following code:\n\n```\npublic static void main(String[] args) {\n    switch(args[0])\
    \ {\n        case \"1\" : System.out.println(\"one\"); //valid because \"1\" is\
    \ a compile time\n        case \"1+\"+2\" : System.out.println(\"one\"); //valid\
    \ because \"1+\"+2\" is a com\n        case args[1] : System.out.println(\"same\
    \ args\"); //will not compile because\n        case \"abc\".toUpperCase() : System.out.println(\"\
    ABC\"); //will not compile be\n    }\n}\n```\n\nObserve that \"1\" and \"1+\"\
    +2\" are constant types because these expressions are known at compile time, while\
    \ \"abc\".toUpperCase() are not compile types because their values can only be\
    \ determined at run time when the code is executed.\n\nThe interesting thing is\
    \ that case labels are optional. In other words, a switch statement does not necessarily\
    \ have to have a case label. The following is, a superfluous yet valid switch\
    \ statement.\n\n```\nswitch(i) {\n    default : System.out.println(\"This will\
    \ always be printed\");\n}\n```\n\nAnother point worth repeating here is that\
