  md: '# 10.1 Create methods with arguments and return values


    # 10.1.1 Creating a method


    We have already seen methods in previous chapters. Indeed, we have been using
    the "main" method to run test programs all along. But we haven''t discussed them
    formally yet.


    A method is what gives behavior to a type. Java allows classes, interfaces, and
    enums to have a behavior. A behavior is not a high level action performed by a
    piece of code. If you expect this action to be performed as and required, you
    put this piece of code in a method and give it a name. This lets you invoke that
    action whenever you need using the name. It is like a black box to which you give
    some input and get back some output in return.


    Thus, the basic structure of a method is as follows:


    ```

    returnType methodName(parameters) {

    methodBody}

    ```


    A ReturnType specifies what the method returns as a result of its execution. For
    example, a method that returns the sum of two integers may specify that it returns
    an int as a result. A method that returns an Account object may specify Account
    as the return type. If a method doesn''t return anything, it must specify so,
    using the keyword void.


    It is important to know that a method can return one value at the most.


    A MethodName is the name given to this method. It must be a valid Java identifier.
    If an identifier is an unlimited-length sequence of Java letters and Java digits,
    the first of which must be a Java letter. It cannot be a reserved word or a keyword.


    The Parameters of a method are specified by a list of comma-separated parameter
    declarations. Each parameter declaration consists of a type and an identifier
    that specifies the name of the parameter. If a method does''t take any parameters,
    the parameter list will be empty. The following are few examples of a valid parameter
    list:


    ```

    void save() //no parameters

    void saveAccount(Account acc) //takes an Account as a parameter

    void add(int a, int b) //takes two ints as parameters

    ```


    Note that, unlike regular declarations, each parameter in a method list must be
    specified along with its type individually. Thus, while int a, b; is a valid statement
    in one that declares int variables, add(int a, b) is an invalid declaration of
    method b.


    Each parameter in the parameter list may also be declared as final if the code
    in the method does not change its value. Example:


    ```

    void add(int a, final b) //b is final.

    ```


    If a parameter is declared final and if the method tries to change its value,
    the code will fail to compile.


    The MethodBody contains the code that is to be executed upon invocation of method.
    It must be contained within curly braces. Observe this unlike other block statements
    such as if/else, for, and where, you'
