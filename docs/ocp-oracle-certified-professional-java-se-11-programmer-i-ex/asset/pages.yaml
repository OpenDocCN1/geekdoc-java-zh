    \ double t){\n  if(t<0) throw new IllegalArgumentException(\"time is less than\
    \ 0\");\n  //other code\n}\n```\n\nThrowing an exception implies that the code\
    \ has encountered an unexpected situation with which it does not want to deal.\
    \ The code shown above, for example, the time to be greater than zero. For this\
    \ code, time less than zero is an unexpected situation. It does not want to deal\
    \ with this situation (probably the programmer is not sure what to do in this\
    \ case) so it throws an exception in a subclass. This also means that this method\
    \ passes the responsibility of determining what should be done in case time is\
    \ less than zero to the user of this method.\n\nNote that any instance of Throwable\
    \ (or its subclasses) can be thrown by the throw statement. You cannot do something\
    \ like throw new Object(); or throw \"bad situation\";\n\nExplicitly throwing\
    \ an exception using the throw statement is not the only way an exception can\
    \ be thrown. JVM may also decide to throw an exception if the code tries to do\
    \ bad thing like calling a method on a null reference. For example:\n\n```\npublic\
    \ void printLength(String str){\n  System.out.println(str.length());\n}\n```\n\
    \nIf you pass null to the above method, the JVM will create a new instance of\
    \ NullPointerException and throw when it tries to execute str.length()."
