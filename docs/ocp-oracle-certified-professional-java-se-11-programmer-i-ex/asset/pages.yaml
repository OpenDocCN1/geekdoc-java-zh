  md: "# 12.3 Create and extend abstract classes\n\n# 12.3.1 Using abstract classes\
    \ and abstract methods\n\nI talked about **abstract class** as a **type of** briefly\
    \ in the \"Kickstarter for Beginners\" chapter. An abstract class is used when\
    \ you want to capture the common features of multiple related object types while\
    \ knowing that no object exhibits only the features captured in the abstract class\
    \ can actually exist. For example, if you are creating an application that deals\
    \ with cats and dogs, you may want to capture the common features of cats and\
    \ dogs into a class called Animal. But you know that you cannot have an Animal.\
    \ You can have a cat or a dog but not something that is just an animal without\
    \ a cat, a dog or some other animal. In that sense, Animal is an **abstract concept**.\
    \ Furniture is another such concept. If you want to have a Furniture, you have\
    \ to get a chair or a table because Furniture doesn't exist on its. It is an abstract\
    \ class.\n\nAbstract classes are used to capture such abstract classes. An abstract\
    \ class can be defined by the keyword `abstract` in its declaration. For the example,\
    \ here is how you can define `Furniture:`\n\n```\nabstract class Furniture{\n\
    \    private String material;\n    //public getter and setter\n}\n```\n\nObserve\
    \ that Furniture is pretty much like a regular class with private fields and methods.\
    \ However, since it is declared abstract, it cannot be instantiated. Thus, if\
    \ you try to do new Furniture(), the compiler will generate an error saying, \"\
    Furniture cannot be instantiated.\"\n\nBut Chair and Table are concrete concepts.\
    \ They exist on their own. Since both of them are features of Furniture, you can\
    \ model them as those that extend Furniture.\n\n```\nclass Chair extends Furniture{\n\
    \    //fields and methods specific to Chair\n}\nclass Table extends furniture{\n\
    \    //fields and methods specific to Table\n}\n```\n\nSince Chair and Table extend\
    \ Furniture, they will inherit all of the features of Furniture just like subclasses\
    \ inherit all of the features of their super class.\n\nNote that abstract classes\
    \ are not also called \"concrete\" classes because they represent real objects.\n\
    \n# Adding an abstract method to an abstract class\n\nLet's say every piece of\
    \ furniture in the store has to provide a method for its assembly. Since the steps\
    \ to assemble a chair will be different from steps to assemble a table, we cannot\
    \ include the steps for assembly in Furniture class. In other words, what we are\
    \ saying is that the declaration of the method to assemble is common to all furniture\
    \ but its implementation is unique to each type of furniture. Java allows you\
    \ to capture declaration without implementation in the form of an **abstract method**.\
    \ An abstract method is declared by applying the **abstract** keyword to the method\
    \ declaration. It must not have a method body either. For example:\n\n```\nabstract\
    \ class Furniture{\n    private String material;\n    //public getter and setter\n\
    ```"
