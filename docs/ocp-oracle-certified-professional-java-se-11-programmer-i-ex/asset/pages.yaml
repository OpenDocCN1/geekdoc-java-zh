  md: "# 7.3 Use a switch statement\n\n# 7.3.1 Creating a switch statement\n\nA switch\
    \ statement allows you to use the value of a variable to select which code block\
    \ (or blocks) out of multiple code blocks should be executed. Here is an example:\n\
    \n```\npublic class TestClass {\n    public static void main(String[] args) {\n\
    \        int i = args.length;\n\n        switch(i) { // switch block starts here\n\
    \            case 0 : System.out.println(\"No argument\");\n                break;\n\
    \            case 1 : System.out.println(\"Only one argument\");\n           \
    \     break;\n            case 2 : System.out.println(\"Two arguments\");\n  \
    \              break;\n            default : system.out.println(\"Too many arguments\"\
    );\n                break;\n        }\n        // switch block ends here\n   \
    \     System.out.println(\"All done.\");\n    }\n```\n\nThere are four blocks\
    \ of code in the above switch statement. Each block of code is associated with\
    \ a **case label**. Depending of the value of the variable i, the control will\
    \ enter the code block associated with that particular case label and keep executing\
    \ statements until it finds a **break** statement. For example, if the value of\
    \ i is 0, the control will enter the first code block. It will find no **argument**\
    \ and then encounter the **break** statement. The break statement causes the control\
    \ to exit the switch statement and move on to the next statement after the switch\
    \ block, which prints \"All done.\"\n\nIf the value of i doesn't match with any\
    \ of the case labels, the control looks for a block labelled default and enters\
    \ it. If there is no default block, the control does not enter the switch block\
    \ at all. Since \"switching\" is based on the expression specified in the switch\
    \ statement (which is just i in this example), this expression is aptly called\
    \ the \"switch expression\".\n\nOperationally, this seems quite similar to a cascaded\
    \ if else statement. The above code can be very well written using an if else\
    \ statement as follows:\n\n```\npublic class TestClass {\n    public static void\
    \ main(String[] args) {\n        int i = args.length;\n\n        if(i == 0) {\n\
    \            System.out.println(\"No argument\");\n        } else if (i == 1)\
    \ {\n            System.out.println(\"Only one argument\");\n        } else if\
    \ (i == 2) {\n            System.out.println(\"two arguments\");\n        } else\
    \ {\n            System.out.println(\"Too many arguments!\");\n        }\n   \
    \     System.out.println(\"All done.\");\n    }\n```"
