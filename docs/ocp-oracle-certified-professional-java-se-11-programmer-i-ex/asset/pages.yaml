  md: "# Order of execution\n\nVarious pieces of a loop are executed in a specific\
    \ order, which is as follows:\n\n+   1. The **initialization section** is the\
    \ first that is executed. It is executed **exactly once** irrespective of how\
    \ many times the loop iterates. If this section is **empty**, it is **ignored**.\n\
    2. Next, the **condition section** is executed. If the result of the expression\
    \ in this section is true, the next iteration, i.e., execution of the statements\
    \ in the block is kicked off. If the result is false, the loop is terminated immediately,\
    \ i.e., neither the block nor the upd section is executed. If this section is\
    \ **empty**, it is assumed to be **true**.\n3. The statements in the **for block**\
    \ are executed.\n4. The **iteration section** is executed. If this section is\
    \ **empty**, it is **ignored**.\n5. The control goes back to the **condition section**.\n\
    \nLet us see how these steps are performed in the context of for loop.\n\n```\n\
    for(int i = 3; i>0; i--){\n    System.out.println(\"i is \"+i);\n}\n```\n\n+ \
    \  1. **i = 3** is evaluated. So, i is 3.\n2. Expression **i>0** is evaluated\
    \ and since 3 greater than 0, it evaluates to true. Therefore, the next iteration\
    \ will now commence.\n3. The print statement is executed, which prints 3.\n4.\
    \ **i--** is executed reducing i to 2.\n5. Control goes back to the condition\
    \ section. **i=0** evaluates to **true** because 2 is greater than 0. Therefore,\
    \ the next iteration will now commence.\n6. The print statement is executed, which\
    \ prints 2.\n7. **i--** is executed reducing i to 1.\n8. Control goes back to\
    \ the condition section. **i=0** evaluates to **true** because 1 is greater than\
    \ 0. Therefore, the next iteration will now commence.\n9. The print statement\
    \ is executed, which prints 1.\n10. **i--** is executed reducing i to 0.\n11.\
    \ Control goes back to the condition section. **i=0** evaluates to **false** because\
    \ 0 is not greater than 0. Therefore, the loop will be terminated. The statements\
    \ in the for block and the upd section will not be executed and the control goes\
    \ to the next statement after the block (which is the end of the method in case).\n\
    \nSo far, the loop looks quite straightforward. You will see the complications\
    \ when we turn our attention to the intricacies of the three sections of the for\
    \ statement next.\n\n# 8.4.3 Parts of a for loop\n\n# The initialization section\n\
    \nThe initialization section allows you to specify code that will be executed\
    \ at the beginning of the for loop. Loop code must belong to a category of statements\
    \ that are called **expression statements**. Expression statements that can be\
    \ used as statements on their own. They are **assignment, pre/increment/decrement\
    \ expression, a method call, and a class instance creation expression** (e.g.\
    \ using the new operator). Besides expression statements, this section also allows\
    \ you to declare local variables.\n\nHere are a few examples of valid expression\
    \ statements in for loop:"
