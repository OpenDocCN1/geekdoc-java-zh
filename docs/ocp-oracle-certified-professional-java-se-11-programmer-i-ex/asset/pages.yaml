  md: '# 3.3 Declare and initialize variables


    # 3.3.1 Declare and initialize variables


    For better or worse, Java has many ways of declaring and initializing variables.
    The exam expects that you know them all. Although Oracle has substantially reduced
    the number of questions that are based solely on quirky syntax, some may still
    use weird syntax snippets in questions that test you on something. So, let''s
    go through them one by one starting with the most basic - declarations without
    initialization.


    ```

    1. int x;

    String str;

    Object obj;


    2. int a, b, c; //a, b, and c are declared to be of type int

    String s1, s2; //s1 and s2 are declared to be type String

    ```


    The following are ways to declare as initialize at the same time:


    ```

    1. int x = 10; //initializing x using int 10

    2. int y = x; //initializing y by assigning the value of another variable x

    3. String str = "123"; //initializing str by creating a new String

    4. SomeClass obj = new SomeClass(); //initializing obj by creating a new instance
    of SomeClass

    5. Object obj2 = obj; //initializing obj by creating another reference

    6. int a = 10, c = 30; //initializing each variable of same type with a different
    value

    7. String s1 = "123", s2 = "hello";

    8. int m = 20; int p = 10; //resetting m to 10 and using the new value of m to
    initialize p

    ```


    Mixing the two styles above:


    ```

    1. int a, b = 10, c = 20; //a is declared but not initialized. b and c are

    declared well as initialized

    2. String s1 = "123", s2; //only s1 is being initialized

    ```


    And the following are illegal:


    ```

    1. int a = 10, b; //you can only have one type name in one statement.

    2. int a, Object obj;

    3. int x = y = 10;//Invalid, y must be defined before using it to initialize

    x.

    ```


    Observe that no difference in the way you declare primitive variables and a reference
    variables. A reference variable, however, has one additional way of initialization
    - you can assign null to a reference variable. You can''t do that to a primitive
    variable. For example, int i = null; is invalid. String s1 = null; is valid.


    # Naming rules for a variable


    A variable name must be a valid identifier. Conventionally however a variable
    name starts with a lower letter and names for constants variables are in upper.
    Variables created by code generation tools usually start with an underscore (_
    or $) sign'
