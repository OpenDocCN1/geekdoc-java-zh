  md: "# 5.2 Manipulate data using the StringBuilder class and its methods\n\n# 5.2.1\
    \ Why StringBuilder\n\njava.lang.StringBuilder is the mutable sibling of java.lang.String.\
    \ Both the classes extend Object and implement CharSequence. Both are final as\
    \ well.\n\nYou might be wondering why we need another class to deal with strings\
    \ if String allows us to do everything we could possibly want to do with strings!\
    \ Well, because StringBuilder is quite different from String to the fact that\
    \ StringBuilder objects are treated just like objects of other regular classes\
    \ by the JVM. There no \"string pool\" or \"interning\" associated with StringBuilder\
    \ objects are garbage collected just like others when they go out of scope, they\
    \ don't keep memory forever. This makes StringBuilder suitable for creating temporary\
    \ strings that have no once method, such as creating lengthy messages or building\
    \ long documents. For example, it may be hard to build but a program can create\
    \ a large number of String objects pretty quickly. The following code generates\
    \ an HTML view for displaying a list of names in a browser:\n\n```\npublic String\
    \ showPerson(List persons) {\n  String html = \"<h3>Persons</h1>\";\n  for(Object\
    \ o : persons) {\n    Person p = (Person) o;\n    html = html+p.getName()+\"<br\
    \ class=\\\"mynewline\\\"> >\";\n  }\n  return html;\n}\n```\n\nThe above code\
    \ has the potential to wreak havoc on our memory. Depending on the creation of\
    \ large number of String objects and all of them will sit in the memory for a\
    \ long time, possibly for the entire-life of the program. The same method, using\
    \ StringBuilder, is a lot more efficient:\n\n```\npublic StringBuilder showPerson(List\
    \ persons) {\n  StringBuilder html = new StringBuilder(\"<h3></h3>\");\n  for(Object\
    \ o : persons) {\n    Person p = (Person) o;\n    html.append(p.getName()).append(\"\
    <br class=\\\"mynewline\\\"> >\");\n  }\n  return html;\n}\n```\n\nIt creates\
    \ two String objects and exactly one StringBuilder object irrespective of the\
    \ number of elements in the list. Furthermore, the StringBuilder object will be\
    \ garbage collected as soon as it goes out of scope.\n\nOn the other hand, String\
    \ objects are intern, they are more suitable for creating short strings that are\
    \ used repeatedly in a program (For example, \"<br class=\\\"mynewline\\\"> >\"\
