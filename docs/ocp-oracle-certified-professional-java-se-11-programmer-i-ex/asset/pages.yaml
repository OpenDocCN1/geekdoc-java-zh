    there is no direct invocation of a static initializer from the application. If
    a static initializer ends up throwing an exception, there is no way for the application
    to handle that exception and recover from it. For this reason, a static initializer
    is not allowed to throw any checked exception. If the compiler sees a possibility
    of a checked exception getting out of a static initializer, it will generate an
    error. For example, the following code will not compile:'
