    JVM''s Memory Space


    As you observe, the stack looks like a stack of chips that are kept on top of
    the other. First, the method parameters are put on the stack and then all the
    temporary variables by a method are added on top of the stack one by one and as
    they are created. As soon as the method ends (i.e. it returns), the method and
    all the variables added to the stack by the method are removed from the top. Objects
    are removed only after the method ends. When the method calls another, the variables
    created by the caller are pushed onto the same stack on top of the variables stored
    by the caller. When a thread dies, the stack space is emptied and reverted by
    the JVM. This space behaves like a stack, it is called stack space.


    The heap space, on the other hand, is, like a heap! heap just as you please. JVM
    goes to large lengths to organize the object space. Organization of the heap is
    an advanced topic and is very important when you analyse the performance of an
    application. However, it is not relevant for the exam and so, I will not discuss
    it. From the program perspective, there is not much of organization in a heap.


    Whenever any object is created in the code (whether in a method or in a class),
    the JVM allocates object explicitly. It is managed by the JVM. In Java, a program
    never releases this space explicitly. It can only be accessed using its reference.
    For a method to access an object, one must use a reference to that object. It
    can get that reference from a variable on its stack space (if the object was created
    in this stack) or through a reference to another object whose reference is kept
    on the stack (if that object has a reference to the object). In either case, a
    method has to start with a reference that exists on its stack. If there is no
    reference on any stack space through which an object can be accessed directly
    or indirectly, it is considered garbage. It is cleaned up automatically by the
    JVM using a garbage collector.


    > Recall from our discussion on References and Objects that a reference is merely
    a variable that stores the address of the location where the actual object is
    stored. In that sense, a reference variable is no different than an int variable.
    both store a number. A reference variable stores a number that indicates the memory
    location where you can find the object, while an int variable stores a number
    that is interpreted as a number. It doesn''t indicate anything else. If you create
    a variable in a method, whether a reference variable or a primitive variable,
    it is kept on the stack but when you create an object, that object is stored on
    the heap.


    Typically, an object is created using the new keyword. But Java treats Strings
    as special, and so, you can create String objects even without the new keyword.
    Thus,'
