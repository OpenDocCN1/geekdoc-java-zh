  md: "A catch block is associated with a catch clause, which specifies the exception\
    \ that the catch block is meant to handle. For example, a catch block with the\
    \ catch clause catch(IllegalArgumentException) is meant to handle IllegalArgumentException\
    \ and its subclasses. Thus, this catch block will be executed only if the code\
    \ in the try block throws an IllegalArgumentException or its subclass. You can\
    \ specify any valid exception class (including java.lang.Throwable) in the catch\
    \ clause.\n\nA finally block is the location where the programmer tries to save\
    \ the state or control the damage to so, without attempting to recover from an\
    \ exception. For example, a program that tries to copy a file may want to close\
    \ any open files irrespective of whether the copy operation is successful or not.\
    \ The programmer can do this in the finally block. You may have a finally block\
    \ as the mechanic reassembles the parts back irrespective of whether he has to\
    \ fix the car or not\n\nHere is a method that calls computeSimpleInterest method\
    \ above within a try statement:\n\nIn the code below, the call to computeSimpleInterest\
    \ throws an IllegalArgumentException because t is negative. Thus, the println\
    \ after the method is not called. The exception is caught in the catch block because\
    \ its catch clause, i.e., catch(IllegalArgumentException ) matches with the exception\
    \ that is thrown by the try block and the control goes to the specific catch block.\
    \ It prints the exception's message and the stack trace on the console. The finally\
    \ goes directly to the code in the finally block, where it prints \"all done\"\
    . If you omit the catch block, the control will go directly to the finally block\
    \ after the invocation of computeSimpleInterest method. After the execution of\
    \ the code in the finally block, the caller of doInterest method will receive\
