  md: '# 12.1.3 Inheritance and access modifiers


    You might have noticed that I violated an important principle of OOP in Person
    and Employee classes. These classes are not well encapsulated. Recall that in
    the previous chapter, I explained why it is bad to have public fields. Here, both
    the Person class, and since the Employee class extends Person, the Employee has
    a field that is exposed to the whole world. As per the principle of encapsulation,
    I should make the name field private. If I make name private, Employee fails to
    compile with the following error:


    ```

    Error: name has private access in Person

    ```


    How, come ask? It turns out that members greatly impact inheritance. In fact,
    only those members that are visible to class as per the rules of access modifiers
    are inherited in a subclass. Remember that a private member is not visible from
    anywhere except the declaring class itself. Thus, a subclass cannot inherit a
    private member of the class at all. That is why Employee will not inherit name
    from Person if you make private.


    With the above rule in mind, let us examine the impact of access modifiers on
    inheritance.


    +   **private** - As explained above, private members are not inherited by a subclass.

    **default** - Since a member with default access is visible only to a class in
    the same package, it can only be inherited in the subclass if the subclass belongs
    to the same package.

    **protected** - This access modifier is actually built to overcome the restriction
    imposed by the default modifier. Recall that in addition to being visible to all
    classes of the same package, a protected member of a class is visible to another
    class that belongs to a different package if that class is a subclass of this
    class. Thus, even a subclass that belongs to another package inherits protected
    members of the super class.

    **public** - public members are always inherited by a subclass.


    For example, let''s say you are designing an application that has three kinds
    of accounts: CheckingAccount, SavingsAccount, and RetirementAccount. All three
    classes need to have an account number and methods for checking balance. Besides
    these common features, each of these account type also have features that are
    specific only to that account type. The CheckingAccount has an overdraftLimit,
    the SavingsAccount has an interestRate, and the RetirementAccount has a maturityDate.
    The figure below shows the hierarchy of the classes.'
