  md: "# 12.3.3 Valid combinations of access modifiers, abstract, final, and static\n\
    \n# Impact of access modifiers on abstract and final\n\nThe usage of abstract\
    \ makes sense only in the presence of inheritance. If something is never inherited\
    \ then there is no point in talking about whether it is abstract or final. You\
    \ also know that a private member is never inherited. Based on this you can tell\
    \ what will happen with the following code:\n\n```\nabstract class Sofa {\n  \
    \  private abstract void decline();\n}\n```\n\nThat's right. The compiler will\
    \ reject the code with the message, \"illegal combination of modifiers: abstract\
    \ and private\". Because a private method is never inherited, there is no way\
    \ any subclass of Sofa can provide an implementation for this abstract method.\n\
    What if the decline method were protected or final? It would have been ok in that\
    \ case because it is possible for a subclass to inherit methods with default access.\n\
    \nLet us see what happens when you make a private method final:\n\n```\nclass\
    \ Sofa {\n    private final void decline();\n}\n```\n\nWhat do you think will\
    \ happen? It won't compile, you say? Wrong! No, a private method is, practically,\
    \ already final! The compiler accepts the above code because there is no contradiction\
    \ between private and final. Marking a private method as final is, therefore,\
    \ not wrong but rather redundant.\n\n# abstract and static\n\nThe keyword is strictly\
    \ about overriding and static methods can never be overridden. Therefore, abstract\
    \ and static methods can never go together. Thus, the following code will not\
    \ compile:\n\n```\nabstract class Bed extends Furniture {\n    static abstract\
    \ void getwidth();\n}\n```\n\nThe compiler will generate an error message, \"\
    illegal combination of modifiers: abstract and static\".\n\n# final and static\n\
    \nAlthough a static method cannot be overridden, it is nevertheless inherited\
    \ by a subclass and can be hidden by the subclass. I will know the difference\
    \ between overriding and hiding in detail later on but for now, just remember\
    \ that final prevents a subclass from hiding the super class's static method.\
    \ Thus, the following code will compile:\n\n```\nclass Bed {\n    static final\
    \ int getwidth()\n}\n```"
