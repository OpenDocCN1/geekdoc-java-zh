  md: "```\nclass Book{\n  int name;\n  static void printName1() {\n    System.out.println(this.name);\
    \ //will not compile\n    System.out.println(name);//same as above. this will\
    \ not compile\n  }\n  void printName2() {\n    System.out.println(this.name);\
    \ //this is fine.\n    System.out.println(name);//same as above. this is fine.\n\
    \  }\n}\n```\n\nIn the code, the compiler realizes that name is an instance variable\
    \ and, tries to access it through this, i.e., this. Because this is not available\
    \ in printName1, it generates an error. There is no issue with printName2 because\
    \ printName2 is an instance method and this is available in an instance method.\n\
    \nRemember that you doesn't explicitly use the variable this to access instance\
    \ members. You need to use it only if there is a local variable with the same\
    \ name declared in the method and you want to refer to the instance variable of\
    \ the local one. this is used to \"shadow\" an instance if it is shadowed by a\
    \ variable of the same name.\n\nA common misunderstanding among beginners is that\
    \ a static method cannot access fields of a class. This misunderstanding exists\
    \ because they see or hear this in many places; however, it is an incomplete statement.\
    \ The correct statement is a static method cannot access an instance without specifying\
    \ the instance it wants to access. It will be clear when you use the following\
    \ code:\n\n```\nclass Book{\n  int name;\n  static void printName() {\n    Book\
    \ b1 = new Book();\n    Book b2 = new Book();\n    System.out.println(b1.name);//this\
    \ will compile fine\n  }\n}\n```\n\nIn the code above we are accessing the instance\
    \ variable name from a static method. Notice that there are instances of Book.\
    \ Each instance has its own copy of the variable name. But because we are using\
    \ the reference b1 to access name, the compiler knows exactly name we intend to\
    \ access. It knows that to access the name field of the instance pointed to by\
    \ the reference variable b1. That is why there is no problem. This shows that\
    \ an instance field can be accessed from a static method as long as we specify\
    \ exactly the instance we want to access.\n\n# 10.5.6 Class loading and static\
    \ initializers\n\nRecall that executing a program or a class essentially means\
    \ executing the \"main\" method of class. But before the JVM can pass the control\
    \ to this method, it has to find the class and \"load\" the class into its memory.\
    \ The loading of a class is done by a class loader. Don't worry, you don't need\
    \ to worry about class loaders and the whole class loading process for the exam.\
    \ But you do need to know one thing that happens to the class after the class\
    \ is loaded and before the main method is invoked."
