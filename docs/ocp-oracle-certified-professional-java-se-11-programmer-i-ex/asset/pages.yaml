  md: 'requires and provides, variety from team to team and build tool to build tool.
    Java 9 takes the best of the practices prevalent in the industry and formalizes
    them into the Module System.


    Besides formally specifying a structural design for applications, Java 9 also
    includes new tools and enhances existing tools to help developers package their
    code as modules.


    # Package vs Module


    You may be wondering at what point packages fit into this picture. After all,
    we have been using packages to organize our Java code since well. Packages still
    play the same role. They are still used to organize our code at a finer level.


    Conceptually, a package creates a namespace where all of the code required to
    implement a particular functionality resides. It is means to reduce the size of
    the code contained in a class by separating the logic into multiple related classes.
    This helps in reading, understanding, and navigating the code. But this is from
    the perspective of the developer of the functionality and not from the perspective
    of the users of functionality. The users of functionality are not interested in
    how the code is organized. They are interested in knowing what it takes to use
    that. Users simply want to use the functionality as a black box. Unfortunately,
    packages do not provide this information. Developers have relying on informal
    methods such as naming jars according to their conventions and adding release
    notes to deliver this information.


    This is where module comes in. A module provides a way to deliver functionality
    in a single artifact that includes the code but also the information on the services
    that the code provides and any dependencies that it may need.


    Thus, if you are a developer of some functionality, you would still organize your
    code into packages. But you would then package any of your classes (and any other
    resources such as image files, xml files, or property files) to implement this
    functionality into a single deliverable with a description of your functionality
    and its dependencies in a prescribed format as the module. In other words, modules
    are not an alternative to packages but are on top of packages.


    The Java module system is a fairly large topic with dedicated books written to
    cover it. However, the OCP Java SE 11 focuses only on the basics of the Java module
    system.


    > There has been a fear of criticism of the Java module system in the industry.
    Even though Java Modules is an advanced topic, Oracle has included in the Part
    1 Exam of the OCP certification, they tell me that they are quite serious pushing
    it. For this reason, I will focus mostly on how to work with it from the exam
    perspective instead of getting into the analysis of its merits and demands. However,
    if you are going to face technical interviews, you should go through online discussions
    and articles that talk about the problems associated with the Java module system.


    # 16.1.2 Declaring a module


    Since a module is a logical unit of functionality from the users'' perspective,
    it is best to identify the functionality that we want to deliver as a module.
    For example, let us say we are developing an application for finance and one of
    its functions is to compute simple interest. We want to deliver this simple interest
    calculator as a module.


    # Naming a module'
