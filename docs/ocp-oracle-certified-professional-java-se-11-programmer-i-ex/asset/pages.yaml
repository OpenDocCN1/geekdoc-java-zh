  md: "```\nmodule simpleinterest{\n  requires calculators;\n}\n```\n\nThe requires\
    \ clause is the counterpart of the exports clause. A requires clause makes the\
    \ other module \"readable\" to this module. This is also known as module readability.\
    \ In other words, all the packages exported by the other module can be accessed\
    \ by a module that declares its dependency on that module using the requires clause.\n\
    \nThe purpose of having a requires clause is to make the dependency of a module\
    \ explicitly clear to the users. The users of a module need not go through the\
    \ import statements of each class of a module to know which other modules this\
    \ module depend on. All they need to check the module-info.\n\nWe can now define\
    \ InterestCalculator.java as follows:\n\n```\npackage simpleinterest;\nimport\
    \ calculators.InterestCalculator;\npublic class simpleInterestcalculator implements\
