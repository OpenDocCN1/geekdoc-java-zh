    # Type of a conditional expression


    Now that we have established that a conditional expression must return a value,
    all that is left to discuss is

    type of the value that it can return. It can return values of three types: boolean,
    numeric, and reference. (There

    are no other types left for that!)


    If the second and third operands are of type boolean (or Boolean), then the return
    type of the ternary

    expression is boolean. For example:


    ```

    int a = 1, b = 2;

    boolean flag = a == b ? true; //ternary expression that returns a boolean

    ```


    If the second and third operands are of numeric types, then the return type of
    the ternary

    expression is the value of the two numeric types. For example, double d = a ==
    b ? 5;

    10.0; Observe that the second operand is of type int while the third is type double.
    Since double is

    wider than int, the type of this expression is double. You cannot, therefore,
    nor int d = a == b =

    5 : 10: assign a double value to an int variable cannot.


    If the second and third operands are neither of above, then the return type of
    the ternary expression is

    reference. For example,

    object str = a == b ? "good bye" : "hello"; Here operands 2 and 3 are neither
    numeric nor

    boolean. Therefore, the return type of this expression is a reference type.


    The first two are type string while the third needs a bit more discussion. Consider
    the following line

    of code:


    ```

    Object obj = a == 5 ? "hello";

    ```


    Here, the second operand is a numeric type while the third is of type String.
    Since this fails in the

    category, the return type of expression a == 5 ? "hello"; must be a reference.
    The question for

    compiler what should be the type of the reference that is returned by the expression.
    One operand is an

    int, which can be cast to any object and another is a string object. If the boolean

    evaluates to true, the expression will return Integer object if the condition
    evaluates to

    false, the expression will return String object. Remember that the compiler cannot
    execute any code and

    so determine what the expression will run at runtime. Thus, it needs to pick a
    type that is compatible

    with both kinds of values. The compiler solves this problem by deciding to pick
    the most common super

    class of the two types as the type of expression. In this case, class is java.lang.Object.
    By

    selecting the most common superclass class, the compiler ensures that irrespective
    of the result of the

    condition, the value returned by this expression will always be of the same type,
    i.c. java.lang.Object, in

    this case. Here is an example, where the most common super class is not Object:


    ```

    Double d = 10.0;

    Byte b = 1;

    Number n = a === b ? d : by;

    ```'
