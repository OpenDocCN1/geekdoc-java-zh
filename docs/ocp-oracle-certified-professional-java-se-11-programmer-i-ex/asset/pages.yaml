  md: '# 2.3 Create and import packages


    2.3.1 The package statement


    Every Java class belongs to some or the other package. The name of this package
    is specified using the package statement contained in a source file. There can
    be the most one package statement in the entire source file, and if present, it
    must be the first statement (excluding comments, of course) in the file. All top
    level types defined in this file belong to this package. If there is no package
    statement in a Java file, the classes defined in that file belong to an unnamed
    package which is also known as the "default" package. In other words, if you have
    two Java files without any package statement, classes defined in those two files
    belong to the same unnamed package.


    Important points about the unnamed package


    +   1. The unnamed package has no name. Duh!

    2. Default is not the name of the unnamed package. There is no package named default.
    You cannot create a package named by specifying default as the package name for
    your class though default is a keyword.

    3. Since the unnamed package has no name, it is not possible to refer to this
    package. In other words, it is not possible to import classes belonging to the
    unnamed package into classes belonging to another package. You can''t import *;
    in your Java file. This is one reason why it is not recommended to create classes
    without a package statement.


    You can name your package anything but it is recommended that you use the reverse
    domain format for package. For example, if you work at Amazon, you should start
    your package name with com.amazon. To make your class unique across the globe.
    For example, if the name of your group is sales, and the name of the application
    is itemMaster, you might name your package com.amazon.sales.itemMaster. If the
    name of your class is Item, your Item.java source file will look like:


    ```

    package com.amazon.sales.itemMaster;

    public class Item{

    ```


    > Although you can use non-ascii characters in your package name, the exam will
    not ask you questions about package names with such characters.


