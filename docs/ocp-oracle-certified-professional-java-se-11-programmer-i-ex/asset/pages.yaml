  md: 'The above statement creates an instance of java.lang.Object class. Since a
    class is just a template...a cookie cutter, if you will, which is used to cut
    objects out of free memory, when you use the new keyword on a class, the JVM takes
    a chunk of free memory and formats that into the various fields defined in the
    class. This formatted chunk of memory becomes an object of the class. You can
    create as many instances as you want using this template.


    Depending on how a class has been defined, you may be able to (or required to)
    pass argument(s) while instantiating an object. For example, the following statement
    creates an instance of String class with a string parameter:


    ```

    new String("hello");

    ```


    The new keyword actually causes a "constructor" of the class to execute. The constructor
    is responsible for initializing the data members of the object. You will see the
    exact mechanism of object creation in the "Creating and Methods" chapter.


    As discussed earlier, a reference doesn''t contain the actual object but just
    the address (or reference) to the object. This address is active only at the time
    of instantiation of an object and if you want to make use of that object later,
    you must save that somewhere. When you store it in a variable, like this:


    ```

    String str = new String("1234");

    ```


    Since the address of the object is saved in str variable, you can invoke methods
    on this object using the str variable. If you don''t save the address of the object
    in a variable that you can, that object will be lost after creation. In some cases,
    you may want exactly that. You may want to create an object and forget about it
    after that. In such a case, there is no need to save its address in a variable.


    > You may see the term "instantiate a class" being used in articles and instead
    of "instantiate an object". Both the terms mean the same thing and are equally
    acceptable. Since official exam objectives use the term "instantiate an object",
    I have used the same. Similarly, the words "create" and "instantiate" are also
    used interchangeably in the context of an object. So, "create an object" and "instantiate
    an object" mean the same thing.


    # Assigning objects to reference variables


    Since Java is a strictly typed language, you cannot assign just any object to
    a reference variable of any type. The rule regarding object assignment is actually
    quite simple but requires an understanding of inheritance and polymorphism. Since
    I haven''t discussed these concepts yet, assume that if the type of the variable
    is A, then only an object of type A or a sub-type of A can be assigned to that
    variable. For example, Object obj = new String(); is valid because String is a
    subtype of Object but String str = new Object(); is not valid. In later chapters,
    you will see how this rule applies to interfaces, abstract classes, and variables.'
