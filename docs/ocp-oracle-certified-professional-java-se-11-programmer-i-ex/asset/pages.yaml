  md: "You have now seen all the steps, from loading the class to executing a constructor\
    \ of the class, that a JVM takes to create an object of a class. Here is the order\
    \ of these steps for quick reference:\n\n+   1. If there is a super class, initialize\
    \ static fields and execute static initializers of the super class in the order\
    \ of their appearance (performed only once per class)\n2. Initialize static fields\
    \ and execute static initializers of the class in the order of their appearance\
    \ (performed only once per class)\n3. If there is a super class, initialize the\
    \ instance fields and execute instance initializers of the super class in the\
    \ order of their appearance\n4. Execute super class's constructor\n5. Initialize\
    \ the instance fields and execute instance initializers of the class in the order\
    \ of their appearance\n6. Execute class's constructor\n\nThe following example\
    \ illustrates the above steps:\n\n```\nclass A {\n    static { System.out.println(\"\
    In A's static initializer\"); }\n    A() { System.out.println(\"In A's constructor\"\
    ); }\n    { System.out.println(\"In A's instance initializer\"); }\n}\n\npublic\
    \ class B extends A {\n    static { System.out.println(\"In B's static initializer\"\
    ); }\n    { System.out.println(\"In B's instance initializer\"); }\n    B() {\
    \ System.out.println(\"In B's constructor\"); }\n\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"In B.main()\");\n        B b = new B();\n\
    \        B b2 = new B(); //creating B's object again\n    }\n}\n```\n\nThe following\
    \ output is generated when class B is run:\n\nIn A's static initializer\nIn B's\
    \ static initializer\nIn B.main()\nIn A's instance initializer\nIn A's constructor\n\
    In B's instance initializer\nIn B's constructor\nIn A's instance initializer\n\
    In A's constructor\nIn B's instance initializer\nIn B's constructor\n\nYou should\
    \ observe that initializers of A and B are invoked in the following points:\n\n\
    +   1. static initializers of A and B are invoked before B'main() is executed\
    \ because the JVM needs to load the class before it can invoke a method on it.\n\
    2. Static initializers of A and B are invoked only once even though two objects\
    \ of B are created.\n3. Instance initializer of A is executed before B's constructor\
    \ even though the instance initializer appears after the constructor in A's code."
