  md: '# Introduction


    I believe you already got your feet wet with Java programming and are now getting
    serious about your goal of being a professional Java programmer. First of all,
    let me commend your decision to consider Java certification as a step towards
    achieving that goal Oracle''s Java Certification will be very rewarding. Regardless
    of whether you get extra credit for being certified in your job hunt or not, you
    will be able to speak with confidence in technical interviews and the concepts
    that certification will make you learn, improve your performance on the job.


    The Java SE 11 Programmer II exam (Exam code IDB-815), aka OCPJP-I, is the first
    of the two exams that you need to pass in order to become an Oracle Certified
    Professional - Java SE 11 Developer. This exam focuses on the fundamental aspects
    of Java and is not particularly tough to pass. If you go through a decent book
    and practice a good mock exam, you should be able to pass it with a couple of
    months of preparation. However, the topics covered in this certification form
    the groundwork for the second step of professional certification, i.e., the Java
    SE 11 Programmer II exam (Exam code IDB-816), aka OCPJP-II exam. The OCPJP-II
    is a very tough exam. is a lot tougher than the OCPJP-I exam. You will have trouble
    passing if your fundamentals are weak. For reason, it is very important not to
    think of just passing that exam with the bare minimum marks required (63%) but
    to set a score of 90% as your target. My objective with this book is to help you
    achieve 90% plus score on the OCPJP-I exam.


    About the mock exams


    Mock exams are an essential preparation tool for achieving a good score on the
    exam. However, having created mock exams for several certifications, I can tell
    you that creating good quality questions is neither easy nor quick. Even after
    multiple reviews and quality checks, it takes years of use by thousands of users
    for the questions to shed all ambiguity, errors, and mistakes. I have seen users
    come up with plausible interpretations of a problem statement that we could never
    imagine. A bad quality exam will easily eat up your valuable time and may shake
    your confidence. For reason, I have not created mock exams for this book. We have
    a team that specializes in developing mock exams and I will recommend you to buy
    the exam simulator created by this team from our website Enthuware.com. is priced
    quite reasonably (only 9.99 USD) and has stood the test of time.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Who is this book for?


    This book is for Java SE 11 Programmer - I exam (1Z-015) takers who know how to
    program and are at least aware of the basic Java terminology. Before proceeding
    with this study guide, please answer the following questions. Remember that you
    do not have to be an expert in the topic to answer yes. The intention here is
    to check if you are least familiar with the basic concepts. It is okay if you
    don''t know the details, the syntax, or the typical usage. I will go through all
    in this book, but I will not teach the basics of programming in this book.


    +   1. Do you know what OS, RAM, and CPU are?

    2. Do you know what a command line is?

    3. Do you know basic OS commands such as dir, cd, and mkdir (or if you are a Linux/Mac
    user - Do you know how to use ls, cd, and mkdir)?

    4. Can you write a simple hello world program in Java and run it from the command
    line?

    5. Do you know what variables are?

    6. Do you know what loops (such as for and while loop) are and used for?

    7. Are you aware of arrays?

    8. Are you aware that Java has classes and interfaces?

    9. Are you aware that classes have methods?

    10. Have you installed JDK 11 on your computer?


    If you answered no to any of the above, this book is not for you. It would be
    better if you go through a programming book or a computer book for beginners first,
    and then come back to this book. Alternatively, be open to google a term if you
    are not sure about it any time before proceeding further reading this book.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 0.2 How is this book from others?


    With so many certification books around, I think this question is worth answering
    at the outset. This book is fundamentally different from others in the following
    respects:


    +   **Focus on concepts** - I believe that if you get your basic concepts right,
    everything falls in place nicely. While working with Java Beginners, I noticed
    several misconceptions, misunderstandings, and bad cuts that would affect their
    learning of complex topics later. I have seen so many people who manage to pass
    the exam but fail in technical interviews because of this reason. In this book,
    I explain the important stuff from different perspectives. This does increase
    length of the book but a hit which could be worth your time.


    Sural cuts** - Some tries to stick very close to the exam objectives. So that
    a topic remains nowhere close to reality and the reader is left with imperfect,
    incorrect knowledge. This strategy is good for answering multiple choice questions
    appearing on the OCPJP-I exam but it bites the reader during technical interviews
    and while writing on the job. I believe that actually learning the concepts correctly
    is equally important. For this reason, I go beyond the scope of exam objectives
    as, when required. Of course, I mention it clearly when doing so.


    Exercises** - "Write a lot of code" is advice that you will hear a lot. While
    it seems quite an easy task for experienced programmers, I have observed that
    beginners are clueless about what exactly they should be writing. When they are
    not sure about what a test program should do, they skip this important learning
    step. In my training sessions, I give code exercises with clear objectives. I
    ask you to write code that uses the concepts taught in that topic or chapter.


    Besides, in the real exam generally requires knowledge of multiple topics. The
    following is a typical code snippet appearing in the exam:


    ```

    int i = 10;

    Long n = 20;

    float a = 10.0;

    String s = (String)i+n++;

    ```


    To determine whether this code is correct or not, you need to learn four topics
    - wrappers, operators, String class, and casting. Thus, presenting an MCQ at the
    end of a topic, that focuses only on one topic, creates a false sense of confidence.
    I believe it is better to focus on realistic MCQs at the end of your preparation.


    +   **Not being pedantic** - If you are preparing for the OCPJP-I exam, I believe
    you have already been through many academic exams in your life. You already know
    what to expect in an exam. So, I won''t advise you on the amount of water you
