  md: '# 12.1 Create and use subclasses superclasses


    # 12.1.1 Understanding Inheritance


    In general terms, a class extends another class, we say that the class inherits
    from the other class. But this is a very vague view of inheritance. It is important
    to understand what exactly this class inherits from the other class and what exactly
    inherits something.


    There are two things that a class contains - the instance fields in the class,
    i.e., state, the instance methods that provide behavior to the class, i.e., implementation.
    Furthermore, a class, on its own, also defines a type. Any of these three can
    be inherited by extending the class. Thus, inheritance could be of state, or could
    be of


    When a class inherits something, it implies that it automatically gets that thing
    without needing to define it in the class. This is much like real life objects.
    When you say that a Poodle is a Dog, or a Beagle is a Dog, you imply that it has
    a tail that barks. So does a Beagle? You don''t have to convey this information
    explicitly with a Poodle or a Beagle. In other words, both a Poodle and a Beagle
    inherit the barking from Dog. Note that Poodle and Beagle do not contain a Dog.
    Poodle is a Dog. Beagle is a Dog. Being is something very different from containing.
    If Poodles and Beagles contain a Dog, then both of them would bark exactly in
    the same way, like a Dog. But you know that they don''t bark the same way. Both
    of them do but they bark differently.


    # Inheritance of state


    Only a class can contain and store state, only a class can extend another class.
    Furthermore, Java restricts a class from extending more than one class and that
    is why it is often said that Java does not support multiple inheritance. However,
    technically, it would be more precise to say that Java does not support multiple
    inheritance of state.


    # Inheritance of implementation


    Before Java 8, only classes were allowed to have implementation. Starting with
    version 8, Java allows interfaces to contain implementation in the form of "default"
    methods. Thus, a class can inherit implementation by extending a class and/or
    implementing interfaces. This allows a class to inherit implementations from more
    than one types. This is one of multiple implementation inheritance. However, due
    to the default methods are inherited in a class, it is still not possible for
    a class to inherit more than one implementation of a method in Java. I will talk
    more about default methods later.


    # Inheritance of type


    Java allows you to define a type using an interface as well as a class (and an
    enum but that is not relevant to this discussion). Thus, a class can inherit behavior
    by extending a class and/or implementing an interface. Since Java allows a class
    to implement multiple interfaces, it can be said that Java supports multiple inheritance
    of type.


