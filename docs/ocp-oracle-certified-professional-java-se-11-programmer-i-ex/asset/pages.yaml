  md: "# 12.2 Using super and this to access objects and constructors\n\n# 12.2.1\
    \ Object initialization revisited\n\nRecall that in the \"Create and overload\
    \ constructors\" section of the \"Working with Methods and Encapsulation\" chapter,\
    \ I outlined the four steps a JVM takes when instantiating a class. Let's see\
    \ how these steps are impacted when inheritance is involved.\n\n+   1. The first\
    \ step was to load and initialize the class if it is not already loaded and initialized.\n\
    \n+   2. The second step was to allocate the memory required to hold the instance\
    \ variables of the object in the heap space. Since the instance variables defined\
    \ in a super class are also included in object of a subclass (whether they are\
    \ accessible to the subclass or not a different matter), the memory allocated\
    \ by the JVM for a subclass object must include space for storing instance variables\
    \ of the super class as well.\n\n+   3. The third step was to initialize these\
    \ to their default values. This means the inherited variables also need to be\
    \ initialized to their default values.\n\n+   4. The fourth step was to give instance\
    \ an opportunity to set the values of the instance variables as per the business\
    \ logic of class by executing code within instance initializers and constructors.\
    \ This step gets a little more complicated when the class extends another class.\
    \ Remember that the whole purpose of inheriting features (features as well as\
    \ methods) of a superclass is for the subclass to be able to use those features!\
    \ It can use these features even at the time of its initialization. But to be\
    \ able to do, those features have to be initialized first. This means that subclass\
    \ cannot initialize its own features unless features of superclass have been initialized.\n\
    \nYou can see here that the superclass cannot be initialized before the superclass\
    \ of the superclass is initialized and so on until there is no super class. left\
    \ Object class because Object is the root of all classes and it is the only class\
    \ that has no super class.\n\nYou have seen that the initialization is triggered\
    \ when you try to create an instance of that class using the new keyword. When\
    \ the JVM encounters the new keyword applied to a class, it invokes the appropriate\
    \ constructor of class. But as discussed above, the execution of this constructor\
    \ cannot proceed until the initialization of the superclass is complete.\n\n#\
    \ 12.2.2 Initializing super class using \"super\"\n\nTo ensure the initialization\
    \ of the fields inherited from the superclass, a constructor must first invoke\
    \ exactly one of its superclass's constructors. This is done using the super<arguments>\
    \ syntax. For example:\n\n```\nclass Person {\n  String name;\n  Person(String\
    \ name){\n    this.name = name;\n  }\n}\n\npublic class Employee extends Person{\n\
