  md: '# 4.6 Explain objects'' lifecycles


    # 4.6.1 Life cycle of an Object


    You know that objects are always created in heap space. Since every class ultimately
    extends from java.lang.Object, even if a class does not define any instance variable
    of its own, it will inherit the ones defined in the Object class. Thus, every
    object will take some space in the heap. Since heap space is not unlimited, until
    a limited number of objects are stored in the heap, it is possible to run out
    of heap space if we are creating projects we need. Must, therefore, have some
    way of getting rid of objects when we don''t need anymore, right? That is exactly
    what some languages like C++ provide. C++ lets you create as delete objects. You
    allocate and deallocate memory as you please. In other words, it makes the programmer
    "manage" the heap space.


    In Java, the heap space is managed by the JVM. There is no way for a programmer
    to directly manipulate the contents of this space. The only thing programmer can
    indirectly affect this is to create an object. Java does not let you "delete"
    an object. There is no way to "deallocate" the memory consumed by objects. The
    question that one may ask is how in the world then a program function if the memory
    runs out of objects that are not needed?


    Recall our discussion about object references. An object can be accessed only
    through its reference. If you have a reference to an object, you can read from
    or write to it, or invoke methods. You can pass this reference in a variable.
    You can make multiple copies of the same reference. You can pass it to other methods
    as well. You can think of it like a fish hooked on the end of a fishing line.
    As long as you hold the fishing rod, you can get of the fish. If you lose the
    rod, you lose the fish. Similarly, if you lose all the references to an object,
    there is no way to get to that object anymore. The JVM uses this fact to manage
    the heap space.


    The JVM keeps all of the references to an object and as soon as it realizes that
    there are no references to that object, it concludes that this object is not required
    anymore and is basically "garbage". It then makes arrangements to reclaim the
    space occupied by the object. This arrangement for reclaiming the space occupied
    by objects is aptly called "garbage collection". This is essentially what automatic
    memory management is, because as you the programmer focuses only on creating objects
    and using them as and when required. The JVM cleans up the memory held by objects
    automatically in the background.


    With the above discussion in mind, it should be easy to visualize the life cycle
    of an object. An object comes alive when it is created.


    > An object can be created in three ways - using the new keyword, deserialization,
    and by cloning. Deserialization and cloning are not on the OCP Java 11 Part 1
    exam.


    It remains alive so long as it is referenced from an active part of a program.
    The object is destroyed or inaccessible once there are no references pointing
    to it. No longer the JVM destroys, i.e., reclaims the memory by the object during
    garbage collection.


    # 4.6.2 Garbage Collection


    Garbage Collection'
