  md: "# Missing else\n\nAs we saw earlier, the first else is not mandatory in an\
    \ if statement. You can just the if statement. But when coupled with bad indentation,\
    \ an if statement may become hard to understand as shown in the following code:\n\
    \n```\nboolean flag = true;\nif(flag)\n    System.out.println(\"true\");\nelse\n\
    \    System.out.println(\"false\");\n```\n\nThe above code prints true and false\
    \ because there is no else in this code. The second println statement is in an\
    \ independent block and is not a part of the if statement.\n\n# Dangling else\n\
    \n\"Dangling else is a well known problem in programming languages that have if\
    \ as well as if-else statements. It is illustrated in the following piece of code\
    \ that has two parts but only one else:\n\n```\nint value = 3;\nif(value == 0)\n\
    \    System.out.println(\"b\");\nelelse\n    System.out.println(\"c\");\n```\n\
    \nThe question is which should the else be associated? There are two equally reasonable\
    \ answers to this question as shown below:\n\n```\nint value = 3;\nif(value ==\
    \ 0) {\n    if(value == 1)\n        System.out.println(\"b\");\n}\nelelse\n  \
    \  System.out.println(\"c\");\n```\n\nand\n\n```\nint value = 3;\nif(value ==\
    \ 0) {\n    if(value == 1)\n        System.out.println(\"b\");\n    else\n   \
    \     System.out.println(\"c\");\n}\n```\n\nIn the first interpretation, else\
    \ is associated with the first if, while in the second interpretation, else is\
    \ associated with the second if. If we go by the first interpretation, the code\
    \ will print c, and if we go by the second interpretation, the code will not print\
    \ anything. For a compiler, both are equally valid to interpret the code, which\
    \ makes the code ambiguous.\n\nSince neither of the interpretations is more correct\
    \ than the other, Java language designers broke the tie by deciding to go with\
    \ the second interpretation, i.e., the else is to be associated with the nearest\
    \ if. That is why the above code does not print anything as there is no else part\
    \ associated with the first if. Based on the above"
