  md: "# 1. Stack and Heap\n\n# 1.6 Stack and Heap\n\nWhen you execute a program,\
    \ the Operating System (OS) allocates memory to that program. Memory is used by\
    \ the program to keep its variables and data. For example, whenever you create\
    \ a variable, its value needs to be preserved as long as the program wants to\
    \ use it. The program uses its allocated memory to keep it. A program may ask\
    \ the OS for memory if it requires and the OS will oblige if the OS has free memory\
    \ available. A program may also release memory that it does not want back to the\
    \ OS. Once the OS gives out a chunk of memory to that, it is the responsibility\
    \ of the program to manage it. When the program ends, the memory is released and\
    \ goes back to the OS. This is basically how any executable program works.\n\n\
    Now, think about your situation. A program that prints \"hello\" 100 times. Something\
    \ like this:\n\n```\npublic class Test{\n    private String str = new String(\"\
    hello\"); //using new is not a good way to\n    public void print(){\n       \
    \ int i = 0;\n        while(i++<100) {\n            System.out.println(str);\n\
    \        }\n    }\n    public static void main(String[] args) {\n        Test\
    \ t = new Test();\n        t.print();\n    }\n}\n```\n\nIn the above case, it\
    \ is the main method that calls the print but there could be another class, which\
    \ could make use of the same method to print hello 100 times. When the print method\
    \ is called, the variable i keeps track of the number of times the while has iterated.\
    \ This variable needs to be kept somewhere as long as the print method runs. Similarly,\
    \ the variable str will print the string that you want to print method.\n\nThe\
    \ question is, what happens when the print method ends? The variable i has its\
    \ purpose and is not required anymore. It is not used anywhere except within this\
    \ method. Therefore, it need not be kept longer than the execution of the method.\
    \ But the variable str still can be used whenever the print method is called.\
    \ The value of str needs to be kept for the lifetime of the print method.\n\n\
    It should now clear that a program needs two kinds of memory to keep track. For\
    \ temporary stuff that can be cleaned up as soon as a method ends and for permanent\
    \ stuff that remains in use longer than a single method the space for storing\
    \ this is called Stack and the space for storing all stuff is called Heap. The\
    \ reason why they are called Stack and Heap will be clear.\n\nIn Java, each thread\
    \ has a fixed amount of stack. In the example above, when you execute the program,\
    \ a thread is created when this thread invokes the method, all parameters and\
    \ temporary variables are created on this stack. In the example, the main method\
    \ creates one reference variable args and inside the method it creates another\
    \ reference variable t. (Note that both args and t are reference variables, they\
    \ contain the address of the location where each object is stored to by respectively).\
    \ Therefore, the stack fills up by the amount of space required by these reference\
    \ variables. Before the main method ends, it calls the print method on the reference\
    \ t. Since print is instance method, a variable named \"this\" is automatically\
    \ put on the stack for so that the method can access the instance fields on this\
    \ object. The variable this is also a reference variable and contains the address\
    \ of the location where the Test object resides. The print"
