  md: "Recall the rule of covariant returns. So, it is **incorrect**.\n\nOption **C**\
    \ is **incorrect** because of a mismatch in the generic types of the method parameters\
    \ and the return type as explained in this option.\n\nObserve that in this option,\
    \ after erasure (i.e. at runtime), the base class and subclass methods will have\
    \ the same signature and would make it a valid override. However, this is exactly\
    \ what confuses the compiler. The compiler understands that the signatures of\
    \ the given methods are the same name after erasure (which means it is an override\
    \ at runtime) but not the same type at compile (which means it is not an override\
    \ at compile). This contradiction causes the compiler to reject the code. There\
    \ is one exception to this rule, which is not important for the base class but\
    \ good to know anyway; I will explain it in the note below.\n\nOption **D** is\
    \ **correct** because the method signatures and the subclass method follow the\
    \ rule of covariant returns. **ArrayList** is a narrower type than **List** as\
    \ **ArrayList** implements **List**.\n\nOption **E** is **correct** because the\
    \ parameter type of the method in subclass is different. The subclass, therefore,\
    \ has two methods (one of its and one inherited) with the same name but different\
    \ parameter types. Thus, it is a valid override.\n\nOption **F** is **incorrect**\
    \ because it is a valid override and not a valid overload.\n\nOption **G** is\
