  md: '# ## 1.10 Java Identifiers


    ### 1.10.1 Java Identifiers \u2135

    Java has specific rules to name things as variables, methods, and classes. All
    these names belong to a category of names called "identifiers".


    Java defines an identifier as an unlimited-length sequence of Java letters and
    Java digits, the first of which must be a Java letter. An identifier cannot have
    the same spelling as a Java keyword or a literal (i.e. true, false, or null).


    For example, the following variable names are invalid:


    ```

    int int; //int is a keyword

    String class; //class is keyword

    Account la; //cannot start with a digit

    byte true; //true is a literal

    ```


    Java identifiers include uppercase and lowercase ASCII letters A-Z (\u0041-\u005a),
    and a-z (\u0061-\u007a), and, for historical reasons, the ASCII underscore (\_
    or \u005f) and dollar sign (\$ or \u0024). The "Java digits" include ASCII digits
    0-9 (\u0030-\u0039).


    > Older versions of the exam tested candidates on identifying valid identifiers.
    However, the current exam has moved away a bit from making the candidate human
    compiler and does not include this topic. You should still have a basic idea what
    an identifier is though because this concept applies to all kind of names in Java.'
