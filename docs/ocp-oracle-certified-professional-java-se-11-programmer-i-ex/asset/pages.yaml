  md: '# 10.3.3 Returning a value from a method


    Just like parameters, returning a value from a method also uses "pass by value"
    semantics.


    In the case of primitives, a return statement can either return the value directly
    (e.g. return 100; return true; return ''a''; etc.) or the value of a variable
    (e.g. return i; where i is an int variable).


    In the case of objects, a return statement can either return the value of an explicit
    variable (e.g. return str; where str is a String variable) or the value of an
    implicit temporary variable that references the object (e.g. return "hello"; return
    new Student(); etc.). In both cases, it is really the address where the object
    is stored that is returned.


    What the caller does with the return value is irrelevant to the method that returns
    a value. The caller can either use the return value further in the code or ignore
    the return value altogether.'
