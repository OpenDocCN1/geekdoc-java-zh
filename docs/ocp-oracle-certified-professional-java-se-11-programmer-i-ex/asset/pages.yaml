  md: '# 1.7 Conventions


    # 1.7.1 What is a Convention?


    You add 15% tip to your bill at a restaurant. There is no law about it. Nobody
    is going to put you in jail if you add nothing for a tip. But you still do it
    because it is a convention. A lot of things in the world are based on convention.
    In India, you drive on the left side of the road. This is a convention. It has
    nothing to do with being technically correct. Indeed, people are driving on the
    right side of the road in the US. If you drive on the right side of the road in
    India, you will cause accidents because it is not what other people expect you
    to.


    It is the same in the programming world. As a programmer, you are part of the
    programmer community. The code you write is read by others while developing your
    code, your program will work fine without others. It saves time and effort by
    going through a piece of code if it follows conventions. It may seem ridiculous
    to name variables as i, j, or k, but that is the convention. Anyone looking at
    a piece of code with a variable i immediately assumes that it is a temporary variable
    meant to iterate through some loop.


    If you decide to use a variable i for storing some important program element,
    your program will work fine but it will take other people to realize that and
    will curse you for it.


    If you are still unconcerned about the importance of conventions in programming,
    let me put it another way. If I ask you to write some code in an interview and
    you use a variable hello as a loop variable, I will not hire you. I can assure
    that most interviewers will not like either. Conventions that are important.


    # 1.7.2 Conventions in Java


    Some of the most important conventions in Java are as follows:


    +   1. Classes uses "Camel Case" with an uppercase letter. For example, ReadOnlyArrayList
    is a good name but Readonlyarray is not.

    2. Package names are generally in lowercase but they may also be in camel case
    starting with a lower case. For example, datastructures is a good package name
    but DataStructures is not.

    3. Variable names start with a lowercase and may include underscores. For example,
    current_account is a good variable name.

    4. Naming - Names should be meaningful. A program with a business purpose should
    not have variables with names like Foo, Bar, or abc, such nominal names are used
    for illustrating or explaining code in some programs where name is not important.

    5. Package names use lowercase with a group name and application name. For example,
    if you work at Bank of America''s Financial Information Technologies and you are
    developing an application named FX Flotter, all your packages for this application
    may start with the name com.boa.fita.fblotter. The full class name for a class
    ReadOnlyArrayList could be - com.boa.fita.fblotter.datastructures.ReadOnlyArrayList
    The reason for using a reverse domain name is that it makes easy to come up with
    globally unique package names. For example, a developer in another group also
    creates his own ReadOnlyArrayList, com.boa.derivatives.datastructures.readonlyArrayList.
    There would be no problem if a third developer wants to use both classes in the
    same time in code because their full names are different. The important thing
    is that the names turned out to be different without any of the programmers communicating
    with each other about the name of their classes. Classes are unique globally because
    the name of domains of companies are unique globally.'
