  md: '# 3.1 Data types in Java


    Java has support for two kinds of Data.


    # 3.1.1 Data types and Variable types


    A data type is essentially a name given to a certain kind of data. For example,
    integer data is given the name "int" in Java. Boolean data is given the name "boolean"
    in java. Classifying data into different data types allows you to treat the data
    of the same kind in the same way. It also allows you to define a set of operations
    that can be performed on the same kind. For example, if you are given data type
    int and of type boolean, you know that you can do addition operation on the int
    data but not on the boolean data. Data type also defines the space required to
    store that kind of data. For example, a byte requires 8 bits to store while an
    int requires 32 bits.


    Data types are important for programming language because they allow you to tell
    the compiler the kind you want to work with. For example, when you say Int; you
    are telling the compiler that i is of type int. The compiler will then make possible
    to store data of one type into another type of variable. With few exceptions,
    it is not the difference in the amount of space required by different data types
    and/or of their compatibility.


    > Languages where the type of a variable is cannot change during run time are
    "statically typed" languages. Java is, therefore, a statically typed language.
    Languages that allow the data type of a variable to change at run time are dynamically
    typed languages. JavaScript can contain an integer value in one statement and
    may point to a String at the next statement. There are advantages and disadvantages
    to each approach but discussing would be out of scope. You should, however, read
    about online for interview purposes.


    By defining a variable of a certain type, you automatically get the right to perform
    operations that are valid for that type. For example, if i is defined to be int,
    the compiler will allow you to perform only mathematical and bitwise operations
    on this variable. If f is defined as a boolean, the compiler will allow you to
    perform only logical operations on this variable.


    Java has two fundamental kinds of data types: primitive and reference.


    Primitive types are designed to be used when you are working with raw data integers,
    floating point numbers, and booleans. Java by I, the Java compiler and the Java
    Virtual Machine) inherently knows what these data types mean, how much space they
    take up, and what can be done with them. You do not need to explain anything them
    to Java. Primitive types are the most basic building blocks of a Java program.
    You combine primitive types together in a class to build more complicated types.


    Reference types, on the other hand, are designed to be used when you are working
    with data that has a special meaning for that kind. For example, if you are developing
    an application for student management, you might define entities such as Student,
    Course, and Grade. Java has no knowledge of what Student, Course, and Grade mean.
    It doesn''t know how much space they take, what operations they support, or what
    properties they have. Java will expect you to define all these once. Once you
    define them, you can use them to implement the business logic of your application.
    When you write a class, interface, or enum, you are essentially defining a reference
    type. Reference types are built by combining primitive types and other reference
    data types.'
