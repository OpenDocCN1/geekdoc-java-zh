  md: "The question that you might ask at this point is about Person class. This class\
    \ has no extends clause and that it implicitly extends java.lang.Object. So where\
    \ is the call to Object's constructor in Person's constructor?\n\nGood question.\
    \ To call the super class's constructor is important that if a class's constructor\
    \ doesn't call any of the super class's constructors explicitly, the compiler\
    \ automatically inserts a call to the super class's constructor in the first line\
    \ of that constructor. The compiler doesn't check the constructors that the super\
    \ class has. It just assumes the presence of the default constructor and inserts\
    \ a call to that constructor. Thus, basically, Person's constructor is modified\
    \ by the compiler as follows:\n\n```\nclass Person{\n  String name;\n  Person(String\
    \ name){\n    super(); //-- inserted automatically by the compiler\n    this.name\
    \ = name;\n  }\n```\n\nThis means that Object's no-args constructor will be invoked\
    \ before proceeding with the execution of Person's constructor. Armed with this\
    \ knowledge, let us see what happens when I modify Employee as follows:\n\n```\n\
    public class Employee extends Person{\n  public Employee(String s) {\n    name\
    \ = s;\n  }\n  public static void main(String args[]){\n    Employee ee = new\
    \ Employee(\"Bob\");\n  }\n```\n\nAny thoughts? That's right. It won't compile.\
    \ Since Employee's constructor doesn't call super class's constructor explicitly\
    \ the compiler inserts a call to super(); on its own. This means Employee's constructor\
    \ really looks like this:\n\n```\npublic Employee(String s) {\n  super(); //inserted\
    \ automatically by the compiler\n  name = s;\n}\n```\n\nBut Person does not have\
    \ any no-args constructor! Recall that the no-args constructor is provided by\
    \ the compiler to class if the class does not define any constructor at all. In\
    \ this case, Person defines a constructor explicitly so the compiler does not\
    \ insert a no-args constructor in the Person class. Thus, Employee will fail to\
    \ compile.\n\nLet me make one more change. If I remove all constructors from Employee\
    \ class?\n\n```\npublic class Employee extends Person{\n  public static void main(String\
    \ args[]){\n    Employee ee = new Employee();\n  }\n```"
