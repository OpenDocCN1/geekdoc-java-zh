  md: '# java.util.Arrays class


    Java standard library includes a utility class named Arrays in package java.util
    that makes working with raw arrays a little easier. java.util.Arrays class contains
    a large number of static utility methods for manipulating any array object. Although
    not mentioned explicitly in the part 1 exam objectives, it is a good idea to browse
    through the JavaDoc API Arrays class to know about these methods. We have seen
    questions on the exam the compare and mismatch methods that were added to this
    class in Java 9, so I will discuss these methods in detail.


    # Arrays.compare and Arrays.mismatch


    The compare and mismatch methods are static methods and are meant to compare two
    arrays of the same types. They allow compare arrays of primitives as well as references
    of arrays, they are most useful for comparing primitive arrays. Efficient comparison
    of primitive arrays is a common requirement in data processing. Since these methods
    compare variants in classes, they can be able substantially better than custom
    code that compares elements individually. That is why the OCP Java 11 exam has
    questions on these methods.


    If you browse through the JavaDoc, you will notice a large number of variants
    for these methods. Although methods are heavily overloaded, practically there
    are only two flavors that you need to understand for the purpose of the exam.
    The rest are mere replicas; for each data type.


    Before getting into the details, you need to understand the meaning of the words
    that are used in the description for these methods.


    +   1. Lexographical - This means "dictionary order", i.e., the way in which words
    are ordered in a dictionary. If you need to determine which of the two words would
    come before the first position. For example, you would compare the words by letter
    starting from the first word. The word "children" will be smaller (and can be
    considered smaller) because the first four letters of the word are the same but
    the fifth letter in "children" (i.e. d) comes before (or is smaller than) the
    letter at the fifth position in "chill" (i.e. 1). Observe lengthwise, the word
    "children" is bigger than "chill" but not less while. For some reason, any array
    12345 will appear before an array containing 1235.


    +   2. Prefix - This refers to the common part of the two arrays. In the example,
    "chill" can be called the prefix while comparing "children" and "chill". Similarly,
    123 is the prefix of 12345 and 1235.


    Let''s check out the JavaDoc descriptions of compare and mismatch methods now.


    ```

    public static int compare(int a, int b) If two arrays share a common prefix then
    the lexicographic comparison is the result of comparing two elements, as if Integer.compare(int,int),
    at an index where the respective arrays is the prefix length. Otherwise, one array
    is a proper prefix of the other, and lexicographic comparison is the result of
    comparing the two arrays.

    ```


    A null reference is considered lexicographically smaller than a non-null array
    reference. Two null references are considered equal.


    It returns 0 if the first and second array are equal and contain the same elements
    in the same order; value less than 0 if the first array is lexicographically smaller
    than the second array; and a value greater than 0 if the first array is lexicographically
    greater than the second array.


    For example, the following code will print ia1 = -1 because the first array has
    smaller integer at index 2.


    ```

    int[] ia1 = { 0, 1, 2, 6 };

    int[] ia2 = { 0, 1, 5 };

    System.out.print(Arrays.compare(ia1, ia2)); //prints -1

    ```'
