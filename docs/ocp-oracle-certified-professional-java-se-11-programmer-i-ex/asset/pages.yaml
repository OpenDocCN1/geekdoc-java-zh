  md: "# 8.3 Create and use do/while loops\n\n# 8.3.1 The do-while loop\n\nA do-while\
    \ loop is similar to the while loop. The only difference between the two is that\
    \ in a do-while loop loop condition is checked after executing the loop body.\
    \ Its syntax is as follows:\n\n```\ndo {\n  statement(s);\n}while(Boolean_expression);\n\
    ```\n\nObserve that a do-while statement starts with a \"do\" but there is no\
    \ \"do\" anywhere in a while statement. Another important point to understand\
    \ here is since the loop condition is checked after the loop body is executed,\
    \ the loop body will always be executed at least once.\n\nAs with a while statement,\
    \ it is ok to remove the curly braces for the loop body if there is only one statement\
    \ in the body. Thus, the following two code snippets are actually the same:\n\n\
    ```\nint i = 4;\ndo {\n  System.out.println(\"i is \"+i);\n}\\}while(i-->0);\n\
    System.out.println(\"Loop finished. i is \"+i);\");\n```\n\n```\nint i = 4;\n\
    do {\n  System.out.println(\"i is \"+i);\n}\\}while(i-->0);\nSystem.out.println(\"\
    Loop finished. i is \"+i);\");\n```\n\nDeciding whether to use a while loop or\
    \ a do loop is easy. If the loop condition may evaluate to false at the beginning\
    \ itself, i.e., if the loop body may not execute once, you must use a while loop\
    \ because it checks the condition first and then executes the body. For example,\
    \ consider the following code:\n\n```\nIterator<Account> accIterator = accounts.iterator();\n\
    while(accIterator.hasNext()) { // no need to enter the loop body if accounts\n\
