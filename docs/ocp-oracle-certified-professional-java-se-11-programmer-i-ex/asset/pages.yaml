  md: "# 13.1.4 Instantiating abstract classes and interfaces\n\nAbstract classes\
    \ and interfaces are abstract. Objects of their kind do not exist, which is why\
    \ they are called abstract in the first place. Therefore, they cannot be instantiated,\
    \ period.\n\nI have seen some students confused when they see this code that looks\
    \ like it is instantiating an abstract class. For example:\n\n```\nabstract class\
    \ Animal{\n    public static void main(String[] args) {\n        Animal a = new\
    \ Animal();\n    }\n}\n```\n\nThe above code shows instantiating Animal even though\
    \ Animal is abstract! The following is an example that seems to instantiate interface:\n\
    \n```\ninterface Dummy{\npublic class TestClass{\n    public static void main(String[]\
    \ args) {\n        Dummy d = new Dummy();\n    }\n}\n```\n\nWell, first thing\
    \ you should observe is the presence of { } between new Animal() and ; This is\
    \ not the syntax for instantiating a class. For instantiating a class, you would\
    \ have to write new Animal(); and if you try to do that you will get a compilation\
    \ error that says, \"Animal is abstract; cannot be instantiated\".\n\nIn fact,\
    \ the above code uses the syntax for declaring as instantiating a concrete inner\
    \ class that extends Animal without giving this a name. Since no name is given\
    \ to this class, it is called an anonymous class. When the compiler sees this\
    \ code, it actually creates a class, gives this class a weird looking, and generates\
    \ a separate file for this. It is this class that is instantiated at runtime.\
    \ Since Animal class doesn't have any abstract method, this anonymous class doesn't\
    \ need to implement any method. Had Animal had an abstract method, you would have\
    \ to implement this method inside the curly braces.\n\nThe thing is happening\
    \ in the case of the interface example above. The code is defining and instantiating\
    \ a single anonymous class that implements the Dummy interface.\n\nSince the topic\
    \ of inner classes (including anonymous inner) is not the OCP Java Part 1 exam,\
    \ I will not discuss this further in this book."
