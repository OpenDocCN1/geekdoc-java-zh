- img_proc: true
  md: "Observe that default methods are just the opposite of abstract methods - abstract\
    \ methods cannot have an implementation while the whole purpose of default methods\
    \ is to provide an implementation. Therefore, a method cannot be default as well\
    \ as abstract at the same time. Thus, the following code will not compile:\n\n\
    ```\ninterface Movable{\n    //must be marked or private because it has a body\n\
    \    void move(int x) {\n        System.out.println(\"Moving by \"+x+\" points\"\
    );\n    }\n    void move2(int x); //ok, no body\n}\n```\n\nDefault methods are\
    \ always public even if you do not declare them as explicitly. You cannot mark\
    \ them private or protected.\n**3. static methods** - As the names, static methods\
    \ belong to the interface itself and not to the object implementing it. They are\
    \ defined using the keyword static as follows:\n\n```\ninterface Movable{\n  \
    \  static void sayHello() {\n        System.out.println(\"Hello!\");\n    }\n\
    ```\n\nSince sayHello is static method, you don't need an instance of any object\
    \ to invoke it. You can invoke it directly on the interface just like you static\
    \ methods on a class. For example:\n\n```\npublic class TestClass{\n    public\
    \ static void main(String[] args) {\n        Movable.sayHello();\n    }\n```\n\
    \nStatic methods can be marked public or private but not protected.\n**4. private\
    \ methods** - Private methods (as well as no-static) have been allowed since Java\
    \ 9 and, as explained above, they are helpful when a default static method gets\
    \ too big and needs to be refactored into smaller internal methods without exposing\
    \ the internal methods to the outside world. Here is an example:\n\n```\ninterface\
    \ Movable{\n    private void moveInternal() { //don't want to make it accessible\
    \ to other\n        System.out.println(\"in moveInternal\");\n    }\n    default\
    \ void move(int n) {\n        while(n-- > 0) moveInternal();\n    }\n}\n```\n\n\
    Note that, private methods are not visible outside the interface, they cannot\
    \ be marked default."
