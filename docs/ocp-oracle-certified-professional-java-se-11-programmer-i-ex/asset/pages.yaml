  md: "While executing code, whenever the JVM encounters the usage of class for the\
    \ first time, it allocates and initializes space for the static fields of class.\
    \ Since static fields belong to the class and not to the objects of the class,\
    \ there is only one copy of such fields. The JVM initializes these to their default\
    \ values (i.e. zero for numeric types and null for reference types) and executes\
    \ the \"static initializers\" defined in the class. Static initializers are nothing\
    \ but blocks of code marked with the keyword static as shown below:\n\n```\nclass\
    \ TestClass{\n //the following is a static initializer\n static {\n  System.out.println(\"\
    In static block\");\n }\n\n  public static void main(String[] args){\n    System.out.println(\"\
    In main\");\n   }\n}\n```\n\nThe program generates the following output:\n\n#\
    \ In static block\nIn main\n\nAs you can observe from the above output, the main\
    \ method is executed after the static block. A static block provides an opportunity\
    \ for the developer to initialize the static fields of the class and execute any\
    \ other business logic that the developer wishes to execute before the class is\
    \ used or by any other code. The class shows how a developer might make use of\
    \ a static initializer:\n\n```\nclass InterestCalculator{\n static double RATE;\n\
    \ static {\n  System.out.println(\"In static block. RATE = \"+RATE\");\n  RATE\
    \ = 10;\n }\n\n  public static double computeInterest(double principle, int yrs{\n\
    \    return RATE*principle/100;\n }\n\n  public static void main(String[] args){\n\
    \    double interest = computeInterest(100, 1);\n    System.out.println(interest);\n\
    \    interest = computeinterest(100, 2);\n    System.out.println(interest);\n\
    \  }\n}\n```\n\nThe InterestCalculator class shown above computes simple interest\
    \ based on the value of RATE, which is set in the static initializer. It produces\
    \ the following output:\n\n# In static block. RATE = 0.0\n10.0\n20.0\n\nThe important\
    \ thing to observe in the above output is that the value of RATE is printed as\
    \ 0.0. This is because the JVM has already initialized the RATE variable to its\
    \ default value of 0.0. It is that value is brought printed. RATE is being set\
    \ to 10 after this print statement. The second thing that you should notice is\
    \ that RATE printed"
