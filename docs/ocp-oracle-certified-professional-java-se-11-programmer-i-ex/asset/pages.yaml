    # 10.4.5 final variables revisited\n\nNow that you know about initializers and\
    \ constructors, let us go back to final variables for a moment.\n\nSince the value\
    \ of a final variable cannot be changed, Java doesn't assign a default value and\
    \ instead, forces the programmer to assign a value explicitly before it be used\
    \ by other classes. This idea of explicit initialization drives the rules about\
    \ their initialization:\n\n+   1. **Explicit initialization of a static final\
    \ variable** - A static variable can be used by other classes only after the class\
    \ is loaded and ready to use. This means that the variable must be initialized\
    \ by the time loading is complete. Then, you can assign a value to a static variable\
    \ at the time of declaration or in any one of the **static initializers** (aka\
    \ static initializers) as shown below:\n\n```\nclass TestClass{\n    static final\
    \ boolean DEBUG = true; //initializing at the time of declaration\n    static\
    \ final int value;\n    static {\n        value = 10;\n    }\n    public static\
