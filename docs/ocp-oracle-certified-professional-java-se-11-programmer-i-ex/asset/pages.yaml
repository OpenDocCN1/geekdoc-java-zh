  md: "# 1.5 static and instance\n\n# 1.5.1 Static and Instance\n\nYou will read the\
    \ word \"static\" a lot in Java tutorials or books. So, it is better to form a\
    \ clear understanding of it as soon as possible. In English, the word static means\
    \ something that doesn't change or move. From that perspective, it is a misnomer.\
    \ Java has a different word for something that doesn't change: final. I will talk\
    \ more about \"final\" later.\n\nIn Java, static means something that belongs\
    \ to a class instead of an instance of that class. As we discussed in the \"Object\
    \ and Reference\" section, a class is a template. You can instantiate a class\
    \ as many times as you want and every time you instantiate a class of that class.\
    \ Now, recall our cutter analogy. If a class is the cookie cutter, the fields\
    \ defined in the class are its patterns. Each instance of that class is the cookie\
    \ and each field will be printed on the cookie - except the fields defined as\
    \ static. In that sense, static member is kind of a lag stuck to a cookie cutter.\
    \ It doesn't apply to the instances. It stays only with the class.\n\nConsider\
    \ the following\n\n```\nclass Account {\n  String accountNumber;\n  static int\
    \ numberOfOfAccounts;\n}\n```\n\n```\n// Create a new Account instance\nAccount\
    \ acct1 = new Account();\n```\n\n```\n// This instance has its own accountNumber\
    \ field.\nacct1.accountNumber = \"A1\";\n```\n\n```\n// But the numberOfAccounts\
    \ fields does not belong to the instance, it belongs\nAccount.numberOfAccounts\
    \ = Account.numberOfAccounts + 1;\n```\n\n```\n// Create another Account instance\n\
    Account acct2 = new Account();\n```\n\n```\n// This instance has its own accountNumber\
    \ field.\nacct2.accountNumber = \"A2\";\n```\n\n```\n// the following line accesses\
    \ the same class field and therefore, numberOf\nAccount.numberOfAccounts = Account.numberOfAccounts\
    \ + 1;\n```\n\nImportant points about static\n\n+   1. static is a non object-oriented\
    \ feature as you can see in the code above, static fields do not belong to an\
    \ object. So, why does Java have it? Check out the \"Why is something so that?\"\
    \ section.\n2. Here is a jinger from Java designers - even though fields belongs\
    \ to a class and should be accessed through the name of the class, for example.\
    \ Account.numberOfAccounts, it is not an error if you access it through a variable\
    \ of that, acct1.numberOfAccounts. Accessing this will change its behavior. It\
    \ is still static and belongs to the class. Therefore, acct2.numberOfAccounts\
    \ will be therefore, strongly discouraged. This causes confusion and if this usage\
    \ with a compilation error.\n3. Just like fields, methods can be static as well.\
    \ Static method belongs to the class and can be accessed using the name of the\
    \ class or through a variable of that class.\n4. The opposite of static is instance.\
    \ There is no keyword by that name though. If a class member is not defined as\
    \ static, it is an instance member."
