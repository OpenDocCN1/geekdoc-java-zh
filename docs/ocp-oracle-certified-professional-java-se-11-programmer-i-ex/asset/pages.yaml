  md: '# 16.1 Module Basics


    # 16.1.1 What are modules?


    In the Kickstarter for Beginners chapter, you saw how to package individual classes
    of an application into a jar file and how to run an application using jar file.
    The jar file approach is a great way to package multiple files into a single file
    and to deliver applications as well as class libraries to users.


    However, Jar files are not without problems. Packaging classes into a jar file
    without a well thought out plan gives rise to unwieldy applications that are difficult
    to update and/or reuse. Jar files also make it difficult to just use a part of
    an application without having the whole set of jars. If you are a Java beginner
    or haven''t involved in professional level Java development, you might find it
    hard to believe that the jar file approach also led the Java community to something
    catastrophic. Jar Hell is a nightmare hard to debug due to the classpath or due
    to the presence of multiple versions of a library used by different parts of the
    application. For example, what if an application uses Spring and Hibernate, in
    turn uses different versions of a library used by different parts of the application.
    These libraries require a different versions of the same jdbc driver or a library?


    Although the JDK did not provide any out of the solution to such issues, Java
    community projects like Ant, Maven, and Gradle have attempted to provide some
    way of managing these issues.


    With Java 9, the language designers came up with a new approach called the Java
    Module System, known as Project Jigsaw, to packaging Java classes to solve at
    some of the problems mentioned above. It introduces a Java (or a library) to be
    composed of classes or jar files but of modules, where each module of an application
    specifies what modules it depends on and what it provides to other modules. A
    module, in turn, is composed of one or more classes. A module, therefore, is a
    much coarser grained unit than a class. In other words, classes are packaged in
    a jar file to form a module, and modules are mixed and matched at run time to
    form an application. The following diagram illustrates how classes and modules
    come together to make an application.


    ![](img/f7bc00fabb8855fa5663a81b5e778ee0_383_0.png)


    The above diagram shows three jar files named moduleA.jar, moduleB.jar, and moduleX.jar.
    These jar files are used to create an application. Note that an application is
    a loosely coupled collection of modules and is not packaged as a jar file. You
    will soon see that an application is created by specifying the required modules
    from different teams, groups, or companies on the command line at run time.


    It is not like professional application teams were already grouping independent
    parts of an application into separate jar files. Indeed, even before the advent
    of modules, Java applications were composed of jars collected from various teams.
    But the process of grouping the classes and, more importantly, documenting what
    a jar file is'
