  md: "# 12.4 Enable polymorphism by overriding methods\n\n# 12.4.1 What is polymorphism\n\
    \nIn simple terms, **Polymorphism** refers to the ability of an object to exhibit\
    \ behaviors associated with different types. In other words, if the same object\
    \ behaves differently depending on which \"side\" of that object you are looking\
    \ at, then object is **polymorphic**. For example, if you model using an Apple\
    \ class that extends a Fruit, then an apple can behave as an Apple as well as\
    \ a Fruit. Later, if you have a RedApple class that extends the Apple class, then\
    \ a red apple will behave as an Apple and a Fruit besides. Similarly, an object\
