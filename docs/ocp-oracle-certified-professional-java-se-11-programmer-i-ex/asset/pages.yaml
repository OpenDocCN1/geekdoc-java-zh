  md: '**Compile-time constants** - Normally, it is the JVM that sets the values of
    variables when a program is executed. The compiler does not execute any code and
    has no knowledge of the values that a variable might take during the execution
    of the program. Even so, in certain cases, it is possible for the compiler to
    figure out the value of a variable. If a compiler can determine the value that
    a variable will take during the execution of the program, then if you define an
    int variable as `final int x = 10`; then x is a compile time constant because
    the compiler knows that x will always have a value of 10 at runtime. Similarly,
    literals such as the numbers 1, 2, and 3, or the characters written in code within
    single quotes as ''a'', or boolean values `true` and `false`, are all compile
    time constants because the compiler knows that these values will never change.


    I will refer to these terms and will also discuss the details of these terms throughout
    the course, so it will be helpful if you keep the basic idea of these terms in
    mind.'
