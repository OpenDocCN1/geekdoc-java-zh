  md: "```\nreturn 36;\n}\n```\n\nBut the following will not because getwidth is final\
    \ in Bed:\n\n```\nclass DoubleBed extends Bed{\n    static int getwidth() //will\
    \ not compile\n    return 60;\n}\n```\n\n# Summary of the application of access\
    \ modifiers, final, abstract, and static keywords\n\nBased on the previous discussion,\
    \ let me summarize the rules of abstract, concrete classes, and final classes\
    \ and methods:\n\n+   1. An abstract class does not necessarily have an abstract\
    \ method but if a class has an abstract method, it must be declared abstract.\n\
    2. An abstract class cannot be instantiated regardless of whether it has an abstract\
    \ method or not.\n3. A final class or a final method cannot be abstract.\n4. A\
    \ final class cannot contain an abstract method but an abstract class may contain\
    \ a final method.\n5. A private method is always final.\n6. A private method can\
    \ never be abstract.\n7. A static method can be final but can never be abstract.\n\
    \n> The exam tests you on various combinations of access modifiers and final,\
    \ abstract, and static keywords as applied to classes and methods. You should\
    \ be very clear about where you can and cannot apply methods.\n\nThe exam, however,\
    \ does not try to trick you on the order of access modifiers and final and abstract\
    \ keywords. For example, you will not be asked to pick the right direction out\
    \ of, say, the following three:\n\npublic abstract void m();\nfinal public void\
    \ m(){nabstract protected void m();\n\nFar as the compiler is concerned, the return\
    \ type must be specified immediately before the method name. It doesn't care about\
    \ the order of the other modifiers. Thus, all of the three methods are valid.\n\
    \nNevertheless, you should know that, conventionally, the sequence of modifiers\
    \ in a method declaration is as follows:\n<access modifier> <static> <final or\
    \ abstract> <return type> methodName(<parameter list>)"
