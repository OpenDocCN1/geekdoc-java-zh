    > Redundant assignment is one of the traps that you will encounter in the exam.
    Most IDEs flash a warning when you try to assign the value of a variable to the
    same variable. But in the exam, you won''t get an IDE and so, you must watch out
    for it by reading the code carefully.


    Here are a few quick facts about this:


    +   1. this is a keyword. You can''t use it for naming anything as a variable
    or a method.


    +   2. The type of this is the class (or an enum) in which it is used. For example,
    the type of this in the printname of Student class is Student.


    +   3. this is just like any other local variable that is set to point to the
    instance on which a method is being invoked. You can copy it to another variable.
    For example, you can do Student s3 = this; in an instance method of Student class.


    +   4. You can''t modify this, i.e., you can''t set it to null or make it point
    to some other instance. It is set by the JVM. In that sense, it is final.


    +   5. this can only be used within the context of an instance of a class. This
    means, it is available in instance initializer blocks, constructors, instance
    methods, and also within a class. It is not available within a static method and
    a static block because static methods (and static initializer blocks) do not belong
    to an object.'
