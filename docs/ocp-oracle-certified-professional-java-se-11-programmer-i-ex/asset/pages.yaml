  md: '# 16.5 Describe the modular JDK


    # 16.5.1 Modular JDK


    In the previous sections of this chapter, I showed how you create and use modules.
    It was important to discuss the basic concepts of modules before Java 9 has modularized
    all the classes and packages of the JDK by following the same concepts. Although
    there are still a few topics related to modules that one needs to understand before
    they can fully appreciate the amount of restructuring in JDK 9, these topics are
    not on the Java 11 part 1 certification exam. So, I will try to explain the modular
    JDK without relying too much on such topics.


    If you look at the size of the Java runtime, it is hard to believe that Java was
    originally designed to run on the smallest of devices. Now, twenty five years
    later, Java has gone beyond its goal. It has been enormously useful in building
    large mission critical applications as well as desktop applications. One of the
    reasons for its success is the constant evolution of the features, tools, and
    libraries that Java came with.


    Another key to Java was WORA, "Write Once Run Anywhere". Java came with a single
    set of API that you could use to write an application that would work the same
    on all platforms. Java achieved this by developing a runtime environment that
    had the differences in the underlying hardware and a provided set of commons.


    Over the years, the types and capabilities of devices drifted vastly and it become
    impossible to hide the differences in capabilities of so many platforms. But if
    you have a Java runtime for a device and it is not able to run a Java application
    for that device, then that would involve abandoning the WORA promise. Java did
    finally abandon WORA when it came with multiple versions of the runtime as JSE,
    J2EE, and CME. Java was small footprint of the Java runtime that could run on
    initial generation of mobile phones. It was very different from JSE and J2EE in
    terms of capabilities. However, the core library still remained the same.


    By Java 8, the Java library, which grew over four thousand hundred classes, became
    a big monolithic of interdependent classes and was impossible to split into smaller
    independent pieces. Even if an application used a very small part of the runtime,
    it still had to be bundled with the whole library. You might have about a jar
    file named `*.jar` that every Java installation contains. With 60 MB jar file
    complete Java SE library for your Java application comprising just a single class,
    you would have to include this jar file along with


    Modular JDK is intended to solve this problem. I divided the JDK into several
    loosely coupled modules that can be combined at compile time, build time as well
    as runtime, into a variety of configurations as per the needs of the applications.
    For example, a large service application can use the full JDK but a micro-service
    can be packed with only the modules that are absolutely essential. It also allows
    applications that are bundled along with the runtime, to be shipped with smaller
    profiles, thus increasing the reach of Java applications to more devices and platforms.


    # 16.5.2 Organization of the modular JDK


    The packages, or API packages, as they are called in technical jargon, contained
    in the Java platform are distributed into various modules. These modules can be
    categorized into two categories - standard modules and non-standard modules. The
    modules that are generated by the Java Community Process (JCP) are called Standard
    modules. Their names start with `java`. For example, `java.base`, `java.sql`,
    and `java.logging` are standard modules. All other modules that are specific to
    a JDK are called non-standard modules. Their names start with `jdk`. For example,
    `jdk.jeps`, `jdk.rmic`, and `jdk.javadoc` are non-standard modules.'
