  md: "# 10.5 Apply the static keyword to methods and fields\n\n# 10.5.1 Apply the\
    \ static keyword to methods and fields\n\nI have already discussed the meaning\
    \ of the word static and what it implies when applied to a method or a field in\
    \ the \"Kickstarter for Beginners\" chapters.\n\nIn this section, I will dig a\
    \ little deeper and explain the nuances of static from the perspective of the\
    \ exam. Let us start with the syntax.\n\nYou can declare any member of a class\
    \ (i.e. a method, a field, or any nested type) as static using the keyword static.\
    \ In the case of a method or a field, this keyword must appear before the return\
    \ type of the method or the type of the field respectively. For example:\n\n```\n\
    class Foo{\n    static int bar;\n    static String biz;\n    private static void\
    \ baz() {} //order of modifiers doesn't matter\n    static public final void boz(){}\
    \ //order of modifiers doesn't matter\n}\n```\n\nIn case of nested types, the\
    \ static keyword must appear immediately before the type. For example:\n\n```\n\
    class Boo{\n    static class NestedClass{\n}\n\n    static interface NestedInterface{\n\
    }\n    static enum NestedEnum{\n}\n```\n\nA top class, interface, or an enum cannot\
    \ be declared static. It wouldn't make sense either because static is a property\
    \ of the relationship between the owner and the owned types. For example, Boo\
    \ NestedClass statically. Boo cannot be static because it is not owned by any\
    \ other type.\n\nLocal members, i.e., members defined within a method, cannot\
    \ be declared static. Thus, the following code will fail to compile:\n\n```\n\
    class TestClass{\n    public static void main(String[] args){\n        static\
    \ int x; //can't be static\n\n        static class Y //can't be static\n    }\n\
    ```\n\nDoes that mean the variable x and the class Y are an instance variable\
    \ and an instance class respectively? No, such members are not members of the\
    \ class at all so, the concept of static/instance does not apply to them. Such\
    \ members are local to the method and cease to exist as soon as the method execution\
    \ is complete. They cannot be referenced from outside the method."
