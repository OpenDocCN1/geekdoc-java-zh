  md: 'The following is a list of benefits of a modular JDK as described by Java Enhancement
    Proposal (JEP) 200. I am quoting important points from this document because the
    exam has questions containing statements from it. If you have time, you should
    go through this document, otherwise, the following list should suffice.


    +   1. It makes the Java platform much more easily scalable to small devices.
    Since Java classes and packages are distributed into modules, it is possible to
    create a configuration with a small footprint by packaging the modules that are
    required. For example, if an application does not require a GUI, there is no need
    to package the `java.desktop` module with it.


    +   2. It improves security and maintainability. Before modules, all members of
    all classes, irrespective of their access modifiers, were accessible through reflection
    API. By encapsulating packages into modules, the JVM can restrict access to only
    packages that explicitly allow it. The use of explicit exports and clauses prevents
    inadvertent dependence on classes that are not meant to be used outside a module.


    +   3. It improves application performance by not requiring unnecessary classes
    to be packaged and/or loaded.


    +   4. It is backward compatible. It is not required for an application to be
    structured as modular to run on the modular JDK. A non-modular application will
    run just like before on the modular JDK using the ~


    +   5. Customization is possible. It is possible to make the packages that are
    not exported explicitly in the module descriptor accessible through the use of
    appropriate command line options. For example, if a module does not export a package,
    you can use the --add-exports option to make it accessible to other modules. Of
    course, this option breaks the encapsulation mechanism and is undesirable. It
    should be used only in exceptional circumstances.


    As mentioned earlier, Java modules are a fairly large topic. There are several
    important concepts such as module graphs, dependency analysis, and using non-modular
    jars that take lot of time to discuss, which I have not talked about. The reason
    is that these concepts require a lot and the OCP Java 11 Certification Part 1
    exam merely scratches the surface of this topic. You will, at the most, get one
    question on it, which you will be able to answer based on the information given
    in this chapter. For this reason, it is best to ignore it at this time but you
    will be required to study this topic thoroughly for the Part 2 exam.'
