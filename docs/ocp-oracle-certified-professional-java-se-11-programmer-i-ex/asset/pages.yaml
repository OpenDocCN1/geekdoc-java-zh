    # 5.1.4 String immutability


    Strings are immutable. It is impossible to change the contents of a string once
    you have created it. Let me show you some code that looks like it is altering
    a string:


    ```

    String s1 = "12"

    s1 = s1+"34"

    System.out.println(s1); //prints 1234

    ```


    The output of the code indicates that the string pointed to by s1 has been changed
    from "12" to "1234". In reality, the string s1 points to remaining as s1. A new
    string creating "1234" is created and is assigned to s1. So, after the last line
    of the code, the JVM would have created three strings - "12", "34", and "1234".


    There are several methods to change the String that may make you believe that
    they change a string but just remember that a string cannot be mutated. Ever here
    some examples:


    ```

    String s1 = "ab"

    s1.concat("cd");

    System.out.println(s1); //prints "ab"

    s1.toUpperCase();

    System.out.println(s1); //prints "ab"

    ```


    In the code above, s1.concat("cd") does a new string creating "abcd" but this
    string is not assigned to s1. The first string prints "ab" instead of "abcd".
    The same thing happens with toUpperCase(). It produces a new string "AB" but since
    this is not assigned to s1, the second string prints "ab" instead of "AB". Note
    that the newly created strings "abcd" and "AB" will remain in the string pool.
    The JVM will use them when it needs to create a string containing the same characters.
    As of now, we don''t have any reference to these strings.


    # Mutability


    Generally, mutability refers to the properties of an object of a class. An immutable
    class implies that the instance variables cannot be changed once the instance
    is created. This is achieved by making instance variables private and having only
    getter methods for reading their values. Mutability is an important concept that
    has many aspects, a detailed discussion of it is not in the scope for OCP Java
    11 Part 1 exam. You should, however, be aware that it is included in the Part
    2 exam and is also a favorite topic of discussion in technical interviews.'
