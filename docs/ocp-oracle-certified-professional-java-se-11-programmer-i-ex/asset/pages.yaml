    \ block throws an exception and there is no catch block to catch that, the JVM\
    \ will execute the finally block. The only case where the finally block is not\
    \ executed is if the code in the try block or catch block finishes or if the try\
    \ block or catch block forces the JVM to shut down using a call to System.exit().\n\
    \nThe following is a complete program that illustrates how an exception alters\
    \ the normal program flow:\n\n```\npublic class TestClass {\n    public static\
