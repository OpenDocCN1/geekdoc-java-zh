  md: "# 8.2 Create and use loops\n\n# 8.2.1 The while loop\n\nAs the name of this\
    \ loop suggests, a while loop executes a group of statements **while** a condition\
    \ is true. In other words, it checks a condition and if that condition is true,\
    \ it executes the given group of statements. After execution of the statements,\
    \ i.e., after finishing iteration, it loops back to the condition again. If the\
    \ condition is false, the group of statements is not executed and the control\
    \ goes to the next statement after the block. The syntax of a while loop is as\
    \ follows:\n\n```\nwhile (boolean_expression) {\n    statement(s);\n}\n```\n\n\
    and here is an example of its use:\n\n```\npublic class TestClass {\n    public\
    \ static void main(String[] args) {\n        int i = 4;\n        while(i>0){\n\
    \            i--;\n            System.out.println(\"i is \"+i);\n        }\n \
    \       System.out.println(\"value of i after the loop is \"+i);\n    }\n}\n```\n\
    \nIt produces the following output:\n\n+   - i is 3\n- i is 2\n- i is 1\n- i is\
    \ 0\nValue of i after the loop is 0\n\nObserve that the condition is checked **before**\
    \ the statement is executed and that once the condition i>0 returns `false`, the\
    \ control goes to the next statement after the block.\n\nAs you have seen in the\
    \ past with if/else blocks, if you have only a single statement that you need\
    \ to execute in a loop, you may get rid of the curly braces if you want. In this\
    \ case, the syntax becomes\n\n```\nwhile(boolean_expression) statement;\n```\n\
    \nThe example program given above also be written to use a single statement like\
    \ this:\n\n```\npublic class TestClass {\n    public static void main(String[]\
    \ args) {\n        int i = 4;\n        while(i-->0) System.out.println(\"i is\
    \ \"+i); //no curly braces\n        System.out.println(\"value of i after the\
    \ loop is \"+i);\n    }\n}\n```\n\nThe above code looks the same as the previous\
    \ one but produces a slightly different output:\n\n+   - i is 3\n- i is 2\n- i\
    \ is 1"
