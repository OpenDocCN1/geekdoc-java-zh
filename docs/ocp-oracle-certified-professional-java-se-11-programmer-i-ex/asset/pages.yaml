    # 16.3.2 Qualified exports


    The exports clause opens a package to access from all other modules. Once a package
    is exported, you cannot stop any other module from accessing it. It is similar
    to making a member of a class public, and just like the public modifier, the exports
    clause makes a module less encapsulated.


    The Java module system allows you to fine tune access to a module to specific
    modules using a variation of the exports clause. It uses the exports clause or
    the qualified exports clause. Here is how it is used:


    ```

    module <modulename> { exports <packagename> to <module>(s);

    ```


    For example, in the following module-info, the com.abc.datatransfer package is
    being made accessible only to db and service:


    ```

    module datatransfer { exports com.abc.datatransfer to db, service; }

    ```


    The modules for which a package is readable are called "friendly" modules. Java
    standard library uses this feature for its internal modules. For example, the
    java.base module of the JDK has several packages which are supposed to be used
    only by a few internal modules. It uses qualified exports to achieve the same.
    Here is a code snippet from java.base module-info:


    ```

    module java.base { exports jdk.internal.logger to java.logging; exports jdk.internal.perf
    to java.desktop, java.management, jdk.jvmstat; }

    ```


    There is no particular order in which qualified and unqualified exports have to
    appear in a module info. Conventionally, however, qualified exports are listed
    after all unqualified exports.


    Using qualified exports provides protection from creating inadvertent dependencies
    on packages that are not meant to be used by everyone. Therefore, it is a good
    idea to use qualified exports as much as possible. Unqualified exports should
    be used only when you are absolutely sure that it is for the package to be used
    by any other module.


    # 16.3.3 Transitive dependencies


    A module may read another module B by using a requires clause in its module-info.
    But what if the module B reads another module C? Does that mean module A reads
    the module C as well? Normally, Module dependencies are not transitive and if
    module A specifies that it requires only module B, it cannot read module C just
    because B reads C.'
  merge: -1
  pgno: 394
- img_proc: true
  md: "Now, let's see how this pays out in the following situation. What if a class\
    \ module A needs to invoke a method of a class B, whose return type is defined\
    \ in module C? Something like this:\n\n```\nmodule ui{\n  requires hr;\n}\nmodule\
    \ hr{\n  requires valueobjects;\n  exports hrService;\n}\n```\n\n```\n//code appearing\
    \ in a class in ui module\nHRService hrService = new HRService(); //HRService\
    \ is defined in hr module\nEmployee e = hrService.Employee(employeeId); //Employee\
    \ is defined in valu\n```\n\nSince the ui module does not have a requires valueobjects;\
    \ clause; the ui module cannot access the Employee class from valueobjects module,\
    \ the code will fail to compile.\n\nThe obvious solution is to add a requires\
    \ valueobjects; clause in the ui module. But this has a serious problem. What\
    \ if the hr module has several requires clauses? How would the ui module know\
    \ which of the hr module's requires clauses should be added to module-info? Only\
    \ multiple compilation failures can make this information known to ui module!\n\
    \nThis is where requires transitive clause comes into picture. If the hr module\
    \ knows that whatever module hrservice package, will require clauses in valueobjects\
    \ module as well, it documents this information using requires transitive clause,\
    \ like this:\n\n```\nmodule hr{\n  requires transitive valueobjects;\n  exports\
    \ hrService;\n}\n```\n\nThis basically says that if you require the hr module,\
    \ then you also require the valueobjects module. But more than merely documenting\
    \ this fact, the requires transitive clause also eliminates the need for adding\
    \ an extra requires valueobjects; clause in the ui module. The requires hr; clause\
    \ in the ui module automatically makes all the modules transitively required by\
    \ hr module, readable to the ui module. This is called \"implicit readability\"\
    .\n\n> It is not clear whether qualified exports and transitive clauses are on\
    \ the OCP Java Part 11 exam or not. Some candidates have reported seeing options\
    \ that use these, so, it is a good idea to understand what they do.\n\n# Duplicate\
    \ import statement vs duplicate requires/export clauses\n\nHaving duplicate import\
    \ statements in a Java source file doesn't make any sense but Java has, historically,\
    \ permitted duplicate import statements. However, Java does not permit having\
    \ duplicate clauses in a module-info. Therefore, the following module-info.java\
    \ will not compile:\n\n```\nmodule hr{\n  requires valueobjects;\n  requires valueobjects;\
    \ //duplicate, not allowed\n}\n```\n\nRequiring the same module in a requires\
    \ clause and in a requires transitive clause is not allowed either. Thus, the\
    \ following not compile:"
