  md: '# 8.8 Comparing loop constructs


    # 8.8.1 Comparison of loop constructs


    As you before, there are only a few technical differences between the four kind
    of loops. The **for, foreach, and while** loops are conceptually a little different
    than the **do-while** loop due to the fact that a **do-while** loop executes at
    least one iteration. The **foreach** loop is a little different than other loops
    due to the fact that it can be used only for arrays and classes that implement
    `java.util.Iterable` interface.


    Other than these differences, they are all interchangeable. For example, you can
    always replace a **while** loop with a **for** loop as follows:


    ```

    while( booleanExpression ){

    }

    for( booleanExpression );{

    }

    ```


    You can also replace a **foreach** loop with a **for** loop as shown below:


    ```

    for( Object obj : someIterable){

    }

    for(_ Iterator it = someIterable.iterator(); it.hasNext(); {

    Object obj = it.next());

    }

    ```


    Of course, the foreach version is a lot simpler than the for version and that
    is the point. You can use any of the loops for a given problem, you should use
    the one that results in code that is most understandable or intuitive.


    A general rule of thumb is to use a for loop when you know the number of iterations
    before hand and use a while loop when the decision to perform the next iteration
    depends on the result of the operations performed in the prior iteration. For
    example, if you want to print "hello" ten times, use a for loop, but if you want
    to keep printing "hello" until the user enters a secret code as a response, use
    a while loop!'
