  md: "# 15.3 Create and invoke a method that throws an exception\n\n# 15.3.1 Creating\
    \ a method that throws an exception\n\nNow that you know about the throws clause\
    \ and the types of exceptions, let us look at the rules for creating a method\
    \ that throws an exception. Actually, there is just one rule - If there is a possibility\
    \ of a checked exception getting out of a method, then that exception or its superclass\
    \ must be declared in the throws clause of the method. The following examples\
    \ are of a few valid methods that illustrate this rule:\n\n```\nvoid foo(int x)\
    \ throws Exception{\n    if(x == 2) throw new Exception(); // throws Exception\
    \ only if x==2\n    return;\n}\n```\n\nIt doesn't matter whether the code throws\
    \ an exception every time it runs or only once. If there is a path of execution\
    \ in which an exception will be thrown, the method must list that in the throws\
    \ clause.\n\n```\nvoid foo() { // no throws clause necessary\n    if(someCondition)\
    \ throw new RuntimeException();\n    else throw new Error();\n}\n```\n\nRuntimeException\
    \ and Error are unchecked exceptions and are therefore, exempt from being declared\
    \ in the throws clause. Declaring them in the throws clause is valid.\n\n```\n\
    void foo() throws Exception{\n    if(someCondition) throw new java.io.IOException();\
    \ //throwing a sub-ex\n    else return;\n}\n```\n\nIt is ok to declare a superclass\
    \ exception in the throws clause and throw a subclass exception in the method.\n\
    But the reverse is not acceptable:\n\n```\nvoid foo() throws java.io.IOException{//will\
    \ not compile\n    if(someCondition) throw new Exception(); //throwing a super-exception\n\
    \    else return;\n}\n```\n\nRemember that a throws clause is a commitment that\
    \ you give to the user of this method that may throw only those exceptions that\
    \ are listed in the throws clause. If you commit that may only throw an IOException\
    \ but throw an Exception instead, the caller will have a problem because the caller\
    \ is only prepared to handle an IOException and not an Exception. An Exception\
    \ will break the caller's code.\n\nDeclaring a broader exception (i.e. a superclass\
    \ exception) and throwing a narrower exception (i.e. a subclass exception) is\
    \ ok if the caller is already prepared to handle the broader exception it can\
    \ handle the narrower one without changing any code. For example, an IOException\
    \ is an Exception and by throwing IOException, you are not breaking your commitment\
    \ if you have committed that you may throw an Exception.\n\n```\nvoid foo() throws\
    \ java.io.IOException, java.sql.SQLException //can throw\n{\n    if(someCondition)\
    \ throw new java.io.IOException();\n}\n```"
