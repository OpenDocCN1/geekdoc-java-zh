  md: '# Size of reference data types


    Size of a reference data type such as a class can be easily determined at compile
    time by looking at the instance variables defined in that class. Since every instance
    variable will either be a primitive variable or a reference variable, and since
    you know the sizes of each of those types, the size of an instance of that class
    will simply be the sum of the sizes of its instance variables.


    This size never changes for a given class. All instances of a given class always
    take exactly the same amount of space in memory, no matter what values its internal
    variables hold.


    Thus, there is never a need to calculate the size of memory space taken by an
    instance of a class at run time. And for this reason, there is no such operator
    "sizeof" in Java.'
