    # 1.8.4 Compilation error versus exception at run time


    Understanding whether something will cause a failure during compilation or will
    cause an exception to be thrown at runtime is important for the exam because a
    good number of questions in the exam will have these two possibilities. Beginners
    often get frustrated while trying to distinguish between the two situations. It
    will be a little easier if you follow the following three points in mind:


    +   1. First and foremost, it is the compiler''s job to check whether the code
    follows the syntactical rules of language. This means, it will generate an error
    upon encountering any syntactical mistake. For example, Java requires that the
    statement be present, it must be the first in the Java code file. If you try to
    put the package statement after imports, the compiler will complain because such
    a code will be syntactically incorrect. You will not see any rule like this in
    the book, yet you will need to memorize it and train your brain to stop relying
    on the IDE. If you use Eclipse, NetBeans, or IntelliJ, you stop using the IDE.
    Using Notepad to write and using the command line to compile and run the test
    programs is very helpful in mastering this aspect of the exam.


    +   2. Besides being syntactically correct, the compiler wants to make sure that
    the code is logically correct as well. However the compiler is limited by the
    fact that it cannot execute any code and so, it cannot identify all the logical
    errors that the code may have. Even so, if by the information present in the code,
    the compiler determines that something is wrong with the code, it raises an error.
    This is category of errors that causes most frustration among beginners. For example,
    the statement byte b = 200; is syntactically correct but the compiler does not
    know that the value 200 is too big to fit into a byte and it will be by that the
    programmer is making a logical mistake. On the other hand, the compiler says the
    statement int 1 = 10/0; even though you know just by looking at the code that
    this statement is problematic.


    +   3. The JVM is the ultimate that guarantees the integrity and type safety of
    the Java virtual machine at all times. Unlike the compiler, the JVM knows everything
    that the code tries to do and it throws an exception (I am using the word exception
    in general sense here and not referring to the java.lang.Exception) as soon as
    it detects that the action may damage the integrity or the type safety of the
    JVM. Thus, any illegal activity that the code performs will be caught by the JVM
    and will result in an exception to be thrown at run time. value that is why the
    JVM throws an exception if the code tries to divide an integer value by zero.


    Honestly, this is not an easy topic to master. The only way to get a handle on
    this is to know all the cases where this distinction is not so straightforward
    to make. If you follow this book, you will learn about all such rules, their exceptions,
    and the reasons behind them, that are required for the exam.'
