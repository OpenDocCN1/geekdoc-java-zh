    # 4.3.1 Class disambiguated


    The word "class" may mean multiple things. It could refer to the OOP meaning of
    class, i.e., an abstraction of an entity, it could refer to the code written in
    a Java source file, or it could refer to the output of the Java compiler, i.e.,
    a file with .class extension.


    For example, let you are developing an application for a school. When you model
    the Student entity as a class in this is the OOP sense. When you actually start
    coding your application, you would write the code for Student class in Student.java
    file. Finally, you would compile Student.java using javac and produce Student.class
    file which contains the bytecode for the Student class.


    The exam focuses primarily on the source code aspect of a class, i.e., the contents
    of Student.java file of the above example. However, you need to know the basics
    of OOP well because, after all, a Java source file is meant to let you code for
    your OOP class model. You don''t need to worry about the bytecode version of a
    class.


    # 4.3.2 Structure of a Java source file


    If you have written some Java code before, you are already aware of the basic
    structure of a Java source file. I will do a quick recap and move on to the interesting
    situations and gotchas that you need to know for the exam.


    A Java source file has the following parts:


    +   Part 1: zero or one package statement

    Part 2: zero or more import statements

    Part 3: zero or more type declarations (i.c. class, interface, or enums definitions)


    The ordering mentioned above is important. For example, you cannot have the package
    statement after the import statements or the class declaration(s). Similarly,
    you cannot have import statements after the class declaration.


    All of the three parts are optional. You can define multiple reference types within
    a single source file as well. I will talk about the rules of that later.


    # 4.3.3 Members of a class


    Within a class definition, you can have field declarations, methods, constructors,
    and initializers. You can also have classes, interfaces, and enums, but more on
    that. All of these are called "members" of that class.


    For example, the following code shows members of a class:


    ```

