    # Understanding module-path


    Another thing noticed in the above command is the value that we have specified
    for module-path. We have specified only that for the module-path because our module
    jar is in the current directory. A module-path contains all the locations where
    you want the JVM to search for module definitions. When trying to load a module,
    the JVM looks for modules in all the locations specified in the module-path. It
    expects to find exactly one module - a directory with the same name as the name
    of the module or a jar file containing module-info.class for that module. The
    name of the jar file is not important because the JVM takes the name of the module
    from the module-info.class contained in the jar file. The same module should not
    be present more than once on the module-path, otherwise the JVM will complain.


    In the command used above, while searching for the module named simpleinterest,
    the JVM will look for a jar file that contains module-info.class with the module
    name simpleinterest as simpleinterest at the root or a directory by name


    Compare this with the -classpath switch, which requires all jar files that you
    want on the class path to be listed explicitly instead of requiring the directory
    that contains the jar file(s).'
