  md: '# i is 0

    Value of i after the loop is -1


    The difference is that I used the post-decrement operator to decrement the value
    of i within the condition expression itself. Remember that when you use the post-decrement
    (or the post-increment) operator, the variable is decremented (or incremented)
    after its existing value is used to evaluate the expression. In this case, when
    i is 0, the condition expression evaluates to false and the block is not executed,
    but the variable i is nevertheless decremented to -1. Therefore, the value of
    i after the loop is -1.


    # 8.2.2 Using a while loop


    # Control condition and control variable


    When using a while loop you should be careful about the expression that you use
    as the condition (which is also called the "control variable", because Most of
    the time, a while condition controls whether the loop entered or not) that you
    compare against a value. For example, i>4 or name!=null or bytesRead==-1 and so
    on. However, it can get quite large and complex. For example, account==null ||
    (account==null && account.accountId==null) || (account==null && account.balance==0).
    The expression must, however, return a boolean. Unlike languages such as C, Java
    does not allow you to use an integer value as the condition. Thus, while(1){System.out.println("loop
    forever");} will not compile.


    # while body


    Ideally, in the while body should modify the control variable in a way that the
    condition will evaluate to false it is time to end the loop. For example, if you
    are processing an array of integers, control variable could be set to the index
    of the array that you are processing, and each iteration should increment that
    variable.


    ```

    int[] myArrayOfInts=/code to fetch the data

    int i=0;//control_variable

    while(i<myArrayOfInts.length){

    //do something with myArrayOfInts[i]

    i++;Increment so that the control condition will evaluate to false after

    }

    ```


    There are situations where you do not want a loop to end at all. For example,
    a program that lists on a socket from connections clients may use a while loop
    as:


    ```

    Socket clientSocket=null;

    while((clientSocket = serverSocket.accept()) !=null) {

    //code to hand over the clientSocket to another thread and go back to the we

    }

    ```


    The above is a common ending while loop can also be as simple as this:


    ```

    while(true){

    System.out.println("keep printing this line forever!");

    }

    ```'
