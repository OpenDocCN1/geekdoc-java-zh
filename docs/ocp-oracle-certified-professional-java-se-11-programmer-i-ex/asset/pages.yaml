  md: '# 16.2 Describe how a modular project is compiled and run


    # 16.2.1 Compiling a module


    Now that our directory structure and the base for the module is ready, let us
    compile it. Open a command/shell prompt, cd to the c:\ocpill\moduletest directory
    and run the following command:


    ```

    c:\ocpill\moduletest>javac -d out --module-source-path src --module simpleinterest

    ```


    The above command uses three line switches: -d, --module-source-path, and --module.


    You have used the -d switch before to direct the output of the Java compiler to
    a particular. It works the same way here, -d out will cause the compiler to produce
    its output in the out directory. The compiler will create the out directory if
    it does not already exist.


    The --module-source-path switch tells the compiler to locate the source of the
    source module definition. Since we have kept our source code in a directory named
    src, that is what we have specified as well. Observe the double switch in this.


    Since the module is simpleinterest, the compiler will create a simpleinterest
    directory under out. The out\simpleinterest is the module''s "root directory"
    and the tree rooted under simpleinterest is the "module definition" of the simpleinterest
    module.


    The compiler will save all class files of this module inside out\simpleinterest
    as per the package directory structure of the classes of this module. For example,
    since SimpleInterestCalculator class is in out\simpleinterest, the compiler will
    put SimpleInterestCalculator.class under out\simpleinterest\simpleinterest directory.


    Note that I am using relative paths instead of absolute paths (i.e. out instead
    of c:\ocpill\moduletest). Relative paths resolve to the current directory, and
    our current current directory is c:\ocpill\moduletest\out. You may use absolute
    paths and relative paths interchangeably in these commands but it is better to
    use relative paths because they will work if your base directory something different
    from c:\ocpill\moduletest.


    The --module switch specifies the name of the module that we want to compile.
    The compiler tries to locate this module in the paths specified in --module-source-path.
    In this case, we want to compile the simpleinterest module. Again, observe the
    double switch.


    Based on the options above, the compiler will look for module-info.java under
    src\simpleinterest and will compile all the Java files under the directories that
    are inside src\simpleinterest directory.


    Upon successful execution of the above command, you should see the directory structure
    as shown below:'
