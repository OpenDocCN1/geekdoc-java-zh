  md: "# 8.7 Nested loops\n\n# 8.7.1 Nested loop\n\nA nested loop is a loop that exists\
    \ inside the body of another loop. This is not a big deal if you realize that\
    \ the body of a loop is just another set of statements. Among these set of statements,\
    \ there may also be a loop statement. For example, while looping through a list\
    \ of Strings, you can also loop through the characters of each String as shown\
    \ in the following code:\n\n```\nString[] names = {\"ally\", \"bob\", \"charlie\"\
    , \"david\"};\nfor(String name : names) {\n    int sum = 0;\n    for(int i=0;\
    \ i<name.length(); i++){\n        char ch = name.charAt(i);\n        int letterNumber\
    \ = ch - 96; //converts an 'a' to 1, 'b' to 2, etc.\n        sum += letterNumber;\n\
    \    }\n    System.out.println(\"Lucky number for \"+name+\" is \"+sum);\n}\n\
    ```\n\nThe above code nests a regular loop for inside an enhanced for loop. The\
    \ following is the output produced by this code:\n\n+   Lucky number for ally\
    \ is 50\nLucky number for bob is 19\nLucky number for charlie is 56\nLucky number\
    \ for david is 40\n\nOne thing you need to be careful about when using nested\
    \ loops is managing the loop variables correctly. Consider the following program\
    \ that is supposed to calculate the sum of all values in a multidimensional array\
    \ of ints:\n\n```\nint[][] values = {{1, 2, 3}, {2, 3}, {2}, {4, 5, 6, 7} };\n\
    \nint sum = 0;\nfor(int i=0; i<values.length; i++) {\n    for(int j=0; j<values[i].length;\
    \ j++) {\n        sum += values[i][j];\n    }\n}\nSystem.out.println(\"Sum is\
    \ \"+sum\");\n```\n\nRead the above code carefully and try to determine the output.\n\
    \nIt actually throws an exception: Exception in thread \"main\"\njava.lang.ArrayIndexOutOfBoundsException:\
    \ 4\n\nObserve that the inner index is incrementing i instead of j. Now, let's\
    \ execute the code by step:\n\nStep 0: Before the outer loop starts, values.length\
    \ is 4 and sum is 0.\n\nStep 1: Outer loop is encountered - i is initialized to\
    \ 0, i.values.length is true because 0 is less than 4, so the loop is entered.\n\
    \nStep 2: Inner loop is encountered - j is initialized to 0.values[i].length is\
    \ true because i is 0, therefore, values[i] refers to {1, 2, 3} and values[i].length\
    \ is 3. Therefore, the loop is entered."
