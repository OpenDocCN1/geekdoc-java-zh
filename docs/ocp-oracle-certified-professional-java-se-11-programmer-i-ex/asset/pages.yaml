  md: "# 4.3.4 Relationship between Java source file name and class name\n\nOther\
    \ than the fact that Java source files have an extension .java (or .jav), there\
    \ is **only one rule** about the class name and the name of its source code file\
    \ - for a **top level type** (recall that \"type\" implies class, interface, or\
    \ enum) must be written in a Java file with the same name (with extension java,\
    \ of course!).\n\nFor example, if you are writing code for a public class named\
    \ Student, then the name of the source code file must be Student.\n\nIn the light\
    \ of above, let us take a look at a few questions that might pop out your head:\n\
    \n+   **Q. Does that mean I cannot have multiple classes in a single file?**\n\
    A. No, you can certainly have multiple classes in a single file. But only one\
    \ of them can be public and the name of that public class must be the same as\
    \ the name of the file. It is okay if there is no public class in a file.\n\n\
    +   **Q. What if I don't have a public class? What should be the name of the file\
    \ in that case?**\nA. You can code a non-public class in a file with any name.\
    \ However, it is a good programming practice to keep even non-public class in\
    \ a file by the same name.\n\n+   **Q. What about interfaces? Enums?**\nA. The\
    \ rule applies to all types, i.e., classes, interfaces, and enums. For example,\
    \ you cannot have a public class and a public interface in the same file. There\
    \ can be only public type in one file.\n\n+   **Q. What about nested types? Can\
    \ I have two public classes inside a class?**\nA. The rule applies only to top\
    \ level types. So, yes, you can have more than one public types inside another\
    \ type. For example, the following is valid:\n\n```\npublic class TestClass {\n\
    \    public interface I1 {\n        public class C1 {}\n        public static\
    \ class C2 {}\n        public enum E1 {}\n    }\n}\n```\n\n> I1, C2, and E1 are\
    \ called \"nested types\" aka \"nested classes\" because their declaration appears\
    \ within the body of another class or an interface. Types that are not inside\
    \ other types are called \"top level\" types. The topic of nested classes is not\
    \ included in Part 1 but is included in Part 2, so, it is good to know at least\
    \ the terminology at this stage.\n\nRemember that this is implemented by the Java\
    \ and the JVM. Compiler converts the source code into files and generates an independent\
    \ class file for each type (respective of whether type is public or not) in that\
    \ source file. Thus, if you define three classes in Java (one public and two nonpublic),\
    \ three separate class files will be generated. The JVM has no idea about the\
    \ Java source file(s) from which the classes originated.\n\nIt is a common practice,\
    \ however, to define each type, public or not, in its own independent file. Defining\
    \ each own independent file is a very practical approach if you think about it.\
    \ While browsing the code folder of a Java project, you only see the file name.\
    \ Since you cannot see inside the file, it will be very hard for you to find out\
    \ which class is defined in Java file if you have multiple definitions in a single\
    \ Java."
