  md: "It is also possible to throw an entirely new exception from the catch and finally\
    \ blocks. Here is an example:\n\n```\nvoid bar() throws Exception {\n  try{\n\
    \    foo();\n  }catch(EOFException eofe){\n    throw new Exception();\n  }\n}\n\
    ```\n\nThe EOFException thrown by foo will be caught by catch(EOFException eofe)\
    \ block. Since the catch block throws Exception, bar will end up throwing Exception\
    \ to its caller. But there must list Exception in its throws clause.\n\nIf you\
    \ throw an exception from the finally block, the exception thrown from the try\
    \ block or the catch block is ignored, and the exception thrown from the finally\
    \ block is what gets out of the method. The following example illustrates this:\n\
    \n```\nvoid bar() throws IOException {\n  try{\n    foo();\n  }catch(EOFException\
    \ eofe){\n    throw new Exception();\n  } finally{\n    throw new IOException();\n\
    \  }\n}\n```\n\nEven though the catch block throws Exception, the JVM doesn't\
    \ throw it to the caller of bar. It waits until the finally block finishes execution.\
    \ However, the finally block throws a new IOException. So the JVM ignores the\
    \ Exception that it was about to throw to the caller and throws the IOException\
    \ instead. As far as the compiler is concerned, it realizes that bar can only\
    \ throw an IOException and not Exception to the caller and therefore, it is ok\
    \ with listing just IOException in bar's throws clause."
