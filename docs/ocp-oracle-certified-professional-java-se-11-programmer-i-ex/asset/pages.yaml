  md: '+   3. Polymorphism ensures at run the method to be executed depends on the
    actual object referred to by a reference. If a subclass overrides a method of
    a base class and if the object referred to by a variable is of type subclass,
    then the subclass''s version of the method is used if the declared type of the
    variable is base class. This is also called dynamic binding. Java supports dynamic
    binding and polymorphism.


    +   2. Huge standard library - Java Runtime Environment includes a huge set of
    readymade classes are useful for a wide range of applications such as networking,
    file and database I/O processing, data structures, and on. It includes implementation
    for several networking protocols such as HTTP and protocols for communicating
    with a database server. It does not include a database engine.


    +   3. Less Complex - Java eliminates a lot of complicated programming constructs
    to make the code less prone to errors. For example, Java does not have pointers,
    multiple class inheritance, operator overloading, and programs.


    +   4. Garbage collection - Java frees developers from actively collecting for
    garbage. It performs checks in the background that identifies unused object and
    cleans them up. Garbage collection is done on low priority and, it does not affect
    performance.


    +   5. Secure - A Java application can be run with a security manager. This security
    manager can be customized to allow precisely only those operations you want to
    allow for an application. Third party Java applications downloaded from the internet
    can be run within a sandbox. This limits the operations that a program can do
    on the host machine.


    +   6. Multithreading - Java makes developing multithreaded applications easier
    than other languages. It offers lower level language constructs such as monitors
    as well as higher level multithreading API such as Fork/Join framework that helps
    you develop multithreaded and concurrent programs. However, Java does not parallelize
    code execution automatically.


    +   7. High Performance - Java used to be criticized a lot at one point in the
    past for its poor performance. However, that was a long time ago. Java interpreters
    are highly optimized and deliver almost similar performance as a native application.
    One of the most important features of Java interpreters that contributes to the
    high performance is their ability to monitor and optimize code blocks that are
    executed frequently in an application.


    Here are a few links worth going for a more detailed discussion.


    +   - Platform Independence - http://stackoverflow.com/questions/2748910/how-is-java-platform-independent-when-it-needs-a-jvm-to-run
    and http://functionspace.com/topic/1689/Why-is-java-called-a-platform-independent-Oriented-language-


    +   - Object-Oriented Concepts - http://docs.oracle.com/javase/tutorial/java/concepts/


    +   - Encapsulation - http://en.wikipedia.org/wiki/Encapsulation_(object-oriented_programming)'
