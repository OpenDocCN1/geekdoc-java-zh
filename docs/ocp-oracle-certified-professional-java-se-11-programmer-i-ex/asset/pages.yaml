  md: "# 11.2 Apply encapsulation principles to a class\n\n# 11.2.1 Encapsulation\n\
    \n**Encapsulation** is considered as one of the three pillars of Object-Oriented\
    \ Programming. The other two being **Inheritance** and **Polymorphism**. In the\
    \ programming world, the word **encapsulation** may either refer to a mechanism\
    \ for restricting direct access to an object's data **fields** or it may refer\
    \ to the features of a programming language that facilitate the binding of data\
    \ with the methods operating on that. For the purpose of the exam, we will be\
    \ focusing on the first meaning, i.e., restricting direct access to an object's\
    \ fields.\n\nAs explained in the previous section on *access modifiers*, letting\
    \ other classes directly access instance variables of a class causes **tight coupling**\
    \ between classes and reduces the maintainability of the code. While designing\
    \ a class, your goal should be to present functionality through methods and not\
    \ through variables. In other words, a user of your class should be able to make\
    \ use of your class by invoking methods and not by accessing variables. There\
    \ are two advantages of this approach:\n\n+   1. You give the freedom to modify\
    \ the implementation of the functionality without affecting the users of your\
    \ class. In fact, users of a well class do not even become aware of the internal\
    \ variables that the class uses for defining that because the implementation details\
    \ of the functionality are hidden from the users. In that sense, **encapsulation**\
    \ and **information hiding** go in hand.\n2. You can ensure that the value of\
    \ a variable is always consistent with the business logic of the class. For example,\
    \ it wouldn't make sense for the age variable of a *Person* class to have a negative\
    \ value. If you make this variable private, anyone could mess with *Person* objects\
    \ by setting their variables to a negative value. It would therefore, be better\
    \ if the Person class has a public setter method instead, like this:\n\n```\n\
    classPerson{\n    private int age;\n\n    public void setAge(int yrs){\n     \
    \   if(yrs<0) throw new IllegalArgumentException();\n        this.age = yrs;\n\
    \    }\n}\n//other code\n```\n\n# Encapsulation in Java\n\nSince the only way\
    \ to restrict access to the variables of a class from others is to make them private,\
    \ a well class defines its variables as private. The more you relax the restrictions\
    \ on the variables, the less encapsulated a class gets. Thus, a class with public\
    \ fields is not encapsulated at all. The visibility of the methods, on other hand,\
    \ can be anything from public to private, depending on the business purpose of\
    \ the class.\n\n# Encapsulation of static members\n\nEncapsulation is an OOP concept\
    \ and generally applies to the instance members of a class and not to the static\
    \ members. However, if you understand the spirit of encapsulation, you will notice\
    \ that all we want to do is prevent others from inadvertently or incorrectly accessing\
    \ that they should not be accessing. This is true of static variables also. Thus,\
    \ it is better to have the static variables as private. Ideally, the only variables\
    \ that"
