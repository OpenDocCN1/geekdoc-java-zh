  md: 'A program''s memory can be thought of as a long array of bytes starting with
    0 to NNNN, where NNNN is the location of last byte of array. Let''s say, with
    this memory, the object "hello" resides at the location 2222. Therefore, the variable
    str actually contains just 2222. It doesn''t contain "hello". It is no different
    from an int variable that contains 2222 in that.


    But there is a difference in the way Java treats reference variables and non-reference
    variables (primitive variables). If you print an int variable containing 2222,
    you will see 2222. However, if you try to print the value str, you will see 2222.
    You will see "hello". This is because the JVM knows that str is defined as a reference
    variable and needs to use the value contained in variable to go to the memory
    location and do whatever you want to that object. In case of an int (or any primitive
    variable), the JVM uses the value as itself. Since this is another concept, let
    me give you another example to visualize it. Let us say Paul has been given 2222
    dollars and Robert that both Paul and Robert have the same number but Paul''s
    denotes actual money in his hands while Robert does not have money at all. Robert
    has an address of the location that has money. Thus, Paul is like a primitive
    variable while Robert is like a reference variable.


    Another point is that you cannot make a reference variable point to a memory location
    directly. For example, you can set the int variable to 2250 but you can''t do
    that to str i.e. you can''t do str = 2250. It will not compile. You can set str
    to another string and if that new string resides at a memory location 2250, str
    will indeed contain 2250 but you can''t store the address of any memory location
    yourself in that reference variable.


    As a matter of fact, there is no way in Java to see and manipulate the exact value
    contained in a reference variable. You can do that in C/C++ but not in Java because
    Java designers decided not to allow messing with the memory directly.


    You can have many references to an object as you want. When you assign one reference
    to another, you basically just copy the value contained in one reference into
    another. For example, if you do String str2 = str; you are copying 2222 into str2.
    Understand that you are not copying "hello" into str2. There is only one string
    containing "hello" but two reference variables referring to it. Figure 1 illustrates
    this more clearly.'
