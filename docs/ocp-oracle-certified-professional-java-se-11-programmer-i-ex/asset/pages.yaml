  md: "```\nString s = \"hello\";\nInteger n = 10;\nSystem.out.println(n == s);\n\
    ```\n\nfalse, you say? Well, the code won't compile. The compiler applies the\
    \ same logic that it applies to the cast and the instanceof to check whether it\
    \ is possible for the two reference variables to point to the same object. It\
    \ rejects the comparison if it is not. In the code above, there is no s and n\
    \ can point to the same object because s and n are variables of unrelated types.\
    \ Thus, the compiler knows that this comparison is pointless and most likely a\
    \ mistake by a programmer. Here is the same code but with a small\n\n```\nObject\
    \ s = \"hello\";\nInteger n = 10;\nSystem.out.println(n == s);\n```\n\nThe above\
    \ code indeed prints false. The compiler cannot reject the comparison now because\
    \ the type of s is\nObject and, it is possible for s to point to an Integer object\
    \ (because Integer is-Object).\n\nThe equals, on one hand, behaves differently.\
    \ Remember that equals is defined in the Object\nclass and its signature is equals(Object).\
    \ The type of the input parameter is Object and therefore, it must\naccept a reference\
    \ of any type. Thus, the compiler has no option to except the illogical invocations\
    \ of\nequals method as \"1234\".equals(n); It is for the same reason that a class\
    \ overrides the equals\nmethod, the first line of the method is usually an instanceof:\n\
    \n```\nclass X {\n int val;\n public boolean equals(Object x){\n    if (x instanceof\
    \ X) return false;\n    //compare the values of instance fields of this x and\
    \ return true\n    return this.val == ((X)x).val;\n}\n```\n\nIf you remember the\
    \ rules of overriding, overriding method is not allowed to change the type of\
    \ the input\nparameter to a new type. Thus, if a class tries to override the equals\
    \ method but changes the type of the input\nparameter from Object to a more specific\
    \ type, it will not be a valid \"override\". It will be a \"overload\"\nfor example.\
    \ The following code will compile, but the equals method does not override the\
    \ equals\nmethod that X inherits from Object:\n\n```\nclass X{\n int val;\n public\
    \ boolean equals(X x){//does not override overloads .\n return this.val = x.val;\n\
    }\n public static void main(String[] args){\n X x1 = new X(); x1.val = 1;\n X\
    \ x2 = new X(); x2.val = 1;\n System.out.println(x1.equals(x2)); //prints true\n\
    }\n```\n\nOn the face of it, the equals method written above doesn't seem to make\
    \ much of a difference when you try\nto compare two X objects. Let's change the\
    \ code inside the main method as follows and see what happens:\n\n```\nX x1 =\
    \ new X(); x1.val = 1;\nObject x2 = new X(); ((X) x2).val = 1;\n```"
