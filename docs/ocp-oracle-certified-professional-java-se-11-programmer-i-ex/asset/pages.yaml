    # 14.1.5 Using Functional Interfaces with Collections


    Generics make Collections type safe, Lambda expressions together with functional
    interfaces give them super powers. The most of the classes and interfaces of the
    API were updated in Java 8 to include methods that accept functional interfaces
    so that programmers can invoke those methods with lambda expressions. Things such
    as iterating, filtering, and replacing elements, then several lines of code can
    now be done by a line of code.


    Since the Part 1 exam explicitly mentions List and ArrayList, let''s see a few
    examples of how functional interfaces and Lists are used.


    # The each method


    As you have seen, iterating through a collection is very common requirement. Prior
    to Java 8, a common way to iterate through a collection was to use a regular for
    loop. The collection interface extends java.util.Iterable interface and so, it
    was also possible to use the enhanced for loop (aka the for-each loop) for this
    purpose.'
