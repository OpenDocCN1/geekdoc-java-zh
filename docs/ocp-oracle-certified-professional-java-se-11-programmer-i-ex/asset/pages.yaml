    \ Fundamentals of the try/catch approach\n\nWhen you are developing code as developing\
    \ a component, you will realize that there are always two stakeholders - the provider/developer\
    \ of the component and the client or the user of the component. For the client\
    \ to be able to use it, it is imperative to tell the client \"how\" it works.\
    \ Your method not only includes the input/output details of the component but\
    \ also the information about exceptional situations, i.e., about situations the\
    \ component knows or may not deal with.\n\nFor example, let's say you are developing\
    \ a method that contains the contents of one file to another this method is to\
    \ be used by a developer in another team. You must convey the other developer\
    \ that you are aware of the Input/Output issues associated with reading and writing\
    \ a file you won't know anything about it. In other words, you must convey that\
    \ you try its best to copy the file if there is an I/O issue, you abandon the\
    \ attempt and let her know about the error so that she can deal with it however\
    \ she wants to. This is done through the use of a \"throws\" clause in method\
    \ declaration.\n\n```\npublic void copyFile(String inputPath, String outputPath)\
    \ throws IOException\\n  // code to copy file\n}\n```\n\nIn the above code, the\
    \ copyFile encounters any I/O issue while copying a file, it will simply abort\
    \ the copying and throw an IOException If it does not encounter any I/O issue,\
    \ the method will end successfully.\n\nOn the other side of the component is the\
    \ user of that component, who uses the information provided by the component provider\
    \ has to decide how she wants to handle the exceptional situation. If she believes\
    \ that she has the ability to \"resolve\" the situation, she will put the use\
    \ of a \"Try\" block with an associated \"catch\" block that contains for \"resolution\"\
    \ of the problem. When that exceptional situation actually occurs, the control\
    \ goes to the catch block instead of proceeding to the next statement after the\
    \ method that threw the exception.\n\nIf the user cannot handle the exceptional\
    \ situation, she propagates the exception to the caller of her component.\n\n\
