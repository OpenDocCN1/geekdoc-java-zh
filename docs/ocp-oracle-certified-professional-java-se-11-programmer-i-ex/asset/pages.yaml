  md: '# 17.1 Java Technology and features of the Java language


    After going through the previous chapters, you already know all you need to know
    about this objective. I will just summarize the important points here.


    Key points on Java Technology and the Java Development


    +   1. **Platform independence** - Java code is compiled into **Java bytecode**,
    which is interpreted by a virtual machine called the Java Virtual Machine (JVM).
    JVM is available for multitude of platforms (CPU+OS architectures). This means
    that this bytecode can run on all platforms without change. Thus, you do not need
    a Java compiler for every platform on you want to run a Java program. A class
    file produced on one platform will run on any other platform as it is, there is
    a JVM for platform. If there is no JVM for a particular platform (e.g., Android
    or iPhone), you cannot run a Java program on that platform.


    +   2. **Installation** - Java is not part of the Operating System. It is an application
    and is installed separately on top of the Operating System. A separate installation
    is available for main desktop OS such as Windows, MacOS, and Linux. As of now,
    Java platform is not available for Android and iOS.


    +   3. **JRE vs JDK** - The Java Runtime Environment (JRE) includes the class
    libraries and executables that are required to run a Java program while the Java
    Development Kit (JDK) includes the tools such as the Java compiler and the Java
    debugger that are required to develop a Java program in addition to a JRE. Thus,
    it is not necessary to install the JDK if you want to run a Java program but installation
    of the JDK requires the installation of the JRE.


    +   4. **Development tools** - Java Development Kit (JDK) comes bundled with several
    applications. Some are pretty much required as the compiler (javac) and some are
    useful during development as debugger (), class inspector (jav), and documentation
    generator (javadoc). It also uses the JVM (java) for most common platforms.


    +   5. **IDE** - An Integrated Development Environment (IDE) is an additional
    third party that makes Java development easier. It contains several tools on top
    of the tools available in the JDK such as code editor, syntax highlighter, and
    source organizer. However, an IDE is not essential for developing a Java program.
    Netbeans, Eclipse, and IntelliJ are some commonly used IDEs.


    +   6. **Platform configurations** - Due to modularization of the JDK, it is now
    possible to split the Java runtime as library or into configurations of varying
    features and sizes. The core Java features are bundled in a readme configuration
    named as the Java SE platform, a minimal JRE image for your application can also
    be created using the modules that are required by your application.


    Key Features of Java -


    +   1. **Object-Oriented** - Java has features such as classes


    +   1. Encapsulation ensures that classes can be designed so that only certain
    fields and methods of an object are accessible from other objects. Java allows
    precise access control by marking data members as public/protected/private (or
    default), which promotes encapsulation.


    +   2. Java allows a class to extend at most one class but also a class to implement
    more than one interfaces. Java supports multiple inheritance of type but does
    not support multiple inheritance of state and implementation.'
