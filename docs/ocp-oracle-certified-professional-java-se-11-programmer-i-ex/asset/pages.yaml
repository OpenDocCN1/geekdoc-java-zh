    # 14.1.2 Parts of a lambda expression


    You have seen that a lambda expression is basically like a method in compact form.
    It has two parts separated by the "arrow" operator, i->. The left side is for
    variable declarations and the right side is for the code that you want. Just like
    a method, a lambda expression can have any number of parameters and return (or
    not return) a value. Java allows expressions to be written in different ways.
    The reason for having so many ways is to cut out as much redundant as possible.
    The exam expects you to know all these ways. You will be asked to identify valid
    and invalid expressions in the exam. From this, I have categorized the into two
    categories - variations on the parameter section and variations on the body section.


    There are three possibilities for the parameter section:


    +   1. No parameter - If a lambda expression takes no parameters, the parameter
    part of the expression must have an empty set of parentheses, i.e., ( ). For example,


    ```

    () -> true //valid

    -> 1 //invalid, missing variable declaration part

    ```


    +   2. One parameter - If a lambda expression takes exactly one parameter, the
    parameter name may be specified within parentheses, i.e., ( pName ) or pName.
    For example,


    ```

    a -> a*a //valid

    (a) -> a*a //valid

    ```


    You may also include the parameter for the parameter name if you want but then
    you will need to use parentheses. For example:


    ```

    (int a) -> a*a //valid

    int a -> a*a //invalid

    ```


    +   3. More than one parameters - If a lambda expression takes more than one parameter,
    all the parameter names must be specified within the parentheses, i.e., ( pName1,
    pName2, pName3 ). For example,


    ```

    (a, b, c) -> a + b + c //valid

    a, b -> a+b //invalid, parameters must be within (

    ```'
