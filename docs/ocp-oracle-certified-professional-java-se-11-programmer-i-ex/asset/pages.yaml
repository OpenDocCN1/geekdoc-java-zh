  md: 'doesn''t make its public contract clear and therefore, it would be unfair to
    blame only the users of this class. This is where Java''s access modifiers of
    Java come into picture.


    # 11.2 Access modifiers


    Java allows a class and members of a class to explicitly specify who can access
    the class and the members using three access modifiers: private, protected, and
    public. Besides these three, the absence of any access modifier is also considered
    an access modifier. This is known as "default". Access modifiers make your intention
    about a member very clear not only to the users of your class but also to the
    compiler. The compiler helps you enforce your intention by refusing to compile
    code that violates your intention. Here is how these modifiers affect accessibility:


    private - A member is only accessible from that class. It cannot be accessed by
    any class in any other class. For example, the problem that I showed you with
    the TaxCalculator could have been easily avoided if the developer had declared
    the rate as private variable. The compiler would prevent the users of this class
    from using the rate variable by refusing to compile the code that tried to use
    it have easily avoided this mistake without any impact on amount.


    "default" - A member has no access modifier applied to all classes that it belongs
    to. This is irrespective of the class trying to access a default member of another
    class is a subclass or a super class of the class. If two classes belong to the
    same package, then each can access each other''s members. This is called "package
    access" or simply "package access".


    protected - A protected member is accessible from two places - if the accessing
    class belongs to the same package or if the class is a subclass irrespective of
    the package it subclass to. The first case is simple because it is exactly the
    same as default access. All classes belonging to the same package can access each
    other protected members. The second case is not so, so I will explain it separately
    in detail.


    public - A public member is accessible from everywhere. Any code from any class
    can make use of a public member of another class. For example, the getTaxAmount
    method could have been public. That would give a clear signal to the users of
    this method if they want to count the amount.


    If you order your access modifiers in terms of how restrictive they are, they
    lie between most restrictive and public is most restrictive. The other, i.e.,
    default and protected, lie between these two. The order of access modifiers from
    the most restrictive to the least would be: private > default > public.


    > In the exam, watch out for non-existent access modifiers such as "friend", "private
    protected", and "default".


    # 11.3 Understanding protected access


    I mentioned earlier that a protected member is accessible from any class that
    belongs to the same package and from any subclass if the subclass belongs to another
    package. This sounds straightforward but the second part of statement is not completely
    true. Since it involves the concept of inheritance, which I haven''t discussed
    yet, I will explain this here with an example. Consider the following two classes
    that belong to two different packages.'
