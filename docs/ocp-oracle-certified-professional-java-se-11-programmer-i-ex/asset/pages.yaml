  md: "Let me continue with the same analogy to show how you can deal with the difference\
    \ between type of a variable and type of the object referred to by the variable.\
    \ Imagine you have the remote for an old model that has a limited number of buttons\
    \ and you are using this to control a TV from a new model that has a lot of features.\
    \ Obviously, you will only be able to use those functions for which there are\
    \ buttons in the remote. Even though the TV supports many functions, you cannot\
    \ use them with the old remote because the old remote has no knowledge of the\
    \ new functions.\n\nThe reference and object behave the same way. The type of\
    \ the reference is like the model of the remote and type of object is like the\
    \ model of the object. The following code makes:\n\n```\nObject obj = \"hello\"\
    ;\nint h = obj.hashCode(); //ok hashcode is defined in Object\n```\n\n```\nint\
    \ i = obj.length(); //will not compile\n```\n\n```\nString str = \"hello\";\n\
    int j = str.length(); //OK\n```\n\nIn the above code, the declared type of the\
    \ reference obj is Object and the type of the object to which it refers to at\
    \ runtime is String. String is a subclass of Object.String is a Object and therefore,\
    \ it is ok to assign a String to obj.\n\nYou can say that String is a kind of\
    \ new Object and has several new features in addition to the features of Object.\
    \ However, since the declared type of obj is Object, the compiler will only let\
    \ you the functionality that is supported by Object because the compiler does\
    \ not know that obj will actually point to a String at runtime.\n\nIf you want\
    \ to use the new features of String using obj, you will need to cast it to String\
    \ using the cast operator:\n\n```\nObject obj = \"hello\";\nString str = (String)\
    \ obj; //cast obj to String\nint i = str.length();\n```\n\n```\nint j = ((String)obj).length();\
    \ //casting and accessing at the same time\n```\n\nThus, the answer to the question\
    \ when casting is necessary is simple. You need casting when you want to use the\
    \ features (i.instance variables and methods) defined in a subclass whose declared\
    \ type is of a superclass.\n\nRemember that casting does not change the actual\
    \ object. The purpose of casting is to provide the compiler with the type information\
    \ of the actual object which a variable will be pointing to at runtime. Thus,\
    \ casting just changes the perspective from which the compiler views it.\n\n#\
    \ Impact on static members\n\nCasting is an essential aspect of object-oriented\
    \ programming while \"static\" is not. Nevertheless, due to the peculiarity of\
    \ the Java language, it is possible to access static members of a type through\
    \ a variable of that type. Recall from the \"Working with Data types\" chapter\
    \ that static members of a type of a \"shadow\" the static members of the same\
    \ name in the type. Casting a variable to a type is you \"unshadow\" those members.\
    \ Here is an example:\n\n```\nclass Fruit{\n  static int count = 5;\n  static\
    \ int getCount(){ return count; }\n}\n```"
