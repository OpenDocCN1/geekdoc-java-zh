    and find how many objects will be eligible for garbage collection right after
    a particular number. For both you need to keep track of the references and the
    objects they reference at each line. It is possible to do all this in your head
    but the questions are designed to make you lose track of the objects and the references.
    Therefore, it is best to use a pen and paper and draw whatever is going on in
    your head. Let me show you the following code where you are expected to find out
