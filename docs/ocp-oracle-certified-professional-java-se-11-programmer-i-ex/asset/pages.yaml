  md: "# 10.5.2 Accessing static members\n\nA static member exists as a member of\
    \ the owning class and not as a member of an instance of the owning class. In\
    \ others, a static member does not require an instance of the owning class to\
    \ exist. A static member, therefore, can be accessed by specifying the name of\
    \ the owning class. For example, the static variables of Foo and Boo can be accessed\
    \ from another class like this:\n\n```\nclass TestClass{\n    public static void\
    \ main(String[] args) {\n        System.out.println(Foo.bar); //prints 0 (why?)\n\
    \        System.out.println(Foo.biz); //prints null (why?)\n        Boo.NestedClass\
    \ nc = new Boo.NestedClass();\n    }\n```\n\nAccessing a static member using the\
    \ name of the owning class is the standard and recommended way of accessing static\
    \ members. However, Java allows a static member to be accessed through a variable\
    \ as well. For example, the static variable bar of Foo also can be accessed like\
    \ this:\n\n```\nclass TestClass{\n    public static void main(String[] args) {\n\
    \        Foo f = null;\n        System.out.println(f.bar); //prints 0 (why?)\n\
    \    }\n```\n\nObserve that f is null. The compiler doesn't care about f being\
    \ null because it notices that bar is a static variable and an instance of Foo\
    \ is not needed to access bar. The compiler knows that bar in the statement f.bar\
    \ implies and translates it to Foo.bar.\n\nThis simple example highlights an important\
    \ aspect of accessing static members: access to static members is decided by the\
    \ compiler at compile time by checking the declared type of the variable. It is\
    \ not decided by the JVM at runtime. The compiler knows that the type of variable\
    \ is Foo and that bar is a static member of Foo, is why the compiler binds the\
    \ call to f.bar to Foo.bar. The compiler doesn't care where f may point at runtime.\
    \ Now, with this knowledge, can you tell what the following code will do?\n\n\
    ```\nclass TestClass{\n    public static void main(String[] args) {\n        Foo\
    \ f = null;\n        f.biz();\n    }\n```\n\nThat's right. It will run (of course,\
    \ without any output). But the interesting thing is that there will be no NullPointerException.\
    \ Since the reference of the variable f is Foo and biz() is a static method of\
    \ Foo, the compiler binds the call to f.biz() to Foo.biz().\n\nThis is called\
    \ static binding or compile time binding because the compiler doesn't leave the\
    \ decision of binding a call to the JVM. This concept will play an important role\
    \ when we discuss inheritance and polymorphism.\n\n# 10.5.3 Accessing static members\
    \ from the same class"
