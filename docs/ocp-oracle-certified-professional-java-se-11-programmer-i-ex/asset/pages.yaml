  md: 'Integer i = Integer.valueOf("10.2"); will throw a NumberFormatException because
    10.2 cannot be parsed into an integer.


    It is interesting that you can pass null or any string to Boolean''s constructor
    or valueOf without any exception. All such values will cause to create a Boolean
    object containing false. To get a Boolean true you can pass "true" (upper, lower,
    or mixed).


    So, what''s the point of having valueOf methods if you can do the same thing using
    constructors?


    The difference between the two is that constructor will always create a new object,
    while the valueOf method may return a cached object. The valueOf methods are,
    more efficient than the constructors and should be used when you don''t need to
    use separate wrappers for the same value.


    +   3. Through auto-boxing - Until Java 1.4 every time you wanted to use a wrapper
    object, you would have to use either a constructor or a valueOf method to create
    it. Since wrappers are used quite often, this was considered too much of a tying
    for such a mundane task.


    To make things a little easier and cleaner, Java 1.5 introduced the concept of
    "auto-boxing". It means that if you assign a primitive value to a wrapper, the
    compiler will automatically box the primitive value into a wrapper object. So,
    instead of using Integer i = Integer.valueOf(100); you can just write Integer
    i = 100;


    Similarly, if you use the valueOf method instead of constructor you can just pass
    the primitive and the compiler will automatically box it into a wrapper object.
    For instance, instead of using myList.add(Integer.valueOf(100)); you can write,
    myList.add(100).


    Observe that I have used valueOf method instead of constructor to illustrate the
    explicit creation of wrapper objects and autoboxing. This is deliberate. The reason
    is that autoboxing of byte, short, char, int, long, and boolean uses objects instead
    of creating new instances just like the valueOf methods. Thus, i1 and i2 in the
    code below refer to the same Integer wrapper object:


    ```

    Integer i1 = 100;

    Integer i2 = 100; // i2 will refer to the same object as i1.

    ```


    Just like the valueOf, auto-boxing of values from -128 to 127, true and false,
    and ''\u0000'' to ''\u007f'' will result in cached objects. Wrappers for other
    values may also be cached but that is not guaranteed.


    # 3.4.3 Converting wrapper objects to primitives


    There are two ways to get primitives from wrapper objects:


    +   1. Using xxxValue methods - All classes provide an instance method that returns
    the value wrapped by that object as a primitive. The name of this method follows
    the pattern <type>Value. For example, Integer has intValue(). Boolean has booleanValue(),
    and Character has charValue which returns int, boolean, and char respectively.


    Recall that wrappers for numeric types (i.e. Byte, Short, Integer, Long, Float,
    Double) have a common base class called Number. This class defines byteValue and
    shortValue methods and declares intValue, longValue, floatValue, and doubleValue
    methods. Therefore it is possible to get a primitive value of any of these types
    from any numeric wrapper class'
