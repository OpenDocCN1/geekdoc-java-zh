  md: '# 14.1.4 Functional Interfaces


    The Predicate interface that you saw just now is among several interfaces defined
    in java.util.function package. The Predicate captures the use case for testing
    a condition. In the same way, java designers have identified several use cases
    that are encountered in day to day development and have created already interfaces
    for them so that every project does not have to define the same kind of interfaces
    and again. These interfaces belonging to a category of interfaces known as "Functional
    interfaces", are not limited by the fancy name. Any interface with exactly one
    abstract method is a functional interface. It may have other static or default
    methods but it must have one and only one abstract method. This abstract method
    is called the "functional method" of that interface. For example, the functional
    method of the Predicate interface is boolean test(T t). Having exactly one abstract
    method is important because it allows you to implement such interfaces using Lambda
    expressions.


    The reason they are called functional interfaces is that they represent a single
    function without maintaining any state. A functional interface means to do exactly
    one thing. For example, if you take look at the Predicate interface, you will
    notice it check a condition. But the logic for the actual condition is not there
    in the functional method (it is an abstract method). The logic is provided by
    the code that implements it. The benefit of this approach is that it allows you
    to separate the logic from the data object. That is why it is called "functional
    programming". Observe that this is exactly opposite to the approach adopted by
    Object-Oriented Programming, in which an object contains data as well as the logic
    to operate on.


    OCP Part 11 does not mention the topic of functional interfaces explicitly but
    it contains questions that refer to a few functional interfaces defined in the
    java.util.function package, namely, Predicate, Consumer, Supplier, and Function.
    The exam expects you to know the basic usage of these interfaces without going
    into the details too much. You have already seen the usage of the Predicate interface.
    I will talk about the rest.


    # java.util.function.Consumer


    A Consumer<T> is to "consume" an object of type T. By consume, we mean that we
    want to do something with the object. The functional method of the Consumer is
    named accept(T t). You just need to write the code for what you want to do with
    the object in this method. For example:


    ```

    //creating a consumer that consumes a String.

    Consumer<String> strConsumer = s -> System.out.println(s.length());

    strConsumer.accept("hello"); // prints 5

    ```


    In the code above, lambda expression contains only the logic for the String argument.
    It doesn''t contain the actual data on which this logic is to be applied. The
    actual data comes in the next statement.


    # java.util.function.Supplier


    A Supplier<T> supplies an object of type T. Its functional method is T get().
    Here is an example that illustrates its usage:


    ```

    public List<Car> getCars(Supplier<Car> carSupplier){

    List<Car> cars = new ArrayList<>();

