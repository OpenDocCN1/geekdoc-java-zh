    # ### 2.1.3 The end of main


    As discussed before, the JVM passes control to the main method of the class that
    you are trying to execute, it is the main method decides what to do next. As far
    as the JVM is concerned, your application has "launched" upon invocation of the
    main method. In that, the main method is just an entry point of your application.
    What happens when the main method ends? Does the application end? Well, it depends
    on how the main method ends.


    A simple Java program as the one we used to print arguments may have all its code
    in the main method. Once the main method ends, there is nothing left to do and
    so, the program ends. While you can write all your application code within the
    main method, Java applications are generally composed of multiple classes. They
    interact with each other by calling methods on each other. A Java application
    may perform multiple activities in parallel, so if an activity implemented by
    itself may still be going. The code in main itself is activity. The end of one
    activity implies the end of that activity. It doesn''t mean the end of all the
    activities that may be running in an application.


    If it helps, you may think of your Java application as a fast food restaurant
    and the main method as its manager opening the restaurant in the morning. The
    restaurant need not close immediately after opening if there are no customers
    lined up. After opening the restaurant, the manager kicks off a lot of activities
    such as preparing the food, setting up the area, and waiting for customers. Such
    activities may continue by side throughout the course of the day. When the last
    customer of the day is gone and all such ends, the restaurant closes for the day.
    The same thing happens in a Java application. The main method may kick off other
    activities that run side by side and the application ends when all such activities
    come to end.


    Java allows executing activities in parallel using threads. This topic is beyond
    the scope of this exam, I will not discuss it in this book. But you should know
    that in a nutshell, an application doesn''t end until the threads are started
    by the application, including the thread that executes main, end.'
