    \ and pass them as arguments for p1 and p2 respectively.\n\nResolving this ambiguity\
    \ with complicated rules would make the varargs feature too confusing to use,\
    \ Java imposes the following two restrictions on varargs:\n\n+   1. A method cannot\
    \ have more than one varargs parameter.\n2. The varargs parameter, if present,\
    \ must be the last parameter in the parameter list of method.\n\nWith the above\
    \ two rules in place, it is easy to understand what will happen if you have a\
