  md: 'several statements that create objects using the new keyword but if those statements
    are not executed, obviously, no object will be created. Indeed, the code that
    we write is merely a set of instructions to the JVM. Nothing actually happens
    unless a program is executed. In Java, execution of the code is done through "threads".
    When you run a program the a "main thread" is created automatically and this thread
    starts executing the statements written in the main method. These may be simple
    elements such as i=10; or you could call methods, in which case the thread executes
    the statements written inside before moving on to the next statement in the main
    method. Java also allows you to create your own threads and give them separate
    sets of instructions to execute. All code that falls under the scope of the main
    thread and the threads created by the programmer is hitting the active part of
    a program. When a thread dies, that is, when it finishes all the instructions
    that falls under its scope; the main thread dies when it reaches the end of the
    main method), any object that was created by this thread will be eligible for
    garbage collection unless the object is still held by some other thread.


    For the purpose of the OCP Part 1 exam, you do not have to worry about threads
    or the impact of threads on garbage collection. The exam merely scratches the
    surface of this topic. The exam only expects that you understand the meaning of
    garbage collection


    gbage collection and that an object can be garbage collected when there are no
    references pointing to that object. You should be able to trace the reference
    variables pointing to an object and identify the point where object loses its
