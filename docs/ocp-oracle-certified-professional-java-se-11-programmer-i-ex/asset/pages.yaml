  md: 'As you know, Throwable is the root of all exception classes, and therefore,
    if you declare Throwable in the throws clause, you can throw any exception in
    the method.


    Although not important for the exam, deciding which exception to throw and which
    to declare is an important matter.


    # Declaring exceptions


    As shown in point number 8 above, declaring a broad exception class in the throws
    clause is an easy way to get rid of any compilation errors with the method if
    the method throws different kinds of exceptions from different parts of its code.
    However, this is considered a bad practice because it burdens the user of the
    method dealing with a broad range of exceptions.


    On the other hand, listing specific exception classes individually restricts the
    future modifiability of a method because throwing new exceptions will break other
    people''s code.


    It is recommended to be balanced in your approach towards listing exceptions in
    the throws clause. You should try to be as specific as possible without compromising
    the modifiability of the method. For example, IO/related methods may encounter
    different kinds of issues while reading a file. It may not be possible to identify
    all such issues while writing the method. New issues may be discovered later and
    you may have to modify your method to accommodate those. Therefore, it is better
    to declare a superclass IOException in the throws clause instead of individual
    subclasses as FileNotFoundException or EOFException.


    # Throwing exceptions


    You should always throw the most specific exception possible. For example, if
    you do not find the file trying to open it, you should throw a FileNotFoundException
    instead of an IOException or Exception. By throwing the most specific exception,
    you give more information to the caller about the problem. This helps the caller
    in determining the most suitable resolution of the problem.


    # 15.3.2 Throwing exceptions from initializers and constructors


    Throwing exceptions from static initializers


    The JVM executes static initializers when it loads a class. Through the application
