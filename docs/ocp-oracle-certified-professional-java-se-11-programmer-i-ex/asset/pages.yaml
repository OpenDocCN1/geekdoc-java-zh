  md: "# 13.3.2 Generics\n\nAlthough Generics is a huge and complicated topic that\
    \ deserves a chapter or two of its, I will try to introduce it to you in an easy\
    \ to understand manner. My objective is not to overwhelm you with too much complexity\
    \ but to provide you with the foundation required for the OCP Java 11 Part 1 exam.\n\
    \nThe purpose of introducing generics in Java is to enhance type safety of the\
    \ code. Type safety is important because it prevents a category of bugs due to\
    \ wrong assumption about the type of objects at runtime. For example, if the developer\
    \ assumes an object pointed to by a variable will be of type String and creates\
    \ the code accordingly, and if it runs out that the object is actually of type\
    \ SavingsAccount the code will fail. Had the compiler warned the developer that\
    \ their assumption will be wrong at runtime, the developer would have fixed the\
    \ type code and then\n\nHere, \"making an assumption\" essentially means creating\
    \ a variable that was declared to be one type but another. You have seen cases\
    \ where the compiler will not allow such a case. For example, the compiler will\
    \ simply refuse to compile Integer i = 10; String s = i; The compiler knows that\
    \ the declared type of i is Integer and String classes do not have a parent-child\
    \ relationship, there is no way i can ever convert to an object of type String.\
    \ The compiler correctly points out that this is a programming mistake. But, as\
    \ with the code snippet using ArrayList in the previous section, there are cases\
    \ where the compiler does not have enough information to prevent the developer\
    \ from making incorrect assertions. In that code, the compiler had no knowledge\
    \ about the type of objects contained in the list and, so it had no option to\
    \ allow the compilation to succeed. It simply generated a warning to the programmer\
    \ that the code may run into issues at runtime.\n\n# Parameterized classes\n\n\
    The first challenge, in enhancing the type safety in a piece of code is to add\
    \ type information to a class, which the compiler can use to prevent inappropriate\
    \ cases. One could achieve that by creating a class with many specific types of\
    \ Object. For example, one could copy the code from ArrayList, make some changes\
    \ to it and create a String that would use String, Object, as the type of input\
    \ parameters and return types in its methods. This solution has an obvious shortcoming:\
    \ you would need to define a new class type every time you need to create a clone\
    \ of the new. This is an impractical solution. The second challenge, however,\
    \ is to prevent duplication of the code. What we really need is a way to write\
    \ a class in generic fashion, without having to hardcode it to any particular\
    \ type, but also that class be typed to any type as the requirement, at the time\
    \ of using it.\n\nThis is exactly what \"parameterized\" classes in Java allow\
    \ you to. Instead of using an actual type while coding a class it sounds complicated\
    \ but the following example will make this clear:\n\n```\npublic class DataHolder<E>\
    \ {\n    E data;\n    public E getData() { return data; }\n    public void setData(E\
    \ e) { data = e; }\n}\n```\n\nIn the above code, instead of using any specific\
    \ class as the type of data variable, we have a placeholder named <E>. The name\
    \ of the placeholder does not have to be E. You could name it anything but, only\
    \ a single capital letter is used for this purpose. Observe the part where it\
    \ says <E> in class declaration. This tells the compiler that E is just a placeholder\
    \ and E will be replaced by the actual type later on when this class is\n\n![](img/f7bc00fabb8855fa5663a81b5e778ee0_321_0.png)"
