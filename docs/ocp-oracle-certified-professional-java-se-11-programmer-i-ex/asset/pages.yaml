    # Compiling individual module source files


    It is possible to compile module source files using the --module option by listing
    the files (either individually or using a wildcard) that you want to compile.
    For example, the following old style command will produce the result as produced
    by the command used above:


    ```

    c:\ocp11\modetest>javac -d out\simpleinterest src\simpleinterest-module-info.java
    src\simpleinterest\simpleinterest SimpleInterestCalculator.java

    ```


    Observe that you have to specify the module root component simpleinterest in the
    output path explicitly. With this, the compiler will save the output instead of
    out\simpleinterest. Listing individual files for compilation is not necessary
    to compile a module and is seldom used. You will not be tested on this in the
    exam. For the purpose of the exam, you are expected to know how to compile a module
    using the --module switch.


    # 16.2.2 Running a module


    Running a module executing the main method of a class in that module. Thus, the
    class that you want to execute must have the standard main method. The following
    command shows how to run our simpleinterest module that we compiled.


    ```

    c:\ocp11\modetest>java --module-path out --module simpleinterest/simpleinterest.Simplecalculator

    ```


    This command uses two switches: --module-path and --module.'
