  md: '# 8.1 What is a loop


    # 8.1.1 What is a loop


    A loop causes a set of instructions to execute repeatedly until a certain condition
    is reached. It''s like when the kids keep asking, "are we there yet?", when you
    are on a long drive in a car. They ask this question in a "loop", until you are
    there :) Or until you "break" their loop by putting on a DVD.


    Well, in Java, loops work similarly. They let you execute a group of statements
    multiple times or even forever depending on the loop condition or until you break
    out of them. Every repetition of execution of the statements is called an iteration.
    So, for example, if a group of statements is executed 10 times, we can say that
    the loop ran for 10 iterations.


    Loops are a fundamental building block of structured programming and are used
    extensively for tasks ranging from the simple such as counting the sum of a given
    set of numbers to the complicated such as showing a dialog box to the user until
    they select a valid file.


    Java has three different ways in which you can create a loop - using a while statement,
    using a do/while statement, and using a for statement. Let''s take a look at each
    of them one by one.'
