    );\n    }\n}\nclass ChildB extends Parent{\n    static{\n        System.out.println(\"\
    Initializing childB\");\n    }\n}\npublic class TestClass{\n```\n\n3. If the class\
    \ has a subclass, and the superclass hasn't been initialized already, the JVM\
