  md: '# 0.4 Will this be asked in the exam?


    While going through this book, you will be tempted to ask this question many times.
    Let me answer this question at the beginning itself. I talk about concepts in
    this book that are not explicitly listed in the official exam objectives wherever
    I deviate from the official exam objectives, I clearly specify so. You are free
    to ignore that and move on. I hope you do not skip such sections because of the
    following reasons.


    +   1. While discussing a rule of the language, I may have to refer to some terms
    and concepts for the sake of completeness and technical accuracy. For example,
    let''s say we are talking about public classes in a file. If I state that you
    cannot have more one public class in a file, it is fine for the purpose of the
    exam but it is technically incorrect because you cannot have any number of nested
    classes. Thus, it would be better to state that you cannot have more than one
    public-level class. How about one public level class and one private interface?
    Nope, you cannot do that either. Then, the statement is incorrect. The correct
    statement would be that you cannot have more than one top-level reference type
    in a file. As you can see, it is imperative for me to mention the meaning of the
    terms reference type, nested class, and level class, even though you would not
    be tested on them in the exam.


    If you absolutely do not want to spend any time learning anything that is not
    part of the exam, then this book is not for you. If you want to stick to the objectives
    as much as possible, but if I believe you need to know something, I talk about
    it even if it is beyond the scope of the exam.


    +   2. I have noticed many of the certification aspirants are Java programmers
    who are either in school or want to start their career with Java programming.
    They want to get certified because they ultimately want to land a job as a Java
    programmer. These programmers will be facing a lot of technical interviews as
    well. I want these programmers to do well on technical interviews.


    Certification may get you a foot in the door but you will need to back it up with
    strong knowledge of fundamentals in the industry. Therefore, if I believe that
    something is important for you to know or that something will be helpful to you
    in your technical interview, irrespective of whether it is asked in the exam or
    not, I will discuss.


    +   3. Official exam objectives are neither detailed nor exhaustive. They list
    top level topics that you need to study but leave out finer details. You will
    be asked questions that require you to know those concepts.


    +   4. Oracle adds new questions to the exam before adding a new topic in the
    official exam objectives. These questions may not be included in your final score,
    i.e., answers on questions are not counted towards your score on the exam. However,
    testers do not know if a question is asked or so, you must attempt it if it will
    be counted towards their final score.


    Since we, at meantime, conduct classroom training as well, we receive feedback
    from testers asking questions on topics that are not in the exam objectives. After
    receiving multiple reports, we may decide to add that topic to our content. We
    clearly specify the reason for our inclusion.


    +   5. Official exam objectives are not to time. Although not frequently, Oracle
    does add and remove topics from the objectives from this time. This may render
    some of the content not relevant for the exam. I will update the content as soon
    as possible.


    If you are interested in getting your basics right, then I suggest you do not
    worry too much about the exam objectives while following this book. Even if you
    spend a little more time (not more than 10%, I promise) in your preparation because
    of this extra content, it will be worth your while.'
