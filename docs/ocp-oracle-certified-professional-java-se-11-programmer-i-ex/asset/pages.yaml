  md: "actually used by another piece of code. The code in DataHolder is written as\
    \ if the type of data variable E. The code in this class is generic enough to\
    \ cover the type with which E is replaced. In parlance, DataHolder is a parameterized\
    \ class, because it uses a type parameter (E is the type parameter, in this case)\
    \ for this type that it uses in its code.\n\nLet us now see how this class can\
    \ be used by other people. Let us see a class that consumes a DataHolder object\
    \ containing String. The code for such a class is:\n\n```\npublic class someClass\
    \ {\n    public static void consumeData(DataHolder<String> stringData) {\n   \
    \     String s = stringData.getData(); // no cast required\n        // do something\
    \ with it\n        Integer i = (integer) stringData.getData(); // will not compile\n\
    \    }\n}\n```\n\nObserve the usage of <String> while declaring parameter. Here,\
    \ String is the parameter (type argument, to be precise) that is being passed\
    \ to the parameterized class DataHolder. In parlance, we call it \"binding\" to\
    \ String. It tells the compiler that String can be passed to this method. With\
    \ this declaration, the compiler gets all the information that it needs to prevent\
    \ a programmer from making wrong assumption about the argument contents. Note\
    \ that this applies only to the String variable and not to all DataHolder objects\
    \ in the program. The DataHolder object referred to by the stringData variable\
    \ is guaranteed to contain String here. A program could potentially use another\
    \ DataHolder typed to a different type.\n\nThere are three important points to\
    \ understand in the code below:\n\n+   First, no cast is required to assign the\
    \ value returned by getData to s. The compiler knows that the DataHolder pointed\
    \ to by stringData has been typed to String. So, stringData.getData() will always\
    \ return a String.\n\n+   Second, the compiler will not let you cast the value\
    \ returned by stringData.getData() to any type that is not a String. The reason\
    \ is the same. The compiler knows stringData.getData() can never return anything\
    \ other than a String and returning the value to Integer is a programming error.\n\
    \n+   Finally, the compiler will not let you invoke the consumeData method with\
    \ anything other than a DataHolder typed to String. For example, the following\
    \ code in another class will not compile:\n\n```\npublic class testClass {\n \
    \   public static void main(String[] args){\n        DataHolder<Integer> dh =\
    \ new DataHolder<Integer>();\n        SomeClass.consumeData(dh); // will not compile\n\
    \    }\n}\n```\n\nThe compiler knows that SomeClass.consumeData expects a DataHolder\
    \ containing String. So, it will not let the programmer make the mistake of invoking\
    \ this method with a DataHolder typed to Integer.\n\nObserve that the compiler\
    \ is able to guarantee that the call to stringData.getData() inside consumeData()\
    \ method will return a String only because it prevents invocation of consumeData\
    \ method with a DataHolder typed to anything other than String from compiling\
    \ in the first place! No loose ends,\n\nYou may wonder at this point how the above\
    \ code is better than simply declaring the data variable as Object."
