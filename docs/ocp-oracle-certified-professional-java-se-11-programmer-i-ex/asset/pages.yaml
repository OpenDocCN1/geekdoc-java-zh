  md: 'Note Java has a deep rooted exception hierarchy, which means there are several
    classes, subclasses, and subclasses of subclasses in the tree. So just because
    an exception is a RuntimeException, does not mean that exception directly extends
    RuntimeException. It could be a grand child of RuntimeException. For example,
    ArrayOutOfBoundsException actually extends IndexOutOfBoundsException, which in
    turn extends RuntimeException. Similarly, just because an exception is checked
    does not mean it directly extends Exception. It may extend any subclass of Exception
    (RuntimeException, of course).


    # Rationale checked and unchecked exceptions


    Recall on our exceptional situations where I talked about two kinds of exceptional
    situations - ones that a developer doesn''t expect to occur at all. While a developer
    may want to provide an alternate path in case of a situation that is expected
    to occur there is no point in providing an alternate path of exception for a situation
    that is not expected to occur.


    For example if a piece of code tries to write a file, the developer may want to
    take a different approach if he is not able to write to the file. If the system
    is already trying to write it, there is nothing he can do. Such unexpected situations
    occur mostly due to badly written code. In other words, if code gets into an unexpected
    situation, its most likely because of a programming error, i.e. a bug in the code.
    Such issues should be fixed during development and if they occur in production,
    they should be handled at a much higher level than the component level.


    Unchecked exceptions are for unexpected situations. Java language designers that
    unchecked exceptions need not to be declared in a method declaration because there
    is nothing forcing the caller to catch them. Only checked exceptions need to be
    declared because the caller of the method may have a plan to recover from them.
    There are two kinds of unchecked exceptions - extend java.lang.RuntimeException
    (aka exceptions) and exceptions that extend java.lang.Error (aka errors).


    # Runtime exceptions and expected errors


    Characterizing a situation as expected or unexpected is a design decision that
    depends on the business purpose of the method. One method may expect to receive
    a null argument and work well if it gets a null argument, while another may not
    expect a null argument and end up throwing a NullPointerException when it tries
    to access null. In the second case, a path to throw null would be considered a
    bug in the code, which must be identified and fixed during testing. Such signifying
    that the presence of a bug in the code is categorized as runtime exceptions.


    Here, where RuntimeException does not imply that only exceptions that extend RuntimeException
    can be thrown at runtime. All exceptions are thrown when the program is executed,
    at runtime. It refers to the fact that the developer comes to know the occurrence
    of the situation that results in a RuntimeException only when the program is running,
    during runtime. The had programmer anticipated the occurrence of the situation
    during coding time, he would write the code, and in which case the exception would
    have been thrown upon running the program. For the same reason, exceptions are
    usually not explicitly using the throw statement. When would you write the code
    to throw an exception if you don''t expect it to occur. The JVM throws exceptions
    only when it encounters an unexpected situation. For example, if you try to access
    a null reference, the JVM will throw a NullPointerException, or if you try to
    access an array the JVM will throw an ArrayOutOfBoundsException. It is possible
    to recover from runtime exceptions but, since they indicate bugs in the code,
    you should not attempt to catch them and recover from them. A well written program
    should not cause the JVM to throw runtime exceptions.


    The case of errors is runtime exceptions. The difference is that errors are reserved
    for situations where the operation of the JVM itself is in jeopardy. For example,
    a badly written code may consume so much memory'
