    # 6.1.1 Overview of operators available in Java


    Java has a large number of operators. They can be classified based on the type
    of operations they perform (arithmetic, relational, logical, bitwise, assignment,
    miscellaneous) or based on the number of operands they operate (unary, binary,
    and ternary). They may also be classified on the basis of the type of operands
    on which they operate, i.e., (including primitive wrappers) and objects.


    While, as a Java programmer, you should be aware of all of them, for the purpose
    of the exam, you can ignore a few of them. The following sections provide a brief
    description of all the operators. The ones that are not required for the exam
    are noted as such.


    # Arithmetic Operators


    Arithmetic operators are used to perform standard mathematical operations on all
    primitive variables except boolean. They can also be applied to wrapper objects
    for numeric types (i.e. Byte, Short, Character, Integer, Long, Float, Double)
    due to auto-unboxing.


    | Operator(s) | Brief description and Examples |


    | +,-,*, (Binary) | Addition, subtraction, multiplication, and division. |


    Example:


    ```

    int a = 10;

    Integer b = 100; //using primitive wrapper here

    int c = a + b;

    ```'
