  md: "# Comments\n\nJava source files can also contain comments. You will not get\
    \ questions on comments in the exam but it is good to know that there are two\
    \ ways to write comments in a Java source file - a single line comment, which\
    \ starts with a // and automatically closes at the end of the line (that means\
    \ you don't close it explicitly) closing and a multi line comment, which opens\
    \ with /* and ends with */. Multi line comments don't end. Meaning, the comment\
    \ will start with /* and end as soon as the first /* is encountered.\n\nComments\
    \ are completely ignored by the compiler and have no impact on the result class\
    \ file.\n\nThe following are a few examples:\n\n```\n//this is a short comment\n\
    /*\nThis is a multi line\ncomment.\n*/\n/*\nThis is a multi line\ncomment.\n//This\
    \ is another line inside a comment\n*/\n```\n\n# JavaDoc\n\nJava promotes writing\
    \ well documented code. It allows you to write descriptions for fields, methods,\
    \ and constructors of a class through use of comments. If you write comments in\
    \ a certain format, you can produce HTML documentation for your code using the\
    \ JavaDoc tool. This format is called the JavaDoc comment format and it looks\
    \ like this:\n\n```\n/*\n* Observe the start of the comment. It has an extra\n\
    * Each line starts with a *\n* There is a space after *\n* <h3>You can write HTML\
    \ tags here.</h3>\n* @param Description of each return value starts with @return\n\
    * @see tag is used to add a hyperlink to description of another class\n* @param\
    \ name the location of the image, relative to the url argument\n* @return the\
    \ image at the specified URL\n* @see SomeOtherClassName\n```\n\n```\npublic String\
    \ sayhello(String name) {\n  return \"Hello,\" +name;\n}\n```\n\nThe JavaDoc tool\
    \ comes with the JDK. It can extract all the information contained in the comments\
    \ written in the above format and generate nicely formatted HTML documentation.\
    \ In fact, all the Standard library classes contain descriptions in the above\
    \ format. It is these descriptions that are used to generate the HTML pages of\
    \ the Java API documentation automatically using the javadoc tool."
