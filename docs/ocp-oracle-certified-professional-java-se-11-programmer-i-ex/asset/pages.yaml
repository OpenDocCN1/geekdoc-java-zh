  md: "```\npublic abstract void assemble(); // ends with a semicolon, no opening\
    \ and\n}\n```\n\nThe benefit of adding methods to a class is that other components\
    \ can work with all objects uniformly. For example, a class that assembles furniture\
    \ doesn't need to worry about whether it is a Chair or a Table. It can simply\
    \ call assemble() on any kind of furniture it gets. Something like this:\n\n```\n\
    class FurnitureAssembler{\n    public static void assembleAllFurniture(Furniture[]\
    \ allFurniture) {\n        for(Furniture f : allFurniture) {\n            f.assemble();\n\
    \        }\n    }\n}\n```\n\nBut adding an abstract method to the parent class\
    \ has an impact on child classes that the child classes are now obligated to provide\
    \ an implementation for the abstract method. For example, we will need to update\
    \ the code for our Chair and Table classes as follows:\n\n```\nclass Chair extends\
    \ Furniture{\n    //fields and methods specific to Chair\n    public void assemble()\
    \ {\n        System.out.println(\"Assembling chair!\");\n    }\n}\nclass Table\
    \ extends Furniture{\n    //fields and methods specific to Table\n    public void\
    \ assemble() {\n        System.out.println(\"Assembling table!\");\n    }\n}\n\
    ```\n\nThis makes sense because a piece of furniture already exists then we must\
    \ be able to assemble it as per our definition of Furniture. The only reason why\
    \ a subclass of Furniture may be unable to have a method to assemble is if that\
    \ subclass is abstract! For example, what if you have a subclass of Furniture\
    \ called FoldingFurniture? FoldingFurniture is an abstract concept and can be\
    \ modeled as an abstract class that extends Furniture. Any concrete subclass of\
    \ FoldingFurniture will provide an implementation for the assemble method.\n\n\
    If you are confused how the code for FurnitureAssembler can invoke the assemble\
    \ methods of Chairs and Tables when it not even know about their existence, don't\
    \ worry. I will talk about it in detail in the section about polymorphism.\n\n\
    # 12.2.3 Using final classes and final methods\n\nYou have seen use of final while\
    \ declaring variables. It implies that the variable is a constant, i.e., the value\
    \ of the variable does not change throughout the execution of the program. The\
    \ final keyword can also be applied to classes and methods (static as well as\
    \ instance) implying something similar. It means the behavior of the class or\
    \ the method cannot be changed by any subclass.\n\nObserve that final is diametrically\
    \ opposite of abstract. You make a class or a method abstract because you want\
    \ a subclass of class to provide different implementation for that class or method\
    \ as the business logic of the subclass. On the other hand, you make a class or\
    \ a final method because you don't want the behavior of the"
