  md: '# 1.2 Why is something so


    # 1.2.1 Why is something so?


    Why does Java not have **pointers**? Why does Java have static fields and methods?
    Why does Java not have **multiple inheritance**? Why does this work that doesn''t?
    While learning Java, curious minds get such questions very often. Throughout the
    book, you will come across rules and conventions that will trigger such questions.
    Most of the times it is not too complicated. I will explain four points that will
    help you answer most of such questions. I will also refer to them throughout the
    book warranted


    +   1. **To help comprehend the code** - As discussed in the API section, writing
    Java code, you should think about developing **components** instead of writing
    just **programs**. The difference between the two is in the way they allow themselves
    to be interchangeable. You can make a 3 pin socket that has ground on the left
    instead of the top? No makes such a thing because it won''t allow any other plug
    to be plugged in. In that, Components are like generic Lego blocks. You can mix
    and match the blocks with basic functionality and build bigger blocks. You can
    take out one and replace it with another block that has the same connectors. It
    is the same with software


    A well-developed software component is as **generic** as possible. It is possible
    to do one thing and allow others to use it without making it dependent on it.
    Dependency here means that you should be able to easily replace this component
    with another component that does the same thing. Indeed, you should be able to
    replace a 3 pin socket for another without needing to replace the entire appliance!


    A program, is a monolithic pile of code that does everything without exposing
    generic and clear interfaces. Once you start a program, it is almost impossible
    to replace it with another without impacting all other pieces that you work with.
    It is very much like a connector that connects a device to a computer. You have
    to buy the new PC card to support that connector. If the connector goes missing,
    you are dependent on the maker of that connector to provide you with a replacement,
    at which point, you will wish that you had bought a device with a USB connector
    instead. Only a few companies can pull this stunt on their customers.


    Java is designed with this mind. You will see that many confusing rules are precisely
    because they promote the flexibility of interchangeable components. For example,
    an overriding method cannot throw a generic exception except the one declared
    by the overridden method. On the other hand the constructor of a subclass cannot
    throw a more specific exception than the one thrown by the constructor of the
    superclass. Think about that.


    +   2. **To eliminate the scope for bugs** - Java designed to limit or eliminate
    features that increase the possibilities of bugs in C++. **Pointer arithmetic**
    and **goto** are examples of that. They have also tried to add features that help
    writing bug-free code. **Automatic Garbage Collection** and **Generics** are examples
    of that.


    +   3. **Make life easier for the programmer** - many older languages like C/C++
    had the flexibility to do various kinds of tasks. Putting restrictions on what
    a programmer can do was thought of as a bad idea. The core, how to add features
    that will let the programmer do more and more was the focus. Every new language
    added more new features. For example, C++ has pointer arithmetic, global functions,
    operator overloading, exception declarations, processor directives, unsigned data
    types, and so many other ''features'' that Java does not have. These are some
    powerful tools in the hands of a C++ programmer. So, why doesn''t Java have them?
    Java actually goes in reverse with respect to features. Java does not have a lot
    of features that are found in languages that came before Java. The reason is Java
    follows the philosophy of **making life simpler for the programmer**. Having more
    and features is not necessarily a good thing. For example, pointer arithmetic
    and memory allocation and deallocation of objects is powerful but it makes life
    hell for the programmer. Thus, unlike C++, there is no need to allocate'
