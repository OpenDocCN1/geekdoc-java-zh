    To be able to apply an annotation, you do have a type for the variable: (@NotNull
    integer a) -> a*a. So you want to use an annotation on a lambda parameter but
    don''t want to specify the type, you can use the var declaration, like this: (@NotNull
    var a) -> a*a.


    The syntax of the code of a lambda expression is simple. It can be either an expression
    or a block of code contained within curly braces. Given that the body may or may
    not return a value, there are four possibilities:


    +   1. Expression with or without a return value - This is the most common use
    case and is the smallest. You can simply put an expression on the right side of
    -> If the expression has a return value and if the lambda expression is supposed
    to return a value, the compiler will figure out that the value generated by the
    expression is to be returned and will insert a return statement on it owner. You
    must not write the return keyword. For example:


    ```

    a -> a + 2 //valid

    a -> return a + 2 //invalid, must not have return keyword

    ```


    Similarly, an expression that doesn''t return any value can be used directly as
    the body of the lambda expression. For example:


    ```

    (a, b) -> System.out.println(a+b)

    //method call is a valid expression

    ```


    +   2. Block of code or without a return value - If you have multiple lines of
    code, you must write them within curly braces, { }. If the expression is supposed
    to return a value, you must use a return statement to return the desired value.


    This is pretty much like writing a method body or without a return value. You
    can use this syntax even if you have just one statement in the body. For example,
    here is Lambda that returns a value:


    ```

    (a) -> {

