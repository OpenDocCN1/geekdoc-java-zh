  md: '# 1.1 Key points in OOP


    # 1.1.1 A matter of perspective


    A couple of years ago, while I was visiting India, I had a tough time plugging
    in my laptop charger in the 3-pin sockets. Even the international socket adapter
    kit, which had adapter pins of various sizes, was not of much help. Sometimes
    the receiver would be a bit small and the pins wouldn''t make steady contact or
    the pins would be a bit too wide and would go into the receiver. I had to finally
    cut some wood and stick the bare wire directly into the sockets. I wondered, why
    all these sockets in the same country have slight differences. During my stay,
    I observed that some minor variations were present in other things as well. Doors
    wouldn''t completely close, nuts that wouldn''t turn properly, taps wouldn''t
    stop leaking, and other things. Most of the time, people take the trial and error
    approach when replacing parts. They work with the expectation that if they get
    a part with the right size, it will not fit perfectly. In other words, minor variations
    are expected and tolerated.


    This was unimaginable in the US, where everything just fits. I could buy a bolt
    from one shop and from another, and it would work perfectly. Everything from screws,
    nuts and bolts, to wood panels, electrical parts, packing boxes, is standardized.
    One can easily replace a part with another by a totally different company. You
    just have to fit the "size".


    This experience led to a potential cause of why some learners find OOP confusing.
    Especially beginners from non-western background found it really tough to grasp
    the fundamental concepts because they do not know the reason behind many rules
    of OOP. This is reflected in their application design.


    In the US, and in other developed countries, things are extremely well defined.
    Products clearly specify how they should be used and in what cases they will fail.
    People can do and rely on these specifications at the same time, people expect
    products to work with detailed specifications. Ready to assemble furniture is
    a prime example of how these detailed specifications can be. It''s because of
    detailed and clear specifications that people feel comfortable in buying ready-to-assemble
    furniture.


    In short, people know exactly what they are getting when they acquire something.
    I think of it as society being naturally "object-oriented".


    **Object orientation** is just a name for the natural sense of things fitting
    nicely with each other. A piece of code is not different from the physical things
    I mentioned earlier. If you code it to a specification, it will fit as nicely
    as you 16 inch nut on a 16 inch bolt, irrespective of who manufactured the nut
    and bolt. The point here is that the source of concept of object-oriented programming
    is the physical world. If you a "thing" that has a well defined behavior and can
    be replaced with another component that adheres to that behavior. You would not
    be happy if you bought a tire that doesn''t fit on your car wheel even though
    you bought some "size", would you? You should think about the same issues when
    you develop your software component. Someone is going to use it and they won''t
    be happy if it fails at run time with an exception that you didn''t say it would
    throw in a particular situation.


