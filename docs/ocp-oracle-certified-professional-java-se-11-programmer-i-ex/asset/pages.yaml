  md: "# 1.3 Declaration and Definition\n\n# 1.3.1 Declaration and Definition\n\n\
    In a technical interview, you should always know what you are talking about. A\
    \ smart interviewer will catch you in no time if you talk too much. If you answer\
    \ imprecisely, your credibility will evaporate faster than in a frying pan. The\
    \ certification exam requires knowing the basics. You will lose marks for not\
    \ knowing the basics.\n\nIt is surprising how many people use the terms declaration\
    \ and definition incorrectly. So, let's get this straight from the get-go. A declaration\
    \ just means something exists. A definition describes exactly what it is. For\
    \ example,\n\n```\nclass SomeClass //class declaration\n//class declaration starts\n\
    {\n    public void m1()//method declaration\n    //method definition starts\n\
    \    //method definition ends\n}\nclass definition ends\n```\n\nAs you can see,\
    \ a declaration provides only partial information. You can't make use of partial\
    \ information. The definition makes it complete and thus, usable.\n\nIn terms\
    \ of variables, Java doesn't have a distinction between variable declaration and\
    \ definition because all the information required to define a variable is included\
    \ in the declaration itself. For example, \n\n\n```\nint i; //this declaration\
    \ cum definition is complete in itself\n```\n\nHowever, Java does make a distinction\
    \ between variable declaration and variable initialization. Initialization gives\
    \ a value to a variable. For example, int i = 10; Here is defined as an int and\
    \ also initialized to 10. Object obj = null; Here obj is defined as an Object\
    \ and is also initialized to null. I will discuss more about declaration and initialization\
    \ later.\n\nThe above is a general idea but you should be aware that there are\
    \ multiple viewpoints with minor differences. Here are some links that elaborate\
    \ more. You should go through at the first link below.\n\nStackOverflow - Difference\
    \ between declaration and definition in Java\n\nJavaRanch - Declaration and Definition\n\
    \nCan you now answer the question what does an interface contain - method declarations\
    \ or method definitions?\n\nWell, there was a time when interfaces contained only\
    \ method declarations, but since Java 8, interfaces contain method declarations\
    \ as well definitions."
