    directly to the official exam objectives. The sections of a chapter also correspond
    directly to the items of exam in most cases. Each chapter lists the objectives
    covered at that chapter and includes a set of coding exercises at the end. It
    would be best to read the book sequentially as each chapter builds on the concepts
    discussed in the previous chapters. I have included simple coding exercises throughout
    the book. Try to do them. You will learn and remember the concept better when
    you actually type the code instead of just reading it. If you already had a few
    years of Java development experience, you may go through the chapters in any order.


