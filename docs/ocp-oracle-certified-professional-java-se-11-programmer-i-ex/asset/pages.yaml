  md: "Just like the operator, the instanceof operator is also used sparingly in professionally\
    \ written code. Usage of instanceof reflects a bad design and if you feel the\
    \ need to use instanceof operator in your code too often, you should think about\
    \ redesigning your application.\n\n# 12.5.5 Invoking overridden methods\n\nIf\
    \ I've hammered it in enough yet, let me say this again - polymorphism is all\
    \ about the ability to replace one object with another without the need to recompile\
    \ existing code as the objects stick to an agreed upon contract. For example,\
    \ if a method requires an object of a class as an argument, then it should work\
    \ well with any object of its subclass. If a method expects an interface as an\
    \ argument, the class of the object you pass to it shouldn't matter as long as\
    \ that class implements the interface. This flexibility makes it easier, and cheaper,\
    \ to develop and maintain an application.\n\nIn technical terms, you must remember\
    \ that polymorphism works because of dynamic binding of methods. When you invoke\
    \ an instance using a reference, it is not the compiler but the JVM that determines\
    \ which code to execute on the class of the actual object referenced by the variable.\n\
    \nSome programmers later decide whether to tie the compiler or let the JVM bind\
    \ the call to the version provided by the declared class or at runtime to the\
    \ class of the object referred to by the variable. In such languages, methods\
    \ that are not bound by the compiler are called \"virtual\". In Java, calls to\
    \ non-virtual and non-final methods are bound dynamically by the JVM and are therefore,\
    \ always \"virtual\". Everything else is bound statically at time by the compiler.\n\
    \nTo take advantage of polymorphism, it is advisable to use interfaces and non-final\
    \ classes as method parameter types. For example, the interest calculator that\
    \ I showed could be redesigned as follows:\n\n# interface InterestCalculator;\n\
    \n```\n//interface methods are public by default\ndouble computeInterest(double\
    \ p, double r, double t);\n}\n```\n\n```\nclass Account{\n    double balance,\
    \ rate;\n```\n\n```\ndouble getInterest(InterestCalculator ic, double time) {\n\
    \    return ic.computeInterest(balance, rate, time);\n}\n```\n\n```\nclass SimpleInterestCalculator\
    \ implements InterestCalculator{\n    //must be public because an overriding method\
    \ must not reduce accessibility\n    public double computeInterest(double principle,\
    \ double yrs, double rate) {\n        return principle*rate;\n    }\n```\n\n```\n\
    class CompoundInterestCalculator implements InterestCalculator{\n    public double\
    \ computeInterest(double principle, double yrs, double rate) {\n        return\
    \ principle*Math.pow(1 + rate, yrs);\n    }\n```"
