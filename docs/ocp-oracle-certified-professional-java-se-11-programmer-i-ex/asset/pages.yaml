    \ method with the same name, whether inherited or defined, it is considered an\
    \ overloaded method in class. For example, if you have inheritable method in a\
    \ superclass and another method by the same name defined in the subclass, it would\
    \ still be considered a valid overload in the subclass because effectively, the\
    \ subclass has two methods with the same name - one inherited and one defined.\n\
    \nObserve that I have used the word \"inheritable\" above. As you know, private\
    \ methods can never be inherited and package private methods are not inherited\
    \ by a subclass that belongs to another package. Thus, such methods will not constitute\
    \ a valid overload in the subclass."
