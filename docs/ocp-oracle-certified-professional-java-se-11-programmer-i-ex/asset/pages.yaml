  md: '# 10.2 Create overloaded methods


    # 10.2.1 Method signature


    Before learning about method overloading, you need to know about something called
    "method signature".


    A method signature is an kind of "id" of a method. It uniquely identifies a method
    in a class. A class may have several methods with the same name but it cannot
    have more than one method with the same signature. When you call a call of a method,
    you basically tell the compiler which method you mean by mentioning its signature.
    If a class has multiple methods with the same signature, the compiler will not
    be able to determine which method you mean and will raise an error.


    The question then is: what exactly constitutes a method signature? Simple method
    signature includes the method name and the ordered list of parameter types. Nothing
    else. For example, all of the following method declarations are the same case:


    ```

    1. void process(int a, string str);

    2. public void process(int value, String name);

    3. void process(int a, string str) throws Exception;

    4. String process(int a, String str);

    5. private int process(int a, String data);

    6. static void process(int a, String str);

    ```


    Observe that in all of the cases the method name (i.e. process) and the ordered
    list of parameter types (i.e. int) are the same and their access, static/instance
    types, return types, names, and the throws are all different. However, these attributes
    are not part of the method signature, they do not make the methods different.
    The compiler will consider all of the methods as having the same signature and
    complain if you have any two of the methods in the same class.


    # 10.2.2 Method overloading


    Now that you know about signature, method overloading is a piece of cake. You
    know that a class cannot have more than one method with the same signature. But
    it can certainly have multiple methods with the same name and different parameters
    because different parameter types would make them different. In such a situation
    where a class has multiple methods with same name, it is said that the class has
    "overloaded" method. The method name is overloaded in the sense that there are
    multiple possibilities associated with that.


    From the compiler''s perspective, method overloading is nothing special. Since
    the compiler only cares about the signature, it makes no difference to the compiler
    whether two methods are different because of a difference in their names, or their
    method parameters, or both. To the compiler, overloaded methods are just different
    methods.


    However, method overloading does hold importance for the developer and the users
    of a class because it can make the code more intuitive to use or make it less
    confusing. For example, you have been using System.out.println to print out all
    of values to the console. You are able to use the same method println to print
    an int as well as a String because there are multiple methods that take different
    parameter types. A look at the JavaDoc description of java.io.PrintStream methods
    it handles. Wouldn''t you be frustrated if you had to use printlnByte to print
    a byte, printlnShort to print a short, printlnString to print a String and so
    on? In this case, method overloading has certainly made your life easier.'
