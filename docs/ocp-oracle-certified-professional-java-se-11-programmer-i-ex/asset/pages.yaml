    # Generics and Type Erasure


    Generics came quite late to Java (only in 1.5) and so backward compatibility was
    an important concern. Furthermore, it was a fairly complicated feature, it was
    expected that their wide spread would take some time. Thus, it was decided that
    Generics must work with code that doesn''t use Generics. Basically, there are
    two scenarios that Java source code should be able to use preexisting classes
    that do not use generics or non-generic source code should be able to use new
    generic libraries.


    To achieve this design, the mechanism of type erasure was used, where all the
    generic information is stripped from a class at run time. However, the JVM does
    not know any of the information that is present in a class file at the time of
    compilation. Thus, even if you write ArrayList<String> al = new ArrayList<>()
    in your code, the JVM will see ArrayList al = new ArrayList(); the type information
    is effectively ''erased'' from a class at runtime. This explains why the java
    code String str = al.get(0); translated to String is completely opposite to the
    behavior of arrays. As discussed in the Arrays chapter, arrays are reified, which
    means the type stays with all arrays.


    Type erasure eliminates the need to create separate classes for differently typed
    versions of a parameterized class. This ensures backward compatibility because
    there is essentially no difference between generics code and regular code from
    the JVM''s perspective.


    Type erasure has a significant impact on overloading and overriding of methods.
    Although not mentioned explicitly, the exam has questions that touch upon this
    aspect. So, let''s dig little deeper into it.


    # Impact of Type Erasure on Method Overloading


    As explained in the previous chapters, overloaded methods are methods that differ
    in their signature. Recall that a method signature is made up of method name plus
    parameter types. Since, due to erasure, generic information is removed at run
    time, two methods that differ only in their type parameters are not valid overloads.
    The compiler will refuse to compile such code because it knows that the JVM will
    not be able to distinguish between them at run time. For example, the'
