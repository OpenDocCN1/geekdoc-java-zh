  md: '# 9.3 Declare, instantiate, initialize and use multi-dimensional arrays


    # 9.3.1 Multidimensional Arrays


    The multidimensional array brings a picture of a matrix to mind. But it is important
    to understand that Java doesn''t have matrix kind of multidimensional arrays.
    What Java has is arrays whose elements themselves can be arrays. Recall that in
    Java, every array is an object of a specific class. For example, the class of
    an array of ints is int[]. Now, if you want to have an array of objects of this
    class. In other words, an "array of arrays of ints" is. You can declare it like
    this:


    ```

    int()][] iaa;

    ```


    Visually, the declaration looks like int[][] is a two-dimensional matrix of ints.
    In reality, int[][] points to a single dimensional array whose element is an array
    of ints. There is a fundamental difference between the two approaches. In a matrix,
    the number of elements in a given dimension are the same at each index of the
    higher dimension. For example, in a two dimensional array, the length of each
    row will always be the same, i.e., each row will have same number of columns.
    While in array of arrays, there is no such restriction. Each row can refer to
    any array of length. This is illustrated in the following:


    ```

    iaa[2x3]

    ```


    | | 1110 |

    |---|---|

    | xxxx | 1111 |

    | 1110 | 1 |

    | 1111 | 1111 |

    | 1112 | 1112 |

    | 1113 | ... |

    | 1114 | ... |

    | 1115 | 6 | 1200 | 3 |

    | 1116 | | 1201 | 4 |

    | | 1202 | 5 |


    In this figure, iaa[2x3], which is a made up syntax (Java does not have this),
    is a matrix of size 2x3, i.e., 2 rows and 3 columns. Since the size of each dimension
    is known in advance, it can be easily stored in a contiguous chunk of 2x-6 memory.
    You can also allocate the 2 continuous addresses to store two references - one
    for each array of ints.


    But in case of an array of arrays, you can only allocate 2 continuous addresses
    to store two. These two references can, in turn, point to arrays of different
    lengths. In the above figure, iaa[] points to another array stored at location
    1111, and iaa[][] points to another array stored at location 1200. iaa[] points
    an array of length 2, while iaa[][] points an array of length 3. This is what
    Java has. Since array of arrays are not to be symmetric, such arrays are called
    "jagged arrays". FYI, C supports both kinds of arrays., symmetrically


    Another way to say it is that Java doesn''t really have the concept of single
    or multidimensional arrays. Java has just its. If the elements of an array are
    themselves, humans call it a multidimensional array but from the language perspective,
    it is just an array. int[][] is not really a syntax for declaring a two dimensional
    array, although we call it that. It is a syntax for declaring an "array of array
    of ints".


    Keeping the above discussion in mind, let us look at the rules of declaring and
    creating an array of arrays in Java:


    +   1. The type of array is determined by the number of square brackets applied
    to the variable. For example, in case of int[] ia; and int ia[]; ia is an array
    of ints. In case of int[] iaa; and int iaa[][]; iaa is an array of arrays of ints.'
