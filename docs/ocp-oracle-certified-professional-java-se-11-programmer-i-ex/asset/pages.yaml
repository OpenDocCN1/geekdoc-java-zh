  md: "# The throws clause\n\nJava requires that you list the exceptions that a method\
    \ might throw in the throws clause of that method. This ties to Java's design\
    \ goal of letting the user know of the complete behavior of a method. It wants\
    \ to make sure that if the method encounters an exceptional situation, then the\
    \ method deals with that situation itself or the caller knows about that. The\
    \ throws clause is used for this purpose. It conveys to the user of a method that\
    \ it may throw the exception mentioned in the throws clause. For example:\n\n\
    ```\npublic double computeSimpleInterest(double p, double r, double t) throws\n\
    \    if(t<0) throw new Exception(\"time is less than 0\");\n}\n```\n\nNow, anyone\
    \ who uses the above knows that this method may throw an exception instead of\
    \ returning the interest. This helps the user write appropriate code to deal with\
    \ the exceptional situation if it arises.\n\n# The try statement\n\nA try statement\
    \ gives the programmer to recover from/or salvage an exceptional situation that\
    \ may arise while executing a block of code. A try statement consists of a try\
    \ block, zero or more catch blocks, and its syntax is as follows:\n\n```\ntry\
    \ {\n// code that might throw exceptions\n}catch(ExceptionClass1 e1){\n// code\
    \ to execute code in try throws exception 1\n}\ncatch(ExceptionClass2 e2){\n//\
    \ code to execute code in try throws exception 2\n}\ncatch(<ExceptionClassN> en){\n\
    // code to execute code in try throws exception N\n}\nfinally{\n// code to execute\
    \ after the try block and catch block finish execution\n}\n```\n\nNote that curly\
    \ braces for the try, catch, and finally blocks are required even if there is\
    \ a single statement in these blocks (compare to if, while, do/while and for where\
    \ braces are not required if there is only one statement in the block). A try\
    \ block must follow at least one catch block or a finally block. A block that\
    \ follows with neither a catch block nor a finally will not compile.\n\nThe try\
    \ statement is the counterpart of the throw statement putting a piece of code\
    \ within a try block. In other words, a try block lets the programmer deal with\
    \ an exceptional situation as opposed to the throw statement, which lets the programmer\
    \ dealing with it.\n\nWhile a try block contains for normal operation of the program,\
    \ a catch block is the location where the programmer tries to recover from an\
    \ exceptional situation that arises in the try block. If the code in the try block\
    \ throws an exception, the normal flow of execution in the try block is aborted\
    \ (i.e. no further code in the try block is executed) and the control goes to\
    \ the catch block. Here, the programmer can take alternate approach to finish\
    \ the processing of the method. For example, the programmer may decide to show\
    \ a popup message to the user about the exception and move on to the next statement\
    \ after the try statement."
