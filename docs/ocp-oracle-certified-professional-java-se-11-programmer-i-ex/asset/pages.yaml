    # 8.5.2 Syntax of the enhanced for loop


    The syntax of the enhanced for loop is:


    ```

    for( Type variableName : array_or_Iterable ) {

    statement(s);

    }

    ```


    or if there is only one statement in the for:


    ```

    for( Type variableName : array_or_Iterable ) statement;

    ```


    Type is the type of the elements that the array or the collection contains, variableName
    is the local variable that you can use inside the block with an element of the
    array or the collection, array_or_iterable is the array or object that implements
    java.lang.Iterable interface.


    I know that I been using the word "collection" up until now and suddenly switched
    to Iterable. The reason for the switch is that Iterable is a super interface of
    java.util.collection and although for loop is much simpler to iterate over collections,
    it can iterate over any object that implements Iterable. All classes that allow
    a user to iterate over the elements that it contains must implement the Iterable
    interface.


    The Iterable interface was introduced in Java 1.5 specifically to define that
    an object can be used as a target of the for-each loop. It has only one method
    iterate(), which returns a java.util.Iterator object. java.util.collection extends
    Iterable, all standard classes such as HashSet, and ArrayList can be iterated
    using the enhanced loop.


    For the purpose of the example, you don''t need to worry about the Iterable or
    Iterator interface but it is a good idea to develop a mental picture of the relationship
    between the Iterable and the Iterator interfaces. Always remember that for-each
    can only be used to iterate over an object that is "Iterable".


    Note that java.util.Iterator is not a collection of elements and does not implement
    Iterable. Therefore an Iterator object cannot be a target of a for-each loop.
