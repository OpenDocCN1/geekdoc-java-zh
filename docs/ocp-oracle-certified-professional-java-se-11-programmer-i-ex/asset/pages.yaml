  md: "# 16.3 Declare and enable access between modules\n\n# 16.3.1 Enabling access\
    \ between modules\n\nLet us improve the design of our simpleinterest module a\
    \ little bit. It is a good design practice to define functionality in form of\
    \ an interface and the actual implementation that interface. This ensures that\
    \ the user of the functionality is able to replace one implementation with another\
    \ without much impact on their code. Java modules allow us to do this technique\
    \ even by defining functionality in a module of its own. Separating the interface\
    \ and the implementation into separate modules would allow us to build an application\
    \ by mixing and matching modules without the need to bundle classes that are not\
    \ required for an application.\n\nIn our case, we will create a calculators.Interestcalculator\
    \ interface in calculators module. We will then have our SimpleInterestCalculator\
    \ class implement this interface. Here is the interface definition:\n\n```\n//\
    \ in file calculators\\calculators\\Interestcalculator.java\npackage calculators;\n\
    public interface Interestcalculator {\n    public double calculate(double principal,\
    \ double rate, double time);\n}\n```\n\nand the following module descriptor for\
    \ the new module:\n\n```\n// in file calculators\\module-info.java\nmodule calculators\
    \ {\n    exports ++;n}\n```\n\nThe only thing in this module definition is the\
    \ exports clause. A module is an inseparable unit of packages. Members of a module\
    \ are not normally accessible to other modules unless the package must be \"exported\"\
    \ explicitly in the module descriptor. Making something else to be accessible\
    \ through the \"exports\" clause ensures that code from other modules does not\
    \ access code that is imported to this module inadvertently. Note that I am talking\
    \ about packages instead of classes only packages can be exported and not individual\
    \ classes. When you export a package, all of the public types contained in that\
    \ package are accessible by other modules. In module parlance, accessing a module\
    \ is called \"reading\" the module. So, the exports clause in the code above makes\
    \ the Interestcalculator interface eligible to be read by other modules. I have\
    \ used the phrase \"eligible to be read\" because an exports clause is only one\
    \ of the requirements that must be fulfilled for a module to access classes from\
    \ another module. The second is the \"requires\" clause, which I shall introduce\
    \ shortly.\n\nThe directory structure of this module is as the source module format\
    \ explained earlier.\nc c:\\moduletests\\src\\calculators is the source directory\
    \ for this module. It contains module-info.java and calculators\\Interestcalculator.java.\
    \ Let us run the following command to compile:\n\n```\nc:\\moduletests\\javac\
    \ -d out --module-source-path src --module calculators\n```\n\nThis should create\
    \ appropriate output in the out directory.\n\nLet us now move on to the simpleinterest\
    \ module. Since we simpleinterestcalculator to implement Interestcalculator interface,\
    \ we need to first make our intention clear by stating that our simpleinterest\
    \ module \"requires\" access to the calculators module by modifying simpleinterest's\
    \ module descriptor as follows:"
