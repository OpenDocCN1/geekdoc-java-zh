  md: 'subclass to provide its own implementation of the method if it does not the
    behavior provided by the inherited method. The technical term for this is "**overriding**".
    A subclass is free to override a method that it inherits with its own implementation.


    # 12.4.2 Overriding methods


    As discussed earlier in this chapter, only non-private instance methods can be
    overridden. There are several rules that you need to follow while overriding a
    method. These rules govern the **accessibility**, **return type**, **parameter
    types**, and the **throws clause** of the method. The best way to understand and
    remember these rules is to keep in mind that these rules are to make sure that
    an object of a class can be replaced with an object of a subclass without breaking
    existing code. The objective is to be able to replace one component with another
    while giving flexibility to a subclass in implementing its methods.


    Whenever you override a method in a subclass, what will happen if you pass a subclass
    instead of the superclass object? If this replacement does not require the code
    to be recompiled, then you have overridden correctly. From this perspective, the
    following rules are applicable for method hiding (which happens for non-private
    static methods) as well.


    Let me list all of the rules and I will show you the reason behind these rules
    with an example. (Remember that an "overridden method" method in the superclass
    and an "overriding method" method in the subclass.)


    +   1. **Accessibility** - An overriding method must not be less accessible than
    the overridden method. This means that if the overridden method is **protected**,
    you can''t make the overriding method because default is less accessible than
    protected. You can make the overriding method more accessible. Thus, you can make
    it **public**.


    In the case of primitives, the return type of the overriding method must match
    exactly to the return type of the overridden method. This is because there is
    no sub type between any two primitives. For example, even though `short` is smaller
    than `int`, neither is a subtype of the other.


    +   3. **parameters** - The list of parameters that the overriding method must
    match exactly to that of the overridden method in terms of types and order (parameter
    names don''t matter). If, there is a difference between the types and order/or
    parameters, it would not be an override. but an overload. I have already discussed
    overloading of methods.


    +   4. **throws clause** - An overriding method cannot put a wider exception than
    the one present in the throws clause of the overridden method. For example, if
    the overridden method throws `IOException`, the overriding method cannot throw
    `Exception` because `Exception` is a superclass of `IOException`. The overriding
    method may throw a subclass exception such as `FileNotFoundException`.


    The overriding method may decide not to have a throws clause altogether.'
