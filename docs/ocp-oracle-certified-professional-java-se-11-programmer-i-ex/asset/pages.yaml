  md: "# 12.6 Distinguish overloading, overriding, and hiding\n\n# 12.6.1 Overriding\
    \ and Hiding\n\nYou have seen how a class can inherit features by extending another\
    \ class. These features include static and instance fields as well as static and\
    \ instance methods. In the previous section, I explained how inheriting features\
    \ is usually a good thing because it allows a class to get functionality without\
    \ writing any code. But it could pose a problem if the subclass were not able\
    \ to provide suitable behavior to a method that it inherited.\n\nFor example,\
    \ if there is a SpecialInterestCalculator that extends InterestCalculator and\
    \ inherits a computeInterest method, but it wants to change how the interest is\
    \ computed by this method? Or if it wants to define a new interestRate, that variable\
    \ is already defined in InterestCalculator?\n\nJava has rules about what features\
    \ can be tweaked and how they can be tweaked by a subclass. These rules are categorized\
    \ into two categories: Overriding and Hiding. The rules of overriding are polymorphism,\
    \ therefore, only instance methods and the rules of hiding apply to everything\
    \ else, i.e., static methods as well as static and instance variables.\n\nRemember\
    \ that in both cases, a member of a class has be inherited in the first subclass.\
    \ Since the private members of a class are not inherited by a subclass, the concepts\
    \ of overriding and hiding are not applicable to them. Similarly, constructors\
    \ of a class are not inherited either and, therefore, out of the purview of overriding\
    \ and hiding.\n\nOverriding\n\nA class to completely replace the behavior of an\
    \ instance method that it inherited by providing its own implementation of that\
    \ method. What means that the behavior provided by the subclass will be exhibited\
    \ by any object of the subclass instead of the behavior provided by the superclass.\
    \ For example:\n\n```\nclass interestCalculator{\n    public double computeInterest(double\
    \ principle, int yrs, double rate)\n        return principle*yrs*rate;\n}\n{\n\
    ```\n\n```\nclass CompoundInterestCalculator extends interestCalculator{\n   \
    \ public double computeInterest(double principle, int yrs, double rate)\n    \
    \    return principle*Math.pow(1 + rate, yrs);//don't worry a\nn}\n```\n\nIn the\
    \ above code, CompoundInterestCalculator has replaced the implementation of computeInterest\
    \ method provided by its super class with its own implementation. If you call\
