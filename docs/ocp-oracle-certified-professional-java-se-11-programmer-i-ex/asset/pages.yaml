    # 3.3.3 Assigning values to variables


    Java, like all languages, has its own rules regarding assigning values to variables.
    The most basic way to assign a value to a variable is to use a "literal".


    # Literals


    A literal is a notation for representing a fixed value in source code. For example,
    10 will always mean the number 10. You cannot change its meaning or what it represents.
    It has be taken literally, and hence is called a literal. Since it represents
    a number, it is a numeric literal. true and false are literals that represent
    the two boolean values. ''a'' is character literal. "hello" is a string literal.
    The Words string and name in the statement String are not literals because Java
    does not have an inherent understanding of these words. They are defined by a
    programmer.


    ```

    The word int i; or the word for(int i=0; i<5; i++); are kind of similar to literals
    because they have a fixed meaning that is defined by the Java language itself
    and not by a programmer. They are actually a bit more than literals itself they
    tell the compiler to treat the following code in a particular way. Using which
    you write a Java program and are therefore, called "keywords".

    ```


    Let me list a important rules about literals:


    +   1. To make it read and comprehend large numbers, Java allows underscores in
    numeric literals. For example, 1000000.0 can also be written as 1_000_000.0. You
    cannot start or end a literal with an underscore. You can use multiple underscores.
    You need not worry about the rules governing the usage of underscores in hexadecimal,
    binary, and octal formats.


    +   2. A number without a decimal is considered an int literal, whereas a number
    containing a decimal point is considered a double literal.


    +   3. A long literal can be written by appending a lowercase or uppercasing a
    f. For example, 123L, or 123.0f.


    +   4. A char literal can be written using a single character within single quotes,
    ''a'' or ''A''. Since it may not be possible to type the character you want, Java
    allows you to write a char literal using the hexadecimal Unicode format (''\uxxxx'',
    where xxxx is the hexadecimal value of the character defined in unicode. For some
    special characters, you can also use escape character ''\. For example, a new
    line character can be written as ''\n''.


    Note that writing literal using unicode or escape sequence is not on the exam.
    I have presented this brief information only for the sake of completeness.


    +   5. There are only two boolean literals: true and false.


    +   6. null is also a literal. It is used to set a reference variable to nothing.'
