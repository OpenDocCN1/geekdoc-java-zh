    \ The purpose of the default block is to specify a value of code that needs to\
    \ be executed if the switch expression does not match any of the case labels.\
    \ Just like the case labels, this block is optional.\n\n# The order of case and\
    \ default blocks\n\nJava does not impose any particular order for the case statements\
    \ and the default block. Thus, although it is customary to have the default block\
    \ at the end of a switch block, you can have it at the beginning. Similarly, Java\
    \ does not care about the ordering of the case labels.\n\nHowever, \"does not\"\
    \ does not mean \"not important! Ordering of case and default blocks becomes very\
    \ important in combination with the use of the break statement as we will see\
    \ next.\n\n# The break statement\n\nI mentioned in the mentioning that the case\
    \ labels define the entry point into a switch statement and the break statement\
    \ determines the exit. That is but the interesting thing is that even the break\
    \ statement is optional. A case block does not necessarily have to end with a\
    \ break. Let me modify the break that I showed you in the beginning:\n\n```\n\
    public class TestClass {\n    public static void main(String[] args) {\n     \
    \   switch(args.length) // switch block starts here\n            case 0 : System.out.println(\"\
    No argument\");\n                break;\n            case 1 : System.out.println(\"\
    only one argument\");\n                break;\n            case 2 : System.out.println(\"\
    two arguments\");\n                break;\n            default : System.out.println(\"\
    too many arguments!\");\n                break;\n\n        // switch block ends\
    \ here\n        System.out.println(\"All done.\");\n    }\n}\n```"
