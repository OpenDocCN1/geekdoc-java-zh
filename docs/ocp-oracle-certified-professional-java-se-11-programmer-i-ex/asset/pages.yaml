  md: '# 10.4 Create and overload constructors


    # 10.4.1 Creating instance initializers


    When you ask the JVM to create a new instance of a class, the JVM does four things:


    +   1. First, it checks whether class has been initialized or not. If not, the
    JVM loads and initializes the class first.

    2. Second, it allocates the memory required to hold the instance variables of
    the class in the heap space.

    3. Third, it initializes these instance variables to their default values (i.e.
    numeric and char variables to zero, boolean variables to false, and reference
    variables to null).

    4. And finally, the JVM gives that an opportunity to set the values of the instance
    variables as per the business logic of class by code written in special sections
    of the class. These special sections are: initializers and constructors.


    It is only after these four steps are complete that the instance is considered
    "ready to use". Remember the use of the new operator to create instances. The
    JVM performs all the activities mentioned above and only returns the reference
    of the newly created and initialized object to your code.


    Out of the four activities listed above, you have already seen the first of one
    in the previous section. The second two activities are performed transparently
    by the JVM. They don''t require the programmer to do anything. The fourth activity,
    which is the subject of this section, depends on the programmer because it executes
    the code written by the programmer.


    Let us look at instance initializers first because these are the ones that are
    executed by the JVM first.


    # Creating instance initializers


    Instance initializers are blocks of code written directly within the scope of
    a class. Here is an example:


    ```

    class TestClass{

    {

    System.out.println("In instance initializer");

    }


    ```


    Observe that there is no declaration or anything but a line of code nested inside
    the opening and closing braces. Code inside an instance initializer block is regular
    code. There is no limitation on the number of statements or the kind of statements
    that instance initializer can have. You may have any number of instance initializer
    blocks in a class. The JVM executes them in the order that they appear in the
    class. The following code, for example, prints Hello world! using two instance
    initializers in different places in a class:


    ```

    class TestClass{

    //first instance initializer

    {

    System.out.print(" Hello ");

    }

    public static void main(String[] args) {

    new TestClass();

    }

    ```'
