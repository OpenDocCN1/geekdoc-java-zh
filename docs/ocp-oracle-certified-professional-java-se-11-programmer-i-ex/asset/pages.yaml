  md: 'Since methods of an interface are to be implemented by the classes that implement
    the interface, methods of an interface cannot be declared final. Observe that
    this is opposite to the rule that is applied to variables. Variables of an interface
    are always final.


    Although not important for the exam, it is possible to define classes, interfaces,
    and enums within an interface. They cannot be anything other than public.


    # Marker interface ⬥


    You may encounter an interface that does not contain anything at all. Such interfaces
    are called "marker interfaces". For example:


    ```

    interface SpecialThing{

    }

    ```


    In the code, SpecialThing is a marker interface.


    The purpose of a marker interface is to tag a class with an extra piece of information
    about that class itself. For example, if any class implements SpecialThing, it
    implies that class is a SpecialThing. This information, also called "metadata",
    can be used by some code or tool that tells all SpecialThings in a certain way.


    The most common marker interface used in Java is java.io.Serializable. It signifies
    to the JVM that objects implementing this interface can be serialized and deserialized.


    You don''t need to know about the marker interface or the Serializable interface
    for the Part 1 exam but it is often asked about technical interviews.


    # 13.1.2 Implementing an interface ⬥


    A class can implement any number of interfaces by specifying their names in its
    implements clause. For example, in the following code Movable implements two interfaces:


    ```

    interface Movable{

    void move();

    }

    ```


    ```

    interface Readable{

    void read();

    }

    ```


    ```

    class price implements Movable, Readable{

    public void move() { System.out.println("Moving..."); }

    public void read() { System.out.println("Reading..."); } }

    }

    ```


    Of course, a class that declares it implements an interface, it must have the
    implementation for all of the abstract methods declared in that interface. It
    could either implement the methods itself or inherit them from its ancestor class.
    If an interface provides a default implementation for a method in the form of
    a default method, the implementing class does not necessarily have to provide
    implementation for that method.


    If the class does not implementation for even one of the abstract methods declared
    in the interface that it says it, the class must be declared abstract. Otherwise,
    the compiler will refuse to compile the class.'
