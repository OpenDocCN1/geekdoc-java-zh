    # 6.1.6 Operator precedence and evaluation of expressions


    I am sure you have come across simple mathematical expressions as 2 + 6 / 2 at
    school. You know that it evaluates to 5 and not 4 because division has higher
    precedence than addition and so, 6 / 2 will be grouped together instead of 2 +6.
    To change the default grouping, use brackets (a parentheses), i.e., (). You have
    likely also know the acronym BODMAS (or PEDMAS, in some countries), which stands
    for Brackets/Parentheses, Orders/Exponents, Division, Multiplication, Addition,
    and Subtraction). It helps memorize the conventional precedence in which brackets
    are evaluated first, by powers, and then the rest in order.


    Java expressions are not different from mathematical expressions. Their evaluation
    is determined by similar rules. The only problem is that there are a lot of operators
    to worry about, and as we said earlier, the operators are not just mathematical.
    They are logical, relational, assignment, and so many other types as well. This
    makes Java evaluation a lot more complicated than a mathematical expression. But
    don''t worry, you will not be required to evaluate complicated expressions in
    the exam. But you still need to know a few basic principles of expression evaluation
    to analyze code snippets presented in the questions correctly.


    # Precedence


    Precedence determines which operator out of two is "first", in a conceptual sense.
    Another way to put it is, precedence determines how tightly an operator binds
    to its operands as compared to the other applicable operator in an expression.
    For example, in the case of 2 + 6 / 2, the operator 6 can be bound to + or to
    /. But the division operator, having higher addition operator, binds to an operand
    more tightly than the addition operator. The addition operator, therefore, is
    not able to get hold of 6 as its second operand and has to wait until the division
    involving multiple operators, the operator with highest precedence gets the operand,
    followed by the operator with highest precedence, and so on.


    The following table shows the precedence of all Java operators:


    | Operators | Precedence |

    |---|---|

    | member and array access operators , and [] |

    | cast | |

    | postfix | |

    | unary | |

    | multiplicative | ++= expr-; ++= -expr -expr ~ |

    | additive | * / % |

    | shift | + - |

    | << >> >>> |

    | relational | < > <= >= instanceof |

    | equality | != |

    | bitwise AND | & |

    | bitwise exclusive OR | ^ |

    | bitwise inclusive OR | |'
