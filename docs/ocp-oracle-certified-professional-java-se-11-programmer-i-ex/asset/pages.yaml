  md: 'whether you do "hello" or new String("hello"), in both cases, a String object
    containing "hello" is created on the heap.


    Points to remember:


    +   - Local variables are always kept on the stack. Objects are always stored
    in the heap. (Optimizing JVM may allocate an object on the stack space, but it
    is an internal detail of the JVM and may not worry about it. For all we care,
    objects are always on the heap.)

    - JVM may have several threads. Each thread is given a fixed amount of stack space
    that is dedicated completely and exclusively to that thread. No one but that thread
    can access its stack space. This is called "stack semantics". A thread accesses
    its stack space by creating and using variables. Heap is shared among all threads.
    Each thread can use space on a heap by creating objects. Since heap space is shared,
    it is possible for one thread to access objects created by another if it has a
    reference to that object. This is called "heap semantics"

    - Stack space is limited for a program. So, if you have a chain of method calls
    where each method creates a lot of temporary variables recursion is a good example),
    it is possible to run out of stack space. In Java, the default stack space size
    is 64KB but can be changed at the time of executing the program using command
    option -Xss. Heap space is unlimited from the program''s perspective. It is limited
    by the amount of space available on your machine.

    - Only temporary variables, i.e., method parameters and variables created in a
    method (also known as local variables or automatic variable) are created on the
    stack space. Everything else is created on the heap space. If you have any doubt,
    ask yourself this question - is this a temporary variable? Yes? Then it is created
    on the stack. Is it on the heap? Actual objects are ALWAYS created on the heap.

    - When a method is invoked by a thread, it uses the thread''s stack space to keep
    its temporary variables.

    - Variables added to the stack space by a method are removed from the stack when
    that method ends. Everything created by a method is left on the heap even after
    the method ends.


    Here is a good discussion on Stack and Heap and why its understanding is important.'
