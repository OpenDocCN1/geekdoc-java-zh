  md: "# 15.1 Create try-catch blocks and determine how exceptions alter program flow\n\
    \n# 15.1.1 Java exception handling\n\nExceptions are for managing exceptional\
    \ situations. For a file copy, the normal course of action could be -open file\
    \ A, read the contents of file A, create file B and write the contents to file\
    \ B. But what if the program is not able to open file A? What if the program is\
    \ not able to create or write file B? There could be many reasons failure such\
    \ as a typo in the file name, lack of permission, no space on disk, or disk failure.\
    \ Now, you don't expect these problems to occur all the time but it is reasonable\
    \ to expect them some times. Since we don't expect these problems to occur regularly\
    \ in normal operation of code, we will call them \"exceptional\".\n\nIn exceptional\
    \ situations, you might want to give the user feedback about the error or you\
    \ may even want to take an alternative course of action. For example, you might\
    \ want to let the user input another file name if the input file is not found\
    \ or another target location if the location is out of space. Even if you don't\
    \ want to take any special action upon such situations, you should least want\
    \ your program to gracefully exit instead of crashing unexpectedly when run. This\
    \ means, you should provide a path for the program to take in such situations.\
    \ One would be to check for each situation before proceeding to copy. Something\
    \ like this:\n\n```\nif(checkAccess(file)){\n    if(checkwritePermission(targetDirectory)){\n\
    \        // for normal course of action\n    } else{\n        System.out.println(\"\
    Unable to create file2\");\n    }\n} else {\n    System.out.println(\"Unable to\
    \ read file1\");\n}\n```\n\nYou can see where this is getting. You will end up\
    \ having a lot of if-else situations. Not only is it cumbersome, but it will be\
    \ a nightmare to read and maintain later on.\n\nThere is another serious problem\
    \ with the above approach. It does not provide a way to write code for situations\
    \ you don't know at the time of writing the code. For example, if the user uses\
    \ this code in an environment that requires file names to follow a particular\
    \ format? So, you have two kinds of \"exceptional situations.\" One that you know\
    \ at the time of writing the code, and the one you don't know about.\n\nJava exception\
    \ mechanism is designed to help you write code that covers all possible paths\
    \ that a program may take - 1. path for known exceptional situations, and 3. path\
    \ for unknown exceptional situations. Here is how the above mentioned program\
    \ can be written:\n\n```\ntry{\n    // code for normal course of action\n} catch(SecurityException\
    \ e) {\n    // code for known exceptional situation\n    System.out.println(\"\
    No permission!\");\n} catch(Throwable t) {\n    // code for unknown exceptional\
    \ situations\n    System.out.println(\"Some problem in copying: \"+t.getMessage());\n\
    \    t.printStackTrace();\n}\n```\n\nObserve that the perspective is reversed.\
    \ In the if/else approach, you check for each exceptional situation and proceed\
    \ to copy if everything is good, while in the try/catch approach, you assume everything\
    \ is good and only if"
