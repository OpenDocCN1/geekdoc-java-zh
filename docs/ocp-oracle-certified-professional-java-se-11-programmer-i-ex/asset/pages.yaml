    # 16.4.4 Summary of command switches used for compilation


    For compiling a jar and/or module, you need to remember the following command
    options:


    +   1. --module-source-path: This switch is used to specify the location of the
    module source files. It should point to the directory where module-info.java of
    the module is stored. For example, if your module name is moduleA, then the module-info.java
    for the module should be specified in moduleA directory and if moduleA exists
    in src, then src should be specified in the --module-source-path option, i.e.,
    --module-source-path src


    +   2. -d: This switch is required when you compile a module. It is used to specify
    the output. The directory where javac will generate the module and package directory
    structure and the class files for the others. For example, if you specify out
    as the output directory, javac will create a directory out with the same name
    as the name of the module and will create class files with appropriate package
    directory structure under that.


    +   3. --module -m: This switch is used when you want to compile all the classes
    of a particular module. This option is helpful when you want to compile all the
    classes at once without using any of the source files of a module individually
    in the command.


    For example, if you have two Java files in moduleA, stored under moduleA\A1.java
    and moduleA\A2.java, you can compile both of them at the same time using the command:
    javac --module-source-path -d out --module moduleA

    javac will find all the source files stored under moduleA and compile all of them.
    It will create the class files under the output directory specified in -d out,
    i.e., the output directory will now have two classes - moduleA\A1.class and moduleA\A2.class.'
