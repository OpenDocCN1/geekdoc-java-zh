  md: '# 7.1 Create if and if/else constructs


    # 7.1.1 Basic syntax of if and if-else


    The statement is probably the most used decision construct in Java. It allows
    you to execute a single statement or a block of statements if a particular condition
    is true. If condition is false, the statement (or the block of statements) is
    not executed. The following are two ways you can write an if statement:


    ```

    if( booleanExpression ) single_statement;

    ```


    Notice that there are no curly braces for the statement. The statement ends with
    the semi-colon. If you have multiple statements that you want to execute instead
    of just one, you can put all of them within a block like this:


    ```

    if ( booleanExpression ) {

    zero or more statements;

    }

    ```


    Observe that there is no semi-colon after the closing brace. It is not an error
    if present though.


    # If-else statement


    The if-else statement is similar to an if statement except it also has an else
    part where you can write a statement that you want to execute if the condition
    evaluates to false:


    ```

    if( booleanExpression ) single statement; //semi-colon required here

    else single statement; //semi-colon required here, if-else statement ends with

    ```


    Again, if you have multiple statements to execute instead of just one, you can
    put them within a block:


    ```

    if ( booleanExpression ) single statement; //semi-colon required here

    else {

    zero or more statements;

    //no semi-colon required here, but not an error if it exists.

    ```


    or, if the if and the else parts have multiple statements:


    ```

    if ( booleanExpression ) {

    zero or more statements;

    //must NOT have a semi-colon here, error if it exists.

    else {

    zero or more statements;

    //no semi-colon required here, but not an error if it exists.

    ```


    If booleanExpression evaluates to true, the statement (or the block of statements)
    associated with will be executed and if the booleanExpression evaluates to false,
    the else part will be executed.


    Remember that an empty statement (i.e. just a semicolon) is a valid statement
    and therefore, the following if and if-else constructs are valid:'
