  md: "```\nSystem.out.println(\"crushing mango...\");\n} else {\n    System.out.println(\"\
    crushing some other fruit...\");\n}\n\npublic static void main(String[] args){\n\
    \    Mango m = new Mango();\n    new Juicer().crush(m);\n}\n```\n\nIn the code\
    \ above, the method crush doesn't know the type of the actual object that is referred\
    \ to by f, but using the instanceof operator you can check if object is a Mango.\n\
    \nThe instanceof operator is handy when you want to treat an object of a particular\
    \ kind differently. For example, if Mango had a method named removeSeed and you\
    \ want to invoke that method before crushing it, you would want to know whether\
    \ you have actually been a Mango or not before you cast your Fruit reference to\
    \ f Mango, otherwise you will get a ClassCastException at runtime if f does not\
    \ refer to a Mango. Here is how you can do:\n\n```\nclass Mango extends Fruit{\n\
    \    public void removeSeed() { }\n}\n\nclass Juicer {\n    public void crush(Fruit\
    \ f) {\n        if(f instanceof Mango) {\n            Mango m = (Mango) f;\n \
    \           m.removeSeed();\n        }\n        System.out.println(\"crushing\
    \ fruit...\");\n    }\n}\n\n```\n\nRemember that you can't invoke removeSeed on\
    \ f because the type of f is Fruit and Fruit doesn't have removeSeed method. Mango\
    \ does. Therefore, as discussed, you must cast f to Mango before you can tell\
    \ you that it is a Mango.\n\nThere are a couple of things that you should understand\
    \ clearly about instanceof:\n\n+   1. The instanceof operator cannot tell you\
    \ the exact type of the object pointed to by a variable. It can only tell you\
    \ whether object is a something. For example, if you do instanceof Fruit, it will\
    \ return true if the object referred to f is Fruit, which means it will return\
    \ true even if f points to a Mango because a Mango is-a Fruit. In the case of\
    \ interfaces, it will return true if the class of the object pointed to by the\
    \ reference implements the interface (directly or indirectly).\n2. The compiler\
    \ will let you use instanceof only if it is possible for the variable to refer\
    \ to an object of the type on the right-hand side. For example, f instanceof Mango\
    \ is valid because the compiler knows the declared type of f is Fruit and since\
    \ Mango is a Fruit, it is possible for f to point to a Mango. But f instanceof\
    \ String will not compile because the compiler knows there is no way f can ever\
    \ point to a String. The instanceof operator behaves the same way as the cast\
    \ operator in this respect."
