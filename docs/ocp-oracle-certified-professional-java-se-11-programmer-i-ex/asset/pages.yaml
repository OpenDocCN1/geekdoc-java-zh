    \ worry about the use of Iterator or <Account> in the above code. The point to\
    \ understand here is that you want to process each account object in the collection\
    \ and if there is no account object, you don't want to enter the loop body at\
    \ all. With a do-while loop, the code will look like this:\n\n```\nIterator<Account>\
