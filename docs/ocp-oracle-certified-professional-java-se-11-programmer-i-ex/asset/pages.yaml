    Note that this does not imply that the SE Platform includes all of the standard
    modules. For example, java.cardio is a standard module (it provided by the GCP)
    but not a part of the SE Platform. Neither does it imply that this platform will
    use any class from non-standard packages or modules. As I mentioned before, a
    standard module may contain non-standard packages. All it means is that none of
    the modules included in the Java SE Platform "requires" only the modules contained
    in the SE Platform, it will depend only on the standard Java packages and will
    be portable to all Implementations of the SE Platform.


