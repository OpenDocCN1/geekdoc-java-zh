  md: '# 3.4 Wrapper Classes


    Wrapper classes were on the OCPJP 8 exam but surprisingly, they have been removed
    from the OCP Java 11 Part exam. You may therefore, ignore the following discussion
    if you are short on time. However, it is almost necessary for a Java developer
    to have a basic understanding of wrapper classes because they are widely used.


    # 3.4.1 What are Wrapper Classes?


    Before I start about wrapper classes, I will recall three things that are quite
    fundamental to understanding wrapper classes - 1. Object and Reference, 2. Stack
    and Heap, and 3. Difference between reference variables and primitive variables.
    I will go through them if you are not clear on those three concepts.


    As you are, Java is considered an object-oriented language. Pretty much everything
    in Java is objects. All objects reside on the heap and can be accessed through
    their references, which are cached in reference variables. This is all good for
    a performance perspective, heap space is heavy as compared to stack space. It
    is also more permanent than stack. Recall that JVM performs garbage collection
    for getting rid of unused objects from time to time, which is temporary and much
    of a hassle.


    To address this, Java has the of "primitive" data types. They are called primitives
    because they don''t behave associated with them. They are just raw. If you want
    to run a loop 10 times, you don''t need a counter from 0 to 9. The counter doesn''t
    serve any purpose after the loop is over and so, a simple variable that is forgotten
    as soon as the loop is done, is of primitive. The stack space is perfect for keeping
    such values because a stack space is wiped clean as the thread that stack space
    is finished. There is no need of garbage collection to happen here. Furthermore,
    a program can directly manipulate the value of a primitive variable without having
    to go through the indirection of a reference.


    The problem with having two kinds of data types is that it creates a dichotomy
    between data represented by primitives and data objects. The difference between
    how they are stored, processed, and accessed, a program cannot treat primitives
    and objects the same way. For, let''s say you have developed some logic to process
    different data types and you''ve captured this logic into a method. What type
    of input parameters would you use to pass the data to this method? If you decide
    to use Object, you cannot pass any primitive to this method and if you choose
    primitive, you cannot pass to it. You would need to write different methods for
    each kind or have wrap wrap primitive class into objects and pass objects to your
    method.


    A more concrete example would be a class that manages collection of data. Java
    has standard classes for managing collections. The most commonly used, which is
    also included in the examples, java.util.ArrayList. I will discuss this detail
    later, but basically, you will use an ArrayList to collect a bunch of objects.
    If you have a primitive value that you want to keep in the collection managed
    by an ArrayList, you need to wrap that value into an object only works with objects.


    Java designers realized this problem and added ready-made wrapper classes for
    each of the primitive data types to Java core. These classes are - Byte, Character,
    Short, Integer, Long, Float, Double, and Boolean. All of these are in java package.


    Wrapper classes mean for the types that are used to represent numeric data, i.c.
    Byte, Short, Integer, Long, Float, and Double, extend from a common class named
    java.lang.Number.


    Further, Number, Character, and Boolean, extend from java.lang.Object.'
