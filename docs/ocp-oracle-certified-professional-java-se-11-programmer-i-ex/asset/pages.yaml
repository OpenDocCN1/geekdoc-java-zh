  md: "```\nmodule hr{\n  requires valueobjects;\n  requires transitive valueobjects;\
    \ //duplicate, not allowed\n}\n```\n\n# Cyclic/Circular dependency\n\nJava does\
    \ not allow modules to circularly depend on each other. For example, if module\
    \ contains a requires b; clause, then module b cannot have a requires a; clause.\
    \ Similarly, even an indirect circular dependency (i.e. a requires b, b requires\
    \ c, and c requires a) is not allowed either."
