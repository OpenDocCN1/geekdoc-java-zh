  md: "# 0.5 General tips for the exam\n\nHere is a list of things that you should\
    \ keep in mind while preparing for the exam -\n\n+   1. Code Formatting - You\
    \ may not find nicely formatted code in the exam. For example, you may expect\
    \ a piece of code formatted like this:\n\n```\nif(flag){\n  while(b<10){\n  }\n\
    }else if(a>10) {\n  invokeM(a);\n}else{\n  System.out.println(10);\n}\n```\n\n\
    But you may get the same code formatted like this:\n\n```\nif(flag){\n  while(b<10)\
    \ { \n  } else\n  if(a>10) { invokeM(a); }\n  else { System.out.println(10); }\n\
    ```\n\nThey do this mostly to save space. But it may also happen inadvertently\
    \ to variations in display screen size and resolution.\n\n+   2. Assumptions -\
    \ Several questions give you partial code listing, aka \"code snippets\". For\
    \ example, what will the following code print?\n\n```\nArrayList al = new ArrayList();\n\
    al.remove(0);\nSystem.out.println(al);\n```\n\nObviously, the code will not compile\
    \ given it is just a code fragment. You have to assume that this code appears\
    \ in a valid context such as within a method of a class. You also need to assume\
    \ that appropriate import statements are in.\n\nYou should not fret over the missing\
    \ stuff. Just focus on the code that is given and assume that everything is irrelevant\
    \ and not required to arrive at the answer.\n\n+   3. Tricky Code - You will see\
    \ really weird code in the exam. Code that you may ever see in life. You will\
    \ feel if the exam is about puzzles rather than Java programming. To some extent,\
    \ if you had to go through the certification, there is no point in questioning\
    \ the relevance. If you feel frustrated, I understand. Feel free to vote your\
    \ answer on our forum and get back to work!\n\n+   4. Number of options - In multiple\
    \ choice questions, the exam tells you exactly how many options you have to select\
    \ that question correctly. Remember that there is no negative. In other words,\
    \ you will not be deducted for answering a question incorrectly. Do not leave\
    \ a question unanswered. If you don't know the answer, select the required number\
    \ of options anyway. There is a slight chance that you will have picked the correct\
    \ answer.\n\n+   5. Eliminate wrong options - Even better than leaving a question\
    \ unanswered is intelligent guesses by eliminating obviously incorrect options.\
    \ You may also see options that are contradictory to each other. This makes it\
    \ a bit easy to narrow down the correct options.\n\nThat's all. Hope this book\
    \ helps you become a Java programmer besides getting the certification."
