    \ //will cause Parent and then class C\n    ChildB b = new ChildB(); //will cause\
    \ only childB to be initialized\n}\n```\n\nThe above code generates the following\
    \ output:\n\n# Initializing Parent\nInitializing ChildA\nInitializing ChildB\n\
    \nWhen the JVM encounters the statement ChildA a = new ChildA(), it realizes that\
    \ ChildA is being used for the first time. So, before creating an object of the\
    \ ChildA class, it needs to initialize the ChildA class. Since ChildA extends\
    \ Parent, the JVM must first initialize the Parent class. This is why Initializing\
    \ Parent is printed before initializing ChildA. Once ChildA is loaded and initialized,\
    \ the JVM creates an object of ChildA and assigns it to variable a. Similarly,\
    \ when the JVM encounters the statement ChildB b = new ChildB(), it tries to initialize\
    \ the ChildB class. While initializing ChildB, the JVM does not execute Parent's\
    \ initialization logic again, i.e., Parent, has already been initialized and so,\
    \ it does not execute. You might wonder why we do not see Parent printed again.\
    \ What happens to the Object class? After all, Object is the super class of Parent!\
    \ Well, Object is indeed the super class of Parent. But it is also the super class\
    \ of TestClass. The JVM initialized the Object class while it initializing the\
    \ TestClass.\n\n+   4. There is no way to access a static block or refer to a\
    \ static block. That means, you can't \"invoke\" or \"call\" a static block explicitly\
    \ from anywhere. It can only be invoked by the JVM and that, only.\n\n> Technically,\
    \ there is one copy of fields per per class class, but a discussion on class loaders\
    \ is is of of of this exam. However, be aware that love interview interview love\
