    and jdk.internal.util.


    Depending on the provider of the JDK, it may have packages the company name as
    well as sun.net or sun.utils.resource.


    It is important to know that a standard module may contain non-standard packages,
    or a non-standard module may not contain any standard package.


    The standard and non-standard modules are combined to make a variety of Java configurations
    such as the full Java SE Platform, the full JRE, and the full JDK.


    For the purpose of this exam, we need to focus on the Java SE Platform.


    # The Java SE Platform


    The Java Platform, Standard Edition (SE) is the core Java platform for general-purpose
    computing. It is composed of the standard modules (i whose names start with java)
    and ready to be supported by all Java implementations. You do not need to remember
    all modules available in this platform but some of the most commonly used in this
    platform are java.base, java.desktop, logging, java.sql, java.prefs, and java.net.http.
    All of the programs that you have written or will write for the preparation exam
