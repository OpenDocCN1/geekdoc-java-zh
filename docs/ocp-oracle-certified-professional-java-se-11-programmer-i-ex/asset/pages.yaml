    \ that did not match the value of args.length. This is \"fall through\" behavior\
    \ of a switch statement. In absence of a break statement, the control falls through\
    \ to the next case and the next case, and so on until it reaches the end of the\
    \ switch statement. This feature is used when you want to execute one code block\
