  md: "Now that we have established what \"garbage\", it is easy to understand what\
    \ garbage collection entails. Garbage collection is an action performed periodically\
    \ by the JVM to reclaim the memory occupied by objects that are no longer in use.\
    \ Let us dig deeper into each part of the sentence:\n\n+   1. Activity performed\
    \ periodically - The JVM performs garbage collection at regular intervals so that\
    \ memory is available to the program before a request to create an object fails\
    \ for memory. It is not possible for a programmer to control the period of this\
    \ activity. It is possible for a programmer to make the JVM perform garbage collection\
    \ demand. There is a method gc in java.lang.System that lets call System.gc()\
    \ any time you feel it is appropriate to clean up the memory this is just a request.\
    \ There is no guarantee that the JVM will actually perform garbage collection\
    \ through called invocation of this method. A JVM may provide options to optimize\
    \ the behavior of the garbage collection process through command line arguments.\
    \ Although a discussion about these arguments is beyond the scope of the area,\
    \ I suggest you check them out in your spare time garbage collection is a favorite\
    \ topic of technical managers.\n\n+   2. Reclaim the memory - Reclaiming the memory\
    \ of an object is now marked as free to new objects. After reclaiming the memory\
    \ from multiple objects, the JVM may reorganize the heap space by moving the objects\
    \ around and creating chunks of free memory. This process is perfectly like the\
    \ fragmentation of a hard drive but within the JVM.\n\n+   3. Objects that are\
    \ no longer in use - Mentioned earlier if an object is not referenced from any\
    \ active part of a program, the JVM concludes that the object is no longer in\
    \ use. While this statement is a bit more complicated than it, Let us show you\
