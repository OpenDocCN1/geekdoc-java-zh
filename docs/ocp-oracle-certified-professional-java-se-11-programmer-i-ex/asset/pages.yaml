    \ example:\n\n```\nclass Student{\n  int count = 0;\n  public void something(){\n\
    \    count = count; //technically valid but logically incorrect\n    Student.count\
    \ = count; //works fine in as well as static method\n    this.count = count; //works\
    \ fine in an instance method\n  }\n```\n\nThe above code has the same problem\
    \ of redundant assignment. The local variable count shadows the static variable\
    \ by the same name. Inside something(), the simple count will always refer to\
