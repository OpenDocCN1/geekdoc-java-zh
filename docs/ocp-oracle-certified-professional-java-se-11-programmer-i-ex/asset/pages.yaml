    \ version of the method will be called. The following code proves it:\n\n```\n\
    class TestClass{\n    public static void main(String[] args) {\n        double\
    \ interest = ic.computeInterest(100, 2, 0.1);\n        System.out.println(interest);\
    \ //prints 20.0\n\n    CompoundInterestCalculator cic = new CompoundInterestCalculator;\n\
    ```"
