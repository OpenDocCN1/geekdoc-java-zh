  md: "# 8.6 Use break and continue\n\n# 8.6.1 Terminating a loop using break\n\n\
    A loop doesn't always have to run its full course. For example, if you are iterating\
    \ through a list of names to find a particular name, there is no need to go through\
    \ the rest of the iterations after you have found that name. The break statement\
    \ does exactly that. Here is the code:\n\n```\nString[] names = {\"ally\", \"\
    bob\", \"charlie\", \"david\"};\nfor(int i=0; i<names.length; i++){\n    System.out.println(names[i]);\n\
    \    if(\"bob\".equals(names[i])){\n        System.out.println(\"Found bob at\
    \ \"+i);\n        break;\n    }\nn\n```\n\nThe output of the above code is:\n\n\
    ally\nbob\nFound bob at 1\n\nObserve that charlie and david doesn't matter which\
    \ kind of loop (i.e., while-do, for, or enhanced) it is. If the code in the loop\
    \ encounters a break, the loop will be broken immediately. The condition and the\
    \ update section (in case of a loop) will not be executed and the control will\
    \ move to the next statement after the loop block.\n\n# 8.6.2 Terminating an iteration\
    \ of a loop using continue\n\nThe continue statement is a little draconian than\
    \ the break statement. The purpose of a continue statement is to skip the rest\
    \ of the statements in the loop while performing that iteration. In other words,\
    \ when a loop encounters the continue statement, the remaining statements within\
    \ the loop block are skipped. The rest of the steps of executing a loop are performed\
    \ as usual, i.e., the control moves on to update section (if it is a loop) and\
    \ then checks the loop condition to decide whether to execute the next iteration\
    \ or.\n\nThis is useful when you don't want to execute the rest of the statements\
    \ of a loop after encountering a particular condition. Here is an example:\n\n\
    ```\nString[] names = {\"ally\", \"bob\", \"charlie\", \"david\"};\nfor(String\
    \ name : names){//using a for-each loop this time\n    if(\"bob\".equals(name)){\n\
    \        System.out.println(\"Ignoring bob!\");\n        continue;\n    }\n  \
    \  System.out.println(\"Hi \"+name+\"!\");\n}\n```\n\nThis code produces the following\
    \ output:"
