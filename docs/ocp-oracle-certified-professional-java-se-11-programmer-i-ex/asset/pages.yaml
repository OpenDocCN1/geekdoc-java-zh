  md: 'Observe that the returned value (-1) does not depend on the amount of different
    between the two elements (2 - 5 -3).


    public static int mismatch(int[] a, int[] b): Finds and returns the index of the
    first mismatch between two int arrays, return -1 if no mismatch is found. The
    index will be in the range of 0 (inclusive) up to the length (inclusive) of the
    smaller array.


    If two arrays share a common prefix then the returned index is the length of the
    common prefix and it follows that there is a mismatch between the two elements
    at that index within the respective arrays. If one array is a proper prefix of
    the other the returned index is the length of the smaller array and it follows
    that it is only valid for the larger array. Otherwise, there is no mismatch.


    Two non-null arrays, a and b, share a common prefix if the following expression
    is true:


    ```

    pl >= 0 &&

    pl < Math.min(a.length, b.length) &&

    Arrays.equals(a, 0, pl, b, 0, pl) &&

    a[pl] != b[pl]

    ```


    Note that a common prefix length of 0 indicates that the first elements from each
    array mismatch.


    Two non-null arrays, a and b, share a proper prefix if the following expression
    is true:


    ```

    a.length != b.length &&

    Arrays.equals(a, 0, Math.min(a.length, b.length),

    b, 0, Math.min(a.length, b.length))

    ```


    For example, the following code will print 2 when the arrays differ at index 2:


    ```

    int[] ia1 = { 0, 1, 2, 6 };

    int[] ia2 = { 0, 1, 5 };

    System.out.println(Arrays.mismatch(ia1, ia2)); //prints 2

    ```


    Observe that 2 is also the length of the prefix, which is {0, 1}.


    You should go through the JavaDoc API of the various overloaded compare and mismatch
    methods. You will notice that they all work in the same basic fashion.'
