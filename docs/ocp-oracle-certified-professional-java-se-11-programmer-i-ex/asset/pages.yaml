  md: '# Difference between null and void


    null is also a keyword in Java and "nothing". However, null is a value. It is
    used to signify that a reference variable is currently not pointing to any object.
    It is not a data type and so, it is not possible to declare a variable of type
    null.


    Note that null is a valid value for a reference variable while void is not. When
    a method invocation returns null, it means that only particular invocation of
    the method did not return a value reference. It does not mean that the method
    returns anything. On the other hand, void means that a method returns anything
    at all. Therefore, you cannot use void in a return statement. In other words,
    return null; can be a valid statement for a method but return void; is not valid.
    A method that declares void as its return type, can either omit the return statement
    from its body or have an empty return statement, i.e., return;


    # Types of variables


    Java has two types of variables to work with the two types of data types, primitive
    variables and reference variables. Primitive variables let you work with primitive
    data, while reference variables let you work with reference data. Then, when you
    define int i; is a variable of the primitive data type int, but when you define,
    str str; is a variable of the reference data type java.lang.String.


    It is very important to understand the fundamental difference between the two
    types of variables. Primitive variables contain data within itself, while a reference
    variable stores only the address to where the actual data is. For example, if
    you i = 10; i will contain the value 10. But if you define str = "hello"; str
    will only contain the address of the memory location where the "hello" resides.
    You can now understand why they are called "reference". Because they are merely
    references to the actual data! When you perform any operation on a reference,
    the operation is performed on the object that is located somewhere else. In that,
    you can think of a reference variable as a "remote control" of a TV. (If you have
    trouble understanding this, you should go through the "Kickstarter for Beginners"
    chapter before moving forward.)


    Both types of variables support the assignment operation, i.e., they allow you
    to assign values to them. For example, the statement i = 20; assigns the value
    20 to i.


    In case of reference variable you cannot assign the address of an object directly.
    You can only do indirectly. In example, assigning the string str = "hello"; you
    are assigning the address of memory location at which the str, therefore contains
    the address of a memory location. Similarly, in assigning str2 = str; you are
    assigning the value str to str2. You are not copying "hello" to str. You are just
    copying the address in str to str2. Cannot assign an address to a reference variable
    directly because you don''t know the actual address. The JVM knows an object is
    stored in memory and it assigns that address to the variable while executing the
    assignment operation. The only "address" you can assign to a reference variable
    is null.


    # Size of variables


    Since a primitive variable stores data within itself, the size of a primitive
    variable depends on the size of the primitive data. Thus, a byte variable requires
    1 byte while a reference variable requires 4 bytes and.


    Since a reference variable stores only the address of a memory location, the size
    of a reference variable depends on the addressing mechanism of the machine. On
    a system with 32 bit OS, a reference variable will be of 4 bytes, while on 64
    bit system, it will be of 8 bytes.'
