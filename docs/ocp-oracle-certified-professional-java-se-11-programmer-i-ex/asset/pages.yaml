    \ syntax. That invocation of another constructor is only allowed if it is the\
    \ first statement of a constructor. This poses a small problem. How can both -\
    \ this(<arguments>); and super(<arguments>);? Java allows only one of the two\
    \ in a constructor. What time? Well, in other words, if you call this(<arguments>);\
    \ you can't call super(<arguments>);; if you call super(<arguments>); you can't\
    \ call this(<arguments>);\n\nNote that this does not violate our original premise\
    \ that the super class's features have to be initialized before initializing subclass's\
    \ features. If you call this(<arguments>); you don't need to call super(<arguments>);\
    \ anyway because the other constructor would have called super(<arguments>); and\
