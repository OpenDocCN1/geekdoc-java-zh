    # ### 2.2.1 Run a Java program from the command line


    We have already seen the basics of how to compile and execute a Java program in
    Compilation and Execution section under Kickstarter for Beginners. I will just
    summarize the important points that you need to know for the exam here.


    +   1. The standard Oracle JDK comes bundled with a Java bundler. The executable
    for the bundler is named javac. In other words, the program you need to use to
    compile your Java code is called "javac". You may compile a Java source file named
    `TestClass.java` using the command - javac TestClass.java Notice that you need
    to specify the full file name including the extension. Java does support multiple
    options to fine tune the compilation process but none of these options are required
    for the exam.

    2. Compilation of a Java file results in one or more class files depending on
    the contents of the Java source file.

    3. The standard Oracle JDK comes bundled with a Java Virtual Machine (JVM). The
    executable for the JVM is named `java`. In other words, the program you need to
    launch the JVM and to execute your Java program is called "Java".

    4. To execute a Java class, you can use the following command - java TestClass


    Notice the absence of file extension class while specifying the class name. To
    compile a Java source file, you must specify the extension of the file, i.e.,
    java though. Just like javac, java command can take multiple options to fine tune
    the execution of a Java program. You do not need to know any of these options
    for the exam.


    +   5. Java 11 allows what is called "single file source code programs", which
    means, if your program is present in a single source file, you can run that file
    directly using the java command instead of compiling it first using javac. For
    example, java TestClass, java'
