    examples of copying the value that is contained in one variable. This works for
    primitive as well as reference variables. Recall from the "Object and Reference"
    section that a reference variable contains an address and not the object itself.
    Then, when you assign one reference to another, you are only copying the memory
    address stored in one variable. You are not making a copy of the object referred
    to.


