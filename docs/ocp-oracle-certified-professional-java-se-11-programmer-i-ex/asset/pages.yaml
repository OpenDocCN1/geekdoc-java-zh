    int . Thus, you can assign a byte value to an int variable. Here are a few examples:


    ```

    byte b = 10; // b is 8 bits

    char c = ''x''; // c is 16 bits

    short s = 300; // c is 16 bits

    int i = 32 bits

    ```'
