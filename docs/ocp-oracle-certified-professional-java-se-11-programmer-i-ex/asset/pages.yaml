  md: '# 4.4 Identify the scope of variables


    # 4.4.1 Scope of variables


    Java has three **visibility scopes** for variables - class, method, and block.


    Java has five **lifespan scopes** for variables - class, instance, method, for
    loop, and block.


    # 4.4.2 Scope and Visibility


    **Scope** means when, within a program, a variable is accessible or directly without
    using any referencing mechanism.


    For example, the scope of the President of a country is that country. If you say
    "The President", it will be interpreted as the person who is the president of
    the country you are in. There cannot be two presidents of **a country**. If you
    really want to refer to the presidents of two countries, you must also specify
    the name of the country. For example, the President of US and the President of
    India.


    At the same time, you can have two presidents in a country - the President of
    the country, and the President of a basketball association meeting, and if you
    talk about the president in meeting, it will be interpreted as the person who
    is the president of the association and not the person who is the president of
    your country. But if you want to mean the president of the country, you would
    have to clearly name something like the "President of our country". ", of our
    country" is the referencing mechanism that removes the ambiguity from the word
    "president".


    In this manner, you may have several "presidents" in a country. All have their
    own "visibility". Depending on the context, one president may shadow or hide (yes,
    the two words have different meanings in Java) another president. But you cannot
    have two presidents in the same "visibility" level


    This is exactly "scope" in Java (or any other programming language, for that matter).
    For example, if you declare a static variable in a class, the visibility of that
    variable is the class in which you have defined it. The visibility of an instance
    variable is also the class in which it is defined. Since both have the same visibility,
    you cannot have a static variable as an instance variable with the same name in
    the same class. It would be like having two presidents of a country. It would
    be absurd and therefore, invalid.


    If you declare a variable in a method (either as a method parameter or within
    a method), the visibility of that variable is within the method. Since a method
    scope is different from a class scope, you can have a variable with the same name
    in a method. If you are in the method and you try to refer to that variable directly,
    it will be interpreted as the variable defined in the method and not the class
    variable. Here, a method variable shadows a class variable. You can, of course,
    refer to a class scoped variable within a method but you would use the class name
    for a static variable or object reference for an instance variable as a referencing
    mechanism to do that. **Hiding**, is when a subclass variable hides the variable
    name in a super. Since it involves inheritance, I will discuss it in detail later.


    Similarly, if you declare a variable in a loop, the visibility of that variable
    is only within that loop. If you declare a variable in a block such as an if,
    do/while, or switch, the visibility of that variable is only within that block.


    Here, visibility is not to be confused with **accessibility** (public/private/protected).
    Visibility refers to whether the compiler is able to see the variable at a location
    directly without any help.'
