    The short circuiting nature of ?: "


    Depending of whether the type of operand is true or false, either operand 2 or
    operand 3 is evaluated. In other cases, if the condition is true, operand 3 is
    not evaluated and if the condition is false, operand 2 is not evaluated. In this
    respect, the ternary conditional operator is similar to the two short circuiting
    operators, i.e., && and |. However, there is an important difference between the
    two. With && and |, evaluation of both operands is possible in certain situations,
    it is never the case with ?:. ?:? evaluates exactly one of the two operands in
    all situations.


    The short circuiting nature of ?: provides a good opportunity for trick questions
    in the exam. For example, what will the following code print?


    ```

    int x = 0;

    int y = 1;

    System.out.println(x>y? +++ : y);

    System.out.println(x++ + ""+y);

    ```


    1

    2


    Since the value of x is not equal to y, x>y evaluates to false and therefore,
    the ternary expression returns the value of the third operand, which is y++. Since
    y++ uses post-increment operator, the return value of y++ will be the current
    value of y which is 1. y will be incremented to 2. Observe that evaluation of
    the second operand is short circuited because the first operand evaluates to false.
    Therefore, ++x is never executed. Thus, the second print statement prints 2.'
