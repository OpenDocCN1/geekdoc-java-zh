  md: 'A module name follows same names and conventions that we use for naming packages
    and classes earlier. In short, the name must be a valid identifier (so, special
    characters such as dash and underscore are not allowed) and it should follow the
    reverse domain name pattern to avoid name clash, the name should be descriptive
    enough to tell the user the purpose or functionality of the module instead of
    being generic such as utils com.abc.finance.calculators.simpleinterest would be
    a good name for our module. However, for the purpose of this chapter, I am naming
    the module as simpleinterest to reduce clutter and make it easy to try out the
    code that I am going to present. Instead of be simpleinterest.simpleInterestCalculator
    or com.abc.finance.calculators.simpleinterest.simpleCalculator for the same name,
    there is no reason. If we follow the reverse domain name pattern between the module
    name and the name of the class(s) in that order, it may well be the best.


    The exam expects you to be able to identify and invalid module names. As explained
    above, the rules for naming a module are the same as for naming a package. Thus,
    for example, the following are valid module names: a (length is not important),
    _m (may start with contain _), n$ (may start with contain $), x1 (cannot start
    with a number) and a.b (may contain dots) but the following are invalid: 1x (cannot
    start with a number), a-b (cannot contain hyphens), a.. (cannot contain dots)


    # The module descriptor


    I remember about the lack of any formal way to describe a package. This is why
    module differs from a package. A module descriptor is the formal way to describe
    our module. Every module must have a descriptor that specifies the name of the
    module, what it provides, and what it requires. A module descriptor is nothing
    but a file by the name module-info.java. Yes, the extension of the file is java.
    A Java file that will be compiled to generate a file by the name module-info.class.
    When we talk of a module, it is the descriptor that we need for our. Indeed, the
    module is a black box and the module descriptor is all the contents of the module
    will be:


    ```

    //in module-info.java

    simpleinterest() {

    }

    ```


    There is not much in this nonetheless and all it says is this is a module named
    simpleinterest. But it is a valid module descriptor which uses the basic syntax
    for defining a module. We will be adding the module keyword and the module name,
    followed by the opening and closing braces. We are adding more information in
    this descriptor as we go. In this, however, it is a good start!


    The module-info.java file cannot be empty.


    # 16.1.3 Directory structure of a module


    The directory structures for the source and the compiled classes of a module are
    almost exactly the same as that of a package. The only difference is that a package
    may reside in any folder, a module resides in a folder by the same name. This
    rule applies to the source code as well as the class files. If the module directory
    contains the source code, it is called "source module definition" and if the module
    directory contains compiled classes, it is called "module definition"


    Thus, in example, the source code and compiled classes of our module must reside
    in folders named simpleinterest. The following image illustrates the directory
    structure that I will use to develop and execute'
