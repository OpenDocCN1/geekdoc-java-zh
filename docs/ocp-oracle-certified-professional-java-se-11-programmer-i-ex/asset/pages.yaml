  md: '# 4.1 Declare and instantiate Java objects


    # 4.1.1 Declare and instantiate Java objects


    In the previous chapter you saw the difference between primitive variables and
    reference variables and how to declare both kind of variables. The basic syntax
    of declaring primitive and reference variables is the same:


    ```

    <type name> <variable name>;

    ```


    In case of reference variables, the type can be a simple name or a FQN depending
    on whether the class (or its package) has been imported using an appropriate import
    statement or not. For example:


    ```

    String str;

    Object obj;

    SomeClass scRef; //assuming com.abc.SomeClass has been imported

    com.xyz.SomeOtherClass scRef; //assuming com.xyz.SomeClass hasn''t been imported

    ```


    You can declare multiple variables of the same type in a single statement:


    ```

    SomeClass scRef1, scRef2;

    ```


    As primitive variables, it is possible to assign a value to a reference variable
    at the time of declaration:


    ```

    SomeClass scRef1 = null; //scRef1 is initialized with null

    SomeClass scRef2 = scRef1; //scRef2 is initialized with the same value

    Object a = null, b = a; //b is initialized to null then a is assigned to

    ```


    Here are a couple of invalid declarations:


    ```

    String str, Object; //can change the type in a statement

    Object a = b, b = null; //b is being assigned to a b hasn''t been defined

    ```


    > You will not get over tricky questions on declaration of variables in the exam.
    If you stick to the basics above, you will not have trouble answering questions.


    Instantiating


    As discussed in the previous chapter, a class defines a new type. You define data
    types because they allow you to group raw data variables. For example, if you
    are dealing with dates, names of birth of people in your application, you may
    group the three data elements into a Person class and add behavior to Person class
    in terms of methods. You would then have several "persons" in your application.
    Each person would just an instance of the Person class. Two people may have different
    names and details but they will exhibit the same behavior. This commonality of
    behavior allows your application to treat all person instances in the same manner.


    Once you have defined the template, it is easy to construct objects. Java has
    three ways of instantiating objects - using the new, by deserializing an object
    and cloning an existing object. Here, we will only focus on the new keyword because
    deserialization and cloning are not in Part 1


    The following is the simplest example of instantiating an object using the new
    keyword:


    ```

    new java.lang.Object();

    ```'
