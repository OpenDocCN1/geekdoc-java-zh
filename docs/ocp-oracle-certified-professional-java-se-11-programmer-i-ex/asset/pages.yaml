    # Associativity


    Associativity of operators determines the grouping of operators when expression
    has multiple operators of same precedence. For example, the value of the expression
    2 - 3 + 4 depends on whether it is grouped as (2-3)+4 or as 2-(3+4). If the first
    grouping would be used if - is left-associative and the second grouping would
    be used if + is right-associative. It turns out that operators are generally used
    in the same fashion in which we read, i.e., from left to right. In other words,
    all of the operators in Java are defined to be left-associative. The only exceptions
    are the assignment operators (simple as well) and the ternary operator. Thus,
    the expression 2 - 3 + 4 will be grouped as (2 - 3) + 4 and will evaluate to 3.
    But the expression a = b = c = 5; will be grouped as (b = (c = 5)); because the
    assignment operator is right-associative. Here is another shows the impact of
    associativity.


    ```

    String s1 = "hello";

    int i = 1;

    String s2 = s1 + "1";

    System.out.println(s2); // prints hello

    ```


    The above code prints hello1 instead of hello2 because the + operator is left-associative.
    The expression s2 = s1 + i; is grouped as s2 = (s1 + i); Thus, s1 is computed
    first, resulting in the string hello1 which is then concatenated with 1, producing
    hello1.


    > A programming language could easily avoid ambiguities. There is no technical
    necessity for accepting the expression 2 + 6 / 2 as valid when it is interpreted
    in two ways. The only ambiguous expressions are accepted because it is considered
    too onerous for the programmer to resolve all ambiguity by using parenthesis when
    a convention already exists to evaluate mathematical expressions. Rules of Operator
    Precedence and Associativity are basically a programming language extension to
    the same convention that includes all sorts of operators. You can, therefore,
    imagine that operator precedence and evaluation order are used by the compiler
    to insert parenthesis in an expression. Thus, when a compiler sees 2 + 6/2, it
    converts the expression to 2 + (6 / 2), which is what the programmer should have
    written in the first place.'
