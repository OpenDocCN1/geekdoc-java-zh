  md: "# 4.2 Read or write to object fields\n\n# 4.2.1 Accessing object fields\n\n\
    By fields, we mean instance variables of a class. Each instance of a class gets\
    \ its own personal copy of these variables. Thus, each instance can potentially\
    \ have different values for these variables. To access these variables, i.e.,\
    \ to read the values of these variables or to set these variables to a particular\
    \ value, we must know the exact instance whose we want to manipulate. We must\
    \ have a reference to that object to be able to manipulate that object's fields.\n\
    \nRecall our previous discussion about how an object resides in memory and a reference\
    \ variable is just a way to address that object. Access to the contents of an\
    \ object or to perform operations on that, you need to first identify that object\
    \ by the JVM. A reference variable does just that. It tells the JVM which object\
    \ you want to deal wth.\n\nFor example, consider the following code:\n\n```\n\
    class Student{\n  String name;\n  public class TestClass{\n    public static void\
    \ main(String[] args) {\n      Student s1 = new Student();\n      Student s2 =\
    \ new Student();\n\n      s1.name = \"alice\";\n      System.out.println(s1.name);\
    \ //prints alice\n      System.out.println(s2.name); //prints null\n\n      s2.name\
    \ = \"bob\";\n      System.out.println(s1.name); //prints alice\n      System.out.println(s2.name);\
    \ //prints bob\n    }\n  }\n}\n```\n\nIn the code above, we created two Student\
    \ objects. We then set the name variable of one Student object and print names\
    \ of the Student objects. As expected, the name of the second object is printed\
    \ as null. This is because we never not set the second object's name to anything.\
    \ The JVM gave it a default value of null.\n\nNext, we set the name variable of\
    \ the second Student object and print both the values. This time we are able to\
    \ see the two stored values in two instances.\n\nThis simple exercise shows how\
    \ to manipulate fields of an object. We take a reference variable and apply the\
    \ dot operator and the name of the variable to reach that field of the object\
    \ to that. It is not possible to access the fields of an object if you do not\
    \ have a reference to that object. You may store the reference to an object in\
    \ a variable (as s1 and s2 in the code above) when that object is created and\
    \ then pass that reference around. Sometimes you do not want to keep a reference\
    \ in a variable. This typically happens when you want to create an object to call\
