    widening conversion". It is analogous to transferring water from one bucket to
    another. If your buffer is smaller than the target bucket, then you can transfer
    all the water from the smaller bucket to the larger bucket without any spill.


    What if the source type is larger than the target type? Picture the bucket analogy,
