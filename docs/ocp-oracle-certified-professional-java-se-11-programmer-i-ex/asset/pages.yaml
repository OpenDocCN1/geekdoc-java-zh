  md: 'I showed you the above code just to give a glimpse of the readymade classes
    in the Java library. There is a lot more than you can do before we get to that,
    you need to understand the bigger picture, the grand scheme of things, which includes
    classes such as ArrayList.


    # Collections and Collections API


    ArrayList belongs to a category of classes called "collections". A "collection"
    is nothing but a group of objects held together in some form. You can visualize
    a collection as a bag in which you put several things. Just you use a bag to take
    various groceries from a store to home, you put the objects in a collection so
    you can pass them around other objects and methods. A bag knows nothing about
    the items themselves. It merely holds them. You can add items to and take items
    out of it. It doesn''t care about the order in which you put them in whether there
    are duplicates or not. The behavior of a bag is captured by an interface Collection,
    which exists in the java.util package


    Now, what if you want a collection that ensures retrieved in the same order in
    which they were added to it? Or if you want a collection that does not allow duplicates?
    You can think of several features that can be added on top of a basic collection.
    As you have already learned previously, subclassing/subinterfaceing is where you
    extend the behavior of an existing class or interface. The Java library takes
    the root here and extends the java.util.Collection interface to provide several
    interfaces with various features. In fact, the Java standard library provides
    a huge tree of interfaces along with classes that implement those. These interfaces
    and classes are collectively known as the "Collections API".


    So what has ArrayList to do with you? ArrayList is a class that implements one
    of the specialized collections that contains code. List.util.List extends java.util.Collection
    to add the behavior of ordering on top of a simple collection. A List is added
    to the collection, so that takes the "List" part of ArrayList, what about the
    "Array" part? As, as you have learned previously, an interface describes a behavior.
    It doesn''t really implement behavior. You need a class to implement that behavior.
    Here, ArrayList is the class that implements this behavior using a java.util.Array
    internally. Hence we name it ArrayList. I wanted re talking about how to overcome
    the limitation of an array that it is not flexible enough to increase in size
    automatically. When you add an object to an ArrayList, it checks whether there
    is space left in the array. If not, it allocates a new array with a bigger length,
    copies the elements from the old array to the new one, and then adds the object
    to the new array. Similarly, it contains code for inserting in the middle of the
    array. All this is transparent to the user of an ArrayList. A user simply invokes
    methods like add and remove on an ArrayList without having knowledge of that the
    array is being used to store the object.


    # Generics


    Now, regarding the warnings I asked you to ignore. Observe the for loop in the
    code above. The type of the local variable is Object (not String). To see the
    length of String on o, we need to cast it to String. This is because, in the way
    that a bag is unaware of what is inside, of it is so that the ArrayList have no
    knowledge about the type of the objects that have been added to it. It is the
    responsibility of the programmer to cast the objects they retrieve from the list
    to appropriate types. In this program, we have added Strings to list so we know
    we can cast the object to String. But what if we were using a pre-populated list
    as an argument? The list would have been populated by another class by someone
    else, what would guarantee we know about the type of objects in the list? If we
    try to cast an object in an inappropriate type, we get a ClassCastException at
    runtime. Getting a ClassCastException at runtime would be a coding mistake that
    would only be discovered at runtime. This casting mistake is not a good thing
    and the compiler is only trying to warn about this potential issue by generating
    warnings while compiling our code.'
