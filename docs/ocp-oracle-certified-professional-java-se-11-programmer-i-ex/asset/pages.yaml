    # 2.1.1 The main method


    Let''s get thing out of the first way. Java classes are not **executables**. You
    cannot "execute" Java classes. The **Java Virtual Machine** (JVM) is an executable.
    You execute the JVM. You actually pass the FQN of a Java class as an argument
    to the JVM. When the JVM runs, it loads the given class and looks for a specific
    method in that class. If it finds that method, it passes control to that method
    and this method then becomes the in-charge from there onward. If the JVM doesn''t
    find a specific method, it errors out. In parlance, we call it executing or running
    a Java class or program.


    The method that JVM is hardwired to look for is called the "main" method and this
    method has a very specific signature - its name must be **main** and it must take
    exactly one parameter of type String array. In addition to this, it must **return
    void**, must be **public** and also **static**. It is clear to declare any exception
    in its `throws` clause. If your class has such a method, the JVM can invoke this
    method, and it is possible to execute the class. The meaning of `void`, `public`,
    `static`, and `throws` will clear as you proceed through the book for now, just
    assume that this is how the main method has to be.


    Examples of a valid method:


    +   1. `public static void main(String[]) args){` - This is the version that you
    see most of the time.

    2. `public static void main(String... args){` - Note that `String...` is the same
    as `String[]` as far as the JVM is concerned. The three dots syntax ayrıca I will
    talk about it later.

    3. `public static void main(String[] args) throws Exception{ throw new Exception()`
    - The method is allowed to throw any exception.


    Examples of an invalid method:


    +   1. `static void main(String abc[]){` - Invalid because it is not public.

    2. `public void main(String[] x){` - Invalid because it is not static.

    3. `public static void main(String[] a, String b){` - Invalid because it doesn''t
    take exactly one parameter of String array.

    4. `public static void Main(String[] args){` - Invalid because it is not public
    and the name starts with a capital M. Remember that Java is case sensitive.


    Note that all the above methods are valid in their own right. This is not a compilation
    error if you use these methods in class. But they cannot be called as the "main"
    method. JVM will complain if you try to execute a class on the basis of these
    methods. JVM has gotten smarter over the years and in Java 11, it gives out a
    very helpful message that explains the problem with your main method. For example,
    if it is not static, you will see the following message:


