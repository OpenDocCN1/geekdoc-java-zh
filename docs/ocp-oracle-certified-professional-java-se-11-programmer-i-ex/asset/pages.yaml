    # Size vs Capacity


    Size is the number of elements that are currently stored in the ArrayList. While
    capacity is the length of the internal array that ArrayList uses to store its
    elements.


    You know that in Java, arrays are of fixed length. You must specify the length
    of an array while creating and you can never change this length. So, what happens
    when you add more elements to an ArrayList than its capacity? Simple. new array
    with bigger length is allocated and elements are transferred from the old array
    to the new array. Since all is managed internally by the ArrayList, you don''t
    have to worry about most of the time.


    However, it has implications on the performance of an ArrayList. Since an ArrayList
    has no idea how many elements are going to be added to it, it starts with a capacity
    of 10 and keeps increasing the capacity as soon as it is (the exact algorithm
    for incrementing the capacity is not important here). Now, imagine if you wanted
    to add a thousand elements to an ArrayList. This could potentially require the
    ArrayList to perform the allocation and transfer operation, which is quite expensive,
    several times. This will reduce your performance.


    This is where the ArrayList(int capacity) constructor and ensureCapacity(int capacity)
    method comes in. If you know the number of elements you are going to add to the
    ArrayList, you should use this constructor/method to make sure that the internal
    array of the ArrayList is big enough to hold all the elements.


    Remember that insertion of an element depends on the size (and not capacity) of
    the ArrayList. For example, if the size of an ArrayList is 5, you cant insert
    an element at index 6 if the capacity of that ArrayList is 10. It will throw an
    IndexOutOfBoundsException.


