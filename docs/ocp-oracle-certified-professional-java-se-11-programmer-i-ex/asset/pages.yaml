  md: '# 9.2 Using arrays


    # 9.2.1 Array indexing


    In Java, array indexing starts with 0. In other words, the first element of an
    array is 0. For example, if you have an array variable named accounts that refers
    to an array of 100 Account objects, you can access the first object through accounts[0]
    and the 100th object through accounts[99]. accounts[0] or account[99] are like
    any other type of Account.


    Similarly, if you have an array ia pointing to 5 elements, the first element can
    be accessed using ia[0] and the last element using ia[4].


    ```

    java.lang.ArrayIndexOutOfBoundsException

    ```


    If you try to access an array outside its range, JVM will throw an ArrayIndexOutOfBoundsException.
    For example, if you have int[] ia = new int[3]; the statements int i = ia[-1];
    and int i = ia[3]; will cause an ArrayIndexOutOfBoundsException to be thrown.

    Do not worry if you don''t know much about exceptions at this point. I will discuss
    exceptions in detail later.


    # Arrays of length


    As strange as it sounds, it is possible to have an array of length 0. For example,
    int[] ia = new int[0]; ia refers to an array of length 0. There are no elements
    in such an array. It is important to understand that an array of length 0 is not
    the same as null. ia = null implies that ia points to nothing. ia = new int[0]
    implies that ia points to an array of whose length is 0.


    A good example of an array of length 0 is the args parameter of the main method.
    If you run a class with no argument, args will be null but will refer to an array
    of Strings of length 0.


    # Changing the size of an array


    Java arrays are fixed size(d). Once you create an array, you cannot change the
    number of elements that it can have. So, for example, if you have an array of
    5 elements and you have 6 int values to store, you will need to create a new int
    array. There is no way to increase or decrease the size of an existing array.
    You may change the array variable to point to a different array, and you can,
    of course, change the values that an array contains.


    # 9.2.2 Members of an array object


    We said that arrays are actually objects of specific classes. We also saw the
    names of some of these classes. But what do these classes contain? What are the
    members of these classes? What functionality do these classes provide? Let us
    take a look at:


    # Array length


    All arrays have one named field length, which is of type int. This field is public
    and it stores the length of the array. This field is also final, which reflects
    the fact that you cannot change the length of an array after its creation. The
    length of an array can never be less than 0, the value of this field can never
    be less than 0 either.'
