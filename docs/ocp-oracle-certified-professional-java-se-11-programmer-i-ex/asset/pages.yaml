  md: '# The updation section


    The rules for the updation section are the same as the initialization section
    except that you cannot have any "expression statements", which I have already
    discussed above. Generally, this section is used to update the loop variable (i++
    or k = k + 2 and so on) but as well as in examples, this is not the only way to
    use it. It doesn''t need to be any relationship between the code specified here
    and in others. The following are a few valid examples:


    ```

    int i = 0;

    for(i<10; i++); //post-increment

    for(;i<10; i = i + 2); //increment by two

    for(i<i10; i = someRef.getValue()) //assignment

    for(Object obj = new Object(); obj != null; ) { //empty updation section

    System.out.println(obj);

    obj = null;

    ```


    ```

    for(int i = 0; i<10; callSomeMethod()); //method call

    ```


    Observe that there is no semi-colon after the expression statement. It is terminated
    by the closing parenthesis of the for.


    # An infinite for loop


    Based on the above information, it should now be very easy to analyze the following
    loop:


    ```

    for( ; ; )

    ```


