    # Disadvantages of ArrayList


    +   1. Higher memory usage - An ArrayList generally requires more space than is
    necessary to hold the number of elements in an array.

    2. No type safety - Without generics, an ArrayList is not type safe at all.

    3. No support for primitive values - ArrayLists cannot store primitive values
    while arrays can. This disadvantage has been mitigated with the introduction of
    autoboxing in Java 5, which makes it possible to pass primitive values to various
    methods of an ArrayList. However, autoboxing does impact performance.


    # Similarities between ArrayLists and arrays


    +   1. Ordering - Both maintain the order of their elements.

    2. Duplicates - Both allow duplicate elements to be stored.

    3. nulls - Both allow null.

    4. Performance - Since an ArrayList is backed by an array internally, there is
    no difference in performance of various operations as searching an array and on
    an array.

    5. Thread safety - Neither of them are thread safe. Don''t worry, thread safety
    is not on the exam, but you should be aware of the fact that accessing them from
    multiple threads, may introduce results in certain situations.


    # 13.3. Map and HashMap


    Map is data structure that allows you to look up piece of information, i.e., value,
    using another piece of information, i.e., key. For example, a map of country codes
    and country names will allow you to look up a country using the country code,
    a map of student id and student name will allow you to look up a student name
    using the student id, and so on. In that, a map is a collection of key-value pairs.


    The java.util.Map interface of the Collections API captures this behavior. There
    are several implementation classes that implement the Map interface. The one that
    is used is java.util.HashMap.


    It is important to know that Map does not extend Collection interface. Map is
    the root of separate hierarchy of classes and interfaces that are not related
    to the Collection hierarchy. Although the exam does not mention Map and HashMap
    explicitly, we have seen questions on the exam that require you to know the methods
    of Map.


    +   1. get(Object key): Returns the value to the specified key is mapped, or null
    if this map contains no mapping for the key.

    2. put(K key, V value): Associates the specified value with the specified key
    in this map. If the map previously contained a mapping for the key, the old value
    is replaced by the specified value and the old value is removed. It returns null
    if there was no mapping for key.

    3. remove(Object key): Removes the mapping for this map if it is present, Returns
    the value or null, if not present.

    4. Set<K> keySet(): Returns a Set of keys present in the map. Observe that keys
    are unique, so the return type is Set (not Collection or List).'
