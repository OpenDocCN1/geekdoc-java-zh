  md: '# 1.4 Object and Reference


    # 1.4.1 Relation between a class, an object, and a reference


    A class is a template using which objects are created. In other words, an object
    is an instance of a class. A class defines what the actual object will contain
    once. You can think of a class as a cookie cutter. Just as you create cookies
    out of dough using a cookie cutter, you can create objects out of memory using
    a class.


    To access an object, you need to know exactly where object resides in memory.
    In other words, you need to know the "address" of an object. Once you know the
    address, you can call methods or access fields of that object. It is this "address"
    that is stored in a reference variable.


    If you have trouble this, try to imagine the relationship between a Television
    (TV) and a Remote. The TV is the object and the Remote is the reference variable
    pointing to that object. Just like you use the TV using the remote, you operate
    on an object using a reference pointing to that object. Notice that I did not
    say,"you operate on an object using its reference." Because an object doesn''t
    have any special reference associated with it. Just as a TV can have multiple
    remotes, an object can have any number of references pointing to it. One reference
    is as good as any other for the purpose of accessing that object. There is no
    difference between two references pointing to the same object except that they
    are different. In other words, they are mutually interchangeable.


    Now, think about what happens when the batteries of a remote die. Does that mean
    the TV stops working? No. Similarly, if you lose one reference to an object, the
    object is still there and you can use another reference, if you have it, to access
    that object. What happens when you take one remote to another room for operating
    another TV? Does that mean the other remote stops controlling the other TV? No.
    Similarly, if you change one reference to point to some other object, doesn''t
    change other references pointing to that object. following picture illustrates
    the situation:


    ![](img/f7bc00fabb8855fa5663a81b5e778ee0_37_0.png)


    Let me move now to an example that is closer to the programming world. Let''s
    say, you have the following code:


    ```

    String str = "hello";

    ```


    "hello" is the actual object that resides somewhere in the program''s memory.
    Here, str is the remote and "hello" is the TV. You can use str to invoke methods
    on the "hello" object.'
