    \ though Fruit does not implement\nPoisonous, there could be a subclass of Fruit\
    \ that implements Poisonous and that subclass would be a\nFruit, could potentially\
    \ point to an object of a class that implements Poisonous. Something like this:\n\
    \n# class StarFruit extends Fruit implements Poisonous() { }\n\n```\nFruit f =\
    \ new StarFruit();\nPoisonous p = (Poisonous) f;//compiles and runs\n```\n\nThe\
    \ above reasoning implies that you can cast any type of reference to any interface.\
    \ That's true except in one\ncase. If the declared variable is final and it does\
    \ not implement the interface given in the\ncase, the compiler knows never have\
