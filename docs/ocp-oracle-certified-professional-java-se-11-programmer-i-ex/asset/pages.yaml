  md: 'The first warning message it prints out is, "warning: unchecked call to add(E)
    as a member of the raw type java.util.ArrayList" for the code .add("alice"); at
    line 6. It prints the same warning every time an object is added to the list.
    The compiler is telling you that it does not know kind of objects this ArrayList
    is supposed to hold and that has no way of checking what we are adding to this
    list. By printing out the warning, the compiler is telling us that it will not
    be responsible for the objects that are put in this list. Whoever retrieves objects
    from this list must make type objects appropriately upon retrieval at their own
    risk. In other words, this list is "type unsafe." because it depends on assumptions
    made by humans about the contents of the list. This assignment is not checked
    or validated by the compiler for its trustworthiness. One can put any kind of
    object in the list and will not retrieve it until they hit a ClassCastException
    when they try to cast the retrieved object to its expected type.


    Java solves this problem by specifying the type of objects that we are going to
    store in a list declaring the type of the list. Instead of using ArrayList al
    = new ArrayList(); we write ArrayList<String> al = new ArrayList<String>(); all
    the warning messages go away. The compiler now knows that the ArrayList pointed
    to by al is supposed to hold only Strings. It will be able to keep track of the
    type of objects the code tries to add. If it sees any code that attempts to add
    anything that is not a String to the list, it will refuse to complete the code.
    The error message generated by the following code:


    ```

    ArrayList<String> al = new ArrayList<String>();

    al.add(new Object());

    ```


    The error message is:


    ```

    Error: no suitable method for add(java.lang.Object)

    method java.util.collection.add(java.lang.String) is not applicable

    ```


    The compiler will not let you court the list by adding objects that this list
    is not supposed to keep. Similarly, the compiler will not let you make incorrect
    assignments. Here is an example:


    ```

    List<String> al = new ArrayList<String>();//points to a List of Strings.

    al.add("hello"); //valid

    String s = al.get(); //valid, no cast required

    Object obj = al.get(); //valid because a String is a Object

    Integer in = al.get(); //Invalid. will not compile.

    ```


    The error message is:


    ```

    Error: incompatible types: java.lang.String cannot be converted to java.lang.

    ```


    Observe that we specified information about the type of object the list is supposed
    to keep by appending <String> to the variable declaration and the ArrayList creation.
    This way of specifying the type information is a part of a feature introduced
    in Java as "generics"


    The above discussion should tell you that the topics of List/ArrayList, Collections,
    and Generics are interrelated. All of them combine together to provide you a powerful
    mechanism to write type safe and bug free code. Although examples mention only
    List and ArrayList explicitly, we have questions that require you to have a basic
    understanding of the Collections API, the Collection and Map interfaces, the HashMap
    class and generics in the exam. So, before I move on to the API details of the
    contents, I will take a diversion to Generics in a little more detail.'
