  md: "To inherit features from another class, you have to extend that class using\
    \ the extends keyword. For example, consider the following two classes:\n\n```\n\
    public class Person{\n    public String name;\n    public String getName() {\n\
    \        return name;\n    }\n\n    public static int personCount;\n    public\
    \ static int getPersonCount(){\n        return personCount;\n    }\n}\n\npublic\
    \ class Employee extends Person{\n    public String employeeId;\n    public static\
    \ void main(String args[]){\n        Employee e = new Employee();\n        e.employeeId\
    \ = \"111\";\n        e.name = \"Amy\";\n        System.out.println(e.getName());\n\
    \    }\n}\n```\n\nIn the above code, Person is the parent class (also called the\
    \ super class or the base class) and Employee is the child class (also called\
    \ sub class or derived class). Since Employee extends Person, it automatically\
    \ \"gets\" the name field and the getName method. Thus, it is possible to access\
    \ the name field and the getName in an Employee object as if they were defined\
    \ in the Employee class itself, just like the employeeId field.\n\nSimilarly,\
    \ the Employee class also \"gets\" the static variable personCount and the static\
    \ method getPersonCount from Person class. Thus, it is possible to access personCount\
    \ and getPersonCount in an Employee class as if they were defined in the Employee\
    \ class itself.\n\nMembers inherited by a class from its super class are good\
    \ as members defined in the class itself and are therefore, passed on as inheritance\
    \ to any subclass. For example, if you have a Manager class that extends Employee,\
    \ the Manager class will inherit all members of the Employee class, which includes\
    \ the members defined in Employee class as well as members inherited from Person\
    \ class.\n\n```\npublic class Manager extends Employee {\n    public String projectId;\n\
    \n    public static void main(String args[]){\n        Manager m = new Manager();\n\
    \        m.projectId = \"OCPJP-I\";\n        m.employeeId = \"111\";\n       \
    \ m.name = \"Amy\";\n        System.out.println(m.getName());\n    }\n}\n```\n\
    \nThere is no limit to how deep a chain of inheritance can go."
