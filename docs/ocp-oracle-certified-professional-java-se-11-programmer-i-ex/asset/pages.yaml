    # 5.1.3 String interning


    Since objects and all objects in Java are stored only in the heap space, all strings
    are stored in the heap space. However, Java keeps strings created without using
    the keyword in a special area of the heap space, which is called "string pool".
    Java keeps the strings created using the keyword in the heap space.


    # String interning


    The purpose of the string pool is to maintain a set of unique strings. Any time
    you create a new string without using the keyword (i.e. using hardcoded String
    literals and String concatenation operations), Java checks whether the same string
    exists in the string pool. If it does, Java returns a reference to the same object
    and it does not create a New Object in the string pool or its reference. So, if
    you use the string "hello" twice in the code shown below, you will get a reference
    to the same object. We can actually test this by comparing two different references
    using the == operator as shown in the following code:


    ```

    String str1 = "hello";

    String str2 = "hello";

    System.out.println(str1 == str2); //prints true

    String str3 = new String("hello");

    String str4 = new String("hello");

    System.out.println(str1 == str3); // prints false

    System.out.println(str3 == str4); // prints false

    ```


    We will look at the == operator later for now, but it simply checks whether two
    references point to the same object or not they do. In this case, str1 and str2
    gets the reference to the same object which was created earlier. However, str3
    and str4 refers to two different string objects. So why str1 == str2 returns true
    but str1 == str3 and str3 == str4 returns false. When you do not use String("hello")
    "hello" is used in the anywhere in program - one in the string pool because this
    is the first time you use a quoted string, and one in the regular heap space because
    of the use of keyword.


    String interning is Java''s way of saving memory by avoiding creation of multiple
    String objects containing the same value. It is possible to get a string from
    the pool for a string created using the keyword by'
