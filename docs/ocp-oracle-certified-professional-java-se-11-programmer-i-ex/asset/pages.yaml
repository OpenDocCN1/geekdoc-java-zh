  md: "# An interface is always abstract\n\nAs mentioned above, an interface is merely\
    \ a contractual description of some behavior. It is not an entity that can actually\
    \ fulfill that contract. For example, you may describe the behavior of movement\
    \ using an interface named Movable you may define an object such as an animal\
    \ or vehicle to exhibit that behavior. Therefore, it does not make sense to instantiate\
    \ an interface. For this reason, an interface is implicitly abstract. Although\
    \ legally valid, it would be redundant to declare an interface as abstract.\n\n\
    # Variable definitions in an interface\n\nAll variables defined in an interface\
    \ are public, static, and final. The following example illustrates this point:\n\
    \n```\ninterface Movable{\n    int UNIT1 = 1;\n    static int UNIT2 = 1;\n   \
    \ static final int UNIT3 = 1;\n    public static final int UNIT4 = 1;\n}\n```\n\
    \nAll of the declarations above are valid. All the variables are public, static,\
    \ and final even the first three have not been declared as such. This implies\
    \ that you cannot have instance variables in an interface.\n\nRemember that instance\
    \ variables are meant to store state, which means they are really a part of implementation.\
    \ Therefore, interface variables have no place in an interface. To be honest,\
    \ it is not a good idea to have static variables either in an interface for reasons\
    \ best known to the language designers, Java allows static constants in an interface.\
    \ Many people use this feature to define \"global constants\" but it is simply\
    \ a bad design choice. Avoid them in your code.\n\n# Methods in an interface\n\
    \nAn interface can have four kinds of methods:\n\n+   1. abstract methods - You\
    \ have seen abstract methods in the previous section about abstract classes. They\
    \ contain just the declaration and no body. It is the same thing except that the\
    \ keyword abstract is optional. For example:\n\n```\ninterface Movable{\n    void\
    \ move(int x); //implicitly abstract\n    abstract void move2(int x); //explicitly\
    \ abstract\n}\n```\n\nBoth of the methods declared above are abstract.\n\n+  \
    \ 2. default methods - Default methods are a way for an interface to include a\
    \ default implementation for a. They are defined using the keyword default as\
    \ follows:\n\n```\ninterface Movable{\n    default void move(int x){\n       \
    \ System.out.println(\"Dummy implementation. Moving by \"++x+\" points\");\n \
    \   }\n```"
  merge: -1
