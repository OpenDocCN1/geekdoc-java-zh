  md: '# 13.2 Distinguish class inheritance from interface inheritance including abstract
    classes


    # 13.2.1 Difference between Interface and Abstract Class


    "What is the difference between an interface and an abstract class" is usually
    the first question that is asked in a Java "tech-check". While being a simple
    ice breaker, it is an excellent question to judge a candidate''s understanding
    of OOP.


    Candidates usually start portraying the technical differences since an interface
    cannot have method implementations (which it can, since Java 8), while abstract
    class can have static methods (which it can, since Java 8) or instance fields
    an abstract class can and so on.


    All that is correct, but not really impressive. The fundamental difference between
    an interface and an abstract class is that an interface defines just the behavior.
    An interface tells you nothing about the actual object other than it behaves.
    An abstract class, on the other hand, defines an object, which in turn, drives
    the behavior.


    If you understand this concept everything else will fall in place. For example,
    "movement" is a behavior that is displayed by various kinds of objects such as
    a Car, a Cat, or a StockPrice. These objects have no commonality that they move.
    Saying it the other way round, if you get an object that "moves", you don''t get
    any idea about what kind of object you are going to deal with. If you get a Car,
    a Cat, or a StockPrice. If you were to capture this behavior in Java, you would
    use an interface Movable with a method named move().


    On the other hand, if you talk about Automobile, a picture of an automobile starts
    forming in your head immediately. You can see that an Automobile would be something
    that has an engine, would have wheels, and would move. You intuitively know that
    a StockPrice or a Cat cannot be an Automobile even though they do move. An abstract
    class is meant exactly for this purpose, when, once you identify a conceptual
    object, you do not need to worry about its behavior. The behavior kind of flows
    automatically. If you create an abstract class named Automobile, you are most
    certain that it would have methods a move, turn, accelerate, or brake. It would
    have fields for capturing inner details such Engine, Wheels, and Gears that get
    by saying the word Automobile.


    From the above discussion, it should be clear that interfaces and abstract classes
    are not interchangeable. Even though an abstract class with no non-abstract method
    looks functionally similar to an interface, both are fundamentally different.
    If you are capturing behavior you must use an interface. If you are capturing
    a conceptual object, you must use an abstract class.'
