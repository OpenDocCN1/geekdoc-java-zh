    There are three ways to create objects of wrapper classes. Let us look at them
    one by one.


    +   1. Using constructors - Like any other object, objects of wrapper classes
    can be created using their constructors. For example,


    ```

    Integer i1 = new Integer(10);

    Integer i2 = new Integer("10");


    Character c = new Character(''c'');


    Boolean b1 = new Boolean(true);

    Boolean b2 = new Boolean("true");


    Float f = 10.2f;

    Float f1 = new Float(f);

    Float f2 = new Float(10.2); //valid, even though 10.2 is a double

    Float f3 = new Float("10.3");


    Short s = 10;

    Short s1 = new Short(s);

    Short s2 = new Short("10");


    Short s3 = new Short(10);//this will not compile.

    ```


    Observe in the code above, I have instances of wrapper classes using primitive
    values as well as String values. All wrapper classes except java.lang.Character
    provide two constructors - one that takes the primitive and the second that takes
    a String. java.lang.Character class provides only the char constructor and does
    not provide the String constructor. Furthermore, java.lang.Float class provides
    a third constructor that takes a double, which is why Float f2 = new Float(10.2);
    works though the literal 10.2 is a double.


    Further observe that Short s3 = new Short(10); will not compile because 10 is
    an int as explained above, Short does not have any constructor that takes an int.
    It has two constructors - one that takes a String and one that takes a short.
    (Recall that "implicit narrowing" does not happen for constructor or arguments.)


    +   2. Using the valueOf() methods - Wrapper classes have two valueOf methods.
    Each one takes the relevant type as a parameter, and the second one that takes
    a String. Character class is an exception because it has only one valueOf method
    that takes a char. Unlike constructors, Float class does not have a valueOf method
    that takes a double! Here are a few examples:


    ```

    Float f = 10.2f;

    Float f1 = Float.valueOf(f);

    Float f2 = Float.valueOf("10.2");


    Float f2 = Float.valueOf(10.2);//will not compile because 10.2 is a double

    Integer i1 = Integer.valueOf(10);

    Byte b = Byte.valueOf("10");

    Boolean bool = Boolean.valueOf("true");

    ```


    In the case of the String versions of valueOf methods (and also of the constructors),
    you have to be careful about the value you pass to the method if you pass a null
    or a value that cannot be converted into the required wrapper type, a NumberFormatException
    will be thrown. For example,'
