  md: "class or the method to be changed at all by a subclass. In technical terms,\
    \ we say that a final class cannot be subclassed and a final method cannot be\
    \ overridden. I will discuss overriding in detail soon but you can now see why\
    \ abstract and final cannot go together.\n\nA final class doesn't necessarily\
    \ have to have a final method. But practically, since a final class cannot be\
    \ extended, none of its methods can be overridden. The important thing is a final\
    \ class cannot have an abstract method. Why? Because there is no possibility of\
    \ abstract method ever getting implemented. It follows that if a final class inherits\
    \ an abstract method from any of its ancestors, it must provide an implementation\
    \ of that method.\n\nHere is an example of a final class:\n\n# public final class\
    \ chair extends Furniture;\n\n```\n// since assemble is an abstract method in\
    \ Furniture, it must be implement\npublic void assemble() {\n    System.out.println(\"\
    Assembling chair\");\n}\n```\n\nObserve that Chair doesn't have any final method\
    \ and that it must implement the abstract method assemble that inherits from superclass.\n\
    \nA final method is defined similarly:\n\n# public abstract class Bed extends\
    \ Furniture;\n\n```\n// necessary to implement assemble() because Bed is abstract\n\
    public final int getNumberOfLegs() {\n    return 4;\n}\n```\n\n```\npublic static\
    \ final void make(Bed b) {\n    System.out.println(\"Making Bed: \"+b);\n}\n```\n\
    \n# public final class DoubleBed extends Bed;\n\n```\n// must implement assemble\
    \ because DoubleBed is not abstract\npublic void assemble() {\n    System.out.println(\"\
    Assembling DoubleBed\");\n}\n```\n\n```\n// Can't override getNumberOfLegs here\
    \ because it is final in Bed\n```\n\n```\nfinal int getHeight() {\n    return\
    \ 18;\n}\n```\n\nObserve even though Bed has a final method, Bed itself is not\
    \ only final, it is abstract. I made it just to illustrate that any class irrespective\
    \ of whether it is final, abstract, or neither, can not contain a final method.\
    \ Java standard class library includes several final classes. Most important of\
    \ them is java.lang.String class, which I will talk about at length in another\
