  md: '}


    To make it interesting, I have put RetirementAccount into a different package
    than the rest of the classes. Let us now see the impact of the various access
    modifiers on these classes:


    +   1. Since Account has default access, it is visible only in the accts package
    and thus

    RetirementAccount cannot access or extend the Account class.


    +   2. Since accountNumber has default access, it is visible only in the accts
    package and thus, it will be inherited by all the subclasses of Account that belong
    to the same package. Thus, accountNumber will be inherited by CheckingAccount
    and SavingsAccount.


    +   3. Since balance has protected access, it is visible in all the classes of
    the accts package and all the subclasses of the Account class irrespective of
    their. Thus, it will be inherited by CheckingAccount and SavingsAccount. Since
    Account is not outside the accts package, making balance does not seem to make
    much sense but it does. Observe what happens with RetirementAccount.


    +   4. Since RetirementAccount extends SavingsAccount this means, the protected
    field balance is passed to the RetirementAccount as well. The interestField of
    SavingsAccount has default access, it is not visible in RetirementAccount and
    therefore, it is not inherited by RetirementAccount.


    +   5. Even though the balance of Account is visible and inherited in RetirementAccount,
    sa.balance will still not compile because RetirementAccount class does not own
    SavingsAccount''s balance as RetirementAccount is not responsible for the implementation
    of SavingsAccount class and so, RetirementAccount cannot access SavingsAccount''s
    balance. It can access its balance, which it inherits from SavingsAccount, and
    which is why ra.balance compiles fine, but not SavingsAccount''balance.


    # Memory impact of access modifiers on sub classes


    Even if a subclass does not inherit some of the instance variables of a superclass
    (because of access modifiers), a subclass still consumes the space required to
    store all of the instance variables of the superclass. For example, the JVM allocates
    memory for a RetirementAccount object, it includes space to store all instance
    variables of SavingsAccount and Account irrespective of whether they are inherited
    in RetirementAccount or not. From a memory perspective, access modifiers have
    no impact.


    So, on one hand, we are saying that a private member is not inherited by a subclass
    and on the other, we are saying that the subclass object does contain that member
    in its memory. This contradiction makes an intuitive understanding of the term
    "inheritance" difficult. Unfortunately, that is how it is. For example, in Section
    8.2, The Java Language Specification says, "Members of a class that are declared
    private are not inherited by subclasses of that class." This shows that the JLS
    links the term inheritance with access modifiers as explained and doesn''t give
    any consideration to memory.'
