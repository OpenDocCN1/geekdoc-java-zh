  md: '# 9.2.3 Runtime behavior of arrays


    Although arrays are simple data structures, they are not aware of their quirks.
    To use arrays correctly and effectively, you must be aware of the two most important
    aspects of arrays in Java.


    The first is that they are "reified". Meaning, the type checking of arrays and
    its elements is done at runtime by the JVM instead of compile time by the compiler.
    In other words, the type information of an array is preserved in the compiled
    bytecode by the JVM during run time. The JVM knows the type of an array and enforces
    type checking on arrays.


    For example, if you have an array of Strings, the JVM will not let you set any
    element of that array to point to anything other than a String, even though the
    compiler may not notice such a violation by by the code:


    ```

    String[] sa = {"1", "2", "3"};

    Object[] oa = sa;

    a[0] = new Object();

    ```


    The above code will compile. The compiler has no objection when you try to assign
    an array of Strings to a variable type of array. It has no objection when you
    try to set any element of this array of Strings to an object that is not a String.
    java.lang.ArrayStoreException on the third line. This is because the JVM knows
    that the array pointed to oa is actually an array of Strings. It will not realize
    when you try to store random objects in it.


    It is important to understand this concept because it is diametrically opposite
    to how generics work. This is the reason why arrays and generics operate well
    with each other. You will realize this when you learn about generics later.


    The second thing about arrays is that they are "covariant". Meaning, you can choose
    a subclass in an array that is declared to be of the type of its super. For example,
    if you have an array of type java.lang.Number, you can store java.lang.Integer
    or java.lang.Float objects into that array because both are subclasses of java.lang.Number.
    The following code will compile and run:


    ```

    Number[] na = {1, 2, 3};

    a[0] = new Float(1.2f);

    ```


    > We haven''t seen anyone a question on array reification and covariance in the
    OCP Java11 Part 1 exam. However, any discussion about arrays is incomplete without
    these two points and that is why I talked about them here.


    # 9.2.4 Usage of arrays


    Arrays are quite powerful as a data structure but they are primitive as a data
    type. As we saw earlier, arrays have only one field and merely a collection of
    methods. Because of their simplicity, arrays are also used as building blocks
    for other data types and structures. The String and are StringBuilder. These higher
    level classes only wrap an array of chars and provide methods for manipulating
    that array


    Arrays are also used for building higher level data structures like List, Stack,
    and Queue. You may have come across the ArrayList (this class is also on the exam,
    by the way, and I will discuss it later). Guess what, it is a List that manages
    its collection of objects using an array inside. Since these classes provide a
    lot of additional features over arrays, more often than not, it is classes used
    in application programs rather than raw arrays.'
