  md: 'In Java, primitive data types include integral data types (byte, char, short,
    int, long), floating point data types (float, double), and boolean data type (there
    is only one - boolean). While reference data types include the classes, interfaces,
    and enums, irrespective of them. If something is a class, an interface, or an
    enum, it is a reference data type. String is a reference data type because strings
    are instances of type java.lang.String; I will talk about Strings later.


    Note that integral and floating point data types are called numeric data types.


    The following table lists the details of primitive data types:


    > You will not be assured the details of sizes of data types in the exam. However,
    it is important to know about them as a Java programmer.


    # Primitive Data Types in Java


    | Data Type | Size (in bits) | Range of values | Sample Values | Operations supported
    |

    |---|---|---|---||

    | byte | 8 | -2^7 to 2^7, i.e., -128 to 127 | -1,0, 1 | mathematical, bitwise
    |

    | char | 16 | 0 to 2^16, i.e., 0 to 65,535 | 0, 1, 2, ''a'', ''\u0061'' | mathematical,
    bitwise |

    | short | 16 | -2^15 to 2^15-1, i.e., -32,768 to 32,767 | -1,2, 3 | Mathematical,
    bitwise |

    | int | 32 | -2^31 to 2^31-1 | -1,2, 3 | mathematical, bitwise |

    | long | 64 | -2^63 to 2^63-1 | -1,2, 3 | mathematical, bitwise |

    | float | | | approximately A±3.40282347E+38 | 1.1f, 2.0f | mathematical |

    | double | 64 | | A±1.7976931486231570E+308 | 1.1, 2.0 | mathematical |

    | boolean | | | true, false | logical |


    +   Notes:

    1. byte, char, short, int, and long are called integral data types because they
    store precise integral values.

    2. char is also an integral type that stores numbers like byte, short, int and
    long. But it cannot store a negative number. The number stored in a char variable
    is a unicode character.

    3. Float and double store large numbers. Java follow IEEE 754 standard. You may
    go to learn it more but it is not required for the exam.

    4. A boolean stores only two values and therefore, requires only one bit of memory.
    However, its size is not defined because the size depends on the smallest chunk
    of memory that can be addressed by the operating system. On 32 bit systems, a
    boolean may use 4 bytes.


