    \ average = average(1, 2, 3, 4); //multiple arguments\n```\n\nAn important point\
    \ to understand here is that varargs is a syntactic sugar for the syntax. It saves\
    \ a few keywords while making the code cleaner but makes no difference to the\
    \ bytecode generated by the compiler. When the compiler sees the varargs in a\
    \ method with arguments, it simply wraps the arguments into an array and passes\
