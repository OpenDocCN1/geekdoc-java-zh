    true\");\n{\n    System.out.println(\"false\");\n}\n```\n\nand\n\n```\nboolean\
    \ flag = false;\nif(flag)\n    System.out.println(\"false\");\nelse\n    System.out.println(\"\
    true\");\n{\n    System.out.println(\"false\");\n}\n```\n\nThe above code snippets\
    \ are equivalent, since the second snippet is properly indented, it is easy to\
    \ understand that the last code is not really associated with the if/else statement.\
    \ It is an independent block of code which will be executed regardless of the\
    \ value of flag. This code will, therefore, print true and false.\n\nHere is another\
    \ example of bad indentation:\n\n```\nboolean flag = false;\nint i = 0;\nif(flag)\n\
    \    i = i + 1;\n    System.out.println(\"true\");\nelse\n    i = i + 2;\n   \
    \ System.out.println(\"false\");\n```\n\nThe above code is trying to confuse you\
    \ into thinking that there are two statements in the if part and two in the else\
    \ part. But, with proper indentation, it is clear what this code is really up\
    \ to:\n\n```\nboolean flag = false;\nint i = 0;\nif(flag) i = i + 1;\nSystem.out.println(\"\
    true\");\nelse i = i + 2;\nSystem.out.println(\"false\");\n```\n\nIt turns out\
    \ that the last three lines of code are independent statements. The else statement\
    \ is completely out of place because it is not associated with the if statement\
    \ at all and will, therefore, cause compilation error."
