  md: "detailed discussion of the pros and cons of constructors is beyond the scope\
    \ of this book, but I will give you a couple of pointers.\n\nAs mentioned earlier,\
    \ an instance is not considered \"ready to use\" until its constructor execution.\
    \ Thus, a constructor helps you make sure that an instance of your class will\
    \ be initialized as per your needs before anyone can use it. Here, \"use\" means\
    \ other code accessing that through its fields or methods.\n\nIt is possible to\
    \ do the initialization in a method instead of a constructor but in case that\
    \ the users of your class would have to invoke that method explicitly after creating\
    \ an instance. What if a user of your class fails to invoke that method after\
    \ after creating an instance of the class? The instance may be in a logically\
    \ inconsistent state and may produce incorrect results when the user invokes others\
    \ methods later on. Therefore, the constructor is the right to perform all initialization\
    \ activities of an object. It is a place where you make sure that the instance\
    \ is ready with all that it needs to perform the activities it is supposed to\
    \ perform in other methods.\n\nConstructors provide thread safety because no thread\
    \ can access the object until the constructor is finished. This protection is\
    \ guaranteed by the JVM to the constructors and is not always available to methods.\n\
    \n# 10.4.3 Overloading constructors\n\nA class can have any number of constructors\
    \ as long as they have different signatures. Since the name of a constructor is\
    \ the same as that of the class, the only way you can have multiple constructors\
    \ is if their parameter type is different.\n\nJust like methods with names, if\
    \ a class has more than one constructors, this is called \"constructor overloading\"\
    \ the constructors are different only in their list of parameter types.\n\nThere\
    \ are a couple of differences between method overloading and constructor overloading\
    \ though. Recall that in case of method overloading, a method can call another\
    \ method with the same name just like it calls any other method, i.e., by using\
    \ the method and passing the arguments in parenthesis. In case of constructor\
    \ overloading, when a constructor calls another constructor of the same class,\
    \ it is called \"constructor chaining\" and it works a bit differently. Let me\
    \ show you how.\n\n# Constructor chaining\n\nA constructor can invoke another\
    \ constructor using the keyword this and the arguments in parenthesis. Here is\
    \ an example:\n\n```\nclass Account{\n    int id;\n    String name;\n    Account(String\
    \ name){\n        this(111, name); //oking another constructor here\n        System.out.println(\"\
    returned from two args constructor\");\n    }\n    Account(int id, String name){\n\
    \        this.id = id;\n        this.name = name;\n    }\n    public static void\
    \ main(String[] args) {\n        Account a = new Account(\"amy\");\n    }\n```"
