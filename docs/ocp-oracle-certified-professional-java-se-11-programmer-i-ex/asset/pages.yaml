  md: "The module-path switch is used to tell Java the location of the module definition.\
    \ This is the directory the module's root directory is located or, if the module\
    \ is a jar file, module-path is the directory where jar is located. In our case,\
    \ we have specified out in module-path because our module's root directory, i.e.,\
    \ simpleinterest, is located in out.\n\nThe module switch is used to tell Java\
    \ the name of the module we want to execute. Observe the value specified for --module.\
    \ it is in the format <module name>/<class name> as, of now, our module is present\
    \ in an exported format and does not contain any information about the module.\
    \ So, we need to tell the JVM the main class that we want to run as well. Once\
    \ we package our module into a jar, we won't need to specify the main class on\
    \ the command line.\n\n# Packaging a module\n\nThe process of packaging classes\
    \ of a module into a jar file is the same as the one we for packaging classes\
    \ into a jar. The only difference about a module jar is that the name of the jar\
    \ is, by convention, the name of the module (with .jar extension, course). Inside\
    \ the jar file, class must still exist in the package driven directory structure\
    \ like this. Thus, the name of the jar file corresponds to the module directory\
    \ and the organization of the files inside the jar corresponds to the organization\
    \ of the files inside the module directory. Since a module also has a module-info.class\
    \ in its root folder, the module must also have this class in the root folder\
    \ of the jar that implies it is not possible to package multiple modules in the\
    \ same jar. In other words, you can have only one module per jar.\n\nSince a module\
    \ jar (including its name) mimics the organization of a module, a module jar is\
    \ also considered the \"definition of a module\".\n\nHere is how we package our\
    \ module into a jar file:\n\n```\nc:\\ocplmoduletest-jar --create --file simpleinterest.jar\
    \ --main-class simpleinterest.Simpleinterestcalculator -out\\simpleinterest\n\
    ```\n\nThis should create simpleinterest.jar in the mod directory.\n\n --create\
    \ switch tells the jar tool that we want to create something and the --file and\
    \ the subsequent value specifies the jar file that we want to create. The --main-class\
    \ switch makes the jar tool add a MainClass entry in the jar file's manifest.\n\
    \n -C switch explains some we. We use the jar tool to point to the directory structure\
    \ of the module, which makes the structure inside the jar file should be the same\
    \ as the structure out\\simpleinterest directory. There are two levels below moduletest\
    \ (out and simpleinterest) that we don't want in the jar file. The -C option is\
    \ to make the jar tool's working directory before adding the jar file. We want\
    \ to step down to out\\simpleinterest directory and include everything from here.\n\
    \nThe dot at the end of the command means that we use . to include everything\
    \ in its current directory (which is now out\\simpleinterest due to the use of\
    \ the -C switch) to be included in the jar file. The following two images show\
    \ the contents of simpleinterest.jar created by the above command. (I used the\
    \ free version of 7zip application to view the contents of the jar file) The first\
    \ image shows the contents at the root level and the second image shows the contents\
    \ of the simpleinterest folder."
