    In the chapter operators, saw that += is a compound operator. It applies the +
    operator on the operands and assigns the result back to the left side. As the
    case with the + operator, the string concatenation behavior of += is triggered
    when the type of any of the operands is String. Here is an example:


    ```

    String s = "1";

    s += 2; //expanded to s = s + 2;

    System.out.println(s); //prints "12"

    ```


    Furthermore, if the type of += operator is a string, the type of the operand on
    the left must be something that can refer to a string, otherwise the exception
    occurs. There are only 4 types other than String - the super classes of String,
    i.e., CharSequence and Object, and the interfaces String implements, i.e., Serializable
    and Comparable. Here is an example:


    ```

