  md: '# 7.2 Create ternary constructs


    # 7.2.1 The ternary operator ? :


    > The ternary operator is not mentioned in the exam objectives explicitly (although
    it was mentioned explicitly in OCA 8 objectives). We haven''t seen any one getting
    a question on it either. However, it is one of the commonly used operators in
    Java and from that perspective, it falls within the scope of the exam objectives.
    You should go through the following discussion only if you have time.


    The syntax of the ternary ? operator is as follows:


    ```

    operand 1 ? operand 2 : operand 3;

    ```


    Operand 1 must be an expression that returns a boolean. The boolean value of this
    expression is used to decide which of the rest of the two other operands be evaluated.
    In other words, of the operands 2 and 3 will be evaluated upon the return value
    of operand 1. If the expression given in operand 1 returns true, the ternary operator
    evaluates and returns the value of operand 2 and if it is false, it evaluates
    and returns the value of operand 3. From this, it is also a "conditional operator"
    (as opposed to &, |, !, and ^ which are really "logical" operators).


    Examples:


    ```

    boolean sweet = false;

    int calories = sweet ? 200 : 100; //assign 100 to calories

    boolean sweetflag = (calories == 100) ? false : true);//assign false to sweet


    boolean hardcoded = false;

    //assuming getRateFromDB returns a double.

    double rate = hardcoded ? 10.0 : getRateFromDB(); //invokes method getRateFro


    String value = sweetflag ? "Sweetened" : "Unsweetened";

    Object object = sweetflag ? "Sweetened" : new Object();

    ```


    The ternary operator is often thought of a short form for the ifelse statement
    but it is similar to the ifelse statement only contains evaluation of its two
    operands. Their fundamental difference lie in the fact that the ternary expression
    is an expression while an ifelse statement is a statement. Since the value of
    a ternary expression is the value returned by the second or the third, the operands
    of the ternary operator can contain any expression. As the example given above,
    they can also include non-void method invocations. No such restriction with the
    ifelse statement. The following example highlights this


    ```

    boolean flag = true;

    if(flag) System.out.println("true");

    else System.out.println("false");

    ```


    The above else statement compiles fine and prints but a similar code with ternary
    expression is not a valid


    ```

    flag ? System.out.println("true") : System.out.println("false");

    ```


    The reason for non-compilation of the code above is two fold. The first is that
    the ternary expression is not a valid statement on its, which means you cannot
    have a free standing ternary expression. It can only be a part of'
