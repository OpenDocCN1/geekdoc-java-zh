    \ simpleinterest\n\nAfter the compilation of this module, our directory structure\
    \ looks like this:\n\n![](img/f7bc00fabb8855fa5663a81b5e778ee0_393_0.png)\n\n\
    We can now execute the simpleinterest module as we did before using the following\
    \ command:"
