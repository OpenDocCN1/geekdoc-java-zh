  md: '# 15.2 Differentiate among checked, unchecked exceptions, and Errors


    # 15.2.1 Checked and Unchecked exceptions


    As discussed earlier, exceptions thrown by a method are part of the contract between
    the method and the user of that method. If the user is not aware of the exceptions
    that a method might throw, they will be blindsided during runtime because their
    code would not be prepared to handle them. The throws clause of a method is meant
    to list all exceptions that the method might throw. If an exception is listed
    in the throws clause, the user of the method will know that they need somehow
    to handle that situation.


    But what if a developer fails to list an exception in the throws clause of a method?
    In this case, we are back to the same problem of blindsiding the user of that
    method at runtime. This is when the compiler plays an important role. While compiling
    a method, the compiler checks for the possibility of any exception that might
    get thrown by the method. If an exception is not listed in the throws clause of
    that method, it refuses to compile the method.


    This sounds like a good solution, but the problem here is that the compiler does
    not check for all kinds of exceptions by a piece of code. "checked exceptions"
    forces you to list only those exceptions that belong to this category of exceptions
    in the throws clause.


    Exceptions that do not belong to the category of checked exceptions are called
    "unchecked exceptions". They are called unchecked because the compiler does not
    care whether a piece of code such an exception or not. Listing unchecked exceptions
    in the throws clause is optional.


    Finding out whether an exception is a exception or not is easy. Java designers
    have postulated that any exception extends java.lang.Throwable does not extend
    java.lang.RuntimeException or java.lang.Error is a checked exception. The rest
    (i.e. java.lang.RuntimeException, java.lang.Error, and their subclasses) are unchecked.


    The following figure illustrates this grouping of exceptions.


    ![](img/f7bc00fabb8855fa5663a81b5e778ee0_364_0.png)'
