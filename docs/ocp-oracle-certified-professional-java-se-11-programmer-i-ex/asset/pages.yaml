  md: "It is possible to nest try statements inside other try, catch, and finally\
    \ blocks. The rules for try statements are exactly the same as for regular try\
    \ statements. But remember that a catch block associated with a nested try statement\
    \ cannot catch an exception thrown by the outer try block. Here is an example:\n\
    \n```\nvoid foo() throws Exception {\n  try{\n    if(true) throw new FileNotFoundException();\n\
    \    else throw new EOFException();\n  } catch(FileNotFoundException fnfe){\n\
    \    try{\n      throw new EOFException();\n    } catch(EOFException eofe){\n\
    \      eof.printStackTrace();\n    }\n  }\n}\n```\n\nIn the code, the catch(EOFException\
    \ eofe) is associated with the try statement that is nested inside the catch(FileNotFoundException\
    \ fnfe) block. Because the EOFException is not thrown from the outer try block,\
    \ if the outer try block throws EOFException, the control will not enter the catch(FileNotFoundException)\
    \ block because catch(EOFException) clause does not satisfy EOFException, thus\
    \ the EOFException thrown from the outer try block will remain unhandled, which\
    \ means it must be declared in the throws clause of the method.\n\n# Throwing\
    \ an exception from catch or finally\n\nIt is possible to rethrow the same exception\
    \ (or throw a new one) from a catch block. You may want to do this if you want\
    \ to do something upon receiving an exception before letting it up the call stack.\
    \ Or, if it is a checked exception you would have to declare in the throws clause\
    \ of the method. Here is an example:\n\n```\nvoid bar() throws EOFException {\n\
    \  try{\n    foo();\n  } catch(EOFException eofe){\n    // do something here and\
    \ rethrow the same exception again.\n    throw eofe;\n  }\n}\n```\n\nThe same\
    \ effect can be achieved with a finally block:\n\n```\nvoid bar() throws EOFException\
    \ {\n  try{\n    foo();\n  } finally{\n    // do something here\n  }\n}\n```\n\
    \nSince there is no catch block to catch the EOFException thrown by foo, the exception\
    \ will automatically be thrown out of the bar() method to the caller of bar(),\
    \ but only the code in the finally block is executed.\n\nRrowing an exception\
    \ explicitly from a catch block is only helpful if you have multiple catch blocks\
    \ and you want to do a different thing in every catch block."
