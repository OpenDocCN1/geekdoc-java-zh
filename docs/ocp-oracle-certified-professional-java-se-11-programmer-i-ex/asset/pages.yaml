    \ For\nexample, String is a final class and the code will not compile for the\
    \ same reason:\n\n```\nString s = new String();\nPisonous p = (Poisonous) s;//will\
    \ not compile\n```\n\n# Downcast vs Upcast\n\nCasting of a variable to a subtype\
    \ (e.g. casting the f of type Fruit to Apple) is called \"downcasting\".\nIt is\
    \ called downcasting because in a UML diagram subclass is always drawn below the\
    \ superclass. Also, a\nvariable of type Fruit may refer to any kind of fruit but\
    \ you cast it to Apple, you have essentially reduced\nthe possibilities for the\
    \ kind of fruits that could be referred to. In other words, when you cast\nvariable\
    \ to a subtype, you are narrowing the type of object to which this variable is\
    \ pointing, down to a more\nspecific type. Here the term \"narrowing\". It means\
    \ the same as downcasting. The opposite of downcasting is\n\"upcasting\" or \"\
    widening\".\n\nAs explained above, downcasting always requires a check by the\
    \ JVM to make sure that the variable is really\npointing to an object of type\
    \ that the programmer has claiming it is pointing to. Upcasting, on the other\
    \ hand,\nrequires no check and, in fact, almost always redundant (I will show\
    \ you the situation where it is not\nredundant). Since an Apple is-a Fruit, you\
    \ can assign a variable of type Apple to a variable of type\nFruit without explicit\
    \ cast.\n\n# 12.5.3 When is necessary\n\nIn the previous section I used the analogy\
    \ of a remote and a TV to show you that the type of a variable and the type\n\
    of the actual object referred to by that variable are two different things and\
