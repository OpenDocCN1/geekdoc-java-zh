  md: "Thus, the rule about having a reference to the instance fields of an object\
    \ still applies. Java supplies the reference on it if you don't specify it explicitly.\n\
    \n> By automatically assuming the existence of the reference variable \"this\"\
    \ while accessing a member of an object, Java saves you a few keystrokes. However,\
    \ it is not considered a good practice to omit it. You should always type \"this.\"\
    \ even when you know that you are accessing the field of the same object because\
    \ it improves code readability. The usage of \"this\" makes the intention of the\
    \ code very clear and easy to understand.\n\n# When is \"this\" necessary?\n\n\
    When you have than one variable with the same name in code, you may have to remove\
    \ the ambiguity by using \"this\" reference instead. This typically happens in\
    \ constructors and setter methods of a class.\n\n```\nclass Student{\n  String\
    \ id;\n  String name;\n  public void setName(String code, String name) {\n   \
    \ id = code;\n    name = name;\n  }\n```\n\nIn the setName method, four variables\
    \ are assigned: two method parameters - code and name, and two instance variables\
    \ - id and name. Within the method, when you do id = code; the compiler knows\
    \ that you are assigning the value of the method parameter to the instance field\
    \ because exactly one match exists. When you do name = name; the compiler cannot\
    \ distinguish between the two name variables. It thinks that name refers to the\
    \ method parameter and assigns the value of the method to itself, which is redundant\
    \ and not what you want. There is nothing wrong with the compiler's perspective\
    \ from a logical perspective, the above code has a bug. This term is called \"\
    shadowing\". A variable defined in a method (either in parameter list or a local\
    \ variable) shadows an instance or static field of class. It is not possible to\
    \ access the shadowed variable directly using a single name. The compiler needs\
    \ more information from the programmer to disambiguate the name.\n\nTo fix this,\
    \ you must tell the compiler that the name on the left-hand side of = should refer\
    \ to the instance field of the Student instance. This is done using \"this\",\
    \ i.e., this.name = name;\n\nWhile we are on top of shadowing, I may well talk\
