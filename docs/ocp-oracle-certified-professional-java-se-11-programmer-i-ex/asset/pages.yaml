  md: "# 13.1 Create and implement interfaces\n\n# 13.1.1 Using interfaces\n\nAn interface\
    \ is used to describe behavior as captured by a group of methods. It doesn't tell\
    \ you anything about the object behind the behavior except that the methods declared\
    \ in the interface can be invoked on that object. Group of methods, is a way to\
    \ interact with the object.\n\nAn interface is defined using the keyword \"Interface\"\
    . For example:\n\n```\ninterface Move{\n  void move(int x);\n}\n```\n\nFrom a\
    \ purely OOP perspective, an interface should not contain any implementation.\
    \ It should only contain method declarations. However, Java has already permitted\
    \ interfaces to contain default methods and static methods. Furthermore, from\
    \ Java 8, Java has permitted an interface to contain default methods and Java\
    \ 9 has allowed an interface to contain private methods (static as well as non-static)\
    \ all.\n\nThere are several rules about interfaces that you must learn by. So,\
    \ let me go over them one by one.\n\n# Everything is public in an interface by\
    \ default\n\nEverything declared inside an interface is implicitly public except\
    \ methods that are declared private. This means that members of an interface are\
    \ always public irrespective of whether you define them as public or not. In fact,\
    \ you are prohibited from defining them as private or protected. The following\
    \ example illustrates this point:\n\n```\ninterface Move{\n  void move(int x);\
    \ //OK, move1 is public\n  public void move2(int x); //OK, move2 is explicitly\
    \ public\n```\n\n```\nprivate void move3(int x); //OK, abstract methods are always\
    \ public\nprotected void move(int x); //OK, abstract methods are always public\n\
    private int PV_VALUE = 10; //OK, fields cannot be protected or private\n\nint\
    \ value = 10; //OK, value is implicitly public\nprivate void putMethod() { //OK,\
    \ non-abstract methods can be private (but\n```\n\nThis makes sense because the\
    \ purpose of an interface is to put out a way to interact with an object in front\
    \ of the world. Remember that an interface is not about how an object is implemented.\
    \ It is about how an object can be interacted with. Then, an interface is a contract\
    \ between an object and the rest of the application components and everything\
    \ in a contract is public, everything in an interface must be public.\n\nWhat\
    \ if you want to disclose members of an interface only to the members of the same\
    \ package? Well, make the interface \"default\". As discussed earlier, default\
    \ access allows something to be visible only to members of the same package. If\
    \ the interface is not outside the package, members certainly won't.\n\nPrivate\
    \ methods do not fit conceptually in an interface but the need for private methods\
    \ was felt after default methods were introduced in Java 8. If a method gets too\
    \ big or if multiple methods with a lot of common code, there was no way to refactor\
    \ them into smaller methods without exposing all of them to the world because\
    \ everything in an interface had to be public. Java 9 fixes this by allowing private\
    \ methods in an interface."
