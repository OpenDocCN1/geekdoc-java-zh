  md: '# 16.4 Advanced module compilation and execution


    Seeing all the module related line switches feels overwhelming at first. But once
    you understand the underlying theme behind these options, you will realize they
    are not much different from the --classpath (and --sourcepath) options that you
    used so far. The module-path and module-source-path switches are to a module what
    Classpath and sourcepath switches are to a regular project. Earlier, used to specify
    just the FQN of the main class while compiling an application, now you specify
    the module name using the --module option. That is basically.


    I have observed many students get confused due to the fact that classpath and
    module-path are not mutually exclusive. It is possible and sometimes necessary,
    to use both switches simultaneously while compiling and as executing a module
    in a command as well as non-modular libraries. They are used in projects that
    make use of module as such usage is not in scope for OCP Java Part 1 officially
    (it is included in the Part 2 exam), some testers have reported getting a question
    or that both uses the switches in command.


    Another cause of confusion is the presence of multiple switches which can do the
    same thing. For example, --module-path is the same as -p and --module is the same
    as -m.


    In this section, I will summarize all the options you need to use while compiling
    and executing a module.


    # 16.4.1 Compiling multiple modules at once


    In the previous example, we compiled the calculators and simpleinterest modules
    separately after another. We could have easily compiled both of them at the same
    time by listing both of them in the --module switch:


    ```

    c:\ocpl1\moduletest\javac -d out --module-source-path src --module calculators,simpleinterest

    ```


    Observe that the module named are separated using a comma. In Java, fact we compile
    the module even without specifying it in the --module switch because javac will
    notice that simpleinterest requires calculators and, it will compile calculators.
    However, this is only possible when the source code of the module is organized
    correctly in the package directory structure. If the files are organized differently,
    javac will not be able to locate them on.


    # Using a module without source code


    While developing a module, you might be required to use third party modules whose
    source code is not available. For example, what if the module was developed by
    another team and you just have a calculators.jar for it


    Well, we can use the --module-path switch for telling javac the location of a
    module we used it while executing a module. Let''s put calculators.jar in c:\ocpl1\moduletest\modulejars.
    We now use the following command to compile the simple:interest module:


    ```

    c:\ocpl1\moduletest\javac --module-path modulejars -d out --module-source-path
    src --module simpleinterest

    ```


    Observe that we didn''t specify the actual jar in the module path (although we
    could have done that as well). We specified just the directory that contains it.
    We can specify as many directories as needed by the path separator (; on windows
    and : on *nix). The difference between specifying a directory and specifying a
