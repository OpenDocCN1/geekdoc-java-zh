  md: '# 1.9 Nomenclature


    # 1.9.1 Commonly used terms in Java development


    During your programming career you will be reading a lot. It could be books, articles,
    blogs, manuals, tutorials, and even discussion forums. You will be interacting
    with Java developers in various roles such as interviewers, team members, architects,
    and colleagues. To make the most out of these interactions, it is very important
    to form a clear and precise understanding of commonly used terms.


    I will explain the commonly used phrases, names, and terminology in the Java world.


    +   **1. Class** - Unless stated otherwise or clear in context, the term includes
    class, interface, and enum. Usually, people mean "type" when they say "class".
    You should, however, always try to be precise and use the term class only for


    +   **2. Type** - refers to classes, interfaces, enums, and also primitive types
    (byte, char, short, int, long, float, double, and boolean).


    +   **3. Primitive types** - byte, char, short, int, long, float, double, and
    boolean are called primitive types because they just hold data and have no behavior.
    You can perform operations on them but you cannot call methods on them. They have
    no property or state other than the data value that they contain. You access them
    directly and through references.


    +   **4. Reference types** - Classes, Interfaces, and Enums are called reference
    types because you always refer to them through references and indirectly. Unlike
    primitive, reference types have behavior/or state.


    +   **5. Top-level types** - Classes, interfaces, or enums that are defined directly
    under a package are called top-level classes, interfaces, or enums.


    +   **6. Nested reference types** - Classes, interfaces, and enums that are defined
    inside another class, interface, or an enum are called nested classes, interfaces,
    or enums.


    +   **7. Inner reference types** - Non-static nested classes, interfaces, and
    enums that are called inner classes, interfaces, or orums.


    +   **8. Local reference types** - Nested reference types that are defined inside
    a method (or another code block but not directly inside a class, interface, or
    enum) are called local classes, interfaces, or enums.


    +   **9. Compile time vs run time (i.e. execution time)** - You know that there
    are two steps in executing Java code.

    The first step is to compile the Java code using the Java to create a class file
    and the second step is to execute the JVM and pass the class name as an argument.
    Anything that happens while compiling the code such as generation of compiler
    warnings is said to happen during "compile time". Anything that happens while
    executing the program is said to happen during the "run time". For example, syntax
    errors such as a missing parentheses, or a semicolon are caught at compile time
    while any exception that is generated while executing the code is caught at run
    time. It is obvious how many beginners programmers ask as, "why does this code
    follow the following exception when I try to compile it?", when they really mean,
    "why does this code generate the following error message after successful compilation?"
    Another common question is, "why does this code throw an exception after successful
    compilation?" Successful compilation is not a guarantee for successful execution!
    Although the compiler tries to prevent a lot of bugs by raising warnings and error
    messages while compilation, successful compilation'
