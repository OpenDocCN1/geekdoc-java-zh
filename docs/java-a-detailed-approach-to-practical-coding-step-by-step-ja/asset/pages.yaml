- pgno: 53
  md: '# Concepts behind Inheritance


    For the most part, when you look at programming books, they are just going to
    talk about how inheritance is the ability of elements to have common qualities.
    It will also highlight the fact that these elements are able to have some unique
    features, these features are going to be what allows the new class to stand out.


    The inheritance is going to allow the elements of the first class to be transferred
    to another class, making it have a lot of the same features. But it is nice because
    you will be able to make some changes to this second class, without losing what
    you did in the first class at all. This is really useful because it will save
