- pgno: 19
  md: '# Boolean Expressions


    The next thing that you are going to work with Java is your Boolean Logic. While
    there are a lot of options that are available when you are writing your code,
    Java, as well as some of the other programming languages, are going to simplify
    it to statements that are either false or true. And they will also go with the
    Binary Numbering System. This is going to work to ensure that the program is going
    to make some of its own decisions based on the information that the user gives.


    The Boolean expressions are going to be based on true or false. For example, if
    you want someone who enters their age to be above 21, you would have a true show
    up when the person enters any number above 21, but a false any time they enter
    a number that is 20 or below. If the true expression comes up, you will have a
    certain statement come up, such as “Congratulations, you qualify to participate.”


    Now, depending on which way you do this, there are a few things that can happen.
    In the simplest of forms, you will have the program just ends up false, or the
    person enters an age that is 20 or below. But you can go through when a false
    occurs, make some changes so that instead of having the program just shut down
    another message comes up. For example, when the person enters a number that is
    20 or below, you can make it so that the program will show a statement such as
    “Sorry, you are not able to participate at this time.”


    Remember that you are the one who is in charge when it comes to the code that
    you are writing. There are a lot of expressions that you are able to fit into
    the Boolean expression, such as the “if”, “if else” and “else if” statements that
    allow you to create the exact code that you are looking for no matter what program
    you are working with. You will be able to determine a few true and false statements
    that will work the best with the code that you are making.'
  merge: -1
