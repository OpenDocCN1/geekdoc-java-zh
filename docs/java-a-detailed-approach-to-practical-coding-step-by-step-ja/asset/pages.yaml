- pgno: 24
  md: '# Assignment operators


    Next on we are the assignment operators. These are good when you want to make
    sure that the two values are assigned together. This can be shown within your
    code, or you can use it in order to save the function that you are working on.
    Some examples of the assignment operators that you may want to work with in your
    code include:


    +   - (=)—this is going to give the value of what’s on the right side back to
    the operand on the left. For example, if you have c = a + b, the value that you
    get from a + b, is going to turn into.

    - (-)=subtract AND—this is going to take the operand that is on the right and
    subtract it from the left operand. It will assign the results to the left. For
    example, c-= is the same as thing as c = c-a.

    - (+)=add AND. This is going to work the same as the one above, but it is going
    to add the operand that is on the right to the left, and then gives the left operand
    result.

    - (/)=divide AND. This will divide the left with the right operand and then will
    assign the value over to the left.

    - (*)=Multiple AND. This is going to multiply the right operand with the left
    operand before assigning the results to the left operand.

    - (**)=exponent AND. This is going to derive the exponential notation. C ** =
    a is going to be the same as c = c** a.


    # Identity operators


    These can be really helpful any times you want to compare the memory of two different
    objects, especially if they are going to be in different locations. Some of the
    identity operators that you may want to use within your code to make it stick
    together include:


    +   - Is. This is going to determine whether the variables on both sides are going
    to be true. If they are not, the operator is going to point to the same subject.

    - Is not—if the variables on either side of your code are false, the operator
    is going to point to the subjects and will say true-wise.


