  md: '# Memory


    In the beginning, the memory in Java was quite a bit slower, especially when it
    was compared to some of the other programming languages that there were. Issues
    with memory, in the beginning, made the program take longer to load for the user
    and it was not user-friendly on some platforms. This is because the Java language
    used memory bit differently than some of the others, but this has been changed
    in the later versions to make it easier to get the speed and the memory function
    that you need.


    Over time, the developers of Java made some changes so that Java was able to work
    faster. This is due in part because it uses the Automatic Memory Management. This
    basically allows the programmer to choose which changes they are going to make
    to the code and their runtime is not going to be affected at all.


    This kind of memory changes things so that it is no longer referencing a certain
    object. That object is now not a part of the program, and this can save a lot
    of the memory that you need to make the program easier to manage and a lot faster.
    You may not need to know all the specifications about the memory on Java, but
    it is nice to know that you will be able to work on your code and get it to come
    out nice and fast.


    Now that you know a little bit more about Java and how the programming language
    works, it is time to learn more about some of the things that you are able to
    do with this language to make the right code that you are going to love and enjoy.'
