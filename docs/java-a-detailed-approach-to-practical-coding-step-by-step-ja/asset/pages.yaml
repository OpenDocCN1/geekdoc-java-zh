  md: '# Operators


    Now let''s take some time to look at the operators that are present with your
    Java Language. Operators are very interesting because they will allow you to manipulate
    the operand values in some way and there are many different categories that come
    along with these. Some of the categories of operators that you may need to use
    within your code include:


    +   * Arithmetic

    * Identity

    * Assignment

    * Bitwise

    * Membership

    * Comparison or relational

    * Logical


    # Arithmetic operators


    There are a number of arithmetic operators that you are able to use. These are
    mostly going to be able to help you to do various mathematical equations in your
    coding, so they are good to know if you are making that kind of code, or just
    to have on hand for other uses. Some of the arithmetic operators that you will
    find include:


    +   * (+)this is the addition operator. It is going to add together two or more
    of your operators. For example, a + b = 10.

    * (−)—this is the subtraction operator and it is going to take the right operand
    and subtract it from the operand that is on the left. For example, a – b =5

    * (/)this is the division operator. It is going to divide the operand that is
    on the left from the one that is on the right.

    * (*)—this is the multiplication operator and it is going to multiply the two
    or more numbers that you want.

    * (//)—this is going to be one want to use when you are looking for quotient results,
    such as when the decimals have been removed.

    * (**)this is the exponent. If you want to use “the power of” or another option
    similar, the exponent is the best choice for you.'
  merge: -1
