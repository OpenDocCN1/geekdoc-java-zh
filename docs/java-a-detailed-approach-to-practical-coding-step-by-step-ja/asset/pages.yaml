- pgno: 49
  md: '# The If Statement


    The statement is going to work on the true and false idea. It is going to decide
    whether the input the user is putting in true or false and then give the right
    response that you put if the answer ends up being true. You will need to determine
    which statement that you would like to come into the program if user puts the
    true statement. On the other hand, if the user puts in a number that ends up being
    false based on the criteria you put into the program, the screen is going to end.


    While you may not like that the program is going to end if the user puts in the
    wrong number, this is how the statement is going to work. We will explore a bit
    later what you are able to do if you would like there to be a few options available
    in case the user puts in a number that is not originally accepted by your code.


    So say you want to do a code for people who are voting. You may write out the
    code so that it has a few varieties. The question that the user is going to see
    is “What is your age?” They are able to put in any number that they want because
    it is just their age. But you will need to set up the program to respond in a
    certain way.


    You may choose just to have a message come up if the person is older than 18.
    You would need to use the >=18 sign in the code and then add in the message that
    you would like. For example, if the person placed their age as 35, you could have
    the program provide the statement “Congratulations! You are able to participate!”
    and then it would go on to the next part of your code. On the other hand if your
    user places their age as 16, the program would either end or it would move on
    to the next thing that you want to show up in your program.'
