- pgno: 52
  md: '# Working with Inheritances


    Inheritances can be really useful when you are writing your code. They are going
    to allow you to take the features from one of your older classes and transfer
    it over to a new class as you need. You will be able to make changes as well.
    You will also be able to keep the first class intact, which is helpful if you
    want to still use the first class, but also to change some of the features to
    go in with the new class.


    For example, if you transfer all of the elements from class A to class B, you
    are going to have both of these still in the program. None of them are going to
    disappear. Right at the beginning you will simply have two classes with the same
    information, although most people who use inheritances will want to make changes
    to class B, while still maintaining some of the original features of class A.
    This makes things easier since you you will be able to make those changes without
    completely getting rid of the first class.


    When working in this kind of thing, remember that class A is going to be considered
    the original class and that class B is going to be known as the subclass, just
    to keep things in order. The elements of that first class may now be found under
    another class once you do the inheritance, but you will be able to trace the origins
    back to class A.'
  merge: -1
