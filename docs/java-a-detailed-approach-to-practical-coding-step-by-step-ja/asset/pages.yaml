- pgno: 14
  md: '# Characters


    The first data type that we are going to discuss characters. These are just simply
    the words that you will use when you create your code for others to use. These
    can include a lot of different things, but some of the ones that you may want
    to learn include:


    +   - If—this is going to work on a true and false basis. You can also use the
    if...else and the if statements are based on what you want to get with your block
    of code.

    - While—this is often used for true conditions or to execute blocks of code.

    - For—this is used for blocks that are attached.

    - Try—this is handled by except and will make it easier to raise exceptions for
    your code blocks.

    - With—this will use your block managers and can be used to help out with opening
    and closing files.

    - Def—this means that your function or your method will be defined in the code.

    - Class—this is going to be used in object-oriented programming and will execute
    the blocks of code.

    - Print—you can use this when you want the phrase to be printed on the screen.
    For example, after someone puts in their age or a number, you can print out some
    kind of phrase to tell them they are right or wrong.

    - Import—if you are trying to import some modules from your other functions, the
    import can be nice.

    - Yield—this is going to be used as an operator and it is used to generate function
    values.

    - Assert—this is often used to check out the statements that you want to have
    applied.

    - Pass—this will allow you to create a code block that is empty.


    If you are using these words, you will not be able to change them into variables.
    They are reserved to be used as commands to the program so that it knows what
    you want it to accomplish when the code is executed.'
  merge: -1
  img_proc: true
