- pgno: 54
  md: '# What Does the Transitive Relationship Mean?


    When you are talking about the relationship between the class and the subclass,
    you are talking about a transitive relationship. In both mathematics and programming,
    this means that the relationship is going to be traced to a partial order, as
    well as an equivalence order. If the group is introduced within another group,
    it is said that all the elements of those groups are going to be associated with
    each other. In addition, the transitive nature of your inheritance will point
    out that it is inclusive and extensive in characteristics.


    There are two concepts that are going to be followed with inheritances. The first
    is that class 1 extends into class 2, the elements of class 1 are going to be
    included inside class 2. And second, when class 2 then extends into class 3, the
    elements of both class 1 and class 2 are then going to be included in class 3.


    What this basically means is that you are going to be able to make as many inheritances
    down the line as you want. If you want to make a new code from class A, you can
    do that and then you can later go down the line and make a Class C that has the
    features of both Class A and Class B. You cant skip down and just go from Class
    B to Class C, you will need to have some of the features that are found in Class
    A in there as well, but you can keep going all the way down to Class Z or further
    if you choose in your code.


    This helps to prevent waste in several ways. First, you are not wasting your time
    rewriting the same features of code over and over again, even if you want to reuse
    them within the code. Second, you will not waste much space inside the code because
    the new subclasses that you are making will able to link back to the original
    code, rather than having it rewritten a whole bunch of times within the code.


    And of course, once you make the new subclass, you are going to be able to make
    some changes if you want that part of the code to do something a bit differently
    than the original one, that is fine. You will be able to make changes to that
    subclass which will not make any changes to the other classes or subclasses within
    your inheritance.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Java Shadowing


    Another thing that you are able to do within Java that is connected to inheritances
    is shadowing. This is a technique that will take two variables that are named
    similarly and which have overlapping scopes. It is going to need one that is a
    higher variable and one that is a lower variable because one of the variables
    is going to overlap the other. The lower variable is going to have elements that
    will be hidden in the process.


    For example, your lower variable can be called theta and the higher one called
    beta. When the theta is able to overlap the higher variable, it is going to hide
    all the elements that are in beta. But just because the elements of the shadowed
    variable are hidden, doesn''t mean that they are not able to work. They are going
    to work just fine. They are often hidden for the purpose of not having to display
    the length.


    You may want to do this for a few reasons. Some programmers like to use it when
    they want to combine a few elements before making them into a new subclass. This
    can save a lot of time you will not need to rewrite each of them in the process.
    The elements of both are going to be fully functional so you will be able to use
    them both, but you can combine them and make changes in the new subclass that
    you are trying to create.


    It is also nice to sometimes hide the length of the higher variable. When you
    are working on the computer language, you need to be careful with what you are
    doing in terms of length or it can slow down the whole system. The shadowing technique
    is going to help prevent some of these issues and can make your whole program
    a bit faster.


    As you can see, there are so many things that you are going to be able to do when
    it comes to writing your own program. While we have discussed a lot of different
    things in this book, the inheritances can be some of the most useful. They allow
    you to mix and match things while getting all the power that you need from the
    original code. You can make changes, keep carrying down the inheritance and so
    much more. Give it a try and see just what you are able to do when you introduce
    inheritance with your code.'
  merge: -1
  img_proc: true
