  md: '# Variables


    Variables are really important matter what kind of programming language you are
    going with, and this is no exception when you are working with Java. First, we
    need to understand that the variables are the means used in order t store the
    data. You are going to use them to determine where to keep all of the statements
    and other things that you are creating within your code. You will need to use
    a lot of different character, integers, and decimals in order to make the variables
    that you need.


    The first thing that you will need to do is value assignation. The equal sign
    is the one that you will need to use the most because it really shows what everything
    is going to do together. You can show what the age equals or what the color equals
    or something else similar. You don''t necessarily need to go through and make
    declarations that are explicit here, but you do need to make sure that the variable
    is on the left side of the equal sign and the thing that will happen to the variable
    ends up on the right. A good example of how this works:


    ```

    #!usr/bin/java

    ```


    ```

    counter = 100      # an integer assignment

    miles = 1000.0      # a floating point

    name = "John"      # a string

    ```


    ```

    print counter

    print miles

    print name

    ```


    When you put this into your system, you are going to get the output of:


    ```

    100

    1000.0

    John

    ```


    This is just one of the examples that you are able to use when you are putting
    together the variables in your language. You can have as many of these as you
    need to make the code work, just make sure that you are naming them properly and
    that they all line up the proper way.'
