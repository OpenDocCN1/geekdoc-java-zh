    \ bring out a lot of ordered statements that will display on the screen.\n\nIf\
    \ you want to write out a method, there is a basic syntax that will make the right\
    \ things come up. This syntax includes:\n\n```\nModifier returnTypeValue methodName(list\
    \ of parameters) {\n  // Method body;\n}\n```\n\nLet's take a look at what all\
    \ of these parts mean so that you have a good idea of what will fit into each\
    \ part to make the code work properly.\n\n# Method Name: Modifiers\n\nThese are\
    \ the optional modifiers that will tell the compiler how you want it to call up\
    \ the method. The access type of the method should be defined in this way.\n\n\
    # Return type\n\nThis is going to show some of the return values for the method.\
    \ The ReturnTypeValue is going to be defined as the data type of the value method\
    \ returns. There are some operations that may be performed without returning a\
    \ value you choose. If there is to be no returning value, you need to make sure\
    \ that you are using the keyword \"void\".\n\n# Method name\n\nThis is going to\
