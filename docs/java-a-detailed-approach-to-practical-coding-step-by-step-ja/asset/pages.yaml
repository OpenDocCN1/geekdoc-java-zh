  md: '# The if...else Statement


    Now, with the option above, you are only going to have one answer that is true
    or false. If the answer comes out true based on what you wrote into the program,
    you are going to get the statement that you place inside of code. But if the answer
    is false based on what you put into the code, you are going to get nothing.


    This is not going to work that for most people. You don''t want your code to give
    up after the answer ends up being false. In most cases, you will want to have
    a message that comes up whether the person answers inside a certain age or not.


    Let''s take a look at the example that we did above. Let''s say that the person
    did answer that they were 16. You still want to have something else come up in
    the code for someone who answers this age. You will be able to use the if...else
    clause to make sure that the first statement doesn''t end true (the person isn''t
    18 or above that first one is false), the code is then going to move on to the
    second statement that you had available. You may choose something like “Sorry,
    you are not eligible at this time to participate. Please try again later.


    So with the if...else statement, if the person is 18 or above, they will be able
    to get the original message that you wrote. But if they place in a number that
    is below 18, they will get the second message as we just discussed. This is still
    going to work off the true and false idea, but it is going to allow the program
    to show examples no matter what answer you are given.


    You are able to use the if...else statement as much as you would like. It is possible
    to do as many of these statements as you would like. This can be helpful if you
    want to split the people into several different groups. Let''s say that you want
    to have three groups, one that likes cats, one that likes dogs, and one that likes
    both. You will be able to list all of these choices on the screen and allow the
    user to pick them out. You can go through and add in the statements that you would
    like to show u based on the answer that you are given.


    There are no limits on the amount of if...else statements that you are able to
    use when it comes to your code in JavaScript. You get to be in control so pick
    as many options as you would like to make it work for the ideas that you have
    with this particular code.'
