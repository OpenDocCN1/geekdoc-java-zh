    ```


    ```

    a&b = 0000 1100

    a/b = 0011 1101

    a^b = 0011 0001

    ```


    # Logical operators


    These are pretty basic ones that you can choose to go with. They are going to
    be basically items that will be able to hold 10 to 20 variables between them.


    # Comparison operators


    These are going to make different comparisons to figure out if the statements
    are true and what the program should do if the statements are true or if they
    are false. Some of the comparison operators that you may use within your Java
    program include:


    - (==)—these are when the condition evaluates to true when the operands are equal.

    - (<>)—if the values are not equal, the condition will become true.

    - (!=)—the condition will become true if the values of two operands are not equal.

    - (<)—the condition becomes true if the left operand has a value that is less
    than the right operand.

    - (>=)—the condition will become true if the value on the left side is greater
    than the right operand.

    - (<)—if the left operand is less than the right operand, the condition will become
    true.

    - (>)—if the left operand is greater than the right operand, the condition is
    true.


    As you can see, there are a lot of different things that you are able to do with
    your operators when they are set up properly. You will be able to do basic arithmetic
    equations, figure out if a statement is true or false, and so much more. You should
    take some time to go through and practice doing some of these options to see how
    they work and to get some experience!


    There is just so much that you are able to do when creating a new code using Java.
    You will be able to combine some of these basic classes in Java to make the exact
    code that you want, adding in more things, taking things out, and just making
    it into your very own.


    # Reference versus Primitive Types


    When it comes to working with Java, there are a few different kinds of data types.
    We have talked a bit about the independent or the primitive data types in Java,
    but there are also reference types, and these can go into the different categories
    as well. While they are slightly different, you will also need to have them supported
    by the primitive data.


    While the primitive types are able to stand on their own, there are some things
    that the reference data types are able to do that will make the program work better
    and you will see a big difference when it comes to how well your program is going
    to work. There are a few different types of these you are able to use so let''s
    take a look at them to learn how they work.


    # User Datagram Protocol


    User Datagram Protocol is a connectionless protocol. It is a reliable stream of
    datagrams (wait, UDP is actually unreliable). It is a message-oriented, connectionless,
    transport-layer protocol. It is part of the Internet Protocol suite. It was first
    specified in RFC 768 in 1980. It is used for establishing real-time applications
    such as DNS, VoIP, IP telephony, and Stream Control Protocol (SCMP).


    The User Datagram Protocol (UDP) is a datagram protocol. Unlike TCP, it does not
    provide reliable delivery, flow control, or congestion control. It is used for
    applications where speed is more important than reliability, such as online gaming,
    streaming, and video conferencing. It does not provide ordering or retransmission
    of lost segments.


    Some of the features of UDP include:

    - Connectionless

    - Low overhead

    - No flow control

    - No congestion control

    - Support for broadcast and multicast


    # Transmission Control Protocol


    Transmission Control Protocol (TCP) is a connection-oriented, reliable, full-du
    stream communication protocol. It provides reliable delivery of an ordered stream
    of octets between applications. It is part of the Internet Protocol suite. It
    is used for applications that require data integrity and reliability, such as
    web browsing (HTTP), file transfer (FTP), and email (SMTP).


    Some features of TCP include:

    - Connection-oriented

    - Reliable delivery

    - Flow control

    - Congestion control

    - Error checking


    # Address Resolution Protocol


    As you can get from the name, this is a telecommunications protocol that will
    make easy for websites and apps to communicate. It is used to help map network
    addresses, and it will make video calls and other messages possible. There are
    many great technologies that are going to use this kind of protocol, including
    IPv4, Xerox PARC Universal Packet, ChaosNet, and DEC Net.

