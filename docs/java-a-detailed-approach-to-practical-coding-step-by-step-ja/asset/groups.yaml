  - '[PAGE 54]


    # What Does the Transitive Relationship Mean?


    When you are talking about the relationship between the class and the subclass,
    you are talking about a transitive relationship. In both mathematics and programming,
    this means that the relationship is going to be traced to a partial order, as
    well as an equivalence order. If the group is introduced within another group,
    it is said that all the elements of those groups are going to be associated with
    each other. In addition, the transitive nature of your inheritance will point
    out that it is inclusive and extensive in characteristics.


    There are two concepts that are going to be followed with inheritances. The first
    is that class 1 extends into class 2, the elements of class 1 are going to be
    included inside class 2. And second, when class 2 then extends into class 3, the
    elements of both class 1 and class 2 are then going to be included in class 3.


    What this basically means is that you are going to be able to make as many inheritances
    down the line as you want. If you want to make a new code from class A, you can
    do that and then you can later go down the line and make a Class C that has the
    features of both Class A and Class B. You cant skip down and just go from Class
    B to Class C, you will need to have some of the features that are found in Class
    A in there as well, but you can keep going all the way down to Class Z or further
    if you choose in your code.


    This helps to prevent waste in several ways. First, you are not wasting your time
    rewriting the same features of code over and over again, even if you want to reuse
    them within the code. Second, you will not waste much space inside the code because
    the new subclasses that you are making will able to link back to the original
    code, rather than having it rewritten a whole bunch of times within the code.


    And of course, once you make the new subclass, you are going to be able to make
    some changes if you want that part of the code to do something a bit differently
    than the original one, that is fine. You will be able to make changes to that
