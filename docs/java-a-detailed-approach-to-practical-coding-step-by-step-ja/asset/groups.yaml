    - No in—这将检查变量是否不在指定的序列中，然后评估其结果为假还是真。


    # 位运算符


    位运算符将逐位地处理运算符。这的一个很好的例子是：


    ```

    a = 0011 1100

    b = 0000 1101

    ```


    ```

