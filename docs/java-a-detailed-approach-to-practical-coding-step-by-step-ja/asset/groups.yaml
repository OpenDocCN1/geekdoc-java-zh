    x is y, here is the result in 1 if id(x) equals id(y).

    - No in—this is going to check if the variable is not inside of a specified sequence
    and can then evaluate whether this is false or true.


    # Bitwise operators


    The bitwise operators are going to go through the operator bit by bit. A good
    example of this is: operand.


    ```

    a = 0011 1100

