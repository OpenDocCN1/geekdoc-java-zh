  mdcn: "\n\n## 传递关系意味着什么？\n\n当你谈论类（class）与子类之间的关系时，你是在谈论一种传递关系。在数学和编程中，这意味着这种关系将追溯到偏序关系以及等价关系。如果一个组被引入到另一个组中，则认为这些组中的所有元素都将相互关联。此外，你继承的传递性质表明它在特征上是包容且扩展的。\n\
    \n与继承相关的有以下两个概念。第一个是类 1 扩展到类 2，类 1 的元素将被包含在类 2 内部。其次，当类 2 扩展到类 3 时，类 1 和类 2 的元素都将被包含在类\
    \ 3 中。\n\n这基本上意味着，你可以根据意愿在链条中进行任意数量的继承。如果你想从类 A 创建新代码，你可以这样做，之后你可以顺着链路创建一个同时具有类\
    \ A 和类 B 特性的类 C。你不能跳跃直接从类 B 到类 C，你需要在其中包含一些来自类 A 的特征，但如果你愿意，你可以在代码中一直持续到类 Z 或更远。\n\
    \n这在多个方面有助于防止浪费。首先，你不需要反复浪费时间重写完全相同的代码特征，即使你想在代码中重用它们。其次，你不会在代码内部浪费大量空间，因为你创建的新子类可以链接回原始代码，而不是在代码中将其重写多次。\n\
    \n当然，一旦你创建了新的子类，如果你想让部分代码的执行方式与原始代码有所不同，你可以进行一些更改，这是没问题的。你可以对该子类进行修改，而不会对你继承体系中的其他类或子类产生任何影响。\n\
    \n## Java 隐藏（Shadowing）\n\n在 Java 中，你可以做的另一件与继承相关的操作是隐藏（shadowing）。这是一种处理两个命名相似且作用域重叠变量的技术。它需要一个高位变量和一个低位变量，因为其中一个变量将覆盖另一个。低位变量在元素在此会被隐藏。\n\
    \n例如，你的低位变量可以名为 theta，高位变量名为 beta。当 theta 能够覆盖高位变量时，它会隐藏 beta 中所有的元素。但仅仅因为被隐藏变量的元素被隐藏了，并不意味着它们无法工作。它们运行得很好。通常隐藏它们是为了不需要显示长度。\n\
    \n你可能出于几个原因想这样做。一些程序员喜欢在将几个元素组合成新子类之前使用它。这可以节省大量时间；你不需要在这个过程中重写它们中的每一个。两者的元素都将具有完整的功能，因此你可以同时使用它们，但你可以将它们结合，并在你尝试创建的新子类中进行更改。\n\
    \n有时隐藏高位变量的长度也是件好事。当你操作计算机语言时，在长度方面需要对你的操作小心，否则可能会减慢整个系统。隐藏技术将帮助防止这些问题的发生，并让你的整个程序运行得快一点。\n\
    \n如你所见，在编写自己的程序时，你可以做非常多的事情。虽然我们在本书中讨论了许多不同的内容，但继承可能是最有用的部分之一。它允许你在组合各种事物的同时获取你所需的所有力量。它允许你在混合和匹配事物的同时获得你所需的所有能力。\n\
    \n## 在 Java 中可以做的一些其他事情\n\n## 对象的类、对象和方法\n\n在 Java 中，你可以做的另一件与继承相关的另一件操作是隐藏。这是一种处理两个命名相似且作用域重叠变量的技术。它需要一个高位变量和一个低位变量，因为其中一个变量将覆盖另一个。低位变量的元素在此过程中会被隐藏。\n\
    \n例如，你的低位变量可以名为 theta，高位变量名为 beta。当 theta 能够覆盖高位变量时，它会隐藏 beta 中所有的元素。但仅仅因为被隐藏变量的元素被隐藏了，并不意味着它们无法工作。它们运行得很好。通常隐藏它们是为了不需要显示长度。\n\
    \n你可能出于几个原因想这样做。一些程序员喜欢在将几个元素组合成新子类之前使用它。这可以节省大量时间；你不需要在这个过程中重写它们中的每一个。两者的元素都将具有完整的功能，因此你可以同时使用它们，但你可以将它们结合，并在你尝试创建的新子类中进行更改。\n\
    \n有时隐藏高位变量的长度也是件好事。当你操作计算机语言时，在长度方面需要对你的操作小心，否则可能会减慢整个系统。隐藏技术将帮助防止这些问题的发生，并让你的整个程序运行得快一点。\n\
    \n如你所见，在编写自己的程序时，你可以做非常多的事情。虽然我们在本书中讨论了许多不同的内容，但继承可能是最有用的部分之一。它允许你在组合和匹配各种事物的同时获取你所需的所有力量。它允许你在混合和匹配事物的同时获得你所需的所有能力。\n\
    \n## 在 Java 中可以做的一些其他事情\n\n## 对象的类、对象和方法\n\n在 Java 中工作时，对象是具有行为和状态的组件。你可以有一个球，并注意状态是颜色、跳动方式和大小，而行为则是滚动和跳动。类语法的良好示例如下：\n\
    \n```\npublic class Horse {\n    String color;\n    int age;\n    String breed;\n\
    \n    void lame() {\n}\n    void happy(){\n}\n    void lazy(){\n}\n}\n```\n\n\
    为了让代码正常工作，你需要了解以下部分的含义，当你编写方法时：\n\n```\n修饰符 返回类型 方法名(参数列表) {\n  // 方法体\n}\n```\n\
    \n### 修饰符（Modifiers）\n\n这些是可选的修饰符，用于告诉编译器如何调用方法。访问类型应如下定义。\n\n### 返回类型（Return\
    \ type）\n\n这是显示方法的某些返回值。返回值类型将定义为方法返回的数据类型。某些操作不需要返回值，你需要使用 `void` 关键字。\n\n###\
    \ 方法名（Method name）\n\n这是方法的实际名称。方法列表和方法名是组成方法签名的两个项。\n\n## 仅仅操作类和对象\n\n当你在 Java\
    \ 中工作时，这些是组合在一起的。你可以使用 `System.out.println` 命令来显示在屏幕上的语句。\n\n你会有许多类型的变量可以放在类中，以对代码产生一些差异，包括：\n\
    \n- 局部变量（Local variables）：这些是定义在构造函数、代码块或方法中的变量。该变量在方法内部声明并初始化。当优选方法完成后，该变量将被销毁。\n\
    - 实例变量（Instance variables）：这些是在类内部找到的变量，但在你建立的方法之外。它们在类加载时实例化，并可以在该类中的任何构造函数、代码块或方法中访问。\n\
    - 类变量（Class variables）：类变量是在特定类内部、方法外部，使用 `static` 关键字声明的。\n\n## 异常处理\n\n在很多情况下，你需要在代码中使用异常处理以确保安全。你必须使用\
    \ `catch` 和 `try` 关键字来处理代码中的异常处理。你可以将这些放置在想要生成异常的代码周围，或者可以将它们放在任何你想要保护的代码周围。\n\
    \n"
