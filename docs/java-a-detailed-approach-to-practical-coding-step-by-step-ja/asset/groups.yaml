    \n虽然你可能不喜欢程序在用户输入错误数字时结束，但这就是该语句的运行方式。我们稍后会探讨一下如果你希望在用户输入你的代码最初未接受的数字时提供几个备选项，你可以做什么。\n\
    \n假设你想为投票的人编写代码。你可以编写代码，使其包含几种变体。用户将看到的问题是“你的年龄是多少？”他们可以输入他们想要的任何数字，因为这只是他们的年龄。但你需要设置程序以特定的方式做出响应。\n\
    \n你可能选择只在人大于 18 岁时显示一条消息。你需要在代码中使用 `>=18` 符号，然后添加你想要的消息。例如，如果某人的年龄设为 35 岁，程序可以提供“恭喜！你可以参加！”的语句，然后进入你代码的下一次部分。另一方面，如果用户输入的年龄是\
    \ 16 岁，程序将结束，或者移动到你想在程序中显示的下一个内容。\n\n# if...else 语句\n\n现在，有了上面的选项，你将只有一个真或假的答案。如果根据你输入程序中的内容答案为真，你将获得放置在代码内部的语句。但如果根据你输入代码中的内容答案为假，你什么也得不到。\n\
    \n这对于大多数人来说并不适用。你不希望你的代码在答案变为假后就放弃。在大多数情况下，你希望无论某人的回答是否在某个年龄范围内都显示一条消息。\n\n让我们看看上面那个例子。假设某人回答说他们\
    \ 16 岁。你仍然希望为回答这个年龄的人在代码中显示一些其他内容。你可以使用 `if...else` 子句来确保第一个语句不是真结束（人不是 18 岁或以上，因此第一个语句为假），代码将移动到你提供的第二个语句。你可以选择像“对不起，你目前没有参加资格。请稍试。”之类的。\n\
    \n因此，通过 `if...else` 语句，如果人是 18 岁或以上，他们将获得你写的原始消息。但如果他们输入的数字低于 18 岁，他们将获得我们刚刚讨论的第二条消息。这仍然基于真和假的概念，但它允许程序无论收到什么答案都能显示示例。\n\
    \n你可以随心所欲地使用 `if...else` 语句。你可以编写许多你需要的此类语句。如果你想将人分成几个不同的组，这很有帮助。假设你想分三组：一组喜欢猫的，一组喜欢狗的，另一组两个都喜欢。你可以在屏幕上列出所有这些选择并允许用户挑选。你可以根据收到的答案添加你想要显示的语句。\n\
    \n在 JavaScript 代码中，你可以使用的 `if...else` 语句数量没有限制。你拥有控制权，所以根据你的想法选择尽可能多的选项，以实现你对这段特定代码的想法。\n\
    \n# switch 语句\n\n另一种你可以使用的选项是 `switch` 语句。它允许你根据一组已知值对变量进行测试。这种测试被称为 `case`。一个示例如下：\n\
    \n```javascript\nswitch(expression){\n  case value:\n    //Statements\n    Break;\
    \ //\n  case value:\n    //Statements\n    Break; //\n  Default:\n    //Statements\n\
    }\n```\n\n在很多情况下，你都会需要使用 `switch` 语句和 `if` 语句来为程序添加更多定义。你可以测试几次以感受它们是如何运作的。\n\n\
    # 继承（Inheritance）\n\n当你编写代码时，继承非常有用。它们允许你从现有的类中提取功能并转移到新类中。你也可以对它们进行更改。\n\n例如，如果你将类\
    \ A 的所有元素转移到类 B，你将仍然拥有这两个类。它们中的任何一个都不会消失。在开始时你简单有两个类，尽管大多数使用继承的人都想修改类 B，同时保留类\
    \ A 的原始特征。\n\n在处理这类问题时，记住类 A 被视为原始类，而类 B 被称为子类，以保持顺序。一旦执行了继承，第一个类的元素现在可能出现在另一个类中，但你仍然可以追溯回类\
    \ A。\n\n# 继承后的概念\n\n大部分情况下，当你查看编程书籍时，它们只是讨论继承是元素具有共同属性的能力。它还将强调这些元素具有某些独特特征，这些特征正是允许新类脱颖出的原因。\n\
    \n"
