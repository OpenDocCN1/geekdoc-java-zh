    ```


    # 逻辑运算符


    这些是可以选择的非常基础的运算符。它们基本上是可以之间持有 10 到 20 个变量的项目。


    # 比较运算符


    这些运算符将进行不同的比较，以确定语句是否为真，以及当语句为真或为假时程序应该做什么。你在 Java 程序中使用的某些比较运算符包括：


    - (==)—当操作数相等时，条件求值为真。

    - (<>)—如果值不相等，条件将变为真。

    - (!=)—如果两个操作数的值不相等，条件将变为真。

    - (<)—如果左侧的操作数的值小于右侧的操作数，条件将变为真。

    - (>=)—如果左侧的值大于右侧的操作数，条件将变为真。

    - (<)—如果左侧的操作数小于右侧的操作数，条件将变为真。

    - (>)—如果左侧的操作数大于右侧的操作数，条件为真。


    正如你所看到的，当运算符设置良好时，你可以用它们做很多不同的操作。你将执行基础算术方程，判断语句是真是假，以及更多操作。你应该花些时间练习这些其中的一些选项，看看它们是如何工作的，并获得经验！


    使用 Java 创建新代码时，你可以做的事情非常多。你可以组合 Java 中的一些基础类来创建你完全切想要的代码，添加更多内容，移除某些内容，并将其变为你自己的专属。


    # 引用类型与原始类型


    在处理 Java 工作时，有几种不同的数据类型。我们已经讨论过 Java 中的独立或原始数据类型，但也有引用类型，这些类型也可以属于不同的类别。虽然它们略有不同，但你仍然需要它们由原始数据支持。


    虽然原始类型可以独立存在，但引用数据类型可以执行一些操作，可以让程序运行得更好，你发现在程序运行良好程度方面会有巨大的差异。你可以使用这些中的几种不同类型，让我们来看看它们并学习它们是如何工作的。


    # 用户数据报协议


    用户数据报协议（UDP）是一种无连接的协议。它是一个可靠的数据报流（等一下，UDP 实际上是不可靠的）。它是一种面向消息、无连接的传输层协议。它是互联网协议族的一部分。它首次在
    1980 年的 RFC 768 中规定。它用于建立实时应用，如 DNS、VoIP、IP 电话和流控制协议（SCMP）。


    UDP 是一种数据报协议。与 TCP 不同，它不提供可靠交付、流量控制或拥塞控制。它用于速度比可靠性更重要的应用程序，如在线游戏、流媒体和视频会议。它不提供排序或丢失段的重传。


    UDP 的某些特性包括：

    - 无连接

    - 低开销

    - 无流量控制

    - 无拥塞控制

    - 支持广播和多播


    # 传输控制协议


    传输控制协议（TCP）是一种面向连接、可靠的全双工流协议。它在应用程序之间提供可靠有序字节流。它是互联网协议族的一部分。它用于需要数据完整性和可靠性的应用程序，如网页浏览（HTTP）、文件传输（FTP）和电子邮件（SMTP）。


    TCP 的特性包括：

    - 面向连接

    - 可靠交付

    - 流量控制

    - 拥塞控制

    - 错误检查


    # 地址解析协议


    正如你从名称中能得到的那样，这是一种电信协议，可以让网站和应用程序轻松地通信。它用于帮助映射网络地址，并使视频通话和其他消息成为可能。许多优秀的技术都会使用这种协议，包括
    IPv4、Xerox PARC Universal数据包、ChaosNet 和 DEC Net。


