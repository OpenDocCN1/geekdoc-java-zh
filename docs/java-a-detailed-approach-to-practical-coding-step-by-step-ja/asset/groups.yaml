    现在我们想要制作页面。人们来到页面是为了学习某些东西，弄清楚你对他们来说重要的信息。在你写的所有标题下面，你希望确保至少有一或两行来帮助进一步解释。以下你可以如何操作的示例包括：


    ```html

    <head>

    <body>


    <h1>Welcome to the Web!</h1>


    <p>My page</p>

    </body>

    </head>

    ```


    ![](img/1828c1db8ce294396b0b5220_36.png)


    ## 段落


    当然，当你编写代码时，你并不只想要几个标题和页面的标题。人们来到页面是为了学习某些东西，弄清楚你对他们来说重要的信息。在你写的所有标题下面，你希望确保至少有一或两行来帮助进一步解释。


    在你的代码中编写段落，你只需要使用`<p>` 和 `</p>` 符号来指示何时开始和何时结束。你可以在这些符号中编写任何你想的内容。有时它只是几行或一个短段落，而有时它会很长，像页面一样。段落的长度没有限制，只要确保它们有正确的符号包裹即可。


