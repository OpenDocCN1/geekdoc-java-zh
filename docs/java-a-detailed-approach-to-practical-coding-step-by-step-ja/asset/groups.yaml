  mdcn: "\n\n# Throws/Throw 关键字\n\n每当你有一个没有在方法中某种方式处理的检查异常（checked exception）时，你就需要使用\
    \ `throws` 关键字对其进行声明。这将会出现在方法签名的最后末尾。\n\n另一方面，如果你有一个新实例化的异常，或者是一个刚刚捕获的异常，你将可以使用\
    \ `throw` 关键字来抛出它。这将帮助你在代码中做出一些区分。尝试使用一下这两个关键字，以便你学习它们在代码中使用会有何细微的区别。\n\n# Finally\
    \ 关键字\n\n接下来，我们将查看 `finally` 关键字。当你有一段将在 `try` 块之后执行的代码时，你就需要使用 `finally` 关键字。即使在没有发生异常的情况下情况也是如此。这是一个非常值得学习的概念，因为\
    \ `finally` 块允许运行清理语句，使代码看起来更良好并准时结束，即使你周围有一些保护代码。你可能想要用于 `finally` 关键字的语法包括：\n\
    \n```\ntry\n{\n    //Protected code\n}catch(ExceptionType1 e1)\n{\n    //Catch\
    \ block\n}catch(ExceptionType2 e2)\n{\n    //Catch block\n}catch(ExceptionType3\
    \ e3)\n{\n    //Catch block\n}finallyfinally\n{\n    //The finally block always\
    \ executes\n}\n```\n\n学习如何使用代码中的对象、类和方法将帮助你定义 Java 代码中的某些行为。但有时你会发现自己正试图在代码中放入过多的内容。在编写\
    \ Java 程序时，并不是越多越好，因此在需要时测试几次代码并在必要时进行调整是一个好主意。但总的来说，你会发现与 Java 中的方法、类和对象进行工作可以为你的代码增添光彩，并为你开启许多你能够创造的新事物。\n\
    \n# 结语\n\n感谢你读完《Java：实用编程的详细方法》（Java: A Detailed Approach to Practical Coding），希望它能为你提供见解，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\
    \n下一步是开始学习你的新编程语言。我们花费了大量时间研究这门编程语言，以及你将如何能够创建你自己的网站和其他优秀的程序，无论你是编程新手，还是已经用过其他编程语言并想开始学习\
    \ Java。\n\n虽然有很多优秀的编程语言可以学习，但如果你正在创建自己的网站，Java 是你可以选择的最优秀的语言之一。搭建好这一切不会花费太长时间，一旦你写出页面上想要显示的信息，并挑选出最适合你的连接方式，你会发现这是编写网页最容易的语言之一。\n\
    \n如果你对整个体验完全是新手，你不必害怕编程。你只需要知道如何让它运行并学习一些语法。Java 足够简单，即使是初学者也能精通，你将享受在短时间内让你的网站和其他网络内容运行起来的轻松感。\n\
    \n最后，如果你发现这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon 上的评价！\n\n# 关于作者\n\nNathan Clark 是一位资深程序员，在软件行业拥有近\
    \ 20 年的经验。\n\n他拥有麻省理工学院（MIT）的硕士学位，曾任职美国一些领先的软件公司，并积累了在软件设计和开发方面的丰富知识。\n\nNathan\
    \ 和他的妻子 Sarah 于 2009 年创立了自己的开发公司，以便能够承担更多更具挑战性和创造性的项目。今天，他们为来自世界各地的高标准客户提供服务。\n\
    \nNathan 喜欢通过他的系列书籍分享编程知识，为客户开发创新的软件解决方案，并在空闲时间看经典的科幻电影。\n\n想要向专家学习编程，请关注书店和网上更多\
    \ Nathan 的著作。\n\n"
