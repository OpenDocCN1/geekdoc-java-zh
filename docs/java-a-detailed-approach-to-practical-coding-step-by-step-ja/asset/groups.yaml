    # What are the Benefits?


    There are quite a few benefits that you can get when you go with Java as your
    programming language including:


    # It is portable


    The developers of Java wanted to make sure that Java would work on as many of
    the platforms as it could. This would make it easier for the developers who used
    Java because they were able to write the code once and it would work on any platform
    that reads the Java code.


    # It is safe and secure


    In our modern world, safety and security are important. You need to make sure
    that while creating a new program that the user is going to know their information
    is safe and won''t be intercepted.


    # People can connect quickly


    Java is designed to use simple wording and phrases so that the developer is able
    to connect with it quickly. This makes it easier for them to learn the language,
    even though it may look difficult in the beginning, and they will be writing their
    codes in no time.


    # There are a lot of features


    You will find that the Java code is going to have a lot of the features that you
    are looking for. It is easy to make modifications to when you need, it can work
    with threads, and it is one of the dynamic programming languages.


    # It should work well


    No one wants to work hard on a code and then find out that it is slow or that
    when you try to execute it, there is something wrong. Java is a really precise
    code that is easy to use, and you will get the results that you want each time.


    Because of all these great benefits, many developers, both those who had been
    working in coding for some time and those who just wanted to get started for the
    first time, choose to go with Java for their coding needs. It is easy to use,
    it is precise, and the coding language is not one that is difficult to learn and
    understand.'
  - '[PAGE 9]


    # Drawbacks of Java


    There are a few drawbacks that do come with Java, which is why some people will
    choose to go with other another coding language in order to get their work done.
    Some of the issues that you are going to find include:


    # Applet limitations


    These are there because of the current security model that is placed on Java.
    You are going to have trouble getting local data. You are only able to get the
    data from the site where the applet is located, and you can''t make system calls.
    You can bring in other applications to make this bit easier to handle.


    # Slower


    This program is a bit slower than some of the other coding languages, but there
    have been some changes done to the later versions that help to speed this up a
    bit. It is a little less optimized and will take more time to get the apps to
    download.


    # Takes up more memory


    Unlike some of the other programming languages such as C++ and C, which can take
    a little bit more time to get the apps to download.


    # It is just a single paradigm language


    This is mainly a single paradigm language, although some of the newer versions
    are changing over to the procedural paradigm to make this issue go away a bit.


    Overall, Java is a great program that you are going to be able to use in order
    to get the code written. You are going to love how easy it is to use this program
    and all the great codes that you are going to be able to write to make your website
    look amazing!'
  - '[PAGE 10]


    # Performance


    In the beginning, Java was a slower program, mostly because the programs that
    were created to go with it needed more memory than those that were developed for
    the other programming languages, such as C+. However, the makers of Java have
    worked on this in order to improve the speed and with it becoming an open sourced
    language, there are more improvements being made to this programming language
    all the time.'
  - '[PAGE 11]


    # Syntax


    The syntax is Java is important to making sure that the interpreter is going to
    understand what you want to work on. The first thing to keep in mind is that when
    you write out a file in this language, you will need to save it as .java and the
    child pages should be saved as .class. If you would like to make sure that the
    child page or any of the classes are private, you will simply need to save that
    in the same Java folder and it is all good. If you save it in its own folder,
    other will have some access to it.


    So how do you decide if you want the child page to be accessed? If the program
    is still in the developmental stages, you will want to keep it as private so that
    you are able to keep working on it, you will probably need to keep it private.
    But once you are ready for the program to be used by other people and users, you
    should consider moving the child page out of private so that the users are able
    to access it.


    Some examples of the lines that you would use with this Java programming language
    include:


    ```

    Program HiWorld (

    Public static.void (

    System out PrintIn.HiWorld

    )

    )

    ```'
  - '[PAGE 12]


    # Memory


    In the beginning, the memory in Java was quite a bit slower, especially when it
    was compared to some of the other programming languages that there were. Issues
    with memory, in the beginning, made the program take longer to load for the user
    and it was not user-friendly on some platforms. This is because the Java language
    used memory bit differently than some of the others, but this has been changed
    in the later versions to make it easier to get the speed and the memory function
    that you need.


