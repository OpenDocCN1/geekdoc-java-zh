    # 重要通知


    请注意，这是《逐步 Java》系列中的第 2 本。这本书可以作为独立书籍来阅读，但为了获得该系列的最大价值，强烈建议先阅读：


    《Java：初学者的编程基础》（Nathan Clark 著）


    # 引言


    祝喜购买《Java：实用编码的详细方法》，感谢您的支持。


    接下来的章节将讨论你开启使用 Java 作为编程语言的旅程时所需的所有知识。你可以选择许多不同的语言，但当你尝试组装网页时，无论你正在组装的是哪种页面，Java
    都是最好用的语言之一。它将帮助你制作标题、编写段落，并在需要时添加链接和图片。


    本指南将向你展示如何设计你自己的页面，以及在使用这种编程语言时可以做的一些酷炫功能。我们假设你过去对 Java 有一点经验，可能只是刚开始用它编写一些基础代码，然后我们将进入此程序内部更复杂的代码和选项。


    本指南将帮助你编写属于你自己的代码，如果你选择的话，甚至可以让你编写你自己的网页成为可能。虽然你可以在编码中添加许多很棒的东西，但本指南将向你展示如何做最棒的事情，例如记录信息、添加指向你编写的其他页面或其他网站的链接、添加表单等。


    无论你只是刚开始编写此所需的某些代码，还是已经有编码经验但想进入使用 Java 编写自己网站的世界，本指南都将是你所需的工具。


    市场上有很多关于这个主题的书，再次感谢你选择这一本！我们已尽全力确保它包含尽可能多的有用信息，请尽情享受！


    # Java 入门


    虽然用 Java 编程语言可以很多事情，但你首先应该理解的是它是一门面向对象的编程语言。这基本上意味着它更容易理解；许多新语言转到 OOP（面向对象编程）是因为它更容易使用，并且防止在编码时出现混淆和其他问题。Java
    也是一种通用语言，因为软件开发人员希望有一种他们创建一次，然后在许多不同平台上运行的编程语言。


    该程序使用了 C++ 和 C# 的一些相同特性，但对它们进行了微调，使其更容易使用，同时又不必牺牲编程语言的性能和速度。Java 的核心在于保持简单并能够在各种不同的平台上运行，使其成为最完美的编码语言。


    # Java 的一些基础知识


    首先，让我们看看 Java 到底。Java 是一种为了帮助在你的计算机上创建各种应用程序而开发的编程语言。用户开发需要运行环境的程序并不罕见，你可能已经在计算机上安装了它。也可以作为计算机上的插件，在这些地方运行这些程序。


    重要的是，Java 和 JavaScript 不是同一种语言，除了名称之外，它们并不相似。例如，JavaScript 将用于与 HTML 文档配合的网页，而不是用于独立应用程序。这有时会让人困惑，因为
    Java 能够在浏览器中运行，但它们之间存在差异。首先，你会发现许多类型的网站使用 JavaScript，而 Java 则更进一步。


    在计算机上下载 Java 程序是免费的，而且不需要太长时间。事实上，许多系统已经下载了它以方便操作。但对于还没有 Java 的计算机，你应该采取几个简单的步骤。安装你的程序需要的一些操作包括：


    - 安装 JDK——你需要它来使用开发 Java 应用的工具。你可以在安装 Java 的同时安装它，既快速又简单。

    - 选择你的 IDE——这是你使用 Java 工作的地方。它允许你构建代码并查看显示效果。你可以选择几种，但对于初学者来说，NetBeans 是一个非常有帮助的选择。

    - 一旦完成这些操作，你就可以开始编写程序了。这些程序很容易安装，只需几分钟，你不必担心它们会在你的程序中占用过多空间。从一个 Hello World 程序是最好的方法，如果你想熟悉这种语言以及你所选择的环境。


    '
