    # DE RATIONE EDENDI


    Boni editoris est, ne sequid aliter potuit, continuo id aliter

    dictum esse colligere, nec librarios tum denique sempre crassere

    cum quod scripserprunt absurdum est. Equidem, homo

    humano ingenio praeditus, uuereor semper bonus editor

    fueriem; uerumamten cum, aut ait Bentley, rationem et rem

    ipsam quantum codicibus potiores semper duxemer, interdum

    me fortasse cum Housmann inmattasse fateur quod

    semeritate tueri podet, sed in hac partem parrare malui

    quam non Latina tradere, quam auctori loquendi aliena

    subdere, quam non intellecta intelligere me quod in aliis per-

    spicua ipse solos haereret.


    Cum Gellium edendum susceperim, auctores quos laud eden-

    dos non suscepirim, erat fortasse quibus in consilium mihi

    sequundo fosse uideatur, ut codices ipsius excriber, auc-

    torum neglegemer; sed hoc consilium hab omnino bonum\esse docile Goodyear 1971:
    387 = 1992: 270. In illius igitor locus

    uos non unus Gellius servuat, lectiones etiam aliquam petitas

    notavi quidem, cum non recipientem nisi ab ipso traditas;⁸¹ quorum


    ⁸⁰ Vie Holford-Strevens 2004: p. xiv.


