  \ 构造函数。这是为了避免在计算中引入不准确的值 [Bloch05, Puzzle 2]：\n\n如果你运行该程序，你会发现你能够买起三颗糖果，并且剩下 `$0.3999999999999999`。这是错误的答案！解决这个问题的正确方法是在货币计算中使用\
  \ `BigDecimal`、`int` 或 `long`。\n\n在这个例子中，使用了 `BigDecimal` 的 `String` 构造函数而不是它的 `double`\
  \ 构造函数。这是为了避免在计算中引入不准确的值 [Bloch05, Puzzle 2]：\n\n如果你运行该程序，你会发现你能够买起三颗糖果，并且剩下 `$0.3999999999999999`。这是错误的答案！解决这个问题的正确方法是在货币计算中使用\
  \ `BigDecimal`、`int` 或 `long`。\n\n### 第 61 项：优先使用基本类型而非包装类型\n\nJava 有一个两部分的类型系统，由基本类型（如\
  \ `int`、`double` 和 `boolean`）和引用类型（如 `String` 和 `List`）组成。每个基本类型都有一个对应的引用类型，称为包装类型。`int`、`double`\
  \ 和 `boolean` 对应的包装类型是 `Integer`、`Double` 和 `Boolean`。\n\n正如第 6 项所示，自动装箱和自动拆箱模糊了但消除基本类型和包装类型之间的区别。它们之间存在真实的差异，重要的是你要意识到正在使用哪种类型并在它们之间做出仔细选择。\n\
  \n基本类型和包装类型之间三个三个区别。首先，基本类型只有值，而包装类型具有与这些值不同的身份。也就是说，两个包装类型实例可以具有相同的值但不同的身份。其次，基本类型只有完全功能的值，而每个基本类型除了所有对应基本类型的功能值外，还有一个非功能值，即\
  \ `null`。最后，基本类型在时间和空间上都比包装类型更高效。如果你不小心，这三个差异都可能让你陷入麻烦。\n\n考虑以下比较器，它设计用于表示 `Integer`\
  \ 值的升序数值。（记住比较器的 `compare` 方法返回一个负数、零或正数，取决于第一个参数是否小于、等于或大于第二个参数）。在实践中，你不需要编写这个比较器，因为它实现了\
  \ `Integer` 的自然排序，但它是一个非常有趣的例子：\n\n```java\n// 错误的比较器 - 你能发现缺陷吗？\n\nComparator<Integer>\
  \ naturalOrder =\n```\n\n\n\n\n```java\n(i, j) -> (i < j) ? -1 : (i == j ? 0 : 1);\n\
  ```\n\n这个比较器看起来似乎可以工作，并且能够通过许多测试。例如，它可以与 `Collections.sort` 使用来正确地对一个包含百万个元素的列表，无论该列表是否包含重复元素。但这个比较器存在严重的缺陷。为了让自己确信这一点，只需打印\
  \ `naturalOrder.compare(new Integer(42), new Integer(42))` 的值即可。两个 `Integer` 实例代表相同的值\
  \ (42)，所以该表达式的值应该是 0，但结果却是 1，这表明第一个 `Integer` 值大于第二个！\n\n那么问题出在哪里呢？`naturalOrder`\
  \ 中的第一个测试运行正常。评估表达式 `i < j` 会导致 `i` 和 `j` 所引用的 `Integer` 实例被自动拆箱（auto-unboxed）；即提取出它们的原始类型值。求值过程继续检查生成的\
  \ `int` 值中的第一个是否小于第二个。但假设情况并非如此。那么接下来的测试将评估表达式 `i==j`，它会对两个对象引用进行身份比较（identity comparison）。如果\
  \ `i` 和 `j` 指向代表相同 `int` 值的不同 `Integer` 实例，则比较将返回 `false`，比较器将错误地返回 1，指示第一个 `Integer`\
  \ 值大于第二个。在包装的原始类型上应用 `==` 运算符几乎总是错误的。\n\n在实践中，如果你需要一个比较器来描述类型的自然顺序，你应该简单地调用 `Comparator.naturalOrder()`；如果你自己编写比较器，则应该使用比较器的构造方法，或者原始类型上的静态\
  \ `compare` 方法（第 14 节）。尽管如此，你可以通过在损坏的比较器中添加两个局部变量来存储与包装的 `Integer` 参数对应的原始 `int`\
  \ 值，并对这些变量执行所有比较来修复该问题。这避免了错误的身份比较：\n\n点击此处查看代码图片\n\n```java\nComparator<Integer>\
  \ naturalOrder = (iBoxed, jBoxed) -> {\n    int i = iBoxed, j = jBoxed; // 自动拆箱\n\
  \    return i < j ? -1 : (i == j ? 0 : 1);\n};\n```\n\n接下来，考虑这个有趣的短程序：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Unbelievable {\n    static Integer i;\n    public static\
  \ void main(String[] args) {\n        if (i == 42)\n            System.out.println(\"\
  Unbelievable\");\n    }\n}\n```\n\n不，它并没有打印 `Unbelievable`——但它的所做几乎同样奇怪。在评估表达式 `i==42`\
  \ 时，它抛出了 `NullPointerException`。问题在于 `i` 是一个 `Integer` 而不是 `int`，和所有非常量对象引用字段一样，它的初始值为\
  \ `null`。当程序评估表达式 `i==42` 时，它正在将一个 `Integer` 与一个 `int` 进行比较。在操作中混合原始类型和包装原始类型的几乎大多数情况下，包装的原始类型都会被自动拆箱。如果空对象引用被自动拆箱，就会得到\
  \ `NullPointerException`。正如这个程序所示，这种情况几乎可以发生在任何地方。修复这个问题只需要将 `i` 声明为 `int` 而不是 `Integer`即可。\n\
  \n最后，考虑来自 第 6 节 第 24 页的程序：\n\n点击此处查看代码图片\n\n```java\n// 极其缓慢的程序！你能发现对象的创建在哪里吗？\n\
  public static void main(String[] args) {\n    Long sum = 0L;\n    for (long i =\
  \ 0; i < Integer.MAX_VALUE; i++) {\n        sum += i;\n    }\n    System.out.println(sum);\n\
  }\n```\n\n这个程序比应该的慢得多，因为它意外地将一个局部变量（`sum`）声明为包装原始类型 `Long` 而不是原始类型 `long`。程序编译时没有错误或警告，但变量被反复箱和拆箱，导致了观察到的性能下降。\n\
  \n在本节讨论的三个程序中，问题是相同的：程序员忽略了原始类型与包装原始类型之间的区别并承担了后果。在前两个程序中，后果是完全失败；在第三个程序中，则是严重的性能问题。\n\
  \n那么，什么时候应该使用包装原始类型呢？它们有几个合法的用途。第一个是作为集合中的元素、键和值。你不能将原始类型放入集合中，所以你被迫使用包装原始类型。这是一个更通用情况的特例。你必须在泛型类型和方法中使用包装原始类型作为类型参数（第\
  \ 5 章），因为语言不允许你使用原始类型。例如，你不能声明一个类型为 `ThreadLocal<int>` 的变量，所以你必须使用 `ThreadLocal<Integer>`。最后，在进行反射方法调用时，必须使用包装原始类型（第\
  \ 65 节）。\n\n总结来说，只要你有选择，就优先使用原始类型而不是包装原始类型。原始类型更简单更快速。如果你必须使用包装原始类型，请小心！自动装箱减少了使用包装原始类型的冗长性，但并没有消除其危险。当你的程序用\
  \ `==` 比较两个包装类型时，它是身份比较，这通常不是你想要的。当你的程序涉及包装和原始类型的混合运算时，它会进行拆箱，而当你的程序进行拆箱时，可能会抛出\
  \ `NullPointerException`。最后，当你的程序进行装箱时，会导致昂贵且必要的对象创建。\n\n### 第 62 节：在有合适类型的地方避免字符串\n\
  \n字符串设计用于表示文本，并且在这方面做得很好。由于字符串非常常见且受到语言良好支持，人们倾向于将其用于设计目的之外的地方。本节讨论了一些你不应该对字符串做的事情。\n\
  \n#### 字符串不是其他类型的良好替代\n当数据从文件、网络或键盘输入进入程序时，通常是字符串形式。人们倾向于保持这种状态，但这种倾向只有在数据确实是文本性质时才是合理的。如果是数值，它应该转换为相应的数值类型，如\
  \ `int`、`float` 或 `BigInteger`。如果是是否问题的答案，应该转换为相应的枚举类型或 `boolean`。更通用地说，如果有合适的值类型（无论是原始类型还是对象引用），你应该使用它；如果没有，你应该写一个。虽然这个建议似乎显而易见，但经常被违反。\n\
  \n#### 字符串不是枚举类型的良好替代\n正如在第 34 节 中讨论的，枚举比字符串更好地充当枚举类型常量。\n\n#### 字符串不是聚合类型的良好替代\n\
  如果一个实体有多个组件，将其表示为单个字符串通常是一个坏主意。例如，这里有一行来自真实系统的代码——标识符名称已更改以保护隐私：\n\n点击此处查看代码图片\n\
  \n```java\n// 不恰当字符串字符串聚合类型\nString compoundKey = className + \"#\" + i.next();\n\
  ```\n\n这种方法有很多缺点。如果用于分隔字段的字符出现在某个字段中，可能会导致混乱。为了访问单个字段，必须解析字符串，这既慢又麻烦且容易出错。你无法提供\
  \ `equals`、`toString` 或 `compareTo` 方法，只能接受 `String` 提供的行为。更好的方法是简单的写一个类来表示聚合类型，通常是一个私有的静态成员类（第\
  \ 24 节）。\n\n\n\n\n字符串并不是能力的拙劣替代品。\n\n有时，字符串被用于授予某些功能的访问权限。例如，考虑一个线程局部变量（thread-local\
  \ variable）设施的设计。这种设施为每个线程提供了其自有的值的变量。Java 库从 1.2 版本发布起就有了线程局部变量设施，那之前，程序员必须自己实现。在许多年前，面对设计此类设施的任务时，几个人独立地提出了相同的设计，这种设计使用客户端提供的字符串键（string\
  \ keys）来标识每个线程局部变量：\n\n点击此处查看代码图片\n\n```java\n// 错误 - 不恰当将字符串用作能力！\n\npublic class\
  \ ThreadLocal {\n\n    private ThreadLocal() { } // 不可实例化\n\n    // 为命名变量设置当前线程的值。\n\
  \    public static void set(String key, Object value);\n\n    // 返回命名变量的当前线程值。\n\
  \    public static Object get(String key);\n}\n```\n\n这种方法的问题在于，字符串键代表了线程局部变量的共享全局命名命名空间。为了使这种方法生效，客户端提供的字符串键必须是唯一的：如果两个客户端独立地决定为它们的线程局部变量使用相同的名称，它们就会无意中共享同一个变量，这通常会导致两个客户端都失败。此外，安全性也很差。恶意的客户端可能会刻意使用另一个客户端相同的字符串键，以非法访问另一个客户端的数据。\n\
  \n此 API 可以通过将字符串替换为不可伪造的键（有时称为*能力*，capability）来修复：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class ThreadLocal {\n\n    private ThreadLocal() { }     // 不可实例化\n    public\
  \ static class Key {     // (能力)\n        Key() { }\n    }\n\n    // 生成唯一的、不可伪造的键\n\
  \    public static Key getKey() {\n        return new Key();\n    }\n\n    public\
  \ static void set(Key key, Object value);\n\n    public static Object get(Key key);\n\
  }\n```\n\n虽然这解决了基于字符串的 API 的两个问题，但你还可以做得更好。你不再需要那些静态方法了。相反，它们可以变成键上的实例方法，此时，键不再是线程局部变量的键：它*本身*就是一个线程局部变量。在这一点上，顶层类已经不再为你做任何事情了，所以你大可以将其删除，并将嵌套类重命名为\
  \ `ThreadLocal`：\n\n点击此处查看代码图片\n\n```java\npublic final class ThreadLocal {\n\n\
  \    public ThreadLocal();\n    public void set(Object value);\n\n    public Object\
  \ get();\n}\n```\n\n这个 API 不是类型安全的，因为当你从线程局部变量中检索值时，必须从 `Object` 强制转换为其实际类型。让原始的基于\
  \ `String` 的 API 实现类型安全是不可能的，让基于 `Key` 的 API 类型安全也很困难，但通过使 `ThreadLocal` 成为参数化类（项目\
  \ 29），让这个 API 类型安全是非常简单的事：\n\n点击此处查看代码图片\n\n```java\npublic final class ThreadLocal<T>\
  \ {\n\n    public ThreadLocal();\n    public void set(T value);\n\n    public T\
  \ get();\n}\n```\n\n粗俗来说，这就是 `java.lang.ThreadLocal` 提供的 API。除了解决了基于字符串的 API 问题外，它比任何基于键的\
  \ API 都要更快、更优雅。\n\n总结来说，当存在更好的数据类型或可以编写更好的数据类型时，避免将对象表示为字符串的自然倾向。使用不当时，字符串比其他类型更笨重、不灵活、速度更慢且更容易出错。字符串经常被误用的类型包括基本类型类型、枚举和聚合类型。\n\
  \n### 项目 63: 警惕字符串拼接的性能\n\n字符串拼接运算符（`+`）是将几个字符串合并为一个字符串的方便方法。对于生成单行输出或构建小型固定大小对象的字符串表示，它是可以的，但它不具备扩展性。重复使用字符串拼接运算符来拼接\
  \ `n` 个字符串需要与 `n` 成二次关系的时间。这是由于字符串是*不可变*的（项目 17）的一个不幸后果。当两个字符串拼接时，两者的内容都会被复制。\n\n\
  例如，考虑这个方法，它通过重复拼接每个项目的行来构建账单语句的字符串表示：\n\n点击此处查看代码图片\n\n```java\n// 不恰当使用字符串拼接 -\
  \ 性能差！\npublic String statement() {\n    String result = \"\";\n    for (int i =\
  \ 0; i < numItems(); i++)\n        result += lineForItem(i); // 字符串拼接\n    return\
  \ result;\n}\n```\n\n如果项目数量很大，该方法的性能非常糟糕。为了达到可接受的性能，使用 `StringBuilder` 代替 `String`\
  \ 来存储构建中的语句：\n\n点击此处查看代码图片\n\n```java\npublic String statement() {\n    StringBuilder\
  \ b = new StringBuilder(numItems() * LINE_WIDTH);\n    for (int i = 0; i < numItems();\
  \ i++)\n        b.append(lineForItem(i));\n\n    return b.toString();\n}\n```\n\n\
  自 Java 6 以来在提高字符串拼接速度方面做了很多工作，但方法之间的差异仍然巨大：如果 `numItems` 返回 100 且 `line` 返回 80 个字符的字符串，第二种方法运行速度比第一种快\
  \ 6.5 倍。因为第一种方法与项目数量成二次关系，而第二种是线性的，随着项目数量增加，性能差异会变得更大。注意第二种方法预分配了足够容整个的 `StringBuilder`，消除了自动增长的需求。即使使用默认大小的\
  \ `StringBuilder`，它仍然比第一种方法快 5.5 倍。\n\n教训很简单：除非性能无关，否则不要使用字符串拼接运算符合并多个字符串。请使用 `StringBuilder`\
  \ 的 `append` 方法。或者，使用字符数组，逐个处理字符串而不是合并它们。\n\n### 项目 64: 通过接口引用对象\n\n项目 51 说你应该使用接口而不是类作为参数类型。更广泛地说，你应该倾向于使用接口而不是类来引用对象。如果存在合适的接口类型，那么参数、返回值、变量和字段都应该使用接口类型声明。你真正需要引用对象的类的时刻是在使用构造函数创建它时。为了具体化这一点，考虑\
  \ `LinkedHashSet` 的情况，它是 `Set` 接口的一种实现。养成输入这样的习惯：\n\n点击此处查看代码图片\n\n```java\n// 好\
  \ - 使用接口作为类型\nSet<Son> sonSet = new LinkedHashSet<>();\n```\n\n而不是这样的：\n\n点击此处查看代码图片\n\
  \n```java\n//  - 使用类作为类型！\nLinkedHashSet<Son> sonSet = new LinkedHashSet<>();\n\
  ```\n\n如果你养成使用接口作为类型的习惯，你的程序将灵活得多。如果你决定切换实现，你所做的只是更改构造函数中的类名（或使用不同的静态工厂）。例如，可以将第一个声明更改为读取：\n\
  \n点击此处查看代码图片\n\n```java\nSet<Son> sonSet = new HashSet<>();\n```\n\n并且所有的周围代码将继续工作。周围的代码感知不到旧的实现类型，因此它对变化无所知。\n\
  \n\n\n\n有一个需要注意：如果原始实现提供了某些接口通用合约未要求的特殊功能，且代码依赖于该功能，那么新实现提供相同的功能就至关重要。例如，如果第一个声明周围的代码依赖于\
  \ `LinkedHashSet` 的排序策略，那么在声明中使用 `HashSet` 替换 `LinkedHashSet` 就是不正确的，因为 `HashSet`\
  \ 不保证迭代顺序。\n\n那么，你为什么想要更改实现类型呢？因为第二种实现提供了比原始实现更好的性能，或者因为它提供了原始实现所欠缺的理想功能。例如，假设一个字段包含一个\
  \ `HashMap` 实例。将其更改为 `EnumMap` 将提供更好的性能，以及与键的自然顺序一致的迭代顺序，但只有当键类型为枚举类型时，你才能使用 `EnumMap`。将\
  \ `HashMap` 更改为 `LinkedHashMap` 将提供可预测的迭代顺序，且性能与 `HashMap` 相当，同时对键的类型没有特殊要求。\n\n\
  你可能认为使用其实现类型来声明变量是没问题的，因为你可以同时更改声明类型和实现类型，但无法保证这种更改会导致程序可以通过编译的。如果客户端代码使用了原始实现类型上的方法，而这些方法在其替换类型上不存在，或者客户端代码将实例传递给需要原始实现类型的方法，那么在进行更改后代码将无法编译。使用接口类型声明变量可以让你保持逻辑严谨性。\n\
  \n**如果没有合适的接口，那么通过类而不是接口来引用对象是完全恰的。** 例如，考虑值类，如 `String` 和 `BigInteger`。值类很少为了考虑多个实现而编写。它们通常是\
  \ `final` 的，且很少有相应的接口。将此类值类作为参数、变量、字段或返回类型是完全合适的。\n\n另一种没有合适接口类型的情况是属于某个框架的对象，该框架的基本类型是类而不是接口。如果一个对象属于这样一个基于类的框架，最好通过相关的基类（通常是抽象类）来引用它，而不是通过它的实现类。许多\
  \ `java.io` 类（如 `OutputStream`）都属于这一类。\n\n最后一种没有合适接口类型的情况是实现了接口但又提供了接口中不存在的额外方法的类——例如，`PriorityQueue`\
  \ 有一个 `comparator` 方法，而该方法在 `Queue` 接口中并不。只有当程序依赖这些额外方法时，才应该使用此类类来引用其实例，而这种情况应该是非常罕见的。\n\
  \n这三种情况并不是穷尽的，只是为了传达在何通过类引用对象是合适的情境。在实践中，一个给定对象是否具有合适的接口应该是显而易见的。如果有，使用接口来引用对象将使你的程序更具活性且优雅。**如果没有合适的接口，只需使用类层次结构中提供所需功能的最不具体的类即可。**\n\
  \n### 条目 65：优先使用接口而不是反射\n\n核心反射机制 `java.lang.reflect` 提供了对任意类的程序化访问。给定一个 `Class`\
  \ 对象，你可以获取 `Constructor`、`Method` 和 `Field` 实例，它们代表该 `Class` 实例所表示类的构造函数、方法和字段。这些对象提供了对类的成员名称、字段类型、方法签名等的程序化访问。\n\
  \n此外，`Constructor`、`Method` 和 `Field` 实例允许你通过反射操作它们的底层对应项：你可以通过调用 `Constructor`、`Method`\
  \ 和 `Field` 实例上的方法来构造实例、调用方法并访问底层的类及其字段。例如，`Method.invoke` 允许你调用任何类上任何对象的任何方法（受通常的安全约束限制）。反射允许一个类使用另一个类，即使后者在先者编译时还不存在。然而，这种力量是需要付出代价的：\n\
  \n- **你失去了所有编译时类型检查的优势，**包括异常检查。如果程序尝试通过反射调用一个不存在或不可访问的方法，它将在运行时失败，除非你采取了特殊的预防措施。\n\
  - **执行反射访问的代码是笨拙且冗长的。** 它写起来很枯燥，读起来很困难。\n- **性能会受影响。** 反射方法调用比普通方法调用要慢得多。具体慢多少很难说，因为有很多因素在起作用。在我的机器上，通过反射调用一个没有输入参数且返回\
  \ `int` 的方法比正常调用慢了十一倍。\n\n有少数复杂的应用需要反射。例如，代码分析工具和依赖注入框架。即使是这些工具最近也一直在逐渐远离反射，因为它的缺点变得越来越清晰。如果你对应用程序是否需要反射有任何疑问，那么它可能不需要。\n\
  \n**通过仅在非常有限的形式下反射，你可以在产生极少代价的同时获得反射的许多益处。** 对于许多必须使用编译时不可用的类的程序，在编译时存在一个合适的接口或超类可以引用该类（条目\
  \ 64）。如果是这种情况，你可以**通过反射创建实例并通过它们的接口或超类正常地访问它们。**\n\n例如，这里有一个程序创建一个 `Set<String>`\
  \ 实例，其类由第一个命令行参数指定。该程序将剩余的命令行参数插入集合并打印它。无论第一个参数是什么，程序都会打印去重后的剩余参数。然而，这些参数的打印顺序取决于参数中指定的类。如果你指定\
  \ `java.util.HashSet`，它们将按随机顺序打印；如果你指定 `java.util.TreeSet`，它们将按字母顺序打印，因为 `TreeSet`\
  \ 中的元素是有序排序的：\n\n```java\n// 使用接口反射实例化\npublic static void main(String[] args) {\n\
  \  // 将类转换为 Class 对象\n  Class<? extends Set<String>> cl = null;\n  try {\n    //\
  \ 未检查的转换！\n    cl = (Class<? extends Set<String>>) Class.forName(args[0]);\n  }\
  \ catch (ClassNotFoundException e) {\n    fatalError(\"未找到类.\");\n  }\n  // 获取构造函数\n\
  \  Constructor<? extends Set<String>> cons = null;\n  try {\n    cons = cl.getDeclaredConstructor();\n\
  \  } catch (NoSuchMethodException e) {\n    fatalError(\"没有无参数构造函数\");\n  }\n  //\
  \ 实例化集合\n  Set<String> s = null;\n  try {\n    s = cons.newInstance();\n  } catch\
  \ (IllegalAccessException e) {\n    fatalError(\"构造函数不可访问\");\n  } catch (InstantiationException\
  \ e) {\n    fatalError(\"类不可实例化.\");\n  } catch (InvocationTargetException e) {\n\
  \    fatalError(\"构造函数抛出了异常 \" + e.getCause());\n  } catch (ClassCastException e)\
  \ {\n    fatalError(\"类未实现 Set\");\n  }\n  // 使用集合\n  s.addAll(Arrays.asList(args).subList(1,\
  \ args.length));\n  System.out.println(s);\n}\n```\n\n\n\n\n\n```java\nprivate static\
  \ void fatalError(String msg) {\n    System.err.println(msg);\n    System.exit(1);\n\
  }\n```\n\n虽然这个程序只是一个玩具，但它演示的技术非常强大。这个玩具程序可以很容易地转换为一个通用的集合测试器，通过激进地操作一个或多个实例并检查它们是否遵守\
  \ `Set` 约，来验证特定的 `Set` 实现。同样，它也可以被转换为一个通用的集合性能分析工具。事实上，这种技术强大到足以实现一个完整的服务提供者框架（Item\
  \ 1）。通常情况下，在反射方面，这种技术就是你需要的全部。\n\n这个示例展示了反射的两个缺点。首先，该示例可以在运行时生成六种不同的异常，如果不是使用反射实例化，这些异常都将是编译时错误。（为了好玩起见，你可以通过传递合适的命令行参数让程序生成这六种异常中的每一种。）第二个缺点是，需要二十五行冗长的代码才能从类名生成类的实例，而一个构造函数调用可以整齐地写在一行。通过捕获\
  \ `ReflectiveOperationException`（这是 Java 7 中引入的各种反射异常的父类），可以缩短程序的长度。这两个缺点都局限于程序实例化对象的部分。一旦实例化，该集合与任何其他\
  \ `Set` 实例没有区别。在实际程序中，代码的大部分因此不受这种有限反射使用的影响。\n\n如果你编译这个程序，将得到一个未检查的类型转换警告。这个警告是合理的，因为即使命名的类不是\
  \ `Set` 的实现，到 `Class<? extends Set<String>>` 的转换也会成功，在这种情况下，程序在实例化该类时将抛出 `ClassCastException`。要了解如何抑制警告，请阅读\
  \ Item 27。\n\n反射的一个合法（尽管罕见）的用法是管理类对其他类、方法或字段的依赖，而这些依赖在运行时可能不存在。如果你正在编写一个必须针对某些其他包的多个版本运行，这就会很有用。这种技术是针对支持该包所需的最小环境（通常是最旧版本）编译你的包，并通过反射来访问任何较新的类或方法。为了使其工作，如果你尝试访问的较新类或方法在运行时不存在，你必须采取适当的行动。适当的行动可能包括使用某些替代手段来实现相同的目标，或以功能减少的方式运行。\n\
  \n总之，反射是一项强大的机制，对于某些复杂的系统编程任务是必须的，但它有很多缺点。如果你正在编写一个必须与编译时未知的类工作的程序，你应该在可能的情况下，只使用反射来实例化对象，并使用编译时已知的接口或超类来访问这些对象。\n\
  \n### Item 66: 审慎使用原生方法\n\nJava Native Interface (JNI) 允许 Java 程序调用原生方法，原生方法是用 C\
  \ 或 C++ 等原生编程语言编写的方法。从历史上看，原生方法有三个主要用途。它们提供了对平台特定设施（如注册表）的访问。它们提供了对现有原生代码库的访问，包括提供旧数据访问遗留库。最后，原生方法被用于用原生语言编写应用程序中性能关键的部分，以提高性能。\n\
  \n使用原生方法访问平台特定设施是合法的，但很少有必要：随着 Java 平台的成熟，它提供了对许多以前只在主机平台上找到的功能访问。例如，Java 9 添加的进程\
  \ API 提供了对 OS 进程的访问。当 Java 中没有等效库时，使用原生方法使用原生库也是合法的。\n\n**很少建议使用原生方法来提高性能。** 在早期版本中（Java\
  \ 3 之前），这通常是必要的，但从那以后 JVM 已经变得快得多。对于大多数任务，现在可以在 Java 中获得相当水平的性能。例如，当 `java.math`\
  \ 在版本 1.1 中添加时，`BigInteger` 依赖于当时用 C 编写的快速多精度算术库。在 Java 3 中，`BigInteger` 用 Java\
  \ 重新实现，并经过仔细调优，到其运行速度比原始的原生实现更快。\n\n这个故事一个遗憾的结局是，`BigInteger` 自那以后变化很小，除了 Java 8\
  \ 中对大数的乘法更快之外。在此期间，原生库的工作仍在飞速进行，特别是 GNU 多精度算术库 (GMP)。需要真正高性能多精度算术的 Java 程序员现在有理由通过原生方法使用\
  \ GMP [Blum14] 。\n\n使用原生方法有严重的缺点。因为原生语言是不安全的（Item 50），使用原生方法的应用程序不再对内存损坏错误产生免疫。因为原生语言比\
  \ Java 更依赖平台，使用原生方法的程序移植性较差。它们也更难调试。如果你不小心，原生方法可能会降低性能，因为垃圾回收器无法自动、甚至无法跟踪原生内存的使用（Item\
  \ 8），而且进入和退出原生代码是有成本的。最后，原生方法需要难以阅读和编写起来繁琐的“胶水代码”。\n\n总之，在使用原生方法之前请考虑两次。你很少需要为了提高性能而使用它们。如果你必须使用原生方法来访问低级资源或原生库，请尽可能少地使用原生代码，并对其进行彻底测试。原生代码中的一个\
  \ bug 就会损坏你的整个应用程序。\n\n### Item 67: 审慎地进行优化\n\n关于优化，有三句每个人都应该知道的格言：\n\n> 以效率的名义（而不一定能实现它）所犯的计算罪恶多于任何其他单一原因——包括盲目的愚蠢。\n\
  > ——William A. Wulf [Wulf72]\n\n> 在 97% 的时间里，我们应该忘记微小的效率：过早优化是万恶之源。\n> ——Donald\
  \ E. Knuth [Knuth74]\n\n在优化问题上，我们遵循两条规则：\n\n> 规则 1。不要做。\n> 规则 2（仅针对专家）。现在不要做——也就是说，在你还没有一个完美且未优化的解决方案之前。\n\
  > ——M. A. Jackson [Jackson75]\n\n所有这些格言都比 Java 编程语言早了二十年。它们揭示了关于优化的深刻真理：优化的弊往往大于利，特别是当你过早优化时。在这个过程中，你可能会产生既不快也不正确且无法轻易修复的软件。\n\
  \n不要为了性能而牺牲健全的架构原则。**努力编写良好的程序，而不是快速的程序。** 如果一个良好的程序不够快，它的架构将允许对其进行优化。良好的程序体现了信息隐藏原则：在可能的情况下，它们将设计决策限制在单个组件内部，从而可以在更改决策而不影响系统的其余部分（Item\
  \ 15）。\n\n\n\n\n这**并不意味着**你可以在程序完成之前忽略性能问题。实现层面的问题可以通过后期的优化来修复，但限制性能的普遍性架构缺陷，如果不重写系统，可能是无法修复的。在事后更改设计的某个基本方面可能会导致系统结构不合理，难以维护和演进。因此，你必须在设计过程中考虑性能。\n\
  \n### 努力避免限制性能的设计决策。\n设计中事后最难以更改的组件是那些指定组件之间交互以及与外部世界交互的组件。这些设计组件中的首要部分是 API、线缆级协议和持久化数据格式。这些设计组件不仅在事后难以或无法更改，而且它们所有的都可能对系统所能达到的性能产生重大的限制。\n\
  \n### 考虑你的 API 设计决策对性能的影响。\n将一个公有类型设为可变可能需要大量不必要的防御拷贝（Item 50）。同样，在应该使用组合的公共类中使用继承，会将该类与其父类永久绑定，这可能会对子类的性能施加人为的限制（Item\
  \ 18）。最后一个例子是，在 API 中使用实现类型而非接口，会将你与特定的实现挂钩，即使未来可能会编写出更快的实现（Item 64）。\n\nAPI 设计对性能的影响是非常真实的。考虑\
  \ `java.awt.Component` 类中的 `getSize` 方法。将这个性能关键型方法决定为返回一个 `Dimension` 实例，并结合 `Dimension`\
  \ 实例是可变的决定，迫使该方法的任何实现在每次调用时都分配一个新的 `Dimension` 实例。尽管在现代虚拟机上分配小对象的代价是廉价的，但无谓地分配数百万个对象会对性能造成实际损害。\n\
  \n曾经存在多种 API 设计的替代方案。理想情况下，`Dimension` 应该是不可变的（Item 17）；或者，`getSize` 可以被两个返回 `Dimension`\
  \ 对象各个原始数据类型组件的方法所取代。事实上，出于性能考虑，Java 2 在 `Component` 中添加了两个这样的方法。然而，现有的客户端代码仍然使用\
  \ `getSize` 方法，并且仍然遭受着原始 API 设计决策带来的性能后果。\n\n幸运的是，良好的 API 设计通常与良好的性能是一致的。为了获得良好的性能而扭曲\
  \ API 是一个非常糟糕的主意。导致你扭曲 API 的性能问题可能会在平台的未来版本或其他底层软件中消失，但扭曲的 API 以及随之而来的支持头疼问题将与你伴随终生。\n\
  \n一旦你仔细设计了程序并产生了一个清晰、简洁且结构良好的实现，*那么* 可能就是考虑优化的时候了，假设你还没有对程序的性能感到满意。\n\n记住 Jackson\
  \ 的两个优化规则是“不要做”以及“（仅限专家）。现在不要做”。他本可以再增加一条：**在每次尝试优化的前后测量性能。** 你可能会对发现的现象感到惊讶。通常情况下，尝试的优化对性能没有可衡量的影响；有时，它们会让性能变得更糟。主要原因是很难猜测你的程序时间浪费在了什么地方。你认为程序缓慢的部分可能并不是问题所在，如果是这种情况下，你就是在浪费时间尝试优化它。根据常识，程序\
  \ 90% 的时间都花在 10% 的代码上。\n\n性能分析工具（Profiling tools）可以帮助你决定将优化精力集中在哪里。这些工具可以提供运行时信息，例如每个方法大约消耗了多少时间以及被调用了多少次。除了专注于调优工作外，这还可以提醒你需要进行算法更改。如果一个二次（或更糟）算法隐藏在你的程序中，无论如何调优都无法解决问题。你必须用更高效的算法替换它。系统中的代码越多，使用性能分析器就越重要。这就像在大海捞针：海草越大，拥有一个金属探测器就越有用。另一个值得特别提及的工具是\
  \ `jmh`，它不是性能分析工具，而是一个 `microbenchmarking framework`（微基准框架），为 Java 代码的详细性能提供了无与伦比的可见性\
  \ [JMH]。\n\n在 Java 中，衡量尝试优化的效果比在 C 和 C++ 等更传统的语言中更为重要，因为 Java 拥有更弱的 `performance\
  \ model`：各种原始操作的相对代价定义得没那么明确。程序员编写的内容与 CPU 执行的内容之间的“抽象差距”更大，这使得更难可靠地预测优化的性能后果。流传着许多性能神话，结果证明它们往往是半真理或完全的谎言。\n\
  \n不仅 Java 的性能模型定义模糊，它还随着不同的实现、不同的发布版本以及不同的处理器而异。如果你将在多个实现或多个硬件平台上运行你的程序，那么在每个平台上都测量你优化的影响是重要的。偶尔，你可能被迫在不同实现或硬件平台的性能之间进行权衡。\n\
  \n自本文条目首次编写以来的近二十年里，Java 软件栈的每个组件都变得更加复杂，从处理器到虚拟机再到库，运行 Java 的硬件种类也大幅增加。所有这些因素共同作用使得\
  \ Java 程序的性能现在比 2001 年更难以预测，相应的测量性能的需求也随之增加。\n\n总结一下，不要努力编写快速的程序——要努力编写良好的程序；速度会随之而来。但在设计系统时，务必考虑性能，特别是在设计\
  \ API、线缆级协议和持久化数据格式时。当你构建完系统后，测量它的性能。如果足够快，你就完成了任务。如果不够，借助性能分析器定位问题所在，并开始优化系统的相关部分。第一步是检查你的算法选择：任何低级优化都无法弥补糟糕算法选择。根据需要重复此过程，并在每次更改后进行性能测量，直到你满意。\n\
  \n### 条目 68：遵循通用的命名规范\nJava 平台有一套建立良好的 `naming conventions`（命名规范），其中许多包含在《Java 语言规范》[JLS,\
  \ 6.1] 中。粗来说，命名规范分为类型和语法两类。\n\n只有少数类型命名规范，涵盖包、类、接口、方法、字段和类型变量。你应该很少违反它们，除非有非常充分的理由。如果\
  \ API 违反了这些规范，可能难以使用。如果实现违反了它们，可能难以维护。在两种情况下，违反规范都可能困扰和恼怒与代码一起工作的程序员，并可能导致错误的假设从而引发错误。这些规范在本条目中进行了总结。\n\
  \n\n\n包名和模块名应该是分级结构的，并用点分隔组件。组件应由小写字母组成，极少数情况下包含数字。任何要在组织之外使用的包名，都应该以该组织的互联网域名开头，并将组件反转，例如，`edu.cmu`、`com.google`、`org.eff`。标准库和可选包（其名称以\
  \ `java` 和 `javax` 开头）是此规则的例外。用户不能创建以 `java` 或 `javax` 开头的包或模块。关于将互联网域名转换为包名前缀的的详细规则，可以参阅\
  \ JLS [JLS, 6.1]。\n\n包名的剩余部分应由一个或多个描述该包的组件组成。组件应该很短，通常为八个字符或少。鼓励使用有意义的缩写，例如用 `util`\
  \ 而不是 `utilities`。可以接受缩写词，例如 `awt`。组件通常由单个单词或缩写组成。\n\n许多包名除了互联网域名外，只有一个组件。对于规模庞大到需要将其拆分为非正式分级结构的大型机构，额外的组件是合适的。例如，`javax.util`\
  \ 包具有丰富的包层次结构，名称如 `java.util.concurrent.atomic`。此类包被称为子包，尽管在语言上几乎没有对包分级结构的支持。\n\n\
  ### 类和接口名\n类名和接口名（包括枚举和注解类型名）应由一个或多个单词组成，每个单词的首字母大写，例如，`List` 或 `FutureTask`。应避免缩写，但缩写词和某些常见的缩写（如\
  \ `max` 和 `min`）除外。对于缩写词应该大写还是仅首字母大写，存在分歧。虽然一些程序员仍使用大写，但有强有力的理由支持仅大写首字母：即使多个缩写词连续出现，你仍然可以看出单词从哪里开始，另一个单词何时结束。你更倾向于看到哪个类名，`HTTPURL`\
  \ 还是 `HttpUrl`？\n\n### 方法和字段名\n方法和字段名遵循与类和接口相同的排版约定，但方法或字段名的首字母应该小写，例如，`remove`\
  \ 或 `ensureCapacity`。如果缩写词作为方法或字段名的第一个单词，则应小写。\n\n上述规则的唯一例外是“常量字段”，其名称应由一个或多个用下划线分隔的大写单词组成，例如，`VALUES`\
  \ 或 `NEGATIVE_INFINITY`。常量字段是一个其值不可变的 `static final` 字段。如果一个 `static final` 字段具有原始类型或不可变引用类型（Item\
  \ 17），那么它就是一个常量字段。例如，枚举常量就是常量字段。如果一个 `static final` 字段具有可变引用类型，只要引用的对象是不可变的，它仍然可以是一个常量字段。注意，常量字段是下划线的唯一推荐用法。\n\
  \n### 局部变量名\n局部变量名的排版命名约定与成员名相似，但允许缩写，也允许单个字符以及意义取决于其出现上下文的短字符序列，例如，`i`、`denom`、`houseNum`。输入参数是一种特殊的局部变量。它们的命名应该比普通局部变量小心得多，因为它们的名称是方法文档不可或缺的一部分。\n\
  \n### 类型参数名\n类型参数名通常由单个字母组成。最常见的是这五个之一：`T` 表示任意类型，`E` 表示集合的元素类型，`K` 和 `V` 表示 map\
  \ 的键和值类型，`X` 表示异常。函数的返回类型通常是 `R`。一组任意类型可以是 `T`、`U`、`V` 或 `T1`、`T2`、`T3`。\n\n为了方便参考，下表显示了排版约定的示例。\n\
  \n| 标识符类型 | 示例 |\n| :--- | :--- |\n| 包或模块 | `org.junit.jupiter.api`, `com.google.common.collect`\
  \ |\n| 类或接口 | `Stream`, `FutureTask`, `LinkedHashMap`, `HttpClient` |\n| 方法或字段 |\
  \ `remove`, `groupingBy`, `getCrc` |\n| 常量字段 | `MIN_VALUE`, `NEGATIVE_INFINITY`\
  \ |\n| 局部变量 | `i`, `denom`, `houseNum` |\n| 类型参数 | `T`, `E`, `K`, `V`, `X`, `R`,\
  \ `U`, `V, T1, T2` |\n\n### 语法命名约定\n语法命名约定比排版约定更灵活，也更具争议。包没有所谓的语法命名约定。可实例化类（包括枚举类型）通常用单数名词或名词短语命名，例如\
  \ `Thread`、`PriorityQueue` 或 `ChessPiece`。不可实例化的工具类（Item 4）通常用复数名词命名，例如 `Collectors`\
  \ 或 `Collections`。接口的命名方式类似于类，例如 `Collection` 或 `Comparator`，或者以 `able` 或 `ible`\
  \ 结尾的形容词，例如 `Runnable`、`Iterable` 或 `Accessible`。由于注解类型有许多用途，没有某种词性占主导。名词、动词、介词和形容词都很常见，例如\
  \ `BindingAnnotation`、`Inject`、`ImplementedBy` 或 `Singleton`。\n\n执行操作的方法通常用动词或动词短语（包括对象）命名，例如\
  \ `append` 或 `drawImage`。返回 `boolean` 值的方法通常以单词 `is`（或较少见的 `has`）开头，后跟名词、名词短语或任何充当形容词的单词或短语，例如\
  \ `isDigit`、`isProbablePrime`、`isEmpty`、`isEnabled` 或 `hasSiblings`。\n\n返回其调用对象的非布尔函数或属性的方法通常用名词、名词短语或以动词\
  \ `get` 开头的动词短语命名，例如 `size`、`hashCode` 或 `getTime`。有一派观点声称只有第三种形式（以 `get` 开头）是可以接受的，但这种说法毫无根据。前两种形式通常会导致更具读性的代码，例如：\n\
  \n```\nif (car.speed() > 2 * SPEED_LIMIT)\n    generateAudibleAlert(\"Watch out\
  \ for cops!\");\n```\n\n以 `get` 开头的形式源于已很大过时的 Java Beans 规范，该规范是早期可重用组件体系的基础。现代工具继续依赖于\
  \ Beans 命名约定，你可以在任何与这些工具配合使用的代码中放心地使用它。如果一个类对同一个属性同时包含 setter 和 getter，那么遵循这种命名约定也有强有力的先例。在这种情况下，这两个方法通常被命名为\
  \ `get``Attribute` 和 `set``Attribute`。\n\n有几个方法名值得特别提到。转换对象类型并返回不同类型的独立对象的实例方法通常被称为\
  \ `to``Type``，例如 `toString` 或 `toArray`。返回与接收对象类型不同的视图（Item 6）的方法通常被称为 `as``Type``，例如\
  \ `asList()`。返回与调用对象值相同的原始类型的方法通常被称为类型`Value`，例如 `intValue`。静态工厂的常用名称包括 `from`、`of`、`valueOf`、`instance`、`getInstance`、`newInstance`、`get``Type``\
  \ 和 new`*Type*`（Item 1，第 9 页）。\n\n\n\n字段名的语法规范没有像类、接口和方法名的规范那样完善，也不那么重要，因为设计良好的\
  \ API 很少有（甚至没有）暴露的字段。`boolean` 类型的字段命名通常类似于 `boolean` 访问器方法，但省略了开头的 `is`，例如 `initialized`、`composite`。其他类型的字段通常用名词或名词短语命名，例如\
  \ `height`、`digits` 或 `bodyStyle`。局部变量的语法规范与字段相似，但更为薄弱。\n\n总结一下，要内化标准的命名规范并学会将它们变成本能。排版规范非常直观且很大程度上没有歧义；而语法规范则更为复杂且松散。引用《Java\
  \ 语言规范》[JLS, 6.1] 的话：“如果长期以来的惯用法另有规定，则不应盲目遵守这些惯例。”请运用常识。\n\n# 第 10 章 异常\n\n当使用得当时，异常可以提高程序的可读性、可靠性和可维护性。当使用不当时，它们可能会产生适反的效果。本章提供了有效使用异常的指南。\n\
  \n### 条目 69：仅对异常情况使用异常\n\n某一天，如果你运气不好，可能会遇到一段看起来像这样的代码：\n\n点击此处查看代码图片\n\n```java\n\
  // 对异常的糟糕滥用。千万不要这样做！\n\ntry {\n    int i = 0;\n    while(true)\n        range[i++].climb();\n\
  } catch (ArrayIndexOutOfBoundsException e) {\n}\n```\n\n这段代码是做什么的？从检查中看这并不显而易见，这足以理由不使用它（条目\
  \ 67）。事实证明，这是一个遍历数组元素的极坏构思的惯用法。该无限循环通过在尝试访问数组边界之外的第一个元素时，抛出、捕获并忽略 `ArrayIndexOutOfBoundsException`\
  \ 来终止的。它本应该等同于遍历数组的标准惯用法，任何 Java 程序员都能立即识别出它：\n\n点击此处查看代码图片\n\n```java\nfor (Mountain\
  \ m : range)\n    m.climb();\n```\n\n所以，为什么有人会使用基于异常的循环而不是经过实践检验的方法呢？这是一种试图提高性能的误导尝试，其基于一个错误的推理：既然\
  \ VM 会检查所有数组访问的边界，那么正常的循环终止测试（被编译器隐藏但在 for-each 循环中仍然存在）是多余的，应该被避免。这种推理有三个错误：\n\n\
  -   因为异常是为异常情况设计的，所以 JVM 实现者几乎没有动力让它们运行得像显式测试一样快。\n-   将代码放在 `try-catch` 块内部会抑制\
  \ JVM 实现可能执行的某些优化。\n-   遍历数组的标准惯用法并不一定会导致冗余检查。许多 JVM 实现会优化掉这些检查。\n\n事实上，基于异常的惯用法比标准方法要慢得多。在我的机器上，对于包含一百个元素的数组，基于异常的惯用法大约是标准方法的两倍。\n\
  \n基于异常的循环不仅模糊了代码意图并降低了性能，而且无法保证能够正常工作。如果循环存在 bug，使用异常进行控制流可能会掩盖该 bug，极大地增加调试难度。假设循环体中的计算调用了一个方法，该方法对某些无关的数组执行了越界访问。如果使用了合理的循环惯用法，bug\
  \ 将产生一个未捕获的异常，导致线程立即终止并带有完整的堆栈跟踪。如果使用了这种误导的基于异常的循环，与 bug 相关的异常将被捕获并被误解为正常的循环终止。\n\
  \n这个故事的教训很简单：**异常正如其名称所示，仅应用于异常情况；它们永远不应该被用于普通的控制流。**更广泛地说，要优先使用标准的、易于识别的惯用法，而不是那些声称提供更好性能的过度巧妙的技术。即使性能优势是真实的，在不断改进的平台实现面前，这种优势可能不再存在。然而，由过度巧妙的技术带来的细微\
  \ bug 和维护上的头疼问题却一直存在。\n\n这一原则对 API 设计也有影响。**设计良好的 API 不得强迫客户端使用异常进行普通的控制流。** 一个具有“状态依赖”方法的类，如果该方法只能在某些不可预测的条件下被调用，通常应该有一个独立的“状态测试”方法，用来指示调用该状态依赖方法是否合适。例如，`Iterator`\
  \ 接口具有状态依赖方法 `next` 和对应的状态测试方法 `hasNext`。这使得使用传统的 `for` 循环遍历集合的标准惯用法成为可能（对于 for-each\
  \ 循环也是如此，内部使用了 `hasNext` 方法）：\n\n点击此处查看代码图片\n\n```java\nfor (Iterator<Foo> i = collection.iterator();\
  \ i.hasNext(); ) {\n    Foo foo = i.next();\n    ...\n}\n```\n\n如果 `Iterator` 缺少\
  \ `hasNext` 方法，客户端将被迫执行以下操作：\n\n点击此处查看代码图片\n\n```java\n// 不要使用这种丑陋的代码来遍历集合！\n\n\
  try {\n    Iterator<Foo> i = collection.iterator();\n    while(true) {\n       \
  \ Foo foo = i.next();\n        ...\n    }\n} catch (NoSuchElementException e) {\n\
  }\n```\n\n这看起来与本项开头的数组示例非常相似。除了冗长和误导之外，基于异常的循环性能可能很差，并可能掩盖系统其他部分的 bug。\n\n提供单独状态测试方法的替代方案是，让状态依赖方法返回一个空的可选对象（条目\
  \ 55）或在无法执行所需计算时返回一个特殊值（如 `null`）。\n\n以下是帮助你在状态测试方法和可选或特殊返回值之间进行选择的指南。如果对象要在没有外部同步的情况下并发访问，或者受到外部触发的状态转换，则必须使用可选或特殊返回值，因为状态在调用状态测试方法和状态依赖方法之间可能会发生变化。如果单独的状态测试方法会导致重复工作，性能考虑可能会要求使用可选或特殊返回值。在其他条件都相同的情况下，状态测试方法略微优于特殊返回值。它提供了略好的可读性，且错误的使用可能更容易被检测：如果你忘记调用状态测试方法，状态依赖方法将抛出异常，使\
  \ bug 显而易见；如果你忘记检查特殊返回值，bug 可能是细微的。这对于可选返回值来说不是问题。\n\n总结，异常是为异常情况设计的。不要将它们用于普通的控制流，也不要编写强迫他人这么做的\
  \ API。\n\n### 条目 70：使用检查异常处理可恢复的情况，使用运行时异常处理编程错误\n\n\n\n\n\n决定使用受检查异常（checked exception）还是未检查异常（unchecked\
  \ exception）的核心规则是：**对于调用者可以合理恢复的情况，使用受检查异常。**通过抛出受检查异常，你强制调用者在 `catch` 句中处理该异常，或将其向外传播。因此，方法声明抛出的每一个受检查异常都是向\
  \ API 用户发出的一种强信号，表明相关状况是调用该方法时可能出现的结果。\n\n通过让用户面对受检查异常，API 设计者实际上下达了从该状况恢复的指令。用户可以通过捕获异常并忽略它来忽视这一指令，但这通常是一个坏主意（Item\
  \ 77）。\n\n未检查的可抛出异常有两种类：运行时异常（runtime exceptions）和错误（errors）。它们在行为上是相同的：两者都是不需要且通常不应该被捕获的可抛异常。如果程序抛出未检查的异常或错误，通常意味着无法恢复，且继续执行的弊大于于利。如果程序没有捕获此类可抛异常，它将导致当前线程停止并带有相应的错误信息。\n\
  \n**使用运行时异常来指示编程错误。** 大多数运行时异常指示着*前提条件的违反（precondition violations）*。前提条件的违反仅仅是指\
  \ API 客户端未能遵守 API 规范所建立的约定。例如，数组访问的约定规定数组索引必须在零到数组长度减一之间（包含边界）。`ArrayIndexOutOfBoundsException`\
  \ 就表示违反了这一前提条件。\n\n此建议的一个问题是，并不总是清楚你面对的是可恢复的状况还是编程错误。例如，考虑资源耗尽的情况，这可能是由编程错误（如分配一个异常巨大的数组）引起的，也可能是由真实的资源短缺引起的。如果耗尽是由临时短缺或需求临时增加引起的，那么该状况可能是可以恢复的。一个特定的资源耗尽实例是否允许恢复，取决于\
  \ API 设计者的判断。如果你认为某个状况可能允许恢复，请使用受检查异常；如果不是，请使用运行时异常。如果不确定是否可以恢复，你可能使用未检查异常更好，原因详见\
  \ Item 71 中的讨论。\n\n虽然 Java 语言规范没有强制要求，但存在一个强有惯例：*错误（errors）*留给 JVM 使用，以指示资源匮乏、不变性失效或其他导致无法继续执行的情况。鉴于这一惯例几乎被普遍接受，最好不要实现任何新的\
  \ `Error` 子类。因此，**你实现的所有未检查可抛异常都应该子类** `RuntimeException`（直接或间接地）。你不光应该定义 `Error`\
  \ 子类，而且 `AssertionError` 之外，你不应该抛出它们。\n\n可以定义一个不是 `Exception`、`RuntimeException`\
  \ 或 `Error` 子类的可抛异常。JLS 没有直接处理此类可抛异常，但隐式规定了它们的行为类似于普通的受检查异常（即 `Exception` 的子类但不是\
  \ `RuntimeException`）。那么你什么时候应该使用这种怪物？简而言之，永远不要使用。它们与普通的受检查异常相比没有任何优点，只会困扰你 API\
  \ 的用户。\n\nAPI 设计者经常忘记异常是完全的对象，可以在上面定义任意方法。此类方法的主要用途是提供代码，在捕获异常时提供有关导致异常发生的状况的额外信息。在缺乏此类方法的情况下，已知程序员会解析异常的字符串表示来搜寻额外信息。这是一种极其糟糕的做法（Item\
  \ 12）。`Throwable` 类很少指定其字符串表示的细节，因此字符串表示可能随实现和发布版本的不同而异。因此，解析异常字符串表示的代码很可能是不可移植且脆弱的。\n\
  \n由于受检查异常通常指示可恢复的状况，因此让它们提供能够帮助调用者从异常状况中恢复的信息的方法变得尤为重要。例如，假设当尝试使用礼品卡购买时因资金不足而失败时，抛出了受检查异常。该异常应该提供一个访问方法来查询短缺的金额。这将允许调用者将金额传递给购物者。关于此主题的更多信息，请参见\
  \ Item 75。\n\n总结：对于可恢复的抛出受检查异常，对于编程错误抛出未检查异常。如有疑问，抛出未检查异常。不要定义既不是受检查异常不是运行时异常的可抛异常。在你的受检查异常上提供方法以辅助恢复。\n\
  \n### Item 71: 避免不必要使用受检查异常\n\n许多 Java 程序员不喜欢受检查异常，但如果使用当，它们可以改进 API 和程序。与返回码和未检查异常不同，它们*强制*程序员处理问题，增强了可靠性。尽管如此，在\
  \ API 中过度使用受检查异常会使其变得非常难用。如果一个方法抛出受检查异常，调用该方法的代码必须在一个或多个 `catch` 块中处理它们，或者声明它抛出了这些异常并让它们向外传播。无论何种方式，都给\
  \ API 用户增加了负担。这种负担在 Java 8 中增加了，因为抛出受检查异常的方法无法直接在流中使用（Items 45–48）。\n\n如果异常状况无法通过正确使用\
  \ API 来防止，*且*使用 API 的程序员在面对异常时可以采取某些有用的操作，那么这种负担就是合理的。除非这两个条件都满足，否则使用未检查异常更为合适。作为一个金石测试，问问自己程序员将如何处理该异常。这是他们所能做的最好的吗？\n\
  \n点击此处查看图像\n\n```java\ncatch (TheCheckedException e) {\n    throw new AssertionError();\
  \ // 不可能！\n}\n```\n\n或者这样？\n\n点击此处查看图像\n\n```java\ncatch (TheCheckedException e)\
  \ {\n    e.printStackTrace();         // 噢，我们输了。\n    System.exit(1);\n}\n```\n\n\
  如果程序员无法做得更好，则需要未检查异常。\n\n如果一个受检查异常是方法抛出的*唯一*受检查异常，它给程序员带来的额外负担会大大增加。如果还有其他异常，该方法已经出现在\
  \ `try` 块中，而此异常最多只需要另一个 `catch` 块。如果一个方法只抛出一个受检查异常，该异常就是方法必须出现在 `try` 块且无法直接在流使用的唯一原因。在这种情况下，问问自己是否有办法避免受检查异常是值得的。\n\
  \n消除受检查异常的最简单方法是返回所需类型的*可选（optional）*（Item 55）。方法不再抛出受检查异常，而是简单返回一个空可选。这种技术的缺点是方法无法返回任何详细说明无法执行所需计算的额外信息。相比之下，异常具有描述性类型，并可以导出方法来提供额外信息（Item\
  \ 70）。\n\n\n\n\n你也可以通过将抛出异常的方法拆分为两个方法，将检查异常（checked exception）转换为未检查异常（unchecked\
  \ exception）。其中第一个方法返回一个 `boolean`，表示是否会抛出异常。这种 API 重构将调用序列从这种转变为：\n\n点击此处查看代码图像\n\
  \n// 使用检查异常的调用\n```java\ntry {\n    obj.action(args);\n} catch (TheCheckedException\
  \ e) {\n    ... // 处理异常情况\n}\n```\n\n变为这种：\n\n点击此处查看代码图像\n\n// 使用状态测试方法和未检查异常的调用\n\
  ```java\nif (obj.actionPermitted(args)) {\n    obj.action(args);\n} else {\n   \
  \ ... // 处理异常情况\n}\n```\n\n这种重构并不总是适用的，但在适用的情况下，它可以让 API 变得更加易用。虽然后者的调用序列并不比前者更美观，但重构后的\
  \ API 更具活性。如果程序员知道调用将会成功，或者愿意在失败时让线程终止，这种重构还允许这种简便的调用序列：\n\n```java\nobj.action(args);\n\
  ```\n\n如果你怀疑这种简单的调用序列将成为常态，那么这种 API 重构可能是合适的。生成的 API 本质上是 Item 69 中的状态测试方法 API，并且适用相同的警告：如果对象要在没有外部同步的情况下并发访问，或者它受到外部诱导的状态转换，那么这种重构是不合适的，因为在调用\
  \ `actionPermitted` 和 `action` 之间，对象的状态可能会发生变化。如果单独的 `actionPermitted` 方法会重复 `action`\
  \ 方法的工作，则可能由于性能原因而排除这种重构。\n\n总之，当节使用时，检查异常可以增加程序的可靠性；当过度使用时，它们会让 API 变得难以用用。如果调用者无法从失败中恢复，请抛出未检查异常。如果可能恢复且你希望*强制*调用者处理异常情况，首先考虑返回一个可选值（optional）。只有在失败情况下这样做提供的信息不足时，你才应该抛出检查异常。\n\
  \n### Item 72：优先使用标准异常\n\n区分专家级程序员与经验较少程序员的特征之一是，专家力求并通常能实现高度的代码复用。代码复用是一件好事，异常也不例外。Java\
  \ 库提供了一系列异常，涵盖了大多数 API 大部分抛出异常的需求。\n\n重用标准异常有几个优点。其中最主要的一点是，它让你的 API 更容易学习和使用，因为它符合程序员已经熟悉的既定习惯。其次是，使用你\
  \ API 的程序更易于阅读，因为它们不会被不熟悉的异常所困扰。最后（也是最不重要的的），异常类更少意味着内存占用更小，加载类花费的时间更少。\n\n常重用的异常类型是\
  \ `IllegalArgumentException`（Item 49）。当调用者传递了一个值不当的参数时，这通常是应该抛出的异常。例如，如果调用者在一个表示某些操作重复次数的参数中传递了一个负数，这就会是抛出的异常。\n\
  \n另一个常用的重用异常是 `IllegalStateException`。如果因为接收对象的状态导致调用是非法的，这通常是应该抛出的异常。例如，如果调用者尝试在对象被妥善初始化之前使用它，这就会是抛出的异常。\n\
  \n可以认为，每一个错误的方法调用都可以归结为非法参数或状态，但其他异常被标准地用于某些类型的非法参数和状态。如果调用者在某些禁止空值的参数中传递了 `null`，规定应抛出\
  \ `NullPointerException` 而不是 `IllegalArgumentException`。同样，如果调用者在一个表示索引的参数中传递了一个超出范围的值，按照约定应抛出\
  \ `IndexOutOfBoundsException` 而不是 `IllegalArgumentException`。\n\n另一个可用的异常是 `ConcurrentModificationException`。如果一个设计为单线程使用的（或带有外部同步）的对象检测到它正在被并发修改，应该抛出此异常，而不是\
  \ `IllegalArgumentException`。这种异常充其量是一个提示，因为它无法可靠地检测并发修改。\n\n最后一个值得注意的标准异常是 `UnsupportedOperationException`。如果对象不支持某种操作，这是应该抛出的异常。它的使用很少见，因为大多数对象都支持其方法。这种异常用于那些未能实现*可选操作*的类。例如，一个只追加的\
  \ `List` 实现在有人尝试删除元素时会抛出此异常。\n\n**不要直接重用** `Exception`、`RuntimeException`、`Throwable`\
  \ 或 `Error`。将这些类视为抽象类，因为它们是方法可能抛出的其他异常的父类。\n\n下表总结了最常重用的异常：\n\n| 异常 | 使用场合 |\n|\
  \ :--- | :--- |\n| `IllegalArgumentException` | 非空参数值不当 |\n| `IllegalStateException`\
  \ | 对象状态不允许方法调用 |\n| `NullPointerException` | 参数不允许为空 |\n| `IndexOutOfBoundsException`\
  \ | 索引参数值超出范围 |\n| `ConcurrentModificationException` | 在禁止的情况下检测到对象的并发修改 |\n| `UnsupportedOperationException`\
  \ | 对象不支持方法 |\n\n虽然这些是最常用的异常，但在情况允许的情况下也可以重用其他异常。例如，如果你正在实现复数或有理数等运算对象，重用 `ArithmeticException`\
  \ 和 `NumberFormatException` 是合适的。如果某个异常符合你的需求，尽管可以使用它，但仅当你抛出它的情况与该异常的文档一致时：重用必须基于记录的语义，而不仅仅是名称。此外，如果你想添加更多细节，可以对标准异常进行子类化（Item\
  \ 75），但记住异常是可序列化的（第 12 章）。单凭这一点就足以在没有理由的情况下编写自己的异常类。\n\n选择重用哪种异常可能是困难的，因为上面表中“使用场合”似乎并不是互斥的。考虑一个表示牌组的对象的情况，假设有一个方法从牌组中发牌，并将手牌的大小作为参数。如果调用者传递的值大于剩余的牌数，这可以被解释为\
  \ `IllegalArgumentException`（`handSize` 参数值太高）或 `IllegalStateException`（牌组太太少）。在这种情况下，规则是：如果没有任何参数值可以有效，则抛出\
  \ `IllegalStateException`，否则抛出 `IllegalArgumentException`。\n\n### Item 73：抛出符合抽象的异常\n\
  \n\n\n\n当一个方法抛出的异常与它执行的任务没有明显的联系时，这会是令人困惑的。这通常发生在方法传播了由低层抽象抛出的异常时。这不仅令人困惑，还会用实现细节污染高层的\
  \ API。如果高层的实现实现在随后的发布中发生变化，那么它抛出的异常也会随之改变，这可能会破坏现有的客户端程序。\n\n为了避免这个问题，`高层应该捕获低层异常，并取而代之抛出可以用高层抽象来解释的异常。`\
  \ 这种用法被称为*异常翻译*（exception translation）：\n\n点击此处查看代码图像\n\n### 异常翻译\n\n```java\ntry\
  \ {\n    ... // 使用低层抽象执行我们的任务\n} catch (LowerLevelException e) {\n    throw new\
  \ HigherLevelException(...);\n}\n```\n\n这是一个取自 `AbstractSequentialList` 类的异常翻译示例，该类是\
  \ `List` 接口的*骨架实现*（Item 20）。在这个示例中，异常翻译是由 `List<E>` 接口中 `get` 方法的规范规定的：\n\n点击此处查看代码图像\n\
  \n```java\n/**\n * 返回此列表中指定位置的元素。\n * @throws IndexOutOfBoundsException 如果索引超出范围\n\
  \ *          ({@code index <  0 || index >= size()}).\n */\npublic E get(int index)\
  \ {\n    ListIterator<E> i = listIterator(index);\n    try {\n        return i.next();\n\
  \    } catch (NoSuchElementException e) {\n        throw new IndexOutOfBoundsException(\"\
  Index: \" + index);\n    }\n}\n```\n\n在某些情况下，需要一种称为*异常链*（exception chaining）的特殊异常翻译形式，低层异常可能对调试导致高层异常的问题的人有所帮助。低层异常（*原因*）被传递给高层异常，高层异常提供了一个访问方法（`Throwable`\
  \ 的 `getCause` 方法）来检索低层异常：\n\n点击此处查看代码图像\n\n### 异常链\n\n```java\ntry {\n    ... //\
  \ 使用低层抽象执行我们的任务\n} catch (LowerLevelException cause) {\n    throw new HigherLevelException(cause);\n\
  }\n```\n\n高层异常的构造函数将原因传递给*感知链的*父类构造函数，因此它最终会被传递给 `Throwable` 的一个感知链的构造函数之一，例如 `Throwable(Throwable)`：\n\
  \n点击此处查看代码图像\n\n### 具有感知链的构造函数的异常\n\n```java\nclass HigherLevelException extends\
  \ Exception {\n    HigherLevelException(Throwable cause) {\n        super(cause);\n\
  \    }\n}\n```\n\n大多数标准异常都有感知链的构造函数。对于那些没有这种构造函数的异常，你可以使用 `Throwable` 的 `initCause`\
  \ 方法设置原因。异常链不仅允许你通过程序化方式（使用 `getCause`）访问原因，还将原因的堆栈跟踪集成到高层异常的堆栈跟踪中。\n\n`虽然异常翻译优于从低层盲目传播异常，但不应过度使用。`\
  \ 在在可能的情况下，处理来自低层异常的最佳方法是避免它们，通过确保低层方法成功执行。有时，你可以通过在将参数传递给低层之前检查高层方法参数的有效性来做到。\n\
  \n如果无法防止低层的异常，其次最好的方法是让高层静默地绕过这些异常，将高层方法的调用者与低层问题隔离开。在这种情况下，使用适当的日志设施（如 `java.util.logging`）记录异常可能是合适的。这允许程序员调查问题，同时保护客户端代码和用户不受影响\n\
  \n总之，如果无法防止或处理来自低层的异常，请使用异常翻译，除非低层方法恰好保证其抛出的所有异常都适用于高层。链提供了兼得其长的效果：它允许你抛出一个合适的高层异常，同时捕获故障分析的底层原因（Item\
  \ 75）。\n\n### Item 74：记录每个方法抛出的所有异常\n\n对方法抛出的异常的描述是正确使用该方法所需的文档的重要部分。因此，花时间仔细记录每个方法抛出的所有异常是至关重要的（Item\
  \ 56）。\n\n`始终单独声明受检异常，并使用 Javadoc 的 @throws 标签精确地记录每种异常抛出的条件`。不要走捷径，声明一个方法会抛出它可能抛出的某些异常类的超类。作为一个极端例子，不要声明一个公共方法\
  \ `throws Exception`，或者更糟糕的，`throws Throwable`。除了无法为方法用户提供关于其可能抛出的异常的任何指导外，这种声明极大地阻碍了该方法的使用。这一建议的例外是\
  \ `main` 方法，它可以安全地声明为抛出 `Exception`。\n\n虽然语言没有要求程序员声明方法所抛出的未检异常（unchecked exceptions），但像记录受检异常一样仔细记录它们是明智的。未检异常通常代表编程错误（Item\
  \ 70），让程序员熟悉他们可能犯的所有错误有助于他们避免这些错误。一个对方法可以抛出的未检异常进行完备良好的列表，有效地描述了其成功执行的*前提条件*。每个公共方法的文档都描述其前提条件是至关重要的（[Item\
  \ 56](#ch8.xhtml_lev56）），而记录其未检异常是满足这一要求的最佳方法。\n\n接口中的方法记录它们可能抛出的未检异常尤为重要。这些文档构成了接口*通用契约*的一部分，并使得多个接口实现之间存在共同行为。\n\
  \n`使用 Javadoc @throws 标签记录方法可以抛出的每个异常，但不要在未检异常上使用 throws 关键字`。让使用你 API 的程序员意识到哪些异常是受检的哪些是未检的很重要，因为在这两种情况下程序员的责任是不同的。由\
  \ Javadoc @throws 标签生成的文档（如果方法声明中没有相应的 throws 子句）为程序员提供了强烈的视觉提示，表明异常是未检的。\n\n需要注意的是，记录每个方法可以抛出的所有未检异常是一种理想，在现实世界中并不总是可行。当一个类进行修订时，如果导出方法被修改为抛出额外的未检异常，并不违反源或二进制兼容性。假设一个类调用另一个独立编写类的方法。前一个类的作者可能仔细记录了每个方法抛出的所有未检异常，但如果后者类被修订为抛出额外的未检异常，那么前者类（未经过修订）极可能会传播这些新的未检异常，尽管它没有记录它们。\n\
  \n\n\n\n\n如果一个类中的多个方法由于同一个原因抛出异常，你可以在类的文档注释中记录该异常，而不是为每个方法单独进行记录。一个常见的例子是 `NullPointerException`。在类的文档注释中写道“此类中的所有方法如果在任何参数中传递了空对象引用，都会抛出\
  \ `NullPointerException`”或类似的话是完全可以的。\n\n总而言之，请记录你编写的每个方法可能抛出的每一个异常。这对于未检查异常和受检异常、以及抽象方法和具体方法都是如此。这些文档应该以文档注释中\
  \ `@throws` 标签的形式存在。在方法的 `throws` 子句中单独声明每个受检异常，但不要声明未检查异常。如果你未能记录你的方法可能抛出的异常，其他人将难以或无法有效使用你的类和接口。\n\
  \n### 第 75 条目：在详细消息中包含详细的失败捕获信息\n\n当程序由于未捕获的异常而失败时，系统会自动打印出异常的堆栈跟踪（stack trace）。堆栈跟踪包含异常的\
  \ `string representation`，即调用其 `toString()` 方法的结果。这通常由异常的类名后跟其 `detail message`（详细消息）组成。程序员或站点可靠性工程师在调查软件故障时，这通常是他们拥有的信息。如果故障不易重现，可能很难或无法获取更多信息。因此，异常的\
  \ `toString()` 方法尽可能返回尽可能有关失败原因的信息是至关重要的。换句话说，异常的详细消息应该 `capture the failure` 以供后续分析。\n\
  \n为了捕获失败，异常的详细消息应该包含导致该异常的所有参数和字段的值。例如，`IndexOutOfBoundsException` 的详细消息应该包含下界、上限以及未能落在边界之间的索引值。这些信息反映了大量关于失败的情况。这三个值中的任何一个或全部都可能是错误的。索引可能比下界小\
  \ 1，或者等于上限（即“栅栏后错误”），也可能是一个离谱的值，太低或太高。下界可能大于上限（严重的内部不变量性失效）。这些情况中的每一种都指向一个不同的问题，如果你知道自己正在寻找什么样的错误，这将极大地有助于诊断。\n\
  \n有一个关于安全敏感信息的需要注意的地方。由于堆栈跟踪在诊断和修复软件问题的过程中可能会被许多人看到，请不要在详细消息中包含密码、加密密钥等内容。\n\n虽然在异常消息中包含所有相关数据至关重要，但包含大量的散文描述通常并不重要。堆栈跟踪旨在结合文档以及在必要时的源代码进行分析。它通常包含了抛出异常的精确文件和行号，以及栈上所有其他方法调用的文件和行号。对故障的长篇散文描述是多余的；可以通过可以通过文档和源代码获取。\n\
  \n异常的详细消息不应与用户级错误消息混淆，后者必须对终端用户是可以理解的。与用户级错误消息不同，详细消息主要为了程序员或站点可靠性工程师分析故障时的便利。因此，信息内容比可读性重要得多。用户级错误消息通常是\
  \ `localized`（本地化的），而异常详细消息很少是。\n\n确保异常在它们的详细消息中包含足够的失败捕获信息的一种方法，是在构造函数中要求这些信息，而不是一个字符串详细消息。然后详细消息可以自动生成以包含这些信息。例如，`IndexOutOfBoundsException`\
  \ 可以有一个像这样的构造函数，而不是 `String` 构造函数：\n\n```java\n/**\n * 构建一个 IndexOutOfBoundsException。\n\
  \ *\n * @param lowerBound 最合法的索引值\n * @param upperBound 最高合法的索引值加一\n * @param index\
  \      实际的索引值\n */\npublic IndexOutOfBoundsException(int lowerBound, int upperBound,\n\
  \                                  int index) {\n    // 生成一个捕获失败的详细消息\n    super(String.format(\n\
  \            \"Lower bound: %d, Upper bound: %d, Index: %d\",\n            lowerBound,\
  \ upperBound, index));\n    // 保存失败信息以便程序化访问\n    this.lowerBound = lowerBound;\n\
  \    this.upperBound = upperBound;\n    this.index = index;\n}\n```\n\n从 Java 9\
  \ 开始，`IndexOutOfBoundsException`终于获得了一个接受 `int` 类型 `index` 参数的构造函数，但遗憾的是它省略了 `lowerBound`\
  \ 和 `upperBound` 参数。更通用地说，Java 库没有大量使用这种用法，但强烈建议这样做。它让抛出异常的程序员很容易捕获失败。事实上，它让程序员很难不去捕获失败！\n\
  \n正如第 70 条目建议的那样，异常为失败捕获信息提供访问器方法可能是合适的。在受检异常上提供此类访问器方法比在未检查异常上重要，因为失败捕获信息可能对于从失败中恢复有用。程序员可能想要程序化地访问未检查异常的细节是罕见的（尽管并非不可想象）。然而，即使对于未检查异常，从原则上来说提供这些访问器似乎也是明智的。\n\
  \n### 第 76 条目：追求失败原子性\n\n对象抛出异常后，通常希望该对象仍然处于定义良好的、可用的状态，即使失败发生在执行操作的中途。这对于受检异常尤为如此，因为调用者被预期从中恢复。通常来说，失败的方法调用应该让对象保持在调用之前的状态。具有这种属性的方法被称为\
  \ `failure-atomic`（失败原子的）。\n\n有几种方法可以实现这种效果。最简单的方法是设计不可变对象。如果一个对象是不可变的，失败原子性就是免费的。如果操作失败，可能会阻止新对象的创建，但永远不会让现有对象处于不一致状态，因为每个状态在创建时是一致的，并且之后无法修改。\n\
  \n对于操作可变对象的方法，实现失败原子性的常见方法是在操作之前检查参数的有效性。这会导致大多数异常在对象修改之前抛出。例如，考虑 `Stack.pop()`\
  \ 方法：\n\n```java\npublic Object pop() {\n    if (size == 0) {\n        throw new\
  \ EmptyStackException();\n    }\n    Object result = elements[--size];\n    elements[size]\
  \ = null; // 消除过时的引用\n    return result;\n}\n```\n\n\n\n\n\n如果消除了初始的大小检查，该方法在尝试从空栈中弹出元素时仍然会抛出异常。然而，它会使\
  \ `size` 字段处于一种不一致的（负）状态，导致对该对象的任何后续方法调用都失败。此外，`pop` 方法抛出的 `ArrayIndexOutOfBoundsException`\
  \ 对于抽象来说是不合适的 (Item 73)）。\n\n实现失败原子性（failure atomicity）的另一种相关方法是调整计算顺序，使得任何可能失败的部分发生在修改对象的部分之前。当在不执行部分计算的情况下无法检查参数时，这种方法是前一种方法的自然扩展。例如，考虑\
  \ `TreeMap` 的情况，其元素根据某种排序进行排序。为了向 `TreeMap` 中添加元素，该元素必须是可以使用 `TreeMap` 排序进行比较的类型。尝试添加类型错误的元素，会在树被以任何方式修改之前，由于在树中搜索该元素，自然会抛出\
  \ `ClassCastException` 并失败。\n\n实现失败原子性的第三方法是在对象的临时副本上执行操作，一旦操作完成，就用临时副本替换对象的内容。当数据存储在临时数据结构中后可以更快地执行计算时，这种方法会自然产生。例如，某些排序函数在排序之前会将输入列表复制到数组中，以减少排序内部循环中访问元素的开销。这样做是为了性能，但作为一个额外的好处，它确保了如果排序失败，输入列表将不会被触动。\n\
  \n实现失败原子性的最后一种且远少见的方法是编写 `recovery code`（恢复代码），来拦截操作过程中发生的故障，并使对象的状态回滚到操作开始之前的点。这种方法主要用于持久化（基于磁盘）的数据结构。\n\
  \n虽然失败原子性通常是理想的，但它并不总是可以实现的。例如，如果两个线程尝试在没有适当同步的情况下并发修改同一个对象，该对象可能会留存在不一致的状态。因此，假设在捕获到\
  \ `ConcurrentModificationException` 后对象仍然可用是错误的。由于错误是不可恢复的，所以当在抛出 `AssertionError`\
  \ 时，你甚至不需要尝试保持失败原子性。\n\n即使在可能实现失败原子性的情况下，它也不总是理想的。对于某些操作，这会显著增加成本或复杂性。尽管如此，一旦你意识到这个问题，实现失败原子性通常是免费且容易的。\n\
  \n总结来说，作为一条规则，任何作为方法规范部分的生成的异常，都应该让对象保持在调用方法之前的原始状态。在违反这条规则的地方，API 文档应该清楚地指示对象将处于什么状态。遗憾的是，大量现有的\
  \ API 文档未能达到这一理想。\n\n### Item 77: 不要忽略异常\n\n虽然这个建议看起来是显而易见的，但它被违反的频率足够高，值得重复。当 API\
  \ 的设计者声明一个方法会抛出异常时，他们正试图告诉你一些信息。不要忽略它！通过将方法调用封装在 `try` 语句中，并让其 `catch` 块保持空，可以很容易地忽略异常：\n\
  \n点击此处查看代码图片\n\n```\n// 空 catch 块忽略了异常 - 非常可疑！\n\ntry {\n    ...\n} catch (SomeException\
  \ e) {\n}\n```\n\n空的 `catch` 块违背了异常的目的，异常的目的是迫使你处理异常情况。忽略异常等同于忽略火警报警器——并将其关闭，导致其他人没有机会查看是否真的有火灾。你可能会侥幸过关，但结果可能是灾难性的。每当你看到空的\
  \ `catch` 块时，脑中就应该响起警报。\n\n在某些情况下，忽略异常是合适的。例如，在关闭 `FileInputStream` 时可能是合适的。你没有改变文件的状态，所以不需要执行任何恢复操作，而且你已经从文件中读取了需要的信息，因此没有理由终止正在进行的操作。记录该异常也许是明智的，这样如果这些异常频繁发生，你就可以调查该问题。如果你选择忽略异常，`catch`\
  \ 块应该包含一条解释为什么这样做是合适的注释，并且变量应该命名为 `ignored:`：\n\n点击此处查看代码图片\n\n```\nFuture<Integer>\
  \ f = exec.submit(planarMap::chromaticNumber);\n\nint numColors = 4; // 默认值；保证适用于任何地图\n\
  \ntry {\n    numColors = f.get(1L, TimeUnit.SECONDS);\n} catch (TimeoutException\
  \ | ExecutionException ignored) {\n    // 使用默认值：最小着色是理想的，不是强制的\n}\n```\n\n此项中的建议同样适用于受检异常和未检异常。无论异常代表的是可预测的异常情况还是编程错误，用空的\
  \ `catch` 块忽略它都会导致程序在面对错误时静默运行。程序随后可能会在未来的任意时间失败，且失败位置的代码点与问题源之间没有显出的联系。妥善地处理异常可以完全避免失败。仅仅让异常向外传播，至少可以导致程序快速失败，并保留有助于调试的信息。\n\
  \n## 第 11 章: 并发\n\nTHREADS（线程）允许多个活动并发进行。并发编程比单线程编程更困难，因为可能会出现更多问题，而且失败难以重现。你无法避免并发。它是平台固有的特性，如果你想从多核处理器（现在已无处不在）中获得良好的性能，并发是必须的。本章包含了帮助你编写清晰、正确、文档良好的并发程序的建议。\n\
  \n### Item 78: 同步共享可变数据的访问\n\n`synchronized` 关键字确保同一时间只有一个线程执行方法或块。许多程序员仅将同步视为互斥的手段，以防止对象在被另一个线程修改时被一个线程观察到不一致的状态。在这种观点下，对象是在一致的状态下创建的\
  \ (Item 17) 并由访问它的方法锁定。这些方法观察状态并可选地导致状态转换，将对象从一个一致状态转换为另一个。正确使用同步可以保证没有任何方法会观察到对象的不一致状态。\n\
  \n这种观点是正确的，但只是故事的一。如果没有同步，一个线程的更改对其他线程可能是见的。同步不仅防止线程观察到对象的不一致状态，还确保进入同步方法或块的每个线程都能看到之前由相同锁保护的所有修改的影响。\n\
  \n语言规范保证读取或写入变量是原子的，除非该变量类型为 `long` 或 `double` [JLS, 17.4, 17.7]。换句话说，读取除 `long`\
  \ 或 `double` 以外的变量，保证会返回某个线程存储的值，即使多个线程在没有同步的情况下并发修改该变量。\n\n\n\n\n\n你可能会听到有人说，为了提高性能，在读取或写入原子数据时应该省略同步（synchronization）。这种建议是极其错误的。虽然语言规范保证了线程在读取字段时不会看到任意的值，但它并不保证一个线程写入的值对另一个线程可见。**线程之间的可靠通信以及互斥访问都需要同步。**\
  \ 这是这是由于语言规范中一个被称为`内存模型`（`memory model`）的部分决定的，该模型规定了一个线程所做的更改何时以及如何对其他线程可见 [JLS,\
  \ 17.4; Goetz06, 16]。\n\n即使数据是原子可读和原子可写的，如果未能对共享可变数据的访问进行同步，其后果也可能是灾难性的。考虑从一个线程停止另一个线程的任务。库提供了\
  \ `Thread.stop` 方法，但该方法很久以前就被废弃了，因为它从本质上来说是不安全的（`unsafe`）——使用它可能会导致数据损坏。**不要使用 `Thread.stop`。**\
  \ 停止另一个线程的推荐方法是让第一个线程轮询 `boolean` 字段，该字段初始为 `false`，但可以由第二个线程设置为 `true`，以指示第一个线程自行停止。由于读取和写入\
  \ `boolean` 字段是原子的，某些程序员在访问该字段时省略了同步：\n\n点击此处查看代码图像\n\n**// 坏了！- 你预计这个程序会运行多久？**\n\
  \n```java\npublic class StopThread {\n\n    private static boolean stopRequested;\n\
  \n    public static void main(String[] args)\n            throws InterruptedException\
  \ {\n        Thread backgroundThread = new Thread(() -> {\n            int i = 0;\n\
  \            while (!stopRequested)\n                i++;\n        });\n       \
  \ backgroundThread.start();\n        TimeUnit.SECONDS.sleep(1);\n        stopRequested\
  \ = true;\n    }\n}\n```\n\n你可能预计这个程序运行大约一秒，之后主线程将 `stopRequested` 设置为 `true`，导致后台线程的循环终止。但在我的机器上，该程序*永远*不会停止：后台线程在无限循环！\n\
  \n问题在于，在没有同步的情况下，无法保证后台线程何时（如果的话）能看到主线程对 `stopRequested` 值的更改。在没有同步的情况下，虚拟机完全可以转换这段代码：\n\
  \n```java\nwhile (!stopRequested)\n    i++;\n```\n\n变成下面的代码：\n\n```java\nif (!stopRequested)\n\
  \    while (true)\n        i++;\n```\n\n这种优化被称为 `hoisting`（提升），而这正是 OpenJDK Server\
  \ VM 所做的。结果导致了“活跃性失败”（`liveness failure`）：程序无法进展。解决此问题的方法之一是对 `stopRequested` 字段的访问进行同步。该程序如预期那样在约一秒后终止：\n\
  \n点击此处查看代码图像\n\n**// 正确同步的协作线程终止**\n\n```java\npublic class StopThread {\n\n   \
  \ private static boolean stopRequested;\n\n    private static synchronized void\
  \ requestStop() {\n        stopRequested = true;\n    }\n\n    private static synchronized\
  \ boolean stopRequested() {\n        return stopRequested;\n    }\n\n    public\
  \ static void main(String[] args)\n            throws InterruptedException {\n \
  \       Thread backgroundThread = new Thread(() -> {\n            int i = 0;\n \
  \           while (!stopRequested())\n                i++;\n        });\n      \
  \  backgroundThread.start();\n        TimeUnit.SECONDS.sleep(1);\n        requestStop();\n\
  \    }\n}\n```\n\n注意，写入方法（`requestStop`）和读取方法（`stopRequested()`）都是同步的。仅同步写入方法*是不够的*！**除非读和写操作都经过同步，否则无法保证同步有效。**\
  \ 有时只同步写入（或读取）的程序在某些机器上*看起来*运行正常，但在这种情况下，表象是误骗性的。\n\n即使没有同步，`StopThread` 中同步方法的操作也是原子的。换句话说，这些方法上的同步*仅*用于通信效应，而不是为了互斥。虽然在循环的每次迭代中进行同步的代价很小，但有一个更正确、更简洁且性能可能更好的替代方案。如果将\
  \ `stopRequested` 声明为 `volatile`，则省略 `StopThread` 第二个版本中的锁定。虽然 `volatile` 修饰符没有执行互斥，但它保证了任何线程都能看到最近写入的值：\n\
  \n点击此处查看代码图像\n\n**// 使用 volatile 字段的协作终止**\n\n```java\npublic class StopThread {\n\
  \    static volatile boolean stopRequested;\n\n    public static void main(String[]\
  \ args)\n            throws InterruptedException {\n        Thread backgroundThread\
  \ = new Thread(() -> {\n            int i = 0;\n            while (!stopRequested)\n\
  \                i++;\n        });\n        backgroundThread.start();\n        TimeUnit.SECONDS.sleep(1);\n\
  \        stopRequested = true;\n    }\n}\n```\n\n在使用 `volatile` 时必须非常小心。考虑以下方法，它本应该生成序列号：\n\
  \n点击此处查看代码图像\n\n**// 坏了 - 需要同步！**\n\n```java\nprivate static volatile int nextSerialNumber\
  \ = 0;\n\npublic static int generateSerialNumber() {\n    return nextSerialNumber++;\n\
  }\n```\n\n该方法的意图是保证每次调用都返回唯一的值（只要调用次数不超过 2³² 次）。该方法的状态由单个原子访问的字段 `nextSerialNumber`\
  \ 组成，且该字段的所有值都是合法的。因此，不需要同步来保护其不变性。尽管如此，在没有同步的情况下，该方法无法正常工作。\n\n问题在于自增运算符（`++`）不是原子的。它对\
  \ `nextSerialNumber` 字段执行了*两次*操作：首先读取值，然后写回旧值加一的值。如果第二个线程在一个线程读取旧值和写新值之间读取了字段，第二个线程将看到相同的值并返回相同的序列号。这是一个“安全性失败”（`safety\
  \ failure`）：程序计算了错误的结果。\n\n修复 `generateSerialNumber` 的一种方法是对声明添加 `synchronized`\
  \ 关键字。这确保了多次调用不会交叉，并且方法的每次调用都能看到之前所有调的影响。完成这些后，你可以并且应该移除 `nextSerialNumber` 的 `volatile`\
  \ 修饰符。为了确保万无一失，可以使用 `long` 代替 `int`，或者在 `nextSerialNumber` 将溢出时抛出异常。\n\n更好的做法遵循第\
  \ 59 条的建议，使用 `AtomicLong` 类，它是 `java.util.concurrent.atomic` 包。该包为单个变量提供了无锁、线程安全的原语。`volatile`\
  \ 仅提供同步的通信效应，而该包还提供了原子性。这正是 `generateSerialNumber` 所需要的，且其性能可能优于同步版本：\n\n点击此处查看代码图像\n\
  \n**// 使用 java.util.concurrent.atomic 实现无锁同步**\n\n```java\nprivate static final\
  \ AtomicLong nextSerialNum = new AtomicLong();\n\npublic static long generateSerialNumber()\
  \ {\n    return nextSerialNum.getAndIncrement();\n}\n```\n\n\n\n\n避免本项所讨论问题的最佳方法是不共享可变数据。要么共享不可变数据（第\
  \ 17 条），要么完全不共享。换句话说，`将可变数据限制在单个线程中`。如果你采用了这一策略，那么将其记录下来是非常重要的，这样随着程序的演进，该策略才能得以维持。此外，深入理解你正在使用的框架和库也很重要，因为它们可能会引入你无法察觉的线程。\n\
  \n允许一个线程修改数据对象一段时间，然后将其与其他线程共享，这是可以的，只需对共享对象引用的行为进行同步。只要该对象不再被修改，其他线程就可以读取该对象，而无需进一步的同步。这样的对象被称为`有效不可变`\
  \ [Goetz06, 3.5.4]。将此类对象引用从一个线程转移到其他线程被称为`安全发布` [Goetz06, 3.5.3]。安全发布对象引用的方法有很多：你可以将其作为类初始化的一部分存储在静态字段中；你可以将其存储在\
  \ `volatile` 字段、`final` 字段或通过普通锁访问的字段中；或者，你可以将其放入并发集合（第 81 条）中。\n\n总之，`当多个线程共享可变数据时，每个读取或写入数据的线程都必须执行同步。`在没有同步的情况下，无法保证一个线程的更改对另一个线程可见。未能同步共享可变数据的代价是存活性失败和安全性失败。这些失败是最难调试调试的错误之一。它们可能是间歇性的且依赖于时间的，并且程序行为在不同的虚拟机（VM）之间可能会发生巨大变化。如果你只需要线程间的通信而不需要互斥，那么\
  \ `volatile` 修饰符是一种可以接受的同步形式，但要正确使用它可能很棘手。\n\n### 第 79 条：避免过度同步\n\n第 78 条警告了同步不足的危险。本项涉及的是相反的问题。根据情况的不同，过度同步会导致性能下降、死锁甚至非确定性行为。\n\
  \n`为了避免存活性失败和安全性失败，永远不要在同步方法或同步块中将控制权交给客户端。`换句话说，在同步区域内部，不要调用设计用于重写的方法，或由客户端以函数对象形式提供的方法（第\
  \ 24 条）。从同步区域类的角度来看，这些方法是`外来的`（alien）的。该类不知道该方法在做什么，也对其没有控制。取决于外来方法的操作，从同步区域调用它可能会导致异常、死锁或数据损坏。\n\
  \n为了具体说明，请考虑以下类，它实现了一个可观察的（observable）集合封装器。它允许客户端在元素添加到集合时订阅通知。这是`观察者`模式 [Gamma95]。为了简单起见，该类在元素从集合中移除时不提供通知，但提供这些通知也很简单。该类是基于第\
  \ 18 条（第 90 页）中可重用的 `ForwardingSet` 实现的：\n\n点击此处查看代码图像\n\n```java\n// 错误 - 在同步块中调用了外来方法！\n\
  \npublic class ObservableSet<E> extends ForwardingSet<E> {\n\n    public ObservableSet(Set<E>\
  \ set) { super(set); }\n\n    private final List<SetObserver<E>> observers = new\
  \ ArrayList<>();\n\n    public void addObserver(SetObserver<E> observer) {\n   \
  \     synchronized(observers) {\n            observers.add(observer);\n        }\n\
  \    }\n\n    public boolean removeObserver(SetObserver<E> observer) {\n       \
  \ synchronized(observers) {\n            return observers.remove(observer);\n  \
  \      }\n    }\n\n    private void notifyElementAdded(E element) {\n        synchronized(observers)\
  \ {\n            for (SetObserver<E> observer : observers)\n                observer.added(this,\
  \ element);\n        }\n    }\n\n    @Override public boolean add(E element) {\n\
  \        boolean added = super.add(element);\n        if (added) {\n           \
  \ notifyElementAdded(element);\n        }\n        return added;\n    }\n\n    @Override\
  \ public boolean addAll(Collection<? extends E> c) {\n        boolean result = true;\n\
  \        for (E e : c) {\n            if (!add(e)) {\n                result = false;\n\
  \                break;\n            }\n        }\n        return result;\n    }\n\
  }\n\n@FunctionalInterface\ninterface SetObserver<E> {\n    void added(ObservableSet<E>\
  \ set, E element);\n}\n```\n\n\n\n\n```java\npublic void added(ObservableSet<Integer>\
  \ s, Integer e) {\n    System.out.println(e);\n    if (e == 23) {\n        ExecutorService\
  \ exec =\n            Executors.newSingleThreadExecutor();\n        try {\n    \
  \        exec.submit(() -> s.removeObserver(this)).get();\n        } catch (ExecutionException\
  \ | InterruptedException ex) {\n            throw new AssertionError(ex);\n    \
  \    } finally {\n            exec.shutdown();\n        }\n    }\n}\n```\n\n顺便提一下，这个程序在一个\
  \ catch 子句中捕获了两种不同类型的异常。这种非正式称为 `multi-catch` 的功能是在 Java 7 中引入的。对于响应多种异常类型具有相同行为的程序，它可以极大地提高清晰度并减少程序体积。\n\
  \n当我们运行这个程序时，我们并没有得到异常，而是得到了死锁。后台线程调用 `s.removeObserver`，它尝试锁定 `observers`，但它无法获取锁，因为主线程已经拥有锁。在此期间，主线程一直在等待后台线程完成观察者的移除，这解释了死锁的原因。\n\
  \n这个例子是人为构造的，因为没有理由让观察者使用后台线程来取消订阅自己，但问题是真实的。在同步区域内部调用外部方法（alien methods）已经在真实系统（如\
  \ GUI 工具包）中导致许多死锁。\n\n在之前的两个例子（异常和死锁）中，我们是幸运的。当调用外部方法（`added`）时，由同步区域保护的资源（`observers`）处于一致状态。假设你在同步区域内调用一个外部方法，而同步区域保护的不变性暂时失效了。由于\
  \ Java 编程语言中的锁是**重入的（`reentrant`）**，此类调用不会导致死锁。正如产生异常的第一个例子一样，调用线程已经持有了锁，因此当它尝试重新获取锁时将成功，尽管在被锁保护的数据上正在进行另一个在概念上互不相关的操作。这种失败的后果可能是灾难性的。本质上，锁未能完成它的工作。重入锁简化了多线程面向对象程序的构建，但它们可能会将活性失败（liveness\
  \ failures）转化为安全性失败。\n\n幸运的是，通过将外部方法的调用移到同步块之外，修复这类问题通常并不困难。对于 `notifyElementAdded`\
  \ 方法，这涉及对 `observers` 列表获取一个“快照”，然后可以在没有锁的情况下安全地遍历。有了这一更改，之前的两个例子都可以在无异常或死锁的情况下运行：\n\
  \n点击此处查看代码图像\n\n#### // 将外部方法移动到同步块之外 - 开放调用\n\n```java\nprivate void notifyElementAdded(E\
  \ element) {\n    List<SetObserver<E>> snapshot = null;\n    synchronized(observers)\
  \ {\n        snapshot = new ArrayList<>(observers);\n    }\n    for (SetObserver<E>\
  \ observer : snapshot)\n        observer.added(this, element);\n}\n```\n\n事实上，有一种更好的方法将外部方法的调用移出同步块。库提供了一种名为\
  \ `CopyOnWriteArrayList`（Item 81）的并发集合（concurrent collection），它是专门为此目的量身定制的。这个 `List`\
  \ 实现是 `ArrayList` 的变体，其中所有的修改操作都是通过创建整个底层数组的新副本来实现的。由于内部数组从不被修改，因此迭代不需要锁定且速度非常快。对于大多数用例，`CopyOnWriteArrayList`\
  \ 的性能会非常糟糕，但它对于很少修改且经常遍历的观察者列表来说是完美的。\n\n如果将列表改为使用 `CopyOnWriteArrayList`，则 `ObservableSet`\
  \ 的 `add` 和 `addAll` 方法不需要更改。以下是类的其余部分的 l。注意，这里没有任何显式的同步：\n\n点击此处查看代码图像\n\n####\
  \ // 使用 CopyOnWriteArrayList 的线程安全观察集合\n\n```java\nprivate final List<SetObserver<E>>\
  \ observers =\n    new CopyOnWriteArrayList<>();\n\npublic void addObserver(SetObserver<E>\
  \ observer) {\n    observers.add(observer);\n}\n\npublic boolean removeObserver(SetObserver<E>\
  \ observer) {\n    return observers.remove(observer);\n}\n\nprivate void notifyElementAdded(E\
  \ element) {\n    for (SetObserver<E> observer : observers)\n        observer.added(this,\
  \ element);\n}\n```\n\n在同步区域之外调用的外部方法被称为**开放调用（`open call`）** [Goetz06, 10.1.4]。除了防止失败外，开放调用还能极地提高并发性。外部方法可能会运行任意。如果从同步区域调用外部方法，其他线程将无法访问受保护的资源。\n\
  \n**原则上，你应该在同步区域内尽可能少地工作。** 获取锁，检查共享数据，根据需要对其转换，然后释放锁。如果你必须执行某些耗时活动，请设法将其移出同步区域，且不要违反\
  \ Item 78 中的指南。\n\n本项目的第一部分是关于正确性的。现在让我们简单看看性能。虽然自 Java 早期以来同步的成本已经大幅下降，但不过度同步比以往任何时候都重要。在多核世界中，过度同步的真实代价不是获取锁消耗的\
  \ CPU 时间，而是**竞争（`contention`）**：丢失的并行机会以及为了确保每个核心都有一致内存视图而引入的延迟。过度同步的另一个隐藏成本是它会限制虚拟机优化代码的能力。\n\
  \n如果你正在编写一个可变类，你有两个选择：你可以省略所有同步，并在需要并发时允许客户端进行外部同步；或者你可以进行内部同步，使类**线程安全（`thread-safe`）**（Item\
  \ 82）。只有当你通过内部同步实现的并发性明显高于客户端锁定整个对象时，才应该选择后者。`java.util` 中的集合（过时的 `Vector` 和 `Hashtable`\
  \ 除外）采用了前者的方法，而 `java.util.concurrent` 中的集合采用了后者（Item 81）。\n\n在 Java 早期，许多类违反了这些指南。例如，`StringBuffer`\
  \ 实例几乎总是单线程使用的，但它们执行内部同步。正因为这个原因，`StringBuffer` 被 `StringBuilder` 取代了。同样，`java.util.Random`\
  \ 中线程安全的随机数生成器被 `java.util.concurrent.ThreadLocalRandom` 中的非同步实现取代，这也是很大一部分原因。如果不确定，**不要**同步你的类，但要说明它不是线程安全的。\n\
  \n如果你确实在类内部进行同步，可以使用各种技术来实现高并发，例如锁拆分（lock splitting）、锁分段（lock striping）和非阻塞并发控制（nonblocking\
  \ concurrency control）。这些技术超出了本书的范围，但在其他地方有讨论 [Goetz06, Herlihy08]。\n\n\n\n\n如果一个方法修改了静态字段，并且该方法有被多个线程调用的可能，那么你*必须*在内部对该字段的访问进行同步（除非该类能够忍非确定性行为）。多线程客户端无法对此类方法执行外部同步，因为无关的客户端可以在不进行同步的情况下调用该方法。即使该字段是私有的，它本质上也是一个全局变量，因为它可以被无关的客户端读取和修改。条目\
  \ 78 中 `generateSerialNumber` 方法使用的 `nextSerialNumber` 字段就说明了这种情况。\n\n总结来说，为了避免死锁和数据损坏，永远不要在同步区域内部调用外部方法（alien\
  \ method）。更通俗地说，将你在同步区域内执行的工作量减少到最低。当你设计一个可变类时，要考虑它是否应该处理自己的同步。在多核时代，避免过度同步比以往任何时候都重要。只有在有充分理由的情况下，才对类内部进行同步，并清楚地记录你的决策（条目\
  \ 82）。\n\n### 条目 80：优先使用执行器、任务和流，而不是线程\n\n本书的第一版包含了一个简单*工作队列*的代码 [Bloch01, 条目 49]。该类允许客户端将工作存入队列，由后台线程进行异步处理。当工作队列不再需要时，客户端可以调用一个方法让后台线程在完成队列中的任何现有工作后自终止。该实现仅仅是一个玩具，但尽管如此，它仍然需要一整页微妙且复杂的代码，这类代码如果处理不恰当，很容易导致安全和活性故障。幸运的是，现在已经没有必要编写这种代码了。\n\
  \n当本书的第二版出版时，`java.util.concurrent` 已被添加到 Java 中。这个包包含一个*执行器框架*（Executor Framework），这是一个灵活的基于接口的任务执行设施。创建一个在各个方面都优于本书第一版中工作队列，只需要一行代码：\n\
  \n点击此处查看代码图像\n\n```\nExecutorService exec = Executors.newSingleThreadExecutor();\n\
  ```\n\n以下是提交一个可运行任务进行执行的方法：\n\n```\nexec.execute(runnable);\n```\n\n以及如何告诉执行器优雅地终止（如果你没有做到这一点，你的虚拟机可能不会退出）：\n\
  \n```\nexec.shutdown();\n```\n\n你还可以使用执行器服务做更多事情。例如，你可以等待特定任务完成（使用 `get` 方法，如 条目\
  \ 79 第 319 页所示），你可以等待一组任务中的任何一个或所有任务完成（使用 `invokeAny` 或 `invokeAll` 方法），你可以等待执行器服务终止（使用\
  \ `awaitTermination` 方法），你可以在任务完成时逐一获取其结果（使用 `ExecutorCompletionService`），你可以调度任务在特定时间运行或定期运行（使用\
  \ `ScheduledThreadPoolExecutor`），等等。\n\n如果你想用多个一个线程来处理来自队列的请求，只需调用不同的静态工厂，该工厂会创建一个不同类型的执行器服务，这种服务被称为*线程池*。你可以创建一个具有固定或可变数量线程的线程池。`java.util.concurrent.Executors`\
  \ 类包含了静态工厂，可以提供你可能需要的大多数执行器。然而，如果你想要一些不寻常的东西，可以直接使用 `ThreadPoolExecutor` 类。该类允许你配置线程池操作的几乎每一个方面。\n\
  \n为特定应用程序选择执行器服务可能是很棘手的。对于小型程序或轻负载服务器，`Executors.newCachedThreadPool` 通常是一个很好的选择，因为不需要配置且通常能“做正确的事”。但对于高负载的生产环境服务器，缓存线程池并不是一个好选择！在缓存线程池中，提交的任务不会进入队列，而是被立即交给一个线程执行。如果没有可用线程，就会创建一个新的。如果服务器负载过高，导致所有\
  \ CPU 满满载且有更多任务到达，就会创建更多线程，这只会使情况更恶化。因此，在高负载的生产环境服务器中，使用 `Executors.newFixedThreadPool`\
  \ 要好得多，它为你提供一个具有固定数量线程的池；或者直接使用 `ThreadPoolExecutor` 类以获得最大的控制权。\n\n你不应该避免编写自己的工作队列，而且通常应该避免直接与线程打交道。当你直接与线程打交道时，`Thread`\
  \ 既是工作单元又是执行机制。在执行器框架中，工作单元和执行机制是分离的。核心抽象是工作单元，即*任务*。任务有两种类型：`Runnable` 及其紧密亲戚 `Callable`（它类似于\
  \ `Runnable`，区别在于它可以返回一个值并可以抛出任意异常）。执行任务的通用机制是*执行器服务*。如果你从任务的角度来思考并让执行器服务为你执行它们，你就获得了灵活性来选择合适的执行策略以满足你的需求，并在需求变化时更改策略。本质上说，执行器框架对执行所做的，就像集合框架对聚合所做的那样。\n\
  \n在 Java 7 中，执行器框架被扩展以支持 fork-join 任务（分支合并任务），这种任务由一种名为 fork join pool（分支合并池）的特殊执行器服务运行。fork-join\
  \ 任务由 `ForkJoinTask` 实例，可以分成更小的子任务，而 `ForkJoinPool` 的线程不仅处理这些任务，还会相互“窃”任务以确保所有线程都忙碌，从而提高\
  \ CPU 利用率、吞吐量并降低延迟。编写和调试 fork-join 任务是复杂的。并行流（条目 48）是基于连接池编写的，允许你以较小的努力利用它们的性能优势，前提它们适用于当前任务。\n\
  \n对执行器框架的完整处理超出了本书的范围，但感兴趣的读者被推荐阅读 *Java Concurrency in Practice* [Goetz06]。\n\n\
  ### 条目 81：优先使用并发工具而不是 wait 和 notify\n\n本书的第一版有一个章节介绍了正确使用 `wait` 和 `notify` [Bloch01,\
  \ 条目 50]。它的建议仍然有效，并在条目的末尾进行了总结，但这些建议现在比以前重要得多。这是因为使用 `wait` 和 `notify` 的理由少多了。从\
  \ Java 5 开始，平台提供了高级别的并发工具，可以完成你以前必须在 `wait` 和 `notify` 之上手动编写的工作。鉴于正确使用 `wait` 和\
  \ `notify` 的困难，你应该使用更高级别的并发工具。\n\n`java.util.concurrent` 中的高级别工具分为三类：执行器框架（已在 条目\
  \ 80 中简要介绍）；并发集合；以及同步器。并发集合和同步器将在本条目中简要介绍。\n\n\n\n并发集合是标准集合接口（如 `List`、`Queue` 和\
  \ `Map`）的高性能并发实现。为了提供高并发，这些实现会在内部管理自身的同步（Item 79）。因此，`无法从并发集合中排除并发活动；对其加锁只会减慢程序速度。`\n\
  \n由于你无法在并发集合上排除并发活动，因此无法在它们上原子性地组合方法调用。因此，并发集合接口配备了`依赖于状态的修改操作`，这些操作将多个原语组合成单个原子操作。这些操作在并发集合上被证明非常有用，因此它们在\
  \ Java 8 中通过默认方法被添加到相应的集合接口中（Item 21）。\n\n例如，`Map` 的 `putIfAbsent(key, value)` 方法在键不存在时为该键插入映射，并返回与该键关联的旧值；如果不存在，则返回\
  \ `null`。这使得实现线程安全的规范化映射（canonicalizing maps）变得简单。该方法模拟了 `String.intern` 的行为：\n\n\
  点击此处查看代码图像\n\n```\n// 基于 ConcurrentMap 实现的并发规范化映射 -并非最优\nprivate static final ConcurrentMap<String,\
  \ String> map =\n    new ConcurrentHashMap<>();\n\npublic static String intern(String\
  \ s) {\n    String previousValue = map.putIfAbsent(s, s);\n    return previousValue\
  \ == null ? s : previousValue;\n}\n```\n\n事实上，你可以做得更好。`ConcurrentHashMap` 针对检索操作（如\
  \ `get`）进行了优化。因此，值得先调用 `get`，只有当 `get` 表明有必要时才调用 `putIfAbsent`：\n\n点击此处查看代码图像\n\n\
  ```java\n// 基于 ConcurrentMap 实现的并发规范化映射 - 更快！\npublic static String intern(String\
  \ s) {\n    String result = map.get(s);\n    if (result == null) {\n        result\
  \ = map.putIfAbsent(s, s);\n        if (result == null)\n            result = s;\n\
  \    }\n    return result;\n}\n```\n\n除了提供出色的并发性外，`ConcurrentHashMap` 还非常快。在我的机器上，上述\
  \ `intern` 方法比 `String.intern` 快六倍以上（但请记住 `String.intern` 必须采用某些策略来防止在长时间运行的应用中内存泄漏）。并发集合使得同步集合大部分过时。例如，优先使用\
  \ `ConcurrentHashMap` 而非 `Collections.synchronizedMap`……。只需将同步映射替换为并发映射即可大幅提高并发应用的性能。\n\
  \n某些集合接口扩展了`阻塞操作`，这些操作会等待（或`阻塞`）直到可以成功执行为止。例如，`BlockingQueue` 扩展了 `Queue` 并添加了几个方法，包括\
  \ `take`，它移除并返回队列头元素，如果队列为空则等待。这允许阻塞队列用于`工作队列`（也称为生产者-消费者队列），一个或多个`生产者线程`向其入队任务项，一个或多个`消费者线程`在项目可用时从从中取出并处理。正如你预期的，大多数\
  \ `ExecutorService` 实现（包括 `ThreadPoolExecutor`）都使用 `BlockingQueue`（Item 80）。\n\n\
  `同步器`（Synchronizers）是允许线程相互等待、以便它们协调活动的对象。最常用的同步器是 `CountDownLatch` 和 `Semaphore`。较少用的是\
  \ `CyclicBarrier` 和 `Exchanger`。最强大的同步器是 `Phaser`。\n\n倒计数器（Countdown latches）是单次屏障，允许一个或多个线程等待一个或多个线程完成某些操作。`CountDownLatch`\
  \ 的唯一构造函数接收一个 `int` 参数，该参数表示在所有等待线程允许继续之前，计数器上必须调用 `countDown` 方法的次数。\n\n在这个简单的原语之上构建实用的东西异常地简单。例如，假设你想构建一个简单的框架为动作的并发执行计时。该框架由单个方法组成，接收一个用于执行动作的\
  \ `executor`、一个代表并发执行动作数量的并发级别，以及一个代表动作的 `Runnable`。所有工作线程在计时线程启动闹钟之前都准备好执行该动作。当最后一个工作线程准备好执行动作时，计时线程“发发令枪”，允许工作线程执行动作。一旦最后一个工作线程完成动作执行，计时线程就会停止闹钟。直接在\
  \ `wait` 和 `notify` 之上实现这种逻辑至少是混乱的，但在 `CountDownLatch` 之上实现却异常地直观：\n\n点击此处查看代码图像\n\
  \n```java\n// 用于并发执行计时的简单框架\npublic static long time(Executor executor, int concurrency,\n\
  \                       Runnable action) throws InterruptedException {\n    CountDownLatch\
  \ ready = new CountDownLatch(concurrency);\n    CountDownLatch start = new CountDownLatch(1);\n\
  \    CountDownLatch done = new CountDownLatch(concurrency);\n    for (int i = 0;\
  \ i < concurrency; i++) {\n        executor.execute(() -> {\n            ready.countDown();\
  \ // 告诉计时器我们准备好了\n            try {\n                start.await(); // 等待同伴准备就绪\n\
  \                action.run();\n            } catch (InterruptedException e) {\n\
  \                Thread.currentThread().interrupt();\n            } finally {\n\
  \                done.countDown(); // 告诉计时器我们完成了\n            }\n        });\n \
  \   }\n    ready.await(); // 等待所有工作线程准备就绪\n    long startNanos = System.nanoTime();\n\
  \    start.countDown(); // 开始执行！\n    done.await(); // 等待所有工作线程完成\n    return System.nanoTime()\
  \ - startNanos;\n}\n```\n\n注意，该方法使用了三个倒计数器。第一个 `ready` 用于工作线程告知计时器它们已准备就绪。然后，工作线程在第二个屏障\
  \ `start` 上等待。当最后一个工作线程调用 `ready.countDown()` 时，计时线程记录开始时间并调用 `start.countDown()`，允许所有工作线程继续。然后计时线程等待第三个屏障\
  \ `done`，直到最后一个工作线程运行动作并调用 `done.countDown()`。一旦这种情况发生，计时线程醒来并记录结束时间。\n\n还有一些细节值得注意。传递给\
  \ `time` 方法的 `executor` 必须能够创建至少与并发级别相同的线程，否则测试将永远不会完成这被称为*线程饥饿死锁* [Goetz06, 8.1.1]。如果工作线程捕获到\
  \ `InterruptedException`，它会使用 `Thread.currentThread().interrupt()` 惯用法重新设置中断并从其\
  \ `run` 方法返回。这允许 `executor` 以其认为合适的方式处理中断。注意 `System.nanoTime` 对活动进行计时。**对于间隔计时，请始终使用\
  \ `System.nanoTime` 而非 `System.currentTimeMillis`。** `System.nanoTime` 更加准确且更精确，并且不受系统实时钟调整的影响。最后，请注意，除非\
  \ `action` 执行相当的工作（例如一秒或更多），否则此示例中的代码无法产生准确的计时。准确的微基准测试是著名的难题，最好借助诸如 jmh 等专用框架来完成\
  \ [JMH]。\n\n\n\n\n\n此项仅涉及了并发工具所能实现的功能的一角。例如，上一个示例中的三个倒计时锁（countdown latches）可以被单个\
  \ `CyclicBarrier` 或 `Phaser` 实例所替换。生成的代码会更简洁一些，但可能更难理解。\n\n虽然你应该始终优先使用并发工具而不是 `wait`\
  \ 和 `notify`，但你可能需要维护使用 `wait` 和 `notify` 的旧代码。`wait` 方法用于让线程等待某些条件。它必须在 `synchronized`\
  \ 区域内部调用，且该区域必须锁定被调用的对象。以下是使用 `wait` 方法的标准惯用法：\n\n点击此处查看代码图像\n\n```java\n// 使用 wait\
  \ 方法的标准惯用法\nsynchronized (obj) {\n    while (<condition does not hold>)\n      \
  \  obj.wait(); // (释放锁，并在唤醒时重新获取)\n    ... // 执行符合条件的操作\n}\n```\n\n务必使用 wait 循环惯用法来调用\
  \ `wait` 方法；绝不要在循环之外调用它。循环用于在等待前后测试条件。\n\n在等待前测试条件以及在条件已满足时跳过等待，对于确保存活性（liveness）是必要的。如果条件已经满足且在线程等待之前\
  \ `notify`（或 `notifyAll`）方法已经被调用，则无法保证该线程会从等待中唤醒。\n\n在等待后测试条件并在条件不满足时再次等待，对于确保安全性（safety）是必要的。如果线程在条件不时不继续执行操作，可能会破坏由锁保护的不变量。有几个原因导致线程在条件不满足时唤醒：\n\
  \n- 另一个线程可能在线程调用 `notify` 与等待线程唤醒之间获取了锁并改变了受保护的状态。\n- 另一个线程可能在条件不时不无意或恶意地调用了 `notify`。类通过在公共可访问的对象上等待，会暴露于这种恶意行为之下。公共访问对象的\
  \ `synchronized` 方法中的任何 `wait` 都容易受到此类的影响。\n- 通知线程在唤醒等待线程时可能过于“慷慨”。例如，即使只有部分等待线程满足了条件，通知线程也可能调用\
  \ `notifyAll`。\n- 等待线程可能会（罕见地）在没有 `notify` 的情况下唤醒。这被称为自发唤醒 [POSIX, 11.4.3.6.1; Java9-api]。\n\
  \n一个相关问题是使用 `notify` 还是 `notifyAll` 来唤醒等待线程。（记住 `notify` 唤醒一个等待线程（假设存在这样一个线程），而\
  \ `notifyAll` 唤醒所有等待线程。）有人说，你应该始终使用 `notifyAll`。这是一个合理且保守的建议。它始终会产生正确的结果，因为它保证了你会唤醒那些需要唤醒的线程。你可能也会唤醒其他线程，但这不会影响你程序的正确性。这些线程会检查它们正在等待的条件，发现在为假后将继续等待。\n\
  \n作为一种优化，如果所有处于等待集中的线程都在等待同一个条件，且一次时间只有一个线程能从条件变为真中获益，你可以选择调用 `notify` 代替 `notifyAll`。\n\
  \n即使满足了这些前提条件，也可能需要使用 `notifyAll` 代替 `notify`。正如将 `wait` 调用放在循环中可以防止对公共可访问对象的意外或恶意的通知，使用\
  \ `notifyAll` 代替 `notify` 可以防止无关线程的意外或恶意的等待。否则，这些等待可能会“吞掉”一个关键通知，导致其预期的接收者无限等待。\n\
  \n总而言之，直接使用 `wait` 和 `notify` 就像在编写“并发汇编语言”，相比之下，`java.util.concurrent` 提供了更高层次语言。在新代码中很少（甚至没有）使用\
  \ `wait` 和 `notify` 的理由。如果你维护使用 `wait` 和 `notify` 的代码，请确保它始终在 `while` 循环内部使用标准惯用法调用\
  \ `wait`。通常应优先使用 `notifyAll` 代替 `notify`。如果使用 `notify`，必须非常小心以确保存活性。\n\n### 项目 82：记录线程安全性\n\
  \n一个类在方法被并发使用时的行为是其与客户端约的重要部分。如果你未能记录类行为的这方面内容，其用户将被迫做出假设。如果这些假设是错误的，结果程序可能会出现同步不足（项目\
  \ 78）或同步过度（项目 79）的情况。在任何情况下，都可能导致严重错误。\n\n你可能会听到说，可以通过查看文档中的 `synchronized` 修饰符来判断方法是否是线程安全的。这在多个方面都是错误的。在正常运行时，Javadoc\
  \ 的输出中不包含 `synchronized` 修饰符，这是很有道理的。方法声明中 `synchronized` 修饰符的存在是一个实现细节，而不是 API\
  \ 的一部分。它不能可靠地指示一个方法是线程安全的。\n\n此外，认为 `synchronized` 修饰符的存在足以记录线程安全性的观点，体现了一种误解，即线程安全性是一个全有全无的属性。事实上，线程安全性有多个级别。为了实现安全的并发使用，类必须清楚地记录它支持什么种程度线程安全性。以下列表总结了线程安全性的级别。它不是详尽的，但涵盖了常见情况：\n\
  \n- **不可变（Immutable）**——该类的实例是常量。不需要外部同步。示例包括 `String`、`Long` 和 `BigInteger`（项目\
  \ 17）。\n- **无条件安全（Unconditionally thread-safe）**——该类的实例是可变的，但该类具有足够的内部同步，使其实例可以在不需要任何外部同步的情况下并发使用。示例包括\
  \ `AtomicLong` 和 `ConcurrentHashMap`。\n- **条件安全（Conditionally thread-safe）**——类似于无条件安全，但某些方法需要外部同步才能安全并发使用。示例包括\
  \ `Collections.synchronized` 包装器返回的集合，其迭代器需要外部同步。\n- **非线程安全（Not thread-safe）**——该类的实例是可变的。要并发使用它们，必须使用选择的外部同步封装每个方法调用（或调用序列）。示例包括通用集合实现，如\
  \ `ArrayList` 和 `HashMap`。\n- **线程敌性（Thread-hostile）**——即使每个方法调用都被外部同步保护，该类对于并发使用是不安全的。线程敌性通常源于在同步的情况下修改静态数据。没有人故意编写线程敌性类；此类类通常是由于没有考虑并发。当发现类或方法具有线程敌性时，通常会修复或废弃。项目\
  \ 78 中的 `generateSerialNumber` 方法在缺乏内部同步的情况下将是线程敌性的，正如第 322 页所讨论的那样。\n\n这些类别（线程敌性除外）大致对应于《Java\
  \ 并发编程》中的*线程安全性注解*，即 `Immutable`、`ThreadSafe` 和 `NotThreadSafe` [Goetz06, 附录 A]。上述分类法中的“无条件安全”和“条件安全”类别都由\
  \ `ThreadSafe` 注解涵盖。\n\n\n\n\n记录条件线程安全的类（conditionally thread-safe class）需要格外。你必须指示哪些调用序列需要外部同步，以及执行这些序列时必须获取哪个锁（在少数情况下是多个锁）。通常情况下，锁是实例本身的锁，但也有例外。例如，`Collections.synchronizedMap`\
  \ 的文档是这样说的：\n\n用户在迭代其任何集合视图时，必须手动对返回的 map 进行同步处理：\n\n点击此处查看代码图片\n\n```java\nMap<K,\
  \ V> m = Collections.synchronizedMap(new HashMap<>());\n\nSet<K> s = m.keySet();\
  \  // 不需要放在同步块中\n\n    ...\n\nsynchronized(m) {  // 对 m 进行同步，而不是对 s！\n    for (K\
  \ key : s)\n        key.f();\n}\n```\n\n不遵守此建议可能会导致非确定性的行为。\n\n类线程安全性的描述通常属于该类的文档注释（doc\
  \ comment），但具有特殊线程安全属性的方法应该在它们自己的文档注释中描述这些属性。没有必要记录枚举类型（enum types）的不可变性。除非从返回值类型显而易见，否则静态工厂（static\
  \ factories）必须记录返回对象的线程安全性，如上面的 `Collections.synchronizedMap` 所示。\n\n当一个类承诺使用公共访问的锁时，它允许客户端原子化地执行一系列方法调用，但这种灵活性是需要代价的。它与高性能的内部并发控制不兼容，即像\
  \ `ConcurrentHashMap` 等并发集合所使用的那种。此外，客户端可以通过长时间持有公共访问的锁来发起拒绝服务攻击（denial-of-service\
  \ attack）。这可能是无意的，也可能是故。\n\n为了防止这种拒绝服务攻击，你可以使用 `private lock object` 而不是使用同步方法（同步方法隐含了一个公共可访问的锁）：\n\
  \n点击此处查看代码图片\n\n```java\n// 私有锁对象范式 -  thwart 拒绝服务攻击\nprivate final Object lock\
  \ = new Object();\n\npublic void foo() {\n    synchronized(lock) {\n        ...\n\
  \    }\n}\n```\n\n由于私有锁对象在类外部不可访问，客户端无法干扰该对象的同步。实际上，我们通过将锁对象封装在它所同步的对象体中，应用了 Item\
  \ 15 的建议。\n\n注意 `lock` 字段被声明为 `final`。这防止了你无意中更改其内容，可能会导致灾难性的未同步访问 (Item 78)）。我们通过最小化\
  \ `lock` 字段的变变性，应用了 Item 17 的建议。锁字段应该始终声明为 `final`。无论你使用普通的显示器锁（如上所示）还是来自 `java.util.concurrent.locks`\
  \ 包的锁，都是如此。\n\n私有锁对象范式只能用于**无条件**的（unconditionally）线程安全的类。条件线程安全的类不能使用这种范式，因为它们必须记录客户端在执行某些方法调用序列时应该获取哪个锁。\n\
  \n私有锁对象范式特别适用于为继承设计的类（Item 19）。如果此类类使用其实例进行锁定，子类可能会很容易且无意地干扰基类的操作，反之亦然。通过为不同的目的使用同一个锁，子类和基类最终可能会“互相绊脚”。这不仅仅是一个理论问题；它在\
  \ `Thread` 类中发生过 [Bloch05, Puzzle 77]。\n\n总结来说，每个类都应该通过用词严谨的散文描述或线程安全性注解来清晰地记录其线程安全性属性。`synchronized`\
  \ 修饰符在这些文档中不起任何作用。条件线程安全的类必须记录哪些方法调用序列需要外部同步，以及在执行这些序列时应获取哪个锁。如果你编写无条件线程安全的类，请考虑使用私有锁对象代替同步方法。这可以保护你免受客户端和子类的同步干扰，并让你有更大的灵活性在稍后的发布版本中采用更复杂的并发控制方法。\n\
  \n### Item 83: 审慎使用懒初始化\n\n*懒性初始化*（Lazy initialization）是指延迟到值被需要时才初始化该字段的行为。如果该值永远\
  \ never 需要，则该字段永远不会被初始化。这种技术同时适用于静态字段和实例字段。虽然懒初始化主要是一种优化，但它也可以用于打破类和实例初始化中有有害的循环引用\
  \ [Bloch05, Puzzle 51]。\n\n与大多数优化一样，懒初始化的最佳建议是“除非你需要，否则不要这样做”（Item 67）。懒初始化是一把双刃剑。它降低了初始化类或创建实例的代价，但以增加访问懒初始化字段的代价为代价。取决于这些字段最终有多少比例需要初始化、初始化它们的成本，以及每个字段在初始化后被访问的频率，懒初始化实际上（像许多“优化”一样）可能会损害性能。\n\
  \n尽管如此，懒初始化仍有其用处。如果一个字段只在部分实例上被访问*且*其初始化成本很高，那么懒初始化可能是值得的。唯一能够确定的方法是测量带有懒初始化和没有懒初始化时的类性能。\n\
  \n在存在多个线程的情况下，懒初始化是棘棘手的。如果两个或多个线程共享一个懒初始字段，必须采用某种形式的同步，否则可能会导致严重的 Bug (Item 78)。本项讨论的所有初始化技术都是线程安全的。\n\
  \n在大多数情况下，普通初始化优于懒初始化。这里是普通初始化实例字段的典型声明。注意 `final` 修饰符的使用（Item 17）：\n\n点击此处查看代码图片\n\
  \n```java\n// 实例字段的普通初始化\nprivate final FieldType field = computeFieldValue();\n\
  ```\n\n如果你使用懒初始化来打破初始化循环，使用同步访问器，因为它是最简单清晰的替代方案：\n\n点击此处查看代码图片\n\n```java\n// 实例字段的懒初始化\
  \ - 同步访问器\nprivate FieldType field;\n\nprivate synchronized FieldType getField()\
  \ {\n    if (field == null)\n        field = computeFieldValue();\n    return field;\n\
  }\n```\n\n这两个范式（普通初始化和同步访问器的懒初始化）应用于静态字段时，除了在字段和访问器声明中添加 `static` 修饰符外，保持不变。\n\n\
  如果你需要在性能上懒初始化，使用*懒初始化持有类范式*。这种范式利用了类在被使用之前不会被初始化的保证 [JLS, 12.4.1]。它的样子如下：\n\n点击此处查看代码图片\n\
  \n```java\n// 静态字段的懒初始化持有类范式\nprivate static class FieldHolder {\n    static final\
  \ FieldType field = computeFieldValue();\n}\n\nprivate static FieldType getField()\
  \ { return FieldHolder.field; }\n```\n\n\n\n当首次调用 `getField` 时，它会首次读取 `FieldHolder.field`，从而导致\
  \ `FieldHolder` 类的初始化。这种模式的妙之处在于，`getField` 方法是没有同步的，并且只执行字段访问，因此懒性初始化几乎不会给访问带来任何额外代价。典型的虚拟机只会在初始化类时对字段访问同步。一旦类初始化完成，虚拟机就会对代码进行修复，使得后续对字段的访问不再涉及任何测试或同步操作。\n\
  \n如果你需要对实例字段出于性能考虑使用懒性初始化，请使用`双重检查模式`（double-check idiom）。这种模式避免了在初始化后访问字段时的锁定开销（Item\
  \ 79）。该模式背后的思想是检查两次字段的值（因此名为“双重检查”）：第一次在不加锁的情况下检查，如果发现字段似乎未初始化，则在加锁的情况下进行第二次检查。只有当第二次检查显示字段未初始化时，调用才会初始化该字段。由于字段一旦初始化后就不再加锁，因此将字段声明为\
  \ `volatile` 是至关重要的（Item 78）。以下是该模式：\n\n点击此处查看代码图片\n\n```java\n// 用于实例字段懒性初始化的双重检查模式\n\
  \nprivate volatile FieldType field;\n\nprivate FieldType getField() {\n    FieldType\
  \ result = field;\n    if (result == null) {  // 第一次检查（无锁）\n        synchronized(this)\
  \ {\n            if (field == null)  // 第二次检查（带锁）\n                field = result\
  \ = computeFieldValue();\n        }\n    }\n    return result;\n}\n```\n这段代码看起来可能有些复杂。特别是对局部变量（`result`）的需求可能并不清晰。这个变量的作用是确保在字段已经初始化的常见情况下，`field`\
  \ 只被读取一次。虽然这不是严格必要的，但它可以提高性能，并且按照底层并发编程的标准来说更加优雅。在我的机器上，上述方法比没有局部变量的显而见版本快约 1.4\
  \ 倍。\n\n虽然你也可以将双重检查模式应用于静态字段，但没有必要这样做：懒性初始化持有者类模式是更好的选择。\n\n双重检查模式有两个变体值得注意。偶尔，你可能需要懒性初始化一个可以接受重复初始化的实例字段。如果你发现自己处于这种情况，可以使用双重检查模式的变体，它省去了第二次检查。意不奇的是，这被称为`单检查模式`（single-check\
  \ idiom）。它的样子如下。注意 `field` 仍然声明为 `volatile`：\n\n点击此处查看代码图片\n\n```java\n// 单检查模式\
  \ - 可能会导致重复初始化！\n\nprivate volatile FieldType field;\n\nprivate FieldType getField()\
  \ {\n    FieldType result = field;\n    if (result == null)\n        field = result\
  \ = computeFieldValue();\n    return result;\n}\n```\n本项中讨论的所有初始化技术都适用于基本类型字段，也适用于对象引用字段。当双重检查或单检查模式应用于数值基本类型字段时，字段的值是与\
  \ `0`（数值基本类型变量的默认值）比较，而不是 `null`。\n\n如果你不在乎*每个*线程是否都重新计算字段的值，并且字段类型是 `long` 或 `double`\
  \ 以外的基本类型，那么你可以选择从单检查模式的字段声明中移除 `volatile` 修饰符。这种变体被称为`竞态单检查模式`（racy single-check\
  \ idiom）。它在某些架构上可以加速字段访问，但代价是额外的初始化（每个访问该字段的线程最多执行一次）。这绝对是一种奇特的技术，不适用于日常使用。\n\n\
  总结来说，你应该正常地初始化大多数字段，而不是懒性初始化。如果你为了实现性能目标或打破有害的初始化循环依赖而必须懒性地初始化字段，请使用适当的懒性初始化技术。对于实例字段，使用双重检查模式；对于静态字段，使用懒性初始化持有者类模式。对于可以接受重复初始化的实例字段，你也可以考虑单检查模式。\n\
  \n## Item 84：不要依赖线程调度器\n\n当许多线程处于可运行状态时，线程调度器决定哪些线程可以运行以及运行多久。任何合理的操作系统都会尝试公平地做出这一判断，但策略可能会有所不同。因此，编写良好的程序不应该依赖于此策略的细节。任何依赖线程调度器来保证正确性或性能的程序都是不可移植的。\n\
  \n编写健壮、响应迅速且可移植程序的最佳方法是确保*可运行*线程的平均数量不要过多。\n\n\n\n\n\n另一种相关的技术（同样适用于注意事项）是调整线程优先级。`线程优先级是\
  \ Java 中移植性最差的特性之一。`通过调整几个线程优先级来优化应用程序的响应速度并不是不合理的，但这通常没有必要，而且不具备移植性。试图通过调整线程优先级来解决严重的生存性问题（liveness\
  \ problem）是不合理的。在您找到并修复根本原因之前，问题可能会再次出现。\n\n而言之，不要依赖线程调度器来保证程序的正确性。这样生成的程序既不健壮也不具可移植性。作为一个推论，不要依赖\
  \ `Thread.yield` 或线程优先级。这些机制仅仅是给调度器的提示。可以、谨慎地使用线程优先级来提高已经运行良好的程序的质量，但绝不应该使用它们来“修复”一个勉强运行的程序。\n\
  \n# 第 12 章 序列化\n\n本章涉及`对象序列化`，这是 Java 用于将对象编码为字节流（序列化，`serializing`）以及从编码中重建对象（反序列化，`deserializing`）的框架。一旦对象被序列化，它的编码就可以从一个虚拟机发送到另一个虚拟机，或者存储在磁盘上供以后反序列化。本章重点关注序列化的危险以及如何最小化这些危险。\n\
  \n### 事项 85：优先使用 Java 序列化的替代方案\n\n当序列化在 1997 年被引入 Java 时，已知它具有风险。这种方法曾在一种研究性语言（Modula-3）中尝试过，但从未在生产级语言中使用过。虽然程序员只需付出很少努力就能实现分布式对象的承诺很有吸引力，但代价是不可见的构造函数以及\
  \ API 与实现之间模糊的界限，并可能在正确性、性能、安全性和维护方面产生问题。支持者认为收益大于风险，但历史证明事实并非如此。\n\n本书之前的版本中描述的安全问题被证明与某些人担的那样严重。21\
  \ 世纪初讨论的漏洞在接下来的十年中变成了严重的攻击利用，其中最著名的例子包括 2016 年 11 月对旧金山大交通局市政铁路（SFMTA Muni）的勒索软件攻击，该攻击导致整个票务系统关闭了两天\
  \ [Gallagher16]。\n\n序列化的一个根本问题是，其`攻击面`太大无法保护，且在不断增长：对象图是通过调用 `ObjectInputStream`\
  \ 上的 `readObject` 方法来反序列化的。该方法本质上是一个“魔法构造函数”，只要类型实现了 `Serializable` 接口，它就可以被用来实例化类路径上几乎任何类型的对象。在反序列化字节流的过程中，该方法可以执行这些类型中任何一种的代码，因此*所有*这些类型的代码都是攻击面的一部分。\n\
  \n攻击面包括 Java 平台库中的类、第三方库（如 Apache Commons Collections）中的类，以及应用程序自身的类。即使你遵循了所有相关的最佳实践，并成功编写了能够受攻击的可序列化类，你的应用程序仍然可能存在漏洞。引用\
  \ CERT 协调中心技术经理 Robert Seacord 的话：\n\nJava 反序列化是一个显而易见且迫在眉睫的危险，因为它被应用程序广泛直接使用，也间接地被\
  \ RMI（远程方法调用）、JMX（Java 扩展）和 JMS（Java 消息系统）等 Java 子系统使用。对不可信流的反序列化可能导致远程代码执行（RCE）、拒绝服务（DoS）以及一系列其他攻击。即使应用程序没有做错任何事，也可能受到这些攻击。[Seacord17]\n\
  \n攻击者和安全研究人员研究 Java 类以及常用第三方库中的可序列化类型，寻找在反序列化期间调用的执行潜在危险活动的方法。此类方法被称为 `gadgets`（get）。多个\
  \ gadget 可以协作使用，形成一个 `gadget chain`（gadget 链）。偶尔会发现足够强大的 gadget 链，只要攻击者有机会提交一个精心构造的字节流进行反序列化，就可以在底层硬件上执行任意原生代码。这正是在\
  \ SFMTA Muni 攻击中发生的情况。这种攻击并非孤例。类似的还有，且未来会有更多。\n\n在不使用任何 gadget 的情况下，你可以通过导致一个需要长时间反序列化的短流，轻松地发起拒绝服务攻击。这种流被称为`deserialization\
  \ bombs`（反序列化炸） [Svoboda16]。这里是 Wouter Coekaerts 提供的一个示例，仅使用了哈集合和一个字符串 [Coekaerts15]：\n\
  \n点击此处查看代码图片\n\n```java\n// Deserialization bomb - 反序列化此流需要永久的时间\nstatic byte[]\
  \ bomb() {\n    Set<Object> root = new HashSet<>();\n    Set<Object> s1 = root;\n\
  \    Set<Object> s2 = new HashSet<>();\n    for (int i = 0; i < 100; i++) {\n  \
  \      Set<Object> t1 = new HashSet<>();\n        Set<Object> t2 = new HashSet<>();\n\
  \        t1.add(\"foo\"); // 让 t1 不等于 t2\n        s1.add(t1);\n        s1.add(t2);\n\
  \        s2.add(t1);\n        s2.add(t2);\n        s1 = t1;\n        s2 = t2;\n\
  \    }\n    return serialize(root); // 为了简洁起见省略了方法\n}\n```\n\n对象图由 201 个 `HashSet`\
  \ 实例组成，每个实例包含 3 个或更少的对象引用。整个流长度为 5744 字节，但在完成反序列化之前，太阳都会熄灭。问题在于，反序列化 `HashSet` 实例需要计算其元素的哈希值。根集合的\
  \ 2 个元素本身是包含 2 个哈集合元素的集合，依此类推，深达 100 层。因此，反序列化该集合会导致 `hashCode` 方法被调用 $2^{100}$\
  \ 次。除了反序列化需要耗费无尽的时间外，反序列化器没有任何迹象显示任何异常。产生的对象很少，且栈深度是有界限的。\n\n那么你可以做什么来防御这些问题呢？每当你反序列化一个你不信任的字节流时，你就让自己暴露在攻击之下。**避免序列化攻击利用的最佳方法是永远不要反序列化任何内容。**正如\
  \ 1983 年电影《游戏》中计算机 Joshua 所说，“唯一的获胜之道是不玩。”**在你编写的任何新系统中，没有理由使用 Java 序列化。** 其他其他用于对象与字节序列转换的机制可以避免\
  \ Java 序列化的许多危险，同时提供许多优势，例如跨平台支持、高性能、庞大的工具生态系统以及广泛的专家社区。在本书中，我们将这些机制称为*跨平台结构化数据表示*。虽然其他人有时将其称为序列化系统，但本书避免这种用法以防止与\
  \ Java 序列化混淆。\n\n这些表示法的共同点是它们比 Java 序列化简单得多。它们不支持任意对象图的自动序列化和反序列化。相反，它们支持由属性值对集合组成的简单结构化数据对象。仅支持少数原始类型和数组数据类型。这种简单的抽象被证明足以构建极其强大的分布式系统，并且足够简单，可以避免自\
  \ Java 序列化诞生以来困扰它的严重问题。\n\n\n\n\n\n领先的跨平台结构化数据表示有 `JSON` [JSON] 和 `Protocol Buffers`，也称为\
  \ `protobuf` [Protobuf]。`JSON` 由 Douglas Crockford 设计用于浏览器与服务器之间的通信，而 protocol buffers\
  \ 由 Google 设计用于在其服务器之间存储和交换结构化数据。尽管这些表示有时被称为“语言无关”，但 `JSON` 最初是为 JavaScript 开发的，而\
  \ `protobuf` 是为 C++ 开发的；两种表示都保留了它们的起源痕迹。\n\n`JSON` 和 `protobuf` 之间最重要的区别在于：`JSON`\
  \ 是基于文本且人类可读的，而 `protobuf` 是二进制的且效率高得多；`JSON` 仅作为数据表示，而 `protobuf` 提供了 `schemas`（类型）来记录并强制执行适当用法。尽管\
  \ `protobuf` 比 `JSON` 更高效，但 `JSON` 对于基于文本的表示来说已经非常高效。虽然 `protobuf` 是二进制表示，但它确实提供了一种替代的文本表示，用于需要人类可读性的场景（`pbtxt`）。\n\
  \n如果你无法完全避免 Java 序列化（可能是因为你正在一个需要它的遗留系统中工作），你的下一个最佳选择是**永远不要反序列化不可信的数据**。 特是，你不应该接受来自不可信源的\
  \ RMI 流量。Java 官方安全编码指南指出：“不可信数据的反序列化本质上是危险的，应该避免。”这句话使用了大号、粗体、斜体、红色字体，它是整个文档中唯一经过这种处理的文本\
  \ [Java-secure]。\n\n如果你无法避免序列化，并且无法完全确定正在反序列化的数据的安全性，请使用 Java 9 添加并回溯到早期版本的对象反序列化过滤（`java.io.ObjectInputFilter`）。该功能允许你指定一个在数据流被反序列化之前应用的过滤器。它在类粒度上运行，允许你接受或拒绝某些类。默认接受类并拒绝一组潜在危险的类被称为`黑名单制`；默认拒绝类并接受一组假定安全的类被称为`白名单制`。**优先使用白名单而不是黑名单**，因为黑名单只能保护你免受已知威胁的影响。一个名为\
  \ Serial Whitelist Application Trainer (SWAT) 的工具可以用于为你的应用程序自动准备白名单 [Schneider16]。过滤功能还将保护你免受过度内存消耗和过深对象图的影响，但它无法防御像上面那样的序列化炸。\n\
  \n遗憾的是，序列化在 Java 生态系统中仍然普遍存在。如果你正在维护一个基于 Java 序列化的系统，请认真考虑迁移到跨平台的结构化数据表示，尽管这可能是一项耗时的工作。从现实来说，你可能仍然发现自己必须编写或维护可序列化的类。编写一个正确、安全且高效的可序列化类需要非常的小心。本章的其余部分将提供关于何时以及如何这么做的建议。\n\
  \n总结，序列化是危险的，应该被避免。如果你是从零开始设计一个系统，请使用跨平台的结构化数据表示（如 `JSON` 或 `protobuf`）。不要反序列化不可信的数据。如果你必须这么做，请使用对象反序列化过滤，但要注意这不能保证阻止所有攻击。避免编写可序列化类。如果你必须这样做，请要极加小心。\n\
  \n### 事项 86：极其谨慎地实现 `Serializable`\n\n允许类的实例被序列化可能只需在其声明中添加 `implements Serializable`\
  \ 几个单词。因为这太容易做到，人们有一个常见的误解，认为序列化对程序员来说几乎不需要努力。事实要复杂得多。虽然使一个类变为可序列化的直接成本可能可以忽略不计，但长期成本通常是巨大的。\n\
  \n#### 实现 `Serializable` 的主要成本之一是降低了类在发布后更改其实现的灵活性。\n\n当一个类实现 `Serializable` 时，它的字节流编码（或`序列化形式`）就成了其导出\
  \ API 的一部分。一旦你广泛发布一个类，你通常需要永久支持该序列化形式，就像被要求支持导出 API 的所有其他部分一样。如果你不努力设计`自定义序列化形式`\
  \ 而仅仅接受默认值，那么序列化形式将永远与类的原始内部表示绑定在一起。换句话说，如果你接受默认的序列化形式，类的私有和包私有实例字段将成为其导出 API 的一部分，而最小化字段访问的实践（事项\
  \ 15）失去了作为信息隐藏工具的有效性。\n\n如果你接受了默认的序列化形式并在之后更改类的内部表示，将导致序列化形式出现不兼容的变化。尝试使用旧版本的类序列化实例并使用新版本反序列化它（或反之）的客户端将遇到程序故障。可以在保持原始序列化形式的同时更改内部表示（使用\
  \ `ObjectOutputStream.putFields` 和 `ObjectInputStream.readFields`），但这可能是困难的，并在源代码中留下了明显的瑕疵。如果你选择使一个类变为可序列化，你应该仔细设计一个你愿意长期使用的高质量序列化形式（事项\
  \ 87, 90）。这样做会增加初始开发成本，但它是值得的。即使是一个设计得良好的序列化形式，也会对类的演进施加限制；一个设计糟糕的序列化形式可能是致命的。\n\
  \n关于序列化所施加的演进限制的一个简单示例涉及`流唯一标识符`，更通俗的称为 `serial ID`。每个可序列化的类都有与其相关的唯一标识数字。如果你不通过声明一个名为\
  \ `serialVersionUID` 的静态 final long` 字段来指定此数字，系统将在运行时通过对类结构应用加密哈希函数（SHA-1）自动生成它。该值受类名、它实现的接口以及它大多数成员（包括编译器生成的合成成员）的影响。如果你更改了这些任何内容，例如添加一个便利方法，生成的\
  \ serial UID 就会改变。如果你未能声明 serial UID，兼容性将被破坏，导致运行时出现 `InvalidClassException`。\n\n\
  #### 第二成本是增加了 bug 和安全漏洞的可能性 (事项 85)。通常，对象是通过构造函数创建的；序列化是创建对象的`语言外机制`。无论你是接受默认行为还是覆盖它，反序列化都是一个“隐藏构造函数”，具有与其他构造函数相同的问题。由于反序列化没有与显式构造函数关联，人们很容易忘记必须确保它保证了由构造函数建立的所有不变性，并且不会允许攻击者访问正在构建的对象的内部结构。依赖默认的反序列化机制很容易让对象面临不变性损坏和非法访问的风险（事项\
  \ 88）。\n\n\n\n\n\n## 实现 `Serializable` 的第三种成本是增加了发布类新版本时相关的测试负担。当一个可序列化类被修改时，重要的是要检查是否能够在新版本中序列化一个实例，并在旧版本中反序列化该实例，反之亦然。因此，所需的测试量与可序列化类的数量与发布次数的乘积正比，这个数字可能非常大。你必须确保序列化-反序列化过程成功，并且结果是原始对象的忠实副本。如果在最初编写类时就仔细设计了自定义的序列化形式，就可以减少测试的需求（Items\
  \ 87, 90）。\n\n## 实现 `Serializable` 不是一个可以轻率采取的决定。如果一个类要参与某个依赖 Java 序列化进行对象传输或持久化的框架，那么它是至关重要的。此外，它极大地方便了将类作为另一个必须实现\
  \ `Serializable` 的类的组件使用。然而，实现 `Serializable` 伴随着许多成本。每当你设计一个类时，都要权衡成本与收益。从历史上看，如\
  \ `BigInteger` 和 `Instant` 这样的值类实现了 `Serializable`，集合类也是如此。表示活动实体的类（如线程池）很少实现 `Serializable`。\n\
  \n设计用于继承的类（Item 19）很少实现 `Serializable`，接口也很扩展它。违反这一规则会给任何扩展该类或实现接口的人带来巨大的负担。有时违反规则是合适的。例如，如果一个类或接口主要为了参与一个要求所有参与者实现\
  \ `Serializable` 的框架，那么该类或接口实现或扩展 `Serializable` 就是合理的。\n\n设计用于继承且实现了 `Serializable`\
  \ 的类包括 `Throwable` 和 `Component`。`Throwable` 实现了 `Serializable`，以便 RMI 可以将异常从服务器发送到客户端。`Component`\
  \ 实现了 `Serializable`，以便发送、保存和恢复 GUI，但即使在 Swing 和 AWT 的黄金时期，这种功能在实践中也很少使用。\n\n如果你实现了一个带有实例字段的、既可序列化又可扩展的类，有几个风险需要注意。如果实例字段的值有任何不变性，那么防止子类重写\
  \ `finalize` 方法就至关重要，类可以通过重写 `finalize` 并将其声明为 `final` 来做到。否则，该类将受到*终结器攻击*（*Item\
  \ 8*）。最后，如果类具有某些如果实例字段被初始化为默认值（整型类型为 0，布尔型为 false，对象引用类型为 null）就会被违反的不变性，则你必须添加此\
  \ `readObjectNoData` 方法：\n\n点击此处查看代码图像\n\n```java\n// readObjectNoData for stateful\
  \ extendable serializable classes\n\nprivate void readObjectNoData() throws InvalidObjectException\
  \ {\n\n    throw new InvalidObjectException(\"Stream data required\");\n}\n```\n\
  \n该方法是在 Java 4 中添加的，用于涵盖向现有可序列化类添加可序列化父类的边界情况 [Serialization, 3.5]。\n\n关于*不*实现 `Serializable`\
  \ 这一决定，有一个有一个例外。如果一个设计用于继承的类不可序列化，那么编写一个可序列化的子类可能需要额外的努力。对此类类进行常规反序列化要求父类有一个可访问的无参构造函数\
  \ [Serialization, 1.10]。如果你不提供这样的构造函数，子类将被迫使用序列化代理模式（Item 90）。\n\n## 内部类 (Item 24）不应该实现\
  \ `Serializable`。它们使用编译器生成的*合成字段*来存储对*外部实例*的引用，并存储来自外部作用域的局部变量。这些字段与类定义的对应关系是不指定的，匿名类和局部类的名称也是如此。因此，内部类的默认序列化形式是未定义的。然而，*静态成员类*可以实现\
  \ `Serializable`。\n\n总结来说，实现 `Serializable` 的便利性是表象的。除非一个类仅在受保护的环境中使用，其中版本之间永远不需要互操作，且服务器永远不会暴露给不可信的数据，否则实现\
  \ `Serializable` 是一项应该非常谨慎地做出的严肃承诺。如果一个类允许继承，则需要格外小心。\n\n### Item 87：考虑使用自定义序列化形式\n\
  \n当你在时间压力下编写类时，通常将精力集中在设计最好的 API 上是合适的。有时这意味着发布一个你明确会在未来版本中替换的“一次性”实现。通常情况下这不是问题，但如果该类实现了\
  \ `Serializable` 并使用了默认的序列化形式，你永远无法完全逃离这个一次性实现。它将永远决定序列化形式。这不仅仅是一个理论问题。它发生在 Java\
  \ 库的几个类中，包括 `BigInteger`。\n\n在没有考虑是否合适之前，不要接受默认序列化形式。接受默认序列化形式应该是一个自觉决定，即从灵活性、性能和正确性的角度来看这种编码是合理的。通常，只有当默认序列化形式与你设计自定义序列化形式时会选择的编码基本相同时，你才接受默认序列化形式。\n\
  \n对象的默认序列化形式是以该对象为根的对象图*物理*表示的一种相当有效的编码。换句话说，它描述了对象以及从这里可达每个对象中所包含的数据。它还描述了所有这些对象相互链接的拓扑结构。对象的理想序列化形式包含对象所表示的*逻辑*数据。它独立于物理表示。\n\
  \n如果一个对象的物理表示与其逻辑内容相同，那么默认序列化形式很可能是合适的。例如，对于下面这个简单表示人姓名的类，默认序列化形式将是合理的：\n\n点击此处查看代码图像\n\
  \n```java\n// 默认序列化形式的良好候选\npublic class Name implements Serializable {\n\n    /**\n\
  \     * 姓。不能为空。\n     * @serial\n     */\n    private final String lastName;\n\n\
  \    /**\n     * 名。不能为空。\n     * @serial\n     */\n    private final String firstName;\n\
  \n    /**\n     * 间，如果没有则为 null。\n     * @serial\n     */\n    private final String\
  \ middleName;\n\n    ... // 省略剩余\n}\n```\n\n从逻辑上讲，一个名字由三个字符串组成，代表姓、名和间。Name 类中的实例字段精确地镜像了这种逻辑内容。\n\
  \n即使你决定默认序列化形式是合适的，你通常也必须提供 `readObject` 方法来确保不变性和安全性。在 `Name` 的情况下，`readObject`\
  \ 方法必须确保字段 `lastName` 和 `firstName` 不为空。这个问题在 Item 88 和 90 中进行了详细讨论。\n\n\n\n\n请注意，`lastName`、`firstName`\
  \ 和 `middleName` 字段上有文档注释，尽管它们是私有的。这是因为这些私有字段定义了一个公共 API，即该类的序列化形式，而这个公共 API 必须被记录。`@serial`\
  \ 标签的存在告诉 Javadoc 将此文档放置在记录序列化形式的特殊页面上。\n\n在与 `Name` 相反端，请考虑以下类，它表示一个字符串列表（暂不考虑你可能使用标准的\
  \ `List` 实现之一会更好）：\n\n点击此处查看代码图像\n\n// 糟糕的默认序列化形式候选者\n\n```java\npublic final class\
  \ StringList implements Serializable {\n    private int size = 0;\n    private Entry\
  \ head = null;\n    private static class Entry implements Serializable {\n     \
  \   String data;\n        Entry  next;\n        Entry  previous;\n    }\n    ...\
  \ // 省略剩余部分\n}\n```\n\n从逻辑上说，这个类代表一个字符串序列。从物理上说，它将该序列表示为双向链表。如果你接受默认的序列化形式，那么序列化形式将费力地镜像链表中的每个条目以及条目之间的所有链接（双向地）。\n\
  \n### 当对象的物理表示与其逻辑数据内容存在差异时，使用默认序列化形式有四个缺点：\n\n*   **它将将导出的 API 与当前的内部表示永久绑定。**\
  \ 在上面的示例中，私有的 `StringList.Entry` 类变成了公共 API 的一部分。如果在未来的发布中更改了表示形式，`StringList` 类仍需要在输入时接受链表表示并在输出时生成它。该类将永远无法摆所有处理链表条目的代码，即使它不再使用它们了。\n\
  *   **它可能会消耗过多空间。** 在上面的示例中，序列化形式无必要地表示链表中的每个条目和所有链接。这些条目和链接仅仅是实现细节，不值得包含在序列化形式中。因为序列化形式过大，将其写入磁盘或通过网络发送将极其缓慢。\n\
  *   **它可能会消耗过多时间。** 序列化逻辑并不了解对象图的拓扑结构，因此它必须经过昂贵的图遍历。在上面的示例中，只需遵循 `next` 引用就足够。\n\
  *   **它可能会导致栈溢出。** 默认序列化程序对对象图进行递归遍历，即使对于中等规模的对象图也可能导致栈溢出。带有 1,000–1,800 个元素的 `StringList`\
  \ 实例在我的机器上会产生 `StackOverflowError`。惊讶的是，导致序列化引起栈溢出的最小列表大小每次运行都不同（在我的机器上）。出现此问题的最小列表大小取决于平台实现和命令行标记；某些实现可能完全没有这个问题。\n\
  \n`StringList` 一个合理的序列化形式仅仅是列表中的字符串数量，随后是字符串本身。这构成了 `StringList` 所表示的逻辑数据，去除了物理表示的细节。以下是修改后的\
  \ `StringList` 版本，带有 `writeObject` 和 `readObject` 方法以实现这种序列化形式。提醒一下，`transient`\
  \ 修饰符表示实例字段应从类的默认序列化形式中省略：\n\n点击此处查看代码图像\n\n// 具有合理自定义序列化形式的 StringList\n\n```java\n\
  public final class StringList implements Serializable {\n    private transient int\
  \ size  = 0;\n    private transient Entry head = null;\n    // 不再可序列化！\n    private\
  \ static class Entry {\n        String data;\n        Entry  next;\n        Entry\
  \  previous;\n    }\n    // 将指定的字符串添加到列表\n    public final void add(String s) {\
  \ ... }\n    /**\n     * 序列化此 {@code StringList} 实例。\n     *\n     * @serialData\
  \ 列表的大小（包含的字符串数量）被输出（{@code int}），\n     * 随后是所有的元素（每个都是 {@code String}），按正确的\n\
  \     * 顺序。\n     */\n    private void writeObject(ObjectOutputStream s) throws\
  \ IOException {\n        s.defaultObject();\n        s.writeInt(size);\n       \
  \ // 写出元素\n        for (Entry e = head; e != null; e = e.next) {\n            s.writeObject(e.data);\n\
  \        }\n    }\n    private void readObject(ObjectInputStream s) throws IOException,\
  \ ClassNotFoundException {\n        s.defaultReadObject();\n        int numElements\
  \ = s.readInt();\n        // 读取所有元素并插入列表\n        for (int i = 0; i < numElements;\
  \ i++) {\n            add((String) s.readObject());\n        }\n    }\n    // ...\
  \ 省略剩余部分\n}\n```\n\n\n\n\n例如，以哈希表（hash table）为例。其物理表示是一个包含键值对条目的哈希桶（hash buckets）序列。条目所在的桶取决于其键的哈希值，而这个哈希值在不同实现之间通常无法保证相同。事实上，它在不同运行之间也无法保证相同。因此，接受哈希表的默认序列化形式将构成严重的错误。序列化和反序列化哈希表可能会产生一个不变被严重破坏的对象。\n\
  \n无论你是否接受默认的序列化形式，当调用 `defaultWriteObject` 方法时，每个未标记为 `transient` 的实例字段都会被序列化。因此，每个可以声明为\
  \ `transient` 的实例字段都应该被这样声明。这包括派生字段（其值可以从主数据字段计算出来，例如缓存的哈希值），它还包括那些值与某个特定的 JVM 运行绑定的字段，例如指向原生数据结构的指针\
  \ `long` 字段。**在决定将一个字段设为非 transient 之前，请务必确信它的值是对象逻辑状态的一部分。** 如果你使用自定义的序列化形式，如上述\
  \ `StringList` 示例所示，大多数或所有实例字段都应该标记为 `transient`。\n\n如果你使用默认的序列化形式并标记了一个或多个字段为 `transient`，请记住当实例被反序列化时，这些字段将被初始化为它们的*默认值*：对象引用字段为\
  \ `null`，数值原始类型字段为 `0`，`boolean` 字段为 `false` [JLS, 4.12.5]。如果这些值对于某些 transient 字段是不可接受的，你必须提供一个\
  \ `readObject` 方法，通过调用 `defaultReadObject` 方法并将 transient 字段恢复为可接受的值（Item 88）。或者，这些字段可以在第一次使用时进行惰性初始化（Item\
  \ 83）。\n\n无论你是否使用默认的序列化形式，**你必须对对象序列化施加任何你对其他读取对象整个状态的方法会施加的同步措施。** 例如，如果你有一个线程安全的对象\
  \ (Item 82)，它通过同步每个方法来实现线程安全，而你又选择使用默认的序列化形式，请使用以下 `write-Object` 方法：\n\n点击此处查看代码图片\n\
  \n```java\n// 带有默认序列化形式的同步类的 writeObject\nprivate synchronized void writeObject(ObjectOutputStream\
  \ s)\n    throws IOException {\n    s.defaultWriteObject();\n}\n```\n\n如果你在 `writeObject`\
  \ 方法中放置同步代码，必须确保它遵循与其他活动相同的相同的锁定顺序约束，否则可能会面临资源顺序死锁的风险 [Goetz06, 10.1.5]。\n\n**无论选择何种序列化形式，请在你编写每个可序列化类中声明一个显式的\
  \ serial version UID。** 这消除了 serial version UID 作为潜在不兼容源的问题（Item 86）。这还有一个微小的性能益处。如果没有提供\
  \ serial version UID，则会在运行时执行一次昂贵的计算来生成它。\n\n声明 serial version UID 非常简单。只需在你的类中添加此行即可：\n\
  \n点击此处查看代码图片\n\n```java\nprivate static final long serialVersionUID = randomLongValue;\n\
  ```\n\n如果你写一个新类，为 `randomLongValue` 选择什么值都无所谓。你可以通过在类上运行 `serialver` 工具来生成该值，但随手挑一个数字也可以。serial\
  \ version UIDs 并不*要求*必须是唯一的。如果你修改了一个缺少 serial version UID 的现有类，并且希望新版本能接受现有的序列化实例，你必须使用为旧版本自动生成的值。你可以通过对类的旧版本（即已存在序列化实例的类）运行\
  \ `serialver` 工具来获取这个数字。\n\n如果你想为某个类创建一个与现有版本*不兼容*的新版本，只需更改 serial version UID 声明中的值即可。这将导致尝试反序列化以前版本的序列化实例时抛出\
  \ `InvalidClassException` 异常。**除非你想破坏与该类所有现有序列化实例的兼容性，否则不要更改 serial version UID。**\n\
  \n总结来说，如果你已经决定一个类应该是序列化的 (Item 86)，请仔细思考序列化形式应该是怎样的。只有当默认序列化形式是对象逻辑状态的合理描述时，才使用它；否则，请设计一个恰当描述对象的自定义序列化形式。你应该为设计类的序列化形式分配与设计导出方法（exported\
  \ method）相同的时间 (Item 51)）。正如你无法从未来的版本中消除导出方法一样，无法从序列化形式中消除字段；它们必须永久保留以确保序列化兼容性。选择错误的序列化形式可能会对类的复杂性和性能产生永久的负面影响。\n\
  \n### Item 88：防御性地编写 `readObject` 方法\n\nItem 50 包含一个带有可变私有 `Date` 字段的不可变范围类。该类通过在构造函数和访问器中对\
  \ `Date` 对象进行防御性拷贝，极力维护其不变性和不可变性。以下是该类：\n\n点击此处查看代码图片\n\n```java\n// 使用防御拷贝的不可变类\n\
  public final class Period {\n    private final Date start;\n    private final Date\
  \ end;\n\n    /**\n     * @param start 期的开始\n     * @param end 期的结束；不能早于 start\n\
  \     * @throws IllegalArgumentException 如果 start 在 end 之后\n     * @throws NullPointerException\
  \ 如果 start 或 end 为空\n     */\n    public Period(Date start, Date end) {\n      \
  \  this.start = new Date(start.getTime());\n        this.end = new Date(end.getTime());\n\
  \        if (this.start.compareTo(this.end) > 0) {\n            throw new IllegalArgumentException(start\
  \ + \" after \" + end);\n        }\n    }\n\n    public Date start () { return new\
  \ Date(start.getTime()); }\n    public Date end () { return new Date(end.getTime());\
  \ }\n    public String toString() { return start + \" - \" + end; }\n\n    // ...\
  \ 省略剩余\n}\n```\n\n假设你想让这个类序列化。由于 Period 对象的物理表示完全反映了其逻辑数据内容，使用默认序列化形式是不合理的 (Item\
  \ 87)）。因此，看起来要使该类序列化只需要在类声明中添加 `implements Serializable` 关键字即可。然而，如果你这样做，该类将不再能够保证其关键的不变性。\n\
  \n问题在于 `readObject` 方法实际上是另一个公共构造函数，它要求的关注度与其他任何构造函数相同。正如构造函数必须检查其参数的有效性 (Item 49)\
  \ 并在适当的情况下对参数进行防御性拷贝 (Item 50)一样，`readObject` 方法也必须如此。如果 `readObject` 方法未能做到其中任何一点，攻击者违反该类的不变性是非常简单的。\n\
  \n\n\n\n广义来说，`readObject` 是一个以字节流作为唯一参数的构造函数。在正常情况下，字节流是通过序列化一个正常构造的实例生成的。当 `readObject`\
  \ 接收到一个人工构造的字节流，其生成的对象违反了其类的不变性时，问题就出现了。这种字节流可以被用来创建一个“不可能的对象”，这种对象无法通过普通的构造函数创建。\n\
  \n假设我们简单地在 `Period` 类的声明中添加了 `implements Serializable`。那么这个糟糕的程序将生成一个结束时间在开始时间之前的\
  \ `Period` 实例。对高位为 1 的 `byte` 值进行强制转换，是因为 Java 缺乏 `byte` 字面量，加上将 `byte` 类型设计为有符号数的这一遗憾决策：\n\
  \n点击此处查看代码图片\n\n```java\npublic class BogusPeriod {\n\n  // 字节流不可能来自真实的 Period 实例！\n\
  \n  private static final byte[] serializedForm = {\n    (byte)0xac, (byte)0xed,\
  \ 0x00, 0x05, 0x73, 0x72, 0x00, 0x06,\n    0x50, 0x65, 0x72, 0x69, 0x6f, 0x64, 0x40,\
  \ 0x7e, (byte)0xf8,\n    0x2b, 0x4f, 0x46, (byte)0xc0, (byte)0xf4, 0x02, 0x00, 0x02,\n\
  \    0x4c, 0x00, 0x03, 0x65, 0x6e, 0x64, 0x74, 0x00, 0x10, 0x4c,\n    0x6a, 0x61,\
  \ 0x76, 0x61, 0x2f, 0x75, 0x74, 0x69, 0x6c, 0x2f,\n    0x44, 0x61, 0x74, 0x65, 0x3b,\
  \ 0x4c, 0x00, 0x05, 0x73, 0x74,\n    0x61, 0x72, 0x74, 0x71, 0x00, 0x7e, 0x00, 0x01,\
  \ 0x78, 0x70,\n    0x73, 0x72, 0x00, 0x0e, 0x6a, 0x61, 0x76, 0x61, 0x2e, 0x75,\n\
  \    0x74, 0x69, 0x6c, 0x2e, 0x44, 0x61, 0x74, 0x65, 0x68, 0x6a,\n    (byte)0x81,\
  \ 0x01, 0x4b, 0x59, 0x74, 0x19, 0x03, 0x00, 0x00,\n    0x78, 0x70, 0x77, 0x08, 0x00,\
  \ 0x00, 0x00, 0x66, (byte)0xdf,\n    0x6e, 0x1e, 0x00, 0x78, 0x73, 0x71, 0x00, 0x7e,\
  \ 0x00, 0x03,\n    0x77, 0x08, 0x00, 0x00, 0x00, (byte)0xd5, 0x17, 0x69, 0x22,\n\
  \    0x00, 0x78\n  };\n\n  public static void main(String[] args) {\n    Period\
  \ p = (Period) deserialize(serializedForm);\n    System.out.println(p);\n  }\n\n\
  \  // 返回具有指定序列化形式的对象\n  static Object deserialize(byte[] sf) {\n    try {\n    \
  \  return new ObjectInputStream(\n          new ByteArrayInputStream(sf)).readObject();\n\
  \    } catch (IOException | ClassNotFoundException e) {\n      throw new IllegalArgumentException(e);\n\
  \    }\n  }\n}\n```\n\n用于初始化 `serializedForm` 的 `byte` 数组字面量是通过序列化一个普通的 `Period`\
  \ 实例并手动编辑生成的字节流生成的。流的细节对本示例并不重要，但如果你感兴趣，序列化字节流格式在*Java 对象序列化规范*[序列化, 6]中有所描述。如果你运行这个程序，它会打印\
  \ `Fri Jan 01 12:00:00 PST 1999 - Sun Jan 01 12:00:00 PST 1984`。仅仅声明 `Period` 为可序列化的就让我们能够创建一个违反其类不变性的对象。\n\
  \n要修复这个问题，需要为 `Period` 提供一个 `readObject` 方法，调用 `defaultReadObject` 然后检查反序列化对象的有效性。如果有效性检查失败，`readObject`\
  \ 方法将抛出 `InvalidObjectException`，阻止反序列化完成：点击此处查看代码图片\n\n```java\n// 有有效性检查的 readObject\
  \ 方法\nprivate void readObject(ObjectInputStream s)\n  throws IOException, ClassNotFoundException\
  \ {\n  s.defaultReadObject();\n  // 检查不变性满足\n  if (start.compareTo(end) > 0)\n \
  \   throw new InvalidObjectException(start +\" after \"+ end);\n```\n\n虽然这防止了攻击者创建无效的\
  \ `Period` 实例，但还有一个更微妙的问题。通过伪造一个以有效的 `Period` 实例开始并附加私有 `Date` 字段引用的字节流，可以创建一个可变的\
  \ `Period` 实例。攻击者从 `ObjectInputStream` 读取 `Period` 实例，然后读取附加到流中的“伪对象”。这些引用让攻击者可以访问\
  \ `Period` 对象内部私有的 `Date` 字段。通过修改这些 `Date` 实例，攻击者可以修改 `Period` 实例。接下来的类演示了这一点：点击此处查看代码图片\n\
  \n```java\npublic class MutablePeriod {\n  // period 实例\n  public final Period period;\n\
  \  // 不应该访问的 period start 字段\n  public final Date start;\n  // 不应该访问的 period end\
  \ 字段\n  public final Date end;\n\n  public MutablePeriod() {\n    try {\n      ByteArrayOutputStream\
  \ bos = new ByteArrayOutputStream();\n      ObjectOutputStream out = new ObjectOutputStream(bos);\n\
  \      // 序列化一个有效的 Period 实例\n      out.writeObject(new Date(), new Date()));\n\
  \      /*\n       * 为 Period 内部\n       * Date 字段附加“伪对象”。详情见“Java 序列化规范”，第 6.4 节。\n\
  \       */\n      byte[] ref = { 0x71, 0, 0x7e, 0, 5 }; // Ref #5\n      bos.write(ref);\
  \ // start 字段\n      ref[4] = 4; // Ref #4\n      bos.write(ref); // end 字段\n  \
  \    // 反序列化 Period 和“被盗取”的 Date 引用\n      ObjectInputStream in = new ObjectInputStream(\n\
  \          new ByteArrayInputStream(bos.toByteArray()));\n      period = (Period)\
  \ in.readObject();\n      start  = (Date)  in.readObject();\n      end    = (Date)\
  \  in.readObject();\n    } catch (IOException | ClassNotFoundException e) {\n  \
  \    throw new AssertionError(e);\n    }\n  }\n}\n```\n\n要看到攻击的效果，请运行以下程序：点击此处查看代码图片\n\
  \n```java\npublic static void main(String[] args) {\n  MutablePeriod mp = new MutablePeriod();\n\
  \  Period p = mp.period;\n  Date pEnd = mp.end;\n  // 让时钟拨回\n  pEnd.setYear(78);\n\
  \  System.out.println(p);\n  // 回到六年代\n  pEnd.setYear(69);\n  System.out.println(p);\n\
  }\n```\n\n在我的本地语言环境下，运行此程序产生如下输出：点击此处查看代码图片\n\n```\nWed Nov 22 00:21:29 PST 2017\
  \ - Wed Nov 22 00:21:29 PST 1978\nWed Nov 22 00:21:29 PST 2017 - Sat Nov 22 00:21:29\
  \ PST 1969\n```\n\n虽然 `Period` 实例在创建时不变性是完整的，但可以任意修改其内部组件。一旦拥有可变的 `Period` 实例，攻击者可能会通过将实例传递给一个依赖\
  \ `Period` 不变性作为安全的类，从而造成巨大伤害。这并非空谈：某些类依赖 `String` 的不可变性来实现安全性。\n\n问题的根源在于 `Period`\
  \ 的 `readObject` 方法没有足够的防御拷贝。**当对象被反序列化时，对任何客户端不应拥有的对象引用字段进行防御拷贝至关重要。**因此，每个包含私有变量组件的可序列化不可变类都必须在其\
  \ `readObject` 方法中对这些组件进行防御拷贝。以下 `readObject` 方法足以确保 `Period` 的不变性并维护其不可变性：点击此处查看代码图片\n\
  \n```java\n// 带有防御拷贝和有效性检查的 readObject 方法\nprivate void readObject(ObjectInputStream\
  \ s)\n  throws IOException, ClassNotFoundException {\n  s.defaultReadObject();\n\
  \  // 对我们的变量组件进行防御拷贝\n  start = new Date(start.getTime());\n  end  = new Date(end.getTime());\n\
  \  // 检查不变性满足\n  if (start.compareTo(end) > 0)\n    throw new InvalidObjectException(start\
  \ +\" after \"+ end);\n}\n```\n\n\n\n\n```\nthrow new InvalidObjectException(start\
  \ +\" after \"+ end);\n}\n```\n\n请注意，防御拷贝是在有效性检查之前进行的，而且我们没有使用 `Date` 的 `clone`\
  \ 方法来执行防御拷贝。这两个细节对于保护 `Period` 免受攻击都是必须的（Item 50）。同样注意，`final` 字段无法进行防御拷贝。为了使用 `readObject`\
  \ 方法，我们必须将 `start` 和 `end` 字段改为非 `final`。这很遗憾，但这是两害相轻的。有了新的 `readObject` 方法并且从 `start`\
  \ 和 `end` 字段中移除了 `final` 修饰符，`MutablePeriod` 类失效了。上面的攻击程序现在会生成如下输出：\n\n点击此处查看代码图片\n\
  \nWed Nov 22 00:23:41 PST 2017 - Wed Nov 22 00:23:41 PST 2017\n\nWed Nov 22 00:23:41\
  \ PST 2017 - Wed Nov 22 00:23:41 PST 2017\n\n这里有一个判断默认 `readObject` 方法对于某个类是否接受的简单试金石：你是否乐于添加一个公共构造函数，该函数以对象中每个非\
  \ `transient` 字段的值作为参数，并在没有任何验证的情况下将这些值存储在字段中？如果不能，你必须提供一个 `readObject` 方法，并且它必须执行构造函数所需要的所有有效性检查和防御拷贝。或者，你可以使用序列化代理模式（Item\
  \ 90）。这种模式被高度推荐，因为它大大减少了安全反序列化的工作量。\n\n`readObject` 方法与构造函数之间还有一种相似性，适用于非 `final`\
  \ 可序列化类。像构造函数一样，`readObject` 方法不能直接或间接地调用任何可重写的方法（Item 19）。如果违反了这一规则且该方法被重写，则重写的方法将在子类状态被反序列化之前运行。这可能会导致程序失败\
  \ [Bloch05, Puzzle 91]。\n\n总结一下，每当你编写 `readObject` 方法时，都要抱这样的心态：你正在编写一个公共构造函数，无论给定什么样的字节流，都必须产生一个有效的实例。不要假设字节流代表一个实际序列化的实例。虽然此项中的示例涉及使用默认序列化形式类，但提出的所有问题同样适用于具有自定义序列化类的类。这里是编写\
  \ `readObject` 方法的指南总结：\n\n- 对于必须保持私有的包含对象引用字段的类，对该字段中的每个对象进行防御拷贝。不可变类中的可变组件属于此类。\n\
  - 检查任何不变性，如果检查失败则抛出 `InvalidObjectException`。检查应在任何防御拷贝之后进行。\n- 如果必须在反序列化后验证整个对象图，请使用\
  \ `ObjectInputValidation` 接口（本书未讨论）。\n- 不要直接或间接地调用类中的任何可重写方法。\n\n### Item 89：对于实例控制，优先使用枚举类型而非\
  \ `readResolve`\n\nItem 3 描述了单例模式，并给出了单例类的如下示例。该类限制了对构造函数的访问，以确保只会被创建一个实例：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Elvis {\n    public static final Elvis INSTANCE = new Elvis();\n\
  \n    private Elvis() { ... }\n\n    public void leaveTheBuilding() { ... }\n}\n\
  ```\n\n正如 Item 3 所述，如果在其声明中添加 `implements Serializable`，该类将不再是单例。无论该类是使用默认序列化形式还是自定义序列化形式（Item\
  \ 87）并不重要，该类是否提供显式的 `readObject` 方法（Item 88）也不重要。任何显式或默认的 `readObject` 方法都会返回新新实例，该实例不会与类初始化时创建的实例相同。\n\
  \n`readResolve` 功能允许你用另一个实例替换由 `readObject` 创建的实例 [Serialization, 3.7]。如果被反序列化对象的类定义了一个具有适当声明的\
  \ `readResolve` 方法，则该方法会在新创建的对象反序列化后被调用。该方法返回的对象引用将取代新创建的对象返回。在此项功能的大多数用法中，不会保留对新创建对象的引用，因此它会立即进入垃圾回收范围。\n\
  \n如果让 `Elvis` 类实现 `Serializable`，那么下面的 `read-Resolve` 方法就足以保证单例属性：\n\n点击此处查看代码图片\n\
  \n```java\n// 用于实例控制的 readResolve - 你可以做得更好！\nprivate Object readResolve() {\n \
  \   // 返回唯一的真 Elvis 并让垃圾收集器\n    return INSTANCE;\n}\n```\n\n此方法忽略了反序列化的对象，返回已初始化的\
  \ `Elvis` 实例。因此，`Elvis` 实例的序列化形式不需要包含任何数据；所有实例字段都应该是 `transient` 的。事实上，如果你依赖 `readResolve`\
  \ 进行控制，则所有实例字段必须是 `transient` 的。否则，有心的攻击者可能在 `readResolve` 方法运行之前获取反序列化对象的引用，这种技术某种类似于\
  \ Item 88 中的 `MutablePeriod` 攻击。\n\n攻击有点复杂，但基本原理非常简单。首先，编写一个“窃者”（stealer）类，它既有一个\
  \ `readResolve` 方法，又有一个指向其隐藏的序列化单例的实例字段。在序列化流中，将单例的非 `transient` 字段替换为窃者类的实例。你现在有了一个循环：单例包含窃者，而窃者引用单例。由于单例包含窃者，当单例反序列化时，窃者的\
  \ `readResolve` 方法先运行。结果是，当窃者的 `readResolve` 方法运行时，它的实例字段仍指向部分反序列化（且尚未解析）的单例。窃者的\
  \ `readResolve` 方法将其实例引用复制到静态字段中，以便在 `readResolve` 方法运行后可以访问该引用。然后该方法返回一个与其隐藏字段类型匹配的值。如果不这样做，当序列化系统尝试将窃者引用存入该字段时，VM\
  \ 将抛出 `ClassCastException`。\n\n为了具体，考虑以下损坏的单例：\n\n```java\n// 损坏的单例 - 有非 transient\
  \ 对象引用字段！\npublic class Elvis implements Serializable {\n    public static final\
  \ Elvis INSTANCE = new Elvis();\n\n    private Elvis() { }\n\n    private String[]\
  \ favoriteSongs =\n        { \"Hound Dog\", \"Heartbreak Hotel\" };\n\n    public\
  \ void printFavorites() {\n        System.out.println(Arrays.toString(favoriteSongs));\n\
  \    }\n\n    private Object readResolve() {\n        return INSTANCE;\n    }\n\
  }\n```\n\n\n\n\n\n这是一个“窃取器”（stealer）类，是根据上述描述构造的：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ class ElvisStealer implements Serializable {\n    static Elvis impersonator;\n\
  \    private Elvis payload;\n    private Object readResolve() {\n        // 保存对“未解析”的\
  \ Elvis 实例的引用\n        impersonator = payload;\n        // 为 favoriteSongs 字段返回正确类型的对象\n\
  \        return new String[] { \"A Fool Such as I\" };\n    }\n    private static\
  \ final long serialVersionUID = 0;\n}\n```\n\n最后，这是一个丑的程序，它通过反序列化一个手工构造的流来产生两个不同的缺陷单例实例。由于。该程序中省略了\
  \ `deserialize` 方法，因为它与第 354 页上的方法完全相同：\n\n点击此处查看代码图像\n\n```java\npublic class ElvisImpersonator\
  \ {\n    // 字节流不可能来自真实的 Elvis 实例！\n    private static final byte[] serializedForm\
  \ = {\n        (byte)0xac, (byte)0xed, 0x00, 0x05, 0x73, 0x72, 0x00, 0x05,\n   \
  \     0x45, 0x6c, 0x76, 0x69, 0x73, (byte)0x84, (byte)0xe6,\n        (byte)0x93,\
  \ 0x33, (byte)0xc3, (byte)0xf4, (byte)0x8b,\n        0x32, 0x02, 0x00, 0x01, 0x4c,\
  \ 0x00, 0x0d, 0x66, 0x61, 0x76,\n        0x6f, 0x72, 0x69, 0x74, 0x65, 0x53, 0x6f,\
  \ 0x6e, 0x67, 0x73,\n        0x74, 0x00, 0x12, 0x4c, 0x6a, 0x61, 0x76, 0x61, 0x2f,\
  \ 0x6c,\n        0x61, 0x6e, 0x67, 0x2f, 0x4f, 0x62, 0x6a, 0x65, 0x63, 0x74,\n \
  \       0x3b, 0x78, 0x70, 0x73, 0x72, 0x00, 0x0c, 0x45, 0x6c, 0x76,\n        0x69,\
  \ 0x73, 0x53, 0x74, 0x65, 0x61, 0x6c, 0x65, 0x72, 0x00,\n        0x00, 0x00, 0x00,\
  \ 0x00, 0x00, 0x00, 0x00, 0x02, 0x00, 0x01,\n        0x4c, 0x00, 0x07, 0x70, 0x61,\
  \ 0x79, 0x6c, 0x6f, 0x61, 0x64,\n        0x74, 0x00, 0x07, 0x4c, 0x45, 0x6c, 0x76,\
  \ 0x69, 0x73, 0x3b,\n        0x78, 0x70, 0x71, 0x00, 0x7e, 0x00, 0x02\n    };\n\
  \    public static void main(String[] args) {\n        // 初始化 ElvisStealer.impersonator\
  \ 并返回\n        // 真实的 Elvis（即 Elvis.INSTANCE）\n        Elvis elvis = (Elvis) deserialize(serializedForm);\n\
  \        Elvis impersonator = ElvisStealer.impersonator;\n        elvis.printFavorites();\n\
  \        impersonator.printFavorites();\n    }\n}\n```\n\n运行此程序会产生以下输出，确凿地证明了创建两个不同的\
  \ `Elvis` 实例（具有不同的音乐味好）：\n\n点击此处查看代码图像\nHound Dog, Heartbreak Hotel\nA Fool Such\
  \ as I\n\n你可以通过将 `favoriteSongs` 字段声明为 `transient` 来修复这个问题，但更好的做法是通过将 `Elvis` 改为单元素枚举（条目\
  \ 3）来修复它。正如 `ElvisStealer` 攻击所示，使用 `readResolve` 方法来防止攻击者访问“临时”的反序列化实例是脆弱的，并且需要极其小心。\n\
  \n如果你将受序列化控制的类写成枚举，Java 会向你保证除了声明的常量外不会有任何实例，除非攻击者滥用了诸如 `AccessibleObject.setAccessible`\
  \ 类的特权方法。\n\n\n\n\n最后，在 `SerializationProxy` 类上提供一个 `readResolve` 方法，返回一个与包装类逻辑等价的实例。该方法的存在会导致序列化系统在反序列化时，将序列化代理转换回包装类的实例。\n\
  \n这个 `readResolve` 方法仅使用包装类的公共 API 来创建其实例，而这正是该模式的妙处所在。它在很大程度上消除了序列化的“非语言”特征，因为反序列化后的实例是使用与任何其他实例相同的构造函数、静态工厂方法和方法创建的。这让你无需额外去手动确保反序列化后的实例遵守类的不变性。如果该类的静态工厂方法或构造函数建立了这些不变性，且其实例方法维护了这些不变性，你就确保了序列化同样也会维护这些不变性。\n\
  \n以下是上述 `Period.SerializationProxy` 的 `readResolve` 方法：\n\n点击此处查看代码\n\n```java\n\
  // readResolve method for Period.SerializationProxy\nprivate Object readResolve()\
  \ {\n    return new Period(start, end);   // Uses public constructor\n}\n```\n\n\
  与防御性拷贝方法（第 357 页）一样，序列化代理方法从根本上阻止了伪造字节流攻击（第 354 页）和内部字段窃取攻击（第 356 页）。与之前的两种方法不同，这种方法允许\
  \ `Period` 的字段为 `final`，而这是使 `Period` 类真正成为不可变的必要条件（项 17）。而且与之前的两种方法不同，这种方法不需要大量的思考。你不需要弄清楚哪些字段可能会狡猾的序列化攻击破坏，也不需要在反序列化过程中显式地执行有效性检查。\n\
  \n序列化代理模式在 `readObject` 中还有另一种比防御性拷贝强大的地方。该模式允许反序列化后的实例拥有与原始序列化实例不同的类。你可能认为这在实践中没用，但确实有用。\n\
  \n考虑 `EnumSet`（项 36）。该类没有公共构造函数，只有静态工厂方法。从客户端的角度来看，它们返回 `EnumSet` 实例，但在当前的 OpenJDK\
  \ 实现中，它们返回两个子类之一，取决于底层枚举类型的大小。如果底层枚举类型有 64 个或更少的元素，静态工厂返回 `RegularEnumSet`；否则，它们返回\
  \ `JumboEnumSet`。\n\n现在考虑一下如果序列化一个包含 60 个元素的枚举集，然后向该枚举类型添加 5 个元素，最后反序列化该枚举集会发生什么。它在序列化时是一个\
  \ `RegularEnumSet` 实例，一旦反序列化，它最好是一个 `JumboEnumSet` 实例。事实上，事实恰是如此，因为 `EnumSet` 使用了序列化代理模式。如果你感兴趣，这里是\
  \ `EnumSet` 的序列化代理。它真的这么简单：\n\n点击此处查看代码\n\n```java\n// EnumSet's serialization proxy\n\
  private static class SerializationProxy <E extends Enum<E>>\n        implements\
  \ Serializable {\n\n    // The element type of this enum set.\n    private final\
  \ Class<E> elementType;\n    // The elements contained in this enum set.\n    private\
  \ final Enum<?>[] elements;\n\n    SerializationProxy(EnumSet<E> set) {\n      \
  \  elementType = set.elementType;\n        elements = set.toArray(new Enum<?>[0]);\n\
  \    }\n\n    private Object readResolve() {\n        EnumSet<E> result = EnumSet.noneOf(elementType);\n\
  \        for (Enum<?> e : elements)\n            result.add((E)e);\n        return\
  \ result;\n    }\n\n    private static final long serialVersionUID =\n        362491234563181265L;\n\
  }\n```\n\n序列化代理模式有两个局限性。它与允许用户扩展的类不兼容（项 19）。此外，它与某些包含循环引用的对象类不兼容：如果你尝试从序列化代理的 `readResolve`\
  \ 方法内部调用此类对象的方法，你将得到 `ClassCastException`，因为你还没有该对象，只有它的序列化代理。\n\n最后，序列化代理模式带来的额外力量安全性并非免费。在我的机器上，使用序列化代理序列化和反序列化\
  \ `Period` 实例比使用防御性拷贝花费了 14%。\n\n## 附录：第二版对应的项\n\n| 第二版项 | 第三版项 |\n| :--- | :---\
