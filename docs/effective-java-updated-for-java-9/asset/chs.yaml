- "# Effective Java [Java 9 更新版]\n\n\n\n![](img/9780134686042.jpg)\n![](img/9780134686042.jpg)\n\
  \n## 关于本电子书\n\nEPUB 是一种开放的行业标准电子书格式。然而，不同阅读设备和应用程序对 EPUB 及其许多功能的支持程度不异。请使用您的设备或应用设置按照您的喜好自定义显示效果。您可以自定义的设置通常包括字体、字号、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸以放大的图片。有关您的阅读设备或应用上的设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书目包含了编程代码或配置示例。为了优化这些元素的显示效果，请在单栏、横屏模式下查看电子书，并将字体大小调整为最小设置。除了以重流文本格式呈现代码和配置外，我们还包含了代码的图像，以模拟印刷书中的呈现效果；因此，当重流格式可能会影响代码列表的显示时，您将看到一个“点击此处查看代码图像”的链接。点击链接可查看高真度的代码图像。要返回之前查看的页面，请点击设备或应用上的“返回”按钮。\n\
  \n\n\n![Image](img/pub.jpg)\n\n\n\n\n\n\n\n给我的家人：Cindy, Tim, 和 Matt\n\n\n## 前序\n\
  \n如果一位同事对你说：“我的配偶今晚在家里做不寻常的晚餐。你要加入吗？”你脑海中可能会闪过三个想法：第三，你被邀请去吃晚饭；第二，英语不是你同事的母语；第一，还有相当大的困惑。\n\
  \n如果你自己学过第二门语言并尝试在教室外使用它，你就知道你必须掌握三件事：语言是如何构建的（语法），如何命名你想要讨论的话题（词汇），以及表达日常事的习惯且有效的方法（用法）。课堂上往往只涵盖了前两点，当你发现试图让别人理解自己的意思时，母语者总是在克制忍笑。\n\
  \n编程语言也是如此。你需要理解核心语言：它是算法的、函数式的，还是面向对象的？你需要了解它的词汇：标准库提供了哪些数据结构、操作和功能？而且，你需要熟悉表达日常事的习惯且有效的方法。\n\
  \n## 前言\n\n### 第三版序言\n\n1997 年，Java 刚问世时，James Gosling（Java 之父）将其描述为一种“蓝领级语言”，并且“相当简单”。大约同时，Bjarne\
  \ Stroustrup（C++ 之父）将 C++ 描述为一种“多范式语言”，它“故意与支持单一编程方式的语言不同”。Stroustrup 警告道：\n\nJava\
  \ 的相对简单性——就像大多数新语言一样——部分是幻象，部分由于其不完整性。随着时间的推移，Java 的规模和复杂性将显著增加。它的规模会翻倍或三倍，并增长实现相关的扩展或库。现在，二十年后，可以说\
  \ Gosling 和 Stroustrup 都是正确的。现在的 Java 已经变得庞大且复杂，从并行执行、迭代到日期时间表示，许多事情都有多种抽象。\n\n\
  我仍然喜欢 Java，尽管随着平台的发展，我的热情已经冷却了一些。鉴于其规模和复杂性的增加，一份实时的最佳实践指南变得尤为关键。在《Effective Java》的第三版中，我尽力为你提供了这样一份指南。我希望这一版在满足需求的同时，依然保持前两个版本的精神。\n\
  \n\n\n\n\n附记：如果我不提到最近占据了我大量时间的一项行业最佳实践，我将是不负责的。自 20 世纪 50 年我们领域诞生以来，我们一直在自由地重新实现彼此的\
  \ API。这种做法对于计算机技术的飞跃式成功至关重要。我正积极致力于维护这种自由 [CompSci17]，并鼓励你加入我。保留重新实现彼此 API 的权利，对于我们这一职业的持续健康至关重要。\n\
  \n## 第二版序言\n\n自我 2001 年编写这本书的第一版以来，Java 平台发生了许多变化，现在是时候出第二版了。最重大的变化是 Java 5 中引入了泛型、枚举类型、注解、自动装箱以及\
  \ for-each 循环。紧随其后的是 Java 5 同时发布的新的并发库 `java.util.concurrent`。与 Gilad Bracha 一起，我有幸领导了设计这些新语言特性的团队。我也非常荣幸参与服务了由\
  \ Doug Lea 领导的、负责设计和开发并发库的团队。\n\n平台的另一个大变化是现代集成开发环境（IDE，如 Eclipse、IntelliJ IDEA\
  \ 和 NetBeans）以及静态分析工具（如 FindBugs）的广泛采用。虽然我没有参与这些工作，但我从中获益匪浅，并学会了它们如何影响 Java 开发体验。\n\
  \n2004 年，我从 Sun 公司跳槽到了 Google，但在过去的四年里，我继续参与了 Java 平台的开发，通过 Google 和 Java 社区处理程序（Java\
  \ Community Process）为并发和集合 API 贡献了力量。我还有幸利用 Java 平台开发了 Google 内部使用的库。现在我体会到当用户是什么感觉了。\n\
  \n正如 2001 年我写第一版时一样，我的首要目标是与你们分享我的经验，这样你们就可以模仿我的成功，避免我的失败。新材料继续大量使用了 Java 平台库中的真实示例。\n\
  \n第一版的成功超出了我最疯狂的预期，我在尽力保持其精神的同时，涵盖了使书籍跟时所需的所有新内容。书籍的增长是不可避免的，它确实增长了，从 57 项增加到了 78\
  \ 项。我不仅增加了 23 项内容，还彻底修订了所有原始材料，并淘汰了一些已经过时的条目。在附录中，你可以看到本版内容与第一版内容的关系。\n\n在第一版序言中，我写道\
  \ Java 编程语言及其库极大地有助于质量和生产力，并且是一项令人愉快的工作。第 5 和 6 版本的发布让原本很好的事物变得更好。现在的平台比 2001 年大得多，也复杂得多，但一旦你学会了使用这些新特性的模式和惯用法，它们就能让你的程序更好，让生活更轻松。我希望这一版能捕捉到我对平台持续的热情，并帮助你们在使用该平台及其新功能时更加高效、愉快。\n\
  \n加利福尼亚州，圣何塞\n2008 年 4 月\n\n## 第一版序言\n\n1996 年，我带着行李前往西部在当时被称为 JavaSoft 的公司工作，因为显而易见那里是风中心。在随后的五年里，我担任了\
  \ Java 平台库架构师。我设计、实现并维护了许多库，并担任许多其他库的顾问。在 Java 平台成熟的过程中主持这些库是一次难生难逢的机会。毫不夸张地说，我有幸与我们这一代一些伟大的软件工程师共事。在这个过程中，我学了许多关于\
  \ Java 编程语言的知识——什么是有效的，什么是无效的，以及如何使用这种语言及其库以达到最佳效果。\n\n本书尝试与你们分享我的经验，这样你们就可以模仿我的成功，避免我的失败。我借用了\
  \ Scott Meyers 的 *Effective C++* 格式，它由 50 项内容组成，每项都传达了一个改进程序和设计的特定规则。我发现这种格式非常有效，希望你们也这么认为。\n\
  \n在许多情况下，我自豪地用 Java 平台库中的真实示例来说明这些条目。在描述某些可以做得更好的事情时，我试着挑剔我自己写的代码，但偶尔也会挑剔同事写的代码。如果尽管我尽了最大努力仍然冒犯了任何人，我诚挚地道歉。引用反面示例不是为了指责某人，而是出于合作精神，以便我们所有人都能够从前人的经验中获益。\n\
  \n虽然这本书并不完全只针对可重用组件的开发者，但它不可避免地染了我过去二十年编写此类组件的经验色彩。我自然地从导出的 API（应用程序编程接口）的角度来思考，并鼓励你们也这样做。即使你们没有在开发可重用组件，用这些术语思考往往也能提高你们所写软件的质量。此外，在不知情的情况下编写可重用组件并不稀奇：你写了一些有用的东西与隔壁的同事分享，不久之后你有六个用户了。此时，你不再具有随心所欲\
  \ API 的灵活性，并感激你在最初编写软件时为设计 API 所付的所有精力。\n\n我对 API 设计的关注对于新软件开发方法论（如*极限编程*）的信徒来说可能似乎有些不自然。这些方法论强调编写尽可能简单的程序。如果你正在使用这些方法论之一，你会发现对\
  \ API 设计的关注在你的`重构`过程中非常有帮助。重构的基本目标是改进系统结构和避免代码重复。如果没有设计良好的组件 API，这些目标是无法实现的。\n\n\
  没有语言是完美的，但有些是优秀的。我发现 Java 编程语言及其库极大地有助于质量和生产力，并且是一项令人愉快的工作。我希望这本书能捕捉我的热情，并帮助你们使用该语言更加高效、愉快。\n\
