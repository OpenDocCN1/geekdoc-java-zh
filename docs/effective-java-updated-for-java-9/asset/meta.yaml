  - 第 12 章 序列化
- - '###'
  - 事项 85：优先使用 Java 序列化的替代方案
- - '###'
  - 事项 86：极其谨慎地实现 `Serializable`
- - '####'
  - 实现 `Serializable` 的主要成本之一是降低了类在发布后更改实现的灵活性。第二成本是增加了 bug 和安全漏洞 (事项 85)。通常，对象是通过构造函数创建的；序列化是创建对象的语言外机制。无论你是接受默认行为还是覆盖它，反序列化都是一个“隐藏构造函数”，具有与其他构造函数相同的问题。由于反序列化没有与显式构造函数关联，人们很容易忘记确保它保证了构造函数建立的所有不变性，并且允许攻击者访问正在构建对象的内部结构。依赖默认的反序列化机制很容易对象面临不变性损坏和非法访问的风险（事项
    88）。
