  md: '# Charter of the Tōhoku Culture Research Center (Tōbunken)


    In accordance with the spirit of the University Charter, I hereby proclaim the
    establishment of the Tohoku Culture Research Center.


    From out of the darkness of a Yayoi-centric view of history, the light of Jomon
    is beginning to shake the soul of Japan.


    For more than 10,000 years, the spirit of Jomon has been passed down in Tohoku.
    With little more than a millennium of history, even the so-called centers of Japanese
    culture at Nara and Kyoto cannot match the depth of Jomon.


    Discoveries like that of Bannai Maruyama have completely overturned the established
    theory that the agrarian culture beginning with Yayoi is the prototype of Japanese
    culture and have taught us that the roots of Japanese culture must be sought in
    the wide circum-Pacific world.


    An outstanding civilization based on harmony with nature existed in Tohoku, enabled
    by the rich fruits of the oceans and forests. This research will not just rewrite
    the cultural history of Japan, but will become a turning point in humankind''s
    understanding of civilization.


    Tohoku, more than anywhere else, is the last remaining Mother Nature in Japan.'
