  md: '# Acknowledgments


    Research and writing is a highly efficient method for accumulating unrepayable
    debts, both financial and intellectual. My work has been enriched at every turn
    by the generosity of numerous individuals and organizations. What shortcomings
    remain mine and mine alone.


    The germ of this project began before graduate school. During the process of translating
    the website of Iwate Prefecture for Japan’s government-sponsored Internet Fair
    2001, I was struck by two things. First, learning about northern Japan opened
    my eyes to a gaping lacuna in my own knowledge and in a great deal of academic
    writing about Japan. Second, I realized that a dearth of primary materials from
    the premodern Northeast, scholars and intellectuals had developed a fascinating
    secondary and tertiary literature of interpretation and reinterpretation. This
    cottage industry of books and articles, I found as I dug further, was highly political
    and polemical, revealing in its idiosyncrasies and vicissitudes many aspects of
    the cultural discourses faced with Japanese identity, both past and present. I
    was hooked.


    A preliminary result of this interest was a master’s project completed the University
    of Sheffield under the tutela of Beverly Yamamoto, Thomas McAuley, and Richard
    Siddle. During this time, I benefited greatly from the generosity and insights
    of Kawashima Shigeru and Kanno Seikan. I continued to pursue this research at
    the University of Pennsylvania, where I enjoyed warmth, support, and stimulation
    from numerous faculty, staff,'
