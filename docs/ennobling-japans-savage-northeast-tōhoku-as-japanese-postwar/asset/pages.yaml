    # Umehara Takeshi, Jōmonism, and the Apotheosis of Japanese Culture


    The 1980s and 1990s saw a radical transformation of Tōhoku students and of public
    perceptions of the Northeast. This “late postwar Tōhoku studies” were defined
    by an agenda and methodology from that which had animated the field since 1945.
    In the 1980s, Umehara Takeshi led a movement to redefine the Northeast as the
    found and storehouse of Japan’s national identity. He did so by synthesizing the
    work of Takahashi Tomio’s generation of Tōhoku historians with the Jōmonism of
    Okamoto. Particularly important was Umehara’s ability to synthesize materials
    from multiple academic fields, including the sciences, into a holistic popular
    narrative that spoke to doubts or dissatisfaction with modern and postwar Japanese
    society latent in the reading public, and that offered a romantic, panacean vision
    based on the affirmation of an innate suppressed Japanese culture. As discussed
    below, Umehara’s work was further popularized by Asaka Norio in the 1990s in the
    form of a folkoristics-centered area studies discipline he dubbed Tōhokugaku.


    Umehara is one of the most recognizable and popular intellectuals of postwar Japan.
    Like Takahashi Tomio and others of his generation, he was deeply affected by his
    experience of World War II. Born in 1925, he graduated Kyoto University in 1948.
    After the war, Umehara turned to a mix of nativism and science to address the
