  md: '# Introduction


    # Ennobling the Savage Northeast


    Tohoku is more than Japan’s Northeast, though that is what the word means. The
    earthquake, tsunami, and nuclear meltdown of March 2011 sparked a frenzy of global
    interest in the region. In the years since "3/11," scholarly and popular articles,
    presentations, books, documentaries, websites, and more have sprung up and sprung
    forth to address various aspects of disaster and recovery. From reportage and
    survivor testimony to seismographic analyses, and from analyses of artistic representation
    and response to critiques of Tepco’s mishling of the nuclear crisis and Tokyo’s
    lack of enthusiasm for literature on the Great East Japan earthquake and its tremendous
    body of literature for recovery, there is now tremendous aftermath. Conspicuous
    by its absence, however, is perspective on the "pre-3/11" history of Tohoku and
    the meanings of the Northeast within Japanese national history.


    From 1945 until 2011, Tohoku was a kind of floating or empty signifier in Japanese
    discourses of national reinvention during the postwar, pre-11 period, a symbol
    ready to be filled with new meanings at every turn. After Japan’s defeat in World
    War II, the region’s path "discovered" as a possible remedy for the tragic course
    charted by mainstream Japanese history. This was only possible because Tohoku
    had previously been so far outside that mainstream, regarded as a victim and a
    pariah. By the time of the triple disaster of March 11, Tohoku had assumed a position
    at the'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# INTRODUCTION


    center of discourses about national origins and traditions. This book places the
    radical discursive transformation of Tohoku within regional, national, and global
    contexts. This ordering reflects the scope and flow of the discourse itself: what
    began in the 1950s as a local-national dialogue had become by the 1980s as a part
    of cultural nationalist (re)assertions of Japan''s special place in the world.


    For much of Japan''s recorded history, Tohoku had been synonymous with some combination
    of savagery and backwardness, a troublesome region either resisting or dragging
    down Japan. However, this same region was reimagined as a privileged locus for
    the creation of postwar values in Japan from 1945 to 2011. Sitting on the physical
    and cultural margins of Japanese history, the Northeast proved a potent, protein
    symbol appropriated by diverse types throughout the postwar years. In the debate
    deestablishment of the conservative order in 1955, local scholars began to explore
    the subaltern history of Tohoku as an alternative source of sociopolitical legacy,
    a tradition that could be mobilized to shape the new postwar order. By the 1990s,
    though the contours of the original critique were not entirely faced, they had
    been transformed as a result of discovery by and integration into the discourse
    of neoconervative intellectuals for whom the Northeast was the linchpin of a second
    postwar redefinition of Japan. This time, Tohoku was not the centerpiece of an
    effort to save Japan, but of one in which Japan was to save-save the world.


    # Tohoku as Place, Tohoku as Idea


    The modern term Tohoku describes an area of Honshu, Japan''s largest isle, measuring
    nearly 67,000 square kilometers (map 1). As a whole, the Northeast is an overwhelmingly
    rural region, the kind often referred to as “undeveloped” or socioeconomically
    “backward.” The six prefectures of Tohoku—Akita, Aomori, Iwate, Fukushima, Miyagi,
    and Yamagata—account for about 30 percent'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# INTRODUCTION


    of the total landmass of Japan''s main island. To put this in some perspective,
    the area is larger than Denmark or the Netherlands, nearly three and a half times
    as large as Shikoku, more than one and a half times larger than Kyushu, and a
    little more than half the size of Pennsylvania. The prefectures are large and
    generally sparsely populated. Nationally, Iwate and Fukuoka rank only Hokkaido
    in size. Among Japan''s forty-seven prefectures, the only Tohoku Prefecture ranked
    higher than fortieth in population density is Miyagi. Its capital, Sendai, is
    the only million-person city in the Northeast. Sendai''s population is three times
    the size of the next largest city in Tohoku, though half that of Sapporo. The
    economy is rural, peripheral, and focused on primary industries. Together with
    neighboring Niigata—once considered part of the region—the Tohoku region is the
    rice basket of Japan and produces about a quarter of all the rice grown nationally.
    In contrast, only 5 percent of the country''s manufactured goods by value are
    made in Tohoku. Despite its size, even before the earthquake, tsunami, and nuclear
    disaster of 2011, the Northeast as a whole accounted for barely 6 percent of Japan''s
    GDP, but more than 16 percent of national output from primary industries.² The
    region is poor. Capita income across the region is well under the national average,
    as is population density. These socioeconomic indicators (large administrative
    areas with low population and heavy reliance on primary industries) are products
    of the Northeast''s historical distance from the centers of Japanese government,
    industry, and culture, and are often considered its defining features.


    Tohoku is not only far from Tokyo and Kyoto, it is far from homogenous and from
    static. The region is defined not by uniformity, but by wide variations in climate,
    topography, demography, language, and culture, to name a few. Tohoku has always
    been divided, diverse, and changing, a fact highlighted and heightened by the
    experience of March 11 and its aftermath. For historical and climatic reasons,
    the affected prefectures, Fukushima, Miyagi, and Iwate, were already different
    from the Japan Sea coast prefectures of Yamagata and Akita, but also wildly different
    from each other.³³ Sendai, the region''s biggest'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# INTRODUCTION


    population and financial services sector, is fully recovered, while the Fukushima
    coast is littered with irradiated ghost towns.


    Even the individual prefectures are characterized more by obvious differences
    than they are by homogeneity. Iwate is a fine example of this, both before and
    after 2011. The tsunami of 3/11 wreaked destruction on its southern coast, but
    inland the scale of disaster was comparatively small, despite the earthquake''s
    intensity. This is a testament to the prefecture''s geographical diversity: Iwate
    is divided east-west by mountain ranges into at least three major ecological zones
    along urban-rural lines. The rich farmlands of the Kitakami River valley are entirely
    unlike the ri coasts, and the dialects of the two areas occasionally approach
    mutual incomprehensibility. The town of Tōno, made famous by Yanagita Kunio''s
    pioneering folklore study, has become a fusurato tourist mecca selling a carefully
    packaged experience of rural folk life to busloads of souvenir shoppers. To the
    west, the prefecture''s “Industrial City,” Kitakami is located along the oldest
    northern trunk line of the shinkansen, Japan''s superexpress “bullet” train, whose
    transformative socioeconomic effects are among the many reasons that the Northeast
    has seen dynamism and change, public opinion notwithstanding.


    And yet, the idea of Tohoku has had coherence and meaning for the people who live
    there, as well as for those who do not. It is not the only way to think about
    the lived space that is the northern prefectures of Honshu, but it is, and has
    been, one of the most popular and important. In this sense, Tohoku is bit like
    the American Midwest, a label applied to a region so large and diverse that the
    world ought to be meaningless. But it is not. It is invested with particular significance
    as a region unto itself and as part of the discourse of American national character.
    As Ogumi Ejima warned, “Tokyo’ and ‘Tohoku,’ metropolis and ‘frontier,’ are without
    substance. They are concepts created in a particular rationality.” The Midwest
    is a place, but also an idea. The same is true of Tohoku. The question asked by
    this book'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# INTRODUCTION


    is what the idea(s) of Tohoku from 1945 to 2011 can tell us about Japan, about
    historical resentment, about discourses of race, about regionalism and nationalism,
    or about the Northeast itself.


    # Tohoku as Postwar Thought


    The field of postwar Tohoku studies has always been a kind of “memory activism,”
    what Yifat Gutman calls “reimagining the past for the future.” In his Meiji Restoration
    Losers, Michael Wert explores the processes by which “memory activists” rehabilitated
    a bureaucrat villainized in standard histories of the Meiji Restoration. “By commemorating
    the vanquished,” argues Wert, these memory activists, bent on rehabilitating their
    fallen heroes, make claims to plurality in the formation of national identity,
    memory, and history.” Rather than focusing on an individual fallen hero, postwar
    Tohoku studies at the regional level, rehabilitating the region’s better legacy.
    Early postwar writing on Tohoku attempted to establish the region as a new locus
    of legitimacy for national identity.


    At war''s end, instead of depicting an economically and culturally desolate wasteland,
    a small band of historians and archaeologists reinterpreted the Northeast as the
    cradle of a unique history and culture that could serve as a foundation for the
    new postwar Japan. This change in respective perspectives, among other things,
    the caesura of 1945, after which distance from resistance to the centers of Japan
    were a badge of honor. In the first years after war''s end, for most in Japan
    (and Europe), just getting by in the face of material destruction and physical
    and emotional exhaustion was the overwhelming, even priority. But even in the
    midst of the horrific aftermath of World War II, some began to look to the future
    immediately. And when they died, they often looked to the past. As Wolfgang Schivelbusch
    noted, “Defeat . . . becomes synonymous with liberation,” and history often plays
    a crucial role as the vanquished look to a halcyon past as both a comfort and
    a roadmap'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# INTRODUCTION


    to a different yet equally glorious future to that originally imagined.

    Though the path to war and even the casus belli might be rejected, the collective
    imagination of the defeated could return to the "stretch of history before the
    mistaken detour," declaring it "more consonant with its spirit, destiny, and true
    character," and with a mission to transform defeat into a moral lesson that will
    contribute to the future of all humanity. The radical revisionism of historians
    like Takahashi Tomio, whose work is central to early postwar Tōhoku studies, was
    overly critical of the course of Japanese history, rejected Japan or sought independence.
    In the massive disillusionment after World War II its purpose was, as Takahashi
    later reflected, to find—or create, if necessary—“a Japan that we could be proud
    of and have hope for.” Tōhoku was a kind of postwar thought, a response to the
    physically and emotionally devastating experiences of war and defeat. To put it
    another way, the Northeast was a solution proposed to the problem of what to do
    with Japan after 1945. Its importance was measured in its contribution to righting
    the course of Japanese history. Until about 1980, the field of Tōhoku studies
    was driven by this desire to reconfigure the history of the Northeast as a source
    of new Japanese values, and to recuperate Japan by recuperating the Northeast.


    This process gradually evolved, coming to fruition after 1980, as Tōhoku was removed
    from the margins and placed in the center of some influential discourses on national
    identity. What had begun as a minor, outside academic movement steered by a small
    cadre of regional historians came to influence local intellectuals in the 1960s.
    Tōhoku leapt onto the national stage in the early 1980s, as evidenced in part
    by the popularity of novels and television dramas that had absorbed and adapted
    its themes. This jump precipitated transformations of both form and scale. From
    that point forward, a number of leading neoclassical intellectuals resituated
    this argument, encompassing within their beliefs that Japanese culture enjoyed
    a special destiny for modernity’s ills and transforming the purview of this discourse
    from the regional-national (Tōhoku-Japan) to the universal (Tōhoku-Japan-world).
    They discovered in the Northeast the best-preserved essence of a traditional Japanese'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Tōhoku as Noble Savage, Tohoku as Nostalgia


    culture that was not only an antidote for the ills of modern or post-war Japanese
    society, but also a cure for modernity’s evils at the global level, from environmental
    destruction to the threat of nuclear warfare in a Cold War world.


    Postwar Tohoku studies, 1945–2011, can be dividedfully into two periods, one on
    either side of 1980. The first was the era of Tohoku as Noble Savage, the Other
    leveraged to critique Japan. The rise of nostalgia was the most salient characteristic
    of the post-1980 period, in part because it was symptomatic of a move toward the
    Northeast alterity. Throughout, the field of Tohoku studies was colored by primitivism,
    though there was a distinct difference between the two periods.


    From war until about 1980, Tohoku studies was animated by a desire to enable the
    savage Northeast. Rather than a recalcitrant backward region of historical and
    ethnic savagery, in the context of defeat and rebuilding, the history and culture
    of Tohoku were reread as part of a critique of mainstream Japan, especially its
    avaricious expansionism and colonialism. The indigenous people of the Northeast,
    called Emishi by the Japanese, were fiercely, just independent. After nominal
    incorporation into the Japanese state’s administrative structures at the end of
    the eighth century, this desire for self-determination manifested itself in the
    great northern polity of Hiraumi. For a century, this regime hybridized Emishi
    and Japanese elements to carve out an autonomous sphere encompassing roughly all
    of modern Tohoku before its demise—once again at the hands of Japanese invaders.
    Because the Northeast was Japan’s first and oldest colony, marginalized and oppressed
    throughout history and peripheralized by the modern state, it could be a well-spring
    of “new” values for a new age, the postwar. Victimization and disenchantisement
    earned legitimacy. Regional autonomy and character, too. But most of all, the
    “culture of resistance” against Japan'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'throughout history was a badge of honor, consequences—socioeco-numeric and
    cultural “backwardness”—be damned.¹10


    This reevaluation of the region, its people, and its culture was a dramatic volatile-face
    only plausible or even possible in the valley of self-doubt after 1945. Historically,
    when Japan was confident, Tohoku had been made to play the role of Ignorable Savage,
    a stagnant, boorish, and primitive state of protracted, irrational resistance
    to progress and civilization represented by mainstream Japan. As Japan expanded
    its influence and territory outward of the Kanto plains from the seventh century
    the Emishi offered resistance.¹¹ was especially true in northern Tohoku, where
    the name Emishi became synonymous with fierce, protracted struggle and warfare
    against Japanese expansionism. Though the Emishi were eventually mostly “conquered”
    and assimilated, the word became a trope for Tohoku as the Ignorable Savage, a
    metonym linking the space, culture, and people of the Northeast under a single,
    savage label. In later centuries, this archetype of Tohoku persisted as a facile
    explanation for any and all elements encountered north of the Kanto plains, and
    was married to racial theory in the nineteenth century.


    In the 1950s, in the writings of historians like Takashi Tomio, Tohoku emerged
    as a Noble Savage. War and surrender forced people at all levels of Japanese society
    to rethink the nation’s values and path, including attitudes toward the Emishi
    heritage of resistance to Japanese (ancient) imperialism. Rather than an alien
    race in predetermined savagery, the Emishi were recast as noble freedom fighters.
    They had defended their homeland against Japanese invasion, never taking up arms
    as aggressors. As such, the Emishi had something to teach the new, post-1945 Japan.
    Rather than “free land” for the tà à là the American West, the Northeast was Japan’s
    first colony and the Emishi its first colonized people. This was Tohoku’s new
    heritage and identity: a virtuous victim and marginal repository of values and
    traditions oppressed, suppressed, and ignored by mainstream Japan. In this way,
    the most important group of academics working on the Northeast reimagined their
    work as a powerful critique of Japanese history and culture.¹²'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# INTRODUCTION


    After 1980, science and nostalgia, the latter feeding on the former, conspired
    to place Tohoku in the center of national identity discourse. Because of its rich
    pre-rice indigenous history, eastern Honshu—especially the Northeast—became central
    to the concerns of archaeologists and anthropologists studying Japanese ethnogenesis.
    Umehara Takeshi, one of Japan''s most influential public intellectuals, brought
    nostalgia to the fore of academic and public interpretations of Tohoku. On the
    one hand, Umehara''s enthusiastic nostalgia for an authentically Japanese rural
    tradition preserved in the blood and culture of the region revived the antimodernism
    and ruralophobia (and to a lesser extent antistatism) of the founding father of
    Japanese folkloristics (minzokaku), Yanagita Kunio. Yanagita had imagined the
    Northeast as a storehouse of native Japanese traditions to be preserved in the
    face of imported modernization and industrialization and the modern authoritarian-bureaucratic
    state. On the other hand, Umehara effectively tapped into widespread disaffection
    with the postwar social order, the general malaise of the displaced and disconnections
    of high capital and high growth. The “backwardness” of Tohoku was reconfigured
    as the comforts of a “vanishing” home—Tohoku’s homeland.


    Tohoku''s transformation into Japan''s universal “home” (where the heart, the
    rice, and grandmother''s house is) began with men like Yanagita Kunio, but took
    a more complex turn in the public mind during the postwar boom, when physical,
    economic, and cultural rifts surrounded the majority of Japanese from ancestral
    lands, occupations, and practices. The Northeast became Japan''s past as much
    as its home: the unchanging place of origin and possible return, frozen in an
    eternally premodern homeostasis, materially impoverished but spiritually and culturally
    richer than the frantic displacement of the modern city to which so migrated.
    This was a process of incorporation. The Noble Savage perform exists beyond the
    core of the national Self, at its margins or beyond. In its primitivism, the idea
    of noble savagery can have a temporal dimension (and must have a cultural aspect),
    but the label is highly specialized. On the other hand, Tohoku as nostalgia was
    integrated into a national past.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Svetlana Boym’s writings on nostalgia and Marilyn Ivy’s observations on the
    spectacular persistence of the “vanishing” are appropriate for understanding this
    reframing. Nostalgia is a fantasy in which the temporal and spatial are imbricated
    and inextricable, according to Boym. The experience of longing for a place, for
    example, can be the expression of a desire to revive a lost time, “the time of
    our childhood, the slower rhythms of our dreams,” or a halcyon era of traditional
    values and virtues. “Nostalgia,” explains Boym, “is a longing for a home that
    no longer exists or has never existed.” *Nostos* is the return home, *algia* longing.
    Boym identifies two types of nostalgia, reflective and restorative. Her interest
    is primarily in the more ironic and playful, intimate and personal *algia* of
    the former. Mine is in the dead serious *nostos* of the distance from either longing
    or its object. Rather than finding pleasure in the longing, restorative nostalgia
    seeks to revive “a perfect snapshot” of the past—it seeks the return home. Rather
    than the personal, it “evokes national past and future… but as truth and tradition.”
    Especially prevalent in times of upheaval and anxiety, restorative nostalgia seeks
    the comfort of a return to origins, to the mythical home of a perfectly preserved,
    utopian past.¹³ That past, as we know, is often found in “invented traditions,”
    which are frequently constructed from and constituted by the “vanishing.” The
