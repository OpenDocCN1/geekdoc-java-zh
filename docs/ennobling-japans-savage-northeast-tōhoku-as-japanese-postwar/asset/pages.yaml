    The idea of the “Sick Man” and its afterlife as a rallying cry is useful in understanding
    the ways in which the early postwar Tohoku scholars perceived and conceptualized—explicitly
    or not—their project. The metaphor of sickness is a thought-provoking one, suggesting
    a temporary aberration. Illness can be cured, restoring the “natural” order. Sickness
    is a mandate, in the sense, to get well. More generally, national histories are
    often based around the theme of victimhood, “sickness,” or other traumas. Régimes
    of collective national representation are often based on what Vamik D. Volkan
    has labeled “chosen traumas” and “chosen glories.” Volkan’s claim that the glories
    of the past are less emotive traumas because traumas are unfinished tasks demanding
    completion echoes Ernest Renan’s observation that, when it comes to national memory,
    “more than triumphs because they impose duties and command a shared effort” of
    the collective. Both triumphs and traumas are transmitted intergenerationally
    through education, ritual, and the quotidian apparatus of what Michael Billing
    calls nationalism. Trauma has a dual function in enforcing positive group identity.
    First, the wrongs of the past against the collective must be registered by the
    collective. In practice, this is rare, and even in those unusual cases where redemption
    is found, the satisfaction of this new “chosen glory” also bolsters a sense of
    positive group identity and cohesion. Second, the survival of the nation despite
    victimization can “build a group’s self-esteem as the group members begin to see
    themselves as the progeny of a long line of survivors.” In either case, “chosen
    traumas,” once chosen, are divorced from history and take on an extrafactual life
    of their own; as Richard White has written, “facts are rarely at the heart of
    historical disputes,” and though they are by no absent from national history and
    historical memory, they are not its substance.'
