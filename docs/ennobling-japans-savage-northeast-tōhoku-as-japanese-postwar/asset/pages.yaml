    It is a testimony to human resilience that the great majority of Japanese transcended
    exhaustion and despair to refashion their lives in diverse and often imaginative
    ways. Some years took to do so. Some threw off the psychological prostration of
    kyodatsu within days. Others never succumbed to it all.³⁵¹


    In part, this was possible because defeat was liberating for many Japanese. March
    11 was not. Nor will it ever be. Anyone who understands the history of Tōhoku
    may find it hard not to believe that Tokyo cares little for the Northeast, and
    Tohoku has a long and bitter historical memory. Still, if postwar history and
    postwar Tōhoku studies are any guide, there is little reason to doubt Asaka Norio’
    claim that “someday, Fukushima will become a place of beginnings,” and there is
    cause to search for a “little hope” for the future.⁵² Nor is there to doubt the
    words of Yamauchi Akemi, one of the years before 2011 and now firmly established
