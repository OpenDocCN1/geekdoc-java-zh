    # CHAPTER FIVE


    Akasak’s minzokugaku-cum–Tohoku, unlike Yanagita’s minzokugaku, participates in
    what Svetlana Boym has called “restorative nostalgia,” a romantic longing which
    mistakes itself for a literal project to recover and restore history and tradition.
    According to Boym, nostalgia is a revolt against progress, against change, against
    modernity. It is a kind of utopianism directed towards the past, a “rebellion
    against the modern idea, the time of history and progress.” It is the desire for
    organic community and wholeness, a defensive reaction stimulated by the pace and
    anxieties of change in (post)modern life.¹104 Restorative nostalgia, as Boym describes
    it, is a yearning to overcome the perception of “temporal distance and displacement.”
    The cure it provides is illusory, however, and the result something like the torture
    of Tantalus. “What drives restorative nostalgia is not the sentiment of distance
    and longing but the anxiety about those who draw attention to historical incongruities
    between past and present and then question the wholeness and continuity of the
    restored tradition.”¹105


    Boym’s observations on nostalgia elucidate the centrality of temporal collapse
