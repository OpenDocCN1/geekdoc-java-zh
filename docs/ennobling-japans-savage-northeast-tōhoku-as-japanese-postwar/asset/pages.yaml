  md: Looking back into history must also be about staring down the present and looking
    toward the future. This research is dedicated to those who have lost their lives,
    loved ones, livelihoods, and hope since 3/11. My thoughts are equally with those
    who struggle on as they are with those who have passed on. My hope is that a better
    understanding of the history of Tohoku will somehow lead to a better future for
    the Northeast and its people.
