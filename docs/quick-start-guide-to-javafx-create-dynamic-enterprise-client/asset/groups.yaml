    \ Class\n\nThe Image class is used to take in image files and format them for\
    \ display. The Image class and the ImageView node work hand-in-hand to display\
    \ your images to the screen.\nThe Image class must be imported before you start\
    \ working:\n\n```\nimport javafx.scene.image.Image;\n```"
  - "[PAGE 109]\n\n# 92 Quick Start Guide to JavaFX\n\nThe Image class can read images\
    \ from various sources. In this section you work with two of these sources: the\
    \ Web and a local image file. First, let's pull an image from the Internet. The\
    \ image you will display is http://jfdimarzio.com/butterfly.png. The constructor\
    \ of the Image class takes a URL for an image to display. The URL of the image—in\
    \ this case, http://jfdimarzio.com/butterfly.png—is passed to the constructor.\
    \ This tells the Image class to look for a valid image to format.\n\nAfter you\
    \ have created an Image object, use the setImage() method of the ImageView to\
    \ set the source of the image you want to write to the scene graph. The width\
    \ and height properties govern how the image is displayed are set in the ImageView.\
    \ You use the setFitWidth() and setFitHeight() methods to tell the ImageView,\
    \ “I want the image to fit to this width and height,” like so:\n\n# NOTE\n\nYou\
    \ can use a trick by setting the width or the height attribute and then using\
    \ setPreserveRatio() to tell the ImageView to keep the original width/height ratio\
    \ of the Image—using your new value.\n\n```\n@Override\npublic void start(Stage\
    \ primaryStage) {\n    Image butterfly = new Image(\"http://jfdimarzio.com/butterfly.png\"\
    );\n    ImageView imageView = new ImageView();\n\n    imageView.setImage(butterfly);\n\
    \    imageView.setFitWidth(300);\n    imageView.setPreserveRatio(true);\n\n  \
    \  StackPane root = new StackPane();\n    root.getChildren().add(imageView);\n\
    \n    primaryStage.setScene(new Scene(root, 300, 250));\n    primaryStage.show();\n\
    }\n```\n\nAfter you compile and run this code, your application should look like\
    \ what's shown in Figure 7-1.\nJavaFX does a good job of displaying images from\
    \ a website, and the setup involved in this is fairly straightforward. The url\
    \ parameter points directly to the image you want to display. However, chances\
    \ are you going to display images that you package into your application.\n\n\
    If you want to display an image that you have locally, the concept remains the\
    \ same but the process is slightly different. You will want to think ahead as\
    \ to how the image will be distributed with the application."
