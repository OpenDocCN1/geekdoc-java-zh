    # NOTE


    Comments can be divided into two types: multiline and single line. Different characters
    are used to note each.


    The beginning comments that have been added to your file read as follows:


    ```

    /*

    * To change this template, choose Tools | Templates

    * and open the template in the editor.

    */

    ```


    By Java coding standards, your beginning comments should include the class''s
    name, version, and creation/modification dates, as well as any copyright information
    you may want to include.


    Take a look at the first and the last two characters of the comments that were
    added to your file. The first two characters are /* and the last two characters
    are /. All your multiline comments must begin and end with these characters, respectively.
    All the other asterisks you see in the comments (at the start of each new line)
    are added purely for embellishment and readability.


    Typically, comments are added to explain the purpose of a script file as a whole,
    or possibly larger sections of code. For example, place your cursor at the end
    of the line where your name appears and press the ENTER key. Highlight the template
    comments that were added to your file and replace them with the following:


    ```

