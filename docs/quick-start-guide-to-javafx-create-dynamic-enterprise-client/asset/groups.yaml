    <Label GridPane.columnIndex="1" GridPane.alignment="CENTER"

    GridPane.hrow="ALWAYS" GridPane.rowIndex="2" GridPane.alignment="CENTER"

    GridPane.vrow="ALWAYS" text="" />

    <TextField prefWidth="200.0" GridPane.columnIndex="1"

    GridPane.rowIndex="0" />

    </children>

    ```'
