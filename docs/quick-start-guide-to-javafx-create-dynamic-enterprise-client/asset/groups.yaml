    ## Using Events


    ### Key Skills & Concepts


    - Reacting to mouse events

    - Using anonymous inner classes

    - Trapping key events


    This chapter introduces you to JavaFX events. The concepts that are required when
    working with events are key in producing rich, interactive applications. Events
    allow your application to respond to the actions of the user.


    ## What Are Events?


    Events provide a way to interact with your users in JavaFX. As a developer, you
    can use many types of events to enable your users to interact with and react to
    your environment. Events can be fired as a result of the user interacting in some
    way with your environment, and you can register listeners for these events and
    write actions using the data associated with the events.


    In this chapter you discover and utilize two common sets of events: mouse events
    and keyboard events.


    ## Mouse Events


    A mouse event is the generic term for the action of any pointer-style input. The
    provider of this input does not necessarily have to be a physical mouse. Any device
    that moves a pointer across an environment will generate a mouse event. A mouse,
    stylus, track ball, track pad, or any other navigational tool will generate a
    mouse event if it moves your pointer around your JavaFX environment.


    Here''s a list of the properties of type EventHandler that generate mouse events:


    - onMouseClicked

    - onPressed

    - onMouseReleased

    - onDragged

    - onDragEntered


    ## Chapter 10: Using Events


    - onMouseDragExited

    - onMouseDragOver

    - onMouseDragReleased

    - onMouseEnter

    - onMouseExited

    - onMouseMoved


    Although some of these actions may be named descriptively enough for you to figure
    out what action they listen to, some have similar and confusing names. Therefore,
    let''s clear up any confusion by describing what each action is before we dive
    into building code around them:


    - onMouseClicked: This property is used if a full mouse click is detected (the
    user presses and releases the mouse button).

    - onMousePressed: This property is used when the user presses the mouse button.
    The user does not have to release the button to fire this event, like onClick.

    - onMouseReleased: This property is used for the second half of the onClick event.
    This property is used when a mouse button is released.

    - onMouseDrag*: These properties are used when a mouse button is held down and
    the mouse is moved. Mouse-drag-related event objects include the x and y position
    of the mouse.

    - onMouseEnter: This property is used when the mouse pointer enters the node to
    which the event is attached.

    - onMouseExited: This property is used when the mouse pointer exits the node to
    which the event is attached.

    - onMouseMoved: This property is used when the mouse is moved within the borders
    of the given node.


    JavaFX recognizes the completion of the onMouseReleased event as the logical conclusion
    of a mouse-clicked event. However, if you move the mouse between the time you
    press the mouse button and release it (that is, perform an intentional or unintentional
    mouse drag), you will fire the following events in order:


    - Mouse pressed

    - Mouse dragged

    - Mouse released


    # 144 Quick Start Guide to JavaFX


    In this case, mouse-clicked event is fired. Because other events are fired the
    press and the release, JavaFX does not fire a mouse-clicked event.


    Note that "mouse clicked" is a specific event that encapsulates a contiguous mouse-pressed
    and mouse-released events. If any events are fired between "mouse pressed" and
    "mouse released," the action is no longer considered a mouse-clicked event.


    Why then does mouse pressed still fire in both scenarios? JavaFX predict what
    will happen after the mouse-pressed event. It cannot say whether the action will
    be a mouse-clicked or mouse-released event until the action is completed; therefore,
    onMouseClicked will always fire.


    Now that you understand when each event is fired, let''s discuss how you register
    them. The logic is here that when onMouseClicked is triggered—that is, when the
