    # Using Gradients


    You can use two kinds of gradients to fill your shapes: LinearGradients and RadialGradients.
    LinearGradients are gradients that fill in a straight line from one side of a
    shape to the opposite side. RadialGradients start the gradient at one point, and
    the gradient radiates out from that point to fill the shape.


    Let''s first look at how to apply a LinearGradient to a rectangle.


    # LinearGradients


    The LinearGradient class is contained in the javafx.scene.paint package:


    ```

    import javafx.scene.paint.LinearGradient;

    ```


    You need to learn about seven parameters for the LinearGradient class constructor
    before you properly fill a shape with a gradient.


    The first four parameters are startX, startY, endX, and endY. On the x-axis, 0
    is the left side of your shape and 1 is the right side of your shape. On the y-axis,
    0 is the top of your shape and 1 is the bottom of your shape—if proportional is
    set to true. Otherwise, the values for the x- and y-coordinates in the local coordinate
    system there will be no gradient stretching. To keep things easy, set proportional
    to true for now.


    Speaking of which, the fifth parameter is the proportional parameter, which accepts
    a Boolean value and determines how the first four parameters are treated by the
    class.'
