    ## Color.rgb


    `Color` 类允许你使用想要创建的颜色的 RGB（红、绿、蓝）值。大多数颜色都是由不同量的红、绿、蓝混合而成的。用于创建颜色的红、绿、蓝分量使用 0 到
    255 之间的值定义（0 表示不含该颜色，255 表示指定颜色的全量）。以下代码将把矩形的内部填充为紫色：


    ```

    Rectangle rectangle = new Rectangle();

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.rgb(255, 0, 255));

    ```


    在对 `Color` 类的此方法调用中，你指定的 RGB 值为 255 红色、0 绿色和 255 蓝色。这产生了紫色。然而，尝试以下代码看看得到什么：


    ```

    Rectangle rectangle = new Rectangle();

    Color purple = new Color(1,0,1,1);

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(purple);

    ```


    这段代码也产生了一个填充为紫色的矩形。`Color` 类的默认构造函数也接受 RGB 值来创建颜色。那么区别在哪里？最终结果是相同的：你得到的颜色都是紫色。区别在于
    `Color` 类的默认构造函数接受 0 到 1 之间的浮点数作为红、绿、蓝的值。请记住，`Color` 类的 `rgb` 方法接受 0 到 255 之间的值。最后一个值是
    Alpha（不透明度），它应该是 1 以实现完全不透明。


    ## Color.hsb


    `Color` 类还有一个用于 HSB（色相、饱和度、亮度）颜色的方法。在 HSB 颜色模型中，颜色或色相由 0 到 360 之间的数字表示。这个数字对应于色轮
    360 度中的某一个。


    饱和度和亮度属性由 0 到 1 之间的数字表示。值 0 表示没有饱和度和亮度，而值 1 表示完全饱和度和完全亮度。要创建你刚刚用 `rgb` 方法创建的相同紫色，请使用以下代码：


    ```

    rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.hsb(300,1,1));

    ```


    ## Color.web


    最后，`Color` 类还可以使用 Web 十六进制值为你创建颜色。`Color` 类的 `web` 方法接受标准的十六进制值。这是一个示例：


    ```

    Rectangle rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.web("#FF0FF"));

    ```


    ## alpha 属性


    你应该注意的 `Color` 类的最后一个属性是 alpha 属性。`Color` 类的每个方法都有一个可选的 alpha 属性。alpha 值控制所创建颜色的透明度。alpha
    值是 0 到 1 之间的值，0 是透明的，1 是不透明的。alpha 值可以添加到 `Color` 类的任何方法中。通过将 alpha 值设置为 0，你将实现完全透明：


    ```

    Rectangle rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.web("#FF0FF",0));

    ```


    与 0 的完全透明相反，你可以将 alpha 值设置为 1 以获得完全不透明的颜色：


    ```

    Rectangle rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    ```


    ## 第 6 章：使用颜色和渐变


    ```

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.web("#FF00FF",1));

    ```


    最后，将 alpha 值设置为 .5 将为你提供 50% 的透明度：


    ```

    Rectangle rectangle = new Rectangle();

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.web("#FF00FF",0.5));

    }

    ```


    在下一节中，你将学习如何创建和使用渐变。渐变为填充形状提供了一种创意且引人注目的方式。


    ## 使用渐变


    你可以使用两种渐变来填充形状：线性渐变（LinearGradients）和径向渐变（RadialGradients）。线性渐变是从形状的一侧到另一侧沿直线填充的渐变。径向渐变从一个点开始渐变，渐变从该点向外辐射填充形状。


    让我们先看看如何向矩形应用线性渐变。


    ## 线性渐变


    `LinearGradient` 类包含在 `javafx.scene.paint` 包中：


    ```

    import javafx.scene.paint.LinearGradient;

    ```


    你需要了解七个参数。`LinearGradient` 构造函数接受 `startX`、`startY`、`endX`、`endY`、`proportionalX`、`proportionalY`
    和 `cycleMethod`。`proportionalX` 和 `proportionalY` 是 0 到 1 之间的浮点数，表示起始点和终点相对于形状边界的比例。`cycleMethod`
    是一个枚举值，可以是 `NO_CYCLE`（默认）、`REPEAT` 或 `REFLECT`。


