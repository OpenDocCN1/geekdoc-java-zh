    ```\n\n```\nimageView.setImage(butterfly);\nimageView.translateX(30);\nimageView.translateY(30);\n\
    imageView.setRotate(45);\n```\n\nThe ImageView inherits methods from Node that\
    \ can be used to set the X and Y translation of the image. The method setTranslationX()\
    \ will move the image number of points on the X Cartesian coordinate scale relative\
    \ to the position of the upper-left corner of the image. Similarly, setTranslateY()\
    \ and setTranslateZ() will move the image along the Y and Z coordinates, respectively.\
    \ Finally, the setRotate() method will rotate the image at its center point a\
    \ specified number of degrees.\n\nAdd the previous code to your java file so that\
    \ it looks like this:\n\n```\n@Override\npublic void start(Stage primaryStage)\
    \ {\n    Image butterfly = new Image(\"file:C:/Users/J F DiMarzio/\" +\n```\n\n\
    # Quick Start Guide to JavaFX\n\n\"Documents/NetBeansProjects/Chapter7/\" + \n\
    \"src/Chapter7/images/butterfly.png\"\n\n```\nimageView = new ImageView();\n\n\
    imageView.setImage(butterfly);\nimageView.translateX(30);\nimageView.translateY(30);\n\
    imageView.setRotate(45);\n\nimageView.setFixedWidth(300);\nimageView.setPreserveRatio(true);\n\
    \nStackPane root = new StackPane();\nroot.getChildren().add(imageView);\n\nprimaryStage.setScene(new\
    \ Scene(root, 300, 250));\nprimaryStage.show();\n```\n\nRun this code using your\
    \ Desktop profile, and you will see the image rotated and moved, as shown in Figure\
    \ 7-3.\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_113_0.png)\n\nFigure 7-3 Butterfly\
    \ image rotated and moved\n\n# Chapter 7: Using Images 97\n\n# Try This Working\
    \ with Different Image Types\n\nTake some time before the next chapter to explore\
    \ how JavaFX displays and works with different images and image types. Using the\
    \ skills learned in this chapter, try to display images of different types to\
    \ JavaFX. Which images files will display? Which image files will not?\n\nFor\
    \ an added level of research, try changing the sizes of the images. Take note\
    \ of which image types allow you to load the largest images in the shortest amount\
    \ of time. This skill will help you in the future when you need to incorporate\
    \ images of different types from different developers or sources into one application.\n\
    \n# The Canvas\n\nJavaFX provides another API for drawing to the screen. The Canvas\
    \ API, another subclass of Node, can be used in a scene graph to draw the screen\
    \ and display shapes, colors, and textures.\n\nThe Canvas API uses a GraphicsContext\
    \ in rendering objects to the screen. The GraphicsContext class fulfills drawing\
    \ calls from the Canvas API. Just a handful of the available methods for drawing,\
    \ filling, and writing to the Canvas are used in the example provided in this\
    \ section.\n\nLet's use the Canvas API to draw two circles to the screen. The\
    \ first circle is a red filled circle, and the second circle is a black, unfilled\
    \ outline.\n\nFirst, set up a new Stage. Instantiate new Canvas, Group, and GraphicsContext\
    \ for the new Stage, as follows:\n\n```\npublic static void main(String[] args)\
    \ {\n    launch(args);\n}\n\n@Override\npublic void start(Stage primaryStage)\
    \ {\n    primaryStage.setTitle(\"Drawing Operations Test\");\n    Group root =\
    \ new Group();\n    Canvas canvas = new Canvas(800, 600);\n    GraphicsContext\
    \ gc = canvas.getGraphicsContext2D();\n    root.getChildren().add(canvas);\n \
    \   primaryStage.setScene(new Scene(root, 800, 600));\n    primaryStage.show();\n\
    }\n```\n\nWith the new Stage and Canvas set, create a new method named drawCircles().\
    \ The drawCircles() method will accept a GraphicsContext from the Canvas. Then,\
    \ using the GraphicsContext, the drawCircles() method will set up the needed calls\
    \ to create the two circles in our example:\n\n```\nprivate void drawCircles(GraphicsContext\
    \ gc) {\n    gc.setFill(Color.RED);\n    gc.setStroke(Color.BLACK);\n    gc.setLineWidth(2);\n\
    \    gc.fillOval(50, 50, 300, 300);\n    gc.strokeOval(50, 50, 300, 300);\n}\n\
    ```\n\nThe drawCircles() method uses the GraphicsContext to draw two circles on\
    \ the Canvas. First, setFill() and setStroke() are called to set the corresponding\
    \ brushes to RED and BLACK. Then, the width of the brush is set to 2 pixels using\
    \ the setLineWidth() method. Finally, the circles are drawn using calls to fillOval()\
    \ and strokeOval().\n\nCompile and run the following code to see two circles on\
    \ the Canvas:\n\n```\npublic class Application {\n\n    /**\n     * @param args\n\
    \     */\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n\n    @Override\n    public void start(Stage primaryStage) {\n       \
    \ primaryStage.setTitle(\"Drawing Operations Test\");\n        Group root = new\
    \ Group();\n        Canvas canvas = new Canvas(800, 600);\n        GraphicsContext\
    \ gc = canvas.getGraphicsContext2D();\n        root.getChildren().add(canvas);\n\
    \        primaryStage.setScene(new Scene(root, 800, 600));\n        primaryStage.show();\n\
    \        drawCircles(gc);\n    }\n\n    private void drawCircles(GraphicsContext\
    \ gc) {\n        gc.setFill(Color.RED);\n        gc.setStroke(Color.BLACK);\n\
    \        gc.setLineWidth(2);\n        gc.fillOval(50, 50, 300, 300);\n       \
    \ gc.strokeOval(50, 50, 300, 300);\n    }\n}\n```\n\nThe drawCircles() method\
    \ uses the GraphicsContext to draw two circles on the Canvas. First, setFill()\
    \ and setStroke() are called to set the corresponding brushes to RED and BLACK.\
    \ Then, the width of the brush is set to 2 pixels using the setLineWidth() method.\
    \ Finally, the circles are drawn using calls to fillOval() and strokeOval().\n\
    \nThe drawCircles() method uses the GraphicsContext to draw two circles on the\
    \ Canvas. First, setFill() and setStroke() are called to set the corresponding\
    \ brushes to RED and BLACK. Then, the width of the brush is set to 2 pixels using\
