  - "[PAGE 250]\n\n# Appendix C: Answers to Self Tests\n\n4. True or false? Any class\
    \ that inherits from Node can register listeners mouse events.\n\nTrue.\n\n5.\
    \ When events are used, what is the purpose of an anonymous inner class?\n\nThe\
    \ purpose of an anonymous inner class is to immediately perform an action when\
    \ the event is fired.\n\n6. Which mouse event listener is called when the mouse\
    \ pointer exits the node to which the event listener is attached?\n\nonMouseExited.\n\
    \n7. What three event listener methods are called when the user interacts with\
    \ the keyboard?\n\nonKeyPressed, onKeyReleased, and onKeyTyped.\n\n8. In what\
    \ order are the event listener methods called?\n\nonKeyTyped, and then onKeyReleased.\n\
    \n9. What property will allow a node to accept focus?\n\nfocusTraversable.\n\n\
    10. True or false? The navigational buttons will fire the onTyped event.\n\nTrue.\n\
    \n# Chapter 11\n\n1. What process lets you take methods from one class and change\
    \ their default behavior?\n\nOverriding.\n\n2. When you're creating a class, what\
    \ keyword forces your class to inherit the methods and properties of another?\n\
    \nextends.\n\n3. In the following example, what will a call to YourDog.displayBreed()\
    \ print?\n\n```\npublic class MyDog extends Dog {\n  @Override\n  public void\
    \ displayBreed() {\n    System.out.println(\"Elkhound\");\n  }\n}\npublic class\
    \ YourDog extends Dog {\n}\n}\n```"
  - '[PAGE 251]


    # 234 Quick Start Guide to JavaFX


    +   4. True or false? Ensuring that your files are all in the same package will
    make referencing them easier.

    True.


    +   5. True or false? The process of inheriting from another class is known as
    subclassing.

    True.


    +   6. What keyword do you use to implement an interface?

    implements.


    +   7. True or false? You instantiate custom created nodes the same way you would
    instantiate a standard one?

    True. All classes/nodes are instantiated the same way.


    +   8. What is the purpose of an HBox?

    The purpose of an HBox is to automatically lay out nodes horizontally.


    +   9. What keyword annotation, beginning with @, can be used to change the default
    functionality of an inherited method?

    @Override.


    +   10. True or false? Creating an API interface for your custom classes is a
    good coding procedure.

    True. You should follow good coding practice whenever possible.


    # Chapter 12


    +   1. What node is used to hold or render a web page in a JavaFX app?

    WebView.


    +   2. What packages contain the nodes needed to work with WebView and WebEngine?

    javafx.scene.web.


    +   3. What method of the WebEngine is used to load a web page into a WebView?

    load().


    +   4. True or false? JavaScript-to-Java communication is prohibited within Java.

    False.


    +   5. What method is used to execute a JavaScript against a page loaded in the
    WebView?

    .executeScript().'
  - '[PAGE 252]


    # Appendix C:... Answers to Self Tests


    # Chapter 13


    +   1. What is Cascading Style Sheets (CSS)?

    CSS is a styling language that allows you to separate the styling elements of
    an object from the object itself.


    +   2. What file extension is used for Cascading Style Sheets?

    .css.


    +   3. What wizard helps you create and add a CSS to your package?

    The New File Wizard.


    +   4. If you use the wizard to create your CSS, what class is added by default?

    root.


    +   5. True or false? To create a CSS class that applies to all nodes of a certain
    type, the name of the class should be the name of the node type in lowercase.

    True.


    +   6. What prefix is added to every Node property to call it from a CSS class?

    -fx-.


    +   7. What property of Scene let you apply a style sheet to your script?

    styleSheets.


    +   8. True or false? You can only add one style sheet to a Scene.

    False. You can add multiple style sheets to any particular Scene.


    +   9. What Node property allows you to assign a specific CSS class to a node?

    styleClass.


    +   10. True or false? If you have a node with a node-applied CSS class and a
    styleClass property, the style in the styleClass will override that in the node-applied
    style.

    True.


    # Chapter 14


    +   1. What node is used to hold a MediaPlayer?

    MediaView.


    +   2. What package contains all the nodes needed to work with media files?

    javafx.scene.media.


    +   3. What property of the MediaPlayer tells the associated media object to play
    once it it has loaded?

    autoPlay.'
  - '[PAGE 253]


    4. What media formats can the MediaPlayer play?

    MP3, MP4, and FLV.


    5. What method of the MediaPlayer will pause media playback?

    pause().


    6. True or false? MediaPlayer.mediaLength() will give you the total running time
    of a media file.

    False. MediaPlayer.media.duration.toMillis() will give you the running time in
    milliseconds.


    7. What type is MediaPlayer.currentTime?

    Duration.


    8. What property of MediaPlayer can you bind to in controlling the playback volume?

    volume.'
