    # Introduction


    ## Why This Book?


    Welcome to Quick Start Guide to JavaFX. This book has been designed to give you
    the best first step into the exciting new frontier of JavaFX 8 development. JavaFX
    is a rich environment tool, and learning JavaFX is a must for anyone who wants
    to create immersive, interactive environments for users of any background.


    If you are familiar with previous versions of JavaFX, this book is a must. The
    platform has undergone major changes with the release of Java 8. Quick Start Guide
    to JavaFX covers the changes to JavaFX and prepares you for real-world development
    situations on this incredible platform.


    This book takes you through JavaFX 8 in a logical manner. It begins by explaining
    the technology behind JavaFX. You will quickly move into installing the JavaFX
    development environment and tools. Although multiple development environments
    are available for JavaFX, the focus of this book is teaching you the basics of
    NetBeans. NetBeans offers a rich, full-featured product that is easy to learn
    and will get you up and running in JavaFX in no time. By the end of the book,
    you will learn expertly into more complex examples to test your growing knowledge
    of developing rich JavaFX applications.


    Some chapters also include a “Try This” section to help you practice what you
    have learned. The “Try This” sections are structured like a textbook that you
    will be presented with tasks to complete on your own. In addition, each chapter
    has a “Self Test” section that provides quiz-style questions to further enhance
    your learning experience. Taking full advantage of the chapter questions and “Try
    This” exercises will give you a chance to refine your newly acquired skills and
    create your own applications.


    Although this book is not an advanced programmer''s reference, you should possess
    certain skills to get the most from Quick Start Guide to JavaFX. Foremost of these,
    given that JavaFX is now packaged with Java, is Java programming fundamentals.
    Knowledge of Java classes and basic types will help you understand some of the
    concepts in this book more easily.


    Any comments, questions, or suggestions about any of the material in this book
    can be sent directly to the author at jfddimarzio@jfdimarzio.com.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_18_0.png)


    # Chapter 1


    ### Introduction to JavaFX


    ## Key Skills & Concepts


    - Installing JavaFX

    - Installing NetBeans

    - Using NetBeans


    Welcome to Quick Start Guide to JavaFX. I am sure you are anxious to begin your
    journey into the exciting world of JavaFX development, and this is the perfect
    place to start. Before you begin, you need to have a fully capable development
    environment. This chapter covers the basic knowledge needed to create and establish
    a JavaFX development environment that allows you to create excitedly rich interactive
    applications. It also answers many of the questions you may have about what JavaFX
    does, and how it does it.


    ## What Is JavaFX?


    If you have ever played an Adobe Flash game or have seen an application in Microsoft
    Silverlight, you have a pretty good idea of products that are similar to JavaFX.
    I know, it''s not fair to compare JavaFX to these other environments, but if you
    have never seen JavaFX before, I have to compare it to something. Now that JavaFX
    is in its third exciting iteration, chances you have run into it somewhere.


    JavaFX delivers full-featured, interactive experiences to users in the same way
    as Flash or Silverlight. However, one of the differences between JavaFX and the
    others is that JavaFX is platform independent. Because JavaFX is now fully integrated
    with the Java Runtime, any device or system that Java can also serve up JavaFX
    experiences.


    NOTE


    Many changes have been made to the JavaFX platform between versions 1, 2, and
    now 3. If you have some experience with an older version of JavaFX, or possibly
    even with the first edition of this book, you should pay close attention because
    much of what you may have used before is very different now. Also, the third version
    of JavaFX is now officially known as JavaFX 8, because it is now part of Java
    8.


    ## What Is Needed for JavaFX Development?


    Before you jump right into development, you should examine the list of requirements
    as outlined in this section. Think of them as the prerequisites for a successful
    and rewarding learning process. You should have at least a basic knowledge of
    the following skills as well as access to the listed software.


    ## Required Skills and Knowledge


    Prior development experience is not required to follow along with this book. Even
    if you''ve created a single application or developed a basic web page, you still
    have the skills to learn JavaFX. The examples and lessons in this book are specifically
    designed to teach you JavaFX development.


    That being said, any experience you have in Java development is going to help
    you grasp the concepts of JavaFX even faster. A basic knowledge of the functioning
    concepts, although not necessary, will help you get to speed even faster:


    - **Java development** JavaFX and Java share more than their root names. If you
    have ever written a Java applet—and, more importantly, deployed a Java applet
    to a web page—you easily understand the deployment process for JavaFX. Previous
    versions of JavaFX used a proprietary language called JavaFX Script. This has
    been changed for a more unified, cross-platform Java experience. The JavaFX Script
    language was replaced with the Java API to facilitate a more unified and simplified
    programming experience.

    - **Cascading Style Sheets (CSS)** The look and feel of a JavaFX app can be modified
    using Cascading Style Sheets, or CSS. Development platforms such as HTML can implement
    CSS as a way to embell the look of.

    - **NetBeans** Although JavaFX can be developed in any integrated development
    environment (IDE), or even a simple text editor, the preferred method of development
    in this book is NetBeans. If you''ve never used NetBeans before—this book will
    walk you through everything.


    These skills are by no means required, and a lack in any of these areas will not
    affect your ability to learn Java.


    ## Required Software


    This section serves as a brief introduction to the software you will be using
    throughout this book. A few different software elements are used in JavaFX, and
    you will be very familiar with them by the end of this chapter. Don''t worry if
    you do not have any of these software elements yet or never heard of one or two
    of them. By the end of this chapter you will have downloaded and installed all
    the software required to facilitate JavaFX development.


    - JavaFX SDK The JavaFX SDK (Software Development Kit) is the major package needed
    for JavaFX development.

    - Java SE JDK The Java SE JDK (Standard Edition Java Development Kit) is required
    to compile your JavaFX Script into executable code.

    - NetBeans NetBeans is the development environment you will use to create your
    Java apps. Think of NetBeans as a specialized text editor that can use both the
    JavaFX SDK and the Java SE JDK to compile it into an executable app.


    The pieces of software listed here are free and can be easily downloaded. The
    next section of this chapter walks you through downloading and installing the
    required software.


    ## Required Hardware


    This section quickly outlines some of the hardware requirements for running JavaFX.
    Keep in mind that JavaFX (and Java in general) run on a wide array of hardware
    and hardware configurations. However, there are some hardware suggestions for
    getting the most out of JavaFX.


    In general, JavaFX will run on any hardware that is running a supported operating
    system. To enjoy the performance of the new hardware acceleration pipeline, you
    will need to follow these recommendations.


    | Graphics Card | GPU |

    |---|---|

    | NVIDIA | Mobile GPUs: GeForce 8M and 100M series or higher, NVS 2100M series
    or higher, and Mobility Quadro FX 300M series or higher; Desktop GPUs: GeForce
    8 and 100 series or higher; Workstation GPUs: Quadro FX 300 series or higher |

    | ATI | Mobile GPUs: Mobility Radeon HD 3000, 4000, and 50000; Desktop GPUs: Radeon
    HD 2400, 3000, 4000, 5000, and 6000 series |

    | Intel | Mobile GPUs: GMA 4500MHD and GMA HD; Desktop GPUs: GMA 4500 and GMA
    HD |

