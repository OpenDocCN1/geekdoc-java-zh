    \n## 效果\n\nJavaFX 能够渲染出惊艳且复杂的效果。图像和效果可以进行混合、模糊、投影处理。此类效果可以非常有吸引力，并用于创建能够吸引用户的应用程序。\n\
    \n## 第 8 章：应用效果与变换\n\n这些效果可以应用于 JavaFX 中的几乎任何节点。JavaFX 中为你提供的所有标准效果都在 `javafx.scene.effect`\
    \ 包中。如果你还没有这样做，请导入此包以开始使用 JavaFX 效果：\n\n```java\nimport javafx.scene.effect.*;\n\
    ```\n\n提示\n到此为止，你已经显式指定了想要从每个包中导入的项。然而，`*` 符号告诉 JavaFX 导入特定包内的所有项。因此，`import javafx.scene.effect.*`\
    \ 语句将使你能够访问 effect 包中的所有效果。\n\n你将使用的第一个效果是 Bloom（发光）。\n\n## Bloom\n\nBloom 会提取图像中对比度较高的区域，通过覆盖这些高对比度区域并将其溢出到周围图像中，使其看起来像在发光。应用到节点上的\
    \ Bloom 数量由 `threshold`（阈值）参数控制，该参数接受 0 到 1 之间的值，其中 0 表示没有任何效果。\n\n使用 `Chapter8.java`\
    \ 文件中的 `applyEffects()` 方法对 `butterfly.png` 图像应用 Bloom 效果。每个 `ImageView` 节点都有一个\
    \ `effect` 参数。该参数用于设置你想应用到该 `ImageView` 的效果。\n\n提示\n在本章中你操作 `ImageView` 是因为你刚刚在第\
    \ 7 章中处理过它。然而，`ImageView` 并不是你可以应用效果的唯一节点。每个节点都包含一个 `effect` 参数，你可以在上面应用效果。\n\n\
    > 你现在可以编辑 `applyEffects()` 方法来为图像应用 Bloom 效果。向 `applyEffects()` 方法中添加以下行：\n\n\
    ```java\nbloom = new Bloom();\nbloom.setThreshold(.5);\nimageView.setEffect(bloom);\n\
    ```\n\n这会将 `ImageView` 的 `effect` 属性设置为 Bloom 效果。阈值设置为 .5，以便让你直观地了解 Bloom 效果可以做什么。你可以根据喜好调整阈值以达到所需的效果。你的\
    \ `applyEffects()` 方法现在看起来应该是这样的：\n\n```java\nprivate void applyEffects(ImageView\
    \ imageView)\n{\n  Bloom bloom = new Bloom();\nbloom.setThreshold(.5);\nimageView.setEffect(bloom);\n\
    ```\n\n这里显示了完整的应用程序：\n\n```java\npackage Chapter8;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.effect.Bloom;\nimport javafx.scene.image.Image;\n\
    import javafx.scene.image.ImageView;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.scene.stage.Stage;\n```\n\n```java\n/**\n * @author J F DiMarzio\n\
    \ */\npublic class Chapter8 extends Application {\n\n``````java\n/**\n * @param\
    \ args the command line arguments\n */\npublic static void main(String[] args)\
    \ {\n    launch(args);\n}\n\n@Override\npublic void start(Stage primaryStage)\
    \ {\n    Image image = new Image(\"http://jfdimarzio.com/butterfly.png\");\n \
    \   ImageView imageView = new ImageView();\n\n    imageView.setImage(image);\n\
    \    applyEffects(imageView);\n\n    StackPane root = new StackPane();\n    root.getChildren().add(imageView);\n\
    \    primaryStage.setScene(new Scene(root, 800, 600));\n    primaryStage.show();\n\
    }\n\nprivate void applyEffects(ImageView imageView) {\n    Bloom bloom = new Bloom();\n\
    \    bloom.setThreshold(.5);\n    imageView.setEffect(bloom);\n}\n```\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_124_0.png)\n\
    \n图 8-2 应用 Bloom 效果的蝴蝶\n\n编译你的应用并运行它，以产生类似于 8-2 的图像。接下来，你将学习 ColorAdjust。\n\n\
    ## ColorAdjust\n\n顾如名，ColorAdjust 效果允许你调整节点的颜色。就像你调整电视机画面一样，JavaFX 允许你调整图像。ColorAdjust\
    \ 包含了允许你调整对比度、亮度、色调和饱和度的参数。\n\nColorAdjust 效果的所有参数（`input` 除外）都接受 double 值。你可以为对比度、亮度、色调和饱和度分配\
    \ -1.0 到 1.0 之间的值。然而，你不一定需要为所有参数赋值。例如，如果你只想调整图像的对比度，只需为对比度指定一个值，JavaFX 将自动为其他参数赋值。（注意，JavaFX\
    \ 不会自动为对比度分配 0，因为它的默认值为 1。）\n\n## JavaFX 快速上手指南\n\n在之前的章节中，你使用了 `LineBuilder`\
    \ 和 `RectangleBuilder`。在本例中，你可以使用 `ColorAdjustBuilder` 来清理代码并让生活更轻松。\n\n对于此示例，你为每个参数分配\
    \ .5，然后将效果应用到蝴蝶。向 `applyEffects()` 添加以下代码：\n\n```java\nColorAdjust colorAdjust\
    \ = new ColorAdjust();\ncolorAdjust.setBrightness(.5);\ncolorAdjust.setContrast(.5);\n\
    colorAdjust.setHue(.5);\ncolorAdjust.setSaturation(.5);\n```\n\n如果你跟了之前的例子，ColorAdjust\
    \ 效果的结构看起来会很熟悉。整体而言，一旦操作几次，应用效果并不复杂。你完整的 `applyEffects()` 方法应该是这样的：\n\n```java\n\
    private void applyEffects(ImageView imageView)\n{\n    ColorAdjust colorAdjust\
    \ = new ColorAdjustBuilder.create().brightness(.5).contrast(.5)\n    .hue(.5).saturation(.5).build();\n\
    \n    imageView.setEffect(colorAdjust);\n}\n```\n\n## GaussianBlur\n\nGaussianBlur\
    \ 为节点提供了非常平滑的模糊效果。在后台，该效果基于所谓的高斯算法运行。该算法从每个像素按圆形模式运行，以平滑外观。由于该算法以圆形模式运行，你需要处理的参数是\
    \ `radius`（半径）参数，它控制了高斯算法从每个像素向外应用的范围。\n\n"
