    \ args) {\n        launch(args);\n    }\n\n    @Override\n    public void start(Stage\
    \ primaryStage) {\n\n        StackPane root = new StackPane();\n\n        primaryStage.setScene(new\
    \ Scene(root, 300, 250));\n        primaryStage.show();\n    }\n}\n```\n\nIn the\
    \ first section of this chapter, you learn how to add a style sheet to your JavaFX\
    \ package for use in your script.\n\n# Adding a Style Sheet to Your Packages\n\
    \nThe first step is to right-click your package name from the Projects view of\
