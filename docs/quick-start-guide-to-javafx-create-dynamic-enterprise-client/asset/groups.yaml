  - '[PAGE 74]


    # Chapter 5: Creating Shapes


    When you draw a line on a piece of paper, you place your crayon down on one point,
    drag it across to another point, and lift up the crayon. The line you draw is
    as thick as the crayon you used to draw it. The line is also the same color as
    the crayon. This same logic can be applied to drawing a line in JavaFX.


    When you draw a line in JavaFX, you must tell the compiler start and end points
    of your line. The values you need to specify are the starting X and starting Y
    as well as the ending X and ending Y. The compiler will be able to take this information
    and draw a line on the screen between these two points.


    # NOTE


    The start and end points are expressed using the Cartesian coordinate system.


    You must start by specifying an import statement in your code. The import statement
    you need references the code for drawing lines. The package for lines is required
    for the compiler to understand what your code is trying to do as well as to draw
    a line accordingly.


    At the top of your Chapter5.java file, under the existing import statements, include
    the following statement:


    ```

    import javafx.scene.shape.Line;

    ```


    Next, within the start() method, instantiate a new Line node as follows:


    ```

    Line line = new Line();

    ```


    Now you can set the starting and ending x- and y-coordinates. After you instantiate
    the Line node, type in line., as shown here:


    ```

    line.

    ```


    When you do, a context menu should appear. If the context menu does not automatically
    appear, press CTRL-SPACEBAR. This keystroke shortcut will bring up the context
    menu shown in Figure 5-1.


    The context menu is an invaluable tool that shows all the options available from
    a specific place in your script. The context menu can be used to discover elements
    or attributes that you otherwise would not be aware of. The context menu can even
    be used to see some of the values that can be assigned to attributes. You should
    commit the CTRL-SPACEBAR keystroke shortcut to memory because you will find yourself
    using it quite often.'
