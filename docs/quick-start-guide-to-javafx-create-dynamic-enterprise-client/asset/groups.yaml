    # Chapter 7: Using Images ...... 93


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_110_0.png)


    Figure 7-1 Using an image from the Web


    You can include an image in the package with your application. That image can
    then be called from an Image class and displayed using the ImageView. Distributing
    images in this way is more reliable than displaying them from the Internet. That
    is, there are more chances for something to go wrong if you are relying on an
    external website to host your images and you are relying on the Internet connection
    of that user to access the images.


    The first step in displaying a local image is to include that image in your package.
    Right-click your package and select New | Other. This will open the Create File
    dialog box. Select the Other category and then select a File Type of Folder. Click
    the Next button to continue and name your folder. In this case, name the folder
    images and then click Finish. Now you have a folder within your package to keep
    your images.


    > TIP

    It is always recommended to create a separate folder for your images. This helps
    you keep your projects standardized and easy to manage.


    Next, drag an image from your local drive into the images folder in the NetBeans
    IDE, as shown in Figure 7-2.


    Now that the image is added to your project packages, you can reference it in
    your code. The key to referencing an image you have added directly to your package
    is knowing the path to that file.'
