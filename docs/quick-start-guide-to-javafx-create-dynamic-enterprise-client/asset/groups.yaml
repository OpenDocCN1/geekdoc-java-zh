    # 第1章


    ### JavaFX 简介


    ## 核心技能与概念


    - 安装 JavaFX

    - 安装 NetBeans

    - 使用 NetBeans


    欢迎阅读《JavaFX 快速上手指南》。我相信你已经迫不及待开启 JavaFX 开发这一精彩世界的旅程，而这里是完美的开始地点。在开始之前，你需要一个功能完善的开发环境。本章涵盖了创建和建立
    JavaFX 开发环境所需的基础知识，使你能够创建内容丰富的交互式应用程序。它还回答了你可能对 JavaFX 的作用以及它是如何实现的许多问题。


    ## 什么是 JavaFX？


    如果你曾经玩过 Adobe Flash 游戏，或者见过 Microsoft Silverlight 应用程序，你对与 JavaFX 类似的产品已经有很好的认识了。我知道，将
    JavaFX 与这些其他环境比较是不公平的，但如果你以前没见过 JavaFX，我必须找些东西来做比较。现在 JavaFX 已经处于第三次激动心的迭代中，你可能在某个地方遇到过它。


    JavaFX 以类似于 Flash 或 Silverlight 的向用户提供全功能的交互式体验。然而，JavaFX 与其他平台的区别之一是 JavaFX 是平台独立的。由于
    JavaFX 现在已与 Java 运行时完全集成，任何 Java 可以提供 JavaFX 体验的设备或系统都可以支持。


    注意


    在 JavaFX 第 1、2 以及现在的 3 版本之间，平台发生了许多变化。如果你对旧版本的 JavaFX 有一些经验，甚至可能对本书的第一版有了解，你应该密切关注，因为你以前使用的很多内容现在已经大不相同。此外，JavaFX
    的第三个现在正式称为 JavaFX 8，因为现在它是 Java 8 的一部分了。


    ## JavaFX 开发需要什么？


    在投入开发之前，你应该检查本节列出的需求列表。将它们视为获得成功且富有成效的学习过程的先决条件。你至少应该具备以下技能的基础知识，并能够访问列出的软件。


    ## 必要的技能与知识


    跟随本书学习不需要预先的开发经验。即使你只创建过一个应用程序或开发过一个基础网页，你仍然拥有学习 JavaFX 的技能。书中的示例和课程是专门为教你 JavaFX
    开发而设计的。


    尽管如此，你在 Java 开发方面的任何经验都将帮助你更快地掌握 JavaFX 的概念。虽然对运行概念的基本了解并非必不可的，但它将帮助你更快地进入状态：


    - **Java 开发** JavaFX 和 Java 之间共享不仅仅是根名称。如果你曾经写过 Java Applet——更重要的是，曾将 Java Applet
    部署到网页上——你就能轻松理解 JavaFX 的部署过程。之前的 JavaFX 版本使用一种名为 JavaFX Script 的专用语言。为了获得更统一、跨平台的
    Java 体验，这种语言已经发生了更改。JavaFX Script 语言被 Java API 取代，以促进更统一和简化的编程体验。

    - **层级样式表 (CSS)** JavaFX 应用的外观和感觉可以使用层级样式表或 CSS 进行修改。像 HTML 这样的开发平台可以使用 CSS 作为美化外观的一种。

    - **NetBeans** 虽然 JavaFX 可以在任何集成开发环境 (IDE) 甚至是简单的文本编辑器中开发，但本书推荐的开发方法是 NetBeans。如果你以前从未用过
    NetBeans——本书将引导你完成一切。


    这些技能并非必须，缺乏这些领域的知识也不会影响你学习 Java。


    ## 必要的软件


    本节作为你将在书中一直使用的软件的简要介绍。JavaFX 使用了一些不同的软件元素，到本章结束时你将对它们非常熟悉。如果你还没有任何这些软件元素或者没听说过其中一两个，不要担心。在本章结束时，你将下载并安装所有用于辅助
    JavaFX 开发的软件。


    - JavaFX SDK JavaFX SDK（软件开发包）是 JavaFX 开发的主要包。

    - Java SE JDK Java SE JDK（标准版 Java 开发包）用于将你的 JavaFX 代码编译为执行代码。

    - NetBeans NetBeans 是你创建 Java 应用的开发环境。将 NetBeans 视为一个特殊的文本编辑器，可以使用 JavaFX SDK
    和 Java SE JDK 将其编译为应用程序。


    这里列出的软件都是免费的并可以轻松下载。本章的后续将引导你下载并安装所需的软件。


    ## 必要的硬件


    本节概述了运行 JavaFX 的某些硬件需求。请记住，JavaFX 以及一般的 Java 运行在各种硬件和配置上。然而，为了充分利用 JavaFX，有一些硬件建议。


    通常情况下，JavaFX 会运行在任何支持的系统的硬件上。为了享受新硬件加速管道的性能，你需要遵循这些建议。


    | 显卡 | GPU |

    |---|---|

    | NVIDIA | 移动 GPU：GeForce 8M 和 100M 系列或更高、NVS 2100M 系列或更高以及 Mobility Quadro FX
    300M 系列或更高；桌面 GPU：GeForce 8 和 100 系列或更高；工作站 GPU：Quadro FX 300 系列或更高 |

    | ATI | 移动 GPU：Mobility Radeon HD 3000、4000 和 50000；桌面 GPU：Radeon HD 2400、3000、4000、5000
    和 6000 系列 |

    | Intel | 移动 GPU：GMA 4500MHD 和 GMA HD；桌面 GPU：GMA 4500 和 GMA HD |


