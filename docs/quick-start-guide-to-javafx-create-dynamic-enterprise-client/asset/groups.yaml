  - "[PAGE 211]\n\n# Key Skills & Concepts\n\n+   - Adding video to an app\n- Inverse\
    \ binding\n- Using the MediaPlayer\n\nWith the abundance of business and sites\
    \ built around streaming media, it is only natural that JavaFX allow you to take\
    \ full advantage of video and audio media. In the past, programming an application\
    \ to play any kind of media meant hours of writing controls, finding the right\
    \ codes for the files you wanted to play, and writing parsers to read the media\
    \ files. It was long and arduous work that you would really attempt if you were\
    \ completely confident in your abilities as a programmer.\n\nJavaFX has packaged\
    \ a few classes that make working with media files as easy as possible. In this\
    \ chapter you learn about the MediaView MediaPlayer classes. You use these classes\
    \ to write apps that display video, play audio, and allow users of control over\
    \ the media they choose to play.\nIn the first section, you learn how MediaView\
    \ MediaPlayer can be used together to play a video file. However, before you begin,\
    \ you need to create a new, empty JavaFX project named Chapter14. Your code should\
    \ appear as follows:\n\n```\npackage Chapter14;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\
    \n/**\n * @author J F DiMartzio\n */\npublic class Chapter14 extends Application\
    \ {\n  /**\n   * @param args the command line arguments\n   */\n  public static\
    \ void main(String[] args) {\n    launch(args);\n  }\n```"
  - "[PAGE 212]\n\n# Chapter 14: Embedded Media 195\n\n```\n@Override\npublic void\
    \ start(Stage primaryStage) {\n}\n```\n\nYou also need to create a empty JavaFX\
    \ class. This second file will hold a custom node for the playback of media files.\
    \ You will be adding to this second file throughout the chapter. Name the file\
    \ MyMediaViewMyMediaView.class and set it up as follows:\n\n```\npackage Chapter14;\n\
    import javafx.scene.media.MediaView;\n\n/**\n * @author J F DiMarzio\n */\npublic\
    \ class MyMediaViewMyMediaView extends MediaView {\n}\n```\n\nIn the following\
    \ sections you learn how easy it is to add video files and audio files to your\
    \ applications.\n\n# Playing Video\n\nJavaFX uses the MediaView node to display\
    \ video to the screen. However, the MediaView is really just a container for a\
    \ MediaPlayer. The MediaPlayer class is the one that plays the video.\n\nIn this\
    \ section you use a MediaView and a MediaPlayer to play some sample video from\
    \ your application. You will be surprised at how easy JavaFX makes it to play\
    \ video from a script.\n\n> TIP\nThe sample video used in this section can be\
    \ downloaded from http://download.oracle.com/. However, we will be streaming it\
    \ directly from the site.\n\nLet's start by creating a MediaPlayer. After the\
    \ MediaPlayer is created and some parameters are set, you will add it to a MediaView.\n\
    \nTo begin, open your MyMediaView class. The classes needed to work with media\
    \ files are located in the import javafx.scene.media package. JavaFX does a really\
    \ good job"
- md: "\n# Ask the Expert\n\nQ: What kind of files can the MediaPlayer play?\n\nA:\
    \ The quick answer is, if the file is supported by QuickTime on Mac or Windows\
    \ Media Player on Windows, the MediaPlayer node will be able to handle it. Specific\
    \ supported file formats include MP3, MP4, and FLV.\n\nof naming everything logically\
    \ and placing all related classes in common packages. The javafx.scene.media package\
    \ is no exception.\n\nImport the following class to your MediaView file:\n\n```\n\
    import javafx.scene.media.MediaPlayer;\n```\n\nWhy go through the extra step of\
    \ subclassing MediaPlayer? Although it is true you could just add the MediaPlayer\
    \ directly to a MediaView and be done with it, the stock MediaPlayer is very simplistic.\
    \ As you progress through this chapter, you will be adding functionality to MediaView\
    \ that extends the usability of MediaPlayer.\n\nFor now you will set up a stock\
    \ MediaPlayer, just to show how easy it is to load and play a video file:\n\n\
    ```java\nprivate MediaPlayer _player;\n```\n\nThe second thing you will need is\
    \ a Media object. The Media object represents the source of the media to be played\
    \ using the MediaPlayer. For this example, you are going to hard-code a sample\
    \ video file that will be streamed from the Oracle site. This saves you the effort\
    \ of constantly having to assign this property.\n\nTo use the Media class, include\
    \ the following import statement:\n\n```java\nimport javafx.scene.media.Media;\n\
    ```\n\nThen add the code to create the Media class:\n\n```java\nprivate Media\
    \ _media;\n```\n\nNext, create an empty constructor for MediaView:\n\n```java\n\
    package Chapter14;\n\nimport javafx.scene.media.Media;\n\nimport javafx.scene.media.MediaPlayer;\n\
    ```\n\n# Chapter 14: Embedded Media\n\n```java\n/**\n* @author J F DiMarzio\n\
    \ */\npublic class MyMediaView extends javafx.scene.media.MediaView {\n    private\
    \ MediaPlayer _player;\n    private Media _media;\n\n    public MyMediaView()\n\
    \    {\n    }\n}\n```\n\nWithin the constructor, you need to instantiate the Media\
    \ and then instantiate the MediaPlayer with the Media that you want to play:\n\
    \n```java\n_media = new Media(\"http://download.oracle.com/\" + \"otdocs/products/javafx/oow2010-2.flv\"\
    );\n_player = new MediaPlayer(_media);\n```\n\nYou will need to set two properties\
    \ of the MediaPlayer here. The first is the autoPlay property. setting autoPlay\
    \ to true will tell the media file play without the user's intervention. The second\
    \ property is cycleCount, which tells the MediaPlayer how many times to play the\
    \ current Media.\n\n```java\n_player.setAutoPlay(true);\n_player.setCycleCount(MediaPlayer.INEFINITE);\n\
    ```\n\nFinally, set the Media to use the new MediaPlayer, and you are all set\
    \ to play:\nthis.setMediaPlayer(_player);\n\nThe completed MyMediaView class should\
    \ look as follows:\n\n```java\npackage Chapter14;\n\nimport javafx.scene.media.Media;\n\
    import javafx.scene.media.MediaPlayer;\n\n/**\n* @author J F DiMarzio\n */\npublic\
    \ class MyMediaView extends MediaView {\n    private MediaPlayer _player;\n  \
    \  private Media _media;\n```\n\n# Quick Start Guide to JavaFX\n\n```java\npublic\
    \ MyMediaView()\n{\n    media = new Media(\"http://download.oracle.com/otndocs/products/javafx/oow2010-2.flv\"\
    );\n    player = new MediaPlayer(media);\n    player.setAutoPlay(true);\n    player.setCycleCount(MediaPlayer.INDEFINITE);\n\
    \    this.mediaPlayer = player;\n}\n```\n\nNow you can use MyMediaView to stream\
    \ this video in your app. Let's add a MyMediaView to Chapter 14, as follows:\n\
    \n```java\npackage Chapter14;\n\nimport javafx.application.Application;\nimport\
    \ javafx.scene.Group;\nimport javafx.scene.Scene;\nimport javafx.stage.Stage;\n\
    \n/**\n * @author J F DiMarzio\n */\npublic class Chapter14 extends Application\
    \ {\n    /**\n     * @param args the command line arguments\n     */\n    public\
    \ static void main(String[] args) {\n        launch(args);\n    }\n\n    @Override\n\
    \    public void start(Stage primaryStage) {\n\n        MyMediaView mp = new MyMediaView();\n\
    \n        Group root = new Group();\n        root.getChildren().add(mp);\n   \
    \     primaryStage.setScene(new Scene(root, 540, 209));\n        primaryStage.show();\n\
    \    }\n}\n```\n\n# Chapter 14: Embedded Media\n\nThis code is pretty self-explanatory.\
    \ You are creating a MyMediaView (the MediaPlayer you created earlier in the section)\
    \ and placing it in your Scene.\n\nCompile and run this example. You will see\
    \ a sample video begin to play as soon as the application is loaded. The file\
    \ plays automatically because you set the autoPlay property to true.\n\nIf you\
    \ look a little more closely at the video playback, you may notice that it is\
    \ very simplistic: There are no controls for playing and pausing the video. There\
    \ are also no controls to indicate the progress of the video or to allow the user\
    \ to skip through the video in. short, there are no controls whatsoever in the\
    \ playback window.\n\nTo give your users control over the playback of a video,\
    \ you will write the controls yourself. In the remainder of this section, you\
    \ write some controls on your MediaPlayer and present them to the user.\n\n# TIP\n\
    \nBecause you thought ahead and already created a custom MediaPlayer, the process\
    \ for creating your controls will be much easier.\n\nLet's create a quick button\
    \ to control the playback of the video.\n\n# Creating a Play/Pause Button\n\n\
    In this section you create a play/pause button using the RoundButton custom button\
    \ you created earlier in this book. If you do not have all the code for the RoundButton\
    \ readily available, don't worry. The full RoundButton class and RoundButtonAPI\
    \ should look like (this) you can re-create it from here if needed:\n\n```java\n\
    package Chapter14;\n\n/**\n * @author J F DiMarzio\n */\npublic interface RoundButton\
    \ {\n    public static final int PLAY = 1;\n    public static final int PAUSE\
    \ = 2;\n\n    public void setType(int type);\n}\n```\n\n```java\npackage Chapter14;\n\
    \nimport javafx.scene.shape.Circle;\nimport javafx.scene.control.Button;\n```\n\
    \n# 200 Quick Start Guide to JavaFX\n\n```java\n/**\n* @author J F DiMarzio\n\
    */\npublic final class RoundButton extends Button implements RoundButton{\n  \
    \  @Override\n    public void setType(int type) {\n        Circle roundButtonClip\
    \ = new Circle();\n        roundButtonClip.setCenterX(18);\n        roundButtonClip.setY(12);\n\
    \        roundButtonClip.setRadius(8);\n        this.setClip(roundButtonClip);\n\
    \n        if(type == 1) {\n            this.setText(\" >\");\n        }else{\n\
    \            this.setText(\" ||\");\n        }\n    }\n\n    public RoundButton()\
    \ {\n    }\n}\n```\n\nThe cosmetic change has been made to this version of RoundButton.\
    \ The type indicator in this version of RoundButton has been changed from + to\
    \ ||. This indicates whether the button is used for playing the video or pausing\
    \ the video, respectively.\n\nTIP\nIf you need a refresher for how RoundButton\
    \ works, refer to Chapter 11.\n\nNext, let's change one setting in MediaView.\
    \ The autoplay property from true to false, as shown next. This keeps the video\
    \ from playing until you click the play button that will be added.\n\n```java\n\
    package Chapter14;\n\nimport javafx.scene.media.Media;\nimport javafx.scene.media.MediaPlayer;\n\
    ```\n\n# Chapter 14: Embedded Media\n\n```java\n/**\n* @author J F DiMarzio\n\
    \ */\npublic class MyMediaView extends MediaView {\n    private MediaPlayer _player;\n\
    \    private Media _media = new Media(\"http://download.oracle.com/otndocs/products/javafx/oow2010-2.flv\"\
    );\n\n    public MyMediaView(_media) {\n        _player = new MediaPlayer(_media);\n\
    \        _player.setCycleCount(MediaPlayer.INDEFINITE);\n        this.setMediaPlayer(_player);\n\
    \    }\n}\n```\n\nNow that the button is ready, we need a way for it to hook into\
    \ MyMediaView. The play() and pause() methods are contained within the MediaPlayer;\
    \ however, your MyMediaView extends MediaView, which is just a container. So,\
    \ how do you control the playback? Easy. You are going to create a new interface\
    \ that allows yourMediaView to expose the MediaPlayer play() and pause() methods.\n\
    \nYou created an interface in Chapter 11 for RoundButton. Create a new interface\
    \ for this project named MyMediaViewAPI. The interface should have two methods,\
    \ playMedia() and pauseMedia(), as shown here:\n\n```java\npackage Chapter14;\n\
    \n/**\n* @author J F DiMarzio\n */\npublic interface MyMediaViewAPI {\n    public\
    \ void playMedia();\n    public void pauseMedia();\n}\n```\n\nNow, modify the\
    \ MyMediaView class so that it implements the new MyMediaViewAPI. When you do\
    \ so, NetBeans should add overrides for the two methods.\n"
  mdcn: "\n\n# 专家问\n\n问：MediaPlayer 可以播放什么类型的文件？\n\n答：简短的回答是，如果该文件被 Mac 上的 QuickTime\
    \ 或 Windows 上的 Media Player 支持，那么 MediaPlayer 节点就能处理它。具体支持的文件格式包括 MP3、MP4 和 FLV。\n\
    \n要逻辑化地命名所有内容，并将所有相关类放在公共包中。`javafx.scene.media` 包也不例外。\n\n在你的 MediaView 文件中导入以下类：\n\
    \n```\nimport javafx.scene.media.MediaPlayer;\n```\n\n为什么要费力多此一个步骤来对 MediaPlayer\
    \ 进行子类化？虽然你可以直接将 MediaPlayer 添加到 MediaView 中并完成任务，但默认的 MediaPlayer 是非常简单的。随着你对本章内容的学习，你将为\
    \ MediaView 添加功能，以扩展 MediaPlayer 的可用性。\n\n现在，你将设置一个默认的 MediaPlayer，只需展示加载和播放视频文件是多么简单：\n\
    \n```java\nprivate MediaPlayer _player;\n```\n\n你需要的第二个东西是一个 `Media` 对象。`Media`\
    \ 对象代表了使用 MediaPlayer 播放的媒体源。在这个示例中，你将硬编码一个从 Oracle 网站流出的示例视频文件。这节省了你不断分配该属性的精力。\n\
    \n要使用 `Media` 类，请包含以下导入语句：\n\n```java\nimport javafx.scene.media.Media;\n```\n\
    \n然后添加代码来创建 `Media` 类：\n\n```java\nprivate Media _media;\n```\n\n接下来，为 MediaView\
    \ 创建一个空构造函数：\n\n```java\npackage Chapter14;\n\nimport javafx.scene.media.Media;\n\
    \nimport javafx.scene.media.MediaPlayer;\n```\n\n# 第 14 章：嵌入媒体\n\n```java\n/**\n\
    * @author J F DiMarzio\n */\npublic class MyMediaView extends javafx.scene.media.MediaView\
    \ {\n    private MediaPlayer _player;\n    private Media _media;\n\n    public\
    \ MyMediaView()\n    {\n    }\n}\n```\n\n在构造函数内部，你需要实例化 `Media`，然后使用你想播放的 `Media`\
    \ 实例化 `MediaPlayer`：\n\n```java\n_media = new Media(\"http://download.oracle.com/\"\
    \ + \"otdocs/products/javafx/oow2010-2.flv\");\n_player = new MediaPlayer(_media);\n\
    ```\n\n你在这里需要设置 MediaPlayer 的两个属性。第一个是 `autoPlay` 属性。将 `autoPlay` 设置为 `true` 将告诉媒体文件在没有用户干预的情况下播放。第二个属性是\
    \ `cycleCount`，它告诉 MediaPlayer 播放当前 `Media` 的次数。\n\n```java\n_player.setAutoPlay(true);\n\
    _player.setCycleCount(MediaPlayer.INEFINITE);\n```\n\n最后，设置 Media 使用新的 MediaPlayer，这样你就准备好开始播放了：\n\
    this.setMediaPlayer(_player);\n\n已完成的 `MyMediaView` 类如下：\n\n```java\npackage Chapter14;\n\
    \nimport javafx.scene.media.Media;\nimport javafx.scene.media.MediaPlayer;\n\n\
    /**\n* @author J F DiMarzio\n */\npublic class MyMediaView extends MediaView {\n\
    \    private MediaPlayer _player;\n    private Media _media;\n```\n\n# JavaFX\
    \ 快速上手指南\n\n```java\npublic MyMediaView()\n{\n    media = new Media(\"http://download.oracle.com/otndocs/products/javafx/oow2010-2.flv\"\
    );\n    player = new MediaPlayer(media);\n    player.setAutoPlay(true);\n    player.setCycleCount(MediaPlayer.INDEFINITE);\n\
    \    this.mediaPlayer = player;\n}\n```\n\n现在你可以使用 `MyMediaView` 在你的应用中流传输此视频。让我们如下为第\
    \ 14 章添加一个 `MyMediaView`：\n\n```java\npackage Chapter14;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Group;\nimport javafx.scene.Scene;\nimport javafx.stage.Stage;\n\
    \n/**\n * @author J F DiMarzio\n */\npublic class Chapter14 extends Application\
    \ {\n    /**\n     * @param args 命令行参数\n     */\n    public static void main(String[]\
