    # Chapter 3: Hello World 33


    car, surfing the Web, or developing code, you are using and digesting words. Regardless
    of whether the words are spoken or written, the best way to get a point across
    is to use words.


    For this reason, you will learn how to write text to the screen using JavaFX.
    Chances are, no matter type of application or rich environment you want to create
    in JavaFX, you will need to write some form of text to the screen. Writing text
    to the screen is a common, everyday task in development. Therefore, let''s start
    writing text using JavaFX.


    In the last section, you added a TextField and a Label to the Sample.fxml file.
    Now you will use binding to link the two controls together.


    # Using JavaFX Binding


    Binding allows you to link properties and values in such a way that a property
    is dynamically updated when a value changes. Therefore, rather than you having
    to write code that listens for a change in a property, reacts to that change,
    writes the value out to another property, and then redraws the application, you
    only need to bind the property to the value and the rest is taken care of you.


    You are going to bind the text property of the Label on your Sample.fxml file
    to the value of the TextField. By binding these controls, whatever type in the
    TextField will dynamically be displayed in the Label. Let''s take a look at how
    this kind of binding is accomplished. The syntax used in binding is as follows:


    ```

    ${<control.value>}

    ```


    The $ (dollar sign) operator is used in binding for variable resolution. The $
    operator tells JavaFX that anything following it should be considered a variable.
    To resolve a controller property value, you must wrap the controller name and
    the property in the braces:


    ```

    {...}

    ```


    # CAUTION


    There are obviously times when you would want to use $ and not mean it to resolve
    to a variable, such as when you want to write out a dollar amount. In these cases,
    you need to escape the default functionality by placing the escape character (\)
    before the dollar sign ($).


