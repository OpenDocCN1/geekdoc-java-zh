    \        Button btn1 = new Button();\n        Text text2 = new Text();\n     \
    \   Button btn2 = new Button();\n\n        text1.setText(\"Sample Text 1\");\n\
    \        btn1.setText(\"Button 1\");\n        text2.setText(\"Sample Text 2\"\
    );\n        btn2.setText(\"Button 2\");\n\n        VBox root = new VBox();\n \
    \       HBox row1 = new HBox();\n        HBox row2 = new HBox();\n\n        row1.getChildren().add(text1);\n\
