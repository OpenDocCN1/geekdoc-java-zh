    \n        primaryStage.setScene(new Scene (root, 300, 250));\n        primaryStage.show();\n\
    \    }\n}\n```\n\n## 第 5 章：...创建形状\n\n### 尝试：创建多个形状\n\n在进入下一章之前，花些时间练习你新的形状构建技能。虽然这看起来像是一项非常基础的任务，但在整个开发生涯中，你会有很多创建简单形状的需求。从设计新按钮到创建掩罩，你始终需要创建简单形状。\n\
    \n尝试在同一个 `Scene` 中添加多个形状。尝试调整形状的尺寸和位置，防止它们重叠。继续操作它们，以控制形状如何相互接触或覆盖。\n\n这个练习对未来的开发非常有帮助，因为它能让你充分掌握元素是如何放置在\
    \ `Scene` 中的。\n\n在本章中，你学习了如何使用 Java Scene Builder 创建一些基本形状。你创建了线、折线、矩形、圆弧、圆和椭圆。你还学习了一个非常有价值的工具：上下文菜单。这些技能将在本书的剩余部分为你提供极大帮助。\n\
    \n在下一章中，你将学习如何处理和创建比本章涉及更多的颜色。你还将学习如何应用不透明度和旋转等效果。\n\n## 第 5 章自测\n\n- 1. 绘制一条线需要哪四个属性？\n\
    - 2. 如何访问上下文菜单？\n- 3. 处理颜色时需要哪个包？\n- 4. 哪个属性控制用于绘制形状的线条的厚度？\n- 5. 绘制折线需要哪个包？\n\
    - 6. `Polyline` 节点的 `points` 属性分配的是什么类型的值？\n- 7. 正或错？`Rectangle` 节点的 `height`\
    \ 属性是从起始点到矩形顶部的像素数。\n- 8. `Rectangle` 节点的 `fill` 属性的默认值是什么？\n- 9. 正或错？`RadiusX`\
    \ 和 `radiusY` 组成半径扩展到的点。\n- 10. 哪个属性配置圆的半径？\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_94_0.png)\n\
    \n## 第 6 章\n\n### 使用颜色和渐变\n\n## 核心技能与概念\n\n- 创建混合颜色\n- 为形状应用颜色\n- 使用渐变\n\n在本章中，你将更深入地探索\
    \ JavaFX 中提供的强大颜色和渐变工具。在第 5 章中，你学习了如何将一些基础的、预定义的颜色应用到形状上。在本章中，你学习了如何混合自己的颜色，并将这些颜色应用到形状并在渐变中使用它们。\n\
    \n## 使用颜色\n\n`Color` 类是一个非常强大的类。在上一章中，你只使用了 `Color` 类的一小部分来为 `Line` 节点填充了纯色。你只使用了\
    \ `Color` 类 148 种定义颜色中的一或两种。这仅仅是 `Color` 类能力的一个小样本。\n\n该类有四种不同的用法，每种方式都为创建任何情况下所需的颜色提供了可靠的方法。你可以调用\
    \ `Color` 类来使用预定义颜色、RGB 值、HSB 值或 Web 十六进制值。\n\n在本节中，你将学习更多关于提供的预定义颜色以及其他颜色方法。\n\
    \n## 预定义颜色\n\n包含在 `javafx.scene.paint.Color` 包中的 `Color` 类具有许多可以在节点属性上立即使用的预定义颜色。在上一章中，你使用了一个预定义颜色（`Color.TOMATO`）来填充线条。事实上，所有形状都使用\
    \ `Color.BLACK` 预定义颜色作为填充色。`Color` 类提供了以下预定义颜色：\n\n| ALICEBLUE | ANTIQUEWHITE\
