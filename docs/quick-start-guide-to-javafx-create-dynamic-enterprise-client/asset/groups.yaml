    \ the specific type of light.\n\n# Distant\n\nThe Distant class takes three parameters\
    \ that configure and control the light: azimuth, elevation, and color.\n\n```\n\
    Light.Distant distant = new Light.Distant();\ndistant.setAzimuth(45);\ndistant.setElevation(45);\n\
    distant.setColor(Color.RED);\n```\n\nThe azimuth is the angle at which the light\
