    \ of event you can consume is a key event. The following section shows how to\
    \ register listeners for, and use, key events.\n\n# Key Events\n\nA key event,\
    \ as the name suggests, is fired when the user interacts with the keyboard. Capturing\
    \ these keyboard events can be very useful. For example, you could write an application\
    \ that allows the user to move objects around the Scene with the arrow keys or\
    \ to stop some animation using the ESC key. Either way, consuming key events can\
    \ be very useful in your Java apps.\n\nThe key event properties are also inherited\
    \ from Node. Therefore, like the mouse* properties, only nodes and the Scene can\
    \ consume key events. The three KeyEvent* properties"
