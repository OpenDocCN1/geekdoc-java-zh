  - "[PAGE 207]\n\n# Creating Independent Style Classes\n\nOpen the default.css file\
    \ once more. You are going to add a style class to this file that can be applied\
    \ to any node, regardless of its type. That is, whereas you created a style previously\
    \ that would only be applied to all labels, you will now create a style class\
    \ that can be applied to any node you want.\n\nLet's create a class that rotates\
    \ any node by 90 degrees. Add the following class to your default.css file:\n\n\
    ```\n.rotate{\n    fx-rotate:90;\n}\n```\n\nNotice here that the Node property\
    \ for rotating a node is called rotate. Therefore, the style sheet declaration\
    \ for this is -fx-rotate. Your full default.css should now look like this:\n\n\
    ```\n/*\nDocument : default\nCreated on : Oct 13, 2012, 11:48:53 AM\nAuthor :\
    \ J F DiMarzio\nDescription:\n    Purpose of the style sheet follows.\n*/\nroot{\n\
    \    display:block;\n}\n\nlabel{\n    -fx-text-fill: red;\n    -fx-font: bold\
    \ 14pt \"Courier\";\n}\n.rotate{\n    fx-rotate:90;\n}\n```\n\nNow you need to\
    \ modify Chapter13.java to use this new class. The .rotate class you created is\
    \ an independent class that you need to call specifically if you want to use it—unlike\
    \ the .label class, which will inherently be applied to all labels. The StyleClass\
    \ property of a node allows you to specify a class within the current style sheet\
    \ that you want to apply to the node. Modify the Label code in your Chapter13.java\
    \ file to include a call to the getter and setter of the StyleClass property:\n\
    \npackage chapter13;\n\n```\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
    import javafx.scene.control.Label;\n```"
