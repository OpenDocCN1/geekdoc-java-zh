    \ example. Your video will now load, but it will not play until you click the\
    \ > button. Once the video plays, use the ll button.\n\nNow that you have created\
    \ a simple play/pause button, let's make a progress indicator that will allow\
    \ the user to advance and rewind the video.\n\n# Creating a Progress Indicator\n\
    \nTo create a progress indicator, you need to know two key pieces of information.\
    \ First, you need to know the total length of the video you are playing. Second,\
    \ you need to know at what point in time of the playback you are currently. Luckily,\
    \ JavaFX can tell you all of these things. However, it may take some messaging\
    \ of the data to get it into a usable format.\n\nYou need to modify the MyMediaPlayerAPI\
    \ to set the current time and get the total length of the video. You need to modify\
    \ the MyMediaPlayerAPI to set the current time. Add the following to MyMediaPlayer:\n\
    \n```java\npackage Chapter14;\n\n/**\n * @author J F DiMarzio\n */\npublic interface\
    \ MyMediaPlayerAPI {\n    void playMedia();\n    void pauseMedia();\n    void\
    \ setCurrentTime(double time);\n    double getTotalRunTime();\n    double getCurrentTime();\n\
    }\n```\n\nWhen you implement these in MyMediaPlayer, you will need to convert\
    \ the Duration into milliseconds. Add the following to MyMediaPlayer:\n\n```java\n\
    package Chapter14;\n\nimport javafx.scene.media.Media;\nimport javafx.scene.media.MediaPlayer;\n\
    import javafx.util.Duration;\n\n/**\n * @author J F DiMarzio\n */\npublic class\
    \ MyMediaPlayer implements MyMediaPlayerAPI {\n    private MediaPlayer _player;\n\
    \    private Media _media = new\n    Media(\"http://download.oracle.com/otndocs/products/javafx/oow2010-2.flv\"\
    );\n\n    public MyMediaPlayer() {\n        _player = new MediaPlayer(_media);\n\
    \        _player.setAutoPlay(false);\n        _player.setCycleCount(javafx.scene.media.MediaPlayer.INFINITE);\n\
    \    }\n\n    @Override\n    public void playMedia() {\n        _player.play();\n\
    \    }\n\n    @Override\n    public void pauseMedia() {\n        _player.pause();\n\
    \    }\n\n    @Override\n    public void setCurrentTime(double time) {\n     \
    \   Duration seek = new Duration(time);\n        _player.seek(seek);\n    }\n\n\
    \    @Override\n    public double getTotalRunTime() {\n        return _media.getDuration().millis();\n\
    \    }\n\n    @Override\n    public double getCurrentTime() {\n        return\
    \ _player.getCurrentTime().millis();\n    }\n}\n```\n\n# Chapter 14: Embedded\
    \ Media\n\nLet's look at getCurrentTime() first. Within the MediaPlayer is a method,\
    \ getCurrentTime(), that returns a Duration value. In the new getCurrentTime()\
    \ method you just created for MyMediaPlayer, simply return the value of the MediaPlayer's\
    \ currentTime converted to milliseconds:\n\n```java\n@Override\npublic double\
    \ getCurrentTime() {\n    return _player.getCurrentTime().millis();\n}\n```\n\n\
    The toMillis() method of Duration translates the duration into milliseconds. Milliseconds\
    \ are much easier to work with and are more flexible than a Duration object.\n\
    \nNext, you can use the Media file itself to find its total running time. In the\
    \ getTotalTime() method, return the value of getDuration() from the Media file\
    \ converted to milliseconds once again:\n\n```java\n@Override\npublic double getTotalRunTime()\
    \ {\n    return _media.getDuration().millis();\n}\n```\n\nFinally, finish out\
    \ the modification to MyMediaPlayer by adding some code to the setCurrentTime()\
    \ method. The MediaPlayer has a method in it named seek(). This method lets you\
    \ set the time in the video that you want the player to jump. The seek() method\
    \ accepts a Duration, so you will need to convert the double value you send into\
    \ a Duration before you can pass it to seek:\n\n```java\n@Override\npublic void\
    \ setCurrentTime(double time) {\n    Duration seek = new Duration(time);\n   \
    \ _player.seek(seek);\n}\n```\n\nSave your modified MyMediaPlayer and modify Chapter\
