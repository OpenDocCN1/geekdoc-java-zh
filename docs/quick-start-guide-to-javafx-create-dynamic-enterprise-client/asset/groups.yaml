- md: "\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_58_0.png)\n\n# Chapter 4\n\nUsing\
    \ JavaFX Layouts\n\n## Key Skills & Concepts\n\n- Arranging nodes in a Scene\n\
    - Using the HBox\n- Nested layouts\n\nThroughout this book, you have learned how\
    \ to create and use nodes. At its core, JavaFX would not be very interesting without\
    \ the ability to place these nodes on the screen. Nodes need to be placed logically\
    \ on the screen for any user interface (UI) to be intuitive and usable.\n\nTo\
    \ this point in the book, you have manually placed nodes within the context of\
    \ a Scene. Then, using the x and y coordinates of the desired position, you have\
    \ moved the nodes to put them in a logical place. However, manually moving nodes\
    \ around the screen can be a tedious task and ultimately takes away the time needed\
    \ to develop functionality.\n\nJavaFX provides a handful of useful tools to help\
    \ you organize the placement of nodes on the screen. Layouts can automatically\
    \ organize your nodes into predefined patterns that will give your applications\
    \ a professional look and a higher degree of usability.\n\nIn this chapter, you\
    \ will learn how to use layouts to organize the various nodes. The first layout\
    \ you learn about is the HBox.\n\nBefore you begin, create a new, empty JavaFX\
    \ app named Chapter4. The .java file should look like this:\n\n```java\npackage\
    \ Chapter4;\n\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
    \n/**\n *\n * @author J F DiMartio\n */\npublic class Chapter4 extends Application\
    \ {\n/**\n  * @param args the command line arguments\n  */\n```\n\n```java\npublic\
    \ static void main(String[] args) {\n    launch(args);\n}\n\n@Override\npublic\
    \ void start(Stage primaryStage) {\n    primaryStage.show();\n}\n```\n\n## The\
    \ HBox\n\nThe HBox is a horizontal layout you can use to place relatively positioned\
    \ nodes on the screen. That is, the HBox layout organizes your nodes next to each\
    \ other horizontally. To demonstrate this, let's create a Scene with Text and\
    \ Button elements, as follows:\n\n```java\nText text = new Text();\nButton btn\
    \ = new Button();\ntext.setText(\"Sample Text\");\nbtn.setText(\"Button\");\n\
    ```\n\nYour full file should look like this:\n\n```java\npackage Chapter4;\n\n\
    import javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Button;\n\
    import javafx.scene.layout.StackPane;\nimport javafx.scene.text.Text;\nimport\
    \ javafx.scene.stage.Stage;\n\n/**\n * @author J F DiMarzio\n */\npublic class\
    \ Chapter4 extends Application {\n\n/**\n * @param args the command line arguments\n\
    \ */\npublic static void main(String[] args) {\n    launch(args);\n}\n\n@Override\n\
    public void start(Stage primaryStage) {\n```\n\n## Quick Start Guide to JavaFX\n\
    \n```java\nText text = new Text();\nButton btn = new Button();\ntext.setText(\"\
    Sample Text\");\nbtn.setText(\"Button\");\nStackPane root = new StackPane();\n\
    root.getChildren().add(btn);\nroot.getChildren().add(text);\nprimaryStage.setScene(new\
    \ Scene(root, 300, 250));\nprimaryStage.show();\n```\n\nNote that the code is\
    \ using a StackPane as the root in the scene graph. A StackPane arranges its child\
    \ nodes so that they are “stacked” on top of each other visually. This is done\
    \ by changing the z-order of each child so that the nodes that are “lower” on\
    \ the stack have a lower z-order.\n\nCompile and run this app. You can see that\
    \ if you modify the layout of the nodes, they will simply appear jumbled together,\
    \ as shown in Figure 4-1.\n\nThe layout of these nodes is very discordant and\
    \ does not lend itself to a very usable design. Let's use the HBox layout to organize\
    \ these nodes on the screen. The HBox belongs to the javafx.scene.layout package.\
    \ You must import this class before you add the HBox to your Scene:\n\n```java\n\
    import javafx.scene.layout.HBox;\n```\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_61_0.png)\n\
    \nFigure 4-1 Nodes without a layout\n\n## Chapter 4: Using JavaFX Layouts 45\n\
    \nAfter you have imported the correct package, add the HBox to your Scene:\n\n\
    ```java\nHBox root = new HBox();\n```\n\nAdd all the nodes you want the HBox to\
    \ hold, just as you would with the StackPanel. The HBox will place all the nodes\
    \ horizontally within its content.\n\n```java\npublic void start(Stage primaryStage)\
    \ {\n    Text text = new Text();\n    Button btn = new Button();\n    \n    text.setText(\"\
    Sample Text\");\n    btn.setText(\"Button\");\n\n    HBox root = new HBox();\n\
    \    root.getChildren().add(btn);\n    root.getChildren().add(text);\n    primaryStage.setScene(new\
    \ Scene(root, 300, 250));\n    primaryStage.show();\n}\n```\n\nNotice that you\
    \ are still not setting the x- and y-coordinate positions of the Text and Button.\
    \ Under normal circumstances, this would result in the nodes being placed on top\
    \ of each other. However, the HBox takes care of the placement for you and arranges\
    \ the nodes neatly next to each other. The full code for your .java file should\
    \ appear as follows:\n\n```java\npackage Chapter4;\n```\n\n```java\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.control.Button;\nimport javafx.scene.layout.HBox;\n\
    import javafx.scene.text.Text;\nimport javafx.stage.Stage;\n\n/**\n * @author\
    \ J F DiMarzio\n */\npublic class Chapter4 extends Application {\n\n    /**\n\
    \ * @param args the command line arguments\n * */\n    public static void main(String[]\
    \ args) {\n        launch(args);\n    }\n```\n\n```java\n@Override\npublic void\
    \ start(Stage primaryStage) {\n    Text text = new Text();\n    Button btn = new\
    \ Button();\n\n    text.setText(\"Sample Text\");\n    btn.setText(\"Button\"\
    );\n\n    HBox root = new HBox();\n    root.getChildren().add(btn);\n    root.getChildren().add(text);\n\
    \    primaryStage.setScene(new Scene(root, 300, 250));\n    primaryStage.show();\n\
    }\n```\n\nCompile this app and run it. Your nodes will appear as shown in Figure\
    \ 4-2.\nHBox layout is simple to use and does not require any parameters to be\
    \ set to get you great results. It is very easy to line up and organize your nodes\
    \ using this tool.\nKeep in mind that all the layouts in JavaFX, including the\
    \ HBox, inherit from Node. This means that keyboard and mouse events can be consumed\
    \ by layouts. Also, you can apply effects to layouts as well, thus giving you\
    \ a large array of customization options.\nFor more information about using events\
    \ or effects in nodes, refer to the earlier chapters of this book.\n\nIn the next\
    \ section, you use the VBox to organize your nodes vertically rather than horizontally.\n\
    \n![](img/f5bc6249660e63bd0b6a2dc95983edb7_63_0.png)\n\nFigure 4-2 Nodes placed\
    \ using an HBox\n\n## The VBox\n\nThe VBox is a JavaFX layout that organizes your\
    \ nodes vertically rather than horizontally like the HBox does. The VBox can be\
    \ particularly useful in creating forms and other applications where information\
    \ is generally presented in a top-down manner.\n\nImport the javafx.scene.layout\
    \ package to use VBox:\n\n```java\nimport javafx.scene.layout.VBox;\n```\n\nThe\
    \ VBox is easy to implement. Add a VBox control to your Scene, as shown in the\
    \ following code:\n\n```java\nVBox root = new VBox();\n```\n\n```java\npackage\
    \ Chapter4;\n\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
    import javafx.scene.control.Button;\nimport javafx.scene.layout.VBox;\nimport\
    \ javafx.scene.text.Text;\nimport javafx.stage.Stage;\n\n/**\n * @author J F DiMarzio\n\
    \ */\npublic class Chapter4 extends Application {\n\n  /**\n   * @param args the\
    \ command line arguments\n   */\n  public static void main(String[] args) {\n\
    \    launch(args);\n  }\n\n  @Override\n  public void start(Stage primaryStage)\
    \ {\n    Text text = new Text();\n    Button btn = new Button();\n\n    text.setText(\"\
    Sample Text\");\n    btn.setText(\"Button\");\n  }\n```\n\n```java\nVBox root\
    \ = new VBox();\nroot.getChildren().add(btn);\nroot.getChildren().add(text);\n\
    primaryStage.setScene(new Scene(root, 300, 250));\nprimaryStage.show();\n```\n\
    \nCompile and run this app. In the previous section, you used the HBox to organize\
    \ nodes in a horizontal line. Using the VBox in this app, you can see that the\
    \ same two nodes now fall under each other. Figure 4-3 shows this result.\n\n\
    ## Nested Layouts\n\nOne of the most flexible aspects of layouts is that they\
    \ can be nested. That is to say, you can place layouts within each other. You\
    \ can create very useful UIs by combining two or more existing layouts.\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_65_0.png)\n\
    \nFigure 4-3 Organizing nodes using VBox\n"
