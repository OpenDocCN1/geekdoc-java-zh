    \ that all the code under this line belongs to the javafxforbeginners package.\
    \ The package declaration must be at the top of the java file.\n\nThis line of\
    \ code has three components you should be aware of. The first word of the line,\
    \ \"package,\" is a Java keyword. Keywords are special commands that have a predefined\
    \ meaning to the Java compiler. They are also known as \"reserved.\" As such,\
    \ they cannot be used elsewhere in your code as variable names or anything other\
    \ than their predefined purpose. The keyword package tells the compiler that anything\
    \ following the keyword is the name of the package.\n\nThe name of your package\
    \ follows the package keyword (in this case, javafxforbeginners). Because the\
    \ purpose of the keyword is to tell the compiler that everything after it is the\
    \ name of the package, the compiler needs to know where the end of the filename\
    \ should be. Otherwise, by definition, the compiler would think all the code in\
    \ the file was the package name. Therefore, Java has a special character set aside\
    \ as a statement terminator: the semicolon (;). The statement terminator tells\
    \ the compiler when it has reached the end of a specific line of code. Although\
    \ there are very specific exceptions to this rule, you will need to use code statements\
    \ with a semicolon to let the compiler know you have finished. If you do not use\
    \ a semicolon it is expected where one is, the compiler will give you an error\
    \ when you attempt to compile.\n\n## TIP\n\nCompilation is the process where your\
    \ code is converted from human-readable text to a class file containing bytecodes\
    \ that can be executed by the Java Virtual Machine.\n\nIn the final sections of\
    \ this chapter, you will examine the functional code that is in the JavaFXForBeginners.java\
    \ file.\n\n## Your First Stage\n\nAll JavaFX applications are built on a Stage.\
    \ The naming of this container, as the Stage, is very appropriate. Think of the\
    \ Stage as the foundation for the rest of your application's objects. Just as\
    \ with a dramatic production, the action happens on a stage—and JavaFX is no exception.\
    \ All of your action is going to take place on a Stage.\n\n## The Application\
    \ Entry Point\n\nAfter the package statement is a set of import statements. These\
    \ import statements are used to help the compiler resolve references to methods\
    \ without the need for fully qualified paths. That is, without using import statements,\
    \ you would have to type out the entire path to an external method. This could\
    \ make your code rather verbose and possibly unruly.\n\n```\nimport javafx.application.Application;\n\
    import javafx.fxml.FXMLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
    import javafx.scene.Stage;\n```\n\nAfter the import statements, you will see the\
    \ code of the file. The code begins with a class declaration for the JavaFXBeginners\
    \ class.\n\n```\npublic class JavaFXBeginners extends Application {\n    public\
    \ static void main(String[] args) {\n        Application.launch(JavaFXBeginners.class,\
    \ args);\n    }\n\n    @Override\n    public void start(Stage stage) throws Exception\
    \ {\n        Parent root = FXMLoader.load(getClass().getResource(\"Sample.fxml\"\
    ));\n\n        stage.setScene(new Scene(root));\n        stage.show();\n    }\n\
    }\n```\n\nThe JavaFXBeginners class extends Application. This means that the JavaFXBeginners\
    \ class inherits all of the public, protected, and package scoped variables and\
    \ methods of the Application class. This is important to know because it is required\
    \ for your main application class to extend Application for it to run correctly.\n\
    \nWithin the JavaFXBeginners class you will see two methods: the main method and\
    \ the start() method. The main() method is executed when your application starts\
    \ up. Within the main() method is one method call to launch(). One interesting\
    \ fact here is\n\n## Chapter 2: Setting the Scene\n\nthat in the latest version\
    \ of Java FX, main() is no longer required. It is included only for backwards\
    \ compatibility. The main() method is the entry point of the application, or the\
    \ point which the Java Virtual Machine will begin execution. In this case, the\
    \ JavaFXBeginners class is being passed as the start of the JavaFX application.\
    \ Why not just start the JavaFX application automatically? The functionality being\
    \ separated allows you to run other Java methods or to trigger other JavaFX applications\
    \ from the same main().\n\nThe launch() method will now look at the JavaFXForBeginners\
    \ class, ensure that it extends Application, and then attempt to call the start()\
    \ method which JavaFXForBeginners inherits from Application. Your JavaFX application\
    \ must override the start() method to execute any code you want to run.\n\nIn\
    \ the sample code provided by NetBeans, you can see that the start() method a\
    \ file named Sample.fxml is loaded, the Scene is set on the Stage, and the Stage\
    \ is to show the world. This is all the code that is needed in your class to start\
    \ a basic JavaFX application.\n\nLet's take a look at what is in the Sample.fxml\
    \ file to see what this file's role is in the application.\n\n## The Sample.fxml\
    \ File\n\nThe Sample.fxml, created by NetBeans during the JavaFX FXML Application,\
    \ contains the following:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n\n<?import java.lang.*?>\n<?import javafx.scene.*?>\n<?import javafx.scene.control.*?>\n\
    <?import javafx.scene.layout.*?>\n\n<AnchorPane height=\"200\" width=\"320\" fx:controller=\"\
    javafxforbeginners.Sample\" xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n\
    \    <Button fx:id=\"button\" onAction=\"#handleButtonAction\" layoutX=\"126\"\
    \ layoutY=\"90\" text=\"Click Me!\" />\n    <Label fx:id=\"label\" layoutX=\"\
    120\" layoutY=\"20\" text=\"Hello, World!\" />\n  </children>\n</AnchorPane>\n\
    ```\n\nFXML is a user interface (UI) markup language based on XML. FXML is a great\
    \ language for creating easy, quick, and flexible UIs for JavaFX. If you have\
    \ experience with XML or any markup language, then FXML will look very familiar\
    \ and will be very easy to pick up.\n\n## Quick Start Guide to JavaFX\n\nThere\
    \ are two important things to note in this file. The first is the controller assignment:\n\
    \n```\nfx:controller=\"javafxforbeginners.Sample\"\n```\n\nThis line tells JavaFX\
    \ a class named Sample is part of the javafxforbeginners package, which contains\
    \ all of the code for the elements in the FXML. Take a quick look at the Projects\
    \ explorer and you will see that, indeed, you have a file named Sample.java. This\
    \ file contains the Sample class.\n\nThe second thing to notice about this file\
    \ is the elements that have been placed on the UI. The Sample.fxml file contains\
    \ two interactive elements: a button and a label. The button contains a handler\
    \ that, in turn, calls the Sample class. Let's take a look now at the code in\
    \ the Sample class—in the Sample.java file—and see what the handle for this button\
    \ does.\n\nSample.java file contains the code that is referenced by the elements\
    \ in the Sample.fxml file. If you have done any web development before, or are\
    \ familiar with other web development languages, you can think of Sample.java\
    \ as the “code-behind file” for Sample.fxml.\n\nOpen Sample.java in NetBeans.\
    \ The file contains a class named Sample. The Sample class has the following code:\n\
    \n```\npublic class Sample implements Initializable {\n\n@FXML\n    private Label\
    \ label;\n\n@FXML\n    private void handleButtonAction(ActionEvent event) {\n\
    \        System.out.println(\"You clicked me!\");\n        label.setText(\"Hello\
    \ World!\");\n    }\n\n@Override\n    public void initialize(URL url, ResourceBundle\
    \ rb) {\n        // TODO\n    }\n}\n```\n\nWithout knowing JavaFX, you should\
    \ be able to see that when the button in Sample.fxml is clicked, the application\
    \ is told to print the words “You clicked me!” and then the text of the label\
    \ is set to “Hello World!” Because you will learn how the code works throughout\
    \ this book, we are not going to dive into that topic here. Rather, let’s compile\
    \ this application and see it in action.\n"
  mdcn: "\n\n## 第2 章：搭建场景\n\n用于创建单行注释。请注意，单行注释以 `//` 开头而不是 `/*`。此外，由于它们只占一行，因此不需要关闭。因此，该行上的任何内容都将被视为注释。\n\
    \n在下一节中，你将学习包（package）语句。\n\n## package 语句\n\n在起始注释之后是下面这一行：\n\n```\npackage javafxforbeginners;\n\
    ```\n\n这一行虽然对你的代码有直接影响，但它可以教你一些关于 Java 编程的关键点。这行的行的核心目的是告诉编译器，此行下的所有代码都属于 `javafxforbeginners`\
    \ 包。包声明必须位于 Java 文件的顶部。\n\n这行代码有三个你应该注意的组成部分。行的第一个单词 `package` 是 Java 关键字。关键字是对于\
    \ Java 编译器具有预定义含义的特殊命令。它们也被称为“保留字”。因此，你不能在代码的其他地方将它们用作变量名或其他预定义用途之外的任何东西。`package`\
    \ 关键字告诉编译器，关键字后的任何内容都是包名。\n\n你的包名紧随 `package` 关键字之后（在本例中为 `javafxforbeginners`）。因为关键字的目的是告诉编译器其后的所有内容都是包名，所以编译器需要知道文件名何时该结束。否则，根据定义，编译器会认为文件中的所有代码都是包名。因此，Java\
    \ 专门留了一个特殊字符作为语句终止符：分号（`;`）。语句终止符告诉编译器它何时到达了特定行代码的末尾。尽管该规则有非常具体的例外，但你仍然需要使用带有分号的代码语句来让编译器知道你已完成。如果你在应该使用分号的地方没有使用，这是在预料之中的，当你尝试编译时，编译器会给出一个错误。\n\
    \n## 提示\n\n编译是将你的代码从人类可读的文本转换为包含字节码的类文件的过程，这些字节码可以由 Java 虚拟机执行。\n\n在本章的最后部分，你将检查\
    \ `JavaFXForBeginners.java` 文件中的功能代码。\n\n## 你的第一个舞台\n\n所有的 JavaFX 应用程序都构建在 Stage（舞台）上。将这个容器命名为\
    \ `Stage` 非常合适。将 `Stage` 视为你应用程序中其他对象的字体。就像戏剧表演一样，动作发生在舞台上——JavaFX 也不例外。你所有的动作都将在\
    \ `Stage` 上发生。\n\n## 应用程序入口点\n\n包语句之后是一组导入（import）语句。这些导入语句用于帮助编译器解析对方法的引用，而无需完全限定路径。也就是说，如果不使用\
    \ `import` 语句，你必须写出外部方法的完整路径。这可能让你的代码非常冗长并且可能难以管理。\n\n```\nimport javafx.application.Application;\n\
    import javafx.fxml.FXMLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
    import javafx.scene.Stage;\n```\n\n在导入语句之后，你将看到文件的代码。代码以 `JavaFXBeginners` 类的类声明开始。\n\
    \n```\npublic class JavaFXBeginners extends Application {\n    public static void\
    \ main(String[] args) {\n        Application.launch(JavaFXBeginners.class, args);\n\
    \    }\n\n    @Override\n    public void start(Stage stage) throws Exception {\n\
    \        Parent root = FXMLoader.load(getClass().getResource(\"Sample.fxml\"));\n\
    \n        stage.setScene(new Scene(root));\n        stage.show();\n    }\n}\n\
    ```\n\n`JavaFXBeginners` 类继承自 `Application`。这意味着 `JavaFXBeginners` 类继承了 `Application`\
    \ 类所有的公共、受保护和包作用范围的变量和方法。了解这一点很重要，因为你的主应用程序类必须继承 `Application` 才能正确运行。\n\n在 `JavaFXBeginners`\
    \ 类中，你将看到两个方法：`main` 方法和 `start()` 方法。`main()` 方法在你的应用程序启动时执行。在 `main()` 方法内部有一个对\
    \ `launch()` 的调用。这里有一个有趣的实是\n\n## 第2 章：搭建场景\n\n在最新版本的 Java FX 中，`main()` 不再是必须的。包含它只是为了向后兼容。`main()`\
    \ 方法是应用程序的入口点，或者说是 Java 虚拟机开始执行的点。在这种情况下，`JavaFXBeginners` 类被传递为 JavaFX 应用程序的起点。为什么不自动启动\
    \ JavaFX 应用程序呢？这种分离允许你从同一个 `main()` 运行其他 Java 方法或触发其他 JavaFX 应用程序。\n\n`launch()`\
    \ 方法现在会查看 `JavaFXForBeginners` 类，确保它继承 `Application`，然后尝试调用 `JavaFXForBeginners`\
    \ 从 `Application` 继承的 `start()` 方法。你的 JavaFX 应用程序必须重写 `start()` 方法来执行任何你想运行的代码。\n\
    \n在 NetBeans 提供的示例代码中，你可以看到 `start()` 方法加载了一个名为 `Sample.fxml` 的文件，将 `Scene` 设置在\
    \ `Stage` 上，并将 `Stage` 显示给世界。这就是你的类中启动一个基础 JavaFX 应用程序所需的所有代码。\n\n让我们看看 `Sample.fxml`\
    \ 文件中包含什么，看看这个文件在应用程序中的作用。\n\n## Sample.fxml 文件\n\n由 NetBeans 在创建 JavaFX FXML\
    \ 应用程序期间创建 `Sample.fxml` 包含以下内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n\n<?import java.lang.*?>\n<?import javafx.scene.*?>\n<?import javafx.scene.layout?>\n\
    \n<AnchorPane height=\"200\" width=\"320\" fx:controller=\"javafxforbeginners.Sample\"\
    \ xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n    <Button fx:id=\"button\"\
    \ onAction=\"#handleButtonAction\" layoutX=\"126\" layoutY=\"90\" text=\"Click\
    \ Me!\" />\n    <Label fx:id=\"label\" layoutX=\"120\" layoutY=\"20\" text=\"\
    Hello, World!\" />\n  </children>\n</AnchorPane>\n```\n\nFXML 是一种基于 XML 的用户界面（UI）标记语言。FXML\
    \ 是创建简单、快速且灵活的 JavaFX UI 的语言。如果你有 XML 或任何标记语言的经验，FXML 看起来会非常熟悉并且容易上手。\n\n## JavaFX\
    \ 快速入门\n\n在该文件中有两个需要注意的地方。第一个是控制器赋值：\n\n```\nfx:controller=\"javafxforbeginners.Sample\"\
    \n```\n\n这一行告诉 JavaFX 一个名为 `Sample` 的类是 `javafxforbeginners` 包的一部分，该包包含了 FXML\
    \ 中所有元素代码。快速查看项目管理器，你会发现你确实有一个名为 `Sample.java` 的文件。\n\n"
