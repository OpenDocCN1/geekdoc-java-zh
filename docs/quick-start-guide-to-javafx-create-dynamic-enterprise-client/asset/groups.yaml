    You should accept all of the remaining default values in this wizard. NetBeans
    will automatically select the default version of JavaFX and the options needed
    to create your main project settings.


    Feel free to accept all of the defaults in this step. Your Name and Location step
    appear as shown in Figure 2-3.


    Click the Finish button to create your empty project. In the following section,
    you will add a package and files to your project.


    # ## (Not-so) Empty JavaFX Project


    Once your new project is created, the New Project Wizard will return you to the
    NetBeans IDE, as on the left side of the screen are the Projects explorer frame.
    Your JavaForBeginners project will be displayed in this frame.


    Click the plus sign next to the JavaForBeginners folder. This will expose the
    Source Packages folder. The Source Packages folder will contain the packages for
    your project.


    A Java package is a full collection of classes (or in this case, JavaFX source
    files) that are all related. All the files in a package will be compiled together
    into a JAR (Java Archive) file and can be referenced in other projects. If you
    have worked with another platform such as Silverlight or .NET, you can think of
    a Java package as equivalent to a namespace.'
- md: '

    # Figure 2-4 The NetBeans IDE with a new project


    For example, if you were building a set of Java classes that calculate the area
    of a shape, you could build them into a specific "area calculator" package. This
    namespace, and all the classes in it, could then be compiled into a JAR file.
    You could then use that JAR file in any project where you want to be able to calculate
    area simply by including the JAR file and referencing the namespace.


    Packages have a naming convention you will need to adhere to in JavaFX. A package
    is named using a hierarchical domain structure that represents you as a developer.
    Much like a website URL in reverse, the namespace name should begin with the top-level
    domain followed by the related domain names. For this project we will use the
    following:


    javafxforbeginners


    # TIP


    By convention, all Java namespace and project names should be lowercase. For more
    information about Java naming conventions, visit http://java.sun.com/docs/codeconv/html/CodeConventions.doc.


    If you examine the Source Packages folder of the JavaFXForBeginners project, you
    will see that you have a package for your source files called javafxforbeginners.
    NetBeans created this package during the project creation process, and three sample
    files were placed into the package. These files can be seen by expanding the view
    of the package in the Projects explorer. Let''s examine the sample files that
    NetBeans has placed into your JavaFX package.


    # Examining the Project Files


    Having looked at your newly created project and package (and the three files that
    are in your project), you may be wondering where you begin typing your code. For
    example, if you were writing a document or memo, you would likely type that into
    a text document file (.txt or .docx). If you were creating a spreadsheet in Microsoft
    Office, you would type that into an Excel file (.xlsx). To create a JavaFX FXML
    application, you need to add your code into either a JavaFX file (.java) or an
    FXML markup file (.fxml).


    # NOTE


    In earlier versions of JavaFX, you would have written JavaFX Script into .fx files.
    JavaFX now has its own Java SDK, and the code is written in Java .java files.
    Therefore, throughout this book, when your code files are referred to as Java
    files and not JavaFX files, this is not a mistake; you are truly programming your
    JavaFX in Java.


    Take a look at the javafxbeginners package; you will be able to quickly determine
    that NetBeans has supplied you with two .java files and an .fxml file. Double-click
    on the JavaForBeginners.java file to open it in the NetBeans editor. The file
    should appear similar to what''s shown in Figure 2-5.


    # NOTE


    Your screen may differ slightly from that in Figure 2-5.


    Your Java file will be open in the main panel of the NetBeans IDE. In the following
    sections, you will take a quick tour of the code inside this file, the NetBeans
    IDE, and you will compile your first JavaFX FXML application.


    # Exploring the Project in NetBeans


    You should now have a shell of the JavaFX FXML project open in your NetBeans IDE,
    with a handful of sample files generated for you. Your NetBeans JavaFX FXML project
    should look like Figure 2-5. You might think that an empty project would not be
    that interesting, and for the most part you are right. However, there are some
    features and areas of the IDE that you should become familiar with before you
    begin coding.


    # Chapter 2: Setting the Scene


    15


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_32_0.png)


    Figure 2-5 The JavaFXForBeginners.java file


    For much of your development work in JavaFX, you will be focusing on two areas
    of the NetBeans IDE. The left side of NetBeans IDE shows a trio of tabs, labeled
    Projects, Files, and Services. This set of explorers, shown in Figure 2-6, will
    be your main mechanism for navigating your projects.


    It is not uncommon for projects to start off very small and end up using many
    files—from code to images and configurations. The explorers help keep track of
    these files.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_32_1.png)


    Figure 2-6 The Projects, Files, and Services explorers


    # Quick Start Guide to JavaFX

