    \ of public dictates that the method can be executed from outside of the class\
    \ it is defined in, whereas a modifier of private restricts execution of the method\
    \ to code within the same class. You will only be dealing with these two modifiers\
    \ in this book, to make life a little easier.\n\nThe return type is the data type\
    \ of the value that is returned when the method finishes executing. As stated\
    \ earlier, this can be any valid data type, such as a String, or int. However,\
    \ what would you do if your method does not return a value? In some cases, you\
    \ may want your method to perform a calculation and return to you the result of\
    \ that calculation. In other cases, you can create a method that manipulates some\
    \ code and does not really need to return anything. In this scenario, you use\
    \ the return type void to tell Java that your method does not return a value.\n\
    \nThe method name is the name used to call your method from other areas of the\
    \ code. The method name can be anything, but try to keep it within some standard\
    \ guidelines. By coding standards, the name of a method should be a verb or action\
    \ word, such as \"get,\" \"run,\" \"lock,\" or even \"delete.\" If your method\
    \ name contains more than one word, the first word should be lowercase and the\
    \ first letter of the following words should be uppercased, as in getMyValue.\n\
    \n# CAUTION\n\nThe return type, method name, and parameters together form the\
    \ method's signature. This is important to know because you cannot have two methods\
    \ (visible to each other) with the same signature.\n\nAfter the name of the method\
    \ is a pair of parentheses, which can either be empty, meaning that no parameters\
    \ are needed to run the method, or can encompass a set of parameters. If parameters\
    \ are defined, the values for these parameters must be provided when the method\
    \ is called.\n\nFinally, after the parameters is the body of the method. The body\
    \ is the code that does all of the work in the method.\n\nA simple method declaration\
    \ would appear as follows:\n\n```\npublic String getMessage()\n{\n    String message\
    \ = \"FOO\";\n    return message\n}\n```\n\nIn the next section, you learn about\
    \ properties and then combine a property with a method to create a new binding."
