    \ between this code and what you have used in the previous chapters is the inclusion\
    \ of a method called applyEffects(), which is where you put all the code for your\
    \ effects. This method will apply a specific effect to your ImageView using code\
    \ you will add soon.\n\n```java\nprivate void applyEffects(ImageView imageView)\
    \ {\n}\n```\n\nThis method takes your ImageView as a parameter. You will be writing\
