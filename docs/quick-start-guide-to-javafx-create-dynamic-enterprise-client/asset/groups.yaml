    # # Lighting


    The Lighting effect is by far the most complex effect offered in JavaFX. Lighting
    can be used to add a dimension of realism to an otherwise flat object. Although
    Lighting is a complex effect to set up, it is very rewarding if used correctly.


    The main parameter of the Lighting effect is Light, which represents the type
    of light from the javafx.scene.effect.light package. Three different classes can
    be used for Light:


    +   - Distant

    - Point

    - Spot'
