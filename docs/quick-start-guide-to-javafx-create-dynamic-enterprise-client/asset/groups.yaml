    A predefined color is accessed as a constant of the Color class. For example,
    in the Color class, the constant BLUE is associated with the values needed to
    create the blue color. Let''s take a look at the following line of code (which
    is associated with a shape):


    ```

    ellipse.setFill(Color.BLUE);

    ```


    When you assign the fill attribute a value of Color.BLUE, the Color class passes
    along the values needed to create a blue color. offers a vast array of predefined
    colors to use in your scripts. But what if one of the predefined colors does not
    quite fit what you need? Fear not—the Color class has an even more powerful set
    of methods for rendering almost any color you could possibly need.

    Next, you learn about the methods available in the Color class for creating colors
    that are not predefined.


    # Mixing Colors


    If you have looked at the predefined colors but cannot find the exact one you
    need, you can always mix or specify your own color. The Color class would be a
    very limited tool if you could only use predefined colors without the ability
    to customize them.

    For this reason, the Color class has three useful methods for mixing your own
    colors:


    ```

    Color.rgb();

    Color.hsb();

    Color.web();

    ```


    Let''s look at each of these methods and how to use them.'
- md: "\n## Color.rgb\n\nThe Color class allows you to use the RGB (Red, Green, Blue)\
    \ value of the color you want to create. Most colors are mixed as a composite\
    \ of differing amounts of red, green, and blue. The amounts of red, green, and\
    \ blue used to create a color are defined using a value from 0 to 255 (0 being\
    \ none of that color, 255 being a full amount of the specified color). The following\
    \ code will fill the interior of a rectangle with purple:\n\n```\nRectangle rectangle\
    \ = new Rectangle();\nrectangle.setX(10);\nrectangle.setY(10);\nrectangle.setHeight(150);\n\
    rectangle.setWidth(150);\nrectangle.setFill(Color.rgb(255, 0, 255));\n```\n\n\
    In this method call to the Color class, you specify an RGB value of 255 red, 0\
    \ green, and 255 blue. This produces a purple color. However, try the following\
    \ code and see what you get:\n\n```\nRectangle rectangle = new Rectangle();\n\
    Color purple = new Color(1,0,1,1);\nrectangle.setX(10);\nrectangle.setY(10);\n\
    rectangle.setHeight(150);\nrectangle.setWidth(150);\nrectangle.setFill(purple);\n\
    ```\n\nThis code also produces a rectangle that is filled with purple. The default\
    \ constructor for the Color class also accepts RGB values to create a color. So\
    \ what is the difference? The end result is the same either: You are left with\
    \ purple as the color. The difference is that the default constructor for the\
    \ Color class accepts values for red, green, and blue as a float from 0 to 1.\
    \ Keep in mind that the rgb method of the Color class accepts values from 0 to\
    \ 255. The final value is Alpha, which should be 1 to fully opaque.\n\n## Color.hsb\n\
    \nThe Color class also has a method for HSB (Hue, Saturation, Brightness) colors.\
    \ In the HSB color model, the color or hue is represented by a number from 0 to\
    \ 360. This number corresponds to one of the 360 degrees of a color wheel.\n\n\
    The saturation and brightness attributes are represented by a number from 0 to\
    \ 1. A value of 0 is no saturation and no brightness, whereas a value of 1 is\
    \ full saturation and full brightness. To create the same purple color you just\
    \ created with the rgb method, use the following code:\n\n```\nrectangle = new\
    \ Rectangle();\n```\n\n```\nrectangle.setX(10);\nrectangle.setY(10);\nrectangle.setHeight(150);\n\
    rectangle.setWidth(150);\nrectangle.setFill(Color.hsb(300,1,1));\n```\n\n## Color.web\n\
    \nFinally, the Color class can also use a web hex value to create a color for\
    \ You. the web method of the Color class accepts a standard hex value. Here's\
    \ an example:\n\n```\nRectangle rectangle = new Rectangle();\n```\n\n```\nrectangle.setX(10);\n\
    rectangle.setY(10);\nrectangle.setHeight(150);\nrectangle.setWidth(150);\nrectangle.setFill(Color.web(\"\
    #FF0FF\"));\n```\n\n## The alpha Attribute\n\nOne last attribute of the Color\
    \ class you should take note of is the alpha attribute. Every method of the Color\
    \ class has an optional alpha attribute. The alpha value controls the opacity\
    \ of the color being created. The alpha value is a value between 0 and 1, where\
    \ 0 is transparent and 1 is opaque. The alpha value can be added to any of the\
    \ methods of the Color class. By setting the alpha value to 0, you will achieve\
    \ full transparency:\n\n```\nRectangle rectangle = new Rectangle();\n```\n\n```\n\
    rectangle.setX(10);\nrectangle.setY(10);\nrectangle.setHeight(150);\nrectangle.setWidth(150);\n\
    rectangle.setFill(Color.web(\"#FF0FF\",0));\n```\n\nIn contrast to the full transparency\
    \ of 0, you can set the alpha value to 1 for a fully opaque color:\n\n```\nRectangle\
    \ rectangle = new Rectangle();\n```\n\n```\nrectangle.setX(10);\nrectangle.setY(10);\n\
    ```\n\n## Chapter 6: Using Colors and Gradients\n\n```\nrectangle.setHeight(150);\n\
    rectangle.setWidth(150);\nrectangle.setFill(Color.web(\"#FF00FF\",1));\n```\n\n\
    Finally, setting the alpha value to .5 will give you opacity of 50 percent:\n\n\
    ```\nRectangle rectangle = new Rectangle();\nrectangle.setX(10);\nrectangle.setY(10);\n\
    rectangle.setHeight(150);\nrectangle.setWidth(150);\nrectangle.setFill(Color.web(\"\
    #FF00FF\",0.5));\n}\n```\n\nIn the next section, you will learn how to create\
    \ and use gradients. Gradients provide a creative and eye-catching way to fill\
    \ your shapes.\n\n## Using Gradients\n\nYou can use two kinds of gradients to\
    \ fill your shapes: LinearGradients and RadialGradients. LinearGradients are gradients\
    \ that fill in a straight line from one side of a shape to the opposite side.\
    \ RadialGradients start the gradient at one point, and the gradient radiates out\
    \ from that point to fill the shape.\n\nLet's first look at how to apply a LinearGradient\
    \ to a rectangle.\n\n## LinearGradients\n\nThe LinearGradient class is contained\
    \ in the javafx.scene.paint package:\n\n```\nimport javafx.scene.paint.LinearGradient;\n\
    ```\n\nYou need to learn about seven parameters for the LinearGradient constructor\
    \ before properly fill a shape with a gradient. The first four parameters are\
    \ startX, startY, endX, and endY. On the x-axis, 0 is the left side of your shape\
    \ and 1 is the right side. On the y-axis, 0 is the top of your shape and 1 is\
    \ the bottom. Otherwise, the values for the x and y coordinates in the local coordinate\
    \ system will be stretching. To keep things easy, set proportional to true.\n\n\
    Speaking of which, the fifth parameter is proportional, which accepts a Boolean\
    \ value and determines how the first four parameters are treated. The sixth parameter\
    \ is CycleMethod, which dictates how the gradient is filled and repeated. If this\
    \ value is set to NO_CYCLE, the gradient is filled using the selected colors.\
    \ If CycleMethod is set to REFLECT, a mirror effect is used when filling the gradient\
    \ from one color to back again. Finally, if CycleMethod is set to REPEAT, the\
    \ gradient repeats itself. The final parameter is stops, which holds an array\
    \ of colors that will be used in the gradient. This is a very versatile aspect\
    \ of JavaFX: Gradients can be made with two or more colors. Each color you add\
    \ to the gradient is composed of a Color class and an offset attribute. The offset\
    \ is a number between 0 and 1 that determines where the gradient is placed. If\
    \ your head is just spinning right now, don't feel bad. LinearGradients will make\
    \ much more sense when you see the code in action. Take a look at the following\
    \ code.\n\nNOTE\nAdd the following import statement to javafx.scene.paint:\n\n\
    ```\nRectangle rectangle = new Rectangle();\nStop[] gradientStops = Stop[] {\n\
    \    Stop(0, Color.BLACK),\n    Stop(1, Color.WHITE)\n};\nLinearGradient lg =\
    \ new LinearGradient(0,0,1,true,CycleMethod.NO_CYCLE,gradientStops);\n```\n\n\
    ```\nrectangle.setX(10);\nrectangle.setY(10);\nrectangle.setHeight(150);\nrectangle.setWidth(150);\n\
    rectangle.setFill(lg);\n```\n\nThe preceding code creates the LinearGradient shown\
    \ in Figure 6-1. This is a fairly standard two-color gradient.\n\nNOTE\nIf you\
    \ want the gradient to flow vertically rather than horizontally, flip the third\
    \ and fourth parameters of LinearGradient. The stops attribute accepts an array\
    \ of colors. This means you can add as many colors as you want to the gradient.\
    \ The following code creates the three-color LinearGradient shown in Figure 6-2:\n\
    \n![](img/f5bc6249660e63bd0b6a2dc95983edb7_102_0.png)\n**Figure 6-1** A proportional\
    \ true two-color LinearGradient\n\n```\nRectangle rectangle = new Rectangle();\n\
    Stop[] gradientStops = new Stop[] {\n    Stop(0, Color.BLACK),\n    Stop(0.5,\
    \ Color.WHITE),\n    Stop(1, Color.TOMATO)\n};\nLinearGradient lg = new LinearGradient(0,0,1,0,true,CycleMethod.NO_CYCLE,gradientStops);\n\
    ```\n\n```\nrectangle.setX(10);\nrectangle.setY(10);\nrectangle.setHeight(150);\n\
    rectangle.setWidth(150);\nrectangle.setFill(lg);\n```\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_102_1.png)\n\
    **Figure 6-2** A three-color LinearGradient\n\nNotice how the value of the offset\
    \ attribute changed to accommodate the three-color LinearGradient. When the gradient\
    \ was composed of two colors, the offsets were 0 and 1. To place a third color\
    \ exactly between the other two, an offset of .5 needed to be assigned. An offset\
    \ higher than .5 would place the white closer to the right, whereas a value lower\
    \ than .5 would put it closer to the left. By changing the start and end points\
    \ along the y-axis, you can tilt the gradient as shown in Figure 6-3.\n\nNow's\
    \ look how to create and use a RadialGradient.\n\n## RadialGradients\n\nRadialGradients\
    \ are gradients that, instead of emanating from one side, radiate out from a central\
    \ point. Whereas LinearGradients work well with rectilinear shapes, RadialGradients\
    \ work best on circles and ellipses. RadialGradients are in the javafx.scene.paint\
    \ package. You can import this package and the correct class into your code using\
    \ the following statement:\n\n```\nimport javafx.scene.paint.RadialGradient;\n\
    import javafx.scene.shape.Circle;\n```\n\nBecause a RadialGradient emanates from\
    \ a center point in a circular pattern, you must define a center point and radius.\
    \ The center point and radius create a circle for the first color of the RadialGradient.\
    \ The color will then fill the host shape while diffusing into the second color.\n\
    \nThe first parameter of the RadialGradient is FocusAngle. The focal angle is\
    \ the angle of the focal point of the gradient in relationship to the center.\
    \ Given that the gradient is being mapped around a spheroid, it does not need\
    \ to correspond directly with the center\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_103_0.png)\n\
    **Figure 6-3** A three-color skewed LinearGradient\n"
