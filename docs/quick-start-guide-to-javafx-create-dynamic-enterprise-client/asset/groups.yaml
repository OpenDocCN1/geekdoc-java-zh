    # 第2章：设置场景... 23


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_40_0.png)


    **图 2-8** 你的第一个 JavaFX 应用程序


    ## 编译你的 JavaFX 程序


    要编译并运行你的 JavaFX 程序，请按 F6 键。你也可以点击 NetBeans 栏上的绿色大箭头。这两种方法中的任何一种都会将你的脚本编译为可执行应用程序。


    你的代码将根据选定的运行配置（Run Configuration）进行编译和运行，结果将单独窗口显示。


    注意


    目前，你只有一个运行配置：<default>。随着学习深入，你将创建其他配置。


    在这种情况下，你的第一个 JavaFX 程序将创建一个带有单个按钮的非常有趣的窗口。点击该按钮将产生图 2-8 所示的消息。


    在下一章中，你将创建你自己的“Hello World”应用程序。


    ## 第2章自测


    - 1. 列出所有项目的框架名称是什么？

    - 2. 用于创建新 JavaFX 项目的向导名称是什么？

    - 3. 命名空间（namespace）的另一种称法是什么？

    - 4. NetBeans IDE 的哪个面板允许你在代码示例之间导航？

    - 5. 真或假？调面板（Palette）面板包含预定义的复用代码片段。

    - 6. JavaFX 代码文件分配了什么扩展名？

    - 7. Java 语言中，“package” 是什么种类型的单词？

    - 8. FXML 是基于哪种标记语言？

    - 9. 注释的开始和结束字符是什么？

    - 10. 真或假？使用 FXML 时不能使用代码后台文件（code-behind file）。


    ## 第3章


    Hello World


    ## 核心技能与概念


    - 学习什么是 MVC

    - 使用 JavaFX Scene Builder

    - 值的绑定


    在本章中，你将开始在你的 JavaFX 程序中编写代码。从这里开始，前两章所有的准备工作将开始产生回报。你在前两章学习基础知识时投入的所有时间和精力，都将帮助你掌握本章介绍的
    Java、JavaFX 和 FXML。


    学习新语言最棒的部分是能够以一种新颖且令人兴奋的方式表达你的想法和愿景。这正是你在这章中要做的。你将学习如何启动你可能（或可能）知道如何在其他语言中做的事情，并在
    JavaFX 中赋予它们生命。但在之前，我们需要讨论一些关键概念。


    ## 什么是 MVC？


    从 2 版本开始，JavaFX 一直遵循模型-视图-控制器（MVC）设计模式，该模式旨在将应用程序的用户界面（UI）与业务逻辑分离。这允许用户界面独立于控制它们的逻辑进行设计和构建。MVC
    并不是 JavaFX 或 FXML 所独有的。这种设计模式已经存在多年，并用于几乎所有的主要的框架。然而，如果你不熟悉它，不要担心，在学习本书中的示例时，你将学到大部分所需的的知识。


    当你使用 FXML 时，.fxml 文件代表 MVC 中的“视图（view）”。这意味着 FXML 文件是 UI 所表述的数据或逻辑的物理视图。你可以在不需要了解相关
    Java 文件底层数据的情况下，在 FXML 文件中设计和创建用户界面。在本章中，当你接触到一个名为 JavaFX Scene Builder 的新工具时，将更深入地了解这一点。


    与 .fxml 文件紧密耦合的 java 文件是 MVC 模式中的“控制器（controller）”。控制器从业务逻辑中获取数据和信息并传递给视图。在 NetBeans
    为你创建的默认 Hello World 程序中，Sample.java 文件是 Sample.fxml 视图的控制器。


    最后，你项目中任何包含在视图中显示的逻辑或数据的支持 Java 文件都是 MVC 模式中的“模型（models）”。模型可以分布在项目中的任意数量文件中，只要它们都包含相同的命名空间中。


    在本章的下一节中，你将学习如何使用 JavaFX Scene Builder 来设计和创建 MVC 模式中引用的 FXML 视图。


    ## 使用 JavaFX Scene Builder


    Oracle 提供了一个工具，用于图形化地设计和开发你的 JavaFX 程序的 UI。JavaFX Scene Builder 设计用于直接与你的 FXML
    文件配合，并允许你添加、删除和操作 FXML 中的元素。在本节中，你将使用 JavaFX Scene Builder 修改 Sample.fxml 文件并创建一个新的
    Hello World 应用程序。


    注意

    在 http://www.oracle.com/technetwork/java/javafx/overview/index.html 下载 JavaFX
    Scene Builder。


    下载并安装 JavaFX Scene Builder 后，使用它打开 JavaFXForBeginners 项目中的 Sample.fxml 文件。你应该能看到类似于图
    3-1 所示的屏幕。


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_44.png)


    图 3-1 Sample.fxml 在设计器中


    ## JavaFX 快速上手


    记得 NetBeans 为你创建的那个 Hello World 应用程序吗？该应用程序有一个文本为“Click Me!”的按钮。你在 Scene Builder
    中清晰地看到它。


    ## 使用容器


    Scene Builder 的左侧有两个视图：库（Library）和层次级（Hierarchy）。Scene Builder 展示了这些视图。


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_45.png)


    图 3-2 库和层次级


    你现在关注的视图是层次级视图，它显示了 FXML 文件中的所有元素。查看 Sample.fxml，你应该看到一个 AnchorPane。点击层次级视图中的这些元素将高亮设计器中相应的元素。设计器如图
    3-3 所示。


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_46.png)


    图 3-3 检查器视图


    ## 使用控件


    检查器视图包含高亮元素的可分配属性。在检查器视图中，你可以设置、查看和修改任何属性。这使得 JavaFX Scene Builder 在设计和创建 JavaFX
    应用程序时成为宝贵的工具。


    为了在本章中创建 Hello World 应用程序，你需要一个空白画布。因此，在层次级视图中点击按钮元素和标签元素并选择删除。这将从 Sample.fxml
    中删除这些元素。


    在删除元素时，可能会收到如图 3-4 所示的错误。


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_47.png)


    图 3-4 警告


    如果你收到此错误，点击删除按钮并继续。此错误只是告诉你你正在删除的元素与代码有关。我们将在本节的后续部分处理代码。然而，如果我们不处理代码，应用程序将无法正确编译或运行。


    现在你要在 Sample.fxml 中添加一个新的 GridPane 元素。网格提供了一种整齐组织页面元素的良好方法。点击库视图中的 2x3 项目并将其拖到设计器中。当你与
    AnchorPane 的中心对齐时，将看到水平和垂直对齐线，如图 3-5 所示。当 GridPane 与 AnchorPane 的中心对齐时放下它。在 GridPane
    锚定到你的 FXML 后，是时候添加一些控件了。


    你将添加到 GridPane 的第一个控件是 Label。点击库中的 Label 控件并拖到 GridPane 的右下单元格中。一旦标签锚定到你的网格中，选择它使其属性在检查器视图中可见。在继续之前，你需要设置一些属性。


    目前，Label 控件的 Text 属性设置为“Label”。这意味着当控件渲染时，除非更改文本，否则 Label 将显示“Label”。让我们通过删除 Text
    属性中的文本来更改它。接下来，在检查器视图底部有一个折叠面板，标记为 Layout。点击 Layout 旁边的箭头展开它。


