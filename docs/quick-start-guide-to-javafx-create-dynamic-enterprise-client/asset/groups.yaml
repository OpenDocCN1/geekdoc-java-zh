- md: "\n# Quick Start Guide to JavaFX\n\nNow let's set the initial parameters of\
    \ the Slider. The Max value (the highest value on the bar), the Min value (the\
    \ lowest value on the bar), and the Value (the current position of the slider).\n\
    \nGiven that the video doesn't start playing until the user clicks the play button,\
    \ you can set these initial values in the event handler for this button.\n\n```\n\
    play.setAction(new EventHandler<ActionEvent>() {\n    @Override\n    public void\
    \ handle(ActionEvent event) {\n        mp.playMedia();\n        progressBar.setMax(mp.getTotalTime());\n\
    \        progressBar.setMin(0);\n        progressBar.setValue(mp.getCurrentTime());\n\
    \    }\n});\n```\n\nThis is the complex part. You need to write a listener for\
    \ the progressBar that fire every time you move the slider. It will then write\
    \ the current value of the progressBar to MyMediaView—using the setCurrentTime()\
    \ method—to let the user manually advance and rewind the video.\n\nAdd a listener\
    \ to the valueProperty of the progressBar. This will allow you to execute code\
    \ when the value is changed by moving the slider.\n\n```\nprogressBar.valueProperty().addListener(new\
    \ InvalidationListener() {\n    @Override\n    public void invalidated(Observable\
    \ arg0) {\n        if (progressBar.isValueChanging()) {\n            mp.setCurrentTime(progressBar.getValue());\n\
    \        }\n    }\n});\n```\n\nFinally, you need to add a way for MyMediaView\
    \ to update the slider's position on the progressBar. This can be accomplished\
    \ using another property listener. This time you will listen for changes in the\
    \ MediaPlayer's currentTime. When currentTime changes, you want to update the\
    \ value of the progressBar, thus moving the slider forward as the video plays.\n\
    \n```\nmp.getMediaPlayer().currentTimeProperty()\n.addListener(new InvalidationListener()\
    \ {\n    @Override\n    public void invalidated(Observable arg0) {\n        progressBar.setValue(mp.getCurrentTime().millis());\n\
    \    });\n}\n});\n```\n\nYou now have the values needed to get and set the current\
    \ playback time of the video.\nThe full Chapter14.java file should now look like\
    \ this:\n\n```java\npackage Chapter14;\n\nimport javafx.application.Application;\n\
    import javafx.beans.InvalidationListener;\nimport javafx.event.ActionEvent;\n\
    import javafx.event.EventHandler;\nimport javafx.scene.Group;\nimport javafx.scene.Scene;\n\
    import javafx.scene.control.Slider;\nimport javafx.scene.layout.HBox;\nimport\
    \ javafx.stage.Stage;\n\n/**\n * @author J F DiMarzio\n */\npublic class Chapter14\
    \ extends Application {\n    /**\n     * @param args the command line arguments\n\
    \     */\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n\n    @Override\n    public void start(Stage primaryStage) {\n       \
    \ final Slider progressBar = new Slider();\n        final MyMediaView mp = new\
    \ MyMediaView();\n        RoundButton play = new RoundButton(RoundButtonAPI.PLAY);\n\
    \        RoundButton pause = new RoundButton(RoundButtonAPI.PAUSE);\n\n      \
    \  play.setOnAction(new EventHandler<ActionEvent>() {\n            @Override\n\
    \            public void handle(ActionEvent event) {\n                mp.playMedia();\n\
    \                progressBar.setMax(mp.getTotalRunTime());\n                progressBar.setMin(0);\n\
    \                progressBar.setValue(mp.getCurrentTime());\n            }\n \
    \       });\n\npause.setOnEventHandler(new EventHandler<ActionEvent>() {\n   \
    \ @Override\n    public void handle(ActionEvent event) {\n        mp.pauseMedia();\n\
    \    }\n});\n\nprogressBar.valueProperty().addListener(new InvalidationListener()\
    \ {\n    @Override\n    public void invalidated(javafx.beans.Observable arg0)\
    \ {\n        if (progressBar.isValueChanging()) {\n            mp.setCurrentTime(progressBar.getValue());\n\
    \        }\n    }\n});\n\nmp.getMediaPlayer().currentTimeProperty().addListener(new\
    \ InvalidationListener() {\n    @Override\n    public void invalidated(javafx.beans.Observable\
    \ arg0) {\n        progressBar.setValue(mp.getCurrentTime());\n    }\n});\n\n\
    HBox hBox = new HBox();\nhBox.getChildren().add(play);\nhBox.getChildren().add(pause);\n\
    hBox.getChildren().add(progressBar);\n\nGroup root = new Group();\nroot.getChildren().add(mp);\n\
    root.getChildren().add(hBox);\nprimaryStage.setScene(new Scene(root, 540, 209));\n\
    primaryStage.show();\n    }\n}\n```\n\nCompile and run these classes. You now\
    \ have a pause/play button and a progress indicator that allows the user to change\
    \ the current playback position of the video.\n\nIn the final chapter of this\
    \ book, you learn about using CSS to add even more originality to your UI.\n\n\
    # Chapter 14 Self Test\n\n- 1. What node is used to hold a MediaPlayer?\n- 2.\
    \ What package contains all the nodes needed to work with media files?\n- 3. What\
    \ property of the MediaPlayer tells the associated media object to play once it\
    \ has loaded?\n- 4. What media formats can the MediaPlayer play?\n- 5. What method\
    \ of the MediaPlayer will pause media playback?\n- 6. True or false? MediaPlayer.mediaLength()\
    \ will give you the total running time of a media file.\n- 7. What type is MediaPlayer.currentTime?\n\
    - 8. What property of MediaPlayer can you bind to in controlling the playback\
    \ volume?\n\n# Appendix A: Packaging and Deploying JavaFX\n\nMuch of this book\
    \ was spent covering the basics of JavaFX. You have learned to navigate JavaFX\
    \ APIs and create some applications. In this chapter, you are going to learn how\
    \ to deploy the applications you have created. There are three major methods for\
    \ deploying JavaFX: using the JavaFX Packager tool, creating a self-contained\
    \ app, and using Web Start.\n\n## JavaFX Packager Tool\n\nThroughout this book\
    \ you have created applications you can execute within NetBeans, but one issue\
    \ remains: You need to be able to deploy the applications so that others can execute\
    \ them. \n\n## NOTE\n\nIn this example, you will be using Chapter12.java. If you\
    \ do not have any of the examples, you may want to complete one before following\
    \ these steps.\n\nThe first step in deploying JavaFX from NetBeans is to right-click\
    \ your project and go to the project's Properties dialog box. From there, select\
    \ the Run properties. In the Run properties, you just want to confirm that the\
    \ Application Class setting is the correct class name of the .java file you want\
    \ to execute. The class listed in the Application section is the file that will\
    \ be compiled and deployed during this process. Once you have confirmed or set\
    \ the correct class as the application, you can close the Properties dialog box.\
    \ If you have never modified or tweaked the setting, there is no reason why this\
    \ shouldn't set correctly.\n\nThe next step in deploying your application is to\
    \ build your project. The build process generates a .jar file that can be used\
    \ to run the application outside the NetBeans IDE. To build your project, right-click\
    \ your project once again and select Build Project.\n"
  mdcn: "\n\n# JavaFX 快速上手指南\n\n现在让我们设置 Slider（滑动块）的初始参数。最大值（Max，条上的最高值）、最小值（Min，条上的最低值）以及值（Value，滑动块的当前位置）。\n\
    \n考虑到视频在用户点击按钮之前不会开始播放，你可以在此按钮的事件处理器中设置这些初始值。\n\n```\nplay.setAction(new EventHandler<ActionEvent>()\
    \ {\n    @Override\n    public void handle(ActionEvent event) {\n        mp.playMedia();\n\
    \        progressBar.setMax(mp.getTotalTime());\n        progressBar.setMin(0);\n\
    \        progressBar.setValue(mp.getCurrentTime());\n    }\n});\n```\n\n这是复杂的部分。你需要为\
    \ `progressBar` 编写一个监听器，每当移动滑动块时，它就会触发。然后，它将使用 `setCurrentTime()` 方法将 `progressBar`\
    \ 的当前值写入 `MyMediaView`，以便户手动快进或后退视频。\n\n为 `progressBar` 的 `valueProperty()` 属性添加一个监听器。这将允许你在通过移动滑动块改变值时执行代码。\n\
    \n```\nprogressBar.valueProperty().addListener(new InvalidationListener() {\n\
    \    @Override\n    public void invalidated(Observable arg0) {\n        if (progressBar.isValueChanging())\
    \ {\n            mp.setCurrentTime(progressBar.getValue());\n        }\n    }\n\
    });\n```\n\n最后，你需要为 `MyMediaView` 添加一种更新 `progressBar` 上滑动块位置的方法。这可以通过另一个属性监听器来实现。这次，你将监听\
    \ `MediaPlayer` 的 `currentTime` 变化。当 `currentTime` 改变时，你想更新 `progressBar` 的值，从而在视频播放时让滑动块向前移动。\n\
    \n```\nmp.getMediaPlayer().currentTimeProperty()\n.addListener(new InvalidationListener()\
    \ {\n    @Override\n    public void invalidated(Observable arg0) {\n        progressBar.setValue(mp.getCurrentTime().millis());\n\
    \    });\n}\n});\n```你现在拥有了获取和设置视频当前播放时间所需的数值。\n完整的 `Chapter14.java` 文件现在应该是这样的：\n\
    \n```java\npackage Chapter14;\n\nimport javafx.application.Application;\nimport\
    \ javafx.beans.InvalidationListener;\nimport javafx.event.ActionEvent;\nimport\
    \ javafx.event.EventHandler;\nimport javafx.scene.Group;\nimport javafx.scene.Scene;\n\
    import javafx.scene.control.Slider;\nimport javafx.scene.layout.HBox;\nimport\
    \ javafx.stage.Stage;\n\n/**\n * @author J F DiMarzio\n */\npublic class Chapter14\
    \ extends Application {\n    /**\n     * @param args the command line arguments\n\
    \     */\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n\n    @Override\n    public void start(Stage primaryStage) {\n       \
    \ final Slider progressBar = new Slider();\n        final MyMediaView mp = new\
    \ MyMediaView();\n        RoundButton play = new RoundButton(RoundButtonAPI.PLAY);\n\
    \        RoundButton pause = new RoundButton(RoundButtonAPI.PAUSE);\n\n      \
    \  play.setOnAction(new EventHandler<ActionEvent>() {\n            @Override\n\
    \            public void handle(ActionEvent event) {\n                mp.playMedia();\n\
    \                progressBar.setMax(mp.getTotalRunTime());\n                progressBar.setMin(0);\n\
    \                progressBar.setValue(mp.getCurrentTime());\n            }\n \
    \       });\n\npause.setOnEventHandler(new EventHandler<ActionEvent>() {\n   \
    \ @Override\n    public void handle(ActionEvent event) {\n        mp.pauseMedia();\n\
    \    }\n});\n\nprogressBar.valueProperty().addListener(new InvalidationListener()\
    \ {\n    @Override\n    public void invalidated(javafx.beans.Observable arg0)\
    \ {\n        if (progressBar.isValueChanging()) {\n            mp.setCurrentTime(progressBar.getValue());\n\
    \        }\n    }\n});\n\nmp.getMediaPlayer().currentTimeProperty().addListener(new\
    \ InvalidationListener() {\n    @Override\n    public void invalidated(javafx.beans.Observable\
    \ arg0) {\n        progressBar.setValue(mp.getCurrentTime());\n    }\n});\n\n\
    HBox hBox = new HBox();\nhBox.getChildren().add(play);\nhBox.getChildren().add(pause);\n\
    hBox.getChildren().add(progressBar);\n\nGroup root = new Group();\nroot.getChildren().add(hBox);\n\
    primaryStage.setScene(new Scene(root, 540, 209));\nprimaryStage.show();\n    }\n\
    }\n```\n\n编译并运行这些类。你现在已经了获取和设置视频当前播放时间所需的数值。你现在有了一个播放/暂停按钮以及一个允许用户更改视频当前位置的进度条。\n\
    \n在本书的最后一个章节中，你将学习使用 CSS 为 UI 增加更多个性化。\n\n# 第 14 章自测\n\n-   哪个节点被用于持有 MediaPlayer？\n\
    -   哪个包包含了处理媒体文件所需的节点？\n-   MediaPlayer 的哪个属性在加载后会指示关联媒体对象播放？\n-   MediaPlayer\
    \ 可以播放哪些媒体格式？\n-   MediaPlayer 的哪个方法可以暂停媒体播放？\n-   正确或错误？`MediaPlayer.mediaLength()`\
    \ 将给出总运行时间。\n-   `MediaPlayer.currentTime` 是什么类型？\n-   你可以绑定到 MediaPlayer 的哪个属性来控制音量？\n\
    \n# 附录 A：JavaFX 的打包与部署\n\n本书的大部分内容都在介绍 JavaFX 的基础。你已经学习了如何使用 JavaFX API 并创建了一些应用程序。在本章中，你将学习如何部署你创建的应用程序。\n\
    \n## JavaFX 打包工具\n\n在本书中你创建了可以在 NetBeans 中运行的应用程序，但仍然有一个待解决的问题：你需要部署这些应用程序以便他人执行。\n\
    \n## 注意\n\n在示例中，你将使用 `Chapter12.java`。\n\n"
