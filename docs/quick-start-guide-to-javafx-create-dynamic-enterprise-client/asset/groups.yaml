    \n# 第 11 章\n\n自定义节点与子类化\n\n## 核心技能与概念\n\n- 子类化 Node\n- 创建自定义节点\n- 重写默认的 Node 方法\n\
    \nFX 带有许多出色的工具。在整本书中，你学习了形状、效果和方法——这仅是部分。然而，如果你发现 JavaFX 中的节点并不完全符合你的需求怎么办？还有另一种方法从\
    \ JavaFX 中获取你需要的内容：你始终可以创建一个完全符合你需求的节点。这可以通过对现有节点进行子类化或创建一个完全全新的节点来实现。在本章中，你将学习这两种从\
    \ JavaFX 中获取精确所需内容的方法。首先，让我们讨论对现有节点进行子类化。\n\n## 子类化 Node\n\n在学习重写 Node 方法之前，需要回答一个关键问题：什么是重写？\n\
    类（例如 `Node` 和 `Button`）包含方法和属性。作为开发者，你可以获取这些方法并将它们的默认操作更改为你任何想要的操作。例如，假设你有一个 `Dog`\
    \ 类，其中包含名为 `displayBreed()` 的方法，如下：\n\n```\npublic class Dog{\n    public void\
    \ displayBreed() {\n        System.out.println(\"Chihuahua\");\n    }\n}\n```\n\
    \n你可以扩展此类并重写 `displayBreed()` 方法以输出不同的内容，如下：\n\n```java\npublic class MyDog extends\
    \ Dog {\n@Override\npublic void displayBreed() {\n    System.out.println(\"Elkhound\"\
    );\n}\n}\npublic class YourDog extends Dog {\n}\n```\n\n# 第 11 章：...自定义节点与子类化\n\
    \n在这里，调用 `Dog.displayBreed()` 会打印行“Chihuahua”。调用 `YourDog.displayBreed()` 也会打印“Chihuahua”。但是，由于\
    \ `MyDog` 重写了 `displayBreed()` 方法，调用 `MyDog.getBreed()` 将打印“Elkhound”。\n\n通过重写，你可以创建具有新功能或扩展功能的节点。在接下来的章节中，你可以创建具有新功能或扩展功能的节点。\n\
    \n为了准备此练习，请创建 Chapter11：\n\n```java\npackage chapter11;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\
