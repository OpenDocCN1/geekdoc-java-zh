    In this chapter you learn how to use Cascading Style Sheets (CSS) to easily change
    the look and feel of your JavaFX applications. If you are not fully aware of what
    CSS is, this very quick refresher should help.

    CSS is a styling language that allows you to separate the styling elements of
    an object from the object itself. Although CSS was created long before JavaFX,
    JavaFX includes the ability to use this styling language. In fact, the JavaFX
    CSS is based on the W3C version 2.1 CSS standard. This means you can create all
    your objects—or nodes in JavaFX—without any care for their placement, look, or
    feel. All you have to do is define the functionality of your nodes. Then, either
    in the style property of the nodes or in a separate file, you can define styles
    that change the look and feel of your nodes.

    An important feature of CSS you should note here is that all your CSS styles can
    be contained in a file separate from your java file. Keeping your code and .css
    files separate allows you to change your styles—and even the complete look and
    feel of your application—without needing to change or recompile your application.
    What does this mean to you? You can change the look and feel of an application
    you''ve designed by modifying the .css file, while leaving your application''s
    code untouched.


    # Ask the Expert


    Q: Is there a difference between the CSS used in JavaFX and the CSS used on web
    pages?


    A: Yes. JavaFX supports new JavaFX-specific elements. It is unclear how many,
    if any, of the standard CSS elements JavaFX will support in the future.'
