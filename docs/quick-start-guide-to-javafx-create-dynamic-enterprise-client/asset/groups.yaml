    \ in some of the holes that may have been left in the lessons of this book. In\
    \ this appendix we briefly cover the basics of JavaFX and Swing compatibility.\n\
    \n## JavaFX Swing Compatibility\n\nJavaFX 8 has provided you with a new node type\
    \ that is used for JavaFX-to-Swing compatibility. In the following snippet, JFXPanel\
    \ is placed in the:\n\n```java\nfinal JFXPanel javafxPanel = new JFXPanel();\n\
    ```\n\nBecause JFXPanel inherits from JComponent, it can be used anywhere. In\
    \ the same way that the key to SwingNode is the getContent() method, the key to\
    \ add JavaFX content to JFXPanel is the setScene() method:\n\n```java\nScene myScene\
    \ = createScene();\njavafxPanel.setScene(myScene);\n```\n\nIn the preceding snippet,\
    \ myScene can be added just like any scene. This allows JavaFX content to be integrated\
    \ into your Swing apps.\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_242_0.png)\n\
    \n## Appendix B: The Swing of Things\n\n```java\nfinal JFXPanel javafxPanel =\
    \ new JFXPanel();\n```\n\nBecause JFXPanel inherits from JComponent, it can be\
