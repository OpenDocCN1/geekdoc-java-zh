- md: "\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_126_0.png)\n\n**Figure 8-3** Butterfly\
    \ modified using ColorAdjust\n\nYou can specify a value from 0 to 63 for the radius\
    \ of the GaussianBlur. A value of 0 would be little to no blur in the original\
    \ image, whereas a value of 63 would be an extreme blur. The following code implements\
    \ a GaussianBlur with a radius of 10 (which is the default):\n\n```\nGaussianBlur\
    \ blur = new GaussianBlur();\nblur.setRadius(10);\n```\n\nApply the GaussianBlur\
    \ to your applyEffects() function as follows:\n\n```\nprivate void applyEffects(ImageView\
    \ imageView)\n{\n    GaussianBlur blur = new GaussianBlur();\n    imageView.setEffect(blur);\n\
    }\n```\n\nRun your completed app, which blurs the background with a radius of\
    \ 10. The result is shown in Figure 8-4.\n\nNotice that the butterfly is slightly\
    \ blurred, but still recognizable. Now change the radius to 60 and recompile the\
    \ app. The results are shown in Figure 8-5.\n\nGaussianBlur is particularly effective\
    \ when you are trying to resize images. Occasionally an image can become distorted\
    \ when it is resized, especially if the image is quite sharp before it is resized.\
    \ Applying a very light GaussianBlur before resizing the image (in systems that\
    \ do not do so automatically) can make the resized image less distorted.\n\nYou\
    \ learn about the Glow effect next.\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_127_0.png)\n\
    \nFigure 8-4 Butterfly with a GaussianBlur radius of 10\n\n# Chapter 8: ...Applying\
    \ Effects and Transformations ...... 111\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_128_0.png)\n\
    \nFigure 8-5 Butterfly with a GaussianBlur radius of 60\n\n# Glow\n\nThe Glow\
    \ effect, as the name suggests, makes your node appear to glow. The amount of\
    \ glow applied to the node is controlled by the level parameter. The level of\
    \ glow you can apply to a node ranges from 0 to 1. Assigning no level for the\
    \ Glow effect will JavaFX to use a default of .3.\n\nEarlier in this chapter you\
    \ learned about the Bloom effect, which applied a Glow-like effect to your node.\
    \ The difference between Bloom and Glow is in the way the glow is applied. Whereas\
    \ Bloom only applies a glow to the higher contrast parts of an image, Glow works\
    \ on the entire image.\n\nThe following code shows you use applyEffects() method\
    \ with a Glow level of .5:\n\n```\nGlow glow = new Glow();\nglow.setLevel(.5);\n\
    ```\n\nReplace the applyEffects() method in your current .java file with this\
    \ one. Your full\njava file should look like this:\n\n```java\npackage Chapter8;\n\
    \nimport javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.effect.Glow;\n\
    import javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\nimport\
    \ javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\n/**\n * @author\
    \ Java J F DiMarzio\n */\npublic class Chapter8 extends Application {\n    /**\n\
    \     * @param args the command line arguments\n     */\n    public static void\
    \ main(String[] args) {\n        launch(args);\n    }\n\n    @Override\n    public\
    \ void start(Stage primaryStage) {\n        Image image = new Image(\"http://jdimarzio.com/butterfly.png\"\
    );\n        ImageView imageView = new ImageView();\n\n        imageView.setImage(image);\n\
    \        applyEffects(imageView);\n\n        StackPane root = new StackPane();\n\
    \        root.getChildren().add(imageView);\n        primaryStage.setScene(new\
    \ Scene(root, 800, 600));\n        primaryStage.show();\n    }\n\n    private\
    \ void applyEffects(ImageView imageView) {\n        Glow glow = new Glow();\n\
    \        glow.setLevel(.5);\n        imageView.setEffect(glow);\n    }\n}\n```\n\
    \nCompile and run your app. Your butterfly should glow like the one shown in\n\
    Figure 8-6.\n\nThe next effect you learn about is the DropShadow effect.\n\n#\
    \ Chapter 8: Applying Effects and Transformations\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_130_0.png)\n\
    \nFigure 8-6 Butterfly with a Glow of .5\n\n# DropShadow\n\nThe DropShadow effect\
    \ creates a shadow under your node by replicating the node in a shadow color and\
    \ offsetting the \"shadow\" image by a specific amount under your source node.\
    \ Quite a few parameters are needed to configure DropShadow:\n\n- radius Used\
    \ like the radius parameter for GaussianBlur.\n- height/width Can be used instead\
    \ of radius, and has the same effect.\n- spread The opacity of the shadow. A value\
    \ of 0 creates a very light, scattered shadow, whereas a value of 1 produces a\
    \ dark, sharp shadow.\n- blurType The algorithm used to create the shadow. This\
    \ can be set to Gaussian, ONE_PASS_BOX, TWO_PASS_BOX, or THREE_PASS_BOX. These\
    \ blur types use a box blur algorithm to smooth the image. You can specify whether\
    \ you want the blur to be one, two, or three passes. The image gets progressively\
    \ smoother with each pass. Therefore, a blur with three passes will be much smoother\
    \ than a blur with one pass.\n\nTo use the DropShadow effect, modify your applyEffects()\
    \ method as follows:\n\n```java\nprivate void applyEffects(ImageView imageView)\
    \ {\n    DropShadow shadow = new DropShadow();\n    shadow.setBlurType(BlurType.THREE_PASS_BOX);\n\
    \    shadow.setColor(Color.BLACK);\n    shadow.setOffsetX(10);\n    shadow.setOffsetY(10);\n\
    \    shadow.setRadius(10);\n    shadow.setSpread(.2);\n    imageView.setEffect(shadow);\n\
    }\n```\n\nThis script produces a shadow under the butterfly like the one shown\
    \ in Figure 8-7. The DropShadow effect works by creating a blurred copy of your\
    \ original image. The copy is placed under the original image and then offset\
    \ so you can see it. You can use the Shadow effect if you want to control this\
    \ process.\n\nThe Shadow effect creates a blurred, colored image based on your\
    \ original. However, it does not re-add an unaltered copy of your image to the\
    \ scene. You are literally left with the shadow of your image. You will have to\
    \ manually add another instance of your image to the scene to complete the effect.\n\
    \nUsing the Shadow effect over the DropShadow effect has its advantages, though.\
    \ For example, it can come in quite handy if you want to project the shadow onto\
    \ a location detached from the original image.\n\nYou learn about the Lighting\
    \ effect next.\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_133_0.png)\n\nFigure\
    \ 8-7 Butterfly with DropShadow\n\n# Lighting\n\nThe Lighting effect is by far\
    \ the most complex effect offered in JavaFX. Lighting can be used to add a dimension\
    \ of realism to an otherwise flat object. Although Lighting is a complex effect\
    \ to set up, it is very rewarding if used correctly.\n\nThe main parameter of\
    \ the Lighting effect is Light, which represents the type of light from the javafx.scene.effect.light\
    \ package. Three different classes can be used for Light:\n\n- Distant\n- Point\n\
    - Spot\n"
