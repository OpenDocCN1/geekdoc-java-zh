    # Glow


    The Glow effect, as the name suggests, makes your node appear to glow. The amount
    of glow applied to the node is controlled by the level parameter. The level of
    glow you can apply to a node ranges from 0 to 1. Assigning no level for the Glow
    effect will JavaFX to use a default of .3.


    Earlier in this chapter you learned about the Bloom effect, which applied a Glow-like
    effect to your node. The difference between Bloom and Glow is in the way the glow
    is applied. Whereas Bloom only applies a glow to the higher contrast parts of
    an image, Glow works on the entire image.


    The following code shows you use applyEffects() method with a Glow level of .5:


    ```

    Glow glow = new Glow();

    glow.setLevel(.5);

    ```'
