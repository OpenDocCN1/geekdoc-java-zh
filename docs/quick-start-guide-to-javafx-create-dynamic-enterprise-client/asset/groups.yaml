    these elements from Sample.fxml.


    While deleting the elements, you may receive an error like the one shown in Figure
    3-4. If you get this error, click the Delete button and continue. This error is
    just telling you that the elements you are deleting have properties that might
    tie you to your code. We will address the code later in this section. However,
    if we did not address the code, your application would not compile or run correctly.


