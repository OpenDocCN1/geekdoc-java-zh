    \ in a real working application. However, it lends itself very nicely to learning\
    \ how effects work by separating the code.\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_121_0.png)\n\
    \n**Figure 8-1** The image before effects are applied\n\nWhen compiled, this JavaFX\
    \ app, as it is, should produce an image like the one in Figure 8-1. This java\
    \ file, in its current state, will be the base you use for the rest of this chapter.\
    \ All the effects and transformations you learn about in this chapter are demonstrated\
    \ using this application. The first section of this chapter covers effects, which\
    \ is followed by a discussion of transformations.\n\n## Effects\n\nJavaFX is capable\
    \ of rendering stunning and complex effects. Images and effects can be blended,\
    \ blurred, shadowed. Such effects can be very compelling and can be used to create\
    \ applications that engage your users.\n\n## Chapter 8: Applying Effects and Transformations\n\
    \nThese effects can be applied to almost any node in JavaFX. All the standard\
    \ effects available to you in JavaFX are the javafx.scene.effect package. Import\
    \ this package to begin working with JavaFX effects if you have not done already:\n\
    \n```java\nimport javafx.scene.effect.*;\n```\n\nTIP\nAt this point, you have\
    \ explicitly stated which items in each package you want to import. However, the\
    \ * notation tells JavaFX to import all the items within a particular package.\
    \ Therefore, the statement import javafx.scene.effect.\\* will give you access\
    \ to all the effects in the effect package.\n\nThe first effect you will use is\
    \ Bloom.\n\n## Bloom\n\nThe Bloom takes the areas of higher contrast in your image\
    \ and makes them appear to glow by overruling these areas of high contrast and\
    \ bleeding them into the surrounding image. The amount of Bloom applied to the\
    \ node is controlled by the threshold parameter, which accepts a value between\
    \ 0 and 1, with 0 being no effect at all.\n\nUse the applyEffects() method in\
    \ the Chapter8.java file to apply the Bloom effect to the butterfly.png image.\
    \ Every ImageView node has an effect parameter. This parameter is to set the effect\
    \ you want to apply to that ImageView.\n\nTIP\nYou are working with an ImageView\
    \ in this chapter because you just worked with it in Chapter 7. However, ImageViews\
    \ are not the only nodes you can apply effects to. Every node contains an effect\
    \ parameter that you can apply an effect to.\n\n> You can now edit the applyEffects()\
    \ method to apply the Bloom effect to the image. Add the following lines to the\
    \ applyEffects() method:\n\n```java\nbloom = new Bloom();\nbloom.setThreshold(.5);\n\
    imageView.setEffect(bloom);\n```\n\nThis sets the effect property of the ImageView\
    \ to the Bloom effect. The threshold is set to .5 to give you a good idea of what\
    \ the Bloom effect can do. You can adjust the threshold to your liking to achieve\
    \ the desired effect. Your applyEffects() method should now look like this:\n\n\
    ```java\nprivate void applyEffects(ImageView imageView)\n{\n  Bloom bloom = new\
    \ Bloom();\nbloom.setThreshold(.5);\nimageView.setEffect(bloom);\n```\n\nThe entire\
    \ finished application is shown here:\n\n```java\npackage Chapter8;\n\nimport\
    \ javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.effect.Bloom;\n\
    import javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\nimport\
    \ javafx.scene.layout.StackPane;\nimport javafx.scene.stage.Stage;\n```\n\n```java\n\
