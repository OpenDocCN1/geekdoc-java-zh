    # 引言


    ## 为什么选择这本书？


    欢迎阅读《JavaFX 快速上手指南》。本书旨在为你的进入 JavaFX 8 开发这一令人兴奋的新沿领域提供最佳起步阶段。JavaFX 是一个功能丰富的环境工具，对于任何想要为不同背景的用户创建沉浸式、交互式环境的人来说，学习
    JavaFX 是必不可少的。


    如果你熟悉 JavaFX 的之前的版本，那么这本书是你的必备。随着 Java 8 的发布，该平台发生了重大变化。《JavaFX 快速上手指南》涵盖了 JavaFX
    的变化，并为你在在这个不可不起的平台上应对现实世界的开发情况做好准备。


    本书将以逻辑的方式带你了解 JavaFX 8。它从解释 JavaFX 背后的技术开始。你将迅速进入安装 JavaFX 开发环境和工具的阶段。虽然 JavaFX
    有多种开发环境可用，但本书的重点是教你 NetBeans 的基础知识。NetBeans 提供了一个功能丰富且易于学习的产品，能够让你迅速上手 JavaFX
    开发。在读完这本书后，你将熟练地学习更复杂的示例，以测试你日益增长的开发丰富 JavaFX 应用的知识。


    某些章节还包含“尝试一下”（Try This）部分，以帮助你练习所学内容。“尝试一下”部分的结构类似于教科书，你将获得需要独立完成的任务。此外，每个章节都有一个“自测”（Self
    Test）部分，提供问答式问题来进一步增强你的学习体验。充分利用章节问题和“尝试一下”练习，将让你有机会精炼新习得的技能并创建你自己的应用程序。


    虽然这本书不是高级程序员的参考书，但你应该具备某些技能才能从《JavaFX 快速上手指南》中获益。鉴于 JavaFX 现在已集成在 Java 中，其中最重要的技能技能是
    Java 编程基础。对 Java 类和基本类型的了解将帮助你更容易地理解书中的某些概念。


    对书中任何材料的任何意见、问题或建议，可以直接发送给作者：jfddimarzio@jfdimarzio.com。


