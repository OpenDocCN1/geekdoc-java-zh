    \   :\n    Purpose of the style sheets.\n*/\nroot {\n    display: block;\n}\n\
    ```\n\n# Chapter 13: ... Style Your JavaFX with CSS\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_202_0.png)\n\
    \nFigure 13-2 Choosing Cascading Style Sheet\n\nNotice how the CSS file contains\
    \ a comments section, much like your JavaFX files. This comments section is followed\
    \ by the styles. When you create a new style using the New File Wizard, one style\
