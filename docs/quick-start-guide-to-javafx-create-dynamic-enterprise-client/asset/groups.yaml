    # Key Skills & Concepts


    +   * Reacting to mouse events

    * Using anonymous inner classes

    * Trapping key events


    This chapter introduces you to JavaFX events. The concepts that are required when
    working with events are key in producing rich, interactive applications. Events
    allow your application to respond to the actions of the user.


    # What Are Events?


    Events provide a way to interact with your users in JavaFX. As a developer, you
    can use many types of events to enable your users to interact with and react to
    your environment. Events can be fired as a result of the user interacting in some
    way with your environment, and you can register listeners for these events and
    write actions using the data associated with the events.


    In this chapter you discover and utilize two common sets of events: mouse events
    and keyboard events.


    # Mouse Events


    A mouse event is the generic term for the action of any pointer-style input. The
    provider of this input does not necessarily have to be a physical mouse. Any device
    that moves a pointer across an environment will generate a mouse event. A mouse,
    stylus, track ball, track pad, or any other navigational tool will generate a
    mouse event if it moves your pointer around your JavaFX environment.


    Here''s a list of the properties of type EventHandler that generate mouse events:


    +   * onMouseClicked

    * onPressed

    * onMouseReleased

    * onDragged

    * onDragEntered'
