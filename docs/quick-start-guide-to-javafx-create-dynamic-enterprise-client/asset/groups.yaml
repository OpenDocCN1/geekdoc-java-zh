    \ to JavaFX\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_201_0.png)\n\n**Figure\
    \ 13-1** The result of selecting New | Other from the context menu\n\nFinally,\
    \ click the Next button, name your file **default**, and then click the Finish\
