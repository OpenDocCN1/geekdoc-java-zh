    \nDrawing separate lines for every shape and configuration you can think of is\
    \ not a very economic use of your time as a developer. Imagine what it would be\
    \ like if you had to draw every line, one at a time, to form simple shapes. Luckily\
    \ there is another type of line you can use called a polyline. It lets you specify\
    \ more than one set of points in one line, the last of which are the end points.\
    \ Specifying more than one end point lets you draw more complex lines with less\
    \ code. Let's try to draw the same U-shaped, three-line configuration using a\
    \ Polyline node.\n\nThe first step using a Polyline node is to import the Polyline\
    \ package. The code for using polylines is different from the code for lines.\
    \ For this reason, you need to import a separate class to work with polylines:\n\
    \n```java\nimport javafx.scene.shape.Polyline;\n```\n\n# Chapter 5: Creating Shapes\n\
    \n![](img/f5bc6249660e63bd0b6a2dc95983edb7_80_0.png)\n\nWith the package imported,\
    \ instantiate a new Polyline. Bring up the context menu to view the available\
    \ methods.\n\nNotice that there are no methods for setStartX and setStartY. Rather,\
    \ a Polyline accepts an array of points. The getPoints() method returns an ObservableList\
    \ of all the points that make up your Polyline. One of the methods of the ObservableList\
    \ is add(). Therefore, you can use the add() method of getPoints() to add a new\
    \ array of points.\n\nWhen you're passing an array of points to a Polyline node,\
    \ it is understood that the first two values will be the x- and y-coordinates\
    \ of the start point, and the last two will be the end point. The Polyline class\
    \ will instinctively draw your line between these points, stopping at all other\
    \ points in your array. You can easily replicate the “U” formation of lines you\
    \ created with Line using an array of points in Polyline.\n\nAn array of points\
    \ that will match the points used in the Line example should look like this:\n\
    \n```java\nnew Double[] {10.0, 10.0,\n10.0, 100.0,\n100.0, 100.0,\n100.0, 10.0}\n\
    ```\n\nNote that each value in the array is separated by a comma.\n\n# TIP\n\n\
    To keep the array visually easy to understand, you can separate each x,y pair\
    \ onto a new line. Whitespace within an array will be ignored by the compiler\
    \ and can be added to make your array easy to read.\n\nRun the following code.\
    \ It should produce the same three-lined U shape as the previous example—but with\
    \ much less code:\n\n```java\npackage Chapter5;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.AnchorPane;\nimport javafx.scene.paint.Color;\n\
    import javafx.scene.shape.Polyline;\nimport javafx.stage.Stage;\n\n/**\n * @author\
    \ J F F DiMarzio\n */\npublic class Chapter5 extends Application {\n\n    /**\n\
    \     * @param args the command line arguments\n     */\n    public static void\
    \ main(String[] args) {\n        launch(args);\n    }\n\n    @Override\n    public\
    \ void start(Stage primaryStage) {\n        Polyline polyline = new Polyline();\n\
    \n        polyline.getPoints().addAll(new Double[]{\n            10.0, 10.0,\n\
    \            10.0, 100.0,\n            100.0, 100.0,\n            100.0, 10.0\n\
    \        });\n        polyline.setStrokeWidth(15);\n        polyline.setStroke(Color.TOMATO);\n\
    \n        AnchorPane root = new AnchorPane();\n        root.getChildren().add(polyline);\n\
    \n        primaryStage.setScene(new Scene(root, 300, 250));\n        primaryStage.show();\n\
    \    }\n}\n```\n\nWith this section complete, you have learned how to create simple\
    \ lines and draw them to the screen. In the next section, you start to apply some\
    \ of the knowledge picked up thus far and begin to create more complex shapes\
    \ as rectilinear and curvilinear objects.\n\n# Rectangles\n\nThe Rectangle node\
    \ is used to refer to either square or rectangle. It is used to draw any parallel-lined,\
    \ four-sided shape. Given that the only difference between rectangles and squares\
    \ is the length of sides, it makes sense that the same element can be used. Polyline\
    \ refines this process by only requiring one point to be specified. When you create\
    \ a rectangle, you only need to specify the point for the upper-left corner of\
    \ the shape. The code needed to create rectangles is contained within a package\
