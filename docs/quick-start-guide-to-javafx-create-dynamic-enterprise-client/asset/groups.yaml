- md: "\n## Chapter 4: Using JavaFX Layouts\n\nFor example, let's say you want to\
    \ create a Scene that has a Text node followed by a Button node horizontally.\
    \ Then, directly under those nodes you want to have another Text node followed\
    \ by another Button node. This is easily handled by nesting two HBox elements\
    \ within a VBox.\n\nThe VBox organizes nodes vertically. In this case, you want\
    \ to have two 'groups' of nodes arranged vertically. You will have two HBox elements\
    \ inside the VBox to represent the two horizontal groupings of nodes that are\
