    # PerspectiveTransform


    PerspectiveTransform alters the perspective of a node. The transform is a non-affine
    transform that maps an arbitrary quadrilateral into another arbitrary quadrilateral
    while preserving the straightness of lines. Unlike an affine transformation, the
    parallelism of lines in the source is not necessarily preserved in the output.
    This is achieved by giving you control over the x- and y-coordinates of each corner
    of the node.'
