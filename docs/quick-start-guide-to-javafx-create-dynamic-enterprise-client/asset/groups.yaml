    your code using the following statement:


    ```

    import javafx.scene.paint.RadialGradient;

    import javafx.scene.shape.Circle;

    ```


    Because a RadialGradient emanates from a center point in a circular pattern, you
    must define a center point and radius. The center point and radius create a circle
    for the first color of the RadialGradient. The color will then fill the host shape
    while diffusing into the second color.


    The first parameter of the RadialGradient is FocusAngle. The focal angle is the
    angle of the focal point of the gradient in relationship to the center. Given
    that the gradient is being mapped around a spheroid, it does not need to correspond
    directly with the center


