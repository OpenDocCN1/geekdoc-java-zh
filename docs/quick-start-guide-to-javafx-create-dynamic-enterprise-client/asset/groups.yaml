    *(注：由于提供的原文文本中存在大量重复段落，此处已根据“不要重复输出原文”的原则进行了去重处理。)*\n\n# 第3章：你好世界\n\n35\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_52_0.png)\n\
    \n图 3-7 绑定的你好世界应用程序\n\n## 方法与属性简介\n\n在绑定到控制器的值之前，你需要理解两个 Java 概念：方法和属性。这两个概念的结合允许你将值从控制器绑定到视图上的\
