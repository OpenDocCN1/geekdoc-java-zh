    # JavaFX 快速上手指南


    创建动态企业级应用程序


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_0_0.png)


    # JavaFX™ 快速上手指南


    # 关于作者


    J.F. DiMarzio 是一位资深开发者。他从 1984 年开始在 TRS-80 Color Computer II 上使用 BASIC 语言进行开发。以来，DiMarzio
    曾在美国国防部和华特迪士尼公司等企业的部门部门工作。他继续努力突破技术边界，并在新的、新兴的平台上进行开发。


    DiMarzio 还是一个高产的成功作家。在过去的 12 年里，他出版了 11 本书，其中包括第一版《JavaFX: A Beginner''s Guide》。他的书籍已被翻译成四种语言并在全球出版。DiMarzio
    的写作风格非常易于阅读和理解，这使得他所介绍的主题信息更易于记忆。


    # 关于技术编辑


    Simon Ritter 是甲骨文公司（Oracle Corporation）Java 技术布道团队的经理。Simon 自 1984 年起进入 IT 行业，拥有英国布鲁内大学（Brunel
    University）物理学学士学位。


    Simon 最初在 AT&T UNIX System Labs 后的 Novell 从事 UNIX 开发工作，随后于 1996 年加入太阳公司（Sun）。期间，他开始接触
    Java 技术，并从事了 Java 开发和咨询工作。在作为太阳公司收购的一部分转入甲骨文后，他现在专注于用于客户端应用程序的 Java Java 平台以及嵌入式
    Java。他还继续开发突破 Java 应用边界的演示程序，例如手势界面、嵌入式机器人控制器和车载系统。可以在 Twitter 上关注 Simon (@speakjava)，并访问他的博客
    blogs.oracle.com/speakjava。


