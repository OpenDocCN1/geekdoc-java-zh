  - '[PAGE 87]


    An Arc element takes seven basic attributes. Given the complexity of drawing an
    arc as opposed to drawing a straight line, the attributes needed to complete an
    arc are unlike those you have seen so far in this chapter and therefore need some
    explanation. To begin, import the following classes:


    ```

    import javafx.scene.shape.Arc;

    import javafx.scene.shape.ArcType;

    ```


    The first required attributes are centerX and centerY:


    ```

    arc.setCenterX(125);

    arc.setY(125);

    ```


    Think of a circle for a moment. An arc would be a segment of that circle. JavaFX
    thinks of an arc as a circle that it only has to draw part of. Therefore, the
    centerX and centerY attributes represent the center point of the circle that the
    arc would form if it was completed.


    The next two attributes are radiusX and radiusY:


    ```

    arc.setRadiusX(50);

    arc.setRadiusY(50);

    ```


    Every circle extends a distance from its center. This distance is the radius.
    The Arc node requires that you specify a radius. However, the naming of the property
    may be a little misleading, because radiusX and radiusY do not represent a point.
    Rather, they represent the radius in length along the x- and y-axes. Having two
    separate radial lengths lets you create arcs.


    TIP


    To make a circular arc, set the radiusX and radiusY properties to the same value.


    The next required attribute is startAngle:


    ```

    arc.setStartAngle(45);

    ```


    The startAngle represents an invisible line that extends from your center point
    to the actual start point of your arc. This line is at a given angle. Therefore,
    a startAngle of 45 means that the arc will begin at a 45-degree angle to the center
    point.


    The next attribute required to create an arc is the length:


    ```

    arc.setLength(270);

    ```'
