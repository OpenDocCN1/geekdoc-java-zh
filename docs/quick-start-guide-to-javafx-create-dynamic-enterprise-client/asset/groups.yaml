    </AnchorPane>\n```\n\nFeel free to compile and run your project now. Even with\
    \ the existing sample code in the controller, it will still compile and run. When\
    \ your JavaFX starts, you should see a TextField that you can enter text into.\
    \ In the next section you will learn how to use binding when turning this TextField\
    \ into world.\n\n## Creating Your Hello World Application\n\nThe most common form\
    \ of human expression is the use of words. The main method of communicating your\
    \ ideas to others through sentences are bombarded with information views every\
    \ day. Regardless of what type of application or rich environment you want to\
    \ create in JavaFX, the best way to get your point across is to use words. Writing\
    \ text to the screen is a common, everyday task in development.\n\n## Using JavaFX\
    \ Binding\n\nBinding allows you to link properties and values in such a way that\
    \ a property is dynamically updated when a value changes. Rather than having to\
    \ write code that listens for change in a property, reacts to that change, writes\
    \ the value out to another property, and then redraws the application, you only\
    \ need to bind the property to the value and the rest is taken care of. You are\
    \ going to bind the text property of the Label on your Sample.fxml file to the\
    \ value of the TextField. By binding these controls, whatever type in the TextField\
    \ will dynamically be displayed in the Label. Let's take a look at how this kind\
    \ of binding is accomplished. The syntax used in binding is as follows:\n\n```\n\
    ${control.value}\n```\n\nThe $ (dollar sign) operator is used in binding for variable\
    \ resolution. The $ operator tells JavaFX that anything following it should be\
    \ considered a variable. To resolve controller property value, you must wrap the\
    \ controller name and the property in braces:\n\n```\n${...}\n```\n\n### CAUTION\n\
    \nThere are obviously times when you would want to use $ and not mean it to resolve\
    \ to a variable, such as when you want to write dollar amount. In these cases,\
    \ you need to escape the default functionality by placing the escape character\
    \ (\\) before the dollar sign ($). Take a look at your current controller code\
    \ in the Sample.fxml file in NetBeans:\n\n```xml\n<children>\n<Label GridPane.columnIndex=\"\
    1\" alignment=\"CENTER\"\nGridPane.hgrow=\"ALWAYS\" GridPane.rowIndex=\"2\" GridPane.alignment=\"\
    CENTER\"\nGridPane.vgrow=\"ALWAYS\" text=\"\" />\n<TextField prefWidth=\"200.0\"\
    \ GridPane.columnIndex=\"1\"\nGridPane.rowIndex=\"0\" />\n</children>\n```\n\n\
    ## Quick Start Guide to JavaFX\n\nThe first thing you want to do is assign an\
    \ ID to your TextField. Assigning an ID to your TextField will allow you to reference\
    \ it in the binding. Without an ID, JavaFX would not understand what control you\
    \ were trying to bind. Add the following property to your TextField:\n\n```xml\n\
    fx:id=\"textfield\"\n```\n\nWe chose a fairly simplistic ID here—just \"textfield.\"\
    \ Feel free to be as descriptive in your naming as you need. For example, if you\
    \ were building a larger application with multiple TextFields you would definitely\
    \ require an ID that is more descriptive. However, for this small sample application,\
    \ we are safe with \"textfield\". New code should appear as follows:\n\n```xml\n\
    <children>\n<Label GridPane.columnIndex=\"1\" alignment=\"CENTER\"\nGridPane.hgrow=\"\
    ALWAYS\" GridPane.rowIndex=\"2\" GridPane.valign=\"CENTER\"\nGridPane.vgrow=\"\
    ALWAYS\" text=\"\" />\n<TextField prefWidth=\"200.0\" GridPane.columnIndex=\"\
    1\" GridPane.rowIndex=\"0\"\nfx:id=\"textfield\" />\n</children>\n```\n\nWith\
    \ the ID of the TextField set, we can bind the text property of the Label to it.\
    \ Using the syntax discussed earlier, the binding should look like this:\n\n```\n\
    ${textfield.text}\n```\n\nAdd this binding to the text property of the Label,\
    \ as follows:\n\n```xml\n<children>\n<Label GridPane.columnIndex=\"1\" alignment=\"\
    CENTER\"\nGridPane.hgrow=\"ALWAYS\" GridPane.rowIndex=\"2\" GridPane.valign=\"\
    CENTER\"\nGridPane.vgrow=\"ALWAYS\" text=\"${textfield.text}\" />\n<TextField\
    \ prefWidth=\"200.0\" GridPane.columnIndex=\"1\" GridPane.rowIndex=\"0\"\nfx:id=\"\
    textfield\" />\n</children>\n```\n\nThat is all the code you need to bind these\
    \ controls. Compile and run your application. When the application executes, type\
    \ \"Hello World!\" in the TextField and you should see the results illustrated\
    \ in Figure 3-7.\n\nIn the next section, you will bind to the value that is in\
    \ your .java file.\n\n# Chapter 3: Hello World\n\n35\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_52_0.png)\n\
    \nFigure 3-7 A binding Hello World application\n\n## An Introduction to Methods\
    \ and Properties\n\nBefore you can bind to a value in the controller, you need\
    \ to understand two Java concepts: methods and properties. The combination of\
    \ these two concepts will allow you to bind a value from the controller to the\
    \ Label on the view. In this example, when you bind from the controller to the\
    \ view, you are going to bind to a method on the controller. The method, in turn,\
    \ will reference a property on the controller that produces the value that is\
    \ then sent to the view. It may sound complicated, but it is not that bad. The\
    \ next section contains a quick primer on methods.\n\n# Java Methods\n\nA method\
    \ in Java is a sequence of statements that can be invoked by referencing the method's\
    \ name. When a method is finished executing, it returns a value back to the code\
    \ that called it. The value that is returned from a method could be of a specific\
    \ data type, such as String, or it could be nothing. All methods also have what\
    \ is called a “signature.” The signature makes the method unique within the class\
    \ where it is declared. The signature consists of the method name, the type and\
    \ number of parameters passed to the method, and its return type. This complex\
    \ “signature” allows you to have multiple methods with the same name, but different\
    \ parameters, in the same class.\n\nThe syntax for declaring a method is as follows:\n\
    \n```\n<modifier>return type<method name>(<parameters>\n{\n  body\n}\n```\n"
