    \n```java\n/**\n * @param args the command line arguments\n */\npublic static\
    \ void main(String[] args) {\n    launch(args);\n}\n\n@Override\npublic void start(Stage\
    \ primaryStage) {\n    Image image = new Image(\"http://jfdimarzio.com/butterfly.png\"\
    );\n    ImageView imageView = new ImageView();\n\n    imageView.setImage(image);\n\
    \    applyEffects(imageView);\n\n    StackPane root = new StackPane();\n    root.getChildren().add(imageView);\n\
    \    primaryStage.setScene(new Scene(root, 800, 600));\n    primaryStage.show();\n\
    }\n\nprivate void applyEffects(ImageView imageView) {\n    Bloom bloom = new Bloom();\n\
    \    bloom.setThreshold(.5);\n    imageView.setEffect(bloom);\n}\n```\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_124_0.png)\n\
    \nFigure 8-2 Butterfly with the Bloom effect\n\nCompile your app and run it to\
    \ produce an image like 8-2. Next, you learn about ColorAdjust.\n\n## ColorAdjust\n\
    \nAs the name suggests, the ColorAdjust effect allows you to adjust the color\
    \ of your node. In the same way that you adjust the picture on your television,\
    \ JavaFX lets you adjust your images. ColorAdjust contains parameters that allow\
    \ you to adjust contrast, brightness, hue, and saturation.\n\nAll the parameters\
    \ for the ColorAdjust effect, with the exception of input, accept a double value.\
    \ You can assign a value between -1.0 and 1.0 to each of: contrast, brightness,\
    \ hue, and saturation. However, you do not necessarily need to assign a value\
    \ to all the parameters. For instance, if you just want to adjust the contrast\
    \ of image, you only have to specify a value for the contrast, and JavaFX will\
    \ automatically assign 0 to the others. (Note that JavaFX will not auto-assign\
    \ 0 to contrast because it has a default value of 1.)\n\n## Quick Start Guide\
    \ to JavaFX\n\nIn previous chapters, you used the LineBuilder and the RectangleBuilder.\
    \ In this example, you can use the ColorAdjustBuilder to clean up this code and\
    \ make your life a little easier.\n\nFor this example, you will assign .5 to each\
    \ parameter and then assign the effect to the butterfly. Add the following code\
    \ to applyEffects():\n\n```java\nColorAdjust colorAdjust = new ColorAdjust();\n\
    colorAdjust.setBrightness(.5);\ncolorAdjust.setContrast(.5);\ncolorAdjust.setHue(.5);\n\
    colorAdjust.setSaturation(.5);\n```\n\nThe structure of the ColorAdjust effect\
    \ should look familiar if you followed along with the previous example. Effects,\
    \ as a whole, are not very complicated to apply once you have done it a couple\
    \ times. Your complete applyEffects() method should look like this:\n\n```java\n\
    private void applyEffects(ImageView imageView)\n{\n    ColorAdjust colorAdjust\
    \ = new ColorAdjustBuilder.create().brightness(.5).contrast(.5)\n    .hue(.5).saturation(.5).build();\n\
    \n    imageView.setEffect(colorAdjust);\n}\n```\n\n## GaussianBlur\n\nGaussianBlur\
    \ provides a very smooth blurring effect to a node. Behind the scenes, the effect\
    \ works on something called the Gaussian algorithm. This algorithm works in a\
    \ circular pattern from each pixel to smooth the appearance. Because this algorithm\
    \ works in a circular pattern, the parameter you need to work with is the radius\
    \ parameter, which controls how far out from each pixel the Gaussian algorithm\
    \ is applied.\n"
