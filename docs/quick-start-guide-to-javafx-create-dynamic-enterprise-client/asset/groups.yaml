    ## Downloading and Installing the Required Software


    The easiest way to begin is to download and install the latest version of NetBeans.
    At the time this book was written, the latest version was NetBeans 7.1.2. This
    version can be downloaded bundled with the latest versions of Java, and thus,
    JavaFX. This provides for an easy way to get all of the required software installed
    in one action.


    ## NetBeans


    NetBeans is an open-source IDE that can be used for developing on many different
    platforms. NetBeans can be used for C/C++, Java, JavaScript, and PHP development,
    as well as JavaFX. When following the examples in this book, you will do all your
    JavaFX development within a NetBeans workspace.


    The first step is to download the latest version of NetBeans for JavaFX. The latest
    version of NetBeans can be downloaded from www.netbeans.org or from a bundle provided
    the JavaFX download page.


    ## CAUTION


    The latest version of NetBeans, at the time this book was written, was the NetBeans
    7.1.2 Beta for JavaFX. NetBeans can be downloaded for different languages, and
    for the purposes of this book, you need to download the version of NetBeans 7.1.2
    that is specifically for JavaFX. This will make more sense when you visit the
    NetBeans download page.


    Once you are at the NetBeans download page, the choice of available packages may
    seem daunting. Fear not, because there is only one flavor of NetBeans 7.1.2 you
    need to worry about. You want to download the NetBeans IDE for JavaFX (see Figure
    1-1).


    ## CAUTION


    The download from NetBeans labeled "All" is the version of NetBeans for all available
    technologies. All the examples in this book will still work if you happen to download
    this version, but you should try to stick with the NetBeans IDE for JavaFX.


    Simply follow the installation wizard and you should have no problem successfully
    preparing NetBeans for development. The installation wizard will recommend default
    locations for the installation of the NetBeans IDE and the Java JDK; just accept
    your locations, and the remainder of the installation will be a breeze.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_23_0.png)


    ## NOTE


    If Java has never been installed on your computer, you may need to manually install
    the latest JDK before installing NetBeans.


    When the NetBeans installation is complete, the NetBeans IDE will auto-start.
    If NetBeans does not restart, you may need to bring it up manually. The NetBeans
    IDE will open to the development start page (see Figure 1-2). The purpose of the
    NetBeans start page is to offer you tips and news about developing in NetBeans
    and JavaFX.


    At this point, NetBeans is configured and ready for use. The NetBeans installer
    will ask you to register NetBeans. This step is suggested but not required. Registering
    your product will give you access to news about upgrades and the NetBeans forums.


    ## Chapter 1: Introduction to JavaFX


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_24_0.png)


    Figure 1-2 The NetBeans default start page


    ## Ask the Expert


    Q: Do I have to use NetBeans for JavaFX development?


    A: No, JavaFX can be developed outside of NetBeans. All you really need to write
    in JavaFX is the Java JDK, and the JavaFX SDK. However, developing outside of
    NetBeans would require a fairly good knowledge of command-line compiling in Java.


    Q: Can any other IDEs be used for JavaFX development?


    A: Yes, you can also use Eclipse. Eclipse is another open-source IDE that would
    require the use of a plug-in to work with JavaFX. However, at the time this book
    was written, no plug-in was available for JavaFX 2 (and above) and Eclipse.


    ## Configure Your NetBeans


    A developer should be comfortable using their IDE. Try to customize the look and
    feel of your NetBeans IDE to make it a more comfortable place for you to work.
    When your IDE has a familiar look and feel, you will be much more apt to have
    creative development sessions.


    Open your NetBeans IDE and from the menu bar select Tools | Options. Explore the
    options provided to you. Experiment with these options by setting different ones
    and taking note of how they affect the IDE. Find the most comfortable options
    for you and your method of development.


    ## Chapter 1 Self Test


    - 1. What is the name of the open-source development environment you will use
    throughout this book?

    - 2. True or false? You should download the version of NetBeans for All Developers.

    - 3. True or false? The Java JDK will be installed for you automatically if needed
    (if you have the JRE installed).

    - 4. Which NetBeans settings can you accept the default values for during installation?

    - 5. What is the difference between the JavaFX SDK and the Java JDK?

    - 6. What is the purpose of the NetBeans start page?

    - 7. True or false? You must successfully register NetBeans before using it.

    - 8. At what website is NetBeans available?

    - 9. Name two other applications that closely resemble the functionality of JavaFX.

    - 10. True or false? JavaFX is developed in JavaFX Script.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_26_0.png)


    ## Chapter 2: Setting the Scene


    ## Key Skills & Concepts


    - Creating JavaFX project in NetBeans

    - What is a Stage?

    - What is a Scene?

    - Running application


    In this chapter you learn how to set up a new JavaFX project in NetBeans. This
    chapter walks you through, step by step, the process of creating your first project,
    discovering what a Stage and Scene are, and running the application.


    ## Creating a New JavaFX Project


    > NOTE

    If you have not already, open NetBeans. You will create a new JavaFX project.


    With your NetBeans IDE open, click File | New Project (or press CTRL+SHIFT+N),
    as shown in Figure 2-1.


    Selecting New Project will open the New Project Wizard. Notice that the New Project
    Wizard contains multiple categories. You need to select the JavaFX category and
    the JavaFX Application project type.


    The next step in the wizard is the Name and Location step. NetBeans is looking
    for a name for your project. Name your project JavaFXBeginners. This is a good,
    descriptive name that will make it easy to identify.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_28_0.png)


    Figure 2-1 Creating a new project


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_28_1.png)


    Figure 2-2 The New Project selection window


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_29_0.png)


    Figure 2-3 The Name and Location step


    You should accept all of the remaining default values in this wizard. NetBeans
    will automatically select the default version of JavaFX and the options needed
    to create your main project settings.


    Feel free to accept all of the defaults in this step. Your Name and Location step
    appear as shown in Figure 2-3.


    Click the Finish button to create your empty project. In the following section,
    you will add a package and files to your project.


    ## (Not-so) Empty JavaFX Project


    Once your new project is created, the New Project Wizard will return you to the
    NetBeans IDE, as on the left side of the screen are the Projects explorer frame.
    Your JavaFXBeginners project will be displayed in this frame.


    Click the plus sign next to the JavaFXBeginners folder. This will expose the Source
    Packages folder. The Source Packages folder will contain the packages for your
    project.


    A Java package is a full collection of classes (or in this case, JavaFX source
    files) that are all related. All the files in a package will be compiled together
    into a JAR (Java Archive) file and can be referenced in other projects. If you
    have worked with another platform such as Silverlight or .NET, you can think of
    a Java package as equivalent to a namespace.

