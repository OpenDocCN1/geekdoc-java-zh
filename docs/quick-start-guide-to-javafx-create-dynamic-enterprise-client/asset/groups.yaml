    \nFigure A-3 The dist folder\n\n## Self-Contained Application Packages\n\nThe\
    \ second method for deploying JavaFX applications is to create a self-contained\
    \ application package, which is an executable file (.exe in Windows) that contains\
    \ all the files needed to run your application on the target platform.\n\nThe\
    \ advantage to this method of deployment is that the resulting package is in a\
    \ familiar format to people who are used to executing Windows-based applications.\
    \ If you are planning to deploy your application in an environment that is predominantly\
    \ Windows application based, where users are going to be accustomed to installing\
    \ and using these kinds of executable packages, then this is the method to use.\n\
    \nLuckily, NetBeans makes creating a self-contained application package easy.\
    \ Within your NetBeans project directory you will find a build.xml file. Modify\
    \ the existing `<target name=\"post-jfx-deploy\">` tag of the build.xml for the\
    \ project you want to deploy, as follows:\n\n```xml\n<target name=\"post-jfx-deploy\"\
    >\n<fx:deploy width=\"${javafx.run.width}\" height=\"${javafx.run.height}\"\n\
    nativeBundles=\"all\" />\n```\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_235_0.png)\n\
    \nFigure A-4 A distributed app\n\n## Appendix A: Packaging and Deploying JavaFX\
    \ 219\n\n```xml\noutfile=\"${basedir}/${dist.dir}\"\n<fx:application name=\"${application.title}\"\
    \n      mainClass=\"${javafx.main.class}\"/>\n<fx:resources>\n<fx:fileset dir=\"\
    ${basedir}/${dist.dir}\"\n      includes=\"*.jar\"/>\n</fx:resources>\n<fx:info\
    \ title=\"${application.title}\"\n      vendor=\"${application.vendor}\"/>\n</fx:deploy>\n\
    </target>\n```\n\nThese instructions will produce a self-contained application\
    \ package in the form of an .exe file.\n\n## Web Start\n\nJavaFX includes the\
    \ option to deploy your applications as a Web Start, mainly to keep compatibility\
    \ with older platforms. Deploying your application as a Web Start is very easy\
    \ and can be accomplished by clicking one option.\n\nWithin NetBeans, right-click\
    \ on the project and go to the project properties. Under the Run option, click\
    \ the “Run: as Web Start” option. Now, when the application is deployed, the code\
