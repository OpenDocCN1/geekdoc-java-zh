    \ a difference between the CSS used in JavaFX and the CSS used on web pages?\n\
    \nA: Yes. JavaFX supports new JavaFX-specific elements. It is unclear how many,\
    \ if any, of the standard CSS elements JavaFX will support in the future.\n\n\
    # Chapter 13: Style Your JavaFX with CSS 183\n\nThe remainder of this chapter\
