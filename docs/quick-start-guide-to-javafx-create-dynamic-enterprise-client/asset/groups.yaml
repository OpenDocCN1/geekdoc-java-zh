    with multiple projects at the same time. If you have two projects open in the
    same IDE, you can easily work with them simultaneously without worrying about
    closing or opening them. This becomes a very handy tool the more you begin to
    work in NetBeans.


    The second area you will become very familiar with is by the end of this book
    is the Palette section. The Palette, pictured in Figure 2-7, is located on the
    right side of the NetBeans IDE, opposite the explorers.


