    \ and add them as children to your VBox:\n\n```\nHBox row1 = new HBox();\nHBox\
    \ row2 = new HBox();\n```\n\n```\nroot.getChildren().add(row1);\nroot.getChildren().add(row2);\n\
    ```\n\nThese HBox instances give you a place to put the nodes you want to stack.\
    \ Let's put one Text and one Button in each HBox:\n\n```\nText text1 = new Text();\n\
    Button btn1 = new Button();\nText text2 = new Text();\nButton btn2 = new Button();\n\
    ```\n\n```\ntext1.setText(\"Sample Text 1\");\nbtn1.setText(\"Button 1\");\ntext2.setText(\"\
    Sample Text 2\");\nbtn2.setText(\"Button 2\");\n```\n\n```\nVBox root = new VBox();\n\
    HBox row1 = new HBox();\nHBox row2 = new HBox();\n```\n\n```\nroot.getChildren().add(text1);\n\
    row1.getChildren().add(btn1);\nrow2.getChildren().add(text2);\nrow2.getChildren().add(btn2);\n\
    ```\n\n```\nroot.getChildren().add(row1);\nroot.getChildren().add(row2);\n```\n\
    \n## Quick Start Guide to JavaFX\n\nThat's really all you need to just nest two\
    \ different layouts within each other. The process is not limited to two layouts.\
    \ Multiple layouts can be nested within each other to produce a more varied layout\
