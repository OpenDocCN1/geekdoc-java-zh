    \ Example\");\nprimaryStage.setScene(new Scene(pane, 400, 200));\nprimaryStage.show();\n\
    \n```\n\nAdding Swing to your JavaFX applications is quite easy in JavaFX 8 and\
    \ gives you a much greater level of flexibility.\n\nOne of the most useful features\
    \ of the SwingNode is its ability to give you an easy upgrade path for existing\
    \ applications. If you have already invested a great amount of time in some existing\
    \ Swing apps, you can ease your upgrade cycle by incorporating those components\
    \ into new JavaFX apps as a transition.\n\n# Putting JavaFX in Swing Apps\n\n\
    JavaFX and Swing interoperability is not a one-way street. In fact, you can include\
    \ JavaFX content in your existing Swing apps. This is the perfect way to integrate\
    \ new content in existing apps and extend their life and usability.\n\nThe JFXPanel,\
    \ which inherits from JComponent, can be used to insert JavaFX content into your\
    \ Swing application:\n\n```\nfinal JFXPanel javafxPanel = new JFXPanel();\n```\n\
    \nIn the same way that the key to a SwingNode is the getContent() method, the\
    \ key to add JavaFX content to a JFXPanel is the setScene() method:\n\n```\nScene\
    \ myScene = createScene();\njavaFxPanel.setScene(myScene);\n```\n\nIn the preceding\
    \ snippet, myScene can be added just like any JavaFX scene. This allows your JavaFX\
    \ content to be integrated into your existing Swing apps."
