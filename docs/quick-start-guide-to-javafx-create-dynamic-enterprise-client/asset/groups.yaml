    \n# Chapter 11\n\nCustom Nodes and Subclassing\n\n## Key Skills & Concepts\n\n\
    - Subclassing Node\n- Creating a custom node\n- Overriding default Node methods\n\
    \nFX comes with many great tools. Throughout this book you have learned about\
    \ shapes, effects, and methods—to name a few. However, what if you find that the\
    \ nodes in JavaFX do not quite fit what you need? There is another way to get\
    \ what you need from JavaFX: You can always make a node that does exactly what\
    \ you need. This can be by subclassing an existing node or by creating an entirely\
    \ new one. In this chapter you learn about both methods for getting precisely\
    \ what you need out of JavaFX. First, let's discuss subclassing an existing node.\n\
    \n## Subclassing Node\n\nBefore you can learn about overriding methods from Node,\
    \ a critical question needs to be answered: What is overriding?\nClasses, such\
    \ as Node and Button, contain methods and properties. You as a developer can take\
    \ these methods and change their default actions to whatever you want. For example,\
    \ let's say you have a Dog class with a method called displayBreed(), as shown\
    \ here:\n\n```\npublic class Dog{\n    public void displayBreed() {\n        System.out.println(\"\
    Chihuahua\");\n    }\n}\n```\n\nYou can extend this class and override the displayBreed()\
    \ method to say something different, as follows:\n\n```\npublic class MyDog extends\
    \ Dog {\n@Override\npublic void displayBreed() {\n    System.out.println(\"Elkhound\"\
    );\n}\n}\npublic class YourDog extends Dog {\n}\n```\n\n# Chapter 11: ...Custom\
    \ Nodes and Subclassing\n\nIn this a call to Dog.displayBreed() would print the\
    \ line \"Chihuahua.\" A call to YourDog.displayBreed() would also print \"Chihuahua.\"\
    \ However, because MyDog overrides the displayBreed() method, a call to MyDog.getBreed()\
    \ would print \"Elkhound.\"\n\nUsing overriding, you can create nodes with new\
    \ or expanded functionality. In the following section you can create nodes with\
    \ new or expanded functionality.\n\nTo prepare for this exercise, create Chapter11:\n\
    \n```java\npackage chapter11;\n\nimport javafx.application.Application;\nimport\
    \ javafx.scene.Scene;\nimport javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\
    import javafx.scene.shape.Circle;\n\n/**\n * @author OCR Postprocessor\n */\n\
    public class Chapter11 extends Application {\n\n    public static void main(String[]\
    \ args) {\n        launch(args);\n    }\n\n    @Override\n    public void start(Stage\
    \ primaryStage) {\n        StackPane root = new StackPane();\n        primaryStage.setTitle(\"\
    Chapter 11 Test\");\n        primaryStage.setScene(new Scene(root, 300, 250));\n\
    \        primaryStage.show();\n    }\n}\n```\n\n## Creating a Node\n\nNow create\
    \ Chapter11: RoundButton interface:\n\n```java\npackage chapter11;\n\n/**\n *\
    \ @author OCR Postprocessor\n */\npublic interface RoundButton {\n    public final\
    \ int PLUS = 1;\n    public final int MINUS = 2;\n\n    void setType(int type);\n\
    }\n```\n\nThe first step is to make RoundButton a button. Like so:\n\n```java\n\
    package chapter11;\n\n/**\n * @author OCR Postprocessor\n */\npublic class RoundButton\
    \ extends javafx.scene.control.Button implements RoundButton {\n}\n```\n\n## NOTE\n\
    \nAt this point, assuming that you are using NetBeans, you may get a prompt from\
    \ the IDE that you need to add some methods from RoundButton. Let NetBeans implement\
    \ the setLayout() method for you; otherwise, you will need to implement it yourself.\n\
    \nIf you were to just stop here, you would have a fully functional button named\
    \ RoundButton. You would be able to use this button in your application as any\
    \ other button. But stopping here would not give you an actual round button. You\
    \ would just have a copy of Button.\n\nThis button works with so little code because\
    \ you are telling it to extend the functionality of Button into RoundButton. Therefore,\
    \ all the methods and properties of Button will now be a part of RoundButton.\
    \ In its current state, the round button looks and acts exactly like Button.\n\
    \nHowever, for this example you want to create a button that is round. Therefore,\
    \ you need to add code to the RoundButton class that will make the button round.\
    \ This is achieved by setting the clip property of Button in RoundButton to always\
    \ make the button.\n\nTo override the setLayout method, add the following code\
    \ to set the button's clip to a circle:\n\n```java\n@Override\n    public void\
    \ setLayout(int type) {\n        Circle roundButtonClip = new Circle();\n    \
    \    roundButtonClip.centerX(18);\n        roundButtonClip.centerY(12);\n    \
    \    roundButtonClip.setRadius(8);\n        this.setClip(roundButtonClip);\n \
    \   }\n```\n\nNext, add a quick if statement to determine whether the button is\
    \ of type 1 or 2. The purpose of this is to let the user choose whether the button\
    \ text should be + or -.\n"
