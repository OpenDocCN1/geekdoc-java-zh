    \ JavaFX 应用程序（就像你在之前的章节中所做的那样并删除 Chapter7.java 中所有的 Hello World 代码。\n\nImageView\
    \ 的类是 javafx.scene.image.ImageView。\n\n在使用 ImageView 之前你必须导入此包。实例化一个新的 ImageView\
    \ 并将其添加到 Scene 中，如下所示：\n\n```\npackage Chapter7;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.image.ImageView;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n```\n\n```java\n/**\n * @author J F DiMarzio\n*/\n\
    public class Chapter7 extends Application {\n  /**\n   * @paramargs 命令行参数\n  \
    \ */\n  public static void main(String[] args) {\n    launch(args);\n  }\n\n \
    \ @Override\n  public void start(Stage primaryStage) {\n    ImageView imageView\
    \ = new ImageView();\n\n    StackPane root = new StackPane();\n    root.getChildren().add(imageView);\n\
    \n    primaryStage.setScene(new Scene(root, 300, 250));\n    primaryStage.show();\n\
    \  }\n}\n```\n\n目前情况下，ImageView 什么都不会做。请记住，虽然 ImageView 本身是一个节点，但如果没有要显示的图像，它实际上并做不了什么。现在应用程序将编译并运行，但你将看到一个空白的\
    \ UI；你需要添加一张图像让 ImageView 显示。在下一节中，你将使用 Image 类来帮助 ImageView 在屏幕上显示某些内容。\n\n>\
    \ 提示\n> ImageView 具有影响图像显示方式的属性。然而，如果没有要显示的图像，讨论这些属性就没有意义。\n\n## Image 类\n\nImage\
    \ 类用于获取图像并使用 ImageView 显示它们。在开始之前，你必须导入此包：\n\n```java\nimport javafx.scene.image.Image;\n\
    ```\n\n## JavaFX 快速上手\n\nImage 类可以从各种源读取图像。在本节中，你将处理两个源：网络和本地文件。首先，要从网上显示图像，你使用构造函数：\n\
    \n```java\nImage butterfly = new Image(\"http://examplearzio.com/butterfly.png\"\
    );\n```\n\n创建 Image 对象后，你可以使用宽度和高度。你想设置宽度和比例来告诉 ImageView，如下：\n\n```java\n@Override\n\
    public void start(Stage primaryStage) {\n    Image butterfly = new Image(\"http://examplearzio.com/butterfly.png\"\
    );\n    ImageView imageView = new ImageView();\n\n    imageView.setImage(butterfly);\n\
    \    imageView.setFitWidth(300);\n    imageView.setPreserveRatio(true);\n\n  \
    \  StackPane root = new StackPane();\n    root.getChildren().add(imageView);\n\
    \n    primaryStage.setScene(new Scene(root, 300, 250));\n    primaryStage.show();\n\
    }\n```\n\n编译并运行此代码后，你的应用程序看起来应该像图 7-1 所示。JavaFX 在显示网站图像方面做得很好，涉及的设置非常直观。\n\n如果你想显示本地的图像，概念仍然相同，但过程略有不同。你需要提前考虑图像如何与应用程序一起分发。\n\
    \n## 第 7 章：使用图像 ...... 93\n\n![](img/f5bc6249660e63bd0b6a2dc95983edb7_110_0.png)\n\
