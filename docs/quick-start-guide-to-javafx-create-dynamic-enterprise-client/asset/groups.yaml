    # Chapter 2: Setting the Scene... 23


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_40_0.png)


    **Figure 2-8** Your first compiled JavaFX application


    ## Compiling Your JavaFX Application


    To compile your JavaFX application and run it, press the F6 key. You can also
    click the large green arrow in the NetBeans menu bar. Either of these methods
    will compile your script into an executable application.


    Your code will compile and run based on the selected Run Configuration, and the
    result will be displayed as a separate window.


    NOTE


    Currently, you only have one Run Configuration: <default>. As you progress through
    the book, you will create others.


    In this case, your first JavaFX application will create a very exciting window
    with a single button. Clicking the button will produce the message shown in Figure
    2-8.


    In the next chapter, you will create your own “Hello World” application.


    ## Chapter 2 Self Test


    - 1. What is the name of the frame where all your projects are listed?

    - 2. What is the name of the wizard used to create a new JavaFX project?

    - 3. What is another name for a namespace?

    - 4. Which panel of the NetBeans IDE lets you navigate through code samples?

    - 5. True or false? The Palette panel contains predefined pieces of reusable code.

    - 6. What file extension is assigned to JavaFX code files?

    - 7. What type of word is "package" in the Java language?

    - 8. What markup language is FXML based on?

    - 9. What are the beginning and ending characters for comments?

    - 10. True or false? You cannot use a code-behind file when using FXML.


    ## Chapter 3


    Hello World


    ## Key Skills & Concepts


    - Learning what is MVC

    - Using JavaFX Scene Builder

    - Binding values


    In this chapter you will start writing code in your JavaFX application. This is
    where all the prerequisite work from the previous two chapters begins to pay off.
    All of the time and effort you put into learning the basics in the first two chapters
    will help you master the Java, JavaFX, and FXML introduced in this chapter.


    The best part of learning a new language is getting to express your thoughts and
    visions in a new and exciting way. That is exactly what you will be doing in this
    chapter. You will learn how to start things you may (or may not) know how to do
    in other languages and bring them to life in JavaFX. But first, we need to discuss
    some key concepts.


    ## What Is MVC?


    Since version 2, JavaFX has followed the Model-View-Controller (MVC) design pattern,
    which was created to separate the UI of an application from the business logic.
    This allows user interfaces to be designed and built independently of the logic
    that will be used to control them. MVC is not unique to JavaFX or FXML. This design
    pattern has been around for many years and is used on almost all major frameworks.
    However, if you are not familiar with it, fear not you will pick up much of what
    you need to know as you work through the examples in this book.


    When you’re using FXML, the .fxml file represents the “view” of MVC. This means
    that the FXML file is the physical view of the data or logic that is being represented
    by the UI. You can design and create user interfaces in an FXML file without to
    know the underlying data of the related Java files. You will see this more in
    depth in this chapter when you are introduced to a new tool called JavaFX Scene
    Builder.


    The java file that is tightly coupled with the .fxml file is the “controller”
    of the MVC pattern. The controller takes data and information from the business
    logic and passes it to the view. In the default Hello World application that NetBeans
    created for you, the Sample.java file is the controller to the Sample.fxml view.


    Finally, any of the supporting Java files in your project that contain logic or
    data that is displayed in the view are the "models" in the MVC pattern. The model
    can be spread across any number of files in your project as long as they are all
    contained in the same namespace.


    In the next section of this chapter you will learn how to use the JavaFX Scene
    Builder to design and create an FXML view as referenced in the MVC pattern.


    ## Using JavaFX Scene Builder


    Oracle has made available a tool for graphically designing and developing the
    UI of your JavaFX application. JavaFX Scene Builder is designed to work directly
    with your FXML files and allows you to add, remove, and manipulate the elements
    in your FXML. In this section, you will use the JavaFX Scene Builder to modify
    the Sample.fxml file and create a new Hello World application.


    NOTE

    Download the JavaFX Scene Builder at http://www.oracle.com/technetwork/java/javafx/overview/index.html.


    After downloading and installing JavaFX Scene Builder, use it to open the Sample.fxml
    file in your JavaFXForBeginners project. You should see a screen like the one
    shown in Figure 3-1.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_44_0.png)


    Figure 3-1 Sample.fxml in the designer window


    ## Quick Start Guide to JavaFX


    Remember the sample Hello World application that NetBeans created for you in the
    last chapter? That Java application had a button in the center with the text "Click
    Me!" You can clearly see this in the JavaFX Scene Builder.


    ## Working with Containers


    On the left side of the Scene Builder are two views: Library and Hierarchy. Figure
    2 illustrates these views.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_45_0.png)


    Figure 3-2 Library and Hierarchy


    The view you want to focus on now is the Hierarchy view, which shows all the elements
    in the FXML file. Looking at the Sample.fxml, you should see an AnchorPane. Within
    the AnchorPane are a Button element and a Label element.


    Clicking each of these elements in the Hierarchy view will highlight the corresponding
    element in the designer. The Inspector view is illustrated in Figure 3-3.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_46_0.png)


    Figure 3-3 The Inspector view


    ## Working with Controls


    The Inspector view contains all the assignable properties of the highlighted element.
    Within the Inspector view you can set, review, and modify any property of any
    element. This makes JavaFX Scene Builder an invaluable tool when designing and
    creating JavaFX applications.


    For the purposes of the Hello World application you are creating in this chapter,
    you will need a clean canvas to start. Therefore, right-click the Button element
    and the Label element in the Hierarchy view and select Delete. This will remove
    these elements from Sample.fxml.


    While deleting the elements, you may receive an error like the one shown in Figure
    3-4.


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_47_0.png)


    Figure 3-4 A warning message


    If you get this error, click the Delete button and continue. This error is just
    telling you that the elements you are deleting have properties that might tie
    you to your code. We will address the code later in this section. However, if
    we did not address the code, your application would not compile or run correctly.


    Now you are going to add a new GridPane element to the Sample.fxml. A grid provides
    a good way to organize the elements on a page neatly. Click the GridPane 2x3 item
    in the Library view and drag it to the F designer. When you have lined up with
    the center of the AnchorPane, you will see horizontal and vertical snap lines,
    as shown in Figure 3-5. Drop the GridPane when it lines up with the center of
    the AnchorPane. With the GridPane anchored to your FXML, it is time to add some
    controls.


    The first control you are going to add to the GridPane is a Label. Click a Label
    control in the Library and drag it to the bottom-right cell of the GridPane. Once
    the Label is anchored to your grid, select it so that its properties are visible
    in the Inspector view. You need to set some properties before moving on.


    Currently, the Text property of the Label control is set to “Label.” This means
    that when the control is rendered, unless you change the text, the Label will
    read “Label.” Let’s change that by deleting the text in the Text property. Next,
    near the bottom of the Inspector view is a collapsed pane labeled Layout. Click
    the arrow next to Layout to expand it.

