  md: '# Rectangles


    TheFX Rectangle node is used to refer either a square or rectangle. It is used
    to draw any parallel-lined, four-sided shape. Given that the only difference between
    rectangles and squares is the length of a set of sides, it only makes sense that
    the same element can be used to draw either shape.


    In the previous section you learned that a Polyline refines this process by only
    requiring one point to be specified. When you create a rectangle, you only need
    to specify the point for the upper-left corner of the shape. This point, when
    combined with a defined width and height, will give you a finished shape.


    The code that is needed to create rectangles is contained within a package separate
    from the core JavaFX code. You will need to import the javafx.scene.shape.Rectangle
    class before you can create a rectangle. Therefore, insert the following import
    statements into your file:


    ```

    import javafx.scene.shape.Rectangle;

    ```


    You are going to draw a rectangle that starts at the point x10, y10. It will be
    100 pixels wide and 150 pixels high.


    # NOTE


    Do not get confused by the term *height*. The height of a rectangle is actually
    calculated from the start point, down (not the start point, up, as the name imply).
    Therefore, a rectangle that starts at the point 1,1 and has a height of 100 will
    extend 100 pixels down from the point 1,1.


    You will be specifying seven properties for the Rectangle element:


    +   - x x-coordinate for the upper-left corner of the rectangle

    - y y-coordinate for the upper-left corner of the rectangle

    - width The width of the rectangle

    - height The height of the rectangle

    - fill The color of the interior area of the rectangle

    - stroke The attributes of the lines used to draw the rectangle

    - strokeWidth The size of the line used to draw the rectangle'
