    \ Java Virtual Machine will begin execution. In this case, the JavaFXBeginners\
    \ class is being passed as the start of the JavaFX application. Why not just start\
    \ the JavaFX application automatically? The functionality being separated allows\
    \ you to run other Java methods or to trigger other JavaFX applications from the\
    \ same main().\n\nThe launch() method will now look at the JavaFXForBeginners\
