  md: "# Chapter 9: Basic Animation\n\n```\n@Override\npublic void start(Stage primaryStage)\
    \ {\n    StackPane root = new StackPane();\n    primaryStage.setScene(new Scene(root,\
    \ 600, 480));\n    primaryStage.show();\n}\n```\n\nThe first section of this chapter\
    \ covers Timelines.\n\n# Timelines\n\nAll animation, whether it is “traditional”\
    \ hand-drawn animation or computer-based animation, is controlled by timing. What\
    \ actions occur and when, the length of time it takes to walk from one side of\
    \ a room to another, and syncing the dialogue to a character's mouth movements\
    \ are all actions that are controlled by some sense of timing. The timing of the\
    \ animation dictates when each action begins, when it ends, and how long it lasts.\n\
    \nIn JavaFX, animation can be moving objects around the screen, but it can also\
    \ be something like a highlight being applied to a button on a mouse or the expansion\
    \ of a pane in menu.\n\nTiming is critical to smooth animation. If there is too\
    \ much time between each frame of animation, it will look slow and jerky to the\
    \ user. If there is too little time between each frame, the animation will be\
    \ too fast. This is why timing is critical.\n\nIn JavaFX, the timing of animation\
    \ is controlled by a Timeline. A Timeline takes a set of KeyFrames and KeyValues\
    \ to modify properties of your application over time. The class that defines JavaFX\
    \ Timeline is javafx.animation.Timeline.\n\nThe purpose of a Timeline is to break\
    \ down frames of animation into “stops,” by time. This means that if you tell\
    \ a Timeline you want an object to be one second from now, and then five seconds\
    \ from now, the Timeline takes on the responsibility of producing a smooth increment\
    \ of values that you can apply to your object. This might sound a bit confusing\
    \ now, but it will make a lot more sense when you see a Timeline in action.\n\n\
    A Timeline is broken down into a collection of keyframes. A keyframe is a point\
    \ at which you want one or more KeyValues to be set to defined values. The Timeline\
    \ then interpolates between the defined values automatically. For example, you\
    \ are going to make an animation of a ball moving from the top of the screen to\
    \ the bottom. Therefore, your keyframes will represent the start of your animation\
    \ at the top of the screen as well as the end of your animation at bottom of the\
    \ screen, as shown in Figures 9-1 and 9-2, respectively. The job of the Timeline\
    \ is to fill the space in between."
