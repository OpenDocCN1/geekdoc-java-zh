    # Transformations


    A transformation does not change the node way an effect does. Transformations
    are affine (meaning all straight lines are preserved) and can be applied to all
    nodes in a scene graph. Simple transformations can be used for translations, rotation,
    scaling, or shearing along an axis.


    The three different kinds of transformations are xy transformations, rotations,
    and transformations of perspective. (Strictly speaking, the perspective transform
    is actually an effect and is non-affine; however, it is covered here as a transformation
    along the z-axis.) These transformation types are next.'
