  md: "# Appendix A: Packaging and Deploying JavaFX 219\n\n```\noutfile=\"${basedir}/${dist.dir}\"\
    \n<fx:application name=\"${application.title}\"\n      mainClass=\"${javafx.main.class}\"\
    />\n<fx:resources>\n<fx:fileset dir=\"${basedir}/${dist.dir}\"\n      includes=\"\
    *.jar\"/>\n</fx:resources>\n<fx:info title=\"${application.title}\"\n      vendor=\"\
    ${application.vendor}\"/>\n</fx:deploy>\n</target>\n```\n\nThese instructions\
    \ will produce a self-contained application package in the form of an .exe file.\n\
    \n# Web Start\n\nJavaFX includes the option to deploy your applications as a Web\
    \ Start, mainly to keep compatibility with older platforms. Deploying your application\
    \ as a Web Start is very easy and can be accomplished by clicking one option.\n\
    \nWithin NetBeans, right-click on the project and go to the project properties.\
    \ Under the Run option, click the “Run: as Web Start” option. Now, when the application\
    \ is deployed, the code for running as a Web Start will be added to the <application\
    \ name>.html file in the dist folder."
