  md: '# Key Skills & Concepts


    +   - Installing JavaFX

    - Installing NetBeans

    - Using NetBeans


    Welcome to Quick Start Guide to JavaFX. I am sure you are anxious to begin your
    journey into the exciting world of JavaFX development, and this is the perfect
    place to start. Before you begin, you need to have a fully capable development
    environment. This chapter covers the basic knowledge needed to create and establish
    a JavaFX development environment that allows you to create excitedly rich interactive
    applications. It also answers many of the questions you may have about what JavaFX
    does, and how it does it.


    # What Is JavaFX?


    If you have ever played an Adobe Flash game or have seen an application in Microsoft
    Silverlight, you have a pretty good idea of products that are similar to JavaFX.
    I know, it''s not fair to compare JavaFX to these other environments, but if you
    have never seen JavaFX before, I have to compare it to something. Now that JavaFX
    is in its third exciting iteration, chances you have run into it somewhere.


    JavaFX delivers full-featured, interactive experiences to users in the same way
    as Flash or Silverlight. However, one of the differences between JavaFX and the
    others is that JavaFX is platform independent. Because JavaFX is now fully integrated
    with the Java Runtime, any device or system that Java can also serve up JavaFX
    experiences.


    NOTE


    Many changes have been made to the JavaFX platform between versions 1, 2, and
    now 3. If you have some experience with an older version of JavaFX, or possibly
    even with the first edition of this book, you should pay close attention because
    much of what you may have used before is very different now. Also, the third version
    of JavaFX is now officially known as JavaFX 8, because it is now part of Java
    8.


    # What Is Needed for JavaFX Development?


    Before you jump right into development, you should examine the list of requirements
    as outlined in this section. Think of them as the prerequisites for a successful
    and rewarding'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 1: Introduction to JavaFX


    learning process. You should have at least a basic knowledge of the following
    skills as well as access to the listed software.


    # Required Skills and Knowledge


    Prior development experience is not required to follow along with this book. Even
    if you''ve created a single application or developed a basic web page, you still
    have the skills to learn JavaFX. The examples and lessons in this book are specifically
    designed to teach you JavaFX development.


    That being said, any experience you have in Java development is going to help
    you grasp the concepts of JavaFX even faster. A basic knowledge of the functioning
    concepts, although not necessary, will help you get to speed even faster:


    +   **Java development** JavaFX and Java share more than their root names. If
    you have ever written a Java applet—and, more importantly, deployed a Java applet
    to a web page—you easily understand the deployment process for JavaFX. Previous
    versions of JavaFX used a proprietary language called JavaFX Script. This has
    been changed for a more unified, cross-platform Java experience. The JavaFX Script
    language was replaced with the Java API to facilitate a more unified and simplified
    programming experience.


    +   **Cascading Style Sheets (CSS)** The look and feel of a JavaFX app can be
    modified using Cascading Style Sheets, or CSS. Development platforms such as HTML
    can implement CSS as a way to embell the look of a user interface. JavaFX is no
    exception, and any experience you have with CSS will definitely be a plus.


    +   **NetBeans** Although JavaFX can be developed in almost any integrated development
    environment (IDE), or even in a simple text editor, the preferred method of development
    in this book is NetBeans. If you''ve never used NetBeans, before not—this book
    will walk you through everything you need to know.


    These skills are by no means required, and a lack in any of these areas will not
    affect your ability to learn JavaFX. Whether you are a seasoned professional developer
    or a novice who has yet to write your first application, you will be able to easily
    develop in JavaFX after reading this book. The next sections list the software
    you will be working with in this book to develop JavaFX.


    # Required Software


    This section serves as a brief introduction to the software you will be using
    throughout this book. A few different software elements are used in JavaFX development,
    and you'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Quick Start Guide to JavaFX


    will be very familiar with them by the end of this chapter. Don''t worry if you
    do not have any of these software elements yet or never even heard of one or two
    of them. By the end of this chapter you will have downloaded and installed all
    the software required to facilitate JavaFX development.


    +   - JavaFX SDK The JavaFX SDK (Software Development Kit) is the major package
    needed for JavaFX development. The JavaFX SDK contains all the items needed to
    develop JavaFX applications using JavaFX Script.

    - Java SE JDK The Java SE JDK (Standard Edition Java Development Kit) is required
    to compile your JavaFX Script into executable code. The JDK is the base for all
    Java development.

    - NetBeans NetBeans is the development environment you will use to create your
    JavaFX apps. Think of NetBeans as a specialized text editor that can use both
    the JavaFX SDK and the Java SE JDK to compile it into an executable app.


    The pieces of software listed here are free and can be easily downloaded. The
    next section of this chapter walks you through downloading and installing the
    required software.


    # Required Hardware


    This section quickly outlines some of the hardware requirements for running JavaFX.
    Keep in mind that JavaFX (and Java in general) run on a wide array of hardware
    and hardware configurations. However, there are some hardware suggestions for
    getting the most out of your JavaFX.


    In general, JavaFX will run on any hardware that is running a supported operating
    system. To enjoy the performance of the new hardware acceleration pipeline, you
    will need to follow these recommendations.


    | Graphics Card | GPU |

    |---||

    | NVIDIA | Mobile GPUs: GeForce 8M and 100M series or higher, NVS 2100M series
    or higher, and Mobility Quadro FX 300M series or higher

    Desktop GPUs: GeForce 8 and 100 series or higher

    Workstation GPUs: Quadro FX 300 series or higher |

    | ATI | Mobile GPUs: Mobility Radeon HD 3000, 4000, and 5000 series

    Desktop GPUs: Radeon HD 2400, 3000, 4000, 5000, and 6000 series |

    | Intel | Mobile GPUs: GMA 4500MHD and GMA HD

    Desktop GPUs: GMA 4500 and GMA HD |'
  merge: -1
