- img_proc: true
  md: "Much of this book was spent covering the basics of JavaFX development. You\
    \ have learned how to navigate JavaFX and create some compelling applications.\n\
    \nAdmittedly, you have only scratched the surface of what is available to you\
    \ in JavaFX, which is a very deep language with a lot to offer. No doubt, you\
    \ have some questions about some of the things you have learned. This is the second\
    \ of three appendices that attempt to fill in some of the holes that may have\
    \ been left in the lessons of this book. In this appendix we briefly cover the\
    \ basics of JavaFX and Swing compatibility.\n\n# JavaFX Swing Compatibility\n\n\
    JavaFX 8 has provided you with a new node type that is used for JavaFX-to-Swing\
    \ compatibility. The SwingNode takes an instance of a Swing component and then\
    \ writes the component to the screen using the setContent() method.\n\nBecause\
    \ SwingNode inherits from it, it can be used anywhere node can be used. In the\
    \ example that follows, a JLabel is placed in a JavaFX 8 app using a SwingNode.\
    \ Start with an empty app:\n\n```\npublic static void main(String[] args) {\n\
    \    launch(args);\n}\n\n@Override\npublic void start(Stage primaryStage) {\n\
    }\n\n```\n\nNow instantiate a SwingNode:\n\n```\npublic static void main(String[]\
    \ args) {\n    launch(args);\n}\n\n@Override\npublic void start(Stage primaryStage)\
    \ {\n    final SwingNode swingNode = new SwingNode();\n}\n\n```\n\nWith the SwingNode\
    \ instantiated, pass the setContent() method a new JLabel:\n\n```\npublic static\
    \ void main(String[] args) {\n    launch(args);\n}\n\n@Override\npublic void start(Stage\
    \ primaryStage) {\n    final SwingNode swingNode = new SwingNode();\n}\n\n```"
  merge: -1
  pgno: 239
- img_proc: true
  md: "# Appendix B: The Swing of Things ...... 223\n\n```\nswingNode.setTitle(new\
    \ JLabel(\"Swing Swing Swing\"));\n}\n```\n\nFinish up the app as follows, and\
    \ you will have a JavaFX application with a Swing Label:\n\n```\npublic static\
    \ void main(String[] args) {\n}\n\n@Override\npublic void start(Stage primaryStage)\
    \ {\n    final SwingNode swingNode = new SwingNode();\n    swingNode.setContent(new\
    \ JLabel(\"Swing Swing Swing\"));\n    StackPane pane = new StackPane();\n   \
    \ pane.getChildren().add(swingNode);\n```\n\n```\nprimaryStage.setTitle(\"SwingNode\
    \ Example\");\nprimaryStage.setScene(new Scene(pane, 400, 200));\nprimaryStage.show();\n\
    \n```\n\nAdding Swing to your JavaFX applications is quite easy in JavaFX 8 and\
    \ gives you a much greater level of flexibility.\n\nOne of the most useful features\
    \ of the SwingNode is its ability to give you an easy upgrade path for existing\
    \ applications. If you have already invested a great amount of time in some existing\
    \ Swing apps, you can ease your upgrade cycle by incorporating those components\
    \ into new JavaFX apps as a transition.\n\n# Putting JavaFX in Swing Apps\n\n\
    JavaFX and Swing interoperability is not a one-way street. In fact, you can include\
    \ JavaFX content in your existing Swing apps. This is the perfect way to integrate\
    \ new content in existing apps and extend their life and usability.\n\nThe JFXPanel,\
    \ which inherits from JComponent, can be used to insert JavaFX content into your\
    \ Swing application:\n\n```\nfinal JFXPanel javafxPanel = new JFXPanel();\n```\n\
    \nIn the same way that the key to a SwingNode is the getContent() method, the\
    \ key to add JavaFX content to a JFXPanel is the setScene() method:\n\n```\nScene\
    \ myScene = createScene();\njavaFxPanel.setScene(myScene);\n```\n\nIn the preceding\
    \ snippet, myScene can be added just like any JavaFX scene. This allows your JavaFX\
    \ content to be integrated into your existing Swing apps."
  merge: -1
