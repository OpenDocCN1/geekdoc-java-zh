  md: '# Key Skills & Concepts


    +   * Creating mixed colors

    * Applying colors to shapes

    * Using gradients


    In this chapter, you explore more deeply the powerful coloring and gradient tools
    available to you in JavaFX. In Chapter 5 you learned how to apply some basic,
    pre-created colors to shapes. In this chapter you learn how to mix your own colors,
    and you apply these colors to shapes and use them in gradients.


    # Using Color


    The class is a very powerful class. In the last chapter you used a very small
    part of the Color class to fill a Line node with a solid color. You used just
    one or two of the 148 predefined colors of the Color class. This is a small sample
    of what the Color class is capable of.


    The class can be used four different ways, each providing a capable method for
    creating the colors you need for any situation. You can invoke the Color class
    to use predefined colors, RGB values, HSB values, or web hex values.


    In this section you learn more about the predefined colors available to you as
    well as the other color methods.


    # Predefined Colors


    The Color class, as contained in the javafx.scene.paint.Color package, has a number
    of predefined colors you can use instantly at the attributes of your nodes. In
    the previous chapter you used a predefined color (Color.TOMATO) to fill a line.
    In fact, all shapes use the Color.BLACK predefined color as the fill. The Color
    class provides the following predefined colors:


    | ALICEBLUE | ANTIQUEWHITE | AQUA |

    | AQUAMARINE | AZURE | BEGE |

    | BISQUE | BLACK | BLANCHEDALMOND |

    | BLUE | BLUEVIOLET | BROWN |

    | BURLYWOOD | CADETBLUE | CHARTREUSE |'
