  md: '# About the Author


    J.F. DiMarzio is a seasoned developer. He began developing in BASIC on the TRS-80
    Color Computer II in 1984. Since then, DiMarzio has worked in the technology departments
    of companies such as the U.S. Department of Defense and the Walt Disney Company.
    He continues to strive to push the limits of technology and develop on new, emerging
    platforms.


    DiMarzio is also an accomplished author. Over the last 12 years he has released
    11 books, including the first edition of JavaFX: A Beginner''s Guide. His books
    have been translated into four different languages and published worldwide. DiMarzio''s
    writing style is very easy to read and understand, which makes the information
    in the topics he presents more retainable.


    # About the Technical Editor


    Simon Ritter is the manager of the Java Technology Evangelist team at Oracle Corporation.
    Simon has been in the IT business since 1984 and holds a Bachelor of Science degree
    in Physics from Brunel University in the U.K.


    Originally working in the area of UNIX development for AT&T UNIX System Labs and
    then Novell, Simon moved to Sun in 1996. At this time he started working with
    Java technology and has spent time working both in Java development and consultancy.
    Having moved to Oracle as part of the Sun acquisition, he now focuses on the core
    Java platform, for client applications, and embedded Java. He also continues to
    develop demonstrations that push the boundaries of Java for applications, such
    as gestural interfaces, embedded robot controllers, and in-car systems. Follow
    Simon on Twitter, @speakjava, and visit his blog at blogs.oracle.com/speakjava.'
