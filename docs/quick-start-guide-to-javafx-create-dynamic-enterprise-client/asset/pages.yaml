  md: '# Self-Contained Application Packages


    The second method for deploying JavaFX applications is to create a self-contained
    application package, which is an executable file (.exe in Windows) that contains
    all the files needed to run your application on the target platform.


    The advantage to this method of deployment is that the resulting package is in
    a familiar format to people who are used to executing Windows-based applications.
    If you are planning to deploy your application in an environment that is predominantly
    Windows application based, where users are going to be accustomed to installing
    and using these kinds of executable packages, then this is the method to use.


    Luckily, NetBeans makes creating a self-contained application package easy. Within
    your NetBeans project directory you will find a build.xml file. Modify the existing
    <target name="post-jfx-deploy"> tag of the build.xml for the project you want
    to deploy, as follows:


    ```

    <target name="post-jfx-deploy">

    <fx:deploy width="${javafx.run.width}" height="${javafx.run.height}"

    nativeBundles="all" />

    ```


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_235_0.png)


    Figure A-4 A distributed app'
  merge: -1
  pgno: 235
