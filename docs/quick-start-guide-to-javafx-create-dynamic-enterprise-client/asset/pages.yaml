    Once your image, group, and scene are created, you can begin to set up your Timeline.
    To use the Timeline, you will need to add one or more KeyFrames to it. Each KeyFrame
    has one or more KeyValues. The KeyValue specifies property of the ImageView (or
    any node) you want to modify, and the value you want to modify it to. In this
    example, you are going to modify the y-translation property of the image to 370.
    When the app starts, the image will be translated by 20 pixels on the y-axis;
    the Timeline will use the KeyFrame and its KeyValue to interpolate the y-translation
    between 0 and 370.


    Now you can create a KeyFrame that takes your KeyValue and applies a specific
    amount of time to it. For this example, you position the KeyFrame 2 seconds after
    the Timeline starts. Finally, add the KeyFrame to the Timeline. The Timeline will
    do the rest for you. Here is the code:


