    Drawing separate lines for every shape and configuration you can think of is not
    a very economic use of your time as a developer. Imagine what it would be like
    if you had to draw every line, one at a time, to form simple shapes. Luckily there
    is another type of line you can use called a polyline. It lets you specify more
    than one set of points in one line, the last of which are the end points. Specifying
    more than one end point lets you draw more complex lines with less code. Let''s
    try to draw the same U-shaped, three-line configuration using a Polyline node.


    The first step using a Polyline node is to import the Polyline package. The code
    for using polylines is different from the code for lines. For this reason, you
    need to import a separate class to work with polylines:


    ```

    import javafx.scene.shape.Polyline;

    ```'
