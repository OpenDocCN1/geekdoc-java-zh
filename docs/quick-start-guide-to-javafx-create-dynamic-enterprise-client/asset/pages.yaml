  md: '# 34 Quick Start Guide to JavaFX


    The first thing you want to do is assign an ID to your TextField. Assigning an
    ID to your TextField will allow you to reference it in the binding. Without an
    ID, JavaFX would not understand what control you were trying to bind. Add the
    following property to your TextField:


    ```

    fx:id="textfield"

    ```


    We chose a fairly simplistic ID here—just "textfield." Feel free to be as descriptive
    in your naming as you need. For example, if you were building a larger application
    with multiple TextFields, you would definitely require an ID that is more descriptive.
    However, for this small sample application, we are safe with "textfield".

    New code should appear as follows:


    ```

    <children>

    <Label GridPane.columnIndex="1" GridPane.alignment=CENTER

    GridPane.rowgrow="ALWAYS" GridPane.rowIndex="2" GridPane.valign=CENTER

    GridPane.vgrow="ALWAYS" text=" />

    <TextField prefWidth="200.0" GridPane.columnIndex="1" GridPane.rowIndex="0"

    fx:id="textfield" />

    </children>

    ```


    With the ID of the TextField set, we can bind the text property of the Label to
    it. Using the syntax discussed earlier, the binding should look like this:


    ```

    ${textfield.text}

    ```


    Add this binding to the text property of the Label, as follows:


    ```

    <children>

    <Label GridPane.columnIndex="1" GridPane.alignment=CENTER

    GridPane.rowgrow="ALWAYS" GridPane.rowIndex="2" GridPane.valign=CENTER

    GridPane.vgrow="ALWAYS" text="${textfield.text}" />

    <TextField prefWidth="200.0" GridPane.columnIndex="1" GridPane.rowIndex="0"

    fx:id="textfield" />

    </children>

    ```


    That is all the code you need to bind these controls. Compile and run your application.
    When the application executes, type "Hello World!" in the TextField and you should
    see the results illustrated in Figure 3-7.


    In the next section, you will bind to the value that is in your .java file.'
