  md: '# Key Skills & Concepts


    +   - Learning what is MVC

    - Using JavaFX Scene Builder

    - Binding values


    In this chapter you will start writing code in your JavaFX application. This is
    where all the prerequisite work from the previous two chapters begins to pay off.
    All of the time and effort you put into learning the basics in the first two chapters
    will help you master the Java, JavaFX, and FXML introduced in this chapter.


    The best part of learning a new language is getting to express your thoughts and
    visions in a new and exciting way. That is exactly what you will be doing in this
    chapter. You will learn how to start things you may (or may not) know how to do
    in other languages and bring them to life in JavaFX. But first, we need to discuss
    some key concepts.


    # What Is MVC?


    Since version 2, JavaFX has followed the Model-View-Controller (MVC) design pattern,
    which was created to separate the UI of an application from the business logic.
    This allows user interfaces to be designed and built independently of the logic
    that will be used to control them. MVC is not unique to JavaFX or FXML. This design
    pattern has been around for many years and is used on almost all major frameworks.
    However, if you are not familiar with it, fear not you will pick up much of what
    you need to know as you work through the examples in this book.


    When you’re using FXML, the .fxml file represents the “view” of MVC. This means
    that the FXML file is the physical view of the data or logic that is being represented
    by the UI. You can design and create user interfaces in an FXML file without the
    to know the underlying data of the related Java files. You will see this more
    in depth in this chapter when you are introduced to a new tool called JavaFX Scene
    Builder.


    The java file that is tightly coupled with the .fxml file is the “controller”
    of the MVC pattern. The controller takes data and information from the business
    logic and passes it to the view. In the default Hello World application that NetBeans
    created for you, the Sample.java file is the controller to the Sample.fxml view.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Finally, any of the supporting Java files in your project that contain logic
    or data that is displayed in the view are the "models" in the MVC pattern. The
    model can be spread across any number of files in your project as long as they
    are all contained in the same namespace.


    In the next section of this chapter you will learn how to use the JavaFX Scene
    Builder to design and create an FXML view as referenced in the MVC pattern.


    # Using JavaFX Scene Builder


    Oracle has made available a tool for graphically designing and developing the
    UI of your JavaFX application. JavaFX Scene Builder is designed to work directly
    with your FXML files and allows you to add, remove, and manipulate the elements
    in your FXML. In this section, you will use the JavaFX Scene Builder to modify
    the Sample.fxml file and create a new Hello World application.


    NOTE

    Download the JavaFX Scene Builder at http://www.oracle.com/technetwork/java/javafx/overview/index.html.


    After downloading and installing JavaFX Scene Builder, use it to open the Sample.fxml
    file in your JavaFXForBeginners project. You should see a screen like the one
    shown in Figure 3-1.


