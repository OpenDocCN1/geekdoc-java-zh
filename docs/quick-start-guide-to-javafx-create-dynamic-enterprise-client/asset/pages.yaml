  md: "# Get started with JavaFX\n\nDevelop and deploy interactive client applications\
    \ in no time with help from this practical tutorial from Oracle Press. With a\
    \ focus on working in NetBeans IDE, Quick Start Guide to JavaFX explains how to\
    \ use JavaFX layouts, draw shapes, using coloring and gradient tools, load images,\
    \ apply effects and transformations, include animation, and embed media. You'll\
    \ also get details on using JavaFX events, subclassing existing nodes, creating\
    \ custom nodes, working with WebView, and styling your applications with CSS.\
    \ Designed for easy learning, the book features:\n\n+   - Key Skills & Concepts—Chapter\
    \ opening lists of specific skills covered in the chapter\n- Ask the Expert—Q&A\
    \ sections filled with bonus information and helpful tips\n- Try This—Hands-on\
    \ exercises that show you how to apply your skills\n-Notes—Extra information related\
    \ to the topic being covered\n- Tips—Helpful reminders or alternate ways of doing\
    \ things\n- Cautions—Errors and pitfalls to avoid\n- Annotated Syntax—Example\
    \ code with commentary that describes the programming techniques being illustrated\n\
    - Self-tests—Chapter-ending quizzes to reinforce your skills\n\nCode examples\
    \ in the book are available for download at www.OraclePressBooks.com.\n\nFor a\
    \ complete list of Oracle Press titles, visit www.OraclePressBooks.com.\n\n# Learn\
