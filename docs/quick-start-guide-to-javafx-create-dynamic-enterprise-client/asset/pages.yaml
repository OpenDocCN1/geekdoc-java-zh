  md: '# Introduction


    # Why This Book?


    Welcome to Quick Start Guide to JavaFX. This book has been designed to give you
    the best first step into the exciting new frontier of JavaFX 8 development. JavaFX
    is a rich environment tool, and learning JavaFX is a must for anyone who wants
    to create immersive, interactive environments for users of any background.


    If you are familiar with previous versions of JavaFX, this book is a must. The
    platform has undergone major changes with the release of Java 8. Quick Start Guide
    to JavaFX covers the changes to JavaFX and prepares you for real-world development
    situations on this incredible platform.


    This book takes through JavaFX 8 in a logical manner. It begins by explaining
    the technology behind JavaFX. You will quickly move into installing the JavaFX
    development environment and tools. Although multiple development environments
    are available for JavaFX, the focus of this book is teaching you the basics of
    NetBeans. Net offers a rich, full-featured product that is easy to learn and will
    get you up and running in JavaFX in no time. By the end of the book, you will
    learn expertly into more complex examples to test your growing knowledge of developing
    rich JavaFX applications.


    Some chapters also include a “Try This” section to help you practice what you
    have learned. The “Try This” sections are structured like a textbook that you
    will be presented with tasks to complete on your own. In addition, each chapter
    has a “Self Test” section that provides quiz-style questions to further enhance
    your learning experience. Taking full advantage of the chapter questions and “Try
    This” exercises will give you a chance to refine your newly acquired skills and
    create your own applications.'
  merge: -1
  pgno: 16
