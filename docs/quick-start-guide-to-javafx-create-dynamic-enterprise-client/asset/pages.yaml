  md: "# Chapter 12: Working with WebView\n\nWithin the test, use the executeScript()\
    \ method of the WebEngine to call the displayJavaFX() function:\n\n```\nwebEngine.getLoadWorker().stateProperty().addListener(\n\
    \    new ChangeListener<State>() {\n    @Override\n    public void changed(ObservableValue<?\
    \ extends State> ov,\n        State oldState, State newState) {\n        if (newState\
    \ == State.SUCCEEDED) {\n            webEngine.executeScript(\"displayJavaFX()\"\
    );\n        }\n    }\nn);\n```\n\nThe full code of the HTMLLoader should appear\
    \ as follows:\n\n```\npublic class HTMLLoader extends Region {\n    final WebView\
    \ browser = new WebView();\n    final WebEngine webEngine = browser.getEngine();\n\
    \n    public HTMLLoader() {\n        webEngine.load(\"http://jfdimarzio.com/test.html\"\
    );\n\n        webEngine.getLoadWorker().stateProperty().addListener(\n       \
    \     new ChangeListener<State>() {\n                @Override\n             \
    \   public void changed(ObservableValue<? extends State> ov,\n               \
    \     State oldState, State newState) {\n                    if (newState == State.SUCCEEDED)\
    \ {\n                        webEngine.executeScript(\"displayJavaFX()\");\n \
    \                   }\n                }\n            }\n        );\n    }\nn\n\
    ```\n\nCompile and run the code. The page should load and the script execute as\
    \ shown in Figure 12-4.\n\nEarlier in this section I stated that the WebEngine\
    \ not only allow for JavaFX-to-JavaScript communications but also can facilitate\
