  md: "# Key Skills & Concepts\n\n+   - Subclassing Node\n- Creating a custom node\n\
    - Overriding default Node methods\n\nFX comes with many great tools. Throughout\
    \ this book you have learned about shapes, effects, and methods—to name a few.\
    \ However, what if you find that the nodes in JavaFX do not quite fit what you\
    \ need? There is another way to get what you need from JavaFX: You can always\
    \ make a node that does exactly what you need. This can be by subclassing an existing\
    \ node or by creating an entirely new one. In this chapter you learn about both\
    \ methods for getting precisely what you need out of JavaFX. First, let's discuss\
    \ subclassing an existing node.\n\n# Subclassing Node\n\nBefore you can learn\
    \ about overriding methods from Node, a critical question needs to be answered:\
    \ What is overriding?\nClasses, such as Node and Button, contain methods and properties.\
    \ You as a developer can take these methods and change their default actions to\
    \ whatever you want. For example, let's say you have a Dog class with a method\
    \ called displayBreed(), as shown here:\n\n```\npublic class Dog{\n    public\
    \ void displayBreed() {\n        System.out.println(\"Chihuahua\");\n    }\n}\n\
    ```\n\nYou can extend this class and override the displayBreed() method to say\
    \ something different, as follows:\n\n```\npublic class MyDog extends Dog {\n\
    @Override\npublic void displayBreed() {\n    System.out.println(\"Elkhound\");\n\
    }\n}\npublic class YourDog extends Dog {\n}\n```"
