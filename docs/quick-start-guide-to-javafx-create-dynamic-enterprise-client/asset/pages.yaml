    # Color.web


    Finally, the Color class can also use a web hex value to create a color for You.

    the web method of the Color class accepts a standard hex value. Here''s an example:


    ```

    Rectangle rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.web("#FF0FF"));

    ```


    # The alpha Attribute


    One last attribute of the Color class you should take note of is the alpha attribute.
    Every

    method of the Color class has an optional alpha attribute. The alpha value controls
    the opacity

    of the color being created. The alpha is a value between 0 and 1, where 0 is transparent
    and 1nis opaque. The alpha value can be added to any of the methods of the Color
    class.

    By setting the alpha value to 0, you will achieve full transparency:


    ```

    Rectangle rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.web("#FF0FF",0));

    ```


    In contrast to the full transparency of 0, you can set the alpha value to 1 for
    a fully

    opaque color:


    ```

    Rectangle rectangle = new Rectangle();

    ```


    ```

    rectangle.setX(10);

    rectangle.setY(10);

    ```'
