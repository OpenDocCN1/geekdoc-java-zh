  md: '# 138 Quick Start Guide to JavaFX


    The next two elements draw arcs. The first ArcTo element draws an arc from the
    last position of the point (in this case, x150, y150, to the MoveTo element).
    The second ArcTo draws another arc from the end point of the last arc.


    The JavaFX animation package can now take this Path node and use it to animate
    your ball using a PathTransition:


    ```

    pathTransition.pathTransition = PathTransitionBuilder().create();


    pathTransition.duration(Duration.seconds(5))


    pathTransition.node(group)

    pathTransition.path(path) pathTransition.orientation(OrientationType.ORTHOGONAL_TO_TANGENT)

    pathTransition.build();

    ```


    ```

    pathTransition.play();

    ```


    To create your animation, you use a PathTransition class, which takes in a few
    familiar parameters. Like Timeline, PathTransition can accept parameters for AutoReverse,
    CycleCount, and an interpolator—if you choose to use them. However, it is the
    node, path, duration, and orientation that you want to focus on for this animation.


    The node is the object you animated. In this case, the ball image group. The ball
    is assigned to the node in the PathTransition class. The node will be animated
