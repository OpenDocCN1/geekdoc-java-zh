  md: '# Chapter 5: ...Creating Shapes 75


    # Try This Create Multiple Shapes


    Take some time before the next chapter to exercise your new shape-building skills.
    Although it may seem like a fairly elementary task, you will have a great need
    to create simple shapes throughout your development career. From designing new
    buttons, to creating masks, you will always need to create simple shapes.


    Try adding multiple shapes to the same Scene. Play with the dimensions and positions
    of the shapes to keep them from overlapping. Continue to work with them to manipulate
    how the shapes can touch or cover each other.


    This exercise will be useful in future development by giving you a full grasp
    of how elements are placed in a Scene.


    In this chapter, you learned how to create some basic shapes using the Java Scene
    Builder. You created lines, polylines, rectangles, arcs, circles, and ellipses.
    You also learned about an invaluable tool: the context menu. These skills will
    help you tremendously throughout the remainder of this book.


    In the next chapter, you will learn how to work with and create more colors than
    was touched on in this chapter. You will also learn how to apply effects such
    as opacity and rotation.


