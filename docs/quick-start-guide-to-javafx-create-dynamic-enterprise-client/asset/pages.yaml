  md: "# Chapter 14: Embedded Media\n\nLet's look at getCurrentTime() first. Within\
    \ the MediaPlayer is a method, getCurrentTime(), that returns a Duration value.\
    \ In the new getCurrentTime() method that you just created for MyMediaPlayer,\
    \ simply return the value of the MediaPlayer's getCurrentTime() converted to milliseconds\n\
    \n```\n@Override\npublic double getCurrentTime() {\n    return _player.getCurrentTime().millis();\n\
    }\n```\n\nThe toMillis() method of Duration translates the duration into milliseconds.\
    \ Milliseconds are much easier to work with and are much more flexible than a\
    \ Duration object.\n\nNext, you can use the Media file itself to find its total\
    \ running time. In the getTotalRunningTime() method, return the value of getDuration()\
    \ from the Media file, converted to milliseconds once again:\n\n```\n@Override\n\
    public double getTotalRunTime() {\n    return _media.getDuration().millis();\n\
    }\n```\n\nFinally, finish out the modification to MyMediaPlayer by adding some\
    \ code to the setCurrentTime() method. The MediaPlayer has a method in it named\
    \ seek(). This method lets you set the time in the video that you want the player\
    \ to jump. The seek() method accepts a Duration, so you will need to convert the\
    \ double value you send into a Duration before you can pass it to seek().\n\n\
    ```\n@Override\npublic void setCurrentTime(double time) {\n    Duration seek =\
    \ new Duration(time);\n    _player.seek(seek);\n}\n```\n\nSave your modified MyMediaPlayer\
    \ and modify Chapter 14.java to use this new functionality.\n\nThe control you\
    \ will be using as your progress indicator is a Slider. The position of the Slider's\
    \ toggle is controlled by a value property that does not Durations. Therefore,\
    \ it would be much easier for you if you could convert the MediaPlayer's currentTime\
    \ into a double; hence the extra work in the MyMediaPlayer.\n\nFirst, create a\
    \ new Slider in your Chapter 14.java:\n\n```\nfinal Slider progressBar = new Slider();\n\
    ```"
