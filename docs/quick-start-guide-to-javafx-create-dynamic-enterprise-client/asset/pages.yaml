    Note that the code is using a StackPane as the root in the scene graph. A StackPane
    arranges its child nodes so that they are “stacked” on top of each other visually.
    This is done by changing the z-order of each child so that the nodes that are
    “lower” on the stack have a lower z-order.


    Compile and run this app. You can see that if you modify the layout of the nodes,
    they will simply appear jumbled together, as shown in Figure 4-1.


    The layout of these nodes is very discordant and does not lend itself to a very
    usable design. Let''s use the HBox layout to organize these nodes on the screen.
    The HBox belongs to the javafx.scene.layout package. You must import this class
    before you add the HBox to your Scene:


