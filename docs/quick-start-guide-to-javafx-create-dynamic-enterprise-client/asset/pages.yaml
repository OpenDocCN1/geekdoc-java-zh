  md: "# 84 Quick Start Guide to JavaFX\n\nThe sixth parameter is the CycleMethod,\
    \ which dictates how the gradient is filled in and repeated. If this value is\
    \ set to NO_CYCLE, the gradient is filled in using the selected terminal colors.\
    \ If CycleMethod is set to REFLECT, a mirror effect is used when filling the gradient—from\
    \ one color to the second and then back again. Finally, if CycleMethod is set\
    \ to REPEAT, the gradient repeats itself.\n\nThe final parameter is the stops\
    \ parameter, which holds an array of colors that will be used in the gradient.\
    \ This is a very versatile aspect of JavaFX: Gradients can be made with two or\
    \ more colors. Each color you add to the gradient is composed of a Color class\
    \ and an offset attribute. The offset is a number between 0 and 1 that determines\
