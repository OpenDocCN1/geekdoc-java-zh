  md: '# Key Skills & Concepts


    +   - Drawing lines to the screen

    - Working with the context menu

    - Creating complex shapes


    In this chapter, you learn how to draw shapes to the screen. Shapes add interest
    and dimension to your applications. You will start by learning how to draw a basic
    line. From there, you will move on rectilinear shapes. From these basic rectilinear
    shapes, you will move on polygons and curvilinear shapes.


    > NOTE

    If you are interested in game development or other animation-based media, polygons
    are very important. Polygons create the base of most 3-D objects.


    Before you start drawing shapes, you need to take a second and learn about the
    JavaFX scene graph and exactly what it does for your applications.


    # JavaFX Scene Graph


    The JavaFX scene graph API controls how and when objects are drawn to the screen
    in your application. From the past—and even with some frameworks today—you had
    to be acutely aware of what needed to be drawn to the screen and when. You would
    need to invalidate and redraw the parts of the screen that have changed. JavaFX
    takes care of this.


    The JavaFX scene graph is a specialized API that holds and tracks a model of the
    objects you place on your GUI. Let''s say you want to draw a square to the scene;
    the scene graph will hold square and all the information about its surrounding
    objects, drawing and redrawing them as needed. How does the scene graph do this?


    The scene graph is a tree-style container that contains nodes. There are three
    kinds of nodes within the scene graph. The base node of the scene graph—the node
    that will hold all of the other nodes—is a root node. Roots have no parent nodes
    and can contain children. There are also branch nodes and leaf nodes. Branch nodes
    can also contain other child node types. Leaf nodes, however, can hold no nodes.
    A square, a Text, and a Button are all leaf nodes. They can be placed on the root
    or a branch, but can contain no'
