    Figure 3-4 A warning message


    The Inspector view contains all the assignable properties of the highlighted element.
    Within the Inspector view you can set, review, and modify any property of any
    element in your FXML file. This makes JavaFX Scene Builder an invaluable tool
    when designing and creating JavaFX applications.


    For the purposes of the Hello World application you are creating in this chapter,
    you will need a clean canvas to start. Therefore, right-click the Button element
    and the Label element in the Hierarchy view and select Delete. This will remove
    these elements from Sample.fxml.


    While deleting the elements, you may receive an error like the one shown in Figure
    3-4. If you get this error, click the Delete button and continue. This error is
    just telling you that the elements you are deleting have properties that might
    tie you to your code. We will address the code later in this section. However,
    if we did not address the code, your application would not compile or run correctly.


    Now you are going to add a new GridPane element to the Sample.fxml. A grid provides
    a good way to organize the elements on a page neatly. Click the GridPane 2x3 item
    in the Library view and drag it to the FXML designer. When you have lined up with
    the center of the AnchorPane, you will see horizontal and vertical snap lines,
    as shown in Figure 3-5. Drop the GridPane when it lines up with the center of
    the AnchorPane. With the GridPane anchored to your FXML, it is time to add some
    controls.


    # Working with Controls


    The first control you are going to add to the GridPane is a Label. Click a Label
    control in the Library and drag it to the bottom-right cell of the GridPane. Once
    the Label is anchored to your grid, select it so that its properties are visible
    in the Inspector view. You need to set some properties before moving on.


    Currently, the Text property of the Label control is set to “Label.” This means
    that when the control is rendered, unless you change the text, the Label will
    read “Label.” Let’s change that by deleting the text in the Text property. Next,
    near the bottom of the Inspector view is a collapsed pane labeled Layout. Click
    the arrow next to Layout to expand it.'
