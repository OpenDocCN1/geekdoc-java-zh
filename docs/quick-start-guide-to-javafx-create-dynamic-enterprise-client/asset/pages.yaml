  md: '# Chapter 5: Creating Shapes


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_80_0.png)


    With the package imported, instantiate a new Polyline. Bring up the context menu
    to view the available methods.


    Notice that there are no methods for setStartX and setStartY. Rather, a Polyline
    accepts an array of points. The getPoints() method returns an ObservableList of
    all the points that make up your Polyline. One of the methods of the ObservableList
    is add(). Therefore, you can use the add() method of getPoints() to add a new
    array of points.


    When you''re passing an array of points to a Polyline node, it is understood that
    the first two values will be the x- and y-coordinates of the start point, and
    the last two will be the end point. The Polyline class will instinctively draw
    your line between these points, stopping at all other points in your array. You
    can easily replicate the “U” formation of lines you created with Line using an
    array of points in Polyline.


    An array of points that will match the points used in the Line example should
    look like this:


    ```

    new Double[] {10.0, 10.0,

    10.0, 100.0,

    100.0, 100.0,

    100.0, 10.0}

    ```


    Note that each value in the array is separated by a comma.


    # TIP


    To keep the array visually easy to understand, you can separate each x,y pair
    onto a new line. Whitespace within an array will be ignored by the compiler and
    can be added to make your array easy to read.'
