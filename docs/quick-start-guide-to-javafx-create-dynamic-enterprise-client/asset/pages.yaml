  md: "# Key Skills & Concepts\n\n+   * Using Timelines\n* Creating paths\n* Using\
    \ KeyFrames and KeyValues\n\nThis chapter introduces you to the world of basic\
    \ JavaFX animation. Whether you want to create animated text and fly-ins or gain\
    \ knowledge for creating games, basic animation is the place to begin.\n\nYou\
    \ will need to master three basic topics when tackling basic JavaFX animation:\n\
    \n+   * Timelines\n* KeyFrames and KeyValues\n* Paths\n\nTo begin this chapter,\
    \ open NetBeans chapters and create a new, empty JavaFX application named Chapter9.\
    \ Based on previous chapters, after you remove the Hello World code, the contents\
    \ of the Chapter9.java file should look as follows:\n\n```\npackage Chapter9;\n\
    \nimport javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.scene.stage.Stage;\n\n/**\n * @author J F DiMarzio\n */\npublic\
    \ class Chapter9 extends Application {\n\n    /**\n * @param args the command\
    \ line arguments\n */\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n```"
