  md: "# Key Skills & Concepts\n\n+   - Arranging nodes in a Scene\n- Using the HBox\n\
    - Nested layouts\n\nThroughout this book, you have learned how to create and use\
    \ nodes. At its core, JavaFX would not be very interesting without the ability\
    \ to place these nodes on the screen. Nodes need to be placed logically on the\
    \ screen for any user interface (UI) to be intuitive and usable.\n\nTo this point\
    \ in the book, you have manually placed nodes within the context of a Scene. Then,\
    \ using the x and y coordinates of the desired position, you have moved the nodes\
    \ to put them in a logical place. However, manually moving nodes around the screen\
    \ can be a tedious task and ultimately takes away the time needed to develop functionality.\n\
    \nJavaFX provides a handful of useful tools to help you organize the placement\
    \ of nodes on the screen. Layouts can automatically organize your nodes into predefined\
    \ patterns that will give your applications a professional look and a higher degree\
    \ of usability.\n\nIn this chapter, you will learn how to use layouts to organize\
    \ the various nodes. The first layout you learn about is the HBox.\n\nBefore you\
    \ begin, create a new, empty JavaFX app named Chapter4. The .java file should\
    \ look like this:\n\n```\npackage Chapter4;\n\nimport javafx.application.Application;\n\
    import javafx.stage.Stage;\n\n/**\n *\n * @author J F DiMartio\n */\npublic class\
    \ Chapter4 extends Application {\n/**\n  * @param args the command line arguments\n\
    \  */\n```"
