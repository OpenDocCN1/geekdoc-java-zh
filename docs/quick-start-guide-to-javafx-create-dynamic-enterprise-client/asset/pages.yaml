    Similar to what you have seen before, this code grabs the same ball image you
    have been working with and creates a group. In the previous section, you added
    a Timeline to this code to animate the ball image travelling up and down the y-axis.
    For this example, you are going to animate the ball moving around an abstract
    path.


    The next step is to create the path you want your ball image to travel along.
    You use a Path node which accepts a collection of elements to create a path from.
    You can easily create a group of elements that makes an abstractly shaped path.
    The following piece of code defines a small element array with some basic line-based
    shapes:


    ```

    Path path = new Path();

    ArcTo arc1 = new ArcTo();

    ArcTo arc2 = new ArcTo();

    ```


    ```

    arc1.setX(350);

    arc1.setY(350);

    arc1.setRadiusX(150);

    arc1.setRadiusY(300);

    ```


    ```

    arc2.setX(150);

    arc2.setY(250);

    arc2.setRadiusX(150);

    arc2.setRadiusY(300);

    ```


    ```

    path.getElements().addAll(new MoveTo(150f, 150f), arc1, arc2);

    ```


    There is nothing too complex or tricky about what is happening here. You have
    created a collection of elements and added them to a Path. The elements contained
    within the Path are MoveTo and two instances of ArcTo. The combination of these
    elements creates a path your ball can follow.


    The MoveTo element does exactly what the name suggests: It moves you to a specific
    point on the Cartesian grid. In this case, it moves you to x150, y150. You are
    specifying this as your first element to cleanly move the starting point of your
    path before you start “drawing.”'
