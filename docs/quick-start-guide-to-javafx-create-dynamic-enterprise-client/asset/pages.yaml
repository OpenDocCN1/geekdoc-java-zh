  md: "# Animating Along a Path\n\nIf you want to do a lot of math—and some tricky\
    \ calculations—you can create a lot of movements with the animation style explained\
    \ in the previous section. However, if you really want to do some complex animation,\
    \ as moving an object around the screen in a curving motion, you will want to\
    \ use path animation, which is another method that JavaFX has for creating animation\
    \ that allows you to move an object around a predefined path. In this section\
    \ you learn how to create a path using knowledge picked up in previous chapters.\
    \ You then use this path to animate the ball.\n\nThe concept here is that you\
    \ can create a path using lines, arcs, and points. JavaFX will animate your image\
    \ moving along this path.\nTo begin, set up your Chapter9.java file as shown here:\n\
    \n```\npackage Chapter9;\n```\n\n```\nimport javafx.application.Application;\n\
    import javafx.scene.Group;\nimport javafx.scene.Scene;\nimport javafx.scene.image.Image;\n\
    import javafx.scene.image.ImageView;\nimport javafx.stage.Stage;\n\n/**\n * @author\
    \ J F DiMarzio\n */\npublic class Chapter9 extends Application {\n\n    /**\n\
    \     * @param args the command line arguments\n     */\n    public static void\
    \ main(String[] args) {\n        launch(args);\n    }\n\n    @Override\n    public\
    \ void start(Stage primaryStage) {\n        ImageView imageView = new ImageView();\n\
    \        Image ball = new Image(\"http://jfdimarzio.com/ball.png\");\n       \
    \ imageView.setImage(ball);\n\n        primaryStage.setHeight(480);\n        primaryStage.setWidth(600);\n\
    \n        Group group = new Group();\n```"
