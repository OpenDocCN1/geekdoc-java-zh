  md: "# Chapter 12\n\nJavaScript communication\n\nShow Text\n\nFigure 12-2 The demo\
    \ page before JavaScript execution\n\nThis page displays the text \"JavaScript\
    \ communication\" and a button labeled \"Show Text,\" as shown in Figure 12-2.\n\
    \nIf you click the Show Text button, it fires the displayJavaScript() function\
    \ and shows the text \"JavaFX to,\" as shown in Figure 12-3.\n\nUsing the WebEngine,\
    \ you can load the jdimarzio.com/test.html page in a WebView and execute the showJavaScript()\
    \ function—without clicking on the page’s button. The first step is to load the\
    \ page into the WebView using the WebEngine. Edit the HTMLLoader to display the\
    \ page:\n\n```\nwebEngine.load(\"http://jdimarzio.com/test.html\");\n```\n\nBefore\
    \ you execute the JavaScript, you must make sure the page is fully loaded by the\
    \ WebView. Lucky you invoke a listener just for this purpose:\n\n```\nwebEngine.getLoadWorker().stateProperty().addListener(\n\
    new ChangeNotifier<State>() {\n    @Override\n    public void changed(ObservableValue<?\
    \ extends State> ov,\n        State oldState, State newState) {\n        if (newState\
    \ == State.SUCCEEDED) {\n            //Execute JavaScript here\n        }\n  \
    \  }\n);\n```\n\n# Chapter 12\n\nJavaFX to\n\nJavaScript communication\n\nShow\
    \ Text\n\nFigure 12-3 The demo page after the JavaScript execution"
