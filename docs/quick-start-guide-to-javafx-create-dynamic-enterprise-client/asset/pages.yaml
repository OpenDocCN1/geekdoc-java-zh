  md: '# Color.rgb


    The Color class allows you to use the RGB (Red, Green, Blue) value of the color
    you want to create. Most colors are mixed as a composite of differing amounts
    of red, green, and blue. The amounts of red, green, and blue used to create a
    color are defined using a value from 0 to 255 (0 being none of that color, 255
    being a full amount of the specified color). The following code will fill the
    interior of a rectangle with purple:


    ```

    Rectangle rectangle = new Rectangle();

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(Color.rgb(255, 0, 255));

    ```


    In this method call to the Color class, you specify an RGB value of 255 red, 0
    green, and 255 blue. This produces a purple color. However, try the following
    code and see what you get:


    ```

    Rectangle rectangle = new Rectangle();

    Color purple = new Color(1,0,1,1);

    rectangle.setX(10);

    rectangle.setY(10);

    rectangle.setHeight(150);

    rectangle.setWidth(150);

    rectangle.setFill(purple);

    ```


    This code also produces a rectangle that is filled with purple. The default constructor
    for the Color class also accepts RGB values to create a color. So what is the
    difference? The end result is the same either: You are left with purple as the
    color. The difference is that the default constructor for the Color class accepts
    values for red, green, and blue as a float from 0 to 1. Keep in mind that the
    rgb method of the Color class accepts values from 0 to 255. The final value is
    Alpha, which should be 1 to fully opaque.


    # Color.hsb


    The Color class also has a method for HSB (Hue, Saturation, Brightness) colors.
    In the HSB color model, the color or hue is represented by a number from 0 to
    360. This number corresponds to one of the 360 degrees of a color wheel.


    The saturation and brightness attributes are represented by a number from 0 to
    1. A value of 0 is no saturation and no brightness, whereas a value of 1 is full
    saturation and'
