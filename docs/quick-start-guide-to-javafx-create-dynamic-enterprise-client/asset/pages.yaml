  md: "# Key Skills & Concepts\n\n+   - Rendering HTML\n- Communicating between JavaScript\
    \ and JavaFX\n\nWith the abundance of business and sites built around streaming\
    \ media, it is only natural that JavaFX allow you to take full advantage of embedded\
    \ video and audio media. In the past, programming an application to play any kind\
    \ of media meant meant hours of writing controls, finding the right codecs for\
    \ the files you wanted to play, and writing parsers to read the media files. It\
    \ was long and arduous work that you would really only attempt if you were completely\
    \ confident in your abilities as a programmer.\nnRather than require you to link\
    \ directly to the media that you want to stream through JavaFX, there is a much\
    \ more robust solution waiting for you. JavaFX includes a WebView. The JavaFX\
    \ WebView is based on the ubiquitous, open-source WebKit—this allowing you to\
    \ display HTML5 and CSS and JavaScript.\n\nIn the first section of this chapter\
    \ you will work with displaying HTML using WebView. However, before you begin,\
    \ you will need to create a new, empty JavaFX project named Chapter 12. Your script\
    \ should appear as follows:\n\n```\npackage chapter12;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\
    \n/**\n * @author J F DiMarzio\n */\npublic class Chapter12 extends Application\
    \ {\n    /**\n     * @param args the command line arguments\n     */\n    public\
    \ static void main(String[] args) {\n        launch(args);\n    }\n}\n```"
