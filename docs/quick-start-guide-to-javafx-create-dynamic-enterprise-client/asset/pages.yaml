    \ * @author J F DiMarzio\n */\npublic class HTMLoader extends Region {\n}\n```\n\
    \nLet's add some code to the HTMLoader to display a web page.\n\n# Rendering HTML\n\
    \nThe WebView node is based on the open-source WebKit architecture. You can easily\
    \ use a WebView in your JavaFX application to render HTML. The example in this\
    \ section will render a website in a WebView.\n\n> TIP\nNotice that the HTMLoader\
    \ class extends Region. Extending Region allows our class to contain children\
    \ nodes and apply CSS to those nodes.\n\nLet's start by instantiating a WebView\
    \ and a WebEngine. The WebEngine allows you management over the WebView. You will\
    \ use the WebEngine to apply style sheets, point to web pages, and provide a communication\
    \ path between JavaScript and Java (later in the book).\n\nImport the following\
    \ packages to your HTMLoader class:\n\n```\nimport javafx.scene.web.WebEngine;\n\
    import javafx.scene.web.WebView;\n```\n\nNext, instantiate the WebView and WebEngine:\n\
    \n```\npublic class HTMLoader extends Region {\n```"
