    \ you want to import. However, the * notation tells JavaFX to import all the items\
    \ within a particular package. Therefore, the statement import javafx.scene.effect.*\
    \ will give you access to all the effects in the effect package.\n\nThe first\
    \ effect you will use is Bloom.\n\n# Bloom\n\nThe Bloom takes the areas of higher\
    \ contrast in your image and makes them appear to glow by overruling these areas\
    \ of high contrast and bleeding them into the surrounding image. The amount of\
    \ Bloom applied to the node is controlled by the threshold parameter, which accepts\
    \ a value between 0 and 1, with 0 being no effect at all.\n\nUse the applyEffects()\
    \ method in the Chapter8.java file to apply the Bloom effect to the butterfly.png\
    \ image. Every ImageView node has an effect parameter. This parameter is to set\
    \ the effect you want to apply to that ImageView.\n\nTIP\nYou are working with\
    \ an ImageView in this chapter because you just worked with it in Chapter 7. However,\
    \ ImageViews are not the only nodes you can apply effects to. Every node contains\
    \ an effect parameter that you can apply an effect to.\n\n> You can now edit the\
    \ applyEffects() method to apply the Bloom effect to the image. Add the following\
    \ lines to the applyEffects() method:\n\n```\nbloom = new Bloom();\nbloom.setThreshold(.5);\n\
    imageView.setEffect(bloom);\n```\n\nThis sets the effect property of the ImageView\
