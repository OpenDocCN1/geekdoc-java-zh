    \ scene;\n    scene = new Scene(new HTMLoader(), 800, 600);\n    primaryStage.setScene(scene);\n\
    \    primaryStage.show();\n}\n```\n\nCompile and run the code for this chapter\
    \ and you should see a JavaFX application with a rendered web page, as shown in\
    \ Figure 12-1.\n\n# Communicating Between JavaScript and JavaFX\n\nIn the previous\
    \ section you used the WebEngine to manage a WebView. The WebEngine can perform\
    \ other functions as well. One of the most useful functions that the WebEngine\
    \ can perform is to facilitate the communication between JavaScript and JavaFX.\n\
    \nThis is not to say that the WebEngine can arbitrarily execute JavaScript on\
    \ an unsuspecting page. Rather, the WebEngine can be used to enhance existing\
    \ functionality on a page. For example, the WebEngine can be used to execute JavaScript\
    \ against a page. This is by itself is not terribly exciting. However, WebEngine\
    \ also facilitates the opposite behavior as well—you can communicate from JavaScript\
    \ to JavaFX."
