    # Nested Layouts


    One of the most flexible aspects of layouts is that they can be nested. That is
    to say, you can place layouts within each other. You can create very useful UIs
    by combining two or more existing layouts.


    In the previous sections you looked at two very specific layouts. The HBox only
    organizes nodes horizontally across a Scene, and a VBox only organizes nodes vertically
    down a Scene. JavaFX can offer two otherwise limiting layouts and still be versatile
    because these layouts can be nested within each other to create a more flexible
    organization of nodes.


