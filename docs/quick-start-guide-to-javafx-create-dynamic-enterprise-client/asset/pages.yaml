    Show Text


    ![](img/f5bc6249660e63bd0b6a2dc95983edb7_193_0.png)


    Figure 12-4 Executing the showJavaFX() function from JavaFX


    Modify the call to the executeScript() method to throw up a JavaScript alert:
    webEngine.executeScript("alert(''Hello World'');");


    For security, JavaFX will not pass the alert pop-up to the application. Running
    this now will not give any indication that a JavaScript function was executed.
    However, JavaFX provides a rather suitable solution. You can establish a line
    of communication from JavaScript to JavaFX, listen for the execution of the alert,
    and intercept the contents of it—to do with as you please.


    Let''s set up an example where the contents of the alert are written to a label
    on the JavaFX app. The following modification to HTMLClassLoader sets up a toolbar
    at the bottom of the application with a label:


    ```

