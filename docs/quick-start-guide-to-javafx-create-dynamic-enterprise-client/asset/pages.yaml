    projects can be confusing for beginners, and sorting through some of that confusion
    will help you follow the rest of this book. This chapter walks you through, step
    by step, the process of creating your first project, discovering what a Stage
    and a Scene are, and running the application.


    # Creating a New JavaFX Project


    If you have not already, open your copy of NetBeans. You will create a new JavaFX
    project for this chapter using NetBeans.


    > NOTE


    You will use the project created in this section throughout this book. As you
    progress through the book, you will continue to add application files for the
    examples in each chapter.


    With your NetBeans IDE open, click File | New Project (or press CTRL-SHIFT-N),
    as shown in Figure 2-1.


    Selecting New Project will open the New Project Wizard. Notice that the New Project
    Wizard contains multiple project categories. This is because NetBeans is used
    for more than just JavaFX development. You need to select the Categories option
    of JavaFX and the Projects option of JavaFX FXML Application, as shown in Figure
    2-2. Ensure these are selected and click Next. If these options are not selected,
    choose them now.


    The next step in the wizard is the Name and Location step. NetBeans is looking
    for a name for your project. Name your project JavaFXForBeginners. This is a good,
    descriptive name for your project that will make it easy to identify.'
