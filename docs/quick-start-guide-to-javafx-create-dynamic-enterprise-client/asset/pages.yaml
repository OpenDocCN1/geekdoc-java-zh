  md: '# Chapter 2: ... Setting the Scene


    to create a single-line comment. Notice that single-line comments being with //
    rather than /*. Also, because they are only on one line, there is no need to close
    them. As such, anything on that line will be considered a comment.


    In the next section, you will learn about the package statement.


    # The package Statement


    After the beginning comments is the following line:


    ```

    package javafxforbeginners;

    ```


    This line, while having very direct impact on your code, can teach you some key
    points about programming in Java. The core purpose of this line is to tell the
    compiler that all the code under this line belongs to the javafxforbeginners package.
    The package declaration must be at the top of the java file.


    This line of code has three components you should be aware of. The first word
    of the line, "package," is a Java keyword. Keywords are special commands that
    have a predefined meaning to the Java compiler. They are also known as "reserved."
    As such, they cannot be used elsewhere in your code as variable names or anything
    other than their predefined purpose. The keyword package tells the compiler that
    anything following the keyword is the name of the package.


    The name of your package follows the package keyword (in this case, javafxforbeginners).
    Because the purpose of the keyword is to tell the compiler that everything after
    it is the name of the package, the compiler needs to know where the end of the
    filename should be. Otherwise, by definition, the compiler would think all the
    code in the file was the package name. Therefore, Java has a special character
    set aside as a statement terminator: the semicolon (;). The statement terminator
    the compiler when it has reached the end of a specific line of code. Although
    there are very specific exceptions to this rule, you will need to use code statements
    with a semicolon to let the compiler know you have finished. If you do not use
    a semicolon it is expected where one is the compiler will give you an error when
    you attempt to compile.


    # TIP


    Compilation is the process where your code is converted from human-readable text
    to a class file containing bytecodes that can be executed by the Java Virtual
    Machine.


    In the final sections of this chapter, you will examine the functional code that
    is in the JavaFXForBeginners.java file.'
