    You are now going to animate a ball image used from http://jfdimarzio.com/ball.png.
    You will make the ball image move down the scene, along the y-axis. To begin,
    you need to create a group.


    Why a group? A group is a collection of nodes. In this case you are going to need
    a group to hold your ImageView and the ball image. The StackPane that you have
    been using in the previous chapters allows you to stack nodes, but it doesn''t
    allow them to be freely moved around the scene. To animate an image, you need
    to literally manipulate the x-, y-, or z-coordinate of the image. A StackPane
    simply doesn''t allow that natively.


    To get around this issue, you are going to create a group that can be freely moved
    around the scene. You will then add the image to the group.


    The following code sets up your group and image calls:


    ```

    package Chapter9;


    import javafx.application.Application;

    import javafx.scene.Group;

    import javafx.scene.Scene;

    ```'
