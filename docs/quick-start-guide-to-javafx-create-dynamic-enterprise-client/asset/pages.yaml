  md: 'Much of this book was spent covering the basics of JavaFX development. You
    have learned to navigate JavaFX APIs and create some very compelling applications.
    In this chapter, you are going to learn how to deploy the JavaFX applications
    you have created. There are three major methods for deploying JavaFX applications:
    using the JavaFX Packager tool, creating a self-contained app, and using the Web
    Start plug-in. Let''s take a look at the JavaFX Packager tool in NetBeans.


    # JavaFX Packager Tool


    Throughout this book you have created multiple JavaFX applications you can execute
    from within NetBeans. You have written some very useful applications in your short
    time with the APIs, but one issue remains: You need to be able to deploy the applications
    you write so that others can execute them.


    The following steps teach you the first method for deploying applications: using
    NetBeans and the JavaFX Packager tool.


    # NOTE


    In this example you will be using Chapter12.java. If you do not have Chapter12.java
    from the example in Chapter 12, any of the book''s examples will work. In the
    event you have not retained any of the examples in the book, you may want to complete
    one before following these steps.


    The first step in deploying JavaFX from NetBeans is to right-click your project
    in NetBeans and go to the project''s Properties dialog box. From there, select
    the Run properties, as shown in Figure A-1.


    In the Run properties, you just want to confirm that the Application Class setting
    is the correct class name of the .java file you want to execute. The class listed
    in the Application section is the file that will be compiled and deployed during
    this process. Once you have confirmed or set the correct class as the application
    class, you can close the project''s Properties dialog box. Keep in mind that if
    you''ve never modified or tweaked the setting manually, there is no reason why
    this shouldn''t be set correctly.


    The next step in deploying your JavaFX application is already to build your project.
    The build process generates a .jar file that can be used to run the application
    outside the NetBeans IDE. To build your project, right-click your project once
    again and select Build Project, as shown in Figure A-2.'
