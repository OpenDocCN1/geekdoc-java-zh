    # 4.4. Adoption and suitability for the better released variety


    In this study, we report a MY experiment to test the performance, adaptation,
    and stability of various varieties in Indonesia. Based on the location of MY,
    the rice production centre in Indonesia, using relatively small plot may find
    the potential yield in the dry and wet season. We followed the season and used
    the multi-location experimental plot to show variety performance using farmers--engagement
    with the farmers and to compare the performance with existing varieties in the
    sites of the MY. The objective plot is to identify the success performance during
    MY and as well to select targeted areas, such as the dry season of 2021, with
    an area of 25 ha and with 33 locations [48]. The evaluation of the variety for
    farmers produced by conducting seeds adopts the adoption of the variety in the
    targeted area.


    Farmer acceptability for newly released variety was identified by the number of
    farmers that produced the variety using the seed to grow, as well as to the farmers.
    These varieties were released in 2020, and the dissemination was done thoroughly
    until the 2021. The source seeds of these varieties are distributed and produced
    by Department of Agriculture and the extension methods. The distribution of seeds
    to the stakeholders in the 2022 was 2.7% (Fig. 5). The distribution of Inari 47
    WBC, Inari 48 and Inpari Digajah was higher than the other varieties, which show
    that the demand for the variety by the farmers as the users, before it can be
    multiplied by seed growth throughout the country. The distributed new varieties
    become an option for Indonesian farmers to replace the poor performance of the
    existing rice yield issue due to the pests.


