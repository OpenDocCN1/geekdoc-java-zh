    # 文章信息


    关键词：

    - 生物型

    - 病害

    - 粮食质量

    - 营养

    - 病原体

    - 害虫

    - 稳定性


    # 摘要


    高产（HY）品种可以增加水稻产量，但对农资投入和良好的粮食质量较为敏感。印度尼西亚具有多样的农业生态，需要水稻品种适应各种环境以提高产量。我们评估了八个品种对主要病虫害（如昆虫、细菌性叶枯病和水稻瘟病）的响应、粮食质量以及对肥料的响应。实验在两个季节（2017年和2018年）内于
    16 个地点点进行。使用了乘法相互作用（AMMI）模型和基因型×环境（GEI）模型来确定稳定性。我们确定了四个高产优良系，namami Inpari Digajah、Inpari
    47 Ci Blang 和 Inari Gem 在不同环境下的产量均高于平均水平。其粮食质量符合消费者的偏好。我们发现，所选的高产品种在两个地点对肥料的产量建议比对照组更高。由于其表现优异，这些优良系可以作为那些与现有品种遗传背景不同的农民的替代选择。


    # 1. 引言


    农业生产不仅提供需求，在人口快速增长的情况下，还需要保护资源和环境质量[1]。水稻是印度尼西亚的主食，其产量需要增加以满足人口需求。有两种方法：通过开垦新田增加水稻田或水稻种植面积来强化生产[2]。然而，第二个方案对于满足食物需求并非理想方案。通过开垦森林进行扩张涉及土地清理，这将损害野生动物保护区的保护[3]。因此，强化土地利用的适当技术对于通过高产（HY）品种增加水稻产量更为可靠，这是印度尼西亚最重要的技术成就之一。20世纪60年代后期，高产品种使印度尼西亚的水稻产量增加，提高了其粮食生产[4]。高产品种提供的农产量高于其他品种，但它们更容易受到害虫、昆虫和疾病的侵害[5]。产量的增加意味着许多农民获得更高的产量，消费者的食品成本降低。


    印度尼西亚的水稻育种计划涉及许多方面。从20世纪40年代到21世纪20年代，已经发布了300多个水稻品种（粮食作物局，2020年，未发表数据）。产量提高在1997年至1998年取得了进展，多达……


