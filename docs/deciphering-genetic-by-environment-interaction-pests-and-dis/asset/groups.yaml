    # Deciphering genetic-environment interaction, pests and disease’s reaction, grain
    quality, and response to fertilizer for targeting-yielding rice varieties


    Trias Siresatmi¹, Nafisas Nafisah², Utung Sususanto³, Rahmini Rahmiani⁴, Yuni
