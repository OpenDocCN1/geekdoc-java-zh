    # 2. Methods


    # 2.1. The multi-location trial (MTL)


    The multi-location trial was done in six locations in irrigated fields at low
    to medium elevations of Sumatra, Java, and Nusa Tenggara from 2018-2021 (Table
    1). The lines used were various, namely Inari 30, 32, and Inari 43 (Table 2).
    The plants were planted in an experimental plot using a randomized complete block
    design with four repetitions. Each genotype''s seedling was planted in a polybag
    with a row spacing of 25 x 12.5 cm in the row) Jarawi is an from Indonesian language
    *Jagung lewe* or planting along a single row while the harvest is in two rows
    with ample space. The plot size of each genotype was 4 x 5 m. The plants were
    grown using recommended practices of integrated pest management to obtain optimum
    grain quality. The occurrence of pests and diseases were measured as response
    of genotype evaluated as the performance of plants.


