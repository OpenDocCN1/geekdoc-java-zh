    # 解译目标高产水稻品种的遗传环境相互作用、病虫害反应、粮食质量以及对肥料的响应


    Trias Siresatmi¹, Nafisas Nafisah², Utung Sususanto³, Rahmini Rahmiani⁴, Yuni
    Widiastuti⁵, Bramans Kusbianto⁶, Muhammad Ismail Wahab⁷, Airis Haimanisa⁸, Yudhistira
    Nugraha⁹


    * 印度尼西亚研究与创新机构，Soekarno Jalan Raya Cibinong No. 46, Cibinong, Bogor 16911, 印度

    * 水稻研究中心，Jakarta Raya 9 Sukamisang, West Java, 42156, 印尼西亚

