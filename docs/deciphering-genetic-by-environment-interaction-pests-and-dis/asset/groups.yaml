    ## 4. 讨论


    ### 4.1. HY 品系对各种环境具有稳定性和适应性


    识别适应性和稳定性对于选择具有经济效益的品种至关重要。基因型与环境（GE）相互作用产生的统计信息有助于向农民提供建议。基于多环境试验的评估，通过多种方法对
    GE 相互作用进行了量化。GE 相互作用还用于筛选稳定或适应一系列环境的基因型 [27]。根据分析，我们发现某些基因型在某个地点表现良好，而另一些基因型在其他基因型中表现更好。基因型与环境之间存在相互作用，可以使用稳定性分析进行解释。稳定性信息对于在印度尼西亚不同地区的每个地点选择最佳基因型非常有帮助
    [28]。在测试的品系中，有四种优良品系供进一步测试，Inpari G31、Inpari W46 和 Inpari F58 因其表现出高产量潜和对有利环境的响应而被选中。基因型在特定地点的详细适应性已通过
    GE 图（图 1 和 c）D 进行了解释。这用于实现基因型（GE）效应和基因型-环境相互作用效应的分析技术 [25]。GE 图可用于分析环境范围，该作用由基因型（G）主效应和
    GE 相互作用组成 [30–32]、基因型评估 [33]、测试环境评估 [34]、应用于育种的在正常和边缘条件下选择适应性高产玉米基因型 [35]、大豆 [36]
    以及农林系统中筛选基因型 [37]。


    ### 4.2. HY 品系与现有品种相比具有抗虫害性


    在确定测试品系在不同环境下的产量稳定性差异后，我们进一步发现没有一个品种在抗性和优良品质方面具有不同的遗传背景。这是因为这些品系对病虫害没有天然的显著抗性，正如气候变化导致的环境变化一样。白枯病（BLB）和稻瘟病（BL）的抗性是申请抗性品种的前提之一。接下来，Inpari
    W46 分别在 1、2 和 3 个多地点完成了中等抗性（表）。BH In Inpari W46 的谷物产量来自不同的环境。源地水稻品种没有抗性，就像其他具有不同类型抗性的谷物基因型中最常见一样
    [38]。这是由品种之间的遗传差异造成的。Inpari F58、bh2 和 bh4 对白枯病具有抗性 [40]。最后的 Inastrant of 48 显示出源自西爪哇
    Boer 品种的相似性 [41–43]。水稻植物的抗性可以通过种植的水稻品种的多样化遗传来确定，包括多重抗性以及动态气候变化下的气候适应性。这要求农民随时间调整作物品种并使用正确的策略将风险降至最低。这种策略可以帮助农民在印度尼西亚的异质环境中培育品种并


