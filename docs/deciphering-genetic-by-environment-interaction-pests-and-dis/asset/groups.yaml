    # 2.5. Analysis


    The grain yield of fourteen varieties from field experiment were analysed using
    single and combined ANOVA. The P statistics were indicated using Fisher''s Least
    Squares Difference (LSD) at P=0.05. Regression line was used over the mean yield
    of all tested genotypes in each location to estimate density stability using the
    coefficient of regression (b). The effect of interactions between genotypes and
    environment was analyzed using AMMI and GGE analysis (10). The AMMI and GGE packed
    in PRSTAT were used as (11). The best genotypes in environments with high yield
    and their stability were identified. Stability data and reaction of genotypes
    to grain yield were analysed using descriptive statistics. The yield data on fertilizer
    experiment was analysed using ANOVA. The individual farmer was used as a repeating
    plot. Stability and analysis followed by means comparison between treatments when
    effects were significant.


    # 2.3. Physio-chemical quality test


    The plant materials used were elite lines in VNET, genotype Inpar 40, Inay 47,
    Inpar 48 and Black 3 and check varieties (Inpar 30, 32, and Inpar 43). The physico-chemical
    properties of the plant materials were measured based on dehusking process and
    performance of water content, the quality of rice was measured based on protein
    content, purity, chalk grains, yellow grains, damaged grains, red grains, foreign
    matter, and the other varieties. The shape of grains was also measured by length,
    width, and the ratio between the length and width. The quality of millet was measured
    by the degree of polishing, the percentage of head rice, broken rice, rice, lime
    grains, and whole grains. The chemical quality of rice was observed following
    the standard procedure for testing content, gelatinization temperature 1° KOH,
    and consistency.


    # 2.4. The field experiment on response of HY lines to N recommendation


    The experiment to know the fertilizer response was conducted in Bandung during
    April-August 2021. Three selected HY lines (Inpar 47, Inpar 48 and Black 3) were
    chosen based on the grain yield stability, resistance to stress and production
    capacity. The experiment was conducted in two locations: Bandung (Cimubur district
    and Selokan Sukjuk district). Each HY lines were treated with two different fertilizer
    levels, common practices (200 kg/ha of N;15:15:15 and 200) and recommended (250
    kg/ha of N and 250 kg/ha). The application method based on rice crop density 35
    (Layan Konipati - LPK in Indonesia) is an interactive supporting system decision
    for giving response to fertilizer in locations. The yield was based on the target
    7 ton/ha which has been calculated by system static extrapolation of genotypes,
    locations, and growth crops. Each combination of HY lines and fertilizer was given
    to the farmers and their yield was recorded using the wheat agreement protocol.
    A proper sampling was taken for each combination of HY lines and fertilizer for
    the field using 2.5 m² to measure productivity of rice grain yield.


