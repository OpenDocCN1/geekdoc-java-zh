    # 2. 方法


    ## 2.1. 多点试验 (MTL)


    多点试验于2018-2021年间在苏门答腊、爪哇和努松萨丹加低低至中海拔的灌溉田的六个地点进行（表1）。使用的系种多样，即 Inari 30、32 和 Inari
    43（表2）。植物种植在试验小区中，采用完全随机区组设计，重复4次。每个基因型的种苗种在聚合物袋中，行距为25 x 12.5 cm（行内）。Jarawi 是印尼语中的“*Jagung
    lewe*”，意为单行种植，而收获时是两行并留有充足空间。每个基因型的小区面积为4 x 5 米。植物采用推荐的综合病虫害管理措施进行生长，以获得的粮食质量。病虫害的发生情况被测量为基因型的响应，并评估为植物的表现。


