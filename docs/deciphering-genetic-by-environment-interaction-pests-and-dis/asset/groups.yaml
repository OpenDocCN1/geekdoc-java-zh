    在本研究中，我们报告了一个 MY 实验，以测试印度尼西亚各种品种的性能、适应性和稳定性。根据 MY 的所在地（印度尼西亚的水稻生产中心），使用较小的小区可以发现旱季的的产量。我们遵循了季节，并使用多地点试验小区来展示品种性能，通过与农民互动并与现有品种进行比较。农民对新发布品种的接受度通过生产该品种的农民数量来确定。目标小区是识别
