    # ABSTRACT


    The high-yield (HY) variety can increase the production of rice grain but is also
    sensitive to agricultural input and good grain quality. Indonesia has diverse
    agroecology that needs rice variety to adapt to various environments to recommend
    yields. We evaluated eight varieties in their response to main pests and diseases
    such as insects, bacterial leaf blight, and rice blast, of the grain quality,
    and response to fertilizer. Performance were performed at 16 locations over two
    seasons (2017 and 2018). The addition of multiplicative interaction (AMMI) and
    Genotype × Environment (GEI) models were used to determine the stability. We identified
    four HY elite lines, namami Inpari Digajah, Inpari 47 Ci Blang, and Inari Gem
    had better grain yield across environments higher than the average overall. The
    grain quality meets to consumer preferences. We identified that the selected HY
    line gave higher grain yield recommendation to fertilizer at two locations compared
    to the check. Due to its performance, the elite lines can be an alternative for
    the farmers that had a different genetic been from the existing variety.


    # 1. Introduction


    Agricultural production not only offers demands but also needs to conserve resources
    and environmental quality in the rapidly increasing population [1]. Rice is the
    staple food of Indonesia, and its production needs to increase to match the population
    demand. Two approaches are intensifying production in the increasing rice field
    or/or rice cultivation areas by opening new fields [2]. However, the second option
    is not ideal solution for feeding needs. Expansion by opening forests involves
    land clearing, which will expense the conservation of wildlife areas [3]. Therefore,
    the appropriate technique intensifying the land is more reliable in increasing
    rice grain production by high-yield (HY) varieties represent the most significant
    technological achievement in Indonesia. In the late 1960s, the HY varieties have
    given rise to rice yields in Indonesia increase its food production [4]. The HY
    varieties have provided on-farm yields higher than the others but they are more
    susceptible to pests, insects, and diseases [5]. Increased production implies
    higher yield for many farmers and lower food costs for consumers.


    The rice breeding program in Indonesia has involved many-inter. More than 300
    rice varieties have been released since the 1940s to the 2020s (Directorate Food
    Crop, 2020, unpublished data). The yield improvement has been made from 1997 to
