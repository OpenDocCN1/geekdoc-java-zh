    to the farmers. GE interaction was quantified using several methods based on the
    evaluation of multi-environment trials. GE interaction is also to sort out genotypes
    that are stable, stable or adapted to a range of environments [27]. Based on the
    analysis we found that some genotypes performed well in one location, while others
    had better performance in other genotypes. There is interaction between genotype
    and environment that can be interpreted using stability analysis. The stability
    information is useful in choosing the best genotype for each location across the
    different regions in Indonesia [28]. Among the lines tested there four elite lines
