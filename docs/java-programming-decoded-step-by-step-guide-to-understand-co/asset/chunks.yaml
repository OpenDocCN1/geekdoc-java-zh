    在 Java 中编写程序时，你必须为你编写的每一个内容命名（类、方法和变量），这意味着它们将拥有标识符。根据 Java 代码结构，这些标识符必须始终以 `A`
    到 `Z` 的大写或小写字母、下划线（`_`）或美元符号（`$`）开头。标识符不能以其他任何数字或其他特殊字符开头。在这里，至关的一点是记住，如果你使用大写或小写，它们具有不同的含义。


    最后，你有代码行 `public static void main (String[] args)`，这是让 Java 能够处理你要求它执行的操作。这行代码将出现在你在
    Java 中编写的所有代码中。这是因为它将提供指令，在你的案例中，就是执行“打印” Hello World 代码的指令。


    虽然在之前的代码中没有看到，但你可能会遇到如下所示的写法：


    ```java

    /*这是你将要

    * 使用的代码，如果你想在

    *  程序中打印 Hello World

    */


    //这里是包

    package <selected.name>


    //这是类

    public class <ClassName> {


    //这是主方法，命名为 "main"

    public static void main (String[] args) {


    //这是打印语句

    System.out.println("Hello World");


    }


    }

    ```


    你会发现，通过添加 `//` 符号或 `/*` 符号使用了代码指令。当你对正在创建的代码进行注释时，应该使用这些标准。在这种情况下，你将使用 `//` 用于单行注释代码，使用
    `/*` 开始多行注释；下一行应该始终以 `*` 开头，在你写完后，应该用 `*/` 结束以表示注释结束。


    你可能注意到的另一点是，上述代码有缩进，这意味着它们没有左对齐。虽然某些编程语言（如 Python）将缩进作为代码运行的强制条件，但 Java 并非如此。这意味着如果你不使用
    IDE，可以在不进行缩进的情况下编写代码。尽管如此，你应该注意，使用 `Eclipse` 等 IDE 会自动对代码进行缩进。


    最后，关于 Java 代码有两点非常重要：第一，大多数经验丰富的开发者使用的类、方法和实例名称指的是它们将的功能。这使得代码更易理解、更整洁，让其他开发者能够理解语法背后的意图。第二，许多开发者不喜欢在代码中使用注释。他们声称这会让代码变得“脏”，并增加理解的难度。


    这些大部分信息可以在称为 Java 规范（Java conventions）的文档中找到。虽然这些不是决定你的代码能否运行的“规则”，但它们是大多数开发者使用的标准
    Java 编码应用，以确保你的代码可以被任何需要的人阅读。在本节中解释所有的 Java 规范是没有意义的，因为会有一些你无法理解的元素。然而，为了确保你熟悉市场上的最佳实践，将在书中内容的各个处根据需要解释规范的应用。


    ### 预留字


    你应该知道的最后一点（这对于在 Java 中编写代码至关重要）是，该语言拥有所谓的“预留字”（reserved words）。这些词在与代码配合时有特定的用途；因此，它们不能被用于命名变量、类或方法。随着时间的推移和你对
    Java 经验的增加，你可能会记住此表中的术语，所以不需要担心！此外，你会发现在阅读过程中，许多预留字都将得到解释；因此，你会立即明白它们不应该被使用。如果你需要额外的帮助来记住它们，可以尝试打印或写出它们，以便在需要时方便查阅。


    这里是 Java 53 个预留字的列表：


    ![](img/image_rsrc4ZR.jpg)


    当我们进入章节的最后一部分时，你将学习如何编译和运行你创建的 Java 程序。虽然在使用 IDE 时这个过程是自动的，但重要的是你要知道，可以在不使用 IDE
    的情况下执行这些操作和命令。此外，你将学习 Java 解释器（interpreter）和编译器（compiler）之间的区别，这是 Java 包中不可组成部分。


    ### 编译和运行 Java 程序


    就像当你用 Java 编写代码时计算机不理解“人类”语言一样，代码还未准备好被机器理解。这是因为计算机只理解二进制语言，即它能听懂的“0”和“1”的分配。当你拥有
    Java 编译器（`javac`）时，它将充当“翻译官”的角色，将你以代码格式编写的内容转换为机器语言。正如名称所示，解释器具有相同的功能：将代码转换为机器代码，以便机器知道它必须做什么。


    但你可能会问，编译器和解释器是同一个东西吗？这是一个非常棒的问题。虽然它们的作用相似，但它们有一个根本区别：编译器会扫描整个代码，然后才进行翻译；而解释器会逐行执行并同时进行翻译。如果你的代码中有任何错误，解释器会在读取每行代码时捕获它们，而编译器将在完成扫描后才执行这一点。


    正如你所想象的，这种差异会显著影响程序的性能和调试。如果你通过编译器运行代码，你将一次性看到所有需要修复的错误，这可能花费很长时间，因为一旦你想测试它，它就需要重新运行所有代码。这可能导致一个乏味的过程，特别是当代码量很大时。然而，如果是正确的，这会让软件运行得更快，因为它会读取并解释完整的命令。


    解释器的行为具有完全相反的特征。如果你想象逐行运行代码，你会发现它使调试更快，因为你会在执行过程中“攻击”每一个问题，并且只有当它正常时才会移动到下一行。这意味着代码只有在出现错误时才会停止。另一方面，执行此程序可能需要更，因为它会读取每一行唯一的代码来执行所需的操作。


    当你使用 IDE 时，这个过程被嵌入在软件中，准确地告诉你问题所在并快速处理。此外，它可能帮助你解决不需要开发者干预即可解决的问题，或者告诉你在哪里需要添加更多代码。正如前面提到的，你应该学习如何在不使用
    IDE 的情况下在计算机上编译代码。


    要做到这一点，你必须确保安装了 `JDK`。然而，不是使用 IDE 的工作区输入你需要的内容，而是在计算机上打开记事本（Notepad）或类似的应用程序）。现在，记住你将阅读的步骤指的是
    `Windows OS`，但你可能使用的任何其他操作系统也可以采用类似的方法。


    你将输入我们在上一节看到的代码：


    ```java

    public class JavaProgram {


    public static void main (String[] args) {


    System.out.println("Hello World");


    }


    }

    ```


