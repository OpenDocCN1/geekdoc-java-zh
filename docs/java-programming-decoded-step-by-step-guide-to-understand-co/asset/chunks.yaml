    ## THE SCOPE OF VARIABLES


    When you assign the memory for the location of the data, you are using a variable.
    This means that when you say int a = 2, you are assigning the variable "a" the
    value 2\. In the same way that when we type in the string "Hello Data", the values
    being stored are the letters or the words that are between the quotation marks.
    When we talk about the scope of the variable, we are referring to what the compiler
    is being told "about the segment within a program where the variable is accessible
    or used. Programmers can scope the variables lexically or statically in the case
    of Java variables" (Vats, 2021).


    Variables have different scopes and different characteristics. For example, if
    you have a public variable, this means it will be available from any place in
    the program, which means you can call it at any time in the code. On the other
    hand, if you declare it as "private," this means it will only be accessed within
    the methods of the class to which it belongs. Let''s take a look into each of
    the variable scopes that can be used in Java and their best applications according
    to baeldung (2019):


    *   Bracket scope: Variables declared inside brackets will determine their scope.
    This means they can be declared after the class, methods, and even just for themselves.
    When you input a variable within the brackets, and they are not in any of the
    previously mentioned examples, this means they will only work inside the brackets.
    To understand this, let''s see an example:


    public class BracketScopeExample {


    public void mathOperationExample() {


    Integer sum = 0;


    {


    Integer number = 2;


    sum = sum + number;


    }


    // Compiler error, number cannot be resolved as a variable


    // Integer number++;


    }


    public static void main(String[] args) {


    BracketScopeExample example = new BracketScopeExample();


    // If you uncomment the next line, it would cause a compilation error because
    the number is out of scope


    example.mathOperationExample();


    System.out.println("Trying to access number outside its scope: " + example.number);


    }


    }


    *   Class scope: When a class variable is declared, you will need to do it inside
    the curly brackets that are open after the class is called. In this case, if you
    add the private to the variable within the class but outside the method, this
    means it will be accessible inside all the different lines of the class. In this
    case, we could mention the example:


    public class ClassVariable {


    // here the double amount is declared and can be accessed within the class


    // since it has been declared after the curly brackets placed after the class
    and declared private.


    //if private hadn''t been declared, it would be possible to use it throughout
    the whole program.


    private double amount = 5.26;


    public void methodName() {


    amount+=2.3;


    }


    public void anotherMethodName() {


    double otherAmount= amount + 3.6;


    }


    }


    System.out.println("Other Amount: " + otherAmount);


    }


    public static void main(String[] args) {


    // Create an instance of ClassVariable to use the variable in another example


    ClassVariable example = new ClassVariable();


    // Access and modify the "amount" variable by using the object instance


    System.out.println("Initial Amount: " + example.amount);


    example.methodName();


    System.out.println("Amount after methodName: " + example.amount);


    // Calling anotherMethodName to demonstrate the usage of ''amount''


    example.anotherMethodName();


    }


    }


    *   Loop scope: Similar to what you will see in the method scope when you declare
    a variable inside a loop, it will only be accessible within the loop you are working
    with. This means that even if you have another loop and try to call this variable,
    it will be inaccessible and generate a compilation error, such as:


    public class ClassVariable {


    double amount = 5.26;


    public void methodName() {


    amount+=2.3;


    for (int i = 0; i < 5; i++) {


    // Inside the loop, you can use the "amount" variable


    double loopAmount = amount + i;


    System.out.println("Loop Iteration " + i + ": " + loopAmount);


    }


    // The "amount" variable is still accessible outside the loop


    amount += 1.5;


    }


    public void anotherMethodName() {


    double otherAmount = amount + 3.6;


    System.out.println("Other Amount: " + otherAmount);


    }


    public static void main(String[] args) {


    ClassVariable obj = new ClassVariable();


    obj.methodName();


    obj.anotherMethodName();


    }


    }


    *   Method scope: In the method scope of the variable, you do not need to use
    a qualifier such as private or public, since if it is declared inside the method,
    then it will only be accessible inside it. To declare a variable that belongs
    to the method scope, you should add it within the curly brackets after it has
    been called, such as


    public class ClassVariable {


    public void methodName() {


    // Declare the variable inside the method. It will only be available inside this
    method.


    double amount = 5.26;


    // You can use the "amount" variable within this method


    amount += 2.3;


    System.out.println("Amount in methodName: " + amount);


    }


    public void anotherMethodName() {


    // There will be a compilation error since you are trying to refer to the "amount"


    // that was declared in the previous method, but it cannot be accessed here.


    // double otherAmount = amount + 3.6;


    }


    public static void main(String[] args) {


    // Creating an instance of ClassVariable


    ClassVariable example = new ClassVariable();


    // Call the methodName to demonstrate the usage of the "amount" variable


    example.methodName();


    // Call anotherMethodName to demonstrate the compilation error


    example.anotherMethodName();


    }


    }


    Now that you understand the different scopes variables can have, it is time to
    learn the last critical element you should know when discussing methods. This
    is called a Java recursion, and happens when the method calls itself. "A physical
    world example would be to place two parallel mirrors facing each other. Any object
    in between them would be reflected recursively" (Java Recursion, n.d.). Let''s
    learn more about them and see how these can be used.


    ## RECURSIVE METHODS


    Recursive methods in Java can be complicated, and the best way to learn them is
    to use examples. However, they can also be quite tricky, since they can become
    endless code lines if you are not careful. On the other hand, if they are properly
    applied, you will have an efficient way to break down complex problems into simpler
    conditions and work them as you need (Java Recursion, n.d.).'
