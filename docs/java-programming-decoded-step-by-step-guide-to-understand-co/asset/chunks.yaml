    \ \" + number);\n        int removedNumber = numbers.remove(1);\n        System.out.println(\"\
    Removed Element: \" + removedNumber);\n    }\n}\n```\n\nIn this case, the output\
    \ will be:\nList: [1, 2, 3]\nAccessed Element: 3\nRemoved Element: 1\n\n```java\n\
    import java.util.List;\nimport java.util.LinkedList;\n\npublic class Main {\n\
