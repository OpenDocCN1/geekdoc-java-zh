    \ baeldung (2019) 来看 Java 中使用的各种变量作用域及其最佳应用：\n\n*   **括号作用域 (Bracket scope)**：在大括号内声明的变量将决定它们的作用域。这意味着它们可以在类、方法之后声明，甚至可以仅为了自身声明。当在括号内输入一个变量，且它们不在上述提到的任何示例中时，这意味着它们只在括号内起作用。为了理解这一点，让我们来看一个例子：\n\
    \n```java\npublic class BracketScopeExample {\n    public void mathOperationExample()\
