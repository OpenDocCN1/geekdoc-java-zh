    \ it is rather different if you are going to program for software to understand\
    \ \"increase\" and \"decrease\" the volume, or if it should \"increase or decrease\
    \ in a certain amount of tones.\" Just like in a hotel where the reception might\
    \ book reservations that come from walk-ins, and the guest services for those\
    \ made by the telephone, it is important to specify exactly what you want it to\
    \ do; therefore, the more possibilities it gives you, the better. Let's say in\
    \ the hotel there is no one in guest services to answer the phone and make the\
    \ reservation. This means that the task should be directed somewhere else so the\
    \ individual can reserve a room. In a code for our volume analysis, this would\
    \ look like this:\n\n```java\npublic class Main {\n    //declaring the variable\
    \ with the current volume\n    private static int currentVolume = 5;\n\n    //declare\
    \ the main method\n    public static void main(String[] args) {\n        System.out.println(\"\
    \ Current volume: \" + currentVolume);\n        //establish the method call (volume)\
    \ and the parameters (inside the ())\n        volume(\"increase\", 4);\n     \
    \   System.out.println(\" Current volume: \" + currentVolume);\n        //establish\
    \ the method call (volume) and the parameters (inside the ())\n        volume(\"\
    decrease\", 2);\n        System.out.println(\" Current volume: \" + currentVolume);\n\
    \    }\n\n    //declare the Volume method\n    public static void volume(String\
    \ action, int quantity){\n        //establish the actions you want it to do using\
    \ an if-else statement\n        if (\"increase\".equals(action)){\n          \
    \  currentVolume = currentVolume + quantity;\n        }else{\n            currentVolume\
    \ = currentVolume - quantity;\n        }\n    }\n}\n```\n\nIn this case, you do\
    \ not have a return value because you are working with a `void` method and the\
    \ established parameters for the current volume, which is `5`. However, in `Java`,\
    \ it is also possible to have the method return an action and, for this to happen,\
    \ you will need to use the `return` keyword. In this case, it will be placed after\
    \ the function has been declared to tell it what it is you want the system to\
    \ return.\n\n### Using the Return Value\n\nSuppose you are writing a program that\
    \ you want to calculate the sum of two numbers. In this case, you would need to\
    \ use the data types that support this function. For example, we could not use\
    \ the `string` or the `boolean`, since they will not return numbers. On the other\
    \ hand, it would be possible to use `double`, `float`, `long`, and `int`. While\
    \ in the previous example, you had established variables, in the case we are about\
    \ to see, in which the `return` keyword is used, you can determine \"generic\"\
    \ arguments that will make the code more versatile. Here is an example:\n\n```java\n\
    public class ReturnExample {\n    //declare and write the arguments for the method\n\
    \    public int add(int a, int b) {\n        int c = a+b;\n        return c;\n\
    \    }\n\n    public static void main(String args[]) {\n        ReturnExample\
    \ try = new ReturnExample();\n        int add = try.add(5, 2);\n        System.out.println(\"\
    The sum of a and b is: \" + add);\n    }\n}\n```\n\nThe output in this case will\
    \ be: The sum of a and b is `7`. In this case, you will be able to declare different\
    \ values for `a` and `b` depending on what you will add inside the parentheses.\
    \ For example, if you were to change `int add = try.add(5, 2);` to `int add =\
    \ try.add(3, 2);`, the answer would now be different and it would be `5`. This\
    \ allows you to reuse the same code for different functions, bringing your code\
    \ versatility and various applications.\n\nBut you must be asking yourself, Is\
    \ it possible to have a method using different parameters or different types such\
    \ as we have now seen? The answer is yes, it is possible and there is even a technique\
    \ for it within `Java`. This is called method overloading.\n\n## Method Overloading\n\
    \nWhen writing code, it is possible to have more than one method within a specific\
    \ class. It is also possible to have the same method carrying out different tasks\
    \ and parameters. This technique is called method overloading and is an excellent\
    \ way to optimize the number of code lines you are using in your program. This\
    \ method \"allows a class to have more than one method with the same name, but\
    \ with different parameters\" by either changing the number of parameters or modifying\
    \ the data type that you are using (Great Learning Team, 2023).\n\nTo illustrate\
    \ how method overloading works, let's look at the last example we saw in the previous\
    \ section. In this case, we had the following:\n\n```java\npublic class ReturnExample\
    \ {\n    //declare and write the arguments for the method\n    public int add(int\
    \ a, int b) {\n        int c = a+b;\n        return c;\n    }\n\n    public static\
    \ void main(String args[]) {\n        ReturnExample try = new ReturnExample();\n\
    \        int add = try.add(5, 2);\n        System.out.println(\"The sum of a and\
    \ b is: \" + add);\n    }\n}\n```\n\nSuppose you were dealing with a program that\
    \ needed to deliver not only the full number as a result but also the different\
    \ numbers with decimal points. While you could create and declare a method for\
    \ each of the functions, when you use method overloading, you are giving the system\
    \ the possibility to find the same answers with one parameter. If we were to create\
    \ the answers in double, for example, the code would look like this:\n\n```java\n\
    public class CalculateSum {\n    public void line(int numberA, int numberB) {\n\
    \        int sum = numberA + numberB;\n        System.out.println(\"Using the\
    \ integer calculation, the answer is: \" +sum);\n    }\n\n    public void line(double\
    \ numberA, double numberB) {\n        double sum = numberA + numberB;\n      \
    \  System.out.println(\"Using the double calculation, the answer is: \" +sum);\n\
    \    }\n\n    public static void main(String[] args) {\n        CalculateSum calc\
    \ = new CalculateSum();\n        calc.line(4, 3);\n        calc.line(4.3, 3.6);\n\
    \    }\n}\n```\n\nIn this case, the name of the method is `line`, and the variable\
    \ is called `sum`. You have used the `line` method for both the `int` and the\
    \ `double` sum; therefore, you are overloading the method. In this case, as you\
    \ can see, instead of creating different methods and lines for the same calculation,\
    \ you only added two additional code lines and variables to obtain the result,\
    \ making the code more readable. The output for this example would be:\n\nUsing\
    \ the integer calculation, the answer is: 7\n\nUsing the double calculation, the\
    \ answer is: 7.9\n"
