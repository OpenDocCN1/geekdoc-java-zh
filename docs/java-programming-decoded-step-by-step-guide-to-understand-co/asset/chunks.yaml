  trans: "\n虽然这是一种让代码运行的简单高效的方法，但你必须记住，如果过度使用它或应用过多的语句，你的程序可能会变慢。此外，如果需要进行编辑，它也会使过程变得更加困难，因为每次更改都会涉及到多个变量。出于这个原因，Java\
    \ 中可以使用另一个条件关键字，它允许你优化代码并提高速度，从而替换不同的 if-else 语句。这种条件被称为 `switch` 语句。\n\n让我们看看\
    \ `switch` 语句是如何应用于上一个示例的：\n\n```java\npublic class Main{\n    public static void\
    \ main(String []args)\n    {\n        int day = 3;\n        switch (day){\n  \
    \          case 1:\n                System.out.println(\"Monday\");\n        \
    \        break;\n            case 2:\n                System.out.println(\"Tuesday\"\
    );\n                break;\n            case 3:\n                System.out.println(\"\
    Wednesday\");\n                break;\n            default:\n                System.out.println(\"\
    Other days of the week\");\n        }\n    }\n}\n```\n\n在这种情况下，如你所见，我们用 \"cases\"\
    \ 和 \"breaks\" 替换了 if-else 语句，这使得程序能够同样地做出决策。程序将运行所有决策，直到结束或识别出 `break` 语句。在这种情况下，你用一个语句处理不同的决策（看\
    \ `{}` 的开启和关闭位置），使得编写、编辑和测试代码变得更加简单。另一方面，代码的逻辑将不会被测试，就像使用 if-else 时那样。\n\n你看到的另一个区别是末尾有一个\
    \ `default` 关键字。如果任何条件不符合标准，则应该应用此值。这意味着如果你输入数字 1–3，你的输入与你在上一节中看到的相同。然而，如果数字与这些数字不同，输出将是\
    \ `Other days of the week`。\n\n虽然这些语句将帮助你控制程序的逻辑，但你能想象一下如果你需要创建一个倒计时程序会发生什么吗？对于屏幕上应该显示的每个输出数字，你需要写多少行代码？如果我们谈论的是\
    \ 10，那可能没那么困难，但如果我们使用计时器来计算某人执行特定任务的剩余时间呢？那无疑需要大量的代码行和时间。\n\n尽管如此，你不必担心，因为 Java\
    \ 有避免这种情况的解决方案。我们将在下一节中看到它们，它们被称为循环结构。当你编写这些语句时，它们将允许程序执行相同任务的特定次数迭代，或者直到条件为假。感兴趣吗？我敢打赌你感兴趣！让我们来看看吧！\n\
    \n## 循环结构\n\n在 Java 中编写代码时，你有三个循环可以应用于你的程序：`for`、`while` 和 `do-while` 语句。这些语句允许开发者命令程序执行多次重复（迭代），直到找到一个使语句为假的条件，或者根据代码中请求并确定的特定次数执行。本节将探索每种类型的循环、应用它们的最佳时机以及每种情况应该使用的语法。\n\
    \n### For 循环\n\n我们将看到的第一个循环是 `for` 循环。在这个循环中，你将精确地告诉程序你希望它运行的参数。由于这一特性的，大多数程序员在想要让程序执行特定次数的迭代时会使用\
    \ `for` 循环。在这种情况下，你将声明变量以及你将让它遵循的条件。\n\n假设你正在创建一个计时器，它在测试开始前需要数到五。为此，你需要创建一个使用\
    \ `for` 循环的程序来在屏幕上显示数字。在这种情况下，你将使用以下代码：\n\n```java\npublic class Main{\n    public\
    \ static void main(String []args)\n    {\n        for (int i = 1; i <= 5; i++)\
    \ {\n            System.out.println(i);\n        }\n    }\n}\n```\n\n如果你编写了这段代码并执行它，你会发现输出将是：\n\
    1\n2\n3\n4\n5\n因为你要求程序从 1 数到 5，每次增一（`++`）。如果你将这些数字替换为 0 和 10，你的答案将是一个从 0 到 10\
    \ 的数字列表。相反，如果你让列表每两个数字计数一次，那么信息将从 `i++` 变为 `i+=2`，或者每三个数字变为 `i+=3`，依此类推。\n\n你应该知道，`for`\
    \ 循环也可以减少数字，就像你正在执行倒计时一样。在这种情况下，语法不是 `int i = 1; i <= 5; i++`，而是 `int i = 10;\
    \ i >= 0; i--`，输出将是一个从 10 到 0 逐个减少的数字列表。如果你每次减少两个，你也会从 `i--` 变为 `i-=2`，或者每三个变为\
    \ `i-=3`，依此类推。在这种情况下需要注意的一点是，你只有在使用 `int` 数据类型时才能这种循环。\n\n但如果我想添加的迭代次数没有定义呢？这是一个非常好的问题！在这种情况下，我们将使用\
    \ `while` 循环，这是我们将看到的下一个循环。然而，在我们在此之前，我想让你在 IDE 中测试 `for` 循环代码看看是否理解了它。尝试使用不同的值并打印结果，以确保你掌握了。完成后，进入下一节。\n\
    \n### While 循环\n\n`while` 循环与 `for` 循环不同，它在你没有预设的迭代次数时使用。因为它会将代码作为布尔函数进行处理，直到识别为假。假设你要求程序打印语句直到它小于等于\
    \ 5。在这种情况下，代码如下：\n\n```java\npublic class Main{\n    public static void main(String\
    \ []args)\n    {\n        int i = 1;\n        while (i <= 5) {\n            System.out.println(\"\
    While loop\");\n            i++;\n        }\n    }\n}\n```\n\n如果你编写了这段代码并执行它，你会发现输出是：\n\
    While loop\nWhile loop\nWhile loop\nWhile loop\nWhile loop\n在这种情况下，程序识别出应该打印语句\
    \ \"While loop\"，直到它小于等于 5，因此我们打印了五次。由于它达到了五，程序识别出现在为“假”，迭代停止。\n\n正如我们在 `for`\
    \ 循环示例中看到的，你会发现也可以将不同的迭代从 `i++` 变为 `i+=2`，或者每三个变为 `i+=3`，依此类推。再次，此 `while` 循环只能配合\
    \ `int` 数据类型用于增加或减少数量。\n\n但如果我想同时对一个列表或一组语句执行迭代呢？这可能吗？当你想要执行一个将执行不同语句的循环时，你将使用\
    \ `do-while` 循环。让我们来看看它的特点和应用。\n"
- fmt: "\nFor our next example, we are going to put an extreme condition. We will\
    \ say that the number of the integers we are looking for is supposed to be less\
    \ than or equal to zero, with the first number being one. As you might imagine,\
    \ this should bring an error, but it won't. Do you know why? Because the program\
    \ will run the code at least once! Therefore, as an output, you will have… Can\
    \ you guess? Here is the code for you to examine.\n\n```java\npublic class Main{\n\
    \    public static void main(String []args) {\n        int i = 1;\n        do\
    \ {\n            System.out.println(i);\n            i++;\n        } while (i\
    \ <= 0);\n    }\n}\n```\n\nIf you guessed that, in this case, the output would\
    \ be `1`, you are correct! This is because you have asked the program to do a\
    \ `do-while`, and for this reason, it will return `1`. While this might not make\
    \ sense in the \"real world,\" it is a good way to see how the `do-while` loop\
    \ works. Can you imagine what would happen if the iterations were asked to be\
    \ `i+=2`? No, not `2`. The answer would still be `1` for all the other changes\
    \ you applied. The same rationale would be applied to the decrease function.\n\
    \nIf we changed the code to:\n\n```java\npublic class Main{\n    public static\
    \ void main(String []args) {\n        int i = 5;\n        do {\n            System.out.println(i);\n\
    \            i+=2;\n        } while (i <= 10);\n    }\n}\n```\n\nThis would now\
    \ mean that your first number would be `5`, and the output would be:\n\n5\n7\n\
    9\n\nNice, right? As we move on to the next section, I want to return a little\
    \ to the `switch` statement we saw some time ago. If you remember, we used `break`\
    \ keyword to leave the `switch` condition and make it \"jump\" to the next. However,\
    \ did you know that this statement can also be used to help you stop loops? They\
    \ can be used with the conditional `if` to stop loop statements if they reach\
    \ a certain condition. But let's not get ahead of ourselves.\n\nBefore moving\
    \ on, I would like you to try out the code you have seen so far in this section\
    \ if you haven't yet. It will be important to understand them since the further\
    \ along we move in the book, the more complex the code will get, and you will\
    \ need to understand the basics to comprehend what is to come. If you have done\
    \ so, let's continue! There is still a lot to be seen.\n\n## BREAK AND CONTINUE\
    \ STATEMENTS\n\nWhen you use the `break` and `continue` statements, you tell the\
    \ program to stop (`break`) or pick up (`continue`) at a certain part of the code.\
    \ This means that if you ask for the code to carry out an iteration, if you add\
    \ the `break` statement after this is done a certain number of times, the program\
    \ will automatically stop. If you want the program to skip one of the iterations\
    \ you have requested to carry out, then you will use the `continue` statement,\
    \ such as counting from 0 to 5 and skipping the number 3.\n\nAlthough we have\
    \ seen an example of the `break` statement previously, we will look into an example\
    \ of how it can be used separately from the `switch` statement. After this, we\
    \ will look closer at the `continue` statement and the different ways it can be\
    \ used.\n\n### Example 1: Print the numbers 0 to 100 and break the loop when the\
    \ count reaches 3.\n\n```java\npublic class Main{\n    public static void main(String\
    \ []args) {\n        for (int i = 0; i < 100; i++) {\n            if (i == 3)\n\
    \                break;\n            System.out.println(i);\n        }\n     \
    \   System.out.println(\"Loop Finalized\");\n    }\n}\n```\n\nThe output for this\
    \ first example would be:\n\n0\n1\n2\n3\n\nDespite having programmed the code\
    \ to print numbers 0–100 initially, you have asked that when `i=3`, the loop be\
    \ broken, and for this reason, there are only the numbers 0–3 printed in the output.\
    \ In this case, the `break` statement was used with the conditional `if` statement\
    \ that establishes what should happen for the loop to be broken.\n\n### Example\
    \ 2: Print odd numbers between 1 and 10 using the `continue` statement. Use the\
    \ `continue` statement to skip the even numbers.\n\n```java\npublic class Main{\n\
    \    public static void main(String []args) {\n        for (int i = 1; i <= 10;\
    \ i++) {\n            if (i % 2 == 0) {\n                continue;\n         \
    \   }\n            System.out.println(i);\n        }\n    }\n}\n```\n\nThe output\
    \ for this first example would be:\n\n1\n3\n5\n7\n9\n\nWhich is correct given\
    \ what you have asked the program to do. At the same time, you could replace the\
    \ statement for other conditions that use integers to carry out the process.\n\
    \n### Example 3: Compute the sum of five positive numbers. In this example, the\
    \ negative or the 0 values should not be considered and should be skipped. (For\
    \ this example, we will use an array to illustrate the exercise, despite talking\
    \ more about them in the following chapter.)\n\n```java\npublic class Main {\n\
    \    public static void main(String[] args) {\n        int[] numbers = {5, 8,\
    \ -2, 12, 4};\n        int sum = 0;\n        for (int i = 0; i < numbers.length;\
    \ i++) {\n            int num = numbers[i];\n            if (num <= 0) {\n   \
    \             System.out.println(\"Skipping negative or zero value: \" + num);\n\
    \                continue;\n            }\n            sum += num;\n        }\n\
    \        System.out.println(\"Sum of positive numbers: \" + sum);\n    }\n}\n\
    ```\n\nIn this case, the output would be:\n\nSkipping negative or zero value:\
    \ -2\nSum of positive numbers: 29\n"
