- fmt: "\nKnowing how to keep your program running even when there are errors is an\
    \ essential skill for all developers. In this chapter, we are going to highlight\
    \ the importance of handling exceptions in Java. You will learn how to effectively\
    \ understand, catch, and manage these errors, ensuring that the program you have\
    \ created is running according to plan in its execution.\n\nAdditionally, you\
    \ will also learn how to apply the `try-catch` and the `finally` blocks in your\
    \ code to help you handle errors and optimize production. Get ready to understand\
    \ what expectations are, how to solve them, and make your program's flow the best\
    \ it can be. You will certainly be impressed and impress others as well.\n\n#\
    \ UNDER EXCEPTIONS\n\nWhen an exception happens, we are talking about an undesired\
    \ event happening during the execution of the program. Although this is normal,\
    \ it is important to be aware of them so that your program's flow is not affected.\
    \ The exception can happen in a method or an object, and the main exceptions a\
    \ developer can deal with are:\n\n* code errors\n* device failure\n* invalid user\
    \ input\n* loss of network connection\n* opening an unavailable file\n* physical\
    \ limitations (out-of-disk memory) (GeeksforGeeks, 2023a)\n\nThe main difference\
    \ between an event being named an exception or an error is how it can be solved.\
    \ Exceptions can usually be solved by modifying something that is affecting the\
    \ process. On the other hand, when you have an error, these usually cannot help\
    \ the code be recovered, such as \"Java virtual machine (JVM) running out of memory,\
    \ memory leaks, stack overflow errors, library incompatibility, infinite recursion,\
    \ [and so on]. Errors are usually beyond the control of the programmer, and we\
    \ should not try to handle errors\" (GeeksforGeeks, 2023a).\n\nRegardless of whether\
    \ you are using an IDE or not, usually, the error in the code will be shown, and\
    \ you will be able to identify what is wrong. Sometimes, it might just be a semicolon\
    \ missing or another matter that is easily managed by the developer. To help you\
    \ solve different exceptions, there are a few ways enabled by the language, such\
    \ as applying the `try-and-catch` or using the `finally` statement. You will learn\
    \ about both of these in this chapter.\n\n# HANDLING EXCEPTIONS WITH TRY AND CATCH\n\
    \nCoding can be a complex process that might demand you create a way to handle\
    \ an exception in case the request you are asking to be carried out generates\
    \ an error. For example, if you are trying to divide a number by zero, it would\
    \ lead to an error because this is not possible. Nevertheless, if you are creating\
    \ a calculator, even if the operation is not allowed, you can still request it\
    \ to be done.\n\nFor these cases, you will use the `try-and-catch` statements:\
    \ The `try` statement will be used to tell the program what it is that you want\
    \ to test, and the `catch` statement will define the block of code you want to\
    \ execute. Both of these come in pairs, though you will always have one `try`\
    \ statement but one or more `catch` blocks. This is the simplest way to handle\
    \ an exception when coding in Java.\n\nHere is an example of how a code would\
    \ work when dividing by zero with the `try-and-catch` exception:\n\n```java\n\
    import java.util.Scanner;\n\npublic class ExceptionHandlingExample {\n\n    public\
    \ static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
    \        try {\n            // Get input from the user\n            System.out.print(\"\
    Enter a number: \");\n            int numerator = scanner.nextInt();\n       \
    \     System.out.print(\"Enter another number: \");\n            int denominator\
    \ = scanner.nextInt();\n            // Perform division\n            int result\
    \ = divideNumbers(numerator, denominator);\n            // Display the result\n\
    \            System.out.println(\"Result: \" + result);\n        } catch (ArithmeticException\
    \ e) {\n            // Handle division by zero exception\n            System.out.println(\"\
    Error: Division by zero is not allowed.\");\n        } catch (Exception e) {\n\
    \            // Handle other exceptions\n            System.out.println(\"An error\
    \ occurred: \" + e.getMessage());\n        } finally {\n            // Close the\
    \ scanner in the finally block to ensure it's always executed\n            scanner.close();\n\
    \        }\n    }\n\n    private static int divideNumbers(int numerator, int denominator)\
    \ {\n        // Attempt to perform division\n        return numerator / denominator;\n\
    \    }\n}\n```\n\nThe output, in this case, would be the following:\n\nExecution\
    \ without the exception\nEnter a number: 9\nEnter another number: 3\nResult: 3\n\
    \nExecution with the exception\nEnter a number: 6\nEnter another number: 0\nError:\
    \ Division by zero is not allowed.\n\nYou might have noticed that in the code\
    \ that was shown above, there was a keyword that we have not used yet: `finally`.\
    \ In this case, `finally` is not necessary, but adding it will help you prevent\
