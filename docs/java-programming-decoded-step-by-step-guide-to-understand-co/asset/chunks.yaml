    \    return String.join(\"\\n\", lines);\n} catch (IOException e) {\n    e.printStackTrace();\n\
    \    return \"\";\n}\n}\n\nprivate static void deleteFile(Path filePath) {\n \
    \   try {\n        Files.deleteIfExists(filePath);\n    } catch (IOException e)\
    \ {\n        e.printStackTrace();\n    }\n}\n\n// Task 2 - 使用 NIO 对象序列化\n\nprivate\
    \ static void serializeObject(Student student, Path filePath) {\n    try (ObjectOutputStream\
    \ oos = new ObjectOutputStream(Files.newOutputStream(filePath))) {\n        oos.writeObject(student);\n\
    \    } catch (IOException e) {\n        e.printStackTrace();\n    }\n}\n\nprivate\
    \ static Student deserializeObject(Path filePath) {\n    Student student = null;\n\
    \    try (ObjectInputStream ois = new ObjectInputStream(Files.newInputStream(filePath)))\
    \ {\n        student = (Student) ois.readObject();\n    } catch (IOException |\
    \ ClassNotFoundException e) {\n        e.printStackTrace();\n    }\n    return\
    \ student;\n}}}\n\n// Student 类保持不变\n\nclass Student implements Serializable {\n\
    \    String name;\n    int age;\n    char grade;\n\n    public Student(String\
    \ name, int age, char grade) {\n        this.name = name;\n        this.age =\
    \ age;\n        this.grade = grade;\n    }\n\n    @Override\n    public String\
    \ toString() {\n        return \"Student{name='\" + name + \"', age=\" + age +\
    \ \", grade=\" + grade + '}';\n    }\n}\n```\n\n## 第 9 章\n\n1. a. `concat()`\n\
    2. b. `length()`\n3. c. `Date`\n4. a. `abs()`\n5. b. `nextInt()`\n6. a. `Set`\n\
    7. a. `add()`\n8. a. `Map<String, Integer> myMap = new HashMap<>();`\n9. a. `ArrayList`\
    \ 允许随机访问，而 `LinkedList` 在插入和删除时效率更高\n10. c. `HashSet`\n\n## 第 10 章\n\n```java\n\
    import javax.swing.*;\nimport java.awt.*;\nimport java.awt.event.ActionEvent;\n\
    import java.awt.event.ActionListener;\n\npublic class FormSubmissionApp {\n  \
    \  public static void main(String[] args) {\n        // 创建主框架\n        JFrame\
    \ frame = new JFrame(\"表单提交应用\");\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        frame.setSize(300, 200);\n\n        // 创建并设置布局管理器\n        JPanel panel\
    \ = new JPanel();\n        panel.setLayout(new GridLayout(3, 2));\n\n        //\
    \ 创建组件\n        JLabel nameLabel = new JLabel(\"Name:\");\n        JTextField\
    \ nameField = new JTextField();\n        JLabel ageLabel = new JLabel(\"Age:\"\
    );\n        JTextField ageField = new JTextField();\n        JButton submitButton\
    \ = new JButton(\"Submit\");\n\n        // 将组件添加到面板\n        panel.add(nameLabel);\n\
    \        panel.add(nameField);\n        panel.add(ageLabel);\n        panel.add(ageField);\n\
    \        panel.add(new JLabel()); // 用于间距的空标签\n        panel.add(submitButton);\n\
    \n        // 为按钮添加监听器\n        submitButton.addActionListener(new ActionListener()\
    \ {\n            @Override\n            public void actionPerformed(ActionEvent\
    \ e) {\n                // 处理按钮点击\n                String name = nameField.getText();\n\
    \                String age = ageField.getText();\n                System.out.println(\"\
    Name: \" + name);\n                System.out.println(\"Age: \" + age);\n    \
    \        }\n        });\n\n        // 将面板添加到框架\n        frame.add(panel);\n  \
    \      // 设置框架可见性\n        frame.setVisible(true);\n    }\n}\n```\n\n## 第 11 章\n\
    \n在查看答案之前，这里有一些你可能需要考虑的说明：\n\n1. 编译代码：\n   - 将服务器代码保存为名为 `ChatServer.java` 的文件。\n\
    \   - 将客户端代码保存为名为 `ChatClient.java` 的文件。\n   - 将客户端处理器代码保存为名为 `ClientHandler.java`\
    \ 的文件。\n   - 打开终端并使用 `javac` 命令分别编译服务器、客户端和客户端处理器类：\n```bash\njavac ChatServer.java\n\
    javac ChatClient.java\njavac ClientHandler.java\n```\n\n2. 运行服务器：在同一个终端中，使用 `java`\
    \ 命令运行服务器：\n```bash\njava ChatServer\n```\n服务器将开始在端口 8080 上监听。\n\n3. 运行客户端：为每个客户端打开新的终端，并在每个终端中运行客户端：\n\
    ```bash\njava ChatClient\n```\n每个客户端都将连接到服务器。\n\n4. 聊天：在客户端终端中输入消息，消息将广播给所有连接的客户端。\n\
    \n5. 终止：\n   - 若要终止客户端，请在其终端中按下 `Ctrl+C`。\n   - 若要终止服务器，请在其终端中按下 `Ctrl+C`。\n\n\
    ChatServer:\n```java\nimport java.io.*;\nimport java.net.ServerSocket;\nimport\
    \ java.net.Socket;\nimport java.util.HashSet;\nimport java.util.Set;\n\npublic\
    \ class ChatServer {\n    private static final int PORT = 8082;\n    static Set<PrintWriter>\
    \ clientWriters = new HashSet<>();\n\n    public static void main(String[] args)\
    \ {\n        try {\n            ServerSocket serverSocket = new ServerSocket(PORT);\n\
    \            System.out.println(\"Server listening on port \" + PORT);\n     \
    \       while (true) {\n                Socket clientSocket = serverSocket.accept();\n\
    \                PrintWriter writer = new PrintWriter(clientSocket.getOutputStream(),\
    \ true);\n                clientWriters.add(writer);\n                Thread clientHandler\
    \ = new ClientHandler(clientSocket, writer);\n                clientHandler.start();\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n\n    public static void broadcastMessage(String message, PrintWriter\
    \ sender) {\n        for (PrintWriter writer : clientWriters) {\n            if\
    \ (writer != sender) {\n                writer.println(message);\n           \
    \ }\n        }\n    }\n}\n```\n\nClientHandler:\n```java\nimport java.io.*;\n\
    import java.net.Socket;\n\npublic class ClientHandler implements Runnable {\n\
    \    private Socket clientSocket;\n    private PrintWriter writer;\n\n    public\
    \ ClientHandler(Socket clientSocket, PrintWriter writer) {\n        this.clientSocket\
    \ = clientSocket;\n        this.writer = writer;\n    }\n\n    @Override\n   \
    \ public void run() {\n        try {\n            BufferedReader in = new BufferedReader(new\
    \ InputStreamReader(clientSocket.getInputStream()));\n            String message;\n\
    \            while ((message = in.readLine()) != null) {\n                ChatServer.broadcastMessage(message,\
    \ writer);\n            }\n        } catch (IOException e) {\n            // 处理异常\n\
    \            System.out.println(\"Client disconnected.\");\n            ChatServer.clientWriters.remove(writer);\n\
    \        }\n    }\n}\n```\n\nChatClient:\n```java\nimport java.io.*;\nimport java.net.Socket;\n\
    import java.util.Scanner;\n\npublic class ChatClient {\n    public static void\
    \ main(String[] args) {\n        try {\n            Socket socket = new Socket(\"\
    localhost\", 8082);\n            BufferedReader in = new BufferedReader(new InputStreamReader(socket.getInputStream()));\n\
    \            PrintWriter writer = new PrintWriter(socket.getOutputStream(), true);\n\
    \            Scanner scanner = new Scanner(System.in);\n\n            Thread messageReceiver\
    \ = new Thread(() -> {\n                try {\n                    String message;\n\
    \                    while ((message = in.readLine()) != null) {\n           \
    \             System.out.println(message);\n                    }\n          \
    \      } catch (IOException e) {\n                    e.printStackTrace();\n \
    \               }\n            });\n            messageReceiver.start();\n\n \
    \           // 读取用户输入并发送到服务器\n            while (true) {\n                String\
    \ message = scanner.nextLine();\n                writer.println(message);\n  \
    \          }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n"
