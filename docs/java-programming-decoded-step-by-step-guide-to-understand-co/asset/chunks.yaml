    If you are using an IDE to write your code, you are applying a best practice that
    will help you debug the code, since these have tools that will enable you to do
    this. In Eclipse, for example, you will be able to add breakpoints and watchpoints
    that will divide the code and make it run in parts. This will enable you to find
    the code block that has a problem per section. Eclipse also has a watch and inspect
    section that will enable you to check values while debugging, a useful feature
    that will help you understand why the output is as it is (How to Debug Java Errors,
    2019).


    If using the IntelliJ IDE, there are also a few tools you will be able to implement,
    similar to those in Eclipse. Nevertheless, if you are not using an IDE for your
    code, Monus (2020) suggests powerful Java code debugging tools you can download
    and use on your computer that include software for these purposes and even other
    online or open-source IDEs. They include and also expand to:


    *   Java Discovery Protocol


    *   JDeveloper


    *   NetBeans


    *   Raygun Crash Reporting


    *   Rookout


    *   The Java Debugger (jdb)


    *   Visual Studio Code


    ## UNIT TESTING WITH JUNIT FRAMEWORK


    When we are talking about unit testing, the benchmark is a program named JUnit.
    In this open-source framework, the developer can run automated tests that will
    show the results in graphs and other statistics that enable the code to be more
    reliable and bug-free. By testing the code "units" or small pieces of code, you
    will be able to break it down into segments that make the testing process more
    efficient (Gaba, 2023).


    ## WRITING TEST CASES'
