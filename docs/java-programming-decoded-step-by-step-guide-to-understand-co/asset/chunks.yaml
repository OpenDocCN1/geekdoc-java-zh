    \ 12 个内使用过。对于 16% 的人来说，Java 是他们喜欢的编程语言，仅次于 Python。\n\n然而，同一项研究还显示，大约 35% 的初级 Java\
    \ 程序员在理解复杂代码和高效调试方面面临困难。这些数据强调了对全面资源的需求，而这正是我们本书的设计初衷。\n\n"
- fmt: '

    This is where this book comes in. It has been developed as a comprehensive guide
    to help aspiring Java developers and those who have been in the market for some
    time decode the secrets of coding by using it. From understanding the core concepts
    of the language to learning how to debug and test the programs you created efficiently,
    all the information you need to propel your career as a professional Java developer
    will be found in this book.


    Here are some benefits for those reading this book:


    * Fast-track learning: This book is an express elevator to the top floors of Java
    programming knowledge. It eliminates the necessity of wading through a sea of
    disjointed online resources and provides a structured and comprehensive learning
    journey.

    * Practical code examples: The book is laden with practical examples of code,
    guiding you through understanding and writing Java code. This hands-on approach
    will help you learn faster and better.

    * Understand core concepts: Break down complex Java programming jargon and concepts
    into digestible bites. Grasp the core concepts that form the basis of Java programming,
    solidifying your foundation.

    * Demystify debugging: Debugging can be a daunting task for beginners. With this
    guide, you''ll acquire effective debugging strategies to help you handle errors
    confidently and improve your code quality.

    * Introduction to advanced topics: Venture beyond the basics with a primer on
    advanced Java topics such as networking and graphical user interface (GUI) programming.
    This equips you to take on more complex projects and expand your skills.

    * Career preparation: Whether you''re aspiring to land a job in a top tech firm
    or considering launching your app, the skills you''ll acquire from this book will
    significantly enhance your portfolio and employability.


    In addition to all the previously mentioned benefits, this comprehensive guide
    is written in an easy-to-understand and accessible language for professionals
    of all different levels. Starting in the first chapter, the straightforward approach
    to writing code will motivate you to continue learning and developing your skills.
    As you continue to read, you will undoubtedly feel motivated to continue as you
    see the content you have learned implemented in the provided exercises.


    If you are new to the programming world and unsure if this is the right book for
    you, rest assured you will find the information you seek. The concepts in this
    book are applicable to beginners starting their journey, as well as more experienced
    developers who want to review what they know and increase their knowledge. The
    first stop of this journey will be to understand what Java is and what you need
    to start coding today.


    ## WHAT IS JAVA?


    Java is a programming language created in 1995 by Sun Microsystems, currently
    on version `21`. However, this is not the version used by most developers, who
    prefer `Java 8`, `11`, or `7`. Java is used in the development of several different
    applications, including mobile device applications, medical devices, and websites.
    Although the name is similar, Java should not be confused with `JavaScript`. While
    both technologies are a development language, this and the name are their only
    similarities.


    One of Java''s main characteristics is that it is an object-oriented language,
    which means that rather than using logic and functions in the code, it is designed
    around data, or "objects," that establish the attributes and the message a program
    needs to send. For comparison''s sake, it is possible to say that the syntax and
    rules applied by Java are based on those observed in the `C` and `C++` languages.


    The central premise that rules Java is that it enables the developer to "write
    once, run anywhere." This description is the foundation stone of the language
    since its main objective is to be a portable language, easily transported between
    devices. In addition, Java''s versatility enables it to be used with any operating
    system (`Android`, `Linux`, `iOS`, or `Windows`) and have the platform change
    if needed without needing to adjust the code.


    Because Java has been around for so long, another advantage the beginner will
    find is its huge online community. However, this community is not only restricted
    to the users who support each other but also includes libraries, repositories,
    and troubleshooting information and documentation that enable an efficient problem-solving
    approach. Essentially speaking, when you start learning Java, you will find you
    have access to numerous tools and resources to help you during the development
    and debugging process.


    ## PREREQUISITES TO LEARN AND START WORKING WITH JAVA


    Although some people say that you must have at least certain experience with programming
    to learn Java, this is not necessarily true. While those who do have it might
    have an advantage in understanding the concepts and be more familiarized with
    the logic of object-oriented programming (`OOP`), this does not mean that, as
    a beginner, you will be able to learn. In fact, many people find it easier to
    learn Java without experience because they do not have any previous context to
    confuse them.


    Another concern is the need for a powerful computer to process incredible amounts
    of information. While this is undoubtedly an advantage, it is optional for learning
    Java. In fact, some developers have machines with average processing capacity
    and memory and do just fine. Additionally, while most professionals work with
    integrated development environments (`IDEs`), it is possible to start coding in
    Java with the notepad available on your computer.


    This book teaches you how to set up and use the Java `IDE`, which will later help
    you debug and learn more advanced tools. However, if you cannot set it up on your
    computer, there is no need to worry! You can use your computer notepad to develop
    and run the code later; the only difference is that you might have more difficulty
    debugging and finding code errors when you test what you have written.


    If you are ready to start your journey into learning one of the most relevant
    programming languages in the market, then I encourage you to read on! It is recommended
    you keep your computer next to you while reading to practice the code and any
    other techniques being taught. We will start with a small introduction to Java
    applications and how to set up the different development environments on your
    computer. Hence, you will be fully prepared to start writing your first code lines!


    ## CHAPTER 1: GETTING STARTED WITH JAVA


    If you are just beginning your programming journey, you might be curious about
    some of the digital applications that use Java in their structures. You might
    not be surprised that, since it is such a popular language, platforms such as
    `Amazon`, `Netflix`, `Spotify`, `Santander`, `Airbnb`, and `Goldman Sachs` use
    Java in their programs. In fact, according to `Svet (2023)`, 90% of Fortune 500
    companies resort to Java as their preferred programming language when developing
    new software.


    In this chapter, we will explore the history behind the start of programming and
    how Java became the significant language it is today in the computer science community.
    In addition, you will learn how to install your Java development environment,
    set up everything you need, and, as promised, write your first code!

