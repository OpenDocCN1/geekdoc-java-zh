    \ `Word` 提供了所有工具，在其中进行操作会让过程变得更容易。\n\n因此，在书中，你将获得使用 `IDE` 的选项，这是被高度推荐的。在这种情况下，Java\
    \ 最受欢迎的前三个 `IDE` 是 `IntelliJ`、`Eclipse` 和 `VSCode`。你可以选择其中任何一个（以及许多其他）来进行编码过程。\n\
