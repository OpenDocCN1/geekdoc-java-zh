    When programming in Java, you must name everything you code (classes, methods,
    and variables), meaning they will have identifiers. According to the Java code
    structure, these must always begin with an uppercase or lowercase letter from
    `A` to `Z` and an underscore (`_`) or the dollar sign (`$`). Identifiers cannot
    start with anything else, including numbers or other special characters. Here,
    it is always crucial to remember these will have different meanings if you use
    the uppercase or the lowercase.


    Finally, you have the code line `public static void main (String[] args)`, which
    is what will enable Java to process what you have asked it to do. This line of
    code will be implemented in all the code you will write in Java. This is because
    it will give the command, as in your case, the one to "print" the Hello World
    code.


    Although this was not seen in the code, you might run into the case where it is
    written like this:


    ```java

    /*this is the code you are going

    *to use if you want to print

    *in your program Hello World

    */


    //here is the package

    package <selected.name>


    //this is the class

    public class <ClassName> {


    //this is the main method, named as "main"

    public static void main (String[] args) {


    //this is print statement

    System.out.println("Hello World");


    }


    }

    ```


    You will see that the code instructions were used by adding the `//` symbols or
    the `/*` symbols. These standards should be used when you want to comment on the
    code that you are creating. In this case, you are going to use `//` for comment
    codes that have one line and `/*` to start comments that have more than one line;
    the next line should always start with `*`, and after you are done writing, you
    should finish with `*/` to indicate that the comment has ended.


    Another thing that you might have noticed is that the above code has indentations,
    which means they are not aligned left. While some programming languages, such
    as Python, have indentations as a mandatory requisite for the code to function,
    this is not the case in Java. This means you can write your code without indenting
    if you are not using an IDE. Nevertheless, you should note that using IDEs such
    as `Eclipse` will automatically indent the code.


    Finally, it is important to note two things about codes in Java: The first is
    that most experienced developers use the names for classes, methods, and instances
    that refer to what they will do. This leads to a more understandable and cleaner
    code, enabling other developers to understand the intention behind the syntax
    was. The second is that many developers do not like comments to be used in the
    code. They claim this makes the code "dirty" and makes understanding it more difficult.


    Most of this information is available in documents known as Java conventions.
    While these are not "rules" that will determine if your code will work, they are
    standard Java coding applications that most developers use to ensure their code
    can be read by anyone who needs to. Explaining all the Java conventions in this
    section would not make sense because there would be some elements you would not
    understand. However, to ensure you are acquainted with the best practices in the
    market, convention applications will be explained throughout the book''s content
    as necessary.


    ### Reserved Words


    One last thing you should know, which is crucial for coding in Java, is that the
    language has what are known as reserved words. These words have a particular application
    when used with the code; therefore, they cannot be used to name variables, classes,
    or methods, for example. You will likely memorize the terms in this table as time
    passes and you obtain more experience with Java, so there is no need to worry!
    In addition, you will see that as you read, many of them will be explained; therefore,
    you will immediately understand they should not be used. If you need extra help
    remembering them, try printing or writing them out so you can easily refer to
    them when needed.


    Here is the list of Java''s 53 reserved words:


    ![](image_rsrc4ZR.jpg)


    As we move to the last part of the chapter, you are going to learn how to compile
    and run the Java programs you create. While this process is automatic when using
    the IDE, it is important you know that carrying out these actions and commands
    can be done without using one. In addition to this, you will learn about the difference
    between the Java interpreter and the compiler, essential parts of the Java package.


    ### COMPILING AND RUNNING JAVA PROGRAMS


    Just as the computer does not understand "human" language when you write the code
    in Java, it is not yet ready to be understood by the machine. This is because
    computers only understand the binary language, the allocations of "0"s and "1"s
    that it comprehends. When you have the Java compiler, or the `javac`, it will
    act as a "translator" that transforms what you have written in code format into
    computer language. As the name suggests, the interpreter has the same function:
    to convert the code into computer code so the machine knows what it must do.


    But you might be asking, Does this mean the compiler and the interpreter are the
    same thing? This is an excellent question. While they act similarly, they have
    one fundamental difference: While the compiler scans the whole code and only then
    translates it, the interpreter will do this line by line and translate it simultaneously.
    If there are any mistakes in your code, the interpreter will catch them as it
    reads each code line, while the compiler will do this once it is finished scanning.


    As you might imagine, this difference significantly impacts a program''s performance
    and debugging. If you are running your code through the compiler, you will see
    all the errors that need to be fixed at once, which might take a long time since
    once you want to test it, it will need to run all the code again. This can lead
    to a tedious process, especially if the code is extensive. However, if correct,
    it enables the software to run faster since it will read and interpret the complete
    commands.


    The interpreter will act with the exact opposite characteristics. If you imagine
    running a code line by line, you will see it enables faster debugging since you
    will "attack" each problem as you go, and it will only move on to the following
    line if it works. This means that the code will only stop if there is a mistake.
    On the other hand, executing this program can take longer since it will read each
    unique line of code to carry out the needed action.


    When you use an IDE, this process is embedded in the software, showing you exactly
    where the problem is and doing it fast. Additionally, it might help you correct
    any problems that can be solved without the interference of the developer or tell
    you where you need to add more code. As mentioned earlier, you should learn how
    to compile code on your computer without using the IDE.


    To do this, you must ensure the `JDK` is installed. However, instead of using
    the workspace in the IDE to type in what you need, you will open `Notepad` (or
    a similar application) on your computer. Now, remember that the steps you are
    going to read refer to `Windows OS`, but a similar approach can be used for whichever
    other OS you might have.


    You will type in the code we have seen in the previous section:


    ```java

    public class JavaProgram {


    public static void main (String[] args) {


    System.out.println("Hello World");


    }


    }

    ```

