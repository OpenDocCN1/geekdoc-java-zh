    \   a. 将方法设为公共（public）\n   b. 将方法设为私有（private）\n   c. 使用 \"static\" 关键字\n   d.\
    \ 实现接口\n\n9. Java 中用于强制类型转换的关键字是什么？\n   a. cast\n   b. to\n   c. convert\n   d.\
