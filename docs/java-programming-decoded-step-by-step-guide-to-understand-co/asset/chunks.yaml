    # 引言


    为了理解编程，我希望你思考以下情况：假设你买了一件需要组装的家具。由于我们大多数人并不是该领域的专家，因此我们需要一份说明书来遵循必须执行的步骤，以实现所需的结果。这不仅适用于家具，也适用于任何你不具备所需知识来完成、需要指导以确保结果符合预期的任务，例如：烹饪、驾驶等。


    同样的逻辑也适用于编程：除非你告诉计算机你想让它做什么以及如何做，否则它并不知道你想让它做什么，也不清楚如何执行。这就是编码大用用场：它使用特定的语言或代码，根据特定的指令告诉程序或计算机它应该做什么。你可以使用这些代码来告诉计算机如何解决问题、处理信息以及执行其他若干任务。


    然而，计算机通常无法“理解”人类语言。这意味着，例如，在创建软件时，你不能直接说“创建一个程序来为我求解数学方程”。计算机不会理解这句话，因为它们有一种特定的语言（或多种语言，称为方言）用于与它们进行通信。这些方言将通过将我们的语言转换为计算机能理解的语言，来“翻译”我们人类想要机器执行的操作。这些语言包括例如：`Python`、`Go`、`Rust`、`NodeJS`、`Elixir`、`C`、`C++`
    以及的 `Java`。


    通过使用这些语言来指令和“编写”计算机，开发者可以告诉它们应该做什么。从简单的任务（如在计算机上打开文字处理软件）到让计算机在人工智能应用中模仿人类语言，都是通过编程语言实现的。几乎所有与使用计算机的操作涉及到编程语言。


    现在，关键部分在本本书中出现了：当你想要与计算机“通信”时，你将使用允许你实现此点的语言之一。你的语言选择取决于两点：1. 你熟悉的语言；2. 你需要做什么。在这种情况下，语言的选择将直接反映你的个人偏好、你最适应的程度，以及更重要的是，你想要活跃的市场。


    诚然，某些语言被认为更容易学习，而另一些则更难。然而，由于由于位位读者都有自己的偏好，对它们进行分类是不负责任的。尽管如此，随着本章深入，我们将解释 `Java`
    的主要特征以及它与其他可用语言的区别。


    根据 Coursera (2023)，编程语言可以分为以下五类：


    1. 脚本语言

    2. 过程化编程语言

    3. 逻辑编程语言

    4. 函数式编程语言

    5. OOP（面向对象）语言


    这可能会引发问题：`Java` 属于哪一类？这是一个非常好的点。让我们来看看 `Java` 属于哪些类别，并开始探索它的特性。


    ## JAVA 概述


    在面向对象的语言中，`Java` 以成为最重要的编程语言之一而闻名。当它在 1995 年发布时，`Java` “并没有革命性的元素，但其成功的关键在于以正确的方式结合这些元素，并从前者的优缺点中学习。微软后来利用
    `Java` 的经验在开发 `C#` 时使用了这种方法”（Izydorczyk, 2022）。正如你所想象的，这种成功的方法引起了开发者市场的关注，许多人学习了如何使用它。


    在谈论 `Java` 时，如果不提到它曾广为人知的“一次编写，随运行”（WORA）这一之前的“格言”，将是不可能的，尽管这在现在已不再完全准确。这在当时是一个巨大的优势，意味着你可以在所有支持的平台上运行用
    `Java` 开发的程序，而无需调整或重新编译代码。随着对技术可用性需求增加以及更多软件的发展，这成为了吸引许多人使用它以及公司实施它的另一个吸引点。


    事实上，许多公司继续在程序中使用 `Java`，是因为了解它的开发者数量惊人，而且它具有可靠性。此外，该语言不断地进行更新和改进，这意味着它随着市场的变化而不断演变和适应。它为开发者提供的适应大多数情况的灵活性仍然是一个具有吸引力的属性，使得学习用
    `Java` 编码成为技术市场上的一项有价值的技能。


    最后，至关重要的是提到 `Java` 的“年龄”已成为它最重要的资产之一。“Java` 鼓励解决方案的成熟，并拥有庞大的社区。很难找到没有与 Java 预集成的技术或未由外部库提供的功能”（Izydorczyk,
    2022）。这意味着，即使你感兴趣于学习更“现代”的语言（如 `Kotlin`），拥有 `Java` 的备知识也会让旅程变得更容易，其他方言也是如此。


    现在你已经对 `Java` 的特性有了清晰的认识，是时候开始工作了。你需要做的第一件事是安装所谓的 Java 开发工具包（`JDK`），你需要它来编写代码。我们来看看它是什么以及执行这一过程的性吗？


    ## 安装 Java 开发工具包


    要开始使用 `Java`，你需要将 `JDK` 下载到计算机中。回到我们构建家具的类比，`JDK` 类似于需要锤子和螺丝刀来组装零件。或者就像烹饪时的锅、炉子和勺子。从本质上说，`JDK`
    将提供编写、编译和运行 `Java` 代码所需的工具。“Java 开发工具包（JDK）是 Java 编程使用的三个核心技术包之一，另外 JVM（Java 虚拟机）和
    JRE（Java 运行环境）”（Tyson, 2022）。这三个技术部分可以描述为：


    * `JDK`: 用于开发软件或简单的编写、编译和执行代码，提供让程序在 `JRE` 和 `JVM` 中运行的工具。

    * `JRE`: 用于运行开发的代码，它是 JDK 的一部分，因为你需要运行代码。

    * `JVM`: 用于托管运行程序，并将给出的指令“翻译”成计算机可以理解和解释的语言，使其执行指令。


    现在你已经了解了设置 Java 环境的关键组件，让我们来看看安装它们的步骤。


    1. 访问 [Oracle.com](http://Oracle.com) 网站。

    2. 在顶部选项卡下，在“Products”找到最后部分的“Hardware and Software”，并点击“Java”。

    3. 点击“Download Java”按钮。

    4. 在“Java downloads”部分，根据你使用的操作系统（Linux, macOS 或 Windows）选择 `JDK` 21 或 17。

    5. 根据你计算机的规格和需求选择要下载的工具包。


    注意：在本书中指令将基于 Windows 操作系统。不过，你可以在网站提供的文档中找到任何不同操作系统的规格。

    6. 确保你有 64 位的 Windows 平台以下载工具包。

    7. 点击提供的列表中的链接开始下载。你需要根据你使用的 Windows 版本签署许可协议并在计算机上保存可执行文件（`.exe`）。


