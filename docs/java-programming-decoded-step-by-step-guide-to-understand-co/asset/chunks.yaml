  trans: "\n在 `LinkedList` 中，元素与下一个元素和上一个元素连接，这意味着它们是双向链接的。因此，添加和删除项目的速度更快，但检索列表元素的速度较慢。如果你将这两段代码都添加到你的\
    \ IDE 中，可能不会立即看到区别，但在处理大量元素时，这种差异是显而易见的。最后，你会发现这种类型集合的代码中，有一条语句读取为 `int index\
    \ = numbers.indexOf(2);`。这种 `LinkedList` 特有的元素将让你能够更轻松、更快速地定位元素的索引。\n\n## 由你来尝试！\n\
    \n为了检查你是否掌握了本章的内容，这里有七道涵盖其内容的练习题。你可以在书末找到这些题的答案。即使你全部做对了，我也鼓励你继续探索并更改变量，以帮助你记住目前所看到的内容。\n\
    \n1. 编写一个 `Java` 程序，使用整数数组创建一个整数数组，并在该数组内确定所有元素的和、最大值和最小值、对数组对数字进行升序排序，并计算元素的平均值。\n\
    2. 在 `Java` 中使用 `ArrayList` 创建一个字符串列表。在这个示例中，你应该使用该列表来添加、删除和更新元素，检查特定元素是否存在、查找长度，并使用\
    \ `for-each` 循环迭代并打印每个元素。\n3. 创建一个整数数组并将其转换为 `ArrayList`。执行添加、删除和迭代等列表操作。\n4.\
    \ 创建一个二维数组（矩阵），并执行包括元素加法、减法、乘法、元素转置以及寻找方行列式的操作。超级挑战：在 `Java` 中使用 `LinkedList`\
    \ 或 `ArrayDeque` 创建队列并执行操作（`enqueue`、`dequeue`），并创建一个栈并执行操作（`push`、`pop`）。\n\n\
    如果你的主意是在 `Java` 中处理数据，那么这无疑对你来说是最重要的章节之一，因为它们对于优化你的时间至关重要。在下一章中，我们将深入探讨 `Java`\
    \ 的方法，并理解这些结构结构是如何帮助它的。如果你已经准备好发现 `Java` 的力量，请进入下一章，学习如何掌握 `Java` 中的方法。\n\n##\
    \ 第 5 章：精通 Java 方法\n\n当我们盖房子时，为了让它立起来，它需要梁柱和结构来抵抗它可能面临的不同挑战。如果房子没有“脊梁”，它就无法立。在\
    \ `Java` 中，方法的工作方式也是类似的，因为它们提供了代码运行所需的组织结构。在本章中，你将学习该语言的核心概念，包括方法参数、返回值、它们的工作原理、称为方法重载的技术以及变量作用域。你会发现这些方法赋予了代码所需的灵活性，使其能够运行，甚至在需要时被重用。方法是执行动作的实体。如果你准备好学习更多关于\
    \ `Java` 方法以及如何使用它们，请继续阅读！你旅程最重要的部分之一就是开始。\n\n## 方法简介\n\n想一下一家酒店。里面有很多员工承担着不同的任务：接待、客房服务、维修、烹饪、清洁等。这些人中的每一个人都根据一组指令执行一项特定的任务，这些指令允许他们完成工作。这正是方法所做的事情。当你应用它时，你是在给代码提供所需的指令，让它只针对那个特定实例执行操作。在之前的示例中，你已经见过方法，但它们没有被命名。在下面的示例中，我们有如下拆解：\n\
    \n```java\n// 建立类的名称\npublic class Main {\n    // 建立名为 myMethod 的方法（应该使用驼峰命名法）\n\
    \    // 不返回任何内容 (void)，并为逻辑提供参数\n    // 在方法内部你可以使用 ints 和 strings 来创建你需要执行的动作\n\
    \    public void myMethod (int parameter1, String parameter2){\n\n}\n}\n```\n\n\
    在这种情况下，我们创建了一个不返回任何值的逻辑，但对于你将要看到的所有代码来说并不一定如此。在另一个示例中，我们可以创建 `volume` 方法，并在逻辑中确定我们想要应用程序返回一个特定的体积。例如，当你有一个像\
    \ Alexa 这样的虚拟助手时，你会要求它“增大音量”，它会做的获取当前音量（`current volume`）并加上请求的增量使其声音更大。同时，这个方法可以被重用，因为你将应用相同的逻辑来减少音量。在这种情况下，方法将有两个参数：`action`（即增大或减小音量）以及应该增加或减少多少。\n\
    \n这展示了方法的灵活性，允许你为不同的应用程序重用代码，使你的代码行具有可读性、多功能性和可重用性。然而，为了确定方法需要做什么，必须声明并调用它，以便它可以执行必要的动作。让我们看看在不同的\
    \ Java 编码示例中这将是什么样的。\n\n## 方法的声明与调用\n\n在 `Java` 中命名、声明和调用方法有特定的规则，这些规则不是强制性的，但应该作为最佳实践和\
    \ Java 规范的一部分使用。例如，在命名方法时，你应该根据你想执行的动作来命名。如果你想让程序管理应用程序的音量，例如它应该命名为 `volume`、`tone`\
    \ 或其他让阅读代码的人易于理解的。例如，你不应该使用 `count`、`add` 甚至 `draw`，因为这些与方法将要执行的操作没有关系。\n\n此外，当你命名一个方法且它包含多个单词时，你应该使用驼峰命名法，第一个单词的首字母小写，且最好是一个动词。之所以这样是因为，方法字面上是程序将执行的动作；因此，它本质上是一个动词。然而，重要的是，“方法声明的唯一元素是方法的返回类型、名称、一对括号\
    \ `()` 以及位于大括号 `{}` 之间的方法体”（Defining Methods, n.d.）。在命名和声明方法的结构中，你必须具备以下内容：\n\n\
    - 确定将使用哪些修饰符，例如 `private` 或 `public`，这将决定程序其他部分对该方法的访问权限。\n- 代码应该返回的数据类型，例如 `integer`、`boolean`\
    \ 或 `string`？如果不应该返回任何内容，则应该声明为 `void`。\n- 方法的名称，指定它应该做什么。\n- 你想为此代码使用的参数应该添加在方法名旁的括号内。即使没有参数，也应该使用空括号以确保代码正确。\n\
    - 检查代码中是否有异常。\n- 声明方法内部需要的变量以及任何其他信息以及它应该做什么。这些信息应该写在代码中使用的左大括号和右大括号之间。\n"
