    \ methods, and instance variables have \"rules\" that must be followed when they\
    \ are being written. As you have seen in the explanation above, there is a difference\
    \ in how you should write class names and methods. Each of these items of the\
    \ Java code needs to be written within these specifications, primarily because\
    \ Java is a case-sensitive language, which means something written in uppercase\
    \ will not mean the same thing written in lowercase.\n"
