  trans: "\n\n当你在 `Java` 中使用对象时，你正在创建与该类相关的特征的真实实体。在这种情况下，对象将需要一个状态（state），即它的属性；一个行为（behavior），将由方法表示；以及一个身份（identity），它将建立对象与另一个对象之间的关系。在身份方面，你应该记住每个对象都将具有唯一标识符和状态的唯一身份。如果我们以\
    \ `Cat` 类为例，我们可以说与它相关的对象是品种、`color`、`size` 和重量，而行为（方法）则是 `meow`（喵叫）、`purr`（呼噜）、`sleep`（睡觉）和\
    \ `eat`（吃）。\n\n一旦某个类的对象被创建，我们就可以说它被实例化（instantiated）了，这意味着“所有实例都共享类的属性和行为。但这些属性的值（即状态）对于每个对象都是唯一的。一个类可以拥有任意数量的实例”（Miglani,\
    \ 2023）。正如你在上一个 `Cat` 类示例中所看到的，它可以具有不同的特征，你指定的越详细，该类就越详尽。\n\n然而，取决于你正在创建的代码，可能会有很多不同的对象；你创建的对象越多，阅读代码就越困难。在这种情况下，OOP（面向对象编程）中还有另一种技术被证明对开发者非常有用。这被称为数据封装（data\
    \ encapsulation）。在本章接下来的章节中，我们将学习它是什么，并理解信息隐藏（information hiding）。\n\n## 封装与信息隐藏\n\
    \n封装和数据隐藏是 `Java` 中强大的技术，它们允许不同的对象被归类到同一个类下。当你对特定类的数据进行封装时，你实际上是在保护它免受其他类的访问，从而使代码更安全。同时，当你对\
    \ `Java` 代码中的对象进行封装时，你可以隐藏信息并通俗地说它们成为“秘密”，这样它们就不会被代码的其他部分访问。当你同时使用这两个功能时，它会使你的代码更受保护且更高效，因为你能够将其划分为模块，并只修改这部分而不影响代码的其余部分。在本节中，我们将观察封装和信息隐藏增强你的代码并改进你的产品的不同方法。\n\
    \n### 封装\n\n如果你理解类和对象的概念，封装可能就像散散步一样简单。这是因为“封装旨在保护数据免受外部干扰，并为访问和修改数据提供受控的接口”（Khan,\
    \ 2023）。当这段代码受到控制时，就可以复用它并提供抽象类和对象，我们将在本章的后续部分看到更多内容。\n\n当你对代码应用封装时，将需要使用所谓的访问修饰符（access\
    \ modifiers），配合被称为 `getter` 和 `setter` 方法。在其中，你可以确定 `public`、`private`、`protected`\
    \ 和 `default` 之间的修饰符。以下是每一项功能的简要说明：\n\n*   `public`：使用此修饰符时，可以在整个代码中访问对象。\n* \
    \  `private`：此修饰符将使对象仅在其所在的类内部可用。\n*   `protected`：“这种封装允许你声明一个方法或变量可以被你当前类及其子类的子类访问（你不能在方法上使用此关键字）”（Khan,\
    \ 2023）。\n*   `default`：当你使用默认修饰符时，你是在建立所有非静态成员都是根据私有包所建立的可见性来定义的。\n\n这里有一个如何使用\
    \ `public` 和 `private` 修饰符封装代码中对象的示例。在这个示例中，你有一个 `Person` 类，通过将 `name` 和 `age`\
    \ 变量声明为 `private` 来封装它们，并提供 `public` 方法（`getName`, `setName`, `getAge`, `setAge`,\
    \ `printDetails`）来访问和修改这些变量。这有助于控制访问并应用验证逻辑，使得更安全、更模块化的编码成为可能。\n\n```java\n//\
    \ Person.java 文件以便代码访问\n\nPerson.java\n\npublic class Person {\n\n    // 封装变量\
    \ (private)\n    private String name;\n    private int age;\n\n    // 构造函数\n \
    \   public Person(String name, int age) {\n        this.name = name;\n       \
    \ this.age = age;\n    }\n\n    // 访问和修改封装变量的公共方法\n    public String getName()\
    \ {\n        return name;\n    }\n\n    public void setName(String name) {\n \
    \       this.name = name;\n    }\n\n    public int getAge() {\n        return\
    \ age;\n    }\n\n    public void setAge(int age) {\n        // 此处可以添加验证逻辑\n  \
    \      if (age > 0) {\n            this.age = age;\n        } else {\n       \
    \     System.out.println(\"Invalid age\");\n        }\n    }\n\n    // 类的其他方法\n\
    \    public void printDetails() {\n        System.out.println(\"Name: \" + name);\n\
    \        System.out.println(\"Age: \" + age);\n    }\n}\n```\n\n然而，当你执行封装（或数据打包）时，测试代码是非常关重要的，以确保已建立正确的关系并在代码中访问了必要的元素。为了这一点，我们将执行所谓的“类测试（Class\
    \ test）”，可以使用以下应用程序轻松完成：\n\n### 类测试示例\n\n```java\n// 创建 EncapsulationExample 文件以运行代码\n\
    // 在此情况下，你需要先添加之前的代码\n\npublic class EncapsulationExample {\n    public static\
    \ void main(String[] args) {\n        // 创建 Person 实例\n        Person person =\
    \ new Person(\"John\", 25);\n\n        // 使用公共方法访问并修改变量\n        person.setName(\"\
    Mary\");\n        person.setAge(30);\n\n        // 使用公共方法打印信息\n        person.printDetails();\n\
    \    }\n}\n```\n\n如果你在 IDE 中尝试此代码（按照指令添加），你会发现输出是：\n\nName: Mary\nAge: 30\n\n\
    此输出显示了封装如何使受控的访问变得可能。\n\n### 什么是信息隐藏？\n\n当你出于安全目的需要隐藏对象（特别是对于可能被黑客攻击的代码）时，你可以使用信息隐藏的概念。这种技术仅在你拥有封装时使用，因为它限制了对数据的访问，正如封装允许的那样。在这种情况下，可以提到的示例是：\n\
    \n让我们声明一个 `BankAccount` 类，该类中有一个数据成员 `AcBalance`。在这里，账户余额是敏感信息。在这个示例中，我们允许外部应用程序检查余额，但可能不允许应用程序更改余额。因此，在这种情况下，我们通过将余额属性声明为私有来限制余额的变化。信息隐藏的主要优点是减少系统的复杂性。\n\
    \n（数据隐藏与封装的区别，n.d.）\n\n为了看到如何应用信息隐藏，我们现在看一个清晰说明此点的示例。在这里，`Circle` 类隐藏了 `radius`\
    \ 字段并提供了一个 `public` 方法（`getRadius`）来访问它。\n\n```java\n// 创建类文件\n\nCircle.java\n\
    \npublic class Circle {\n    private double radius;\n\n    public Circle(double\
    \ radius) {\n        this.radius = radius;\n    }\n\n    // 获取半径的公共方法（数据隐藏）\n\
    \    public double getRadius() {\n        return radius;\n    }\n}\n```\n\n//\
    \ 创建新文件用于数据访问和类测试\n\nDataHidingExample.java\n\npublic class DataHidingExample\
    \ {\n    public static void main(String[] args) {\n        Circle circle = new\
    \ Circle(5.0);\n\n        // 通过公共方法访问半径\n        double radius = circle.getRadius();\n\
    \        System.out.println(\"Radius: \" + radius);\n    }\n}\n```\n\n"
- fmt: 'Since we used the public and private modifiers in this case to hide the information,
    it is possible you might be confused about the use and the application of data
    hiding. For this reason, we should take a look into how these two are different
    and how they should be applied when coding. As we move on to the next section,
    you will see that these concepts are closely related.


    ## How Are Encapsulation and Data Hiding Different?


    In the example you are about to see, encapsulation is demonstrated by bundling
    the `radius` data and the `calculateArea` method together in the `Circle` class.
    With this example, you will be able to see that data hiding is a part of encapsulation;
    therefore, you can have data hiding if you apply encapsulation, but you cannot
    have data hiding without first encapsulating the objects of the code in the class.


    ```java

    public class Circle {


    private double radius;


    public Circle(double radius) {


    this.radius = radius;}}


    // Public method to calculate area (encapsulation)


    public double calculateArea() {


    return Math.PI * radius * radius;

    }


    }


    public class EncapsulationExample {


    public static void main(String[] args) {


    Circle circle = new Circle(5.0);


    // Accessing the radius indirectly through an encapsulated method


    double area = circle.calculateArea();


    System.out.println("Area: " + area);


    }


    }

    ```


    Encapsulation is a broader concept that involves bundling the data (fields) and
    methods that operate on the data into a single unit (class). While data hiding
    is used to secure the data and the information, the encapsulation is not necessarily
    used for this purpose, although it could be. It not only involves data hiding
    but also emphasizes the concept of bundling data and methods together. While they
    can both be used to hide how complex your code is, when you apply data hiding,
    you are more worried about restricting the data use and are applying specific
    keywords to ensure this happens.


    While these are concepts that are easily achieved with practice and dedication,
    the next items we are about to see are also important characteristics of OOP:
    inheritance and polymorphism. These two concepts are features that help increase
    the usability of the code and make it more versatile for different applications.
    As we move on to the next section, you will learn more about these concepts and
    the ways they can be efficiently applied in your code.


    ## INHERITANCE AND POLYMORPHISM


    Inheritance and polymorphism are important concepts of OOP since they enable the
    code to be more malleable. While the use of inheritance will help you understand
    the concepts of classes and superclasses, polymorphism will help you comprehend
    the applications of more than one method and parameter. In this section, we will
    see how these two concepts are used in Java and examples of their application.


    ### Inheritance


    Inheritance, as you might imagine by the name, is when the characteristics of
    a class are passed on to another. In this case, it is important to understand
    the difference between the concepts of superclass (parent or base class) and subclass
    (child or derived class). Before you see the example of the code below, let''s
    see how this can be applied in a real-world example.


    Let''s say we have the superclass "Animal". In this superclass, we have dogs,
    cats, birds, giraffes, elephants, and so on. While it is possible to say that
    all animals eat, we can also say that only the subclass of animal "dog" barks.
    Therefore, it is possible to assume that under the superclass "Animal," we have
    the `eat` method, but we can also have the subclass `dog` that is also an animal,
    but has different characteristics from the other animals within the Animal subclass.


    If you think about inheritance in hierarchical groups, you will see that the concept
    is rather simple. This is how we can think about it:


    Animal → eats / sleeps


    dog → barks


    cat → purrs


    For dog, here is what this information would look like in Java code:


    ```java

    // Base class (superclass)


    class Animal {


    String name;


    Animal(String name) {


    this.name = name;

    }


    void eat() {


    System.out.println(name + " is eating.");


    }


    }


    // Derived class (subclass) inheriting from Animal


    class Dog extends Animal {


    Dog(String name) {


    // Calling the constructor of the superclass


    super(name);

    }


    void bark() {


    System.out.println(name + " is barking.");


    }


    }


    public class InheritanceExample {


    public static void main(String[] args) {


    // Creating an instance of the subclass


    Dog myDog = new Dog("Buddy");


    // Accessing properties and methods from the superclass


    System.out.println("Name: " + myDog.name);


    myDog.eat();


    // Accessing methods specific to the subclass


    myDog.bark();


    }


    }

    ```


    As you have seen in the above example, we have exactly what was mentioned in the
    explanation. While the superclass "Animal" has the method `eat` and this characteristic
    is derived from the main class, when we have the method `bark`, this is exclusive
    to the class `dog`. The same could be said if we were talking about "car purr,"
    "bird chirp," and all other behaviors demonstrated by animals that are exclusive
    to their class group.


    The example above shows that "Animal" is the superclass with a name property and
    an `eat` method. The subclass, in this case, is "Dog," which inherits from "Animal"
    and introduces a new method, `bark`. Since the `Dog` class is a subclass of the
    `Animal` superclass, its class can access the properties and methods of the `Animal`
    class through inheritance. When you have this relationship, it is possible to
    reuse the common functionalities defined in the superclass, while you can also
    specify a unique method in the subclass; thus, showing how the "DRY" principle
    is applied when developing software.


    ### Polymorphism


    Remember when, in inheritance, we said there can be two subclasses to the superclass?
    It is possible that the parent class has two or more methods attributed to it,
    such as `eat` and `sleep`, that can be applied to all classes. When this happens,
    not only are you implementing inheritance, but it also gives you the possibility
    of applying polymorphism. When you give the parent class an attribution from the
    child class, you are implementing this technique, since the root of the word means
    it has many forms. The possibility of performing the same action in different
    ways is a characteristic of Java that attracts many users.


    When we talk about polymorphism, there are two different ways it can be applied.
    They are the compile-time and the run-time polymorphism. In these two different
    method applications, you will see that while one uses method overloading, which
    we have already seen, the other will apply method overriding that we will talk
    about now. Here are the characteristics of these two different techniques.


    #### Compile-Time Polymorphism


    This method is known as the "static" method since it will happen, as the name
    suggests, only when the program is being compiled. In this case, what you will
    do is overload the method, as seen previously. To recap, when you apply overloading
    in your code, you add different methods but with different parameters. Here is
    what the code would look like in this situation:


    ```java

    class MathOperations {


    int add(int a, int b) {


    return a + b;

    }


    //overload method by adding different parameters (characteristics) to the code,
    from int to double, but still using add


    double add(double a, double b) {


    return a + b;

    }


    }

    ```'
