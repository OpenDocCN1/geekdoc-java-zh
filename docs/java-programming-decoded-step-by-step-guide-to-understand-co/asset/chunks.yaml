    \n阅读本章后，你现在已经知道了在 Java 中编写基础代码的所有不同方法和技术。是时候测试你的知识，看看你是否记住了到为止读到的内容。准备好测试你所学的内容了吗？\n\
    \n# 来测试你的知识吧！\n\n1. 关于 Java 中的对象，以下哪项是正确的？\n   a. 对象是方法的实例\n   b. 对象是类的实例\n  \
