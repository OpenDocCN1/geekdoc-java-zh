    \ (Simplilearn, 2023). In our example, this is what it could look like:\n\n```java\n\
    public class Main {\n    //calling the code to act in between the curly brackets\n\
    \    static void myMethod () {\n        System.out.println (\"This is me calling\
    \ my method!\");\n    }\n\n    public static void main(String args[]){\n     \
    \   myMethod();\n    }\n}\n```\n\nIn this case, you will see the method has two\
    \ elements we have not talked about yet, although you have been using them: parameters\
    \ and the return value. Let's understand them a little better and what their use\
    \ and application are when running your Java code.\n\n## Understanding Method\
    \ Parameters and Return Types\n\nSuppose we go back to our hotel example. Each\
