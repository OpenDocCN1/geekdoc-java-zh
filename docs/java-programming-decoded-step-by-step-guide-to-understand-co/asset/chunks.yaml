    \ 来打印新列表时，输出将是 The fruits I bought were: [grapes, apples, lemons, cherries, oranges]。\n\
    \n轮到你尝试了！使用上面的代码，看看使用不同的数据类型可以创建哪些选项。你可能还想尝试使用它们添加一些条件语句或循环语句，看看效果如何。如果你不确定，不用担心！在章节末尾，你将获得更多的练习来巩固内容。\n\
    \n## 多维数组\n\n你知道数组的数组被称为什么吗？如果你猜到是多维数组，那么你是正确的！这种数组由位于同一个对象中的不同数组组成。根据你存储的数组数量，这些维度可以从第二维到“第\
    \ n 维”不等。例如，如果我们想创建一个二维数组，我们将使用以下代码进行声明：\n\n```java\npublic class Main {\n   \
    \ public static void main(String[] args) {\n        String[][] myTestArray = {{\"\
    grapes\", \"apples\", \"bananas\"},{\"pineapple\", \"pear\", \"kiwi\"}}\n    }\n\
    }\n```\n\n我们的 `myTestArray` 现在有两个不同的数组，每个包含三个元素。这意味着我们正在讨论论一个二行三列的矩阵或表格。如果你从这个角度来看，你就会理解为什么某些数据库以这种方式存储信息。这是因为你只需要一行代码就能获取你寻找的答案。假设我们要识别位于第二列和第二行的元素。代码看起来像这样：\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        String[][] myTestArray = {{\"grapes\", \"apples\", \"bananas\"}, {\"\
    pineapple\", \"pear\", \"kiwi\"}};\n        String element = myTestArray[1][1];\n\
    \        System.out.println(\"The element in the second column of the second row\
    \ is: \" + element);\n    }\n}\n```\n\n该示例的输出将是：The element in the second column\
    \ of the second row is pear。你做对了吗？为了方便视觉化，信息是这样存储的：\n\ngrapes apples bananas\n\
    pineapple pear kiwi\n\n这是否让识别变得更容易？现在，如果你创建一个三维数组或其他更多维度的数组，你就可以可视化这些信息。就像数组结构一样，只要所有数组包含相同的数据类型，你就可以在数组中使用之前提到的所有数据类型。\n\
    \n现在你已经掌握了数组的艺术，在下一节中，你将介绍集合的概念、它们可以做什么以及可以使用的不同类型。你会发现集合是组织信息的简单方法，不需要编写大量的代码，让你的代码更整易读。\n\
    \n## 集合简介\n\n在 Java 中，当我们谈到分组在一个对象中的不同元素时，我们指的是集合（collection）。这是一种“能够存储一组元素并表现得像单个单元（如对象或元素组）的预定义架构”（Ravikiran,\
    \ 2023）。这些集合为类和接口中的特定元素集设计了框架，允许用户在指定的元素组内进行排序、搜索、删除、更新和插入信息。\n\n例如，如果你有一个列表的列表、队列的队列和一个集合的集合，你就有一个集合。我们可以说，代码中不同数据和元素越是“分组”，它们就越接近成为一个集合。在集合之后，层次结构中的下一步是可迭代的（iterable），但我们不会在本章中讨论它。\n\
    \n需要注意的是，Java 有两个接口：`collection` 和 `map` 接口。如果你使用其中任何一个，你都需要在 IDE 中导入不同的库。如果你将使用\
    \ `collection` 接口，需要下载的库是 `java.util.Collection`。另一方面，如果你关注 `map` 接口，你将需要引用 `java.util.Map`。\n\
    \n在使用这些不同接口之一时，除了程序中使用的“常规”词汇外，还可以使用其他操作。这些特殊函数被称为接口方法，根据 Ravikiran (2023) 的描述，包含以下元素及其描述：\n\
    \n![](img/image_rsrc4ZU.jpg)\n\n现在你已经对可以在集合中使用的命令有了了解，让我们来看看开发者在创建程序时最常用的两种集合：`ArrayList`\
    \ 和 `LinkedList`。正如你想象的，这些将用于帮助分组列表，你很快就会发现为什么。继续阅读以了解它们是如何工作的。\n\n## ArrayList\
    \ 和 LinkedList\n\n使用 `ArrayList` 和 `LinkedList` 的用处在于，与数组不同，这些列表没有预设的固定限制。这意味着虽然数组有五个索引（这些索引不会改变），但两个不同的类\
    \ `ArrayList` 和 `LinkedList` 更加灵活。\n\n让我们看看每个者的示例：\n\n```java\nimport java.util.List;\n\
    import java.util.ArrayList;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        List<Integer> numbers = new ArrayList<>();\n        numbers.add(1);\n\
    \        numbers.add(2);\n        numbers.add(3);\n        System.out.println(\"\
    List: \" + numbers);\n        int number = numbers.get(2);\n        System.out.println(\"\
    Accessed Element: \" + number);\n        int removedNumber = numbers.remove(1);\n\
    \        System.out.println(\"Removed Element: \" + removedNumber);\n    }\n}\n\
    ```\n\n在这种情况下，输出将是：List: [1, 2, 3]\nAccessed Element: 3\nRemoved Element: 2\n\n\
    ```java\nimport java.util.List;\nimport java.util.LinkedList;\n\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        List<Integer>\
    \ numbers = new LinkedList<>();\n        numbers.add(1);\n        numbers.add(2);\n\
    \        numbers.add(3);\n        System.out.println(\"List: \" + numbers);\n\
    \        int number = numbers.get(2);\n        System.out.println(\"Accessed Element:\
    \ \" + number);\n        int index = numbers.indexOf(2);\n        System.out.println(\"\
    Position of 3 is \" + index);\n        int removedNumber = numbers.remove(0);\n\
    \        System.out.println(\"Removed Element: \" + removedNumber);\n    }\n}\n\
    ```\n\n在这种情况下，输出将是：List: [1, 2, 3]\nAccessed Element: 3\nPosition of 3 is 1\n\
    Removed Element: 1\n\n从之前的示例中可以看出，这两个列表都具有相似的过程，但它们的操作方式不同。在 `ArrayList` 中，你会发现有一个更动态的数组，因为它没有连接到集合包含的其他列表。此外，与数组列表相比，访问列表的每个元素更加简单且易于管理。然而，由于它包含多个元素，从其中一个列表中删除或添加元素可能比使用\
    \ `LinkedList` 花费更多时间。\n"
