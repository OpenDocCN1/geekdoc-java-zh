    You will then type in your "Hello World" code as follows:


    class FirstProgram {


    public static void main(String[] args) {


    System.out.println("Hello, World!");


    }


    }


    That''s it! All you need to do now is click on the green button on the top that
    says "Play," and the IDE will run your code. If there are no errors, you will
    see that at the bottom of the screen, the words Hello World will appear as your
    output.


    Now, it''s understandable that while you were able to do this successfully, you
    can''t quite explain what happened. To do this, it''s important to stop for a
    minute and look into the language''s basic syntax. This will enable you to create
    more programs and code without issues. To do this, read on to the next section,
    and let''s explore the main points of the Java syntax.


    ## BASIC SYNTAX


    You already know that Java is an object-oriented language, but now, you are about
    to see the elements that compose the code to make it work, in other words, the
    syntax. Three essential elements make up the code in Java to create the object.
    They are, in order of amplitude:


    1.  Class: the blueprint of a particular object. For example, we have the class
    "bird." It is safe to assume that all birds are birds, despite all of them having
    specific characteristics. For example, all birds have feathers and wings. The
    word''s first letter should always be capitalized when declaring a class name.
    If you use more than one word, they should be written without spaces between them
    and the first letter of each word capitalized, such as BirdsProject. Once this
    is done, we will need to describe the action or behavior that these birds are
    carrying out, which will be done by invoking what is known as a method.


    2.  Method: used to explain or describe the behavior that a particular object
    will have. This method must be described within the class. One important characteristic
    is that it is possible for there to be different methods inside the same class.
    For example, the bird can eat, bathe, hatch, fly, or whatever is permitted that
    was established by the specific class or "blueprint" to which birds belong. The
    first word should always start with a lowercase when writing a method''s name.
    If you use more than one word to name the method, they will again need to be used
    without a space, and you will need to capitalize the first letter of the second
    word, such as blueBirdFlying.


    3.  Instance variables: gives the specific object its unique characteristics.
    As of now, we have talked about birds. But, in this case, we will assign the attributes
    that make this bird (object) unique. It is blue, has a black beak, and can sing.
    These, together with all of its other specific characteristics, are this specific
    bird''s unique traits that make it what it is and lead to the creation of the
    object.


    Now, all these classes, methods, and instance variables have "rules" that must
    be followed when they are being written. As you have seen in the explanation above,
    there is a difference in how you should write the class names and methods. Each
    of these items of the Java code needs to be written within these specifications,
    primarily because Java is a case-sensitive language, which means something written
    in uppercase will not mean the same thing written in lowercase.'
