    \nNow that you have the idea of the commands you can use in a collection, let's\
    \ look into two of the most common collections used by developers when creating\
    \ a program: `ArrayList` and `LinkedList`. As you might imagine, these will be\
    \ used to help group lists, and you will soon find out why. Read on to find out\
    \ how they work.\n\n## ArrayList and LinkedList\n\nThe benefit of using `ArrayList`\
    \ and `LinkedList` is that, different from the array, these are lists that do\
    \ not have a preestablished and fixed limit. This means that while the array has\
    \ five indexes, which will not change, the two different classes `ArrayList` and\
