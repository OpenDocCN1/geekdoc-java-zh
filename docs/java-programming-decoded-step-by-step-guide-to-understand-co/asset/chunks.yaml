    \ 抽象\n\n在通过面向对象（OOP）之旅了 Java 核心之后，你现在准备好处理更复杂的问题了。如你所知，你已经拥有 Java 的核心知识，并准备好提升你的水平。因此，在下一章节中，我们将学习关于异常处理的所有知识。\n\
