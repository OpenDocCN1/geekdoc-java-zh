  trans: "\n现在，请画出漫画，根据分镜脚本绘制每个分格。为每个格标记相应的控制流结构（if-else、while 循环和 switch-case）。完成漫画绘制后，对该活动进行反思：为每种控制流创建场景是容易还是困难？这项活动如何帮助你更好地理解控制流？\n\
    \n这里有一个分镜脚本示例：\n\n- 第 1 格：闹钟响了。决策（If-Else）：如果学生按了闹钟按钮，他们就会错过上校的公交。否则，他们就准备就绪并上公交。\n\
    - 第 2 格：学生正在上数学课。循环（While）：当老师解释概念时，学生一直在做笔记。\n- 第 3 格：午餐时间到了。分支（Switch-Case）：学生在不同的食物站之间进行选择——披萨站、汉堡站或沙拉站。\n\
    \n超级挑战：你能尝试在 Java 程序中编写这些代码，让它能为你做决定并给出输出吗？试一试吧！答案以及前一个后一个章节的内容位于本书的末尾。\n\n恭喜你！你在掌握\
    \ Java 的道路上迈出了巨大的进步！从通过控制流引导程序运行到操作循环迭代，你正在逐渐掌握编写复杂代码的精髓。你是否开始觉得更加从容了？我希望如此！\n\
    \n接下来，我们将深入探索 Java 数组的世界。我之前提到过它们，现在是时候真正理解它们以及如何使用它们了。了解这些将成为你对 Java 理解的又一次大提升。准备好发现集合数据类型的力量了吗？让我们开始吧！\n\
    \n# 第 4 章：数组与集合\n\n当你想要整理衣柜里的衣服时，你会怎么做？你是随手把所有衣服放在那里，还是每件物品都有自己的位置？它们是否有顺序之分？如果你保持衣柜整洁，那么你应该知道，在讨论数据时，逻辑也是一样的。随着我们每天处理的数据量增加，找到优化的存储方法并确保它们可以被轻松找到至关重要。\n\
    \n为了解决这个数据组织问题，Java 提供了两种解决方案，被称为数组和集合。本章将教你如何声明、初始化和访问数组，包括多维数组。由于你已经在之前的章节中看到过一些关于数组的信息，你可能会认出某些内容。尽管如此，在\
    \ IDE 中练习和编写代码对于确保你理解这一概念仍然非常重要。\n\n此外，我们还将讨论集合，如 `ArrayList` 和 `LinkedList`，以及如何在\
    \ Java 程序中有效使用它们。你将看到使用和应用集合到代码中的不同方法，以及它们将如何让你的编码过程更快、更高效。如果你准备好学习下一节课，请继续阅读！你将发现一种组织和存储信息的全新新方法。\n\
    \n## 数组简介\n\n当我们谈论数组时，指的是存储在一个 Java 对象中的一组具有相同数据类型的值。这些单独的值被称为“元素”（element），它们的数量将用于决定数组的长度。数组可以存储大多数数据类型，包括字符串、整数、字节和布尔值。\n\
    \n首先，关于数组你需要知道的最重要点之一是，它们通常从索引 `0` 开始。这意味着如果你有一个包含 10 个元素的数组，最后一个元素的索引号是 `9` 而不是\
    \ `10`。这可能需要一点时间来适应，但我相信随着时间的练习，你会成为这方面的专家！\n\n### 数组的声明与初始化\n\n和其他大多数 Java 结构一样，你需要声明并初始化一个数组，以便\
    \ IDE 识别它为数组。要做到这一点，你需要提供类型和一个名称，并在方括号（`[]`）之后放置数组元素。你做的第一件事是根据它将包含的数据类型来声明数组。在这种情况下，可以是以下（Arrays,\
    \ 2017）：\n\n- `boolean[] anArrayOfBooleans;`\n- `byte[] anArrayOfBytes;`\n- `char[]\
    \ anArrayOfChars;`\n- `double[] anArrayOfDoubles;`\n- `float[] anArrayOfFloats;`\n\
    - `int[] anArrayOfInts;`\n- `long[] anArrayOfLongs;`\n- `short[] anArrayOfShorts;`\n\
    - `String[] anArrayOfStrings;`\n\n在这种情况下，你将声明你拥有的数组类型，加上括号，然后是数组名称。在之前的示例中，名称是以\
    \ \"an\" 开头的，只要是小写可以是任何单词，接下来的单词使用驼峰命名（单词之间没有空格，但每个单词的首字母大写）。虽然也可以将括号放在名称之后，但根据\
    \ Java 规范，不建议这样做。一旦设定，就可以说你的数组已经声明了。\n\n下一步是初始化它；这将通过声明数组将包含多少个元素来完成，以便分配内存。然后你把值赋值给数组包含的元素。在代码中，看起来如下：\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        // 声明数组\n        String[] myTestArray;\n        // 为你拥有的元素数量分配内存\n  \
    \      myTestArray = new String[5];\n        // 初始化数组\n        myTestArray = new\
    \ String []{\"grapes\", \"apples\", \"bananas\", \"cherries\", \"oranges\"};\n\
    \    }\n}\n```\n\n你现在有一个包含五个元素的字符串类型数组。你记得索引意味着什么吗？如果你说是四，你是正确的！在这种情况下\n0=grapes\n\
    1=apples\n2=bananas\n3=cherries\n4=oranges\n\n为了节省空间，可以在同一行代码中声明、分配并初始化数组。在这种情况下，它看起来像：\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        String[] myTestArray = {\"grapes\", \"apples\", \"bananas\", \"cherries\"\
    , \"oranges\"};\n    }\n}\n```\n\n通过这种方式输入信息，你可以为你创建的代码行节省空间。然而，虽然这个概念相当容易理解，但我可以想象你在问自己：如果我想访问字符串数组中的\
    \ bananas 元素该怎么办？我需要数数吗？这取决于情况。让我们进入下一节，了解如何实现以及如何访问数组元素。\n\n### 访问与修改数组元素\n\n\
    当你识别数组中的特定元素时，必须使用它的索引号。在这种情况下，你将向程序提供查找的元素数字，例如\n\n```java\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        String[] myTestArray\
    \ = {\"grapes\", \"apples\", \"bananas\", \"cherries\", \"oranges\"};\n      \
    \  System.out.println(myTestArray[3]);\n    }\n}\n```\n\n在这种情况下，你请求元素数字 3，输出将是\
    \ cherries。现在，假设你有这个数组并想要修改其中一个元素。假设你想把元素 bananas 替换为 lemons。这不需要重写整个代码也是可能的。你要做的是在代码中使用以下语句：\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        String[] myTestArray = {\"grapes\", \"apples\", \"bananas\", \"cherries\"\
    , \"oranges\"};\n        myTestArray [2] = \"lemons\";\n        System.out.println(myTestArray[2]);\n\
    \    }\n}\n```\n"
