    ## BREAK AND CONTINUE STATEMENTS


    When you use the break and continue statements, you tell the program to stop (break)
    or pick up (continue) at a certain part of the code. This means that if you ask
    for the code to carry out an iteration, if you add the break statement after this
    is done a certain number of times, the program will automatically stop. If you
    want the program to skip one of the iterations you have requested to carry out,
    then you will use the continue statement, such as counting from 0 to 5 and skipping
    the number 3.


    Although we have seen an example of the break statement previously, we will look
    into an example of how it can be used separately from the switch statement. After
    this, we will look closer at the continue statement and the different ways it
    can be used.


    Example 1: Print the numbers 0 to 100 and break the loop when the count reaches
    3.


    public class Main{


    public static void main(String []args)


    {


    for (int i = 0; i < 100; i++) {


    if (i == 3)


    break;


    System.out.println(i);


    }


    System.out.println("Loop Finalized");


    }


    }


    The output for this first example would be


    0


    1


    2


    3


    Despite having programmed the code to print numbers 0–100 initially, you have
    asked that when i=3, the loop be broken, and for this reason, there are only the
    numbers 0–3 printed in the output. In this case, the break statement was used
    with the conditional if statement that establishes what should happen for the
    loop to be broken.


    Example 2: Print odd numbers between 1 and 10 using the continue statement. Use
    the continue statement to skip the even numbers.


    public class Main{


    public static void main(String []args)


    {


    for (int i = 1; i <= 10; i++) {


    if (i % 2 == 0) {


    continue;


    }


    System.out.println(i);


    }


    }


    }


    The output for this first example would be


    1


    3


    5


    7


    9


    Which is correct given what you have asked the program to do. At the same time,
    you could replace the statement for other conditions that use integers to carry
    out the process.


    Example 3: Compute the sum of five positive numbers. In this example, the negative
    or the 0 values should not be considered and should be skipped. (For this example,
    we will use an array to illustrate the exercise, despite talking more about them
    in the following chapter.)


    public class Main {


    public static void main(String[] args) {


    int[] numbers = {5, 8, -2, 12, 4};


    int sum = 0;


    for (int i = 0; i < numbers.length; i++) {


    int num = numbers[i];


    if (num <= 0) {


    System.out.println("Skipping negative or zero value: " + num);


    continue;


    }


    sum += num;


    }


    System.out.println("Sum of positive numbers: " + sum);


    }


    }


