    you don''t have to worry! At the end of the chapter, you will be given more exercises
    to practice the content.


    Multidimensional Arrays


    Do you know what an array of arrays is called? If you guessed multidimensional
    arrays, you are correct! This type of array consists of different arrays within
    the same object. These dimensions can range from the second to the "nth" dimension
    according to the number of arrays you have stored. For example, if we wanted to
    create a two-dimensional array, we would declare it with the following code:


    public class Main {


    public static void main(String[] args) {


    String[][] myTestArray = {{"grapes", "apples", "bananas"},{"pineapple", "pear",
    "kiwi"}}


    }


    }


    Our myTestArray now has two different arrays with three elements each. This means
    we are talking about a matrix or table with two rows and three columns. If you
    look at it from this perspective, you will understand why some databases store
    information this way. It is because you can obtain the answer you seek with a
    simple line of code. Suppose we want to identify the element located in the second
    column and on the second line. This is what the code would look like:


    public class Main {


    public static void main(String[] args) {


    String[][] myTestArray = {{"grapes", "apples", "bananas"}, {"pineapple", "pear",
    "kiwi"}};


    String element = myTestArray[1][1];


    System.out.println("The element in the second column of the second row is: " +
    element);


    }


    }


    The output for this example would be: The element in the second column of the
    second row is pear. Did you get it right? For easier visualization, this is how
    the information is being stored:


    grapes             apples             bananas


    pineapple       pear                 kiwi


    Does this make it easier to identify? Now, you can visualize the information if
    you created a three-dimensional array or another with more dimensions. Like the
    array structure, you can use all the previously mentioned data types with arrays
    as long as all arrays contain the same data type.


    Now that you have mastered the art of arrays, in the next section, you will be
    introduced to the concept of collections, what they can do, and the different
    types that can be used. You will see that collections are an easy way to organize
    information without writing many code lines, making your code cleaner and easier
    to read.


    ## INTRODUCTION TO COLLECTIONS


    In Java, when we talk about different elements grouped in one object, we refer
    to a collection. This is a "predefined architecture capable of storing a group
    of elements and behaving like a single unit such as an object or a group" (Ravikiran,
    2023). These collections have frameworks designed for specific sets of elements
    in classes and interfaces and allow the user to sort, search, delete, update,
    and insert information within the indicated group of elements.


    For example, if you have a list of lists, a queue of queues, and a set of sets,
    you will have a collection. We can say that the more "grouped" different data
    and elements in the code become, the closer they are to becoming a collection.
    After a collection, the next step in the hierarchy is iterable, but we will not
    discuss it in this chapter.


    It is important to note that Java has two interfaces: the collection and the map
    interface. If you use either, you will need to import different libraries into
    your IDE. If you are going to work with the collection interface, the library
    to download is the java.util.Collection. On the other hand, if you focus on the
    map interface, you will need to reference the java.util.Map.


    When using either of these different interfaces, there are other actions you can
    use other than the "regular" words that would be used in a program. These special
    functions are known as interface methods and consist of the following elements
    and their description, according to Ravikiran (2023):


    ![](image_rsrc4ZU.jpg)


    Now that you have an idea of the commands you can use in a collection, let''s
    look into two of the most common collections used by developers when creating
    a program: ArrayList and LinkedList. As you might imagine, these will be used
    to help group lists, and you will soon find out why. Read on to find out how they
    work.


    ArrayList and LinkedList


    The benefit of using ArrayList and LinkedList is that, different from the array,
    these are lists that do not have a preestablished and fixed limit. This means
    that while the array has five indexes, which will not change, the two different
    classes seen in this section are more flexible and can be worked on. While they
    both have advantages and disadvantages, the main idea here is the possibility
    of storing incredible amounts of data that can be scaled up or down according
    to need. They will also store all types of elements, and the only difference is
    the way they work and the time they take to perform certain actions.


    Let''s see an example of each (Java List, n.d.):


    ArrayList


    import java.util.List;


    import java.util.ArrayList;


    class Main {


    public static void main(String[] args) {


    // Create a list using the ArrayList class


    List<Integer> numbers = new ArrayList<>();


    // Add elements to the list


    numbers.add(1);


    numbers.add(2);


    numbers.add(3);


    System.out.println("List: " + numbers);


    // Access element from the list


    int number = numbers.get(2);


    System.out.println("Accessed Element: " + number)


    // Remove element from the list


    int removedNumber = numbers.remove(1);


    System.out.println("Removed Element: " + removedNumber);


    }


    }


    In this case, the output will be:


    List: [1, 2, 3]


    Accessed Element: 3


    Removed Element: 2


    LinkedList


    import java.util.List;


    import java.util.LinkedList;


    class Main {


    public static void main(String[] args) {


    // Creating list using the LinkedList class


    List<Integer> numbers = new LinkedList<>();


    // Add elements to the list


    numbers.add(1);


    numbers.add(2);


    numbers.add(3);


    System.out.println("List: " + numbers);


    // Access element from the list


    int number = numbers.get(2);


    System.out.println("Accessed Element: " + number);


    // Using the indexOf() method


    int index = numbers.indexOf(2);


    System.out.println("Position of 3 is " + index);


    // Remove element from the list


    int removedNumber = numbers.remove(1);


    System.out.println("Removed Element: " + removedNumber);


    }


    }


    The output, in this case, will be


    List: [1, 2, 3]


    Accessed Element: 3


    Position of 3 is 1


    Removed Element: 2


    As you can see from the previous examples, both of these lists have similar processes,
    but they operate differently. In the ArrayList, you will see that there is a more
    dynamic array because it is not connected to the other lists that are contained
    in the collection. In addition, accessing each of the elements of the list (as
    you can see by comparing the outputs of both examples) is simpler and easier to
    manage when compared to an array list, making managing these lists, especially
    when retrieving elements, faster. On the other hand, since it comprises several
    elements, removing or adding an element from one of the lists might take more
    time than if you used a LinkedList.'
