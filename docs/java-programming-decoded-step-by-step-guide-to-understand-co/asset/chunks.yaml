    \n完成后，你将进入 `IDE` 的主界面，在那里，你可以在名为“Package Explorer”（包资源管理器）的标签页下看到你分配了名称的程序。接下来，你应该通过右键点击项目名称、选择\
    \ `New`，然后选择 `Package` 为此程序创建一个包。在这里，你不需要更改源文件夹，可以再次使用你喜欢的名称并点击“Finish”。\n\n注意：根据\
    \ Java 规范（我们稍后会讨论），包名应该与你使用代码的用途相似。\n\n现在，你需要创建一个类（class），可以通过右键点击你创建的包（它应该显示在项目名称下方）来完成；然后点击\
    \ `New` 和 `Class`，我们可以为它命名，例如 `FirstProgram`。另一个对话框将出现，你将填写包名，并确保选中 `public static\
    \ void main(String[]args)` 的复选框以及 `Inherited abstract methods`（继承的抽象方法）的框。点击“Finish”。\n\
    \n在工作空间中，你会看到新的信息，具体来说如下所示（在 `Eclipse` 中，你需要在包名下输入代码）：\n\n```java\npackage <selected.name>\
    \ // Eclipse 和下载的 IDE 必须的\n\npublic class <class.name> {\n\n    public static\
    \ void main (String[] args) {\n\n}\n\n}\n```\n\n你将按照所示输入你的“Hello World”代码：\n\n\
    ```java\nclass FirstProgram {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n搞定！你现在只需要点击顶部的绿色“Play”（播放）按钮，`IDE`\
    \ 将运行你的代码。如果没有错误，你将看到屏幕底部出现 Hello World 字样作为你的输出。\n\n现在，可以理解为虽然你成功地做到了，但你无法完全解释发生了什么。为了做到这一点，停下来研究语言的基础语法是非常重要的。这将使你能够无问题地创建更多程序和代码。为此，请继续阅读。\n\
    \n## 基础语法\n\n你已经知道 Java 是一门面向对象的语言，但现在你将看到构成其运行的元素，换就是语法。三个基本元素构成了代码：\n\n1. **Class**（类）：对象的蓝图。例如，我们有\
    \ `bird`。可以假设所有的鸟都是鸟，尽管它们都有特定的特征。例如，所有的鸟都有羽毛和翅膀。在声明类名时，单词的首字母应该始终大写。如果你使用多个单词，应不带空格编写，例如\
    \ `BirdsProject`。\n\n2. **Method**（方法）：用于描述特定对象具有的行为。这种方法必须在类内部描述。一个重要的特性是同一个类可以包含不同的方法。例如，鸟可以吃、洗澡、孵化、飞行，或者特定类允许的任何操作。在编写方法名时，第一个单词的首字母应该始终小写。如果你使用多个单词命名方法，再次需要不带空格使用，并且你需要将第二个单词的首字母大写，例如\
    \ `blueBirdFlying`。\n\n3. **Instance variables**（实例变量）：赋予特定对象独特的特征。目前为止，我们一直在讨论鸟。但在这种情况下，我们将分配使这只鸟独特的属性。它是蓝色的，有黑喙，并且会唱歌。这些与其他所有特定特征在一起，构成了这只鸟的独特特质，使其成为其本身。\n\
