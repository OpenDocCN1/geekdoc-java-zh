    ## YOUR TURN TO TRY!


    Create a Java program with overloaded methods to calculate the area of a circle
    and a rectangle, in which the main method should be used to demonstrate the use
    of the methods. Here are the requirements you must follow to ensure you obtain
    the correct result:


    *   Create a class named AreaCalculator.


    *   Implement overloaded methods for each shape''s area calculation: circle and
    rectangle.


    *   Use the following formulas for area calculation:


    ○ Circle: area = π × r × r (where r is the radius).


    ○ Rectangle: area = length × width (where length and width    are the sides).


    Now that you understand how methods work, we can dive deeper into the heart of
    Java and what makes it such a unique language. In the next chapter, we will explore
    how to create classes and objects, and principles of OOP. If you are ready to
    continue our adventure, let''s embark on this exciting journey and decode the
    mysteries of OOP in Java!


    CHAPTER 6


    OBJECT-ORIENTED PROGRAMMING


    As mentioned way back in this book''s introduction, Java is an OOP language, which
    means that it uses objects to determine what will happen in the code we are building.
    In this chapter, you will learn everything about creating objects, classes, their
    principles, characteristics, and concepts such as encapsulation, polymorphism,
    and inheritance. If you are ready to see the "core" of Java and learn what makes
    it a unique language to learn and program in, read on! You are about to gain insight
    into its inner works and the different ways it can be used.


    ## INTRODUCTION TO OOP


    When developers decide to use OOP in their coding, they are striving to achieve
    the DRY principle, which stands for "Don''t repeat yourself." This is because
    when you create and use objects to code, you are making the code easier to create,
    modify, maintain, and debug, enabling different uses with less code and less development
    time. These advantages make the program easier to execute and the code lines more
    readable with a clear and understandable structure (Java OOP [Object-Oriented
    Programming], 2020).


    Developers who use OOP apply this technique to "real-world entities like inheritance,
    hiding, and polymorphism in programming. Its main aim is to bind the data and
    functions that operate on them so that no other part of the code can access this
    data except that function" (RishabhPrabhu, 2023). Just as we have seen with methods,
    you can use the access modifiers to determine how accessible the OOP classes are
    (using public, protected, private, and default), and also by mentioning the different
    actions you want the object to have.


    To better understand what it means to have an OOP that focuses on classes and
    objects, we should first understand what they are and how they are related. These
    are the two main characteristics of OOP, which stand on the pillars of encapsulation,
    polymorphism, abstraction, and inheritance. Together, these six items support
    the existence of OOP and make Java the versatile and reusable language it is.


    Although we are going to learn about each of these pillars in the following sections,
    it is essential that we understand what classes and objects are. You have already
    seen these in varied applications in previous exercises but, apart from the initial
    explanation in Chapter 1, we haven''t gone into much detail regarding what each
    of these are. But do not worry because the time has come, and you are about to
    learn more about them. Move on to the next section to learn the intricacies of
    classes and objects, how they relate to each other, and what makes them so special
    when writing code in Java.


    ## CLASSES AND OBJECTS


    To understand what objects and classes are, all you need to do is look around
    you: They are everywhere! This is because classes and objects are real-life items,
    concepts, and entities that are applied to our software. When we are talking about
    software development, we must consider that these classes and objects also have
    behaviors and states, and this is exactly how they work in the real world. "A
    software object''s state is stored in fields and behavior is shown via methods.
    So, in software development, methods operate on the internal state of an object,
    and the object-to-object communication is done via methods" (Java Object and Classes,
    2019).


    An association that will make it easy for you to understand is that the class
    is the "blueprint" that describes a general class, such as "student." In this
    case, this is a generic approach that determines the characteristics of a group.
    Next, we can describe its behavior and state, which could be, for example, int
    age, int grade, double height, and string "loud," which are all characteristics
    that can be used to describe the "student" class.


    Here are a few more examples that will help you associate the differences between
    classes and objects by using real-world examples:


    Class: Vegetables


    *   Objects: carrot, squash, broccoli


    Class: Motorcycles


    *   Objects: Suzuki, Honda, Harley-Davidson


    Class: Animals


    *   Objects: elephant, giraffe, rhinoceros, monkey


    But, at the same time, these objects that we have here can also be classes, such
    as (and now implementing an example of the data types that could be used):


    Class: Carrot


    *   Objects: String color, double size, double weight


    Class: Harley-Davidson


    *   Objects: String color, boolean wheels, int places


    Class: Monkey


    *   Objects: String color, boolean banana, double weight


    In all these classes, you can observe that we have a "general" class that describes
    a group of objects contained within them, which makes the animal, monkey, for
    example, an object of the animal class. But monkeys can also be a class, and if
    this happens, the weight, for example, will be an object of the class. Now that
    these concepts are clear, we can further explore the concepts of classes and objects
    in Java and how they can be used.


    Classes in Java


    As you know, classes are the blueprints that establish what an object does. In
    this case, the class must be created to relate to the objects used in the code.
    For example, in the code below, we have the class named School.


    public class School {


    String teachers;


    int grades;


    String subjects;


    }


    The objects that were created in this class relate directly to the main "blueprint"
    that has been established. This means that we have the objects: teachers, grades,
    and subjects. In this partial code, we have established the constructor "public,"
    which you already know will be accessible to all parts of the code. Since we have
    mentioned objects, let''s examine what they are and how they can be used.


    Objects in Java'
