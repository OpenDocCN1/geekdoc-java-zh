    Congratulations! You have made great strides in your journey to master Java! From
    steering the course of your program with control flow to manipulating loop iterations,
    you are getting the hang of crafting intricate code. Are you starting to feel
    more comfortable? I hope you are!


    Next, we are going to delve into the world of Java arrays. I have mentioned them
    previously, and now is the time to really understand what they are and how they
    can be used. Knowing this will be another great upskill in your understanding
    of Java. Are you ready to uncover the power of collection data types? Let''s get
    started!


    CHAPTER 4


    ARRAYS AND COLLECTIONS


    When you want to organize clothes inside your wardrobe, how do you do it? Do you
    just place all the clothing in any manner, or does each item have a place? Is
    there any order for it? If you keep your wardrobe tidy, then you should know that
    the same logic happens when discussing data. With the increasing amounts of data
    we have every day, it is important to find optimized ways to store this and ensure
    it can be easily found.


    To solve this data organization problem, Java has two solutions, known as arrays
    and collections. This chapter will teach you how to declare, initialize, and access
    arrays, including multidimensional arrays. Since you have already seen some information
    about arrays in the previous chapters, you might recognize some of the content.
    Nevertheless, practicing and writing the code in your IDE is important to ensure
    you understand the concept.


    Additionally, we will also talk about collections, such as ArrayList and LinkedList,
    and how to use them effectively in your Java programs. You will see different
    ways to use and apply collections to your code and how they will make your coding
    process faster and more efficient. If you are ready for another lesson, read on!
    You are about to discover a whole new way to organize and store your information.


    ## INTRODUCTION TO ARRAYS


    When we talk about arrays, we are referring to a group of values with the same
    data types that are held inside one Java object. These individual values are known
    as an element, and their quantity will be used to determine the length of the
    array. Arrays can store most data types, including strings, integers, bytes, and
    booleans.


    To start off, one of the most important things you need to know about arrays is
    that they usually start in index 0\. This means that if you have an array with
    10 elements, the last one will be under the index number 9 and not 10\. This might
    take some getting used to, but I am sure that with time and practice, you will
    become a professional at it!


    Declaring and Initializing Arrays


    Like most other Java structures, you will need to declare and initialize an array
    to recognize it as such by the IDE. To do this, you will provide a type and a
    name and place the elements of the array after square brackets ([ ]). The first
    thing you will do is declare the array according to the data type it will contain.
    In this case, they can be the following (Arrays, 2017):


    *   boolean[] anArrayOfBooleans;


    *   byte[] anArrayOfBytes;


    *   char[] anArrayOfChars;


    *   double[] anArrayOfDoubles;


    *   float[] anArrayOfFloats;


    *   int[] anArrayOfInts;


    *   long[] anArrayOfLongs;


    *   short[] anArrayOfShorts;


    *   String[] anArrayOfStrings;


    In this case, you are going to declare the type of array that you are going to
    have, add the brackets, and then the name of the array. In the case of the previous
    examples, you have the names starting with "an," which can be any word as long
    as they are lowercase, and the next words in camel case (no gaps between words,
    but each word is capitalized). Although it is also possible to place the brackets
    after the name, this is not recommended according to the Java convention. Once
    this is set, you can say that your array is declared.


    The next step is to initialize it; this will be done by declaring how many elements
    your array will have so the memory can be allocated. You will then assign the
    values to the elements contained within the array. In code, this would look as
    follows:


    public class Main {


    public static void main(String[] args) {


    //declaring the array


    String[] myTestArray;


    //allocating memory for the number of elements you will have


    myTestArray = new String[5];


    //initializing the array


    myTestArray = new String []{"grapes", "apples", "bananas", "cherries", "oranges"};


    }


    }


    You now have an array of string data types that contain five elements. Do you
    remember how many index positions this means? If you said four, you are correct!
    In this case, you would have:


    0=grapes


    1=apples


    2=bananas


    3=cherries


    4=oranges


    If you want to save space, you can also declare, allocate, and initialize the
    array within the same line of code. In this case, it would look like this:


    public class Main {


    public static void main(String[] args) {


    String[] myTestArray = {"grapes", "apples", "bananas", "cherries", "oranges"};


    }


    }


    By typing in the information this way, you will be able to save space for the
    different code lines you are creating and make the visual of what you are programming
    "cleaner." However, while this concept is fairly understandable, I can imagine
    you are asking yourself, What do I need to do if I want to access the bananas
    element of my string? Do I need to count it? Well, it depends. Let''s move on
    to the next section to understand how this can be done and how you can access
    the elements in an array.


    Accessing and Modifying Array Elements


    When you want to identify a specific element inside an array, you must use its
    index number. In this case, you will give the program the number of the element
    you are searching for, such as


    public class Main {


    public static void main(String[] args) {


    String[] myTestArray = {"grapes", "apples", "bananas", "cherries", "oranges"};


    System.out.println(myTestArray[3]);


    }


    }


    In this case, you are asking for the element number 3, and the output  will be
    cherries. Now, suppose that you have this array, and you want to modify one of
    the elements. Let''s say you want to replace the element bananas with the element
    lemons. This is also possible without having to rewrite the complete code. What
    you are going to do is use the following statement in the code:


    public class Main {


    public static void main(String[] args) {


    String[] myTestArray = {"grapes", "apples", "bananas", "cherries", "oranges"};


    myTestArray [2] = "lemons";


    System.out.println(myTestArray[2]);


    }


    }'
