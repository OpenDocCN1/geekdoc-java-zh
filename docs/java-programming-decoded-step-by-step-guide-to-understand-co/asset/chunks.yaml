  trans: "\n“函数重载是实现多态的方式之一，但它取决于技术以及我们采用的是哪种多态。在 Java 中，我们在编译时实现函数重载”（Adware, 2022）。在这种情况下，并不一定涉及继承，这使得代码的灵活性较低，因为所有内容在编译时间到来时就会运行。\n\
    \n另一方面，我们还有运行时多态，它具有独特的特征，我们可以说这些特征几乎与编译时相反的。在进入下一节之前，你将学习它的特性以及它与我们刚刚看到的有什么不同。\n\
    \n# 运行时多态\n\n这种多态也被称为动态多态，它涉及继承。要应用这项技术，不需要方法重载，但你需要应用方法重写（method overriding），重写“意味着子类拥有与父类中声明的相同的方法。这意味着子类为其任一父类所提供的方法提供了具体的实现”（Adware,\
    \ 2022）。这种执行速度比编译时慢，但它更加灵活。\n\n以下是应用此特性的两个代码示例，你能够识别其中的区别以及继承的应用：\n\n```\nclass\
    \ Animal {\n  void makeSound() {\n    System.out.println(\"Some generic sound\"\
    );\n  }\n}\n\nclass Dog extends Animal {\n  void makeSound() {\n    System.out.println(\"\
    Bark\");\n  }\n}\n```\n\n对于接口，在这种不同的应用中，你将发现当你有一个 `void` 且内部没有任何动作的方法时，也可以应用运行时多态。\n\
    \n```java\ninterface Shape {\n  void draw();\n}\n\nclass Circle implements Shape\
    \ {\n  void draw() {\n    System.out.println(\"Drawing a circle\");\n  }\n}\n\
    ```\n\n从根本上说，当你拥有多态时，它允许对象采用不同的形式和行为。在下面的示例中，你会看到“Dog”类可以有一个返回“bark”的“sound()”方法，而“Cat”类也可以有一个返回“meow”的“sound()”方法。`Dog`\
    \ 和 `Cat` 类是 `Animal` 的子类，并用特定的声音重写了 `makeSound` 方法。\n\n```java\n// 基类（超类）\nclass\
    \ Animal {\n  void makeSound() {\n    System.out.println(\"Some generic animal\
    \ sound.\");\n  }\n}\n\n// 派生类 1（子类）\nclass Dog extends Animal {\n  @Override\n\
    \  void makeSound() {\n    System.out.println(\"Woof! Woof!\");\n  }\n}\n\n//\
    \ 派生类 2（子类）\nclass Cat extends Animal {\n  @Override\n  void makeSound() {\n \
    \   System.out.println(\"Meow! Meow!\");\n  }\n}\n\npublic class PolymorphismAnimalExample\
    \ {\n  public static void main(String[] args) {\n    // 创建不同子类的对象\n    Animal\
    \ myDog = new Dog();\n    Animal myCat = new Cat();\n    // 调用重写的方法，它根据实际对象类型而异\n\
    \    myDog.makeSound(); // 输出: Woof! Woof!\n    myCat.makeSound(); // 输出: Meow!\
    \ Meow!\n  }\n}\n```\n\n如果你在本节中往回看，你会发现提到了接口。但你一定在问自己：什么是接口？它是如何使用的？这是一个非常好的问题，因为它是\
    \ Java 的一个重要特性，从 Java 8 版本开始进行了更详细的实现。根据这些信息，让我们来看看本章的最后一部分，在其中你将学习在创建类和测试你的知识之前相关的\
    \ Java 概念。\n\n## 抽象类和接口\n\n要理解抽象类和接口的应用，首先识别什么是普通的具体类很重要。它无非就是你目前为止看到的那些类，这些类具有代表特定对象行为的方法。然而，当你想要隐藏这种实现甚至是你所创建的代码的复杂性时，你可以应用两种称为抽象类和接口的方法（baeldung,\
    \ 2022）。继续阅读以了解它们的主要特性和实现方法。\n\n## 实现\n\n当你应用抽象类时，你应该记住的最重要点是在类名之前使用 `abstract`\
    \ 关键字。这些类将没有任何限制，当你有抽象方法时，该类也应该是抽象的。它的其中一个基本特性是，在创建对象时不需要使用 `new` 关键字，它将立即用匿名类覆盖该方法，尽管它只会扩展到一个类。同时，这并不意味着这些方法不需要声明或定义。在为抽象类和接口实现它们时，这是一种可以使用或也可以不使用的可能性（baeldung,\
    \ 2022）。\n\n相反，当你拥有一个接口时，它仅仅是你在代码中建立的、不执行任何动作的“合同”。在这里，主要的特征是使用 `interface` 关键字，这将有助于在子类中实现它。与抽象类不同，你的代码可以实现多个接口，这使得它在使用多重继承和具有不同层次结构的不同类时成为一个理想的解决方案。当我们使用接口时，我们想要了解如何将行为添加到对象中。\n\
    \n以下是如何使用继承实现抽象类和接口的示例：\n\n```java\n// 抽象类\nabstract class Shape {\n  // 抽象方法（由子类实现）\n\
    \  abstract double calculateArea();\n  // 具体方法\n  void display() {\n    System.out.println(\"\
    This is a shape.\");\n  }\n}\n\n// 具体派生类 1\nclass Circle extends Shape {\n  double\
    \ radius;\n  Circle(double radius) {\n    this.radius = radius;\n  }\n  @Override\n\
    \  double calculateArea() {\n    return Math.PI * radius * radius;\n  }\n}\n\n\
    // 具体派生类 2\nclass Rectangle extends Shape {\n  double length;\n  double width;\n\
    \  Rectangle(double length, double width) {\n    this.length = length;\n    this.width\
    \ = width;\n  }\n  @Override\n  double calculateArea() {\n    return length *\
    \ width;\n  }\n}\n\n// 接口\ninterface Sound {\n  void makeSound();\n}\n\n// 实现接口的类\n\
    class Dog implements Sound {\n  @Override\n  public void makeSound() {\n    System.out.println(\"\
    Woof! Woof!\");\n  }\n}\n\n// 实现多个接口的类\nclass Parrot implements Sound {\n  @Override\n\
    \  public void makeSound() {\n    System.out.println(\"Squawk! Squawk!\");\n \
    \ }\n}\n\npublic class AbstractClassInterfaceExample {\n  public static void main(String[]\
    \ args) {\n    // 抽象类示例\n    Shape circle = new Circle(5);\n    circle.display();\n\
    \    System.out.println(\"Area of Circle: \" + circle.calculateArea());\n\n  \
    \  Shape rectangle = new Rectangle(4, 6);\n    rectangle.display();\n    System.out.println(\"\
    Area of Rectangle: \" + rectangle.calculateArea());\n\n    // 接口示例\n    Sound\
    \ dog = new Dog();\n    dog.makeSound();\n\n    Sound parrot = new Parrot();\n\
    \    parrot.makeSound();\n  }\n}\n```\n\n正如代码的设置方式所示，它允许抽象类和接口为层次结构中的相关类提供共同的行为和结构。当你将此代码添加到\
    \ IDE 时，获得的输出如下：\n\n```\nThis is a shape.\nArea of Circle: 78.53981633974483\n\
    This is a shape.\nArea of Rectangle: 24.0\nWoof! Woof!\nSquawk! Squawk!\n```\n\
    \n在这个示例中，你可以看到 `Shape` 是一个抽象类，包含一个抽象方法 `calculateArea()` 和一个具体方法 `display()`。同时，`Circle`\
    \ 和 `Rectangle` 是 `Shape` 的具体类类实现了 `calculateArea()` 方法。在代码的第二部分，当我们谈论动物声音时，`Sound`\
    \ 是一个拥有 `makeSound()` 方法的接口。在这种情况下，`Dog` 和 `Parrot` 是实现 `Sound` 接口的类。\n"
- fmt: "\nWhen you create an object, you are likely going to use it for something.\
    \ After all, it is useless to create an object, method, and even class, if you\
    \ are not going to use it in your code. This will only pollute the code and make\
    \ it more difficult to read and understand. For this reason, we must understand\
    \ how to work and manipulate objects while coding, as well as identify best practices\
    \ for them.\n\n# WORKING WITH OBJECTS\n\nIn this section, you are going to see\
    \ in practice what you should do to create a class and an instance and how to\
    \ make them interact with an object. This is the core of the Java code, since\
    \ what you are doing is establishing these to determine what it will do. However,\
    \ since you have already seen different applications and implementations of this\
    \ code, I will take a moment and use this opportunity to show you how different\
    \ objects can be manipulated using a lambda.\n\n\"Lambdas allow programmers to\
    \ make their code shorter, efficient, and more functional. They help one to iterate\
    \ through a collection of objects and avoid numerous mistakes\" (How to Manipulate\
    \ Objects, 2021). Nonetheless, before we learn how to use lambdas in Java, let's\
    \ use two examples to recap how classes and instances are created. Creating this\
    \ class and these instances will be important to understand the last example,\
    \ where the lambda will be used. Please note that if you are going to paste this\
    \ code into your IDE, you should remember to remove the subheadings, so the code\
    \ can work.\n\n## Creating a Class\n\n```java\n// Define a simple class\n\npublic\
    \ class Car {\n\n    // Fields (attributes)\n    String model;\n    int year;\n\
    \n    // Constructor\n    public Car(String model, int year) {\n        this.model\
    \ = model;\n        this.year = year;\n    }\n\n    // Method to display information\n\
    \    public void displayInfo() {\n        System.out.println(\"Model: \" + model);\n\
    \        System.out.println(\"Year: \" + year);\n    }\n}\n```\n\n## Creating\
    \ an Instance\n\n```java\npublic class ObjectInteractionExample1 {\n    public\
    \ static void main(String[] args) {\n        // Create instances of the Car class\n\
    \        Car car1 = new Car(\"Toyota Camry\", 2022);\n        Car car2 = new Car(\"\
    Honda Accord\", 2021);\n    }\n}\n```\n\n## Interacting With Objects\n\n```java\n\
    public class ObjectInteractionExample2 {\n    public static void main(String[]\
    \ args) {\n        // Create instances of the Car class\n        Car car1 = new\
    \ Car(\"Toyota Camry\", 2022);\n        Car car2 = new Car(\"Honda Accord\", 2021);\n\
    \n        // Access and modify object properties\n        // Display information\
    \ about car1\n        car1.displayInfo();\n\n        // Display information about\
    \ car2\n        car2.displayInfo();\n\n        // Modify the year of car1\n  \
    \      car1.year = 2023;\n\n        // Display updated information\n        car1.displayInfo();\n\
    \    }\n}\n```\n\nIn this example, we create a `Car` class with fields (`model`\
    \ and `year`), a constructor to initialize objects, and a method `displayInfo`\
    \ to display information about the car. The next thing we do is create two instances\
    \ of the `Car` class (`car1` and `car2`) using the `new` keyword. Finally, we\
    \ interact with the objects by accessing and modifying their properties and calling\
    \ methods.\n\nAfter you have read this chapter, you now know all the different\
    \ ways and techniques to write basic code in Java. It is time to test your knowledge\
    \ and see if you have committed to memory what you have read so far. Are you ready\
    \ to test what you've learned?\n\n# LET'S TEST YOUR KNOWLEDGE!\n\n1. Which of\
    \ the following is true about an object in Java?\n   a. An object is an instance\
    \ of a method\n   b. An object is an instance of a class\n   c. An object is a\
    \ variable\n   d. An object is a loop\n\n2. What is the primary purpose of abstract\
    \ classes in Java?\n   a. to create objects directly\n   b. to provide a blueprint\
    \ for other classes\n   c. to hide information\n   d. to execute code without\
    \ an object\n\n3. Polymorphism in Java is achieved through:\n   a. inheritance\n\
    \   b. encapsulation\n   c. interfaces\n   d. overloading and overriding\n\n4.\
    \ In Java, what does inheritance represent?\n   a. the ability of a class to implement\
    \ multiple interfaces\n   b. the ability of a class to extend another class\n\
    \   c. the process of creating multiple objects\n   d. the ability of a method\
    \ to accept multiple parameters\n\n5. What is encapsulation in Java?\n   a. wrapping\
    \ data and code that operates on the data into a single unit\n   b. hiding information\
    \ by making methods private\n   c. creating multiple instances of a class\n  \
    \ d. achieving multiple inheritances\n\n6. Which keyword is used to achieve method\
    \ overriding in Java?\n   a. override\n   b. extends\n   c. implements\n   d.\
    \ super\n\n7. What is the primary purpose of an interface in Java?\n   a. to define\
    \ instance variables\n   b. to provide a common method implementation\n   c. to\
    \ achieve multiple inheritances\n   d. to declare a set of method signatures\n\
    \n8. Which of the following is an example of data hiding?\n   a. making a method\
    \ public\n   b. making a method private\n   c. using the \"static\" keyword\n\
    \   d. implementing an interface\n\n9. What is the keyword used for explicit casting\
    \ in Java?\n   a. cast\n   b. to\n   c. convert\n   d. type\n\n10. Which concept\
    \ allows a class to have multiple methods with the same name but different parameters?\n\
    \    a. inheritance\n    b. polymorphism\n    c. encapsulation\n    d. abstraction\n\
    \nHaving journeyed through the core of Java with OOP, you are now ready to navigate\
    \ more complex matters. As you know, you already have the core knowledge of Java\
    \ and are certainly ready to skill up your level. For this reason, in the next\
    \ chapter, we will learn all about exception handling.\n"
