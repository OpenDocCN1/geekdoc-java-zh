  raw: 'Sometimes, the program we are creating needs to be sent to someone or be stored.
    When this happens, the developer needs to create alternatives to ensure the program
    is working efficiently and not much memory is used. This is where serialization
    comes in. It is used to transform an object''s state into a byte stream, which
    makes it easier to be transferred. As you might imagine, when this happens, the
    file becomes unreadable, since it will be several "0"s and "1"s; therefore, it
    needs to be transformed back, or deserialized, which can also be done with the
    same package.


    Many times, these files are transformed into JSON and XML data to make them easier
    to parse while still being understood by humans. In this case, the developer can
    choose between transforming into one of these two formats or to a byte stream
    to make the process more efficient. Since we are still talking about files, you
    need to use java.io, specifically java.io.Serializable. Here is an example of
    how this would be processed in a code:


    import java.io.*;


    import java.nio.*;


    // A simple class to be serialized


    class Person implements Serializable {


    private static final long serialVersionUID = 1L;


    private String name;


    private int age;


    public Person(String name, int age) {


    this.name = name;


    this.age = age;


    }


    @Override


    public String toString() {


    return "Person{" +


    "name=''" + name + ''\'''' +


    ", age=" + age +


    ''}'';


    }


    }


    public class SerializationExample {


    public static void main(String[] args) {


    // Create an instance of the Person class


    Person person = new Person("John Doe", 30);


    // Serialize the object to a file


    serializeObject(person, "person.ser");


    // Deserialize the object from the file


    Person deserializedPerson = (Person) deserializeObject("person.ser");


    // Display the deserialized object


    System.out.println("Deserialized Person: " + deserializedPerson);


    }


    // Method to serialize an object to a file


    private static void serializeObject(Object object, String filePath) {


    try (ObjectOutputStream oos = new ObjectOutputStream(new FileOutputStream(filePath)))
    {


    oos.writeObject(object);


    System.out.println("Object serialized to " + filePath);


    } catch (IOException e) {


    System.out.println("An error occurred during serialization.");


    e.printStackTrace();


    }


    }


    // Method to deserialize an object from a file


    try (ObjectInputStream ois = new ObjectInputStream(new FileInputStream(filePath)))
    {


    return ois.readObject();


    } catch (IOException | ClassNotFoundException e) {


    System.out.println("An error occurred during deserialization.");


    e.printStackTrace();


    return null;


    }


    }


    }


    The output in this case is


    Object serialized to person.ser and


    Deserialized Person: Person{name=''John Doe'', age=30}.


    The example shows how a file was serialized and deserialized to ensure faster
    processing and data transference. Although this process requires some attention,
    since the transfer can lead to security issues especially if we are dealing with
    confidential data, you may also use encryption methods and password alternatives
    to protect the file. The different methods applied include the "ObjectInputStream
    ois" to read the object and the"ObjectOutputStream oos" to write the objects.


    ## WORKING WITH BINARY FILES


    Working with binary files can be an extremely beneficial way to work with text
    in your computer in a way the machine understands that is easy to process. In
    this case, we will have the java.io package and also the java.nio, where nio stands
    for "new io." Since these files are smaller, they enable faster processing so
    that binary image and sound files can be used. In this case, the files you are
    dealing with might not only be text.


    In this final section of the chapter, we will look into an example of how to work
    with binary files in both the .io and the .nio extensions. You will see that in
    the case of the latter, the code is significantly smaller and optimized—which
    is why many developers are migrating to it for their coding processes.


    import java.io.*;


    public class BinaryContentFileExample {


    public static void main(String[] args) {


    // Example binary content


    byte[] binaryContent = {0x4A, 0x50, 0x47, 0x0D, 0x0A, 0x1A, 0x0A}; // Example
    JPEG file signature


    String filePath = "binarycontentfile.jpg";


    // Writing binary content to a file


    writeBinaryContent(binaryContent, filePath);


    // Reading binary content from a file


    byte[] readBinaryContent = readBinaryContent(filePath);


    // Display the read binary content


    System.out.println("Read binary content: " + bytesToHex(readBinaryContent));


    }


    // Method to write binary content to a file


    private static void writeBinaryContent(byte[] content, String filePath) {


    try (FileOutputStream fos = new FileOutputStream(filePath)) {


    fos.write(content);


    System.out.println("Binary content written to file.");


    } catch (IOException e) {


    System.out.println("An error occurred while writing binary content to the file.");


    e.printStackTrace();


    }


    }


    // Method to read binary content from a file


    private static byte[] readBinaryContent(String filePath) {


    try (FileInputStream fis = new FileInputStream(filePath)) {


    ByteArrayOutputStream buffer = new ByteArrayOutputStream();


    int bytesRead;


    byte[] data = new byte[1024];


    while ((bytesRead = fis.read(data, 0, data.length)) != -1) {


    buffer.write(data, 0, bytesRead);


    }


    return buffer.toByteArray();


    } catch (IOException e) {


    System.out.println("An error occurred while reading binary content from the file.");


    e.printStackTrace();


    return null;


    }


    }


    // Helper method to convert bytes to hexadecimal string


    private static String bytesToHex(byte[] bytes) {


    StringBuilder hexStringBuilder = new StringBuilder();


    for (byte b : bytes) {


    hexStringBuilder.append(String.format("%02X ", b));


    }


    return hexStringBuilder.toString().trim();


    }


    }


    In the example you have just seen, we are representing the binary content of a
    JPEG file (an image) that has been named binarycontentfile.jpg. In this case,
    we are both serializing and deserializing the content back to make it readable.
    We have invoked the bytesToBytes method to display the content in binary in the
    hexadecimal format. However, this does not apply to all images. It will depend
    on the files you are working with and the objective you are trying to achieve.


    NIO


    import java.io.IOException;


    import java.nio.file.*;


    public class BinaryFileNIOExample {


    public static void main(String[] args) {


    // Example data


    byte[] dataToWrite = {0x48, 0x65, 0x6C, 0x6C, 0x6F}; // Hexadecimal representation
    of "Hello"


    Path filePath = Paths.get("binaryfile_nio.bin");


    // Writing to a binary file using NIO


    writeBinaryFileNIO(dataToWrite, filePath);


    // Reading from a binary file using NIO


    byte[] readData = readBinaryFileNIO(filePath);


    // Display the read data


    System.out.print("Read data: ");


    for (byte b : readData) {


    System.out.print((char) b);


    }


    }


    // Method to write data to a binary file using NIO


    private static void writeBinaryFileNIO(byte[] data, Path filePath) {


    try {


    Files.write(filePath, data, StandardOpenOption.CREATE, StandardOpenOption.WRITE);


    System.out.println("Data written to binary file using NIO.");


    } catch (IOException e) {


    System.out.println("An error occurred while writing to the binary file using NIO.");


    e.printStackTrace();


    }


    }


    // Method to read data from a binary file using NIO


    private static byte[] readBinaryFileNIO(Path filePath) {


    try {


    return Files.readAllBytes(filePath);


    } catch (IOException e) {


    System.out.println("An error occurred while reading from the binary file using
    NIO.");


    e.printStackTrace();


    return null;


    }


    }


    }


    The output for this second code is


    Data written to binary file using NIO.


    Read data: Hello'
