    \ Challa (n.d.) 根据官方文档编制的列表，其中列出了 Java 中字符串的所有内置方法：\n\n- `charAt()`：用于返回指定位置的字符。\n\
    - `concat()`：用于将一个字符串附加到另一个字符串的末尾。\n- `equals()`：用于比较两个字符串并返回布尔值（true 或 false）。\n\
    - `indexOf()`：用于返回字符首次出现标识的位置。\n- `length()`：用于识别字符串的长度。\n- `substring()`：根据传递的参数索引值提取子字符串。\n\
    - `toLowerCase()`：用于将字符串中的所有字母转换为小写。\n- `toUpperCase()`：用于将字符串中的所有字母转换为大写。\n\n\
    为了说明这些函数如何与字符串配合使用，我将使用一段代码来处理字符串，并要求编译器根据类似于 Challa 所采用的模型中请求的命令打印不同的输出。你准备好了吗？\n\
    \n```java\nclass Main{\n\n  public static void main(String []args)\n  {\n    String\
    \ name =\"Sarah\";\n    String surname=\"Connor\";\n    String profession=\"Hunter\"\
    ;\n    boolean id=name.equals(profession);\n    System.out.println(\"The letter\
    \ in position 3 is: \"+name.charAt(3));\n    // 在这种情况下输出将是 The letter in position\
    \ 3 is: a\n\n    System.out.println(name.concat(surname));\n    // 在这种情况下输出将是\
    \ SarahConnor\n\n    System.out.println(\"Compare name and surname: \"+id);\n\
    \    // 在这种情况下输出将是 Compare name and surname: false\n\n    System.out.println(name.indexOf('r'));\n\
    \    // 在这种情况下输出将是 2\n\n    System.out.println(profession.length());\n    // 在这种情况下输出将是\
    \ 6\n\n    System.out.println(profession.toLowerCase());\n    // 在这种情况下输出将是 hunter\n\
    \n    System.out.println(surname.toUpperCase());\n    // 在这种情况下输出将是 CONNOR\n\n\
    \    System.out.println(surname.substring(1,3));\n    // 在这种情况下输出将是 on\n\n   \
    \ System.out.println(name.substring(3));\n    // 在这种情况下输出将是 ah\n  }\n}\n```\n\n\
    现在你已经看到了代码的结果，关于输出，这里有一些必须考虑的注释：\n\n- 当你请求打印 \"r\" 的索引位置时，程序的输出是 \"2\"。这是因为在 Java\
    \ 中你从 0 开始计数而不是 1。因此，在这种情况下，“s”的索引为 0，“a”的索引为 1，“r”的索引为 2。\n- 虽然拼接没有在单词之间添加空格，但在输出\
    \ `Compare name and surname: false` 中，你会注意到冒号和单词 \"false\" 之间有一个空格。这在 Java 中不是自动的，当你编写你想要的输出内容时，需要指示对该空格的需求。\n\
    - 拼接函数也可以用 `+` 运算符替换。在这种情况下，如果你想使用它，语法将是：\n\n```java\nSystem.out.println(name\
    \ + \" \" + surname );\n```\n// 输出将是 Sarah Connor，因为你添加了空格\n\n好了，关于 Java 中数据类型和变量的重要信息就这些了。你已经得到了关于它们主要特征以及如何使用的全面解释。这些信息至关重要，因为你将在后面的章节中编写代码时会用到它们。然而，现在轮到你了！你准备好自己尝试一些例子了吗？\n\
    \n## 轮到你尝试了！\n\n下面是五个练习示例，你可以用来测试你是否已经掌握了内容。无论这些示例如何，我再次鼓励你花一点时间根据在本章中学学的信息来探索不同的代码可能性，包括编写错误的代码，以便你知道如果出错错误会变成什么样。\n\
    \n1. 创建一个字符串格式的新变量。\n2. 将之前创建的字符串中的所有字母转换为大写字母。\n3. 将值为 `458.96` 的 `double` 数据类型转换为\
    \ `int` 数据类型。\n4. 将值为 `6` 的 `int` 数据类型转换为 `float` 数据类型。\n5. 超级挑战：将一个值为 `56` 的\
    \ `int` 数据类型变量与一个值为 `897.69` 的 `double` 数据类型变量相加。\n\n你已经成功地深入了 Java 的海洋！从理解 Java\
    \ 的基本构建模块到处理字符串，你拓宽了自己的编程知识。但还有更多等待着发现。在下一章中，我们将探索 Java 运算符和控制语句。你准备好继续冒险了吗？\n\
    \n# 第三章：控制流\n\n当你编写代码时，无论你使用什么种类型的语言，你可能都需要通过某些命令进行编程。我们经常看到的一个简单例子是，当我们需要登录一个请求密码的网站或应用时。在这种情况下，如果我们输入正确的选项，就可以登录。如果不是，我们就无法登录。这是一个\
    \ \"if\" 子句，是你在本章中将学习的内容之一。\n\n为了帮助你熟悉 Java 中的控制流并学习开发条件语句，我们还将讨论循环结构、`break`\
    \ 和 `continue` 语句以及逻辑运算符。\n\n## 条件语句\n\n条件语句正如你想象的，是一个条件。例如，如果下雨了，我会带伞；如果没有，我就不带。这两个关键字\
    \ `if`-`then` 是这些条件语句的保留关键字。它们用于创建程序需要执行的动作序列。在这种情况下，如果条件为真，那么这就是输出。如果不是（`else`），那么将会出现其他信息。`if-else`\
    \ 条件可以用于 `float`、`char`、`int` 和 `boolean`，并且该语句可以由多个声明组成。然而，至关重要的是记住计算机将按照你编写代码的顺序执行。让我们来看例子。\n\
    \n假设你创建一个日程，让每一天代表一个特定的数字。在这种情况下，你可以告诉程序第 1 天等于（`==`）周一，第 2 天等于周二，第 3 天等于周三。如果在字段中放置了任何其他数字，输出应该是\
    \ \"Other day\"。代码看起来如下：\n\n```java\nPublic class Main{\n\n  public static void\
    \ main(String []args)\n  {\n    int day = 3;\n    String dayName;\n\n    if (day\
    \ == 1) {\n      dayName = \"Monday\";\n    } else if (day == 2) {\n      dayName\
    \ = \"Tuesday\";\n    } else if (day == 3) {\n      dayName = \"Wednesday\";\n\
    \    } else {\n      dayName = \"Other day\";\n    }\n\n    System.out.println(\"\
    Using if-else: \" + dayName);\n  }\n}\n```\n\n在这种情况下，我们确定了我们正在使用的 `int` 数字是 3；因此，程序的输出将是\
    \ `Using if-else: Wednesday`。如果你将语句 `int day = 3;` 替换为 `2`，例如，输出将是 `Tuesday`。尝试一下！\n\
    \n"
- fmt: "\nAlthough this is an easy and efficient way to make your code work, you must\
    \ remember that if you use it too much or apply too many statements, your program\
    \ might be slower. It will also make the process harder to edit if necessary since\
    \ each change will deal with several variables. For this reason, another conditional\
    \ keyword can be used in Java that will allow you to optimize the coding and make\
    \ it faster, replacing the different if-else statements. This conditional is known\
    \ as the `switch` statement.\n\nLet's see how the `switch` statement would be\
    \ applied in the previous example:\n\n```java\npublic class Main{\n    public\
    \ static void main(String []args)\n    {\n        int day = 3;\n        switch\
    \ (day){\n            case 1:\n                System.out.println(\"Monday\");\n\
    \                break;\n            case 2:\n                System.out.println(\"\
    Tuesday\");\n                break;\n            case 3:\n                System.out.println(\"\
    Wednesday\");\n                break;\n            default:\n                System.out.println(\"\
    Other days of the week\");\n        }\n    }\n}\n```\n\nIn this case, as you can\
    \ see, we have replaced the if-else statements with \"cases\" and \"breaks,\"\
    \ which enables the program to make the decision likewise. The program will run\
    \ all the decisions until the end is reached or the `break` statement is identified.\
    \ In this case, you will use one statement for different decisions (look at where\
    \ the `{}` open and close), making writing, editing, and testing the code easier.\
    \ On the other hand, the logic of the code will not be tested, as would happen\
    \ with if-else.\n\nThe other difference you will see is that there is a `default`\
    \ keyword at the end. This value should be applied if any conditions do not meet\
    \ the criteria. This means that if you were to input numbers 1–3, you would have\
    \ the same input as you have seen in the previous section. However, if the number\
    \ differed from these, the output would be `Other days of the week`.\n\nWhile\
    \ these statements will help you control the program's logic, can you imagine\
    \ what would happen if you needed to create a countdown program? How many lines\
    \ of code would you need to write for every output number that should be shown\
    \ on the screen? If we were talking about 10, that might not be so hard, but what\
    \ if we were using a timer to count down how much time a person has left to perform\
    \ a certain task? That would certainly take many code lines and time.\n\nNonetheless,\
    \ you should not worry since Java has a solution for avoiding this. We will see\
    \ these in the next section, and they are called looping structures. When you\
    \ write these statements, they will enable the program to carry out the same task\
    \ for a certain number of iterations or until the condition is false. Interested?\
    \ I can bet you are! Let's take a look!\n\n## LOOPING STRUCTURES\n\nWhen coding\
    \ in Java, you have three loops that can be applied to your program: `for`, `while`,\
    \ and `do-while` statements. These enable the developer to command the program\
    \ to perform several repetitions (iterations) until it finds a condition that\
    \ makes the statement false or according to the determined number requested and\
    \ identified in the code. This section will explore each type of loop, the best\
    \ time to apply them, and the syntax that should be used according to each situation.\n\
    \n### For Loop\n\nThe first loop we will look at is the `for` loop. In this loop,\
    \ you will tell the program exactly the parameters you want it to run. Due to\
    \ this characteristic, most programmers use the `for` loop when they have a certain\
    \ number of iterations they want the program to carry out. In this case, you will\
    \ declare the variable and the condition that you will make it follow.\n\nSuppose\
    \ you are creating a timer that needs to count to five for a test to start. For\
    \ this, you will need to create a program using a `for` loop to show the numbers\
