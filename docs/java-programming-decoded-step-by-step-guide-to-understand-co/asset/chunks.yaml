    In this case, we are not yet calling the method to have it execute what we want
    it to do. To do this, you need to call the method so that it can be used. "You
    can call a method by using its name followed by the parentheses and a semicolon"
    (Simplilearn, 2023). In our example, this is what it could look like:


    public class Main {


    //calling the code to act in between the curly brackets


    static void myMethod () {


    System.out.println ("This is me calling my method!");


    }


    public static void main(String args[]){


    myMethod();


    }


    }


    In this case, you will see the method has two elements we have not talked about
    yet, although you have been using them: parameters and the return value. Let''s
    understand them a little better and what their use and application are when running
    your Java code.


    ## UNDERSTANDING METHOD PARAMETERS AND RETURN TYPES


    Suppose we go back to our hotel example. Each person will have an assigned task
    (method) and within these, they will need to follow rules and guidelines. These
    are the parameters of the Java method. If you are going to ask Java to perform
    a countdown, you need to specify if it is going to do so by decreasing one, two,
    or any other amount from the original number. If you are going to program it to
    increase or decrease the volume, it must be able to understand the command to
    "increase the volume in a certain number of tones" or "decrease the volume" according
    to a parameter.


    However, it is rather different if you are going to program for software to understand
    "increase" and "decrease" the volume, or if it should "increase or decrease in
    a certain amount of tones." Just like in a hotel where the reception might book
    reservations that come from walk-ins, and the guest services for those made by
    the telephone, it is important to specify exactly what you want it to do; therefore,
    the more possibilities it gives you, the better. Let''s say in the hotel there
    is no one in guest services to answer the phone and make the reservation. This
    means that the task should be directed somewhere else so the individual can reserve
    a room. In a code for our volume analysis, this would look like this:


    public class Main {


    //declaring the variable with the current volume


    private static int currentVolume = 5;


    //declare the main method


    public static void main(String[] args) {


    System.out.println(" Current volume: " + currentVolume);


    //establish the method call (volume) and the parameters (inside the ())


    volume("increase", 4);


    System.out.println(" Current volume: " + currentVolume);


    //establish the method call (volume) and the parameters (inside the ())


    volume("decrease", 2);


    System.out.println(" Current volume: " + currentVolume);


    }


    //declare the Volume method


    public static void volume(String action, int quantity){


    //establish the actions you want it to do using an if-else statement


    if ("increase".equals(action)){


    currentVolume = currentVolume + quantity;


    }else{


    currentVolume = currentVolume - quantity;


    }


    }


    }


    In this case, you do not have a return value because you are working with a void
    method and the established parameters for the current volume, which is 5\. However,
    in Java, it is also possible to have the method return an action and, for this
    to happen, you will need to use the return keyword. In this case, it will be placed
    after the function has been declared to tell it what it is you want the system
    to return.


    Using the Return Value


    Suppose you are writing a program that you want to calculate the sum of two numbers.
    In this case, you would need to use the data types that support this function.
    For example, we could not use the string or the boolean, since they will not return
    numbers. On the other hand, it would be possible to use double, float, long, and
    int. While in the previous example, you had established variables, in the case
    we are about to see, in which the return keyword is used, you can determine "generic"
    arguments that will make the code more versatile. Here is an example:


    public class ReturnExample {


    //declare and write the arguments for the method


    public int add(int a, int b) {


    int c = a+b;


    return c;


    }


    public static void main(String args[]) {


    ReturnExample try = new ReturnExample();


    int add = try.add(5, 2);


    System.out.println("The sum of a and b is: " + add);


    }


    }


    The output in this case will be: The sum of a and b is 7\. In this case, you will
    be able to declare different values for a and b depending on what you will add
    inside the parentheses. For example, if you were to change int add = try.add(5,
    2); to int add = try.add(3, 2);, the answer would now be different and it would
    be 5\. This allows you to reuse the same code for different functions, bringing
    your code versatility and various applications.


    But you must be asking yourself, Is it possible to have a method using different
    parameters or different types such as we have now seen? The answer is yes, it
    is possible and there is even a technique for it within Java. This is called method
    overloading and is exactly what we are about to see next.


    ## METHOD OVERLOADING


    When writing code, it is possible to have more than one method within a specific
    class. It is also possible to have the same method carrying out different tasks
    and parameters. This technique is called method overloading and is an excellent
    way to optimize the number of code lines you are using in your program. This method
    "allows a class to have more than one method with the same name, but with different
    parameters" by either changing the number of parameters or modifying the data
    type that you are using (Great Learning Team, 2023).


    To illustrate how method overloading works, let''s look at the last example we
    saw in the previous section. In this case, we had the following:


    public class ReturnExample {


    //declare and write the arguments for the method


    public int add(int a, int b) {


    int c = a+b;


    return c;


    }


    public static void main(String args[]) {


    ReturnExample try = new ReturnExample();


    int add = try.add(5, 2);


    System.out.println("The sum of a and b is: " + add);


    }


    }


    Suppose you were dealing with a program that needed to deliver not only the full
    number as a result but also the different numbers with decimal points. While you
    could create and declare a method for each of the functions, when you use method
    overloading, you are giving the system the possibility to find the same answers
    with one parameter. If we were to create the answers in double, for example, the
    code would look like this:


    public class CalculateSum {


    public void line(int numberA, int numberB)


    {


    int sum = numberA + numberB;


    System.out.println("Using the integer calculation, the answer is: " +sum);


    }


    public void line(double numberA, double numberB)


    {


    double sum = numberA + numberB;


    System.out.println("Using the double calculation, the answer is: " +sum);


    }


    public static void main(String[] args)


    {


    CalculateSum calc = new CalculateSum();


    calc.line(4, 3);


    calc.line(4.3, 3.6);


    }


    }


    In this case, the name of the method is line, and the variable is called sum.
    You have used the line method for both the int and the double sum; therefore,
    you are overloading the method. In this case, as you can see, instead of creating
    different methods and lines for the same calculation, you only added two additional
    code lines and variables to obtain the result, making the code more readable.
    The output for this example would be:


    Using the integer calculation, the answer is: 7


    Using the double calculation, the answer is: 7.9'
