    Enter your age: -12\nError: Age cannot be negative\nScanner closed in the finally\
    \ block.\n```\n\n在这个示例中，用户输入了一个负数年龄，因此代码抛出了带有定向错误信息的自定义异常（`IllegalArgumentException`）。在这里，我们还使用了\
    \ `catch` 块来处理此异常并打印错误信息。最后，`finally` 块确保了即使发生异常，扫描器始终被关闭。\n\n虽然内置异常非常有用，但许多开发者在创建系统时更倾向于创建自己的异常。这是因为他们能够根据系统的需求以及可能出现的不同情况量身定制异常。在本章的最后一节中，我们将介绍什么是自定义异常以及如何创建它们。\n\
    \n## 创建自定义异常\n\n自定义异常是通过扩展 `exception` 类来创建的。正如你在下面的代码中所看到的，你将根据特定的业务需求甚至你想要处理的情况用你定义的名称声明异常类，但你需要将其从父类\
    \ `Exception` 扩展出来。当你这样做时，有几条规则必须记住：\n\n1. 仅创建有用且有目的的异常。由于 `Java` 中的大多数异常类已经涵盖了开发者的需求，创建异常需要满足你所工作业务的特定需求，否则将从中获得任何收益。\n\
    2. 在创建异常时，你应该对其进行文档说明，解释你想让它做什么。只有这样做，其他人才能理解你为什么要创建它以及使用它的原因。\n3. 必要时对代码进行注释以解释你的推理逻辑。你需要为你正在创建的异常提供信息，并设置你想要处理的异常的因和详细信息。\n\
    4. 将 `Java` 规范应用于异常中。这意味着使用驼峰命名法来命名你创建的类，并在结尾添加 \"exception\" 单词。\n\n考虑到这一点，让我们来看一个自定义的（或用户自定义）异常以及它是如何应用的。\n\
    \n```java\n// 自定义异常类\nclass NegativeAgeException extends Exception {\n    public\
    \ NegativeAgeException(String message) {\n        super(message);\n    }\n}\n\n\
    public class CustomExceptionExample {\n    // 抛出自定义异常的方法\n    public static void\
    \ validateAge(int age) throws NegativeAgeException {\n        if (age < 0) {\n\
    \            // 如果年龄为负则抛出自定义异常\n            throw new NegativeAgeException(\"\
    Age cannot be negative\");\n        }\n        // 如果年龄有效则处理其他逻辑\n        System.out.println(\"\
    Valid age: \" + age);\n    }\n\n    public static void main(String[] args) {\n\
    \        try {\n            // 调用可能抛出自定义异常的方法\n            validateAge(-5);\n\
    \        } catch (NegativeAgeException e) {\n            // 处理自定义异常\n        \
    \    System.out.println(\"Error: \" + e.getMessage());\n        }\n    }\n}\n\
    ```\n\n此情况的输出将是：`Error: Age cannot be negative.` 在示例中，我们创建了一个扩展 `Exception` 类的自定义异常类\
    \ `NegativeAgeException`。`validateAge` 方法在年龄为负时抛出此自定义异常。最后，为了确保应用异常，我们将在 `main`\
    \ 方法中发生 `NegativeAgeException` 时捕获并处理它，从而使过程正常运行并保持程序流畅。\n\n"
