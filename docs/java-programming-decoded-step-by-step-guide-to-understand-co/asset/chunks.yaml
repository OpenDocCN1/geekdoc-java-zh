  raw: 'As mentioned earlier, when you want to handle files in Java, you need to download
    the relevant package. There are many different options in the market, and it will
    be up to you to decide which you want to use. For this chapter, we will use the
    package "java.io," and will need the extensions File, FileWriter, FileReader,
    BufferedReader, and IOException. These will enable you to carry out some different
    actions with your Java program.


    As usual, you will see that the code you will learn from is commented on at each
    step, to ease understanding. There will be guided steps for you to carry out all
    the actions, and you know what? They are actually pretty easy. Let''s take a look
    at the actions you need to carry out and what they do when considering file management.


    //Import to create a new file or use directories using method from the package


    import java.io.File;


    //Import to write a file text or string in Java


    import java.io.FileWriter;


    //Import to read characters from a file


    import java.io.FileReader;


    //Import to read a text from the input


    import java.io.BufferedReader;


    //Import to handle IO exceptions, which occur while using files in Java.


    import java.io.IOException;


    public class FileIOExample {


    public static void main(String[] args) {


    // Specify the file path of the file you are going to create and the type


    String filePath = "example.txt";


    // Create a file


    createFile(filePath);


    // Write to the file


    writeToFile(filePath, "Hello, this is a sample text!");


    // Read from the file


    readFromFile(filePath);


    // Delete the file


    deleteFile(filePath);


    }


    // Method to create a file


    private static void createFile(String filePath) {


    try {


    File file = new File(filePath);


    // Create a new file if it doesn''t exist


    if (file.createNewFile()) {


    System.out.println("File created: " + file.getName());


    } else {


    System.out.println("File already exists.");


    }


    } catch (IOException e) {


    System.out.println("An error occurred while creating the file.");


    e.printStackTrace();


    }


    }


    // Method to write to a file


    private static void writeToFile(String filePath, String content) {


    try (FileWriter writer = new FileWriter(filePath)) {


    writer.write(content);


    System.out.println("Content written to the file.");


    } catch (IOException e) {


    System.out.println("An error occurred while writing to the file.");


    e.printStackTrace();


    }


    }


    // Method to read from a file


    private static void readFromFile(String filePath) {


    try (BufferedReader reader = new BufferedReader(new FileReader(filePath))) {


    String line;


    System.out.println("Reading from the file:");


    while ((line = reader.readLine()) != null) {


    System.out.println(line);


    }


    } catch (IOException e) {


    System.out.println("An error occurred while reading from the file.");


    e.printStackTrace();


    }


    }


    // Method to delete a file


    private static void deleteFile(String filePath) {


    File file = new File(filePath);


    if (file.delete()) {


    System.out.println("File deleted: " + file.getName());


    } else {


    System.out.println("Failed to delete the file.");


    }


    }


    }


    If you were to execute this code in your IDE with a file with the same name, you
    would see that the output would be the following:


    File already exists.


    Content written to the file.


    Reading from the file:


    Hello, this is a sample text!


    File deleted: example.txt


    As you might have noticed, we used different packages to use the read and write
    function to better understand them. Let''s take a look at how they work for reading
    and writing files in Java and the different options you can use when you are working
    with files.


    ## READING AND WRITING TEXT FILES


    As mentioned earlier, when you are looking to work with files in your Java program,
    there are different options you can choose from. In this section, we will look
    into a few of them and then see how they perform in the code. When working with
    different packages (especially the java.io), you have the option of adopting,
    among others, the following, according to Minh (2019):


    *   FileWriter: This will enable the class to write single, array, and string
    of characters efficiently. It can be used to efficiently write files and encode
    what you want to add to the file.


    *   FileReader: This will enable the program to read files, including single characters,
    character array, read while skipping certain characters, and closing the stream.


    *   InputStreamReader: This converts bytes into characters according to the specific
    data type you are looking to use.


    *   BufferedReader: This will put the content into a buffer so it can be efficiently
    read and streamed, granting the ability to read full lines of text.


    *   BufferedWriter: Used to enable the character writing stream to be efficient
    when writing and enable the program to remember what you want it to do.


    As you will see, from the java.io package, you are able to create different classes
    to code and determine what the code will do. If you are looking for more packages
    to download and their different functions, you can find them in the appendix of
    this book. In the meantime, let''s look at another code example using these different
    packages.


    import java.io.FileWriter;


    import java.io.FileReader;


    import java.io.BufferedReader;


    import java.io.BufferedWriter;


    import java.io.IOException;


    public class TextFileReadWriteExample {


    public static void main(String[] args) {


    // Specify the file path


    String filePath = "example.txt";


    // Write to the file


    writeToFile(filePath, "Hello, this is a sample text!");


    // Read from the file


    String content = readFromFile(filePath);


    System.out.println("Read from the file:");


    System.out.println("-------------------------------");


    System.out.println(content);


    System.out.println("-------------------------------");


    }


    // Method to write to a file


    private static void writeToFile(String filePath, String content) {


    try (BufferedWriter writer = new BufferedWriter(new FileWriter(filePath))) {


    writer.write(content);


    System.out.println("Content written to the file.");


    } catch (IOException e) {


    System.out.println("An error occurred while writing to the file.");


    e.printStackTrace();


    }


    }


    // Method to read from a file


    private static String readFromFile(String filePath) {


    StringBuilder content = new StringBuilder();


    try (BufferedReader reader = new BufferedReader(new FileReader(filePath))) {


    String line;


    while ((line = reader.readLine()) != null) {


    content.append(line);


    }


    } catch (IOException e) {


    System.out.println("An error occurred while reading from the file.");


    e.printStackTrace();


    }


    return content.toString();


    }


    }


    When you run this code, the result will be the following output:


    Content written to the file.


    Read from the file:


    -------------------------------


    Hello, this is a sample text!


    In this example, you have seen that the BufferedWriter and the BufferedReader
    classes are used in the code to write and read the code. The methods writeToFile
    and readFromFile were applied to enable this to happen. The name of the file was
    just a simulation, but you will be able to name it according to your preferences.


    While these are useful ways to work with files and streamline processes, you might
    face a situation in which you will need to transform its contents into a byte
    stream. When this happens, you will need to apply serialization and deserialization
    techniques to ensure that the file can be read appropriately. This is also done
    to save memory from the program and make it work faster. To see how to carry out
    these techniques, in the next section, we will talk about them and when they can
    be applied to make the processing more efficient.


    ## SERIALIZATION AND DESERIALIZATION'
