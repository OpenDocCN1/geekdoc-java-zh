    ## YOUR TURN TO TRY!


    To see if you have learned the content of this chapter, here are seven exercises
    that cover its content. You will find the answers to these at the end of the book.
    Even if you get them all right, I encourage you to continue exploring some more
    and change the variables to help you retain what you have seen so far.


    1.  Write a Java program with an integer array to create an array of integers,
    and within this array, determine the sum of all elements, the maximum and minimum
    values, sort the numbers in ascending order, and calculate the average of the
    elements.


    2.  Use ArrayList in Java to create a list of strings. In this example, you should
    use the list to add, remove, and update elements, check if a specific element
    exists, find the length, and iterate using a for-each loop and print each element.


    3.  Create an integer array and convert it to an ArrayList. Carry out list operations
    like adding, removing, and iterating through elements.


    4.  Create a two-dimensional array (matrix) and perform operations that include
    adding, subtracting, and multiplying the elements of the two matrices, transposing
    elements, and finding the determinant of a square matrix.


    Super challenge: Use LinkedList or ArrayDeque in Java to create a queue and perform
    operations (enqueue and dequeue) and create a stack and perform stack operations
    (push and pop).


    If your idea is to work with data in Java, then this is certainly one of the most
    important chapters in the book for you, since they are essential for optimizing
    your time. In the next chapter, we will dive deeper into Java''s heart and understand
    its methods and how these are the structures that help it be the force it is today.
    If you are ready to discover the power of Java, move on to the next chapter and
    learn how to master methods in Java.


    CHAPTER 5


    MASTERING METHODS IN JAVA


    When we build a house, for it to stand, it needs to have beams and a structure
    to resist the different weather challenges it might undergo. If the house does
    not have a strong "backbone," it will not stand, and the structure will not hold.
    In Java, the methods work in the same way, since they will provide the structure
    and organization needed for the code to work.


    In this chapter, you will learn about one of the main concepts of the language,
    including the different method parameters, what return types are and how they
    work, a technique called method overloading, and variable scopes. You will see
    that these methods are what give the code the needed versatility for it to work
    and even be reused if necessary. The method is what is going to perform the action
    we are requesting the system to perform, much like a guide to what it is supposed
    to do. If you are ready to learn more about Java methods and how they are used,
    read on! One of the most important parts of your journey is about to start.


    ## INTRODUCTION TO METHODS


    Think about a hotel. In it, there are many employees who carry out different tasks;
    you have those responsible for the reception, room service, maintenance, guest
    reservations, cooking, cleaning, and so much more. Each of these individuals is
    performing a specific task with an established set of instructions that allows
    them to carry out their jobs. This is exactly what the Java method does. When
    you apply it, you are giving the code the needed instruction of what it should
    do and only of that specific instance.


    In previous examples you have seen in this book, we have used methods, but these
    were not given a name. In the example below, we have the following breakdown:


    //establishing the name of the class


    public class Main {


    //establishing the method named myMethod (should be used in camel case)


    //does not return anything (void), and the entrance parameters for the logic.


    //inside the method you can use ints and strings to create the action you need
    it to carry out


    public void myMethod (int parameter1, String parameter2){


    }


    }


    In this case, we have created a logic that does not return any value, but this
    is not necessarily the case for all the code you are going to see. In another
    example we could use, we could create the method "volume" and determine in the
    logic that we want it to return a specific volume for the application.


    For example, when you have a virtual assistant, such as Alexa, you will ask it
    to "increase volume," and what it will do is obtain the parameter it is already
    at (current volume) and add the requested increase to make it louder. At the same
    time, this method can be reused because you are going to apply the same logic
    to decrease the volume. In this case, the method will have two parameters: action,
    which is to increase or decrease volume, and how much it should be increased or
    decreased.


    This shows the versatility of a method that allows you to reuse the code for different
    applications, making your code lines more readable, versatile, and reusable. However,
    to establish what the method needs to do, it is necessary to declare and call
    it so it can perform the necessary action. Let''s see what this would look like
    in different Java coding examples.


    ## DECLARING AND CALLING METHODS


    Naming, declaring, and calling methods in Java have specific rules that are not
    mandatory, but should be used as part of the best practices of the Java convention.
    For example, when naming a method, you should ensure you name it according to
    the action you want it to carry out. If you are going to ask the program to manage
    the volume of an application, for example, it should be named "volume," "tone,"
    or something that makes it understandable for others who read the code. You shouldn''t,
    for example, use something like "count," "add," or even "draw," since these would
    not be directly related to what the method is going to do.


    Additionally, when you are naming a method, and it has more than one word, you
    should use camel case, with the first letter of the first word being in lowercase
    and, ideally, a verb. The reason for this is that the method is literally the
    action that the program will carry out; therefore, it is a verb nonetheless. However,
    it is important to know that "the only required elements of a method declaration
    are the method''s return type, name, a pair of parentheses, (), and a body between
    braces, {}" (Defining Methods, n.d.). In the structure of naming and declaring
    a method, you must have the following:


    *   The determination of what modifiers you are going to use, such as private
    or public, which will determine the access to the method by the other parts of
    the program.


    *   What is the data type that should be returned by the code, such as an integer,
    boolean, or string? If nothing should be returned, then a void should be declared.


    *   Determine the name of the method, specifying what it is supposed to do.


    *   The parameters that you want to use for this code should be added inside the
    parenthesis next to the method name. Even if there are no parameters, you should
    use empty parenthesis to ensure the code is correct.


    *   Check if there are any exceptions in the code.


    *   Declare the variables and any other information that needs to be inside the
    method and what it should do. This information should be written in between the
    open and closed curly brackets that should be used in the code.'
