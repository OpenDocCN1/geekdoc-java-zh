    implementations of this code, I will take a moment and use this opportunity to
    show you how different objects can be manipulated using a lambda.


    "Lambdas allow programmers to make their code shorter, efficient, and more functional.
    They help one to iterate through a collection of objects and avoid numerous mistakes"
    (How to Manipulate Objects, 2021). Nonetheless, before we learn how to use lambdas
    in Java, let''s use two examples to recap how classes and instances are created.
    Creating this class and these instances will be important to understand the last
    example, where the lambda will be used. Please note that if you are going to paste
    this code into your IDE, you should remember to remove the subheadings, so the
    code can work.


    Creating a Class


    // Define a simple class


    public class Car {


    // Fields (attributes)


    String model;


    int year;


    // Constructor


    public Car(String model, int year) {


    this.model = model;


    this.year = year;


    }


    // Method to display information


    public void displayInfo() {


    System.out.println("Model: " + model);


    System.out.println("Year: " + year);


    }


    }


    Creating an Instance


    public class ObjectInteractionExample1 {


    public static void main(String[] args) {


    // Create instances of the Car class


    Car car1 = new Car("Toyota Camry", 2022);


    Car car2 = new Car("Honda Accord", 2021);


    }


    }


    Interacting With Objects


    public class ObjectInteractionExample2 {


    public static void main(String[] args) {


    // Create instances of the Car class


    Car car1 = new Car("Toyota Camry", 2022);


    Car car2 = new Car("Honda Accord", 2021);


    // Access and modify object properties


    // Display information about car1


    car1.displayInfo();


    // Display information about car2


    car2.displayInfo();


    // Modify the year of car1


    car1.year = 2023;


    // Display updated information


    car1.displayInfo();


    }


    }


    In this example, we create a "Car" class with fields (model and year), a constructor
    to initialize objects, and a method "displayInfo" to display information about
    the car. The next thing we do is create two instances of the "Car" class ("car1"
    and "car2") using the new keyword. Finally, we interact with the objects by accessing
    and modifying their properties and calling methods.


    After you have read this chapter, you now know all the different ways and techniques
    to write basic code in Java. It is time to test your knowledge and see if you
    have committed to memory what you have read so far. Are you ready to test what
    you''ve learned?


    ## LET''S TEST YOUR KNOWLEDGE!


    1\. Which of the following is true about an object in Java?


    a. An object is an instance of a method


    b. An object is an instance of a class


    c. An object is a variable


    d. An object is a loop


    2\. What is the primary purpose of abstract classes in Java?


    a. to create objects directly


    b. to provide a blueprint for other classes


    c. to hide information


    d. to execute code without an object


    3\. Polymorphism in Java is achieved through:


    a. inheritance


    b. encapsulation


    c. interfaces


    d. overloading and overriding


    4\. In Java, what does inheritance represent?


    a. the ability of a class to implement multiple interfaces


    b. the ability of a class to extend another class


    c. the process of creating multiple objects


    d. the ability of a method to accept multiple parameters


    5\. What is encapsulation in Java?


    a. wrapping data and code that operates on the data into a     single unit


    b. hiding information by making methods private


    c. creating multiple instances of a class


    d. achieving multiple inheritances


    6\. Which keyword is used to achieve method overriding in Java?


    a. override


    b. extends


    c. implements


    d. super


    7\. What is the primary purpose of an interface in Java?


    a. to define instance variables


    b. to provide a common method implementation


    c. to achieve multiple inheritances


    d. to declare a set of method signatures


    8\. Which of the following is an example of data hiding?


    a. making a method public


    b. making a method private


    c. using the "static" keyword


    d. implementing an interface


    9\. What is the keyword used for explicit casting in Java?


    a. cast


    b. to


    c. convert


    d. type


    10\. Which concept allows a class to have multiple methods with the same name
    but different parameters?


    a. inheritance


    b. polymorphism


    c. encapsulation


    d. abstraction


    Having journeyed through the core of Java with OOP, you are now ready to navigate
    more complex matters. As you know, you already have the core knowledge of Java
    and are certainly ready to skill up your level. For this reason, in the next chapter,
    we will learn all about exception handling. By learning this, you will see how
    to anticipate, detect, and handle errors in your code. I encourage you to keep
    going; your mastery of Java is just around the corner!


    SPEAK THE LANGUAGE


    “It is not enough for code to work.”


    ROBERT C. MARTIN


    In the introduction, we learned two conflicting things about Java that can cause
    a problem for many novice programmers: It’s one of the most popular programming
    languages in usage, and the complex code makes it a challenge for new programmers.  


    For many programmers, the theory is all there, but when you’ve learned it formally,
    you don’t necessarily have an understanding of its depth and versatility. In writing
    this book, my goal is to make that understanding accessible so that new programmers
    can access all that Java has to offer without stumbling over issues with debugging
    or getting stuck at a specific coding hurdle. I want to bridge that gap between
    accessibility and potential.


    Now that we’re further through our journey and your understanding of Java is growing,
    I’d like your help bridging this gap for other novice programmers. Java is a language
    like any other: The more people speak it fluently, the richer the possibilities
    for communication are.


    If you would be willing to take a couple of minutes to leave your feedback online,
    you’ll help more programmers find the information they need to bridge that gap
    and gain a firm understanding of the language.


    By leaving a review of this book on Amazon, you’ll show other programmers where
    they can find this essential link between what they know already and a true understanding
    of Java. 


    It’s true that Java is a complex language, but the more you discover about its
    potential and its practical usage, the easier it is to master. Your review will
    help new readers access that essential understanding.  


    Thank you so much for your support. Languages grow when we speak them, and in
    the case of Java, speaking about them is the first step to enabling this.


    CHAPTER 7


    EXCEPTION HANDLING


    If you are just starting your journey using Java, then, more likely than not,
    you are going to have to correct errors in your code. Regardless of whether we
    are talking about a semicolon, a missing bracket or you are missing a class declaration,
    knowing how to correct your code and handle exceptions is essential for a good
    developer. In fact, knowing how to handle exceptions in Java is what differentiates
    a good from a great developer, and the same applies to the quality of your code.'
