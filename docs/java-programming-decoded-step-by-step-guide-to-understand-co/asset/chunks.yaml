    \ statements together instead of `catch`, for example. But you might be wondering\
    \ how the `finally` block works and when it should be applied. Let's move on to\
    \ the next section and see how you can use it and the different application possibilities.\n\
    \n# THE FINALLY BLOCK\n\nAs you already know, the `finally` block can be used\
    \ without the `catch` statement. This block should be used when you want the code\
    \ to run, regardless of whether there is an exception or not. In an example similar\
    \ to what we have seen before, the `finally` block will be used to close the `scanner`\
