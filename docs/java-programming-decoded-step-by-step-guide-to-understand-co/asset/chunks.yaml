    above, where you have added the statement myTestArray [2] = "lemons"; you are
    telling the program that you want the myTestArray index number 2 to be replaced
    by lemons. Therefore, when you print the new list by changing the print statement
    from System.out.println(myTestArray[2]); to System.out.println("The fruits I bought
    were: "+ Arrays.toString(myTestArray)); the output will be: The fruits I bought
