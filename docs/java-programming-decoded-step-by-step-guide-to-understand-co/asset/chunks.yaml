    ## CREATING CLIENT-SERVER APPLICATIONS


    Although it might seem that creating a client-server application is complicated,
    the process is rather simple and can be carried out by downloading the java.io
    and the java.net packages and their specific classes. According to Nishkarshgandhi
    (2023), these are the five steps that should be followed to start creating your
    own code:


    1.  Instantiate a ServerSocket object in the server informing it at which number
    the communication will happen.


    2.  The server will request the accept() method and pause until the connection
    is made between the TCPs.


    3.  The server will instantiate an object of the socket class in the client, and
    the server and port number will be given for connection.


    4.  The constructor tries to connect to the designated server and port number.
    If the contact is authenticated, both servers will connect and start exchanging
    information.


    5.  The server returns a reference to the new socket based on the client socket.


    6.  Connection is closed between server and client ports.


    In the two different code blocks you will see below, it will be possible to understand
    how the server and the client should have their network coded for this communication
    to work.


    Server


    import java.io.IOException;


    import java.io.ObjectInputStream;


    import java.io.ObjectOutputStream;


    import java.net.ServerSocket;


    import java.net.Socket;


    public class SimpleServer {


    public static void main(String[] args) {


    final int PORT = 12345;


    try {


    // Create a server socket


    ServerSocket serverSocket = new ServerSocket(PORT);


    System.out.println("Server is listening on port " + PORT);


    // Wait for a client to connect


    Socket clientSocket = serverSocket.accept();


    System.out.println("Client connected");


    // Set up object input and output streams


    ObjectInputStream objectInput = new ObjectInputStream(clientSocket.getInputStream());


    ObjectOutputStream objectOutput = new ObjectOutputStream(clientSocket.getOutputStream());


    // Read and print an object from the client


    Object receivedObject = objectInput.readObject();


    System.out.println("Received from client: " + receivedObject);


    // Send a response object back to the client


    Object response = "Hello from server!";


    objectOutput.writeObject(response);


    // Close the server socket


    serverSocket.close();


    } catch (IOException | ClassNotFoundException e) {


    e.printStackTrace();


    }


    }


    }


    Client


    import java.io.IOException;


    import java.io.ObjectInputStream;


    import java.io.ObjectOutputStream;


    import java.net.Socket;


    public class SimpleClient {


    public static void main(String[] args) {


    final String SERVER_IP = "127.0.0.1";


    final int SERVER_PORT = 12345;


    try {


    // Connect to the server


    Socket socket = new Socket(SERVER_IP, SERVER_PORT);


    System.out.println("Connected to server");


    // Set up object input and output streams


    ObjectOutputStream objectOutput = new ObjectOutputStream(socket.getOutputStream());


    ObjectInputStream objectInput = new ObjectInputStream(socket.getInputStream());


    // Send an object to the server


    Object message = "Hello from client!";


    objectOutput.writeObject(message);


    // Receive and print an object from the server


    Object receivedObject = objectInput.readObject();


    System.out.println("Received from server: " + receivedObject);


    // Close the client socket


    socket.close();


    } catch (IOException | ClassNotFoundException e) {


    e.printStackTrace();


    }


    }


    }


    While this is one of the ways to create and connect a network between client and
    server, there are other ways this can be done. To help you understand another
    way to make two computers communicate over a network, in the next section, we
    will see another code example that can be used as an alternative. This will give
    you more insight into the process of how the code should be generated and more
    options to select from.'
