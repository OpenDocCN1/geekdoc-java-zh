    这正是本书大显身场。它被开发为一个全面的指南，旨在帮助志向 Java 的开发者以及已经在领域深耕一段时间的人，通过它来解密编码的秘密。从理解语言的核心概念到学习如何高效地调试和测试你创建的程序，你作为职业
    Java 开发者职业所需的所有信息，都可以在书中找到。


    以下是阅读本书的一些益处：


    *   **快速通道学习**：本书是一部通往 Java 编程知识顶层的快速电梯。它消除了在海洋碎片化在线资源中挣扎的必要性，提供了一个结构化且全面的学习历程。

    *   **实用的代码示例**：书中充满了实用的代码示例，引导你理解并编写 Java 代码。这种实操方法将帮助你学得更快、更好。

    *   **理解核心概念**：将复杂的 Java 编程术语和概念拆解为易于理解的部分。掌握构成 Java 编程基础的核心概念，巩固你的基础。

    *   **揭秘调试**：对于初学者来说，调试可能是一项艰巨的任务。通过本指南，你将获得有效的调试策略，帮助你自信地处理错误并提高代码质量。

    *   **进阶主题介绍**：通过对网络和图形用户界面（GUI）编程等高级 Java 主题的入门，超越基础知识。这将使你能够承担更复杂的项目并扩展你的技能。

    *   **职业准备**：无论你是渴望在顶尖科技公司找到工作，还是考虑启动自己的应用，你从书中学到的技能都将显著增强你的作品集和就业能力。


    除了上述提到的所有益处外，这本全面的指南采用了易于理解且通俗的语言，适用于不同水平的专业人士。从第一章开始，简单直观的代码编写方法将激励你继续学习和提升技能。随着阅读的深入，当你看到所学内容在提供的练习中得到实现时，无疑会感到动力继续下去。


    如果你是编程世界的新手，且不确定这本书是否适合你，请放心，你将找到你寻找的信息。书中的概念不仅适用于开启旅程的初学者，也适用于想要回顾已知知识并增加知识储备的经验丰富的开发者。这段旅程的第一站将理解什么是
    Java，以及你今天开始开始编码需要什么。


    ## 什么是 Java？


    Java 是由 Sun Microsystems 在 1995 年创建的编程语言，目前版本为 `21`。然而，这并不是大多数开发者使用的版本，他们更倾向于
    `Java 8`、`11` 或 `7`。Java 用于多种不同应用程序的开发，包括移动设备应用、医疗设备和网站。虽然名称相似，但不应将 Java 与 `JavaScript`
    混淆。虽然两种技术都是开发语言，但它们唯一的相似之处仅在于这个名称。


    Java 的主要特征之一是它是面向对象的语言，这意味着代码中不是仅仅使用逻辑和函数，而是围绕数据（或“对象”）设计，这些对象确立了程序需要发送的属性和消息。为了对比，可以说
    Java 应用的语法和规则是基于在 `C` 和 `C++` 语言中观察到的规则。


    Java 规则的核心前提是它允许开发者“编写一次，随处运行”。这一描述是该语言的基石，因为它的主要目标是成为一种可移植的语言，可以在设备之间轻松传输。此外，Java
    的通用性使其能够与任何操作系统（`Android`、`Linux`、`iOS` 或 `Windows`）配合，并在需要时更改平台而无需调整代码。


    由于 Java 已经存在了很久，初学者会发现另一个优势是其巨大的在线社区。然而，这个社区不仅限于相互支持的用户，还包含了库、仓库以及故障排除信息和文档，这些都能够实现高效的问题解决方法。从本质上说，当你开始学习
    Java 时，你会发现你自己可以访问许多工具和资源，在开发和调试过程中提供帮助。


    ## 学习和开始使用 Java 的前提条件


    虽然有些人说你必须至少具有一定的编程经验才能学习 Java，但这并非事实。虽然那些拥有这些经验的人在理解概念方面可能具有优势，并且对面向对象编程（`OOP`）的逻辑更熟悉，但这并不意味着作为初学者的无法学习。事实上，许多人发现没有经验反而更容易学习
    Java，因为他们没有先前的背景会让他们产生困扰。


    另一个问题是需要强大的计算机来处理海量信息。虽然这无疑是一个优势，但对于学习 Java 来说是可选的。事实上，一些开发者的机器处理能力和内存也运行得良好。此外，虽然大多数专业人士使用集成开发环境（`IDEs`），但你可以使用电脑上的记事本开始编写
    Java 编码。


    本书将教你如何设置和使用 Java `IDE`，这以后将帮助你调试并学习更高级的工具。然而，如果你无法在计算机上设置它，无需担心！你以后可以使用电脑的记事本开发和运行代码；唯一的区别是当你测试所编写的内容时，可能在调试和发现代码错误方面会有更多困难。


    如果你准备好开始学习市场上最相关的编程语言之一的之旅，我鼓励你继续读下去！建议你在阅读时将电脑放在旁边，以练习代码以及正在教授的任何技术。我们将从对 Java
    应用程序的简要介绍以及如何在你的计算机上设置不同的开发环境开始。因此，你将完全准备好编写你的第一行代码了！


    ## 第 1 章：Java 入门


    如果你刚刚开始编程之旅，你可能对某些在结构中使用 Java 的数字应用程序感到好奇。你可能不会惊讶，因为它是如此流行的语言，`Amazon`、`Netflix`、`Spotify`、`Santander`、`Airbnb`
    和 `Goldman Sachs` 等平台在其程序中使用 Java。事实上，根据 `Svet (2023)` 的研究，90% 的财富 500 强公司在开发新软件时将
    Java 作为其首选编程语言。


    在本章中，我们将探索编程开始背后的历史，以及 Java 如何成为计算机科学社区中如今如此重要的语言。此外，你将学习如何安装 Java 开发环境，设置好所需的一切，并正如所承诺的那样，编写你的第一行代码！


    '
- fmt: '

    # Introduction


    To understand programming, I want you to think about the following: Suppose you
    bought a piece of furniture you need to assemble. Since most of us are not experts
    on the subject, we will need an instruction manual to follow what must be done
    to achieve the desired result. This applies not only to furniture but also to
    any task you do not have the required knowledge to complete and need guidance
    on to ensure the outcome is the expected one: cooking, driving, etc.


    The same logic can be applied to programming: The computer does not know what
    you want it to do or how it performs unless you tell it what to do and how to
    do it. This is where coding comes in: It uses a specific language or code to tell
    a program or computer what it should do according to specific instructions. You
    can use this code to tell the computer how to solve a problem, process information,
    and do several other tasks.


    However, computers do not usually "understand" human language. This means that,
    for example, you can''t just say create a program that will solve math equations
    for me when creating software. The computer will not understand this because they
    have a specific language, or languages, also known as dialects, that are used
    to communicate with it. These dialects will "translate" what we, humans, want
    the machine to do by transforming our language into one that the computer understands.
    These include, for example, `Python`, `Go`, `Rust`, `NodeJS`, `Elixir`, `C`, `C++`,
    and, of course, `Java`.


    By using these languages to instruct and "program" computers, developers can tell
    them what they should do. From the simplest tasks, such as opening word-processing
    software on your computer, to having computers mimic human language in artificial
    intelligence applications, these are all done using programming languages. Almost
    everything that has to do with computer use involves a programming language.


    Now, here is the crucial part and where this book comes in: When you want to "communicate"
    with a computer, so to say, you are going to use one of the languages that allows
    you to do this. And your language choice will depend on two things: 1\. What you
    are comfortable with, and 2. What it is you need to do. In this case, the language
    choice will directly reflect your personal preference, what you adapt to the most,
    and, more importantly, the market in which you want to act.


    Granted, some languages are considered easier to learn, and others are harder.
    However, it would be irresponsible to classify them since each reader has their
    preferences. This being said, as we move further along in this chapter we will
    explain `Java`''s main characteristics and its differences in comparison to other
    available languages.


    According to Coursera (2023), programming languages can be grouped into these
    five categories:


    1. Scripting languages

    2. Procedural programming languages

    3. Logic programming languages

    4. Functional programming languages

    5. OOP languages


    This might raise the question, In which group does `Java` fit? That is an excellent
    point. Let''s examine which categories `Java` fits in and start exploring its
    characteristics.


    ## JAVA OVERVIEW


    `Java` is known for being one of the most crucial programming languages when referring
    to those that are object-oriented. When it was released in 1995, `Java` "had few
    elements that were revolutionary, but the key to its success was combining those
    elements in the right way and learning from predecessors'' strengths and weaknesses.
    Microsoft later used this approach in developing `C#` by utilizing `Java`''s experience"
    (Izydorczyk, 2022). As you might imagine, the successful approach led to significant
    attention in the developer market, and many people learned how to use it.


    It would also be impossible to speak about `Java` and not mention the previous
    "motto" of write once, run everywhere (WORA) for which it was known, despite this
    not being as accurate in the present. This was a significant advantage at the
    time, which meant you could run programs developed with `Java` on all supported
    platforms without needing to adjust or recompile the code. With the need to increase
    accessibility to technology and develop more software, this became another point
    that attracted many people to work with it and companies to implement it.


    In fact, many companies continue to use `Java` in their programs because of the
    incredible number of developers with knowledge of it and its reliability. In addition,
    the language is constantly being updated and improved, which means it evolves
    and adapts to the market as it changes. The versatility it provides the developer
    to adapt to most situations remains an attractive attribute that makes learning
    how to code in `Java` a valuable skill in the technology market.


    Finally, it is crucial to mention that `Java`''s "age" has become one of its most
    important assets. "Java encourages maturity of solutions and has a large community.
    It''s hard to find technologies without prepared integration with Java or functions
    that aren''t provided by external libraries" (Izydorczyk, 2022). This means that
    even if you are interested in learning more "modern" languages, such as `Kotlin`,
    having previous knowledge of `Java` will make the journey easier, as will happen
    with other dialects.


    Now that you have a clear picture of `Java`''s characteristics, it is time to
    start getting to work. The first thing you will need to do is install what is
    known as the Java Development Kit (`JDK`), which you will need to write the code.
    Shall we look into what it is and the need to carry out this process?


    ## INSTALLING JAVA DEVELOPMENT KIT


    To start working with `Java`, you will need to download the `JDK` to your computer.
    Returning to our furniture-building analogy, the `JDK` is similar to needing a
    hammer and screwdriver to assemble the piece. Or like the pans, stove, and spoons
    for cooking. Essentially speaking, the `JDK` will provide the tools you need to
    write, compile, and run your code in `Java`. "The Java Development Kit (JDK) is
    one of three core technology packages used in Java programming, along with the
    `JVM` (Java Virtual Machine) and the `JRE` (Java Runtime Environment)" (Tyson,
    2022). These three parts of the technology can be described as:


    * `JDK`: Used to develop the software or simply write, compile, and execute the
    code, providing the necessary tools to enable the program to run in `JRE` and
    `JVM`.

    * `JRE`: Used to run the developed code and is part of `JDK` since you will need
    to run the code.

    * `JVM`: Used to host the program where the code will be run, "translating" the
    commands you have given into a language the computer can understand and interpret,
    enabling it to carry out the instructions.


    Now that you know the essential components to set up the Java environment, let''s
    look at the steps to install them.


    1. Go to the [Oracle.com](http://Oracle.com) website.

    2. On the top tab, under "Products," go to the last section, "Hardware and Software,"
    and click on "Java".

    3. Click on the "Download Java" button.

    4. Under the "Java downloads" section, select between the `JDK` 21 or 17 and the
    operating system (OS) you use (Linux, macOS, or Windows).

    5. Select the kit you will download according to your computer''s specifications
    and needs.


    Note: In this book, the instructions will be based on the Windows OS. However,
    you can find the specifications for any different OS in the documentation provided
    on the website.

    6. Ensure you have a 64-bit operating Windows platform to download the kit.

    7. Select the link within the provided list to start downloading. You will need
    to sign a license agreement and save an executable (`.exe`) file on your computer
    according to the version of Windows you are using.

