  trans: "\n现在，我猜你一定在思考这些每一项应该在哪里以及如何使用，以及在声明它们时应该采用什么语法。为了简化识别过程并方便理解每种数据类型，这里有另一张表格包含了你需要知道的所有信息。\n\
    \n![](img/image_rsrc4ZT.jpg)\n\n在这张表中，你会注意到某些示例语法中具有一些独特的特征：\n\n*   在定义数据类型之后，你必须使用分号（`;`），以确保在运行代码时不会报错。\n\
    *   下划线字符 `_` 代表数字中的逗位分隔符，而小数点保持不变。\n*   所有存储数字的数据类型都可以在 Java 中用于数学计算，尽管使用 `short`、`int`\
    \ 和 `long` 进行计算与使用 `float` 和 `double` 相比存在存在的。\n*   你需要使用的引号是直引号（`''` 或 `\"`），而不是编译器可能无法识别的弯引号（`‘’`\
    \ 或 `“”`）。\n\n然而，在读完这张表后，你可能会想：如果我想存储一个句子，比如我们在第一个例子中那样的 Hello World，该如何操作呢？这些都是非常棒的问题，说明你一直在密切关注。做得好！在这种情况下，我们将使用\
    \ Java 中被称为“string”字符串的内容。\n\n在字符串中，你可以声明文本，例如 \"Hello World\"，它必须放置在双引号之间以便被识别。在这里，函数名\
    \ `String` 的首字母应该大写。在这种情况下，语法如下：\n\n```java\nString greeting = \"Hello World\"\
    ;\n```\n\n不过，我们现在不会深入讨论字符串的细节，因为这将在本章最后一节中讨论。在此期间，我想花点时间复习一下记忆：在声明变量的数据类型时，根据\
    \ Java 规范，它们应该尽可能接近它们的含义，例如：\n\n```java\nString name = \"Sarah\";\nint age = 15;\n\
    float temperature = 45.9f;\n```\n\n最后，在继续学习下一节之前，你还应该了解变量和数据类型的最后两个细节：\n\n1. \
    \ 可以先声明变量，稍后再定义它的值，例如：\n```java\nint year;\nyear = 2006;\n```\n\n2.  可以通过给变量分配新值来改变变量，例如：\n\
    ```java\nint year = 2006;\nyear = 2013;\n```\n\n在这种情况下，值被改变了，如果你要求程序打印 `year`\
    \ 变量，你看到的输出将是 2013。记住，如果你想固定这个值，应该在语句开头添加 `final` ，这样它就无法被更改或覆盖，从而变成一个常量。在这种情况下，你只会改变变量的值，而不是改变它的类型。当你想要更改它所引用的数据类型时，必须求助于所谓的“强制转换”（casting），我们现在来讨论这一点。\n\
    \n## 类型转换与强制转换\n\n如果你在 Java 中开发程序，你可能想要更改数据类型，例如从 `float` 转换为 `double`，以便使计算更精确或考虑更大的数字。在这种情况下，你需要使用所谓的类型转换（type\
    \ conversion）或类型转换（casting），即从一种数据类型切换到另一种。根据 Badkar (2023) 的说法，如果你想实现以下目标，也可以发生这种情况：\n\
    \n*   对代码有更强的控制\n*   优化程序的内存使用\n*   防止数据丢失\n*   将用户输入的文本输入转换为数字\n*   使数据类型兼容以执行计算和操作。\n\
    \n在这种情况下，这种数据类型的更改可以通过两种方式进行：手动或自动，也称为显式和隐式。Java 目前在它的规则内支持 13 种数据转换，范围从数字的扩展和缩小到将\
    \ `char` 转换为 `int`。唯一不接受任何转换的数据类型是 `boolean`。\n\n### 显式强制转换\n\n在这种手动数据类型转换中，开发者将编写代码以确保转换的完成。这种类型转换的主要特征是它将用于缩短赋值给变量的值。在这种情况下，允许的转换如下：\n\
    \n`double → float → long → int → short → byte`\n\n这意味着你可以，例如，将一个长小数转换为一个较短的小数，然后将这个较小的小数转换为一个\
    \ `int` 整数。当最后这次转换发生时，小数点将被丢弃，程序将只识别整数部分。这里有一个你可以考虑的关于这些转换的示例：\n\n在第一个例子中，我们将使用完整的代码块将一个值为\
    \ 2.2 的 `float` 转换为 `int`。\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        // 创建一个 float 类型的变量\n        float data = 2.2f;\n        System.out.println(\"\
    The float value is \" + data);\n        // 将之前创建的 float 转换为 int\n        int num\
    \ = (int)data;\n        System.out.println(\"The int value is \" + num);\n   \
    \ }\n}\n```\n\n在这种情况下，程序带给你的输出如下：\n\nThe float value is 2.2\nThe int value is\
    \ 2\n\n由于小数点将被丢弃，`int` 值将是 2。然而，取决于你所开发软件的使用，这种小数点的丢失可能会直接影响你获得的计算结果。由于这种原因，因为这种转换被认为是危险的，开发者必须手动执行更改\
    \ (Gupta, 2020)。\n\n现在，如果你注意到了上述内容，可能会疑惑当你想要扩展或增加一个数字时是否也需要执行相同的步骤。简单的答案是“不需要”。对于从“较小”到“较大”数字的情况，编译器会自动完成过程，这被称为隐式强制转换。\n\
    \n### 隐式强制转换\n\n隐式强制转换中所谓的数字“扩展”（widening）通常发生在目标类型比源类型大，或者数据类型兼容的情况下。这意味着，即使你尝试自动地将一个较大的数字转换为较小的数字，编译器也会产生错误，你需要修复代码行。了解这些允许的转换很重要，这样你的程序在编译时不会产生任何错误。让我们看看允许的转换：\n\
    \n`byte → short → int → long`\n`char → int → float → double`\n`int → double`\n\
    \n让我们通过一个完整的代码块示例来看这些转换：\n\n```java\nclass Main {\n    public static void main(String[]\
    \ args) {\n        // 创建一个 int 类型的变量\n        int num = 15;\n        System.out.println(\"\
    The number is \" + num);\n        // 将之前创建的 int 转换为 double\n        double decimal\
    \ = num;\n        System.out.println(\"The decimal value is \" + decimal);\n \
    \   }\n}\n```\n\n在这种情况下，输出将：\n\nThe number is 15\nThe decimal value is 15.0\n\n\
    由于我们将一个较小的数字转换为一个较大的数字，这是自动完成的，不需要像显式语法示例中那样指定转换。\n"
- fmt: "\nThe first and most essential characteristic you should know about a string\
    \ is that it is immutable or, in other words, it cannot be changed after it has\
    \ been created. However, this does not mean you cannot carry out any operations\
    \ with it. In fact, there are several actions you can carry out with a string,\
    \ which we are about to see now. Here is a list compiled by Challa (n.d.) based\
    \ on the official documentation that specifies all the built-in methods for strings\
    \ in Java:\n\n- `charAt()`: used to return a character at a specified position.\n\
    - `concat()`: used to append one string to the end of another.\n- `equals()`:\
    \ used to compare two strings and return a boolean value (true or false).\n- `indexOf()`:\
    \ used to return the first identified position of a character.\n- `length()`:\
    \ used to identify the length of a string.\n- `substring()`: used to extract the\
    \ substring based on index values, passed as an argument.\n- `toLowerCase()`:\
    \ used to convert all the letters in the string to lowercase.\n- `toUpperCase()`:\
    \ used to convert all the letters in the string to uppercase.\n\nTo exemplify\
    \ how these functions can be used with a string, I will use one block of code\
    \ for the strings and ask the compiler to print out the different outputs according\
    \ to the command requested in a similar model to the one applied by Challa. Are\
    \ you ready?\n\n```java\nclass Main{\n\n  public static void main(String []args)\n\
