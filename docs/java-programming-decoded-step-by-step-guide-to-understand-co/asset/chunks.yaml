  raw: 'Some of these include the IllegalAccessException, which means a method was
    not found or does not exist, and the RuntimeException, when there is a problem
    running the code. There is also the NullPointerException, which will happen when
    the method tries to access an object through the null exception and the NegativeArraySizeException,
    which shows that the program tried to create an array with a negative size, which
    is not possible in Java. When you apply exceptions to your code, it will make
    it easier to catch errors and debug the program, which we will talk more about
    in the last chapter of this book.


    The last thing you should know, before we run the code, is that two different
    types of exceptions can be thrown: those for compile exceptions (checked) and
    others for run-time exceptions (unchecked). The main difference between the checked
    and the unchecked exceptions is that while the compiler will need to be caught
    and handled by the code during compilation by using the try-and-catch statements,
    the run-time exceptions will happen when the code is executing. While the first
    usually happens when there is a missing file or a network problem, the second
    will occur when bad coding practices are used (How to Throw Exceptions in Java,
    2019).


    Here is an example where the exception would be thrown for a system that requests
    the input of the user age:


    import java.util.Scanner;


    public class ExceptionThrowingExample {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    try {


    // Get input from the user


    System.out.print("Enter your age: ");


    int age = scanner.nextInt();


    // Check if age is negative


    if (age < 0) {


    // Throw an exception if age is negative


    throw new IllegalArgumentException("Age cannot be negative");


    }


    // Display the age


    System.out.println("Your age is: " + age);


    } catch (IllegalArgumentException e) {


    // Handle the thrown exception


    System.out.println("Error: " + e.getMessage());


    } catch (Exception e) {


    // Handle other exceptions


    System.out.println("An error occurred: " + e.getMessage());


    } finally {


    // Close the scanner in the finally block to ensure it''s always executed


    scanner.close();


    System.out.println("Scanner closed in the finally block.");


    }


    }


    }


    Here is an example of what would be one possible input and output:


    Enter your age: -12


    Error: Age cannot be negative


    Scanner closed in the finally block.


    In this example, the user is entering a negative age, so the code throws a custom
    exception (IllegalArgumentException) with a directed error message. Here, we also
    used the catch block to handle this exception and print an error message. Lastly,
    the finally block ensures that the scanner is always closed, even if an exception
    occurs.


    While built-in exceptions are incredibly useful, many developers prefer creating
    their own exceptions when creating their systems. This is because they will be
    able to tailor the exception exactly to the system''s needs and the different
    situations that might be presented. In the last section of this chapter, we will
    look at what custom exceptions are and how they can be created.


    ## CREATING CUSTOM EXCEPTIONS


    Custom exceptions are created when you extend from the exception class. As you
    will see in the code below, you will declare the exception class with the name
    you have according to the specific business need or even that you want to handle,
    but you will need to extend it from the superclass Exception. When you do this,
    there are a few rules that you must remember:


    1.  Only create exceptions that will be useful and have a purpose. Since most
    of the exception classes in Java cover the developer''s needs, creating an exception
    needs to fulfill the specific need of the business you are working for, or else
    there will be no benefit to obtain from it.


    2.  When you create an exception, you should document it to explain what you want
    it to do. Only by doing this will others understand why you created it and the
    reason it should be used.


    3.  Comment on the code if necessary to explain your reasoning. You will need
    to provide information for the exception you are creating and set the cause and
    detailed information on the exception you are looking to handle.


    4.  Apply the Java convention to the exception. This means using camel case to
    name the class you are creating and add the word "exception" at the end.


    With this in mind, let''s take a look at a custom-made (or user-made) exception
    and how it can be applied.


    // Custom exception class


    class NegativeAgeException extends Exception {


    public NegativeAgeException(String message) {


    super(message);


    }


    }


    public class CustomExceptionExample {


    // Method that throws a custom exception


    public static void validateAge(int age) throws NegativeAgeException {


    if (age < 0) {


    // Throw the custom exception if age is negative


    throw new NegativeAgeException("Age cannot be negative");


    }


    // Process other logic if age is valid


    System.out.println("Valid age: " + age);


    }


    public static void main(String[] args) {


    try {


    // Call the method that may throw the custom exception


    validateAge(-5);


    } catch (NegativeAgeException e) {


    // Handle the custom exception


    System.out.println("Error: " + e.getMessage());


    }


    }


    }


    The output for this case would be: Error: Age cannot be negative. In this example,
    we created a custom exception class NegativeAgeException that extends the Exception
    class. The validateAge method throws this custom exception if the age is negative.
    Finally, to ensure that the exception is applied, we will catch and handle the
    NegativeAgeException if it occurs in the main method, making the process work
    and the program maintain its flow.


    You will see that there are no exercises in this chapter. However, I do encourage
    you to look back at the previous exercises and try to create your own code to
    see the output and whether any errors are identified. When you add these exceptions,
    you will see that you have a code with more quality and that errors will significantly
    decrease. Once again, I state that practice makes perfect, and you should certainly
    put into action what you have seen up to now with exception handling before we
    move on to more advanced techniques.


    If you feel you are ready and have understood the concept and power of exception
    handling, you are ready to dive deeper into the advanced aspects of Java and upskill
    your knowledge. In the next chapter, we''ll explore file I/O and serialization,
    broadening your Java programming skills even further. If you are ready to learn
    how to read, write, delete, and modify files using Java, read on to see all the
    different possibilities of what it can do for you!


    CHAPTER 8


    FILE INPUT AND OUTPUT


    Sometimes, we need to create programs that interact with elements not native to
    the system. Suppose that you are developing software that will upload and analyze
    a file and bring you back a result; for this purpose, you will need to know how
    to input and output files to ensure the process can be carried out. To see how
    useful this is, think about different modern software that you can upload a file
    to then read and modify the data. This is exactly what this technique does.


    In this chapter, you will obtain a comprehensive understanding of File I/O in
    Java, which is the library that allows you to do this. As you will see, it will
    need to be imported along with other libraries to ensure that your code works.
    In addition to this, you will learn how to work with text and binary files, as
    well as the meaning and uses of serialization and deserialization. This is already
    the first step in your advanced Java knowledge. Are you ready to take one step
    further into the process?


    ## WORKING WITH FILES IN JAVA'
