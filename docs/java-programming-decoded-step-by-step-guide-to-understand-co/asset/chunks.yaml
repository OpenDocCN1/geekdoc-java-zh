- fmt: "\nNow, I imagine you must be thinking about where and how each of these can\
    \ be used and what syntax should be adopted when declaring them. To simplify the\
    \ identification process and facilitate comprehension of each data type, here\
    \ is another table containing all the information you need to know.\n\n![](image_rsrc4ZT.jpg)\n\
    \nIn this table, you will note a few unique characteristics in some of the demonstrated\
    \ syntaxes:\n\n* After the data type has been defined, you must use the semicolon\
    \ (`;`) so there is no error when running the code.\n* The underscore character\
    \ `_` represents the commas in the numbers, while the decimal point remains the\
    \ same.\n* All the data types that store numbers can be used for mathematical\
    \ calculations in Java, although there is a difference between doing so with `short`,\
    \ `int`, and `long` when compared to `float` and `double`.\n* The quotation marks\
    \ you need to use are the straight ones (`''` or `\"` ) rather than the curly\
    \ ones (`‘’` or `“”`) that might not be recognized by the compiler.\n\nHowever,\
    \ after you have read this table, you might think, What if I want to store a sentence,\
    \ such as Hello World, like we did in the first example? How would this be done?\
    \ These are outstanding questions and show that you have been paying close attention.\
    \ Good for you! In this case, we would use what is known as a \"string\" in Java.\n\
    \nIn a string, you can declare text, such as \"Hello World,\" which must be placed\
    \ between double quotes so they are understood. Here, the function `string` should\
    \ have the first letter capitalized. In this case, the syntax would be as follows:\n\
    \n```java\nString greeting = \"Hello World\";\n```\n\nHowever, we will not get\
    \ into the specifics about strings right now since this will be discussed in the\
    \ last section of this chapter. In the meantime, I want to take a moment and refresh\
    \ your memory that when declaring the data types for the variables, according\
    \ to the Java convention, they should be as close as possible to what they mean,\
    \ such as:\n\n```java\nString name = \"Sarah\";\nint age = 15;\nfloat temperature\
    \ = 45.9f;\n```\n\nFinally, before we move on to the next section, you should\
    \ also know the final two details about variables and data types:\n\n1. It is\
    \ possible to declare a variable and only define its value later, such as:\n```java\n\
    int year;\nyear = 2006;\n```\n\n2. It is possible to change the variable by assigning\
    \ it a new value, such as:\n```java\nint year = 2006;\nyear = 2013;\n```\n\nIn\
    \ this case, the value was changed, and if you ask the program to print the `year`\
    \ variable, the output you will see is 2013. Remember that if you want this value\
    \ fixed, you should add the word `final` to the beginning of the statement so\
    \ that it cannot be changed or overwritten, transforming it into a constant. In\
    \ this case, you will only change the variable's value, not its type. When you\
    \ want to change the data type it refers to, you must resort to what is known\
    \ as casting, which we will talk about now.\n\n## TYPE CONVERSION AND CASTING\n\
    \nIf you are developing your program in Java, you might want to change the data\
    \ types, for example, from a `float` to a `double`, for a calculation to be more\
    \ precise or consider the larger number. In this case, you will need to use what\
    \ is known as type conversion or typecasting, which is switching from one data\
    \ type to the other. According to Badkar (2023), this can also be the case if\
    \ you want to:\n\n* have more control of the code\n* optimize program memory use\n\
    * prevent data loss\n* transform user input made in text into numbers\n* make\
    \ data types compatible for performing calculations and operations.\n\nIn this\
    \ case, this data type change can be carried out in two ways: manually or automatically,\
    \ also known as explicit and implicit. Java currently supports 13 types of data\
    \ conversion within its rules, which can range from widening and shortening a\
    \ number to converting a `char` into an `int`. The only data type that does not\
    \ accept any conversion is the `boolean`.\n\n### Explicit Typecasting\n\nIn this\
    \ manual conversion of data types, the developer will write the code to ensure\
    \ the conversion is made. The main characteristic of this type of conversion is\
    \ that it will be used to shorten the values assigned to a variable. In this case,\
    \ the conversions allowed are as follows:\n\n`double → float → long → int → short\
    \ → byte`\n\nThis means that you can, for example, reduce a long decimal number\
    \ into a shorter decimal number and this smaller decimal number into an `int`\
    \ whole number. When this last conversion occurs, the decimal points will be discarded,\
    \ and only the full number will be recognized by the program. Here is an example\
    \ you can consider for these conversions:\n\nIn this first example, we are going\
    \ to transform a `float` with a value of 2.2 into an `int` using the full code\
    \ block.\n\n```java\nclass Main {\n    public static void main(String[] args)\
    \ {\n        // create a variable with the float type\n        float data = 2.2f;\n\
    \        System.out.println(\"The float value is \" + data);\n        // convert\
    \ the previously created float into an int\n        int num = (int)data;\n   \
    \     System.out.println(\"The int value is \" + num);\n    }\n}\n```\n\nIn this\
    \ case, the output the program would bring you is the following:\n\nThe float\
    \ value is 2.2\nThe int value is 2\n\nSince the decimal points will be discarded,\
    \ the `int` value is going to be 2. However, depending on the use of the software\
    \ you are developing, losing this specific precision where the decimal points\
    \ in the `double` or the `float` are lost may directly impact the calculation\
    \ results you obtain. For this specific reason, because this type of conversion\
    \ can be considered \"dangerous,\" the developer must manually carry out the change\
    \ (Gupta, 2020).\n\nNow, if you notice what was mentioned, you might wonder if\
    \ this same procedure needs to be carried out when you want to widen or increase\
    \ a number. The short answer is \"no.\" For the cases in which you will move from\
    \ a \"smaller\" to a \"longer\" number, the compiler does the process automatically,\
    \ in what is also known as implicit casting.\n\n### Implicit Typecasting\n\nWhat\
    \ is known as the \"widening\" of the number in implicit typecasting will usually\
    \ happen when the type of the destination is bigger than the one used in the source\
    \ or if the data types are compatible. This means that even if you try to convert\
    \ a larger number into a smaller one automatically, the compiler will make an\
    \ error, and you will need to fix the code line. It is important to understand\
    \ these acceptable conversions so your program does not produce any errors while\
    \ compiling. Let's take a look at the available conversions:\n\n`byte → short\
    \ → int → long`\n`char → int → float → double`\n`int → double`\n\nLet's take a\
    \ look into these conversions with an example using the full code block:\n\n```java\n\
    class Main {\n    public static void main(String[] args) {\n        // create\
    \ a variable with the int type\n        int num = 15;\n        System.out.println(\"\
    The number is \" + num);\n        // convert the previously created int into a\
    \ double\n        double decimal = num;\n        System.out.println(\"The decimal\
    \ value is \" + decimal);\n    }\n}\n```\n\nThe output, in this case, is going\
    \ to be:\n\nThe number is 15\nThe decimal value is 15.0\n\nBecause we have converted\
    \ a shorter number into a longer number, this was automatically done without needing\
    \ to specify the conversion as it happened in the explicit syntax example.\n\n\
    ## WORKING WITH STRINGS AND COMMON STRING OPERATIONS\n\nAs promised, we have arrived\
    \ at the final section of this chapter, and we are going to talk about strings.\
    \ As you saw at the beginning of the chapter when we were discussing data types,\
    \ strings store a collection of characters, usually letters, that make up a text\
    \ and are surrounded by double quotation marks. You saw this when we spoke about\
    \ the \"Hello World\" example you saw in the first chapter.\n"
  raw: 'Now, I imagine you must be thinking about where and how each of these can
    be used and what syntax should be adopted when declaring them. To simplify the
    identification process and facilitate comprehension of each data type, here is
    another table containing all the information you need to know.


    ![](image_rsrc4ZT.jpg)


    In this table, you will note a few unique characteristics in some of the demonstrated
    syntaxes:


    *   After the data type has been defined, you must use the semicolon (;) so there
    is no error when running the code.


    *   The underscore character represents the commas in the numbers, while the decimal
    point remains the same.


    *   All the data types that store numbers can be used for mathematical calculations
    in Java, although there is a difference between doing so with short, int, and
    long when compared to float and double.


    *   The quotation marks you need to use are the straight ones ('' or ") rather
    than the curly ones (‘’ or “”) that might not be recognized by the compiler.


    However, after you have read this table, you might think, What if I want to store
    a sentence, such as Hello World, like we did in the first example? How would this
    be done? These are outstanding questions and show that you have been paying close
    attention. Good for you! In this case, we would use what is known as a "string"
    in Java.


    In a string, you can declare text, such as "Hello World," which must be placed
    between double quotes so they are understood. Here, the function "string" should
    have the first letter capitalized. In this case, the syntax would be as follows:


    String greeting = "Hello World";


    However, we will not get into the specifics about strings right now since this
    will be discussed in the last section of this chapter. In the meantime, I want
    to take a moment and refresh your memory that when declaring the data types for
    the variables, according to the Java convention, they should be as close as possible
    to what they mean, such as:


    String name = "Sarah";


    int age = 15;


    float temperature = 45.9f;


    Finally, before we move on to the next section, you should also know the final
    two details about variables and data types:


    1\. It is possible to declare a variable and only define its value later, such
    as:


    int year;


    year = 2006;


    2\. It is possible to change the variable by assigning it a new value, such as


    int year = 2006;


    year = 2013;


    In this case, the value was changed, and if you ask the program to print the "year"
    variable, the output you will see is 2013\. Remember that if you want this value
    fixed, you should add the word "final" to the beginning of the statement so that
    it cannot be changed or overwritten, transforming it into a constant. In this
    case, you will only change the variable''s value, not its type. When you want
    to change the data type it refers to, you must resort to what is known as casting,
    which we will talk about now.


    ## TYPE CONVERSION AND CASTING


    If you are developing your program in Java, you might want to change the data
    types, for example, from a float to a double, for a calculation to be more precise
    or consider the larger number. In this case, you will need to use what is known
    as type conversion or typecasting, which is switching from one data type to the
    other. According to Badkar (2023), this can also be the case if you want to:


    *   have more control of the code


    *   optimize program memory use


    *   prevent data loss


    *   transform user input made in text into numbers


    *   make data types compatible for performing calculations and operations.


    In this case, this data type change can be carried out in two ways: manually or
    automatically, also known as explicit and implicit. Java currently supports 13
    types of data conversion within its rules, which can range from widening and shortening
    a number to converting a char into an int. The only data type that does not accept
    any conversion is the boolean.


    Explicit Typecasting


    In this manual conversion of data types, the developer will write the code to
    ensure the conversion is made. The main characteristic of this type of conversion
    is that it will be used to shorten the values assigned to a variable. In this
    case, the conversions allowed are as follows:


    double → float → long → int → short → byte


    This means that you can, for example, reduce a long decimal number into a shorter
    decimal number and this smaller decimal number into an int whole number. When
    this last conversion occurs, the decimal points will be discarded, and only the
    full number will be recognized by the program. Here is an example you can consider
    for these conversions:


    In this first example, we are going to transform a float with a value of 2.2 into
    an int using the full code block.


    class Main {


    public static void main(String[] args) {


    // create a variable with the float type


    float data = 2.2f;


    System.out.println("The float value is " + data);


    // convert the previously created float into an int


    int num = (int)data;


    System.out.println("The int value is " + num);


    }


    }


    In this case, the output the program would bring you is the following:


    The float value is 2.2


    The int value is 2


    Since the decimal points will be discarded, the int value is going to be 2\. However,
    depending on the use of the software you are developing, losing this specific
    precision where the decimal points in the double or the float are lost may directly
    impact the calculation results you obtain. For this specific reason, because this
    type of conversion can be considered "dangerous," the developer must manually
    carry out the change and not automatically (Gupta, 2020).


    Now, if you notice what was mentioned, you might wonder if this same procedure
    needs to be carried out when you want to widen or increase a number. The short
    answer is "no." For the cases in which you will move from a "smaller" to a "longer"
    number, the compiler does the process automatically, in what is also known as
    implicit typecasting.


    Implicit Typecasting


    What is known as the "widening" of the number in implicit typecasting will usually
    happen when the type of the destination is bigger than the one used in the source
    or if the data types are compatible. This means that even if you try to convert
    a larger number into a smaller one automatically, the compiler will make an error,
    and you will need to fix the code line. It is important to understand these acceptable
    conversions so your program does not produce any errors while compiling. Let''s
    take a look at the available conversions:


    byte → short → int → long


    char → int → float → double


    int → double


    long → float


    Let''s take a look into these conversions with an example using the full code
    block:


    class Main {


    public static void main(String[] args) {


    // create a variable with the int type


    int num = 15;


    System.out.println("The number is " + num);


    // convert the previously created int into a double


    double decimal = num;


    System.out.println("The decimal value is " + decimal);


    }


    }


    The output, in this case, is going to be


    The number is 15


    The decimal value is 15.0


    Because we have converted a shorter number into a longer number, this was automatically
    done without needing to specify the conversion as it happened in the explicit
    syntax example.


    ## WORKING WITH STRINGS AND COMMON STRING OPERATIONS


    As promised, we have arrived at the final section of this chapter, and we are
    going to talk about strings. As you saw at the beginning of the chapter when we
    were discussing data types, strings store a collection of characters, usually
    letters, that make up a text and are surrounded by double quotation marks. You
    saw this when we spoke about the "Hello World" example you saw in the first chapter.'
