    Here''s an example storyboard:


    *   Panel 1: The alarm rings. Decision (If-Else): If the student hits the snooze
    button, they miss the bus to school. Else, they get ready and catch the bus.


    *   Panel 2: The student is in a math class. Loop (While): The student keeps taking
