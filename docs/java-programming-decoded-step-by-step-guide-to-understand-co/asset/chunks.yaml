  raw: 'The first and most essential characteristic you should know about a string
    is that it is immutable or, in other words, it cannot be changed after it has
    been created. However, this does not mean you cannot carry out any operations
    with it. In fact, there are several actions you can carry out with a string, which
    we are about to see now. Here is a list compiled by Challa (n.d.) based on the
    official documentation that specifies all the built-in methods for strings in
    Java:


    *   charAt(): used to return a character at a specified position.


    *   concat(): used to append one string to the end of another.


    *   equals(): used to compare two strings and return a boolean value (true or
    false).


    *   indexOf(): used to return the first identified position of a character.


    *   length(): used to identify the length of a string.


    *   substring(): used to extract the substring based on index values, passed as
    an argument.


    *   toLowerCase(): used to convert all the letters in the string to lowercase.


    *   toUpperCase(): used to convert all the letters in the string to uppercase.


    To exemplify how these functions can be used with a string, I will use one block
    of code for the strings and ask the compiler to print out the different outputs
    according to the command requested in a similar model to the one applied by Challa.
    Are you ready?


    class Main{


    public static void main(String []args)


    {


    String name ="Sarah";


    String surname="Connor";


    String profession="Hunter";


    boolean id=name.equals(profession);


    System.out.println("The letter in position 3 is: "+name.charAt(3));


    // the output in this case will be The letter in position 3 is: a


    System.out.println(name.concat(surname));


    // the output in this case will be SarahConnor


    System.out.println("Compare name and surname: "+id);


    // the output in this case will be Compare name and surname: false


    System.out.println(name.indexOf(''r''));


    // the output in this case will be 2


    System.out.println(profession.length());


    // the output in this case will be 6


    System.out.println(profession.toLowerCase());


    // the output in this case will be hunter


    System.out.println(surname.toUpperCase());


    // the output in this case will be CONNOR


    System.out.println(surname.substring(1,3));


    // the output in this case will be on


    System.out.println(name.substring(3));


    // the output in this case will be ah


    }


    }


    Now that you have seen the result of the code, here are some comments you must
    take into consideration regarding the output:


    *   When you request to print the index position of "r," the program''s output
    is "2." This is because you start counting with 0 instead of 1 in Java. Therefore,
    in this case, "s" would be index 0, "a" would be index 1, and "r" index 2.


    *   While the concatenation did not add any spaces between the words, in the output
    Compare name and surname: false, you will notice that there is a space between
    the colon and the word "false." This is not automatic in Java, and you need to
    indicate the need for this space when writing what you want the output to be.


    *   The concatenation function can also be replaced by the "+" operator. In this
    case, if you wanted to use it, the syntax would be:


    System.out.println(name + " " + surname );


    // and the output would be Sarah Connor because you have added the space


    Well, that is about all the essential information on data types and variables
    in Java. You have been given a comprehensive explanation of their main characteristics
    and how to use them. This information is essential since you will use it when
    writing your code in the following chapters. However, now it''s your turn! Are
    you ready to try some examples on your own?


    ## YOUR TURN TO TRY!


    Below are five practice examples you can use to test whether you have assimilated
    the content. Regardless of these examples, I again encourage you to take a moment
    to explore the different code possibilities using the information you have learned
    in this chapter, including writing it incorrectly so you know what an error will
    look like if a mistake is made.


    1.  Create a new variable with a string format.


    2.  Transform all the letters into uppercase for the previously created string.


    3.  Convert the double data type with a value of 458.96 to an int data type.


    4.  Convert an int data type with a value of 6 into a float data type.


    5.  Super challenge: Add a variable with an int data type with a value of 56 with
    a variable with a double data type with a value of 897.69.


    You''ve successfully dived deeper into the ocean of Java! From understanding the
    basic building blocks of Java to juggling with strings, you''ve broadened your
    programming knowledge. But there''s more to discover. In the next chapter, we''ll
    explore Java operators and control statements. Are you ready to continue the adventure?


    CHAPTER 3


    CONTROL FLOW


    When you are writing code, regardless of what type of language you are using,
    it is likely you will need to program in some commands. A straightforward example
    we are used to seeing is when we need to log in to a site or app that requests
    our password. In this case, if we type in the correct alternative, we can log
    in. If we don''t, we will need to try again. This is an example of an "if-clause,"
    which is one of the things you will learn in this chapter.


    To help you become familiar with the control flow in Java and learn how to develop
    an intelligent decision-making system, you will now learn all about conditional
    statements. In addition to this, we will also talk about looping structures, break
    and continue statements, nested loops, and logical operators. At the end of the
    chapter, as usual, you will work on exercises and develop your young code lines.
    Let''s take a look.


    ## CONDITIONAL STATEMENTS


    Conditional statements are, as you might imagine, a condition. For example, if
    it is raining, I will take an umbrella; if it is not, I will not. These two keywords,
    if-then, are the two reserved keywords for these conditional statements. These
    are useful to create a sequence of the actions the program will need to carry
    out and the different decisions it will need to make.


    In this case, if the condition in the output is true, then this will be the output.
    If it is not (else), then this other information will come as an output. It is
    crucial, however, to remember that the computer will follow the order in which
    your code was written. The if-else condition can be used for floats, char, int,
    and boolean, and the statement can be composed of more than one declaration. Let''s
    look at an example.


    Suppose you create an agenda and want each day to represent a specific number.
    In this case, you could tell the program that day 1 is equivalent (==) to Monday,
    day 2 is equivalent to Tuesday, and that day 3 is equivalent to Wednesday. If
    any other number is placed in the field, the output should be "Other day." This
    is what the code would look like:


    Public class Main{


    public static void main(String []args)


    {


    int day = 3;


    String dayName;


    if (day == 1) {


    dayName = "Monday";


    } else if (day == 2) {


    dayName = "Tuesday";


    } else if (day == 3) {


    dayName = "Wednesday";


    } else {


    dayName = "Other day";


    }


    System.out.println("Using if-else: " + dayName);


    }


    }


    In this case, we have established that the int number we are using is 3; therefore,
    the output of the program will be Using if-else: Wednesday. If you were to replace
    the statement int day = 3; for 2, for example, the output would be Tuesday. Try
    it! Copy and paste this code into your IDE and test adding different numbers to
    see the outcome you will have. You can also enhance the code and add other numbers
    equivalent to other days to make the program more dynamic. Don''t forget the curly
    brackets {} for the code to work!'
