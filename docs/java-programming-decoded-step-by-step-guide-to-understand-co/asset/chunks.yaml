    hasCoffee = false;? Can you guess what the output would be? If you said No drinks
    available. then you are correct! This is because you only had the option of drinking
    tea or coffee; therefore, since there was neither option, you would not be able
    to enjoy any drinks.


    NOT Operator


    The last operator we will discuss is the NOT (all in uppercase), represented by
    the exclamation (!) symbol. Unlike the other two logical operators, this one will
    return the output if the condition is false. "Basically, if the condition is false,
    the operation returns true, and when the condition is true, the operation returns
    false" (Lenka, 2023).


    In our example, we will use the condition to determine if you should take an umbrella
    with you or not if it is not raining. This is what the code would look like:


    public class Main {


    public static void main(String[] args) {


    boolean isRaining = false;


    if (!isRaining) {


    System.out.println("No need for an umbrella.");


    } else {


    System.out.println("Take an umbrella with you.");


    }


    }


    }


    The output,  in this case would be No need for an umbrella. since it was identified
    that the condition you have given the system is false. Therefore, if the condition
    is false (or not raining), you do not need to take an umbrella. Now, to do the
    same exercise with the previous operators: What would happen if we changed boolean
    isRaining = false; to boolean isRaining = true;?


    If you said that the output would be Take an umbrella with you. you are correct!
    This is exactly what the system would bring as the answer since the condition
    is true, which was given as the else in the condition. How about that?


    You have learned all about Java control methods and can already code your program
    to make decisions. That is a great advance! To test what you have learned in this
    section, the final part of this chapter will be a small practice exercise with
    a super challenge to see how your coding skills are going. Are you ready?


    ## YOUR TURN TO TRY!


    In this activity, you''ll flex your creative muscles while reinforcing your understanding
    of control flow structures in Java. You''ll be creating a comic strip that reflects
    a day in the life of a student, with each panel showcasing a different control
    flow structure.


    Instructions


    Think of a typical day in the life of a student. What decisions do they have to
    make? What routines do they go through daily? What different paths might their
    day take based on different decisions? For this activity, you will need paper,
    pencils, or markers for drawing. On a sheet of paper, divide the page into several
    sections—these will be the panels of your comic strip. For example:


    *   Panel 1 (decision-making): A student deciding whether to snooze the alarm
    or wake up. Here, you can represent an if-else decision. If they wake up, they
    have breakfast; else, they miss breakfast and rush to school.


    *   Panel 2 (looping): Show the student in class taking notes while the teacher
    is teaching. This can be a while loop. While the teacher is teaching, the student
    keeps taking notes.


    *   Panel 3 (branching): Show the student in the cafeteria deciding what to have
    for lunch—pizza, burger, or salad. This can represent a switch-case scenario where
    each food option is a case.'
