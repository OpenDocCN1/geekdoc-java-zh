    have a specific language, or languages, also known as dialects, that are used
    to communicate with it. These dialects will "translate" what we, humans, want
    the machine to do by transforming our language into one that the computer understands.
    These include, for example, Python, Go, Rust, NodeJS, Elixir, C, C++, and, of
    course, Java.


    By using these languages to instruct and "program" computers, developers can tell
    them what they should do. From the simplest tasks, such as opening word-processing
    software on your computer, to having computers mimic human language in artificial
    intelligence applications, these are all done using programming languages. Almost
    everything that has to do with computer use involves a programming language.


    Now, here is the crucial part and where this book comes in: When you want to "communicate"
    with a computer, so to say, you are going to use one of the languages that allows
    you to do this. And your language choice will depend on two things: 1\. What you
    are comfortable with, and 2\. What it is you need to do. In this case, the language
    choice will directly reflect your personal preference, what you adapt to the most,
    and, more importantly, the market in which you want to act.


    Granted, some languages are considered easier to learn, and others are harder.
    However, it would be irresponsible to classify them since each reader has their
    preferences. This being said, as we move further along in this chapter we will
    explain Java''s main characteristics and its differences in comparison to other
    available languages.


    According to Coursera (2023), programming languages can be grouped into these
    five categories:


    1.  Scripting languages


    2.  Procedural programming languages


    3.  Logic programming languages


    4.  Functional programming languages


    5.  OOP languages


    This might raise the question, In which group does Java fit? That is an excellent
    point. Let''s examine which categories Java fits in and start exploring its characteristics.


    ## JAVA OVERVIEW


    Java is known for being one of the most crucial programming languages when referring
    to those that are object-oriented. When it was released in 1995, Java "had few
    elements that were revolutionary, but the key to its success was combining those
    elements in the right way and learning from predecessors'' strengths and weaknesses.
    Microsoft later used this approach in developing C# by utilizing Java''s experience"
    (Izydorczyk, 2022). As you might imagine, the successful approach led to significant
    attention in the developer market, and many people learned how to use it.


    It would also be impossible to speak about Java and not mention the previous "motto"
    of write once, run everywhere (WORA) for which it was known, despite this not
    being as accurate in the present. This was a significant advantage at the time,
    which meant you could run programs developed with Java on all supported platforms
    without needing to adjust or recompile the code. With the need to increase accessibility
    to technology and develop more software, this became another point that attracted
    many people to work with it and companies to implement it.


    In fact, many companies continue to use Java in their programs because of the
    incredible number of developers with knowledge of it and its reliability. In addition,
    the language is constantly being updated and improved, which means it evolves
    and adapts to the market as it changes. The versatility it provides the developer
    to adapt to most situations remains an attractive attribute that makes learning
    how to code in Java a valuable skill in the technology market.


    Finally, it is crucial to mention that Java''s "age" has become one of its most
    important assets. "Java encourages maturity of solutions and has a large community.
    It''s hard to find technologies without prepared integration with Java or functions
    that aren''t provided by external libraries" (Izydorczyk, 2022). This means that
    even if you are interested in learning more "modern" languages, such as Kotlin,
    having previous knowledge of Java will make the journey easier, as will happen
    with other dialects.


    Now that you have a clear picture of Java''s characteristics, it is time to start
    getting to work. The first thing you will need to do is install what is known
    as the Java Development Kit (JDK), which you will need to write the code. Shall
    we look into what it is and the need to carry out this process?


    ## INSTALLING JAVA DEVELOPMENT KIT


    To start working with Java, you will need to download the JDK to your computer.
    Returning to our furniture-building analogy, the JDK is similar to needing a hammer
    and screwdriver to assemble the piece. Or like the pans, stove, and spoons for
    cooking. Essentially speaking, the JDK will provide the tools you need to write,
    compile, and run your code in Java. "The Java Development Kit (JDK) is one of
    three core technology packages used in Java programming, along with the JVM (Java
    Virtual Machine) and the JRE (Java Runtime Environment)" (Tyson, 2022). These
    three parts of the Java technology can be described as follows:


    *   JDK: Used to develop the software or simply write, compile, and execute the
    code, providing the necessary tools to enable the program to run in the JRE and
    the JVM.


    *   JRE: Used to run the developed code and is part of the JDK kit since you will
    need to run the code to ensure it works.


    *   JVM: Used to host the program where the code will be run, "translating" the
    commands you have given into a language the computer can understand and interpret,
    enabling it to carry out the instructions.


    Now that you know the essential components to set up the Java environment, let''s
    look at the steps to install them.


    1\. Go to the [Oracle.com](http://Oracle.com) website.


    2\. On the top tab, under "Products," go to the last section,     "Hardware and
    Software," and click on "Java."


    3\. Click on the "Download Java" button.


    4\. Under the "Java downloads" section, select between the     JDK 21 or 17 and
    the operating system (OS) you use     (Linux, macOS, or Windows).


    5\. Select the kit you will download according to your     computer''s specifications
    and needs.


    Note: In this book, the instructions will be based on the Windows OS. However,
    you can find the specifications for any different OS in the documentation provided
    on the website.


    6\. Ensure you have a 64-bit operating Windows platform to     download the kit.


    7\. Select the link within the provided list to start     downloading. You will
    need to sign a license agreement     and save an executable (.exe) file on your
    computer     according to the version of Windows you are using.'
