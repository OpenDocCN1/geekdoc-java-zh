    # CHAPTER 2: VARIABLES AND DATA TYPES


    Now you know the Java syntax and the application of classes, methods, and objects,
    it is time to take a closer look at other Java components. These will help you
    write your code and determine what needs to be done and the format that needs
    to be considered. For this reason, in this chapter, you will learn about variables,
    constants, primitive data types, and operations in Java.


    But you did not think you would only see and not do, did you? Well, of course
    not. As you learn each of these, you will also see how they work and how to, for
    example, convert between data types. At the end of the chapter, you will learn
    how to manipulate strings, perform casting, and initialize variables. To ensure
    you have understood the content, you will have some exercises at the end to practice
    your new skills and explore the different coding possibilities.


    ## VARIABLES AND CONSTANTS


    The first thing you will need to understand is that, much like other languages,
    Java has items that can be classified as a variable or a constant. In this case,
    when you have a variable, the information can change according to its use in the
    program. However, for this to be the case, you must declare it, for example:


    ```

    data_type variable_name;

    int x;

    ```


    On the other hand, when you have a constant, as the name suggests, the value will
    be the same throughout the program''s execution. Just as with the variables, you
    will need to "tell" the program that the value you are adopting is a constant
    so it identifies that there will be no change throughout the code by using the
    word `"final."`. This is the syntax of how a constant should be declared:


    ```

    final int X = z;

    ```


    As you might have noticed from the above code, the `"x"` declared in the variable
    is lowercase, while the one in the constant is uppercase. This is very important
    since, as you remember from the previous chapter, Java considers differences between
    the letter cases used in the code. In this situation, when declaring a constant,
    the Java convention states that when a constant is being declared, it needs to
    be used in all caps, and if it is composed of more than one word, you need to
    use the underscore between them.


    While Java has only one way of declaring constants, this is not the case for variables,
    since the language has three different variable types. They are:


    *   Class variables, which relate to the class are usually declared with the keyword
    `static` for the class being used. In other words, this variable will define the
    full block of code for which the specific class is written. When the word `static`
    is used, it means that there is, within the entire program, only one copy of this
    specific variable, and it does not change. In this case, the variables don''t
    necessarily need to be declared. They will automatically refer to the default
    value, which we will discuss in the next section.

    *   Instance variables are nonstatic values that can change as you write your
    code. Since they are mutable, you should not add the `static` term before it.
    In this case, to easily remember what instance variables are, you can refer to
    the name and remember that its characteristic (or value) will depend on the situation
    in which it is used. These variables are declared within a class but outside the
    method. They are used for all the methods within that specific class and should
    always be declared despite having default values. You can use the keywords `"public"`
    or `"private"` before declaring the instance variable to define its visibility.

    *   Local variables are, as the name suggests, the state given to a certain object
    depending on its location within the program. In this case, it will be used in
    a simple syntax where `variable = value`, without needing to use any specific
    keywords and just by placing them between the curly brackets `{ }` in the code.
    Since these are restricted to a certain location, they will only refer to that
    part of the code and will not be used in other places. They are usually declared
    within methods since they will be used as the blocks to build that code and, considered
    temporary—once used, are destroyed by the program.


    These are the different ways that the developer can code and attribute states
    to the objects they are declaring. However, you must be wondering, is there a
    difference in how I am supposed to write a number or a word, or even a distinction
    between a full number and a decimal one? That, in fact, is a very good question
    because there certainly is.


    When you write code in Java, different data types can be used, each of which will
    store information in a different format. In Java, we have both primitive and nonprimitive
    data types.


    ## PRIMITIVE DATA TYPES


    Primitive data types, as the name suggests, are those that are native to the language
    and have predefined functions. In Java, there are eight primitive data types:
    those that accept boolean data and the ones that accept numerical values. While
    in boolean, there is no subcategory, when we talk about numeric types, these can
    be divided into `char`, `byte`, `short`, `int`, `long`, `float`, and `double`.


    Below, you will find a chart that shows you each data type and its specific characteristics,
    obtained from Agrawal (2023):


    ![](image_rsrc4ZS.jpg)

