    Using the int sum, the answer is: 11\n\n因此，当你执行方法重载时，重要的是你更改了参数的数量或它们的数据类型。否则，“如果我们只更改方法的返回类型，它就不是方法重载。参数的数量必须有差异”（Java\
    \ Method Overloading, n.d.）。\n\n正如你所看到的，当我们声明一个方法时，我们需要使用变量来确定数据的存储方式。这些变量将用于存储归属于数据的不同特征。在下一节中，我们将看到变量数据容器如何存储值以及可以应用的作用域。\n\
    \n## 变量的作用域\n\n当你为数据的位置分配内存时，你正在使用一个变量。这意味着，当你说 `int a = 2` 时，你正在将变量 `a` 赋值为 `2`。这就像当我们输入字符串\
    \ \"Hello Data\" 时，存储的值是引号之间的字母或单词。当我们谈论变量的作用域时，我们指的是告诉编译器“关于程序中变量可以访问或使用的段落”的说明。“对于\
