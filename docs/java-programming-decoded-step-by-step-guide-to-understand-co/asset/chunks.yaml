    \ EXCEPTIONS\n\nCustom exceptions are created when you extend from the `exception`\
    \ class. As you will see in the code below, you will declare the exception class\
    \ with the name you have according to the specific business need or even that\
    \ you want to handle, but you will need to extend it from the superclass `Exception`.\
    \ When you do this, there are a few rules that you must remember:\n\n1. Only create\
    \ exceptions that will be useful and have a purpose. Since most of the exception\
    \ classes in `Java` cover the developer's needs, creating an exception needs to\
    \ fulfill the specific need of the business you are working for, or else there\
    \ will be no benefit to obtain from it.\n2. When you create an exception, you\
