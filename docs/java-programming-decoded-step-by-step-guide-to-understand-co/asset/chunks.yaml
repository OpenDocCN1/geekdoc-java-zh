    \ and insert information within the indicated group of elements.\n\nFor example,\
    \ if you have a list of lists, a queue of queues, and a set of sets, you will\
    \ have a collection. We can say that the more \"grouped\" different data and elements\
    \ in the code become, the closer they are to becoming a collection. After a collection,\
    \ the next step in the hierarchy is iterable, but we will not discuss it in this\
    \ chapter.\n\nIt is important to note that Java has two interfaces: the `collection`\
    \ and the `map` interface. If you use either, you will need to import different\
