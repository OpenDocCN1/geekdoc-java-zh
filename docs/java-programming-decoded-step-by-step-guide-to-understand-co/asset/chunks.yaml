- fmt: "\n\"Function overloading is one of the ways to achieve polymorphism, but it\
    \ depends on technology and which type of polymorphism we adopt. In Java, we achieve\
    \ function overloading at compile-time\" (Adware, 2022). In this case, inheritance\
    \ is not necessarily involved, which makes this code less flexible, since everything\
    \ will run when the time to compile it comes.\n\nOn the other hand, we also have\
    \ run-time polymorphism, which has unique characteristics that we could mention\
    \ are almost the opposite of compile-time. As we move on to this next section,\
    \ you will learn about its characteristics and how it differs from what we have\
    \ just seen.\n\n# Run-Time Polymorphism\n\nThis type of polymorphism is also known\
    \ as dynamic polymorphism, and involves inheritance. To apply this technique,\
    \ method overloading is not necessary, but you will need to apply method overriding,\
    \ which \"says the child class has the same method as declared in the parent class.\
    \ It means the child class provides the specific implementation of the method\
    \ that has been provided by one of its parent classes\" (Adware, 2022). This execution\
    \ is slower than the compile-time, but it is also more flexible.\n\nHere are two\
    \ code examples where this is applied, and you will be able to identify the difference\
    \ and the application of inheritance in them:\n\n```\nclass Animal {\n  void makeSound()\
    \ {\n    System.out.println(\"Some generic sound\");\n  }\n}\n\nclass Dog extends\
    \ Animal {\n  void makeSound() {\n    System.out.println(\"Bark\");\n  }\n}\n\
    ```\n\nFor interfaces, in this different application, you will see that it is\
    \ also possible to apply run-time polymorphism when you have a method that is\
    \ void and does not have any action within it.\n\n```java\ninterface Shape {\n\
    \  void draw();\n}\n\nclass Circle implements Shape {\n  void draw() {\n    System.out.println(\"\
    Drawing a circle\");\n  }\n}\n```\n\nEssentially speaking, when you have polymorphism,\
    \ it will allow the objects to adopt different forms and behaviors. In the example\
    \ below, you will see that the \"Dog\" class can have a method \"sound()\" that\
    \ returns \"bark,\" while the \"Cat\" class can also have a \"sound()\" method\
    \ that returns \"meow.\" The `Dog` and `Cat` classes are subclasses of `Animal`\
    \ and override the `makeSound` method with their specific sounds.\n\n```java\n\
    // Base class (superclass)\nclass Animal {\n  void makeSound() {\n    System.out.println(\"\
    Some generic animal sound.\");\n  }\n}\n\n// Derived class 1 (subclass)\nclass\
    \ Dog extends Animal {\n  @Override\n  void makeSound() {\n    System.out.println(\"\
    Woof! Woof!\");\n  }\n}\n\n// Derived class 2 (subclass)\nclass Cat extends Animal\
    \ {\n  @Override\n  void makeSound() {\n    System.out.println(\"Meow! Meow!\"\
    );\n  }\n}\n\npublic class PolymorphismAnimalExample {\n  public static void main(String[]\
    \ args) {\n    // Creating objects of different subclasses\n    Animal myDog =\
    \ new Dog();\n    Animal myCat = new Cat();\n    // Calling the overridden method,\
    \ which varies based on the actual object type\n    myDog.makeSound(); // Output:\
    \ Woof! Woof!\n    myCat.makeSound(); // Output: Meow! Meow!\n  }\n}\n```\n\n\
    If you go back a little in this section, you will see that interfaces were mentioned.\
    \ But you must be asking yourself, What is an interface, and how is it used? This\
    \ is a very good question since it is also an important Java characteristic that\
    \ was implemented in more detail from Java version 8. Based on this information,\
    \ let's take a look at the last section of this chapter, in which you will learn\
    \ Java concepts before learning how to create classes and test your knowledge.\n\
    \n## ABSTRACT CLASSES AND INTERFACES\n\nTo understand the application of abstract\
    \ classes and interfaces, it is first important to identify what a normal concrete\
    \ class is. It is nothing more than the classes you have seen up to now that have\
    \ methods that represent the behavior of a certain object. However, when you want\
    \ to hide this implementation or even the complexity of the code you are creating,\
    \ you can apply two methods known as abstract classes and interfaces (baeldung,\
    \ 2022). Read on to find out their main characteristics and implementation methods.\n\
    \n## Implementation\n\nWhen you apply to the abstract class, the main thing you\
    \ should remember is that the keyword `abstract` needs to be used before the class\
    \ name. These classes will have no restrictions, and when you have abstract methods,\
    \ the class should be abstract as well. One of its essential characteristics is\
    \ that you do not need to use the keyword `new` when creating an object, it will\
    \ immediately override the method with an anonymous class, although it will only\
    \ be extended to one class. At the same time, this does not mean that these methods\
    \ do not need to be declared or defined. This is a possibility that can or cannot\
    \ be used when they are being implemented for both abstract classes and interfaces\
    \ (baeldung, 2022).\n\nConversely, when you have an interface, it is nothing more\
    \ than a \"contract\" that you are establishing in the code that does not take\
    \ any action. Here, the main characteristic is the use of the `interface` keyword,\
    \ which will help implement it in the subclasses. Differently from the abstract\
