    \ {\n\n    public static void main(String[] args) {\n        int factorialResult\
    \ = calculateFactorial(5);\n        System.out.println(\"Factorial of 5 is: \"\
    \ + factorialResult);\n    }\n\n    public static int calculateFactorial(int n)\
    \ {\n        //在这里你定义将使用一个以\"n\"作为参数的整数\n        // 在此类，基本情况检查 n 是否为 0 或 1，如果是，则阶乘为\
    \ 1\n        if (n == 0 || n == 1) {\n            return 1;\n        } else {\n\
    \            // 递归调用计算阶乘\n            return n * calculateFactorial(n - 1);\n\
    \        }\n    }\n}\n```\n\n输出将是 5 的阶乘，即 5! = 5 x 4 x 3 x 2 x 1 = 120。然而如之前提到的，这是一个相当复杂的概念，你需要通过练习来确保它被正确应用。你可以尝试使用不同的方法，例如相加\
    \ 1–10 的数字、确定指数值等。最重要的是你要练习。说起练习，轮你尝试了！我们要看看这一章关于方法的练习吗？\n\n## 轮到你尝试！\n\n创建一个\
    \ Java 程序，使用重载方法来计算圆和矩形的面积，其中 `main` 方法应用于演示这些方法的使用。为了确保获得正确的结果，你必须遵循以下要求：\n\n\
    *   创建一个名为 `AreaCalculator` 的类。\n*   为每个形状的面积计算实现重载方法：圆和矩形。\n*   使用以下公式进行面积计算：\n\
    \    *   圆：`area = π × r × r`（其中 `r` 是半径）。\n    *   矩形：`area = length × width`（其中\
    \ `length` 和 `width` 是边长）。\n\n现在你已经理解方法是如何工作的，我们可以深入探索 Java 的核心以及它为什么成为一种独特的语言。在下一章中，我们将探索如何创建类和对象，以及\
    \ OOP 的原则。如果你准备好继续我们的冒险，让我们开启这段激的旅程，解码 Java 中 OOP 的奥秘吧！\n\n# 第 6 章\n# 面向对象编程\n\
    \n正如本书介绍中所提到的，Java 是一种 OOP 语言，这意味着它使用对象来决定我们正在构建的代码中会发生什么。在本章中，你将学习关于创建对象、类、它们的原则、特性以及封装、多态和继承等概念的所有知识。如果你准备好看到\
    \ Java 的“核心”并学习什么使其成为一种独特的学习和编程语言，请继续阅读！你即将将洞察它的内部运作以及不同的使用方法。\n\n## OOP 简介\n\n\
    当开发者决定在编码中使用 OOP 时，他们正努力实现 DRY 原则，即“不要重复自己”（Don't repeat yourself）。这是因为当你创建并使用对象进行编码时，你使得代码更容易创建、修改、维护和调试，从而用更少的代码和更短的时间实现不同的用途。这些优势使得程序更容易执行，代码行具有清晰易懂的结构且更具可读性（Java\
    \ 面向对象编程，2020）。\n\n使用 OOP 的开发者会将这种技术应用于编程中的“真实世界实体，如继承、隐藏和多态。其主要目标是将操作数据的数据和函数结合在一起，使得代码的其他部分无法访问这些数据，该函数除外”（RishabhPrabhu，2023）。正如我们在方法中看到的，，你可以使用访问修饰符来确定\
    \ OOP 类的可用性（使用 `public`、`protected`、`private` 和 `default`），还可以通过提到你想让对象具有的不同操作。\n\
    \n为了更好地理解关注类和对象的 OOP 意味着什么，我们应该首先理解它们以及它们是如何相关的。这是 OOP 的两个主要特征，建立在封装、多态、抽象和继承的支柱之上。这六项共同支持\
    \ OOP 的存在，并使 Java 成为这种多功能且可复用的语言。尽管我们将在后续章节中学习这些支柱的每一个，但理解类和对象是什么至关重要的。你已经在之前的练习的各种应用中看到了它们，但除了第\
    \ 1 章的初步解释外，我们还没有对这些每一个进行详细说明。但不要担心，时机到了，你即将学习更多关于它们的知识。进入下一节学习类和对象的细节、它们是如何相互相关的，以及在\
    \ Java 中编写代码时什么让它们如此特别。\n\n## 类和对象\n\n要理解对象和类是什么，你只需要观察四周：它们无处不在！这是因为类和对象是应用于我们软件的现实物品、概念和实体。当我们谈论软件开发时，我们必须考虑这些类和对象也有行为和状态，这正是它们在现实世界中的运作方式。“软件对象的状态存储在字段中，行为通过方法显示。因此，在软件开发中，方法对对象的内部状态操作，对象与对象之间的通信通过方法完成”（Java\
    \ 对象和类，2019）。\n\n一个让你容易理解的关联是，类是描述通用类别的“蓝图”，例如“学生”。在这种情况下，这是一种确定组的通用方法。接下来，我们可以描述它的行为和状态，可以是\
    \ `int age`、`int grade`、`double height` 和 `string loud`，这些都是描述“学生”类的特征。\n\n这里是更多示例，将帮助你通过现实示例关联类和对象之间的区别：\n\
    \n*   蔬菜类 (Vegetables)\n    *   对象：南瓜、西兰花\n*   摩托摩托车类 (Motorcycles)\n    *   对象：铃轮、本田、哈雷戴维森\n\
    *   动物类 (Animals)\n    *   对象：大象、长颈鹿、犀牛、猴子\n\n但同时，我们在这里拥有的这些对象也可以是类，例如（现在实现一个可能用到的数据类型示例）：\n\
    \n*   胡萝卜类 (Carrot)\n    *   对象：`String color`、`double size`、`double weight`\n\
    *   哈雷戴维森类 (Harley-Davidson)\n    *   对象：`String color`、`boolean wheels`、`int\
    \ places`\n*   猴子类 (Monkey)\n    *   对象：`String color`、`boolean banana`、`double\
    \ weight`\n\n在所有这些类中，你可以观察到我们有一个描述其中包含对象的“通用”类，这使得动物，例如猴子成为动物类的一个对象。但猴子也可以是一个类，如果发生这种情况，重量，例如将是该类的一个对象。现在这些概念已经清晰了，我们可以进一步探索\
    \ Java 中类和对象的概念以及如何使用它们。\n\n### Java 中的类\n\n正如你所知，类是建立对象行为的蓝图。在这种情况下，必须创建类以关联代码中对象。例如，在下面的代码中，我们有一个名为\
    \ `School` 的类。\n\n```java\npublic class School {\n    String teachers;\n    int\
    \ grades;\n    String subjects;\n}\n```\n\n在类类中创建的对象直接关联到已建立的主体“蓝图”。这意味着我们拥有对象：`teachers`、`grades`\
    \ 和 `subjects`。在部分部分代码中，我们建立了 `public` 构造函数，正如你所知道的，它将允许代码的所有部分访问。\n\n"
- fmt: "\nWhen you use objects in `Java`, you are creating real-world entities that\
    \ have characteristics that relate to that class. In this case, the object will\
    \ need to have a state, which is its attributes, a behavior, which will be represented\
    \ by the method, and an identity, which will establish how an object relates to\
    \ another. In the case of identity, you should keep in mind that each object will\
    \ have a unique identity with a unique identifier and state. If we were to use\
    \ as an example the class `Cat`, we could say that the objects that relate to\
    \ it are breed, `color`, `size`, and `weight`, and the behavior (methods) would\
    \ be `meow`, `purr`, `sleep`, and `eat`.\n\nAs soon as an object of a certain\
    \ class is created, we can say it has been instantiated, which means that \"all\
    \ the instances share the attributes and the behavior of the class. But the values\
    \ of those attributes, i.e., the state, are unique for each object. A single class\
    \ may have any number of instances\" (Miglani, 2023). As you have seen in the\
    \ previous example with the class `Cat`, it can have different characteristics,\
    \ and the more you specify them, the more detailed the class will be.\n\nHowever,\
    \ depending on the code you are creating, there can be many different objects;\
    \ the more objects you create, the more difficult it becomes to read the code.\
    \ In this case, there is another technique that is applicable in OOP that will\
    \ prove to be useful for the developer. This is called data encapsulation. In\
    \ the upcoming section of this chapter, we are going to learn what this is and\
    \ also understand information hiding.\n\n## Encapsulation and Information Hiding\n\
    \nEncapsulation and data hiding are powerful techniques in `Java` that enable\
    \ different objects to be grouped together under the same class. When you encapsulate\
    \ the data from a specific class, you are protecting it from being accessed by\
    \ other classes, making the code safer. At the same time, when you encapsulate\
    \ the objects in the `Java` code, you can hide the information and make it \"\
    secret,\" so to speak, so they cannot be accessed by other parts of the code.\
    \ When you use both of these features, it makes your code more protected and efficient,\
    \ since you will be able to divide them into modules and modify only this part\
    \ without affecting the remainder of the code. In this section, we are going to\
    \ look at the different ways that encapsulation and information hiding can be\
    \ used to enhance your code and make your product better.\n\n### Encapsulation\n\
    \nIf you understand the concept of classes and objects, encapsulation will likely\
    \ be a stroll in the park. This is because \"encapsulation aims to protect the\
    \ data from outside interference and provide a controlled interface for accessing\
    \ and modifying the data\" (Khan, 2023). When this code is controlled, it is possible\
    \ to reuse it and provide abstract classes and objects, which we will see more\
    \ about further along in this chapter.\n\nWhen you are applying encapsulation\
    \ to your code, you will need to use what are called access modifiers with methods\
    \ known as `getter` and `setter`. Within these, you will be able to determine\
    \ the modifiers between `public`, `private`, `protected`, and `default`. Here\
    \ is a small explanation of what each of these will do:\n\n*   `public`: When\
    \ this modifier is used, the object can be accessed throughout all the code.\n\
    *   `private`: This modifier will make the objects available only within the class\
    \ in which it is located.\n*   `protected`: \"This encapsulation lets you declare\
    \ that a method or variable can be accessed by subclasses of your current class\
    \ and its subclasses only (you cannot use this keyword on methods)\" (Khan, 2023).\n\
    *   `default`: When you use the default modifier, you are establishing that the\
    \ nonstatic members are all defined according to the visibility established by\
    \ the private package.\n\nHere is one example of how the objects in your code\
    \ can be encapsulated using `public` and `private` modifiers. In this example,\
    \ you have the `Person` class that encapsulates the `name` and `age` variables\
    \ by declaring them as `private` and provides `public` methods (`getName`, `setName`,\
    \ `getAge`, `setAge`, `printDetails`) to access and modify these variables. This\
    \ helps control access and apply validation logic, making safer and more modular\
    \ coding possible.\n\n```java\n//the Person.java file so it can be accessed by\
    \ the code\n\nPerson.java\n\npublic class Person {\n\n    // Encapsulated variables\
    \ (private)\n    private String name;\n    private int age;\n\n    // Constructor\n\
    \    public Person(String name, int age) {\n        this.name = name;\n      \
    \  this.age = age;\n    }\n\n    // Public methods to access and modify encapsulated\
    \ variables\n    public String getName() {\n        return name;\n    }\n\n  \
    \  public void setName(String name) {\n        this.name = name;\n    }\n\n  \
    \  public int getAge() {\n        return age;\n    }\n\n    public void setAge(int\
    \ age) {\n        // Validation logic can be added here\n        if (age > 0)\
    \ {\n            this.age = age;\n        } else {\n            System.out.println(\"\
    Invalid age\");\n        }\n    }\n\n    // Other methods of the class\n    public\
    \ void printDetails() {\n        System.out.println(\"Name: \" + name);\n    \
    \    System.out.println(\"Age: \" + age);\n    }\n}\n```\n\nHowever, when you\
    \ carry out encapsulation (or data bundling), it is essential that you test the\
    \ code to ensure the correct relationships have been established and the necessary\
    \ elements are being accessed in the code. For this, we will carry out what is\
    \ called \"Class test,\" which could easily be done using the following application:\n\
    \n### Class Test Example\n\n```java\n//create the EncapsulationExample file to\
    \ run the code\n//In this case, you will need to add the code from the previous\
    \ section first\n//and the one you are about to see next\n\npublic class EncapsulationExample\
    \ {\n    public static void main(String[] args) {\n        // Create an instance\
    \ of the Person class\n        Person person = new Person(\"John\", 25);\n\n \
    \       // Access and modify encapsulated variables using public methods\n   \
    \     person.setName(\"Mary\");\n        person.setAge(30);\n\n        // Access\
    \ information using public methods\n        person.printDetails();\n    }\n}\n\
    ```\n\nIf you try this code in your IDE (adding them both as instructed), you\
    \ will find that the output will be:\n\nName: Mary\nAge: 30\n\nThis output shows\
    \ you how encapsulation makes it possible to have a controlled access and modification\
    \ of the encapsulated variables, guaranteeing the proper functioning of your code.\n\
    \n### What Is Data Hiding?\n\nWhen you have objects that need to be hidden for\
    \ security purposes (especially for code that is confidential and could be hacked),\
    \ you can use the concept known as data hiding. This technique is used only if\
    \ you have encapsulation, since it implies that you are restricting access to\
    \ the data, as encapsulation allows you to do. In this case, the example that\
    \ can be mentioned is:\n\nLet [us] declare a `BankAccount` class, and [that] we\
    \ have a data member `AcBalance` inside this class. Here, the account balance\
    \ is sensitive information. In this example, we may allow an external application\
    \ to check the account balance, but we [may] not allow the application to change\
    \ the account balance. Hence, in this case, we restrict the alternation in account\
    \ balance by declaring the account balance attribute private. The major advantage\
    \ of data hiding is that it reduces the complexity of the system.\n\n(Difference\
    \ Between Data Hiding and Encapsulation, n.d.)\n\nTo see how data hiding can be\
    \ applied, you will now see an example that will clearly illustrate this. In it,\
    \ the `Circle` class hides the `radius` field and provides a `public` method (`getRadius`)\
    \ to access it.\n\n```java\n//create a file for the class\n\nCircle.java\n\npublic\
    \ class Circle {\n    private double radius;\n\n    public Circle(double radius)\
    \ {\n        this.radius = radius;\n    }\n\n    // Public method to get the radius\
    \ (data hiding)\n    public double getRadius() {\n        return radius;\n   \
    \ }\n}\n```\n\n//create a new file for data access and class testing\n\nDataHidingExample.java\n\
    \npublic class DataHidingExample {\n    public static void main(String[] args)\
    \ {\n        Circle circle = new Circle(5.0);\n\n        // Accessing the radius\
    \ through a public method\n        double radius = circle.getRadius();\n     \
    \   System.out.println(\"Radius: \" + radius);\n    }\n}\n```\n"
  raw: 'When you use objects in Java, you are creating real-world entities that have
    characteristics that relate to that class. In this case, the object will need
    to have a state, which is its attributes, a behavior, which will be represented
    by the method, and an identity, which will establish how an object relates to
    another. In the case of identity, you should keep in mind that each object will
    have a unique identity with a unique identifier and state. If we were to use as
    an example the class "Cat," we could say that the objects that relate to it are
    breed, color, size, and weight, and the behavior (methods) would be meow, purr,
    sleep, and eat.


    As soon as an object of a certain class is created, we can say it has been instantiated,
    which means that "all the instances share the attributes and the behavior of the
    class. But the values of those attributes, i.e., the state, are unique for each
    object. A single class may have any number of instances" (Miglani, 2023). As you
    have seen in the previous example with the class Cat, it can have different characteristics,
    and the more you specify them, the more detailed the class will be.


    However, depending on the code you are creating, there can be many different objects;
    the more objects you create, the more difficult it becomes to read the code. In
    this case, there is another technique that is applicable in OOP that will prove
    to be useful for the developer. This is called data encapsulation. In the upcoming
    section of this chapter, we are going to learn what this is and also understand
    information hiding.


    ## ENCAPSULATION AND INFORMATION HIDING


    Encapsulation and data hiding are powerful techniques in Java that enable different
    objects to be grouped together under the same class. When you encapsulate the
    data from a specific class, you are protecting it from being accessed by other
    classes, making the code safer. At the same time, when you encapsulate the objects
    in the Java code, you can hide the information and make it "secret," so to speak,
    so they cannot be accessed by other parts of the code. When you use both of these
    features, it makes your code more protected and efficient, since you will be able
    to divide them into modules and modify only this part without affecting the remainder
    of the code. In this section, we are going to look at the different ways that
    encapsulation and information hiding can be used to enhance your code and make
    your product better.


    Encapsulation


    If you understand the concept of classes and objects, encapsulation will likely
    be a stroll in the park. This is because "encapsulation aims to protect the data
    from outside interference and provide a controlled interface for accessing and
    modifying the data" (Khan, 2023). When this code is controlled, it is possible
    to reuse it and provide abstract classes and objects, which we will see more about
    further along in this chapter.


    When you are applying encapsulation to your code, you will need to use what are
    called access modifiers with methods known as getter and setter. Within these,
    you will be able to determine the modifiers between public, private, protected,
    and default. Here is a small explanation of what each of these will do:


    *   Public: When this modifier is used, the object can be accessed throughout
    all the code.


    *   Private: This modifier will make the objects available only within the class
    in which it is located.


    *   Protected: "This encapsulation lets you declare that a method or variable
    can be accessed by subclasses of your current class and its subclasses only (you
    cannot use this keyword on methods)" (Khan, 2023).


    *   Default: When you use the default modifier, you are establishing that the
    nonstatic members are all defined according to the visibility established by the
    private package.


    Here is one example of how the objects in your code can be encapsulated using
    public and private modifiers. In this example, you have the "Person" class that
    encapsulates the name and age variables by declaring them as private and provides
    public methods (getName, setName, getAge, setAge, printDetails) to access and
    modify these variables. This helps control access and apply validation logic,
    making safer and more modular coding possible.


    //the Person.java file so it can be accessed by the code


    Person.java


    public class Person {


    // Encapsulated variables (private)


    private String name;


    private int age;


    // Constructor


    public Person(String name, int age) {


    this.name = name;


    this.age = age;


    }


    // Public methods to access and modify encapsulated variables


    public String getName() {


    return name;


    }


    public void setName(String name) {


    this.name = name;


    }


    public int getAge() {


    return age;


    }


    public void setAge(int age) {


    // Validation logic can be added here


    if (age > 0) {


    this.age = age;


    } else {


    System.out.println("Invalid age");


    }


    }


    // Other methods of the class


    public void printDetails() {


    System.out.println("Name: " + name);


    System.out.println("Age: " + age);


    }


    }


    However, when you carry out encapsulation (or data bundling), it is essential
    that you test the code to ensure the correct relationships have been established
    and the necessary elements are being accessed in the code. For this, we will carry
    out what is called "Class test," which could easily be done using the following
    application:


    Class Test Example


    //create the EncapsulationExample file to run the code


    //In this case, you will need to add the code from the previous section first


    //and the one you are about to see next


    public class EncapsulationExample {


    public static void main(String[] args) {


    // Create an instance of the Person class


    Person person = new Person("John", 25);


    // Access and modify encapsulated variables using public methods


    person.setName("Mary");


    person.setAge(30);


    // Access information using public methods


    person.printDetails();


    }


    }


    If you try this code in your IDE (adding them both as instructed), you will find
    that the output will be


    Name: Mary


    Age: 30


    This output shows you how encapsulation makes it possible to have a controlled
    access and modification of the encapsulated variables, guaranteeing the proper
    functioning of your code.


    What Is Data Hiding?


    When you have objects that need to be hidden for security purposes (especially
    for code that is confidential and could be hacked), you can use the concept known
    as data hiding. This technique is used only if you have encapsulation, since it
    implies that you are restricting access to the data, as encapsulation allows you
    to do. In this case, the example that can be mentioned is:


    Let [us] declare a BankAccount class, and [that] we have a data member AcBalance
    inside this class. Here, the account balance is sensitive information. In this
    example, we may allow an external application to check the account balance, but
    we [may] not allow the application to change the account balance. Hence, in this
    case, we restrict the alternation in account balance by declaring the account
    balance attribute private. The major advantage of data hiding is that it reduces
    the complexity of the system.


    (Difference Between Data Hiding and Encapsulation, n.d.)


    To see how data hiding can be applied, you will now see an example that will clearly
    illustrate this. In it, the Circle class hides the radius field and provides a
    public method (getRadius) to access it.


    //create a file for the class


    Circle.java


    public class Circle {


    private double radius;


    public Circle(double radius) {


    this.radius = radius;


    }


    // Public method to get the radius (data hiding)


    public double getRadius() {


    return radius;


    }


    }


    //create a new file for data access and class testing


    DataHidingExample.java


    public class DataHidingExample {


    public static void main(String[] args) {


    Circle circle = new Circle(5.0);


    // Accessing the radius through a public method


    double radius = circle.getRadius();


    System.out.println("Radius: " + radius);


    }


    }'
