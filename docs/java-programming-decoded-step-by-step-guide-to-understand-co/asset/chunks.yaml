  raw: '"Function overloading is one of the ways to achieve polymorphism, but it depends
    on technology and which type of polymorphism we adopt. In Java, we achieve function
    overloading at compile-time" (Adware, 2022). In this case, inheritance is not
    necessarily involved, which makes this code less flexible, since everything will
    run when the time to compile it comes.


    On the other hand, we also have run-time polymorphism, which has unique characteristics
    that we could mention are almost the opposite of compile-time. As we move on to
    this next section, you will learn about its characteristics and how it differs
    from what we have just seen.


    Run-Time Polymorphism


    This type of polymorphism is also known as dynamic polymorphism, and involves
    inheritance. To apply this technique, method overloading is not necessary, but
    you will need to apply method overriding, which "says the child class has the
    same method as declared in the parent class. It means the child class provides
    the specific implementation of the method that has been provided by one of its
    parent classes" (Adware, 2022). This execution is slower than the compile-time,
    but it is also more flexible.


    Here are two code examples where this is applied, and you will be able to identify
    the difference and the application of inheritance in them:


    class Animal {


    void makeSound() {


    System.out.println("Some generic sound");


    }


    }


    class Dog extends Animal {


    void makeSound() {


    System.out.println("Bark");


    }


    }


    For interfaces, in this different application, you will see that it is also possible
    to apply run-time polymorphism when you have a method that is void and does not
    have any action within it.


    interface Shape {


    void draw();


    }


    class Circle implements Shape {


    void draw() {


    System.out.println("Drawing a circle");


    }


    }


    Essentially speaking, when you have polymorphism, it will allow the objects to
    adopt different forms and behaviors. In the example below, you will see that the
    "Dog" class can have a method "sound()" that returns "bark," while the "Cat" class
    can also have a "sound()" method that returns "meow." The Dog and Cat classes
    are subclasses of Animal and override the makeSound method with their specific
    sounds.


    // Base class (superclass)


    class Animal {


    void makeSound() {


    System.out.println("Some generic animal sound.");


    }


    }


    // Derived class 1 (subclass)


    class Dog extends Animal {


    @Override


    void makeSound() {


    System.out.println("Woof! Woof!");


    }


    }


    // Derived class 2 (subclass)


    class Cat extends Animal {


    @Override


    void makeSound() {


    System.out.println("Meow! Meow!");


    }


    }


    public class PolymorphismAnimalExample {


    public static void main(String[] args) {


    // Creating objects of different subclasses


    Animal myDog = new Dog();


    Animal myCat = new Cat();


    // Calling the overridden method, which varies based on the actual object type


    myDog.makeSound(); // Output: Woof! Woof!


    myCat.makeSound(); // Output: Meow! Meow!


    }


    }


    If you go back a little in this section, you will see that interfaces were mentioned.
    But you must be asking yourself, What is an interface, and how is it used? This
    is a very good question since it is also an important Java characteristic that
    was implemented in more detail from Java version 8. Based on this information,
    let''s take a look at the last section of this chapter, in which you will learn
    Java concepts before learning how to create classes and test your knowledge.


    ## ABSTRACT CLASSES AND INTERFACES


    To understand the application of abstract classes and interfaces, it is first
    important to identify what a normal concrete class is. It is nothing more than
    the classes you have seen up to now that have methods that represent the behavior
    of a certain object. However, when you want to hide this implementation or even
    the complexity of the code you are creating, you can apply two methods known as
    abstract classes and interfaces (baeldung, 2022). Read on to find out their main
    characteristics and implementation methods.


    Implementation


    When you apply to the abstract class, the main thing you should remember is that
    the keyword abstract needs to be used before the class name. These classes will
    have no restrictions, and when you have abstract methods, the class should be
    abstract as well. One of its essential characteristics is that you do not need
    to use the keyword new when creating an object, it will immediately override the
    method with an anonymous class, although it will only be extended to one class.
    At the same time, this does not mean that these methods do not need to be declared
    or defined. This is a possibility that can or cannot be used when they are being
    implemented for both abstract classes and interfaces (baeldung, 2022).


    Conversely, when you have an interface, it is nothing more than a "contract" that
    you are establishing in the code that does not take any action. Here, the main
    characteristic is the use of the interface keyword, which will help implement
    it in the subclasses. Differently from the abstract class, multiple interfaces
    can be implemented in your code, which makes it an ideal solution to use if you
    are using multiple inheritance and different classes with district hierarchies.
    When we use an interface, we want to understand how the behavior can be added
    to the object.


    Here is an example of how abstract classes and interfaces can be implemented with
    the use of inheritance:


    // Abstract class


    abstract class Shape {


    // Abstract method (to be implemented by subclasses)


    abstract double calculateArea();


    // Concrete method


    void display() {


    System.out.println("This is a shape.");


    }


    }


    // Concrete subclass 1


    class Circle extends Shape {


    double radius;


    Circle(double radius) {


    this.radius = radius;


    }


    @Override


    double calculateArea() {


    return Math.PI * radius * radius;


    }


    }


    // Concrete subclass 2


    class Rectangle extends Shape {


    double length;


    double width;


    Rectangle(double length, double width) {


    this.length = length;


    this.width = width;


    }


    @Override


    double calculateArea() {


    return length * width;


    }


    }


    // Interface


    interface Sound {


    void makeSound();


    }


    // Class implementing the interface


    class Dog implements Sound {


    @Override


    public void makeSound() {


    System.out.println("Woof! Woof!");


    }


    }


    // Class implementing multiple interfaces


    class Parrot implements Sound {


    @Override


    public void makeSound() {


    System.out.println("Squawk! Squawk!");


    }


    }


    public class AbstractClassInterfaceExample {


    public static void main(String[] args) {


    // Abstract class example


    Shape circle = new Circle(5);


    circle.display();


    System.out.println("Area of Circle: " + circle.calculateArea());


    Shape rectangle = new Rectangle(4, 6);


    rectangle.display();


    System.out.println("Area of Rectangle: " + rectangle.calculateArea());


    // Interface example


    Sound dog = new Dog();


    dog.makeSound();


    Sound parrot = new Parrot();


    parrot.makeSound();


    }


    }


    As you can see by how the code is set up, it enables abstract classes and interfaces
    to provide common behavior and structure for related classes in a hierarchy. Here
    is the output you obtain when you add this code to your IDE:


    This is a shape.


    Area of Circle: 78.53981633974483


    This is a shape.


    Area of Rectangle: 24.0


    Woof! Woof!


    Squawk! Squawk!


    In this example, you can see that "Shape" is an abstract class with an abstract
    method "calculateArea()" and a concrete method "display()." At the same time,
    "Circle" and "Rectangle" are concrete subclasses of "Shape" that implement the
    "calculateArea()" method. In the second part of the code, when we are talking
    about animal sounds, "Sound" is an interface with a method "makeSound()". In this
    case, "Dog" and "Parrot" are classes that implement the "Sound" interface.'
