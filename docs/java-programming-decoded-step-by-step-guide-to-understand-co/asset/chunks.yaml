  trans: "\n\n# 跨网络通信\n\n为了查看通过网络通信的不同选项，这里有另一个你可以使用的示例，用于建立客户端和服务器之间的这种连接。再次，我们将使用\
    \ `java.io` 和 `java.net` 包来执行代码，所有将采取的步骤将通过注释进行详细说明。这是编写此类通信的另一种方法，根据你正在处理的结构为你提供了更多多样化的可能性。\n\
    \n### 服务器\n\n```java\nimport java.io.BufferedReader;\nimport java.io.IOException;\n\
    import java.io.InputStreamReader;\nimport java.io.PrintWriter;\nimport java.net.ServerSocket;\n\
    import java.net.Socket;\n\npublic class Server {\n    public static void main(String[]\
    \ args) {\n        final int PORT = 8081;\n        try {\n            // 创建服务器套字\n\
    \            ServerSocket serverSocket = new ServerSocket(PORT);\n           \
    \ System.out.println(\"Server listening on port \" + PORT);\n            // 等待客户端连接\n\
    \            Socket clientSocket = serverSocket.accept();\n            System.out.println(\"\
    Client connected\");\n            // 设置输入和输出流\n            BufferedReader input\
    \ = new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));\n\
    \            PrintWriter output = new PrintWriter(clientSocket.getOutputStream(),\
    \ true);\n            // 从客户端接收数据\n            String clientMessage = input.readLine();\n\
    \            System.out.println(\"Received from client: \" + clientMessage);\n\
    \            // 向客户端发送响应\n            output.println(\"Hello from server!\");\n\
    \            // 关闭服务器套字\n            serverSocket.close();\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n### 客户端\n\
    \n```java\nimport java.io.BufferedReader;\nimport java.io.IOException;\nimport\
    \ java.io.InputStreamReader;\nimport java.io.PrintWriter;\nimport java.net.Socket;\n\
    \npublic class Client {\n    public static void main(String[] args) {\n      \
    \  final String SERVER_IP = \"127.0.0.1\";\n        final int SERVER_PORT = 8081;\n\
    \        try {\n            // 连接到服务器\n            Socket socket = new Socket(SERVER_IP,\
    \ SERVER_PORT);\n            System.out.println(\"Connected to server\");\n  \
    \          // 设置输入和输出流\n            BufferedReader input = new BufferedReader(new\
    \ InputStreamReader(socket.getInputStream()));\n            PrintWriter output\
    \ = new PrintWriter(socket.getOutputStream(), true);\n            // 将数据发送到服务器\n\
    \            output.println(\"Hello from client!\");\n            // 接收并打印服务器的响应\n\
    \            String serverResponse = input.readLine();\n            System.out.println(\"\
    Received from server: \" + serverResponse);\n            // 关闭客户端套字\n        \
    \    socket.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n正如你所看到的，建立连接有多种方法，只要你理解正确编程套字和 `URL` 是该过程必不可少的部分即可。尽管这只是一个介绍，但它将为你进一步的学习提供基础知识。在接下来的练习中，你将使用所获得的所有知识来编写两个不同的网络，并在它们之间建立通信。\n\
    \n# 轮到你尝试了！\n\n利用你在本章中学到的知识，你的任务是在 Java 中创建一个基础的客户端-服务器聊天应用程序。你将获得指令和需要遵循的路径，书末还提供了练习的参考解决方案。\n\
    \n### 指令：\n\n1. **服务器实现：**\n   - 实现一个监听传入连接的服务器。\n   - 连接建立后，服务器应存储客户端的 `socket`\
    \ 并准备接收消息。\n   - 实现一个方法，将从一个客户端接收到的消息广播到所有连接的客户端。\n2. **客户端实现：**\n   - 实现一个连接到服务器的客户端。\n\
    \   - 允许用户在客户端侧输入消息。\n   - 将消息发送到服务器进行广播。\n3. **测试：**\n   - 启动服务器。\n   - 启动多个客户端。\n\
    \   - 允许客户端发送消息，并确保所有连接的客户端都能收到消息。\n\n你现在解锁了网络编程的力量，使你的应用程序能够跨机器、平台甚至跨全球进行通信！当我们移动到本书的最后一章时，我们将学习如何调试和测试你的代码，这是软件开发的最后一个阶段。在阅读其内容时，请记住考虑你目前为止学到的一切、你测试过的所有项目以及你遇到的异常。你会发现，大部分问题都可以在过程的最后阶段得到解决和捕获，这将帮助你为软件的发布和生产阶段做好准备。\n\
    \n# 第 12 章：调试与测试\n\n根据剑桥大学的一项研究，软件漏洞每年给经济造成 3120 亿美元的损失（剑桥 MBA 研究，2013 年）。想学习如何让自己和世界免于这笔开支吗？在本章中，你将学习编程过程的最后部分，即代码的测试和调试。你将看到\
    \ Java 中不同的调试工具和技术，并学习如何使用 `JUnit` 框架理解单元测试，以及如何编写有效的测试用例。如果你已经准备好开始这段旅程的最后部分，请继续读下去！我确定你会发现执行这些任务的不同方法会让你的生活变得简单得多。\n\
    \n## 调试简介\n\n程序中的 bug 是代码在编译和运行时发生的错误。这可能是由于不同的原因引起的，通常情况下，即使你对代码应用了 `try-catch`\
    \ 条件，也不会产生输出。寻找 bug 可能非常困难，特别是当我们谈论大量代码和细微差别时。如果你与一位资深开发者交流，你可能会听到他们花费了长时间才找到\
    \ bug 的故事。因此，理解用于调试和测试代码的各种工具至关重要：它将节省你大量的时间精力。\n\n## 使用调试工具和技术\n\n如果你使用 IDE 编写代码，你正在应用一种有助于调试代码的最佳实践，因为这些工具具有实现此功能的功能。例如，在\
    \ `Eclipse` 中，你能够添加断点和观察点，将代码拆分并部分运行。这将让你能够发现存在问题的代码块。`Eclipse` 还有一个观察和检查部分，允许你在调试时检查值，这是一个非常有用的功能，可以帮助你理解输出产生的原因（Java\
    \ 错误调试，2019 年）。\n\n如果使用 `IntelliJ` IDE，你也可以实施与 `Eclipse` 类似的工具。然而，如果你没有使用 IDE\
    \ 编写代码，Monus (2020) 建议了可以在计算机上下载并使用的强大 Java 代码调试工具，包含了用于这些目的软件以及其他在线或开源 IDE。它们包括：\n\
    \n* `Java Discovery Protocol`\n* `JDeveloper`\n* `NetBeans`\n* `Raygun 崩溃报告`\n\
    * `Rookout`\n* Java 调试器 (`jdb`)\n* `Visual Studio Code`\n\n## 使用 JUnit 框架进行单元测试\n\
    \n当我们谈论单元测试时，基准是一个名为 `JUnit` 的程序。在这个开源框架中，开发者可以运行自动化测试，并在图表和其他统计中显示结果，从而使代码更可靠、无\
    \ bug。通过测试代码“单元”或小段代码，你将能够将其拆分为段段，使测试过程更高效（Gaba, 2023）。\n\n## 编写测试用例\n\n"
- fmt: "\nRegardless of the way you are going to test your code, you must understand\
    \ how to write test cases that make this process feasible. When you create a test\
    \ case, it should ideally have \"test steps, test data, precondition, postcondition\
    \ developed for specific test scenarios to verify any requirement. The test case\
    \ includes specific variables or conditions, using which a testing engineer can\
    \ compare expected and actual results\" (Hamilton, 2023). Nonetheless, each test\
    \ you write should serve a specific purpose, which means it will depend on what\
    \ you are trying to identify. In the code below, you will find an example of a\
    \ code test with explanations of what needs to be done in each step.\n\n```java\n\
    import org.junit.jupiter.api.*;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
    \nimport static org.junit.jupiter.api.Assertions.assertThrows;\n\npublic class\
    \ MathUtilsTest {\n\n    private MathUtils mathUtils;\n\n    @BeforeEach\n   \
    \ void setUp() {\n        mathUtils = new MathUtils();\n    }\n\n    @Test\n \
    \   @DisplayName(\"Test Addition\")\n    void testAddition() {\n        assertEquals(4,\
    \ mathUtils.add(2, 2), \"Addition should work\");\n    }\n\n    @Test\n    @DisplayName(\"\
    Test Subtraction\")\n    void testSubtraction() {\n        assertEquals(2, mathUtils.subtract(4,\
    \ 2), \"Subtraction should work\");\n    }\n\n    @Test\n    @DisplayName(\"Test\
    \ Multiplication\")\n    void testMultiplication() {\n        assertEquals(6,\
    \ mathUtils.multiply(2, 3), \"Multiplication should work\");\n    }\n\n    @Test\n\
    \    @DisplayName(\"Test Division\")\n    void testDivision() {\n        assertEquals(3,\
    \ mathUtils.divide(9, 3), \"Division should work\");\n    }\n\n    @Test\n   \
    \ @DisplayName(\"Test Divide By Zero\")\n    void testDivideByZero() {\n     \
    \   ArithmeticException exception = assertThrows(ArithmeticException.class,\n\
    \            () -> mathUtils.divide(5, 0), \"Divide by zero should throw ArithmeticException\"\
    );\n        assertEquals(\"Cannot divide by zero\", exception.getMessage(), \"\
    Exception message should be correct\");\n    }\n\n    @AfterEach\n    void tearDown()\
    \ {\n        // Release any resources used for testing\n        mathUtils = null;\n\
    \    }\n}\n\nclass MathUtils {\n    int add(int a, int b) {\n        return a\
    \ + b;\n    }\n\n    int subtract(int a, int b) {\n        return a - b;\n   \
    \ }\n\n    int multiply(int a, int b) {\n        return a * b;\n    }\n\n    int\
    \ divide(int a, int b) {\n        if (b == 0) {\n            throw new ArithmeticException(\"\
    Cannot divide by zero\");\n        }\n        return a / b;\n    }\n}\n```\n\n\
    Whenever you are going to write test cases, you must remember to document what\
    \ you are doing and use unique techniques for each case. The code should also\
    \ be 100% covered and the end user must be kept in mind, after all, they will\
    \ be the ones using the code. Finally, you should never assume the code is understandable\
    \ or correct; creating code that is reusable and has undergone peer reviews will\
    \ be essential to ensure optimal performance and efficient programs (Hamilton,\
    \ 2023).\n\n## LET'S TEST YOUR KNOWLEDGE!\n\n1. What is the purpose of a breakpoint\
    \ in a debugger?\na. to halt the execution of the program at a specific point\n\
    b. to optimize the program execution\nc. to print debug statements\nd. to speed\
    \ up the program\ne. to create a new variable\n\n2. Which of the following is\
    \ a benefit of using a debugger during development?\na. It helps write code faster\n\
    b. It allows real-time collaboration with teammates\nc. It aids in identifying\
    \ and fixing bugs in the code\nd. It automates code documentation\ne. It generates\
    \ random test data\n\n3. What does JUnit provide for Java developers?\na. integrated\
    \ development environment (IDE)\nb. testing framework for unit tests\nc. debugging\
    \ tools\nd. code versioning system\ne. graphic design tools\n\n4. In JUnit, what\
    \ annotation is used to denote a method as a test method?\na. @Test\nb. @TestMethod\n\
    c. @Unit\nd. @TestCase\ne. @RunTest\n\n5. What is the purpose of the JUnit `assertEquals`\
    \ method?\na. to check if two objects are the same instance\nb. to verify that\
    \ a condition is true\nc. to check if the actual value is equal to the expected\
    \ value\nd. to compare objects for ordering\ne. to calculate the square root of\
    \ a number\n\n6. What is the role of a mock object in unit testing?\na. to simulate\
    \ the behavior of a real object\nb. to create graphical user interfaces\nc. to\
    \ generate random test data\nd. to secure the test environment\ne. to define new\
    \ data types\n\n7. Which JUnit annotation is used for running code before each\
    \ test method?\na. @BeforeEach\nb. @BeforeTest\nc. @Setup\nd. @Before\ne. @Initialize\n\
    \n8. What is the purpose of the JUnit `@Ignore` annotation?\na. to mark a test\
    \ method as not to be executed\nb. to hide the test code from other developers\n\
    c. to increase the priority of a test method\nd. to skip a test in case of an\
    \ assertion failure\ne. to generate test reports\n\n9. What is a common reason\
    \ for a test case to fail in JUnit?\na. lack of comments in the code\nb. insufficient\
    \ test coverage\nc. incorrect assertions or expectations\nd. excessive code documentation\n\
    e. unused variables\n\n10. How can a developer debug a Java program in an IDE\
    \ like IntelliJ IDEA?\na. by manually adding print statements\nb. by using breakpoints\
    \ and stepping through the code\nc. by relying solely on error messages\nd. by\
    \ writing a separate debugging script\n\n## THE GATEWAY TO PROGRAMMING\n\nYour\
    \ coding journey is just beginning, and you have an exciting future ahead. Before\
    \ you go, take a moment to help someone else on their journey. Simply by sharing\
    \ your honest opinion of this book and a little about your experience, you’ll\
    \ help other readers find the gateway they’re looking for.\n\nCONCLUSION\n\nYou\
    \ have now unleashed the full power of Java and are ready to start exploring.\
    \ With the techniques you have learned in this book, you will be able to explore\
    \ your way from the simplest types of programs to the most complex, such as integrating\
