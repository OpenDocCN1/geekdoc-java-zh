    Enter a number: 6\nEnter another number: 0\nError: Division by zero is not allowed.\n\
    Scanner closed in the finally block.\n\nIn this example, the `finally` block is\
    \ added at the end, and it closes the `scanner` and prints a message indicating\
    \ that the scanner is closed. The code inside the `finally` block is guaranteed\
    \ to execute, regardless of whether an exception occurs in the `try` block or\
    \ not.\n"
  raw: 'Knowing how to keep your program running even when there are errors is an
    essential skill for all developers. In this chapter, we are going to highlight
    the importance of handling exceptions in Java. You will learn how to effectively
    understand, catch, and manage these errors, ensuring that the program you have
    created is running according to plan in its execution.


    Additionally, you will also learn how to apply the try-catch and the finally blocks
    in your code to help you handle errors and optimize production. Get ready to understand
    what expectations are, how to solve them, and make your program''s flow the best
    it can be. You will certainly be impressed and impress others as well.


    ## UNDERSTANDING EXCEPTIONS


    When an exception happens, we are talking about an undesired event happening during
    the execution of the program. Although this is normal, it is important to be aware
    of them so that your program''s flow is not affected. The exception can happen
    in a method or an object, and the main exceptions a developer can deal with are:


    *   code errors


    *   device failure


    *   invalid user input


    *   loss of network connection


    *   opening an unavailable file


    *   physical limitations (out-of-disk memory) (GeeksforGeeks, 2023a)


    The main difference between an event being named an exception or an error is how
    it can be solved. Exceptions can usually be solved by modifying something that
    is affecting the process. On the other hand, when you have an error, these usually
    cannot help the code be recovered, such as "Java virtual machine (JVM) running
    out of memory, memory leaks, stack overflow errors, library incompatibility, infinite
    recursion, [and so on]. Errors are usually beyond the control of the programmer,
    and we should not try to handle errors" (GeeksforGeeks, 2023a).


    Regardless of whether you are using an IDE or not, usually, the error in the code
    will be shown, and you will be able to identify what is wrong. Sometimes, it might
    just be a semicolon missing or another matter that is easily managed by the developer.
    To help you solve different exceptions, there are a few ways enabled by the language,
    such as applying the try-and-catch or using the finally statement. You will learn
    about both of these in this chapter.


    ## HANDLING EXCEPTIONS WITH TRY AND CATCH


    Coding can be a complex process that might demand you create a way to handle an
    exception in case the request you are asking to be carried out generates an error.
    For example, if you are trying to divide a number by zero, it would lead to an
    error because this is not possible. Nevertheless, if you are creating a calculator,
    even if the operation is not allowed, you can still request it to be done.


    For these cases, you will use the try-and-catch statements: The try statement
    will be used to tell the program what it is that you want to test, and the catch
    statement will define the block of code you want to execute. Both of these come
    in pairs, though you will always have one try statement but one or more catch
    blocks. This is the simplest way to handle an exception when coding in Java.


    Here is an example of how a code would work when dividing by zero with the try-and-catch
    exception:


    import java.util.Scanner;


    public class ExceptionHandlingExample {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    try {


    // Get input from the user


    System.out.print("Enter a number: ");


    int numerator = scanner.nextInt();


    System.out.print("Enter another number: ");


    int denominator = scanner.nextInt();


    // Perform division


    int result = divideNumbers(numerator, denominator);


    // Display the result


    System.out.println("Result: " + result);


    } catch (ArithmeticException e) {


    // Handle division by zero exception


    System.out.println("Error: Division by zero is not allowed.");


    } catch (Exception e) {


    // Handle other exceptions


    System.out.println("An error occurred: " + e.getMessage());


    } finally {


    // Close the scanner in the finally block to ensure it''s always executed


    scanner.close();


    }


    }


    private static int divideNumbers(int numerator, int denominator) {


    // Attempt to perform division


    return numerator / denominator;


    }


    }


    The output, in this case, would be the following:


    Execution without the exception


    Enter a number: 9


    Enter another number: 3


    Result: 3


    Execution with the exception


    Enter a number: 6


    Enter another number: 0


    Error: Division by zero is not allowed.


    You might have noticed that in the code that was shown above, there was a keyword
    that we have not used yet: finally. In this case, finally is not necessary, but
    adding it will help you prevent more exceptions in your code. Additionally, you
    can use the try and finally statements together instead of catch, for example.
    But you might be wondering how the finally block works and when it should be applied.
    Let''s move on to the next section and see how you can use it and the different
    application possibilities.


    ## THE FINALLY BLOCK


    As you already know, the finally block can be used without the catch statement.
    This block should be used when you want the code to run, regardless of whether
    there is an exception or not. In an example similar to what we have seen before,
    the finally block will be used to close the scanner once the code has been run.
    The code for this example, so you can see its differences, is the following:


    import java.util.Scanner;


    public class ExceptionHandlingExample {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    try {


    // Get input from the user


    System.out.print("Enter a number: ");


    int numerator = scanner.nextInt();


    System.out.print("Enter another number: ");


    int denominator = scanner.nextInt();


    // Perform division


    int result = divideNumbers(numerator, denominator);


    // Display the result


    System.out.println("Result: " + result);


    } catch (ArithmeticException e) {


    // Handle division by zero exception


    System.out.println("Error: Division by zero is not allowed.");


    } catch (Exception e) {


    // Handle other exceptions


    System.out.println("An error occurred: " + e.getMessage());


    } finally {


    // Close the scanner in the finally block to ensure it''s always executed


    scanner.close();


    System.out.println("Scanner closed in the finally block.");


    }


    }


    private static int divideNumbers(int numerator, int denominator) {


    // Attempt to perform division


    return numerator / denominator;


    }


    }


    Output:


    Enter a number: 6


    Enter another number: 0


    Error: Division by zero is not allowed.


    Scanner closed in the finally block.


    In this example, the finally block is added at the end, and it closes the scanner
    and prints a message indicating that the scanner is closed. The code inside the
    finally block is guaranteed to execute, regardless of whether an exception occurs
    in the try block or not.


    As you might imagine, the finally block is not only good for handling exceptions
    but also for helping you clean up the program. For example, if you were to mistype
    a character after a curly bracket or use a character that is not allowed, your
    code would run anyway, making it efficient to clean up the code. The Java official
    documentation even mentions that "it allows the programmer to avoid having cleanup
    code accidentally bypassed by a return, continue, or break. Putting cleanup code
    in a finally block is always a good practice, even when no exceptions are anticipated"
    (The Finally Block, n.d.).


    ## THROWING EXCEPTIONS


    "All methods use the throw statement to throw an exception. The throw statement
    requires a single argument: a throwable object. Throwable objects are instances
    of any subclass of the Throwable class" (How to Throw Exceptions, n.d.). The Throwable
    class can be used both for errors and exceptions, although for errors, they might
    not be of use. However, when you have an exception class, it will catch the objects
    or methods that have an error, and they will indicate the different errors that
    can happen in the code.'
