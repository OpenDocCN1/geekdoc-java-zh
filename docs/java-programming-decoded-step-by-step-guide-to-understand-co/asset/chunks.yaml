  raw: 'Although this is an easy and efficient way to make your code work, you must
    remember that if you use it too much or apply too many statements, your program
    might be slower. It will also make the process harder to edit if necessary since
    each change will deal with several variables. For this reason, another conditional
    keyword can be used in Java that will allow you to optimize the coding and make
    it faster, replacing the different if-else statements. This conditional is known
    as the switch statement.


    Let''s see how the switch statement would be applied in the previous example:


    public class Main{


    public static void main(String []args)


    {


    int day = 3;


    switch (day){


    case 1:


    System.out.println("Monday");


    break;


    case 2:


    System.out.println("Tuesday");


    break;


    case 3:


    System.out.println("Wednesday");


    break;


    default:


    System.out.println("Other days of the week");


    }


    }


    }


    In this case, as you can see, we have replaced the if-else statements with "cases"
    and "breaks," which enables the program to make the decision likewise. The program
    will run all the decisions until the end is reached or the break statement is
    identified. In this case, you will use one statement for different decisions (look
    at where the {} open and close), making writing, editing, and testing the code
    easier. On the other hand, the logic of the code will not be tested, as would
    happen with if-else.


    The other difference you will see is that there is a "default" keyword at the
    end. This value should be applied if any conditions do not meet the criteria.
    This means that if you were to input numbers 1–3, you would have the same input
    as you have seen in the previous section. However, if the number differed from
    these, the output would be Other days of the week.


    While these statements will help you control the program''s logic, can you imagine
    what would happen if you needed to create a countdown program? How many lines
    of code would you need to write for every output number that should be shown on
    the screen? If we were talking about 10, that might not be so hard, but what if
    we were using a timer to count down how much time a person has left to perform
    a certain task? That would certainly take many code lines and time.


    Nonetheless, you should not worry since Java has a solution for avoiding this.
    We will see these in the next section, and they are called looping structures.
    When you write these statements, they will enable the program to carry out the
    same task for a certain number of iterations or until the condition is false.
    Interested? I can bet you are! Let''s take a look!


    ## LOOPING STRUCTURES


    When coding in Java, you have three loops that can be applied to your program:
    for, while, and do-while statements. These enable the developer to command the
    program to perform several repetitions (iterations) until it finds a condition
    that makes the statement false or according to the determined number requested
    and identified in the code. This section will explore each type of loop, the best
    time to apply them, and the syntax that should be used according to each situation.


    For Loop


    The first loop we will look at is the for loop. In this loop, you will tell the
    program exactly the parameters you want it to run. Due to this characteristic,
    most programmers use the for loop when they have a certain number of iterations
    they want the program to carry out. In this case, you will declare the variable
    and the condition that you will make it follow.


    Suppose you are creating a timer that needs to count to five for a test to start.
    For this, you will need to create a program using a for loop to show the numbers
    on the screen. In this case, you would use the following code:


    public class Main{


    public static void main(String []args)


    {


    for (int i = 1; i <= 5; i++) {


    System.out.println(i);


    }


    }


    }


    If you wrote this code and executed it, you would see that the output would be


    1


    2


    3


    4


    5


    since you have requested that the program count from one to five, incrementing
    one (++) every time. If you were to replace these numbers with 0 and 10, your
    answer would be a list of numbers from 0 to 10\. If, on the other hand, you wanted
    the list to count every two numbers, then the information would be changed from
    i++ to i+=2, or i+=3 for three, and so on.


    You should know that the for loop can also decrease the numbers as if you were
    performing a countdown. In this case, the syntax, instead of being int i = 1;
    i <= 5; i++, it would be int i = 10; i >= 0; i--, for which the output would be
    a list of numbers decreasing from 10 to 0, one by one. If you were to decrease
    them two by two, you would also change from i-- to i-=2, or i-=3 for three, and
    so on. An important thing to note, in this case, is that you will only be able
    to use this loop when using the data type "int."


    But what if the number of iterations I want to add is not defined? That is a very
    good question! In this case, we would use the while loop, which is the next loop
    we will look at. However, before we do this, I want you to test the for loop code
    in your IDE and see if you understand it. Try to paste it with a few different
    values, use some variations, and print the results to ensure you know what you
    have. Once you are done, move on to the next section.


    While Loop


    The while loop, unlike the for loop, should be used when you don''t have a preestablished
    number of iterations you need to carry out. This is because it will analyze the
    code as a boolean function and process it until it identifies a false example.
    While in the example, we will see we are talking about small numbers, you should
    consider that this statement will be used when you must carry out hundreds or
    even thousands of iterations.


    Suppose you have to ask the program to print a statement, such as While loop until
    it meets a certain condition. In this case, we could say that it should print
    this statement until it identifies that the number of prints is less than or equal
    to 5\. Once again, we are using small numbers, but the application for this loop
    usually considers more significant numbers. In this case, the code would be the
    following:


    public class Main{


    public static void main(String []args)


    {


    int i = 1;


    while (i <= 5) {


    System.out.println("While loop");


    i++;


    }


    }


    }


    If you wrote and executed this code, you would see that the output is:


    While loop


    While loop


    While loop


    While loop


    While loop


    The program, in this case, identified that it should print the statement "While
    loop" until the time was less than or equal to 5, and therefore, we have the words
    printed five times. Since it had reached five, the program identified that it
    was now "false," and the iterations stopped. Can you see how easy this would make
    it to perform several iterations without writing so many code links?


    As we saw in the for loop example, you will see that it is also possible to change
    the different iterations from i++ to i+=2, or i+=3 for three, and so on. The same
    applies to decreasing the number of iterations. If we had placed i+=2, for example,
    in the code, we would have While loop printed three times. Once again, this while
    loop can only be used with the int data type for both increasing and decreasing
    quantities.


    But what if I want to perform an iteration on a list or a group of statements
    simultaneously? Is this possible? I am glad you asked because it certainly is!
    When you want to carry out a loop that will execute different statements, then
    you will use the do-while loop. Let''s take a look at its characteristics and
    applications.


    Do-While Loop


    Suppose you are working with a code and, despite what the code block says, you
    want it to run at least once. In this case, you would apply the do-while loop
    since it will allow you to run a written block of statements at least once. If
    the conditions are true, it will continue until the boolean statement''s "false"
    affirmation is found.'
