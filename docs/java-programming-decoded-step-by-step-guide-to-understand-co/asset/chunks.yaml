  trans: "\n有时，我们创建的程序需要发送给某人或存储。当这种情况发生时，开发者需要创建替代方案以确保程序高效运行且不占用过多内存。这就是序列化（serialization）的用处。它用于将对象的状态转换为字节流，使其更容易被传输。正如你想象的，当这种情况发生时，文件将变得不可读，因为它将由许多“0”和“1”组成；因此，需要将其转换回来，即反序列化（deserialized），这也可以同一个包完成。\n\
