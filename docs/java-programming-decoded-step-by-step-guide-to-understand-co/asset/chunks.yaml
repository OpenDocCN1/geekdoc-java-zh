    # 第 2 章：变量与数据类型


    现在你已经知道了 Java 语法以及类、方法和对象的应用，是时候仔细观察其他 Java 组件了。这些组件将帮助你编写代码，并确定需要做什么工作以及需要考虑的格式。由于这些原因，在本章中，你将学习
    Java 中的变量、常量、原始数据类型和操作。


    但你并没有认为你只会看而不做，对吧？嗯，当然不是。当你学习这些中的每一项时，你也将看到它们是如何运作的，以及如何（例如）在数据类型之间进行转换。在章节结束时，你将学习如何处理字符串、执行强制转换以及初始化变量。为了确保你已经理解了内容，你将在末尾进行一些练习，练习你的新技能并探索不同的编码可能性。


    ## 变量与常量


    你首先需要理解的是，与其他语言一样，Java 也有可以被归类为变量或常量的项。在这种情况下，当你有一个变量时，信息可以根据它在程序中的用途而改变。然而，为了实现这一点，你必须声明它，例如：


    ```

    data_type variable_name;

    int x;

    ```


    另一方面，当你有一个常量时，正如其名所示，值在整个程序执行过程中将保持相同。就像变量一样，你需要“告诉”程序你所采用的值是一个常量，以便它通过使用单词 `"final"`
    识别出在整个代码过程中不会发生变化。这是声明常量的语法：


    ```

    final int X = z;

    ```


    正如你可能从上述代码中注意到的，变量中声明的 `"x"` 是小写的，而常量中的是大大写的。这非常重要，因为正如你从上一章记得的，Java 会考虑代码中使用的字母大小写之间的差异。在这种情况下，在声明常量时，Java
    规范规定在声明常量时，需要使用全大写，如果它由多个单词组成，你需要在它们之间使用下划线。


    虽然 Java 只有一种声明常量的方法，但对于变量来说并非如此，因为该语言有三种不同的变量类型。它们是：


    *   **类变量**，与类相关，通常使用所用类的 `static` 关键字进行声明。换句话说，这个变量将定义编写该特定类时的整个代码块。当使用 `static`
    单词时，意味着在整个程序中，该特定变量只有一个副本，并且它不会改变。在这种情况下，变量并不一定需要声明。它们将自动引用默认值，我们将在下一节讨论它。

    *   **实例变量**是非静态值，可以在你编写代码时发生变化。由于它们是可变的，你不应该在前面添加 `static` 术语。在这种情况下，为了容易记住实例变量是什么，你应该根据其所处的情况考虑其特征（或值）。这些变量声明在类内部、方法外部。你可以在声明实例变量之前使用
    `"public"` 或 `"private"` 关键字来定义其可见性。

    *   **局部变量**正如其名所示，是赋予程序中特定位置的状态。在这种情况下，它们将以简单的语法 `variable = value` 使用，无需使用任何特定的关键字。由于它们受限于特定位置，它们将仅引用代码的该部分而不会在其他地方使用。它们通常声明在方法内部，一旦使用就会被程序销毁。


    这些是开发者为声明的对象编码和赋予状态的不同方式。

