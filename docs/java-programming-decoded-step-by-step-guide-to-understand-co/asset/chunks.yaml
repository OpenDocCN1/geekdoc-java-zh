    \ Java 代码时的作用和应用。\n\n## 理解方法参数和返回类型\n\n假设我们回到酒店的例子。每个人都有被分配一项任务（方法），并在这些任务中，他们需要遵循规则和指南。这些就是\
    \ `Java` 方法的参数。如果你要求 `Java` 执行倒计时，你需要指定它是通过从原始数字中减少一、二或任何其他数量来实现的。如果你编写程序让它增加或减少音量，它必须能够根据参数理解“增加一定音调的音量”或“减少音量”的命令。\n\
    \n然而，如果你要编写让软件理解“增加”和“减少”音量，或者它应该“按一定音调增加或减少”，情况就完全不同了。就像在酒店里，前台可能处理来自散客的预订，而宾客服务部处理电话订单一样，准确指定你想让它执行的操作是非常重要的；因此，它提供的可能性越多越好。假设酒店的宾客服务部没有人接听并并预订，这意味着任务应该被定向到其他地方，以便个人预订房间。在我们音量分析的代码中，它看起来像这样：\n\
    \n```java\npublic class Main {\n    // 使用当前音量声明变量\n    private static int currentVolume\
    \ = 5;\n\n    // 声明主方法\n    public static void main(String[] args) {\n       \
    \ System.out.println(\" Current volume: \" + currentVolume);\n        // 建立方法调用（volume）和参数（圆括号内部）\n\
    \        volume(\"increase\", 4);\n        System.out.println(\" Current volume:\
    \ \" + currentVolume);\n        // 建立方法调用（volume）和参数（圆括号内部）\n        volume(\"\
    decrease\", 2);\n        System.out.println(\" Current volume: \" + currentVolume);\n\
    \    }\n\n    // 声明 Volume 方法\n    public static void volume(String action, int\
    \ quantity){\n        // 使用 if-else 语句建立你想让执行的操作\n        if (\"increase\".equals(action)){\n\
    \            currentVolume = currentVolume + quantity;\n        }else{\n     \
    \       currentVolume = currentVolume - quantity;\n        }\n    }\n}\n```\n\n\
    在这种情况下，你没有返回值，因为你正在处理一个 `void` 方法，并且为当前音量建立了固定参数，其值为 `5`。然而，在 `Java` 中，也可以让方法返回一个操作，为了实现这一点，你需要使用\
    \ `return` 关键字。在这种情况下，它将放置在函数声明之后，告诉系统你想要返回什么。\n\n### 使用返回值\n\n假设你正在编写一个程序，想要计算两个数字之和。在这种情况下，你需要使用支持此功能的数据类型。例如，我们不能使用\
    \ `string` 或 `boolean`，因为它们不会返回数字。另一方面，可以使用 `double`、`float`、`long` 和 `int`。虽然在上一个示例中你已经建立了变量，但在我们即将看到的使用\
    \ `return` 关键字的情况下，你可以确定“泛型”参数，这会使代码更具通用性。这里是一个示例：\n\n```java\npublic class ReturnExample\
