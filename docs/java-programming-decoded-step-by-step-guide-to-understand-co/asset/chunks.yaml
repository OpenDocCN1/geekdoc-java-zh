- fmt: "\nIn this example, you are using the `File.write` to write binary files and\
    \ the `Files.readAllBytes` to read the content. In this example, as you can see,\
    \ the NIO helps you by providing an efficient way to handle these binary files.\
    \ The end answer will usually be the same as if using the `java.io`, but you will\
    \ see that the `java.nio` provides better tools and a more versatile environment\
    \ for dealing with bytes.\n\nYou now have the necessary knowledge to start reading,\
    \ writing, and working with files in your Java program. This will help you create\
    \ more complex programs and work with different files. In the exercise you are\
    \ about to see, you will need to put all the knowledge you have obtained into\
    \ action. Are you ready to try working with your own files in Java?\n\n## YOUR\
    \ TURN TO TRY!\n\nIn the exercise for this section, you will need to create programs\
    \ that perform basic file operations. You will need to create I/O and NIO programs\
    \ to carry out the necessary actions. As usual, the answer to the exercise is\
    \ available at the end of the book.\n\n### Task 1: Basic File Operations\n\n1.\
    \ Create a file: Write a Java program to create a new text file named `\"file_io_challenge.txt.\"\
    `.\n2. Write to the file: Add the text `\"Hello, File I/O Challenge!\"` to the\
    \ file.\n3. Read from the file: Read the content from the file and print it to\
    \ the console.\n4. Delete the file: Delete the file you created.\n\n### Task 2:\
    \ Object Serialization\n\n1. Create an object: Design a simple Java class (such\
    \ as `\"Student\"` with fields like `name`, `age`, and `grade`).\n2. Serialize\
    \ object: Write code to serialize an instance of the class and save it to a file\
    \ named `\"serialized_object.da\"`.\n3. Deserialize object: Read from the serialized\
    \ file and deserialize the object.\n4. Display object data: Print the details\
    \ of the deserialized object.\n\n### Bonus: Combine Both Tasks\n\n1. Write multiple\
    \ objects: Extend the object serialization task to write multiple instances of\
    \ the class to the same file.\n2. Read and display all objects: Modify the deserialization\
    \ code to read all objects from the file and display their details.\n\nWith this\
    \ newfound knowledge of File I/O and object serialization, you are ready to take\
    \ on even more sophisticated tasks in Java programming. In the next chapter, we'll\
    \ venture into one of the most flexible and used functions of Java: application\
    \ programming interfaces (APIs)! You will see that despite having all the building\
    \ blocks and information on the language, the API will help you speed up the development\
    \ process, especially for specific tasks carried out by developers. Shall we continue?\n\
    \n# CHAPTER 9: INTRODUCTION TO JAVA APIS\n\nA developer must know the basic components\
    \ of the code, but there is one thing they must learn to make their process more\
    \ efficient: APIs, which are a part of the `JDK` and are preintegrated Java package\
    \ components that will help establish the communication between the program and\
    \ software platforms and components. In this chapter, we will focus on understanding\
    \ and working with Java APIs, including the `String`, `Date` and Time, `Math`\
    \ and `Random` APIs, and the Java Collections Framework.\n\n## OVERVIEW OF JAVA\
    \ APIS\n\nAn API facilitates code since it already comes with the classes, interfaces,\
    \ and user interfaces the developer will need for a certain purpose. As you will\
    \ see in this section, there are different APIs the developer can use according\
    \ to their specific needs. In addition, they can use APIs to integrate applications\
    \ and developed software with websites, apps, and even the possibility to use\
    \ real-time information. These are usually third-party services that can help\
    \ turn complex problems into simple code lines and build programs that make the\
    \ developer's life easier.\n\nWhen talking about APIs, the most commonly used\
    \ architecture style is the `REST API`, together with the `Web API`, `JAX-RS`,\
    \ `Facebook.4J`, and `Twitter.4J`. These APIs can be private, designed by a company\
    \ for a specific purpose; public, free to access and use; composite, developed\
    \ by aggregating different APIs; partner, offered by companies to other businesses;\
    \ and the Web Java API, accessed by the internet for browser-based applications\
    \ (Java API, 2023). Since explaining the different Java APIs would require almost\
    \ a full new book, in this section, we will see some APIs that perform different\
    \ functions. You will see they provide an efficient and straightforward way to\
    \ code with an all-in-one approach.\n\n## WORKING WITH THE STRING API\n\nAs you\
    \ have learned, strings in Java are not mutable; therefore, every time you need\
    \ to change or manage it, a new string will be created. When you have the `StringApi`,\
    \ you will be able to work with the string you created, including determining\
    \ its length, concatenating, and other actions you might need. In the example\
    \ we are about to see, we are going to use the `\"Hello, World!\"` string and\
    \ see the different actions that can be carried out.\n\n```java\nimport java.util.Arrays;\n\
    \npublic class StringApiExample {\n\n    public static void main(String[] args)\
    \ {\n        // Creating a String\n        String str1 = \"Hello, World!\";\n\n\
    \        // 1. length(): Returns the length of the string.\n        int length\
    \ = str1.length();\n        System.out.println(\"1. Length: \" + length);\n\n\
    \        // 2. charAt(int index): Returns the character at the specified index.\n\
    \        char charAtIndex = str1.charAt(7);\n        System.out.println(\"2. Character\
    \ at index 7: \" + charAtIndex);\n\n        // 3. substring(int beginIndex): Returns\
    \ a substring from the specified index to the end.\n        String substring1\
    \ = str1.substring(7);\n        System.out.println(\"3. Substring from index 7:\
    \ \" + substring1);\n\n        // 4. substring(int beginIndex, int endIndex):\
    \ Returns a substring within the specified range.\n        String substring2 =\
    \ str1.substring(7, 12);\n        System.out.println(\"4. Substring from index\
    \ 7 to 12: \" + substring2);\n\n        // 5. concat(String str): Concatenates\
    \ the specified string to the end.\n        String concatenated = str1.concat(\"\
    \ Welcome!\");\n        System.out.println(\"5. Concatenated String: \" + concatenated);\n\
    \n        // 6. equals(Object obj): Compares the string with the specified object.\n\
    \        boolean isEqual = str1.equals(\"Hello, World!\");\n        System.out.println(\"\
    6. String is equal to 'Hello, World!': \" + isEqual);\n\n        // 7. equalsIgnoreCase(String\
    \ anotherString): Case-insensitive comparison.\n        boolean isEqualIgnoreCase\
    \ = str1.equalsIgnoreCase(\"hello, world!\");\n        System.out.println(\"7.\
    \ String is equal to 'hello, world!' (ignore case): \" + isEqualIgnoreCase);\n\
    \n        // 8. indexOf(String str): Returns the index of the first occurrence\
