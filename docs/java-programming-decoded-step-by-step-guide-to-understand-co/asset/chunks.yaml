  trans: "\n了解在发生错误时如何保持程序运行是所有开发人员的一项基本技能。在本章中，我们将重点介绍在 Java 中处理异常的重要性。你将学习如何有效地理解、捕获和管理这些错误，以确保你创建的程序在执行过程中按照计划运行。\n\
    \n此外，你还将学习如何在代码中应用 `try-catch` 和 `finally` 块，以帮助你处理错误并优化生产环境。准备好理解什么是异常、如何解决它们，并让你的程序流程达到最佳状态。你一定会会被震撼，也会给他人留下深刻印象。\n\
    \n# 异常（EXCEPT）\n\n当异常发生时，我们谈论的是程序执行过程中发生的非预期事件。虽然这是正常现象，但意识到它们是非常重要的，以确保你的程序流程不受影响。异常可能发生在方法或对象中，开发者可以处理的主要异常有：\n\
    \n* 代码错误\n* 设备故障\n* 无效的用户输入\n* 网络连接丢失\n* 打开不可用的文件\n* 物理限制（磁盘内存不足）（GeeksforGeeks,\
    \ 2023a）\n\n一个事件被命名为“异常”（exception）还是“错误”（error）之间的主要区别在于它是如何被解决。异常通常可以通过修改影响过程的某些内容来解决。另一方面，当你遇到错误时，这些错误通常无法帮助代码恢复，例如“Java\
    \ 虚拟机（JVM）内存耗尽、内存泄漏、栈溢出错误、库不兼容、无限递归等。错误通常超出了程序员的控制范围，我们不应该尝试处理错误”（GeeksforGeeks,\
    \ 2023a）。\n\n无论你是否使用 IDE，通常代码中的错误都会被显示出来，你将能够识别出问题所在。有时，可能只是缺少了一个分号或其他开发者可以轻松管理的事务。为了帮助你解决不同的异常，语言提供了几种方法，例如应用\
    \ `try-and-catch` 或使用 `finally` 语句。你将在本章中学习到这两种者。\n\n# 使用 TRY AND CATCH 处理异常\n\
    \n编码可能是一个复杂的过程，可能要求你创建一种处理异常的方法，以防你请求执行的操作产生错误。例如，如果你尝试将一个数字除以零，这将导致错误，因为这是不可能的。然而，如果你正在创建一个计算器，即使操作不被允许，你仍然可以请求执行它。\n\
    \n对于这些情况，你将使用 `try-and-catch` 语句：`try` 语句将用于告诉程序你想测试的内容，而 `catch` 语句将定义你想要执行的代码块。这两者都是成对出现，虽然你始终有一个\
    \ `try` 语句，但可以有一个或多个 `catch` 块。这是在 Java 中编码时处理异常的最简单方法。\n\n以下是一个使用 `try-and-catch`\
    \ 异常进行除以零时代码的工作示例：\n\n```java\nimport java.util.Scanner;\n\npublic class ExceptionHandlingExample\
    \ {\n\n    public static void main(String[] args) {\n        Scanner scanner =\
    \ new Scanner(System.in);\n        try {\n            // Get input from the user\n\
    \            System.out.print(\"Enter a number: \");\n            int numerator\
    \ = scanner.nextInt();\n            System.out.print(\"Enter another number: \"\
    );\n            int denominator = scanner.nextInt();\n            // Perform division\n\
    \            int result = divideNumbers(numerator, denominator);\n           \
    \ // Display the result\n            System.out.println(\"Result: \" + result);\n\
    \        } catch (ArithmeticException e) {\n            // Handle division by\
    \ zero exception\n            System.out.println(\"Error: Division by zero is\
    \ not allowed.\");\n        } catch (Exception e) {\n            // Handle other\
    \ exceptions\n            System.out.println(\"An error occurred: \" + e.getMessage());\n\
    \        } finally {\n            // Close the scanner in the finally block to\
    \ ensure it's always executed\n            scanner.close();\n        }\n    }\n\
    \n    private static int divideNumbers(int numerator, int denominator) {\n   \
    \     // Attempt to perform division\n        return numerator / denominator;\n\
    \    }\n}\n```\n\n在这种情况下，输出将是：\n\n无异常的执行\nEnter a number: 9\nEnter another number:\
    \ 3\nResult: 3\n\n带异常的执行\nEnter a number: 6\nEnter another number: 0\nError: Division\
    \ by zero is not allowed.\n\n你可能已经注意到在上面显示的代码中，有一个我们还没有使用过的关键字：`finally`。在这种情况下，`finally`\
    \ 不是必须的，但添加它将帮助你防止代码中出现更多异常。此外，你可以一起使用 `try` 和 `finally` 语句而不是 `catch`，例如。但你可能想知道\
    \ `finally` 块是如何工作的，以及何时应该应用它。让我们进入下一节，看看你可以如何使用它以及不同的应用可能性。\n\n# FINALLY 块\n\n\
    正如你所知的，`finally` 块可以在没有 `catch` 语句的情况下使用。当你想要让代码运行，无论是否发生异常，都应该使用此块。在与之前看到的类似的示例中，`finally`\
    \ 块将在代码运行后用于关闭 `scanner`。此示例的代码如下，你可以看到它的差异：\n\n```java\nimport java.util.Scanner;\n\
    \npublic class ExceptionHandlingExample {\n\n    public static void main(String[]\
    \ args) {\n        Scanner scanner = new Scanner(System.in);\n        try {\n\
    \            // Get input from the user\n            System.out.print(\"Enter\
    \ a number: \");\n            int numerator = scanner.nextInt();\n           \
    \ System.out.print(\"Enter another number: \");\n            int denominator =\
    \ scanner.nextInt();\n            // Perform division\n            int result\
    \ = divideNumbers(numerator, denominator);\n            // Display the result\n\
    \            System.out.println(\"Result: \" + result);\n        } catch (ArithmeticException\
    \ e) {\n            // Handle division by zero exception\n            System.out.println(\"\
    Error: Division by zero is not allowed.\");\n        } catch (Exception e) {\n\
    \            // Handle other exceptions\n            System.out.println(\"An error\
    \ occurred: \" + e.getMessage());\n        } finally {\n            // Close the\
    \ scanner in the finally block to ensure it's always executed\n            scanner.close();\n\
    \            System.out.println(\"Scanner closed in the finally block.\");\n \
    \       }\n    }\n\n    private static int divideNumbers(int numerator, int denominator)\
    \ {\n        // Attempt to perform division\n        return numerator / denominator;\n\
    \    }\n}\n```\n\n输出：\nEnter a number: 6\nEnter another number: 0\nError: Division\
    \ by zero is not allowed.\nScanner closed in the finally block.\n\n在这个示例中，`finally`\
    \ 块被添加在最后，它关闭 `scanner` 并打印一条指示器已关闭的消息。无论 `try` 块中是否发生异常，`finally` 块中的代码都保证执行。\n"
