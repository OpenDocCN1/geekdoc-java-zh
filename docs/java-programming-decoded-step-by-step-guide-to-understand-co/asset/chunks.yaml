    Files.readAllBytes to read the content. In this example, as you can see, the NIO
    helps you by providing an efficient way to handle these binary files. The end
    answer will usually be the same as if using the java.io, but you will see that
    the java.nio provides better tools and a more versatile environment for dealing
    with bytes.


    You now have the necessary knowledge to start reading, writing, and working with
    files in your Java program. This will help you create more complex programs and
    work with different files. In the exercise you are about to see, you will need
    to put all the knowledge you have obtained into action. Are you ready to try working
    with your own files in Java?


    ## YOUR TURN TO TRY!


    In the exercise for this section, you will need to create programs that perform
    basic file operations. You will need to create I/O and NIO programs to carry out
    the ncessary actions. As usual, the answer to the exercise is available at the
    end of the book.


    Task 1: Basic File Operations


    1.  Create a file: Write a Java program to create a new text file named "file_io_challenge.txt."


    2.  Write to the file: Add the text "Hello, File I/O Challenge!" to the file.


    3.  Read from the file: Read the content from the file and print it to the console.


    4.  Delete the file: Delete the file you created.


    Task 2: Object Serialization


    1.  Create an object: Design a simple Java class (such as "Student" with fields
    like name, age, and grade).


    2.  Serialize object: Write code to serialize an instance of the class and save
    it to a file named "serialized_object.da".


    3.  Deserialize object: Read from the serialized file and deserialize the object.


    4.  Display object data: Print the details of the deserialized object.


    Bonus: Combine Both Tasks


    1.  Write multiple objects: Extend the object serialization task to write multiple
    instances of the class to the same file.


    2.  Read and display all objects: Modify the deserialization code to read all
    objects from the file and display their details.


    With this newfound knowledge of File I/O and object serialization, you are ready
    to take on even more sophisticated tasks in Java programming. In the next chapter,
    we''ll venture into one of the most flexible and used functions of Java: application
    programming interfaces (APIs)! You will see that despite having all the building
    blocks and information on the language, the API will help you speed up the development
    process, especially for specific tasks carried out by developers. Shall we continue?


    CHAPTER 9


    INTRODUCTION TO JAVA APIS


    Adeveloper must know the basic components of the code, but there is one thing
    they must learn to make their process more efficient: APIs, which are a part of
    the JDK and are preintegrated Java package components that will help establish
    the communication between the program and software platforms and components. In
    this chapter, we will focus on understanding and working with Java APIs, including
    the String, Date and Time, Math and Random APIs, and the Java Collections Framework.


    ## OVERVIEW OF JAVA APIS


    An API facilitates code since it already comes with the classes, interfaces, and
    user interfaces the developer will need for a certain purpose. As you will see
    in this section, there are different APIs the developer can use according to their
    specific needs. In addition, they can use APIs to integrate applications and developed
    software with websites, apps, and even the possibility to use real-time information.
    These are usually third-party services that can help turn complex problems into
    simple code lines and build programs that make the developer''s life easier.


    When talking about APIs, the most commonly used architecture style is the REST
    API, together with the Web API, JAX-RS, Facebook.4J, and Twitter.4J. These APIs
    can be private, designed by a company for a specific purpose; public, free to
    access and use; composite, developed by aggregating different APIs; partner, offered
    by companies to other businesses; and the Web Java API, accessed by the internet
    for browser-based applications (Java API, 2023). Since explaining the different
    Java APIs would require almost a full new book, in this section, we will see some
    APIs that perform different functions. You will see they provide an efficient
    and straightforward way to code with an all-in-one approach.


    ## WORKING WITH THE STRING API


    As you have learned, strings in Java are not mutable; therefore, every time you
    need to change or manage it, a new string will be created. When you have the StringApi,
    you will be able to work with the string you created, including determining its
    length, concatenating, and other actions you might need. In the example we are
    about to see, we are going to use the "Hello, World!" string and see the different
    actions that can be carried out.


    import java.util.Arrays;


    public class StringApiExample {


    public static void main(String[] args) {


    // Creating a String


    String str1 = "Hello, World!";


    // 1\. length(): Returns the length of the string.


    int length = str1.length();


    System.out.println("1\. Length: " + length);


    // 2\. charAt(int index): Returns the character at the specified index.


    char charAtIndex = str1.charAt(7);


    System.out.println("2\. Character at index 7: " + charAtIndex);


    // 3\. substring(int beginIndex): Returns a substring from the specified index
    to the end.


    String substring1 = str1.substring(7);


    System.out.println("3\. Substring from index 7: " + substring1);


    // 4\. substring(int beginIndex, int endIndex): Returns a substring within the
    specified range.


    String substring2 = str1.substring(7, 12);


    System.out.println("4\. Substring from index 7 to 12: " + substring2);


    // 5\. concat(String str): Concatenates the specified string to the end.


    String concatenated = str1.concat(" Welcome!");


    System.out.println("5\. Concatenated String: " + concatenated);


    // 6\. equals(Object obj): Compares the string with the specified object.


    boolean isEqual = str1.equals("Hello, World!");


    System.out.println("6\. String is equal to ''Hello, World!'': " + isEqual);


    // 7\. equalsIgnoreCase(String anotherString): Case-insensitive comparison.


    boolean isEqualIgnoreCase = str1.equalsIgnoreCase("hello, world!");


    System.out.println("7\. String is equal to ''hello, world!'' (ignore case): "
    + isEqualIgnoreCase);


    // 8\. indexOf(String str): Returns the index of the first occurrence of the specified
    substring.


    int indexOfSubstring = str1.indexOf("World");


    System.out.println("8\. Index of ''World'': " + indexOfSubstring);


    // 9\. toLowerCase(): Converts the string to lowercase.


    String lowercase = str1.toLowerCase();


    System.out.println("9\. Lowercase String: " + lowercase);


    // 10\. toUpperCase(): Converts the string to uppercase.


    String uppercase = str1.toUpperCase();


    System.out.println("10\. Uppercase String: " + uppercase);


    // 11\. trim(): Removes leading and trailing whitespaces.


    String stringWithSpaces = " Hello, World! ";


    String trimmed = stringWithSpaces.trim();


    System.out.println("11\. Trimmed String: ''" + trimmed + "''");


    // 12\. startsWith(String prefix): Checks if the string starts with the specified
    prefix.


    boolean startsWithHello = str1.startsWith("Hello");


    System.out.println("12\. String starts with ''Hello'': " + startsWithHello);


    // 13\. endsWith(String suffix): Checks if the string ends with the specified
    suffix.


    boolean endsWithWorld = str1.endsWith("World!");


    System.out.println("13\. String ends with ''World!'': " + endsWithWorld);


    // 14\. contains(CharSequence sequence): Checks if the string contains the specified
    sequence.


    boolean containsHello = str1.contains("Hello");


    System.out.println("14\. String contains ''Hello'': " + containsHello);


    // 15\. replace(char oldChar, char newChar): Replaces occurrences of a character.


    String replacedString = str1.replace(''o'', ''X'');


    System.out.println("15\. Replaced ''o'' with ''X'': " + replacedString);'
