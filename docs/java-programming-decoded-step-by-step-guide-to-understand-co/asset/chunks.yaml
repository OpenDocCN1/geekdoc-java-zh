    6. 双击图标开始安装 `IDE`。\n7. 选择“Eclipse IDE for Java Developers”。\n8. 安装 `IDE` 的文件夹将将被预选。点击“INSTALL”。\n\
    9. 下载完成后，如果安装程序没有自动为你启动，且你已经遵循了分步操作，请启动 `IDE`。\n10. 通过给它命名（由程序提示）为你的项目创建一个工作空间（workspace）。当你开始新项目时，可以创建一个新的工作空间。\n\
    \n现在你已经准备好编写你的第一个 Java 程序了！我们开始吗？\n\n## 编写你的第一个 Java 程序\n\n当有人学习如何编写代码时，第一个程序是“Hello\
