    This means that religious missionary activities can only be conducted among people
    who follow animistic or mystical beliefs, because these beliefs are not officially
    considered to be ‘religions’ (see [Chapter 3](#15_Chapter03.xhtml)). This provision
    is therefore in support of the position of Muslim leaders as expressed at the
    1967 conference. If the propagation ‘destabilizes religious groups’ or social
    harmony, then the government can take legal action to ensure compliance with these
    rules (art. 3). These four key limits on proselytization represent particular
    concerns of Muslims regarding Christian missionary activities.


    Article 2(a) relates to the idea of a fixed religious identity and the need to
    prevent apostasy and conversions between religions, mainly from Islam to Christianity.
    Apostasy (`riddah`, lit ‘to turn back’) is widely recognized within Islam as the
    desertion of Islam or the conversion from Islam to another religion (Saeed and
    Saeed, 2004: 1). Apostasy is a very sensitive issue in Indonesia, but it is not
    a crime recognized by the state. Apostasy from Islam and conversion to Christianity
    is, however, still a real cause of concern for Islamists in Indonesia (see [Chapter
    6](#18_Chapter06.xhtml)).


    Some Muslim organizations have been founded in part as a reaction to Christian
    proselytization and efforts to prevent apostasy. One such group is the Indonesian
    Islamic Preaching Council (Dewan Dakwah Islamiyah Indonesia, DDII), which was
    founded on 26 February 1967 by Mohammed Natsir, a leader of the Islamic political
    party Masyumi.^(27) According to Hefner, DDII ‘chose to work in regions where
    it competed directly with Christian missionaries’ (Hefner, 2000: 109). Since 1998,
    several ‘anti-apostasy’ groups have formed. One example is the Alliance of Anti-Apostasy
    Movements (Aliansi Gerakan Anti-Pemurtadan, AGAP), which was founded in April
    2005 by Muhammad Mu’min. AGAP claims to represent 27 radical Islamic organizations,
    such as the Islamic Defenders Front (Front Pembela Islam, FPI), Barisan Pemuda
    Persis, Jamaah Tabligh and Hizbut Tahrir, and claims to up to 50,000 supporters.
    The group organises campaigns on Christian activities and churches that aim to
    convert Muslims. As one example of its vigilante actions, Mu’min claimed it was
    responsible for the closure of 23 churches in West Java in 2005 (*Tempo Interaktif*,
    11 September 2005).


    A group with similar goals is the Anti-Conversion Movement Forum (Forum Anti-Gerakan
    Pemurtadan, FAKTA). Members of FAKTA have attempted attacks on Christian pastors
    who are on its blacklist of converts from Islam to Christianity (ICG, 2009: 7,
    8). For example, in 2007, a Christian teacher who allegedly tried to convert his
    Muslim students was murdered by members of FAKTA in Palembang. In April 2009,
    ten men were brought to trial and convicted in relation to this incident and for
    planning other similar attacks (ICG, 2009: 3).


    MUI has also expressed concerns that Christians are converting Muslims at ‘an
    alarming rate,’ lamenting the migration of Christians to predominantly Muslim
    areas, and complaining about the construction of churches in Islamic-majority
    provinces (*Jakarta Post*, 28 July 2005). Some concerned parties have held conferences
    to address these issues. For example, in 2001, Muhammadiyah held a conference
    in Jakarta on ‘Facing Apostasy,’ which featured speakers from groups such as the
    Indonesian Committee for Global Solidarity (Komite Indonesia untuk Soliditas Dunia),
    FPI and Laskar Jihad (*Republika*, 4 September 2001). In 2004, the Indonesian
    Ulama organized a seminar on ‘Education and Training on Anticipating Apostasy’
    (*Republika*, 2 March 2004). In June 2010, the Islamic Center of Bekasi issued
    several recommendations at its Congress, which included a recommendation to educate
    the Muslim community about the dangers of Christianization. activities continue
    to incite wider fears of apostasy.


    ### Regulations on Bribery and Coercion


    This is related to the second element of the Regulation, article 2(b), which aims
    to prevent conversions through bribery or dishonesty. According to KH Agil Siradj,
    chairperson of NU (2009–14), there are many rumors that Christians resort to bribery
    to ‘win’ converts, offering people money or food if they will become Christian.
    Newspapers as `Republika` circulate reports of people converting to Christianity,
    often through coercion or deceptive means. For example, in 1999 there were reports
    of 500 people converting from Islam in West Sumatra (`Republika`, 16 August 1999).
    In December 1999, the Indonesian Ulama Council reportedly discovered that 100
    Muslim children had been given fried meat to eat, which is `haram` (forbidden)
    for Muslims (`Republika`, 24 December 1999). Magazines like `Sabili` and groups
    such as DDII also make these claims, but the commotion stirred up by these groups
    often serves to inflame inter-religious relations. Although media reports appear
    every year claiming some students have committed ‘apostasy’ by converting to Christianity,
    what may be more likely is that some students enrolled to attend a Christian school.


    Another form of proselytization considered deceptive is the provision of material
    aid, particularly after natural disasters such as tsunami or earthquake. Raised
    by religious groups that provide charitable aid and material goods such as `sembako`
    to Muslims.^(29) In particular, at times there have been concerted campaigns to
    prevent Christian groups from providing aid or medical assistance to Muslim communities.
    An early example of Christian groups providing material aid with the underlying
    aim of Christianizing a Muslim community took place in 1968 after a flood in Surabaya
    (Hasyim, 1979: 280). In another example, in May 2006, after the earthquake in
    Bantul, Yogyakarta, a church went to deliver aid to victims, but was prevented
    from so by members of the Islamic-based Prosperous Party (Partai Keadilan Sejahtera,
    PKS) because it was not a ‘Christian area.’ In 2008, efforts were also made to
    stop a Christian event in Bekasi because a church intended to hand out free food.^(30)
    In addition, article 2(b) might also protect against forced conversions. The use
    of force to convert someone to Islam is forbidden, according to the Qur’an (2:256):
    ‘Let there be no compulsion in the religion …’ There have, however, been some
    reports of forced conversions in Indonesia, for example, at the height of the
    conflict between Muslims and Christians in Maluku (1999–2001). Some accounts referred
    to specific incidents, such as the forced conversion (specifically, forced circumcisions)
    of 450 Catholics from Keshui (`Christian Solidarity Worldwide`, 19 January 2001).
    More general reports have also emerged of claims of 4,000 coerced conversions
    of Christians to Islam during this conflict (`Sydney Morning Herald`, 27 January
    2001). Such claims are not new, with reports of forced conversions to Islam as
    early as the 1600s, when some Portuguese were captured by Muslims in Aceh and
    Makassar and were allowed to live if they agreed to convert to Islam (Reid, 1993:
    173–74). Nevertheless, these reports are generally rare in Indonesia and can perhaps
    be largely confined to the conflict in Maluku.


    ### Religious Publications


    The third element in article 2(c) is the fear of spreading false teachings through
    the distribution of Christian publications. From the late 1960s, the New Order
    government tried to control religious publications by providing funding to the
    six religions to publish holy books, although the quantity of books published
    was relatively small. From 1969 to 1970, it sponsored the publication of 278,000
    translations of the Qur’an; 8,000 copies of the Protestant Bible; 3,720 copies
    of the Catholic Bible; and 12,500 Hindu and Buddhist texts (Presidential Speech,
    1970: 250). This support increased every year and in 1990–91, the number of publications
    had risen to over 440,000 copies of the Qur’an; 50,000 copies of the Protestant
    Bible; and 49,000 copies of the Catholic Bible (Presidential Speech, 1991: chapter
    5, p.9). These religious publications were intended to be distributed to communities
    or people who did not yet have a (recognized) religion.


    There are reports of Bibles (often in the local dialect) being distributed to
    Muslims in public places such as schools. For example, in 1999 there were reports
    of Bibles in the Minangkabau language being distributed in Padang, West Sumatra.^(31)
    This is particularly controversial because it is widely believed that all Minangkabau
    people are Muslim. In 2002, a group gave away 100 Bibles in Bogor, West Java (`Republika`,
    27 December 2002). In 2004, MUI expressed its disappointment at the lack of response
    from the Ministry of Religion concerning the publication and distribution of the
    ‘Holy Book of Qur’an’ that allegedly contained elements of the message, in a majority-Muslim
    area (`Republika`, 15 July 2004).


    Finally, article 2(d) relates specifically to religious organizations that distribute
    pamphlets to people in their homes as a way of propagating their religion, such
    as Jehovah’s Witnesses. For example, Muhammad Natsir, the leader of Masyumi and
    founder DDII, gives an account of three missionaries who were detained after entering
    the home of a Muslim with a brochure and trying to persuade him to convert to
    Christianity. The Muslim, who was 65 years old, died from ‘shock’ (Natsir, 1980:
    77–78). In 1976, Jehovah’s Witnesses were banned by the Attorney-General because
    of the concern over the practice of ‘door knocking,’ although this ban was lifted
    in 2001 (Sairin, 1996a: 271–72). There is no evidence to suggest that Regulation
    70/1978 has ever been enforced by the government or in court.


    In addition to Regulation 70/1978 as discussed above, the Minister of Religion
    issued Decision 77/1978 on the guidelines for overseas donations to religious
    institutions in Indonesia. This was partly in response to allegations that foreign
    funding was sponsoring proselytization efforts. For example, on 21 July 1967 in
    a speech to the legislature, Dr Lukman Harun submitted copies of magazines from
    the United States that contained articles on the funds generated by the World
    Council of Churches as evidence of a Western agenda to fund Christian activities
    in Indonesia (Hasyim, 1979: 300–8). Other publications by Muslims on Indonesia
    highlight the large number of North American church organizations and overseas
    operating in Indonesia (Ka’bah, 1985: 82–84). The intention of this regulation
    is to enable the government to maintain control over what kind of donations religious
    groups receive, the amount of the donation, where the donations come from, and
    the intended purpose of the donations to avoid any ‘negative’ effects of foreign
    aid. This decision prohibits overseas donations to religious organizations in
    Indonesia unless with the approval of the minister (art. 2). Restrictions are
    placed on foreign missionary workers, who can only engage in religious propagation
    if they have the consent of the minister, and can do so for the limited period
    of two years, after which time they must be replaced by an indigenous worker (art.
    3). Religious institutions that do not comply with this regulation may be the
    subject of legal action (art. 4). The two 1978 regulations were the cause of great
    concern for Christians. On 24 August and again on 14 September 1978, the national
    Protestant and Catholic Councils (DGI and MAWI) sent a letter to Soeharto requesting
    the withdrawal of Regulations 70/1978 and 77/1978 in the interests of upholding
    the right to freedom of religion.^(33) As Mudzhar (1996: 232) points out, Christians
    protested because the regulations contradicted their position at the 1967 conference
    and could potentially cause Christian missionary activities to be severely restricted,
    because many churches receive international financial support. The regulations
    were considered to be unconstitutional and a betrayal of the Pancasila and religious
    freedom. They were branded by some foreign, Western media as ‘anti-mission laws’
    and led to headlines such as ‘Religious freedom hits Indonesian churches’ (Denffer,
    1987: 36–41). As Steenbrink (2000: 93) argues, ‘the 1978 Decrees appeared to be
    a pro-Muslim move of [the] new Cabinet,’ which was of great concern to Christians.


    The Ministry responded to this controversy with Decision 1/1979 on Guidelines
    for the Propagation of Religion and Overseas Donations to Religious Organizations.
    The 1979 decision restated that religious propagation could still occur but must
    be based on ‘mutual respect’ for other religions (art. 3) – that is, only aiming
    religious propagation at people who did not have a religion. It then reiterated
    almost word for word (but did not cancel) the key provisions of the 1978 regulations.
    The head of MUI at the time, Hamka, agreed with these laws (Mujiburrahman, 2008:
    82), and MUI has continued to express its support for these laws in its publications
    over the years (MUI, 1995: 26). Christian leaders again strongly objected to the
    1979 regulation (Sairin, 1996a: 488–99). Nevertheless, in the 1980s, several further
    regulations dealing with foreign religious missionaries and controlling the content
    of religious sermons and proselytization were passed (Sudjangi, 1992: 121–24).
    Although never implemented, they remain valid.


    ### [Conclusion](#07_Contents.xhtml_ch2-8)


    [content]

    When a state experiences regime change and embarks on a transition to democracy,
    this process is inevitably influenced by key actors within the community, such
    as religious leaders. This brief historical analysis of Islamist campaigns to
    limit Christianization through government policies prior to 1998 has shown that
    attitudes of resistance to Christian activities such as building churches, hospitals
    and schools are rooted in Indonesia’s colonial past, when Christianity was widely
    perceived to be favored by Dutch authorities. After independence in 1945, the
    1960s crackdown on communism and the mass conversions to Christianity, Islamists
    petitioned the government to provide religious education, protect religions from
    Blasphemy Law, regulate church permits. At the 1967 conference, this sparked national
    debates between Muslims and Christians about the ‘targets’ and methods of proselytization
    can be limited. In the late 1970s, pressure from the Indonesian Ulama led the
    Ministry of Religion to set boundaries on proselytization, which are still valid.

    [/content]


    ### Religious ideology, representation and reform](#07_Contents.xhtml_ch3)


    This chapter examines the representation of ideology in state institutions and
    law reform in relation to disputes between Muslims and Christians. It analyses
    how Muslims use government institutions and legal processes to reform laws that
    regulate religious affairs. Through these mechanisms, it demonstrates that Islamists
    have had a significant influence on law reform, with the result that majority
    rights are at times exercised at the expense of minorities. One of the major issues
    of dispute, both within the Muslim community, and between Muslims and Christians,
    is the ideological foundation of the state, and whether Indonesia should become
    a state based on Islamic law. After the initial failure of this debate in 1945,
    there was an attempt to resurrect this proposal in 2000 through the efforts of
    Islamists to reinsert into the Constitution the Jakarta Charter, the obligation
    for Muslims to follow Islamic law. This chapter analyses the failure of this campaign
    and the implications for the status of the Pancasila state ideology and the right
    to religious freedom, particularly for the rights of religious minorities. The
    key government department that regulates and oversees religious affairs is the
    Ministry of Religion. This chapter examines how Islamists are working through
    the Ministry of Religion, and the Indonesian Ulama Council (MUI) in particular,
    to campaign for national reforms based on Islamic law. It also examines the corresponding
    national Catholic and Protestant councils and whether these organizations still
    represent the Christian community in post-1998. Both the status of Jakarta Charter
    and the role of the Ministry of Religion have been the subject of vociferous debate.
    Since 1998, the processes of decentralization and democracy have shifted power
    to the local level and opened up greater freedoms for local governments to pass
    laws on religion.


    ### [Constitutional compromise and the limits of religious freedom](#07_Contents.xhtml_ch3-1)


    There have been two main issues of concern for Muslims and Christians regarding
    the relationship between religion and the Constitution since 1998: the constitutional
    changes to the right of freedom, and the attempt to make Indonesia an Islamic
    state by constitutional amendment. The two 1978 regulations were the cause of
    great concern for Christians. On 24 August and again on 14 September 1978, the
    national Protestant and Catholic Councils (DGI and MAWI) sent a letter to Soeharto
    requesting the withdrawal of Regulations 70/1978 and 77/1978.^(33) An ideological
    compromise has taken place, with priority given to the Pancasila over an Islamic
    state, and the consolidation of the right to religious freedom, with important
    qualifications. During the drafting process of the original 1945 Constitution,
    there was considerable debate about the inclusion of the right to religious freedom
    and whether it should include the freedom to change religion. Many of the Christian
    participants in the debate, such as Renda Sarallo Sihombing, of the Christian
    party Parkindo, argued that the Constitution should include the freedom to change
    religion and that reluctance to do so indicated that the state was concerned by
    Islamists of promoting conversions between religions (Nasution, 1992: 202). Several
    members of Christian political parties, such as I.J. Kasimo, chairperson of the
    Catholic party Partai Katolik, and Rumambi (Parkindo), supported the proposal
    to include the right to change religion (Nasution, 1992: 203). In 1953, this position
    was reaffirmed by a resolution adopted by the national Protestant council, which
    upheld the freedom to change religion and to propagate a religion (Nyhus, 1987:
    517). On the other side of the debate, Muslim leaders focused on the need for
    legitimate limitations on the right to freedom of religion for the sake of ‘religious
    harmony.’ Some participants in the drafting process of the 1945 Constitution,
    such as Oemar Salim Hubeis of the Islamic party Masjumi, vehemently argued against
    the inclusion of such a provision. If such a provision had to be included, however,
    he argued that it should not apply to Muslims, presumably because of the teachings
    of Islam against apostasy. In the end, the original Indonesian Constitution 1945
    included the right to freedom of religion under article 29, although it did not
    specify whether this includes a right to change religion. Article 29 reads as
    follows: The state shall be based upon the Belief in the One and Only God. The
    state guarantees all persons the freedom of religion and worship, according to
    his or her religion and belief. Since 1998 and the transition to democracy, the
    right to freedom of religion has been reaffirmed by the state. Article 22 of Law
    39/1999 on Human Rights states that: Each person is free to profess his/her religion
    and to worship according to his/her religion and belief. The state guarantees
    all persons the freedom of religion, according to his/her religion and belief.
    This right to religious freedom is tempered by art. 70 of the Law 39/1999 on Human
    Rights, which allows for permissible limitations on the right to religious freedom:
    In the enjoyment of their rights and freedoms, each person is obliged to submit
    to the limits determined by law, with the sole purpose of guaranteeing recognition
    and respect for the rights of others and to fulfil the requirements of justice
    and taking into consideration morality, security, and public order in a democratic
    community. In 2001, this right was further reinforced in the Second Amendment
    to the Constitution, and art. 28E was inserted as part of a new chapter on human
    rights, as follows: Each person is free to profess his or her religion and to
    worship in accordance with his or her religion … Each person has the freedom to
    possess convictions and beliefs, and to express his or her thoughts and attitudes;
    Each person has the freedom to associate, gather and express his or her opinions.
    This right is important, although this book does not analyze Muslim-Christian
    relations from the perspective of international law and the right to freedom of
    religion. Rather, it focuses on local understandings of religious freedom that
    demonstrate ‘freedom of religion’ has become a common discourse.


    ### [National Christian councils: Representing Christianity?](#07_Contents.xhtml_ch3-3)


    Christians are also represented in the Ministry of Religion. There is a historical
    distinction between Protestants and Catholics in Indonesia due to the colonial
    legacy. Christians may be referred to, or refer to themselves, as `Nazarani` or
    `Nasrani` – that is, followers of Jesus. There are various explanations for the
    use of this term. Stevens and Schmidgall-Tellings (2004: 65) claim that the term
    `Nasrani` was formerly used in Indonesia only to refer to Roman Catholics, while
    Protestants were known as `Masehi`, that is, followers of the Messiah, but that
    it is now used to refer to both Catholics and Protestants. My informants generally
    suggested that it was well-educated people who use the term `Nasrani`. This is
    considered more polite (as opposed to `Kristen`) because it is the translation
    of the Arabic term for Christian used in the Bahasa Indonesia version of the Qur’an.
    The state and its institutions, such as the Ministry of Religion, generally use
    the term `Kristen` for Protestants and `Katolik` for Catholics. This clear distinction
    between Protestants and Catholics can be traced back to the initial policies of
    the Dutch government, which distinguished between Protestant and Catholic churches
    and only permitted one church to work in any given area. The Indonesian Council
    of Churches, PGI primarily includes Presbyterian, Lutheran and Calvin churches,
    among many others. When it was formed in May 1950 with 27 member churches it was
    known as the Indonesian Council of Churches (Dewan Gereja-gereja Indonesia, DGI).^(54)
    Its largest member, both then and now, is the Batak Church (Nyhus, 1987: 84).
    In 2010, the membership of PGI consisted of over 83 church denominations (PGI,
    2010b). The emergence of, and distinction between, these two national councils,
    one for Protestants and the other for Catholics, is also indicative of the ‘bitter
    rivalry’ between Protestants and Catholics in Indonesia (Steenbrink, 2003).


    There are two Christian councils within the Ministry. Catholics are represented
    by the national Bishops Council of Indonesia (Kantor Waligereja Indonesia, KWI).^(53)
    This institution was established in 1955 as the High Council of Indonesian Bishops
    (Majelis Agung Wali Gereja Indonesia, MAWI), and later changed its name to KWI.
    Protestants are represented by the national council for Protestants, known as
    the Indonesian Communion of Churches (Persekutuan Gereja-Gereja Indonesia, PGI),
    which primarily includes Presbyterian, Lutheran and Calvin churches, among many
    others. When it was formed in May 1950 with 27 member churches it was known as
    the Indonesian Council of Churches (Dewan Gereja-gereja Indonesia, DGI).^(54)
    Its largest member, both then and now, is the Batak Church (Nyhus, 1987: 84).
    In 2010, the membership of PGI consisted of over 83 church denominations (PGI,
    2010b). The emergence of, and distinction between, these two national councils,
    one for Protestants and the other for Catholics, is also indicative of the ‘bitter
    rivalry’ between Protestants and Catholics in Indonesia (Steenbrink, 2003).


    ### [Regional regulations and radicalism in West Java](#07_Contents.xhtml_ch3-6)


    The proliferation of regional regulations based on Islam post-1998 can be seen
    as an expression of a small disparate but vocal group of hardliners. Religious
    regulations exist in the majority of provinces and the largest numbers of religious
    regulations have been generated in the provinces of West Sumatra, South Sulawesi
    and West Java. In West Java, `perda syariah` exist in at least 14 cities and districts.
    In terms of impact, Tanthowi’s study of the influence of religious regulations
    on non-Muslims in Cianjur (West Java) found a very low level of awareness or understanding
    of the implementation of `syariah` (53 per cent; Tanthowi, 2008). Large numbers
    of non-Muslims declined to participate in the survey as they were afraid to disclose
    their opinions. Of the non-Muslims who were willing to participate, Tanthowi found
    that some non-Muslims had been forced to comply with the religious regulations,
    such as women being coerced to wear `jilbab` in the workplace.


