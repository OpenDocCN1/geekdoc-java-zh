    lawyer for the church in the Bekasi Church Permit Case, 1 November 2010.97  Supreme
    Court, 2006e. The Constitutional Court can only hear cases for judicial review
    of laws (*undang-undang*), which is why this case was heard in the Supreme Court.[6  Insulting
    a religion](#07_Contents.xhtml_ch6)Cases of blasphemy in Indonesia intersect with
    the politics of religious conversion, especially from Islam to Christianity, and
    the use of criminal law to suppress religious dissent. The criminal offence of
    blasphemy, inserted as article 156a into the Criminal Code in 1965, makes it a
    crime to dishonor or insult a religion in Indonesia; this is commonly referred
    to in public debates as the ‘Blasphemy Law’ (see [Chapter 2](#14_Chapter02.xhtml)).
    Since 1998, there has been a sharp rise in accusations of insults to Islam and
    ensuing court cases. This chapter primarily focuses on incidents in which Christians
    have been accused and/or convicted of blaspheming Islam.¹ There have also been
    many cases in which people who identify as Muslims have been convicted for blaspheming
    Islam, or people who identify as Christians have been convicted for blaspheming
    Christianity.² These cases involve disputes internal to a religion, rather than
    a dispute between religions, so I only deal with them briefly to illustrate broader
    trends in the application of the Blasphemy Law.This chapter explores how fears
    that conversions to Christianity will destabilize social order and political power
    underline criminal prosecutions for blasphemy in Indonesia. Between 1998 and 2012,
    over 130 people were taken to court on charges of blasphemy. About half of the
    accused in these cases have been Christians.³ This is because cases of blasphemy
    often raise concerns over the limits of proselytization and efforts to convert
    people to Christianity. The Blasphemy Law has been used to imprison leaders of
    groups considered to be ‘deviant,’ to condemn converts between religions, and
    to silence what are considered to be unorthodox interpretations of the six official
    religions, primarily Islam and, to a lesser extent, Christianity. There are no
    legal criteria for what constitutes ‘deviancy’ in Indonesia, although the issue
    is usually determined by the relevant national religious council.This chapter
    conducts a close analysis of the Tasikmalaya Apostasy Case, and places it in context
    by considering the history of radical Islam in Tasikmalaya and the support for
    regional regulations based on Islam. It also considers broader patterns in cases
    of blasphemy, particularly in cases where former Muslims have been prosecuted
    for blaspheming Islam. It concludes with an examination of the 2010 decision of
    the Constitutional Court, which upheld the validity of the Blasphemy Law. Overall,
    the Tasikmalaya Apostasy Case indicates that Indonesia’s Blasphemy Law has been
    used like an apostasy law by Islamists to condemn and punish Muslims who have
    converted out of Islam to Christianity.⁴[Tasikmalaya Apostasy Case](#07_Contents.xhtml_ch6-1)One
    of the first cases since 1998 in which a convert from Islam to Christianity was
    convicted for insulting Islam was the case of Abraham Bentar Rohadi. In 2006,
    he was found guilty of insulting Islam under article 156a of the Criminal Code
    by the District Court of the City of Tasikmalaya. This case is intimately related
    to Abraham’s religious and family ties, and the social context of Tasikmalaya.
    Abraham was born into a devout Muslim family in the village of Nagarasari, Tasikmalaya.
    In 1982, at the age of 32, Abraham moved from Tasikmalaya to Bandung with his
    wife. His relatives soon lost contact with him and claim to have heard that he
    had passed away (Supreme Court, 2006a). In 1998, while in Bandung, Abraham converted
    from Islam to Christianity after a pastor helped him recover from a stroke. In
    1999, he was baptized and then studied for three years at a Christian theological
    college.In 2000, after an absence of 18 years, Abraham returned to visit his hometown
    and informed his relatives that he had changed religion and become Christian.
    This unwelcome news, combined with his long period of absence, placed a strain
    on relations with his relatives. Abraham visited his family several times in the
    following years. From 2003 up until the time of the trial, he was employed by
    a church (District Court, 2006i). The court described his role as an *Ivenjalis*
    or *Penginjil*, that is, a Christian ‘Evangelist’ (District Court, 2006a). Meanwhile,
    the situation grew increasingly tense between him and his family.Finally, on 6
    March 2006, his brother-in-law Usman Suryadi and his nephew Asep Aris went to
    the home of Agun Gunawan, the head of neighborhood 13 (*rukun warga*, RW), to
    report Abraham on allegations of insulting Islam several times over the past few
    years. Agun then coordinated a meeting with the local leader of the Indonesia
    Council of Ulama (MUI) and a local *ustad* (Islamic teacher) Latief Amien, and
    all agreed that Abraham should be reported to the police (District Court, 2006a:
    1). It is unlikely to have been a coincidence that just two days later, on 8 March
    2006, Abraham was attacked in Tasikmalaya by a large crowd of radical Muslims
    and severely beaten. The crowd also set fire to his van. It was Abraham, however,
    and not the perpetrators of the attack, who was arrested by police, partly for
    his own safety. He was subsequently charged with the criminal offence of insulting
    Islam.On 17 May 2006, the trial began. The primary charge brought against him
    was that, sometime between 2001 and 2006, he blasphemed Islam (District Court,
    2006i: 3–4). He was accused of having stated that:The religion of Islam is a religion
    of darkness. The Prophet Muhammad is not the final prophet, rather the final prophet
    is *Isa* [Jesus]. The Prophet Muhammad is a liar … All followers of Islam are
    barbaric …(District Court, 2006a: 19)No date, time or place at which this statement
    was alleged to have been said was specified by the Prosecution. The Prosecution
    further alleged that he defamed Islam in a separate incident in December 2004,
    while speaking at the Pentecostal Church of Tasikmalaya. He was quoted as saying
    that:The religion of Islam is a religion of darkness and its teachings cannot
    be understood. After a person converts to Christianity, their wealth will increase
    and they will have a house, a car, rice fields and land.(District Court, 2006a:
    4)This suggested that Abraham may follow a Christian theology that upholds the
    so-called ‘prosperity doctrine,’ a belief particularly among some wealthy churches
    that God will bless His followers with material possessions. Abraham admitted
    to having said the two statements above, although he later claimed that he made
    this admission under force. He nevertheless apologized at the court hearing if
    his words had offended anyone.The physical evidence brought before the court included
    two Bibles, a car, some religious books and two VCDs on Christianity. Abraham
    admitted the books were his but claimed they were for his personal study only.
    The Prosecution asserted that these books had been left by Abraham at his brother-in-law’s
    house with the intention of converting him, and claimed this contravened the prohibition
    on spreading religious teachings through the distribution of pamphlets or publications.⁵
    This argument suggests that a breach of the Ministerial Regulation on Proselytization
    can be relied on as evidence to convict converts who insult Islam.Only two short
    court hearings took place before Abraham was sentenced to four and a half years
    in prison. Local churches in the area did not wish to condone his behavior and
    so most were not present at the trial. The only pastor who attended the trial
    out of concern for Abraham’s safety was Pastor Andreas Setiawan, who described
    Abraham as ‘immature’ in his faith and quick to denigrate other religions such
    as Islam.⁶In May 2006, Abraham lodged an appeal with the Bandung High Court. The
    court acknowledged that the issue in this case was really between family members
    and reduced his sentence to three years and six months (High District Court, 2006b).
    In September 2006, Abraham lodged an appeal with the Supreme Court (Supreme Court,
    2006c). The appeal was rejected by the Supreme Court, although it did acknowledge
    that the case also involved a dispute over inheritance between family members
    (Supreme Court, 2006a). On 27 April 2008, Abraham was released on parole after
    serving two years in prison.[Historical trends in court cases](#07_Contents.xhtml_ch6-2)During
    the New Order (1966–98), article 156a of the Criminal Code was relied on to prosecute
    fewer than ten cases in court.⁷ All cases brought to court during this time related
    to disputes within Islam, rather than disputes between religions. There was one
    conviction in 1968, although in the 20 years that followed (1969 to 1990) there
    were no known convictions for blasphemy, perhaps because of the extent to which
    Soeharto controlled public or political expressions of religion. Since 1990, there
    are two main types of cases that have been prosecuted under article 156a of the
    Criminal Code.In the first type of case, some people were convicted for being
    responsible for publications that were considered to have insulted Islam, such
    as occurred in the Monitor Case in 1990\. On 15 October 1990, an article featured
    in *Monitor*, a popular magazine owned by the Catholic publishing company Gramedia.
    It included a survey of the most inspiring figures, with the Prophet Muhammad
    ranked 11th (Rumadi, 2007: 23–24). This led to protests organized by MUI, the
    Indonesian Islamic Preaching Council (Dewan Dakwah Islamiyah Indonesia), the Indonesian
    Committee for Global Muslim Solidarity (Komite Indonesia untuk Solidaritas Dunia
    Islam), the Muslim Students Association (Himpunan Mahasiswa Islam) and the youth
    wing of Muhammadiyah, which considered it offensive that the Prophet Muhammad
    was only listed 11th (Hefner, 2000: 161). One week later, on 23 October, the tabloid
    was banned and the Minister for Information cancelled its publishing license.
    Hefner (2000: 176–77) argues that evidence suggests the real protagonist was Din
    Syamsuddin (the current chairperson of Muhammadiyah 2009–14), who mobilized the
    Muslim community against Arswendo. The editor of the magazine, Arswendo Atmowiloto,
    a Catholic, was brought to trial for allowing the article to appear in the magazine.
    On 25 October 1990, he was found guilty of breaching article 156a of the Criminal
    Code and jailed for five years by the Central Jakarta District Court (Steenbrink,
    2006: 148).⁸ He appealed to the provincial High Court and then to the Supreme
    Court, where his sentence was reduced by six months.⁹ A report of the Attorney-General
    noted the Monitor Case as one example where ‘repressive action’ was necessary
    (Kejaksaan Agung, 1995: ix). Aside from religious sentiments, there were also
    political tensions underlying this case. According to Hefner:The message the government
    sought to send through the Monitor Affair was that the New Order’s old alliance
    with Javanists was over … henceforth the president would act as a champion of
    conservative Muslim interests against Javanists, Christians, and other minorities.(Hefner,
    2000: 161)Aside from convictions of people who were held responsible for publications
    deemed insulting, the second type of case involved Muslims who were accused of
    blaspheming Islam because they make jokes about Islam using Javanese *plesetan*,
    that is, parody, a play on words or pun. *Plesetan* comes from the Indonesian
    word *terpleset*, literally to slip or fall. The first recorded case of this kind
    is the Sastra Case. On 8 August 1968, an anonymous short story was published in
    *Sastra* magazine titled ‘*Langit Makin Mendung*,’ ‘The Sky Darkens’ (Dahlan and
    Hermani, 2004). This short story caused controversy because of its imaginative
    depictions of God, the prophets, the Archangel Gabriel and Islamic religious leaders,
    which were perceived as disrespectful and an insult to Islam.^(10) In addition,
    the story was written in a style known as *sembarangan*, which is when an author
    presents serious matters – in this case Islam – in ‘a casual and careless manner’
    (Morgan, 1974: ii). Large protests against the publication of the story were held
    in North Sumatra and Jakarta. The Ministry of Religion issued a press release
    that condemned the publication (Morgan, 1974: i). The editor of *Sastra* magazine,
    Hans Bague Jassin, a Muslim, refused to divulge the true identity of the author.
    Although some suspected that the short story was written by Jassin himself, the
    author of the story was referred to by the pseudonym ‘Kipanjikusmin,’ reportedly
    a Muslim who had received a Catholic education (Rumadi, 2007:20). Due to the anonymity
    of the author and Jassin’s unwillingness to name the author, Jassin was brought
    to court for allowing the article to be published in his magazine. Jassin was
    sentenced to one year in jail for breach of article 156a of the Criminal Code.The
    next case, the Salatiga Case, did not occur until 1992\. Djoni Purwoto, 22, and
    Sugiri Cahyono, 29, were accused of insulting Islam for the jokes they made about
    verses from the Qur’an. They transformed the Arabic phrase ‘*Kun fa-yakun*,’ ‘[God’s
    command is] Be and it is’ (Q 36:82) into the Indonesian phrase ‘*Tak ada singkong
    ada sukun telor ayam lebih kecil dari telur kalkun*’ (there is no cassava but
    there is breadfruit, a chicken egg is smaller than a turkey egg). This was a play
    on the sound of the syllable ‘*kun*’ in Arabic and Indonesian. Similarly, they
    exchanged the Arabic phrase ‘*Amin, ya Robbal Alamin*,’ ‘Amen, Lord of the Universe’
    to the Indonesian phrase which sounds similar ‘*Amin, ya gombal alamin*,’ ‘Amen,
    thanks be to God the liar.’ Although intended as a joke, these puns were considered
    by some to be offensive and insulting to Muslims, and the students were put on
    trial under article 156a of the Criminal Code. Purwoto was sentenced to four years’
    jail and Cahyono to three and a half years’ jail by the District Court of Salatiga,
    Central Java (Aqsha *et al*., 1995: 171–72; HRW, 1994a).In 1992, a second *plesetan*
    case occurred in Yogyakarta. Two students of Gadjah Mada University, R. Bambang
    Wahyu Nirbito, 29, and Ambar Widi, 26, were prosecuted for insulting Islam in
    the District Court of Yogyakarta (High District Court, 1992). They were accused
    of making disrespectful jokes about Islam while hosting a concert. Nirbito was
    quoted as saying ‘*Ayat kursi disebut ayat Kursi dengen mebelnys*,’ ‘The Throne
    Verse is known as the Chair verse with furniture.’ Nirbito’s quip was considered
    offensive because it trivialized one of the most important verses of the Qur’an,
    reducing it to a matter of household furniture. *Ayat kursi* (Q 2:225), known
    as the Throne Verse, is one of the most well-known verses in the Qur’an. According
    to Federspiel (1995: 25–26), it is ‘a popular verse often recited by Muslims in
    times of danger and sorrow’ because God does not rest and is available to help
    with problems. Other interpretations of this verse promote the belief that if
    it is read before you sleep, God will send two angels to watch over you until
    the morning.^(11) Widi was quoted as replying ‘*Surat Ar Rachman* *ayat 16 bunyinya
    Walaa Taqrabuzina artinya jangan kamu mendekati zina*,’ ‘Ar-Rachman verse 16 says
    *Walaa Taqrabuzina* meaning do not commit adultery.’ This was a reference to Q
    55:16 (‘Then which of the favors of your Lord will you deny?’) and Q 17:32 (‘Do
    not draw near to fornication, for it is an indecency, and its way is evil’). Although
    this statement appears to be against adultery, the Prosecution asserted that it
    was offensive because it was a play on the word *bunyi* which means ‘sound/noise’
    but can also mean ‘the contents of’ or ‘meaning.’ The Prosecution argued that
    the implied meaning was ‘*nikmatilah zina sepuas-puasnya dan dengan ucapan*,’
    ‘enjoy adultery as much as possible and with moans and groans.’ Two days after
    the concert, on 4 May, a demonstration was held demanding that the two students
    be prosecuted. At the trial, Nirbito admitted that he often performed *plesetan*,
    but he did not usually use verses from the Qur’an. The two students were sentenced
    under article 156a of the Criminal Code to two and a half years’ jail for their
    performance; their appeal was unsuccessful (High District Court, 1992).Another
    incident was the Permadi Case in 1995.^(12) Permadi Satrio Wiwoho was a well-known
    Javanese mystic, a supporter of Megawati, lawyer and commentator on public affairs
    from Solo, Central Java. He was accused of not only insulting President Soeharto
    and Golkar, the state-sponsored political party, but of slandering the Prophet
    Muhammad (Hefner, 2000: 176). These allegations were initially raised in a statement
    from Din Syamsuddin^(13) published in a newspaper. In addition, the head of MUI
    KH Hasan Basri, who had ties to DDII, declared that Permadi had insulted Islam.
    When questioned about his statement, Hasan admitted he had not actually listened
    to the recording in which Permadi had allegedly insulted the Prophet, but had
    relied on a transcript provided to him by Din Syamsuddin, which raised questions
    about whether Din Syamsuddin had tampered with the recording to fabricate evidence
    against Permadi (Hefner, 2000: 178). Nevertheless, in August 1995, Permadi was
    tried in court under article 156a of the Criminal Code. He was convicted and sentenced
    to eight months’ jail.Aside from cases of blasphemy through the media, *plesetan*
    performances or public speeches, other convictions for insulting Islam have led
    to violence against Chinese Christians, as occurred in the Saleh Case. In September
    1996, Saleh, a young Muslim student from Situbondo (East Java), was reported by
    KH Achmad Zaini, the leader of Nurul Hikam *pesantren*, to the police for declaring
    that Muhammad was not the final prophet and therefore for promoting beliefs that
    ‘deviated’ from Islam (Rumadi, 2007: 25–37). When the police arrested Saleh, it
    was partly for his own protection (Purdey, 2006: 44). At the court hearing, rumors
    spread that Saleh had fled to a nearby church, Bukti Sion Indonesian Bethel Church.
    The crowds who had turned out to protest against Saleh then rushed to the nearby
    church and burnt it down, along with 23 other churches, some Christian schools
    and a number of Chinese shops. Five people were also killed. On 3 October, Saleh
    was convicted under article 156a of the Criminal Code and received a five-year
    jail term (Steenbrink, 2006: 149). Although this was essentially a case of blasphemy
    internal to Islam, it led to violent attacks against Christians. The perpetrators
    of this attack were never prosecuted.In January 1997, the Tjio Kim Tjoan Case
    occurred in Rengasdengklok, West Java, although with racial rather than religious
    overtones. Early one morning, a Chinese Indonesian couple, Tjio Kim Tjoan and
    his wife Cik Gue, asked a group of young Muslims to reduce the level of noise
    of the call to prayer from the mosque. During his confrontation with the youths,
    Tjio Kim Tjoan was accused of insulting them by calling them ‘dogs,’ although
    he denied this. A dispute broke out and as news of the alleged blasphemous incident
    spread a crowd of Muslim youths began to rally, destroying churches, Chinese-Indonesian
    shops, a Confucian hall and a Buddhist temple. Complaints were made against Tjio
    Kim Tjoan to the police. At the trial, 600 military and police officers guarded
    the courtroom due to the presence of radical Islamic groups calling for the conviction
    of Tjio Kim Tjoan. On 7 April 1997, the Karawang District Court sentenced Kim
    under article 156a of the Criminal Code to three and a half years in jail for
    insulting Islam (ISAI, 1997: 45–46).Article 156a of the Criminal Code was therefore
    only used to prosecute those who have insulted Islam a handful of times under
    Soeharto, mostly after 1990\. These cases were marked by political undertones,
    and the volatile political atmosphere under the New Order. There has been an increase
    in blasphemy convictions since 1998, and several trends can be discerned in these
    cases.[Characteristics of cases post-1998](#07_Contents.xhtml_ch6-3)There has
    been a marked increase in the number of cases of insulting a religion that have
    been taken to the courts. From 1998 to 2012, over 50 people who identified as
    Muslim have been convicted for insulting Islam. In the majority of cases taken
    to court the accused are found guilty.^(14) These cases evince a pattern of small
    religious minorities being targeted by Islamists for a wide range of actions classified
    as an ‘offence against religion,’ without the same political undertones as the
    cases that took place under Soeharto’s New Order.The first noticeable trend is
    that the groups or individuals targeted for blaspheming Islam are usually small,
    local groups with no international networks or support, which makes them easy
    targets. One example of this is the Lia Eden community, also known as Salamullah
    or God’s Kingdom of Eden (Tahta Suci Kerajaan Eden). This community began in 1995
    under the leadership of Lia Eden, formerly known as Lia Aminuddin, who claims
    to have had an encounter with the Archangel Gabriel. The movement is based in
    Jakarta and had only about 50 members in 2005 (Rumadi, 2007: 54–57).^(15) Three
    leaders from this group have been convicted for blaspheming Islam under article
    156a of the Criminal Code.In the first case in 2006, Lia Eden was accused of claiming
    that she herself is the Archangel Gabriel and receives revelations from God, which
    she declared in letters sent to MUI and the Ministry of Religion (District Court,
    2006d). She proclaimed one of her followers, Muhammad Abdul Rachman, as the reincarnation
    of the Prophet Muhammad. She also taught that it is permissible to pray in two
    languages and to eat pork. There were also allegations that Lia Eden had abused
    a child by threatening to burn the child’s mouth in 2005\. In the same trial,
    Muhammad Abdul Rachman was also convicted for claiming to be the Prophet Muhammad
    (District Court, 2006g).Then in 2009, Lia Eden was convicted (for the second time)
    for communicating the revelations she received in a letter sent to all major government
    departments and Islamic organizations in Indonesia, including the president. In
    the letter, she argued that Islam as a religion should be dissolved, that all
    religions should unite and that they should all pray in one direction (but not
    to Mecca) (District Court, 2009b: 3). One of her followers, Wahyu Andito Putro
    Wibisono, was also convicted under article 156a of the Criminal Code because of
    his role in distributing the letters (District Court, 2009a).One of the reasons
    these individuals were convicted is because the Lia Eden community has very few
    followers, it is only based in Jakarta and has no international networks. Other
    accused, such as Elldein Osvaldo Lubis of Pondok Ungu Permai, Bekasi, do not even
    have any followers (*Republika*, 3 January 2009). By contrast, the followers of
    other groups such as Ahmadiyah have not yet been accused of blasphemy in court
    because it is one of the few religious minorities in Indonesia that is a global
    movement with international networks.A second feature of many cases is that these
    groups or individuals are usually targeted by religious leaders from hardline
    groups that have issued a *fatwa* against the individual or group and then report
    the case to the police. MUI^(16) has often issued *fatawa* against minority groups
    in an attempt to suppress deviant teachings that present a challenge to Islamic
    doctrine and to its authority as religious leaders. At the local level, MUI have
    issued *fatawa* against groups that have resulted in the conviction of members
    of those groups.^(17) For example, in 1997, a *fatwa* against Lia Eden and her
    teachings was issued by the national Ministry of Religion (2003: 114–27).This
    also occurred in the ‘YKNCA Case’ (Drug and Cancer Foundation, Yayasan Kanker
    dan Narkoba Cahaya Alam). A *fatwa* was issued by MUI against the leader, Ardhi
    Husein, of a healing center in Probolinggo known as YKNCA, and some of its members,
    and then a case was later brought to court (District Court, 2005c). A book published
    by the center, ‘Piercing the Darkness Towards the Light 2,’ ‘*Menembus Gelap Menuju
    Terang* 2’ (MGMT 2), was considered to be insulting to Islam because its interpretation
    of verses from the Qur’an was considered to be problematic. For example, the book
    claimed there were still prophets (implying that Muhammad was not the last prophet),
    that Satan has more faith than humans, that Islam is only for Arabs, and that
    to enter heaven you do not have to be Muslim (District Court, 2005c: 12). They
    were sentenced to three years’ jail for breach of article 156a of the Criminal
    Code.The court has often relied on the *fatwa* of MUI as justification for its
    decision. The reliance by the prosecution of *fatawa* as evidence in court is
    difficult for the court to deny without questioning the credibility of the Islamic
    leaders. Of course, as discussed in [Chapter 3](#15_Chapter03.xhtml), a *fatwa*
    from MUI is not legally binding in Indonesia, so the extent to which it is followed
    varies. In the Whistling Case, for example, the MUI of Polewali (South Sulawesi)
    declared whistling deviant and then reported Sumardin Tappaya, a high school Islamic
    religious teacher, to the police for insulting Islam because he whistled during
    Friday prayers (MUI, 2006). He was later sentenced to six months in prison for
    breach of article 156a of the Criminal Code. In addition to *fatawa*, in 2007,
    MUI issued guidelines on how to determine whether religious teachings are ‘deviant,’
    for example, if a group disputes the authenticity of the Qur’an or changes religious
    rituals set down by *syariah*.^(18) The guidelines have been widely circulated
    to the Office of the Public Prosecutor, the Ministry of Religion and local government
    at the provincial and local levels.The third characteristic of these cases is
    that allegations of blasphemy are often easily proven because the definition of
    blasphemy under the Criminal Code in Indonesia is broad and has been interpreted
    widely by the courts. It can include any act, belief, or utterance vaguely considered
    to be insulting to a religion. It must be noted that it is rare for the decisions
    of the District Courts (*Pengadilan Negeri*), the lowest court in the Indonesian
    hierarchy, to contain detailed explanations or reasoning for its decisions in
    any cases that it decides. Instead, the court usually refers briefly to the three
    elements of the offence, as contained in article 156a of the Criminal Code, and
    then examines whether it has been satisfied in a case. The first element, ‘a person,’
    simply emphasizes that only an individual can be convicted for blasphemy and not
    an organization. Second, the act must have been done ‘deliberately in public.’
    However, the emphasis is not on whether the act was intentional, but rather whether
    it was done ‘in public.’ ‘Public’ has been is defined as ‘a place that is easy
    for people (the public) to see and to be visited by many people’ (District Court
    2006d: 54). The act must occur in a place that ‘can easily be seen by the public,’
    or at least is not ‘closed to the public’ (District Court 2006f: 39). The third
    element is that the person must be found to ‘express feelings or behave in a manner
    that involves hatred, misuse or insulting of a religion followed in Indonesia.’
    This has been interpreted to include any act, belief, or utterance vaguely considered
    to be insulting to a religion.Behavior that has been determined to be insulting
    to Islam by a court includes claims that a person is the Prophet Muhammad or a
    prophet (after the Prophet Muhammad) and has received revelations from God. As
    mentioned earlier, Abdul Rahman, a member of the Lia Eden community, was charged
    with blasphemy because he believed he was the reincarnation of the Prophet Muhammad
    (District Court, 2006f, 2006g, 2008e). Another example is Ahmad Mushaddeq, the
    leader of Al-Qiyadah al-Islamiyah, who claimed to be a prophet after the Prophet
    Muhammad and taught his followers that it was not necessary to pray five times
    a day or make the pilgrimage to Mecca (High District Court, 2008). He was sentenced
    to four years’ jail for breach of article 156a of the Criminal Code.Other behavior
    considered to be insulting to Islam is the refusal of groups that claim to be
    within Islam to practice one of the five pillars of Islam^(19) or other teachings
    considered fundamental to Islam. For example, in 2009, Agus Imam Solichin, leader
    of Satrio Piningit Weteng Buwono, a group that claimed to be ‘Islamic,’ was sentenced
    under article 156a of the Criminal Code to two and a half years by the South Jakarta
    District Court because he taught his group that it was not necessary to pray five
    times per day or to fast (*Jakarta Post*, 30 July 2009). A group is particularly
    vulnerable if it publishes its teachings, with many groups convicted on the basis
    of such evidence. For example, in the Lia Eden Case (No. 2), over 83 brochures,
    books and *fatawa* produced by the Eden community were used as evidence against
    Lia Eden (District Court, 2009a).Finally, another key aspect of these cases is
    that the accused are often forced to ‘repent’ of the act or opinion considered
    ‘deviant’ and convert to Islam. The generally accepted view in Islam is that repentance
    of blasphemy is acceptable, though it must be done willingly and cannot be forced
    (Saeed and Saeed, 2004: 54). Often, however, the accused are pressured or coerced
    to ‘return’ to Islam. Even if they do, they are usually still found guilty of
    blasphemy in court. This occurred in the case of Yusman Roy, a Muslim accused
    of praying incorrectly for promoting bilingual prayer in Indonesian and Arabic.^(20)
    Although bilingual prayer is not prohibited in the Qur’an, it is a contentious
    issue among the different schools of Islam (*mazhab*). In Indonesia, the *hadith*
    by Bukhari, ‘Pray as you have seen me praying’ is relied on to support the view
    that prayer must be conducted in Arabic.^(21) Returning to the issue of conversion,
    Yusman Roy was strongly ‘encouraged’ by the head of Nahdlatul Ulama (NU), Hasyim
    Muzadi, to return to the teachings of the Qur’an (*Republika*, 9 May 2005).^(22)
    In the Tasikmalaya Apostasy Case, Abraham claimed that while he was in custody
    he had been visited several times by representatives of MUI who tried to force
    him to say the s*yahadat* (creed) and return to Islam. There were also calls for
    Lia Eden to return to Islam (*Republika*, 6 June 2009).The pressure to repent
    and return to Islam has come from Islamic organizations such as MUI, NU or Muhammadiyah.^(23)
    An example of this was the case of Ahmad Mushaddeq, whose community was reported
    to have ‘repented’ and ‘returned’ to Islam (*Republika*, 28 February 2008). In
    December 2007, a two-day discussion was held between government officials and
    religious leaders, including from NU, with Mushaddeq. After those two days, Ahmad
    had ‘repented.’ A similar incident took place with members of Al-Qiyadah al-Islamiyah
    in other areas such as Gresik (West Java) and Makassar (South Sulawesi), who were
    reported to have signed statements of confession to confirm they had returned
    to the true teachings of Islam (Constitutional Court, 2010c: 19). Aside from these
    cases, there has also been a large number of Christians who have been accused
    and/or convicted of insulting Islam.[Christians and converts to Christianity:
    insulting Islam](#07_Contents.xhtml_ch6-4)Under the New Order, there were several
    highly controversial cases of public religious conversions from Islam to Christianity
    that led to accusations of blasphemy. Between 1998 and 2012, there were over 60
    Christians convicted under article 156a of the Criminal Code for insulting Islam
    or Christianity. I discuss these cases in detail here because these controversies
    have shaped relations between Muslims and Christians in Indonesia.[Muslim converts
    to Christianity](#07_Contents.xhtml_ch6-4-1)Two converts to Christianity who generated
    national public controversy were Jusuf Roni (1974)^(24) and Hamran Ambrie (1982).
    The accusations of blasphemy were intimately tied to the accused’s conversion
    from Islam to Christianity. The decision to convert was perceived as a threat
    by the Muslim community because both men previously held well-respected positions
    within the Muslim community and it was feared that it could lead to more conversions
    to Christianity. These cases are of concern to many Islamists as they are remembered
    with a sense of shame and embarrassment.The first well-known case in Indonesia
    of a Muslim who converted to Christianity being imprisoned for behavior that could
    have been classified as insulting Islam under the Blasphemy Law was Jusuf Roni.^(25)
    Jusuf was born into a pious Muslim family in Palembang, South Sumatra, and as
    a child attended a *pesantren*, Islamic boarding school. He claims to have been
    actively involved in the Muslim community while growing up, including as a member
    of the Islamic *Dakwah* Mission and the Islamic Youth Organization (Roni, 2006:
    11). His brother Kemas A. Roni was a well-known Islamic religious teacher in Palembang
    (Roni, 2006: 10). From 1971–72, Yusuf Roni undertook comparative religious studies
    in Bandung, West Java, seeking to find the weaknesses in the Christian faith.
    Jusuf Roni claims that he then converted from Islam to Christianity in his twenties
    as a result of his studies, not because of the efforts of any particular individual
    or church.^(26) In April 1973, he was baptized and soon after that began sharing
    his story occasionally in churches in Bandung (West Java), Surabaya (East Java),
    Kalimantan and Jakarta (Roni, 2006: 23, 30–31).Word of his conversion spread quickly
    and many Muslims were shocked by his speech ‘The story of how I chose Christ as
    my Savior’ (*Gatra*, 5 May 2001). Yusuf Roni earned a reputation as a pastor who
    explained and criticized Islam from the perspective of Christianity. This was
    insulting to Islamists who were angered by his critical depiction of Islam. As
    a result of the tension and public controversy his teachings generated, on 15
    June 1974, he was arrested in Malang by the East Java Special Regional Implementation
    of Operational Command (Kopkamtib).^(27) He had only been in Malang since January
    of that year to undertake further biblical studies at the Indonesian Evangelical
    Institute (Roni, 2006: 31). He was placed under indefinite detention in a military
    detention house (*rumah tahanan militer*). Three weeks later, the government issued
    a warrant authorizing Operation Commando, a division of public order and safety
    of the local government of East Java, to arrest him.^(28)Jusuf Roni spent five
    years in detention without trial before his case proceeded to court. He was convicted
    for intentionally inciting hostility in the community and received a six-year
    jail term.^(29) On 4 April 1980, just several months after the court decision
    was handed down, Jusuf Roni was released from jail as his sentence had been served
    (Letter of Release, 1980). On his release from jail, Jusuf Roni was warned not
    to preach a sermon, conduct religious ceremonies or publish his work. At Christmas,
    he was only permitted to attend a church that was tightly monitored by the government.Since
    1998, Jusuf Roni has experienced greater freedom of expression and assembly. In
    2001, he founded *Gereja Protestan Indonesia* (Indonesian Protestant Church),
    an independent denomination he describes as ‘Judeo-Christianity.’ He also established
    a theological training center, the Jusuf Roni Center, and has published his work.^(30)
    His church, however, is still unable to obtain a permit to build a theological
    school. It purchased a block of land in Jakarta over 25 years ago, but has been
    unable to obtain the necessary permission from the community and local authorities.
    Further, Jusuf Roni has faced criticism from both Muslims and some Christians.
    For example, the leader of the Christian Peace and Prosperous Party (PDS), Ruyadi
    Hutasoit, felt that ‘his [Jusuf Roni’s] sermons are very vulgar [*kasar*] and
    insulting to Islam.’^(31) Theophilus Bela, chairperson of the Jakarta Christian
    Communication Forum, labeled cases like Yusuf Roni as ‘very inflammatory’ and
    perceived by Muslims as an ‘attack’ on Islam.^(32) These opinions are a reflection
    of the broad diversity of approaches within Christianity in Indonesia.In the 1970s
    and 1980s, Hamran Ambrie was also accused of blasphemy, although, unlike Jusuf
    Roni, he died before he was ever imprisoned for or convicted of an offence. Hamran
    Ambrie was born on 13 January 1921 into a Muslim family in Amuntai, South Kalimantan.
    As a child, he attended a school run by Muhammadiyah. He was an active member
    of Muhammadiyah and a preacher of Islam. In 1947, he was chosen to be the chairperson
    of the Kalimantan Muslim Congress in Amuntai, together with KH Idham Chalid.^(33)
    In 1950–51, he served in the army in Banjarmasin as an Islamic religious leader.
    He later worked also a journalist and writer, with articles published in Islamic
    magazines such as *Mingguan Adil* in Solo, *Mingguan Risalah Jihad* in Jakarta,
    and *Mingguan Anti-Komunis* in Bandung. He supported an anti-Christian movement
    in Muara Teweh (Central Kalimantan) and, up until 1962, sympathized with groups
    that aimed to establish an Islamic state in Indonesia.^(34)In 1962, he claimed
    to have come to know Jesus through the verse *al-Ma’idah*,‘The Table’ (Q 5:68),
    which refers to the need to observe the Torah and the gospels. He began to study
    the Bible and explore issues such as the doctrine of the Trinity and Jesus’ death
    on the cross, visiting pastors with his questions. Like Jusuf Roni, Hamran also
    claimed that he converted to Christianity as a result of his own study, not because
    of the influence of any church or person. From 1961 until 1964, he was involved
    in several religious practices: praying according to Islam and attending the mosque
    every Friday; going to an Adventist Church every Saturday; and going to a church
    every Sunday. On 26 December 1969, Hamran Ambrie and his wife were baptized.His
    conversion attracted significant controversy after his Muslim friend and journalist,
    H Arsyad Maran, wrote an article in the newspaper *Harian Utama* in Banjarmasin
    entitled ‘A Prominent Figure of the Movement becomes a Christian.’ In response,
    on 6 May 1972, Hamran wrote an open letter titled ‘Statement of Confession.’ Islamists
    reacted strongly to his confession, and challenged and condemned his decision.
    Despite the public backlash, he continued to publish and lecture, while also working
    at the Bible Society. By 1979, he was regularly invited to participate in public
    debates and speaking engagements on issues of Muslim-Christian relations in Indonesia.His
    publications, however, raised concerns for the chairperson of the national MUI
    Hasbullah Bakry, who strongly disagreed with his interpretation of the Qur’an.
    The Development and Research Commission of MUI conducted an investigation of Hamran
    Ambrie’s publications (MUI, 1995: 27). Then, in 1982, Hasbullah Bakry reported
    Hamran Ambrie to the Attorney-General, Ismail Saleh. As a result, on 11 May 1982,
    the Attorney-General banned the distribution and publication of 19 books written
    by Hamran because the books addressed and challenged issues within Islam from
    a Christian perspective.^(35)This decision was based on the Attorney-General’s
    power to ban books under the Subversion Law, the same law under which Jusuf Roni
    was found guilty.^(36) Letters submitted to the Attorney-General by several churches,
    including the national Protestant council and by Hamran Ambrie himself, failed
    to elicit any response from the Attorney-General.^(37) In addition to the national
    ban, some provincial authorities also banned his books due to outcries from some
    religious leaders. For example, on 18 October 1985, a book written by Hamran Ambrie
    titled *The Doctrine of God’s Oneness and Polytheism* was banned by the provincial
    Ministry of Religion in Central Java. These bans were a public condemnation and
    statement by the government that his teachings ‘deviated’ from Christianity and
    insulted Islam. He was also controversial within the Christian community because
    he developed a theology that insisted on using the term ‘*Yahweh*’ instead of
    ‘*Allah*’ for God, to distinguish converts from their Islamic past.Despite opposition
    from parts of the Muslim and Christian community, in 1987, Hamran Ambrie and fellow
    convert Suradi established the Nehemiah Christian Center in Jakarta, a biblical
    college to further their particular Christian theology. This was Hamran Ambrie’s
    last act, however, as he died later that year before criminal allegations of blasphemy
    could ever be brought against him. It was not until after 1998 that some of Hamran
    Ambrie’s students were convicted for blasphemy in court.Cases like Jusuf Roni
    and Hamran Ambrie are perceived as threats by Islamists because they defy the
    typical stereotypes of why people convert. It is often assumed that Muslims convert
    to Christianity because of financial or material assistance, through the coercive
    means of religious groups, or through marriage (Saeed and Saeed, 2004: 110). In
    both these cases, it appears that Jusuf Roni and Hamran Ambrie made the decision
    to convert to Christianity over an extended period of time as a result of their
    own studies. Neither of these cases led to a conviction of blasphemy, although
    Jusuf Roni was imprisoned under the Subversion Law. Nevertheless, these cases
    created widespread controversy within both the Muslim and Christian communities.
    Muslims took issue with these converts as apostates and with their apologetic
    writings about Islam from a Christian perspective. The Christian community have
    also not welcomed these converts because of differences in opinion over the name
    of God and the use of the term *Allah*. This debate has gained greater prominence
    since 1998 in several more cases of conversions to Christianity.[Names of God:
    Allah, Tuhan or Yahweh?](#07_Contents.xhtml_ch6-4-2)Since 1998, several former
    students of Hamran Ambrie have also been accused of insulting Islam and have created
    controversy within the Christian community over the use of the word *Allah*, God.
    The first is the Suradi Case, which concerned a former student of Hamran Ambrie
    and co-founder of the Nehemiah Christian Center known only by the name Suradi.
    In 1987, he became the leader of the Nehemiah Christian Center after Hamran Ambrie
    passed away. He changed his name to Suradi ben Abraham or Eliezer ben Abraham
    because he believed that all Christians are descendants of Abraham.In 1990, Suradi
    published five tracts titled ‘What is God’s Name?’ He published a Bible that replaced
    some Indonesian words with the original Hebrew word, such as replacing *Tuhan*
    (God) with *Yahweh, Allah* (God) to *Elohim, Yesus* (Jesus) to *Yesua*, and so
    on. He was also involved in the publication of a bulletin, books and cassette
    tapes that were perceived to be insulting to Islam. According to Duta Pranowo,
    general secretary of the Indonesian Bible Society, Suradi also published a version
    of the Bible in which he changed *Allah*, the word used for God in the most common
    translation of the Bible in Indonesian, to *Elohim*.^(38) He also published several
    inflammatory books that criticized the key tenets of Islam, claiming that the
    revelation received by Muhammad was from Satan and that the Qur’an is not a holy
    book. In the February 1991 edition of *Gema Nehemia*, he published the article
    ‘Jesus Christ was Called *Isa Almasih* in the Qur’an.’ The head of the national
    MUI, Hasan Basri, considered Suradi’s claims to be insulting to Islam and reported
    him to the police (*Gatra*, 5 May 2001).Shortly after this, the Bandung Ulama
    Community Forum issued a death *fatwa* against Suradi and another member of the
    Nehemiah Christian Center, H.A. Poernama Winangun.^(39) The *fatwa* was issued
    against Winangun (ben Abraham), alias H. Amos, because he wrote a book in which
    he claimed that the prophet *Isa* (Jesus) is the same as God, that Muhammad raped
    a girl, and that Muslims worship the *Ka’bah*^(40) as an object rather than God
    (*Gatra*, 21 March 2005). As a result of the threat posed by the death *fatwa*,
    it is rumored that Suradi fled to America and so the complaints against him never
    reached the courts. The Nehemiah Christian Center also closed shortly after the
    death *fatwa* was issued.Suradi’s publications, however, were not only considered
    insulting by Islamists, but met with resistance by many from the Christian community
    because of the issue of the name of God. In Indonesia, the Arabic word for God,
    *Allah*, is widely used and accepted by both Muslims and Christians (Steenbrink,
    2003: 1). The reason for controversy in this case is that Suradi was convinced
    that *Allah* should be deleted from the Bible because it is the Arabic word used
    by Muslims for God and in his opinion is therefore not suitable to be used by
    Christians. Many churches strongly disagreed with his claims.Tjen (2008), a linguist
    and consultant for the Indonesian Bible Society, highlights the use of the name
    *Yahweh* or other terms for God instead of *Allah* in four main movements in Indonesia
    spanning from the 1970s to 2000s. These movements include a wide range of Christian
    religious leaders, many of whom established their own church denomination. These
    churches generally promote the idea of ‘going back to the Hebrew roots’ of Christianity,
    and some of them even sing songs or pray in Hebrew during services. This idea,
    that Christians should not use the word *Allah* for God, is usually espoused by
    converts from Islam who feel the need to distance themselves from their Islamic
    past and find a way to distinguish between what they see as the God of Christianity
    and the God of Islam.The debate within the Christian community over the use over
    the term *Allah* is highlighted in a court case initiated by Yeremiah Leonard,
    a theological student, against the Indonesian Bible Society (Lembaga Alkitab Indonesia).
    The Bible Institute originates from the British and Foreign Bible Society set
    up in Indonesia in 1814 and the Dutch Bible Society set up in 1816 (Sairin, 1996b:
    244). It was officially formed in 1954 to print translations of the Bible in both
    Indonesian and local dialects for the Catholic and Protestant community in Indonesia.
    The Indonesian translation of the Bible has long used the word *Allah*.^(41)In
    this application lodged with the court in 2007, Yeremiah accused the Indonesian
    Bible Society of deceiving the Christian community by changing the name of *Yahweh*
    to *Allah*. He argued that the word *Yahweh* should not be translated as *Allah*
    but *Tuhan*, demanded that the Indonesian Bible Society stop printing versions
    of the Bible that use the word *Allah* for God, and asked for an official apology
    from the Indonesian Bible Society. The claim, however, was made without reference
    to any law or breach of an offence, and his lawyer was found not to be qualified
    according to Law 18/2003 on the Legal Profession.^(42) The application was dismissed
    by the court on these grounds.^(43)Aside from the issue of the name of God, there
    have been a number of other cases of high-profile conversions since Suradi. In
    2001, a student of Suradi’s, Endang Yesaya, who converted to Christianity at the
    age of 44, was also accused of blaspheming Islam by the Muslim Communication Forum
    (Forum Komunikasi Jemaat Muslim) of Cicurug, West Java. He persisted with Suradi’s
    use of the word *Yahweh*. Moreover, his publications were perceived as a challenge
    to Islam because he often used quotations from the Qur’an to justify or explain
    the ‘truth’ of Christianity. In 2001, Endang was convicted by a court under article
    156a of the Criminal Code and sentenced to four years’ jail (*Gatra*, 5 May 2001).
    He, along with others such as Jusuf Roni, was listed on the website of the Anti-Apostasy
    Forum (FAKTA), a radical Islamic group, as a one of the ‘founding members of the
    apostasy movement’ in Indonesia.^(44)In another case, in 2001, Pastor Ahmad Wilson
    from Solo (Central Java) was accused of insulting Islam for declaring on a local
    radio station that ‘Before he became Muslim, the Prophet Muhammad was a Christian.’
    The Solo Islamic Youth Front reported Ahmad Wilson to the police, and he was later
    sentenced by a court under article 156a of the Criminal Code to five years’ jail
    for blaspheming Islam (*Gatra*, 5 May 2001). Other controversial public converts
    from Islam to Christianity include Edhie Sapto, a convert from Madura, and one
    of his followers and fellow converts Yosua Adhie, a convert from East Java (see
    ICG, 2010: 3, 14).There are also some high-profile converts from Christianity
    to Islam in Indonesia,^(45)although none have been prosecuted for blaspheming
    Christianity. One example of a high-profile convert is Roger Maramis, now known
    as Yusuf Syahbudin Maramis (son of the former Minister of Finance Alexander Andris
    Maramis), who converted from Christianity to Islam in the 1980s after claiming
    to have received a vision from God (*Republika*, 1 September 2002). Another example
    is Irena Handoko, a former nun and Chinese Indonesian who went public with her
    conversion to Islam and has written articles in Islamic newspapers. Her conversion
    not only caused concern in Catholic circles,^(46) but also in the Muslim community,
    with groups such as ARIMATEA, which aims to prevent apostasy, casting doubt on
    the validity of her conversion (*Sabili*, 1 July 2009). There is no evidence that
    Christian converts to Islam have been convicted of blaspheming Islam, and only
    a small number of Christians accused of blasphemy are ever taken to court.These
    instances of conversion indicate the public controversy surrounding conversions
    from Islam to Christianity, or vice versa. Converts are often disowned by the
    church because of its concern to maintain good relations with the Muslim community.
    The rejection of the use of the term *Allah* by some converts to Christianity
    has been the cause of tension within the Christian community, because they perceive
    those who use the term *Allah* as ‘non-Christian.’ Converts to Christianity also
    face threats and pressure to return to Islam from hardliners. There have also
    been accusations that Christians who are intending to proselytize Muslims are
    insulting Islam.[Evangelical Christians insulting Islam: the Malang Case](#07_Contents.xhtml_ch6-4-3)The
    largest number of people accused of blasphemy in one case was the Malang Case,
    in which 41 Christians were brought to court. The incident concerned a Christian
    prayer meeting in late December 2006, held at the Asida Hotel in Malang, East
    Java. The event was organized by the East Java, Bali and East Nusa Tenggara branch
    of the Indonesian Students Service Organization (Lembaga Pelayanan Mahasiswa Indonesia,
    LPMI). LPMI is an Evangelical Christian organization that is linked to the international,
    American-based Christian organization ‘Campus Crusade for Christ.’ LPMI began
    in Indonesia in 1968 and it is a member of the national Evangelical council, the
    Communion of Pentecostal Churches in Indonesia (Persekutuan Gereja-gereja Pantekosta
    di Indonesia, PGLII).^(47) There were about 100 Christians at this event. Some
    of those who attended wore ‘traditional’ Indonesian Muslim clothing, including
    headscarves for the women, while the men wore sarongs and *kopiah*, a flat, oval
    traditional hat. This event was recorded on video, and the video came to the attention
    of Muslim leaders in the area.Reports are mixed as to the contents of the video,
    with several versions of the video in circulation and claims by LPMI that the
    original video recording of the event had been tampered with. In some versions
    of the tape, participants prayed for the conversion of Muslim political leaders
    and made statements that were insulting to Islam. For example, one participant
    was quoted as saying that the teachings of the Qur’an are deviant and that they
    are the cause of ‘radicalism’ and hatred (Supreme Court, 2008a: 3). In addition,
    the participants placed a Qur’an on the ground and stepped on it, which is considered
    to be highly offensive to Muslims. This is because the verse ‘only those who are
    clean can touch the Qur’an’ is interpreted literally by some Islamists, while
    others emphasize the need for respect of the true meaning of the Qur’an (Q 56:77–79).
    It is also based on other *hadith* that encourage Muslims to place the Qur’an
    in the highest place in a room.In 2007, due to the circulation of the video, the
    leader of the Batu branch of Muhammadiyah and the executive secretary of MUI,
    Muhammad Nidzhom Hidaytullah, submitted a complaint to the police. In April 2007,
    41 Christians, including 36 men and five women, were detained by police in Malang,
    East Java, on allegations of insulting Islam. Another 60 Christians, wanted for
    the same alleged crime, are believed to have fled to the provinces of Bali and
    West Nusa Tenggara.As news of the arrests spread, both local and national Christian
    organizations were quick to condemn the actions of LPMI. For example, on 5 April
    2007, the three largest national Protestant and Evangelical organizations, the
    national Protestant council (PGI), PGLII and Communion of Pentecostal Churches
    in Indonesia (PGPI), issued a media release that condemned the actions of the
    Christians in the Malang Case (Media Release, 2007). These organizations declared
    that the events that occurred in Malang were inconsistent with the values of the
    Protestant Church in Indonesia and condemned the incident for its potential to
    incite issues of ‘SARA’ (ethnicity, religion, race and inter-group relations),
    particularly religious tensions. The media statement also expressed hope that
    this incident would not damage inter-religious relations in Indonesia (Media Release,
    2007). This is also evidence of the extent to which Christian organizations went
    to distance themselves from the accused, as well as from the practices of Evangelical
    organizations, in order to contain the tension and maintain good relations with
    the Muslim community.In May 2007, a meeting of religious leaders from all faiths
    of the General Communication Forum (Forum Komunikasi Umum) took place at the MUI
    office. Protestant leaders condemned the video and branded it as the actions of
    a small minority of Christians outside of the mainstream church. Church leaders
    offered apologies to the Muslim community for the behavior of the Christians at
    the LPMI meeting. This meeting was followed by a service in which 3,000 Christians
    from several different churches applauded a line of Christian speakers who apologized
    to Muslims for the incident (*Asia Sentinel*, 22 May 2007). Muslim and Christian
    leaders therefore worked hard to contain the incident, to the effect that this
    case is not well known in Indonesia outside of Malang. Nevertheless, the case
    still proceeded to court.During the trial, the Prosecution’s arguments were supported
    by the presence of radical Islamic groups Islamic Defenders Front (FPI), Hizbut
    Tahrir Indonesia (HTI) and the Indonesian Mujahidin Council (MMI). On 6 September
    2007, the District Court of Malang sentenced the 41 Christians under article 156a
    of the Criminal Code to five years in prison for blasphemy (District Court, 2007a).
    In November 2007, two of the 41 found guilty appealed to the High Court of East
    Java in Surabaya and their sentence was reduced from five years to three years
    and six months (High District Court, 2007). In 2008, two of the accused appealed
    again to the Supreme Court. The accused alleged that the video relied on as evidence
    by the court of first instance had been tampered with (Supreme Court, 2008a: 11).
    The Supreme Court decided that it could not rule on the issue of the validity
    of evidence, because the court at cassation can only deal with matters of law,
    not matters of fact. The court also highlighted the fact that this incident ‘had
    the potential to cause SARA conflict and seriously insult, defame and hurt the
    feelings of the Muslim community’ (p.4). On 3 April 2008, the court therefore
    refused the request for cassation.The Malang Case demonstrates the remarkable
    influence and management skills of religious leaders, both Muslim and Christian,
    who were able to contain this case and ensure it did not continue to inflame inter-religious
    relations. There have been several other cases of Christians convicted for insulting
    Islam since then. For example, in 2010, Abraham Felix Grady, a 16-year-old Christian
    high school student from Bekasi, was convicted for stepping on the Qur’an after
    the photo of his actions circulated on the internet (ICG, 2010). In 2011, a Christian
    man, Antonius Bawengan, was convicted for five years under article 156a of the
    Criminal Code in the Temanggung District Court (Central Java) for distributing
    pamphlets that contained very explicit and vulgar criticisms of the teachings
    of Islam (District Court, 2011). There have also been some cases of allegations
    of insulting Christianity within the Christian community.[Intra-group disputes](#07_Contents.xhtml_ch6-4-4)There
    have only been three prosecutions for insulting Christianity since 1998\. In all
    cases involving allegations that Christianity has been insulted, the accused claimed
    to be ‘Christian’ but was considered to be ‘deviant’ according to the teachings
    of Christianity. The first case is the Pondok Nabi Case. Mangapin Sibuea, 59,
    was a Protestant pastor for over 16 years, before forming the Pondok Nabi sect
    in 1999 which claimed about 280 followers. He taught that the world would end
    on 10 November 2003\. There were allegations of abuse and reports that some children
    from this group had tried to kill themselves (Rumadi, 2007: 37–44). In 2004, he
    was convicted as the leader of the Pondok Nabi sect under article 156a of the
    Criminal Code and sentenced to two years’ jail for blaspheming Christianity by
    the District Court of Bale Endah, Bandung.In the second case, the leader and six
    followers of the Christian sect known as Zion City of Allah, which is a splinter
    group of the Timor Evangelical Church, were accused of insulting Christianity
    (*Jakarta Post*, 4 June 2009; 6 June 2009). The allegations were based on claims
    that the group instructed its followers not to take communion and forbade wedding
    ceremonies in church. Although originally reported as a complaint filed by the
    Timor Evangelical Church, the leaders of the church claimed they had not filed
    a complaint against Zion City (Constitutional Court, 2010c: 18). On 3 November
    2009, the Kupang District Court sentenced Nimbrot Lasbuan and his followers to
    six months in prison under article 156(a) of the Criminal Code.Another case of
    insulting Christianity was the Last Supper Case, although it did not reach the
    courts. On 8 February 2008, a small, Jakarta-based student group known as the
    Alliance of Christian Students and Youth (Aliansi Mahasiswa dan Pemuda Kristen
    Indonesia) filed a complaint with the police in Jakarta against the weekly *Tempo*
    magazine. The complaint concerned the front page of the 4–10 February 2008 issue
    of the magazine, which depicted a satirical version of Leonardo da Vinci’s ‘The
    Last Supper’ with President Soeharto having dinner with his six children, suggesting
    an analogy between Soeharto and Jesus (*Jakarta Post*, 9 February 2008; 11 February
    2008).The Alliance claimed that this picture blasphemed Christianity. *Harian
    Komentar* (6 February 2008), a newspaper based in the majority-Christian province
    of Manado, described *Tempo*’s cover as ‘certainly offensive,’ because, in its
    opinion, ‘Christians consider the image of the Last Supper to be sacred.’Representatives
    of eight Catholic organizations went to the magazine’s office the next day in
    protest. *Tempo* apologized to the Christian community and this was accepted by
    the national Protestant and Catholic councils, thus avoiding court proceedings.
    This is perhaps comparable to the Monitor Case in 1990, except that it is about
    insulting Christianity, not Islam.^(48) This case also mirrors the Danish cartoon
    controversy, which involved portrayals of the Prophet Muhammad that angered Muslims
    worldwide.^(49)The third case occurred in 2011 when Pastor Hadassah, a Christian
    pastor, was reported to police by former members of her church, who accused her
    of brainwashing children and of claiming to have the authority of God. In 2012,
    she was found not guilty by the Bandung District Court. I will turn now to look
    at the wider social context of insults to Islam as illustrated by the Tasikmalaya
    Apostasy Case.[Contextualizing Muslim-Christian dynamics](#07_Contents.xhtml_ch6-5)The
    Tasikmalaya Apostasy Case was another case of a Christian who had converted from
    Islam being accused of insulting Islam. In the previous sections I explored the
    reasons why particular individuals or groups have been accused of, and convicted
    for, blasphemy. I now turn to examine the history of Muslim and Christian communities
    in Tasikmalaya in order to contextualize the Apostasy Case. The majority of cases
    brought under article 156a of the Criminal Code since 1998 were heard in courts
    in the province of West Java, East Java, Central Java and Jakarta. With the exception
    of Jakarta, the population of these provinces are over 90 per cent Muslim and
    a history of radical Islam. Several factors contributed to the Tasikmalaya Apostasy
    Case, including the history of support for radical Islamic groups; other cases
    of blasphemy in the area; and the push for local regulations based on Islamic
    law, which indicates support for an Islamist agenda.The first Dutch Mission Society
    (Nederlandsche Zendings Vereeniging, NZV) missionaries came to Tasikmalaya in
    the late 1880s. In 1889, A. Muller moved to Tasikmalaya as a missionary of NZV
    along with several Christian families, and opened a school there (Soejana, 1997:
    280). The first baptisms took place in December 1899, involving 19 people from
    three families, most of them Chinese (Soejana, 1997: 281). In 1900, Muller was
    replaced by J.H. Blinde. Once Blinde returned to Bandung in 1903, there were no
    longer any permanent foreign missionaries posted in Tasikmalaya, although a small,
    majority-Chinese Christian community had been established (Soejana, 1997: 443).^(50)
    In 2010, the city of Tasikmalaya had fewer than 800 Christians (BPS, 2010).^(51)In
    terms of the Islamic community, Muslims make up 98 per cent of the population
    in Tasikmalaya. Aside from being known as an area of major support for Darul Islam
    (as discussed in [Chapter 3](#15_Chapter03.xhtml)), Tasikmalaya is commonly referred
    to as the ‘City of a Thousand *Pesantren*.’^(52) This is because there is a strong
    emphasis on Islamic education in the area, with the city of Tasikmalaya boasting
    the five largest *pesantren* (Islamic boarding schools) in West Java.The history
    of support for radical Islamic groups in Tasikmalaya is significant because blasphemy
    cases often proceed to court as a result of violent attacks by radical Islamists
    on the accused or a place of worship. Accusations of blasphemy are often used
    to justify such acts of violence.One of the key instigators in the Tasikmalaya
    Apostasy Case was Kiai Zenzen, the leader of a local *pesantren*, leader of a
    *pesantren* collective known as Forum Silaturahmai Pondok Pesantren, leader of
    the Laskar Brigade Taliban^(53) and of MMI. He claimed that his Taliban Brigade
    (which he emphasized has no links to the Taliban in Afghanistan) aimed to guard
    against *maksiat* (immoral behavior), such as drunkenness, gambling and adultery.^(54)
    He is an example of leaders who rally *santri* to protest for a particular cause,
    such as the demonstration that turned violent against Abraham just hours before
    he was arrested for blasphemy. Aside from the Tasikmalaya Apostasy Case, many
    other groups or individuals accused of blasphemy have had their homes or places
    of worship attacked. Large crowds of radical Muslims often turn up in force at
    the court hearings, as a means of intimidating the judiciary.In particular, radical
    Islamists have also targeted places of worship. The chairperson of the Inter-religious
    Harmony Forum of Tasikmalaya, Uta Widjaya, admitted there are often problems over
    permits for churches in the area. For example, there were issues with a shop owned
    by a Chinese man that was being used as a place of prayer for Christians. In another
    incident, a church building destroyed in an earthquake met with strong protest
    from the community for a permit to rebuild, although this was partly caused by
    confusion over whether the church had obtained a permit for the original building.^(55)The
    Tasikmalaya Apostasy Case is not the only case of blasphemy that has caused tensions
    between Muslims and Christians in Tasikmalaya. In December 1996, a large number
    of churches and other buildings were burnt down in riots, known as *Natal Kelabu*
    (Ash Christmas).^(56) The violence in 1996 was sparked by the Saleh Case. As mentioned
    above, in December 1996, rumors that Saleh had fled to a nearby church after his
    trial for blasphemy led to the destruction of 13 churches, a Confucian temple,
    a Buddhist temple, 89 shops and 12 police stations, as well as factories, schools,
    banks, hotels and vehicles (Purdey, 2006: 58–59). During this period of conflict,
    many Chinese took shelter in government offices and military complexes, which
    fuelled suspicions of collusion between Chinese businesses and local government
    officials (Purdey, 2006: 63).Although ignited by a case of blasphemy within Islam,
    this incident was partly the result of a history of tension between Muslims and
    (Chinese) Christians in Tasikmalaya (Purdey, 2006: 63). The history of anti-Chinese
    sentiment in Tasikmalaya is important because, in the Tasikmalaya Apostasy Case,
    the court noted that Abraham was employed by the local majority-Chinese church
    (District Court, 2006a: 63). The church is a Pentecostal church with about 100
    members, most of whom are of Chinese descent, and it is affiliated with PGI.^(57)
    In December 1996, it was one of the many churches that were attacked. Abraham
    was never a member or employee of the church, but only visited the church on one
    occasion in December 2004 to give his testimony.There have also been other convictions
    for blasphemy under article 156a of the Criminal Code in Tasikmalaya. For example,
    in 1997, Buki Sahidin, an Islamic religious leader, was accused of supporting
    a Jewish agenda because a star found on the ceiling of his mosque was similar
    to the Star of David, a symbol of Jewish identity. Buki had also pronounced himself
    the *Imam Mahdi* (Messiah) and it was suspected that he had links with an international
    network of Jews. He was jailed for five years for blasphemy against Islam under
    article 156a of the Criminal Code (Siegel, 2000: 37–38).In a later example in
    2008, Ishak Suhendra, the Muslim leader of the Martial Arts Institute (Perguruan
    Pencak Silat) Pancadaya Tasikmalaya, was convicted for insulting Islam through
    the teachings in his book *The Reality of Religion*. According to MUI, his teaching
    was false because, for example, he promoted a wrong interpretation of the word
    ‘*basmalah*’ (*bismillah*), he claimed that all religions are true, that there
    are only three rather than five pillars of Islam, and he proscribed 50 *rakaat*^(58)
    in one day, rather than the orthodox position of 17\. MUI issued a *fatwa* against
    his teachings and his group, and he was later arrested and sentenced to four years’
    jail under article 156a of the Criminal Code. The court hearings were attended
    by a large crowd of supporters from FPI, as with many other cases of blasphemy
    (*Republika*, 9 October 2008; District Court, 2008a).In addition to cases of blasphemy,
    there have also been some attacks on the small Ahmadiyah population in Tasikmalaya
    (District Court, 2006i: 21). In December 2010, the Ahmadiyah mosque and facilities
    in Tasikmalaya were closed by the Coordinating Board because of intense pressure
    from FPI.^(59) They claimed that Ahmadiyah had breached the 2008 national Joint
    Regulation banning the activities of Ahmadiyah^(60) and the Joint Decision by
    local authorities to ban the activities of Ahmadiyah in Tasikmalaya in 2005.^(61)
    A further joint decision against the Ahmadiyah was issued in 2007 when a conference
    held by Ahmadiyah on 21–22 April 2007 at a mosque was considered to have breached
    the Joint Decision of 2005.^(62) There have also been rumors of ‘Christianization,’
    such as in 2009 when a Christian group was reported to the police by FPI because
    it was suspected that they had proselytized the victims of an earthquake in Tasikmalaya
    (Front Pembela Islam, 2009).Another factor is the support, largely from radical
    Islamic groups and *ulama*, for several draft religious regulations that have
    been proposed in Tasikmalaya since mid-2000\. Supporters argued that Tasikmalaya
    needs *perda syariah* as a reminder that the foundations of the city are based
    on the religion of Islam.^(63) In the opinion of Mufti, the chairperson of the
    Tasikmalaya branch of Hizbut Tahrir Indonesia, ‘they [HTI] appreciate and value
    the efforts of the government and of the city council to accommodate the desires
    and aspirations of the community to implement Islamic *syariah*.’^(64) Some *ulama*
    and other members of the community established a Committee for the Implementation
    of Islamic Syariah in Tasikmalaya, which was supported by groups such as FPI and
    Kiai Zenzen’s Taliban Brigade. As early as 2001, a proposal for a local regulation
    based on Islam was suggested at a meeting of religious leaders and government
    officials. This proposal was opposed by religious leaders such as Uta Widjaya
    of Nahdlatul Ulama and the Inter religious Harmony Forum. In early 2009, calls
    from some *ulama* for the introduction of *perda syariah* in Tasikmalaya intensified
    (*Republika*, 9 February 2009; 12 February 2009).In September 2009, several years
    of attempts to pass *perda syariah* culminated in the introduction of Regulation
    12/2009 on Development Based on Islamic *Syariah*. Regulation 12/2009 applies
    to all residents of Tasikmalaya, both Muslim and non-Muslim. The first major concern
    addressed by the Local Regulation is *maksiat*, which is defined widely as any
    deed that causes a person to sin and must be avoided including corruption, adultery,
    gambling, alcohol, drugs, abortion, pornography, usury, polytheism and native
    healing, exploitation of women and children, and spreading deviant teachings.The
    second major concern is to address the ‘problems’ raised by groups considered
    to be ‘deviant’ and to promote the ‘true’ teachings of Islam. It requires Muslims
    to uphold the ‘true’ beliefs of Islam and it condemns ‘deviant’ teachings (art.
    6). It aims to protect acts of worship and obliges others to respect the religious
    rituals of others, such as fasting during the month of Ramadan and the pilgrimage
    to Mecca (art. 7). Article 9 focuses on *akhlaq* (morals) and states that a person
    who disturbs ‘public order’ must be ‘rehabilitated.’ Finally, as part of the aim
    of promoting the ‘true’ teachings of Islam, it addresses Islamic education, obliges
    every Muslim to implement *dakwah* activities and requires the local government
    to support these activities. The focus on *dakwah* is partly in response to Christian
    proselytization activities. The Regulation also addressed specific Islamic practices,
    such as Islamic attire.The Regulation was justified on the basis that it was necessary
    because the majority of the city was Muslim and because there was a need to foster
    tolerance between religions. It aimed to educate the community about the teachings
    of Islam and about behavior that is opposed to the teachings of Islam. It also
    endeavored to create pious, faithful Muslims and to ensure that non-Muslims are
    respectful of the teachings of Islam (art. 3). The regulation does not specify
    any punishments such as fines or jail, unlike many other local regulations (see
    Crouch, 2009b), but it is strong on the idea that offenders will be ‘rehabilitated.’
    In 2012, there were reports that plans were underway to establish a *syariah*
    police based on the model in Aceh (*Jakarta Globe*, 6 June 2012).This new regulation,
    and the evidence of support for religious regulations in the city of Tasikmalaya,
    is an indication of the influence of radical Islamic groups in the area, which
    has also led to violence against churches and prosecutions for blasphemy against
    Islam. This examination of tensions at the local level is a reflection of broader
    trends in national debates on the Blasphemy Law. The most prominent example is
    the 2010 case for judicial review of the Blasphemy Law,^(65) which is discussed
    next.[The Constitutional Court and the Blasphemy Law](#07_Contents.xhtml_ch6-6)Given
    the concerns that the Blasphemy Law was being misused to criminalize religious
    difference, in 2009, a coalition of nongovernmental organizations (NGOs) and several
    prominent individuals lodged an application for review with the Constitutional
    Court. The decision of the Constitutional Court articulates several unique elements
    of the Indonesian state-religion relationship (Constitutional Court, 2010a). It
    has also influenced public debate in Indonesia, which is now focused on what kind
    of Blasphemy Law should be in place, rather than whether there should be a Blasphemy
    Law.First, the court emphasized the distinctive Indonesian social and historical
    religious context. The court portrayed state-religion relations in Indonesia as
    distinct given the unique social and historical development of religions and beliefs.
    The sacredness of religion, as well as its highly ‘sensitive’ nature (p.279, 294),
    was emphasized by the court. It focused on the ‘Indonesianness’ (*KeIndonesiaan*)
    of the interpretation of the right to religious freedom in Indonesia, and noted
    the difference between the practice of religion in Indonesia from other countries,
    particularly the West (p.274).Second, the court held that these distinctive features
    mean that Indonesia is essentially a compromise between a secular state and an
    Islamic state. The court noted that there was no strict separation of religion
    and state in Indonesia (p.275). The absence of such a strict separation allows
    for a relationship between state and religion that permits the state to regulate
    the activities of religious communities, while at the same time grants concessions
    to the authority of religious leaders of the recognized religions^(66) who have
    a greater influence over state policies and receive state funding. The court therefore
    reasoned that because Indonesia is a country with a belief in God, it is not an
    atheist country (p.273). This implied that the state does not recognize atheism
    or the right of an individual not to have a religion. The court expressly declared
    that there is no possibility of a campaign for ‘freedom not to have a religion’
    in Indonesia, and that this distinguishes the law of Indonesia from the law in
    the West (p.295).Third, the court recognized the dual nature of the right to religious
    freedom as both an individual right and a communal right (p.295). The communal
    right to religious freedom is also recognized in international law, although Indonesia
    differs in the permissible limitations on the right. While acknowledging the state’s
    international obligations under the International Covenant on Civil and Political
    Rights (ICCPR), the court explained that article 28J(2) of the Indonesian Constitution
    (see [Chapter 3](#15_Chapter03.xhtml)) allows for permissible restrictions on
    the right to freedom of religion or belief (p.276).Finally, based on art. 28J(2),
    the court emphasized the ability of the state to limit religious freedom on the
    broad grounds of ‘public order’ and ‘religious values.’ The limitation of ‘public
    order’ was defined widely to include matters of national stability, reflecting
    concerns that ‘chaos’ might erupt if the Blasphemy Law were cancelled.^(67) The
    court held that the state has the right to intervene in the convictions or beliefs
    of a group and prohibit teachings in the interests of public order. This supported
    the idea that religious ‘deviancy’ leads to social disorder which was expressed
    by many Islamic leaders and government officials throughout the hearing of this
    case.Aside from public order, the other ground that the court implicitly used
    to justify the Blasphemy Law is ‘religious values.’ The court highlighted that
    this category is in addition to the scope of the legal limitations on religious
    freedom recognized in the ICCPR (p.296). Limitations based on ‘religious values’
    were central to the way the court dismissed the applicants’ argument that the
    recognition of six official religions was an unjustified limitation on the interpretation
    of a ‘religion’ and therefore a breach of the rights of religious groups that
    were not one of the official religions. The court rejected the idea that the mention
    of only six religions discriminated against other religions and beliefs. The court
    reasoned that this did not preclude or prohibit a person from practicing another
    religion or belief, and therefore it did not constitute discrimination (p.290).
    This implied that the ‘religious values’ as determined by the religious leaders
    of the six recognized religions protected under the Blasphemy Law are justified
    by this limitation.In contrast to the majority judgment (including one concurring
    opinion), there was one dissenting opinion by the only female Christian judge
    on the bench, Justice Maria Farida (p.308–20). In a short nine-page judgment,
    Justice Farida dissented on the basis that the implementation of the Blasphemy
    Law had resulted in the violation of the right to religious freedom in some cases.
    She reached this conclusion by first tracing the development of the Blasphemy
    Law, and reading this together with the subsequent amendments to the Constitution
    on human rights and laws that acknowledge the right to religious freedom. She
    found that the mention of only six recognized religions in the Elucidation to
    the Blasphemy Law discriminated against *aliran* (mystical beliefs) (p.317). She
    also implied that the Blasphemy Law amounts to state interference in religion
    (p.319), although she did not discuss the specific parameters of the grounds for
    limitations on the right to religious freedom.The decision of the Constitutional
    Court in the Blasphemy Case has ongoing relevance and implications for public
    debate in Indonesia. The affirmation of the constitutional validity of the Blasphemy
    Law means that individuals may still be prosecuted for the offence of blasphemy,
    and the state may also issue an official legal warning to religious groups that
    have ‘deviated’ from the teachings of a religion.More broadly, this case appears
    to have re-energized efforts by the legislature to promulgate a Draft Law on Inter-religious
    Harmony which would include reformulated provisions on blasphemy. The 2011 Draft
    Law on Inter-religious Harmony contained several provisions on blasphemy. The
    basic definition and offence of blasphemy (art. 52) was the same as the Blasphemy
    Law, but it also contained a list of prohibitions against certain behavior that
    could be considered to be blasphemy. This included a prohibition on using spoken
    or written words to threaten another religious community; to publish writings
    or pictures that insult another religious community; or to hold a public performance
    that is not according to the teachings of another religion (art. 44, 49). In comparison
    to the existing Blasphemy Law, this is a more detailed definition of what constitutes
    blasphemy. This may provide greater guidance to the courts, although the offence
    would still only apply to the six recognized religions and so would not prevent
    the criminalization of the beliefs of religious minorities.In 2011, several civil
    society groups proposed alternative draft laws that would place greater emphasis
    on the protection of the religious freedom for all individuals, regardless of
    their religion or belief, or lack of belief.^(68) One of the key features of each
    of these proposals, however, was that they would retain the criminalization of
    blasphemy, although each sought to redefine the offence in different ways. This
    debate remains unresolved, and the content of the criminal offence of blasphemy
    in Indonesia is likely to remain the source of public controversy for some time
    to come.[Conclusion](#07_Contents.xhtml_ch6-7)The Blasphemy Law is a public order
    offence in Indonesia that has led to a string of prosecutions of individuals who
    are accused of insulting Islam. The latest attempt to revise the Blasphemy Law
    through the Draft Law on Inter-religious Harmony 2011 further defines the offence
    of blasphemy, although the draft is unlikely to be passed in its current form.
    Instead, the existing offences have increasingly been used by Islamists to condemn
    ‘deviant’ Islamic groups and to punish Christians considered to have insulted
    Islam by making a public scapegoat of them through criminal proceedings.There
    has now been a large number of people convicted for insulting Islam. A significant
    proportion of these cases have involved Christians who have been accused of insulting
    Islam. This examination of narratives of conversion during the New Order, such
    as those of Yusuf Roni and Hamran Ambrie, shows that they were perceived as a
    threat to political power and provided an opportunity for Soeharto to strengthen
    his alliance with the Muslim community in the 1990s. These converts were not only
    rejected by the Christian community, but were also met with strong opposition
    from the Muslim community. Under the New Order, however, no Christians were convicted
    by a court for the offence in article 156a of the Criminal Code for insulting
    Islam. Instead, there were several highly political cases in which Muslims were
    convicted for insulting Islam, mostly through national publications or through
    *plesetan*, a play on words that was considered to be disrespectful to Islam.Since
    1998, conversions between Islam and Christianity and insults to religion have
    often been the subject of national debate. There has been a large number of people,
    usually the leaders of small Islamic sects, convicted for insulting Islam under
    article 156a of the Criminal Code because their teachings do not conform to a
    particular interpretation of Islam. This chapter has also shown, however, that
    there has been a significant number of Christians either accused of or convicted
    for insulting Islam under the same provision, many of whom were converts from
    Islam to Christianity. This includes the Malang Case in which 41 Christians were
    convicted for insulting Islam because of the video of a prayer meeting in which
    the Christians prayed ‘against’ Islam and stepped on the Qur’an. Although this
    case was addressed swiftly and contained by religious leaders on all sides, it
    demonstrates that radical Islamic groups are actively reporting cases to the police
    and putting pressure on law enforcement agencies to prosecute the accused.The
    Tasikmalaya Apostasy Case is one example of how Indonesia’s general law on insulting
    religion, commonly referred to as the ‘Blasphemy Law,’ is actually used like an
    apostasy law. Since 1998, it has been used to shame and condemn deviants publicly
    within Islam as well as Muslims who have converted to Christianity. This is because
    of the deep concern among Islamists about conversions from Islam to Christianity,
    although there are no statistics to suggest this occurs often. It is also a reflection
    of the way a weak judiciary at the local level can be influenced by hardliners
    to condemn and convict converts publicly in court.Notes1  There is no evidence
