    \ Church Permit Case\n        ##### Purwakarta Church Permit Case\n        #####\
    \ Bekasi Church Permit Case\n        ##### Judicial review in the Supreme Court\n\
    #### Conclusion\n\n## 6. Insulting a religion\n### Tasikmalaya Apostasy Case\n\
    #### Historical trends in court cases\n#### Characteristics of cases post-1998\n\
    #### Christians and converts to Christianity: Insulting Islam\n#### Muslim converts\
    \ to Christianity\n#### Names of God: `Allah`, `Tuhan` or `Yahweh`\n#### Evangelical\
    \ Christians insulting Islam: the Malang Case\n#### Intra-group disputes\n####\
    \ Contextualizing Muslim-Christian dynamics\n#### The Constitutional Court and\
    \ the Blasphemy Law\n#### Conclusion\n\n## 7. Conclusion\n### Muslim–Christian\
    \ tensions in context\n#### Strategies of resistance\n#### Judicialization of\
    \ inter-religious disputes\n#### Conclusion\n\n## Bibliography\n#### Books and\
    \ journal articles\n#### Court documents\n#### Laws and regulations\n#### Newspaper\
    \ articles\n#### Presidential speeches\n#### Reports and other documents\n\n##\
    \ Index\n### Maps\n![Image](Images/2.jpeg)\n*Figure 1* Map of Jawa Barat (West\
    \ Java)Source: (Robert Cribb (2000) Digital Atlas of Indonesian History, NIAS\
    \ Press)\n![Image](Images/3.jpeg)\n*Figure 2* Map of IndonesiaSource: (Robert\
    \ Cribb (2000) Digital Atlas of Indonesian History, NIAS Press)\n\n## Preface\n\
    The field research for this project was conducted over 10 months between 2009\
    \ and 2011 in Depok, Indramayu and Tasikmalaya (West Java), and Jakarta. All translations\
    \ from Indonesian to English in this book are the author’s own, unless indicated.\
    \ The titles of all laws and court decisions have been translated for ease of\
    \ reference. The glossary is based on common Indonesian spelling (with reference\
    \ to Stevens-Tellings (2004); Feders (1995); Esposito (2003)), and Islamic words\
    \ derived from Arabic are specified with.\n\nAn earlier version of some sections\
    \ of `Chapter 5` of the book have appeared in Melissa Crouch (2010) ‘Implementing\
    \ the Regulation on Places of Worship in Indonesia: New Problems, Local Politics,’\
    \ *Asian Studies Review* 34 (December): 403–19. Some parts of `Chapter 6` of the\
    \ book have appeared in Melissa Crouch (2012) ‘Law and Religion in Indonesia:\
    \ The Constitutional Court and Blasphemy Law,’ *Asian Journal of Comparative Law*\
    \ 7 (May): 46. The case study in `Chapter 4` is also discussed in Melissa Crouch\
    \ and J. Finucane (eds) *Proselytisation, Religious Diversity and Indonesia: The\
    \ Offence of Deceiving a Child to Change Religion*, in Asia Series: Singapore:\
    \ Springer.\n\n## Acknowledgements\nPrior to commencing my PhD, I had spent most\
    \ of my time in Indonesia on the outer islands, outside Java. I stayed with Hindus\
    \ in Bali, Christians in North Sulawesi and Muslims in South Sulawesi and Kalimantan.\
    \ I experienced the deep tradition of religious tolerance that runs through the\
    \ Indonesian archipelago, where Christians are commonly invited to attend festive\
    \ parties. This was just one indicator of the threat and violence posed in the\
    \ absence of a strong state. As a lawyer, I questioned the role of the law in\
    \ this context, whether it can help to prevent such situations or only exacerbates\
    \ inter-religious conflict. Along the quest for answers, I have perhaps only discovered\
    \ new questions. This journey, and the book, would not have been possible without\
    \ the generous assistance of many people and the support of many institutions.\
    \ My sincere thanks and appreciation go to my host-country supervisors. 2009,\
    \ Dr Fatimah Husein of the State Islamic University Sunan Kalijaga in Yogyakarta,\
    \ graciously hosted me during my field research. In 2010–11, Dr Amelia Fauzia\
    \ of the Centre for Culture and Religion, and Dr Dina Affrianty of the Centre\
    \ for Islam (PPIM), both of the State Islamic University Syarif Hidayatullah,\
    \ Jakarta, acted as wonderful hosts.\n\n Obtaining my field research visa, a feat\
    \ in its own right, would not have been possible without the generous assistance\
    \ of the Indonesian Consular General and staff at the Indonesian Consulate in\
    \ Melbourne. I am also very appreciative of the assistance of Ibu Fatimah and\
    \ Ibu Amelia in this regard. I am extremely grateful to those who assisted me\
    \ during my field research in Indonesia, and with the transcription of interviews\
    \ in particular. My thanks go to Fatmawati, Sukron Hadi, Sita Maharrani, Evi Agsyana,\
    \ Sudedi Leman and Rahdiatan Tita. I would like to thank the staff at the following\
    \ institutions for their exceptional assistance, patience and administrative support:\
    \ the Asian Law Centre, the Centre for Islamic Law and Society and the Graduate\
    \ Research Office, all at the Melbourne Law School, University of Melbourne.\n\
    \nI am most indebted, however, to my supervisors. I am fortunate to have had two\
    \ exceptional academics as my supervisors and mentors. My thanks go to Professor\
    \ Tim Lindsey for his ongoing support, guidance and critical feedback on my work.\
    \ I am glad he encouraged me to attempt my thesis, and I am extremely grateful\
    \ for the many opportunities he has opened for me. I am also indebted to Dr Amanda\
    \ Whiting for all her encouragement, availability and friendship. I appreciate\
    \ her comparative and interdisciplinary perspective, and her attention to detail.\
    \ Aside from my supervisors, numerous scholars provided critical feedback on drafts\
    \ of the thesis. I am grateful to Professor Abdullah Saeed for his comments on\
    \ an earlier draft of my thesis. I am also indebted to Associate Professor Michael\
    \ Feener for his assistance and insightful comments on an earlier draft. Parts\
    \ of earlier drafts of this thesis also benefited from the feedback of Professor\
    \ James Haire, Professor Charles Coppel and Dr Kate McGregor. I would like to\
    \ thank Professor Carolyn Evans for the opportunity to explore broader issues\
    \ of law and religion in different contexts through my work on her ARC Discovery\
    \ Project, and the opportunity I had to present the results of my work at the\
    \ conference on the ‘Legal Regulation of Religious Groups’ at the University of\
    \ Melbourne in June 2011. I am grateful to the National University of Singapore\
    \ for the numerous workshops at which I had the opportunity to present my research\
    \ and receive valuable feedback on earlier drafts. I am also indebted to the valuable\
    \ comments and suggestions made by my examiners Professor Greg Fealy and Professor\
    \ Gerry van Klinken. I also wish sincerely to thank Professor John Witte, Professor\
    \ Bob Hefner and Associate Professor Anver Emon for their encouragement, guidance\
    \ and assistance in terms of publishing. All errors remain my own. This book was\
    \ financially supported by several generous funds and awards, including an ARC\
    \ Federation Fellowship living allowance scholarship (2008–11); an ARC Federation\
    \ Fellowship travel allowance (2009, 2010, 2011); an Endeavour Award scholarship\
    \ (2009); a travel scholarship to the Asia Research Institute Graduate Conference\
    \ at the National University of Singapore (NUS).\n\n## Glossary\n- `Allah`: God\n\
    - `adat`: local customs\n- `aqidah`: correct belief\n- `agama`: religion\n- `aliran`:\
    \ sect/movement\n- `aliran sesat`: deviant sect\n- `adat`: belief\n- `azab`: Islamic\
    \ words derived from Arabic\n- `islamisasi`: Islamization\n- `fiqh`: jurisprudence\n\
    - `hadith`: report of the sayings and actions of the Prophet\n- `haj`: pilgrimage\
    \ to Mecca\n- `halal`: permissible\n- `halus`: refined/polite\n- `haram`: forbidden\n\
    - `dakwah`: missionary\n- `maksiat`: immoral behavior\n- `mazhab`: school of law\n\
    - `misi`: mission\n- `mushollah`: prayer room\n- `murtad`: apostate\n- `nabi`:\
    \ Prophet\n- `nasrani`: Christian\n- `kristen`: Christian (often used plural of\
    \ nasrani)\n- `ibadah`: ritual worship/devotion\n- `ijtihad`: independent legal\
    \ reasoning\n- `iman`: faith\n- `ijayat`: criminal punishment\n- `jinbab`: head\
    \ covering\n- `kafir`: unbeliever\n- `kasar`: rude/disrespectful\n- `katolik`:\
    \ Catholic\n- `kepercayaan`: belief\n- `kitab suci`: Holy book\n- `klenteng`:\
    \ Confucian temple\n- `pancasila`: Indonesian national ideology\n- `pemekaran`:\
    \ decentralization\n- `pemurtadan`: apostasy\n- `perda syariah`: local regulations\
    \ based on Islamic law\n- `pesantren`: Islamic boarding schools\n- `piagam jakarta`:\
    \ Jakarta Charter\n- `plesetan`: play on words\n- `pura`: Hindu temple\n- `putra\
    \ daerah`: sons of the area\n- `reformasi`: reformation era (post-1998)\n- `rehal`:\
    \ Qur’anic bookstand\n- `santri`: student of Islam\n- `sembako`: nine basic necessities\n\
    - `zakat`: giving of alms\n- `zikir`: recitation of the names of Allah\n"
