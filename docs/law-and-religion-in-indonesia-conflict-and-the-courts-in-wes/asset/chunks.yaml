    disgracing or degrading a religion**penodaan agama** blasphemy, insulting or dishonoring
    a religion**penyalahgunaan agama** misusing a religion**perda syariah** local
    regulations based on Islamic law**pesantren** Islamic boarding schools**Piagam
    Jakarta** Jakarta Charter**plesetan** play on words**pura** Hindu temple**putra
