    of Religion, Belief and Conviction proposed by Indonesian Legal Aid; Draft Law
    on Eradicating Religious Discrimination proposed by the Setara Institute; and
    the Draft Law Guaranteeing the Protection of Freedom of Religion and Belief, proposed
    by the Indonesian Democratic Party Struggle (PDIP).[7  Conclusion](#07_Contents.xhtml_ch7)The
    violence and conflict between Muslims and Christians in Indonesia prior to and
    during the initial years of the transition to democracy, as canvassed in [Chapter
    1](#13_Chapter01.xhtml), has since been brought under control. Ongoing tensions
    and sporadic violence continue to surface, however, in part due to the haphazard
    intimidation campaigns initiated by radical Islamists against Christians and other
    religious minorities. This book set out to consider how Islamists have opposed
    Christian proselytization, the impact this has had on government policies, and
    the influence on the resolution of legal disputes between Muslims and Christians
    post-1998\. These issues were explored through a consideration of the broader
    socio-political context in which these disputes have taken place, the strategies
    of resistance used by radical Islamists, and the increasing resort to legal mechanisms
    to legitimize their claims.In doing so, this book has demonstrated that the cumulative
    effect of a range of Islamist responses – including violence against Christians,
    initiating law reform based on Islamic law, and pursuing prosecutions against
    Christians – have had a significant influence on the three branches of government,
    the executive, legislature and judiciary. This is due to the politicization of
    religion under democracy and the decentralization of power to the local level,
    underlined by ongoing, long-held fears that Islamists have of Christianization.
    This has limited the extent to which the resolution of legal disputes can accommodate
    religious pluralism.[Muslim–Christian tensions in context](#07_Contents.xhtml_ch7-1)There
    have always been tensions between Muslims and Christians in Indonesia, and these
    need to be understood in the socio-political and historical context. This tension
    began with the arrival of Christianity in Indonesia, and the perceived and real
    links between the colonial powers and Christian missionaries under colonialism.
    After independence in 1945, and particularly under President Soeharto (1966–98),
    religious communities were kept under tight control as part of attempts to manage
    the expression and practice of religion in order to maintain political power.
    From the 1950s to the 1970s, however, concerns arose because of reports that emerged
    of a large number of people converting to Christianity, as well as to other religions.In
    1965, President Soekarno issued a regulation that made it an offence to insult
    a religion, now known as the Blasphemy Law. The Blasphemy Law was a concession
    to the growing insistence from Islamists that religious identity must be fixed
    and that religious leaders need to maintain the power to protect the ‘orthodox’
    teachings of their religion. This legitimized the beginning of a campaign continued
    by Soekarno’s successor, Soeharto, to ensure all citizens identified with a world
    religion, as opposed to animism, atheism or communism. The categorization of citizens
    into one of the six recognized religions was one of the primary ways that the
    state sought to control religious communities.Related to the issue of religious
    identity was the debate over proselytization, which concerned whether a person
    who already had a religion could be the target of proselytization. The methods
    used to ‘win’ converts were also a point of contention. In the late 1970s, boundaries
    on proselytization were introduced through regulations issued by the Ministry
    of Religion. These regulations effectively affirmed the position of some Muslim
    leaders who argued that proselytization should not be aimed at a person who already
    has a (state-approved) religion. If proselytization towards a person who already
    has a religion were allowed, it was feared that this might destabilize the idea
    of religious identity as fixed, certain and permanent, and that this could lead
    to public disorder. The regulations also forbid forms of ‘deceptive’ proselytization,
    such as the distribution of free food or financial assistance, which are popularly
    seen as associated with efforts at Christianization in Indonesia. While Christian
    leaders agreed that the distribution of aid should not be used in a deceptive
    manner, they felt that banning proselytization towards people who have a religion
    was an unacceptable limitation on the right to proselytize freely and compromised
    their religious mandate to share their faith. These regulations carry no specific
    legal sanction, however, and have never been actively enforced by the state. The
    antagonism over Christianization, reflected in the development of state policies
    on religion, was exacerbated by the challenges of the transition to democracy
    and decentralization.Prior to 1998, Indonesia was ruled by an extremely centralized
    and authoritarian regime that tightly controlled public and political expressions
    of religion. Opposition to Christian proselytization, as well as the activities
    of other religious minorities, has intensified since 1998 because of the increasing
    opportunities and freedom for all religious groups to practice and express their
    religion and beliefs. Radical Islamists have had a disproportionate voice in public
    debates on religion and law reform because they have often taken the law into
    their own hands with little opposition from law enforcement agencies. Government
    ambivalence towards radical Islamists is partly explained by the persistence of
    corruption and the competitive political environment, which has left political
    parties clamoring for the votes of the Islamic majority.Local politics has become
    increasingly important due to the devolution of power to local governments. The
    case studies in this book illustrate that the distribution of power in the province
    of West Java has been influenced by local histories of Darul Islam and a radical
    Islamic agenda. Efforts to introduce *perda syariah* (Islamic religious regulations)
    at the local level have been supported by both Islamic-based and nationalist political
    parties. For example, such proposals have received support from the Islamic-based
    Prosperous Justice Party (Partai Keadilan Sejahtera, PKS) in Depok, and the nationalist
    political party Golkar in Tasikmalaya and Indramayu.This demonstrates the highly
    competitive political environment, in which support for religious regulations
    cuts across party lines, and the largely symbolic and political nature of these
    laws, which are rarely enforced. Although these regulations generally only apply
    to Muslims, in practice there is ambivalence about their application and non-Muslim
    minorities may feel social pressure to comply. This has placed a strain on Muslim-Christian
    relations at the local level, and has been perceived with concern by Christians
    as well as by progressive Muslims, who agree that it is inappropriate for the
    state to set and enforce such standards. The anxiety felt by the Christian community
    is not because there are Muslim efforts to proselytize Christians, but because
    of the perceived social pressure on non-Muslims to conform to Islamic regulations.
    Similarly, attempts to introduce regulations based on Christianity in West Papua
    have been greeted with concern by Muslims.As the decentralization of power to
    local governments has increased, this has led to the politicization of religion
    at the local level. This is highlighted by three contemporary issues that have
    been the cause of legal disputes between Muslims and Christians: child conversion
    and education; building new churches; and attempts to challenge and therefore
    insult Islam (particularly by converts to Christianity). On each of these issues,
    Islamists have used similar methods to oppose Christian activities.[Strategies
    of resistance](#07_Contents.xhtml_ch7-2)In all of the case studies, three general
    approaches were taken by radical Islamists. First, radical Islamists have used
    violence and threats of violence to campaign against Christianization. Local coalitions
    of radical Islamists have been mobilized to influence local authorities and legal
    proceedings by staging demonstrations at court hearings, placing pressure on the
    judiciary to submit to their demands. In disputes over church permits, radical
    Islamists have been responsible for preventing or delaying the construction of
    churches. In cases of blasphemy, such as the Tasikmalaya Apostasy Case, the person
    accused of blasphemy is often arrested due to vigilantism by radical Islamists
    and the risk of further violence. The vigilante campaigns of radical Islamic groups
    such as the Islamic Defenders Front have wielded disproportionate political power
    due to the ambivalence of the government towards religious organizations that
    use violence to achieve their aims.Aside from vigilante violence, a second strategy
    to resist Christian proselytization has been campaigns for legislative reform
    based on Islamic law. The attention of Islamists has shifted from the failed attempts
    to reinstate the Jakarta Charter to efforts to influence the national and regional
    legislative agenda on key issues such as religious education and proselytization.
    Islamists have used legal and political processes, and institutions such as the
    Ministry of Religion and the Indonesian Ulama Council, to introduce national and
    local laws based on Islam. For example, law reform on religious instruction in
    favor of the religious majority has established legal obligations and placed increasing
    pressure on private Christian schools to provide Islamic religious education for
    Muslim students. Some Christian schools have refused to comply with this arrangement,
    which has only reinforced stereotypes that Christian schools aim to convert non-Christian
    students. Further, the pattern of religious-based regulations in the regions has
    heightened Christian fears of Islamization – that is, that Indonesia might become
    an Islamic state based on Islamic law. Despite the fact that this is highly unlikely
    to eventuate, many Christians perceive that such legal reform would only have
    negative consequences for religious minorities. In addition to the introduction
    of national laws, many Ministerial Regulations remain in place and reiterate the
    New Order agenda of control over religious communities, such as the regulation
    of places of worship. These regulations have been manipulated by Islamists to
    justify vigilante action in the absence of a state response.The third central
    means of opposing Christianization has been the manipulation of legal processes
    and procedures. Radical Islamists have actively reported alleged breaches of these
    laws and pursued prosecutions through the Indonesian Ulama Council and other Islamic
    community organizations. This has placed pressure on law enforcement agencies
    to prosecute individuals for actions that are considered to be offensive to Islam.
    In the resolution of these disputes, democratic institutions, such as the courts,
    are intended to protect the rights of citizens and uphold the rule of law. Instead,
    the courts are generally weak, corrupt and easily intimidated, particularly at
    the regional level. There is an ongoing need to strengthen the independence of
    the judiciary, so that criminal cases concerning religion are decided impartially,
    particularly at first instance in the local courts.[Judicialization of inter-religious
    disputes](#07_Contents.xhtml_ch7-3)The three case studies located in the majority-Muslim
    province of West Java illustrate how inter-religious disputes have become increasingly
    judicialized since the introduction of democracy. Leaders from the Indonesian
    Ulama Council or radical Islamic groups such as the Islamic Defenders Front have
    lodged criminal allegations and pressured the police to investigate issues over
    Christian proselytization as a way of seeking legal legitimacy for their religious
    opinions and authority. Christian leaders have also lodged cases for judicial
    review of legislation or of government decisions with the courts. This demonstrates
    greater recourse to the courts in relation to disputes between religious communities,
    or between a religious community and the government, which is in striking contrast
    to the handful of cases brought to the courts under Soeharto.One of the reasons
    for the occurrence of these cases in court is the concerted agenda of radical
    Islamists at the local level and the pressure they exert on the police and Attorney-General’s
    office to investigate and prosecute. In both the Indramayu Religious Education
    Case and the Tasikmalaya Apostasy Case, it was local religious leaders who reported
    the case to the Indonesian Ulama Council, who in turn lodged a complaint with
    the police. In the Depok Church Permit Case, it was the leader of a local mosque
    who formed a group specifically to counteract the construction of the church.
    In all three cases, there is evidence that these local groups were mobilized,
    encouraged and supported by radical Islamists from outside the area such as the
    Islamic Defenders Front or by criminal gangs such as the Betawi Brotherhood Forum.
    Despite this criminal undercurrent, the perpetrators of vandalism and property
    damage of church buildings often go unidentified and unprosecuted. In cases where
    the perpetrators are put on trial, court hearings have been mobbed by large numbers
    of protestors, which has an intimidating effect. In both the Tasikmalaya Apostasy
    Case and the Indramayu Religious Education Case, the accused were convicted in
    court due to the wide interpretation given to the law and the targeted pressure
    exerted by radical Islamists on court proceedings.The extent to which these disputes
    can be resolved in an independent manner that maintains civil relations between
    Muslim and Christian leaders partly depends on whether the Christians facing criminal
    charges are supported by respected Christian leaders and organizations, including
    political parties. The actions of some accused have been disowned by the wider
    church, such as those accused of blasphemy who are more likely to be evangelical
    or Pentecostal Christians or converts from Islam to Christianity. In other cases,
    the accused has received support from Christian organizations and political parties.
    In the Indramayu Religious Education Case, the three women were widely supported
    by the church, which maintained the view long held by Indonesian Christians that
    the government must not interfere in private religious education. In the Depok
    Church Permit Case, the church had the support of the Christian community, as
    evident from the extensive coverage it received in Christian media. This is partly
    because of the powerful position of the Batak Church within the Christian community
    in Indonesia, the history and influence of Batak lawyers in the legal profession,
    and because many churches across Indonesia identify with problems over permits.
    Some political parties such as the Christian-based Peace and Prosperous Party
    have been ardent supporters of congregations that face opposition to the construction
    of their church. It was also actively supportive of the three women in the Indramayu
    Religious Education Case.In contrast to the first two cases, however, the actions
    of the accused in the Tasikmalaya Apostasy Case were not supported by the church
    or by any Christian political parties. This is often the case in instances of
    blasphemy, especially when the accused has converted from Islam and may be particularly
    zealous in sharing their faith or insensitive in their denunciation of Islam.
    The primary concern of the national Protestant and Catholic councils has been
    to maintain good relations with the wider Muslim community by condemning such
    provocative behavior. The lack of support from Christian leaders, the media and
    political parties, combined with the influence of radical Islamists on law enforcement
    agencies, may be one of the reasons for the inevitability of convictions in cases
    of blasphemy.The resolution of disputes has also been challenged by the emphasis
    placed on the differences between Muslims and Christians in terms of ethnicity.
    In the Depok Church Permit Case, the centrality of Batak culture and its differences
    from Javanese or Sundanese culture emerged. In the Indramayu Religious Education
    Case, Dr Rebekka’s Chinese heritage and the history of a majority Indonesian-Chinese
    church in Indramayu were contributing factors to the opposition in the case. In
    the Tasikmalaya Apostasy Case, Abraham had converted to Christianity and therefore
    challenged the stereotype that to be Sundanese is to be Muslim. These ethnic differences
    are relevant to Muslim-Christian relations because Christians are often seen by
    Islamists as ‘foreigners’ if ethnically Chinese, or as ‘traitors’ if they are
    from an ethnic group traditionally associated with Islam, such as the Sundanese.Increasing
    opposition has also led to a growth in court cases as some Christian congregations
    seek legal remedies concerning disputes over church permits. Christians have been
    active in lodging complaints with non-judicial bodies such as the Ombudsman, as
    well as initiating court action for judicial review of government decisions. As
    research by Paramadina Institute (2012) has demonstrated, many church permit disputes
    can be resolved if a church makes the time and effort to build strong relations
    with the local community and obtain the support of local neighborhood leaders.
    In cases where good relations were not established or have broken down, and local
    authorities have cancelled permits, some churches have taken their cases to the
    courts.The initial court victories of some Christian congregations in the Administrative
    Court regarding judicial review of decisions to cancel church permits provided
    momentum for other churches to take legal action in the face of discrimination
    and threats of violence from radical Islamists. This is evidence of a trend in
    the race to assert new-found democratic rights as religious minorities challenge
    laws and administrative decisions through litigation. The courts have the potential
    to create new checks on the conduct of lawmakers, and provide an avenue for the
    assertion of rights through the judicial process, which for so long have been
    inaccessible due to tight state control. In terms of practical outcomes, however,
    court decisions regarding church permits have had little effect because they may
    not be respected or enforced by local authorities, which are aligned with or under
    pressure from radical Islamists. These cases indicate the need for the national
    government to take a firm stance against the vigilantism of radical Islamists,
    reducing the risk of violent retaliation and therefore increasing the ability
    and willingness of local authorities to implement court decisions.[Conclusion](#07_Contents.xhtml_ch7-4)There
    will always be fears of proselytization between Muslims and Christians because
    a key aspect of both religions is its missionary nature. This book demonstrates
    how both Muslims and Christians, as the two most powerful religions in Indonesia,
    have used legal mechanisms and institutions to address issues of concern between
    the two communities. Under a democratic and decentralized system of law and governance,
    and in the shadow of concerns over Christianization, the rights of the religious
    majority have been exercised in a way that at times deprives or compromises the
    rights of religious minorities. The democratic revolution and shift to decentralization
    in Indonesia has intensified and created greater challenges for religious tolerance,
    acceptance of pluralism and inter-religious relations due to the greater freedoms
    afforded religious groups, in stark contrast to Soeharto’s previous authoritarian
    regime. This has created room for Islamists to exert disproportionate influence
    on the executive, legislature and judiciary in the absence of a strong state.Many
    Islamists continue to promote the need for greater regulation of religious activities
    by the state in Indonesia. Due to the history of opposition between Muslims and
    Christians, the accommodation of Christian proselytization will remain a challenge
    for Indonesian Islam within the framework of democracy. For Indonesian Christians,
    issues of internal disunity and the need to overcome persistent stereotypes of
    Christianization remain ongoing concerns that must be addressed. This may require
    leaders from all sides to reconsider their position on key issues such as the
    boundaries of proselytization, the right to religious education and the tension
    between freedom of speech and religious defamation.Christian proselytization,
    real or perceived, is intimately related to many of the legal disputes that have
    emerged between Muslims and Christians in democratic Indonesia. These disputes
    have raised critical questions about whether religious communities and individuals,
    particularly minorities, can have faith and trust in legal mechanisms and institutions.
    The case study of West Java demonstrates that the broader phenomenon of proselytization
    between the world religions of Islam and Christianity can lead to deep unrest
    and discrimination in local contexts. Proselytization and the extent to which
    it can, and should, be limited by law is an ongoing issue for religious communities.
    Islamist opposition to Christian proselytization remains a key to understanding
    and addressing the escalation of such legal disputes between Muslims and Christians
    in Indonesia.[Bibliography](#07_Contents.xhtml_bib)[Books and journal articles](#07_Contents.xhtml_bib-1)Abd
