    # 德波克教堂许可案法律分析报告


    ## 1. 案件背景与争议焦点

    在此基础上，辩方辩称，由这些未满 15 岁的儿童提供的证据仅是“指导性的”，需要其他证人进行核实（District Court, 2005d: 12）。第二个相关问题是成年人证人证词的权重。辩方认为，证人提供的多数证据是间接信息，即口头证据（`hearsay`）（p.11）。他们引用了《刑法》（`Criminal
    Code`）第 1(27)条，该规定：


    > 证人证据是指刑事案件中的证据，由证人对其亲耳听到、亲眼看到并亲自经历的刑事事件提供的信息，以及其获取这些信息的基础。


    这一规定被理解为对口头证据的禁止。辩方依据此条款辩称，证人提供的多数证据（儿童除外）都是间接的，因为他们没有亲眼看到、听到或亲身经历“快乐主日计划”（`Happy
    Sunday program`）。此外，辩方还认为，由于三位证人未能出庭作证，他们的证词是不可采纳的（District Court, 2005d: 12）。


    ## 2. 法院裁决与法律适用

    法院裁定，六位证人的证词（即 MUI 领导、、校长、一位家长、社区负责人、一名教师和 MUI 调查员）属于**传闻证言**（`testimonium de
    auditu`），即口头证据。法院进一步裁定，四名儿童提供的证据“只能被视为信息性参考”（District Court, 2005b: 23）。


    这留下了两个专家的证据以及三名未出庭作证的儿童的书面证词。根据《刑法》第 185(7)条，未经过宣誓的证据不能单独使用，必须有其他经过宣誓的证据支持。因此，控诉方提交的大多数证据要么不可采纳，最轻也非常薄弱。


    尽管证据存在不一致之处，且需要仔细权衡证据的可采性与既定的可采性规则，但法院仍发现第 86 条（`article 86`）已被违反。这引发了对地区法院能否公正客观地处理宗教敏感案件的质疑。


    ## 3. 关于哈圣训（Hadith）的引用的争议

    案件中的另一个问题是法院引用“哈圣训”（`hadith`，先知者的言论）的方式，尽管它在印尼并不是法律来源。控诉方认为，要判定违反了第 86 条，必须满足以下三个要素（District
    Court, 2005e: 26–28）：


    1. 任何个人；

    2. 故意使用欺骗手段、一系列谎言或诱导儿童选择违背其意愿的非自身自身宗教；

    3. 尽管已知或怀疑该儿童尚未成熟，且根据其所遵循的宗教尚未承担责任。


    第一个要素是显而易见的。关于第二个要素，控诉方依赖于宗教部专家证人`Abdul Wachid Syakuri`的证词。`Syakuri`辩称，根据宗教部长和内政部长关于宗教传播和海外向宗教组织捐赠的`1/1979`号裁定，对已有宗教的人进行传教是被的（District
    Court, 2005b: 15）。正如第 2 章（`Chapter 2`）所述，第 4 条规定，宗教传教活动不能针对已经有宗教的个人或群体，正如其身份卡上所示。几乎每个印尼尼人的身份卡上都有一个“宗教”。


    控诉方辩称，老师们通过给儿童提供小礼物和零食作为“贿赂”违反了第 4(a)条。控诉方认为，因为首批参加计划的穆斯林儿童收到了这些礼物，这吸引了其他穆斯林儿童参加计划（p.5）。他们还声称老师通过给其中一名儿童一本圣经违反了第
    4(b)条，尽管关于儿童是否主动要求的这一点尚有争议。


    辩方认为，最重要的要素是**意图**（`intention`）（District Court, 2005d: 12–14）。他们辩称，该计划主要是为了基督儿童的精神利益，并帮助他们获得良好的成绩单。他们认为，给儿童的礼物本身并不是诱导或欺骗的证据，而是对良好行为的奖励（District
    Court, 2005d: 1）。他们强调郊游只是为了好玩，并没有试图洗礼儿童，因为这并非计划的目的。


    ## 4. 宗教身份与转化

    关于要求儿童穿着印有教会标志和十字架图案并在下方印有教会名称的蓝色 T 恤，是否构成了试图转化儿童尝试，这一点存在争议。该计划运行了三次郊游活动：前往`Taman
    Mini`、动物园和游泳池。辩方辩称，T 恤仅是为了身份识别目的，且是团体外游的常做法。


    控诉方认为，要求穆斯林儿童穿这种制服是尝试“基督教化”（`Christianization`）的一部分（p.6）。法院认为穿着基督教制服是基督教活动计划的一部分，该计划仅针对基督徒（p.22）。


    辩方还辩称，儿童通过参加`sholat`（每日祈祷）和去清真寺仍然遵循伊斯兰教（District Court, 2005d: 14）。因此他们断言第 86
    条的要素并未满足。法院的判决并未解释这一结论的逻辑。法院似乎接受了控诉方对第 86 条的解释，并认定妇女违反了该条款，即在没有父母同意的情况下允许穆斯林儿童参加基督教教育（District
    Court, 2005b: 19–22）。



    '
