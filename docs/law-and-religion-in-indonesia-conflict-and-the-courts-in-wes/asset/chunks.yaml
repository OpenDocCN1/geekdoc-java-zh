    17(2).19  Presidential Decree No. 1/PNPS/1965 on the Prevention of the Misuse/Insulting
    of a Religion (referred to in Indonesia as the ‘Blasphemy Law’).20  Law 5/1969
    Declaring Presidential Decrees and Presidential Regulations as Law.21  Saeed and
    Saeed, 2004: 50; An-Na’im, 2008: 122\. For a detailed discussion on freedom of
    expression in Islam, including apostasy, see Kamali, 1998: 212–35.22  For example,
    in 2002 the Majelis Mujahidin Indonesia (Indonesian Mujahidin Council, MMI) proposed
