    亵渎法中使用的印尼语短语是 `penyalahgunaan dan/atau penodaan agama`，意为滥用、诋毁或侮辱宗教。在印度尼西亚，穆斯林和基督徒都使用几个术语来描述此类行为，且经常互换，包括
    `penodaan agama`（亵毁宗教）、`penistaan agama`（侮辱或诽谤宗教）以及 `penyalahgunaan agama`（滥用或侵用宗教）。被指控亵渎的人可能被称为
    `murtad`（叛教者）、`kafir`（不信教者）、`aliran sesat`（邪教）、`sesat`（异端）或 `aliran kepercayaan`（神秘信仰）。这些术语的使用强化了神秘信仰与宗教之间的区别（详见第
    3 章），并表现出对保护某宗教宗教正统教义的关注。


    《亵渎法说明》明确，被告必须是蓄意对某种宗教进行侮辱或表现出敌意（第 4 条）。客观且避免使用攻击性词汇或短语的书面或口头陈述不被视为该条款下的犯罪行为。《说明》通过阐述违法者扰乱了宗教社区，并被认为背叛了国家意识形态
    `Pancasila` 及其第一个要素“信独一”，以此证明了严厉惩的合理性。


    这一规定似乎并非基于任何现代伊斯兰法原则，但这可能是因为在伊斯兰教中，对“亵渎”的定义没有普遍共识。在伊斯兰教中有几个相关的术语，包括 `riddah`（叛教）、`sabb
    Allah` 和 `sabb al-Rasul`（亵渎神或先知）、`zandaqah`（异端）、`nifaq`（伪善）和 `kufr`（不信），尽管在实践中并未对这些术语做出区分（Saeed
    and Saeed, 2004: 36–42）。传统伊斯兰对叛教的惩罚是死刑，尽管一些学者认为《古兰经》并没有这一惩罚的权威依据（Saeed and Saeed,
    2004: 56, 69–87）。只有印度尼西亚的激进伊斯兰主义者才会同意执行传统惩罚。亵渎案在第 6 章中进行了更详细的探讨，并显示了此类犯罪起诉和定罪数量的增加。


    新秩序政府面临监管力的第三个领域是教堂的建设。


    ## 教堂焚毁与许可 (#07_Contents.xhtml_ch2-5)


    20 世纪 60 年代，几座教堂因被指建在穆斯林地区或基督徒侮辱了伊斯兰教而被毁。1967 年 4 月，位于亚齐（Aceh）Melauboh 的一座方法公会教堂被毁（Hasyim,
    1979: 291–93）。这是首批引发国家性辩论的教堂事件之一。该事件被称为“梅拉乌博事件”（`Peristiwa Melauboh`），据报道，人们对该教堂提出反对是因为它建在穆斯林占多数的地区。教堂随后在另一个地区重建。


    在此事件发生后，基督教政党 `Parkindo` 的成员 Simorangkir（见第 3 章）于 1967 年 6 月与苏哈尔托总统会面，并向立法机构（`Dewan
    Perwakilan Rakyat`）就梅拉乌博事件和宗教自由权提起了 `interpelasi`（正式质询）（Hasyim, 1979: 293–98）。6
    月 10 日，此举遭到了来自 `Muhammadiyah` 的 Lukman Harun 提出的 `interpelasi` 反击，该质询得到了支持伊斯兰背景政党的议会议员的支持，质疑宗教组织接受外援的行为（Aritonang,
    2006: 128; Hasyim, 1979: 298–308）。这暗示梅拉乌博的教堂是依靠外资建造的。


    1967 年 10 月，在苏拉威锡岛的望加达，14 座教堂、三所学校和一处天主教学生办公室遭到进一步攻击。该事件被称为“望加达事件”（`Peristiwa
    Makassar`），是穆斯林青年对一名基督教教师 `H.K. Mangunbahan` 的言论做出反应，他声称穆哈默德不识字，且与其九位妻子通奸（Hasyim,
    1979: 314–20）。这是由于认为对伊斯兰教产生了侮辱而产生的报复和破坏建筑行为（见第 6 章）。


    与梅拉乌博事件类似，1969 年，雅加达 Slipi 的一座教堂被毁，该地区已有五座教堂供 350 名基督徒居住（Hasyim, 1979: 321–22）。除了声称在穆斯林占多数的地区没有必要教堂外，还有人投诉教堂未获得当地许可。这些事件导致人们要求在建造教堂前执行许可程序。


    由于媒体对这些事件的报道以及立法机构提出的质疑引发了争议，一项法令被起草并实施，但并未咨询伊斯兰教、天主教、新教和佛教代表。1969 年 9 月 13 日，宗教部长
    `K Haji Dahlan` 和内政部长 `Amir Machmud` 正式引入了 1969 年法令，以控制宗教活动和宗教场所建设。该法令的目的是确保宗教团体在建造宗教场所之前，从当地政府、宗教部和当地宗教领袖处获得许可。


    从一开始，许多基督徒就反对该法令。1969 年 10 月，印尼教会理事（`Dewan Gereja-gereja`, `DGI`）和主教高级委员会（`Majelis
    Agung Wali Gereja`, `MAWI`）发布联合备忘录反对该法令，理由是其具有歧视性并违反了宪法第 29 条的宗教自由规定（PGI, 2006:6–29）。这些宗教少数的投诉遭到了支持该法令的穆斯林的公开反驳。穆斯林领袖将教堂发生的暴力事件作为证据，证明在“穆斯林地区”建造教堂导致了宗教冲突。1969
    年法令的引入以及穆斯林限制基督教活动的运动，使得伊斯兰主义者获得了实施监管的支持。


    ## 教教活动的限制 (#07_Contents.xhtml_ch2-6)


    1967 年，部分是为了回应穆斯林对皈入基督教的担忧，宗教部在雅加达召集了宗教领袖，旨在建立一个宗教委员会并对传教活动的边界达成共识。此次会议由主要社会政治宗教组织的代表参加（Sairin,
    2000:97）。宗教部长在开场辞中指出，会议的原因是需要对某些宗教“系统性尝试”将穆斯林转化为其宗教的行为做出回应，这间接了了传教（Sairin, 2000:205）。政府准备了一份声明草案，强调宗教对话的必要性。其中包含一项规定：所有宗教都同意不尝试转化已有宗教的人。


    然而，由于穆斯林和基督徒代表之间的意见严重分歧，草案从未签署。穆斯林代表拒绝参加与基督徒的宗教对话，但支持禁止针对已有宗教的人进行传教活动（Mudzhar,
    1996:231）。基督徒代表同意参加宗教对话，但强烈反对建议的传教限制，因为在他们看来，这将损害基督徒履行信仰和传播其宗教的自由。


    结果，会议被视为失败，指责指向了基督徒。一家报纸将结果报道为“僵局”，标题将基督徒定为过错：“天主教/新教拒绝宪章”（Sairin, 2000:135）。根据当时担任总统英语顾问的天主教神父
    Frans·马格尼斯·苏森诺的说法，苏哈尔托对国家新教和天主教委员会非常愤怒，因为这是这些委员会首次直接并公开反对他政府的立场。在五位伊斯兰领袖（包括来自
    `Muhammadiyah` 和 `Nahdlatul Ulama` 的领袖）随后发布的一份声明中，指责基督徒“拒绝了政府停止对已有宗教的人进行宗教传教的想法”（Sairin,
    2000:206）。这并非明确基于任何宗教或伊斯兰教义，而是当时政府官员和伊斯兰宗教领袖的务实立场。然而，印尼乌理玛委员会（2010–15）宗教和谐部门主席
    Maskyuri Abdillah 教授认为，这种想法可能与伊斯兰教概念“你们有你们的宗教，我有我的宗教”有关有关（《古兰经》109:6）。


    20 世纪 70 年代，公众辩论中再次出现对基督徒未能尊重其他宗教“边界”的担忧。例如，1974 年 8 月 16 日，在纪念穆哈默德从麦加迁往麦地的仪式上，苏哈尔托对宗教组织发布警告：“为了不扰乱其他群体的情绪，你们必须小心对已有宗教的人进行传教”（Natsir,
    1980:31）。


    1975 年 9 月，印尼乌理玛委员会主席与苏哈尔托会面，讨论了“基督教化”问题，引用了诸如通过食物和其他物质供应将穆斯林转化为基督教的案例（Mudzhar,
    1996:231）。随后在 1976 年，`MUI` 的一项决定强调了过去几年几位部长的讲话原则，即人不应通过经济激励来转化已有宗教的人（Sairin, 2000:207）。特别是，这项决定强调了不应利用缺乏教育者、病人或儿童的弱点，以及不应进入私人住宅。该决定确认了苏哈尔托早前的表态：“不应对已有宗教的人进行传教”（Hasyim,
    1979:424）。


    该条例规定（第 2 条）禁止以下宗教传教：


