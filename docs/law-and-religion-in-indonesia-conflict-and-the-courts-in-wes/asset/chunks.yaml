    Shari’a.’ It included the offence of apostasy in article 28, for which the penalty
    was execution unless the offender repented (Lindsey and Kingsley, 2008: 303).
    This proposal has not been passed as law in Indonesia and is unlikely to be in
    the future (Lindsey and Kingsley, 2008: 312).23  *Kiai* is the Javanese title
    given to Muslim religious scholars, while *Haji* refers to a man who has made
    the pilgrimage to Mecca. This is usually abbreviated to the initials ‘KH.’24  For
    quotations and a discussion of the 1967 conference, see Natsir, 1980: 11–19; Sairin,
    2000: appendix 2; Hasyim, 1979: 393–416.25  Interview with Father Frans Magnis
    Suseno, 4 November 2010.26  See Decision of the Minister of Religion 44/1978 on
    the Implementation of Religious *Dakwah* and Morning Lectures on the Radio. For
    a more detailed explanation see Mujiburrahman, 2008: 80.27  For an analysis of
    the role of Muhammad Natsir and the emergence of DDII, see Feener, 2007: 83–106.28  Interview
    with KH Said Agil Siradj, chairperson of NU (2010–15), 8 November 2009.29  Sembako,
    or Sembilan Bahan Pokok, refers to the nine necessities for daily living in Indonesia:
    rice, sugar, fuel, salt, salted fish, cooking oil, coffee, eggs and flour.30  *Republika*,
    24 November 2008\. The controversial activities of some evangelical churches in
    Bekasi are explained in detail in ICG, 2010.31  See *Republika*, 10 September
    1999; *Republika*, 7 January 2000.32  Gideon’s International is a Christian organization
    that was founded in America in 1889 by business men who decided to provide Bibles
    for hotels. It claims to be one of the largest distributors of Bibles, particularly
    to hotels, around the world today: [www.gideons.org](http://www.gideons.org).33  See
    Sairin, 1996a: 453–76\. For a detailed analysis of Christian responses, see Mujiburrahman,
    2008: 83–84.[3  Religious ideology, representation and reform](#07_Contents.xhtml_ch3)When
    a state experiences regime change and embarks on a transition to democracy, this
    process is inevitably influenced by key actors within the community, such as religious
    leaders. Since 1998 and the fall of former President Soeharto and his authoritarian
    New Order regime (1966–98), religious communities have attempted to assert newly
    found democratic rights through legislative reforms concerning matters of religion,
    at both the local and national level. In particular, the state has responded to
    pressures from Islamists for change on matters of religion by revising and introducing
    numerous laws in an attempt to regulate religious activities in a way that favors
    the Islamist goal of implementing Islamic law at the national and regional level.This
    chapter examines the representation of ideology in state institutions and law
    reform in relation to disputes between Muslims and Christians. It analyses how
    Muslims and Christians use government institutions and legal processes to reform
    laws that regulate religious affairs. Through these mechanisms, it demonstrates
    that Islamists have had a significant influence on law reform, with the result
    that majority rights are at times exercised at the expense of minorities.One of
    the major issues of dispute, both within the Muslim community, and between Muslims
    and Christians, is the ideological foundation of the state, and whether Indonesia
    should become a state based on Islamic law. After the initial failure of this
    debate in 1945, there was an attempt to resurrect this proposal in 2000 through
    the efforts of Islamists to reinsert into the Constitution the Jakarta Charter,
    the obligation for Muslims to follow Islamic law. This chapter analyses the failure
    of this campaign and the implications for the status of the Pancasila state ideology
    and the right to religious freedom, particularly for the rights of religious minorities.The
    key government department that regulates and oversees religious affairs is the
    Ministry of Religion. This chapter examines how Islamists are working through
    the Ministry of Religion, and the Indonesian Ulama Council (MUI) in particular,
    to campaign for national law reforms based on Islamic law. It also examines the
    corresponding national Catholic and Protestant councils and questions whether
    these organizations still represent the Christian community in post-1998 debates
    on public policy in Indonesia.Both the status of the Jakarta Charter and the role
    of the Ministry of Religion have been the subject of vociferous national debate.
    Since 1998, the processes of decentralization and democracy have shifted power
    to the local level and opened up greater freedoms and authority for local governments
    to pass laws on religion. This has relocated debates on law and religion from
    the national to the local context. This book focuses on the province of West Java,
    the location for the three case studies that follow in [Part II](#15_Part02.xhtml),
    because it is a majority-Muslim area where many incidents of violence between
    Muslims and Christians have taken place. It identifies contributing factors, such
    as the history of radical Islam, state ambivalence towards the violent actions
    of radical Islamists, and a competitive political environment. This has led to
    the politicization of religion, the introduction of local regulations based on
    Islam, and the criminal prosecution of religious minorities for offences against
    religion in court. This chapter will contribute to an understanding of the legal,
    institutional and social context of the court cases that follow in [Part II](#15_Part02.xhtml).[Constitutional
    compromise and the limits of religious freedom](#07_Contents.xhtml_ch3-1)There
    have been two main issues of concern for Muslims and Christians regarding the
    relationship between religion and the Constitution since 1998: the constitutional
    changes to the right to freedom of religion, and the failed attempt to make Indonesia
    an Islamic state by constitutional amendment. There have been several major reforms
    since 1998, including the release of political prisoners, the separation of the
    police from the military, the separation of the judiciary from the executive,
    the ratification of several international conventions, and the holding of free
    and fair elections. There have also been significant amendments to the Constitution.¹
    An ideological compromise has taken place, with priority given to the Pancasila
    over an Islamic state, and the consolidation of the right to religious freedom,
    with some important qualifications.During the drafting process of the original
    1945 Constitution, there was considerable debate about the inclusion of the right
    to religious freedom and whether it should include the freedom to change religion.
    Many of the Christian participants in the debate, such as Renda Sarungallo Sihombing,
    of the Christian political party Parkindo, argued that the Constitution should
    include the freedom to change religion and that reluctance to do so indicated
    that the state was concerned that it would be accused by Islamists of promoting
    conversions between religions (Nasution, 1992: 202). Several members of Christian
    political parties, such as I.J. Kasimo, chairperson of the Catholic political
    party Partai Katolik, and Rumambi (Parkindo) supported the proposal to include
    the right to change religion (Nasution, 1992: 203). In 1953, this position was
    reaffirmed by a resolution adopted by the national Protestant council, which upheld
    the freedom to change religion and to propagate a religion (Nyhus, 1987: 517).On
    the other side of the debate, Muslim leaders focused on the need for legitimate
    limitations on the right to freedom of religion for the sake of maintaining ‘religious
    harmony.’ Some participants in the drafting process of the 1945 Constitution,
    such as Oemar Salim Hubeis of the Islamic political party Masjumi, vehemently
    argued against the inclusion of such a provision. If such a provision had to be
    included, however, he argued that it should not apply to Muslims, presumably because
    of the teachings of Islam against apostasy.²In the end, the original Indonesian
    Constitution 1945 included the right to freedom of religion under article 29,
    although it did not specify whether this includes a right to change religion.
    Article 29 reads as follows.³1  The state shall be based upon the Belief in the
    One and Only God.⁴2  The state guarantees all persons the freedom of religion
    and worship, each according to his or her religion and belief.Since 1998 and the
    transition to democracy, the right to freedom of religion has been reaffirmed
    by the state. Article 22 of Law 39/1999 on Human Rights states that:1  Each person
    is free to profess his/her religion and to worship according to his/her religion
    and belief.2  The state guarantees all persons the freedom of religion, each according
    to his/her religion and belief.This right to religious freedom is tempered by
    art. 70 of the Law 39/1999 on Human Rights, which allows for permissible limitations
    on the right to religious freedom:⁵In the enjoyment of their rights and freedoms,
    each person is obliged to submit to the limits determined by law, with the sole
    purpose of guaranteeing recognition and respect for the rights of others and to
    fulfil the requirements of justice and taking into consideration morality, security,
    and public order in a democratic community.In 2001, this right was further reinforced
    in the Second Amendment to the Constitution,⁶ and art. 28E was inserted as part
    of a new chapter on human rights, as follows:1  Each person is free to profess
    his or her religion and to worship in accordance with his or her religion …2  Each
    person has the freedom to possess convictions and beliefs, and to express his
    or her thoughts and attitudes;3  Each person has the freedom to associate, gather
    and express his or her opinions.This right is important, although this book does
    not analyze Muslim-Christian relations from the perspective of international law
    and the right to freedom of religion. Rather, it focuses on local understandings
    of religious freedom that demonstrate ‘freedom of religion’ has become a common
    discourse and catchcry employed by religious minorities and supporters of religious
    pluralism particularly since 1998.In addition to the omission of the right to
    convert, the Constitution also includes the phrase derived from Arabic, *keimanan
    dan ketakwaan*, ‘belief and piety,’ in the revision to article 31 on education
    to the 2002 constitutional amendment. This is perceived by some Christians as
    an Islamic phrase that *berbau Islam*, literally meaning ‘smelling of Islam,’
    or inspired by Islam.Article 28I also includes the right to have a religion, and
    it confers on the government the responsibility of protecting and guaranteeing
    these basic human rights.⁷ In October 2005, the Indonesian government’s commitment
    to freedom of religion at international law was reinforced by the ratification
    of the International Covenant on Economic, Social and Cultural Rights and the
    International Covenant on Civil and Political Rights (ICCPR).⁸ This is considered
    to be a significant step forward by human rights activists and nongovernmental
    organizations (NGOs), particularly because these two covenants became part of
    Indonesian law.⁹ The Indonesian government is therefore bound by the Constitution,
    international law and domestic laws on human rights to respect the right to freedom
    of religion of its citizens. The right to freedom of religion, as enshrined in
    the Constitution, is also significant because it is increasingly used as the basis
    to submit requests to the Constitutional Court for judicial review of national
    laws on religion that are considered to be unconstitutional, as I demonstrate
    later in the case studies.It is equally important to note the constitutional limitation
    that has been placed on the right to freedom of religion in Indonesia. This limitation
    is referred to by the government to justify its policies that regulate religious
    affairs and set boundaries around activities and the rights of religious minorities
    in particular. This restriction is contained in article 28J(2) of the Constitution:In
    the enjoyment of their rights and freedoms, each person is obliged to submit to
    the limits determined by law, with the sole purpose of guaranteeing recognition
    and respect for the rights of others and to fulfill the requirements of justice
    and taking into consideration morality, religious values, security, and public
    order in a democratic community.This list of permissible limitations is similar
    to art. 18 of the ICCPR at international law, with the main exception being that
    the Indonesian Constitution lists ‘religious values’ whereas the ICCPR does not.
    Further, although the right to religious freedom in theory also applies to religious
    minorities in the Indonesian context it is often used to justify the protection
    of the rights of the religious majority. For example, in 2010, this provision
    formed part of the reasoning of the Indonesian Constitutional Court in its decision
    to uphold the constitutional validity of the Blasphemy Law.^(10)In this case,
    the court emphasized that this provision is different from article 18 of the ICCPR
    and is an explicit and legitimate limitation on the right to religious freedom
    in the Indonesian context (p.276). It stated that the ‘Pancasila is the basis
    of the state’ and stressed that the state is neither secular nor Islamic (p.271).
    It went on to explain how the state formed the Ministry of Religion shortly after
    independence in order to ensure religious harmony and the right to religious freedom,
    as well as to regulate necessary restrictions on this right (p.275). The decision
    of the Constitutional Court therefore reinforced the legitimacy of state limitations
    on the right to religious freedom. The limitation in article 28J(2) has also been
    relied on by government bodies such as the Ministry of Religion to justify its
    policies. At international law, however, the general comments to the ICCPR on
    freedom of religion assert that state restrictions on the freedom of religion
    must be narrow.^(11)Aside from the right to and limitations on freedom of religion,
    public discourse in Indonesia since 1998 has focused at length on whether Indonesia
    should become an Islamic state based on *syariah* law.^(12) To understand the
    campaign that took place in 2000, it is necessary to return to the circumstances
    surrounding the creation of the 1945 Constitution when the proposal was first
    made.The drafting of the 1945 Constitution sparked the first of many debates about
    the relationship between law and religion in Indonesia. An initial draft of the
    Constitution, known as the *Piagam Jakarta* (Jakarta Charter),^(13) included the
    seven words ‘with the obligation to carry out *syariah* for adherents of Islam.’
    If this draft had been passed, the inclusion of the seven words would effectively
    compel all Muslims to follow Islamic law, although it did not amount to the creation
    of an Islamic state (*Negara Islam*) (Hooker and Lindsey, 2002: 264–65). This
    phrase was later omitted from the final draft of the 1945 Constitution after concerns
    over the obligations *syariah* would impose on Muslims, and how this might affect
    non-Muslims in particular. This was a cause of concern for Christian leaders and
    Christian-majority provinces, which threatened to secede and therefore endanger
    the internal unity and stability of the newly independent country (Indrayana,
    2008: 15). A large part of the opposition to the Jakarta Charter in 1945 also
    came from within the Muslim community (Dijk 1981: 52), which indicates the diversity
    of opinions within Islam on the relationship between Islam and the state. This
    is important and although this book focuses on the role of Islamists, it recognizes
    the inherent diversity and spectrum of views within the Muslim community in Indonesia.Given
    the failure of the Jakarta Charter at independence, the Pancasila became the defining
    ideology of the Constitution and the state, and was perceived by many as a necessary
    compromise between the two most powerful religious communities in Indonesia: Islam
    and Christianity. It consists of five elements: belief in Almighty God, humanitarianism,
    nationalism, democracy and social justice. The first element of the Pancasila
    uses the word *Tuhan*, not *Allah*, referring to the Indonesian concept of God
    used by many religions, rather than the specific Arabic term *Allah* used by Muslims
    (Monnig-Atkinson, 1983: 688). The Pancasila was also a way of fending off unwanted
    accusations that Indonesia is a ‘secular’ state, as the Pancasila is symbolic
    of the willingness of the government to accommodate religion (Drijarkara, 1959:
    40).Throughout the New Order (1966–98), President Soeharto protected and ‘fostered’
    the Pancasila (Hefner, 2000: 128), although more as a tool of social control than
    out of concern to protect religious pluralism. In the 1980s, the Pancasila was
    imposed by the government on all social and political organizations, displacing
    religion as the sole basis of such organizations.^(14) As the guiding reference
    point and ideology for the nation, the Pancasila was continually reinforced through
    government speeches. For example, in 1995, the former Minister of Religion Tarmizi
    Taher (1993–98) characterized Indonesians as people who adhere to the Pancasila
    and practice one of the five (now six) recognized religions; who refrain from
    directing missionary activities towards people who already have a religion; and
    who have the responsibility of promoting religious harmony (Taher, 1997: 56).
    Therefore, although religious freedom was included in the 1945 Constitution, this
    right was essentially subordinate or subservient to the Pancasila, the centralization
    of state power and the desire for social control over religious communities.The
    fall of Soeharto’s authoritarian regime in 1998 led to a new era of openness and
    political debates on the nature and basis of the state. In 2000, the Jakarta Charter
    was again proposed for inclusion in the Constitution by a small Islamic political
    faction consisting of the United Development Party (Partai Persatuan Pembangunan,
    PPP) and the Crescent Star Party (Partai Bintang Bulan, PBB), which at the time
    occupied only 71 seats, or 12 per cent, of the legislature (Hosen, 2007: 4). This
    agenda was also supported with demonstrations from radical Islamist groups such
    as the Islamic Defenders Front (Front Pembela Islam, FPI) (Indrayana, 2008: 243,
    383).The majority of Indonesian Muslims, however, rejected this proposal, including
    many leaders and members of two largest Islamic groups in Indonesia, Nadhatul
    Ulama and Muhammadiyah, and the political parties to which they are linked, the
    National Awakening Party (Partai Kebangkitan Bangsa, PKB) and the National Mandate
    Party (Partai Amanat Nasional, PAN), respectively (Hosen, 2007: 198). These organizations
    argued that Islam does not need to be implemented formally, that is, in the Constitution.
    They also expressed fears that if the Jakarta Charter were introduced, it might
    re-ignite inter-religious tensions and threaten the rights of minorities (Tanthowi,
    2008: 16–17).There was also strong opposition to this proposal from religious
    minorities, especially Christians. In Christian-majority areas, such as Kupang
    (East Nusa Tenggara), demonstrations were held and threats were made to secede
    from Indonesia if the proposal were passed (*Tempo*, 5 November 2001). This debate
    again reflects the highly diverse nature of Indonesian Islam, because it not only
    concerned fears that Christian-majority areas may seek independence from Indonesia,
    but also reflected the lack of consensus among Muslims about what *syariah* law
    is or might look like in Indonesia (Lindsey, 2008: 36). It was also rejected by
    other minorities, such as the majority-Hindu population of Bali (*Tempo*, 14 August
    2000). The proposal ultimately garnered little support and, in August 2002, the
    People’s Consultative Assembly (Majelis Permusyawaratan Rakyat, MPR) rejected
    the proposal for the inclusion of *syariah* in the Constitution.The reaffirmation
    of the Pancasila ideology, to the detriment of an Islamic ideology, suggests there
    is greater support for religious diversity and pluralism or at least for maintaining
    the status quo of the six religions. Since 1998, many NGOs have sought to redefine
    and reinterpret the Pancasila as a more open, inclusive and tolerant ideology.
    There are many examples of this, but one of the most prominent occurred on 1 June
    2009, when a demonstration was held at the National Monument (known as ‘Monas’)
    on the 63rd anniversary of the Pancasila. The peaceful rally organized by the
    National Alliance for Freedom of Religion and Faith^(15) was intended as a show
    of support for the Pancasila, religious freedom, and the rights of religious minorities
    such as Ahmadiyah, an Islamic sect that claims to be within Islam. The rally was
    attacked by around 400 members of radical Islamic groups, including the Islamic
    Defenders Front (Front Pembela Islam, FPI), Hizbut Tahrir Indonesia (HTI), and
    the Islamic Community Forum (Forum Ukhuwah Islamiyah, FUI), armed with clubs or
    sticks. They violently attacked the peaceful demonstrators, including women, leaving
    over 70 injured with some in need of hospitalization and surgery (see Crouch 2009a).
    This incident suggested, among other things, that the idea of an inclusive Pancasila
    is still opposed by those who support an Islamic state. It also indicates that
    law enforcement agencies lack the will to prevent radical Islamists from using
    violence to achieve their aims, which means that such groups remain an ongoing
    threat to those they target, such as religious minorities.The debates over and
    changes to the Constitution have been part of the wider transition to a democratic
    and decentralized society, which has created more opportunities for religious
    resurgence and for both Muslims and Christians to proselytize as part of their
    democratic rights. The Pancasila, which includes the ‘belief in Almighty God,’
    remains the central ideology for the state. The Ministry of Religion is the government
    department responsible for ensuring ‘inter-religious harmony’ (*kerukunan umat
    beragama*) by implementing policies that limit the right to religious freedom,
    which, as I explain below, has implications for the limits of proselytization.[The
    religious bureaucracy](#07_Contents.xhtml_ch3-3)[Institutionalizing Islam: The
    Ministry of Religion](#07_Contents.xhtml_ch3-3-1)On 15 July 1945, in the lead-up
    to independence, an initial meeting was held with representatives from various
    political and religious organizations to discuss a proposal for a Department of
    Religion.^(16) A Christian representative from Maluku, Johannes Latuharhary, opposed
    the idea, arguing that the appointment of a Minister of Religion could cause conflict
    depending on whether he or she was Christian or Muslim (Dijk, 1981: 62). Many
    others agreed with him, including Abdul Abbas, a Muslim representative from Sumatra,
    and Raden Iwa Kusumasumantri, a nationalist. With only six of 27 members voting
    in favor, the initial proposal for a Ministry was rejected and responsibility
    for religious affairs was placed under the Department of Education (Dijk, 1981:
    63).Six months later, however, on 3 January 1946, the proposal was again raised,
    this time with wider support, and the Ministry of Religion^(17) was officially
    formed (Sairin, 2000: 92).^(18) The Ministry was largely a compromise with Muslim
    groups after the failure to include the seven words in the 1945 Constitution (Boland,
    1982: 105–6). This is evident in the dominance of Islam in the Ministry from its
    inception. Initially, the proposed title was the ‘Department of Islamic Affairs’
    (Fealy, 2003: 156). Up until 1954, a number of religious scholars at a national
    conference tried to declare the Ministry as part of a temporary Islamic state
    in Indonesia (Geertz, 1976: 212). Even the logo and motto of the Ministry is distinctly
    Islamic: the logo is a Qur’an resting on a *rehal* (Qur’anic bookstand), and its
    motto includes the Arabic-derived words *ikhlas beramal* (sincere commitment to
    service) (Fealy, 2003: 157).^(19) Over the years, the Minister of Religion has
    always been a Muslim.^(20)Nevertheless, the Ministry included a Directorate-General
    for each of the six recognized religions (see Lindsey 2012: 111). There are also
    two additional directors-general specifically for Islamic religious education
    and for the *haj* and *umroh* (pilgrimage to Mecca).^(21) The Ministry’s focus
    on Islam reinforced fears amongst non-Muslims of ‘Islamization,’ that is, a state
    based on Islamic law (Hefner, 1998: 111). This evident bias has been a point of
    contention for religious minorities since its inception (Boland, 1982: 106).The
    establishment of the Ministry became an avenue to control public expressions of
    religion while supporting private religious observance. It promoted the idea that
    every citizen should have a single, fixed religious identity and adhere to one
    set of religious doctrines and beliefs (Steenbrink, 2003: 234). In particular,
    it sought to clarify the debate over the terms religion (*agama*) and local traditions
    (*adat*) or beliefs (*kepercayaan*), and the distinction between these two categories.^(22)The
    Ministry strengthened the distinction between government control over *agama*
    (religion) and *aliran kepercayaan* (mystical beliefs). The term *agama* comes
    from Sanskrit and refers to ‘a traditional precept, doctrine, body of precepts,
    or collection of such doctrines, anything handed down and fixed by tradition’
    (Gonda, 1973: 499). Islam and Christianity are both considered ‘religions’ (*agama*)
    in Indonesia, as opposed to ‘mystical beliefs’ (*aliran kepercayaan*).^(23) According
    to Monnig-Atkinson (1983: 687), *agama* has strong associations in Indonesia with
    both Islam and Christianity, and to notions of power, wealth, political privilege,
    nationalism and literacy, due to the introduction of these religions through trade
    and colonialism. A common phrase used is ‘*orang yang belum beragama*’ – that
    is, a person who does not yet adhere to one of the official religions, which also
    implies that conversion to a ‘religion’ is inevitable (Monnig-Atkinson, 1983:
    688–89). The Ministry therefore differentiates between religion (*agama*), which
    has been officially recognized and sanctioned, and belief (*kepercayaan*), which
    is discouraged and sidelined (Steenbrink, 1999: 282–83).Further reinforcing perceptions
    of bias towards Islam, prior to 1998 one of the Ministry’s main roles was the
    supervision of the Islamic Religious Courts.^(24) In 1998, the Ministry was stripped
    of this power it shared with the Supreme Court to administer the Religious Courts
    (*Pengadilan Agama*).^(25) Despite this, the Ministry is still one of the primary
    vehicles for Muslims to advocate for Islam in public policy.The role of the Ministry
    in overseeing the Religious Courts until 1998 was perceived by some Christians
    as an underhanded way of introducing Islamic law and as a government favor to
    Islamic groups. The formalization and unification of the Religious Courts in 1989
    was a cause for great debate between Muslims and Christians.^(26) The draft law
    was taken as an indication that the government intended to bestow greater power
    and authority on the Islamic Courts (Hisyam, 2002: 307). The jurisdiction of the
    Religious Courts, however, is restricted to matters of marriage and divorce, wills,
    inheritance, *wakaf* (charitable trusts) and, since 2006, *syariah* economics.^(27)
    The majority of cases in the Religious Courts concern issues of marriage and divorce,^(28)
    and the Religious Courts have therefore become ‘divorce on-demand courts for women’
    (Hooker and Lindsey, 2002: 282). The main reference point for the Religious Court
    judiciary is the Compilation of Islamic Laws, which covers issues of marriage,
    inheritance, religious trusts (*wakaf*) and divorce. Introduced through Presidential
    Instruction 1/1991 on the Compilation of Islamic Laws, the Compilation describes
    itself as a ‘guidebook’ and is not legally binding, not even on the Religious
    Courts (see generally Lindsey, 2012: 69–101).Since 1998, Islamists have exerted
    power and influence through the Ministry of Religion, alongside MUI, in drafting
    ‘Islamic’ laws and defending a particular interpretation of Islam. Some national
    laws based on *syariah* did exist prior to 1998\. In addition to the Religious
    Courts and the Compilation of Islamic Law, there were also changes in policy such
    as the founding of the Indonesian Association of Muslim Intellectuals (Ikatan
    Cendekiawan Muslim se-Indonesia, ICMI);^(29) the establishment of Islamic banking
    through Bank Muamalat Indonesia; the cancellation of the ban on wearing the *jilbab*
    (headscarf) in schools;^(30) and the abolition of the state lottery (Azra, 2004:
    139). These changes were introduced in the 1990s as part of Soeharto’s limited
    openness to cultural Islam (Boland, 1982: 164). Hefner (2000: 109) highlights
    a less well-known policy change in the 1990s:One of the least noted of the president’s
    many concessions [to Islam] at this time was his instruction that the DDII [Dewan
    Dakwah Islamiyah Indonesia] be allowed to operate in villages in Central and East
    Java where, a generation earlier, nominal Muslims had converted to Hinduism and
    Christianity.These changes increased fears of ‘Islamization’ among Christians,
    that is, that Indonesia will become an Islamic state under Islamic law.(Hefner,
    2000: 18–19)In the *reformasi* era, Islamists have been active in lobbying for
    the implementation of *syariah* law through the Ministry. For example, the system
    of *zakat* (tithe) has been upgraded to a law and further revised in 2011.^(31)
    Another change has been in the area of *wakaf*, that is, the ‘pious endowment
    given by Muslims for the support of Islamic religious activities’ (Federspiel,
    1995: 283), for example property, such as a grant of land to a mosque or *pesantren*
    (Islamic boarding school). Under the New Order, this system was administered by
    government regulation and guidelines were set out further in the Compilation.^(32)
    Since 2004, the management of *wakaf* has been established formally as a national
    law.^(33) Islamic banking is another example. In 1998, state permission for the
    establishment of *syariah* financial institutions in Indonesia was granted.^(34)
    By late 2005 debate began on a Draft Law on Syariah Banking (*Perbankan Syariah*)^(35)
    and it was later passed in 2008.^(36)Further legislative reforms have addressed
    the administration of the *haj*, the pilgrimage to Mecca. Before 1968, the *haj*
    was run by private companies in Indonesia. Under Soeharto, the government asserted
    control over the organization of the *haj* by creating a Directorate-General for
    the *haj* under the Ministry and regulating the process through several Presidential
    Decisions.^(37) In 1991, Soeharto also personally made the pilgrimage to Mecca
    which was widely interpreted as a show of support for the Muslim community. Then,
    Law 17/1999 on the *Haj* introduced reforms to the government organization of
    the *haj*. Despite this, there have been ongoing complaints of corruption, poor
    management and inadequate service in regards to the organization of the *haj*.
    In 2005, these complaints culminated in the conviction of former Minister of Religion
    Said Agil Hussein Al Munawwar (2001–04), and his former subordinate Taufiq Kamil,
    on charges of embezzling more than Rp 700 billion (A$77 million) of *haj* funds
    (*Jakarta Post*, 7 October 2005). Partly in response to this controversy over
    the mismanagement of funds, Law 13/2008 on the *Haj*^(38) was introduced to reaffirm
    the Ministry’s role as the sole organizer, with the additional supervision of
    an independent committee consisting of government officials and members of MUI.^(39)Not
    all proposals for laws to regulate religious affairs or introduce Islamic law
    have been successful. In fact, one of the Ministry’s unsuccessful campaigns in
    the area of inter-religious relations is its attempts since the 1980s to pass
    a law on inter-religious harmony, which includes limitations on proselytization.
    As early as 1982, the Ministry of Religion proposed a Draft Law on a System of
    Religious Harmony (Aritonang, 2004: 419). A similar draft law was proposed in
    1989 and again in 1997 (Aqsha *et al*., 1995: 93–97; Aritonang, 2004: 419). In
    2002, the Ministry recommenced discussions about the possibility of a Law on Religious
    Harmony. In December 2003, the Research Office of the Ministry held a press conference
    to introduce a Draft Law on Inter-religious Harmony (*Tempo Interaktif*, 2 December
    2003).The 2003 Draft Law sought to address issues such as missionary activities;
    religious ceremonies and celebrations; places of worship; family issues; and blasphemy.
    It effectively aimed to collate and upgrade many of the Ministerial Regulations
    on religion to a law, as well as reinforce many MUI *fatawa*. The proposal for
    such a law has received little support because of sharp divisions on its merits.^(40)
    Expressions of support for the draft came from prominent figures such as a board
    member of MUI, Dr Amidhan Shaberah. He argued that there is a need for a code
    of ethics and guidelines among religions, that such a law is needed to help maintain
    inter-religious harmony, and that it would benefit religious minorities in particular
    by protecting their rights (*Republika*, 9 December 2008).Groups against the Draft
    Law included the National Human Rights Commission (Komnas HAM), the Indonesian
    Communion of Churches (PGI), the Bishop’s Conference of Indonesia (KWI), the late
    former President Abdurrahman Wahid, and inter-religious harmony groups (*Jakarta
    Post*, 17 March 2000; *Sinar Harapan*, 13 August 2003). Representatives of these
    organizations argued that attempts to legislate harmony alone would not work and
    feared it could be used by the state to restrict proselytization unnecessarily
    (Bela, 2004). The 2003 Draft Law was also perceived to be against the principles
    of democracy, the Pancasila and the Constitution, and to discriminate against
    minority religions. Prominent scholar Djohan Effendi stated that the Draft Law
    should not be endorsed because it constitutes unwarranted state intervention in
    religious affairs (*Jakarta Post*, 24 June 2004). These groups created significant
    opposition to the Draft Law. In 2011, a new Draft Law was proposed by Commission
    VIII of the legislature, yet this draft also generated further public controversy
    and again was never formally proposed in the legislature (see Crouch, 2013). Although
    the Draft Law on Inter-religious Harmony remained on the 2011–14 legislative agenda
    at time of writing, it was unlikely to be passed in its current form.In addition
    to failed proposals for reform, there have also been criticisms and calls for
    reform of the Ministry of Religion itself. In 1999, not long after the downfall
    of Soeharto, Abdurrahman Wahid, the then president, proposed to abolish the Ministry
    on the premise that it constituted government interference in religious affairs
    and breached the separation of state and religion. At the time, this proposal
    drew strong criticism from many circles, including leaders from Nahdlatul Ulama
    (NU) (*Jakarta Post*, 28 June 2002). In June 2002, there were suggestions that
    the Ministry should be replaced by a joint office to promote religious harmony
    across the country. Prominent scholars such as Komaruddin Hidayat of the State
    Islamic University Syarif Hidyatullah, and Ulil Abshar Abdalla of the Liberal
    Islamic Network (JIL), supported the proposed abolition of the Ministry (*Jakarta
    Post*, 28 June 2002). This was based on the need for greater accountability of
    public funds and the proposal for the Ministry’s responsibilities to be privatized,
    such as the administration of the *haj*. Further, in order to promote efficiency
    and avoid an overlap of administration, it was suggested that some of the Ministry’s
    roles could be divided up and more competently dealt with by existing government
    departments, such as the Department of Education also overseeing the provision
    of religious education. Despite the doubts cast on the credibility and integrity
    of the Ministry, the proposal to abolish the Ministry failed to gain momentum.These
    criticisms of the Ministry suggest that some have taken an overly optimistic view
    of the potential role of the Ministry. For example, Boland (1982: 107) claims
    that the Ministry:offered the possibility for religion, in particular for Islam,
    to function as effectively as possible in state and society; and, that in a Muslim
    country, this Ministry formed a useful middle way between a secular state and
    an Islamic state.Although he suggested that it is useful for Islam, he failed
    to mention the negative influence it may have on other religions or beliefs. In
    fact, the Ministry’s explicit acceptance and favorable treatment of six recognized
    religions is to the neglect of other religions as well as beliefs. It is only
    these six religions that have national councils and are regularly consulted or
    included in decision-making processes of the Ministry. Moreover, the key body
    that represents the entire Muslim community within the Ministry of Religion is
    the Indonesian Ulama Council, which is strongly supportive of efforts to implement
    laws based on Islam, which, as will be shown, are often exercised in a way that
    compromises minority rights.[*Establishing state-sanctioned* ulama: *The Indonesian
    Ulama Council*](#07_Contents.xhtml_ch3-3-2)The Indonesian Ulama Council claims
    to be the inheritor of conferences of Islamic religious leaders held in 1947 and
    1952\. A provincial Indonesian Ulama Council was first established in West Java
    as early as 1957, led by KH Muhammad Sujai (Mufrodi, 1994: 88). In 1975, a national
    Indonesian Ulama Council was created as a quasi-government institution under the
    Ministry. It was established on 26 July 1976 with *ulama* representing the then
    26 provinces (MUI, 2009). Chaired by Haji Abdul Malik Karim Amrullah, a prominent
    Islamic religious leader, writer, politician and activist within Muhammadiyah
    who came to be known as ‘Buya Hamka,’ MUI gradually established branches at the
    regional level across Indonesia. This was originally part of Soeharto’s plan to
    control the *ulama* and the public expression of Islam (Hooker, 2003: 60). According
    to Mudzhar (1996: 236), the reason MUI was formed so late in comparison to the
    other national religious councils (discussed below) is because Islamic leaders
    feared that it might be used or manipulated by the government further to subordinate
    Islam. One view, therefore, is that the New Order used MUI as a means to disseminate
    government policies to the Muslim community, primarily through *fatawa* (Mudzhar,
    2002: 317).A *fatwa* is a non-binding pronouncement by a qualified Islamic religious
    legal scholar on an issue, belief or practice made in the context of past interpretations
    (Federspiel, 1995: 59). The dynamics between MUI *fatawa* and state policy are
    complex, although a *fatwa* is not recognized as an official source of law by
    the state or the courts in Indonesia. A study by Mudzhar (1996: 236) found that
    most *fatawa* issued from 1975 to 1988 were supportive of government policy at
    the time, such as the 1984 *fatwa* on family planning. In the 1970s, the government’s
    approach to family planning failed because it had not convinced religious leaders
    of its policy and many *ulama* still taught that it was *haram* to use the pill
    or other family planning methods (Taher, 1997: 27–28, 57). In contrast, when MUI
    issued a *fatwa* in the 1980s, it lent greater credibility to the government’s
    family planning program. In this way, *fatawa* were a convenient means for the
    government to legitimate its policies in religious terms in the eyes of the Muslim
    community.An alternative view is that the *fatwa* of the Indonesian Ulama Council
    informed and inspired government policy. Adams argues that *fatawa* based on Islamic
    law were influential in the drafting and passage of legislation based on the aspirations
    of the Muslim community and Islamic law (Adams, 2004: 1–2). He cites over ten
    laws that were influenced by the *fatawa* of MUI, the advice of MUI to the government,
    the submission of recommendations by MUI to the legislature and by the participation
    of MUI as a member of legal drafting teams.^(41) Adams also argues that MUI was
    instrumental in opposing policies that contravened Islamic law. For example, the
    *jilbab* or *kerudung* (headscarf) was initially banned in schools in Indonesia.^(42)
    On 12 October 1990, MUI sent a letter to the Department of Education and Culture
    requesting the cancellation of the decision. Then on 16 February 1991, the Director-General
    of Education and Culture issued a decision that permitted the *kerudung* to be
    worn as part of school uniform in schools (Adams, 2004: 165). Therefore, MUI had
    some influence in overturning policies that it saw as opposed to Islamic law.Since
    1998, MUI has become more independent of the government. For example, in 2000,
    the ideological basis of the organization was changed from the Pancasila to Islam
    (Hasyim, 2012). In terms of its members, MUI claims to represent the entire Muslim
    community in Indonesia. At times, however, its position has not reflected the
    diversity and divergence of opinion within the Muslim community, but instead appears
    to represent the interest of Islamists.The two largest Islamic groups are Muhammadiyah
    and Nadhatul Ulama. Muhammadiyah is a modernist movement founded in Central Java
    by Ahmad Dahlan in 1912.^(43) It claims 35 million followers.^(44) Modernists
    reject *taqlid*, the practice of following the decisions of religious authorities,
    and believe that ‘the gate of *ijtihad*’ (the interpretation of legal sources)
    remains open (Hosen, 2005), and may be less tolerant of *adat* (local customs)
    which they see as leading to religious syncretism or relativism (Barton and Fealy,
    1996: vii). Modernist Muslims seek to purify the faith by returning to the Qur’an
    and *hadith* (Sayings of the Prophet) to discern God’s will for society (Hooker,
    2003: 230). One reason for the establishment of Muhammadiyah was to oppose and
    compete with the activities of Christian missionaries at the time.^(45)The other
    major organization represented by MUI is NU, which has grown since 1926 to become
    the largest Islamic organization in the world, boasting 50 million members with
    a particularly strong base in rural Java (Mujani and Liddle, 2004: 111). It was
    essentially a reaction to Muhammadiyah and aimed to preserve tradition. Traditionalists
    follow *taqlid*, the opinion of the *ulama* (religious scholars), rather than
    *ijtihad*, independent legal reasoning (Hosen, 2003). Members generally organize
    around *pesantren* (private Islamic boarding schools) and are often more tolerant
    of *adat* (local customs and traditions) (Fealy and Hooker, 2006: 40–41). As Mujani
    and Liddle (2004: 121) found, NU and Muhammadiyah are generally tolerant of other
    religions and do not usually object to Christians teaching in public schools,
    or to Christians building churches in Muslim residential areas.MUI also represents
    the interests of ‘Islamists,’^(46) that is, individuals or groups who strive to
    replace the existing system of governance with an Islamic legal system.^(47) This
    aim is not surprising for a country with a majority-Muslim population, although
    the corresponding attitude of Islamists to non-Muslims raises broader concerns.
    For example, one study has shown that Islamists are less tolerant of non-Muslims,
    and are more likely to object to non-Muslim neighbors, a Christian teacher in
    a public school, or the building of a church in the neighborhood (Mujani and Liddle,
    2004: 188). Islamists are also more likely to disagree with democratic principles
    such as the recognition of minority rights and equality before the law (ibid.:
    119). Although Muhammadiyah is largely considered to be a modernist organization,
    it is sometimes associated with Islamism because, historically, more Indonesian
    Islamists have come from a modernist rather than traditionalist background (ibid.:
    121).Islamists, or ‘hardliners’ (*garis keras*) as they are known, are found across
    a broad spectrum of organizations in Indonesia (Lindsey 2011: 2). One important
    distinction is between Islamists who are willing to use violence, and those who
    are not. This book will use the term ‘hardliners’ or ‘radical Islamists’ to refer
    to the minority of Islamists who advocate and sanction the use of violence to
    implement Islamic teachings in the political and legal order of society. These
    ‘radical Islamists’ include groups such as the Islamic Defenders Front (Front
    Pembela Islam, FPI),^(48) Hizbut Tahrir and the Indonesian Mujahidin Council (Majelis
    Mujahidin Indonesia, MMI).^(49)One section of the Islamic community of which MUI
    is perhaps least representative is those who call themselves ‘progressive Muslims,’
    the convergence of traditionalism and modernism characterized by a respect for
    classical learning with openness to modern influences and the West.^(50) Progressive
    Muslims are individuals or organizations who believe that the message of the Qur’an
    and *hadith* need to be reinterpreted in light of current social conditions and
    that Muslims must be more tolerant towards one another and towards non-Muslims.
    This includes many liberal Islamic groups or inter-religious harmony organizations
    initiated by Muslims that have flourished since 1998, such as the Liberal Islamic
    Network (Jaringan Islam Liberal) and the Wahid Institute. In 2005, the Indonesian
    Ulama Council issued a *fatwa* that banned pluralism, liberalism and secularism
    (MUI, 2005: 58–65). In the explanation to the *fatwa*, MUI identified secularism
    and liberalism as Western concepts that lead to relativism, the idea that all
    religions are the same. It singled out the Liberal Islamic Network as a proponent
    of these ideas, and denounced pluralism as wrong. The issuance of this *fatwa*
    suggested that MUI represents the voice of Islamists.[National Christian councils:
    Representing Christianity?](#07_Contents.xhtml_ch3-3-3)Christians are also represented
    in the Ministry of Religion. There is an historical distinction between Protestants
    and Catholics in Indonesia due to the colonial legacy. Christians may be referred
    to, or refer to themselves, as *Nazarani* or *Nasrani* – that is, followers of
    Jesus of Nazareth. There are various explanations for the use of this term. Stevens
    and Schmidgall-Tellings (2004: 658) claim that the term *Nasrani* was formerly
    used in Indonesia only to refer to Roman Catholics, while Protestants were known
    as *Masehi*, that is, followers of the Messiah, but that it is now used to refer
    to both Catholics and Protestants. My informants generally suggested that it was
    usually well-educated people who use the term *Nasrani*.^(51) This is considered
    more polite (as opposed to *Kristen*) because it is the translation of the Arabic
    term for Christian used in the Bahasa Indonesia version of the Qur’an (for example,
    2:113).The state and its institutions, such as the Ministry of Religion, generally
    use the term *Kristen* for Protestants and *Katolik* for Catholics. This clear
    distinction between Protestants and Catholics can be traced back to the initial
    policies of the Dutch government, which distinguished between Protestant and Catholic
    churches and only permitted one church to work in any given area (as discussed
    in [Chapter 2](#14_Chapter02.xhtml)). As Steenbrink (2003: 231) notes, ‘the choice
    between the two branches of Christianity became nearly as important as the one
    between Islam and Christianity.’ As new streams and expressions of Christianity,
    such as Pentecostalism and Evangelicalism, emerged in Indonesia, they were generally
    categorized as Protestant (Haire, 1981: 85). Over the years, however, the Christian
    community has grown beyond this simple Protestant–Catholic divide, and it must
    now be questioned whether the national councils still represent Christianity in
    Indonesia.^(52)There are two Christian councils within the Ministry. Catholics
    are represented by the national Bishops Council of Indonesia (Kantor Waligereja
    Indonesia, KWI).^(53) This institution was established in 1955 as the High Council
    of Indonesian Bishops (Majelis Agung Wali Gereja Indonesia, MAWI), and later changed
    its name to KWI. Protestants are represented by the national council for Protestants,
    known as the Indonesian Communion of Churches (Persekutuan Gereja-Gereja Indonesia,
    PGI), which primarily includes Presbyterian, Lutheran and Calvin churches, among
    many others. When it was formed in May 1950 with 27 member churches it was known
    as the Indonesian Council of Churches (Dewan Gereja-gereja Indonesia, DGI).^(54)
    Its largest member, both then and now, is the Batak Church (Nyhus, 1987: 84).
    In 2010, the membership of PGI consisted of over 83 church denominations (PGI,
    2010b). The emergence of, and distinction between, these two national councils,
    one for Protestants and the other for Catholics, is also indicative of the ‘bitter
    rivalry’ between Protestants and Catholics in Indonesia (Steenbrink, 2003: 193).Under
    the Soeharto regime, members of these two national councils enjoyed a ‘privileged
    position’ (Sidel, 2006: 48). Protestants and Catholics occupied a large number
    of positions of power and influence in government, disproportionate to the minority
    Christian population (Sidel, 2006: 63). Catholics and Protestants benefited from
    close relations with the government from independence and therefore considered
    themselves to be in a superior position compared to the newer Pentecostal and
    Evangelical churches.Newer Christian denominations exist outside of the membership
    of KWI and PGI.^(55) From the 1920s until the 1980s, a third group, a mix of Evangelical,
    Charismatic and Pentecostal theology began to establish independent churches across
    Indonesia. Since the 1980s, as Evangelicals and Pentecostals have become more
    clearly defined institutionally, it is more accurate to say that there are now
    four broad types of Christian churches in Indonesia: Catholic, Protestant, Evangelical
    and Pentecostal. Some Evangelical churches are members of the Indonesian Evangelical
    Communion of Churches and Institutions (Persekutuan Gereja dan Lembaga Injili
    Indonesia, PGLII), which began in 1971 (then known as Persekutuan Injili Indonesia).^(56)
    Many Evangelical churches are independent, such as the Indonesian Reformed Church
    (Gereja Reform Injili Indonesia), the largest Evangelical Chinese church in Indonesia.Pentecostal
    churches, which emphasized the Holy Spirit and spiritual gifts such as healing
    and prophecy,^(57) may be members of the Communion of Pentecostal Churches in
    Indonesia (Persekutuan Gereja-gereja Pantekosta di Indonesia, PGPI). Pentecostalism
    came to Indonesia through American missionaries in the 1920s. Between 1923 and
    1970, at least 25 Pentecostal denominations were established (*PGPI News*, 2009c).
    PGPI began a few years later in 1979.^(58) Of its 78 member churches, some of
    the largest Pentecostal denominations include the Indonesian Pentecostal Church
    (Gereja Pantekosta di Indonesia), the Indonesian Bethel Church (Gereja Bethel
    Indonesia) and the Assemblies of God (Gereja Sidang Jemaat Allah).^(59)Protestant
    and Catholic churches have viewed Evangelical and Pentecostal churches with some
    concern, as they have lost some of their members to these newer movements. These
    movements are not always exclusive, however, as there have been ‘charismatic’
    movements within Protestant and Catholic churches. Although Christians have, and
    often still are, traditionally classified along the organizational lines of PGI
    and KWI, this is no longer an accurate indication or representation of Christianity
    in Indonesia. It is also problematic because only KWI and PGI receive government
    funding through the Ministry of Religion, and are consulted by the government
    on matters of policy.Since mid-2000, the Ministry has been aware that PGI no longer
    represents the Protestant community. It has discussed with PGI the possibility
    of creating a new umbrella organization for all Protestant, Pentecostal and Evangelical
    churches, which would replace PGI. It would aim to improve communications between
    the government and the churches, and to unify the growing number of new Christian
    denominations. According to officials from the Inter-religious Relations Division
    of the Ministry of Religion, PGI has been resistant to this idea to date, presumably
    because it does not want to lose its power, financial support and status within
    the Ministry. The long-held distinction between the Catholic and Protestant churches
    in Indonesia will also remain unchanged as there is no suggestion that Protestant
    and Catholic churches be gathered into one body.One of the roles the national
    Christian councils have taken on is to issue public statements on behalf of the
    church concerning the introduction of laws regulating religious affairs. For example,
    in 2009, PGI issued a statement against the Draft Law on *Zakat* Administration
    and the Draft Law on *Halal* Products. It argued that Indonesia is not a ‘religious
    state’ (*negara agama*), that the state should not make laws for just one religious
    group, and that there needs to be a clear separation between religion and the
    state (*Kristiani Post*, 22 May 2009; *Compass Direct*, 19 August 2009). Another
    example is the draft law on population administration in 2006, which included
    changes to the national identity card. In this debate, PGI argued that it was
    not necessary to include ‘religion’ as a category listed on a person’s registration
    card (Yewangoe and Sairin, 2009: 145). Both PGI and KWI have generally opposed
    attempts by the state to regulate religion, such as the Draft Law on Inter-religious
    Harmony. Such laws are perceived as attempts to implement *syariah* law and raise
    concerns about the effect on religious minorities. Any government response to
    regulating religion must therefore recognize the diversity within the Christian
    community, and address concerns about the impact of such laws on minorities. Laws
    regulating religion, particularly *syariah* law, have been opposed by Christian-based
    political parties also, although as I will show, there is little popular support
    for religious ideology in Indonesian politics.[Losing faith in politics](#07_Contents.xhtml_ch3-4)Indonesia’s
    political landscape has historically divided between nationalist parties based
    on the Pancasila and religious-based parties. The vast majority of political parties
    in Indonesia are nationalist parties based on the Pancasila. The longest-standing
    nationalist party is Golkar, which won all six (rigged) elections under the New
    Order while backed by Soeharto and the army.^(60) The Indonesian Democratic Party
    Struggle (Partai Demokrasi Indonesia – Perjuangan, PDI-P) is a nationalist political
    party formed in 1998, an offshoot of the former PDI, which was created by the
    forced amalgamation of political parties under Soeharto in 1973\. Partai Demokrat,
    established in 2001, is the party of President Susilo Bambang Yudhoyono (2004–09;
    2009–14). Other main national political parties are PKB, created in 1998 by members
    of NU, and PAN, created in the same year by members of Muhammadiyah. Although
    PAN and PKB do not profess an Islamic ideology, their electoral support comes
    primarily from Muslims affiliated with the Islamic social organizations that established
    them (Fealy, 2001: 122).Christians have a history of activism in both national
    and Christian-based political parties. There are several Christian political parties
    that are also based on the Pancasila, because it is seen to be opposed to an Islamic
    ideology, and these parties have clear links to pre-New Order Christian political
    parties.^(61) In 1945, two national Christian political parties were formed. The
    Indonesian Christian Party (Partai Kristen Indonesia, known as Parkindo) was intended
    to channel the political aspirations of Protestants. Many of those involved were
    from the Batak Church (Nyhus, 1987: 520). The other was the Catholic Party of
    the Republic of Indonesia (Partai Katolik Republik Indonesia, PKRI) formed by
    Ignatius Joseph Kasimo Hendrowahyono as a political party for Catholics (McTurnan,
    1952: 158). Neither of these two parties received many votes at elections. By
    1973, these parties were forced to become part of PDI, which in 1984 was required
    to embrace the Pancasila as its sole ideology. This effectively prevented any
    party from claiming a religion as its basis or ideology. Therefore, from 1973
    to 1998, there were no political parties explicitly based on Christianity. Nevertheless,
    PDI-P is still supported by many Christians.It has only been since 1998 that Christian-based
    political parties have been re-established in Indonesia. On 1 October 2001, the
    Peace and Prosperous Party (Partai Damai Sejahtera, PDS) was established by Denny
    Tewu and Ruyandi Hutasoit. It is the only political party with a logo that includes
    the cross, a central image associated with the Christian faith. The current leader
    of PDS is Ruyandi Hutasoit, the son of Manixius Hutasoit, one of the former leaders
    of Parkindo.^(62) Ruyandi is also a pastor and chairperson of the Doulos, a Christian
    mission agency that was burnt down in 1999 by radical Islamists who opposed its
    proselytization activities (Ananta *et al*., 2005: 25). PDS constituents primarily
    come from the Christian-majority provinces of Papua, Maluku, Southeast Sulawesi,
    and Central and West Kalimantan (*Jakarta Post*, 25 March 2009). The vast majority
    of its candidates are Christian and over 60 per cent of the party’s supporters
    are Protestant Christians (Shihab and Nugroho, 2008: 252).In May 2006, after a
    falling-out amongst leaders of PDS, some members left PDS to form the Devoted
    Democracy Party of Indonesia (Partai Kasih Demokrasi Indonesia, PKDI). The party
    symbol is a pine (Christmas) tree in a circle of a white pentagon with the rosary,
    which is very similar to the symbol used by the former party Parkindo. In its
    background statement, PKDI describe its initiative as ‘Partisipasi Kristen Indonesia
    (Indonesian Christian Participation, PARKINDO),’ using the same acronym as the
    former Christian political party. Led by lawyer Stefanus Roy Rening, PKDI is a
    coalition of several Christian-based political parties.Since independence, a number
    of political parties expressly based on Islam have formed, although with little
    success. In the first election in 1955, there were two Islamic-based political
    parties that gained a significant percentage, though not a majority, of the vote:
    NU and Masyumi.^(63) In August 1960, Masyumi was banned due to its involvement
    in the 1958 rebellions aimed at overthrowing the government (Ricklefs, 2008a:
    306). A few years later, in 1973, NU was forced to merge into the United Development
    Party (Partai Persatuan Pembangunan, PPP), which today is the only Islamic-based
    political party to survive the New Order. The two parties with the largest support
    base that were formed post-1998 are PBB and PKS. The Crescent Moon and Star Party
    (Partai Bulan Bintang, PBB) was formed by the older generation of DDII and Masyumi
    activists in 1998 (Haris, 2003: 62).To some extent, post-Soeharto Indonesia has
    witnessed the re-emergence of political Islam through the establishment of political
    parties that adopt an Islamic ideology. In 1998, Partai Keadilan (PK) was formed,
    claiming to embody the tradition of Masyumi. Despite its Islamist beginnings,
    there are indications that, since 2009, ‘PKS has shifted from a hardline party
    to a more moderate stance to expand its constituency’ (Shihab and Nugroho, 2008:
    233). According to Fealy, attempts to ‘rebrand’ itself as a mainstream, rather
    than Islamist, party have not been entirely convincing, as its rhetoric of ‘openness’
    and ‘PKS for all’ have been clouded by the secrecy with which its internal sessions
    were held at the 2010 National Congress (Fealy, 2010).The political landscape
    opened up and diversified since the fall of Soeharto and the transition to democracy
    in 1998\. Just one week after becoming president, Habibie gave permission for
    the formation of more political parties. Consequently, over 90 parties emerged
    during the second half of 1998, although only 48 of these parties qualified to
    contest the 1999 election (Riddell, 2002: 66). Some 18 political parties were
    based on an Islamic ideology. The three Islamic parties managed to obtain 14 per
    cent of the vote.^(64) For PK, this meant that it had to re-brand under the new
    name the Prosperous Justice Party (Partai Keadilan Sejahtera, PKS) to contest
    the 2004 elections.In 2004, out of 24 parties that contested the election, 16
    were based on the Pancasila.^(65) The five parties based on Islam received a total
    of 20.83 per cent of the vote, which represents a slight increase for Islamic
    parties from the 1999 electoral results (Suryadinata *et al*., 2003: 16–17). In
    particular, PKS won 7.3 per cent of the votes, or 45 seats (Ananta *et al*., 2005:
    113–14). In terms of Christian parties, in the 2004 election, PDS secured 2.13
    per cent of the national votes and 5 per cent of the votes in Jakarta (Aritonang
    and Steenbrink, 2008: 894). Many of its votes were won in predominantly Christian
    areas such as Manado (North Sumatra) as well as from the Chinese Indonesian community
    (TAPOL, 2008: 13).Other significant changes took place in 2004, such as the first-ever
    direct presidential election. There were two coalitions: the National Coalition,
    including Golkar, PDI-P, PPP and PDS, which supported Megawati Soekarnoputri (the
    daughter of first President Soekarno) for president; and the People’s Coalition,
    including PD, PBB and PKS, which supported Susilo Bambang Yudhoyono. Significantly,
    these coalitions blurred any distinction between parties based on the Pancasila
    and those based on Islam (Suryadinata, 2005: 21). As Mujani and Liddle (2010a:
    39) highlight, ‘the lack of significance of religious factors was particularly
    glaring in the presidential contest.’Religious-based political parties fared no
    better in the 2009 elections. PKS only achieved 7.9 per cent of votes, while PPP
    received 5.3 per cent. PDS also did not fare well. It failed to reach the 2.5
    per cent threshold and consequently no longer holds any seats in the legislature
    (DPRD). PKDI were also unable to reach the 2.5 per cent threshold. As Mujani and
    Liddle (2010a: 37) noted, in the 2009 elections there was ‘little evidence that
    voters were influenced by their religious, ethnic, regional or social-class identities.’The
    success of religious-based political parties in Indonesia since the introduction
    of democracy has been limited, and Islamic parties in particular have failed to
    gain a significant percentage of votes in the national elections. Political parties
    were increasingly concerned with advancing and securing the Islamic-majority voter
    base, particularly in the lead-up to the 2009 elections. In turn, some parties
    have shown a willingness to support controversial national laws that seek to uphold
    aspects of Islamic law.One key example is the Draft Law on Pornography. At the
    national level, the issue of prostitution and the regulation of sexuality were
    first debated in 1999 through the introduction of the Draft Law on Anti-Pornography
    and Pornographic Acts. It sought to regulate public expressions of sexuality in
    order to protect the community and promote good religious morals. The Draft Law
    was shelved and lay dormant until it arose on the legislative agenda again in
    2005 (Pausacker, 2008).The Draft Law caused considerable controversy for its attempt
    to regulate sexuality and the behavior of women. The Islamic-based political party
    PKS was one of the major advocates for the Draft Law on Anti-Pornography (Shihab
    and Nugroho, 2008: 248). Other supporters of the Draft Law included Muhammadiyah,
    Nadhatul Ulama and the MUI (Sherlock, 2008: 160). MUI had previously issued a
    *fatwa* that declared pornography forbidden (*haram*).^(66) The only political
    parties that opposed the Draft Law were the nationalist party PDI-P and Christian
    party PDS (Setara Institute, 2008: 13). The Draft Law was also of concern to liberal
    and feminist groups, and religious and ethnic minorities. For example, Christians
    in Papua and Hindus in Bali opposed the draft because they felt that it would
    restrict their traditional dress or customs (Pausacker, 2009: 121). After several
    amendments, it was finally passed in 2008.^(67) In April 2010, concerned groups,
    including women’s rights groups, legal aid organizations and PGI, lodged a request
    for judicial review of the Pornography Law in the Constitutional Court. The applicants
    argued that the law would unnecessarily restrict religious rituals of religions
    other than Islam.Aside from the Pornography Law, the Christian political party
    PDS has been outspoken on issues related to religious minorities and pluralism,
    such as places of worship and local religious regulations based on Islam. For
    example, some of the 56 members of the legislature who petitioned the president
    in 2006 in opposition to *perda syariah* were from PDS. In another significant
    court case, PDS campaigned for the release of three Christian men accused of masterminding
    the violence in three villages in Poso in 1999, despite inconsistent and insufficient
    evidence to support these allegations. The campaign was unsuccessful, and the
    men were executed in September 2006.^(68) [Chapter 4](#16_Chapter04.xhtml) will
    show PDS has been active in supporting other Christians accused of criminal offences
    against Islam. Further, in 2008, PDS was part of a fraction that rejected the
    Draft Law on Shariah Banking, and as a result has been criticized for being *syariah*-phobic.
    This may be in part because it does not argue that Islamic law must respect the
    rights of non-Muslims, but rather that Islamic law should not be enforced by the
    state.One of the most significant aspects of the post-1998 transition has been
    the free and competitive political environment. A striking feature of this new
    political era in Indonesia is the relative lack of support in national elections
    for religious or faith-based political parties as opposed to nationalist parties
    – that is, those based on the Pancasila ideology. Although Muslim political parties
    such as PKS and Christian parties such as PDS may have a religious agenda, they
    have won little support at the national elections. As a result of the historical
    lack of support for faith-based political parties in Indonesia, issues of religious
    sensitivity cut across political lines. All political parties, excluding Christian
    ones, demonstrate a willingness to support the passage of laws based on Islam
    in the scramble for votes. There is also the further complicating factor of corruption
    and illegality that overshadows political parties and the state in Indonesia (Aspinall
    and van Klinken, 2011). This is of concern given that, as discussed in [Part II](#15_Part02.xhtml)
    ([Chapters 4](#16_Chapter04.xhtml)–[6](#18_Chapter06.xhtml)), laws may be manipulated
    by Islamists in a way that compromises the rights of religious minorities.[Democracy,
    decentralization and religion](#07_Contents.xhtml_ch3-5)An intensely competitive
    electoral environment has formed at both the national and regional level due to
    the rapid process of decentralization in Indonesia since 1998\. Between 1999 and
    2004 alone, the process of *pemekaran* (lit. blossoming), that is, the creation
    of new regions, saw a 50 per cent increase in the total number of regencies (Carnegie,
    2008: 522). In addition to the opening of new and contested local political arenas,
    the decentralization of power has transferred greater power and freedoms to local
    authorities. This means that the politicization of religion is particularly concentrated
    at the local level.Since the fall of President Soeharto and the New Order, Indonesia
    has undergone a transition from centralized control to democracy and decentralization.
    In 1999, the Habibie government implemented landmark Decentralization Laws.^(69)
    As of January 2001, the Decentralization Laws handed government control to the
    400 regencies/cities rather than the 30 provinces that existed at the time. By
    2009, Indonesia had about 500 regencies and cities. This redistribution of powers
    fundamentally changed the relationship and position between central and local
    governments. This process has been ‘one of the most substantial re-allocations
    of powers inside a nation state in modern times’ (Smith, 2003: 97), and implementation
    has therefore presented a significant administrative challenge. This has fuelled
    corruption at the local level, as decentralization may ‘provide a slice of patronage
    resources for the bureaucrats, political bosses or networks that dominate these
    areas’ (Aspinall, 2010: 27).Major shortcomings were soon identified in the Decentralization
    Laws. Practical implementation was unclear and the relationship between the central
    government and the regions remained uncertain. For these reasons, the Decentralization
    Laws have been labeled ‘flawed’ (Bell, 2001: 43), and ‘contradictory’ (Smith,
    2003: 105). Despite revisions to the Decentralization Laws in 2004,^(70) ambiguity
    over the powers of local authorities remains. Little has been done to keep the
    law-making activities of regional governments in check, particularly in relation
    to matters of religion, despite the fact that this power has been retained by
    the central government.The Decentralization Laws regulate the levels of government
    administration in Indonesia. The provincial and regency/city governments are authorized
    to pass regional regulations (*peraturan daerah, perda*)^(71) on any area *except*
    those specifically retained by the national government, namely: foreign affairs,
    national defense, national security, judicial affairs (*yustisi*),^(72) economic
    policy, and religion.^(73) This power to regulate matters of ‘religion’ includes
    national religious public holidays, official recognition of a religion, policies
    on the implementation of religious life, and religious matters of national significance.^(74)
    The central government can delegate the power to oversee some aspects of religion
    to regional government authorities if it will help to develop the religious life
    of the community.Nevertheless, local laws remain subordinate to a number of other
    higher laws, according to the hierarchy of laws in the Indonesian legal system.
    This hierarchy ranks laws as follows: the Constitution, Laws, Government Regulations,
    Presidential Regulations, Provincial Regulations^(75) and Regency/City Regulations.^(76)
    These laws are listed in order of rank and a lower law, such as a Provincial Regulation,
    may be invalid to the extent that it contradicts national law. Islamic law is
    not part of the government-recognized legal hierarchy in Indonesia. Since the
    failure of the Jakarta Charter at the national level, however, Islamists advocate
    for the implementation of Islamic law at the regional level. This demonstrates
    a shift in the focus of efforts for the implementation of *syariah* in Indonesia.
    Radical Islamic groups have taken a grassroots approach given the failure of the
    top-down implementation of *syariah* through the Constitution in 2002\. In the
    grab for political power, regional governments have responded by claiming the
    power to regulate on matters of ‘religion,’ despite the questionable legal basis
    to do so.As a result, there has been a trend across Indonesia for regional governments
    to introduce aspects of Islamic law through regulations. This has led to the promulgation
    of a large body of regional regulations known as *perda syariah* (*peraturan daerah
    syariah*), based on Islam, which seek to enforce aspects of Islamic law that may
    conflict with national laws. These regulations seek to revitalize and enshrine
    Muslim beliefs and practices, such as Friday prayers and the management of *zakat*
    (giving of alms). Some form part of a wider crackdown on social problems such
    as prostitution, gambling, alcohol and drugs. Others ban men and women from swimming
    together, expel students from school who cannot recite the Qur’an and forbid children
    from playing PlayStation at an entertainment complex in their school uniform.
    The wide range of regulations can be classified into nine categories: clothing,
    prostitution, social problems (*maksiat*), alcohol and drugs, religious rituals,
    *zakat* management, Qur’anic education, local governance, and non-Islamic regulations
    (Crouch, 2009b). Despite the questionable legal basis (*dasar hukum*) of these
    religious regulations, the growth of religious regulations has continued unchecked
    by the national government.Controversy over the introduction and enforcement of
    religious regulations has arisen in relation to *jilbab* (women’s headscarf) inspections,
    and the caning of people convicted for *syariah* offences (ICG, 2006). Although
    non-Muslims are generally exempt from complying with *perda syariah*, the introduction
    of religious regulations has been an issue of concern for Christians. Many non-Muslims
    have expressed concerns about the proliferation of local regulations based on
    Islam, and about Islamic law in Aceh in particular.Most religious regulations
    that have emerged are based on Islam. There has also been a struggle, however,
    in some Christian-majority regions with proposals for religious regulations based
    on Christianity. The prime example is a draft regulation to make Manokwari (Papua)
    a Bible-based city, which was first proposed in March 2007.^(77) Among other things,
    this draft would make it an offence to use symbols of religions other than Christianity
    (art. 26). It would make the building of a non-Christian place of worship a crime
    if a church already exists in the area (art. 30). It would also forbid wearing
    clothes that have religious significance, for example, the *jilbab*. If implemented,
    this regulation would make it very difficult for non-Christians to practice their
    religion, particularly because Protestantism and Catholicism are well-established
    in Papua. The draft regulation was rejected in 2007 and although a revised draft
    was issued in 2008 with minor revisions, it was not passed as law.^(78)This expression
    of conservative Christian religious values had little support from the Christian
    community outside of Papua, and was rejected by KWI and PGI (*UCAN*, 30 March
    2007). The draft was also criticized by Muslim leaders and organizations, such
    as PKS and MUI, as problematic as the state should not endorse one religion, although
    this was ironic given that such complaints have been put forward by non-Muslim
    critics of *perda syariah* proposed in majority-Muslim areas.There have been few
    instances of opposition to religious regulations at the national level. In June
    2006, the first significant opposition to religious regulations from within the
    legislature arose when 56 legislators submitted a petition to the president. This
    petition was signed by members of PDI-P, Partai Demokrat and PDS (*Jakarta Post*,
    14 June 2006). In response, 134 politicians from the Islamic-based PPP and PKS
    submitted a counter-petition in favor of *perda syariah* (ICG, 2006). Several
    ministers have spoken out on the issue since these petitions were lodged. In 2007,
    the Department of Home Affairs promised to review 37 *perda syariah* that were
    in conflict with higher laws (*Jakarta Post*, 30 August 2007). In the same year,
    the People’s Consultative Assembly Speaker, Hidayat Nurwahid (who is the former
    chairperson of PKS), asserted that demands to implement *syariah* did not need
    to be fulfilled by the formal implementation of Islamic law. In August 2008, Chief
    Justice of the Constitutional Court Mahfud Md declared that religious regulations
    should not be enacted by regional administrators because they were illegal and
    contrary to the Pancasila (*Jakarta Post*, 23 August 2008). Local governments
    continue to create new *perda syariah*, although most religious regulations remain
    of symbolic value only and are rarely implemented or enforced.The decentralization
    of power has therefore led to greater politicization of religion – that is, the
    use of religion for political gain – at the regional level. This has created tensions
    between national and local laws, as well as between Muslims and Christians, and
    within Muslim and Christian communities. The influence of decentralization and
    the conditions that led to the emergence of religious regulations will be illustrated
    next by examples from local contexts.[Regional regulations and radicalism in West
    Java](#07_Contents.xhtml_ch3-6)The proliferation of regional regulations based
    on Islam post-1998 can be seen as an expression of a small disparate but vocal
    group of hardliners. Religious regulations exist in the majority of provinces
    and the largest numbers of religious regulations have been generated in the provinces
    of West Sumatra, South Sulawesi and West Java. In West Java, *perda syariah* exist
    in at least 14 cities and districts. In terms of impact, Tanthowi’s study of the
    influence of religious regulations on non-Muslims in Cianjur (West Java) found
    a very low level of awareness or understanding of the implementation of *syariah*
    (53 per cent; Tanthowi, 2008). Large numbers of non-Muslims declined to participate
    in the survey as they were afraid to disclose their opinions. Of the non-Muslims
    who were willing to participate, Tanthowi found that some non-Muslims had been
    forced to comply with the religious regulations, such as women being coerced to
    wear Muslim clothing in the workplace on Fridays. This indicates a reluctance
    or fear on the part of religious minorities such as Christians to challenge the
    emergence of regulations based on Islam.Some of these religious regulations have
    been challenged in court. The most well-known case occurred in 2005 when a woman,
    Lilis Lindawati, was falsely arrested and accused of being a prostitute under
    the Perda of Tangerang 8/2005 on Prostitution. The ‘evidence’ was nothing more
    than lipstick and foundation in her handbag (which is common for Indonesian women).
    On 27 February 2006, Lilis was sentenced to 80 days in prison and fined Rp 300,000
    (A$33). She was released four days later after her husband paid the fine. The
    injustice of this case and the validity of the regulation were challenged by a
    network of NGOs known as the Coalition Against Discriminatory Perda. In April
    2006, the Coalition sought judicial review of the decision in the Supreme Court.^(79)
    Ultimately, the court declined to resolve the controversy surrounding her arrest
    and the legality of religious regulations in general. Instead, in April 2007,
    the Supreme Court announced that it had rejected the application and refused to
    decide the question of whether this religious regulation is outside of the powers
    of local governments because it believed this was a matter for the executive and
    legislature to decide (*Pelita*, 16 April 2007). No written decision has been
    published by the court in this case.A less well-known example of regional regulations
    being challenged in court is a string of cases on regulations that limit the sale
    and consumption of alcohol. These regulations forbid the sale or consumption of
    alcohol in a public place, based on the presumption that the use and/or abuse
    of these substances are contrary to religious norms and social well-being. While
    some may argue that such regulations are more concerned with social order and
    morality than religion, the reaction from some hardline (*garis keras*) Islamic
    groups at the potential cancellation of these regulations suggests that such regulations
    are at least perceived by them to be indirectly upholding Islamic law. For example,
    in 2012, a report that nine regulations on alcohol had been repealed by the minister
    was met with protests from Islamic groups. This news also prompted the Islamic-based
    political party PPP to suggest that a national law should be passed to ban the
    sale and consumption of alcohol (*Jakarta Globe*, 16 February 2012). The mayor
    of Tangerang was also prepared to take a case for judicial review to the Supreme
    Court against the decision (City of Tangerang, 2012). The report that such laws
    would be cancelled, however, was denied by the Minister of Home Affairs (*Jakarta
    Globe*, 11 January 2012).Court cases challenging the validity of regulations on
    the sale and consumption of alcohol have occurred in areas such as Subang and
    Kuningan (West Java) as well as Jambi, and in part are driven by business interests.
    The first case reached the Supreme Court on appeal in 2002\. It was brought by
    14 owners of small restaurants who were concerned because the 2001 regulation
    on alcohol in Kuningan did not allow the sale of ‘category A’ alcohol (that is,
    1–5 per cent alcohol content), unless it was sold in hotels that had a permit.
    The applicants argued that the regulation was inconsistent with Presidential Decision
    3 of 1997 on the Supervision and Sale of Alcohol, which does not require a permit
    for the sale of category A alcohol. The applicants were partly successful, with
    the court striking down the provisions in the Kuningan Regulation that were inconsistent
    with the Presidential Decision (Supreme Court, 2002). Similar cases have been
    brought on appeal to the Supreme Court concerning regulations on alcohol in Jambi
    (Supreme Court, 2008d) and Subang (Supreme Court, 2010a), with the same outcome.Aside
    from religious-based regulations, NGOs have documented the high incidence of discrimination
    against religious minorities in West Java. According to Setara Institute (2010a:
    3, 27–29), the highest number of violations of the right to freedom of religion
    between 2007 and 2009 occurred in the province of West Java. In a report by Nahdlatul
    Ulama, West Java was found to be the province with the highest level of religious
    intolerance (*Jakarta Post*, 21 December 2010).A correlation has been identified
    between areas that have issued religious regulations and the history of radical
    Islamic group Darul Islam (Bush, 2008: 181). West Java is a center for hardline
    Islam and home to Darul Islam (Domain of Islam). In 1947, Darul Islam emerged
    in West Java promoting the ideology of an Indonesian Islamic state (Negara Islam
    Indonesia, NII) and as a rebellion against Dutch colonial attempts to retake Java.
    In 1948, it began an armed rebellion against the Republic and a year later declared
    Indonesia an Islamic state based on Islamic law.Once the Dutch withdrew from Indonesia,
    Darul Islam began working towards the establishment of Islamic law in Indonesia.
    In February 1948, the first Darul Islam conference was held in the village of
    Pangwekusan, Tasikmalaya (Horikoshi, 1975: 70). On 7 August 1949, Darul Islam
    officially proclaimed the Islamic state of Indonesia based on *syariah* in the
    village of Cisampang, Tasikmalaya (Dijk, 1981: 92; Horikoshi, 1975: 72). The national
    leader of Darul Islam, Kartosuwirjo, who was also one of the founders of the Islamic
    political party Masyumi, formed several other Islamic organizations in Tasikmalaya
    (Dijk, 1981: 84).The Darul Islam movement soon spread from West Java to other
    provinces, including Central Java, South Kalimantan, South Sulawesi and Aceh (Dijk,
    1981: 1; ICG, 2005a). West Java was still the most important and strategic area,
    and there Darul Islam had an army of over 15,000 men (Fealy, 2007: 68). More lives
    were lost during the Darul Islam wars in West Java than in any other region (Fealy,
    2005b: 17). Between 1953 and 1958, it is estimated that over 11,000 people were
    killed, 1,200 kidnapped, hundreds of thousands of houses burned, and over 1 million
    people internally displaced in West Java (Dengel, 1995: 147). In total, about
    15,000 to 20,000 died. As an indication of the magnitude of the conflict, Fealy
    (2005b: 18) highlights that ‘the cost of the rebellion, both in lives and assets,
    far exceeds anything perpetrated by violent Islamic groups such as Laskar Jihad
    and Jema’ah Islamiyah during the post-Soeharto period.’As late as 1956, the NII
    was still in control of half of the regencies of Tasikmalaya, and 75 of 201 villages
    were partly or wholly controlled by Darul Islam (Dijk, 1981: 102; ISAI, 1998:
    107). The state was not able to contain this movement until 1962, 17 years later,
    preventing Darul Islam at that time from achieving its aim of establishing an
    Islamic state (Boland, 1982: 54–75). Although Kartosuwirjo was executed in 1962,
    the ideals and goals of Darul Islam have been taken up by other groups since.^(80)The
    struggle to establish an Islamic state has continued under the banner of Negara
    Islam Indonesia (NII). In 2002, the police made a number of arrests of suspected
    members of NII. None of the suspects arrested was charged (*Jakarta Post*, 11
    April 2002). Several years later, in 2008, 17 members of NII were arrested and
    found guilty by a court for plotting to undermine the Indonesian state.^(81)Radical
    Islam is a minority within West Java, although 97 per cent of the population,
    or over 41 million people, are Muslim (BPS, 2010). It is the most densely populated
    province in Indonesia, and only 1.8 per cent of the population, fewer than 800,000
    people, are Protestant, while less than 0.5 per cent, or 250,000 people, are Catholic
    (BPS, 2010). To cater for the Muslim population, West Java has the largest number
    of mosques of any province in Indonesia, with almost 38,000 (Ministry of Religion,
    2010a).^(82) In contrast, there are only 1,075 Protestant churches and 117 Catholic
    churches.The small number of Protestant and Catholic churches is one indication
    of the largely unsuccessful history of Christian missionary activities in West
    Java. This is partly because West Java was one of the majority-Muslim areas in
    Indonesia that remained officially closed to missionary activities until the twentieth
    century (Steenbrink, 2003: 209). The history of Christianity in West Java is also
    different to other parts of Java, due to the lack of Eurasian or Javanese members
    in the first congregations (Steenbrink, 2005: 286). In West Java, the first missionaries
    from the Netherlands Missionary Union (NMU) arrived in the 1850s. Although its
    workers obtained permits from the government, their presence in West Java generated
    unease among the colonial government because of concerns their activities may
    cause conflict with the Muslim Sundanese population (Coppel, 2002: 293). There
    were some missionaries from the Dutch Mission Society (Nederlandsche Zendings,
    NZV) working in areas such as Indramayu and Tasikmalaya, and baptisms into the
    church were recorded from the 1870s.^(83) Church congregations established by
    the NZV in the late 1800s and early 1900s were either Chinese Indonesian, as in
    Indramayu, or a mix of Chinese and other ethnic groups, as in Tasikmalaya (End,
    2006: 46).The number of Christians in West Java grew slowly from around 1,700
    in 1900, to 3,400 in 1922 (Soejana *et al*., 2008: 664), although these were mostly
    Protestants. In 1927, 8,000 Catholics were recorded, although the majority were
    European with only 108 Indonesians (Steenbrink, 2007: 355). By 1942, the number
    of Indonesian Catholics had increased to 1,552, while the number of European Catholics
    had increased to 19,091 (Muskens, 1974: 820, 832). Many Catholics are concentrated
    in areas such as Bandung, and since 1998 the strength of radical Evangelical Christian
    movements is evident in areas such as Bekasi, West Java (ICG, 2010). I look further
    at the development of Christian communities in Indramayu, Tasikmalaya and Depok
    in [Part II](#15_Part02.xhtml).The growth of religious regulations and an increase
    in religious intolerance has coincided with the competitive local environment.
    Local elections have led to ‘fierce intra-elite competition’ among candidates
    and parties running for provincial and local government elections (Buehler, 2007:
    140). In 2009, 69 of 109 representatives from West Java in the national legislature
    were from nationalist parties such as PD and PDI-P, while 29 were from Islamic-based
    parties. The reputations of former governors of West Java have been mired by cases
    of corruption. In 2009, R. Nuriana, the former governor of West Java (1993–2003),
    was investigated by the National Corruption Eradication Commission (Komisi Pemberantasan
    Korupsi, KPK). Known as the Bank Jabar-Banten case, he was implicated in major
    tax fraud by executives of PT Bank Jabar (*Seputar Indonesia*, 22 July 2009).
    In the same year, former governor H. Danny Setiawan (2003–08) was convicted for
    four years for receiving Rp 7 million (A$780) from the Bank of West Java (*Media
    Indonesia*, 11 May 2010). In 2008, Setiawan lost the provincial elections to H.
    Ahmad Haryawan, who is a member of PKS.This brief discussion of the province of
    West Java indicates that regional debates on the relation between law and religion
    are just as important as national debates in an era of decentralization. Christianity
    has a relatively brief history in West Java and many of the first Christian communities
    established in places such as Indramayu and Tasikmalaya consisted primarily of
    Chinese Indonesians. The history of radical Islam and support for an Islamic ideology
    in the area is evident in the politicization of religion through support for regional
    regulations based on Islam.[Conclusion](#07_Contents.xhtml_ch3-7)There have been
    several challenges by Muslims to the constitutional foundations of the state and
    this has sparked tension and debates both within and between Muslims and Christians
    about the relationship between religion and the law since 1998\. The outcome has
    been that the right to religious freedom has been further entrenched in the legal
    framework, and the effort by radical Islamic groups to insert the Jakarta Charter
    in the Constitution in 2000 failed to receive widespread support. The Pancasila
    remains the official ideology of the Indonesian state. This provides a solid basis
    for the constitutional recognition of religious diversity and the right to proselytize
    in Indonesia.In the shift to democracy and decentralization, the national government
    has retained the power to regulate matters of ‘religion,’ although it can choose
    to delegate that power to local governments. Islamists have worked through two
    main institutions to introduce national laws based on Islam: the Ministry of Religion
    and the Indonesian Ulama Council. Although it no longer oversees the Religious
    Courts, the Ministry has retained its power to oversee the religious affairs of
    the six official religions in Indonesia. It has promoted ‘orthodox’ Islamic teachings
    and been instrumental in the creation of laws based on Islam. MUI is arguably
    more independent from the government than under the New Order. The two Christian
    organizations recognized and consulted by the Ministry of Religion, KWI and PGI,
    no longer represent the many faces of Christianity. This limits the extent to
    which new or independent churches outside Catholicism or Protestantism, often
    Pentecostal or Evangelical churches, can legitimately advocate change through
    the political process.From a political perspective, more political parties based
    on Islam or Christianity have emerged post-1998\. The results of the three national
    general elections since 1998, however, demonstrate that there is little support
    for religious-based political parties in Indonesia. Despite the lack of support
    for the introduction of *syariah* law as an obligation for Muslims via the Constitution,
    many political parties support the creation of national laws based on Islam in
    an effort to attract the majority-Muslim constituency in the competitive political
    environment.This has led to a situation where both national and regional laws
    increasingly favor Islamic law, which may compromise the rights of religious minorities.
    This may be appropriate in a majority-Muslim country, except for the fact that
    what *syariah* is, and how, or even whether, it should be enforced via state law,
    is hotly contested in Indonesia. The national government’s inaction or reluctance
    to intervene means that regional governments are exercising their powers to implement
    laws on religion without any form of accountability.This is demonstrated in the
    province of West Java, a majority-Muslim area with a history of radical Islam,
    where religious sentiment is being manipulated in regional politics in an era
    of decentralization. This has led to the introduction of regional regulations
    based on Islam. As my case studies in the following chapters will show, these
    legal developments have contributed to legal disputes between Muslims and Christians
    in West Java.Notes1  See Lindsey (2008: 12–17) for a concise summary of the significant
