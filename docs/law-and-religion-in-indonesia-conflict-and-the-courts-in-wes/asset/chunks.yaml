    这是法律中最具争议的方面之一，因为它建立了一个隔离的宗教教育模式，而这种模式现在对公立和私立学校都是强制性的。根据宪法法院的（2010a: 273），该规定在宪法上是有效的，因为它通过确保每个学生在印度尼西亚都有接受宗教教育的权利，维护了宗教自由权。


    2007 年，通过了实施条例，¹⁹，将监督宗教教育的责任下交给了宗教部。该条例要求所有教育机构必须留出一间教室用于宗教教育课程（`art. 4(4)`），尽管它也明确，基于单一宗教的教育机构没有义务为另一种宗教建造宗教场所（`art.
    4(7)`）。例如，这意味着对于基督教学校来说，留出一间教室用于伊斯兰宗教教育课就足够了，不需要建造清真寺或`mushollah`（祈祷室）。根据宗教部研究处主任
    Atho Mudzhar 的说法，这项政策旨在确保宗教教育的不会成为学校不必要的财政负担。²⁰。条例规定，如果教育机构进行的宗教教育不符合本条例的要求，将收到政府的警告或可能被强制关闭（`art.
    7(1)`）。考虑到这对学生、其家庭以及教师失业的影响，学校被强制关闭是一项严重的后果。


    ## 国家教育框架与课程要求


    该条例将正式教育、非正式教育和非规范教育区分开来。所有学生人数超过 15 人的非正式宗教教育计划都必须在宗教部注册，以便其监控社区开展的宗教教育计划。条例规定了学校应为六种受承认的宗教（包括伊斯兰教、新新教、天主教、印度教、佛教和儒教）提供各类型的宗教教育计划。如果教师允许学生参加不同宗教的宗教教育课程，《教育法》并未规定规定。


    ### 宗教教育的创新


    条例进一步要求，宗教教育应成为所有小学、中学和高等教育机构学校课程的关键要素。根据 2004 年的《基于能力的课程》（`Kurikulum Berbasis
    Kompetensi`），小学每周必须提供三小时的宗教教育，而中学必须提供两小时。在这一课程实施之前，对公立学校分配给宗教教育的实际小时进行的研究发现，印度尼西亚的学生在正式教育的前六年中平均参加了
    298 小时的宗教教育，或者每周仅一小时（Rivard and Amardio, 2003: 214）。因此，这每周三小时的指导与该条例实施当时的实际做法相比似乎是一个大幅增加。


    ## 特殊自治权：亚齐案例


    除了这些国家要求外，在亚齐省，由于特殊自治权，还有关于实施实施的`Qanun 5/2008`条例（取代了`Qanun 23/2002`）。该`Qanun`与国家《教育法》有许多相似之处，但也存在一些重要的区别。重点是每个孩子都有权接受高质量的伊斯兰教教育。《教育法》第`12(1)(a)`条包含的相同权利在第`9(1)(a)`条得到了复制，但它增加了免受违反宗教、法律或习俗规范行为侵害的权利。这可以被解读为禁止对已有宗教的人进行传教。


    `Qanun`对学生规定了社会和道德义务，不得吸烟、喝酒或吸毒，也不得参与色情、色情行为、赌博或通奸。`Qanun`还规定父母有责任确保孩子接受基础宗教教育（`art.
    10(2)`）。对背诵《古兰经有特定要求，学生只有在满足这些要求时才能从小学毕业（`art. 26(3)`），而初中毕业则需要更高的阿拉伯语能力（`art.
    27(4)`）。最后，它专门处理了外国非穆斯林组织，并要求此类机构在亚齐建立教育机构必须获得许可（`art. 59`），对外国教育机构实施了高水平的控制。这项`Qanun`对伊斯兰宗教教育给予了明确的优先和强调。它还对学生、父母、教师特别是外国非穆斯林学校增加了更大的责任。除了标准的宗教教育权外，`Qanun`对亚齐非穆斯林学生的宗教教育提供没有规定。


    总的来说，印度尼西亚有关宗教教育的国家教育法律经历了重大变化。由于伊斯兰主义运动限制基督教学校的影响，政府要求在公立和私立学校根据根据学生的宗教提供宗教教育。这项政策尚未广泛实施，我展示了某些学校通过开发创新的、替代性的宗教教育方法，颠覆了这项政策，并暗示了基督教化的刻板印象。


    ## 反应与传教的担忧


    穆斯林和基督教组织及学校对引入宗教教育新政策，以及对通过宗教教育机构进行传教的担忧，反应各异。许多宗教教育的新方法通过为学生提供学习自身宗教及他人宗教的机会，以及有关人权、伦理和道德的相关问题，本质上颠覆了政府关于隔离宗教教育的政策。


    1998 年以来伊斯兰宗教领袖的话语和修辞表明，他们对基督教学校试图传教的感知努力表示担忧，这种担忧超过了《教育法》的执行。这种担忧主要体现在发布`fatwa`（伊斯兰法学意见），强烈警告或禁止穆斯林家长将孩子送往基督教学校。例如，在
    1998 年 10 月的雅加达，印度尼西亚伊斯兰委员会发布了`fatwa`，宣布穆斯林学生参加宗教教育是`haram`（禁止的）。随后，发生了一场针对私立学校的协同运动，许多伊斯兰领袖强烈鼓励穆斯林家长将孩子送往伊斯兰学校。雅加达市到处挂着横幅，写着“参加基督教学校的穆斯林是
    kafir[不信教者]”，以及“把孩子送往伊斯兰学校要好”。类似的`fatwa`在其他地区也发布了，例如在布加勿。位于布加勿的`Pesantren`合作机构（`Badan
    Kerjasama Pesantren`）发布了`fatwa`，规定穆斯林家长将孩子送往基督教学校是`haram`，因为需要保护穆斯林儿童免受传教。尽管当地
    MUI 发布了`fatwa`，国家伊斯兰委员会尚未发布关于宗教教育的`fatwa`。国家伊斯兰委员会主席（2005–09）和总统宗教事务顾问（2007–09）Maruf
    Amin 承认，印度尼西亚伊斯兰委员会的一些省份或市县已建议穆斯林家长将孩子送往伊斯兰学校以维护“正确的信仰”（`aqidah`）。MUI 内部的领袖迅速指出，许多基督教学校拒绝遵守《教育法》。例如，雅加达
    MUI 报告雅加达省的新新教和天主教学校没有为学生提供伊斯兰教学（MUI, 2008a: 29–32）。然而，对于未能实施宗教教育的基督教学校，目前没有可用数据。根据基督教学者
    Frans Magnis Suseno，一些新新教和天主教学校反对《教育法》，因为他们认为自己不应该为其他宗教提供宗教教育，尽管与其神学院相关的基督教学校没有采取这种方法。


    总体而言，印度尼西亚有关宗教教育的国家法律经历了重大变化。由于伊斯兰主义运动限制基督教学校的影响，政府要求在公立和私立学校根据根据学生的宗教提供宗教教育。这项政策尚未广泛实施，我展示了某些学校通过开发创新的、替代性的宗教教育方法，颠覆了这项政策，并暗示了基督教化的刻板印象。


    ## 新教学校的多样性


    新新教学校也采取了多样化的方法。一些新教学校改变了以前宗教教育课程的名称和内容。例如，许多新教学校不再将这些课程称为“宗教教育”或“基督教教育”，而是称为`pendidikan
    moral/ethika`或`pendidikan budi pekerti`性格教育）。这至少表明基督教学校意识到宗教教学是一个极具争议的问题。一些新教学校的课程经过了调整，以避免争议并教育学生关于所有宗教以及道德和伦理问题。


    ## 穆哈马迪的改革


    除了基督教学校，穆哈马迪经营的学校发生了两个重大变化。首先，由穆哈马迪前领导（1998–2005）Ahmad Syafi’i Ma’arif 创立的 Maarif
    研究所，为穆哈马迪学校发布了新的新的宗教教育课程。该课程由 Abdul Mu’ti（文明对话与合作中心主任）和 Maarif 研究所项目总监 Fajar Riza
    Ul Haq 为普通中学（`sekolah menengahah umum`，SMU）设计。该课程有两个主要重点：关于穆哈马迪的教育，以及从人权角度对伊斯兰教的教育。第一门科目和相应的教材名为`Kemuhammadiyahan`，即“穆哈马迪性”或“穆哈马迪的精髓”（Maarif
    Institute, 2008a）。根据 Abdul Mu’ti 的说法，这些材料为穆斯林和非穆斯林学生提供了一个学习穆哈马迪的基础、历史和教义的机会。它旨在促进对穆哈马迪核心价值观的理解，并帮助基督教学生理解伊斯兰教内部的多样性，例如为什么加入穆哈马迪的穆斯林在纳哈达图乌兰经营的清真寺祈祷时不会感到舒服。教材甚至提到了极具争议的`aliran
    sesat`问题，即被认为是“异端”的群体。它处理这个问题的方法是强调和谐与宽容的需要，并平衡维护伊斯兰教真实教义的重要性（Maarif Institute,
    2008a: 51–56）。考虑到针对艾赫迈迪亚（Ahmadiyah）的持续争议（参见 Crouch, 2012），这是非常了不起的。重要的是教学手册还包含了关于“异端”派的信息，以促进伊斯兰教教师之间更大的宽容（Maarif
    Institute, 2008b:23）。第二门科目集中在伊斯兰教教义上，教材名为`Al-Islam`（Maarif Institute, 2008b）。该课程是为穆斯林学生设计的，以便他们从人权视角学习他们的宗教。例如，其中一节课涉及宗教自由，这在印度尼西亚是由于宗教少数群体建造宗教场所的困难而特别重要的（见第
    5 章）。


    ## 欺骗传教


    在印度尼西亚，关于传教的政府指南自 1970 年代以来一直存在，如第 2 章所示。然而，将孩子改变宗教的罪行是一项相对新的发展。在苏哈尔托时期，1979 年第
    4 号儿童福利法处理了儿童保护的需求，尽管它不包含对传教的禁止。1990 年，苏哈尔托总统批准了联合国儿童权利公约（1989）。该公约第 14 条要求尊重儿童宗教自由，尽管它没有明确规定这是否包括改变宗教。这种解释比《公民权利和政治权利公约》（ICCPR）要窄，后者被广泛解释为包括改变宗教。自
    1998 年以来，印度尼西亚有关保护的法律经历了重大改革。1999 年 11 月，人权部长宣布儿童保护委员会将起草儿童保护法案。2000 年 2 月，建议儿童保护法案。2001
    年 11 月，在进一步讨论后，立法机构提出了修订版的儿童保护法案。在此过程中，关于儿童保护法案第 86 条的讨论是缺失的。这可以用儿童保护法案通过立法者的表现不佳来解释（Jakarta
    Post, 2002 年 9 月 24 日）。2002 年 10 月，儿童保护法生效并规定了儿童保护的标准，其主要目的是解决体待、人口贩卖、童工、收养和监护等问题。国家儿童保护法包含了许多关于孩子宗教规定，旨在确保孩子有权接受父母的宗教。它保护孩子根据父母进行宗教的权利（`art.
    4(1)`）。它明确父母不明的孩子必须遵循该地区大多数人口的宗教，即伊斯兰教（`art. (1)`）。它要求穆斯林家长和监护人教育孩子他们的宗教，特别是背诵《古兰经》（`art.
    2(2)`）。领养父母必须与他们照顾孩子的宗教或使命（`misi`）一致（`art. 9(3)`），监护人也是如此（`art. 19(1)`）。第 59 条还有禁止领养父母或监护人改变孩子宗教的规定，其处罚是监禁，与儿童保护法第
    86 条类似。领养父母、监护人和收养父母必须与孩子相同的宗教。此外，任何照顾儿童的宗教组织（如孤儿院）只被允许照顾相同宗教的孩子（`art. 37`）。在法案通过之前，关于这一问题曾有过讨论，父母必须与他们收养的孩子宗教相同（Jakarta
    Post, 2002 年 9 月 24 日）。MUI 等组织成功游说政府确保儿童保护法只允许领养父母收养相同宗教的孩子，以防止通过收养发生转化风险（Jakarta
    Post, 2002 年 7 月 19 日）。这项政策的变化似乎部分是为了安抚总统梅加瓦蒂·苏卡诺诺的脆弱联盟成员（《澳洲澳洲》，2005 年 1 月 22
    日）。随后的条例加强了领养父母必须与领养孩子相同的宗教，如果孩子的父母宗教不明，孩子应该遵循该地区大多数人口的宗教。


    国家儿童保护法及相应的儿童保护条例反映了 MUI 在收养问题上的立场，这种立场体现在 1984 年发布的一个`fatwa`中（宗教部, 2003: 178–81）。特别是，这项`fatwa`决定“从亲生父母处收养孩子是违背伊斯兰教`syariah`的”，这意味着一对夫妇只能收养孤儿。此外，当孩子被收养时，它规定收养不应改变孩子的宗教。除了国家法律和印度尼西亚伊斯兰委员会，亚齐是唯一被允许执行伊斯兰法的省。2004
    年海啸之后，出现了许多关于亚齐孩子的问题，引发了对穆斯林儿童被基督教化的担忧。有指控称某些组织的海后援助努力（特别是外国非穆斯林组织）利用了穆斯林孤儿的脆弱性。例如，2005
    年，位于美国的基督教援助组织 Worldhelp 试图从亚齐运 300 名孩子到雅加达，打算在当地的孤儿院培养他们。这被当地官员和伊斯兰宗教领袖阻止了，因为担心他们会试图将儿童转化为基督教（国际人权，2005
    年 1 月 17 日）。在此类事件发生后，亚齐省政府通过了关于儿童保护的`Qanun 11/2008`条例，部分地解决了对外国援助组织传教的担忧。这项`Qanun`保护了孩子根据父母进行宗教的权利（`art.
    4(1)`）。它明确父母不明的孩子必须遵循该地区大多数人口的宗教，即伊斯兰教（`art. (1)`）。它要求穆斯林家长和监护人教育孩子他们的宗教，特别是背诵《古兰经》（`art.
    2(2)`）。领养父母必须与他们照顾孩子的宗教或使命（`misi`）一致（`art. 9(3)`），监护人也是如此（`art. 19(1)`）。第 59 条还有禁止领养父母或监护人改变孩子宗教的规定，其处罚是监禁，与儿童保护法第
    86 条类似。此外，该`Qanun`与国家《教育法》有许多相似之处，但也存在一些重要的区别。重点是每个孩子都有权接受高质量的伊斯兰教教育。《教育法》第`12(1)(a)`条包含的相同权利在第`9(1)(a)`条得到了复制，但它增加了免受违反宗教、法律或习俗规范行为侵害的权利。这可以被解读为禁止对已有宗教的人进行传教。`Qanun`对学生规定了社会和道德义务，不得吸烟、喝酒或吸毒，也不得参与色情、色情行为、赌博或通奸。`Qanun`还规定父母有责任确保孩子接受基础宗教教育（`art.
    10(2)`）。对背诵《古兰经》有特定要求，学生只有在满足这些要求时才能从小学毕业（`art. 26(3)`），而初中毕业则需要更高的阿拉伯语能力（`art.
    27(4)`）。最后，它专门处理了外国非穆斯林组织，并要求此类机构在亚齐建立教育机构必须获得许可（`art. 59`），对外国教育机构实施了高水平的控制。这项`Qanun`对伊斯兰宗教教育给予了明确的优先和强调。它还对学生、父母、教师特别是外国非穆斯林学校增加了更大的责任。除了标准的宗教教育权，`Qanun`对亚齐非穆斯林学生的宗教教育提供没有规定。


    ### 父母的权利


    父母关于孩子宗教教育的权利问题是本案的核心。控诉方称孩子没有父母的同意。他们依靠两个学生的祖母提供的证据，该奶奶声称她没有许可（p.5）。辩方对这一证据的可信度表示质疑，他们指出该奶奶参加了`Taman
    Mini Indah`（美丽微缩公园）外游，审中提交的照片证明了这一点，而且她清楚地知道她的孙子正在参加计划。辩方还辩称 Pangesti 去过奶奶家请求许可（地区法院，2005f:
    7）。法院判决没有讨论需要何种口头或书面同意，或者是否需要从一个或两个父母获得同意。尽管存在这些矛盾且缺乏证据，法院接受了控诉方的主张，即没有从父母处获得同意且应该获得同意（地区法院，2005b:
    5）。此案之所以复杂化，是因为根据 Rebekka 的说法，一些参加计划的“穆斯林”孩子实际上是混合婚姻的孩子——即一个穆斯林家长和一个基督教徒。这一具有争议的问题由穆哈马迪在国家层面进行处理，即是否允许穆哈马迪学校雇用非穆斯林教师。穆哈马迪发布的一个`fatwa`规定，如果没有合格的穆斯林教师，则允许雇用非穆斯林教师（穆哈马迪,
    1990:214）。如果有合格的穆斯林教师，则必须给予优先（穆哈马迪, 1990: 214）。教师的短缺由于正式认证计划的缺失而加剧。自 2010 年以来，宗教部实施了所有宗教教育教师的培训和资质流程。每个宗教委员会都有负责教师的认证过程。例如，牧师
    Jan S. Aritonang 作为`PGI`副主席，被赋予负责印度尼西亚所有宗教教育教师的认证过程。许多硬派伊斯兰领袖采取了协同努力，通过鼓励穆斯林家长将孩子送往伊斯兰学校来反对对基督教学校的“proselytization”努力。1998
    年以来伊斯兰宗教领袖的话语和修辞表明，他们对基督教学校试图传教的感知努力表示担忧，这种担忧超过了《教育法》的执行。这种担忧主要体现在发布`fatwa`（伊斯兰法学意见），强烈警告或禁止穆斯林家长将孩子送往基督教学校。例如，在
    1998 年 10 月的雅加达，印度尼西亚伊斯兰委员会发布了`fatwa`，宣布穆斯林学生参加宗教教育是`haram`（禁止的）。随后，发生了一场针对私立学校的协同运动，许多伊斯兰领袖强烈鼓励穆斯林家长将孩子送往伊斯兰学校。雅加达市到处挂着横幅，写着“参加基督教学校的穆斯林是
    kafir[不信教者]”，以及“把孩子送往伊斯兰学校要好”。


    ### 法庭动态与宗教权威


    雅加达宗教教育案在印度尼西亚对传教的限制上增加了一个新章节。这是唯一一个宗教教育教师被指控并被判定犯“基督教化”儿童罪的案件。该案件发生在传教活动的背景下，将置于当地的传教努力中，关于穆斯林参与其他宗教仪式的范围。父母的角色以及穆斯林孩子是否被允许基督教将得到探讨。最后，我还分析了《儿童保护法》第
    86 条是合宪的法院决的影响。


    ### 基督教的当地历史与伊斯兰教


    1950 年建立的雅加达县是一个穆斯林人口多数地区，有超过 170 万穆斯林、4368 名新教徒、2835 名天主教徒、160 名印度教徒、297 名佛教徒和
    130 名儒教徒（雅加达县，2010:207）。该地区的少数基督教社区可以追溯到 1880 年代基督教传教士的到达。首批获得许可的传教申请是针对地区（Coppel,
    2002: 294）。根据 Soejana 等人的，像 D.J. van der Linden（1837–85）这样的传教士去那里是为了加强那里建立的小型基督教社区，该社区由于雅加达第一个皈者
    Aeng Bo Swe（1810–64）而产生（End, 2006: 118）。1858 年，Aeng Bo Swe 的约 14 名亲属与他一起受洗（Coppel,
    2002: 296）。印度尼西亚华裔向基督教的转化对于雅加达等地区华裔教群的形成具有“首要意义”（Giok, 1952: 121）。这导致了雅加达北第一个第一个印度尼裔教会的建立（Schumann,
    2010: 67）。在 1858 年到 1899 年之间，有 199 人受洗（Soejana, 1997: 291）。然而，这些人中的大多数是印度尼西亚裔，有报告称印度尼西亚裔与非华人成员之间存在冲突阻碍了统一教群的形成。该地区还开了一所学校，但参加的大多数学生是印度尼西亚裔。根据
    Coppel，传教士在印度尼西亚华裔中取得更大成功是常见的，部分是因为他们占了参加基督教学校儿童的很大比例。他指出：在许多传教点，传教士发现是华裔特别被学校吸引。在某些地方，例如雅加达……教区的成员几乎全是华裔（Coppel,
    2002: 295）。印度尼西亚华裔圈中发现的对基督教更高的接受度也由出生于雅加达的转向基督教的华裔皈教者 Pow Boen Giok 所强调。Giok 指出，传教士……在没有接触华裔人口（即苏门丹人和爪哇人）之前，直接向他们传授福音实际上是不可能的（Giok,
    1952: 121）。


