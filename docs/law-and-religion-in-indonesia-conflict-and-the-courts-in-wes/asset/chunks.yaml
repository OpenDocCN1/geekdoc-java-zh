    \ of Islamic hadith\n#### Judicial review of the Child Protection Law\n#### Conclusion\n\
    \n## 5. Conflict over sacred sites\n### Depok Church Permit Case\n#### Opposition\
    \ to churches\n#### Debating the Joint Regulation 2006\n#### Role of the Inter-religious\
