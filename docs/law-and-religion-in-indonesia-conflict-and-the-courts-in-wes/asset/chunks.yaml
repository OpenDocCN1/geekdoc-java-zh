    # Law and Religion in Indonesia


    Understanding and managing inter-religious relations, particularly between Muslims
    and Christians, presents a challenge for states around the world. This book investigates
    legal disputes between religious communities in the world’s largest majority-Muslim,
    democratic country, Indonesia. It examines how the interaction between state and
    religion has influenced relations between religious communities in the transition
    to democracy.


    The book presents original case studies based on socio-legal field research of
    court disputes in West Java, a majority-Muslim province with a history of radical
    Islam. These include criminal court cases, as well as cases of judicial review,
    relating to disputes concerning religious education, permits for religious buildings
    and the crime of blasphemy.


    The book argues that the introduction of democracy has increased the politicization
    of religion in local contexts. It highlights the way in which religious disputes
    since 1998 have been localized through the decentralization of power and exacerbated
    by the central government’s ambivalent attitude towards radical Islamists who
    disregard the rule of law.


    Through a focused examination of Indonesia, as the largest majority-Muslim country
    in the world, the book examines the challenges facing governments to accommodate
    minorities and manage religious pluralism, and in doing so furthers understanding
    of state-religion relations in the Muslim world. This book is of interest to students
    and scholars of law and society in Southeast Asia; Islam and the state; politics
    of the courts; and the legal regulation of religious diversity.


    **Melissa Crouch** is Postdoctoral Fellow in the Law Faculty at the National University
    of Singapore. Her research focuses on law and religion, Islamic law, legal anthropology,
    and public law.


