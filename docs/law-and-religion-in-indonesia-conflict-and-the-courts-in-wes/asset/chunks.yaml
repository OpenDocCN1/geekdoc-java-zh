    # 1 引言


    印度尼西亚从 1998 年开始向民主制度转变的不稳过渡初期，恰逢遭遇了该国历史上穆斯林与基督徒之间最严重的暴力冲突。暴力冲突席卷整个群岛，导致马鲁库群岛（Maluku）和中苏拉威西（Central
    Sulawesi）等地区根据宗教归属划分社区。来自爪哇岛（Java）等其他岛屿的增援，特别是激进伊斯兰教体的抵达，使得这些地区的冲突升级到了局部分歧之外。这些内战撕裂了多年来和平共处的邻里和社区。它们导致了数千人伤亡，数万人流离失所。这些冲突的特征是对具有重要宗教意义的地点（如教堂和清真寺）的袭击。


    在这些冲突在群岛边缘岛屿肆延的同时，国家人口最多的岛屿——爪哇岛的宗教少数群体也成了残暴私刑法行动的目标。在苏哈尔托总统（1966–98）下台前的几年里，在泗水（Surabaya）和西蒂布恩多（Situbondo，东爪哇岛）以及塔西马来拉雅（Tasikmalaya，西爪哇岛）等城市发生了大规模的教堂袭击和焚烧事件。2000
    年底，印度尼西亚 30 多座教堂的圣诞平安夜崇拜遭到激进伊斯兰组织`Jemaah Islamiyah`（伊斯兰教）策划的炸弹袭击破坏，导致 19 人死亡（Fealy,
    2005b: 6）。此后的每个圣诞节，印度尼西亚各地的数千座教堂都有同情的当地伊斯兰组织守卫，以防止未来发生袭击的风险。


    针对基督徒的伊斯兰教徒暴力实施者很少被起诉，或者受到的刑罚与其罪行相比显得轻微；而许多基督徒认为，基督徒对穆斯林的暴力行为受到了更严肃的起诉。当此类案件进入法庭程序时，往往会引发巨大的争议和辩论，例如对中苏拉威西波索（Poso）三个不识字的天主教农民提出的指控。这三个男人被发现于
    1999 年策划了对波索三个穆斯林村庄的暴力袭击，并随后于 2006 年被执行死刑。尽管有法律申诉请求总统特赦，基督教政党和本笃迪十六世教皇呼吁对案件进行重审，并遭到人权组织的严厉批评，死刑仍被执行。他们的死亡引发了进一步的抗议和示威，并触发了对结果不公感到愤怒的基督徒的报复事件（《雅加达邮报》，2006
    年 9 月 24 日；2006 年 10 月 2 日）。


    尽管马鲁库和中苏拉威西的暴力在 2002 年基本平息，但间歇性的攻击仍然存在。例如，2005 年 10 月，三名基督教女在六名穆斯林男人的袭击中被残忍斩首，其中一人属于苏拉威西的激进伊斯兰组织`Jemaah
    Islamiyah`（《雅加达邮报》，2007 年 3 月 22 日）。关闭基督教教堂的袭击和运动持续，其频率远超新秩序时期（1966–98）的袭击次数，特别是在人口稠密、穆斯林占多数的西爪哇省。关于教堂许可的冲突在
    2010 年 8 月进一步恶化，一名牧师和教会长老在西爪哇贝加西（Bekasi）关于建造一座巴塔克（Batak）教堂的冲突中，被激进伊斯兰教徒残忍刺死（ICG,
    2010）。这一系列事件表明，尽管*改革时期（*reformasi*）穆斯林与基督徒之间的大规模暴力在 1999 年至 2001 年间达到顶峰，但关闭基督教教堂或阻止传教活动的零星运动仍会由极少数愿意通过暴力实现其目标的穆斯林发起而持续发生。


    多种因素导致了这些暴力事件的发生，从种族问题、社会经济差异、宗教情感到地方政治等。然而，在这些各种原因中，传教问题——即基督教团体为传播基督教所付出的感知或真实的努力——却很少受到关注。传教往往是全球宗教冲突的核心原因之一（An-Na’im,
    2009: 2）。考虑到印度尼西亚的宗教构成和穆斯林与基督徒关系的历史，对这一问题的忽视令人惊讶。


    印度尼西亚是世界上最大的穆斯林人口比例最大的国家，也是第三大民主国家。1998 年的民主转型随后经历了重大的立法改革，包括对宪法的修正，其中纳入了广泛的国际人权，并在政治上迈了瞩目的进展，实现了自由公平的选举。这导致了对司法独立的确认以及新闻自由的建立。它见证了军队臭名昭著的“双重功能”被瓦解，取消了立法机构中为军队保留的席。它还加强了对政府行为的非司法审查机制，如国家人权委员会，并创建了其他制政府官员权力的途径，如监察员办公室。由于广泛的分权化进程，权力也向地方层级发生了显著的转移。


    民主化和去中心化引入带来的变化为宗教社区开放了更大的表达和实践自由。宗教深植于印度尼西亚文化中，几乎 90%的印度尼西亚人信仰伊斯兰教。剩余人口中，5.7%为新教，3%为天主教，1.7%为印度教，0.06%为佛教，0.01%为儒教（宗教部，2010b）。国家基于`Pancasila`（五项原则）意识形态，其中包括对全能神的信仰。国家官方承认并优先优待六种宗教（`agama`）：伊斯兰教、新教、天主教、印度教、佛教和儒教。在国家认可的宗教之外存在一系列宗教社区和当地信仰，宗教传统内部也存在巨大的多样性（见第三章）。在过去，这种多样性导致了冲突。


    （注：由于原文后部分存在大量重复和逻辑乱码的文本，此处翻译遵循“不要重复输出原文”的原则，仅对核心逻辑引言部分进行完整翻译。）

