- fmt: "\nThis is one of the most controversial aspects of the law, because it establishes\
    \ a segregated model of religious education that is now mandatory for both public\
    \ and private schools. According to the Constitutional Court (2010a: 273), this\
    \ provision is constitutionally valid because it upholds the right to religious\
    \ freedom by ensuring that every student has the right to religious education\
    \ in Indonesia.\n\nIn 2007, the implementing regulation was passed,^(19) which\
    \ delegated the responsibility to oversee religious education to the Ministry\
    \ of Religion. The Regulation requires all educational institutions to set aside\
    \ a room for religious education classes (`art. 4(4)`), although it clarifies\
    \ that an educational institution that is based on one religion is not obliged\
    \ to build a place of worship for another religion (`art. 4(7)`). For example,\
    \ this means that it is sufficient for a Christian school to set aside a classroom\
    \ for Islamic religious education classes, it does not have to build a mosque\
    \ or `mushollah` (prayer room). According to Atho Mudzhar, Head of the Research\
    \ Division of the Ministry of Religion, this policy is intended to ensure that\
    \ the provision of religious education is not an unnecessary financial burden\
    \ on schools.^(20) The Regulation states that if an educational institution conducts\
    \ religious education that is not in line with the requirements in this Regulation,\
    \ it will receive a warning from the government or may be forced to close (`art.\
    \ 7(1)`). The forced closure of a school is a serious consequence, given the impact\
    \ it would have on the students, their families, and the loss of jobs for teachers.\n\
    \n## National Education Frameworks and Curriculum Requirements\n\nThe Regulation\
    \ distinguishes between formal, non-formal and informal education. All non-formal\
    \ religious education programs that have more than 15 students are required to\
    \ register with the Ministry of Religion, so that it can monitor religious education\
    \ programs that take place in the community. The Regulation sets out the kind\
    \ of religious education programs schools should provide for each of the six recognized\
    \ religions, including Islam, Protestantism, Catholicism, Hinduism, Buddhism and\
    \ Confucianism. The Education Law contains no explicit offence if a teacher allows\
    \ a student to attend a religious education class of a different religion.\n\n\
    ### [Innovation in religious education](#07_Contents.xhtml_ch4-2-4)\n\nThe Regulation\
    \ further requires that religious education should be a key element of school\
    \ curriculum for all primary, secondary and higher education institutions. According\
    \ to the 2004 Competence-based Curriculum (`Kurikulum Berbasis Kompetensi`), primary\
    \ schools must provide three hours of religious education per week while secondary\
    \ schools must provide two hours. A study of the actual hours allocated to religious\
    \ education in public schools conducted prior to the introduction of this curriculum\
    \ found that a student in Indonesia attended an average of 298 hours of religious\
    \ education in the first six years of formal education, or just one hour per week\
    \ (Rivard and Amardio, 2003: 214). This three hours per week guide therefore appears\
    \ to be a significant increase in comparison to current practice at the time the\
    \ regulation was introduced.\n\n## Special Autonomy: The Case of Aceh\n\nIn addition\
    \ to these national requirements, in the province of Aceh there is also `Qanun\
    \ 5/2008` on the Implementation of Education (replacing `Qanun 23/2002`) due to\
    \ special autonomy. The `Qanun` shares many similarities with the national Education\
    \ Law, but also has some important differences. The emphasis is on every child\
    \ having the right to receive high-quality, Islamic education. The same right\
    \ as contained in article `12(1)(a)` of the Education Law is replicated in article\
    \ `9(1)(a)`, but it also adds the right to be protected from behavior that is\
    \ opposed to religious, legal or customary norms. This could be read as a prohibition\
    \ on proselytization of people who already have a religion.\n\nThe `Qanun` places\
    \ social and moral obligations on students not to smoke, drink or take drugs,\
    \ or to engage in pornography, porno-action, gambling or adultery. The `Qanun`\
    \ also places a responsibility on parents to ensure a child receives basic religious\
    \ education (`art. 10(2)`). There are specific requirements to recite the `Qu’ran`\
    \ and students can only graduate from primary school if they can meet these requirements\
    \ (`art. 26(3)`), while graduation from junior high school requires further competency\
    \ in Arabic (`art. 27(4)`). Finally, it specifically addresses foreign, non-Muslim\
    \ organizations and requires such institutions to obtain permission to establish\
    \ an educational institution in Aceh (`art. 59`), placing a high level of government\
    \ control over foreign educational organizations. This `Qanun` gives clear priority\
    \ and emphasis to Islamic religious education. It also places greater responsibilities\
    \ on students, parents, teachers and foreign, non-Muslim schools in particular.\
    \ Apart from the standard right to religious education, the `Qanun` is silent\
    \ on the provision of religious education for non-Muslim students in Aceh.\n\n\
    Overall, the national laws on education in Indonesia relating to religious education\
    \ have undergone significant changes. As a result of Islamist campaigns to restrict\
    \ the influence of Christian schools, the government requires religious education\
    \ to be provided in both public and private schools according to the religion\
    \ of the student. This policy has not yet been implemented widely, and I show\
    \ that some schools subvert the policy, and by implication stereotypes of Christianization,\
    \ by developing innovative, alternative approaches to religious education.\n\n\
    ## Responses and Proselytization Concerns\n\nResponses of Muslim and Christian\
    \ organizations and schools to the introduction of the new policy on religious\
    \ education, and to concerns over proselytization through religious educational\
    \ institutions have varied. Many new approaches to religious education essentially\
    \ subvert government policy on segregated religious education by providing students\
    \ with the opportunity to learn about their own religion and that of others, as\
    \ well as about related issues of human rights, ethics and morality.\n\nThe discourse\
    \ and rhetoric of Islamist religious leaders since 1998 demonstrates concerns\
    \ about the perceived efforts of Christian schools to proselytize Muslim students,\
    \ more so than the implementation of religious education according to the Education\
    \ Law. This is primarily evident through the issuing of a `fatwa` (opinion of\
    \ Islamic legal scholars) strongly warning against, or even forbidding, Muslim\
    \ parents from sending their children to Christian schools. For example, in Yogyakarta\
    \ in October 1998, the Indonesian Ulama Council issued a `fatwa` that declared\
    \ it `haram` (forbidden) for a Muslim student to attend a non-Muslim education\
    \ class (MUI, 2008a: 25–26). This was followed by a concerted campaign against\
    \ private schools in the area, with many Islamic leaders strongly encouraging\
    \ Muslim parents to send their child to an Islamic school. There were many banners\
    \ displayed around the city of Yogyakarta bearing slogans such as ‘Muslims who\
    \ attend Christian schools are kafir [unbelievers], and ‘It is better to send\
    \ your children to Muslim schools otherwise your children might convert.’ Similar\
    \ `fatwa` were issued at the local level in other areas, such as in Bogor, West\
    \ Java. For example, the West Java `Pesantren` Cooperation Body (`Badan Kerjasama\
    \ Pondok Pesantren`) based in Bogor, issued a `fatwa` that states it is `haram`\
    \ for Muslim parents to send their children to a Christian school because of the\
    \ need to protect Muslim children from proselytization.\n\nAlthough `fatwa` have\
    \ been issued by MUI at the local level, the national MUI has not issued a `fatwa`\
    \ on religious education. Chairperson of the national MUI (2005–09) and Special\
    \ Advisor to the President on Religious Affairs (2007–09) KH Maruf Amin, admitted\
    \ that some branches of the Indonesian Ulama Council in the provinces or cities/regencies\
    \ had issued ‘recommendations’ that Muslim parents send their child to an Islamic\
    \ school to uphold ‘correct beliefs’ (`aqidah`). Leaders within MUI have been\
    \ quick to point out that many Christian schools have refused to comply with the\
    \ Education Law. For example, MUI of Yogyakarta reported that Protestant and Catholic\
    \ schools in the province of Yogyakarta did not provide Islamic instruction for\
    \ their students (MUI, 2008a: 29–32). There is, however, no legal sanction for\
    \ a school principal who fails to implement a religious education. There are currently\
    \ no data available on the total number of Christian schools that have not. According\
    \ to Catholic scholar Frans Magnis Suseno, some Protestant and Catholic churches\
    \ oppose the Education Law because they do not believe they should have to provide\
    \ religious education for other religions in a private Christian school, although\
    \ the school connected to his seminary did not take this approach. Many Christian\
    \ private schools have rejected the law, particularly in areas with a Christian\
    \ majority, because of concerns that Muslim teachers may be ‘anti-Christian’ in\
    \ their approach. Some Christian schools have ignored the requirement to provide\
    \ Islamic education for their pupils, while other Christian schools have modified\
    \ its religious education curriculum. For example, some Catholic schools have\
    \ introduced a more inclusive religious instruction class for students of all\
    \ religions, known as `pendidikan religiositas`, or ‘religiosity education’ (Leirvik,\
    \ 2004: 23). The curriculum was designed by the Catholic church in Semarang. Although\
    \ Catholic religious instruction is still taught, it is now a separate class and\
    \ non-Catholic students are not required to attend. This is not the approach of\
    \ all Catholic schools, however. A study of Catholic religious education in 11\
    \ cities across Indonesia found that approaches vary, with five different types\
    \ of curriculum currently in use. Some Catholic schools do not have a problem\
    \ with the new religious education policy and have arranged for an Islamic teacher\
    \ for their Muslim students.\n\n## Diversity in Protestant Schools\n\nA diversity\
    \ of approaches has also been taken by Protestant schools. Some Protestant schools\
    \ have changed the name and content of what used to be the Protestant religious\
    \ education class. For example, many Protestant schools no longer refer to these\
    \ classes as ‘religious education’ or ‘Christian education,’ but rather as `pendidikan\
    \ moral/ethika`, ‘ethical/moral education,’ or `pendidikan budi pekerti`, ‘character\
    \ education.’ At the least, this indicates that Christian schools are aware that\
    \ religious instruction is a highly contentious issue. The curriculum of some\
    \ Protestant schools has been adapted to avoid controversy and to educate students\
    \ about all religions, as well as about moral and ethical issues.\n\n## Muhammadiyah\
    \ Reforms\n\nAside Christian schools, there have been two major changes in the\
    \ approach taken by the schools run by Muhammadiyah. First, the Ma’arif Institute,\
    \ founded by the former leader of Muhammadiyah (1998–2005), Ahmad Syafi’i Ma’arif,\
    \ published a new religious education curriculum for Muhammadiyah schools. This\
    \ course is designed for junior high schools (`sekolah menengahah umum`, SMU)\
    \ by Abdul Mu’ti (director of the Center of Dialogue and Cooperation among Civilizations)\
    \ and Fajar Riza Ul Haq, the program director of the Ma’arif Institute. The course\
    \ had two main emphases: education about Muhammadiyah, and education about Islam\
    \ from a human rights perspective. The first subject, and corresponding textbook,\
    \ was called `Kemuhammadiyahan`, ‘Muhammadiyah-ness’ or ‘the essence of Muhammadiyah’\
    \ (Ma’arif Institute, 2008a). According to Abdul Mu’ti, this material provided\
    \ the opportunity for both Muslim and non-Muslim students to learn about the foundations,\
    \ history and teachings of Muhammadiyah. It aimed to promote understanding about\
    \ the core values of Muhammadiyah and to help Christian students understand the\
    \ diversity within Islam, such as why Muslims who affiliate with Muhammadiyah\
    \ would not feel comfortable praying in a mosque run by Nadhatul Ulama. The textbook\
    \ even mentioned the highly controversial issue of `aliran sesat`, or groups considered\
    \ to be ‘deviant.’ It approached this issue by stressing the need for harmony\
    \ and tolerance, balanced with the importance of maintaining the true teachings\
    \ of Islam (Maarif Institute, 2008a: 51–56). This is remarkable, given the ongoing\
    \ controversy against Ahmadiyah (see Crouch, 2012). Importantly, the teachers’\
    \ instruction manual also included information on ‘deviant’ sects to promote greater\
    \ tolerance among Islamic education teachers (Maarif Institute, 2008b: 203).\n\
    \nThe second subject concentrated on the teachings on Islam, and the textbook\
    \ is simply entitled `Al-Islam` (Maarif Institute, 2008b). This class was designed\
    \ for Muslim students so that they can learn about their religion from a human\
    \ rights perspective. For example, one of the lessons deals with the right to\
    \ freedom of religion and places of worship, particularly important due to the\
    \ difficulties faced by religious minorities to build places of worship (see Chapter\
    \ 5).\n\n##izing Deceptive Proselytization of Children\n\nIn Indonesia, government\
    \ guidelines on proselytization have existed since the 1970s, as explained in\
    \ Chapter 2. The offence of proselytizing a child to change his or her religion,\
    \ however, is a relatively new development. Under Soeharto, Law 4/1979 on Children’s\
    \ Welfare addressed the need for child protection, although it did not contain\
    \ a prohibition on proselytization. In 1990, President Soeharto ratified the United\
    \ Nations Convention on the Rights of the Child (1989). Article 14 of this Convention\
    \ obliges states to respect the rights of children to freedom of religion, although\
    \ does not explicitly specify whether this includes the right to change religion.\
    \ This interpretation is narrower than the International Covenant on Civil and\
    \ Political Rights (ICCPR), which has been construed widely to include the right\
    \ to change religion. National laws in Indonesia relating to child protection\
    \ have undergone significant reform since 1998. In November 1999, the Minister\
    \ of Human Rights announced that a draft bill on the protection of children would\
    \ be drafted by the National Commission for Child Protection. In February 2000,\
    \ a Child Protection Bill was suggested and in November 2001, after further debate,\
    \ an amended version of Child Protection Bill was proposed in the legislature.\
    \ During this process, there was an absence of debate concerning article 86 of\
    \ the Child Protection Bill. This may be explained by reports that the Child Protection\
    \ Bill was passed despite poor performance from legislators (Jakarta Post, 24\
    \ September 2002). In October 2002, the Child Protection Law came into force and\
    \ set out national standards for the protection of children, with the primary\
    \ aim of addressing issues such as physical abuse, trafficking, child labor, exploitation,\
    \ adoption, guardianship and custody. \n\nThe national Child Protection Law contains\
    \ numerous provisions on the religion of a child that are designed to ensure a\
    \ child has the right to education in the religion of their parents. It protects\
    \ the right of a child to worship according to their parents (`art. 4(1)`). It\
    \ clarifies that a child whose parents are missing must follow the religion of\
    \ the majority of the population in that area (`art. 5(1)`), namely Islam. It\
    \ requires Muslim parents and guardians to educate their child about their religion,\
    \ particularly the recitation of the `Qu’ran` (`art. 8(2)`). Foster parents must\
    \ have the same religion or mission (`misi`) of the child for whom they care (`art.\
    \ 9(3)`), as do guardians (art. 19(1)). There is also a prohibition in article\
    \ 59 against foster parents or guardians changing the religion of the child that\
    \ carries a penalty of imprisonment, which is similar to article 86 of the Child\
    \ Protection Law. Foster parents, guardians and adoptive parents are required\
    \ to have the same religion as the child. Furthermore, any religious organization\
    \ that cares for children, such as an orphanage, is only allowed to care for children\
    \ of the same religion (`art. 37`). Before the Bill was passed, there was some\
    \ debate concerning this issue whether parents must be of the same religion as\
    \ the child they adopt (Jakarta Post, 24 September 2002). Groups such as MUI were\
    \ successful in lobbying the government to ensure that the Child Protection Law\
    \ only allowed foster parents to adopt a child of the same religion to prevent\
    \ the risk of conversion through adoption (Jakarta Post, 19 July 2002). This change\
    \ in policy appears to have been partly to appease members of President Megawati\
    \ Soekarnutri’s fragile coalition (The Age, 22 January 2005). The Government Regulation\
    \ that followed reinforced that foster parents must have the same religion as\
    \ the foster child and if the religion of the child’s biological parents is not\
    \ known, the child should follow the religion of the majority of the population\
    \ in that area.\n\nThe national Child Protection Law and corresponding Government\
    \ Regulation on Child Protection reflect the position of MUI on the issue of adoption\
    \ as expressed in a `fatwa` issued in 1984 (Ministry of Religion, 2003: 178–81).\
    \ In particular, this `fatwa` decided that ‘Adopting a child from a birth father\
    \ and mother is opposed to Islamic `syariah`,’ which suggests a couple can only\
    \ adopt orphans. Further, when a child is adopted, it specifies that adoption\
    \ should not change the religion of the child. Aside from the national law and\
    \ the Indonesian Ulama Council, Aceh is the only province that is allowed to enforce\
    \ Islamic law. After the tsunami in 2004, there were many issues concerning children\
    \ from Aceh and this raised fears that Muslim children were being Christianized.\
    \ There were allegations that the post-tsunami aid efforts of some organizations,\
    \ particularly foreign non-Muslim organizations, were exploiting the vulnerability\
    \ of Muslim orphans. For example, in 2005, Worldhelp, an American-based Christian\
    \ aid group, attempted to transport 300 children from Aceh to Jakarta with the\
    \ intention of raising them in an orphanage there. It was prevented from doing\
    \ so by local officials and Islamic religious leaders because of fears that it\
    \ would attempt to convert the children to Christianity (Human Rights Without\
    \ International, 17 January 2005). In the wake of such alleged incidents, the\
    \ provincial government of Aceh passed `Qanun 11/2008` on Child Protection, which\
    \ in part addressed concerns over Christian proselytization by foreign aid organizations.\
    \ This `Qanun` protects the right of a child to practice the religion of their\
    \ parents (`art. 4(1)`). A child whose parents are missing must follow the religion\
    \ of the majority of the population in that area (`art. 5(1)`), namely Islam.\
    \ It requires Muslim parents and guardians to educate their child about their\
    \ religion, particularly the recitation of the `Qu’ran` (`art. 8(2)`). Foster\
    \ parents must have the same religion or mission (`misi`) of the child for whom\
    \ they care (`art. 9(3)`), as do guardians (art. 19(1)). There is also a prohibition\
    \ in article 59 against foster parents or guardians changing the religion of the\
    \ child that carries a penalty of imprisonment, which is similar to article 86\
    \ of the Child Protection Law. There are clear parallels between the national\
    \ Child Protection Law and the `Qanun` on Child Protection in Aceh, although the\
    \ latter goes further in protecting Islam and addressing concerns over proselytization\
    \ by foreign aid organizations. The `Qanun` in Aceh and the national Child Protection\
    \ Law were the first of their kind. The national government’s commitment to implement\
    \ the Child Protection Law was reinforced by `Presidential Decision 77/2003`,\
    \ which established the Commission for the Protection of Children (`Komisi Perlindungan\
    \ Anak Indonesia`, `KPAI`) to oversee the Child Protection Law (`art. 74–76`).\n\
    \n[/content]\n\nThe Ministry of Religion, together with the Department of Education,\
    \ aims to address this problem by assisting schools to find qualified and available\
    \ religious education teachers to teach religious education classes. One way of\
    \ addressing this issue, which is common practice in Indonesia, is to allow religious\
    \ education to take place outside of school hours. This allows flexibility so\
    \ that, for example, attending Sunday School on a Sunday counts as ‘religious\
    \ education’ for children, as long as the church reports the grades of the children\
    \ to the school, as happened in the Indramayu Religious Education Case. A related\
    \ issue dealt with by Muhammadiyah at the national level is whether it is permissible\
    \ for a Muhammadiyah school to employ a non-Muslim teacher. A `fatwa` issued by\
    \ Muhammadiyah states that if there is no Muslim qualified and available to teach,\
    \ then it is permissible to employ a non-Muslim teacher (Muhammadiyah, 1990: 214).\
    \ If there is a qualified (Muhammadiyah) Muslim teacher available, then they must\
    \ be given preference (Muhammadiyah, 1990: 214). The shortage of teachers and\
    \ funding is compounded by the absence of a formal accreditation program. Since\
    \ 2010, the Ministry of Religion has implemented a training and qualification\
    \ process for all religious education teachers. Each national religious council\
    \ has the responsibility to oversee the certification process for teachers. For\
    \ example, Pastor Jan S. Aritonang, as the vice-chairperson of the national `PGI`,\
    \ was given the responsibility to oversee the certification process for all Protestant\
    \ religious education teachers in Indonesia. There have been concerted efforts\
    \ by hardline Islamic religious leaders to oppose perceived ‘proselytization’\
    \ efforts of Christian schools by encouraging Muslim parents to send their child\
    \ to an Islamic school. Acutely aware of this issue, and of broader concepts of\
    \ tolerance and human rights, some Muslim and Christian schools have begun to\
    \ change their approach to religious education, placing a greater emphasis on\
    \ human rights and religious freedom, as well as ethics and morality, independent\
    \ of the more restrictive developments in government policy. In addition to the\
    \ Education Law, however, there have also been expressions of concern about the\
    \ need to protect the religion of a child in the amendments to the Child Protection\
    \ Law.\n\n### Court dynamics and religious authority\n\nThe Indramayu Religious\
    \ Education Case adds a new chapter in the enforcement of limits on proselytization\
    \ in Indonesia. It is the only case in which religious education teachers have\
    \ been charged and found guilty of the criminal act of ‘Christianizing’ children.\
    \ The case took place within the context of history of missionary activity and\
    \ radical Islam. It will be situated within the history of missionary efforts\
    \ in the area and the debate over the extent which Muslims can participate in\
    \ the ceremonies of other religions in particular. The role of parents and whether\
    \ a Muslim child is allowed to convert will be explored. Finally, I also analyze\
    \ the implications of the Court’s decision that article 86 of the Child Protection\
    \ Law is constitutional.\n\n### Local history of Christianity and radical Islam\n\
    \nThe regency of Indramayu, established in 1950, is a majority Muslim area, with\
    \ over 1.7 million Muslims, 4,368 Protestants, 2,835 Catholics, 160 Hindus, 297\
    \ Buddhists and 130 Confucianists (Regency of Indramayu, 2010: 207). The minority\
    \ Christian community in the area can be traced back to the arrival of Christian\
    \ missionaries in the 1880s. Among the first missionary applications to be approved\
    \ for permission were for the regions of Indramayu and Cirebon (Coppel, 2002:\
    \ 294). According to Soejana *et al.*, missionaries such as D.J. van der Linden\
    \ (1837–85) went there to strengthen the small Christian community that had been\
    \ established there as a result of the first convert to Christianity in Indramayu,\
    \ Ang Boeng Swi (1810–64) (End, 2006: 118). In 1858, about 14 of Ang Boeng Swi’s\
    \ relatives were baptized with him (Coppel, 2002: 296). The conversion of Indonesian\
    \ Chinese to Christianity was of ‘primary importance’ to the formation of Chinese\
    \ congregations in areas such as Indramayu (Giok, 1952: 121). This led to the\
    \ establishment of the first Chinese Indonesian church north of Cirebon (Schumann,\
    \ 2010: 67). Between 1858 and 1899, 199 people were baptized (Soejana, 1997: 291).\
    \ Most of these people, however, were Chinese Indonesians, and there were reports\
    \ of conflict between Chinese Indonesians and non-Chinese members that impeded\
    \ the formation of a united congregation. A school was also opened in the area,\
    \ but most of the students who attended were Chinese Indonesians. According to\
    \ Coppel, it was common for missionaries to have greater success among the Chinese\
    \ in Indonesia, partly because they made up a large percentage of the children\
    \ who attended Christian schools. He notes: in many of the mission posts, the\
    \ missionaries found it was the Chinese who were attracted particularly to the\
    \ schools. In some places, for example Indramayu … the members of the parish were\
    \ almost all Chinese (Coppel, 2002: 295). The greater acceptance Christianity\
    \ found in Indonesian Chinese circles is also highlighted by Pow Boen Giok, a\
    \ Chinese convert to Christianity who was born in Indramayu. Giok notes that it\
    \ was practically impossible for missionaries … to preach the gospel directly\
    \ to the autochthonous population ie Sundanese and Javanese, without first coming\
    \ into contact with the Chinese population (Giok, 1952: 121). Indramayu was considered\
    \ to be a difficult posting for missionaries because of the resistance of the\
    \ Sundanese, the majority Muslim ethnic group in the area, to missionary efforts\
    \ (End, 2006: 511). There were reports of challenges winning new converts because\
    \ people were afraid they would lose their job if they became Christian, due to\
    \ the way new converts were often ostracized from the community. As a result,\
    \ some converts later returned to Islam due to the negative reactions their conversions\
    \ generated (Soejana, 1997: 451). In light of this history, the majority of Christians\
    \ in Indramayu today are Chinese (or at least non-Sundanese) and has led to the\
    \ perception among Islamists that Christians in the area are ‘foreigners.’ Pastor\
    \ Supriyatno, of the Pasundan Christian Church and former chairperson of PGI West\
    \ Java, suspected that part of the issue Indramayu Religious Education Case was\
    \ racial discrimination. Converts to Christianity were a cause for Muslims in\
    \ the community. The first convert was Aung Boe Swie, and his conversion was followed\
    \ by others such as Gouw Kho (1868), Khouw San (Purbolinggo) and Oei Soei Tiong\
    \ (Hartono, 1974: 87). Another example of conversion to Christianity in Indramayu\
    \ is Kartawidaja, an elite bureauc. His baptism in 1899 came as a shock and was\
    \ considered by some to be apostasy (Ricklefs, 2007: 120). Ricklefs highlights\
    \ that ‘Kartawidaja’s story thus reflected the profound social and personal conflicts\
    \ that sometimes attended conversions’ (Ricklefs, 2007). One of the practices\
    \ that developed among Christian mission organizations in the early 1900s was\
    \ to purchase land and establish settlements, particularly because many converts\
    \ to Christianity were poor. One such settlement was established in Haurgeulis-Rehoboth\
    \ in 1912 (End, 2006: 44–48). In 1908, the Dutch Mission Society (`Nederlands\
    \ Zendings Vereeniging`, NZV) established a hospital in Indramayu (End, 2006:\
    \ 21). The NZV also provided practical assistance to the community in times of\
    \ crisis, such as during the famine that hit Indramayu in 1903 (End, 2006: 32).\
    \ Aside from being targeted by missionaries, in the early 1950s Indramayu was\
    \ a target for Islamization by Darul Islam, a radical Islamic movement led by\
    \ Kartosowirjo (Jubilee Campaign, 8 July 2005). By the 1960s, Darul Islam and\
    \ its attempts to make an Islamic State had largely been suppressed by the central\
    \ government (as explained in Chapter 3), not entirely. After Kartosowirjo was\
    \ killed in 1962, covert veterans of Darul Islam persisted and in 1970 the group\
    \ broke into two branches (Wasis, 2003: 185). The leader of one of branches was\
    \ jailed in 1980, and he delegated his authority to Abu Toto (also known as Panji\
    \ Gumilang). He led Darul Islam’s 9th Regional Command (known as KW9), which included\
    \ West Java and Jakarta, and was believed to have about 50,000 followers (Fealy,\
    \ 2007: 69). Under his leadership, the `Al-Zaytun` boarding school was constructed\
    \ in Haurgeulis, Indramayu (Wasis, 2003: 187). It received financial support from\
    \ former President Habibie and from Soeharto (Pringle, 2010: 128–29), and one\
    \ of the buildings is named in honor of Soeharto. The Al-Zaytun Islamic boarding\
    \ school is the largest Islamic `madrasah` in Southeast Asia (Washington Times,\
    \ 29 August 2005). It accommodates 7,000 students, both male and female, and has\
    \ a building campaign to accommodate 18,000 more. It is also building a sixstorey\
    \ mosque. The point of concern, however, is that Al-Zaytun has suspected links\
    \ to radical movements such as Darul Islam and Negara Islam Indonesia (NII) (Fealy,\
    \ 2004: 112). In early 2000, Al-Zaytun was accused of deviating from the teachings\
    \ of Islam, although investigations by the Ministry of Religion found no evidence\
    \ of this (Hefner, 2009: 104). In 2002, the police made a number of arrests of\
    \ suspected members of NII, from South Bandung, North Lampung and West Java. Those\
    \ from West Java had alleged connections to Al-Zaytun boarding school (Jakarta\
    \ Post, 9 April 2002; 11 April 2002). While there is no direct link between Al-Zaytun\
    \ and Darul Islam in the Indramayu Religious Education Case, radical Islamists,\
    \ many from outside the area, demonstrated during the court proceedings. They\
    \ called for `jihad` (holy war) and `mati syahid` (religious martyrdom) if the\
    \ women were not convicted. The court hearings were accompanied by chants of `Allahu\
    \ Akbar` (God is great) and demands that the women be hanged. Anonymous death\
    \ threats were also made towards other pastors and Christian workers in the area\
    \ at this time (District Court, 2005d: 2). The Defense argued that the evidence\
    \ given at trial may have been influenced by the intense intimidation, threats\
    \ and bribery from radical Islamic groups. It is possible that the presence and\
    \ pressure exerted by radical Islamists at the trial negatively influenced the\
    \ evidence given by the witnesses, as well as the decision of the court. Such\
    \ opposition and tension between Muslims and Christians in Indramayu has occurred\
    \ previously on several occasions. In 1967, a church in Indramayu was burnt down\
    \ because of accusations a Christian had insulted Islam. There have also been\
    \ tensions caused by Christians using houses as churches. Aside from the pressure\
    \ of radical Islamic groups at court trials and incidents over churches, there\
    \ have also been concerted campaigns to introduce aspects of Islamic law in local\
    \ regulations. These do not have the status of regional regulations, but are rather\
    \ instructions or decisions issued by the regent. Nevertheless, it is still a\
    \ symbol of support for hardline Islam in the area. This perceived moral crisis\
    \ has provided some motivation for the creation of a number of regulations on\
    \ aspects of Islamic law. Between 2001 and 2009, over 50 regulations were issued\
    \ in various forms, including the form of a Letter, a Appeal, an Instruction or\
    \ Decision. These regulations address issues such as prohibiting alcohol, requiring\
    \ Muslim clothing in schools, `zakat` (giving alms) and compulsory reading of\
    \ `Qur’an` for civil servants. The emphasis on religious education is particularly\
    \ strong, with over 50 regulations addressing the obligation for all Muslim children\
    \ to receive Islamic education. There is also a decision concerning spiritual\
    \ counselors for hospitals. These regulations – on education and spiritual care\
    \ in hospitals – are evidence of concern for the ‘vulnerable’ such as children\
    \ or the sick. It may also be a reaction to the controversy caused by the Indramayu\
    \ Religious Education Case, which raised doubts about the intention of those who\
    \ provided religious education and medical services.\n\n### Teachers and inter-religious\
    \ relations\n\nThere are numerous versions of what happened in this case, depending\
    \ on the person asked. One of the key issues was the intent of the teachers and\
    \ the broader question of the extent which Muslims are allowed. In terms of the\
    \ nature and purpose of the program, it was generally agreed by both parties that\
    \ the program included learning Christian songs; coloring in pictures of people\
    \ such as Abraham, Noah and Zachaeus (described by the Prosecution as ‘Christians,’\
    \ although they are figures common to the Abrahamic faiths); reading stories from\
    \ the Bible about Jesus; and learning Christian prayers. The Prosecution investigator\
    \ Muhammad Nursadat called this program `Minggu Ceria Kristenisasi`, the ‘Happy\
    \ Sunday Christianization.’ The insertion of the term ‘Christianization’ into\
    \ the name of the program was an attempt to label the program with negative connotations\
    \ and fears that are inherent in the term ‘Christianization’ in Indonesia (District\
    \ Court, 2005f: 5). The Defense claimed that this was not the actual name used\
    \ by the church and ‘Christianization’ was not the intention of the teachers or\
    \ the program (District Court, 2005f: 1). The Defense pointed out that this program\
    \ was initiated by the request of Christian parents and the local primary school\
    \ so that Christian students could aim to achieve a good score for religious studies\
    \ at school (District Court, 2005b: 7, 8). The Defense contended that although\
    \ the program was aimed at Christian students, there was no legal prohibition\
    \ in Indonesia on Muslim students attending a Christian program. The court agreed\
    \ with the Prosecution that the program should only be for Christian children,\
    \ and non-Christian children should not be allowed to participate the program\
    \ (p.5). This goes further than the Education Law, and interprets the segregation\
    \ policy as a prohibition on a child learning another religion. The court accepted\
    \ the evidence of the MUI investigator, although it did not go as far as call\
    \ the program a ‘Christianization’ program (p.12). This decision is similar to\
    \ the `fatwa` of MUI that declared it `haram` for Muslims to attend Christmas\
    \ celebrations. It is common in Indonesia for Muslims to invite Christians to\
    \ celebrations as `buka puasa`, the meal to break the fast during Ramadan. Similarly,\
    \ Christians often invite Muslims to Christmas celebrations at the workplace,\
    \ at school or in the neighborhood (Mudzhar, 1996: 233). The controversy over\
    \ Christmas celebrations first arose in the 1980s. In March 1981, MUI issued a\
    \ `fatwa` that opened a broader debate on attendance at religious celebrations\
    \ by those who profess another religion (Ministry of Religion, 2003: 235–42).\
    \ The `fatwa` stated that it is `haram` for a Muslim to attend a Christmas celebration\
    \ because these celebrations are Christian religious rituals. It justified this\
    \ position by arguing that while Muslims may cooperate with non-Muslims for community\
    \ or humanitarian causes (Q 49:13, 31:15, 60:8), attendance at such celebrations\
    \ could jeopardize the faith of a Muslim. This was followed by several `fatawa`\
    \ from Muhammadiyah that reinforced the MUI `fatwa` by declaring that Muslims\
    \ should not say ‘Merry Christmas’ to Christians (Muhammadiyah, 1991: 209–10;\
    \ Muhammadiyah, 2003: 276). The `fatwa` of MUI did not go down well with the government\
    \ because of its potential to destabilize inter-religious relations, and the government\
    \ specifically instructed MUI to retract the `fatwa` (Mudzhar, 1996: 237). The\
    \ Minister of Religion supported MUI, arguing that it was necessary for the sake\
    \ of national unity (Ministry of Religion, 2008a: 202, 243–46). The `Qanun` shares\
    \ many similarities with the national Education Law, but also has some important\
    \ differences. The emphasis is on every child having the right to receive high-quality,\
    \ Islamic education. The same right as contained in article `12(1)(a)` of the\
    \ Education Law is replicated in article `9(1)(a)`, but it also adds the right\
    \ to be protected from behavior that is opposed to religious, legal or customary\
    \ norms. This could be read as a prohibition on proselytization of people who\
    \ already have a religion. The `Qanun` places social and moral obligations on\
    \ students not to smoke, drink or take drugs, or to engage in pornography, porno-action,\
    \ gambling or adultery. The `Qanun` also places a responsibility on parents to\
    \ ensure a child receives basic religious education (`art. 10(2)`). There are\
    \ specific requirements to recite the `Qu’ran` and students can only graduate\
    \ from primary school if they can meet these requirements (`art. 26(3)`), while\
    \ graduation from junior high school requires further competency in Arabic (`art.\
    \ 27(4)`). Finally, it specifically addresses foreign, non-Muslim organizations\
    \ and requires such institutions to obtain permission to establish an educational\
    \ institution in Aceh (`art. 59`), placing a high level of government control\
    \ over foreign educational organizations. This `Qanun` gives clear priority and\
    \ emphasis to Islamic religious education. It also places greater responsibilities\
    \ on students, parents, teachers and foreign, non-Muslim schools in particular.\
    \ Apart from the standard right to religious education, the `Qanun` is silent\
    \ on the provision of religious education for non-Muslim students in Aceh.\n\n\
    ### Rights of parents\n\nThe issue of the rights of parents in relation to religious\
    \ education of children was central to the case. The Prosecution claimed the children\
    \ did not have the consent of parents. They relied on the evidence of a grandmother\
    \ of two students who claimed she had not given permission (p.5). The credibility\
    \ of this evidence was questioned by the Defense, who pointed out that same grandmother\
    \ had attended `Taman Mini Indah` (Beautiful Miniature Park) outing, evidenced\
    \ by photographs presented at the trial, and was clearly aware that her grandchildren\
    \ were attending the program. The Defense also argued that Pangesti had visited\
    \ the grandmothers’ house to ask for permission (District Court, 2005f: 7). The\
    \ court decision no discussion of what oral or written consent was required, or\
    \ whether consent needed to be obtained from one or both parents. Despite these\
    \ contradictions and the absence of evidence, the court accepted the Prosecution’s\
    \ argument that consent had not been obtained from the parents and that consent\
    \ should have been obtained (District Court, 2005b: 5). This case was complicated\
    \ by the fact that, according to Rebekka, some of the ‘Muslim’ children who attended\
    \ the program were actually children of mixed marriages – that is one Muslim parent\
    \ and one Christian. The controversial issue of mixed marriages, and the religion\
    \ of children from those marriages, has long been a subject of debate in Indonesia.\
    \ An initial Draft Law on Marriage put forward in 1973 proposed to allow inter-religious\
    \ marriages. The removal of this provision before the passage of the Marriage\
    \ Law in 1974 was widely perceived as a concession to Muslims who strongly disagreed\
    \ with this provision. As it currently stands, Law 1/1974 on Marriage neither\
    \ specifically prohibits nor permits inter-religious marriages. The status or\
    \ permissibility of inter-religious marriages in Indonesia therefore remains unclear.\
    \ This is despite the fact that the traditional Islamic position is that a Muslim\
    \ man may take a Muslim, Christian or Jew as a wife, although a Muslim woman may\
    \ only marry a Muslim man (Q 5:5). A number of `fatawa` issued by Islamic religious\
    \ leaders since then have attempted to impose a different interpretation of inter-religious\
    \ marriages in Indonesia. In June 1980, a `fatwa` issued by MUI expressly forbade\
    \ Muslims from marrying Christians. It made two points: that marriage between\
    \ a Muslim woman and a non-Muslim man is `haram`; that a Muslim man is forbidden\
    \ (`diharamkan`) from marrying a non-Muslim woman. MUI reissued this `fatwa` in\
    \ 2005 (MUI, 2005: 35–44). Muhammadiyah (2003: 205–6) has also issued a `fatwa`\
    \ that forbids a Muslim from marrying a person who has no religion. It also forbade\
    \ a Muslim woman from marrying a Christian man, although it allows a Muslim man\
    \ to marry a Christian woman. This issue was not discussed in court.\n\n### Evidence\
    \ of child conversion\n\nAnother disputed issue was whether a child has the right\
    \ to convert. It also raised the issue of what amounts to conversion to Christianity,\
    \ whether the Muslim children had actually converted, and whether it was necessary\
    \ for the children to have converted for the elements of article 86 to be satisfied.\
    \ The head of the local MUI, Mundzir, initially claimed that one Muslim student\
    \ had converted to Catholicism. The validity of his evidence was quickly countered\
    \ by the Defense, who pointed out that this was not possible through this program\
    \ because the teachers’ church was Protestant, not Catholic (District Court, 2005f:\
    \ 1). An 11-year-old student gave evidence that she was ordered to convert, but\
    \ she had forgotten how or when this occurred (District Court, 2005b: 23). In\
    \ the opinion of expert Muslim witness Abdul Wachid Syakuri, however, actual conversion\
    \ was not necessary, contrary to the wording of article 86. The mere involvement\
    \ of Muslim children in the Happy Sunday program meant they had implicitly converted.\
    \ He was quoted as stating that ‘Muslim children who are invited to participate\
    \ in a Happy Sunday program and sing Christian songs and pray Christian prayers\
    \ are apostates [`murtad]`’ (p.16).\n\nOn the other hand, the leader of the Protestant\
    \ Division of the Ministry of Religion of West Java, John Nainggolan, opined that\
    \ ‘Christian children’ are children who have been baptized and that mere participation\
    \ in a Happy Sunday program did not make a child Christian. Building on this,\
    \ the Defense argued that the teachers had not baptized any of the children. The\
    \ court accepted the evidence of Nainggolan that baptism was a sign that child\
    \ was Christian (p.8). This interpretation is significant, as it sets a low threshold\
    \ for conversion.\n"
  raw: 'This is one of the most controversial aspects of the law, because it establishes
    a segregated model of religious education that is now mandatory for both public
    and private schools. According to the Constitutional Court (2010a: 273), this
    provision is constitutionally valid because it upholds the right to religious
    freedom by ensuring that every student has the right to religious education in
    Indonesia.In 2007, the implementing regulation was passed,^(19) which delegated
    the responsibility to oversee religious education to the Ministry of Religion.
    The Regulation requires all educational institutions to set aside a room for religious
    education classes (art. 4(4)), although it clarifies that an educational institution
    that is based on one religion is not obliged to build a place of worship for another
    religion (art. 4(7)). For example, this means that it is sufficient for a Christian
    school to set aside a classroom for Islamic religious education classes, it does
    not have to build a mosque or *mushollah* (prayer room). According to Atho Mudzhar,
    Head of the Research Division of the Ministry of Religion, this policy is intended
    to ensure that the provision of religious education is not an unnecessary financial
    burden on schools.^(20) The Regulation states that if an educational institution
    conducts religious education that is not in line with the requirements in this
    Regulation, it will receive a warning from the government or may be forced to
    close (art. 7(1)). The forced closure of a school is a serious consequence, given
    the impact it would have on the students, their families, and the loss of jobs
    for teachers.The Regulation distinguishes between formal, non-formal and informal
    education. All non-formal religious education programs that have more than 15
    students are required to register with the Ministry of Religion, so that it can
    monitor religious education programs that take place in the community. The Regulation
    sets out the kind of religious education programs schools should provide for each
    of the six recognized religions, including Islam, Protestantism, Catholicism,
    Hinduism, Buddhism and Confucianism. The Education Law contains no explicit offence
    if a teacher allows a student to attend a religious education class of a different
    religion.The Regulation further requires that religious education should be a
    key element of school curriculum for all primary, secondary and higher education
    institutions. According to the 2004 Competence-based Curriculum (*Kurikulum Berbasis
    Kompetensi*), primary schools must provide three hours of religious education
    per week while secondary schools must provide two hours. A study of the actual
    hours allocated to religious education in public schools conducted prior to the
    introduction of this curriculum found that a student in Indonesia attended an
    average of 298 hours of religious education in the first six years of formal education,
    or just one hour per week (Rivard and Amardio, 2003: 214). This three hours per
    week guide therefore appears to be a significant increase in comparison to current
    practice at the time the regulation was introduced.In addition to these national
    requirements, in the province of Aceh there is also Qanun 5/2008 on the Implementation
    of Education (replacing Qanun 23/2002) due to special autonomy. The Qanun shares
    many similarities with the national Education Law, but also has some important
    differences. The emphasis is on every child having the right to receive high-quality,
    Islamic education. The same right as contained in article 12(1)(a) of the Education
    Law is replicated in article 9(1)(a), but it also adds the right to be protected
    from behavior that is opposed to religious, legal or customary norms. This could
    be read as a prohibition on proselytization of people who already have a religion.
    The Qanun places social and moral obligations on students not to smoke, drink
    or take drugs, or to engage in pornography, porno-action, gambling or adultery.
    The Qanun also places a responsibility on parents to ensure a child receives basic
    religious education (art. 10(2)). There are specific requirements to recite the
    Qu’ran and students can only graduate from primary school if they can meet these
    requirements (art. 26(3)), while graduation from junior high school requires further
    competency in Arabic (art. 27(4)). Finally, it specifically addresses foreign,
    non-Muslim organizations and requires such institutions to obtain permission to
    establish an educational institution in Aceh (art. 59), placing a high level of
    government control over foreign educational organizations. This Qanun gives clear
    priority and emphasis to Islamic religious education. It also places greater responsibilities
    on students, parents, teachers and foreign, non-Muslim schools in particular.
    Apart from the standard right to religious education, the Qanun is silent on the
    provision of religious education for non-Muslim students in Aceh.Overall, the
    national laws on education in Indonesia relating to religious education have undergone
    significant changes. As a result of Islamist campaigns to restrict the influence
    of Christian schools, the government requires religious education to be provided
    in both public and private schools according to the religion of the student. This
    policy has not yet been implemented widely, and I show that some schools subvert
    the policy, and by implication stereotypes of Christianization, by developing
    innovative, alternative approaches to religious education.[Innovation in religious
    education](#07_Contents.xhtml_ch4-2-4)Responses of Muslim and Christian organizations
    and schools to the introduction of the new policy on religious education, and
    to concerns over proselytization through religious educational institutions have
    varied. Many new approaches to religious education essentially subvert government
    policy on segregated religious education by providing students with the opportunity
    to learn about their own religion and that of others, as well as about related
    issues of human rights, ethics and morality.The discourse and rhetoric of Islamist
    religious leaders since 1998 demonstrates concerns about the perceived efforts
    of Christian schools to proselytize Muslim students, more so than the implementation
    of religious education according to the Education Law. This is primarily evident
    through the issuing of a *fatwa* (opinion of Islamic legal scholars) strongly
    warning against, or even forbidding, Muslim parents from sending their children
    to Christian schools. For example, in Yogyakarta in October 1998, the Indonesian
    Ulama Council issued a *fatwa* that declared it *haram* (forbidden) for a Muslim
    student to attend a non-Muslim religious education class (MUI, 2008a: 25–26).
    This was followed by a concerted campaign against private Christian schools in
    the area, with many Islamic religious leaders strongly encouraging Muslim parents
    to send their child to an Islamic school (MUI, 2008a: 20–37). There were many
    banners displayed around the city of Yogyakarta at that time bearing slogans such
    as ‘Muslims who attend Christian schools are *kafir* [unbelievers],’ and ‘It is
    better to send your children to Muslim schools otherwise your children might convert
    to another religion.’^(21)Similar *fatawa* were issued at the local level in other
    areas, such as in Bogor, West Java. For example, the West Java *Pesantren* Cooperation
    Body (Badan Kerjasama Pondok Pesantren) based in Bogor, West Java, issued a *fatwa*
    that states that it is *haram* for Muslim parents to send their children to a
    Christian school because of the need to protect Muslim children from Christian
    proselytization.^(22)Although *fatawa* have been issued by MUI at the local level,
    the national MUI has not issued a *fatwa* on religious education. Chairperson
    of the national MUI (2005–09) and Special Advisor to the President on Religious
    Affairs (2007–09) KH Ma’ruf Amin, admitted that some of the branches of the Indonesian
    Ulama Council in the provinces or cities/regencies had issued ‘recommendations’
    that Muslim parents send their child to an Islamic school to uphold ‘correct beliefs’
    (*aqidah*).^(23)Leaders within MUI have been quick to point out that many Christian
    schools have refused to comply with the Education Law. For example, MUI of Yogyakarta
    reported that 97 Protestant and Catholic schools in the province of Yogyakarta
    did not provide Islamic religious instruction for their Muslim students (MUI,
    2008a: 29–32). There is, however, no legal sanction for a school principal who
    fails to implement a religious education program. There are currently no data
    available on the total number of Christian schools that have not complied. According
    to Catholic scholar Frans Magnis Suseno, some Protestant and Catholic churches
    oppose the Education Law because they do not believe they should have to provide
    religious education for other religions in a private Christian school,^(24) although
    the school connected to his theological seminary did not take this approach. Many
    Christian private schools have rejected the law, particularly in areas with a
    Christian majority population, because of concerns that Muslim teachers may be
    ‘anti-Christian’ in their approach to religious education.^(25) This, however,
    only fuels stereotypes that the reason Christian schools do not provide Islamic
    education is because they are managed by a church that has a hidden missionary
    agenda.^(26)Some Christian schools have ignored the requirement to provide Islamic
    religious education for their Muslim pupils, while other Christian schools have
    modified its religious education curriculum.^(27) For example, some Catholic schools
    have introduced a more inclusive religious instruction class for students of all
    religions, known as *pendidikan religiositas*, or ‘religiosity education’ (Leirvik,
    2004: 232).^(28) The curriculum was designed by the Catholic church in Semarang.
    Although Catholic religious instruction is still taught, it is now a separate
    class and non-Catholic students are not required to attend. This is not the approach
    of all Catholic schools, however. A study of Catholic religious education in 11
    cities across Indonesia found that approaches vary, with five different types
    of curriculum currently in use.^(29) Some Catholic schools do not have a problem
    with the new religious education policy and have arranged for an Islamic teacher
    for their Muslim students.A diversity of approaches has also been taken by Protestant
    schools.^(30) Some Protestant schools have changed the name and content of what
    used to be the Protestant religious education class. For example, many Protestant
    schools no longer refer to these classes as ‘religious education’ or ‘Christian
    education,’ but rather as *pendidikan moral/ethika*, ‘ethical/moral education,’
    or *pendidikan budi pekerti*, ‘character education.’^(31) At the least, this indicates
    that Christian schools are aware that religious instruction is a highly contentious
    issue. The curriculum of some Protestant schools has been adapted to avoid controversy
    and to educate students about all religions, as well as about moral and ethical
    issues.Aside from Christian schools, there have been two major changes in the
    approach taken by the schools run by Muhammadiyah. First, the Ma’arif Institute,
    founded by the former leader of Muhammadiyah (1998–2005), Ahmad Syafi’i Ma’arif,
    published a new religious education curriculum for Muhammadiyah schools. This
    course is designed for junior high schools (*sekolah menegah umum*, SMU) by Abdul
    Mu’ti (director of the Center of Dialogue and Cooperation among Civilizations)
    and Fajar Riza Ul Haq, the program director of the Ma’arif Institute. The course
    had two main emphases: education about Muhammadiyah, and education about Islam
    from a human rights perspective. The first subject, and corresponding textbook,
    was called *Kemuhammadiyahan*, ‘Muhammadiyah-ness’ or ‘the essence of Muhammadiyah’
    (Ma’arif Institute, 2008a). According to Abdul Mu’ti, this material provided the
    opportunity for both Muslim and non-Muslim students to learn about the foundations,
    history and teachings of Muhammadiyah.^(32) It aimed to promote understanding
    about the core values of Muhammadiyah and to help Christian students understand
    the diversity within Islam, such as why Muslims who affiliate with Muhammadiyah
    would not feel comfortable praying in a mosque run by Nadhatul Ulama.^(33) The
    textbook even mentioned the highly controversial issue of *aliran sesat*, or groups
    considered to be ‘deviant.’ It approached this issue by stressing the need for
    harmony and tolerance, balanced with the importance of maintaining the true teachings
    of Islam (Ma’arif Institute, 2008a: 51–56). This is remarkable, given the ongoing
    controversy against Ahmadiyah (see generally Crouch, 2012a). Importantly, the
    teachers’ instruction manual also included information on ‘deviant’ sects to promote
    greater tolerance among Islamic religious education teachers (Ma’arif Institute,
    2008b: 203).The second subject concentrated on the teachings on Islam, and the
    textbook is simply entitled *Al-Islam* (Ma’arif Institute, 2008b). This class
    was designed for Muslim students so that they can learn about their religion from
    a human rights perspective.^(34) For example, one of the lessons deals with the
    right to freedom of religion and places of worship (Ma’arif Institute, 2008b:
    14), which is particularly important due to the difficulties faced by religious
    minorities to build places of worship (see [Chapter 5](#17_Chapter05.xhtml)).The
    textbooks were distributed to over 100 junior high schools and many more schools
    had requested copies of the textbooks.^(35) The books, however, have not been
    received well by all Muhammadiyah schools. For example, in Palu, Central Sulawesi
    (an area of intense conflict between Muslims and Christians from 1999–2001), one
    school initially refused the books because the school thought the textbook was
    promoting pluralism, which was declared *haram* by a national MUI *fatwa* of 2005
    (as mentioned in [Chapter 3](#15_Chapter03.xhtml)).Aside from a new curriculum
    within some Muhammadiyah schools, the Ma’arif Institute conducted a study into
    religious education provided by Muhammadiyah schools in areas with a Christian
    majority (Mu’ti and Ul-Haq, 2009). The research was conducted in Muhammadiyah
    schools in three majority Christian areas (Ende, East Nusa Tenggara; Putussibau,
    West Kalimantan; and Yapen Waropen, Papua). The results of the research were published
    in a book referred to by the acronym ‘KrisMuha,’ or ‘*Kristen Muhammadiyah: Konvergensi
    Muslim dan Kristen dalam Pendidikan*,’ ‘Muhammadiyah Christians: The Convergence
    of Muslims and Christians through Education.’ The report found that Muhammadiyah
    schools did not provide Christian teachers for Christian students who attended
    those schools, but the schools did allow Christian students to attend religious
    education classes at a nearby Christian school or church, and so fulfilled the
    requirements of the Education Law (Mu’ti and Ul-Haq, 2009: 226). In sum, these
    new approaches and efforts demonstrate that religious organizations and schools
    are reworking the curriculum of religious education quite independently of developments
    in religious education policy at the national level.One of the real barriers for
    schools that are willing to comply with the religious education policy is a shortage
    of qualified teachers.^(36) The Ministry of Religion has acknowledged that this
    is one of the biggest issues that need to be addressed. The Ministry of Religion,
    together with the Department of Education, aims to address this problem by assisting
    schools to find qualified and available religious education teachers to teach
    religious education classes. One way of addressing this issue, which is common
    practice in Indonesia, is to allow religious education to take place outside of
    school hours. This allows flexibility so that, for example, attending Sunday School
    on a Sunday counts as ‘religious education’ for Christian children, as long as
    the church reports the grades of the children to the school, as happened in the
    Indramayu Religious Education Case.A related issue dealt with by Muhammadiyah
    at the national level is whether it is permissible for a Muhammadiyah school to
    employ a non-Muslim teacher. A *fatwa* issued by Muhammadiyah states that if there
    is no Muslim qualified and available to teach, then it is permissible to employ
    a non-Muslim teacher (Muhammadiyah, 1990: 214). If there is a qualified (Muhammadiyah)
    Muslim teacher available, then they must be given preference (Muhammadiyah, 1990:
    214). Even if a teacher is available, another difficulty is funding to provide
    wages, especially if there is only a small number of children of a particular
    religion at a school.The shortage of teachers and funding is compounded by the
    absence of a formal accreditation program. Since 2010, the Ministry of Religion
    has implemented a training and qualification process for all religious education
    teachers.^(37) Each national religious council has the responsibility to oversee
    the certification process for teachers. For example, Pastor Jan S. Aritonang,
    as the vice-chairperson of the national PGI, was given the responsibility to oversee
    the certification process for all Protestant religious education teachers in Indonesia.^(38)There
    have been concerted efforts by hardline Islamic religious leaders to oppose perceived
    ‘proselytization’ efforts of Christian schools by encouraging Muslim parents to
    send their child to an Islamic school. Acutely aware of this issue, and of broader
    concepts of tolerance and human rights, some Muslim and Christian schools have
    begun to change their approach to religious education, placing a greater emphasis
    on human rights and religious freedom, as well as ethics and morality, independent
    of the more restrictive developments in government policy. In addition to the
    Education Law, however, there have also been expressions of concern about the
    need to protect the religion of a child in the amendments to the Child Protection
    Law.[Criminalizing deceptive proselytization of children](#07_Contents.xhtml_ch4-3)In
    Indonesia, government guidelines on proselytization have existed since the 1970s,
    as explained in [Chapter 2](#14_Chapter02.xhtml). The offence of proselytizing
    a child to change his or her religion, however, is a relatively new development.
    Under Soeharto, Law 4/1979 on Children’s Welfare addressed the need for child
    protection in Indonesia, although it did not contain a prohibition on religious
    proselytization. In 1990, President Soeharto ratified the United Nations Convention
    on the Rights of the Child (1989).^(39) Article 14 of this Convention obliges
    states to respect the rights of children to freedom of religion, although it does
    not explicitly specify whether this includes the right to change religion.^(40)
    This interpretation is narrower than the International Covenant on Civil and Political
    Rights (ICCPR), which has been construed widely to include the right to change
    religion.^(41)National laws in Indonesia relating to child protection and proselytization
    have undergone significant reform since 1998\. In November 1999, the Minister
    of Human Rights announced that a draft bill on the protection of children would
    be drafted by the National Commission for Child Protection.^(42) In February 2000,
    a Child Protection Bill was suggested and in November 2001, after further debate,
    an amended version of the Child Protection Bill was proposed in the legislature.^(43)
    During this process, there was an absence of debate concerning article 86 of the
    Child Protection Bill.^(44) This may be explained by reports that the Child Protection
    Bill was passed despite poor performance from legislators in attending to their
    legislative duties (*Jakarta Post*, 24 September 2002). In October 2002, the Child
    Protection Law came into force and set out national standards for the protection
    of children, with the primary aim of addressing issues such as physical abuse,
    trafficking, child labor, prostitution, exploitation, adoption, guardianship and
    custody, among other issues.The national Child Protection Law contains numerous
    provisions on the religion of a child that are designed to ensure a child has
    the right to education in the religion of his or her parents. It protects the
    right of a child to worship according to his or her religion, under the guidance
    of their parents (art. 6). It clarifies that before a child has the ability to
    choose, he or she must follow the religion of their parents (art. 42(2)). It places
    a corresponding obligation on children to practice their religion according to
    the teachings of that religion. The state is also forbidden from discriminating
    against a child on the basis of religion (art. 21).Foster parents, guardians and
    adoptive parents are required to have the same religion as the child under their
    care.^(45) Furthermore, any religious organization that cares for children, such
    as an orphanage, is only allowed to care for children of the same religion (art.
    37(3)). Before the Bill was passed, there was some debate concerning this issue
    and whether parents must be of the same religion as the child they adopt (*Jakarta
    Post*, 24 September 2002). Groups such as MUI were successful in lobbying the
    government to ensure that the Child Protection Law only allowed foster parents
    to adopt a child of the same religion, to prevent the risk of conversion through
    adoption (*Jakarta Post*, 19 July 2002). This change in policy appears to have
    been partly to appease members of President Megawati Soekarnoputri’s fragile coalition
    at the time (*The Age*, 22 January 2005). The Government Regulation that followed
    reinforced that foster parents must have the same religion as the foster child
    and if the religion of the child’s biological parents is not known, the child
    should follow the religion of the majority of the population in that area.^(46)
    This places a significant, yet necessary constraint on the activities of adoption
    agencies and overseas placements to ensure adoption processes are not manipulated
    on the grounds of religion.The national Child Protection Law and corresponding
    Government Regulation on Child Protection reflect the position of MUI on the issue
    of adoption as expressed in a *fatwa* issued in 1984 (Ministry of Religion, 2003:
    178–81). In particular, this *fatwa* decided that ‘Adopting a child from a birth
    father and mother is opposed to Islamic *syariah*,’ which suggests a couple can
    only adopt orphans. Further, when a child is adopted, it specifies that adoption
    should not change the religion of the child. Aside from the national law and the
    Indonesian Ulama Council, Aceh is the only province that is allowed to enforce
    Islamic law. After the tsunami in 2004, there were many issues concerning children
    from Aceh and this raised fears that Muslim children were being Christianized.^(47)There
    were allegations that the post-tsunami aid efforts of some organizations, particularly
    foreign non-Muslim organizations, were exploiting the vulnerability of Muslim
    orphans. For example, in 2005, Worldhelp, an American-based Christian aid group,
    attempted to transport 300 children from Aceh to Jakarta with the intention of
    raising them in an orphanage there. It was prevented from doing so by local officials
    and Islamic religious leaders because of fears that it would attempt to convert
    the children to Christianity (*Human Rights Without Frontiers International*,
    17 January 2005). In the wake of such alleged incidents, the provincial government
    of Aceh passed Qanun 11/2008 on Child Protection, which in part addressed concerns
    over Christian proselytization by foreign aid organizations. This Qanun protects
    the right of a child to practice the religion of their parents (art. 4(1)). A
    child whose parents are missing must follow the religion of the majority of the
    population in that area (art. 5(1)), namely Islam. It requires Muslim parents
    and guardians to educate their child about their religion, particularly the recitation
    of the Qur’an (art. 8(2)). Foster parents must have the same religion or mission
    (*misi*) of the child for whom they care (art. 9(3)), as do guardians (art. 19(1)).
    There is also a prohibition in article 59 against foster parents or guardians
    changing the religion of the child that carries a penalty of imprisonment, which
    is similar to article 86 of the national Child Protection Law. There are clear
    parallels then between the national Child Protection Law and the Qanun on Child
    Protection in Aceh, although the latter arguably goes further in protecting Islam
    and in addressing concerns over Christian proselytization by foreign aid organizations.The
    Qanun in Aceh and the national Child Protection Law were the first of their kind
    in Indonesia. The national government’s commitment to implement the Child Protection
    Law was reinforced by Presidential Decision 77/2003, which established the Commission
    for the Protection of Children (Komisi Perlindungan Anak Indonesia, KPAI) to oversee
    the Child Protection Law (art. 74–76). The Commission has three basic duties:
    to educate the public, to accept complaints and to submit recommendations to the
    government. In 2005, the Commission signed a three-year Memorandum of Understanding
    with MUI so that together they could promote, implement and supervise the Child
    Protection Law. The issue of child protection is of concern to MUI and this may
    explain why MUI played such a key role in bringing the case against the three
    women in the Indramayu Religious Education Case.In the Indramayu Religious Education
    Case, it was alleged that the three women breached article 86 of the Child Protection
    Law, which makes it an offence to deceive or trick children to change their religion.
    I consider the interpretation and application of article 86 by the court in relation
    to the role of religious authority and the broader socio-political context of
    the case.[Court dynamics and religious authority](#07_Contents.xhtml_ch4-4)The
    Indramayu Religious Education Case adds a new chapter in the enforcement of limits
    on proselytization in Indonesia. It is the only case in which Christian religious
    education teachers have been charged and found guilty of the criminal act of ‘Christianizing’
    Muslim children. The case took place within the context of a history of Christian
    missionary activity and radical Islam. It will be situated within the history
    of religious missionary efforts in the area and the debate over the extent to
    which Muslims can participate in the ceremonies of other religions in particular.
    The role of parents and whether a Muslim child is allowed to convert will be explored.
    Finally, I also analyze the implications of the Constitutional Court’s decision
    that article 86 of the Child Protection Law is constitutional.[Local history of
    Christianity and radical Islam](#07_Contents.xhtml_ch4-4-1)The regency of Indramayu,
    established in 1950, is a majority Muslim area, with over 1.7 million Muslims,
    4,368 Protestants, 2,835 Catholics, 160 Hindus, 297 Buddhists and 13 Confucianists
    (Regency of Indramayu, 2010: 207). The minority Christian community in the area
    can be traced back to the arrival of Christian missionaries in the 1880s.Among
    the first missionary applications to be approved for permission were for the regions
    of Indramayu and Cirebon (Coppel, 2002: 294). According to Soejana *et al*. (2008:
    651), the foreign Christian missionaries first entered Indramayu in 1863\. Missionaries
    such as D.J. van der Linden (1837–85) went there to strengthen the small Chinese
    Christian community that had been established there as a result of the first convert
    to Christianity in Indramayu, Ang Boeng Swi (1810–64) (End, 2006: 118). In 1858,
    about 14 of Ang Boeng Swi’s relatives were baptized with him (Coppel, 2002: 296).
    The conversion of Indonesian Chinese to Christianity was of ‘primary importance’
    to the formation of Chinese congregations in areas such as Indramayu (Giok, 1952:
    121). This led to the establishment of the first Chinese Indonesian church north
    of Cirebon (Schumann, 2010: 67). Between 1858 and 1899, 199 people were baptized
    (Soejana, 1997: 291). Most of these people, however, were Chinese Indonesians,
    and there were reports of conflict between Chinese Indonesians and non-Chinese
    members that impeded the formation of a united congregation. A school was also
    opened in the area, but most of the students who attended were Chinese Indonesians.According
    to Coppel, it was common for missionaries to have greater success among the Chinese
    in Indonesia, partly because they made up a large percentage of the children who
    attended Christian schools. He notes:In many of the mission posts, the missionaries
    found that it was the Chinese who were attracted particularly to the schools.
    In some places, for example Indramayu … the members of the parish were almost
    all Chinese.(Coppel, 2002: 295)The greater acceptance Christianity found in Indonesian
    Chinese circles is also highlighted by Pow Boen Giok, a Chinese convert to Christianity
    who was born in Indramayu. Giok notes that it was:practically impossible for missionaries
    … to preach the gospel directly to the autochthonous population ie Sundanese and
    Javanese, without first coming into contact with the Chinese population.(Giok,
    1952: 121)Indramayu was considered to be a difficult posting for missionaries
    because of the resistance of the Sundanese, the majority Muslim ethnic group in
    the area, to missionary efforts (End, 2006: 511). There were reports of challenges
    winning new converts because people were afraid they would lose their job if they
    became Christian, due to the way new converts were often ostracized from the community.
    As a result, some converts later returned to Islam due to the negative reactions
    their conversions generated (Soejana, 1997: 451). In light of this history, the
    majority of Christians in Indramayu today are Chinese (or at least non-Sundanese)
    and this has led to the perception among Islamists that Christians in the area
    are ‘foreigners.’ Pastor Supriyatno, of the Pasundan Christian Church and former
    general chairperson of PGI West Java, suspected that part of the issue in the
    Indramayu Religious Education Case was racial discrimination because Dr Rebekka,
    the pastor of the church, is a Chinese Indonesian.^(48)Converts to Christianity
    were a cause of concern for Muslims in the community. The first convert was Aung
    Boe Swie, and his conversion was followed by others such as Gouw Kho (Jakarta,
    1868), Khouw Tek San (Purbolinggo, 1866) and Oei Soei Tiong (1898) (Hartono, 1974:
    87). Another example of a conversion to Christianity in Indramayu is Kartawidjaja,
    an elite bureaucrat.^(49) His baptism in 1899 came as a shock and was considered
    by some to be apostasy (Ricklefs, 2007: 120). Ricklefs succinctly highlights that
    ‘Kartawidjaja’s story thus reflected the profound social and personal conflicts
    that sometimes attended conversions’ (Ricklefs, 2007: 120), and continues to surround
    high-profile cases of conversion today.One of the practices that developed among
    Christian mission organizations in the early 1900s was to purchase land and establish
    Christian settlements, particularly because many of the converts to Christianity
    were poor. One such settlement was established in Haurgeulis-Rehoboth in 1912
    (End, 2006: 445–48). In 1908, the Dutch Mission Society (Nederlandsche Zendings
    Vereeniging, NZV) established a hospital in Indramayu (End, 2006: 18). The NZV
    also provided practical assistance to the community in times of crisis, such as
    during the famine that hit Indramayu in 1903 (End, 2006: 21, 321).Aside from being
    targeted by Christian missionaries, in the early 1950s Indramayu was a target
    for Islamization by Darul Islam, a radical Islamic movement led by Kartosoewirjo
    (*Jubilee Campaign*, 8 July 2005). By the 1960s, Darul Islam and its attempts
    to make Indonesia an Islamic State had largely been suppressed by the central
    government (as explained in [Chapter 3](#15_Chapter03.xhtml)), although not entirely.
    After Kartosoewirjo was killed in 1962, covert veterans of Darul Islam persisted
    and in 1970 the group broke into two branches (Wasis, 2003: 185). The leader of
    one of the branches was jailed in 1980, and he delegated his authority to Abu
    Toto (also known as Panji Gumilang). He led Darul Islam’s 9th Regional Command
    (known as KW9), which included West Java and Jakarta, and was believed to have
    about 50,000 followers (Fealy, 2007: 69). Under his leadership, the *Al-Zaytun*
    boarding school was constructed in Haurgeulis, Indramayu (Wasis, 2003: 187). It
    received financial support from former President Habibie and from Soeharto (Pringle,
    2010: 128–29), and one of the buildings is named in honor of Soeharto.The Al-Zaytun
    Islamic boarding school is the largest Islamic *madrasah* in Southeast Asia (*Washington
    Times*, 29 August 2005). It accommodates 7,000 students, both male and female,
    and has a building campaign to accommodate 18,000 more. It is also building a
    six-storey mosque. The point of concern, however, is that Al-Zaytun has suspected
    links to radical movements such as Darul Islam and Negara Islam Indonesia (NII)
    (Fealy, 2004: 112). In early 2000, Al-Zaytun was accused of deviating from the
    teachings of Islam, although investigations by the Ministry of Religion found
    no evidence of this (Hefner, 2009: 104). In 2002, the police made a number of
    arrests of suspected members of NII, from South Bandung, North Lampung and West
    Java. Those from West Java had alleged connections to Al-Zaytun boarding school
    (*Jakarta Post*, 9 April 2002; 11 April 2002).While there is no direct link between
    Al-Zaytun and Darul Islam in the Indramayu Religious Education Case, radical Islamists,
    many from outside the area, demonstrated during the court proceedings. They called
    for *jihad* (holy war) and *mati syahid* (religious martyrdom) if the women were
    not convicted. The court hearings were accompanied by chants of *Allahu Akbar*
    (God is great) and demands that the women be hanged. Anonymous death threats were
    also made towards other pastors and Christian workers in the area at this time
    (District Court, 2005d: 2). The Defense argued that the evidence given at trial
    may have been influenced by the intense intimidation, threats and bribery from
    radical Islamic groups. It is possible that the presence and pressure exerted
    by radical Islamists at the trial negatively influenced the evidence given by
    the witnesses, as well as the decision of the court.Such opposition and tension
    between Muslims and Christians in Indramayu has occurred previously on several
    occasions. In 1967, a church in Indramayu was burnt down because of accusations
    a Christian had insulted Islam.^(50) There have also been tensions caused by Christians
    using houses as churches.^(51) Aside from the pressure of radical Islamic groups
    at court trials and incidents over churches, there have also been concerted campaigns
    to introduce aspects of Islamic law in local regulations. These do not have the
    status of regional regulations – that is, they have not been passed by the local
    legislature, but are rather instructions or decisions issued by the regent. Nevertheless,
    it is still a symbol of support for hardline Islam in the area. There is also
    a connection between religious-inspired regulations and concerns over issues of
    immorality, partly because of the history of prostitution in the area. Religious
    regulations are perceived to be necessary to address the moral crisis in Indramayu
    – that is, the prostitution industry and the export of prostitutes.^(52) Indramayu
    is notorious as a center for prostitution in Java, servicing brothel complexes
    in Jakarta and elsewhere, and trafficking women overseas (Soedirham and Puspita,
    2003; *Jakarta Post*, 26 October 2005).This perceived moral crisis has provided
    some of the motivation for the creation of a number of regulations on aspects
    of Islamic law. Between 2001 and 2009, there were over 50 regulations issued in
    various forms, including in the form of a Letter, a Circular, an Appeal, an Instruction
    or a Decision of the Regent. These regulations address issues such as prohibiting
    alcohol and pornography, requiring Muslim clothing in schools, Qur’anic tests
    in schools, *zakat* (giving alms) and compulsory reading of the Qur’an for civil
    servants. The emphasis on religious education is particularly strong, with over
    20 regulations addressing the obligation for all Muslim children to receive Islamic
    education. There is also a decision concerning spiritual counselors for Muslims
    in hospitals. These regulations – on education and spiritual care in hospitals
    – are evidence of a concern for the ‘vulnerable’ such as children or the sick.
    It may also be a reaction to the controversy caused by the Indramayu Religious
    Education Case, which raised doubts about the intention of those who provided
    religious education and medical services.[Teachers and inter-religious relations](#07_Contents.xhtml_ch4-4-2)There
    are numerous versions of what actually happened in this case, depending on the
    person asked. One of the key issues was the intent of the teachers and the broader
    question of the extent to which the children of Muslim parents are allowed to
    learn about the teachings of another religion or participate in an event of another
    religion.In terms of the nature and purpose of the program, it was generally agreed
    by both parties that the program included learning Christian songs; coloring in
    pictures of people such as Abraham, Noah, Lazarus and Zachaeus (described by the
    Prosecution as ‘Christians,’ although they are figures common to the Abrahamic
    faiths); reading stories from the Bible about Jesus; and learning Christian prayers.
    The Prosecution and the MUI investigator Muhammad Nursadat called this program
    ‘*Minggu Ceria Kristenisasi*,’ the ‘Happy Sunday Christianization program.’ The
    insertion of the term ‘Christianization’ into the name of the program was an attempt
    to label the program with negative connotations and fears that are inherent in
    the term ‘Christianization’ in Indonesia (District Court, 2005f: 5).The Defense
    claimed that this was not the actual name used by the church and that ‘Christianization’
    was not the intention or agenda of the teachers or the program (District Court,
    2005f: 1). The Defense pointed out that this program was initiated at the request
    of Christian parents and the local primary school so that Christian students could
    aim to achieve a good score for religious studies at school (District Court, 2005b:
    7, 8). The Defense contended that although the program was aimed at Christian
    students, there was no legal prohibition in Indonesia on Muslim students attending
    a Christian program.The court agreed with the Prosecution that the program should
    only be for Christian children, and non-Christian children should not be allowed
    to participate in the program (p.5). This goes further than the Education Law,
    and interprets the segregation policy as a prohibition on a child learning about
    another religion. The court accepted the evidence of the MUI investigator, although
    it did not go as far as to call the program a ‘Christianization’ program (p.12).This
    decision is similar to the *fatwa* of MUI that declared it *haram* for Muslims
    to attend Christmas celebrations. It is common in Indonesia for Muslims to invite
    Christians to celebrations such as *buka puasa*, the meal to break the fast during
    Ramadan. Similarly, Christians often invite Muslims to Christmas celebrations
    at the workplace, at school or in the neighborhood (Mudzhar, 1996: 233). The controversy
    over Christmas celebrations first arose in the 1980s. In March 1981, MUI issued
    a *fatwa* that opened a broader debate on attendance at religious celebrations
    by those who profess another religion (Ministry of Religion, 2003: 235–42).^(53)
    The *fatwa* stated that it is *haram* for a Muslim to attend a Christmas celebration
    because these celebrations are Christian religious rituals. It justified this
    position by arguing that while Muslims may cooperate with non-Muslims for community
    or humanitarian causes (Q 49:13, 31:15, 60:8), attendance at such celebrations
    could jeopardize the faith of a Muslim. This was followed by several *fatawa*
    from Muhammadiyah that reinforced the MUI *fatwa* by declaring that Muslims should
    not say ‘Merry Christmas’ to Christians (Muhammadiyah, 1991: 209–10; Muhammadiyah,
    2003: 276).The *fatwa* of MUI did not go down well with the government because
    of its potential to destabilize inter-religious relations, and the government
    specifically instructed MUI to retract the *fatwa* (Mudzhar, 1996: 237). The Minister
    of Religion supported MUI, arguing that it was necessary for the sake of national
    unity (Ministry of Religion, 2008a: 202, 243–46). He issued a further Letter of
    Circulation in September 1981 to clarify that it was permissible for a government
    official, as part of his or her duties, to be present at an event of another religion
    (Ministry of Religion, 2008a: 235). This led the government Inter-religious Harmony
    Committee to hold a meeting to discuss the issue of religious ceremonies and holy
    days (Sairin, 1996a: 518–21). The controversy was so intense that the chairperson
    of MUI, Hamka, resigned at the end of the year not because of ill-health, as reported,
    but because of the disagreement between the government and the Ministry of Religion
    (Mudzhar, 1996: 237–38). Opinions on the Christmas *fatwa* today differ, although
    *fatawa* are not legally binding on Muslims in Indonesia.[Rights of parents](#07_Contents.xhtml_ch4-4-3)The
    issue of the rights of parents in relation to the religious education of their
    children was central in the case. The Prosecution claimed that the children did
    not have the consent of their parents to attend the program. They relied on the
    evidence of the grandmother of two students who claimed that she had not given
    her permission (p.5). The credibility of this evidence was questioned by the Defense,
    who pointed out that this same grandmother had attended the Taman Mini Indah Indonesia
    (Beautiful Indonesia Miniature Park) outing, evidenced by photographs presented
    at the trial, and was clearly aware that her grandchildren had been attending
    the program. The Defense also argued that Pangesti had visited the grandmothers’
    house to ask her permission that the children attend (District Court, 2005f: 7).
    The Prosecution responded by claiming that several other children did not have
    the permission of their parents, although this argument was made in the absence
    of any evidence or testimony from these parents. In the court decision, there
    was no discussion of what would have amounted to consent, whether oral or written
    consent was required, or whether consent needed to be obtained from one or both
    parents/guardians. Despite these contradictions and the absence of evidence, the
    court accepted the Prosecution’s argument that consent had not been obtained from
    the parents and that consent should have been obtained (District Court, 2005b:
    5).This case was complicated by the fact that, according to Rebekka, some of the
    ‘Muslim’ children who attended the program were actually children of mixed marriages
    – that is, one Muslim parent and one Christian parent.^(54) The controversial
    issue of mixed marriages, and the religion of children from those marriages, has
    long been a subject of intense debate in Indonesia.^(55) An initial Draft Law
    on Marriage put forward in 1973 proposed to allow inter-religious marriages. The
    removal of this provision before the passage of the Marriage Law in 1974 was widely
    perceived as a concession to Muslims who strongly disagreed with this provision.
    As it currently stands, Law 1/1974 on Marriage neither specifically prohibits
    nor permits inter-religious marriages.^(56) The status or permissibility of inter-religious
    marriages in Indonesia therefore remains unclear. This is despite the fact that
    the traditional Islamic position is that a Muslim man may take a Muslim, Christian
    or Jew as a wife, although a Muslim woman may only marry a Muslim man (Q 5:5).A
    number of *fatawa* issued by Islamic religious leaders since then have attempted
    to impose a different interpretation of inter-religious marriages in Indonesia.
    In June 1980, a *fatwa* issued by MUI expressly forbade Muslims from marrying
    Christians.^(57) It made two points: that marriage between a Muslim woman and
    a non-Muslim man is *haram*; and that a Muslim man is forbidden (*diharamkan*)
    from marrying a non-Muslim woman. MUI reissued this *fatwa* in 2005 (MUI, 2005:
    35–44). Muhammadiyah (2003: 205–6) has also issued a *fatwa* that forbids a Muslim
    from marrying a person who has no religion. It also forbade a Muslim woman from
    marrying a Christian man, although it allows a Muslim man to marry a Christian
    woman. This issue was not discussed in court.[Evidence of child conversion](#07_Contents.xhtml_ch4-4-4)Another
    disputed issue was whether a child has the right to convert. It also raised the
    issue of what amounts to conversion to Christianity, whether the Muslim children
    had actually converted, and whether it was necessary for the children to have
    converted for the elements of article 86 to be satisfied. The head of the local
    MUI, Mundzir, initially claimed that one Muslim student had converted to Catholicism.
    The validity of his evidence was quickly countered by the Defense, who pointed
    out that this was not possible through this program because the teachers’ church
    was Protestant, not Catholic (District Court, 2005f: 1). An 11-year-old student
    gave evidence that she was ordered to convert, but she had forgotten how or when
    this occurred (District Court, 2005b: 23). In the opinion of expert Muslim witness
    Abdul Wachid Syakuri, however, actual conversion was not necessary, contrary to
    the wording of article 86\. The mere involvement of Muslim children in the Happy
    Sunday program meant they had implicitly converted. He was quoted as stating that
    ‘Muslim children who are invited to participate in a Happy Sunday program and
    sing Christian songs and pray Christian prayers are apostates [*murtad*]’ (p.16).On
    the other hand, the leader of the Protestant Division of the Ministry of Religion
    of West Java, John Nainggolan, opined that ‘Christian children’ are children who
    have been baptized and that mere participation in a Happy Sunday program did not
    make a child Christian. Building on this, the Defense argued that the teachers
    had not baptized any of the children. This was not disputed by the prosecution
    (p.8). The court accepted the evidence of John Nainggolan that baptism was a sign
    that a child was a Christian and that the Muslim children had not been baptized.
    The court found, however, that article 86 did not require a child to have converted,
    despite the wording of the article, but merely that there had been attempts to
    convert a child (p.21). This interpretation is significant, as it sets a low threshold
    for breach of this provision.Another issue in dispute was the influence that the
    program had on the behavior of the Muslim children. The Prosecution argued that
    some of the children had skipped boy scouts (*Pramuka*) on Sunday mornings to
    go to the program, while other children had become more disobedient at home after
    they attended the program (p.10). The Defense, however, reasoned that the students
    were very diligent and obedient children at the Happy Sunday Program (District
    Court, 2005b: 5). They also argued that the teachers had never forbidden the children
    to go to the mosque, wear the *jilbab* (headscarf) or read the Qur’an (District
    Court, 2005f: 7). The court accepted that the children were good students, but
    focused more on the behavior of the teachers who had allowed Muslim children to
    attend the Christian program (District Court, 2005b: 5). Overall, the court was
    inclined to accept the Prosecution’s version of the facts without question, which
    raises the issue of whether radical Islamic groups influenced the verdict, as
    discussed above. The court responded to issues of evidence and the credibility
    of witnesses in a similar fashion. This highlights the lack of capacity of the
    District Courts to make decisions independent of the influence of Islamist religious
    leaders and radical Islamic groups.The issue of whether children can convert was
    compounded by the fact that even if a child gave evidence that they had converted,
    the evidence was not given under oath and so raised issues of admissibility. The
    rules of evidence in a criminal trial are contained in Chapter 16 of the Criminal
    Code.^(58) To determine whether a crime took place, and whether the accused committed
    the crime, the court’s decision must be based on at least two pieces of ‘legal
    evidence’ (art. 183). ‘Legal evidence’ can include the testimony of a witness,
    expert evidence, a letter, a statement of the defendant, or circumstantial evidence
    (art. 184–88). In the Indramayu Religious Education Case, 15 witnesses gave evidence.
    The witnesses included the Head of the local MUI, the principal of the primary
    school, a teacher from the primary school, some of the Muslim children who attended
    the Happy Sunday program, and some of the parents of the Muslim children. No Christian
    students or parents gave evidence. The only Christian witness called was from
    the Ministry of Religion.The issue of the admissibility of evidence was raised
    by the Defense, who pointed to article 171 of the Criminal Code, which states
    that:People who may be examined to give information without swearing an oath are:'
