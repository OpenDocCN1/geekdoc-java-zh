    Qur’anic bookstand**santri** student of Islam**sembako** Sembilan Bahan Pokok,
    the nine necessities for daily living in Indonesia: rice, sugar, fuel, salt, salted
    fish, cooking oil, coffee, eggs and flour**sholat** daily prayers (A)**syahadat**
    confession of faith (A)**syariah** law given by God, as opposed to man-made law
    (A)**taqlid** opinion of the ulama (A)**tempat ibadah** place of worship**Tuhan**
