    government tried to control religious publications by providing funding to the
    six religions to publish holy books, although the quantity of books published
    was relatively small. From 1969 to 1970, it sponsored the publication of 278,000
    translations of the Qur’an; 8,000 copies of the Protestant Bible; 3,720 copies
    of the Catholic Bible; and 12,500 Hindu and Buddhist texts (Presidential Speech,
    1970: 250). This support increased every year and in 1990–91, the number of publications
    had risen to over 440,000 copies of the Qur’an; 50,000 copies of the Protestant
    Bible; and 49,000 copies of the Catholic Bible (Presidential Speech, 1991: chapter
    5, p.9). These religious publications were intended to be distributed to communities
    or people who did not yet have a (recognized) religion.There are reports of Bibles
    (often in the local dialect) being distributed to Muslims in public places such
    as schools. For example, in 1999 there were reports of Bibles in the Minangkabau
    language being distributed in Padang, West Sumatra.^(31) This is particularly
    controversial because it is widely believed that all Minangkabau people are Muslim.
    In 2002, a Christian group reportedly gave away 100 Bibles in Bogor, West Java
    (*Republika*, 27 December 2002). In 2004, MUI expressed its disappointment at
    the lack of response from the Ministry of Religion concerning the publication
    and distribution of the ‘Holy Book of the Qur’an’ that allegedly contained elements
    of the Christian message, in West Sumatra, a majority-Muslim area (*Republika*,
    15 July 2004). In 2006, Gideon’s International^(32) distributed Bibles to Muslim
    students in several *pesantren* (Islamic boarding school) and schools in Ponorogo,
    East Java, although they claimed to have the permission of the Ministry of Religion
    (*Republika*, 5 January 2006). Such claims are ongoing and further incite suspicions
    raised by the distribution of religious literature.Finally, article 2(d) relates
    specifically to religious organizations that distribute religious pamphlets to
    people in their homes as a way of propagating their religion, such as Jehovah’s
    Witnesses. For example, Muhammad Natsir, the leader of Masyumi and founder of
    DDII, gives an account of three advent missionaries who were detained after entering
    the home of a Muslim with a brochure and trying to persuade him to convert to
    Christianity. The Muslim, who was 65 years old, allegedly died from ‘shock’ (Natsir,
    1980: 77–78). In 1976, Jehovah’s Witnesses were banned by the Attorney-General
    because of the concern over the practice of ‘door knocking,’ although this ban
    was lifted in 2001 (Sairin, 1996a: 271–72). There is no evidence to suggest that
    Regulation 70/1978 has ever been enforced by the government or in court.In addition
    to Regulation 70/1978 as discussed above, the Minister of Religion issued Decision
    77/1978 on the guidelines for overseas donations to religious institutions in
    Indonesia. This was partly in response to allegations that foreign funding was
    sponsoring proselytization efforts. For example, on 21 July 1967 in a speech to
    the legislature, Dr Lukman Harun submitted copies of magazines from the United
    States that contained articles on the funds generated by the World Council of
    Churches as evidence of a Western agenda to fund Christian missionary activities
    in Indonesia (Hasyim, 1979: 300–8). Other publications by Muslims on Christianity
    in Indonesia highlight the large number of North American church organizations
    and overseas staff operating in Indonesia (Ka’bah, 1985: 82–84).The intention
    of this regulation is to enable the government to maintain control over what kind
    of donations religious groups receive, the amount of the donation, where the donations
    come from, and the intended purpose of the donations to avoid any ‘negative’ effects
    of foreign aid. This decision prohibits overseas donations to religious organizations
    in Indonesia unless with the approval of the minister (art. 2). Restrictions are
    placed on foreign missionary workers, who can only engage in religious propagation
    if they have the consent of the minister, and can do so only for the limited period
    of two years, after which time they must be replaced by an indigenous worker (art.
    3). Religious institutions that do not comply with this regulation may be the
    subject of legal action (art. 4).The two 1978 regulations were the cause of great
    concern for Christians. On 24 August and again on 14 September 1978, the national
    Protestant and Catholic Councils (DGI and MAWI) sent a letter to Soeharto requesting
    the withdrawal of Regulations 70/1978 and 77/1978 in the interests of upholding
    the right to freedom of religion.^(33) As Mudzhar (1996: 232) points out, Christians
    protested because the regulations contradicted their position at the 1967 conference
    and could potentially cause Christian missionary activities to be severely restricted,
    because many churches receive international financial support. The regulations
    were considered to be unconstitutional and a betrayal of the Pancasila and religious
    freedom. They were branded by some foreign, Western media as ‘anti-mission laws’
    and led to headlines such as ‘Religious freedom crisis hits Indonesian churches’
    (Denffer, 1987: 36–41). As Steenbrink (2000: 93) argues, ‘the 1978 Decrees appeared
    to be a pro-Muslim move of [the] new Cabinet,’ which was of great concern to Christians.The
    Ministry responded to this controversy with Decision 1/1979 on Guidelines for
    the Propagation of Religion and Overseas Donations to Religious Organizations.
    The 1979 decision restated that religious propagation could still occur but must
    be based on ‘mutual respect’ for other religions (art. 3) – that is, only aiming
    religious propagation at people who did not have a religion. It then reiterated
    almost word for word (but did not cancel) the key provisions of the 1978 regulations.
    The head of MUI at the time, Hamka, agreed with these laws (Mujiburrahman, 2008:
    82), and MUI has continued to express its support for these laws in its publications
    over the years (MUI, 1995: 26).Christian leaders again strongly objected to the
    1979 regulation (Sairin, 1996a: 488–99). Nevertheless, in the 1980s, several further
    regulations dealing with foreign religious missionaries and controlling the content
    of religious sermons and proselytization were passed (Sudjangi, 1992: 121–24).
    Although never implemented, they remain valid today.[Conclusion](#07_Contents.xhtml_ch2-8)This
    brief historical analysis of Islamist campaigns to limit Christian proselytization
    through government policies prior to 1998 in Indonesia has shown that attitudes
    of resistance to Christian activities such as building churches, hospitals and
    schools are rooted in Indonesia’s colonial past, when Christianity was widely
    perceived to be favored by Dutch colonial authorities.After independence in 1945,
    the 1960s crackdown on communism and the mass conversions to Christianity, Islamists
    petitioned the government to provide religious education, protect religions from
    denigration through a Blasphemy Law, regulate church permits and to limit religious
    proselytization. At the 1967 conference, this sparked national debates between
    Muslims and Christians about whether the ‘targets’ and methods of proselytization
    can be limited. In the late 1970s, pressure from the Indonesian Ulama Council
    led the Ministry of Religion to set boundaries on religious proselytization, which
    are still valid law.This account of the origins of Islamist opposition to Christian
    proselytization and the policies that were subsequently introduced provides a
    background for the discussion that follows of the ideology, actors and institutions
    that influence contemporary legal disputes between Muslims and Christians. In
    the next chapter, I examine the role of religious ideology in the legal system
    and the influence religious communities have on policy through government-sponsored
    religious institutions. I link these developments to ongoing attempts to implement
    Islamic law and the way this has influenced the resolution of legal disputes between
    Muslims and Christians in West Java.Notes1  For an analysis of the arrival of
    the Portuguese in the context of the competition between religions, see Azra,
    2008.2  See Nasution, 1992: 197, quoting from Risalah, 1958/II: 996.3  Of the
    numerous scholarly references to these pamphlets, only one actually names the
    title of the pamphlet. According to Aritonang (2004: 361–62), an Islamic organization
    in Surabaya published these pamphlets, which were entitled ‘The Savior and the
    Cross’ and ‘A Death Announcement from Qumran Valley.’ A separate pamphlet was
    published by Hasbullah Bakry, entitled ‘Jesus Christ According to Islam and Christianity.’4  See
    Wardy, 1964, as referred to in Boland, 1982: 227; Aritonang, 2004: 202; Hasyim,
