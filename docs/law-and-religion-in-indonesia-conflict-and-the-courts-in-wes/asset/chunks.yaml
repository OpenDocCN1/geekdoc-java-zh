    who were all under 15 years old, was a mere ‘guide’ and needed to be verified
    by other witnesses (District Court, 2005d: 12). The second, related issue was
    the weight that should be given to the evidence of adult witnesses. The Defense
    argued that the majority of the evidence given by the witnesses was secondhand
    information, or hearsay (p.11). They cited article 1(27) of the Criminal Code,
    which states that:Witness evidence is evidence in a criminal case comprising information
    from the witness concerning a criminal event that he or she heard him or herself,
    saw him or herself and experienced him or herself together with the basis for
    acquiring knowledge of that information.This provision is understood as a prohibition
    on hearsay. The Defense relied on this article to argue that most of the evidence
    given by the witnesses (excluding the children) was second-hand because they did
    not see, hear or experience the Happy Sunday program for themselves. Further,
    the Defense suggested that the evidence given by three of the witnesses was inadmissible
    because of their failure to attend the trial to give evidence (District Court,
    2005d: 12).The court ruled that the evidence of six of the witnesses, namely the
    MUI leader, the school principal, one of the parents, the head of the neighborhood,
    a teacher and the MUI investigator, was *testimonium de auditu*, or hearsay. The
    court further decided that the evidence given by four children ‘must only be considered
    as informative’ (District Court, 2005b: 23). This left the evidence of two experts
    and the written testimonies of three children who had not given evidence at the
    trial. According to article 185(7) of the Criminal Code, evidence not given under
    oath cannot be used on its own but must be supported by other evidence given under
    oath. Therefore, the majority of the evidence led by the Prosecution was inadmissible
    or weak at best.Despite the inconsistencies in evidence and the need to weigh
    carefully the admissibility of evidence against the established rules of admissibility,
    the court nonetheless found that article 86 had been breached. This calls into
    question the ability of the District Court to decide cases of religious sensitivity
    in a fair and impartial manner.[*Interpretation of Islamic* hadith](#07_Contents.xhtml_ch4-4-5)Another
    issue in the case was the way in which the court referred to *hadith*, sayings
    of the Prophet, despite the fact that it is not a source of law in Indonesia.
    The Prosecution argued that there were three elements that had to be satisfied
    to find a breach of article 86 (District Court, 2005e: 26–28). These were:1  Any
    person;2  who deliberately uses deceit, a series of lies or entices a child to
    choose another religion not of his or her own will;3  despite it being known or
    suspected that the child is not mature and is not yet responsible according to
    the religion he/she follows.The first element is straightforward. In relation
    to the second element, the Prosecution relied on the evidence of expert witness
    Abdul Wachid Syakuri, from the Ministry of Religion. Syakuri argued that it is
    forbidden to proselytize people who already have a religion, according to Decision
    of the Minister of Religion and Minister of Home Affairs 1/1979 on Guidelines
    for the Propagation of Religion and Overseas Donations to Religious Organizations
    (District Court, 2005b: 15). As quoted in [Chapter 2](#14_Chapter02.xhtml), article
    4 states that religious missionary activities cannot be aimed at a person or group
    of people who already have a religion, as stated on their identity card. Almost
    every Indonesian has a ‘religion’ on their identity card.The Prosecution argued
    that the teachers had breached article 4(a) by giving the children small gifts
    and snacks as ‘bribes.’ The prosecution argued that because the two Muslim children
    who first attended the program were given such gifts, this attracted other Muslim
    children to the program (p.5). They also claimed that the teachers had breached
    article 4(b) by giving one of the children a Bible, although it was disputed whether
    the child had asked for it.The Defense argued that the most important element
    was intention (District Court, 2005d: 12–14). They argued that the program was
    primarily for the spiritual benefit of Christian children and to help them achieve
    a good school report. They argued that the gifts given to the children were not
    evidence in themselves of enticement or deception, but rather a reward for good
    behavior (District Court, 2005d: 1). They emphasized that outings were just for
    fun and that there had been no attempts to baptize children as this was not the
    aim of the program.Whether requiring the children to wear blue t-shirts with the
    church logo and a picture of a cross on the front and the name of the church printed
    underneath constituted part of the attempts to convert the children was debated.
    There were three outings run by the program: to Taman Mini, to the zoo and to
    a swimming pool. The Defense argued that the t-shirts were simply for identification
    purposes and that it was common practice for groups on outings.^(59) The Prosecution
    argued that requiring a Muslim child to wear such a uniform was part of the attempt
    at ‘Christianization’ (p.6). The court considered the wearing of Christian uniforms
    as part of the overall program of Christian activities, which was intended only
    for Christians (p.22).The Defense also argued that the children still followed
    Islam by participating in *sholat* (daily prayers) and going to the mosque (District
    Court, 2005d: 14). They therefore asserted that the elements of article 86 had
    not been satisfied. The court decision does not explain the reasoning for the
    conclusion. It merely appears to have accepted the Prosecution’s interpretation
    of article 86 and found that the women had breached this section by allowing Muslim
    children to attend the Christian education program without the consent of their
    parents (District Court, 2005b: 19–22).Crucial to the court’s finding of a breach
    of article 86 was the use and reliance on *hadith* (sayings of the Prophet) during
    the trial. In this case, the Prosecution quoted, interpreted and applied the following
    the well-known *hadith*:All children are born into a religious belief (according
    to the Islamic faith), so it is the responsibility of their parents to bring them
    up (the child) Jew (*Yahudi*), Christian (*Nasrani*), Zoroastrian (*Majusi*) (worshipping
    fire) …(Al-Bukhari; District Court, 2005e: 2, 4)This was interpreted to mean that
    a child must be brought up in the religion of their parents and cannot change
    religion without the permission of their parents. In response, the Defense acknowledged
    the *hadith* but argued that the children had not converted, and had the permission
    of their parents to attend the program (District Court, 2005f: 19). There is no
    mention in any of the court documents that the Defense opposed the use of *hadith*
    or questioned the validity of its use in the secular District Court. In the decision
    of the court, this *hadith* was specifically relied on in its findings that a
    child needs the consent of his or her parents to convert. *Hadith*, however, are
    not a source of law recognized by the state in Indonesia. The court also found
    that the Muslim children had been invited to convert to Christianity by following
    the Happy Sunday program (District Court, 2005b: 6).The court found the women
    guilty of deceiving Muslim children to change their religion and handed down the
    punishment suggested by the Prosecution: three years’ jail and a fine of Rp 1,500,000
    (approximately A $189). Although the defendants appealed to the Bandung High Court
    and the Supreme Court, both courts rejected the applications, but failed to give
    reasons for their decisions (High District Court, 2005; Supreme Court, 2006b).[Judicial
    review of the Child Protection Law](#07_Contents.xhtml_ch4-5)While the women were
    still in prison, the constitutional validity of article 86 of the Child Protection
    Law was challenged in the Constitutional Court. The Constitutional Court is provided
    for in article 24C of the third amendment to the Indonesian Constitution.^(60)
    In 2003, it was established by Law 24/2003 on the Constitutional Court. The Constitutional
    Court is the only court in Indonesia that has the power to receive applications
    for judicial review of laws (*undang-undang*) enacted by the legislature that
    are considered to be unconstitutional (arts 3A and 10(1)(A)). The establishment
    of the Constitutional Court is significant because in the past Soeharto ensured
    that the courts did not have the power to exercise judicial review, a crucial
    check on the power of the executive.^(61) The one limitation on the power of the
    Constitutional Court is that its decisions are prospective, so they can only be
    applied *after* the judgment is handed down.^(62)In January 2006, a request for
    judicial review was filed with the Constitutional Court by Reverend Ruyandi Hutasoit,
    who is a colleague of the three women and the leader of the Prosperous Peace Party
    (Partai Damai Sejahtera, PDS), the largest Christian political party in Indonesia.^(63)
    In his request for review, the applicant argued that article 86 of the Child Protection
    Law violated Indonesia’s constitutional provisions protecting religious freedom.^(64)
    The applicant also cited the Indramayu Religious Education Case as an example
    of unlawful restrictions on religious freedom.In the brief 12-page decision of
    the Constitutional Court, the judiciary first considered the authority of the
    court to hear the case (Constitutional Court, 2005: 6), and then the legal standing
    of the applicant (p.6–9). Ruyadi argued that as a religious preacher and teacher,
    his right to religious freedom under the Constitution was compromised by the Child
    Protection Law. The court held that Hutasoit lacked standing to challenge the
    Child Protection Law under article 56(1) of Law 24/2003 on the Constitutional
    Court because his rights had not been impaired in any way. As a result, the court
    declined to consider the case any further, avoiding the substantive issues in
    this case.[Conclusion](#07_Contents.xhtml_ch4-6)The Indramayu Religious Education
    Case is the first and only time in Indonesia that religious education teachers
    have been convicted for the criminal offence of deceiving a child to change religion.
    It illustrates both the influence of democracy, which opened up the possibility
    of law reform, and the impact of decentralization, which politicizes religion
    at the local level and sees local courts defer to religious leaders in cases involving
    religious matters.Through the Education Law, the religious education policy has
    been widened since 1998 to mandate all schools, whether public or private, to
    provide religious education according to the religion of the student. The government
    has addressed the perceived need of the Muslim electorate to limit proselytization
    and mitigate the ‘risk’ of conversion to Christianity or apostasy. Therefore,
    the religious education provisions of the Education Law primarily reflect concerns
    that Christian schools are stretching the boundaries of ‘acceptable’ proselytization
    by requiring Muslim students to attend Christian religious education, or simply
    by failing to providing Islam religious education for these students. Nevertheless,
    a range of new approaches to religious education are emerging at the local level
    which challenge the government’s current position on segregated religious education
    by giving children the opportunity to learn not only about their own religion
    but also the religion of others, in the context of human rights and morality.The
    state has also responded to Muslim concerns over proselytization through the inclusion
    in the Child Protection Law of an offence of deceiving a child to change their
    religion. This may be an important principle to guide adoption agencies and protect
    orphans because of the implications of religious identity in Indonesia. The Indramayu
    Religious Education Case, however, demonstrates that the Child Protection Law
    has been interpreted very broadly, such that there is no requirement that a person
    intended to convert a child, or that a child did convert. Aside from the courts,
    this case demonstrates the active role played by Islamic leaders from MUI, who
    took the initiative to investigate the incident and report it to the police. The
    case against the teachers was then vocally supported at trial by the intimidating
    presence of radical Islamists.The District Court decided that if a child is allowed
    to attend a religious education class of another religion this constitutes the
    offence of deceiving a child to change his or her religion. This decision suggests
    that the District Court is inclined to defer to Islamic religious leaders and
    their interpretation of national law in light of *hadith*, particularly when under
    pressure from radical Islamists. The District Courts play a crucial role at first
    instance in determining such religious disputes and it is imperative that the
    courts have the capacity to make decisions in an impartial manner, independent
    of religious leaders.The decision at first instance was supported by the Bandung
    High Court and the Supreme Court on appeal, although little reasoning was provided
    for doing so. The Constitutional Court has also since rejected an application
    for judicial review of article 86 of the Child Protection Law. Reforms to the
    law and subsequent court cases since 1998 on the issues of religious education
    and child protection have therefore validated and further entrenched stereotypes
    and suspicions of Christian activities in Indonesia. This is because Christian
    schools are perceived by Muslims as a deceptive means of proselytizing Muslim
    children, seeking converts and therefore threatening the future of the Muslim
    community. While this is an exceptional case, it demonstrates the potential for
    national laws to be manipulated at the local level.Notes1  The only other case
