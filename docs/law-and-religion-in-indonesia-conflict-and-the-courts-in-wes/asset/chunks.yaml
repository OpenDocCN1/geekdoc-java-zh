  trans: "\n\n# 法律案例研究\n\n## 4. 儿童保护与传教的限制\n### 因德拉马尤宗教教育案例\n#### 宗教教学的辩论\n#### 为在基督教学校开展宗教教育而倡导\n\
    #### 反对国家对信仰类学校的干涉\n#### 宗教教育改革：管理改教风险\n#### 宗教教育的创新\n#### 将对儿童的欺骗性传教刑事化\n####\
    \ 法庭动态与宗教权威\n#### 基督教与激进伊斯兰教的当地历史\n#### 教师与宗教关系\n#### 父母的权利\n#### 儿童改教的证据\n####\
    \ 伊斯兰圣训的解读\n#### 对《儿童保护法》的司法审查\n#### 结论\n\n## 5. 圣地之争端\n### 德波克教堂许可案\n#### 对教会的反对\n\
    #### 对《2006 年联合条例》的辩论\n#### 宗教和谐论坛的作用\n#### 许可申请流程\n#### 宗教建筑的争议\n        #####\
    \ 主土权主张\n        ##### “非法”建筑\n        ##### 统一性的假设\n        ##### 地方规划与城市化\n\
    \        ##### 种族与异域性\n        ##### 经济差异与腐败\n        ##### 在法庭维护法律权利\n#### 倡导与投诉的渠道\n\
    \        ##### 挑战 1998 年之前的政府决定\n        ##### 行政法院的司法审查\n        ##### 波哥尔教堂许可案\n\
    \        ##### 普尔瓦卡塔教堂许可案\n        ##### 别西教堂许可案\n        ##### 最高法院的司法审查\n####\
    \ 结论\n\n## 6. 侮辱宗教\n### 打西马拉雅叛教案\n#### 法庭案件趋势\n#### 1998 年后的案件特征\n#### 基督徒与皈教者：侮辱伊斯兰教\n\
    #### 皈基督教的穆斯林\n#### 神的名字：`Allah`、`Tuhan` 或 `Yahweh`\n#### 福音徒侮辱伊斯兰教：马井案\n####\
    \ 内部纠纷\n#### 穆斯林与基督教动态的背景化\n#### 宪法法院与亵神法\n#### 结论\n\n## 7. 结论\n#### 背景下的穆斯林与基督教紧张关系\n\
    #### 抵抗策略\n#### 宗教纠纷的司法化\n#### 结论\n\n## 参考文献\n#### 书籍与期刊文章\n#### 法庭文件\n#### 法律与法规\n\
    #### 报纸文章\n#### 总统演讲\n#### 报告与其他文件\n\n## 索引\n### 地图\n![Image](img/2.jpeg)\n*图\
    \ 1* 西爪哇（Jawa Barat）地图 ：(Robert Cribb (2000) 《印度尼西亚历史数字地图》，NIAS Press)\n![Image](img/3.jpeg)\n\
    *图 2* 印度尼西亚地图 来源：(Robert Cribb (2000) 《印度尼西亚历史数字地图》，NIAS Press)\n\n## 前言\n本项目的实地调研于\
    \ 2009 年至 2011 年间在德波克、因德拉马尤、打西马拉雅（西爪哇）以及雅加达进行。书书中所有从印尼语到英语的翻译均为作者本人完成，除非另有说明。为了方便查阅，所有法律和法院判决的标题均已翻译。术语表基于常用的印尼语拼写法（参考\
    \ Stevens-Tellings (2004); Feders (1995); Esposito (2003)），源自阿拉伯语的伊斯兰词汇已特别注明。\n\
    \n书中`第 5 章`的某些早期版本曾见于 Melissa Crouch (2010)《在印度尼西亚实施崇拜场所条例：新问题、地方政治》，发表于《亚洲研究评论》第\
    \ 34 卷（12 月）：403–19 页。书中`第 6 章`的部分内容曾见于 Melissa Crouch (2012)《印度尼西亚的法律与宗教：宪法法院与亵神法》，发表于《亚洲比较法杂志》第\
    \ 7 卷（5 月）：46 页。`第 4 章`中的案例研究也见于 Melissa Crouch 和 J. Finucane（编）的《传教、宗教多样性与印度尼西亚：欺骗儿童改教的罪》中，该书属于亚洲系列：新加坡：Springer\
    \ 出版。\n\n## 致谢\n在开始我的博士学位之前，我大部分时间都住在印度尼西亚爪哇岛以外的外围岛屿。我曾在巴厘岛与印度教徒同住，在北苏拉威西与基督徒同住，在南苏拉威西和加里曼丹与穆斯林同住。我经历了贯穿整个印尼群岛的深厚宗教宽容传统，在那里基督徒经常受邀参加派对。这只是在缺乏强有力国家的情况下，威胁和暴力的一个指标。作为一名律师，我思考了法律在这种背景下的作用，即它是有助于防止这种情况的发生，还是仅仅加剧了宗教间的冲突。在寻找答案的过程中，我可能只发现了新的问题。如果没有许多人的慷慨帮助和许多机构的支持，这段旅程和这本书是不可能实现的。我对对我国的导师们表示诚挚的感谢和感激。2009\
    \ 年，雅加达苏南卡里雅加国立伊斯兰大学的 Fatimah Husein 博士在我实地调研期间慷慨接待了我。2010–11 年，雅加达谢里夫希达塔拉国立伊斯兰大学文化与宗教中心的\
    \ Amelia Fauzia 博士和伊斯兰中心（PPIM）的 Dina Affrianty 博士担任了极佳的东主。\n\n获得实地调研签证本身就是一项成就，如果没有印尼西亚总领事及墨尔本印尼西亚领事馆工作人员的慷慨帮助，将是不可能的。我也非常感谢\
    \ Fatimah 女士和 Amelia 女士在这方面的帮助。我非常感谢在印度尼西亚实地调研期间协助我的人，特别是协助采访转录的人。我要感谢 Fatmawati、Sukron\
    \ Hadi、Sita Maharrani、Evi Agsyana、Sudedi Leman 和 Rahdiatan Tita。我要感谢以下机构工作人员提供的卓越帮助、耐心和行政支持：墨尔本大学墨尔本法学院的亚洲法律中心、伊斯兰法与社会中心以及研究生研究办公室。\n\
    \n然而，我最感激的是我的导师们。我非常幸运能有两位卓越的学者担任我的导师和良师导师。感谢 Tim Lindsey 教授对我的工作提供的持续支持、指导和批判性反馈。我很高兴他鼓励我尝试撰写论文，并对他为我开启的许多机会深表感谢。我也感谢\
    \ Amanda Whiting 博士提供的所有鼓励、时间支持和友谊。我欣赏她比较和跨学科的视角，以及对细节的关注。除了我的导师外，许多学者也对论文草稿提供了批判性反馈。感谢\
    \ Abdullah Saeed 教授对我论文早期草稿的意见。我也感谢 Michael Feener 副教授对早期草稿提供的帮助和深刻见解。这篇论文的早期草稿部分也受益于\
    \ James Haire 教授、Charles Coppel 教授和 Kate McGregor 博士的反馈。感谢 Carolyn Evans 教授让我有机会通过工作探索不同语境下法律与宗教的更广泛问题。书中的错误由作者负责。\n\
    \n## 术语表\n- `Allah`: 安拉\n- `adat`: 习俗\n- `aqidah`: 教义\n- `agama`: 宗教\n- `aliran`:\
    \ 派别/运动\n- `aliran sesat`: 异端派\n- `adat`: 信仰\n- `azab`: 惩罚\n- `adat`: 源自阿拉伯语的词\n\
    - `islamisasi`: 伊斯兰化\n- `fiqh`: 法法学\n- `hadith`: 圣训\n- `mazhab`: 学法派\n- `hadith`:\
    \ 圣知的言行记录\n- `haj`: 麦加朝圣\n- `halal`: 许可的\n- `halus`: 文雅/礼貌\n- `haram`: 禁\n- `dakwah`:\
    \ 传教\n- `maksiat`: 不道德行为\n- `mazhab`: 学法派\n- `misi`: 使命\n- `mushollah`: 祈祷室\n\
    - `murtad`: 叛教\n- `nabi`: 先知\n- `nasrani`: 基督徒\n- `kristen`: 基督教（通常指 nasrani 的复数）\n\
    - `ibadah`: 仪式崇拜/虔诚\n- `ijtihad`: 独立法律推理\n- `iman`: 信仰\n- `ijayat`: 刑事刑罚\n- `katolik`:\
    \ 天主教\n- `kepercayaan`: 信仰\n- `kitab suci`: 圣经\n- `klenteng`: 中国庙\n- `pancasila`:\
    \ 印度尼西亚国家意识形态\n- `pemekaran`: 地区分设\n- `piagam jakarta`: 雅加达宪章\n- `plesetan`: 谐音梗\n\
    - `pura`: 印度教庙\n- `putra daerah`: 地方人才\n- `reformasi`: 改革时代（1998 年后）\n- `rehal`:\
    \ 古兰经经架\n- `santri`: 伊斯兰学生\n- `sembako`: 九大基本生活用品\n- `zakat`: 施税\n- `zikir`: 念诵安拉之名"
