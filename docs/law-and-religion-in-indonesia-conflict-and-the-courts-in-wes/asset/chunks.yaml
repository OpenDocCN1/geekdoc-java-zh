    total number of people baptized in West Java between 1870–1925, see End, 2006:
    790–96\. For a list of missionaries from the NZV in West Java at this time see
    End, 2006: 10–11.[Part II](#07_Contents.xhtml_pt2)Legal case studies[4  Child
    protection and limits on proselytization](#07_Contents.xhtml_ch4)The case study
    in this chapter, the first of three in this book, focuses on one particular court
    case that arose in the Indramayu District Court, West Java. It analyses the Indramayu
    Religion Education Case, in which two Christian teachers and their pastor were
    found guilty on charges of proselytization under Law 23/2002 on Child Protection.
    This case is significant because it is the first case in Indonesia in which Christians
    have been charged and found guilty of the criminal act of deceiving Muslim children
    to change their religion.¹ I use this case to examine how fears of Christian proselytization
    through institutions such as Christian schools and hospitals are being perpetuated
    through laws and their interpretation in the courts. I analyze the debate on religious
    education, and demonstrate how the policy of segregated religious education was
    extended from public to private schools. Compliance with the new Education Law
    has varied, however, as a range of new approaches to religious education has emerged.I
    then turn to the second aspect of the case, child protection, and explore the
    implications of the new criminal offence of deceiving a child to change his or
    her religion. Finally, I look at some of the particular issues of fact, evidence
    and interpretation that were debated in the Indramayu Religious Education Case,
    in which three Christian women were convicted for the criminal offence of deceiving
    Muslim children to change their religion. This case is an example of the influence
    of radical Islamic leaders at the local level, who lodged criminal allegations
    with the police concerning Christian proselytization. Combined with the intimidation
    tactics of radical Islamic groups, these allegations contributed lead to convictions
    in the local court.[Indramayu Religious Education Case](#07_Contents.xhtml_ch4-1)This
    case arose in response to Law 20/2003 on the National Education System (the Education
    Law), which requires both public and private schools to provide religious education
    for students according to their religion. This requirement was inserted in response
    to long-held complaints that Christian schools do not provide Islamic religious
    education for Muslim students who attend the school.Since 2000, a Protestant church
    in Indramayu, affiliated with the National Protestant Council (Persekutuan Gereja-gereja
    Indonesia, PGI), ran a ‘Happy Sunday’ Christian religious education program for
    Christian children. The program consisted of Christian songs, games and Bible
    study, as well as practical tutoring in reading, writing and mathematics, and
    outings to parks and swimming pools. This program was run by two Christian women,
    Ratna Bangun and Ety Pangesti, under the supervision of their pastor, Dr Rebekka
    Zakariah. In 2003, in order to comply with the law, a primary school in Indramayu
    approached this church and asked it to report the grades of the Christian students
    who attended the program to the school. It is common in rural areas in Indonesia
    for Christian religious education classes to be held outside school hours, given
    the shortage of religious education teachers and the lack of funding for religious
    instruction.Up to 40 children attended the program, mostly Christians. The program
    was held on a Sunday and from the home of one of the teachers in a village area.
    Some Muslim children, as well as some children from inter-religious marriages
    (that is, children with one Muslim parent and one Christian parent), occasionally
    visited the program. The teachers claimed that all the children had the (verbal)
    consent of their parents to attend the program. Further, some of the Muslim parents
    had participated in an outing to the zoo as part of the program, confirmed by
    photographs taken at the event (District Court, 2005d: 8–10).Dr Rebekka, who oversaw
    the program, also worked as a medical doctor. She provided free medical service
    to disadvantaged people in the area and reports had emerged that some of her patients
    had converted to Christianity. According to Kiai Syakur Yasin, leader of Candang
    Pinang *pesantren* (Islamic boarding school) in Indramayu, over 30 families had
    become Christian because of the free medical service and assistance they had received
    from Dr Rebekka.² This angered some Muslim leaders in the community. The chairperson
    of Nahdlatul Ulama (NU), Syairozi Bilal, recalled that this situation caused tension
    when the new converts asked for identity cards listing their religion as ‘Christian.’
    The regent sent a team to the area to investigate whether this was an incident
    of ‘Christianization.’³ In the opinion of Muslim officials from the Ministry of
    Religion, this was a clear case of apostasy and Dr Rebekka had bribed these people
    into changing their religion.⁴ Local religious leaders and government officials
    therefore had another reason, in addition to the Education Law, to complain about
    Dr Rebekka.In late 2004, some local Islamic leaders complained to the local Indonesian
    Ulama Council (Majelis Ulama Indonesia, MUI) when some of the Muslim children
    and children of mixed marriages began singing Christian songs at home. The head
    of MUI of Haurgeulis, KH Mundzir Machmud, consequently reported the case to the
    police (*Republika*, 12 May 2005). The program was forced to close in April 2005\.
    In May 2005, the women were arrested, and in the following month the trial began
    in the Indramayu District Court. According to Pastor Ruyadi Hutasoit, a colleague
    of Pastor Rebekka and the leader of the Peace and Prosperous Party (Partai Damai
    Sejahtera, PDS), the largest national Christian political party in Indonesia,
    his church had agreed to pay for 30 children to attend a *pesantren* (Islamic
    boarding school) as compensation for any harm or offence caused. Ruyadi claimed
    that this agreement was made on the condition that the case against the three
    women would be dropped.⁵ Despite this, the case against the three women was pursued
    in court.The trial began on 30 June 2005 in the local Indramayu District Court.⁶
    On 5 September 2005, the women were convicted for breaching article 86 of the
    Child Protection Law. This provision states that:Any person who deliberately uses
    deceit, a series of lies or entices a child to choose another religion⁷ not of
    his or her own will, despite it being known or suspected that the child is not
    mature and is not yet responsible according to the religion he/she follows, will
    be liable to a maximum jail sentence of five years and/or fined at least one hundred
    million rupiah.⁸The women were also initially charged with blasphemy under article
    156a of the Criminal Code, although this charge was later dropped. In September
    2005, the three women were found guilty under the Child Protection Law of the
    offence of deceiving a child to change religion. They received a three-year jail
    sentence, which they served in the Indramayu Correctional Institution. The teachers’
    appeals to the Bandung High Court, and then the Supreme Court, were both rejected
    (High District Court, 2005; Supreme Court, 2006b). After these events, Rebekka’s
    church came under pressure to close. A number of international advocacy campaigns
    were initiated on behalf of the three women. On 12 June 2007, after spending over
    two years in prison, the women were granted an early release on parole. According
    to lawyer Aries Wibowo, some members of the Christian political party PDS, who
    had been supporting the women throughout the case, were present when the women
    were released.⁹[Debating religious instruction](#07_Contents.xhtml_ch4-2)The Indramayu
    Religious Education Case raised the ongoing concern that Muslim students who attend
    private Christian schools should not have to learn about Christianity but rather
    be provided with Islamic religious instruction. The Education Bill proposed in
    2002 was the cause of major debate both in society and in the legislature (see
    DPR, 2003). The provision on religious education, which aimed to extend the policy
    of compulsory religious education to private schools, was of particular concern
    to Muslims and Christians. The arguments raised in this debate reflect many of
    the deep-seated prejudices and suspicions between Muslims and Christians from
    Indonesia’s colonial past. I examine the extent to which the Education Law has
    influenced schools at the local level and how some religious organizations have
    designed innovative approaches to religious education, irrespective of national
    government policy.[Advocating for religious education in Christian schools](#07_Contents.xhtml_ch4-2-1)Those
    in favor of the Education Bill and its provisions on religious education included
    Islamic-oriented political parties such as the then Justice Party (Partai Keadilan,
    PK), now known as Partai Keadilan Sejahtera (PKS), the United Development Party
    (Partai Persatuan Pembangunan, PPP) and the Crescent Star Party (Partai Bulan
    Bintang, PBB) (*Jakarta Post*, 10 June 2003; 7 May 2003). It also included nationalist
    political parties, such as the Democratic Party of Struggle (Partai Demokrasi
    Indonesia Perjuangan, PDI-P) and the Party of the Functional Groups (Golongan
    Karya, Golkar). Board members of the General Leadership Council of the Indonesian
    Ulama Council, such as Professor KH Umar Shihab (2000–05), were outspoken in their
    support of the right to religious education in private schools (*Republika*, 14
    March 2003). According to KH Mar’uf Amin, the Indonesian Ulama Council was one
    of the key supporters of this proposal.^(10) At the time the Education Bill was
    proposed, leaders of Muhammadiyah also expressed their support, as did many Islamic
    educational institutions and organizations (*Jakarta Post*, 28 March 2003). The
    debate was even joined by groups of school children, such as those who protested
    in front of the Makassar (South Sulawesi) legislature as a show of support for
    the Bill and as a protest against apostasy efforts through education (*Republika*,
    1 May 2003).Supporters of the Education Bill contended that it was necessary for
    the state to enforce a sectarian policy on religious education in both public
    and private schools. It was seen as an important way to integrate religious education
    into all education institutions. This would ensure many Muslim students who attend
    Christian schools receive Islamic rather than Christian religious education, alleviating
    the perceived ‘risk’ of conversion. Many also believed religious education was
    a necessary response to the nation’s perceived moral decay, such as rampant corruption,
    by instilling ethics and morality via religious education.Second, these parties
    appealed to and acknowledged international norms on two levels. They argued that
    the Education Bill was in line with the right to freedom of religion and equal
    opportunity because it allowed a student to receive religious education according
    to their religion even if they were attending a school run by another religion.
    Restricting religious education to the six religions, and only allowing children
    to attend religious education of his or her religion, was seen as a legitimate
    restriction on the right to religious freedom.Third, and perhaps most important,
    its supporters believed the law was necessary to dispel the perceived and real
    risk of attempts at Christianization. They were concerned to ensure that a Muslim
    child who is enrolled at a Christian school is not required to learn about Christianity,
    that the risk of proselytization is contained and the possibility of apostasy
    prevented. At a rally held outside the legislature in June 2003 in support of
    the Bill, demonstrators, including Secretary-General of MUI Din Syamsuddin, claimed
    that those who opposed the Bill were Christians trying to convert Muslims through
    education in Christian schools (*Jakarta Post*, 11 June 2003). According to Yunahar
    Ilyas, board member of Muhammadiyah, the Education Bill was essential to ensure
    religious-based educational institutions do not use the provision of education
    as a means of religious proselytization, which in his opinion can lead to apostasy.^(11)Not
    all support for the Education Bill, however, should be considered genuine, particularly
    the support of nationalist political parties. There was speculation that Golkar
    only endorsed the Education Bill in order to obtain the support of Muslim voters
    in the lead up to the 2004 elections. At the time, Golkar legislator Baharuddin
    Aritonang admitted that the debate on the Education Bill was related to the vested
    interests of political parties in the looming 2004 elections (*Jakarta Post*,
    12 June 2003). Some Muslim-based political parties even publicly declared that
    the controversial Education Bill was a trade-off with radical Islamists, as a
    substitute for the failed attempt to insert the seven words from the Jakarta Charter
    in the 2002 amendments to the Constitution (BBC, 12 June 2003). PDI-P, the political
    party of the then President Megawati Soekarnoputri, initially supported the Education
    Bill. On the day the Education Bill was endorsed, PDI-P boycotted the legislature
    to delay the passage of the Bill. This tactic had political motivations, as the
    Bill had provoked fierce opposition and PDI-P wished to delay its passage so it
    would not affect the party’s popularity in the upcoming 2004 elections (*Jakarta
    Post*, 12 June 2003).[Opposing state interference in faith-based schools](#07_Contents.xhtml_ch4-2-2)On
    the other side of the debate, many groups opposed the religious education provisions
    of the Education Bill. This included the largest traditionalist Muslim organization
    in Indonesia, Nahdlatul Ulama (NU), the Indonesian Communion of Churches (Persekutuan
    Gereja-gereja Injil, PGI) and the Bishops Conference of Indonesia (Kantor Wali
    Gereja, KWI) (*Jakarta Post*, 14 April 2003; 5 April 2003; 11 June 2003). In several
    predominantly Christian provinces, the Regional People’s Representative Council
    (DPRD) voiced its dissent, including in East Nusa Tenggara, Papua and North Sulawesi
    (*Jakarta Post*, 20 May 2003; 28 June 2003). The Education division of the National
    Commission on Human Rights (Komnas HAM) opposed the Education Bill, as did the
    former president of Indonesia, the late Abdurrahman Wahid.^(12) Many Christian
    and Catholic private educational institutions and organizations also spoke out
    against the Education Bill (*Asia Times*, 10 May 2003).First, these groups argued
    that the Education Bill constituted unwarranted state interference into religious
    education and potentially into the affairs of private schools (*Jakarta Post*,
    20 March 2003).^(13) It was argued that compelling private schools to provide
    religious education according to a student’s religion discriminated against Christian
    schools because, as mentioned earlier, many Muslim parents send their children
    to Christian schools due to the reputation for high-quality education in Indonesia.
    In comparison, according to Protestant scholar Jan Aritonang, Christian children
    rarely attend Islamic schools, so this requirement is unlikely to affect Islamic
    schools.^(14) Christian schools further argued that it is the right of private
    schools to require parents to sign a statement that they have no objections that
    it is a Christian-based school and does not provide Islamic religious instruction.
    Failing or refusing to give written consent means that parents cannot send their
    children to a Christian school. Opponents also cited the practical and financial
    burden these requirements would place on Christian schools, such as hiring a Muslim
    teacher, creating an Islamic religious education program, setting up a *mushollah*
    (prayer room) and so on. This was seen as impractical, as well as contrary to
    the purposes of Christian schools (*Jakarta Post*, 15 March 2003). It was argued
    that the Education Bill allowed the state to override the rights of private religious
    schools in this regard (*Jakarta Post*, 29 April 2003).In the drafting process,
    Pastor Weinata Sairin, along with Catholic representative Father Benny Suseno,
    opposed the Education Law because they felt that it amounted to government interference
    in the private affairs of Christian schools.^(15) The Protestant Education Council
    and the National Catholic Education Council both rejected the draft law, which
    provided a penalty of ten years or a fine of Rp 1,000,000 (A$110) if a person
    or group did not provide religious education according to a child’s religion (Yewangoe
    and Sairin, 2009: 128; art. 57(3)).In addition, these groups argued that this
    would place an unnecessary obligation on Christian schools, interfering in the
    affairs of private schools. Private Christian schools would be forced to provide
    more than just Christian religious education, so parents feared they could not
    be assured that their child would receive a Christian education even if they sent
    them to a Christian school. Opponents of the Education Bill argued that the state
    could not override the claims of two other major stakeholders in religious education:
    parents^(16) and educational institutions (*Jakarta Post*, 29 April 2003; 2 May
    2003).Finally, there were suspicions that the Education Bill was part of an effort
    to Islamize Indonesia, undermine Christianity and turn Indonesia into an Islamic
    state. The legislature of Papua, a majority-Christian province, argued that the
    enforcement of laws-based Islam would be detrimental to social harmony and a threat
    to national unity, and declared that it would not implement the law (*Jakarta
    Post*, 28 June 2003). This is a common argument raised by religious minorities
    in Indonesia each time a law based on Islam, or a law perceived to favor Muslims,
    is proposed. The National Human Rights Commission also appealed to international
    law, arguing that the Education Bill would promote a narrow view of religious
    education at the expense of the right to religious freedom for many religious
    minorities (*Jakarta Post*, 14 May 2003).Despite these objections, the debate
    culminated in the passage of the Education Bill into Law 20/2003\. The Islamic-based
    political party PKS openly claimed it to be one of its success stories (Shihab
    and Nugroho, 2008: 248). An analysis of the provisions of the Education Law on
    religious education as passed demonstrate the underlying concerns to minimize
    the ‘risk’ of conversion.[Reforming religious education: managing the risk of
    conversion](#07_Contents.xhtml_ch4-2-3)The Education Law reflects a shift in the
    religious education policy of the government. In 2002, there were indications
    that changes to government policy on education were underway when the role of
    religion in education was expanded further in the amendments to the Constitution.
    Article 31(3) states that the education system aims to increase the faith and
    ‘God-consciousness’ of its students.Not long after this, in July 2003, Law 20/2003
    on Education (‘Education Law’) was enacted. This was part of the democratic reform
    process in Indonesia and emphasized the implementation of decentralization and
    public accountability,^(17) and firmly established religion as part of the general
    education program.^(18) The two key provisions of the Education Law in relation
    to religious education are article 12(1)(a) and article 30\. Article 12(1)(a)
    requires all schools to provide religious education for a student according to
    his or her religion. It states that:Every student in every educational institution
