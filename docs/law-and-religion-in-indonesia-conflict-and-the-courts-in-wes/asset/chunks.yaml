    penodaan agama*, which means to misuse, besmirch or insult a religion. In Indonesia,
    several terms are used by both Muslims and Christians to describe offences, often
    interchangeably, including *penodaan agama* (disgracing a religion); *penistaan
    agama* (insulting or defaming a religion); and *penyalahgunaan agama* (misusing
    or abusing a religion). A person who is accused of blasphemy may be called *murtad*
    (apostate), *kafir* (infidel), *aliran sesat* (deviant group), *sesat* (deviant),
    or *aliran kepercayaan* (mystical belief). The use of these terms reinforces the
    distinction between mystical beliefs and religions (explained in [Chapter 3](#15_Chapter03.xhtml)),
    and shows a concern for protecting the orthodox teachings of a religion.The Elucidation
    to the Blasphemy Law clarifies that the accused must have intentionally insulted
    or shown hostility towards a religion (art. 4). Written or verbal statements that
    are objective and avoid the use of offensive words or phrases are not considered
    to be a criminal offence under this article. The Elucidation justifies the severity
