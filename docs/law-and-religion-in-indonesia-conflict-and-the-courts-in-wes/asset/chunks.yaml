- fmt: "\n# 1 Introduction\n\nThe initial years of the precarious transition to democracy\
    \ in Indonesia that began in 1998 coincided with some of the worst violence between\
    \ Muslims and Christians in the history of that country. Violence broke out across\
    \ the archipelago, dividing communities according to religious affiliation in\
    \ areas such as Maluku and Central Sulawesi. The arrival of reinforcements, particularly\
    \ radical Islamic groups, from other islands such as Java, escalated the conflict\
    \ in these areas beyond local differences. These civil conflicts tore apart neighborhoods\
    \ and communities that had existed peacefully side by side for many years. They\
    \ resulted in thousands of casualties, and tens of thousands of people displaced.\
    \ These clashes were marked by attacks on places of religious significance, such\
    \ as churches and mosques.\n\nAt the same time as these conflicts raged on the\
    \ peripheral islands of the archipelago, religious minorities on the nation’s\
    \ most populous island, Java, were also the target of brutal vigilante action.\
    \ In the years just prior to the fall of President Soeharto (1966–98), large-scale\
    \ attacks and burnings of churches occurred in cities such as Surabaya and Situbondo\
    \ (East Java), and Tasikmalaya (West Java). At the end of 2000, the Christmas\
    \ Eve services of over 30 churches across Indonesia were shattered by bombings\
    \ coordinated by the radical Islamic group `Jemaah Islamiyah`, leaving 19 dead\
    \ (Fealy, 2005b: 6). Every Christmas since, thousands of churches across Indonesia\
    \ have been guarded by sympathetic local Islamic groups to prevent the risk of\
    \ future attacks.\n\nIslamist perpetrators of violence against Christians have\
    \ rarely been prosecuted, or have received light sentences in proportion to their\
    \ crime, while many Christians perceive that violence instigated by Christians\
    \ against Muslims has been prosecuted more earnestly. When such cases proceed\
    \ to court, they are often highly contested and controversial, such as the allegations\
    \ made against three illiterate Catholic farmers from Poso, Central Sulawesi.\
    \ These men were found guilty of masterminding violent attacks against three Muslim\
    \ villages in Poso in 1999, and were subsequently executed in 2006. The executions\
    \ went ahead despite legal appeals for presidential clemency, calls from Christian\
    \ political parties and Pope Benedict XVI for the case to be retried, and harsh\
    \ criticism from human rights groups. Their deaths led to further protests and\
    \ demonstrations, as well as triggering incidents of retaliation by Christians\
    \ angered at the perceived injustice of the outcome (*Jakarta Post*, 24 September\
    \ 2006; 2 October 2006).\n\nAlthough the violence in Maluku and Central Sulawesi\
    \ largely died down by 2002, intermittent attacks persist. In October 2005, for\
    \ example, three Christian school girls were cruelly beheaded in an attack by\
    \ six Muslim men, one of whom was affiliated with the radical Islamist group `Jemaah\
    \ Islamiyah` in Sulawesi (*Jakarta Post*, 22 March 2007). Attacks and campaigns\
    \ to close Christian churches persist at a rate far exceeding the number of attacks\
    \ during the New Order (1966–98), particularly in the densely populated, majority-Muslim\
    \ province of West Java. Conflict over church permits further deteriorated in\
    \ August 2010, when a pastor and church elder were brutally stabbed by radical\
    \ Islamists in a confrontation over the construction of a Batak church in Bekasi\
    \ (West Java) (ICG, 2010). This series of events indicates that although large-scale\
    \ violence between Muslims and Christians in the *reformasi* era peaked between\
    \ 1999 and 2001, sporadic campaigns to close Christian churches or prevent proselytization\
    \ activities continue to occur at the initiation of a minority of Muslims who\
    \ are willing to use violence to achieve their goals.\n\nA wide range of factors\
    \ contribute to these violent incidents, from issues of ethnicity, socio-economic\
    \ disparity, religious sentiment and local politics. Yet among these various reasons,\
    \ the issue of proselytization – that is, perceived or real efforts by Christian\
    \ groups to propagate Christianity – has received little attention. Proselytization\
    \ is often a central reason behind religious conflict worldwide (An-Na’im, 2009:\
    \ 2). The lack of attention to this issue is therefore surprising given Indonesia’s\
    \ religious makeup and the history of Muslim-Christian relations.\n\nIndonesia\
    \ is the largest Muslim-majority country in the world, and the third largest democratic\
    \ state. The transition to democracy in 1998 was followed by significant legislative\
    \ reforms including amendments to the Constitution that inserted a wide range\
    \ of international human rights, as well as remarkable steps forward politically,\
    \ with free and fair elections. It has led to the affirmation of judicial independence\
    \ and the establishment of freedom of the press. It has seen the notorious ‘dual\
    \ function’ of the military dismantled, with the abolition of seats reserved for\
    \ the military in the legislature. It has also led to the strengthening of non-judicial\
    \ mechanisms of review of government action, such as the National Human Rights\
    \ Commission, as well as the creation of other avenues as a check on the power\
    \ of government officials, such as the office of the Ombudsman. There has also\
    \ been a remarkable transfer of power to the regional level due to a widespread\
    \ process of decentralization.\n\nThe change brought about by the introduction\
    \ of democracy and decentralization has opened up greater freedom of expression\
    \ and practice for religious communities. Religion is deeply embedded in Indonesian\
    \ culture, and almost 90 per cent of Indonesians follow Islam. The remaining population\
    \ is 5.7 per cent Protestant, 3 per cent Catholic, 1.7 per cent Hindu, 0.06 per\
    \ cent Buddhist, and 0.01 per cent Confucian (Ministry of Religion, 2010b). The\
    \ state is based on the `Pancasila` ideology, which includes the belief in Almighty\
    \ God. Officially, the state recognizes and gives preferential treatment to six\
    \ religions (`agama`): Islam, Protestantism, Catholicism, Hinduism, Buddhism and\
    \ Confucianism. A range of religious communities and local beliefs exist outside\
    \ the state-sanctioned religions, and there is also great diversity within religious\
    \ traditions (see Chapter 3). In the past, this diversity has been the cause of\
    \ both social pluralism and conflict.\n\nThis book is about the two major religions\
    \ in Indonesia: Islam and Christianity. While a traditional understanding of the\
    \ relationship between these communities casts the debate as one of majority versus\
    \ minority, this book seeks to add nuance and explore the complexity of this relationship.\
    \ First, Christians are a majority in some parts of Indonesia, while Muslims are\
    \ a minority in other provinces. Status as a minority, therefore, depends on context.\
    \ Second, Christianity has historically occupied a very privileged and central\
    \ position since independence and many Christians exert significant influence\
    \ in sectors such as the military, the police, politics, the judiciary and the\
    \ legal profession. Even if Christianity is the religion of a minority in some\
    \ areas, at the national level it has enjoyed far greater representation due to\
    \ its recognition as an official religion by the state, in comparison to other\
    \ religious minorities that fall outside the six recognized religions.\n\nThis\
    \ book primarily focuses on West Java, where Muslims are a majority and Christians\
    \ a minority. Yet the developments in West Java will be situated in broader national,\
    \ historical and social context. The findings of this book are therefore significant\
    \ not only for other areas, but also speak into ongoing debates on religion-state\
    \ relations. First, it relates to the challenge of governments worldwide to accommodate\
    \ minorities, and to manage religious pluralism. Second, it addresses the issues\
    \ specific to developing and consolidating democracies where, in the absence of\
    \ a strong state and law enforcement, the use of violence threatens the resolution\
    \ of disputes through the legal system. Further, book focuses particularly on\
    \ the minority of Muslims in Indonesia who support the establishment of Islamic\
    \ law. This is a diverse group, who I will refer to as ‘Islamists,’ or as they\
    \ are known in Indonesia, `garis keras`, ‘hardliners’ (see further explanation\
    \ in Chapter 3). A small proportion of this group use violence to achieve their\
    \ goals, who I will refer as ‘radical Islamists.’\n\n## Faith in the law? Boundaries\
    \ of proselytization\n\nIn Indonesia, it is assumed that the two largest religious\
    \ communities, Christianity and Islam, are missionary religions that aim to proselytize\
    \ (Ricklefs, 2008a). There is no direct translation of the term ‘proselytization’\
    \ in Bahasa Indonesia. Indonesian Christians often refer to the term `misi`, mission,\
    \ while Muslims use the Arabic term `dakwah` (lit. to call). Proselytization includes\
    \ all efforts to attempt to convert or persuade a person to a particular religion\
    \ and community. Conversion out of Islam is, of course, considered to be apostasy\
    \ (see Chapter 6).\n\nWhen conversion does occur, it has two main consequences.\
    \ First, conversion implies a shift in allegiance from one religious tradition\
    \ to another. Efforts to convert a person are also about seeking new members of\
    \ an institution or community. The shift in religious boundaries brought about\
    \ by conversion potentially disrupts religious communities (Hefner, 1993: 122).\
    \ Ultimately, conversions between religions threaten the power of both political\
    \ parties and religious leaders in contexts where popularity depends on the stable\
    \ majority. Conversions may lead to the insult of a religion, where converts demonize\
    \ or denigrate the religion they left. As both Christianity and Islam are recognized\
    \ as religions with a missionary agenda in Indonesia, the issue of conversions\
    \ between religions is a cause of real tension.\n\nWithin Islam it is generally\
    \ considered acceptable for Muslims to engage in proselytizing (`dakwah`). In\
    \ the twentieth century, the `dakwah` efforts of Muslims were largely driven by\
    \ concerns of encroaching Christianization (Saeed and Saeed, 2004: 17). Indonesia\
    \ was no exception because conversions from Islam to Christianity are the most\
    \ common religious. There is a high level of intolerance of conversion from Islam,\
    \ that is, apostasy, which is perceived as a real threat to Islam and the Muslim\
    \ community. Nevertheless, there are no legal restrictions imposed by the state\
    \ in Indonesia that prevent a person from converting to another religion, unlike\
    \ in Malaysia.\n\nOne point of contention that often arises is the motives behind\
    \ proselytization efforts. A basic assumption of many who proselytize is that\
    \ their religion offers a better alternative, implying religious and cultural\
    \ superiority. In the context of proselytization towards Muslims, it is often\
    \ taken as suggesting or implying that Christianity is ‘better’ than Islam. Indeed,\
    \ conversion from one religion to another involves a conscious rejection of the\
    \ former. Conversion from Islam to Christianity may therefore be perceived as\
    \ the outright rejection of Islam (Ricklefs, 2008b: 133). The ultimate goal of\
    \ proselytization – conversion – presents a risk and a challenge to the identity\
    \ and stability of a Muslim community (An-Na’im, 2009: 6).\n\nOn the other hand,\
    \ common objections to proselytization are often based on problematic assumptions;\
    \ for example, it may be assumed that proselytization is always coercive and cannot\
    \ occur on equal terms because such efforts are only successful if proselytizers\
    \ have a material advantage over the target group (An-Na’im, 2009: 6). This is\
    \ partly because of the competitive nature of proselytization which, at its extreme,\
    \ may result in a ‘war for souls,’ where mutual defamation occurs and laws are\
    \ manipulated for the religious advantage of the majority (ibid.: 4).\n\nIn Indonesia,\
    \ attitudes towards Christian proselytization vary both within and between Islam\
    \ and Christianity. Most Indonesian Muslims are not necessarily against Christian\
    \ proselytization. Rather, they contest the kind of proselytization that is permissible\
    \ or acceptable. Two concepts have been increasingly reinforced by government\
    \ policy since independence: the distinction between religions and local beliefs,\
    \ and the idea of a fixed religious identity as a way of preventing conversions\
    \ between religions (see Chapter 3).\n\nThe debate over proselytization between\
    \ Muslims and Christians in Indonesia is focused on who is ‘fair game’ for efforts\
    \ of proselytization and what are acceptable terms of engagement. Indonesian Muslims\
    \ generally argue that a person who already has a religion must not be the target\
    \ of religious proselytization. Since independence, Islamists have demanded that\
    \ Christian proselytization should be limited to those who do not yet have a religion\
    \ – that is, who do not have one of the six official religions listed on their\
    \ national identity card (particularly ‘Islam’). This conviction suggests religious\
    \ affiliation and identity with a world religion such as Islam should be relatively\
    \ fixed, certain and permanent. It also implies that once a person enters a religious\
    \ community, there is little possibility of moving to another religion.\n\nIn\
    \ addition, Muslims contest and oppose methods of proselytization that are perceived\
    \ to be ‘aggressive’ (`agresif`) or situations where a person is suspected of\
    \ being ‘coerced’ (`dipaksa`) or ‘deceived’ (`ditipu`) into converting. Protestant\
    \ and Catholic Christians are also generally in agreement that deceptive tactics\
    \ should not be used, although the definition of what amounts to deceptive proselytization\
    \ may differ. The concept of proselytization is complicated by notions of ‘legitimate’\
    \ and ‘illegitimate’ proselytization, which in Indonesia are often determined\
    \ by who the ‘target’ is and the methods used to proselytile. The purpose of this\
    \ book is not to determine what are or should be legitimate forms of proselytization,\
    \ but rather to explore the effects or influence of local understandings and methods\
    \ of proselytization on the regulation of religion in the Indonesian context.\n\
    \nThe perpetuation of suspicions and fears between Muslims and Christians has\
    \ in part been caused by stereotypes of `Kristenisasi` (Christianization). This\
    \ term is generally used by Indonesian Muslims to refer to Christian practices\
    \ or activities that aim to convert Muslims by using unfair methods to prey on\
    \ vulnerable groups, such as children, the sick. Examples of proselytization that\
    \ Islamists cite as ‘deceptive’ include the building of Christian hospitals, schools\
    \ (particularly Muslim-majority areas), or giving aid to non-Muslims with the\
    \ aim of converting them to Christianity. It is not just Muslims who oppose manipulative\
    \ Christianization, but also Protestants and Catholics. In Indonesia, most concerns\
    \ over Christianization are in relation to Protestant, Evangelical, which has\
    \ historically been distinguished from Protestantism in Indonesia (see Chapter\
    \ 3).\n\nIn conclusion, Chapter 7 draws together this discussion of law and religion\
    \ in Indonesia, highlighting how Islamists have used legal means to oppose Christian\
    \ proselytization, and questioning whether minorities can assert their rights\
    \ in fair and impartial legal forums. It demonstrates that hostility to proselytization\
    \ has intensified, taking the form of vigilante violence as well as campaigns\
    \ for laws based on Islam and efforts to convict Christians for overstepping the\
    \ boundaries of proselytization. This is because of the greater freedoms and opportunities\
    \ for religious communities to influence law reforms under democracy, combined\
    \ with a competitive local environment in a decentralized Indonesia. It asserts\
    \ that real and perceived fears of proselytization continue to fuel tension between\
    \ Muslims and Christians in Indonesia. Sporadic campaigns of intimidation by radical\
    \ Islamists against Christians have persisted, laws have been introduced in line\
    \ with `syariah`, and Christians have been convicted and imprisoned for offences\
    \ against Islam. This is because the combination of democratic freedoms, the decentralization\
    \ of power and a history of opposition to proselytization has led to religious\
    \ majoritarianism at the local level, at the expense of the rights of religious\
    \ minorities. Christians have exercised their democratic rights in court but,\
    \ even if a case is resolved in their favor, such decisions have little practical\
    \ effect in the face of state ambivalence towards the vigilante action of radical\
    \ Islamists who disregard the rule of law.\n\n## Outline of the book\n\nPart I\
    \ sets the broader context for this book. \n\nChapter 2 begins by examining the\
    \ historical origins for opposition to Christian proselytization in Indonesia\
    \ and the policies that developed under the New Order. It provides a brief overview\
    \ of the colonial era and the favoritism, real and perceived, that colonial authorities\
    \ showed to Christianity. This chapter then focuses on the crucial period of the\
    \ 1960s, when the perceived threat of communism saw many suspected communists,\
    \ or those who did not adhere to a world religion, convert to Christianity. At\
    \ the insistence of Islamists, the president introduced the criminal offence of\
    \ blasphemy, and the Minister of Religion issued regulations on matters such as\
    \ segregated religious education in schools, permits for places of worship, and\
    \ limitations on religious proselytization.\n\nChapter 3 analyses how religious\
    \ communities and their leaders, particularly Muslims and Christians as adherents\
    \ of the two largest religions in Indonesia, use state processes and institutions\
    \ to reform or introduce laws that apply to all religious communities. It argues\
    \ that efforts since 1998 reflect the growing fears Muslims have of Christianization.\
    \ By identifying key religious institutions within the bureaucracy, it demonstrates\
    \ how these bodies are being influenced by Islamists to advocate policies favorable\
    \ to their agenda. This is because the expansion of Christian schools is debated,\
    \ and the extent to which colonial authorities supported the expansion of Christian\
    \ schools is the Muslim community. It also looks at one of the most significant\
    \ changes since decentralization – the proliferation of religious regulations\
    \ at the regional level – and influence on legal disputes between Muslims and\
    \ Christians in West Java.\n\nPart II examines three legal case studies. According\
    \ to former Minister of Religion `Tarmizi` (1993–98), the potential for conflict\
    \ between religions in Indonesia mainly occurs due to one of the following:\n\
    1. when proselytization is aimed at gaining converts from another religion;\n\
    2. when places of worship are built without permits;\n3. when a person insults\
    \ another person’s religion (Taher, 1997:16). These fears – of conversions between\
    \ religions, of unlicensed places of worship and insults – are at the heart of\
    \ the case studies.\n\nChapter 4 raises issues of religious education and child\
    \ protection. This chapter focuses on the introduction of Law `23/2003` on Education\
    \ and the interpretation of religious policies in both public and private schools.\
    \ It analyzes the Indramayu Religious Case, in which Christian education teachers\
    \ were charged with deceiving Muslim primary school to change their religion.\
    \ This is because the conversion from Islam to Christianity are the most common\
    \ religious conversions in Indonesia (Saeed and Saeed, 2004: 17). Indonesia was\
    \ no exception. \n\nChristian religious activities raise fears and suspicions\
    \ of a conversion agenda, particularly for Islamists. There is a high level of\
    \ intolerance of conversion from Islam, that is, apostasy, which is perceived\
    \ as a real threat to Islam and the Muslim community. Nevertheless, there are\
    \ no legal restrictions imposed by the state in Indonesia that prevent a person\
    \ from converting to another religion, unlike in Malaysia.\n\nChapter 5 addresses\
    \ the regulation of permits for a place of worship and the symbolic value of religious\
    \ buildings as sites of Christianization. This uses the example of the Depok Church\
    \ Case, in which a church challenged the decision. Permit highlight the acute\
    \ limits of legal mechanisms, in the absence of political will to protect the\
    \ rights of religious minorities. This is addressed by the People’s Consultative\
    \ Council (`Majelis Permusyawatan Rakyat`), which decided that parents can choose\
    \ for child to opt out of religious classes.\n\nChapter 6 raises issues of conversion,\
    \ apostasy, and blasphemy, particularly conversions from Islam to Christianity.\
    \ This chapter examines the specific meaning and application of blasphemy in the\
    \ Indonesian context. While issues of blasphemy and heresy have a long history\
    \ within Christianity, this chapter centers on contemporary understandings of\
    \ the offence of ‘insulting a religion.’ This chapter is concerned with cases\
    \ in which Christians have been accused of insulting Islam, such as the Tasikmalaya\
    \ Apostasy, in which a Muslim convert to Christianity was convicted for insulting\
    \ Islam. The enforcement of the criminal offence of blasphemy, as set out in article\
    \ `156a` of the Indonesian Criminal Code, is linked to cases of conversions from\
    \ Islam to Christianity. It will be shown that prosecutions of Christians for\
    \ blasphemy function like an apostasy law, allowing Islamists publicly to condemn\
    \ conversions from Islam to Christianity.\n\n## Context\n\n### Hostility to Christian\
    \ activities\n\nPolicies on religious affairs are partly a reflection of the struggles\
    \ and dynamics between religious communities in the past. Indonesian Muslims’\
    \ attitudes towards Christian activities have been shaped by colonialism and have\
    \ influenced the development of policies under the New Order. This chapter examines\
    \ the links between colonialism and Christianization, particularly through institutions\
    \ such as Christian schools. After the demise of colonialism, the 1960s became\
    \ a crucial part of this narrative, as the threat of communism and a sense of\
    \ crisis prompted many suspected communists to convert to Christianity. These\
    \ events motivated some Muslims to lobby the government to introduce a series\
    \ of policies or restrictions on religious activities. Each of these policies\
    \ had a lingering impact on the way the government manages religious communities\
    \ and regulates religious affairs.\n\n### Colonialism and Christian missions\n\
    \nIn many countries, prejudices and stereotypes of Christianization in Indonesia\
    \ are overshadowed by the legacy of colonialism. In the early 1500s, the Portuguese\
    \ were the first Europeans to arrive in Indonesia with them the Roman Catholic\
    \ Church. In 1600s, the Dutch took over as the dominant foreign power in Indonesia\
    \ and under its control Christian missionary efforts were initially restricted\
    \ (see Steenbrink, 2008). During the entire period of the Dutch East Company (`Vereenigde\
    \ Oostische Compagnie`, `VOC`, 1602–1799), Catholic workers were not allowed (Steenbrink,\
    \ 2003: 7). In contrast, the Protestant Church was one of the departments of `VOC`\
    \ (Klinken 2003: 9,13). This had the effect of polarizing Protestantism and Catholicism,\
    \ as noted in detail in Chapter 3.\n\nFurther, until the 1900s, the Dutch consciously\
    \ excluded Christian mission and workers from areas that were ‘economically important\
    \ or religiously sensitive’ (Nyhus 1987: 20). This sentiment was echoed in reports\
    \ to the Dutch government arguing for restrictions on Christian missions. For\
    \ example, Governor-General `Baud` (1883–86) was of the opinion that ‘it is in\
    \ the interests of the Dutch government to restrict [Christian] mission as much\
    \ as possible.’ This implied that religion, particularly a foreign Western such\
    \ as Christianity, was perceived as a force that must be controlled in order to\
    \ maintain and advance political power in a majority-Muslim country. Limitations\
    \ on proselytization were also set out in the Constitution of the Netherlands\
    \ (`Regerings-reglement`) of 1854. According to article 23, all Christian teachers,\
    \ priests and ministers were required to obtain permission from the governor-general\
    \ to work in a particular area (Steenbrink 2003: 28). In addition to permits for\
    \ all individuals, this policy reinforced the distinction between Protestants\
    \ and Catholics by giving churches exclusive rights to work in certain areas (Nyhus\
    \ 1987:20). For example, the island of Flores and the provinces of South Sulawesi\
    \ were only open to Catholic missionaries, while Sumba (East Nusa Tenggara) and\
    \ Batak areas such as Tapanuli (North Sumatra) were restricted to Protestants\
    \ (WWI 1975:25). Klinken (2003:11) notes that ‘most important among the results\
    \ achieved by these private missions was the large Batak Protestant Church.’ Under\
    \ a policy introduced in 1854, parts of Indonesia were divided up into exclusive\
    \ Christian domains, although Protestant Christians usually had the upper hand.\
    \ Despite these formal restrictions, Christian missionaries were not only permitted\
    \ but encouraged by the Dutch colonial government to pursue a missionary agenda\
    \ (Shihab 1995:273). Evidence cited for this favoritism includes educational advantages,\
    \ financial resources and other facilities provided by the government to Christians\
    \ (Shihab 1995:275). For example, the colonial government paid the salaries of\
    \ some religious leaders, and the disproportionately high salaries of Catholic\
    \ priests and Protestant ministers caused many critical remarks from Muslim deputies,\
    \ who concluded that Christianity was a privileged religion (Steenbrink 2007:\
    \ 6). This stirred feelings of resentment and jealousy towards converts to Christianity\
    \ who enjoyed the same privileges as the Dutch and were believed to be ‘protected’\
    \ by them (Akkeren 1970:113). This led to a strong association between Dutch colonialism\
    \ and Christianity, and those who converted to Christianity were seen as belonging\
    \ to the Dutch, the ‘other side’ (Boland 1982:224).\n\nConcerns over foreign and\
    \ aggressive Christian proselytization did not abate after independence from colonial\
    \ rule in 1945, partly because the colonial restrictions on mission no longer\
    \ applied and arguably led to greater freedom for Christian proselytization (Hasyim\
    \ 1979: 306). This perpetuated the concern that Christianity was competing with\
    \ Islam for control of the country (Shihab 1995: 246). In the mid-2000s, the Islamic\
    \ Prosperous Justice Party (`Partai Keadilan Sejahtera`, `PKS`) blamed missionary\
    \ efforts under colonialism for inciting tensions between religions:\n\n> The\
    \ colonial invasion began with the arrival of the Portuguese (who brought Catholicism)\
    \ and the Dutch (who brought Protestantism), which caused conflict and local opposition.\
    \ (PKS, 2007: 162)\n\nApprehension over Christian missionary activities and conversions,\
    \ combined with an awareness of past Christian Crusades and European colonialism,\
    \ produced defensive reactions from radical Islamists in Indonesia (Taher 1997:\
    \ 116). The former Minister of Religion (1993–98), Tarmizi Taher, articulated\
    \ the consciousness of past injustices committed by Christians against Muslims\
    \ (Taher 1997: 66):\n\n> Throughout history, Muslim and Christian (or Western)\
    \ relations have been colored by the fierce battles of the Crusades, Western colonial\
    \ expansion and domination, and bitter rivalry between Christian and Muslim missionaries.\n\
    \nIn particular, he linked the challenges facing Indonesia with the broader issues\
    \ confronting Muslim-majority countries. According to Taher (1997: 139):\n\n>\
    \ There has been much concern in the Muslim world about an aggressive campaign\
    \ to missionize and convert Muslims to Christianity, more so because the campaign\
    \ was seen as funded and backed by foreign powers and the means and methods used\
    \ to preach Christianity.\n\nThis agenda was believed to be linked to the establishment\
    \ of churches, hospitals and schools. The extent to which colonial authorities\
    \ supported the expansion of Christian schools is debated, but clearly by the\
    \ end of the nineteenth century the government openly supported Christian schools\
    \ (Kelabora 1976: 31). Christian education in Indonesia began in the 1540s in\
    \ the Maluku islands, where Christian teaching was intertwined with missionary\
    \ activities (Kelabora 1976: 23). The initial policy of the Dutch government during\
    \ the colonial era declared that religion was not to be taught as a subject in\
    \ government schools, avoiding the issue of religious instruction (Kelabora 1976:\
    \ 22). Furthermore, prior to 1890, the Dutch denied requests for subsidies to\
    \ avoid any suspicion from the Muslim community (Shihab 1995: 245). The change\
    \ came in the late nineteenth century when the Dutch government began to support\
    \ Christian-based education through the provision of funding, which was not available\
    \ to the same extent for Islamic schools (Husein 2005: 66). For example, between\
    \ 1936 and 1939, a disproportionate sum of money was allocated to Protestant and\
    \ Catholic schools compared to Islamic schools (Saerozi 2004: 134). Christian\
    \ schools enjoyed this privileged position until the Japanese occupation in 1942\
    \ when some private schools were forced to close (Sairin 1996: 258).\n\n### Segregated\
    \ religious instruction\n\nOne area in which government policies on religion divided\
    \ religious communities is education. In 1946, the Ministry of Education set up\
    \ an Education Commission to design a new national education system. One of its\
    \ responsibilities was to address the issue of religious instruction in schools\
    \ (Kelabora 1976: 38). The outcome of the Commission’s investigation was a new\
    \ law which included the following policy on religious instruction: `Religious\
    \ instruction shall be provided in government schools and parents shall decide\
    \ whether their children are to attend` (art. 20). This meant that religious education\
    \ was to be provided in all public schools, though it did not apply to private\
    \ schools, and participation was optional, depending on the wishes of the parents.\n\
    \nIn 1950, due to concerns that Muslim children were not receiving Islamic education,\
    \ the Minister of Religion and the Minister of Culture issued a letter to public\
    \ schools instructing them to provide Islamic education. This was further clarified\
    \ in `art.2(2)`, reinforcing that every student must attend religious education\
    \ for at least two hours per week if there were more than ten students, although\
    \ this did not extend to private schools.\n\nIn 1966, the government issued a\
    \ decision that made religious education compulsory for all students. This decision\
    \ specifically deleted the previous provision which provided that parents can\
    \ choose for child not to participate in religious education, and replaced it\
    \ with the sentence `religious education is a compulsory subject in all schools,\
    \ from primary school through university.` This effectively nullified the right\
    \ of parents to withdraw their child from religious education and forced parents\
    \ to identify their child as `belonging` to one of the six religions.\n\nThroughout\
    \ the New Order, Islamists sought to restrict the perceived influence Christian\
    \ schools had over students. In 1967, an inter-religious conference (explained\
    \ below) debated the issue of religious education. According to Hashim (1979),\
    \ the Muslim delegates expressed concern that `if Muslim children attend a Christian\
    \ school, they will be tricked into becoming Christian because they are easily\
    \ deceived` (Hashim 1979: 29). Differences of opinion between Muslims and Christians\
    \ on this issue continued.\n\nIn March 1975, in a speech at the Commemoration\
    \ of the Birthday of Prophet Muhammad in Jakarta, President Soeharto declared:\
    \ `In the implementation of religious education, it is best to provide religious\
    \ education for each religion` (Krissant 1976: 37). He emphasized that religious\
    \ education was necessary not only in public schools but also in private institutions\
    \ (Krissant 1976: 38). The government continued to warn schools that students\
    \ should not be targets of proselytization. In June 1978, Minister of Religion\
    \ `Alamsyah` delivered a speech to a group of `ulama` (Islamic leaders) in Bandung,\
    \ urging religious schools not to proselytize their students (Hashim 1979: 33).\n\
    \nBy the 1980s, almost 20 years after the attempted communist coup and the introduction\
    \ of the new religious education policy, concerns were still being expressed by\
    \ some Muslim leaders anxious about the risk of conversion. In particular, the\
    \ Minister of Religion `Munawir Syadzali` (1983–93) publicly expressed his concern\
    \ that Muslim parents still prefer to send their children to public schools or\
    \ Christian schools rather than Islamic schools (*Antara News Bulletin*, 29 October\
    \ 1985), because of the reputation of Christian schools for higher quality education.\
    \ In 1985, the minister for education provided further clarification on religious\
    \ education, reinforcing that every student must attend religious education according\
    \ to their religion (art. 2(2)), and that schools must provide religious education\
    \ for at least two hours per week if there were more than ten students, although\
    \ this did not extend to private schools.\n\nIt was not until 1989 that the entire\
    \ education system was revised through Law 2/1989 on the National Education System.\
    \ This law required schools to provide religious education to equip students to\
    \ understand their religion based on the assumption that every child has a fixed\
    \ religious identity. The significant change here was that religious education\
    \ was given equal status in the curriculum alongside `Pancasila` and citizenship\
    \ (art. 39(2)). The right to education was qualified in the Elucidation to a regulation,\
    \ which stated that schools based on a particular religion were not obliged to\
    \ provide religious education for religions other than the religion of that school.\
    \ This was effectively an exemption for private schools. This qualification was\
    \ significant for Christian schools because it relieved the pressure to provide\
    \ Islamic education for Muslim students. The pressure felt by Christian schools\
    \ was expressed by the Indonesian Christian Council, a division of the Indonesian\
    \ Communion of Churches (Persekutuan Gereja-gereja Indonesia, PGI) which develops\
    \ the curriculum for Protestant religious education. It went to great lengths\
    \ to emphasize that the regulations passed in 1990 did not require religious-based\
    \ schools to provide religious education different from the religion on which\
    \ the school was based, thus justifying the absence of Islamic education in Christian\
    \ schools (Sairin, 2006a: 87).\n\nThe Indonesian Ulama Council, however, maintained\
    \ the position that Muslim children should not attend a school that does not provide\
    \ Islamic education. This view was expressed by participants at the National Working\
    \ Committee in 1984, which noted that `children who follow one religion but attend\
    \ a school based on another religion still need to have the opportunity to learn\
    \ about their own religion` (MUI 1995: 126). This is a reference to the large\
    \ number of Muslim students who attend Christian schools. This opinion was again\
    \ expressed at the National Working Committee in 1990 (MUI 1995: 73), and has\
    \ persisted since 1998, as I will demonstrate in Chapter 5.\n\nGovernment policies\
    \ on religious instruction since independence have gradually shifted from an emphasis\
    \ on the rights of the parents to choose whether their child participates in religious\
    \ education, to compulsory religious education post-1965 due to Muslim concerns\
    \ over communism and Christianization. In the 1980s, this sectarian model where\
    \ students only learn the teachings of their religion was further reinforced.\
    \ Another area that became the subject of government policy and sanction after\
    \ independence is the criminal offence of insulting a religion.\n\n## The crime\
    \ of insulting a religion\n\nIn January 1965, the offence of ‘insulting a religion’\
    \ was established through a decree of President Soekarno. Four years later, the\
    \ decree was strengthened and made into a statute (`undang-undang`). This formed\
    \ part of a broader government agenda after 1965 to encourage all citizens to\
    \ choose one of the six religions. This promoted the idea that citizens should\
    \ have a fixed and bounded religious identity that could be monitored and controlled\
    \ by the state. This law ensured religious leaders could protect the status and\
    \ interpretation of the six religions. The Blasphemy Law is brief and yet wide\
    \ in scope, with just four key provisions. The first three provisions aim to protect\
    \ the six recognized religions and prevent any ‘deviations’ from the established\
    \ teachings of these religions. Article 1 contains a prohibition on publicly interpreting\
    \ a religion or conducting religious activities that deviate from the tenets of\
    \ the six religions. This allows the six religions to set boundaries on what is\
    \ ‘official’ doctrine and to have the final, authoritative say on interpretations.\n\
    \nThe Minister of Religion, the Attorney-General and the Minister of Home Affairs\
    \ can issue a joint decree to warn a person who has violated article 1 by promoting\
    \ deviant teachings (art. 2). If a violation is committed by an organization or\
    \ `aliran kepercayaan` (mystical belief), the president has the power to ban the\
    \ group on the recommendation of these three authorities. What constitutes ‘deviancy’\
    \ is not defined in the law, though I will show that in practice it is the national\
    \ religious councils that claim the authority to determine what is ‘deviant’.\
    \ Article 3 provides that if a person or organization continues to act in breach\
    \ of article 1, then they can be imprisoned for a maximum of five years. According\
    \ to the Elucidation to the decree, if the followers or leaders of a group stop\
    \ their activities, they cannot be charged. The criminal offence of blasphemy\
    \ contained in article 4 provides for the insertion of article 156a into the Criminal\
    \ Code, as follows:A person who deliberately and publicly expresses feelings or\
    \ acts in a manner that:\n"
  raw: '[1  Introduction](#07_Contents.xhtml_ch1)The initial years of the precarious
    transition to democracy in Indonesia that began in 1998 coincided with some of
    the worst violence between Muslims and Christians in the history of that country.
    Violence broke out across the archipelago, dividing communities according to religious
    affiliation in areas such as Maluku and Central Sulawesi. The arrival of reinforcements,
    particularly radical Islamic groups, from other islands such as Java, escalated
    the conflict in these areas beyond local differences. These civil conflicts tore
    apart neighborhoods and communities that had existed peacefully side by side for
    many years. They resulted in thousands of casualties, and tens of thousands of
    people displaced. These clashes were marked by attacks on places of religious
    significance, such as churches and mosques.At the same time as these conflicts
    raged on the peripheral islands of the archipelago, religious minorities on the
    nation’s most populous island, Java, were also the target of brutal vigilante
    action. In the years just prior to the fall of President Soeharto (1966–98), large-scale
    attacks and burnings of churches occurred in cities such as Surabaya and Situbondo
    (East Java), and Tasikmalaya (West Java).¹ At the end of 2000, the Christmas Eve
    services of over 30 churches across Indonesia were shattered by bombings coordinated
    by the radical Islamic group Jemaah Islamiyah, leaving 19 dead (Fealy, 2005b:
    6). Every Christmas since, thousands of churches across Indonesia have been guarded
    by sympathetic local Islamic groups to prevent the risk of future attacks.Islamist
    perpetrators of violence against Christians have rarely been prosecuted, or have
    received light sentences in proportion to their crime, while many Christians perceive
    that violence instigated by Christians against Muslims has been prosecuted more
    earnestly. When such cases proceed to court, they are often highly contested and
    controversial, such as the allegations made against three illiterate Catholic
    farmers from Poso, Central Sulawesi. These men were found guilty of masterminding
    violent attacks against three Muslim villages in Poso in 1999, and were subsequently
    executed in 2006.² The executions went ahead despite legal appeals for presidential
    clemency, calls from Christian political parties and Pope Benedict XVI for the
    case to be retried, and harsh criticism from human rights groups. Their deaths
    led to further protests and demonstrations, as well as triggering incidents of
    retaliation by Christians angered at the perceived injustice of the outcome (*Jakarta
    Post*, 24 September 2006; 2 October 2006).Although the violence in Maluku and
    Central Sulawesi largely died down by 2002, intermittent attacks persist. In October
    2005, for example, three Christian school girls were cruelly beheaded in an attack
    by six Muslim men, one of whom was affiliated with the radical Islamist group
    Jemaah Islamiyah in Sulawesi (*Jakarta Post*, 22 March 2007). Attacks and campaigns
    to close Christian churches persist at a rate far exceeding the number of attacks
    during the New Order (1966–98), particularly in the densely populated, majority-Muslim
    province of West Java. Conflict over church permits further deteriorated in August
    2010, when a pastor and church elder were brutally stabbed by radical Islamists
    in a confrontation over the construction of a Batak church in Bekasi (West Java)
    (ICG, 2010). This series of events indicates that although large-scale violence
    between Muslims and Christians in the *reformasi* era peaked between 1999 and
    2001, sporadic campaigns to close Christian churches or prevent proselytization
    activities continue to occur at the initiation of a minority of Muslims who are
    willing to use violence to achieve their goals.A wide range of factors contribute
    to these violent incidents, from issues of ethnicity, socio-economic disparity,
    religious sentiment and local politics. Yet among these various reasons, the issue
    of proselytization – that is, perceived or real efforts by Christian groups to
    propagate Christianity – has received little attention. Proselytization is often
    a central reason behind religious conflict worldwide (An-Na’im, 2009: 2). The
    lack of attention to this issue is therefore surprising given Indonesia’s religious
    makeup and the history of Muslim-Christian relations.Indonesia is the largest
    Muslim-majority country in the world, and the third largest democratic state.
    The transition to democracy in 1998 was followed by significant legislative reforms
    including amendments to the Constitution that inserted a wide range of international
    human rights, as well as remarkable steps forward politically, with free and fair
    elections. It has led to the affirmation of judicial independence and the establishment
    of freedom of the press. It has seen the notorious ‘dual function’ of the military
    dismantled, with the abolition of seats reserved for the military in the legislature.
    It has also led to the strengthening of non-judicial mechanisms of review of government
    action, such as the National Human Rights Commission, as well as the creation
    of other avenues as a check on the power of government officials, such as the
    office of the Ombudsman. There has also been a remarkable transfer of power to
    the regional level due to a widespread process of decentralization.The change
    brought about by the introduction of democracy and decentralization has opened
    up greater freedom of expression and practice for religious communities. Religion
    is deeply embedded in Indonesian culture, and almost 90 per cent of Indonesians
    follow Islam. The remaining population is 5.7 per cent Protestant, 3 per cent
    Catholic, 1.7 per cent Hindu, 0.06 per cent Buddhist, and 0.01 per cent Confucian
    (Ministry of Religion, 2010b). The state is based on the Pancasila ideology, which
    includes the belief in Almighty God. Officially, the state recognizes and gives
    preferential treatment to six religions (*agama*): Islam, Protestantism, Catholicism,
    Hinduism, Buddhism and Confucianism.³ A range of religious communities and local
    beliefs exist outside the state-sanctioned religions, and there is also great
    diversity within religious traditions (see [Chapter 3](#15_Chapter03.xhtml)).
    In the past, this diversity has been the cause of both social pluralism and conflict.This
    book is about the two major religions in Indonesia: Islam and Christianity. While
    a traditional understanding of the relationship between these communities casts
    the debate as one of majority versus minority, this book seeks to add nuance and
    explore the complexity of this relationship. First, Christians are a majority
    in some parts of Indonesia, while Muslims are a minority in other provinces. Status
    as a minority, therefore, depends on context. Second, Christianity has historically
    occupied a very privileged and central position since independence and many Christians
    exert significant influence in sectors such as the military, the police, politics,
    the judiciary and the legal profession. Even if Christianity is the religion of
    a minority in some areas, at the national level it has enjoyed far greater representation
    due to its recognition as an official religion by the state, in comparison to
    other religious minorities that fall outside the six recognized religions.This
    book primarily focuses on West Java, where Muslims are a majority and Christians
    a minority. Yet the developments in West Java will be situated in broader national,
    historical and social context. The findings of this book are therefore significant
    not only for other areas of Indonesia, but also speak into ongoing debates on
    religion-state relations in countries around the globe. First, it relates to the
    challenge of governments worldwide to accommodate minorities, and to manage religious
    pluralism and diversity. Second, it addresses the issues specific to developing
    and consolidating democracies where, in the absence of a strong state and law
    enforcement agencies, the use of violence threatens to trump the resolution of
    disputes through the legal system. Further, this book focuses particularly on
    the minority of Muslims in Indonesia who support the establishment of Islamic
    law. This is a diverse group, who I will refer to as ‘Islamists,’ or, as they
    are known in Indonesia, *garis keras*, ‘hardliners’ (see further explanation in
    [Chapter 3](#15_Chapter03.xhtml)). A small proportion of this group use violence
    to achieve their goals, who I will refer to as ‘radical Islamists.’ This book
    focuses on this diverse group of actors in order to further understanding of state-religion
    relations and religious plurality in the Muslim world.[Faith in the law? Boundaries
    of proselytization](#07_Contents.xhtml_ch1-1)In Indonesia, it is assumed that
    the two largest religious communities, Christianity and Islam, are missionary
    religions that aim to proselytize (Ricklefs, 2008a: 334). There is no direct translation
    of the term ‘proselytization’ in Bahasa Indonesia. Indonesian Christians often
    refer to the term *misi*, mission, while Muslims use the Arabic term *dakwah*
    (lit. to call). Proselytization includes all efforts to attempt to convert or
    persuade a person to a particular religion and religious community. Proselytization
    can be characterized as any effort towards conversion. Conversion out of Islam
    is, of course, considered to be apostasy (see [Chapter 6](#18_Chapter06.xhtml)).When
    conversion does occur, it has two main consequences. First, conversion implies
    a shift in allegiance from one religious tradition and community to another. Efforts
    to convert a person are also about seeking new members of an institution or community.
    The shift in religious boundaries and membership brought about by conversion potentially
    disrupts religious communities. This destabilizes the role of world religions
    in their capacity to assert ‘authoritative control of identity’ (Hefner, 1993:
    122). Ultimately, conversions between religions threaten the power of both political
    parties and religious leaders in contexts where popularity depends on the favor
    of a stable religious majority. Conversions may lead to the insult of a religion,
    where converts demonize or denigrate the religion they left behind, or challenge
    the teachings of the religion they have entered. As both Christianity and Islam
    are recognized as religions with a missionary agenda in Indonesia, the issue of
    conversions between religions is a cause of real tension and conflict between
    their adherents.Within Islam it is generally considered acceptable for Muslims
    to engage in religious proselytizing (*dakwah*). In the twentieth century, the
    *dakwah* efforts of Muslims worldwide were largely driven by concerns of encroaching
    Christianization (Saeed and Saeed, 2004: 117). Indonesia was no exception. This
    is because conversions from Islam to Christianity are the most common religious
    conversions in Indonesia (Saeed and Saeed, 2004: 115). Christian religious activities
    raise fears and suspicions of a conversion agenda, particularly for Islamists.
    There is a high level of intolerance of conversion from Islam, that is, apostasy,
    which is perceived as a real threat to Islam and to the Muslim community. Nevertheless,
    there are no legal restrictions imposed by the state in Indonesia that prevent
    a person from converting to another religion, unlike in neighboring Malaysia.One
    point of contention that often arises is the motives behind proselytization efforts.
    A basic assumption of many who proselytize is that their religion offers a better
    alternative, implying religious and often cultural superiority. In the context
    of Christian proselytization towards Muslims, it is often taken as suggesting
    or implying that Christianity is somehow ‘better’ than Islam. Indeed, conversion
    from one religion to another involves a conscious rejection of the former religion.
    Conversion from Islam to Christianity may therefore be perceived as the outright
    rejection of Islam (Ricklefs, 2008b: 133). The ultimate goal of proselytization
    – conversion – presents a risk and a challenge to the identity and stability of
    a Muslim community (An-Na’im, 2009: 6).On the other hand, common objections to
    proselytization are often based on problematic assumptions; for example, it may
    be assumed that proselytization is always coercive and cannot occur on equal terms
    because such efforts are only successful if the proselytizers have a material
    advantage over the target group (An-Na’im, 2009: 6). This is partly because of
    the competitive nature of proselytization which, at its extreme, may result in
    a ‘war for souls,’ where mutual defamation occurs and laws are manipulated for
    the religious advantage of the majority (ibid.: 4).In Indonesia, attitudes towards
    Christian proselytization vary both within and between Islam and Christianity.
    Most Indonesian Muslims are not necessarily against Christian proselytization.
    Rather, they contest the kind of proselytization that is permissible or acceptable.
    Two concepts have been increasingly reinforced by government policy since independence:
    the distinction between religions and local beliefs, and the idea of a fixed religious
    identity as a way of preventing conversions between religions (see [Chapter 3](#15_Chapter03.xhtml)).The
    debate over proselytization between Muslims and Christians in Indonesia is focused
    on who is ‘fair game’ for efforts of proselytization and what are acceptable terms
    of engagement. Indonesian Muslims generally argue that a person who already has
    a religion must not be the target of religious proselytization. Since independence,
    Islamists have demanded that Christian proselytization should be limited to those
    who do not yet have a religion – that is, who do not have one of the six official
    religions listed on their national identity card (particularly ‘Islam’). This
    conviction suggests religious affiliation and identity with a world religion such
    as Islam should be relatively fixed, certain and permanent. It also implies that
    once a person enters a religious community, there is little possibility of moving
    to another religion.In addition, Muslims contest and oppose methods of proselytization
    that are perceived to be ‘aggressive’ (*agresif*) or situations where a person
    is suspected of being ‘coerced’ (*dipaksa*) or ‘deceived’ (*ditipu*) into converting.
    Protestant and Catholic Christians are also generally in agreement that deceptive
    tactics should not be used, although the definition of what amounts to deceptive
    proselytization may differ. The concept of proselytization is complicated by notions
    of ‘legitimate’ and ‘illegitimate’ proselytization, which in Indonesia are often
    determined by who the ‘target’ is and the methods used to proselytize. The purpose
    of this book is not to determine what are or should be legitimate forms of proselytization,
    but rather to explore the effects or influence of local understandings and methods
    of proselytization on the regulation of religion in the Indonesian context.The
    perpetuation of suspicions and fears between Muslims and Christians has in part
    been caused by stereotypes of *Kristenisasi* (Christianization). This term is
    generally used by Indonesian Muslims to refer to Christian missionary practices
    or activities that aim to convert Muslims by using unfair methods to prey on vulnerable
    groups, such as children, the poor and the sick. Examples of proselytization methods
    that Islamists cite as ‘deceptive’ include the building of Christian hospitals,
    schools and churches (particularly in Muslim-majority areas), or giving aid or
    material assistance to non-Muslims with the aim of converting them to Christianity.It
    is not just Muslims who oppose manipulative Christianization, but also Protestants
    and Catholics, because these churches often lose members to the newer, independent
    Evangelical and Pentecostal congregations (see [Chapter 3](#15_Chapter03.xhtml)).
    In Indonesia, most concerns over Christianization are in relation to Protestant,
    Evangelical or Pentecostal Christianity, as opposed to Catholicism, which has
    historically been distinguished from Protestantism in Indonesia (see [Chapter
    3](#15_Chapter03.xhtml)). Established Christian organizations seek to distance
    themselves from the ‘aggressive’ practices of newer, evangelical organizations
    in order to maintain good relations with the Muslim community.There will always
    be fear of proselytization between members of Islam and Christianity because a
    key aspect of both religions is a missionary nature. Democracy creates greater
    challenges for religious tolerance, acceptance of pluralism and inter-religious
    relations due to the decrease in government control over religious groups, as
    opposed to authoritarian forms of government. This book focuses on legal responses
    to proselytization because of the increasing importance of legal reforms in an
    era of democratization. It will build on the literature on Muslim-Christian relations
    in New Order Indonesia (1966–98), particularly Ropi (1998), Husein (2005) and
    Mujiburrahman (2008). It is, however, distinctive because it provides an analysis
    of how Islamists oppose proselytization by other faiths, why this opposition has
    increased, and the influence this has had on legal disputes between Muslims and
    Christians.In doing so, it will argue that Islamist responses – including violence
    against Christians, initiating law reform based on Islamic law, and pursuing prosecutions
    against Christians – have been made possible due to the politicization of religion
    under democracy and the decentralization of power to the local level, underlined
    by ongoing, long-held fears Muslims have of Christianization. This affects the
    extent to which the resolution of legal disputes can accommodate religious pluralism.
    It also causes religious minorities to question whether they can have faith in
    the legal system.[Negotiating Muslim-Christian conflict](#07_Contents.xhtml_ch1-2)This
    book examines how Islamists have contested the perceived or real threat of Christian
    proselytization in democratic Indonesia. First, radical Islamists have responded
    with threats, intimidation campaigns and violent attacks on churches they believe
    have violated the law or have overstepped ‘Islamic’ standards of acceptability.
    Second, they have advocated for national and local laws that reflect aspects of
    Islamic law, and have participated in the creation and drafting of Bills, primarily
    through the Indonesian Ulama Council and the Ministry of Religion.A third response
    is that they have instigated investigations, filed reports with police, influenced
    public prosecutors and pressured judges to convict Christians who have allegedly
    committed offences against Islam, such as blasphemy. Radical Islamists have petitioned
    local authorities to cancel building permits for some churches because the construction
    of the church is seen to overstep the boundaries of permissible proselytization.
    Local Islamic religious leaders have also actively lodged criminal allegations
    with the police concerning issues of blasphemy. Combined with the intimidation
    and vigilante tactics of radical Islamic groups, this has contributed to the convictions
    of the accused in court. In cases of judicial review of laws concerning religious
    issues, the judiciary has overwhelmingly upheld the validity of limitations on
    the right to proselytize. The issue of radical Islamic groups taking the law into
    their own hands is not new. There is, however, an increasing process of judicialization
    taking place as groups resort to legal means – via the legislature and judiciary
    – to justify and legalize their position.This book examines how Muslim opposition
    to Christianization has increased since 1998 due to the twin processes of democracy
    and decentralization, combined with an historical narrative of resentment towards
    Christian mission activities. It then focuses on the resolution of legal disputes
    between Muslims and Christians at the local level through three case studies in
    West Java, a majority-Muslim province with a high level of attacks on Christian
    churches. It demonstrates that the courts, independent institutions intended to
    protect the democratic rights of citizens and uphold the rule of law, but which
    have always been weak in Indonesia, are prone to corruption and intimidation by
    radical Islamists at the local level. Trials are vocally supported by demonstrations
    or campaigns by radical Islamic groups during the court hearing. This atmosphere
    of animosity raises questions about the impartiality and independence of judicial
    decisions.In response, many Christians are intimidated in the face of violence
    without the protection of state enforcement agencies and choose not to pursue
    legal action in defense. Others, however, have begun to test the waters of their
    democratic rights by appealing to independent human rights bodies, both national
    and international. Christians have participated in the political process through
    debates, advocacy and political parties. Others have vigorously defended criminal
    allegations, initiated appeals and cases of judicial review of laws or challenging
    the administrative decisions of local governments that they consider to be beyond
    the powers of executive agencies. Part of the motivation for taking such actions
    may be fears of *Islamisasi*. Islamization, however, is understood by Indonesian
    Christians as efforts by Islamists to establish Indonesia as an Islamic state
    under Islamic law. This concept emphasizes the potential threat to religious freedom
    and the fear of being a religious minority under an Islamic state, rather than
    a fear of Islamic *dakwah* efforts to convert individuals. It is largely fears
    and suspicions of Christianization, not Islamization, that have inspired and been
    articulated in government regulations, first under the New Order and, with greater
    frequency, during the *reformasi* era.In assessing the responses of Christians
    since 1998, this book explores why Christians are becoming more active in asserting
    rights and opposing restrictions on proselytization, and what effect this is having
    on the resolution of inter-religious disputes. Central to this book is the dilemma
    of negotiating tensions between the rights of religious communities in a democracy.
    In West Java, Islamists have dominated the agenda and the rights of the Muslim
    majority are being exercised in a way that deprives minorities, such as Christians,
    of their rights. Overall, this book contributes to a deeper understanding of how
    the dynamics of legal disputes between Muslims and Christians are shaped and negotiated
    by the complex issue of proselytization.[Outline of the book](#07_Contents.xhtml_ch1-3)[Part
    I](#13_Part01.xhtml) sets the broader context for this book. [Chapter 2](#14_Chapter02.xhtml)
    begins by examining the historical origins for opposition to Christian proselytization
    in Indonesia and the policies that developed under the New Order. It provides
    a brief overview of the colonial era and the favoritism, real and perceived, that
    colonial authorities showed to Christianity. This chapter then focuses on the
    crucial period of the 1960s, when the perceived threat of communism saw many suspected
    communists, or those who did not adhere to a world religion, convert to Christianity.
    At the insistence of Islamists, the president introduced the criminal offence
    of blasphemy, and the Minister of Religion issued regulations on matters such
    as segregated religious education in schools, permits for places of worship, and
    limitations on religious proselytization.[Chapter 3](#15_Chapter03.xhtml) analyses
    how religious communities and their leaders, particularly Muslims and Christians
    as adherents of the two largest religions in Indonesia, use state processes and
    institutions to reform or introduce laws on religion that apply to all religious
    communities. It argues that efforts at legal reform since 1998 reflect the growing
    fears Muslims have of Christianization – that is, of efforts by Christians to
    convert Muslims to Christianity. By identifying key religious institutions within
    the bureaucracy, it demonstrates how these bodies are being influenced by Islamists
    to advocate policies favorable to their agenda of implementing Islamic law. It
    also looks at one of the most significant changes since decentralization – the
    proliferation of religious regulations at the regional level – and the symbolic
    influence of this trend on legal disputes between Muslims and Christians in West
    Java.In [Part II](#15_Part02.xhtml) this book examines three legal case studies.
    According to former Minister of Religion Taher Tarmizi (1993–98), the potential
    for conflict between religions in Indonesia mainly occurs due to one of the following
    three situations: 1 when proselytization is aimed at gaining converts from adherents
    of another religion; 2 when places of worship are built without permits; and,
    3 when a person insults another person’s religion (Taher, 1997: 16–17). These
    fears – of conversions between religions, of unlicensed places of worship and
    of insults to a religion – are at the heart of the three case studies. These three
    issues are also of central importance to countries across the globe, as they grapple
    with the challenges of religious pluralism.The first case study ([Chapter 4](#16_Chapter04.xhtml))
    raises issues of religious education and child protection. This chapter focuses
    on the introduction of Law 20/2003 on Education and the implementation and interpretation
    of religious instruction policies in both public and private schools. It analyses
    the Indramayu Religious Education Case, in which three Christian religious education
    teachers were charged with deceiving Muslim primary school children to change
    their religion. This is a criminal offence of deceiving a child to change his
    or her religion in Law 23/2002 on Child Protection (art. 86) and is related to
    fears of conversion through religious education. This book provides a fresh analysis
    of the controversy over child conversions and unfair proselytization. It argues
    that reforms to the law and court cases on issues of religious education and child
    protection have validated and further entrenched the fears, stereotypes and suspicions
    Muslims have of efforts to proselytize through Christian schools. This is because
    perceived or real attempts to convert children are seen as a threat to the next
    generation and the future of religious communities more broadly.The second case
    study ([Chapter 5](#17_Chapter05.xhtml)) addresses the regulation of permits for
    a place of worship and the symbolic value of religious buildings as sites of proselytization.
    This book considers the regulation of permits as part of the broader discourse
    on proselytization and accusations of Christianization. It uses the example of
    the Depok Church Permit Case, in which a church challenged a decision of the mayor
    to cancel its building permit. The chapter canvasses the problems related to the
    process to obtain a permit for a place of worship, introduced by the national
    Joint Regulation 8 & 9/2006\. It argues that churches are often sites of conflict
    because they are seen as platforms for Christianization, rather than merely as
    sites of worship and instruction for the Christian community. This has the potential
    to be used by Islamists to destabilize Muslim-majority communities. Permit disputes
    highlight the acute limits of legal mechanisms, in the absence of local political
    will, to protect the rights of religious minorities. This includes both the limited
    influence of the judiciary and non-judicial mechanisms of review.The third case
    study ([Chapter 6](#18_Chapter06.xhtml)) raises issues of conversion, apostasy
    and blasphemy, particularly conversions from Islam to Christianity. This chapter
    examines the specific meaning and application of blasphemy in the Indonesian context.
    While issues of blasphemy and heresy have a long history within Christianity worldwide,⁴
    this chapter centers on contemporary understandings of the offence of ‘insulting
    a religion,’ particularly Islam. This chapter is concerned with cases in which
    Christians have been accused of insulting Islam, such as the Tasikmalaya Apostasy
    Case, in which a Muslim convert to Christianity was convicted for insulting Islam.
    The enforcement of the criminal offence of blasphemy, as set out in article 156a
    of the Indonesian Criminal Code, is linked to cases of conversions from Islam
    to Christianity. It will be shown that prosecutions of Christians for blasphemy
    function like an apostasy law, allowing Islamists publicly to condemn conversions
    from Islam to Christianity.In conclusion, [Chapter 7](#19_Chapter07.xhtml) draws
    together this discussion of law and religion in Indonesia, highlighting how Islamists
    have used legal means to oppose Christian proselytization, and questioning whether
    minorities can assert their rights in fair and impartial legal forums. It demonstrates
    that hostility to Christian proselytization has intensified, taking the form of
    vigilante violence as well as campaigns for laws based on Islam and efforts to
    convict Christians for overstepping the boundaries of proselytization. This is
    because of the greater freedoms and opportunities for religious communities to
    influence law reforms under democracy, combined with a competitive local political
    environment in a decentralized Indonesia. It asserts that real and perceived fears
    of Christian proselytization continue to fuel tension between Muslims and Christians
    in Indonesia. Sporadic campaigns of intimidation by radical Islamists against
    Christians have persisted, laws have been introduced in line with *syariah*, and
    Christians have been convicted and imprisoned for offences against Islam. This
    is because the combination of democratic freedoms, the decentralization of power
    and a history of opposition to Christian proselytization has led to religious
    majoritarianism at the local level, at the expense of the rights of religious
    minorities. Christians have exercised their democratic rights in court but, even
    if a case is resolved in their favor, such decisions have little practical effect
    in the face of state ambivalence towards the vigilante action of radical Islamists
    who disregard the rule of law.Notes1  For an analysis of this religious violence
    between 1995 and 1997, in the lead-up to the transition to democracy, see Sidel,
    2006: 68–105.2  For an analysis of the procedural shortcomings in the investigation
    and trial, see McRae, 2007.3  According to the Elucidation to Presidential Decision
    1/1965 on the Prevention of Misuse and/or Disrespect of Religion (explained in
    [Chapter 2](#14_Chapter02.xhtml)). The explanation to article 1 states: ‘This
    does not mean that other religions or beliefs, such as Judaism, Zoroastrianism,
    Shintoism or Taoism, are banned.’ As long as they do not disturb the community,
    adherents of other religions are also free to practice their religion in principle
    (Ministry of Religion, 2008a: 181–85). As this book shows, however, this right
    is limited in practice.4  There is a large body of scholarship on heresy and blasphemy
    in Christianity, for example, see Levy, 1993, 1981.[Part I](#07_Contents.xhtml_pt1)Context[2  Hostility
    to Christian activities](#07_Contents.xhtml_ch2)Origins and policiesState policies
    on religious affairs are partly a reflection of the struggles and dynamics between
    religious communities in the past. Indonesian Muslims’ attitudes towards Christians
    and Christian activities have been shaped by colonialism and have influenced the
    development of policies on religion under the New Order. This chapter examines
    the links between colonialism and Christianization, particularly through institutions
    such as Christian schools. It questions how and why colonialism raised concerns
    among Muslim leaders that the Muslim community was being unfairly targeted for
    Christian proselytization.After the demise of colonialism, the 1960s became a
    crucial part of this narrative, as the threat of communism and a sense of crisis
    prompted many suspected communists to convert to Christianity. These events motivated
    some Muslims to lobby the government to introduce a series of policies or restrictions
    on religious activities. This chapter demonstrates how Islamists, particularly
    from the Indonesian Ulama Council (Majelis Ulama Indonesia, MUI), successfully
    campaigned for the introduction of policies limiting religious activities under
    the New Order. This included segregated religious instruction in schools, the
    criminal offence of insulting a religion, the regulation of church permits, and
    limitations on religious proselytization. Each of these policies has had a lingering
    impact on the way the government manages religious communities and regulates religious
    affairs.[Colonialism and Christian missions](#07_Contents.xhtml_ch2-1)As in many
    countries, prejudices and stereotypes of Christian proselytization in Indonesia
    are overshadowed by the legacy of colonialism. In the early 1500s, the Portuguese
    were the first Europeans to arrive in Indonesia and with them the Roman Catholic
    Church.¹ In the 1600s, the Dutch took over as the dominant foreign power in Indonesia
    and under its control foreign Christian missionary efforts were initially restricted
    (see generally Steenbrink, 2008). During the entire period of the Dutch East Indies
    Company (Vereenigde Oost Indische Compagnie, VOC, 1602–1799), Catholic workers
    were not allowed (Steenbrink, 2003: 7). In contrast, the Protestant Church was
    one of the departments of the VOC (Klinken, 2003: 9, 13). This had the effect
    of polarizing Protestantism and Catholicism, as noted in more detail in [Chapter
    3](#15_Chapter03.xhtml).Further, up until the 1900s, the Dutch consciously excluded
    Christian mission organizations and workers from areas of the archipelago that
    were ‘economically important or religiously sensitive’ (Nyhus, 1987: 20). This
    sentiment was echoed in reports to the Dutch government arguing for restrictions
    on Christian missions. For example, Governor-General Baud (1883–86) was of the
    opinion that ‘it is in the interests of the Dutch government to restrict the [Christian]
    mission as much as possible.’² This implied that religion, particularly a foreign
    Western religion such as Christianity, was perceived as a force that must be consciously
    controlled in order to maintain and advance political power in a majority-Muslim
    country.Limitations on proselytization were also set out in the Constitution of
    the Netherlands Indies (Regerings-Reglement) of 1854\. According to article 123,
    all Christian teachers, priests and ministers were required to obtain permission
    from the governor-general to work in a particular area (Steenbrink, 2003: 208).
    In addition to permits for all individuals, this policy reinforced the distinction
    between Protestants and Catholics by giving churches exclusive rights to work
    in certain areas (Nyhus, 1987: 20). For example, the island of Flores and the
    provinces of South Kalimantan and South Sulawesi were only open to Catholic missionaries,
    while Sumba (East Nusa Tenggara) and Batak areas such as Tapanuli (North Sumatra)
    were restricted to Protestants (KWI, 1975:25). Klinken (2003: 11) notes that ‘most
    important among the results achieved by these private missions was the large Batak
    Protestant Church.’ Under a policy introduced in 1854, parts of Indonesia were
    divided up into exclusive Christian religious domains, although Protestant Christians
    usually had the upper hand.Despite these formal restrictions, Christian missionaries
    were not only permitted but encouraged and supported by the Dutch colonial government
    to pursue a missionary agenda (Shihab, 1995: 273). Evidence cited for this favoritism
    includes educational advantages, financial resources and other facilities provided
    by the government to Christians (Shihab, 1995: 275). For example, the colonial
    government paid the salaries of some religious leaders, and the disproportionately
    ‘high salaries of Catholic priests and Protestant ministers caused many critical
    remarks from Muslim deputies, who concluded that Christianity was a privileged
    religion’ (Steenbrink, 2007: 6). This stirred feelings of resentment and jealousy
    towards converts to Christianity who enjoyed the same privileges as the Dutch
    and were believed to be ‘protected’ by them (Akkeren, 1970: 113). This led to
    a strong association between Dutch colonialism and Christianity, and those who
    converted to Christianity were seen as belonging to the Dutch, the ‘other side’
    (Boland, 1982: 224).Concerns over foreign and aggressive Christian proselytization
    did not abate after independence from colonial rule in 1945, partly because the
    colonial restrictions on mission no longer applied and arguably led to greater
    freedom for Christian proselytization (Hasyim, 1979: 306). This perpetuated the
    concern that Christianity was competing with Islam for control of the country
    (Shihab, 1995: 246). In the mid-2000s, the Islamic Prosperous Justice Party (Partai
    Keadilan Sejahtera, PKS) blamed missionary efforts under colonialism for inciting
    tensions between religions:The colonial invasion began with the arrival of the
    Portuguese (who brought Catholicism) and the Dutch (who brought Protestantism),
    which caused conflict and local opposition.(PKS, 2007: 162)Apprehension over Christian
    missionary activities and conversions, combined with an awareness of past Christian
    Crusades and European colonialism, produced defensive reactions from radical Islamists
    in Indonesia (Taher, 1997: 116). The former Minister of Religion (1993–98), Tarmizi
    Taher, articulated the consciousness of past injustices committed by Christians
    against Muslims (Taher, 1997: 66):Throughout history, Muslim and Christian (or
    Western) relations have been colored by the fierce battles of the Crusades, Western
    colonial expansion and domination, and bitter rivalry between Christian and Muslim
    missionaries.In particular, he linked the challenges facing Indonesia with the
    broader issues confronting Muslim-majority countries. According to Taher (1997:
    139):There has been much concern in the Muslim world about an aggressive campaign
    to missionize and convert Muslims to Christianity, more so because the campaign
    was seen as funded and backed by foreign powers and the means and methods used
    to preach Christianity were hardly Christian.This agenda was believed to be linked
    to the construction and establishment of organizations such as churches, Christian
    hospitals and schools. The extent to which colonial authorities supported the
    expansion of Christian schools is debated, but clearly by the end of the nineteenth
    century the government openly supported Christian schools.Christian education
    in Indonesia began in the 1540s in the Maluku islands, where Christian teaching
    was intertwined with missionary activities (Kelabora, 1976: 231). The initial
    policy of the Dutch government on religious education during the colonial era
    declared that religion was not to be taught as a school subject in government
    schools, avoiding the issue of religious instruction in public schools entirely
    (Kelabora, 1976: 233). Further, prior to 1890, the Dutch denied requests for subsidies
    by Christian mission schools to avoid attracting any suspicion from the Muslim
    community (Shihab, 1995: 245).The change came in the late nineteenth century when
    the Dutch government began actively to support Christian-based education through
    the provision of funding, which was not available to the same extent for Islamic
    schools (Husein, 2005: 66). For example, between 1936 and 1939, a disproportionate
    sum of money was allocated to Protestant and Catholic schools compared to Islamic
    schools (Saerozi, 2004: 134). Christian schools enjoyed this privileged position
    in Indonesia until the Japanese occupation in 1942 when some private Christian
    schools were forced to close (Sairin, 1996b: 258). Aside from this, the financial
    support of the Dutch colonial government, which also extended to other Christian
    endeavors such as the establishment of hospitals, was perceived to give Christians
    an unfair advantage over Muslims in terms of their ability to attract converts
    to Christianity (Taher, 1997: 36). Christian education and health services were
    unable to be matched by Muslim schools or medical treatment at the time (Noer,
    1973: 23). This led to complaints that ‘Christian missionaries invaded [Muslim]
    areas and converted their children through Western education, which promoted Christian
    values’ (Shihab, 1995: 312).In addition to the provision of funding to Christian
    schools, former Minister of Religion (1993–98) Tarmizi Taher argued that under
    the colonial government, policies were introduced that impeded the development
    of Islamic schools, such as restricting independent Islamic schools and religious
    teachers that Dutch authorities considered difficult to control (Taher, 1997:
    36). Islamic religious leaders were under the close scrutiny of the Dutch authorities
    because they were perceived as a threat to colonial powers (Steenbrink, 2003:
    228).One consequence of the shift in policy was that from 1909 to 1912, Christian
    mission schools in Indonesia increased by 40 per cent (Shihab, 1995: 245). This
    additional support for Christian schools is part of the reason that these institutions
    are able to provide, and have earned a reputation for, high-quality education.
    A Christian education offered a sense of security for parents who were keen to
    send their children to mission schools not only for the education but also for
    other benefits such as medical services (Reid, 1993: 169–70). The popularity and
    high quality of Christian education also means that there has been a disproportionate
    number of Christians represented in the professions and middle class because of
    the advantage Christians gained to higher education and state resources over Muslims
    (Hefner, 2000: 140).In addition, many high-profile Indonesian Muslim parents began
    sending their children to Christian schools. These parents were accused of allowing
    their children to be converted to Christianity, even though many of the teachers
    at these schools were Indonesian Muslims (Noer, 1973: 7–8). One example of a high-profile
    Muslim who attended a Christian school as a child is Hadji Agus Salim (1884–1954),
    who played a prominent role in the creation of the 1945 Constitution and served
    as Indonesia’s foreign minister (1947–49). His parents encountered strong opposition
    from family and friends over the fact that their child Agus Salim attended a Christian
    school, because it was thought that he would convert to Christianity (Noer, 1973:
    7). Noer notes that it was also not uncommon for a *kiai* (Islamic religious leader)
    or group of *ulama* to issue a *fatwa* declaring it *haram* (forbidden) for Muslim
    parents to send their child to a Christian (that is, Dutch) school (Noer, 1973:
    8). Many Muslim parents still send their children to Christian schools today,
    however.It was not only the legacy of colonialism, mission and the establishment
    of Christian schools that raised suspicions amongst Muslim leaders of a Christianization
    agenda, but also the ideological and religious crisis created by the attempted
    communist coup in 1965.[Communism and conversions](#07_Contents.xhtml_ch2-2)In
    the 1960s, pamphlets distributed by Muhammadiyah, the largest modernist Islamic
    organization in Indonesia (see [Chapter 3](#15_Chapter03.xhtml)), claimed that
    Christians had a scheme to Christianize Indonesia. The pamphlets warned of a joint
    conference that took place in Malang and made plans to Christianize Java in 20
    years and all of Indonesia in 50 years.³ Sources are unclear whether the conference
    was held in 1962 or 1963, and some even dispute whether it was held at all.⁴ According
    to Hasyim (1979: 271), the methods the Christian conference participants were
    advocating to achieve this aim include: inter-religious marriage; building churches
    in majority-Muslim areas; financial assistance for poor Muslims; using Arabic
    to relate the Christian message to Muslims; and building Christian schools. Hasyim
    (1979: 274) also claims that in July 1970 another Christian conference took place
    in Magelang (Central Java), where plans were made to ensure a church is built
    in every regency in Indonesia.From the 1950s to the early 1970s, as rumors of
    these pamphlets circulated, there was a significant increase in reported conversions
    to Christianity. Table 2.1 demonstrates that the total number of Christians grew
    from less than 3 per cent of the population in 1933, to almost 8 per cent of the
    population in 1971 and over 9 per cent in 2005\. This growth was particularly
    concentrated in East and Central Java, where an unexpected and unprecedented conversion
    phenomenon to Christianity occurred.⁵Figures relied on by Christians suggest a
    large number of conversions, evidenced by baptism, in a very short space of time.⁶
    For example, in Kalimantan between 1965 and 1974, the Protestant Church baptized
    300,000 people; in East Java from July to August 1966 alone, the East Java Christian
    Church baptized 10,000 people; and from 1966 to 1967, the Karo Baptist Protestant
    Church recorded 26,000 baptisms (Barrett, 2001: 382–84). Hefner captures the reaction
    of shock and disbelief in the Muslim community by noting that ‘the Muslim leadership
    was caught off guard by this rapid Christian advance’ (Hefner 2000: 108). These
    reported conversions have, however, been criticized or discounted as overnight
    and temporary. Others, such as Catholic priest and scholar Father Frans Magnis-Suseno,
    claim that the growth was more incremental and long-lasting, at least in the Catholic
    Church, which requires a person to undergo a training course before they can be
    baptized into the church.⁸*Table 2.1* Indonesian population according to religion⁷![Image](Images/4.jpeg)Overall,
    there appears to have been significant growth in the number of Christians (both
    Catholics and Protestants) from 1930s to 2000s. Numerous reasons have been offered
    to explain these large-scale conversions. First, many converts are believed to
    have been former communists who wished to deny any former association with communism
    after the attempted communist coup in 1965 and the banning of the Indonesian Communist
    Party in 1966 (Aritonang, 2004: 365). In the 1960s, the Indonesian Communist Party
    was the biggest communist party aside from China and Russia (Sihombing, 2008:
    28–30). After 1965, even association with communists led to arrest, imprisonment
    or even death.⁹ One of the reasons communists, and Chinese Indonesians, turned
    to one of the world religions is because a lack of religious affiliation raised
    fatal suspicions that a person may be connected with communism. For example, if
    a village did not have a mosque or a church, then it was at risk of being suspected
    of being communist.^(10)The government was at the forefront of a public campaign
    against communism and in favor of religion, encouraging atheists and animist believers
    to adopt one of the world religions (Smith-Kipp, 1995: 876). The approach of the
    government was essentially that ‘the making of believers was the unmaking of Communists’
    (Thomson, 1968: 8). This policy was evident in government rhetoric. In the late
    1960s, President Soeharto encouraged the people of Indonesia to embrace a religion,
    ‘otherwise we will give PKI [the Indonesian Communist Party] the opportunity to
    grow again,’ and he appealed for help from established religions to ‘unite against
    PKI’ (Presidential Speech, 1968: 29–32; 1969: 7–8). The inherent danger of being
    associated with communism, combined with changes in government policy on matters
    of religion, ‘drove millions of Indonesians to seek refuge in religious identity,
    institutions and faith to avoid fatal charges of atheism …’ (Sidel, 2006: 51).
    The pressure on Chinese Indonesians to adhere to a religion was particularly acute.
    For example, Fox (1980: 243) links the significant number of conversions that
    took place in Kupang (East Nusa Tenggara) to a military officer in Kupang who
    ‘instructed the Chinese that they had two weeks to choose a religion.’ It was
    in this atmosphere of crisis that many former communists converted to Christianity
    in the face of death.Aside from the fears of former or suspected communists who
    wished to avoid being the subject of attack, a second reason offered for these
    mass conversions is that ‘churches offered protection to those who had been suspected
    of involvement in Communist activities’ more so than Muslim communities (Shihab,
    1995: 304). The church became a shelter or haven for communists. The sympathy
    extended to suspected communists by Christians was crucial for many families that
    were torn apart by the violence against suspected communists (Hefner, 2000: 108).
    By contrast, Muslims were generally hostile towards ex-communists and Islamic
    organizations such as Nahdlatul Ulama (NU) were involved in orchestrating the
    violent attacks and mass killings of communists.^(11) In particular, the West
    Java branch of MUI actively participated in the arrest, detention and killings
    of communists after 1965 (Mufrodi, 1994: 92).Religious organizations also received
    some assistance from the government in spreading their teachings. For example,
    in the 1970s, the Ministry of Religion sponsored the efforts of the national Protestant
    and Catholic councils to distribute magazines and *paket dakwah* (lit. proselytization
    packets) to prisons, where many suspected communists were detained. In particular,
    the government sponsored efforts to distribute thousands of brochures and *paket
    dakwah* to political prisoners (*tahanan G30S/PKI*) detained in Tapol Pulau Buru
    (South Maluku); and RPC Cipinang and RPC Bukit Duri, both prisons in Jakarta (Presidential
    Speech, 1973: 455–76; 1976: 597–614; 1977: 648–67). The national Protestant Council
    also helped former communists reintegrate into the community once they were released
    from jail and these ex-political prisoners often converted to Christianity in
    the process (Aritonang, 2004: 413). Many churches were also at the forefront of
    efforts to care for the widows and orphans of political prisoners, providing material
    aid and shelter (Thomson, 1968). Churches were criticized, however, for their
    lack of public protest against the killings that took place (Webb, 1986: 110).In
    addition to practical assistance provided by the church, some Christian accounts
    also attribute these conversions to spiritual occurrences such as miracles (Willis,
    1978). Not all conversions were the direct result of the efforts of churches,
    practical or miraculous. During this period, there are stories that some people,
    and in some cases entire villages, proclaimed themselves Christian without previous
    contact with any Christians (Boland, 1982: 232).These conversions may also have
    been the result of a third contributing factor – that is, the new government policies
    on religion that were introduced, which reinforced the fixed nature of religious
    identity. Such strategies formed part of Soeharto’s agenda of maintaining political
    power by containing sensitive issues, such as religion. This policy was exemplified
    by the use of the acronym ‘SARA’: ethnicity (suku), religion (agama), race (ras),
    and inter-group relations (antargolongan). These were prohibited as matters for
    discussion under the New Order (Taher, 1997: 30–31). Partly in response to these
    developments, the Soeharto government began to consider and introduce various
    policies on religion, including on religious education, criminal offences against
    religion, permits for churches and guidelines on the boundaries of proselytization.[Segregated
    religious instruction](#07_Contents.xhtml_ch2-3)One area in which government policies
    on religion divided religious communities is education. In 1946, the Ministry
    of Education set up an Education Commission to design a new national education
    system for Indonesia. One of its responsibilities was to address the issue of
    religious instruction in schools (Kelabora, 1976: 238). The outcome of the Commission’s
    investigation was a new law, which included the following policy on religious
    instruction in public schools: ‘Religious instruction shall be provided in government
    schools and parents shall decide whether their children are to attend such instruction’
    (art. 20(i)).^(12)This meant that religious education was to be provided in all
    public schools, though it did not apply to private schools, and participation
    was optional, depending on the wishes of the parents. This enshrined a sectarian
    approach to religious education in Indonesia – that is, children were separated
    according to religion and given instruction according to their religion. A Joint
    Regulation of the Minister of Education and the Minister of Religion^(13) further
    clarified that religious education only need be provided by a school if there
    were at least ten students of that religion (Taher, 1997: 60).In 1950, due to
    concerns that Muslim children were not receiving Islamic education, the Minister
    of Religion and the Minister of Education and Culture issued a letter to public
    schools instructing them to provide Islamic education (Adams, 2004: 141). By 1960,
    concerns that Muslim children in Christian schools were being ‘forced’ to learn
    about Christianity were addressed by the People’s Consultative Counsel (Majelis
    Permusyarawatan Rakyat), which decided that parents can choose for a child to
    opt out of religious education classes.^(14)In 1966, the government issued a decision
    that made religious education compulsory for all students.^(15) This decision
    specifically deleted the previous provision which provided that parents can choose
    for their child not to participate in religious education, and replaced it with
    the sentence ‘religious education is a compulsory subject in all schools, from
    primary school through to university.’ This decision effectively nullified the
    right of parents to withdraw their child from a religious education class and
    forced parents to identify their child as ‘belonging’ to one of the six religions.Throughout
    the New Order, Islamists sought to restrict the perceived influence Christian
    schools had exerted over Muslim students since colonialism. In 1967, an inter-religious
    conference (explained further below) debated the issue of religious education.
    According to Hasyim, the Muslim delegates expressed concern that ‘if Muslim children
    attend a Christian school, they will be tricked into becoming Christian because
    they are easily deceived,’ although the Christian delegates disagreed (Hasyim,
    1979: 279). Differences of opinion between Muslims and Christians on this issue
    continued.In March 1975, in a speech at the Commemoration of the Birthday of the
    Prophet Muhammad in Jakarta, President Soeharto declared that: ‘In the implementation
    of religious education, it is best to provide religious education for each religion’
    (Krissantono, 1976: 37). He emphasized that religious education was necessary
    not only in public schools at all levels, but also in private education institutions
    (Krissantono, 1976: 38). The government continued to warn schools that students
    should not be targets of proselytization. In June 1978, Minister of Religion Alamsyah
    delivered a speech to a group of *ulama* (Islamic religious leaders) in Bandung,
    urging religious schools not to proselytize their students (Hasyim, 1979: 373).By
    the 1980s, almost 20 years after the attempted communist coup and the introduction
    of the new religious education policy, concerns were still being expressed by
    some Muslim leaders anxious about the risk of conversion. In particular, the Minister
    of Religion Munawir Syadzali (1983–93) publically expressed his concern that Muslim
    parents in Indonesia still prefer to send their children to public schools or
    private Christian schools, rather than Islamic schools (*Antara News Bulletin*,
    29 October 1985), because of the reputation of Christian schools for higher-quality
    education. In 1985, the minister for education provided further clarification
    on religious education, reinforcing that every student must attend religious education
    according to their religion (art. 2(2)), and that schools must provide religious
    education for at least two hours per week if there were more than ten students
    of that religion, although this did not extend to private schools.^(16)It was
    not until 1989 that the entire education system was revised through Law 2/1989
    on the National Education System.^(17) This law required schools to provide religious
    education to equip students to understand their religion based on the assumption
    that every child has a fixed religious identity. The significant change here was
    that religious education was given equal status in the curriculum alongside the
    Pancasila and citizenship (art. 39(2)). The right to education was qualified in
    the Elucidation to a regulation, which stated that schools based on a particular
    religion were not obliged to provide religious education for religions other than
    the religion of that school.^(18) This was effectively an exemption for private
    Christian schools.This qualification was significant for Christian schools because
    it relieved the pressure to provide Islamic religious education for Muslim students.
    The pressure felt by Christian schools was expressed by the Indonesian Christian
    Education Council, a division of the Indonesian Communion of Churches (Persekutuan
    Gereja-gereja Indonesia, PGI) which develops the curriculum for Protestant religious
    education. It went to great lengths to emphasize that the regulations passed in
    1990 did not require religious-based schools to provide religious education different
    from the religion on which the school was based, thus justifying the absence of
    Islamic religious education in Christian schools (Sairin, 2006a: 87).The Indonesian
    Ulama Council, however, maintained the position that Muslim children should not
    attend a school that does not provide Islamic religious education. This view was
    expressed by participants at the National Working Committee in 1984, which noted
    that ‘children who follow one religion but attend a school based on another religion
    still need to have the opportunity to learn about their own religion’ (MUI, 1995:
    126). This is a reference to the large number of Muslim students who attend Christian
    schools. This opinion was again expressed at the National Working Committee in
    1990 (MUI, 1995: 73), and has persisted since 1998, as I will demonstrate in [Chapter
    5](#17_Chapter05.xhtml).Government policies on religious instruction since independence
    have gradually shifted from an emphasis on the rights of the parents to choose
    whether their child participates in religious education, to compulsory religious
    education post-1965 due to Muslim concerns over communism and Christianization.
    In the 1980s, this sectarian model where students only learn about the teachings
    of their religion was further reinforced. Another area that became the subject
    of government policy and sanction after independence is the criminal offence of
    insulting a religion.[The crime of insulting a religion](#07_Contents.xhtml_ch2-4)In
    January 1965, the offence of ‘insulting a religion’ was established through a
    decree of President Soekarno.^(19) This law was introduced just prior to the alleged
    attempted communist coup in mid-1965\. Four years later, the decree was strengthened
    and made into a statute (*undang-undang*).^(20) This formed part of a broader
    government agenda after 1965 strongly to encourage all citizens to choose one
    of the six recognized religions. This promoted the idea that citizens should have
    a fixed and bounded religious identity that could be monitored and controlled
    by the state. This law ensured religious leaders could protect the status and
    interpretation of the six religions from criticism through the legal system.The
    Blasphemy Law is very brief and yet wide in scope, with just four key provisions.
    The first three provisions aim to protect the six recognized religions and prevent
    any ‘deviations’ from the established teachings of these religions. Article 1
    contains a prohibition on publicly interpreting a religion or conducting religious
    activities that deviate from the tenets of one of the six religions. This allows
    the six religions to set boundaries on what is ‘official’ doctrine and to have
    the final, authoritative say on interpretations of religion.The Minister of Religion,
    the Attorney-General and the Minister of Home Affairs can issue a joint decree
    to warn a person who has violated article 1 by promoting deviant teachings (art.
    2). If a violation is committed by an organization or *aliran kepercayaan* (mystical
    belief), the president has the power to ban the group on the recommendation of
    these three authorities. What constitutes ‘deviancy’ is not defined in the law,
    though I will show that in practice it is the national religious councils that
    claim the authority to determine what is ‘deviant’ (see [Chapter 6](#18_Chapter06.xhtml)).Article
    3 provides that if a person or organization continues to act in breach of article
    1, then they can be imprisoned for a maximum of five years. According to the Elucidation
    to the decree, if the followers or leaders of a group stop their activities, they
    cannot be charged. The criminal offence of blasphemy contained in article 4 provides
    for the insertion of article 156a into the Criminal Code, as follows:A person
    who deliberately and publicly expresses feelings or acts in a manner that:'
