- fmt: '

    The Indonesian phrase used in the Blasphemy Law is `penyalahgunaan dan/atau penodaan
    agama`, which means to misuse, besmirch or insult a religion. In Indonesia, several
    terms are used by both Muslims and Christians to describe offences, often interchangeably,
    including `penodaan agama` (disgracing a religion); `penistaan agama` (insulting
    or defaming a religion); and `penyalahgunaan agama` (misusing or abusing a religion).
    A person who is accused of blasphemy may be called `murtad` (apostate), `kafir`
    (infidel), `aliran sesat` (deviant group), `sesat` (deviant), or `aliran kepercayaan`
    (mystical belief). The use of these terms reinforces the distinction between mystical
    beliefs and religions (explained in [Chapter 3](#15_Chapter03.xhtml)), and shows
    a concern for protecting the orthodox teachings of a religion.


    The Elucidation to the Blasphemy Law clarifies that the accused must have intentionally
    insulted or shown hostility towards a religion (art. 4). Written or verbal statements
    that are objective and avoid the use of offensive words or phrases are not considered
    to be a criminal offence under this article. The Elucidation justifies the severity
    of the punishment by stating that offenders have disturbed a religious community
    and are considered to have betrayed the state ideology, `Pancasila`, and its first
    element, Belief in One God.


    This provision does not appear to be based on any modern principle of Islamic
    law but this may be because in Islam there is no general agreement on a definition
    of ‘blasphemy.’. In Islam there are several relevant terms including `riddah`
    (apostasy), `sabb Allah` and `sabb al-Rasul` (blasphemy against God or against
    the Prophet), `zandaqah` (heresy), `nifaq` (hypocrisy), and `kufr` (unbelief),
    although no distinction is made between these terms in practice (Saeed and Saeed,
    2004: 36–42). The traditional Islamic penalty for apostasy is death, although
    some scholars have argued that there is no Qur’anic authority for this penalty
    (Saeed and Saeed, 2004: 56, 69–87). Only radical Islamists in Indonesia would
    agree with the implementation of the traditional penalty. Cases of blasphemy are
    explored in greater detail in [Chapter 6](#18_Chapter06.xhtml) and show the increase
    in the number of prosecutions and convictions for this crime.


    The third area that the New Order government came under pressure to regulate was
    the construction of churches.


    ## Church burnings and permits (#07_Contents.xhtml_ch2-5)


    Several churches were destroyed in the 1960s based on allegations that they were
    built in Muslim areas or that Christians had insulted Islam. In April 1967, a
    Methodist church in Melauboh, Aceh, was destroyed (Hasyim, 1979: 291–93). This
    was one of the first major church incidents to become a matter of national debate.
    Known as the ‘Melauboh Affair’ (`Peristiwa Melauboh`), it was reported that objections
    were made to the church because it was built in a Muslim-majority area. The church
    was subsequently rebuilt in a different area.


    Following this incident Simorangkir, a member of the Christian-based political
    party `Parkindo` (see [Chapter 3](#15_Chapter03.xhtml)), initiated a meeting with
    President Soeharto in June 1967 and proposed an `interpelasi` (official question)
    to the legislature (`Dewan Perwakilan Rakyat`) regarding the Melauboh Affair and
    the right to religious freedom (Hasyim, 1979: 293–98). On 10 June, this was countered
    by an `interpelasi` from Lukman Harun of `Muhammadiyah`, supported by members
    of parliament affiliated with Islamic-based political parties, questioning the
    practice of religious organizations receiving foreign funding (Aritonang, 2006:
    128; Hasyim, 1979: 298–308). This implied that the church in Melauboh was built
    through reliance on foreign funds.


    In October 1967, further attacks took place on 14 churches, three schools and
    the office of a Catholic student organization in Makassar, South Sulawesi. Labeled
    the ‘Makassar Affair’ (`Peristiwa Makassar`), this incident was the action of
    Muslim youths who reacted to rumors that a Christian teacher, `H.K. Mangunbahan`,
    had insulted Islam by stating that Muhammad was illiterate, and only married nine
    of his wives and lived in adultery with the others (Hasyim, 1979: 314–20). This
    was an early example of retaliation and vandalism of church buildings as a result
    of perceived insults to Islam (see [Chapter 6](#18_Chapter06.xhtml)).


    Similar to the Melauboh Affair, in 1969 a church in Slipi, Jakarta, was destroyed
    in an area that was already home to five churches that catered for the 350 Christians
    living in the area (Hasyim, 1979: 321–22). In addition to claims that yet another
    church was unnecessary in a Muslim-majority area, complaints were made that the
    church did not have a permit from local authorities. These incidents led to greater
    demands for the implementation of a permit process before a church could be constructed.


    As a result of the national controversy generated by media coverage of these incidents
    and by the questions raised in the legislature, a decree was drafted and implemented
    without consultation with the representatives of the five official religions:
    Islam, Catholicism, Protestantism, Hinduism and Buddhism. On 13 September 1969,
    the Minister of Religion `K Haji Mohammad Dahlan`, and the Minister of Home Affairs
    `Amir Machmud`, officially introduced Joint Decree/1969 to control religious activities
    and the building of places of worship. The aim of this decree was to ensure that
    a religious group had obtained a permit from local authorities, including the
    local government, the Ministry of Religion and local religious leaders, before
    it proceeded to build a place of worship.


    From the beginning many Christians opposed the joint decree. In October 1969,
    the Indonesian Council of Churches (`Dewan Gereja-gereja`, `DGI`) and the High
    Council of Bishops (`Majelis Agung Wali Gereja`, `MAWI`) issued a joint memorandum
    expressing their opposition to the Joint Decree on the basis that it was discriminatory
    and violated the right to religious freedom in article 29 of the Constitution
    (PGI, 2006:6–29). These complaints from religious minorities were countered by
    vocal support from Muslims who kept up a campaign for the decree. Violent incidents
    at churches were used by Muslim leaders as evidence that churches built in ‘Muslim
    areas’ lead to inter-religious violence. The introduction of the joint decree
    in 1969 on places of worship and the ongoing campaign by Muslims to limit Christian
    activity allowed Islamists to garner support for the introduction of regulations
    on proselytization.


    ## Restrictions on missionary activities (#07_Contents.xhtml_ch2-6)


    In 1967, partly in response to Muslim concerns over conversions to Christianity,
    the Ministry of Religion initiated a gathering of religious leaders in Jakarta
    with the intention of establishing an inter-religious council and a mutual agreement
    on the boundaries of missionary activities. This conference was attended by representatives
    from the major social and political religious organizations (Sairin, 2000:97).
    The reason for the conference, as identified by the Minister of Religion in his
    opening speech, was the perceived need for a response to what was described as
    ‘systematic attempts’ by some religions to convert Muslims to their religion,
    an indirect reference to proselytization (Sairin, 2000:205). The government had
    prepared a draft statement that emphasized the need for inter-religious dialogue.
    It contained a provision that all religions would agree not to make efforts to
    convert a person who already had a religion.


    The draft statement was never signed, however because of sharp disagreement between
    Muslim and Christian delegates. The Muslim representatives refused to take part
    in inter-religious dialogue with Christians, but supported a ban on missionary
    activities aimed at people who already had a religion (Mudzhar, 1996:231). The
    Christian representatives agreed to participate in inter-religious dialogue but
    strongly opposed the proposed limitations on proselytization because, in their
    opinion, it would compromise the freedom of Christians to practice their faith
    and propagate their religion.


    As a result, the conference was considered to be a failure and the blame was directed
    at Christians. One newspaper reported the outcome as a ‘deadlock’ and the headline
    identified Christians as to blame: ‘Catholics/Pro reject charter’ (Sairin, 2000:135).
    According to Father Frans Magnis Suseno, a Catholic priest whose friend was the
    English advisor to the president at the time, Soeharto was very angry with the
    national Protestant and Catholic councils because it was the first instance in
    which these councils had directly and publicly opposed the position of his government.
    In a later statement issued by five Islamic leaders, including leaders from `Muhammadiyah`
    and `Nahdlatul Ulama`, blame was pointed at Christians for ‘rejecting the government’s
    idea to stop religious proselytization towards people who already had a religion’
    (Sairin, 2000:206). This was not explicitly based on any religious or Islamic
    doctrine, but was the pragmatic stance of government officials and Islamic religious
    leaders at the time. Professor Maskyuri Abdillah, chairperson of the Inter-religious
    Harmony Division of the Indonesian Ulama Council (2010–15), suggests, however,
    that the idea might be related to the Islamic concept ‘To you be your religion,
    and to me my religion’ (Qur’an 109:6).


    In the 1970s, concerns again surfaced in public debates that Christians were failing
    to respect the ‘boundaries’ of the six recognized religious communities, particularly
    Islam. For example, on 16 August 1974 at a ceremony for the commemoration of the
    Prophet Muhammad’s journey from Mecca to Medina, Soeharto issued a warning to
    all religious organizations: ‘So that the feelings of other groups are not disturbed,
    you must be careful not to direct religious proselytization at people who already
    have a religion’ (Natsir, 1980:31).


    In September 1975, the chairperson of the Indonesian Ulama Council met with President
    Soeharto to discuss the issue of ‘Christianization,’ citing examples such as the
    expansion of Christian hospitals and events designed to convert Muslims to Christianity
    in return for food and other material provisions (Mudzhar, 1996:231–32). Then
    in 1976, a decision of `MUI` highlighted the speeches of several government ministers
    over the previous few years which all emphasized the principle that a person should
    not try to convert someone who already has a religion by offering economic incentives
    (Sairin, 2000:207). In particular, this decision highlighted the imperative of
    not exploiting the weaknesses of the uneducated, the sick or children, and of
    not approaching a person in his or her home. The decision affirmed an earlier
    statement by President Soeharto that ‘proselytization should not be conducted
    towards people who already have a religion’ (Hasyim, 1979:424). There were also
    other complaints made to the police at this time, such as those regarding mass
    distribution of tracts by evangelical Christian organizations in areas such as
    Bandung (Dixon, 1999). These complaints sought to reinforce the original position
    of Islamists and the government at the 1967 conference that proselytization should
    be strictly limited. The agenda to introduce legal regulations that would restrict
    Christian proselytization therefore continued despite the initial failure of the
    1967 conference.


    ## Regulations on proselytization (#07_Contents.xhtml_ch2-7)


    In May 1978, Minister of Religion Alamsyah issued a decision to the effect that
    Islamic `dakwah` activities do not require prior permission from the government.
    This essentially gave free license to Muslims to spread the teachings of Islam.
    Then, in August 1978, the Ministry issued Regulation No. 70/1978 to set out guidelines
    for religious proselytization. This regulation echoes the long-held fears and
    suspicions Muslims have of Christian proselytization. It prohibits religious proselytization
