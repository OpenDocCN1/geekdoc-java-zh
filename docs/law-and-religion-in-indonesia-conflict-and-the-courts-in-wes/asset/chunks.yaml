    Islamic words derived from Arabic are specified with (A).An earlier version of
    some sections of [Chapter 5](#17_Chapter05.xhtml) of the book have appeared in
    Melissa Crouch (2010) ‘Implementing the Regulation on Places of Worship in Indonesia:
    New Problems, Local Politics and Court Action,’ *Asian Studies Review* 34 (December):
    403–19\. Some parts of [Chapter 6](#18_Chapter06.xhtml) of the book have appeared
    in Melissa Crouch (2012) ‘Law and Religion in Indonesia: The Constitutional Court
    and the Blasphemy Law,’ *Asian Journal of Comparative Law* 7(1) (May): 1–46\.
    The case study in [Chapter 4](#16_Chapter04.xhtml) is also discussed in Melissa
    Crouch (2013) ‘Proselytisation, Religious Diversity and the state in Indonesia:
    The Offence of Deceiving a Child to Change Religion, in M. Feener and J. Finucane
    (eds) Proselytising and the Limits of Religious Pluralism in Contemporary Asia.
    Singapore: ARI Springer Asia Series.[Acknowledgements](#07_Contents.xhtml_ack)I
    came to the study of Islam and West Java from the margins. Prior to commencing
    my PhD, I had spent most of my time in Indonesia on the outer islands, outside
    Java. I stayed with Hindus in Bali, Christians in North Sulawesi and North Maluku,
    and Muslims in South Sulawesi and South Kalimantan. I experienced the deep tradition
    of religious tolerance and diversity that runs through the Indonesian archipelago,
    where Christians are commonly invited to Eid celebrations and Muslims attend festive
    Christmas parties. Yet I had also seen the refugee camps of internally displaced
    communities in North Sulawesi and the burnt out ruins of places of worship in
    North Maluku. This was just one indicator of the threat intolerance and violence
    posed in the absence of a strong democratic state. As a lawyer, I questioned the
    role of the law in this context, whether it can help to prevent such situations
    or only exacerbates inter-religious conflict. Along the quest for answers, I have
    perhaps only discovered new questions.This journey, and the book, would not have
    been possible without the generous assistance of many people and the support of
    many institutions. My sincere thanks and appreciation go to my Indonesian host-country
    supervisors. In 2009, Dr Fatimah Husein of the State Islamic University Sunan
    Kalijaga and the International Consortium for Religious Studies based at Gadjah
    Mada University, Yogyakarta, graciously hosted me during my field research. In
    2010–11, Dr Amelia Fauzia of the Centre for the Study of Culture and Religion,
    and Dr Dina Affrianty of the Centre for the Study of Islam and Society (PPIM),
    both of the State Islamic University Syarif Hidayatullah, Jakarta, acted as wonderful
    hosts during my field research.Obtaining my field research visa, a feat in its
    own right, would not have been possible without the generous assistance of the
    Indonesian Consular General and staff at the Indonesian Consulate in Melbourne.
    I am also very appreciative of the assistance of Ibu Fatimah and Ibu Amelia in
    this regard.I am extremely grateful to those who assisted me during my field research
    in Indonesia, and with the transcription of interviews in particular. My thanks
    go to Fatmawati, Sukron Hadi, Sita Maharrani, Evi Agsyana, Sudedi Leman and Rahdiatan
    Tita.I would like to thank the staff at the following institutions for their exceptional
    assistance, patience and administrative support: the Asian Law Centre, the Centre
    for Islamic Law and Society and the Graduate Research Office, all at the Melbourne
    Law School, the University of Melbourne.I am most indebted, however, to my supervisors.
    I am fortunate to have had two exceptional academics as my supervisors and mentors.
    My thanks go to Professor Tim Lindsey for his ongoing support, guidance and critical
    feedback on my work. I am glad he encouraged me to attempt my thesis, and I am
    extremely grateful for the many opportunities he has opened for me. I am also
    indebted to Dr Amanda Whiting for all her encouragement, availability, advice
    and friendship. I appreciate her comparative and interdisciplinary perspective,
    and her attention to detail.Aside from my supervisors, numerous scholars provided
    critical feedback on drafts of the thesis. I am grateful to Professor Abdullah
    Saeed for his comments on an earlier draft of my thesis. I am also indebted to
    Associate Professor Michael Feener for his assistance and insightful comments
    on an earlier draft. Parts of earlier drafts of this thesis also benefited from
    the generous feedback of Professor James Haire, Professor Charles Coppel and Dr
    Kate McGregor. I would like to thank Professor Carolyn Evans for the opportunity
    to explore broader issues of law and religion in different contexts through my
    work on her ARC Discovery Project, and the opportunity I had to present the results
    of my work at the conference on the ‘Legal Regulation of Religious Groups’ at
    the University of Melbourne in June 2011\. I am grateful to the National University
    of Singapore for the numerous workshops at which I had the opportunity to present
    my research and receive valuable feedback on earlier drafts. I am also indebted
    to the valuable comments and suggestions made by my examiners Professor Greg Fealy
    and Professor Gerry van Klinken. I also wish sincerely to thank Professor John
    Witte, Professor Bob Hefner and Associate Professor Anver Emon for their encouragement,
    guidance and assistance in terms of publishing. All errors remain my own.This
    book was financially supported by several generous funds and awards, including
    an ARC Federation Fellowship living allowance scholarship (2008–11); an ARC Federation
    Fellowship travel allowance (2009, 2010, 2011); an Endeavour Award scholarship
    (2009); a travel scholarship to the Asia Research Institute Graduate Conference
    at the National University of Singapore (NUS) (2009); a travel scholarship to
    Asia Pacific Week from the Australian National University (2010); a travel scholarship
    for a workshop on proselytization at the Asia Research Institute from NUS (2009);
    a Leiden travel scholarship to Jakarta for the Indonesian Young Leaders Conference
    (2011); the Melbourne Abroad Travel Scholarship (MATS) (2009); the MA Bartlett
    Research Scholarship Fund (2009); the Melbourne Law School Research Support Funds
    (2010, 2011); and the Melbourne Law School Competitive Grant Funds (2011).I had
    the opportunity to revise the thesis substantially into a book manuscript due
    to the support of two institutions. First, I would like gratefully to acknowledge
    the International Institute of Asian Studies, Leiden, for the visiting postdoctoral
    fellowship I undertook in July to August 2012\. I would also like to thank the
    Law Faculty at the National University of Singapore, which provided me with the
    opportunity to edit my manuscript while I was a postdoctoral fellow in 2012–13.Finally,
    I am grateful to my parents for their generous love and support. I am thankful
    for the wider circle of family and friends without whose support, encouragement
    and friendship the journey would not have been possible.[Glossary](#07_Contents.xhtml_glo)**adat**
    local customs and traditions**agama** religion**aliran kepercayaan** indigenous/local
    belief**aliran sesat** deviant sect**Allah** God (A)**aqidah** correct belief
    (A)**buka puasa** breaking of the fast during the month of Ramadan**dakwah** religious
    proselytizing or Islamic missionary work (A)**ephorus** bishop (leader of Batak
    church)**fatwa** non-binding Islamic legal opinion (plural fatawa) (A)**fiqh**
    Islamic jurisprudence (A)**garis keras** hardliners, that is, radical Islamic
    groups**hadith** a report of the sayings and actions of the Prophet Muhammad (A)**haj**
    pilgrimage to Mecca during the month of Ramadan (A)**halal** permissible (for
    example, halal food) (A)**halus** refined, respectful, polite**haram** forbidden
    (A)**ibadah** ritual worship, acts of devotion or service (also spelt ibadat)**ijtihad**
    independent legal reasoning (A)**iman** faith (A)**Islamisasi** Islamization,
    or efforts by Muslims to introduce and enforce Islamic law through the state**istighotsah**
    a ceremony where Muslims gather together to pray for a particular situation, may
    be part of a demonstration or protest (also spelt istighosah)**jilbab** head covering
    worn by Muslim women (A)**jinayat** criminal punishment (A)**Ka’bah** The small
    shrine near the centre of the Great Mosque in Mecca. It is considered sacred by
    Muslims, who face in the direction of the Ka’bah during daily prayers (A)**kafir**
    unbeliever (A)**kasar** rude, disrespectful**Katolik** Catholic**kepercayaan**
    belief**Kitab suci** Holy book**klenteng** Confucian temple**Kristen** may refer
    to Protestants, or to all Christians (both Protestant and Catholic)**madrasah**
    Islamic educational institution (A)**Mahdi** Messiah (A)**maksiat** social problems
    or immoral behavior (such as alcohol, drugs, prostitution, etc.)**mazhab** school
    of law (A)**misi** mission**mushollah** prayer room (A)**murtad** apostate (A)**Nabi**
    Prophet (A)**Nasrani** Christian, a follower of Jesus of Nazareth (also spelt
    Nazarani)**Negara Islam** Islamic State**padepokan** residence, hermitage**Pancasila**
    Indonesian national ideology**pemekaran** decentralization**pemurtadan** apostasy**pendidikan
