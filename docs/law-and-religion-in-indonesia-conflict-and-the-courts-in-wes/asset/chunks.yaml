    with Aris Wibowo, lawyer for the three women on appeal in the Indramayu Religious
    Education Case, 15 October 2010.60  For an in-depth analysis of the Indonesian
    Constitutional Court and the process of judicial review in its first two years
    of operation, see Butt, 2007.61  According to Law 14/1970 on Judicial Power (Lindsey,
    2002: 260–61).62  Law 24/2003 on the Constitutional Court, art. 47.63  See *Jakarta
    Post*, 18 January 2006; *Kompas*, 18 January 2006.64  Interview with Ruyadi Hutasoit,
    chairperson of PDS, 12 November 2009.[5  Conflict over sacred sites](#07_Contents.xhtml_ch5)A
    crucial part of state-religion relations is whether, and to what extent, a state
    regulates the buildings and property of religious communities. Places of worship¹
    of religious minorities are a highly politicized issue in Indonesia and remain
    a matter of significant concern ten years into the *reformasi* (reform) era. One
    of the main points of contention between Muslims and Christians in Indonesia has
    been applications for permits for a place of worship. This chapter explores the
    Depok Church Permit Case to illustrate the concerns that the construction of a
    church amounts to or facilitates attempts to convert Muslims. The construction
    of a church may be perceived as a symbol of the growth of Christianity and an
    intention to ‘Christianize’ the area. A church may therefore be perceived as a
    threat to a majority-Muslim area. This has led to claims that building a place
    of worship is a form of aggressive Christian proselytization. Most Christians,
    on the other hand, argue that a church building is necessary as a central place
    to worship and practice their religion.This chapter examines the violent responses
    of radical Islamists from sporadic, large-scale attacks to local but more persistent
    campaigns against churches, including petitioning local governments to cancel
    permits. Opposition from these groups influenced the agenda for law reform, which
    implemented a more bureaucratic process to obtain a permit. An analysis of the
    new regulation highlights some of the key problems that have emerged in practice,
    and identifies common underlying reasons for the sustained opposition to some
    churches. Finally, I also explore the reactions of Christian congregations and
    how attempts to assert democratic rights through legal processes have largely
    failed, or victories in court remained hollow. This demonstrates that court decisions
    may have little practical effect in light of threats of violence from radical
    Islamist groups and unwillingness on the part of law enforcement agencies and
    the local government to enforce the court decision. Permit disputes therefore
    highlight the acute limitations of judicial mechanisms of review, in the absence
    of local political will to respect the authority of the courts and the rights
    of religious minorities.[Depok Church Permit Case](#07_Contents.xhtml_ch5-1)In
    May 2009, the Protestant Christian Batak Congregation (Huria Kristen Batak Protestan,
    HKBP) of Depok became one of the first Christian congregations in Indonesia to
    lodge an application with the Administrative Court (Pengadilan Tata Usaha Negara,
    PTUN) in Bandung in relation to its permit to build a church. It sought to challenge
    a decision issued by the mayor of Depok to cancel the permit for the partly built
    church.The history of this permit dispute stretches back ten years. In June 1998,
    the congregation was granted a permit by the mayor of Bogor, Edi Yoso. Four months
    later, in October 1998, the construction of the church commenced. Between 1998
    and 2000, however, the Muslim Solidarity Forum² led by Syamsi Nasution opposed
    the construction of the church.On 9 May 1999, an Islamic prayer ceremony, known
    as *istighotsah*, was held to protest against the building of the church. *Istighotsah*
    is a ceremony where Muslims gather together to pray for a particular situation
    and may be part of a demonstration or protest. According to Nahdlatul Ulama (NU),
    *istighotsah* means *pertolongan* or help and is likened to *tawassul*, that is,
    intercession or drawing near to God (Agil and Fattah, 2008: 3, 8).³ This event
    marked the dispute as religious, as opponents rallied in the name of Islam. In
    addition to the *istighotsah*, the Muslim Solidarity Forum also lobbied the local
    government directly, demanding that construction cease (FSUM, 2009a: 4).As a result,
    on 8 July 2000, the then mayor of Depok, Badrul Kamal, issued a recommendation
    that construction halt temporarily until a further decision of the government.
    This effectively put all construction works on hold. Several years later, in 2007,
    the congregation wrote to the mayor of Depok, Nur Mahmudi Isma’il, on three separate
    occasions, asking for clarification of the status of its permit and for permission
    to continue building. Despite repeated attempts to contact the mayor, he did not
    respond, so the congregation recommenced building. The Muslim Solidarity Forum
    began actively to oppose the building of the church once again, this time under
    the leadership of Budi Waluyo of the local Raya Cinere Mosque. The congregation
    only had time to complete the foundations and the first level of the building
    before opposition from Muslim groups began to intensify. On 26 October 2008, this
    culminated in a second *istighotsah* ceremony held in protest against the building
    of the church, attended by people from six local mosques and some residents from
    the local neighborhood (Administrative Court, 2009a: 36). After the Muslim Solidarity
    Forum trespassed on the land to erect a banner in protest against the construction
    of the church, the church lodged a complaint with the police. On 27 March 2009,
    with no prior warning to the congregation, Mayor Nur Mahmudi Isma’il (who is from
    the Islamic-based Prosperous Justice Party) issued a decision to cancel the original
    permit.This case is highly symbolic because this church is the largest Protestant
    denomination under the national Indonesian Communion of Churches (Persekutuan
    Gereja-gereja Indonesia, PGI). The Batak are also the fifth largest ethnic group
    in Indonesia, with a population of over 6 million in 2000 (Suryadinata *et al*.,
    2003: 48–52). Of these, an estimated 3.5 million are members of the Batak Protestant
    Church (WCC, 2006; Nadeak *et al*., 1995: 5), while many others belong to other
    Protestant denominations. This case is also significant because it is one of the
    first court actions taken by a church against a government authority in relation
    to a dispute over a church permit in Indonesia.The mayor’s decision was based
    on submissions from various government departments and community groups, such
    as the Muslim Solidarity Forum, the local branch of the Ministry of Religion (Ministry
    of Religion, 2008c) and the Inter-religious Harmony Forum (Forum Kerukunan Umat
    Beragama; see FKUB, 2008). The latter is particularly important because the Forum
    is one of the key reforms in the process for obtaining a permit to build a place
    of worship introduced by the Joint Regulation of the Minister of Religion and
    the Minister of Home Affairs 8 & 9/2006 on Places of Worship.⁴ This Forum, which
    exists at the provincial and city/regency level, is responsible for processing
    applications for permits to build a place of worship, facilitating dialogue between
    religions, and assisting in the prevention and resolution of disputes. There was
    disagreement within the Inter-religious Harmony Forum, as the Protestant representative
    believed that the Forum’s recommendation had been misinterpreted and used by the
    mayor to legitimize his decision.⁵On 6 May 2009, represented by current national
    leader, Bishop Bonar Napitupulu,⁶ and the church pastor, Bishop Mori Sihombing,
    the church filed a case in the Administrative Court of Bandung challenging the
    decision of the mayor to cancel the building permit. During the court hearings,
    demonstrations demanding the closure of the church were held by people wearing
    clothes bearing the words ‘Front Pembela Islam’ (Islamic Defenders Front, FPI)
    took place outside the court. While the Muslim Solidarity Forum denied links to
    FPI, members of FPI had attended a meeting at a local mosque in 2007 and agreed
    to support the Forum as coordinators of the opposition movement against the church.⁷On
    29 October 2009, the Administrative Court held that the church had obtained its
    permit legally under Joint Decree 1/1969 on Places of Worship,⁸ and that the building
    also fulfilled the requirements of national and local building laws. The court
    found that the church was not misusing the permit, which is the only legal ground
    on which a mayor could legitimately cancel a permit. On this basis, the court
    ruled in favor of the church.The mayor appealed to the Jakarta High Administrative
    Court and lost, and then to the Supreme Court, which held that it did not have
    the jurisdiction to hear the case.⁹ In October 2010, the building of the church
    recommenced, but cautiously, due to continued threats of attack. This is because
    the church still experienced opposition at this time, evident from banners that
    were erected outside the church property. For example, a banner outside the church
    property in November 2010 read:Since 1982, the people of Cinere and the surrounding
    community have rejected HKBP. The Decision and Letter of the Bandung Administrative
    Court and the Jakarta High Administrative Court offends the Muslim Community of
    Cinere. Religious matters are not local matters but national and global. Legal
    authorities and the government must take firm legal action before the community
    takes action.The banner carried with it the threat that if the government did
    not act to stop the construction of the church, ‘the community,’ presumably sympathizers
    of the Muslim Solidarity Forum, would take the law into their own hands.One of
    the key issues at the heart of the Depok Church Permit Case is the issue of ‘Christianization,’
    or Christian proselytization. The Muslim Solidarity Forum suspected that the construction
    of the church was a means of ‘Christianizing’ the area. The leader of the Muslim
    Solidarity Forum, Budi, stated in a letter that ‘this is obviously an effort at
    Christianization’ (FSUM, 2009a: app. 24). Further, in September 2008, at a meeting
    with the local government, the leader of the local Indonesian Ulama Council (MUI)
    was quoted as saying that ‘the Muslim community is afraid of this Christian [*Nasrani*]
    movement.’ Many informants, both Muslim and Christian, denied these claims, because
    the church is generally regarded as catering for the majority-Christian Batak
    community, and therefore not actively seeking converts from the non-Batak community.
    There is also an obvious language barrier if non-Batak people attend the church
    because services are primarily conducted in a Batak dialect (rather than one of
    the languages spoken by the majority of Muslims in the area – Indonesian, Javanese
    or Sundanese). Nevertheless, the motives of the church remain contested, and threats
    continue to be made against the church.Such fears of ‘Christianization’ fuel motivations
    behind the increasing number of attacks by radical Islamic groups on churches
    since the late 1960s. A large proportion of these attacks have occurred in the
    province of West Java primarily against Protestant, Pentecostal and Evangelical
    (rather than Catholic) churches.^(10) There has also been opposition to the construction
    of mosques in majority-Christian areas, as well as attacks on mosques of groups
    considered to be ‘deviant,’ such as Ahmadiyah (see Crouch, 2009a). In addition
    to acts of violence and intimidation campaigns, some Islamists are responding
    to the perceived threat by demanding tighter regulation of the permit process.
    In 2006, this culminated in the introduction of national Joint Regulation 8 &
    9/2006 on Places of Worship. Implementation at the regional level has been mixed,
    however, as the transition to decentralization has seen local authorities manipulate
    conflict over churches as opportunities for political gain in the highly competitive
    political atmosphere. In order to appear responsive to the demands of the Islamic
    constituency, some local government leaders have cancelled existing church permits,
    particularly in West Java, prompting churches to bring cases to court.[Opposition
    to churches](#07_Contents.xhtml_ch5-2)The destruction or forced closure of churches
    in Indonesia dates back to the establishment of churches by Christian missionaries
    in the 1600s (Aritonang, 2004). Some of the first churches built in Java by Indonesian
    Christians were later burnt down (Ricklefs, 2008b: 117). These churches were the
    result of the work of Kiai Sadrach, a convert to Christianity who combined Protestantism
    with Javanese culture in a manner often unacceptable to European missionaries.^(11)
    Sadrach’s followers met with such opposition that between 1800 and 1884, all the
    churches they had built were burnt down. Although such incidents are evidence
    of attacks on churches prior to the 1900s, the more common starting point for
    accounts of attacks on churches in Indonesia is the 1960s.^(12)Violent reactions
    from radical Islamists to perceived efforts of Christian proselytization via church
    building, as evident in the Melauboh Affair and the Makassar Affair (see [Chapter
    2](#14_Chapter02.xhtml)), led to the introduction of the Joint Decree on permits
    in 1969\. Administered by the Ministry of Religion, the Joint Decree gave the
    mayor or regent the responsibility to oversee and monitor religious activities
    to ensure religious communities did not disturb public peace and order (art. 2).
    To obtain a building permit, a religious community was required to obtain permission
    from the mayor or regent. In making his or her decision, the mayor/regent would
    consider the opinion of the Ministry, the plans of the proposal and ‘local conditions,’
    which could include consultation with religious leaders (art. 4). Rather than
    providing clear guidelines for those who wished to apply for a permit to build
    a place of worship, the Joint Decree left the application process to the discretion
    of local authorities, who could consult with religious leaders if desired. It
    was also silent on the cost or fee to obtain a permit, which was determined by
    local authorities. The Joint Decree was deliberately vague, with only six brief
    provisions, and designed to ensure the government maintained unrestricted power
    to control applications for the construction of places of worship. This Joint
    Decree was a convenient tool of political control for the New Order government,
    while also pandering to the insistence of Islamists that churches must be controlled
    through a permit application process.The Joint Decree applied to all religions,
    although it was not always followed. Mosques have been built without official
    permission or, if they do obtain a permit, the process may be easier in Muslim-majority
    provinces, while in Christian-majority areas the process is easier for churches.
    Muslim minorities also face challenges to build a mosque in the Hindu-majority
    province of Bali, the Christian-majority province of Papua, or the Christian-majority
    province of East Nusa Tenggara. The Joint Decree therefore affected all religious
    minorities, depending on the context. In particular, Christians faced increasing
    challenges in West Java as government authorities were reluctant to grant permits
    for fear of a negative reaction from the Muslim constituency, and often never
    responded to applications for permits.Despite these difficulties, there was still
    a significant increase in the number of places of worship in Indonesia under the
    New Order, including churches. In 1974, there were 387,720 mosques, 16,690 Protestant
    churches and 4,085 Catholic churches (Ministry of Religion, 2007c). By the end
    of the New Order (1998), 24 years later, the number of mosques had almost doubled
    to 609,774, the number of Protestant churches had nearly doubled to 31,759 and
    the number of Catholic churches had increased more than three times to 14,860\.
    Further, statistics on the ratio between followers and places of worship for 2005
    indicate that the ratio of churches to Christians was 1:521, while the ratio for
    mosques to Muslims was only 1:930\. This means that there is almost double the
    number of churches for the small Christian minority as there are mosques for the
    Muslim majority in Indonesia.The disproportionate growth in the building of churches
    has also contributed to the increase in incidents of violence. Many existing Christian
    congregations, or those that chose to build without obtaining a permit, bear the
    brunt of violent attacks from radical Islamic groups. These hardliners justified
    attacks based on the Joint Decree and argued that action must be taken against
    churches that have not obtained a permit if the government remains ambivalent.
    As a result, during the New Order (1966–98), over 450 churches were burnt down
    or forced to close, either temporarily or permanently (Gultom, 2009a). During
    this period, attacks on churches were particularly concentrated on the island
    of Java. From the late 1990s to the early 2000s, there was a noticeable intensification
    of opposition to churches, and during this period violent attacks were carried
    out at a large number of churches in a single day (Gultom, 2009b).The national
    Protestant Council maintains a running total of the number of churches facing
    difficulties, although it is important to note that the types of opposition or
    resistance varied widely, and only some churches were completely burnt down, while
    other churches may have their premises sealed off or permit suspended temporarily.
    During the 17 months of the Habibie government (1998–99), more than 156 churches
    were destroyed. In the following 21 months under President Abdurrahman Wahid (1999–2001),
    232 churches were opposed or attacked (Gultom, 2009b). Although the number of
    attacks dropped under President Megawati Soekarnoputri (2001–04), 92 churches
    were still destroyed during this time. This corresponds with the containment of
    conflicts in places such as Maluku by 2001, although concerted campaigns of opposition
    to churches by radical Islamic groups continued. During the first term of President
    Susilo Bambang Yudhoyono (2004–09), over 100 Christian churches were attacked
    or closed (Gultom, 2009c, 2009d). Overall, this means that more churches were
    attacked or faced barriers to obtaining a permit in the first ten years of democracy
    than in the entire 30 years of the New Order (1966–98). The opposition was particularly
    acute in the province of West Java. Data from the national Protestant council
    (PGI) record over 200 attacks on churches in the province, or 35.17 per cent of
    all attacks that have occurred since 1998 (Gultom, 2009b, 2009c). This is more
    than double the number of churches that were attacked or destroyed in West Java
    under Soeharto.^(13)This strategy, however, has since been mirrored by some organizations
    such as MUI, which aim to highlight the similar difficulties that Muslims outside
    Java face to obtain a permit to build a mosque. For example, research conducted
    by the Inter-religious Harmony Division of MUI from February to April 2011 found
    that 28 communities had experienced difficulties obtaining permits for a mosque
    in Kupang (East Nusa Tenggara); Bali; North Sulawesi; West Papua and Papua (Yusuf,
    2012: 22–24). The main point of difference, however, is that there is no suggestion
    that these minority Muslim communities face the same threats of violence.The increase
    in intimidation and attacks against Christian churches, particularly in 2004–05,
    led Christians to call for legislative reform because radical Islamic groups were
    citing the regulation to justify their violent actions. Islamists also called
    for reform in the hopes of introducing tighter regulations that would control
    the construction of churches.[Debating the Joint Regulation 2006](#07_Contents.xhtml_ch5-3)Organizations
    such as MUI continued to urge the government to ensure compliance with the Joint
    Decree (MUI, 1995: 146). These demands later gave way to calls to revise and strengthen
    the 1969 Joint Decree at least as early as 1990, although no draft was produced
    at that time (Aqsha *et al*., 1995: 468–69). The primary aim since 1969 has been
    to revise the Joint Decree to tighten and clarify the process to obtain a permit.
    Calls for law reform from all sides gained renewed urgency in 2004 and 2005, when
    attacks on churches in West Java became particularly intense.Finally, in late
    2004, President Yudhoyono instructed the Ministry of Religion to prepare a new
    regulation (*Republika*, 4 December 2004). In September 2005, the drafting process
    for the new regulation began with a meeting between the police, the Ministry of
    Religion, the Attorney-General, the Department of Home Affairs and the Department
    of Justice and Human Rights (PGI, 2006a). This was a significant step in comparison
    to 1969, when no consultations were undertaken with religious organizations regarding
    the drafting of the regulation. Between January and March 2006, consultations
    were conducted with representatives from the six religions (FKUB, 2008: 156).
    The resulting Joint Regulation has been promoted by the government as a compromise
    between the six religions represented at these consultations. The six official
    religions have then disseminated information about the new Joint Regulation among
    its respective members. This sentiment was echoed by many other respondents, particularly
    government officials, who claim that the regulation is a result of the agreement
    between the six religions.Despite the consultation process, the development of
    the new regulation did not take place without opposition. Even though the proposal
    was only for a new ministerial regulation, and therefore did not have to be approved
    by the legislature (Dewan Perwakilan Rakyat, DPR), 42 members of the legislature,
    led by a member of the Christian Partai Damai Sejahtera (Peace and Prosperous
    Party, PDS), filed a petition with the DPR rejecting the draft regulation (*Kristiani
    Post*, 24 March 2006). The proposed Joint Regulation went through several drafts
    before the final version was passed on 21 March 2006.In particular, the Joint
    Regulation 2006 was opposed by the Christian political party PDS, as well as members
    from Partai Demokrasi Indonesia – Perjuangan (PDI-P) and Partai Demokrat (Soefyanto,
    2009: 68–69). There was resistance to the Joint Regulation from religious minorities,
    who argued that the process to obtain a permit is against the Pancasila, human
    rights,^(14) and the right to freedom of religion as contained in the Constitution
    (art. 28E). Further, the Joint Regulation had justified the violent acts of radical
    Islamic groups, while the state failed to protect the places of worship of religious
    minorities or to prosecute the perpetrators of violence.Many agree with the Joint
    Regulation, including the chairperson of Muhammadiyah, Din Syamsuddin, who believed
    that it was necessary to maintain religious harmony (*Jakarta Post*, 31 March
    2006). Radical Islamist groups, such as the Anti-Apostasy Alliance Movement (Aliansi
    Gerakan Anti-Pemurtadan), argued that it should even have the higher legal status
    of a Government Regulation (*Peraturan Pemerintah*) or a Law (*Undang-undang*),
    rather than just a Ministerial Regulation (*Republika*, 13 September 2005).The
    new legislative framework endorsed by the Joint Regulation established a process
    for obtaining permits that was widely supported by Islamists for two key reasons.
    First, the creation of the Inter-religious Harmony Forum effectively created a
    further bureaucratic obstacle for religious minorities to obtain a permit. Second,
    the new process is open to the influence of local religious leaders and the discretion
    of local authorities, which has led to further confusion on how to obtain a permit.The
    Joint Regulation provides greater detail and certainty in the process to obtain
    a permit compared to the 1969 Joint Decree. It has, however, created new problems
    for religious minorities such as Christians, due to the reluctance of local authorities
    to grant a permit in the face of opposition from Islamist groups in West Java.[Role
    of the Inter-religious Harmony Forum](#07_Contents.xhtml_ch5-3-1)Under the Joint
    Regulation, the governor, as head of the province, and the regent or mayor, as
    head of the regency or city, are given responsibility to monitor inter-religious
    harmony. This is based on the common assumption that the Joint Regulation is imperative
    to prevent inter-religious conflict and preserve public order and religious harmony,
    continuing the rhetoric of the Soeharto period.The primary way the Joint Regulation
    seeks to ‘implement’ religious harmony is through the establishment of an Inter-religious
    Harmony Forum (Joint Regulation 2006, art. 8). The Forum consists of representatives
    from each of the six recognized religions in proportion to the percentage of adherents
    of these religions in each province and city/regency (art. 1(6)). For example,
    in 2009, the Depok Forum had one Catholic, Protestant, Buddhist, Hindu and Confucian
    representative; the other 11 members of the committee were Muslims.The Forum has
    several responsibilities, including to conduct inter-religious dialogue; formulate
    policy recommendations; and to educate the community on laws related to religious
    harmony at the regency/city and provincial level (art. 8(1); 9(1)). The city/regency
    Forum has the additional responsibility of providing written recommendations for
    requests to build a place of worship (art. 9(2)). The Forum consists of 21 members
    in the provincial Forum and 17 members in the city/regency Forum (art. 10(2)).
    The members of each Forum are chosen by the Inter-religious Harmony Advisory Council,
    which consists of representatives from relevant government departments (art. 11).The
    Forums are established by regulations of the governor and regent/mayor (art. 12).
    These local regulations outline the tasks of the Forum and the reporting procedures,
    although these are generally along the same lines as the new national regulation.
    The regulations specify the criteria for representatives and the length of members’
    terms, which may vary slightly from region to region. For example, members are
    elected for three years to the provincial Forum of Central Kalimantan, while members
    to the provincial Forum of Yogyakarta are elected for five-year terms.^(15) Other
    regulations establish the Forum in broad terms and do not provide details about
    the criteria for members or the terms of membership.^(16) This has led to discrepancies
    in implementation across Indonesia.In order to provide greater direction for provincial
    governments, a guide for the organization and administration of the Forum was
    created at the Biannual Forum National Congress of 2009.^(17) One of the main
    problems identified at the Congress was that many Forums exist with little or
    no financial assistance from the local government, and therefore do not have offices
    or funding to produce reports. Forum members argue that they require funding for
    a suitable office, to run education campaigns, and to fund publications and reports
    arising from their investigations.The other major complaint from Forum members
    was the lack of guidance on how to deal with situations that are not covered in
    the Joint Regulation. This is perhaps more a question of the limits of responsibility
    or authority of Forum members, as local authorities often expect them to do more
    than their stated role. A particular concern for minorities is the composition
    of the leadership positions on the Forum. For example, during the formation of
    the Forum in Yogyakarta, there was dispute over the election of the vice-chairperson.
    As the chairperson was a Muslim, the Christian representatives sought to elect
    a non-Muslim vice-chairperson, while the Muslim representatives were adamant that
    the position should be held by a Muslim.^(18) Another issue that emerged in areas
    where one religion has a clear religious majority is that the Forum is accused
    of favoring the majority. At times, however, it is the Forum that is the cause
    of complaint among Islamists. For example, in the Depok Church Permit Case, the
    Muslim Solidarity Forum opposing the church staged a protest outside the Forum
    office to express its frustration that the Forum did not recommend that the mayor
    cancel the church permit (FSUM, 2009a: app. 23).Many other organizations have
    criticized the new Forum for being elitist and adding another layer of bureaucracy
    to an already lengthy process (Wahid Institute, 2007b). The criticism is not just
    from religious minorities, but also from within the Muslim community. In a detailed
    investigation of churches in Jakarta, Paramadina Institute (2012) found that the
    Forum has at times hindered, rather than facilitated, applications for church
    permits and has yet to play a significant role in mediating church disputes. Overall,
    reports remain mixed on whether the Forum will assist in the processing of applications
    in the long term,^(19) although there are early indications that it has at times
    been overshadowed and encumbered by religious bureaucracy and crippled by majoritarianism
    in its decision making.[Permit application process](#07_Contents.xhtml_ch5-3-2)The
    Joint Regulation placed new requirements on a religious community to obtain a
    permit to build or renovate an existing place of worship (art. 13–20). The general
    conditions stipulate that an applicant must demonstrate a ‘real need’ for a place
    of worship and have regard to the total number of religious followers at the village
    level (art. 13(1)).^(20) These terms are vague and open to interpretation, as
    is the following provision, which requires that the construction of the place
    of worship must ‘respect inter-religious harmony and not disturb the community’
    (art. 13(2)). The applicant must also comply with the general administrative conditions
    for the construction of a building for ‘religious purposes’ (art. 14(1)). This
    refers to both national and local building laws. A building has a ‘religious function’
    if its primary use is as a place of worship, such as a mosque or *mushollah* (small
    room set aside for prayer), a church or chapel, a Hindu temple (*pura*), Buddhist
    monastery (*vihara*), or Confucian temple (*kelenteng*).If there are fewer than
    60 members of a congregation in the village, then the total number of religious
    followers in the sub-regency, city/regency or province can be relied on (art.
    13(3)). This provision is significant, because it essentially defeats the claims
    of those who argue that a church should not be built because the majority of its
    members do not live in the neighborhood (*rukun tetangga*, RT, or *rukun warga*,
    RW), or sub-regency.The greatest controversy is over the requirement that a religious
    group must obtain the signatures and photocopies of the national identity cards
    of at least 90 members of the congregation and at least 60 ‘local residents’ of
    another religion (art. 14(2)). This is known as the ‘90/60 requirement.’ MUI was
    not satisfied with the requirement, suggesting a higher standard of 200 people
    (Soefyanto, 2009: 75). PGI also disputed the numbers required, claiming they are
    arbitrary, unreasonable and often unrealistic (Soefyanto, 2009: 76). On this basis,
    it suggested a lower threshold of 60/40 signatures (*Jakarta Post*, 20 February
    2006). This requirement of course also presents difficulties for Muslim minorities
    in Christian-majority provinces, such as Papua and East Nusa Tenggara.One of the
    reasons for the fixation on numbers is because of the position expressed in a
    collection of Islamic *hadith* that is well known in Indonesia. In *Bulughul Maram*,
    a *hadith* states that there must be a minimum of 40 people in attendance at the
    mosque for Friday prayers.^(21) Some Muslims in Indonesia may therefore feel that
    other religions, such as Christianity, should also have a certain number of members
    before they can build a church (Soefyanto, 2009: 71).^(22) While other alternative
    explanations have been offered for the 90/60 requirement, such as that it was
    simply the result of a consensus reached among religious leaders in the drafting
    process, this *hadith* may explain why some Islamic leaders express concern when
    a church is built without a significant number of members.In practice, the 60-signature
    requirement is clear and the signatures must come from the local community, *masyarakat
    setempat*. Given that this document must be signed by the head of the village,
    it can be presumed that the signatures must be those of residents who live in
    the village (art. 14(2)(b)). The 90 signatures of religious followers must also
    come from residents from the area.^(23) This is actually a surprisingly low threshold
    given the Indonesian population and the high level of religious affiliation. There
    are indications, however, that some misinterpretations have emerged about the
    application of the new Joint Regulation.The requirement of 90 signatures has been
    subject to various interpretations. When the Depok Forum conducts investigations
    to verify an application, it has found that many listed as ‘local’ members of
    the church do not actually live in the neighborhood of the proposed church building.
    In the opinion of Dr Loedwijk Gultom, a Protestant (and Batak) member of the Depok
    Forum, this means that the church does not meet the 90/60 requirement.^(24) According
    to the Joint Regulation, however, as long as members of the congregation live
    in the same province as the church, this is not a ground for rejecting an application.
    In the Depok Church Permit Case, the Plaintiffs obtained the signatures of over
    100 local residents in the area as evidence of local support to the court, which
    is more than the requirements under the Joint Regulation.^(25) The Muslim Solidarity
    Forum disputed the authenticity of these signatures, claiming they were of people
    who did not live in the neighborhood or village. In response, the church alleged
    that Islamists who held demonstrations against the church in 1999 were not local
    residents but came from organizations such as FPI. In defense, the Muslim Solidarity
    Forum claimed that the majority of its support came from local residents.^(26)
    Whether the local community supports or opposes a church proposal is often hotly
    contested.The final requirement in the application process is that an applicant
    must obtain a written recommendation from the city/regency Ministry of Religion
    and from the city/regency Forum (art. 14(2)). Although these documents were obtained
    by the church in the Depok Church Permit Case, the mayor used the recommendations
    of the Ministry and the Forum to support his decision to cancel the permit. The
    Ministry, along with the Forum, therefore still plays a very significant role
    in determining applications for a permit.The Forum and the Advisory Council were
    to be formed in the provinces and cities/regencies within one year, that is, by
    21 March 2007 (art. 27(1)), although this deadline was not met in many regions.
    The reason that some areas were able to establish a Forum quicker than others
    is because an inter-religious harmony committee already existed in these areas
    and so was conveniently converted into the Inter-religious Harmony Forum. It is
    common for the Forum to be referred to as the Inter-religious Communication Forum
    (Forum Komunikasi Umat Beragama), which is the previous name of these forums,
    rather than the Inter-religious Harmony Forum, which is the name of the new forum.In
    summary, instead of clarifying the process, procedures have become more bureaucratic
    and conflict continues to arise because the underlying issues are not being addressed.[Disputes
    over religious buildings](#07_Contents.xhtml_ch5-4)Despite the introduction of
    the Joint Regulation 2006, attacks and threats of violence against churches in
    Indonesia continued. The building of a church not only symbolizes the presence
    of Christians in the area but also the possibility that Muslims might convert
    and join the church, which implies a potential shift in community identity and
    religious affiliation. In this section, I will analyze the common arguments put
    forward in opposition to the construction of the church, illustrated by the Depok
    Church Permit Case. The same arguments, however, are often used against other
    religious minorities, such as Ahmadiyah, or Muslim-minorities in Christian areas.[Claims
    of territoriality](#07_Contents.xhtml_ch5-5-1)One of the most common complaints
    voiced by Muslims is that Christians should not be allowed to build a church in
    a ‘Muslim area’ – that is, an area with a Muslim majority. This is evidence of
    a tendency to claim territory in the name of Islam for fear of the perceived growth
    of Christianity and of concerns that Christians intend to proselytize or convert
    people in the area. These claims may be justified by reliance on population statistics,
    the religious history of the area, and developments such as the introduction of
    local laws based on Islam.As early as 1965, there were indications of a dispute
    over a church built in the ‘Muslim area’ of Dompu, East Nusa Tenggara (Hasyim,
    1979: 282). In 1969, after the Slipi incident over a church in Jakarta (see [Chapter
    2](#14_Chapter02.xhtml)), Muhammad Natsir (1980: 23), the leader of Masyumi and
    founder of the Indonesian Islamic Preaching Council (Dewan Dakwah Islamiyah Indonesia),
    declared that:Many times the Islamic community has complained to the government
    about efforts to ‘Christianize’ [*meng-Kristen-kan*] Muslims, for example by building
    churches in areas with a Muslim-majority population …In the Depok Church Permit
    Case, the Defense argued that the cancellation of the permit was justified because
    the church was being built in a ‘Muslim area’ (Administrative Court, 2009a: 12).
    In 2008, 90 per cent of the population of Depok identified as Muslim, yet there
    was also a sizable Christian population, 5.35 per cent Protestant and 3.58 per
    cent Catholic (City of Depok, 2009a).Although Depok may have a Muslim-majority
    population, whether Depok was originally a ‘Muslim’ or ‘Christian’ area continues
    to be a matter of debate.^(27) Some Christians claim that the word ‘Depok’ derives
    its name from the first local Christian congregation established in the area.
    In May 1696, a former Dutch East India Company officer, Cornelis Chastelein, purchased
    what is now about 6 per cent of the land of Depok for farming. He brought 200
    slaves with him, who originally came from Makassar and Bali. Chastelein was active
    in spreading the teachings of Christianity and founded the first local Christian
    congregation, known as ‘De Eerste Protestante Organisatie van Christenen.’^(28)
    Between 1699 and 1713, about 150 people in the area were baptized.^(29) In June
    1714, when Chastelein passed away, he left some of his land to the families of
    12 of his slaves who had converted to Christianity (Kompas, 2004: 324).The establishment
    of the first Indonesian ecumenical Christian theological college in 1878 was also
    evidence of presence of the Christian community in Depok (Soejana *et al*., 2008:
    756). Sponsored by several mission societies, the college recruited widely from
    across Indonesia, though a large number of its students were Batak.^(30) In light
    of the history of the area, the chairperson of the Cornelis Chastelein Foundation
    and descendant of one of the 12 families, Boy Loen, claimed that what is now known
    as the city of Depok was originally a Christian area.^(31) On the other hand,
    the MUI of Depok, which claimed to represent groups such as Hizbut Tahrir Indonesia
    (HTI) and FPI, hotly disputed any suggestion that Depok was a Christian area and
    instead emphasized the influence of Islam in the area.^(32) The chairperson of
    MUI of Depok, Ahmad Badruzzaman, did acknowledge the history of Cornelis Chastelein
    in the area, but he claimed that the word Depok is derived from the term *padepokan*,
    which means ‘residence’ or ‘hermitage.’^(33) The claim made by MUI that Islamic
    communities were established in Depok prior to the arrival of Christianity is
    not, however, supported by evidence.One example or evidence of the presence and
    influence of Islamists in an area is *perda syariah* (local regulations based
    on Islam). Although campaigns to introduce *perda syariah* have so far failed
    in Depok, some elements of *syariah* (Islamic law) have been included in local
    regulations. The mayor has issued several appeals (*himbauan*) based on *syariah*
    that forbid the consumption of alcohol, encourage people to only use their right
    hand when they eat or drink, and require civil servants to be able to recite the
    Qur’an.^(34)Christian concerns regarding *perda syariah* are indications of fears
    of Islamization’ – that is, concerted attempts to make Indonesia an Islamic country
    under Islamic law. According to the Protestant representative of the Depok Forum,
    Loedwijk, rumors have circulated among Christians that ‘some people want to make
    Cinere a Muslim area.’^(35) When the church in the Depok Church Permit Case questioned
    mayor Nur Mahmudi Isma’il about his decision to cancel its permit, he emphasized
    the fact that he made the decision as a Muslim and as a representative (and the
    former chairperson) of the Islamic-based political party PKS.^(36) In 2009, he
    was criticized by Christians for introducing a ban on the consumption of alcohol
    in Depok, which some believed was based on Islamic law.^(37) He was re-elected
    in the 2010 elections and served as mayor of Depok for a second term.^(38) Aside
    from claims of territoriality based on majoritarianism, the history of Islam in
    the area, or campaigns to introduce local laws based on Islam, many churches are
    accused of being illegal.[‘*Illegal*’ *buildings*](#07_Contents.xhtml_ch5-5-2)Another
    argument commonly voiced is that a church is illegal because it does not have
    a permit, the permit is invalid, or because it is meeting in a private house.
    The presumption that flows from this argument is that radical Islamists can justify
    their actions to close down ‘illegal’ churches, using violence where necessary,
    if the government is inactive or ambivalent towards such churches.Some churches
    that were established prior to 1969 do not have permits. Post-1969, many churches
    were unable to obtain permits because approval was at the discretion of the local
    government. Some churches temporarily navigated this problem by using private
    houses. This led to new issues, however, as neighbors complained about the noise
    of church services conducted in homes and the difficulties it created in terms
    of traffic and parking. In November 1975, to appease concerns in this regard,
    the Department of Home Affairs issued an Instruction to the governor of every
    province clarifying that private houses should not be used as churches, and urging
    local authorities to enforce this law.^(39) In areas where this was of particular
    concern, such as Jakarta, the governor issued an Instruction reiterating the national
    government’s stance that houses cannot be used as places of worship.^(40) This
    remained an ongoing issue of concern and, in 1995, the Minister of Religion issued
    an Instruction admitting that the 1969 regulation was not being followed and urging
    provincial officials from the Ministry to ‘solve problems created by places of
    worship’ by taking a greater role in the administration process alongside the
    local government.^(41)House churches remain a cause of complaint and some local
    governments, such as in Bandung, have responded by issuing further prohibitions
    on the use of homes as churches (*Compass Direct*, 20 January 2006). Some congregations
    have obtained permission to use a house as a place of worship, only later to have
    permission revoked. For example, Pastor Syaiful Hamzah, a convert from Islam,
    faced opposition to the small church that was based at his home in North Jakarta.
    In 2008 he was granted permission from the Ministry of Religion to run a service
    in his home. Despite this, in September 2008, nearby residents, together with
    village officials, police officers and representatives of the village mosque,
    demanded that he cease holding services at home. He relocated services to a church
    building that had a permit some distance away.^(42)A more common solution is for
    churches to hold services in hotels, high-rise buildings, apartments and shopping
    centers. A church may choose to conduct services in such locations because it
    is easier to get away without a permit in an existing building, the buildings
    are usually owned by Chinese (often Christian) business people who are sympathetic
    to Christians, and there is less chance of complaints in a business district because
    the building is not in close proximity to private housing.A church may also be
    accused of being ‘illegal’ if a permit was not obtained from the current local
    government. In the Depok Church Permit Case, the mayor argued that the church
    did not have the permission of the current local government due to the restructuring
    of the area as a result of decentralization. The region of Depok was first formed
    in 1871, although it was not formalized by a national law until 1981 when the
    government created the administrative city of Depok.^(43) Further restructuring
    took place in April 1999 as part of the national process of decentralization,
    and what was then Depok was combined with some parts of Bogor to form the city
    of Depok.^(44) It was at this time that the sub-regency of Cinere was formed,
    which is where the church in the Depok Church Permit Case is located.In support
    of the mayor’s decision to cancel the permit, the defendant argued that because
    the sub-regency of Cinere was only formed in 1999, and the church obtained the
    permit *before* this time, the sub-regent of Cinere had not had the opportunity
    to consider the application for the permit (Administrative Court, 2009a: 12).
    On this basis, the Defense argued that the permit was not valid and the church
    should be required to apply for a permit under the new system via the relevant
    local authorities post-1999\. The court dismissed this argument, because the new
    Joint Regulation clearly states that permits obtained under the previous regulation
    are still valid. Nevertheless, the argument demonstrates the administrative difficulties
    that arise as a result of decentralization and the division of local government
    administration since 1998.Churches may therefore be considered to be illegal because
    of a lack of a permit, because the church is meeting in a private dwelling, or
    because there have been changes to local government as a result of the process
    of decentralization. One approach is that different church denominations can share
    the one building, which often occurs on a temporary basis, although this assumes
    unity between Christian churches.[Assumptions of unity](#07_Contents.xhtml_ch5-5-3)In
    areas where church buildings already exist, Islamists often argue that there is
    already a church (or several churches) in the area and there is not a real need
    for another one. This is partly because of a lack of awareness or unwilling to
    acknowledge the fragmentation and disunity amongst Christian churches, and the
    independent nature of some church denominations, particularly Pentecostal and
    Evangelical churches.In the Depok Church Permit Case, the mayor argued that there
    was already a large number of churches in the area and so there was no need for
    another church. In fact, Depok has a higher ratio of mosques to Muslims than churches
    to Christians. While only 89.74 per cent of the population is Muslim (City of
    Depok, 2009a), 94.55 per cent of all places of worship are mosques or *mushollah*
    (City of Depok, 2009b). On the other hand, 5.41 per cent of the population are
    Protestant and 5.08 per cent of places of worship are Protestant churches, but
    for Catholics, who make up 3.58 per cent of the population, only 0.3 per cent
    of places of worship are Catholic churches. The relatively high number of Protestant
    churches is perhaps an indication of the large number of denominations and new
    independent churches, such as Evangelical and Pentecostal churches, which are
    usually classified by the state as ‘Protestant’ rather than Catholic.Whether there
    is a ‘real’ need for another church building is debatable and difficult to determine
    given the lack of guidelines in the Joint Regulation. For example, it is unclear
    whether Christians are expected to attend an existing church in the area, even
    if it is a denomination or tradition different to their own. It is already a common
    practice in Indonesia for churches without a permit to hold services in the building
    of another church denomination. For example, in the Depok Church Permit Case,
    church services were being conducted in another church in the area, although the
    building was too small to fit the entire congregation.Muslims who oppose a church
    often claim there is no need for another church as many others already exist in
    the area. This argument, as pointed out by Syafii Anwar, director of the International
    Centre for Islam and Pluralism, highlights a general lack of understanding about
    the denominational fragmentation of Christian churches.^(45) Due to the divisions
    within the Christian community, each Protestant denomination usually has its own
    building. This has led to a situation where there are more churches in some areas
    than mosques.Addressing why these concerns are specific to Protestant, Pentecostal
    or Evangelical churches, as opposed to Catholic churches, Franz Magnis-Suseno,
    a scholar and well-known Catholic priest in Indonesia, emphasized the centralized
    organization of the Catholic Church.^(46) Local Catholic congregations are required
    to obtain permission from the National Catholic Council (Kantor Waligereja Indonesia,
    KWI) in order to build a new church. Permission will only be granted if the congregation
    is a reasonable size, if another Catholic church does not already exist in the
    area and if the church has good relations with the non-Christian local community.
    This ensures accountability and due process for the construction of Catholic churches.
    By contrast, many independent Protestant, Pentecostal or Evangelical congregations
    are not accountable to a higher authority regarding decisions to build a church.
    This means that these congregations often build churches much faster regardless
    of the size of the congregation, with little regard for the existence of other
    churches in the area or of opposition from the local community. Part of the difficulty
    of establishing relationships with the local community is the growing reality
    of urbanization and the problems this creates in terms of local planning issues.[Local
    planning and urbanization](#07_Contents.xhtml_ch5-5-4)Another common concern is
    that a church contributes to traffic congestion, creates parking issues, or is
    located in a crowded urban space. The growth of urbanization, particularly in
    areas of West Java close to the capital city Jakarta, has increased competition
    for, and disputes over, access to land. One example is the conflict over the Christian
    Arastamar Theological College (also known as SETIA) in Jakarta. In 1991, when
    an application for the construction of the college was lodged, 500 local households
    signed a document petitioning the local government to prevent the construction.
    The local government responded by issuing an order to stop construction but, after
    negotiations, the construction was permitted to continue (Aqsha *et al*., 1995:
    474–75). Since the college began, there have been ongoing tensions between college
    students, many of whom are from eastern Indonesia (that is, non-Javanese), and
    local Muslim neighbors (Javanese), as well as radical Islamic groups. The differences
    between students and local residents are therefore not only religious but also
    differences of ethnicity.On 26 July 2008, long-term tensions broke into a violent
    conflict between local residents and students, after allegations that a student
    had stolen a water pump from a local resident (*Jakarta Post*, 1 August 2009).
    The college buildings were substantially damaged, 1,200 students had to be evacuated
    and the campus was closed indefinitely. Yusuf Lifire, administrator of SETIA,
    suspected that the perpetrators were from the radical Islamic group FPI, although
    the instigators were never identified or prosecuted.^(47) Leaders from the national
    religious councils were called in to assist in the process of dialogue, including
    Slamet Effendi Yusuf as a representative of MUI. He downplayed factors such as
    religion or ethnicity, and instead emphasized that local Muslim residents were
    primarily concerned about the campus because of the loud music and the consumption
    of alcohol.^(48)Regardless of the reasons for the conflict, the validity of the
    permit of the college came under investigation. The deputy governor of Jakarta
    suggested that the college move campus entirely, citing the rising cost of land
    as the reason. In 2011, it was reported that the Jakarta Administration Agency
    had acquired the property, and that the seminary had been relocated, without assistance
    from the government (*Jakarta Post*, 3 September 2011).Similar concerns over planning
    and urbanization arose in the Depok Church Permit Case. The area of Depok has
    changed significantly over the years. According to Slamet Effendi Yusuf, board
    member of MUI, Cinere was formerly a very traditional, Muslim community.^(49)
    It has undergone changes over the past few years due to the process of urbanization,
    which gained momentum due to the first national settlement of housing for low-income
    earners (*perumahan nasional*). This is partly because of the establishment of
    the University of Indonesia in Depok in 1987\. From a population of just 240,000
    in 1982, Depok grew to a population of 1.2 million by 1999 (Kompas, 2004: 322).
    This created difficulties when the processing of an application for a permit extended
    over a number of years. For example, Betty Sitorus from the Batak Church explained
    that when the church purchased the land in Cinere it was a rural area with very
    few neighboring houses.^(50) Since then, the area had developed significantly,
    and had become crowded as more people moved into the area. Increasing urbanization
    has also led to greater diversity and pluralism within communities, although ethnic
    differences in particular have been another source of tension.[Ethnicity and foreignness](#07_Contents.xhtml_ch5-5-5)Another
    argument is that a church is too ‘exclusive’ and congregation members keep to
    themselves. This is underlined by the issue of ethnicity, which was one of the
    topics of discussion that were prohibited under the New Order, referred to by
    the acronym ‘SARA’: ethnicity (*suku*), religion (*agama*), race (*ras*), and
    intergroup relations (*antar golongan*). It is also linked to suspicions that
    proselytization may be a cover for a broader goal ‘to legitimize local domination
    or imperialist expansion by foreign powers’ (*An-Na’im*, 2009: 6), for example,
    by Western countries considered to be ‘Christian.’The issue of ethnicity reared
    its head in the courtroom in the Depok Church Permit Case. The mayor argued that
    this incident raised the sensitive issue of SARA and that the construction of
    the church had ‘the potential to create conflict over issues of SARA’ (Administrative
    Court, 2009a: 13, 20–24, 44). This may have been a reference both to religious
    and ethnic differences. The court did not elaborate on this argument, although
    it did refer to the need to maintain the ‘values of the Pancasila’ (Administrative
    Court, 2009a: 50, 57). More generally, there is a persistent stereotype that Batak
    culture is *kasar* (rude, blunt) and aggressive, while other cultures such as
    Javanese are considered to be *halus* (refined, polite) by comparison. Vergouwen
    has captured the particular characteristics that have been attributed to Bataks
    in the following way:It is a singular trait of a Batak’s character to think that
    he is always in the right and as a consequence he will make an issue over the
    merest trifle, fighting over swallows’ feathers, it is called. He is also particularly
    desirous of gaining the victory in a lawsuit as being the most sagacious party;
    he suffers a corresponding shame if he loses.(Vergouwen, 1964: 377–78)Other cultural
    stereotypes that portray Batak culture as opposed to the teachings of Islam include
    that the Batak like to gamble, eat dog and drink alcohol. Although the concept
    of SARA was a creation of the New Order, the fact that it was raised by the mayor
    in court as an argument against the building of a church suggests that ten years
    after the fall of Soeharto it remains an issue of concern.Ethnicity is another
    reason why churches other than Catholic churches are more often attacked. While
    many Catholic churches are a mixture of ethnic groups, there is a greater tendency
    in some Protestant denominations to focus on one ethnicity (implicitly or explicitly).
    The Batak church in the Depok Church Permit Case is one example.^(51) Church members
    identify ethnically as Batak and most services are conducted in the Batak dialect.
    Given that this denomination has churches across Indonesia, including West Java,
    Batak Christians are perceived by many Javanese Muslims as ‘foreigners’ both in
    terms of ethnicity and religion.In part, this is related to the implications of
    government policy of transmigration and the issues this has caused for *putra
    daerah* (literally ‘sons of the area’), that is, locals, in provinces such as
    Papua. There have been disputes in Papua over this issue because of the preferential
    treatment given to indigenous Papuans under special autonomy. For example, if
    an *adat* (traditional) Papuan community claims that the land on which a mosque
    is build is its traditional land, then it can be compulsorily acquired by them.^(52)
    This has been a cause of resentment from the Muslim community in Papua, who are
    largely non-Papuans and have settled in Papua as part of the government transmigration
    program. Transmigration is suspected by Islamists to be one way Christians enter
    a community to begin proselytization. Such allegations were made as early as 1967,
    when some Christian missionaries were accused of working through this program
    in Pasaman by pretending to be Muslims and then on arrival built a church (Ka’bah,
    1985: 37; Rasjidi, 1976: 430–31).Another group often considered ‘foreign’ by some
    Indonesians are ethnic Chinese Indonesians. Of the 5 million ethnic Chinese in
    Indonesia, at least one-third are Christians (Ananta *et al*., 2005: 30). After
    the fall of Soeharto in 1998, anti-Chinese riots broke out across Indonesia (see
    generally Lindsey, 2005: 41–76; Coppel, 2002). Nevertheless, since the introduction
    of democracy, the Chinese community has enjoyed greater freedom to express and
    incorporate Chinese culture within the Christian community, such as the use of
    Mandarin in church services, and the hosting of Chinese-speaking preachers from
    overseas (Soleiman and Steenbrink, 2008: 904, 917). Another cause of resentment
    towards Chinese Indonesia Christians is their perceived wealth and the prevailing
    stereotype that there is a socio-economic gap between Christians (who are considered
    ‘rich’) and Muslims (who are considered ‘poor’). Perceptions of Christians as
    ‘foreigners’ is reinforced by the belief that churches receive large amounts of
    foreign funding, creating an economic gap, as I explain next.[Economic disparity
    and corruption](#07_Contents.xhtml_ch5-5-6)Underlying disputes over church permits
    are often feelings of jealousy or envy towards wealthy church members, and the
    real or perceived economic disparity between Muslims and Christians. Churches
    are envied for the seeming ease with which they obtain funds to be able to purchase
    land and build a church (often, it is said, through reliance on foreign donations).
    There is also the stereotype that Christians, particularly Chinese Christians,
    drive expensive cars to church while Muslims walk or ride a motorbike to the nearest
    mosque although, in reality, many Muslims also own cars while many Christians
    can only afford motorbikes.One reason that Chinese Indonesian churches are attacked
    or opposed is because of their perceived wealth. A common myth is that the Chinese
    control 70 per cent of the Indonesian economy although, according to Chai and
    Roy (2007: 64), this claim is difficult to substantiate and certainly not all
    Indonesian Chinese can be considered ‘wealthy.’ Nevertheless, there has clearly
    been a growth of rich, often charismatic or Evangelical, churches that endorse
    the prosperity doctrine, a belief that God will bless His followers with material
    possessions (*Time* magazine, 26 April 2010). This growth can in part be attributed
    to the attraction the message of material success has for wealthy or middle-class
    Chinese Indonesian Christians.Although Christian congregations generally struggle
    to meet the permit requirements, it appears less difficult for wealthy, Evangelical
    (often Chinese) churches in major cities, such as Jakarta. For example, in September
    2008, a new Christian mega-church opened in Jakarta, perhaps the largest Chinese
    Christian Evangelical facility in the world, and the largest state-of-the-art
    classical music center in Indonesia (*Jakarta Post*, 19 October 2009). The church
    is led by well-known Chinese Indonesian Pastor Stephen Tong.^(53) Tong founded
    the Indonesian Evangelical Reformed Church in 1989, a denomination he invented
    based on his own unique theology, a blend of Reformed theology or Calvinism, with
    an evangelical focus on the Bible.^(54) It took 16 years for the Evangelical Reformed
    Church to be granted a permit to build the $27.3 million, 4,500-seat Millennium
    Cathedral.^(55) The executive director of the Reformed Centre of Religion and
    Society, Benyamin Intan, claims that the church obtained the signatures and approval
    of 200 local residents.^(56)This church is indicative of a broader phenomenon
    of the establishment of large Pentecostal and Evangelical mega-churches. Given
    the large number of small churches that continue to be harassed or closed by radical
    Islamic groups, particularly in West Java, this provides fuel to accusations that
    wealthy Evangelical churches bribe local officials in order to obtain a permit.
    In contrast, churches that are forced to close or are unable to obtain a permit
    are those that refuse, or cannot afford, to pay the necessary bribes. Coupled
    with this is the presumption that churches receive funding from outside Indonesia
    and, by inference, are part of foreign interference in domestic affairs. It is
    also perceived as an ‘unfair’ advantage if a church receives foreign funds, and
    there are fears that this amounts to interference by Western, secular and/or Christian
    churches and governments in Indonesian domestic affairs.Finally, allegations of
    bribery and corruption are made, casting doubts on whether the signatures in support
    of a church, or the approval of local authorities, were obtained by honest means.
    Allegations of corruption are often referred to by the term *nyogok*, bribe –
    that is, the payment of an extra sum of money to government officials to ensure
    an application for a permit is approved. Under the New Order, ‘Underpaid bureaucrats
    supplement(ed) their incomes with informal sources of income by selling licenses
    and levying personalized forms of taxation’ (Nordholt 2004: 32). This situation
    has changed little today.In the Depok Church Permit Case, the Muslim Solidarity
    Forum, a coalition of Muslims who opposed the church in Depok, accused the church
    of using bribery to obtain local support. The leader of the Muslim Solidarity
    Forum, Budi Waluyo, cited rumors that the church gave out *sembako*^(57) to local
    residents in exchange for signatures of agreement to the construction of the church.^(58)
    When questioned about accusations that the church had bribed locals to agree with
    its proposal, church committee member Betty Sitorus denied the allegations. She
    admitted that the church usually hands out *sembako* as gifts to its employees,
    such as the security guards, during religious festivals such as *Idul Fitri*,
    the celebration at the end of Ramadan.^(59) She stressed that this is common practice
    in Indonesia, particularly for Muslims, and that it was not distributed in exchange
    for signatures.Nevertheless, the Muslim Solidarity Forum also claimed that the
    church has been dishonest by providing false identity cards to meet the requirement
    of 90 church members. The Defense even presented a statement from one local resident,
    Abdulloh Jawi, who argued that he had never signed the document in agreement to
    build the church and claimed his signature must have been forged (Administrative
    Court, 2009a: 31). There was also a similar statement given by another local resident
    that she did not give consent for her identity card to be used in support of the
    church’s application for a permit. The church denied these allegations, and pointed
    to a statement of agreement to the proposed church that had been signed by numerous
    local residents (p.26–27). The Plaintiff also produced two local Muslim residents
    as witnesses, Abdul Basir and Nasir. Nasir, the Head of RW 4, testified that he
    agreed to the construction of the church, while Abdul gave evidence that the people
    who had demonstrated against the church were not locals from the area (p.32–33).To
    counter this, the Defense submitted a letter from residents who disagreed with
    the construction of the church, as well as letters of opposition from several
    local mosques and Qur’an recitation groups, although the members of these groups
    overlapped (p.30–31). The defendant called five witnesses, including H Koen Soelistijo,
    the leader of RW 14 (1986–98), who was the leader of the only RT of the four in
    the area that opposed the construction of the church back in 1998 (p.34).In response,
    the church alleged that the Muslim Solidarity Forum engaged in corrupt practices
    and manufactured support for its campaign by bribing people to attend the *istighotsah*
    ceremonies held in protest against the church. On the other hand, the Muslim Solidarity
    Forum suspected judicial corruption in this case and believed that the only reason
    the church won was because it bribed the judiciary. The Batak are well known in
    Indonesia as successful business people, high-ranking government officials, military
    officers and lawyers (Rae *et al*., 2008: 560). One of the reasons Batak lawyers
    are said to have a high success rate in court is because of their close connections
    with the police and other government officials.Having identified the reasons why
    places of worship may be opposed, I will now discuss the significance of some
    key court cases regarding disputes over permits and examine how different mechanisms
    and institutions have been used to complain against the actions of government
    officials.[Asserting legal rights in court](#07_Contents.xhtml_ch5-5)According
    to the new regulation, if a dispute over a church arises, a meeting must first
    be held with the local community (art. 21–22). If the dispute remains unresolved,
    the regent or mayor, assisted by the Ministry of Religion, must facilitate a meeting
    between the religious groups concerned. If this fails, then the parties involved
    can take the case to court, as occurred in the Depok Church Permit Case.The resolution
    of disputes was one of the biggest issues raised at the Inter-religious Harmony
    Forum National Congress in 2009\. Members of the Forum from the regions sought
    advice on how to deal with situations not covered by the new Joint Regulation.
    Many expressed the need for guidance on the appropriate course of action when
    a Christian congregation has fulfilled all the requirements, but faced opposition
    from Muslim groups, particularly from groups outside the community, such as FPI
    (FKUB, 2009c). According to the chairperson of the Depok Forum, KH Farid Hadjiri,
    this is a major problem in Depok and he expressed frustration at the lack of guidance
    in the regulation.^(60) This indicates that formal dispute resolution procedures
    are largely ineffective in the face of concerted campaigns to close churches and
    inaction from law enforcement officials who are unwilling to prevent violence.In
    addition to the use of violence and attempts to influence the law reform process,
    Islamists have responded by pressuring local authorities to cancel church permits.
    This elicited two main reactions from Christians: complaints to non-judicial institutions
    such as the Ombudsman and cases brought to the court. The Depok Church Permit
    Case is one of a handful of court cases in which Christians have asserted their
    rights to build a church by challenging decisions of local authorities to cancel
    a permit. This has been made possible by the new rights and freedoms granted under
    democracy, combined with the momentum gained by the court victories won by some
    churches, even if the outcome has at times proven hollow.[Channels for advocacy
    and complaint](#07_Contents.xhtml_ch5-6-1)When faced with opposition to the construction
    of a church, Christians have asserted rights by lodging complaints with existing
    independent institutions such as the National Human Rights Commission or the Ombudsman,
    and by establishing non-government organizations (NGOs) as vehicles for advocacy.
    Complaints about violent attacks on churches have been made to independent bodies
    at the provincial and national level, as well as to international organizations
    such as the United Nations. In taking this approach, both the national rhetoric
    of the ‘Pancasila,’ and international discourse on human rights and religious
    freedom, have been used by Christians to support their case. Further, recourse
    to non-judicial mechanisms of review *after* a court decision has already been
    made suggests that these institutions are being used to compensate for the weaknesses
    of the courts.Complaints have been made to the national Ombudsman,^(61) to its
    regional branches, and to the local Ombudsman of Yogyakarta. By 2011, the national
    Ombudsman had received 11 cases since it began, six of these in West Java, including
    complaints from the church in the Depok Church Permit Case (Ombudsman, 2010).^(62)
    The willingness and capacity of the Ombudsman to respond to such complaints often
    depends on whether the complaint is against a local government or against the
    Inter-religious Harmony Forum. The Ombudsman only has the power to investigate
    the actions of government institutions and therefore cannot pursue claims against
    the Forum, which is considered by the Ombudsman to be an independent body.^(63)On
    this basis, the national Ombudsman has declined to respond to complaints in some
    cases. For example, in January 2007, a complaint was made to the National Ombudsman
    Representative Office for Central Java and the Special Province of Yogyakarta
    by the Indonesian Bethel Church about an application for a church permit in Purbalingga,
    Central Java. In this case, the regent had rejected an application for a permit
    to build a church based on the recommendation of the Forum. After receiving the
    complaint, the Ombudsman responded to the complainant by determining that the
    case was outside its authority because it considered the Forum to be an independent
    body, not a government institution (Ombudsman, 2009a; FKUB, 2007).Other churches
    have had more success in cities where a local Ombudsman exists. For example, in
    October 2008, the local Ombudsman of the province of Yogyakarta received a complaint
    about a church permit. The Ombudsman investigated the matter and facilitated consultations
    with the Inter-religious Harmony Forum, the Ministry of Religion, the church and
    the local government. On 24 March 2009, the local Ombudsman issued a recommendation
    concluding that the leader of the village had the power to reject permits, but
    must provide adequate reasons for his decision (Ombudsman, 2009b). As no reasons
    had been provided in this case, the Ombudsman requested that reasons be given.
    At December 2009, however, no reasons had been forthcoming and the church had
    not been able to obtain a permit.The Ombudsman has received a small number of
    complaints against local government officials in comparison to the National Commission
    for Human Rights (Komnas HAM),^(64) which has the power to receive complaints
    concerning government decisions that may breach human rights, and investigate
    and make recommendations to the government (see Herbert, 2009). Komnas HAM was
    established in the final years of Soeharto’s New Order,^(65) which raised concerns
    that it was largely an exercise in window-dressing in an attempt to legitimize
    the Soeharto government. Despite its initial critics, after the transition to
    democracy in 1998, the authority and independence of Komnas HAM was strengthened
    by legislation.^(66) As Lindsey (2007: 15) has pointed out, Komnas HAM was ‘one
    of the New Order’s few successful public law innovations.’Komnas HAM has received
    numerous complaints based on the right to religious freedom regarding threats
    to or attacks on churches.^(67) For example, in March 2008, the Indonesian Christian
    Church (Gereja Kristen Indonesia, GKI) of Bogor lodged a complaint after the permit
    it received in 2006 was cancelled by local authorities. In response, on 7 April
    2008, Komnas HAM sent a letter to the Minister of Religion, the Minister of Home
    Affairs, and the mayor of Bogor, requesting clarification of the decision and
    a quick response in this case (Administrative Court, 2008: 8). Although no response
    was received, the church used the letter from the Ombudsman as evidence in court
    (see the Bogor Church Permit Case below). In October 2008, the church lodged a
    complaint with the National Human Rights Commission detailing the disruption to
    its plans due to the campaign against the construction of the church (Komnas HAM,
    2008). Although Komnas HAM can make recommendations to government authorities,
    the force of its decisions are limited because they are not legally binding and
    depend on the responsiveness of government agencies.^(68) As the Bogor Church
    Permit Case demonstrates, it may, however, contribute to evidence in a court case.Despite
    the potential for non-judicial mechanisms of accountability to resolve complaints
    against government agencies before going to court, the extent to which the recommendations
    of these institutions are followed depends on the respect and independence accorded
    to it by the state. Given that there are no ramifications for government officials
    who refuse to recognize a binding court decision, there is also little incentive
    for government officials to comply with a non-binding recommendation.[Challenging
    government decisions pre-1998](#07_Contents.xhtml_ch5-6-2)Another forum for complaints
    has been the Administrative Court, which provides an avenue for judicial review
    of administrative decisions in Indonesia. The concept of an Administrative Court
    in Indonesia was proposed as early as 1964, but it was not until 1978 that Soeharto
    announced that the administrative courts would be established.^(69) It was another
    eight years before the draft law was adopted, and it did not come into effect
    until January 1991.^(70) This reform was significant because, in addition to the
    establishment of the Administrative Courts, it introduced the principle of judicial
    review of administrative action.^(71) It defines an administrative decision as
    a written decision by a body or administrative official, consisting of acts under
    administrative law based on laws that are ‘concrete, individual and final, and
    that give rise to legal consequences for a person or legal body’ (art. 1(9)).
    Persons or legal entities affected by the decision may seek judicial review and
    must either show that an administrative decision is opposed to the law or opposed
    to general principles of good governance (art. 53).^(72) The Administrative Court
    has the power to award several types of remedies, the main remedy being to nullify
    an administrative decision, or to order the defendant to issue a new decision.During
    the New Order, the only case in which a church challenged the decision of the
    local government is the Nababan Case in 1993.^(73) Bishop Nababan had been the
    bishop (*ephorus*)^(74) of the Batak Church^(75) for six years. In 1993, he filed
    a case in the Administrative Court of Medan (North Sumatra) to challenge a decision
    of the head of the Coordinating Agency for National Stability, then Indonesia’s
    largest secret service agency (known as Badan Koordinasi Stabilitas Nasional,
    or Bakorstanas).^(76) Bakorstanas sought to remove Nababan from office and appoint
    an interim bishop to facilitate the congress for the election of a new bishop.This
    litigation arose due to the challenge the Batak church posed to the power of state
    elites in the area. In 1987, Nababan had been elected as bishop of HKBP, winning
    over his rival Simanjuntak (Klinken, 1997). Nababan had fallen out of favor with
    government officials after the Batak Church, under his leadership, established
    an NGO that had been outspoken on environmental and human rights abuses committed
    by a giant paper-pulp factory near Lake Toba. As the elite benefited from this
    factory, these allegations threatened their political and economic interests (HRW,
    1994b: 95). Aside from human rights issues, other accounts of this case emphasize
    that Nababan introduced some practices into the church, such as evangelical revival
    meetings, which were controversial and a source of division at the time (Aritonang
    and Steenbrink, 2008: 562).Due to a combination of these factors, the government
    intervened in the internal elections for bishop of HKBP by preventing the re-election
    of Nababan and ordering the re-election of his rival Simanjuntak, who was sympathetic
    to the government. This split the Batak Church into factions: the first loyal
    to Nababan and the second loyal to the state and in favor of Simanjuntak (HRW,
    1994b: 94). Although this case was portrayed by the government as a conflict internal
    to the Batak Church, it was in reality a case of state interference in the religious
    affairs of the church.^(77)In court, Bakorstanas was found to lack the authority
    to make a decision on the internal affairs of the church because it lacked executive
    power (Bedner, 2001: 174; Bedner, 1997: 187). Nababan was therefore successful
    in seeking the cancellation of its decision. In retaliation, Bakorstanas challenged
    the Chairperson of the Administrative Court Lintong Siahaan, arguing that his
    status as a member of the Batak Church influenced his decision in this case. The
    court rejected this claim, although Siahaan’s subsequent resignation raised questions
    about the validity of the court decision (Bedner, 2001: 174).The Nababan Case
    was one of the only cases in the New Order in which a church challenged the decision
    of a government body. Since 2008, however, there have been several cases brought
    by churches to the Administrative Courts.[Judicial review in the Administrative
    Court](#07_Contents.xhtml_ch5-6-3)By the end of 2012, there had only been four
    court cases across Indonesia where a church sought judicial review of an administrative
    decision to cancel its permits. All four cases occurred in the province of West
    Java. These cases are evidence of Christians asserting their democratic rights
    through legal processes. The Administrative Court is therefore becoming an important
    forum for the resolution of such disputes, although the scope for enforcing judgments
    without the support of the religious majority and in the face of threats of violence
    from radical Islamic groups is limited.[Bogor Church Permit Case](#07_Contents.xhtml_ch5-6-4)In
    2008, the Bogor Church Permit Case was initiated by the Indonesian Christian Church
    (Gereja Kristen Indonesia, GKI) of Curug Mekar, Bogor. It challenged the power
    of the Head of the City of Bogor Administration and Planning to cancel its permit
    (Administrative Court, 2008). The church had initially applied for a permit from
    local authorities in 2002\. The 1,700-member church claimed to have made numerous
    efforts to disseminate information about its plans and even obtained video evidence
    of local residents agreeing to its proposal. On 13 July 2006, four years later,
    the church was finally granted a permit.^(78)The permit was granted in 2006 during
    the transition phase from the old to the new permit regulation system. Although
    the Joint Regulation was passed in March 2006, the new process had not yet been
    implemented in Bogor. The Inter-religious Harmony Forum was only formed in 2007,
    however, so the dispute had begun before the Forum was established.^(79)The construction
    of the church initially had the support of the local government and the mayor
    attended the opening ceremony of the construction site to lay the first brick.
    Not long after construction began, the church faced increasing opposition from
    members of Islamic groups such as FPI, PKS and the Bogor Ulama Forum (Administrative
    Court, 2008: 24–25). The church claimed to have amicable relationships with many
    long-standing Muslim residents in the area, but attributed the opposition to some
    Muslim residents who had moved into the area just two or three years ago and who
    were encouraged to oppose the church by members of radical Islamic groups.On 14
    February 2008, the local government suspended the church’s permit.^(80) The church
    then took its case to court. In court, the Defense argued that one of the reasons
    that the church should not be built was because the road on which the church site
    was located had been renamed after Islamic figure Kyai Haji Binu, the founder
    of Al Ghazali *pesantren* (Islamic boarding school) in Bogor (Administrative Court,
    2008: 27). Like the Depok Church Permit Case, the defendant used such evidence
    to argue that a church should not be built in a ‘Muslim’ area. This argument had
    no legal standing in court, and the church succeeded at first instance. The City
    of Bogor Administration and Planning lodged a subsequent application to the High
    Administrative Court in Jakarta, but it was dismissed.It is significant that this
    case was even taken to court, as a closer look at the situation demonstrates that
    Christians are still divided on the merits of taking legal action when such conflicts
    arise. According to lawyer Fatmawati, it was difficult for the church to agree
    on instituting court proceedings because:the image of the courts in Indonesia
    is very corrupt and they [the church] were convinced we would lose … one of the
    judges in the case was not embarrassed to say that he would accept the largest
    bribe.^(81)This suggests that the history of corruption within the judicial system
    is a significant deterrent for potential litigants. This case is not only remarkable
    because the church went to court, but also because it was successful. By law,
    this means the church can now recommence construction. Some of the church congregation
    and leaders, however, remain fearful of provoking Islamists who oppose the church.
    Local politics may also have played a part, with the Mayor of Bogor, Diani Budiarto,
    winning the elections backed by the Democratic Party, PKS, and PDI-P. There were
    suspicions raised that the local administration had collaborated with the mayor
    to close the church due to the 2010 elections (*Jakarta Post*, 15 January 2011).
    In January 2011, the Bogor Administration appealed to the Supreme Court, but the
    court refused to hear the case because since 2004 it had no longer had jurisdiction
    to hear appeals regarding complaints of regional government officials.^(82) This
    means that the decision of the High Administrative Court stands and the church
    should now be able to continue construction.^(83)In June 2010, however, an Islamic
    coalition known as Forkami filed a complaint against the neighborhood leader,
    alleging that he had forged signatures of local residents that were submitted
    by the church in support of its application for a permit. In January 2011, the
    District Court of Bogor found the neighborhood leader guilty, although the church
    claimed that those signatures had not been included in the application for a permit
    (District Court, 2010a).The dispute continued since the Supreme Court declined
    to hear the case, which effectively affirmed the decision of the Administrative
    Court in favor of the church, although the mayor refused to recognize the court
    decision in favor of the church. The mayor then issued a letter on 11 March 2011^(84)
    in an attempt to cancel the permit for the second time. The church sent another
    letter to the Supreme Court requesting assistance. In June 2011, the Supreme Court
    issued a *fatwa*^(85) stating that its 2010 decision not to hear the case was
    final and that it could not hear the church’s concerns.Having exhausted the legal
    system, the church leaders then complained to the national Ombudsman, despite
    the fact that the Ombudsman is designed to be used prior to going to court rather
    than to enforce a court order. On 8 July 2011, the Ombudsman issued a recommendation^(86)
    instructing the mayor to cancel the second letter it had issued, advised the Minister
    of Home Affairs to monitor the situation to ensure the church could begin building,
    and warned the mayor to comply with the 60-day deadline.^(87) The 60-day ultimatum
    lapsed and, given the failure of the mayor to respond adequately to the recommendations,
    the Ombudsman submitted its report to the legislature and the president,^(88)
    in the hope that it may lead to the impeachment of the mayor.Since then, several
    attempts at the national level have been made by the legislature to mediate between
    the local government and the church. This dispute remains ongoing at the time
    this chapter was written and demonstrates the limited reach of the law without
    the political will to ensure law enforcement at the regional level of court decisions
    that are in favor of religious minorities.[Purwakarta Church Permit Case](#07_Contents.xhtml_ch5-6-5)Despite
    the inability to enforce court decisions, other churches have been encouraged
    by the legal victory in the Bogor Church Permit Case. For example, in 2009, the
    Santa Maria Catholic church of Bungursari took the regent of Purwakarta to the
    Administrative Court of Bandung (see Administrative Court, 2009b; High Administrative
    Court, 2010a). In the Purwakarta Church Permit Case, the church challenged the
    cancellation of its permit to build in the village of Cinangka, Purwakarta.^(89)
    On 2 February 2009, the church sent a letter to the Ministry of Religion and the
    Inter-religious Harmony Forum to request a recommendation. On 3 March, it also
    sent a letter to the regent to request a permit. On 10 March, the Forum gave its
    approval to the church proposal and on 8 April the regent issued a permit for
    the church. However, sometime between March and October, opposition to the church
    grew. In July, MUI sent a letter to the regent requesting cancellation of the
    permit. In October, the chairperson of the Forum, the Indonesia Ulama Forum and
    the Ministry of Religion did likewise. In response, the regent cancelled the permit
    based on the revised recommendations of the Forum and the Ministry. The Regent
    Dedi Mulyadi^(90) claimed his decision was based on the results of investigations
    and recommendations by the Inter-religious Harmony Forum and the Ministry of Religion
    in Purwakarta. Like the Depok Church Permit Case, this decision was made not long
    before local elections were held in 2010.In February 2010, the church was successful
    at first instance because the court ruled that the decisions of the Forum and
    the Ministry are not a legitimate basis for cancellation of a permit. The regent
    appealed to the Administrative High Court of Jakarta and lost (High Administrative
    Court, 2010a). The church decided not to recommence building until it received
    a letter of execution from the court to ensure it had permission to continue due
    to concerns about acts of violence or retaliation from groups such as FPI.^(91)
    The lawyer for the church, Liona Supriatno, also suspected that those who opposed
    the church were affiliated with FPI.^(92) Similar to the Bogor Church Permit Case,
    the Purwakarta Church Permit Case is also an example of the way in which violence
    triumphs in the absence of a strong state and respect for the rule of law.[Bekasi
    Church Permit Case](#07_Contents.xhtml_ch5-6-6)In another case, in January 2010,
    the Protestant Christian Church of Bekasi^(93) took Mayor Sa’duddin to the Administrative
    Court of Bandung (Bekasi Church Permit Case). The church disputed the authority
    of the local government to seal off the construction site due to opposition from
    the local Muslim Communication Forum.^(94) In 2007, the church had purchased the
    1,000-square meter block of land. Its application to the Bekasi Inter-religious
    Harmony Forum and the Bekasi regent remained unanswered for several years. Finally,
    on 13 January 2010, the church reported the case to Komnas HAM, and in April that
    year took its case to court, supported by a coalition of 31 Batak lawyers and
    one Muslim lawyer.In 2000, the church began meeting in private homes to worship.
    As its numbers grew, it bought land in June 2007 to build a church. On 11 October
    2007, the head of the village gave his recommendation. The Inter-religious Harmony
    Forum failed to respond to the church’s request for a permit. In 2008, several
    letters were sent to the mayor requesting the cancellation of the church’s permit,
    including from the village Muslim Communication Forum, the Betawi Brotherhood
    Forum (Forum Betawi Rempung, FBR),^(95) and leaders of the three local mosque
    congregations. On 18 August 2009, the Ministry declined to give consent due to
    opposition from the community based on the report of the head of the local subdistrict
    (Administrative Court, 2010a: 10).On 25 December 2009, the church held a Christmas
    service on the land. Word that the church was meeting on the land ‘illegally’
    was reported to the local government. On 3 January 2010, the mayor issued a decision
    informing the church that it must cease all activities on the vacant land. On
    12 January, the land was sealed off to prevent church members from entering, according
    to the instructions of the mayor of Bekasi, who was supported by PKS. Some of
    the concerns cited by those who opposed the church were issues of crowding and
    traffic, rather than religious differences. The mayor of Bekasi had offered an
    alternative solution, to provide land for the three churches to use jointly, but
    the churches did not agree to this proposal.The church decided to take its case
    to court. At the trial, witnesses for the church claimed that the local residents
    had agreed to the church in 2007.^(96) In 2010, however, local residents were
    then approached by three Muslim community leaders, Ustad Amil Anung, Ustad H Naimun
    and Maryadi, and forced to sign a letter requesting that the regent cancel the
    permit. These allegations of coercion were denied by Naimun and Maryadi, as witnesses
    for the regent, who claimed that they took this action because residents had been
    bribed into giving their consent to the church. Aside from these local residents,
    the vice-chairperson of the Inter-religious Harmony Forum also appeared in court.
    When questioned why the Forum did not respond to the permit application submitted
    by the church, he said it had delayed giving its recommendation as it was still
    waiting to receive the recommendation from the Ministry of Religion (Administrative
    Court, 2010a: 80). This was a bureaucratic response to mask its reluctance to
    make a decision on a politically sensitive issue.All four court cases have occurred
    in the province of West Java. The choice of the courts as a forum for dispute
    resolution is placing increasing pressure on the judiciary to resolve these disputes.
    It appears that the Administrative Court has become an important forum to resolve
    disputes over the legality of decisions to cancel a permit.Several trends are
    noticeable in these cases. First, all these churches had obtained permits to build
    and the permits were then cancelled. There are indications that in each case the
    permit was cancelled because of campaigns by radical Muslims, both locals as well
    as from groups such as FBR or FPI. Second, all decisions were made close to local
    elections, which indicates a responsiveness on the part of local politicians to
    the Muslim-majority electorate and a desire to maintain votes in a competitive
    political environment. Third, the inability of the newly established Inter-religious
    Harmony Forum to assist in resolving disputes has left some churches no option
    but to argue their case in court. The choice of the courts as a forum for dispute
    resolution has placed greater pressure on the judiciary to resolve these disputes.
    Even if a case is successful in court, these cases demonstrate that court decisions
    may have little practical effect in the face of continued threats of violence
    from radical Islamists, without the willingness of the state to protect religious
    minorities.[Judicial review in the Supreme Court](#07_Contents.xhtml_ch5-6-7)Aside
    from the Administrative Court, which hears cases of review of administrative decisions,
    the process of judicial review in the Supreme Court has been used to challenge
    the validity and scope of the Joint Regulation. There have been two attempts to
    challenge the Joint Decree 1/1969, and two attempts to challenge the Joint Regulation
    of 2006 in the courts. These cases were brought by religious leaders, but were
    indirectly supported by human rights groups and NGOs, including Indonesian Legal
    Aid. All these have failed because of the courts’ reluctance to depart from the
    official government position on permits and presumably because they do not want
    to be seen to favor religious minorities.In 2005, the first request for judicial
    review of the Joint Decree 1/1969 was lodged with the Central Jakarta District
    Court by a team of 29 lawyers. This request for judicial review was a class action
    against the President of Indonesia, the Minister of Religion and the Minister
    of Home Affairs. The applicants relied on article 22 of Law 39/1999 on Human Rights
    and article 28E(1) of the Constitution on the right to religious freedom (Soefyanto,
    2009: 105–6). They appealed to the ‘universal’ notion of the human right to freedom
    of worship. In response, the Minister of Religion emphasized the need for social
    order and criticized the vagueness and imprecision of the application and the
    lack of clarity as to ‘who’ was injured.There was some debate about the different
    standards that exist due to the difference between national and regional regulations,
    which the applicant argued led to unequal standards across the archipelago. Several
    examples were given, such as the Regulation of the Governor of Riau No. 450.2/KS/9601
    passed in 1981, a Decision of the Governor of Bengkulu No. 283/1993 on the Procedure
    and Conditions to Build a Place of Worship and to Spread the Teachings of a Religion,
    and a Decision of the Governor of Bali No. 33/2003 on the Procedure and Conditions
    to Build a Place of Worship. According to the Defense, these were permissible
    ways for provinces to implement and modify the 1969 Joint Decree according to
    local conditions (Soefyanto, 2009: 114). The Minister also quoted statistics on
    places of worship to show that the numbers have increased over the years in support
    of the argument that the Joint Decree has not impeded but rather promoted the
    construction of places of worship (Soefyanto, 2009: 116). The court never issued
    a decision in this case, however, because the new Joint Regulation passed in 2006
    cancelled the old Joint Decree.Independent of this case, in late 2005, a similar
    application for a request for judicial review of the Joint Decree 1/1969 was lodged
    with the Supreme Court by a team of three lawyers. The defendants in this action
    were the Minister of Religion and Minister of Home Affairs. The applicants also
    argued that the Joint Decree inhibited their constitutional right to religious
    freedom. Unlike the previous application, they claimed that the 1969 decree contradicted
    Law 28/2002 on the Construction of Buildings because that law does not specify
    that any further conditions are required to obtain a permit for religious buildings
    (Soefyanto, 2009: 121–22). On 22 November 2005, the Minister of Religion responded
    to the allegations, rejecting the application because the Joint Decree upholds
    the right to religious freedom, acts as a permissible restriction on this right,
    and is not opposed to the Constitution. The Supreme Court appears to have agreed,
    as the application was rejected in October 2006 (Supreme Court, 2006g).Due to
    the introduction of the new Joint Regulation in 2006, a fresh request was lodged
    for review of the Joint Regulation with the Supreme Court by a team of 40 lawyers
    under the name the ‘Religious Freedom Defense Team.’^(97) The review was sought
    on the grounds that the Joint Regulation contravenes and unnecessarily restricts
    the constitutional right to freedom of religion. The application was lodged with
    the court in April 2006, less than three weeks after the new Joint Regulation
    was issued in March 2006.The Religious Freedom Defense Team based its argument
    on the Constitution and the right to religious freedom, as well as on the rule
    of law and Law 39/1999 on Human Rights (Soefyanto, 2009: 141). They emphasized
    the injustice of discrimination based on the lines of religious majority and minority
    (Soefyanto, 2009: 144). They highlighted the illegal destruction of churches and
    expressed frustration at the lack of protection of rights (Soefyanto, 2009: 145–46).
    They claimed that conflicts over churches disturb the economic stability of the
    nation and foreign investment. They also highlighted several incidents of attacks
    on churches since the introduction of the Joint Regulation in March (Soefyanto,
    2009: 147).The Minister of Religion referred to jurisprudence of the Supreme Court,
    arguing that the court should not accept the application because it was unclear
    (Soefyanto, 2009: 149). It emphasized that the Joint Regulation was the result
    of ‘community participation,’ that is, it had been agreed by religious leaders
    of the six national religious councils. It referred to the 90/60 requirement and
    claimed that the process is fairer now because local regulations – such as the
    need for 40 families in Riau, 50 families in Central Sulawesi or 100 families
    in Bali – must now comply with the national regulation (Soefyanto, 2009: 159).
    On 28 February 2008, the court handed down a decision in which it agreed with
    the minister and rejected the application for review (Supreme Court, 2008b).A
    few months later, on 13 October 2006, a similar request for judicial review of
    the Joint Regulation was lodged with the Supreme Court by a team of 25 lawyers
    from the Christian political party PDS of East Java (Supreme Court, 2006f). In
    addition to the argument that it was against the right to religious freedom, the
    applicants asserted that the Joint Regulation was inconsistent with Law 10/2004
    on Law-making, because a ministerial regulation is not listed as a recognized
    form of law according to the Indonesian hierarchy of laws. The applicants also
    argued that the requirement to provide proof of 90 members of a church by submitting
    copies of congregation members’ identity card discriminated against children who
    do not have an identity card and so are treated as if they do not have a right
    to a place of worship. In regards to the 90/60 requirement, they claimed this
    requirement is too difficult for Christians to meet, and that it is easier to
    build a nightclub in Indonesia than a place of worship (Soefyanto, 2009: 172).
    They also made submissions regarding the difficulty of obtaining a permit from
    local government, and instances of opposition to the construction of churches
    without good reason (Soefyanto, 2009: 173).The minister argued that the Joint
    Ministerial Regulation was a valid legal instrument (Soefyanto, 2009: 178), and
    that limitations on the right to religious freedom were permitted in certain circumstances.
    He emphasized that:It must be remembered that there is no freedom that is unlimited,
    but all freedom is limited. Freedom may be limited by the freedom of others, by
    customs, by laws and by the teachings of religions.(Soefyanto, 2009: 180)The minister
    also relied on the fact that the issue of the number of people needed for a permit
    was debated at length by religious leaders during the drafting process, before
    the 90/60 requirement was finally agreed (Soefyanto, 2009: 181). On 13 February
    2008, the court again agreed with the government, although it offered little reasoning
    for its decision, rejected the application and left the Joint Regulation 2006
    in force.The court’s blanket agreement with the position of the Minister of Religion
    in these cases suggests that it is conscious to keep in line with government policy
    on this issue. It must be acknowledged, however, that the applicants’ case was
    weak at best, given that the regulation of permits for places of worship is a
    common feature in many countries. Nevertheless, the court could have considered
    whether particular provisions, such as the requirement that an application have
    the signatures of 90 members and 60 local residents, infringed on the right to
    religious freedom.[Conclusion](#07_Contents.xhtml_ch5-6)The Depok Church Permit
    Case highlights the persistent fears of Islamists concerning the construction
    of churches, which is considered to be an act of proselytization or an attempt
    to gain new converts. This had led to a trend in local authorities using conflict
    over places of worship as opportunities for political gain in the highly competitive
    political atmosphere since the downfall of Soeharto in 1998. Capitalizing on local
    fears of ‘Christianization’ in Muslim-majority areas, local authorities are responding
    to the concerted campaigns against churches by radical Islamic groups by cancelling
    church permits.This chapter has demonstrated the pressure some religious minorities
    face to build places of worship – both Muslims and Christians, depending on the
    context. The number of churches that have faced resistance in the first ten years
    of democracy now exceeds the number attacked or threatened during the entire 30
    years of Soeharto’s New Order. The nature of the opposition to churches, however,
    has changed over time. From the late 1990s up until the early 2000s, large numbers
    of churches were violently attacked in one day, as occurred in 1996 in Situbondo
    and Tasikmalaya. Since 2001, it is more common for radical Islamic groups to wage
    specific campaigns of threats and violence against individual churches.Violent
    attacks on churches were particularly acute in 2004 to 2005 and led to calls for
    reform, from Christians and Muslims. The introduction of the Joint Regulation
    in 2006 made two major changes to the system to obtain a permit for a place of
    worship that are favorable to religious majorities in an area. The first major
    change was the establishment of the Inter-religious Harmony Forum, which only
    added another layer of bureaucracy to the already difficult process to obtain
    a permit. Although it allows for the participation of religious leaders in the
    application process, decisions can be easily manipulated by the religious majority.
    The second change is the requirement that an applicant must obtain the signatures
    of 90 congregation members and the signatures of 60 local residents. Even if satisfied,
    it may be subject to claims of corruption and bribery from radical Islamic groups
    that oppose the church.From this examination of allegations of ‘Christianization’
    leveled at churches, there are common themes in the arguments used to oppose plans
    by Christians to build a church. This may include that a church should not be
    built in a ‘Muslim area’ and that a stricter permit process is necessary as a
    gate-keeping function to protect the community. If there is already a church in
    the area, a proposal for another church may be seen as unnecessary and overlook
    the denominational fragmentation within the Christian community that is partly
    the cause of multiple church buildings in one area. On a more practical level,
    there are of course planning issues, such as traffic and parking, as well as issues
    of economic disparity between religious communities. Finally, the building of
    churches raises deep-seated fears about issues of ‘SARA,’ including ethnic differences
    and the fear of foreign intervention in the domestic affairs of the state.The
    Depok Church Permit Case is remarkable because it is one of the first examples
    of a church seeking review of an administrative decision in court after its permit
    to build has been cancelled. It is even more significant that the Batak Church,
    which belongs to the largest Protestant denomination in Indonesia, actually succeeded
    at first instance, on appeal and in the Supreme Court. It highlights the ways
    in which local politics complicates the process to obtain and keep a permit, as
    well as the difficulties of enforcing a court decision without the active support
    of local authorities. Nevertheless, the move by Christian churches, such as the
    Batak Church, to assert their rights through democratic processes and legal institutions,
    particularly the courts, is significant and suggests an increase in confidence
    in the legal system to resolve religious disputes.The church in the Depok Church
    Permit Case was successful in challenging the decision of local authorities to
    cancel its permit in court. Its legal victory, however, remains precarious. In
    November 2010, the church remained under construction, and had erected a sign
    with the court decisions printed on it at the front of the property. This was
    a way of displaying evidence of its legal victory, because progress in the construction
    of the building continued to be threatened by radical Islamic groups. Such cases
    of churches fighting to retain their permits in the face of opposition from radical
    Islamists and local authorities demonstrates that legal decisions may have little
    practical effect without the enforcement of, and respect for, court decisions
    by all sections of society. The role of local authorities and law enforcement
    agencies is crucial to this process. The unwillingness of local authorities to
    implement national regulations if it may compromise their political power, and
    the lack of protection offered to religious minorities, has the potential to undermine
    the processes of democracy and law reform in Indonesia.Notes1  The term ‘place
    of worship,’ *tempat ibadah*, includes churches, mosques and temples, as well
    as any other buildings that are used to hold religious services or gatherings,
    such as homes, theological institutes, hotels or auditoriums.2  This group called
    itself Forum Solidaritas Umat Muslim, or FSUM.3  Although the term is not mentioned
