    这意味着宗教传教活动只能在信奉万灵论或神秘主义信仰的人之间进行，因为这些信仰在官方上不被视为“宗教”（请参见第 3 章）。因此，这一规定支持了穆斯林领袖在
    1967 年会议上表达的立场。如果传教“动摇了宗教团体”或社会和谐，政府可以采取法律行动确保其遵守这些规定（第 3 条）。这四项针对传教的限制限制，代表了穆斯林人对基督教传教活动的特殊关注。


    第 2 条(a)款涉及固定宗教身份的概念，以及防止叛教和宗教间转换的需求，主要是从伊斯兰教向基督教的转换。叛教（`riddah`，字面意思是“背离”）在伊斯兰教内部被广泛认为是背弃伊斯兰教或从伊斯兰教转而其他宗教（Saeed
    and Saeed, 2004: 1）。叛教在印度尼西亚是一个非常敏感的问题，但它并不是国家承认的犯罪。然而，从伊斯兰教叛教并改信基督教仍然是印尼伊斯兰教主义者关注的现实问题（参见第
    6 章）。


    一些穆斯林组织的建立部分是为了是对基督教传教和防止叛教努力的反应。其中一个团体是印尼伊斯兰教传教委员会（Dewan Dakwah Islamiyah Indonesia,
    DDII），它由伊斯兰政党马苏苏米（Masyumi）的领袖 Mohammed Natsir 于 1967 年 2 月 26 日创立²⁷ 根据 Hefner
    的说法，DDII“选择在与基督教传教士直接竞争的地区工作”（Hefner, 2000: 109）。自 1998 年以来，形成了几个“反叛教”团体。一个例子是反叛教运动联盟（Aliansi
    Gerakan Anti-Pemurtadan, AGAP），它由 Muhammad Mu’min 于 2005 年 4 月创立。AGAP 声称代表 27
    个激进的伊斯兰组织，例如伊斯兰捍卫前线（Front Pembela Islam, FPI）、Barisan Pemuda Persis、Jamaah Tabligh
    和 Hizbut Tahrir，并声称拥有多达 5 万名支持者。该组织针对旨在转化穆斯林的基督教活动和教会组织运动。作为其私刑行为的一个例子，Mu’min
    声称其组织对 2005 年西爪哇省 23 家教会的关闭有责任（*Tempo Interaktif*, 2005 年 9 月 11 日）。


    另一个具有类似目标的团体是反改教论坛（Forum Anti-Gerakan Pemurtadan, FAKTA）。FAKTA 成员曾试图攻击被列在其“从伊斯兰教改信基督教”黑名单上的基督教牧师（ICG,
    2009: 7, 8）。例如，在 2007 年，一名涉嫌试图转化其穆斯林学生的基督教教师在巴勒冷琅被 FAKTA 成员杀害。2009 年 4 月，十名男子因此事件以及策划其他类似攻击被带上法庭并判有罪（ICG,
    2009: 3）。


    MUI（印尼乌理玛理事）也对基督徒正以“令人震惊的速度”转化穆斯林表示担忧，对基督徒向穆斯林为主的地区迁移深感遗憾，并抱怨在穆斯林占多数的省份修建教会（*Jakarta
    Post*, 2005 年 7 月 28 日）。一些相关方举行会议来解决这些问题。例如，2001 年，穆罕曼迪（Muhammadiyah）在雅加达举行了关于“面对叛教”的会议，印尼全球团结委员会（Komite
    Indonesia untuk Soliditas Dunia）、FPI 和 Laskar Jihad 等组织的发言人（*Republika*, 2001
    年 9 月 4 日）。2004 年，印尼乌理玛组织了一场关于“预防叛教教育培训”的研讨会（*Republika*, 2004 年 3 月 2 日）。2010
    年 6 月，贝加西伊斯兰中心在其大会上发布了多项建议，其中包括教育穆斯林社区警惕基督教化危险的建议。活动继续煽动更广泛的对叛教恐惧。


    ### 关于贿赂和强迫的规定


    这与条例的第二个要素第 2 条(b)款有关，旨在通过贿赂或不诚实行为防止宗教转换。根据 NU（伍理玛）主席 KH Agil Siradj（2009–14 年），有很多传言说基督徒采取贿赂来“赢得”教徒，如果他们成为基督徒就给人们金钱或食物。`Republika`等报纸刊登了人们转化为基督教的报道，通常是通过强迫或欺骗手段。例如，1999
    年曾有报道说西苏门答腊有 500 人从伊斯兰教转换（`Republika`, 1999 年 8 月 16 日）。1999 年 12 月，据报道印尼乌理玛理事会发现
    100 名穆斯林儿童被给了炸肉吃，而这对穆斯林来说是`haram`（禁止的）（`Republika`, 1999 年 12 月 24 日）。`Sabili`等杂志和
    DDII 等团体也提出了这些指控，但这些团体激起的骚乱往往会煽化宗教关系。尽管每年都有媒体报道声称有些学生通过改信基督教犯了“叛教”，但更有可能的情况是一些学生报名就读了基督教学校。


    另一种被认为是欺骗的传教形式是提供物质援助，特别是在海啸或地震等自然灾害之后。这是由向穆斯林提供慈善援助和`sembako`（基本食品）等物资的宗教团体提出的²⁹。特别是，有时会有联合行动，防止基督教团体向穆斯林社区提供援助。基督教团体提供物质援助并以转化穆斯林社区为隐含目标的早期例子发生在
    1968 年苏加达洪灾后（Hasyim, 1979: 280）。另一个例子是 2006 年 5 月，在雅加达万塔尔地震后，一家教会去向受害者提供援助，但被繁荣党（Partai
    Keadilan Sejahtera, PKS）的成员阻止，因为那里不是“基督教地区”。2008 年，为了停止贝加西的基督教活动也付出了努力³⁰。此外，第
    2 条(b)款可能也防止强迫转换。根据《古兰经》（2:256），使用武力使人皈依伊斯兰是禁止的。然而，印尼确实出现过强迫转换的报道，例如在马鲁库岛穆斯林与基督徒冲突期间（1999–2001
    年）。一些记载提到了特定事件，例如在亚齐和望加锡有 450 名天主教徒被穆斯林俘获并在同意皈依伊斯兰教后被释放（Reid, 1993: 173–74）。更广泛的报道还关于在冲突期间
    4000 名基督徒被强迫皈依伊斯兰教（*Sydney Morning Herald*, 2001 年 1 月 27 日）。尽管如此，这些报道在印尼很少见，可能主要局限于马鲁库岛的冲突。


    ### 宗教出版物


    第 2 条(c)中的第三个要素是担心通过基督教出版物传播错误教。从 20 世纪 60 年代末，新秩序政府通过为六种宗教提供资金来试图控制宗教出版物，尽管书籍的数量较小。从
    1969 年 1970 年，它赞助了 278,000 份《古兰经》译本、8,000 份新圣经、3,720 份天主教圣经以及 12,500 份印度教和佛教文本（总统演讲,
    1970: 250）。这种支持每年增加，到 1990–91 年，出版数量已升至 440,000 份《古兰经》、50,000 份新圣经和 49,000 份天主教圣经（总统演讲,
    1991: 第 5 章, p.9）。这些宗教出版物旨在分发给还没有（官方）宗教的社区或个人。


    有报道称在学校等公共场所向穆斯林发放圣经（通常是当地方言）。例如，1999 年曾报道在西苏门答腊的巴当发放了望民瑶语圣经³¹。这特别引起争议，因为人们广泛认为所有望民瑶人都是穆斯林。2002
    年，一个团体在西爪哇分发了 100 本圣经（`Republika`, 2002 年 12 月 27 日）。2004 年，MUI 对宗教部在出版和分发据称含有基督教化信息的《古兰经》进入穆斯林多数地区缺乏回应表示失望（`Republika`,
    2004 年 7 月 15 日）。


    最后，第 2 条(d)款专门涉及通过向个人发放小册作为传播宗教方式的宗教组织，例如耶和华见人。例如，马苏苏米领袖、DDII 创始人 Muhammad Natsir
    描述了三位传教士在持有一个册单进入一名穆斯林家中并试图说服他改信基督教后被拘留。那名 65 岁的穆斯林因“震惊”去世了（Natsir, 1980: 77–78）。1976
    年，耶和华见人由于对“敲门”做法的担忧被检察长禁止，尽管禁令在 2001 年被解除（Sairin, 1996a: 271–72）。没有证据表明第 70/1978
    号条例曾被政府或法庭执行。


    除了上述的第 70/1978 号条例外，宗教部长发布了第 77/1978 号决定，关于向印尼宗教机构提供海外捐的指南。这部分是为了回应有关外国资金资助传教活动的指控。例如，1967
    年 7 月 21 日，Lukman Harun 博士在立法机构的演讲中提交了数份来自美国的杂志副本，其中包含了关于世界教会理事会产生资金的文章，作为西方资助印尼基督教活动计划的证据（Hasyim,
    1979: 300–8）。穆斯林关于印尼的其他出版物也强调了有大量在印尼运营的北美教会组织和海外机构（Ka’bah, 1985: 82–84）。该规定的意图是使政府能够控制宗教团体收到的捐赠种类、捐赠金额、捐赠来源以及预期目的，以避免外国援助产生任何“负面”影响。该决定禁止在没有批准的情况下向宗教组织提供海外捐赠。对外国传教士实施了限制，他们只有在获得部长同意的情况下才能进行宗教传播，且期限仅为两年，之后必须由本土人员取代（第
    3 条）。不遵守本规定的宗教机构可能成为法律行动的对象（第 4 条）。1978 年的项规定是基督徒非常关注的问题。1978 年 8 月 24 日和再次在 9
    月 14 日，国家新教和天主教委员会（DGI 和 MAWI）向苏哈托写信，要求撤销第 70/1978 号条例和第 77/1978 号决定，为了维护宗教自由的利益³³。Mudzhar（1996:
    232）指出，基督徒之所以抗议是因为这些规定违反了宪法和宗教自由，被一些西方媒体贴上“反传教法”的标签，并导致了“宗教自由受害”的标题（Denffer, 1987:
    36–41）。Steenbrink（2000: 93）认为，当一个国家经历政权更迭并转向民主时，这一过程不可避免地受到社区内关键行为者（如宗教领袖）的影响。宗教部对这一争议的回应是发布了
    1979 年关于宗教传播和向宗教组织提供海外捐的决定。1979 年的决定几乎是逐字地重申了宗教传播仍然可以进行，但必须基于对其他宗教的相互尊重”（第 3 条）——即仅针对还没有宗教的人。当时的
    MUI 领袖 Hamka 同意这些法律（Mujiburrahman, 2008: 82），MUI 在多年后的出版中继续表达对这些法律的支持（MUI, 1995:
    26）。基督教领袖再次强烈反对 1979 年的规定（Sairin, 1996a: 488–99）。然而，在 20 世纪 80 年代，通过了多项处理外国传教士和控制宗教布道内容的规定（Sudjangi,
    1992: 121–24）。尽管从未实施，它们仍然有效。


    ### 结论


    [content]

    当一个国家经历政权更迭并转向民主时，这一过程不可避免地受到社区内关键行为者（如宗教领袖）的影响。对 1998 年通过政府政策限制基督教化的简要历史分析表明，对建立教会、医院和学校等活动的抵抗源于印尼的殖民过去，当时基督教被广泛认为受荷兰当局青。1945
    年独立后，20 世纪 60 年代对共产主义的打击以及大规模改信基督教，使伊斯兰教者请求政府提供宗教教育、保护宗教免受亵渎法监管教会许可。在 1967 年会议上，这引发了穆斯林和基督徒之间关于传教“目标”和方法可以限制的国家辩论。20
    世纪 70 年代，印尼乌理玛的压力导致宗教部设定了传教的边界，这些规定仍然有效。

    [/content]


    ### 宗教意识形态、代表与改革](#07_Contents.xhtml_ch3)


    本章探讨了国家机构中的意识形态代表与穆斯林和基督徒冲突相关的法律改革。它分析了穆斯林如何利用政府机构和法律程序来改革监管宗教事务的法律。通过这些机制证明了伊斯兰教者对法律改革产生了重大影响，导致多数权利有时以牺牲少数人为代价。主要的争议问题之一（在穆斯林社区内部以及穆斯林与基督徒之间）是国家的意识形态基础，以及印尼应该成为一个伊斯兰法国家。在
    1945 年辩论最初失败后，2000 年曾通过伊斯兰教者的努力试图在宪法中重新插入《雅加达宪章》（即穆斯林遵循伊斯兰法的义务来恢复这一提议。本章分析了这一运动的失败，以及对五民国家意识形态地位和宗教自由（特别是宗教少数群体权利）的影响。监管和监督宗教事务的关键政府部门是宗教部。本章探讨了伊斯兰教者如何通过宗教部，特别是印尼乌理玛理事（MUI），为基于伊斯兰法的国家改革进行运动。它还考察了相应的国家天主教和新教委员会，以及这些组织在
    1998 年后是否仍然代表基督教社区。雅加达宪章的地位和宗教部的角色一直是辩论的话题。自 1998 年以来，去中心化和民主进程将权力转移到了地方，为地方政府通过法律规定宗教提供了更大的自由。


    ### 宪法妥协与宗教自由的限制


    自 1998 年以来，穆斯林和基督徒对宗教与宪法的关系有两个主要关注的问题：宪法对自由的改变，以及通过宪法修正将印尼变为伊斯兰法国家的尝试。1978 年的规定是基督徒非常关注的问题。1978
    年 8 月 24 日和再次在 9 月 14 日，国家新教和天主教委员会（DGI 和 MAWI）向苏哈托写信，要求撤销第 70/1978 号条例和第 77/1978
    号决定，为了维护宗教自由的利益³³。一种意识形态妥协已经发生，优先考虑五民而非伊斯兰国家，这对宗教自由的巩固具有重要的资历。在 1945 年宪法的草拟过程中，关于宗教自由的纳入以及是否应包含改变宗教的自由存在大量辩论。许多辩论参与者（如
    Renda Sihombing，基督教党 Parkindo）认为，宪法应该包含改变宗教的自由，而这种做法让伊斯兰教者担心会导致宗教间的转换（Nasution,
    1992: 202）。几位基督教政党成员（如 I.J. Kasimo，天主教党 Partai Katolik，以及 Rumambi）支持包含改变宗教自由的提议（Nasution,
    1992: 203）。1953 年，这一立场通过新教委员会通过的一项决议得到重申，维护了改变宗教和传播宗教自由（Nyhus, 1987: 517）。在辩论的另一方，穆斯林领袖为了“宗教和谐”关注对宗教自由进行合法的限制。在
    1945 年宪法的草拟过程中，一些参与者（如 Oemar Salim，伊斯兰党 Masjumi）严厉反对纳入此类规定。如果此类规定必须纳入，他认为它不适用于穆斯林，可能是因为伊斯兰教反对叛教的教义。最终，1945
    年印尼宪法在第 29 条包含了宗教自由，尽管它没有规定这是否包括改变宗教。第 29 条的内容如下：国家基于对唯一真神的信仰。国家保障所有人根据其宗教和信仰享有宗教的自由。自
    1998 年转向民主以来，宗教自由的权利被国家重申。第 39/1999 年权利法第 22 条规定：每个人自由根据其宗教和信仰信仰宗教并崇拜。这种宗教自由的权利被第
    39/1999 年第 70 条（art. 70）所限制，该法律允许对宗教自由进行允许的限制：在享受其权利和自由时，每个人都有义务遵守法律规定的限制，其目的是承认和尊重人的权利，并在民主社区中考虑道德、安全和秩序。


    ### 国家基督教委员会：代表基督教吗？


    基督徒在宗教部也得到了代表。由于殖民遗留，印尼的新教徒和天主教徒之间存在历史性的区分。基督徒被称为或自称为`Nazarani`或`Nasrani`——即耶稣的追随者。对这一词的使用有各种解释。Stevens
    和 Schmidgall-Tellings（2004: 65）声称`Nasrani`一词以前在印尼仅指代罗马天主教，而新教徒被称为`Masehi`（即救世主的追随者），但现在用于指代天主教徒和新教徒。我的信息通常暗示是受过良好教育的人使用`Nasrani`一词。这被认为更有礼貌（相对于`Kristen`），因为它是印尼语版《古兰经》中基督教阿拉伯语词的翻译。国家及其机构（如宗教部）通常用`Kristen`指新教徒，用`Katolik`指天主教徒。新教徒和天主教徒之间的这种清晰区分可以追溯到荷兰政府最初的政策，它区分了新教教会和主教教会，仅允许一个教会在任何区域工作。印尼教会委员会
    PPGI 主要包括长老会、路德派和加文派教会等许多组织。它在 1950 年 5 月由 27 个成员教会组成时，被称为印尼教会委员会（Dewan Gereja-gereja
    Indonesia, DGI）⁵⁴。它过去和现在最大的成员都是巴塔克教会（Nyhus, 1987: 84）。2010 年，PGI 的成员由 83 多个教会教派组成（PGI,
    2010）。在宗教部，基督徒也得到了代表。在印尼乌理玛的代表中，天主教徒是印尼乌理玛主教委员会（Kantor Waligereja Indonesia, KWI）⁵³。尽管本书没有从国际法和宗教自由权利的角度分析穆基督教关系，而是关注对宗教自由的本土理解，这证明了“宗教自由”已成为一种通用话语。


