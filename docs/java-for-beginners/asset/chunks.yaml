    \ list);\n    Return method 2 (parameter list);\n    Type final variable name\
    \ 1 = value;\n    Type final variable name 2 = value;\n    //…\n    Return type\
    \ method name n (parameter list);\n    Type final varname n = value;\n}\n```\n\
    \n简单接口只包含一个函数或方法，被称为回调函数。\n\n例如\n\n```java\nInterface callback\n{\n    Void callback\
    \ (int parm);\n}\n```\n\n### 实现接口\n\n创建任何接口的实现类都包含在类的定义中。\n\n例如\n\n```java\nClass\
    \ client call back\n{\n    Public void callback (int x)\n    {\n        System.out.println\
    \ (“callback” + x);\n    }\n}\n```\n\n![Image](img/page-divider.png)\n\n## 异常处理\
    \ (Exceptional Handling)\n\n这是一个影响 java 程序性能的缺点，因为它可以发生在任何点。它的发生处于执行状态下。\n\n###\
    \ 原因\n\n- 无效数据\n- 文件不存在\n- JVM 运行时网络连接丢失和超时。\n\n常见的异常有：\n\n- `Checked`（检检异常）-\
    \ 这些异常无法由程序员预测，而且在执行期间甚至无法被忽略。\n- `Runtime`（运行时异常）- 这是一种动态异常，但与检异常不同，它可以被忽略。\n\
    - `Errors`（错误）- 这些也会被忽略，因为无法做什么来克服它，而且这不受程序员控制。\n\n![Image](img/exception.png)\n\
    \n异常层次结构\n\n它分为两个部分：输入输出异常类和运行时异常类。\n\n### throw (抛出)\n\n这些是 JVM 在运行时抛出的异常。\n\n\
    #### 语法\n\n```java\nthrow Throwableinstance;\n```\n\n![Image](img/throw.png)\n\
    \n### throw (抛出)\n\n当使用此语句时，程序的执行立即停止。\n\n例如\n\n```java\nClass throwdem\n{\n \
    \   Static void demopro ( )\n    {\n        Try {\n            Throw new NullPointerException\
    \ (“dem “);\n        } catch (NullPointerException e)\n        {\n           \
    \ System.out.println (“caught inside demipro. “);\n            Throw e;\n    \
    \    }\n    }\n    Public static void main (string args [ ] {\n        Try {\n\
    \            Demopro ( );\n        }\n        Catch (NullPointerException e) {\n\
    \            System.out.println (recatch: “+ e);\n        }\n    }\n}\n```\n\n\
    ### finally\n\n它是在执行 try 和 catch 块之前或之后完成后执行的代码。\n\n#### 语法\n\n```java\nClass\
    \ finally dem\n{\n    Static void pro x ( )\n    {\n        Try {\n          \
    \  System.out.println (“in proc x”);\n            Throw new runtimeException (“demo”);\n\
    \        }\n        Finally\n        {\n            System.out.println (“pro x\
    \ finally”);\n        }\n    }\n}\n```\n\n![Image](img/page-divider.png)\n\n##\
    \ 事件处理 (Event handling)\n\n### 事件 (Event)\n\n它显示源状态的变化。\n\n### 事件源 (Event sources)\n\
    \n它是生成事件的对象。\n\n#### 语法\n\n```java\nPublic void add TypeListener (TypeListner\
    \ l)\n```\n\n例如\n\n- `Addkeylistner ()` - 注册键盘事件。\n- `Addmousemotionlistner ()`\
    \ - 注册鼠标移动监听器。\n\n### 事件类 (Action Event Class)\n\n这在按钮被按下时发生。双击项目或选择菜单中的任何项目。\n\
    \n![Image](img/event-occurrence.png)\n\njava 中的事件发生\n\n### 键键事件类 (Key event class)\n\
    \n它由键盘按键输入产生，有三种类型。\n\n1. `KEY_PRESSED`\n2. `KEY_RELEASED`\n3. `KEY_TYPED`\n\n\
    ### 鼠标事件类 (Mouse event class)\n\n有八种鼠标事件类。\n\n1. `MOUSE_DRAGGED`\n2. `MOUSE_CLICKED`\n\
    3. `MOUSE_ENTERED`\n4. `MOUSE_EXITED`\n5. `MOUSE_MOVED`\n6. `MOUSE_PRESSED`\n\
    7. `MOUSE_RELEASED`\n8. `MOUSE_WHELED`\n\n### 监听器接口 (Action listener interface)\n\
    \n它用于定义调用事件时执行的操作。它用于感知方法的响应。\n\n![Image](img/page-divider.png)\n\n## Applet 类\
    \ (The Applet class)\n\n它包含了用于 java 执行和详细控制的方法。Applet 的初始化和终止如下：\n\n### 开始 (Starting)\n\
    \n- `init()` - 初始化方法，它是第一个方法。\n- `start()` - 初始化方法之后调用此方法，其功能是重启或在屏幕上显示。\n- `paint()`\
    \ - 每次调用它时都会重绘 applet 的输出。\n\n### 停止 (Stopping)\n\n- `stop()` - 用于离开打开并包含 applet\
    \ 的浏览器。\n- `destroy()` - 用于从内存中移除 applet。\n\n![Image](img/applet.png)\n\n### Applet\
    \ 生成 (Applet generation)\n\nHTML applet 标签\n\n```html\n<APPLET\n[CODEBASE= codebaseurl]\n\
    CODE=applet file\n[ALT=alternatetext]\n[NAME=appletinstancename]\nWIDTH=pixels\
    \ HEIGHT=pixels\n[ALIGN=alignment]\n[VSPACE=pixels] [HSPACE=pixels]\n>\n[PARANAME=attribute\
    \ name VALUE= attributevalue>]\n…\n[没有 java 时显示的 HTML]\n</APPLET>\n```\n\n![Image](img/html-applet-tag.png)\n\
    \nHTML applet 标签\n\n音频接口 (Audioclip interface)\n\n- `play()` - 开始音频。\n- `stop()`\
    \ - 停止音频。\n- `loop()` - 无断循环播放。\n\nApplet 子接口 (Applet sub interface)\n\n它提供了一个\
    \ Applet 和浏览器之间进行通信的链接。\n\n![Image](img/page-divider.png)\n\n感谢阅读\n\n知识流书籍！\n\n\
