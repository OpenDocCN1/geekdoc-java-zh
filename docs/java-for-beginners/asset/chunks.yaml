    \ is one”;\n                Break;\n        }\n        Break;\n    Case 2: //...\n\
    }\n```\n\n#### `switch` 语句的重要特性是：\n*   与 `if` 不同，`Switch` 语句只能检查相等性。\n*   在同一个\
    \ `switch` 中不能有两个具有相同值的 case 常量。\n*   它比使用一组嵌套的 `if` 语句更有效。\n\n## 迭代语句\n\n这些语句用于创建循环。`java`\
    \ 中使用了三种类型的迭代语句。\n\n### `While` 语句\n\n它的功能是在控制表达式为真时重复或阻塞执行语句。\n\n#### 语法\n\n\
