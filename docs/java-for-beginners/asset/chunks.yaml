    \n![Image](images/page-divider.png)\n\n## Data Types\n\n### Integers\nIt includes\
    \ whole valued signed numbers which are as follow.\n\n- `Byte`: Whose width is\
    \ 8 and it ranges from -128 to 127. It is the smallest integer type. It is useful\
    \ when user is dealing with stream or flowing data from a network or a file.\n\
    Declaration of two `byte` variables called `x` and `y` is as follow:\n```java\n\
    Byte x, y;\n```\n\n- `Short`: The width of this type of integer is 16 and it ranges\
    \ from -32,768 to 32,767. It is the least commonly used data type in `java`.\n\
    Declaration:\n```java\nShort a;\nShort b;\n```\n\n- `Int`: The width of this type\
    \ of integer is 32 and it ranges from -2,147,483,648 to 2,147,483,647. It is more\
    \ efficient as compared to `byte` and `short`. It is commonly used to control\
    \ loops and indexed arrays.\nDeclaration:\n```java\nInt a;\n```\n\n- `Long`: The\
    \ width of this type of integer is 64 and it ranges from -9,223,372,036,854,775,808\
    \ to 9,223,372,036,854,775,807. This is used for those values which are large\
    \ enough that the integer cannot handle them.\nDeclaration:\n```java\nInt light\
    \ speed;\nLong days;\nLong second;\nSeconds = days *24 *60*60;\n```\n\n### Floating\
    \ point type\nThis is for real numbers used for calculation such as square roots,\
    \ sine and cosine. These are of two types.\n\n- `Float`: Width in bits is 32 and\
    \ range is from 1.4e-045 to 3.4e + 038. `Float` is used as a variable type for\
    \ the fractional component, but specifies single precision. It can be used in\
    \ representing dollars and cents.\nDeclaration:\n```java\nFloat hightemp;\n```\n\
    \n- `Double`: Width in bits is 64 and range is from 4.9e-324 to 1.8e + 308. it\
    \ is used and is optimized in such a way that I can be used for high speed mathematic\
    \ calculation. It has double precision which is faster than the single precision.\
    \ Function such as `sin()` and `sqrt()` etc, return `double` values.\nDeclaration:\n\
    ```java\nDouble pi, r, a;\nr = 10.4;\npi = 3.14;\na = pi* r * r;\n```\n\n### Characters\n\
    - The data type used to store or declare character in `java` is `char`.\n- It\
    \ is 16-bit type in `java`. Range of a `char` is 0 to 65,536.\n- There are no\
    \ `chars` which are negative in nature.\n\nProgram demonstration for `char`:\n\
    ```java\nClass charExample\n{\nPublic static void main (String args []) {\n  \
    \  Char a, b;\n    a=88;\n    b=’y’;\n    system.out.print (“a and b: “);\n  \
    \  system.out.println (a + “ “ +b);\n}\n}\n```\n\n### Booleans\n- It is a primitive\
    \ type for logical values.\n- This tends have only one of two possible values,\
    \ `true` or `false`.\n- It is governed by `if` or `for` control statements.\n\n\
    ## Variables\nIt is basic unit of storage and variables have scope, visibility\
    \ and lifetime.\n\nDeclaration of variables:\n```java\nInt x, y, z;\n```\nOr\n\
    ```java\nInt x=1, y=2, z=5;\n```\n\n## Type conversion and casting\nIf there is\
    \ any compatibility existing between two types then `java` would automatically\
    \ performs the conversion.\n\n#### Java automatic conversion\n- It will be performed\
    \ when two conditions are met.\n- When the two types are compatible;\n- Destination\
    \ type is larger than the source type.\n- After the two conditions are been satisfied\
    \ a widening conversion takes place.\n\n#### Casting compatible types\n- It is\
    \ a simple and explicit type of conversion.\n- When a floating type of conversion\
    \ is attached to an integer type this type of conversion is called truncation.\n\
    - It is a kind of conversion sometime called narrowing conversion.\n\n## Arrays\n\
    It is a group of similar variables that would be referred by a common name. The\
    \ element available in the array is accessed through index. This can be created\
    \ and may have one or more dimension.\n\n### Types of arrays\nThere are two main\
    \ types of arrays:\n1. One-dimensional arrays\n2. Multi-dimensional arrays\n\n\
    ### One-dimensional Arrays\nIt’s a list of similar types of data. Before you create\
    \ array you need to create a variable of any type.\nSyntax:\n```java\nType variable-name\
    \ [ ];\nInt year_month [ ];\n```\n\n### Multi-dimensional Arrays\nIt is arrays\
    \ of arrays need to specify each dimensional array variables, additional index\
    \ using other square brackets represented as.\n```java\nInt twoD [ ] [ ] = new\
    \ int [6] [7];\n```\n![Image](images/page-divider.png)\n\n## Operators\nThere\
    \ are four main types of operator:\n- Arithmetic operators\n- Bitwise operators\n\
    - Relational operators\n- Boolean logical operators\n\n### Arithmetic operators\n\
    \ Addition Addition: This operator is used to add the values. It is represented\
    \ by `+`. For example `A = a + 4`.\n- Subtraction: This operator is used to subtract\
    \ the values. It is represented by `-`. For example `A = a - 4`.\n- Multiplication:\
    \ This operator is used to multiply the values. It is represented by `*`. For\
    \ example `A = a * 4`.\n- Division: This operator is used to divide the values.\
    \ It is represented by `/`.\n- Modulus: This operator is used to find the remainder.\
    \ It is represented by `%`. For example `A = 4`.\n- Increment: This operator is\
    \ used to increase its values. It is represented by `++`. For example `a++`.\n\
    - Decrement: This operator is used to decrease its operands. It is represented\
    \ by `--`. For example `a--`.\n\n### Bitwise operators\n- Unary NOT: This inverts\
    \ all of the bits. It is represented by `~`.\n- And: It produces 1 if both operands\
    \ are 1. It is represented by `&`.\n- OR: If either of operand is one it is represented\
    \ by `|`.\n- XOR: If either of operand is one but not both, it is represented\
    \ by `^`.\n- Left shift: It shifts or moves all of the bits to the left side.\
    \ It is represented by `<<`.\n- Right shift: It shifts or moves all of the bits\
    \ to the right side. It is represented by `>>`.\n\n### Relational operators\n\
    - Equal to: This operator shows that the values are equal to each other. It is\
    \ represented by `==`.\n- Not equal to: This relation operator shows that the\
    \ values are not equal to each other. It is represented by `!=`.\n- Greater than:\
    \ This operator shows that one value is greater when compared to other. It is\
    \ represented by `>`.\n- Less than: This operator shows that one value is less\
    \ when compared to other. It is represented by `<`.\n- Greater than or equal to:\
    \ This shows that one value is greater or equal but not less compared to other.\
    \ It is represented by `>=`.\n- Less than or equal to: This shows that one value\
    \ is smaller or equal but not greater compared to other. It is represented by\
    \ `<=`.\n\n### Boolean logical operators\n- Logical AND: It is represented by\
    \ `&`.\n- Logical OR: It is signed `|`.\n- Logical XOR: It is shown using `^`.\n\
    - Logical Unary Not: It is depicted as `!`.\n\n### Assignment operators\nThe assignment\
    \ is the single equal sign that is represented by `=`.\nGeneral representation:\n\
    ```java\nvar = expression;\n```\nIn this the variable, which is represented as\
    \ `var` should be compatible with the type of `expression`.\n```java\nInt a, b,\
    \ c;\na = b = c = 100;\n```\n\n### ? Operator\nThis is used for replacement of\
    \ if then else statements and it is represented as `?`.\nFor example:\n```java\n\
    expression a ? expression b : expression c\n```\n"
