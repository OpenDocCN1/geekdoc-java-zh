  trans: "\n\n# 在 `java cmd` 中调用文件\n\n调用文件：“Example.java”。\n\n![Image](img/page-divider.png)\n\
    \n## 数据类型\n\n### 整数\n它包括以下带符号的整数。\n\n- `Byte`: 宽度为 8 位，范围从 -128 到 127。它是最小的整数类型。当用户处理来自网络或文件的流或流动数据时它非常有用。\n\
    两个名为 `x` 和 `y` 的 `byte` 变量声明如下：\n```java\nByte x, y;\n```\n\n- `Short`: 这种整数的宽度为\
    \ 16 位，范围从 -32,768 到 32,767。它是 `java` 中不常用的数据类型。\n声明：\n```java\nShort a;\nShort\
    \ b;\n```\n\n- `Int`: 这种整数的宽度为 32 位，范围从 -2,147,483,648 到 2,147,483,647。与 `byte`\
    \ 和 `short` 相比，它更高效。它通常用于控制循环和索引数组。\n声明：\n```java\nInt a;\n```\n\n- `Long`: 这种整数的宽度为\
    \ 64 位，范围从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。它用于那些整数无法处理的大数值。\n\
    声明：\n```java\nInt light speed;\nLong days;\nLong second;\nSeconds = days *24 *60*60;\n\
    ```\n\n### 浮点类型\n这是用于用于计算的实数，如平方根、正弦和余弦。它们分为类型。\n\n- `Float`: 宽度为 32 位，范围从 1.4e-045\
    \ 到 3.4e + 038。`Float` 用作小数部分的变量类型，但指定为单精度。它可以用于表示美元和分。\n声明：\n```java\nFloat hightemp;\n\
    ```\n\n- `Double`: 宽度为 64 位，范围从 4.9e-324 到 1.8e + 308。它被使用并经过优化，可以用于高速数学计算。它具有双精度，比单精度更快。诸如\
    \ `sin()` 和 `sqrt()` 等函数返回 `double` 值。\n声明：\n```java\nDouble pi, r, a;\nr = 10.4;\n\
    pi = 3.14;\na = pi* r * r;\n```\n\n### 字符\n- `java` 中用于存储或声明字符的数据类型是 `char`。\n\
    - 它是 `java` 中的 16 位类型。`char` 的范围是 0 到 65,536。\n- 本质上没有负数的 `chars`。\n\n`char` 的程序演示：\n\
    ```java\nClass charExample\n{\nPublic static void main (String args []) {\n  \
    \  Char a, b;\n    a=88;\n    b=’y’;\n    system.out.print (“a and b: “);\n  \
    \  system.out.println (a + “ “ +b);\n}\n}\n```\n\n### 布尔型\n- 它是逻辑值的原始类型。\n- 它倾向于只有两个可能值之一，`true`\
    \ 或 `false`。\n- 它受 `if` 或 `for` 控制语句支配。\n\n## 变量\n它是存储的基本单元，变量具有作用域、可见性和生命周期。\n\
    \n变量声明：\n```java\nInt x, y, z;\n```\n或\n```java\nInt x=1, y=2, z=5;\n```\n\n##\
    \ 类型转换与强制转换\n如果两个类型之间存在任何兼容性，`java` 将自动执行转换。\n\n#### Java 自动转换\n- 它在满足两个条件时执行。\n\
    - 当两个类型兼容时；\n- 目标类型大于源类型。\n- 在两个条件都满足后，会发生宽转换。\n\n#### 强制转换兼容类型\n- 这是一种简单且显式的类型转换。\n\
    - 当浮点类型转换附加到整数类型时，这种转换被称为截断。\n- 这是一种转换，有时被称为窄化转换。\n\n## 数组\n它是相似变量的组，通过共同名称引用。数组中的可用元素通过索引访问。它可以被创建，并可能有一个或多个维度。\n\
    \n### 数组的类型\n数组主要有两种类型：\n1. 一维数组\n2. 多维数组\n\n### 一维数组\n它是相似类型数据的列表。在创建数组之前，你需要先创建一个任意类型的变量。\n\
    语法：\n```java\nType variable-name [ ];\nInt year_month [ ];\n```\n\n### 多维数组\n\
    它是数组的数组，需要指定每个维度数组变量，使用其他方括号表示的额外索引。\n```java\nInt twoD [ ] [ ] = new int [6]\
    \ [7];\n```\n![Image](img/page-divider.png)\n\n## 运算符\n有四种主要的运算符：\n- 算术运算符\n-\
    \ 位运算运算符\n- 关系运算符\n- 布尔逻辑运算符\n\n### 算术运算符\n- 加法 Addition：此运算符用于相加值。用 `+` 表示。例如\
    \ `A = a + 4`。\n- 减法：此运算符用于减去值。用 `-` 表示。例如 `A = a - 4`。\n- 乘法：此运算符用于相乘值。用 `*`\
    \ 表示。例如 `A = a * 4`。\n- 除法：此运算符用于除值。用 `/` 表示。\n- 取模 Modulus：此运算符用于寻找余数。用 `%` 表示。例如\
    \ `A = 4`。\n- 递增 Increment：此运算符用于增加其值。用 `++` 表示。例如 `a++`。\n- 递减 Decrement：此运算符用于减少操作数。用\
    \ `--` 表示。例如 `a--`。\n\n### 位运算运算符\n- 一元取反 NOT：它反转所有位。用 `~` 表示。\n- 与逻辑 And：如果两个操作数均为\
    \ 1，则产生 1。用 `&` 表示。\n- 逻辑或 OR：如果任一操作数为 1，则用 `|` 表示。\n- 异或 XOR：如果其中一个操作数为 1 但不是两者，则用\
    \ `^` 表示。\n- 左移：它将所有位向左侧移动。用 `<<` 表示。\n- 右移：它将所有位向右侧移动。用 `>>` 表示。\n\n### 关系运算符\n\
    - 等于 Equal to：此运算符显示值相等。用 `==` 表示。\n- 不等于 Not equal to：此关系运算符显示值不相等。用 `!=` 表示。\n\
    - 大于 Greater than：此运算符显示一个值比另一个值大。用 `>` 表示。\n- 小于 Less than：此运算符显示一个值比另一个值小。用\
    \ `<` 表示。\n- 大于等于 Greater than or equal to：这显示一个值大于或等于另一个值而不小于。用 `>=` 表示。\n- 小于等于\
    \ Less than or equal to：这显示一个值小于或等于另一个值而不大于。用 `<=` 表示。\n\n### 布尔逻辑运算符\n- 逻辑与 AND：用\
    \ `&` 表示。\n- 逻辑或 OR：符号为 `|`。\n- 逻辑异或 XOR：使用 `^` 显示。\n- 逻辑一元取反 Unitary Not：显示为\
    \ `!`。\n\n### 赋值运算符\n赋值是等号，用 `=` 表示。\n通用表示：\n```java\nvar = expression;\n```\n\
    在此处，表示 `var` 的变量应与 `expression` 的类型兼容。\n```java\nInt a, b, c;\na = b = c = 100;\n\
    ```\n\n### ? 运算符\n这用于替换 if then else 语句，并用 `?` 表示。\n例如：\n```\nexpression a ? expression\
    \ b : expression c\n```\n\n"
- fmt: "\nThis above example states that if the expression `a` is true then expression\
    \ `b` is evaluated otherwise expression `c` is evaluated.\n\n![Image](images/page-divider.png)\n\
    \n## Control Statements\n\nThere three types of statements in `java`.\n\n1.  Selection\
    \ statements\n2.  Iteration statements\n3.  Jump statements\n\n## Selection statements\n\
    \n*   It is to manage the flow of programs that is to be executed based on the\
    \ dynamic conditions which can be only realized during the run time.\n*   It provides\
    \ flexibility.\n\n### `If` statement\n- It provides different paths for execution\
    \ of program.\n\n#### Syntax\n\n```\nIf (condition provided) statement a;\n\n\
    Else\nStatement b;\n```\n\nThis means if the condition is true, then `statement\
    \ a` is executed but if false then `statement b` is executed.\n\n#### For example\n\
    ```\nint a, b;\n\nIf (x < y) a=0;\n\nElse\nb=0; own```\n\nNow there is one type\
