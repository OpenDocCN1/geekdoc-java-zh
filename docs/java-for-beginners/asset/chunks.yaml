    ## Java 简介


    Java 由 James Gosling、Patrick Naughton、Chris Warth、Ed Frank 和 Mike Sherdan 于 1991
    年在 Sun Microsystems 设计和构思。`java` 花了几乎 18 个月才出现一个可运行的版本。最初 `java` 被称为“Oak”，随后在
    1995 年更名为“Java”。由于 `java` 的许多特性是设计自 `C` 和 `C++`。


    这种继承了这两种知名且简单的编程语言的特性，使得 `java` 对计算机行业巨头更具吸引力，从而导致了大规模的成功。但 `java` 被误解为 `C++`
    的复杂的互联网版本。在实践和哲学上，它与 `C++` 有显著区别。如果你有良好的 `C++` 知识，你会发现 `java` 是你的菜，并且在使用和理解 `java`
    时感到轻松。


    ![Image](img/java-logo.jpeg)


    Java Logo


    因此，计算机语言的进化有两个主要原因。


    Java 增强并完善了 `C++` 的面向对象场景。这为用户提供了更多功能，如下：


    - 多线程。

    - 提供便捷互联网访问的库。

    - `java` 的魔力之一是字节码。字节码是一组高度优化的指令集，设计用于由 `JVM`（Java 虚拟机）执行。它是字节码的解释器。这导致了真正具有可移植性程序的设计。


    Java 通过新的功能和网络程序重新设计了互联网，这些如下：


    - Applets - 这是一种 `java` 程序，可以通过兼容 `java` 的网络浏览器传输并自动执行。

    - 安全 - 它提供了从互联网下载各种 applet 和程序的安全性，且不包含任何病毒或木马。

    - 可移植性 - 由于存在大量且不同的操作系统，因此它提供了在任何操作系统上运行的自由，因此其程序可以在不同的操作系统中使用，而不会出现任何兼容性问题。


    `java` 的进化如下：


    - Java 1.0

    - Java 1.1

    - Java 1.2

    - J2SE

    - J2SE 1.2

    - J2SE 1.3

    - J2SE 1.4

    - J2SE 5

    - J2SE 5 对 Java 进行了各种更改


    新增的功能如下：


    - 泛型 (Generics)

    - 注解 (Annotations)

    - 自动装箱和自动拆箱 (Auto boxing and auto-unboxing)

    - 枚举 (Enumerations)

    - 增强型 for-each 循环

    - 变长参数 (Variable-length arguments)

    - 静态导入 (Static import)

    - 格式化 I/O (Formed I/O)

    - 并发工具类 (Concurrency utilities)


    在 J2SE 5 中，开发工具包被称为 `JDK 5`。


    在 J2SE 5 中，开发工具包被称为 `JDK 5`。


    ## Java 特性


    ![Image](img/page-divider.png)


    ### 面向对象编程


    - 这是 `java` 的核心特性。

    - 它提供了良好的定义良好的接口。

    - `java` 的另一个重要特性是抽象性。

    - 这种抽象来管理复杂性。


    ### OOP 原则


    - **封装**: 它保护数据免受外部干扰和误用。通过包装器实现。

    - 这防止了外部源访问数据。


    ![Image](img/encapsulation.png)

    封装


    在 Java 中的封装


    - **继承**: 在此对象可以获取其他对象的属性。它遵循分级概念。

    - 它包含类和子类。

    - 这种特性是面向对象的。

    - 继承也可以与封装进行交互。


    ![Image](img/inheritance.png)

    继承


    - **多态**: 它意味着有多种执行方法的方法。


    ![Image](img/polymorphism.png)

    多态


    ### 字节码


    这是一组高度优化的指令，设计用于由虚拟机执行。


    ### JVM


    - 它被设计为字节码的解释器。

    - `java` 的另一个特性是简单。

    - 这使得专业人士能够学习。

    - 以非常有效的方式工作，但也容易理解。


    ### 健壮性


    创建健壮的多平台程序的能力在 Java 设计中被赋予极高优先级。


    ### 多线程


    `java` 满足了现实世界的需求，有助于创建交互式和网络程序。


    ### 高性能


    - 多平台运行程序的优势有助于找到跨平台解决方案。

    - 通过 `java` 运行时系统的帮助提供了平台无关代码的优势。


    ### 分布式


    - 这是因为它是为互联网设计的，由于处理了 TCP/IP 协议具有分布式环境。

    - 这允许程序跨网络发现方法。

    - `URL` 用于访问互联网上的文件。

    - 该属性支持 `RMI`（远程方法调用）。


    ### 动态


    - 这是在运行时采取的操作，例如解析、验证和添加对象。

    - 它为我们提供了函数，允许我们动态地链接代码，这种方式是安全的。


