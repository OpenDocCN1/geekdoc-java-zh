    \n#### 语法\n\n```\nIf (condition provided) statement a;\n\nElse\nStatement b;\n\
    ```\n\n这意味着如果条件为真，则执行 `statement a`；但如果条件为假，则执行 `statement b`。\n\n#### 示例\n```\n\
    int a, b;\n\nIf (x < y) a=0;\n\nElse\nb=0; \n```\n\n现在有一类使用 `if` 语句的程序类型，即嵌套 `if`\
    \ 语句，这在编程世界中是非常常见的方法。\n\n#### 示例\n```\nIf (a == 10) {\n    If (b < 15) i = j;\n\
    \    If (c > 50) p = q;\n    Else\n    i = p;\n}\nElse\n    i = q;\n```\n\n现在，括号中的第二个\
    \ `if` 语句与 `else` 关联。另一种使用 `if` 语句的程序类型是 `if-else-if` 阶梯语句。\n\n#### 示例\n```\n\
    If (condition)\nStatement;\n\nElse if (condition)\nStatement;\n\nElse if (condition)\n\
    Statement;\n\n...\n\nElse\nStatement;\n```\n\n### `Switch` 语句\n\n这是一个多分支语句。\n\n\
    #### 语法\n\n```\nSwitch (expression)\n{\n    Case value 1:\n        Statement\n\
    \        Break;\n    Case value 2:\n        Statement\n        Break;\n...\n \
    \   Case vale n:\n        Statement\n        Break;\n    Default:\n        Statement;\n\
    }\n```\n\n`switch` 语句的功能是将给定的值与所有 case 进行比较，当找到匹配项时，执行程序序列。\n\n#### 示例\n```java\n\
    Class sampswitch {\n    Public static void main (string args [])\n    {\n    \
    \    Switch (i)\n        {\n            Case0:\n                System.out.println\
    \ (“i is zero.”);\n                Break;\n            Case1:\n              \
    \  System.out.println(“i is one.”)\n                Break;\n            Default:\n\
    \                System.out.println (“i is greater than 4.”)\n        }\n    }\n\
    }\n```\n\n#### 输出\n```\ni is zero.\ni is one.\ni is greater than 4.\ni is greater\
