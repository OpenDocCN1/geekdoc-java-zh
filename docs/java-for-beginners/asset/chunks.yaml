    ```\nContents:\nI and j: 8 7\na: 9\nSum of i, j and a: 24\n```\n\n## 重写\n\n* \
    \  当子类与父类的方法相同时，这种场景被称为方法重写。\n*   它为 `java` 提供了多态性特性。\n\n![Image](img/inheritance-showing-overriding.png)\n\
    \n### 继承显示重写\n\n示例代码\n```java\nClass x {\n    int a, b;\n    X (int p, int q)\n\
