    and it is represented by “==”.


    Not equal to- This relation operator shows that the values are not equal to each
    other and it is represented by “!=”.


    Greater than- This relation operator shows that one value is greater when compared
    to other and it is represented by “>”.


    Less than-This relation operator shows that one value is less when compared to
    other and it is represented by “<”.


    Greater than or equal to- This relation operator shows that one value is greater
    or equal but not less when compared to other and it is represented by “>=”.


    Less than or equal to-This relation operator shows that one value is smaller or
    equal but not greater when compared to other and it is represented by “<=”.


    Boolean logical operators


    Logical AND- It is represented by “&”.


    For example


