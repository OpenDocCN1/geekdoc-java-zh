    \  Int n;\n        For (n=11; n>0; n--);\n    }\n}\n```\n\n## 跳跳语句\n\n`Java` 支持三种跳转语句，如下：\n\
    \n1.  `Break`\n2.  `Continue`\n3.  `Return`\n\n### `Break`\n\n它用于终止 `switch` 语句中的语句。\n\
