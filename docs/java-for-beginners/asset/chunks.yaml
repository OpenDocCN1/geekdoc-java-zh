    by “*“. For example A = a * 4.


    *   Division-This operator is used to divide the values. It is represented by
    “/“. For example A = a / 4.


    *   Modulus- This operator is used to find the remainder of the values when divided.
    It is represented by “%“. For example A = 2 % 4\. Where A = 0.


