    \ overload ();\n        ob.test ();\n        ob.test (10);\n        ob.test (10,\
    \ 20);\n        ob.test (125);\n    }\n}\n```\n\n## 继承\n\n继承是子类自父类，这种类被称为子类。\n\
    \n![Image](img/inheritance.png)\n\n### 继承的基础程序\n```java\nClass x\n{\n    int i,\
