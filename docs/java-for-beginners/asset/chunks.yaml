    Logical XOR- It is shown using “^”.


    For example


    A ^ B = If a is false and b is true it results as true, but is both are true it
    results as false. Similarly when both are false it results as false.


    Logical Unary Not- It is depicted as “!”.


    For example


    ! A = If a is false it results as true, but if a is true it results as false.


