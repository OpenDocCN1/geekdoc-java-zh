    ![Image](images/page-divider.png)\n\n## Introduction to Java\n\nJava was designed\
    \ and conceived by James Gosling, Patrick Naughton, Chris Warth, Ed Frank and\
    \ Mike Sherdan, which was done at Sun Microsystems in year 1991. It took almost\
    \ 18 months for `java` to come into existence as a working version. Initially\
    \ `java` was known as “Oak”, which was then renamed as “Java” in year 1995. Since\
    \ `java` had much had much of its character designed from `C` and `C++`.\n\nThis\
    \ character inherited by the two well known and simple programming makes `java`\
    \ more appealing to computer and it giants which would lead to a large scale success.\
    \ But `java` is misunderstood as the sophisticated internet version representation\
    \ of `C++`. It has significant difference practically and philosophically when\
    \ compared to `C++`. If you have good knowledge in `C++` then you will find `java`\
    \ as your cup of tea and you will at ease using and understanding `java`.\n\n\
    ![Image](images/java-logo.jpeg)\n\nLogo of Java\n\nTherefore, there are two main\
    \ reasons for the evolution of the computer languages.\n\nJava had enhanced and\
    \ refined the object oriented scenario of `C++`. This gave more features to the\
    \ users which are as follows.\n\n- Multithreading.\n- Library which would provide\
    \ easy internet access.\n- One of the `java`’s magic was the byte code. Byte code\
    \ is set of instruction which is highly optimized and designed to be executed\
    \ by `JVM` (Java Virtual Machine). It is an interpreter for byte code. This lead\
    \ to the design of truly portable programs.\n\nJava redesigned the internet with\
    \ new feature and networked program which are as follows.\n\n- Applets - It is\
    \ a kind of `java` program that is to be transmitted over and executed automatically\
    \ by `java` compatible web browsers.\n- Security - It provided the security of\
    \ downloading various applets and programs from internet without containing any\
    \ virus or Trojan horses.\n- Portability- Since there is large and different kind\
    \ of operating systems therefore it provides the freedom of running in any operating\
    \ system so its program can be used in different OS without any issues of compatibility.\n\
    \nThe evolutions in `java` are as follows.\n\n- Java 1.0\n- Java 1.1\n- Java 1.2\n\
    - J2SE\n- J2SE 1.2\n- J2SE 1.3\n- J2SE 1.4\n- J2SE 5\n- J2SE 5 made various changes\
    \ to Java\n\nThe new feature that was added is as follow:\n\n- Generics\n- Annotations\n\
    - Auto boxing and auto-unboxing\n- Enumerations\n- Enhanced, for-each style for\
    \ loop\n- Variable-length arguments\n- Static import\n- Formed I/O\n- Concurrency\
    \ utilities\n\nIn J2SE 5, and the developers kit was called `JDK 5`. 1.5 used\
    \ as internal version number and this is referred as developer version number.\n\
    \nJava became the center of innovation in computer technological world. The existence\
    \ of `JVM` and byte code changed the scenario of security and portability in the\
    \ programming world. The way the new ideas are put into the language has been\
    \ redefined by the JCP i.e. java community process.\n\n![Image](images/page-divider.png)\n\
    \n## Features of Java\n\n### Object-oriented programming\n\n- This is the core\
    \ feature of `java`.\n- This is to manage the increase in the complexity.\n- It\
    \ provides a very sophisticated and well defined interface for the data.\n- It\
    \ is also known as data controlling access code.\n- Another important feature\
    \ of `java` being object oriented is abstraction.\n- Complexity can be managed\
    \ using abstraction.\n\n### The three OOP principles\n\n- **Encapsulation**: Its\
    \ agenda is to manipulate the data and keep the data isolated and safe from the\
    \ external interference and misuse. The encapsulation is done by the use of the\
    \ protective wrapper. This prevents the external sources from accessing the data\
    \ or the code.\n\n![Image](images/encapsulation.png)\nEncapsulation in Java\n\n\
    - **Inheritance**: In this this the object would acquire the property of other\
    \ object present. It just follows the concept of the hierarchical classification.\
    \ This consists of classes, sub classes. Inheritance also is linked or interacts\
    \ with encapsulation as well.\n\n![Image](images/inheritance.png)\nInheritance\n\
    \n- **Polymorphism**: It is means many ways to carry out the method but from one\
    \ input.\n\n![Image](images/polymorphism.png)\nPolymorphism\n\n### Byte code\n\
    \nThis is highly optimized by set of instructions designed which is designed to\
    \ be executed by Java virtual machine that is `JVM`.\n\n### JVM\n\n- It was designed\
    \ as an interpreter for the byte code.\n- Another feature of `java` program is\
    \ that it is simple.\n- This enables the professionals to learn.\n- Work in a\
    \ very effective manner but it is also very easy to understand.\n\n### Robust\n\
    \nThe ability that includes creating a robust program that can be a multiplatform\
    \ program are given a very high priority in design of Java.\n\n### Multithreading\n\
    \nThe real world requirements are met by `java` which helps to achieve the requirement\
    \ of creating interactive and networked programs.\n\n### High performance\n\n\
    - The advantage of being a multi platform functioning program helps to find the\
    \ cross platform solution.\n- It provides benefits of being an platform independent\
    \ code with the help of `java` run time system.\n\n### Distributed\n\n- This is\
    \ because it is been designed for the internet which has a distributed environment\
    \ because of the handling of TCP/IP protocols.\n- This allows the program to find\
    \ out methods across a network.\n- `URL` is used in this to access a file on internet.\n\
    - This property supports `RMI` (Remote Method Invocation).\n\n### Dynamic\n\n\
    - This is the action that is taken during the run-time such as to resolve, verify\
    \ and add objects.\n- It provides us the function which will allow us to link\
    \ code dynamically that will be safe.\n\n### Simple program\n\n```java\n/* Call\
    \ this file “Example.java” */\nclass Example {\npublic static void main (string\
    \ args []) {\n    System.out.println (\"this is a simple java program.\");\n \
    \   }\n}\n```\n\nCommand line argument to pass the class name is\n\n```bash\n\
    C :\\> java Example\n```\n\nSimple output of the above program\n\n```\nthis is\
    \ a simple java program.\n```\n"
