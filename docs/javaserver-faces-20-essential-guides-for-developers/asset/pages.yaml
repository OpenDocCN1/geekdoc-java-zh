  md: '# CHAPTER 2


    # TEMPLATING WITH FACELETS


    JSF 2.0, Facelets is the default View Declaration Language (VDL) instead of JSP.
    As a result, you don''t need to configure a view handler as you did in JSF 1.2.
    Facelets is a Java-Server-centric view technology.


    Facelets is based on compositions. A composition defines a JSF user interface
    (UI) component structure in a Facelets page. A Facelets application may consist
    of compositions defined in different Facelets pages and run as an application.


    Facelets is a templating framework similar to Tiles. The advantage of Facelets
    over Tiles is that JSF components are pre-integrated with Facelets, and Facelets
    does not require a Facelets configuration file as Tiles does a Tiles configuration.


    JSF validators and converters may be added to Facelets. Facelets provides a complete
    expression language and Java Pages Tag Library (JSTL) support. Templating, reuse,
    and ease of development are some of the advantages of using Facelets in a Web
    application.


    In this chapter, you will develop a Facelets Web application in Oracle Developer
    12c and deploy the application to Oracle WebLogic 12c. In the application, you
    will add an input text component to an input Facelets page. With JSF navigation,
    the input Facelets page navigates to another Facelets page, which displays the
    JSF data generated from the SQL query specified in the input Facelets page. You
    will use Oracle Database 11g XE as the data source. Templating is demonstrated
    by including graphics for the header and the footer in the input and the output;
    the graphics have to be specified only once in the template.'
  merge: -1
  pgno: 19
