    \ CONSTRAINT ANNOTATIONS\n\nIn JSF 1.2, validation constraints could be applied\
    \ only using validator tags on the input component(s) in the JSF page. JSF 2.0\
    \ introduces validation constraints, which you can apply using annotations. Annotations\
    \ were introduced in J2SE 5.0, on the managed bean properties that bind to the\
    \ input components in the JSF page. The validation constraints are defined in\
    \ the javax.validation.constraints package. Some of the validation constraints\
    \ are described in Table 6.1.\n\n| Table 6.1 Validation Constraints |\n| Validation\
    \ Annotation | Description |\n|---|---|\n| @AssertFalse | This asserts that the\
    \ annotated element must be false. |\n| @AssertTrue | This asserts that the annotated\
    \ element must be true. |\n| @DecimalMax | This validates that the annotated element\
    \ is a number whose value is less than or equal to the specified maximum. |\n\
    | @DecimalMin | This validates that the annotated element is a number whose value\
    \ is greater than or equal to the specified minimum. |\n| @Digits | This validates\
    \ that the annotated element is a number within a specified range. |\n| @Future\
    \ | This validates that the annotated element is a date in the future. |"
