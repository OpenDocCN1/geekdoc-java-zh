  md: 'Setting the Environment 305


    You obtain the type attribute value as follows.

    String type=resource.getContentType();


    +   4. You render the <script/> element at the specified target. If the target
    attribute is not in the component attribute map, the script is rendered inline
    and a <script/> element is not added.


    The h:outputStylesheet tag is always rendered in the <head/> element as a <link/>
    element. The encoding process for this is follows:


    +   1. You invoke the UIViewRoot.addComponentResource(FacesContext, UIComponent,
    target) method with “head” as the last argument.

    2. A Resource object is created using the ResourceHandler’s createResource() method,
    like so:

    Resource resource=Application.getResourceHandler().createResource(name, library);

    name and library are obtained from the attribute map for the component. library
    may be null.

    3. The <link> element to be rendered requires the href attribute, the type attribute,
    and the media attribute. You obtain the href attribute value from the resource
    like so:

    String href=resource.getResourcePath();

    4. You obtain the type attribute value as follows:

    String type=resource.getContentType();

    You specify the stylesheet value in the rel attribute and the screen value in
    the media attribute.

    5. The <link> attribute is rendered in the <head> element.


