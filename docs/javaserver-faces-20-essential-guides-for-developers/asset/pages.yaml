  md: "# CREATING NAVIGATION\n\nNext, you will add navigation to the Facelets application.\
    \ The navigation section is much shorter than if you use JSF 1.2. In JSF 1.2,\
    \ you had to add navigation rules to the faces-config.xml file. JSF 2.0 provides\
    \ a default navigation between the outcome String value and any XHTML page of\
    \ the same name as the String value. In the managed bean, you added an outcome\
    \ value of \"output\" if no error is generated:\n\n```\nreturn \"output\";\n```\n\
    \nYou also added an outcome of \"error\" if an error is generated:\n\n```\nreturn\
    \ \"error\";\n```\n\nIf no error is generated, the application navigates to output.xhtml.\
    \ JSF 2.0 has simplified the managed bean configuration using the @ManagedBean\
    \ annotation. This simplifies the navigation rules configuration due to default\
