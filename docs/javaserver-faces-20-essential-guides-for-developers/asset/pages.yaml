- img_proc: true
  md: '# CHAPTER 8


    # CLIENT BEHAVIORS


    Behaviors are objects that are attached to user interface components to enhance
    a component''s functionality. They are not explicitly defined by the component
    implementation. JSF 2.0 defines a component behavior model with Behavior as the
    root interface. Different types of behavior contracts and interactions between
    behaviors and components are supported by the behavior API.


    Client behaviors are one implementation of behaviors. They define a mechanism
    for script-producing behaviors to attach scripts to components to be run on the
    client from client-side events. Client behaviors are a new feature in JSF 2.0,
    with additional client-side functionality can be added to components using scripts.
    A component obtains the script associated with a client behavior using the getScript()
    method and wires up script to a client-side event handler. Components must implement
    the ClientBehaviorHolder interface. ClientBehaviorHolder is similar to EditableValueHolder
    for components that require to support validators/converters.


    Note


    Chapter 3, "Ajax," discussed the f:ajax tag, which generated an AjaxEvent that
    was broadcast to the listener registered with the f:ajax tag. AjaxBehavior is
    an implementation of ClientBehavior.


    A basic requirement for the client behavior API is that the client behaviors and
    components should be loosely coupled. Components and client behaviors should be
    independent of each other, not dependent on a specific implementation from the
    other.'
  merge: -1
