    Adding the listener attribute to f:ajax.


    Source: Oracle Corporation.


    12. Set the listener attribute to the EL expression for the inputListener method
    in the managed bean catalog. f:ajax tag renders the dataTable data and binds to
    a listener inputTextListener(AjaxBehaviorEvent) in the managed bean:


    ```

    <h:inputText binding="#{catalog.inputText1}" required="true">

    <f:ajax execute="@form" keyup="dataTable1"

    listener="#{catalog.inputTextListener}"/>

    </h:inputText>

    ```


    The execute attribute specifies which components (separated, if multiple components
    are specified) of the JSF page participate in the execute portion of the request.
    The values in Table 3.1 may be specified.'
  merge: -1
