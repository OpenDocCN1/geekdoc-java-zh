  md: '# CHAPTER 6


    # ENHANCED VALIDATIONS


    Validation is the process of validating the value of an input component (EditableValueHolder)
    with a validation constraint. JSF 2.0 has introduced several new validation features,
    including the following:


    +   - Validation of empty fields

    - Integration with bean validation

    - A validator tag for regular expressions

    - A validator tag for a required value

    - Bean validation with custom validators


    This chapter discusses each of these new features.


