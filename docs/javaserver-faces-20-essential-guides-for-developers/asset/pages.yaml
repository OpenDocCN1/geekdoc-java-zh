  md: "# The Custom Scope\n\nThe custom scopes are configured using an EL expression\
    \ in the managed-bean-scope element in faces-config.xml:\n\n```\n<managed-bean>\n\
    \  <managed-bean-name>catalog</managed-bean-name>\n  <managed-bean-class>view.Catalog</managed-bean-class>\n\
    \  <managed-bean-scope>#{customScope}</managed-bean-scope>\n</managed-bean>\n\
    ```\n\n#{{customScope} specifies a map that contains the properties of the scope.\
    \ An EL resolver is required for the custom scope to resolve the scope and the\
    \ beans in the custom scope. A new custom-scoped bean instance is added to the\
    \ map on instantiation. You can also use custom-scoped bean managed using the\
    \ @CustomScoped annotation:\n\n```\n@CustomScoped(value=#{customScope})\n```\n\
    \n# OVERVIEW OF SIMPLIFIED CONFIGURATION\n\nThe previous section discussed the\
    \ @Scoped and @CustomScoped annotations. JSF 2.0 introduces some new annotations\
    \ for simplified configuration that replace the facesconfig.xml configuration.\
    \ The new annotations are discussed in Table 9.1.\n\n| Annotation | Description\
    \ |\n| --- | --- |\n| @Scoped | Places the annotated managed bean class in the\
    \ new scope |\n| @CustomScoped | Places the annotated managed bean class in the\
    \ new custom scope |\n| @SessionScoped | The session scope is not new, but the\
    \ annotation for the session scope is |\n| @RequestScoped | Annotation for the\
    \ request scope |\n| @ApplicationScoped | Annotation for the application scope\
    \ |\n| @ManagedBean | Annotation for a managed bean |\n| @ManagedProperty | Annotation\
    \ for a managed bean property |\n| @FacesComponent | Specifies a UI component\
    \ |"
