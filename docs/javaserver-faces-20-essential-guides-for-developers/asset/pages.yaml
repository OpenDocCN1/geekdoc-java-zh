    # SUMMARY


    This chapter discussed using view parameters to send request parameters in a GET
    request. You specify the value of a view parameter using f:wParam tags in the
    f:metadata tag. This chapter also discussed validation with view parameters. You
    can dispatch the preRenderView event after the view parameters have been processed
    but before the view has rendered.


    One of the main benefits of view parameters is preemptive navigation, in which
    the destination URL for an h:link or h:button component is constructed during
    the PreRenderView phase. You can create bookmarkable links using preemptive navigation.
    You can also include view parameters in the destination URL for h:link or h:button
    to send request parameters.


    This chapter discussed using view parameters with component parameters and navigation
    case parameters, as well as with redirects. The next chapter discusses client
    behaviors.'
