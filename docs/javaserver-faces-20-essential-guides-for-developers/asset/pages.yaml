  md: '# CREATING COMPOSITE COMPONENTS


    A composite component consists of a definition page, which is a Facelets markup
    page, and a resource library. Resource handling is a new feature in JSF 2.0. The
    default implementation for a Web application consists of packaging resources in
    the resources folder in the Web root folder.


    In this section, you will create two composite components in two different resource
    libraries. You could create the composite components in the same resource library,
    but this section demonstrates the use of multiple resource libraries. Follow these
    steps:


