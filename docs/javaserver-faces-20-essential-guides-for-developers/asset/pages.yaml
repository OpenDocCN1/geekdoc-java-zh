  md: '# Creating a Java EE Web Application


    To generate a JSAF data table, you need a data source from to create a database
    table in Oracle Database 11g XE. Use the SQL script in Listing 8.1. (The database
    table is the same as the one used in previous chapters. If you have already created
    it, you don''t have to create it again.)


    # Listing 8.1 SQL Script to Create an Oracle Database Table


    ```

    CREATE USER OE IDENTIFIED BY OE;

    GRANT CONNECT, RESOURCE TO OE;

    CREATE TABLE OE.Catalog(CatalogId INTEGER

    PRIMARY KEY, Journal VARCHAR(25), Publisher VARCHAR(25),

    Edition VARCHAR(25), Title VARCHAR(45), Author Varchar(25));

    INSERT INTO OE.Catalog VALUES(''1'', ''Oracle Magazine'',

    ''Oracle Publishing'', ''Nov-Dec 2004'', ''Database Resource

    Manager'', ''Kimberly Floss'');

    INSERT INTO OE.Catalog VALUES(''2'', ''Oracle Magazine'',

    ''Oracle Publishing'', ''Nov-Dec 2004'', ''From UIX to JSF'',

    ''Jonas Jacobi'');

    INSERT INTO OE.Catalog VALUES(''3'', ''Oracle Magazine'',

    ''Oracle Publishing'', ''March-April 2005'', ''Starting with

    Oracle ADF '', ''Steve Muench'');

    COMMIT;

    ```


    Run the SQL script in SQL Command Line to create a database table OE.CATALOG.
    As in Chapter 2, “Templating with Facelets,” configure and start the Integrated
    WebLogicServer.


    # CREATING A JAVA EE WEB APPLICATION


    To grasp the new client behavior features in JSF 2.0, you will create a Java application
    consisting of an input.xhtml page and an output.xhtml page. The input.xhtml page
    has an input field for an SQL query and a Submit button to submit the SQL query.
    The output.xhtml page consists of a JSAF data table generated from the SQL query
    specified in input.xhtml. An error.xhtml page is also included in case an error
    is generated. Follow these steps:


    +   1. Select File > New > From Gallery.

    2. Select General > Applications in the Categories pane and Java EE Web Application
    in the Items pane. Then click OK.'
