  md: "# Creating a Facets Taglib\n\n# Note\n\nA Faclets taglib file name must end\
    \ with .taglib.xml.\n\n+   5. The root element in a Facets taglib is facet-taglib.\
    \ The namespace tag specifies the taglib's namespace that will be used in the\
    \ Faclets page to add tags from the taglib. Add one or more tags using the <tag>\
    \ element.\n6. The tag name tag specifies the name of the tag. Add a tag-name\
    \ tag with confirm as the tag value.\n7. The behavior tag is used to add a JSF\
    \ 2.0 behavior. Specify the behavior ID with the behavior-id tag, which is a required\
    \ tag for a behavior tag.\n8. Optionally, you can add a handler class for the\
    \ behavior with the handler-class tag and add one or more behavior extensions\
    \ with the behavior-extension tags. A behavior extension contains implementation-specific\
    \ content.\nThe Faclets taglib tags are defined in the web-facettagliblibrary_2_0.xsd\
    \ schema. The facet.taglib.xml file appears in Listing 8.6.\n\n# 8.6 The facet.taglib.xml\
    \ File\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<facet-taglib xmlns=\"\
    http://java.sun.com/xml/ns/javaee\" version=\"2.0\">\n<namespace>http://example.org/datatable</namespace>\n\
    <tag>\n  <tag-name>confirm</tag-name>\n  <behavior>\n    <behavior-id>view.behavior.Confirm</behavior-id>\n\
    \  </behavior>\n  <attribute>\n    <name>event</name>\n    <required>true</required>\n\
    \    <type>String</type>\n  </attribute>\n</tag>\n</facet-taglib>\n```\n\n+  \
    \ 9. Copy the Faclets taglib listing to the facet.taglib.xml file in the ClientBehaviors\
    \ application, as shown in Figure 8.9."
