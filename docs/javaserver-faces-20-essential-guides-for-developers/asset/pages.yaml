  md: "# Bean Validation Integration\n\n![](img/982ffb5d3f694b76eb8a3e1299f348e8_191_0.png)\n\
    \nFigure 6.22\n\nA validation error message for the @Size constraint.\nGoogle\
    \ and the Google logo are registered trademarks of Google Inc., with permission.\n\
    \nYou did not have to specify the f:validateBean tag for validation because bean\
    \ validation is used by default. You can use the f:validateBean tag to specify\
    \ validation groups, which are just fully qualified class names, for an input\
    \ component or a set of input components using the validationGroups attribute.\
    \ The validation groups are associated with validation constraints in the managed\
    \ bean and group constrain the validation constraints that are to be applied to\
    \ an input component or a set of input components. The default validation group\
    \ is javax.validation.groups.Default.\n\nTo see this in action, follow these steps:\n\
    \n+   1. Create an empty input2.xhtml view.CustomValidationGroup.\n2. Modify the\
    \ input2.xhtml JSF page to specify a validation group, the view.CustomValidationGroup,\
    \ using the validationGroups attribute in the f:inputText component:\n   ```xml\n\
    <h:inputText id=\"inputText1\" binding=\"#{catalog.inputText1}\"\n      value=\"\
    #{catalog.sqlQuery}\">\n      <f:validateBean validationGroups=\"view.CustomValidationGroup\"\
    />\n</h:inputText>\n   ```"
