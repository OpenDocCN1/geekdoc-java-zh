    You have used only the simplest form of convention for a resource in the resources
    folder: a library and the resource file. The resource identifier may consist of
    other components, however, the complete format of the resource identifier can
    include a locale prefix, a library version, and the resource version, adding support
    for localization and versioning.


    ```

    `[localePrefix][libraryName][libraryVersion]/resourceName[/resourceVersion]`

    ```


    resourceName is the only required component of a resource identifier. The localization,
    versioning, and grouping into libraries is implemented using ResourceHandler.


    Custom components and renderers may require resources that are not available in
    a JSF page where the components/renderers are included. You can annotate components
    and renderers with the @ResourceDependency annotation, which may be grouped using
    the @ResourceDependencies annotation, to specify resources that are required by
    the component/renderer.


    # RELOCATING RESOURCES


    Some resources, such as JavaScript scripts, can be rendered in a location other
    than the location of the resource tag. For example, using relocation, you can
    render a JavaScript library in the <head> element using the target attribute in
    h:outputScript tag, which renders the <script> element in the <head> element:


    ```

    <h:outputScript library="js" name="jsf.js" target="head"/>

    ```


    If you omit the target attribute, jsf would have rendered inline. h:outputStylesheet
    renders only the <head> element and is not required to be targeted to the <head>
    element explicitly. The <h:head> tag is required in the JSF 2.0 page if it is
    to be targeted to the <head> element or a stylesheet is to be rendered. As an
    example, remove the h:head tag by commenting it out in input.xhtml, as shown in
    Figure 10.18.'
