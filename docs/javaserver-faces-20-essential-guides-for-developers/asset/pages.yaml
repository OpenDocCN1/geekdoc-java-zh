  md: '# INTRODUCTION


    JavaServer® Faces (JSF) is a Java® specification for developing component-based
    user interfaces for Java EE applications. JSF establishes the standard for building
    server-side user interfaces. JSF is one of the most commonly used Web frameworks,
    if not the most commonly used. According to a Developer Productivity Report 2012
    (http://zerotaround.com/rebellabs/developer-productivity-report-2012-java-tools-tech-devs-and-data/),
    JSF is ranked second of 10 Web frameworks. This book is based on the latest major
    version, JSF 2.0. One of the main differences from the previous version is Facelets
    is the default view definition language in JSF 2.0 instead of JSP.


    JSF 2.0 has introduced several new features. These include the following:


    +   - New scopes

    - Simplified, annotation-based configuration

    - State saving

    - Enhanced exception handling

    - Enhanced resource handling

    - New system events

    - Facelets

    - Ajax

    - Composite components'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Introduction


    +   ■ Enhanced navigation

    ■ Enhanced validation

    ■ View parameters for GET requests

    ■ Client behaviors


    This book discusses the JSF 2.0 new features with examples in Oracle® Developer
    and the integrated Oracle® WebLogic Server.


    The objective of the book is to discuss how a Java EE developer would develop
    Web applications with JSF 2.0. The book covers all aspects of application development
    including the following:


    +   ■ Setting up the environment for an application

    ■ Using the JDeveloper wizards and the Component palette

    ■ Running a sample application


    # WHAT THIS BOOK COVERS


    Chapter 1, “What’s New in JSF 2.0,” introduces the new features in JSF 2.0 and
    how they differ from the previous version.


    Chapter 2, “Templating with Facelets,” discusses Facelets, the default view definition
    language (VDL) in JSF 2.0. We demonstrate templating with Facelets in a Web application
    developed in JDeveloper and run on the integrated WebLogic Server. The integrated
    WebLogic server configuration will be used in subsequent chapters also.


    Chapter 3, “Ajax,” discusses support for Ajax with the f:ajax tag in the JSF 2.0
    component library. It also discusses partial rendering and grouping of components.


    Chapter 4, “Creating Composite Components,” introduces composite components. A
    composite component is a composite (integration) of a collection of UI components
    and simplifies adding reusable collections of components. For example, if an application
    makes use of the same header, JSF data table, input text field, and Submit command
    button in several JSF pages, you can create a single composite component from
    the group of components and add it to a JSF page as a single component.


    Chapter 5, “Enhanced Navigation,” discusses the enhanced navigation provided by
    JSF 2.0 with implicit navigation, conditional navigation, and preemptive navigation.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Introduction


    Chapter 6, “Enhanced Validations,” discusses the support for enhanced validation
    in JSF 2.0. It discusses the annotations for validation constraints, the new validators
    `f:validateRequired` and `f:validateRegex`, integration with bean validation,
    and support for validation of empty fields.


    Chapter 7, “View Parameters,” discusses the support for request parameters in
    a GET request with view parameters. It introduces preemptive navigation and bookmarkability
    of JSF pages feasible by view parameters. We also discuss how view parameters
    are used in combination with component parameters and redirection.


    Chapter 8, “Client Behaviors,” discusses client behaviors. In this chapter, we
    will develop a Web application in JDeveloper with the integrated WebLogic Server
    to demonstrate client behaviors.


    Chapter 9, “Scopes,” discusses the new scopes in JSF 2.0: the view scope, the
    flash scope, and the custom scope. It also discusses the configuration simplification
    with annotations. It demonstrates using the new scopes with a Web application.


    Chapter 10, “Resource Handling,” introduces the new resource-handling feature
    in JSF 2.0. It discusses how resources as CSS stylesheets and images are packaged
    and rendered. It also discusses the ordering of application configuration resources.


    Chapter 11, “Event Handling and Exception Handling,” discusses the new event-handling
    and exception-handling features in JSF 2.0. It discusses the support for system
    events, event handling in `f:ajax`, and custom exception handlers.


    # WHAT YOU NEED FOR THIS BOOK


    You can use JSF 2.0 with any Web server or application server that supports JSF
    2.0. In this book, you will use Oracle JDeveloper 12c with the integrated Oracle
    WebLogic Server 12c, which you can download from www.oracle.com/technwork/developer-tools/jdev/downloads/index.html.
    Most of the sample Web applications are database based; for those, who will use
    Oracle Database 11g Express Edition, which you can download from www.oracle.com/technet/database/database-technologies/express-edition/index.html.
    For this book, we use the Windows OS, but if you have Linux installed, the book
    will still prove useful (although the source code and samples have not been tested
    with Linux). Slight modifications may be required by the Linux install, however—the
    paths on Linux would be different from the Windows directory paths used in the
    book. Regardless of the OS, you also need to install Java SE 5 or later; Java
    SE 7 is used in the book.'
