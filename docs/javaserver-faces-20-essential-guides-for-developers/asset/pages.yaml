    # SUMMARY


    This chapter discussed the new navigation features in JSF 2.0. JSF 2.0 has added
    support for implicit navigation, which implies that in the absence of a navigation
    rule in faces-config.xml, the outcome value is used to ascertain the view ID to
    navigate to. Conditional navigation has been added to provide navigation based
    on evaluation of a Boolean expression. Preemptive navigation, which is discussed
    in more detail in Chapter 7, “View Parameters,” is used to ascertain the navigation
    URL prior to selecting a hyperlink or button. The ConfigurableNavigationHandler
    API has been added to configure the navigation handler programmatically. The next
    chapter discusses the enhanced validation provided by JSF 2.0.'
