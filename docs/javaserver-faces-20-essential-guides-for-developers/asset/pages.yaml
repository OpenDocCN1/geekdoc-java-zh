  md: '# Overview OF FACLETS


    Before you develop the application, let''s review the Faclets technology. Faclets
    provide a set of XML tags in the http://java.sun.com/jsf/faclets namespace. Faclets
    tags are used with JSF Core and JSF HTML tag libraries to develop a JSF Faclets
    application. Some of the Faclets tags are discussed in Table 2.1.


    Table 2.1 Faclets Tags

    | Faclets Tag | Description | Attributes |

    |---|---|---|

    | ui:composition | Defines a composition of UIComponents. A composition may consist
    of multiple UIComponents. Text not within ui:composition tags is not compiled
    in a Faclets page. | template: This optional attribute specifies the template
    to use for adding UIComponents within a composition. |

    | ui:define | Used in a Faclets page in conjunction with template''s ui:insert
    tags to add UIComponents within a composition. | name: This required attribute
    matches with the name attribute in ui:insert. |

    | ui:decorate | Similar to ui:composition except that text not within ui:decorate
    tags is also included in the Faclets page. | template: This required attribute
    specifies the template to be used for adding UIComponents in ui:decorate tags.
    |

    | ui:component | Similar to ui:composition except that ui:component adds a new
    UIComponent as the root component in the UIComponents structure. | id: If id is
    not specified, Faclets assigns an ID. binding: Binds a UIComponent to a property
    of a JavaBean. |

    | ui:fragment | A nonming tag for ui:component, similar to ui:decorate for ui:composition.
    | id, binding |

    | ui:include | Includes a Faclets page, which defines a composition or a component
    in a Faclets page or the template page. | src: This required attribute specifies
    the target Faclet to include with an EL expression or a string literal.'
