  md: '# CREATING A CUSTOM SCOPED MANAGED BEAN


    A custom scope requires the following configuration.


    +   - An EL expression specifying a map, which is a Map<String,Object> object,
    for the custom scope

    - Configuration of the EL expression for the custom scope in faces-config.xml
    or the @ManagedScoped annotation

    - An EL resolver (extends ELResolver) to resolve the custom scope and the beans
    in the map

    - Registration of the EL resolver in faces-config.xml


    You will use the EL expression #customScope to specify the map for a custom scope.
    Configure the custom scope on the catalog2 bean class Catalog2.java using the
    @ManagedScoped annotation:


    ```

    @ManagedBean(name="catalog2")

    @CustomScoped(value="#{customScope}")

    public class Catalog2 {

    }

    ```


    The managed bean in custom scope is shown in Figure 9.16.


    ![](img/982ffb5d3f694b76eb8a3e1299f348e8_306_0.png)


    # Figure 9.16


    The managed bean in custom scope.

    Source: Oracle Corporation.'
