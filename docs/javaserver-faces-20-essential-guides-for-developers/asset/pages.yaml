  md: "# Configuring the Client Behavior\n\nThe faces-config.xml page appears in Listing\
    \ 8.8.\n\nListing 8.8 The faces-config.xml Page\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"windows-1252\">\n<faces-config version=\"2.1\" xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    >\n<behavior>\n  <behavior-id>view.behavior.Confirm</behavior-id>\n  <behavior-class>view.behavior.behavior.ConfirmBehavior</behavior-class>\n\
    </behavior>\n</faces-config>\n```\n\nThe behavior tag provides two optional design-time\
    \ features with the attribute and property tags. You can specify one or more attributes\
    \ in the behavior tag to configure attributes on the UI component to affect the\
    \ operation of the behavior. Note that the attribute tags don't have any effect\
    \ at runtime; they are only for design tools. Similarly, you can add one or more\
    \ property tags to identify JavaBean properties of the behavior implementation\
    \ class that may be configured to affect the operation of the behavior. Properties\
    \ are for design-tools only and have no effect at runtime.\n\nYou can specify\
    \ one or more client behavior renderers using the client-behavior-renderer tags\
    \ in a render-kit tag. The client-behavior-renderer tag represents a concrete\
    \ ClientBehaviorRenderer implementation class, which is specified with the client-behavior-renderer-class\
    \ tag and must be unique in a render-kit tag. The standard components render the\
    \ client behavior scripts as DOM event handlers, but other renderers/components\
    \ may add the script into the markup differently. The tags in faces-config.xml\
    \ are based on the http://java.sun.com/xml/ns/javaee/web-faces-config_2_1.xsd\
    \ XML schema.\n\nIn the faces-config.xml page, you specified a behavior implementation\
    \ class, view.behavior.ConfirmBehavior, which will create next. Follow these steps:\n\
    \n+   1. Add a Java class, choose File > New > From Gallery.\n\n+   2. In the\
    \ New Gallery dialog box, select General > Java in the Categories pane and select\
    \ Class in the Items pane. Then click OK. (See Figure 8.13.)"
