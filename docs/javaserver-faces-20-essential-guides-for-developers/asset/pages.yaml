  md: '# CHAPTER 9


    # SCOPES


    JSF 1.2 provided only three scopes: request, session, and application. The session
    scope was used in applications that required a scope greater than request, but
    less than session. The request scope was too limited for some applications, such
    as a command button or a link to update or delete in a request-scoped page. The
    request scope was also limited in Faces redirects, which started a new request.
    JSF 2.0 has introduced three new scopes: view, flash, and custom. The view and
    flash scopes in JSF 2.0 fill in the requirement for an intermediate scope managed
    bean.


    Another limitation in JSF 1.2 is the requirement for too much configuration in
    faces-config.xml for managed beans, managed properties, converters, validators,
    renderers, and even managed bean scopes. JSF 2.0 has introduced annotations based
    configuration to replace most of the faces-config.xml configurations.


    # OVERVIEW OF SCOPES


    This section introduces the three new scopes: view, flash, and custom.


    # THE VIEW SCOPE


    The view scope is scoped to a view only. It is greater in scope than the request
    scope, but lesser than the session scope. One problem with managed beans that
    had a request scope was if the rendered attribute of a command component such
    as a command button was bound to the request-scoped bean, the command button wouldn''t
    invoke the action'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# 266 Chapter 9 Scopes


    method. If the Facelets navigated away from a view page, the application became
    outside the view scope.


    The view scope is started when you enter a view with a GET request. If a page
    is reloaded, the old view scope is lost and a new view scope is started. The managed
    bean in view scope is stored as an attribute in the view state. In a POST request,
    the old view is restored and the old view scope is reused. The view scope is generally
    used for CRUD (create, read, update, and delete) operations. To make a managed
    bean scope in the managed-bean element in faces-config.xml:


    ```

    <managed-bean-name>catalog</managed-bean-name>

    <managed-bean-class>model.Catalog</managed-bean-class>

    <managed-bean-scope>view</managed-bean-scope>

    ```


    Alternatively, you can configure a managed bean to be in view scope using the
    @Scoped annotation:


    ```

    @ManagedBean(name = "catalogBean")

    @Scoped

    public class Catalog (

    n

    ```


    The #viewScope implicit object provides access to the view scope. The javax.faces.component.UIViewRoot.getViewMap(boolean
    create) method returns a map that is the interface to the data store represented
    by the view scope.


    # The Flash Scope


    Flash is actually not a scope, but a method to transfer temporary objects between
    users across two consecutive requests generated by the Faces lifecycle. The two
    consecutive requests may be the same view IDs or different view IDs.


    The flash concept is taken from the Ruby on Rails ActionController::Flash module.
    The temporary objects placed in the flash scope are available to the next user
    in the session and subsequently removed. The flash scope is also available for
    redirects and adjacent GET requests, making the POST/REDIRECT/GET pattern available
    to Faces applications. A user may access flash using the EL implicit object flash,
    and with ExternalContext.getFlash(), which returns a flash object. The Flash class
    implements Map<String, Object> interface. Flash may be used in a JSP page or a
    Facelets page.'
