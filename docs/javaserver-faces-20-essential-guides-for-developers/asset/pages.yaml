  md: '# Table 9.1 New Annotations (Continued)


    | Annotation | Description |

    | --- | --- |

    | @FacesRenderer | Specifies a renderer |

    | @FacesConverter | Specifies a converter |

    | @FacesValidator | Specifies a validator |

    | @FacesBehavior | Specifies a behavior |


    JSF 2.0 introduces a new configuration option called "project stage" that provides
    a hint to the JSF implementation regarding the state of the application and the
    role of the deployment. The project stage is represented with the javax.faces.application.ProjectStage
    enum and can be obtained using the Application.getProjectStage() method. You can
    set the project stage using the javax.faces.PROJECT_STAGE context parameter or
    the java:comp/env/jsf/ProjectStage JNDI name. The ProjectStage enum constants
    are discussed in Table 9.2.


    # Table 9.2 ProjectStage Enum Constants


    | ProjectStage Value | Description |

    | --- | --- |

    | Development | Used during application development. Features include a verbose
    output. |

    | Production | Used during production. The default value. |

    | SystemTest | Indicates system testing. |

    | UnitTest | Indicates unit testing. |

    | Extension | Used to specify custom stage. |


    The javax.faces.PROJECT_STAGE context parameter value is used if specified. You
    specify the project stage value using a context-param in web.xml as follows:


    ```

    <context-param>

    <param-name>javax.faces.PROJECT_STAGE</param-name>

    <param-value>Development</param-value>

    </context-param>

    ```'
