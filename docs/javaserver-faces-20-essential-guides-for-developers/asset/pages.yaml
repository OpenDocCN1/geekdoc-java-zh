    \ data table from a bookmarkable link.\nGoogle and the Google logo are registered\
    \ trademarks of Google Inc., used with permission.\n\n# COMPONENT PARAMETERS WITH\
    \ VIEW PARAMETERS\n\nView parameters are not the only source of parameters for\
    \ a destination URL for an h:link or an h:button. Parameters from different sources\
    \ are included in the following order:\n\n+   1. Component parameters\n2. Navigation\
    \ case parameters\n3. View parameters\n\nIf a component parameter has the same\
    \ name as a view parameter, the component overrides the view parameter. For example,\
    \ follow these steps:\n\n+   1. Add a component parameter using the f:param tag\
    \ to the bookmarkable link example in the previous section. The component parameter\
    \ (catalogid) has the same name as the view parameter in input3.xml. We set the\
    \ component parameter value to be less than the view parameter value to demonstrate\
    \ what parameter value is added to the destination URL for the h:link.\n\n```\n\
    <h:link outcome=\"input2.xml\" includeViewParams=\"true\"\n      value=\"Create\
    \ DataTable\">\n  <f:param name=\"catalogid\" value=\"#{catalog.catalogId - 1}\"\
    />\n</h:link>\n```\n\n+   2. Redeploy the application and rerun input3.xml the\
    \ same URL (http://localhost:7101/webapp1/faces/input3.xml?catalogid=2). The hyperlink\
