  md: '# Table 11.3 SystemEventListener Class Methods


    | Method | Description |

    | --- | --- |

    | isListenerSource(java.lang.Object source) | Returns a Boolean to indicate if
    the listener is a listener for the specified source |

    | processEvent(SystemEvent event) | Processes the specified system event |


    System events provide a publish/subscribe model to broadcast and listen to events.
    For the application-scoped system events, the sequence of the publish/subscribe
    is as follows:


    +   1. The application registers listeners represented by the SystemEventListener
    class with the system events.

    2. The application broadcasts system events represented by the SystemEvent class.

    3. The listeners that are registered for the system events broadcast are invoked
    and the processEvent method of the SystemEventListener is called.


    You can generate system events, application-scoped events, and component system
    events using the methods from the javax.faces.application.Application class discussed
    in Table 11.4.


    # Table 11.4 Application Class Methods to Generate Events


    | Method | Description |

    | --- | --- |

    | publishEvent(FacesContext context, Class<? extends SystemEvent> systemEventClass,Object
    source) | Broadcasts a system event of type systemEventClass and includes the
    source of the event. Any listeners subscribing to the event of type systemEventClass
    are called |

    | publishEvent(FacesContext context, Class<? extends SystemEvent> systemEventClass,Class<?>
    sourceBaseType,Object source) | The same as the other variant except that includes
    the class of the sourceBaseType is used to find listeners instead of the class
    of the source |'
  merge: -1
  pgno: 353
