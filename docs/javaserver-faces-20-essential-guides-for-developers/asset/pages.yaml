  md: '# CHAPTER 11


    # # EVENT HANDLING AND EXCEPTION HANDLING


    Events are broadcast by JSF components, the different phases of a Java request
    lifecycle, and the application, and are received by registered event listeners.
    JSF 1.2 provides phase events, which are broadcast before and after every phase,
    and application events, which are generated by the JSF components.


    Phase events in JSF 2.0 are the same as in JSF 1.2. The only difference is a new
    method in UIViewRoot:getPhaseListeners(). It returns a List<PhaseListener>. JSF
    1.2 provided two application events: ValueChangeEvent and ActionEvent. JSF 2.0
    added two behavior events: BehaviorEvent and AjaxChangeEvent. These add behavior
    to components and were discussed in Chapter 8, "Client Behaviors." JSF 2.0 has
    also added a new type of event, system events, which are non-application specific
    events that may be broadcast by arbitrary objects.


    # # SYSTEM EVENTS


    System events represent specific stages in time for a JSF application. Phase events
    also represent specific stages in time for a JSF application, but the granularity
    of the system events is more precise. System events are represented by the javax.faces.event.SystemEvent
    class, which provides the two methods discussed in Table 11.1.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Table 11.1 SystemEvent Class Methods


    | Method | Description |

    | --- | --- |

    | isAppropriateListener(FacesListener listener) | Returns a Boolean to indicate
    if FacesListener is an appropriate listener for an event |

    | processListener(FacesListener listener) | Broadcasts an event to FacesListener
    |


    Two types of system events are provided: application system events and component
    system events. Table 11.2 discusses the application-scoped system events.


    # Table 11.2 Application-Scoped System Events


    | Event | Description |

    | --- | --- |

    | ExceptionQueuedEvent | Represents an exception instance that has been queued
    by calls to Application().publishEvent(ExceptionQueuedEvent.class, eventContext).
    eventContext is an ExceptionQueuedContext object |

    | PostConstructApplicationEvent | The event is broadcast by the runtime after
    all configuration resources have been parsed and processed. Listeners that are
    required to perform post-configuration processing may register with the event.
    |

    | PostConstructCustomScopeEvent | Broadcast by custom scopes after the beginning
    of a custom scope |

    | PreDestroyApplicationEvent | The event is broadcast by the runtime before the
    factories associated with an application are released. Listeners that are required
    to perform custom shutdown processing may register with the event. |

    | PreDestroyCustomScopeEvent | Broadcast by custom scopes before a scope ends.
    |


    Just as FacesEvent (ActionEvent and ValueChangeEvent) from JSF 1.2 are broadcast
    to FacesListener (ActionListener, ValueChangeListener) and PhaseEvent to FacesListener,
    JSF 2.0 provides SystemEventListener (which extends the FacesListener interface)
    for SystemEventListener. Listener classes that are required to listen to system
