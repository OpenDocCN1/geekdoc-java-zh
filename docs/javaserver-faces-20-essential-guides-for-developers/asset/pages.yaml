    # GROUPING COMPONENTS


    In this section, you will group components within the f:ajax tag. Grouping components
    invokes an Ajax request when a specified/default event is invoked for any of the
    components. If an event is specified in the enclosing f:ajax tag, it applies to
    all components within the tag (assuming the component supports the event). You
    can specify an additional event using another f:ajax tag for a specific component
    within the outer. In catalog2.xhtml, add an f:ajax tag to enclose two components:


    ```

    <f:ajax execute="@form" event="valueChange" render="form1:dataTable form1:dataTable2"
    listener="#{catalog.inputListener}">

