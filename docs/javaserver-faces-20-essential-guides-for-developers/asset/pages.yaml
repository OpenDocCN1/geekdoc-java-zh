  md: "# PreRenderView Event Handling 215\n\nSome of the applications of a preRenderView\
    \ event are as follows:\n\n+   - Loading application data prior to rendering a\
    \ view\n\n+   - Setting application context prior to rendering a view\n\n+   -\
    \ Navigating to a different view, not the view to be rendered prior to which the\
    \ event is dispatched\n\nIn the previous example on using validators with view\
    \ parameters, you rendered a view with a command button from which you invoked\
    \ a managed bean action to generate a JSF data table. You don't need to invoke\
    \ the managed bean action using a command button, however. You can add a listener\
    \ method for the: event tag and create an SQL query to generate a result that\
    \ is used to create a data table. The createSQLQuery method is the same as the\
    \ commandButton action method except that you have added navigation using the\
    \ NavigationHandler to navigate to a different view, output.xhtml. You have also\
    \ added a validation test so that the JSF application navigates to output.xhtml\
    \ using implicit navigation only if the validation does not fail. The createSQLQuery\
    \ listener method for the preRenderView event appears in Listing 7.11.\n\nListing\
    \ 7.11 Listener createSQLQuery() for preRenderView Event\n\n```\npublic String\
    \ createSQLQuery() {\n    try {\n        Class.forName(\"oracle.jdbc.OracleDriver\"\
    );\n        String url = \"jdbc:oracle:thin@localhost:1521:XE\";\n        connection\
    \ = DriverManager.getConnection(url, \"OE\", \"OE\");\n        ResultSet stmt\
    \ = connection.prepareStatement(ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n\
    \        sql = \"SELECT * FROM OE_CAT WHERE CATALOGID=\" + catalogId;\n      \
    \  resultSet = stmt.executeQuery(sql);\n        if (resultSet != null) {\n   \
    \         return resultSet.getResultSet(stmt);\n        }\n    } catch (SQLException\
    \ e) {\n        System.out.println(e.getMessage());\n        return \"error\"\
    ;\n    }\n    } catch (ClassNotFoundException e) {\n        System.out.println(e.getMessage());\n\
    \        return \"error\";\n}\n```"
