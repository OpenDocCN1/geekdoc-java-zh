- img_proc: true
  md: 'JSF 2.0 has introduced the UIOutcomeTarget component, which has an outcome
    associated with it. The two subclasses of UIOutcomeTarget are HtmlOutcomeButton
    and HtmlOutcomeTargetLink. The corresponding UIComponent tags are h:link and h:outcome.
    Using preemptive navigation, the destination URL of h:link and h: buttons are
    predetermined during the render response and navigated to when a user activates
    the components. Using preemptive navigation case, including the target URL and
    target view ID, is evaluated/resolved during the render response before a user
    has activated the component, adding the provision for bookmarkable nonFaces requests.
    The preemptive/predetermined navigation is implemented and the target URL is retrieved
    when a user activates a hyperlink and the response is rendered. In contrast, a
    pre-JSF 2.0 UICommand resolves and implements navigation at the same time after
    the invocation phase.


    ConfigurableNavigationHandler is a new class in JSF 2.0 with a provision to modify
    the navigation rules in an action method in the managed bean before rendering
    a view. ConfigurableNavigationHandler is a subclass of NavigationHandler with
    a provision to probe the navigation rules and navigation cases and to preemptively
    retrieve the target view ID and URL. With retrieval of navigation rules, the render
    response phase, a different navigation may be implemented than configured in faces-config.xml.
    Navigation rules can be modified dynamically using the ConfigurableNavigationHandler
    API. Two new methods are provided to retrieve the navigation rules dynamically,
    which are discussed in Table 5.1.


    | Table 5.1 ConfigurableNavigationHandler Methods |

    | Method Name | Return Value |

    | --- | --- |

    | getNavigationCases() | java.util.Map<java.lang.String,java.util.Set<NavigationCase>>
    | None |

    | getNavigationCase() | NavigationCase | FacesContext, java.lang.String fromAction,
    java.lang.String outcome |'
