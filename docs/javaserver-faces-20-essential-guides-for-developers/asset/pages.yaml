    the deployment profile to the IntegratedWebLogicServer.

    4. Run the input.xhtml page with the following URL: http://localhost:7101/webapp1/faces/input.xhtml.

    5. Do not specify a value in the input field, but click Submit. The application
    outputs a validation message indicating that a value is required, as shown in
    Figure 6.7.'
