  md: "# Error Handler for an Ajax Request\n\n![](img/982ffb5d3f694b76eb8a3e1299f348e8_407_0.png)\n\
    \nFigure 11.35\n\nRendering viewExpired.xhtml.\n\nGoogle and the Google logo are\
    \ registered trademarks of Google Inc., used with permission.\n\n# ERROR HANDLER\
    \ FOR AN AJAX REQUEST\n\nThe f:ajax tag supports error handling, which was discussed\
    \ in the “Creating an Event Handler for an Ajax Request” section earlier in this\
    \ chapter. The f:ajax tag provides the onerror attribute to specify an error handler\
    \ callback function. To see it in action, follow these steps:\n\n+   1. Add the\
    \ onerror handler. To do so, click within the f:ajax tag, click the spac,, and\
    \ select onerror from the list that appears.\n\n+   2. Specify the handleError\
    \ callback function in the onerror attribute. The f:ajax tag with the onevent\
    \ and onerror attributes is listed here:\n\n```\n<h:inputText binding=\"#{catalog.inputText}\"\
    \ required=\"true\">\n    <f:ajax execute=\"@form\" event=\"valueChanged\"\n \
    \       render=\"form1:Data Table\" onerror=\"handleError\" onevent=\"handleEvent\"\
    \n        listener=\"#{catalog.inputTextListener}\" />\n</h:inputText>\n```\n\n\
    +   3. Add a callback JavaScript function handleError(errorData):\n\n```\nfunction\
    \ handleError(errorData) {\n}\n```"
  merge: -1
  pgno: 407
- img_proc: true
  md: "# 396 Chapter 11 Event Handling and Exception Handling\n\nThe types of errors\
    \ that an Ajax request can generate are discussed in Table 11.13.\n\nTable 11.13\
    \ Ajax Request Error Types\n| Error | Description |\n| --- | --- |\n| httpError\
    \ | The request.status is one of the following: null undefined <200 >=300 |\n\
    | serverError | The Ajax response contains an error element. |\n| malformedXML\
    \ | The Ajax response does not conform to the proper format. |\n| emptyResponse\
    \ | The Ajax response is empty or there is no Ajax response. |\n\nThe errorData\
    \ consists of the properties discussed in Table 11.14.\n\nTable 11.14 Ajax request\
    \ errorData Properties\n| Property | Description |\n| --- | --- |\n| type | \"\
    error\" |\n| status | One of the types discussed in the previous table |\n| description\
    \ | Description of the error |\n| source | The DOM element that generated the\
    \ Ajax request |\n| responseCode | Ajax request object status XMLHttpRequest.status\
    \ |\n| responseXML | The response XML XMLHttpRequest.responseXML |\n| responseText\
    \ | The response text XMLHttpRequest.responseTxt |\n| errorName | The error name\
    \ specified within the \"error\" element. |\n| errorMessage | The error message\
    \ specified within the \"error\" message. |\n\n+   4. To monitor and output error\
    \ data, add <div></div> elements to input2.xhtml:\n\n```\n<div id=\"errorType\"\
    ></div>\n  <div id=\"errorStatus\"></div>\n  <div id=\"errorSource\"></div>\n\
    ```"
  merge: -1
  pgno: 408
- img_proc: true
  md: "# Commented Out JSF 397\n\n```\n<div id=\"errorCode\"></div>\n<div id=\"errorName\"\
    ></div>\n<div id=\"errorMessage\"></div>\n```\n\n+   5. In the handleError function,\
    \ retrieve the elements for error data and set their innerHTML to the errorData\
    \ properties. The handleError function appears in Listing 11.18\n\n# Listing 11.18\
    \ The handleError Function\n\n```\nfunction handleError(errorData) {\n  var type\
    \ = document.getElementById(\"eventType\");\n  type.innerHTML = \"Error Type:\
    \ \" + errorData.type;\n  var status = document.getElementById(\"errorStatus\"\
    );\n  status.innerHTML = \"Status: \" + errorData.status;\n  var source = document.getElementById(\"\
    errorSource\");\n  source.innerHTML = \"Source: \" + errorData.source;\n  var\
    \ responseCode = document.getElementById(\"errorCode\");\n  responseCode = \"\
    Response Code: \" + errorData.responseCode;\n  var errorName = document.getElementById(\"\
    errorName\");\n  errorName.innerHTML = \"Error Name: \" + errorData.error;\n \
    \ var errorMessage = document.getElementById(\"errorMessage\");\n  errorMessage.innerHTML\
    \ = \"Error Message: \" + errorData.message;\n  var xmlMessage = errorData.responseXML;\n\
    \  var textMessage = errorData.responseText;\n}\n```\n\n# Commented Out JSF\n\n\
    Prior to JSF 2.0 XML, in the form <!-- -->, could be used to comment JSF code\
    \ sections. Here's an example:\n\n```\n<!-- <h:commandButton action=\"#{catalogBean.deleteRow}\\\
    \ value=\"delete\"/>-->\n```\n\nIn JSF 2.0 and later, JSF parses EL expressions\
    \ that are commented out, and the preceding commented out UI component would generate\
    \ an error such as the following:\n\nThe class 'view.Catalog' does not have the\
    \ property 'deleteRow'."
  merge: -1
  pgno: 409
- img_proc: true
  md: "# 398 Chapter 11 Event Handling and Exception Handling\n\nSeveral options are\
    \ available to comment out JSF code sections in JSF 2.0. These include the following:\n\
    \n+   Adding the javax.faces.FACELETS_SKIP_COMMENTS or facelets.SKIP_COMMENTS\
    \ context parameter in web.xml, like so:\n\n```\n<context-param>\n  <param-name>javax.faces.FACELETS_SKIP_COMMENTS</param-name>\n\
    \  <param-value>true</param-value>\n</context-param>\n```\n\n+   Adding the JSF\
    \ code section within ui:remove, like so:\n\n```\n<ui:remove>\n<h:commandButton\
    \ action=\"#{catalogBean.deleteRow}\" value=\"Delete\"/>\n</ui:remove>\n```\n\n\
    +   Adding the - character in the EL expression, like so:\n\n```\n<!-- <h:commandButton\
    \ action=\"#{catalogBean.deleteRow}\" value=\"Delete\"/>-->\n```\n\n# SUMMARY\n\
    \nThis chapter discussed the new event handling and exception handling features\
    \ in JSF 2.0. It covered system event listeners and component event listeners,\
    \ as well as registering them with an application. It also discussed event handling\
    \ in combination with Ajax. Finally, it covered creating a custom exception handler."
  merge: -1
