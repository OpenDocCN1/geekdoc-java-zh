  md: "# PreRenderView EVENT HANDLING\n\nJSF 2.0 provides a new system event, PreRenderView,\
    \ which is dispatched after the view parameters have been processed before the\
    \ view has been rendered. A listener for the event is registered using the f:event\
    \ tag and its listener attribute. For example, adding an f:event tag. Specify\
    \ its type as preRenderView and the listener as a method createSQLQuery in the\
    \ managed:\n\n```\n<f:metadata>\n  <f:viewParam id=\"catalogId\" name=\"catalogId\"\
    \ value=\"#{catalog.catalogId}\"\n    validatorMessage=\"Text must be 1 chars\
    \ long\">\n    <f:validateLength maximum=\"1\"/>\n  </f:viewParam>\n<f:event type=\"\
    preRenderView\" listener=\"#{catalog.createSQLQuery}\" />\n</f:metadata>\n```\n\
    \nThe input2.xhtmlF page with a preRenderView event appears in Listing 3.10.\n\
    \nListing 10 The input2.xhtml Page with the preRenderView Event\n\n```\n<!DOCTYPE\
    \ html PUBLIC \"//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:ui=\"http://java.sun.com/jsf/facelets\"\
    \nxmlns:f=\"http://java.sun.com/jsf/core\">\n<f:metadata>\n  <f:viewParam id=\"\
    catalogId\" name=\"catalogId\"\n    value=\"#{catalog.catalogId}\"\n    validatorMessage=\"\
    Text must be 1 chars long\">\n    <f:validateLength maximum=\"1\"/>\n  </f:viewParam>\n\
    </f:metadata>\n<f:view>\n  <h:messages/ />\n  <h:outputText value=\"SQL Query:\
    \ #{catalog.sqlQuery}\" />\n</f:view>\n<body>\n  <f:event type=\"TR/preRenderView\"\
    \ listener=\"#{catalog.createSQLQuery}\" />\n</body>\n</f:view>\n</html>\n```"
