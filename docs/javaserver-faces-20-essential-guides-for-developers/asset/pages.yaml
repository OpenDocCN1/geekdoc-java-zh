  md: "# 384 Chapter 11 Event Handling and Exception Handling\n\n![](img/982ffb5d3f694b76eb8a3e1299f348e8_396_0.png)\n\
    \nFigure 11.29\nGenerating a JSF data table with Ajax.\nGoogle and the Google\
    \ logo are registered trademarks of Google Inc., used with permission.\n\n# CREATING\
    \ A CUSTOM EXCEPTION HANDLER\n\nJSF 2.0 has introduced a new mechanism for handling\
    \ unexpected exceptions that occur during a Faces lifecycle. The ExceptionHandler\
    \ is not notified of any exceptions that may occur during application startup\
    \ or shutdown. Exceptions are sent to the ExceptionHandler by one of the two methods:\n\
    \n+   * By not catching exceptions, or by catching and re-throwing exceptions\n\
    * By broadcasting an ExceptionQueuedEvent, which wraps an exception with the system\
    \ event mechanism as:\n\n```\ncatch (Exception e) {\n    FacesContext facesContext=\
    \ FacesContext.getCurrentInstance();\n    ExceptionQueuedEvent eventContext =\
    \ new ExceptionQueuedEvent(ctx, e);\n    facesContext.getApplication().publishEvent(ExceptionQueuedEvent.class,\
    \ eventContext);\n}\n```\n\nExceptionQueuedEvent represents an instance that has\
    \ been called by calls to Application.publishEvent(ExceptionQueuedEvent.class,\
    \ eventContext). At the end of the Faces lifecycle, any ExceptionQueuedEvent broadcasts\
    \ are handled using the handle() method. The ExceptionHandler provides the methods\
    \ in Table 11.12."
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Table 11.12 ExceptionHandler Methods


    | Method | Description |

    | --- | --- |

    | getHandExceptionQueuedEvent() | Returns the first ExceptionQueuedEvent handled
    by the exception handler |

    | getHandExceptionQueuedEvents() | Returns an iterable over all the ExceptionQueuedEvents
    handled by the exception handler |

    | getRootCause(java.lang.Throwable) | Returns the root cause of the throwable
    |

    | getUnhandledExceptionQueuedEvents() | Returns an iterable over all the unhandled
    ExceptionQueuedEvents not yet handled by the exception handler |

    | handle() | Handles the queued ExceptionQueuedEvents |

    | isListenerSource(java.lang.Object source) | Returns a Boolean indicating if
    the listener instance is a listener for the source |

    | processEvent(SystemEvent exceptionQueuedEvent) | Processes a SystemEvent |


    The ExceptionWrapper class is a simple implementation of ExceptionHandler. The
    getWrapped method returns the ExceptionHandler wrapped by the ExceptionHandlerWrapper.
    ExceptionHandlerFactory is a factory that returns a new ExceptionHandler object.
    JSF 2.0 has introduced a new property, EXCEPTION_HANDLER_FACTORY, in FactoryFinder
    to return an ExceptionHandlerFactory:


    ExceptionHandlerFactory factory = (ExceptionHandlerFactory) FactoryFinder.getFactory(FactoryFinder.EXCEPTION_HANDLER_FACTORY);


    An ExceptionHandler is obtained from a factory as follows:

    ExceptionHandler exceptionHandler = factory.getExceptionHandler();'
