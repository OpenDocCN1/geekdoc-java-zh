  md: '# Chapter 11 Event Handling and Exception Handling


    Listeners for application-scoped system events can subscribe (register with) and
    unsubscribe (unregister with) to the system events using the javax.faces.application.Application
    methods discussed in Table 11.5.


    Table 11.5 Application Class Methods to Register/Unregister Listeners

    | Method | Description |

    | --- | --- |

    | subscribeToEvent(Class<? extends SystemEvent> systemEventClass,SystemEventListener
    listener) | Registers the listener with the event type systemEventClass. When
    an systemEventClass is generated, the listener is notified and the processEvent
    method of the listener is invoked. |

    | subscribeToEvent(Class<? extends SystemEvent> systemEventClass,Class<?> sourceClass,SystemEventListener
    listener) | Registers the listener with the event of type systemEventClass originating
    from the source of type sourceClass. |

    | unsubscribeFrom(Class<? extends SystemEvent> systemEventClass,SystemEventListener
    listener) | Unregisters the listener from the event of type systemEventClass.
    |

    | unsubscribeFrom(Class<? extends SystemEvent> systemEventClass,Class<?> sourceClass,SystemEventListener
    listener) | Unregisters the listener from the event of type systemEventClass originating
    from the source of type sourceClass.


    The SystemHolder interface is provided for implementing classes to keep a list
    of SystemEventListener instances for each type of SystemEvent that the classes
    generate. The UIComponent and ExceptionQueuedEvent classes implement the SystemEventListenerHolder
    interface. SystemEventListenerHolder provides only the method discussed in Table
    11.6.


    Table 11.6 SystemEventListenerHolder Method

    | Method | Description |

    | --- | --- |

    | getListenersForClass(java.lang.Class<? extends SystemEvent> facesEventClass)
    | Returns a list of SystemEventListener instances that are registered with the
    class implementing the interface'
