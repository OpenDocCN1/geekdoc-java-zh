  md: "# NEW VALIDATORS\n\nJSF 2.0 introduces new validators: f:validateRequired and\
    \ f:validateRegex. f:validateRequired is similar to the required attribute in\
    \ an input UIComponent. If it is specified for a UIComponent, and the disabled\
    \ attribute is not set to false, a value is required for the input component.\n\
    \nTo explore the use of f:validateRequired, follow these steps:\n\n+   1. In the\
    \ input2.xhtml page, add a f:validateRequired tag within the h:inputText tag:\n\
    \n```html\n<h:inputText id=\"inputText1\" binding=\"#{catalog.inputText}\" value=\"\
    #{catalog.sqlquery}\">\n<f:validateRequired />\n</h:inputText>\n```\n\n+   2.\
    \ Before you can test the f:validateRequired tag, you must comment out the javax.faces.VALIDATE_EMPTY_FIELDS\
    \ settings to true in web.xml:\n\n```xml\n<context-param>\n  <param-name>javax.faces.VALIDATE_EMPTY_FIELDS</param-name>\n\
    \  <param-value>false</param-value>\n</context-param>\n```\n\n+   3. Redeploy\
    \ the application and run the input2.xhtml JSF page.\n\n+   4. Do not specify\
    \ a SQL Query but click Submit. The application displays a validation error message,\
    \ \"Value is required,\" as shown in Figure 6.17.\n\n![](img/982ffb5d3f694b76eb8a3e1299f348e8_186_0.png)\n\
    \n**Figure 6.17**\nA validation error message for f:validateRequired.\nGoogle\
    \ and the Google logo are registered trademarks of Google Inc., used with permission."
