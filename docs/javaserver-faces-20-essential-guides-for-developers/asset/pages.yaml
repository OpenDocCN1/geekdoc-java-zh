    Next, we will discuss a validation constraint example using the @Size annotation.
    The @Size constraint validates whether the annotated element is within the specified
    size range, including the boundary values. The @Size constraint may be used on
    the types discussed in Table 6.2.


    | Table 6.2 Types Supported by @Size |

    | Type | Evaluated parameter |

    | String | String length |

    | Collection | Collection size |

    | Map | Map size |

    | Array | Array length |


