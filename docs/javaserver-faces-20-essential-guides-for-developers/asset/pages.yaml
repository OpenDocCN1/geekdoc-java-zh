    When the JSF page is posted in a POST request with the value in the h:inputText
    field, the value is set on the catalogId property. But no provision to include
    request parameters in a GET request is provided in JSF 1.2.


    # VIEW PARAMETERS IN JSF 2.0


    View parameters add the provision to send request parameters in a GET request.
    A view parameter is a UI component represented with the UIViewParameter class.
    Just like other UI components, it is saved in the UI component for a JSF page
    and may be associated with validators and converters. A view parameter is an EditableValueHolder
    because it implements the interface.


    You specify the mappings for the view parameters to managed properties in f:viewParam
    tags, which are specified within the f:metadata tag. The f:metadata tag must be
    specified at the top level within a JSF view. For example, add the f:viewParam
    tag to the f:metadata tag:


    ```

    <f:metadata>

    <f:viewParam id="catalogId" name="catalogId" value="#{catalog.catalogId}\/>

    </f:metadata>

    ```


    The f:viewParam tag specifies a value binding from a view parameter catalogId
    to a managed bean property catalogId. An h:inputText tag with the catalogId value
    is also specified. The input.xml JSF page with the f:viewParam tag appears in
    Listing 7.7.


    Listing 7.7 The input.xml page with f:viewParam


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml/html-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml"

    xmlns:ui="http://java.sun.com/jsf/facelets"

    xmlns:h="http://java.sun.com/jsf/html"

