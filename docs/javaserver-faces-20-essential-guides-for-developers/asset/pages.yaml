  md: '# CHAPTER 1


    # WHAT’S NEW IN JSF 2.0


    Java Faces (JSF) technology is used for developing server-side user interfaces
    (UIs) for Java EE applications. JSF 2.0 has introduced several new features, most
    of which are discussed in this chapter. The salient new features in JSF 2.0 are
    as follows:


    +   - State saving

    - Facelets

    - Navigation

    - Validations

    - Scopes

    - Ajax

    - Resource handling

    - Composite components

    - View parameters

    - Client behaviors

    - Event handling

    - Exception handling


    ![](img/982ffb5d3f694b76eb8a3e1299f348e8_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: '2 Chapter 1 What''s New in JSF 2.0


    # STATE SAVING


    In JSF 1.2, the full component tree is saved/restored. Attributes are also stored
    and restored. Saving and restoring the full state has performance and memory ramifications,
    as the complete state must be saved and restored and the size of the state saved
    could be large.


    In JSF 1.2, each UIComponent saves/restores its own state in the component hierarchy
    using saveState and restore methods in StateHolder. If state saving were to be
    optimized, it would have to be added to each component class in the hierarchy.


    JSF 2.0 introduced partial state saving, in which the initial state of the component
    tree is marked and only the delta state changes by modifications are saved. This
    makes the size of the state saved small. You restore the component tree by re-executing
    the view and subsequently updating with the saved delta state change. Instead
    of implementing the StateHolder interface, components in JSF 2.0 implement the
    PartialStateHolder interface which provides the partial state feature. PartialStateHolder
    provides the methods listed in Table 1.1.


    Table 1.1 Methods in PartialStateHolder interface

    | Method | Description |

    | --- | --- |

    | initialState() | Invoked to mark the initial state of a component in the view
    by the runtime. |

    | initialStateMarked() | Returns a Boolean to indicate if delta state changes
    are being tracked. Returns true if delta changes are being marked and false otherwise.
    |

    | clearInitialState() | Clears the initial state to reset to a non-delta tracking
    state. |


    To make it easier for UIComponents to implement PartialStateHolder, the StateHelper—which
    is a map-like interface with methods such as add, eval, get, put, and remove—is
    provided to store a component''s state such as attributes and listeners. Partial
    state saving makes the size of the state saved about four times smaller. Because
    you restore the state by re-executing the view, restoring of the component tree
    could take more time than in JSF 1.2.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'By default, JSF 2.0 uses partial state saving. The javax.faces.PARTIAL_STATE_SAVING
    context

    parameter is provided to turn off/on partial state saving. You can change the
    partial state

    saving parameter using the PARTIAL_STATE_SAVING_PARAM_NAME parameter.


    To implement state saving, JSF 2.0 has introduced tree visiting. In JSF 1.2,

    only one component could be invoked in a single tree traversal using the

    UIComponent.invokeComponent() method. If multiple components must be invoked,
    as in

    Ajax request or state saving, multiple tree traversals must be applied. With

    visiting, you can invoke multiple components in a single tree traversal. Implement

    tree visiting using the visitTree(VisitContext context, VisitCallback callback)
    method.

    VisitContext is a context object that holds the state for the component tree visit.

    VisitCallback is an interface to visit a specified UIComponent in a tree visit.


    # FACELETS


    JSF 1.2 used the JSP view technology. JSF 2.0 uses the Faclets view definition
    language

    (VDL) as the default rendering technology. Faclets is an extension to JavaServer

    Faces and uses XHTML syntax to define a JSP page. Faclets are XHTML pages

    by default the .xhtml extension. The default Faclets suffix is specified by the

    DEFAULT_FACLETS_SUFFIX context parameter. The Faclets view handler in JSF 1.2
    must be

    sified in faces-config.xml with the following configuration:


    ```

    <application>

    <view-handler>com.sun.faclets.FaceletHandler</view-handler>

    </application>

    </faces-config>

    ```


    In JSF 2.0, a view handler is not configured, and the default view handler

    javax.faces.application.ViewHandler is used. The default faces-config.xml for
    Faclets in

    JSF 2.0 is an empty file. The DEFAULT_FACLETS_SUFFIX constant in the

    ViewHandler view handler is .xhtml. Other Faclets suffixes may be specified using
    the

    javax.faces.FACLETS_VIEW_MAPPINGS context parameter.


    ```

    <context-param>

    <param-name>javax.faces.FACLETS_VIEW_MAPPINGS</param-name>

    <param-value>jsf:.jsp</param-value>

    </context-param>

    ```'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 1 What''s New in JSF 2.0


    # NAVIGATION


    Navigation in JSF 1.2 is configured using navigation rules based on outcomes from
    a view ID in faces-config.xml. For example, to navigate to output.jsp if the outcome
    from input.jsp is “success” and to navigate to error.jsp if the outcome is “error,”
    specify the following navigation rule in faces-config.xml:


    ```

    <navigation-rule>

    <from-view-id>/input.jsp</from-view-id>

    <navigation-case>

    <from-outcome>success</from-outcome>

    <to-view-id>output.jsp</to-view-id>

    </navigation-case>

    <navigation-case>

    <from-outcome>error</from-outcome>

    <to-view-id>error.jsp</to-view-id>

    </navigation-case>

    </navigation-rule>

    ```


    JSF 2.0 has simplified navigation with the introduction of implicit navigation.
    With implicit navigation, the navigation is based on the outcome. Implicitly,
    the JSF application navigates to a view with the same name as the outcome. For
    example, if the outcome is “output,” the navigation handler navigates to output.xhtml,
    if provided.


    JSF 2.0 has also introduced conditional navigation, with which the navigation
    handler navigates to a view ID based on a condition EL expression in faces-config.xml.
    JSF 2.0 has also introduced the ConfigurableNavigation class for configuring navigation
    programmatically. Preemptive navigation is another new feature used to determine
    the destination URL based on outcome. The new components h:button and h:link support
    preemptive navigation.


    # VALIDATION


    In JSF 1.2, validation is implemented using built-in validators:


    +   - f:validateDoubleRange. This is for a double value with an optional range.

    - f:validateLongRange. This is a long value with an optional range.

    - f:validateLength. This is a String value with a minimum and maximum number of
    characters.


    JSF 1.2 also supports custom validators with the f:validator tag and the javax.faces.validator.Validator
    interface. JSF 1.2 does not have a built-in provision for empty field validation
    and validation with regular expressions.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'JFS 2.0 has introduced validation of empty fields, which is also available
    for custom validators. Three new built-in validators have been added:


    +   - f:validateRegex. This is for regular expressions.

    - f:validateRequired. This is for required fields.

    - f:validateBean. This is for Bean Validation, which is another new feature. Bean
    Validation is implemented in conjunction with validation constraint annotations,
    which are defined in the javax.validation.constraints package. Validation constraint
    annotations annotate managed bean properties. For example, the @Size annotation
    constrains size and the @Pattern requires conformance with a regular expression.
    Bean Validation is also supported with annotation custom validators.


    # SCOPES AND CONFIGURATION


    As mentioned, the faces-config.xml in JSF 2.0 is an empty file. The JSF 1.2 faces-config.xml
    file has configuration for managed beans, managed bean properties, scopes, validators,
    converters, and renderers. JSF 2.0 has introduced annotations-based configuration
    for managed beans, managed bean properties, scopes, validators, converters, and
    renderers. New scopes—view, flash, and custom—have been added for finer-grained
    scopes. JSF 2.0 has added a new configuration project stage that indicates the
    state of the project.


    # AJAX


    JSF 1.2 did not provide built-in support for Ajax. As a result, an Ajax framework
    such as Ajax4jsf had to be used. Alternatively, how to implement Ajax via the
    XMLHttpRequest object without any framework. JSF 2.0 has added support for Ajax
    with the f:ajax tag, which includes support for partial page rendering and grouped
    components.


    # RESOURCE HANDLING


    Resources are files required by a JSF application. Resources might include CSS,
    JavaScript, or image files. JSF 2.0 has added a ResourceHandler API that is based
    on path-based aging conventions for serving resources. JSF 2.0 has also added
    new tags for resource handling: h:head, h:body, h:outputScript, and h:outputStylesheet.
    Some of the new resource-handling features include relocating resources and ordering
    of multiple faces-config.xml application configuration resources.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# COMPOSITE COMPONENTS


    JSF 2.0 has introduced a composite tag library for creating composite components.
    A composite component is a composite (collection) of other UI components. A composite
    component consists of a library, which makes use of the new resource-handling
    feature; a definition page; and a using page. The definition page and using page
    are based on Facelets. A definition page defines a composite component and a using
    page makes use of a composite component.


    # VIEW PARAMETERS


    JSF 1.2 includes support for sending parameters only in a POST request. View parameters
    add the provision to send request parameters in the f:metadata tag using the f:viewParam
    tags. View parameters are configured in the EditableValueHolder components and
    may be configured with validators and converters just as other as h:inputText.
    View parameters also support system events using the f:event tag. Preemptive navigation,
    which was mentioned in the “Navigation” section, and bookmarking are feasible
    with view parameters. View parameters may also be used with JavaFaces directs.


    # CLIENT BEHAVIORS


    Client behaviors are scripts that respond to user interaction (events) and may
    perform an action on the client or trigger a postfix response to the JSF lifecycle.
    Behaviors are objects attached to components to provide additional functionality.
    Client behaviors are an implementation of behaviors with which scripts may be
    attached to components to be run from client-side events. A Facelet taglib is
    required for a client behavior. Client behaviors are added to a Facelets using
    tags from the Facelets taglib.


    # EVENT HANDLING AND EXCEPTION HANDLING


    JSF 2.0 has introduced a new type of events, called system events. System events
    are of two types: application scoped system events and component system events.
    System events are similar to—but with more precise granularity—phase events. For
    event handling in an Ajax request, the f:ajax tag includes an onevent attribute
    to register a callback JavaScript function. ExceptionHandler is a new class to
    handle unexpected exceptions. The f:ajax tag includes an onerror attribute for
    error-handling callback functions.


    # SUMMARY


    This chapter introduced the new features in JSF 2.0. Subsequent chapters will
    discuss these new features in more detail.'
