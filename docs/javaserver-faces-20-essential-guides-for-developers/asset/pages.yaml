  md: "# VIEW PARAMETERS IN REDIRECTS\n\nIn a JSF redirect, the JSF servlet redirects\
    \ to another URL and displays the redirected URL in the browser. This is in contrast\
    \ to a forward, in which the JSF servlet internally forwards the request to another\
    \ resource and the URL in the browser is the same as the URL from which the forward\
    \ was initiated.\n\nTo see how this works, you will use the input4.xhtml, input3.xhtml,\
    \ input2.xhtml JSF pages. In input4.xhtml, view parameters for catalogid and sqlQuery\
    \ are defined, and a panel grid consisting of h:outputLabel, an h:inputText, and\
    \ an h:commandButton is specified. The input4.xhtml page appears in List 7.13.\n\
    \nList 7.13 The input4.xhtml Page\n\n```\n<DOCTYPE html PUBLIC \"-//W3C//DTD HTML\
    \ 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n  xmlns:ui=\"http://java.sun.com/jsf/facelets\"\
    \n  xmlns:f=\"http://java.sun.com/jsf/core\"\n  xmlns:metadata=\"metadata\">\n\
    \  <f:metadata>\n    <f:viewParam id=\"catalogId\" name=\"catalogId\"\n    value=\"\
    #{catalog.catalogId}\"/>\n    <f:viewParam id=\"Id\" name=\"sqlQuery\" value=\"\
    #{catalog.sqlQuery}\"/>\n  </f:metadata>\n  <f:view>\n  <body>\n    <h:messages//>\n\
    \    <h:outputText value=\"CatalogId: #{catalog.catalogId}\" />\n    <h:form id=\"\
