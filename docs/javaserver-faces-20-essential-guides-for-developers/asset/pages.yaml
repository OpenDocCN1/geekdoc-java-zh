  md: "# Bean Validation Integration\n\nThe JSR 303 specification defines a metadata\
    \ model and an API—the default metadata source being annotations—that may be used\
    \ to specify validation constraints in an application layer-independent manager.\
    \ The application developer is not required to specify validators for each of\
    \ the input EditableHolder components, but the bean validator is automatically\
    \ applied to all the fields in a JSF page and the validation constraints are applied\
    \ by the bean validator provider.\n\nThe bean validation constraints are defined\
    \ in the javax.validation.constraints package, and custom constraints may also\
    \ be defined. In the “Validation Constraint Annotations” section earlier in this\
    \ chapter, you used some bean validation constraints. You do not have to add any\
    \ configuration for the validation constraints. JSF 2.0 provides built-in integration\
    \ with the bean validation and automatically validates validation constraints\
    \ that annotate input components in a managed bean.\n\nYou can customize bean\
    \ validation using the <f:validateBean/> tag. For example, you can turn off bean\
    \ validation using the disabled attribute:\n\n```\n<f:validateBean disabled=\"\
    true\" />\n```\n\nYou can also turn off bean validation by doing one of the following:\n\
    \n+   Adding the following tag to faces-config.xml:\n```xml\n<application>\n \
    \ <default-validators/>\n</application>\n```\n\n+   Setting the javax.faces.validator.DISABLE_DEFAULT_BEAN_VALIDATOR\
    \ context-param to turn it in web.xml:\n```xml\n<context-param>\n  <param-name>javax.faces.validator.DISABLE_DEFAULT_BEAN_VALIDATOR</param-name>\n\
    \  <param-value>true</param-value>\n</context-param>\n```\n\nIf bean validation\
    \ is turned off using one of these methods and f:validateBean is used in a JSF\
    \ page, then f:validateBean overrides the settings in web.xml and faces-config.xml.\
    \ For example, if bean validation is turned off in web.xml or faces-config.xml\
    \ and the <f:validateBean/> tag is included in a component in a JSF page, bean\
    \ validation is activated because of the <f:validateBean/> tag. You can specify\
    \ f:validateBean within an input component tag; alternatively, you can specify\
    \ one or more input components within"
  merge: -1
