  md: '# 84 Chapter 4 Creating Composite Components


    A "using page." This is a view definition language (VDL) page, a Facelets XHTML
    page in which the composite component is using a composite component tag. The
    HTML_BASIC render contains a new renderer called javax.faces.Composite for composite
    components.


    In this chapter, you will create two composite components, each for a JSF data
    table, in two separate resource libraries, using the composite components in a
    using page. Each of the composite components consists of the following JSF UI
    components:


    +   - An output label for an input text field

    - An input text field for an SQL query from which a data table is to be created

    - A Submit button

    - A data table created when a user submits an SQL query


