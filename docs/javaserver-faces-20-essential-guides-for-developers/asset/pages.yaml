  md: '# ORDERING OF APPLICATION CONFIGURATION RESOURCES


    You can specify multiple application-configuration resources in a Facelets application.
    The JSF implementation searches for application-configuration resources in the
    following order and makes a list:


    +   1. All resources that match META-INF/faces-config.xml or with .facesconfig
    in the META-INF directory

    2. The javax.faces.CONFIG_FILES context initialization parameter resource paths

    3. The application configuration resources in the /WEB-INF directory, except faces-config.xml


    JSF 2.0 has added the provision to order the application-configuration resources.
    A JSF 2.0 application with multiple view handlers may be required to configure
    the view handler delegation chain in a specific order. Or, with multiple phase
    listeners registered, an application may be required to process the phase listeners
    in a particular order.


    The faces-config.xml file in JSF 2.0 has introduced new elements, <ordering/>
    and <absolute-ordering/>, to order named application-configuration resources.
    The <ordering/> element specifies the relative ordering of application-configuration
    resources. The <absolute-ordering/> element specifies the absolute ordering. <absolute-ordering/>
    may have zero or more <name> sub-elements, which represent named application-configuration
    resources, and optionally an <others/> element, which represents all the other
    application-configuration resources, named or unnamed. The <ordering/> element
    may contain the sub-elements discussed in Table 10.2.


    | Table 10.2 Sub-Elements of <ordering/> |

    | Sub-Element | Description |

    | <before></before> | The resource must be ordered before the named resource.
    |

    | <after></after> | The resource must be ordered after the named resource. |


    Next, we will discuss an example of using multiple faces-config-<n>.xml files
    with a different PhaseListener element configured in each to demonstrate the ordering
    of faces-config-<n>.xml. (Note that <n> specifies the resource number.) The faces-config.xml'
  merge: -1
