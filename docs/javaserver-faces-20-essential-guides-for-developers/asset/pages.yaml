    # OVERVIEW OF THE BEHAVIOR API


    Table 8.1 outlines some of the classes and interfaces and an annotation in the
    Behavior API in the javax.faces.component.behavior package.


    | Table 8.1 Behavior API Classes and Interfaces in javax.faces.component.behavior
    Package |

    | Class/Interface | Description | Some of the Methods |

    | --- | --- | --- |

    | Behavior | Root interface of the component behavior model | Broadcast(BehaviorEvent):
    Broadcasts to all registered listeners |

    | ClientBehavior | Base interface for behaviors that attach scripts to client
    events that are exposed by ClientBehaviorHolder components | getScript: Returns
    the JavaScript associated with the client behavior |

    | AjaxBehavior | A ClientBehavior implementation that generates an Ajax request
    | addAjaxBehaviorListener(AjaxBehaviorListener): Adds a listener to receive event
    notifications from AjaxBehavior |

    | BehaviorBase | A base class that provides default implementation of Behavior
    | addBehaviorListener, broadcast |

    | ClientBehaviorBase | Base class for ClientBehavior | decode, getRenderer |

    | ClientBehaviorHolder | Interface to be implemented by all UIComponents that
    are required to support client behaviors as defined by ClientBehavior | addClientBehavior:
    Adds the client behavior to the component for the specified event |'
