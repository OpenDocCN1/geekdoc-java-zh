  md: '# Preemptive Navigation and Bookmarking 217


    button component is used to determine the target view ID by the navigation handler
    during the pre-rendering phase to construct the destination URL. The resulting
    destination URLs are bookmarkable. You can include view parameters in the resulting
    URLs using the includeViewParams attribute. For example, the h:link constructs
    the destination URL from the output (input2.html) and the view parameters, if


