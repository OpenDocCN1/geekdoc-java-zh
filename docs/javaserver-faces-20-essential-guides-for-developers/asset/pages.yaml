- img_proc: true
  md: '# CHAPTER 5


    # ENHANCED NAVIGATION


    Navigation is an important aspect of JSF. Version 1.2 is limited to navigation
    rules specified in the faces-config.xml configuration file. JSF 2.0, however,
    provides new features to facilitate navigation, which are discussed in this chapter.
    The new navigation features are as follows:


    +   - Implicit navigation. Implicit navigation is implemented if a navigation
    rule or navigation case is not specified for an action or outcome from a JSF page.


    +   - Conditional navigation. Conditional navigation is specified in the faces-config.xml
    using an EL expression that evaluates to a Boolean.


    +   - Preemptive navigation. JSF 2.0 has introduced a new type of navigation handler
    called a configurable navigation handler. Using this, the navigation cases for
    from-view-id may be retrieved and modified programmatically.


    # Setting THE ENVIRONMENT


    As a first step, download and install the following software:


    +   - Oracle Developer 12c (12.1.2.0) (www.oracle.com/technetwork/developer-tools/jde/downloads/index.html)


    +   - Oracle WebLogic Server 12c (included with JDeveloper 12c)


    +   - Oracle Database Express Edition (XE) 11g (www.oracle.com/technetwork/database/database-technologies/express-edition/downloads/index.html)'
