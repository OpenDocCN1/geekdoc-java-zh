  md: "# Custom Validators and Null and Empty Values\n\n5. If the SQL query does not\
    \ match the regular expression pattern, throw a ValidatorException consisting\
    \ of a FacesMessage. The custom validator appears in Listing 6.7.\n\n```\nif (!matcher.matches())\
    \ {\n    throw new ValidatorException(message);\n}\n```\n\nListing 6.7 Custom\
    \ Validator Class ValidatorBean.java\n\n```\npackage view;\n\nimport java.util.regex.*;\n\
    import javax.faces.application.FacesMessage;\nimport javax.faces.component.UIComponent;\n\
    import javax.faces.context.FacesContext;\nimport javax.faces.validator.*;\n@FacesValidator(\"\
    view.Validator\")\npublic class ValidatorBean implements Validator {\n    private\
    \ static final String SQLQUERY_REGEXP = \"SELECT[\\\\s]+\\\\*+[\\\\s]+FROM[\\\\\
    s]+[a-zA-Z]*\";\n    @Override\n    public void validate(FacesContext context,\
    \ UIComponent c, Object val) throws ValidatorException {\n        String sqlquery\
    \ = (String)val;\n        Pattern mask = Pattern.compile(SQLQUERY_REGEXP);\n \
    \       Matcher matcher = mask.matcher(sqlquery);\n        if (!matcher.matches())\
    \ {\n            FacesMessage message = new FacesMessage();\n            message.setDetail(\"\
    Please enter a valid SQL Query\");\n            message.setSummary(\"SQL query\
    \ not valid\");\n            message.setSeverity(FacesMessage.SEVERITY_ERROR);\n\
    \            throw new ValidatorException(message);\n        }\n    }\n}\n```\n\
    \n6. Specify the custom validator on the input component for an SQL query using\
    \ the f:validator tag:\n\n```\n<f:validator validatorId=\"view.Validator\"/>\n\
    ```"
