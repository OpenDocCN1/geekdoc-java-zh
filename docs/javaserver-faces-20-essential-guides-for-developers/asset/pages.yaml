  md: '# Validation Constraint Annotations 165


    @Max

    This validates that the annotated element is a number with a value less than or
    equal to the specified maximum.


    @Min

    This validates that the annotated element is a number with a value greater than
    or equal to the specified minimum.


    @NotNull

    This validates that the annotated element must be null.


    @Null

    This validates that the annotated element must be a date in the past.


    @Pattern

    This validates that the annotated string matches the regular expression.


    @Size

    This validates that the annotated element is within the specified minimum and
    maximum constraints inclusive of the boundaries.


    This section discusses some of these constraints. First, however, it covers a
    family validation example from JSF 1.2. The required attribute of the h:inputText
    component validates a value that has been specified for the input field text.
    In input.xhtml, you specify the following:h:inputText element with the required
    attribute to true:


    ```

    <h:inputText id="inputText1" binding="#{catalog.inputText1}" required="true"/></h:inputText>

    ```


