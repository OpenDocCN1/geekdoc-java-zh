  md: '# 98 Chapter 4 Creating Composite Components


    18. The EL expression for the binding is mapped to the bindingSQLQuery <<attribute>,
    which implies the value for the bindingSQLQuery attribute specified in the component
    declaration tag in a using page applied to the binding attribute of the h:inputText
    UI tag. Add an <h:commandButton> UI component for a Submit button. The id of the
    submit button matches the client ID specified in the targets attribute of <cc:actionSource
    within the <cc:interface> tag. The value expression for the h:commandButton is
    mapped to the valueCommandBuffer <<attribute> specified in the composite component
    tag in a using page is applied to the h:commandButton''s value attribute. Similarly,
    the EL expression for the binding attribute maps to the bindingComboBox <<attribute>,
    and the EL expression for the action attribute maps to the submitAction <<cc:interface>
    tag.


