    # # REDIRECT WITH FLASH SCOPE


    The POST/REDIRECT/GET (PRG) pattern is recommended for form submissions to prevent
    a POST request from being resubmitted. But if the PRG pattern is used in a JSF
    application, in a JSF redirect, a new request to the redirect URL is generated,
    and the request-scoped objects from the previous request are not available in
    the new request. To demonstrate a JSF redirect with implicit navigation, follow
    these steps:


    +   1. Modify the return value of the action method commandButton_action() in
    managed bean catalog2 class Catalog2.java in the request-scoped managed bean.
    Specifically,


    `return "output2";`


    with the following:


    `return "output2?faces-redirect=true";`

    2. Redeploy the application and run the input.xhtml page with the following URL:
    http://localhost:7101/webapp1/faces/input.xhtml. Specify SQL query and click Submit,
    as shown in Figure 9.12.'
