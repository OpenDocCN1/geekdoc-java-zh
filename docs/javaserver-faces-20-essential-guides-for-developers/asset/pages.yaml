  md: "# Component Parameters with View Parameters\n\n![](img/982ffb5d3f694b76eb8a3e1299f348e8_233_0.png)\n\
    \n# JSF Data Table\n\nSQL Query: SELECT * FROM OE CATALOG WHERE CATALOGID=2\n\n\
    | Catalog Id | Journal | Publisher | Edition | Title | Author |\n| --- | --- |\
    \ --- | --- | --- | --- |\n| 2 | Oracle Magazine | Oracle Publishing | Nov-Dec\
