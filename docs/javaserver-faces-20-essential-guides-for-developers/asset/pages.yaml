  md: '# CHAPTER 3


    # AJAX


    Chapter 2, “Templating with Facelets,” discussed Facelets, which is the default
    view definition language in JSF 2.0. This chapter discusses another new feature
    in JSF 2.0: support for Ajax in UI components.


    JSF 2.0 has introduced a provision for adding Ajax functionality to any JSF component.
    Ajax provides asynchronous transfer of data between a client and a server. Ajax
    features in JSF 2.0 include support for partial page rendering, partial page processing,
    and grouping of components. You can add support of Ajax in JSF 2.0 by using the
    f:ajax tag. In this chapter, you will add Ajax support to a JSF 2.0 data table.


    # SETTING THE ENVIRONMENT


    As a first step, if you haven''t done so already, download and install the following
    software:


    +   - Oracle JDeveloper 12c (12.1.2.0.0) (www.oracle.com/technetwork/developer-tools/jdev/downloads/index.html)


    +   - Oracle WebLogic Server 12c (included with JDeveloper 12c)


    +   - Oracle Database Express Edition (XE) 11g (www.oracle.com/technetwork/database/database-technologies/express-edition/downloads/index.html)


    To generate a JSF data table, you need a data source from which to create a database
    table in Oracle Database 11g XE if you haven''t done so already. See the SQL script
    in Listing 3.1 to specify one.'
  merge: -1
