    # CUSTOM VALIDATORS AND NULL AND EMPTY VALUES


    You can create custom validators by implementing the javax.faces.validator.Validator
    interface. Custom validators are not a new feature in JSF 2.0. However, support
    for null/empty fields in custom validators is a new feature in JSF 2.0. In this
    section, you will create a custom validator to validate an input component for
    an SQL query with a regular expression. Follow these steps:


    +   - Create a JavaBean Java class that implements the Validator interface, as
    shown in Figure 6.24.'
