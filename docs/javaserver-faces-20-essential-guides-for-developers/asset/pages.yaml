  md: "# View Parameters in JSF 2.0 209\n\nAs discussed, view parameters are saved\
    \ in the UI tree. Their value does not have to be re-specified in a component\
    \ tree postback when a JSF page is submitted. In the previous example, the h:inputText\
    \ field is included, but it is not required. The input.xhtml JSF page with just\
    \ a command button in Listing 7.8.\n\n**Listing 7.8** The input.xhtml Page without\
    \ h:inputText\n\n```\n<!DOCTYPE html PUBLIC \"-\\-//W3C//DTD HTML 1.0 Transitional//EN\"\
    \n\n\"http://www.w3.org/TR/html4/transitional/html4-transitional.dtd\">\n<html\
    \ xmlns:x=\"http://www.w3.org/1999/xhtml/xml\"\nxmlns:ui=\"http://java.sun.com/jsf/facets\"\
    \nxmlns:h=\"http://java.sun.com/jsf/html\"\nxmlns:f=\"http://java.sun.com/jsf/core\"\
    >\n<f:metadata>\n  <f:viewParam id=\"catalogId\" name=\"catalogId\" value=\"#{catalog.catalogId}\"\
    \ />\n</f:metadata>\n<f:view>\n  <h:inputText value=\"Catalog: #{catalog.catalogId}\"\
    \ />\n  <h:body>\n    <h:form id=\"form1\">\n      <h2>JSF Data Table</h2>\n \
