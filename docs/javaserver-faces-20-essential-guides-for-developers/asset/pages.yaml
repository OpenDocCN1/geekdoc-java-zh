  md: '# 132 Chapter 5 Enhanced Navigation


    Another new feature in JSF 2.0 navigation is the provision to match null outcomes.
    For a null outcome, the NavigationHandler will match or try to match navigation
    cases that do not specify a <from-outcome> and that include a condition expression
    with the <if> tag. If none of the navigation cases contain a non-null condition
    expression, the same view ID is re-displayed. If a non-null outcome is specified
    and the condition expression evaluates to false, the implicit navigation is implemented.
    This is discussed in the previous section.


    To gain a better understanding of conditional navigation, follow these steps:


    +   1. Add a managed property of type boolean called navigate to the managed bean
    class Catalog.java and set its value as discussed in the subsequent examples.


    +   2. To see conditional navigation in action, see navigate to false and set
    the action method outcome to "output". These settings replace the return "output"
    value in the action method, as shown in Figure 5.13.


    navigate=false;

    return "output";


    ![](img/982ffb5d3f694b76eb8a3e1299f348e8_144_0.png)


