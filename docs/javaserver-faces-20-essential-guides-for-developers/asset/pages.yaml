  md: '# CHAPTER 4


    # CREATING COMPOSITE

    COMPONENTS


    JSF 2.0 has introduced a new feature, composite components. These are reusable
    JSF components that can be developed from a collection of JSF UI components. Composite
    components do not require any Java code or XML configuration file. A composite
    component consists of a top-level UIComponent and a tree (hierarchical structure)
    of UIComponents within the top-level component.


    Composite components are built using two other new features in JSF 2.0: Facelets
    and resources. A composite component is a Facelet markup file, which may include
    templating tags from the Facelets templating tag library in a resource library.
    The metadata for a composite component is defined using the composite tag library
    (http://docs.oracle.com/javaee/javaserferaces/2.1/docs/vldocs/facelets/tld-summary.html).
    The composite:interface and the composite:implementation tags are the required
    tags for defining metadata for a composite component.


    A composite component application consists of the following artifacts:


    +   - Definition page. This Facelets markup page contains the composite component
    declaration and definition. The composite component declaration is specified within
    the composite:interface tag, and the composite component definition is specified
    within the composite:implementation tag. Each definition page defines one composite
    component.


    +   - Composite component library. This resource library contains the definition
    pages for the different composite components in the library.'
