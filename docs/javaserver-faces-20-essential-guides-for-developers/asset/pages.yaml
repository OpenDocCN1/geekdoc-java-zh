- img_proc: true
  md: '# 64 Chapter 3 Ajax


    Table 3.1 execute Attribute Values


    | execute Attribute Value | Description |

    |---|---|

    | @this | This component. The default value. |

    | @all | All components. |

    | @form | The form component |

    | @none | No components |

    | clientId | Specified components. Components are identified by their ID—for example,
    form1:dataTable to specify a data1 in a form. If the specified component is at
    the same level as the component for which the f:ajax tag is specified, the preceding
    component ID may be omitted. |


    The event attribute specifies which Document Object Model (DOM) event initiates
    an Ajax request. The event attribute value may be one of the following.


    +   - Supported DOM events for the component, as click, change, dblclick; the
    on prefix is omitted.

    - The action event may be specified, and is the default, for Faces ActionSource
    components as command buttons or command links.

    - The valueChangeEvent may be specified, and is the default for, Faces Editable
    ValueHolder components, which are editable components, such as an input text component.


    The event specified should be supported by the component. For example, the value
    event is not supported by a command button. We have specified the keyup event
    to indicate that an Ajax request is sent with keyup event in the input text. The
    render attribute specifies the components to be rendered in the response phase
    of the request. Because the dataTable component is at the same hierarchical level
    as the inputText, form1: prefix is omitted; only dataTable is specified in the
    render attribute. The same values as those for the execute attribute may be specified,
    except the default value is @none. The listener attribute specifies the method
    to invoke when an AjaxChangeEvent is broadcast. We have specified the listener
    with a method expression as listener=#{catalog.inputTextListener}, which invokes
    the inputTextListener(AjaxChangeEvent) method in the managed bean.'
