  md: '# Creating Composite Components


    11. The action attribute of an h:commandButton requires a method expression.

    The method-signature attribute of the <cc:attribute> tag specifies that the attribute
    value must be a MethodExpression with the specified method signature. The Submit
    button (h:commandName) requires a MethodExpression in the action attribute.

    <cc:attribute name="submitAction" method-signature="void f()" required="true/>


    12. Add facets using the <cc:facet> tag for a header and a footer.


    13. Because we are using an h:inputText element in the composite component, add
    a <cc:editableValueHolder> tag within the <cc:interface> tag to specify a UIComponent
    of type editableValueHolder. HtmlInput implements the UI components in a page
    are bound to UI component properties in a managed bean. The "targets" attribute
    of the <cc:editableValueHolder> tag specifies space-delimited IDs, which are relative
    to the ID of the top-level element, of the target elements within the <cc:implementation>
    tag.

    <cc:editableValueHolder name="sqlquery1" targets="sqlquery1/>


    14. For the h:commandButton tag in the composite component, add a <cc:actionSource>
    tag in the <cc:interface> tag to indicate a UIComponent of type ActionSource2.
    SqlCommandButton implements the interface. The "targets" attribute specifies the
    space-delimited IDs of the target elements within the <cc:implementation> tag.

    <cc:actionSource name="submit1" targets="submit1/>


    15. Specify the implementation for the composite component in the <cc:implementation>
    tag. Then render the header and footer facets using the renderFacet tag.

    <cc:renderFacet name="header/>


    16. Add an <h:outputLabel> element for an output label. The for attribute specifies
    the client ID of the UI component for which the label is created. The value expression
    for h:outputLabel is specified using the cc:attrs map, which provides the encapsulation
    of the component attributes.

    <h:outputLabel for="#{cc.clientId}:sqlquery1" value="#{cc.attrs.sqlQueryLabel}/>


    17. The value expression "#{cc.attrs.sqlQueryLabel}" maps to the sqlLabel attribute
    declared in the <cc:interface> tag. The value for the attribute that a user specifies
    in the component declaration tag in a using page gets to the h:outputText UI component
    tag. In the <cc:implementation> tag, specify an h:inputText UI component tag.

    <h:inputText id="sqlquery1" binding="#{cc.attrs.bindingSQLQuery}/>'
