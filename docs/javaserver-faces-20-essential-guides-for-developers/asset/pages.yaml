  md: "# 180 Chapter 6 Enhanced Validations\n\n3. In the Catalog.java managed bean\
    \ class, specify the view.CustomValidationGroup.class validation group in the\
    \ @Size validation constraint annotating the sqlQuery property using the groups\
    \ attribute:\n\n```\n@Size(min=15, max=100, groups = { view.CustomValidationGroup.class\
    \ })\n    private String sqlQuery;\n    public String getSqlQuery() {\n    }\n\
    \    public void setSqlQuery(String sqlQuery) {\n        this.sqlQuery = sqlQuery;\n\
    \    }\n```\n\n4. Apply some other validation constraints, such as the @Pattern\
    \ constraint earlier in the sqlQuery property.\n\n5. Redeploy and rerun the input2.html\
    \ JSP page. The @Size validation constraint is applied to the input text component.\
    \ Any other validation constraint annotating the sqlQuery managed bean property\
    \ does not get applied. The Default group represents all validation constraints\
    \ and is validated by default. When specifying a specific group to be validated,\
    \ the Default group is not validated by default for the @Size validation constraint\
    \ is validated in the preceding example. To validate the validation constraints\
    \ in the Default group, the Default class must be added to the list of validation\
    \ groups:\n\n```\n<inputText id=\"inputText\" binding=\"#{catalog.InputText}\"\
    \ value=\"#{catalog.sqlQuery}\">\n    <f:validateBean validationGroups=\"view.CustomValidationGroup,\
    \ javax.validation.groups.Default\"/>\n</inputText>\n```\n\nIf more than one validation\
    \ constraint is specified in the managed bean, and the h:message tag is used to\
    \ output the validation error message, the validation message is for only one\
    \ of the validation constraints. For example, if the following validation constraints\
    \ are applied to the sqlQuery property:\n\n```\n@Size(min=15, max=100)\n@Pattern(regexp=\"\
    *SELECT[\\s]+[a-zA-Z]+,[\\s]+[a-zA-Z]+,[\\s]+[a-zA-Z]+,[\\s]+[a-zA-Z]+,FROM[\\\
    s]+[a-zA-Z]+\\+\\+\")\n```"
