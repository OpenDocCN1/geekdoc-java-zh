    \ the GET request is http://localhost:7001/webapp1/faces/catalog.jsp?catalogId=1&sqlQuery=SELECT\
    \ * FROM CATALOG, the request parameters' values are set on the catalogId and\
    \ sqlQuery object properties.\n\nJSF 2.0 has added support for view parameters,\
    \ which are similar to page parameters in Seam. You can specify the view parameters'\
    \ binding in the JSF page metadata and the"
