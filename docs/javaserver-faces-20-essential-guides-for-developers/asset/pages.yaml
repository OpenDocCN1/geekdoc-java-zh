  md: '# # CHAPTER 10


    # # RESOURCE HANDLING


    A Web application commonly requires resources to run—associated files such as
    JavaScript, CSS, images, or other Facelets pages. JSF 2.0 has introduced the ResourceHandler
    API to serve resources. ResourceHandler defines a path-based packaging convention
    for resources. After ViewHandler has rendered a view and the browser requests
    for the resources are included in the completely rendered page, the browser requests
    for the resources are included in the page. The Faces servlet invokes the ResourceHandler.isResourceRequest()
    method to determine if the request is for a resource. If the method returns true,
    the Faces servlet invokes the ResourceHandler.handleResourceRequest() method to
    handle the resource request. A resource is represented with the Resource class.


    # # OVERVIEW OF THE RESOURCE HANDLER API


    The tag library for JSF component tags has introduced the tags discussed in Table
    10.1 in the 2.0 version to facilitate resource handling.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# 304 Chapter 10 Resource Handling


    | Table 10.1 New Annotations |

    | Tag | Description |

    | h:head | Renders the markup for the <head> element |

    | h:body | Renders the markup for a <body> element |

    | h:outputScript | Renders the markup for the <script> element that renders the
    resource script |

    | h:outputStylesheet | Renders the markup for the <link> element that renders
    the resource style |


    This chapter discusses the encoding methodology of these new tags to handle resources.
    The h:head element renders the starting <head> tag and the attributes of the element,
    if any. The resources targeted to the </head> element are rendered.

    Rendering the resources involves the following steps:


    +   1. You obtain a UIViewRoot instance.

    2. You invoke the UIViewRoot.getResources() with "head" as the argument to obtain
    a list of component resources targeted to the head.

    3. The list of UIComponent resources is iterated over and encoded. All methods
    are invoked on each of the component resources. The <head/> element is rendered.


    The h:body tag is encoded similarly to the h:head tag. The only difference is
    that the UIViewRoot.getComponentResources is invoked with "body" as the argument.

    The h:outputScript tag is encoded as follows.


    +   1. If the UIComponent''s attribute map has a target attribute, you invoke
    the addComponentResource() method to add the component as a resource to the view.

    2. You create a Resource object using the ResourceHandler.createResource() method,
    like so:

    3. The <script/> element to be rendered requires the src attribute and the type
    attribute. You obtain the src attribute value from the resource as follows:


    ```

    resource=Application.getResourceHandler.createResource(name, library)

    ame and library are obtained from the attribute map for the component. library
    may be null.

    ```


    ```

    String src=resource.getResourcePath();

    ```'
