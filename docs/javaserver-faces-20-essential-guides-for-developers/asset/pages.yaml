    Used in a template to define the layout of a Faclets page uses the template to
    define UIComponents. A template client adds UIComponents to a Faclets page with
    corresponding ui:define tags. If a Faclets page specifies a template and does
    not specify ui:define tags corresponding to ui:insert tags, the default ui:insert
    tags are used in the Faclets page.


    name: This attribute has a corresponding name attribute in a Faclets page''s ui:define
    tag for matching a template with a Faclets page.


    ```

    ui:param

    ```


    name: This required attribute specifies a variable name. value: This required
    attribute specifies a variable''s value as an EL expression or literal.


    Faclets namespace tags may be used in XHTML file. A Faclets application consists
    of the following configuration and templating files:


    +   - A Faclets template page, which is an XHTML page

    - Faclets header and footer XHTML pages

    - A configuration file, faces-config.xml

    - A Faclets composition page, which is also an XHTML page


    The template file defines the layout of a Faclets application. A template file
    consists of <ui:insert> tags to specify the structure of a Faclets application
    that uses the template for defining UI components. The JSF configuration file
    is the only configuration file required; A Faclets configuration file is not required.
    A Faclets page is an XHTML page that includes tags in the Faclets namespace. In
    the next section you will create a Faclets application in JDeveloper 12c, WebLogic
    Server 12c, and Oracle Database 11 XE.


