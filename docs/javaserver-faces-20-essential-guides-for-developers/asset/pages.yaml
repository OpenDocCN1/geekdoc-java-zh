    in the /output folder, the outcome may be specified as "/output/output.xhtml"
    or "/output/output".nImplicit navigation is implemented from the following outcome
    values:


    +   - The return value of an action method.

    - The action attribute of a UIComponent component as h:commandButton and h:commandLink.

    - The outcome attribute of a UILayoutTarget component such as h:link or h:button.

    - The handleNavigation() method of the NavigationHandler API.


    # CONDITIONAL NAVIGATION


    JSF 2.0 has introduced a new type of navigation: conditional navigation. You implement
    conditional navigation using the `<f:if>` tag in a `<navigation-case>` tag in
    faces-config.xml. A single continuous EL value expression specified in the `<f:if>`
    must evaluate to true for the navigation case in which it is defined to be matched.
    Using the existing match criteria (action method and outcome), navigation is implemented
    only if the EL expression in the `<f:if>` evaluates to true.'
