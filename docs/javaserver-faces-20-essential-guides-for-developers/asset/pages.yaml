    # PREEMPTIVE NAVIGATION AND ConfigurableNavigationHandler


    Preemptive navigation is determining the destination URL of an h:link or h:button
    prior to the h:link/h:button being activated or selected. The h:link and h:button
    components are new components in JSF 2.0. Preemptive navigation is feasible with
    the new navigation handler in JSF 2.0. Support for bookmarking and GET-based navigation
    is based on preemptive navigation.


    Prior to JSF 2.0, the NavigationHandler only implemented the navigation for a
    Faces request using handleNavigation(), as specified in faces-config.xml, after
    the invoke application phase to navigate to the next view in a POST request. The
    invoke application phase is the phase during which the root component broadcasts
    events to invoke listeners and action methods. The main limitations of JSF prior
    to version 2.0 are as follows:


    +   - Navigation rules are handled only during the invoke application phase handling
    a POST.

    - The navigation target is available only during the invoke application phase.'
