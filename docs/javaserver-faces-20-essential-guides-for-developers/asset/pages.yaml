  md: "# Creating a Managed Bean\n\nThe javax.faces.application.Handler class provides\
    \ the mechanism to handle JSF views (user interface pages). The DEFAULT_SUFFIX\
    \ field specifies the file extension for a JSF page. The default setting is \"\
    .xhtml .jsp\", which implies that .xhtml and .jsp suffixed pages are JSF. The\
    \ JSF pages you will create in this chapter are XHTML pages. The web.xml page\
    \ appears in Listing 3.2.\n\n# Listing 3.2 The web.xml Page\n\n```\n<?xml version='1.0'\
    \ encoding='windows-1252'?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee http://java.sun.com/ns/javaee/web-app_3_0.xsd\"\
    \n  version=\"3.0\">\n  <servlet>\n    <servlet-name>Faces Servlet</servlet-name>\n\
    \    <servlet-class>javax.faces.webapp.FacesServlet</servlet-class>\n    <load-on-startup>1</load-on-startup>\n\
    \  </servlet>\n  <servlet-mapping>\n    <servlet-name>Faces Servlet</servlet-name>\n\
    \    <url-pattern>/faces/*</url-pattern>\n  </servlet-mapping>\n</web-app>\n```\n\
    \n# CREATING A MANAGED BEAN\n\nFor the JSF pages, you must create a managed bean,\
    \ which is just a POJO class. Follow these steps:\n\n+   1. In the Applications\
    \ navigator, right-click faces-config.xml and select Open, as shown in Figure\
    \ 3.7."
