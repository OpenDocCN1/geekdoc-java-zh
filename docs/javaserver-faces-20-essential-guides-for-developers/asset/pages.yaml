    component definition with the <cc:implementation> tag are the only two required
    tags to define the metadata for a composite tag. Add a <cc:interface> tag and,
    in the tag, add <cc:attribute> tags. A <cc:attribute> specifies an attribute that
    may be given to an instance of a composite tag in a using page. A composite component''s
    attributes are declared in the <cc:interface> tag and implemented or used in the
    <cc:implementation> tag, and for the attributes specified in the using page.


    8. For a data table, the attributes discussed in Table 4.2 using the <cc:attribute>
    tag. The attribute names are arbitrary.


    | Table 4.2 Composite Component Definition Page Attributes |

    | Attribute | Description |

    | bindingSQLQuery | Specifies the binding for h:inputText |

    | bindingCommandButton | Specifies the binding for h:commandButton |

    | valueCommandButton | Specifies the value expression for h:commandButton |

    | valueDataTable | Specifies the value expression for h:dataTable |

    | submitAction | Specifies the action method for h:commandButton |

    | sqlQueryLabel | Specifies the value expression for h:outputLabel |


    9. Required attributes, for which a value must be supplied, are specified using
    required. Because a binding expression for an h:inputText element is needed, specify
    bindingSQLQuery as required:


    ```

    <cc:attribute name="bindingSQLQuery" required="true"/>

    ```


    10. You specify default values using default. Set the default value for the Submit
    button to "Submit":


    ```

    <cc:attribute name="valueCommandButton default="Submit"/>

    ```'
