  md: "# Custom Validators with Bean Validation\n\n4. Add the SQLQuery annotation:\n\
    \n```\npublic @interface SQLQuery (\n}\n```\n\n5. Add the @Constraint annotation,\
    \ which specifies the validation class that implements the validator:\n\n```\n\
    @Constraint(validatedBy = SQLQueryValidator.class)\n```\n\n6. Specify the default\
    \ error message:\n\n```\nString message() default \"SQL Query not valid\";\n```\n\
    \nThe SQLQuery annotation type appears in Listing 6.8.\n\n# Listing 6.8 Annotation\
    \ Type SQLQuery\n\n```\npackage view;\n\nimport java.lang.annotation.Documented;\n\
    import java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\n\
    import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
    \nimport javax.validation.Constraint;\nimport javax.validation.Payload;\n\n@Target({\
    \ ElementType.METHOD, ElementType.FIELD, ElementType.ANNOTATION_TYPE })\n@Retention(RetentionPolicy.RUNTIME)\n\
    @Constraint(validatedBy = SQLQueryValidator.class)\n@Documented\npublic @interface\
    \ SQLQuery {\n    String message() default \"SQL Query is not a valid SQL Query\"\
    ;\n    Class<?[] groups() default {};\n    Class<? extends Payload> payload()\
    \ default {};\n}\n```\n\n7. Create the validation class that implements the annotation.\
    \ The validation class is required to implement the ConstraintValidator interface,\
    \ which takes parameters: the annotation and the type for the input value. To\
    \ begin, create a Java class SQLQueryValidator that implements the javax.validation.ConstraintValidator\
    \ interface, as shown in Figure 6.29."
