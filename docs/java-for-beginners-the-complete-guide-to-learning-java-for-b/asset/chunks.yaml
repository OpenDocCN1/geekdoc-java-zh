    Bank1 Interest Rate: \"+b2.getRat());\n        System.out.println(\"Bank1 Interest\
    \ Rate: \"+b3.getRat());\n    }\n}\n```\n\n方法在不同的类中有不同的使用方式。\n\n## super 关键字\n\
    \n我们使用 `super` 关键字来访问父类中被重写的方法。示例：\n\n```java\nclass Mammals {\n    public void\
    \ drink() {\n        System.out.println(\"Mammals can drink\");\n    }\n}\n\n\
    class Cow extends Mammals {\n    public void drink() {\n        super.drink();\
    \ // to invoke method in super class\n        System.out.println(\"Cows can drink\
