    \  public void drink();\n  public void makeSound();\n}\n\nclass Cow implements\
    \ MammalsInterface {\n  public void drink() {\n      System.out.println(\"Mammals\
    \ drink\");\n  }\n\n  public void makeSound() {\n      System.out.println(\"Mammals\
    \ make sound\");\n  }\n}\n```\n\n"
