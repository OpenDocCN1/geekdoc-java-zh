    The initial \"+met.val);\nmet.changeValue(50);\nSystem.out.println(\"New value\
    \ \"+met.val);\n```\n\n值不会改变。当通过引用传递时，如果对被调用的方法进行了修改，原始值将会改变。如果传递的是对象而不是基本类型，原始值就会改变。示例：\n\
    \n```java\npublic class MethodCallExample2{\n  int val=10;\n  void changeValue(MethodCallExample2\
    \ meth){\n    meth.val=meth.val+50;//修改为实例变量\n  }\n  public static void main(String\
    \ args[]){\n    MethodCallExample2 meth=new MethodCallExample2();\n    System.out.println(\"\
    Initial value \"+meth.val);\n    meth.changeValue(meth);//传递对象\n    System.out.println(\"\
    New value \"+meth.val);\n  }\n}\n```\n\n值从 10 变为了 60，即在加上 50 之后。\n\n# 第 17 章 -\
    \ Java Applets (App 程序)\n\nApplets 是可以在网络浏览器上运行的 Java 程序。由于它拥有完整的 Java API，因此它可以像功能完整的应用程序一样工作。applet\
    \ 类继承自 `java.applet.Applet`。Applets 没有 `main` 方法，因此它们不会调用 `main()`。它们被嵌入在 HTML\
    \ 页面中。在打开带有 applet 的 HTML 页面后，其代码会被下载到本地机器。查看 applets 必须具备 `JVM`（Java 虚拟机）。\n\n\
    Applets 在客户端进行处理，因此与其他应用程序相比，它们能给用户提供更快的响应。Applets 提供了良好的安全性。\n\n## Applets 的生命周期\n\
    \nApplets 会经历以下步骤：\n\n1. 初始化（Initialization）- `init()` 方法初始化 applets。\n2. 启动（Starting）-\
    \ `start()` 方法启动 applets。\n3. 绘制（Painting）- 在调用 `paint()` 方法完成后。\n4. 停止（Stopping）-\
    \ 我们调用 `stop()` 方法停止 applet。\n5. 销毁（Destroying）-通过调用 `destroy()` 方法销 applet。\n\
    \n通过 HTML 查看 applets。示例：\n\n在文本编辑器中创建一个名为“MyApplet.java”的新文件。将以下代码添加其中：\n\n```java\n\
    import java.awt.Graphics;\nimport java.applet.Applet;\npublic class OurApplet\
    \ extends Applet{\n  public void paint(Graphics gc){\n    gc.drawString(\"First\
    \ Applet!\",150,150);\n  }\n}\n```\n\n在编辑器中创建一个名为 `code1.html` 的新文件。将以下代码添加其中：\n\
    \n```html\n<html>\n<body>\n  <applet code=\"OurApplet.class\" width=\"320\" height=\"\
    320\">\n</applet>\n</body>\n</html>\n```\n\n首先，我们有一段 Java 代码，在其中添加了关于我们的 applet\
    \ 应该执行的操作的代码。该类命名为 `MyApplet`。考虑此代码：\n\n```java\ngc.drawString(\"First Applet!\"\
    ,150,150);\n```\n\n我们正在 applet 窗口的 150, 150 处绘制“First Applet!”文本。注意通过 `import`\
    \ 语句添加的两个库，即 `Graphics` 和 `Applet` 库。`paint()` 方法定义在 `Graphics` 库中。如果不导入它，将产生错误，因为\
    \ Java 编译器将无法理解我们的意思。我们在 `code1.html` 文件中有 HTML 代码。在其中，我们创建了一个可以在上面绘制文本的窗口：\n\n\
    ```html\n<applet code=\"MyApplet.class\" width=\"320\" height=\"320\">\n```\n\n\
    我们链接的是 `MyApplet.class` 而不是 `MyApplet.java`。这意味着 Java 代码应该先编译生成 `.class` 文件，然后\
    \ HTML 代码才能识别它。\n\n打开操作系统的终端，导航到文件所在的位置。运行此命令来编译 Java 代码：\n\n```bash\njavac MyApplet.java\n\
    ```\n\n这将生成 `MyApplet.class` 文件。我们可以使用使用 `appletviewer` 来查看我们的 applet。在控制台上运行此命令：\n\
    \n```bash\nappletviewer Code1.html\n```\n\n应该会弹出一个带有“First Applet!”文本的窗口。那就是 Applet。\n\
    \n![](img/00004.gif)\n\n![](img/00005.jpeg)\n\n通过修改坐标来改变绘制文本的位置。它将改变窗口上的位置。尝试一下并查看形状：创建一个带有此代码的\
    \ `MyPaint1.java` 文件：\n\n```java\nimport java.applet.Applet;\nimport java.awt.*;\n\
    public class MyPaint1 extends Applet\n{\npublic void paint(Graphics gc){\n   \
    \ gc.drawOval(130,40,60,50);\n    gc.drawOval(120,60,10,15);\n    gc.drawOval(190,60,10,15);\n\
