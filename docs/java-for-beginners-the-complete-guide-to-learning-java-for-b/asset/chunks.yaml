    \ args[]) {\n        Mammal c = new Cow(); // mammal reference but Cow object\n\
    \        c.drink(); // to execute method in Cow class\n    }\n}\n```\n\n# 第 9\
    \ 章：多态 (Polymorphism)\n\n这一特性允许我们通过不同的方式执行操作。通过多态，一个对象可以采取不同的形式。示例：\n\n```java\n\
    public interface Animals{}\n\npublic class Mammals{}\n\npublic class Cow extends\
    \ Animals implements Mammals{\n\n}\n```\n\n上面的 `Cow` 类拥有许多继承，使其具有多态性。这些引用可以从上面生成：\n\
    \n```java\nCow c = new Cow();\n\nMammals m = c;\n\nAnimals an = c;\n\nObject ob\
    \ = c;\n```\n"
