    \n# Introduction\nJava is a wide programming language, packed with lots of features\
    \ good for application development. It’s a good coding language for the design/development\
    \ of desktop apps. These are popular as standalone applications. If you need a\
    \ distributed application, Java is the best language to use. Java applets can\
    \ be embedded/added on web pages. The many features offered by Java have made\
    \ it a popular coding language. Its wide features make it applicable in the development\
    \ of apps applicable in various industries. To code in Java, you should get the\
    \ Java compiler. Java is compiled, not interpreted. You need an editor in which\
    \ you can write your Java codes. Notepad is good for this. With these, you can\
    \ start writing and running your Java codes. This means it’s easy to get started\
    \ with Java, making Java a good language for beginners. The Java bytecode, normally\
    \ generated after compiling Java source codes, is platform-independent, meaning\
    \ it can be run on any platform including Windows, Solaris, Linux, etc. Java apps\
    \ are secured via public-key cryptography, making them safe/secure.\n\n# Chapter\
    \ 1: Getting Started with java\nJava is a wide programming language, packed with\
    \ lots of features good for application development. It’s a good coding language\
    \ for the design/development of desktop apps. These are popular as standalone\
    \ applications. If you need a distributed application, Java is the best language\
    \ to use. Java applets can be embedded/added on web pages. The many features offered\
    \ by Java have made it a popular coding language. Its wide features make it applicable\
    \ in the development of apps applicable in various industries. To code in Java,\
    \ you should get the Java compiler. Java is compiled, not interpreted. You need\
    \ an editor in which you can write your Java codes. Notepad is good for this.\
    \ With these, you can start writing and running your Java codes. This means it’s\
    \ easy to get started with Java, making Java a good language for beginners. The\
    \ Java bytecode, normally generated after compiling Java source codes, is platform-independent,\
    \ meaning it can be run on any platform including Windows, Solaris, Linux, etc.\
    \ Java apps are secured via public-key cryptography, making them safe/secure.\n\
    \n## Environment Setup\nFor you to write and run Java programs, you need a text\
    \ editor and the Java compiler. The Java compiler comes with the `JDK` (Java Development\
    \ Kit) which can be downloaded and installed. You can even use a basic text editor\
    \ like `Notepad` and it will be okay. However, there are advanced text editors\
    \ for Java such as `Eclipse` and `Netbeans`.\n\nFirst, download and install the\
    \ `JDK` on your computer. After that, you will have Java on your machine. Open\
    \ your browser then type or paste the following URL:\n\n[http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133751.html](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133751.html)\n\
    \nFrom there, you can get the latest version of the `JDK`. You will then have\
    \ to set the environment variables to know the right Java installation directories.\
    \ This means you should set the `path` variable. Mostly, the installation is done\
    \ in the `C:\\Program Files\\java\\jdk` directory. To set the path on Windows,\
    \ correctly `My Computer`, choose `Properties`, open the `Advanced` tab then choose\
    \ `Environment variables`. Add the `C:\\Program Files\\java\\jdk\\bin` path. For\
    \ Linux users, read the documentation of your shell.\n\n## Java Syntax\nA Java\
    \ program consists of objects communicating via invocation of methods from each\
    \ other. Below are the main constructs in a Java program:\n\n- **Object**: Objects\
    \ are characterized by state and behavior. For example, a cat has states like\
    \ color, breed name and behaviors like eating, meowing and wagging tail.\n- **Class**:\
    \ This is a blueprint/template describing the state/behaviors supported by its\
    \ objects.\n- **Method**: A method is a behavior. Logic is written in methods,\
    \ and they are usable in data manipulation.\n\n## First Program\nThis is our first\
    \ Java program. It should print “Hello World” once executed:\n\n```java\npublic\
    \ class OurFirstProgram{\n    public static void main(String args[]){\n      \
    \  System.out.println(\"Hello World\");\n    }\n}\n```\n"
