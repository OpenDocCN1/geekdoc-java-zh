    \ code with `appletviewer`. You will get a rectangle and line.\n\n## Displaying\
    \ Images\n\nImages can be displayed on applets as applets are popular in animations\
    \ and games. The class `java.awt.Graphics` has the `drawImage()` method for image\
    \ display. The method `getImage()` returns an image object. The method `getCodeBase()`\
    \ returns base URL. The `getDocumentBase()` image returns document URL in which\
    \ the applet has been embedded. Example:\n\n```java\nimport java.awt.*;\nimport\
    \ java.applet.*;\npublic class ShowImage extends Applet {\n  Image img;\n  public\
    \ void init(){\n  img = getImage(getDocumentBase(),\"house.png\");\n  }\n  public\
    \ void paint(Graphics gc) {\n    gc.drawImage(img, 30,30, this);\n  }\n}\n```\n\
    \nThe `drawImage()` method displays the image. Its 4th parameter is an object\
    \ for `ImageObserver`. Save the code in the file named `ShowImage.java`. Add this\
    \ code to the file named `imageshow.html`:\n\n```html\n<html>\n<body>\n  <applet\
    \ code=\"ShowImage.class\" width=\"350\" height=\"350\">\n</applet>\n</body>\n\
    </html>\n```\n\nCompile Java via the command `javac ShowImage.java`, then invoke\
    \ `imageshow.html` via `appletviewer`. If you specified a correct image in the\
    \ same directory with these files, it will be shown on the window.\n\n## Applet\
