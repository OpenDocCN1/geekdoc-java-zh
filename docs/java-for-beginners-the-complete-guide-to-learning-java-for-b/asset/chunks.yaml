    \ Terez\", \"Ne Jersey, USA\", 3, 3400.00);\n    System.out.println(\"Calling\
    \ checkMail via Wage reference\")\n    wg.checkMail();\n    System.out.println(\"\
    \\n Calling checkMail via Worker reference\")\n    wk.checkMail();\n  }\n}\n```\n\
    \n## Abstract Methods\n\nYou may declare a method, then need its implementation\
