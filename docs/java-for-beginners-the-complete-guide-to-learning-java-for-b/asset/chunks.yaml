    \n## Applet 上的事件\n\nApplet 上可以添加事件。在这里，我们为 applet 添加了一个事件，使其在点击按钮后显示消息：创建文件 `AppletEvent.java`\
    \ 然后添加以下代码：\n\n```java\nimport java.applet.*;\nimport java.awt.event.*;\nimport\
    \ java.awt.*;\npublic class AppletEvent extends Applet implements ActionListener{\n\
    \    Button btn;\n    TextField txf;\n    public void init(){\n        txf=new\
    \ TextField();\n        txf.setBounds(30,40,150,20);\n        btn=new Button(\"\
    Click Here\");\n        btn.setBounds(80,150,60,50);\n        add(btn);\n    \
    \    add(txf);\n        btn.addActionListener(this);\n        setLayout(null);\n\
    \    }\n    public void actionPerformed(ActionEvent eve){\n        txf.setText(\"\
    Message on Applet!\");\n    }\n}\n```\n\n注意 applet 类实现了名为 `ActionListener` 的接口。该接口具有监听动作事件并做出相应响应的方法。引入了新的类，即\
    \ `Button` 和 `TextField` 类。我们分别创建了这些类的实例，即 `btn` 和 `txf`，以获取一个按钮和一个文本框。按钮上添加了文本\
    \ `Click Here`，而 `setBounds()` 方法用于设置这两个元素的边界。请考虑此点：\n\n```java\nbtn.addActionListener(this);\n\
    ```\n\n该命令为我们的按钮添加了一个动作监听器事件，也就是说，该按钮将等待或监听点击事件。点击后，将执行在 `actionPerformed()` 方法中指定的动作。文本框中将添加一段文本，即\
    \ `Message on Applet!`。\n\n创建一个新文件 `myapplet.html` 然后添加以下内容：\n\n```html\n<html>\n\
    <body>\n<applet code=\"AppletEvent.class\" width=\"350\" height=\"350\">\n</applet>\n\
    </body>\n</html>\n```\n\n通过命令 `javac AppletEvent.java` 编译你的 Java 代码，然后通过 `appletviewer\
    \ myapplet.html` 调用 `.html` 文件。Applet 窗口将弹出，点击“Click Here”按钮。文本框将添加一条新消息。\n\n\
    ![](img/00006.jpeg)\n\n## Applet 参数\n\nHTML 文件的信息可以作为 applet 的参数。参数可以通过 `Applet`\
    \ 类的 `getParameter()` 方法获取。例如：\n\n创建一个新文件 `AppletParameters.java`。添加以下代码：\n\n\
    ```java\nimport java.awt.Graphics;\nimport java.applet.Applet;\npublic class AppletParameters\
    \ extends Applet{\n    public void paint(Graphics gc){\n        String st=getParameter(\"\
    message\");\n        gc.drawString(st,50, 50);\n    }\n}\n```\n\n为 HTML 代码创建一个新文件，`appletcode.html`：\n\
    \n```html\n<html>\n<body>\n<applet code=\"AppletParameters.class\" width=\"350\"\
    \ height=\"350\">\n<param name=\"message\" value=\"Applet Parameters\">\n</applet>\n\
    </body>\n</html>\n```\n\n在上面的 HTML 代码中，`param name` 的值应该与 Java 类中传递给 `getParameter()`\
    \ 方法的参数值匹配。\n\n现在，通过命令 `javac AppletParameters.java` 编译你的 Java 代码。将生成 `AppletParameters.class`\
    \ 文件。通过 `appletviewer appletcode.html` 调用 HTML 代码。将弹出一个窗口，上面显示文本“AppletParameters”。该文本是在\
    \ HTML 代码中 `param name` 的 `value` 属性中指定的\n\n# 结论\n\nJava 是一种编程语言。作为流行的编程语言之一，它非常受欢迎。使用\
    \ Java 可以实现很多功能。它适合开发桌面应用程序（通常称为独立应用程序）。它拥有 applet，可以添加/嵌入到网页中。学习 Java 很容易的，特别是对于面向对象编程背景的人。Java\
    \ 支持面向对象编程的特性，例如多态、类、继承、封装等。要在 Java 中编写代码，你需要 Java 编译器。这告诉我们 Java 是编译的，而不是解释的。编译器在安装\
    \ `JDK`（Java 开发工具包）后会自动安装。\n\n`JDK` 是一个开源软件，可以免费获取并安装在你的电脑上。你需要一个文本编辑器，你将在其中编写\
    \ Java 代码。示例包括 `Netbeans`、`Notepad`、`Eclipse` 等。通过这些工具，你可以开始编写 Java 代码并在操作系统的控制台/终端运行它们。你调用\
    \ Java 编译器 (`javac`) 来编译代码并生成 `.class` 文件，然后执行该 `.class` 文件。`.class` 文件包含字节码，它是平台无关，可以在任何平台上运行，例如\
    \ Unix、Windows、Mac OS、Solaris 等。\n\n"
