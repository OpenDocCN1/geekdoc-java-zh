    \n要继承一个父类，我们使用 `extends` 关键字。继承通过下面的语法完成：\n\n```java\nclass Child-class-name extends\
    \ Parent-class-name {\n    // fields and methods\n}\n```\n\n`extends` 关键字表示我们正在从一个现有的类创建一个新类。示例：\n\
    \n```java\nclass CompanyEmployee{\n    float employee_salary=40000;\n}\n\npublic\
    \ class JavaProgrammer extends CompanyEmployee{\n    int bonus=10000;\n    public\
    \ static void main(String args[]){\n        JavaProgrammer p=new JavaProgrammer();\n\
    \        System.out.println(\"Programmer salary is:\"+p.salary);\n        System.out.println(\"\
    Bonus of Programmer is:\"+p.bonus);\n    }\n}\n```\n\n有不同的继承类型：\n\n## 单级继承\n\n\
    在这种情况下，一个类继承自另一个类。之前提供的 `Worker` 和 `DBA` 类就是这种类型的示例。示例：\n\n```java\nclass Mammal{\n\
    \    void drink(){\n        System.out.println(\"Drinking...\");\n    }\n}\n\n\
    class Cow extends Mammal{\n    void moow(){System.out.println(\"Moowing...\");}\n\
    }\n\npublic class JavaInheritanceTest{\n    public static void main(String args[]){\n\
    \        Cow c=new Cow();\n        c.moow();\n        c.drink();\n    }\n}\n```\n\
    \n在上面的示例中，`drink()` 方法在 `Mammal` 类中定义，而 `moow()` 方法在 `Cow` 类中定义，`Cow` 类继承了 `Mammal`\
    \ 类。在 `InheritanceTest` 类中，我们创建了一个 `Cow` 类的实例并命名为 `c`。然后我们使用该实例来访问在两个不同类中定义的方法。这就是单继承的工作方式。\n\
    \n## 多级继承\n\n当类 `B` 继承自类 `A`，而类 `C` 继承自类 `B` 时，发生这种继承。示例：\n\n```java\nclass Mammal{\n\
    \    void drink(){\n        System.out.println(\"Drinking...\");\n    }\n}\n\n\
    class Cow extends Mammal{\n    void moow(){\n        System.out.println(\"Moowing...\"\
    );\n    }\n}\n\nclass BabyCow extends Cow{\n    void jump(){\n        System.out.println(\"\
