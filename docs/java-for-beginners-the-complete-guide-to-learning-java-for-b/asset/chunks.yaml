    # Chapter 2: Java Variables


    A variable can be seen as a container responsible for holding a value during the
    life of a program. Each variable is of a certain data type, designative the kind
    of value that it can hold. There are two steps in using Java variables, that is,
    variable declaration and variable initialization.


    ## Variable Declaration


    The declaration of a variable involves giving it a name and specifying its data
    type. Below are examples of valid variable declaration:


    int x,j,z;


    float pi;


    double a;


    char c;


    The int, float, double and char are the data types, specifying the type of value
    each variable can or should hold. To declare several variables in one line, separate
    them using a comma (,) as in the first example. A variable declaration should
    end with a semicolon (;).


    ## Variable Initialization


    Variable initializing involves assigning it a valid value. The value to be assigned
    to the variable is determined by the variable’s data type. Below are examples
    of valid variable initializations.


    pi =3.14f;


    a =20.22778765;


    c=’v’;


    Both the declaration and initialization of a variable can be done at once as shown
    below:


    int x=1,z=4,y=5;


    float pi=3.14f;


    double d=19.12d;


    char c=’v’;


    ## Variable Types


    Java supports three variable types:


    1.  Local Variables


    2.  Static Variables


    3.  Instance Variables


    ## Local Variables


    These are variables declared within a method body. They can only be accessed from
    within that method.


    ## Instance Variables


    These are the variables that have been defined without the use of STATIC keyword.
    These variables are specific to an object.


    ## Static Variables


    These are variables initialized once at the beginning of the program execution.
    You should initialize them before instance variables.


    The following example demonstrates the different types of Java variables:


    class JavaVariables {


        int i = 10; //an instance variable 


        static int b = 2; //a static variable 


        void methodExample() {


            int c = 3; //a local variable 


        }


    }


    The variable integer b is a static variable since it has been defined with the
    static keyword. The variable int c has been declared within the methodExample
    method, making it a local variable. It can only be accessed from within that method.


    ## Data Types


    In Java, a data type can be either primitive or non-primitive.


    ### Primitive Data Types


    These are the predefined data types that are already provided by Java. They are
    8 in number including byte, short, long, char, int, float, Boolean and double  data
    types.


    ### Non-Primitive Data Types


    These are defined by the use of defined class constructors. They help programmers
    access objects.


    The example given below demonstrates the use of variables:


    public class VariableAddition{ 


        public static void main(String[] args){ 


        int ax=5; 


        int jk=12; 


        int z=ax+jk; 


        System.out.println(z); 


        }


    } 


    We have defined three integer variables x, j and z. The values for x and j have
    been initialized, while the value for z is the addition of the previous two variables.
    We have then invoked the “println” function to print the value of z. It should
    print 17, the result of the addition of 5 and 12\.


    ## Type Casting and Type Conversion


    It is possible for a variable of a particular type to get a value of some other
    type. Type conversion is when a variable of a smaller capacity is assigned a variable
    of a bigger capacity. Example:


    double db;


    int x=5;


    db-x;


    Type casting is when a variable of a larger capacity is assigned some other variable
    of a smaller capacity. Example:


    db =5;


    int x;


    x= (int) db;


    The (int) is known as the type cast operator. If it is not specified, you get
    an error. Typecasting example:


    public class TypecastingExample{  


    public static void main(String[] args){  


    float ft=11.8f;  


    //int x=ft;//a compile time error  


    int x=(int)ft;  


    System.out.println(ft);  


    System.out.println(x);  


    }


    }  


    # Chapter 3: Java operators


    Operators are symbols used to perform operations. For example, the + symbol is
    used for arithmetic operations. Java supports different operators:


    ## Unary Operator


    This is an operator that takes one operand. They increment/decrement a value.
    They include ++ (increment) and - -(decrement). Example:


    public class UnaryOperatorExample{  


    public static void main(String args[]){  


    int j=0;  


    System.out.println(j++);//from 0 to 1  


    System.out.println(++j);//2  


    System.out.println(j--);//1  


    System.out.println(--j);//0  


    }


    }  


    The program will print 0, 2, 2, 0\. The j++ means that the value of j is read
    first before the increment is done, hence we got the value of j as 0\. If it was
    ++j, then we would get a 1 as the first value of j. You can try it.


    ## Arithmetic Operators


    These operators are used for performing mathematical operations like multiplication,
    addition, division, subtraction etc. They are used as mathematical operators.
    Example:


    public class JavaArithmeticOperatorsExample{  


    public static void main(String args[]){  


    int x=0;  


    int y=10;  


    System.out.println(x+y);//10 


    System.out.println(x-y);//-10  


    System.out.println(x*y);//0  


    System.out.println(x/y);//0 


    System.out.println(x%7);//0  


    }


    }  


    The only operator that may look unfamiliar is the % (modulus operator), which
    returns the remainder after division.


    ## Logical Operators


    These operators are used together with the binary values. They help in evaluation
    of conditions in loops and conditional statements. They include ||, &&, !. Suppose
    we have two Boolean variables, a1 and a2, the following conditions apply:


    a1&&a2 will return true if both a1 and a2 are true; otherwise, they will return
    false.


    a1||a2 will return false if both a1 and a2 are false; otherwise, they will return
    true.'
