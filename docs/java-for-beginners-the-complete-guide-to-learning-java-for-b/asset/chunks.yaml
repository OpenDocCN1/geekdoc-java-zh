    System.out.println("n1 is greater than n2");


          }


       }


    }


    The program uses the if statement which is discussed in the next chapters.


    # Chapter 4: Java arrays


    Arrays are storage structures used for storing same-type elements. An array has
    a fixed size, which cannot be increased after definition. The first element in
    an array is at index 0.


    ## Single Dimensional Arrays


    These are arrays in which the elements are stored linearly. The declaration of
    an array takes the syntax given below:


    <elementDataType>[] <arrayName>;


    Another syntax:


    <elementDataType> <arrayName>[];


    Example:


    int arrayExample[];


    int []arrayExample;


    An array can be initialized as follows:


    arrayExample[0]=1;


    The line states that the element 1 should be stored at index 0 of the array. An
    array can also be declared and initialized simultaneously as follows:


    int arrayExample[] = {5, 20, 35, 43};


    The value 5 will be stored at the index 0 of the array 20 at index 1 and so on.


    Example:


    public class JavaArrayExample{


         public static void main(String args[]){


            int array1[] = new int[8];


            for (int c=0;c<8;c++){


               array1[c]=c+1;


           }


           for (int c=0;c<8;c++){


               System.out.println("array1["+c+"] = "+array1[c]);


           }


          System.out.println("The Array Length  =  "+array1.length);


          }


    }


    The array will print the elements contained at different indices. You will also
    get the array length, which is 8.


    ## Multi-Dimensional Arrays


    These can be seen as arrays of other arrays. In multi-dimensional array declaration,
    you only add another set of square brackets to define the other index. Example:


    int array2[ ][ ] = new int[6][10] ;


    You have the authority to control the length of your multi-dimensional array.
    Example:


    public class JavaArrayExample2 {


    public static void main(String[] args) {


    // Creating a 2-dimensional array.


      int[][] array2 = new int[6][8];


      // Assign only three elements


      array2[0][0] = 2;


      array2 [1][1] = 12;


      array2 [3][2] = 11;


      System.out.print(array2[0][0] + " ");


    }


    }


    The program will return the value stored at index [0][0], which is 2\.


    # Chapter 5: Decision making


    In Java, decision making helps us evaluate conditions and run statements based
    on the outcome of the condition. Let us discuss the statements for decision making:


    ## if statement


    This statement has a Boolean expression and statement(s). Its syntax is given
    below:


    if(A_boolean_expression) {


       // Statement(s) to be run if true


    }


    The statements within the body of the expression will run if the condition is
    true; otherwise, no result from the program will run. Example:


    public class JavaIfStatement {


       public static void main(String args[]) {


          int marks = 20;


          if( marks < 50 ) {


             System.out.print("The marks is below 50");


          }


       }


    }


    ## if…else statement


    This statement combines an “if” with “else”, with the latter specifying the statement(s)
    to run if the expression is found to be false. Syntax:


    if(A_boolean_expression) {


       // Statement(S) to run if expression is true


    }else {


       // Statement(s) to run if expression is false


    }


    Example:


    public class JavaIfElseStatement {


       public static void main(String args[]) {


          int marks = 30;


          if( marks < 50 ) {


             System.out.print("The marks is below 50");


          }else {


             System.out.print("The marks is above 50");


          }


       }


    }


    The first statement will be printed, that is, The marks is below 50\. This is
    because the Boolean expression will be true. If it is false, the other statement
    will be printed. Example:


    public class JavaIfElseStatement {


       public static void main(String args[]) {


          int marks = 70;


          if( marks < 50 ) {


             System.out.print("The marks is below 50");


          }else {


             System.out.print("The marks is above 50");


          }


       }


    }


    ## if...else if...else Statement


    If you have several conditions to evaluate, use this statement. Syntax:


    if(A_boolean_expression a) {


       // Statement(s)


    }else if(A_boolean_expression b) {


       // Statement(s)


    }else if(A_boolean_expression c) {


       // Statement(s)


    }else {


       // Statement(s)


    }


    Example:


    public class JavaIfElseIfStatement {


       public static void main(String args[]) {


          int marks = 20;


          if( marks == 10 ) {


             System.out.print("Marks is 10");


          }else if( marks == 20 ) {


             System.out.print("Marks is 20");


          }else if( marks == 30 ) {


             System.out.print("Marks is 30");


          }else {


             System.out.print("None of the above");


          }


       }


    }


    The result from the program will be Marks is 20\.


    ## Nested if


    The if…else statements can be nested, meaning that one may use an if inside another
    if or an if…else inside another if…else. The nesting syntax is shown below:


    if(A_boolean_expression a) {


       // Statament(s)


       if(A_boolean_expression b) {


          // Statament(s)


       }


    }


    Example:


    public class NestingExample {


       public static void main(String args[]) {


          int ab = 10;


          int xy = 30;


          if( ab == 10 ) {


             if( xy == 30 ) {


                System.out.print("The value of ab is 10 and xy is 10");


             }


          }


       }


    }


    If the first condition becomes true, the second condition will evaluate. This
    is true in our case, hence the println statement will be executed. If any of the
    conditions is false, then the println statement will not be executed.


    ## switch statement


    This statement allows us to test a certain variable for equality against some
    values list. Every value is referred to as case. The following syntax is used:


    switch(an_expression) {


       case value:


          // Statement(s)


          break; //optional


       case value:


          // Statement(s)


          break; //optional


       default : //Optional


          // Statement(s)


    }


    The switch will terminate once it has reached the break statement. The flow will
    then jump to the next line. However, note that it isn’t a must to add a break
    to every case. A default case may be added to the end of the switch, and this
    will run if none of the cases are true.


