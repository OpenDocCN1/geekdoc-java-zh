    import java.awt.*;\npublic class AppletExample extends Applet {\n  Image img;\n\
    \  public void init() {\n    img = getImage(getDocumentBase(),\"car.gif\");\n\
    \  }\n  public void paint(Graphics gc) {\n    for(int ix=0;ix<500;ix++){\n   \
    \   gc.drawImage(img, ix,30, this);\n      try{\n        Thread.sleep(100);\n\
    \      }\n      catch(Exception exc){\n      }\n    }\n  }\n}\n```\n\nThe method\
    \ `drawImage()` helps us display an image. Create a new file named `animation.html`.\
