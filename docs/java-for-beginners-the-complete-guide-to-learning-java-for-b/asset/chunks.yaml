    \ `j` 的值，因此我们得到的 `j` 的值为 0。如果是 `++j`，我们将得到第一个值为 1。\n\n## 算术运算符\n\n这些运算符用于执行算术操作，如乘法、加法、除法等。它们作为算术运算符使用。示例：\n\
