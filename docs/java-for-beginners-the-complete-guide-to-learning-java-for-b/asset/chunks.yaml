    \ an image object. The method getCodeBase() returns base URL. The getDocumentBase()\
    \ image returns document URL in which the applet has been embedded. Example:\n\
    \nimport java.awt.*;  \n\nimport java.applet.*;  \n\npublic class ShowImage extends Applet {  \n\
    \n  Image img;  \n\n  public void init(){  \n\n    img = getImage(getDocumentBase(),\"\
    house.png\");  \n\n  }  \n\n  public void paint(Graphics gc) {  \n\n    gc.drawImage(img, 30,30, this);  \n\
    \n  }  \n\n  }  \n\nThe drawImage() method displays the image. Its 4th parameter\
    \ is an object for ImageObserver. Save the code in the file named ShowImage.java.\
    \ Add this code to the file named imageshow.html:\n\n<html>  \n\n<body>  \n\n\
    <applet code=\"ShowImage.class\" width=\"350\" height=\"350\">  \n\n</applet>  \n\
    \n</body>  \n\n</html>  \n\nCompile Java class via the command javac ShowImage.java,\
    \ then invoke the imageshow.html file via appletviewer. If you specified a correct\
    \ image in the same directory with these files, it will be shown on the window.\n\
    \n## Applet Animations\n\nSince applets are common in games, images should be\
    \ moved. Example:\n\nCreate the file AppletAnimationExample.java. Add this code:\n\
    \n import java.applet.*; \n\n    import java.awt.*;\n\n    public class AppletAnimationExample\
    \ extends Applet { \n\n      Image img; \n\n      public void init() { \n\n       \
    \ img =getImage(getDocumentBase(),\"car.gif\"); \n\n      } \n\n      public void\
    \ paint(Graphics gc) { \n\n        for(int ix=0;ix<500;ix++){ \n\n          gc.drawImage(img,\
    \ ix,30, this); \n\n          try{\n\n              Thread.sleep(100);\n\n         \
    \ }\n\n          catch(Exception exc){\n\n          } \n\n        } \n\n     \
    \ } \n\n    } \n\nThe method drawImage() helps us display an image. Create a new\
    \ file named animation.html. Add this code:\n\n    <html> \n\n    <body> \n\n\
        <applet code=\"AppletAnimationExample.class\" width=\"350\" height=\"300\"\
    > \n\n    </applet> \n\n    </body> \n\n    </html> "
