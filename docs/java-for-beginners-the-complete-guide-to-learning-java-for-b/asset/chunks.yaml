    # Introduction


    Java is a wide programming language, packed with lots of features good for application
    development. It’s a good coding language for the design/development of desktop
    apps. These are popular as standalone applications. If you need a distributed
    application, Java is the best language to use. Java applets can be embedded/added
    on web pages. The many features offered by Java have made it a popular coding
    language. Its wide features make it applicable in the development of apps applicable
    in various industries. To code in Java, you should get the Java compiler. Java
    is compiled, not interpreted. You need an editor in which you can write your Java
    codes. Notepad is good for this. With these, you can start writing and running
    your Java codes. This means it’s easy to get started with Java, making Java a
    good language for beginners. The Java bytecode, normally generated after compiling
    Java source codes, is platform-independent, meaning it can be run on any platform
    including Windows, Solaris, Linux, etc. Java apps are secured via public-key cryptography,
    making them safe/secure. Java apps can be linked to various database management
    systems, for example, MySQL, Oracle, SQL Server, etc. This book is an excellent
    guide on Java programming. Get it and know every aspect of Java and transition
    from Java Beginner to Java Expert!


    # Chapter 1: Getting Started with java


    Java is a platform as well as a coding language. It is a robust, high-level, object-oriented
    and secured programming language. It was released in 1995 by the Sun Microsystems.
    Java treats everything as an object. Its object model makes it easy to extend.
    The language is compiled, meaning that we have a Java compiler. Java is also platform
    independent. After compiling your Java source code, you get the byte code which
    can be executed on any platform. Java is also well known for being easy to learn.
    If you know some basic concepts about object-oriented programming, it will be
    easy for you to learn Java. It is packed with numerous features, making it widely
    functional.


    Authentication in Java is done using a public-key encryption, making its systems
    very secure. This is the reason we can develop temper-free and virus-free systems
    with Java. In Java, errors are identified during the compile time, meaning that
    you cannot go to the run phase without first sorting out the error.


    ## Environment Setup


    For you to write and run Java programs, you need a text editor and the Java compiler.
    The Java compiler comes with the JDK (Java Development Kit) which can be downloaded
    and installed for free. You also need to have a text editor where you will be
    writing your Java programs. You can even use a basic text editor like Notepad
    and it will be okay. However, there are advanced text editors for Java such as
    Eclipse and Netbeans.


    First, download and install the JDK on your computer. After that, you will have
    installed Java on your machine. Open your browser then type or paste the following
    URL:


    [http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)


    From there, you can get the latest version of the JDK. You will then have to set
    the environment variables to know the right Java installation directories. This
    means you should set the path variable. Mostly, the installation is done in the
    c:\Program Files\java\jdk directory.  To set the path on Windows, correctly “My
    Computer”, choose “Properties”, open the “Advanced” tab then choose “Environment
    variables”. Add the “c:\Program Files\java\jdk\bin” path. For Linux users, read
    the documentation of your shell.


    ## Java Syntax


    A Java program consists of objects communicating via invocation of methods from
    each other. Below are the main constructs in a Java program:


    *   Object- Objects are characterized by state and behavior. For example, a cat
    has states like color, breed name and behaviors like eating, meowing and wagging
    tail.


    *   Class- This is a blueprint/template describing the state/behaviors supported
    by its objects.


    *   Method- A method is a behavior. Logic is written in methods, and they are
    usable in data manipulation.


    ## First Program


    This is our first Java program. It should print “Hello World” once executed:


    public class OurFirstProgram{


    public static void main(String args[]){


    System.out.println("Hello World");


    }


