- fmt: "\n# Chapter 11- Encapsulation\n\nThis mechanism helps in grouping data and\
    \ methods together. The data are the variables while methods are code to act on\
    \ the data. With encapsulation, the class variables can be hidden from other classes,\
    \ and access to these may only be via methods of the class. Encapsulation is the\
    \ same as Data Hiding. It’s achieved by declaring class variables as `private`.\
    \ The “setter” and “getter” methods for the variables should be declared `public`\
    \ and be used to modify the value of the variables.\n\n### Example:\n\n```java\n\
    public class Students{ \n  private String studentName; \n\n  public String getStudName(){\
    \ \n    return studentName; \n  } \n\n  public void setStudName(String studentName){\
    \ \n    this.studentName=studentName;\n  } \n} \n```\n\nYou can add a new file\
    \ to the same package with this code:\n\n```java\npublic class TestStudents {\
    \ \n  public static void main(String[] args){ \n    Students st=new Students();\
    \ \n    st.setStudName(\"John\"); \n    System.out.println(st.getStudName());\
    \ \n  } \n} \n```\n\nThe variable `studentName` was marked as `private` in the\
    \ `Students` class. The methods `setStudName()` and `getStudName()` were declared\
    \ as `public` in the `Students` class. We have instantiated the `Students` class\
    \ in the `TestStudents` class, then we have used this instance to access its variable\
    \ and methods.\n\n### Example 2:\n\n```java\npublic class Class3 {\n  private\
    \ String personName;\n  private String personID;\n  private int personAge;\n\n\
    \  public int getPersonAge() {\n      return personAge;\n  }\n\n  public String\
    \ getPersonName() {\n      return personName;\n  }\n\n  public String getPersonID()\
    \ {\n      return personID;\n  }\n\n  public void setPersonAge( int newPersonAge)\
    \ {\n      personAge = newPersonAge;\n  }\n\n  public void setPersName(String\
    \ newPersonName) {\n      personName = newPersonName;\n  }\n\n  public void setPersonID(\
    \ String newPersonID) {\n      personID = newPersonID;\n  }\n}\n```\n\nAny class\
    \ in need of accessing private variables must use the `public` methods, that is,\
    \ the setters and getters. We may access the above as follows:\n\n```java\npublic\
    \ class Class3Test {\n  public static void main(String args[]) {\n      Class3Test\
    \ cs3 = new Class3Test();\n      cs3.setPerName(\"John\");\n      cs3.setPersonAge(26);\n\
    \      cs3.setPersonID(\"3452673\");\n      System.out.print(\"Name : \" + cs3.getPersonName()\
    \ + \" Age : \" + cs3.getPersonAge());\n  }\n}\n```\n\n# Chapter 12- Interfaces\n\
    \nAn interface refers to the blueprint for the class and it’s abstract methods\
    \ and static constants. An interface provides a mechanism for achieving abstraction.\
    \ An interface must only have abstract methods rather than method body. It’s good\
    \ for achieving multiple inheritances. It’s similar to a class, but with abstract\
    \ methods only. A class must implement an interface to use its methods. Other\
    \ than abstract methods, it may have constants, static methods, default methods,\
    \ nested types etc.\n\nAn interface has methods that can be implemented by classes.\
    \ For a class to implement interface methods, it must be abstract. Otherwise,\
    \ all interface methods must be defined in the class. An interface can’t be instantiated.\
    \ It also can’t have constructors. All its fields must be `final` or `static`,\
    \ not instance fields.\n\nTo declare one, we use the `interface` keyword. Syntax:\n\
    \n```java\ninterface <interfaceName>{  \n  //constant fields  \n  // abstract\
    \ methods   \n}  \n```\n\nAn interface is abstract implicitly, hence don’t add\
    \ the `abstract` keyword when declaring it. The methods are implicitly abstract,\
    \ hence don’t use the `abstract` keyword when declaring one. They are implicitly\
    \ `public`. Example:\n\n```java\ninterface Mammal {\n  public void drink();\n\
    \  public void makeSound();\n}\n```\n\nAn interface may be implemented by class:\n\
    \n```java\ninterface Mammal{\n  public void drink();\n}\n\nclass Cow implements\
    \ Mammal{\n  public void drink(){\n      System.out.println(\"An Interface Method\
    \ already Implemented\");\n  }\n  public static void main(String args[]){\n  \
    \    Mammal mm = new Cow();\n      mm.drink();\n  }\n}\n```\n\nWe created the\
    \ interface `Mammal` which has been implemented by the `Cow` class. Its `drink()`\
    \ has been used in the `Cow` class.\n\nFor two interfaces, one interface may extend\
    \ another one via the `extends` keyword. The sub-interface (child) will inherit\
    \ methods the super-interface (parent). Example:\n\n```java\ninterface Toyotas\
    \ {\n  public void setPrice(String car);\n  public void setCC(String cc);\n}\n\
    \ninterface Premio extends Toyotas {\n  public void mileage(int miles);\n  public\
    \ void seats(int seats);\n}\n\ninterface Crown extends Toyotas {\n  public void\
    \ space();\n  public void length();\n}\n```\n\nJava doesn’t support multiple inheritance,\
    \ but we may achieve it via interfaces. Here is another:\n\n```java\ninterface\
    \ Interface {\n  void draw();\n  int cube(int ab);\n}\n\nclass Cuboid implements\
    \ Interface {\n  public void draw() {\n    System.out.println(\"drawing\");\n\
    \  }\n}\n\nclass InterfaceTest {\n  public static void main(String args[]) {\n\
    \    Interface ob = new Cuboid();\n    ob.draw();\n    System.out.println(ob.cube(3));\n\
    \  }\n}\n```\n\n# Chapter 13- Packages\n\nPackages help group related classes.\
    \ The grouping depends on functionality. To create packages, use the `package`\
    \ then name. Example:\n\n```java\npackage test;\n\npublic class PackageTest{\n\
    \  public static void main(String args[]){\n    System.out.println(\"My first\
    \ package\");\n  }\n}\n```\n\nThe package definition statements end with semicolon.\
    \ When creating packages, use lowercase letters for the name to avoid conflicting\
    \ with interface/class names. Example 2:\n\n```java\npackage mammal;\n\ninterface\
    \ MammalsInterface {\n  public void drink();\n  public void makeSound();\n}\n\
    ```\n\nWe have the package `mammal` with an interface `MammalsInterface`. We can\
    \ now implement the interface in the package `mammal`:\n\n```java\npackage mammal;\n\
    \nclass Cow implements MammalsInterface {\n  public void drink() {\n      System.out.println(\"\
    Mammals drink\");\n  }\n\n  public void makeSound() {\n      System.out.println(\"\
    Mammals make sound\");\n  }\n\n  public int legCount() {\n    return 0;\n  }\n\
    \n  public static void main(String args[]) {\n    Cow c = new Cow();\n    c.drink();\n\
    \    c.makeSound();\n  }\n}\n```\n\nIf not using a package, the two may be combined\
    \ into one:\n\n```java\ninterface MammalsInterface {\n  public void drink();\n\
    \  public void makeSound();\n}\n\nclass Cow implements MammalsInterface {\n  public\
    \ void drink() {\n      System.out.println(\"Mammals drink\");\n  }\n\n  public\
    \ void makeSound() {\n      System.out.println(\"Mammals make sound\");\n  }\n\
    }\n```\n"
  raw: '# Chapter 11- encapsulation


    This mechanism helps in grouping data and methods together. The data are the variables
    while methods are code to act on the data. With encapsulation, the class variables
    can be hidden from other classes, and access to these may only be via methods
    of the class. Encapsulation is the same as Data Hiding. It’s achieved by declaring
    class variables as private. The “setter” and “getter” methods for the variables
    should be declared public and be used to modify the value of the variables.


    Example:


    public class Students{ 


    private String studentName; 


    public String getStudName(){ 


    return studentName; 


    } 


    public void setStudName(String studentName){ 


    this.studentName=studentName;


    } 


    } 


    You can add a new file to the same package with this code:


    public class TestStudents { 


    public static void main(String[] args){ 


    Students st=new Students(); 


    st.setStudName("John"); 


    System.out.println(st.getStudName()); 


    } 


    }


    The variable studentName was marked as private in the Students class. The methods
    setStudName() and getStudName() were declared as public in the Students class.
    We have instantiated the Students class in the TestStudents class, then we have
    used this instance to access its variable and methods.


    Example 2:


    public class Class3 {


       private String personName;


       private String personID;


       private int personAge;


       public int getPersonAge() {


          return personAge;


       }


       public String getPersonName() {


          return personName;


       }


       public String getPersonID() {


          return personID;


       }


       public void setPersonAge( int newPersonAge) {


          personAge = newPersonAge;


       }


       public void setPersName(String newPersonName) {


          personName = newPersonName;


       }


       public void setPersonID( String newPersonID) {


          personID = newPersonID;


       }


    }


    Any class in need of accessing private variables must use the public methods,
    that is, the setters and getters. We may access the above as follows:


    public class Class3Test {


       public static void main(String args[]) {


          Class3Test cs3 = new Class3Test();


          cs3.setPerName("John");


          cs3.setPersonAge(26);


          cs3.setPersonID("3452673");


          System.out.print("Name : " + cs3.getPersonName() + " Age : " + cs3.getPersonAge());


       }


    }


    # Chapter 12- Interfaces


    An interface refers to the blueprint for the class and it’s abstract methods and
    static constants. An interface provides a mechanism for achieving abstraction.
    An interface must only have abstract methods rather than method body. It’s good
    for achieving multiple inheritances. It’s similar to a class, but with abstract
    methods only. A class must implement an interface to use its methods. Other than
    abstract methods, it may have constants, static methods, default methods, nested
    types etc.


    An interface has methods that can be implemented by classes. For a class to implement
    interface methods, it must be abstract. Otherwise, all interface methods must
    be defined in the class. An interface can’t be instantiated. It also can’t have
    constructors. All its fields must be final or static, not instance fields.


    To declare one, we use the interface keyword. Syntax:


    interface <interfaceName>{  


              //constant fields  


        // abstract methods   


    }  


    An interface is abstract implicitly, hence don’t add the abstract keyword when
    declaring it. The methods are implicitly abstract, hence don’t use the abstract
    keyword when declaring one. They are implicitly public. Example:


    interface Mammal {


       public void drink();


       public void makeSound();


    }


    An interface may be implemented by class:


    interface Mammal{


      public void drink();


    }


    class Cow implements Mammal{


       public void drink(){


         System.out.println("An Interface Method already Implemented");


      }


       public static void main(String args[]){


         Mammal mm = new Cow();


         mm.drink();


      }


    }


    We created the interface Mammal which has been implemented by the Cow class. Its
    drink() has been used in the Cow class.


    For two interfaces, one interface may extend another one via the extends keyword.
    The sub-interface (child) will inherit methods of the super-interface (parent).
    Example:


    public interface Toyotas {


       public void setPrice(String carPrice);


       public void setCC(String cc);


    }


    public interface Premio extends Toyotas {


       public void maximumMileage(int miles);


       public void seats(int seats);


       public void kilometersPerLiter(int kms);


    }


    public interface Crown extends Toyotas {


       public void interiorSpace();


       public void carLength();


       public void setPrice(String carPrice);


       public void setCC(String cc);


    }


    We defined the Toyotas interface. The others, Premio and Crown, are extending
    the Toyotas interface. The interface Crown has four methods, but two of these
    have been inherited from the Toyotas interface. You may inherit from several interfaces
    by use of (,) to separate them. Example:


    public interface Premio extends Toyotas, Cars


    Java doesn’t support multiple inheritance, but we may achieve it via interfaces.
    Here is another interface example:


    interface ObjectInterface{  


    void drawObject();  


    static int cubeObject(int ab){return ab*ab*ab;}  


    }  


    class Cuboid implements ObjectInterface{  


    public void drawObject(){


    System.out.println("drawing cuboid");


    }  


    }  


    public class InterfaceTest{  


    public static void main(String args[]){  


    ObjectInterface ob=new Cuboid();  


    ob.drawObject();  


    System.out.println(ObjectInterface.cubeObject(3));  


    }


    }  


    A nested interface is one added inside another interface. Example:


    interface Message{  


     void printMessage();  


     interface ShortMessage{  


       void message();  


     }  


    }  


    The ShortMessage interface has been defined inside the Message interface, making
    it a nested interface.


    # Chapter 13- Packages


    Packages help group related interfaces and classes together. The grouping depends
    on functionality. With packages, we can group classes and find the ones we need
    easily and avoid naming conflicts. I recommend you create a package and use it
    to group related classes, interfaces etc. With packages, it’s easy to access variables
    and methods defined in classes and interfaces in the same package.


    A package can be user-defined or built-in. Examples of built-in Java packages
    include lang, awt, java, javax, net, io, swing, util, sql and others. To use these,
    use the import statement to be made available in your class. To create packages,
    use the package keyword then package name. Example:


    package testpackage;  


    public class PackageTest{  


      public static void main(String args[]){  


         System.out.println("My first package");  


        }  


    } 


    The package definition statements end with semicolon (; ). When creating packages,
    use lowercase letters for the name to avoid conflicting with interface/class names.
    Example 2:


    package mammal;


    interface MammalsInterface {


       public void drink();


       public void makeSound();


    }


