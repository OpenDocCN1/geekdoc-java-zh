    \n对覆盖方法的调用在运行时已解析。这就是运行时多态。被重写的方法通过父类的引用变量被调用。\n\n通过多态，可以通过不同的方式执行操作。如果你有一个带有\
    \ `sound()` 方法的 `Mammals` 类，那么该方法的实现对于 `Goat`、`Cow`、`Donkey` 等不同动物类将是不同的。你会得到\
