    \        bc.jump();\n        bc.drink();\n    }\n}\n```\n\n`drink()` 方法在 `Mammal`\
    \ 类中定义。`moow()` 方法在 `Cow` 类中定义，`Cow` 类继承了 `Mammal` 类。`jump` 方法在 `BabyCow` 类中定义，`BabyCow`\
    \ 类继承了 `Cow` 类。在 `InheritanceTest2` 类中，我们创建了一个名为 `bc` 的 `BabyCow` 类实例。该实例随后被用于访问各种属性或方法。我们能够使用\
    \ `BabyCow` 类的实例来访问在 `Cow` 和 `Mammal` 类中定义的方法。各种类中的方法可以视为它们的属性。\n\n## 层级继承\n\n\
    这种继承可以通过像示例所示所示：\n\n```java\nclass Mammal{\n    void drink(){\n        System.out.println(\"\
    Drinking...\");\n    }\n}\n\nclass Cow extends Mammal{\n    void moow(){\n   \
    \     System.out.println(\"Moowing...\");\n    }\n}\n\nclass Goat extends Mammal{\n\
    \    void meew(){\n        System.out.println(\"Meewing...\");\n    }\n}\n\npublic\
