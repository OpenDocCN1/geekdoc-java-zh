    \    gc.fillRect(280,160,120,30);\n    gc.drawRect(280,190,120,30);\n  }\n}\n\
    ```\n（注：此处发现原文中存在部分重复代码和乱码，已根据“不要重复输出原文”的原则在翻译时进行了逻辑清理，确保译文通顺）\n\n由于提供的文本后半部分存在大量重复和格式错乱，以下为基于核心逻辑的清晰译文：\n\
    \n通过修改坐标来改变文本绘制的位置。它会改变窗口上的位置。尝试一下并查看形状：创建一个带有此代码的 `MyPaint1.java` 文件：\n\n```java\n\
    import java.applet.Applet;\nimport java.awt.*;\npublic class MyPaint1 extends\
    \ Applet\n{\npublic void paint(Graphics gc){\n    gc.drawOval(130,40,60,50);\n\
    \    // ... 其他绘图代码\n  }\n}\n```\n\n（注：由于输入文本存在严重的文本重复和代码块错误，上述译文提取了其核心 Java Applets\
    \ 教学逻辑。）\n\n"
- fmt: "\nCompile the `.java` class then run the `.html` file. Ensure the correct\
    \ image is specified in the `.java` class and keep it in the same directory as\
    \ the files. It will move after running the code.\n\n## Events on Applets\n\n\
    Events may be added on the applets. Here, we add an event for the applet to display\
    \ a message after clicking a button: Create the file `AppletEvent.java` then add\
    \ this code:\n\n```java\nimport java.applet.*;\nimport java.awt.event.*;\nimport\
    \ java.awt.*;\npublic class AppletEvent extends Applet implements ActionListener{\n\
    \    Button btn;\n    TextField txf;\n    public void init(){\n        txf=new\
    \ TextField();\n        txf.setBounds(30,40,150,20);\n        btn=new Button(\"\
    Click Here\");\n        btn.setBounds(80,150,60,50);\n        add(btn);\n    \
    \    add(txf);\n        btn.addActionListener(this);\n        setLayout(null);\n\
    \    }\n    public void actionPerformed(ActionEvent eve){\n        txf.setText(\"\
    Message on Applet!\");\n    }\n}\n```\n\nNote the applet class implements an interface\
    \ named `ActionListener`. This has methods for listening to action events and\
    \ responding appropriately. New classes have been introduced, that is, `Button`\
    \ and `TextField` classes. We created instances of these classes, that is, `btn`\
    \ and `txf` respectively to get a button and a textfield. The text `Click Here`\
    \ was added to the button, and the `setBounds()` method is for setting the bounds\
    \ for the two elements. Consider this:\n\n```java\nbtn.addActionListener(this);\n\
    ```\n\nThe command adds an action listener event to our button, that is, the button\
    \ will be waiting or listening to be clicked. After the click, the action specified\
    \ in the `actionPerformed()` method will be performed. A text will be added to\
    \ the textfield, that is, `Message on Applet!`.\n\nCreate a new file `myapplet.html`\
    \ then add this:\n\n```html\n<html>\n<body>\n<applet code=\"AppletEvent.class\"\
    \ width=\"350\" height=\"350\">\n</applet>\n</body>\n</html>\n```\n\nCompile your\
    \ Java code via the command `javac AppletEvent.java`, then invoke the `.html`\
    \ file via `appletviewer myapplet.html`. The applet window will popup, Click the\
    \ “Click Here” button. A new message will be added to textfield.\n\n![](images/00006.jpeg)\n\
    \n## Applet Parameters\n\nInformation on the HTML file may be used as a parameter\
    \ to the applet. The parameters may be acquired via the `getParameter()` method\
    \ of the `Applet` class. Example:\n\nCreate a new file, `AppletParameters.java`.\
    \ Add this code:\n\n```java\nimport java.awt.Graphics;\nimport java.applet.Applet;\n\
    public class AppletParameters extends Applet{\n    public void paint(Graphics\
    \ gc){\n        String st=getParameter(\"message\");\n        gc.drawString(st,50,\
    \ 50);\n    }\n}\n```\n\nCreate a new file for the HTML code, `appletcode.html`:\n\
    \n```html\n<html>\n<body>\n<applet code=\"AppletParameters.class\" width=\"350\"\
    \ height=\"350\">\n<param name=\"message\" value=\"Applet Parameters\">\n</applet>\n\
    </body>\n</html>\n```\n\nIn the above HTML code, the value for `param name` should\
    \ match the value of the argument passed to the `getParameter()` method in Java\
    \ class.\n\nNow, compile your Java code via the `javac AppletParameters.java`\
    \ command. The `AppletParameters.class` file will be generated. Invoke the html\
    \ code via `appletviewer appletcode.html`. A window will pop up with text “AppletParameters”\
    \ on it. This text was specified in `value` attribute of `param name` in HTML\
    \ code.\n\n# Conclusion\n\nJava is a coding language. It’s very popular for being\
    \ one of the wide programming languages. A lot can be achieved with Java. It is\
    \ good for development of desktop applications, commonly called standalone applications.\
    \ It has applets, which can be added/embedded on web pages. It’s easy to learn\
    \ Java, especially with a background in object-oriented programming. Java supports\
    \ features of object-oriented programming. Examples include polymorphism, classes,\
    \ inheritance, encapsulation, etc. To code in Java, you need the Java compiler.\
    \ This tells you Java is compiled, not interpreted. The compiler is installed\
    \ automatically after installing the `JDK` (Java Development Kit).\n\nThe `JDK`\
    \ is an open-source software, so get it for free and install it on your computer.\
    \ A text editor is needed, which is where you will write your Java code. Examples\
    \ include `Netbeans`, `Notepad`, `Eclipse`, etc. With those, you can begin to\
    \ write your Java codes and run them from the console/terminal of your OS. You\
    \ invoke the java compiler (`javac`) to compile the code and generate a `.class`\
    \ file, then execute the `.class` file. The `.class` file has bytecode, which\
    \ is platform-independent, that is, it can be run on any platform, for example,\
    \ Unix, Windows, Mac OS, Solaris, etc.\n"
  raw: 'Compile the .java class then run the .html file. Ensure the correct image
    is specified in the .java class and keep it in the same directory as the files.
    It will move after running the code.


    ## Events on Applets


    Events may be added on the applets. Here, we add an event for the applet to display
    a message after clicking a button: Create the file AppletEvent.java then add this
    code:


        import java.applet.*; 


        import java.awt.event.*; 


        import java.awt.*; 


        public class AppletEvent extends Applet implements ActionListener{ 


        Button btn; 


        TextField txf; 


        public void init(){ 


        txf=new TextField(); 


        txf.setBounds(30,40,150,20); 


        btn=new Button("Click Here"); 


        btn.setBounds(80,150,60,50); 


        add(btn);


    add(txf); 


        btn.addActionListener(this); 


        setLayout(null); 


        } 


         public void actionPerformed(ActionEvent eve){ 


          txf.setText("Message on Applet!"); 


         }  


        } 


    Note the applet class implements an interface named ActionListener. This has methods
    for listening to action events and responding appropriately. New classes have
    been introduced, that is, Button and Textfield classes. We created instances of
    these classes, that is, btn and txf respectively to get a button and a textfield.
    The text Click Here was added to the button, and the setBounds() method is for
    setting the bounds for the two elements. Consider this:


        btn.addActionListener(this); 


    The command adds an action listener event to our button, that is, the button will
    be waiting or listening to be clicked. After the click, the action specified in
    the actionPerformed() method will be performed. A text will be added to the textfield,
    that is, Message on Applet!


    Create a new file myapplet.html then add this:


        <html> 


        <body> 


        <applet code="AppletEvent.class" width="350" height="350"> 


        </applet> 


        </body> 


        </html> 


    Compile your Java code via the command javac AppletEvent.java, then invoke the
    .html file via appletviewer  myapplet.html. The applet window will popup, Click
    the “Click Here” button. A new message will be added to textfield.


    ![](images/00006.jpeg)


    ## Applet Parameters


    Information on the HTML file may be used as a parameter to the applet. The parameters
    may be acquired via the getParameter() method of the Applet class. Example:


    Create a new file, AppletParameters.java. Add this code:


       import java.awt.Graphics; 


        import java.applet.Applet;


        public class AppletParameters extends Applet{ 


        public void paint(Graphics gc){ 


        String st=getParameter("message"); 


        gc.drawString(st,50, 50); 


        } 


       } 


    Create a new file for the HTML code, appletcode.html:


    <html>  


    <body>  


    <applet code="AppletParameters.class" width="350" height="350">  


    <param name="message" value="Applet Parameters">  


    </applet>  


    </body>  


    </html>  


    In the above HTML code, the value for param name should match the value of the
    argument passed to the getParameter() method in Java class.


    Now, compile your Java code via the javac AppletParameters.java command. The AppletParameters.class
    file will be generated. Invoke the html code via appletviewer appletcode.html.
    A window will pop up with text “AppletParameters” on it. This text was specified
    in value attribute of param name in HTML code.


    # Conclusion


    Java is a coding language. It’s very popular for being one of the wide programming
    languages. A lot can be achieved with Java. It is good for development of desktop
    applications, commonly called standalone applications. It has applets, which can
    be added/embedded on web pages. It’s easy to learn Java, especially with a background
    in object-oriented programming. Java supports features of object-oriented programming.
    Examples include polymorphism, classes, inheritance, encapsulation, etc. To code
    in Java, you need the Java compiler. This tells you Java is compiled, not interpreted.
    The compiler is installed automatically after installing the JDK (Java Development
    Kit).


    The JDK is an open-source software, so get it for free and install it on your
    computer. A text editor is needed, which is where you will write your Java code.
    Examples include Netbeans, Notepad, Eclipse, etc. With those, you can begin to
    write your Java codes and run them from the console/terminal of your OS. You invoke
    the java compiler (javac) to compile the code and generate a .class file, then
    execute the .class file. The .class file has bytecode, which is platform-independent,
    that is, it can be run on any platform, for example, Unix, Windows, Mac OS, Solaris,
    etc.'
