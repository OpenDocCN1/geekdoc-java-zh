    \n## while 循环\n\n只要指定的条件为真，此循环就会执行语句。首先求值条件，如果为真，则执行循环语句。如果条件变为假，控制将跳转去执行循环之后的语句。建议你在循环中添加一个递增/递减操作和一个测试条件，以便循环在条件变为假时停止执行。否则，循环可能会无限运行。语法下所示：\n\
