    \ but Cow object\n        c.drink(); // to execute method in Cow class\n    }\n\
    }\n```\n\n# Chapter 9: Polymorphism\n\nThis feature allows us to perform an action\
    \ through divergent ways. With polymorphism, one object may take different forms.\
    \ Example:\n\n```java\npublic interface Animals{}\n\npublic class Mammals{}\n\n\
    public class Cow extends Animals implements Mammals{\n\n}\n```\n\nThe `Cow` class\
    \ above has numerous inheritances, making it polymorphic. These references may\
    \ be generated from above:\n\n```java\nCow c = new Cow();\n\nMammals m = c;\n\n\
    Animals an = c;\n\nObject ob = c;\n```\n"
  raw: 'In inheritance, an object acquires the behaviors and properties of another
    object. The object acquiring the behaviors and the properties is the child, while
    the object from which they are inherited is the parent. They can also be referred
    to as subclass and superclass respectively. Inheritance makes information manageable
    in an hierarchical order. The methods that had been defined in the superclass
    can be reused in the subclass without defining them again.


    To inherit from a parent class, we use the extends keyword. Inheritance is done
    using the syntax given below:


    class Child-class-name extends Parent-class-name  


    {  


       // fields  and methods


    }  


    The extends keyword is an indication that we are creating some new class from
    an existing class. Example:


    class CompanyEmployee{ 


         float employee_salary=40000;


        } 


        public class JavaProgrammer extends CompanyEmployee{ 


         int bonus=10000; 


         public static void main(String args[]){ 


           JavaProgrammer p=new JavaProgrammer(); 


           System.out.println("Programmer salary is:"+p.salary); 


           System.out.println("Bonus of Programmer is:"+p.bonus); 


        } 


        } 


    There are different inheritance types:


    ## Single Inheritance


    In this case, a single class inherits from another class. The Worker and DBA classes
    given previously are an example of this. Example:


        class Mammal{ 


        void drink(){


            System.out.println("Drinking...");


                } 


        } 


        class Cow extends Mammal{ 


        void moow(){System.out.println("Moowing...");} 


        } 


        public class JavaInheritanceTest{ 


        public static void main(String args[]){ 


        Cow c=new Cow(); 


        c.moow(); 


        c.drink(); 


        }


    }


    In the above example, the drink() method has been defined in the Mammal class
    while the moow() method has been defined in the Cow class which extends the Mammal
    class. In the InheritanceTest class, we have created an instance of Cow class
    and named it c. We have then used this instance to access the two methods that
    have been defined in two different classes. That is how single inheritance works.


    ## Multilevel Inheritance


     This inheritance occurs when a class B inherits from class A, while class C inherits
    from class B. Example:


        class Mammal{ 


        void drink(){


            System.out.println("Drinking...");


        } 


        } 


        class Cow extends Mammal{ 


        void moow(){


            System.out.println("Moowing...");


        } 


        } 


        class BabyCow extends Cow{ 


        void jump(){


            System.out.println("Jumping...");} 


        } 


        public class JavaInheritanceTest2{ 


        public static void main(String args[]){ 


        BabyCow bc=new BabyCow(); 


        bc.moow(); 


        bc.jump(); 


        bc.drink(); 


        }


    }


    The drink() method has been defined in the Mammal class. The moow() method is
    defined in the Cow class which extends the Mammal class. The jump method has been
    defined in the BabyCow class which extends the Cow class. In the InheritanceTest2
    class, we have created an instance of BabyCow class named bc. This instance has
    then been used to access the various properties or methods. We are able to use
    the instance of BabyCow class to access methods defined in the Cow and Mammal
    classes. The methods in various classes can be seen as their properties.


    ## Hierarchical Inheritance


    This type of inheritance can be demonstrated like in this example:


        class Mammal{ 


        void drink(){


            System.out.println("Drinking...");


        } 


        } 


        class Cow extends Mammal{ 


        void moow(){


            System.out.println("Moowing...");


        } 


        } 


        class Goat extends Mammal{ 


        void meew(){


            System.out.println("Meewing...");


        } 


        } 


       public class JavaInheritanceTest3{ 


        public static void main(String args[]){ 


        Goat g=new Goat(); 


        g.meew(); 


        g.drink(); 


        //g.moow(); will give an Error 


        }


       } 


    After creating an instance of Goat class in the InheritanceTest3 class, we are
    able to inherit the properties defined in the Mammal class since the Goat class
    inherits from the Mammal class. However, we are unable to access the properties
    defined in the Cow class since the Goat class does not inherit from the Cow class.
    If we attempt to do that, for example, run the g.moow(); statement, we will get
    an error.


    Some languages support multiple inheritance, in which a single class inherits
    from two classes. Java doesn’t support this, and the closest we can get to this
    is by creating an interface, then use the implements on the interface. Suppose
    we create an interface named Interface1, then we can create a class named Class2
    that extends from Class1 and implements the interface Interface1:


    public class Class2 extends Class1 implements Interface1{


    }


    That is the closest we can get to the multiple inheritance feature in Java. For
    the class, we use the keyword “extends”, but this cannot be used for an interface.
    Instead, we use the keyword implements. This way, we can inherit the features
    of an interface. Inheritance helps in the reuse of existing properties and methods.


    # Chapter 8: overriding


    A subclass can override a method defined in the parent class if it was not declared
    with the final keyword. Overriding simply means overriding the functionality of
    the existing method. Example:


    class Mammal {


       public void drink() {


          System.out.println("Mammals can drink");


       }


    }


    class Cow extends Mammal {


       public void drink() {


          System.out.println("Cows can drink and eat");


       }


    }


    public class JavaTestOverriding {


       public static void main(String args[]) {


          Mammal a = new Mammal ();   // Animal reference and object


          Mammal b = new Cow();   // Animal reference but Dog object


          a.drink();   // to execute the method of Mammal class


          b.drink();   // to execute the method of Cow class


       }


    }


    In this case, b is a Mammal type, but it can use the method defined in the Cow
    class. Example 2:


    We will give a bank example. Different banks offer different interest rates on
    loans:


        class Banks{ 


        int getInterestRat(){


            return 0;


        } 


        } 


        class Bank1 extends Banks{ 


        int getInterestRat(){


            return 5;


        } 


        } 


        class Bank2 extends Banks{ 


        int getInterestRat(){


            return 7;


        } 


        } 


        class Bank3 extends Banks{ 


        int getInterestRat(){


            return 9;


        } 


        } 


        public class TestBanks{ 


        public static void main(String args[]){ 


        Bank1 b1=new Bank1(); 


        Bank2 b2=new Bank2(); 


        Bank3 b3=new Bank3(); 


        System.out.println("Bank1 Interest Rate: "+b1.getInterestRat()); 


        System.out.println("Bank1 Interest Rate: "+b2.getInterestRat()); 


        System.out.println("Bank1 Interest Rate: "+b3.getInterestRat()); 


        } 


        } 


    The method has been used differently for different classes.


    ## super Keyword


     We use the “super” keyword to access a method overridden from the super class.
    Example:


    class Mammals {


       public void drink() {


          System.out.println("Mammals can drink");


       }


    }


    class Cow extends Mammals {


       public void drink() {


          super.drink();   // to invoke method in super class


          System.out.println("Cows can drink and eat");


       }


    }


    public class TestCow {


       public static void main(String args[]) {


          Mammals c = new Cow();   // mammal reference but Cow object


          c.drink();   // to execute method in Cow class


       }


    }


    # Chapter 9: Polymorphism


    This feature allows us to perform an action through divergent ways. With polymorphism,
    one object may take different forms. Example:


    public interface Animals{}


    public class Mammals{}


    public class Cow extends Animals implements Mammals{


    }


    The Cow class above has numerous inheritances, making it polymorphic. These references
    may be generated from above:


    Cow c = new Cow();


    Mammals m = c;


    Animals an = c;


    Object ob = c;'
