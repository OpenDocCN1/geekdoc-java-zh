    \nThe call to override the method has been resolved during runtime. This is runtime\
    \ polymorphism. The overridden method has been called via reference variable for\
    \ superclass.\n\nWith polymorphism, one may perform an action via different ways.\
    \ If you have the class `Mammals` with the method `sound()`, the implementation\
    \ of the method will be different for different animal classes like `Goat`, `Cow`,\
    \ `Donkey` etc. You will have meow, moow etc. Example:\n\n```java\npublic class\
    \ Animals{\n  public void makeSound(){\n      System.out.println(\"Animals make\
    \ sound\");  \n  }\n}\n```\n\nWe can have a class for `Cats` that meows and extending\
    \ the `Animals` class:\n\n```java\nClass Cats extends Animals{\n  @Override\n\
    \  public void makeSound(){\n      System.out.println(\"Meow\");\n  }\n  public\
    \ static void main(String args[]){\n Animals anim = new Cats();\n anim.makeSound();\n\
    \  }\n}\n```\n\nWe can have a class `Cows` that extends the `Animals` class as\
    \ follows:\n\n```java\nClass Cows extends Animals{\n  @Override\n  public void\
    \ makeSound(){\n      System.out.println(\"Moow\");\n  }\n  public static void\
    \ main(String args[]){\n Animals anim = new Cows();\n anim.makeSound();\n  }\n\
    }\n```\n\nWe achieve compile-time polymorphism via method overloading. Example:\n\
    \n```java\nclass Class1\n{\n  void demoMethod (int ab)\n  {\n      System.out.println\
    \ (\"ab: \" + ab);\n  }\n  void demoMethod (int ab, int bc)\n  {\n      System.out.println\
    \ (\"ab and bc: \" + ab + \",\" + bc);\n  }\n  double demoMethod(double ab) {\n\
    \      System.out.println(\"double ab: \" + ab);\n      return ab*ab;\n  }\n}\n\
    \npublic class Class2\n{\n  public static void main (String args [])\n  {\n  \
    \    Class1 cs1 = new Class1();\n      double res;\n      cs1 .demoMethod(5);\n\
    \      cs1 .demoMethod(5, 10);\n      res = cs1 .demoMethod(10.5);\n      System.out.println(\"\
    Finally : \" + res);\n  }\n}\n```\n\nThe `demoMethod()` has been overloaded 3\
    \ times. It has a one `int` parameter, two `int` parameters and a `double` parameter.\
    \ The method to be called in this case depends on arguments passed during the\
    \ call. This is done during the function call, hence we have compile time polymorphism.\n\
    \n# Chapter 10: Abstraction\n\nThis feature makes a developer present to the user\
    \ only what is necessary and hides the rest from users. The developer can differentiate\
    \ what needs to be shown to users and what does not. When driving a car, you press\
    \ the accelerator, and the car’s speed increases; you press the brakes, and the\
    \ car stops. The driver is not aware of what happens inside the car, but an engineer\
    \ worked on the car, presenting to the users the brakes, accelerator, handbrake,\
    \ etc. (what is necessary to the user), and hid implementation details. When sending\
    \ an email, you are required to type the content, attach documents and press the\
    \ “Send” button, without knowing what happens behind the scenes. This is abstraction.\n\
    \nWith abstraction, users aren’t aware of implementation details. The developer\
    \ hides them. The user gets only the functionality of the app. That is, the user\
    \ gets information on what an app does rather than how it’s done. An abstract\
    \ class has the `abstract` keyword. If any class has an abstract method, it must\
    \ be declared abstract. The abstract class must also be inherited from some other\
    \ abstract class. Example:\n\n```java\nabstract class cars {\n  abstract void\
    \ consume();\n}\n\npublic class Mercedez extends cars {\n  void consume() {\n\
    \   System.out.println(\"Mercedez consumes petrol\")\n  }\n  public static void\
    \ main(String argu[]) {\n  cars cr = new Mercedez();\n  cr.consume();\n  System.out.println(\"\
    Done\")\n}\n```\n\nIt’t a must for an abstract class to have abstract methods\
    \ in it. You can’t instantiate an abstract class. That is why we instantiated\
    \ the `Mercedez` class as it has a method from the abstract class. Example:\n\n\
    ```java\npublic abstract class Worker {\n  private String workerName;\n  private\
    \ String workerAddress;\n  private int workerNumber;\n  public Worker(String workerName,\
    \ String workerAddress, int workerNumber) {\n    System.out.println(\"Worker\"\
    )\n    this.workerName = workerName;\n    this.workerAddress = workerAddress;\n\
    \    this.workerNumber = workerNumber;\n  }\n  public double getWorkerPay() {\n\
    \    System.out.println(\"Inside getWorkerPay\")\n    return 0.00;\n  }\n  public\
    \ void checkMail() {\n    System.out.println(\"Sending check to \" + this.workerName\
    \ + \" \" + this.workerAddress);\n  }\n  public String toString() {\n    return\
    \ workerName + \" \" + workerAddress + \" \" + workerNumber;\n  }\n  public String\
    \ getWorkerName() {\n    return workerName;\n  }\n  public String getWorkerAddress()\
    \ {\n    return workerAddress;\n  }\n  public void setWorkerAddress(String newWorkerAddress)\
    \ {\n    workerAddress = newWorkerAddress;\n  }\n  public int getWorkerNumber()\
    \ {\n    return workerNumber;\n  }\n}\n```\n\nThe `Worker` class is similar to\
    \ other Java classes except the use of the `abstract` keyword. Attempt to instantiate\
    \ it as follows:\n\n```java\npublic class AbstractInstantiation {\n  public static\
    \ void main(String [] args) {\n    /* This will generate error */\n    Worker\
    \ wk = new Worker(\"George P.\", \"Texas, USA\", 44);\n    System.out.println(\"\
    \\n Calling checkMail with reference\")\n    wk.checkMail();\n  }\n}\n```\n\n\
    The properties of the `Worker` class must be inherited rather than instantiating\
    \ the class. Example:\n\n```java\npublic class Wage extends Worker {\n  private\
    \ double wage; // Annual salary\n  public Wage(String workerName, String workerAddress,\
    \ int workerNumber, double wage) {\n    super(workerName, workerAddress, workerNumber);\n\
