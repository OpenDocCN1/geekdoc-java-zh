    \ Java Applets\n\nApplets are Java programs capable of running on web browsers.\
    \ It can act like a full functional app since it has full Java API. The applet\
    \ class extends `java.applet.Applet`. Applets don’t have a `main` method, hence\
    \ they don’t invoke `main()`. They are embedded on HTML pages. After an HTML page\
    \ with an applet is opened, its code is downloaded to the local machine. The `JVM`\
    \ (Java Virtual Machine) is mandatory for you to view applets.\n\nApplets are\
    \ processed on the client’s side, hence they give users a quick response compared\
    \ to other apps. Applets offer good security.\n\n## Applets’ Lifecycle\n\nApplets\
    \ go through these steps:\n\n1. Initialization- the `init()` method initializes\
    \ applets.\n2. Starting- the `start()` method starts applets.\n3. Painting- done\
    \ after calling `paint()` method.\n4. Stopping- we invoke the `stop()` method\
    \ to stop an applet.\n5. Destroying- the applet is destroyed by invoking the `destroy()`\
    \ method.\n\nApplets are viewed by HTML. Example:\n\nCreate a new file in text\
    \ editor with the name “MyApplet.java”. Add this code to it:\n\n```java\nimport\
    \ java.awt.Graphics;\nimport java.applet.Applet;\npublic class OurApplet extends\
    \ Applet{\n  public void paint(Graphics gc){\n    gc.drawString(\"First Applet!\"\
    ,150,150);\n  }\n}\n```\n\nCreate a new file in editor named `code1.html`. Add\
    \ this code to it:\n\n```html\n<html>\n<body>\n  <applet code=\"OurApplet.class\"\
    \ width=\"320\" height=\"320\">\n</applet>\n</body>\n</html>\n```\n\nFirst, we\
    \ have Java code in which we added code regarding what our applet should do. The\
    \ class is named `MyApplet`. Consider this:\n\n```java\ngc.drawString(\"First\
    \ Applet!\",150,150);\n```\n\nWe are drawing the “First Applet! Text at points\
    \ 150, 150 of the applet window. Note the two libraries added via the `import`\
    \ statement, that is, `Graphics` and `Applet` libraries. The `paint()` method\
    \ is defined in the `Graphics` library. If we don’t import it, an error will be\
    \ generated since Java compiler won’t understand what we mean. We have HTML code\
    \ in file `code1.html`. In this, we created a window on which to draw text:\n\n\
