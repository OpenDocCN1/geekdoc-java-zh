    \ petrol\");\n  } \n  public static void main(String args[]){ \n    Cars cr =\
    \ new Mercedez();//upcasting \n    cr.consume(); \n  } \n}\n```\n\n对覆盖方法的调用在运行时已解析。这就是运行时多态。被重写的方法通过父类的引用变量被调用。\n\
    \n通过多态，可以通过不同的方式执行操作。如果你有一个带有 `sound()` 方法的 `Mammals` 类，那么该方法的实现对于 `Goat`、`Cow`、`Donkey`\
    \ 等不同动物类将是不同的。你会得到 `meow`、`moow` 等。示例：\n\n```java\npublic class Animals{\n  public\
    \ void makeSound(){\n      System.out.println(\"Animals make sound\");  \n  }\n\
    }\n```\n\n我们可以有一个会喵喵的 `Cats` 类，并继承 `Animals` 类：\n\n```java\nClass Cats extends\
    \ Animals{\n  @Override\n  public void makeSound(){\n      System.out.println(\"\
    Meow\");\n  }\n  public static void main(String args[]){\n Animals anim = new\
    \ Cats();\n anim.makeSound();\n  }\n}\n```\n\n我们可以有一个继承 `Animals` 类的 `Cows` 类，如下：\n\
    \n```java\nClass Cows extends Animals{\n  @Override\n  public void makeSound(){\n\
    \      System.out.println(\"Moow\");\n  }\n  public static void main(String args[]){\n\
    \ Animals anim = new Cows();\n anim.makeSound();\n  }\n}\n```\n\n我们通过方法重载实现了编译时多态。示例：\n\
    \n```java\nclass Class1\n{\n  void demoMethod (int ab)\n  {\n      System.out.println\
    \ (\"ab: \" + ab);\n  }\n  void demoMethod (int ab, int bc)\n  {\n      System.out.println\
    \ (\"ab and bc: \" + ab + \",\" + bc);\n  }\n  double demoMethod(double ab) {\n\
    \      System.out.println(\"double ab: \" + ab);\n      return ab*ab;\n  }\n}\n\
    \npublic class Class2\n{\n  public static void main (String args [])\n  {\n  \
    \    Class1 cs1 = new Class1();\n      double res;\n      cs1 .demoMethod(5);\n\
    \      cs1 .demoMethod(5, 10);\n      res = cs1 .demoMethod(10.5);\n      System.out.println(\"\
    Finally : \" + res);\n  }\n}\n```\n\n`demoMethod()` 被重载了 3 次。它有一个 `int` 参数、两个\
    \ `int` 参数和一个 `double` 参数。在这种情况下，将要调用的方法取决于调用时传递的参数。这是在函数调用期间完成的，因此我们拥有编译时多态。\n\
    \n# 第 10 章：抽象\n\n这一特性使开发人员只向用户展示必要的内容，并向用户隐藏其余部分。开发者可以区分哪些需要展示给用户，哪些不需要。当开车时，你按下加速板，车速就会增加；你按下刹车，汽车就会停止。司机并不知道汽车内部发生了什么，但工程师设计了汽车，向用户展示了刹车、加速板、手刹等（用户必要的部分），并隐藏了实现细节。在发送邮件时，你只需要输入内容、添加文档并点击“发送”按钮，而无需知道背后发生了什么。这就是抽象。\n\
    \n通过抽象，用户无法感知到实现细节。开发者隐藏了它们。用户只获得应用程序的功能。也就是说，用户获得的是关于应用程序“做什么”的信息，而不是“如何做”。抽象类具有\
    \ `abstract` 关键字。如果任何类具有抽象方法，则它必须被声明为抽象类。抽象类也必须继承自另一个抽象类。示例：\n\n```java\nabstract\
    \ class cars {\n  abstract void consume();\n}\n\npublic class Mercedez extends\
    \ cars {\n  void consume() {\n   System.out.println(\"Mercedez consumes petrol\"\
    )\n  }\n  public static void main(String argu[]) {\n  cars cr = new Mercedez();\n\
    \  cr.consume();\n  System.out.println(\"Done\")\n}\n```\n\n抽象类中包含抽象方法是必须的。你不能实例化抽象类。这就是为什么我们实例化\
    \ `Mercedez` 类，因为它拥有来自抽象类的方法。示例：\n\n```java\npublic abstract class Worker {\n\
    \  private String workerName;\n  private String workerAddress;\n  private int\
    \ workerNumber;\n  public Worker(String workerName, String workerAddress, int\
    \ workerNumber) {\n    System.out.println(\"Worker\")\n    this.workerName = workerName;\n\
    \    this.workerAddress = workerAddress;\n    this. workerNumber = workerNumber;\n\
    \  }\n  public double getWorkerPay() {\n    System.out.println(\"Inside getWorkerPay\"\
    )\n    return 0.00;\n  }\n  public void checkMail() {\n    System.out.println(\"\
    Sending check to \" + this.workerName + \" \" + this.workerAddress);\n  }\n  public\
    \ String toString() {\n    return workerName;\n  }\n}\n```\n*(注：原文示例代码此处似乎缺少了右大括号，翻译时保持逻辑一致)*\n\
    \n由于提供的原始文本中存在大量重复和代码片段断裂，以下是基于原文每一行文本的忠实翻译（包含原文中的重复部分）：\n\n抽象类中包含抽象方法是必须的。你不能实例化抽象类。这就是为什么我们实例化\
    \ `Mercedez` 类，因为它拥有来自抽象类的方法。示例：\n\n```java\npublic abstract class Worker {\n\
    \  private String workerName;\n  private String workerAddress;\n  private int\
