    # Chapter 6: looping


    Java loops help us do some tasks repeatedly. Loops execute the statements in a
    sequential manner. The first one is run first, followed by the second, etc. Let
    us discuss the Java loops:


    ## for Loop


    The loop is run, provided the condition evaluates to true. The execution will
    stop immediately if the condition becomes false. Syntax:


    for(initialization; loop_condition ; Increment/decrement_part)


    {


       the_statement(s);


    }


    The initialization defines the initial value of the loop condition. The loop_condition
    specifies the condition that must always be true for the loop to run. The loop_increment/decrement
    defines the amount by which the initialization value will be incremented or decremented
    after each iteration. Example:


    public class ForLoopDemo {


        public static void main(String args[]){


             for(int ix=0; ix<10; ix++){


                  System.out.println("The ix value is currently: "+ix);


             }


        }


    }


    The program will print the value of ix from 0 to 9\. When the loop increments
    the 9 to get 10, it will find that it is violating the loop condition, that is,
    ix<10, hence the execution will halt immediately.


    ## while Loop


    This loop executes the statement(s) as long as the specified condition is true.
    The condition is first evaluated, and if true, the loop statement(s) are executed.
    If the condition becomes false, the control will jump to execute statements that
    come after the loop. It is recommended you add an increment/decrement to the loop
    and a test condition so that the loop halts execution when the condition becomes
    false. Otherwise, the loop may run indefinitely. Syntax:


    while(A_boolean_expression) {


       // Statement(s)


    }


    Example:


    public class JavaWhileLoop {


       public static void main(String args[]) {


          int xy = 20;


          while( xy < 25 ) {


             System.out.print("The value of xy is: " + xy );


             xy++;


             System.out.print("\n");


          }


       }


    }


    The program prints xy’s value from 20 to 24. The variable’s initial value is 20\.
    The test condition checks whether this value is less than 25, which is true. This
    means the loop will run. When it reached 24, it will check and find the value
    of xy is 25\. The execution of the loop then halts immediately since continuing
    to execute it will violate the loop condition.


    ## do…while Loop


    This is closely related to the while loop. In while, the loop condition execution
    is done before the loop body execution. This is opposite in a do…while loop as
    the body is executed first before the condition. In a while loop, the loop body
    may never be executed, but in a do…while loop, the loop body must be executed
    for at least once. Syntax:


    do


    {


       Statement or statements;


    } while(loop_condition);


    Example:


    public class JavaDoWhileLoopExample {


       public static void main(String args[]) {


          int xy = 20;


          do {


             System.out.print("The value of xy is: " + xy );


             xy++;


             System.out.print("\n");


          }while( xy < 25 );


       }


    }


    The code will print the value of xy from 20 to 24 just as in the previous loop.
    This is because the condition is true, that is, 20 is less than 25\. Suppose we
    set the loop condition as false, for example, initialize the value of xy to 30
    as shown below:


    public class DoWhileLoopExample {


       public static void main(String args[]) {


          int xy = 30;


          do {


             System.out.print("The value of xy is: " + xy );


             xy++;


             System.out.print("\n");


          }while( xy < 25 );


       }


    }


    After running the above program, you will get “The value of xy is: 30” as the
    output. This means that the while condition is false. This is because the Java
    compiler first runs through the program for the initial value of xy which is 30\.
    That value is printed. Once it moves to the loop condition, it finds itself violating
    the condition, that is, xy<25, hence the loop execution halts immediately.


    There are two statements that are used for controlling how Java loops are executed.
    They are namely continue and break statements. They work by changing the normal
    way of executing a loop. Let us discuss them.


    ## break Statement


    This statement causes the execution of a loop to halt, and the control jumps to
    the statement that comes next after the loop. It also halts a case in a switch
    statement. Syntax:


    your-jump-statement;    


    break;   


    Example:


    public class JavaBreakStatementExample {  


    public static void main(String[] args) {  


        for(int ix=0;ix<=10;ix++){  


            if(ix==6){  


                break;  


            }  


            System.out.println(ix);  


        }  


    }  


    }  


    The program will print from 0 to 5\. This is because of the following section
    of our program:


    if(ix==6){ 


                break;


    The increment is done from 0 to 5, and once it notices that the value of ix is
    6, it will halt immediately as it will be violating the above condition. For the
    case of nested loops, the break can be added to the inner loop, and it will break
    it. This will cause the inner loop to break once the specified condition is met.
    Example:


        public class BreakStatement2 { 


        public static void main(String[] args) { 


                    for(int ix=1;ix<=5;ix++){   


                            for(int jk=1;jk<=5;jk++){   


                                if(ix==3&&jk==3){   


                                    break;   


                                }   


                                System.out.println(ix+" "+jk);   


                            }   


                    }   


        } 


        } 


    ## continue Statement


    This statement makes the loop jump to next iteration immediately. It helps the
    loop to continue after a jump. Note that in previous case, the loop halted immediately.
    This statement can help it resume execution in the next iteration after the jump.
    Example:


    your_jump-statement;    


    continue;   


    Example:


    public class ContinueStatamentExample {  


    public static void main(String[] args) {  


        for(int ix=1;ix<=10;ix++){  


            if(ix==5){  


                continue;  


            }  


            System.out.println(ix);  


        }  


    }  


    }  


    The code will not print 5, but all the other numbers from 1 to 10 will be printed.


    The continue statement may also be used with an inner loop. In such a case, it
    will only continue your inner loop. Example:


    public class ContinueStatament2 {  


     public static void main(String[] args) {  


                  for(int ix=1;ix<=3;ix++){    


                          for(int jk=1;jk<=3;jk++){    


                              if(ix==2&&jk==2){    


                                  continue;    


                              }    


                              System.out.println(ix+" "+jk);    


                          }    


                  }    


      }  


    } 


