    ```\n\n在这种情况下，`b` 是 `Mammal` 类型，但可以使用 `Cow` 类定义的方法。示例 2：给出一个银行示例。不同的银行对贷款提供不同的利率：\n\
    \n```java\nclass Banks{\n    int getRat(){\n        return 0;\n    }\n}\n\nclass\
