    In checkMail for Wage class \")\n    System.out.println(\"Sending check to \"\
    \ + getWorkerName() + \" with wage \" + wage);\n  }\n  public double getWage()\
    \ {\n    return wage;\n  }\n  public void setWage(double newWage) {\n    if(newWage\
    \ >= 0.0) {\n      wage = newWage;\n    }\n  }\n  public double getWorkerPay()\
    \ {\n    System.out.println(\"Getting wage for \" + getWorkerName())\n    return\
    \ wage/52;\n  }\n}\n```\n\nThe `Worker` class cannot be instantiated, but the\
    \ `Wage` class can be instantiated then use its instance to access all fields\
