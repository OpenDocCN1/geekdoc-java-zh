    \ c` 在 `methodExample` 方法内部声明，使其成为一个局部变量。它只能在该方法内部被访问。\n\n## 数据类型\n\n在 Java 中，数据类型可以是基本类型或非基本类型。\n\
    \n### 基本数据类型\n\n这些是 Java 提供的预定义数据类型。共有 8 个，包括 `byte`、`short`、`long`、`char`、`int`、`float`、`Boolean`\
