- fmt: "\nIn inheritance, an object acquires the behaviors and properties of another\
    \ object. The object acquiring the behaviors and the properties is the child,\
    \ while the object from which they are inherited is the parent. They can also\
    \ be referred to as subclass and superclass respectively. Inheritance makes information\
    \ manageable in an hierarchical order. The methods that had been defined in the\
    \ superclass can be reused in the subclass without defining them again.\n\nTo\
    \ inherit from a parent class, we use the `extends` keyword. Inheritance is done\
    \ using the syntax given below:\n\n```java\nclass Child-class-name extends Parent-class-name\
    \ {\n    // fields and methods\n}\n```\n\nThe `extends` keyword is an indication\
    \ that we are creating some new class from an existing class. Example:\n\n```java\n\
    class CompanyEmployee{\n    float employee_salary=40000;\n}\n\npublic class JavaProgrammer\
    \ extends CompanyEmployee{\n    int bonus=10000;\n    public static void main(String\
    \ args[]){\n        JavaProgrammer p=new JavaProgrammer();\n        System.out.println(\"\
    Programmer salary is:\"+p.salary);\n        System.out.println(\"Bonus of Programmer\
    \ is:\"+p.bonus);\n    }\n}\n```\n\nThere are different inheritance types:\n\n\
    ## Single Inheritance\n\nIn this case, a single class inherits from another class.\
    \ The `Worker` and `DBA` classes given previously are an example of this. Example:\n\
    \n```java\nclass Mammal{\n    void drink(){\n        System.out.println(\"Drinking...\"\
    );\n    }\n}\n\nclass Cow extends Mammal{\n    void moow(){System.out.println(\"\
    Moowing...\");}\n}\n\npublic class JavaInheritanceTest{\n    public static void\
    \ main(String args[]){\n        Cow c=new Cow();\n        c.moow();\n        c.drink();\n\
    \    }\n}\n```\n\nIn the above example, the `drink()` method has been defined\
    \ in the `Mammal` class while the `moow()` method has been defined in the `Cow`\
    \ class which extends the `Mammal` class. In the `InheritanceTest` class, we have\
    \ created an instance of `Cow` class and named it `c`. We have then used this\
    \ instance to access the two methods that have been defined in two different classes.\
    \ That is how single inheritance works.\n\n## Multilevel Inheritance\n\nThis inheritance\
    \ occurs when a class `B` inherits from class `A`, while class `C` inherits from\
    \ class `B`. Example:\n\n```java\nclass Mammal{\n    void drink(){\n        System.out.println(\"\
    Drinking...\");\n    }\n}\n\nclass Cow extends Mammal{\n    void moow(){\n   \
    \     System.out.println(\"Moowing...\");\n    }\n}\n\nclass BabyCow extends Cow{\n\
    \    void jump(){\n        System.out.println(\"Jumping...\");\n    }\n}\n\npublic\
    \ class JavaInheritanceTest2{\n    public static void main(String args[]){\n \
    \       BabyCow bc=new BabyCow();\n        bc.moow();\n        bc.jump();\n  \
    \      bc.drink();\n    }\n}\n```\n\nThe `drink()` method has been defined in\
    \ the `Mammal` class. The `moow()` method is defined in the `Cow` class which\
    \ extends the `Mammal` class. The `jump` method has been defined in the `BabyCow`\
    \ class which extends the `Cow` class. In the `InheritanceTest2` class, we have\
    \ created an instance of `BabyCow` class named `bc`. This instance has then been\
    \ used to access the various properties or methods. We are able to use the instance\
    \ of `BabyCow` class to access methods defined in the `Cow` and `Mammal` classes.\
    \ The methods in various classes can be seen as their properties.\n\n## Hierarchical\
    \ Inheritance\n\nThis type of inheritance can be demonstrated like in this example:\n\
    \n```java\nclass Mammal{\n    void drink(){\n        System.out.println(\"Drinking...\"\
    );\n    }\n}\n\nclass Cow extends Mammal{\n    void moow(){\n        System.out.println(\"\
    Moowing...\");\n    }\n}\n\nclass Goat extends Mammal{\n    void meew(){\n   \
    \     System.out.println(\"Meewing...\");\n    }\n}\n\npublic class JavaInheritanceTest3{\n\
    \    public static void main(String args[]){\n        Goat g=new Goat();\n   \
    \     g.meew();\n        g.drink();\n        //g.moow(); will give an Error\n\
    \    }\n}\n```\n\nAfter creating an instance of `Goat` class in the `InheritanceTest3`\
    \ class, we are able to inherit the properties defined in the `Mammal` class.\
    \ However, we are unable to access the properties defined in the `Cow` class since\
    \ the `Goat` class does not inherit from the `Cow` class. If we attempt to do\
    \ that, for example, run `g.moow();`, we will get an error.\n\nSome languages\
    \ support multiple inheritance, which a single class inherits from two classes.\
    \ Java doesn’t support this, and the closest we can get to this is by creating\
    \ an interface, then use `implements` on the interface. Suppose we create an interface\
    \ named `Interface1`, then we can create a class named `Class2` that extends `Class1`\
    \ and implements `Interface1`:\n\n```java\npublic class Class2 extends Class1\
    \ implements Interface1{\n```\n\nThat is the closest we can get to the multiple\
    \ inheritance feature in Java. For the class, we use the keyword `extends`, but\
    \ this cannot be used for an interface. Instead, we use the keyword `implements`.\
    \ This way, we can inherit the features of an interface. Inheritance helps in\
    \ the reuse of properties and methods.\n\n# Chapter 8: overriding\n\nA subclass\
    \ can override a method defined in the parent class if it was not declared with\
    \ the `final` keyword. Overriding simply means overriding the functionality of\
    \ the existing method. Example:\n\n```java\nclass Mammal {\n    public void drink()\
    \ {\n        System.out.println(\"Mammals can drink\");\n    }\n}\n\nclass Cow\
    \ extends Mammal {\n    public void drink() {\n        System.out.println(\"Cows\
    \ can drink and eat\");\n    }\n}\n\npublic class JavaTestOverriding {\n    public\
    \ static void main(String args[]) {\n        Mammal a = new Mammal (); // Animal\
    \ reference and object\n        Mammal b = new Cow(); // Animal reference but\
    \ Dog object\n        a.drink(); // to execute the method of Mammal class\n  \
    \      b.drink(); // to execute the method of Cow class\n    }\n}\n```\n\nIn this\
    \ case, `b` is a `Mammal` type, but it can use the method defined in the `Cow`\
    \ class. Example 2: We will give a bank example. Different banks offer different\
    \ interest rates on loans:\n\n```java\nclass Banks{\n    int getInterestRat(){\n\
    \        return 0;\n    }\n}\n\nclass Bank1 extends Banks{\n    int getInterestRat(){\n\
    \        return 5;\n    }\n}\n\nclass Bank2 extends Banks{\n    int getInterestRat(){\n\
    \        return 7;\n    }\n}\n\nclass Bank3 extends Banks{\n    int getInterestRat(){\n\
    \        return 9;\n    }\n}\n\npublic class TestBanks{\n    public static void\
    \ main(String args[]){\n        Bank1 b1=new Bank1();\n        Bank2 b2=new Bank2();\n\
    \        Bank3 b3=new Bank3();\n        System.out.println(\"Bank1 Interest Rate:\
    \ \"+b1.getInterestRat());\n        System.out.println(\"Bank1 Interest Rate:\
    \ \"+b2.getInterestRat());\n        System.out.println(\"Bank1 Interest Rate:\
    \ \"+b3.getInterestRat());\n    }\n}\n```\n\nThe method has been used differently\
    \ for different classes.\n\n## super Keyword\n\nWe use the `super` keyword to\
    \ access a method overridden from the super class. Example:\n\n```java\nclass\
    \ Mammals {\n    public void drink() {\n        System.out.println(\"Mammals can\
    \ drink\");\n    }\n}\n\nclass Cow extends Mammals {\n    public void drink()\
    \ {\n        super.drink(); // to invoke method in super class\n        System.out.println(\"\
    Cows can drink and eat\");\n    }\n}\n\npublic class TestCow {\n    public static\
