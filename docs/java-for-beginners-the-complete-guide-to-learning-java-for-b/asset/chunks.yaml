    \ Java 代码，你应该获取 Java 编译器。Java 是编译的，而不是解释的。你需要一个可以在其中编写 Java 代码的编辑器。记事本非常适合这个。有了这些工具，你就可以开始编写和运行你的\
    \ Java 代码了。这意味着上手 Java 非常容易，使得 Java 成为初学者的良好语言。Java 字节码（通常在编译 Java 源代码后生成）是平台无关的，这意味着它可以在包括\
    \ Windows、Solaris、Linux 在内的任何平台上运行。Java 应用通过安全机制确保安全。\n\n# 第 1 章：开始学习 Java\nJava\
    \ 是一种广泛的编程语言，包含了许多适用于应用程序开发的特性。它是设计/开发桌面应用程序的很好的编程语言。这些程序作为独立应用程序非常流行。如果你需要分布式应用程序，\
    \ Java 是最适合使用的语言。Java Applets 可以嵌入/添加到网页中。Java 提供的许多特性使其成为一种受欢迎的编程语言。其广泛的特性使其适用于各行业应用的开发。要编写\
    \ Java 代码，你应该获取 Java 编译器。Java 是编译的，而不是解释的。你需要一个可以在其中编写 Java 代码的编辑器。记事本非常适合这个。有了这些工具，你就可以开始编写和运行你的\
    \ Java 代码了。这意味着上手 Java 非常容易，使得 Java 成为初学者的良好语言。Java 字节码（通常在编译 Java 源代码后生成）是平台无关的，这意味着它可以在包括\
    \ Windows、Solaris、Linux 在内的任何平台上运行。Java 应用通过安全机制确保安全。\n\n## 环境配置\n为了编写和运行 Java\
    \ 程序，你需要一个编辑器和 Java 编译器。Java 随 `JDK`（Java 开发工具包）提供。你甚至可以使用像记事本这样的基础编辑器。不过，也有更高级的\
    \ Java 编辑器，例如 `Eclipse` 和 `Netbeans`。\n\n首先，在你的电脑上下载并安装 `JDK`。之后，你将拥有 Java。打开浏览器并输入或粘贴以下\
    \ URL：\n\n[`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2153751.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2153751.html)\n\
    \n从那里你可以获取最新版本的 `JDK`。你需要设置环境变量以告知正确的 Java 安装目录。这意味着你需要设置 `path` 变量。通常安装路径是 `C:\\\
    Program Files\\java\\jdk`。在 Windows 上正确设置路径的方法是：“我的电脑”，选择“属性”，打开“高级系统设置”，然后选择“环境变量”。添加\
    \ `C:\\Program Files\\java\\jdk\\bin` 路径。Linux 用户请阅读你的 shell 文档。\n\n## Java 语法\n\
    Java 程序由通过相互调用方法的对象组成。以下是 Java 程序中的主要构造部分：\n\n- **对象**：对象以状态和行为为特征。例如，猫有颜色、品种名称等状态，以及吃、喵喵和摇尾巴等行为。\n\
    - **类**：这是描述对象支持的状态/行为的蓝图/模板。\n- **方法**：方法是一种行为。逻辑写在方法中，并且可以用于数据处理。\n\n## 第一个程序\n\
    这是我们的第一个 Java 程序。执行后它应该打印出“Hello World”：\n\n```java\npublic class OurFirstProgram{\n\
    \    public static void main(String args[]){\n        System.out.println(\"Hello\
    \ World\");\n    }\n}\n```\n\n"
- fmt: "\nOpen your text editor like `Notepad` and create a new file named `FirstProgram.java`.\
    \ Save the file. The `.java` extension marks the file as a Java file. Type the\
    \ above program code in the file and save the changes. Open the command prompt\
    \ then navigate to the directory in which you have saved the file. Run the commands\
    \ given below from that directory:\n\n```\njavac FirstProgram.java\njava FirstProgram\n\
    ```\n\nIn my case, I saved the file on the desktop. I executed the commands as\
    \ follows:\n\n![](images/00001.gif)\n\nThe program prints “Hello World” as the\
    \ result. In the command `javac FirstProgram.java`, we are invoking the java compiler\
    \ (`javac`) to compile the program. The command returned nothing on the command\
    \ prompt since the program has no error, and no warning was generated. The command\
    \ generates a `.class` file (`FirstProgram.class`) in the directory; please confirm.\
    \ In the command `java FirstProgram`, we are simply running the program to give\
    \ us the result.\n\nConsider the following line extracted from the code:\n\n```java\n\
    public class FirstProgram{\n```\n\nThe line simply declares a class named `FirstProgram`.\
    \ Java is a case sensitive language, hence this class must always be referred\
    \ to as it is written above. The `public` keyword declares that class as public,\
    \ meaning it is accessible from any other class within the same package. The `{`\
    \ declares the beginning of the class body, and it should be closed by a `}`.\n\
    \nNote: The filename in which we write the program should match the class-name;\
    \ otherwise, you will experience trouble when running the program. In our case,\
    \ the class was named `FirstProgram`, hence the filename should be `FirstProgram.java`.\n\
    \nConsider the following line extracted from the code:\n\n```java\npublic static\
    \ void main(String args[]){\n```\n\nThat’s the main method. A java program cannot\
    \ be executed or run without this method. Consider the following line extracted\
    \ from the code:\n\n```java\nSystem.out.println(\"Hello World\");\n```\n\nWe are\
    \ simply invoking or calling the `println` method to print the text Hello World\
    \ on the terminal of the command prompt.\n\nLastly, we have two closing curly\
    \ braces, `}}`. The first one closes the opening brace for the main method while\
    \ the second one closes the opening brace for the class.\n\n# Chapter 2: Java\
    \ Variables\n\nA variable can be seen as a container responsible for holding a\
    \ value during the life of a program. Each variable is of a certain data type,\
    \ designative the kind of value that it can hold. There are two steps in using\
    \ Java variables, that is, variable declaration and variable initialization.\n\
    \n## Variable Declaration\n\nThe declaration of a variable involves giving it\
    \ a name and specifying its data type. Below are examples of valid variable declaration:\n\
    \n```\nint x,j,z;\nfloat pi;\ndouble a;\nchar c;\n```\n\nThe `int`, `float`, `double`\
    \ and `char` are the data types, specifying the type of value each variable can\
    \ or should hold. To declare several variables in one line, separate them using\
    \ a comma (`,`) as in the first example. A variable declaration should end with\
    \ a semicolon (`;`).\n\n## Variable Initialization\n\nVariable initializing involves\
    \ assigning it a valid value. The value to be assigned to the variable is determined\
    \ by the variable’s data type. Below are examples of valid variable initializations.\n\
    \n```\npi =3.14f;\na =20.22778765;\nc='v';\n```\n\nBoth the declaration and initialization\
