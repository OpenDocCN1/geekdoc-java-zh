  \ Java 代码了。这意味着上手 Java 非常容易，使得 Java 成为初学者的良好语言。Java 字节码（通常在编译 Java 源代码后生成）是平台无关的，这意味着它可以在包括\
  \ Windows、Solaris、Linux 在内的任何平台上运行。Java 应用通过安全机制确保安全。\n\n# 第 1 章：开始学习 Java\nJava\
  \ 是一种广泛的编程语言，包含了许多适用于应用程序开发的特性。它是设计/开发桌面应用程序的很好的编程语言。这些程序作为独立应用程序非常流行。如果你需要分布式应用程序，\
  \ Java 是最适合使用的语言。Java Applets 可以嵌入/添加到网页中。Java 提供的许多特性使其成为一种受欢迎的编程语言。其广泛的特性使其适用于各行业应用的开发。要编写\
  \ Java 代码，你应该获取 Java 编译器。Java 是编译的，而不是解释的。你需要一个可以在其中编写 Java 代码的编辑器。记事本非常适合这个。有了这些工具，你就可以开始编写和运行你的\
  \ Java 代码了。这意味着上手 Java 非常容易，使得 Java 成为初学者的良好语言。Java 字节码（通常在编译 Java 源代码后生成）是平台无关的，这意味着它可以在包括\
  \ Windows、Solaris、Linux 在内的任何平台上运行。Java 应用通过安全机制确保安全。\n\n## 环境配置\n为了编写和运行 Java 程序，你需要一个编辑器和\
  \ Java 编译器。Java 随 `JDK`（Java 开发工具包）提供。你甚至可以使用像记事本这样的基础编辑器。不过，也有更高级的 Java 编辑器，例如\
  \ `Eclipse` 和 `Netbeans`。\n\n首先，在你的电脑上下载并安装 `JDK`。之后，你将拥有 Java。打开浏览器并输入或粘贴以下 URL：\n\
  \n[`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2153751.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2153751.html)\n\
  \n从那里你可以获取最新版本的 `JDK`。你需要设置环境变量以告知正确的 Java 安装目录。这意味着你需要设置 `path` 变量。通常安装路径是 `C:\\\
  Program Files\\java\\jdk`。在 Windows 上正确设置路径的方法是：“我的电脑”，选择“属性”，打开“高级系统设置”，然后选择“环境变量”。添加\
  \ `C:\\Program Files\\java\\jdk\\bin` 路径。Linux 用户请阅读你的 shell 文档。\n\n## Java 语法\n\
  Java 程序由通过相互调用方法的对象组成。以下是 Java 程序中的主要构造部分：\n\n- **对象**：对象以状态和行为为特征。例如，猫有颜色、品种名称等状态，以及吃、喵喵和摇尾巴等行为。\n\
  - **类**：这是描述对象支持的状态/行为的蓝图/模板。\n- **方法**：方法是一种行为。逻辑写在方法中，并且可以用于数据处理。\n\n## 第一个程序\n\
  这是我们的第一个 Java 程序。执行后它应该打印出“Hello World”：\n\n```java\npublic class OurFirstProgram{\n\
  \    public static void main(String args[]){\n        System.out.println(\"Hello\
  \ World\");\n    }\n}\n```\n\n\n\n\n\n打开你的文本编辑器（如 `Notepad`），创建一个名为 `FirstProgram.java`\
  \ 的新文件。保存该文件。`.java` 扩展名将文件标记为 Java 文件。在文件中输入上述程序代码并保存更改。打开命令提示符，然后导航到你保存文件的目录。在该目录下运行给出的命令：\n\
  \n```\njavac FirstProgram.java\njava FirstProgram\n```\n\n在我的情况下，我将文件保存在桌面上。我按照如下方式执行了命令：\n\
  \n![](img/00001.gif)\n\n程序输出“Hello World”作为结果。在命令 `javac FirstProgram.java` 中，我们正在调用\
  \ Java 编译器（`javac`）来编译程序。命令在提示符上没有返回任何内容，因为程序没有错误，也没有生成警告。该命令在目录中生成了一个 `.class`\
  \ 文件（`FirstProgram.class`）；请确认。在命令 `java FirstProgram` 中，我们只是在运行该程序以获取结果。\n\n考虑从代码中提取的以下行：\n\
  \n```java\npublic class FirstProgram{\n```\n\n该行简单地声明了一个名为 `FirstProgram` 的类。Java\
  \ 是一种区分大小写的语言，因此该类必须始终按照上面写的方式来引用。`public` 关键字将该类声明为公有，这意味着它可以从相同包内的任何其他类进行访问。`{`\
  \ 声明了类体的开始，它应该由 `}` 关闭。\n\n注意：编写程序时的文件名应与类名匹配；否则，在运行程序时会遇到麻烦。在我们的案例中，类名为 `FirstProgram`，因此文件名应该是\
  \ `FirstProgram.java`。\n\n考虑从代码中提取的以下行：\n\n```java\npublic static void main(String\
  \ args[]){\n```\n\n这是 `main` 方法。没有这个方法，Java 程序将无法被执行或运行。考虑从代码中提取的以下行：\n\n```java\n\
  System.out.println(\"Hello World\");\n```\n\n我们只是在调用或使用 `println` 方法，在命令提示符的终端上打印文本\
  \ Hello World。\n\n最后，我们有两个闭合的大括号，`}}`。第一个关闭 `main` 方法的左大括号，第二个关闭类的左大括号。\n\n# 第 2\
  \ 章：Java 变量\n\n变量变量可以被视为一个容器，在程序的生命周期内负责持有一个值。每个变量都有特定的数据类型，规定了它可以持有的值类型。使用 Java\
  \ 变量有两个步骤，即变量声明和变量初始化。\n\n## 变量声明\n\n变量声明涉及为它提供一个名称并指定其数据类型。以下是有效的变量声明示例：\n\n```\n\
  int x,j,z;\nfloat pi;\ndouble a;\nchar c;\n```\n\n`int`、`float`、`double` 和 `char`\
  \ 是数据类型，规定了每个变量可以或应该持有的值类型。要在一行中声明多个变量，请使用逗号（`,`）将它们分开，如第一个示例所示。变量声明应以分号（`;`）结束。\n\
  \n## 变量初始化\n\n变量初始化涉及为其分配一个有效值。赋值给变量的值取决于变量的数据类型。以下是有效的变量初始化示例。\n\n```\npi =3.14f;\n\
  a =20.22778765;\nc='v';\n```\n\n变量的声明和初始化可以同时完成，如下所示：\n\n```\nint x=1,z=4,y=5;\n\
  float pi=3.14f;\ndouble d=19.12d;\nchar c='v';\n```\n\n## 变量类型\n\nJava 支持三种变量类型：\n\
  \n1. 局部变量\n2. 静态变量\n3. 实例变量\n\n## 局部变量\n\n这些是在方法体内部声明的变量。它们只能在该方法内部被访问。\n\n## 实例变量\n\
  \n这些是在没有使用 `STATIC` 关键字定义的变量。这些变量属于特定的对象。\n\n## 静态变量\n\n这些是在程序执行开始时初始化一次的变量。你应该在实例化变量之前初始化它们。\n\
  \n以下示例演示了 Java 变量的不同类型：\n\n```java\nclass JavaVariables {\n    int i = 10; //一个实例变量\
  \ \n    static int b = 2; //一个静态变量 \n    void methodExample() {\n        int c =\
  \ 3; //一个局部变量 \n    }\n}\n```\n\n整数变量 `b` 是静态变量，因为它使用 `static` 关键字定义。变量 `int c`\
  \ 在 `methodExample` 方法内部声明，使其成为一个局部变量。它只能在该方法内部被访问。\n\n## 数据类型\n\n在 Java 中，数据类型可以是基本类型或非基本类型。\n\
  \n### 基本数据类型\n\n这些是 Java 提供的预定义数据类型。共有 8 个，包括 `byte`、`short`、`long`、`char`、`int`、`float`、`Boolean`\
  \ 和 `double` 数据类型。\n\n### 非基本数据类型\n\n这些通过定义的类构造函数定义。它们帮助程序员访问对象。\n\n提供的示例演示了变量的使用：\n\
  \n```java\npublic class VariableAddition{ \n    public static void main(String[]\
  \ args){ \n        int ax=5; \n        int jk=12; \n        int z=ax+jk; \n    \
  \    System.out.println(z); \n    }\n} \n```\n\n我们定义了三个整数变量 `ax`、`jk` 和 `z`。`x`、`j`\
  \ 和 `z` 的值（此处应指 ax,jk,z）已定义。`ax`、`jk` 和 `z` 的值被使用。`System.out.println(z)` 输出结果。\n\
  \n# 第 3 章：Java 运算符\n\n运算符是用于操作的符号。例如，`+` 符号用于算术操作。\n\n## 一元运算符\n\n这是取一个操作数的运算符。它们增加/减少一个值。它们包括\
  \ `++`（增一）和 `--`（减一）。示例：\n\n```java\nclass UnaryExample{\n    public static void\
  \ main(String[] args){\n        int j=0; \n        System.out.println(j++); \n \
  \       System.out.println(++j); \n        System.out.println(j--); \n        System.out.println(--j);\
  \ \n    }\n}\n```\n\n程序将打印 0、2、1、0。`++` 表示在执行增加之前读取 `j` 的值，因此我们得到的 `j` 的值为 0。如果是\
  \ `++j`，我们将得到第一个值为 1。\n\n## 算术运算符\n\n这些运算符用于执行算术操作，如乘法、加法、除法等。它们作为算术运算符使用。示例：\n\n\
  ```java\npublic class JavaArithmeticOperators{\n    public static void main(String[]\
  \ args){ \n        int x=0; \n        int y=10; \n        System.out.println(x+y);\
  \ \n        System.out.println(x-y); \n        System.out.println(x*y); \n     \
  \   System.out.println(x/y); \n        System.out.println(x%7); \n    }\n}\n```\n\
  \n唯一看起来陌生的运算符是 `%`（模运算），它返回除法的余数。\n\n## 逻辑运算符\n\n这些运算符与布尔值一起使用。它们有助于评估循环和条件语句中的条件。它们包括\
  \ `||`、`&&`、`!`。假设有两个布尔变量 `a1` 和 `a2`，适用以下条件：\n\n`a1&&a2` 在 `a1` 和 `a2` 都为真时返回真，否则返回假。\n\
  \n`a1||a2` 在 `a1` 和 `a2` 都为假时返回假，否则返回真。\n\n\n\n\n`!a1` 将返回 `a1` 的反值。\n\n示例：\n```java\n\
  public class LogicalOperatorExample {\n  public static void main(String args[])\
  \ {\n      boolean a1 = true;\n      boolean a2 = false;\n      System.out.println(\"\
  a1 && a2: \" + (a1&&a2));\n      System.out.println(\"a1 || a2: \" + (a1||a2));\n\
  \      System.out.println(\"!(a1 && a2): \" + !(a1&&a2));\n  }\n}\n```\n程序将返回 false,\
  \ true, true。\n\n## 比较运算符\n\nJava 支持 6 种比较运算符，`==`、`!=`、 `<`, `>`, `>=`, `<=`：\n\
  \n- `==` 如果左侧和右侧都相等，则返回 `true`。\n- `!=` 如果运算符的左右两边不相等，则返回 `true`。\n- `>` 如果左侧大于右侧，则返回\
  \ `true`。\n- `<` 如果左侧小于右侧，则返回 `true`。\n- `>=` 如果左侧大于或等于右侧，则返回 `true`。\n- `<=` 如果左侧小于右侧，则返回\
  \ `true`。\n\n示例：\n```java\npublic class JavaRelationalOperatorExample {\n  public\
  \ static void main(String args[]) {\n      int n1 = 20;\n      int n2 = 30;\n  \
  \    if (n1==n2) {\nSystem.out.println(\"n1 and n2 are equal\");\n      }\n    \
  \  else{\nSystem.out.println(\"n1 and n2 aren’t equal\");\n      }\n      if( n1\
  \ != n2 ){\nSystem.out.println(\"n1 and n2 aren’t equal\");\n      }\n      else{\n\
  System.out.println(\"n1 and n2 are equal\");\n      }\n      if( n1 > n2 ){\nSystem.out.println(\"\
  n1 is greater than n2\");\n      }\n      else{\nSystem.out.println(\"n1 isn’t greater\
  \ than n2\");\n      }\n      if( n1 >= n2 ){\nSystem.out.println(\"n1 is equal\
  \ to or greater than n2\");\n      }\n      else{\nSystem.out.println(\"n1 is less\
  \ than n2\");\n      }\n      if( n1 < n2 ){\nSystem.out.println(\"n1 is less than\
  \ n2\");\n      }\n      else{\nSystem.out.println(\"n1 isn’t less than n2\");\n\
  \      }\n      if( n1 <= n2){\nSystem.out.println(\"n1 is equal to or less than\
  \ n2\");\n      }\n      else{\nSystem.out.println(\"n1 is greater than n2\");\n\
  \      }\n  }\n}\n```\n程序使用了在后续章节中讨论的 `if` 语句。\n\n# 第 4 章：Java 数组\n\n数组是用于存储相同类型元素的存储结构。数组具有固定大小，定义后无法增加大小。数组中的第一个元素位于索引\
  \ 0。\n\n## 单维数组\n\n这些是元素线性存储的数组。数组的声明采用下所示语法：\n\n`<elementDataType>[] <arrayName>;`\n\
  \n另一种语法：\n\n`<elementDataType> <arrayName>[];`\n\n示例：\n```java\nint arrayExample[];\n\
  int []arrayExample;\n```\n\n数组可以如下所示进行初始化：\n\n`arrayExample[0]=1;`\n\n该行表示元素 1 应存储在数组的索引\
  \ 0 处。数组也可以同时声明并初始化，如下：\n\n`int arrayExample[] = {5, 20, 35, 43};`\n\n值 5 将存储在数组的索引\
  \ 0，20 存储在索引 1，依此类推。\n\n示例：\n```java\npublic class JavaArrayExample{\n    public\
  \ static void main(String args[]){\n      int array1[] = new int[8];\n      for\
  \ (int c=0;c<8;c++){\n          array1[c]=c+1;\n      }\n      for (int c=0;c<8;c++){\n\
  \          System.out.println(\"array1[\"+c+\"] = \"+array1[c]);\n      }\n    \
  \  System.out.println(\"The Array Length  =  \"+array1.length);\n      }\n}\n```\n\
  数组将打印位于不同索引处的元素。你还将获得数组长度，即 8。\n\n## 多维数组\n\n这些可以被视为其他数组的数组。在多维数组声明中，只需添加另一组方括号来定义另一个索引。示例：\n\
  \n`int array2[ ][ ] = new int[6][10] ;`\n\n你有权控制多维数组的长度。示例：\n```java\npublic class\
  \ JavaArrayExample2 {\npublic static void main(String[] args) {\n// 创建一个二维数组。\n\
  \  int[][] array2 = new int[6][8];\n  // 仅赋值元素\n  array2[0][0] = 2;\n  array2[1][1]\
  \ = 2;\n  array2[3][2] = 1;\n  System.out.print(array2[0][0] + \" \");\n}\n```\n\
  程序将返回存储在索引 [0][0] 处的值，即 2。\n\n# 第 5 章：决策\n\n在 Java 中，决策帮助我们评估条件。\n\n## if 语句\n\n\
  该语句帮助我们根据条件的结果执行语句。其语法如下：\n\n`if(boolean expression) {`\n`// statements`\n`}`\n\n\
  如果 `if` 语句中的条件为尔，则执行执行体内的语句。\n\n## if...else 语句\n\n该语句将 `if` 与 `else` 结合，如果条件为假，则执行\
  \ `else` 部分。语法如下：\n\n`if(boolean expression) {`\n`// statements`\n`}else {`\n`//\
  \ statements`\n`}`\n\n示例：\n```java\npublic class JavaElseStatement {\n  public static\
  \ void main(String args[]) {\n      int marks = 20;\n      if( marks < 50 ) {\n\
  \          System.out.println(\"The marks is below\");\n      }\n  }\n}\n```\n如果条件为真，则执行语句。\n\
  \n## if...else if...else 语句\n\n如果你有多个条件需要评估，使用此语句。语法如下：\n\n`if(boolean expression\
  \ a) {`\n`// statements`\n`}else if(boolean expression b) {`\n`// statements`\n\
  `}else if(boolean expression c) {`\n`// statements`\n`}else {`\n`// statements`\n\
  `}`\n\n示例：\n```java\npublic class JavaIfElseStatement {\n  public static void main(String\
  \ args[]) {\n      int marks = 20;\n      if( marks == 10 ) {\n          System.out.println(\"\
  Marks is 10\");\n      }else if( marks == 20 ) {\n          System.out.println(\"\
  Marks is 20\");\n      }else if( marks == 30 ) {\n          System.out.println(\"\
  Marks is 30\");\n      }else {\n          System.out.println(\"None of the above\"\
  );\n      }\n  }\n}\n```\n程序的结果将是 20。\n\n## 嵌套 if\n\n`if...else` 语句可以嵌套，这意味着你可以在另一个\
  \ `if` 中使用 `if` 或在另一个 `if...else` 中使用 `if...else`。嵌套语法所示：\n\n`if(boolean expression\
  \ a) {`\n`// statements`\n`if(boolean expression b) {`\n`// statements`\n`}`\n}`\n\
  \n示例：\n```java\npublic class NestingExample {\n  public static void main(String\
  \ args[]) {\n      int ab = 10;\n      int xy = 30;\n      if( ab == 10 ) {\n  \
  \        if( xy == 30 ) {\n              System.out.print(\"The value of ab is 10\
  \ and xy is 30\");\n          }\n      }\n  }\n}\n```\n\n## switch 语句\n\n该语句允许我们对某个变量与某些值列表进行等性测试。每个值都被称为\
  \ `case`。使用的语法如下：\n\n`switch(an_expression) {`\n`case value:`\n`// statements`\n\
  `break; //optional`\n`case value:`\n`// statements`\n`break; //optional`\n`default\
  \ : //Optional`\n`// statements`\n`}`\n\n\n\n\n```java\npublic class JavaSwitchStatement\
  \ {\n\n  public static void main(String args[]) {\n      char student_grade = 'B';\n\
  \      switch(student_grade) {\n        case 'A':\n          System.out.println(\"\
  That is Excellent!\");\n          break;\n        case 'B':\n          System.out.println(\"\
  That is Good!\");\n          break;\n        case 'C':\n          System.out.println(\"\
  That is Fair!\");\n          break;\n        case 'D':\n          System.out.println(\"\
  That is Poor!\");\n        case 'F':\n          System.out.println(\"You Failed!\"\
  );\n          break;\n        default:\n          System.out.println(\"Unknown grade\"\
  );\n      }\n      System.out.println(\"The student got grade \" + student_grade);\n\
  \  }\n}\n```\n\n等级为 B 的情况将为真，因此你将收到 \"Good\" 的消息。之后，程序将执行最后一个 `println` 语句，因此 `student_grade`\
  \ 的值将被打印出来。\n\n# 第 6 章：循环\n\nJava 循环帮助我们重复执行某些任务。循环按顺序执行语句。首先运行第一个，紧接着是第二个，以此此类推。让我们讨论一下\
  \ Java 循环：\n\n## for 循环\n\n只要条件求值为真，循环就会运行。如果条件变为假，执行将立即停止。语法如下：\n\n`for(initialization;\
  \ loop_condition ; Increment/decrement_part)`\n\n{\n  the_statement(s);\n}\n\n`initialization`\
  \ 定义了循环条件的初始值。`loop_condition` 指定了循环运行所需的必须始终为真的条件。`loop_increment/decrement` 定义了每次迭代后初始化值所增加或减少的量。示例下：\n\
  \n```java\npublic class ForLoopDemo {\n    public static void main(String args[]){\n\
  \        for(int ix=0; ix<10; ix++){\n            System.out.println(\"The ix value\
  \ is currently: \"+ix);\n        }\n    }\n}\n```\n\n程序将打印从 0 到 9 的 `ix` 值。当循环将\
  \ 9 递增到 10 时，它会发现这违反了循环条件（即 `ix<10`），因此执行将立即停止。\n\n## while 循环\n\n只要指定的条件为真，此循环就会执行语句。首先求值条件，如果为真，则执行循环语句。如果条件变为假，控制将跳转去执行循环之后的语句。建议你在循环中添加一个递增/递减操作和一个测试条件，以便循环在条件变为假时停止执行。否则，循环可能会无限运行。语法下所示：\n\
  \n`while(A_boolean_expression) {\n  // Statement(s)\n}`\n\n示例：\n\n```java\npublic\
  \ class JavaWhileLoop {\n  public static void main(String args[]) {\n      int xy\
  \ = 20;\n      while( xy < 25 ) {\n          System.out.print(\"The value of xy\
  \ is: \" + xy );\n          xy++;\n          System.out.print(\"\\n\");\n      }\n\
  \  }\n}\n```\n\n程序打印从 20 到 24 的 `xy` 值。变量的初始值为 20。测试条件检查该值是否小于 25，结果为真。这意味着循环将运行。当它达到\
  \ 24 时，它会检查并发现 `xy` 的值为 25。循环的执行随后立即停止，因为继续执行将违反循环条件。\n\n## do…while 循环\n\n这与 while\
  \ 循环密切相关。在 `while` 中，循环条件的执行是在循环体执行之前完成的。在 `do…while` 循环中相反，体在条件之前先执行。在 `while`\
  \ 循环中，循环体可能永远不会执行，但在 `do…while` 循环中，循环体必须执行一次。语法如下：\n\n`do\n{\n  Statement or statements;\n\
  } while(loop_condition);`\n\n示例：\n\n```java\npublic class JavaDoWhileLoopExample\
  \ {\n  public static void main(String args[]) {\n      int xy = 20;\n      do {\n\
  \          System.out.print(\"The value of xy is: \" + xy );\n          xy++;\n\
  \          System.out.print(\"\\n\");\n      }while( xy < 25 );\n  }\n}\n```\n\n\
  代码将像上一个循环一样打印从 20 到 24 的 `xy` 值。这是因为条件为真，即 20 小于 25。假设我们将循环条件设置为假，例如如所示将 `xy` 的值初始化为\
  \ 30：\n\n```java\npublic class DoLoopExample {\n  public static void main(String\
  \ args[]) {\n      int xy = 30;\n      do {\n          System.out.print(\"The value\
  \ of xy is: \" + xy );\n          xy++;\n          System.out.print(\"\\n\");\n\
  \      }while( xy < 25 );\n  }\n}\n```\n\n运行上述程序后，你将获得输出“value of xy is: 30”。这意味着\
  \ while 条件为假。这是因为 Java 编译器首先运行程序以获取 `xy` 的初始值（即 30）。一旦它移动到条件处，就会发现自己违反了条件（即 `xy<25`），因此循环停止。\n\
  \n有两个语句用于控制 Java 循环的执行，分别是 `continue` 和 `break` 语句。它们通过改变循环的执行方式来工作。让我们讨论它们。\n\n\
  ## break 语句\n\n此语句会导致循环停止，并跳转到循环之后的语句。它用于 `switch` 语句中的情况。语法下：\n\n`jump-statement;\n\
  break;`\n\n示例：\n\n```java\npublic class JavaBreakExample {\n  static void main(String[]\
  \ args) {\n    for(int ix=0; ix<=10; ix++){\n      if(ix==6){\n        break;\n\
  \      }\n      System.out.println(ix);\n    }\n  }\n}\n```\n\n程序将打印 0 到 5。这是因为程序中的后续部分：`if(ix==6){\
  \ break;}`。递增从 0 执行到 5，一旦发现 `ix` 的值为 6，它将立即停止。对于嵌套循环的情况，可以将 `break` 添加到内部循环中，它将打破内部循环。这会在满足特定条件时导致内部循环停止。示例：\n\
  \n```java\npublic class Break2 {\n  public static main(String[] args) {\n    for(int\
  \ ix=1; ix<=5; ix++){\n      for(int jk=1; jk<=5; jk++){\n        if(ix==3&&jk==3){\n\
  \          break;\n        }\n        System.out.println(ix+\" \"+jk);\n      }\n\
  \    }\n  }\n}\n```\n\n## continue 语句\n\n此语句使循环立即跳转到下一次迭代。它帮助循环在跳转后继续。注意在之前的情况下，循环立即停止了。此语句可以帮助它在跳转后的下一次迭代中恢复执行。示例：\n\
  \n`your_jump-statement;\ncontinue;`\n\n示例：\n\n```java\npublic class ContinueStatamentExample\
  \ {\n  static main(String[] args) {\n    for(int ix=1; ix<=10; ix++){\n      if(ix==5){\n\
  \        continue;\n      }\n      System.out.println(ix);\n    }\n  }\n}\n```\n\
  \n代码不会打印 5，但将打印从 1 到 10 的所有数字。`continue` 语句也可以用于内部循环。在这种情况下，它只会继续你的内部循环。示例：\n\n\
  ```java\npublic class ContinueStatament2 {\n  static main(String[] args) {\n   \
  \ for(int ix=1; ix<=3; ix++){\n      for(int jk=1; jk<=3; jk++){\n        if(ix==2&&jk==2){\n\
  \          continue;\n        }\n        System.out.println(ix+\" \"+jk);\n    \
  \  }\n    }\n  }\n}\n```\n\n\n\n\n在继承中，一个对象获取另一个对象的行为和属性。获取行为和属性的对象是子类，而它们继承自的对象是父类。它们也可以分别称为子类和超类。继承使得信息能够以分层级的顺序进行管理。在父类中定义的方法可以在子类中重用，而无需再次定义。\n\
  \n要继承一个父类，我们使用 `extends` 关键字。继承通过下面的语法完成：\n\n```java\nclass Child-class-name extends\
  \ Parent-class-name {\n    // fields and methods\n}\n```\n\n`extends` 关键字表示我们正在从一个现有的类创建一个新类。示例：\n\
  \n```java\nclass CompanyEmployee{\n    float employee_salary=40000;\n}\n\npublic\
  \ class JavaProgrammer extends CompanyEmployee{\n    int bonus=10000;\n    public\
  \ static void main(String args[]){\n        JavaProgrammer p=new JavaProgrammer();\n\
  \        System.out.println(\"Programmer salary is:\"+p.salary);\n        System.out.println(\"\
  Bonus of Programmer is:\"+p.bonus);\n    }\n}\n```\n\n有不同的继承类型：\n\n## 单级继承\n\n在这种情况下，一个类继承自另一个类。之前提供的\
  \ `Worker` 和 `DBA` 类就是这种类型的示例。示例：\n\n```java\nclass Mammal{\n    void drink(){\n\
  \        System.out.println(\"Drinking...\");\n    }\n}\n\nclass Cow extends Mammal{\n\
  \    void moow(){System.out.println(\"Moowing...\");}\n}\n\npublic class JavaInheritanceTest{\n\
  \    public static void main(String args[]){\n        Cow c=new Cow();\n       \
  \ c.moow();\n        c.drink();\n    }\n}\n```\n\n在上面的示例中，`drink()` 方法在 `Mammal`\
  \ 类中定义，而 `moow()` 方法在 `Cow` 类中定义，`Cow` 类继承了 `Mammal` 类。在 `InheritanceTest` 类中，我们创建了一个\
  \ `Cow` 类的实例并命名为 `c`。然后我们使用该实例来访问在两个不同类中定义的方法。这就是单继承的工作方式。\n\n## 多级继承\n\n当类 `B`\
  \ 继承自类 `A`，而类 `C` 继承自类 `B` 时，发生这种继承。示例：\n\n```java\nclass Mammal{\n    void drink(){\n\
  \        System.out.println(\"Drinking...\");\n    }\n}\n\nclass Cow extends Mammal{\n\
  \    void moow(){\n        System.out.println(\"Moowing...\");\n    }\n}\n\nclass\
  \ BabyCow extends Cow{\n    void jump(){\n        System.out.println(\"Jumping...\"\
  );\n    }\n}\n\npublic class JavaInheritanceTest2{\n    public static void main(String\
  \ args[]){\n        BabyCow bc=new BabyCow();\n        bc.moow();\n        bc.jump();\n\
  \        bc.drink();\n    }\n}\n```\n\n`drink()` 方法在 `Mammal` 类中定义。`moow()` 方法在\
  \ `Cow` 类中定义，`Cow` 类继承了 `Mammal` 类。`jump` 方法在 `BabyCow` 类中定义，`BabyCow` 类继承了 `Cow`\
  \ 类。在 `InheritanceTest2` 类中，我们创建了一个名为 `bc` 的 `BabyCow` 类实例。该实例随后被用于访问各种属性或方法。我们能够使用\
  \ `BabyCow` 类的实例来访问在 `Cow` 和 `Mammal` 类中定义的方法。各种类中的方法可以视为它们的属性。\n\n## 层级继承\n\n这种继承可以通过像示例所示所示：\n\
  \n```java\nclass Mammal{\n    void drink(){\n        System.out.println(\"Drinking...\"\
  );\n    }\n}\n\nclass Cow extends Mammal{\n    void moow(){\n        System.out.println(\"\
  Moowing...\");\n    }\n}\n\nclass Goat extends Mammal{\n    void meew(){\n     \
  \   System.out.println(\"Meewing...\");\n    }\n}\n\npublic class JavaInheritanceTest3{\n\
  \    public static void main(String args[]){\n        Goat g=new Goat();\n     \
  \   g.meew();\n        g.drink();\n        //g.moow(); will give an Error\n    }\n\
  }\n```\n\n在 `InheritanceTest3` 类中创建 `Goat` 类的实例后，我们能够继承 `Mammal` 类中定义的属性。然而，我们无法访问\
  \ `Cow` 类中定义的属性，因为 `Goat` 类没有继承自 `Cow` 类。如果我们尝试这样做，例如运行 `g.moow();`，将会得到错误。\n\n\
  某些语言支持多继承，即一个类继承自两个类。Java 不支持这种特性，我们能接近此点的做法是创建一个接口，然后在接口上使用 `implements`。假设我们创建了一个名为\
  \ `Interface1` 的接口，然后我们可以创建一个名为 `Class2` 的类，它继承了 `Class1` 并实现了 `Interface1`：\n\n\
  ```java\npublic class Class2 extends Class1 implements Interface1{\n```\n\n这是我们在\
  \ Java 中能实现的最接近多继承的特性。对于类，我们使用 `extends` 关键字，但这不能用于接口。相反，我们使用 `implements` 关键字。这样，我们就可以继承接口的功能。继承有助于属性和方法的重用。\n\
  \n# 第 8 章：重写 (overriding)\n\n子类可以重写父类中定义的方法，如果该方法没有用 `final` 关键字声明。重写简单意味着对现有方法的功能的重写。示例：\n\
  \n```java\nclass Mammal {\n    public void drink() {\n        System.out.println(\"\
  Mammals can drink\");\n    }\n}\n\nclass Cow extends Mammal {\n    public void drink()\
  \ {\n        System.out.println(\"Cows can drink and eat\");\n    }\n}\n\npublic\
  \ class TestOverriding {\n    public static void main(String args[]) {\n       \
  \ Mammal a = new Mammal(); // mammal reference and object\n        a.drink(); //\
  \ to execute method in Mammal class\n        Mammal b = new Cow(); // mammal reference\
  \ but Cow object\n        b.drink(); // to execute method in Cow class\n    }\n\
  }\n```\n\n在这种情况下，`b` 是 `Mammal` 类型，但可以使用 `Cow` 类定义的方法。示例 2：给出一个银行示例。不同的银行对贷款提供不同的利率：\n\
  \n```java\nclass Banks{\n    int getRat(){\n        return 0;\n    }\n}\n\nclass\
  \ Bank1 extends Banks{\n    int getRat(){\n        return 5;\n    }\n}\n\nclass\
  \ Bank2 extends Banks{\n    int getRat(){\n        return 7;\n    }\n}\n\nclass\
  \ Bank3 extends Banks{\n    int getRat(){\n        return 9;\n    }\n}\n\npublic\
  \ class TestBanks{\n    public static void main(String args[]){\n        Bank1 b1=new\
  \ Bank1();\n        Bank2 b2=new Bank2();\n        Bank3 b3=new Bank3();\n     \
  \   System.out.println(\"Bank1 Interest Rate: \"+b1.getRat());\n        System.out.println(\"\
  Bank1 Interest Rate: \"+b2.getRat());\n        System.out.println(\"Bank1 Interest\
  \ Rate: \"+b3.getRat());\n    }\n}\n```\n\n方法在不同的类中有不同的使用方式。\n\n## super 关键字\n\n\
  我们使用 `super` 关键字来访问父类中被重写的方法。示例：\n\n```java\nclass Mammals {\n    public void drink()\
  \ {\n        System.out.println(\"Mammals can drink\");\n    }\n}\n\nclass Cow extends\
  \ Mammals {\n    public void drink() {\n        super.drink(); // to invoke method\
  \ in super class\n        System.out.println(\"Cows can drink and eat\");\n    }\n\
  }\n\npublic class TestCow {\n    public static void main(String args[]) {\n    \
  \    Mammal c = new Cow(); // mammal reference but Cow object\n        c.drink();\
  \ // to execute method in Cow class\n    }\n}\n```\n\n# 第 9 章：多态 (Polymorphism)\n\
  \n这一特性允许我们通过不同的方式执行操作。通过多态，一个对象可以采取不同的形式。示例：\n\n```java\npublic interface Animals{}\n\
  \npublic class Mammals{}\n\npublic class Cow extends Animals implements Mammals{\n\
  \n}\n```\n\n上面的 `Cow` 类拥有许多继承，使其具有多态性。这些引用可以从上面生成：\n\n```java\nCow c = new Cow();\n\
  \nMammals m = c;\n\nAnimals an = c;\n\nObject ob = c;\n```\n\n\n\n上述所有引用变量都指向同一个对象。所有变量都指向同一个对象。\n\
  \n示例：\n\n```java\nclass Cars{ \n  void consume(){\n      System.out.println(\"Cars\
  \ consume fuel\");\n  } \n} \n\npublic class Mercedez extends Cars{ \n  void consume(){\n\
  \      System.out.println(\"Mercedez consumes petrol\");\n  } \n  public static\
  \ void main(String args[]){ \n    Cars cr = new Mercedez();//upcasting \n    cr.consume();\
  \ \n  } \n}\n```\n\n对覆盖方法的调用在运行时已解析。这就是运行时多态。被重写的方法通过父类的引用变量被调用。\n\n通过多态，可以通过不同的方式执行操作。如果你有一个带有\
  \ `sound()` 方法的 `Mammals` 类，那么该方法的实现对于 `Goat`、`Cow`、`Donkey` 等不同动物类将是不同的。你会得到 `meow`、`moow`\
  \ 等。示例：\n\n```java\npublic class Animals{\n  public void makeSound(){\n      System.out.println(\"\
  Animals make sound\");  \n  }\n}\n```\n\n我们可以有一个会喵喵的 `Cats` 类，并继承 `Animals` 类：\n\
  \n```java\nClass Cats extends Animals{\n  @Override\n  public void makeSound(){\n\
  \      System.out.println(\"Meow\");\n  }\n  public static void main(String args[]){\n\
  \ Animals anim = new Cats();\n anim.makeSound();\n  }\n}\n```\n\n我们可以有一个继承 `Animals`\
  \ 类的 `Cows` 类，如下：\n\n```java\nClass Cows extends Animals{\n  @Override\n  public\
  \ void makeSound(){\n      System.out.println(\"Moow\");\n  }\n  public static void\
  \ main(String args[]){\n Animals anim = new Cows();\n anim.makeSound();\n  }\n}\n\
  ```\n\n我们通过方法重载实现了编译时多态。示例：\n\n```java\nclass Class1\n{\n  void demoMethod (int\
  \ ab)\n  {\n      System.out.println (\"ab: \" + ab);\n  }\n  void demoMethod (int\
  \ ab, int bc)\n  {\n      System.out.println (\"ab and bc: \" + ab + \",\" + bc);\n\
  \  }\n  double demoMethod(double ab) {\n      System.out.println(\"double ab: \"\
  \ + ab);\n      return ab*ab;\n  }\n}\n\npublic class Class2\n{\n  public static\
  \ void main (String args [])\n  {\n      Class1 cs1 = new Class1();\n      double\
  \ res;\n      cs1 .demoMethod(5);\n      cs1 .demoMethod(5, 10);\n      res = cs1\
  \ .demoMethod(10.5);\n      System.out.println(\"Finally : \" + res);\n  }\n}\n\
  ```\n\n`demoMethod()` 被重载了 3 次。它有一个 `int` 参数、两个 `int` 参数和一个 `double` 参数。在这种情况下，将要调用的方法取决于调用时传递的参数。这是在函数调用期间完成的，因此我们拥有了编译时多态。\n\
  \n# 第 10 章：抽象\n\n这一特性使开发人员只向用户展示必要的内容，并向用户隐藏其余部分。开发者可以区分哪些需要展示给用户，哪些不需要。当开车时，你按下加速板，车速就会增加；你按下刹车，汽车就会停止。司机并不知道汽车内部发生了什么，但工程师设计了汽车，向用户展示了刹车、加速板、手刹等（用户必要的部分），并隐藏了实现细节。在发送邮件时，你只需要输入内容、添加文档并点击“发送”按钮，而无需知道背后发生了什么。这就是抽象。\n\
  \n通过抽象，用户无法感知到实现细节。开发者隐藏了它们。用户只获得应用程序的功能。也就是说，用户获得的是关于应用程序“做什么”的信息，而不是“如何做”。抽象类具有\
  \ `abstract` 关键字。如果任何类具有抽象方法，则它必须被声明为抽象类。抽象类也必须继承自另一个抽象类。示例：\n\n```java\nabstract\
  \ class cars {\n  abstract void consume();\n}\n\npublic class Mercedez extends cars\
  \ {\n  void consume() {\n   System.out.println(\"Mercedez consumes petrol\")\n \
  \ }\n  public static void main(String argu[]) {\n  cars cr = new Mercedez();\n \
  \ cr.consume();\n  System.out.println(\"Done\")\n}\n```\n\n抽象类必须包含抽象方法是必须。你不能实例化抽象类。这就是为什么我们实例化\
  \ `Mercedez` 类，因为它拥有一个自抽象类的方法。示例：\n\n```java\npublic abstract class Worker {\n \
  \ private String workerName;\n  private String workerAddress;\n  private int workerNumber;\n\
