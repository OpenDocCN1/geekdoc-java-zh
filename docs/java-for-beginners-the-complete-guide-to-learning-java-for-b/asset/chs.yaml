  \    personName = newPersonName;\n  }\n\n  public void setPersonID( String newPersonID)\
  \ {\n      personID = newPersonID;\n  }\n}\n```\n\n任何需要访问私有变量的类必须使用 `public` 方法，即\
  \ setter 和 getter。我们可以按照如下方式访问：\n\n```java\npublic class Class3Test {\n  public\
  \ static void main(String args[]) {\n      Class3Test cs3 = new Class3Test();\n\
  \      cs3.setPerName(\"John\");\n      cs3.setPersonAge(26);\n      cs3.setPersonID(\"\
  3452673\");\n      System.out.print(\"Name : \" + cs3.getPersonName() + \" Age :\
  \ \" + cs3.getPersonAge());\n  }\n}\n```\n\n# 第 12 章 接口\n\n接口指的是类的蓝图以及它的抽象方法和静态常量。接口提供了一种实现抽象的机制。接口只能有抽象方法，而没有方法体。它有利于实现多继承。它与类相似，但只有抽象方法。类必须实现接口才能使用它的方法。除了抽象方法外，它还可以拥有常量、静态方法、默认方法、嵌套类型等。\n\
  \n接口拥有可以由类实现的方法。类要实现接口方法，它必须是抽象的。否则，所有接口方法必须在类中定义。接口不能被实例化。它也不能有构造函数。它所有的字段必须是 `final`\
  \ 或 `static`，而不能是字段。\n\n要声明接口，我们使用 `interface` 关键字。语法：\n\n```java\ninterface <interfaceName>{\
  \  \n  // 常量字段  \n  // 抽象方法   \n}  \n```\n\n接口隐式是抽象的，因此在声明时不要添加 `abstract` 关键字。方法隐式是抽象的，因此在声明时不使用\
  \ `abstract` 关键字。它们隐式为 `public`。示例：\n\n```java\ninterface Mammal {\n  public void\
  \ drink();\n  public void makeSound();\n}\n```\n\n接口可以被类实现：\n\n```java\ninterface\
  \ Mammal{\n  public void drink();\n}\n\nclass Cow implements Mammal{\n  public void\
  \ drink(){\n      System.out.println(\"An Interface Method already Implemented\"\
  );\n  }\n  public static void main(String args[]){\n      Mammal mm = new Cow();\n\
  \      mm.drink();\n  }\n}\n```\n\n我们创建了接口 `Mammal`，它被 `Cow` 类实现。它的 `drink()` 方法已\
  \ `Cow` 类中使用。\n\n对于两个接口，一个接口可以通过 `extends` 关键字扩展另一个接口。子接口（子）将继承父接口（父）的方法。示例：\n\n\
  ```java\ninterface Toyotas {\n  public void setPrice(String car);\n  public void\
  \ setCC(String cc);\n}\n\ninterface Premio extends Toyotas {\n  public void mileage(int\
  \ miles);\n  public void seats(int seats);\n}\n\ninterface Crown extends Toyotas\
  \ {\n  public void space();\n  public void length();\n}\n```\n\nJava 不支持多继承，但我们可以通过接口来实现。这里是另一个：\n\
  \n```java\ninterface Interface {\n  void draw();\n  int cube(int ab);\n}\n\nclass\
  \ Cuboid implements Interface {\n  public void draw() {\n    System.out.println(\"\
  drawing\");\n  }\n}\n\nclass InterfaceTest {\n  public static void main(String args[])\
  \ {\n    Interface ob = new Cuboid();\n    ob.draw();\n    System.out.println(ob.cube(3));\n\
  \  }\n}\n```\n\n# 第 13 章 包\n\n包有助于对相关类。分组取决于功能。创建包时使用 `package` 然后跟名称。示例：\n\n```java\n\
