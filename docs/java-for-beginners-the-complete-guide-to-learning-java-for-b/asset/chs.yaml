  ```java\npublic class TestStudents { \n  public static void main(String[] args){\
  \ \n    Students st=new Students(); \n    st.setStudName(\"John\"); \n    System.out.println(st.getStudName());\
  \ \n  } \n} \n```\n\n变量 `studentName` 在 `Students` 类中被标记为 `private`。方法 `setStudName()`\
  \ 和 `getStudName()` 在 `Students` 类中被声明为 `public`。我们在 `TestStudents` 类中实例化了 `Students`\
  \ 类，然后使用该实例来访问它的变量和方法。\n\n### 示例 2：\n\n```java\npublic class Class3 {\n  private\
