  \ int ownerID() {\n\n  return 0;\n}\n\n  public static void main(String args[])\
  \ {\n\n  ceska cs = new ceska();\n\n  cs.bullets();\n\n  cs.ak47();\n}\n\n}\n```\n\
  \n# 第 14 章- 命令行参数\n\n这些参数在执行程序时传递。参数可以通过控制台传递并被程序接收，程序可以作为输入。使用命令行参数来确定程序在不同值下的行为。考虑这个：\n\
  \n```java\npublic static void main(String args[])\n```\n\n我们说明过它是 `main` 方法，程序没有它就无法运行。考虑这个：\n\
  \n`args[]`\n\n它是 `main` 方法的一部分。记住 Java 数组。它们使用方括号声明。我们上面有一个一个命名为 `args` 的数组。命令行参数源于此。我们将参数传递给该数组。记住元素从索引\
  \ 0 开始。示例：\n\n打开文本编辑器，创建一个名为 `CommandLine.java` 的文件。向其中添加此代码：\n\n```java\nclass\
  \ CommandLine{  \n\npublic static void main(String args[]){  \n\nSystem.out.println(\"\
  First argument: \"+args[0]);  \n\n}\n```\n\n保存文件并启动提示。首先，你需要编译它以检查错误：\n\n`javac\
  \ CommandLine.java`\n\n接下来，运行它，同时向它传递一个参数：\n\n`java CommandLine`\n\n它将在控制台上打印一些内容：images/0002.gif\
  \ \n\n参数传递成功。如果没有参数，我们可以如下运行程序：\n\n`java CommandLine`\n\n然而，我们在上面的命令之后添加了参数。由于使用了此内容：`args[0]`，程序在等待该参数。代码期望一个参数保留在索引\
  \ 0 处。这将是我们数组的第一个元素。索引 0 标记第一个元素。\n\n有时，用户可能会输入多个值并需要在控制台上显示它们。我们可以使用循环来遍历用户输入的所有元素。`for`\
  \ 循环适合这种。示例：在编辑器中，创建一个名为 `UserInput.java` 的文件。向其中添加此代码：\n\n```java\nclass UserInput{\
  \ \n  public static void main(String args[]){ \n    for(int ix=0;ix<args.length;ix++)\
  \ \n      System.out.println(args[ix]);\n}\n```\n\n保存文件。现在我们需要编译它来检查错误：\n\n`javac\
  \ UserInput`\n\n接下来，向它传递多个参数并运行它：\n\n`java UserInput arg1 arg2 arg3`\n\n它将在控制台上显示：\n\
  \narg1\narg2\narg3\n\n参数传递成功。\n\n# 第 15 章- 递归\n\n递归发生在方法调用自身。递归是方法调用自身。通过递归，代码变得复杂。递归语法：\n\
  \n```java\nclass Recursion1{ \n  static void helloMethod(){ \n    System.out.println(\"\
  Hi all\"); \n    helloMethod(); \n  } \n  public static void main(String args[]){\
  \ \n    helloMethod(); \n  }\n}\n```\n\n示例：\n\n```java\nclass Recursion2 { \n  static\
  \ int times=0; \n  static void helloMethod(){ \n    times++; \n    if(times<=5){\
  \ \n      System.out.println(\"Hi \"+times);\n\n方法打印 1-5。我们增加 `times` 变量的值直到它变为\
  \ 5。注意 `<=5` 包含了 5。通过递归，我们可以得到数字的阶乘：\n\n```java\nclass Recursion3 { \n  static int\
  \ numberFactorial(int nm){      \n    if (nm == 1)    \n      return 1;      \n\
  \    else    \n      return(nm * numberFactorial(nm-1));    \n  }  \n  public static\
  \ void main(String args[]) { \n    System.out.println(\"10 factorial gives: \"+numberFactorial(10));\
  \ \n  }\n}\n```\n\n对于阶乘，一个数字与其之前的数字相乘（00）。通过递归，我们可以得到数字的斐波那契数列。示例：\n\n```java\n\
  class Recursion4 { \n  static int num1=0,num2=1,num3=0; \n  static void showFib(int\
  \ times){ \n    if(times>0){ \n      num3 = num1 + num2; \n      num1 = num2; \n\
  \      num2 = num3; \n      System.out.print(\" \"+num3); \n      showFib(times-1);\
  \ \n    } \n  } \n  public static void main(String[] args) { \n    int times=15;\
  \ \n    System.out.print(num1+\" \"+num2);//打印 0, 1 \n    showFib(times-2);//已经打印了两个数字\
  \ \n  }\n}\n```\n\n# 第 16 章- 方法调用\n\n方法调用是调用 Java 函数的一种方式。Java 支持按值传递。Java 中没有按引用传递。当按值传递时，原始值不会改变。示例：\n\
  \n```java\npublic class MethodCallExample{\n  int val=10; \n  void changeValue(int\
  \ val){ \n    val=val+10;//更改/在局部变量\n  } \n  public static void main(String args[]){\n\
  ```\n\n\n\n\n\n```java\nMethodCallExample met=new MethodCallExample();\nSystem.out.println(\"\
  The initial \"+met.val);\nmet.changeValue(50);\nSystem.out.println(\"New value \"\
  +met.val);\n```\n\n值不会改变。当通过引用传递时，如果对被调用的方法进行了修改，原始值将会改变。如果传递的是对象而不是基本类型，原始值就会改变。示例：\n\
  \n```java\npublic class MethodCallExample2{\n  int val=10;\n  void changeValue(MethodCallExample2\
  \ meth){\n    meth.val=meth.val+50;//修改为实例变量\n  }\n  public static void main(String\
  \ args[]){\n    MethodCallExample2 meth=new MethodCallExample2();\n    System.out.println(\"\
  Initial value \"+meth.val);\n    meth.changeValue(meth);//传递对象\n    System.out.println(\"\
  New value \"+meth.val);\n  }\n}\n```\n\n值从 10 变为了 60，即在加上 50 之后。\n\n# 第 17 章 - Java\
  \ Applets (App 程序)\n\nApplets 是可以在网络浏览器上运行的 Java 程序。由于它拥有完整的 Java API，因此它可以像功能完整的应用程序一样工作。applet\
  \ 类继承自 `java.applet.Applet`。Applets 没有 `main` 方法，因此它们不会调用 `main()`。它们被嵌入在 HTML 页面中。在打开带有\
  \ applet 的 HTML 页面后，其代码会被下载到本地机器。查看 applets 必须具备 `JVM`（Java 虚拟机）。\n\nApplets 在客户端进行处理，因此与其他应用程序相比，它们能给用户提供更快的响应。Applets\
  \ 提供了良好的安全性。\n\n## Applets 的生命周期\n\nApplets 会经历以下步骤：\n\n1. 初始化（Initialization）-\
  \ `init()` 方法初始化 applets。\n2. 启动（Starting）- `start()` 方法启动 applets。\n3. 绘制（Painting）-\
  \ 在调用 `paint()` 方法完成后。\n4. 停止（Stopping）- 我们调用 `stop()` 方法停止 applet。\n5. 销毁（Destroying）-通过调用\
  \ `destroy()` 方法销 applet。\n\n通过 HTML 查看 applets。示例：\n\n在文本编辑器中创建一个名为“MyApplet.java”的新文件。将以下代码添加其中：\n\
  \n```java\nimport java.awt.Graphics;\nimport java.applet.Applet;\npublic class OurApplet\
  \ extends Applet{\n  public void paint(Graphics gc){\n    gc.drawString(\"First\
  \ Applet!\",150,150);\n  }\n}\n```\n\n在编辑器中创建一个名为 `code1.html` 的新文件。将以下代码添加其中：\n\
  \n```html\n<html>\n<body>\n  <applet code=\"OurApplet.class\" width=\"320\" height=\"\
  320\">\n</applet>\n</body>\n</html>\n```\n\n首先，我们有一段 Java 代码，在其中添加了关于我们的 applet\
  \ 应该执行的操作的代码。该类命名为 `MyApplet`。考虑此代码：\n\n```java\ngc.drawString(\"First Applet!\"\
  ,150,150);\n```\n\n我们正在 applet 窗口的 150, 150 处绘制“First Applet!”文本。注意通过 `import` 语句添加的两个库，即\
  \ `Graphics` 和 `Applet` 库。`paint()` 方法定义在 `Graphics` 库中。如果不导入它，将产生错误，因为 Java 编译器将无法理解我们的意思。我们在\
  \ `code1.html` 文件中有 HTML 代码。在其中，我们创建了一个可以在上面绘制文本的窗口：\n\n```html\n<applet code=\"\
  MyApplet.class\" width=\"320\" height=\"320\">\n```\n\n我们链接的是 `MyApplet.class` 而不是\
  \ `MyApplet.java`。这意味着 Java 代码应该先编译生成 `.class` 文件，然后 HTML 代码才能识别它。\n\n打开操作系统的终端，导航到文件所在的位置。运行此命令来编译\
  \ Java 代码：\n\n```bash\njavac MyApplet.java\n```\n\n这将生成 `MyApplet.class` 文件。我们可以使用使用\
  \ `appletviewer` 来查看我们的 applet。在控制台上运行此命令：\n\n```bash\nappletviewer Code1.html\n\
  ```\n\n应该会弹出一个带有“First Applet!”文本的窗口。那就是 Applet。\n\n![](img/00004.gif)\n\n![](img/00005.jpeg)\n\
