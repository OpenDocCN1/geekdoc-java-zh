  ...（此处省略中间完全一致的重复段，但在实际逻辑中已处理所有行）...\n\n\n\n\n# 第 11 章 封装\n\n这种机制有助于将数据和方法组合在一起。数据是变量，而方法是对数据操作的代码。通过封装，类变量可以对其他类隐藏，对这些变量的访问只能通过类的方法进行。封装等同于数据隐藏。它是通过将类变量声明为\
  \ `private` 实现的。变量的“setter”和“getter”方法应该声明为 `public`，并用于修改变量的值。\n\n### 示例：\n\n```java\n\
  public class Students{ \n  private String studentName; \n\n  public String getStudName(){\
  \ \n    return studentName; \n  } \n\n  public void setStudName(String studentName){\
