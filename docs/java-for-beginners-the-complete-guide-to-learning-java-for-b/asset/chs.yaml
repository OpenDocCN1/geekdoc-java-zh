  - 第 17 章-Java Applets\n- 结语\n\n# 引言\nJava 是一种广泛的编程语言，包含了许多适用于应用程序开发的特性。它是设计/开发桌面应用程序的很好的编程语言。这些程序作为独立应用程序非常流行。如果你需要分布式应用程序，Java\
  \ 是最适合使用的语言。Java Applets 可以嵌入/添加到网页中。Java 提供的许多特性使其成为一种受欢迎的编程语言。其广泛的特性使其适用于各行业应用的开发。要编写\
