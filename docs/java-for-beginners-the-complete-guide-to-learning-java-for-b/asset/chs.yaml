  \ {\n  public void drink() {\n      System.out.println(\"Mammals drink\");\n  }\n\
  \n  public void makeSound() {\n      System.out.println(\"Mammals make sound\");\n\
  \  }\n\n  public int legCount() {\n    return 0;\n  }\n\n  public static void main(String\
  \ args[]) {\n    Cow c = new Cow();\n    c.drink();\n    c.makeSound();\n  }\n}\n\
  ```\n\n如果不使用包，可以将两者合并为一个：\n\n```java\ninterface MammalsInterface {\n  public void\
  \ drink();\n  public void makeSound();\n}\n\nclass Cow implements MammalsInterface\
  \ {\n  public void drink() {\n      System.out.println(\"Mammals drink\");\n  }\n\
  \n  public void makeSound() {\n      System.out.println(\"Mammals make sound\");\n\
  \  }\n}\n```\n\n\n\n\n\n```java\n      c.makeSound();\n\n  }\n\n}\n```\n\n## import\
  \ 关键字\n\n你可以访问特定包之外的包。`import` 关键字是实现这一点的方法之一。要访问同一个包中的类，不需要使用包。在使用 `packagename.classname`\
  \ 语法导入后，只有被导入的类中的方法是可以被访问的。示例：\n\n```java\npackage mypackage;  \n\npublic class\
  \ HelloClass{  \n\n   public void messsage(){\n\nSystem.out.println(\"Hi all!\"\
  );\n\n}  \n\n} \n```\n\n我们在名为 `mypackage` 的包中定义了一个名为 `HelloClass` 的类。将它保存到 `HelloClass.java`\
  \ 文件中。我们有这个类：\n\n```java\npackage pack1;  \n\nclass HelloStudentsClass{  \n\n  \
  \ public static void main(String args[]){  \n\n   HelloClass hello = new HelloClass();\
  \  \n\n    hello.message();  \n\n   }  \n}  \n```\n\n第二个程序在执行后会生成错误。我们实例化了类 `HelloClass`\
  \ 以获取实例 `hello`。我们使用该实例来访问在 `HelloClass` 中定义的 `message()` 方法。注意，它们不在同一个包中。这将导致错误。由于由于原因，我们正在实例化一个与当前包不在同一个类。我们必须导入该类，即从\
  \ `mypackage` 包中导入 `HelloClass`。我们在类的顶部使用 `packagename.classname` 语法，如下：\n\n```java\n\
  package pack1;  \n\nimport mypackage.HelloClass;\n\nclass HelloStudentsClass{  \n\
  \n   public static void main(String args[]){  \n\n   HelloClass hello = new HelloClass();\
  \  \n\n    hello.message();  \n\n   }  \n}  \n```\n\n为包和类指定一个名称有助于避免该错误。通过这种方式，不需要使用\
  \ `import` 关键字，因为名称将直接指向该包和类，然后就可以从那里访问方法。示例：\n\n```java\npackage mypackage;  \n\
  \npublic class HelloClass{  \n\n   public void messsage(){\n\nSystem.out.println(\"\
  Hi all!\");\n\n}  \n\n} \n```\n\n要使用另一个包中的类中的 `message()` 方法，我们可以如下如下操作：\n\n```java\n\
  package pack1;  \n\nclass HelloStudentsClass{  \n\n   public static void main(String\
  \ args[]){  \n\n   mypackage.HelloClass hello = new mypackage.HelloClass();  \n\n\
  \    hello.message();  \n\n   }  \n} \n```\n\n考虑这一行：\n\n`mypackage.HelloClass hello\
  \ = new mypackageage.HelloClass();`\n\n`mypackage.HelloClass` 帮助我们访问名为 `mypackage`\
  \ 的包中的 `HelloClass` 类。之后，我们可以访问在该类中定义的 `message()` 方法。注意，你只能访问该类中的方法和变量，而不能访问该包中的其他类。另一个示例：\n\
  \n```java\npackage armory;\n\ninterface weapons {\n\n  public void pistol();\n\n\
  \  public void gun();\n}\n```\n\n`weapons` 接口在 `armory` 接口中。我们可以在类似的包中实现该接口：\n\n\
