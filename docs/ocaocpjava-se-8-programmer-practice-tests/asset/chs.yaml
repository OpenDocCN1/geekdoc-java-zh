  \ 是正确答案。\n\n### 21\nD. 选项 A、B 和 C 是关于函数式接口的正确陈述。Lambda 可能与多个函数式接口兼容，但在声明或作为方法参数传递时，必须赋值给函数式接口。此外，可以创建一个返回类型匹配函数式接口的方法，允许返回\
