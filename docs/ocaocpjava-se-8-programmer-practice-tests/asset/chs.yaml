  \ A 是正确答案。\n\n### 27\nD. Java 更新以包含默认接口方法，是为了支持接口的后兼容性。通过向现有接口添加默认方法，我们可以创建一个接口的新版本，该版本可以使用且不会破坏实现旧版本接口的现有类的功能。由于这个原因，选项\
