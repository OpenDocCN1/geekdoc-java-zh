  \ D 是正确答案。注意，如果 lambda 表达式不依赖 `(+)` 运算符，例如 `s -> s`，那么即使没有泛型类型，编译器也会允许 `UnaryOperator`。\n\
  \n### 27. B. `BiFunction` 接口接收两个不同的泛型值并返回一个泛型值，总共三个泛型参数。接下来，`ToDoubleFunction` 好接收一个泛型值并返回一个\
  \ `double` 值，需要一个泛型参数。`ToIntBiFunction` 接口接收两个泛型值并返回一个 `int` 值，总共两个泛型参数。因此，选项 A、C\
