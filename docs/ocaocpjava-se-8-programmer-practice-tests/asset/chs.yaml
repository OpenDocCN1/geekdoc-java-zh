  ### 17\nD. `Optional` 类有一个不接受任何参数的 `isPresent()` 方法。它返回一个 `boolean` 并通常用于 `if` 语句中。还有一个\
  \ `ifPresent()` 方法接受一个 `Consumer` 参数，并且仅在 `Optional` 不空时运行它。`isNotNull()` 和 `forEach()`\
  \ 方法没有在 `Optional` 中声明。因此，选项 D 是正确的。\n\n### 18\nC. 第一个中间操作 `limit(1)` 将无限流转换为包含一个元素的流：`true`。`partitioningBy()`\
  \ 方法返回一个包含两个键（`true` 和 `false`）的 map，无论实际上是否有元素匹配项。如果没有匹配项，值将为空列表，使得选项 C 正确。\n\n\
  ### 19\nB. `flatMap()` 方法用于将流的流转换为一维流。这意味着它消除了空列表并扁平了另外两个。选项 A 是错误的，因为这是你使用普通的 `map()`\
  \ 方法会得到的输出。选项 B 是正确的，因为它扁平了元素。注意，所有三个元素是不同类型的 `Collection` 实现类这并不重要。\n\n### 20\n\
  D. `sorted()` 方法允许将可选的 `Comparator` 作为引用传递。然而，`Comparator.reverseOrder()` 没有实现 `Comparator`\
  \ 接口。它接受零个参数，而不是要求的两个参数。由于它不能作为方法引用使用，代码无法编译，选项 D 是正确的。\n\n### 21\nD. 选项 A 是错误的，因为\
  \ `findAny()` 可能不返回 `1`。结果可能是三个数字中的任何一个。选项 B 是错误的，因为没有可作为终端操作的 `first()` 方法。选项 C\
  \ 很有诱惑力，因为有一个 `min()` 方法。然而，由于我们处理的是 `Stream`，该方法需要一个 `Comparator` 作为参数。因此，选项 D\
  \ 是答案。\n\n### 22\nC. `List` 没有 `filter()` 方法，因此选项 A 错误的。`Stream` 的有 `filter()` 和\
  \ `map()` 方法。然而，`Stream` 没有 `ifPresent()` 方法。这使得 IV 是错误的，所以选项 B 和 D 都是错误的。`Collection`\
  \ 和 `String` 都有 `isEmpty()` 方法，因此它们都可以与 `Optional` 配合使用，选项 C 是答案。\n\n### 23\nD.\
  \ 此代码生成一个数字 `1` 的无限流。`Predicate` 检查元素是否大于 `5`。这永远不会为真。使用 `allMatch()`，流管道在检查完第一个元素后结束。它不匹配，因此代码打印\
  \ `false`。`anyMatch()` 和 `noneMatch()` 会继续检查且不会找到任何匹配项。然而，它们不知道未来的流元素是否会不同，因此代码将无限执行，直到进程被终止。因此，选项\
  \ D 是正确的。\n\n### 24\nD. `Collectors.groupingBy()` 和 `Collectors.partitioningBy()`\
  \ 都适用于将流转换为 `Map`。另外两个方法不存在。然而，当使用条件时，你应该使用 `partitioningBy()`，因为它会自动使用 `Boolean`\
  \ 键进行分组。因此，选项 D 是正确的。\n\n### 25\nB. 选项 A 是错误的，因为我们处理的是基本类型而不是对象。选项 C 可以编译，但输出的是流的引用而不是内容。选项\
  \ B 是正确的，因为它将 `int` 基本类型扁平化为了一个流。\n\n### 26\nD. 摘要统计类提供了 getter 以访问数据。`getAverage()`\
  \ 方法返回一个 `double` 而不是 `OptionalDouble`。选项 D 是唯一可以编译的选项。\n\n### 27\nD. 选项 A 无法编译，因为\
  \ `Optional` 的 `get()` 方法不接受任何参数。选项 B 和 C 可以编译，但由于 `Optional` 不空，它们都会打印 `Cupcake`。因此，选项\
  \ D 是正确的。\n\n### 28\nC. 第一个中间操作让流产生无限流。`sorted()` 要求元素进行排序。由于 `Optional` 不空，它会一直打印\
  \ `Cupcake`。这使得选项 C 正确。\n\n### 29\nA. `mapToDouble()` 方法通过。然而，它输出的是 `9.0` 而不是数字\
  \ `9`。`mapToInt()` 方法在 `LongStream` 上不可用，因此无法编译。\n\n### 30\nA. `filter()` 方法传递给定元素，这使得选项\
