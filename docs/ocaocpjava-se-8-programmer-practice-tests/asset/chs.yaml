  \ `cookies` 的值时，另一个调用正在操作它，从而导致信息丢失。由于这个原因，输出无法预测，选项 C 是正确答案。如果两组调用在同一个对象上正确同步，那么\
  \ `cookies` 变量将受到并发修改的保护，选项 A 将是正确答案。\n\n### 39. A.\n代码尝试递归地在数组中搜索匹配元素。虽然它不包含任何编译问题，但确实包含一个错误。尽管创建了\
  \ `Thread` 实例，但它并不是一个多线程程序。在 `Thread` 上调用 `run()` 会作为当前线程的一部分运行。要实现多线程执行，它应该调用 `start()`\
  \ 方法。由于这个原因，代码同步完成，等待每个方法调用返回后才移动到下一个，并在执行结束时打印 true，因此选项 A 是正确答案。另一方面，如果使用了 `start()`，则程序是多线程的，但在调用\
  \ `println()` 方法时结果可能还没有准备好，导致无法提前预测。在这种情况下，选项 D 将是正确答案。\n\n### 40. C.\n13 行无法编译，因为\
  \ `execute()` 方法的返回类型是 `void` 而不是 `Future`。15 行无法编译，因为 `scheduleFixedRate()` 需要包括初始延迟和周期值在内的四个参数。由于这两个原因，选项\
  \ C 是正确答案。\n\n## 第 21 章：使用 JDBC 构建数据库应用程序\n\n1. C. `Connection` 是与数据库通信的接口。`Driver`\
  \ 比较棘手，因为你没有直接引用它，但你仍然需要它是一个 JDBC 接口。`DriverManager` 用于 JDBC 代码中获取 `Connection`，但它是具体类而不是接口。由于\
  \ `Connection` 和 `Driver` 是 JDBC 接口，选项 C 是正确的。\n\n2. D 数据库特定的实现类不在 `java.sql` 包中。实现类位于数据库驱动中，并具有特定数据库的包名。因此，选项\
  \ D 是正确的。`Driver` 接口在 `java.sql` 包中。注意这些类可能不存在。你不需要知道任何特定类的名称，所以出题者可以随意命名。\n\n3.\
  \ D 所有的 JDBC URL 都以协议 `jdbc` 开始，并跟着一个冒号作为分隔符。选项 D 是唯一包含这两点的，因此是答案。\n\n4. A. `Driver`\
  \ 接口负责获取数据库连接，因此选项 A 是答案。`Connection` 接口负责与数据库通信但不负责初始连接。`Statement` 接口知道如何运行 SQL\
  \ 查询，而 `ResultSet` 接口知道 `SELECT` 查询返回的内容。\n\n\n\n\n\n### 6\nC. `Connection` 是一个接口。由于接口没有构造函数，因此选项\
  \ D 是错误的。`Connection` 类也没有获取 `Connection` 的静态方法，使得选项 A 错误。`Driver` 类也是一个接口，且没有静态方法，因此选项\
  \ B 错误。选项 C 是正确答案，因为 `DriverManager` 是 JDBC 中用于获取 `Connection` 的类。\n\n### 7\nB.\
  \ `DriverManager.getConnection()` 方法只需传入一个 `URL` 即可调用。它还重载为接收 `URL`、`username` 和\
  \ `password`，这使得选项 B 是正确的。\n\n### 8\nD. `CallableStatement` 和 `PreparedStatement`\
  \ 是扩展 `Statement` 接口的接口。考试时不需要这一点。但你需要知道，需要数据库驱动程序来提供 `Statement` 的具体实现类，而不是 JDK。这使得选项\
  \ D 是正确的。请注意，虽然 Java 附带 `Derby`，但它位于“主” JDK 之外独立的 jar 包。\n\n### 9\nC. 一个 JDBC URL\
  \ 包含由冒号分隔的三个部分。这三个 URL 都符合这些标准。对于组件之后的数据，由数据库驱动指定格式。根据驱动的不同，这可能包括 IP 地址和端口。无论如何，它必须包含数据库名或别名。I\
  \ 和 II 都可以是有效格式，因为它们提到了数据库框（database box）。然而，III 只有 IP 地址和端口。它没有数据库名或别名。因此 III 是错误的，选项\
  \ C 是正确的。\n\n### 10\nC. 在驱动程序 jar 包中包含 `java.sql.Driver` 文件的要求是在 JDBC 4.0 中引入的。在\
  \ JDBC 4.0 中，对 `Class.forName()` 的调用变为可选。因此，选项 C 最好地填补了空格。\n\n### 11\nA. `Scroll\
  \ sensitive`（滚动敏感型）是一个结果集类型参数，而 `updatable`（可更新）是一个并发模式。结果集类型参数在并发模式之前传递给 `createStatement()`。如果你请求了数据库驱动程序不支持的选项，它会降级为它支持的选项，而不是抛出异常。语句\
  \ I 和 III 是正确的，因此选项 A 是答案。\n\n### 12\nB. JDBC 4.0 允许但不要求调用 `Class.forName()` 方法。然而，由于它在代码中，它必须是正确的。该方法期望数据库驱动程序的完全限定类名，而不是\
  \ JDBC URL。因此，`Class.forName()` 方法抛出 `ClassNotFoundException`，选项 B 是答案。\n\n### 13\n\
  B. `ResultSet` 有两种并发模式：`CONCUR_READ_ONLY`（只读）和 `CONCUR_UPDATABLE`（可更新）。所有数据库驱动都支持只读结果集，但并非所有的驱动都支持可更新的结果集。因此，选项\
  \ B 是正确的。\n\n### 14\nD. 这段代码缺少对 `rs.next()` 的调用。因此，`rs.getInt(1)` 抛出 `SQLException`，信息为“Invalid\
  \ cursor state – no current row”。因此，选项 D 是答案。\n\n### 15\nD. `execute()` 方法允许运行任何类型的\
  \ SQL 语句。`executeUpdate()` 方法允许运行返回行数而非 `ResultSet` 的任何类型 SQL 语句。`DELETE` 和 `UPDATE`\
  \ SQL 语句都允许使用 `execute()` 或 `executeUpdate()` 执行。不允许使用 `executeQuery()` 执行，因为它们不返回\
  \ `ResultSet`。因此，选项 D 是答案。\n\n### 16\nC. `Connection` 是一个接口而非具体类。因此，它没有构造函数，行 s2\
  \ 无法编译。因此，选项 C 是答案。如果将代码 `new Connection()` 更改为 `DriverManager.getConnection()`，则选项\
  \ A 是答案。\n\n### 17\nA. 有三种 `ResultSet` 类型选项：`TYPE_FORWARD_ONLY`（仅向前）、`TYPE_SCROLL_INSENSITIVE`（滚动不敏感型）和\
  \ `TYPE_SCROLL_SENSITIVE`（滚动敏感型）。列表中只有其中一个，这使得选项 A 是正确的。\n\n### 18\nB. 与数组不同，JDBC\
  \ 使用从 1 开始的索引。由于 `num_pages` 在第二列，因此参数需要是 2，排除了选项 A 和 C。此外，`ResultSet` 接口上没有名为 `getInteger()`\
  \ 的方法，排除了选项 D。由于正确的方法是 `getInt()`，选项 B 是答案。\n\n### 19\nD. 选项 A 无法编译，因为你必须向方法传递列索引或列名。选项\
