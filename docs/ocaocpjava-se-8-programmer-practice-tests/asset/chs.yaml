  \ B 是最佳答案。\n\n### 39\nD. `receiveText()` 方法可以编译并运行，没有问题。该方法在尝试使用 `mark()` 方法之前正确地检查了是否支持该方法。根据\
  \ `reset()` 的实现，指针在 `if-then` 语句之前之后处于相同的位置。另一方面，`sendText()` 方法无法编译。`skip()` 方法定义在\
