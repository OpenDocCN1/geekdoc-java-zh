  \ B 将是正确答案。\n\n## 第 13 章: 泛型与集合\n\n1. C. 在声明使用泛型的类时，必须为形式类型参数指定一个名称。Java 遵循变量或类的命名规则。问号不允许作为变量名，因此\
  \ I 是错误的。虽然使用大写字母作为类型参数是常见做法，但这并不是强制要求的。使用像 `News` 或 `Object` 这样已有的类名是好主意。然而，这是允许的，因此选项\
  \ C 是正确的。\n\n2. B. 选项 A 是错误的，因为 `filter()` 方法适用于 `Stream` 而不是 `List`。选项 C 是错误的，因为\
  \ `replace()` 方法适用于 `List` 而不是 `Stream`。选项 D 具有误导性，因为 `List` 有 `sort()` 方法，而 `Stream`\
  \ 有 `sorted()` 方法。这些方法名不同，所以选项 D 是错误的。选项 B 是答案，因为两个接口都有 `forEach()` 方法。\n\n3. A.\
  \ 注意这段描述中的多余信息。顾客按名称选择书籍是无关的。排队是双端队列的完美示例。我们需要方便访问队列的一端以便顾客加入队列。我们还需要方便访问队列的另一端，以便顾客在轮到时离开队列。通过\
  \ ISBN 查找书籍是通过键查找。我们需要一个 map 来来实现。这里用 `HashMap` 可能更好，但它不在选项中。所以答案是选项 A，它确实包含了双端队列和映射。\n\
  \n4. B. Java 讨论了集合框架，但 `Map` 接口并没有实现 `Collection` 接口。`TreeMap` 的方法与 `ArrayDeque`\
  \ 和 `TreeSet` 不同。它无法填充空白，所以选项 B 是正确的。\n\n5. B. 选项 C 和 D 是错误的，因为方法签名不正确。与 `equals()`\
  \ 方法不同，`Comparator` 中的方法在泛泛型时会将被比较的类型作为参数。选项 A 是一个有效的 Comparator。然而，它是按长度升序排序的。选项\
  \ B 是正确的。如果 `s1` 有三个字符而 `s2` 有一个字符，它会返回 -2。负值表示 `s1` 应该排在前面，这是正确的，因为我们希望最长的 `String`\
  \ 排在前面。\n\n\n\n\n\n### 6. D. `TreeMap` 和 `TreeSet` 在插入元素时会记录排序。`TreeMap` 对键进行排序，而\
  \ `TreeSet` 对集合中的对象进行排序。这使得选项 D 正确。注意，你可以让 `JellyBean` 实现 `Comparable`，也可以向 `TreeMap`\
  \ 或 `TreeSet` 的构造函数传递一个 `Comparator`。\n\n### 7. C. 选项 A 是错误的，因为如果源没有生成任何项，只要流水线的其余部分是正确的，流水线仍然会运行。虽然某些操作彼此无关，但控制权仍然传递给终端操作。选项\
  \ B 是错误的，因为中间操作是可选的。选项 C 是答案。终端操作触发了流水线的运行。\n\n### 8. B. `Iterator` 接口使用 `hasNext()`\
  \ 和 `next()` 方法进行迭代。由于没有 `hasMore()` 方法，它应该被更改为 `hasNext()`，因此选项 B 是答案。对于选项 A，缺失的泛型类型会产生警告，但代码仍然运行。对于选项\
  \ C，迭代器可以根据你的需要运行任意次数，列表的 `forEach()` 方法也是如此。\n\n### 9. A. 首先，代码创建了一个包含三个元素的 `ArrayList`。然后，列表被转换为\
  \ `TreeSet`。由于集合不允许有重复项，因此集合只有两个元素。记住 `TreeSet`是有序的，这意味着 `TreeSet` 中的第一个元素是 3。因此，选项\
  \ A 是确的。\n\n### 10. C. 流中使用 `reduction`（归约）一词用于终端操作，因此选项 A 和 B 是错误的。选项 D 描述了一个有效的终端操作（如\
  \ `anyMatch()`），但它不是归约操作。选项 C 是确的，因为归约必须查看流中的每个元素以确定结果。\n\n### 11. A. `offer()`\
  \ 方法将元素添加到队列的末尾。第 7 行执行完成后，队列按顺序包含 18 和 5。`push()` 方法将元素添加到队列的前端。真没礼貌！元素 13 插队在了队中的所有人。第\
  \ 8 行执行完成后，队列现在按顺序包含 13、18 和 5。然后我们从前端获取前两个元素，即 13 和 18，使得选项 A 正确。\n\n### 12. D.\
  \ `Magazine` 类没有实现 `Comparable<Magazine>`。它恰好正确地实现了 `compareTo()` 方法，但实际上缺少了 `implements\
  \ Comparable` 声明。由于 `TreeSet` 在运行时才会检查对象是否可以比较，当 `TreeSet` 调用 `add()` 时，代码会抛出 `ClassCastException`，因此选项\
