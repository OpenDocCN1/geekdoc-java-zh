  \ `temp` 之后写入一个换行符。由于它是唯一正确的语句，因此选项 A 是正确答案。\n\n### 14. C. 首先，没有 `Files.readLines()`\
  \ 方法，使得选项 B 和 D 立即错误。`Files.readAllLines()` 方法返回一个 `List<String>`，而 `Files.lines()`\
  \ 方法返回一个 `Stream<String>`。出于此原因，选项 C 是正确答案，选项 A 是错误的。\n\n### 15. A. 程序编译并运行均没有问题，使得选项\
  \ C 和 D 错误。与 `String` 实例一样，`Path` 实例是不可变的。出于此原因，第 7 行的 `resolve()` 操作对 `lessTraveled`\
