  \ 构造函数也可以编译。这两个语句 `super()` 和 `new Exception()` 实际上是连续调用了 `Exception` 类中的同一个构造函数。最后一个\
  \ `WhaleSharkException` 可以编译，因为编译器插入了默认的无参数构造函数 `super()`，因为它在 `Exception` 类中存在。由于这些原因，所有构造函数都可以编译，选项\
  \ D 是正确答案。\n\n8. B. `UnsupportedOperationException` 类是一个未检查异常，这意味着它继承自 `RuntimeException`。虽然\
