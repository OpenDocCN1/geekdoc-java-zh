  \ C 是错误的，因为没有 `UnaryIntOperator` 函数式接口。注意有一个名为 `IntUnaryOperator` 的接口。选项 D 是错误的。`java.util.function`\
  \ 包不包含任何三元运算符（tri- operators），尽管很多很容易编写。\n\n### 26. D. Lambda 表达式可以匹配多个函数式接口。它匹配\
