  \ B 将是答案。\n\n\n\n\n\n### 14\nB. 此代码是可以编译的。作为一种中间操作，允许在流管道（stream pipeline）中多次调用\
  \ `peek()`。你甚至可以连续调用多次。虽然直接将 `System.out::println` 作为 `peek()` 的参数很常见，但并没有阻止你创建一个\
  \ `Consumer` 变量。由于 `forEach()` 方法也接受一个 `Consumer`，我们可以重用它。三个 `peek()` 中间操作和一个 `forEach()`\
  \ 操作总共产生四行输出。`map()` 操作可以省略，因为它仅仅是让输入直接透传。\n\n### 15\nB. `Stream` 允许包含字符对象，因此行 `z1`\
  \ 编译通过，这使得选项 C 错误。行 `z2` 也可以编译，因为 `findAny()` 返回一个 `Optional`，且 `ifPresent()` 是声明在\
  \ `Optional` 。因此，选项 D 也是错误的。现在让我们来看这个 `Stream`。源有三个元素。中间操作对元素进行排序，然后我们通过 `findAny()`\
  \ 请求一个元素。`findAny()` 方法不保证返回特定的元素。由于我们没有使用并行化处理，代码极有可能打印 `a`。然而，你需要知道这不是保证的，因此选项\
  \ B 是答案。\n\n### 16\nA. `sorted()` 方法接受一个可选的 `Comparator` 作为参数，它接受两个 `String` 参数并返回一个\
