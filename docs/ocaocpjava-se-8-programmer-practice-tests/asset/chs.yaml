  606. 510\n607. 511\n608. 512\n609. 513\n610. 514\n611. 515\n\n# 前言\n\n本书适用于参加 1Z0-808\
  \ 或 1Z0-809 考试的读者。如果你是 Java 初学者，我们强烈建议先阅读 *OCA Certified Associate Java SE 8 Programmer\
  \ I Study Guide* 和 *OCP Certified Professional Java 8 Programmer II Study Guide》，我们是本书的作者。与学习指南的设计难度比真实考试要大，本书中的题目模拟了考试格式。本书中的所有题目都会告知你有几个正确答案。如果有多个正确答案，会显示“选择两个”或“选择三个”。在本书中，我们使用了\
  \ Oracle 考试使用的同一套假设。在许多情况下，这些假设实际上是为了让你在解决问题时忽略 Oracle 的遗漏或排版错误。这些假设列在 [`education.oracle.com`](http://education.oracle.com)，为了方便起见在此列出：\n\
  \n*   缺失包和导入语句：如果示例代码没有包含包或导入语句，且题目没有明确引用这些缺失的语句，请假设所有示例代码都在同一个包中，并且存在支持它们的导入语句。\n\
  \n*   **没有类的文件或目录路径：** 如果题目没有说明类的文件名或目录位置，请假设以下情况之一，以确保代码能够编译和运行：\n\n    *   所有类都在一个文件中。\n\
  \n    *   每个类都在一个单独的文件中，所有文件都在同一个目录下。\n\n*   **意外的换行：** 示例代码可能有意外的换行。如果你看到某行代码看起来像是换行了，并且这导致了显著的情况（例如引号内的字符串字面量换行），请假设该换行是同一行的扩展，且该行不包含会导致编译失败的硬回车。\n\
  \n*   **代码片段：** 代码片段是指没有提供上下文的小部分源代码。假设所有必要的支持代码都存在，并且支持环境完全支持显示代码及其省略环境的正确编译和执行。\n\
  \n\n\n\n*   **描述性注释：** 请按字面理解描述性注释，例如“此处为 setter 和 getter 方法”。假设正确的代码已经存在、可以编译并能成功运行，以实现所描述的效果。\n\
  \n## 选择考试\n\n通往 Java 认证之路的第一步是 Oracle Certified Associate 1Z0-808 (OCA 8) 考试。该材料包含了每个\
  \ Java 开发者都应该熟悉的日常基础工具。一旦你完成了该考试，就可以参加更具难度的 Oracle Certified Professional 1Z0-809\
  \ (OCP 8) 考试。该考试涵盖了第一场考试中的所有主题，以及许多你自己在职业生涯中可能并不熟悉的额外库和 API，例如并发（Concurrency）和 `NIO.2`\
  \ API。\n\n如果你已经拥有 Java 认证，则有资格参加升级考试。表 I.1 和 图 I.1 显示了获取 OCP 8 认证的各种路径。本书将帮助你准备表格列出的所有四场考试。\n\
  \n| 考试代码 | 名称 | 谁应该参加 |\n| --- | --- | --- |\n| 1Z0–808 | Java Programmer I | 任何人都可以参加此考试。\
  \ |\n| 1Z0–809 | Java Programmer II | 通过了 OCA 8 考试的人 |\n| 1Z0–810 | 从 Java SE 7\
  \ 升级到 Java SE 8 OCP 程序员 | OCP 7 认证持有者 |\n| 1Z0–813 | 升级到 Java SE 8 OCP (Java SE\
  \ 6 及所有之前的版本) | 持有以下任何一种认证的持有者：<br>* `SCJP/OCJP 6`<br>* `SCJP/OCJP 5`<br>* `SCJP\
  \ 1.4`<br>任何旧的 `SCJP` 证书 |\n\n**表 I.1** 本书涵盖的考试\n\n![图表显示，如果你通过了以下四个代码组件的划分，作为考试先决条件：OCA\
  \ 8 考试、OCP 7 考试、OCP 升级考试以及任何 SCJP/OCJP 考试。](img/flastg001.jpg)\n\n**图 I.1** 考试先决条件\n\
  \n对于 OCA 考试，我们建议使用我们的 `OCA Oracle Certified Associated Java SE 8 Programmer Study\
  \ Guide` 配合本书的第 1 至 10 章制定学习计划。对于 OCP 考试，我们建议使用我们的 `OCP Oracle Certified Professional\
  \ Java SE 8 Programmer II Study Guide` 配合本书的第 11 至 23 章制定学习计划。没错，这本书实际上是两书合一！它可以帮助你应对\
  \ OCA 和 OCP 考试。\n\n### 参加升级考试\n\n如果你要参加其中一种升级考试，在准备方式上会有一些细微差别。好消息是，如果你目前持有 Java\
  \ 7 OCP 认证并参加 1Z0-810 升级考试，那么这本书就是你所需要的。虽然考试更侧重于 Java 7 和 Java 8 之间的变化，但并没有任何现有\
  \ OCP 7 材料中未涵盖的新主题。这意味着你的学习计划与那些首次参加 OCP 考试的人相同。\n\n另一方面，如果你参加参加 1Z0-813 升级考试并持有\
  \ Sun Certified Java Programmer (`SCJP`) 或 Oracle Certified Java Programmer (`OCJP`)\
  \ 称号，那么你需要额外的材料。这种升级莫名其妙地包含了 Java 7 OCP 考试中包含但在 Java 8 版本中被移除的内容，例如 `ReentrantLock`\
  \ 和 `WatchService`。对此我们没有解释，尽管这使得 1Z0-813 可以被认为是三场 OCP 考试中最难的一个，因为它需要了解多个 Java 版本的所有知识。\n\
  \n不要担心！当我们编写 `OCP Oracle Certified Professional Java SE 8 Programmer II Study Guide`\
  \ 时，添加了一个特殊的 50 页附录——录 C，“从 Java 6 或更早版本升级”，它详细涵盖了 1Z0-813 考试的专属主题。如果你正在参加 1Z0-813\
  \ 考试，那么在完成本书的学习后，你应该查阅我们 OCP 书籍中的附录或 Java 7 OCP 学习指南，以便准备好应对所有目标。\n\n### 考虑其他学习路径\n\
  \n如果你已经拥有 Java 认证，并不要求参加升级考试。有些开发者发现，从较简单的 1Z0-808 OCA 考试开始，然后参加更具挑战性的 1Z0-809 OCP\
  \ 考试更为直接。如果你没有 Java 8 的经验，或者只是想进行更多练习，那么先参加 OCA 考试再参加 OCP 考试可能比参加单一升级考试是更好的学习体验，尽管它的成本更高。\n\
  \n另外请记住，如果你持有旧的 Java 称号并想参加升级考试，即使你通过了升级考试，也需要在获得 OCP 8 称号之前证明你的身份。这要求你在 Oracle\
  \ 的 `CertView` 系统中注册你的旧认证。我们听过一些读者的反馈，他们不得不翻找十多年前的旧文件夹和电子邮件，以提交适当的文件，以便他们被授予 OCP\
  \ 8 称号。\n\n最后，如果你是 Java 认证的新手，传统做法是按顺序参加考试，先参加 OCA 考试，后参加 OCP 考试。然而，这并不是严格要求。先参加\
  \ OCP 考试是可能的，尽管非常不合常规。\n\n## 谁应该买这本书\n\n如果你想参加 OCA 考试 (1Z0-808)，那么本书的第 1 至 10 章适合你。\n\
  \n如果你想参加 OCP 考试 (1Z0-809) 或 OCP 8 升级考试 (1Z0-810)，那么本书的第 11 至 23 章适合你。正如前面提到的，如果你想参加\
  \ OCP 8 升级考试 (1Z0-813)，这本书对大部分主题仍有帮助。你需要补充 Java 7 学习指南或使用我们 OCP 书籍中的附录 C，该附录专注于\
  \ 1Z0-813 考试中你所需的精确主题。\n\n## 本书是如何组织的\n\n对于这本书，我们决定将两书合一，分为第一部分和第二部分。第一部分包含第 1 至\
  \ 10 章，针对每个 OCA 考试目标有 9 个目标型章节，最后是一场模拟 OCA 练习考试。第二部分涵盖第 11 至 23 章，针对每个 OCP 考试目标有\
  \ 12 个目标型章节，最后是一场模拟 OCP 练习考试。\n\n### 使用目标型章节\n\n我们设计的目标型章节中每个问题的结构和风格，反映了更积极的学习体验，让你在每个问题上花费更少的时间，但涵盖的范围更广。例如，你可能会在同一个章节中看到两个看起来相似的问题，但它们之间的细微差别对代码是否能编译或产生什么输出有巨大影响。\n\
  \n目标型章节中的每个问题都有恰好四个选项，只有一个正确答案。就像我们学习指南中的复习题一样，这些问题的初初是为了让你多次回答。\n\n\n\n\n在我们的学习指南中，我们经常将相关主题分组成章节。例如，`if/then`\
  \ 语句和循环属于不同的 Oracle 目标集，但在我们的 OCA 教程书中，它们被包含在“运算符和语句”这一个章节中。在本书书中，我们决定仅围绕 Oracle\
  \ 的目标来设计章节，以便你强化自己的技能。虽然在用本书中使用基于目标的章节之前，你不需要阅读整本学习指南，但你确实需要学习相关的目标。I.2 和 I.3 显示了在练习本书中的问题之前，你最少需要读过我们学习指南中的哪些章节。\n\
  \n| 本书章节 | 目标 | OCA 学习指南章节 |\n| --- | --- | --- |\n| 1 | Java 基础 | 1 |\n| 2 | 处理\
  \ Java 数据类型 | 1, 3 |\n| 3 | 使用运算符和决策结构 | 2, 3 |\n| 4 | 创建和使用数组 | 3 |\n| 5 | 使用循环结构\
  \ | 2 |\n| 6 | 处理方法和封装 | 4 |\n| 7 | 处理继承 | 5 |\n| 8 | 处理异常 | 6 |\n| 9 | 使用 Java\
  \ API 中的选类 | 1, 3, 4 |\n\n#### 表 I.2](#intro.xhtml_tableanchor-2) OCA 学习指南中的引用\n\
