  \ `Path` 是一个接口，需要一个类来实例化。\n\n### 13. A. 代码可以编译且没有问题，但仅此而已。该类在运行时可能会抛出异常，因为我们没有说明源文件是否存在，也没有目标文件是否存在、是否为目录或受写保护。由于这些原因，选项\
