  \ `12`，因为缺少 `break` 语句会导致进入多个代码块，选项 C 将是正确答案。\n\n3. C. 函数式接口必须包含恰好一个抽象方法，通过继承或直接声明。它也可以拥有任意数量（包括零）的\
