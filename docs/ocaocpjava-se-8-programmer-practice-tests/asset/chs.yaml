- "# OCA／OCP Java®：SE 8 程序员：实践指南\n\n\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\
  \n\n送给我妻子即将出生的小新生命。\n— Scott\n\n在同一年怀念爱因斯坦和 CV。祝贺 694！\n— Jeanne\n\n# 致谢\n\nScott\
  \ 和 Jeanne 感谢许多对本书做出贡献的个人。感谢 David Clark 引导我们走完整个创作过程，并在许多方面让这本书变得更好。感谢 Janeice\
  \ DelVecchio 在我们编写本书期间担任我们的技术编辑。除了大错误，Janeice 还指出了许多细微的错误。感谢 Elena Felder 担任我们的技术校对，并发现了我们设法瞒过\
  \ Janeice 的错误。如果没有 Wiley 的许多人，包括 Kenyon Brown, Rebecca Anderson, Judy Flynn, Nancy\
  \ Carrasco 以及许多其他人，这本书就不可能完成。\n\n如果没有一支“小军队”的帮助，Scott 无法走到这一步，这支军队领是他始终理解他的妻子 Patti，她是他们的双胞女儿\
  \ Olivia 和 Sophia 能要求的最完美的母亲。康奈尔大学的 Johannes Gehrke 和 John H. Hubbard 教授一直相信他，并知道他会在事业上取得成就。Scott\
  \ 在这第三本书中想向他极具耐心的合作者 Jeanne 表示谢意。Matt Dalen 向 Scott 推荐了 `CodeRanch.com` 并鼓励他定期发帖，这一步改变了他的生活。非常感谢\
  \ Mark Seloff 教会他教育的价值。最后， Scott 感谢他的母亲、退休教师 Barbara Selick。\n\nJeanne 特别感谢 `CodeRanch.com`\
  \ 的所有对 OCA 和 OCP 问题提问并回答的人。与读者的对话让这本书更加强大。Jeanne 感谢 FRC 机器人队伍 694 的成员以及 FTC 队伍 310\
  \ 和 479 的支持。你们的问题让她不断思考。Jeanne 还感谢 Onur Otlu 和 Thomas Campos 对某些本地化问题的反馈。关于作者。\n\
  \n最后，但并非不是，Scott 和 Jeanne 都非常感谢我们 OCA 8 和 OCP 8 书的读者。听到你们喜欢这本书并通过了考试，感觉非常棒。我们还感谢那些指出\
  \ OCP 书错误并提出改进建议的人。截至 2016 年 12 月，排名前三的是 Guillaume Bailly、Thalita Vergilio 和 Sébastien\
  \ Canonica。\n\n# 关于作者\n\n**Scott Selikoff** 是一位专业软件顾问、作者以及 Selikoff Solutions, LLC\
  \ 的所有者，该公司为纽约三地地区的企业提供软件开发解决方案。Scott 精通多种软件语言和平台，专长全栈数据库驱动系统、云应用和面向服务的架构。\n\nScott\
  \ 出自新泽西州汤姆斯河（Toms River），他在 2002 年通过三年的学习，获得了康奈尔大学数学和计算机科学学士学位。2003 年，他在康奈尔大学同样获得了计算机科学工程硕士学位。\n\
  \n\n\n\n\n作为一个深爱教育事业的人，Scott 一直很喜欢向他人教授新概念。他曾在康奈尔大学和罗格大学进行过演讲，并参加过包括服务器端 Java 研讨会在内的会议。Scott\
  \ 住在新泽西州，与他亲爱的妻子 Patti、可双胞胎女儿 Olivia 和 Sophia 以及两只非常活泼的狗 Webby 和 Georgette 生活在一起。你可以在\
  \ [`www.linkedin.com/in/selikoff`](http://www.linkedin.com/in/selikoff) 了解更多关于 Scott\
  \ 的信息。\n\n`Jeanne Boyarsky` 在纽约市的一家银行担任了 14 年的 Java 开发人员，在那里负责开发、指导和开展培训。业余之余，她还是\
  \ [CodeRanch.com](http://CodeRanch.com) 的高级版主，并参与该论坛的代码库维护工作。Jeanne 还担任一个 FIRST\
  \ 机器人小组编程部门的导师，在那里指导那些刚接触 `Java` 的学生们。\n\nJeanne 于 2002 年获得计算机科学学士学位，并于 2005 年获得计算机信息技术硕士学位。她享受全职工作的同时通过在线课程获得硕士学位，这在在线教育还不流行的那个时代！Jeanne\
  \ 还是一名优秀演讲大师（Distinguished Toastmaster）和 Scrum 大师（Scrum Master）。你可以在 [`coderanch.com/wiki/660334`](https://coderanch.com/wiki/660334)\
  \ 了解更多关于 Jeanne 的信息。\n\nScott 和 Jeanne 都是 [CodeRanch.com](http://CodeRanch.com)\
  \ 论坛的版主，可以通过那里与他们取得联系。他们还共同编写了一个名为 Down Home Country Coding 的技术博客，地址位于 [`www.selikoff.net`](http://www.selikoff.net)。\n\
  \n除了这本书之外，Scott 和 Jeanne 还是以下书籍的作者：*OCA Oracle Certified Associate Java SE 8 Programmer\
  \ I Study Guide* (Sybex, 2015) 和 *OCP Oracle Certified Professional Java SE 8 Programmer\
  \ II Study Guide* (Sybex, 2016)。最近，这两本书被合并成了单行版 *OCA / OCP Java SE 8 Programmer\
  \ Certification Kit: Exam 1Z0-808 and Exam 1Z0-809* (Sybex 2016)。\n\n87. 80\n88.\
