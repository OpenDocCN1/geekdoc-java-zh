  \n\n\n```java\npublic static void main(String[] args) {\n   List<String> list =\
  \ new LinkedList<>();\n   Deque<String> queue = new ArrayDeque<>();\n   queue.push(\"\
  all queued up\");\n   queue.push(\"last\");\n}\n\nprivate static void withFlatMap(Collection<?>\
  \ coll) {\n   Stream.of(coll)\n      .flatMap(x -> x.stream())\n      .forEach(System.out::print);\n\
