  \n## 第 20 章：Java 并发\n\n### 1\nA. `ExecutorService` 接口定义了选项 C 和 D 所示的两个 `submit()`\
  \ 方法。由于 `ExecutorService` 继承了 `Executor`，它继承了选项 B 中提供的 `execute(Runnable)` 方法。这留下了正确答案选项\
  \ A，因为 `ExecutorService` 既定义也没有继承接受 `Callable` 参数的重载方法 `execute()`。\n\n### 2\nB.\
  \ 类编译并运行没有抛出异常，使得第一个陈述为真。该类定义了两个被多个线程并行递增的值。第一个 `IntStream` 语句使用原子类来更新变量。由于更新原子数值实例在设计上是线程安全的，因此打印的第一个数字总是\
  \ 10，第二个陈述为真。第二个 `IntStream` 语句使用带有自增运算符（`++`）的 `int`，它不是线程安全的。两个线程可能同时更新并设置相同的值，这是一种竞态条件，导致结果小于\
  \ 5。由于此原因，第三个陈述不为真。由于只有前两个陈述是真实的，选项 B 是正确答案。\n\n### 3\nC. 选项 A 是错误的，尽管如果将句子中的 `Executors`\
  \ 替换为 `ExecutorService`，它就是正确的。虽然可以从 `Executors` 类获取 `ExecutorService` 实例，但 `Executors`\
  \ 类中没有可以直接执行任务的方法。选项 B 也是错误的，但如果将句子中的 `start()` 替换为 `run()`，它就是正确的。建议你重写 `run()`\
  \ 方法而不是 `start()` 方法，以使用自定义的 `Thread` 类执行任务。选项 C 是正确的，这是定义异步任务最常见的方法之一。最后，选项 D 是错误的，因为选项\
  \ A 和 B 都是错误的。\n\n### 4\nD. 陷阱！`ExecutorService` 不包含这些方法的任何一个。为了获取线程执行器的实例，你需要使用\
  \ `Executors` 工厂类。由于此原因，选项 D 是正确答案。如果问题问的是应该使用哪种 `Executors` 方法，那么正确答案将是选项 C。选项\
  \ A 和 B 不允许并发进程，不应与期望达到五个并发线程限制的 `CyclicBarrier` 使用。另一方面，选项 C 会根据需要创建线程，适用于与 `CyclicBarrier`\
  \ 使用。\n\n### 5\nC. `CopyOnWriteArrayList` 在每次修改时都会创建数组的副本，保留迭代器正在使用的值列表，即使数组被修改。由于此原因，使用\
  \ `copy1` 的 for 循环运行时不会抛出异常。另一方面，使用 `copy2` 和 `copy3` 的 for 循环在运行时都会抛出 `ConcurrentModificationException`，因为它们在迭代期间不允许修改。最后，用于\
  \ `copy4` 的 `ConcurrentLinkedQueue` 在运行时无异常完成。对于考试，请记住 `Concurrent` 类读写访问使得所有线程的访问是一致的，而\
  \ `synchronized` 类不是。由于恰好有两个 for 语句运行时产生异常，选项 C 是正确答案。\n\n### 6\nC. 资源饥饿是指单个活跃线程永远无法访问共享资源。活锁（Livelock）是资源饥饿的一种特殊情况，两个或多个活跃线程无法访问共享资源并反复该过程。由于这些原因，选项\
  \ C 是正确答案。死锁和活锁相似，但在死锁情况下，线程处于等待状态，而不是活跃或执行任何工作。最后，竞态条件是在应该按顺序完成的任务同时完成时产生的意外结果。\n\
  \n### 7\nB. 类无法编译，因为第 8 行的 `Future.get()` 抛出检查异常 `InterruptedException` 和 `ExecutionException`，这两个异常都没有\
  \ `submitReports()` 方法处理或声明。如果 `submitReports()` 和相应的 `main()` 方法都更新为声明这些异常，那么应用程序将在运行时打印\
  \ null，选项 A 将是正确答案。对于考试，请记住 `Future` 可以用于没有返回值的 `Runnable` lambda 表达式，但完成时的返回值总是\
  \ null。\n\n### 8\nA. 选项 B 和 C 都是获取 `ExecutorService` 实例的正确方法。记住 `newSingleThreadExecutor()`\
  \ 等同于调用值为 1 的 `newFixedThreadPool()`。选项 D 是请求单线程 `ScheduledExecutorService` 实例的正确方法。正确答案是选项\
  \ A。在 `Executors` 类中不存在 `newFixedScheduledThreadPool()` 方法，但存在一个名为 `newScheduledThreadPool()`\
  \ 的方法。\n\n\n\n\n\n### 9. A\n代码编译没有问题，但在运行时无限挂起。该应用程序定义了一个带有单线程的线程执行器并提交了 12 个任务。由于一次只有一个线程可以工作，第一个线程将在\
  \ `await()` 调用处无期等待。由于 `CyclicBarrier` 需要四个线程来释放它，应用程序将在冻结状态下无限等待。由于屏障从未被触发且代码发生挂起，应用程序将永远不会输出\
  \ Ready，因此选项 A 是正确答案。如果使用 `newCachedThreadPool()` 而不是 `newSingleThreadExecutor()`，那么屏障将被触发三次，此时选项\
  \ C 将是正确答案。\n\n### 10. D\n首先，`BlockingDeque` 是错误的，因为它是一个接口，而不是类。其次，`ConcurrentLinkedDeque`\
  \ 确实支持向有序数据结构的两端添加元素，但它不包含等待指定时间来执行此操作的方法（即阻塞）。`ConcurrentSkipListSet` 也是错误的，因为它的元素是排序的（sorted）而不仅仅是有序的（ordered），而且它不包含任何阻塞方法。这使得正确答案为\
  \ D。`LinkedBlockingDeque` 包含了阻塞方法，通过这些方法可以将元素添加到队列的开头或结尾，同时最多等待指定的时间。\n\n### 11.\
  \ A\n`findAny()` 方法可以返回流中的任何元素，无论该流是串行的还是并行的。虽然在串行流上这很可能是流中的第一个元素，但在并行流上，结果的确定性较低。由于如此，选项\
  \ A 是正确答案。当应用于有序流时，其他方法在串行和并行流上始终产生相同的结果。由于此原因，这些操作在并行流上可能是昂贵的，因为它们必须被强制转换为串行处理。\n\
  \n### 12. D\n静态方法 `Array.asList()` 返回一个 `List` 实例，它继承了 `Collection` 接口。虽然 `Collection`\
  \ 接口定义了 `stream()` 和 `parallelStream()` 方法，但它并不包含 `parallel()` 方法。因此，第二个流 语句无法编译，选项\
  \ D 是正确答案。如果将代码修正为使用 `parallelStream()`，那么数组将以相同的顺序一致地打印，选项 C 将是正确答案。记住 `forEachOrdered()`\
  \ 方法会强制并行流按顺序运行。\n\n### 13. D\n首先，`ForkJoinTask` 是 `RecursiveAction` 和 `RecursiveTask`\
  \ 的父类，它不包含 `compute()` 方法（无论是抽象还是具体的），这使得选项 A 和 C 自动错误。`RecursiveTask` 类包含一个使用泛型返回类型的抽象\
  \ `compute()` 方法，而 `RecursiveAction` 类包含一个使用 `void` 返回类型的抽象 `compute()` 方法。因此，选项\
  \ D 是正确答案。\n\n### 14. B\n在串行或并行归约中，累加器（accumulator）必须是结合律且无状态的。在并行归约中，无效的累加器往往产生更明显的错误，结果可能会以意外的顺序进行处理。选项\
  \ A 不符合结合律，因为对于所有值 `a`、`b` 和 `c`，`(a-b)-c` 不等于 `a-(b-c)`。例如，使用值 1、2 和 3 会得到两个不同的值：-4\
  \ 和 2。选项 C 不是无状态的，因为每次累加器运行时，类变量或实例变量 `i` 都会被修改。这留下的选项 B 是正确答案，因为它既是无状态的又符合结合律。尽管它忽略了输入参数，但它满足执行归约的资格。\n\
  \n### 15. B\n代码无法编译，因为 `Callable` 必须定义 `call()` 方法而不是 `run()` 方法，所以选项 B 是正确答案。如果修正代码以使用正确的方法名，它将无问题地完成，并在运行时打印\
  \ Done!，选项 A 将是正确答案。\n\n### 16. C\n同步访问变量的一部分是确保读/写操作是原子的，或者是在不中断的情况下发生的。例如，递增操作需要读取一个值然后立即将其写入。如果任何线程中断了这一过程，数据可能会丢失。在这方面，选项\
  \ C 显示了正确的同步访问。线程 2 读取一个值然后不中断地写入它。然后线程 1 读取新值并将其写入。其他答案都是错误的，因为一个线程在另一个线程读取和写入同一个变量之间向该变量写入了数据。由于线程正在向一个已经被另一个线程写入过的变量写入数据，可能会设置无效数据。例如，两个同时运行的递增操作可能导致其中一个递增操作丢失。\n\
  \n### 17. D\n代码编译并运行没有问题。`hare()` 和 `tortoise()` 两个方法几乎相同，其中一个调用 `invokeAll()`，另一个调用\
  \ `invokeAny()`。关键在于知道这两个方法都是同步操作的，会等待一个或多个任务的结果。调用 `invokeAll()` 方法会导致当前线程等待直到所有任务完成。由于每个任务耗时一秒且它们是并行执行的，`hare()`\
  \ 方法将大约一秒完成。`invokeAny()` 方法会导致当前线程等待直到至少有一个任务完成。尽管通常会返回第一个完成的线程的结果，但并不是保证的。然而，由于每个任务需要一秒才能完成，该方法返回的最短时间也是一秒后。在这方面，`tortoise()`\
  \ 方法也将大约一秒完成。由于两个方法花费的时间相似，任何一个都可能先完成，导致输出在运行时发生变化，选项 D 是正确答案。注意，在程序打印完两个字符串后没有终止，因为\
  \ `ExecutorService` 没有被关闭。\n\n### 18. B\n`ConcurrentSkipListMap` 实现了 `SortedMap`\
  \ 接口，在该接口中键是排序的，因此选项 B 是正确答案。虽然其他答案定义了有序数据结构，但都不保证是排序的。记住，如果在并发类名中看到 `SkipList`，意味着它是以某种方式排序的，例如排序集合或映射。\n\
  \n### 19. D\n`getQuestion()` 方法中的 `synchronized` 块需要一个对象来进行同步。如果没有它，代码无法编译，选项 D\
  \ 是正确答案。如果将命令修正为对当前对象进行同步，例如使用 `synchronized(this)` 会怎样？每个任务将获取其各自对象的锁，然后在等待几秒后请求另一个对象的锁。由于锁已被占用，两者将无限等待，导致死锁。在这种情况下，选项\
  \ A 将是正确答案，因为死锁是最可能的结果。我们说最可能是因为即使代码经过修正，死锁也不是一定会发生。有可能（尽管概率很小）JVM 在启动第二个任务之前等待五秒，留出足够的时间让第一个任务完成并完全避免死锁。\n\
  \n### 20. B\n`ScheduledExecutorService` 不包含 `scheduleAtFixedDelay()` 方法，所以选项 A 是错误的。`scheduleAtFixedRate()`\
  \ 方法会在固定的时间间隔为关联的操作创建新任务，即使之前的任务仍在运行。通过这种方式，可能多个处理相同操作的线程可能同时执行，因此选项 B 是正确答案。相反，`scheduleWithFixedDelay()`\
  \ 会在每个任务完成后才调度下一个任务，保证线程池中最多有一个处理该操作的线程处于活跃。\n\n\n\n\n\n### 21\nD. 代码可以编译，因此选项 B\
  \ 错误。`stroke` 变量是线程安全的，因为所有写入操作都封装在 `synchronized` 方法中，因此不会发生写入丢失，这使得选项 C 错误。尽管该方法是线程安全的，但在线程可能仍在执行时，已经读取了\
  \ `stroke` 的值。结果是它可能会输出 0、1000 或两者之间的任何值，因此选项 D 是正确答案。如果在打印 `stroke` 的值之前调用了 `ExecutorService`\
  \ 方法 `awaitTermination()` 且等候经过了足够的时间，那么结果将是 1000，选项 A 为正确答案。\n\n### 22\nB. 竞态条件（race\
  \ condition）是指两个本应顺序完成的任务同时完成时产生的非预期结果。其结果通常是数据的某种形式的损坏。如果两个线程都在修改同一个 `int` 变量且没有同步，那么可能会发生竞态条件，导致其中一次写入丢失。出于这个原因，选项\
  \ B 是正确答案。选项 A 是资源饥饿的描述。选项 C 和 D 分别描述了活锁（livelock）和死锁（deadlock）。\n\n### 23\nA. 代码可以编译，因此选项\
  \ C 错误。应用程序尝试递归地计算 `sheep` 数组元素的个数。例如，前两个元素由一个线程汇总，并加到数组中其余元素的总和中，而该总和由另一个线程计算。遗憾的是，该类包含一个\
  \ bug。`count` 值没有被标记为 `static`，也没有被所有的 `CountSheep` 子任务共享。在 `main()` 菜单中打印的 `count`\
  \ 值来自第一个 `CountSheep` 实例，该实例并没有修改 `count` 变量。应用程序打印 0，选项 A 是正确答案。如果 `count` 被标记为\
  \ `static`，那么应用程序将正确地对元素求和，打印 10，选项 B 将是正确答案。\n\n### 24\nD. 首先，某些流操作（如 `limit()`\
  \ 或 `skip()`）会强制并行流以串行方式运行，因此选项 A 是错误的。选项 B 也是错误的。虽然某些操作的执行时间可能更短，但无法保证任何操作实际上都会得更快。例如，`JVM`\
  \ 可能只为并行流分配单个线程。换句话说，并行流可能会提高性能，但不保证性能。选项 C 是错误的，因为并行流操作不是同步的。如果需要，由开发者来提供同步或使用并发集合。最后，选项\
  \ D 是正确答案。所有流都继承的 `BaseStream` 接口包含一个 `parallel()` 方法。当然，在存在并行流的情况下，操作的结果可能会发生（例如在使用状态相关的\
  \ lambda 表达式时），但它们都可以被变为并行的。\n\n### 25\nA. 代码可以编译且运行没有问题。如果不满足执行并行归约（parallel reduction）的所有条件，`JVM`\
  \ 将退回到单线程进程。`main()` 方法中使用的流不是并行的，但仍然应用 `groupingByConcurrent()` 方法而不会在运行时抛出异常。虽然不使用并行流会导致性能受损，但应用程序仍能正确处理结果。由于该过程按年份对数据分组，选项\
  \ A 是正确答案。\n\n### 26\nA. 代码可以编译且运行没有问题。三参数的 `reduce()` 方法返回一个泛型，而单参数的 `reduce()`\
  \ 方法返回一个 `Optional`。`concat1()` 方法接收到一个标识值 \"a\"，它将其应用于每个元素，导致归约为 `aCataHat`。`concat2()`\
  \ 方法中的 lambda 表达式反转了其输入的顺序，导致值为 `HatCat`。因此，选项 A 是正确答案。\n\n### 27\nA. 代码编译没有问题，因此选项\
  \ B 和 C 错误。`f1` 的声明使用了 `ExecutorService` 中的 `submit()` 版本，它接收一个 `Runnable` 并返回一个\
  \ `Future<?>`。调用 `f1.get()`（由于 `CountSheep` 逻辑，此处应为获取结果）会执行。由于 `f2` 的声明使用了 `submit()`\
  \ 的重载版本，它接收一个 `Callable` 并返回 `Future`。由于 `f2` 是 `Double` 类型，`CyclicBarrier` 的限制被自动装箱为\
  \ Double。结果为 3.14159。出于这些原因，选项 A 是正确答案。\n\n### 28\nC. 代码可以编译且没有问题，选项 A 和 D 错误。应用程序尝试在\
  \ `List<Integer>` 上调用 `size()`。遗憾的是，`getValue()` 方法在另一个线程正在从对象中读取时，由于 `CyclicBarrier`\
  \ 不是线程安全的，选项 C 是正确答案。由于 `add()` 方法没有同步，可能会导致数据丢失。由于 `size()` 方法在多线程环境下可能产生不准确的结果，选项\
  \ D 是错误的。注意 `ThreadSafeList` 类不是线程安全的。\n\n### 29\nD. 后自减运算符 `--` 减少值并返回原始值。这等同于原子操作\
  \ `getAndDecrement()`。前自增运算符 `++` 增加值并返回新值。这等同于 `incrementAndGet()`。出于这些原因，选项 D\
  \ 是正确答案。\n\n### 30\nB. 当 `CyclicBarrier` 超过限制时，计数器重置为零。应用程序定义了一个限制为 5 的 `CyclicBarrier`。应用程序向缓存线程池提交了\
  \ 12 个任务。在这种情况下，缓存线程池将使用 5 到 12 个线程，并在空闲时重用。通过这种方式，不需要担心耗尽线程。屏障将触发两次，每组线程打印五个 1，总共打印十个\
  \ 1。出于这些原因，选项 B 是正确答案。应用程序将无限挂起，正如下一题所示。\n\n### 31\nD. 应用程序既没有成功终止也没有在运行时抛出异常，选项\
  \ A 和 B 是错误的。它在运行时挂起，因为 `CyclicBarrier` 的限制是 5，而提交并等待的任务有 12 个。这意味着会有 2 个任务剩余，处于等待屏障限制的死锁状态，但没有任务可以触发它。出于这些原因，选项\
  \ D 是正确答案。如果任务数量是屏障限制的倍数（例如 10 而不是 12），那么应用程序仍然挂起，因为 `ExecutorService` 没有关闭。`finally`\
  \ 块中的 `isShutdown()` 不会触发关闭。\n\n### 32\nC. 代码无法编译，因为阻塞方法 `offerLast()` 和 `pollFirst()`\
  \ 分别抛出检查异常 `InterruptedException`，而 lambda 表达式没有处理它们，因此选项 C 是正确答案。如果 lambda 表达式被\
  \ `try-catch` 块包裹，那么进程将先将所有添加到队列，然后将它们全部移除，结果为 0。在这种情况下，选项 A 将是正确答案。尽管任务是并行完成，但每个流在所有任务完成之前都不会终止。注意，在正常情况下，10\
  \ 秒的时间对于向队列添加/移除元素来说足够了。\n\n\n\n\n\n### 33. A.\n首先，使用 `copy1` 和 `copy4` 的 `for`\
  \ 循环在运行时都会抛出 `ConcurrentModificationException`，因为它们在迭代期间都不允许进行修改。接下来，`CopyOnWriteArrayList`\
  \ 在每次被修改时都会创建数组的副本，从而保留迭代器正在使用的原始值列表，即使数组被修改也是如此。由于这个原因，使用 `copy2` 的 `for` 循环完成时没有抛出异常也没有创建无限循环。最后，`copy3`\
  \ 中使用的 `ConcurrentLinkedDeque` 完成后，没有产生异常或无限循环。`Concurrent` 集合对读写访问进行排序，使得对类的访问在所有线程和进程（甚至是迭代器）中都是一致的。由于值是通过\
  \ `push()` 插入到队列头部，且底层数据结构是有序的，新值将不会被迭代，循环将结束。由于没有任何 `for` 语句在运行时都没有产生无限循环，因此选项\
  \ A 是正确答案。如果在第三个循环中使用 `push()` 代替 `offer()`，且新值被插入到队列的尾部而不是头部，那么 `for` 循环将进入无限循环，选项\
  \ B 将是正确答案。\n\n### 34. B.\n选项 A、C 和 D 是 Java 使用 `collect()` 方法执行并发归约的精确要求，该方法接受一个\
  \ `Collector` 参数。回想你学习过的知识，如果一个 `Collector` 分别具有 `Collector.Characteristics` 枚举值\
  \ `CONCURRENT` 和 `UNORDERED`，则它被认为是并发的且无序的。选项 B 是正确答案，因为流的元素在执行并行归约时不需要实现 `Comparable`\
  \ 接口。\n\n### 35. D.\n该类可以编译并运行而没有问题，因此选项 A 和 B 是错误的。`fork/join` 框架的目的是使用并行处理在多个线程中并发完成子任务。遗憾的是，在现有的\
  \ `compute()` 方法内部调用 `compute()` 并会产生新线程。结果是，尽管有线程池可用，该任务仍使用单线程完成。由于这个原因，选项 D 是正确答案。为了正确实现\
  \ `fork/join` 框架，需要重写 `compute()` 方法。应该将 `f1.compute()` 调用替换为 `f1.fork()` 以产生一个独立的任务，随后调用\
  \ `f2.compute()` 在当前线程上处理数据，最后通过 `f1.join()` 获取在处理 `f2.compute()` 期间完成的第一个任务的结果。如果代码按照描述进行重写，那么选项\
  \ C 将是正确答案。\n\n### 36. D.\n`shutdown()` 方法防止添加新任务，但允许现有任务完成。除了防止添加新任务外，`shutdownNow()`\
  \ 方法还尝试停止所有正在运行的任务。这两个方法都不保证任何任何任务会被停止，因此选项 D 是正确答案。选项 C 是错误的，因为 `ExecutorService`\
  \ 中没有 `halt()` 方法。\n\n### 37. B.\n首先，该类使用了 `synchronized` 列表，它是线程安全的并允许多个线程进行修改，因此选项\
  \ D 是错误的。该过程生成了一个从 1 到 5 的数字列表，并将它们发送到并行流中，在流中应用 `map()` 时，可能是无序的。这导致元素以随机顺序写入 `db`。随后，流对其元素应用了\
  \ `forEachOrdered()` 方法，这将强制并行流进入单线程状态。在运行时，`p1` 行每次都会按顺序打印结果 12345。另一方面，由于元素是随机顺序添加到\
  \ `db` 的，因此 `p2` 行的输出是随机的，无法提前预测。由于结果有时可能相同，因此选项 B 是正确答案。结果不确定的部分原因是问题使用了有状态的 Lambda\
  \ 表达式，根据你的学习知识，这在实践中应该被避免！\n\n### 38. C.\n程序可以编译，且在运行时不会抛出异常，因此选项 B 和 D 是错误的。该类尝试以线程安全的方式对单个\
  \ `cookie` 变量添加和删除值，但失败了，因为 `deposit()` 和 `withdrawal()` 方法在不同的对象上进行同步。实例方法 `deposit()`\
