  \ You up? 并使选项 A 成为正确答案。\n\n### 40\nB. 该类可以编译并运行，没有问题，因此选项 D 是错误的。该类定义了三个变量，其中只有一个变量是可序列化的。第一个变量\
  \ `chambers` 是可序列化的，值 2 被写入磁盘然后从磁盘读取。注意，当类被反序列化时，不会执行构造函数和实例初始化。下一个变量 `size` 是 `transient`。它在写入磁盘时被丢弃，因此从磁盘读取时它具有默认对象值\
  \ `null`。最后，变量 `color` 是 `static` 的，这意味着它被类的所有实例共享。尽管在实例序列化时该值是 RED，但该值没有被写入磁盘，因为它不是实例的一部分。在两个\
  \ `try-with-resources` 块之间的构造函数调用 `new Value()` 将此值设置为 BLUE，这是应用程序稍后打印的值。由于这些原因，该类打印\
  \ 2,null,BLUE，使选项 B 成为正确答案。\n\n## 第 19 章：Java 文件 I/O (NIO.2)\n\n### 1\nC. 符号链接是一个包含指向文件系统内另一个文件或目录引用的文件，这使得选项\
  \ A 和 B 错误。此外，不存在所谓的“不规则文件”。选项 C 是正确答案，因为普通文件不是目录且包含内容，与符号链接或资源不同。选项 D 也是错误的，因为所有的符号链接都存储为文件而不是目录，即使它们的目标是一个目录。\n\
  \n### 2\nC. NIO.2 的 `Path` 接口包含 `getRoot()` 和 `toRealPath()` 方法。另一方面，`isDirectory()`\
  \ 方法位于 NIO.2 的 `Files` 类中，而 `listFiles()` 方法位于 `java.io.File` 类中。由于这些原因，选项 C 是正确答案。\n\
  \n### 3\nA. 代码无法编译，因为没有包含 `isHidden()` 方法的 NIO.2 类 `File`，这使得选项 A 是正确答案。虽然有一个 `java.io.File`\
  \ 类，但它也不包含 `isHidden()` 方法。正确的调用方式是 `Files.isHidden()`。在实际考试中，请检查 `File` 与 `Files`\
  \ 以及 `Path` 与 `Paths` 的区别。如果使用了正确的方法调用，程序将打印 Found!，选项 C 将是正确答案。\n\n### 4\nD. 广度优先遍历是在移动到下一层之前，访问同一层级（或距离起始路径相同相同）的所有元素。另一方面，深度优先遍历是在移动到同一层级的另一个路径之前，访问每个元素从开始到结束的整个路径。`walk()`\
  \ 和 `find()` 都使用深度优先遍历，因此选项 D 是正确答案。\n\n### 5\nA. 读取属性接口是通过一次与底层文件系统的交互完成的。另一方面，使用单独的\
  \ `Files` 方法读取多个文件属性，每次方法调用都需要与文件系统进行往返。由于这些原因，选项 A 是正确答案。选项 B 是错误的，因为没有东西保证它会执行得更快，特别是当\
  \ `Files` 方法仅用于读取单个属性时。对于多次调用，预计会更快，但该陈述使用了 *guarantees*（保证）一词，这是错误的。选项 C 也是错误的，因为两者对符号链接都有内置支持。最后，选项\
  \ D 是错误的，因为这个讨论与内存泄漏无关。\n\n### 6\nB. 首先，该类可以编译，没有问题。但它并非没有问题。j1 行的 `Files.isSameFile()`\
  \ 方法调用首先检查 `Path` 值在 `equals()` 方面是否相等。一个是绝对路径，另一个是相对路径，因此此测试将失败。`isSameFile()`\
  \ 方法随后验证两个 `Path` 值是否引用同一个文件系统对象。由于我们知道目录不存在，j1 行的 `isSameFile()` 调用将在运行时产生 `NoSuchFileException`，使选项\
  \ B 答案。\n\n### 7\nB. 当路径包含一个指向自身或其父级路径的符号链接时，就会产生循环，触发无限深度的遍历。尽管如此，`Files.walk()`\
  \ 默认不跟随符号链接。由于这个原因，循环从未被激活，代码将在运行时打印一个数字，使选项 B 成为正确答案。如果在调用 `Files.walk()` 时使用了\
  \ `FOLLOW_LINKS` 枚举值，它将触发循环并在运行时产生 `FileSystemLoopException`，选项 A 将是正确答案。\n\n###\
  \ 8\nB. `length()` 和 `getLength()` 方法不存在于 `Files` 类，使得选项 A 和 C 错误。记住 `java.io.File`\
  \ 方法检索磁盘上文件的大小。NIO.2 的 `Files` 类包含了 `Files.size()` 方法来实现相同的功能。由于这些原因，选项 B 是正确答案。\n\
  \n### 9\nD. 代码可以编译，没有问题，使得选项 C 是错误的。虽然 tricks 在归一化后的路径 `/bag/of/disappear.txt` 中会被丢，但没有\
  \ `normalize()` 调用，因此 `path.subpath(2,3)` 在第 5 行返回 tricks。在第 6 行，调用 `getName()`\
  \ 在运行时抛出 `IllegalArgumentException`。由于 `getName()` 索引从 0 开始且只有一个元素，第 6 行的调用抛出了 `IllegalArgumentException`，选项\
  \ D 是正确答案。如果使用的是 `getName(0)` 而不是 `getName(1)`，则程序将无问题地运行并打印 `/home/tricks`，选项 A\
  \ 将是正确答案。\n\n### 10\nA. NIO.2 `Files` 类包含 `isSameFile()` 方法。`length()` 和 `mkdir()`\
