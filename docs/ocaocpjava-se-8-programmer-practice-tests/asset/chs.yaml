  \ D 和 E 是正确的。\n\n### 29. B, D\n首先，选项 A 是错误的，因为重写的方法可以抛出范围更窄的异常，但不能抛出范围更宽的异常（checked\
  \ exception）。选项 B 是正确的，这是重写方法返回类型的规则。选项 C 是错误的，因为重写的方法必须使用相同的输入参数。如果输入参数不同，则该方法是重载而不是重写。选项\
  \ D 是正确的，因为不允许使用限制继承方法访问权限的修饰符。选项 E 是错误的，因为 `private` 和 `static` 方法不能被重写。记住，定义在父类中的\
  \ `private` 方法不会被继承，即在子类中不可见，而 `static` 方法可能可见但不能被重写，因为它们不属于某个实例。最后，选项 F 也是错误的。`@Override`\
  \ 注解是可选的，推荐使用但不是强制的。\n\n### 30. D\n最常见的方法是 III，它适用于任何第一列为 `int` 的 `SELECT` 语句。如果\
  \ `SELECT` 语句的第一列有像 `count(*)` 或 `sum(*)` 之类的函数，那么 `ResultSet` 中总有一行，因此 II 同样有效。因此，选项\
  \ D 是答案。\n\n### 31. E\n`DoubleBinaryOperator` 接收两个 `double` 值并返回一个 `double` 值。`LongToIntFunction`\
