  \ C 是正确答案。如果将方法调用更改为 `getAsBoolean()`，代码的其他部分将无问题地编译，并在运行时打印 `Plenty!`，此时选项 A 将是正确答案。\n\
  \n### 40\nB. Java 只支持单一返回数据类型或 `void`。因此，无法定义一个返回两个数据类型的函数式接口，使得选项 A 错误。虽然 Java\
  \ 不包含对包含 `float`、`char` 或 `short` 的原始函数式接口的内置支持，但并没有阻止开发者在自己的项目中创建它们，使得选项 B 是陈陈且正确的答案。选项\
  \ C 是错误的，因为可以定义不接收值并返回 `void` 的函数式接口。事实上，`Runnable` 就是这样一个例子。选项 D 也是错误的，因为 `IntFunction<R>`\
  \ 接收原始参数作为输入，泛型参数作为返回类型。\n\n## 第 15 章：Java Stream API\n\n### 1\nD. 选项 A 是错误的，因为它没有打印一行。`peek()`\
  \ 方法是一个中间操作。由于没有终端操作，流管道不会被执行，因此 `peek()` 方法永远不会被执行。选项 B 和 C 是错误的，因为它们分别通过使用方法引用和\
  \ lambda 正确地输出了一行，且没有使用任何不良实践。选项 D 是答案。它确实输出了一行。但是，让 `peek()` 方法具有像修改变量那样的副作用是糟糕的实践。\n\
  \n### 2\nA. 这段代码生成了一个无限整数流：1, 2, 3, 4, 5, 6, 7, 等。`Predicate` 检查元素是否大于 5。通过 `anyMatch()`，流管道一旦遇到元素\
  \ 6 就会结束，代码打印 `true`。对于 `allMatch()` 和 `noneMatch()` 运算符，它们发现流中的第一个元素不匹配，代码打印 `false`。因此，选项\
  \ A 是正确的。\n\n### 3\nB. 只有 `average()` 方法返回 `OptionalDouble`。这反映了当你没有任何数字时，计算平均值是没有意义的。相比之下，在没有任何数字的情况下进行计数得到的是\
  \ `long` 类型数字 0，而求和得到的是 `double` 类型数字 0.0。由于只有一个方法匹配返回类型，因此选项 B 是正确的。\n\n### 4\n\
  C. `map()` 方法可以填补空白。lambda 将 `String` 转换为 `int`，Java 使用自动装箱将其转换为 `Integer`。`mapToInt()`\
  \ 方法也可以填补此空白，且 Java 甚至不需要自动装箱。Stream API 中没有 `mapToObject()`。注意在 `IntStream` 上有一个同名相似的\
  \ `mapToObj()` 方法。由于 `map()` 和 `mapToInt()` 在这里都有效，因此选项 C 是正确的。\n\n### 5\nD. `average()`\
  \ 方法返回 `OptionalDouble`。此接口有一个 `getAsDouble()` 方法而不是 `get()` 方法，因此代码可以编译。然而，流是空的，所以该可选值也是空的。当尝试获取值时，代码抛出\
  \ `NoSuchElementException`，使得选项 D 是正确的。\n\n### 6\nD. 选项 A 是错误的，因为 `anyMatch()` 返回\
  \ `boolean`。选项 B 是错误的，因为 `filter()` 是中间操作而非终端操作，因此返回一个 `Stream`。这两个方法都接受一个 `Predicate`\
  \ 作为参数。虽然 `findAny()` 确实返回一个 `Optional`，但它不接受任何参数。因此，选项 C 是错误的，选项 D 是答案。\n\n###\
  \ 7\nB. 此代码构建了一个包含两个元素的列表。收集器尝试使用每个流元素的字符数作为 map 中的键。这对于前两个元素 speak 和 bark 是工作正常的，因为它们的长度分别是\
  \ 5 和 4。由于流是按长度排序，它获取获取第一个值。\n\n### 8\nB. 原始流（如 `LongStream`）声明 `average()` 方法，而汇总统计类（如\
  \ `LongSummaryStatistics`）声明 `getAverage()` 方法，使得选项 C 和 D 错误。`average()` 方法返回 `OptionalDouble`，它声明的是\
  \ `getAsDouble()` 方法而不是 `get()` 方法。\n\n### 9\nB. 由于 `collect()` 的结果没有被存储在变量中或以任何方式使用，所有代码都需要编译。没有\
  \ `Collectors.toList()` 方法。如果你想指定 `ArrayList`，可以调用 `Collectors.toCollection(ArrayList::new)`。`Collectors.toList()`\
  \ 方法确实存在且编译。`toMap()` 方法需要两个参数来指定键和值函数。由于只有一个可以编译，选项 B 是正确的。\n\n### 10\nC. 尽管很有吸引力，但你无法直接将\
  \ `Map` 转换为 `Stream`，这意味着你无法对其调用 `map()` 方法。然而，你可以从键、值或键值对中构建 `Stream`。由于此代码无法编译，选项\
  \ C 是正确的。\n\n### 11\nD. I 是错误的，因为 `isPresent()` 对于空 `Optional` 会返回 `false`。II 是错误的，因为如果你尝试传递空引用，`of()`\
  \ 会抛出 `NullPointerException`。III 不会抛出异常，因为 `ofNullable()` 设计上允许空引用。然而，它返回 false，因为没有值存在。由于选项都不正确，选项\
  \ D 是答案。\n\n### 12\nA. 这段代码可以编译。注意导入是隐含的，包括对 `Collectors` 的静态导入。收集器尝试使用每个流元素的字符数作为\
  \ map 中的键。这对于前两个元素 speak 和 bark 是工作良好的，因为它们的长度分别是 5 和 4。当它遇到 meow 时，它发现了另一个为 4 的键。合并函数说使用第一个，所以它选择了\
  \ bark。同样，growl 是 5 个字符，但使用了第一个值 speak。只有两个不同的长度，因此选项 A 是正确的。\n\n### 13\nC. 对于包含\
