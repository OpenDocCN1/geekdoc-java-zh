  trans: "\n\n![](img/image_rsrc1XX.jpg)\n\n# 50 道 Java 初级与中级练习\n学习 Java 程序的实用方法\n\
    Daniel Christofis\n\n## 目录\n- 标题页\n- 引言\n- 第 1 部分：Java 基础介绍\n- 第 2 部分：控制结构详解\n\
    - 第 3 部分：数组操作\n- 第 4 部分：基础面向对象概念\n- 第 5 部分：探索 Java 库\n- 第 6 部分：高级 OOP \n- 第 7\
    \ 部分：数据结构与算法\n- 第 8 部分：文件操作与序列化\n- 第 9 部分：并发与多线程\n- 第 10 部分：Java 高级库与特性\n- 第 1\
    \ 部分答案\n- 第 2 部分答案\n- 第 3 部分答案\n- 第 4 部分答案\n- 第 5 部分答案\n- 第 6 部分答案\n- 第 7 部分答案\n\
    - 第 8 部分答案\n- 第 9 部分答案\n- 第 10 部分答案\n\n## 引言\n欢迎阅读《50 道 Java 初级与中级练习》，这本书将作为你掌握\
    \ Java 编程的指南。无论你是完全初学者，还是想温习高级话题，这个合集都将是一份宝贵的资源。每个章节都旨在挑战你的能力，鼓励动手实践，并加深你对 Java\
    \ 强大能力的理解。\n\nJava 是一种强大的、高级的面向对象编程语言，已成为软件开发行业标准。由 Sun Microsystems 在 1995 年开发的\
    \ Java “编写一次，随处运行”原则提供了跨平台的互操作性，使其成为设计跨平台应用程序的理想选择。它的语法简单简洁，允许开发者编写既高效又易于维护的代码。Java\
    \ 以其健壮性、安全执行和大型标准库而闻名，这简化了从数据结构到网络连接的切工作。此外，Java 一直处于移动应用、企业服务器和嵌入式设备的前沿，在现代计算的增长中起着至关重要的作用。凭借庞大的开发者社区和持续的就业市场需求，Java\
    \ 是行业中的重要力量。\n\n## 第 1 部分：Java 基础介绍\n深入学习 Java 的基础方面。在这里，你将从经典的“Hello World!”开始，逐步接触变量、用户输入和基础控制结构等核心话题。在本部分结束时，你将熟练掌握该语言的基础构建块。\n\
    \n## 第 2 部分：控制结构详解\n在基础的基础上，本部分将深入探讨控制结构。掌握循环的艺术，理解如何控制程序流，并学习利用三元运算符等决策构造结构的力量。\n\
    \n## 第 3 部分：数组操作\n数组是 Java 中不可或的数据结构。在这里，你将学习声明、初始化和操作数组。通过掌握这些任务，你将很好地掌握这种基础数据结构。\n\
    \n## 第 4 部分：基础面向对象概念\nJava 是一门面向对象的语言，本部分将向你介绍它的核心概念。接触类、构造函数、方法重载、继承以及 `this`\
    \ 关键字的意义。\n\n## 第 5 部分：探索 Java 库\nJava 标准库非常庞大且功能丰富。本部分将展示一些常用库，重点关注字符串处理、数学计算、日期/时间功能、动态集合和异常处理。\n\
    \n## 第 6 部分：高级 OOP 概念\n超越面向对象编程的基础。深入研究接口、抽象类、多态、枚举和嵌套类。在这里，你将看到 Java 通过其 OOP\
    \ 范式提供的真正力和灵活性。\n\n## 第 7 部分：数据结构与算法\n每个程序员都应该对数据结构和算法有坚实的掌握。在本部分，练习实现链表和树等基础数据结构，并尝试从排序到递归的算法。\n\
    \n## 第 8 部分：文件操作与序列化\n学习使用 Java 与文件系统交互。向文件写入、读取文件、序列化对象以及导航目录。这些练习将让你对 Java 的\
    \ I/O 能力有全面的理解。\n\n## 第 9 部分：并发与多线程\n并发是 Java 的一大优势。通过这些练习，你将学习创建线程、同步化方法以避免竞态条件、处理死锁并利用现代多线程系统的力量。\n\
    \n## 第 10 部分：Java 高级库与特性\n本部分封装了 Java 中的高级特性和库。尝试使用 Stream 处理数据，利用 Lambda 表达式的简洁力量，使用反射检查类，使用正则表达式验证输入，并探索\
    \ Java NIO 的异步能力。\n\n## 第 1 部分：Java 基础介绍\n### 1-1. Hello World!\n编写一个在控制台打印“Hello,\
    \ World!”的程序。\n\n### 1-2. 变量与类型\n声明两个整数变量 `a` 和 `b`，为赋值并打印它们的和、差和乘积。\n\n### 1-3.\
    \ 用户输入\n编写一个程序询问用户的姓名，然后打印问候语。\n\n### 1-4. 条件语句\n编写一个程序询问用户一个数字并判断它是偶数还是奇数。\n\n\
    ### 1-5. 基础循环\n使用循环打印 1 到 10。\n\n## 第 2 部分：控制结构详解\n### 2-1. 嵌套循环\n打印一个直角三角形。\n\
    \n### 2-2. While 循环\n提示输入数字直到输入 0，然后显示输入数字的和。\n\n### 2-3. Switch Case\n编写一个程序询问用户几（1-7），并打印对应的星期名称。\n\
    \n### 2-4. Break 和 Continue\n打印 1 到 50，但跳过 5 的倍数。\n\n### 2-5. 三元运算符\n询问用户一个数字并使用三元运算符判断它是正、负还是零。\n\
    \n## 第 3 部分：数组操作\n### 3-1. 声明与初始化\n声明一个整数数组并初始化值。打印所有值。\n\n### 3-2. 寻找最大值\n寻找整数数组中的最大值。\n\
    \n### 3-3. 反转数组\n编写一个反转数组的程序。\n\n### 3-4. 数字平均值\n计算数组数字的平均值。\n\n### 3-5. 统计奇偶\n\
    统计数组中奇数和偶数的个数。\n\n## 第 4 部分：基础面向对象概念\n### 4-1. 创建简单类\n创建一个 `Person` 类，具有 `name`\
    \ 和 `age` 属性，以及获取和这些属性的方法。\n\n### 4-2. 类构造函数\n修改 `Person` 类包含一个初始化属性的构造函数。\n\n\
    ### 4-3. 方法重载\n在 `Person` 类中重载方法以实现多种方式设置属性。\n\n### 4-4. 创建子类\n从 `Person` 类创建一个\
    \ `Student` 子类，增加一个 `grade` 额外属性。\n\n### 4-5. 'this' 关键字的使用\n修改 `Person` 类，在方法中使用\
    \ `this` 关键字进行属性赋值。\n\n"
- fmt: "\n# Section 6: Advanced OOP Concepts\n\n## 6-1. Interface Implementation\n\
    Create an interface named `Drivable` with methods `start()`, `drive()`, and `stop()`.\
    \ Implement this interface in classes `Car` and `Boat`.\n\n## 6-2. Abstract Classes\n\
    Design an abstract class named `Appliance` with attributes `brand` and `price`\
    \ and methods `turnOn()` and `turnOff()`. Extend this class with concrete classes\
    \ `WashingMachine` and `Refrigerator`.\n\n## 6-3. Polymorphism\nUsing the previously\
    \ created `Drivable` interface, create a method in a separate class that makes\
    \ any drivable object move (`drive` and `stop`).\n\n## 6-4. Enumerations\nCreate\
    \ an enum representing the days of the week. Add a method within this enum that\
    \ returns whether the day is a weekday or a weekend.\n\n## 6-5. Inner Classes\n\
    Design a class `Outer` that has an inner class `Inner`. Instantiate the inner\
    \ class from an external class.\n\n# Section 7: Data Structures & Algorithms\n\
    \n## 7-1. Doubly Linked List\nImplement a basic doubly linked list with methods\
    \ to add, delete, and search for elements.\n\n## 7-2. Stack Using LinkedList\n\
    Write a Java program to implement a stack using linked lists.\n\n## 7-3. Basic\
    \ Binary Tree\nImplement a basic binary tree with methods to add and search for\
    \ an element.\n\n## 7-4. Bubble Sort\nImplement the bubble sort algorithm on an\
    \ array of integers.\n\n## 7-5. Recursion\nWrite a recursive method to find the\
    \ factorial of a number.\n\n# Section 8: File Operations & Serialization\n\n##\
    \ 8-1. Write to File\nWrite a program to write a list of strings to a text file.\n\
    \n## 8-2. Read from File\nRead the content of a text file and print it to the\
    \ console.\n\n## 8-3. Serialization\nSerialize an object of a custom class to\
    \ a file and then deserialize it back.\n\n## 8-4. Directory Listing\nList all\
    \ files and directories in a given directory path.\n\n## 8-5. Buffered Streams\n\
    Use buffered streams to copy the content from one file to another.\n\n# Section\
    \ 9: Concurrency & Multi-threading\n\n## 9-1. Basic Thread Creation\nCreate a\
