  raw: 'Section 6: Advanced OOP Concepts


    6-1\. Interface Implementation


    Create an interface named Drivable with methods start(), drive(), and stop().
    Implement this interface in classes Car and Boat.


    6-2\. Abstract Classes


    Design an abstract class named Appliance with attributes brand and price and methods
    turnOn() and turnOff(). Extend this class with concrete classes WashingMachine
    and Refrigerator.


    6-3\. Polymorphism


    Using the previously created Drivable interface, create a method in a separate
    class that makes any drivable object move (drive and stop).


    6-4\. Enumerations


    Create an enum representing the days of the week. Add a method within this enum
    that returns whether the day is a weekday or a weekend.


    6-5\. Inner Classes


    Design a class Outer that has an inner class Inner. Instantiate the inner class
    from an external class.


    Section 7: Data Structures & Algorithms


    7-1\. Doubly Linked List


    Implement a basic doubly linked list with methods to add, delete, and search for
    elements.


    7-2\. Stack Using LinkedList


    Write a Java program to implement a stack using linked


    lists.


    7-3\. Basic Binary Tree


    Implement a basic binary tree with methods to add and search for an element.


    7-4\. Bubble Sort


    Implement the bubble sort algorithm on an array of integers.


    7-5\. Recursion


    Write a recursive method to find the factorial of a number.


    Section 8: File Operations & Serialization


    8-1\. Write to File


    Write a program to write a list of strings to a text file.


    8-2\. Read from File


    Read the content of a text file and print it to the console.


    8-3\. Serialization


    Serialize an object of a custom class to a file and then deserialize it back.


    8-4\. Directory Listing


    List all files and directories in a given directory path.


    8-5\. Buffered Streams


    Use buffered streams to copy the content from one file to another.


    Section 9: Concurrency & Multi-threading


    9-1\. Basic Thread Creation


    Create a basic thread by extending the Thread class and another by implementing
    the Runnable interface.


    9-2\. Synchronized Methods


    Demonstrate the use of synchronized methods to avoid race conditions between multiple
    threads.


    9-3\. Deadlocks


    Write a program that intentionally causes a deadlock, then fix it.


    9-4\. Callable and Future


    Use Callable to compute the factorial of a number in a separate thread and fetch
    the result using Future.


    9-5\. Thread Interruption


    Start a thread that runs in an infinite loop. Demonstrate how to gracefully interrupt
    and stop the thread.


    Section 10: Java Advanced Libraries & Features


    10-1\. Java Streams Advanced


    Use Java Streams to filter, sort, and transform a collection of custom objects.


    10-2\. Lambda Expressions


    Replace an anonymous inner class used for handling a button click event in a GUI
    application with a lambda expression.


    10-3\. Reflection


    Write a program that inspects a class''s methods and annotations using Java''s
    reflection API.


    10-4\. Regular Expressions


    Prompt the user for an email address and validate it using a regular expression.


    10-5\. Java NIO


    Demonstrate the use of Java NIO to read and write to a file asynchronously.


