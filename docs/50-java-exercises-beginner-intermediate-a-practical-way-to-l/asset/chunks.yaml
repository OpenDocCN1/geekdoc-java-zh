    ## Introduction

    Welcome to the "50 Java Exercises Beginner & Intermediate" book, your guide to
    mastering Java programming. Whether you''re an absolute beginner or looking to
    brush up on advanced topics, this collection will serve as a valuable resource.
    Each section is designed to challenge you, encourage hands-on practice, and deepen
    your understanding of Java''s vast capabilities.


    Java is a strong, high-level, object-oriented programming language that has become
    a software development industry standard. Java''s "Write Once, Run Anywhere" principle,
    developed by Sun Microsystems in 1995, provides interoperability across multiple
    platforms, making it a great choice for designing cross-platform applications.
    Its syntax is straightforward and concise, allowing developers to write code that
    is both efficient and manageable. Java is well-known for its resilience, secure
    execution, and large standard library, which simplifies everything from data structures
    to network connectivity. Furthermore, Java has been at the vanguard of mobile
    applications, enterprise servers, and embedded devices, playing a crucial part
    in the growth of modern computing. With its large developer community and ongoing
    employment market demand, Java is a prominent force in the industry.


    ## Section 1: Introduction to Java Basics

    Dive into the fundamental aspects of Java. Here, you''ll begin with the classic
    "Hello World!" and progressively touch on core topics like variables, user input,
    and basic control structures. By the end of this section, you''ll be comfortable
    with the foundational blocks of the language.


    ## Section 2: More on Control Structures

    Building upon the basics, this section delves deeper into control structures.
    Master the art of loops, understand how to control program flow, and learn to
    utilize the power of decision-making constructs like the ternary operator.


    ## Section 3: Working with Arrays

    Arrays are essential data structures in Java. Here, you will learn to declare,
    initialize, and manipulate arrays. By mastering these tasks, you''ll have a good
    grasp of this fundamental data structure.


    ## Section 4: Basic Object-Oriented Concepts

    Java is an object-oriented language, and this section introduces you to its core
    concepts. Engage with classes, constructors, method overloading, inheritance,
    and the significance of the `this` keyword.


    ## Section 5: Exploring Java Libraries

    The Java standard library is vast and feature-rich. This section offers a glimpse
    into some commonly used libraries, focusing on string manipulation, mathematical
    computations, date-time functionalities, dynamic collections, and handling exceptions.


    ## Section 6: Advanced OOP Concepts

    Go beyond the basics of object-oriented programming. Dive deep into interfaces,
    abstract classes, polymorphism, enumerations, and nested classes. Here, you''ll
    see the true power and flexibility that Java offers through its OOP paradigm.


    ## Section 7: Data Structures & Algorithms

    Every programmer should have a firm grasp on data structures and algorithms. In
    this section, practice implementing foundational data structures like linked lists
    and trees, and experiment with algorithms ranging from sorting to recursion.


    ## Section 8: File Operations & Serialization

    Learn to interact with the file system using Java. Write to files, read from them,
    serialize objects, and navigate directories. These exercises will give you a comprehensive
    understanding of Java''s I/O capabilities.


    ## Section 9: Concurrency & Multi-threading

    Concurrency is a major strength of Java. Through these exercises, you''ll learn
    to create threads, synchronize methods to avoid race conditions, handle deadlocks,
    and leverage the power of modern multi-threaded systems.


    ## Section 10: Java Advanced Libraries & Features

    This section encapsulates advanced features and libraries in Java. Experiment
    with streams for data manipulation, harness the succinct power of lambda expressions,
    introspect classes with reflection, validate input using regular expressions,
    and explore the asynchronous capabilities of Java NIO.


    ## Section 1: Introduction to Java Basics

    ### 1-1. Hello World!

    Write a program that prints "Hello, World!" to the console.


    ### 1-2. Variables and Types

    Declare two integer variables `a` and `b`, assign them values and print the sum,
    difference, and product.


    ### 1-3. User Input

    Write a program that asks the user for their name and then prints a greeting using
    their name.


    ### 1-4. Conditional Statements

    Write a program that asks the user for a number and determines if it''s even or
    odd.


    ### 1-5. Basic Looping

    Use a loop to print numbers from 1 to 10.


    ## Section 2: More on Control Structures

    ### 2-1. Nested Loops

    Print a pattern forming a right-angled triangle.


    ### 2-2. While Loop

    Prompt the user to enter numbers until they enter 0, then display the sum of entered
    numbers.


    ### 2-3. Switch Case

    Write a program that asks the user for a day of the week (1-7) and prints the
    corresponding day name.


    ### 2-4. Break and Continue

    Print numbers from 1 to 50, but skip numbers by 5.


    ### 2-5. The Ternary Operator

    Ask the user for a number and determine if it''s positive, negative, or zero using
    the ternary operator.


    ## Section 3: Working with Arrays

    ### 3-1. Declare and Initialize

    Declare an array of integers and initialize it with values. Print all the values.


    ### 3-2. Find the Maximum

    Find the maximum value in an integer array.


    ### 3-3. Reverse an Array

    Write a program to reverse an array.


    ### 3-4. Average of Numbers

    Calculate the average of numbers in an array.


    ### 3-5. Count Odd and Even Numbers

    Count the number of odd and even numbers in an array.


    ## Section 4: Basic Object-Oriented Concepts

    ### 4-1. Create a Simple Class

    Create a class `Person` with attributes `name` and `age`, and methods to set and
    get these attributes.


    ### 4-2. Class Constructor

    Modify the `Person` class to include a constructor that initializes the attributes.


    ### 4-3. Method Overloading

    Overload a method in the `Person` class to have multiple ways to set attributes.


    ### 4-4. Create a Subclass

    Create a `Student` subclass from the `Person` class with an additional attribute
    for `grade`.


    ### 4-5. Use of ''this'' Keyword

    Modify the `Person` class to use the `this` keyword for attribute assignment in
    methods.


    ## Section 5: Exploring Java Libraries own### 5-1. String Manipulation

    Prompt the user for a string and print its length, uppercase, and lowercase forms.


    ### 5-2. Math Library

    Use Java''s `Math` library to calculate and display the square root of a number.


    ### 5-3. Date Class

    Get and display the current date and time using Java''s `Date` class.


    ### 5-4. ArrayList Basics

    Create an `ArrayList` of strings, add some values, remove a value, and display
    the list.


    ### 5-5. Exception Handling

    Write a program that handles an `arithmeticException` (e.g., divide by zero).

    '
