  Number of even numbers: 5\nNumber of odd numbers: 5\n\n# 第 4 解答\n\n## 4-1. 创建一个简单的类\n\
  \n```java\nclass Person {\n    String name;\n    int age;\n    void setName(String\
  \ name) {\n        this.name = name;\n    }\n    String getName() {\n        return\
  \ name;\n    }\n    void setAge(int age) {\n        this.age = age;\n    }\n   \
  \ int getAge() {\n        return age;\n    }\n}\n```\n\n## 4-2. 类构造函数\n\n```java\n\
  class PersonWithConstructor {\n    String name;\n    int age;\n    PersonWithConstructor(String\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
  \    void display() {\n        System.out.println(\"Name: \" + name + \", Age: \"\
  \ + age);\n    }\n}\n```\n\n## 4-3. 方法重载\n\n```java\nclass PersonWithOverloading\
  \ {\n    String name;\n    int age;\n    void setInfo(String name) {\n        this.name\
  \ = name;\n    }\n    void setInfo(int age) {\n        this.age = age;\n    }\n\
  \    void setInfo(String name, int age) {\n        this.name = name;\n        this.age\
  \ = age;\n    }\n    void display() {\n        System.out.println(\"Name: \" + name\
  \ + \", Age: \" + age);\n    }\n}\n```\n\n## 4-4. 创建一个子类\n\n```java\nclass Student\
  \ extends Person {\n    String grade;\n    void setGrade(String grade) {\n     \
  \   this.grade = grade;\n    }\n    String getGrade() {\n        return grade;\n\
  \    }\n}\n```\n\n## 4-5. 'this' 关键字的使用\n\n```java\nclass PersonWithThis {\n   \
  \ String name;\n    int age;\n    PersonWithThis(String name, int age) {\n     \
  \   this.name = name;\n        this.age = age;\n    }\n    void setName(String name)\
  \ {\n        this.name = name;\n    }\n    void setAge(int age) {\n        this.age\
  \ = age;\n    }\n    void display() {\n        System.out.println(\"Name: \" + this.name\
  \ + \", Age: \" + this.age);\n    }\n}\n```\n\n你可以通过在 main 方法中创建对象、设置它们的属性并调用方法来测试每个类。\n\
