  \ 部分：并发与多线程\n- 第 10 部分：Java 高级库与特性\n- 第 1 部分答案\n- 第 2 部分答案\n- 第 3 部分答案\n- 第 4 部分答案\n\
  - 第 5 部分答案\n- 第 6 部分答案\n- 第 7 部分答案\n- 第 8 部分答案\n- 第 9 部分答案\n- 第 10 部分答案\n\n## 引言\n\
  欢迎阅读《50 道 Java 初级与中级练习》，这本书将作为你掌握 Java 编程的指南。无论你是完全初学者，还是想温习高级话题，这个合集都将是一份宝贵的资源。每个章节都旨在挑战你的能力，鼓励动手实践，并加深你对\
  \ Java 强大能力的理解。\n\nJava 是一种强大的、高级的面向对象编程语言，已成为软件开发行业标准。由 Sun Microsystems 在 1995\
  \ 年开发的 Java “编写一次，随处运行”原则提供了跨平台的互操作性，使其成为设计跨平台应用程序的理想选择。它的语法简单简洁，允许开发者编写既高效又易于维护的代码。Java\
  \ 以其健壮性、安全执行和大型标准库而闻名，这简化了从数据结构到网络连接的切工作。此外，Java 一直处于移动应用、企业服务器和嵌入式设备的前沿，在现代计算的增长中起着至关重要的作用。凭借庞大的开发者社区和持续的就业市场需求，Java\
  \ 是行业中的重要力量。\n\n## 第 1 部分：Java 基础介绍\n深入学习 Java 的基础方面。在这里，你将从经典的“Hello World!”开始，逐步接触变量、用户输入和基础控制结构等核心话题。在本部分结束时，你将熟练掌握该语言的基础构建块。\n\
  \n## 第 2 部分：控制结构详解\n在基础的基础上，本部分将深入探讨控制结构。掌握循环的艺术，理解如何控制程序流，并学习利用三元运算符等决策构造结构的力量。\n\
  \n## 第 3 部分：数组操作\n数组是 Java 中不可或的数据结构。在这里，你将学习声明、初始化和操作数组。通过掌握这些任务，你将很好地掌握这种基础数据结构。\n\
  \n## 第 4 部分：基础面向对象概念\nJava 是一门面向对象的语言，本部分将向你介绍它的核心概念。接触类、构造函数、方法重载、继承以及 `this` 关键字的意义。\n\
  \n## 第 5 部分：探索 Java 库\nJava 标准库非常庞大且功能丰富。本部分将展示一些常用库，重点关注字符串处理、数学计算、日期/时间功能、动态集合和异常处理。\n\
  \n## 第 6 部分：高级 OOP 概念\n超越面向对象编程的基础。深入研究接口、抽象类、多态、枚举和嵌套类。在这里，你将看到 Java 通过其 OOP 范式提供的真正力和灵活性。\n\
  \n## 第 7 部分：数据结构与算法\n每个程序员都应该对数据结构和算法有坚实的掌握。在本部分，练习实现链表和树等基础数据结构，并尝试从排序到递归的算法。\n\
  \n## 第 8 部分：文件操作与序列化\n学习使用 Java 与文件系统交互。向文件写入、读取文件、序列化对象以及导航目录。这些练习将让你对 Java 的 I/O\
  \ 能力有全面的理解。\n\n## 第 9 部分：并发与多线程\n并发是 Java 的一大优势。通过这些练习，你将学习创建线程、同步化方法以避免竞态条件、处理死锁并利用现代多线程系统的力量。\n\
  \n## 第 10 部分：Java 高级库与特性\n本部分封装了 Java 中的高级特性和库。尝试使用 Stream 处理数据，利用 Lambda 表达式的简洁力量，使用反射检查类，使用正则表达式验证输入，并探索\
  \ Java NIO 的异步能力。\n\n## 第 1 部分：Java 基础介绍\n### 1-1. Hello World!\n编写一个在控制台打印“Hello,\
  \ World!”的程序。\n\n## 1-2. 变量与类型\n声明两个整数变量 `a` 和 `b`，为赋值并打印它们的和、差和乘积。\n\n## 1-3. 用户输入\n\
  编写一个程序询问用户的姓名，然后打印问候语。\n\n## 1-4. 条件语句\n编写一个程序询问用户一个数字并判断它是偶数还是奇数。\n\n## 1-5. 基础循环\n\
  使用循环打印 1 到 10。\n\n## 第 2 部分：控制结构详解\n## 2-1. 嵌套循环\n打印一个直角三角形。\n\n## 2-2. While 循环\n\
  提示输入数字直到输入 0，然后显示输入数字的和。\n\n## 2-3. Switch Case\n编写一个程序询问用户几（1-7），并打印对应的星期名称。\n\n\
  ## 2-4. Break 和 Continue\n打印 1 到 50，但跳过 5 的倍数。\n\n## 2-5. 三元运算符\n询问用户一个数字并使用三元运算符判断它是正、负还是零。\n\
  \n## 第 3 部分：数组操作\n### 3-1. 声明与初始化\n声明一个整数数组并初始化值。打印所有值。\n\n## 3-2. 寻找最大值\n寻找整数数组中的最大值。\n\
  \n## 3-3. 反转数组\n编写一个反转数组的程序。\n\n### 3-4. 数字平均值\n计算数组数字的平均值。\n\n### 3-5. 统计奇偶\n统计数组中奇数和偶数的个数。\n\
  \n## 第 4 部分：基础面向对象概念\n### 4-1. 创建简单类\n创建一个 `Person` 类，具有 `name` 和 `age` 属性，以及获取和这些属性的方法。\n\
  \n## 4-2. 类构造函数\n修改 `Person` 类包含一个初始化属性的构造函数。\n\n## 4-3. 方法重载\n在 `Person` 类中重载方法以实现多种方式设置属性。\n\
  \n### 4-4. 创建子类\n从 `Person` 类创建一个 `Student` 子类，增加一个 `grade` 额外属性。\n\n## 4-5. 'this'\
  \ 关键字的使用\n修改 `Person` 类，在方法中使用 `this` 关键字进行属性赋值。\n\n\n\n\n\n# 第 6 ：高级 OOP 概念\n\n\
  ## 6-1. 接口实现\n创建一个名为 `Drivable` 的接口，包含 `start()`、`drive()` 和 `stop()` 方法。在 `Car`\
  \ 和 `Boat` 类中实现此接口。\n\n## 6-2. 抽象类\n设计一个名为 `Appliance` 的抽象类，包含属性 `brand` 和 `price`\
  \ 以及方法 `turnOn()` 和 `turnOff()`。用具具体类 `WashingMachine` 和 `Refrigerator` 扩展该类。\n\n\
  ## 6-3. 多态\n使用之前创建的 `Drivable` 接口，在一个单独类中创建一个方法，使任何可驱动对象都能移动（执行 `drive` 和 `stop`）。\n\
  \n## 6-4. 枚举\n创建一个代表星期几的枚举（enum）。在该枚举内部添加一个方法，返回该日期是工作日还是周末。\n\n## 6-5. 内部类\n设计一个类\
  \ `Outer`，它内部有一个内部类 `Inner`。从外部类实例化该内部类。\n\n# 第 7 ：数据结构与算法\n\n## 7-1. 双向链表\n实现基础的双向链表，包含添加、删除和搜索元素的方法。\n\
  \n## 7-2. 使用链表实现栈\n编写一个 Java 程序，使用链表实现栈（stack）。\n\n## 7-3. 二叉树\n实现基础的二叉树，包含添加和搜索元素的方法。\n\
  \n## 7-4. 冒泡排序\n在整数数组上实现冒泡算法。\n\n## 7-5. 递归\n编写一个递归方法来计算数字的阶乘。\n\n# 第 8：文件操作与序列化\n\
  \n## 8-1. 写文件\n编写一个程序将字符串列表写入文本文件。\n\n## 8-2. 文件\n读取文本文件的内容并打印到控制台。\n\n## 8-3. 序列化\n\
  将自定义类的对象序列化到文件，然后将其反序列化。\n\n## 8-4. 目录列表\n列出给定目录路径下的所有文件和目录。\n\n## 8-5. 缓冲流\n使用缓冲流将内容从一个文件复制到另一个文件。\n\
  \n# 第 9：并发与多线程\n\n## 9-1. 基础线程\n通过扩展 `Thread` 类创建一个基础线程，通过实现 `Runnable` 接口创建另一个线程。\n\
  \n## 9-2. 同步方法\n演示使用 `synchronized` 方法来避免多个线程之间的竞态条件。\n\n## 9-3. 死锁\n编写一个会故意导致死锁的程序，然后修复它。\n\
  \n## 9-4. Callable 和 Future\n使用 `Callable` 在单独线程中计算数字的阶乘，并使用 `Future` 获取结果。\n\n\
  ## 9-5. 线程中断\n启动一个在无限循环中运行的线程。演示如何优雅地中断并停止线程。\n\n# 第 10：Java 高库与特性\n\n## 10-1. Java\
  \ Streams 高级\n使用 Java Streams 对自定义对象集合进行过滤、排序和转换。\n\n## 10-2. Lambda 表达式\n用 Lambda\
  \ 表达式替换 GUI 应用中处理按钮点击事件的匿名内部类。\n\n## 10-3. 反射\n编写一个程序，使用 Java 反射 API 检查类的方法和注解。\n\
  \n## 10-4. 正则表达式\n提示用户输入邮箱地址并使用正则表达式对其进行验证。\n\n## 10-5. Java NIO\n演示使用 Java NIO\
  \ 异步读写文件。\n\n# 第 1 解决方案\n\n## #1-1. Hello，世界！\n```java\npublic class HelloWorld\
