  \  {\nint n = arr.length;\nfor  (int i =  0; i < n-1; i++)\nfor  (int j =  0; j\
  \ < n-i-1; j++)\nif  (arr[j]  > arr[j+1])  {\nint temp = arr[j];\narr[j]  = arr[j+1];\n\
  arr[j+1]  = temp;\n}\n}\n```\n\n### #7-5: 递归\n\n```java\npublic  static  int  factorial(int\
  \ n)  {\nif  (n ==  0) return  1;\nreturn n * factorial(n -  1);\n}\n}\n```\n\n\
