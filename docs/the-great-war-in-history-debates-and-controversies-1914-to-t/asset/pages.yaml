    – the reduction of the amount of time spent working and the extension of life
    expectancy – have liberated a vast amount of time for leisure, culture, and for
    satisfying historical curiosity too.


    The academic world has been part of these developments. The teaching has expanded
    massively to meet this demand. In 2018, around 100,000 people taught in institutions
