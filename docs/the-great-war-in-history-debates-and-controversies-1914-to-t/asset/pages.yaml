    # Global war


    The second major innovation in the historiography of the Great War since 2000
    is its globalization. In this part it is a reflection of a shift of the centre
    of gravity for the war. For the century, the war was situated in Western Europe
    and on the Western Front, where it was configured as a conflict for the control
    of northwest Europe between Britain and France, on one side, and Germany, on the
    other. Major works on this part of the war appear since 2000, but they did not
    break new ground.


    In comparison, after 2000, the first major studies of China, Japan, and India
    appeared, both within the context of the war''s effect on the international order
