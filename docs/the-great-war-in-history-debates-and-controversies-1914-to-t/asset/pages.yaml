    # Conclusions


    What of these scholars shared an interest in the subject of representations. Since
    the 1970s ‘memory’ has been configured in a history of ways, but, among them,
    the word denotes stories, myths, and legends ordinary people tell about their
    past, usually their past, but sometimes about the abstract national past. Thus
    the ‘memory of the Great War’ is the sum of total stories they told about.


    At the end of the twentieth century, those tales were told increasingly by without
    direct experience of the war or even contact with the survivors. They have become
    iconic, in the sense that independently of the people who originally told them.
    Verdun, Passchendaele: these words carry baggage with them, and at times that
    baggage has been fashioned by historians. But only at times. Mostly we historians
    are fellow-travellers in the broader conversations over the languages—written,
    oral, visual, material—in which we collectively describe the ‘meaning’ of the
    Great War. This book The Great War in history: debates and controversies, 1914
    to the present, published first in 2004 and revised in 2020, is one such effort
    to contribute to the ongoing conversation about what it means, to acknowledge,
    the Great War as present in our lives and in the social and cultural world we
    inhabit.'
