  md: '# Introduction


    The war of 1914–18 belongs to no one, not even to historians. Since its outbreak,
    there has been a veritable tide of publications destined for many different audiences
    throughout the world on the subject of the war. Certainly, interest has fluctuated;
    indeed, during some periods the First World War has been marginalized by the Second
    World War, but at no time has there a consensus that the history of the Great
    War has been written once and for all. Even today, the subject remains an open
    one; although receding over the horizon of living memory, the subject remains
    vivid, and this fascination is evident in new books produced by well-known historians
    who are not particular specialists in this period. The eminent scholar Jean-Baptiste
    Durosel completed his career by writing a new synthesis on the French people and
    the Great War (Duroselle, 1994).¹


    The volume of work this field is dizzying in its magnitude. It would take several
    lives just to read the existing literature on the Great War: more than 50,000
    titles are listed in the library of Bibliothèque de historique contemporaine in
    Paris. The French journal historique published 775 reviews or bibliographical
    notices between 1919 and 2002; in the same period, there were 420 articles and
    reviews in a cluster of Anglo-Saxon historical journals, whose holdings have been
    digitized and preserved by the on-line repository, JSTOR. In the French case,
    since the 1970s the Revue historique ceased to serve as a place of publication
    in this field, even though it has grown dramatically in the 1980s and 1990s. From
    1993 to 1998 there have appeared more than 1,100 new books on the Great War in
    French, and over 200 were published in the year 1998 alone.² Each new book published
    in France or elsewhere, some of which break new ground, some of which go over
    the old ground again. Many articles, at times more important in the development
    of the subject than books, the number of which which is growing as well. We must
    add too films, television documentaries, exhibitions, museums, and internet sites
    whose narratives draw on and contribute to the work of professional historians.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# 2 The Great War in History


    It was surprising, therefore, that over a century after the war we still lacked
    a general analysis of the ways in which this history had been written. Histories
    of the war, of its battles, its machines, its many facets, fill entire libraries,
    but no one to our knowledge had put the question as to whether this literature
    is structured in particular ways, or if, at particular moments, particular topics
    or questions were dealt with, or how successive developments related to one another.
    Is it the case that these repeat each other or do they pose new questions and
    provide new answers for different audiences in different contexts? Here is the
    heart of this book''s inquiry.


    To begin to respond to these questions, we must limit our field of vision to the
    history of the war itself, its conduct and its immediate consequences. To study
    the middle-term and long-term consequences of the war for the major belligerents
    and for the world it overturned is beyond our reach. Above all, we privilege books,
    and not scholarly articles, which are less accessible, although many of these
    play an essential role in the making of historical knowledge.


    In this dense and multiform forest, we have tried to trace the most important
    pathways. We certainly do not intend to provide prizes for outstanding works,
    or to pretend to offer an exhaustive review of such a huge body of writing. Of
    course we have not cited. We are aware that there are many important books and
    knowledge in particular field. We hope readers will forgive us, and not conclude
    that our objective, arguably daunting, is thereby unattainable. First and foremost
    we aim to describe the trends or patterns of historical enquiry in one particular
    field. We aim to show how the historical category ‘The First World War’ has been
    constructed. We are interested in the war historians and non-historians have contributed
    to this task, and by the different themes adopted in different periods by writers
    in different national contexts. This task transcends professional, chronological,
    and national boundaries. Our aim is to explore what questions have been posed,
    what definitions used, what themes have been broached. In sum, how has the history
    of the Great War been written?


    Such a project requires as broad an approach as possible in order not to prejudice
    our findings. We have rejected three simplifications of this subject which would
    have eased our task, but which would have barred us from our objective. First,
    we do not restrict our discussion solely to professional historians, who after
    all do not hold a monopoly in this field. We privilege the work of our colleagues,
    past and present, but accept that the boundaries of our profession are porous
    in at least two respects. Not only'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Introduction


    within the English-speaking academy, historians have been joined in this field
    by other specialists, by literary scholars and sociologists in particular, whose
    similar and different points of view help to deepen enquiry. But the academy itself
    is not a closed environment. Many historians write for a general public, and many
    central figures in the war itself published their memoirs in the form of historical
    accounts. Some writers and journalists have tried to write history, at times with
    success. historians have not been alone.


    This historiography bears the marks of two kinds of crossing vectors, one outside
    the historical profession, one inside it. Public expectations and preoccupations
    have changed; the questions posed about the First World War have been transformed
    by the Second World, by the wars in Algeria and Vietnam. For our generation, attitudes
    to tolerable levels of violence, and to the body, patterns of consumption and
    modes of living, are radically different from those of a century ago. French or
    British children pass through Europe now much more frequently than their grandparents
    passed through Britain or France. National sentiments are no longer expressed
    about the same questions. The reading of history has changed under the impact
    of different or complementary narratives. Professional history is not immune to
    these changes, but follows particular trends and has massively expanded. There
    are new research centres; new archives have been opened. The mode of writing history
    has changed, and each generation writes its own dictionary of what it terms the
    ‘new history’. The history of the Great War escapes from this broader context,
    and forces us to ask how different this body of writing is from other fields of
    specialization.


    Secondly, we refuse to recognize thematic or narrow temporal boundaries. The majorities
    of books bear the ‘history of the war’ generally deal only with its military,
    diplomatic, or political aspects. If we had limited our discussion solely to these
    books we would have been unable to understand how this kind of history interacts
    with others – social, cultural, and economic history in particular. In more general
    books, in which the war appears only in some chapters or deals with a larger span
    of time, we therefore do not ignore studies which begin before or continue after
    the Armistice, since many of these books account for the significance of the war
    through their very periodization. A broad and inclusive approach to the field
    we are studying is necessary in order to account for the relative significance
    of political, diplomatic, military, economic, social, and cultural histories at
    different times and the ways in which these approaches take different configurations.'
  merge: -1
  pgno: 10
