  md: '# A new century


    # The digital revolution


    Two major innovations prepared the ground for this revolution. The first is the
    personal computer, ownership of which began to spread in the 1980s, before desktops
    and then, in the following years, laptops were miniaturized and made available
    at affordable prices, with spectacular advances in storage capacity and processing
    speed. The second is the portable telephone, the diffusion of which began in the
    1990s, thereafter invading all regions of the world.


    The rising importance of the Internet in everyday life is a product of these technologies.
    Christened for the first time as such in 1989, the World Wide Web opened in the
    first years of the twenty-first century, due to the decreasing price of computers
    and the spread of access to high-speed broadband connections, which has facilitated
    and accelerated exchanges.


    The Internet has spread around the entire world. Between 2000 and 2018, the number
    of users has shot up from 360 million to two billion people, that is, from 7 to
    48 per of the world''s population. The developed world is the most connected,
    with users 81 cent of the population (Fig. 3). The countries registering the most
    rapid growth in internet usage in the years 2000–10 were China, India, and Mexico.
    While European internet usage rose in that decade by a factor of four, it rose
    by a factor of seven in Asia and eleven in Latin America and the Caribbean.


    The advent of the Internet constituted a new and dynamic commercial system, with
    implications for all aspects of social and economic life. A change of this magnitude
    can only be compared to the invention of the printing press. The Internet offers
