    Germany, 1914–1918 (Feldman, 1966; Bieber, 1981). This work looked at the power
    elite that ran the German war effort and reached devastating conclusions about
    it. Feldman showed and comprehensively the chaos resulting from the dominating
    partnership of the army and heavy industry in wartime Germany. The outcome was
    a complete imbalance between the provision of goods and services between civilian
    and military claimants. The army took what it needed, supplied by heavy industry,
    the leaders of charged the state whatever wanted to fulfill government contracts.
    The resulting inflationary crisis was the worst in German history.


    This interpretation does not ignore the strengths of the German war effort at
    the outset of the war. Under the supervision of Rathenau, the director of the
    powerful electrical firm AEG and the German raw materials office (KRA), German
    production outstripped the Allies. In the first two years, Germany, with its powerful
    science-industrial capacity, had clear advantages over the Allies in this new
    kind of war. But from 1916, when the German high command took control of the war
    economy, the balance between military and civilian authority was totally undermined.
    The Patriotic Auxiliary Service of December 1916 – which was passed just as Hindenburg
    Ludendorff took command of the German army – was particularly disastrous. The
    aim of this measure was to enable the German army to respond to the evident strength
    of Allied production, demonstrated in the weight of Allied bombardment during
    the Battle of the Somme. But instead of making the war economy efficient, it did
    precisely the opposite. It wrecked the mechanisms of resource allocation, diminishing
    the supply of provisions to the home front, while not providing the armies with
    sufficient munitions to shift the strategic balance in the war. Byzantine bureaucratic
    tangencies, bottlenecks at key points, and galloping inflation were the results.


    Feldman showed as well that the more precarious the German war economy became,
    the greater the appetite of industrialists and their military allies for the construction
    of a vast German empire after the war was won. This imperialist dream grew as
    rapidly as domestic economic chaos. Feldman traces this history in the last year
    of the war, as the new patriotic formation, the Fatherland party, and its Allies
    in the army, like the omnipresent Colonel Bauer, came to the fore. Here is the
    source of Feldman’s overall argument that the history of the German war economy
