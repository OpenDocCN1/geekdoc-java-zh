    One of the distinguishing features of the British historiography of trench warfare
    is the way it is firmly grounded in labour history. This may seem surprising,
    since on the continent labour historians were slow to come to the Great War, and
    when they did, they chose subjects largely outside the military area. The question
    driving forward research in Britain is to square facts. The first is that Britain
    in 1914 was the most class-conscious nation in Europe, if not in the world. The
    second is record of loyal service by 6 million men in British forces through years
    of war. Where did the militancy of the British workingman go? Why was the British
    army the only major force that avoided a mutiny during the conflict?


    The answers scholars offer varied. The first is to suggest that the British did
    indeed mutiny. Dalls and Gill (1985) point to a breakdown of discipline at the
    base camp at Etles in September 1917, triggered by a brawl between military policemen
    and soldiers from different units in the British, Canadian, and Australian forces
    angered the rough treatment handed to by military police who never saw the front
    lines, the Honourable Artillery Company were able to restore order, but the men
    who rioted, and stole whatever they could find in the neighbourhood, returned
    to camp on their own. This event, though, was hardly a mutiny, since it occurred
    in the middle of the Third and in no way affected the movement of troops or their
    disposition.


