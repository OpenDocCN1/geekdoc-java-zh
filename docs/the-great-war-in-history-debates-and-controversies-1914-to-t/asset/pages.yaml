  md: '# Preface to the second edition (2020)


    The first edition of this book dates from 2004. Three reasons persuaded us that
    it is impossible to reissue this book without revising one chapter, and adding
    two new chapters and a new conclusion, as well as an updated-bibliography.


    First, the writing of the history of the Great War did not stop in 2004. There
    are many works since then that have changed the way we see the War years and explored
    new archives. Scholars have entered new terrain, and especially in Eastern Europe,
    historians have entered the blinkers of the Cold War years and explored new archives
    in order to understand a subject which was, for political reasons, off limits
    before 1989. We could not ignore these developments.


    Secondly, in 2014 the Centenary of the First World War was marked all over the
    world. In France it was the subject of numerous commemorations, coordinated by
    a government Commission. Other countries also devoted much time and effort to
    bring to public attention what had happened between 1914 and 1918. Wherever there
    were publications, conferences, documentary films, television histories, and novels.
    Did this commemorative wave change or infect the way we see the history of the
    war? We could not elucidate this question.


    Finally, and above all, in 2004 the exponential growth of the Internet had, in
    a global context, just begun. The intervening sixteen years, it has, in a certain
    sense, taken over the world. It also revolutionized the working conditions of
    historians. The digitization and opening to the public of archives and images,
    the expansion of social media and sites of exchange of goods and information,
    the arrival of blogs and other forms of exchange among historians at times on
    opposite sides of the world: these and other developments led us to pose the question
    as how, to what extent, did the Internet change the way we write the history of
    the Great War?


    We have not modified the first seven chapters of this book. We have filled in
    some gaps in the presentation of how the story of the Great War was from 1918
    to 2000, in chapter 8. We have replaced the last chap-'
  merge: -1
