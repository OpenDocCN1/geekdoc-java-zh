- img_proc: true
  md: '# Conclusion


    remain in the short term. Films, theatre, novel set in the war years attract a
    much more substantial audience than the works of historians.


    And yet, even though our voices are by no means dominant, they carry weight. Historians,
    with whatever skill and learning they can, offer their auditors and their readers
    meaning. In France the Centennial Commission was organized by an historians''
    committee. This group reinforced the profile of historians as being at the service
    of the historical heritage of the country. In this committee, historians with
    very different points of view served together. Disagreements were shelved in order
    to discharge the mission given to serve the public. The common cause was evident.
    The Great War is an event that matters. It belongs to all the people. Its complexity
    must be respected. The goal was commemoration without caricature.


    This was precisely what British director Sam Mendes did in his remarkable film
    1917 (2019), an achievement which attests to the fact that after the Centennial,
    commemoration goes on, playing on the creative interplay of history and memory.
    Mendes was inspired by the tales he heard from his grandfather, a soldier of the
    Great War, and as an artist Mendes was free to go beyond the factual limits of
    what happened on 6 April 1917, when the action of the film is set. His film tells
    of the futility of the war, while at the same time avoiding caricatures of the
    soldiers as gaudy heroes or hapless victims. He brings us into the world of their
    suffering, but dwells no less on their courage. He does not plead a case. He honours
    the men who fought and the men who died. The war in which they fought was absurd,
    but the men who fought gave it meaning. Here is a post-Centennial message worth
    pondering.'
