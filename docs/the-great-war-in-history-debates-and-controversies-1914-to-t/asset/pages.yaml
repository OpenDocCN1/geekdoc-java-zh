  md: '# The Great War in History


    One particular theme addressed in the interwar period. It was the question as
    to the legal character and economic effects of the Allied blockade of Germany
    and Austria-Hungary. Here we face a second structural element in the economic
    history of the Great War. The Allies had financial resources and raw materials
    that the Germans plainly lacked. These advantages were driven home and multiplied
    by the blockade. Did it strangle the Central powers? Was it a crime that the blockade
    extended after the Armistice and was lifted only on 28 June 1919, when the treaty
    was signed? After all, if the German army had ceased hostilities, were civilians
    denied essential supplies? The sensitivity of these questions helps account for
    the fact that the official British history of the blockade was published only
    in 1961 (Bell, 1961). The book had been completed in 1921, and a limited number
    of copies were deposited in government ministries. The book was not circulated,
    until well after the Second World War. Ironically, its publication in 1961 was
    fully twenty years after a German edition had appeared (Bell, 1943), and after
    an American archive, the Hoover Institution, had published a comprehensive set
    of documents on the blockade (Bane and Lutz, 1942).


    Here is one instance of distinction between official histories and those written
    under the aegis of the Carnegie Endowment for International Peace. In 1926, a
    group of French scholars completed a study of the blockade began under the lead
    of the historian Denys Cochin, who died in 1922 (Cochin et al., 1926). The book
    saw the blockade as of fundamental importance in the ultimate achievement of victory.
    This study was paralleled by similar publications in French written by former
    naval officers as the tactics and strategy of the blockade (Guichard, 1929).


