  md: '# 1 Three historiographical configurations


    For the soldiers, at least on the Western Front, there is no doubt: the war which
    began in 1914 ended on 11 November 1918, when they no longer had to fear for their
    lives. For heads of state, the war ended later, either with the peace treaties
    lapsed or with their implementation. It had begun before mobilization, at the
    moment of the assassination of Franz-Ferdinand in Sarajevo, or even earlier, with
    the Balkan wars, or the Franco-German crisis over Agadir. Professional soldiers
    include include the war plans which unfolded on both sides in August 1914. For
    the French administration, the end of hostilities was fixed by law as 24 October
    1919, and emergency-regulations lapsed on 15 November. Hence the boundaries of
    war are not fixed once and for all, because war is not a discrete entity, but
    something intricately laced, conceptualized, and imagined. It is an actual experience,
    to which contemporaries gave meaning by thinking about it. The vocabulary accurately
    the diversity of experiences and meanings. Of, the words ‘the war of 1914–18’,
    ‘world war’, or ‘Great War’ do not have precisely the same meaning.


    Historical writings are part of this social construction of the historical object.
    The passage of time induces a kind of sedimentation, and a century after these
    events historians perceive themselves that they hold a monopoly on this history.
    The multiple voices, in the turmoil of collective and individual emotions, conjured
    these events, died progressively, while the voices of historians were amplified,
    buoyed up by prior studies. If we wait long enough, the Great War will join the
    Thirty Years War or the Peloponnesian wars in the broad domain remain exclusively
    to historians. But when passions and anxieties were still vivid, everyone spoke
    about the war, and many tried to share their understanding of it. Everyone had
    something to say about it. Here is a clear sign of great historical events, moments
    in history about which people continue to speak.


    At the same time history, as a particular kind of narrative, defined by its own
    rules and procedures, progressively emerged from a set of discursive fields outside
    it, some of which have historical elements – like first-person'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Three historiographical configurations


    accounts or comments – which are not yet history but will become part of it. It
    is all too easy to separate history from the materials out of which it is constructed;
    the opposition of the witness and the historian, of the document and the historical
    narrative, the construction of evidence and of its interpretation, all provide
    the basis for a reassuring epistemology. This conception gives the historian a
    pre-eminent position, because it makes him the master of meaning who renders order
    out of the chaos of evidence and documents. Unfortunately, things are not so simple.
    To make this point, it is sufficient to analyse how the history of the First World
    War has been constructed.


    # The first configuration: military and diplomatic


    When historical actors and professional historians were one

    Very rapidly contemporaries understood that they were living through an exceptional
    event, of epic character, which formed part of history on the grand scale. They
    named it the Great War in 1915.¹ Its history did not await the silencing of the
    guns. One is struck by this precocity. It was just as soon as we lost, the Battle
    of the Marne became a historical subject. Here it is impossible to separate different
    narratives: generals telling the story of their battles speak as witnesses and
    as historians. Their testimony rests on direct knowledge which professional historians
    later analyze and utilize. Of generals wrote with a view to defending their reputation
    and their strategic choices, and motives are not sufficient to describe their
    narratives. This braiding together of witnessing and history is characteristic
    of the first period, when most learned and apparently impartial books, often illustrated
    like the massive history of Hanotaux (1915-23), were no less influenced by friendships,
    relationships, or political commitments, all more at the time when all these authors
    were aware of the importance of their writings for the morale of the nation.


    This merging of actors, witnesses, and historians defines the first historiographical
    configuration, which did not end at the Armistice continued on as politicians
    and diplomats followed in the footsteps of the generals. The historical narrative
    was just beginning, in the form of the collection and the critique of documents.
    In each issue, the Revue d''histoire de la guerre mondiale side by side by historians,
    by witnesses, by generals, and by diplomats. The French Revue historique reviewed
    works of popularization, at times booklets sold at kiosks in railway stations,
    as well as the memoirs of the main actors, and historical studies. History had
    not yet emerged from its chrysalis.'
