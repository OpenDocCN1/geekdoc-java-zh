    Direct participation in re-enactment battle tours bears no resemblance to the
    way literature or film operates. In these cases, there is a social contract between
    author and audience that they are representing war, not reliving it. We suspend
    disbelief to follow the artist’s vision, but do not equate performance with lived
    experience. Re-actors go beyond this convention in their quest for an immersion
    experience, something most sacred, and therefore beyond history.


    Even more worrying is that re-enactment is without politics. There is no need
    for re-enactors to ask why these soldiers wore weapons and kit until they appear
    in the field in the first place. Without politics, the outcome of war becomes
    a matter of indifference. After all the losing side was ‘authentic’ as the winning
    side. Making defeat may even be the source of attraction to groups to First World
    War re-enactment.


    Yet the most important objection to First World War re-enactment is of another
    order. Those who re-enact the Battle of Verdun or Gallipoli claim they are expressing
    admiration and pride for the men who fought the Great War 100 years ago. In fact,
    they sanitize and praise the war that they do a profound disservice to them. They
    know nothing of the anguish and the suffering of soldiers, and adding to our understanding
    of their predicament and their capacity to endure. Instead of honouring the soldiers,
    as they believe they, they turn their ordeal into a performance, which the French
    call a *son et lumière*. And where is the respect for the men who wanted to go
    to war in?


    # What role did historians play in the Centenary?


    It is evident that historians were collectively but one voice among many others
    during the Centenary. Because of the digital revolution, the writing of history
    has changed over the last two decades, and in a more complicated way the dispute
    over re-enactment may stay.


    One way to measure the place of professional historians is to see who buys and
    read their work. Here the published statistics of bookshops in France are instructive.24
    If we limit our search to the 200 best-selling books between 2012 and 2018, 4,474,000
