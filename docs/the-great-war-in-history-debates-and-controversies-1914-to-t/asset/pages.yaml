    economic and social mobilization. In addition, such people were well placed to
    take the first step in such a project, which was to provide a survey of the documentary
    material out of which individual histories would be written. The series was based
    on this archival review, which incorporated unpublished and published documents.
    This aim was reflected in the publication of various bibliographical guides, including
    Camille Bloch''s Bibliographie méthodique de l''histoire économique et sociale
    de la France pendant la guerre (Bloch, 1925). It also explains the invitation
    to Jean Norton Cru to write a survey of soldiers of the war. The Carnegie project
    set its priorities clarity: first the sources, then the interpretations.


    The Carnegie series is not a set of state-sponsored or authorized accounts of
    wartime administration. Official histories would ''show the achievements of the
    economic war rather than to indicate its strain''. The military histories compiled
    by general staff, official histories intended to ''show the strategy of the work
    behind the lines; their theme is as much the winning of the war as is the narrative
    of armies in the field. That of the economic and social history was to be obese
    of this conception, the displacement caused in the civilian society by such an
    economic and social disturbance'' (Shotwell, 1924, p. 5). For instance, the official
    history of the British Ministry of Munitions showed its contribution to the war
    in terms of output. The Carnegie history, in contrast, would deal with such a
    topic not from the standpoint of output of shells or guns, but of the effect of
    such a diversity of energy over the iron and steel trades and other industries''.
    Consequently, this initiative would invite ''the intelligence of future generations
    to judge the reach of [war''s] destructive power, not merely from the destruction
    itself but from the energy it unloashed – sometimes even creative energies – in
    the societies whose existence it threatened'' (Shotwell, 1924, p. 5–6).


    To write these books, James Shotwell affirmed, the Carnegie Foundation has brought
    into existence a kind of international academy, analysing the effects of war,
    critically and objectively; and so, from across what were hostile frontiers, both
    consciously and unconsciously by their common pursuit of similar ends, linking
    up once more the contact of the international mind'' (Shotwell, 1924, p. 6). The
    series was therefore a kind of international colloquium on contemporary history,
    a scholarly equivalent to the League of Nations.


    Most of the authors commissioned to write these histories had held administrative
    or political positions during the war. Twenty-five of the authors had held cabinet
    rank. Their privileged knowledge helped give the series its authority. For instance,
    Alexander Popovics''s book revealed'
