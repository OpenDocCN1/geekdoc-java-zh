  md: '# Businessmen, industrialists, and bankers

    How was the economic war waged?


    There have been three configurations of historical analysis of the economic history
    of the 1914–18 conflict. The first focused on economic policies and on the role
    administrators played in civilian affairs during the war. The second phase, evident
    in the 1960s and 1970s, turned to industrial activity which was analysed in terms
    of working alliances between businessmen, experts, civilian officials and the
    military. This constituted a broadening of perspective from the analysis of economic
    policy at the level of the state to Eisenhower christened the military-industrial
    complex. In the third phase, the two approaches were merged in the debatable analysis
    of war economies, understood as complex systems of production, circulation, and
    exchange operating on the global level to distribute goods and services among
    belligerants between civilian and military claimants.


    In these phases, the work of economic historians showed the unprecedented challenges
    faced by industry, army, and the state after 1914. With the debatable exception
    of the American Civil War, there had never been a situation like it. The scale
    of demands made by industrial warfare after 1914 was hitherto unknown. How officials
    responded to these challenges, both in the public and the private sectors, forms
    an important part of any explanation of the defeat of the Central powers and the
    victory of the Allies, even when experts differ over the weight to accord to economic
    factors in the equation of defeat and victory.


    Military history was much more significant than economic history in the calculus
    of victory constructed in the first phase of writing on these subjects. In later
    decades, economic factors were increasingly chosen as decisive ones. In the 1960s,
    Germany''s defeat was set firmly in the context of an economic failure to provide
    both for the army and for the home front, without major economic disorder. Inflation,
    at much higher levels in Germany and Austria than on the Allied side of the lines,
    were at once a sign and a measure of these economic failings. To be sure, the
    Allies had a much greater material base of raw materials'
