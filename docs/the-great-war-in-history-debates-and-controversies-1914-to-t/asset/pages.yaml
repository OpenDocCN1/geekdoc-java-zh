    million of these sales went to Pierre Lemaître’s Prix Goncourt-winning novel,
    *Au-Revoir là-haut* (Goodbye until we meet again).25 Following with 20.6 per of
    the total were *bandes dessinées*, graphic novels for adults. These are complex
    texts, with interpretation as well as images of war. Many adolescents come to
    read about the war through these illustrated books, like those of Tardi. In third
    place are memoirs, for example'
