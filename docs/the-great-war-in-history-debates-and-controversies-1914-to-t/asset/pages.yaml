    The first edition of this book appeared in 2004 at a time when the last of the
    survivors of military service in the First World War were passing away one after
    another. In 2008, at the state funeral of the last surviving soldier to have served
    in the French army, Lazare Ponticelli, President Nicolas Sarkozy saw his death
    as heralding the end of an era. A year later, the death of Harry Patch, the last
    man who had fought in the British army during the war, elicited the last outpouring
    of sentiment and reflection on the passing of the war generation. Claude Choules,
    a veteran of the British and Australian navies, and Frank Buckles, the last US
    soldier, died two years later.


    Now that there was no one left who could say ''I was there'', the press took up
    the refrain, asking whether it is possible to write the history of the war without
    living witnesses. For historians, this question is absurd, though we recognize
    the strength of the ties that bound us for over a century to those who were there,
    those who knew the war as part of their own lives. Now that the elders of the
    war generation have gone, we will go on writing the history of the Great War.


    On another level, there has been a sea change in the way we write history, due
    to the inevitable passage of time, but to to the transformation of technology.
    In the twenty-first century, a number of developments, already underway for decades,
    have led to changes profound enough to be a mutation of social and cultural life,
    perhaps even a revolution.


