    But this raises a deep problem. Old memories live alongside newer ones, and it
    is hard to integrate the two into a common story. For our contemporaries, the
    Great War was, above all, a catastrophe which subjected soldiers – and civilians
    – to levels of unprecedented violence. Here was a scandalous massacre, useless
    and incomprehensible without analysis of its political dimensions. Denouncing
    the horror of the war does not explain it. History cannot be satisfied with a
    *cri du coeur*. It must go beyond our sense of revulsion at so much suffering.
    It must try to give meaning to emotions, to restore the collective dimension to
    individual destinies, and to explain both reasons why this tragedy happened, as
    well as its consequences.


    This era of mass death grew out of the confrontations of sovereign states; it
    was one of the fruits of inflamed nationalisms. This story hardly penetrated what
    we called the ‘victims’ tale’. However, one alone can make the Great War intelligible.
    The political element remains essential, and combining it with the rich array
    of narratives emerging from the cultural history of the war is one of the important
    tasks that await us.³


