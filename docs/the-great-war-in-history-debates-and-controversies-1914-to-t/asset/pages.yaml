  md: '# Three historiographical configurations 31


    In conclusion, it is clear that the notion of historical configurations does not
    mean that one kind of history dominates all others. It is a question of emphasis.
    First, the emphasis was put on military and diplomatic history, then on social
    history, and later on cultural history. But all these types of history are present
    in each configuration. Their respective place and their weight change, as does
    their role in the overall interpretations offered.


    Here is the reason why we have organized our book by sector or subject of analysis.
    Successively, we will examine questions associated with particular places. In
    each of these chapters centred on particular issues, the three configurations
    are unrepresented. In the first configuration, diplomatic history (chapter 2)
    or military history (chapter 3) has a larger place than the third configuration.
    The history of trench warfare (chapter 4), of war economies (chapter 5), or of
    workers (chapter 6) is much more important than the second configuration within
    the other. The third configuration is evident in the home front (chapter 7) and
    memory (chapter 8). But in each configuration, every kind of history is present.
    Finally, in the new chapters added to this, the second edition of our book, we
    try to adopt a transversal view in order to propose a more global interpretation
    of our history of the war.


