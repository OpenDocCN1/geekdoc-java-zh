    and manpower on which to draw throughout the war, and draw they did. Even with
    these advantages, the Allies found victory very hard to attain, and as late as
    March 1918 the majority of observers were unsure as to which side would win the
    war. The Allies ones won is a question which remained open in the 1990s and beyond.
    One school of thought emphasizes the strength of the Allied system of distribution
    to keep front and home front supplied adequately through these difficult years.
    Another school has challenged this finding. Over a century after the end of hostilities,
    the economic history of the war remains a subject of fierce debate.


    # The interwar years: the political economy of war


    The Carnegie series: a landmark in the economic history of the Great War


    The economic history of the Great War was the subject of a remarkable series of
    books published in the 1920s and 1930s. They were commissioned by the Carnegie
    Endowment for International Peace, and came out of a pre-war American initiative,
    announced at an international conference in Berne in 1911, to explore problems
    of war and peace as central elements in economic life. The series was guided by
    a group of scholars from Columbia University in New York, including the economist
    John Bates Clark and the historian James T. Showlett. Clark was one of the key
    figures in the marginal-utility school of neoclassical economics. He believed
    that once international hostilities broke out, the free market could not operate
    as the arb of the relative prices of goods and services. Thus war was destructive
    of a liberal social and economic system which he defended on intellectual grounds
    as well as on political grounds, providing an alternative to socialism.


    This liberal impulse was echoed in the discussion of Norman Angell''s book The
    great illusion: a study of the relation of military power to national advantage
    published in London by W. Heinemann in 1911. That relation, both Angell and Clark
    believed, was overwhelmingly destructive, point which imperialist and nationalist
    elements ignored, thereby imperilling the world as a whole. After 1914, the need
    for such an inquiry into the ''the extent of the displacement caused by the war
    in the normal process of civilization'' was even more urgent. Works already began
    interrupted, but many studies arose out experiments in wartime economic controls.


    The aim of this series was to provide a kind of semi-official history. Authors
    were chosen because of their direct experience of aspects of'
