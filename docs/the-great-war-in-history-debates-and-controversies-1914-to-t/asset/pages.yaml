  md: '# The Great War in History


    This revised and updated edition of The Great War in History provides the first
    survey of historical interpretations of the Great War from 1914 to 2020. It demonstrates
    how the history of the Great War has now gone global, and how the internet revolution
    has affected the way we understand the conflict. Jay Winter and Antoine Prost
    assess not only diplomatic and military studies but also the social and cultural
    interpretations of the war across academic and popular history, family history,
    public history, including at museums, on the stage, on screen, in art and at sites
    of memory. They provide a fascinating case study of the practice of history and
    the first survey of the ways in which the Centenary deepened and deflected both
    public and professional interpretations of the war. This will be essential reading
    for scholars and students in history, war studies, European history, history,
    and international relations.


    JAY WINTER is Professor Emeritus at Yale University. He is the author of Sites
    of memory, sites of mourning: The Great War in European cultural history and editor
    of The Cambridge History of the First World War.


    ANTOINE PROST is Professor Emeritus at University of Paris – Panthéon-Sorbonne
    and was President of the French Commission on the Centenary of the Great War (2012–19).
    He is the co-author (with Gerd Krumeich) of Verdun 1916, une histoire franco-allemande
    and the author of Les Anciens combattants et la société française (1914–1939)
    and Les Français de la Belle Époque.'
