  md: '# Writing the history of the Great War,

    2000–2020


    Since the turn of the century, historical writing on the Great War has been marked
    by innovations and continuities. The three principal developments have been a
    new formulation of the debate on the outbreak of the war, a globalization of the
    history of the war, and, finally, the emergence of the idea that the Great War
    ended, not in 1918, but in 1923. Continuities may be seen not only in the spread
    of cultural history, but also in its penetration into the writing of political,
    economic, military, and social history.


    # Innovations


    The sleepwalkers

    Christopher Clark''s The sleepwalkers, published in 2012 in English and 2013 in
    French, quickly became a publishing phenomenon – a bestseller in Germany and a
    book of which anyone interested in the First World War had to take notice. The
    key to Clark''s revision is that he provides an account of why, but how Europe
    went to war in 1914. Thus, he turns from morality to mechanics, from isolating
    the guilty party to observing the blindness of all the major leaders as what they
    were unleashing upon the world. German readers took him as exculpating Germany;
    others saw his treatment as being too even-handed, and thereby understating Germany''s
    responsibility for the conversion of the war crisis into the war. A German historian,
    Gerd Kirchhoff (2014), took issue with the way Clark had led Germany off this
    point. Using Russian archives, McKeekin (2011) finds lots of evidence about Russian
    culpability in the escalation of the war crisis. Margaret Macmillan (2014) configured
    the 1914 war crisis as ‘the perfect storm’, a departure from earlier moments of
    defusing international crises, a unique configuration of events and individuals
    whose errors led Europe into war.

    in two respects, though, Clark''s interpretation marked a new moment in the history
    of 1914. His first chapter, on the long tradition of assassination'
