  md: '# Studies in the Social and Cultural History of Modern Warfare


    General Editors

    Robert Gerwarth, University College Dublin

    Jay Winter, Yale University


    Advisory Editors

    Heather Jones, University College London

    Rana Mitter, University of Oxford

    Michelle Moyd, Indiana University Bloomington

    Martin Thomas, University of Exeter


    In recent years the field of modern history has been enriched by the exploration
    of two parallel histories. These are the social and cultural history of armed
    conflict, and the impact of military events on social and cultural history.


    Studies in the Social and Cultural History of Modern Warfare presents the fruits
    of this growing area of research, reflecting both the colonization of military
    history by cultural historians in social and cultural history, to the benefit
    of both. The series offers the latest scholarship in European and non-European
    events from the 1850s to the present day.


    A full list of titles in the series can be found at:

    www.cambridge.org/modernwarfare'
