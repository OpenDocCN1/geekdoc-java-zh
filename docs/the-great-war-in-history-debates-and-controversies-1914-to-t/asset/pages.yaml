    war. In the subject would have required a Marxist explanation, in which objective
    conditions of work and wages would have been the foundation of social class. In
    fact, Robert showed how workers'' demands arose of their ethics.


    It is important not to drive this too far. From the 1980s cultural history has
    become a major sector of research on the Great War. Indeed, this book is part
    of it. However, cultural history is not the only kind of history today. Recently
    published general syntheses, mostly in a national framework, barely touched the
    subject of the anthropology of the war. But it is clear that they have taken into
    account what has been established by the second configuration and the third configuration
    of writing about the war. For instance, consider Duroelle (1994) or Moyer (1995)
    for Germany or general surveys as Strachan (2001) and de la Gorce (1991). Here
    war is not defined only through alliances, negotiations, and battles, but through
    economies, finance, food supplies, and public opinion.


    It would be difficult, though interesting, to analyse what extent and in what
    ways this cultural history has affected the history of specific fields. A minimalist
    claim would be that books of political, diplomatic, or military history would
    now take into account some elements of cultural history. As we have already noted,
    ideas, representations, even misunderstandings were always considered by historians.
    It is impossible to say if George Henri Soutou (1989) would have put less emphasis
    on cultural aspects in his study of economic war aims, for instance in his interpretation
    of Bethmann-Hollweg''s September programme of 1914, if he had written his book
    in 1969. A maximalist claim would be to state that the change is deeper and that
    the framework of all history has shifted in response to this cultural turn.'
