    The social history of workers during the war seemed at this point to reach an
    impasse. On the one hand, there was clear evidence of revolutionary aspirations
    in Germany, in France, in Italy. On the other hand, there was a working class
    transformed, but with reformist aspirations. In addition the gap between the well
    paid and the poorly paid diminished, and the social distance between the workers
    and the white-collar labour force was less than it had been before the war. How
    can we reconcile these divergent trends?


