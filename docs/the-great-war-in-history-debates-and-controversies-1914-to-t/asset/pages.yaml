  md: '# The Great War in History


    In this configuration, it is important to recognize the pre-eminent role played
    by the series sponsored by the Carnegie Endowment for International Peace. In
    chapter 5 and elsewhere we will analyse this project in greater detail, but for
    the moment, it should suffice to emphasize these particular points. This was the
    largest single historical enterprise constructed. It was a ‘comprehensive economic
    history of the war, the theme of which was the extent of displacement caused by
    the war in the normal process of civilization’ (Shortwell, 1924, p. 1). There
    were 132 volumes published on almost every belligerent nation and neutral countries,
    through national committees composed of bureaucrats, businessmen, statesmen, as
    well as economists and historians. The British committee included both Keynes
    and Beverly, and the French committee was composed of Charles Gide, Charles Rist,
    Arthur Fontaine, and the historian Henri Hauser, who was during the war one of
    the advisors of the Minister of Trade, Etienne Clément. This series remains of
    the highest interest to historians, because of the position of their authors in
    scholarship and administration, and the documentation they personally had at their
    disposal.


    # The primacy of the diplomatic questions


    The main undertaking of this first configuration was the publication of full sets
    of diplomatic documents. In effect, contemporaries were haunted by a central question
    that dominated their work: that of war guilt. It is difficult to appreciate the
    amplitude and intensity of this density. The ordeal had been so long, so hard,
    so murderous, the cost had been so staggering, that everyone absolutely had to
    know why it had broken out and why it lasted so long. Each nation was convinced
    of the justice of its cause. The Germans had been persuaded of the reality of
    encirclement which presented them with the danger of an aggressive France set
    on revenge and of Allies determined to block German access to the place she deserved
    as a robust world power. They clung to the notion that all they had done was to
    defend themselves. Their defeat was unjust, all the more since article 231 of
    the Versailles Treaty made them bear sole responsibility for the war. Arguments
    to minimize the significance of this article did not reach a population in a state
    of shock. Even before the historians began to intervene, two incompatible versions
    of the subject of war guilt lived side by side.


    To establish the validity of their arguments, governments undertook the publication
    of official documents, not only on the immediate origins of the war, but on the
    whole field of international relations which'
