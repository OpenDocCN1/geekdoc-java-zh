    # The 1960s and after: the corporate economy, and the international order


    Civilian and military control of the war economy


    After 1945, new approaches to economic history changed the nature of the historiography
    of the economic effort of the First World War. The post-1945 expansion of the
    international economy and the project of developing the economies of the ‘Third
    World’ helped spawn the emergence of economic history as a thriving discipline
    in the 1960s. In this field, the subject of war was relatively marginal, but the
    intensification of violence in Algeria, Vietnam, the Middle East, and elsewhere
    once more drew scholarly attention to the set of problems discussed in the Carnegie
    project and by other historians before 1939. The 1960s were also a period when
    Marxist influences in economic history were palpable, though not dominant.'
