  md: '# Select bibliography 1914–2020


    This is not a general bibliography on the epistemological and methodological problems
    of historiography. Here we have cited works on the Great War which together constitute
    the subject of this book. We do not pretend to have cited all important works
    on the Great War. Our aim was more modest. We started out with the intention of
    limiting the bibliography to 500 items, but that was too restrictive a total.
    Others would have made different choices. We accept responsibility for, and ask
    readers to take this list as a guide to the avalanches of publications over the
    past century on the Great War.


    To make this bibliography as user-friendly as possible, we have listed the works
    we cite in alphabetical order. Family names and first names of authors are followed
    by the date of first publication. When we refer to a translation or new edition
    of the book, we give as complete a reference as possible, but always provide information
    on the first edition. If the original titles differ markedly from that of the
    translation, we say so. Thus for Fischer, 1961, we give the title and reference
    to the French edition, which dates from 1970, then the title and reference to
    the first German edition, without date, since was already given (1961). This bibliography
    can serve as an index helping readers find where we discuss particular books.


    We have not cited articles in scholarly journals in this bibliography, but furnish
    note when we cite such works in the text. We also include books in the notes that
    do not appear in the bibliography. Once more we must endure pretend of having
    an exhaustive bibliography, and ask readers to forgive the inevitable omissions
    in a work of this kind. We list here the names of historical journals where readers
    may find additional reflections on the Great War.


