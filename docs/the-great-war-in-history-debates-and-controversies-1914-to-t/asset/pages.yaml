    # Surviving the war: the 1980s and 1990s


    The history of the home front during the Great War took on two forms in the last
    two decades of the twentieth century. The first explored elements of material
    culture and conditions of survival in wartime. The second explored what is termed
    culture de guerre, which may be defined as the discursive forms through which
    contemporaries understood the world at war in which they were living.


