    # Reparations and the economic blockade


    The liberal impulse behind this first generation of writing on war economies was
    reflected as well as in the controversy over John Maynard Keynes''s Consequences
    of the peace (Keynes, 1919). We have already shown the impact of this of the peace
    treaty on the debate upon the post-war world. Keynes surveyed the war as an economic
    disaster, and presented a celebrated analysis of the post-war settlement mainly
    on economic grounds. Much in the spirit of Clark and Shotwell, he treated as a
    serious and debilitating illness, in the aftermath of careful convalescence was
    necessary to nurse the European (and world) economies back to health. In Keynes''s
    view, Versailles made this recovery virtually impossible. This argument, controversial
    at the time, returned later in the twentieth century as a major theme in the economic
    history of the conflict.'
