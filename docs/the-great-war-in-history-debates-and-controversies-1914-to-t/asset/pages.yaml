    # Re-enactment


    A salient instance of this passion for living history is that of re-enactment.
    This phenomenon can be found in all countries and reflects attempts to relive
    the past, from ancient times to the present. This folklorization of history offers
    medieval pageants in some places, and in other areas are re-enacted, in Bouines
    in thirteenth-century France to Austerlitz in 1805 (then Austria, now in the Czech
    Republic) to Verdun in 1916.


    The attention these re-enactors place upon the authenticity of objects is relentless.
    The uniforms they wear must be as authentic as possible, down to the buttons and
    the buckles. Historical re-enactment was born well before the Internet, and the
    World Wide Web has given it an exponential boost.³² The Web is a grand bazaar,
    on which almost everything is for sale: a nurse''s uniform or approximations of
    the hard or buff fed to British soldiers during the war. This online marketplace
    offers in particular a vast array of firearms.


    Re-actment societies have their own associations, including, in France, La Fédération
    des amateurs d''armes, roughly translated as the ‘Association of weapon collectors’.
    In town after this group organizes meetings where they exchange or buy items of
    interest.


    The object of re-enacting is to relive what the soldiers of the Great War went
    through. They believe professional historians are a world apart, incapable of
    understanding ‘ordinary people’, whom we approach with condescension and arrogance.
    At times, this criticism is justified, at times, without a trace of feeling for
    the past which makes it absurd. Re-enactors read professional history, but find
    most of it desiccated, without a trace of feeling which makes the heart beat faster
    and the stomach tighten.


    Re-enactors know that their reconstruction of war is a fiction; they know they
    play at war, and do not weight it. Up to a certain point, they can help spectators
    imagine war; a soldier''s heavy knapsack and kit can suggest much about war. But
    re-enactment still transforms war into entertainment and the history of war into
    a vehicle for enabling the lives of people whose pulse quickens at the thought
    of the drama and the battle of battle. Angelaberg terms this behaviour ‘prosthetic
    memory’, the attempt to graft onto your life someone else''s experience.³ Entering
    other worlds through our imagination is all of us when reading or dreaming, but
    prosthetic memory has a visceral level of meaning to those caught up in it which
    requires their inhabiting, or even merging with bodies in the past. That is what
    re-enactment offers, and those who believe in it are like members of evangelical
    cults. They seek for heightened experience and find it in war.'
