    # Introduction


    The historiography of civilian life in wartime has developed along axes over time.


    First axis: masses


    In the 1920s and 1930s, the masses behind the lines were configured as populations
    to be mobilized, protected, or coerced into making sacrifices necessary for the
    continuation of the war to a successful conclusion. The Carnegie study charted
    the space of civilian life in terms of social and economic policies and their
    outcomes. In this period, the home front was still seen as the backup of, and
    support for, the battle front.


    The focus on the home front in historical writing became significant only in the
    1960s. In this part this was a reflection of the trend towards labour history
    and social scientific history, which could have evidence related to broad populations
    drawn into war though not in uniform. Here is an excellent example of the return
    to origins, since the idea behind James Shotwell''s 132-volume series (1924) on
    the economic and social history of the war was to obliterate the distinction between
    military history on the one hand and ''people''s history'' on the other.


    Second axis: classes


    In the 1960s, the study of social movements focused on the contradictory trajectories
    of labour movements in different countries, both prior to and after the Russian
    revolutions. On the one hand, labour opposition to war evaporated rapidly in the
    midst of the war crisis of 1914. Thereafter, labour organizations joined in the
    power elites that ran war industry in all combatant countries. On the other hand,
    the social truce of the first three years of the war was never complete. Shop-floor
    disputes carried on, and


