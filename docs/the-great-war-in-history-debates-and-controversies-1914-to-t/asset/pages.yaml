  md: '# The Great War in History


    In this second phase of writing about the economic history of the Great War, a
    phase lasting from the 1960s to the end of the century, what emerges is may termed
    structural history. That is, the object of study was less factors of production—land,
    labour, capital—or particular policy initiatives or strategies, and more the emergence
    of new forms of state capitalism, new forms of corporate management of the economy.
    One way of understanding this phenomenon was to see it in terms of what the sociologist
    C. Wright called ‘power elites’ outside parliament and cabinets. Men of industry,
    technocrats, experts, scientists, bankers, bureaucrats—these are the people whose
    hands controlled the economy. From the 1960s scholars explored the political economy
    of the war, to show how economic interests shaped both war policy in general and
    economic issues in particular. This kind of history of the emergence of the mixed
    economy, in which the state and the private sector formed a new and lasting partnership,
    was not Marxist in character. Indeed, the hand of Keynes be seen in the economic
    historians approached the systematic study of the interaction of private and public
    interests in the formulation of policies leading up to the war and adopted its
    duration.


    We have encountered some of these historical initiatives in the early chapters
    of this book. And inevitably so, the history of political economy is large all
    over the diplomatic record of the period prior to during the conflict. The most
    important intervention in this field was conducted by a non-Marxist historian
    trained in theology, Fritz Fischer. We have already noted, his 1961 publication,
    Griff nach der Weltmacht: die Kriegspolitik des Kaiserlichen Deutschland 1914–18,
    caused a sensation in Germany. The emphasis on German expansionism and imperial
    greed was extended in his 1969 publication Krieg der Illusionen (Fischer, 1969).
    Here the power of industrial and other interests working together with military
    and naval elements to promote an aggressively expansionist foreign policy was
    documented thoroughly in the pre-war years. No one could miss the allusion to
    Norman Engel’s book, nor the alarming implications that aspects of the Nazi regime’s
    policy were anticipated before and during the Great War. Echoes of the interwar
    essays of Eck Kehr (1965) on the democratic politics of the formation of foreign
    policy are evident here as well. Kehr, an economist, had limited, though palpable,
    influence like Volker Berghahn, himself a student of Fischer (Berghahn, 1971).


    The particular role of big business within the German war economy became the focus
    of much subsequent study. The pioneering work in this field was Gerald Feldman’s
    Army, industry and labor in'
