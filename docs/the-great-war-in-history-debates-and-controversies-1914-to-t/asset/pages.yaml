    # French historiography


    In this second configuration, French historiography was dominated by the Marxist
    paradigm and the Annales school, which discredited the history of mere events.
    Hence which kind of history, which was now deprived of its political dimension,
    could only lose the central position it had held before 1940. It sought its revival
    in the deeper and more frequently cited causes of the war: economic and financial
    crises, imperialism, the last stages of capitalism. Historians at work in this
    vein did share the same hypotheses: some hoped to confirm the Marxist position,
    others wanted to refute it. But in any event, it was important to examine economic
    interests and alliances and to study in precise cases how they influenced the
    breakout of the war.


    Under the supervision of Renovouin and his successor at the Sorbonne, Duselle,
    young French historians undertook research on new archival sources. ‘Ambassadors’
    dispatches have been studied and again; to find something new, it was necessary
    to explore other sources, such as the consular reports and the commercial services
    of the Foreign Ministry, those of big business, and in particular of banks. Many
    ‘grand’ dissertations were launched, and they come home a dozen or so later according
    to the rules of the game in the French academy: Poideivin (1969) on financial
    relations between France and Germany; Girault (1973) on French investment in Russia;
    Thobie (1973) on French interests in the Ottoman Empire. Others explored parallel
    enquiries: Miquel (1972) studied public opinion and the Versailles Treaty; Bariety
    (1977) and Artaud (1978) wrote on reparations and inter-Allied debts. Some wrote
    about the United States from varied points of view (Nouilhat, 1977; Kaspi, 1978).
    Similarly there were a number of studies of economic and business history, in
    which war always played a significant part.


    These findings were important, but they did modify the historiography of the war
    1914–18? These authors offered subtle periodizations, between industrial and financial
    capital, and the ways in which there were national colorations in the outlook
    of these interests. They showed, however, the interlocking nature of national
    economic interests, while no one argued that interests played a decisive role
    in the breakout of the war. This does not mean that it impossible to claim that
    there were no economic causes of the war, but that they of decisive importance.'
