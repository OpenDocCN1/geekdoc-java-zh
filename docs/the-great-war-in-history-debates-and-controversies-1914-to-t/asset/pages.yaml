  md: '# Three historiographical configurations


    determined the alliance system and precipitated the war. Each government mobilized
    its professional historians to manage this task and to assure its objectivity.
    Of course, the archives were opened in later years the views drawn from these
    documents would be corrected. But for the time being, vast publications of diplomatic
    documents dominated the work of historians and absorbed their energies. As universities
    were weak institutions, professional historians were few in number; hence their
    role in the global historical literature was limited. They published fewer books
    than actors, witnesses, and diverse.


    This situation varied by country by country. The French case of Letters is distinguished
    from others in two respects. On the one hand, the Faculties were weaker than elsewhere.
    They emerged effectively from the 1880s; they had few students and graduated in
    history approximately 100 students each year. There were few Professors of history:
    fifty-five throughout the century, covering the history of every period and every
    nation. In the Sorbonne, Seignobos was the only Professor of ‘political history
    of modern and contemporary times’. On the other hand, this weakness was balanced
    by the exceptional importance given to the teaching of history in high schools.
    The teaching of history was obligatory in all secondary schools and was taught
    by teachers, numbered 620 in 1914. Such a historical event as the Great War could
    not remain outside the classroom. The teaching of this subject was launched officially
    in 1929, but even before that the author of the most widely used textbook, Jules
    Isaac, completed in 1921 the classic text of Albert Malet, killed in the war,
    by adding a chapter of 100 pages in a separate volume, on the history of the war.²


    Since French universities were relatively weak, historical enquiry about the war
    was centred on a particular institution by the Ministry of Public Instruction
    under the supervision of a professional committee: the Library and Museum of the
    war, which rapidly became the Library of Contemporary International Documentation
    (BDIC).³ This library was linked to the Society for the History of the War, which
    from 1923 published the Revue d’histoire de la guerre mondiale. This journal later
    became the Revue d’histoire de la deuxième guerre mondiale, and today is Guerres
    mondiales et conflits contemporains. The BDIC was directed by Camille Bloch, and
    a young agré in in⁴Pierre Renouvin, who lost his arm in the Battle of the Chemin
    des Dames in 1917, served as librarian. As early as 1922, he was invited to lecture
    in the Sorbonne about the origins of the war (Renouvin, 1925b). He was elected
    to a chair in history in the Sorbonne in 1932. His professional and moral authority
    was above reproach. Editor of the Revue d’historique, dean of the Sorbonne from
    1995 to 1958, and chairman of the Fondation nationale des sciences politiques'
