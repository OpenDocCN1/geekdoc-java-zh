    The French series showed the prominence among professional economists. The editorial
    board consisted of four men: Charles Gide, then Professor of Political Economy
    in the Faculty of Law in Paris – some years later he was appointed to the Collège
    de France; Arthur Fontaine, who had been the president of the board of directors
    of the French railway system during the war, and later served as a delegate to
    the International Labour Office; Henri Hauser, Professor of History at the Sorbonne,
    who had served in the office of the Ministry of Commerce under Clément; and Charles
    Rist, Professor of Political Economy in the Faculty of Law in Paris. These men
    commissioned and then vetted volumes on forms of war administration, on policies
    and practices related to virtually every aspect of the social and economic history
    of the war effort.


    Fundamental volumes were contributed by Augé-Laribé (1925) on the land in wartime,
    and by Arthur Fontaine (1924) on French industry. Gide wrote on the cost of living
    and on the general economic effects of the war (Charles Gide and Achilles Daudé-Bancel,
    1926). The French series, though, had some unusual features, in the particular
    space and attention given to studies of urban history in wartime. No other national
    series did the same. Volumes were produced in Paris, Tours, Marseille, Lyon (by
    Eduard Herriot), Bourges (by Claude-Joseph Gignaux, another Professor of Political
    Economy), Bordeaux, and Rouen. In no other national series was such an effort
    made to isolate and examine multiple multiple facets of the urban history in wartime.
    As in other national series, French volumes arose out of the intimate knowledge
    of ministers of the wartime policy. Clément’s volume (1931) on the inter-Allied
    Commissions regulating shipping and the distribution of essential supplies is
    a case in point.


    In total, the Carnegie series numbered 132 volumes. It was probably the largest
    collective enterprise of its kind in history. While monumental in scope, it inevitably
    left large gaps. The German series was subject to official scrutiny, and hence
    more akin to official history than that of other nations. The sensitivities of
    Weimar servants about the industrial history of Germany in the war were so marked
    as to prevent the publication of that volume in the Carnegie series. There were
    other silences in the project. The history of Russia stops at the Bolshevik revolution.
    Bulgaria, Czechoslovakia, Greece, and Turkey are treated with one single volume
