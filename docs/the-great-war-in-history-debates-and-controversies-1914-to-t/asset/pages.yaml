    the military, who returned the compliment, and who deposed democracy in ways which
    were evident in the insults inflicted by the generals on Deputies mobilized in
    1914–1915. Most historians, most intellectuals, were men and women of the left.
    But this was not all. The war in Algeria probably played a role too, by persuading
    historians not to look too closely into a set of questions they preferred rather
    to forget than to exorcise by historical enquiry.


