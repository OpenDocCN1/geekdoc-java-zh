    In Europe the crisis of the Marxist paradigm was one of the main reasons for the
    shift from social to cultural history. In the United States, where Marxism was
    much less influential, scholars expressed their interest in cultural fashions
    much earlier. The seminal work of Paul Fuss (1975), The Great War and modern memory,
