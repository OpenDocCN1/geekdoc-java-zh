    # History in memory


    In this rapid expansion of sites of memory, what place is there for historians?
    What role do they play, alongside websites, graphic novels, popular histories,
    exhibitions? Reflecting on events organized during the Centenary Can provide some
    semblance of an answer to these questions.


    First, never have historians in France been as deeply involved in commemorative
    events as during the 1914–18 Century. They have hundreds of lectures on varied
    subjects to public. One study found that 1,785 lectures were given in France by
    366 French or foreign historians, 15 of whom were specialists in the history of
    the Great War. On average, historians of the Great War offered six lectures each;
    their general colleagues offered four each.28 Specialists did the lion''s share
    of the work. They were called upon frequently; as one young specialist put it:
    ‘Historians were in high demand, notably to take varied subjects such as the war
    on the home front and the effect of the conflict on women and children.229 Once
    again we can see the new appeal of cultural history, the dominant tendency in
    historical research, which suggests a convergence between professional historians
    and amateurs, rather than orchestration by the state, or other guardians of ‘official
    history’.


    Historians of the Great War were on all over the world, though perhaps in France
    it was more easily coordinated by the establishment in 2012 of the Centenary Commission.
    These historians helped ensure the historical accuracy of proposed Centennial
