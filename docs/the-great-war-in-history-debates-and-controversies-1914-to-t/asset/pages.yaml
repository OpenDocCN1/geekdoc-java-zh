    of ‘total war’ from different angles. The first dealt with social mobilization
    as a problem of state policy; the second with social structures and social conflict;
    the third with material culture, and cultural mobilization. These bodies of historical
    literature overlap and inform each other. What they do not allow is any form of
    segregation of the history of soldiers from the societies for which they went
