  md: '# # Conclusion

    After the Centenary


    In the years 2014–18, the memory of the Great War invaded all reaches of French
    society. This was not the case elsewhere. In the United States, the shadow of
    the Civil War and of the Second World War made the First World War almost invisible,
    despite major public efforts to commemorate it. All the otherophone combatants
    were more like France, where even before the Centenary there was a prior commemorative
    surge of activity at the level of the state and, more importantly, within civil
    society. This pre-Centennial commemorative impulse could be seen in part as a
    response to the disappearance of the last of those who had served in the war.
    What was the significance of much public acknowledgment of the Great War generation,
    100 years after the outbreak of hostilities? Did the Centenary change either the
    memory or the history of the war?


    # ## The work of remembrance


    By number and both their local and their global character, commemorative events
    in the Centennial period reinforced memories of the war years. Even those who
    previously had no idea that there was a Great War between 1914 and 1918 – and
    we had met such individuals – learned what we set Europe on in 1914 and what happened
    before the fire was extinguished. Those who had heard of the war through school
    lessons or university lectures came to know a bit more.


    The work of historians mattered, having provided at least a rudimentary narrative
    of the war, and at times, much more than that. Reading, seeing, or hearing the
    voices of historians helped change popular preconceptions about the Great War.
    No longer was it presented solely by the confrontation of Germany with both Britain
    and France. No longer did it stop in 1918. A double extension, geographical and
    chronological, transformed the war into a drama both bigger and longer. The war
    in the west of Europe no longer occluded the war in the east; the war in Europe
    no longer hid the fact that the Great War was a global conflict. Narratives became
    fully European, encompassing the Balkans,'
