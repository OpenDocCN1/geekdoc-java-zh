    developed along other lines which reflected social pressures, for instance to
    explore the history of the Vichy regime from 1940 to 1944. A dynamic centre of
    scholarship, the Institute of Contemporary History (L''institut de l''histoire
    du présent, known as the IHTP), focused and nurtured this research. The Institute
    of Political Studies fostered political history, traditionally defined, but in
    ways which were open to new approaches in the emerging field of political science.
