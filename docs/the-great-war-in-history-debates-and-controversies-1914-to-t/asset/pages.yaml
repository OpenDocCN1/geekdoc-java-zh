  md: '# Three historiographical configurations


    A conference held at Verdun in 1975 (Association nationale de souvenir de la bataille
    de Verdun) revealed the depth of this reorientation of military history. Alongside
    contributions on strategy and tactics, there were articles on the life and death
    of soldiers, public opinion, the press, and even the representation of the war
    in school textbooks.


    In the Anglo-Saxon world, the London historian James Joll provided the most powerful
    reorientation of the diplomatic and political history of the war in Great Britain
    in the 1960s. A scholar of the Second International, Joll reviewed the diplomatic
    history of the July crisis in a strikingly new way. He presented the leaders of
    the major combatants as men who found themselves in July 1914 in a situation out
    of which they could not predict. What they faced was a Clausewitzian calculus
    of the rational turned into a series of vague notions about honour or the inevitability
    of struggle which they had learned much earlier in their lives. Lord Grey, the
    British Foreign Secretary, responded not in terms of the ideas of 1914 but in
    terms of the code of honour he had learned in his English public school years
    before. Here what Joll termed the ‘unspoken assumptions’ of 1914, the hidden motivation
    of men lost in a moment of tension (Joll, 1968). L''Histoire des mentalités had
    clearly crossed the English Channel to take up residence in the London School
    of Economics. It is but a short step from this perspective to the period when
    social and cultural history came to the fore as a central element in European
    historiography.


    # The third configuration: cultural and social


    Why and how did history change?


    Between the first and the second configuration, there was a break, a period of
    silence due to the impact of the Second World War. Between the second and the
    third configuration, on the contrary, there was no rupture. It is evident that
    there was a smooth transition, and many scholars passed easily from social to
    cultural history, for instance, as Jean-Jacques Becker, Jay Winter, and Stephanie
    Audoin-Rouzeau. There was no real change of generations, but rather a shift of
    emphasis, a displacement of the centre of interest. This is the reason why this
    evolution was so rapid, as cleared from a glance at the subjects of two major
    international conferences: the first, held in Nanterre in 1988 on European societies
