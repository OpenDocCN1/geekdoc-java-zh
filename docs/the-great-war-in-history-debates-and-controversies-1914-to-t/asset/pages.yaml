  md: '# The Great War in History


    Thirdly and finally, since war is a multinational phenomenon, it would have been
    absurd to restrict this to the historiography of one country. If we were to focus
    on French writing in this field alone, we would be unable to appreciate the upward
    inflection of Anglicophone scholarship. The audience for French publications wanes,
    and in English grows larger, reflecting the growth of the English-speaking academy.
    In addition, we have taken into account aspects of the German literature in this
    field, either in the original or translated into English, and some studies written
    by Italian scholars. On the other hand, in chap 1-7, we neither treated the complex
    historiography of nationalities the Austro-Hungarian Empire, nor included works
    in Soviet and Russian historiography. Another deliberate omission in the first
    edition of this book is the growing literature on the Great War from the vantage
    point of Asian, African, and Latin American history. In the new chapters at the
    end of this, the second edition, we open a discussion of these topics.


    This threefold framework provides us with a flexible mode of analysing change
    over time and them. This interest in the diachronic and thematic requires gives
    us time to return to similar subjects. We have tried to limit such overlaps, eliminating
    all would have diminished our treatment of particular subjects. Many publications
    are not restricted to a particular domain, and in light of recent scholarly earlier
    sources take on new significance. For example, the series sponsored by the Carnegie
    Endowment for International Peace has to be seen first as the testimony of who
    ran important facets of the war effort. Secondly, it is the earliest pillar of
    our understanding the economic history of the war. Thirdly, no one can write the
    social and cultural history of the conflict without reference to many of its volumes.
    After all, when visiting a town, if one passes time and again a central square,
    it does not mean that the visit is ill-planned, but that the square is deed a
    central one.


    These assumptions we share inform our collaboration, which has emerged from discussions
    and a friendship decades long. But this wish to write in two voices, for each
    of we both take responsibility, has been enlightening. It has enabled us to emphasize
    the dialogue between different national histories, and to stress the national
    framework which still dominates historical writing about the war. Hence this book
    about history of the disintegration of an older Europe may serve as a kind of
    introduction to a more European history of the First World War, which one day
    must be written if Europe is ever to forge its own identity.'
