    The Great War changed the face of the world, and it is such that future historians
    will write about it. As we have seen, they have already begun that task, as the
    growth of a global cultural history of the period asserts. They must broaden further
    their sub-disciplines, to show how the war changed societies, their visions, and
    their relations with each other. To limit one''s interest to the years alone is
    possible, to be sure, but perhaps not has escaped from its chronological boundaries.
    It has become a global event of the first magnitude, with long-term consequences
    for us all.


    Some historians have tried to couple the Great War with the Second World War.
    There is a surface plausibility to this position, but on examination, it must
    be revised. George Mosse (1990) touched on an essential point in this argument
    in his publications on the Great War. He asked whether it was in the war or that
    we would find the origins of the political brutalization of the 1930s and 1940s.
    In answering the affirmative, his argument had force with respect to Germany,
    but he was wrong about Britain and France. And even in the German case, the story
    is more complicated. The Freikorps were not simply German storm troops to other
    purposes; 1933 was not simply 1914 relieved by millions of men wearing born shirts.
    There were other possibilities embedded in the war and in its aftermath that we
    forgot our peril. There were paths not taken, efforts at stabilization which,
    as Charles Maier (1988) showed, were not dead ends. Kant saw history as simply
    superseded by these events. Kant followed a crooked path. We ought to do the same.


    It is much too early to estimate the impact of the Centenary on historical studies
    around the world. We hope that in the next decade a new generation of historians
    will emerge sufficiently intrigued or inspired by the Centenary to advance new
    interpretations based on new sources. Today, public interest in the Great War
    is robust, and is likely to'
