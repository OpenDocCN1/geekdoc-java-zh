    The answer is a qualified yes. The work of memory, of commemoration, is very close
    to the work of history, the research findings of time to time modify what we call
    the memory of the war. Certain traditional stereotypes have faded away: gone are
    images of German soldiers as monsters, cutting off heads of little children. Now
    in the German army we see soldiers who look and feel French or British soldiers.
    Forgotten are bayonet charges and caricatures impossible to sustain in thinking
    about industrial war and the dominant role played by artillery. The Armenian genocide
    escaped the shadows some Turkish leaders would like to keep it in. Instead we
    can see it as part of another war or series of wars waged between 1919 and 1923
    that we have not sufficiently acknowledged but whose traces can still be seen
    today in the Balkans and the Middle East. It takes time, but it is clear that
    the work of historians does enter the domain of collective memory.


    Historians bring out stories about the war that have been ignored, and show the
    falsity of other stories about the war that ought to be ignored. German atrocities
    did happen in Belgium and northern France in 1914. They were not provoked by a
    Belgian underground, and the honour of the German army was stained not by false
    accusations, but by its own brutal actions in the first weeks of the war. The
    German army was beaten in the field in 1918, and did not get stabbed in the back
