  md: '# The Great War in History


    he directed the publication of French diplomatic documents. A member of the Institut
    de France, honoured by the highest degree of the Legion of Honour, Renouvin dominated
    the Great War and that of contemporary political history until his retirement
    in 1964 and his death ten years later.5 Neither in Germany nor in the United Kingdom
    did a single historian tower over the history of the Great War as Renouvin. Across
    the Rhine, the war was too dark and too conflicted a memory; across the English
    Channel, it seemed too recent for historical analysis, and the Oxford English
    history abruptly stopped in 1914. There were exceptions, though. Crutwell''s military
    history of the war appeared in 1934, though it never approached Renouvin''s work
