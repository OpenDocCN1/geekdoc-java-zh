  \ 0。\n\n### C# 代码\n```csharp\nusing System;\nnamespace exercises\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(test(78,\
  \ 95));\n            Console.WriteLine(test(95, 95));\n            Console.WriteLine(test(99,\
  \ 70));\n            Console.ReadLine();\n        }\n      public static int test(int\
  \ x, int y)\n        {\n            const int n = 100;\n            var val = Math.Abs(x\
  \ - n);\n            var val2 = Math.Abs(y - n);\n            return val == val2\
  \ ? 0 : (val < val2 ? x : y);\n        }\n    }\n}\n```\n输出:\n95\n0\n99\n\n### 程序：将给定字符串的最后\
