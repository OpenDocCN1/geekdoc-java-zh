    - **Oval (Start and End)**: The oval, or the ellipse, is going to be a symbol
    that will tell us the beginning and the end of the flow of the program. To make
    the flowchart stay as simple as we can, you need to only use two of these ovals
    one for the beginning and one for the end. You can go with more than this though
    if your program is designed to have more than one ending though.

    - **Arrow**: This is going to be the line that we are able to use to help connect
    the shapes of your flowchart together with the arrowhead being used to tell us
    which direction the flow of the program is going. This is used to help eliminate
    the need for putting in numbered steps like you need to do when making one of
    the algorithms from before. Arrows add in some flexibility to the low of your
    chart and can cut down on some of the clutter when the program is more complicated.

    - **Parallelogram (Input and Output)**: This is going to help us to see the operation
    for the input or the output. Whenever you would like to accept a value from the
    user which is the input, or you would like to display a value, which is the output,
    in your program, make sure that the parallelogram shows up.

    - **Rectangle (the process)**: This is going to help us to see any operation that
    is performed internally by the computer. Basically, any operation that is direct
    that doesn’t accept input or doesn’t display an output needs to be represented
    with this rectangle. For example, calculations similar to the modular division
    can use this kind of symbol.

    - **Rhombus (Decision)**: This is going to be a symbol that will be used to help
    branch out the flow of the program or help out when handling conditional statements.
    It is still going to count as a process because the computer will internally do
    the operation, but it has to decide and then pick out the right path based on
    the condition that you set.

