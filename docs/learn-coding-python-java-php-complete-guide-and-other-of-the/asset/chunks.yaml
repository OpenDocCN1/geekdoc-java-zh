- fmt: "\nAs you can see from the example above that you can customize a webpage with\
    \ whatever smaller projects that you can with the `PHP` syntax and then incorporate\
    \ the elements of `HTML` to help organize the entire web page to work the way\
    \ that you want. \n\nYou will find that working with the `PHP` language is going\
    \ to be one of the most widely used server-side languages that you can work with,\
    \ even if there are other languages that can compete and will be better at the\
    \ work and more efficient at it as well. In fact, there are many programmers who\
    \ would argue that `PHP` isn’t going to be all that secure or even nice to work\
    \ with, but you will find that this is a language that has seen a lot of improvements\
    \ since it was first started. And the newer versions of this have become powerful\
    \ tools when you would like to create some web pages that are more interactive\
    \ and dynamic than ever before.\n\n![](rsrcSC.jpg)\n\n# The JavaScript Language\n\
    \nThe next kind of language on our list that we need to spend some time on is\
    \ the `JavaScript` language. This one is really popular. In fact, according to\
    \ a StackOverflow survey that was done in 2018, `JavaScript` is used by about\
    \ 62.5 percent of the respondents at that time.\n\nThis is a language that was\
    \ originally created back in 1995 and it was meant to be a solution for the compatibility\
    \ issues that plagued the internet in some of its earlier years. But since that\
    \ time, it has been used to expand beyond some of the things that we can do with\
    \ the development of websites and even some of the web-based applications. Now\
    \ we are able to use it on some of the more modern technologies that are available\
    \ to us today such as servers, robotics, apps on our phones and more.\n\nIf you\
    \ spend time liking things on Instagram or Facebook, or you have ever filled out\
    \ a form on a website, then it is likely that the code that was behind all of\
    \ this, and the code that will ensure that this task actually works is going to\
    \ involve at least a little bit of the `JavaScript` language. You will find that\
    \ to make this work better, it is a good idea to have some comfort with working\
    \ on a few other coding languages like `PHP`, `CSS`, and `HTML` as well.\n\nIf\
    \ you have spent some time on the `CSS` and `HTML` languages that we talked about\
    \ before and have used these as techniques to master some of your own skills in\
    \ web development, then you will find that the `JavaScript` language is going\
    \ to be one of the next logical languages for you to learn how to use. This is\
    \ because the `JavaScript` language is going to be responsible for the behavior\
    \ that we will be able to see on that website. A good example of this is that\
    \ `JavaScript` is able to tell us if there is some kind of error when we are filling\
    \ out a form and if one of the fields is not handled properly.\n\n`JavaScript`\
    \ is also going to be used in other locations outside of web browsers. We can\
    \ easily see that it is going to be found in places like various types of hardware,\
    \ software, and mobile apps. This is why it has really changed to become more\
    \ of a general-purpose language than it was in the past.\n\n# CoffeeScript\n\n\
    This one may not be known as much as some of the other options that are out there,\
    \ but it is still an option that we need to spend some of our time on nonetheless.\
    \ This language is going to handle some of the work that we do in a slightly different\
    \ manner than some of the other coding languages that are on the list. Rather\
    \ than going through and compiling the code that we are using in a manner that\
    \ is readable to a human and then switching it over to the machine-readable code,\
    \ this language is going to compile the code to work in `JavaScript`.\n\nThis\
    \ kind of language is going to be there for the programmers who would like to\
    \ code in `JavaScript`, but who do not like all of the rules and the syntax that\
    \ is there. it is easier to work with because you will not have to write out as\
    \ much code in the process compared to what is there in `JavaScript`. A good way\
    \ to think about this language is that it is going to have a combination of some\
    \ of the benefits that we see with `Python` and `Ruby`, while still giving us\
    \ the end result that we would get with `JavaScript`.\n\nThis is going to make\
    \ the runtime debugging that we need to do a little more of a challenge overall.\
    \ But you will find that there are a lot of online resources that are available\
    \ to handle this, and many of the games and interactive code editors are going\
    \ to be able to support this, serving as a little proof that this language is\
    \ going to exist for those who are going to have a headache with learning how\
    \ to code in the traditional `JavaScript` language.\n\n# SQL\n\n![](rsrcSD.jpg)\n\
    \nThe next language that is on our list is going to be known as `SQL`, or Structured\
    \ Query Language. This is going to be a language that is able to communicate back\
    \ to a relational database system. `SQL` queries are going to refer to some of\
    \ the statements that are going to be used in this particular language. These\
    \ statements are able to do a wide variety of things for us and can work on a\
    \ lot of different tasks including:\n\n* `UPDATE`: This one is going to update\
    \ the data that is found on your database.\n* `INSERT`: This one is going to insert\
    \ some new data onto the database you are working with.\n* `DELETE`: This one\
    \ is able to delete some of the data that you no longer want on your database.\n\
    * `SELECT`: This is the same as retrieving some of the data that you would like\
    \ off that database.\n"
