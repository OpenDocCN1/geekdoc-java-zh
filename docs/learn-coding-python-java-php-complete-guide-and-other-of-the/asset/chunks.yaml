- fmt: "\nThese symbols are going to be recognized universally by programmers and\
    \ others who do we coding, so make sure that when you are using one of these charts,\
    \ you are also working with the right symbols along the way.\n\n## Programmers,\
    \ coders, and developers\n\nIt is impossible for us to get very far in some of\
    \ the work that we want to do with coding without taking the time to mention programming\
    \ and software development. When we go from the perspective of someone who has\
    \ some basic knowledge of these things, it may seem like the ideas of developing,\
    \ programming, coding, and computing are all going to be the same, and can be\
    \ used in a manner that is interchangeable.\n\nHowever, it is important to note\
    \ that those who spend a lot of time coding and work with this on a more technical\
    \ level will actually know that developers, coders, and programmers are going\
    \ to be very different things. A good way to think about them is like they are\
    \ ranks. The coder is going to be the starter, or the most basic, level, and then\
    \ to programmers and ending with the developers.\n\nThe role of a coder is going\
    \ to stay pretty basic as we go through the process. You will set, or be given,\
    \ a problem or an objective that you would like to achieve, and then you can utilize\
    \ your knowledge in the coding language of your choice to get the job all done.\
    \ Once you have been able to learn some of the basics of the chosen coding language\
    \ and start pumping out the codes, and these actually work, then you would be\
    \ considered a coder.\n\nBut there are some other levels as well. Programmers\
    \ are going to know that coding is nothing more than just a phase of the development\
    \ process for new software, one that may never end. Spending a lot of time improving\
    \ the flowcharts and the algorithms that we talked about before are important\
    \ parts of a good programmer. Coders are going to specialize in being able to\
    \ translate some of the algorithms to code, but the programmers are going to spend\
    \ time making sure they can make the algorithm even better and will check for\
    \ any big bugs that could ruin the program.\n\nWe can then finish up with a developer.\
    \ This is going to add another level to what we are going to see with some of\
    \ the codings that happen. Developers are going to be seen more like the real\
    \ brains behind the program, and they will do as much work as necessary, and as\
    \ much research, to make solid flowcharts and algorithms. They will identify a\
    \ target market and all of the potential problems that they have to address with\
    \ a bunch of solutions.\n\nIt is also possible that these developers are going\
    \ to manage a team of programmers to handle some of the bigger projects and to\
    \ make sure that no matter what the vision of the developer is, the work meets\
    \ that expectation. These are going to be the people who know the most about coding\
    \ and programming and will make sure that the codes that are written for those\
    \ programs are high level and will work properly.\n\n## Programming language\n\
    \nThe compiler is going to understand the instructions that you are sending over,\
    \ only if you speak the right language. You have to know ahead of time what the\
    \ programming language of the computer is before you can provide the commands\
    \ and the instructions that you need here. The good news is that you are able\
    \ to make your computer smart by installing a variety of programs that will help\
    \ the machine to understand as many programming languages as you want. We will\
    \ spend some time later in this guidebook learning about some of the most common\
    \ languages and what we are able to do with them.\n\n## Source Code Editor\n\n\
    ![](rsrcS5.jpg)\n\nThis kind of editor is going to be a special kind of text editor\
    \ that has been designed in a manner to aid coders in writing out some of the\
    \ codes they want. You are free to enter, make, and even edit the source code,\
    \ no matter what language, with the help of a basic text editor like the `TextEdit`\
    \ for `Mac OS` and the `Windows Notepad`, and then provide the right extension\
    \ of the file depending on the programming language that we are working with.\n\
    \nHowever, we have to know that some of the normal text editors are going to lack\
    \ some of the features that you would like to find in the source-code editors.\
    \ For example, you will not be able to find out whether something is wrong with\
    \ your code. `Microsoft Word` is set up to help us figure out whether there is\
    \ some bad spelling or bad grammar in a similar manner as a source-code editor\
    \ is able to foresee if the code you wrote out is going to provide you an error.\n\
    \nKeep in mind that the more complication and power that is in your code, the\
    \ harder it is to debug, edit, and improve the code that you have. The source\
    \ code editor is going to help us out with this as well because it can automatically\
    \ indent the right spots to help you see the different sections of the program,\
    \ and highlight the elements and will help us to see more of the code as well.\
    \ Picking out the right editor is going to be important to ensure that you are\
    \ able to get them to work as well as possible.\n\n## The interpreter and compiler\n\
    \nThe interpreter and compiler are going to come with different approaches when\
    \ it is time to translate your code. The compiler is going to work by taking the\
    \ entire source code, making the translations that are needed, and then outputting\
    \ the program in an executable program. This process can take a bit of time based\
    \ on the processor or `CPU` speed that you are working with, and how many lines\
    \ of code are in the program. Depending on the programming language or the compiler\
    \ you decide to use, this process can even complete itself well even when you\
    \ find that the code has some critical errors and bugs in the code.\n\nHowever,\
    \ this is where we are going to find the interpreter to be useful. Rather than\
    \ having to take on the entire code of source, and building a translated output,\
    \ the interpreter compiles the first line of code and when each of the translations\
    \ is done, the statement is going to be executed. The interpreter is then going\
    \ to move on to the following line and will repeat this process until the operation\
    \ is over, or until it finds an error.\n\nBecause the compiling and the executing\
    \ process is going to happen on each line, the program is going to go through\
    \ its execution at a slower rate, and it can be something that is more noticeable\
    \ if you work with a slower `CPU`. But the advantage of working with this is that\
    \ you will not have to wait for the whole program to compile before you can do\
    \ the testing and many come with an interface that will help you figure out where\
    \ the main problem is.\n\n The debugger\n\nThe next thing that we need to take\
    \ a look at is the debugger. This is going to be an external program that is designed\
    \ in order to detect bugs and errors that show up in our programs and code. It\
    \ is going to have some of the same functions of an interpreter, but it often\
    \ has some extra functionality that comes with it, such as the ability to pause\
    \ some of your operations if the command might be correct in the sense of the\
    \ syntax, but will produce the wrong output.\n\nThe above example is still going\
    \ to be seen as a bug because it is not an output that is undesirable, so the\
    \ debugger is going to stop you there and will allow you some time to correct\
    \ the code and see the operation continue if the problem is solved. Some of the\
    \ debuggers that you work with may have a virtual environment that you can work\
    \ with that allows you to fully check out the length and complicated code without\
    \ needing to worry about compiling in the first place. `IDE`\n"
