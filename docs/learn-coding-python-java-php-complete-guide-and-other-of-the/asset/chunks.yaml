    `IDE` 将是一个基础的源代码编辑器，但通过 `IDE`，即集成开发环境，你将被置于一个沙盒中，手里带有一个水桶，里面包含了你为了立即构建一些严肃代码而需要使用的所有工具。你通常将拥有完成任务所需的所有物品，以便能够完成代码。你想要使用的的大多数现代
    `IDE` 都是易于使用的，并且包含调试器、解释器等。其中一些能够帮助支持多种编程语言。你可以根据喜好选择想要在其中运行的 `IDE` 类型，以获得你想要的结果。


    库（Library）

    在库中处理我们的部分代码总是比在程序本身中处理要高效得多。库不仅能帮助我们理清程序中可能更复杂的不同组件，还能让编写其他程序时变得更简单。也许你正在处理的两个程序在编码方面会有某些相似之处，正因如此，你会发现使用同一个库进行编码会更高效。这可以帮助你自己在从零构建每个程序时避免重复造劳动。当你能够在代码中实现一些最常用的库时，你将获得更多可以使用的工具，而无需从头开始构建。


    框架（Framework）

    取决于你想要制作的程序，并不是所有人都会喜欢使用我们之前说过的 `IDE`。即使你手头拥有了所有的工具和库，并且规划好了算法，你也会发现启动某些编码项目会更具挑战性。框架是你可以用来处理这一问题的一种方法。框架基本上是一组相关的库的集合，可以帮助我们减少实现某些目标所需的代码量。有很多框架供你使用，它们根据你的需求支持各种类型的语言。


    正如我们在这里看到的，为了开始我们想要实现的某些编码，我们需要了解许多不同的术语和定义。充分理解这些内容是如何运作的以及我们能用它们做什么，在我们开始编写我们想要的代码时将至关重要。希望这为我们提供了一些正在寻找的介绍，我们能够借此帮助学习更多编程知识，并发现这些信息实际上并不像我们过去可能认为的那样困难和可怕。编程也可以很简单，有时随之而来的困难性更多源于我们的脑海，而非其他任何地方。


    # 第 2 章：编程语言共有的常见特性


    编程的魅力之处在于有很多你可以使用的编程语言。有时这看起来是混乱的，因为每种语言处理的都是不同的内容，并且它们有需要考虑的优点和缺点。有些语言会稍微容易上手，而有些则较难。而且每种语言都适用于你想要进行的许多不同类型的编程。


    这里的好消息是，无论你想使用哪种编程语言，你都需要了解一些这些语言之间共享的共同特性和组件。我们在这里记住的一些部分将：


    ### 语句（The statements）

    你将要处理的每一行代码都被称为语句。有时这些语句很长，你需要将它们拆分以使其运行，有时它们又会稍微长一点。有时编程语言会要求你在末尾有一个特殊字符（通常是分号），以帮助表示命令在此时已完成。


    你可以将这些语句变成你喜欢的任何形式。它们可以是一个短句，也可以是对你希望在某些编码中发生什么事情的完整解释。在开始接触现有的某些编程语言之前，没多久，你就会注意到这些语句对你的编码来说是多么普遍。


    ### 注释（The Comment）

    注释是我们在编码时可以使用的另一种工具。你可以添加这些注释来描述代码某部分正在发生什么，并在编写过程中为你或其他程序员留一条简短信息，说明你正在编写的代码中某些部分是怎么的。如果你愿意，可以在代码中添加许多此类注释，但保持最少化对于确保过程持续运行是重要的。


    每种语言都会有一个特殊的符号，你需要将其放在所编写的注释之前，以确保编译器知道这是一条注释。如果你使用了正确的符号，编译器将跳过该语句，而不会尝试执行它或破坏你的代码。


    这的一个很好的例子是 Python 语言。如果你想在该语言中编写注释，只需在前面添加 `#` 符号即可。如果注释占据了多行代码，那么你也可以在你正在处理的每行代码之前添加该符号。虽然其他编码语言将使用不同类型的符号来完成工作，但你会发现每种语言的情况其实非常相似，并且你会发现它们之间这一点是非常相似的。


    ### 语法（The Syntax）

    语法基本上是关于如何编写代码部分的规则。每段代码都有根据编译器如何读取而产生的语法。语法通常是我们在语言中遵循的规则，但它更直接且通常有更严格的规则。你需要通过练习学习语法在某些代码中是如何运作的。语法是我们必须遵循的规则，如果你在处理你正在做的代码时漏掉了某些语法，那么编译器将无法处理某些部分。语法是你在工作任何语言时应该应该关注的事情之一。你应该快速掌握语法，但要了解它是如何运作的仍然需要时间，你会发现每种语言在这一点上是非常相似的。


    ### 数据类型（Data type）

    对于大多数编码语言，你会发现数据类型是重要的。你需要根据预期的用户输入来选择什么类型的数据。数据是计算机中预留的存储该值的空间。在学习如何编码时，数据类型非常重要，例如，你会注意到有很多数据类型，如列表、字典、浮点数、元组等。数组也会出现在我们使用的某些编程中，因为它们擅长组织数据。例如，数组可以帮助存储结果。


    ### 变量和常量（Variables and constants）

    这些应该是很容易学习的。常量是你放入程序中但不会改变的值，你为它分配一个特殊的名称，以便将来引用它。然后是变量，它们是随着数据类型改变的内容。


    这里的另一点需要注意的是，定义变量或数据类型被称为“声明”（declaration）。但第一次为常量或变量设置值被称为“初始化”（initialization）。只需记住，声明对于每种编程语言都是必要的，所以你必须查看该语言的文档。关于这些变量，需要记住的一点是它们包含了：它们占据计算机内存中的一个特定位置。如果你在代码中放入一个变量，基本上只是在那个内存中预留一个空白处。给变量赋值是一个简单的过程。在你可以选择的任何编码语言中，将
    `=` 放在变量和值之间即可。这告诉编译器你放置变量的特定值需要进入内存中那个特定位置。在以后运行程序时，你可以调用变量将其取出。


    ### 数组（The arrays）

    数组并不是给初学者使用的，但当正确使用时，你会发现它们让程序更高效。如果你发现自己花费了太多时间创建许多存储相似数据的变量，可能会发现通过在一个将这些值存储在单元单元中的数组可以简化这一切。这有助于进一步组织事物，并确保将所有内容放在一个地方。这些数组听起来可能复杂，但你会发现它们在你编写的代码中被频繁使用，因此我们需要在它们上花一点时间。首先，我们会发现数组可以使用数据结构之一。它包含一组你选择的元素。在大多数情况下，你会发现这些元素是相同类型的数据，例如字符串或整数。数组出现在我们使用的某些编程中，因为它们擅长组织数据。例如，如果我们使用搜索引擎，我们可能会找到数组的示例来帮助存储结果。


    ### 函数、参数和对象（Functions, parameters, and objects）

    现在我们将进入几个会组合在一起但也需要讨论的部分：`functions`（函数）、`parameters`（参数）和 `objects`（对象）。


    ### 条件（Conditionals）

    记得我们之前在流程图中看到的菱形吗？当它翻译成代码时，我们称之为条件。我们的每种现代编码语言现在都有这些，并且可能会出现多次，因为程序必须根据用户的输入来做出决策。如果用户输入这个，那么就会发生
    `A`。如果他们输入另一个，那么就会发生 `B`。当我们谈论计算机编程时，条件是指条件语句，有时也称为决策控制语句。这些是重要的，因为它们可以帮助我们执行各种计算或操作，而且通常这取决于布尔条件的评估结果为
    `true` 或 `false`。


