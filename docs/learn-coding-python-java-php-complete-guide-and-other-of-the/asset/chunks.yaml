    ## 编程语言


    *   **图像语言**：这些语言是经过大幅精简的语言。这允许我们在在此过程中通过操作各种图像来学习编程的一些基础概念。

    *   **块级语言**：这类语言通常被称为“泡泡语言”。这类编程语言允许用户通过遍历和拼接代码部分，而不是由自己编写代码。这是一种视觉化的方式，因为图像语言会让你看到实际的代码，让你直观看到发生了什么，但你不需要亲手去输入它们。

    *   **真正的编程语言**：这些是你能够使用的一些更传统的代码语言，在这些语言中，你必须亲自逐行编写并输入。你会发现像 `Java`、`Lua`、`PHP`、`JavaScript`
    和 `Python` 这样的语言都属于这一范畴。


    在这里必须记住，你选择的编程语言不应该基于你自己的年龄。你会发现有些孩子已经准备好立即投入并开始使用 `Java` 语言了，特别是如果他们想在早阶段为 `Minecraft`
    做一些工作。也有成年人，如果发现以视觉化的方式而不是文本模型进行学习对他们来说是最佳选择，他们会更倾向于使用基于块的工具。但在选择语言时我们必须考虑的一点是，无论你选择许多出色的编程语言中的哪一种，你开始使用的语言都应该基于你的舒适程度。你不应该强迫自己的任何编程技能，尤其是作为一个初学者，要学会在在这个过程中遵循一种更自然的进展。尽管如此，让我们来看你能够使用的一些最常见的代码语言，以及你使用每种语言可以做到的事情。这可以让我们很好地了解这些语言是如何运作的，以及在此过程中我们用它们来实现什么。


    ![](img/rsrcSA.jpg)


    ## HTML 和 CSS


    `HTML`（即超文本标记语言）和 `CSS`（即级联样式表）将是你准备创建你想要的某些网页时，能够学习的两种最重要的技术之一。`HTML` 将帮助确保你所在的网页将具有正确的结构，这可以涵盖从图像、表格、列表、标题、超链接、声音、视频以及你想要添加到页面中的任何其他元素，只要你在代码内部以正确的方式对它们进行标记即可。


    然后，`HTML` 将作为一种正确工作的语言，帮助我们使用的网络浏览器理解我们所创建的元素，并随后以适当的方式显示网站的一些文件。


    接着我们可以转向 `CSS` 语言。这是我们需要配合 `HTML` 一起使用的语言，因为它能够改变 `HTML` 的外观，用户可以对其编辑以自定义字体、布局、颜色和呈现效果。这将确保无论你使用什么种设备或依赖多大尺寸的屏幕，网站的呈现效果都是正确的。


    我们将通过 `CSS` 看到的最重要的事情之一，以及它如何帮助我们的，就是它可以布局我们所有的图像、元素、`CSS` 样式以及我们想要放在页面上的其他部分。虽然
    `HTML` 和 `CSS` 在很多情况下是一起使用的语言，但也可以看到这两种语言独立运行。事实上，正是这种独立性使得用户能够共享样式表，即使页面不是 `HTML`
    格式，或者是任何基于 `XML` 的语言也可以。


    为了让这两种语言中的任何一种正常工作，你需要准备好几样。这包括一个网络浏览器（可以是你喜欢的任何现代网络浏览器），以及市面上任何简单的文本编辑器，它们可以帮助你保存在此期间决定创建的一些文件。


    如果你打算从事任何类型的网络开发，可能会发现稍微琢磨一下 `HTML` 语言是你能够使用的最佳选择之一。这至少是一件你可以花时间去学习更多的好事，以防你将来需要为个人或业务用途处理某些网页。另一方面，有些人发现他们更喜欢偏向网页的设计，那么他们会更倾向于使用
    `CSS`。


    ![](img/rsrcSB.jpg)


    ## PHP


    我们将看到的第二种语言是 `PHP` 语言，全称为超文本预处理器（Hypertext Preprocessors）。这是一种服务器端开源脚本语言，将与 `CSS`
    和 `HTML` 一起使用，来处理你想实现的某些任务自动化。`PHP` 允许我们真正整合我们希望网站具有的一些高级功能，例如为在线商店提供购物车、论坛，以及你需要的更大更复杂的图像库库等。


    当你使用 `PHP` 时，你还可以创建许多可以在网站上使用的应用程序，例如单位转换器、待办事项列表、`RSS` 阅读器等。我们也可以很容易地在 `HTML`
    代码中嵌入所需的 `PHP`，以便我们能够连接到想要从中提取信息的各种数据库，如 `Oracle` 和 `MySQL`。


    `HTML` 和 `PHP` 之间的主要区别在于脚本完成的位置。`HTML` 代码更多是在用户的浏览器上完成的，即在客户端；而 `PHP` 编码将在服务器上完成，就在它实际在用户的浏览器上发布之前。当我们想要处理某些
    `PHP` 代码时，需要准备好几件事。首先，我们需要确保自己有一点 `HTML` 知识。你还需要以下两样之一：


    * 一个支持 `PHP` 语言的 Web 托管。

    * `PHP` 以及安装在电脑上的 Web 服务器。你可以在网上找到许多免费的此类工具。


    除了这些，我们发现还有一些需要学会使用的 `PHP` 不同规则。首先：


    * 你需要在记事本上写出所需的 `PHP` 代码，然后最后以 `.php` 扩展名保存它们。

    * 你不应该使用 Word 处理器之类的软件，因为它们无法像你希望的那样处理代码中的某些内容。相反，最好坚持使用记事本。

    * 像 `HTML` 一样，`PHP` 语法通过闭合标签来帮助编译器识别所有不同的部分。

    * 在 `PHP` 语法中，空白字符并不重要。

    * `HTML` 可以包含在 `PHP` 文件中，并且它们可以正常工作，但你无法反过来这样做。


