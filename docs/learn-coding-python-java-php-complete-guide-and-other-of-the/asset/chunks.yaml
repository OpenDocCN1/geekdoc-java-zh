    of English, rather than relying on numeric codes. It does come with a set of rules,
    which is the syntax, that you will need to follow. But it is going be a write
    once and run anywhere kind of language, which means that both experts and beginners
    are able to jump onto this language and see some results.


    `Java` has been around since the early 90s. it was a language that was developed
