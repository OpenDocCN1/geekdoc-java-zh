    # Chapter 2: Common Features Coding Languages Share


    Some of the beauty of coding is the fact that there are a lot of coding languages
    that you are able to work with. Sometimes it is going to seem chaotic because
    each of these languages works on different things and they will have their benefits
    and negatives to consider. Some are going to be a bit easier to work with and
    some are harder. And each of them works with a lot of different types of programming
    that you want to work with.


    The good news here is that no matter which of the programming languages you want
    to work with, you will need to know a bit about some of the common features and
    components that the languages are going to share with one another. Some of the
    parts that we are able to remember here will be:


    ### The statements

    Each line of the code that you are going to work with will be known as a statement.
    Sometimes these are long and you will need to break them up to make it work, and
    sometimes they are going to be a little bit longer. Sometimes the programming
    language is going to ask you to have a special character at the end, usually a
    semicolon, to help denote that the command is done at that time.


    You are able to make these statements into anything that you would like. They
    can be a short sentence or a whole explanation of what you would like to see happen
    in some of the codings that you would like to do. It will not take long of working
    with some of the coding languages out there before you start to notice how prevalent
    these statements really can be for your coding.


    ### The Comment

    Comments are another tool that we are able to use when it comes to coding. You
    are able to add in these comments in order to describe what is going on at a certain
    part of the code and leave yourself, or another programmer, a little message as
    to what is going on in some of the code that you are writing along the way as
    well. You can add in a lot of these comments into your code if you would like,
    but keeping it to a minimum is important to ensure that the process is going to
    continue working.


    Each language is going to have a special symbol that you will need to put in front
    of the comment that you are writing to ensure the compiler knows that this is
    a comment. If you use the right symbol, the compiler will know to skip over this
    statement, and will not try to execute it or ruin your code.


    A good example of this is the Python language. If you would like to write out
    a comment inside of this language, you would simply add the `#` symbol ahead of
    time. if the comment is going to take up more than a few lines of code, then you
    would be able to add that symbol before each line of code that you are working
    with as well. While other coding languages are going to use a different kind of
    symbol to get the work done, you will find that this can really be a similar matter
    with each of them, and you will find that this can really be a similar matter
    with each of them, and you will find that this can really be a similar matter
    with each of them.


    ### The Syntax

    The syntax is basically the rules of how you are able to write out a specific
    part of the code. Each code is going to have syntax based on how the compiler
    will be able to read the information. The syntax is often like grammar rules that
    we have to follow in our language, but it is more direct to the point and usually
    has rules that are stricter. You have to learn the programming rules and do some
    practice to really learn how the syntax is supposed to work in some of the codes
    that you are working with. The syntax is going to be the rules that we have to
    follow. If you miss out on part of the syntax that is really needed in order to
    handle some of the codings that you are doing, then the compiler is not going
    to be certain about what. One of the first things that you should focus on when
    it is time to work in any language is its syntax. You should be able to catch
    on to some of these quickly, but it is still important to make this a priority
    for some of the work that you are doing. Take some time to learn more about this
    syntax and how it is going to work, and it will help you move forward with any
    of the coding languages that you choose to work with.


    ### Data type

    For most coding languages, you will find that data is going to be important. You
    get to choose what kind of data you would like to assign depending on the inputs
    that you are expecting from the user. Data is going to be a reserved space on
    the memory of your computer to store that value later. Picking the right one is
    going to provide us with a good balance between making sure the outputs are not
    unwanted and maintaining performance. Data is so important when you are learning
    how to code along the way and what each of them is. For example, you may notice
    that there are a lot of data types like lists, dictionaries, integers, floating
    point numbers, tuples, and more. Each of the coding languages that you decide
    to spend your time on will have these data types and it is important to work with
    these as well.


    ### Variables and constants

    These should be easy to learn more about. The constant is going to be a value
    that you place into your program, but it is not meant to change. You are going
    to assign a fixed value to a special name tag so that you are able to reference
    back to it in the future. Then there are the variables, the ones that are going
    to change to something else that comes with that type of data.


    Another thing to note here is that the act of defining the variable or the data
    type of a constant is going to be known as the declaration. But the act of setting
    a value to your constant or variable for the first time is going to be initialization.
    Just keep in mind that this declaration isn’t going to be necessary for each programming
    language so you have to look at the documentation of that chosen language. A good
    thing to remember with these variables is what they entail: they are going to
    hold onto a specific spot in the memory of your computer. If you just put a variable
    up in the code, you are basically just reserving a blank spot in that memory;
    we have to add value to the variable to ensure that the spot is reserved for something
    important. Assigning a value over to the variable that we want to work with is
    going to be a simple process. In the coding languages that you can choose from,
    taking the `=` and placing it between the variable and the value is going to be
    all that it takes. This tells the compiler that the specific value you place with
    the variable needs to go into that specific spot in the memory of the computer
    that you reserved with the variable. You can then go through and pull it out by
    calling up the variable when it is time to run the program later on.


    ### The arrays

    Arrays are also not going to be for beginner coders, but when they are used in
    the proper manner, you will find that they make the program more efficient. If
    you find that you are spending too much time making a lot of variables to store
    data that is similar, then you may find that you can simplify it all by working
    on an array that is going to store these values in their own cells. This can help
    to keep things organized a little bit more and will ensure that you are getting
    everything in one place. These arrays may sound complicated but you will find
    that they are used quite a bit in some of the codes that you will want to write,
    so we do need to spend a little bit of time on them. To start with, we will find
    that an array is going to be one of the structures of data that you are able to
    use. It is going to contain a group of elements of your choice. For the most part,
    you will find that these elements are going to be the same type of data, such
    as strings or integers. Arrays are going to show up in some of the programmings
    that we want to use because they are good at organizing the data. For example,
    if we are using a search engine, we may be able to find an example of an array
    to help store the results.


    ### Functions, parameters, and objects

    Now we are going to get into a few different parts that are all going to fit together
    but will need to be discussed as well: `functions`, `parameters`, and `objects`.


    ### Conditionals

    Remember when we were talking about the diamond shape that is found in our flowchart
    from earlier? When this is translated into code, we will call it our conditional.
    Every one of our modern coding languages now has these and it can show up many
    times because programs have to go through and make decisions based on the input
    of the user. If the user inputs this, then `A` is going to happen. If they input
    another thing, then `B` happen. When we are talking about computer programming,
    the conditional is going to be the conditional statements, sometimes known as
    decision control statements as well. These are going to be important because they
    are going to help us perform a wide variety of computations or actions, and often
    this will be dependent on whether the programmer went through and specified a
    Boolean condition that evaluates as `true` or `false`.


    Apart the case of what is known as branch prediction, this is always going to
    be something we are able to achieve when we selectively alter the control flow
    based on one of the conditions that we decide to set from the beginning. When
    we look at this from the point of view of imperative programming languages, we
    will find that the conditional statement is the one that we will use in most cases.
    But when we are working with something that is known as functional programming
    instead, then we are going to see a term like a conditional construct or a conditional
    expression be the one used. This is because all of the terms are going to come
    with their own distinct meanings, and we have to be able to recognize these and
    learn what they are able to do. There are a lot of different options that we are
    able to see when it comes to these kinds of conditional statements: `if`, `if
    else`, and `elif` are going to be some of the more common options. When you get
    started on one of the programming languages that you would like to use along the
    way, you will quickly find that there are many conditional statements, and you
    will be able to learn the syntax and some of the basic coding that will come with
    each of these for your own needs as well.


    ### Operators and Operands

    These are the parts of the code that will be used in the conditions and statements
    that you have and can help us to manipulate some of the data that we have. The
    stored values that are found in our constants and variables are going to be the
    operands we are looking for, and then the operators are going to be some of the
    symbols for manipulation like `+` or `-`.


    ### Null

    When we are working with one of our conditional statements, you will basically
    spend time evaluating the conditions of the two values that are stored. But if
    you would like to make a condition that will lead to a particular statement if
    the stored value has nothing, then you are working with the `null` value. In programming,
    `null` is going to mean, literally, nothing, but it will be different than a blank
    space or a zero in the program. The term or the representation of a `null` value
    is going to depend on the language.

