    many of these online for free to work with.


    In addition to some of this, we will find that there are a few different rules
    for `PHP` that we need to know how to work with as well. To start:


    * You will need to write out the codes that you need in `PHP` on notepads, and
    then you can save them with the extension of `.php` in the end.

    * You should not work with something like a Word Processor because these are not
