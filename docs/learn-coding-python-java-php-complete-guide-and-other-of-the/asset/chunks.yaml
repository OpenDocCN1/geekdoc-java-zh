    当然，这些只是你能够使用 SQL 语言执行的少数命令。任何你能够通过操作数据库来让其运行得更好、确保其中包含你所需的信息，并能够根据你的意愿对其进行必要更改的操作，都可以通过
    SQL 语言的帮助迅速完成。考虑到这一点，我们还可以使用像 `Drop` 和 `Create` 等其他命令来执行真正修改数据库所需的其他任务。


    在这里请记住，你想要操作的每种关系型数据库系统都包含一个或多个被称为“表”（tables）的对象。就像我们在电子表格和文档中使用的表格一样，表会有名称、属性、行和列。


    SQL 看起来似乎像是一种有很多限制的语言，但你会发现许多编程专业人士会认为深入学习这种语言是非常值得的。例如，数据工程师、数据科学家和数据分析师可以使用
    `SQL` 来帮助他们组织和评估数据，特别是在处理成千上万个数据点时。它对研究人员和营销人员也有帮助。这种语言可能比我们我们将提到的其他一些语言更容易处理，但这并不意味着它在在使用过程中不会带来一些收益。


    ![](img/rsrcSE.jpg)


    ## C 和 C++


    `C` 将是我们在这里能够使用的第一种语言，它是由 Dennis Ritchie 在 1972 年为贝尔电话公司开发的。这种语言最初被用作帮助编写操作系统的语言，因为
    `C` 不依赖于其他程序，也不需要为硬件或操作系统进行重写。`C` 还具有高效的内存管理功能，这允许程序员完全控制何时、在何处以及如何分配他们拥有的内存。


    程序员喜欢使用 `C`，因为与某些其他语言相比，它允许他们获得他们所需的灵性和控制力。事实上，它是如此受欢迎，以至于 Ritchie 在发布后一年与 Ken
    Thompson 一起工作，并使用 `C` 编程语言重写了 `UNIX` 操作系统的大部分部分。当时，操作系统大多是用汇编语言编写的，虽然运行良好，但它为我们产生成了只能在特定类型
    CPU 上运行的程序。有了这种操作系统，你即使在不同类型的计算机上使用它，也可以重新编译内容。


    接着在 1979 年，Bjarne Stroustrup 在贝尔实验室开发了 `C++`，作为对 `C` 语言的升级或扩展。这种语言还为原始的 `C` 语言增加了一些新功能。现在我们会发现
    `C++` 经常用于嵌入式软件、视频游戏、需要大量内存的应用、音视频处理等。


    许多其他语言，包括 `C#`、`Java` 和 `.NET`，都是从 `C` 和 `C++` 语言派生的。正因如此，你会发现当你足够精通这两种语言时，你能够完成大量的项目，大部分是在系统软件领域。


    如果你正在考虑严肃的编程职业，`C` 将是我们入门的一个很好的语言，因为它遵循了一些你可能希望从事的更传统的编程方法。在你开始使用它时可能会觉得有点奇怪，但记住，这两种都是
    80 年代或更早的语言，但从 2020 年开始的一些未来更新可能会让它们变得更容易处理。


    ## Objective C


    我们能够使用的另一种选项被称为 `Objective C`。这种语言从 80 年代某时候起就存在，但并没有立即获得很大普及。它被原始程序员在 1988 年卖给了
    NeXT，后者将其用于该操作系统。随后它在 1996 年被 Apple 收购，并迅速成为 Mac 操作系统以及 iPad、iPod touch 和 iPhone
    编程的主要语言。


    这种语言是 `C` 的超集。对于我们来说，这意味着这种编程语言能够超越我们原始对应语言的能力。它意味着任何你用 `C` 编写并编写的代码都可以用于 `Objective
    C` 程序，而无需你对其中任何内容进行重写或修改。


    这里需要注意的一点是，你无法向后回溯。`C` 程序在 `Objective C` 中可以运行良好，但 `Objective C` 程序无法在更传统的 `C`
    程序中运行。这主要是因为 `Objective C` 带有许多新增的功能。我们还可以查看这种语言的两种特定变体，它们包括：


    *   `Objective C++`：这是我们可以在某些 `Objective C` 应用程序中处理 `C++` 代码。

    *   `Objective C 2`：它的工作方式与该语言的原始版本类似，但它添加了一些新功能，包括自动内存管理。


