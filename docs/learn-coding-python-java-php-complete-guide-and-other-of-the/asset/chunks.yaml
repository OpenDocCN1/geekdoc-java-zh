    - **椭圆（开始和结束）**：椭圆（或椭圆形）将是一个告诉我们程序流开始和结束的符号。为了保持流程图尽可能简单，你只需要使用这两个椭圆，一个表示开始，一个表示结束。不过，如果你的程序设计为有多个结束点，也可以使用多个椭圆。

    - **箭头**：这是我们用来帮助连接流程图中各个形状的线条，箭头头部用于告诉我们程序流的运行方向。这有助于避免像你之前编写算法时那样需要输入带编号的步骤。箭头为你的图表逻辑增加了一些灵活性，并在程序变得更复杂时减少一些杂乱内容。

    - **平行四边形（输入和输出）**：这有助于我们看到输入或输出的操作。每当你想在程序中从用户处接受一个值（输入）或显示一个值（输出）时，请确保出现平行四边形。

    - **矩形（处理过程）**：这将帮助我们看到计算机在内部执行的任何操作。基本上，任何不接受输入或不显示输出的直接操作都需要用这种矩形来表示。例如，类似于模运算的计算可以使用这种符号。

    - **菱形（判定）**：这是一种用于帮助分支程序流或帮助处理条件语句的符号。它仍然被视为一个过程，因为计算机会在内部执行操作，但它必须根据你设置的条件进行判断并选出正确的路径。


