    # Ruby

    你会发现 `Ruby` 对于初学者和高级程序员来说都是理想的选择。它目前是一个非常活跃的社区，仅 `GitHub` 上就有 3500 人，而且它的魔力不断让编码人员和公司感到惊叹。Ruby
    的这种魔力也是许多用户最大的抱怨之一；他们担心这种语言太强大，以至于简单一行代码就能让一个项目变成功能完备的状态，而编码员并不真正理解它是如何发生的。这就是为什么你可能需要加入一个社区或类似的组织，帮助你更多地学习这种编程语言及其工作原理。


    # C#

    `C#` 是我们另一种可以进一步了解的语言。它由 Anders Hejlsberg 及其团队为微软开发。由于 `C#` 在发布时与 `Java` 极其相似，它曾被认为是
    `Java` 的克隆版本。但今天，`C#` 已经是一种在许多应用程序和行业中广泛使用的编程语言。


    在 3D 游戏开发领域，`C#` 是最流行的语言之一，但你也可以它来帮助创建一些动态网站。`C#` 吸收了 `C++` 和 `Java` 的一些特性，然后剥离了它们所有有问题的特性，包括移除宏、模板和多继承。这使得它更加现代、更容易上手、更简洁，并且是一种非常高效的语言。`C#`
    是一种非常灵活的语言，这就是为什么它是 `Windows`、游戏、Web 应用程序和其他程序的入门语言的良好选择。由于它源自其他一些 `C` 类语言，你会发现，如果你花时间精通这种语言，学习其他语言的速度也会一样快。


    # Swift

    `Swift` 是一种深受 `Apple` 开发者喜爱的编程语言。它的开发用于 `Linux`、`watchOS`、`tvOS`、`iPadOS`、`macOS`
    和 `iOS` 等。与之前某些可能是静态类型的语言相比，`Swift` 是一种快得多且更简洁的语言。


    与其他语言相比，`Swift` 是一种较新的语言，因为它用于许多客户熟悉并喜爱的 `Apple` 产品。只要你监控功能以满足你的需求，它也可以用于其他类型的产品。对于那些兴趣为
    `iOS`、`macOS`、`watchOS` 和 `tvOS` 创建应用程序，或将其与任何 `Apple` 产品一起使用的人来说，`Swift` 是完美的。它对于初学者也是理想的，不仅是因为
    `Swift` 的写法接近英语，还因为 `XCode` 会自动检查用于构建应用的代码。


    # Kotlin

    下一个选项是 `Kotlin` 编程语言。`Kotlin` 是一种基于 `Java Virtual Machine`（Java 虚拟机）的开源编程语言。当
    `Google` 在 2019 年 5 月宣布 `Kotlin` 是 `Android` 开发者的首选语言时，它在开发者社区中获得了广泛关注。


    `Kotlin` 的设计并不是为了直接取代 Android 开发中的 `C++` 和 `Java`，但在 `Google` 对这种语言的支持下，`Android`
    开发者可以放心地追求前沿，因为知道这种语言在未来几年内将获得支持，而且学习曲线更容易上手。`Java` 是一门老老的语言，尽管它维护得很好，但 `Kotlin`
    仍在尝试减少完成操作所需的代码量。现有的 `Java` 开发者会发现这种过渡是平滑且容易的，因为这两者在很多情况下是可以协同工作的。


    # Rust

    最后要查看的语言是 `Rust`。与其他一些语言相比，这是一种更底层的语言，但它在我们的列表中仍有一席之地。`Rust` 是由 `Mozilla Foundation`
    开发的一种较新的语言。它就像 `C++` 语言的重生，但与其他语言相比，它有一些有趣的改进。


    与其他底层编程语言一样，`Rust` 的内存占用很低，这使得它比 `Java` 快。这是我们预期的，因为混合了较少的类英语语句使得它更容易被翻译成所需的机器代码。同时，`Rust`
    解决了在 `C++` 和 `C` 中发现的主要缺点，例如安全性。基本上，`Rust` 带有许多安全措施，以确保你在运行代码时不会遇到错误。由于内存占用低，考虑使用
    `Rust` 开发 Web 应用程序和嵌入式设备变得更容易。`Rust` 的社区目前较小，但如果你有 `C` 或 `C++` 经验，它是一门很好的学习语言，且易于操作。


    # 入门

    编程世界中初学者的益处之一是，你可以根据任何喜欢的标准来选择编程语言，例如确定与其他语言相比，你有多喜欢某一种语言。如果你用一种语言开始一个项目，发现自己不喜欢这项工作，可以切换到另一种。尝试几种语言并找出哪种最适合你很容易。


    # 第 4 章：为编码做准备

    现在我们已经查看了编码的基本术语，是时候做好准备了。我们将深入探讨所需的准备工作。


    ## 准备愿景

    首先需要关注的是如何准备你的愿景。对于许多新程序员来说，这从确定他们最初为什么想学习开始。有很多激励因素需要考虑，例如制作游戏、为像 `Apple` 这样的大公司工作或建立作品集。你应该考虑你想要达到的总体目标。准备愿景通常是最困难的部分之一，但它将帮助你专注于目标。


    ## 获取程序结构

    在早前的章节中，我们讨论了算法的重要性。虽然在很多情况下这不是绝对要求，但从一开始就拥有良好的结构是一个好主意。有时取决于你的偏好，有时重要的是选择满足你需求的结构。


    ## 如何准备硬件

    编码中酷酷的一点是，你不需要昂贵的电脑就可以开始。只要软件准备就绪，你甚至可以使用旧的 `Windows` 笔记本电脑完成编码。编码并不是一项巨大的投资。你的硬件选择通常取决于你计划花费的时间。如果你在家里或办公室工作，你可能需要一台台式电脑。这些更便宜，功能更强大，并且更易操作。芯片组和移动组件更贵；当你同时运行多个应用程序时，性能很重要。当你编译程序、使用调试器
    `debugger` 或解释器 `interpreter` 或运行复杂程序时，性能至关重要。核心数越多越好。如果你在 `AMD` 或 `Intel` 之间选择，主频越高越好。8
    GB 的 `RAM` 是最好的，但更多更好。显示器的分辨率越高越好。


    ## 准备软件

    为了节省成本，我们将查看适用于你选择语言的免费或低成本选项。


    ### 流程图

    如果你想画流程图，`http://draw.io` 是一个帮助你工作的良好选项。


    ### C++ 和 HTML

    `C++` 是一个学习基础的良好语言，如果你想动手，可以使用沙盒。如果你想处理 `HTML`，你可以使用 `https://codeeditor.com`。界面不像其他选项优雅，但它提供了一个实时预览，让你更容易编写代码。


    ### 源代码编辑器

    无论是采取原始编码路线还是想要一个功能全的 `IDE`，拥有一个都是好意。有些编辑器不是很重的，你可以使用免费版本并看到相同的结果。你也可以考虑像“花哨哨”这样的功能。


    ### IDE

    当我们转向 `HTML` 等可以在线完成的内容时，许多语言需要一个 `IDE` 来完成工作。这些是编写 `Python` 等语言的环境。当你下载时，通常有免费的
    `IDEs`。这降低成本并提供了许多功能。


    ### 操作系统

    如果你在使用旧操作系统，`Linux` 可能是一个良好的选项。如果你需要虚拟机，`VMware Player` 是在系统上运行 `Linux` 的良好方法。


    ### 游戏化

    为了保持动力，有些人使用 `Habitica`，这是一种使用游戏化方法帮助你编码的工具。让编码过程更有趣的一种方法。


    ### 命令行

    如果你在编码时遇到问题，可以使用 `SpeedCrunch`。与其他计算器不同，它提供了一个可以在其中输入方程的命令行框。


    ### 项目管理

    如果你正在做一个大项目，你需要一种方法来跟踪工作状态，特别是多人参与时。`Trello` 是一个帮助解决问题的良好工具。


    # 第 6 章：让编码成功的提示和技巧

    是时候关注你自己了。无论你是初学者还是开发者，这些提示都会帮助你进步并减少挫败感。


    ## 有信赖的备份系统

    第一件事是备份系统。我们已经到了丢失数据不是选项的地步。使用与操作系统集成的云计算 `cloud computing` 来确保源代码已备份。大多数源文件很小，你可以使用
    `WinRAR` 等应用程序将其进一步压缩。


    在 `Windows` 上工作时，在 `OneDrive` 文件夹中创建一个文件夹，并将所有项目和代码放在那里。如果你看到绿色复选标记，说明代码已备份到云端。如果没有，从开始菜单启动
    `OneDrive` 并登录你的 `Microsoft` 账户。此外，将文件拷贝到优 盘或外部硬盘以备万一。


    不要把所有的鸡蛋放在一个篮子里。许多程序员依赖多个服务。`Dropbox` 是一个类似于 `OneDrive` 的良好选项。你可以在后台运行两者进行在线存储。一旦你变得更专业，考虑将代码上传到
    `GitHub`。云服务也方便你与他人分享代码。


    ## 使用虚拟桌面整理工作区

    另一件事是你如何组织你的空间。虚拟桌面可以提高你的效率。在 `Windows` 中，你可以使用快捷键在它们之间移动。在 `Mac` 上，你使用 `Spaces`。你可以使用触控板上的手势或键盘快捷键。在
    `Windows` 中，使用 `Ctrl` + `Windows Key` + `左` 或 `右` 在桌面之间切换。


    ## 打印（准备）你的代码单

    当你学习基础时，这些是良好的语言。


    ## 需要时寻求帮助

    在之前，写下以下内容：

    1. 列出你想要什么。

    2. 解释问题是如何发生的（哪里开始的）。

    3. 列出你已经尝试过的内容。


    # 第 7 章：如何选择我们的语言

    本章关于根据个人偏好、职业目标或数据科学等领域来选择语言。


    ## 你想做什么样的项目？

    有些语言适用于特定的项目。

    - **网站**：`HTML` 或 `JavaScript`。

    - **游戏**：`C#` 或 `C++`。

    - **通用**：`Python` 是许多任务的良好选择。

    从一开始理解你的项目需求。


    ## 你想做数据吗？

    如果你对数据科学、机器学习或人工智能感兴趣，请寻找支持这些语言。`Python` 在这里很常见。


    ## 哪一个能吸引你？

    如果你阅读了第三章，你会看到许多优秀的语言。寻找一个因以下原因脱颖出的：

    - 它提供了许多选项吗？

    - 它对你的项目有帮助？

    - 语法符合你吗？

    - 它有更好的资源吗？


    即使你是因为职业选择语言也没关系。每个人都有自己的旅程。在开始之前研究以比较特性、优点和缺点。


    ## 有针对特定领域的语言吗？

    很多人是为了特定领域学习的。

    - **移动**：寻找应用特定的工具。

    - **Web**：使用基于 Web 的语言。

    你可能需要学习 `Python` 或 `Java`，但你可以快速掌握基础。


    # 结论

    感谢阅读到最后。我们希望本指南具有启发性。编码是一段旅程，从基础是关键。如果你不确定使用哪种语言，这里提供的工具应该帮助你实现目标。


