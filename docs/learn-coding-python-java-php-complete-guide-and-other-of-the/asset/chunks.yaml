    ## Programming Languages


    * **Image languages**: These are going to be the languages that have been stripped
    down quite a bit. This allows us to learn about some of the concepts of programming
    with the help of manipulating various images along the way.

    * **Block languages**: These kinds of languages are often going to be known as
    bubble languages as well. These kinds of programming languages are going to allow
    the users to go through and snap together parts of code, rather than writing out
    the code themselves. This is going to be a visual as image languages are going
    to give you a look at the actual code, so you see what is happening, but you will
    not have to physically type it out for yourself.

    * **The real programming languages**: These are some of the more traditional coding
    languages that you are able to work with, the ones where you will actually have
    to go through and type things out line by line. you will find that some languages
    like `Java`, `Lua`, `PHP`, `JavaScript`, and `Python` are going to fit into this.


    You have to remember here that the coding language that you decide to go with
    should not be based on your own age. You can find that there are kids who are
    ready to jump in and start working with the `Java` language right away, especially
    if they would like to do some work with `Minecraft` at an early age. And then
    there are adults who want to work with some of the block-based tools if they find
    that learning in a visual manner rather than a text-based model is the best option
    for you. But one thing that we have to consider when picking out the language
    is that no matter which of the many great programming languages that you choose,
    the one that you start with should be based on the comfort level that you have.
    you should not push any of your coding skills, especially as a beginner, and learn
    how to believe in a more natural progression along the way. With that said, let’s
    take a look at some of the most common coding languages that you are able to work
    with, and some of the things that you are able to do with each one. This can give
    us a good idea of how these languages are meant to work, and what we will be able
    to do with them along the way.


    ![](rsrcSA.jpg)


    ## HTML and CSS


    `HTML`, which is known as Hypertext Markup Language, and the `CSS`, which is known
    as the Cascading Style Sheets, are going to be two of the most important technologies
    that you will be able to learn about when it is time to create some of the web
    pages that you want. `HTML` is going to help make sure that the web page you are
    on will have the right structure, which could be everything from the images, the
    tables, lists, headings, hyperlinks, sound, videos, and any of the other elements
    that you would like to add into the page, as long as you label them in the right
    manner inside of the code.


    Then the `HTML` is going to be the language that will work in the right way to
    help the web browser that we work with understand the elements that we have been
    able to create, and will then display some of the files of the website in the
    proper manner as well.


    Then we can move on to the `CSS` language. This is going to be the one that we
    need to use with the `HTML` because it is going to be able to change up the way
    that the `HTML` looks, which the user is able to edit to customize the fonts,
    layouts, colors, and the presentation. This will ensure that the presentation
    of that website is going to look right, no matter what kind of device you are
    using, or the size of the screen that you are relying on.


    One of the biggest things that we are going to see with `CSS` and how it can help
    us to is laid out all of our images, elements, `CSS` styling, and other pieces
    that we want to put on our page. While `HTML` and `CSS` are languages that are
    going to be used together in many cases, it is possible to see these two languages
    work independently of one another. In fact, it is this independence that makes
    it possible for users to share the style sheets, even with a page that is not
    `HTML`, or with any `XML` based kind of language.


    For either of these two languages to work, you will need to have a few things
    in place. This includes a web browser, which can be any of the modern web browsers
    that you would like, and any of the simple text editors out there that can help
    you to save some of the files that you decide to create during this time.


    If you are looking to work with any kind of web development that is out there,
    you may find that tinkering a bit with the `HTML` language is one of the best
    options that you are able to work with. It can at least be something good that
    you can spend your time on and learn more about in case you ever need to work
    with some of the web pages for personal or business use. On the other hand, some
    people find that they like to go more with the design of a web page, and then
    they are going to prefer going with the `CSS` instead.


    ![](rsrcSB.jpg)


    ## PHP


    The second language that we are going to take a look at is going to be the `PHP`
    language, which stands for Hypertext Preprocessors. This is going to be a server-side,
    open-source scripting language, which is going to be used along with `CSS` and
    `HTML` together to handle some of the task automation that you want to work with.
    `PHP` allows us to really work with incorporating some of the advanced features
    that we want to have with our website, such as having a shopping cart for online
    stores, forums, and some of the bigger and more complex image galleries that you
    need, among others.


    When you are working with `PHP`, you will also be able to create a lot of apps
    that can be sued on your websites, such as a unit converter, a to-do list, an
    `RSS` reader and more. It is also pretty easy for us to go through and embed the
    `PHP` that we need int the `HTML` code, so that we can easily connect to some
    of the various databases that we want to pull information from, such as `Oracle`
    and `MySQL`


    The main difference that you are going to see with `HTML` and `PHP` is where the
    scripting is going to be accomplished. The `HTML` code is going to be done more
    on the browser of the user, which means on the client-side of things, and then
    the `PHP` coding will be done on the server, right before it actually goes live
    on the browser of the user. There are going to be a few things that we need to
    have in place when we want to work with some of the `PHP` code. To start, we need
    to make sure that we have just a little bit of knowledge about `HTML`. You will
    also need any of these two below:


    * A web host that is able to support the `PHP` language.

