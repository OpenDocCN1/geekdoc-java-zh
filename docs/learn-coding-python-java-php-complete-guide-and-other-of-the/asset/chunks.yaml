    如果你对开发可以在各种 Apple 产品上运行的应用程序感兴趣，你可能会发现在代码中混合使用 `Objective C` 和 `Swift`，然后利用它们为
    Apple 产品创建大量应用程序是实现这一目标的最佳方式。


    ## Java

    尽管名字听起来相似，但你会发现 `Java` 与 `JavaScript` 之间并没有联系。`Java` 的许多原则实际上基于我们之前讨论过的 `C++`
    语言构建并在此基础上改进的，但你会发现，大多数程序员普遍认为 `Java` 语言整体上更符合用户习惯。


    `Java` 是一种静态类型语言，这允许程序员用英语命令的形式来写出他们想要的指令，而不是依赖数值代码。它确实包含了一套规则，即语法，你需要遵循这些规则。但它是一种“编写一次，随处运行”的语言，这意味着专家和新手都能上手这门语言并看到一些成果。


    `Java` 自 20 世纪 90 年代初一直存在。它是 James Gosling 及其团队为 Sun Microsystems 开发的一种语言，最初设计用于用于当时的移动设备。但在
    1996 年发布期间，它的用途转向到了互联网，为程序员提供了一种创建比以前更具动画效果网页的方法。


    今天我们将看到 `Java` 既用于离线也用于在线，估计财富 500 强公司中有 90% 将使用基于 `Java` 的应用程序来帮助完成某些日常运营。程序员们会喜欢使用这种语言，因为它非常安全、可靠、可维护、稳定，并且可以扩展到我们想要的任何类型的项目。


    你会发现 `Java` 可以用于许多应用程序，无论我们谈论的是桌面应用还是移动端应用。它通常在大型企业应用中使用率最高，所以如果一家医院或银行有一位他们想要合作的内部
    `Java` 开发者，你不必感到太惊讶。如果你想从事任何计算机科学方面的工作，那么 `Java` 将是你的最佳选择之一。


    ## Python

    ![](img/rsrcSF.jpg)

    首先，这门语言是以著名的喜剧剧《蒙提派剧团》（Monty Python）命名的。`Python` 被认为是初学者最容易学习的语言之一，因为它不需要某些其他语言所具备的所有部分，你不需要处理一堆花哨的
    0 和 1 就能看到它运行。它拥有简洁良好的语法，允许用户用英语写出他们想要的命令。


    今天已经有很多公司在使用 `Python` 了，包括 Yahoo Maps、Dropbox 和 YouTube。除了其他特性外，`Python` 语言还将关注空白，这意味着你不需要花费所有时间编写成千上万行代码来让代码运行起来。还有许多
    `Python` 库是现成的，你可以导入并将其作为模板使用。有时，这些库对于获取灵感并帮助你开始项目非常有帮助。


    仅举几角，`Python` 将是机器学习、人工智能、网络安全和数据科学等领域的首选语言。这就是为什么包括迪士尼和谷歌在内的许多公司在这些这些领域处于领先地位。它也是一门可以被使用的编程语言，对于从事数值计算项目的科学家，或者专注于市场上某些视频游戏和
    Web 框架的程序员来说，是非常理想的。`Python` 对我们来说非常容易设置并按照我们想要的方式运行。我们只需要从 `www.python.org` 网站下载并安装软件，就可以在我们喜欢的任何操作系统上使用它。一旦安装，你就可以开始你的一些初始项目了。


    许多专家会向那些刚开始编程且过去从未做过此类工作的人推荐 `Python` 语言。这是因为 `Python` 能够教会我们一些高度结构化的编写问题和解决方案的方法。然而，我们必须注意，与其他编程语言一样，你会发现
    `Python` 的学习曲线也会较高。所以，如果你已经学习了其他的某种语言，你可能会发现立即转向 `Python` 也会带来一些挑战。


    如果你是因为职业变动而选择一种语言来编写代码，那么 `Python` 语言将是适合你的。至少懂一点 `Python` 的程序员，特别是那些能够精通 `Python`
    语言的人，在美国在该领域的收入位列第二高。唯一超过他们的是那些知道如何使用我们接下来要讨论的 `Ruby` 语言的程序员。


    ## Ruby

    这是另一门我们可以花时间了解的语言。`Ruby` 是松本裕弘（Yukihiro Matsumoto）在 1995 年创建的语言。这是一门非常棒的通用型语言，意味着它有足够的灵活性来完成你想要的工作，从连接数据库到运行
    Google 的任何工具，甚至于创建几个用于在线和网站的应用程序。


    `Ruby` 将与 `Rails` 框架联系在一起，这就是为什么“Ruby on Rails”这个短语听起来可能有些熟悉。这是因为当我们把它们结合时，`Rails`
    和 `Ruby` 可以轻松将想法转化为现实世界的应用程序。使用 `Ruby` 的知名网站列表包括 Airbnb、Hulu、Twitter、GitHub、Zendesk、Treehouse
    和 Urban Dictionary。有些人可能担心 `Ruby` 很难使用，因为它可能不像其他语言那样对新手友好，但事实并非如此。你不仅发现 `Ruby`
    的语法与其他某些编程语言（包括 `C+`）相似，我们还会发现 `Ruby` 是灵活编程语言的许多其他原因，包括：


    *   它拥有简洁易读的语法，非常适合初学者。命令非常通俗易懂。

    *   `Ruby` 有内置函数，初级开发者可以直接在他们的 `Ruby` 脚本中使用。

    *   可以嵌入 HTML 并连接到其他其他数据库选项，包括 `DB2`、`MySQL`、`Sybase` 和 `Oracle`。

    *   你可以在 Windows 上安装它。

    *   适用于构建互联网和内网应用程序。

    *   它们具有高度的可扩展性。这意味着你可以从小开始，并在准备好后扩大规模。

    *   它将支持许多你喜欢的 GUI 工具。


    '
- fmt: "\n\n# Ruby\nYou will find that `Ruby` is ideal for both beginners and advanced\
    \ programmers. It is an active community right now with 3500 people just on `GitHub`,\
    \ and the magic continues to wow coders and companies all of the time. This magic\
    \ of Ruby is also one of the biggest complaints that many users have; they worry\
    \ that this language is too powerful that a simple line of code would be able\
    \ to turn a project into something that is fully functional without the coder\
    \ really understanding how it happened. This is why you may need to join a community\
    \ or similar to help you learn more about the coding language and how it works.\n\
    \n# C#\n`C#` is another language that we are able to learn more about. It was\
    \ developed by Anders Hejlsberg and his team for use by Microsoft. `C#` was used\
    \ to be known as a clone for `Java` because of how similar it was to that language\
    \ when it was released. Today, though, `C#` is a programming language used widely\
    \ on its own across many applications and industries. \n\n`C#` is one of the most\
    \ popularly used languages when it comes to the development of 3D games, but you\
    \ can use it to help create some dynamic websites as well. `C#` adopted some of\
    \ the features of `C++` and `Java` and then stripped them of all of their problematic\
    \ features, including macro removal, templates, and multiple inheritances. This\
    \ made it more modern, easier to work with, cleaner, and a very highly effective\
    \ language. `C#` is a really flexible language, which is why it is a good option\
    \ as a starting language for `Windows`, games, web applications, and other programs.\
    \ Since it is derived from some of the other `C` languages, you will find that\
    \ if you take the time to become fluent in this language, you will learn other\
    \ languages just as fast.\n\n# Swift\n`Swift` is a programming language loved\
    \ by `Apple` developers. It was developed for use with things like `Linux`, `watchOS`,\
    \ `tvOS`, `iPadOS`, `macOS`, and `iOS`. It is a much faster and cleaner language\
    \ compared to some of the other languages that may have been statically typed\
    \ before it. \n\n`Swift` is a newer language compared to some others because it\
    \ is used with many `Apple` products that customers know and love. It can be taken\
    \ to work with other types of products as well, provided you monitor the functionality\
    \ to make it work for your needs. `Swift` is perfect for those interested in creating\
    \ applications for `iOS`, `macOS`, `watchOS`, and `tvOS`, or using it with any\
    \ `Apple` products. It is also ideal for beginners, not only because `Swift` reads\
    \ closely to English, but also since `XCode` checks the code for building apps\
    \ automatically.\n\n# Kotlin\nThe next option is the `Kotlin` programming language.\
    \ `Kotlin` is an open-sourced programming language based on the `Java Virtual\
    \ Machine`. `Kotlin` gained widespread attention across the developer community\
    \ when `Google` announced in May 2019 that `Kotlin` is the preferred language\
    \ for `Android` developers.\n\n`Kotlin` is not designed to be a direct replacement\
    \ for `C++` and `Java` for `Android` development, but with `Google` giving the\
    \ language a blessing, `Android` developers can go to the cutting edge knowing\
    \ this language will be supported for years to come and has a learning curve that\
    \ is easier to work with. `Java` is an aging language and although it has aged\
    \ well, `Kotlin` is still trying to reduce the amount of coding required to get\
    \ operations done. Existing `Java` developers will find this transition smooth\
    \ and easy since these two work together in many cases.\n\n# Rust\nThe final language\
    \ to look over is `Rust`. This is a more low-level language compared to some of\
    \ the others, but it still has its place on our list. `Rust` is a newer language\
    \ developed by the `Mozilla Foundation`. It is like a reincarnation of the `C++`\
    \ language, but with some interesting improvements compared to other languages.\
    \ \n\nLike other low-level programming languages, `Rust` has a low memory footprint,\
    \ which makes it faster than `Java`. This is what we expect, as having fewer English-like\
    \ statements in the mix makes it easier to translate the desired machine code.\
    \ At the same time, `Rust` addresses major weaknesses found in `C++` and `C`,\
    \ such as safety. Basically, `Rust` comes with many safety measures to ensure\
    \ the program does not run into errors when you run the code. Because of the low\
    \ footprint, it is easier to consider `Rust` for developing web applications and\
    \ embedded devices. The community for `Rust` is currently small, but it is a good\
    \ language to learn and is easy to work with if you have experience with `C` or\
    \ `C++`.\n\n# Getting Started\nOne of the benefits for a beginner in the world\
    \ of programming is that you can choose your programming language based on any\
    \ criteria you like, such as figuring out how much you enjoy working in one language\
    \ compared to others. If you start a project in one language, you can switch to\
    \ another if you find you do not like the work. It is easy to try out a few and\
    \ figure out which one is right for you.\n\n# Chapter 4: Preparing Yourself for\
    \ Coding\nNow that we have looked through the basic terms of coding, it is time\
    \ to prepare ourselves. We will dive into the preparation needed.\n\n## Preparing\
    \ the Vision\nThe first thing need to focus on is how to prepare your vision.\
    \ For many new programmers, this starts with identifying why they want to learn\
    \ in the first place. There are many motivating factors to consider, such as making\
    \ a game, working for a big company like `Apple`, or building a portfolio. You\
    \ should consider the overall goal you want to reach. Preparing your vision is\
    \ often one of the hardest parts, but it will help you stay focused on your goals.\n\
    \n## Getting the Program Structure\nIn an earlier chapter, we talked about the\
    \ importance of working with algorithms and structure. While not an absolute requirement\
    \ in many cases, having a solid structure from the beginning is a good idea. Sometimes\
    \ it depends on your preferences, and sometimes it is important to pick one that\
    \ meets the needs of your project.\n\n## How to Prepare the Hardware\nThe cool\
    \ thing you notice about coding is that you do not necessarily need a fancy computer\
    \ to get started. You can even work with an old `Windows XP` laptop to get coding\
    \ done as long as the right software is ready. Of course, low-end hardware will\
    \ slow down your coding, so you may want to find a middle ground with something\
    \ affordable and a bit newer.\n\nCoding is not necessarily a huge investment.\
    \ Your choice of hardware often depends on where you plan to spend your time coding.\
    \ If you work in a home or office, you may find you need a desktop computer. These\
    \ provide the most \"bang for your buck\" and are easier to work with. Chipsets\
    \ and mobile components are more expensive; many powerful laptops used today are\
    \ thin with sophisticated engineering. They also come with components you cannot\
    \ find on desktops. However, when trying to save time and money, the desktop is\
    \ the best option. They are cheaper, come with more power, and do not heat up\
    \ as much because the performance is better. Performance matters when you are\
    \ compiling a program, working with a `debugger` or an `interpreter`, or running\
    \ a complicated program.\n\nPicking out options does not have to be hard. For\
    \ the `GPU`, you want as many cores as possible; the higher the clock speed, the\
    \ better. If you are picking between `AMD` or `Intel`, go with the lower price\
    \ option as they are similar. If you work with `Windows 10`, `8 GB` of `RAM` is\
    \ best, but higher is even better. More `RAM` means your system is less likely\
    \ to get bogged down when running many applications at once. A good display setting\
    \ on the monitor is also important. The higher the resolution, the better for\
    \ your eyes.\n\n## Preparing the Software\nAlong with the goals of keeping costs\
    \ down, we will look at free or low-cost options available for whatever language\
    \ you choose.\n\n### Flowcharts\nIf you would like to draw a flowchart, `http://www.draw.io`\
    \ is a good option to help you organize your work.\n\n### C++ and HTML\n`C++`\
    \ is a good language for learning the basics if you want to be hands-on. You can\
    \ use a sandbox for this. If you want to work with `HTML`, you can work with `https://codeeditor.com`.\
    \ The user interface is not as elegant as other options, but it provides a live\
    \ preview that makes it easier to play with your code. You will not have to wait\
    \ for things to compile, though you are restricted to `HTML`.\n\n### Source Code\
    \ Editors\nWhether you take the nomadic route with raw coding or want an `IDE`\
    \ with all features, it is a good idea to have one. Some editors are not heavy\
    \ apps, meaning you can use a free version and see the same results. You may also\
    \ consider \"bells and whistles\" like features. For example, if you need support\
    \ for `debugging`, something like `Microsoft Visual Studio` can provide this.\n\
    \n### IDE\nWhen we move past what can be done online with a language like `HTML`,\
    \ many languages require an `IDE` to get all work done. These are the environments\
    \ used to write code in languages like `Python`. There are often free `IDEs` available\
    \ when you download a language. This keeps costs down and often provides many\
    \ features.\n\n### Operating Systems\nIf you are using an older operating system,\
    \ `Linux` might be a good option. If you need a virtual machine, `VMware Player`\
    \ is a great way to get `Linux` running on your system.\n\n### Gamification\n\
    To stay motivated, some use `Habitica`, a tool that uses a gamification approach\
    \ to help you code. It is a great way to make the coding process more fun.\n\n\
    ### Command Line\nIf you encounter problems while coding, you can work with `SpeedCrunch`.\
    \ Unlike some other calculators, it provides a text box with a command line where\
    \ you can type equations.\n\n### Project Management\nIf you are working on a big\
    \ project, you need a method to track the status of the work, especially if multiple\
    \ people are involved. `Trello` is a good tool to help with this.\n\n# Chapter\
    \ 6: Tips and Tricks to Make Your Coding Successful\nIt is time to focus on yourself.\
    \ Whether you are a beginner or a developer, these tips will help you improve\
    \ and reduce frustration.\n\n## Have a Backup System You Can Trust\nThe first\
    \ thing is the backup system. We have reached a point where losing data is not\
    \ an option. Use `cloud computing` which integrates with your operating system\
    \ to ensure your source code is backed up. Most source files are small, and you\
    \ can use apps like `WinRAR` to compress them even further.\n\nWhen working with\
    \ `Windows`, create a folder in the `OneDrive` folder and put all projects and\
    \ code there. If you see a green checkmark, the code is backed up to the cloud.\
    \ If not, launch the `OneDrive` app from the Start menu and sign into your `Microsoft`\
    \ account. Also, copy files to a flash drive or external hard drive in case.\n\
    \nDo not put all your eggs in one basket. Many programmers rely on multiple services.\
    \ `Dropbox` is a good option similar to `OneDrive`. You can run both in the background\
    \ for online storage. Once you are more professional, consider uploading codes\
    \ to `GitHub`. Cloud services also make it convenient to share code with others.\n\
    \n## Sort out the Workspace with Some Virtual Desktops\nAnother thing is how you\
    \ organize your space. Virtual desktops can help your productivity. In `Windows`,\
    \ you can use shortcuts to move between them. On `Mac`, you use `Spaces`. You\
    \ can use gestures on the trackpad or keyboard shortcuts. In `Windows`, use `Ctrl`\
    \ + `Windows Key` + `Left` or `Right` to switch between desktops.\n\n## Print\
    \ Off the Cheat Sheets\nCheat sheets provide immediate reference for syntax and\
    \ important information. \n1. **Online Search**: Search for cheat sheets for your\
    \ language. The higher the resolution, the better. \n2. **DIY**: Design your own\
    \ cheat sheets. This allows you to control content and layout. If you can't print\
    \ large pages, tape multiple sheets together. This is a low-cost alternative to\
    \ a second monitor.\n\n## Mess Around with the Interface of the Code Editor\n\
    `IDEs` and source code editors are customizable to cater to many programmers.\
    \ Even basic editors like `Notepad` in `Windows` allow you to change font size\
    \ and type. You can download \"code-friendly\" fonts from the web and apply them\
    \ to any app to support customization. Choose a font that is easy on your eyes\
    \ to keep you motivated for long projects. Many editors also offer themes. For\
    \ example, a \"dark theme\" can help reduce distractions. You can also hide the\
    \ taskbar to get more screen space.\n\n## Try Out Some Coding\nCoding requires\
    \ concentration. If you are overwhelmed, take a break. Split sessions into fifteen\
    \ fifteen-minute blocks with breaks to grab a drink or walk around to clear your\
    \ head. You can extend these sessions once you are comfortable. Keeping it short\
    \ and sweet is better.\n\nErrors are frustrating. If you write two hours of code\
    \ without running or checking it regularly, it creates a mess. The longer you\
    \ go without checking, the harder it is to fix. If you don't test your code, you'll\
    \ have to search through pages of code later. A better option is coding a little\
    \ bit at a time rather than in long spurts. Testing every few minutes helps find\
    \ where errors started.\n\n## Ask for Help When Needed\nIt is normal to ask for\
    \ help, but do it the right way. Be organized. Before asking, write down the following:\n\
    1. List what you want the program to do.\n2. Explain where the problem is happening\
    \ and why it's not working (where it first started).\n3. List what you have already\
    \ tried.\n\nTroubleshooting ahead is essential. Don't waste the time of those\
