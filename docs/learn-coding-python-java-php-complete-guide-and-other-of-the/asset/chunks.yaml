    如你上面的示例所示，你可以使用 `PHP` 语法通过任何你需要的小型项目来定制网页，然后结合 `HTML` 元素来帮助组织整个网页，使其按照你想要的方式运行。


    你会发现，使用 `PHP` 语言将是你可以使用的最广泛支持的服务器端语言之一，即使有其他语言可以与之竞争，并且在某些工作上表现得更好、更高效。事实上，有许多程序员会认为
    `PHP` 并不安全，甚至用起来也不好用，但你会发现这门语言自初诞生以来已经有了许多改进。而当你想要创建一些比以往任何时候都具有交互性和动态性的网页时，这门语言的较新版本已经变成了强大的工具。


    ![](img/rsrcSC.jpg)


    # JavaScript 语言


    我们列表中下一个需要花时间研究的下一种语言是 `JavaScript` 语言。这种语言非常流行。事实上，根据 2018 年的一项 StackOverflow
    调查，当时约有 62.5% 的受访者在使用 `JavaScript`。


    这是一门最初于 1995 年的语言，旨在解决困扰互联网早期几年的兼容性问题。但从那时起，它已被用于扩展到网站开发甚至某些基于 Web 的应用程序之外领域。现在，我们能够将其应用于今天可用的一些更现代的技术中，例如服务器、机器人技术、手机
    App 等。


    如果你花时间在 Instagram 或 Facebook 上点赞，或者你曾在某个网站上填写过表单，那么在所有这一切背后的代码，以及确保这些任务实际执行的代码，很可能涉及到一些
    `JavaScript` 语言。你会发现，为了让这些运行得更好，熟悉一些如 `PHP`、`CSS` 和 `HTML` 等其他编程语言也是好主意。


    如果你已经花时间学习了我们之前提到的 `CSS` 和 `HTML` 语言，并已将这些技术掌握了你自己在 Web 开发的一些技能，那么你会发现 `JavaScript`
    语言将是你下一个逻辑学习如何使用的语言之一。这是因为 `JavaScript` 语言将负责我们在网站上所看到的行为。一个很好的例子是，`JavaScript`
    能够告诉我们在填写表单时是否发生了某种错误，以及某个字段是否没有被正确处理。


    `JavaScript` 也会被用于网络浏览器之外的其他地方。我们可以很容易看到，它将出现在各种类型的硬件、软件和移动应用中。这就是为什么它真的发生了变化，变得比过去更像一种通用语言的原因。


    # CoffeeScript


    这一个可能不像其他某些选项那么知名，但它仍然是一个我们需要花时间考虑的选项。这门语言处理我们某些工作的方式与列表上的其他一些编程语言略有不同。它不是通过以人类可读的方式编译我们正在使用的代码然后切换到机器可读的代码，这门语言将把代码编译并在
    `JavaScript` 中运行。


    这种语言是为那些想要用 `JavaScript` 编写代码，但不喜欢其中所有规则和语法的程序员准备的。它更容易操作，因为与 `JavaScript` 原有的代码相比，你在这个过程中不需要编写那么多代码。考虑这门语言的一种好方法是，它结合了我们在
    `Python` 和 `Ruby` 中看到的某些优点，同时仍带给我们通过 `JavaScript` 得到的最终结果。


    这使得我们需要进行的运行时调试在整体上变得更具挑战性。但你会发现有很多在线资源可以处理这个问题，而且许多游戏和交互式代码编辑器都能支持这种功能，这可以作为一个小证明，这门语言将为那些学习传统的
    `JavaScript` 语言编程感到头疼的人提供。


