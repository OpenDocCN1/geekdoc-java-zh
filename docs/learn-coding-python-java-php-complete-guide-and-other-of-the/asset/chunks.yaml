    这些符号将受到程序员以及其他从事编码的人的通用认可，因此请确保在 ways 这些图表之一时，你在此过程中也使用了正确的符号。


    ## 程序员、编码员和开发者


    在我们想要从事的某些编码工作中，如果不花时间提到编程和软件开发，我们是不可能取得多远进展的。从对这些事物有基础知识的人的角度来看，开发、编程、编码和计算这些概念似乎都是同一种，并且可以以互换的方式使用。


    然而，需要重要的是，那些花费大量时间编写代码并在更具技术层面上进行这些工作的人实际上会知道，开发者、编码员和程序员是非常不同的概念。思考它们的一种好方法是将它们看作不同的等级。编码员（Coder）是入门，或者说是最基础的级别，然后是程序员（Programmer），最后是开发者（Developer）。


    在整个过程中，编码员的角色将保持相当基础。你会被设定或赋予一个你想要实现的问题或目标，然后你可以利用你所选择的编程语言知识来完成工作。一旦你学会了所选编程语言的一些基础知识并开始产代码，且这些代码确实可以运行，那么你就被认为是一个编码员。


    但也有其他级别。程序员会知道，编码仅仅是软件开发过程中的一个阶段，一个可能永远不会结束的阶段。花费大量时间改进之前讨论过的流程图和算法是一个优秀程序员的重要部分。编码员将专门负责将某些算法翻译成代码，但程序员将花时间确保他们让算法更好，并检查任何可能破坏程序的严重错误。


    最后我们可以以开发者来结束。这为我们看到的某些编码工作增加了另一个层次。开发者更多地看作是程序背后的真正大脑，他们将进行尽可能必要的工作和研究，以制定稳健的流程图和算法。他们将识别目标市场以及他们必须解决的所有潜在问题，并提供一系列解决方案。


    这些开发者还可能管理一个程序员团队来处理一些较大的项目，并确保无论开发者的愿景如何，工作都能符合预期。这些人是对编码和编程最了解了解的人，他们将确保为这些程序编写的代码是高级的且能够正常运行的。


    ## 编程语言


    只有当你使用正确的语言时，编译器才能理解你发送的指令。在提供这里所需的命令和指令之前，你必须预先知道计算机的编程语言。好消息是，你可以通过安装各种程序让你的计算机变得智能，这些程序将帮助机器理解你想要的任何编程语言。我们将在本指南的后续部分花时间学习一些常用语言以及我们能用它们做什么。


    ## 源码编辑器


    ![](img/rsrcS5.jpg)


    这种编辑器是一种特殊的文本编辑器，其设计旨在帮助编码员编写他们想要的某些代码。在如 `Mac OS` 的 `TextEdit` 和 `Windows Notepad`
    这样的基础文本编辑器的帮助下，你可以自由输入、创建甚至编辑源码，无论使用什么语言，然后根据我们正在使用的编程语言提供文件的正确扩展名。


    然而，我们必须知道，某些普通的文本编辑器将缺乏你在源码编辑器中想要发现的功能。例如，你将无法发现代码是否存在错误。`Microsoft Word` 的设置可以帮助我们检查是否存在某些拼写错误或语法错误，类似于源码编辑器能够预见你编写的代码是否会向你提供错误。


    请记住，你的代码越复杂、功能越强大，调试、编辑和改进你拥有的代码就越困难。源码编辑器也将帮助我们这一点，因为它可以自动缩进正确的位置以帮助你查看程序的不同部分，突出显示元素，并将帮助我们看到更多的代码。选择正确的编辑器对于确保你能够让它们尽可能地工作至关重要。


    ## 解释器和编译器


    在需要翻译代码时，解释器和编译器将采取不同的方法。编译器的原理是获取整个源码，进行必要的翻译，然后将程序输出为可执行的程序。这个过程取决于你使用的处理器或
    `CPU` 速度以及程序中的代码行数，可能需要一些时间。取决于你决定使用的编程语言或编译器，即使你发现代码中存在一些关键错误和漏洞，这个过程也可以很好地完成。


    然而，这正是我们发现解释器实用的地方。解释器不需要承担整个源码并构建翻译后的输出，而是编译第一行代码，当每一步翻译完成后，语句就会被执行。然后解释器将移动到下一行并重复此过程，直到操作结束或发现错误。


    由于编译和执行过程是逐行发生的，程序的运行速度会变慢，如果你使用的是的是速度较慢的 `CPU`，那么这种感觉会更加明显。但使用这种工具的优势是，你不需要等待整个程序编译就可以进行测试，并且许多工具还带有帮助你确定主要问题所在位置界面。


    调试器


    我们接下来需要查看的是调试器。这是一个外部程序，旨在检测程序和代码中出现的漏洞和错误。它将具有解释器的一些相同功能，但通常还带有一些额外功能，例如当命令在语法上可能是正确的但会产生错误输出时，暂停你的某些操作。


    上面的例子仍然会被视为一个漏洞，因为这不是理想的输出，所以调试器会在那里停下你，并允许你花足够的时间纠正代码并在问题得到解决后让操作继续。你使用的某些调试器可能包含一个你可以运行的虚拟环境，让你能够充分检查长度和复杂的代码，而无需考虑编译。`IDE`


