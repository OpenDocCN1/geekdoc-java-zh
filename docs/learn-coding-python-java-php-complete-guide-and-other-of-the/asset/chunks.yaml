    ## Java

    Even though the names sound alike, you will find that `Java` is not going to be
    related to `JavaScript`. Many of the principles of `Java` were actually built
    around and then improved upon from the `C++` language we talked about before,
    but you will find that most programmers find the `Java` language to be more user-friendly
