  trans: "\n\n以下是 Gherkin 中的关键字列表。\n\n1. `Given` - 用于指定场景的预置条件\n2. `When` - 用于指定动作\n\
    3. `And` - 用于指定额外的前置条件和动作\n4. `Then` - 用于指定动作的结果\n5. `Feature` - 用于指定特性的描述\n6.\
    \ `Scenario` - 用于指定场景的描述\n7. `Outline` 和 `Examples`\n8. `Background` - 用于指定在执行\
    \ feature 文件中的每个场景之前要采取的动作\n9. `\"\"\"` - 用于以多行格式传递数据\n10. `|` - 用于以表格格式传递数据\n\
    11. `@` - 用于为场景和功能标记标签（tag）\n12. `#` - 用于对 feature 文件中的进行注释\n\n下面的 feature 文件将让你理解\
    \ Gherkin 语言的大部分语法。\n\n## 基础示例 feature 文件\n\n现在让我们来看看 gherkin 中可以拥的最简单的 feature\
    \ 文件。\n\n```gherkin\nFeature: ATM 卡认证\n\n   当 ATM 卡插入 ATM 机后，用户应被要求输入 PIN 码。\n\
    \n   如果输入的 PIN 码错误，用户应收到警告消息。\n   如果输入的 PIN 码正确，用户应成功通过认证。\n\n Scenario: 在 ATM\
    \ 机上输入错误的 PIN 码\n\n  Given 我将 ATM 卡插入 ATM 机\n  And 我被要求输入 PIN 码\n  When 我输入正确的\
    \ PIN 码\n  Then 我应该看到取款选项\n```\n\n## 带有 Outline 和 Examples 关键字的示例 feature 文件\n\
    \nScenario outline 用于我们需要重复一组动作但使用不同数据组合的情况。例如，在下面的 scenario outline 中，我们需要用不同的用户\
    \ ID 和密码组合来测试登录功能。在这种情况下，我们使用 `<VariableData>` 语法来指定变化的数据，并通过 `examples` 关键字提供数据。因此，在下面的场景中，所有步骤将执行\
    \ 4 次 - 每个用户执行一次。\n\n```gherkin\nScenario Outline: 密码规则\n\n  Given 我们正处于登录页面\n\
    \  When 我们输入用户 id <ID> 和密码 <PASSWORD>\n  Then 登录结果应为 <OUTCOME>\n\n Examples:\n\
    \n    | ID    | PASSWORD | OUTCOME |\n    |  Sagar|  128$9#  |     Fail|\n   \
    \ |  Amol |  98sjdg  |     PASS|\n    |  Shaun |  jslush9  |     PASS|\n    |\
    \    Ben |  KON()%  |     FAIL|\n```\n\n## 带有 Background 的示例 feature 文件\n\nBackground\
    \ 关键字用于在执行每个场景之前执行特定数量的步骤。例如，假设你想在执行每个场景之前清除浏览器 cookie，那么我们可以使用 background 关键字配合清除\
    \ cookie 的步骤。\n\n### 向步骤传递输入数据\n\n每个场景可以有多个步骤，每个步骤都是用户的操作。一个步骤就像系统中的特定操作。一个步骤可能需要对输入数据进行处理。我们可以通过三种方式向步骤传递输入数据。\n\
    \n1. 内联变量 (In-line Variables)\n2. 多行字符串\n3. 表格\n\n### 使用标签对场景和功能分组\n\n我们在 Gherkin\
    \ 中使用标签将相似的场景和功能分组在一起。`@` 符号用于标记场景和功能。\n\n## 4. 为 Java 项目添加 Cucumber 依赖\n\n要使用\
    \ cucumber 编写测试，我们需要添加 2 类型的依赖。\n\n1. `cucumber-java`\n2. `junit`\n\n如果你使用 Maven\
    \ 构建管理系统，可以在 POM.XML 中使用下面的 XML 块。\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-java</artifactId>\n  <version>1.2.4</version>\n</dependency>\n\
    <dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n \
    \ <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n```\n\n## 5.\
    \ Cucumber 测试\n\n### 5.1 编写第一个 cucumber 测试\n\n按照下面的步骤在 IntelliJ IDEA 中编写第一个 cucumber\
    \ 测试。\n\n1. 创建一个 maven 项目。\n2. 在 Test Resources 目录下添加包含场景的 feature 文件。\n3. 添加\
    \ Cucumber 的 maven 依赖。\n4. 编写步骤定义（step definitions）并从 feature 文件执行测试。\n\n这是我们创建并放入\
    \ test resources 文件夹的 feature 文件。\n\n```gherkin\n@selenium\nFeature: 我的特性\n\n\
    \  Scenario: 验证标题\n    Given 我在 www.softpost.org 首页\n    Then 我验证标题包含 tutorials\n\
    ```\n\n注意，我们没有为上述 feature 文件中的步骤添加步骤定义。当你执行 feature 文件时，你会看到下面的错误。你可以使用下面的代码片段实现缺失的步骤：\n\
    \n```java\n@Given(\"^I am on the www\\\\.softpost\\\\.org home page$\")\npublic\
    \ void i_am_on_the_www_softpost_org_home_page() throws Throwable {\n    // 在此处编写代码将上面的短语转换为具体的动作\n\
    \    throw new PendingException();\n}\n\n@Then(\"^I verify that title contains\
    \ tutorials$\")\npublic void i_verify_that_title_contains_tutorials() throws Throwable\
    \ {\n}\n```\n\n缺失步骤的错误：\n`Given I am on the www.softpost.org home page`\n`Then\
    \ I verify that title contains tutorials`\n\n或者，如果你在 IntelliJ IDEA 中有 cucumber\
    \ 插件，可以通过按 feature 文件中步骤上的 alt 键来创建步骤定义。以下是带有步骤定义的类：\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\n\
    import cucumber.api.java.en.Then;\nimport junit.framework.Assert;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.firefox.FirefoxDriver;\n\n@SuppressWarnings(\"ALL\"\
    )\npublic class seleniumsteps {\n\n    WebDriver driver;\n\n    @Before\n    public\
    \ void launchBrowser() {\n        driver = new FirefoxDriver();\n    }\n\n   \
    \ @Given(\"^I am on the www\\\\.softpost\\\\.org home page$\")\n    public void\
    \ i_am_on_the_www_softpost_org_home_page() throws Throwable {\n        driver.get(\"\
    http://www.softpost.org\");\n    }\n\n    @Then(\"^I verify that title contains\
    \ tutorials$\")\n    public void i_verify_that_title_contains_tutorials() throws\
    \ Throwable {\n        Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
    tutorials\"));\n    }\n\n    @After\n    public void killBrowser() {\n       \
    \ driver.close();\n        driver.quit();\n    }\n}\n```\n\n编写步骤定义后，你可以像下面的图片一样为\
    \ feature 文件创建运行配置（run configuration）。注意 Glue 属性非常重要。你应该在 Glue 中指定包含步骤定义的包名。\n\
    \n然后，你可以右键点击 feature 文件并运行测试。\n\n如果一切正常，测试将成功运行。\n\n"
- fmt: "\n`cucumber.api.junit.Cucumber` - This class is present in the `cucumber-junit`\
    \ artifact library.\n\n```xml\n<dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n\
    \  <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n\n<dependency>\n\
    \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-junit</artifactId>\n\
    \  <version>1.2.4</version>\n</dependency>\n```\n\nThen you can add below test\
    \ class. After running the below test, cucumber generates the report at `target/selenium-reports`.\
    \ `Cucumber.class` contains main method that reads the feature file and executes\
    \ scenario in it.\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    plugin = \"html:target/selenium-reports\"\n)\npublic class MyTests\n{\n\
    }\n```\n\n# 7. Cucumber options\n\nWhen executing the cucumber scenarios, we can\
    \ pass various options as mentioned below.\n\n1. `features` - path of the features\
    \ files\n2. `glue` - path of the step definition classes\n3. `dry run` - used\
    \ to check that all step definitions are desinged\n4. `monochrome` - true/false\
    \ It controls the readability of the output\n5. `strict` - false means that undefined\
    \ steps are skipped. Test does not fail\n6. `name` - used to filter the features\
    \ and scenarios\n7. `plugin` - json, html, junit, pretty\n8. `snippets` - Snippet\
    \ style can be Camel case or Underscore\n\nHere is the sample test class showing\
    \ all these options.\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\nimport\
    \ org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n \
    \   features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = \"~@blocked\",\n    plugin = \"html:target/selenium-reports\",\n\
    \    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
    \ = SnippetType.CAMELCASE\n)\npublic class MyTests\n{\n}\n```\n\n# 8. Filtering\
    \ scenarios\n\n## 8.1 Tagging the scenarios\n\nWe can tag scenarios using `@`\
    \ symbol in Feature files as shown in below example. Note that we can also tag\
    \ all the scenarios in a feature file by writing the tag at the beginning of the\
    \ feature file. We can also associate multiple tags with the same scenario as\
    \ well. In below example, we have tagged the scenario with 4 tags - selenium,\
    \ regression, sanity and critical.\n\n```gherkin\n@selenium\nFeature: My feature\n\
    \n  @regression @sanity @critical\n  Scenario: Verify title\n    Given I am on\
    \ the www.softpost.org home page\n    Then I verify that title contains tutorials\n\
    ```\n\nTo execute the scenarios with 2 tags say `regression` and `critical`, we\
    \ can use below syntax.\n\n`tags = [\"@regression\",\"@critical\"]`\n\nTo execute\
    \ the scenarios with 2 tags say `regression` or `critical`, we can use below syntax:\n\
    \n`tags = [\"@regression,@critical\"]`\n\nTo skip the scenarios tagged with tag\
    \ say `sanity`, we can use below syntax:\n\n`Negative tags = [\"~@sanity\"]`\n\
    \nWe can also tie the `@Before` and `@After` methods with scenarios tagged with\
    \ specific names. For example, below before method will be executed only before\
    \ the scenarios tagged with selenium\n\n`@Before(\"@selenium\")`\n\nHere is the\
    \ example showing the usage of tags in Cucumber. Consider below feature file.\n\
    \n```gherkin\n@selenium\nFeature: My feature\n\n    @regression @sanity @critical\n\
    \    Scenario: Verify softpost title\n    Given I am on the www.softpost.org home\
    \ page\n    Then I verify that title contains tutorials\n\n    @sanity\n    Scenario:\
    \ Verify yahoo title\n        Given I am on the www.yahoo.com home page\n    \
    \    Then I verify that title contains tutorials\n```\n\nNow take a look at below\
    \ Test Class. After executing below test class, only first scenario will be executed\
    \ because that scenario is tagged with `@sanity` and `@regression`.\n\n```java\n\
    package org.softpost;\n\nimport cucumber.api.CucumberOptions;\nimport cucumber.api.SnippetType;\n\
    import cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = {\"@sanity\",\"@regression\"},\n    plugin = \"html:target/selenium-reports\"\
    ,\n    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
    \ = SnippetType.CAMELCASE\n)\npublic class MyTest\n{\n}\n```\n\nNow take a look\
    \ at below test class. After executing below test, both scenarios will be executed\
    \ as both are tagged with `@sanity`.\n\n```java\npackage org.softpost;\n\nimport\
    \ cucumber.api.CucumberOptions;\nimport cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\n\
    import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
    \    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = {\"@sanity,@regression\"},\n    plugin = \"html:target/selenium-reports\"\
    ,\n    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
    \ = SnippetType.CAMELCASE\n)\npublic class MyTest\n{\n}\n```\n\nNow take a look\
    \ at below test class. After executing below test class, none of the scenarios\
    \ will be executed as tag is prefixed with `~`.\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.api.CucumberOptions;\nimport cucumber.api.junit.Cucumber;\n\
    import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
    \    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = {\"~@sanity\"},\n    plugin = \"html:target/selenium-reports\"\n\
    )\npublic class MyTest\n{\n}\n```\n\n## 8.2 Using name option\n\nWe can execute\
    \ the specific scenarios with their names matching pattern. For example - Consider\
    \ below feature file.\n\n```gherkin\n@selenium\nFeature: My feature\n\n    @regression\
    \ @sanity @critical\n    Scenario: Verify softpost title\n    Given I am on the\
    \ www.softpost.org home page\n    Then I verify that title contains tutorials\n\
    \n    @sanity\n    Scenario: Verify yahoo title\n        Given I am on the www.yahoo.com\
    \ home page\n        Then I verify that title contains tutorials\n```\n\nTo execute\
    \ only those scenarios with name \"softpost\", we can use below test class. Note\
    \ that we can also use regular expression as well to specify the value of scenario\
    \ name.\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    name = {\"softpost\"},\n    plugin = \"html:target/selenium-reports\"\n\
    )\npublic class MyTest\n{\n}\n```\n\n# 9. Passing parameters to steps\n\nWe can\
    \ pass the parameters to the step methods from feature file as shown in below\
    \ scenario. In below scenario, we have passed the name of website in `Given` step.\
    \ The main advantage of passing the parameters is that we can re-use same step\
    \ method in different scenarios with different parameters.\n\n```gherkin\n@selenium\n\
    Feature: Simple feature\n  Scenario: Test web title\n    Given I am on \"www.yahoo.com\"\
    \ page\n    Then I verify that the title is \"yahoo\"\n  Scenario: Test web title\n\
    \    Given I am on \"www.softpost.org\" page\n    Then I verify that the title\
    \ is \"tutorials\"\n```\n\nHere are the step definitions for above steps. Note\
    \ that both scenarios re-use same step definitions with different parameters.\n\
    \n```java\npackage org.softpost;\nimport com.google.common.primitives.Bytes;\n\
    import cucumber.api.Scenario;\nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\n\
    import cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\nimport\
    \ junit.framework.Assert;\nimport org.openqa.selenium.OutputType;\nimport org.openqa.selenium.TakesScreenshot;\n\
    import org.openqa.selenium.WebDriver;\n```\n"
