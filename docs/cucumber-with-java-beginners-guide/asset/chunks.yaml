    \nSometimes, we need to execute certain steps, before every scenario in the same\
    \ feature file. `Background` allow you to reuse same steps across multiple scenarios.\n\
    \nFor - to test some feature, we might need to filter records before every scenario.\
    \ So we can put the steps required to filter the records inside `Background`.\
    \ These steps would be executed every time scenario in the same feature file is\
    \ executed.\n\nIn below feature file, we have one step in the background (`Given\
    \ I filter some records`). This step will be executed before every scenario in\
    \ this feature file.\n\n```gherkin\nFeature: Simple background feature\n\n  Background:\
    \ Execute before every scenario\n    Given I filter some records\n\n  Scenario:\
    \ Verify delete functionality\n    Given I click on the delete button of the first\
    \ record\n    Then I verify that record is removed from the table\n\n  Scenario:\
    \ Verify Update functionality\n    Given I click on update button of the first\
    \ record\n    Then I verify that record opens in new window and we can modify\
    \ it\n```\n\nHere is the step definition class.\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\n/**\n\
    \ * Created by Sagar on 13-07-2016.\n */\npublic class backgroundsteps\n{\n  \
    \  @Given(\"^I filter some records$\")\n    public void i_filter_some_records()\
    \ throws Throwable\n    {\n        System.out.println(\"\\n\\nBackground - Filtering\
    \ some records\\n\");\n    }\n\n    @Given(\"^I click on the delete button of\
    \ the first record$\")\n    public void i_click_on_the_delete_button_of_the_first_record()\
    \ throws Throwable\n    {\n        System.out.println(\"Click delete button\\\
    n\");\n    }\n\n    @Then(\"^I verify that record is removed from the table$\"\
    )\n    public void i_verify_that_record_is_removed_from_the_table() throws Throwable\n\
    \    {\n        System.out.println(\"Verify deleted record\\n\");\n    }\n\n \
    \   @Given(\"^I click on update button of the first record$\")\n    public void\
    \ i_click_on_update_button_of_the_first_record() throws Throwable\n    {\n   \
    \     System.out.println(\"Click update button\\n\");\n    }\n\n    @Then(\"^I\
    \ verify that record opens in new window and we can modify it$\")\n    public\
    \ void i_verify_that_record_opens_in_new_window_and_we_can_modify_it() throws\
    \ Throwable\n    {\n        System.out.println(\"Verify modified record\\n\");\n\
    \    }\n}\n```\n\nHere is the output of execution of above feature file.\n\n```\n\
