  trans: "\n\n![](img/00011.jpeg)\n\n# 关于作者\n\nPaul Watson 先生在 `BDD` 和 `Cucumber`\
    \ 方面拥有多年经验。他曾在美国、英国、新加坡、香港、迪拜、澳大利亚和瑞士参与过大型软件项目。\n\n他的爱好包括去新的旅游胜地、看篮球、板球、足球以及学习最新的技术知识。\n\
    \n# 这本书适合谁\n\n本书适用于软件开发人员、自动化测试人员、`Devops` 人以及从事 IT 项目的工程师。无论你是初学者还是丰富的开发者，这本书都将帮助你掌握\
    \ `Cucumber` 的技能。\n\n本书从介绍 `Cucumber` 开始，然后深入探讨核心概念，如在 `IntelliJ IDEA` 中创建项目、使用标签、插件、与\
    \ `Junit` 集成、执行 `selenium` 测试、使用 `picocontainer` 和 lambda 表达式。\n\n# 前言\n\n本书是为初接触\
    \ `Cucumber` 的读者准备的。它将帮助你理解什么是 `Cucumber` 以及如何在软件项目中使用它。\n\n在书中，你将学习到以下主题：\n\n\
    1. [Cucumber 简介](http://www.softpost.org/cucumber/introduction-to-cucumber/)\n\
    2. [Cucumber 安装](http://www.softpost.org/cucumber/installation-of-cucumber/)\n\
    3. [使用 Gherkin 编写 feature 文件](http://www.softpost.org/development-models/bdd-software-development-with-gherkin/)\n\
    4. [在 Java 项目中添加 Cucumber 依赖](http://www.softpost.org/cucumber/adding-cucumber-dependency-to-java-project/)\n\
    5. Cucumber 测试\n6. [使用 Cucumber 类执行 Cucumber 测试](http://www.softpost.org/cucumber/executing-cucumber-tests-using-cucumber-class/)\n\
    7. [Cucumber 选项](http://www.softpost.org/cucumber/cucumber-options/)\n8. 过滤场景\
    \ (Scenario)\n9. [向步骤传递参数](http://www.softpost.org/cucumber/passing-parameters-to-cucumber-steps/)\n\
    10. 向步骤传递数据表\n11. feature 文件变体\n12. [在 Cucumber 中运行多个 feature 文件](http://www.softpost.org/cucumber/how-to-run-multiple-feature-files-in-cucumber/)\n\
    13. [使用 PicoContainer 共享 selenium Webdriver 实例](http://www.softpost.org/cucumber/sharing-selenium-webdriver-instance-using-picocontainer/)\n\
    14. Cucumber 中的报告\n15. 使用 Lambda 表达式使用 Cucumber\n\n## 1. 简介\n\n`Cucumber` 是 `BDD`（行为驱动开发）测试框架。\n\
    \n关于 `Cucumber` 需要注意的关键有：\n1. 开源 `BDD` 测试框架。\n2. 跨平台框架。\n3. 测试使用英语、法语、德语等多种语言通过\
    \ `Gherkin Syntax` 编写。\n4. 我们可以使用多种编程语言编写测试，如 `Ruby`、`JRuby`、`PHP`、`Java`、`Jython`、`Groovy`、`Javascript`、`Clojure`、`Gosu`、`Lua`、`.Net`、`C++`。\n\
    5. 与 `Jenkins` 和 `TeamCity` 等 CI 服务器良好集成。\n6. 可以生成 `HTML`、`JSON`、`JUnit` 风格的报告。\n\
    7. `Capybara` - 测试框架是 `Cucumber` 的一部分。\n8. 与 `Selenium`、`Appium`、`Spring`、`Watir`、`Ruby\
    \ on Rails` 等框架良好集成。\n\n## 2. 安装 Cucumber\n\n设置 `Cucumber` 非常简单。你需要安装以下工具：\n1.\
    \ Java `JDK`\n2. Java IDE - `IntelliJ IDEA` 或 `Eclipse`\n3. `Cucumber` 库\n4. 构建工具如\
    \ `Maven` 或 `gradle`\n5. `IntelliJ IDEA` 插件 - 适用于 `Java` 的 `Gherkin` 和 `cucumber`\n\
    \n创建一个简单的 `Maven` 或 `gradle` 项目并添加以下依赖：\n\n```xml\n<dependency>\n <groupId>info.cukes</groupId>\n\
    \ <artifactId>cucumber-java</artifactId>\n <version>1.2.4</version>\n <scope>test</scope>\n\
    </dependency>\n```\n\n要在 `Java 8`get `lambda expression` 编写测试步骤，你需要添加以下依赖：\n\n\
    ```xml\n<dependency>\n <groupId>info.cukes</groupId>\n <artifactId>cucumber-java8</artifactId>\n\
    \ <version>1.2.4</version>\n <scope>test</scope>\n</dependency>\n```\n\n你还需要以下\
    \ `JUnit` 依赖来将 `Cucumber` 与 `JUnit` 集成：\n\n```xml\n<dependency>\n <groupId>junit</groupId>\n\
    \ <artifactId>junit</artifactId>\n <version>4.12</version>\n <scope>test</scope>\n\
    </dependency>\n<dependency>\n <groupId>info.cukes</groupId>\n <artifactId>cucumber-junit</artifactId>\n\
    \ <version>1.2.4</version>\n <scope>test</scope>\n</dependency>\n```\n\n## 3.\
    \ 使用 Gherkin 编写 feature 文件\n\n`BDD` 是与敏捷方法一起使用的新兴软件开发模型。关于 `BDD` 需要知道的关键点有：\n\
    1. Dan North 创建了第一个 `BDD` 框架 - `Jbehave`。\n2. 其他 `BDD` 框架有 `Rbehave`、`Rspec`、`Cucumber`、`Behat`。\n\
    3. 测试以故事（stories）或特性（features）的形式用纯文本编写。\n4. 使用领域特定语言 (`Gherkin`) 来编写测试。\n\n###\
    \ 什么是 Gherkin?\n\n`Gherkin` 是在 `BDD` 框架（如 `cucumber`）中编写 feature 文件（称为故事文件）的纯文本语言。`Gherkin`\
    \ 支持世界上大多数语言，如英语、德语、法语等。这意味着任何项目利益相关者都可以编写、阅读和理解用 `Gherkin` 编写的测试。这就是 `Gherkin`\
    \ 语言的核心。\n\n### feature 文件的要点\n\n1. 每个 `feature file` 可以包含一个或多个场景（scenarios），以及可选的\
    \ `outline` 和 `background`。\n2. 每个场景都有 `given`、`when`、`and`、`then`、`but` 等步骤。\n\
    \n### Gherkin 中的关键字有哪些？\n\n`Gherkin` 保留了一些关键字，这些关键字在 feature 文件的范围内具有特定的含义。\n\n"
- fmt: "\nBelow is the list of keywords in Gherkin.\n\n1. `Given` - used to specify\
    \ the precondition of the scenario\n2. `When` - used to specify the action\n3.\
    \ `And` - used to specify additional preconditions and actions\n4. `Then` - used\
    \ to specify the result of the action\n5. `Feature` - Used to specify the description\
    \ of the feature\n6. `Scenario` - Used to specify the description of the scenario\n\
    7. `Outline` and `Examples`\n8. `Background` - Used to specify the action to be\
    \ taken before each scenario in the feature file is executed.\n9. `\"\"\"` - used\
    \ to pass data in multi-line format\n10. `|` - used to pass data in table format\n\
    11. `@` - used to tag scenarios and features\n12. `#` - used to comment the line\
    \ in feature file\n\nBelow feature file will make you understand most of the syntax\
    \ of Gherkin language.\n\n## Basic Sample feature file\n\nNow let us take a look\
    \ at simplest feature file that we can have in gherkin.\n\n```gherkin\nFeature:\
    \ ATM Card authentication\n\n   User should be asked for the PIN once ATM card\
    \ is inserted into the ATM machine.\n\n   User should be given warning message\
    \ if PIN number entered is wrong.\nUser should be authenticated successfully if\
    \ PIN number entered is correct.\n\n Scenario: Enter wrong PIN at ATM\n\n  Given\
    \ I insert the ATM card in ATM machine\n  And I am asked to enter the PIN\n  When\
    \ I enter the correct PIN\n  Then I should be able to see option to withdraw money\n\
    ```\n\n## Sample feature file with Outline and Examples keyword\n\nScenario outline\
    \ are used in cases where we need to repeat same set of actions but with different\
    \ combination of data. For instance, In below scenario outline, we need to test\
    \ the login functionality with different combinations of user id and password.\
    \ In such cases, we use `<VariableData>` syntax to specify the varying data and\
    \ it is supplied through examples keyword. So in below scenario, all steps will\
    \ be executed 4 times - one for each user.\n\n```gherkin\nScenario Outline: Password\
    \ rules\n\n  Given that we are on login page\n  When we enter user id <ID> and\
    \ password <PASSWORD>\n  Then the login should be <OUTCOME>\n\n Examples:\n\n\
    \    | ID    | PASSWORD | OUTCOME |\n    |  Sagar|  128$9#  |     Fail|\n    |\
    \  Amol |  98sjdg  |     PASS|\n    |  Shaun |  jslush9  |     PASS|\n    |  \
    \  Ben |  KON()%  |     FAIL|\n```\n\n## Sample feature file with Background\n\
    \nBackground keyword is used when we want to execute certain number of steps before\
    \ each scenario. For example, suppose you want to clear browser cookies before\
    \ execution of each scenario, then we can use background keyword with step to\
    \ clear cookies.\n\n### Passing input data to the step\n\nEach scenario can have\
    \ multiple steps and each step is the user action. A step is like specific operation\
    \ in the system. A steps may need the input data to be processed. We can pass\
    \ the input to the step using 3 ways.\n\n1. In-line Variables\n2. Multi-line string\n\
    3. Tables\n\n### Grouping the scenarios and features with tags\n\nWe use tags\
    \ to group similar scenarios and features together in Gherkin. `@` symbol is used\
    \ for tagging the scenarios and features.\n\n## 4. Adding Cucumber dependency\
    \ to Java project\n\nTo write the tests using cucumber, we need to add 2 types\
    \ of dependencies.\n\n1. `cucumber-java`\n2. `junit`\n\nIf you are using Maven\
    \ build management system, you can use below XML block in POM.XML.\n\n```xml\n\
    <dependency>\n  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-java</artifactId>\n\
    \  <version>1.2.4</version>\n</dependency>\n<dependency>\n  <groupId>junit</groupId>\n\
    \  <artifactId>junit</artifactId>\n  <version>4.12</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n\n## 5. Cucumber Test\n\n### 5.1 Writing first cucumber test\n\
    \nJust follow below steps to write first cucumber test in IntelliJ IDEA.\n\n1.\
    \ Create a maven project.\n2. Add feature file containing scenarios in Test Resources\
    \ directory.\n3. Add the maven dependency for Cucumber.\n4. Write step definitions\
    \ and execute the tests from feature file.\n\nHere is the feature file that we\
    \ created and put in the test resources folder.\n\n```gherkin\n@selenium\nFeature:\
    \ My feature\n\n  Scenario: Verify title\n    Given I am on the www.softpost.org\
    \ home page\n    Then I verify that title contains tutorials\n```\n\nNote that\
    \ we have not added the step definitions for above steps in feature file. When\
    \ you execute the feature file, you will see below errors. You can implement missing\
    \ steps with the snippets below:\n\n```java\n@Given(\"^I am on the www\\\\.softpost\\\
    \\.org home page$\")\npublic void i_am_on_the_www_softpost_org_home_page() throws\
    \ Throwable {\n    // Write code here that turns the phrase above into concrete\
    \ actions\n    throw new PendingException();\n}\n\n@Then(\"^I verify that title\
    \ contains tutorials$\")\npublic void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n}\n```\n\nMissing steps errors:\n`Given I am on the www.softpost.org\
    \ home page`\n`Then I verify that title contains tutorials`\n\nAlternatively,\
    \ if you have cucumber plugin in IntelliJ IDEA, you can create the step definitions\
    \ by pressing alt on the steps in feature file. Here is the class with step definitions:\n\
    \n```java\npackage org.softpost;\n\nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\n\
    import cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\nimport\
    \ junit.framework.Assert;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.firefox.FirefoxDriver;\n\
    \n@SuppressWarnings(\"ALL\")\npublic class seleniumsteps {\n\n    WebDriver driver;\n\
    \n    @Before\n    public void launchBrowser() {\n        driver = new FirefoxDriver();\n\
    \    }\n\n    @Given(\"^I am on the www\\\\.softpost\\\\.org home page$\")\n \
    \   public void i_am_on_the_www_softpost_org_home_page() throws Throwable {\n\
    \        driver.get(\"http://www.softpost.org\");\n    }\n\n    @Then(\"^I verify\
    \ that title contains tutorials$\")\n    public void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n        Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
    tutorials\"));\n    }\n\n    @After\n    public void killBrowser() {\n       \
    \ driver.close();\n        driver.quit();\n    }\n}\n```\n\nAfter writing the\
    \ step definitions, you can create the run configuration for feature file as shown\
    \ in below image. Note that Glue property is very important. You should specify\
    \ the package name that contains step definitions in the Glue.\n\nThen you can\
    \ right click on feature file and run the test. \n\nIf everything is ok, tests\
    \ will run successfully.\n\nCucumber Reports in IntelliJ IDEA\n\nYou can view\
    \ report of execution as shown in below images.\n"
  raw: "Below is the list of keywords in Gherkin.\n\n1.  Given - used to specify the\
    \ precondition of the scenario\n\n2.  When - used to specify the action\n\n3.\
    \  And - used to specify additional preconditions and actions\n\n4.  Then - used\
    \ to specify the result of the action\n\n5.  Feature - Used to specify the description\
    \ of the feature\n\n6.  Scenario - Used to specify the description of the scenario\n\
    \n7.  Outline and Examples\n\n8.  Background  - Used to specify the action to\
    \ be taken before each scenario in the feature file is executed.\n\n9.  \"\"\"\
    \ - used to pass data in multi-line format\n\n10.  | - used to pass data in table\
    \ format\n\n11.  @ - used to tag scenarios and features\n\n12.  #  - used to comment\
    \ the line in feature file\n\nBelow feature file will make you understand most\
    \ of the syntax of Gherkin language.\n\nBasic Sample feature file\n\nNow let us\
    \ take a look at simplest feature file that we can have in gherkin.\n\nFeature:\
    \ ATM Card authentication\n\n   User should be asked for the PIN once ATM card\
    \ is inserted into the ATM machine.\n\n    User should be given warning message\
    \ if PIN number entered is wrong.\n\nUser should be authenticated successfully\
    \ if PIN number entered is correct.\n\n Scenario: Enter wrong PIN at ATM\n\n Given\
    \ I insert the ATM card in ATM machine\n\n And I am asked to enter the PIN\n\n\
    \ When I enter the correct PIN\n\n Then I should be able to see option to withdraw\
    \ money\n\nSample feature file with Outline and Examples keyword\n\nScenario outline\
    \ are used in cases where we need to repeat same set of actions but with different\
    \ combination of data. For instance, In below scenario outline, we need to test\
    \ the login functionality with different combinations of user id and password.\
    \ In such cases, we use <VariableData> syntax to specify the varying data and\
    \ it is supplied through examples keyword. So in below scenario, all steps will\
    \ be executed 4 times - one for each user.\n\nScenario Outline: Password rules\n\
    \n Given that we are on login page\n\n When we enter user id <ID> and password\
    \ <PASSWORD>\n\n Then the login should be <OUTCOME>\n\n Examples:\n\n    | ID    \
    \ | PASSWORD | OUTCOME |\n\n    |   Sagar|  128$9#  |     Fail|\n\n    |   Amol\
    \ |  98sjdg  |     PASS|\n\n    |  Shaun |  jslsh9  |     PASS|\n\n    |    Ben\
    \ |  KON()%  |     FAIL|\n\nSample feature file with Background\n\nBackground\
    \ keyword is used when we want to execute certain number of steps before each\
    \ scenario. For example, suppose you want to clear browser cookies before execution\
    \ of each scenario, then we can use background keyword with step to clear cookies.\n\
    \nPassing input data to the step\n\nEach scenario can have multiple steps and\
    \ each step is the user action. A step is like specific operation in the system.\
    \ A steps may need the input data to be processed. We can pass the input to the\
    \ step using 3 ways.\n\n1.  In-line Variables\n\n2.  Multi-line string\n\n3. \
    \ Tables\n\nGrouping the scenarios and features with tags\n\nWe use tags to group\
    \ similar scenarios and features together in Gherkin. @ symbol is used for tagging\
    \ the scenarios and features.\n\n# 4\\. [Adding Cucumber dependency to Java project](http://www.softpost.org/cucumber/adding-cucumber-dependency-to-java-project/)\n\
    \nTo write the tests using cucumber, we need to add 2 types of dependencies.\n\
    \n1.  cucumber-java\n\n2.  junit\n\nIf you are using Maven build management system,\
    \ you can use below XML block in POM.XML\n\n<dependency>\n\n<groupId>info.cukes</groupId>\n\
    \n<artifactId>cucumber-java</artifactId>\n\n<version>1.2.4</version>\n\n</dependency>\n\
    \n<dependency>\n\n <groupId>junit</groupId>\n\n <artifactId>junit</artifactId>\n\
    \n <version>4.12</version>\n\n <scope>test</scope>\n\n</dependency>\n\n# 5\\.\
    \ Cucumber Test\n\n## 5.1 [Writing first cucumber test](http://www.softpost.org/cucumber/writing-first-cucumber-test/)\n\
    \nJust follow below steps to write first cucumber test in IntelliJ IDEA.\n\n1.\
    \  Create a maven project.\n\n2.  Add feature file containing scenarios in Test\
    \ Resources directory.\n\n3.  Add the maven dependency for Cucumber.\n\n4.  Write\
    \ step definitions and execute the tests from feature file.\n\nHere is the feature\
    \ file that we created and put in the test resources folder.\n\n@selenium\n\n\
    Feature: My feature\n\n  Scenario: Verify title\n\n    Given I am on the www.softpost.org\
    \ home page\n\n    Then I verify that title contains tutorials\n\nNote that we\
    \ have not added the step definitions for above steps in feature file. When you\
    \ execute the feature file, you will see below errors.\n\nYou can implement missing\
    \ steps with the snippets below:\n\n@Given(\"^I am on the www\\\\.softpost\\\\\
    .org home page$\")\n\npublic void i_am_on_the_www_softpost_org_home_page() throws\
    \ Throwable {\n\n// Write code here that turns the phrase above into concrete\
    \ actions\n\nthrow new PendingException();\n\n}\n\n@Then(\"^I verify that title\
    \ contains tutorials$\")\n\npublic void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n\n// Write code here that turns the phrase above into concrete\
    \ actions\n\nthrow new PendingException();\n\n}\n\nUndefined step: Given I am\
    \ on the www.softpost.org home page\n\nUndefined step: Then I verify that title\
    \ contains tutorials\n\nWriting the step definitions \n\nYou can copy above method\
    \ snippets and write your own code inside it. Alternatively, if you have cucumber\
    \ for Java and Gherkin plugin installed in IntelliJ IDEA, then you can create\
    \ the step definitions by pressing alt + enter on the steps in Feature file as\
    \ shown in below image.\n\n[![Creating cucumber step definitions in IntelliJ IDEA](images/00002.jpeg)](http://www.softpost.org/wp-content/uploads/2016/07/Creating-cucumber-step-definitions-in-IntelliJ-IDEA.png)\n\
    \nCreating cucumber step definitions in IntelliJ IDEA\n\nHere is the class with\
    \ step definitions.\n\npackage org.softpost;\n\nimport cucumber.api.java.After;\n\
    \nimport cucumber.api.java.Before;\n\nimport cucumber.api.java.en.Given;\n\nimport\
    \ cucumber.api.java.en.Then;\n\nimport junit.framework.Assert;\n\nimport org.openqa.selenium.WebDriver;\n\
    \nimport org.openqa.selenium.firefox.FirefoxDriver;\n\n/**\n\n * Created by Sagar\
    \ on 12-07-2016.\n\n */\n\n@SuppressWarnings(\"ALL\")\n\npublic  class seleniumsteps\n\
    \n    {\n\n    WebDriver driver;\n\n @Before\n\n public  void launchBrowser(){\n\
    \ndriver = new FirefoxDriver();\n\n    }\n\n    @Given(\"^I am on the www\\\\\
    .softpost\\\\.org home page$\")\n\n public  void i_am_on_the_www_softpost_org_home_page()\
    \ throws  Throwable\n\n{\n\n        driver.get(\"http://www.softpost.org\");\n\
    \n    }\n\n    @Then(\"^I verify that title contains tutorials$\")\n\n public\
    \  void i_verify_that_title_contains_tutorials() throws  Throwable\n\n    {\n\n\
            Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"tutorials\"\
    ));\n\n    }\n\n    @After\n\n public  void killBrowser()\n\n{\n\n        driver.close();\n\
    \n        driver.quit();\n\n    }\n\n}\n\nAfter writing the step definitions,\
    \ you can create the run configuration for feature file as shown in below image.\
    \ Note that Glue property is very important. You should specify the package name\
    \ that contains step definitions in the Glue.\n\n[![glue in Cucumber run configuration](images/00003.jpeg)](http://www.softpost.org/wp-content/uploads/2016/07/glue-in-Cucumber-run-configuration.png)\n\
    \nglue in Cucumber run configuration\n\nThen you can right click on feature file\
    \ and run the test as shown in below image.\n\n![Running cucumber feature file\
    \ in IntelliJ IDEA](images/00004.jpeg)Running cucumber feature file in IntelliJ\
    \ IDEA\n\nIf everything is ok, tests will run successfully.\n\nCucumber Reports\
    \ in IntelliJ IDEA\n\nYou can view report of execution as shown in below images.\n\
    \n![Viewing cucumber execution report in IntelliJ IDEA](images/00005.jpeg)\n\n\
    Viewing cucumber execution report in IntelliJ IDEA\n\n[![HTML report of cucumber\
    \ tests](images/00006.jpeg)](http://www.softpost.org/wp-content/uploads/2016/07/HTML-report-of-cucumber-tests.png)\n\
    \nHTML report of cucumber tests\n\n# 6\\. [Executing Cucumber tests using Cucumber\
    \ class](http://www.softpost.org/cucumber/executing-cucumber-tests-using-cucumber-class/)\n\
    \nTo write the tests using JUnit @RunWith annotation, we need below dependencies."
