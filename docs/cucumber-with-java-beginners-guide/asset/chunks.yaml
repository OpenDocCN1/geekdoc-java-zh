- fmt: "\n![](images/00011.jpeg)\n\n# About the Author\n\nMr. Paul Watson has many\
    \ years of experience in working with `BDD` and `Cucumber`. He has worked on large\
    \ software projects in USA, UK, Singapore, Hong Kong, Dubai, Australia and Switzerland.\n\
    \nHis hobbies include travelling to new tourist places, watching basketball, cricket,\
    \ Soccer and learning latest technological stuff.\n\n# Who is this book for\n\n\
    This book is for software developers, automation testers, `Devops` and engineers\
    \ working on IT project. Whether you are a beginner or an experienced developer,\
    \ this book will help you master the skills on `Cucumber`.\n\nThe book starts\
    \ with introduction of `Cucumber` and then dives into key concepts like creating\
    \ project in `IntelliJ IDEA`, using tags, plugins, integration with `Junit`, executing\
    \ `selenium` tests, using `picocontainer` and `lamda expressions`.\n\n# Preface\n\
    \nThis book is for those who are new to `Cucumber`. It will help you understand\
    \ what is `Cucumber` and how you can use it in your software project.\n\nIn this\
    \ book, you will learn below topics.\n\n1. [Introduction to Cucumber](http://www.softpost.org/cucumber/introduction-to-cucumber/)\n\
    2. [Installation of Cucumber](http://www.softpost.org/cucumber/installation-of-cucumber/)\n\
    3. [Writing feature files using Gherkin](http://www.softpost.org/development-models/bdd-software-development-with-gherkin/)\n\
    4. [Adding Cucumber dependency to Java project](http://www.softpost.org/cucumber/adding-cucumber-dependency-to-java-project/)\n\
    5. Cucumber Test\n6. [Executing Cucumber tests using Cucumber class](http://www.softpost.org/cucumber/executing-cucumber-tests-using-cucumber-class/)\n\
    7. [Cucumber options](http://www.softpost.org/cucumber/cucumber-options/)\n8.\
    \ Filtering scenarios\n9. [Passing parameters to steps](http://www.softpost.org/cucumber/passing-parameters-to-cucumber-steps/)\n\
    10. Passing the data table to steps\n11. Feature file variations\n12. [Running\
    \ multiple feature files in Cucumber](http://www.softpost.org/cucumber/how-to-run-multiple-feature-files-in-cucumber/)\n\
    13. [Sharing selenium Webdriver instance using PicoContainer](http://www.softpost.org/cucumber/sharing-selenium-webdriver-instance-using-picocontainer/)\n\
    14. Reports in Cucumber\n15. Cucumber using Lambda Expressions\n\n## 1. Introduction\n\
    \n`Cucumber` is the `BDD` (Behavior driven development) testing framework.\n\n\
    Key things to note about `Cucumber` are -\n1. Open source `BDD` testing framework.\n\
    2. Cross platform framework.\n3. Tests are written in various languages like English,\
    \ French, German and many more using `Gherkin Syntax`.\n4. We can write the tests\
    \ in various programming languages like `Ruby`, `JRuby`, `PHP`, `Java`, `Jython`,\
    \ `Groovy`, `Javascript`, `Clojure`, `Gosu`, `Lua`, `.Net`, `C++`.\n5. Integrates\
    \ well with CI servers like `Jenkins` and `TeamCity`.\n6. Reports can be generated\
    \ in `HTML`, `JSON`, `JUnit` style.\n7. `Capybara` - the testing framework is\
    \ a part of `Cucumber`.\n8. Integrates well with frameworks like `Selenium`, `Appium`,\
    \ `Spring`, `Watir`, `Ruby on Rails` etc.\n\n## 2. Installation of Cucumber\n\n\
    Setting up `Cucumber` is very simple. You will need to install below tools:\n\
    1. Java `JDK`\n2. Java IDE - `IntelliJ IDEA` or `Eclipse`\n3. `Cucumber` library\n\
    4. Build tools like `Maven` or `gradle`\n5. `IntelliJ IDEA` Plugins - `Gherkin`\
    \ and `cucumber` for `Java`\n\nCreate a simple `Maven` or `gradle` project and\
    \ add below dependency:\n\n```xml\n<dependency>\n <groupId>info.cukes</groupId>\n\
    \ <artifactId>cucumber-java</artifactId>\n <version>1.2.4</version>\n <scope>test</scope>\n\
    </dependency>\n```\n\nFor writing the test steps using `lambda expression` in\
    \ `Java 8`, you will have to add below dependency:\n\n```xml\n<dependency>\n <groupId>info.cukes</groupId>\n\
    \ <artifactId>cucumber-java8</artifactId>\n <version>1.2.4</version>\n <scope>test</scope>\n\
    </dependency>\n```\n\nYou also need below `JUnit` dependencies to integrate `Cucumber`\
    \ with `JUnit`:\n\n```xml\n<dependency>\n <groupId>junit</groupId>\n <artifactId>junit</artifactId>\n\
    \ <version>4.12</version>\n <scope>test</scope>\n</dependency>\n<dependency>\n\
    \ <groupId>info.cukes</groupId>\n <artifactId>cucumber-junit</artifactId>\n <version>1.2.4</version>\n\
    \ <scope>test</scope>\n</dependency>\n```\n\n## 3. Writing feature files using\
    \ Gherkin\n\n`BDD` is an emerging software development model used along with agile\
    \ methodologies. Some of the key things to know about `BDD` are -\n1. Dan North\
    \ created first `BDD` framework - `Jbehave`.\n2. Other `BDD` frameworks are `Rbehave`,\
    \ `Rspec`, `Cucumber`, `Behat`.\n3. The tests are written in plain text in the\
    \ form of stories or features.\n4. The Domain specific language (`Gherkin`) is\
    \ used for writing the tests.\n\n### What is Gherkin?\n\n`Gherkin` is the plain\
    \ text language used to write feature files (also called as story files) in `BDD`\
    \ frameworks like `cucumber`. `Gherkin` is implemented in most of languages in\
    \ the world like English, German, French&...;many more. This means that any project\
    \ stakeholder can write, read and understand the tests written in `Gherkin`. That's\
    \ the crux of the `Gherkin` language.\n\n### Key points to note about feature\
    \ file\n\n1. Each `feature file` can contain one or more scenarios and optionally\
    \ `outline` and `background`.\n2. Each scenario has steps like `given`, `when`,\
    \ `and`, `then`, `but`.\n\n### What are the keywords in Gherkin?\n\n`Gherkin`\
    \ has reserved some keywords which have specific meaning in the context of feature\
    \ files.\n"
