    \nMultiple feature files in Cucumber\n\n# 13. [Sharing selenium Webdriver instance\
    \ using PicoContainer](http://www.softpost.org/cucumber/sharing-selenium-webdriver-instance-using-picocontainer/)\n\
    \nIn Selenium automation, we create a `WebDriver` instance. But we can not use\
    \ the same driver instance in different step definition classes in Cucumber.\n\
    \nWe can share the same Webdriver instance in 2 ways:\n\n1. By creating a static\
    \ `Webdriver`\n2. By using `PicoContainer` (Dependency Injection)\n\nFirst method\
    \ is very simple. Just create a class with `Static WebDriver` field.\n\nNow let\
    \ us take a look at how we can share the same driver using Dependency Injection.\
    \ For this, you will need below dependencies.\n\n```xml\n<dependency>\n  <groupId>org.seleniumhq.selenium</groupId>\n\
    \  <artifactId>selenium-java</artifactId>\n  <version>2.42.2</version>\n</dependency>\n\
    <dependency>\n  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-picocontainer</artifactId>\n\
    \  <version>1.2.4</version>\n  <scope>test</scope>\n</dependency>\n```\n\nNext,\
    \ we need to create a class where we will create a `Webdriver` instance as shown\
    \ in below example. Note that we instantiates the driver only once. We have got\
    \ a method `getDriver` to get the driver.\n\n```java\npackage org.softpost;\n\n\
    import cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.firefox.FirefoxDriver;\n\npublic class SharedClass\n\
    {\n private static boolean startBrowser = false;\n private WebDriver driver;\n\
    \n public String title = \"\";\n\n    @Before(\"@sharedselenium\")\n    public\
    \ void init() throws Exception\n    {\n      if (!startBrowser)\n      {\n   \
    \      driver = new FirefoxDriver();\n         //To stop launching browser after\
    \ every scenario, assign below variable with true value\n         startBrowser\
    \ = false;\n      }\n    }\n\n    public WebDriver getDriver()\n    {\n      return\
    \ driver;\n    }\n\n    @After(\"@sharedselenium\")\n    public void cleanUp()\n\
    \    {\n      driver.close();\n      driver.quit();\n    }\n}\n```\n\nNext in\
    \ the step definition classes, we can pass the instance of above class as shown\
    \ in below example. Note that we are using `getDriver()` method to access the\
    \ driver instance. So similarly you can pass the instance of `SharedClass` to\
    \ any step definition class that wants to use the driver. `PicoContainer` is used\
    \ internally to wire up dependent classes.\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\nimport\
    \ junit.framework.Assert;\n\npublic class ShareSelenium\n{\n SharedClass sharedClass;\n\
    \n public ShareSelenium(SharedClass sharedClass)\n{\n    this.sharedClass = sharedClass;\n\
    \ }\n\n    @Given(\"^I am on the www\\\\.softpost\\\\.org home page$\")\n    public\
    \ void i_am_on_the_www_softpost_org_home_page() throws Throwable\n    {\n    \
    \  sharedClass.getDriver().get(\"http://www.softpost.org\");\n    }\n\n    @Then(\"\
    ^I verify that title contains tutorials$\")\n    public void i_verify_that_title_contains_tutorials()\
    \ throws Throwable\n    {\n      Assert.assertTrue(sharedClass.getDriver().getTitle().contains(\"\
    tutorials\"));\n    }\n\n    @Then(\"^I verify that title contains tutorials$\"\
    )\n    public void i_verify_that_title_contains_tutorials() throws Throwable\n\
    \    {\n      Assert.assertTrue(sharedClass.getDriver().getTitle().contains(\"\
    tutorials\"));\n    }\n}\n```\n\n# 14. Reports in Cucumber\n\n## 14.1 [Embedding\
    \ the screenshot](http://www.softpost.org/taking-screenshot-and-embeding-in-the-report)\n\
    \nWhen working in selenium project, we often need to take a screenshot on failure.\
    \ Selenium provides a way to take screenshot with the help of `takesScreenshot`\
    \ interface.\n\nCucumber allows you to embed that in reports.\n\nHere is the simple\
    \ code.\n\n```java\n@After(\"@selenium\")\npublic void killBrowser(Scenario scenario)\n\
    {\n  if (scenario.isFailed())\n  {\n    scenario.embed(((TakesScreenshot)driver).getScreenshot(OutputType.BYTES),\
    \ \"image/png\");\n  }\n  driver.close();\n  driver.quit();\n}\n```\n\nBelow image\
    \ shows where to find the HTML report in Maven.\n\n[![Cucumber report in Maven\
    \ project](images/00008.jpeg)](http://www.softpost.org/wp-content/uploads/2016/07/Cucumber-report-location-in-Maven-project.png)\n\
    \nCucumber report in Maven project\n\nHere is the sample HTML report showing the\
    \ captured screenshot.\n\n[![Embeding the screenshot](images/00009.jpeg)](http://www.softpost.org/wp-content/uploads/2016/07/Embeding-the-screenshot-in-Cucumber-report.png)\n\
    \nEmbeding the screenshot in Cucumber\n\n## 14.2 [Writing to Cucumber HTML reports](http://www.softpost.org/writing-to-cucumber-reports/)\n\
    \nWe can write to Cucumber HTML report using `write` method of `Scenario` class.\n\
    \nBelow step definition class illustrates how to write to HTML report. Note how\
    \ we have passed scenario object to `Before` method.\n\n```java\npackage org.softpost;\n\
    \nimport com.google.common.primitives.Bytes;\nimport cucumber.api.Scenario;\n\
    import cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\n\
    import cucumber.api.java.en.Then;\nimport junit.framework.Assert;\nimport org.openqa.selenium.OutputType;\n\
    import org.openqa.selenium.TakesScreenshot;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.firefox.FirefoxDriver;\n\n/**\n * Created by Sagar\
    \ on 12-07-2016.\n */\n@SuppressWarnings(\"ALL\")\npublic class seleniumsteps\n\
    {\n    WebDriver driver;\n    Scenario scenario;\n\n    @Before(\"@selenium\"\
    )\n    public void launchBrowser(Scenario scenario)\n    {\n      driver = new\
    \ FirefoxDriver();\n      this.scenario = scenario;\n    }\n\n    @Given(\"^I\
    \ am on the www\\\\.softpost\\\\.org home page$\")\n    public void i_am_on_the_www_softpost_org_home_page()\
    \ throws Throwable\n    {\n      driver.get(\"http://www.softpost.org\");\n  \
    \    scenario.write(\"Navigated to www.softpost.org\");\n    }\n}\n```\n"
