  trans: "\n\n`cucumber.api.junit.Cucumber` - 该类存在 `cucumber-junit` 依赖库中。\n\n```xml\n\
    <dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n \
    \ <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n\n<dependency>\n\
    \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-junit</artifactId>\n\
    \  <version>1.2.4</version>\n</dependency>\n```\n\n然后你可以添加下面的测试类。运行下面的测试后，cucumber\
    \ 会在 `target/selenium-reports` 生成报告。`Cucumber.class` 包含主方法，用于读取特性文件并执行其中的场景。\n\
    \n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\nimport\
    \ cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    plugin = \"html:target/selenium-reports\"\n)\npublic class MyTests\n{\n\
    }\n```\n\n# 7. Cucumber 选项\n\n在执行 cucumber 场景时，我们可以传递下面提到的各种选项。\n\n1. `features`\
    \ - 特性文件的路径\n2. `glue` - 步骤定义类的路径\n3. `dry run` - 用于检查所有步骤定义是否已设计\n4. `monochrome`\
    \ - true/false，它控制输出的可读性\n5. `strict` - 设置为 false 表示跳过未定义的步骤。测试不会失败\n6. `name`\
    \ - 用于过滤特性和场景\n7. `plugin` - json, html, junit, pretty\n8. `snippets` - 代码段样式可以是驼峰命名法（Camel\
    \ case）或下划线（Underscore）\n\n这是一个显示所有选项的示例测试类。\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.api.CucumberOptions;\nimport cucumber.api.SnippetType;\nimport\
    \ cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = \"~@blocked\",\n    plugin = \"html:target/selenium-reports\",\n\
    \    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
    \ = SnippetType.CAMELCASE\n)\npublic class MyTests\n{\n}\n```\n\n# 8. 过滤场景\n\n\
    ## 8.1 为场景标记标签\n\n我们可以像下面的示例所示，在特性文件中使用 `@` 符号对场景进行标记。注意，我们也可以通过在特性文件开头编写标签来为文件中的所有场景标记。我们还可以为同一个场景关联多个标签。在下面的示例中，我们为场景标记了\
    \ 4 个标签：selenium、regression、sanity 和 critical。\n\n```gherkin\n@selenium\nFeature:\
    \ My feature\n\n  @regression @sanity @critical\n  Scenario: Verify title\n  \
    \  Given I am on the www.softpost.org home page\n    Then I verify that title\
    \ contains tutorials\n```\n\n要执行带有 `regression` 和 `critical` 两个标签的场景，我们可以使用下面的语法。\n\
    \n`tags = [\"@regression\",\"@critical\"]`\n\n要执行带有 `regression` 或 `critical`\
    \ 两个标签的场景，我们可以使用下面的语法：\n\n`tags = [\"@regression,@critical\"]`\n\n要跳过标记为 `sanity`\
    \ 标签的场景，我们可以使用下面的语法：\n\n`Negative tags = [\"~@sanity\"]`\n\n我们还可以将 `@Before` 和\
    \ `@After` 方法与标记了特定名称的场景绑定。例如，下面的 before 方法将只在标记了 selenium 标签的场景之前执行。\n\n`@Before(\"\
    @selenium\")`\n\n这里是一个展示在 Cucumber 中使用标签的示例。考虑下面的特性文件。\n\n```gherkin\n@selenium\n\
    Feature: My feature\n\n    @regression @sanity @critical\n    Scenario: Verify\
    \ soft title\n    Given I am on the www.softpost.org home page\n    Then I verify\
    \ that title contains tutorials\n\n    @sanity\n    Scenario: Verify yahoo title\n\
    \        Given I am on the www.yahoo.com home page\n        Then I verify that\
    \ title contains tutorials\n```\n\n查看下面的测试类。执行该测试类后，只有标记了 `@sanity` 和 `@regression`\
    \ 的场景会被执行。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\nimport\
    \ org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n \
    \   features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = {\"@sanity,@regression\"},\n    plugin = \"html:target/selenium-reports\"\
    ,\n    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
    \ = SnippetType.CAMELCASE\n)\npublic class MyTests\n{\n}\n```\n\n现在查看下面的测试类。执行该测试后，两个场景都会执行，因为它们都标记了\
    \ `@sanity`。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\nimport\
    \ org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n \
    \   features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = {\"@regression,@critical\"},\n    plugin = \"html:target/selenium-reports\"\
    ,\n    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
    \ = SnippetType.CAMELCASE\n)\npublic class MyTests\n{\n}\n```\n\n现在查看下面的测试类。执行该测试类后，没有任何场景会被执行，因为标签标记为\
    \ `~`。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    tags = {\"~@sanity\"},\n    plugin = \"html:target/selenium-reports\"\n\
    )\npublic class MyTest\n{\n```\n\n## 8.2 使用 name 选项\n\n我们可以根据名称模式来执行特定的场景。例如——考虑下面的特性文件。\n\
    \n```gherkin\n@selenium\nFeature: My feature\n\n    @regression @sanity @critical\n\
    \    Scenario: Verify soft title\n    Given I am on the www.softpost.org home\
    \ page\n    Then I verify that title contains tutorials\n\n    @sanity\n    Scenario:\
    \ Verify yahoo title\n        Given I am on the www.yahoo.com home page\n    \
    \    Then I verify that title contains tutorials\n```\n\n要只执行名为 \"softpost\" 的场景，我们可以使用下面的测试类。注意我们也可以使用正则表达式来指定场景名称。\n\
    \n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\nimport\
    \ cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
    ,\n    name = {\"softpost\"},\n    plugin = \"html:target/selenium-reports\"\n\
    )\npublic class MyTest\n{\n}\n```\n\n# 9. 向步骤传递参数\n\n我们可以像下面的场景所示，从特性将参数传递到步骤方法。在下面的场景中，我们在\
    \ `Given` 步骤中传递了网站名称。传递参数的主要优势是可以在带有不同参数的场景中重用同一个步骤方法。\n\n```gherkin\n@selenium\n\
    Feature: Simple feature\n  Scenario: Test web title\n    Given I am on \"www.yahoo.com\"\
    \ page\n    Then I verify that the title is \"yahoo\"\n  Scenario: Test web title\n\
