    \n## 15.1 [Cucumber dependency for using Lambda expressions in Java 8](http://www.softpost.org/cucumber/cucumber-dependency-lambda-expressions-java-8/)\n\
    \nIn Java 8, Lambda expressions were introduced. Cucumber allows you to write\
    \ step definitions using Lambda expressions.\n\nYou need to add below dependency\
    \ to write tests using Lambda expressions.\n\n```xml\n<dependency>\n <groupId>info.cukes</groupId>\n\
    \ <artifactId>cucumber-java8</artifactId>\n <version>1.2.4</version>\n <scope>test</scope>\n\
    </dependency>\n```\n\nEnsure that JDK version is `1.8.0_51`. Otherwise you will\
    \ get below error.\n\n`Exception in thread \"main\" cucumber.runtime.CucumberException:\
    \ Failed to instantiate class  .......CucumberException: java.lang.IllegalArgumentException:\
    \ Wrong type at constant pool index`\n\n## 15.2 [Cucumber test using Lambda expressions](http://www.softpost.org/cucumber/cucumber-test-using-lambda-expressions/)\n\
    \nNow let us write sample cucumber step definitions using Lambda expressions.\n\
    \nHere is the sample feature file.\n\n```gherkin\nFeature: Lambda feature\n  Scenario:\
    \ Verify sum\n    Given I add 1 and 2\n    Then I verify that sum is 3\n```\n\n\
    Here is the sample Test Class using Lambda expressions to write the step definitions.\
    \ Note that `StepClass` must implement `cucmber.api.java8.En` interface and `step`\
    \ methods should be inside the constructor of test class. You also need to ensure\
    \ that Java language level should be `1.8`.\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.api.java8.En;\n\npublic class StepClass8 implements En {\n \
    \   public StepClass8() {\n        Given(\"^I add 1 and 2$\", () -> {\n      \
    \      System.out.println(\"Adding 1 and 2\");\n        });\n        Then(\"^I\
    \ verify that sum is 3$\", () -> {\n            System.out.println(\"Checking\
    \ that sum is 3\");\n        });\n    }\n}\n```\n\nIf you are using Maven, you\
    \ can specify the Java language level using below XML section in POM.XML\n\n```xml\n\
    <build>\n <plugins>\n  <plugin>\n     <groupId>org.apache.maven.plugins</groupId>\n\
    \     <artifactId>maven-compiler-plugin</artifactId>\n     <version>2.3.2</version>\n\
    \     <configuration>\n      <source>1.8</source>\n      <target>1.8</target>\n\
    \      <encoding>UTF-8</encoding>\n     </configuration>\n  </plugin>\n </plugins>\n\
    </build>\n```\n"
