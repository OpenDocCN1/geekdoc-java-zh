- "# Java Cucumber：初学者指南\n\n\n\n![](img/00011.jpeg)\n\n# 关于作者\n\nPaul Watson 先生在 `BDD`\
  \ 和 `Cucumber` 方面拥有多年经验。他曾在美国、英国、新加坡、香港、迪拜、澳大利亚和瑞士参与过大型软件项目。\n\n他的爱好包括去新的旅游胜地、看篮球、板球、足球以及学习最新的技术知识。\n\
  \n# 这本书适合谁\n\n本书适用于软件开发人员、自动化测试人员、`Devops` 人以及从事 IT 项目的工程师。无论你是初学者还是丰富的开发者，这本书都将帮助你掌握\
  \ `Cucumber` 的技能。\n\n本书从介绍 `Cucumber` 开始，然后深入探讨核心概念，如在 `IntelliJ IDEA` 中创建项目、使用标签、插件、与\
  \ `Junit` 集成、执行 `selenium` 测试、使用 `picocontainer` 和 lambda 表达式。\n\n# 前言\n\n本书是为初接触\
  \ `Cucumber` 的读者准备的。它将帮助你理解什么是 `Cucumber` 以及如何在软件项目中使用它。\n\n在书中，你将学习到以下主题：\n\n\n\
  ## 1. 简介\n\n`Cucumber` 是 `BDD`（行为驱动开发）测试框架。\n\n关于 `Cucumber` 需要注意的关键有：\n1. 开源 `BDD`\
  \ 测试框架。\n2. 跨平台框架。\n3. 测试使用英语、法语、德语等多种语言通过 `Gherkin Syntax` 编写。\n4. 我们可以使用多种编程语言编写测试，如\
  \ `Ruby`、`JRuby`、`PHP`、`Java`、`Jython`、`Groovy`、`Javascript`、`Clojure`、`Gosu`、`Lua`、`.Net`、`C++`。\n\
  5. 与 `Jenkins` 和 `TeamCity` 等 CI 服务器良好集成。\n6. 可以生成 `HTML`、`JSON`、`JUnit` 风格的报告。\n\
  7. `Capybara` - 测试框架是 `Cucumber` 的一部分。\n8. 与 `Selenium`、`Appium`、`Spring`、`Watir`、`Ruby\
  \ on Rails` 等框架良好集成。\n\n## 2. 安装 Cucumber\n\n设置 `Cucumber` 非常简单。你需要安装以下工具：\n1. Java\
  \ `JDK`\n2. Java IDE - `IntelliJ IDEA` 或 `Eclipse`\n3. `Cucumber` 库\n4. 构建工具如 `Maven`\
  \ 或 `gradle`\n5. `IntelliJ IDEA` 插件 - 适用于 `Java` 的 `Gherkin` 和 `cucumber`\n\n创建一个简单的\
  \ `Maven` 或 `gradle` 项目并添加以下依赖：\n\n```xml\n<dependency>\n <groupId>info.cukes</groupId>\n\
  \ <artifactId>cucumber-java</artifactId>\n <version>1.2.4</version>\n <scope>test</scope>\n\
  </dependency>\n```\n\n要在 `Java 8`get `lambda expression` 编写测试步骤，你需要添加以下依赖：\n\n```xml\n\
  <dependency>\n <groupId>info.cukes</groupId>\n <artifactId>cucumber-java8</artifactId>\n\
  \ <version>1.2.4</version>\n <scope>test</scope>\n</dependency>\n```\n\n你还需要以下 `JUnit`\
  \ 依赖来将 `Cucumber` 与 `JUnit` 集成：\n\n```xml\n<dependency>\n <groupId>junit</groupId>\n\
  \ <artifactId>junit</artifactId>\n <version>4.12</version>\n <scope>test</scope>\n\
  </dependency>\n<dependency>\n <groupId>info.cukes</groupId>\n <artifactId>cucumber-junit</artifactId>\n\
  \ <version>1.2.4</version>\n <scope>test</scope>\n</dependency>\n```\n\n## 3. 使用\
  \ Gherkin 编写 feature 文件\n\n`BDD` 是与敏捷方法一起使用的新兴软件开发模型。关于 `BDD` 需要知道的关键点有：\n1. Dan\
  \ North 创建了第一个 `BDD` 框架 - `Jbehave`。\n2. 其他 `BDD` 框架有 `Rbehave`、`Rspec`、`Cucumber`、`Behat`。\n\
  3. 测试以故事（stories）或特性（features）的形式用纯文本编写。\n4. 使用领域特定语言 (`Gherkin`) 来编写测试。\n\n###\
  \ 什么是 Gherkin?\n\n`Gherkin` 是在 `BDD` 框架（如 `cucumber`）中编写 feature 文件（称为故事文件）的纯文本语言。`Gherkin`\
  \ 支持世界上大多数语言，如英语、德语、法语等。这意味着任何项目利益相关者都可以编写、阅读和理解用 `Gherkin` 编写的测试。这就是 `Gherkin`\
  \ 语言的核心。\n\n### feature 文件的要点\n\n1. 每个 `feature file` 可以包含一个或多个场景（scenarios），以及可选的\
  \ `outline` 和 `background`。\n2. 每个场景都有 `given`、`when`、`and`、`then`、`but` 等步骤。\n\n\
  ### Gherkin 中的关键字有哪些？\n\n`Gherkin` 保留了一些关键字，这些关键字在 feature 文件的范围内具有特定的含义。\n\n\n\n\
  \n\n以下是 Gherkin 中的关键字列表。\n\n1. `Given` - 用于指定场景的预置条件\n2. `When` - 用于指定动作\n3. `And`\
  \ - 用于指定额外的前置条件和动作\n4. `Then` - 用于指定动作的结果\n5. `Feature` - 用于指定特性的描述\n6. `Scenario`\
  \ - 用于指定场景的描述\n7. `Outline` 和 `Examples`\n8. `Background` - 用于指定在执行 feature 文件中的每个场景之前要采取的动作\n\
  9. `\"\"\"` - 用于以多行格式传递数据\n10. `|` - 用于以表格格式传递数据\n11. `@` - 用于为场景和功能标记标签（tag）\n\
  12. `#` - 用于对 feature 文件中的进行注释\n\n下面的 feature 文件将让你理解 Gherkin 语言的大部分语法。\n\n## 基础示例\
  \ feature 文件\n\n现在让我们来看看 gherkin 中可以拥的最简单的 feature 文件。\n\n```gherkin\nFeature: ATM\
  \ 卡认证\n\n   当 ATM 卡插入 ATM 机后，用户应被要求输入 PIN 码。\n\n   如果输入的 PIN 码错误，用户应收到警告消息。\n  \
  \ 如果输入的 PIN 码正确，用户应成功通过认证。\n\n Scenario: 在 ATM 机上输入错误的 PIN 码\n\n  Given 我将 ATM 卡插入\
  \ ATM 机\n  And 我被要求输入 PIN 码\n  When 我输入正确的 PIN 码\n  Then 我应该看到取款选项\n```\n\n## 带有\
  \ Outline 和 Examples 关键字的示例 feature 文件\n\nScenario outline 用于我们需要重复一组动作但使用不同数据组合的情况。例如，在下面的\
  \ scenario outline 中，我们需要用不同的用户 ID 和密码组合来测试登录功能。在这种情况下，我们使用 `<VariableData>` 语法来指定变化的数据，并通过\
  \ `examples` 关键字提供数据。因此，在下面的场景中，所有步骤将执行 4 次 - 每个用户执行一次。\n\n```gherkin\nScenario\
  \ Outline: 密码规则\n\n  Given 我们正处于登录页面\n  When 我们输入用户 id <ID> 和密码 <PASSWORD>\n  Then\
  \ 登录结果应为 <OUTCOME>\n\n Examples:\n\n    | ID    | PASSWORD | OUTCOME |\n    |  Sagar|\
  \  128$9#  |     Fail|\n    |  Amol |  98sjdg  |     PASS|\n    |  Shaun |  jslush9\
  \  |     PASS|\n    |    Ben |  KON()%  |     FAIL|\n```\n\n## 带有 Background 的示例\
  \ feature 文件\n\nBackground 关键字用于在执行每个场景之前执行特定数量的步骤。例如，假设你想在执行每个场景之前清除浏览器 cookie，那么我们可以使用\
  \ background 关键字配合清除 cookie 的步骤。\n\n### 向步骤传递输入数据\n\n每个场景可以有多个步骤，每个步骤都是用户的操作。一个步骤就像系统中的特定操作。一个步骤可能需要对输入数据进行处理。我们可以通过三种方式向步骤传递输入数据。\n\
  \n1. 内联变量 (In-line Variables)\n2. 多行字符串\n3. 表格\n\n### 使用标签对场景和功能分组\n\n我们在 Gherkin\
  \ 中使用标签将相似的场景和功能分组在一起。`@` 符号用于标记场景和功能。\n\n## 4. 为 Java 项目添加 Cucumber 依赖\n\n要使用 cucumber\
  \ 编写测试，我们需要添加 2 类型的依赖。\n\n1. `cucumber-java`\n2. `junit`\n\n如果你使用 Maven 构建管理系统，可以在\
  \ POM.XML 中使用下面的 XML 块。\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
  \  <artifactId>cucumber-java</artifactId>\n  <version>1.2.4</version>\n</dependency>\n\
  <dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n  <version>4.12</version>\n\
  \  <scope>test</scope>\n</dependency>\n```\n\n## 5. Cucumber 测试\n\n### 5.1 编写第一个\
  \ cucumber 测试\n\n按照下面的步骤在 IntelliJ IDEA 中编写第一个 cucumber 测试。\n\n1. 创建一个 maven 项目。\n\
  2. 在 Test Resources 目录下添加包含场景的 feature 文件。\n3. 添加 Cucumber 的 maven 依赖。\n4. 编写步骤定义（step\
  \ definitions）并从 feature 文件执行测试。\n\n这是我们创建并放入 test resources 文件夹的 feature 文件。\n\n\
  ```gherkin\n@selenium\nFeature: 我的特性\n\n  Scenario: 验证标题\n    Given 我在 www.softpost.org\
  \ 首页\n    Then 我验证标题包含 tutorials\n```\n\n注意，我们没有为上述 feature 文件中的步骤添加步骤定义。当你执行 feature\
  \ 文件时，你会看到下面的错误。你可以使用下面的代码片段实现缺失的步骤：\n\n```java\n@Given(\"^I am on the www\\\\.softpost\\\
  \\.org home page$\")\npublic void i_am_on_the_www_softpost_org_home_page() throws\
  \ Throwable {\n    // 在此处编写代码将上面的短语转换为具体的动作\n    throw new PendingException();\n\
  }\n\n@Then(\"^I verify that title contains tutorials$\")\npublic void i_verify_that_title_contains_tutorials()\
  \ throws Throwable {\n}\n```\n\n缺失步骤的错误：\n`Given I am on the www.softpost.org home\
  \ page`\n`Then I verify that title contains tutorials`\n\n或者，如果你在 IntelliJ IDEA\
  \ 中有 cucumber 插件，可以通过按 feature 文件中步骤上的 alt 键来创建步骤定义。以下是带有步骤定义的类：\n\n```java\npackage\
  \ org.softpost;\n\nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\n\
  import cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\nimport junit.framework.Assert;\n\
  import org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.firefox.FirefoxDriver;\n\
  \n@SuppressWarnings(\"ALL\")\npublic class seleniumsteps {\n\n    WebDriver driver;\n\
  \n    @Before\n    public void launchBrowser() {\n        driver = new FirefoxDriver();\n\
  \    }\n\n    @Given(\"^I am on the www\\\\.softpost\\\\.org home page$\")\n   \
  \ public void i_am_on_the_www_softpost_org_home_page() throws Throwable {\n    \
  \    driver.get(\"http://www.softpost.org\");\n    }\n\n    @Then(\"^I verify that\
  \ title contains tutorials$\")\n    public void i_verify_that_title_contains_tutorials()\
  \ throws Throwable {\n        Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
  tutorials\"));\n    }\n\n    @After\n    public void killBrowser() {\n        driver.close();\n\
  \        driver.quit();\n    }\n}\n```\n\n编写步骤定义后，你可以像下面的图片一样为 feature 文件创建运行配置（run\
  \ configuration）。注意 Glue 属性非常重要。你应该在 Glue 中指定包含步骤定义的包名。\n\n然后，你可以右键点击 feature 文件并运行测试。\n\
  \n如果一切正常，测试将成功运行。\n\n\n\n\n\n`cucumber.api.junit.Cucumber` - 该类存在 `cucumber-junit`\
  \ 依赖库中。\n\n```xml\n<dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n\
  \  <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n\n<dependency>\n\
  \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-junit</artifactId>\n  <version>1.2.4</version>\n\
  </dependency>\n```\n\n然后你可以添加下面的测试类。运行下面的测试后，cucumber 会在 `target/selenium-reports`\
  \ 生成报告。`Cucumber.class` 包含主方法，用于读取特性文件并执行其中的场景。\n\n```java\npackage org.softpost;\n\
  \nimport cucumber.api.CucumberOptions;\nimport cucumber.api.junit.Cucumber;\nimport\
  \ org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n   \
  \ features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\",\n\
  \    plugin = \"html:target/selenium-reports\"\n)\npublic class MyTests\n{\n}\n\
  ```\n\n# 7. Cucumber 选项\n\n在执行 cucumber 场景时，我们可以传递下面提到的各种选项。\n\n1. `features` -\
  \ 特性文件的路径\n2. `glue` - 步骤定义类的路径\n3. `dry run` - 用于检查所有步骤定义是否已设计\n4. `monochrome`\
  \ - true/false，它控制输出的可读性\n5. `strict` - 设置为 false 表示跳过未定义的步骤。测试不会失败\n6. `name` -\
  \ 用于过滤特性和场景\n7. `plugin` - json, html, junit, pretty\n8. `snippets` - 代码段样式可以是驼峰命名法（Camel\
  \ case）或下划线（Underscore）\n\n这是一个显示所有选项的示例测试类。\n\n```java\npackage org.softpost;\n\
  \nimport cucumber.api.CucumberOptions;\nimport cucumber.api.SnippetType;\nimport\
  \ cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
  @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
  ,\n    tags = \"~@blocked\",\n    plugin = \"html:target/selenium-reports\",\n \
  \   dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets =\
  \ SnippetType.CAMELCASE\n)\npublic class MyTests\n{\n}\n```\n\n# 8. 过滤场景\n\n## 8.1\
  \ 为场景标记标签\n\n我们可以像下面的示例所示，在特性文件中使用 `@` 符号对场景进行标记。注意，我们也可以通过在特性文件开头编写标签来为文件中的所有场景标记。我们还可以为同一个场景关联多个标签。在下面的示例中，我们为场景标记了\
  \ 4 个标签：selenium、regression、sanity 和 critical。\n\n```gherkin\n@selenium\nFeature:\
  \ My feature\n\n  @regression @sanity @critical\n  Scenario: Verify title\n    Given\
  \ I am on the www.softpost.org home page\n    Then I verify that title contains\
  \ tutorials\n```\n\n要执行带有 `regression` 和 `critical` 两个标签的场景，我们可以使用下面的语法。\n\n`tags\
  \ = [\"@regression\",\"@critical\"]`\n\n要执行带有 `regression` 或 `critical` 两个标签的场景，我们可以使用下面的语法：\n\
  \n`tags = [\"@regression,@critical\"]`\n\n要跳过标记为 `sanity` 标签的场景，我们可以使用下面的语法：\n\n\
  `Negative tags = [\"~@sanity\"]`\n\n我们还可以将 `@Before` 和 `@After` 方法与标记了特定名称的场景绑定。例如，下面的\
  \ before 方法将只在标记了 selenium 标签的场景之前执行。\n\n`@Before(\"@selenium\")`\n\n这里是一个展示在 Cucumber\
  \ 中使用标签的示例。考虑下面的特性文件。\n\n```gherkin\n@selenium\nFeature: My feature\n\n    @regression\
  \ @sanity @critical\n    Scenario: Verify soft title\n    Given I am on the www.softpost.org\
  \ home page\n    Then I verify that title contains tutorials\n\n    @sanity\n  \
  \  Scenario: Verify yahoo title\n        Given I am on the www.yahoo.com home page\n\
  \        Then I verify that title contains tutorials\n```\n\n查看下面的测试类。执行该测试类后，只有标记了\
  \ `@sanity` 和 `@regression` 的场景会被执行。\n\n```java\npackage org.softpost;\n\nimport\
  \ cucumber.api.CucumberOptions;\nimport cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\n\
  import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
  \    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
  ,\n    tags = {\"@sanity,@regression\"},\n    plugin = \"html:target/selenium-reports\"\
  ,\n    dryRun = false,\n    monochrome = true,\n    strict = true,\n    snippets\
  \ = SnippetType.CAMELCASE\n)\npublic class MyTests\n{\n}\n```\n\n现在查看下面的测试类。执行该测试后，两个场景都会执行，因为它们都标记了\
  \ `@sanity`。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
  import cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\
  \n@RunWith(Cucumber.class)\n@CucumberOptions(\n    features = \"classpath:abc.feature\"\
  ,\n    glue = \"classpath:org.softpost\",\n    tags = {\"@regression,@critical\"\
  },\n    plugin = \"html:target/selenium-reports\",\n    dryRun = false,\n    monochrome\
  \ = true,\n    strict = true,\n    snippets = SnippetType.CAMELCASE\n)\npublic class\
  \ MyTests\n{\n}\n```\n\n现在查看下面的测试类。执行该测试类后，没有任何场景会被执行，因为标签标记为 `~`。\n\n```java\n\
  package org.softpost;\n\nimport cucumber.api.CucumberOptions;\nimport cucumber.api.junit.Cucumber;\n\
  import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
  \    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
  ,\n    tags = {\"~@sanity\"},\n    plugin = \"html:target/selenium-reports\"\n)\n\
  public class MyTest\n{\n```\n\n## 8.2 使用 name 选项\n\n我们可以根据名称模式来执行特定的场景。例如——考虑下面的特性文件。\n\
  \n```gherkin\n@selenium\nFeature: My feature\n\n    @regression @sanity @critical\n\
  \    Scenario: Verify soft title\n    Given I am on the www.softpost.org home page\n\
  \    Then I verify that title contains tutorials\n\n    @sanity\n    Scenario: Verify\
  \ yahoo title\n        Given I am on the www.yahoo.com home page\n        Then I\
  \ verify that title contains tutorials\n```\n\n要只执行名为 \"softpost\" 的场景，我们可以使用下面的测试类。注意我们也可以使用正则表达式来指定场景名称。\n\
  \n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\nimport\
  \ cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
  @CucumberOptions(\n    features = \"classpath:abc.feature\",\n    glue = \"classpath:org.softpost\"\
  ,\n    name = {\"softpost\"},\n    plugin = \"html:target/selenium-reports\"\n)\n\
  public class MyTest\n{\n}\n```\n\n# 9. 向步骤传递参数\n\n我们可以像下面的场景所示，从特性将参数传递到步骤方法。在下面的场景中，我们在\
  \ `Given` 步骤中传递了网站名称。传递参数的主要优势是可以在带有不同参数的场景中重用同一个步骤方法。\n\n```gherkin\n@selenium\n\
  Feature: Simple feature\n  Scenario: Test web title\n    Given I am on \"www.yahoo.com\"\
  \ page\n    Then I verify that the title is \"yahoo\"\n  Scenario: Test web title\n\
  \    Given I am on \"www.softpost.org\" page\n    Then I verify that the title is\
  \ \"tutorials\"\n```\n\n这里是上述步骤的步骤定义。注意两个场景通过不同的参数重用了相同的步骤定义。\n\n```java\npackage\
  \ org.softpost;\nimport com.google.common.primitives.Bytes;\nimport cucumber.api.Scenario;\n\
  import cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\n\
  import cucumber.api.java.en.Then;\nimport junit.framework.Assert;\nimport org.openqa.selenium.OutputType;\n\
  import org.openqa.selenium.TakesScreenshot;\nimport org.openqa.selenium.WebDriver;\n\
  ```\n\n\n\n\n\n```java\nimport org.openqa.selenium.firefox.FirefoxDriver;\n\npublic\
  \ class seleniumsteps\n{\n    WebDriver driver;\n\n    Scenario scenario;\n\n  \
  \  @Before(\"@selenium\")\n    public void launchBrowser(Scenario scenario)\n  \
  \  {\n        driver = new FirefoxDriver();\n        this.scenario = scenario;\n\
  \        System.out.println(\"Executing scenario \" + scenario.getName());\n   \
  \ }\n\n    @After(\"@selenium\")\n    public void killBrowser()\n    {\n       \
  \ scenario.write(\"Finished scenario\");\n        if (scenario.isFailed())\n   \
  \     {\n            scenario.embed(((TakesScreenshot)driver).getScreenshotAs(OutputType.BYTES),\
  \ \"image/png\");\n        }\n        driver.close();\n        driver.quit();\n\
  \    }\n\n    @Given(\"^I am on \\\"([^\\\"]*)\\\" page$\")\n    public void i_am_on_page(String\
  \ arg1) throws Throwable\n    {\n        driver.get(\"http://\" + arg1);\n    }\n\
  \n    @Then(\"^I verify that the title is \\\"([^\\\"]*)\\\"$\")\n    public void\
  \ i_verify_that_the_title_is(String arg1) throws Throwable\n    {\n        Assert.assertTrue(driver.getTitle().toLowerCase().contains(arg1));\n\
  \    }\n}\n```\n\n# 10. 将数据表格传递给步骤\n\n## 10.1 [键值对数据表格](http://www.softpost.org/cucumber/passing-data-table-with-key-and-values-to-cucumber-steps/)\n\
  \n我们可以像下面的示例所示，传递带有键和值的数据表格。\n\n```gherkin\nFeature: Simple Datatable feature\n\n\
  \  Scenario: Test web title\n    Given I am on home page of xyz site\n    And I\
  \ submit the form with below details\n      |name     | sagar  |\n      |id    \
  \   | 98989  |\n      |address  | mumbai |\n    Then I see that form submission\
  \ is successful\n```\n\n以下是上述场景的步骤定义类。请注意我们是如何将数据表格转换为 map 并访问其键和值的。\n\n```java\n\
  package org.softpost;\n\nimport cucumber.api.DataTable;\nimport cucumber.api.java.en.Given;\n\
  import cucumber.api.java.en.Then;\nimport java.util.List;\nimport java.util.Map;\n\
  \n/**\n * Created by Sagar on 13-07-2016.\n */\npublic class DatatableSteps\n{\n\
  \    @Given(\"^I am on home page of xyz site$\")\n    public void i_am_on_home_page_of_xyz_site()\
  \ throws Throwable\n    {\n        System.out.println(\"Navigate to home page \\\
  n\");\n    }\n\n    @Given(\"^I submit the form with below details$\")\n    public\
  \ void i_submit_the_form_with_below_details(DataTable arg1) throws Throwable\n \
  \   {\n        Map<String,String> m = arg1.asMap(String.class,String.class);\n \
  \       System.out.println(\"\\nFilling form with below data\\n\");\n        for(\
  \ String k : m.keySet())\n        {\n            System.out.println(\"Key -> \"\
  \ + k + \" Value -> \" + m.get(k));\n        }\n    }\n\n    @Then(\"^I see that\
  \ form submission is successful$\")\n    public void i_see_that_form_submission_is_successful()\
  \ throws Throwable\n    {\n        System.out.println(\"\\nVerify form success message\"\
  );\n    }\n}\n```\n\n这是上述 feature 文件的执行输出。\n\n```\nNavigate to home page\nFilling\
  \ form with below data\nKey -> name Value -> sagar\nKey -> id Value -> 98989\nKey\
  \ -> address Value -> mumbai\nVerify form success message\n1 Scenarios (1 passed)\n\
  3 Steps (3 passed)\n0m0.525s\n```\n\n## 10.2 [Cucumber 中的多列数据表格](http://www.softpost.org/cucumber/multiple-column-datatable-in-cucumber/)\n\
  \n现在让我们来看看如何在 Cucumber 中传递具有多个列的数据表格。\n\n```gherkin\nFeature: Multiple column data\
  \ table\n\n  Scenario: Create new student records\n    Given We have below list\
  \ of students\n      | name  | id    | address |\n      | sagar | 288345 | Brisbane\
  \ |\n      | watson| 38829 | London  |\n      | paul  | 34223 | Chicago  |\n```\n\
  \n现在看下面的 `Student` 类。该类与数据表格进行了映射。\n\n```java\npackage org.softpost;\n/**\n * Created\
  \ by Sagar on 13-07-2016.\n */\npublic class Student\n{\n    private String name;\n\
  \    private String address;\n    private int id;\n    public Student(String name,\
  \ int id, String address)\n    {\n        this.name = name;\n        this.id = id;\n\
  \        this.address = address;\n    }\n    public void printStudent()\n    {\n\
  \        System.out.println(\"\\nStudent -> \" + name + \", \" + id + \", \" + address);\n\
  \    }\n}\n```\n\n现在看步骤定义类。注意我们是如何将数据表格转换为对象列表的。\n\n```java\npackage org.softpost;\n\
  \nimport cucumber.api.DataTable;\nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\
  import java.util.List;\nimport java.util.Map;\n\n/**\n * Created by Sagar on 13-07-2016.\n\
  \ */\npublic class DatatableSteps\n{\n    @Given(\"^We have below list of students$\"\
  )\n    public void we_have_below_list_of_students(DataTable arg1) throws Throwable\n\
  \    {\n        List<Student> students = arg1.asList(Student.class);\n        for(Student\
  \ s : students)\n        {\n            s.printStudent();\n        }\n    }\n}\n\
  ```\n\n这是上述代码的输出。\n\n```\nTesting started at 19:48 ...\nStudent -> sagar, 288345,\
  \ Brisbane\nStudent -> watson, 38829, London\nStudent -> paul, 34223, Chicago\n\
  1 Scenarios (1 passed)\n1 Steps (1 passed)\n0m0.635s\n```\n\n# 11. Feature 文件的变体\n\
  \n## 11.1 [场景背景 (Background)](http://www.softpost.org/cucumber/scenario-background-in-cucumber/)\n\
  \n有时，我们需要在每个场景之前执行某些步骤。`Background` 允许在多个场景中复用相同的步骤。在在一个 feature 文件中，`Background`\
  \ 中的步骤会在每个场景之前执行。\n\n```gherkin\nFeature: Simple background\n\n  Background:\n \
  \   Given I filter some records\n\n  Scenario: Delete functionality\n    Given I\
  \ click on the delete button of the first record\n    Then I verify that record\
  \ is removed from the table\n\n  Scenario: Update functionality\n    Given I click\
  \ on update button of the first record\n    Then I verify that record opens in new\
  \ window and we can modify it\n```\n\n这是步骤定义类。\n\n```java\npackage org.softpost;\n\
  \nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\n/**\n\
  \ * Created by Sagar on 13-07-2016.\n */\npublic class backgroundsteps\n{\n    @Given(\"\
  ^I filter some records$\")\n    public void i_filter_some_records() throws Throwable\n\
  \    {\n        System.out.println(\"\\n\\nBackground - Filtering some records\\\
  n\");\n    }\n\n    @Given(\"^I click on the delete button of the first record$\"\
  )\n    public void i_click_on_the_delete_button_of_the_first_record() throws Throwable\n\
  \    {\n        System.out.println(\"Click delete button\\n\");\n    }\n\n    @Then(\"\
  ^I verify that record is removed from the table$\")\n    public void i_verify_that_record_is_removed_from_the_table()\
  \ throws Throwable\n    {\n        System.out.println(\"Verify deleted record\\\
  n\");\n    }\n\n    @Given(\"^I click on update button of the first record$\")\n\
  \    public void i_click_on_update_button_of_the_first_record() throws Throwable\n\
  \    {\n        System.out.println(\"Click update button\\n\");\n    }\n\n    @Then(\"\
  ^I verify that record opens in new window and we can modify it$\")\n    public void\
  \ i_verify_that_record_opens_in_new_window_and_we_can_modify_it() throws Throwable\n\
  \    {\n        System.out.println(\"Verify modified record\\n\");\n    }\n}\n```\n\
  \n这是上述 feature 文件的执行输出。\n\n```\nBackground - Filtering some records\nClick delete\
  \ button\nVerify deleted record\nBackground - Filtering some records\nClick update\
  \ button\nVerify modified record\n2 Scenarios (2 passed)\n6 Steps (6 passed)\n0m0.578s\n\
  ```\n\n## 11.2 [场景概要 (Scenario outline)](http://www.softpost.org/cucumber/scenario-outline-in-cucumber/)\n\
  \n有时，我们需要使用不同的测试数据执行相同的场景。在这种情况下，我们可以使用名为 scenario outline 的概念。在下面的示例中，相同的场景将执行两次。第一次使用\
  \ 99 和 100。第二次使用 11 和 200。\n\n```gherkin\nFeature: Outline feature\n\n  Scenario\
  \ Outline: Addition of numbers\n    When I add integers <i1> and <i2>\n\n    Examples:\n\
  \      | 99 | 100 |\n      | 11 | 200 |\n```\n\n\n\n\n然后我看到的结果为 `<sum>`\n\n示例：\n\
  \n| i1 | i2 | sum |\n| 99 | 100 | 199 |\n| 11 | 200 | 211 |\n\n这里是步骤定义类。\n\n```java\n\
  package org.softpost;\n\nimport cucumber.api.java.en.Then;\nimport cucumber.api.java.en.When;\n\
  import junit.framework.Assert;\n\n/**\n * 由 Sagar 于 2016-07-13 创建。\n */\npublic\
  \ class outlinesteps\n{\n int result = 0;\n\n    @@When(\"^I add integers (\\\\\
  d+) and (\\\\d+)$\")\n    public void i_add_integers_and(int arg1, int arg2) throws\
  \ Throwable\n    {\n      result = arg1 + arg2;\n      System.out.println(\"Adding\
  \ \" + arg1 + \" and \" + arg2 + \"\\n\\n\");\n    }\n\n    @Then(\"^I see the result\
  \ as (\\\\d+)$\")\n    public void i_see_the_result_as(int arg1) throws Throwable\n\
  \    {\n      Assert.assertEquals(result,arg1);\n    }\n}\n```\n\n这里是上述 feature\
  \ 文件的执行输出。\n\n测试开始于 19:18 ...\nAdding 99 and 100\nAdding 11 and 200\n2 Scenarios\
  \ (2 passed)\n4 Steps (4 passed)\n0m0.595s\n\n# 12. [在 Cucumber 中中运行多个 feature 文件](http://www.softpost.org/cucumber/how-to-run-multiple-feature-files-in-cucumber/)\n\
  \n我们可以像下面的示例所示，在多个 feature 文件中执行场景。我们正在运行 2 个 feature 文件 - `multicolumn` 和 `outline`。请注意，要执行所有\
  \ feature 文件，我们也可以使用 `*` 运算符。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
  import cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
  @CucumberOptions(\n      features = {\"classpath:multicolumn.feature\",\"classpath:outline.feature\"\
  },\n      glue = \"classpath:org.softpost\",\n      plugin = \"html:target/selenium-reports\"\
  \n)\npublic class MultipleFeatureTest\n{\n}\n```\n\n这里是执行上述测试类后生成的 HTML 报告。\n\n\
  ![Multiple feature files in Cucumber](http://www.softpost.org/wp-content/uploads/2016/07/Multiple-feature-files-in-Cucumber.png)\n\
  \nCucumber 中的多个 feature 文件\n\n# 13. [使用 PicoContainer 共享 selenium Webdriver 实例](http://www.softpost.org/cucumber/sharing-selenium-webdriver-instance-using-picocontainer/)\n\
  \n在 Selenium 自动化中，我们创建了一个 `WebDriver` 实例。但我们无法在 Cucumber 的不同步骤定义类中使用同一个驱动实例。\n\n\
  我们可以通过 2 种共享同一个 Webdriver 实例：\n\n1. 通过创建一个静态的 `Webdriver`\n2. 使用 `PicoContainer`（依赖注入）\n\
  \n第一种非常简单。只需创建一个带有 `Static WebDriver` 字段的类即可。\n\n现在让我们来看看如何使用依赖注入来共享同一个驱动。为此，您将需要下面的依赖。\n\
  \n```xml\n<dependency>\n  <groupId>org.seleniumhq.selenium</groupId>\n  <artifactId>selenium-java</artifactId>\n\
  \  <version>2.42.2</version>\n</dependency>\n<dependency>\n  <groupId>info.cukes</groupId>\n\
  \  <artifactId>cucumber-picocontainer</artifactId>\n  <version>1.2.4</version>\n\
  \  <scope>test</scope>\n</dependency>\n```\n\n接下来，我们需要创建一个类，在其中像下面的示例所示创建一个 `Webdriver`\
  \ 实例。请注意，我们只实例化一次驱动。我们有一个方法 `getDriver` 来获取驱动。\n\n```java\npackage org.softpost;\n\
  \nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport org.openqa.selenium.WebDriver;\n\
  import org.openqa.selenium.firefox.FirefoxDriver;\n\npublic class SharedClass\n\
  {\n private static boolean startBrowser = false;\n private WebDriver driver;\n\n\
  \ public String title = \"\";\n\n    @Before(\"@sharedselenium\")\n    public void\
  \ init() throws Exception\n    {\n      if (!startBrowser)\n      {\n         driver\
  \ = new FirefoxDriver();\n         // 如果要在每个场景后停止浏览器，将下面的变量赋值为 true\n         startBrowser\
  \ = false;\n      }\n    }\n\n    public WebDriver getDriver()\n    {\n      return\
  \ driver;\n    }\n\n    @After(\"@sharedselenium\")\n    public void cleanUp()\n\
  \    {\n      driver.close();\n      driver.quit();\n    }\n}\n```\n\n接下来在步骤定义类中，我们可以像下面的示例所示传递上述类的实例。请注意，我们正在使用\
  \ `getDriver()` 方法来访问驱动实例。因此，同样可以将 `SharedClass` 的实例传递给任何想要使用驱动的步骤定义类。`PicoContainer`\
  \ 在内部被用于连接依赖类。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.java.en.Given;\n\
  import cucumber.api.java.en.Then;\nimport junit.framework.Assert;\n\npublic class\
  \ ShareSelenium\n{\n SharedClass sharedClass;\n\n public ShareSelenium(SharedClass\
  \ sharedClass)\n{\n    this.sharedClass = sharedClass; }\n\n    @Given(\"^I am on\
  \ the www\\\\.softpost\\\\.org home page$\")\n    public void i_am_on_the_www_softpost_org_home_page()\
  \ throws Throwable\n    {\n      sharedClass.getDriver().get(\"http://www.softpost.org\"\
  );\n    }\n\n    @Then(\"^I verify that title contains tutorials$\")\n    public\
  \ void i_verify_that_title_contains_tutorials() throws Throwable\n    {\n      Assert.assertTrue(sharedClass.getDriver().getTitle().contains(\"\
  tutorials\"));\n    }\n}\n```\n\n# 14. Cucumber 中的报告\n\n## 14.1 [嵌入截图](http://www.softpost.org/taking-screenshot-and-embed-in-the)\n\
  \n在处理 selenium 项目时，我们经常需要在失败时截图。Selenium 提供通过 `takesScreenshot` 接口截图的方法。\n\nCucumber\
  \ 允许将其嵌入报告中。\n\n这里是简单的代码：\n\n```java\n@After(\"@selenium\")\npublic void killBrowser(Scenario\
  \ scenario)\n{\n  if (scenario.isFailed())\n  {\n    scenario.embed(((TakesScreenshot)driver).getScreenshot(OutputType.BYTES),\
  \ \"image/png\");\n  }\n  driver.close();\n  driver.quit();\n}\n```\n\n下面的图片显示了在\
  \ Maven 中查找 HTML 报告的位置。\n\n![Cucumber report in Maven](http://www.softpost.org/wp-content/uploads/2016/07/Cucumber-report-location-in-Maven.png)\n\
  \nMaven 项目中的 Cucumber 报告\n\n这里是显示捕捉截图的示例 HTML 报告。\n\n![Embeding the screenshot](http://www.softpost.org/wp-content/uploads/2016/07/Embeding-the-screenshot-in-report.png)\n\
  \n在报告中嵌入截图\n\n## 14.2 [写入 Cucumber HTML 报告](http://www.softpost.org/writing-to-cucumber-reports/)\n\
  \n我们可以使用 `Scenario` 类的 `write` 方法写入 Cucumber HTML 报告。\n\n下面的步骤定义类说明了如何写入 HTML 报告。注意我们如何将\
  \ scenario 对象传递给 `Before` 方法。\n\n```java\npackage org.softpost;\n\nimport com.google.common.primitives.Bytes;\n\
  import cucumber.api.Scenario;\nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\n\
  import cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\nimport junit.framework.Assert;\n\
  import org.openqa.selenium.OutputType;\nimport org.openqa.selenium.TakesScreenshot;\n\
  import org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.firefox.FirefoxDriver;\n\
  \n/**\n * 由 Sagar 于 2016-07-12 创建。\n */\n@SuppressWarnings(\"ALL\")\npublic class\
  \ seleniumsteps\n{\n    WebDriver driver;\n    Scenario scenario;\n\n    @Before(\"\
  @selenium\")\n    public void launchBrowser(Scenario scenario)\n    {\n      driver\
  \ = new FirefoxDriver();\n      this.scenario = scenario;\n    }\n\n    @Given(\"\
  ^I am on the www\\\\.softpost\\\\.org home page$\")\n    public void i_am_on_the_www_softpost_org_home_page()\
  \ throws Throwable\n    {\n      driver.get(\"http://www.softpost.org\");\n    \
  \  scenario.write(\"Navigated to www.softpost.org\");\n    }\n\n    @Then(\"^I verify\
  \ that title contains tutorials$\")\n    public void i_verify_that_title_contains_tutorials()\
  \ throws Throwable\n    {\n      Assert.assertTrue(driver.getTitle().contains(\"\
  tutorials\"));\n    }\n}\n```\n\n\n\n\n```java\nAssert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
  tutorials\"));\n\n}\n\n@Then(\"^I verify that title contains tutooorials$\")\npublic\
  \ void i_verify_that_title_contains_tutooorials() throws Throwable {\n    Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
  tutooorials\"));\n}\n\n@After(\"@selenium\")\npublic void killBrowser() {\n    scenario.write(\"\
  Finished scenario\");\n    if (scenario.isFailed()) {\n        scenario.embed(((TakesScreenshot)driver).getScreenshotAs(OutputType.BYTES),\
  \ \"image/png\");\n    }\n    driver.close();\n    driver.quit();\n}\n```\n\n这是一份示例\
  \ HTML 报告。\n\n![写入 cucumber HTML 报告](http://www.softpost.org/wp-content/uploads/2016/07/Writing-to-cucumber-HTML-report.png)\n\
  \n写入 `cucumber` HTML 报告\n\n# 15. 使用 Lambda 表达式的 Cucumber\n\n## 15.1 [在 Java 8 中使用\
  \ Lambda 表达式的 Cucumber 依赖](http://www.softpost.org/cucumber/cucumber-dependency-lambda-expressions-java-8/)\n\
  \nJava 8 引入了 Lambda 表达式。Cucumber 允许你使用 Lambda 表达式编写步骤定义。\n\n要使用 Lambda 表达式编写测试，你需要添加以下依赖。\n\
  \n```xml\n<dependency>\n <groupId>info.cukes</groupId>\n <artifactId>cucumber-java8</artifactId>\n\
  \ <version>1.2.4</version>\n <scope>test</scope>\n</dependency>\n```\n\n确保 JDK 版本为\
  \ `1.8.0_51`。否则，你将获得以下错误：\n\n`Exception in thread \"main\" cucumber.runtime.CucumberException:\
  \ Failed to instantiate class  .......CucumberException: java.lang.IllegalArgumentException:\
  \ Wrong type at constant pool index`\n\n## 15.2 [使用 Lambda 表达式的 Cucumber 测试](http://www.softpost.org/cucumber/cucumber-test-using-lambda-expressions/)\n\
  \n现在让我们使用 Lambda 表达式编写示例的 Cucumber 步骤定义。\n\n这是一个示例特性文件（feature file）。\n\n```gherkin\n\
  Feature: Lambda feature\n  Scenario: Verify sum\n    Given I add 1 and 2\n    Then\
  \ I verify that sum is 3\n```\n\n这是一个使用 Lambda 表达式编写步骤定义的示例测试类。注意，`StepClass` 必须实现\
  \ `cucmber.api.java8.En` 接口，且 `step` 方法应该位于测试类的构造函数中。你还需要确保 Java 语言级别应为 `1.8`。\n\
  \n```java\npackage org.softpost;\n\nimport cucumber.api.java8.En;\n\npublic class\
  \ StepClass8 implements En {\n    public StepClass8() {\n        Given(\"^I add\
  \ 1 and 2$\", () -> {\n            System.out.println(\"Adding 1 and 2\");\n   \
  \     });\n        Then(\"^I verify that sum is 3$\", () -> {\n            System.out.println(\"\
  Checking that sum is 3\");\n        });\n    }\n}\n```\n\n如果你使用 Maven，可以在 POM.XML\
  \ 中的以下 XML 部分中指定 Java 语言级别：\n\n```xml\n<build>\n <plugins>\n  <plugin>\n     <groupId>org.apache.maven.plugins</groupId>\n\
  \     <artifactId>maven-compiler-plugin</artifactId>\n     <version>2.3.2</version>\n\
  \     <configuration>\n      <source>1.8</source>\n      <target>1.8</target>\n\
  \      <encoding>UTF-8</encoding>\n     </configuration>\n  </plugin>\n </plugins>\n\
  </build>\n```\n\n"
