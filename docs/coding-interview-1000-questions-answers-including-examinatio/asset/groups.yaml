- md: "\n![](img/ca3bec18bbcfb090bd9ad25a6bf7e80a_0_0.png)\n\n# Coding Interview\n\
    # 1000 Questions & Answers\n\nRay Yao\n\n# Preface\n\n“Coding Interview: 1000\
    \ Questions & Answers” can help you:\n\n- Pass the college final examination,\n\
    - Pass the job interview examination,\n- Pass the engineer certification examination,\n\
    - Pass various programming language examinations.\n\nThis book includes 1000 Questions\
    \ & Answers in C#, C++, HTML, CSS, JQuery, JavaScript, JAVA, Linux, PHP, MySQL,\
    \ Python, Visual Basic. You can test your skill and level to deal with various\
    \ examinations in the future.\n\n# 1000 Answers for Download:\n\nThe download\
    \ link is on the last page of the book.\n\n# “In 8 Hours” eBooks & Books on Amazon\n\
    \n- Advanced C++ in 8 Hours\n- Advanced Java in 8 Hours\n- AngularJs in 8 Hours\n\
    - C# in 8 Hours\n- C# Q & A\n- C++ in 8 Hours\n- C++ Q & A\n- Django in 8 Hours\n\
    - Go in 8 Hours\n- Html Css in 8 Hours\n- Html Css Q & A\n- Java in 8 Hours\n\
    - Java Q & A\n- JavaScript in 8 Hours\n- JavaScript Q & A\n- JQuery in 8 Hours\n\
    - JQuery Q & A\n- Kotlin in 8 Hours\n- Linux Command Line\n- Linux Q & A\n- MysSql\
    \ in 8 Hours\n- Node.js in 8 Hours\n- Php MySql in 8 Hours\n- Php Q & A\n- PowerShell\
    \ in 8 Hours\n- Python in 8 Hours\n- Python Q & A\n- R in 8 Hours\n- Ruby in 8\
    \ Hours\n- Rust in 8 Hours\n- Scala in 8 Hours\n- Shell Scripting in 8 Hours\n\
    - Swift in 8 Hours\n- Visual Basic in 8 Hours\n- Visual Basic Q & A\n- Xml Json\
    \ in 8 Hours\n\n# Table of Contents\n\n## Preparing Interview (Optional)\n\n-\
    \ Seek for Interview\n- Tips for Interview\n- Practice Interview\n- How to Interview\n\
    - Questions in Interview\n- Vocularies of Interview\n\n## C# 100 Questions & Answers\n\
    \n- 100 C# Questions\n- 100 C# Answers\n\n## C++ 100 Questions & Answers\n\n-\
    \ 100 C++ Questions\n- 100 C++ Answers\n\n## HTML CSS 100 Questions & Answers\n\
    \n- 100 HTML CSS Questions\n- 100 HTML CSS Answers\n\n## JQuery 100 Questions\
    \ & Answers\n\n- 100 JQuery Questions\n- 100 JQuery Answers\n\n## JavaScript 100\
    \ Questions & Answers\n\n- 100 JavaScript Questions\n- 100 JavaScript Answers\n\
    \n## JAVA 100 Questions & Answers\n\n- 100 JAVA Questions\n- 100 JAVA Answers\n\
    \n## Linux 100 Questions & Answers\n\n- 100 Linux Questions\n- 100 Linux Answers\n\
    \n## PHP MySQL 100 Questions & Answers\n\n- 100 PHP MYSQL Questions\n- 100 PHP\
    \ MySQL Answers\n\n## Python 100 Questions & Answers\n\n- 100 Python Questions\n\
    - 100 Python Answers\n\n## Visual Basic 100 Questions & Answers\n\n- 100 Visual\
    \ Basic Questions\n- 100 Visual Basic Answers\n\n# 1000 Answers for Download\n\
    \n# Preparing Interview\n\n# (Optional)\n\n## Seek for Interview\n\n### Finding\
    \ Job Openings\n\n- A. Read the classified ads\n- B. Develop a network of friends,\
    \ relatives, former employers...\n- C. Check postings on the Internet\n- D. Check\
    \ with employment agencies (note fee)\n- E. Set up informational interviews\n\
    - F. Do temporary or part-time work\n\n### Applying For A Job\n\n- A. Preparing\
    \ in advance\n  1. Develop \"I am...\" and \"I can...\" lists\n  2. Create a strong\
    \ resume to market yourself\n  3. Prepare a professional reference list\n\n- B.\
    \ Applying by Application\n  1. Go prepared with generic application, copies of\
    \ resume and 2 pens\n  2. Always print all information\n  3. Always leave a copy\
    \ of your resume with your application\n  4. Record each application on your Job\
    \ Search Log\n\n- C. Applying by letter (cover letter)\n  1. Send your letter\
    \ to the person doing the hiring, not to \"Dear Sir\"\n  2. Identify the job you\
    \ are applying for and how you found out about it\n  3. Highlight your 3 or 4\
    \ strongest qualifications for that position\n  4. Always make a hard copy for\
    \ your files\n  5. Include a cover letter with every resume you send\n  6. Record\
    \ each letter sent on your Job Search Activity Log\n  7. Make a follow-up interview\
    \ request call at the appropriate time\n\n- D. Applying by telephone\n  1. Have\
    \ a resume handy\n  2. Have a pen and paper ready for note taking\n  3. Try to\
    \ talk to the person who will do the hiring\n  4. Identify the job you are calling\
    \ about and how you found out about it\n  5. Briefly state your qualifications\
    \ and request an interview\n  6. Take notes on the interview time and date, interviewer's\
    \ name, directions, etc.\n  7. Record each call in your Job Search Log\n\n###\
    \ Interviewing For Job\n\n- A. Preparing in advance\n  1. Bring necessary materials\n\
    \  2. Several copies of resume\n  3. Several copies of list\n\n- B. Applying by\
    \ Application\n  1. Arrive 15 minutes early\n  2. Wear appropriate clothing\n\n\
    - C. Arrive\n  1. Greet the receptionist\n  2. Introduce yourself\n\n- D. During\
    \ the interview\n  1. Anticipate questions you are likely asked\n  2. Practice\
    \ your answers\n  3. Give examples of past jobs\n\n- E. At the end of the interview\n\
    \  1. Thank the interviewer\n  2. Ask when decision will made\n\n- F. After the\
    \ interview\n  1. Send a thank-you letter immediately\n  2. Make follow-up call\
    \ if the employer hasn't called you a week after\n  3. Record on Job Search Log\n\
    \n## Tips for Interview\n\n- 1. It is important to listen well to what the interviewer\
    \ is saying\n- 2. Good eye contact shows the interviewer that you are interested\n\
    - 3. You should always send a thank-you letter showing appreciative of their time\n\
    - 4. You should always show confidence\n- 5. You should always carry a pen in\
    \ case you need to fill out an application\n- 6. To prove you have the skills,\
    \ you should relate your experience to the responsibilities of the job\n- 7. Even\
    \ if you have to say no to one of the questions, you should always find a way\
    \ to end on a positive note\n- 8. You should always smile at the interviewer to\
    \ show you are happy to be there\n\n## Practice Interview\n\nJust making a statement\
    \ about your skills and strengths is not enough. You need to re-state what you\
    \ say so that the employers know you truly know the terms that you are using.\
    \ Please match the statement on the left with how it can be restated in the right.\n\
    \n| Statement | Restatement |\n| :--- | :--- |\n| 1. I am reliable | A. I learn\
    \ new programs very fast. |\n| 2. I am a quick learner | B. I am always looking\
    \ more to do without my supervisor having to encourage me. |\n| 3. I am flexible\
    \ | C. I always come to work. |\n| 4. I am very honest | D. I can be flexible\
    \ with my hours. |\n| 5. I am a team player | E. I tell the truth and can be trusted.\
    \ |\n| 6. I am enthusiastic | F. I really enjoy my work and bring a lot of energy\
    \ to it. |\n| 7. I am self-motivated | G. I enjoy helping my colleagues whenever\
    \ I can. |\n"
  mdcn: "\n\n![](img/ca3bec18bbcfb090bd9ad25a6bf7e80a_0_0.png)\n\n# 编程面试\n# 1000道题与答\n\
    \nRay Yao\n\n# 前言\n\n“编程面试：1000道题与答”可以帮助你：\n\n- 通过大学期末考试，\n- 通过工作面试，\n- 通过工程师认证考试，\n\
    - 通过各种编程语言考试。\n\n本书包含了 C#、C++、HTML、CSS、JQuery、JavaScript、JAVA、Linux、PHP、MySQL、Python、Visual\
    \ Basic 的1000道题与答。你可以测试自己的技能和水平，以应对未来的各种考试。\n\n# 1000答案下载：\n\n下载链接位于书籍最后一页。\n\n\
    # 亚马逊上的“8 小时”系列电子书与书籍\n\n- 8 小时精通 C++\n- 8 小时高级 Java\n- 8 小时 AngularJs\n- 8 小时\
    \ C#\n- C# 问答\n- 8 小时 C++\n- C++ 问答\n- 8 小时 Django\n- 8 小时 Go\n- 8 小时 Html Css\n\
    - Html Css 问答\n- 8 小时 Java\n- Java 问答\n- 8 小时 JavaScript\n- JavaScript 问答\n- 8\
    \ 小时 JQuery\n- JQuery 问答\n- 8 小时 Kotlin\n- Linux 命令行\n- Linux 问答\n- 8 小时 MysSql\n\
    - 8 小时 Node.js\n- 8 小时 Php MySql\n- Php 问答\n- 8 小时 PowerShell\n- 8 小时 Python\n\
    - Python 问答\n- 8 小时 R\n- 8 小时 Ruby\n- 8 小时 Rust\n- 8 小时 Scala\n- 8 小时 Shell 脚本\n\
    - 8 小时 Swift\n- 8 小时 Visual Basic\n- Visual Basic 问答\n- 8 小时 Xml Json\n\n# 目录\n\
    \n## 准备面试（可选）\n\n- 寻找面试机会\n- 面试技巧\n- 模拟面试\n- 如何面试\n- 面试中的问题\n- 面试词汇\n\n## C# 100道题与答\n\
    \n- 100 道 C# 问题\n- 100 道 C# 答案\n\n## C++ 100道题与答\n\n- 100 道 C++ 问题\n- 100 道 C++\
    \ 答案\n\n## HTML CSS 100道题与答\n\n- 100 道 HTML CSS 问题\n- 100 道 HTML CSS 答案\n\n##\
    \ JQuery 100道题与答\n\n- 100 道 JQuery 问题\n- 100 道 JQuery 答案\n\n## JavaScript 100道题与答\n\
    \n- 100 道 JavaScript 问题\n- 100 道 JavaScript 答案\n\n## JAVA 100道题与答\n\n- 100 道 JAVA\
    \ 问题\n- 100 道 JAVA 答案\n\n## Linux 100道题与答\n\n- 100 道 Linux 问题\n- 100 道 Linux 答案\n\
    \n## PHP MySQL 100道题与答\n\n- 100 道 PHP MYSQL 问题\n- 100 道 PHP MySQL 答案\n\n## Python\
    \ 100道题与答\n\n- 100 道 Python 问题\n- 100 道 Python 答案\n\n## Visual Basic 100道题与答\n\
    \n- 100 道 Visual Basic 问题\n- 100 道 Visual Basic 答案\n\n# 1000答案下载\n\n# 准备面试\n\n\
    # （可选）\n\n## 寻找面试机会\n\n### 寻找职位空\n\n- A. 阅读分类广告\n- B. 建立朋友、亲戚、前雇主的人脉……\n- C. 检查互联网上的招聘\n\
    - D. 咨询职业介绍（注意费用）\n- E. 进行信息性面试\n- F. 做临时或兼职工作\n\n### 申请工作\n\n- A. 提前准备\n  1.\
    \ 列出“我是……”和“我能……”列表\n  2. 创建一份出色的简历来推销自己\n  3. 准备一份专业的推荐人列表\n\n- B. 通过申请申请\n \
    \ 1. 准备好通用申请表、简历复印件和两支笔\n  2. 始终打印所有信息\n  3. 申请时务必附上一份简历副本\n  4. 在你的求职日志上记录每一次申请\n\
    \n- C. 通过信函（求职信）申请\n  1. 将信寄给招聘人员，而不是写给“尊敬的先生女士”\n  2. 明确你要申请的职位以及是如何获知的\n  3.\
    \ 突出你针对该职位最强的3或4项资历\n  4. 始终为你的档案留一份纸质版\n  5. 出的每份简历都附上求职信\n  6. 在你的求职活动日志上记录每一封出的信\n\
    \  7. 在合适的时间致电跟进面试\n\n- D. 通过电话申请\n  1. 随手准备好简历\n  2. 准备好笔和纸记录笔记\n  3. 尝试与负责招聘的人交谈\n\
    \  4. 明确你打电话的职位以及是如何获知的\n  5. 简述你的资历并请求面试\n  6. 记录面试的时间日期、面试官姓名、路线等\n  7. 在你的求职日志上记录每一次通话\n\
    \n### 参加工作面试\n\n- A. 提前准备\n  1. 携带必要的材料\n  2. 几份简历\n  3. 几份清单\n\n- B. 通过申请申请\n\
    \  1. 提前15分钟到达\n  2. 穿着得体的服装\n\n- C. 到达\n  1. 问候接待员\n  2. 介绍自己\n\n- D. 面试期间\n\
    \  1. 预测可能被问的问题\n  2. 练习你的答案\n  3. 提供案例\n\n- E. 面试结束时\n  1. 感谢面试官\n  2. 询问何时会有结果\n\
    \n- F. 面试后\n  1. 立即发送感谢信\n  2. 如果一周后主未联系你，致电跟进\n  3. 记录在求职日志上\n\n## 面试技巧\n\n-\
    \ 1. 听好面试官的话很重要\n- 2. 良好的眼神交流让面试官看到你感兴趣\n- 3. 你应该写一封感谢时间的信\n- 4. 你应该表现出自信\n- 5.\
    \ 你应该随身带一支笔，以备填写申请表\n- 6. 为了证明你拥有技能，你应该将你的经验与职责联系起来\n- 7. 即使对某个问题回答否定，你也应该设法以积极的方式结束\n\
    - 8. 你应该对面试官微笑，表现你很高兴在这里\n\n## 模拟面试\n\n仅仅陈述你的技能和优势是不够的。你需要重新表述你说的话，让雇主知道你理解所使用的术语。请将左侧的陈述与右侧的重述进行匹配。\n\
    \n| 陈述 | 重述 |\n| :--- | :--- |\n| 1. 我很可靠 | A. 我学习新程序非常快。 |\n| 2. 我学习很快 | B. 我不需要主管鼓励就会主动寻找更多要做的事。\
    \ |\n| 3. 我很灵活 | C. 我总是准时上班。 |\n| 4. 我非常诚实 | D. 我可以灵活安排时间。 |\n| 5. 我是一个团队合作者 |\
    \ E. 我说实话，值得信赖。 |\n| 6. 我充满热情 | F. 我非常热爱我的工作，并投入了大量精力。 |\n| 7. 我很有主动性 | G. 我随时乐意帮助同事。\
    \ |\n\n"
