  mdcn: "\n\n## 如何面试\n\n- 提早到达以证明你准时\n- 随身携带面试文件夹、简历、问题列表和笔显示了你的专业素养\n- 微微笑问候面试官，握有有力的手，并保持良好的眼神交流\n\
    - 说话礼貌，行为自然。\n- 在面试官谈论工作和业务时仔细倾听，并做笔记\n- 使用案例向面试官证明你具备所需的经验和技能。\n- 务必告诉面试官你是一个充满热情、有动力、灵活、注重细节、可靠且态度良好的团队合作者。\n\
    - 确保你的肢体语言能向面试官展示你充满热情并对自己自信。\n- 面试结束时，感谢面试官提供讨论工作的机会，并通过表达你想获得这份工作来以积极的姿态结束面试\n\
    - 面试后，务必立即发送感谢信，并在必要时进行跟进电话\n\n## 面试问题\n\n- 请介绍一下你自己，好吗？\n- 与其他人相比，你能为我们做些什么？\n\
    - 为什么我们应该聘佣你做这份工作？\n- 你的优点是什么？\n- 你的缺点是什么？\n- 你在我们公司想寻找什么样的职位？\n- 你为什么想在这家公司工作？\n\
    - 五年后你希望处于什么位置？\n- 你如何与他人相处？\n- 你对上一份工作的老板怎么看？\n- 你对薪水的预期是多少？\n- 你能在压力下工作吗？\n\
    - 在这个领域有多长的经验？\n- 你为什么认为自己胜任这个职位？\n- 为什么你认为自己值 $xxxx？\n- 为什么你不希望我们联系你现在的雇主？\n\
    - 你有什么问题吗？\n- 你的优势是什么？\n- 你的短板是什么？\n\n## 面试词汇\n\n1. 如果面试官告诉你你将获得医疗保险和带薪病假/年假，你就知道该职位将提供*福利*(benefits)*。\n\
    2. 如果你与人相处良好并且总是乐于帮助同事，你可能想举过去工作中作为*团队成员*(team-player)*的例子。\n3. 如果你能够按照重要性顺序完成许多任务，请务必告诉面试官你具备*优先排序*(prioritize)*的能力。\n\
    4. 如果你能够激励自己寻找更多要做的任务，你可能想传达你是如何*有动力*(motivated)*。\n5. 如果该职位有多个时间段（早晨/白天/晚上……），那么它可能是轮班制。\n\
    6. 如果你能与孩子相处，从不对他们发火，并始终给他们时间和理解，你可能想告诉雇主你有多有耐心。\n7. 如果你学习很快，你可能想告诉面试官你是一个快速学习者。\n\
    8. 如果你学会了某些功能，你可以告诉雇主你所拥有的技能，这些技能将使你轻松完成工作。\n9. 如果公司有一个职位可以引导你进入薪水更高、责任更大的职位，那么它就有成长的机会。\n\
    10. 如果你的日程允许，你可能想展示你在工作时间上可以有多灵活。\n11. 如果你言行举止得体，并对自己的工作表现保持严肃的态度，你可以传达出你具有职业素养。\n\
    12. 如果你为工作带来了大量的能量和新想法，你应该告诉面试官你有多有热情。\n13. 如果你准确执行职责且不犯错，你可能想告诉面试官你注重细节。\n14.\
