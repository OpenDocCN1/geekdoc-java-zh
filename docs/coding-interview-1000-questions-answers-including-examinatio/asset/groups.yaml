- md: "\n## How to Interview\n\n- Arrive early to prove that you are punctual\n- Coming\
    \ with an interview folder, resume, list of questions, and a pen shows your professional\n\
    - Greet the interviewer with a smile, a firm handshake and make good eye contact\n\
