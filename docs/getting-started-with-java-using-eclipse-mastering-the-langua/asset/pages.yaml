  md: '# 9.7 Summary


    Java has four types of classes: concrete classes, abstract classes, interfaces,
    and generic classes (generics). Concrete classes could be called `normal` classes.
    Objects can be derived from this type of class using the keyword `extends`.


    ```

    Class types {

    * Concrete class

    * >Normal< class

    * Local class

    * Inner class

    * Anonymous class

    * Abstract class

    * Interface

    * Generic class }

    ```


    ![](img/99e465aebd900a32605788e9d7d8f845_192_0.png)


    Figure 9.32: Anna summarizes the chapter from her point of view.


    In contrast, we use interfaces and abstract classes for design reasons. Generic
    classes can be `normal` classes or interfaces. They are universal containers for
    all possible types of objects. The great advantage of generic classes is type
    safety. This means that the program can no longer make a mistake when assigning
    the objects, otherwise the program will not be compiled (See 9.8, `Literature`).


    # 9.8 Literature


    Type safety: https://de.wikipedia.org/wiki/Tysicherheit

    Oracle tutorials: https://docs.oracle.com/tutorial/java/java/TOC.HTML

