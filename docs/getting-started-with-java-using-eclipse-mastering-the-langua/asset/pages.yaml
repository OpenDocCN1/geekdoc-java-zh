  md: '# 7.4 Assignment


    # 7.4.1 Java Assignment Structure


    The next step on the way to a working program is to assign a value to a declared
    variable. This type of statement is accordingly called an assignment. Assignments
    have been used implicitly several times in this book without explaining the process.
    The assignment looks like a mathematical equation (Figure 7.6).


    ![](img/99e465aebd900a32605788e9d7d8f845_138_0.png)


    Figure 7.6: General structure of an assignment.


    The equal sign is called assignment operator in Java. It has a comparable effect
    to a method. For the computer, the sign is nothing more than the shorthand notation
    of a function. In this case, this function calls the named *value* to be assigned
    to the memory cell *name*. Hence the name «assignment>.


    # 7.4.2 Java Assignments Are Not Equal to Mathematical Equations


    Java assignments appear simple and therefore tend to cause misunderstandings among
    newcomers to Java programming. On the left side of the assignment are always the
    *variables* parts of the assignment. On the right side of the assignments are
    always the *fixed* parts of the assignment. The direction in which the program
    is processed is therefore exactly the opposite of the western reading direction,
    from right to left (Figure 7.7).


    ![](img/99e465aebd900a32605788e9d7d8f845_138_1.png)


    Figure 7.7: In Java, the assignment operator is an equal sign.'
