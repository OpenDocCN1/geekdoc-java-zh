  md: '# 14.2 Overview


    Conditional statements are used to control the program flow. They therefore belong
    – like loops – to the control flow statements of a program. You can see an example
    of a flow chart with a conditional in figure 14.2. Here, at the beginning, where
    the green diamond is located, it is to be decided whether the person is enrolled
    at a university. The program distinguishes between two cases in this example:
    The person is a student, and the person is not a student. In each case, the program
    should be able to distinguish whether the person is enrolled or not.


    ![](img/99e465aebd900a32605788e9d7d8f845_267_0.png)


    **Figure 14.2:** An example of a flow chart with a conditional statement.


    The example has shown that a programming language must have at least one way of
    making such distinctions in order to control the program flow. Java has adopted
    two constructs from C/C++ with the if and case statements. The if statement allows
    simple distinctions, while the case statement can differentiate between multiple
    states. In the following, you will learn to use both constructs with the help
    of some examples.


