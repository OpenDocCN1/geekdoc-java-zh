  md: '# 20.5 Operating Phase


    # 20.5.1 Deployment


    It would be very impractical to deliver the bytecode to the customer in the form
    of individual files. Instead, one packages the program in a Java archive (JAR)
    or converted into a native program. The customer can run both without a development
    environment. A tool that allows you to package classes into Java archives is also
    included in the JDK and is called JAR. Eclipse provides you with a much more convenient
    tool. You start this Eclipse tool from the File menu using the Export command
    (Figure 20.22).


