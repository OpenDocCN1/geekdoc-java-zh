  md: '# 20 Development Processes


    #  20.1 Introduction


    This chapter highlights the processes involved in the development of Java programs.
    The scope extends from the planning, programming and testing of a new program
    to the delivery of the finished Java software.


    > The Java technology supports the development of programs in a wide variety of
    ways. The Eclipse IDE completes this with other useful tools for the developer.
    With these tools programs can be developed easier, tested, and delivered.


    ![](img/99e465aebd900a32605788e9d7d8f845_336_0.png)


    **Figure 20.1:** Eclipse supports software development through various tools.


    In this chapter, you will learn how to derive classes from requirements, design
    a program, and debug using the Eclipse debugger. The chapter concludes with how
    to package and deliver a program using Eclipse.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# 20.2 Overview


    Development processes are recurring workflows in software development. To get
    a better overview of the different workflows, the overall process is divided into
    related sub-processes. Some companies divide the total process into three, others
    into four sections.


    In order not to go beyond the scope of this book, I would like to limit myself
    to a three-part process, which is sufficiently precise for most projects. The
    overall process consists of the following parts (phases): Planning Phase, Design
    Phase, and Operations Phase (Figure 202).


    ![](img/99e465aebd900a32605788e9d7d8f845_337_0.png)


    Figure 20.2: The phases of software development.


    In the planning phase, the focus is on planning what exactly is to be developed.
    In the design phase, the focus is on developing (programming) the software product.
    And in the operation phase, parts of the product or the finished product are installed
    and then operated. At first glance, the overall process appears to be completely
    straightforward. But this is a fallacy.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# 20.2.1 Correlation Between Phases And Activities


    In an agile approach, phases are divided into sections of two to three weeks –
    the so-called sprints. In each sprint, the activities «Requirements Capture»,
    «Object-Oriented Analysis And Design», «Implementation» and Test run in sequence
    in software development. The complicated overall process becomes clear if you
    take a closer look at the individual phases (20.3).


    | Start of the Development | Milestone End of Rough Planning | Milestone RC1 |
    Milestone GA |

    | --- | --- | --- | --- |

    | | Focus Planning | Focus Construction | Focus Operation |

    | Phase Sprint | 1 2 3 ... n | 1 2 3 ... n | 1 2 ... n |

    | Activities | Activities | Activities |

    | Focus Requirements Capture | Requirements capture, Analysis & Design Implementation,
    Test | Focus Bug Fixing Test |


    **Figure 20.3:** Correlation between phases and activities.


    In the figure, you can see the individual sprints in the middle. They run from
    sprint 1 to n in the planning phase, in the construction phase and in the operation
    phase as well. From left to right, the software product becomes more and more
    complete through the various activities within the sprints (Requirements Capture,
    Analysis & Design, Implementation and Test) until delivery and thus operation
    is reached. Before delivery, the customer is provided with a so-called release
    candidate (RC), after which the software is «generally available» (GA), i.e. available
    as a product.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 20.2.2 Activities


    In each phase, the team engages in a number of different activities:


    +   - Requirements gathering: a team member discusses new requirements with the
    customer.

    - Analysis & Design: An analyst analyzes existing requirements and puts the pieces
    into a meaningful program design.

    - Implementation: Meanwhile, a developer is already programming the software using
    a rough design.

    - Test: Another team member checks whether completed program parts function as
    desired. If the test is successful in the opinion of the team, a team member compiles
    the completed software at the end of each sprint.


    Afterwards one shows the customer in a review at the end of a Sprints already
    finished software. The customer can then accept or reject it (Figure 20.4).


    ![](img/99e465aebd900a32605788e9d7d8f845_339_0.png)


    The processes do not run in a straight line, but rather in a circle, hence the
    way they are represented. All activities must be run x times until the overall
    product is completed. If you follow an agile approach to Java, you first start
    by recording the requirements in a sprint. Then you derive Java classes and them
    into a meaningful program design. Then the actual Java programming and testing
    of the Java program begin. These circular processes continue until the project
    is completed.


    The planning, construction, and operation phases summarize certain activities.
    For example, in the planning phase, a team is mainly engaged in planning (hence
    the name of the phase). This means that the focus of this phase is on requirements
    gathering. However, it may also be the case that Java code is already being written
    in the planning phase, for example to complete a prototype.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'It is the same with the construction phase. Here, the focus is on analyzing
    the requirements, finding Java classes, programming Java code and testing this
    code. It may also be that new requirements are discovered in discussions with
    the customer. Then you have to estimate again how long it will take to incorporate
    these requirements. Afterwards, one converts the changed requirements into Java
    code, then tests the program and presents it to the customer agent.


    # 20.2.3 Tools


    A good developer must not only know and master this complicated overall process.
    He must also select development tools and learn how to use them. The productivity
    of the developer depends on the selection and integration of appropriate tools.
    In addition to agile development process and well-trained developers, good tools
    and class libraries እንደሚ lead to less stress and lower development costs.


    Regarding class libraries, this part of the book comes in chapter 22, «Class Libraries».
    As far as tools are concerned, it is quite sufficient to use the already Eclipse
    now. You should have the Eclipse environment installed so that you can perform
    the exercises in this chapter. see chapter 4, «Development Environment», for a
    description and instructions.


    # 20.3 Planning Phase


    In the planning phase, a contract is created between the software developer and
    the client (customer or end user). This contract states, among other things, what
    is to be produced, how expensive the entire project may become and what risks
    the project entails. The contact person for the software developer is, for example,
    an end user, a business manager, the project or team leader, the chief IT designer
    or chief architect. From one of these contacts, the software developer will learn
    what tasks he or she will be asked to perform.


    # 20.3.1 Order Clarification


    On the one hand, mission clarification causes much of the difficulty in developing
    the software because end users and software developers do not speak the same language.
    Therefore, it is necessary to determine exactly what the clients want so that
    the risk of developing something wrong is reduced. Certain techniques such as
    an agile approach help with this.


