    By the type of how the component will use the free space. As before, the constants
    available are NORTHWEST, NORTH, NORTHEAST, WEST, CENTER, EAST, SOUTHWEST, SOUTH
    and SOUTHEAST, which are used as parameters for an object of type BagConstraints.
    In the program example you see that the text box is aligned using the GridBagConstraints.VERTICAL
    setting. This means that the component takes the maximum space in the vertical
    direction.


    The developers of the GridBag layout have also thought about the space being between.
    Using the parameter insets you can specify the minimum external margin of the
    component. The values must be specified in pixel units (pixels). In contrast,
    the ipadx and ipady parameters specify the minimum internal margin. Again, this
    value must be specified in pixel units.


    # 22.3.8 Swing


    Since Java 2, another GUI library called Swing exists within Java SE in addition
    to the AWT. You can find more of the classes of this library in the package java.swing.
    For all GUI components there are Swing classes that do adequately replace the
    AWT classes (Figure 22.15).


    Swing draws all interface elements and therefore does not provide a native lookand
    feel on all platforms, but try to recreate it using UIManager class found in the
    package java.swing. This method has the disadvantage that the interface does not
    always look like native programs and compared to native interfaces- drawn relatively
    slowly. It has the usual problems with using graphical user interfaces are almost
    eliminated.


