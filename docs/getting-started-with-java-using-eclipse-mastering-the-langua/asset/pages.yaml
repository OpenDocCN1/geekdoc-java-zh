  md: '# 22.5 Java Micro Edition


    Java Micro Edition is intended for Java applications that are to run in mobile
    devices and so-called embedded systems. It is aimed at programmers of mobile devices
    and embedded systems and confuses the beginner with an almost even larger number
    of abbreviations than is the case in the other two editions.


    ![](img/99e465aebd900a32605788e9d7d8f845_420_0.png)


    Figure 22.20: Java Micro Edition.


    The edition consists of two parts: the Connected Limited Device Configuration
    (CLDC) and the Connected Drive Configuration (CDC). Programs that use the CLDC
    are executed by a special virtual machine, the Kilobyte Virtual Machine (KVM).
    It is very small, very limited, and does not have, for example, decimal points.
    CDC programs, on the other hand, are executed by a complete but compact virtual
    machine (CVM).


    Two profiles are based on the Connected Limited Device Configuration: the MID
    Profile and the PDA Profile. MID stands for Mobile Information Device, which refers
    to mobile devices. Analogous to servants and applets, there is a special type
    of application for these devices, the MIDlets. These are delivered in archives
    and developed with various class libraries.


    +   * java.microedition.io

    * java.microedition.cldc

    * java.microedition.midlet

    * java.microedition.rms


    In addition, the basic libraries java.io, java.lang and java.util are also available,
    but they do not provide floating point types due to the limited virtual machine.
    Java programs signed using Java SE or even JEE are not portable to mobile devices.
    Because of the many limitations, Java Micro Edition has little relevance today.'
