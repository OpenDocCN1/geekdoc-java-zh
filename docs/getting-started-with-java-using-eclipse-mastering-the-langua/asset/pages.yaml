  md: '# 18 Documentation


    #  18.1 Introduction


    Although the topic may seem boring to you, programs need to be documented. This
    is not only to make that others understand your programs. It also serves to make
    sure that yourself still understand your program after a certain time. This may
    seem paradoxical, but especially for larger projects with a lot of time pressure
    it is important that you also document for yourself to be able to maintain the
    program more easily later.


    > Hardly any developer likes to document. To change this, Java makes program documenting
    easier with three different comment types. This chapter is about these three comment
    types.


    ![](img/99e465aebd900a32605788e9d7d8f845_310_0.png)


    Figure 18.1: Java facilitates documenting a program with three comment types.'
  merge: -1
