    #  26.1 Introduction


    Java beginners are often frustrated because they fail because of errors whose
    cause they do not understand and which they cannot fix as a result. I have therefore
    compiled the most important error messages in this chapter and hope to provide
    some assistance in fixing these errors in your programs. The chapter starts with
    pure Java programming errors. This is followed by errors when using the Eclipse
    IDE.


    #  26.2 Java Errors


