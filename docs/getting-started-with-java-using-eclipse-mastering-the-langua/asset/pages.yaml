    # 23.4.7 Scope of Variables


    Now it would be if we used Roth relationships to check off the visibility of classes,
    methods, and variables. That''s not the case, because Java knows different types
    of variables. Some of them can be hidden by other variables – and this without
    applying encapsulation (Table 23.4).


    **Table 23:4:** Variable shadowing.


    | Variable | Shadowing |

    | --- | --- |

    | Class variables | Possible |

    | Object variables | Possible |

    | Parameters | Impossible |

    | Local variables | Impossible |


    What is the shadowing of variables? It means that a variable with the same name
    overlaps another variable in a block. To show this, we will use the class father
    again as an example. This time it gives as an object variable named privateArea.
    This variable is valid for the entire object, since it was not declared in any
    local block, for the entire class and also for every object. This object variable
    is immediately assigned private (Listing 23.7). Because of this assignment, when
    the getPrivateArea() method is accessed, the class returns Private as expected.'
