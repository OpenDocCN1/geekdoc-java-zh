    # 2.1 Introduction


    Java is more than a successful programming language. Java is a technology. This
    chapter gives you an overview of the components of this technology and shows you
    what makes Java stand out from other programming languages and technologies.


    ![](img/99e465aebd900a32605788e9d7d8f845_36_0.png)'
  merge: -1
