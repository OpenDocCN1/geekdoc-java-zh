  md: '# 17.5 Class »Exception«


    Exceptions literally means exceptions. They are events that occur in case of errors.
    They

    be runtime errors or other errors within a program. Figure 17.9 again shows you
    a

    sec of the class hierarchy with the most important errors that belong to the base
    class

    Exception.


    ![](img/99e465aebd900a32605788e9d7d8f845_303_0.png)


    # 17.5.1 Subclass »RuntimeException«


    Errors of type RuntimeException occur when programming errors have gone unnoticed.
    At

    program runtime, hence the name of the RuntimeException class, these errors come

