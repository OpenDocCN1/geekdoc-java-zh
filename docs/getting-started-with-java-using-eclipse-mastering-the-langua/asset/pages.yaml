  md: '# 7.2 Overview


    # 7.2.1 Statement Purpose


    Java belongs to the imperative programming languages. Programs in these languages
    are composed of individual commands. In this type of traditional programming,
    the focus is not on describing the problem, but on solving it. The Java programmer
    is responsible for this solution. To do this, a coder enters the solution of the
    problem as a series of small commands. The program processes these commands exactly,
    piece by piece. This type of programming is called imperative (Latin imperare
    = command). This leads to relatively long programs, but you can specify very how
    the program works.


    ![](img/99e465aebd900a32605788e9d7d8f845_135_0.png)


    Figure 7.2: Robert believes that he can only be programmed declaratively.


    There are programming languages where you proceed completely differently. In these
    programming languages, you formulate the problem and leave it to the program to
    solve the task. This type of programming is called declarative (Section 7.9, <Literature>).
    Declarative programming languages are, for example, the database query language
    SQL (Structured Query Language). With this language, you explain the database
    system which data set must be found. The program then internally processes the
    functions that are necessary to find the data set. Since you do not know how the
    database system is structured internally, you leave it to the program to find
    the data on its own. This leads to amazingly short programs. However, you cannot
    determine how the program runs internally.'
  merge: -1
  pgno: 135
