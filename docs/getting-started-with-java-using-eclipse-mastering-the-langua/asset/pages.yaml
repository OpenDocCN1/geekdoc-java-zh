    Figure 9.26: Definition of an interface.


    There are three important reasons to use interfaces: Encapsulation of components,
    realization of multiple inheritance, and grouping of identical methods. Components
    form an encapsulation around multiple classes whose interfaces should not be fully
    exposed to the outside world. An interface offers here a subset of the internal
    interfaces. Multiple inheritance was not realized in java because of the disadvantages
    mentioned. Nevertheless, it can be important for design reasons to inherit properties
    from several classes. This is exactly the purpose of interfaces. An example of
    how an interface can be implemented is shown in Figure 9.27.


    Here the interface is implemented by a normal class. Accordingly, the keyword
    is not extends, but implements. The derived class must implement the interface
    of the interface in the form of the method method().


    Another form of implementation is possible via an anonymous class. In this case,
    the interface is called with the new operator, which is followed by an anonymous
    class. The definition of the anonymous class contains the implementation of the
    method(s) of the interface (Figure 9.28).'
