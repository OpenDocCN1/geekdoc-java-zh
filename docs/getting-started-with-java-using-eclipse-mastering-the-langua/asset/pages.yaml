  md: '# # 17 Exception Handling


    # ## 17.1 Introduction


    Nobody likes errors – especially in computer programs. But what happens when they
    occur anyway? How can these errors be caught and handled? In classical programming
    languages helps oneself with error numbers. In contrast, error handling in Java
    is purely object-oriented.


    > Errors occur in Java programs for various reasons: For example, because of programming
    errors or due to incorrect operation by the user or due to lack of memory. Java
    offers a sophisticated system to handle errors.


    ![](img/99e465aebd900a32605788e9d7d8f845_294_0.png)


    **Figure 17.1:** Who likes errors? But when they occur, they should be handled
    confidently.


    The so-called «Exception Handling» is the cause of many misunderstandings. Therefore,
    this chapter introduces to you handling of exceptions in Java programs in great
    detail as one of the most important features of the programming language. A good
    understanding of exception handling is the key to very robust Java programs.'
