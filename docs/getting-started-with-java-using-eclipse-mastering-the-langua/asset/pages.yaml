  md: "All graphical user interfaces handle strings practically exclusively. Even\
    \ numeric input is initially received by a Java program as a string. In order\
    \ to be able to calculate with them within the program, they must course be converted\
    \ back into integers or decimal numbers. Wrapper classes serve as a bridge for\
    \ the conversion: the simple class types.\n\n# Wrapper Classes\n\nChapter 8, »Primitive\
    \ Data Types«, has introduced you to eight primitive data types. Variables based\
    \ on these types are not objects and therefore do not have methods. However, it\
    \ would be necessary to convert or modify these values. To be able to use these\
    \ simple data types like objects, there are eight matching classes that wrap them\
    \ – they wrap a simple data type with an object-oriented shell.\n\n| Constructor\
    \ | Meaning |\n|---|--|\n| Byte | byte |\n| Short | short |\n| Integer | int |\n\
    | Long | long |\n| Double | double |\n| Float | float |\n| Boolean | boolean |\n\
    | character | char |\n\nOne case for wrapper classes is to convert strings to\
    \ numeric values and vice versa. As mentioned earlier, Java graphical interfaces\
    \ process all numeric values, which for be able to calculate with the numerical\
    \ values, it is necessary to convert the strings that the user has entered back\
    \ into a numerical format (Figure 22.6).\n\nAfter that, mathematical calculations\
    \ can be performed with the numerical values, which for obvious reasons are not\
    \ possible with strings (sin(), cos(), addition, etc.). After the calculation\
    \ occurs again that the user wants to see the final result. In order to display\
    \ the numerical values, they have to be converted to a string again (Figure 22.7).\n\
    \n```\npublic int stringToInt(String text) {\n    return Integer.valueOf(text);\n\
    }\n```\n\n**Figure 22.6:** Conversion of a string to a number.\n\nThe conversion\
    \ cannot be done as it was shown in chapter 23, »Rules«, in section 23.6, »Type\
    \ Conversion«, using primitive data types. These primitive data types, while different"
