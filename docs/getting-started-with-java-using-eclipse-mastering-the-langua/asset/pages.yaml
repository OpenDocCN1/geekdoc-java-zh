  md: '# # 19 Annotations


    # ## 19.1 Introduction


    Since Java 5, annotations have been part of the Java programming language. They
    are annotations that you can add to packages, classes, interfaces, methods and
    variables. Although they are not really a topic for programming beginners, you
    should at least know what annotations are and what they are used for. This chapter
    gives you a first overview.


    ![](img/99e465aebd900a32605788e9d7d8f845_316_0.png)


    Figure 19.1: Java annotations perform a variety of tasks in Java.'
