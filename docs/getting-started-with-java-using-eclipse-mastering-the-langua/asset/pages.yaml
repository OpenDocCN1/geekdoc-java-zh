    project again. To do this, start the Eclipse wizard using the FILE -> NEW -> JAVA
    PROJECT command or the NEW -> JAVA PROJECT icon on the far left side of the toolbar.
    In the dialog that appears, enter the project name Development_Processes so that
    you can assign the project to this chapter.'
