  md: '| Table 5.1 Reserved keywords |

    | abstract | boolean | break | byte |

    | :--- | :--- | :--- | :--- |

    | case | catch | char | class | const |

    | continue | default | do | double | else |

    | enum | exports | extends | false | final |

    | finally | float | for | goto | if |

    | implements | import | instanceof | int | interface |

    | long | module | native | new | null |

    | package | private | protected | public | requires |

    | return | short | static | strictfp | super |

    | switch | synchronized | this | throws | throws |

    | transient | true | try | var | void |


    There are two special keywords, *const* and *goto*. They have been reserved in
    Java, but may not be used. The keyword *const* may not be used in Java because
    it describes a syntax for constants. It must not be used to avoid problems that
    such references can cause. The fact that the two keywords were reserved without
    their use is due to the fact that they belong to the language scope of C/C++.
    Switches who use these keywords would receive a meaningful error message. Keywords
    as *switch*, *break*, and *goto* are reserved for branches. Branches allow the
    programmer to make choices easily. Depending on the case, the program flows into
    one or another part. Recurring sequences, called loops, use the keywords *do*,
