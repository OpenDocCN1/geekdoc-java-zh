  md: '19 Annotations


    # # 19.2 Overview


    # ## 19.2.1 Annotation Purposes


    Annotations are annotations that you can use to mark up any language elements
    such as packages, interfaces, methods, and variables. You can add annotations
    to your own classes, but you will also use classes that already contain annotations.
    You can use annotations to do the following:


    +   - Tell the compiler not to display or mark classes as obsolete.

    - Make changes at compile time, for example, generate source code

    - Modify or check the behavior of a program at runtime.


    # ## 19.2.2 Annotation Types


    To achieve the previously mentioned tasks, there are the different types of annotations
    listed in Table 19.1.


    **Table 19.1:** This table gives an overview of annotation types.


    | Annotation type | description |

    |---|---||

    | Compiler annotations | This annotation type is used to control the compiler,
    for example to suppress warnings |

    | Meta-annotations | This type of annotations are intended to define other annotations
    |

    | Framework-specific annotations | Many frameworks use their own annotations,
    for example to store data permanently or for configurations |


    Annotations for compiler control are, for example, able to suppress warnings that
    you have identified the reason for the warnings, but want to reduce the number
    of warnings in the project to avoid confusion.


    You use meta-annotations only if you want to develop your own annotations. Annotations
    are defined like classes in a separate file. For this purpose, certain specifications
    must be fulfilled, for which a developer uses the so-called meta-annotations.
    With them, the developer of an annotation specification, for example, to which
    language element annotation can be applied.


    You will encounter annotations for configuration in certain frameworks. These
    are used to specify base values of the framework. Closely related to this are
    framework-specific annotations, which you might use to specify that a class corresponds
    to an entity of a database, for example.'
