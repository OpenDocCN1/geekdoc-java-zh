  md: '# 3.8.1.1 Association


    Association is the simplest form of a relationship between classes and objects.
    The dependencies are small in this type of relationship compared to inheritance.
    The objects are also said to be loosely coupled. For example, an association exists
    when an object named Anna sends a message Robert to an object named Add. The two
    objects Anna and Robert exist separately and do not inherit anything from each
    other.


    ![](img/99e465aebd900a32605788e9d7d8f845_62_0.png)


    Figure 3.18: A simple association between humans and robots


    # 3.8.1.2 Aggregation


    Increase of the association is the aggregation. Such a relationship exists when
    an object is composed of other objects. For example, a robot is said to consist
    of an unspecified number of screws (Figure 3.19). This means, for example, that
    a robot maintains a «consists-of-relationship (part/whole) with the screw.


    ![](img/99e465aebd900a32605788e9d7d8f845_62_1.png)


    Figure 3.19: Aggregation between robot and screw


    However, this relationship is of a completely different quality than in the previous
    example between a human and a robot. And robot and screw exist exist independently
    of each other, the robot is composed (among other things) of screws. Again, it
    is important to note that both objects do not inherit anything from each other
    and each screw object is also viable on its own. This example differs from the
    stricter composition.'
