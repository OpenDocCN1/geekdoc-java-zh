  md: '# 3.8.1.3 Composition


    The strongest form of relations, which are not based on inheritance, is the composition.
    As with aggregation, there is an «consists-from» relationship, but it is again
    stronger in contrast to aggregation. The dependencies are again stronger.


    An example of a composition is the relationship between a human being and his
    two legs. Here, fortunately, there is a very close relationship, because a leg
    – in contrast to a screw – is completely meaningless as an independent object.
    When a human object is created, it automatically gets two individual legs, which
    cannot be used in connection with other objects.


    ![](img/99e465aebd900a32605788e9d7d8f845_63_0.png)


    **Figure 3.20:** A human and two legs as a composition.


    Thus, humans are not viable without a suitable object of the class *Human*. When
    a human object dies, so do its legs.


    # 3.8.2 Inheritance Relationships


    Inheritance relations are also called generalization or specialization. These
    are not sub-types of inheritance, but alternative terms for inheritance relations.
    Which of the two alternative terms you want to use depends on the point of view
    from which you look at the inheritance relation.


    # 3.8.2.1 Generalization


    If you want to look at the base class from the point of view of the derived class,
    generalization is the appropriate term for it. For example, the class *being*
    is a generalization of the classes *Human* and *Robot*. In other words, class
    *Creature* is the general term (= generalization) for classes *Human* and *Robot*.


    # 3.8.2.2 Specialization


    If you want to look at the derived class from the point of view of the base class,
    specialization is the appropriate term for it. For example, the classes *Human*
    and *Robot* are a specialization of the class *Creature*. In other words, the
    classes *Human* and *robot* are a refinement of the class *Creature*.'
