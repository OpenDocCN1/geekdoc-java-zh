    # Method Body


    The body of a method consists of statements and the actual implementation of the
    method. This implementation differs significantly from method type to method type.
    Figure 12.9 shows an overview of the four Java methods for this purpose. For constructors,
    the implementation consists of correctly assigning all the data necessary for
