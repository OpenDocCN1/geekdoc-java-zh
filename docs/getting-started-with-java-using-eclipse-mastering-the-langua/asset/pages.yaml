  md: '# 18.2 Overview


    Java, like things from the C/C++ era, has gently revolutionized documentation
    inside and outside a program. Therefore there are three different comment types
    (Table 18.1).


    **Table 18.1:** This table shows documentation types Java offers.


    | Document type | Description |

    |---|---|

    | Inline comment | Comments a single line |

    | Block comment | Comments a block |

    | Documentation comment | JavaDoc can be generated from this comment |


    # 18.3 Line Comments


    This comment is introduced by double slashes, which make the rest of the line
    as a comment. Thus, they refer to only a single line at a time (Figure 18.2).


    ![](img/99e465aebd900a32605788e9d7d8f845_311_0.png)


    Listing 18.1 gives you two examples for a line comment. As you can see, the comment
    can be placed before the statement to which it belongs or next to it.


    **Listing 18.1:** An example how to use a line comment.


    ```

    1 (...)

    2 // Line comment before a statement:

    3 statements // Line comment after a statement

    4 (...)

    ```'
