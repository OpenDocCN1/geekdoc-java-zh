  md: '# 4.3 Eclipse Introduction


    4.3.1 Overview


    The Eclipse development environment essentially consists of seven elementary components;
    the menu at the top of the graphical interface, the toolbar directly below it,
    the project management (Package Explorer) on the left-hand side of the graphical
    interface, an editor with a window for the structure of the source code on the
    right-hand side and more or less in the background - the build system with its
    compiler, the debugger and the runtime environment (Figure 4.26).


