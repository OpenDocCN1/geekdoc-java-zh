    # 17.6 Summary


    Exception handling is one of the most important aspects of programming. In Java,
    the handling of errors is divided into two parts. Via a try block one tries to
    call methods, which in case of an error lead to an exception, which one handles
    in the catch block. To be able to distinguish between the coarse, from the specific
    to the unspecific. it is important to process errors from the fine to the coarse,
    Java already has a lot of ready-made exception classes that can be used in your
    own programs. Where it is not specific, you develop your own exception classes
    for error conditions that are program-specific. You will learn how this works
    with Eclipse in the following exercise.


