  md: '# # 10 Enumerations


    # ## 10.1 Introduction


    You will encounter enumerations at every turn when programming. It is therefore
    a good thing that the Java programming language has had a data type called enum
    since version 5.


    > Enum is a special! Java class. With the help of this Java class, enumerations
    like the days of the week can be programmed very easily.


    ![](img/99e465aebd900a32605788e9d7d8f845_194_0.png)


    Figure 10.1: Lukas has hated enumerations since PE at school.


    Enum is short for enumeration. The enumeration type is used to summarize collections
    of constants, for example the days of a week.'
