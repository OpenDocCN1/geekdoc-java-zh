  md: '# 22.2.1 Areas of Application


    Class libraries exist for every conceivable use case. For example, libraries exist
    for mathematical computation, image processing, and pattern recognition.


    # 22.2.2 Reuse


    You use these classes as a construction kit and pick out the building blocks that
    sense for your program. You can focus on essentials in your program to change
    these classes, increasing your productivity. You simply download class libraries
    from the provider. Then you configure your development environment Eclipse so
    that you can access the desired classes with your programs.


    # 22.2.3 Documentation


    Documentation exists for all libraries in the form of JavaDoc. JavaDoc is directly
    available in an integrated development environment Eclipse via online help. JavaDoc
    is a bit too sparse, other literature exists for many libraries. For example,
    Oracle offers further documentation via the Internet: https://www.oracle.com/technwork/java/javase/documentation/index.html


    # 22.2.4 Language Extension


    Java, like any object-oriented language, is structured so that class libraries
    supplement a relatively small language core (Part II, Java Language). Any Java
    developer can compile their own classes into libraries for their own use or for
    others. Due to the fact that Java has been around for over 20 years, thousands
    of Java classes have been created over the years.


    # 22.2.5 Types of Class Libraries


    Many software houses and consulting firms offer paid-for Java class libraries.
    Far more popular are open source libraries provided by many organizations such
    as Apache and Eclipse. Java class libraries provided by Oracle are now open source
    as well.


    # 22.3 Java Standard Edition


    Java is divided into three editions: Java Standard Edition (SE), Java Enterprise
    Edition (JEE), and Java Micro Edition (JME). The focus of this book is on the
    Java Standard Edition. The libraries of this edition form the backbone of any
    Java program. They are part of'
