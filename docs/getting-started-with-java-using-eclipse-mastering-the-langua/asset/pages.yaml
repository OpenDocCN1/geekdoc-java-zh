  md: '# # 16 Packages and Modules


    # ## 16.1 Introduction


    In order to structure larger software systems, there are different concepts. In
    Java you solve the division of the programs over Packages and Modules. Packages
    bundle one or several classes, modules summarize one or several packages. While
    package has been a component since the first version of the Java language, the
    module is very new in the Java area. It has been part of the language scope only
    since Java 9.


    ![](img/99e465aebd900a32605788e9d7d8f845_284_0.png)


    Figure 16.1: Professor Roth will help you better understand Java packages and
