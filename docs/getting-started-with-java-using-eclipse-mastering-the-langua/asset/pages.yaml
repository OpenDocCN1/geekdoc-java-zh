  md: '# Correct Class Libraries


    As memory becomes less of an issue, some professional programs ship with a Java
    VM. Because this JRE may distributed, there are no additional costs. Advantage:
    Your program contains in any case a Java VM with the appropriate class libraries.


    # All classes


    Besides a compatible virtual machine, the most important requirement for a successful
    port is that all classes are exported completely. This should be self-evident,
    but is not trivial for large programs. Development environments such as Eclipse
    help with the selection of the required classes and package them in JAR archives,
    so that this critical process is also defused.


    # 21.7 Program Start


    # 21.7.1 Start Script


    To ensure that the end user can easily start a Java program that consists of JAR
    archives, you should ship your program with a startup script. This startup script
    can be executed by the end user with a double click. These scripts differ in structure
    and file extension from operating system to operating system. Therefore it is
    necessary to deliver a special script for each operating system.


    # Windows


    For Windows, a batch file is sufficient to start a Java program. It must have
    the extension bat or cmd. An example of a very simple script is shown in Listing
    21.2.


    Listing 21.2: A simple startup script for Windows.


    ```

    @echo off

    clear

    REM "Bitte Pfad anpassen"

    cd /Users/bstephan/Uebungen/Laufzeitgebung/produkt

    Java --enable-preview -jar Kursstatistik.jar

    @echo on

    ```


    # Unix


    On Linux or macOS, you also start the program by a script. An example of a very
    simple shell is shown in Listing 21.3.


    Listing 21.3: A simple startup script for Unix.


    ```

    #!/bin/sh

    ```'
