- img_proc: true
  md: '# 1 Programming Basics


    our native language and may be one or two foreign languages. How can we bridge
    this huge

    gap between the machine world and the human world?


    We can either develop even more powerful programs like Alexa, Cortana and Siri,
    so that

    the computers execute everything we want. Or we can learn the computer''s language
    if we

    develop special programs for tasks that Alexa & Co. can’t do – no, those aren''t
    the

    only options, because there is, fortunately, a third way.


    Programming a complex program in assembler is no longer up-to-date. That’s why
    people

    started very early to develop programming languages like Java. These languages
    form a

    bridge between the (for most humans) difficult to understand machine language
    and the

    (for most machines) difficult to understand human language. These languages are
    called

    high-level programming languages or high-level languages for short.


    ```

    0101010010101110

    00111101010101101111

    11110011101000011110

    00111010101010101111

    ```


    ![](img/99e465aebd900a32605788e9d7d8f845_31_0.png)


    **Figure 1.4:** High-level programming languages are mediators between humans
    and machines.


    High-level programming languages are much easier for a human to learn and understand

    than the language of the machine world. But how does it work? How do you translate
    a

    high-level language into the language of the machine world? For this purpose,
    a trick has

    been thought of. This trick is a special program that translates the code of a
    high-

    level language like java into the language of the machine world. This program
    is called a

    compiler and is part of a development environment.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 1.4 Development Environment


    # 1.4.1 Compiler


    The compiler is one of the core components of a development environment like Eclipse.
    It transfers the source code of a Java program into the language of the machine
    world. The source code is the text that was seen in figures 1.1 and 1.3.


    # 1.4.2 Editor


    In the editor you enter the source code of a program as a word processor. An editor
    also provides development support, such as advice on how to fix the errors that
    are displayed.


    ![](img/99e465aebd900a32605788e9d7d8f845_32_0.png)


    # 1.4.3 Project Management


    Java programs usually consist of a large number of files. So that you do not lose
    the overview, the Java development environment has a project management. It shows
    which files belong to a project.'
  merge: -1
