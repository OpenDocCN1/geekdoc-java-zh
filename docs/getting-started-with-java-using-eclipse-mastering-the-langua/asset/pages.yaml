  md: '# 13.2 Overview


    # 13.2.1 Operator Types


    Java provides operators for every use from arithmetic to comparisons and assignments,
    bit manipulations, type casts, to creating objects as well object access (Table
    13.1).


    Table 13.1: This table shows an overview of the types of Java operators and their
    usage.


    | Operator | Usage |

    | --- | --- |

    | Arithmetic operators | Addition, subtraction, division, and multiplication |

    | Relational operators | Comparison of expressions or types |

    | Logical operators | Comparison of truth values |

    | Bitwise operators | Bitwise manipulations |

    | Assignment operators | Assignment of values |

    | New operator | Creating an object |

    | Cast operator | Temporary type conversion |

    | Access operators | Access to anonymous classes and class components |


    # 13.2.2 Operator Precedence


    Before we go into the operators in detail, it is important to know that operators
    are evaluat according to their precedence in expressions. Table 13.2 shows the
    order of precedence.


    Table 13.2: The operators in this table are listed in order of precedence.


    | Operator | Precedence |

    | --- | --- |

    | Postfix | expr++ expr- |

    | Unary | ++expr -expr +expr -expr ! |

    | Multiplicative | * / % |

    | Additive | + - |

    | Shift | << >>> |

    | Relational | < > <= != Instanceof |

    | Equality | == |= |

    | Bitwise AND | & |

    | Bitwise exclusive OR | ^ |

    | Bitwise inclusive OR | | |

    | Logical AND | && |

    | Logical OR | || |

    | Ternary | ? : |

    | Assignment | = += - *= /= % &= ^ = << << >> >>>= |'
