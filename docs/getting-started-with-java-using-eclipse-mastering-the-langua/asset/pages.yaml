  md: '# 12.2.2 Method Types


    Dişferences Between Methods

    In Java, there are four fundamentally different Java methods (Table 12.1). In
    the first place is the constructor. Constructors are used to create objects from
    classes and assign their attributes. Therefore, every class from which objects
    can be created must have at least one constructor. Operations are most comparable
    to the functions of a classical programming language. They are used, for example,
    to start programs, calculate values, or output data to the screen.


    Table 12.1: Java distinguishes four different types of methods.


    | Method type | Usage |

    | --- | --- |

    | Constructor | Creates an object |

    | Operation | Classical function |

    | Getter method | Accesses an attribute |

    | Setter method | Changes an attribute |


    With operations, getter and setter methods form the interface of an object. Other
    methods return the attributes of an object, while setter methods change its attributes.
    Think of the aforementioned method types as a membrane surrounding the nucleus
    to protect an object''s attributes (Figure 12.3).


    ![](img/99e465aebd900a32605788e9d7d8f845_216_0.png)


    Figure 12.3: Methods form the interface of an object.


    # Technical Dişferences


    From the technical point of view, operations, getter and setter methods can be
    divided into two types: Class methods and instance methods. Class methods, like
    class variables, are not bound to an object. They therefore exist from the time
    a class is loaded by the Java Runtime Environment until the end of a program.
    You do not need an object to call a class'
