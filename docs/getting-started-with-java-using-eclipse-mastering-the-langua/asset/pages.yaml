  md: '# 24.3 Develop Algorithms 435


    For drawing graphs using the class libraries of Java some previous knowledge is
    necessary. First, it is important to know that the Abstract Windowing Toolkit
    (AWT) provides a set of basic figures for drawing. Among them are circles, ellipses
    and rectangles. The figures can be filled or outlined. They are located in the
    class Graphics of the package java.avt.


    # 24.3.2.1 Customized Graphics Component


    To use these figures, you do not need to create an object of class Graphics. Instead,
    you need to draw a component using JPanel that provides the method paint() for
    drawing in a window. This method gets as parameter an object of class Graphics.
    This object has the method fillRect(), which can be used to draw rectangles (bars).
    To draw your own diagrams, simply override the method paint() of the base class
    JPanel define the behavior of the base class with your own implementation.


    The second prerequisite for successfully implementing a graphics algorithm is
    knowledge of the java coordinate system. The origin of the coordinate system is
    in the left corner. This means that the familiar coordinate system from mathematics,
    where you draw in your first quadrant, is mirrored on the x-axis (Figure 24.4).


    ![](img/99e465aebd900a32605788e9d7d8f845_460_0.png)


    Figure 24.4: The coordinate origin is in the upper left corner.


    # 24.3.2.2 Customized Chart Algorithm


    Figure 24.5 shows even more precisely where the problem is when drawing a bar
    chart: Due to the tilted coordinate system, the fillRect() method always draws
    from top to bottom. A viewer of the chart expects exactly the opposite behavior.
    To make it look like all the bars grow upwards at a common point, you need to
    calculate the chart position on the y-axis correctly. It must be greater than
    the maximum value that a bar should display. The figure shows the chart position
    for values no greater than 250.'
