  md: "# 15.3 While Loop\n\nThis type of loop belongs to the type of so-called head-controlled\
    \ loops. The while loop is rejecting if the expression in the loop header is false.\
    \ The loop will not run if the termination condition in the loop header is false\
    \ (Figure 15.3).\n\n![](img/99e465aebd900a32605788e9d7d8f845_278_0.png)\n\n**Figure\
    \ 15.3:** Structure of the while loop.\n\nListing 15.1 shows an example of a while\
    \ loop. The following example outputs the days of the array one after the other,\
    \ which were defined in a string array. Since the numbering of the array always\
    \ starts at zero, the loop also starts there. In the head of the loop (line 16),\
    \ the program asks whether weekday is smaller than the length of the array weekdays.\
    \ If this is the case, the loop is executed the first time. Then the process repeats\
    \ until the expression in the loop header is true, which means the loop has reached\
    \ the end of the array.\n\n**Listing 15.1:** A While Loop.\n\n```\n//Examples/Loops\n\
    package programmingcourse;\nclass WhileLoopDemo {\n    static String[] weekdays\
    \ = {\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"\
    ,\"Sunday\"};\n    public static void main(String[] arguments) {\n        byte\
    \ weekday = 0;\n        while (weekday < weekdays.length) {\n            System.out.println(\"\
    Days of the week:\" + weekdays[weekday]);\n            weekday++;\n        }\n\
    \    }\n}\n```"
