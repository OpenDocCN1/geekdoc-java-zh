- img_proc: true
  md: '# 2.2 Overview


    # 2.2.1 The Early Days of Java


    The history of Java began when some programmers from the Californian company Sun
    Micros were asked to develop an object-oriented programming language called Oak
    (Object Application Kernel) for programming household appliances in 1991. Household
    appliances are not very powerful. Therefore, Oak programs should be compact so
    that they can run quickly. Since home appliances use different software and hardware,
    Oak programs should be as easy as possible to transfer from one appliance to another.
    It turned out that these requirements were also an ideal fit for implementing
    Internet programs. Without further ado, the Oak team was given the task of developing
    the first Internet browser for Oak programs.


    ![](img/99e465aebd900a32605788e9d7d8f845_37_0.png)


    About a year later, the new browser could display small programs (applets) on
    HTML pages. It saw the light of day as «HotJava» with the programming language
    Java’ in 1995. Java 1.0 followed in 1996 and was replaced by Java 1.1 in the same
    year. Java programs were still very slow at that time. In addition, programming
    graphical user interfaces (GUIs) was difficult at the beginning. This only ended
    with Java 1.2. This brought a new GUI library called Swing. The increased performance
    of Java was also increased in the size of the Java class libraries. The number
    of classes increased explosively to over 1300 classes – Java became a technology.


    In 2000, Java 1.3 appeared with the so-called hotspot optimization. It frequently
    used parts of a program (hotspots) directly into native machine code. This led
    to programs running significantly faster for the first time. The successor Java
    1.4 brought many language extensions and the introduction of Java Webstart. Java
    Webstart updates a Java program automatically at start, without that are


    > Java is a slang for coffee. According to an anecdote, the team that developed
    Java named the new programming language after a type of coffee.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 2.2.2 The Growth Period of Java


    With the successor Java 5, the extent of the class libraries did not increase
    as strongly as with Java 1.4. The changes to the programming language had it however
    in itself: Java 5 was characterized by so many sensory changes, as were there
    before Java 1.2. Sun Microsystems has thoroughly improved the Java language with
    Version 5. In addition, the Java inventor introduced the product number – the
    leading one was. Among other things, the product is supposed to indicate the maturity
    and stability of the Java version. Java 5 continues to be referred to as version
    1.5. Also following Java versions carry internally tell the old version designations.


    Java 6 in the year 2006 broke off above again a further improvement of the execution
    speed. A feature caused that Sun Microsystems split off the later OpenJDK from
