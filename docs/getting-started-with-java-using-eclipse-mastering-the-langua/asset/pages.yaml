    # 12.8 Summary


    In java, there are several types of methods: constructors create objects, getter
    and setter methods query and modify values. Operations are structured like functions
    of a programming language. With these methods one starts for example programs,
    accomplishes computations or makes database inquiries.


    As variables, Java distinguishes between instance and class methods. Instance
    methods require an object to be executed. Getter and setter methods are examples
    of instance methods. In contrast, no object is necessary to execute class methods.
    They are introduced by the keyword `static`. The best-known static method is `main(...)`,
    which is used to start a program.'
