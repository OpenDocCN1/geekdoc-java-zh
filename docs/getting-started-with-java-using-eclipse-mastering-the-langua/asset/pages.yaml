  md: "# # Getting Started With Java Using Eclipse\n\n# ## Mastering the Language\n\
    and the Development Platform\n\n```\ncopy function\nsource Source\ndestination\
    \ Destination\nException arises if something went wrong\n\nstatic void rcopy(File\
    \ source, File destination) throws IOException {\n    System.out.println(\"Copy\
    \ from\" + \"\\n\" + source + \"\\nnto\" + \"\\n\\n\" + destination);\n    if\
    \ (source.isDirectory()) { // Is the source a directory?\n        destination.mkdir();\
    \ // Create directory in the destination\n        String[] directoryEntry = source.list();\
    \ // List of directory\n        for (int i = 0; i < directoryEntry.length; i++)\
    \ {\n            File entry = directoryEntry[i];\n            System.out.println(\"\
    \\nCopy \".concat(String.valueOf(String.valueOf(entry))))); // Debug info\n  \
    \          rcopy(entry, destination); // Recursively copy all source files(destination,\
    \ entry)); // ... to the destination\n        }\n    } else {\n        long numberOfBytes\
    \ = 0;\n        byte[] buffer = new byte[32768];\n        InputStream in = new\
    \ FileInputStream(source);\n        OutputStream out = new FileOutputStream(destination);\n\
    \        while ((numberOfBytes = in.read(buffer)) > 0) {\n            out.write(buffer,\
    \ 0, numberOfBytes);\n        }\n    }\n}\n```\n\n? Then the source is a file!\n\
    \nBernhard Steppann"
