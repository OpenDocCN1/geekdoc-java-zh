  md: '# # 14 Conditional Statements


    # ## 14.1 Introduction


    In the Java programs of this book so far so-called conditional statements were
    missing. Conditional statements are instructions for handling decisions. Through
    these statements, the program makes the decision to execute either or the other
    part of a program. Conditional statements control the program flow. How this works
    and what different types of conditional statements there are in Java is presented
    in this chapter.


    > Conditional statements control the program flow. They allow a program to decide
    whichever part of the program is to be executed. They are therefore of elementary
    importance for every java program, as this chapter shows.


    ![](img/99e465aebd900a32605788e9d7d8f845_266_0.png)


    Figure 14.1: Florian hates control, but he finds conditional statements really
    cool.'
