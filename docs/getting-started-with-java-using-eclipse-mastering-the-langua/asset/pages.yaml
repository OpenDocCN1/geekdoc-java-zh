  md: '# 23.3 Writing Conventions


    Let''s start with the simplest rules in programming, the writing conventions.
    There are a number of recommendations for writing identifiers in Java programs.
    The reason for these writing conventions was to make Java programs more uniform
    and to increase the readability of the source code. Table 23.2 summarizes the
    internationally recognized writing conventions in Java.


    **Table 23.2:** This table presents an overview of the Java conventions.


    | Element | Writing convention | Example |

    | --- | --- | --- |

    | Packages | Generally, packages are written in lowercase letters. The idea was
    to build them like Internet addresses. The basic package is a top-level domain,
    followed by the company name, the project name and so on. | net.stepan.transfer;
    net.programmingcourse.statistic |

    | Classes | Classes are written like nouns. The first letter is capitalized. If
    the noun is written coupled, a so-called-camel spelling is recommended, in which
    each word is introduced with a capital letter. In any case, the spelling must
    be exactly like the name of the class. | class Student; class StatisticApp; |

    | Interfaces | Like classes | interface Creature; |

    | Methods | Methods are written like verbs with a lower case letter. In some cases,
    a camel-back notation is also useful here, for example with getters and setters.
    Here, one uses a prefix followed by the attribute name. | setName(); isStudent();
    |

    | Variables | The first letter of variables is written in lower case; the camel-back
    notation can also be used here. | String firstName; String csvFile |

    | Constants | In general, constants are written in capital letters. Identifiers
    that consist of several words are separated by an underscore. | public static
    final int COUNT_LEGS = 2 |


    The name of identifiers should not contain special characters and also not contain
    spaces. In addition, it is not allowed to use special characters for class names
    and identifiers that are reserved for other Java language elements.'
