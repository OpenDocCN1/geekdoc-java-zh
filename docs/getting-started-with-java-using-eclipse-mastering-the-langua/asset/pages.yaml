  md: '# 8.3 Integer Data Types


    Integers are mathematically correctly called fixed point numbers. The name says
    it all: They have no decimal places. They are used to represent numerical values
    from the natural number set. Java provides the four integer types *byte, short,
    int, and long*, which differ only in their value range (Figure 8.7).


    ![](img/99e465aebd900a32605788e9d7d8f845_153_0.png)


    # 8.3.1 Data Type »byte«


    The data type *byte* has a sign like all integer types. It has a value range of
    only 8 bits, which corresponds to one byte, hence the name of the data type. With
    it you can only store numbers from $-2^7 = -128$ to $2^7-1 = +127$.


    So for the following example program *Person* this data type is critical, because
    the height of a person 127 cm can easily be exceeded and would blow up the value
    range of *byte*. The example defines a class *Person* with an attribute *height*
    as data type *byte* (line 7). The class has a constructor that is passed by parameter
    with the height of the person (line 10). Furthermore, the class has a query method
    to convey the current value for *height*.'
