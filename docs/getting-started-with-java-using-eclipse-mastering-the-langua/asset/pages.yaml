  md: '# 4 Programming Basics


    The students of the programming course think that there are a lot of instructions
    for such a simple program. Anna would like to know from Professor Roth whether
    it could be simpler:


    > Why do computers have to be programmed in such a complicated way? Why can''t
    you tell them what you want, like Alexa and Siri?


    ![](img/99e465aebd900a32605788e9d7d8f845_29_0.png)


    »Even Alexa, Cortana and Siri,» says Professor Roth, «are just computer programs.»
    These programs were developed so that humans can control computers via speech.
    But Alexa & Co. can only do the few tasks for which they were specially programmed.
    If you want the computer to perform other tasks, such as word processing, you
    have to write a special program for it. These programs can be developed in Java,
    for example.


    # 1.2 The Language of the Machine World


    When we speak of computers, we always make digital computers. These machines understand
    only their digital machine language. Digital means that the computer uses binary
    code for all information. Therefore, the computer''s machine language consists
    only a sequence of zeros and ones.


    However, the computer''s machine language, with its sequences of zeros and ones,
    is extremely difficult for humans to understand. To program computers directly
    in machine code would be completely absurd. It would take a very long time and
    the probability of errors would be high.


    If you want to program the computer close to the machine, use an auxiliary language.
    This auxiliary language is called assembly language or assembler for short. Professor
    Roth presents a simple example to his programming class. Like the Java program
    before, it outputs the character string «Hello!» on the screen (Figure 1.3).


    Professor Roth''s programming course finds the assembly language program quite
    difficult to understand. How could only programmers learn such a terrible language?
    The answer is simple, because, in the early days of computers there were no high-level
    languages like'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Java. Programmers had to pay close attention to the computer''s processors
    when they programmed the machine in assembly language.


    ```

    org 100h

    start:

    mov dx,hallo

    mov ah,09h

    int 2h

    mov al, 0

    mov ah,4Ch

    int 2h

    section .data

    hallo: db ''Hello!'', 13, 10, ''$''",

    ```


    ![](img/99e465aebd900a32605788e9d7d8f845_30_0.png)


    **Figure 1.3:** This assembler program also outputs »Hello!».


    Assembler programs are much longer compared to functionally equivalent Java programs.
    They consist of many small-part commands, taken alone, do little. Therefore, one
    needs many of these commands to write a larger program. This program is written
    specifically for one type of computer. It is difficult to transfer to another
    type of computer. Beside the cost of developing such programs, a major disadvantage
    of the assembly language is that it is difficult to transfer from one type of
    computer to another. However, the small-part instructions do not have only disadvantages.
    They have the advantage that a good programmer can use them to create very lean
    and fast programs. They also require far less memory than comparable programs
    written in a high-level language.


    # 1.3 High-Level Programming Languages


    It seems to somehow bewitched: Computers only understand their specific machine
    language. We, on the other hand, without special programming training, understand
    only'
  merge: -1
