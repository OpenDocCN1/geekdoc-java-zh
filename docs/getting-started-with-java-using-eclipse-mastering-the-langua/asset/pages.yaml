    # Dot Before Dash


    In the first case, the program tries to perform addition first, but is not allowed
    to do so because of the dot before dash rule. For this reason, it first performs
    the multiplication and gets 12 as result. It divides this value by b and gets
    3. The final addition of 3 plus 4 gives 7.


    # Excess Bracket Levels


    In the second case, the set parentheses do not change the result, since they do
    not affect the evaluation order. Thus, the calculation proceeds identically.


    # Swap


    In the third case, a mathematical rule comes into effect, the so-called law of
    interchange (commutative law). This means equivalent operands (arguments) can
    be interchanged. Whether b * c is processed or c * b, does not matter at first
    for equivalent arithmetic operations. The calculation runs identically here, too.


    # Lost Division Remainder


