  md: '# 3.4.2 Methods


    Suppose you want to tell Anna to respond to a question. In real life, you simply
    ask Anna a question or send her a message. In object-oriented programming, you
    call a method of the object Anna (Figure 3.6). A method is the object-oriented
    term for a function. The term was introduced to express that an object-oriented
    function is much more powerful than a function of a classical programming language.


    ![](img/99e465aebd900a32605788e9d7d8f845_53_0.png)


    **Figure 3.6:** Objects communicate by calling methods.


    But no matter what the term is called, one is the same: behaviors like communicating
    determine an object''s ability to understand and perform tasks. So objects can
    be controlled by methods. Not only one type of method exists, but there are the
    following basic types: Constructors (<<Builders>>), Destructors (<<Destroyers>>),
    Modification Methods (<<Setters>>), Query Methods (<<Getters>>), and Operations
    (<<Functions>>).


    # Constructors


    In natural life, objects of a computer program also have a life cycle. They are
    born, that is, created, and at some point they die, that are deleted and their
    memory is released. The most important method is the one that creates an object.
    Consequently, they are also called <<constructors>>. They construct, that is,
    create an object.


    # Destructors


    Methods that destroy an object are called <<destructors>> in object-oriented programming.
    In some programming languages, you can call these destructors directly and thus
    destroy an object immediately. In Java this does not work. Here, an object is
    automatically destroyed when it is no longer needed. More about this later.


    # Setter Methods


    Methods that change the value of an attribute are called <<setter methods>> or
    <<setters>> for short. They change the state of the object. Such a method can
    be used to change the speed at Anna moves (Figure 3.7). The corresponding method
    is called *running* and has a so-called parameter that specifies the new state,
    the *speed*.'
  merge: -1
