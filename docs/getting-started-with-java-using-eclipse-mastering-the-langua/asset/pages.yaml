    # 11.3 Summary


    Arrays are very simple data containers. Unlike some other programming languages,
    an array variable in Java is an object. This object contains further elements
    of any type. These elements are also objects.


    ![](img/99e465aebd900a32605788e9d7d8f845_212_0.png)


    Figure 11.9: Java is not enthusiastic about arrays because they are «only» semi-dynamic.


    Because you do not have to specify how many elements the array will contain when
    you declare an array, arrays are called semi-dynamic. After the declaration, when
    you create an array object, you must of course specify how many elements it should
    contain.'
