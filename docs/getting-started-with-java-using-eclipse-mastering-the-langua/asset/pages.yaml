  md: '# 15.7 Summary


    Loops allow recurring processes to be automated. Classic examples are reading
    in or putting data. Java has three types of loops: the while loop, the for loop,
    and the do loop. The head-controlled while and the for loop are rejecting. That
    is, they check their termination criterion before running and thus if the termination
    criterion has already been reached.


    ![](img/99e465aebd900a32605788e9d7d8f845_282_0.png)


    Figure 15.7: Java has three principally different types of loops.


    The foot-controlled do loop, on the other hand, is not rejecting. The do loop
    therefore only checks after the first run whether the termination criterion has
    been reached. There are two versions of the for loop. Since Java 5 it is possible
    to use the extended for loop. can, for example, automatically run through an enumeration
    type without an index.


    # 15.8 Literature


    Control Flow: https://docs.oracle.com/javase/tutorial/java/nutsandbolts/flow.html'
