  md: '# 20.6 Summary


    The background of this function is that when you deliver programs, you usual-encrypt
    the bytecode. This makes it difficult for the competition to decompile the source
    of the program. For our program the function is irrelevant. More important is
    the last field at the bottom: Specify CourseStatistics as main class and then
    generate the JAR file by clicking FINISH.


    If everything worked you will find a named CourseStatistics.jar in the directory
    selected on the second page of the day. The file is a ZIP file containing Java
