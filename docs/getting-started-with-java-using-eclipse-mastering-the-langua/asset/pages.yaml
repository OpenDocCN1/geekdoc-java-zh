  md: '# 23.7.2 Method Overriding


    An important aspect of biological inheritance is mutations. Even in Java, hereditary
    information does not have to be inherited just like that. If you want to change
    the behavior of a method in a derived class, you can simply overwrite (override)
    it. Overwriting is done by redefining the method. In doing so, the signature must
    be exactly the same as the base method. Methods cannot be overridden only if the
    base method is defined as private, final or static (Figure 23.7).


    > To overwrite a method means to redefine it, the signature must be exactly the
    same as the base method. Methods defined with private, final or static cannot
    be overwritten.


