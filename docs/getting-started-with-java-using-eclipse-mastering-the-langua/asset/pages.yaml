    wait for an input if you click the CANCEL button of the OPEN FILE dialog.


    # Reading the File


    A CSV file is a very simple text file. It is organized like a table. The rows
    of this table are called records. Each record consists of individual data fields,
    the columns of a table (Figure 25.5). The records are separated by one or two
    break characters (this depends on the op-'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# 25.3 Analysis and Design 453


    erating system. The usual characters are Carriage Return and Line Feed, which
    still come from the typewriter era.


    | Records (Rows) | Table Header | Field Separator | CSV File | Line Break | End
    of File |

    |---|---|---|---|---|--|

    | Row 1 | Student Name, Last Name, | Mandatory Subject, | Elective Subject |

    | 100100, | Anna, Julia, Lukas, Florian, | Seitz, Lippincott, Wittek, Krause,
    | Mathematics..., Mathematics..., Mathematics..., | English..., History..., Geography
    |

    | Row n | 100123, | | | | |

    | | Column 1 ... Column n | Data Fields (Columns) |


    Figure 25.5: The structure of the CSV file.


    In a program to distinguish the data fields of a record when reading the CSV file,
    they must be separated by a character that is known to the program before reading.
    In principle, many characters such as a comma, colon or semicolon can be used.
    It is only important that the character is not contained in the values of the
    data fields. In the English language area a comma has established itself as a
    separator. This also explains the original meaning of the abbreviation CSV, which
    stands for «Comma-separated values». CSV-separated values is not standardized
    internationally. For example, in the United States, decimal places are separated
    by a period, whereas in the German-speaking world, they are separated by a comma.
    Numbers according to German formatting will not be interpreted correctly with
    a comma, which is why we have established a semicolon as a separator for data
    fields. This should also apply to the structure of the quote list.


    The reading of a CSV file requires a so-called parser (English: to parse = dissect).
    A parser breaks a file into its individual components. To do this, the parser
    reads each line of a file. With the help of the separator for the individuals,,
    parser splits each line into its components. By assigning the values, the rows
    and columns of a table are created. The parser repeats the process of reading
    until it reaches the end of the file.


    # Developing the Data Model


    To map the CSV data structure to Java classes, it is useful to develop a data
    model before implementing the Java program. The CSV file consists of an unknown
    number of records, the rows of the later table. Each of these rows consists of
    an unknown number of data fields, the columns of the later table (Figure 25.6).'
