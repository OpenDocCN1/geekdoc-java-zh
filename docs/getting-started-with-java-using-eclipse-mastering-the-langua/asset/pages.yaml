  md: '# # 3.3 Object


    Objects are to a Java program what cells are to an organism: A Java program is
    composed of these smallest units. If you look at a set of similar objects, you
    will notice that their basic appearance is common. In object-oriented programming,
    such objects are often referred as instances of a class.


    As an example the programming course of professor Roth is to serve. Anna, Julia,
    Lukas and Florian take part in the programming course. Let us first pick out the
    students Anna and Julia. Both students are objects with many similarities. For
    example, they have in common that they are women, attend the same programming
    course and are enrolled at the same university.


    ![](img/99e465aebd900a32605788e9d7d8f845_50_0.png)


    **Figure 3.3:** The «objects» Anna and Julia are similar.


    From the point of object-oriented programming, this means that these two objects
    are similar. The differences between these objects result from the different value
    of their attributes. For example, both female students have a different name and
    different hair color as well as size (Figure 3.3).


    Thus, similar objects have only their principle shape and certain capabilities
    in common. Everything else is individual. The common shape and the common capabilities
    of objects are determined by the building plan of the objects. This blueprint
    is called class in object-oriented programming.'
