    The program performs an easily overlooked implicit conversion to an Int value
    when dividing. Since this type can only store fixed-point numbers, the program
    truncates the remainder alone. Only the digit before the decimal point is transferred.
    Thus, 0 appears as the result.


    The second example (Listing 23.14) tests the limit of the value range. The program
    assigns two integer values by main and then tries to add them together and store
    the result in a variable result.


