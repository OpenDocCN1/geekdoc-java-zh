  md: '# 16.2 Overview


    Packages and modules are means to structure Java programs. Packages group one
    or more classes together, while modules group one or more packages together. Figure
    16.2 shows the module java.base from Java SE, which bundles the packages java.lang,
    java.math, java.net, java.io, and java.nio and their subpackages.


    ![](img/99e465aebd900a32605788e9d7d8f845_285_0.png)


    # 16.3 Packages


    Packages are defined in Java using the keyword package. A single package contains
    one or more Java classes. The package should contain classes which are in strong
    relation to each other. To use classes outside of your own package, you have to
    import them.


    # 16.3.1 Class Import


    Dynamic Import

    Packages are scopes for classes that reside within them. They are also called
    namespaces, which I1 will discuss later. Also public classes are unknown to other
    packages until they are taken over via an import statement. The term import is
    unfortunately misleading. The class is not imported, it is only used.'
