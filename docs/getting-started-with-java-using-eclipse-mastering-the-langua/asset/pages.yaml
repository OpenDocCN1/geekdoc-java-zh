  md: '# 25.3.1 User Interface


    The user interface of the program basically consists of the main window. The structure
    of this main window resembles a picture with a frame (Figure 25.3). The window
    itself is the frame with a background. A menu bar and two larger elements are
    integrated on it. The menu bar consists of a file menu, which contains two menu
    commands. With the first command OPEN... a file can be opened. The word OPEN is
    followed by a socalled ellipsis. These three dots signal that the command will
    open a dialog. The second command EXIT terminates the program.


    ![](img/99e465aebd900a32605788e9d7d8f845_476_0.png)


    Figure 25.3: The structure of the main window.


    The first element at the top of the window is a bar. It is used to integrate a
    text field for a filter and the corresponding label into the main window. In the
    lower area of the window there is an element that translates as a scroll disk.
    The table is placed on this element. It is a peculiarity of the Swing class library
    that tables must be added to a scrolling element. If this is omitted, its contents
    cannot be scrolled.


