  md: '# 12.2 Overview


    # 12.2.1 Method Purpose


    Methods combine all the functions of a Java program. Without them, a Java program
    would be just dead matter. In Figure 12.2, you can see the interaction of various
    functions in the flow of the Java application ProgramDemo. In this diagram, the
    program ProgramDemo consists simplified only of the class ProgramDemo, a class
    Person and two objects.


    ![](img/99e465aebd900a32605788e9d7d8f845_215_0.png)


    The user starts the program via the Java Runtime Environment, calling the method
    main() of the class ProgramDemo. Then, using the constructors of the class Person,
    this method brings to life two person objects – the natural persons »Professor
    Roth» and »Student Anna». From this point on, these objects can communicate with
    other objects and output their name and job title.'
