  md: "# From The Inside To Outside\n\nIn cases 6 and 7, the processing of the expression\
    \ proceeds from the inside to the outside. First the addition is calculated, then\
    \ the multiplication, and finally the division.\n\n# 23.6 Type Conversion\n\n\
    Java, unlike some other languages, is strictly typed. If an identifier has been\
    \ declared a certain type, this is valid for the life of the program. The compiler\
    \ checks for assignments to it to see if the data types match. The following is\
    \ not compiled:\n\n```\nlong a = 1;\nint b = 1;\nb = a; // will not be compiled\n\
    ```\n\nThe compiler checks if a data loss can occur. Since the variable a can\
    \ occupy a larger range of values than b, it refuses to approve the expression.\
    \ The following, on the other hand, succeeds: \n\n```\nlong a = 1;\nint b = 1;\n\
    a = b; // will be compiled\n```\n\nHowever, the fact that an identifier is chained\
    \ to its type for life does not mean that it is not possible to break these shackles\
    \ temporarily. Type conversion allows values to be exchanged between variables\
    \ of different types, as the following fragment shows:\n\n```\nlong a = 1;\nint\
    \ b = 1;\nint c = 1;\nb = (int)a; // will not be compiled\n```\n\nAs the example,\
    \ the program performs a temporary conversion of a through a cast operator to\
    \ pass the value to b. This arrangement is only temporary in the line that follows.\
    \ The program tries again to pass a value of long to a variable of int, and fails\
    \ again because the compiler rightly prevents it.\n\nThe Java programming language\
    \ has two types of type conversion. Implicit type conversion is done automatically.\
    \ Here the developer is passive. With the explicit conversion, you explicitly\
    \ perform a conversion.\n\n# 23.6.1 Implicit Conversion\n\nThe implicit conversion\
    \ is tricky, where a creeping value conversion takes place. The compiler does\
    \ not indicate when data loss is imminent, as the following examples show."
