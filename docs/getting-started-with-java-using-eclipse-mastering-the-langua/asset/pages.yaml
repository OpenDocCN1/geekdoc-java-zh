  md: '# 7.2.2 Statement Types


    As mentioned at the beginning, you can compare Java statements with commands in
    the form of a sentence. What exactly does this look like in a Java program? Table
    7.1 gives you some examples of different statements.


    | Statement | Java Example |

    |---|---|

    | Declaration | String name = "Anna"; |

    | Assignment | Person.name = ...; |

    | Variable call | roth.getName(); |

    | Conditional statement | if (height > 171) ... |

    | Loop | for (student = 1; i < 10); student++) { ... } |


    # 7.3 Declaration


    You must declare constants and variables in Java before you use them. The structure
    of this instruction has already been briefly mentioned in the previous two chapters.
    How the declaration is illustrated shown again in Figure 7.3. First comes the
    data type and the constant or variable. The declaration is always part of a class,
    for example as an attribute, a parameter or a local variable. This means you can
    never use an attribute like name detached from a class like person.


