  md: 'In the example, no handling can be seen in lines 17 and 19. However, exceptions
    are ex-ceptions that must be handled in programs. To omit the handling is not
    a solution, but negligent.


    # 26.2.7 NoClassDefFoundError


    A java.lang.NoClassDefFoundError is raised when a class that a Java program wants
    to access with a operator does not exist. This occurs as long as you develop the
    program with Eclipse. Eclipse checks to make sure that all referenced classes
    exist. If you export the program so that it can be run without Eclipse, such an
    error may occur. Always occurs when the Java runtime environment does not find
    a certain class. In such a case, check the export of your program. For example,
    you forgot a library during the export:


    # 26.2.8 ClassNotFoundException


    Very related to the previous error is the java.lang.ClassNotFoundException. This
    error occurs when the Java runtime environment cannot find a particular class.
    It is thrown when the program does not load a class with the new operator, but
    for example, with the Class.forName(org.postgresql.Driver) statement, where org.postgresql.Driver
    is the desired class to be loaded. In this case, the development environment cannot
    check whether the class exists in the project. In case of such an error, check
    if the path to the class is set incorrectly or if an error has happened during:


    # 26.3 Eclipse Errors


    # 26.3.1 Eclipse Could Not Be Stated


    Cannot start Eclipse and the following error message A Java Runtime Environment
    (JRE) or Java Development Kit (JDK) must be available in order to run Eclipse.
    No Java virtual machine was found after searching the locations: ... means that
    Eclipse did not find a virtual machine. This can happen for example if there is
    no Java installed on the machine.


    Solution: if you have Java installed. If you do, check the search path to your
    installed Java version. As an emergency solution, you can also copy the complete
    JDK into the Eclipse-folder. Eclipse will then find the correct Java version in
    any case.


    # 26.3.2 Chaotic Eclipse Perspective


    If you have broken Eclipse and can no longer find certain windows, it definitely
    helps to restore the perspective to its original state. To do this, use the PERSPECTIVE
    → RESET PER-'
