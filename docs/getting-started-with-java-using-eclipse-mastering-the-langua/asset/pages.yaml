  md: '# 27 Glossary


    Abstract class

    No objects can be created from an abstract class. It is intentionally incomplete
    and forms

    the basis for further concrete subclasses.


    Abstract method

    An incomplete method for which only a signature is defined, but no statement sequence.

    an abstract method lacks implementation.


    Class

    The class is a template, a template for objects.


    Class attribute

    Class attribute is a synonym for class variable.


    Class method

    A method is immutable (static) for all examples of a class. Class methods are
    declared

    by the keyword static.


    Class operation

    Synonym for class method.


    Class variable

    A class variable is immutable for all examples of a class. Class variables are
    declared by the

    static keyword.


    Concrete class

    A class from which objects can be derived.'
  merge: -1
  pgno: 514
- img_proc: true
  md: '# Generalization


    The term generalization is synonymous with *inheritance*.


    # Instance


    Instance usually means an object. In computer science, a program that has been
    started is often called an instance.


    # Instantiation


    The creation of an *object*, that is, an *instance* from a class.


    # Object


    A special user-defined variable that encapsulates data and methods.


    # Object variable


    Variable that is valid only for a special object.


    # static


    The Java keyword *static* is used to indicate a *class variable* or a *class method*.


    # super


    You use the Java keyword *super* to call the constructor of the base class (super
    class). It is a special class variable that the compiler automatically creates
    when it compiles a class.


    # this


    The Java keyword *this* is used when you want to call the object itself. It is
    a special class variable that always points to the object. The compiler creates
    it automatically when it compiles a class.'
