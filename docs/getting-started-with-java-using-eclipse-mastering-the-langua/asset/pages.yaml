  md: '# 6.3 Local Variables


    Local variables have the task of storing data locally. Local means that the variable
    is only visible in a special section of a class and therefore not globally within
    the class. One always stores data only if a variable is exclusively needed locally.
    This can be, for example, if one receives an intermediate result of a calculation
    or if an object is only needed locally. The declaration of a local variable looks
    same as for other variables. However, the visibility of the variable is limited
    only to the block in which it was declared (Figure 6.7).


    ![](img/99e465aebd900a32605788e9d7d8f845_122_0.png)


    **Figure 6.7:** Declaration of a local variable.


    An example of a local variable is the object roh from the LocalVariableDemo. Have
