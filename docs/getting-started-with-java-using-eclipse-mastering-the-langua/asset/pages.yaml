  md: '# 8.2 Overview


    # 8.2.1 Purpose of Primitive Data Types


    The goal of primitive data types was limited to the memory hunger of object-oriented
    programs. Since the primitive data types are no classes, they need only little
    memory. They used them everywhere, where an object with its methods is not necessary.
    This is particularly the case with simple attributes of classes, for example,
    a pure numerical value such as *height*.


    # 8.2.2 Types of Primitive Data Types


    In Table 8.1 you can see an overview of all primitive data types. They differ
    in their usage, how memory they need and the value range. The value range determines
    the size of the variable for this type.


    Table 8.1: Overview of primitive data types.


    | Name | Type | Size | Value range | Default | Example |

    | --- | --- | --- | --- | --- | --- |

    | byte | integer | 8 | -2⁷ ... 2⁷ | 0 | 1 |

    | short | integer | 16 | -²⁵ ... 2¹⁵ | 0 | 2 |

    | int | integer | 32 | -²¹ ... 2³¹ | 0 | 3 |

    | long | integer | 64 | -²⁶ ... 2⁶³ | 0 | 5 |

    | float | decimal | 32 | ±3.4082347 * 10⁻³⁸ | 0,0 | 8.13 |

    | double | decimal | 64 | ±1.7976931348623150 * 10³³⁰ | 0,0 | 21,34 |

    | char | character | 16 | All Unicode characters |   | F |

    | boolean | boolean value | 8 | true, false | true |


    There are the integer data types *byte*, *short*, *int* and *long*, the decimal
    data types *float* and *double*. We use the *char* data type to store single characters,
    and the *boolean* data type to store simple states with two values *true* and
    *false*.


    # 8.2.3 Use of Primitive Data Types


    # Declaration


    Primitive data types are part of the Java language. Therefore, unlike custom classes,
    they do not need to be defined, but only declared when used. The declaration is
    identical to the variable declaration you already know from the chapter 6, «Variables».
    Here you have to «explain» to the compiler of which simple data type a variable
    should. In the declaration, you first specify the type of the variable and then
    the name of the variable. 8.2 shows this using the example of the data type *int*.'
