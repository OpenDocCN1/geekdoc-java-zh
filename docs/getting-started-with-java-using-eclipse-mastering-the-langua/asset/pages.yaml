    # ### 10.3.1 Constructor


    You never call this constructor directly. It is used internally to create the
    elements of an enumeration. This looks like the self-programmed enum class presented
    at the beginning

    (Listing 10.3):


    Weekday(String value, int key);


    However, the constructor has two parameters. With the first, each element gets
    its name as a string. With the second, the class holds the position of the element
    within the loops list of enumerations. For example, *Monday* receives the value
    *0* as the first element – as is common in computer science.


    # ### 10.3.2 Method »value()»


    The method named value() returns all elements of an enumeration class. It is important
    to be able to call the values of an enum class after the other in loops. This
    use case is covered in more detail later in this book section in chapter 15, »Loops.


    # ### 10.3.3 Separate Simple Enum Class


    The definition using an independent class looks like Listing 10.4. Notice how
    shorter the class definition is compared to the example of Listing 10.1 shown
    at the beginning.'
