  md: '# Constants and Variables


    For example, Anna should have the following properties: name = Anna, hair color
    = blonde, height = 1.71 m. Her girl friend from the programming class is named
    Julia, has hair color = brown, and is 1.72 m tall. Although both persons have
    been created according to the same blueprint (class), two individual objects have
    been created: Both have different names, have hair color, and are both different
    heights. Some properties, such as height, could be considered invariant, others
    more mutable. A special form of the variable property of an object is its state.


    # States


    Some of the two individuals have been assigned fixed values, while others have
    assigned variable values. Unlike the fixed properties, the flexible properties
    describe the state of the object. For example, the student property describes
    whether a person is currently enrolled at a university. The state of an object
    can change over time.


    ![](img/99e465aebd900a32605788e9d7d8f845_52_0.png)


    Figure 3.5: Constants, variables, states, and identifiers are properties of a
    class.


    # 3.4.1.1 Identifier


    What would happen if you created the objects Anna and Julia so that they had the
    same size, the same hair color, and the same state student? How could they be
    distinguished then? In this, both objects have been given individual values for
    their attributes, but they happen to be the same. Thus, objects in a program are
    also alike, like identical twins.n order to distinguish objects better, you need
    something like a genetic fingerprint. In programming, the developer assigns a
    so-called identifier. This identifier is an additional attribute for which care
    is taken that it is unique. Only the identifier of an object ensures that the
    program can distinguish different copies even if their attributes happen to have
    the same values.'
  merge: -1
