  md: '# # Primitive Data Types


    # ## 8.1 Introduction


    «Primitive» Java types are used wherever pure numerical values or states have
    to be stored. With their help, objects store their attributes and exchange data.
    Primitive data types are not classes. Therefore, variables based on these data
    types are not objects. It seems to contradict the idea of object orientation.
    So why did the inventors of Java decide to use such data types? Robert has an
    answer:


    > Primitive data types are lightweight. They help to save memory space, because
    they are not classes. Therefore, they do not have methods. Instead they are data
    containers for objects, which they use them for their constants and variables.


    ![](img/99e465aebd900a32605788e9d7d8f845_148_0.png)


    **Figure 8.1:** Primitive data types are lightweight, but not classes.'
  merge: -1
