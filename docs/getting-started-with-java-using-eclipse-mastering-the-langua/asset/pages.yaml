    # # 3.14 Design Rules


    Object-oriented programs are no guarantee for cleanly structured and logically
    built programs. Object-oriented programming facilitates good software design,
    but it does not force it. Therefore you should consider some basic rules. They
    make it easier for you to develop, fast, and robust Java programs (Figure 3.24).


    +   Design Rules {

    * Avoid inheritance

    * Reduce the requirements to the essentials

    * Protect all internal attributes and methods

    * Draw a domain-oriented model with all dependencies

    * Work with a prototype

    }


    > If you want to develop good Java programs, you must follow some rules. They
    will help you write robust programs.


