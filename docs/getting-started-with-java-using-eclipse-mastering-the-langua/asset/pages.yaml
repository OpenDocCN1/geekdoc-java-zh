    # ## 15.1 Introduction


    So far, this book has only introduced a lot of relatively «lifeless» data types
    and operators as parts of the Java programming language. Java programs become
    a little more dynamic when data is read in or output dynamically. This requires
    corresponding program structures – in short: everything that is generally understood
    in computer science as «loops».


    > Almost every program must read files or output data in tabular form. To do this,
    you need loops. Java has all kinds of loops, which are presented in this chapter.


    ![](img/99e465aebd900a32605788e9d7d8f845_276_0.png)


    Figure 15.1: Loops are one of the most important statements of any programming
    language.'
