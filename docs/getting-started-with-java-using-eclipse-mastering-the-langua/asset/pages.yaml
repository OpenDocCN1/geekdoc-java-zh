  md: '# 20.4.4.2 Integration


    The next step is for the team to store all classes centrally, version them, and
    build a version from them. In a larger project, more classes would be built in
    parallel with course statistics, student, and course. At some point, the team
    assembles a version of the software from classes that have been created at the
    different workstations. Because all classes are ''integrated'' here, this process
    is called integration.


    After each, the program course statistics gets a new, consecutive version number.
    For example, you can start with version 0.1, increase to 0.2 until you reach version
    1.0 at the end. For the integration, one team member copies the classes to his
    integration machine. In this, Florian does this task on his machine (Figure 20.21).


    ![](img/99e465aebd900a32605788e9d7d8f845_359_0.png)


    The integrated version must be subjected to quality assurance again using certain
    tools (integration test). Only when this test is successful can the team package
    this version of the program course statistics to make it available to the university
    as »Release Candidate No. 1«. Release Candidate No. 1 is the version to present
    to the customer. Maybe the customer still has one or two suggestions for improvement.
    Then you change and build a »Release Candidate No. 2«. In practice, three release
    candidates should be enough to deliver the software.'
