  md: '# # 24.2 Overview


    # ## 24.2.1 Developing Algorithms


    How to develop algorithms? To move purposefully from the problem to a solution,
    the algorithm, one should proceed according to a solution procedure. Such a plan
    could for example look like in figure 24.2.


    ![](img/99e465aebd900a32605788e9d7d8f845_457_0.png)


    **Figure 24.2:** Sequence of the development of an algorithm.


    Step 1 is usually called «Requirements Capture». Steps 2 to 5 are called »Analysis
    and Design», step 6 know as «Implementation», step 7 as «Test». As you can see,
    the whole process is constantly repeated with each new requirement. The steps
    are cycled through the following order: Capture – Analysis and Design – Implementation
    – Test. The picture will surely look familiar to you from chapter 20, «Development
    Processes». It is nothing else than the development process presented here. So
    what I have just presented to you here is a process for developing algorithms.
    In principle, the entire development of a program runs like this: What applies
    to the algorithm on a small scale also applies to the program on a large scale.'
