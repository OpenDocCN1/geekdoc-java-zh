  md: '# 3.7 Access Protection


    this chapter. Object-oriented programming was invented to overcome the software
    crisis caused by buggy software. The software should become more robust by the
    new programming.


    For the reason, each object is a kind of capsule that protects the data and methods
    of the object. The capsule hides the parts of the object that should not be accessible
    from the outside or only by certain other objects. The places where the capsule
    is permeable are interfaces. The idea of the whole thing is to let through to
    an object only the information that must reach it. Therefore, each object can
    be designed like a cell (Figure 3.15).


    ![](img/99e465aebd900a32605788e9d7d8f845_60_0.png)


    Figure 3.15: Like a cell, the object protects its attributes from unwanted access.


    The most important interface of a class is its constructor. Let''s take the class
    Robot as an example. The object Robert can be created via the constructor of this
    class. Another example of such an interface is the method Understand of the class
    Robot. It is publicly accessible. In contrast, its internal interface Add is not
    publicly accessible. Anna communicates with Robert through this interface and
    uses it to tell Robert what to compute (Figure 3.16).


    All parts that may be accessed from the outside are marked with a plus sign. All
    parts that cannot be manipulated are marked with a minus sign. However, the object
    Anna is not allowed to change all data of Robert via this interface. For example,
    Anna should not be allowed to change the name of the robot at all. If there were
    a publicly available method such as Rename, she could use it to change Robert.
    But this is not allowed like this.'
