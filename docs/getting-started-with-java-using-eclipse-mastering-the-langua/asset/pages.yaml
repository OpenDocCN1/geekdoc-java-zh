    technology. The book part starts with the chapter «Development Processes», which
    explains compiler and debugger in more detail. Then it moves to the core component
    of the Java technology, the »Runtime Environment« that runs your Java programs.
    The chapters »Class Libraries», »Rules» and »Algorithms» complete the tour of
    the Java technology.'
