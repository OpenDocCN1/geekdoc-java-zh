  md: '# 10.2 Overview


    # 10.2.1 Purpose of Enums


    The programming language C/C++, from which Java was strongly influenced, did not
    have a special type for enumerations. This probably explains why the first versions
    of Java did not provide a special type for enumerations either. So Java programmers
    had no choice but program each enumeration from scratch using its own class.


    Over time, programmers published a whole series of design patterns. These are
    particularly successful examples of Java classes, which should serve other programmers
    as a template. Using an example of days of the week, Listing 10.1 shows what an
    implementation of such an enum looked like up to Java 1.4.


    Listing 10.1: Example of an enum pattern up to Java 1.4.


    ```

    //Enumerations

    package programming;

    class Weekday {

    public final Weekday MONDAY = new Weekday("Monday");

    public final Weekday TUESDAY = new Weekday("Tuesday");

    public final Weekday WEDNESDAY = new Weekday("Wednesday");

    public final Weekday THURSDAY = new Weekday("Thursday");

    public final Weekday FRIDAY = new Weekday("Friday");

    public final Weekday SATURDAY = new Weekday("Saturday");

    public final Weekday SUNDAY = new Weekday("Sunday");


    private String name;

    //Constructor:

    private Weekday(String name) {

    this.name = name;

    }

    public String toString() {

    return name;

    }

    ```


    In lines 6 to 12, you can see the individual elements of the enumeration. They
    are constants of type string. Each constant calls calls the constructor of the
    class Weekday in line 17 via the statement new Weekday("..."). The constructor
    is passed the name of the element as a parameter in the form of the data type
    String (i.e. as a string). The class Weekday stores this attribute in the object
    of name type String, which is on line 14. The class has one more method, toString(),
    which returns the name of an element.


    Listing 10.2 shows how to use the Java class we developed ourselves. You can address
    each constant directly with a fixed value. As usual with public static final class
    variables (constants), calling an element always follows the scheme Class.CONSTANT.'
