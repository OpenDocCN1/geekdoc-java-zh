  md: '# Creation of Objects


    Objects are created using the new operator. When creating, specify the new operator
    followed by the class of the class (Figure 9.6). Methods and operators will be
    discussed in detail in the next chapters. Only so much at this point: A method
    is nothing else the designation of object-oriented programming for a function.
    Java operators are shorthand notations for functions, as in mathematics. In this
    case, the function of the new operator is to create a new object using the constructor
    (often called instantiate).


    ![](img/99e465aebd900a32605788e9d7d8f845_168_0.png)


    ![](img/99e465aebd900a32605788e9d7d8f845_168_1.png)


    The constructor is called like a normal method when creating an object. What is
    special about the constructor is that it is the only method that is capitalized
    in Java. This allows it to be distinguished from other methods. It must also be
    used together with the new operator As a result, you get an object name you store
    in a variable. It is very important to understand the process in detail. After
    the statement new class() an object is created. However, it has no label until
    you assign a variable to the object. Until that happens, the object remains anonymous.
    The variable gives you a reference to the nameless object and you can access it
    in the program.


