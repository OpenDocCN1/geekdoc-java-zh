    # 4.3.7 Build System


    Eclipse''s build system has two core parts: the build monitor and the Java compiler.
    The build monitor detects which classes can be compiled and passes this work to
    the compiler. Unlike a classic build system, the Eclipse compiler compiles the
    source code in the background. The way it works is that Eclipse compiler starts
    its work the moment you have saved a Java class and it is free of syntactic errors.


    By compiling in the background, the build system ensures that you can always execute
    a program immediately. Especially for enterprises applications that consist of
    hundreds of classes and can have long compilation times, this is not a plus over
    traditional development environments. So, as a rule, you not need this feature.
    If it is necessary nonetheless, switch it off Project -> Build Automatically (Figure
    4.36).


    Like its JDK counterpart, the Eclipse compiler translates the source code into
