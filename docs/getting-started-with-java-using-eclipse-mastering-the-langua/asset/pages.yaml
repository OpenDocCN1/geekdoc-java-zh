  md: '# Getter Methods


    Getter methods, or «getters» for short, are methods that only query a specific
    attribute of the object. They do not change the state of the object. For example,
    such method would be to query whether Anna is enrolled at a university (Figure
    3.8). This method has a so-called return value: the status of the student, which
    can be answered with *true* or *false*.


    ![](img/99e465aebd900a32605788e9d7d8f845_54_0.png)


    ![](img/99e465aebd900a32605788e9d7d8f845_54_1.png)


    # Operations


    Methods, which accomplish for example only one arithmetic operation, are called
    in object-oriented programming mostly operations or functions. Nevertheless, they
    must not be confused with the functions of the same name in classical programming
    languages, because like other methods they are inherited from class to class (Section
    3.6, «Inheritance»). In addition, they can be overloaded and overwritten (Section
    3.13, «Polymorphism»).'
