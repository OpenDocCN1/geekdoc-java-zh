  md: '# 19.3 Compiler Control Annotations


    Finally, I would like to show you some of the most important annotations for java
    programming, the annotations for compiler control, with some program examples.
    At the beginning the annotation »Deprecated shows how to mark source code as obsolete.
    The next example shows how to suppress warnings in the source code with the annotation
    »SuppressWarnings». Finally, the annotation »Override» marks a method that overrides
    of the base class.


    # 19.3.1 Annotations » Deprecated«


    This annotation marks certain parts of the source code as deprecated. What for?
    Imagine you have programmed a method that has turned out to be not very successful
    over time and that you want to replace it with a better method. Privately, you
    would simply delete the method or change it via refactoring. If you are writing
    software for other programmers, you cannot simply delete or rename the method.
    It may be used by others in the confidence that it will exit the same tomorrow.


    How do you get rid of the blunder in the design of a method as quickly as possible?
    The solution: simply mark the method with the appropriate annotation as deprecated—
    so it is clear that it is *obsolete-. This way you make it that you will no longer
    support the method. The compiler will then warn anyone who uses the class in the
    next version of the software you ship not to continue using the method.


    # Without Parameters


    How to use this annotation without parameters is shown in Figure 19.8. If you
    take a close look at the snippet, you will see that there is a comment before
    the annotation. The comment gives a hint which method should be used instead of
    the deprecated one. Such a comment is not mandatory. However, it should be added
    because other programmers using the class will not know what to use as a replacement
    for the deprecated method.


    | /**

    | * Returns the status

    | @Deprecated

    | * This method will be removed in the near future.

    | * <p>Use (@getStatus) instead.

    |

    | @return Status

    | */

    | Annotation ->/Deprecated public return status() { ... }

    | Additional Comment | Language element (here: method) |


    **Figure 19.8:** Using the annotation «deprecated» without parameters.'
