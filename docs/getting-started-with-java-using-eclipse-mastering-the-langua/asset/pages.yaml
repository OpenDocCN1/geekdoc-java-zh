    # 3.5 Abstraction


    Perhaps you will now say, "That''s all nonsense. A person''s abilities and attributes
    are much more complex and cannot be reduced to size and color and understanding."
    This is true in the natural world, but it is usually completely wrong in the artificial
    world of software development.


    It would be correct only if one had to fully represent nature in a program. For
    for such an exaggerated accuracy there is rarely a reason in programming. Object-oriented
    programming makes it easier to represent the real world as naturally as possible
    and thus promotes good software design.


    ![](img/99e465aebd900a32605788e9d7d8f845_55_1.png)


    It seduces thereby also to exaggerated constructions. The art is to counteract
    this and to represent reality as accurately as necessary, but as simply as possible.
    As you will see later with larger example programs, just the analysis of the components
    essential and correct for the program often causes great problems.'
