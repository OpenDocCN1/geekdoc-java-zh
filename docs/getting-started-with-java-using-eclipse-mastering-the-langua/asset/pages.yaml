  md: "# 15.5 Simple Loop\n\nThe loop is also a rejecting type of loop. By «rejecting»\
    \ is meant that in the head of the loop all conditions for execution are included.\
    \ The first expression determines the initial value, the second termination condition,\
    \ and the third is a statement to control the termination condition.\n\n![](img/99e465aebd900a32605788e9d7d8f845_280_0.png)\n\
    \nThe following example again gains outputs in sequence the days of the week specified\
    \ in a string array. Since the number of an array starts at zero, the loop also\
    \ starts with that. The loop ends when the end of the array has been reached.\
    \ The loop determines this via the day.length method. As long as this value is\
    \ not exceeded, the loop outputs the days of the week (Listing 15.3).\n\nListing\
    \ 15.3: A simple for loop.\n\n```\n//Examples/Loops\npackage programmingcourse;\n\
    class SimpleForLoopDemo {\n    static String[] weekdays = {\"Monday\", \"Tuesday\"\
    , \"Wednesday\",\n        \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\" };\n\
    \    public static void main(String[] args) {\n        System.out.println(\"Days\
    \ of the week:\");\n        for (int weekday = 0; weekday < weekdays.length; weekday++)\
    \ {\n            System.out.println(weekdays[weekday]);\n        }\n    }\n```"
