  md: 'The Java technology differs from pure programming languages such as C/C++ in
    that the Java inventors did not just provide a language definition. In addition
    to its language properties, Java also has a technology character. The technology
    is the part of the overall concept that ensures the high portability of Java programs.
    This includes the virtual machine and the intermediate format called bytecode.


