  md: "# 15.4 Do Loop\n\nThe loop belongs to the »foot-controlled» loops. This type\
    \ of loop is non-rejective. It checks whether the value of the expression is true\
    \ or false before the first pass. It means that the loop will be run even if the\
    \ termination condition is met at the beginning. After the first run, the loop\
    \ will of course be terminated correctly should the termination condition be met\
    \ (Figure 15.4).\n\n![](img/99e465aebd900a32605788e9d7d8f845_279_0.png)\n\nThe\
    \ program in Listing 15.2 shows an example of using the do loop. It again outputs\
    \ in sequence of the day week specified in a string array.\n\nListing 15.2: An\
    \ example of a do loop.\n\n```\n// /Examples/Loops\npackage programmingcourse;\n\
    class DoLoopDemo {\n    static String[] weekdays = { \"Monday\", \"Tuesday\",\
    \ \"Wednesday\",\n    \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\" };\n\
    \    public static void main(String[] arguments) {\n        byte week = 0;\n \
    \       System.out.println(\"Days of the week: \");\n        do {\n          \
    \  System.out.println(weekdays[week]);\n            week++;\n        } while (week\
    \ < weekdays.length);\n    }\n}\n```"
