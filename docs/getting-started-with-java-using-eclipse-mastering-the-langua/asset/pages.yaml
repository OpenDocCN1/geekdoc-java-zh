  md: "# 1.5 Runtime Environment\n\nJava programs require a special runtime environment.\
    \ In other words: Java programs only run with an additional program on your computer.\
    \ You don't notice this at first, because Eclipse development environment calls\
    \ this runtime environment in the background when you run a Java program. To understand\
    \ what this runtime environment is all about, turn to the next chapter. It shows\
    \ you how Java has evolved and why a Java runtime environment is necessary at\
    \ all.\n\n# 1.6 Summary\n\nProgramming means writing computer programs. Computer\
    \ programs consist of one or more commands in a programming language. These commands\
    \ are written in the form of a text. In programming, this text is source code.\
    \ Computers expect the commands in machine language. We, on the other hand, speak\
    \ in our human language. To bridge this gap, computer scientists have developed\
    \ high-level languages. Java is one of these high-level languages.\n\n![](img/99e465aebd900a32605788e9d7d8f845_33_0.png)\n\
    \n```\nclass JavaProgram {\n    public static void main(String[] args) {\n   \
    \     System.out.print(\"My name is Robert!\");\n    }\n}\n```\n\n**Figure 1.6:**\
    \ Computer programs consist of commands of a programming language.\n\nTo translate\
    \ a high-level language program into machine language so that the computer can\
    \ execute it, you need an additional program. This translation program is called\
    \ a compiler. The compiler is part of the development environment which consists\
    \ (among other things) still of an editor and project management. With the help\
    \ of the editor, you write the source code of a program. The project administration\
    \ administers the different files, which belongs to a project."
