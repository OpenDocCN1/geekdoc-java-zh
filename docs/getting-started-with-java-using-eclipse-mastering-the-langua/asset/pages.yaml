  md: '# 9.2 Overview


    # 9.2.1 Purpose of a Class


    Java classes are templates for Java objects. A class brings together the commonality
    of many similar objects. Maybe remember the group of people from Chapter 3, »Object-Oriented
    Programming«. If you are looking for a common class for these person objects in
    Figure 9.2, you need to answer the question of what commonalities connect the
    different persons. So you need to classify the objects.


    ![](img/99e465aebd900a32605788e9d7d8f845_165_0.png)


    The corresponding class should denote the commonalities of the persons in Figure
    9.3. The solution in the form of a class always depends on the requirement one
    has for such a class. For example, a simple solution could look like the one shown
    in Figure 9.3.


    Figure 9.3: A class brings the commonality of many similar objects to a point.


    In previous versions of Java, there was only one type of class. Because of the
    difficulty of adequately representing natural objects with this one type of class
    in Java programs, a number of additional types of classes have evolved over the
    course of the development of the Java programming language.'
