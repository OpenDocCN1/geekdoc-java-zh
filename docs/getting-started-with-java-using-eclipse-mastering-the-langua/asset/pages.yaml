  md: '# # Getting Started With Java Using Eclipse


    Mastering the Language and the Development Platform


    Many people would like to learn Java but getting started is not easy since programming
    with Java requires at least two things: mastering the programming language and
    the development environment. With the help of many examples, this book shows how
    the language is structured. In addition, it employs the Eclipse development environment
    as an example of a powerful tool to develop Java programs.


    In Basics, the first part of the book, you acquire your Java and Eclipse basic
    knowledge. This part lays the programming foundations, gives you an overview of
    Java technology, and shows you what is special about object-oriented programming.


    ![](img/99e465aebd900a32605788e9d7d8f845_521_0.png)


    In the second part called Java Language, everything revolves around the subtleties
    of the Java language and where the first Java applications are created, aided
    by a fine blend of the knowledge part and practical exercises.


    Java Technology is both the name and the focus of the third part which also introduces
    you to the rules to observe when programming, what class libraries are and what
    advantages they have. In addition, you will learn how to test programs, what algorithms
    are, and how to program them.


    > Bernhard Steppan is a Java developer from the very beginning. He has written
    several C++ and Java books as well as numerous articles on programming languages,
    IT architecture, development tools, and other topics. Bernhard Steppan lives in
    Wiesbaden (Germany) and works as Chief IT Architect at DB Systel, the systems
    house of Deutsche Bahn.


    The fourth part, Java Projects, enables you to apply all the previous elements
    in an application with a graphical user interface. The project shows how to develop
    a larger application piece by piece with the Eclipse development environment.
    The Appendix concludes with a section on frequent errors that can occur when working
    with Eclipse, and Glossary.


    All samples discussed in the book, and bonus material, are contained in an archive
    file which is available free of charge from the Publishers'' website www.elektor.com/books.
    On this site, search for Java Eclipse. The tasks and solutions mentioned in the
    book are: www.programmingcourse.net/courses/java_with_eclipse/.


    Elektor International Media BV

    www.elektor.com


    ![](img/99e465aebd900a32605788e9d7d8f845_521_1.png)


    ![](img/99e465aebd900a32605788e9d7d8f845_521_2.png)'
