  md: '# 17.2 Overview


    # 17.2.1 Motivation


    Exception handling is a principle embedded in Java to respond to exception conditions
    in a program. It is necessary to catch and react to errors within a program cleanly.
    Exception states of an application can be divided into two categories: business
    and technical errors.


    # 17.2.2 Types of Errors


    Domain-oriented errors occur, for example, when the user performs a domain-oriented
    action that is incorrect. An example of a technical error is entering a letter
    in a number field or entering a number that is too large. The incorrect entries
    should not lead to instability of the program, but should be caught by the program
    confidently via technical checks. The program below shows how a Java computational
    program reacts to the input of the letter.


    ![](img/99e465aebd900a32605788e9d7d8f845_295_0.png)


    Figure 17.2: A program should respond to incorrect input with meaningful hints.


    Technical errors are given, for example, when there is too little memory available,
    a class was not found by the runtime environment, or a read/write error occurs.
    Here is another example: Suppose you want to write a program that calls another
    program. If you were writing a Java program, you would call an appropriate method.
    This method might fail if the file to be executed has been moved and is therefore
    not found by the program or is destroyed.


    # 17.2.3 Use of Exception Handling


    Error handling in Java runs in an object-oriented manner (Figure 17.3). The starting
    point is always that the Java program attempts to execute a method (item 1). Due
    to the fact'
