  md: 'SPECTIVE command of the Eclipse WINDOW menu. In the dialog that follows this
    com-mand, click the RESET PERSPECTIVE button to reorder the perspective.


    # 26.3.3 Missing Window


    Sometimes you have carelessly closed a window in the development environment,
    but you want to bring it back on the screen. This works with the command WINDOW
    → SHOW VIEW. If the window is not under the menu, you can use the command WINDOW
    → SHOW VIEW → OTHER... to bring up a dialog that shows all the Eclipse windows
    and from which you select the window that should appear.


    # 26.4 Summary


    The chapter has introduced you to some of the most typical Java and Eclipse errors.
    You can find more tips about Java and Eclipse on my homepage https://www.programmingcourse.net.


