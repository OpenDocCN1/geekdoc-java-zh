    # 7.5 Block


    A block group a series of logically related statements into a single unit. Each
    block begins with an opening curly bracket and ends with a closing bracket. The
    program executes the instructions within a block one after the other. A block
    can be, for example, the beginning of a class definition or of a method. A Java
    program blocks mainly in classes, methods, branches and loops. It can be nested
    in each other in any way, as is the example of a class with a method (Figure 7.11).


    ```

    class Class { ← Start of class (start of block)

    method() { ← Start of method (start of block)

    Statement_1;

    Statement_2;

    Method definition Class definition

    } ← End of method (end of block)

    End of class (end of block) ←

    ```


    **Figure 7.11:** Formatting of a block in the style of the C programming language.


    In this example, the opening curly bracket starts on the line where the class
    and method definition starts. This very-spacing notation comes from the world
    of C and is widely used in Java. In my experience, this C notation seems somewhat
    crowded and confusing to programming novices. If you do not like this notation,
    you can also use the notation of a block, as is common in the programming languages
    Algol and Pascal. Here, the block always begins in a separate line. This looks
    like in Figure 7.12. Eclipse has a code formatter that can format programs in
    any way. You can also set in the development environment where Eclipse should
    create classes, methods, conditional statements and loops.'
