  md: '# 3.6 Inheritance


    If you program within a program only the parts essential for the functionality,
    then this has practical reasons: The program can be developed faster, it becomes
    cheaper and leaner. Thus, it requires less memory, and it will usually run faster
    than a program that is overloaded with unnecessary information.

    to achieve this compactness, it is necessary to abstract, i.e. simplify, the usually
    extremely complicated natural objects and their relationships as much as possible.
    The technical term for this technique is therefore called abstraction (Figure
    3.10).


    # 3.6 Inheritance


    After the introduction of classes, objects, methods and attributes, it is time
    to relate these new concepts to the notion of inheritance. Inheritance allows
    behavior to be transferred between classes, and therefore between objects, using
    a blueprint. Inheritance copies attributes and methods of the base class to the
    derived class.

    to clarify this, again with an example: Humans and robots are in some respects
    similar, but in various respects nevertheless extremely different. These differences
    are of a different order than the differences between two humans: Humans and robots
    have a distinctly different shape (Figure 3.11).


