  md: "# 22.3.2 Class »System«\n\nAlong with the String class and the wrapper classes,\
    \ the System class is a linchpin of any Java program. It has a variety of tasks,\
    \ including:\n\n+   - Character input and output to the console\n- Calling the\
    \ garbage collector\n- Program termination\n- Setting basic system settings\n\
    - Query basic system settings\n\nYou have already seen the output of characters\
    \ in many examples in the book. The use of the garbage collector was explained\
    \ in chapter 21, Runtime Environment, section 21.4.5, Garbage Collector. What\
    \ is new, however, that the program is terminated by a method of the class System.\
    \ The System.exit(status) is sufficient for this.\n\nYou pass the status via the\
    \ int status. You if the program terminated normally. You can also output a defined\
    \ value to indicate that the program terminated after a critical state.\n\nAnother\
    \ very useful function of the System class is to read in or out system settings.\
    \ How reading output information (system properties) works in practice is shown\
    \ in Listing 22.7.\n\nListing 22.7: Read some system properties.\n\n```\n1 //Examples/Class.Libraries\n\
    2\n3 package programmingcourse;\n4\n5 class SystemInfoDemo {\n6\n7 public static\
    \ void main(String[] arguments) {\n8\n9 System.out.println(\n10 \"Java version:\
