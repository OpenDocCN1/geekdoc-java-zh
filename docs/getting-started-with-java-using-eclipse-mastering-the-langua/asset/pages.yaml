    # 17.4.1 Subclass »OutOfMemoryError»


    Errors of type OutOfMemoryError have the technical reasons listed in table 17.1.
    These »programming» or configuration errors should be avoided before program delivery.
    For example, a programming error occurs when the program is designed to use more
    and more memory without the JVM''s garbage collector being able to free it («Requested
    Array Exceeds VM Limit»).


    A configuration error may well be present in larger programs if the program already
    lacks of memory during normal operation (Java Heap Space). If, however, the user
    can open many windows or load graphics, one must consider whether to limit or
    generally allow the program more memory. In the latter case, one should allocate
    more to the JVM. Chapter 21, [Runtime Environment], section 21.8, [JVM Configuration],
    goes into detail about these settings.


