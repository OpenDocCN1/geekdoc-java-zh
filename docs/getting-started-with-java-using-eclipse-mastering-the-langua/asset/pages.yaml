  md: '# 14.6 Summary


    Conditional statements control the program flow. The decision in which direction
    the program branches is made on the basis of conditions. Java provides two different
    types of conditional statements for this purpose: if and case statements. For
    simple cases where the program needs to distinguish between two states, if the
    statement is perfectly sufficient.


