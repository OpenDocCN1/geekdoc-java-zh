  md: '# 13.3 Arithmetic Operators


    The operators in the Table 13.2 are listed according to the precedence. The higher
    an operator is in this table, the higher its precedence. Operators with higher
    precedence are evaluated before operators with relatively lower precedence. All
    binary operators except assignment operators are evaluated from left to right;
    assignment operators are evaluated from right to left.


    Operators that are in the same row in the table have the same precedence. If operators
    with the same precedence appear in the same expression, a rule must determine
    which operator is evaluated first. By rule it means that expressions can be enclosed
    in parentheses, to change the evaluation order.


    # 13.3 Arithmetic Operators


    The classical mathematical operators addition, subtraction, division and multiplication
    are also available in Java. In addition, there are the operators that originate
    from C/C++ (Table 13.3).


    **Table 13.3:** The table below lists all arithmetic operators.


    | Operator | Name | Example | Description |

    | --- | --- |--- | --- |

    | + | Unary plus operator | +i | Synonym for i |

    | - | Unary minus operator | -i | Sign inversion of i |

    | + | Additive operator | i + i | Addition or a String concatenation |

    | - | Subtraction operator | i - i | Performs a subtraction |

    | * | Multiplication operator | i * i | Performs a multiplication |

    | / | Division operator | i / i | Performs a division |

    | % | Remainder operator | i % i | Determines the remainder |

    | ++ | Pre-increment operator | j = ++i | 1st step: j = i + 1, 2nd step: j = i
    |

    | ++ | Post-increment operator | j = i++ | 1st step: j = i, 2nd step: j = i +
    1 |

    | -- | Pre-decrement operator | j = --i | 1st step: j = i - 1, 2nd step: j = i
    |

    | -- | Post-decrement operator | j = i-- | 1st step: j = i, 2nd step: j = i -
    1 |


    # 13.3.1 Unary Plus Operator


    The positive sign and the operator for an addition are identical characters in
    Java. In the case of the positive sign, the operator is called unary plus operator.
    Such a sign is always optional, so it does not have to be set separately.


    The program in Listing 13.1 creates the person «Anna» with a height of +171 in
    line 9. In line 11, the program outputs the size of the person again:


    Anna is 171 cm tall'
