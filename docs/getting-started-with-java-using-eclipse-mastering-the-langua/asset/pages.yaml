  md: '# 25.6 Deployment 473


    In the dialog that allows, expand the JAVA branch and export the program as RUNNABLE
    JAR (Figure 25.11). On the second page of the dialog, select the Launch Configuration
    of the project and enter as Export Destination: Swing_Program/product/CourseStatisticsApp.jar.


    For larger projects with many libraries, it is important to export these libraries
    correctly so that the program can be run without a development environment. Eclipse
    offers three options when:


    +   - Extract required libraries into generated JAR

    - Package required libraries into a sub-folder

    - Copy required libraries into a sub-folder next to the generated JAR


    With the first option, Eclipse resolves the libraries and copies the classes individually
    into the new JAR archive. With the second option, Eclipse packages the libraries
    into the new JAR archive, with the third place it packages them separately in
    the export directory.


    ![](img/99e465aebd900a32605788e9d7d8f845_498_0.png)


    **Figure 25.11:** The export of the program as an executable file.


    Since the CourseStatisticsApp doesn''t need any libraries outside of the Java
    Runtime Environment, it might matter which option you choose. In general, I would
    recommend option for medium sized projects because a single JAR archive is easier
    to handle. For very large projects, option three is recommended because it keeps
    the Java archive small.


    You can usually start the Java archive now by double-clicking on the executable
    file CourseStatisticsApp.jar. To select individual options, for example to allocate
    more memory to the program, a start script is necessary. Listing 25.18 shows a
    simple script for Windows. It assumes that you have set the path to the virtual
    machine correctly.'
