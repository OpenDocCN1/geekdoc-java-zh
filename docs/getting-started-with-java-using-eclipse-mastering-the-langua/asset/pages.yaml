  md: "# 22.3.3 Threads\n\nIn situations it is necessary for a program to do not only\
    \ one task, but several in parallel. In this program then several threads of action\
    \ run, so-called *threads*. To avoid the situation in every Java programmer has\
    \ to develop difficult concurrent programs from scratch, there is support for\
    \ this in the Java class library as well.\n\nThe help comes from a class *Thread*\
    \ and an interface called *Runnable*. The class *Thread* implements this interface\
    \ and provides every Java programmer with important functions to start, stop and\
    \ synchronize mini-programs within them. Here is an example, which consists of\
    \ three classes. The class *ThreadDemo* is the main program with the start method\
    \ `main` (Listing 22.10).\n\nListing 22.10: The main program starts the «sewing\
    \ machine.\n\n```\n// /Beispielprogramme/Klassenbibliotheken\npackage programmingcourse;\n\
    public class ThreadDemo {\n    public static void main(String[] arguments) {\n\
    \    Thread up = new Thread(new RightThread());\n    up.start();\n    Thread down\
    \ = new Thread(new LeftThread());\n    down.start();\n}\n\n```\n\nThe classes\
    \ *LeftThread* and *RightThread* both have the class *Thread* as their base class.\
    \ The *LeftThread* class outputs a lowercase character. The character points to\
    \ the left and gives its name (Listing 22.11).\n\nListing 22.11: This is the one\
    \ thread...\n\n```\n// /Examples/Class.Libraries\npackage programmingcourse;\n\
    public class LeftThread extends Thread {\n    public void run() {\n    for (int\
    \ i = 0; i < 100; i++) {\n        System.out.print(\"<\");\n    }\n}\n\n```"
