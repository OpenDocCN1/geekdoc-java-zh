  md: "# 15.6 Extended For Loop\n\nSome Java developers found the programming of a\
    \ for loop too cumbersome in certain cases. This is especially true when enums,\
    \ lists or vectors are to be output. For this reason, the Extended For Loop has\
    \ been available since Java 5. The structure of this loop can be seen in figure\
    \ 15.6.\n\n![](img/99e465aebd900a32605788e9d7d8f845_281_0.png)\n\nFigure 15.6:\
    \ The structure of the Extended For Loop.\n\nThe extended form of the loop no\
    \ longer needs an index. This loop type consists only of type, identifier and\
    \ field. Translated, the loop is: »For all days of the week within the enum class\
    \ 15.4, output their names.\"\n\nListing 15.4: An extended for loop.\n\n```\n\
    // /Examples/Loops\npackage programmingcourse\npublic static class ExtendedForLoopDemo\
    \ {\n    private enum Weekdays {\n        Monday, Tuesday, Wednesday, Thursday,\
    \ Friday, Saturday, Sunday\n    }\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Days of the week:\");\n        for (Weekdays\
    \ weekday : Weekdays.values()) {\n            System.out.println(weekday);\n \
    \       }\n    }\n```\n\nThe for loop, like all other loop types, can be interrupted\
    \ with break and resumed with continue."
