    In Figure 23.2 you can see that the classes ChildClass and PackageClass get access
    to the methods of the base class.


    # 23.4.4 Access Level »protected»


    The next weaker level of security is achieved by using the protected keyword.
    In Figure 23.2 this confidential area can only be accessed by objects of a class
    that is either derived or in the same package. Elements of this class can only
    be accessed by objects that are within the same package or are derived.


    # 23.4.5 Access Level »public»


    The public keyword provides the weakest form of access protection. All information
    is public. You can see from Figure 23.2 that all classes in the diagram can access
