    Classes and Objects


    # ## 9.1 Introduction


    The program structure is introduced. You now know variables, statements and simple
    data types. Now you can really get started with the central topic of Java programming
    – with classes and objects. Do you still remember the definition of an object-oriented
    program by Alan Kay, the inventor of the programming language Smalltalk?


    > The special thing about object-oriented programming is that you can define certain
    data types yourself. These data types are called classes. From them arise the
    objects around which everything revolves in a Java program!


    ![](img/99e465aebd900a32605788e9d7d8f845_164_0.png)


    **Figure 9.1**: Classes are data types defined by the programmer of the class
    itself.


    Alan Kay defined an object-oriented program as follows: «Everything is an object.
    Objects communicate by sending and receiving messages. Objects have their own
    memory. Every object is an instance of a class. The class holds the shared behavior
    for its instances. To evaluate a program list, control is passed to the first
    object and the remainder is treated as its message.'
