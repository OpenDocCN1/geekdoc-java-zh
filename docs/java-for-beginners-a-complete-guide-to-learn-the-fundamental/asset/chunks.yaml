  trans: "\n\n![Image](img/image-5.jpeg)\n\n# 静态变量\n\n任何使用 `static` 关键字声明并放在 `class`\
    \ 中，但在方法、构造函数或 `class` 内部任何其他代码之外之外变量。整个 `class` 仅维护该变量的一个副本，无论为该类创建多少个对象。因此，这些变量也被称为类变量。\n\
    \n这些变量不应作为推荐用法使用。然而，可能存在需要这种实现的场景。但是，每当使用此类变量时，它们应该被视为值不可改变的常量。这些变量在程序开始执行时创建，但在程序运行结束之前它们不会被销毁。\n\
    \n类变量对所有类成员都可见。因此，它们的可见性与实例变量的可见性相似。事实上，类变量的默认值与实例变量相同。可以通过以下语句访问这些变量：\n\n`class_name.variable_name`\n\
    \n下面给出实现静态变量的示例代码：\n\n```java\nimport java.io. * \npublic class SVDemo {\n   \
    \ private static double salaryEmp;\n    public static final String DEPARTMENTEMP\
    \ = \"DevRD\";\n    public static void main (String args []) {\n        salaryEmp\
    \ = 1000;\n        System.out.println (DEPARTMENTEMP + \" Salary       =     \
    \  \" + salaryEmp);\n    }\n}\n```\n\n代码结果可以在下图中看到。![Image](img/image-6.jpeg)\n\
    \n# 修饰符类型\n\n变量的行为和访问可以通过修饰符进行修改。修饰符主要有两种类型，即访问修饰符和饰符。\n\n## 访问控制修饰符\n\nJava 支持多种访问级别，每个级别都有对应的关键字。它们包括：\n\
    \n- **Public (公共)**：所有人可见\n- **Private (私有)**：类可见\n- **Protected (受保护)**：类及其子类可见\n\
    - **Default (默认)**：如果没有指定关键字，变量对包可见。\n\n## 无访问修饰符\n\nJava 中还有其他可用修饰符。它们包括：\n\n\
    - `Static`\n- `Final`\n\n# 静态 Final 总结\n变量与同步\n\n# 第 5 章：运算符\n\n你可以使用运算符来操作变量。Java\
    \ 支持六类运算符。每种类都将进行详细讨论。\n\n### 算术运算符\n\n所有的数学运算都是使用属于算术运算符类的运算符执行的。支持的运算符列表如下：\n\
    \n- **加法 (+)**：该运算符执行两个数之间的加法运算。如果 `a` 和 `b` 是变量 5 和 6，那么 `c = a + b` 等于 1。\n\
    - **乘法 (*)**：该运算符执行两个数之间的乘法。如果 `a` 和 `b` 是变量 5 和 6，那么 `c = a * b` 等于 30。\n- **减法\
    \ (-)**：该运算符执行两个数之间的减法运算。如果 `a` 和 `b` 是变量 5 和 6，那么 `c = a - b` 等于 -1。\n- **除法\
    \ (/)**：该运算符执行两个数之间的除法。如果 `a` 和 `b` 是变量 10 和 5，那么 `c = a / b` 等于 2。\n- **取模 (%)**：该运算符返回两个数除后的余数。如果\
    \ `a` 和 `b` 是变量 10 和 5，那么 `c = a % b` 结果为 0。\n- **自增 (++)**：该运算符将变量的值加 1。如果 `a`\
    \ 是值为 1 的变量，`a++` 结果为 2。\n- **自减 (--)**：该运算符从变量的值减去 1。如果 `a` 是值为 1 的变量，`a--` 结果为\
    \ 0。\n\n### 关系运算符\n\n所有的比较操作都是使用关系运算符执行的。该编程语言支持的运算符列表为：\n\n- **不等于 (!=)**：该运算符应用于两个操作数。检查两个操作数的相等性。如果它们相等，返回\
    \ `false`，否则返回 `true`。\n- **等于 (==)**：该运算符应用于两个操作数。检查两个操作数的相等性。如果它们相等，返回 `true`，否则返回\
    \ `false`。\n- **大于 (>)**：该运算符应用于两个操作数。检查两个操作数的相等性。如果第一个操作数大于第二个操作数，返回 `true`，否则返回\
    \ `false`。\n- **小于 (<)**：该运算符应用于两个操作数。检查两个操作数的相等性。如果第一个操作数小于第二个操作数，返回 `true`，否则返回\
    \ `false`。\n- **大于或等于 (>=)**：该运算符应用于两个操作数。检查两个操作数的相等性。如果第一个操作数大于或等于第二个操作数，返回 `true`，否则返回\
    \ `false`。\n- **小于或等于 (<=)**：该运算符应用于两个操作数。检查两个操作数的相等性。如果第一个操作数小于或等于第二个操作数，返回 `true`，否则返回\
    \ `false`。\n\n### 位运算符\n\n普通运算符与位运算符之间的唯一区别是它们按位进行操作的。此外，这些运算符可以应用于 `byte`、`int`、`long`。Java\
    \ 支持的位运算符列表包括：\n\n- **位与 (&)**：该运算符作用于两个操作数，如果两个输入位均为 1，则每个位的输出为 1，否则输出为 0。\n\
    - **位或 (|)**：该运算符作用于两个操作数，如果其中一个或两个输入均为 1，则每个位的输出为 1，否则输出为 0。\n- **位异或 (^)**：该运算符作用于两个操作数，只有当两个输入位为\
    \ 1 时，每个位的输出为 1，否则输出为 0。\n- **取反 (~)**：该运算符作用于单个操作数，将 0 变为 1，1 变为 0。\n- **左移 (<<)**：该运算符作用于两个操作数。左操作数左移的位数等于第二个操作数的值。\n\
    - **右移 (>>)**：该运算符作用于两个操作数。左操作数右移的位数等于第二个操作数的值。\n- **无右移 (>>>)**：该运算符作用于两个操作数。左操作数右移的位数等于第二个操作数的值。此外，0\
    \ 会填充移出的位。\n\n为了理解位运算，我们来看一个例子。假设两个变量 `a` 和 `b` 的值分别为 60 和 13。`a` 和 `b` 的二进制形式如下：\n\
    ```\na = 0111100\nb = 00001101\n```\n使用与逻辑表，只有当两个输入均为 1 时输出为 1。相应地，输出 `a & b =\
    \ 00001100`。其他位操作类似。\n\n### 逻辑运算符\n\nJava 中所有的逻辑操作都是使用逻辑运算符执行的。该编程语言支持的运算符为：\n\
    \n- **逻辑与**：该运算符应用于两个操作数。如果两个操作数都非零，返回 `true`，否则返回 `false`。\n- **逻辑或**：该运算符应用于两个操作数。如果一个或两个操作数非零，返回\
    \ `true`，否则返回 `false`。\n- **逻辑非**：该运算符作用一个操作数。如果操作数为 0，返回 `true`，否则返回 `false`。\n\
    \n### 赋值运算符\n\nJava 支持的赋值运算符包括：\n\n- **赋值赋值 (=)**：该运算符将右侧计算的值赋值给左侧变量。如果 `a`、`b`\
    \ 和 `c` 是三个变量且表达式为 `c = a + b`，那么 `a` 和 `b` 的加法值被赋值给 `c`。\n- **加赋值 (+=)**：该运算符通过将左右相加并将计算结果赋值给左侧变量。如果\
    \ `a` 和 `c` 是两个变量且表达式为 `c += a`，那么 `a` 和 `c` 的加法值被赋值给 `c`。\n- **减赋值 (-=)**\n\n"
- fmt: "\nThis operator assigns the value computed by subtracting right from left\
    \ to the variable on the left. If `a` and `c` are two variables and the expression\
    \ is `c -= a`, then the value of `a` is assigned to `c`.\n\n### Multiply AND Assignment\
    \ operator (`*=`)\nThis operator assigns the calculated value by multiplying the\
    \ right and left sides of the variable on the left. If `a` and `c` are two variables\
    \ and the expression is `c *= a`, then the value of `c * a` is assigned to `c`.\n\
    \n### Division operator AND assignments (`/=`)\nThis operator assigns the value\
    \ calculated by dividing the left side and the right side to the variable on the\
    \ left side. If `a` and `c` are two variables and the expression is `c /= a`,\
    \ then the value of `c / a` is assigned to `c`.\n\n### Modulus AND Assignment\
    \ Operator (`%=`)\nThis operator assigns the value computed by the left-to-right\
    \ cube to the variable on the left. If `a` and `c` are two variables and the expression\
    \ is `c %= a`, then the value of `c % a` is assigned to `c`.\n\n### Left shift\
    \ AND Assignment operator (`<<=`)\nIf `a` and `c` are two variables and the expression\
    \ is `c <<= a`, then the value of `c << a` is assigned to `c`.\n\n### Right Shift\
    \ AND Assignment Operator (`>>=`)\nIf `a` and `c` are two variables and the expression\
    \ is `c >>= a`, then the value of `c >> a` is assigned to `c`.\n\n### Bitwise\
    \ AND Assignment operator (`&=`)\nIf `a` and `c` are two variables and expression\
    \ is `c &= a`, then the value of `c & a` is assigned to `c`.\n\n### Bitwise XOR\
    \ AND Assignment Operator (`^=`)\nIf `a` and `c` are two variables and the expression\
    \ is `c ^= a`, then the value of `c ^ a` is assigned to `c`.\n\n### Bitwise OR\
    \ Including and Assignment Operator (`|=`)\nIf `a` and `c` are two variables and\
    \ expression is `c |= a`, then the value of `c | a` is assigned to `c`.\n\n##\
    \ Operator precedence\nIf an expression uses multiple operators, the operator\
    \ precedence rules are used to determine the order in which operations are performed.\
    \ The precedence of operators as to whether they will be evaluated right-to-left\
    \ or left-to-right is defined for groups of operators as follows:\n\n**Right to\
    \ left**: Unary conditional assignment\n**Left to right**: Postfix multiplicative\
    \ add-on, relational equality, Bitwise AND, Bitwise XOR, Bitwise OR, Logical AND,\
    \ Logical OR\n\nFor example, if we need to compute `a = 3 + 5 * 5`, the multiplication\
    \ is done before the addition. Therefore `a = 28` instead of `40`.\n\n## Chapter\
    \ 6: Items and Classes\nLet's start by understanding the concepts of classes and\
    \ objects. A class is a template that is used to create objects. Objects are real\
    \ entities that interact and form the core of a program. There can be types of\
    \ variables in a class. First, variables are defined inside the class but outside\
    \ the method. Such variables are defined for each object and called instance variables.\
    \ Additionally, variables can exist in a class's method block. These variables\
    \ are private to the method and are local variables. Any variable declared in\
    \ class except for method block, using the word `static` is called class variable.\n\
    \n### Object creation\nOf course, since a class is a template, you will have to\
    \ create objects using that template. The keyword `new` is used to create objects.\
    \ There are three steps to creating an item:\n1. The first step is to declare\
    \ a variable for the object.\n2. The second step is to create the object using\
    \ the `new` keyword.\n3. Finally, the object must be initialized using the constructor\
    \ for the class.\n\nIf the third step is omitted, Java uses the default constructor\
    \ to initialize the object. All these steps are combined into one object creation\
    \ statement. For example, we have a `DemoClass` and we want to create an `o1`\
    \ object, this can be done with the statement:\n\n```\nDemoClass o1 = new DemoClass\n\
    ```\nThe variables and methods of the class for which the object is created can\
    \ be accessed using `.` operator. Therefore, if we have a `DemoClass` with variable\
    \ `x` and create an `o1` object, then we can access `x` with the following statement:\
    \ `o1.x`.\n\n### Constructors\nWhen you go into creating classes and objects,\
    \ the first thing you need to do is initialize the object. Java has a dedicated\
    \ implementation of an initialization method called a constructor. These elements\
    \ are implemented like methods but have the same name as the class and do not\
    \ have a return type.\n\nSo where can you use a constructor? You can use it every\
    \ time you create an object of a class and need to initialize certain parameters\
    \ or perform some function that is common to all class objects. For example, if\
    \ you create a class named `rectangle`. You can create a constructor that initializes\
    \ the length and width of the rectangle.\n\nIf you don't define a constructor,\
    \ Java will use the default constructor for your program. This initializes the\
    \ value of all class parameters to zero. So, if you created a class, your program\
    \ will have a constructor active whether you define it explicitly or not.\n\n\
    Now let's create a class with an explicit constructor and see how the concept\
    \ works.\n\n```\nclass SampleClass1 {\n    int i;\n    SampleClass1 () {\n   \
    \     i = 100;\n    }\n}\n\npublic class DemoSampleClass1 {\n    public static\
    \ void main (String args []) {\n        SampleClass1 c1 = new SampleClass1 ();\n\
    \        SampleClass1 c2 = new SampleClass1 ();\n        System.out.println(c1.i\
    \ + \"\\n\" + c2.i);\n    }\n}\n```\nThe following screenshot shows the code and\
    \ the output generated after execution. To run this you need to create two files,\
    \ each with the name of the class it contains. ![image-7] ![image-8] ![image-9]\n\
    \nIn the example above, your program may require parameter initialization. For\
    \ that, you need to implement parameterized constructors. Such constructors take\
    \ a parameter to the constructor method.\n\n```\nclass SampleClass2 {\n    int\
    \ i;\n    SampleClass2 (int x) {\n        i = x;\n    }\n}\n\npublic class DemoClass2\
    \ {\n    public static void main (String args []) {\n        SampleClass2 c1 =\
    \ new SampleClass2 (100);\n        SampleClass2 c2 = new SampleClass2 (200);\n\
    \        System.out.println(c1.i + \"\\n\" + c2.i);\n    }\n}\n```\nThe output\
    \ for this code is illustrated below. ![image-10] ![image-11]\n\nWhen referring\
    \ to the implementation of constructors, the keyword is specially `this`. It is\
    \ used in relation to the subject of the class. You can use `this` to access class\
    \ variables inside a constructor or methods.\n\n```\nclass SampleClass3 {\n  \
    \  int i;\n    SampleClass3 (int i) {\n        this.i = i;\n    }\n}\n\npublic\
    \ class DemoClass2 {\n    public static void main (String args []) {\n       \
    \ SampleClass3 c1 = new SampleClass3 (200);\n        SampleClass3 c2 = new SampleClass3\
    \ (200);\n        System.out.println(c1.i + \"\\n\" + c2.i);\n    }\n}\n```\n\
    When executed, this code produces the following output: ![image-12] ![image-13]\n\
    \n### Variable arguments\nIn some programs, there may be a requirement where you\
    \ do not know the exact number of arguments that the `main` method will give during\
    \ execution. To allow dynamics of this level, the var-args arguments or variable\
    \ arguments are used. Var-args are declared in a method parameter using the syntax:\n\
    \n`<type>... <variable_name>`\n\nThe `variable_name` given in the variable declaration\
    \ is an array containing all the variable values sent by the `main` method during\
    \ execution. Before implementing this concept, there are two things to keep in\
    \ mind:\n- Only one var-args can be implemented per method.\n- If the method has\
    \ other arguments (inherently regular), these arguments must appear before var-args.\
    \ In other words, var-args must be the last argument in the method.\n\nAn exemplary\
    \ implementation of this concept is given below.\n\n```\nclass DemoVarArgs {\n\
    \    public static void main (String args []) {\n        printNum (56.5, 3, 34,\
    \ 2, 3);\n        printNum (new double [] {2, 1, 3});\n    }\n\n    public static\
    \ void printNum (double ... number) {\n        if (number.length == 0) {\n```\n"
