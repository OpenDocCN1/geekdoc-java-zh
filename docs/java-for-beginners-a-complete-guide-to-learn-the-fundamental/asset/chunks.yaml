    - 回车 `\\r`\n- 换行 `\\n`\n- 退格 `\\b`\n- 换页 `\\f`\n- 制表符 `\\t`\n- 空格 `\\s`\n- 单引号\
    \ `'`\n- 双引号 `\\\"`\n- 十六进制字符 `\\xxxx`\n- 八进制字符 `\\ddd`\n- 反斜杠 `\\\\`\n\n### 第\
    \ 4 章：变量\n\n变量最简单的定义是赋予内存某个区域的名称。然而，Java 支持许多类型的变量。根据变量的类型，决定以下参数：\n- 变量锁定的内存大小。锁定的内存布局。\n\
    - 可以在变量上执行的操作。变量可以包含的值范围。\n\n根据规则，每个变量在使用之前必须先声明。变量声明的标准格式为：\n`data_type var_name;`\n\
    \n这里 `data_type` 是变量的数据类型，而 `variable_name` 是用于变量的标识符。如果你使用多个相同类型的变量，可以通过用逗号分隔变量名将它们合并在同一语句中。如前所述，Java\
    \ 支持三种类型的变量，即类变量、实例变量和局部变量。\n\n#### 局部变量\n\n在方法或块内部声明的变量对于作用域是局部的，被称为局部变量。变量在声明并定义于块时创建。此外，它在块执行完毕时被销毁。这种类型的变量不能使用访问修饰符（后文描述）。由于这种变量仅在方法的作用域内有效，因此只能在该块中访问。在内部，局部变量是在栈级别（stack\
