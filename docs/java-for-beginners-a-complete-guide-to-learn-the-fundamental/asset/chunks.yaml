- fmt: "\nTo help you understand this concept, let's take an example. Suppose we create\
    \ a class named `car`. `Car` is the general term for all small four-wheeled vehicles.\
    \ However, each `car` has a different set of specificifications, such as make,\
    \ color, engine, transmission type, and functions. These features can be modified.\
    \ For example, you can change the color or enhance the function.\n\nSo a `car`\
    \ is a template (or in our case a class), but specific cars are objects or instances\
    \ of that class. The specification set is variables, and any initializations or\
    \ manipulations we do on those variables are performed using methods.\n\nThis\
    \ example can also be best used to understand object-oriented principles of encapsulation\
    \ and abstraction. The class contains variables and methods. So as a user, you\
    \ only deal with a class `car` and its implementation is hidden from you. This\
    \ is how Java implements the abstraction.\n\nThe best way to learn programming\
    \ is to write programs. So here is an example program to try. We will also use\
    \ this program to explain the basic syntax of the java programming language.\n\
    \n```java\npublic class SampleJavaProgram {\n    /* This program prints Hello\
    \ World! on the screen * /\n    public static void main(String [] args) {\n  \
    \      System.out.println (\"Hello world!\"); // printable statement\n    }\n\
    }\n```\n\nTo write, compile and run this program, please follow the instructions\
    \ given below:\n\n1. Using any text editor, create a text file and copy this code\
    \ to the same. Save the file as `SampleJavaProgram.java`.\n2. Compile and run\
