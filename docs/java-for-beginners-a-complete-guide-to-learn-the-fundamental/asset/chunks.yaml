  trans: "\n\n当我们声明变量时，基本上是在锁定内存中的一段空间并给它一个引用名称，以便我们稍后访问它并操作其内容。为变量保留的内存容量取决于声明时指定的数据类型。因此，通过为变量赋予不同的数据类型，你可以为内存中的变量保留不同大小的内存。Java\
    \ 中主要有两种类型：基本数据类型和引用类型。\n\n### 基本数据类型\n\nJava 支持八种基本数据类型，每种数据类型都有一个对应的关键字，用于在该数据类型内声明变量。这些数据类型包括：\n\
    \n- `byte`\n- `short`\n- `int`\n\n#### byte\n- 最大值 = 127（包含) (2 ^ 7 -1)\n- 最小值\
    \ = -128 (-2 ^ 7)\n- 8 位符号位补码。\n- 默认值 = 0\n这种数据类型通常用于需要节省内存的情况。`byte` 数据类型用于在大型数组中节省空间，通常代替整数，因为\
    \ `byte` 是整数的四分之一。\n\n#### short\n- 最大值 = 32,767（包含) (2 ^ 15 -1)\n- 默认值 = 0\n\
    - 最小值 = -32,768 (-2 ^ 15)\n- 16 位补码符号整数。\n这是另一种在需要节省内存时使用的类型。\n\n#### int\n- 默认值\
    \ = 0\n- 最大值 = 2,147,483,647（包含） (2 ^ 31 -1)\n- 32 位二进制符号补码整数。\n这是用于所有整数值的默认数据类型。默认值为\
    \ `0L`。\n\n#### long\n- 最小值 = -2,147,483,648 (-2 ^ 31)\n- 64 位符号位补码整数。\n- 最大值\
    \ = 9,223,372,036,854,775,807（包含） (2 ^ 63 -1)\n当变量需要包含大数字时使用此值。\n\n#### float\n\
    - 默认值 = 0.0f\n- 32 位 IEEE 754 浮点单精度。\n这种数据类型用作存储浮点数的默认数据类型。避免使用这种数据类型存储需要精确计算的数值。\n\
    \n#### double\n- 64 位 IEEE 754 浮点双精度。\n- 默认值 = 0.0d\n这种数据类型用于必须持有小数值的变量。然而，与 `float`\
