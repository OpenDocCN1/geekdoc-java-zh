  trans: "\n当你在源文件中使用一个类但该类的实现在另一个文件中时，你必须告知编译器该文件的位置。`import` 指令在此处适用。通过 `import`\
    \ 语句，你可以将给定源文件中使用的源文件和类组合，但它们的实现位于其他文件中。\n\n# 第 7 章：做出决策\n\n决策结构用于以下场景：当条件为真时，必须执行一组指令；当条件被认为为假时，必须执行另一组指令。Java\
    \ 中提供了几种结构来用于此类此类场景。这些结构包括：\n\n### if 语句\n\n该语句用于必须测试条件的情况，如果条件被认为为真，则必须执行语句后续的代码块。该构造的语法为\
    \ -\n\n```\nif (condition) {\n    /*Body*/\n}\n```\n\n下面是该构造的一个示例实现 -\n\n```\n\
    class ifDemo {\n    public static void main (String args []) {\n        int i\
    \ = 10;\n        int j = 1; if (i> j) {\n            System.out.print(i);\n  \
    \      }\n    }\n}\n```\n\n该代码执行后的输出是：\n![Image](img/image-1.jpeg)\n\n### else\
    \ 语句\n\n该语句用于必须测试条件的情况，如果条件被认为为真，则执行该语句后续的代码块，否则将执行 `else` 之后的代码块。该构造的语法为 -\n\n\
    ```\nif (condition) {\n    /*Body*/\n}else {\n    /*Body*/\n}\n```\n\n下面是该构造的一个示例实现\
    \ -\n\n```\nclass elseDemo {\n    public static void main (String args []) {\n\
    \        int i = 1;\n        int j = 0; if (i> j) {\n        }else{\n        }\n\
    \        System.out.print(i);\n        System.out.print(j);\n    }\n}\n```该代码执行后的输出输出是：\n\
    ![Image](img/image-17.jpeg)\n![Image](img/image-18.jpeg)\n\n### 嵌套 if 语句\n\n该语句用于必须测试条件的情况，如果条件被认为满足，则执行该语句后续的块，否则测试下一个条件。如果发现此条件为真，则执行与该条件对应的\
    \ `if` 语句的块。如果两个条件都不为，则执行 `else` 之后的块。可以使用嵌套 `if` 语句测试许多条件。该构造的语法为 -\n\n```\n\
    if (condition1) {\n    /*Body*/\n}else if (condition2) {\n    /*Body*/\n}else\
    \ {\n    /*Body*/\n}\n```\n\n下面是该构造的一个示例实现 -\n\n```\nclass nestedIfDemo {\n  \
    \  public static void main (String args []) {\n        int i = 0;\n        int\
    \ j = 0; if (i> j) {\n            System.out.print(i);\n        }else if (j> i)\
    \ {\n            System.out.print(j);\n        }else {\n        }\n    }\n   \
    \ System.out.print (\"Equal\");\n}\n```该代码执行后的输出是：\n![Image](img/image-19.jpeg)\n\
    \n### switch \n\n如果你有一个变量，并且需要根据该变量的不同值执行不同的代码块，你可以使用的理想构造是 `switch` 语句。该构造的语法为\
    \ -\n\n```\nswitch (variable) {\n    case value1:\n        /* body*/ break;\n\
    \    case value2:\n        /* body*/ break;\n    case value3:\n        /* body*/\
    \ break;\n    default:\n        /* body*/ break;\n}\n```\n\n下面是该构造的一个示例实现 -\n\n\
    ```\nclass switchDemo {\n    public static void main (String args []) {\n    \
    \    int i = 5;\n        switch (s) {\n            case 0:\n                System.out.print(0);\
    \ break;\n            case 2:\n                System.out.print(2); break;\n \
    \           case 5:\n                System.out.print(5); break;\n           \
    \ default:\n                System.out.print(999); break;\n        }\n    }\n\
    }\n```该代码执行后的输出是：\n![Image](img/image-20.jpeg)\n\n### 三元运算符\n\nJava 同样支持条件运算符，也称为\
    \ `?:`。该运算符用于替代 `if else` 构造。它的语法如下：`expression1?expression2:expression3`，其中 `expression1`\
    \ 是要测试的条件。如果为真，则执行 `expression2`，否则执行 `expression3`。\n\n# 第 8 章：循环控制\n\n有几种情况需要一组指令重复执行。例如，如果你想对一组数字进行排序，你必须扫描并重复该组几次以获得所需的布局。这种执行流被称为循环。循环是一种允许你多次执行代码块的构造。Java\
    \ 支持几种可以实现循环的构造。这些包括 `while` 循环、`for` 循环和 `do while` 循环。\n\n`while` 循环遍历块，直到 `while`\
    \ 循环指定的条件为真。一旦该条件失败，循环就会停止。\n\n`for` 循环允许程序员在同一个构造中操纵条件和循环变量。因此，你可以初始化一个循环变量，对其进行增/减操作，并运行循环直到该变量的条件满足。\n\
    \n`do while` 循环类似于 `while` 循环。然而，在 `while` 循环中，在执行块之前测试条件。相反，在 `do while` 循环中，执行代码块然后测试条件。如果条件为真，则重启循环。`do\
    \ while` 循环至少执行一次。\n\n### 循环语句\n\n有两个关键字专门与循环结合使用，被称为循环控制语句，因为它们允许你将控制从一个代码部分转移到另一部分。这些关键字是\
    \ -\n\n`break` 用于循环内部，立即结束循环执行。\n\n`continue` 用于循环内部，跳过循环的剩余部分并移动到第一个语句。\n\n为了帮助你理解循环是如何执行的，让我们通过一个示例使用三种循环类型来实现。\n\
    \n#### for 循环的实现\n\n```\nclass forDemo {\n    public static void main (String\
    \ args []) {\n        int [] numArray = {100, 300, 500, 700, 900}; for (int i\
