    # Introduction

    Java is a high-level cross-platform language that was developed by Sun Microsystems
    under the leadership of James Gosling. The first version of this language was
    released in 1995 as Java 1.0 [J2SE]. Java has come a long way since then and we
    are currently working on Java 8. In addition, several versions of Java have also
    been released, such as J2ME (Java for mobile applications) and J2EE (Java for
    enterprise applications). Java was released as open source software under the
    GNU GPL license by Sun in 2006. The process of this transformation ended in 2007.


    This book is a beginner''s course in Java Basics. Therefore, it was created with
    the reader in mind that there is little basic knowledge of Java. However, a little
    background of programming languages will help you better understand. With this
    course, we hope to instill the reader the basics of programming perspective with
    special emphasis on Java. Before you start, it''s good to understand that programming
    concepts are general and apply to many languages. Therefore, if you work on creating
    concept of learning the syntax, you will be able to learn multiple languages with
    minimal effort. Focus on the concept!


    # Chapter 1: Getting Started with Java

    Before we get into programming Java, we''ll give you a brief background of Java,
    the programming language, and the prerequisites for learning that language. One
    the most important features of this programming language is that it is cross-platform.
    This is because Java was advocated under the slogan "Write Once, Run Anywhere".
    So all you need to do is write the code, compile it and then you can run it on
    any system Windows, Linux or Macintosh.


    In addition, other features include:

    - Platform independence

    - Object oriented

    - Simple and portable

    - Architecture independent interpretation

    - Robust multithreaded

    - Dynamic

    - High performance


    ## Requirements to get started

    To start developing in Java, you must first have a working Linux, Windows, or
    Macintosh computer. You will be using two Java tools on this system. The first
    of these tools is a text editor. If you are working on Windows, you can use Notepad.
    For other operating systems, you can try TextEdit or another available text editor.
    The second requirement for Java programming is Java 8. You will need to install
    Java 8 on your system. If you don''t want to work on local environment configuration,
    you can also try one of online options available to compile and run your Java
    programs.


    ### Preparation for local configuration

    Assuming you have a system ready and you already have a text editor installed
    on your system, we go straight to installing Java on your system. For starters,
    you need to download Java Java SE is a free version that can be downloaded using
    the link that Google search engine provides. Be sure to download the version developed
    for your operating system.


    After the download is complete, you will have an executable that you need to run
    in order to install. After the installation is complete, you will get a message
    about the same. However, it is not over yet. Java won''t work until you set your
    environment variables. You can set environment variables on your system using
    the following instructions -


    ### Windows

    In all likelihood, the version of Java you installed by clicking on the `.exe`
    file that came with the installation package had to be in the directory: `c:\Program
    Files\java\jdk`. Assuming this, you just need to open the Properties by clicking
    on "My Computer". In the dialog box, open "Environment Variables". Include the
    existing field with `C:\Program Files\java\jdk`.


    ### Linux / Mac

    As the path environment variable is where Java installation are placed. You can
    search for these then edit the `.bashrc` file. After opening this file with any
    editor, add:

    ```

    export PATH=/path/to/java

    ```

    While the standard way to run Java programs is to create `.java` files in Notepad
    or any editor and then run with commands, over the years, several IDEs have emerged
    such as IntelliJ and Eclipse. You can read about them on Internet.


    # Chapter 2: Writing Your First Java Program

    Java implements the principles of object-oriented programming. Therefore, a Java
    program is a class that creates objects when executed. These objects communicate
    with each other through methods. The following explains some of the terms commonly
    -


    The basic element of a Java program is Class. It is simply a template that defines
    the state and behavior of an object.


    The state of the object is defined by Variables, and the behavior is described
    by Methods. Therefore, the class contains variables and methods. It should be
    mentioned here that each object created with the class has its own set of variables,
    and therefore variables are also called Instance Variables.

