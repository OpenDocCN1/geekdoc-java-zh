    \ implementing static variables is given below:\n\n```java\nimport java.io. *\
    \ \npublic class SVDemo {\n    private static double salaryEmp;\n    public static\
    \ final String DEPARTMENTEMP = \"DevRD\";\n    public static void main (String\
    \ args []) {\n        salaryEmp = 1000;\n        System.out.println (DEPARTMENTEMP\
    \ + \" Salary       =       \" + salaryEmp);\n    }\n}\n```\n\nThe code result\
    \ can be seen in the image below. ![Image](images/image-6.jpeg)\n\n# Modifier\
    \ types\n\nThe behavior and access to variables can be modified using modifiers.\
