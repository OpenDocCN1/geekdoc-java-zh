  trans: "\n捕获异常的标准方法是使用“try and catch”关键字以及它们的代码实现。这个 try and catch 块必须以这种方式实现：包含要抛出异常的代码。在这里还应该提到，准备抛出异常的代码被称为保护代码（protected\
    \ code）。实现 try and catch 块的语法如下：\n\n```\nto try {\n    /* Protected code * /\n\
    } catch (exception name exc1) {\n    /* Catch code * /\n}\n```\n\n抛出异常的代码放置在 try\
    \ 块中。如果抛出异常，则在 catch 块中实现处理该异常的适当操作。每一个 try 块必须包含一个 catch 块或一个 finally 块。\n\n\
    在 catch 语句中，你必须声明要抛出的异常。如果发生异常，执行流将转移到 catch 块。如果抛出的异常与 catch 块中定义的异常相匹配，则执行该\
    \ catch 块。\n\n下面给了一个 try and catch 块的示例实现。该代码实现了一个包含 2 个元素的数组。然而，代码尝试访问不存在的第三个元素。结果是抛出了异常。\n\
    \n```java\nimport java.io.*;\n\npublic class demoexception {\n    public static\
    \ void main (String args []) {\n        try {\n            int tab [] = new int\
    \ [2];\n            System.out.println (\"Access to the third array element:\"\
    \ + arr [3]);\n        } catch (ArrayIndexOutOfBoundsException exp) {\n      \
    \      System.out.println (\"Catching Exception:\" + exp);\n        }\n      \
    \  System.out.println (\"Reached outside of capture block\");\n    }\n}\n```\n\
    \n此代码的输出显示如下所示。\n\n![Image](img/image-26.jpeg)\n![Image](img/image-27.jpeg)\n\n\
    ## 实现多个 catch 块\n\n一个代码块可能会导致许多异常。为了满足这一需求，允许使用多个 catch 块。此类实现的语法如下所示。\n\n```\n\
    to try {\n    /* Protected code * /\n} catch (ExpType1 exp1) {\n    /* Catch Block\
    \ 1 * /\n} catch (ExpType2 exp2) {\n    /* Catch block 2 * /\n} catch (ExpType3\
    \ exp3) {\n    /* Catch Block 3 * /\n}\n```\n\n上面的语法说明了三个 catch 块的实现。然而，你可以根据需要实现任意多个\
    \ catch 块。当这段代码执行时，会执行保护代码。如果发生异常，除第一个 catch 块外，将对异常类型进行匹配。然而，如果异常类型不匹配，将忽略 catch\
    \ 1 块，并尝试匹配第二个 catch 块的异常类型。只要 catch 块的异常类型与抛出的异常类型相同，就会执行适当的 catch 块。\n\n###\
    \ 关键字：Throw / throws\n\n这两个关键字是相似的词，但用途完全不同。`throws` 关键字用于方法名末尾，用于声明代码抛出了受检异常（checked\
    \ exception），但方法本身不处理。换句话说，这个关键字用于延迟处理抛出的异常。另一方面，`throw` 关键字用于字面上的抛出异常。这个异常可以是一个新产生的异常，也可以是之前发生的异常。下面提供了一个说明\
    \ `throw` 和 `throws` 用法的示例代码。\n\n```java\nimport java.io.*;\n\npublic class class\
    \ {\n    public void depositMethod(double amount) throws Exception {\n       \
    \ /* Implementation * /\n        throw new Exception ();\n    }\n}\n```\n\n方法可能会抛出多个异常。要在方法语句中声明这些异常，你可以提供一个异常列表。下面是该概念的示例实现。\n\
    \n```java\nimport java.io.*;\n\npublic class class {\n    public void withdraw(double\
    \ amount) throws Exception, InsufficientException {\n        /* Implementation*/\n\
    \    }\n}\n```\n\n## Finally Block\n\n现在你已经了解了 try 和 catch 块，让我们来看看异常处理中使用的第三个块：finally\
    \ 块。这是在 try 和 catch 块之后出现的最后一个块。此外，如果没有找到异常，可以跳过 catch 块的执行，但无论是否发生异常，finally\
    \ 块始终会被执行。\n\n此块的目的是执行开发者可能认为必要的任何清理工作。无论 try 块中的代码发生了什么，你都执行这段代码。该块的语法及其实现方式所示。\n\
    \n```\nto try {\n    /* Protected code * /\n} catch (ExpType1 exp1) {\n    /*\
    \ Catch Block 1 * /\n} catch (ExpType2 exp2) {\n    /* Catch block 2 * /\n} catch\
    \ (ExpType3 exp3) {\n    /* Catch Block 3 * /\n} finally {\n    /* Finally block\
    \ implementation * /\n}\n```\n\n为了使概念更清晰，下面提供了实现该概念的示例代码。\n\n```java\npublic class\
    \ demo Exception {\n    public static void main (String args []) {\n        int\
    \ arr [] = new int [2];\n        try {\n            System.out.println (\"Access\
    \ to the third item:\" + arr [3]);\n        } catch (ArrayIndexOutOfBoundsException\
    \ exp) {\n            System.out.println (\"Catching Exception:\" + exp);\n  \
    \      } finally {\n            arr [0] = 5;\n            System.out.println (\"\
    The first item is:\" + arr [0]); \n            System.out.println (\"Block Completed\"\
    );\n        }\n    }\n}\n```\n\n代码结果显示如下所示。\n\n![Image](img/image-28.jpeg)\n\n\
    在实现 try catch finally 块时，总有几点需要注意。首先，没有 try 就没有 catch。同样，finally 是一个选项，即使没有 catch，try\
    \ 也可以工作。\n\n## 自定义异常\n\nJava 允许你定义自己的异常。然而，在此之前，有几点你需要注意。首先，任何异常必须是 `Throwable`\
    \ 类的派生类或子类。要实现异常，你必须扩展 `Exception` 类。然而，实现运行时异常必须扩展 `RuntimeException` 类。\n\n\
    定义异常的标准方法是\n\n```java\nclass demoexception extends Exception {}\n```\n\n以下代码展示了自定义异常的实现和使用。\n\
    \n```java\nimport java.io.*;\n\npublic class InsufficientException extends Exception\
    \ {\n    private double amount;\n\n    public InsufficientException(double amount)\
    \ {\n        this.amount = amount;\n    }\n\n    public double getAmount() {\n\
    \        return amount;\n    }\n}\n```\n\n## 总结\n\n本书提供了 Java 基础入门教程。我们涵盖了 Java\
    \ 编程的所有基础概念以及你开始 Java 编程所需的所有内容。现在你已经熟悉了所有的 Java 基础概念，并假设你尝试了书中的所有代码，你可以转向高级 Java\
    \ 编程了。\n\n成为编程专家的关键（无论使用哪种编程语言）在于实践。你练习越多，你的编程能力就越强！我们希望你喜欢这本书，并且它帮助你获取了 Java\
    \ 的基础知识。我们希望我们为你创造了正确的基础，帮助你提高技能并成为 Java 编程专家。\n"
