    }\n\ndouble resultNum = number [0];\n\nfor (int x = 1; x <number.length; x ++)\
    \ \n    if (number [x]> resultNum)\n        resultNum = number [x];\n\nSystem.out.println\
    \ (\"The maximum value in a set of numbers is\" + ScoreNum);\n\n}\n```\n\n代码输出如下图所示。\n\
    \n![Image](img/image-1.jpeg)\n\n# 部署方法\n\n一组用于执行操作的语句组被称为方法。你可以看到，在上面的大多数程序中，打印语句都调用了\
    \ `system.out.println()`。该方法在屏幕上打印提供的字符串。\n\n就像这种内置方法一样，开发者也可以针对特定的问题描述创建方法。用户定义的方法可能有参数，也可能没有，它们可能有返回值，也可能没有。创建方法的标准指令是——\n\
    \n```java\npublic static int methodDemo (int i, int j) {\n    /*body*/\n}\n```\n\
    \n这里 `methodDemo` 是方法的名称，`i` 和 `j` 是该方法接受的 int 类型参数。方法的实现逻辑位于花括号中。此外，还会注意到函数声明中写了三个单词——`public`、`static`\
    \ 和 `int`。这里，`int` 是方法的返回类型，而 `public static` 是修饰符。此示例方法可以修改以适应开发者的需求。\n\n实现该方法的示例代码所示：\n\
    \n```java\npublic static int minCalcDemo (int num1, int num2) {\n    int minVal;\n\
    \    if (number1> number2)\n        minWart = number2;\n    else\n        minVal\
    \ = number1;\n    return minVal;\n}\n```\n\n该方法确定了提供的两个参数值之间哪一个最小，并将该结果返回给调用者方法。现在你已经了解了方法以及如何实现它们，是时候谈谈这些方法如何在整个代码中被使用了。\n\
    \n## 方法调用\n\n在使用方法之前，必须对其进行调用。如你在上面提供的示例代码所示，方法的作用是执行某些计算并返回计算结果。此类方法返回一个值，其返回类型已经在方法声明中指定。此外，还有另一种类型的方法。此类方法不返回任何内容，通常被称为无返回值方法。\n\
    \n当程序调用方法时，控制权从程序传递到方法，并开始执行。当遇到 `return` 语句时，控制权传回调用者。在没有 `return` 语句的情况下，遇到花括号时控制权会自动传回。这通常发生在没有返回值的方法中。\n\
    \n对于返回值的方法，返回类型在方法声明中提到。相反，对于不返回内容的方法，返回类型为 `void`。为了调用方法 method，调用程序中必须出现以下语句：\n\
    \n```java\nint result;\nresult = minCalc (5, 6);\n```\n\n由于 `minCalc` 返回一个 `int`，该值应该被收集在变量\
    \ `result` 中。调用方法会产生该方法所需的两个参数值。这种方法调用也被称为按值调用或传递。你可能会遇到具有不同类型参数和许多参数的情况。在这种情况下，你必须按照你希望的顺序提供参数值，以避免编译或运行时错误。\n\
    \n## 方法重载\n\n可以拥有相同名称但参数不同的方法。当调用方法时，系统会检测与调用语句中提供的参数类型数量相匹配的方法，并将控制权传递给适当的方法。这种方法实现的形式被称为方法重载。不要将此概念与重写（overwriting）混淆。在重写方法时，方法的名称、参数以及参数数量也是相同的。\n\
    \n为了理解这个概念，让我们来看一个例子——\n\n```java\nclass overloadDemo {\n    public static void\
    \ main (String [] args) {\n        int x = 34;\n        int y = 56;\n        double\
    \ z = 10.5;\n        double u = 7.8;\n        int resultxy = minCalc (x, y);\n\
    \        double result = minCalc (z, u);\n        System.out.println (\"Minimum\
    \ value (integers) =\" + resultxy);\n        System.out.println (\"Minimum (double)\
    \ value =\" + result);\n    }\n\n    public static int minCalc (int num1, int\
    \ num2) {\n        int minVal;\n        if (number1> number2)\n            minWart\
    \ = number2;\n        else\n            minVal = number1;\n        return minVal;\n\
    \    }\n\n    public static double minCalc (double number1, double number2) {\n\
    \        double minVal;\n        if (number1> number2)\n            minWart =\
    \ number2;\n        else\n            minVal = number1;\n        return minVal;\n\
    \    }\n}\n```\n\n代码实现了两个具有相同名称 `minCalc` 但带有两种不同类型参数的方法。一个方法使用两个 `int` 类型的参数并返回\
    \ `int` 类型。另一方面，该方法的第二个实现使用了 `double` 参数并返回 `double` 值。此代码的输出如图像所示。\n\n![Image](img/image-15.jpeg)\n\
    \n## 使用命令行参数\n\n有一些程序需要在运行时提供参数。这些参数作为命令行传递给程序。当在命令行上执行程序时，这些参数会被分配给程序。在程序中访问这些参数的方式如下所示所示：\n\
    \n```java\nclass commandLineDemo {\n    public static void main (String [] args)\
    \ {\n        for (int x = 0; x <args.length; x++)\n            System.out.println\
    \ (\"args [\" + x + \"\" + args[x]);\n    }\n}\n```\n\n从命令行执行以下命令以查看结果：\n`commandLineDemo\
    \ 200 100 10 8 7`\n\n## finalize 方法\n\n在 Java 编程中，你会处理大量的对象，所有这些对象都会占用内存。如果你在处理大型代码，可能需要在退出之前清理这些对象占用的空间。为了方便这种操作，Java\
    \ 有一个名为 `finalize()` 的收集方法。你可以使用该方法来实现程序退出之前执行的操作。该方法的实现如下：\n\n```java\nprotected\
    \ void finalize() {\n    /*implementation*/\n}\n```\n\n在 `finalize()` 方法声明中使用\
    \ `protected` 修饰符是为了防止外部程序在执行之前破坏你的代码。\n\n## 源文件的声明规则\n\n在源文件中编写导入语句、类声明和包语句时有一些规则需要遵守。这些规则如下：\n\
    \n- 源文件不能有多个公共类。源文件中有很多非公共类。\n- 源文件的名称应与文件中公共类的名称相同。此外，文件扩展名应该是 `.java`。\n- 如果你正在处理一个包和一个作为包一部分类，源文件的第一语句必须是包语句。包语句必须是源文件的第一语句。所有其他导入语句必须跟在包语句之后。最后，必须存在类实现。\n\
    \n"
- fmt: "\nWhen you use a class in your source file but the implementation of the class\
    \ is present in another file, you must inform the compiler of the location of\
    \ that file. The import instructions apply here. With the import statement, you\
    \ combine source files and classes that are used in a given source file, but their\
    \ implementation is present in other files.\n\n# Chapter 7: Making Decisions\n\
    \nDecision structures are used in situations where a set of instructions must\
    \ execute if the condition is true, and another set of instructions must be executed\
    \ when the condition is considered false. There are several constructs available\
    \ in Java for programming such scenarios. These structures include:\n\n### If\
    \ the statement\n\nThis statement is used in situations where a condition must\
    \ be tested, and if the condition is considered true, then the code block that\
    \ follows the statement must be executed. The syntax for this construct is -\n\
    \n```\nif (condition) {\n    /*Body*/\n}\n```\n\nAn example implementation for\
    \ this construct is given below -\n\n```\nclass ifDemo {\n    public static void\
    \ main (String args []) {\n        int i = 10;\n        int j = 1; if (i> j) {\n\
    \            System.out.print(i);\n        }\n    }\n}\n```\n\nThe output of this\
    \ code after execution is:\n![Image](images/image-16.jpeg)\n\n### Else statement\n\
    \nThis statement is used in situations where a condition must be tested and if\
    \ the condition is considered true, the code block following that statement must\
    \ execute, otherwise the block following else will be executed. The syntax for\
    \ this construct is -\n\n```\nif (condition) {\n    /*Body*/\n}else {\n    /*Body*/\n\
    }\n```\n\nAn example implementation for this construct is given below -\n\n```\n\
    class elseDemo {\n    public static void main (String args []) {\n        int\
    \ i = 1;\n        int j = 0; if (i> j) {\n        }else{\n        }\n        System.out.print(i);\n\
    \        System.out.print(j);\n    }\n}\n```The output of this code after execution\
    \ is:\n![Image](images/image-17.jpeg)\n![Image](images/image-18.jpeg)\n\n### Nested\
    \ if statement\n\nThis statement is used in situations where a condition must\
    \ be tested and if the condition is considered satisfied, the block following\
    \ that statement must execute, otherwise the next condition is tested. If this\
    \ condition is found to be true, the block corresponding to the if statement for\
    \ this condition is executed. If neither condition is true, the block that follows\
    \ the else is executed. Many conditions can be tested with nested if statements.\
    \ The syntax for this construct is -\n\n```\nif (condition1) {\n    /*Body*/\n\
    }else if (condition2) {\n    /*Body*/\n}else {\n    /*Body*/\n}\n```\n\nAn example\
    \ implementation for this construct is given below -\n\n```\nclass nestedIfDemo\
    \ {\n    public static void main (String args []) {\n        int i = 0;\n    \
    \    int j = 0; if (i> j) {\n            System.out.print(i);\n        }else if\
    \ (j> i) {\n            System.out.print(j);\n        }else {\n        }\n   \
    \ }\n    System.out.print (\"Equal\");\n}\n```The output of this code after execution\
    \ is:\n![Image](images/image-19.jpeg)\n\n### Switch\n\nIf you have a variable\
    \ and you need to execute different blocks of code for different values for that\
    \ variable, the ideal construct that you can use is a switch statement. The syntax\
    \ for this construct is -\n\n```\nswitch (variable) {\n    case value1:\n    \
    \    /* body*/ break;\n    case value2:\n        /* body*/ break;\n    case value3:\n\
    \        /* body*/ break;\n    default:\n        /* body*/ break;\n}\n```\n\n\
    An example implementation for this construct is given below -\n\n```\nclass switchDemo\
    \ {\n    public static void main (String args []) {\n        int i = 5;\n    \
    \    switch (s) {\n            case 0:\n                System.out.print(0); break;\n\
    \            case 2:\n                System.out.print(2); break;\n          \
    \  case 5:\n                System.out.print(5); break;\n            default:\n\
    \                System.out.print(999); break;\n        }\n    }\n}\n```The output\
    \ of this code after execution is:\n![Image](images/image-20.jpeg)\n\n### Conditional\
    \ operator\n\nJava also supports the conditional operator, also known as `?:`.\
    \ This operator is used to override the 'if else' construct. Its syntax is follows\
    \ `expression1?expression2:expression3` where `expression1` is the condition to\
    \ be tested. If true, `expression2` is executed, otherwise `expression3` is executed.\n\
    \n# Chapter 8: Loop Control\n\nThere are several situations that require a set\
    \ of instructions to be repeated. For example, if you want to sort a set of numbers,\
    \ you will have to scan and repeat the set several times to get the layout you\
    \ want. This flow of execution is known as loop. A loop is a construct that allows\
    \ you to execute a block multiple times. Java supports several constructs that\
    \ can be used to implement loops. These include `while` loop, `for` loop, and\
    \ `do while` loop.\n\n`while` loop iterates through the block until the condition\
    \ specified for the while loop is true. The moment this condition fails the loop\
    \ stops.\n\n`for` loop allows the programmer to manipulate the conditions and\
    \ the loop variable in the same construct. Therefore, you can initialize a loop\
    \ variable, increment/decrement it, and run the loop until the condition on that\
    \ variable is satisfied.\n\n`do while` loop is similar to `while` loop. However,\
    \ in `while` loop, the condition is tested before the block is executed. On the\
    \ other hand, in `do while` loop, a block of code is executed and then the condition\
    \ is tested. If the condition is true, loop execution is restarted, otherwise\
    \ the loop terminates. It would not be wrong to say that a `do while` loop once\
    \ implemented will be executed at least once.\n\n### Loop statements\n\nThere\
    \ are two keywords that are specifically used in conjunction with loops and are\
    \ also referred to as control statements because they allow you to transfer control\
    \ from one section of code to another. These keywords are -\n\n`break`\nUsed inside\
    \ the loop where you want the execution flow to end the loop and immediately begin\
    \ execution at the first statement that comes after the loop.\n\n`continue`\n\
    Used inside the loop at the point the developer wants wants computer to overlook\
    \ the rest of the loop and move the control to the first statement of the loop.\n\
    \nTo help you understand how loops are executed, let's take an example and implement\
    \ it using all three types of loop control.\n\n#### For the implementation of\
    \ the loop\n\n```\nclass forDemo {\n    public static void main (String args [])\
    \ {\n        int [] numArray = {100, 300, 500, 700, 900}; for (int i = 0; i <5;\
    \ i ++) {\n            System.out.print(numArray[i]); System.out.print(\",\");\n\
    \        }\n        System.out.print (\"\\n\");\n    }\n}\n```The output of this\
    \ code after execution is:\n![Image](images/image-21.jpeg)\n\n#### Implementing\
    \ a loop\n\n```\nclass whileDemo {\n    public static void main (String args [])\
    \ {\n        int [] numArray = {100, 300, 500, 700, 900}; int i = 0;\n       \
    \ while (i <5) {\n            System.out.print(numArray[i]); System.out.print(\"\
    ,\");\n            i++;\n        }\n        System.out.print(\"\\n\");\n    }\n\
    }\n```The output of this code after execution is:\n![Image](images/image-22.jpeg)\n\
    \n#### Do while implementing the loop\n\n```\nclass doWhileDemo {\n    public\
    \ static void main (String args []) {\n        int [] numArray = {100, 300, 500,\
    \ 700, 900}; int i = 0;\n        do {\n            System.out.print(numArray[i]);\
    \ System.out.print(\",\");\n            i++;\n        } while (i <5);\n      \
    \  System.out.print(\"\\n\");\n    }\n}\n```The output of this code after execution\
    \ is:\n![Image](images/image-23.jpeg)\n\n### Improved for loops\n\nJava also supports\
    \ an extended loop structure that can be used for array elements. The syntax for\
    \ this loop is -\n\n```\nfor (declaration:expression) {\n    /*Body*/\n}\n```The\
    \ declaration part of the enhanced for loop is used to declare a variable. This\
    \ variable should be local to the \"for loop\" and must be of the same type as\
    \ the type of the array elements. The variable's current value is always equal\
    \ to the array element the loop is passing through. The expression is an array\
    \ or a call to a method that returns an array.\n"
