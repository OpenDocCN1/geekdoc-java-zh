    - **Private**: Available for the class\n- **Protected**: Available for the class\
    \ and its subclasses\n- **Default**: If no keyword is specified, the variable\
    \ is available to the package.\n\n## Modifiers without access\n\nThere are other\
    \ modifiers that are also available in Java. They include:\n\n- `Static`\n- `Final`\n\
    \n# Static Final Summary\nVariable and in sync\n\n# Chapter 5: Operators\n\nYou\
    \ can manipulate variables with operators. There are six classes of operators\
    \ supported by Java. Each of these classes is discussed in detail.\n\n### Arithmetic\
    \ operators\n\nAll math operations are performed using operators belonging to\
    \ the category of arithmetic operators. The list of supported operators is given\
    \ below:\n\n- **Addition (+)**: This operator performs addition between two numbers.\
    \ If `a` and `b` are variables 5 and 6, then `c = a + b` equals 1.\n- **Multiplication\
    \ (*)**: This operator performs multiplication between two numbers. If `a` and\
    \ `b` are variables 5 and 6, then `c = a * b` equals 30.\n- **Subtraction (-)**:\
    \ This operator performs subtraction between two numbers. If `a` and `b` are variables\
    \ 5 and 6, then `c = a - b` equals -1.\n- **Division (/)**: This operator performs\
    \ division between two numbers. If `a` and `b` are variables 10 and 5, then `c\
    \ = a / b` equals 2.\n- **Modulus (%)**: This operator returns the remainder after\
    \ dividing two numbers. If `a` and `b` are variables 10 and 5, then `c = a % b`\
    \ gives 0.\n- **Increment (++)**: This operator adds 1 to the value of the variable.\
    \ If `a` is a variable with value 1, `a++` gives 2.\n- **Decrement (--)**: This\
    \ operator subtracts 1 from the value of the variable. If `a` is a variable with\
    \ value 1, `a--` gives 0.\n\n### Relational operators\n\nAll comparison operations\
    \ are performed using relational operators. The list of operators supported by\
    \ this programming language is:\n\n- **Not Equal (!=)**: This operator is applied\
    \ to two operands. Checks equality of two operands. If they are equal, it returns\
    \ `false`, otherwise returns `true`.\n- **Equal (==)**: This operator is applied\
    \ to two operands. Checks the equality of two operands. If they are equal, it\
    \ returns `true`, otherwise returns `false`.\n- **More Than (>)**: This operator\
    \ is applied to two operands. Checks the equality of two operands. If the first\
    \ operand is greater than the second, it returns `true`, otherwise returns `false`.\n\
    - **Less Than (<)**: This operator is applied to two operands. Checks the equality\
    \ of two operands. If the first operand is less than the second it returns `true`,\
    \ otherwise returns `false`.\n- **Bigger or Equal (>=)**: This operator is applied\
    \ to two operands. Checks the equality of two operands. If the first operand is\
    \ greater than or equal to the second operand, it returns `true`, otherwise returns\
    \ `false`.\n- **Smaller or Equal (<=)**: This operator is applied to two operands.\
    \ Checks the equality of two operands. If the first operand is less than or equal\
    \ to the second operand, it returns `true`, otherwise returns `false`.\n\n###\
    \ Bitwise operators\n\nThe only difference between normal operators and bitwise\
    \ operators is that they perform bit-by-bit operations. Moreover, these operators\
    \ can be applied to `byte`, `int`, `long`. The list of bitwise operators supported\
    \ in Java includes:\n\n- **Bitwise AND (&)**: This operator operates on two operands\
    \ and the output for each set is 1 if both inputs are 1, otherwise the output\
    \ is 0.\n- **Bitwise OR (|)**: This operator operates on two operands and the\
    \ output for each set is 1 if one or both inputs are 1, otherwise the output is\
    \ 0.\n- **Bitwise XOR (^)**: This operator operates on two operands, and the output\
    \ for each set is 1 only if one of the inputs is 1, otherwise the output is 0.\n\
    - **Explanation Negation (~)**: This operator operates on a single operand and\
    \ negates values from 0 to 1 and 1 to 0.\n- **Left Shift (<<)**: This operator\
    \ operates on two operands. The left operand bits are shifted to the left. The\
    \ number of places is equal to the value of the second operand.\n- **Right Shift\
    \ (>>)**: This operator operates on two operands. The bits of the left operand\
    \ are shifted right by the number specified for the value of the second operand.\n\
    - **Zero Fill Right (>>>)**: This operator operates on two operands. The bits\
    \ of the left operand are shifted right by the number specified for the value\
