    # 引言

    Java 是一种高级跨平台语言，由 James Gosling 领导的 Sun 斯克系统公司开发。该语言的第一个版本于 1995 年作为 Java 1.0
    [J2SE] 发布。从那时起 Java 取得了巨大的进步，我们目前正在使用 Java 8。此外，Java 还发布了几个版本，例如 J2ME（移动应用的 Java）和
    J2EE（企业级应用的 Java）。Sun 在 2006 年根据 GNU GPL 许可证将 Java 作为开源软件发布。这一转型在 2007 年结束。


    本书是一门 Java 基础入门课程。因此，在编写本书时，我们考虑到了读者对 Java 基础知识较少这一情况。然而，具备一点编程语言的背景知识将帮助你更好地理解。通过这门课程，我们希望让读者培养编程基础视角，并特别强调
    Java。在开始之前，最好了解编程概念是通用的，适用于许多语言。因此，如果你努力放在构建学习语法的概念上，你将能够以极少的精力学习多种语言。关注概念本身！


    # 第 1 章：开始学习 Java

    在我们开始学习 Java 编程之前，我们将向你简要介绍 Java 这种编程语言的背景以及学习该语言的先决条件。这种编程语言最重要的特征之一是它的跨平台性。这是因为
    Java 是在“一次编写，随运行”（Write Once, Run Anywhere）的口号下被推广的。因此，你只需要编写代码并编译，然后就可以在 Windows、Linux
    或 Macintosh 等任何系统上运行。


    此外，其他特征还包括：

    - 平台无关

    - 面向对象

    - 简单且于移植

    - 架构无关解释

    - 健壮多线程

    - 动态

    - 高性能


    ## 启动要求

    要开始 Java 开发，你必须拥有一台运行良好的 Linux、Windows 或 Macintosh 计算机。你将在系统上使用两个 Java 工具。其中第一个工具是文本编辑器。如果你在
    Windows 上工作，可以使用记事本（Notepad）。系统的第二个要求是 Java 8，你需要在系统中安装它。对于其他操作系统，你可以尝试 TextEdit
    或其他文本编辑器。如果你不想进行本地配置，也可以尝试一些可用的在线选项来编译和运行 Java 程序。


    ### 本地配置准备

    假设你已经准备好了系统，并且已经安装了文本编辑器，我们将直接在系统中安装 Java。对于初学者，你需要下载 Java。SE 版本可以通过搜索引擎提供的链接下载。确保下载适用于你操作系统的版本。


    下载完成后，你将获得一个需要运行的安装执行文件。安装完成后，你会收到提示信息。但在设置环境变量之前，Java 将无法工作。你可以按照以下说明在系统上设置环境变量：


    ### Windows

    极有可能，你通过点击安装包自带的 `.exe` 文件安装的 Java 版本位于目录 `C:\Program Files\java\jdk`。如果是这样你只需点击“此电脑”打开属性。在对话框中，打开“环境变量”。将现有字段包含
    `C:\Program Files\java\jdk`。


    ### Linux / Mac

    环境变量是 Java 安装的位置。你可以搜索这些并编辑 `.bashrc` 文件。用任何编辑器打开此文件后，添加：

    ```

    export PATH=/path/to/java

    ```

