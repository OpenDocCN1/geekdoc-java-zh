    \ 和 `FileWriter`。上面的代码可以修改为使用字符流，如下：\n\n```java\nimport java.io.*;\n\npublic class\
    \ CopyFileCS {\n    public static void main (String args []) throws IOException\
    \ {\n        FileReader inputFile = null;\n        FileWriter outputFile = null;\n\
    \        try {\n            inputFile = new FileReader (\"in.txt\");\n       \
    \     outputFile = new FileWriter (\"out.txt\");\n            int i;\n       \
    \     while ((i = inputFile.read()) != -1) {\n                outputFile.write(i);\n\
    \            }\n        } finally {\n            if (inputFile != null) {\n  \
    \              inputFile.close();\n            }\n            if (outputFile !=\
    \ null) {\n                outputFile.close();\n            }\n        }\n   \
    \ }\n}\n```\n\n将名为 `in.txt` 的输入文件放在类文件相同的文件夹中，并执行代码查看其功能。\n\n## 标准流\n\n为了允许用户从键盘获取数据并将结果打印到屏幕上，Java\
    \ 支持标准流：\n- `System.in` 代表标准输入，允许用户使用键盘输入数据。\n- `System.out` 代表标准输出，允许用户在屏幕上获取输出。\n\
    - `System.err` 代表标准错误，允许用户查看来自系统的错误信息。\n\n下文提供的示例程序允许系统从用户处输入并将输入的内容打印到屏幕上，直到用户按下\
    \ 'q' 键，随后程序退出。\n\n```java\nimport java.io.*; \npublic class demo {\n    public\
    \ static void main (String args []) throws IOException {\n        InputStream\
    \ inputC = System.in;\n        System.out.println (\"Enter characters, 'q' to\
    \ quit.\");\n        char charIn;\n        do {\n            charIn = (char) inputC.read();\n\
    \            System.out.print(charIn);\n        } while (charIn != 'q');\n   \
    \     if (inputC != null) {\n            inputC.close();\n        }\n    }\n}\n\
    ```\n你可以运行此程序查看输出结果以及代码结构。\n\n# 第 10 章：异常处理\n\n异常是任何意料之外的事件，通常是以程序无法处理的方式发生的。当然，在这种情况下，程序的正常执行过程受到阻碍，程序可能会因错误结束或表现异常。这就是为什么需要由程序处理异常的原因。\n\
    \n为什么会产生异常？异常可能由于许多原因引起。导致这种情况的一些场景包括：\n- 无效数据输入：程序尝试打开一个不在指定位置的文件。\n- JVM 内存溢出（out\
    \ of memory）\n- 网络通信过程中系统丢失了网络连接。\n\n当然，异常可能由于系统、用户或程序层面的问题产生。基于这一观察，出现了三类异常。这三种异常类将在本章讨论。\n\
    \n### 检出的异常 (Checked exceptions)\n\n编译器在编译时检查并抛出的异常称为检出的异常。它们也被称为编译时异常，在编写代码时必须由开发者处理。此类错误的异常处理实现示例见下方的示例代码。\n\
    \n```java\nimport java.io.*; import java.io.FileReader; \npublic class demoH {\n\
    \    public static void main (String args []) {\n        File fileDemo = new File\
    \ (\"samplefile.txt\");\n        FileReader inpFile = new FileReader (fileDemo);\n\
    \    }\n}\n```\n如果创建 fileDemo 时指定的句名和位置不存在，编译器将显示 `FileNotFoundException` 错误。\n\
    \n### 未检出的异常 (Unchecked exceptions)\n\n某些异常发生在运行时被称为未检出的异常或运行时异常。逻辑错误、编程错误和不当使用\
    \ API 是这些错误的示例。为了帮助你理解什么是运行时异常，我们来看一个例子。考虑到你实现了一个抛出 `ArrayIndexOutOfBoundsException`\
    \ 的数组。\n\n### 异常层次\n\nJava 有一个名为 `Throwable` 的内置类，所有异常都属于该类。所有异常类都是该类的子类。此外，`Throwable`\
    \ 类是 `Exception` 类的父类。`Throwable` 的另一个子类是 `Error` 类。所有如栈溢出的错误属于 `Error` 类。\n\n\
    `Exception` 类有两个子类，即 `RuntimeException` 和 `IOException`。以下是 `Throwable` 类中定义的方法列表：\n\
    \n- `String getMessage()`：调用时，该方法返回遇到的异常的详细描述。\n- `Throwable getCause()`：调用时，该方法返回包含异常原因的消息。\n\
    - `String toString()`：该方法返回结合了类名的详细描述。\n- `void printStackTrace()`：调用此方法可以将 `toString()`\
    \ 的结果以及堆栈跟踪打印到标准 `System.err` 流。\n- `StackTraceElement[] getStackTrace()`：某些场景可能需要访问堆栈跟踪的不同元素。此方法返回一个数组，堆栈跟踪的每个元素写入数组的不同元素中。数组的第一个元素包含堆栈顶部的元素，而堆栈底端存储在数组的最后一个元素中。\n\
    - `Throwable fillInStackTrace()`：将堆栈跟踪中的之前信息添加到当前堆栈跟踪的内容中，并返回相同的结果。\n\n## 捕获异常\n\
    \n"
- fmt: "\nThe standard method of catching exceptions is to use the \"try and catch\"\
    \ keywords along with their code implementations. This try and catch block must\
    \ be implemented in such a way that it contains the code that is to throw the\
    \ exception. It should also be mentioned here that the code that is supposed to\
    \ raise the exception is referred to as protected code. The syntax for implementing\
    \ a try and catch block is as follows:\n\n```\nto try {\n    /* Protected code\
    \ * /\n} catch (exception name exc1) {\n    /* Catch code * /\n}\n```\n\nThe code\
    \ to throw the exception is placed in a try block. If an exception is thrown,\
    \ the appropriate action to be performed to handle the exceptions is implemented\
    \ in the catch block. It is imperative that every try block contains a catch block\
    \ or a finally block.\n\nWithin the catch statement, you must declare the exception\
    \ to be thrown. If an exception occurs, execution is transferred to the catch\
    \ block. If the exception thrown matches the exception defined in the catch block,\
    \ the catch block is executed.\n\nAn example implementation of a try and catch\
    \ block is given below. The code implements an array with 2 elements. However,\
    \ the code tries to access a third element that does not exist. As a result, an\
    \ exception is thrown.\n\n```java\nimport java.io.*;\n\npublic class demoexception\
    \ {\n    public static void main (String args []) {\n        try {\n         \
    \   int tab [] = new int [2];\n            System.out.println (\"Access to the\
    \ third array element:\" + arr [3]);\n        } catch (ArrayIndexOutOfBoundsException\
    \ exp) {\n            System.out.println (\"Catching Exception:\" + exp);\n  \
    \      }\n        System.out.println (\"Reached outside of capture block\");\n\
    \    }\n}\n```\n\nThe output of this code is shown in the image below.\n\n![Image](images/image-26.jpeg)\n\
    ![Image](images/image-27.jpeg)\n\n## Implementing multiple catch blocks\n\nA code\
    \ block can lead to many exceptions. In order to meet this requirement, multiple\
    \ fishing blocks are also allowed. The syntax for such an implementation is given\
    \ below.\n\n```\nto try {\n    /* Protected code * /\n} catch (ExpType1 exp1)\
    \ {\n    /* Catch Block 1 * /\n} catch (ExpType2 exp2) {\n    /* Catch block 2\
    \ * /\n} catch (ExpType3 exp3) {\n    /* Catch Block 3 * /\n}\n```\n\nThe syntax\
    \ above illustrates the implementation of three catch blocks. However, you can\
    \ implement as many catch blocks as you like. When this code is executed, protected\
    \ is executed. If an exception occurs, the exception type is matched except for\
    \ the first catch block. However, if the exception type does not match, the catch\
    \ 1 block is ignored and tries to match the exception type for the second catch\
    \ block. Wherever catch block has the same exception type as the exception thrown,\
    \ the appropriate catch block will be executed.\n\n### Keywords: Throw / throws\n\
    \nThese two keywords are similar words that are used for completely different\
    \ purposes. The `throws` keyword is used at the end of method name to declare\
    \ that code throws checked exception but method does not handle it. In other words,\
    \ this keyword is used to delay handling of the exception that is thrown. On the\
    \ other hand, the `throw` keyword is used to literally throw an exception. This\
    \ exception can be new or an exception occurred previously. A sample code that\
    \ illustrates the use of throw and throws is provided below.\n\n```java\nimport\
    \ java.io.*;\n\npublic class class {\n    public void depositMethod(double amount)\
    \ throws Exception {\n        /* Implementation * /\n        throw new Exception\
    \ ();\n    }\n}\n```\n\nIt may happen that method may throw more than one exception.\
    \ To declare these exceptions in method statement, you can supply a list of exceptions.\
    \ An example implementation of this concept is presented below.\n\n```java\nimport\
    \ java.io.*;\n\npublic class class {\n    public void withdraw(double amount)\
    \ throws Exception, InsufficientException {\n        /* Implementation*/\n   \
    \ }\n}\n```\n\n## Finally Block\n\nNow that you know the try and catch block,\
    \ let's look at the third block used in exception handling, finally block. This\
    \ is the last block that appears after the try and catch blocks. Moreover, execution\
    \ of the catch block can be skipped if an exception is not found, but the finally\
    \ block is always executed regardless of whether the exception occurs or not.\n\
    \nThe purpose of this block is to perform any cleanup the developer may deem necessary.\
    \ This is the code you want to execute no matter what happens to the code in the\
    \ try block. The syntax of this block and how to implement it is shown below.\n\
    \n```\nto try {\n    /* Protected code * /\n} catch (ExpType1 exp1) {\n    /*\
    \ Catch Block 1 * /\n} catch (ExpType2 exp2) {\n    /* Catch block 2 * /\n} catch\
    \ (ExpType3 exp3) {\n    /* Catch Block 3 * /\n} finally {\n    /* Finally block\
    \ implementation * /\n}\n```\n\nSample code that implements this concept is provided\
    \ below to make the concept clearer.\n\n```java\npublic class demo Exception {\n\
    \    public static void main (String args []) {\n        int arr [] = new int\
    \ [2];\n        try {\n            System.out.println (\"Access to the third item:\"\
    \ + arr [3]);\n        } catch (ArrayIndexOutOfBoundsException exp) {\n      \
    \      System.out.println (\"Catching Exception:\" + exp);\n        } finally\
    \ {\n            arr [0] = 5;\n            System.out.println (\"The first item\
    \ is:\" + arr [0]); \n            System.out.println (\"Block Completed\");\n\
    \        }\n    }\n}\n```\n\nThe code result is shown in the image below.\n\n\
    ![Image](images/image-28.jpeg)\n\nThere are always a few things to keep in mind\
    \ when implementing try catch finally blocks. First, there cannot be catch without\
    \ try. Likewise, finally is an option and your try will work even if you don't\
    \ have catch.\n\n## User-defined exceptions\n\nJava allows you to define your\
    \ own exceptions. Before doing this, however, there are a few things you need\
    \ to keep in mind. First, any exception must be derived or child of `Throwable`\
    \ class. To implement the exception, you will have to extend `Exception` class.\
    \ However, implementing runtime exception must extend `RuntimeException` class.\n\
    \nThe standard method for defining an exception is\n\n```java\nclass demoexception\
    \ extends Exception {}\n```\n\nThe following code shows the implementation and\
    \ use of user-defined exceptions.\n\n```java\nimport java.io.*;\n\npublic class\
    \ InsufficientException extends Exception {\n    private double amount;\n\n  \
    \  public InsufficientException(double amount) {\n        this.amount = amount;\n\
    \    }\n\n    public double getAmount() {\n        return amount;\n    }\n}\n\
    ```\n\n## Conclusion\n\nThis book provides a beginner's tutorial on Java basics.\
    \ We have covered all the basic concepts of Java programming and everything you\
    \ need to get started programming with Java. Now that you have familiarized yourself\
    \ with all the basic Java concepts and assuming you have tried all of the codes\
    \ given in this book, you can move on to Advanced Java Programming.\n\nThe key\
    \ to becoming a programming expert, be it with any programming language, is practice.\
    \ The more you practice, the better your programming skills will be! We hope you\
    \ liked this book and that it helped you gain basic knowledge of Java. We hope\
    \ we have created the right foundation for you to improve your skills and become\
    \ an expert in Java programming.\n"
