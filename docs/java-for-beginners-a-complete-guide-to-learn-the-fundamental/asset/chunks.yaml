    \ OR**: This operator operates on two operands. If one or both operands are nonzero,\
    \ the expression returns `true`, otherwise returns `false`.\n- **Logical NOT**:\
    \ This operator runs on one operand. If the operand is zero, the expression returns\
    \ `true`, otherwise it returns `false`.\n\n### Assignment operators\n\nThe list\
    \ of assignment operators supported by Java includes:\n\n- **Simple assignment\
    \ (=)**: This operator assigns the value computed by the right-hand side to the\
