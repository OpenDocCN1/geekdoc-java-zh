    \       System.out.println(\"Puppy is:\" + puppy);\n    }\n\n    public static\
    \ void main (String args []) {\n        LDemo testObj = new LDemo ();\n      \
    \  testObj.sniffwork ();\n    }\n}\n```\n此代码的输出所示：\n![Image](img/image-2.jpeg)\n\
    ![Image](img/image-3.jpeg)\n\n#### 实例变量\n\n作为类的一部分创建但在任何方法或构造函数作用域之外变量被称为实例变量。这些变量被称为实例变量的原因是，它们在使用该类创建对象之前不会创建。因此，为每个使用\
    \ `new` 关键字创建的类都会创建一个这些变量。此外，在对象被删除或程序执行完毕后，这些变量会被销毁。这些变量可以从该类实现的方法或构造函数访问。可以说实例变量可以使用访问修饰符的类级变量。这些变量有默认值。例如，所有数字的默认值为\
