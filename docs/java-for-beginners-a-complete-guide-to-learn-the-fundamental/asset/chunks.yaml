    \ will create the class file from the java file, while the second command will\
    \ run the program to get the desired result. An example code flow is illustrated\
    \ in the picture below.\n\n![Image](images/image.jpeg)\n![Image](images/image-1.jpeg)\n\
    \nIf you made it so far, you have successfully executed your first java program.\
    \ Now it's time to check out the program to see how we wrote it and why it gave\
    \ the result that it did.\n\n### Conventions\n\nFirst, writing a Java program\
    \ requires following certain conventions. They are listed below -\n\n- Java is\
    \ a case-sensitive language. In other words, `class` and `class` are two different\
    \ Java words. Be careful when using keywords or other program elements.\n- By\
    \ convention, the first letter of each word in a class name should be capitalized.\
    \ For example, if the class name is `Car`, \"C\" should be uppercase. On the other\
    \ hand, if the class name is `SportsCar`, then `S` and `C` must be capitalized\
    \ as they are both the first letters of the two words that make up the class name.\n\
    - Method names also follow the uppercase convention that the first letter of a\
    \ method name must be lowercase. However, if the name consists of more than one\
    \ word, except for the first word, the first letter of any other word must be\
    \ capitalized. For example, if the method name is `add` then \"a\" must be lowercase,\
    \ but if the method name is `addNumbers` then \"a\" will be lowercase and \"N\"\
    \ will be uppercase.\n- The java file name must be the same as the class name\
    \ with `.java` extension. For example, if your class name is `Application`, the\
    \ file name must be `Application.java`. Also, remember that the case must match.\
    \ If you do not meet any of these requirements, you will not be able to compile\
    \ the program.\n- Java program execution starts with `main` method. Therefore,\
    \ every Java program must have a `main` method, and the `main` method in Java\
    \ is defined as `public static void main(String args[])`. But if your program\
    \ doesn't have `main`, the program won't start.\n\n### Identifiers\n\nEach identifier\
    \ is made up of words of English language. Some of these words are part of the\
    \ syntax, others are similar to variables and you define class and method names.\
    \ Words that are part of the syntax are called keywords. On the other hand, all\
    \ user-defined names are identifiers.\n\nThere are some things to know and keep\
    \ in mind about Java. They include:\n- Identifiers can start with letters (lowercase\
    \ or uppercase) and special characters - underscores (`_`) and dollar signs (`$`).\
    \ It also means the identifier cannot start with number of another special character.\n\
    - The use of defined keywords as identifier is not allowed.\n\n### Keywords\n\n\
    Words that are part of the Java programming language and cannot be used as identifiers\
    \ are called keywords. These keywords are -\n\n| | | | |\n| :--- | :--- | :---\
    \ | :--- |\n| Provide | abstract | Break | logic |\n| Catch | char | byte | Case\
    \ |\n| constant | class | Default | continue |\n| otherwise | calculation | do\
    \ | double |\n| final | stretches | Summer | at last |\n| if | gear | Down | go\
    \ to |\n| speech | import | Scepter | int |\n| New | package | long | family |\n\
    | protected | private | Return | public |\n| strict fp | cool | short | static\
    \ |\n| synchronized | switch | Throw | this |\n| to try | vacuum | throws | temporary\
    \ |\n| During | volatile | | |\n\n### Remarks\n\nJava supports single and multiline\
    \ comments. Single-line comments start with `//`, while multiline start with `/*`\
    \ and end with `*/`. You can search for these in the sample code.\n\n### Blank\
    \ lines\n\nAny line that contains a comment or contains no characters or spaces\
    \ is not taken into account by Java. It is just ignored.\n\n### Implementation\
    \ of inheritance\n\nObject-oriented inheritance is implemented in Java using the\
    \ concept of deriving a new class from an existing class. This allows existing\
    \ code to be reused. The existing class is referred to as a superclass, while\
    \ the derived class is referred to as the derived class.\n\n### Interfaces\n\n\
    In the event that two objects need to communicate with each other, a communication\
    \ protocol must be established between the objects. This communication protocol\
    \ is called an interface. This concept is usually used in the implementation of\
    \ inheritance. The interface is used to define the methods that a subclass must\
    \ have. However, it is the subclass that implements these methods.\n\n### Variables\n\
    \nJava supports three types of variables: class variables, local variables and\
    \ instance variables.\n\n### Calculations\n\nThere are some variables that can\
    \ only hold a few values. As a developer, you may want to limit such variables\
    \ to any other value. One such variable is `gender`, which can only have selective\
    \ number of values. Enums allow you to implement such variables. The use of enumerations\
    \ is to reduce errors and was introduced in Java 5.0. It is possible to define\
    \ an `enum` inside or outside a class. In addition, enumerations can have constructors,\
    \ variables, and methods.\n\nChapter 3: Data Types\n"
