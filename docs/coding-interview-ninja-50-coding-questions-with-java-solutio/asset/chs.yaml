- "# 编程面试忍者：50道带Java解决方案的编程题，助力你的面试实践指南\n\n\n\n![](img/00002.jpeg)\n\n# 引言\n\n获得你梦想以的软件工程师工作可能取决于你在编码面试中的表现。这可能是你面试过程中最重要的一部分。\n\
  \n你的招聘官会建议你重新复习大学的算法和数据结构教科书，以温习计算机科学的基础知识。虽然这是必要的，但远远不够。在算法书中看到的问题类型并不是为了让你在短短\
  \ 45 分钟的压力下解决而设计的。准备编码面试最好的方法是练习与你可能被要求解决的题目类似的题目。这本书的目的就是：为你提供一些面试编码示例题以及相应的解决方案代码。\n\
  \n由于每家公司的面试流程和出题风格略有不同，强烈建议你在完成本书中题目的练习后，去 CareerCup 和 Glassdoor 等网站查看最近面试候选者遇到的题目。\n\
  \n不要忘记，你不需要知道所有知识，也不需要完美地解决提出的每一个问题才能进入面试流程的下一个阶段。大多数情况下，面试官只是想看到你在处理新问题时的思考过程，以及你的编码熟练程度。\n\
  \n最后，如果你发现任何你认为错误的地方，请随时与我联系。\n\n祝你面试顺利！\n\n# 准备\n\n在开始练习编码面试之前，你需要温习一些计算机科学的基础知识。在我看来，以下是你需要研究的最重要主题列表。这个列表并非完整。\n\
  \n## 编程语言\n\n你必须非常精通你选择的一种编程语言。熟练掌握你选择的语言将让你有更多时间思考实际问题，而不是思考如何实现你脑海中的解决方案。科技公司中最流行的语言是\
  \ `Java`、`C/C++` 和 `Python`。\n\n## 运行复杂度\n\n大多数情况下，面试官会询问你程序的运行时间，即大 O 复杂度，也就是运行的最坏情况分析。在某些情况下，例如处理大\
  \ O 分析不佳的流行算法（如 `quicksort`），了解其平均运行时间也是用的。\n\n## 数据结构\n\n### 链表\n\n链表中的每个节点都包含一个数据元素和一个指向下一个节点的指针。链表节点的示例定义如下：\n\
  \n```java\nclass LLNode {\n  int data;\n  LLNode next;\n  LLNode(int data) {\n \
  \   this.data = data;\n  }\n}\n```\n\n链表可以是双向链表，这意味着每个节点还有一个指向上一个节点的指针。示例定义如下：\n\
  \n```java\nclass DLLNode {\n  int data;\n  DLLNode next, prev;\n  DLLNode(int data)\
  \ {\n    this.data = data;\n  }\n}\n```\n\n你可以在 `O(1)` 时间内向链表中插入新节点。要在链表中查找一个元素需要\
  \ `O(n)` 时间。\n\n### 树\n\n树中的每个节点都包含一个数据元素和一个指向其子节点的指针列表。最流行的树的形式是二叉树，它只有两个孩子。在后续的所有练习题中使用的示例定义如下：\n\
  \n```java\nclass TNode {\n  int data;\n  TNode left, right;\n  TNode(int data) {\n\
  \    this.data = data;\n  }\n}\n```\n\n在某些情况下，树节点可能有一个指向其父节点的指针。\n\n二叉树的一种流行特殊类型是二叉搜索树\
  \ (`BST`)，其中每个节点的元素必须大于其左子树中的所有元素，且小于其右子树中的所有元素。\n\n访问树中每个节点的过程被称为树遍历。按深度优先顺序探索树有三种基本方法。以下示例代码通过三种基本遍历打印树：\n\
  \n```java\npublic static void preOrder(TNode root) {\n  if (root == null) { return;\
  \ };\n  System.out.println(root.data);\n  preOrder(root.left);\n  preOrder(root.right);\n\
  }\n\npublic static void inOrder(TNode root) {\n  if (root == null) { return; };\n\
  \  inOrder(root.left);\n  System.out.println(root.data);\n  inOrder(root.right);\n\
  }\n\npublic static void postOrder(TNode root) {\n  if (root == null) { return; };\n\
  \  postOrder(root.left);\n  postOrder(root.right);\n  System.out.println(root.data);\n\
  }\n```\n\n### 哈希表\n\n哈希映射用于将键与值关联起来。这种数据结构的优势是，理论上每个操作（插入、删除、查找）平均需要 `O(1)` 时间。\n\
  \n要向哈希表中插入新元素，你需要计算键的哈希值。如果计算出的哈希值已存在于结构中，则使用冲突解决解决技术。两种最常用的解决技术是：\n\n- **单独链法**：每个桶是独立的，对于每个哈希值索引都使用某种动态列表。\n\
  - **开放寻址**：不断检查桶直到找到未被占用的桶为止。\n\n在 Java 中创建一个带有 `String` 键和值的新哈希映射数据结构：\n\n```java\n\
  HashMap<String, String> hm = new HashMap<String, String>();\n```\n\n这也许是面试官中最流行的数据结构了！\n\
  \n### 栈\n\n一种后进先出的数据结构。了解如何使用数组从零实现栈是很有用的，因为面试官可能会要求创建一个具有特殊功能的修改版栈。对于你可能需要栈的所有其他情况，你可以使用语言内置的实现。在\
  \ Java 中使用 `String` 类型的栈：\n\n```java\nStack<String> stack = new Stack<String>();\n\
  ```\n\n### 队列\n\n一种先进先出的数据结构。了解如何使用数组从零实现队列是很有用的，因为面试官可能会要求创建一个修改版队列。在 Java 中使用\
  \ `String` 类型的队列：\n\n```java\nQueue<String> queue = new LinkedList<String>();\n\
  ```\n\n### 图\n\n一组通过链接连接的节点。可以使用邻接矩阵或邻接列表表示。面试官可能会问及图论，因为它被广泛应用于许多算法。\n\n### 字典树\
  \ (Tries)\n\n一种通常持有字符的树数据结构，在字符串处理中有许多应用。通常，节点的所有后代都有与其关联的字符串的前缀，根节点与空字符串关联。这种数据结构的流行应用是词典查询（例如文本框中的简单自动完成功能）。\n\
  \n## 算法\n\n面试官极少要求你实现特定的复杂且长的算法（如 `Dijkstra`、`A*` 等）。然而，你应该了解这些算法的工作原理、用途，并能够在涉及已知算法时进行基础对话。此外，建议了解动态规划是什么以及如何工作，并能够识别它。以下是建议学会如何实现的简单算法，以防面试官要求你实现算法的修改版：\n\
  \n- 广度优先搜索 (BFS) / 深度优先搜索 (DFS)\n- 合并排序 (Mergesort)\n- 快速排序 (Quicksort)\n- 二分查找\
  \ (Binary Search)\n\n## 其他\n\n### 递归\n\n一种用于解决计算机科学问题的强大技术，在面试中经常被问及。有时它会让问题的解决方案变得简单并产生紧凑的代码。记住，这种技术比迭代解决方案消耗更多内存。此外，在编写递归解决方案时不要忘记递归的终止条件。\n\
  \n### 面向对象设计\n\n面试官可能会你描述给定系统的基本对象。因此，掌握面向对象原理的基础知识至关重要。\n\n### 测试\n\n\n\n\n面试官可能会要求你测试你自己的解决方案。你需要知道如何创建测试用例，甚至涵盖边界情况（即输入意料之外的内容）。此外，了解\
  \ `Unit Testing`（单元测试）的基本原理并提及它是非常建议的。\n\n### 系统编程\n可能会问及 `threading`（线程）、`locks`（锁）和\
  \ `mutex`（互斥锁）等概念，特别是如果面试包含理论部分的话。\n\n### 位运算\n可能会问及使用位运算符的二进制操作，特别是在专注于底层软件的公司。\n\
  \n### 程序内存\n`stack`（栈）和 `heap`（堆）内存区域之间的区别以及各自的使用场景。\n\n# 练习题\n\n以下练习题由简洁的描述、（如果适用）要求的输入输出示例、用\
  \ `Java` 编写的示例代码以及（如果适用）的时间空间复杂度组成。尽可能使用了 `Java` 的内置类和实用函数，因为面试的目的不是重复轮子，而是为提出的问题提供一个高效的解决方案。\n\
  \n你会发现所选的问题及其答案并不很长。这是由于面试时间有限，面试官不会提问一个需要冗长解决方案的问题。如果你对一个问题想出了非常复杂且冗长的解决方案，说明你考虑得太复杂了。候选人在不到\
  \ 45 分钟的时间内需要时间来澄清问题、想出解决方案、与面试官讨论解决方案的时间，以及测试解决方案的时间。\n\n在大多数示例解决方案中，都有基础的输入数据验证，例如检查传递的对象是否为\
  \ `null` 值。这种输入验证可能并不详尽，你应该让面试官知道你跳过了输入验证，或者你没有进行详尽的检查。请记住，这可能会导致关于如何测试你的程序的后续问题。\n\
  \n如果问题的解决方案需要从主程序以特定方式调用，则该驱动程序的调用记录如下：\n\n.\n.\n.\n\n`main program calls()`\n\n\
  在编码面试中，你可能被问到理论问题和开放式的系统设计问题。这些不在本书的范围内，但最后两个问题包含了一些你可能会被问到的示例。\n\n## 1. 找到多数元素。在这个问题中，多数元素定义为在数组中出现次数超过\
  \ `n/2` 次的数字。\n\n例如：\n输入：`3,2,2,1,2,2,1`\n输出：`2`\n\n_______________\n\n### 解决方案：\n\
  \n```java\npublic static int findMajCandidate(int[] arr) {\n    if (arr == null\
  \ || arr.length == 0) {\n        return Integer.MIN_VALUE;\n    }\n    int count\
  \ = 1, maj = arr[0];\n    for (int i = 1; i < arr.length; i++) {\n        if (arr[i]\
  \ == maj) {\n            count++;\n        } else {\n            count--;\n    \
  \    }\n        if (count == 0) {\n            maj = arr[i];\n            count\
  \ = 1;\n        }\n    }\n    return maj;\n}\n\npublic static boolean verifyMajCandidate(int[]\
  \ arr, int maj) {\n    if (arr == null || arr.length == 0) {\n        return false;\n\
  \    }\n    int n = arr.length, count = 0;\n    for (int i = 0; i < n; i++) {\n\
  \        if (arr[i] == maj) {\n            count++;\n        }\n        if (count\
  \ > n / 2) {\n            return true;\n        }\n    }\n    return false;\n}\n\
  ```\n\n.\n.\n.\n\n```java\nint maj = findMajCandidate(arr);\nif (maj == Integer.MIN_VALUE\
  \ || verifyMajCandidate(arr, maj)==false) {\n    System.out.println(\"No majority\
  \ element found.\");\n} else {\n    System.out.println(\"Majority element: \" +\
  \ maj);\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n## 2. 找到整数数组中连续子序列的最大和。\n\
  \n例如：\n输入：`1,-3,2,5,-8`\n输出：`7`\n\n_______________\n\n### 解决方案：\n\n```java\npublic\
  \ static int maxSubSequence(int[] arr) {\n    if (arr == null || arr.length == 0)\
  \ {\n        return Integer.MIN_VALUE;\n    }\n    int maxSoFar = arr[0], curMax\
  \ = arr[0];\n    for (int i = 1; i < arr.length; i++) {\n        curMax = Math.max(curMax\
  \ + arr[i], arr[i]);\n        maxSoFar = Math.max(curMax, maxSoFar);\n    }\n  \
  \  return maxSoFar;\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n## 3. 给定两个二叉树，判断它们是否相等（具有相同的内容和结构）。\n\
  \n_______________\n\n### 解决方案：\n\n```java\npublic static boolean isTreeSame(TNode\
  \ T1, TNode T2) {\n    if (T1 == null && T2 == null) {\n        return true;\n \
  \   }\n    if (T1 == null || T2 == null) {\n        return false;\n    }\n    if\
  \ (T1.data != T2.data) {\n        return false;\n    }\n    return isTreeSame(T1.left,\
  \ T2.left) && isTreeSame(T1.right, T2.right);\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n\
  `O(1)`\n\n## 4. 在二叉搜索树 (BST) 中找到给定范围内的元素数量。\n\n例如：\n输入：范围`(2,6)`\n树：\n5\n3\n7\n\
  输出：`2`\n\n_______________\n\n### 解决方案：\n\n```java\npublic static int numbersInRange(TNode\
  \ node, int start, int end) {\n    if (node == null) {\n        return 0;\n    }\n\
  \    if (node.data > start && node.data < end) {\n        return 1 + numbersInRange(node.left,\
  \ start, end) + numbersInRange(node.right, start, end);\n    } else if (node.data\
  \ <= start) {\n        return numbersInRange(node.right, start, end);\n    } else\
  \ {\n        return numbersInRange(node.left, start, end);\n    }\n}\n```\n\n运行时间复杂度：\n\
  `O(N)`\n\n空间复杂度：\n`O(1)`\n\n## 5. 给定一个带有父节点指针的树，找到中序遍历的下一个节点。\n\n例如：\n输入：节点`3`\n\
  树：\n5\n3\n7\n输出：`5`\n\n_______________\n\n### 解决方案：\n\n```java\npublic static TNode\
  \ nextInOrder(TNode n) {\n    if (n == null) {\n        return null;\n    }\n  \
  \  if (n.right != null) {\n        TNode curr = n.right;\n        while (curr.left\
  \ != null) {\n            curr = curr.left;\n        }\n        return curr;\n \
  \   }\n    TNode p = n.parent;\n    while (p != null && n == p.right) {\n      \
  \  n = p;\n        p = p.parent;\n    }\n    return p;\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\
  \n空间复杂度：\n`O(1)`\n\n## 6. 给定一个带有父节点指针的树，找到后序遍历的下一个节点。\n\n例如：\n输入：节点`7`\n树：\n5\n\
  3\n7\n输出：`5`\n\n_______________\n\n### 解决方案：\n\n```java\npublic static TNode nextPostOrder(TNode\
  \ n) {\n    if (n == null || n.parent == null) {\n        return null;\n    }\n\
  \    if (n != n.parent.left) {\n        return n.parent;\n    }\n    TNode p = n.parent.parent;\n\
  \    while (p != null && n.parent == p.right) {\n        n = p;\n        p = p.parent;\n\
  \    }\n    return p;\n}\n```\n\n\n\n\n```java\nif (arr == null) {\n    return Integer.MIN_VALUE;\n\
  }\nint st = 0, end = arr.length - 1;\nwhile (st <= end) {\n    int mid = (st + end)\
  \ / 2;\n    if (arr[mid] == num) {\n        return mid;\n    } else if (num > arr[mid])\
  \ {\n        st = mid + 1;\n    } else {\n        end = mid - 1;\n    }\n}\nreturn\
  \ Integer.MIN_VALUE;\n}\n```\n\n### 运行复杂度：\nO(logN)\n\n### 空间复杂度：\nO(1)\n\n## 10.\
  \ 从数字数组中找到一个局部最小值。\n\n例如：\n输入：9, 7, 2, 8, 5, 6, 3, 4\n输出：2 或 5 或 3\n\n### 解决方案：\n\
  ```java\npublic static int findLocalMin(int[] arr, int st, int end) {\n    int mid\
  \ = (st + end) / 2;\n    if ((mid - 1 < 0) || (mid + 1 >= arr.length)) {\n     \
  \   return Integer.MIN_VALUE;\n    }\n    if ((arr[mid - 1] > arr[mid]) && (arr[mid\
  \ + 1] > arr[mid])) {\n        return mid;\n    } else if (arr[mid - 1] < arr[mid])\
  \ {\n        findLocalMin(arr, st, mid);\n    } else {\n        findLocalMin(arr,\
  \ mid, end);\n    }\n    return Integer.MIN_VALUE;\n}\n```\n\n### 运行复杂度：\nO(logN)\n\
  \n### 空间复杂度：\nO(1)\n\n## 11. 给定一个先严格递增后严格递减的数字数组，找到最大数。\n\n例如：\n输入：1, 2, 3, 4, 5,\
  \ 4, 3, 2\n输出：5\n\n### 解决方案：\n```java\npublic static int findMax(int[] arr) {\n\
  \    if (arr == null || arr.length <= 3) {\n        return Integer.MIN_VALUE;\n\
  \    }\n    int st = 0, end = arr.length - 1;\n    while (st <= end) {\n       \
  \ int mid = (st + end) / 2;\n        int midVal = arr[mid];\n        if (midVal\
  \ > arr[mid - 1] && midVal > arr[mid + 1]) {\n            return midVal;\n     \
  \   } else if (arr[mid - 1] < midVal) {\n            st = mid + 1;\n        } else\
  \ {\n            end = mid - 1;\n        }\n    }\n    return Integer.MIN_VALUE;\n\
  }\n```\n\n### 运行复杂度：\nO(logN)\n\n### 空间复杂度：\nO(1)\n\n## 12. 仅使用整数实现平方根函数 (sqrt)。\n\
  \n例如：\n输入：4\n输出：2\n输入：5\n输出：2 或 3（两个值允许，因为正确结果是小数）\n\n### 解决方案：\n```java\npublic\
  \ static int sqrt(int target, int st, int end) {\n    if (st >= end) {\n       \
  \ return Math.min(st, end);\n    }\n    int mid = (st + end) / 2;\n    if (mid *\
  \ mid == target) {\n        return mid;\n    }\n    if (mid * mid > target) {\n\
  \        return sqrt(target, st, mid - 1);\n    } else {\n        return sqrt(target,\
  \ mid + 1, end);\n    }\n}\n```\n\n### 运行复杂度：\nO(logN)\n\n### 空间复杂度：\nO(1)\n\n##\
  \ 13. 给定一个排序过但旋转了未知次数的数组，找到目标元素的位置。\n\n例如：\n输入：\n旋转后的数组：4, 5, 6, 7, 0, 1, 2\n目标：6\n\
  输出：2\n\n### 解决方案：\n```java\npublic static int binaryRoatedSearch(int[] arr, int\
  \ target) {\n    if (arr == null) {\n        return Integer.MIN_VALUE;\n    }\n\
  \    int st = 0;\n    int end = arr.length - 1;\n    while (st <= end) {\n     \
  \   int mid = (st + end) / 2;\n        if (arr[mid] == target) {\n            return\
  \ mid;\n        }\n        // 至少有一部分是有排序的\n        if (arr[st] <= arr[mid]) { //\
  \ 左部分是有排序的\n            if (arr[st] < target && target <= arr[mid]) {\n        \
  \        end = mid - 1;\n            } else {\n                st = mid + 1;\n \
  \           }\n        } else { // 右部分是有排序的\n            if (arr[mid] < target &&\
  \ target <= arr[end]) {\n                st = mid + 1;\n            } else {\n \
  \               end = mid - 1;\n            }\n        }\n    }\n    return Integer.MIN_VALUE;\n\
  }\n```\n\n### 信息：\n如果输入数组包含重复项，则只能通过线性搜索在 `O(N)` 运行时间内找到目标。\n\n### 运行复杂度：\nO(logN)\n\
  \n### 空间复杂度：\nO(1)\n\n## 14. 给定一个包含多个相同整数的排序数组，找到目标整数的起始和结束位置。\n\n例如：\n排序数组：1, 2,\
  \ 3, 7, 7, 9, 9\n目标：7\n输出：\n起始位置：3\n结束位置：5\n\n### 解决方案：\n```java\npublic static\
  \ int modifiedSearch(int[] arr, int target) {\n    int st = 0, end = arr.length\
  \ - 1;\n    while (st <= end) {\n        int mid = (st + end) / 2;\n        if (target\
  \ > arr[mid]) {\n            st = mid + 1;\n        } else {\n            end =\
  \ mid - 1;\n        }\n    }\n    return st;\n}\n\npublic static int[] findRange(int[]\
  \ arr, int target) {\n    int[] res = { -1, -1 };\n    if (arr == null) {\n    \
  \    return res;\n    }\n    int lo = modifiedSearch(arr, target - 1);\n    if (lo\
  \ >= arr.length || arr[lo] != target) {\n        return res;\n    }\n    int hi\
  \ = modifiedSearch(arr, target + 1);\n    res[0] = lo;\n    res[1] = hi;\n    return\
  \ res;\n}\n```\n\n### 运行复杂度：\nO(logN)\n\n### 空间复杂度：\nO(1)\n\n## 15. 给定一个数组，每个位置表示可以向前移动的步数，找到到达数组结尾最小步数。\n\
  \n例如：\n输入：2, 1, 1, 8, 1, 1\n输出：3\n\n### 解决方案：\n```java\npublic static int minNumOfSteps(int[]\
  \ arr) {\n    if (arr == null) {\n        return Integer.MIN_VALUE;\n    }\n   \
  \ int[] opt = new int[arr.length];\n    opt[0] = 0;\n    for (int i = 1; i < arr.length;\
  \ i++) {\n        int min = i;\n        for (int k = 0; k < i; k++) {\n        \
  \    if (i - k <= arr[k]) {\n                min = Math.min(min, opt[k] + 1);\n\
  \            }\n        }\n        opt[i] = min;\n    }\n    return opt[arr.length\
  \ - 1];\n}\n```\n\n### 运行复杂度：\nO(N²)\n\n### 空间复杂度：\nO(N)\n\n## 16. 给定一个整数二维数组和一个起始点，找到与起始点值相同的连续区域。\n\
  \n例如：\n输入：\n起始点：(0,0)\n数组：\n1 1 2\n1 3 2\n2 2 1\n输出：3\n\n### 解决方案：\n```java\nstatic\
  \ int mArea = 0;\npublic static void findAreaHelper(int[][] arr, boolean[][] visited,\
  \ int x, int y) {\n    if (x < 0 || x >= arr[0].length || y < 0 || y >= arr.length)\
  \ {\n        return;\n    }\n    if (visited[y][x]) {\n        return;\n    }\n\
  \    visited[y][x] = true;\n    if (arr[y][x] == value) {\n        mArea++;\n  \
  \      findAreaHelper(arr, visited, x + 1, y);\n        findAreaHelper(arr, visited,\
  \ x, y + 1);\n        findAreaHelper(arr, visited, x - 1, y);\n        findAreaHelper(arr,\
  \ visited, x, y - 1);\n    }\n}\n\npublic static void findArea(int[][] arr, int\
  \ x, int y) {\n    boolean[][] visited = new boolean[arr.length][arr[0].length];\n\
  \    mArea = 0;\n    findAreaHelper(arr, visited, x, y); // value 应在此处定义\n}\n```\n\
  （注：`value` 在原始片段中未定义，但根据上下文暗示）。\n\n### 运行复杂度：\nO(N²)\n\n### 空间复杂度：\nO(N)\n\n## 17.\
  \ 给定一个元组数组，代表程序所需的 RAM 数量以及开始和结束时间，找到最大 RAM 数量。\n\n例如：\n输入：\n开始时间 结束时间 需要 RAM\n\
  2 4 1\n3 6 2\n3 9 3\n输出：6\n\n### 解决方案：\n```java\nclass Triple {\n    int startTime,\
  \ endTime, ramNeeded;\n}\n\npublic static int maxRamNeeded(List<Triple> in) {\n\
  \    if (in == null) {\n        return Integer.MIN_VALUE;\n    }\n    Map<Integer,\
  \ Integer> tm = new TreeMap<Integer, Integer>();\n    for (Triple t : in) {\n  \
  \      tm.put(t.startTime, t.ramNeeded);\n        tm.put(t.endTime, -t.ramNeeded);\n\
  \    }\n    int curRam = 0, maxRam = 0;\n    for (Map.Entry<Integer, Integer> entry\
  \ : tm.entrySet()) {\n        curRam += entry.getValue();\n        maxRam = Math.max(curRam,\
  \ maxRam);\n    }\n    return maxRam;\n}\n```\n\n### 信息：\n`TreeMap` 始终根据其键排序。插入代价为\
  \ `O(logN)`。\n\n### 运行复杂度：\nO(NlogN)\n\n### 空间复杂度：\nO(N)\n\n## 18. 在不内置函数的情况下计算数字的幂。\n\
  \n例如：\n输入：2³\n输出：8\n\n### 解决方案：\n```java\npublic static long pow(int a, int b) {\n\
  \    long[] M = new long[b + 1];\n    M[0] = 1;\n    M[1] = a;\n    return powHelper(a,\
  \ b, M);\n}\n\npublic static long powHelper(int a, int b, long[] M) {\n    if (b\
  \ > 0) {\n        if (b % 2 == 0) {\n            M[b] = powHelper(a, b / 2, M) *\
  \ powHelper(a, b / 2, M);\n        } else {\n            M[b] = powHelper(a, (b\
  \ - 1) / 2, M) * powHelper(a, (b - 1) / 2, M) * a;\n        }\n    }\n    return\
  \ M[b];\n}\n```\n\n## 19. 给定一个整数数组，将数组重新排列为波浪数组（a1 >= a2 <= a3 >= a4 <= a5 >= …）。\n\
  \n例如：\n输入：1, 3, 2, 4, 5, 6, 7\n输出：2, 1, 4, 3, 6, 5, 7\n\n### 解决方案：\n```java\npublic\
  \ static void waveSort(int[] arr) {\n    if (arr == null) {\n        return;\n \
  \   }\n    Arrays.sort(arr);\n    for (int i = 0; i < arr.length - 1; i += 2) {\n\
  \        int temp = arr[i];\n        arr[i] = arr[i + 1];\n        arr[i + 1] =\
  \ temp;\n    }\n}\n```\n\n### 信息：\n如果列表中存在重复项，可能无效。\n\n### 运行复杂度：\nO(NlogN)\n\n\
  ### 空间复杂度：\nO(1)\n\n## 20. 反转整数的位。\n\n例如：\n输入：1011\n输出：1101\n\n### 解决方案：\n```java\n\
  public static int swapBits(int x, int i, int j) {\n    int lo = ((x >> i) & 1);\n\
  \    int hi = ((x >> j) & 1);\n    if ((lo ^ hi) == 1) {\n        x ^= ((1 << i)\
  \ | (1 << j));\n    }\n    return x;\n}\n```\n\n\n\n\n\n```java\npublic static int\
  \ revBits(int x, int numOfBits) {\n    for (int i = 0; i < numOfBits; i++) {\n \
  \       x = swapBits(x, i, numOfBits - i - 1);\n    }\n    return x;\n}\n```\n\n\
  ### INFO\n- 与 `1` 进行 `XOR` (`^`) 将翻转位的值。\n- 与两个位进行 `XOR` (`^`)，如果它们不同则返回 `1`。\n\n\
  ### RUNNING TIME COMPLEXITY\n- `O(N)`\n\n### SPACE COMPLEXITY\n- `O(1)`\n\n---\n\
  \n## 21. 在无序数组中就地找到第 k 大整数。\n\ne.g:\n**输入:**\n- `array`: `5, 8, 3, 1`\n- `k`: `2`\n\
  \n**输出:** `3`\n\n### SOLUTION\n```java\npublic static void swap(int[] arr, int x,\
  \ int y) {\n    int temp = arr[x];\n    arr[x] = arr[y];\n    arr[y] = temp;\n}\n\
  \npublic static int partition(int[] arr, int first, int last) {\n    int pivot =\
  \ first;\n    swap(arr, last, pivot);\n    for (int i = first; i < last; i++) {\n\
  \        if (arr[i] > last) {\n            swap(arr, i, first);\n            first++;\n\
  \        }\n    }\n    swap(arr, first, last);\n    return first;\n}\n\npublic static\
  \ int quickselect(int[] arr, int first, int last, int k) {\n    if (first > last)\n\
  \        return Integer.MIN_VALUE;\n    int pivot = partition(arr, first, last);\n\
  \    if (pivot == k) {\n        return arr[pivot];\n    }\n    if (pivot > k) {\n\
  \        return quickselect(arr, first, pivot - 1, k);\n    } else {\n        return\
  \ quickselect(arr, pivot + 1, last, k);\n    }\n}\n```\n\n### INFO\n如果你更明智地选择 `pivot`，例如选择每\
  \ 5 个元素一组的中位数，你可以避免 `O(N²)` 的最坏时间复杂度。\n\n### AVERAGE RUNNING TIME COMPLEXITY\n-\
  \ `O(N)`\n\n### WORST RUNNING TIME COMPLEXITY\n- `O(N²)`\n\n### SPACE COMPLEXITY\n\
  - `O(1)`\n\n---\n\n## 22. 给定一棵树是完全二叉树（即每个叶子节点以外的节点有两个孩子）以及该树的前序和后序遍历，请重建它。\n\ne.g:\n\
  **输入:**\n- `pre-order`: `5, 3, 7`\n- `post-order`: `3, 7, 5`\n\n**输出:**\n**树:**\n\
  ```\n5\n3 7\n```\n\n### SOLUTION\n```java\nstatic int mPreIndex = 0;\npublic static\
  \ TNode constructTree(int[] pre, int[] post, int lo, int hi) {\n    if ((lo > hi)\
  \ || (mPreIndex >= pre.length)) {\n        return null;\n    }\n    TNode root =\
  \ new TNode(pre[mPreIndex]);\n    mPreIndex++;\n    if (lo == hi) {\n        return\
  \ root;\n    }\n    int i;\n    for (i = lo; i < hi; i++) {\n        if (pre[mPreIndex]\
  \ == post[i]) {\n            break;\n        }\n    }\n    root.left = constructTree(pre,\
  \ post, lo, i);\n    root.right = constructTree(pre, post, i + 1, hi - 1);\n   \
  \ return root;\n}\n```\n\n---\n\n## 23. 给定一棵树的中序和前序遍历，请重建它。\n\ne.g:\n**输入:**\n-\
  \ `in-order`: `3, 5, 7`\n- `pre-order`: `3, 7, 5`\n\n**输出:**\n**树:**\n```\n5\n3\
  \ 7\n```\n\n### SOLUTION\n```java\nstatic int mPreIndex = 0;\npublic static TNode\
  \ constructTree(int[] in, int[] pre, int lo, int hi) {\n    if ((lo > hi) || (mPreIndex\
  \ >= pre.length)) {\n        return null;\n    }\n    TNode root = new TNode(pre[mPreIndex]);\n\
  \    mPreIndex++;\n    if (lo == hi) {\n        return root;\n    }\n    int inIndex;\n\
  \    for (inIndex = lo; inIndex <= hi; inIndex++) {\n        if (in[inIndex] ==\
  \ root.data) {\n            break;\n        }\n    }\n    root.left = constructTree(in,\
  \ pre, lo, inIndex - 1);\n    root.right = constructTree(in, pre, inIndex + 1, hi);\n\
  \    return root;\n}\n```\n\n---\n\n## 24. 给定一棵树是二叉搜索树 (BST)以及该树的前序遍历，请重建它。\n\n\
  e.g:\n**输入:**\n- `pre-order`: `5, 3, 7`\n\n**输出:**\n**树:**\n```\n5\n3 7\n```\n\n\
  ### SOLUTION\n```java\npublic static TNode constructTree(int[] pre, int lo, int\
  \ hi) {\n    if (lo > hi) {\n        return null;\n    }\n    TNode root = new TNode(pre[lo]);\n\
  \    if (lo == hi) {\n        return root;\n    }\n    int i;\n    for (i = lo +\
  \ 1; i <= hi; i++) {\n        if (pre[i] > root.data) {\n            break;\n  \
  \      }\n    }\n    root.left = constructTree(pre, lo + 1, i - 1);\n    root.right\
  \ = constructTree(pre, i, hi);\n    return root;\n}\n```\n\n---\n\n## 25. 从二叉搜索树\
  \ (BST) 中删除一个节点。\n\n### SOLUTION\n```java\npublic static TNode deleteNodeFromBST(TNode\
  \ root, int key) {\n    if (root == null) {\n        return null;\n    }\n    if\
  \ (key > root.data) {\n        root.right = deleteNodeFromBST(root.right, key);\n\
  \        return root;\n    }\n    if (key < root.data) {\n        root.left = deleteNodeFromBST(root.left,\
  \ key);\n        return root;\n    }\n    // 0 或 1 个孩子\n    if (root.left == null)\
  \ {\n        return root.right;\n    } else if (root.right == null) {\n        return\
  \ root.left;\n    }\n    // 2 个孩子\n    TNode n = root.right;\n    while (n.left\
  \ != null) {\n        n = n.left;\n    }\n    int inOrderSuccess = n.data;\n   \
  \ root.data = inOrderSuccess;\n    root.right = deleteNodeFromBST(root.right, inOrderSuccess);\n\
  \    return root;\n}\n```\n### RUNNING TIME COMPLEXITY\n- `O(N)`\n### SPACE COMPLEXITY\n\
  - `O(1)`\n\n---\n\n## 26. 检查给定字符串是否括号平衡。\n\ne.g:\n- **输入:** `(())`, **输出:** `true`\n\
  - **输入:** `()`, **输出:** `false`\n\n### SOLUTION\n```java\npublic static boolean\
  \ isBalanced(char[] str) {\n    int count = 0, i;\n    for (i = 0; i < str.length;\
  \ i++) {\n        if (str[i] == '(') {\n            count++;\n        } else {\n\
  \            count--;\n            if (count < 0) {\n                return false;\n\
  \            }\n        }\n    }\n    if (count != 0) {\n        return false;\n\
  \    }\n    return true;\n}\n```\n### RUNNING TIME COMPLEXITY\n- `O(N)`\n### SPACE\
  \ COMPLEXITY\n- `O(1)`\n\n---\n\n## 27. 检查给定字符串是否包含 `[]`、`()` 或 `{}`。\n\ne.g:\n\
  - **输入:** `[{()`, **输出:** `true`\n\n### SOLUTION\n```java\npublic static boolean\
  \ isBalanced(char[] str) {\n    HashMap<Character, Character> hm;\n    hm = new\
  \ HashMap<Character, Character>();\n    hm.put('(', ')');\n    hm.put('[', ']');\n\
  \    hm.put('{', '}';\n    Stack<Character> s = new Stack<Character>();\n    for\
  \ (int i = 0; i < str.length; i++) {\n        char curCh = str[i];\n        if (hm.containsKey(curCh))\
  \ {\n            s.add(hm.get(curCh));\n        } else {\n            if (s.isEmpty())\
  \ {\n                return false;\n            }\n            if (s.pop() != curCh)\
  \ {\n                return false;\n            }\n        }\n    }\n    return\
  \ s.isEmpty();\n}\n```\n### RUNNING TIME COMPLEXITY\n- `O(N)`\n### SPACE COMPLEXITY\n\
  - `O(N)`\n\n---\n\n## 28. 在行列均排序的整数二维数组中找到一个数字的位置。\n\ne.g:\n**输入:**\n- `array`:\n\
  ```\n1 4 7\n2 5 8\n3 6 9\n```\n- `num`: `3`\n**输出:** `(2, 0)`\n\n### SOLUTION\n\
  ```java\nclass Point {\n    int x, y;\n    Point(int x, int y) {\n        this.x\
  \ = x;\n        this.y = y;\n    }\n}\n\npublic static Point findNum(int[][] arr,\
  \ int num) {\n    if (arr == null) {\n        return null;\n    }\n    int y = 0;\n\
  \    int x = arr[0].length - 1;\n    while (y < arr.length && x >= 0) {\n      \
  \  if (num == arr[y][x]) {\n            return new Point(x, y);\n        } else\
  \ if (num > arr[y][x]) {\n            y++;\n        } else {\n            x--;\n\
  \        }\n    }\n    return new Point(-1, -1);\n}\n```\n### RUNNING TIME COMPLEXITY\n\
  - `O(N)`\n### SPACE COMPLEXITY\n- `O(1)`\n\n---\n\n## 29. 在每个节点都有指向父节点指针的二叉树中找到两个节点的公共祖先。\n\
  \ne.g:\n**输入:**\n- `node1`: `1`\n- `node2`: `7`\n- **树:**\n```\n5\n3 7\n1\n```\n\
  **输出:** `5`\n\n### SOLUTION\n```java\npublic static TNode findLCA(TNode n1, TNode\
  \ n2, TNode root) {\n    HashSet<TNode> set1 = new HashSet<TNode>();\n    HashSet<TNode>\
  \ set2 = new HashSet<TNode>();\n    set1.add(n1);\n    set2.add(n2);\n    TNode\
  \ cur1 = n1, cur2 = n2;\n    while (true) {\n        cur1 = cur1.parent;\n     \
  \   set1.add(cur1);\n        cur2 = cur2.parent;\n        if (set1.contains(cur1))\
  \ {\n            return cur2;\n        }\n        set2.add(cur2);\n    }\n}\n```\n\
  ### RUNNING TIME COMPLEXITY\n- `O(N)`\n### SPACE COMPLEXITY\n- `O(N)`\n\n---\n\n\
  ## 30. 在二叉树就地找到两个节点的公共祖先（不使用额外内存）。\n\ne.g:\n**输入:**\n- `node1`: `1`\n- `node2`:\
  \ `7`\n- **树:**\n```\n5\n3 7\n1\n```\n**输出:** `5`\n\n### SOLUTION\n```java\npublic\
  \ static TNode findLCA(TNode n1, TNode n2, TNode root) {\n    if (root == null)\
  \ {\n        return null;\n    }\n    if ((root == n1) || (root == n2)) {\n    \
  \    return root;\n    }\n    TNode l = findLCA(n1, n2, root.left);\n    TNode r\
  \ = findLCA(n1, n2, root.right);\n    if ((l != null) && (r != null)) {\n      \
  \  return root;\n    }\n    if (l != null) {\n        return l;\n    } else {\n\
  \        return r;\n    }\n}\n```\n### RUNNING TIME COMPLEXITY\n- `O(N)`\n### SPACE\
  \ COMPLEXITY\n- `O(1)`\n\n---\n\n## 31. 给你一个整数数组，代表某只股票每天的价格。如果你只允许在某一天买入股票并在另一天卖出，找到你能获得的最大收益。\n\
  \ne.g:\n- **输入:** `2, 1, 6, 5, 9`\n**输出:** `8`\n\n### SOLUTION\n```java\npublic\
  \ static int maxRevenue(int[] arr) {\n    if (arr == null || arr.length == 0) {\n\
  \        return Integer.MIN_VALUE;\n    }\n    int lowest = arr[0];\n    int maxRev\
  \ = 0;\n    for (int i = 1; i < arr.length; i++) {\n        maxRev = Math.max(maxRev,\
  \ arr[i] - lowest);\n        lowest = Math.min(lowest, arr[i]);\n    }\n    return\
  \ maxRev;\n}\n```\n### RUNNING TIME COMPLEXITY\n- `O(N)`\n### SPACE COMPLEXITY\n\
  - `O(1)`\n\n---\n\n## 32. 从双向链表中删除整数的单次出现。\n\ne.g:\n**输入:**\n- `list`: `2 -> 5 ->\
  \ 8 -> 9`\n- `val`: `5`\n**输出:** `2 -> 8 -> 9`\n\n### SOLUTION\n```java\nclass DLLNode\
  \ {\n    int  data;\n}\n```\n\n\n\n\n\n```java\nclass DLLNode {\n    int data;\n\
  \    DLLNode next, prev;\n}\n\npublic static DLLNode removeNode(DDLNode head, int\
  \ x) {\n    if (head == null) {\n        return null;\n    }\n    if (head.data\
  \ == x) {\n        head.next.previous = null;\n        return head.next;\n    }\n\
  \    DDLNode runner = head;\n    while (runner.next != null) {\n        if (runner.next.data\
  \ == x) {\n            runner.next = runner.next.next;\n            runner.next.previous\
  \ = runner;\n            break;\n        }\n        runner = runner.next;\n    }\n\
  \    return head;\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n### 33.\
  \ 给定双向链表，在原地反转它。\n\n例如：\n输入：`2 -> 5 -> 8 -> 9`\n输出：`9 -> 8 -> 5 -> 2`\n\n_______________\n\
  \n### 解决方案：\n\n```java\nclass DLLNode {\n    int data;\n    DLLNode next, prev;\n\
  }\n\npublic static DLLNode revList(DLLNode head) {\n    if (head == null) {\n  \
  \      return null;\n    }\n    while (head.next != null) {\n        DLLNode temp\
  \ = head.next;\n        head.next = head.prev;\n        head.prev = temp;\n    \
  \    head = temp;\n    }\n    head.next = head.prev;\n    head.prev = null;\n  \
  \  return head;\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n### 34.\
  \ 给定一个排序后的整数数组和一个目标整数，判断是否可以通过两个整数之和生成该目标整数。\n\n例如：\n输入：\n数组：`1, 2, 5, 7, 8, 9`\n\
  目标：`7`\n输出：`true`\n\n_______________\n\n### 解决方案：\n\n```java\npublic static boolean\
  \ is2SumTarget(int[] arr, int target) {\n    if (arr == null) {\n        return\
  \ false;\n    }\n    int st = 0;\n    int end = arr.length - 1;\n    while (st <\
  \ end) {\n        int sum = arr[st] + arr[end];\n        if (sum == target) {\n\
  \            return true;\n        } else if (sum > target) {\n            end--;\n\
  \        } else {\n            st++;\n        }\n    }\n    return false;\n}\n```\n\
  \n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n### 35. 给定一个排序后的整数数组和一个目标整数，判断是否可以通过三个整数之和生成该目标整数。\n\
  \n例如：\n输入：\n数组：`1, 2, 5, 7, 8, 9`\n目标：`17`\n输出：`true`\n\n_______________\n\n###\
  \ 解决方案：\n\n```java\npublic static boolean is3SumTarget(int[] arr, int target) {\n\
  \    if (arr == null) {\n        return false;\n    }\n    for (int i = 0; i < arr.length\
  \ - 2; i++) {\n        int st = i + 1;\n        int end = arr.length - 1;\n    \
  \    while (st < end) {\n            int sum = arr[i] + arr[st] + arr[end];\n  \
  \          if (sum == target) {\n                return true;\n            } else\
  \ if (sum > target) {\n                end--;\n            } else {\n          \
  \      st++;\n            }\n        }\n    }\n    return false;\n}\n```\n\n运行时间复杂度：\n\
  `O(N²)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n### 36. 给定一二叉树，判断它是否为二叉搜索树（BST）。\n\n例如：\n输入：\n\
  树：\n5\n9 7\n输出：`false`\n\n_______________\n\n### 解决方案：\n\n```java\npublic static\
  \ boolean isBST(TNode root, int min, int max) {\n    if (root == null) {\n     \
  \   return true;\n    }\n    if (root.data > min && root.data < max) {\n       \
  \ return isBST(root.left, min, root.data)\n        && isBST(root.right, root.data,\
  \ max);\n    }\n    return false;\n}\n```\n\n`isBST(root, Integer.MIN_VALUE, Integer.MAX_VALUE);`\n\
  \n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n### 37. 给定一个整数数组，其中所有整数都出现两次，只有一个出现一次，找到那个只出现一次的整数。\n\
  \n例如：\n输入：`2, 4, 2, 3, 5, 3, 4`\n输出：`5`\n\n_______________\n\n### 解决方案：\n\n```java\n\
  public static int findSingle(int[] arr) {\n    if (arr == null) {\n        return\
  \ Integer.MIN_VALUE;\n    }\n    HashSet<Integer> set = new HashSet<Integer>();\n\
  \    int sum = 0;\n    for (int i = 0; i < arr.length; i++) {\n        int cur =\
  \ arr[i];\n        if (set.contains(cur)) {\n            sum -= cur;\n        }\
  \ else {\n            set.add(cur);\n            sum += cur;\n        }\n    }\n\
  \    return sum;\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(N)`\n\n---\n\n### 38.\
  \ 给定一个整数数组，除一个整数外所有整数都重复多次，找到重复次数最多的整数。\n\n例如：\n输入：`1, 1, 4, 4, 4, 5, 6`\n输出：`4`\n\
  \n_______________\n\n### 解决方案：\n\n```java\npublic static int findMost(int[] arr)\
  \ {\n    if (arr == null || arr.length == 0) {\n        return Integer.MIN_VALUE;\n\
  \    }\n    int element = arr[0];\n    int count = 1;\n    int maxElement = arr[0];\n\
  \    int maxCount = 1;\n    for (int i = 1; i < arr.length; i++) {\n        if (arr[i]\
  \ == element) {\n            count++;\n        } else {\n            count = 1;\n\
  \            element = arr[i];\n        }\n        if (count > maxCount) {\n   \
  \         maxCount = count;\n            maxElement = element;\n        }\n    }\n\
  \    return maxElement;\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n\
  ### 39. 打印二叉树的垂直层序。\n\n例如：\n输入：\n树：\n5\n9 7\n输出：\n9 5 7\n\n_______________\n\n###\
  \ 解决方案：\n\n```java\npublic static void makeVerticalOrder(TNode root, int hd, HashMap<Integer,\
  \ List<Integer>> hm, int[] minMax) {\n    if (root == null) {\n        return;\n\
  \    }\n    // 保存根节点的最小和最大水平距离\n    if (hd < minMax[0]) minMax[0] = hd;\n    if\
  \ (hd > minMax[1]) minMax[1] = hd;\n    if (!hm.containsKey(hd)) {\n        hm.put(hd,\
  \ new ArrayList<Integer>());\n    }\n    hm.get(hd).add(root.data);\n    makeVerticalOrder(root.left,\
  \ hd - 1, hm, minMax);\n    makeVerticalOrder(root.right, hd + 1, hm, minMax);\n\
  }\n\n// 生成包含垂直层的 map\nfor (int lvl = minMax[0]; lvl <= minMax[1]; lvl++) {\n   \
  \ List<Integer> curLevel = hm.get(lvl);\n    for (Integer node : curLevel) {\n \
  \       System.out.print(node + \" \");\n    }\n}\nSystem.out.println();\n```\n\n\
  ---\n\n### 40. 打印二叉树的层序遍历。\n\n例如：\n输入：\n树：\n5\n9 7\n输出：\n5 9 7\n\n_______________\n\
  \n### 解决方案：\n\n```java\npublic static void printLevelOrder(TNode root) {\n    if\
  \ (root == null) {\n        return;\n    }\n    Queue<TNode> curLevel = new LinkedList<>();\n\
  \    Queue<TNode> nextLevel = new LinkedList<>();\n    curLevel.add(root);\n   \
  \ while (!curLevel.isEmpty()) {\n        TNode node = curLevel.poll();\n       \
