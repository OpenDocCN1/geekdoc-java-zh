  \    curLevel = nextLevel;\n}\n```\n\n---\n\n### 41. 给定双向链表，用递归和迭代的方法在原地反转它。\n\n\
  例如：\n输入：`3 -> 9 -> 6 -> 2`\n输出：`2 -> 6 -> 9 -> 3`\n\n_______________\n\n### 递归：\n\
  ```java\npublic static DLLNode revList(DLLNode head, DLLNode prev) {\n    if (head\
  \ == null) {\n        return prev;\n    }\n    DLLNode next = head.next;\n    head.next\
  \ = prev;\n    if (next == null) {\n        return head;\n    } else {\n       \
  \ return revList(next, head);\n    }\n}\n```\n`revList(head, null);`\n\n### 迭代：\n\
  ```java\npublic static DLLNode revList(DLLNode head) {\n    if (head == null) {\n\
  \        return null;\n    }\n    DLLNode cur = head, prev = null;\n    while (cur\
  \ != null) {\n        DLLNode next = cur.next;\n        cur.next = prev;\n     \
  \   prev = cur;\n        cur = next;\n    }\n    return prev;\n}\n```\n`revList(head);`\n\
  \n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n---\n\n## 42. 实现一个模式匹配函数，其中：\n1. `.` 匹配任意单个字符。\n\
  2. `*` 匹配所在字符的零 个或多个实例。\n\n例如：\n输入：\n字符串：`aabc`\n模式：`a*b.`\n输出：`true`\n输入：\n字符串：`bc`\n\
  模式：`a*b.`\n输出：`true`\n\n_______________\n\n### 解决方案：\n\n```java\npublic static boolean\
  \ isMatch(char[] str, char[] pat, int s, int p) {\n    if (s >= str.length) {\n\
  \        return (p >= pat.length);\n    }\n    // 当前字符是点或字母\n    if (p == pat.length\
  \ - 1 || pat[p + 1] != '*') {\n        return (str[s] == pat[p] || pat[p] == '.')\n\
  \        && isMatch(str, pat, s + 1, p + 1);\n    }\n    // 当前字符后面跟着星号，所以：\n   \
  \ // 1. 忽略星号\n    // 2. 记住星号并检查相等性\n    return isMatch(str, pat, s, p + 2) ||\n\
  \    (isMatch(str, pat, s + 1, p) && (str[s] == pat[p]));\n}\n```\n\n`boolean result\
  \ = isMatch(str, pat, 0 ,0);`\n\n---### 43. 给定一个只包含 0、1 或 2 的数组，不使用任何排序函数进行排序。\n\
  \n例如：\n输入：`0, 1, 1, 0, 2, 1`\n输出：`0, 0, 1, 1, 1, 2`\n\n_______________\n\n### 解决方案：\n\
  \n```java\npublic static void swap(int[] arr, int x, int y) {\n    int temp = arr[x];\n\
  \    arr[x] = arr[y];\n    arr[y] = temp;\n}\n\npublic static void sort012(int[]\
  \ arr) {\n    if (arr == null) {\n        return;\n    }\n}\n```\n\n\n\n\n\n```java\n\
  int st = 0, mid = 0, end = arr.length - 1;\n\nwhile (mid <= end) {\n    switch (arr[mid])\
  \ {\n        case 0:\n            swap(arr, st, mid);\n            st++;\n     \
  \       mid++;\n            break;\n        case 1:\n            mid++;\n      \
  \      break;\n        case 2:\n            swap(arr, mid, end);\n            end--;\n\
  \            break;\n    }\n}\n```\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(1)\n\n##\
  \ 44. 计算两个字符数组形式给出的二进制数的和。以字符串形式返回。\n\n**示例：**\n输入：\nnum 1: 001\nnum2: 101\n输出:\
  \ 110\n\n### 解决方案\n```java\npublic static String addBinary(char[] num1, char[] num2)\
  \ {\n    int p1 = num1.length - 1;\n    int p2 = num2.length - 1;\n    int carry\
  \ = 0;\n    String res = \"\";\n    while (p1 >= 0 || p2 >= 0 || carry != 0) {\n\
  \        int curSum = carry;\n        curSum += (p1 >= 0) ? (num1[p1] - '0') : 0;\n\
  \        curSum += (p2 >= 0) ? (num2[p2] - '0') : 0;\n        p1--;\n        p2--;\n\
  \        carry = (curSum >= 2) ? 1 : 0;\n        int newDigit = curSum % 2;\n  \
  \      res = newDigit + res;\n    }\n    return res;\n}\n```\n**运行时间复杂度：**\nO(N)\n\
  N: max(num1.length, num2.length)\n\n**空间复杂度：**\nO(1)\n\n## 45. 在不使用任何内置函数的情况下反转整数。\n\
  \n**示例：**\n输入: 123\n输出: 321\n输入: -123\n输出: -321\n\n### 解决方案\n```java\npublic static\
  \ int revInt(int x) {\n    boolean negative = false;\n    if (x < 0) {\n       \
  \ x = x * -1;\n        negative = true;\n    }\n    int res = 0;\n    while (x >\
  \ 0) {\n        int LSB = x % 10;\n        x = x / 10;\n        res = res * 10 +\
  \ LSB;\n    }\n    if (negative == true) {\n        res = res * -1;\n    }\n   \
  \ return res;\n}\n```\n**运行时间复杂度：**\nO(N)\nN: x 的数字位数\n\n**空间复杂度：**\nO(1)\n\n##\
  \ 46. 合并两个有序的链表。\n\n**示例：**\n输入：\nlist 1: 2 -> 4 -> 5\nlist 2: 3 -> 7\n输出: 2 ->\
  \ 3 -> 4 -> 5 -> 7\n\n### 解决方案\n```java\npublic static LLNode mergeLists(LLNode\
  \ n1, LLNode n2) {\n    if (n1 == null) {\n        return n2;\n    }\n    if (n2\
  \ == null) {\n        return n1;\n    }\n    LLNode res;\n    if (n1.data <= n2.data)\
  \ {\n        res = n1;\n        n1.next = mergeLists(n1.next, n2);\n    } else {\n\
  \        res = n2;\n        n2.next = mergeLists(n1, n2.next);\n    }\n    return\
  \ res;\n}\n```\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(1)\n\n## 47. 给定一个单词列表，在每行打印使用相同字母可以创建的单词。\n\
  \n**示例：**\n输入: abc, hello, cba\n输出：\nabc cba\nhello\n\n### 解决方案\n```java\npublic\
  \ static void bucketAnagram(List<String> input) {\n    HashMap<String, List<String>>\
  \ hm;\n    hm = new HashMap<String, List<String>>();\n    for (String word : input)\
  \ {\n        char[] wordArr = word.toCharArray();\n        Arrays.sort(wordArr);\n\
  \        String key = new String(wordArr);\n        List<String> list;\n       \
  \ if (hm.containsKey(key) == false) {\n            list = new LinkedList<String>();\n\
  \        } else {\n            list = hm.get(key);\n        }\n        list.add(word);\n\
  \        hm.put(key, list);\n    }\n    for (Map.Entry<String, List<String>> entry\
  \ : hm.entrySet()) {\n        for (String word : entry.getValue()) {\n         \
  \   System.out.print(word + \" \");\n        }\n        System.out.println();\n\
  \    }\n}\n```\n**运行时间复杂度：**\nO(N*MlogM)\nN: 输入单词的个数\nM: 最大输入单词中的字符数\n\n**空间复杂度：**\n\
  O(NM)\n\n## 48. 给出一个长度为 K 的整数数组，其中数组的最后一个元素为空，且其他所有值（从 1 到 k）都在数组中，找到缺失的数字。\n\n\
  **示例：**\n输入: 4, 5, 1, 3, _\n输出: 2\n\n### 解决方案\n```java\npublic static int missingNumber(int[]\
  \ arr) {\n    if (arr == null) {\n        return Integer.MIN_VALUE;\n    }\n   \
  \ int sumFrom1toK = arr.length;\n    int sumOfArray = 0;\n    for (int i = 0; i\
  \ < arr.length - 1; i++) {\n        sumOfArray += arr[i];\n        sumFrom1toK +=\
  \ i + 1;\n    }\n    return sumFrom1toK - sumOfArray;\n}\n```\n**说明：** 也可以使用等差数列求和公式\
  \ `sum1toK = k*(k+1))/2`。`K` 是数组的长度。\n\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(1)\n\
  \n## 49. 给定一个二叉树，找到路径的最大和。路径可以从任意节点开始并到任意节点结束。\n\n**示例：**\n输入：\ntree: 5\n3 1\n10\n\
  输出: 9\n\n### 解决方案\n```java\nstatic int mPathSum = Integer.MIN_VALUE;\npublic static\
  \ int maxPathIntree(Node root) {\n    if (root == null) {\n        return 0;\n \
  \   }\n    int leftSum = maxPathIntree(root.left);\n    int rightSum = maxPathIntree(root.right);\n\
  \    // 更新最大路径，考虑当前节点\n    mPathSum = Math.max(mPathSum, leftSum + root.data + rightSum);\n\
  \    // 返回当前节点下的最大路径\n    return root.data + Math.max(0, Math.max(leftSum, rightSum));\n\
  }\n```\n**说明：** 函数使用全局变量 `mPathSum` 来返回结果。\n\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\n\
  O(1)\n\n## 50. 给无图图，每个节点包含一个标签和一个邻居列表，复制整个数据结构。\n\n### 解决方案\n```java\nclass Node\
  \ {\n    String label;\n    ArrayList<Node> adjList = new ArrayList<Node>();\n \
  \   Node(String label) {\n        this.label = label;\n    }\n}\npublic static Node\
  \ copyGraph(Node node) {\n    if (node == null) {\n        return null;\n    }\n\
  \    Queue<Node> queue = new LinkedList<Node>();\n    HashMap<Node, Node> hm = new\
  \ HashMap<Node, Node>();\n    Node newNode = new Node(node.label);\n    // 哈希表存储原始节点作为键，复制的节点作为值\n\
  \    hm.put(node, newNode);\n    // 队列存储尚未处理的原始节点\n    queue.add(node);\n    while\
  \ (queue.isEmpty() == false) {\n        Node curNode = queue.poll();\n        for\
  \ (Node adjNode : curNode.adjList) {\n            if (hm.containsKey(adjNode) ==\
  \ false) {\n                Node copyOfAdjNode = new Node(adjNode.label);\n    \
  \            hm.put(adjNode, copyOfAdjNode);\n                curNode.adjList.add(copyOfAdjNode);\n\
  \                queue.add(adjNode);\n            } else {\n                curNode.adjList.add(hm.get(adjNode));\n\
  \            }\n        }\n    }\n    return newNode;\n}\n```\n**运行时间复杂度：**\nO(N)\n\
  \n**空间复杂度：**\nO(N)\n\n## 51. 以下是面试中可能会问的一些理论问题。注意，大公司通常不问这类问题，但很多其他公司会。\n\n- 什么是\
