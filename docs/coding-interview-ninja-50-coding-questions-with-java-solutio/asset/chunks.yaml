  trans: "\n\n![](img/00002.jpeg)\n\n# 引言\n\n获得你梦想以的软件工程师工作可能取决于你在编码面试中的表现。这可能是你面试过程中最重要的一部分。\n\
    \n你的招聘官会建议你重新复习大学的算法和数据结构教科书，以温习计算机科学的基础知识。虽然这是必要的，但远远不够。在算法书中看到的问题类型并不是为了让你在短短\
    \ 45 分钟的压力下解决而设计的。准备编码面试最好的方法是练习与你可能被要求解决的题目类似的题目。这本书的目的就是：为你提供一些面试编码示例题以及相应的解决方案代码。\n\
    \n由于每家公司的面试流程和出题风格略有不同，强烈建议你在完成本书中题目的练习后，去 CareerCup 和 Glassdoor 等网站查看最近面试候选者遇到的题目。\n\
    \n不要忘记，你不需要知道所有知识，也不需要完美地解决提出的每一个问题才能进入面试流程的下一个阶段。大多数情况下，面试官只是想看到你在处理新问题时的思考过程，以及你的编码熟练程度。\n\
    \n最后，如果你发现任何你认为错误的地方，请随时与我联系。\n\n祝你面试顺利！\n\n# 准备\n\n在开始练习编码面试之前，你需要温习一些计算机科学的基础知识。在我看来，以下是你需要研究的最重要主题列表。这个列表并非完整。\n\
    \n## 编程语言\n\n你必须非常精通你选择的一种编程语言。熟练掌握你选择的语言将让你有更多时间思考实际问题，而不是思考如何实现你脑海中的解决方案。科技公司中最流行的语言是\
    \ `Java`、`C/C++` 和 `Python`。\n\n## 运行复杂度\n\n大多数情况下，面试官会询问你程序的运行时间，即大 O 复杂度，也就是运行的最坏情况分析。在某些情况下，例如处理大\
    \ O 分析不佳的流行算法（如 `quicksort`），了解其平均运行时间也是用的。\n\n## 数据结构\n\n### 链表\n\n链表中的每个节点都包含一个数据元素和一个指向下一个节点的指针。链表节点的示例定义如下：\n\
    \n```java\nclass LLNode {\n  int data;\n  LLNode next;\n  LLNode(int data) {\n\
    \    this.data = data;\n  }\n}\n```\n\n链表可以是双向链表，这意味着每个节点还有一个指向上一个节点的指针。示例定义如下：\n\
    \n```java\nclass DLLNode {\n  int data;\n  DLLNode next, prev;\n  DLLNode(int\
    \ data) {\n    this.data = data;\n  }\n}\n```\n\n你可以在 `O(1)` 时间内向链表中插入新节点。要在链表中查找一个元素需要\
    \ `O(n)` 时间。\n\n### 树\n\n树中的每个节点都包含一个数据元素和一个指向其子节点的指针列表。最流行的树的形式是二叉树，它只有两个孩子。在后续的所有练习题中使用的示例定义如下：\n\
    \n```java\nclass TNode {\n  int data;\n  TNode left, right;\n  TNode(int data)\
    \ {\n    this.data = data;\n  }\n}\n```\n\n在某些情况下，树节点可能有一个指向其父节点的指针。\n\n二叉树的一种流行特殊类型是二叉搜索树\
    \ (`BST`)，其中每个节点的元素必须大于其左子树中的所有元素，且小于其右子树中的所有元素。\n\n访问树中每个节点的过程被称为树遍历。按深度优先顺序探索树有三种基本方法。以下示例代码通过三种基本遍历打印树：\n\
    \n```java\npublic static void preOrder(TNode root) {\n  if (root == null) { return;\
    \ };\n  System.out.println(root.data);\n  preOrder(root.left);\n  preOrder(root.right);\n\
    }\n\npublic static void inOrder(TNode root) {\n  if (root == null) { return; };\n\
    \  inOrder(root.left);\n  System.out.println(root.data);\n  inOrder(root.right);\n\
    }\n\npublic static void postOrder(TNode root) {\n  if (root == null) { return;\
    \ };\n  postOrder(root.left);\n  postOrder(root.right);\n  System.out.println(root.data);\n\
    }\n```\n\n### 哈希表\n\n哈希映射用于将键与值关联起来。这种数据结构的优势是，理论上每个操作（插入、删除、查找）平均需要 `O(1)` 时间。\n\
    \n要向哈希表中插入新元素，你需要计算键的哈希值。如果计算出的哈希值已存在于结构中，则使用冲突解决解决技术。两种最常用的解决技术是：\n\n- **单独链法**：每个桶是独立的，对于每个哈希值索引都使用某种动态列表。\n\
    - **开放寻址**：不断检查桶直到找到未被占用的桶为止。\n\n在 Java 中创建一个带有 `String` 键和值的新哈希映射数据结构：\n\n```java\n\
    HashMap<String, String> hm = new HashMap<String, String>();\n```\n\n这也许是面试官中最流行的数据结构了！\n\
    \n### 栈\n\n一种后进先出的数据结构。了解如何使用数组从零实现栈是很有用的，因为面试官可能会要求创建一个具有特殊功能的修改版栈。对于你可能需要栈的所有其他情况，你可以使用语言内置的实现。在\
    \ Java 中使用 `String` 类型的栈：\n\n```java\nStack<String> stack = new Stack<String>();\n\
    ```\n\n### 队列\n\n一种先进先出的数据结构。了解如何使用数组从零实现队列是很有用的，因为面试官可能会要求创建一个修改版队列。在 Java 中使用\
    \ `String` 类型的队列：\n\n```java\nQueue<String> queue = new LinkedList<String>();\n\
    ```\n\n### 图\n\n一组通过链接连接的节点。可以使用邻接矩阵或邻接列表表示。面试官可能会问及图论，因为它被广泛应用于许多算法。\n\n### 字典树\
    \ (Tries)\n\n一种通常持有字符的树数据结构，在字符串处理中有许多应用。通常，节点的所有后代都有与其关联的字符串的前缀，根节点与空字符串关联。这种数据结构的流行应用是词典查询（例如文本框中的简单自动完成功能）。\n\
    \n## 算法\n\n面试官极少要求你实现特定的复杂且长的算法（如 `Dijkstra`、`A*` 等）。然而，你应该了解这些算法的工作原理、用途，并能够在涉及已知算法时进行基础对话。此外，建议了解动态规划是什么以及如何工作，并能够识别它。以下是建议学会如何实现的简单算法，以防面试官要求你实现算法的修改版：\n\
    \n- 广度优先搜索 (BFS) / 深度优先搜索 (DFS)\n- 合并排序 (Mergesort)\n- 快速排序 (Quicksort)\n- 二分查找\
    \ (Binary Search)\n\n## 其他\n\n### 递归\n\n一种用于解决计算机科学问题的强大技术，在面试中经常被问及。有时它会让问题的解决方案变得简单并产生紧凑的代码。记住，这种技术比迭代解决方案消耗更多内存。此外，在编写递归解决方案时不要忘记递归的终止条件。\n\
    \n### 面向对象设计\n\n面试官可能会你描述给定系统的基本对象。因此，掌握面向对象原理的基础知识至关重要。\n\n### 测试\n\n"
- fmt: "\nInterviewers might ask you to test your own solution. You need to know how\
    \ to create test cases that cover even the edge cases (that is having input something\
    \ unexpected). Also, knowing the basic principles of `Unit Testing` and mentioning\
    \ it would be really recommended.\n\n### System Programming\nConcepts such as\
    \ `threading`, `locks` and `mutex` might be asked, especially if the company has\
    \ a theoretical part in their interview.\n\n### Bitwise\nBinary operations using\
    \ bitwise operators might be asked from time to time especially in companies specializing\
    \ in lower level software.\n\n### Program memory\nThe difference between the `stack`\
    \ and the `heap` memory areas and when each one is used.\n\n# Practise Questions\n\
    \nThe following practice questions are consisted from a concise description, a\
    \ short example of the input and output required if applicable, the sample solution\
    \ coded in `Java` and the time and space complexity if applicable. The built-in\
