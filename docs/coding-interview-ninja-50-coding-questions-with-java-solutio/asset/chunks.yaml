    public static int revInt(int x) {


    boolean negative = false;


    if (x < 0) {


    x = x * -1;


    negative = true;


    }


    int res = 0;


    while (x > 0) {


    int LSB = x % 10;


    x = x / 10;


    res = res * 10 + LSB;


