    48.Given an array of integers of length K where the last element in the array
    is empty and all the other values (from 1 to k) are present in the array, find
    the missing number.


    e.g:


    input: 4, 5, 1, 3, _


    output: 2


    _______________


    SOLUTION:


    public static int missingNumber(int[] arr) {


    if (arr == null) {


    return Integer.MIN_VALUE;


    }


    int sumFrom1toK = arr.length;


    int sumOfArray = 0;


    for (int i = 0; i < arr.length - 1; i++) {


    sumOfArray += arr[i];


    sumFrom1toK += i + 1;


    }


    return sumFrom1toK - sumOfArray;


    }


    INFO: You can also use the formula for calculating the sum of an arithmetic progression:
    sumFrom1toK = (k*(1+k))/2\. K is the length of the input array.


    RUNNING TIME COMPLEXITY:


    O(N)


    SPACE COMPLEXITY:


    O(1)


    49.Given a binary tree find the maximum sum that exist in a path of a tree. A
    path can start from any node and end at any node.


    e.g:


