    17.Given an array of Triples that represent the the amount of RAM needed for an
    app and the start and termination times of the app, find the maximum amount of
    RAM needed.


    e.g:


    input:


    start time end time ram needed


    2 4 1


    3 6 2


    3 9 3


    output: 6


    _______________


    SOLUTION:


    class Triple {


    int  startTime, endTime, ramNeeded;


    }


    public static int maxRamNeeded(List<Triple> in) {


    if (in == null) {


    return Integer.MIN_VALUE;


    }


    Map<Integer, Integer> tm = new TreeMap<Integer, Integer>();


    for (Triple t : in) {


    tm.put(t.startTime, t.ramNeeded);


    tm.put(t.endTime, -t.ramNeeded);


    }


    int curRam = 0, maxRam = 0;


    for (Map.Entry<Integer, Integer> entry : tm.entrySet()) {


    curRam += entry.getValue();


    maxRam = Math.max(curRam, maxRam);


    }


    return maxRam;


    }


    INFO: TreeMap always will keep its entries sorted based on their key. The cost
    for insertion is O(logN).


    RUNNING TIME COMPLEXITY:


    O(NlogN)


    SPACE COMPLEXITY:


    O(N)


    18.Calculate the power of a number to a base without using a built-in function.


    e.g:


    input: 2^3


    output: 8


    _______________


    SOLUTION:


    public  static  long pow(int a, int b) {


    long[] M = new long[b + 1];


    M[0] = 1;


    M[1] = a;


    return powHelper(a, b, M);


    }


    public static long powHelper(int a, int b, long[] M) {


    if (M[b] == 0) {


    if (b % 2 == 0) {


    M[b] = powHelper(a, b / 2, M)


    * powHelper(a, b / 2, M);


    } else {


    M[b] = powHelper(a, (b - 1) / 2, M)


    * powHelper(a, (b - 1) / 2, M) * a;


    }


    }


    return M[b];


    }


