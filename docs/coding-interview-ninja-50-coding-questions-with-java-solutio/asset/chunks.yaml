- fmt: "\n![](images/00002.jpeg)\n\n# Introduction\n\nGetting your dream software\
    \ engineering job could be a matter of how well you perform in your coding interview\
    \ part. Perhaps it is the most important part of your interview process.\n\nYour\
    \ recruiter will recommend you to read again your university algorithms and data\
    \ structures book to brush up on Computer Science fundamentals. And although this\
    \ is necessary, it is not enough. The types of questions that you will find in\
    \ an algorithms book are not designed to be solved under pressure in a short 45-minutes\
    \ period. The best way to prepare yourself for the coding interview is to practice\
    \ on similar questions to the ones that you will be asked to solve. This is the\
    \ aim of this book; to present you some sample interview coding questions with\
    \ a sample solution code.\n\nSince every company has a slightly different interview\
    \ process and question style, it is highly recommended after you finish practicing\
    \ with the questions of this book, to take a look at questions that have been\
    \ recently asked to candidates from sites such as CareerCup and Glassdoor.\n\n\
    Don’t forget that you don’t have to know everything and solve perfectly all the\
    \ questions that you will be asked in order to proceed to the next phase of the\
    \ interview process. Most of the times, the interviewers just want to see your\
    \ thought process when dealing with new problems and how well you know to code.\n\
    \nFinally, if you find something that you believe it is wrong, don’t hesitate\
    \ to get in touch with me.\n\nGood luck with your interviews!\n\n# Preparation\n\
    \nBefore starting practicing for the coding interview, you will need to brush\
    \ up some of the fundamentals of computer science. Below is a list of the most\
    \ important topics, in my opinion, that you need to look into. This list is by\
    \ no means a complete one.\n\n## Programming Language\n\nYou must know really\
    \ well a programming language of your choice. Being fluent in the language of\
    \ your choice will give you more time to think about the actual problem rather\
    \ than thinking how to implement the solution that you have in your mind. The\
    \ most popular languages among the tech companies are `Java`, `C/C++` and `Python`.\n\
    \n## Running time complexity\n\nMost of the times, the interviewer will ask you\
    \ the running time of your program meaning the big O complexity, that is the worst-case\
    \ analysis of the running time. In some cases, such as when dealing with popular\
    \ algorithms that have a bad big O analysis (eg. `quicksort`), it is useful to\
    \ know the average running time as well.\n\n## Data structures\n\n### Linked Lists\n\
    \nEach node in a linked list has a data element and a pointer to the next node.\
    \ A sample definition of a linked list node is:\n\n```java\nclass LLNode {\n \
    \ int data;\n  LLNode next;\n  LLNode(int data) {\n    this.data = data;\n  }\n\
    }\n```\n\nA linked list may be double linked, which means that each node has a\
    \ pointer to the previous node as well. A sample definition would be:\n\n```java\n\
    class DLLNode {\n  int data;\n  DLLNode next, prev;\n  DLLNode(int data) {\n \
    \   this.data = data;\n  }\n}\n```\n\nYou can insert a new node in a linked list\
    \ in `O(1)` time. To look up for an element in a linked list you need `O(n)` time.\n\
    \n### Trees\n\nEach node in a tree has a data element and a list of pointers to\
    \ its children. The most popular form of trees are the binary trees which have\
    \ only two children. A sample definition, that is used throughout all the practice\
    \ questions that follow, is:\n\n```java\nclass TNode {\n  int data;\n  TNode left,\
    \ right;\n  TNode(int data) {\n    this.data = data;\n  }\n}\n```\n\nIn some cases,\
    \ the tree nodes could have a pointer to their father-node.\n\nA popular specialization\
    \ of a binary tree is the Binary Search Tree (`BST`) where each node’s element\
    \ must be greater than every element in its left subtree and less than every element\
    \ in its right subtree.\n\nThe process of visiting each node in a tree is called\
    \ tree traversal. There are three basic ways to explore a tree in a depth-first\
    \ order. The following sample code prints a tree with the three basic traversals:\n\
    \n```java\npublic static void preOrder(TNode root) {\n  if (root == null) { return;\
    \ };\n  System.out.println(root.data);\n  preOrder(root.left);\n  preOrder(root.right);\n\
    }\n\npublic static void inOrder(TNode root) {\n  if (root == null) { return; };\n\
    \  inOrder(root.left);\n  System.out.println(root.data);\n  inOrder(root.right);\n\
    }\n\npublic static void postOrder(TNode root) {\n  if (root == null) { return;\
    \ };\n  postOrder(root.left);\n  postOrder(root.right);\n  System.out.println(root.data);\n\
    }\n```\n\n### Hash Tables\n\nA hash map is used to associate a key with a value.\
    \ The advantage of this data structure is that theoretically each operation (insertion,\
    \ removal, look-up) requires on average `O(1)` time.\n\nTo insert a new element\
    \ into the hash map, you compute the hash code of the key. If the hash code that\
    \ was computed already exist in the structure, then a collision resolution technique\
    \ is used. The two most popular resolution techniques are:\n\n- **Separate Chaining**:\
    \ Each bucket is independent and some sort of dynamic list is used for every hash\
    \ code index.\n- **Open Addressing**: The buckets are examined until an unoccupied\
    \ bucket is found.\n\nTo create a new hash map data structure with `String` key\
    \ and values in Java:\n\n```java\nHashMap<String, String> hm = new HashMap<String,\
    \ String>();\n```\n\nThis is maybe the most popular data structure among interviewers!\n\
    \n### Stacks\n\nA Last-In-First-Out data structure. It would be useful to know\
    \ how to implement a stack from scratch using arrays since an interviewer could\
    \ ask to create a modified stack with special functionality. For all the other\
    \ cases that you might need a stack, you can use the built-in implementation of\
    \ your language. To use a stack of `String` in Java:\n\n```java\nStack<String>\
    \ stack = new Stack<String>();\n```\n\n### Queues\n\nA First-In-First-Out data\
    \ structure. It would be useful to know how to implement a queue from scratch\
    \ using arrays since an interviewer could ask to create a modified queue. To use\
    \ a queue of `String` in Java:\n\n```java\nQueue<String> queue = new LinkedList<String>();\n\
    ```\n\n### Graphs\n\nA set of nodes that are connected by links. Can be represented\
    \ using an adjacency matrix or an adjacency list. The graph theory can be asked\
    \ by interviewers since it is used extensively in many algorithms.\n\n### Tries\n\
    \nA tree data structure that usually holds characters and has many applications\
    \ in string manipulation. Usually, all the descendants of a node have a common\
    \ prefix of the string associated with that node and the root is associated with\
    \ the empty string. A popular application of this data structure is the look up\
    \ in a dictionary of words (such as a simple auto-complete functionality in a\
    \ text box).\n\n## Algorithms\n\nIts really rare for an interviewer to ask you\
    \ to implement a specific complicated and long algorithm (such as `Dijkstra`,\
    \ `A*`, etc.). However, you should have an idea how these work, what they are\
    \ used for and to be able to conduct a basic conversation when the subject is\
    \ involving a well-known algorithm. Also, it is recommended to know what and how\
    \ Dynamic Programming works and to be able to recognize it. The following are\
    \ popular simpler algorithms that is suggested to know how to implement in case\
    \ the interviewer asks you to implement a modification of the algorithm:\n\n-\
    \ `Breadth-first search (DFS)`\n- `Depth-first search (BFS)`\n- `Mergesort`\n\
    - `Quicksort`\n- `Binary Search`\n\n## OTHER\n\n### Recursion\n\nA powerful technique\
    \ that is used to solve computer science problems and asked frequently in interviews.\
    \ Some times makes the solution of a problem simpler and produces compact code.\
    \ Remember that this technique requires more memory than an iterative solution.\
    \ Also, when writing a recursive solution don’t forget the terminating condition\
    \ of the recursion.\n\n### Object Oriented Design\n\nInterviewers might ask you\
    \ to describe the basic objects for a given system. Therefore, knowing the fundamentals\
    \ of object oriented principles is crucial.\n\n### Testing\n"
