    SOLUTION:


    public static void swap(int[] arr, int x, int y) {


    int temp = arr[x];


    arr[x] = arr[y];


    arr[y] = temp;


    }


    public static int partition(int[] arr, int first, int last) {


    int pivot = first;


    swap(arr, last, pivot);


    for (int i = first; i < last; i++) {


    if (arr[i] > last) {


    swap(arr, i, first);


    first++;


    }


    }


    swap(arr, first, last);


    return first;


    }


    public static int quickselect(int[] arr, int first, int last, int k) {


    if (first > last)


    return Integer.MIN_VALUE;


    int pivot = partition(arr, first, last);


    if (pivot == k) {


    return arr[pivot];


    }


    if (pivot > k) {


    return quickselect(arr, first, pivot - 1, k);


    } else {


    return quickselect(arr, pivot + 1, last, k);


    }


    }


    INFO:


    If you choose the pivot more wisely, such as choosing the median of medians of
    sets of 5, you can avoid the worst case time complexity of O(N²).


