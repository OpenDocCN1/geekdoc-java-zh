    public static void waveSort(int[] arr) {


    if (arr == null) {


    return;


    }


    Arrays.sort(arr);


    for (int i = 0; i < arr.length - 2; i += 2) {


    int temp = arr[i];


    arr[i] = arr[i + 1];


    arr[i + 1] = temp;


    }


    }


