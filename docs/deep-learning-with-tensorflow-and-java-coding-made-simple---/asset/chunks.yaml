    \n## 2.1 什么是变量？\n\n在 Java 中，变量是存储值的命名存储位置。它作为程序执行期间可以修改的数据容器。变量允许你对其进行赋值、获取值并对其进行操作。\n\
    \n在使用变量之前，你必须通过指定其数据类型并命名来声明它。这会告诉编译器变量可以存储什么类型的数据，并为其分配内存。\n\n## 2.2 基本数据类型\n\
    \nJava 提供了几种表示基本类型的基本数据类型。这些数据类型是语言内置的，具有预定义的特性。\n\n这里是常用的基本数据类型：\n\n- `byte`：用于存储\
