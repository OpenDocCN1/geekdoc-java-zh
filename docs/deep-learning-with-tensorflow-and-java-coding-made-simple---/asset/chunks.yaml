    Overfitting is a common challenge in neural network training, where the model
    becomes too specialized to the training data and performs poorly on new, unseen
    data. Regularization techniques help mitigate overfitting by introducing additional
    constraints during the training process. Some popular regularization techniques
    include:


    - **L1 Regularization**: `L1` regularization adds a penalty term to the loss function
