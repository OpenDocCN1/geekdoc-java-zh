    `Java`脱颖而出的特征之一是它的“编写一次，随运行”原则。这意味着一旦你写了一个`Java`程序，它就可以在任何安装了 Java 虚拟机(`JVM`)的设备或操作系统上运行。这种平台无关性使得`Java`成为开发从桌面软件到
    Web 和移动应用程序各种应用的流行选择。


