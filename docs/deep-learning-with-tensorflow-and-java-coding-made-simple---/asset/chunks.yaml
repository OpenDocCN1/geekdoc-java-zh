    Activation functions introduce non-linearity into the neural network, allowing
    it to learn complex patterns and make non-linear predictions. The choice of activation
    function depends on the problem and the characteristics of the data. Here are
    some commonly used activation functions:


    - `ReLU (Rectified Linear Unit)`: The `ReLU` function returns 0 for negative inputs
    and the input value for positive inputs. It has become a popular choice due to
    its simplicity and ability to handle the vanishing gradient problem.

    - `Sigmoid`: The `sigmoid` function maps the input to a value between 0 and 1,
    making it suitable for binary classification problems. It has a smooth and interpretable
    output but can suffer from vanishing gradients for deep networks.

    - `Tanh (Hyperbolic Tangent)`: The `tanh` function is similar to the `sigmoid`
    function but maps the input to a value between -1 and 1. It is commonly used in
    hidden layers and can capture negative values.

    - `Softmax`: The `softmax` function is primarily used in the output layer for
    multi-class classification problems. It converts the raw outputs of the network
    into probabilities, ensuring that the sum of the probabilities is 1.


    Choosing the right activation function is crucial, as it can affect the learning
    dynamics and performance of the neural network.


    ## 3.4 Forward Propagation


    Forward propagation is the process of passing the input data through the neural
    network to generate predictions. Each neuron in the network performs a weighted
    sum of its inputs, applies an activation function, and passes the result to the
    next layer.


    The forward propagation process can be summarized as follows:


    1. Initialize the input layer with the input data.

    2. Compute the weighted sum of the inputs and biases for each neuron in the hidden
    layers using matrix multiplications.

    3. Apply the activation function to the computed sums.

    4. Repeat steps 2 and 3 for subsequent hidden layers until reaching the output
    layer.

    5. Compute the final weighted sums and apply the appropriate activation function
    in the output layer to generate the predictions.


    The output of the neural network is then compared to the ground truth labels using
    a loss function, which measures the discrepancy between the predicted and actual
    values. The loss function plays a critical role in training the neural network
    by providing a feedback signal for updating the model''s parameters.


    In the next chapter, we will dive into the concept of activation functions in
    more detail and explore different types of activation functions commonly used
    in neural networks.


    Stay tuned for Chapter 4: Understanding Activation Functions!


    ## Chapter 4: Understanding Activation Functions


    ### 4.1 Introduction to Activation Functions


    Activation functions are an essential component of neural networks. They introduce
    non-linearity, allowing neural networks to model complex relationships between
    inputs and outputs. In this chapter, we will explore various types of activation
    functions, their properties, and their suitability for different types of problems.


    ### 4.2 Sigmoid Activation Function


    The sigmoid activation function, also known as the logistic function, is a popular
    choice for binary classification problems. It maps the input to a value between
    0 and 1, representing the probability of belonging to the positive class. The
    `sigmoid` function is defined as follows:


    ```

    f(x) = 1 / (1 + exp(-x))

    ```


    The `sigmoid` function has a smooth S-shaped curve and is differentiable, which
    facilitates the training process using gradient-based optimization algorithms.
    However, it tends to saturate for very large or very small input values, causing
    gradients to become close to zero. This saturation leads to the vanishing gradient
    problem, limiting the network''s ability to learn complex patterns, especially
    in deep networks.


    ### 4.3 ReLU Activation Function


    The Rectified Linear Unit (`ReLU`) activation function has gained significant
    popularity in recent years. It is defined as follows:


    ```

    f(x) = max(0, x)

    ```


    `ReLU` sets negative inputs to zero and keeps positive inputs unchanged. It is
    computationally efficient and addresses the vanishing gradient problem by preventing
    saturation for positive inputs. `ReLU` has been successful in training deep neural
    networks and is widely used in hidden layers. However, `ReLU` neurons can be prone
    to dying out, where they become non-responsive and result in dead neurons with
    zero activations.


    ### 4.4 Tanh Activation Function


    The hyperbolic tangent (`tanh`) activation function is an extension of the `sigmoid`
    function. It maps the input to a value between -1 and 1, making it suitable for
    problems that require negative values. The `tanh` function is defined as follows:


    ```

    f(x) = (exp(x) - exp(-x)) / (exp(x) + exp(-x))

    ```


    `Tanh` shares some properties with the `sigmoid` function but has a steeper gradient,
    making it more effective in capturing non-linear relationships. However, similar
    to the `sigmoid` function, `tanh` can also suffer from saturation and vanishing
    gradients for extreme input values.


    ### 4.5 Other Activation Functions


    In addition to the `sigmoid`, `ReLU`, and `tanh` functions, there are several
    other activation functions used in neural networks:


    - `Leaky ReLU`: `Leaky ReLU` is a variation of the `ReLU` function that introduces
    a small slope for negative inputs, preventing dead neurons.

    - `Softmax`: `Softmax` is primarily used in the output layer for multi-class classification
    problems. It converts the raw outputs into probabilities, ensuring that the sum
    of the probabilities is 1.

    - `Exponential Linear Unit (ELU)`: `ELU` is similar to `ReLU` but introduces a
    smooth curve for negative inputs, helping to alleviate the dying `ReLU` problem.

    - `Parametric ReLU (PReLU)`: `PReLU` is an extension of `Leaky ReLU` that allows
    the slope for negative inputs to be learned during training.


    The choice of activation function depends on the specific problem, the network
    architecture, and the characteristics of the data. It is often a matter of experimentation
    and fine-tuning to find the most suitable activation function for a given task.


    In the next chapter, we will explore the concept of loss functions, which play
    a crucial role in training neural networks by quantifying the discrepancy between
    predictions and ground truth labels.


    Stay tuned for Chapter 5: Understanding Loss Functions!


    ## Chapter 5: Understanding Loss Functions


    ### 5.1 Introduction to Loss Functions


    Loss functions, also known as cost functions or objective functions, quantify
    the discrepancy between the predicted outputs of a neural network and the ground
    truth labels. They play a crucial role in training neural networks by providing
    a measure of how well the model is performing on the given task. In this chapter,
    we will explore different types of loss functions and their applications.


    ### 5.2 Mean Squared Error (MSE)


    Mean Squared Error (`MSE`) is one of the most commonly used loss functions, especially
    for regression problems. It calculates the average squared difference between
    the predicted and actual values. The formula for `MSE` is as follows:


    ```

    MSE = (1/n) * Σ(y_pred - y_actual)^2

    ```


    where `n` is the number of samples, `y_pred` is the predicted value, and `y_actual`
    is the ground truth value. `MSE` penalizes larger errors more heavily due to the
    squared term, making it sensitive to outliers.


    ### 5.3 Binary Cross-Entropy


    Binary Cross-Entropy is commonly used for binary classification problems, where
    the output of the neural network represents the probability of belonging to the
    positive class. It measures the dissimilarity between the predicted probabilities
    and the true labels. The formula for `Binary Cross-Entropy` is as follows:


    ```

    Binary Cross-Entropy = - (y_actual * log(y_pred) + (1 - y_actual) * log(1 - y_pred))

    ```

