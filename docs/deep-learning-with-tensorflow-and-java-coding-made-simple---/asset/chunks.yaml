    Engine started.\");\n    }\n}\n```\n\n示例（对象实例化与方法调用）：\n```java\nCar myCar = new\
    \ Car();\nmyCar.brand = \"Toyota\";\nmyCar.color = \"Red\";\nmyCar.startEngine();\n\
    ```\n\n### 1.4.5 包与导入语句\n\nJava 将类组织成包（packages）以避免命名冲突。包提供了一种分类相关类的方法，并使其易于复用。要使用其他包中的类，你需要使用\
