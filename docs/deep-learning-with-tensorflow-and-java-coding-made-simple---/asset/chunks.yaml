  trans: "\n\n方法签名包含以下元素：\n\n- **返回类型 (Return Type)**：指定方法返回值的类型。如果方法不返回值，则使用关键字 `void`。\n\
    - **方法名 (Method Name)**：方法的唯一标识符。\n- **参数 (Parameters)**：方法的输入。它们是可选的，并封装在括号内。多个参数之间用逗号分隔。\n\
    - **访问修饰符 (Access Modifier)**：决定方法的可见性（例如，`public`、`private`、`protected`）。\n\n\
    方法声明的语法如下：\n\n```java\naccessModifier returnType methodName(parameters) {\n  \
    \  // method body\n}\n```\n\n示例：\n\n```java\npublic void greetUser(String name)\
    \ {\n    System.out.println(\"Hello, \" + name + \"!\");\n}\n```\n\n在上面的示例中，我们有一个名为\
    \ `greetUser` 的方法，返回类型为 `void`（无返回值）。它接受一个类型为 `String` 的参数 `name`。方法体包含一条打印欢迎消息的语句。\n\
    \n# 4.3 调用方法\n\n要执行方法内部的代码，我们需要调用或调用该方法。方法调用允许我们在程序的特定点使用该方法提供的功能。\n\n要调用方法，我们使用以下语法：\n\
    \n```java\nmethodName(arguments);\n```\n\n示例：\n\n```java\ngreetUser(\"John\");\n\
    ```\n\n在上面的示例中，使用参数 `\"John\"` 调用了 `greetUser` 方法。这将执行方法代码并在控制台上打印消息 \"Hello,\
    \ John!\"。\n\n# 4.4 方法重载\n\n方法重载允许我们定义多个同名但参数列表不同的方法。它使我们能够创建执行相似任务但接受不同类型或数量参数的方法。\n\
    \nJava 根据在方法调用期间传递的参数来确定要执行哪种方法。该决定是在编译时做出的，考虑了参数的数量、类型和顺序。\n\n示例：\n\n```java\n\
    public int sum(int a, int b) {\n    return a + b;\n}\n\npublic double sum(double\
    \ a, double b) {\n    return a + b;\n}\n```\n\n在上面的示例中，我们有两个 `sum` 方法——一个接受两个\
    \ `int` 参数，另一个接受两个 `double` 参数。Java 将根据方法调用时提供的参数类型调用相应的方法。\n\n# 4.5 从方法返回值\n\n\
    方法可以使用 `return` 语句返回值。方法签名中指定的返回类型指示了方法应该返回的值类型。\n\n要从方法返回值，使用以下语法：\n\n```java\n\
    return expression;\n```\n\n示例：\n\n```java\npublic int square(int num) {\n    return\
    \ num * num;\n}\n```\n\n在上面的示例中，`square` 方法接受一个 `int` 参数，并通过将该数与其相乘来返回该数的平方。\n\
    \n# 4.6 总结\n\n在本章中，我们探索了 Java 中方法的概念。我们学习了方法是可重用的代码块，执行特定任务并提供代码的模块化和可重用性。方法由方法签名（包括返回类型、方法名、参数和访问修饰符）和方法体（包含定义方法功能的语句）组成。\n\
    \n我们讨论了如何通过使用方法名后跟括号并传递任何必要参数来调用或执行方法。我们还探索了方法重载，它允许我们定义多个同名但参数列表不同的方法，增加了方法使用的灵活性。\n\
    \n此外，我们还学习了如何使用 `return` 语句从方法返回值。方法签名中指定的返回类型决定了方法应该返回的值类型。通过返回值，方法可以为程序的其他部分提供有用的输出和结果。\n\
    \n方法在构建程序和促进代码重用方面起着关重要的作用。它们有助于将复杂问题分解为更小、更容易管理的任务，并增强代码的可读性、维护性和组织性。\n\n在下一章中，我们将深入数组，数组是允许我们存储和操作元素集合的基础数据结构。准备好探索\
    \ Java 中数组的多功能和强大之处。\n\n# 第 5 章：数组\n\n在第四章中，我们了了概念及其如何允许我们组织和重用代码。现在，在第 5 章中，我们将进入数组的世界。数组是\
    \ Java 中的基本数据结构，允许我们存储和操作元素集合。它们提供了一种处理相同类型多个值的强大方式。\n\n# 5.1 数组简介\n\n数组是一个容器对象，持有固定数量的相同类型的值。数组中的每个值被称为元素，每个元素通过其索引进行访问。数组提供了一种在单个变量中存储和访问多个相关值的方便方法。\n\
    \n# 5.2 数组的声明和初始化\n\n要使用数组，我们需要对其进行声明和初始化。声明指定了数组将持有的元素类型，而初始化将实际值分配给数组元素。\n\n\
    声明数组的语法如下：\n\n```java\ntype[] arrayName;\n```\n\n示例：\n\n```java\nint[] numbers;\n\
    ```\n\n在上面的示例中，我们声明了一个名为 `numbers` 的数组，它将持有 `int` 类型的元素。然而，此时该数组是未初始化的，不包含任何值。\n\
    \n要初始化数组，可以使用以下方法之一：\n\n### 5.2.1 内联初始化\n\n我们可以在声明时直接使用大括号 `{}` 使用值来初始化数组。\n\n\
    ```java\ntype[] arrayName = {value1, value2, value3, ...};\n```\n\n示例：\n\n```java\n\
    int[] numbers = {1, 2, 3, 4, 5};\n```\n\n在上面的示例中，我们声明并初始化了一个名为 `numbers` 的数组，其值为\
    \ 1, 2, 3, 4, 5。\n\n### 5.2.2 使用 new 运算符初始化\n\n我们也可以使用 `new` 运算符初始化数组。这种方法允许我们指定数组的大小。\n\
    \n```java\ntype[] arrayName = new type[size];\n```\n\n示例：\n\n```java\nint[] numbers\
    \ = new int[5];\n```\n\n在上面的示例中，我们声明了一个大小为 5 的名为 `numbers` 的数组。数组初始填充为 `0`。\n\n\
    # 5.3 访问数组元素\n\n可以使用索引访问数组元素，索引从 0 开始到 `length - 1`，其中 `length` 代表数组中元素的数量。\n\n\
    访问数组元素的语法如下：\n\n```java\narrayName[index]\n```\n\n示例：\n\n```java\nint[] numbers\
    \ = {10, 20, 30};\nint firstElement = numbers[0]; // 访问第一个元素 (10)\nint secondElement\
    \ = numbers[1]; // 访问第二个元素 (20)\n```\n\n在上面的示例中，我们通过相应的索引访问 `numbers` 数组的第一个和第二个元素。\n\
    \n# 5.4 数组长度\n\n数组的 `length` 返回它可以包含的元素数量。它是一个最终变量，因此无法修改。\n\n获取数组长度的语法如下：\n\n\
    ```java\narrayName.length\n```\n\n示例：\n\n```java\nint[] numbers = {1, 2, 3, 4,\
    \ 5};\nint arrayLength = numbers.length; // 数组长度 (5)\n```\n\n在上面的示例中，我们获取 `numbers`\
    \ 数组的长度并将其存储在变量 `arrayLength` 中。\n\n# 5.5 修改数组元素\n\n可以使用索引和赋值运算符 (`=`) 为数组元素分配新值来修改它们。\n\
    \n示例：\n\n```java\nint[] numbers = {1, 2, 3, 4, 5};\nnumbers[2] = 10; // 将第三个元素修改为\
    \ 10\n```\n\n在上面的示例中，我们通过分配新值修改了 `numbers` 数组的第三个元素。\n\n# 5.6 遍历数组\n\n为了访问并处理数组的所有元素，可以使用循环，例如\
    \ `for` 循环。\n\n示例：\n\n```java\nint[] numbers = {1, 2, 3, 4, 5};\nfor (int i =\
    \ 0; i < numbers.length; i++) {\n    System.out.println(numbers[i]);\n}\n```\n\
    \n"
- fmt: "\nIn the example above, we use a `for` loop to iterate over each element of\
    \ the `numbers` array. The loop starts from index `0` and goes up to `numbers.length\
    \ - 1`, printing each element to the console.\n\n## 5.7 Multidimensional Arrays\n\
    \nIn Java, we can also have multidimensional arrays, which are arrays of arrays.\
    \ They allow us to store elements in a matrix-like structure.\n\nExample:\n\n\
    ```java\nint[][] matrix = {\n    {1, 2, 3},\n    {4, 5, 6},\n    {7, 8, 9}\n};\n\
    ```\n\nIn the example above, we declare and initialize a 2-dimensional array named\
    \ `matrix`. It contains three rows and three columns.\n\nTo access elements in\
    \ a multidimensional array, we use nested loops.\n\nExample:\n\n```java\nfor (int\
    \ i = 0; i < matrix.length; i++) {\n    for (int j = 0; j < matrix[i].length;\
    \ j++) {\n        System.out.print(matrix[i][j] + \" \");\n    }\n    System.out.println();\n\
    }\n```\n\nIn the example above, we use nested `for` loops to iterate over each\
    \ element of the `matrix` array and print them row by row.\n\n## 5.8 Summary\n\
    \nIn this chapter, we explored the concept of arrays in Java. Arrays are powerful\
    \ data structures that allow us to store and manipulate collections of elements.\
    \ We learned how to declare and initialize arrays, access and modify array elements,\
    \ retrieve the length of an array, and iterate over arrays using loops. We also\
    \ briefly touched upon multidimensional arrays.\n\nArrays provide a convenient\
    \ way to work with multiple values of the same type and offer flexibility in organizing\
    \ and processing data. They are widely used in various programming scenarios,\
    \ such as storing a list of numbers, managing sets of objects, or representing\
    \ matrices.\n\nIn the next chapter, we will delve into the world of object-oriented\
