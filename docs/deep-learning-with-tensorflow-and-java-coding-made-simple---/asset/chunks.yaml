    \n通过有效理解和应用泛型，你可以编写更具灵活性、类型安全且可重用的代码。\n\n在下一章中，我们将深入另一个重要的主题：多线程。多线程允许程序并发执行多个任务，提高效率和响应能力。\n\
    \n# 第 9 章：多线程\n\n在之前的章节中，我们涵盖了 Java 的广泛主题，包括变量、控制流、OOP、异常处理、文件 I/O 和泛型。现在，在第 9\
    \ 章中，我们将探索 Java 中神奇的多线程世界。\n\n## 9.1 多线程简介\n\n多线程是程序并发执行多个线程的能力。线程是程序内部代表独立执行路径的轻级执行单元。多线程允许程序同时执行多个任务，从而提高效率。\n\
    \n## 9.2 创建线程\n\n在 Java 中，创建线程有两种方法：通过扩展 `Thread` 类或实现 `Runnable` 接口。\n\n### 9.2.1\
    \ 扩展 Thread 类\n\n通过扩展 `Thread` 类来创建线程，我们需要重写 `run()` 方法，它是线程执行的入口点。`run()` 方法包含要在独立线程中执行的代码。\n\
    \n示例：\n```java\npublic class MyThread extends Thread {\n    @Override\n    public\
    \ void run() {\n        // 在线程中执行的代码\n    }\n}\n```\n\n要启动线程，我们需要创建 `MyThread`\
    \ 类的实例并调用 `start()` 方法。\n\n示例：\n```java\nMyThread thread = new MyThread();\nthread.start();\n\
    ```\n\n### 9.2.2 实现 Runnable 接口\n\n创建线程的另一种方法是实现 `Runnable` 接口。`Runnable` 接口代表一个可以并发执行的任务。\n\
    \n示例：\n```java\npublic class MyRunnable implements Runnable {\n    @Override\n\
    \    public void run() {\n        // 在线程中执行的代码\n    }\n}\n```\n\n要启动线程，我们创建一个\
    \ `MyRunnable` 类的实例，并将其作为参数传递给 `Thread` 对象。然后调用 `Thread` 对象的 `start()` 方法。\n\n\
    示例：\n```java\nMyRunnable runnable = new MyRunnable();\nThread thread = new Thread(runnable);\n\
    thread.start();\n```\n\n"
