    # 6.7 Polymorphism


    Polymorphism is another important concept in OOP that allows objects of different
    classes to be treated as objects of a common superclass. It enables methods to
    be overridden in subclasses, providing different implementations while retaining
    a common interface.


    Example:


    ```java


    public class Car {


    // ...


    public void drive() {


    System.out.println("Driving a car.");


    }


    }


    public class SportsCar extends Car {


    // ...


    @Override


    public void drive() {


    System.out.println("Driving a sports car at high speed!");


    }


    }


    public class SedanCar extends Car {


    // ...


    @Override


    public void drive() {


    System.out.println("Driving a sedan car smoothly.");


    }


    }


    ```


    In the example above, the ` SportsCar` and `SedanCar` classes both extend the
    `Car` class and override the `drive()` method with their specific implementations.
    When we call the `drive()` method on objects of these classes, the appropriate
    implementation based on the actual object type will be executed.


    ```java


    Car car1 = new Car();


    car1.drive();           // Output: "Driving a car."


    Car car2 = new SportsCar();


    car2.drive();           // Output: "Driving a sports car at high speed!"


    Car car3 = new SedanCar();


    car3.drive();           // Output: "Driving a sedan car smoothly."


    ```


    In the example above, the `drive()` method behaves differently based on the actual
    object type, demonstrating polymorphism.


    # 6.8 Abstraction


    Abstraction is the process of simplifying complex systems by representing only
    essential details and hiding unnecessary complexities. In Java, abstraction is
    achieved through abstract classes and interfaces.


    An abstract class is a class that cannot be instantiated and is meant to be extended
    by subclasses. It can have abstract methods (methods without an implementation)
    and concrete methods (methods with an implementation).


    Example:


    ```java


    public abstract class Vehicle {


    // Abstract method


    public abstract void start();


    // Concrete method


    public void stop() {


    System.out.println("Vehicle stopped.");


    }


    }


    ```


    In the example above, the `Vehicle` class is declared as abstract and contains
    an abstract method `start()` that must be implemented by its subclasses. It also
    has a concrete method `stop()` with a default implementation.


    Interfaces, on the other hand, define a contract of methods that implementing
    classes must adhere to. An interface can have constant fields and abstract methods
    but cannot have instance fields or concrete methods.


    Example:


    ```java


    public interface Driveable {


    // Constant field


    public static final int MAX_SPEED = 100;


    // Abstract method


    public void drive();


    }


    ```


    In the example above, the `Driveable` interface defines a constant field `MAX_SPEED`
    and an abstract method `drive()`.


    Classes can implement multiple interfaces but can only extend one class. By using
    abstraction, we can define common behaviors and enforce a consistent structure
    in our code.


    6.9 Summary


    In this chapter, we explored the concept of Object-Oriented Programming (OOP).
    We learned about classes and objects, encapsulation, access modifiers, constructors,
    inheritance, polymorphism, and abstraction. OOP allows us to create modular, reusable,
    and maintainable code by modeling real-world entities as objects with properties
    and behaviors.


    By using OOP principles, we can design programs that are easier to understand,
    extend, and maintain. Classes and objects provide a way to organize and structure
    our code, while encapsulation and access modifiers ensure data protection and
    control. Inheritance and polymorphism promote code reuse and enable flexibility,
    and abstraction helps in simplifying complex systems.


    In the next chapter, we will explore more advanced topics in Java, including exception
    handling, file I/O, and generics. These concepts will further enhance your understanding
    of the Java programming language and expand your programming capabilities.


    # Chapter 7: Exception Handling and File I/O


    In the previous chapters, we covered the basics of Java programming, including
    variables, control flow, methods, arrays, Object-Oriented Programming (OOP), and
    more. Now, in Chapter 7, we will explore two important topics: Exception Handling
    and File Input/Output (I/O).


    # 7.1 Introduction to Exception Handling


    Exception handling is a mechanism in Java that allows us to handle runtime errors
    or exceptional conditions that may occur during the execution of a program. These
    exceptions can be caused by various factors, such as invalid input, divide-by-zero
    errors, file not found, and more.


    By handling exceptions, we can gracefully recover from errors, provide meaningful
    error messages to the user, and prevent the program from crashing. Java provides
    a built-in exception handling mechanism using the `try-catch-finally` blocks.


    # 7.2 The try-catch-finally Blocks


    The `try-catch-finally` blocks are used to handle exceptions in Java. The `try`
    block contains the code that may throw an exception. The `catch` block is used
    to catch and handle the exception, providing an alternative course of action.
    The `finally` block is optional and is used to execute code that should always
    run, regardless of whether an exception occurred or not.


    Syntax:


    ```java


    try {


    // Code that may throw an exception


    } catch (ExceptionType1 exception1) {


    // Exception handling for ExceptionType1


    } catch (ExceptionType2 exception2) {


    // Exception handling for ExceptionType2


    } finally {


    // Code that always runs


    }


    ```


    Example:


    ```java


    try {


    // Code that may throw an exception


    int result = divide(10, 0); // Example divide-by-zero error


    } catch (ArithmeticException ex) {


    // Exception handling for ArithmeticException


    System.out.println("An arithmetic exception occurred: " + ex.getMessage());


    } finally {


    // Code that always runs


    System.out.println("Inside the finally block.");


    }


    ```


    In the example above, the `try` block attempts to divide `10` by `0`, which will
    throw an `ArithmeticException`. The `catch` block catches the exception and handles
    it by printing an error message. The `finally` block is executed regardless of
    whether an exception occurred or not.


    # 7.3 Checked and Unchecked Exceptions


    In Java, exceptions are categorized into two types: checked exceptions and unchecked
    exceptions.


    Checked exceptions are exceptions that must be declared in the method signature
    using the `throws` keyword or handled using a `try-catch` block. Examples of checked
    exceptions include `IOException`, `SQLException`, and `ClassNotFoundException`.


    Unchecked exceptions, also known as runtime exceptions, do not need to be declared
    or caught explicitly. They are subclasses of the `RuntimeException` class. Examples
    of unchecked exceptions include `ArithmeticException`, `NullPointerException`,
    and `ArrayIndexOutOfBoundsException`.


    It is important to handle or declare checked exceptions to ensure proper error
    handling and maintain code robustness. Unchecked exceptions, on the other hand,
    can be handled optionally.


    # 7.4 File Input/Output (I/O)


    File Input/Output (I/O) is the process of reading from and writing to files in
    a computer system. Java provides several classes and methods for performing file
    I/O operations, allowing us to create, read, write, and manipulate files.


    The key classes involved in file I/O operations are `File`, `FileReader`, `FileWriter`,
    `BufferedReader`, `BufferedWriter`, `InputStream`, `OutputStream`, and more.


    To read data from a file, we typically follow these steps:


    1\. Create a `File` object representing the file.


    2\. Create a `FileReader


    object, passing the `File` object as a parameter.


    3\. Wrap the `FileReader` object in a `BufferedReader` object for efficient reading.'
