    \ `matrix` 数组的每个元素并逐行打印它们。\n\n## 5.8 总结\n\n在本章中，我们探索了 Java 中数组的概念。数组是强大的数据结构，允许我们存储和操作元素集合。我们学习了如何声明和初始化数组、访问和修改数组元素、获取数组长度，以及使用循环遍历数组。我们还简要提到了多维数组。\n\
    \n数组为处理相同类型的多个值提供了一种方便的方法，并在组织和处理数据方面提供了灵活性。它们被广泛应用于编程场景，例如存储数字列表、管理对象集或表示矩阵。\n\
    \n在下一章中，我们将深入研究面向对象编程 (OOP) 世界，并探索构成类和对象，它们是 OOP 的基础。准备好学习封装、抽象和面向对象的设计原则。\n\n\
    # 第 6 章：面向对象编程 (OOP)\n\n在之前的章节中，我们涵盖了 Java 编程的基础知识，包括变量、控制流、方法和数组。现在，在第 6 章中，我们将深入研究面向对象编程\
    \ (OOP) 世界。面向对象编程是一种侧重于建模真实世界对象及其在程序内部交互的编程范式。\n\n## 6.1 面向对象编程简介\n\n面向对象编程 (OOP)\
    \ 是一种将代码组织成对象（类的实例）的编程范式。它强调封装、继承、多态和抽象的概念。OOP 通过将真实实体表示为具有属性（字段）和行为（方法）的对象，允许我们创建模块化、可重用且可维护的代码。\n\
    \n## 6.2 类和对象\n\n在 OOP 中，类是定义对象结构和行为的蓝图或模板。它描述了类对象将拥有的属性和方法。而对象是类的实例。它们代表特定的实体并可以相互交互。\n\
    \n要创建一个类，我们使用以下语法：\n\n```java\npublic class ClassName {\n    // 类成员（字段、构造函数、方法）\n\
    }\n```\n\n示例：\n\n```java\npublic class Car {\n    // 类成员\n}\n```\n\n在上面的示例中，我们定义了一个名为\
    \ `Car` 的类。它作为创建 `Car` 对象的蓝图。\n\n## 6.3 成员：字段和方法\n\n类由两部分组成：字段和方法。字段代表对象的属性或特性。而方法定义了对象可以执行的行为或动作。\n\
    \n示例：\n\n```java\npublic class Car {\n    // 字段\n    private String brand;\n \
    \   private String color;\n    private int year;\n\n    // 方法\n    public void\
    \ startEngine() {\n        System.out.println(\"Engine started!\");\n    }\n\n\
    \    public void drive(int distance) {\n        System.out.println(\"Driving \"\
    \ + distance + \" kilometers.\");\n    }\n}\n```\n\n## 6.4 封装和访问修饰符\n\n封装是 OOP\
    \ 中的一个重要概念，涉及将数据（字段）和方法结合的同时隐藏实现细节。Java 提供了访问修饰符来控制类成员的可性和访问权限：\n\n- `public`：随处可见。\n\
    - `private`：仅在类内部可见。\n- `protected`：在同一包内以及子类可见。\n- 默认（无修饰符）：在同一包内可见。\n\n为了维护数据的完整性，字段应声明为\
    \ `private`，并通过 getter 和 setter 方法提供访问。\n\n示例：\n\n```java\npublic class Car {\n\
    \    private String brand;\n    private String color;\n    private int year;\n\
    \n    // Getter 和 setter\n    public String getBrand() {\n        return brand;\n\
    \    }\n\n    public void setBrand(String brand) {\n        this.brand = brand;\n\
    \    }\n\n    public String getColor() {\n        return color;\n    }\n\n   \
    \ public void setColor(String color) {\n        this.color = color;\n    }\n\n\
    \    public int getYear() {\n        return year;\n    }\n\n    public void setYear(int\
    \ year) {\n        this.year = year;\n    }\n}\n```\n\n## 6.5 构造函数\n\n构造函数是一种用于初始化类对象的特殊方法。它在使用\
    \ `new` 关键字创建对象时被调用。构造函数与类名相同，且没有返回类型。\n\n示例：\n\n```java\npublic class Car {\n\
    \    private String brand;\n    private String color;\n    private int year;\n\
    \n    // 默认构造函数\n    public Car() {\n        brand = \"Unknown\";\n        color\
    \ = \"Unknown\";\n        year = 0;\n    }\n\n    // 带参数的构造函数\n    public Car(String\
    \ brand, String color, int year) {\n        this.brand = brand;\n        this.color\
    \ = color;\n        this.year = year;\n    }\n}\n```\n\n## 6.6 继承\n\n继承是 OOP 中的一种机制，允许类（子类）继承另一个类（父类）的属性和行为。子类扩展父类，继承它的字段、方法和构造函数。它促进了代码重用，并支持类之间层次关系的概念。\n\
    \n要创建一个子类，我们使用 `extends` 关键字：\n\n```java\npublic class SportsCar extends Car {\n\
    \    // SportsCar 特有的额外成员和方法\n}\n```\n"
- fmt: "\nIn the example above, we define a `SportsCar` class that extends the `Car`\
    \ class. The `SportsCar` class inherits the fields and methods of the `Car` class\
    \ and can also define additional members and methods specific to sports cars.\n\
    \n# 6.7 Polymorphism\n\nPolymorphism is another important concept in OOP that\
    \ allows objects of different classes to be treated as objects of a common superclass.\
    \ It enables methods to be overridden in subclasses, providing different implementations\
    \ while retaining a common interface.\n\nExample:\n\n```java\npublic class Car\
    \ {\n    // ...\n    public void drive() {\n        System.out.println(\"Driving\
    \ a car.\");\n    }\n}\n\npublic class SportsCar extends Car {\n    // ...\n \
    \   @Override\n    public void drive() {\n        System.out.println(\"Driving\
    \ a sports car at high speed!\");\n    }\n}\n\npublic class SedanCar extends Car\
    \ {\n    // ...\n    @Override\n    public void drive() {\n        System.out.println(\"\
    Driving a sedan car smoothly.\");\n    }\n}\n```\n\nIn the example above, the\
    \ `SportsCar` and `SedanCar` classes both extend the `Car` class and override\
    \ the `drive()` method with their specific implementations. When we call the `drive()`\
    \ method on objects of these classes, the appropriate implementation based on\
    \ the actual object type will be executed.\n\n```java\nCar car1 = new Car();\n\
    car1.drive();              // Output: \"Driving a car.\"\n\nCar car2 = new SportsCar();\n\
    car2.drive();              // Output: \"Driving a sports car at high speed!\"\n\
    \nCar car3 = new SedanCar();\ncar3.drive();              // Output: \"Driving\
    \ a sedan car smoothly.\"\n```\n\nIn the example above, the `drive()` method behaves\
    \ differently based on the actual object type, demonstrating polymorphism.\n\n\
    # 6.8 Abstraction\n\nAbstraction is the process of simplifying complex systems\
    \ by representing only essential details and hiding unnecessary complexities.\
    \ In Java, abstraction is achieved through abstract classes and interfaces.\n\n\
    An abstract class is a class that cannot be instantiated and is meant to be extended\
    \ by subclasses. It can have abstract methods (methods without an implementation)\
    \ and concrete methods (methods with an implementation).\n\nExample:\n\n```java\n\
    public abstract class Vehicle {\n    // Abstract method\n    public abstract void\
    \ start();\n\n    // Concrete method\n    public void stop() {\n        System.out.println(\"\
    Vehicle stopped.\");\n    }\n}\n```\n\nIn the example above, the `Vehicle` class\
    \ is declared as abstract and contains an abstract method `start()` that must\
    \ be implemented by its subclasses. It also has a concrete method `stop()` with\
    \ a default implementation.\n\nInterfaces, on the other hand, define a contract\
    \ of methods that implementing classes must adhere to. An interface can have constant\
    \ fields and abstract methods but cannot have instance fields or concrete methods.\n\
    \nExample:\n\n```java\npublic interface Driveable {\n    // Constant field\n \
    \   public static final int MAX_SPEED = 100;\n\n    // Abstract method\n    public\
    \ void drive();\n}\n```\n\nIn the example above, the `Driveable` interface defines\
    \ a constant field `MAX_SPEED` and an abstract method `drive()`.\n\nClasses can\
    \ implement multiple interfaces but can only extend one.\n\n6.9 Summary\n\nIn\
    \ this chapter, we explored the concepts of polymorphism, abstraction, and encapsulation.\
    \ We learned about classes, objects, and access modifiers. By using these principles,\
    \ we can design more flexible and maintainable code. In the next chapter, we will\
    \ explore more advanced topics.\n\n# 7. Exception Handling\n\nIn the previous\
    \ chapters, we covered the basics of Java. Now, in Chapter 7, we will explore\
    \ Exception Handling and File Input/O.\n\n7.1 Introduction to Exception Handling\n\
    \nException handling is a mechanism in Java that allows us to handle runtime errors\
    \ or exceptional conditions that may occur during the execution of a program.\
    \ By handling exceptions, we can gracefully recover from errors and provide meaningful\
    \ messages to the user.\n\n7.2 The try-catch-finally Blocks\n\nThe `try-catch-finally`\
    \ blocks are used to handle exceptions in Java. The `try` block contains the code\
    \ that may throw an exception. The `catch` block is used to catch and handle the\
    \ exception. The `finally` block is optional and is used to execute code that\
    \ should always run, regardless of whether an exception occurred or not.\n\nSyntax:\n\
    \n```java\ntry {\n    // Code that may throw an exception\n} catch (ExceptionType1\
    \ exception1) {\n    // Exception handling for ExceptionType1\n} catch (ExceptionType2\
    \ exception2) {\n    // Exception handling for Exception2\n} finally {\n    //\
    \ Code that always runs\n}\n```\n\nExample:\n\n```java\ntry {\n    // Code that\
    \ may throw an exception\n    int result = divide(10, 0);\n} catch (ArithmeticException\
    \ ex) {\n    // Exception handling for ArithmeticException\n    System.out.println(\"\
    An arithmetic exception occurred: \" + ex.getMessage());\n} finally {\n    //\
    \ Code that always runs\n    System.out.println(\"Inside the finally block.\"\
    );\n}\n```\n\nIn the example above, the `try` block attempts to divide `10` by\
    \ `0`, which will throw an `ArithmeticException`. The `catch` block catches the\
    \ exception and handles it by printing an error message. The `finally` block is\
    \ executed regardless of whether an exception occurred or not.\n\n7.3 Checked\
    \ and Unchecked Exceptions\n\nIn Java, exceptions are categorized into two types:\
    \ checked and unchecked exceptions.\n\nChecked exceptions are exceptions that\
    \ must be declared in the method signature using the `throws` keyword or handled\
    \ using a `try-catch` block. Examples of checked exceptions include `IOException`,\
    \ `SQLException`, and `ClassNotFoundException`.\n\nUnchecked exceptions, also\
    \ known as runtime exceptions, do not need to be declared or caught explicitly.\
    \ They are subclasses of the `RuntimeException` class. Examples of unchecked exceptions\
    \ include `ArithmeticException`, `NullPointerException`, and `ArrayIndexOutOfBoundsException`.\n\
    \nIt is important to handle or declare checked exceptions to ensure proper error\
    \ handling and maintain code robustness. Unchecked exceptions, on the other hand,\
