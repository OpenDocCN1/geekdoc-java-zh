    # Chapter 6: Object-Oriented Programming (OOP)


    In the previous chapters, we covered the basics of Java programming, including
    variables, control flow, methods, and arrays. Now, in Chapter 6, we will delve
    into the world of Object-Oriented Programming (OOP). Object-Oriented Programming
    is a programming paradigm that focuses on modeling real-world objects and their
    interactions within a program.


    # 6.1 Introduction to Object-Oriented Programming


    Object-Oriented Programming (OOP) is a programming paradigm that organizes code
    into objects, which are instances of classes. It emphasizes the concepts of encapsulation,
    inheritance, polymorphism, and abstraction. OOP allows us to create modular, reusable,
    and maintainable code by representing real-world entities as objects with properties
    (attributes) and behaviors (methods).


    # 6.2 Classes and Objects


    In OOP, a class is a blueprint or template that defines the structure and behavior
    of objects. It describes the attributes and methods that objects of that class
    will possess. Objects, on the other hand, are instances of classes. They represent
    specific entities and can interact with each other.


    To create a class, we use the following syntax:


    ```java


    public class ClassName {


    // class members (fields, constructors, methods)


    }


    ```


    Example:


    ```java


    public class Car {


    // class members


    }


    ```


    In the example above, we define a class named `Car`. It serves as a blueprint
    for creating car objects.


    To create an object (instance) of a class, we use the `new` keyword:


    ```java


    ClassName objectName = new ClassName();


    ```


    Example:


    ```java


    Car myCar = new Car();


    ```


    In the example above, we create an object `myCar` of the `Car` class.


    6.3 Class Members: Fields and Methods


    A class consists of two types of members: fields (variables) and methods.


    Fields represent the attributes or properties of an object. They store the state
    or data associated with an object. Fields can be of different types, such as `int`,
    `double`, `String`, or even other objects.


    Methods, on the other hand, define the behavior or actions that objects can perform.
    They encapsulate the operations or functionalities related to the object. Methods
    can have parameters and may return values.


    Example:


    ```java


    public class Car {


    // Fields


    String brand;


    String color;


    int year;


    // Methods


    public void startEngine() {


    System.out.println("Engine started!");


    }


    public void drive(int distance) {


    System.out.println("Driving " + distance + " kilometers.");


    }


    }


    ```


    In the example above, the `Car` class has fields `brand`, `color`, and `year`,
    representing the attributes of a car. It also has methods `startEngine()` and
    `drive(int distance)` that define the behaviors of a car.


    # 6.4 Encapsulation and Access Modifiers


    Encapsulation is an important concept in OOP that involves bundling data (fields)
    and methods together within a class and controlling their access. It helps in
    hiding the internal implementation details of a class and provides data protection
    and security.


    Java provides access modifiers to control the visibility and accessibility of
    class members. The four access modifiers are:


    - `public`: The member is accessible from anywhere.


    - `private`: The member is only accessible within the same class.


    - `protected`: The member is accessible within the same class, subclasses, and
    same package.


    - Default (no modifier): The member is accessible within the same package.


    By default, fields should be declared as private, and access to them should be
    provided through methods (getters and setters) to maintain encapsulation and ensure
    data integrity.


    Example:


    ```java


    public class Car {


    // Private fields


    private String brand;


    private String color;


    private int year;


    // Getters and setters


    public String getBrand() {


    return brand;


    }


    public void setBrand(String brand) {


    this.brand = brand;


    }


    public String getColor() {


    return color;


    }


    public void setColor(String color) {


    this.color = color;


    }


    public int getYear() {


    return year;


    }


    public void setYear(int year) {


    this.year = year;


    }


    // Methods


    public void startEngine() {


    System.out.println("Engine started!");


    }


    public void drive(int distance) {


    System.out.println("Driving " + distance + " kilometers.");


    }


    }


    ```


    In the example above, we have modified the `Car` class to encapsulate the fields
    by making them private. We provide public getter and setter methods to access
    and modify the private fields. This way, we can control the access to the internal
    state of the `Car` objects while maintaining data integrity.


    # 6.5 Constructors


    A constructor is a special method that is used to initialize the objects of a
    class. It is called when an object is created using the `new` keyword. Constructors
    have the same name as the class and do not have a return type.


    Example:


    ```java


    public class Car {


    private String brand;


    private String color;


    private int year;


    // Default constructor


    public Car() {


    brand = "Unknown";


    color = "Unknown";


    year = 0;


    }


    // Parameterized constructor


    public Car(String brand, String color, int year) {


    this.brand = brand;


    this.color = color;


    this.year = year;


    }


    // ...


    }


    ```


    In the example above, we have added two constructors to the `Car` class. The default
    constructor sets the initial values of the fields to default values. The parameterized
    constructor takes arguments to initialize the fields with specific values.


    # 6.6 Inheritance


    Inheritance is a mechanism in OOP that allows a class (subclass) to inherit the
    properties and behaviors of another class (superclass). The subclass extends the
    superclass, inheriting its fields, methods, and constructors. It promotes code
    reuse and supports the concept of hierarchical relationships between classes.


    To create a subclass, we use the `extends` keyword:


    ```java


    public class SubclassName extends SuperclassName {


    // Subclass members


    }


    ```


    Example:


    ```java


    public class SportsCar extends Car {


    // Additional members and methods specific to SportsCar


    // ...


    }


    ```'
