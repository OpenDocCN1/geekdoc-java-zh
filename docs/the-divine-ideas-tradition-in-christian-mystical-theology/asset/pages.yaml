    Christians believe that the infinite goodness and generosity of God flow in and
    through all creatures—a continuous gift within them, a likeness of the full plenitude
    of goodness which is God. Because of its total ubiquity, this generosity is hidden
    in plain sight, seemingly the natural, beneficial, mutuality of creative existence.
    At the most basic level this generosity takes the form of the unstinting and unce
