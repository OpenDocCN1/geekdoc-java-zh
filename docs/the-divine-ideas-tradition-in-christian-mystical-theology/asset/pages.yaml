    Readers familiar with ancient and medieval Christianity will immediately recognize
    the book''s structure as attempting to follow the path of Pseudo-Dionysius and
    Thomas Aquinas, striving to articulate a theological pattern that mirrors what
    I believe to be the dynamic of existence itself—coming from the infinite Existence
    we call God and returning to God along the way pioneered, Christians believe,
    by Jesus through the Spirit. Accordingly, the first chapter introduces the divine
    tradition grounded in the Trinitarian life of God (and also offers some important
    clarifications about the nature of my argument). The second chapter investigates
    the way in which the divine ideas teaching inflect the Christian understanding
    of creation, as well as offering some attempt to think about the historical marginalization
    of this perspective in the late medieval and early modern periods. Chapter 3 argues
    that the Incarnation and Paschal mystery fundamentally reconstitute the divine
    ideas within Christological and Trinitarian modes of reflection, and the chapter
    further proposes that it is on these doctrinal grounds that the divine ideas might
    prove a helpful rediscovery. Chapter 4 explores more fully how the resurrection
    of Christ, considered as re-creating and bringing to life the truth of all creatures;
    the chapter suggests that the Christian community, desiring to share ever more
    fully in Christ''s dying and rising, develops a new understanding of humanity''s
    contemplative calling—so that a continual conversion of contemplative consciousness
    collaborates in Christ''s re-harmonizing of creation with God''s knowing and loving
    of each creation. The final chapter suggests how the divine ideas permit mystical
    theology to envision a fourfold anthology of intelligibility: in the mind of God,
    in human (and angelic) acts of understanding, in the vindication of Christ (through
    his resurrection) as the truth of God and of creation, and in the consummation
    of the human desire to know the truth in the vision of God.'
