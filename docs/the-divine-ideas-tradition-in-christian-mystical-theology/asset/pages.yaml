    in time to be overcome by an ascent to purely spiritual reality in beatitude?


    And so the question arises, what is the divine meaning inherent in our earthly
    struggle to fulfill the personal calling and gifts that comprise our embodied
    existence—especially in the light of the fact that we know ourselves to be mortal,
    that all we have loved and sought to achieve will need to be surrendered. How
    does this ultimate mystery of human existence find illumination from the divine
    ideas tradition? Needless to say such a question could never be answered satisfactorily
    within let a brief conclusion. But perhaps I might attempt to sketch in outline
    the central insights that I believe the divine ideas teaching could offer us in
    reflecting upon this deep existential question.


    First, as we have noted throughout this book, the divine ideas, which are the
    exemplars for all creatures, are themselves aspects of the eternal relational
    self-knowing and loving of the Trinity. This means that all creatures, and perhaps
    especially relational beings with freedom to choose how they enact their existence,
    enjoy fundamentally relational identities—that is, our personhood, which makes
    us who we are, are not isolated “within” us as some private aspect of our biology
    or psychology. Rather our grounding in God’s knowing and loving of us means that
    our identities are discovered and developed through the history of our interactions
    with others, and especially with the divine Other—in likeness to the relational
    personhood of the Trinity.


    And second, the self-sharing and self-communication through which we become who
    we are with others are meant to be life-giving and gracious moments of fulfillment,
    expressing in time the eternal self-sharing generosity of the Trinity within which
    our exemplar exists imperishly. Third, the devastation that this inflicts upon
    the creation distorts this fundamental calling within ourselves to be with and
    for others, rendering this dangerous and fearful; this pervasive distortion of
    the truth of our relational identity as known in the divine ideas shadows every
    phase of human life, but it culminates in the tragic metamorphosis of what might
    have been our most consummate act of self-giving relationality—into the fearful
    and grievous suffering of death.'
