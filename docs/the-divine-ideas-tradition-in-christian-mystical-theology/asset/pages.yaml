    # Clarifying Ideas


    Before going any farther I''d like to offer two clarifications. They are doubtless
    rather obvious, but bearing them in my mind has helped to keep me from misreading
    the divine ideas tradition, or at least from failing to attempt an understanding
    of it in its best light.


    The first clarification simply involves reminding ourselves of the analog context
    within which the divine ideas are considered. It would be easy to conjure a ridiculous
    picture of God rummaging through a few ideas at the back of the divine mind in
    order, say, to come up with the right notion of a particular solar system or giraffe.
    Such anthropomorphic notions are not meant to be strawmen but a reminder: of our
    language about the divine is only a placeholder, way of gesturing adequately but
    in the right direction towards a divine reality that wonderfully exceeds our conceptual
    grasp—even when we attempt to speak. We have to keep remembering that while we
    need to state certain facts about God, for example that God knows and loves all,
    the language we use to declare such truths sound as if it were an explanation
    of why it is really an explanation we try to think about God when stating what
    we believe to be true. This all is my way of suggesting rather than allowing the
    more exuberant speculations of the divine ideas tradition to nudge us, perhaps,
    towards disquiet or even chilly disdain, we might recognize the authors of such
    language as delightful in what they believe to be true about God, explaining with
    how much insight as they can how they think about it, and why they think this
    truth about God to be intelligible—while remaining boldly confident that God alone
    can explain God.


    The second clarification is equally obvious yet complicated to elucidate: namely
    that there is a considerable, and indeed surprising, difference between our present
    modern notion of an idea and the constellation of meanings the term holds for
    most of the thinkers we are considering. So in order for us to see with any adequacy
    how the divine ideas could have played the role they did in Christian theology
    and spirituality, I need to reflect about how our own modern notions of “ideas”
    might require some expansion or at least self-awareness.³'
