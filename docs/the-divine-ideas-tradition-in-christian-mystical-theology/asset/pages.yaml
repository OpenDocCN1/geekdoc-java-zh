    metaphysical and the noetic aspects of the divine ideas. While I will seldom devote
    much attention to fine distinctions in this regard, it may be helpful to readers
    to consider for a moment the diversity of positions that might be possible and
    how they interact with each other—that is, to consider the reciprocal influence
    of particular stances on both the metaphysical and noetic issues in thinking about
    the divine ideas. As a way of making this more evident, we might consider a diagram
    with two axes as displayed below:


    ![](img/2ae595b27f7ebb5015830b721a423e19_17_0.png)


    Considering the vertical (a–b) axis, we can think of the upper reaches as perspectives
    that understand creaturely reality as itself a theophany, an expression in finite
    form of God’s reality. In this view, the divine ideas are expressed in time in
    individualized, finite form, within every creature. At the other end of this axis
    (b), would be the perspective that understands finite reality as not participating
    in the actual divine being, rather as imitating it—like a self-portrait by a painter,
    or a recording of a singer, the creation is not the expression of the immediate
    presence of the divine, but only imitates it in some way. In this perspective,
    then, the divine ideas are not directly present within each creature but are only
    reflected or echoed at the heart of creature.


    Turning to the horizontal axis (c–d), the leftmost position represents human consciousness
    that is entirely untouched by divine illumination and experiences reality from
    the individualist perspective of a human ego looking “out” at all other beings
    as “objects,” either of attractive or repellent significance. This perspective
    is, by most of our thinkers, understood to be profoundly vitiated by sin, turning
    the subject-object division in human'
