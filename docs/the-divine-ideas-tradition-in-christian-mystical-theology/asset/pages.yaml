    in which creatures come to share in a likeness to God, by God''s gift to them
    of finite existence in time. The mind or Word of God are the divine ideas of all
    that ever has been or will be, not moments of foreknowledge about things that
    will come to pass, but as the Father''s infinite self-understanding and self-giving
    in the Son and their mutual joyful love in the Spirit. The divine ideas, in other
    words, are not dependent on creatures to, but rather creatures come to be because
    God eternally knows and loves the truth of God, including the truth of God''s
    gift of existence to other beings. The divine ideas teaching allowed its exponents
    to contemplate with reverence and wonder the goodness, truth, and beauty of our
    fellow creatures it taught that at the core of every being is the continual speaking
    of its imperishable truth or God, the intelligible form or by which God thinks
    and creates each being.


    In the preface I have explained why this book must leave to others the rich historical
    contextualization, the philosophical problems, and the biblical foundations with
    which I would have liked to approach the divine ideas tradition.¹ For good or
    ill this is a shorter book than it might have, and perhaps it would most kindly
    be received as simply a theological essay, a conversation with several of the
    most outstanding teachers of the divine ideas tradition. There are, however, at
    least two possible misrepresentations my necessary approach to discussing the
    divine ideas may unintentionally give, and I hope that by alerting readers to
    these in advance I might mitigate the problem. First, and most obviously, by working
    with a fairly narrow group of thinkers, and highlighting points of intrinsic coherence
    among their different approaches to the divine ideas, I might give readers the
    impression of a far greater homogeneity than I mean to suggest. It goes without
    saying that each author reflects the very different historical and theological
    contexts in they wrote, and while I wish to draw readers'' attention to the broad
    family resemblance among their approaches to the divine ideas, Certainly would
    not wish to imply that they are always of one mind on every. The second possible
    misrepresentation stems from my desire to illustrate how the divine ideas might
    be extended into our contemporary discussions, and how matters are implicit in
    ancient or medieval treatments of the divine ideas might suggest ways forward
    for us today. I hope readers will easily sense when I am drawing out notions that
    are perhaps implicit in our authors, but represent my own attempt to advance a
    discussion about the potential significance of the divine ideas in Christian mystical
    theology. This second issue may arise particularly'
