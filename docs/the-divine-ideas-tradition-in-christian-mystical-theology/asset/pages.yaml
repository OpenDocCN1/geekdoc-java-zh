    Much of the initial research for this book was conducted while I served as the
    Van Mildert Professor of Divinity at Durham University and canon residentary of
    Durham Cathedral. I am so grateful to my colleagues in the University and the
    Cathedral, and to my students and members of the Cathedral congregation, all of
    whom not patiently bore my entusiasms but encouraged me with deep friendship and
    wisdom. Among my doctoral students at Durham, I am especially grateful to Rachel
    Davies for her devoted teaching assistance and for her profoundly insightful scholarship
    on the significance of the suffering body in the spirituality and theology of
    Bonaventure. And above all it gives me great joy to thank another of my PhD students,
    Benjamin DeSpain, for his remarkable work with all my undergraduate students and
    for his exemplary research assistance; his doctoral research and dissertation
    on the divine ideas in Thomas Aquinas proved continual illumination and courage,
    not to mention irreplaceable camaraderie in a common project.


    In 2014 Loyola University Chicago, where I had first begun to teach in 1993, invited
    me to return as the inaugural holder of its Endowed Chair in Christian Spirituality,
    and I am enormously grateful to my colleagues for welcoming me back so warmly,
    as the ALS developed for such gracious and affectionate support. Although I can
    no longer move body, I can still speak and so the University most kindly arranged
    for dictation software, and for two of my doctoral students to visit me regularly
    at home. Without their erudite and endlessly patient assistance, this book would
    have been impossible for me. My so deep gratitude goes to John Marshall Diamond
