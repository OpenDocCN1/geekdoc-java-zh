    figures of Aquinas and Bonaventure. In all this, I have suggested, the fruitfulness
    and agility of the divine ideas makes itself apparent. Here is a matrix within
    which the being of the creatures in time, their being in the noetic journey of
    human thinkers, and their imperishable being in the eternal Word all come to a
    re-creative and salvific communion in the Incarnation.


