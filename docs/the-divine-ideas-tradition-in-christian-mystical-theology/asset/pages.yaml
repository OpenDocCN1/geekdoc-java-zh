  md: '# 4 DIVINE IDEAS IN MYSTICAL THEOLOGY


    At the heart of the argument in this essay are a number of material convictions
    about the substance of the divine ideas teaching but also some hypotheses about
    the formal significance of the divine ideas—that are hypotheses about the particular
    role the divine ideas teaching has played and why that might be so. For example,
    a central implication of the divine tradition is that theology can and respect
    the loving and lovable gratuity at the ground of all creatures—because it is the
    echo within them of the loving freedom of their Author. What the divine tradition
    serves to do, in an instance such as this, is to help contemplate precisely this
    crucial nexus between the creatures, in all their particularity and vulnerable
    cherishability in time, and the eternally free activity of knowing and loving
    by which God is God and in virtue of which the creatures have their existence.
    In Christian tradition, I''m arguing, precisely because the ideas are God''s own
    knowledge of how every creature participates in the divine self-sharing of existence,
    the ideas can be seen as inherently imbued with the self-communicating and relational
    agency of the Trinitarian life in which they are eternally known and loved. I
    will argue later in this book, the embodied historical struggle of every creature
    to discover and to be its true self, to communicate the vivacious idea at its
    core, is never left behind but is integral to its consummate realization, to its
    fullness of life. And as the creature fully lives into its self-communication,
    this true life surges past all false selves constructed by sin and prejudice and
    violence of every kind, and onwards the inexhaustible self-sharing of its truth;
    for the truth the heart of every creature is God''s eternal and imperishable knowing
    and loving of it, and this is the life from which it flows and which, Christians
    believe, God intends it to enjoy forever.


    Among the many uses and attributes of the divine teaching, one in particular,
    I suspect, may have given rise to its ubiquity in the history of Christian thought
    prior to modernity. This is the fact that the divine ideas for Christian teachers
    and mystics as a way of thinking about and indeed, contemplating, the communion
    among God, creatures, and the human person. Within each corner of this metaphorical
    triangle of communion, the ideas have both a metaphysical function (explaining
    how things come to exist as they are) and a noetic or epistemological function
    (explaining how the truth of things can be known). In God, the divine ideas are
    understood by the tradition as an aspect of God''s knowing of Godself, and within
    that eternal self-understanding in the Word, all the ways in which creatures might
    come to participate in or imitate the divine reality. If theologians are contemplating
    the causes of all creatures, they'
