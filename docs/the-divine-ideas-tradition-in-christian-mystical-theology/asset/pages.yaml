  md: '# Introduction


    Sometimes old academic debates, seemingly consigned with relief (on all sides)
    to the dusty realms of historical curiosities, spring astonishingly to life. I
    believe we are in one of those moments. The goodness and beauty of our planet
    have been exploited so grievously to lay bare, with raw and urgent relevance,
    our apparent obliviousness of older views—theological visions that would have
    regarded the goodness and beauty of each creature, as merely a construction of
    human value, appreciated or dismissed according to economic reasons, but as the
    radiant epiphany of the divine goodness and beauty from which all flows. In fatal
    correlation to the denial of the planet''s real goodness and vulnerable beauty,
    we find an equally devastating denial of the truth about what helps or harms the
    planet''s well-being. In fact the rampant abuse of truth in the digital age seems
    to be encouraging an online arms race of misinformation, in which narratives are
    asserted not because they are true but they are a badge of one''s faction against
    all others. So, for example, an entire online “community” has been built up around
    the grotesque denial of truth regarding the mass shooting of children in schools
    across America—not only denying solace and respect for the victims and their families,
    perpetuating a cloud of obfuscation that seems to cloak authentic amelioration
    of the problem in impossibility, precisely because the actual facts are continually
    distorted.


    For most of the history of Christian thought, amongst the teachers of Christian
    mystical theology, truth, goodness, and beauty appear in our world with a sovereign
    majesty that calls forth human reverence, and a profound human being to understand
    the sacramental depth of meaning inherent in all creation. In order to think and
    teach more profoundly about this divine resonance within all beings, and about
    the human calling to contemplate and reverse this fullness of meaning, Christian
    theologians often drew upon their belief in God as Trinity. God''s life, they
    taught, is a life of infinite knowing and loving, a relational life in which the
    divine Persons are as they enact the inexhaustible self-giving that is existence
    itself. In this eternal and perfect life of knowing and loving, the processes
    of the'
