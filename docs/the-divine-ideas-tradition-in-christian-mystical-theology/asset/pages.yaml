  md: '# DIVINE IDEAS IN MYSTICAL THEOLOGY


    the divine ideas fostered a keen theological interest in the parallels, foreshadowings,
    and analogies between the paradise of our beginnings and the paradise of our consummate
    fulfillment.


    In this chapter I want to emulate this wondering imagination of our Christian
    brethren by joining them in considering fundamental analogies at the heart of
    our universe and its destiny—analogies or participations, as we have seen, are
    often rescued by the divine ideas teaching precisely because they are analogies
    of intelligibility. This analogical intelligibility derives from the fact that
    the divine ideas are present in different modes within the Trinitarian life of
    God, within creation, within creaturely-understanding, and within the beatific
    vision. Accordingly we could say that I am exploring four acts of knowing, acts
    in which divine truth is communicated so reality may be given birth and rebirth.
    The primordial ground of truth’s perfect knowing of Godelf insists that our human
    ability to understand reality in fact flows from God’s invitation to share in
    God’s self-knowing, for “[o]ur enlightenment is to participate in the Word, that
    is, in ‘life is the light of men’ (John 1:4).” Let me briefly these four analogous,
    or mutually participating, events of truth which will be the focus of the rest
    of this chapter.


    The first of these is the eternal “in the beginning,” God’s everlasting knowing
    and loving of Godelf which is the inexhaustible ground of truth itself, and nothing
    less than the event of God’s own happiness beatitude, the joy of the divine self-communication.


    The second is the human participation in intelligibility, the way in which the
    human act of understanding is a kind of faint likeness within our present existence
    of the share in God’s beatitude of self-understanding that God intends, Christians
    believe, to be our consumption.


    The third facet is the expression in our world of God’s eternal knowing and loving
    of Godelf which we encounter as the death and resurrection of Jesus; in which
    the truth of God, which includes the truth of all creatures, is vindicated—and
