    hexameral literature marked by speculative creativity and an imagination open
    to realities beyond any easy conceptualization. Origen, Augustine, Eriugena, and
    Eckhart, for example, all relished the echo of fathomless meaning that they heard
    in the words “in the beginning” in both Genesis and the Gospel of John. For them,
    the “beginning” in which God creates all things is none other than the eternal
    Word, the original and primordial Idea in which God expresses all of Godself,
    including all the ways in which creatures might come to share in the gift of existence.
    Thus as we have seen throughout this book, within the Father’s eternal self-knowing
    in the Word dwell the imperishable archetypes according to which all creatures
