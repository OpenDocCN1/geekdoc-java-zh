    Perhaps especially for reason then, it is vital for Christian theology to recover
    and elucidate genuinely good news to the poor and the oppressed free. I have sought
    to demonstrate throughout this chapter how the divine ideas tradition has helped
    to foster and sustain such life-giving understandings of salvation—precisely because
    the divine ideas has allowed Christian thinkers to see within the self-giving
    of Jesus the eternal divine love for all creatures whose God’s saving action in
    time flows. This perspective has also allowed Christians to ponder the ways in
    which fidelity to Christ draws human beings, and the whole creation, closer to
    the truth of themselves, as they have always been known and loved in God.


