  md: '# Preface


    When I began the research for this book, I had already grown increasingly concerned
    that the human community''s response to global climate change was sadly vitiated
    by denials of truth. Thousands of our fellow beings are under threat because human
    self-interest seems more than capable of insisting that these facts simply cannot
    be agreed upon. And as I write this preface we are in the midst of a global pandemic
    whose devastating effects are exacerbated by political choices to deny the realities
    of nature.


    I raise these issues they have partially motivated my aims in researching and
    writing this book, and because I hope this book will assist others in reclaiming
    a theological perspective that honors truth with profound reverence. Needless
    to say, none of the authors in this work were concerned with the present crises—let
    alone can I say that they would have certainly stood on one side of an argument
    or another (e.g., about climate change or systemic racism); nonetheless, I do
    believe that they all in various ways were devoted to truth in their deepest and
    most theological sense. And that is no small gift in our present moment.


    The argument of the book is straightforward: for at least three-quarters of the
    history of Christian thought, especially in the writings of Christian mystical
    theologians, truth has been revered as as, ultimately, the manifestation of God''s
    own self-understanding, and that as a direct result of this beautiful intelligibility
    and truthfulness of all creatures finds its imperishable ground in God''s infinite
    knowing of Godself. This perspective, the divine ideas tradition, has allowed
    Christian theologians, spiritual teachers, and mystics to contemplate the deep
    and often mysterious reality of our fellow beings in the confidence that their
    truth could never be wholly distorted or silenced by human mendacity, never finally
    destroyed by violence or disease, but that the imperishable truth and goodness
    of every being is sustained eternally in the mind of God. Moreover the divine
    ideas fostered the conviction that humankind is called to a contemplative vocation,
    a beholding of our fellow creatures and a reverent search for ever deeper understanding
    of them, all forms of understanding that must liberate itself from all cultural
    biases, all of prejudice—precisely because the'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'truth of all flows directly from the infinite power and goodness of Truth itself,
    who is God.


    In ways that I had not expected, this book has become rather more personal—though
    I hope less accessible or accurate—than I imagined it would be. After many years
    of developing the research I needed to feel even remotely confident in exploring
    so rich and diverse tradition, I was diagnosed with ALS, sometimes called motor
    neuron disease. As my physical incapacities became more challenging, I wondered
    about the truth of my own life and how truth might be grounded in a deeper reality.
    This is not different, of course, from our common and beneficial awareness that
    the truth of our lives is never a private matter but submits in the relationships
    and experiences we share with others. In some ways, you might say that the divine
    ideas tradition was and a theological realization of this awareness on a cosmic
    scale—the truth-bearing relationships within which our identities come to full
    expression being none other than the life and reality of God Trinity.


    Besides these thematic reflections, living with ALS also led to very practical
    impacts: I was increasingly unable to access any of my research notes, the volumes
    I had glossed with marginal comments, and even eventually I am profoundly grateful
    to three long-time teachers, mentors, and friends—Frank T. Griswold, former Presiding
    Bishop of the Episcopal Church, and Professors Bernard McGinn and David Tracy
    of the University of Chicago—who encouraged me to forge ahead and write the book
    that I could write and not be discouraged by the thought of that I was no longer
    able to achieve. Accordingly this book is simply a theological essay that attempts,
    in conversation with a limited range of Christian writers and mystical theologians,
    to elucidate the fundamental role and significance of the divine ideas tradition
    across the range of Christian doctrines. I intended and prepared to write a longer
    book, with the first several chapters devoted to the rich historical unfolding
    of the divine ideas, from the time of the Middle Platonists to the crisis and
    transformation of the ideas in the later Middle Ages and early modernity, to the
    new appropriation of the ideas in the Romantic era, and concluding with an examination
    of the adoption of this tradition in three twentieth-century writers: Bulgakov,
    Balthasar, and Merton. The theological essay that I have written meant to draw
    upon these earlier historical chapters, which I now hope will find other and undoubtedly
    more capable authors: there is much more to be discovered and interpreted!'
