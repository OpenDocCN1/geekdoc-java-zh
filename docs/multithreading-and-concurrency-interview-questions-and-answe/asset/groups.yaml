    \ is supposed to throw a RejectedExecutionException.\n\n## 1.71 What is a ScheduledExecutorService?\n\
    \nThe interface ScheduledExecutorService extends the ExecutorService and adds\
    \ methods that allow to submit new tasks to the underlying implementation that\
    \ should be executed at a given point in time. There are two methods to submit\
    \ one-shot tasks and two methods to create periodic tasks.\n\n## 1.72 Do you know\
    \ how to construct a thread pool with 5 threads some tasks that return a value?\n\
    \nThe SDK provides a factory and utility class Executors whose method newFixedThreadPool(int\
    \ nThreads) allows the creation of a thread pool with a fixed number of threads.\
    \ The MyCallable is omitted:\n\n```java\npublic static void main(String[] args)\
    \ throws InterruptedException, ExecutionException {\n    ExecutorService executorService\
