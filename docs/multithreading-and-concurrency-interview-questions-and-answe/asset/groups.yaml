    \    for (int i = 0; i < futures.length; i++) {\n        futures[i] = executorService.submit(new\
    \ MyCallable());\n    }\n    for (int i = 0; i < futures.length; i++) {\n    \
    \    Integer retVal = futures[i].get();\n        System.out.println(retVal);\n\
    \    }\n    executorService.shutdown();\n}\n```\n\n## 1.73 What is the difference\
    \ between the two interfaces Runnable and Callable?\n\nThe interface Runnable\
    \ defines the method run() without any return value whereas the interface Callable\
    \ allows the method call() to return a value and to throw an exception.\n\n##\
    \ 1.74 Which are use cases for the class java.util.concurrent.Future?\n\nInstances\
    \ of the class java.util.concurrent.Future are used to represent results of asynchronous\
    \ computations whose are not immediately available. Hence the class provides methods\
    \ to check if the asynchronous computation has finished, canceling the task and\
    \ to retrieve the actual result. The latter can be done with the get() methods\
    \ provided. Each get() takes no parameter and blocks until the result is available\
    \ whereas the get() method takes a timeout parameter that lets the invocation\
    \ return if the result is not available within the given timeframe.\n\n## 1.75\
    \ What is the difference between HashMap and Hashtable particularly with regard\
    \ to thread-safety?\n\nThe methods of Hashtable are all synchronized. This is\
    \ not the case for the HashMap implementation. Thus Hashtable is thread-safe whereas\
    \ HashMap is not thread-safe. For single-threaded applications it is therefore\
    \ more efficient to use the \"newer\" HashMap implementation.\n\n## 1.76 Is there\
    \ a simple way to create a synchronized instance of an arbitrary implementation\
    \ of Collection, List or Map?\n\nThe utility class provides the methods synchronized(Collection),\
    \ synchronizedList(List) and synchronizedMap(Map) that return a thread-safe collection/list/map\
    \ that is backed by the given instance.\n\n## 1.77 What is a semaphore?\n\nA semaphore\
    \ is a data structure that maintains a set of permits that may be acquired by\
