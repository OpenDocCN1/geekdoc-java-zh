- md: "\n## 1.38 What are the requirements for a deadlock situation?\n\nIn general\
    \ the following requirements for a deadlock can be identified:\n\n- Mutual exclusion:\
    \ There is a resource which can be accessed by only one thread at any point in\
    \ time.\n- Resource holding: While having locked one resource, the thread tries\
    \ to acquire another lock on some other exclusive resource.\n- No preemption:\
    \ There is no mechanism, which frees the resource one holds the lock for a specific\
    \ period of time.\n- Circular wait: During runtime a contention occurs in which\
    \ two (or more) threads are waiting on the other thread to free a resource that\
    \ it has locked.\n\n## 1.39 Is it possible to prevent deadlocks at all?\n\nIn\
    \ order to prevent deadlocks (one or more) of the requirements for a deadlock\
    \ has to be eliminated:\n\n- Mutual exclusion: In some situation it is possible\
    \ to prevent mutual exclusion by using optimistic locking.\n- Resource holding:\
    \ A thread may release all its exclusive locks, when it does not succeed in obtaining\
    \ all exclusive locks.\n- No preemption: Using a timeout for an exclusive lock\
    \ frees the lock after a given amount of time.\n- Circular wait: When all exclusive\
    \ locks are obtained by all threads in the same sequence, no circular wait occurs.\n\
    \n## 1.40 Is it possible to implement a deadlock detection?\n\nWhen all exclusive\
    \ locks are monitored and modelled as a directed graph, a deadlock detection system\
    \ can search for two threads that are each waiting on the other thread to free\
    \ a resource that it has locked. The waiting threads can then be forced by some\
    \ kind of exception to release the lock the other thread is waiting on.\n\n##\
    \ 1.41 What is a livelock?\n\nA livelock is a situation in which two or more threads\
    \ block each other by responding to an action that is caused by another. In contrast\
    \ to a deadlock situation, where two or more threads wait in one specific state,\
    \ the threads that participate in a livelock change their state in a way that\
    \ prevents their regular progress. An example would be a situation in which two\
    \ threads try to acquire locks, but release the lock they have acquired when they\
    \ cannot acquire the second lock. It may happen that both threads concurrently\
    \ try to acquire the first. As only one succeeds, now both threads hold two different\
    \ locks, but as both want to have both locks, they release their lock and again\
    \ from the beginning. This situation may now happen again and again.\n\n## 1.42\
    \ What do we understand by starvation?\n\nThreads with lower priority get less\
    \ time for execution than threads with higher priority. When the threads with\
    \ lower priority performs a long enduring computations, it may happen that these\
    \ threads do not get enough time to finish their computations in time. They seem\
    \ to \"starve\" as threads with higher priority steal their computation time.\n\
    \n## 1.43 Can a synchronized block prevent thread starvation?\n\nThe order in\
    \ which threads enter a synchronized block is not defined. So in theory it may\
    \ happen in case many threads are waiting for the entrance to a synchronized block,\
    \ some threads have to wait longer than others. Hence they do not get enough computation\
    \ time to finish their work in time.\n\n## 1.44 What do we understand by the term\
    \ race condition?\n\nA race condition describes constellations in which the outcome\
    \ of some multi-threaded implementation depends on the exact timing behavior of\
    \ the participating threads. In most cases it is not desirable to have such a\
    \ kind of behavior, hence the race condition also means that a bug due to missing\
    \ thread synchronization leads to the difference. A simple example for a race\
    \ condition is the incrementation of an integer variable by two concurrent threads.\
    \ As the operation consists of more than one single atomic operation, it may happen\
    \ that both threads read and increment the same value. After this concurrent increment\
    \ the amount of the integer variable is not increased by two but only one.\n\n\
    ## 1.45 What do we understand by fair locks?\n\nA fair lock takes the waiting\
    \ time of the threads into account considering the next thread that passes the\
    \ barrier to exclusive resource. An example implementation of a fair lock is provided\
    \ by the Java SDK: java.util.concurrent.locks.ReentrantLock. If the constructor\
    \ with the boolean flag set to true is used, the ReentrantLock grants access to\
    \ the longest-waiting thread.\n\n## 1.46 Which two methods that each object inherits\
    \ from java.lang.Object can be used to implement a simple producer/consumer scenario?\n\
    \nWhen a worker has finished its current task and the queue for new tasks is empty,\
    \ it frees the processor by acquiring an intrinsic lock on the queue object and\
    \ calling the method wait(). The thread will be woken by some producer that has\
    \ put a new task into the queue and again acquires the same intrinsic lock on\
    \ the queue object and calls notify() .\n\n## 1.47 What is the difference between\
    \ notify() and notifyAll()?\n\nBoth methods are used to wake up one or more threads\
    \ that have themselves to sleep by calling wait(). While notify() only wakes up\
    \ one of the waiting threads, notifyAll() wakes up all threads.\n\n## 1.48 How\
    \ is it determined which thread wakes up by calling notify()?\n\nIt is not specified\
    \ which threads will be woken up by calling notify() if more than one thread is\
    \ waiting. Hence code should not rely on any concurrent JVM implementation.\n\n\
    ## 1.49 Is the following code that retrieves an integer value from some queue\
    \ implementation correct?\n\n```java\npublic Integer getNextInt() {\n    Integer\
    \ retVal = null;\n    synchronized (queue) {\n        try {\n            while\
    \ (queue.isEmpty()) {\n                queue.wait();\n            }\n        }\
    \ catch (InterruptedException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n    synchronized (queue) {\n        retVal = queue.poll();\n     \
    \   if (retVal == null) {\n            System.err.println(\"retVal is null\");\n\
    \            throw new IllegalStateException();\n        }\n    }\n    return\
    \ retVal;\n}\n```\n\nAlthough the code uses the queue as monitor, it does not\
    \ behave correctly in a multi-threaded environment. The reason for this is that\
    \ it has two synchronized blocks. When two threads are woken up in line 6 by another\
    \ thread calls notifyAll(), both threads enter one after the other the second\
    \ block. This second block the queues has only one value, then the second thread\
    \ will poll on an empty queue and get null as return value.\n\n## 1.50 Is it possible\
    \ to check whether a thread holds a monitor on some given object?\n\nThe class\
    \ java.lang.Thread provides the method Thread.holdsLock(Object) that returns true\
    \ if and only the current thread holds the lock on the object as given argument\
    \ to the method.\n\n## 1.51 What does the method Thread.yield()?\n\nAn invocation\
    \ of Thread.yield() gives the scheduler a hint that the current thread is willing\
