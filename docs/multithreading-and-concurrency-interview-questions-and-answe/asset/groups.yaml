    # Preface\n\nConcurrency is always a challenge for developers and writing concurrent\
    \ programs can be extremely hard.\n\nThere is a number of things that could potentially\
    \ blow up and the complexity of systems rises considerably when concurrency is\
    \ introduced.\n\nHowever, the ability to write robust concurrent programs is a\
    \ great tool in a developer's belt and can help build sophisticated, enterprise\
    \ level applications.\n\nIn this guide we will discuss different types of questions\
    \ that can be used in a programming interview in order to assess a candidate's\
    \ understanding of concurrency and multithreading.\n\nThe questions are not only\
    \ Java specific, but revolve around general programming principles.\n\n# About\
    \ the Author\n\nMartin is a software engineer with more than 10 years of experience\
    \ in software development. He has been involved in different positions in application\
