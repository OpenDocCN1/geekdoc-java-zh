    The base class of Fork/Join framework java.util.concurrent.ForkJoinPool is basically
    a thread pool that executes instances of java.util.concurrent.ForkJoinTask. The
    class ForkJoinTask provides the two methods fork() and join(). While fork() is
    used to start the asynchronous execution of the task, the method join() is used
    to await the result of the computation. Hence the Fork/Join framework can be implemented
    to divide-and-conquer algorithms where a more complex problem is divided into
    a number of smaller and easier to solve problems.


    # 1.81 Is it possible to find the smallest number in an array of numbers using
    the Fork/Join-Framework?


    The problem of finding the smallest number in an array of numbers can be solved
    by a divide-and-conquer algorithm. The smallest problem that can be solved easily
    is an array of two numbers by comparison. Using a divide-and-conquer approach
    the initial array is divided into two parts of equal length and both parts are
    provided to two instances of RecursiveTask that extend the class ForkJoinTask.
    By forking the two tasks they get either solve the problem, if their slice of
    the array has length two, or they recursively divide the array into two parts
    and fork new RecursiveTasks. Each task returns its result (either by having it
    computed or by waiting for the subtasks). The root tasks return the smallest number
    in the array.


    # 1.82 What is the difference between the two classes RecursiveTask and RecursiveAction?


    In contrast RecursiveTask the method compute() of RecursiveAction does not have
    to return a value. Hence RecursiveAction can be used when the action works directly
    on some data structure without having to return the computed value.


    # 1.83 Is it possible to perform stream operations in Java 8 with a thread pool?


    Collections provide the method parallelStream() to create a stream that is processed
    by a thread pool. Alternatively you can call the intermediate method parallel()
    on a given stream to convert a sequential stream to a parallel counterpart.


    # 1.84 How can we access the thread pool that is used by parallel stream operations?


    The thread pool used for parallel stream operations can be accessed by ForkJoinPool.commonPool().
    This way we query its level of parallelism with commonPool.getParallelism(). The
    level cannot be changed at runtime but it can be configured by providing the following
    JVM parameter: -Djava.util.concurrent.ForkJoinPool.common.parallelism=5.'
