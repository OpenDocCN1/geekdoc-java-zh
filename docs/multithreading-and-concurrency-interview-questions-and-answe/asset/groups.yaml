- md: "\n## 1.54 What is the purpose of the class java.lang.ThreadLocal?\n\nAs memory\
    \ is shared between different threads, ThreadLocal provides a way to store and\
    \ retrieve values for each thread separately. Implementations of ThreadLocal store\
    \ and retrieve the values for each thread independently such that when thread\
    \ stores the value A1 and thread B stores the value B1 in the instance of ThreadLocal,\
    \ thread A later retrieves value A1 from this ThreadLocal instance and thread\
    \ B retrieves B1.\n\n## 1.55 What are possible use cases for java.lang.ThreadLocal?\n\
    \nInstances of ThreadLocal can be used to transport information through the application\
    \ without the need to pass this from method to method. Examples would be the transportation\
    \ of security/login information within an instance of ThreadLocal such that it\
    \ is accessible by each method. Another use case could be to transport information\
    \ or in general objects that should be accessible in all methods without passing\
    \ them from method to method.\n\n## 1.56 Is it possible to improve the performance\
    \ of an application by the usage of multi-threading? Name some examples.\n\nIf\
    \ we have more than one CPU core, the performance of an application can be improved\
    \ by multi-threading if it is possible to parallelize the computations over the\
    \ available CPU cores. An example would be an application that scales all matters\
    \ that are stored in a local directory. Instead of iterating all one after the\
    \ other, a producer/consumer implementation can use a single thread to scan the\
    \ directory structure and a bunch of worker threads to perform the actual scaling\
    \ operation. When n converges in parallel, an application mirrors some page. Instead\
    \ of loading one HTML page after the other, a producer can parse the first HTML\
    \ page and issue the links it found into a queue. The worker threads monitor the\
    \ queue and load the web pages by the parser. While the worker waits for the page\
    \ to be loaded completely, other threads use the CPU to parse the already loaded\
    \ pages and issue new requests.\n\n## 1.57 What do we understand by the term scalability?\n\
    \nScalability means the ability of a program to improve the performance by adding\
    \ further resources to it.\n\n## 1.58 Is it possible to compute the theoretical\
    \ maximum speed up for an application by using multiple processors?\n\nAmdahl's\
    \ law provides a formula to compute the theoretical maximum speed up by providing\
    \ multiple processors to an application. The theoretical speedup is computed by\
    \ S(n)=1/(B+(1-B)/n) where n is the number of processors and B is the fraction\
    \ of the program that cannot be executed in parallel. When n converges at infinity,\
    \ (1-B)/n converges against zero. Hence the formula can be reduced in this specific\
    \ case to 1/B. As we can see, the theoretical maximum speedup is the lower this\
    \ fraction is, the more theoretical speedup can be achieved.\n\n## 1.59 What do\
    \ we understand by lock contention?\n\nLock contention occurs, when two or more\
    \ threads are competing in the acquisition of a lock. The scheduler has to decide\
    \ whether it lets the thread, which has to wait sleeping and performs a context\
    \ switch to another thread occupy the CPU, or by letting the waiting thread busy-waiting\
    \ is more efficient. Both ways introduce idle time to the inferior thread.\n\n\
    ## Which techniques help to reduce lock contention?\n\nIn some cases lock contention\
    \ can be reduced by applying one of the following techniques:\n\n- The scope of\
    \ the lock is reduced.\n- The number of times a certain lock is acquired is reduced\
    \ (lock splitting).\n- Using hardware optimistic locking operations instead of\
    \ synchronization.\n- Avoid synchronization where possible.\n- Avoid object pooling.\n\
    \n## Which technique to reduce lock contention can be applied to the following\
    \ code?\n\n```\nsynchronized (map) {\n    UUID randomUUID = UUID.randomUUID();\n\
    \    Integer value = Integer.valueOf(42);\n    String key = randomUUID.toString();\n\
    \    map.put(key, value);\n}\n```\n\nThe code above performs the computation of\
    \ the UUID and the conversion of the literal 42 into Integer object within the\
    \ synchronized block, these two lines are local to the current thread and do not\
    \ affect others. They can be moved out of the synchronized block:\n\n```\nUUID\
    \ randomUUID = UUID.randomUUID();\nInteger value = Integer.valueOf(42);\nString\
    \ key = randomUUID.toString();\nsynchronized (map) {\n    map.put(key, value);\n\
    }\n```\n\n## Explain by an example the technique lock splitting.\n\nLock splitting\
    \ may be a way to reduce lock contention when one lock is used to synchronize\
    \ different aspects of the same application. Suppose we have a class that implements\
    \ the computation of some statistical data of our application. A first version\
    \ of this class uses the synchronized keyword in each method signature to guard\
    \ the internal state before corruption by multiple concurrent threads. This also\
    \ means that each method may cause lock contention as other threads try to acquire\
    \ the same lock simultaneously. But it may be possible to split the lock on the\
    \ object into a few smaller locks for each type of statistical data within each\
    \ method. Hence T1 tries to increment the statistical data D1 does not have to\
    \ wait for the lock while T2 simultaneously updates the data D2.\n\n## What kind\
    \ of technique for reducing lock contention is used by the SDK class ReadWriteLock?\n\
    \nThe SDK ReadWriteLock ensures that concurrent threads do not have to acquire\
    \ a lock when they want to read a value when no other thread updates the value.\
    \ This is implemented by a pair of locks, one for read-only operations and one\
    \ for writing operations. While the read-only lock may be obtained by more than\
    \ one thread, the implementation guarantees that all read operation see an updated\
    \ value once the lock is released.\n\n## 1.64 What do we understand by lock striping?\n\
    \nIn contrast to lock splitting, we introduce different locks for different aspects\
    \ of the application, lock striping uses multiple locks to guard different parts\
    \ of the same data structure. An example for this is the ConcurrentHashMap from\
    \ JDK's java.util.concurrent package. The Map implementation uses internally buckets\
    \ to store its values. The bucket is chosen by the value key. ConcurrentHashMap\
    \ now uses different locks to guard hash buckets. One thread that tries to access\
    \ the first hash bucket can acquire the lock for this bucket, while another can\
    \ simultaneously access a second bucket. In contrast to a synchronized version\
    \ of HashMap this technique can increase the performance when different threads\
    \ work on different buckets.\n\n## 1.65 What do we understand by a CAS operation?\n\
    \nCAS stands for compare-and-swap and that processor performs a separate instruction\
    \ that updates a value only if the provided value is equal to the current value.\
    \ CAS operations can be used to avoid synchronization as the thread try to update\
    \ a value by comparing its current value and the new value to the CAS operation.\
    \ If another thread has updated the value, the thread's value is not equal to\
    \ the current value and the update operation fails. The thread then reads the\
    \ new value and tries again. That why necessary synchronization is exchanged by\
    \ an optimistic spin waiting.\n\n## 1.66 Which Java classes use the CAS operation?\n\
    \nThe SDK classes in the package java.util.concurrent.atomic like AtomicInteger\
    \ or AtomicBoolean use the internally CAS operation to implement concurrent increment.\n\
    \n```\npublic class AtomicCounter {\n    private AtomicLong counter = new AtomicLong();\n\
    \n    public void increment() {\n        counter.incrementAndGet();\n    }\n\n\
    \    public long get() {\n        return counter.get();\n    }\n}\n```\n\n## 1.67\
    \ Provide an example why performance improvements for single-threaded applications\
    \ can cause performance degradation for multi-threaded applications.\n\nA prominent\
    \ example for such optimizations is a List implementation that handles the number\
    \ of elements as a variable. This improves the performance for single-threaded\
    \ applications as the size() operation does not have to iterate over all elements\
    \ but can return the current number of elements directly. Within a multi-threaded\
    \ application the additional counter has to be guarded by a lock as multiple concurrent\
    \ threads insert elements into the list. This additional lock can cost performance\
    \ when there are more updates to the list than invocations of the size() operation.\n\
    \n## 1.68 Is object pooling always a performance improvement for multi-threaded\
    \ applications?\n\nObject pools that try to avoid the construction of new objects\
    \ by pooling them can improve the performance of single-threaded applications\
    \ as the cost of object creation is exchanged by requesting a new object from\
    \ the pool. In multi-threaded applications such an object pool has to have synchronized\
    \ access to the pool and the additional costs of lock contention may outweigh\n"
  mdcn: "\n\n## 1.54 java.lang.ThreadLocal 类的目的是什么？\n\n由于不同线程之间共享内存，ThreadLocal 提供了一种为每个线程单独存储和检索值的方法。ThreadLocal\
    \ 的实现类独立地存储和检索每个线程的值，使得当线程 A 在 ThreadLocal 实例中存储值 A1，而线程 B 在该实例中存储值 B1 时，线程 A\
    \ 随后从该 ThreadLocal 实例中检索到 A1，而线程 B 检索到 B1。\n\n## 1.55 java.lang.ThreadLocal 有哪些可能的用例？\n\
    \nThreadLocal 实例可以用于在应用程序中传输信息，而无需在方法之间传递这些信息。例如在 ThreadLocal 实例内部传输安全/登录信息，使得每个方法都可以访问。另一个用例可能是传输信息或泛指在所有方法中都可访问的对象，而无需在方法之间传递它们。\n\
    \n## 1.56 是否可以通过使用多线程来提高应用程序的性能？请举一些例子。\n\n如果我们有多个 CPU 核心，如果可以在可用的 CPU 核心上对计算进行并行处理，就可以通过多线程提高应用程序的性能。一个例子是一个扩展本地目录中存储所有内容的应用程序。它不是一个接一个地遍历所有内容，而是生产者/消费者实现可以使用单个线程扫描目录结构，并使用一组工作线程来执行实际的扩展操作。当\
    \ n 并行收敛时，应用程序镜像某些页面。它不是一个接一个加载 HTML 页面，生产者可以解析第一个 HTML 页面将其找到的发布到队列中。工作线程监控队列并通过解析器加载网页。当工作线程等待页面完全加载时，其他线程使用\
    \ CPU 解析已加载的页面并发出新请求。\n\n## 1.57 我们对可扩展性（scalability）一词如何理解？\n\n可扩展性意味着程序通过为其添加更多资源来提高性能的能力。\n\
    \n## 1.58 是否可以通过使用多个处理器来计算应用程序的理论最大加速？\n\n阿姆达尔法则（Amdahl's law）提供了一个通过为应用程序提供多个处理器来计算理论最大加速的公式。理论加速计算为\
    \ S(n)=1/(B+(1-B)/n)，其中 n 是处理器的数量，B 是程序中无法并行执行的比例。当 n 收敛于无穷大时，(1-B)/n 收敛于零。因此，在这种特殊情况下，公式可以简化为\
    \ 1/B。正如我们所看到的，该比例越小，可以实现的理论最大加速越大。\n\n## 1.59 我们对锁竞争（lock contention）一词如何理解？\n\
    \n当两个或多个线程竞争获取锁时就会发生锁竞争。调度器必须决定是让必须等待的线程睡眠并执行上下文切换到另一个线程以占用 CPU，还是让等待的线程忙等（busy-waiting）更高效。这两种方式都会为劣势线程引入空闲时间。\n\
    \n## 哪些技术有助于减少锁竞争？\n\n在某些情况下，可以通过应用以下技术来减少锁竞争：\n\n- 缩小锁的范围。\n- 减少某些锁的获取次数（锁拆 lock\
    \ splitting）。\n- 使用硬件乐观锁操作代替同步（synchronization）。\n- 尽可能避免同步。\n- 避免对象池。\n\n## 哪种减少锁竞争的技术可以应用于以下代码？\n\
    \n```\nsynchronized (map) {\n    UUID randomUUID = UUID.randomUUID();\n    Integer\
    \ value = Integer.valueOf(42);\n    String key = randomUUID.toString();\n    map.put(key,\
    \ value);\n}\n```\n\n上述代码在同步块内部执行了 UUID 的计算以及字面量 42 到 Integer 对象的转换，这两行是当前线程私有的，不会影响其他线程。它们可以移动到同步块之外：\n\
    \n```\nUUID randomUUID = UUID.randomUUID();\nInteger value = Integer.valueOf(42);\n\
    String key = randomUUID.toString();\nsynchronized (map) {\n    map.put(key, value);\n\
    }\n```\n\n## 举例说明锁拆分（lock splitting）技术。\n\n当使用一个锁同步同一个应用程序的不同方面时，锁拆分可能是减少锁竞争的方法。假设我们有一个类实现了应用程序中某些统计数据的计算。该类的第一个版本在每个方法签名中使用了\
    \ `synchronized` 关键字，以保护内部状态不被多个并发线程破坏。这意味着当其他线程尝试同时获取同一个锁时，每个方法都可能导致锁竞争。但可能将对象上的锁拆分成几个较小的锁，为每个方法中的每种统计数据分配一个锁。因此，T1\
    \ 尝试增加统计数据 D1 时不需要等待锁，而 T2 同时在更新数据 D2。\n\n## SDK 类 ReadWriteLock 使用了什么种减少锁竞争的技术？\n\
    \nSDK 的 ReadWriteLock 确保当并发线程想要读取一个值时，如果没有其他线程更新该值，它们就不需要获取锁。这是通过一对锁实现的，一个用于只读操作，一个用于写操作。虽然只读锁可以被多个线程获取，但实现保证了一旦锁被释放，所有读操作都能看到更新后的值。\n\
    \n## 1.64 我们对锁分纹（lock striping）一词如何理解？\n\n与锁拆分不同，我们为应用程序的不同方面引入不同的锁，锁分纹使用多个锁来保护同一个数据结构的不同部分。一个例子是\
    \ JDK 中 `java.util.concurrent` 包中的 ConcurrentHashMap。Map 的实现内部使用桶（buckets）来存储其值。桶由值键（key）选择。ConcurrentHashMap\
    \ 现在使用不同的锁来保护哈希桶。尝试访问第一个哈希桶的线程可以获取该桶的锁，而另一个线程可以同时访问第二个桶。与同步版本的 HashMap 相比，这种技术在不同线程处理不同桶工作时可以提高性能。\n\
    \n## 1.65 我们对 CAS 操作如何理解？\n\nCAS 是比较并交换（compare-and-swap）的缩写，处理器执行一条单独的指令，仅当提供的值等于当前值时才更新值。CAS\
    \ 操作可以避免同步，因为线程通过比较当前值和新值到 CAS 操作来更新值。如果另一个线程更新了该值，线程的值就不等于当前值，更新操作失败。线程随后读取新值并重试。这就是为什么必要的同步被交换为了自旋等待。\n\
    \n## 1.66 哪些 Java 类使用了 CAS 操作？\n\n`java.util.concurrent.atomic` 包中的 SDK 类（如 `AtomicInteger`\
    \ 或 `AtomicBoolean`）内部使用 CAS 操作来实现并发增加。\n\n```\npublic class AtomicCounter {\n\
    \    private AtomicLong counter = new AtomicLong();\n\n    public void increment()\
    \ {\n        counter.incrementAndGet();\n    }\n\n    public long get() {\n  \
    \      return counter.get();\n    }\n}\n```\n\n## 1.67 请举例单线程应用程序的性能改进会导致多线程应用程序的性能下降。\n\
    \n一个典型的例子是将元素数量作为变量的 List 实现。这提高了单线程应用程序的性能，因为 `size()` 操作不需要遍历所有元素，而是可以直接返回当前的元素数量。在多线程应用程序中，额外的计数器必须由锁保护，因为多个并发线程向列表插入元素。当列表的更新次数多于\
    \ `size()` 操作的调用时，这种额外的锁会消耗性能。\n\n## 1.68 对象池总是多线程应用程序的性能改进吗？\n\n通过池化对象来避免构建新对象的对象池可以提高单线程应用程序的性能，因为创建对象的成本被交换为从池中请求新对象。在多线程应用程序中，这种对象池必须对池进行同步访问，且锁竞争的额外成本可能会超过其收益。\n\
    \n"
