    \n## 1.17 是否可能在启动后将普通用户线程转换为守护线程？\n\n用户线程一旦启动，就无法转换为守护线程。在已运行的线程实例上调用方法 `thread.setDaemon(true)`\
    \ 将会抛出 `IllegalThreadStateException`。\n\n## 1.18 我们如何理解忙等待（busy waiting）？\n\n\
    忙等待使得等待事件发生的实现实现执行了某些活动计算，这些计算占用了处理器，而这些计算本可以被调度程序移除。忙等待的一个例子是在循环中花费时间检查当前时间，直到到达某个时间点为止。\n\
    \n```java\nThread thread = new Thread(new Runnable() {\n    @Override\n    public\
    \ void run() {\n        long millisToStop = System.currentTimeMillis() + 5000;\n\
    \        long currentMillis = System.currentTimeMillis();\n        while (millisToStop\
    \ > currentMillis) {\n            currentMillis = System.currentTimeMillis();\n\
    \        }\n    }\n});\n```\n\n## 1.19 如何防止忙等待？\n\n防止忙等待的一种方法是让当前线程睡眠一段时间。这可以通过调用方法\
    \ `java.lang.Thread.sleep(long)` 实现，并将要睡眠的毫秒数作为参数传递。\n\n## 1.20 我们可以使用 `Thread.sleep()`\
    \ 用于实时处理吗？\n\n传递给 `Thread.sleep(long)` 调用的毫秒数仅向调度程序指示当前线程不需要执行多长时间。取决于具体的实现，调度程序可能会让线程早几毫秒或晚几毫秒执行。因此，不应将\
    \ `Thread.sleep()` 用于实时处理。\n\n## 1.21 如何唤醒使用 `Thread.sleep()` 进入睡眠的线程？\n\n`java.lang.Thread`\
    \ 的 `interrupt()` 方法可以中断正在睡眠的线程。被中断的线程是通过调用 `Thread.sleep()` 进入睡眠状态的。\n\n```java\n\
    public class InterruptExample implements Runnable {\n    public void run() {\n\
    \        try {\n            Thread.sleep(Long.MAX_VALUE);\n        } catch (InterruptedException\
    \ e) {\n            System.out.println(\"*\" + Thread.currentThread().getName()\
    \ + \"] Interrupted by exception\");\n        }\n    }\n    public static void\
    \ main(String[] args) throws InterruptedException {\n        Thread myThread =\
    \ new Thread(new InterruptExample(), \"myThread\");\n        myThread.start();\n\
    \n        System.out.println(\"*\" + Thread.currentThread().getName() + \"] Sleeping\
    \ for 5s...\");\n        Thread.sleep(5000);\n\n        System.out.println(\"\
    *\" + Thread.currentThread().getName() + \"] Interrupting myThread\");\n     \
    \   myThread.interrupt();\n    }\n}\n```\n\n## 1.22 线程如何查询自己是否被中断？\n\n如果线程没有处于\
    \ `Thread.sleep()` 等这种会抛出 `InterruptedException` 的方法内部，线程可以通过调用静态方法 `Thread.interrupted()`\
    \ 或继承自 `java.lang.Thread` 的方法 `isInterrupted()` 来查询自己是否被中断。\n\n## 1.23 应该如何处理\
    \ `InterruptedException`？\n\n`sleep()` 和 `join()` 等方法会抛出 `InterruptedException`\
    \ 来通知调用者另一个线程中断了此线程。这样做是为了告诉当前线程停止计算并意外结束。因此，通过捕获异常并仅将其记录到控制台或日志文件中来忽略异常并不是处理这种异常的适当方法。这种异常的问题在于，`Runnable`\
    \ 接口的 `run()` 方法不允许 `run()` 抛出任何异常。因此重新抛出并没有帮助。这意味着 `run()` 的实现必须自己处理这个受检异常，这往往导致了它被捕获并忽略的事实。\n\
    \n## 1.24 启动子线程后，我们如何在父线程中等待子线程终止？\n\n等待线程终止是通过在线程的实例变量上调用 `join()` 方法完成的：\n\n\
    ```java\nThread thread = new Thread(new Runnable() {\n    @Override\n    public\
    \ void run() {\n    }\n});\nthread.start();\nthread.join();\n```\n\n## 1.25 下一个程序的输出是什么？\n\
    \n```java\npublic class MyDaemonThreads {\n    private static class MyDaemonThread\
    \ extends Thread {\n        public MyDaemonThread() {\n            setDaemon(true);\n\
    \        }\n\n        @Override\n        public void run() {\n            try\
    \ {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
    \ e) {}\n        }\n    }\n\n    public static void main(String[] args) throws\
    \ InterruptedException {\n        Thread thread = new MyDaemonThread();\n    \
    \    thread.start();\n        thread.join();\n        System.out.println(thread.isAlive());\n\
    \    }\n}\n```\n\n输出为 `false`。尽管在同步块内再次检查了 `instance` 的值（出于性能考虑），但 JIT 编译器可能会重排字节码，导致构造函数执行完成之前设置了\
    \ `instance` 的引用。这意味着 `getInstance()` 方法返回了一个尚未完全初始化的对象。为了使代码线程安全，自 Java 5 起，对实例变量可以使用\
    \ `volatile` 关键字。\n\n## 1.26 当发生未捕获异常时会发生什么？\n\n当发生未捕获异常离开 `run()` 方法时，线程将停止执行。如果该线程是守护线程，JVM\
    \ 将继续运行；如果它是用户线程，JVM 将退出。在发生未捕获异常时，线程将释放它持有的锁，但它不会释放其他锁。\n\n## 1.27 什么是关机钩子（shutdown\
    \ hook）？\n\n关机钩子是在 JVM 关闭时执行的线程。它可以通过 `addShutdownHook(Runnable)` 注册：\n\n```java\n\
    Runtime.getRuntime().addShutdownHook(new Runnable() {\n    @Override\n    public\
    \ void run() {\n    }\n}));\n```\n\n## 1.28 `synchronized` 关键字用于什么目的？\n\n当你需要对资源进行互斥访问时，例如同步：\n\
    \n```java\nsynchronized (Counter.class) {\n    counter++;\n}\n```\n\n## 1.29 `synchronized`\
    \ 方法如何获取锁？\n\n`synchronized` 方法获取锁并在方法返回时释放锁：\n\n```java\npublic synchronized\
    \ void method() {\n    ...\n}\n```\n\n## 1.30 构造函数可以被同步吗？\n\n不，构造函数不能被同步。导致语法错误的原因是只有构造线程应该访问正在构造的对象。\n\
    \n## 1.31 原始类型值可以用于同步锁吗？\n\n不，基本类型值不能用于同步锁。\n\n## 1.32 同步锁是重入的吗？\n\n是的，同步锁可以被同一个线程再次访问。否则，获取锁的线程将意外地尝试获取它已经拥有的锁。\n\
    \n## 1.33 我们如何理解原子操作？\n\n原子操作是指要么完全执行要么不执行的操作。\n\n## 1.34 `c++` 语句是原子的吗？\n\n不，整数变量的增加由多个操作组成。首先我们必须加载\
    \ c 的当前值，将其增加，最后存储新值。执行此增加的线程可能会在这些步骤之间被中断，因此该操作不是原子的。\n\n## 1.35 Java 中哪些操作是原子的？\n\
    \nJava 语言提供了一些原子操作，因此可以确保并发看到的值：\n\n- 对引用变量和基本变量（除 `long` 和 `double` 之外）的读和写操作\n\
    - 所有声明为 `volatile` 变量的读和写操作\n\n## 1.36 下面的实现是线程安全的吗？\n\n```java\npublic class\
    \ DoubleCheckedSingleton {\n    private DoubleCheckedSingleton instance = null;\n\
    \n    public DoubleCheckedSingleton getInstance() {\n        if (instance == null)\
    \ {\n            synchronized (DoubleCheckedSingleton.class) {\n             \
    \   if (instance == null) {\n                    instance = new DoubleCheckedSingleton();\n\
    \                }\n            }\n        }\n        return instance;\n    }\n\
    }\n```\n\n该代码不是线程安全的。尽管在同步块内再次检查了 `instance` 的值（出于性能考虑），但 JIT 编译器可能会重排字节码，导致在构造函数执行完成之前设置了\
    \ `instance` 的引用。这意味着 `getInstance()` 返回了一个可能尚未完全初始化的对象。为了使代码线程安全，自 Java 5 起对实例变量可以使用\
    \ `volatile` 关键字。标记为 `volatile` 的变量只有在对象构造函数完全执行完毕后对其他线程可见。\n\n## 1.37 我们如何理解死锁（deadlock）？\n\
    \n死锁是指两个（或多个）线程每个都在等待另一个线程释放已锁定的资源，而该线程本身又锁定了另一个线程正在等待的资源：\n线程 1：锁定资源 A，等待资源 B\n\
    线程 2：锁定资源 B，等待资源 A\n\n"
