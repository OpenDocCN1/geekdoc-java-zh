    \ a critical section or resource simultaneously. Hence the constructor of java.util.concurrent.Semaphore\
    \ takes as first parameter the number of permits the threads compete about. Each\
    \ invocation of its acquire() tries to obtain one of the available permits. The\
    \ method acquire() without parameter blocks until the next permits available.\
    \ Later on, when the thread has finished its work on the critical resource, it\
    \ can release the permit by using the method release() on an instance of Semaphore.\n\
    \n## 1.78 What is a CountDownLatch?\n\nThe SDK CountDownLatch provides a synchronization\
    \ aid that can be used to implement scenarios in which threads have to wait until\
    \ some other threads have reached the same state that all threads can start. Reaching\
    \ zero the CountDownLatch instance lets all threads proceed. This can be used\
    \ to let all threads start at a given point in time by using the value 1 for the\
    \ counter or to wait until a number of threads has finished. In the later case\
    \ the counter is initialized with the number of threads and that thread has finished\
    \ its work counts down by one.\n\n## 1.79 What is the difference between a CountDownLatch\
    \ and a CyclicBarrier?\n\nBoth classes maintain a counter that is decremented\
    \ by different threads. The threads wait until the internal counter reaches the\
    \ zero value and proceed from there. But in contrast to the CountDownLatch class\
    \ CyclicBarrier resets the internal value back to the initial value once the value\
    \ reaches zero. As the name indicates of CyclicBarrier can be used to implement\
    \ cases where threads have to wait on each other and again.\n\n## 1.80 What kind\
    \ of tasks can be solved by the Fork/Join framework?\n\nThe base class of Fork/Join\
    \ framework java.util.concurrent.ForkJoinPool is basically a thread pool that\
    \ executes instances of java.util.concurrent.ForkJoinTask. The class ForkJoinTask\
    \ provides the two methods fork() and join(). While fork() is used to start the\
    \ asynchronous execution of the task, the method join() is used to await the result\
    \ of the computation. Hence the Fork/Join framework can be implemented to divide-and-conquer\
    \ algorithms where a more complex problem is divided into a number of smaller\
    \ and easier to solve problems.\n\n## 1.81 Is it possible to find the smallest\
    \ number in an array of numbers using the Fork/Join-Framework?\n\nThe problem\
    \ of finding the smallest number in an array of numbers can be solved by a divide-and-conquer\
    \ algorithm. The smallest problem that can be solved easily is an array of two\
    \ numbers by comparison. Using a divide-and-conquer approach the initial array\
    \ is divided into two parts of equal length and both parts are provided to two\
    \ instances of RecursiveTask that extend the class ForkJoinTask. By forking the\
    \ two tasks they get either solve the problem, if their slice of the array has\
    \ length two, or they recursively divide the array into two parts and fork new\
    \ RecursiveTasks. Each task returns its result (either by having it computed or\
    \ by waiting for the subtasks). The root tasks return the smallest number in the\
    \ array.\n\n## 1.82 What is the difference between the two classes RecursiveTask\
    \ and RecursiveAction?\n\nIn contrast RecursiveTask the method compute() of RecursiveAction\
    \ does not have to return a value. Hence RecursiveAction can be used when the\
    \ action works directly on some data structure without having to return the computed\
    \ value.\n\n## 1.83 Is it possible to perform stream operations in Java 8 with\
    \ a thread pool?\n\nCollections provide the method parallelStream() to create\
    \ a stream that is processed by a thread pool. Alternatively you can call the\
    \ intermediate method parallel() on a given stream to convert a sequential stream\
    \ to a parallel counterpart.\n\n## 1.84 How can we access the thread pool that\
    \ is used by parallel stream operations?\n\nThe thread pool used for parallel\
    \ stream operations can be accessed by ForkJoinPool.commonPool(). This way we\
    \ query its level of parallelism with commonPool.getParallelism(). The level cannot\
    \ be changed at runtime but it can be configured by providing the following JVM\
    \ parameter: -Djava.util.concurrent.ForkJoinPool.common.parallelism=5.\n"
  mdcn: "\n\n# 多线程与并发问题\n\n新对象的额外构造和垃圾回收节省的成本。在这里，对象池并不总是能提高多线程应用程序的整体性能。\n\n## 1.69\
    \ Executor 和 ExecutorService 两个接口之间是什么关系？\n\nExecutor 接口只定义了一个方法：`execute(Runnable)`。该接口的实现类必须在未来的某个时刻执行给定的\
    \ Runnable 实例。ExecutorService 接口是 Executor 接口的扩展，提供了额外的方法来关闭底层实现、等待所有提交任务的终止，并允许提交\
    \ `Callable` 实例。\n\n## 1.70 当向满的 ExecutorService 队列 `submit()` 一个新任务时会发生什么？\n\n\
    正如 `submit()` 方法所示，ExecutorService 的实现类应该抛出 `RejectedExecutionException`。\n\n\
    ## 1.71 什么是 ScheduledExecutorService？\n\nScheduledExecutorService 接口扩展了 ExecutorService，并添加了方法，允许向底层实现提交应在指定时间执行的新任务。它有两个方法用于提交一次性任务，以及两个方法用于创建周期性任务。\n\
    \n## 1.72 你知道如何构建一个拥有 5 个线程且某些任务返回值的线程池吗？\n\nSDK 提供了一个工厂工具类 `Executors`，其方法 `newFixedThreadPool(int\
    \ nThreads)` 允许创建一个具有固定数量线程的线程池。这里省略了 `MyCallable`：\n\n```java\npublic static\
    \ void main(String[] args) throws InterruptedException, ExecutionException {\n\
    \    ExecutorService executorService = Executors.newFixedThreadPool(5);\n    Future<Integer>[]\
    \ futures = new Future[5];\n    for (int i = 0; i < futures.length; i++) {\n \
    \       futures[i] = executorService.submit(new MyCallable());\n    }\n    for\
    \ (int i = 0; i < futures.length; i++) {\n        Integer retVal = futures[i].get();\n\
    \        System.out.println(retVal);\n    }\n    executorService.shutdown();\n\
    }\n```\n\n## 1.73 Runnable 和 Callable 两个接口之间的区别是什么？\n\nRunnable 接口定义了 `run()`\
    \ 方法，且没有返回值，而 Callable 接口允许 `call()` 方法返回值并抛出异常。\n\n## 1.74 java.util.concurrent.Future\
    \ 类的用例有哪些？\n\njava.util.concurrent.Future 类的实例用于表示无法立即获取的异步计算结果。因此，该类提供了检查异步计算是否完成、取消任务以及获取实际结果的方法。后者可以通过提供的\
    \ `get()` 方法完成。每个 `get()` 方法不接受参数并会阻塞直到结果可用；而 `get(long timeout, TimeUnit unit)`\
    \ 方法接受一个超时参数，如果结果在给定时间内不可用则允许调用返回。\n\n## 1.75 HashMap 和 Hashtable 之间的区别是什么，特别是在线程安全方面？\n\
    \nHashtable 的方法都是同步的（synchronized）的。而 HashMap 的实现则并非如此。因此，Hashtable 是线程安全的，而 HashMap\
    \ 不是线程安全的。对于单线程应用程序，因此使用“较新”的 HashMap 实现更高效。\n\n## 1.76 是否有简单的方法可以为 Collection、List\
    \ 或 Map 的任意实现创建一个同步实例？\n\n该工具类提供了 `synchronized(Collection)`、`synchronizedList(List)`\
    \ 和 `synchronizedMap(Map)` 方法，它们返回一个由给定的实例支持的线程安全的集合/列表/映射。\n\n## 1.77 什么是信号量（semaphore）？\n\
    \n信号量是一种数据结构，维护了一组许可（permits），竞争性线程可以获取这些许可。信号量可以控制同时访问临界区域或资源的线程数量。因此，`java.util.concurrent.Semaphore`\
    \ 的构造函数第一个参数是线程竞争的许可数量。每次调用 `acquire()` 都会尝试获取一个可用的许可。不带参数的 `acquire()` 方法会阻塞直到下一个许可可用。随后，当线程完成在临界资源上的工作后，可以使用\
    \ `Semaphore` 实例上的 `release()` 方法来释放许可。\n\n## 1.78 什么是 CountDownLatch（计数计数器）？\n\
    \nSDK 中的 `CountDownLatch` 提供了一种同步辅助工具，可用于此类场景：线程必须等待某些其他线程达到相同的状态，以便所有线程都可以开始。当\
    \ `CountDownLatch` 实例计数归零时，所有线程即可继续。这可以用于通过计数器值设为 1 让所有线程在指定时间启动，或者用于等待数量线程完成工作。在后一种情况下，计数器初始化为线程的数量，每个线程完成工作后计数器器减\
    \ 1。\n\n## 1.79 CountDownLatch 和 CyclicBarrier（循环屏障）之间的区别是什么？\n\n这两个类都维护了一个由不同线程递减的计数器。线程会等待内部计数器达到零并从那里继续。但与\
    \ `CountDownLatch` 类不同，`CyclicBarrier` 在值归零后会将值重置为初始值。正如名称所示，`CyclicBarrier` 可用于实现线程需要相互等待的场景。\n\
    \n## 1.80 哪些任务可以由 ForkJoin 框架解决？\n\nForkJoin 框架的基类 `java.util.concurrent.ForkJoinPool`\
    \ 基本上是一个执行 `java.util.concurrent.ForkTask` 实例的线程池。任务提供了 `fork()` 和 `join()` 两个方法。`fork()`\
    \ 用于启动任务的异步执行，而 `join()` 方法用于等待计算结果。因此，ForkJoin 框架可以实现分治算法，将更复杂的问题分解为更易解决的问题。\n\
    \n"
