    \ clustered enterprise applications with real-time requirements.\n\nAfter finishing\
    \ his studies of computer science with a diploma, Martin worked as a Java developer\
    \ and consultant for international operating insurance companies. Later on he\
    \ designed and implemented web applications and fat-client applications for companies\
    \ on the energy market. Currently Martin works for an international operating\
    \ company in the Java EE domain and is concerned in his day-to-day work with large-scale\
    \ big data systems.\n\nHis current interests include Java EE, web applications\
    \ with focus on HTML5 and performance optimizations. When time permits, he works\
    \ on open source projects, some of them can be found at this github account. Martin\
    \ is blogging at Martin's Developer World.\n\n# Chapter 1\n\n# MultiThreading\
    \ Questions\n\n## 1.1 What do we understand by the term concurrency?\n\nConcurrency\
    \ is the ability of a program to execute several computations simultaneously.\
    \ This can be achieved by distributing the computations over the available CPU\
    \ cores of a machine or over different machines within the same network.\n\n##\
    \ 1.2 What is the difference between processes and threads?\n\nA process is an\
    \ execution environment provided by the operating system that has its own set\
    \ of private resources (e.g. memory, open files, etc.). Threads, in contrast,\
    \ live within a process and share their resources (memory, open files, etc.) with\
    \ the other threads of the process. The ability to share resources between different\
    \ threads makes thread more suitable for tasks where performance is a significant\
    \ requirement.\n\n## 1.3 In Java, what is a process and a thread?\n\nIn Java,\
    \ processes correspond to a running Java Virtual Machine (JVM) whereas threads\
    \ live within the JVM and can be created and stopped by the Java application dynamically\
    \ at runtime.\n\n## 1.4 What is a scheduler?\n\nA scheduler is the implementation\
    \ of a scheduling algorithm that manages access of processes and threads to some\
    \ limited resource like the processor or some I/O channel. The goal of most scheduling\
    \ algorithms is to provide some kind of load balancing for the available processes/threads\
    \ that guarantees that each process/thread gets an appropriate time frame to access\
    \ the requested resource exclusively.\n\n## 1.5 How many threads does a Java program\
    \ have at least?\n\nEach Java program is executed within the main thread; hence\
    \ each Java application has at least one thread.\n\n## 1.6 How can a Java application\
    \ access the current thread?\n\nThe current thread can be accessed by calling\
    \ the static method `currentThread()` of the JDK class `java.lang.Thread`:\n\n\
    ```java\npublic class MainThread {\n    public static void main(String[] args)\
    \ {\n        long id = Thread.currentThread().getId();\n        String name =\
    \ Thread.currentThread().getName();\n    }\n}\n```\n\n## 1.7 What properties does\
    \ each Java thread have?\n\nEach Java thread has the following properties:\n\n\
    - an identifier of type long that is unique within the JVM\n- a name of type String\n\
    - a priority of type int\n- a state of type java.lang.State\n- a group the thread\
    \ belongs to\n\n## 1.8 What is the purpose of thread groups?\n\nEach thread belongs\
    \ to a group of threads. The JDK class ThreadGroup provides some methods to handle\
    \ whole group. With these methods we can, for example, interrupt all threads of\
    \ a group or set their priority.\n\n## 1.9 What states can a thread have and what\
    \ is the meaning of each state?\n\n- NEW: A thread that has not yet started is\
    \ in this state.\n- RUNNABLE: a thread executing in the virtual machine is in\
    \ this state.\n- BLOCKED: a thread waiting for a monitor lock is in this state.\n\
    - WAITING: a thread waiting indefinitely for another thread to perform a particular\
    \ action is in this state.\n- TIMED_WAITING: a thread waiting for another thread\
    \ to perform an action up to a specified time is in this state.\n- TERMINATED:\
    \ a thread that has exited is in this state.\n\n## 1.10 How do we set the priority\
    \ of a thread?\n\nThe priority of a thread is set by the method setPriority(int).\
    \ To set the priority to the maximum value we use the constant MAX_PRIORITY and\
    \ set it to minimum value we use the constant MIN_PRIORITY because these values\
    \ can differ from JVM implementations.\n\n## 1.11 How is a thread created in Java?\n\
    \nBasically, there are two ways to create a thread in Java. The first one is to\
    \ write a class that extends JDK class java.lang.Thread and call its method start():\n\
    \n```java\npublic class MyThread extends Thread {\n    public MyThread(String\
    \ name) {\n        super(name);\n    }\n\n    @Override\n    public void run()\
    \ {\n        System.out.println(\"Executing thread \" + Thread.currentThread().getName());\n\
    \    }\n\n    public static void main(String[] args) throws InterruptedException\
    \ {\n        MyThread myThread = new MyThread(\"myThread\");\n        myThread.start();\n\
    \    }\n}\n```\n\nThe second way is to implement java.lang.Runnable and pass this\
    \ implementation as a parameter to the constructor of java.lang.Thread:\n\n```java\n\
    public class MyRunnable implements Runnable {\n    public void run() {\n     \
    \   System.out.println(\"Executing thread \" + Thread.currentThread().getName());\n\
    \    }\n\n    public static void main(String[] args) throws InterruptedException\
    \ {\n        Thread myThread = new Thread(new MyRunnable(), \"myRunnable\");\n\
    \        myThread.start();\n    }\n}\n```\n\n## 1.12 How do we stop a thread in\
    \ Java?\n\nTo stop a thread we use a volatile reference pointing to the current\
    \ thread that can be made null by other threads to indicate the current thread\
    \ should stop its execution:\n\n```java\nprivate class MyStopThread extends Thread\
    \ {\n    private volatile Thread stopIndicator;\n\n    public void start() {\n\
    \        stopIndicator = new Thread(this);\n        stopIndicator.start();\n \
    \   }\n\n    public void stopThread() {\n        stopIndicator = null;\n    }\n\
    \n    @Override\n    public void run() {\n        Thread thisThread = Thread.currentThread();\n\
    \        while (thisThread == stopIndicator) {\n            try {\n          \
    \      Thread.sleep(1000);\n            } catch (InterruptedException e) {\n \
    \           }\n        }\n    }\n}\n```\n\n# Multithreading and Concurrency Questions\n\
    \n## 1.13 Why should a thread not be stopped by calling its method stop()?\n\n\
    A thread should not be stopped using the deprecated methods stop() of java.lang.Thread,\
    \ as of this method causes the thread to unlock all monitors it has acquired.\
    \ If any object protected by one of the released locks was in an inconsistent\
    \ state, this state gets visible to all threads. This can cause arbitrary behavior\
    \ when other threads work this inconsistent object.\n\n## 1.14 Is it possible\
    \ to start a thread twice?\n\nNo, after starting a thread by invoking its start()\
    \ method, a second invocation of start() will throw an IllegalStateException.\n\
    \n## 1.15 What is the output of the following code?\n\n```java\npublic class Multithreading\
    \ {\n    private static class MyThread extends Thread {\n        public MyThread(String\
    \ name) {\n            super(name);\n        }\n        @Override\n        public\
    \ void run() {\n            System.out.println(Thread.currentThread().getName());\n\
    \        }\n    }\n    public static void main(String[] args) {\n        MyThread\
    \ myThread = new MyThread(\"myThread\");\n        myThread.run();\n    }\n}\n\
    ```\n\nThe code above produces the output \"main\" and not \"myThread\". As be\
    \ seen in line two of the main() method, we invoke by the method run() instead\
    \ of start(). Hence, no new thread is started, but the method run() gets executed\
    \ within the main thread.\n\n## 1.16 What is a daemon thread?\n\nA daemon thread\
    \ is a thread whose execution state is not evaluated when the JVM decides if it\
    \ should stop or not. The JVM stops when all user threads (in contrast to the\
    \ daemon threads) are terminated. Hence daemon threads can be used to implement\
    \ example monitoring functionality as that the JVM stops as soon as all user threads\
    \ have stopped:\n"
  mdcn: "\n\nCopyright (c) Exelix Media P.C., 2014\n\n保留所有权利。在不限制上述保留权利的情况下，未经版权所有者事先书面许可，本出版的部分不得复制、存储或引入检索系统，或以任何形式或通过任何方式（电子、机械、复印、录制或其他方式）进行传输。\n\
    \n# 前言\n\n并发对于开发者来说始终是一个挑战，而编写并发程序可能极其困难。\n\n引入并发后，可能会出现许多潜在问题，且系统的复杂性会显著增加。\n\
    \n然而，编写健壮并发程序的能力是开发者工具箱中的一项强大工具，可以帮助构建复杂的企业级应用程序。\n\n在本指南中，我们将讨论可以用于编程面试的各种类型的问题，以评估候选人对并发和多线程的理解。\n\
    \n这些问题不仅针对 Java，还围绕通用的编程原则展开。\n\n# 关于作者\n\nMartin 是一位拥有 10 多年软件开发经验的软件工程师。他曾参与过应用开发中的不同职位，涉及各种软件项目，从可重用软件组件、移动应用程序、客户端\
    \ GUI 项目到具有实时需求的大规模集群企业级应用。\n\n在完成计算机科学学位学习后，Martin 曾担任国际运营保险公司的 Java 开发人员和顾问。后来，他为能源市场的公司设计并实现了\
    \ Web 应用程序和胖客户端应用程序。目前，Martin 在一家从事 Java EE 领域的国际运营公司工作，并在日常工作中关注大规模大数据系统。\n\n\
    他目前的兴趣包括 Java EE、重点关注 HTML5 的 Web 应用程序以及性能优化。在时间允许的情况下，他参与开源项目，其中一些项目可以在此 github\
    \ 账户找到。Martin 正在“Martin's Developer World”写博客。\n\n# 第 1 章\n\n# 多线程问题\n\n## 1.1\
    \ 我们如何理解并发（Concurrency）这个术语？\n\n并发是程序同时执行多个计算的能力。这可以通过将计算分布到机器可用的 CPU 核心上，或者同一网络内的不同机器上来实现。\n\
    \n## 1.2 进程和线程之间的区别是什么？\n\n进程是操作系统提供的执行环境，拥有自己的一组私有资源（例如内存、打开的文件等）。相比之下，线程存在于进程内部，并与进程的其他线程共享资源（内存、打开的文件等）。不同线程之间共享资源的能力使得线程更适合对性能有显著要求的任务。\n\
    \n## 1.3 在 Java 中，什么是进程（Process），什么是线程（Thread）？\n\n在 Java 中，进程对应于运行中的 Java 虚拟机（JVM），而线程位于\
    \ JVM 内部并由 Java 应用程序在运行时动态创建和停止。\n\n## 1.4 什么是调度器（Scheduler）？\n\n调度器是调度算法的实现，用于管理进程和线程对某些有限资源（如处理器或\
    \ I/O 通道）的访问。大多数调度算法的目标是对可用进程/线程提供某种负载均衡，确保每个进程/线程都能获得适当的时间独占访问请求的资源。\n\n## 1.5\
    \ 一个 Java 程序至少有多少个线程？\n\n每个 Java 程序都在主线程（main thread）中执行；因此每个 Java 应用程序至少有一个线程。\n\
    \n## 1.6 Java 应用如何访问当前线程？\n\n可以通过调用 JDK 类 `java.lang.Thread` 的静态方法 `currentThread()`\
    \ 来访问当前线程：\n\n```java\npublic class MainThread {\n    public static void main(String[]\
    \ args) {\n        long id = Thread.currentThread().getId();\n        String name\
    \ = Thread.currentThread().getName();\n    }\n}\n```\n\n## 1.7 每个 Java 线程拥有哪些属性？\n\
    \n每个 Java 线程拥有以下属性：\n\n- 一个类型为 long 的标识，在 JVM 内部是唯一的\n- 一个类型为 String 的名称\n- 一个类型为\
    \ int 的优先级\n- 一个类型为 java.lang.State 的状态\n- 线程所属的组（group）\n\n## 1.8 线程组（Thread\
    \ groups）的作用是什么？\n\n每个线程都属于一个线程组。JDK 类 `ThreadGroup` 提供了了一些方法来处理整个组。通过这些方法，我们可以中断该组的所有线程或设置它们的优先级。\n\
    \n## 1.9 线程可以处于哪些状态，每种状态的意义是什么？\n\n- NEW（新建）：尚未启动的线程处于此状态。\n- RUNNABLE（可运行）：在虚拟机中执行的线程处于此状态。\n\
    - BLOCKED（阻塞）：等待监视器锁的线程处于此状态。\n- WAITING（等待）：无限等待另一个线程执行特定动作的线程处于此状态。\n- TIMED_WAITING（超时等待）：等待另一个线程执行动作直到指定的超时时间的线程处于此状态。\n\
    - TERMINATED（终止）：已退出的线程处于此状态。\n\n## 1.10 我们如何设置线程的优先级？\n\n线程的优先级通过 `setPriority(int)`\
    \ 方法设置。要将优先级设置为最大值，我们使用常量 `MAX_PRIORITY`；设置为最小值则使用常量 `MIN_PRIORITY`，因为这些值可能随 JVM\
    \ 实现而异。\n\n## 1.11 在 Java 中如何创建线程？\n\n基本上在 Java 中创建线程有两种方法。第一种是编写扩展 JDK 类 `java.lang.Thread`\
    \ 的类并调用其 `start()` 方法：\n\n```java\npublic class MyThread extends Thread {\n  \
    \  public MyThread(String name) {\n        super(name);\n    }\n\n    @Override\n\
    \    public void run() {\n        System.out.println(\"Executing thread \" + Thread.currentThread().getName());\n\
    \    }\n\n    public static void main(String[] args) throws InterruptedException\
    \ {\n        MyThread myThread = new MyThread(\"myThread\");\n        myThread.start();\n\
    \    }\n}\n```\n\n第二种方法是实现 `java.lang.Runnable` 并该实现作为参数传递给 `java.lang.Thread`\
    \ 的构造函数：\n\n```java\npublic class MyRunnable implements Runnable {\n    public\
    \ void run() {\n        System.out.println(\"Executing thread \" + Thread.currentThread().getName());\n\
    \    }\n\n    public static void main(String[] args) throws InterruptedException\
    \ {\n        Thread myThread = new Thread(new MyRunnable(), \"myRunnable\");\n\
    \        myThread.start();\n    }\n}\n```\n\n## 1.12 在 Java 中如何停止线程？\n\n要停止线程，我们使用一个指向当前线程的\
    \ `volatile` 引用，其他线程可以将其设置为 null，以指示当前线程应该停止执行：\n\n```java\nprivate class MyStopThread\
    \ extends Thread {\n    private volatile Thread stopIndicator;\n\n    public void\
    \ start() {\n        stopIndicator = new Thread(this);\n        stopIndicator.start();\n\
    \    }\n\n    public void stopThread() {\n        stopIndicator = null;\n    }\n\
    \n    @Override\n    public void run() {\n        Thread thisThread = Thread.currentThread();\n\
    \        while (thisThread == stopIndicator) {\n            try {\n          \
    \      Thread.sleep(1000);\n            } catch (InterruptedException e) {\n \
    \           }\n        }\n    }\n}\n```\n\n# 多线程与并发问题\n\n## 1.13 为什么不应该通过调用 stop()\
    \ 方法来停止线程？\n\n不应使用 `java.lang.Thread` 中过时的 `stop()` 方法来停止线程，因为该方法会导致线程释放它获取的所有监视器。如果受释放锁保护的任何对象处于不一致状态，该状态对所有线程可见。这会导致其他线程处理该不一致对象时产生任意行为。\n\
    \n## 1.14 是否可以启动两次线程？\n\n在调用 `start()` 方法启动线程后，第二次调用 `start()` 将抛出 `IllegalStateException`。\n\
    \n## 1.15 下面代码的输出是什么？\n\n```java\npublic class Multithreading {\n    private static\
    \ class MyThread extends Thread {\n        public MyThread(String name) {\n  \
    \          super(name);\n        }\n        @Override\n        public void run()\
    \ {\n            System.out.println(Thread.currentThread().getName());\n     \
    \   }\n    }\n    public static void main(String[] args) {\n        MyThread myThread\
    \ = new MyThread(\"myThread\");\n        myThread.run();\n    }\n}\n```\n\n上述代码产生输出\
    \ \"main\" 而不是 \"myThread\"。如 `main()` 方法的第二行所示，我们调用的是 `run()` 方法而不是 `start()`。因此，没有启动新线程，而是\
    \ `run()` 方法在主线程中执行。\n\n## 1.16 什么是守护线程（Daemon thread）？\n\n守护线程是在 JVM 决定是否应该停止时不评估其执行状态的线程。当所有用户线程（与守护线程相反）都终止时，JVM\
    \ 就会停止。因此，守护线程可以用于示例监控功能，以便一旦所有用户线程停止，JVM 就会停止：\n\n"
