    In general the following requirements for a deadlock can be identified:


    +   - Mutual exclusion: There is a resource which can be accessed by only one
    thread at any point in time.


    +   - Resource holding: While having locked one resource, the thread tries to
    acquire another lock on some other exclusive resource.


    +   - No preemption: There is no mechanism, which frees the resource one holds
    the lock for a specific period of time.


    +   - Circular wait: During runtime a contention occurs in which two (or more)
    threads are waiting on the other thread to free a resource that it has locked.


    # 1.39 Is it possible to prevent deadlocks at all?


    In order to prevent deadlocks (one or more) of the requirements for a deadlock
    has to be eliminated:


    +   - Mutual exclusion: In some situation it is possible to prevent mutual exclusion
    by using optimistic locking.


    +   - Resource holding: A thread may release all its exclusive locks, when it
    does not succeed in obtaining all exclusive locks.


    +   - No preemption: Using a timeout for an exclusive lock frees the lock after
    a given amount of time.


    +   - Circular wait: When all exclusive locks are obtained by all threads in the
    same sequence, no circular wait occurs.


    # 1.40 Is it possible to implement a deadlock detection?


    When all exclusive locks are monitored and modelled as a directed graph, a deadlock
    detection system can search for two threads that are each waiting on the other
    thread to free a resource that it has locked. The waiting threads can then be
    forced by some kind of exception to release the lock the other thread is waiting
    on.


    # 1.41 What is a livelock?


    A livelock is a situation in which two or more threads block each other by responding
    to an action that is caused by another. In contrast to a deadlock situation, where
    two or more threads wait in one specific state, the threads that participate in
    a livelock change their state in a way that prevents their regular progress. An
    example would be a situation in which two threads try to acquire locks, but release
    the lock they have acquired when they cannot acquire the second lock. It may happen
    that both threads concurrently try to acquire the first. As only one succeeds,
    Now both threads hold two different locks, but as both want to have both locks,
    they release their lock and again from the beginning. This situation may now happen
    again and again.


    # 1.42 What do we understand by starvation?


    Threads with lower priority get less time for execution than threads with higher
    priority. When the threads with lower priority performs a long enduring computations,
    it may happen that these threads do not get enough time to finish their computations
    in time. They seem to "starve" as threads with higher priority steal their computation
    time.


    # 1.43 Can a synchronized block prevent thread starvation?


    The order in which threads enter a synchronized block is not defined. So in theory
    it may happen in case many threads are waiting for the entrance to a synchronized
    block, some threads have to wait longer than others. Hence they do not get enough
    computation time to finish their work in time.'
