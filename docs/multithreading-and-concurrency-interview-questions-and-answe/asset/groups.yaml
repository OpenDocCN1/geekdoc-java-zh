    \ modifications you can design an object to be immutable.\n\n## 1.53 Which rules\
    \ do you have to follow in order to implement an immutable class?\n\n- All fields\
    \ should be final and private.\n- There should not be setter methods.\n- The class\
    \ itself should be declared final in order to prevent subclasses violate the principle\
    \ of immutability.\n- If fields are not of a primitive type but a reference to\
    \ another object:\n    - There should not be a getter method that exposes the\
    \ reference directly to the caller.\n    - Don't change the referenced objects\
    \ (or at least changing these references is not visible to clients of the object).\n"
  mdcn: "\n\n## 1.38 死锁发生需要哪些条件？\n\n通常情况下，死锁的发生满足以下条件：\n\n-   **互斥**：存在一种资源在任何时刻只能被一个线程访问。\n\
    -   **资源持有**：线程在持有一个资源的同时，尝试获取另一个其他独占资源的锁。\n-   **非抢夺**：没有机制可以强制释放线程在特定时间段内所持有的资源。\n\
    -   **循环等待**：在运行期间发生了争用，其中两个（或多个）线程都在等待另一个线程释放它已锁定的资源。\n\n## 1.39 是否可能完全防止死锁？\n\
    \n为了防止死锁（一个或多个），必须消除死锁条件中的某一个或多个：\n\n-   **互斥**：在某些情况下，可以通过乐观锁来防止互斥。\n-   **资源持有**：当线程未能成功获取所有独占锁时，可以释放它所有的有的独占锁。\n\
    -   **非抢夺**：对独占锁使用超时机制，在给定时间后释放锁。\n-   **循环等待**：当所有线程都按照相同的顺序获取所有的独占锁时，就不会发生循环等待。\n\
    \n## 1.40 是否可以实现死锁检测？\n\n当所有的独占锁都被监控并建模为有向图时，死锁检测系统可以搜索两个线程，这两个线程都在等待另一个线程释放其已锁定的资源。然后，等待的线程可以通过某种异常被强制释放另一个线程正在等待的锁。\n\
    \n## 1.41 什么是活锁（Livelock）？\n\n活锁是指两个或多个线程通过响应由另一个线程引起的操作而相互阻塞的情况。与死锁（两个或多个线程在某个特定状态下等待）不同，参与活锁的线程会改变其状态，从而阻止它们的正常进展。一个例子是：两个线程尝试获取锁，但在无法获取第二个锁时释放它们已获取的锁。可能会发生两个线程并发尝试获取第一个锁。由于只有一个线程成功，现在两个线程都持有两个不同的锁，但由于它们都想要拥有这两个锁，它们就会释放自己的锁并再次从开始。这种情况可能会反复发生。\n\
    \n## 1.42 我们说的饥饿（Starvation）是指什么？\n\n低优先级线程获得的执行时间比高优先级线程少。当低优先级线程执行长时间的计算时，可能会出现这些线程没有足够的时间及时完成计算的情况。由于高优先级线程抢夺了它们的计算时间，它们似乎被“饥饿”了。\n\
    \n## 1.43 同步块可以防止线程饥饿吗？\n\n线程进入同步块的顺序是未定义的。因此在理论上，当许多线程等待进入同步块时，某些线程的等待时间可能比其他线程长。因此，它们没有足够的计算时间来及时完成工作。\n\
    \n## 1.44 我们说的竞态条件（Race condition）术语是指什么？\n\n竞态条件描述了这样一种情况：多线程实现的结果取决于参与线程的精确计时行为。在大多数情况下，这种行为是不希望的，因此竞态条件也意味着由于缺少线程同步导致了差异。竞态条件的一个简单例子是两个并发线程对一个整数变量进行递增。由于该操作由多个原子操作组成，可能会发生两个线程读取并增加了同一个值。在这次并发递增后，整数变量的值并没有增加\
    \ 2，而是增加了 1。\n\n## 1.45 我们说的公平锁（Fair locks）是指什么？\n\n公平锁在考虑下一个通过独占资源屏障的线程时，考虑了线程的等待时间。Java\
    \ SDK 提供了一个公平锁示例实现：`java.util.concurrent.locks.ReentrantLock`。如果使用布尔标志设为 true\
    \ 的构造函数，ReentrantLock 将授予等待最长的线程访问权限。\n\n## 1.46 对象从 `java.lang.Object` 继承的哪两个方法可以实现简单的生产者/消费者场景？\n\
    \n当工作线程完成当前任务且新任务队列为空时，它通过获取队列对象的内部锁（intrinsic lock）并调用 `wait()` 方法来释放处理器。该线程将由某个向队列放入了新任务的生产者唤醒，该生产者再次获取队列对象的同一个内部锁并调用\
    \ `notify()`。\n\n## 1.47 `notify()` 和 `notifyAll()` 之间有什么区别？\n\n这两个方法都用于唤醒通过调用\
    \ `wait()` 进入睡眠的一个或多个线程。虽然 `notify()` 仅唤醒等待线程中的一个，而 `notifyAll()` 会唤醒所有线程。\n\n\
    ## 1.48 如何确定哪个线程通过调用 `notify()` 被唤醒？\n\n如果有多个线程在等待，则没有指定调用 `notify()` 会唤醒哪些线程。因此，代码不应依赖于任何并发的\
    \ JVM 实现。\n\n## 1.49 下面这段从队列实现获取整数值的代码正确吗？\n\n```java\npublic Integer getNextInt()\
    \ {\n    Integer retVal = null;\n    synchronized (queue) {\n        try {\n \
    \           while (queue.isEmpty()) {\n                queue.wait();\n       \
    \     }\n        } catch (InterruptedException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n    synchronized (queue) {\n        retVal = queue.poll();\n\
    \        if (retVal == null) {\n            System.err.println(\"retVal is null\"\
    );\n            throw new IllegalStateException();\n        }\n    }\n    return\
    \ retVal;\n}\n```\n\n尽管该代码使用了队列作为监视器，但在多线程环境下它的行为是不正确的。原因是它有两个同步块。当两个线程被另一个线程通过\
    \ `notifyAll()` 在第 6 行唤醒时，它们会先后进入第二个同步块。第二个同步块中队列只有一个值，第二个线程将对空队列进行 poll 并得到空值。\n\
    \n## 1.50 是否可以检查线程是否持有某个对象的监视器？\n\n`java.lang.Thread` 类提供了 `holdsLock(Object)`\
    \ 方法，当且仅当当前线程持有作为方法参数对象的锁时，该方法返回 true。\n\n## 1.51 `Thread.yield()` 方法的作用是什么？\n\
    \n调用 `Thread.yield()` 给调度程序一个提示，当前线程愿意释放处理器。调度程序可以忽略此提示。由于未定义调用 `Thread.yield()`\
    \ 之后哪个线程将获得处理器，甚至可能发生当前线程成为“下一个”要执行的线程。\n\n## 1.52 在线程之间传递对象实例时需要考虑什么？\n\n在线程之间传递对象时，你必须注意这些对象不会被两个线程同时操作。一个例子是会被两个并发线程修改的键值对的\
    \ Map 实现。为了避免并发修改的问题，你可以将对象设计为不可变的。\n\n## 1.53 实现不可变类必须遵循哪些规则？\n\n-   所有字段都应该是\
    \ `final` 且 `private` 的。\n-   不应该有 setter 方法。\n-   类本身应该声明为 `final`，以防止子类违反不可变性原则。\n\
    -   如果字段不是基本类型而是对另一个对象的引用：\n    -   不应该有一个直接向调用者暴露引用的 getter 方法。\n    -   不要更改所引用的对象（至少这些引用的更改对对象的客户端是不可见的）。\n\
    \n"
