    by multi-threading if it is possible to parallelize the computations over the
    available CPU cores. An example would be an application that scale all matters
    that are stored in a local directory. Instead of iterating all one after the other,
    a producer/consumer implementation can use a single thread to scan the directory
    structure and a bunch of worker threads to perform the actual scaling operation.
    When n converges in parallel, an application mirrors some page. Instead of loading
    one HTML page after the other, a producer can parse the first HTML page and issue
    the links it found into a queue. The worker threads monitor the queue and load
    the web pages by the parser. While the worker waits for the page to be loaded
    completely, other threads use the CPU to parse the already loaded pages and issue
    new requests.


    # 1.57 What do we understand by the term scalability?


    Scalability means the ability of a program to improve the performance by adding
    further resources to it.


    # 1.58 Is it possible to compute the theoretical maximum speed up for an application
    by using multiple processors?


    Amdahl''s law provides a formula to compute the theoretical maximum speed up by
    providing multiple processors to an application. The theoretical speedup is computed
    by S(n)=1/(B+(1-B)/n) where n is the number of processors and B is the fraction
    of the program that cannot be executed in parallel. When n converges at infinity,
    (1-B)/n converges against zero. Hence the formula can be reduced in this specific
    case to 1/B. As we can see, the theoretical maximum speedup is the lower this
    fraction is, the more theoretical speedup can be achieved.


    # 1.59 What do we understand by lock contention?


    Lock contention occurs, when two or more threads are competing in the acquisition
    of a lock. The scheduler has to decide whether it lets the thread, which has to
    wait sleeping and performs a context switch to another thread occupy the CPU,
    or by letting the waiting thread busy-waiting is more efficient. Both ways introduce
    idle time to the inferior thread.'
