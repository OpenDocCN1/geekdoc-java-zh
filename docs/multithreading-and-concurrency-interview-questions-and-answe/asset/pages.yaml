  md: '# # Chapter 1


    # # MultiThreading Questions


    # ## 1.1 What do we understand by the term concurrency?


    Concurrency is the ability of a program to execute several computations simultaneously.
    This can be achieved by distributing the computations over the available CPU cores
    of a machine or over different machines within the same network.


    # ## 1.2 What is the difference between processes and threads?


    A process is an execution environment provided by the operating system that has
    its own set of private resources (e.g. memory, open files, etc.). Threads, in
    contrast, live within a process and share their resources (memory, open files,
    etc.) with the other threads of the process. The ability to share resources between
    different threads makes thread more suitable for tasks where performance is a
    significant requirement.


    # ## 1.3 In Java, what is a process and a thread?


    In Java, processes correspond to a running Java Virtual Machine (JVM) whereas
    threads live within the JVM and can be created and stopped by the Java application
    dynamically at runtime.


    # ## 1.4 What is a scheduler?


    A scheduler is the implementation of a scheduling algorithm that manages access
    of processes and threads to some limited resource like the processor or some I/O
    channel. The goal of most scheduling algorithms is to provide some kind of load
    balancing for the available processes/threads that guarantees that each process/thread
    gets an appropriate time frame to access the requested resource exclusively.


    # ## 1.5 How many threads does a Java program have at least?


    Each Java program is executed within the main thread; hence each Java application
    has at least one thread.


    # ## 1.6 How can a Java application access the current thread?


    The current thread can be accessed by calling the static method `currentThread()`
    of the JDK class `java.lang.Thread:`:'
