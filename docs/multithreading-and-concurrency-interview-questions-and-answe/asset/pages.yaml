  md: '# Preface


    Concurrency is always a challenge for developers and writing concurrent programs
    can be extremely hard.


    There is a number of things that could potentially blow up and the complexity
    of systems rises considerably when concurrency is introduced.


    However, the ability to write robust concurrent programs is a great tool in a
    developer''s belt and can help build sophisticated, enterprise level applications.


    In this guide we will discuss different types of questions that can be used in
    a programming interview in order to assess a candidate''s understanding of concurrency
    and multithreading.


    The questions are not only Java specific, but revolve around general programming
    principles.'
