  md: "# 1.20 Can we use Thread.sleep() for real-time processing?\n\nThe number of\
    \ milliseconds passed to an invocation of Thread.sleep(long) is only an indication\
    \ for the scheduler how long the current thread does not need to be executed.\
    \ It may happen that the scheduler lets the thread execute a few milliseconds\
    \ earlier or later depending on the actual implementation. Hence an invocation\
    \ of Thread.sleep() should not be used for real-time processing.\n\n# 1.21 How\
    \ can a thread be woken up that has been put to sleep using Thread.sleep() ()\n\
    \nThe method interrupt() of java.lang.Thread interrupts a sleeping thread. The\
    \ interrupted thread has been put to sleep by calling Thread.sleep().\n\n```\n\
    public class InterruptExample implements Runnable {\n    public void run() {\n\
    \        try {\n            Thread.sleep(Long.MAX_VALUE);\n        } catch (InterruptedException\
    \ e) {\n            System.out.println(\"*\"+Thread.currentThread().getName()+[\"\
    ] Interrupted by exception\");\n        }\n    }\n    public static void main(String[]\
    \ args) throws InterruptedException {\n        Thread myThread = new Thread(new\
    \ InterruptExample(), \"myThread\");\n        myThread.start();\n\n        System.out.println(\"\
    *\"+Thread.currentThread().getName()+[\"] Sleeping for 5s...\")\\n        Thread.sleep(5000);\n\
    \n        System.out.println(\"*\"+Thread.currentThread().getName()+[\"] Interrupting\
    \ myThread\");\n        myThread.interrupt();\n    }\n}\n```\n\n# 1.22 How can\
    \ a thread query if it has been interrupted?\n\nIf the thread is not within a\
    \ method like Thread.sleep() that would throw an InterruptedException, the thread\
    \ can query if it has been interrupted by either calling the static method Thread.interrupted()\
    \ or the method isInterrupted() that it has inherited from java.lang.Thread.\n\
    \n# 1.23 How should an InterruptedException be handled?\n\nMethods like sleep()\
    \ and join() throw an InterruptedException to tell the caller that another thread\
    \ has interrupted this thread. This is done in order to tell the current thread\
    \ to stop its computations and finish unexpectedly. Hence ignoring the exception\
    \ by catching it and only logging it to the console or some log file is not the\
    \ appropriate way to handle this kind of exception. The problem with this exception\
    \ is, that the method run() of the Runnable interface does not allow run() throws\
    \ any exceptions. So rethrowing does not help. This means the implementation of\
    \ run() has to handle this checked exception itself and this often leads to the\
    \ fact that it has caught and ignored."
