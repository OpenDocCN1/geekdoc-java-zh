  md: "# 1.27 What is a shutdown hook?\n\nA shutdown hook is a thread that gets executed\
    \ when the JVM shuts down. It can be registered by invoking addShutdownDownHook(Runnable)\
    \ Runtime.getRuntime().addShutdownDownHook(new Thread (\n\n```\n@Override\\addShutdownDownHook(new\
    \ Thread ( {\n    @Override\n    public void run() {\n\n    }\n});\n```\n\n# 1.28\
    \ For what purposes is the keyword synchronized used?\n\nWhen you have to implement\
    \ exclusive access to a resource, like some static value or some file reference,\
    \ the code that works with the exclusive resource can be embraced in a synchronized\
    \ block:\n\n```\nsynchronized (SynchronizedCounter.class) {\n    counter++;\n\
    }\n```\n\n# 1.29 What intrinsic lock acquires a synchronized method acquire?\n\
    \nA synchronized method acquires the intrinsic lock for that's method and releases\
    \ it when the method returns. Even if the method throws an exception, the intrinsic\
    \ lock is released. A synchronized method is equal to the following code:\n\n\
    ```\npublic void method() {\n    synchronized(this) {\n        ...\n    }\n}\n\
    ```\n\n# 1.30 Can a constructor be synchronized?\n\nNo, a constructor cannot be\
    \ synchronized. The reason why this leads to a syntax error is the fact that only\
    \ the constructing thread should have access to the object being constructed.\n\
    \n# 1.31 Can primitive values be used for intrinsic locks?\n\nNo, primitive values\
    \ cannot be used for intrinsic locks.\n\n# 1.32 Are intrinsic locks reentrant?\n\
    \nYes, intrinsic locks can be accessed by the same thread again and again. Otherwise\
    \ code that acquires a lock would have to pay attention that it does not accidentally\
    \ try to acquire a lock it has already acquired."
