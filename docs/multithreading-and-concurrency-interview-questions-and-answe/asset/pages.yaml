  md: "# Multithreading and Concurrency Questions\n\n```\ntry {\n    Thread.sleep(1000);\n\
    } catch (InterruptedException e) {\n}\n}\n\n```\n\n# 1.13 Why should a thread\
    \ not be stopped by calling its method stop () ?\n\nA thread should not be stopped\
    \ using the deprecated methods stop() of java.lang.Thread, as of this method which\
    \ causes the thread to unlock all monitors it has acquired. If any object protected\
    \ by one of the released locks was in an inconsistent state, this state gets visible\
    \ to all threads. This can cause arbitrary behavior when other threads work this\
    \ inconsistent object.\n\n# 1.14 Is it possible to start a thread twice?\n\nNo,\
    \ after started a thread by invoking its start() method, a second invocation of\
    \ start() will throw an IllegalStateException.\n\n# 1.15 What is the output of\
    \ the following code?\n\n```\npublic class Multithreading {\n    private static\
    \ class MyThread extends Thread {\n        public MyThread(String name) {\n  \
    \          super(name);\n        }\n        @Override\n        public void run()\
    \ {\n            System.out.println(Thread.currentThread().getName());\n     \
    \   }\n    }\n    public static void main(String[] args) {\n        MyThread myThread\
    \ = new MyThread(\"myThread\");\n        myThread.run();\n    }\n}\n```\n\nThe\
    \ code above produces the output \"main\" and not \"myThread\". As be seen in\
    \ line two of the main() method, we invoke by the method run() instead of start().\
    \ Hence, no new thread is started, but the method run() gets executed within the\
    \ main thread.\n\n# 1.16 What is a daemon thread?\n\nA daemon thread is a thread\
    \ whose execution state is not evaluated when the JVM decides if it should stop\
    \ or not. The JVM stops when all user threads (in contrast to the daemon threads)\
    \ are terminated. Hence daemon threads can be used to implement example monitoring\
    \ functionality as that the JVM stops as soon as all user threads have stopped:"
