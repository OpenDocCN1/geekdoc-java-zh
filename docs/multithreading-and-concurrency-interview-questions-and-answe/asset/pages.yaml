  md: '# 1.74 Which are use cases for the class java.util.concurrent.Future?


    Instances the class java.util.concurrent.Future are used to represent results
    of asynchronous computations whose are not immediately available. Hence the class
    provides methods to check if the asynchronous computation has finished, canceling
    the task and to retrieve the actual result. The latter can be done with the get()
    methods provided. Each get() takes no parameter and blocks until the result is
    available whereas the get() method takes a timeout parameter that lets the invocation
    return if the result does not available within the given timeframe.


    # 1.75 What is the difference between HashMap and Hashtable particularly with
    regard to thread-safety?


    The methods of Hashtable are all synchronized. This is not the case for the HashMap
    implementation. Donc Hashtable is thread-safe whereas HashMap is not thread-safe.
    For single-threaded applications it is therefore more efficient to use the "newer"
    HashMap implementation.


    # 1.76 Is there a simple way to create a synchronized instance of an arbitrary
    implementation of Collection, List or Map?


    The utility class provides the methods synchronized(Collection), synchronizedList(List)
    and synchronizedMap(Map) that return a thread-safe collection/list/map that is
    backed by the given instance.


    # 1.77 What is a semaphore?


    A semaphore is a data structure that maintains a set of permits that may be acquired
    by competing threads. Semaphores can be used to control how many threads access
    a critical section or resource simultaneously. Hence the constructor of java.util.concurrent.Semaphore
    takes as first parameter the number of permits the threads compete about. Each
    invocation of its acquire() tries to obtain one of the available permits. The
    method acquire() without parameter blocks until the next permits available. Later
    on, when the thread has finished its work on the critical resource, it can release
    the permit by using the method release() on an instance of Semaphore.


    # 1.78 What is a CountDownLatch?


    The SDK CountDownLatch provides a synchronization aid that can be used to implement
    scenarios in which threads have to wait until some other threads have reached
    the same state that all thread can start. Reaching zero the CountDownLatch instance
    lets all threads proceed. This can be used to let all threads start at a given
    point in time by using the value 1 for the counter or to wait until a number of
    threads has finished. In the later case the counter is initialized with the number
    of threads and that thread has finished its work counts down by one.


    # 1.79 What is the difference between a CountDownLatch and a CyclicBarrier?


    Both classes maintain a counter that is decremented by different threads. The
    threads wait until the internal counter reaches the zero value and proceed from
    there. But in contrast to the CountDownLatch class CyclicBarrier resets the internal
    value back to the initial value once the value reaches zero. As the name indicates
    of CyclicBarrier can be used to implement cases where threads have to wait on
    each other and again.'
