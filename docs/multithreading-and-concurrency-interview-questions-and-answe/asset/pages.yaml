  md: "# 1.24 After having started a child thread, how do we wait in the parent thread\
    \ for the\ntermination of the child thread?\n\nWaiting for a thread termination\
    \ is done by invoking the method join() on the thread's instance variable:\n\n\
    ```\nThread thread = new Thread(new Runnable() {\n    @Override\n    public void\
    \ run() {\n    }\n});\nthread.start();\nthread.join();\n```\n\n# 1.25 What is\
    \ the output of the following program?\n\n```\npublic class MyDaemonThreads {\n\
    \    private static class MyDaemonThread extends Thread {\n        public MyDaemonThread()\
    \ {\n            setDaemon(true);\n        }\n\n        @Override\n        public\
    \ void run() {\n            try {\n                Thread.sleep(1000);\n     \
    \       } catch (InterruptedException e) {}\n        }\n    }\n\n    public static\
    \ void main(String[] args) throws InterruptedException {\n        Thread thread\
    \ = new MyDaemonThread();\n        thread.start();\n        thread.join();\n \
    \       System.out.println(thread.isAlive());\n    }\n}\n```\n\nThe output of\
    \ the above code is \"false\". Although the instance of MyDaemonThread is a daemon\
    \ thread, the invocation of join() causes the thread to wait until the execution\
    \ of the daemon thread has finished. Hence isAlive() on the thread returns that\
    \ the daemon thread is no longer running.\n\n# 1.26 What happens when an uncaught\
    \ exception leaves the run() method?\n\nI can happen that an uncaught exception\
    \ escapes from the run() method. In this case it is possible to catch this by\
    \ registering an instance that implements the interface UncaughtExceptionHandler\
    \ as an uncaught handler.\n\nThis is either done by invoking the static method\
    \ Thread.setDefaultUncaughtExceptionHandler(Thread.UncaughtExceptionHandler),\
    \ which tells the JVM to use the provided handler in case there is no specific\
    \ handler registered on the thread, or by invoking setUncaughtExceptionHandler(Thread.UncaughtExceptionHandler)\
    \ on the thread instance itself."
