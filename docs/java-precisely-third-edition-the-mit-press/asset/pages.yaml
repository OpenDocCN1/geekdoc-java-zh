  md: "# 68 Interfaces\n\n# 13.3 Default and Static Methods on Interfaces (Java 8.0)\n\
    \nAn interface can declare default methods, which must have a body in the form\
    \ of a block statement. The method body can refer only to the interface’s (abstract,\
    \ default, static) methods and (final static) fields, as well as other static\
    \ methods. A default method is inherited by any class that implements the interface\
    \ or any of its subinterfaces. Many predefined functional interfaces have default\
    \ methods; see chapter 23 and example 214.\n\t\t\tAn interface can declare static\
    \ methods, which have a body in the form of a block statement. The method body\
    \ can refer only to other static methods and (final static) fields of the interface.\
    \ A static method m declared on interface I can be called directly on the interface\
    \ type I.m(...) and must be called like this also in implementing classes and\
    \ in subinterfaces; it is not “inherited” by them.\n\n# 13.4 Annotation Type Declarations\n\
    \nAn annotation type @Anno is a special kind of interface; its declaration has\
    \ this form:\n\n```\ninterface-modifiers @Interface Ano { annotation-members }\n\
    ```\n\nEach annotation-member is one of these forms, where an annotation-member-expression\
    \ is a constant:\n\n```\ntype f();\ntype f() default annotation-member-expression;\n\
    final type f = constant;\n```\n\nSeveral meta-annotations may be used when declaring\
    \ an annotation type. The @Target({{...}}) meta-annotation specifies the legal\
    \ targets for an annotation type; the declaration by type is:\n\n| Target Value\
    \ | Legal Targets |\n|---|---|\n| ANNOTATION_TYPE | Annotation type declarations\
    \ |\n| CONSTRUCTOR | Constructor declarations |\n| FIELD | Field declarations\
    \ or enum value declarations |\n| LOCAL_VARIABLE | Local variable declarations\
    \ |\n| METHOD | Method declarations |\n| PACKAGE | Package declarations |\n| PARAMETER\
    \ | Parameter declarations in method or constructor |\n| TYPE | Class, or enum\
    \ type declarations |\n| TYPE_PARAMETER | Type parameter of generic class, interface\
    \ or constructor |\n\nThe @Retention({...}}) meta-annotation specifies the retention\
    \ policy for an annotation type:\n\n| Value | Meaning |\n|---|---|\n| SOURCE |\
    \ The annotation is discarded by the compiler and will not be stored in the class\
    \ file |\n| CLASS | The annotation is stored in the class file (the default) but\
    \ unavailable at run-time |\n| RUNTIME | The annotation is available for inspection\
    \ at run-time |\n\nAnnotations with retention RUNTIME can be accessed using reflection\
    \ (chapter 27) at run-time. Methods getAnnotations and getDeclaredAnnotations\
    \ on classes Class, Field, Method, and Constructor return the annotations given\
    \ in an array of type Annotation].\nIf an annotation meta-annotation @Inherited\
    \ is used on a class declaration, then the subclasses of this class will inherit\
    \ the annotation. Chapter 28 describes other standard annotations and their use.\n\
    \n*"
