  md: '# 25 Class Optional<T> (Java 8.0)


    An instance of Optional<T> from package java.util represents a value that is either
    absent (missing, empty) or present, and in the latter case contains a non-null
    value of type T. Optional<T> can be used to make it clearer that an operation
    may not return a result, instead of letting silently return null. For instance,
    the findAny method on interface Stream<T> has type


    ```

    Optional<T> findAny()

    ```


    which makes it clear that sometimes findAny cannot produce a result, namely, when
    the stream is empty. Class Optional<T> has these methods:


    +   * static <T> Optional<T> empty() returns an absent (empty) Optional.


    +   * Optional<T> filter(Predicate super T> p) returns a Optional containing v
    if v is present and p.test(v) is true; otherwise returns an absent Optional.


    +   * Optional<U> flatMap(Function super T, Optional<U>> f) returns f.apply(v)
    if v is present; otherwise returns an absent Optional.


    +   * T get() returns the value if present; otherwise throws NoSuchElementException.


    +   * void ifPresent(Consumer super T> cons) invokes cons.accept(v) on the value
    if present; otherwise does nothing.


    +   * boolean isPresent() returns true if there is a value; otherwise


    +   * Optional<U> map(Function super T,? U> f) returns a Optional containing res
    provided a value v is in this Optional and res = f.apply(v) is non-null; otherwise
    returns an absent Optional.


    +   * static <T> Optional<T> of(T x) returns a Optional containing x if x is non-null;
    throws NullPointerException.


    +   * static <T> Optional<Nullable>(T x) returns a Optional containing x if x
    is non-null; otherwise returns an absent Optional.


    +   * orElse(T other) returns the value if present; otherwise if not. It behaves
    just like isPresent() ? get() : other.


    +   * orElseGet(Supplier<T> supp) returns the value if present; otherwise the
    result of supp.get().


    +   * orElseThrow(Supplier extends Throwable> exn) returns the value if present;
    otherwise throws the exception by exn.get().


    The methods ifPresent, filter, flatMap, and of exist on the Stream<T> interface
    also, and conceptually an Optional<T> can be thought of as a stream with zero
    or one element. The ifPresent on an Optional is the same as forEach on a stream.


    There are primitive-type specialized classes OptionalDouble, OptionalInt, and
    OptionalLong for representing results of type double, int, or long may be absent;
    this is particularly useful since a value of primitive types cannot be null. These
    classes have methods, getAs(Double, Int, Long), ifPresent, isPresent, of, orElse,
    orElseGet, and orElseThrow, with correspondingly primitive-type specialized and
    result types.'
