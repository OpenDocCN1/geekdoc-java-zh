    # 11.9 Field Access Expressions


    A field access must have one of these three forms:


    +   * f

    * C.f

    * o.f


    where C is a class and o an expression of reference type (section 9.6, 33, and
    example 56).


    A class may have several fields of the same name f declared as a static or non-static
    field declared or inherited by a class declaration TC.

    A field access f.f must refer to the object is ignored if f has not been shadowed
    by a field in a nested enclosing class, or by a variable or parameter of the same
    name). The declaring class C.f must refer to a field in class C or a superclass
    of C. That is the target class TC.

    A field access o.f, where expression o has type C, must refer to a static or non-static
    field in class C or a superclass of C. That is the target class TC. To evaluate
    the field access, the expression o is evaluated to obtain an object. If the field
    is static, the object is ignored and the value of o.f is the value of the TC-field
    f. If the field is non-static, the value of o must be non-null and the value of
    o.f is the value of the TC-field f in object o.\It is informative to contrast
    a non-static field access and a non-static method call (section 11.12):


    +   * In a field access o.f, the field referred to is determined by the compile-time
    type of the object o

    * In a non-static call to a non-private method o.m(...), the method called is
    determined by the run-time class of the object to which evaluates


    # 11.10 The Current Object Reference this


    The name this may be used in non-static code to refer to the current object (section
    9.1). When static code in a given object is executed, the object reference this
    refers to the object as a whole. Hence, when f is a field and m is a method (declared
    in the innermost enclosing class), then this means the same as when f has not
    been shadowed by a variable or parameter of the same name), and this(...) means
    the same as m(...).\When D is an inner class in an enclosing class C, then the
    D this refers to the object C enclosing the inner D object. See example 42, where
    TLC.thisnf refers to field nf of the enclosing class TLC.


    # 11.11 Type Cast Expression


    A cast of expression e to t is done using this, which has type t:


    ```

    (t)e

    ```


    When e is of primitive type and t is primitive type, the cast is the widening
    or narrowing conversion (section 5.7). When e is a primitive type and t has the
    corresponding boxed type, the cast is unboxing, and when e has primitive type
    and t is the corresponding boxed type, it is a boxing (section 5.4).\When e is
    an expression of reference type and t is a reference type, the cast is evaluated
    by evaluating e to a value v. If v is null or a reference to an object or whose
    class is a subtype of t, then the cast succeeds with v; otherwise the exception
    ClassCastException is thrown. The cast is illegal when it cannot possibly succeed
    at run-time, for instance, when e has type int and t is Boolean.'
