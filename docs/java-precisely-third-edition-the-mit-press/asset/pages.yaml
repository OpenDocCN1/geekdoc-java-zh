  md: "# Example 187 Replacing Multiple Kinds of Failure with Optional\n\nAssume we\
    \ need to (1) read a field \"area\" off web form, (2) parse the field value as\
    \ a **double**, (3) compute its square root, and then either return the result\
    \ or an error message. This illustrates Java's three ways to indicate the absence\
    \ of result: (1) returning `null`, if the field is missing from the web; (2) throwing\
    \ an exception, if the string cannot be parsed as a `double`; and (3) returning\
    \ `NaN`, when taking the square root of a negative number. Code Fragment (B) below\
    \ gives the messy error-handling code necessary in this case. However, this approach\
    \ shows that Optional returning methods of `parseDouble` and `sqrt` are available,\
    \ but the Java class libraries currently have only a few such methods outside\
    \ the stream framework.\n\n```\n// Handling three kinds of error indication explicitly:\n\
    String areaString = form.get(\"area\"); toPrint = \"No value\";\nif (areaString\
    \ != null) {\n    try {\n        double areaValue = Double.parseDouble(areaString);\n\
    \        double result = Math.sqrt(areaValue);\n        if (Double.isNaN(result))\
    \ {\n            toPrint = String.valueOf(result);\n        }\n    } catch (NumberFormatException\
    \ e) { }\n}\nSystem.out.println(toPrint);\n```\n\n```\n// Alternative (B): Using\
    \ Optional-returning methods exist:\nOptional<String> area = Optional.ofNullable(form.get(\"\
    area\"));\nOptional<Double> value = area.map(s -> parseDouble(s))\nOptional<Double>\
    \ result = value.map(v -> sqrt(v));\nSystem.out.println(result.map(String::valueOf).orElse(\"\
    No value\"));\n```\n\n```\n// Alternative (C): As (B) but without naming the intermediate\
    \ results:\nOptional.ofNullable(form.get(\"area\"))\n    .flatMap(s -> parseDouble(s))\n\
    \    .map(v -> sqrt(v))\n    .map(String::valueOf)\n    .orElse(\"No value\");\n\
    ```\n\n```\nSystem.out.println(toPrint);\n```\n\n# Example 188 Optional Stream\
    \ Element\n\nOne can use `findAny` on the stream queens *n* of solutions to the\
