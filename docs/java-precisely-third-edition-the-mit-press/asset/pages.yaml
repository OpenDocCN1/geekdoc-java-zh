  md: "# Functional Interfaces (Java 8.0) 127\n\n**Example 155** Ways to Obtain a\
    \ Function<String,Integer>\nA value of Function<String,Integer>, which is from\
    \ String to Integer, can be obtained in many\nways, as shown by the definitions\
    \ of fsi1-fsi7 below, where fsi1-fsi4 parse a string as an integer, and\nfsi5-fsi7\
    \ return a string's length. The lambda (section 11.13) and method reference (section\
    \ 11.14) notation\nare more compact than the anonymous inner class used for for7,\
    \ but the resulting values\nareoked the same way, with fsi.apply(\"fsi7\"). Compile-time\
    \ type inference is the correct Integer\nconstructor overload in fsi4 case and\
    \ the correct length method in the fsi5 case.\n\n```\nfsi1 = s -> Integer.parseInt(s);\
    \ // lambda with parameter s\nfsi2 = (String s) -> Integer.parseInt(s); // same,\
    \ with explicit type parameter\nfsi3 = Integer::parseInt; // reference to static\
    \ method Integer.parseInt\nfsi4 = Integer::new; // reference to constructor Integer(String)\n\
    fsi5 = s -> s.length(); // lambda with parameter s\nfsi6 = String::length; //\
    \ reference to instance method String.length()\nfsi7 = new Function<String, Integer>()\
    \ {\n    // anonymous inner class (Java 1.1)\n    public Integer apply apply(String\
    \ s) {\n        return s.length();\n    }\n};\n```\n\n**Example 156** Multiple\
    \ Traversals of a Stream\nWith interfaces can encapsulate general behaviors in\
    \ methods that take-function arguments in\na type-safe manner. With element type\
    \ T, by a function f of type T->U and then a function g of type U->V, the result\
    \ is\nstream with element type V.\n\nFunction traverse computes the same results\
    \ but only once \"traversal\" of the stream,\napplying the composed function f.and(g)\
    \ to each element. Java's stream implementation may make in\nautomatically fuse\
    \ the stream into a single pass.\n\n```\npublic static <T,U,V> Stream<V> traverse(Stream<T>\
    \ xs, Function<T,U> f, Function<U,V> g) {\n    return xs.map(f).map(g);\n}\npublic\
    \ static <T,U,V> Stream<V> traverse2(Stream<T> xs, Function<T,U> f, Function<U,V>\
    \ g) {\n    return xs.map(f.and(g));\n}\n```\n\n**Example 157** Wildcards for\
    \ a Accommodating Method Signature\ntverse2 from example 156 cannot be applied\
    \ to a stream xs of type Long, a function f of\ntype<Number,String>, and a function\
    \ g of type<Number,Object> because the types do not\nmatch. Type is different\
    \ from Long, and Object is different from String. However, since Number\nis a\
    \ supertype of Long, and Object is a supertype of String, the function composition\
    \ could actually work.\nUsing wildcards (section 21.9) we can safely get traverse3\
    \ below a more accommodating, and the application\n\n```\npublic static <T,U,V>\
    \ Stream<V> traverse3(Stream<T> xs, Function<? extends T,? extends U> f,\nFunction<?\
    \ extends U,? extends V> g) {\n    return xs.map(f.and(g));\n}\n// Stream<Double>\
    \ res = traverse2(xs, f, g); // Type error!\nStream<Integer> res = traverse3(xs,\
    \ f, g);\n```"
