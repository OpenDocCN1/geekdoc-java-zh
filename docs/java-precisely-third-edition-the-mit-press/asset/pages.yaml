    \ of Values\n\nThe java.util.ArrayList could hold only Person objects, but without\
    \ generic types, the compiler cannot check that only Person objects are added\
    \ to cool. Here at run-time the proper must check and cast objects when extracting\
    \ them from the list. These checks take time and may fail. The Java compiler can\
    \ only warn that the add operations are:\n\n```\nArrayList cool = new ArrayList();\n\
    cool.add(new Person(\"Kristen\"));\ncool.add(new Person(\"Bjarne\"));\ncool.add(new\
    \ Exception(\"Larry\")); // Wrong, but no compile-time check\ncool.add(new Person(\"\
    Anders\"));\nPerson p = (Person)cool.get(2); // Compiles OK, but fails at run-time\n\
    ```\n\n# Example 117 Using Generic ArrayList: Compile-Time Type Checks\n\nWith\
    \ generic types, cool can be declared to type class java.util.ArrayList<Person>,\
    \ the compiler can check that only Person objects are added to the cool method,\
    \ and therefore the array list can contain only Person objects. Generic types\
    \ make the programmer's intention clear in the source code and improve our trust\
    \ in the program.\n\nHowever, Generic types do not improve efficiency: the cost\
    \ to class cool.get(2) is performed at run-time, but it does not appear explicitly\
    \ in the source code.\n\n```\nArrayList<Person> cool = new ArrayList<Person>();\n\
    cool.add(new Person(\"Kristen\"));\ncool.add(new Person(\"Bjarne\"));\ncool.add(new\
    \ Exception(\"Larry\")); // Wrong, detected at compile-time\ncool.add(new Person(\"\
    Anders\"));\nPerson p = cool.get(2); // No explicit cast or check needed\n```\n\
    \n# Example 118 A Generic Class for Pairs\n\nA pair of values of T and U can be\
