  md: '# Generic Collections and Maps


    # Generic Collections and Maps


    The class library package java.util provides collection classes and map (or dictionary)
    classes:


    +   * A Collection, described by generic interface Collection<T> (section 22.1),
    is used to group and handle many distinct elements of type T as a whole.

    * A List, described by generic interface List<T> (section 22.2), is a collection
    whose elements can be traversed in order. Implemented by the generic classes LinkedList<T>
    (for linked lists, deque and stacks) and ArrayList<T> (for dynamically arrays
    and stacks).

    * A set, described by generic interface Set<T> (section 22.3), represents a mapping
    from a key to value or a set that cannot contain duplicate elements. Implemented
    by the generic classes HashSet<T> and LinkedHashSet<T>

    * A sorted set, described by generic interface SortedSet<T> (section 22.4), is
    a set whose elements are ordered; either the elements implement method compareTo
    by Comparable<T> or the set''s ordering is explicitly given by an object of type
    Comparator<T> (section 22.9). Implemented by generic class TreeSet<T>n* A map,
    described by generic interface Map<K,V>, represents a mapping from a key to at
    most one value of V for each key. Implemented by the generic classes HashMap<K,V>,
    IdentityHashMap<K,V>, and LinkedHashMap<K,V>.

    * A sorted map, described by generic interface SortedMap<K,V> (section 22.6),
    is a map whose keys are ordered, as for SortedSet<K>. Implemented by class TreeMap<K,V>.


    The standard interfaces, abstract classes, and concrete implementation classes
    are shown below. User-defined implementations can be conveniently defined as subclasses
    of the abstract classes; see the Java class library documentation on package java.util.
    Solid arrows indicate the subclass relations, and dashed arrows the "implements"
    relation between a class and an interface.


    ![](img/25c670a7b9eeeecd9d7d8d608e1793ba_114_0.png)'
