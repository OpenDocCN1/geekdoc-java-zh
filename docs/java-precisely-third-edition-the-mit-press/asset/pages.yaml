    # 11.13 Lambda Expressions (Java 8.0)


    Lambda expression evaluates to a function, a value that implements a functional
    interface (chapter 23). A lambda expression has one of these three forms, each
    having zero or more parameters and a lambda body:


    +   - x -> ebs

    - (x1, ... xn) -> ebs

    - (formal-list) -> ebs


    Here is x value, and the lambda body is either an expression or a block statement
    {...}. The formal-list is the same as for methods in section 9.8. In the first
    two forms, the parameters are implicitly typed (types are inferred), and in the
    third form, they are explicitly typed (types declared). A lambda expression can
    have a mixture of implicitly and explicitly typed parameters.


    A lambda expression (a method return-expression, section 11.14) can appear only
    on the right-hand side of an assignment, as an argument in a call, or in a method
    return statement. This is because the lambda expression may have many different
    types and needs a target function type such as Function<String,Integer> from chapter
    23.5. The target type is provided by the assignment left-hand side, the parameter
    type, the cast type, or the method return type.


    Evaluation of a lambda expression produces an instance f implementing a functional
    interface (chapter 23), but does not cause evaluation of the lambda body. To evaluation
    of the lambda body, call the single abstract method of the function, as in f.apply(...);
    see example 65. If the lambda body throws an exception, then that exception will
    propagate to the call of the function.


    In a lambda body that is a block statement, either no return statement has an
    expression, or all have the form return e and execution cannot "fall through"
    by reaching the end of the block statement. The return statement returns from
    the (innermost) lambda expression, not from any enclosing method.


    A variable captured in a lambda body must be declared final or effectively final,
    just as for local classes (section 9.11) it is not the target of reassignment
    or pre/post increment/decrement operators.


    An occurrence of this or super in a lambda body means the same as the lambda expression''s
    context, unlike in an anonymous inner class, where this refers to the IC and super
    to methods and fields of the class IC.


    # 11.14 Method Reference Expressions (Java 8.0)


    A method reference has one of these forms, where t is a type, m method name, e
    an expression, and c class name. Example 67 illustrates all of these:


    +   - t :: m

    - e :: m

    - super :: m

    - t . super :: new

    - C :: new

    - t[]:: :: new


    The first five of these can further take type arguments <t1...tn> between the
    :: separator and the method name m the last conform. Such type arguments are used
    to resolve type parameters of the indicated method m or class C. Also, the number
    n type parameters is used to limit the search for applicable methods. Note that
    one cannot specify the method''s actual signature (argument types).'
