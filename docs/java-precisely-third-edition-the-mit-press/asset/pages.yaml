  md: "# Example 194 Reading Numbers from a Text File\n\nA StreamTokenizer stok is\
    \ created from a buffered file reader and told to recognize number tokens. Tokens\n\
    read until end-of-stream, and the number tokens are added together, whereas non-number\
    \ tokens are printed to\nstandard output. The buffering of input is important:\
    \ it makes the program many times faster.\n\n```\nstatic void sumfile(String filename)\
    \ throws IOException {\n    Reader r = new BufferedReader(new FileReader(filename));\n\
    \    StreamTokenizer stok = new StreamTokenizer(r);\n    stok.parseNumbers();\n\
    \    double sum = 0;\n    stok.nextToken();\n    while (stok.type != StreamTokenizer.TT_EOF)\
    \ {\n        if (stok.type == StreamTokenizer.TT_NUMBER) {\n            sum +=\
    \ stok.nval;\n        } else\n            System.out.println(\"Number: \" + stok.nval);\n\
    \        }\n        stok.nextToken();\n    }\n    System.out.println(\"The file\
    \ sum is \" + sum);\\n}\n```\n\n# Example 195 Reading Numbers from a Text File,\
    \ Line by Line\n\nA StreamTokenizer stok is created from a LineNumberReader and\
    \ told to recognize number tokens and new-\nlines are read until end-of-stream,\
    \ and the sum of number tokens is counted by line. The\nline number is set to\
    \ count from 1 (default is 0). Class LineNumberReader is a subclass of BufferedReader\n\
    and is therefore used. When a LineNumberReader is somewhat redundant, StreamTokenizer\n\
    itself provides a line() method.\n\n```\nstatic void sumlines(String filename)\
    \ throws IOException {\n    LineNumberReader lnr = new LineNumberReader(new FileReader(filename));\n\
    \    lnr.setLineNumber(1);\n    StreamTokenizer stok = new StreamTokenizer(lnr);\n\
    \    stok.parseNumbers();\n    stok.skipSignificant(true);\n    stok.nextToken();\n\
    \    while (stok.type != StreamTokenizer.TT_EOF) {\n        int linner = lnr.getLineNumber();\n\
    \        double sum = 0;\n        while (stok.type == StreamTokenizer.TT_NUMBER)\
    \ {\n            sum += stok.nval;\n            stok.nextToken();\n        }\n\
    \        System.out.println(\"Sum of line \" + linner + \" is \" + sum);\n   \
    \     stok.nextToken();\n    }\n}\n```"
