  md: '# 12.5 Loop Statements


    # 12.5.1 The for Statement


    A for statement has the form


    ```

    for (initialization; condition; step)

    body

    ```


    where initialization is a variable-declaration (section 6.2) or an expression,
    condition is an expression of type boolean or Boolean, step is an expression,
    and body is a statement. More generally, the initialization and step may also
    be comma-separated lists of expressions; the expressions in such are evaluated
    from left to right. The initialization, condition, and step may be empty. An empty
    condition is equivalent to true. Thus for (;) body means "execute execute body."
    The for statement is executed as:


    +   1. The initialization is executed.


    +   2. The condition is evaluated. If it is false, the loop terminates.


    +   3. If it is true, (a) the body is executed; (b) the step is executed; and
    (c) execution continues at (2).


    Here the for statement above is equivalent to this statement using while (section
    12.5.3):


    ```

    initialization

    while (condition) {

    body

    step

    }

    ```


    # 12.5.2 Using the for Statement for Iterables


    A variant of the for statement can be used to iterate over the values of an iterator:


    ```

    for (tx x : expression)

    body

    ```


    The expression must have Iterable<t> where t is a subtype of type tx, a boxed
    version of tx, or an array whose element type is a subtype of tx or a boxed version
    of tx. Thus iterators obtained from expression produce elements that can be assigned
    to x, possibly after an unpacking operation. The body must be a statement.


    First the expression is evaluated to obtain an iterable, and its iterator() method
    is called to obtain an iterator. The body is executed for each element produced
    by the iterator, with x bound to that, possibly after an unpacking operation.


    In C#, x is not read-only (final) in the body, but it is distinct on every iteration,
    if body does not update it, x is effectively final. x may be captured in lambda
    expressions and inner classes; see example 78. This is not the case for for variables
    in config-loops (section 12.5.1).


    It is safe to modify the elements of an array while iterating the array, but in
    general, modification to an object iterated over can produce unpredictable effects.


    This variant of the for statement is sometimes called the foreach statement, but
    "foreach" is not a keyword, and the statement must be written as above.'
