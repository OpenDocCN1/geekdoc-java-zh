    \ represents immutable lists of T values, with immutable Node<T> objects. Operations\
    \ produce a new list by updating existing ones, so any number of operations on\
    \ the same list could proceed concurrently without synchronization. A new list\
    \ may share nodes with existing ones; list4 share the three nodes built 9, 13,\
    \ and 0. This is harmless because nodes are immutable.\n\nTo reason about immutability,\
    \ the code is simple: insert(i, item, xs) says: If i=0, put item in a new node\
    \ and let this be node xs; otherwise update the first element of xs in a new node,\
    \ and let it be the result of inserting item at position i-1. map(f, xs) says:\
    \ If xs is empty (null), return an empty list; otherwise create a node to hold\
    \ the result of f over the first element of xs, and let it be the result of mapping\
    \ f over xs.\n\n```\nclass FunList<T> {\n    final Node<T> first;\n    protected\
    \ static class Node<U> {\n        public U item;\n        public Node<U> next;\n\
    \        public Node(U item, Node<U> next) { this.item = item; this.next = next;\
    \ }\n    }\n\n    public FunList(T xs) { this.first = xs; }\n    public int count()\
    \ { // ... }\n    public T get(int i) { // return getRecursive(i, first).item;\
    \ }\n    protected static Node<T> getRecursive(int i, Node<T> xs) { // Could use\
    \ loop\n        return i == 0 ? xs : getRecursive(i-1, xs.next); }\n\n    public\
    \ FunList<T> insert(T item, FunList<T> list) { return list.insert(0, item); }\n\
    \    public FunList<T> insert(int i, T item) { // ... */ }\n    protected static\
    \ Node<T> insert(int i, T item, Node<T> xs) {\n        return i == 0 ? new Node(item,\
    \ xs) : new Node(xs.item, insert(i-1, item, xs.next)); }\n\n    public FunList<T>\
    \ removeAt(int i) { return list.removeAt(i, first); }\n    protected static Node<T>\
    \ removeAt(int i, Node<T> xs) {\n        return i == 0 ? xs.next : new Node(xs.item,\
    \ removeAt(i-1, xs.next)); }\n    }\n\n    public FunList<T> reverse() { // ...\
    \ }\n    public FunList<U> map(Function<T, U> f) { return new FunList<U>(map(f,\
    \ first)); }\n    protected static Node<U> map(Function<T, U> f, Node<T> xs) {\n\
    \        return xs == null ? null : new Node(f.apply(xs.item), map(f, xs.next));\
    \ }\n    }\n\n    public U reduce(U x0, BiFunction<U, T, U> op) { // ... }\n```\n\
    \n```\nFunList<Integer> empty = new FunList<Integer>();\nlist1 = cons(9, cons(13,\
    \ cons(empty, empty))); // 9 13 0\nlist2 = cons(7, list1); // 7 9 13 0\nlist3\
    \ = cons(8, list2); // 8 8 9 13 0\nlist4 = list1.insert(1, 12); // 9 12 13 0\n\
    list5 = list2.removeAt(3); // 7 9\nlist6 = list5.reverse(); // 13.9\nlist7 = list1.append(list5);\
    \ // 7 9 13 13 0\nFunList<Double> list8 = list5.map(i -> 2.5 * i); // 17.5 22.5\
    \ 32.5\ndouble sum = list8.reduce(0.0, (res, item) -> res + item); // 72.5\n```"
