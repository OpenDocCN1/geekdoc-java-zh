  md: "# 64 Statements\n\n# 12.7 The Try-with-Resources Statement\n\nA try-with-resources\
    \ statement consists of a number of semicolon-separated initialized variable-declarations\
    \ (section 6.2) followed by a statement block body possibly followed by catch\
    \ clauses and/or a finally clause in section 12.6:\n\n```\ntry (initialized-variable-declarations)\n\
    \    optional catch-finally-clauses\n```\n\nA variable declared in the variable-declarations\
    \ is a resource and is implicitly final. Its type must implement AutoCloseable\
    \ from type java.lang with method void close(). All interfaces (chapter 24) and\
    \ input-output clauses the variable-declarations implement AutoCloseable. The\
    \ try-with-resources statement is executed by evaluating the variable-declarations\
    \ from left to right to initialize, executing the body, then closing resources\
    \ in reverse order of initialization, regardless of whether the body terminates\
    \ after the close() by return, or by throwing an exception. The optional catch-finally-clauses\
    \ are ordered and may handle exceptions thrown during closing.\n\n# 12.8 The assert\
    \ statement\n\nThe assert statement has one of the following:\n\n```\nassert boolean-expression\
    \ ;\nassert boolean-expression : expression ;\n```\n\nThe boolean-expression must\
    \ have type boolean or Object. The type of expression must be boolean, char, double,\
    \ float, int, long; a boxed version of these; or Object.\n\nUnder ordinary execution\
    \ of a program, an assert statement has no effect at all. However, assertions\
    \ may be enabled at run-time by specifying the option -ea or -enableassertions\
    \ when executing program C (chapter 16) as the java -enableassertions command\
    \ line.\n\nWhen assertions are enabled at run-time, every execution of the assert\
    \ statement will evaluate the boolean-expression. If the result is false, the\
    \ assertion fails, and an AssertionError will be thrown; in the second form of\
    \ the assert statement, the expression will be evaluated, and its value will be\
    \ passed to the AssertionError constructor. The value of the expression will be\
    \ reported along with the case of assertion failure. This simplifies troubleshooting\
    \ in a functioning program.\n\nAn AssertionError signals the failure of a fundamental\
    \ assumption in the program and should not be caught by a try-catch but be propagated\
    \ to the top level.\n\nAn assert statement can serve two purposes: to document\
    \ the programmer's assertion about the state at a certain point in the program,\
    \ and to check (at run-time) that the assumption holds (provided the program is\
    \ executing using the enableassertions option).\n\nOne may put an assert after\
    \ a particularly complicated piece of code, to check that it has achieved what\
    \ it was supposed to (example91).\n\nIn a class that has a considered representation,\
    \ one invariant may be asserted at the end of every method that could modify the\
    \ state of the object (example 92).\n\nOne should not use asserts to check the\
    \ validity of user input or the arguments of public methods, because the check\
    \ will be performed only if assertions are enabled at run-time. Instead, use ordinary\
    \ statements and throw an exception in case of error."
