  md: '# 26.6 Printing Primitive Data to a Character Stream: PrintWriter


    The class PrintWriter is used to output primitive data to text files in human-readable
    format. Unlike the methods of other Writers, PrintWriter never throws IOException
    but set the error status. The PrintWriter class has all the methods of Writer
    as well as these constructors and methods:


    +   * PrintWriter(OutputStream os) creates a PrintWriter that prints to IO os,
    without autograph.

    * PrintWriter(OutputStream os, boolean flush) creates a PrintWriter that prints
    stream os; if flush is true, then it flushes the writer after every call to println.

    * PrintWriter(Writer wr) creates a PrintWriter that prints to the wr, without
    autograph.

    * PrintWriter(Writer wr, boolean flush) creates a PrintWriter that prints to the
    wr; if flush is true, then it flushes the writer after every call to println.

    * boolean handleError() flushes the IO stream, then returns true if an error has
    occurred.

    * void print(char c) prints the character c.

    * void print(char[] cs) prints the characters in cs.

    * void print(double d) prints the double d.

    * void print(float f) prints the float f.

    * void print(int i) prints the integer i.

    * void print(long l) prints the long l.

    * void print(Object o) prints the object using o.toString().

    * void print(String s) prints the string s.

    * void println() prints a new line.

    * void println(int e) works like print(e) followed by println().).


    # 26.6.1 Standard Output: System.out and System.err are PrintStreams


    The standard output System.out and System.err system are PrintStreams. PrintStream
    is a subclass of OutputStream but in addition has methods print and println for
    character-based output, as PrintWriter does. These methods convert characters
    to bytes using the default encoding; to use another encoding, write to a PrintWriter
    created by new PrintWriter(new OutputStream(System.out)), as shown in example
    50. Some values for enc are shown in section 26.4. The methods of PrintStream
    never throws IOException but set the error status; use checkError() to test the
    error status.


    # 26.7 The Appendable Interface and the CharSequence Interface


    The java.Appendable interface (implemented by PrintStream, StringBuilder, StringBuffer,
    and the Writer classes) has three methodloads, all of which return a reference
    to the Appendable:


    +   * append(char c) adds c to the appendable.

    * append(CharSequence cseq) adds all characters from cseq to the appendable.

    * append(CharSequence cseq, int i, int j) adds characters i..j-1 from cseq.


    The java.CharSequence interface (implemented by String, StringBuilder, and StringBuffer)
    has methods charAt(int index), length, subSequence(int, int), and toString();
    they behave as String in chapter 7.'
