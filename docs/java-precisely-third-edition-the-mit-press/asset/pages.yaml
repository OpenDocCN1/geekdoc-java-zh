  md: "# 26.1 Creating an IO Stream from Another One\n\nAn IO stream may be created\
    \ either outright (e.g., a FileInputStream may be created and associated with\
    \ a named file on disk, for reading from it) or from an existing IO stream to\
    \ provide additional features (e.g., a BufferedInputStream created from a FileInputStream,\
    \ for more efficient). In any case, an input stream or reader has an underlying\
    \ source of data to read from, and an output stream or writer has an underlying\
    \ source of data to write to. The following figures show how IO streams can be\
    \ defined in terms of existing IO streams, or in terms of other data.\n\nThe IO\
    \ classes are divided along lines: character streams (top) versus byte streams\
    \ (right). The arrows show how IO streams can be created from other streams. For\
    \ instance, the arrow from InputStream to InputStreamReader shows that one can\
    \ create a BufferedReader from Reader to BufferedReader. Since InputStreamReader\
    \ is a Reader, one can create a BufferedReader from an existing InputStream (such\
    \ as System.in) in two steps, as shown in example 189. On the other hand, there\
    \ is no way to create a PipedOutputStream from a File or a name; PipedOutputStream\
    \ must be created outright, from an existing PipedInputStream, and similarly for\
    \ other pipes (26.16).\n\n# Example 189 A Complete Input-Output Example\n\n```\n\
    import java.io.*;\nclass BasicIOExample {\n    public static void main(String[]\
    \ args) throws Exception {\n        BufferedReader r = new BufferedReader(new\
    \ InputStreamReader(System.in));\n        int count = 0;\n        String s = r.readLine();\n\
    \        while (s != null && !s.equals(\"exit\")) {\n            count++;\n  \
    \          s = r.readLine();\n        }\n        System.out.println(\"You entered\
    \ \" + count + \" nonempty lines\");\n    }\n}\n```"
