  md: '54 Statements


    # 12.4 Choice Statements


    # 12.4.1 The if Statement


    An if statement has the form


    ```

    if (condition)

    truebranch

    ```


    The condition must have type boolean or Boolean, and truebranch is a statement.
    If condition evaluates to true, then truebranch is executed, otherwise not.


    # 12.4.2 The if-else Statement


    An if-else statement has the form:


    ```

    if (condition)

    truebranch

    else

    falsebranch

    ```


    The condition must have type boolean or Boolean, and truebranch and falsebranch
    are statements. If condition evaluates to true, then truebranch is executed; otherwise
    falsebranch is executed.


    The if-else statement is illustrated by examples 71 and 72 on the preceding page.


    # 12.4.3 The switch Statement


    A switch statement has the form


    ```

    switch (expression) {

    case constant1: branch1

    case constant2: branch2

    deault: branch

    }

    ```


    The type of expression must be int, short, char, byte, or a boxed version of these,
    or an enum type (type 14) or String. Each constant must be a compile-time constant
    expression, consisting only of literals, final variables, final fields declared
    with explicit initializers, or it must be an unqualified value expression. All
    constants must be distinct. Each constant must be a subtype of the expression
    type.


    Each branch is preceded by one or more case clauses and is a possibly empty sequence
    of statements, usually terminated by break or return (if inside a method or constructor)
    or continue (a loop). There can be at most one default clause, placed anywhere
    inside the switch, not necessarily last.


    The switch statement is executed as follows: the expression is evaluated to obtain
    a value v. If v not equal any of the constants, then the branch following default
    is executed; if there is no default clause, nothing is executed. If a branch is
    not exited by break, return, or continue, then execution continues with the next
    branch in the switch regardless of the case clauses, unless a branch exits or
    the switch ends.'
