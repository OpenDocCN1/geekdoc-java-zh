  md: '# Functional Interfaces (Java 8.0)


    Java supports functional programming through functional interfaces (section 23.2),
    lambda expressions (section 11.13), and method reference expressions (section
    11.14).


    # 23.1 Functional Programming


    Functional programming has many uses, especially in connection with streams (chapter
    24) and parallel processing of arrays (section 8.4). It goes back to Lisp (1960),
    and most recent functional languages like ML, Scheme, OCaml, Haskell, F#, and
    Scala. Some characteristics of functional programming are as follows:


    +   - Functional programming uses immutable data structures (in which all fields
    are final and refer to immutable data) objects with mutable state. In example
    154, the list.insert(1, 12) produces a new list instead of updating list. This
    may seem to cause excessive allocation of data, but less than one might think
    that immutability prevents sharing between new and old data. A major advantage
    is that immutable data structures are automatically thread-safe and require no
    synchronization when used from multiple threads.


    +   - Functional programming performs iteration using (recursive) function calls
    instead of for loops, while loops. This would lead to deep method calls if the
    implementations do not optimize tail calls, that is, called as the last action
    of the function calling. The Java implementation does not optimize tail calls,
    so it is better to use loops instead of recursion. In example 154, method getNode
    replaced by a loop.


    +   - Functional programming uses higher-order functions, that is, functions that
    take as parameters of function type or return results of function type. In the
    former case, the higher-type argument may embody a behavioral search to be taken
    on each data element. Data structure traversal. Higher-order function in example
    154 takes a function g and applies it to every list. Higher-order function less
    in example 158 returns a function that can convert numbers less limit*limit into
    English numbers.


    +   - Some functional programming languages (including ML, Haskell, F#, and Scala)
    use pattern matching to make choices, instead of if and switch statements; these
    achieve great clarity and safety guaranteed against cases. Java does not use pattern
    matching.


    Many operations on streams (chapter 24) and parallel operations on arrays (section
    8.4) require their arguments to be side-effect free for the sense. A function
    is side-effect free, or pure, if it does not modify or rely on any mutable state;
    in particular, two calls f.apply(v1) and f.apply(v2) where v1 and v2 are equal
    values produce the same result. But note that in an object-oriented setting, when
    "equal values" and "same result" really means, object fields are mutable by default,
    and it is not obvious what "equal values" and "same result" really means, and
    parallel programming must rely on care and.


    Some operations, as reduce on streams and parallelPrefix on arrays, require their
    BinaryOperators to be associative. A binary operator is associative if for arguments
    x, y, and z, it holds that op.apply(x,y),z equals op.apply(x,y,z). Writing op.apply(x,y)
    using infix notation as x⊕y means that (x⊕y)z must equal x⊕(y⊕z). Typical associative
    operators are addition (+) and multiplication (*), max, min, string concatenation,
    logical conjunction (&&) and disjunction (||), bitwise and (&), bitwise or (|),
    bitwise xor (^), union, and set intersection. Non-associative operators use division
    (/) and subtraction (-), and at some level,'
