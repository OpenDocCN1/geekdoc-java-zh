    \ 9.8).\n\nWhen creating a new object in method (section 11.7), the object's non-static\
    \ fields are given initial values according to their type. A constructor is called\
    \ to further initialize the object, and the following happens: first, some superclass\
    \ constructor is called (explicitly or implicitly), see examples 40 and 63 exactly\
    \ once; then the non-static field initializers and non-static initializer blocks\
