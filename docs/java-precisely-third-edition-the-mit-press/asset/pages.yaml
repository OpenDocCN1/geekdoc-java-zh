  md: '# 24.6 Collectors on Streams


    In some cases, it is difficult to make the functional stream reduce operations
    efficient enough. This holds, for instance, massive concatenation (where repeated
    use of s1+s2 has quadratic execution time); for collecting a list, or from a stream;
    for various grouping and binding operations. In cases, mutable reduction operation
    using a so-called collector may be more efficient. However, functional reductions
    should be preferred where possible, because the mutable reductions are easier
    to get wrong and can seem much less speed-up (or even slower-down) on parallel
    than the functional ones.


    A collector coltor is an interface of Collector<T,A,R> that can process a stream
    of Stream<T>, using an internal accumulator of T, and producing a result of R.


    Stream method xs.collect(coltor) applies the collector to the stream xs, performing
    the mutable operation and returning a result of type R. Utility Collectors in
    package java.util.stream defines many collectors, listed below.


    Stream method xs.collect(Supplier<R> supp, BiConsumer<R,T> acc, BiConsumer<R,R>
    cm) supports mutable reduction operations, producing a final result of type R.
    Function supp() generates a result container; accumulator(rc, x) is called to
    process element x and add to result container rc; and function comb(rc1,rc2) is
    called to combine the state of result rc2 into rc1; see examples 179, 180, and
    186.


    Some advanced features of collectors are not described here; see the Java class
    documentation.


    Below we list the static methods in Collectors that often use collectors. For
    readability we have simplified the wildcard types in the signatures, as described
    in 23.4. We use the parameter names color for collector, fin for finisher, rc
    for result container, cons for consumer, and cfier for classifier.


    +   * Collector<T,Double> averaging(ToDouble<T>) computes the arithmetic mean,
    or average of all; similarly named methods for Int and Long.

    * Collector<T,AR> collectingAnd(Collector<T,A,R> coltor, Function<R,RR> fin) collects
    by collector and then finishes fin to the result container.

    * Collector<T,Long> counting() counts the number of elements.

    * Collector<T,Map<K,List<T>>> groupingBy(Function<T,K> cfier) groups elements
    into lists by the value of key cfier.apply(xi).

    * Collector<T,Map<K,D>> groupingBy(Function<T,K> cfier, Collector<? super T,A,D>
    coltor) groups elements into lists by the value of key cfier.apply(xi), which
    performs reduction operation on each value associated with each key.


    There is also an overload with an additional argument of type Supplier<Map<K,D>>
    to produce the map used. There are concurrent versions of these methods also,
    named groupingBy(ConcurrentMap.


    Two partitioning methods work like the above but take a Predicate<T> instead of
    a Function<T,K> and produce a map whose only keys are true and false.'
