  md: '# 120 Generic Collections and Maps


    # 22.12 Choosing the Right Collection Class or Map Class


    The proper choice of a collection or map class depends on the operations you need
    to perform on, and how frequent those operations are. There is no universal choice.


    +   - LinkedList (section 22.2) and ArrayList (section 22.2 and example 137) should
    be used for collecting elements for sequential iteration in index order, allowing
    duplicates.

    - HashSet (section 22.3 and example 134) and HashMap (section 22.5 and example
    137) are good defaults when random access by element or key is needed, and sequential
    access in element or key order is not needed. LinkedHashSet (example 135) and
    LinkedHashMap guarantee sequential access (using their iterators) in element or
    key insertion order.

    - TreeSet (section 22.4 and examples 136 and 139) or TreeMap (section 22.6 and
    example 139) should be used for random access by element or key as well as for
    iteration in element or key order.

    - LinkedList, not ArrayList, be used for worklist algorithms (example 152), queues,
    double-ended queues, and stacks.

    - ArrayList, not LinkedList, should be used for random get(i) or set(i, o) by
    index.

    - HashSet or HashMap should be used for sets or maps whose elements or keys are
    collections, because the collection implement useful hashcode methods (example
    153).

    - For maps whose keys are small non-negative integers, use ordinary arrays (chapter
    8).


    The running time, or complexity, of an operation on a collection is usually given
    in O notation, as a function of the size n of the collection. Thus O(1) means
    constant time, O(log n) means logarithmic time (time proportional to the logarithm
    of n), and O(n) means linear time (time proportional to n). For accessing, adding,
    or removing an element, these roughly correspond to very, fast, and slow.


    In the following table, n is the number of elements in the collection, i is an
    integer index, and d is the distance from an index to the nearest end of all,
    that is min(i, n-i). Thus adding or removing an element of a LinkedList is fast
    near both ends of the list, where d is small. The subscript indicates amortized
    complexity: for a long sequence of operations, the average time per operation
    is O(1), although any single operation could take O(n).


    | Operation | LinkedList | ArrayList | HashSet | HashMap | TreeMap |

    |---|---|---|---|---||

    | add (last) | O(1) | O(1)a | | | |

    | add(i,o) | O(d) | O(n-i)a | O(log n) | | |

    | addFirst() | O(1) | | | | |

    | put(k,v) | | | | O(1)a | O(log n) |

    | remove(o) | O(n) | O(n) | O(log n) | O(1) | O(log n) |

    | remove(i) | O(d) | O(n-i) | | O(1) | |

    | removeFirst() | O(1) | | | | | |

    | contains(o) | O(n) | O(n) | O(log n) | O(1) | O(log n) |

    | containsKey(o) | | | O(n) | O(n) | O(n) |

    | containsValue(o) | O(n) | O(n) | | | |

    | get(i) | O(d) | O(1) | O(1) | | |

    | set(i,o) | O(d) | O(1) | | | |

    | get(o) | | | | O(log n) | |'
