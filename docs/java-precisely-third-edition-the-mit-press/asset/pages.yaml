    \ is used here to indicate that methods m1 and m2 must override methods inherited\
    \ from a superclass or an implemented interface. This is checked by the compiler\n\
    \n```\nstatic class B { public void m1() { }\ninterface I { void m2(); }\nstatic\
    \ class C extends B implements I {\n    @Override\n    public void m1() { System.out.println(\"\
    m1\"); }\n\n    @Override\n    public void m2() { System.out.println(\"m2\");\
    \ }\n\n    // Would cause compiler error because no method m3() to override\n\
    \    public void m3() { System.out.println(\"m3\"); }\n}\n```\n\n# Example 214\
    \ Standard Annotation @FunctionalInterface\n\nThe @FunctionalInterface annotation\
    \ says that CharPredicate must have exactly one abstract method (and any number\
    \ of default and static methods). Otherwise a compile-time error is produced.\n\
    \n```\n@FunctionalInterface\ninterface CharPredicate {\n    public abstract boolean\
    \ test(char c);\n    public default CharPredicate and(CharPredicate p) {\n   \
    \     return c -> test(c) && p.test(c);\n    }\n}\n```\n\n# Example 215 Standard\
    \ Annotations @SuppressWarnings and @Varargs\n\nDue to generics, one cannot create\
    \ an array whose element type generic instances or parameters; see section 21.11\
    \ and 132. One may create an array of the raw type and cast it, but this is unsafe\
    \ and will produce a compile-time warning. The @SuppressWarnings annotation suppresses\
    \ this warning.\n\nA parameter array as Consumer<T>... provides a way to surprisingly\
    \ create an array (at the point where the method is called) whose element type\
    \ generic instances or type parameters. The @Varargs suppresses the compile-time\
    \ warnings that would be produced at the method declaration and calls to the methods.\n\
    \n```\n@SuppressWarnings(\"unchecked\")\nprivate static Consumer<T>[] makeConsumerArray(int\
    \ size) {\n    return (Consumer<T>[]) new Consumer[size];\n}\n@Varargs\npublic\
    \ static final <T> void callAll(T x, Consumer<T>... consumers) {\n    for (Consumer<T>\
    \ cons : consumers) {\n        if (cons != null)\n            cons.accept(x);\n\
    \    }\n}\n```"
