  md: "# Example 131 Implementation by Type Erasure\n\nThe type erasure of example\
    \ 123 is shown below. In other words, the JVM generated from that example is identical\
    \ to that generated from the Java code below.\n\n```\nclass Hold {\n    private\
    \ Object contents;\n    public void set(Object x) { contents = x; } // Note: no\
    \ cast\n    public Object get() { return contents; }\n}\n\nHold h = new Hold();\n\
    h.set(\"foo\"); // Succeeds at run-time\nh.get(); // Succeeds at run-time\nInteger\
    \ i = (Integer)h.get(); // Legal, fails at run-time\n```\n\n# Example 132 Java\
    \ Generics: Cannot Create Array with Generic Element Type\n\nIn declarations of\
    \ fields, variables, parameters, and return types, one can freely use arrays whose\
    \ element types are parameters such as <T>, or instances as <CT> or <Integer>.\
    \ However, cannot create (using new) array whose element is a type parameter or\
    \ any of constructed type.\n\nThis is because Java (and C#) cannot assign array\
    \ s[] to be a subtype of t[] whenever s and t are reference types and s is a subtype\
    \ of t. This is safe only if every array assignment arr[i] = e, it is checked\
    \ that the run-type of e is a subtype of the actual element of arr (section 8.1).\
    \ This requires a representation of the element to exist at run time. Since generics\
    \ are implemented by type erasure, there exists no representation of the types\
    \ <T> or <Integer> at run-time, so this information cannot be associated with\
    \ any array type as [T]; and therefore the array element check cannot be performed\
    \ accurately. The creation of arrays is rejected by the compiler.\n\nBy contrast,\
    \ the ArrayList<s> is not a subtype of ArrayList<t> when s is a subtype of t.\
    \ Hence no check is needed at run-time when storing objects in the array, and\
    \ there is no need for a run-time representation of the array's element type.\n\
    \n```\nclass F<T> {\n    public void M() {\n        T[] tarr; // Legal declaration\n\
    \        G<T> ctarr; // Legal declaration\n        G<Integer> ciarr; // Legal\
    \ declaration\n        tarr = new T[5]; //\n        ctarr = new G<T>[5]; // Illegal\
    \ generic array creation\n        ciarr = new G<Integer>[5]; // Illegal generic\
    \ array creation\n\n        ArrayList<T> tlist; // Legal declaration\n       \
    \ ArrayList<T> clist; // Legal declaration\n        ArrayList<G<Integer>> clist;\
    \ // Legal declaration\n        tlist = new ArrayList<T>(); // Illegal array list\
    \ creation\n        ctlist = new ArrayList<G<T>>(); // Illegal array list creation\n\
    \        clist = new ArrayList<G<Integer>>(); // Illegal array list creation\n\
    \    }\n}\n```"
