  md: "# Interfaces\n\n# 13 Interfaces\n\n# 13.1 Interface Declarations\n\nAn interface\
    \ describes fields and methods but not implement them. An interface-declaration\
    \ may contain field descriptions, method descriptions, class declarations, and\
    \ interface declarations, in any order.\n\n```\naccess-modifiers interface I extends-clause\
    \ {\n  field-descriptions\n  method-descriptions\n  method-declarations\n  class-declarations\n\
    \  interface-declarations\n}\n```\n\nAn interface may be declared at top level\
    \ or inside a class or interface but not inside a method, constructor, or initializer.\
    \ At top level, the interface-modifiers may be public or abstract. A public interface\
    \ is accessible outside its package. Inside a class or interface, the interface-modifiers\
    \ may be static (always implicitly understood) and at most one of public, protected,\
    \ or private. Generic parameters and generic; see section 21.7.\n\nThe extends-class\
    \ may be absent or have the form I1, I2..., where I1, I2... is a non-empty list\
    \ of interfaces. If the extends-class is present, then I describes all members\
    \ described by I1, I2..., and I is a subinterface (hence subtype) of I1, I2...\
    \ Interface I can describe additional fields and methods but cannot override inherited\
    \ methods.\n\nA field-description in an interface declares a named constant and\
    \ must have the\n\n```\nfield-modifiers type f = initializer;\n```\n\nwhere field-description\
    \ is a list of static, final, and public, none of which needs to be explicit,\
    \ as all are implicitly understood. The field initializer must be an expression\
    \ involving only literals, operators, and static members of classes and interfaces.\n\
    \nA method-description for method must have the\n\n```\nmethod-modifiers return-type\
    \ m(formal-list) throws-clause;\n```\n\nwhere method-description is a list of\
    \ abstract and public, none of which needs to be given explicitly. A method-declaration\
    \ (section 9.8) must have modifier default or static; see section 13.3. A class-declaration\
    \ inside an interface is always implicitly static and public.\n\n# 13.2 Classes\
    \ Implementing Interfaces\n\nA class may be declared to implement one or more\
    \ interfaces by an implements-clause:\n\n```\nclass C implements I1, I2,\n  body\n\
    ```\n\nIn this case, C is a subtype (5.5) of I1, I2, and so on, and C must declare\
    \ all the methods described by I1, I2... with the prescribed signatures and return\
    \ types. A class may implement any number of interfaces. Fields, classes, and\
    \ interfaces declared in I1, I2... can be used in class C."
