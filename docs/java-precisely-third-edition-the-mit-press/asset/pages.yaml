    # 20.2 Locks and the synchronized Statement


    Concurrent threads are executed independently. Therefore, when multiple concurrent
    threads access the same fields or array elements, there is considerable risk of
    creating an inconsistent state (example 110). To avoid this, threads may synchronize
    the access to shared state, such as objects and arrays. A single lock is associated
    with every object, array, and class. A lock can be held by at most one thread
    at a time. A thread may explicitly request the lock on an object or array by executing
    a synchronized statement, which has this form


    ```

    synchronized (expression)

    block-statement

    ```


    The expression must reference type. The expression must evaluate to a non-null
    reference o; otherwise a NullPointerException is thrown. After the evaluation
    of the expression, the thread becomes Locking on object o (if ever), the thread
    becomes Running so may continue that the block-statement is executed. When the
    block-statement terminates or is exited by return, break, or continue, or by throwing
    an exception, the lock on o is released.


    A synchronized non-static method declaration (example 9.8) is shorthand for a
    method whose body has


    ```

    synchronized (this)

    method-body

    ```


    That is, the thread will execute the method only when it has obtained the lock
    on the current object. It will release the lock when it leaves the method body.


    A synchronized static method declaration (example 9.8) in class C is shorthand
    for a method whose body has


    ```

    synchronized (C.class)

    method-body

    ```


    That is, the thread will execute the method only when it has obtained the lock
    on the object C.class, which is the unique object of class Class associated with
    class C; see section 27.1. It will hold the lock until it leaves the method and
    release it at that time.


    Constructors and initializers cannot be synchronized.


    Mutual exclusion is ensured only if threads accessing a shared object lock before
    use. For instance, if we use an synchronized method transfer to a bank object
    (example 110), we can no longer be sure that a thread calling the synchronized
    method transfer has exclusive access to the bank object; any number of threads
    could be executing transfer at the same time.


    A monitor is an object whose fields are private and only synchronized by synchronized
    methods of the monitor, so that all access is subject to synchronization (example
    111).


    If a thread waits for a condition to become true, or for a resource to become
    available, it may temporarily release the lock on the object it holds; otherwise
    IllegalMonitorStateException is thrown. The thread will wait to be added to the
    wait set, o the set of threads waiting on object o. This notification must come
    from another thread that has obtained the lock on o and executes o.notify() or
    o.notifyAll(). The notifying thread does not release the lock on o. After being
    notified, u must obtain the lock on o again before it can proceed. When the call
    to wait returns, u will hold the lock on o just before the call (example 111).


    For detailed rules governing the behavior of unsynchronized Java threads, see
    section 17 of Java Language Specification [3].


    Specification'
