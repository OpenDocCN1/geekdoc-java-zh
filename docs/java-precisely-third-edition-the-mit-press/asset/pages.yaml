  md: '152 Input and Output


    # 26.4 Sequential Character Input: Readers


    The abstract Reader and its subclasses (all names having ending in Reader) are
    used for character-oriented sequential input. In addition to the classes shown
    here, there is BufferedReader (section 26.13) and LineNumber-Reader (example 195).
    The Reader class has the following methods:


    +   - void close() flushes the IO stream and underlying IO stream. Any subsequent
    operation, except close, will throw IOException.


    +   - void mark(int limit) marks the current input position, permitting at least
    limit to be read before calling reset.


    +   - int read() reads one character (with code 0..65535) and returns it. Blocks
    if input is unavailable, end-of-stream is reached (and returns -1), or an error
    occurs (and then throws IOException).


    +   - int read(char b[], int len) reads b.length characters into b and returns
    the number of characters read. Blocks until at least one character is available
    unless len is 0. Returns -1 on end-of-stream.


    +   - boolean ready() returns true if the next read or skip will block.


    +   - void reset() sets the IO stream to the position of the last call to mark.


    +   - skip(int n) skips at most n characters and returns the number of characters
    skipped; returns 0 on end-of-stream.


    # 26.4.1 Reading from a Byte Stream: InputStreamReader Character Encoding


    InputStreamReader is a reader (a character input stream) that reads from a byte
    stream, assembling bytes into characters using a character encoding. It buffers
    input from the underlying IO stream. InputStreamReader has the same methods as
    a Reader (section 26.4), and also these constructors:


    +   - InputStreamReader(InputStream is) creates an InputStreamReader from is,
    using the platform''s standard character encoding to convert bytes to characters.


    +   - InputStreamReader(InputStream is, String enc) creates an InputStreamReader
    that uses character encoding, for instance "US-ASCII" or "ISO-8859-1" or "UTF-16"
    or "UTF-16BE" (big-endian 16-bit) or "UTF-16LE" (little-endian 16-bit) or "Cp1252"
    (MS Windows).


    +   - String getEncoding() returns the canonical name of the character encoding
    used by this reader.


    # 26.4. Sequential Character Input from a File: FileReader


    A FileReader is a buffered input stream associated with a (sequential) file and
    equivalent to an InputStreamReader created from a FileInputStream. It has the
    same methods as InputStreamReader, as well as these constructors:


    +   - FileReader(String name) creates a character input associated with the named
    file. FileNotFoundException if the file does not exist, is a directory, or cannot
    be opened for other reasons.


    +   - FileReader(File file) creates a character input stream from the file system.


    +   - FileReader(Descriptor fd) creates a character input stream from the file
    descriptor.'
