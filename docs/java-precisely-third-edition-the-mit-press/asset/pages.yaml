  md: '# 24 Streams for Bulk Data (Java 8.0)


    A stream represents a number of data elements, or bulk data, though usually not
    explicitly stored in the manner of an array or collection. A stream is typically
    processed by a pipeline, built from a stream generator, several intermediate operations,
    and a single terminal operation produces a stream. A intermediate operation consumes
    a stream, and a terminal operation only consumes a stream. This approach supports
    mostly functional data processing and in particular parallel computation in a
    safe and easy manner.


    A stream is often lazily generated and lazily processed, and the processing of
    stream elements are driven by the terminal operation''s pull (demand) at the end
    of the pipeline rather than the stream generator''s push at the beginning of the
    pipeline. So only a small fraction of the stream''s elements are actually stored
    in memory at any given time. In fact, a lazily created stream may be infinite,
    although some operations as `count(i)` would never terminate on a stream. Moreover,
    some intermediate operations such as consecutive map transformations, may be fused,
    so that intermediate results are never stored at all. This makes functional pipelines
    very fast, faster than the "obvious best" imperative code; see example 167.


    For instance, it seems that `xs.map(f).map(g)` will perform two traversals of
    the stream, transforming the elements by `f` and then by `g`, which can be hidden
    behind the scenes by a single traversal `xs.map(f).andThen(g)` applying the composition
    of `f` and `g`; see example 156.


    A stream may be `sequential or parallel`. On a sequential stream, intermediate
    and terminal operations will be performed sequentially, on a single thread. On
    a parallel stream, intermediate and terminal operations may be performed on multiple
    threads.


    A stream may be ordered or unordered. For an ordered stream, intermediate operations
    such as `filter(f)` and `map(f)` respect the element order and produce a stream
    with elements in the expected order, even if the stream is parallel. For an unordered
    stream, there is no guarantee that, some parallel intermediate operations will
    be more efficient than unordered.


    Also note that on a parallel stream, even an ordered one, there is no guarantee
    in which the functions `f` and `g` are applied to the stream''s elements: the
    only guarantee is that the resulting''s elements appear in the expected order.


    For example, `IntStream.range(0,5).map(x -> x*2).toArray()` is guaranteed to be
    an array containing the elements `{0, 2, 4, 6, 8}`, but the function `(x -> x*2)`
    may be applied to element 3 before element 0, or at vice versa.


    Regardless whether the stream is ordered or unordered, the terminal operation
    `forEach` does not respect the element order for parallel.


    Since operations on a parallel stream may be evaluated on multiple threads and
    in an unpredictable order, the functions passed to stream should be stateless:
    they must not depend on any state that may change during the pipeline computation,
    not even state in the terminal. Example 172 uses a function that is stateless
    and does not work on parallel streams.


    A stream''s elements can be consumed only once; trying to use a stream twice will
    throwStateException. In this respect Java streams are very different from Haskell''s
    lazy lists, for instance.


    When a stream is created from a source such as an array, collection, or file,
    that source must not be modified while the stream is being used; otherwise the
    results are unpredictable, and functions passed to stream operations should be
    non-interfering; they must not modify the source''s'
