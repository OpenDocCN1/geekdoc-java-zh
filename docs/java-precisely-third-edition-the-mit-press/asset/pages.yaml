  md: '# Generic Types and Methods


    # 21.5 Constraints on Type Parameters


    A type parameter of a generic class C<T1,..., Tn> may have type parameter constraints.
    The constraints on a type parameter are given in-line in the type parameter list
    by a constraint-clause of this form:


    ```

    Ti extends C1 & C2 & ... Cn

    ```


    In the constraint clause, Ti is one of the type parameters T1,...,Tn, each cj
    is a constraint on Ti, and n ≥ 1. A constraint c must be a type expression: a
    non-final class, or one of the type parameters Ti where 1 ≤ j ≤ i-1.


    The expression may be a type instance and may involve any of the type parameters
    T1,...,Tn. An array type cannot be used as a constraint.


    Only the first constraint cj can be a class type or type parameter Tj; the following
    constraints must be interfaces. If the first constraint is a type parameter Tj,
    then it must be the only constraint.


    Forward references to parameters are permitted in a generic type instance such
    as Generic<D2>, in class C<T1 extends D2, T2 {...}> but they are not permitted
    when the constraint is a naked type parameter such as T2, as in class C<T1 extends
    T2 {...}> This ensures there can be no cyclic constraints.


    The Ti,...,tn used when creating a generic type instance C<t1,...,tn> must satisfy
    the constraints: if type parameter Ti is replaced by type constraint-clause, where
    the resulting constraint is Ti extends c1 & c2 & ... cn, it must hold that Ti
    is a subtype of c1 and of c2 and so up to cn.


    # 21.6 How Can Type Parameters Be Used?


    Within the body { } of a generic class C<T1,...,Tn> { } or generic interface,
    a type parameter Ti may be used as if it were a public type.


    +   * One can use type parameter Ti as a type argument in the supertype and in
    the implemented interfaces of the generic class or generic interface (but Ti cannot
    be used as superclass or implemented interface).

    * One can use type parameter Ti in the return type, variable types, type parameters,
    and throws clauses of non-static methods and their local inner classes, as well
    as in the type and initializer of non-static fields and non-static constructors.
    In these contexts, Ti can be used in type instances C1<...,Ti,...>

    * One can use type parameter Ti for some purposes in non-static member classes,
    but not in static members or in member interfaces.

    * One can use (Ti) for type casts, but such cases are reported by the compiler
    to be unchecked. This is due to Java''s implementation of generic types; see 21.11
    and examples 123 and 131.

    * One cannot new Ti[10] to create a new array element type is Ti (example 132);
    one cannot (instanceof Ti) to test whether o is an instance of Ti; one cannot
    use.class to obtain the canonical object representing the type Ti; one cannot
    new Ti() to create an instance of Ti; and one cannot call static methods on a
    type parameter Ti, as in Ti.m(); or otherwise refer to the static members of a
    type parameter. Again, this is due to Java''s implementation of generic types;
    see section 21.11.'
