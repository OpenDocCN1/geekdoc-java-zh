  md: "# Example 124 A Generic List Interface\n\nThe generic interface List<T> extends\
    \ the Iterable<T> interface (section 22.7) with methods to add and remove elements,\
    \ methods to get and set the element at a particular position, and a generic method\
    \ (section 21.8) called `<U>` that takes an argument of type Mapper<T,U> (example\
    \ 125) and builds a type of List<U>. Note that the generic <U> has an additional\
    \ parameter U.\n\n```\ninterface List<T> extends Iterable<T> {\n    int getCount();\
    \ // Number of elements\n    T get(int i); // Get element at index i\n    void\
    \ set(int i, T item); // Set element at index i\n    void add(T item); // Add\
    \ element at end\n    void insert(int i, T item); // Insert element at index i\n\
    \    T removeAt(int i); // Remove element at index i\n    <U> List<U> map(Mapper<T,U>\
    \ f); // Map f over all elements\n}\n\n```\n\n# Example 125 A Generic Interface\
    \ Representing a Function\n\nThe generic interface Mapper<A,R> describes a method\
    \ call that takes an argument of type A and returns a type of R. In other words,\
    \ Mapper<A,R> is the type of functions from type A to R, and objects of type Mapper<A,R>\
    \ can be used where one defines in C# or functions in functional languages. Starting\
    \ with Java 8.0, such single-method functional interfaces are part of the class\
    \ library (chapter 23), and one may use Function<A,R> (section 23.5) instead of\
    \ Mapper<A,R>. This generic interface is used in examples 124 and 129.\n\n```\n\
    interface Mapper<A,R> {\n    R call(A x);\n}\n\n```\n\n# Example 126 Subtype Relations\
    \ between Generic Classes and Interfaces\n\nLabelPoint<L> is a point with a label\
    \ of L; such a point is Movable. A ColorPoint<L,C> is a LabelPoint<L> that additionally\
    \ has a \"color\" of type C. Hence the instance LabelPoint<String> is a subtype\
    \ of Movable, and both ColorLabelPoint<String,Integer> and ColorLabelPoint<String,Color>\
    \ are subtypes of LabelPoint<String> and Movable.\n\n```\ninterface Movable {\n\
    \    void move(int dx, int dy);\n}\nclass LabelPoint<L> implements Movable {\n\
    \    protected int x, y;\n    private L lab;\n    public LabelPoint(int x, int\
    \ y, L lab) { this.x = x; this.y = y; this.lab = lab; }\n    public void move(int\
    \ dx, int dy) { x += dx; y += dy; }\n}\nclass ColorLabelPoint<L,C> extends LabelPoint<L>\
    \ {\n    private C c;\n    public ColorLabelPoint(int x, int y, L lab, C c) {\
    \ super(x, y, lab); this.c = c; }\n}\n\n```"
