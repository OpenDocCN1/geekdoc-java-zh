  md: '# 22.8 Interface List<T>


    The List<T> interface from package java.util extends interface Iterator<T> and
    permits insertion, update, and bidirectional traversal of an underlying list:


    +   - add(T o) inserts just before the cursor, or between the elements that would
    be returned by calls to previous and next. If at the head or end of the list,
    it inserts the element before the head or after the tail. A subsequent call to
    previous will return the new element.

    - boolean hasPrevious() returns true if a call to previous() would return an element.

    - int nextIndex() returns the index of the element that was returned by a call
    to next.

    - T previous() returns the element after the cursor (if any) and moves the cursor
    one closer to the head of the list. Throws NoSuchElementException if the cursor
    cannot be moved.

    - int previousIndex() returns the index of the element that would be returned
    by a call to previous.


    # 22.9 Equality, Hash Codes, and Comparison


    The elements of a collection must have a sensible method. If the elements have
    a sensible hashCode, they can be used as HashSet or HashMap keys. If they have
    a compareTo method described by the java.lang.Comparable interface, they can be
    used as TreeSet or TreeMap keys. All classes have default implementations of the
    equals and hashCode methods, inherited from Class Object. Most classes should
    override these to provide sensible notions of equality and hashCode. If a class
    overrides either method, it should override the other one, satisfying the requirements
    below. The primitive type wrapper classes (section 5.4) and the String class have
    sensible equals, hashCode, and compareTo methods, which can be used as elements
    of collection and keys in maps.


    +   - equals(Object o) determines the equality of two objects. It is used by ArrayList,
    LinkedList, HashSet, and HashMap. It should satisfy o.equals(o); not o.equals(null);
    if o.equals(o2), then o2.equals(o1); and if o1.equals(o2) and o2.equals(o3), then
    non-null o1, o2, and o3.

    - int hashCode() returns the hash code of an object. It is used by HashSet and
    HashMap. It should satisfy that if o1.equals(o2), then o1.hashCode()==o2.hashCode().


    The generic interface Comparable<T> from package java.lang describes a method:


    +   - int compareTo(T o) performs a three-way comparison of two objects: o1.compareTo(o2)
    is negative if o is less than o2, zero if o and o2 are equal, and positive if
    ol is greater than o2.

    -It is called the natural ordering of elements and is, for instance, by TreeSet
    and TreeMap unless a Comparator was given when the set or map was created. It
    should satisfy that o1.compareTo(o2)==0 whenever o1.equals(o2).'
