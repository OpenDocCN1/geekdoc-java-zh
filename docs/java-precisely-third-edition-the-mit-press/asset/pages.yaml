  md: 'Variables, Parameters, Fields, and Scope


    # 6 Variables, Parameters, Fields, and Scope


    A variable is declared inside a method, constructor, initializer block, or block
    statement (section 12.2). The variable can be used only in that statement (or
    method or constructor or initializer block), and only after its declaration.


    A parameter is a special kind of variable: it is declared in the parameter list
    of a method or constructor, and is given a value when the method or constructor
    is called. The parameter can be used only in that method or constructor.


    A field is declared inside a class, but not inside a method or constructor or
    initializer block of the class. It can be used anywhere in the class, except before
    its declaration.


    # 6.1 Bounds to Variables, Parameters, and Fields


    A variable, parameter, or field of primitive type holds a value of that type,
    such as the boolean false, integer 17, or the floating-point number 1.7. A variable,
    parameter, or field of reference type t has the special value null or holds a
    reference to an object or array. If it is an object, the run-time class of that
    object must be t or a subclass of t.


    # 6.2 Variable Declarations


    The purpose of a variable is to hold a value during the execution of a block statement
    (or method or constructor block). A variable-declaration has one of the forms


    ```

    variable-modifier type name1, name2, ... ;

    variable-modifier type name1 = initializer1, ... ;

    ```


    A variable may be final or absent. If a variable is declared final, then it must
    be initialized or assigned at most once at run-time (exactly once if it is used):
    it is a named constant. If the variable has reference type, the object or array
    points to may be modified by the variable. A variable initializer may be an array
    initializer (section 8.2).


    Execution of the variable declaration will reserve space for the variable, evaluate
    the initializer, if any, and store the resulting value in the variable. Unlike
    a field, a variable is not given a default value when declared, but the compiler
    checks that it has given a value before it is used.


    # 6.3 Scope of Variables, Parameters, and Fields


    The scope of a name is the part of the program where the name is visible. The
    scope of a variable extends from just after its declaration to the end of the
    innermost enclosing block statement. The scope of a method or constructor is the
    entire method or constructor body. For a control variable x declared in a for
    statement


    ```

    for (int x = ...; ...; ...) body

    ```


    the scope is the for statement, including the header and the body. However, within
    the scope of a variable or parameter x, one cannot declare x. One may declare
    a variable within the scope of a field x, shadowing the field. Hence the scope
    of a x is the entire class, except shadowed by a variable or parameter of the
    same name, and except for initializers preceding the field''s declaration (section
    9.1).'
