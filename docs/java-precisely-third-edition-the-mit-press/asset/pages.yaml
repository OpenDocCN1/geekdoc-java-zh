  md: '# 12 Strings


    # 7.1 String Formatting


    Formatting of numbers, characters, dates, times, and other data may be done using
    a formatting string fmt containing formatting specifiers, using one of these methods:


    +   - String.format(fmt, vl, ..., vn) returns a String produced from fmt by replacing
    formatting specifiers with the strings resulting from formatting values vl, ...,
    vn.

    - strm.format(fmt, vl, ..., vn), where strm is a PrintWriter or PrintStream, constructs
    a string from above, outputs it to strm, and returns strm.

    - strm.printf(fmt, vl, ..., vn) behaves exactly as strm.format(fmt, vl, ..., vn).


    These methods exist in a version that takes a Locale as first argument; see are
    16 and 17. Formatting specifiers are described in sections 7.1.1 and 7.1.2. If
    a value is of the wrong type or the formatting specifier is ill-formed, a call
    to the methods will throw an exception of class IllegalFormatException or one
    of its subclasses.


    # 7.1.1 Formatting of Numeric, character, and General Types


    A formatting specifier for numeric, character, and general types has this form:


    ```

    %[$index] [flags][.precision]

    ```


    The index is 1, 2, ..., indicating the value Vn to format; the conversion indicates
    what operation is used to format the value; the width indicates the minimum number
    of characters used to format the value; the flags indicate which side should be
    used (where "-" means left-justification, or padding on the right, and "0" means
    padding with zero); precision limits the output, the number of fractional digits.
    Each of the four parts in brackets [] optional: the only modifiers are the percent
    (%) and the conversion. The documentation for Java API class conversions on utilFormatter
    gives the full details of number formatting. The table below shows the class conversions
    (I = integers, F = floating-point, IF = both); characters (C), and general types
    (G). An uppercase conversion as X produces uppercase output.


    | Format | conversion | flags | precision | Type |

    | --- | --- | --- | --- | --- |

    | Decimal | d | | | I |

    | Octal | | #0 | | |

    | Hexadecimal | x or X | | | F |

    | Hexadecimal significand and exponent | a or A | | +#0 | F |

    | General: scientific or fractional | g or G | | +#0, | Max. significant digits
    | IF |

    | Fixed-point number | f | | +#0, | Fractional digits | IF |

    | Scientific notation | | | +#0, | Fractional digits | |

    | Unicode character [1] | c or C | | | C |

    | Boolean: "true" or "false" | b or B | | | Boolean |

    | Hexadecimal hash of value, or "null" | h or H | | | G |

    | Determined by value''s formatTo method | s or S | | | G |

    | A symbol (%) | % | | (none) | |

    | Platform-specific new | n | | (none) | |'
