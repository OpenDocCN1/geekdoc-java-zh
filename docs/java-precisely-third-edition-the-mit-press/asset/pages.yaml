  md: "# Example 161 Some Ways to Obtain a ToFunction<String>\n\nExample 155 shows\
    \ how to create a function of type ToFunction<String,Integer>, but sometimes it\
    \ is better to use a primitive-specialized value of type ToFunction<String>, which\
    \ produces an unboxed int. Exactly the same definitions can be used, except that\
    \ the value assigned to fs7 must use the correct interface and method, different\
    \ from those in example 155—which lambda expressions and method references are\
    \ easier to use than those anonymous classes.\n\n```\nToIntFunction<String>\n\
    fs1 = s -> Integer.parseInt(s);           // same, with explicit parameter type\n\
    fs2 = (String s) -> Integer.parseInt(s);// reference to static method Integer.parseInt\n\
    fs3 = Integer::parseInt;\nfs4 = Integer::;                           // reference\
    \ to constructor Integer(String)\nfs5 = s -> s.length();                     \
    \ // lambda with parameter s\nfs6 = String::length;                     // reference\
    \ to method s.length()\nfs7 = new ToFunction<String>() {\n    public int applyAs(String\
    \ s) {\\          // anonymous class (Java 1.1)\n        return s.length();\n\
    }}\n```\n\nThe fs1-fs6 work because a function-value expression like s -> Integer.parseInt\
    \ does not have a type in itself. Instead, the Java compiler performs inference\
    \ and inserts boxing and unboxing operations to match the type of the variable\
    \ assigned. This same-value function expression can be assigned to variables of\
    \ type ToFunction<String> as well as Function<String,Integer>. However, there\
    \ is no subtype relation or conversion between those types, so the assignment\
    \ g = f, where f has a type in itself, will be rejected by the compiler:\n\n```\n\
    Function<String,Integer> f = s -> Integer.parseInt(s);\n// ToFunction<String>\
    \ g = f;                // Type error!\n```\n\n# Example 162 Why No andThen Method\
    \ on Primitive-Specialized Interfaces?\n\nSome of the primitive-specialized interfaces\
    \ such as <Double,Integer> do not have methods such as andThen and compose on\
    \ the corresponding generic interface. Presumably the reason is that there would\
