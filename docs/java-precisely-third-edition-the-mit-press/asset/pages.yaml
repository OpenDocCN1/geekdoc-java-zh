  md: '# Classes


    # 9.6 Field Declarations


    The purpose of a field is to hold a value inside an object (non-static) or a class
    (if static). A field must be declared in a class declaration. A field-declaration
    has one of the forms


    ```

    field-modifiers type fieldname1, fieldname2, ... ;\nfield-modifiers type fieldname1
    = initializer1, ... ;

    ```


    The field-modifiers may be a list of the modifiers static, final, transient (section
    26.12), and volatile, and at most one of the access modifiers private, protected,
    or public (section 9.7).


    If f in class C is declared static, then it is associated with class C and can
    be referred independently of any objects of class C. The field can be referred
    as C.f or o.f, where o is an expression of type C, or in the declaration of C.f.
    If f in class C is not declared static, then it is associated with an object (also
    instance) of class C, and every instance has its own copy of the field. The field
    can be referred to as o.f, where o is an expression of type C, or in non-code
    the declaration of C, as f.


    If f in class C is final, the field cannot be modified after initialization. If
    it has reference and points to an object or array, the array''s elements may still
    be modified. The initialization must happen either in the declaration or an initializer
    block (section 9.13), or if the field is non-static, precisely in every constructor
    in class C.


    A initializer may be an expression or an array initializer (section 8.2). A static
    initializer can only refer to static objects of C and can have no checked exceptions
    (chapter 15).


    A field is given a default value depending on its type. If t is a primitive type,
    the field is initialized to 0 (when t is byte, char, short, int, long) or 0.0
    (when t is float or double) or false (when t is boolean). Then the field is initialized
    to null.


    Static fields are initialized when the class is loaded. All static fields are
    initialized first, then the static blocks (section 9.13) and static initializers
    are executed, in order of appearance.


    Non-static fields are initialized when a constructor is called, at which time
    all static fields have been initialized already (section 9.10).


    If a class declares a non-static field f, and C is a subclass of class B that
    has a non-static field f, every object of class C has two fields, one is the B-field
    f declared in class B, and one is the C-field f declared in class C. What field
    is referred to by a reference o.f is determined by the compile-time type of o
    (section 11.9).


    # 9.7 The Member Access Modifiers private, protected, public


    A member (field, method, class, or interface) is always accessible in the class
    in which it is declared, except where shadowed by a variable, parameter, or field
    of the same name). The access modifiers private, protected, and public define
    where the member is accessible.


    If a declared private in top-level class C or a nested class within C, it is accessible
    on all object instances, not only in C and its nested classes, but not in subclasses
    C or in other classes. If a member in class C is declared protected, it is accessible
    in all classes in the same package (chapter 17) and as C on the same instance
    (this) in subclasses of C, but not in non-subclasses in other packages.


    If a member in class C is not declared private, it has package access, and is
    accessible only in classes within the same package as C. If a member in class
    C is declared public, it iss accessible in all classes, including classes in other
    packages. Thus, in order of increasing accessibility, we have private access,
    package (or default) access, protected access, and public access.


