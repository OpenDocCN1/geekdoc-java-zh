  md: 'Generic Collections Set Maps


    # 22.3 Interface Set<T> and Its Implementations HashSet<T> and LinkedHashSet<T>


    The Set<T> interface describes the methods as the Collection<T> interface. The
    methods add addAll make sure a set contains duplicates: no two equal elements
    and at most one element. The methods equals and hashCode have more precise specifications
    for Set<T> objects:


    +   * equals(Object o) returns true if o is a Set with same number of elements,
    and every element of o is also in this set.

    * hashCode() returns the hash code of the set: the sum of the hash codes of its
    non-null elements.


    For arguments, add computes set union, containsAll computes intersection, removeAll
    computes set difference, and retainAll computes set intersection (example 152).

    HSet<T> class implements the Set<T> and has the following constructors. Operations
    on a HashSet rely on equals and hashCode methods of the element objects.


    +   * HashSet() creates an empty set.

    * HashSet(Collection<T> coll) creates a set containing the elements of coll, without
    duplicates.


    The LinkedHashSet<T> class is a subclass of SortedSet<T> and works the same way
    but guarantees that its iterator traverses the elements in order (rather than
    the unpredictable order by HashSet).


    # 22.4 Interface SortedSet<T> and Implementation TreeSet<T>


    The SortedSet<T> interface extends the Set<T>. Operations on SortedSet<T> rely
    on the natural ordering of the elements defined by their compareTo method, or
    on an explicit Comparator<T> object provided when the set was created (section
    22.9), as for TreeSet<T> below.


    +   * Comparator<?super T> returns the Comparator with this sorted set, or null
    if it uses the natural ordering (section 22.9) of the elements.

    * first() returns the least element; throws NoSuchElementException if the set
    is empty.

    * SortedSet<T> head(T to) returns the set of all elements less than to. The resulting
    set is a view of the underlying set.

    * last() returns the greatest element; throws NoSuchElementException if the set
    is empty.

    * SortedSet<T> subSet(T from, T to) returns the set of all elements greater than
    or equal to from and less than to.

    * SortedSet<T> tailSet(T from) returns the set of all elements greater than or
    equal to from. The resulting set is a view of the underlying set.


    The TreeSet<T> class implements the SortedSet<T> and has the following constructors.
    The implementation uses balanced trees, so all operations are guaranteed to be
    efficient.


    +   * TreeSet() creates an empty set, ordering elements using their compareTo
    method.

    * TreeSet(Collection<? extends T> coll) creates a set containing the elements
    of coll, without duplicates, ordering elements using their compareTo method.

    * TreeSet(Comparator<? super T> comp) creates an empty set, ordering elements
    using comp.

    * TreeSet(Set<T> s) creates a set containing the elements of s, ordering elements
    as in s.'
