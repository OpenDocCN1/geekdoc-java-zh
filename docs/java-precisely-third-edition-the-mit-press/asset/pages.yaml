  md: '# Generic Collections and Maps


    # 22.7 Going through a Collection: Interfaces Iterator<T> and Iterable<T>


    The Iterator<T> provides a convenient way to go through the elements of a collection
    or the entries of a map. Namely, Iterator<T> has methods hasNext and next to go
    through a sequence of elements, and an Iterable<T> has a method that returns a
    new Iterator<T>.


    The elements of an iterable are usually traversed using the enhanced for statement
    (section 12.5.2) as shown in examples 141 and 142, but one can explicitly get
    an iterator from the iterable and then use it in a while or for loop, as shown
    in examples 79 and 82.


    The Iterator<T> from package java.util describes the following methods:


    +   - void eachRemaining(Consumer<T> cons) calls accept(x) on each remaining element,

    - boolean hasNext() true to call next() returns a new element.

    - T next() returns the next element and advances past that element, if any; throws
    NoSuchElementException if there is no element.

    - remove() removes the last element returned by the iterator; throws IllegalStateException
    if no element has been returned by the iterator yet, or if the element has been
    removed. If removal is not supported, it throws UnsupportedException.


    There are primitive-type specialized versions PrimitiveIteratorOf[Double,Long]
    of Iterator<T> for efficiency; see section 23.3. Such primitive-type iterators
    are produced by method() on the numeric streams (Double,Long). The interfaces
    PrimitiveIteratorOf[Double,Long] have Iterator<T>''s methods eachRemaining, hasNext,
    next, and remove, as well as the following, obviously with [Int] instead of PrimitiveIteratorOf[Int].


    +   - void eachRemaining(DoubleConsumer cons) calls accept(x) on each remaining
    element x, in order, passing x as a non-wrapped double.

    - double nextDouble() returns the next element as a non-wrapped double.


    The Iterator<T> interface from package java.lang has the following methods:


    +   - Iterator<T> returns a new iterator for this iterable.

    - void each(Consumer<T> cons) calls accept(x) on each element x, in iteration
    order.


    All collections are iterable because the Collection<T> has interface Iterable<T>.
    The entries of a map can be iterated over interface Map<K,V> describes a method
    entrySet that returns a Set<Map.Entry<K,V>>, which implements Map.Entry<K,V>.


    An iterator from a List traverses the elements in the order of the list. An iterator
    from SortedSet, or from the keys or values of a SortedMap, traverses the elements
    of the set or the map keys. An iterator from a HashMap traverses the elements
    in an unpredictable order.


    When iterating over a collection or map, the underlying collection should not
    be modified except through the iterator''s remove method. If it is modified any
    way, the result is unpredictable. In fact, the concrete classes ArrayList, LinkedList,
    HashMap, HashSet, TreeSet, and TreeSet produce fast-iterators: if the underlying
    collection is structurally modified (except by the iterator''s remove method)
    after an iterator has been created, a ConcurrentModificationException is thrown
    by the next() or next.'
