  md: '# 10 Classes and Objects in the Computer


    # 10.1 What Is a Class?


    Conceptually, a class represents a concept, a template for creating instances
    (objects). In the computer, a class is a chunk of memory, set aside once, when
    the class is loaded at run-time. A class has the following parts:


    +   * The name of the class

    * Room for all the static members of the class


    A class can be drawn as a box. The header class SPoint gives the class name, and
    the box contains the static members of the class:


    ![](img/25c670a7b9eeeecd9d7d8d608e1793ba_46_0.png)


    # 10.2 What Is an Object?


    Conceptually, an object is an instance of a concept (a class). In the computer,
    an object is a chunk of memory, set aside by object creation expression new C(...);
    see section 11.7. Every evaluation of an object creation expression new C(...)
    creates a distinct object, with its own chunk of memory. An object has the following
    parts:


    +   * A reference to the run-time class C of the object; this is the class C when
    creating the object

    * Room for all the non-static members of the object


    An object can be drawn as a box. The header i SPoint gives the object''s class
    (underlined), and the remainder of the box contains the non-static members of
    the object:


    | SPoint |

    x | 12

    y | 123


    # 10.3 Inner Objects


    When NMC is an inner class (a non-static member class, or a local class in non-static
    code) in a class C, then an object of class NMC is an inner object. In addition
    to the object''s class and the non-static fields, an inner object always contains
    a reference to an enclosing object, which is an object of the innermost enclosing
    class C. The enclosing reference can be written C.this in non-static code in the
    inner class.


    An object of a nested class SMC, on the other hand, contains no reference to an
    enclosing object.'
