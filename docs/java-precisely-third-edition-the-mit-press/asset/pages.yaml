  md: "# Example 158 Converting Numbers to English\n\nThe conversion of a long integer\
    \ to an English number, such as converting 2,147,483,647 to \"two billion hundred\
    \ fifty-four million hundred eighty-three thousand six hundred seventy-seven\"\
    , follows a simple pattern, caught by method less below. Method less returns a\
    \ function n ... of type LongFunctionString is called four times to define lessK,\
    \ lessG, where the latter numbers in the range ±10^12 and is called by method\
    \ toEnglish. To extend the range to ±10^14, or 1,000, simply define an appropriate\
    \ fifth function lessT using lessG, and call lessT fromEnglish.\n\n```\nprivate\
    \ static String[] units = { \"one\", \"two\", ..., \"nineteen\" };\nprivate static\
    \ String[] tens = { \"\", ..., \"ninety\" };\nprivate static String after(String\
    \ d, String s) { return s.equals(\"\") ? d : d + s }\nprivate static String less100(long\
    \ n) {\n    return n < 20 ? units[(int)n] : tens[(int)n/10] + after(\"\", (int)n%10);\n\
    }\nprivate LongFunction less(long limit, long unit, LongFunction conv) {\n   \
    \ return n < limit ? conv.apply(n) : conv.apply(n) + \" * \" + unit + after(\"\
    \", conv.apply(n%limit));\n}\nprivate static LongFunction less() {\n    lessK\
    \ = less(100, \"hundred\", Numerals:less100);\n    lessM = less(1000, \"thousand\"\
    , lessK);\n    lessB = less(1000000, \"million\", lessM);\n    lessG = less(1000000000,\
    \ \"billion\", lessB);\n    public static String toEnglish(long n) {\n    return\
    \ n == 0 ? \"zero\" : n < 0 ? \"-\" + lessG.apply(-n) : lessG.apply(n);\n}\n```\n\
    \n# Example 159 Consumers\n\nThe each method on Stream+ takes an argument Consumer<T>\
    \ and applies it to each element of the stream. To print strings we use method\
    \ reference: System.out::println as a Consumer<String>;\n\n```\nStream<String>\
    \ ss = Stream.of(\"Hoover\", \"Roosevelt\", \"Truman\", \"Eisenhower\", \"Kennedy\"\
    );\nss.forEach(System.out::println)\n```\n\nExample 160 Using a Supplier to Generate\
    \ Infinite Streams of Natural Numbers or Fibonacci Numbers The stream of numbers\
    \ 0,1... might be produced functionally as in Example 165. Or use generate with\
    \ IntSupplier whose state is held inside the anonymous inner class, as in nats2\
    \ below. Or the IntSupplier may be a lambda expression: () -> next++ where next\
    \ is held in nats3 as in nats3:\n\n```\nIntStream nats2 = IntStream.generate(new\
    \ IntSupplier() {\n    private int next = 0;\n    public int getInt() { return\
    \ next++; }\n});\nint[] next = { 0 }; // next is final, element mutable by the\
    \ lambda\nIntStream nats3 = IntStream.generate(() -> next[0]++);\n```\n\nThe stateless\
    \ approach is particularly useful when the next element depends on the preceding\
    \ element, as in the Fibonacci number. The lambda expression is a Supplier<BigInteger>:\n\
    \n```\nBigInteger[] fib = { BigInteger.ZERO, BigInteger.ONE }; // fib elements,\
    \ mutable\nStream<BigInteger> fibonacci = Stream.generate(() -> {\n    BigInteger\
    \ next = fib[0]; // wait, logic is fib[0].add(fib[1]) usually,\n    fib[0] = fib[1];\n\
    \    fib[1] = fib[0].add(fib[1]);\n    return next;\n});\n```"
