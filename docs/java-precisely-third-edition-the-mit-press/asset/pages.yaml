  md: '# 26.13 Buffered Input and Output


    Writing one byte or character at a time to a file or network connection is very
    inefficient. It is better to collect the bytes or characters in a buffer, and
    then write the whole buffer in one operation. The same holds for reading from
    a file or network connection. However, buffering will not speed up input from
    output to byte arrays, character arrays, strings, or buffers.


    To buffer a plain input stream, create a BufferedInputStream from is and read
    from IO stream instead; and use Buffered for output streams, readers, and writers.


    The operation flush() can be used on a buffered IO stream to request that the
    output get written to the underlying IO stream. A buffered stream should be properly
    closed by a class to close() to ensure that all data written to the buffer are
    eventually written to the underlying IO stream.


    Class Reader has all the methods of Class reader (section 26.4) and these constructors
    and method:


    Class Writer has all the methods of Class Writer (section 26.5) and these constructors
    and method:


    +   - BufferedWriter(Writer wr) creates a buffered writer that writes to wr.

    - BufferedWriter(Writer wr, int sz) creates a buffered writer with a buffer of
    size sz. It throws IllegalArgumentException if sz <= 0.

    - void newLine() writes a line separator, such as "\n" or "\r", depending on the
    platform.


    Class BufferedInputStream is a subclass of FilterInputStream. It has the same
    methods as InputStream (section 26.9) and these constructors:


    +   - BufferedInputStream(InputStream is) creates a BufferedInputStream that reads
    from is.

    - BufferedInputStream(InputStream is, int sz) creates a BufferedInputStream with
    buffer size sz; throws IllegalArgumentException if sz <= 0.


    Class BufferedOutputStream is a subclass of FilterOutputStream. It has the same
    methods as OutputStream (section 26.10) and these constructors:


    +   - BufferedOutputStream(OutputStream os) creates a BufferedOutputStream that
    writes to stream os.

    - BufferedOutputStream(OutputStream os, int sz) creates a BufferedOutputStream
    with a buffer of size sz; throws IllegalArgumentException if sz <= 0.'
