  md: '# 26.8 Reading Primitive Data from a Character Stream: StreamTokenizer


    Reading words and numbers from a character stream is more complicated than printing
    them, so there is no text input counterpart to PrintWriter. Instead create a StreamTokenizer
    from a Reader.


    A StreamTokenizer collects characters into tokens. Characters are classified as
    white space (separating tokens), numbers (making up a number token), word characters
    (making up a word token), end-line characters (initiating a character extension
    to end-of-line), or ordinary characters (none of the preceding).


    A StreamTokenizer can be created and configured using this constructor and these
    methods and fields:


    +   * StreamTokenizer(Reader r) creates a StreamTokenizer that reads from IO stream
    r.

    * void commentChar(int ch) tells the tokenizer that ch is an end-line comment
    character.

    * void eSignificant(boolean b) tells the tokenizer to recognize newline as a special
    token of type TT_EOL, not as white space, if it is true.

    * void ordinary(int cl, int c2) tells the tokenizer that the character in the
    range cl..c2 (inclusive) is an ordinary character: a single-character token, with
    type to the character code.

    * void parseNumbers(int n) tells the tokenizer to recognize number tokens. A number
    is a "word" with a decimal digit (0..9) or a decimal point (.) or a minus sign
    (-), and consisting only of these three characters, so in scientific notation
    6.023 is not recognized. A token has type TT_NUMBER.

    * void quote(int ch) tells the tokenizer that ch is a string delimiter. When this
    character is encountered, it is set to ch, or val to the string contents: the
    characters strictly between ch and the next character of ch or end-of-stream.

    * void resetSyntax() makes all characters ordinary: ordinaryChars.

    * void whitespaces(int cl, int c2) tells the tokenizer that all characters in
    the range cl..c2 (inclusive) are white space, so, it separates.

    * void wordChars(int cl, int c2) tells the tokenizer that all characters in the
    range cl..c2 (inclusive) are word characters.


    Class StreamTokenizer uses these methods and fields for reading:


    +   * int lineno() returns the line number, counting from 1.

    * int nextToken() returns the next (or first) token and returns it.

    * double nval is the value of the current number token (when type is TT_NUMBER).

    * String val is the string value of the current word (when type is TT_WORD), or
    the string body of the current string (when type is a quote).


    int type is the type of the current token. The StreamTokenizer.TT_NUMBER, indicating
    a number; or StreamTokenizer.TT_WORD, indicating a word; or StreamTokenizer.TT_EOL,
    indicating a newline; or StreamTokenizer.TT_EOF, indicating an-of-stream (or no
    more); or a quote character, indicating in a string (quotes); or any other character,
    indicating that as a token by itself.


    While a StreamTokenizer is useful for reading simple text files, structured text
    files should be read using regular expressions (package java.util.regex, see [2]),
    a proper lexer and parser (see more textbooks for compilers, or special-purpose
    libraries (e.g., for XML).'
