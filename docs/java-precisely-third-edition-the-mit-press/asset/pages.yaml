  md: '# 26.12 Serialization of Objects: ObjectInput and ObjectOutput


    The interfaces ObjectInput (implemented by ObjectInputStream) and ObjectOutput
    (implemented by ObjectOutputStream) describe operations for byte-oriented input
    and output of values of reference type, that is, objects and arrays. This is also
    called serialization or marshalling.


    An object can be serialized (converted to a sequence of bytes) if the object or
    array has been declared to implement the interface Serializable. The Serializable
    interface does not declare any methods; it only serves to show that the class
    admits serialization.


    Serialization of an object writes the object''s non-static (instance) fields,
    except those declared to the IO stream. When the object is deserialized, a transient
    field gets the default value for its type (false or 0 or 0.0 null). Class fields
    (static fields) are not serialized.


    Serialization to OutputStream preserves the objects written to it, and more generally,
    preserves the form of the object reference. For instance, if object o1 and o2
    both refer to the same object c (so o1==== o2), and o1 and o2 are serialized to
    ObjectOutputStream, then c is serialized only once. When o1 and o2 are restored
    from oos, then c is restored as all, exactly, so o1==== o2. If o1 and o2 were
    serialized to two different ObjectStreams, then restoration of o1 and o2 will
    yield two copies of c, so o1!=== o2. Sharing among objects is not preserved across
    multiple ObjectStreams.


    The interface ObjectInput (implemented by ObjectInputStream) has all the methods
    provided by DatalInput and the following additional ones. The methods available(),
    close(), read(byte[]), readbyte(), int, int(), and skip(int) behave like those
    of class InputStream (section 26.9).


    +   * available() returns the number of bytes that can be read or skipped without
    blocking.

    * close() closes the IO stream, as in InputStream.

    * read() reads one byte, as in InputStream.

    * read(byte[]) b reads bytes into b, as in InputStream.

    * read(byte[] b, int i, int n) reads bytes into b[i..i+n].

    * readObject() deserializes, and returns an object, which must have been previously
    serialized. throws ClassNotFoundException if the declaration (class field) for
    an object that is deserialized cannot be found. throws ObjectErrorException or
    one of its subclasses no object can be read from the IO stream, for instance,
    if de-stream is not before the object is complete.

    * skip(long n) skips n bytes, as in InputStream.


    The interface ObjectOutput (implemented by ObjectOutputStream) has all the methods
    of DataOutput (section 26.11) and the following additional one.


    +   * writeObject(Object obj) writes the object using serialization. All classes
    must implement the Serializable interface; otherwise NotSerializableException
    is thrown.


    Externalizable is a subinterface of Serializable that can be implemented by classes
    that need full control over the serialization and deserialization of their.'
