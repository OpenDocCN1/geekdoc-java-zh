  md: '# 24 Classes


    # 9.4 The Modifiers public, final, abstract


    If a top-level C is declared public, then it is accessible outside its package
    (chapter 17).


    If a class C is declared final, one cannot declare subclasses of C and hence cannot
    override any methods declared in C. This is useful for preventing rogue subclasses
    from violating data representation invariants.


    If a class C is declared abstract, it cannot be instantiated, but non-abstract
    subclasses of C can be instantiated. An abstract class may declare constructors
    and initializers, to be executed when instantiating non-abstract subclasses. An
    abstract class may declare abstract and non-abstract methods; a non-abstract class
    cannot declare abstract methods. A class cannot be abstract and final, because
    no objects could be created of that.


    # 9.5 Subclasses, Superclasses, Class Hierarchy, Inheritance, Overriding


    A class C may be a subclass of class B by an extends-clause of the form


    ```

    class C extends B { ... }

    ```


    Class C is a subclass and a subtype (section 5.5) of B and its supertypes. It
    inherits all methods and fields (even private ones, which are not accessible in
    class C), but not the constructors, from B.


    Class B is the immediate superclass of C. A class can have at most one immediate
    superclass. The predefined class Object is a superclass of all classes and has
    no subclass, so the class hierarchy in which every class is a descendant of its
    immediate superclass, Object, which is the type of


    The first action of a constructor in C may be an explicit call to a constructor
    in B, like this:


    ```

    super(actual-list); or o.super(actual-list);

    ```


    A superclass may appear only at the very beginning of a constructor body. The
    second form o.super(...) is used when C''s superclass B is not abstract. In that
    case the C-object needs an enclosing object (sections 9.11 and 10.3); the value
    of o is that this enclosing object must not be null.


    If constructor C(...) in subclass B does not explicitly call super(...) as its
    first action, then it calls the default constructor B() in subclass B as its first
    action, or if it calls super(), then B must have a non-argumentless constructor
    B(). Conversely, if there is no argumentless constructor B() in B, C(...) must
    use super(...) to call all other constructor in B.


    The declaration of C may override a non-final method m inherited from B by declaring
    a new nonstatic method with the exact same signature. The overridden B-method
    may be referred to as super.m inside C''s constructors, non-static methods, and
    non-static initializers.


    +   * be at least accessible as the overridden method in B;

    * must have the same signature (disregarding final) as the overridden method in
    B; and must have a return type that is a subtype of that overridden method in
    B;

    * has no throws-clause, or has a throws-clause that has no checked exception classes
    than the throws-clause (if any) of the overridden method in B.


    The declaration of C may hide a non-final static method m inherited from B by
    declaring a new static method with the exact same signature. It is illegal for
    a static method to hide a non-static one, and vice versa.


    The declaration of C may hide a non-final field f inherited from B by declaring
    an additional non-static field of the same name (section 9.6 and 33, 46, and 56).
    The instance field f inherited from B can be referred to as super.f inside C''s
    constructors, non-static methods, and non-static initializers.'
