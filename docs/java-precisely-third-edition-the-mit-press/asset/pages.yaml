    \ needed to format it and the inverse, that is, the length of words plus the number\
    \ of words minus 1. Methods that change the word list use assert statements to\
    \ specify the invariant on length, and to check if assertions are enabled at run-time.\n\
    \n```\nclass WordList {\n    private LinkedList<String> strings = new LinkedList<String>();\n\
    \    private int length = -1; // Invariant: equals words list plus-one spaces\n\
    \    public int length() { return length; }\n\n    public void addLast(String\
    \ s) {\n        strings.addLast(s);\n        length += 1 + s.length();\n     \
    \   assert length == computeLength() + strings.size() - 1;\n    }\n\n    public\
    \ String removeFirst() {\n        String res = strings.removeFirst();\n      \
