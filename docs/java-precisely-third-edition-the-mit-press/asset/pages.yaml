  md: '# 12.6 Returns, Labeled Statements, Exits, and Exceptions


    # 12.6.1 The return Statement


    The simplest form of a return statement, without an expression argument, is


    +   return;


    That form of return statement must occur in a method whose return type is void,
    or in a constructor. Execution of the return statement exits the method or constructor
    and continues execution at the place where the method or constructor was called.
    Alternatively, a return statement may have an expression argument:


    +   return expression;


    That form of return statement must occur inside the body of a method (not constructor)
    whose return type is a supertype or boxed orboxed version of the expression. follows:
    The first expression is evaluated to some value v. Then it exits the method and
    continues execution at the method call expression that called the method; the
    value of expression will be v, possibly after the application of a widening, boxing,
    or unboxing conversion.


    # 12.6.2 Labeled Statements


    A labeled statement has the form


    +   label statement


    where label is a name. The scope of label is statement, where it can be used in
    break (section 12.6.3) and continue (section 12.6.4). The label cannot be reused
    inside statement, except inside a local class.


    # 12.6.3 The break Statement


    A break statement is legal only inside a switch or loop and has one of the


    +   break;

    break label;


    Executing break exits the innermost switching or loop and continues execution
    after that switch or loop. Executing break exits the enclosing statement that
    has label label, and continues execution after that statement. Such a statement
    must exist in the innermost enclosing method, constructor, or initializer block.


    # 12.6.4 The continue Statement


    A continue statement is legal only inside a loop and has one of the


    +   continue;

    continue label;


    Executing continue terminates the current iteration of the innermost enclosing
    loop and continues the execution at the step in loops (sections 12.5.1) and the
    condition in while and do-while loops (sections 12.5.3 and 12.5.4). Executing
    continue terminates the current iteration of the enclosing loop that has label,
    and executes the execution at the step of the condition. There must be a loop
    in the innermost enclosing method, constructor, or initializer block.'
