  md: '# 23.10 Interface BiFunction<T,U,R>


    The functional BiFunction<T,U,R> describes two-argument functions of type T *
    U -> R, that is, those that take arguments of type T and U return a result of
    type R. It has a single abstract method apply and a default method:


    +   - abstract R(T x, U y) is the function represented by an implementation of
    the interface.

    - default BiFunction<T,U,V> andThen(Function<T,V> after) returns a function that
    applies function after the result of this function, that is, (x, y) -> after.apply(this.apply(x,y)).


    The primitive-specialized interfaces {Double,Int,Long}BiFunction have only their
    single abstract methods, named applyAs(Double,Int,Long); see page 125.


    # 23.11 Interface BinaryOperator<T>


    The functional interface BinaryOperator<T,T,T> extends the interface BiFunction<T,T,T>
    and describes two-argument functions of type T * T -> T, that is, those that take
    two arguments of type T and return a result of the same type T. It has the single
    abstract method apply and the default method andThen described by BiFunction<T,T,T>,
    as well as two static methods:


    +   - abstract T(T x, T y) is the binary operator represented by an implementation
    of the interface.

    - default BiFunction<T,T,V> andThen(Function<T,V> after) returns a function that
    applies function after the result of this function, that is, (x, y) -> after.apply(this.apply(x,y)).

    - static <T> BinaryOperator<T> max(Comparator<T> cmp) returns a BinaryOperator<T>
    that returns the greatest of two T elements defined by the comparator cmp.

    - static <T> BinaryOperator<T> minBy(Comparator<T> cmp) returns a BinaryOperator<T>
    that returns the smallest of two T elements defined by the comparator cmp.


    The primitive-specialized interfaces {Double,Int,Long}BinaryOperator have only
    their single abstract methods, named applyAs(Double,Int,Long); see page 125. The
    static methods max and min from class Math (chapter 18) sometimes be used instead
    of the missing max and minBy.'
