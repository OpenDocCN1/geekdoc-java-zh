  md: '# Functional Interfaces (Java 8)


    # 23.7 Interfaces Predicate<T> and BiPredicate<T,U>


    The functional interface Predicate<T> describes one-argument predicates of type
    T -> boolean, that functions that take an argument of type T and return a truth
    value. The single abstract method test and some default static methods:


    +   - default boolean test (T x) is represented by implementing the interface.

    - default Predicate<T> and(Predicate<T> p) returns a predicate that is a short-circuiting
    logical conjunction ("&") of this predicate and p, that is, x -> this.test(x)
    && p.test(x).

    - static Predicate<T> isEqual(Object y) returns a predicate that tests whether
    its argument y, is, x -> Objects.equals(y,x).

    - default Predicate<T> negate() returns a predicate that represents the negation
    ("not") of this predicate, that is, x -> ~this.test(x).

    - default Predicate<T> or(Predicate<T> other) returns a predicate that is a short-circuiting
    logical conjunction ("or") of this predicate and p, that is, x -> this.test(x)
    || p.test(x).


    The primitive-special interfaces [Double,Int,Long]Predicate have the same methods
    except isEqual.

    The functional interface BiPredicate<T,U> describes two-argument predicates and
    has a single abstract method (and also default methods but not the isEqual method
    of Predicate<T>).


    +   - default boolean test (T x, y) is represented by implementing the interface.


    # 23.8 Interfaces Consumer<T> and BiConsumer<T,U>


    The functional interface Consumer<T> describes one-argument consumers of type
    T -> void, that functions take an argument of type T and return nothing. It has
    a single abstract method and a default method:


    +   - default void accept (T x) is the represented by implementing the interface.

    - default Consumer<T> andThen(Consumer<T> after) returns a Consumer<T> that performs
    this.accept(x) followed by after.accept(x).


    The primitive-specialized interfaces [Double,Int,Long]Consumer have corresponding
    default methods.

    The functional interface BiConsumer<T,U> describes two-argument consumers and
    has a single abstract method (and also default method and andThen).


    +   - default void accept (T x, y) is represented by implementing the interface.


    The primitive-specialized interfaces Obj[Double,Int,Long]Consumer have corresponding
    abstract methods, or see page 125.


    # 23.9 Interface Supplier<T>


    The functional interface Supplier<T> describes one-argument suppliers of type
    T -> T, that functions take no arguments and produce a result of T. It has the
    single abstract method get:


    +   - default T get() is the represented by implementing the interface.


    The primitive-specialized interfaces [Boolean,Double,Int,Long]Supplier have corresponding
    abstract methods, named getAs(Boolean, Double, Int, Long); see page 125.'
