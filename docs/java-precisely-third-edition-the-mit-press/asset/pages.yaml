  md: "# Enum Types 71\n\nExample 97 Representing Weekdays and Using Enum Types\n\
    When describing a date, it is useful to use numbers for years (2004), dates (11),\
    \ and ISO week numbers\n(28), but symbolic values for weekdays (SUN) and months\
    \ (JUL). In particular calculations it is useful to\\assign numbers 0–6 to the\
    \ weekdays (MON-SUN) and months 1–12 to the months (JAN-DEC). This is done\nin\
    \ the enum types Day and Month by declaring methods to convert integers to enum\
    \ values and back.\nThe Month enum type declares a field to hold the number of\
    \ days in the month (in a non-leap year),and a constructor to initialize the field.\
    \ It also declares method succ() that computes the next month. Note\nthe use of\
    \ reference between enum values in month days.\n\n```\nenum Day {\n    MON, TUE,\
    \ WED, THU, FRI, SAT, SUN;\n    private final static Day[] day = values();\n \
    \   static {\n // Cache the array\n    public static Day day(int n) { return day[n];\
    \ }\n    public int ordinal() { return ordinal(); }\n}\nenum Month {\n    JAN(31),\
    \ FEB(28), MAR(31), APR(30), MAY(31), JUN(30),\n    JUL(31), AUG(31), SEP(30),\
    \ OCT(31), NOV(30), DEC(31);\n    private final int days;\n    private Month(int\
    \ days) { this.days = days; }\n    private final static Month[] month = values();\n\
    \ // Cache the array\n    public static Month month(int n) { return month[n-1];\
    \ }\n    public int days() { return ordinal() + 1; }\n    public Month succ()\
    \ { return month[(ordinal()+1)%12]; }\n}\n```\n\n```\nclass Date {\n    final\
    \ int yy // /* 0-9999 */, dd /* 1-31 */;\n    final Month mm;\n    public Date(int\
    \ yy, int mm, int dd) throws Exception { ... }\n\n    public static MyDate fromDayNumber(int\
    \ n) {\n    ...\n    Month m = Month.JAN;\n    int mdays;\n    while ((mdays =\
    \ m.days(d)) < n) {\n        d = mdays;\n        m = m.succ();\n    }\n    return\
    \ new MyDate(yy, m, d);\n}\n\n    public Day weekday(int y, Month m, int d) {\n\
    \        return Day.toDay((toOfYear(y, m, d)+6) % 7);\n}\n\n    public String\
    \ toString() { // ISO format such as 2015-07-26\n    return String.format(\"%04d-%02d-%02d\"\
    , yy, mm.toInt(), dd);\n    }\n}\n```"
