  md: "# Example 96 Declaring and Using a Custom Annotation Type\n\nAn Author annotation\
    \ is a custom annotation that holds a name, a month (of enum type Month from example\
    \ 97), a day, and a weekly. Its targets are classes and methods. Author annotations\
    \ are retained until run-time, we use static import (annotation) to avoid prefix\
    \ TYPE and METHOD with their declaring type java.lang.annotation.ElementType.\
    \ An Author holds an array of Author annotations; the meta-annotation @Repeatable(Authors.class)\
    \ on Author says that repeat is used for an Authors annotation.\n\n```\nimport\
    \ java.lang.annotation.*; // Annotation\nimport static java.lang.annotation.ElementType.*;\
    \ // @Target arguments\nimport static java.lang.annotation.RetentionPolicy.*;\
    \ // @Retention arguments\nimport java.lang.annotation.reflect.*; // Method\n\n\
    @Target({TYPE, METHOD})\n@Retention(RUNTIME) // Attribute values are kept until\
    \ run-time\n@Repeatable(Authors.class) // Attribute may be used as a shorthand\
    \ for @Authors(...)\n@interface Author {\n    public final int oneHour = 60 *\
    \ 60 * 1000;\n    public String name();\n    public Month month();\n    public\
    \ String[] diet() default { \"Coffee\", \"Cola\", \"Mars bars\" };\n    public\
    \ int weeklyWork() default 56 * oneHour;\n}\n\n@Target({TYPE, METHOD}) // Attribute\
    \ can be used on types and methods\n@Retention(RUNTIME) // Attribute values are\
    \ kept until run-time\n@interface Authors { public Author[] value(); }\\n\n```\n\
    \n```\nclass TestAnnotations {\n    @Author(name=\"Peter\", month=MONTH.NOV, diet=\"\
    Dr. Pepper\")\n    public void myMethod1() { }\n\n    @Author(name=\"Jens\", month=MONTH.JUL)\n\
    \    public void myMethod2() { }\n\n    @Author(name=\"Urik\", month=MONTH.AUG)\n\
    \    @Author(name=\"Andre\", month=MONTH.AUG, diet = {\"Tea\"})\n    // Alternative,\
    \ with the same thing:\n    @Authors(@Author(name=\"Urik\", month=MONTH.JUL),\n\
    \             @Author(name=\"Andre\", month=MONTH.AUG, diet = {\"Tea\"}))\n  \
    \  public void myMethod3() {n}\n\n```\n\n```\nTest ty = new TestAnnotations();\n\
    for (Method m : ty.getMethods()) {\n    if (m.getName().startsWith(\"get\")) {\n\
    \        System.out.println(\"getting the annotations of \" + m.getName());\n\
    \        Annotation[] annos = m.getDeclaredAnnotations(); // Find RUNTIME annotations\n\
    \        System.out.println(\"the annotations are: \");\n        for (Annotation\
    \ anno : annos) {\n            System.out.println(anno);\n        }\n    }\n}\n\
    \n```\n\n*"
