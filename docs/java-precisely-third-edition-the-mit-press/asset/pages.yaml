  md: '# 24.1 Creating Streams


    There are many ways to create a stream:


    +   * By explicit enumeration of elements, using the variable-arity static method
    Stream.of(T ...), which creates a sequential ordered stream, or Stream.empty(),
    which creates a stream with no elements.

    * From an array, using the static Arrays.stream(T[]) and Arrays.stream(T[], from,
    to) from class Arrays (section 8.4), both of which create a sequential Stream<T>.
    There are primitive-type specialized overloads Arrays.stream(double[]) and Arrays.stream(double[],
    from, to) that create a sequential DoubleStream, and others for IntStream and
    LongStream.

    * From a collection, using the Collection<T> default method coll.stream(), which
    creates a sequential Stream<T>, or default method coll.parallelStream(), which
    creates a parallel Stream<T>.

    * By static generator methods on Stream<T> such as iterate(x, f) and generate(supp),
    or from IntStream''s static methods range(from, to) and rangeClosed(from, to).

    * By imperative generation of stream elements, using a stream builder; see section
    24.2.

    * From a BitSet (package java.util) using method stream(supp), which returns an
    IntStream of the numbers in the set; see examples 175 and 176.

    * From a random generator of class Random, using methods ints(n), ints(int), ints(a,b)
    or ints(a,b), which produces an IntStream of n random integers, or infinitely
    many integers, possibly limited to the range a.(b-l); or using methods called
    doubles and longs to generate a DoubleStream or LongStream.

    * From a BufferedReader using the lines() method, which generates a Stream<String>;
    see example 170.


    # 24.2 Stream Builders


    The StreamBuilder<T> interface from java.util.stream extends the Consumer<T> interface
    (section 23.8) and can be used to build a sequential stream using imperative programming.
    A stream builder creates the stream elements easily, and it may do more work than
    necessary in case only one of the generated elements are consumed.


    The StreamBuilder<T> interface has two abstract methods and a default one:


    +   * void add(T x) adds an element to the stream builder.

    * default StreamBuilder<T> add(T x) works exactly as accept(x) but in addition
    returns the stream builder to allow chained calls, as in sb.add(2).add(3).add(5).

    * Stream<T> build() builds the stream and moves the builder to the built state.
    After this call, any call to accept or add will throw IllegalStateException.


    The primitive-type specialized interfaces [Double,Int,Long] StreamBuilder extends
    the DoubleConsumer, IntConsumer, and LongConsumer interfaces (section 23.8) and
    have the same methods as listed above, with using corresponding argument and return
    types.'
