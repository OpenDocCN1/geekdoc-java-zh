  md: '# 40 Expressions


    # 11.5 Assignment Expressions


    In the assignment expression x = e, the type of e is a subtype of the x, after
    boxing or unboxing (section 5.4). The type of the expression is the same as the
    type of x. The assignment is executed by evaluating x and e, storing e''s value
    in variable x, after a widening conversion (section 11.11) if necessary. When
    e is a compile-time constant of type byte, char, short, or int, and x has type
    byte, char, or short, a narrowing conversion is done automatically, provided the
    value of e is within the range representable in x (section 5.1). The value of
    the expression is x after the assignment.


    When e has reference (object type or array type), only the reference to the object
    or array is stored in x.

    The assignment x += does not copy the object or array (section 52).

    When x and e have the same type, the assignment x += is equivalent to x = x +
    e; where x is evaluated only once, e only once. When the type of x, different
    from the type of e, then x += is equivalent to x = (t)(x + e), where the intermediate
    result (x + e) is converted to t (section 11.11); and x is evaluated only once.
    The other compound assignment operators -=, *=, /=, and so on.

    Since assignments to the right, the value of sum sum += e is that sum after the
    assignment, one can write ps[i] = sum += e to first increment sum and store the
    result in ps[i] (example 41).


    # 11.6 Conditional Expressions


    The conditional expression e ? e2 : e3 is legal if e has type boolean or Boolean.
    If the conditional expression appears in context of assignment, argument, cast,
    or return, its type may be determined by the context, as for lambda expressions
    (section 11.13). Otherwise its is the least common supertype of e2 and e3, possibly
    after boxing operations. The conditional expression is evaluated by e; if e is
    true, then e2 is evaluated; otherwise e3 is evaluated—this gives the value of
    the conditional expression.


    # 11.7 Object Creation Expressions


    The object creation expression


    ```

    new C(actual-list)

    ```


    creates a object of class C and then calls constructor in class C whose signature
    matches the arguments in actual-list. The actual-list is evaluated from left to
    right to obtain a list of arguments. The values are bound to the constructor''s
    parameters, an object of the class is created in the memory, the non-static fields
    are given initial values after constructing their type, a superclass constructor
    is explicitly or implicitly (examples 40 and 63), all non-static field initializers
    and initializer blocks are executed in order of appearance, and finally the constructor
    body is executed to initialize the object. The value of the constructor call is
    the newly created object, which class is C.


    When C is an inner class in class D, and o evaluates an object of class D, then
    one may create a C-object inside o using the syntax .new C (actual-list); see
    example 47.


    # 11.8 Instance Test Expressions


    The instance e instanceof t is evaluated evaluating e to a value v. If v is not
    null and a reference to object of class C, where C is a subtype of t, the result
    is true; otherwise false.'
