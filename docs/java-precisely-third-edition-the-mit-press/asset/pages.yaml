    # 20.3 Operations on Threads


    The current thread, whose state is Running, may call these methods among others.
    Further thread methods are described in the Java class library documentation [2].


    +   - Thread.yield() changes the state of the current thread from Running to Enabled,
    and thereby allows the system to schedule another Enabled thread, if any.

    - Thread.sleep(n) sleeps for n milliseconds; the current thread becomes Sleeping
    and after n milliseconds becomes Enabled. May throw InterruptedException if the
    thread is interrupted while sleeping.

    - Thread.currentThread() returns the current thread object.

    - Thread.interrupted() returns and clears the interrupted status of the current
    thread: true if there has been no call to Thread.interrupted() and no InterruptedException
    thrown since the last interrupt; otherwise false.


    Let u a thread (an object of a subclass of Thread). Then


    +   - u.start() changes the state of u to Enabled so that its run will be called
    when a processor becomes available.

    - u.interrupt() interrupts the thread u; if u is Running or Enabled or Locking,
    its interrupted status is set to true. If u is Sleeping or Joining, it will become
    Enabled, and if it is Waiting, it will become Locking; in these cases it will
    throw InterruptedException when it becomes Running (and the interrupted status
    is set to false).

    - u.isinterrupted() returns the interrupted status of u (and not clear it).

    - u.join() waits for u to die; may throw InterruptedException if the current thread
    is interrupted while waiting.

    - u.join(n) works as u.join() but times out and returns after n milliseconds.
    There is no indication whether the call returned due to a timeout or because u
    died.


    # 20.4 Operations on Locked Objects


    A thread that holds the lock on an o may call the following methods, inherited
    by o from class Object.


    +   - o.wait waits on the lock on o; changes its own state to Waiting, and adds
    itself to the set of threads waiting for notification on o. When notified (if
    ever), the thread must obtain the lock on o, so when the call wait returns, it
    again holds the lock on o. May throw InterruptedException if the thread is interrupted
    while waiting.

    - o.wait(n) works like o.wait() except that the thread will change state to Locking
    after n milliseconds regardless of there has been a notification on o. There is
    no indication the state change was caused by a timeout or notification.

    - o.notify() chooses an arbitrary thread among the threads waiting for notification
    on o (if any) and changes its state to Locking. The chosen thread cannot actually
    obtain the lock on o until the current thread has released it.

    - o.notifyAll() works like o.notify(), except that it changes the state to Locking
    for all threads waiting for notification.'
