  md: '# 28 Classes


    # 9.8 Method Declarations


    A method must be declared inside a class. A method-declaration declaring m has
    the form


    ```

    method-modifiers return-type m(formal-list) throws-clause

    method-body

    ```


    The formal-list is a comma-separated list of zero or more formal parameter declarations,
    of which the one of


    ```

    parameter-modifier type parameter-name

    parameter-type... parameter-name

    ```


    The parameter-modifier may be final, meaning that the parameter cannot be modified
    inside the method,

    or absent. The type is any. Each parameter-name must be a distinct name. A formal
    parameter is an initialized variable; its scope is the method-body. The second
    form of parameter declaration can appear only and declares a parameter after:
    see section 9.9. For generic types with parameters, section 21.8.


    The method name together with the list t1,...,tn of declared parameters in the
    formal-list defines the

    method signature mt1,...,tn, where generic types in t1,...,tn are replaced by
    the underlying non-generic types (section 21.11). The return-type is not part
    of the method signature.


    A class may declare more than one method with the same method-name, provided they
    have different signature

    as (after replacing generic types by types). This is called overloading of the
    method-name.


    The method-body is a block-statement (section 12.2) and may contain such as declarations

    of variables and local classes. The method-body may contain return statements.
    If the

    -type is void, it does not return a value, and no return statement in the method-body
    can

    an expression. If the return-type is not void but a type, the method must return
    a value; it must be

    possible to reach the end of the method-body without executing a return statement.
    Moreover,\very return statement must have an expression argument that is a subtype
    of the return-type.


    The method-modifiers may be abstract or a list of static, synchronized (section
    20.2), and at

    one of the access modifiers: private, protected, or public (section 9.7).


    If a method in c is declared static, it is associated with class; c can be referred
    to without

    any object. The method may be called c.m(). or as o.m(), where o is an expression
    type that is

    ubtype of c, or inside constructors, fields, initializer blocks in c, simply as
    m().

    Static methods can refer only to static fields and methods of class.


    If a method in c is not static, it is associated with an instance (instance) of
    class c

    Outside the class, the method must be called as o.m() where o is an object of
    class c or subclass,

    or non-static methods, non-static field initializers, and non-static initializer
    blocks in c, simply as m().


    If a method in c is declared final, it cannot be overridden (redefined) in subclasses.

    If a method in c is declared abstract, c must itself be abstract (and cannot be
    instantiated).

    an abstract method cannot have no method body


    ```

    abstract-method-modifiers return-type m(formal-list) throws-clause

    ```


    The throws-clause of a method or constructor has the form throws El,..., En El,...,
    En are the

    names of exceptions covering all the checked exceptions the method or constructor
    may throw. If

    execution of the method or constructor body may throw some exception, e, then
    e must be thrown an unchecked

    exception (chapter 15) or a checked exception whose class is a subtype of El.
    An El may be a

    geric type provided it is constrained (section 21.5) to be a subtype of Throwable.


