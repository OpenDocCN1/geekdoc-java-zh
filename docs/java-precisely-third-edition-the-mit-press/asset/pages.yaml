    \ the try-catch-finally statement (section 12.6.6) in method m in the following\
    \ program, run with each of these command line arguments: 101 102 103 201 202\
    \ 203 301 302 303 411 412 421 422 431 432. The try clause terminates normally\
    \ on 1z, exits by return on 2z, and throws an exception on 3z and 4z. However,\
    \ when z is 2 or 3, the finally clause determines whether the statement terminates\
    \ successfully or throws an exception; see below. The catch clause ignores exceptions\
    \ on 3z but catches them on 4z. The catch clause terminates normally on 411, exits\
    \ by return on 421, and throws an exception on 431. The finally lets the try or\
    \ catch clause determine how the execution terminates, exits by return on x2 (including\
    \ on 102 and 202), and throws an exception on x3 (including on 103 and 203).\n\
    \nExits by break and continue are handled similarly to return; a more involved\
    \ example could be constructed to illustrate their interaction.\n\n```\nclass\
    \ TryCatchFinally {\n    public static void main(String[] args) throws Exception\
    \ {\n        System.out.println(Integer.parseInt(args[0]));\n    }\n\n    static\
    \ int m(int a) throws Exception {\n        try {\n            System.out.print(\"\
    try ... \");\n            if (a/100 == 2) return \"returned from try\";\n    \
    \        if (a/100 == 3) throw new Exception(\"thrown by try\");\n           \
    \ if (a/100 == 4) throw new RuntimeException(\"thrown by try\");\n        } catch\
    \ (RuntimeException x) {\n            System.out.print(\"catch ... \");\n    \
    \        if (a%100 == 2) return \"returned from catch\";\n            if (a%100\
    \ == 3) throw new Exception(\"thrown by catch\");\n        } finally {\n     \
    \       System.out.println(\"finally\");\n            if (a%10 == 2) return \"\
    returned from finally\";\n            if (a%10 == 3) throw new Exception(\"thrown\
    \ by finally\");\n        }\n        return \"terminated normally with \" + a;\n\
    \    }\n}\n```\n\n![](img/25c670a7b9eeeecd9d7d8d608e1793ba_85_0.png)"
