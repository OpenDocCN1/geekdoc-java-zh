  md: "# Generic Collections and Maps\n\n**Example 152** Worklist Algorithm\nSome\
    \ algorithms use a worklist, containing subproblems to be solved. For instance,\
    \ given a ss of Integers, compute its intersection closure: the least set tt that\
    \ ss is a subset of tt and such that for any sets s and in tt, their intersection\
    \ s∩tt is also in tt. For instance, if ss is {2,3},{1,3},{1,2}, then tt is {2,3},{1,3},{1,2},{2},{3},{1},{1}.\n\
    \nThe set tt may be computed by putting all elements of ss in a worklist, repeatedly\
    \ selecting an element from the worklist, adding it to tt and for every s in tt,\
    \ adding the intersection of s and t to the worklist if not already in tt. When\
    \ the worklist is empty, tt is intersection-closed.\n\nThe closure of a nondeterministic\
    \ finite automaton (NFA) may be computed using the same approach; see full example\
    \ 153.\n\n```\nstatic Set<Set<Integer>> intersectionSet(Set<Integer> ss) {\n \
    \   LinkedList<Set<Integer>> worklist = new LinkedHashSet<Set<Integer>>(ss);\n\
    \    Set<Set<Integer>> tt = new HashSet<Set<Integer>>();\n    while (!worklist.isEmpty())\
    \ {\n        Set<Integer> s = worklist.removeFirst();\n        for (Set<Integer>\
    \ t : tt) {\n            Set<Integer> ts = new TreeSet<Integer>(t); // ts is the\
    \ intersection of t and s\n            if (!tt.contains(ts)) {\n             \
