  md: "# Classes 25\n\n# **Example 30** Classes, Subclasses, and Overriding\n\nThe\
    \ abstract class Vessel models the notion of a vessel (for holding liquids): it\
    \ has a field representing its actual contents, an abstract method capacity for\
    \ computing its maximal capacity, and a method for filling in, but only up to\
    \ its capacity (the excess will be lost). The abstract class subclasses Tank (a\
    \ rectangular vessel), Cube (a cubic vessel, subclass of Tank), and Barrel (a\
    \ cylindrical vessel).\n\nThe subclasses implement the capacity method, inherit\
    \ the contents and the fill method from the superclass, and they override the\
    \ toString method (inherited from class Object) to print each vessel properly.\n\
    \n```\nabstract class Vessel {\n    double contents;\n    abstract double capacity();\n\
    \    void fill(double amount) {\n        contents = Math.min(contents + amount,\
    \ capacity());\n    }\n}\nclass Tank extends Vessel {\n    double length, width,\
    \ height;\n    Tank(double length, double width, double height) {\n        this.length\
    \ = length; this.width = width; this.height = height;\n    }\n    double capacity()\
    \ { return length * width * height; }\n    public String toString() {\n      \
    \  return \"tank \" + length + \" * \" + width + \" * \" + height + \";\n    }\n\
    }\nclass Cube extends Tank {\n    Cube(double side, double side, double side)\
    \ { super(side, side, side); }\n    public String toString() {\n        return\
    \ \"cube \" + (side * side * side) + \"\\n    }\n}\nclass Barrel extends Vessel\
    \ {\n    double radius, height;\n    Barrel(double radius, double height) { this.radius\
    \ = radius; this.height = height; }\n    double capacity() { return Math.PI *\
