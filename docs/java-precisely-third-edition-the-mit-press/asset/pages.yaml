  md: '# Arithmetic Operators


    The value of the postincrement x++ is that of x, and its effect is to increment
    x by 1; and similarly for decrement x--, which decrements by 1. The value of the
    preincrement expression ++ is that of x+1, and its effect is to increment x by
    1; and similarly for --x.


    Integer division e1/e2 overflow towards, rounds to zero, 10/3 is 3, and (-10)/3
    is -3. The integer division x//y equals x/(y) when y is non-zero; it has the same
    sign as x. Integer division or division by zero throws an ArithmeticException.
    Overflow does not throw an exception but around. Thus, in the int type, the expression
    2147483647+1 evaluates to -2147483648, and the expression -2147483648-1 evaluates
    to 2147483647.


    The floating-point multiplying xy equals x(((x/y))*y when y is non-zero. Floating-point
    division by zero and floating-point overflow do not produce special IEEE754 values
    (of float or double) as Infinity or NaN ("not a number")."


    # Logical Operators


    The operators == and != require the operands to be compatible: one must be a subtype
    of the other, possibly after an unboxing. Two values of primitive type are equal
    (by ==) if they represent the same value after conversion to their common supertype.
    10 and 10 are equal. Two values of reference type are equal if both are null,
    or if references to the same object or created by the same boxing operator or
    execution of the new-operator. Do not use == != to compare strings or boxes: strings
    s1 and s2 may contain the same sequence of characters and behave by String.equals(s2),
    s2 may be distinct objects and by s1==s2 (example 8). Similarly for boxed numbers
    (example 3).


    The logical operators && || perform short evaluation: if e evaluates to true in
    e1&& then e2 is evaluated to evaluate the expression; otherwise e2 is ignored,
    and the value of the expression is false. if e evaluates to false in e1|| then
    e2 is evaluated; otherwise e2 is ignored, and the value of the expression is true.
    By contrast, the operators & (logical strict and) and | (logical or) evaluate
    both operands, regardless of the left-hand operand. The shortcut operators &&
    || are preferable.


    # Bitwise Operators and Shift Operators


    The operators - (bitwise, or one''s complement) and & (bitwise and) and ^ (bitwise
    exclusive-or) and | (bitwise or) work on operands of integer type. The operators
    work in parallel on all bits of the 2''s complement representation of the operands.
    n~=(-n)-1 and also equals (-1)*n.


    The shift operators << and >>> shift the bits of the 2''s complement representation
    of the first operand. The operands are promoted (section 11.1), and the result
    is the promotion type (int or long) of the first argument. The shift operation
    is performed on a 32-bit (int) or 64-bit (long) value. In the first case, the
    length of the shift is 0 and 31 as determined by the least significant bits of
    the second; in the latter case, it is 0 and 63 as determined by the least significant
    bits of the second operand.


    The left shift n<<s equals n*2s where there are s multiplications. The right shift
    n>>s of a non-negative n equals n/2s where there are s divisions; the signed right
    shift of negative n equals (-n)/2s; the unsigned right shift n>>>s of a non-negative
    n equals n>>>; the unsigned right shift of a negative n equals (n+2)>>>s if it
    has type long, where long is the long value. See example 9 for a clearer and intricate
    use of bitwise operators.'
