  md: '# 26.11 Input-Output of Primitive Data: DataInput and DataOutput


    The interfaces DataInput (implemented by DataInputStream, ObjectInputStream, and
    RandomAccessFile) and DataOutput (implemented by DataOutputStream, ObjectOutputStream,
    and RandomAccessFile) describe operations for byte-oriented input and output of
    primitive type, such as boolean, and double. DataInput''s method readInt() is
    suitable for reading integers using DataOutput''s method writeInt(int). The data
    format is platform-independent.


    The DataInput interface describes the following methods. The read methods block
    until the required number of bytes are available, and throw EOFException if end-of-stream
    is reached.


    +   * boolean readBoolean() reads one byte and returns true if non-zero, false
    otherwise.

    * readByte() reads one byte and returns a byte in range -128...127.

    * char readChar() reads two bytes and returns a character in range 0...65535.

    * double readDouble() reads eight bytes and returns a double.

    * float readFloat() reads four bytes and returns a float.

    * void readFull(byte b[]) reads exactly b.length bytes into buffer b.

    * void readFull(byte b[]) reads n bytes into b[i..(i+n)].

    * int readInt() reads a line of characters in the range 0...255 (Not Unicode).

    * readLong() reads eight bytes and returns a long integer.

    * short readShort() reads two bytes and returns an integer -32768...32767.

    * readUnsignedByte() reads one byte and returns an integer in the range 0...255.

    * readUnsignedShort() reads two bytes and returns an integer in the range 0...65535.

    * readUTF() reads a string encoded using the Java modified UTF-8 format.

    * skipBytes(int n) skips n bytes of data and returns n.


    The DataOutput interface describes the following methods. Note writeInt(int i)
    writes four bytes representing the integer i, whereas write(int) writes one byte
    containing the lower-order bits of i.


    +   * writeByte(byte b) writes all bytes from a byte b.

    * write(byte[] b, int i, int n) writes n bytes from array b[i..(i+n)].

    * write(int v) writes eight bytes the lower-order bits of byte v.

    * writeBoolean(boolean v) writes one byte if v is true, otherwise 0.

    * writeByte(int v) writes the low-order byte (eight low-order bits) of integer
    v.

    * writeBytes(String s) writes the loworder byte of each character in s (Not Unicode).

    * writeChar(char v) writes two bytes (high-order, low-order) representing v.

    * writeChars(String s) writes the string s, two bytes per character.

