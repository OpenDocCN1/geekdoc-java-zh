  md: "Streams for Bulk Data (Java 8.0) 135\n\n# Example 168 Using a Stream Builder\
    \ to Create a Stream of Prime Numbers\n\nOne can use a stream builder to create\
    \ a stream of the first n prime numbers as shown below. This will compute the\
    \ prime numbers eagerly, that is, before anything is consumed from the stream.\
    \ The functional way to generate such a stream is much more elegant, more efficient,\
    \ and parallelizable if desired; see example 166.\n\n```\npublic static IntStream\
    \ primes(int n) {\n    IntStream.builder isb = IntStream.builder();\n    int p\
    \ = 2, count = 0;\n    while (count < n) {\n        if (isPrime(p)) {\n      \
    \      isb.accept(p);\n            count++;\n        }\n        p++;\n    }\n\
    \    return isb.build();\n}\n```\n\n# Example 169 Using a Stream Builder to Collect\
    \ Patterns\n\nThe regular expression urlPattern below matches a link a href=\"\
    link\" in a web page. Using a stream builder, one can create a stream of Links\
    \ whose elements are pairs (url, link) of the web page and each link found in\
    \ the web page. The stream is built eagerly: all links must be found before the\
    \ stream can be used.\n\n```\npublic static Stream<Link> scanLinks(Webpage page)\
    \ {\n    Matcher urlMatcher = urlPattern.matcher(page.contents());\n    Stream<Link>\
    \ links = Stream.<Link>builder();\n    while (urlMatcher.find()) {\n        String\
    \ link = urlMatcher.group(1);\n        links.accept(new Link(page.url, link));\n\
    \    }\n    return links.build();\n}\nfinal static Pattern urlPattern = Pattern.compile(\"\
    a href=\\\\(Graph\\)\\)\\*\");\n```\n\n# Example 170 Reading a Stream of Lines\
    \ from a BufferedReader\n\nA stream of text making up a web page can be obtained\
    \ by reading the web page through a BufferedReader (section 26.13) and creating\
    \ a lazy sequence<String> from the web page. The consumer of the stream determines\
    \ how much of the page will be read via the network. It might be tempting to close\
    \ the BufferedReader before returning the stream, but this is wrong and would\
    \ throw an uncheckedIOException. The BufferedReader will be in use as long as\
    \ lines are consumed from the stream, and only when the stream gets closed the\
    \ reader and input stream is closed.\n\n```\npublic static Stream<String> getPageLines(String\
    \ url) {\n    try {\n        InputStreamReader isr = new InputStreamReader(new\
    \ URL(url).openStream());\n        BufferedReader reader = new BufferedReader(isr);\n\
    \        return reader.lines();\\    } catch (IOException ex) {\n        return\
    \ Stream.<String>empty();\n    }\n}\n```\n\n*"
