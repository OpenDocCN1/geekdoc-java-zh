  md: '# 9 Classes


    # 9.1 Class Declarations and Class Bodies


    A class-declaration of class C has the form


    ```

    class-modifiers C extends-clause implements-clause

    class-body

    ```


    A declaration of class C introduces a new reference type C. The class-body may
    contain declarations of fields, constructors, nested classes, nested interfaces,
    and initializer blocks. A class declaration may take type parameters and generic;
    see section 21.4. The declarations in a class may appear in any order:


    ```

    {

    field-declarations

    constructor-declarations

    method-declarations

    class-declarations

    interface-declarations

    enum-type-declarations

    initializer-blocks

    }

    ```


    A field, method, nested class, nested interface, or nested type is called a member
    of the class. A member may be declared static. A non-static member is also called
    an instance member.


    The scope of a member is the entire class body, except where shadowed by a variable
    or by a member of a nested class or interface. The scope of a (static) field does
    not include (static) initializers its declaration. There can be no nested classes,
    interfaces, or types with the same name, and no two fields with the same name,
    but a field, method, and a class (or interface type) may have the same name.


    By static code we mean expressions and statements in field initializers, static
    initializer blocks, and static methods. By non-static code we mean expressions
    and statements in constructors, non-static field initializers, non-static initializer
    blocks, and non-static methods. Non-static code is executed inside a current object,
    which can be referred to as this (section 11.10). Static code cannot refer to
    non-static members or to, only to static members.


    # 9.2 Top-Level, Nested Classes, Member Classes, and Local Classes


    A top-level class is a class declared outside any other class or interface. A
    nested class is a declared inside another class or interface. There are two kinds
    of nested classes: a local class is declared inside a method, constructor, or
    initializer block; a member class is not. A non-static member, or a local class
    in a non-static member, is called an inner class, because an object of the inner
    class will contain a reference to an object of the enclosing class. Also see section
    9.11.


    # 9.3 Class Modifiers


    For a top-level class, the class-modifiers may be a list of public and at most
    one of abstract or final. For a member class, they may be a list of static, at
    at most one of abstract or final, and at most one of private, protected, or public.
    For a local class, they may be at most one of abstract or final.'
