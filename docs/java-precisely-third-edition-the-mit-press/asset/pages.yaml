    # 20 Threads, Concurrent Execution, and Synchronization


    # 20.1 Threads and Concurrent Execution


    The preceding chapters described sequential program execution, in which expressions
    are evaluated and statements are executed one after the other: they considered
    only a single thread of execution, where a thread is an independent sequential
    activity. A Java program may execute several threads concurrently, that is, potentially
    overlapping in time. For instance, one part of a program may continue computing
    while another is blocked waiting for input (example 108). For much on concurrency
    in Java, see [5].


    A thread is created and started using `start()` in an object of the class implementing
    the Runnable interface. A thread executes the `public void run()` in an object
    of that class implementing. Every thread (independent sequential activity) has
    a unique controlling thread, so the two are often thought of being identical.


    One way to create and run a thread is to declare a class as a subclass of `Thread`,
    overwriting its (trivial) `run()` method. Then create an object of `Thread` and
    call `start()`. This will enable the thread to execute `run()` concurrently with
    other threads (example 108).


    Alternatively, declare a class that implements Runnable, create an object of that
    class, create a `Thread` object from it and call `start()`. This will enable the
    thread to execute `run()` concurrently with other threads (example 112).


    Threads can communicate with each other through shared state, namely by using
    assigning fields, non-static fields, array elements, and pipes (section 26.16).
    By the design of Java, local variables and methods cannot be shared between threads
    and are always thread-safe.


    # States and Transitions of a Thread


    A thread is alive if it has started and has not died. A thread dies by exiting
    its `run()` method, either by returning or by throwing an exception. A live thread
    is in one of the states Ready to run, Running (actually executing), Sleeping (for
    a timeout), Waiting (for another thread to die), Locking (trying to obtain the
    lock on object), or Waiting (for notification on object). The thread state transitions
    are shown in the following table and on the figure page:


    | From State | To State | Reason for Transition |

    | --- | --- | --- |

    | Running | Enabled | System schedules thread for execution |

    | Running | Enabled | System prevents thread and schedules another one |

    | Running | Enabled | Thread executes `yield()` |

    | Running | Waiting | Thread executes `wait()`, releasing lock on o |

    | Running | Locking | Thread attempts to execute `synchronized` (o) { ... } |

    | Running | Dead | Thread executes an exception |

    | Running | Joining | Thread executes `join()` |

    | Running | Dead | Thread exited `run()` by returning or by throwing an exception
    |

    | Sleeping | Enabled | Sleeping period expired |

    | Sleeping | Enabled | Thread was interrupted, InterruptedException when running
    |

    | Joining | Enabled | Thread is being joined, or join timed out |

    | Joining | Dead | Thread was interrupted, InterruptedException when running |

    | Waiting | Enabled | Another thread calls `o.notify()` or `o.notifyAll()` |

    | Waiting | Locking | Wait for lock to be timed out |

    | Waiting | Dead | Thread was interrupted, InterruptedException when run |

    | Locking | Enabled | Thread on o became available and was given to this |


    *'
