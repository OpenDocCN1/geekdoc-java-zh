  md: '# 100 Generic Types and Methods


    # 21.10 The Raw Type


    For every type there is an underlying raw type. For a generic class C<Tl,...,Tn>
    the raw type is a non-generic class that is a subtype of all instances C<tl,...,tn>
    of the generic class C<Tl,...,Tn>. For a generic interface I<Tl,...,Tn> the raw
    type is an interface I that is a superinterface of all type instances I<tl,...,tn>
    of the generic interface I<Tl,...,Tn>.

    The raw type C is derived from the generic class by erasure as follows:


    +   - If Ti is a parameter of C<Tl,...,Tn> without a constraint, then any use
    of Ti in the body of class C is replaced by Object.

    - If Ti is a parameter of C<Tl,...,Tn> with constraints C1 & C2 & ... Cn, then
    any use of Ti in the body of class C is replaced by Ci.


    For this reason one sometimes sees constraints of the form Ti extends Object &
    C2 & ... Cn that begin with an apparently superfluous occurrence of Object.


    # 21.11 The Implementation of Generic Types and Methods


    Generic types and methods in Java resemble C++ templates and functions, as well
    as C# programming language. However, generic types and methods in Java have been
    designed to allow generics to run on the non-generic Java Virtual Machine as older
    Java programs. This design has implementations:


    +   - Only reference types, not primitive types, can be used as generic arguments.
    Thus a type parameter T must be instantiated with Integer, not int, and values
    must be wrapped as Integer objects. This boxed representation carries a certain
    overhead in execution time and space because Integer objects must be allocated
    on the heap to wrap int values, extra memory accesses are needed, and the int
    values must be unboxed before performing arithmetic or comparisons.

    - There is a single type in the run-time system to contain all the instances C<tl,...,tn>
    of a generic type C<Tl,...,Tn>, the raw type C. In particular, all objects of
    type instances have the same field layout and contain the same bytecode instructions.


    Thus at runtime, the type Pair<String, Integer> and PairDate<String, String> in
    example 118 are actually represented by the same raw Pair with fields of Object.
    This optimization opportunities exist for C++ templates and for generic methods.

    On the other hand, the existence of the raw type makes it easy for new Java generics
    to operate with legacy-generic types; this is more difficult in C# programs.


    +   - Overloading resolution of a method m or constructor does not take type arguments
    in m''s parameter types into account and does not distinguish generic and raw
    types in m''s parameter types. For example, these three methods are not considered
    distinct, and only one of them can be declared in a given scope:


    ```

    void m(List xs) { ... }

    void m(List<Integer> xs) { ... }

    void m(List<String> xs) { ... }

    ```


    +   - At runtime there is no information about the type arguments of a generic
    type or method. Type parameters can be used only to a limited extent in reflection
    and not at all in instanceof.'
