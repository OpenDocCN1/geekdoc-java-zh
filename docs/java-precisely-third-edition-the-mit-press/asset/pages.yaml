  md: "# Example 175 Generating a Stream of Permutations\n\nThe stream of all permutations\
    \ of n number 0..(n-1) can be generated by a partially generated permutation as\
    \ an integer tail, and a set todo of the numbers not used in the permutation.\
    \ If todo is empty, it is a permutation of all n numbers. Otherwise recursively\
    \ generate those permutations that can be obtained by removing an element from\
    \ tail and putting it in front. To create all n-permutations, start with an empty\
    \ tail and todo containing 0..(n-1).\n\nIntList represents immutable integer lists;\
    \ see example 182. The boxed() operation turns an IntStream into a Stream<IntList>;\
    \ so one can easily flatMap to obtain a Stream<IntList>; the flatMap method on\
    \ IntStream produces only IntStreams. The call minus(todo, r) returns a newSet\
    \ with removed.\n\n```\npublic static List<IntList> perms(BitSet todo, IntList\
    \ tail) {\n    if (todo.isEmpty())\n        return Stream.of(tail);\n    else\n\
    \        return todo.stream().boxed().flatMap(r -> minus(todo, r), new IntList(r,\
    \ tail)));\n}\n```\n\n```\npublic static List<IntList> perms(int n) {\n    BitSet\
    \ todo = new BitSet(n); todo.set(0, n); return perms(todo, null);\n```\n\n# Example\
    \ 176 Generating a Stream of Solutions to the n-Queens Problem\n\nWe augment the\
    \ permutation generator (example 175) to generate solutions to the n-queens problem:\
    \ How to place n queens on an n by n chessboard so all queens are safe from each\
    \ other. A 3-permutation such as [1,0,2] can be considered a safe placement of\
    \ 3 queens on a 3-3 chessboard, in rows 0, 1 and 2 of columns 0, 1 and 2. A solution\
    \ to the n-queens problem is a permutation further constrained by diagonals: Filter\
    \ rows r from tail that, if put, would contain an unsafe queen's position that\
    \ could attack some queen in the columns represented by tail.\n\nThis solution\
    \ is quick, fast, versatile (example 174), and trivial to parallelize because\
    \ all operations are purely functional. Putting .parallel() after filter gives\
    \ a speed-up of 3 on a 4-core i7 processor.\n\n```\npublic static List<IntList>\
    \ queens(BitSet todo, IntList tail) {\n    if (todo.isEmpty())\n        return\
    \ Stream.of(tail);\n    else\n        return todo.stream()\n            .filter(r\
    \ -> safe(tail, r)).boxed() // use .parallel() here\n            .flatMap(r ->\
    \ minus(todo, r), new IntList(r, tail)));\n}\n```\n\n```\npublic boolean safe(IntList\
    \ mid, IntList tail) {\n    return safe(mid+1, mid-1, mid+1, tail);\n}\npublic\
    \ boolean safe(int d1, int d2, IntList tail) {\n    return tail == null || !tail.item(d1)\
    \ && !tail.item(d2) && safe(d1+1, d2-1, tail);\n}\n```\n\n# Example 177 A Stream\
    \ Can Be Consumed Only One\n\nA stream can be consumed only once, so one cannot\
    \ find the standard deviation of a DoubleStream by computing its mean and sum\
    \ of its squares; instead consume both in one, as in example 180.\n\n```\nDoubleStatistics\
    \ stats = ds.summaryStatistics();\n// Fails with IllegalStateException: stream\
    \ has already been operated or closed:\ndouble square = ds.map(x -> x*x).sum();\n\
    double sd = Math.sqrt(square/getCount() - stats.getAverage()*stats.getAverage());\n\
    ```"
