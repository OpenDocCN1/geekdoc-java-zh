  md: '# 4 Types


    # 5 Types


    A type is a set of values and operations on them. A type is either a primitive
    type or a reference type.


    # 5.1 Primitive Types


    A primitive type is either boolean or one of the numeric types char, byte, short,
    int, long, float, or double. A primitive type examples literals (that is, constants),
    size in bits (where 8 bits equals 1 byte), and value range, are shown in the table
    opposite. For readability, a number constant may contain underscores (_) anywhere
    except the first and last character of the constant.


    The integer types are exact within their range. They use signed 2''s complement
    representation (except for char so when the most positive number in a type is
    max, then the most negative value is -max. The floating-point types are inexact
    and follow IEEE754, with the number of significant digits indicated by "sigdig"
    in the table. For character escape sequences such as \u0000, see page 10.


    # 5.2 Reference Types


    A reference type is a class type defined by a class declaration (section 9.1),
    or an interface type defined by an interface declaration (section 13.1), or an
    array type (section 5.3), or an enum type (chapter 14).

    A value of reference type is either null or a reference to an object or array.
    The special value null denotes "no object." The literal, denoting the null value,
    can have any reference type.


    # 5.3 Array Types


    An array type has the form t[], where t is type. An array type t[] is a reference
    type. Hence a value of array t[] is either null or a reference to an array whose
    element is precisely t (when t is a primitive type), or is a subtype of t (when
    t is a reference type).


    # 5.4 Boxing: Wrapping Primitive Types as Reference Types


    For every primitive type there is a corresponding wrapper class, which is a reference
    type. The wrapper classes are listed in the table opposite. An object of a wrapper
    contains a single value of the corresponding primitive type.


    A wrapper class used when a value of primitive type is passed to a method that
    expects a reference, or is stored in a variable or field of reference type. For
    instance, to store an int in a collection (chapter 22) one must wrap it as an
    Integer.


    The conversion from primitive to reference type is called boxing, and the opposite
    is unboxing. Boxing and unboxing are performed automatically when needed. Boxing
    and unboxing may be performed explicitly using operations such as new Integer(i)
    to box the integer i, and i.intValue() or (int)i to unbox the Integer o. If i
    is null, then unboxing of i will fail at run-time due to NullPointerException.
    Because automatic unboxing, a Boolean value may be used in conditional statements
    (if, for, while) and in logical operators (as !=, ?, ? and on); and Integer type
    wrapper classes may be used in switch statements.


    A boxed class can be unboxed to a value of the boxed type, or to a supertype.
    An Integer can be unboxed to an int or long because long is a subtype of int,
    but not to a byte, char, or short.

    The wrapper classes Byte, Integer, Long, Float, and Double have the common superclass
    Number.'
