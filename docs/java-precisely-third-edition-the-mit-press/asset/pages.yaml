    # 11.12.2 Method Call: Determining Which Method Is Called


    In general, methods may be overloaded or as overridden. The overloading is resolved
    at compile-time by finding the most applicable and accessible method signature
    for the class. Overriding (for non-static methods) is handled at run-time by searching
    the class hierarchy starting with the run-class of the object on which the method
    is called.


    # At Compile-Time: Determine the Target TC and Signature


    Find the target TC. If the method call has the form m(actual-list), the target
    TC is the innermost class containing a method called m that is visible (not shown
    by a method m, regardless of signature, in an intervening call). If the method
    call has the form super.m(actual-list), the target TC is the superclass of the
    innermost enclosing class. If the method call has the form C.super.m(actual-list),
    the target TC is the superclass of the enclosing class C. If the method call has
    the form C.m(actual-list), then TC is C. If the method call has the form o.m(actual-list),
    then TC is the expression o.


    Find the target signature. A method in TC is applicable if its signature matches
    the call signature (5.6). Whether a method is accessible is determined by its
    access modifiers (9.7). Consider the collection of methods in TC that are both
    applicable and accessible. The call is legal (unknown) if there is no such method.
    The call is illegal (ambiguous) if there is no method whose most specific signature,
    is surpassed by all of them. If the call is legal, there is exactly one most specific
    signature, and the target signature is m(a1, ..., an).


    Find applicable target signatures in two, or three stages. Stage 1, automatic
    boxing/unboxing and parameter arrays are not counted when determining whether
    a method signature subsumes the call signature. If stage 1 finds no applicable
    signatures, stage 2 is performed, now taking automatic boxing/unboxing and parameter
    array expansion into account. The effect is a preference for no boxing/unboxing
    and no array expansion, where possible; see examples 38 and 62.


    Determine whether the called method is static. If the method call has the form
    C.m(actual-list), the called method must be static. If the method call has the
    form m(actual-list) or o.m(actual-list) or super.m(actual-list), we use the target
    TC and the signature tc to determine whether the method is static or non-static.


    # At Run-Time: Determine the Target Object (Non-static) and Execute the Method


    If the method is static, no object is needed; the method is to call the method
    with signature tc in TC. If m is static in a class o.m(actual-list), the expression
    o is evaluated, but its value is ignored.


    If the method is non-static, determine the target object; this will be bound to
    the object reference this during execution of the method. In the case of m(actual-list),
    the target object is this (if TC is the innermost class enclosing the method).
    In the case of o.m(actual-list), the target object is this (if TC is an outer
    class enclosing the method). In the case of super.m(actual-list), the target object
    is C.this. In the case o.m(actual-list), the expression o must evaluate to an
    object reference. If non-null, the private class hierarchy is searched to determine
    which method to call, starting with the RTC of the target object. If the method
    has signature tc and is not found in class RTC, then the immediate super of RTC
    is searched, and so on. This search procedure is called dynamic dispatch. If the
    method is private, it must be found in the target class TC, so no search is needed.


    When the method has been determined, arguments are evaluated and described as
    in 11.12.1.'
