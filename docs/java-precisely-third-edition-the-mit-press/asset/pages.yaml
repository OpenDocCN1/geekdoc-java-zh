  md: '# 11.12 Method Call Expressions


    A method expression, or method invocation, must have one of these five forms:


    +   - m (actual-list)

    - super.m (actual-list)

    - C.m (actual-list)

    - C.super.m (actual-list)

    - o (actual-list)


    where m is a method name, C is a class name, and o is an expression of type. The
    actual-list is a possibly empty comma-separated list of expressions, called the
    arguments or actual parameters. The call signature is csgt = m(t1,...,tn), where
    ti is the list of types of the n arguments in the actual-list. The form super.m
    (actual-list) and C.super.m (actual-list) can be used only in non-static code.


    Determining what method is actually called can be complicated by: (1) method names
    may be overloaded, each version has a distinct signature; (2) methods may be overridden,
    or reimplemented in subclasses; (3) methods that are non-static and non-private
    are called by dynamic dispatch, given a target object; and (4) a method in a nested
    class may call a method declared in some enclosing class. To make the number and
    types of arguments match its signature, it may be necessary to take into account
    (1a) automatic boxing or unboxing of arguments and (1b) expansion of an array,
    if any.


    11.12.1 describes evaluation and parameter passing, when it is clear which method
    m is called. 11.12.2 describes how to determine which method is being called.


    # 11.12.1 Method Call: Parameter Passing


    This section considers the evaluation of a method call m(actual-list) when it
    is clear which method m is called, and focuses on the parameter passing mechanism.


    The call is evaluated by evaluating the expressions in the actual-list from left
    to right to obtain the argument values. These values are then bound to the preceding
    parameters in the formal-list, in order of appearance. A boxing or unboxing conversion
    (section 5.4) occurs if necessary, and a widening conversion (section 11.11) occurs
    if the type of an argument is a subtype of the corresponding parameter type.


    If the last parameter x is a array parameter t..., (section 9.9), a new array
    is created to hold those actual arguments not bound to the preceding parameters,
    and that is bound to x.


    Java uses call-by-value to bind arguments to formal parameters, where the formal
    parameter holds a copy of the value. If the method changes the value of a formal
    parameter, this change does not affect the argument. For an argument of reference
    type, the parameter holds a copy of the object reference, and here the reference
    refers to the same object as the actual expression. If the method changes that
    object or array, the changes will be visible after the method returns (example
    60).


    A non-static method is called with a target object, for as o.(actual-list), where
    the target object is the current object reference this. In case, during execution
    of the method body, this will be bound to the target object.


    A static method is not called with a target object (and there is no this in a
    static method). The method is executed.


    When the argument value is returned by the method if its return type is non-void;
    otherwise the method call has no value. When the method returns, all parameters
    and local variables in the method are discarded.'
