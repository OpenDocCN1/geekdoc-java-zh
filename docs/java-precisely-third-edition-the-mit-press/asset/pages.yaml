  md: '# 29 What Is New in Java 8.0


    Many new features have been added to the Java programming language in versions
    7.0 and 8.0, notably:


    +   - Support for functional programming through the concepts of functional interface
    (chapter 23), lambda expressions or anonymous functions (section 11.13), and method
    reference expressions (section 11.14).


    +   - Further support for function-based data processing through the concept of
    lazy streams and pipelines (chapter 24), which also improve modularity and separation
    of concerns in a way reminiscent of lazy data structures in functional languages;
    see 174.


    +   - Support for data parallel programming in the form of functional parallel
    operations on arrays (section 8.4) and parallel stream processing (chapter 24).
    In many cases, sequential data processing pipeline can be trivially turned into
    a parallel processing pipeline, provided the operations are side-effect free and
    stateless. In many cases, this improves throughput by automatically taking advantage
    of available parallel cores.


    +   - More expressive and useful interfaces through the addition of default and
    static methods on interfaces (section 13.3). In particular, this is used on the
    Comparator interface (section 22.10), the functional interfaces (chapter 23),
    and the stream interfaces (chapter 24).


    +   - The ability to indicate that an operation may not return a result, and to
    represent such missing results, also for primitive types via the Optional class
    (chapter 25).


    +   - The switch statement (section 12.4.3) now works for cases of type String.


    +   - The actual type arguments in a generic object construction may be left out
    in new ArrayList<>() if they can be inferred from context.


    +   - Integer constants in binary 0b1010; underscores permitted in number constants
    1_000.


    Most of these features are also found in the C# programming language, as shown
    by this table:


    | Feature | Section | Java 1.4 | 5.0 | 8.0 | 1.1 | 4.5 | C# |

    |---|---|---|---|---|---|---|-|

    | Looping over iterators | 22.7 | | + + + | | |

    | Enum types | 14 | | + + + | |

    | Autoboxing simple values | 5.4 | | | + + | |

    | Nullable value types/Optional | 25 | | | + + | |

    | Try-with-resources | 12.7 | | | + + | |

    | Generic types and methods | 21 | | | | | |

    | Run-time type parameter information | | | | | | |

    | Generic interface co/contravariance | | | | | | |

    | Wildcard types in generic instances | 21.9 | | + + | | |

    | Annotations (metadata, attributes) | 28 | | | | | |

    | Anonymous functions, function types | 11, 23 | | | + + | |

    | Defining streams or enumerables | 24 | | | | | |

    | Parallel array and stream processing | 8.4, 24 | | | | | | |

    | Well-defined memory model | 20.5 | | + + | | |'
