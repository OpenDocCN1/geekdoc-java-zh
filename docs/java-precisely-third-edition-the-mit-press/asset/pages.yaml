  md: '# Arrays


    An array is an indexed collection of variables, called elements. An array has
    a given length l\ge 0 and a given element type t. The elements are indexed by
    the integers 0, 1,...,l\- 1. The value of an expression array u[i] is either null
    or a reference to an array whose element type t is a subtype of u. If u is a primitive,
    then t must match u.


    # Array Creation and Access


    New array of length l with element type t is created (allocated) using an array
    creation expression:


    ```

    new t[l]

    ```


    l is an expression of type int. If type t is a primitive, all elements of the
    new array are initialized to 0 (when t is byte, char, short, int or long) or 0.0
    (when t is float or double) or false (when t is boolean). If t is a reference
    type, all elements are initialized to null.


    If l is negative, the exception NegativeArraySizeException is thrown.

    Let a be a reference of array type u[], to an array with length l and element
    type t. Then


    +   - the length of type l is the number of elements in a, that is, in a.

    - The array access a[i] denotes element i of a, counting from 0; this expression
    has type u. The integer i is called the array index. If the value of i is less
    than 0 or greater than equal to a.length, then exception ArrayIndexOutOfBoundsException
    is thrown.

    - When t is a reference type, every array assignment a[i] = checks the value of
    e is null or a reference to an object whose class C is a subtype of the element
    type t. If this is not the case, then the exception ArrayStoreException is thrown.
    This check is made before every array assignment run-time, but only for reference
    types.


    # Array Initializers


    A variable or field of array may be initialized at declaration, using an existing
    array or an array initializer is a comma-separated list of zero or more expressions
    enclosed in braces { ... }


    ```

    t[] x = { expression, ..., expression }

    ```


    The type of each expression must be a subtype of t. Evaluation of the initializer
    causes a distinct new array, whose length equals the number of expressions, to
    be allocated. The expressions are evaluated from left to right, their values are
    stored in the array, and finally the array is bound to x. Hence x cannot occur
    in the expressions: it has not yet initialized when they are evaluated.


    Array initializers also may be used in connection with array creation expressions:


    ```

    new t[] { expression, ..., expression }

    ```


    Multidimensional arrays can have nested initializers (example 22). Note that there
    are no array constants: a new distinct array is created every time an array initializer
    is evaluated.'
