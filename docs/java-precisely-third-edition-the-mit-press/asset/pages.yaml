  md: '# 26.17 Socket Communication


    Whereas a pair of Java threads can communicate through a local pipe (e.g., PipedInputStream),
    a pair of distinct processes may communicate through *sockets*. The processes
    may be on the same machine or on different machines connected by a network.


    Sockets are often used in client/server architectures, where the server process
    creates a *server socket* that listens for connections from clients. When a client
    connects to the server socket, a fresh socket is created on the server side and
    is connected to the socket that the client used when connecting to the server.
    The socket connection is used for bidirectional communication between client and
    server; both ends obtain an input stream and an output stream from the socket.


    Here are a constructor and some methods from the ServerSocket class in java.net:


    +   * `ServerSocket(int port)` creates a server socket on the given port.

    * `accept()` listens for a connection, blocking until a connection is made. Creates
    and returns a new Socket when a connection is made. If a timeout occurs, the `call`
    throws InterruptedIOException when the timeout expires.

    * `close()` closes the server socket.

    * `setSoTimeout(int timeout)` sets the timeout so that a call to `accept` will
    time out after milliseconds. Positive values disable timeout if *timeout* is zero;
    timeout is disabled by default.


    Here are a constructor and some methods from the Socket class in java.net:


    +   * `Socket(String host, int port)` creates a client socket and connects to
    a given port on the given host. The host may be a name ("localhost") or an IP
    address ("127.0.0.1").

    * `close()` closes the socket.

    * `getInetAddress()` returns the address to which this socket is connected, an
    object of java.net.InetAddress; methods `getHostName()` and `getAddress()` can
    be used to convert this to a string.

    * `getInputStream()` returns the input stream associated with this socket.

    * `getOutputStream()` returns the output stream associated with this socket.

    * `setSoTimeout(int timeout)` sets the timeout so that a call to read the input
    stream obtained from this socket will time out after milliseconds. If *timeout*
    is zero, timeout is disabled (the default). If a timeout occurs, a call to read
    throws InterruptedIOException when the timeout expires.


    The Socket and ServerSocket classes are declared in the Java class java.net. The
    class library documentation [2] provides more information about sockets and server
    sockets.'
