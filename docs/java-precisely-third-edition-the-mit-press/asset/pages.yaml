  md: '# 158 Input and Output


    # 26.9 Sequential Byte Input: InputStream


    The abstract InputStream and its subclasses (all of whom end in InputStream) are
    used for byte-oriented sequential input. They have the following methods:


    +   - int available() returns the number of bytes that can be read or skipped
    without blocking.

    - void close() closes the IO stream.

    - void mark(int limit) marks the current input position, permitting at least limit
    bytes to be read before reset.

    - boolean markSupported() returns true if the IO supports mark and reset.

    - int read() returns the byte (0..255) or -1 when none is available; returns -1
    on end-of-stream.

    - int read(byte[] b) reads at most b.length into b, blocking until at least one
    byte is available; returns the number of bytes actually read.; -1 on end-of-stream.

    - int read(byte[] b, int i, int n) reads at most n bytes at position i, blocking
    until least one byte is available, and returns the number of bytes actually read.;
    -1 on end-of-stream. Throws IndexOutOfBoundsException if i<0 or n<0 or i+n>b.length.

    - void reset resets the IO stream to the position at which the method was last
    called.

    - long skip(long n) skips at most n bytes, blocking until least one byte is available,
    and returns the number of bytes actually skipped. Returns 0 if end-of-stream is
    reached before input is available.


    The standard System.in is an InputStream; to read characters from it, create an
    InputStreamReader new InputStream(System.in); see example 190.


    # 26.9.1 Sequential Byte Input from File: FileInputStream


    A FileInputStream is an InputStream that reads sequentially from an existing file
    on the file system. It has the same methods as InputStream (section 26.9), as
    well as these constructors and method:


    +   - FileInputStream(String name) creates a byte stream and associates it with
    file name in the system. Throws FileNotFoundException if the file does not exist,
    is a directory, or cannot be opened.

    - FileInputStream(File file) works like the preceding, but associates the IO stream
    with file.

    - FileInputStream(File fd) works the same, but associates the IO stream with fd.

    - Descriptor getFD() returns the file descriptor associated with this stream.


    # 26.9.2 Sequential Binary Input of Primitive Data: DataInputStream


    DataInputStream provides methods for machine-independent binary input of Java
    primitive types such as int and double. The class implements the DataInput interface
    (section 26.11) and in addition this constructor and static method:


    +   - DataInputStream(InputStream in) creates a DataInputStream that reads from
    io stream is.

    - static readUTF(DataInput in) reads a UTF-8 encoded string from io stream in.


    DataInputStream also has a readLine method, which is deprecated. To read lines
    of text from a Data-InputStream, create an InputStreamReader(section 26.4) from
    it instead.'
