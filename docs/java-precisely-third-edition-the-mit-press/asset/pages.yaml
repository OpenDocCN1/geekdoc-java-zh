  md: "# Example 93 Three Interface Declarations\n\nThe Colored interface describes\
    \ method getColor, interface Drawable describes method draw, and Colored-Drawable\
    \ describes both. The methods are implicitly public.\n\n```\nimport java.awt.*;\n\
    interface Colored { Color getColor(); };\ninterface Drawable { void draw(Graphics\
    \ g); };\ninterface ColoredDrawable extends Colored, Drawable { }\n```\n\n# Example\
    \ 94 Classes Implementing Interfaces\n\nThe methods getColor and draw must be\
    \ public in the interface declarations (example 93).\n\n```\nclass ColoredPoint\
    \ extends Point implements Colored {\n  Color c;\n  ColoredPoint(int x, int y,\
    \ Color c) { super(x, y); this.c = c; }\n  public Color getColor() { return c;\
    \ }\n}\nclass ColoredDrawable extends ColoredPoint implements ColoredDrawable\
    \ {\n  ColoredPoint(int x, int y, Color c) { super(x, y, c); }\n  public void\
    \ draw(Graphics g) { g.fillRect(x, y, i1, i1); }\n}\nclass ColoredRectangle implements\
    \ ColoredDrawable {\n  int x1, y1, y2, y2; // (x1, y1) upper left, (x2, y2) lower\
    \ right corner\n  Color c;\n  ColoredRectangle(int x1, int y1, int x2, int y2,\
    \ Color c) {\n    this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2; this.c\
    \ = c;\n  }\n  public Color getColor() { return c; }\n  public void draw(Graphics\
    \ g) { g.draw(x1, y1, x2-x1, y2-y1); }\n}\n```\n\n# Example 95 Using Interfaces\
    \ as Types\n\nA Colored value has a getColor method, a ColoredDrawable value has\
    \ a getColor method and a draw method:\n\n```\nstatic void printcolors(Colored[]\
    \ cs) {\n  for (int i=0; i<cs.length; i++) {\n    System.out.println(cs[i].getColor().toString());\n\
    \  }\n}\nstatic void draw(Graphics g, ColoredDrawable[] cs) {\n  for (int i=0;\
    \ i<cs.length; i++) {\n    g.setColor(cs[i].getColor());\n    cs[i].draw(g);\n\
    \  }\n}\n```"
