    # 22.11 The Utility Class Collections


    java.util.Collections provides static utility methods. The methods binarySearch,
    max, min, and sort also have versions that take an Comparator<?T> argument and
    use it to compare elements.


    There are static methods similar to synchronizedList and unmodifiableList for
    creating a synchronized or unmodifiable view of a Collection, Set, SortedMap,
    or SortedMap.


    +   * static <T extends Comparable<?>> int binarySearch(List<? extends T> lst,
    T o) returns i>=0 if lst.get(i) is equal to o, if any; otherwise returns i<0 that
    (-i-1) would be the position for k. This is fast for ArrayList but slow for LinkedList.
    The list must be sorted, or by sort(list).

    * static <T> void copy(List<? super T> dst, List<? extends T> src) adds all elements
    from src to dst, in order.

    * static <T> enumeration(Collection<? extends T> coll) returns an enumeration
    of coll.

    * static <T> void fill(List<T> lst, T o) sets all elements of list to o.

    * static <T extends Comparable<?>> T max(Collection<? extends T> coll) returns
    the greatest element of coll. Throws NoSuchElementException if coll is empty.

    * static <T extends Comparable<?>> T min(Collection<? extends T> coll) returns
    the least element of coll. Throws NoSuchElementException if coll is empty.

    * static <T> List nCopies(int n, T o) returns an unmodifiable list with n copies
    of o.

    * static <T> boolean replaceAll(List<? super T> lst, T o1, T o2) replaces all
    elements equal to o1 by o2 in lst; returns true if any element was replaced.

    * static <T> void reverse(List<T> lst) reverses the order of the elements in list.

    * static Comparator reverseOrder() returns a comparator that is the reverse of
    the natural ordering by compareTo elements or keys.

    * static <T> void rotate(List<T> lst, int d) rotates list by d positions, so -d
    rotates left by one position. Rotates if applied to a sublist (see 22.2).

    * static <T> void shuffle(List<T> lst) randomly permutes the elements of list.

    * static <T> void shuffle(List<T> lst, Random rand) randomly permutes the elements
    of list using generate random numbers.

    * static <T> Set<T> singleton(T o) returns an unmodifiable set containing only
    o.

    * static <T> List<T> singleton(T o) returns an unmodifiable list containing only
    o.

    * static <K,V> Map<K,V> singletonMap(K k, V v) returns an unmodifiable map containing
    only the entry (k, v).

    * static <T extends Comparable<?>> void sort(List<? super T> lst) sorts list using
    mergesort and the natural element ordering. This sorting algorithm is fast and
    stable on all lists.

    * static <T> void swap(List<T> lst, int i, int j) exchanges the list elements
    at positions i and j. It throws IndexOutOfBoundsException 0 <= i and j < lst.size().

    * static <T> synchronizedList(List<T> lst) returns a synchronized view of list.

    * static <T> unmodifiableList(List<T> lst) returns an unmodifiable view of list.


