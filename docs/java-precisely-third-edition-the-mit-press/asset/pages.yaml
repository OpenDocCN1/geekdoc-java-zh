  md: "# Example 164 Creating Finite Streams\n\nA finite sequential stream can be\
    \ created by enumerating its elements, from an array, or from a collection as\
    \ a set:\n\n```\nIntStream is = IntStream.of(2, 3, 5, 7, 11, 13);\n```\n\n```\n\
    String[] a = { \"Hoover\", \"Roosevelt\", \"Truman\", \"Eisenhower\", \"Kennedy\"\
    \ };\nStream<String> presidents = Arrays.stream(a);\n```\n\n```\nCollection<String>\
    \ coll = new HashSet<String>();\ncoll.add(\"Denmark\"); coll.add(\"Norway\");\n\
    Stream<String> countries = coll.stream();\n```\n\n# Example 165 Creating Infinite\
    \ Stream of Prime Numbers\n\nOne can create an infinite sequential stream using\
    \ nats of the numbers starting with 0 and adding 1 to each successive element,\
    \ using the iterate method. One can then create an infinite stream of prime numbers\
    \ (a number divisible only by 1 and itself) by filtering the stream of prime numbers.\
    \ Simple and efficient.\n\n```\nIntStream nats = IntStream.iterate(0, x -> x+1);\n\
    IntStream primes = nats.filter(x -> isPrime(x));\n```\n\n# Example 166 Creating\
    \ a Stream of Prime Numbers\n\nThe simplest way to create a finite sequential\
    \ stream of the first n prime numbers is to create an infinite stream, as in example\
    \ 165, and then use limit to find the n elements\n\n```\npublic static IntStream\
    \ IntPrime(int n) {\n  return IntStream.iterate(0, x -> x+1).filter(x -> isPrime(x)).limit(n);\n\
    }\n```\n\n# Example 167 Counting Prime Numbers: Sequential, Imperative Loop, and\
    \ Parallel Stream\n\nOne can count the prime numbers less than 10 by this parallel\
    \ stream. The pipeline integrates the integers between 0 and 10, tests whether\
    \ each of them is a prime, throws the non-primes, and counts the result:\n\n```\n\
    IntStream.range(0, 10_000_000).filter(i -> isPrime(i)).count()\n```\n\nSince the\
    \ numbers are lazily generated, this uses very little memory, and in fact the\
    \ above stream expression is just as fast as a classic-efficient imperative loop:\n\
    \n```\nint count = 0;\nfor (int i = 0; i < 10_000_000; i++) {\n  if (isPrime(i))\n\
    \    count++;\n```\n\nThe real advantage of the stream pipeline is that it is\
    \ trivial to parallelize: just insert .parallel(), then the prime testing and\
    \ counting using any available parallel processor cores. The version below is\
    \ four times faster than the imperative on a 4-core laptop, and sixteen times\
    \ faster than the imperative loop on a 32-core system. Parallelizing the imperative\
    \ loop is vastly more costly and less efficient.\n\n```\nIntStream.range(0, 10_000_000).parallel().filter(i\
    \ -> isPrime(i)).count()\n```"
