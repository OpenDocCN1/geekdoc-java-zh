  md: '# 104 Generic Collections and Maps


    # 22.1 Interface Collection<T>


    The Collection<T> extends the Iterable<T> interface (22.7) and describes these
    methods:


    +   - boolean add(T o) adds element o to the collection; returns true if the element
    was added, false if the collection disallows or contains an element equal to o
    already.

    - boolean addAll(Collection<? extends T>) adds all elements of coll to the collection;
    returns true if any element was added.

    - void clear() removes all elements from the collection.

    - boolean contains(Object o) returns true if any element of the collection equals
    o.

    - boolean containsAll(Collection<?> coll) returns true if the collection has all
    coll''s elements.

    - boolean isEmpty() returns true if the collection has no elements.

    - Iterator<T> iterator() returns an iterator (22.7) over the elements of the collection.

    - boolean remove(Object o) removes a single instance of o from the collection;
    returns true if the collection contained such an element.

    - boolean removeAll(Collection<?>) removes all elements that are also in coll;
    returns true if any element was removed. After this operation, no element equals
    an element of coll.

    - default boolean removeIf(Predicate<? p) removes, in iteration, elements x for
    which p.test(x) returns true; true if any element was removed.

    - boolean retainAll(Collection<?> coll) returns only those elements that are also
    in coll; returns true if any element was removed. After this operation, every
    element equals an element of coll.

    - int size() returns the number of elements in the collection.

    - default Stream<T> parallelStream() returns a parallel stream containing the
    elements of this collection''s elements.

    - default Stream<T> stream() returns a sequential stream containing the elements
    of the collection.

    - Object[] toArray(T[] a) returns a new array containing all the elements of the
    collection, but the returned array''s type is the type of the given array a. Moreover,
    the elements are returned in the given array if a.length == size(), in a newly
    created array.


    The element T must be a reference type, so values of primitive type as int must
    be boxed (Integer) when inserted and retrieved; in Java this is done automatically
    (5.4).


    A view of a collection col is another collection co2 that refers to the same data
    structure. As consequence, modifications to col immediately affect co2, and modifications
    to co2 immediately affect col. An unmodifiable collection does not admit modification:
    the operations clear, remove, set, and so on throw UnsupportedOperationException.
    The class Collections (22.11) provides methods to create an unmodifiable view
    of a given collection.


    A synchronized collection is thread-safe: several concurrent threads can safely
    access and modify it. For efficiency, the standard collection classes are not
    synchronized, and concurrent modification of a collection may make its internal
    state inconsistent. The utility Collections (22.11) provides static methods to
    create a synchronized view of a given collection. All concurrent access to a collection
    should go through its synchronized view.'
