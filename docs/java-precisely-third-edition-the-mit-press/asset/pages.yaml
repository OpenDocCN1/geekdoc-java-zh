  md: '# Running Java: Compilation, Loading, and Execution


    Before a Java program is executed, it must be compiled and loaded. The compiler
    checks that the Java program is legal: the program conforms to the Java syntax,
    that operators (such as +) are applied to operands (such as 5 and x) of the correct
    type, and so on. If, the compiler generates class files. Execution extends the
    class files. Running a Java program involves three stages: compilation (checks
    that the program is well-formed), loading (loads and initializes classes), and
    execution (runs the code). This also holds for a program run from integrated development
    environments such as Eclipse or IntelliJ.


    # Names and Reserved Names


    A legal name (of a variable, method, field, parameter, class, interface or package)
    starts with a letter or sign ($) or underscore (_), and continues with zero or
    more letters or digits or underscores (0–9). Avoid avoid characters in names and
    interfaces. Uppercase and lowercase letters are considered distinct. A legal name
    cannot be one of the following reserved names:


    ```

    abstract else for interface switch try

    assert class enum goto public synchronized void

    boolean const if native return volatile

    break continue false implements new short while

    byte default import null static throws

    case do finally instanceof package strictfp transient

    catch double int private super true

    ```


    # Java Naming Conventions


    The following naming conventions are often followed, although not enforced by
    Java:


    +   * If a name is composed of several words, each word (except possibly the first
    one) begins with an uppercase letter. Examples: setLayout, addLayoutComponent.

    * Names of variables, fields, and methods begin with a lowercase letter. Examples:
    vehicle, myVehicle.

    * Names of classes and interfaces begin with an uppercase letter. Examples: Cube,
    ColorCube.

    * Named constants (such as final static fields and enum values) are written entirely
    in uppercase, and the parts of composite names are separated by underscores (_).
    Example: CENTER, MAX_VALUE.

    * Package names are sequences of dot-separated lowercase names. Example: java.awt.event.
    For uniqueness, they are often prefixed with reverse domain names, as in com.sun.xml.util.


    # Comments and Program Layout


    Comments have no effect on the execution of the program but may be inserted anywhere
    to help humans understand the program. There are two forms: one-line comments
    and delimited comments.

    Program layout has no effect on the computer''s execution of the program but is
    used to help humans understand the structure of the program.'
