  md: '# 21.7 Generic Interfaces


    A declaration of a *generic interface* I<T1,...,Tn> has this form:


    ```

    interface-modifiers interface I<T1,...,Tn> extends-clause

    interface-body

    ```


    The *T1,...,Tn* are type parameters as for generic classes (section 21.4), and
    the *interface-modifiers*, *extends-clause*, and *interface-body* are as for non-generic
    interfaces (section 13.1). Each type parameter *Ti* may have type parameter constraints
    just as for a generic class; see section 21.5.


    A type instance of the generic interface has form I<t1,...,tn> where the *t1,...,tn*
    are types. The types *t1,...,tn* must satisfy the parameter constraints, if any,
    on the generic interface I<T1,...,Tn> as described in section 21.5.


    +   A generic interface is a subinterface of the interfaces mentioned in its *extends-clause*.
    Like a generic class, a generic interface is not covariant in its type parameters.
    That is, I<String> is not a subtype of I<Object>, although String is a subtype
    of Object.'
