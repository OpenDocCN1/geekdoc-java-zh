  md: '# 20 Arrays


    Methods on utility class Arrays continued:


    +   - static <T> void parallelPrefix(T[] a, BinaryOperator<T> op) performs a parallel
    prefix operation on array using a operator op, by computing new anew[i] and subsequently
    assigning the result to a''s elements. The new value anew[0] is a[0]. for i>0
    the new value anew[i] is the result of op.apply(anew[i-1],a[i]) in some order,
    and possibly in parallel. The operation makes sense only if op is associative
    and stable-free; see section 23.1.

    - static <T> void parallelPrefix(T[] array, int from, int to, BinaryOperator<T>
    op) performs a parallel prefix operation as above, but on the subarray[from..(to-1)]
    using op.

    - Both of these methods are overloaded also on double[], int[] and long[], taking
    an argument of type [Double.Int.Long] BinaryOperator.

    - static <T> void parallelSetAll(T[] a, IntFunction<T> f) initializes all of the
    specified array, in parallel, computing element[i] as f.apply(i).

    - Overloaded on double[], int[] and long[], taking f argument of type IntToDoubleFunction,
    IntUnaryOperator, and IntToLongFunction.

    - static <T> void parallelSort(T[] a) sorts a array into numerical order, using
    parallel sort.

    - static <T> void parallelSort(byte[] a, int from, int to) sorts array[from..(to-1)]
    into ascending numerical order.

    - static <T extends Comparable<T>> void parallelSort(T[] a) sorts a array into
    ascending order, according to the natural ordering of its elements.

    - static <T extends Comparable<T>> void parallelSort(T[] a, int from, int to)
    sorts subarray[from..(to-1)] into ascending order, according to the natural ordering
    of its elements.

    - static <T> void parallelSort(T[] a, int from, int to, Comparator<? super T>
    cmp) sorts array[from..(to-1)] in the order specified by cmp.

    - static <T> sort(byte[] a) sorts the array using quicksort, which is not stable.

    - static <T> void sort(Object[] a) sorts the array using merge sort, with the
    preceding elements are compared using the method compareTo method (section 22.9).

    - static <T> sort(T[] a, Comparator<? extends T> cmp) works like the preceding
    method, but elements are compared using the method cmp.compare(section 22.9).
    Is stable.

    - static <T> sort(byte[] a, int from, int to) sorts a[from..(to-1)].

    - static <T> sort(Stream<T> stream) returns a sequential stream containing the
    elements of a.

    - static <T> sort(Stream<T> stream, T[] array, int from, int to) returns a sequential
    stream containing the elements of subarray[from..(to-1)].


    The last two methods are overloaded also on double[], int[], and long(), producing
    streams of type [Double.Int.Long] Stream.'
