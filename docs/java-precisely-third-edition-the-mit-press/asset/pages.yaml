  md: "# 12.5.3 The while Statement\n\nA while statement has the form\n\n```\nwhile\
    \ (condition)\nbody\n```\n\nwhere condition is an expression of type boolean or\
    \ Boolean, and body is a statement. It is executed as follows:\n\n+   1. The condition\
    \ is evaluated. If it is false, the loop terminates.\n2. If it is true, then\n\
    \   a. The body is executed.\n   b. Execution continues at (1).\n\nJust after\
    \ the loop, the negation of condition must hold (unless the loop is exited by\
    \ break). This fact provides useful information about the program's state after\
    \ the loop: see example 80.\nWhen a loop invariant—property that always holds\
    \ at the beginning and end of the loop body—is known as well, one can combine\
    \ it with the negation of the condition to get information about the program's\
    \ state after the while loop. This helps in understanding short but subtle loops;\
    \ see example 81.\n\n# 12.5.4 The do-while Statement\n\nA do-while statement has\
    \ the form\n\n```\ndo\nbody\nwhile (condition);\n```\n\nwhere condition is an\
    \ expression of type boolean or Boolean, and body is a statement. The body is\
    \ executed at least once, because the do-while statement is executed as follows:\n\
    \n+   1. The body is executed.\n2. The condition is evaluated. If it is false,\
    \ the loop terminates.\n3. If it is true, then execution continues at (1).\n\n\
    Hence the do-while statement above is equivalent to the following statement using\
    \ while:\n\n```\nbody\nwhile (condition)\nbody\n```\n\nSo a do-while statement\
    \ does not test the loop condition before the first execution of the loop body.\
    \ Mistakenly using a do-while statement where a while statement has been used\
    \ leads to program errors. Errors are discovered only when some day the program\
    \ encounters an empty input file, a zero-element set from a database, or a similar\
    \ borderline situation.\n\nTherefore you usually prefer while over do-while. But\
    \ there are cases where do-while is more natural; see example 83."
