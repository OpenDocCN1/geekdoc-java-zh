  md: '136 Streams for Bulk Data (Java 8.0)


    # 24.3 Methods on Streams


    Interface<T> from package java.util.stream has methods for creating, further processing,
    or continuing streams. In the descriptions below, the elements of a stream are
    denoted x1, x2, ..., and in general. For brevity we have simplified some types
    in the method signatures, as explained in section 23.4.


    +   - boolean allMatch(Predicate<T> p) returns true if p.test(xi) is true for
    all elements, else false.

    - boolean anyMatch(Predicate<T> p) returns true if p.test(xi) is true for some
    element, else false.

    - static <T> Stream.Builder<T> builder() returns a builder for a Stream<T>; see
    section 24.2.

    - void close() closes this stream, closing all handlers for this stream pipeline
    to be called.

    - R collect(Collector<?T,A,R> collor) performs a mutable reduction operation on
    the stream using the collector; see section 24.6. Interfaces [Double.Int.Long]
    Stream do not have this method.

    - R collect(Supplier<R> sup, BiConsumer<R,T> accumulate, BiConsumer<R,R> combine)
    performs a mutable reduction operation using the collector components; see section
    24.6 and example-186.

    - static <T> Stream<T> concat(Stream<? extends T> xs, Stream<? extends T> ys)
    creates a lazy stream where the elements of xs are followed by the elements of
    ys.

    - long count() returns the number of elements in this stream.

    - Stream<T> distinct() returns a stream without duplicate elements, as determined
    by x.equals(y).

    - static <T> Stream<T> empty() returns an empty sequential stream.

    - Stream<T> filter(Predicate<T> p) returns a stream of the xi for which p.test(xi)
    is true.

    - Optional<T> findAny() returns an Optional containing any element from the stream
    if not-empty; otherwise returns an Optional (see section 25).

    - Optional<T> findFirst() returns an Optional containing the first element of
    the stream if not-empty; otherwise returns an Optional.

    - <R> Stream<R> flatMap(Function<T,Stream<R>> f) returns a stream of elements
    from f.apply(x1), f.apply(x2), ..., to produce a sequence of elements, and flattening
    the result into one. The primitive-specialized methods flatMap(Double,Int,Long)
    correspond primitive streams of type [Double.Int.Long].Stream

    - void forEach(Consumer<T> cons) performs cons.accept(xi) on the elements of this
    stream.

    - void forOrdered(Consumer<T> cons) performs cons.accept(xi) on the elements of
    this stream, in encounter order.

    - static <T> Stream<T> generate(Supplier<T> supp) returns an infinite unordered
    stream resulting from the call sequence sup.get(0), supp.get(1), ..., where supp
    is possibly stated. Note that unlike iterators (section 27.2), there is no way
    to indicate end-of-stream.

    - boolean isParallel() returns true if this is a parallel stream, otherwise false.

    - static <T> Stream<T> iterate(T x0, UnaryOperator<T> f) returns an infinite ordered
    stream where elements are r0=x0, r1=f.apply(r0), r2=f.apply(r1),...

    - Iterator<T> iterator() returns an iterator for the elements of this stream.

    - Stream<T> limit(long n) returns a stream of at most the first n elements of
    this stream.


    *'
