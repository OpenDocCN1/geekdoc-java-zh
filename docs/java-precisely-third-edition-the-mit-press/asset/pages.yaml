  md: '# 21.8 Generic Methods


    A generic method is a method that takes one or more type parameters. A generic
    method may be declared inside a generic or non-generic class or interface.


    A declaration of a generic method<T1,...,Tn> has this form:


    ```

    method-modifiers <T1,...,Tn> returnype m(formal-list)

    method-body

    ```


    The method-modifiers, returnype, and formal-list are as as for non-generic methods
    (section 9.8). The main syntactic difference is that a generic method has a list
    of type T1,...,Tn before its returnype. Each type parameter Ti may have type parameters
    constraints just as for a generic class; see section 21.5.


    The parameters T1,...,Tn may be used as types in the returnype, formal-list, and
    method-body, as may the type parameters of an enclosing class if the method is
    non-static. A type parameter Ti of a generic method may have the same name as
    a type parameter of an enclosing class.


    Generic methods of the same name are not distinguished by their number of generic
    type parameters, and a generic method is not distinguished from a non-generic
    method of the same name. For example, these three methods


    ```

    void m() { }

    <T> void m() { ... }

    <T,U> void m() { ... }

    ```


    are not considered, and at most one of them can be declared in a given scope.

    If a generic method overrides a generic method declared in a superclass or implements
    a generic method described in an interface, it must have the same parameter constraints
    as those methods T1,...,Tn. Names of the type parameters are not significant;
    only their order in the parameter list T1,...,Tn matter.

    A call of a generic method can be written without type arguments as in m(..),
    or with explicit type arguments as in <t1,...,tn>(..). In the former, the compiler
    will infer the appropriate type arguments automatically. Type constraints are
    not taken into account during such inference, but are satisfied by the resulting
    type arguments t1,...,tn when inference is successful.

    Explicit generic methods can be called in four of the syntactic forms of method
    call (section 11.12):


    +   o.<t1,...,tn>m(actual-list)

    super.<t1,...,tn>m(actual-list)

    C.<t1,...,tn>m(actual-list)

    C.super.<t1,...,tn>m(actual-list)


    Note to give type arguments to a static method m in class C, one must explicitly
    prefix the method call with the class name, as C.<t1,...,tn>m(..). Similarly,
    to give type arguments to an instance method in the current object, one must explicitly
    prefix the method call with the current object reference, as in this.<t1,...,tn>m(..).
    In any case, either or none type arguments must be used.'
