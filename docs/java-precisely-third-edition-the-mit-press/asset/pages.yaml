    # 19 String Builders and String Buffers


    A String object, once created, cannot be modified. Using s1 + s2, one can append
    another string s2 to s1, but creates a new string object, copying all the characters
    from s1 and s2; there is no way to extend s1 itself by appending more characters
    to it. To concatenate n strings of length k by repeated string concatenation (+),
    copy k+2+3k+...+nk=kn(n+1)/2, and the time required to do this is proportional
    to kn², which grows rapidly as n grows.


    String builders, which are objects of the predefined class java.lang.StringBuilder,
    provide extensible and modifiable strings. Characters can be appended to a string
    builder without copying characters already in the string; the builder is automatically
    extended as needed. To concatenate n strings of length k using a string builder
    requires only time per character, consider for large n. To build easily using
    a string builder, this is needed for repeated concatenation in a loop, as in example
    9. The string s1 + ... + sn is efficient; it actually means

    new StringBuilder().append(s1)...append(sn).toString();

    Let sb be a StringBuilder, s a String, and v an instance of type.


    +   * StringBuilder() creates a new empty string builder.

    * sb.append(v) appends the string representation of the value v to the string
    builder, converting v by sb.valueOf(v); see chapter 7. Extends sb as needed. Returns
    sb.

    * sb.charAt(int i) returns the character i (counting from zero) from the string.
    throws IndexOutOfBoundsException if i<0 or i>=sb.length().

    * sb.delete(start, end) deletes the characters from index start..end, reducing
    its length by end-start characters. Throws IndexOutOfBoundsException if from<0
    or to>sb.length(). Returns sb.

    * sb.insert(int offset, Object v) inserts the inserts the string representation
    of v by String.valueOf(v) into the string builder, starting at position, extending
    sb as needed. Throws IndexOutOfBoundsException if offset<0 or offset>sb.length().

    * sb.length() returns the length of sb, which is, the number of characters currently
    in sb.

    * sb.replace(int start, int end, String str) replaces the characters with index
    start..end in the string s, extending sb if needed. Throws IndexOutOfBoundsException
    if from<0 or to>sb.length(). Returns sb.

    * sb.reverse() reverses the sequence in the string builder. Returns sb.

    * sb.setCharAt(int i, char c) sets the character at index i to c. Throws IndexOutOfBoundsException
    if i<0 or i>=sb.length().

    * sb.toString() returns a String containing the characters currently in sb.

    * Method append is fast, but delete, insert, and replace may be slow when they
    need to move large parts of the string builder—when both from and to are much
    smaller than length().


    A StringBuffer has the same methods as a StringBuilder, but is thread-safe: several
    concurrent threads (char) can safely modify the same string buffer. Both classes
    implement the Appendable and CharSequence interfaces (26.7). More StringBuffer
    methods are described in the Java class library documentation [2].'
