  md: '# 26.14 Random Access Files: RandomAccessFile


    RandomAccessFile is used for input and output to random access files. The data
    in a random access file can be accessed in any order, in contrast to IO streams,
    which can be read and written sequentially from the beginning. Thus a random access
    file is similar to an extensible byte array on the file system. A random access
    file has an associated file pointer, which determines where the read or write
    operation begins. The file pointer permits random access to all parts of the file
    (albeit thousands or millions of times slower than a byte array stored in memory).
    For example: the first byte in a file `raf` has 0; the last byte has `raf.length()-1`.
    The method `seek(pos)` sets the file pointer to point at byte pos.

    ClassAccessFile implements the DataInput and DataOutput interfaces (section 26.11)
    and has the following constructors and additional methods. The methods `read(byte[])`,
    and `read(byte)`, as InputStream (section 26.9); return -1 on end-of-file, and
    block until at least one byte is available. The methods `read(t)`, where `t` is
    a type, as DataInput (26.11); in particular, they throw EOF on end-of-file.


    +   - RandomAccessFile(File name, String mode) creates a new random access file
    and associates with the file of the name on the file system. The file pointer
    is offset at 0. Throws IOException if the name indicates a directory. The mode
    must be "r" for read-only, or "rw" for read-write; otherwise IllegalArgumentException
    is thrown. If the file does not exist on the file system, then FileNotFoundException
    is thrown. If the mode is "rw", then a new file is created if possible. If the
    mode is "r", any of the write methods will throw IOException.

    - RandomAccessFile(File file, String mode) works like the preceding, but associates
    the random access stream with file stream.

    - close() closes the file stream.

    - FileDescriptor getFD() returns the file descriptor associated with the stream.

    - long getPointer() returns the current value of the file pointer.

    - long length() returns the length of the file in bytes.

    - int read() reads one byte, as in InputStream.

    - int read(byte[] b) reads into array b, as in InputStream.

    - int read(byte[] b, int i, int n) reads at most n bytes into b, as in InputStream.

    - void seek(long pos) sets the file pointer to byte number pos. If set beyond
    end-of-file; a subsequent write will extend the file''s length.

    - void setLength(long len) sets the length of the file by truncating or extending
    it at the end; in case of extension, the content of the extension is undefined.'
