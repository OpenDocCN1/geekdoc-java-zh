  md: '# Reflection: The Field Class


    An object of Field from package java.lang.reflect represents a static or non-static
    field in a class or interface. It supports the following operations:


    +   * Object get(Object o) returns the value of the field (in object o if an instance
    field).

    * int getModifiers() returns the modifiers of the field; see example 212.

    * String getName() returns the name of the field.

    * Class getType() returns the type of the field.

    * Class DeclaringClass() returns the class containing the field''s declaration.

    * void set(Object o, Object v) sets the value of the field to v (in object o if
    an instance field).


    # Reflection: The Method Class and the Constructor<T>


    An object of Method from package java.lang.reflect represents a static or non-static
    method and supports the following operations:


    +   * getName() returns the name of the method.

    * Class[] getParameterTypes() returns the formal parameter types of the method.

    * Class[] getExceptionTypes() returns the exception classes listed in the method''s
    throws clause.

    * Class DeclaringClass() returns the class containing the method''s declaration.

    * int getModifiers() returns the modifiers of the method.

    * Class getReturnType() returns the method''s declared type.

    * Object invoke(Object o, Object... args) invokes the method on object o, passing
    the arguments, and returns the result of the method, or null if the method is
    void. If the method is static, then o is ignored and may be null; if the method
    is non-static, then o must be non-null and becomes the current object reference
    in this method.

    * boolean isVarArgs() returns true if the method has a variable argument section.)


    An object of Constructor<T> from package java.lang.reflect represents a constructor
    of class, and permits creation of objects of that class. Constructor<T> supports
    the same operations as Method, except for getReturnType(), and this has additional
    operation:


    +   * newInstance(Object... args) returns a new object of the constructor''s class.
    The expression has type T when the constructor has Constructor<T>, and it has
    type Object when the constructor has (raw) type Constructor. Note that newInstance
    has variable variability.


    # Exceptions Thrown Using Reflection


    Operations on a Class, Method, or Constructor may throw IllegalAccessException(field,
    method, or constructor is inaccessible), or IllegalArgumentException(when type
    of object is when using an instance field or method; or argument type when getting
    or setting a field); or InstantiationException(the called constructor invokes
    an abstract class); or InvocationTargetException(an invoked method throws an exception);
    or NoSuchFieldException(the given object reference o is null when using an instance
    field or method).'
