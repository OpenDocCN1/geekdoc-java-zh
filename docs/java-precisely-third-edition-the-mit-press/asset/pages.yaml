  md: "# Example 201 Organizing a String File for Random Access\n\nThis example shows\
    \ a way to implement random access to large numbers of texts, as millions of cached\
    \ Web pages or millions of DNA sequences. We define a string file with three parts:\
    \ (1) a sequence of Strings, which is in Java defined UTF-8 format; (2) a sequence\
    \ of integers, representing the offsets of the strings; and (3) an integer, which\
    \ is the number of strings in the file. (Note Java limits the length of each UTF-8\
    \ encoded string, using a slightly more complicated representation in the file,\
    \ we could lift this restriction)\n\nBy putting the number of strings and the\
    \ offset table at the beginning of the file we do not need to know the number\
    \ of strings or the length of each string before writing the file. The strings\
    \ can be written to the file incrementally, and the only structure we need to\
    \ keep in memory is the (ArrayList) of string lengths.\n\nwriteStrings takes as\
    \ argument filename and a string generator in the form of Iterable<String>. The\
    \ first (enhanced) for statement creates an Iterator<String> from the iterable,\
    \ and writes the strings produced by the iterator to the file storing the offsets\
    \ in the offset table. The second (enhanced) for statement writes the offsets\
    \ to the file.\n\n```\nstatic void writeStrings(String filename, Iterable<String>\
    \ stringGenerator)\n    throws IOException {\n        RandomAccessFile raf = new\
    \ RandomAccessFile(filename, \"rw\");\n        raf.setLength(0);\n        ArrayList<Long>\
    \ offsettable = new ArrayList<Long>(); // truncate the file\n        for (String\
    \ s : stringGenerator) {\n            offsettable.add(raf.getFilePointer()); //\
    \ store string offset\n            raf.writeUTF(s); // write string\n        }\n\
    \        for (long offset : offsettable) {\n            raf.writeLong(offset);\n\
    \        }\n        raf.writeInt(offsettable.size()); // store string count\n\
    \        raf.close();\n    }\n```\n\n# Example 202 Random Access Reads from a\
    \ String Array File\n\nThe method call readString(f, i) reads string i from a\
    \ string array file f (example 201) in three stages, using three calls to seek.\
    \ Since an int takes 4 bytes and a long takes 8 bytes the offset table must begin\
    \ at position length(f)-4*N, so the offset si of string number i can be read from\
    \ position length(f)-4*N+8*i. The string itself is read from offset si.\n\n```\n\
    static String readString(String filename, int i) throws IOException {\n    final\
    \ int INTSIZE = 4, LONGSIZE = 8;\n    RandomAccessFile raf = new RandomAccessFile(filename,\
    \ \"r\");\n    raf.seek(raf.length() - INTSIZE);\\ // get the number of strings\n\
    \    int N = raf.readInt();\n    raf.seek(raf.length() - INTSIZE - LONGSIZE *\
    \ N + LONGSIZE * i);\n    long si = raf.readLong();\n    String s = raf.readUTF(si);\n\
    \    raf.close();\n    return s;\n}\n```"
