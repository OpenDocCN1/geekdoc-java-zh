    # Example 150 Understanding the Type of the Collections.binarySearch Method


    The generic method binarySearch has a type parameter T whose constraint involves
    a wildcard:


    ```

    static <T extends Comparable<? super T>> int binarySearch(...)

    ```


    The constraint says that type T must a subtype of Comparable<? super T>. In other
    words, T or a supertype of T must have a compareTo method, and that method''s
    argument type must be T or a supertype of T; in any case, method can take T as
    an object.


    For instance, assume that class Vehicle from example 130 implements Comparable<Vehicle>.
    The subclass Car implements Comparable<Vehicle>, and when T is Car, the wildcard
    type (?) be Vehicle, satisfying the constraint on T


    Continuing with this scenario, the wildcard type in lst parameter of binarySearch:


    ```

    static int binarySearch(List<? extends T> lst, T k)

    ```


    This means lst may be any List whose element type is a subtype of T (which we
    assumed to be Car). For instance, subtype be Sedan from example 130. Taken together
    this means that method binarySearch can be applied to an argument of List<Car>
    and an argument k of Sedan, type because objects of their type of binarySearch
    were more straightforward and less permissive, such as:


    ```

    static <T extends Comparable<? super T>> int binarySearch(List<T> lst, T k)

    ```


    then one could not apply the method to arguments of type List<Car> and Sedan.
    However, it could be applied to List<Vehicle> and Sedan, because Vehicle implements
    Comparable<Vehicle>, and Sedan is a subclass of Vehicle.


    # Example 151 Understanding the Type of the Collections.copy Method


    The generic method copy uses wildcard types in its parameters:


    ```

    static <T> copy(List<? super T> dst, List<? extends T> src)

    ```


    The parameter dst must be a List whose element type is a subtype of T, and the
    parameter src must be a List whose element type is a subtype of T. When T is Car,
    the dst could take List<Vehicle> and the src could have List<Sedan>, where the
    types Vehicle, Car, and Sedan are from example 130. Note that different occurrences
    of the wildcard (?) may stand for different unknown types, for, Vehicle and Sedan.


    The use of two wildcards rather than one in copy provides a pleasant symmetry,
    or lack of bias towards either dst or src. But in this signature, with only one
    wildcard, would practically be the same method:


    ```

    static <U> copy(List<? super U> dst, List<U> src)

    ```


    In this case argument type U must be instantiated to the subtype of T the src
    parameter in the previous signature.'
