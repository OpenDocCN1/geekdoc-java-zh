  md: "# Example 171 Using Stream Methods to Find and Print Web Pages\n\nThis example\
    \ reads web pages from the net, scans the first 200 lines of each web page for\
    \ links, discards duplicate links and finds the unique ones, using streams and\
    \ functional programming to cleanly separate these tasks. Method getPage from\
    \ example 181 returns a Webpage object containing a URL and a string holding the\
    \ first 200 lines of the page content. Method scanLinks from example 169 (a partial)\
    \ web page for hyperlinks and returns a stream of links. The stream method flat\
    \ scanLinks flattens them all into a single link. The stream method distinct clears\
    \ duplicates from the stream.\n\n```\nString[] allUrls = { \"http://www.it.dk\"\
    , ... };\nStream<String> urls = Stream.of(allUrls);\nStream<Webpage> pages = urls.map(url\
    \ -> getPage(url, 200));\nStream<Link> links = pages.flatMap(page -> scanLinks(page));\n\
    Stream<Link> uniqueLinks = links.distinct();\nuniqueLinks.forEach(System.out::println);\
    \ // Call Link.toString()\n```\n\n# Example 172 Checking Sortness of a Sequential\
    \ Stream\n\nTo check whether a sequential stream is sorted, one can use the stream\
    \ method matchAll with a stateful predicate shown below. Each example the predicate\
    \ x -> { ... } compares a stream element to its predecessor. The singleton array[]\
    \ holds that we cannot use a plain variable for that because variables captured\
    \ in a Java lambda expression must be final, or immutable (see 9.11). This method\
    \ does not work on a parallel stream because the predicate is stateful.\n\n```\n\
    static boolean isSorted(Stream<Integer> xs) {\n    final[] last = { Integer.MIN_VALUE\
    \ };\n    return xs.allMatch(x -> { int old = last[0]; last[0] = x; return old\
    \ < x; });\n}\n```\n\n# Example 173 Making a Stream of English Numbers\n\nUsing\
    \ function English from example 158 one can generate a (practically) infinite\
    \ stream of the English numbers \"zero\", \"one\", \"two\",\"thirteen million\
    \ nine hundred eighty-nine thousand hundred twenty-two\", and so on. One can also\
    \ generate a stream of \"logarithms\", where the order of n is the number of letters\
    \ in name (we believe this tongue-in-character concept is attractive to Martin\
    \ Gardner).\n\n```\nStream<String> numerals\n    = Long.iterate(0, x -> x+1).mapTo(Numerals::toEnglish);\n\
    IntStream logarithms = numerals.mapToInt(String::length);\nSystem.out.println(logarithms.limit(1_000).max());\n\
    ```\n\n# Example 174 Versatility of Streams\n\nStreams are very versatile. For\
    \ instance, if we can generate a stream of solutions to the 8-queens problem (example\
    \ 176), we can later decide whether we want to print all solutions, the number\
    \ of solutions, the first 20, or an arbitrary solution, as shown below. With a\
    \ more imperative approach, we would typically have to decide how to use the results.\n\
    \n```\nqueens().forEach(System.out::println);\nSystem.out.println(queens().count());\n\
    queens().limit(20).forEach(System.out::println);\nqueens().findAny();\n```"
