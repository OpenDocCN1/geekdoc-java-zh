  md: "# Enum Types\n\n# Enum Types\n\nAn enum type is used to declare distinct enum\
    \ values; an enum type is a reference type. An enum-type-declaration is a specialized\
    \ form of class declaration that begins with a list of enum value declarations:\n\
    \n```\n```\nenum-modifiers enum t implements-clause {\n    value-list;\n    field-declarations\n\
    \    constructor-declarations\n    method-declarations\n    class-declarations\n\
    \    interface-declarations\n    initializer-blocks\n}\n```\n```\n\nThe declarations\
    \ of fields, methods, nested types, and initializer blocks are as for ordinary\
    \ classes (section 9.1); these declarations may appear in any order. In fact,\
    \ the enum t is implemented as a class and a reference type, and there is exactly\
    \ one instance (object) of that class for each declared enum value.\n\nThe enum-modifiers\
    \ control the accessibility of the enum type and follow the same rules as class\
    \ modifiers (section 9.3). The modifiers abstract and final cannot be used. An\
    \ enum type may be declared to implement any number of interfaces but cannot be\
    \ a superclass; it implicitly has the superclass java.lang.Object. An enum type\
    \ is implicitly final and cannot be used. A nested enum type is implicitly static\
    \ (the static modifier is allowed but implicitly understood and not required)\
    \ and can refer to instances of an enclosing type.\n\nAn enum declaration can\
    \ declare private constructors only, and an enum value cannot be created using\
    \ new (actual-list). Enum values are created by the value-list, which is a (possibly\
    \ empty) comma-separated list of enum value declarations. An enum declaration\
    \ has the enum-value or enum-value(actual-list). The first corresponds to a call\
    \ to the constructor and the second one to a call to the constructor appropriate\
    \ for the enum value's actual-list.\n\nA declared enum has the type t of the enclosing\
    \ enum type and is similar to a public static field. Unlike most reference types,\
    \ enum values can be used in switch statements (example 74). The ordinal of an\
    \ enum value is given by its position in the value-list; the first one is zero.\
    \ There are no predefined comparisons between enum values and integers, and no\
    \ numeric operations as (+), nor comparisons such as (<). An enum value of an\
    \ enum type always equals an enum value.\n\nOutside its declaration, an enum value\
    \ must be written in fully qualified format (Enum.Enum) if not using static import\
    \ (example 17); switch statements, it must be written in unqualified format (Enum).\
    \ Let v1 and v2 be values of the same type; the following operations are defined:\n\
    \n+   * v1.ordinal() of type int is the ordinal value of the enum value, such\
    \ as 3.\n\n+   * v1.toString() returns the declared name of the enum value, such\
    \ as \"Thu\".\n\n+   * v1.compareTo(v2) returns an integer that is negative, zero,\
    \ or positive, as v1 precedes, or follows v2 in the enum value list, as if comparing\
    \ v1.ordinal() to v2.ordinal().\n\n+   * v1==v2 is true if v1 and v2 are the same\
    \ value; otherwise false.\n\n+   * The static method values() returns a new array\
    \ of type t[] holding references to all enum values in the enum type. A new array\
    \ is created every call to this method, so an application should call it at most\
    \ once and cache the result if possible, by example 97."
