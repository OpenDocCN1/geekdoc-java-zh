  md: '# 23.4 Covariance and Contravariance in Functional Interfaces


    In general, whatever method void m(Function<T,R> f) expects an argument f whose
    type is a functional interface such as Function<T,R>, it is acceptable to provide
    an actual function f that accepts an argument of type T and produces a result
    of a subtype of R. One says that function types are covariant in their argument
    types and covariant in their result type. In Java''s system this flexibility is
    expressed using wildcard types; see section 219 and example 157. Thus the more
    flexible signature of method would be described like this: `void m(Function<?
    extends T, extends R> f);


    However, this makes the descriptions of methods that take functional arguments
    considerably more verbose and harder to read. In most cases, this book uses the
    simple Function<T,R> rather than the more general Function<? super,? extends R>;
    we do this in particular for the stream methods in section 24.3. Moreover, we
    write Comparator<T> instead of Comparator<? super T>, write Predicate<T> instead
    of Predicate<? super T>, and so on. Respecting the method signatures as shown
    will always work, but the actual library implementation is accommodating.


    # 23.5 Interface Function<T,R>


    The functional interface Function<T,R> describes one-argument functions of type
    T -> R, that is, take an argument of type T and return a single abstract method
    and some default methods:


    +   * apply (T x) is the function represented by an object implementing the interface.

    * default Function<T,V> andThen(Function<R,V> after) returns a function that applies
    after the result of this function, that is, (T x) -> after.apply(x).

    * default Function<V,T> compose(Function<V,T> before) returns a function that
    applies this to the result of the function before, that is, (V x) -> before.apply(x).

    * static Function<T,T> identity() returns the identity function (T x) -> x on
    type T.


    The-primitive specialized interfaces [Double,Long,Int]Function and [Double,Long,Int]To[Double,Long,Int]Function
    have only the abstract methods on page 125; the default methods andThen compose
    would require many overloads; see example 162.


    # 23.6 Interface UnaryOperator<T>


    The functional interface UnaryOperator<T> extends Function<T,T> describes one-argument
    functions of type T -> T that take an argument of type T and return a result of
    the same type T. It has the single abstract method applyAndThen and compose by
    Function<T,T>, and a static method:


    +   * apply (T x) is the unary operator represented by an implementation of the
    interface.

    * default Function<T,V> andThen(Function<T,V> after) returns a function that applies
    after the result of this unary operator, that is, x -> after.apply(apply(x)).n*
    default Function<V,T> compose(Function<V,T> before) returns a function that applies
    this to the result of the function before, that is, x -> apply(before.apply(x)).

    * static UnaryOperator<T> identity() returns the unary operator (T x) -> x on
    type T.


    There are primitive-type specialized interfaces [Double,Long,Int]UnaryOperator
    with the default and static methods and single abstract methods applyAs[Double,Long,Int];
    see page 125.'
