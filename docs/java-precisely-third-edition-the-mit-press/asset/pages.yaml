  md: '# Preface


    This third edition of Java Precisely gives a concise description of the Java programming
    language, version 8.0. It is a quick reference for the reader who has already
    learned (or is learning) Java from a standard textbook and who wants to know the
    language in more detail. The book presents the entire Java programming language
    and essential parts of the class libraries: the collection classes, the input-output
    classes, the stream library and its interfaces for parallel programming, and the
    functional interfaces used for.


    General rules are on left-hand pages mostly, and corresponding examples are on
    right-hand pages only. All examples are fragments of legal Java programs. The
    ready-to-run examples are available from the book website: www.ite.de/people/soft/javapisely.


    This third edition adds new methods for functional processing of arrays (section
    8.4); default and static methods on interfaces (section 13.3); the memory visibility
    effects of volatile and final (section 20.5); new comparator methods (section
    22.0); functional interfaces (chapter 23) and the related lambda expressions (section
    11.13) and method reference expressions (section 11.14); stream processing, including
    parallel programming and collectors (chapter 24); and the Optional class (chapter
    25). In general the book has been updated for the changes from Java 5.0 to Java
    8.0. The final chapter 29 summarizes and illustrates the new features of Java
    8.0 and compares them to the C programming language.


    The book does not cover garbage collection, non-blocking input-output, the executor
    framework, final and weak references, details of IEEE754 floating-point numbers,
    or Javadoc.


    Acknowledgments Thanks to Rasmus Lund, Niels Hallenberg, Hans Henrik Løvgren,
    Christian Gram, Jan Clausen, Anders Peter Ryan, Bruce Conrad, Brendan Humphreys,
    Hans Raschel, Ken Friis Larsen, Dan Becker, Meads Jette Tarp-Jansen, Kasper Østerby,
    Kasper Blasted Grersen, Søren Edgaard Jacobsen, Paul van Bennenel, Axel Tobias
    Schreiber, David Henniger, Lars Aktmer, Jakob Bendsen, Jan Schoubo, and all the
    anonymous reviewers and editors for their useful comments, suggestions, and corrections.
    Special thanks to Rasmus Lund for letting me adopt his collections for this book,
    and to Kasper Østerbye for campaigning for a reflection chapter and providing
    a first draft of it.


    It was a pleasure to work with Robert Prior, Valerie Geary, Deborah Cantor-Antams,
    Kristen Magnuson, Marc Lowenthal, Marie Rufus Lee, Victoria Crossman, and Kathleen
    Hensley at the MIT Press. Thanks also to the IT University of Copenhagen, Denmark,
    for support.'
