  md: '# Interface List<T> and its Implementations LinkedList<T> and ArrayList<T>


    The List<T> interface extends the Collection<T> interface with operation for position-based
    access using indices 0,1,2... and gives more precise specifications of some methods:


    +   - boolean add(T o) adds o at the end of the list. Returns true.

    - void add(int i, T o) adds o at position i, increasing the index of the element
    to the right by 1. Th IndexOutOfBoundsException if i<0 or i>size().

    - boolean addAll(int i, Collection<? extends T> coll) adds all elements of coll
    to the list, starting at position i; returns true if any element was added. throws
    IndexOutOfBoundsException if i<0 or i>size().

    - boolean equals(Object o) returns true if o is a List with elements in the same
    order.

    - T get(int i) returns the element at index i; throws IndexOutOfBoundsException
    if i<0 or i>size().

    - int hashCode() returns the hash code of the list, which is a function of the
    hash of the elements and their order in the list.

    - int indexOf(Object o) returns the index i for which the element at position
    i equals o; returns -1 if the list does not contain such an element.

    - int lastIndexOf(Object o) returns the last index i for which the element at
    position i equals o; returns -1 if the list does not contain such an element.

    - ListIterator<T> iterator() returns a bidirectional iterator; see section 22.8.

    - remove(int i) removes the element at position i and returns it; throws throws
    IndexOutOfBoundsException if i<0 or i>size().

    - T set(int i, T o) sets the element at position i and returns the element previously
    at position i; throws IndexOutOfBoundsException if i<0 or i>size().

    - List<T> sublist(int from, int to) returns a list of the elements from ..[to-1],
    as a view of the underlying list. throws IndexOutOfBoundsException if from<0 or
    from>to or to>size().


    The LinkedList class implements all the operations described by the List interface
    and has the following constructors. The implementation is a doubly linked list,
    so elements can be added, removed, and moved efficiently at either end of the
    list. It provides additional methods for position-based get, add, and remove called
    addFirst, addLast, removeFirst, and removeLast. The last four throw NoSuchElementException
    if the list is empty.


    +   - LinkedList() creates a new empty LinkedList<T>.

    - ArrayList(Collection<T> coll) creates a new list containing the elements from
    coll''s iterator.


    The ArrayList implements all the operations described by the List interface and
    has the following constructors. The implementation uses an underlying array (expanded
    as needed to hold elements), which permits efficient position-based access anywhere
    in the list. Class ArrayList implements the RandomAccess interface to let element
    access is guaranteed to be fast, in contrast to LinkedList. The ArrayList provides
    all functionality originally (pre-Java 2) by the Vector class, which is a subclass
    of AbstractList and implements List and RandomAccess.


    +   - ArrayList() creates a new empty ArrayList<T>.

    - ArrayList(Collection<T> coll) creates a new list containing the elements from
    coll''s iterator.'
