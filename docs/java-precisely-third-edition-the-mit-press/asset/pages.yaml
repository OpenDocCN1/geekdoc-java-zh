  md: '# 10 Strings


    # 7 Strings


    A string is an object of the predefined class String. It is immutable: once created
    it cannot be changed. A string literal is a sequence of characters within double
    quotes: "New York", "A38", "", and so on. Internally, a character is stored as
    a number using the Unicode [1] character encoding, where character codes 0–127
    coincide with the ASCII code. Encoding string literals may use escape sequences:


    Escape Code Meaning

    \\b backspace

    \\t horizontal tab

    \\n newline

    \\f form feed (page break)

    \\r carriage return

    \\" the double quote

    \\\'' the single quote

    \\\ backslash

    \\ddd the character whose the three-digit octal number dddd

    \\uuuu the character whose the four-digit hexadecimal number most


    A escape sequence represents a single character. The letter A has 65 (decimal),
    which is 100 in binary and 041 in hexadecimal, the string literal "A101\u0041"
    is the same as "AAA". If sl and s2 are expressions of type and v is an expression
    of any type,


    +   * sl.length() of type int is the length of sl, which is the number of characters
    in sl.

    * sl.equals(s2) of type boolean is true if sl and s2 contain the same sequence
    of characters, and false otherwise; equalsIgnoreCase similar but does not distinguish
    lowercase and uppercase.

    * sl.charAt(i) of type char is the character at position i in sl, counting from
    0. If the index i is greater than 0, or than equal to sl.length(), stringIndexOutOfBoundsException
    is shown.

    * sl.toString() of type String is the same object as sl.

    * String.valueOf(v) returns the string representation of v, which can have any
    primitive type (5.1) or reference type. When v has reference and is not null,
    then it is converted to v.toString(); if v is null, then it is converted to the
    string "null". Any class C inherits from Object a default toString that produces
    strings of the form C2a5734, where 2ea5734 is some memory address, to may be overridden
    to produce more useful strings.

    * sl + s2 has the same meaning as sl.concat(s2); it constructs the concatenation
    of sl and s2, a String consisting of the characters of sl followed by the characters
    of s2. Both sl + v and v + sl are evaluated by converting v to String.valueOf(v),
    then when v has reference type, then compares the resulting strings.

    * sl.compareTo(s2) returns a negative or positive integer, as so sl precedes,
    equals or follows in the lexicographical order based on the Unicode [1] character
    encoding. If sl or s2 is null, then the NullPointerException is thrown. CompareToIgnoreCase
    is similar but does not distinguish lowercase and uppercase case.

    * sl.substring(int i, int j) returns a new String of characters from sl with indices
    i..(j-1). ThrowsOutOfBoundsException if i<0 or j>sl.length.

    * sl.subSequence(int i, int j) is like substring but returns a CharSequence (section
    26.7).

    * More String methods are described in the Java class documentation [2].'
