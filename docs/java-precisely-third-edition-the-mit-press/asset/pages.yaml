  md: '# 15 Exceptions, Checked and Unchecked


    An exception is an object of exception type: a non-generic subclass of Throwable.
    It is used to signal and describe an abnormal situation during program execution.
    The evaluation of an expression or the execution of a statement may throw an exception,
    either by executing a throw statement (section 12.6.5) or by executing a primitive
    operation, as array assignment, that may throw an exception.


    A exception may be caught in a dynamically enrolled try-catch statement (section
    12.6.6). If the exception is not caught, the entire program execution will be
    aborted, and information from the exception will be printed on the console. What
    is printed is determined by the exception''s toString method.


    There are two kinds of exception types: checked (those that must be declared in
    the method or constructor; see section 9.8) and unchecked (those that need not).
    If the execution of a method or constructor can throw a checked exception of class
    E, then a or E must be declared in the throws-clause of the method or constructor.
    The following table shows the exception class hierarchy.


    | Class | Status | Package |

    | --- | --- | --- |

    | Throwableable | checked | java.lang |

    | | unchecked | java.lang |

    | AssertionError | checked | java.lang |

    | ExceptionInInitializerError | checked | java.lang |

    | OutOfMemoryError | checked | java.lang |

    | | unchecked | java.lang |

    | StackOverflowError | unchecked | java.lang |

    | Exception | checked | java.lang |

    | ClassNotFoundException | checked | java.lang |

    | InterruptedException | checked | java.lang |

    | IOException | checked | java.lang |

    | CharConversionException | checked | java.io |

    | EofException | checked | java.io |

    | FileNotFoundException | checked | java.io |

    | InterruptedIOException | checked | java.io |

    | ObjectStreamException | checked | java.io |

    | InvalidClassException | checked | java.io |

    | NotSerializableException | checked | java.io |

    | SyncedException | checked | java.io |

    | UnsupportedEncodingException | checked | java.io |

    | UnsupportedFormatException | checked | java.io |

    | RuntimeException | unchecked | java.lang |

    | ArithmeticException | unchecked | java.lang |

    | ArrayStoreException | unchecked | java.lang |

    | ClassCastException | unchecked | java.lang |

    | ConcurrentModificationException | unchecked | java.util |

    | IllegalArgumentException | unchecked | java.lang |

    | IllegalArgumentFormatException | unchecked | java.util |

    | IllegalMonitorStateException | unchecked | java.lang |

    | IllegalStateException | unchecked | java.lang |

    | IndexOutOfBoundsException | unchecked | java.lang |

    | ArrayOutOfBoundsException | unchecked | java.lang |

    | StringIndexOutOfBoundsException | unchecked | java.lang |

    | NegativeArraySizeException | unchecked | java.util |

    | NoSuchElementException | unchecked | java.lang |

    | NullPointerException | unchecked | java.lang |

    | UncheckedIOException | unchecked | java.io |

    | UnsupportedOperationException | unchecked | java.lang |'
