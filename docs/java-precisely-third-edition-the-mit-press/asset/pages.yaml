  md: "# 62 Statements\n\n# 12.6.5 The throw statement\n\nA throw statement has the\
    \ form\n\n```\nthrow\nexpression;\n```\n\nwhere the type of the expression must\
    \ be a subclass of Throwable (chapter 15). The throw statement executed as follows:\
    \ The expression is evaluated to obtain an exception v. If it is null, then a\
    \ NullPointerException is thrown; otherwise the exception object v is thrown.\
    \ Then an exception is never null. In any case, the enclosing block statement\
    \ terminates abruptly (chapter 15). The exception may be caught by a dynamically\
    \ enclosing try-catch statement (section 12.6.6). If it is not caught, then the\
    \ entire program execution will be aborted, and information from the exception\
    \ will be printed on the console (for example, at the command prompt, or in the\
    \ Java Console inside a Web browser).\n\n# 12.6.6 The try-catch-finally Statement\n\
    \nA try-catch statement is used to catch (particular) exceptions by a code block;\
    \ it has this form:\n\n```\ntry\n  body\n  catch (E1 x1) catchbody1\n  catch (E1\
    \ E2 | ... | Ek x2) catchbody2\n  finally body\n```\n\nwhere E1, E2, ... are exceptions;\
    \ x1, x2, ... are variable names; and body, and finally are block-statements (section\
    \ 12.2). There can be zero or more catch clauses, and a finally clause may be\
    \ absent, but a try-catch-finally statement must have least one catch or finally\
    \ clause. By count, a try-with-resources statement (section 12.7) is not required\
    \ to have catch or finally clauses.\n\nA single-catch clause of the form catch\
    \ (Ei) matches any exception type E that is a subtype of (or possibly equal to)\
    \ Ei. A multi-catch clause of the form catch (Ei | ... | Ek) matches k>=1 and\
    \ matches any exception type that is a subtype of (or possibly equal to) Ei.\n\
    \nThe try-catch-finally statement is executed by executing the body. If the execution\
    \ of the body terminates normally, or if exit by return, break, or continue (when\
    \ a method, constructor, switch, or loop) occurs, then the catch clauses are ignored.\
    \ If the body terminates abruptly by throwing an exception e of class, the first\
    \ matching catch clause (if any) is located, the variable x is bound to e; and\
    \ the corresponding catchbody is executed. The catchbody may terminate normally;\
    \ loop infinitely; if exiting return, break, or continue; or throw an exception\
    \ (possibly e). If this is finally, then the entire try-catch statement terminates.\
    \ A thrown exception e is never null (section 12.6.5), so it is guaranteed not\
    \ to be null. If there is no catch clause, then the entire try-catch statement\
    \ terminates abruptly with exception.\n\nIf there is a finally clause, then finally\
    \ will be executed regardless of the execution of the body terminated normally;\
    \ regardless of whether body exited by return, break, or continue; regardless\
    \ of whether exception thrown by body was caught by a catch clause; and regardless\
    \ of the catchbody executed by executing return, break, or continue, or by throwing\
    \ an exception. If execution of finally terminates normally, then the entire try-catch-finally\
    \ terminates as determined by body (or catchbody, if one was executed and terminated\
    \ abruptly or exit). If execution of finally terminates abruptly, that determines\
    \ the entire try-catch-finally terminates (example 99).\n\n![](img/25c670a7b9eeeecd9d7d8d608e1793ba_74_0.png)"
