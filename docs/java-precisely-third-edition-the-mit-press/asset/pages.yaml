  md: '# 16 Compilation, Source Files, Class Names, and Class Files


    A Java program consists of one or more source files (with file suffix .java).
    A source file may contain one or more class or interface declarations. A source
    file can contain at most one declaration of a top-level public class or interface,
    which must have the same name as the file (the minus file suffix .java). A source
    file myprog.java is compiled to Class files (with file suffix .class) by a Java
    compiler:


    ```

    javac myprog.java

    ```


    This creates one class file for each class or interface declared in the source
    file myprog.java. A class or interface D in a top-level declaration produces a
    class file C.class. A nested class or interface D declared inside class C produces
    a class file C$.class. A local class D inside a method in class C produces a class
    file C$1.class or similar.


    A class C that declares the method public static void main(String[] args) can
    be executed using the Java run-time system by typing a command line of the file


    ```

    java arg1 arg2

    ```


    This will execute the body of main with the command line arguments arg1, arg2,
    ... bound to the array elements args[0], args[1],... inside the main method (examples
    9 and 104).


    # 17 Packages and Jar Files


    Java source files may be organized in packages. Every source file in package p
    must begin with the declaration


    ```

    package p;

    ```


    and must be in a sub named p. A class declared in a source file with no package
    declaration belongs to the anonymous default package. A source file not belonging
    to package p may refer to class C from package p by using the qualified name p.C,
    in which class C is prefixed by the package name. To avoid using the package name
    prefix, the source file may begin with an import declaration (possibly package
    declaration) of one of three:


    ```

    import p.C;

    import p.*;

    import static p.C.*;

    ```


    The first form allows C to be used unqualified, without the package name, and
    the second allows all accessible classes and interfaces in p to be used unqualified.
    The third form allows all members of class C to be used unqualified. The class
    library package java.lang is implicitly imported, so java.lang is a composite
    package name, so java.lang.String is declared in the file java/lang/String.java.


    The files in p and its subdirectories can be collected in a jar file by executing
    java vcf jar p on the command line. The resulting jar file p.jar can be made available
    to other Java programs by moving the file to the directory /usr/java/jdk1.5/jre/lib
    or similar under Unix, or to the directory c:\jdk1.5\jre\lib\ext or similar under
    MS Windows. The jar file may contain more than one package; it needs only contain
    class files (not source files), and its name is not significant.'
