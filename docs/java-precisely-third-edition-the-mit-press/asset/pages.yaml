  md: "Statements\n\n# 12 Statements\n\nA statement may change the computer's state:\
    \ the value of variables, fields, and array elements; the contents of files; and\
    \ so on. More precisely, execution of a statement\n\n+   - terminates normally\
    \ (meaning execution will continue with the next statement, if any); or\n- terminates\
    \ abruptly by throwing an exception; or\n- exits by executing a return statement\
    \ (if inside a method or constructor); or\n- exits switch by executing a break\
    \ statement (if inside a switch or loop); or\n- exits the current iteration of\
    \ a loop and starts a new iteration by executing a continue statement (inside\
    \ a loop); or\n- does not terminate at all, for instance, executing while (true)\
    \ {}.\n\n# 12.1 Expression Statements\n\nAn expression statement is an expression\
    \ followed by a semicolon:\n\nIt is executed by evaluating the expression and\
    \ ignoring its value. The only forms of expression that may be legally used in\
    \ this way are assignment expressions (section 11.5), increment and decrement\
    \ expressions (section 11.2), method call expressions (section 11.2), and object\
    \ creation expressions (section 11.7).\nFor example, an assignment statement x=e;\
    \ is an expression x= followed by a semicolon.\nSimilarly, a method call statement\
    \ is a method call expression followed by a semicolon. The value returned by the\
    \ method, if any, is discarded; the method is executed only for its side effect.\n\
    \n# 12.2 Block Statements\n\nA block-statement is a sequence of zero or more statements,\
    \ variable-declarations, or class-declarations, in any order, enclosed in braces.\
    \ Within a block, a variable or class can be used only after its declaration.\n\
    \n```\n{\n    variable-declarations\n    class-declarations\n    statements\n\
    }\n```\n\n# 12.3 The Empty Statement\n\nAn empty statement consists of a semicolon\
    \ only. It is equivalent to the block statement { } that contains no statements\
    \ or declarations, and it has no effect at all:\n\n;"
