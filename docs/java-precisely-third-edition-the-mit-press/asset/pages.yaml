  md: '# 21.9 Wild Type Arguments


    A wildcard type is an expression that denotes some unknown type. A wild card type
    can be used only as a type argument in a generic instance, as in Shop<?> where
    Shop<T> is a generic type from example 130; a wildcard cannot be used as a type
    on its own. A wild card type is useful when one gives a type argument in a generic
    type but wants to specify the exact type. There are three forms of wild card types:


    ```

    <<?n<? extends tb

    <? super tb>

    ```


    Here the tb is a type expression, possibly involving further occurrences of wild
    card type expressions (which then stand for unrelated types). The first form of
    wild card type represents some unknown type; the second form represents some unknown
    type that tb is a subtype of tb; and the third form represents some unknown type
    that tb is or a subtype of tb.


    A wildcard expression should not be confused with a type parameter constraint
    in the declaration of a generic type or (section 21.5); in particular constraint
    cannot have the form super tb. Consider the Shop<?> example, where Shop<T> is
    a shop that deals with objects of T. First, a Shop<Car> is a shop to which we
    can sell objects of Car (or a subclass); and when we buy from the shop, we know
    that it is Car or something that is a subtype of Car.


    A Shop<?> is a shop that deals in some unknown type of object. The shop might
    be a Shop<Vehicle> or a Shop<Sedan> or a Shop<Painting>. We know only what we
    buy from the shop; and we cannot sell anything at all, not knowing the type of
    it will accept.

    Shop<?Car> is a shop that deals in some unknown subtype of Car. What we buy from
    the shop must be a Car; but we cannot sell anything to the shop, not knowing what
    type Car it will accept.

    Shop<?super> is a shop that deals in some unknown supertype of Car. Obviously,
    what we buy from the shop must be an Object; and we know we can sell Car (or Sedans)
    to the shop.


    A variable b of type Shop<? extends tb> can be given (assigned) a value of type
    Shop<?> only if if t is a subtype of tb. For instance, a variable of type Shop<?
    extends Car> can be assigned as a Shop<Sedan> or a Shop<Car> but not a Shop<Vehicle>.
    Conversely, a variable b of type Shop<? super tb> can be assigned a value of type
    Shop<?> only if t is a supertype of tb. For instance, a variable of type Shop<?super
    Car> can be assigned a Shop<Car> or Shop<Vehicle> but not Shop<Sedan>. This thus
    subtype relations between Shops are:


    ![](img/25c670a7b9eeeecd9d7d8d608e1793ba_110_0.png)


    In general, the wild card type <? extends tb is a useful argument when the value
    of a generic type must be used as a producer of objects of tb. The wild card type
    <? super tb is useful as a type argument when the value of a generic type must
    be used as a consumer of objects of type tb.


    Wildcards are used extensively in the parameter types and type constraints in
    the generic collection library (chapter 22). Examples 150 and 151 explain two
    of the more intricate cases'
