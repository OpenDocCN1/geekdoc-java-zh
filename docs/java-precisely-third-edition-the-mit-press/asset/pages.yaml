  md: '# 23.2 Generic Functional Interfaces


    A functional interface is an interface that can apply, test, or accept, and possibly
    some default and static methods. A concrete instance of a functional interface
    represents a function, namely the implementation of the interface''s single abstract
    method. Functions are especially useful in connection with stream pipelines (chapter
    24) and parallel processing of arrays (section 8.4).


    The generic interfaces from package java.util.function are listed in the table
    below, along with the corresponding functional type notation, as used in many
    languages. The arrow (--) indicates a function type, and the (*) indicates a product
    or pair type. Precisely, T -> R is the type of a function that takes arguments
    of type T and returns results of type R, and T -> U is the type of a function
    that takes arguments of type U and returns results of type R.


    Conceptually, the most important functional interface is Functional<T,R>, the
    type of a function that takes an argument of type T and returns a result of type
    R, corresponding to the functional type T -> R. The interface''s single method
    is apply(T).


    FunctionString<Integer> is the type of a function that takes a String and returns
    an Integer result. A value of such a function can be produced in numerous ways,
    usually from a lambda expression (section 11.13) or a method reference expression
    (section 11.14), as shown in example 155.


    There are other functional interfaces, as Comparator<T> from package java.util;
    see section 22.10.


    # 23.3 Primitive-Type Specialized Interfaces


    The table''s list of functional interfaces is very long, but many of them are
    primitive-type specialized versions of the more generic functional interfaces
    Functional<T,R> and so on, in particular for R and T being Double, Integer, and
    Long. The primitive-type specialized interfaces exist purely for efficiency reasons.
    The problem is that Java''s generic types, as Function<T,R>, can only take reference
    type arguments as Integer and Long, not primitive arguments as int and long; see
    section 22.11. Calling a functional interface represented by an instance of Function<Integer,Long>
    means calling the method apply(Integer x), and this involves unwrapping the Integer
    and subsequent wrapping of the long result object, which is inefficient. Using
    instead the longAsLong(int x) method on an instance of the primitive-type specialized
    interface IntLongFunction avoids this run-time overhead. It it also makes the
    list of functional interfaces bulky and daunting to look at; and it could be even
    worse, had the Java class included versions for Byte, Char, Short, and Float,
    which it sensibly does not.'
