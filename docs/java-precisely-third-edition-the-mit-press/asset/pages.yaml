  md: '# Files, Directories, and File Descriptors


    # Path Names in a File System: Class File


    An object of class File represents a path name, that is, a directory/file path
    in the file system. The path name may denote a directory, a data file, or nothing
    at all (if there is no file or directory of that name). Even if the path denotes
    a file or directory, a given program may lack the permission to read or write
    that file or directory. These are a pame of the constructors and methods in class
    File:


    +   - File(String pname) creates a path name corresponding to the string pname.

    - boolean exists() returns true if a file or directory denoted by this path name
    exists.

    - String getName() returns this path name as a string.

    - boolean isDirectory() tests the file denoted by this path name is a directory.

    - boolean isFile() tests the file denoted by this path name is a normal file.

    - long length() returns the length of the file in bytes, or 0 if the file does
    not exist.

    - File[] listFiles() returns the files in the directory denoted by the path name;
    returns null or error if the path name does not denote a directory.

    - boolean mkdirdir() creates the directory named by this path name.


    # File System Objects: Class FileDescriptor


    An object of class FileDescriptor is a file descriptor, an internal representation
    of an active file system object, such as an open file or an open socket. A file
    descriptor may be obtained from a FileInputStream (section 26.9) or FileOutputStream
    (section 26.10). This class has method:


    +   - void sync() requests that all buffers be synchronized with the physical
    devices; it blocks until this operation is done. Throws SyncFailedException if
    it cannot.


    The class has static fields in, out, and err, which are the file descriptors associated
    with the standard input (System.in), standard output (System.out), and standard
    error (System.err) streams.


    # Thread Communication: PipedInputStream and PipedOutputStream


    Threads (chapter 20) execute concurrently and may communicate asynchronously using
    internal pipes. A pipe is a pair of a PipedInputStream and a PipedOutputStream,
    or a pair of a PipedReader and a PipedWriter. By contrast, communication with
    other processes or remote computers uses InputStreams and OutputStreams, briefly
    described by operating system streams, described in section 26.17.


    To create a pipe, one end of it is outputpipe = new PipedOutputStream(), then
    to use that to connect the other end by inputpipe = new PipedInputStream(outputpipe).
    Each end may be connected only one.


    A producer writes to a PipedOutputStream(PipedWriter), and a consumer reads from
    a PipedInputStream(PipedReader) with the PipedOutputStream(PipedWriter). If the
    producer is fast and the pipe fills up, then the next write operation blocks until
    there is room in the pipe. If the consumer is fast and there are no available
    data in the pipe, then the next read operation blocks until data becomes available.
    When either the consumer or the producer dies, and one end of the pipe is destroyed,
    the next write (or read) at the other end of the pipe throws an IOException.'
