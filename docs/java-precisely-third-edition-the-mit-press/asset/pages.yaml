  md: "# Generic Types and Methods\n\n# 21.4 Generic Classes\n\nA declaration of a\
    \ generic class C<T1,...,<Tn> may have this form:\n\n```\nclass-modifiers class\
    \ C<T1,...,<Tn> class-base-clause\n    class-body\n```\n\nThe T1,...,Tn are type\
    \ parameters. The class-modifiers, class-body, and class-base-clause are for a\
    \ non-generic class declaration (section 9.1).\n\nIn each case, type parameter\
    \ Ti may have constraints C1, C2, ..., Cn, in which case its entry in the parameter\
    \ list is written Ti extends C1 & C2 ... & Cn instead of Ti; see section 21.5.\n\
    \nThe type parameters T1,...,Tn are used wherever a type instance exists in the\
    \ class-base-clause and in non-static members of the class-body, and so the type\
    \ parameters of any generic class, the present is a non-static class member. See\
    \ section 21.6 for details.\n\nA generic class C<T1,...,<Tn> is not itself a class\
    \ but a class declared by replacing each type parameter Ti with the corresponding\
    \ type Ti in the class-body. A type Ti that is substituted for a type parameter\
    \ Ti in a type instance can be any reference type—a class, an array, or even a\
    \ custom type—and it cannot be a primitive type or the pseudo-void type; the pseudo-void\
    \ type is used only to indicate that a method has no return value.\n\nAll instances\
    \ of a generic class C<T1,...,<Tn> share the same static fields (if any) declared\
    \ in the class-body. All instances of a generic class C<T1,...,<Tn> share the\
    \ same fields and cannot be used in any static methods.\n\nAn object of a generic\
    \ class C<T1,...,<Tn> is created using the new operator to construct an instance\
    \ of the type instance, as in new C<T1,...,Tn>() for an argument-less constructor.\
    \ If the arguments T1,...,Tn can be inferred from the constructor, the argument\
    \ list may be left empty as a \"diamond\" as in new C>(). In particular, if the\
    \ object creation is the right-hand side of an initialized variable declaration\
    \ Log<Date> log2 = new Log<int>() as is in example 119, where the left-hand side\
    \ is a subtype of the right-hand side, as in List<String> list2 = new ArrayList<String>();\
    \ If the generic class C<T1,...,<Tn>, or any of its type parameters, is private,\
    \ then the type instance is private.\n\nA instance C<T1,...,<Tn> is accessible\
    \ when all its parts are accessible.\n\nA scope can have only one class, generic\
    \ or not, with the same name C, regardless of the number of type parameters.\n\
    \nA generic declaration is illegal if there are types, such that the type instance\
    \ C<T1,...,<Tn> would contain two or more method declarations with the same signature.\n\
    \nThe usual conversion rules hold for generic classes and generic interfaces.\
    \ When generic class B<T> is declared to be a subclass of interface I<T>, the\
    \ type instance B<T> is a subtype of the type instances B<T> and I<T>; an instance\
    \ of B<T> can be used wherever a value of B<T> or I<T> is expected.\n\nHowever,\
    \ generic classes and interfaces are invariant in their type parameters. Even\
    \ if Ti is a subtype of Tj, the type instance C<Ti> is not a subtype of the type\
    \ instance C<Tj>. For example, LinkedList<String> is not a subtype of LinkedList<Object>.\
    \ If it were, you could create a LinkedList<String>, cast it to LinkedList<Object>,\
    \ store an Object into it, and unexpectedly get an Object back out of the original\
    \ LinkedList<String>. For type system soundness, generic types must be invariant\
    \ in their type parameters. Some of the programming flexibility there can be regained\
    \ by using wildcard type arguments in generic classes; see section 21.9."
