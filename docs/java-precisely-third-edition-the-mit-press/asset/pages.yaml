  md: '# Threads, Concurrent Execution, and Synchronization


    # 20.5 The Java Memory Model and Visibility Across Threads


    Concurrent threads communicate via shared mutable, for instance, in the form of
    mutable fields accessible to multiple threads. This raises the question of visibility
    of writes across threads: when a write x = 42 to shared field x performed by thread
    A be visible to another thread B reads x? Due to optimizations performed by the
    JIT compiler and to the memory caches of multicore processors, the surprising
    answer may be "never" or "later than you would think"; see examples 113 and 114.

    However, the Java Memory Model (since Java 5.0) guarantees that writers to a shared
    field x or shared array a[i] by thread A are visible to reads thread B in these
    cases:


    +   - Thread A releases a lock after x, and thread B acquires the same lock before
    the read. Hence leaving and entering synchronized methods enforces visibility.

    - Field x is declared volatile, and the write in A precedes the read in B real
    time.

    - Thread A writes to volatile field after the write to x or a[i], and thread B
    reads the volatile field before reading x or a[i]. The visibility of x or a[i]
    "piggyback" on the visibility effects of writing and reading any volatile field.

    - Thread A starts using method from section 20.3: a thread can see every write
    that its creator thread did.

    - Thread A terminates, and B awaits the termination of an A join from section
    20.3; a thread can see every performed by a thread it has known.

    - Concurrent collection operations the java.util.concurrent package and atomic
    operations from the java.util.concurrent.atomic package also have visibility effects.


    # 20.5.1 The volatile Field Modifier


    The volatile modifier applied to a field x ensures that every write to x by thread
    A, and every other prior write performed by A, becomes visible to another thread
    B after reading x. The volatile modifier prevents the JIT compiler from performing
    certain optimizations, and it takes extra work at run-time to make one processor
    core''s writes visible to other processor cores. This may slow down the code;
    see example 115.

    Declaring a field of array type volatile does not affect the visibility of the
    array''s elements a[i]. To ensure visibility of array element writes, one must
    build on the Java Memory Model guarantees listed above: using locking or synchronized;
    piggyback on writes and subsequent reads of volatile fields; use


    # 20.5.2 The final Field Modifier


    If an instance field is declared final, then the value assigned to x by a constructor
    is visible by any thread that obtains the reference returned by the constructor.
    Since the final modifier has visibility effect and also ensures that the field
    cannot be modified (section 9.6), it can be used to implement thread-safe immutable
    objects. This is useful in connection with functional programming (chapter 23)
    with parallel streams (chapter 24) and can also be used for avoiding locking in
    some scenarios.'
