  md: '# Input and Output


    Sequential input and output uses objects called IO streams, not to be confused
    with streams for bulk data (chapter 24). There are two kinds of IO streams: character
    streams and byte streams, also called text streams and binary streams. Character
    streams are used for input from text files and human-readable output to text printers,
    and so on, using 16-bit Unicode encoding. Byte streams are used for compact and
    efficient input and output of primitive data (int, double,...) as well as objects
    and arrays, in machine-readable form.


    There are separate classes for handling character streams and byte streams. The
    classes for input and output are called Readers and Writers. The classes for byte
    input and output use the java.io package. Java provides additional facilities
    in package java.nio, not described here.


    One can create subclasses of the IO classes, inheriting methods to obtain specialized
    IO stream. We will not discuss further how to do so.


    The four IO class hierarchies are shown in the following table, with related input
    and output classes shown on the same line. The table shows, for instance, BufferedReader
    and FilterReader are subclasses of Reader, and LineNumberReader is a subclass
    of BufferedReader. Abstract classes are shown in italics.


    | Input Streams | Output Streams |

    | --- | --- |

    | Character Streams | BufferedReader | BufferedWriter |

    | LineNumberReader | |

    | FilterReader | FilterWriter |

    | PushBackReader | |

    | InputStreamReader | OutputStreamWriter |

    | FileReader | FileWriter |

    | PipedReader | PrintWriter |

    | CharArrayReader | CharArrayWriter |

    | StringReader | StringWriter |

    | Byte Streams | OutputStream |

    | ByteArrayInputStream | ByteArrayOutputStream |

    | FileInputStream | FileOutputStream |

    | FilterInputStream | FilterOutputStream |

    | BufferedInputStream | BufferedOutputStream |

    | DataInputStream | DataOutputStream |

    | PushBackInputStream | PrintStream |

    | ObjectInputStream | ObjectOutputStream |

    | PipedInputStream | PipedOutputStream |

    | SequenceInputStream | |

    | | RandomAccessFile | RandomAccessFile |


    The classes DataInputStream, ObjectInputStream, and RandomAccessFile implement
    the interface DataInput, and the classes DataOutputStream, ObjectOutputStream,
    and RandomAccessFile implement the interface DataOutput (section 26.11).


    The class ObjectInputStream implements interface ObjectInput, and class ObjectOutputStream
    implements interface ObjectOutput (section 26.12).'
