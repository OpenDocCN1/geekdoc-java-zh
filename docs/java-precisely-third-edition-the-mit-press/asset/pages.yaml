  md: '# 22.10 The Comparator<T> Interface


    Functional interface Comparator<T> from the java.util package has single abstract
    method compare and many methods used in connection with collections and sorting
    of arrays:


    +   - int compare(T o1, T o2) performs a three-way comparison of two objects:
    it is negative if o1 is less than o2, zero if o1 and o2 are equal, and positive
    if o1 is greater than o2. It can be used to define non-standard orderings when
    creating TreeSets and TreeMaps (see example 147). It should satisfy that compare(o1,
    o2)==0 whenever o1.equals(o2).

    - static<T, extends Comparable<U>> Comparator<T> then(Function<T,U> f) returns
    a comparator that transforms the keys by f and compares the results by natural
    order, as in f.apply(x).compareTo(f.apply(y)).

    - static<T,U> Comparator<T> comparing(Function<T,U> f) returns a comparator (x,
    y) -> cmp(f.apply(x), f.apply(y)) that transforms keys by f and compares the results
    by cmp. Primitive-type specialized versions (Double, Int, Long) take a first argument
    of type [Double,Int,Long] but no comparator argument.

    - boolean equals(Object otherComparator) overrides equals from Object. A comparator
    can override to specify when it is equivalent to another comparator. That is,
    cmp(cmp2) returns true if all o1 and o2, the result of cmp(o1,o2) is the same
    as that of cmp(o1,o2).

    - static<T> extends Comparable<T>> Comparator<T> naturalOrder() returns a natural
    order comparator, equivalent to (x, y) -> x.compareTo(y).

    - static<T> Comparator<T> nullFirst(Comparator<T> cmp) returns a null-friendly
    comparator that is like cmp but orders before any non-null value.

    - static<T> Comparator<T> nullLast(Comparator<T> cmp) returns a null-friendly
    comparator that is like cmp but orders after any non-null value.

    - default Comparator<T> reverse() returns a reverse ordering comparator, equivalent
    to (x, y) -> y.compareTo(x).

    - static<T> extends Comparable<T>> Comparator<T> reverseOrder() returns a reverse
    natural order comparator, equivalent to (x, y) -> y.compareTo(x).

    - default Comparator<T> thenComparing(Comparator<T> cmp) returns a lexicographical-order
    comparator that first compares using this.compare(x,y), then using cmp.compare(x,y).

    - default<U extends Comparable<U>> Comparator<T> thenComparing(Function<T,U> f)
    returns a lexicographical-order comparator that first compares using this.compare(x,y),
    then using f.apply(x).compareTo(f.apply(y)).

    - default<U> thenComparing(Function<T,U> f, Comparator<U> cmp) returns a lexicographical-order
    comparator that first compares using this.compare(x,y), then using cmp.compare(f.apply(x),
    f.apply(y)).


    There are no primitive-type specialized methods (Double, Int, Long) that take
    arguments of type [Double,Int,Long]Function<T>.'
