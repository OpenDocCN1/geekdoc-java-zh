    First, in example 145 should quickly deal with the frequent case of comparing
    an object to itself. Next, if o is null, or if the run-time of this is different
    from the run-time of o, the result must be false. Finally, if o is non-null and
    has the same run class as this, then compares the fields.


    It is a common mistake to use instance type instead of Object. But then the method
    will not be called (by the hash implementation, because it) does not override
    equals(Object).


    ```

    public boolean equals(Object o) // Note: Object, Time

    if (this == o) // Fast and frequent case

    return true;

    if (o == null || o.getClass() != this.getClass()) // null or different classes

