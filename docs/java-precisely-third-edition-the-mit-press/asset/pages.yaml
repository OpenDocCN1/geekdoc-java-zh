  md: '# 6 Types


    # 5.5 Subtypes and Compatibility


    A t1 may be a subtype of a type t2, in which case t2 is a supertype of t1. Intuitively
    this means that any value vl of type t1 can be used where a value of type t2 is
    expected. When t1 and t2 are reference types, t1 must provide at least the functionality
    (methods and fields) provided by t2. In particular, any value vl of t1 may be
    bound to a variable or parameter x2 of type t2, for instance, by the assignment
    x2 = vl or by parameter passing. We also say that types t1 and t2 are compatible.
    The following rules determine when a type t1 is a subtype of a type t2:


    +   - Every type is a subtype of itself.

    - If t1 is a subtype of t2, and t2 is a subtype of t3, then t1 is a subtype of
    t3.

    - If t1 and t2 are primitives, there is a widening (W or L) conversion from t1
    to t2 according to the opposite option, then t1 is a subtype of t2.

    - If t1 and t2 are classes, then t1 is a subtype of t2 if t1 is a subclass of
    t2.

    - If t1 and t2 are interfaces, then t1 is a subtype of t2 if t1 is a subinterface
    of t2.

    - If t1 is a class and t2 is an interface, then t1 is a subtype of t2 provided
    that t1 (is a subclass of a class) implements t2 or implements a subinterface
    of t2.

    - Array t1[[]] is a subtype of array t2[[]] if reference type t1 is a reference
    type t2.

    - Any reference type of a reference type, including any array, is also a subtype
    of predefined class Object.


    No primitive is a subtype of a reference type and no reference type is a subtype
    of a primitive. There are automatic boxing and unboxing conversions between a
    primitive type and its wrapper class; see section 5.4.


    # 5.6 Signatures and Subsumption


    A signature has m(t1, ..., tn), where m is a method or constructor name, and (t1,
    ..., tn) is a list of non-generic types; see section 36.

    We say that a signature sig = m(t1, ..., tn) subsumes signature sig = m(u1, ...,
    un) if each ui is a subtype of ti. We also say that sig is more specific than
    sig. Note that the name m and the number n of types must be the same in the two
    signatures. every type t is a subtype of itself, every signature subsumes itself.
    In a collection of signatures may be one that is subsumed by all others; such
    a signature is called the most specific signature.


    # 5.7 Type Conversion


    A type conversion converts a value from one type to another. A widening conversion
    converts from a type to a supertype (or the type itself). A narrowing conversion
    converts from one type to another. A narrowing conversion requires an explicit
    type cast (section 11.11), in an assignment x = e or initialization where e is
    a compile-time integer constant (section 11.5).


    The legal conversions between primitive types are in the table opposite. The primitive
    type boolean cannot be converted to any other primitive type. A type cast between
    primitive types never fails at run-time.'
