  md: '# 8.3 Multidimensional Arrays


    The multidimensional arrays are written t[][], t[][][], and so on. A rectangular
    $n$-dimensional array of size $l_1 \times l_2 \times \dots \times l_k$ is (allocated)
    using the array creation expression


    ```

    new t[l_1][l_2]...[l_n];

    ```


    A multidimensional array of type t[][] is in fact a one-dimensional array of arrays;
    its component arrays have type t[]. Hence a multidimensional array need not be
    rectangular, and one need not create all at once. To create only the first $k$
    dimensions of size $l_1 \times l_2 \times \dots \times l_k$ of an $n$-dimensional
    array, leave the $(n-k)$ last brackets empty:


    ```

    new t[l_1][l_2]...[l_n][...];

    ```


    To access an element of an $n$-dimensional array, use a $n$ index series: $a[i_1][i_2]...[i_n]$.


    # 8.4 The Utility Class Arrays


    Class Arrays from package java.util provides static methods to compare, fill,
    sort, search, and to create a collection (chapter 22) or stream (chapter 24) from
    array. The binarySearch, fill, parallelSort, and sort methods are overloaded also
    for arrays with element type byte, char, short, int, long, float, double, Object,
    and generic type T. The equals and fill methods also return type boolean. The
    version of binarySearch and sort use the compare method of the array, unless an
    Comparator object (section 22.9) is given.


    +   * static List<T> asList(T...) returns a List<T> view (section 22.2) of the
    elements of parameter a, in index order. The resulting lists implement RandomAccess.

    * static int binarySearch(byte a, byte k) returns an index>0 for which a[i]==k;
    if, otherwise returns i<0 such that [-i] is the proper position for k. The array
    must be sorted, by some sort(a), or the result is not found.

    * static int binarySearch(Object a, Object k) works like the preceding method
    but compares elements using their compareTo method (section 22.9 and example 1344).

    * static int binarySearch(Object a, Comparator cmp) works like the preceding method
    but compares elements using the method cmp.compare (section 22.9).

    * static boolean equals(byte a1, byte b2) returns true if a1 and b2 have the same
    length and contain the same elements, in the same order.

    * static boolean equals(Object a1, Object a2) works like the preceding method
    but compares elements using their equals method (section 22.9).

    * static void fill(byte a, byte v) sets all elements of a to v.

    * static void fill(byte[] a, int from, int to, byte v) sets a[from..(to-1)] to
    v.'
