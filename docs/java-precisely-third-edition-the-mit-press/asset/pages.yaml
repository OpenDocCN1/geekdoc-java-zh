  md: '# Nested Classes, Member Classes, Local Classes, and Inner Classes


    A non-static class that is, a non-static member class NMC or a local class LLC
    in a non-static, is called an inner class. An object of an inner class always
    contains a reference to an object of the enclosing class C, the enclosing object.
    That object can be referred to as C.this in non-static code (example 47), so a
    non-static x of the enclosing object can be referred to as C.this,x.


    An inner class or local class cannot have static members. More precisely, all
    static fields must be final, and methods nested classes in an inner class or local
    class must be non-static.


    A static class is, a static member class SMC or a local class in a static class,
    has no enclosing and cannot refer to non-static members of the enclosing class
    C. This is the standard restriction on members of a class (section 9.1). A static
    member itself may have static as as non-static members.


    If a local class refers to variables or formal parameters in the enclosing method,
    constructor, or initializer, those variables or parameters must be declared final
    or be effectively final: not the target of reassignment or of pre/post increment/decrement
    operators.


    # Anonymous Classes


    An anonymous class is a special kind of local class; hence it must be declared
    inside a method, constructor, or initializer. An anonymous class can be declared,
    and exactly one instance created, using the special expression syntax


    ```

    new C(actual-list)

    class-body

    ```


    where C is a class name. This creates an anonymous subclass of class C, with the
    given class-body (section 9.1). Moreover, it creates an object of that anonymous
    subclass and calls the appropriate C constructor with the arguments in actual-list,
    as if super(actual-list). An anonymous class cannot declare its own constructors.

    When I is an interface name, the similar expression syntax


    ```

    new I())

    class-body

    ```


    creates an anonymous class, with the given class-body (section 9.1), that must
    implement the interface I, and also creates an object of that anonymous class.
    Note that the parameter list after I must be empty.


    # Initializer Blocks, Field Initializers, and Initializers


    In addition to field initializers (section 9.6), a class may contain initializer-blocks.
    Initializer blocks may be used when field initializers or constructors do not
    suffice. We use the term initializer to mean field initializers as well as initializer
    blocks. A static initializer has the form


    ```

    static block-statement

    ```


    The static initializer blocks and field initializers of static fields are executed,
    in order of appearance in the class declaration, when the class is loaded. A non-static
    initializer is simply a free-standing block-statement.


    An initializer is not allowed to throw a checked exception (chapter 15). If execution
    of a static initializer throws an (unchecked) exception other than Error or one
    of its subclasses, that exception is discarded and the exception ExceptionInitializerError
    is thrown instead.'
