  md: '# Sequential Character Output: Writers


    The abstract class Writer and its subclasses (all having names ending in Writer)
    are used for character-oriented sequential output. They have the following methods:


    +   - void close() flushes and closes the IO stream.

    - void flush() actually writes data to the underlying IO stream, and then flushes
    that.

    - void write(char[] b) writes the contents of character array b.

    - void write(char[] b, int off, int i, int n) writes n characters from b starting
    at position i; throws IndexOutOfBoundsException if i<0 or i+n>b.length.

    - void write(int c) writes a single character, the two-low-order bytes of c.

    - void write(String s) writes string s.

    - void write(String s, int off, int n) writes n characters from s starting at
    position i; throws IndexOutOfBoundsException if i<0 or i+n>s.length.


    # 26.5.1 Writers to a Byte Stream: OutputStreamWriter


    An OutputStreamWriter is a writer (character output stream) that writes to a byte
    stream, converting characters to bytes using a character encoding. It performs
    buffered output to the underlying IO stream. OutputStreamWriter has the same methods
    as a Writer (see 26.5), as well as these constructors and method:


    +   - OutputStreamWriter(OutputStream os) creates an OutputStreamWriter that writes
    to IO stream using the platform''s default character encoding.

    - OutputStreamWriter(OutputStream os, String enc) creates an OutputStreamWriter
    that writes to IO stream using the character encoding specified by enc; see section
    26.4.1 for some valid values, and example 20 for a typical use.

    - String getEncoding() returns the canonical name of the character encoding used
    by this writer.


    # 26.5.2 Sequential Character Output to a File: FileWriter


    A FileWriter is a buffered output stream associated with a (sequential) file,
    equivalent to an OutputStream-Writer created from a FileOutputStream. It has the
    same methods as OutputStream as well as these constructors:


    +   - FileWriter(String name) creates a character output and associates it with
    the named file in the system file. If the file exists, it truncates it; otherwise
    it creates a new empty file. Throws FileNotFoundException if the named file is
    a directory or cannot be created for some other reason.

    - FileWriter(String file, boolean append) works the previous method, but if append
    is true, it does not truncate the file; instead output will be appended to the
    existing files.

    - FileWriter(File file) works the previous method, but creates the writer from
    file.

    - FileWriter(FileDescriptor fd) works the previous method, but creates the writer
    from fd.'
