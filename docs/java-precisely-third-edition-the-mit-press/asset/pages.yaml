    Conversion between Primitive Types

    The letter C marks a narrowing conversion that requires a cast (t); see section
    11.11; W marks a widening conversion that preserves the value; and L marks a widening
    conversion that may cause a loss ofnprecision. A narrowing integer conversion
    discards the (most significant) bits that cannot be represented in

    t smaller integer type. Conversion from an integer to a floating-point type (float
    or double) produces a floating-point approximation of the integer value. Conversion
    from a floating-point type to an integer type discards the fractional part of
    the number; that is, rounded toward zero. When converting a large-floating number
    to a long int, the result is the best approximation (that is, the type''s largest
    positive or the least negative representable number); conversion to byte, short,
    or char is done by converting to int and then to the requested type.


