    \ checked, using an if statement. The postcondition on $y$ is specified by an\
    \ assert statement, and checked if assertions are enabled at run-time. This is\
    \ reassuring, giving that the correctness of the algorithm is never in doubt.\
    \ The assertion uses uses long to avoid arithmetic overflow in the assert statement.\n\
    \n```\nstatic int sqrt(int x) { // Algorithm by Borgerding\n```\n\n**Example 92**\
