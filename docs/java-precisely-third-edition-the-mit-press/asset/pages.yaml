    Assume we have three classes Vehicle, Car, and Sedan, where Vehicle has subclass
    Car, and Car has subclass Sedan (a closed). Now consider a generic class Shop<T>
    that represents a shop or broker from which we can buy and which we can think
    of types of T. A Shop<T> has a method buy() that allows us to buy a T from the
    shop, and a method void sellTo(T) that allows us to sell a T to the shop.


    ```

    class Vehicle {

    class Car extends Car {

    class Sedan extends Car {

    class Shop<T> {

    private T thing;

    public T buy() { return thing; }

    public void sellTo(T thing) { this.thing = thing; }

    ```


    The table below well-typed (+) and ill-typed (-) uses of the five types Shop,
    ShopCar, Shop<?>, Shop<? extends Car>, and Shop<? extends super Car>. Note that
    Shop is the raw type using Shop<T>.


    | Operation | Type of b | Shop | ShopCar | Shop<?> | Shop<? extends Car> | Shop<?
    extends super Car> |

    | :--- | :--- | :---: | :---: | :---: | :---: | :---: |

    | b = new Shop<Object>() | | + | + | | | |

    | b = new Shop<Vehicle>() | | + | + | | | |

    | b = new Shop<Car>() | | + | + | | | |

    | b = new Shop<Sedan>() | | + | + | | | |

    | b.sellTo(object) | | | | | | | |

    | b.sellTo(vehicle) | | | | | | | | |

    | b.sellTo(car) | | | | | | | | |

    | b.sellTo(sedan) | | | | | | | | |

    | Object o = b.buyFrom() | | + | + | | | |

    | Vehicle v = b.buyFrom() | | + | + | | | |

    | Car c = b.buyFrom() | | + | + | | | |

    | Sedan s = b.buyFrom() | | + | + | | | |

    | b.sellTo(b.buyFrom()) | | | | | | | |


    For a variable b of raw type, the sellTo method will accept any object at all,
    as shown Shop<Object>. (But a Shop<Car> could not be assigned to a type of Shop<Object>;
    Although Car is a subclass of Shop, ShopCar<?> is not a subclass of Shop<Object>;
    see section 21.4.


    For a Shop<Car>, the sellTo method will accept Car or any subclass of Car, and
    the object returned by the buy method can be considered a Car or any superclass,
    such as Vehicle.


    For a Shop<?>, the sellTo method will accept neither Car nor Sedan for Vehicle
    (because the actual element T might be completely unrelated to these types; say,
    type), and the object returned by the buymethod could be assigned to a type of
    variable, but not Car nor Sedan for again (because the actual element type T might
    be completely unrelated to types)


    For a Shop<? extends Car>, the sellTo method will accept neither Car nor Sedan
    for Vehicle (because the actual element type T is a subclass of Car or Sedan (convertible).
    The object returned by the buymethod can be considered a superclass of, such as
    Vehicle.


    For a Shop<? extends super Car>, the sellTo method will accept any Car or any
    subclass of Car, as Sedan, and the object returned by the buymethod can be considered
