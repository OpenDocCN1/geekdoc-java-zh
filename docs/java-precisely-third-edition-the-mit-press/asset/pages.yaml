  md: "# Streams for Bulk Data (Java 8.0)\n\n**Example 184** Generating a Stream of\
    \ Lists of Prime Factors\nAn infinite stream of prime factors can be generated\
    \ by mapping as suitable method factorList on the infinite stream [2,3,...]. This\
    \ is used in example 185.\n\n```\npublic static List<Integer> factorList(int p)\
    \ { ... }\npublic static Stream<List<Integer>> allFactorLists() {\n    return\
    \ IntStream.iterate(2, x -> x+1).mapToObj(Streams::factorList);\n}\n```\n\nThe\
    \ computed lists of prime factors for the 11 numbers 2-12 look like:\n\n+   -\
    \ [2] [2,2] [5] [2,3] [7] [2,2,2] [3, 3] [2,5] [11] [2,2,3]\n\n**Example 185**\
    \ Collectors for Grouping and Counting\nUsing a collector, one can group the lists\
    \ of prime factors from example 184 by their length, that is, number p prime factors.\
    \ The grouping is represented by a map from p to the factor lists of length p,\
    \ group 1 contains the prime factors, as shown below.\n\nMoreover, instead of\
    \ counting all factors, one can count them another way: obtain a map from the\
    \ factor count to the number with many prime factors; so 3=123 shows that 1273\
    \ numbers between 2 and 500 have 3 prime factors.\n\n```\nMap<Integer, List<Integer>>\
    \ factorGroups = allFactorLists().limit(11).collect(Collectors.groupingBy(List::size));\n\
    // [1]= [2], [3], [5], [7], [2, 2], [2, 3], [3, 3], [2, 5], [2, 2, 2], [2, 2,\
    \ 3]\nMap<Integer, Long> factorCounts = allFactorLists().limit(5000).collect(Collectors.groupingBy(List::size,\
    \ Collectors.counting()));\n// 1=669, 2=1336, 3=1273, 4=832, 5=452, 6=224, 7=104,\
    \ 8=47, 9=22, 10=11, 11=2,1\n```\n\n**Example 186** Counting on a DoubleStream\n\
    Example 183 shows how to generate a van Corput sequence. To test that the generated\
    \ numbers are evenly distributed over [0,1] we can partition the numbers into\
    \ 10 large bins and count; there should be many numbers in each bin. We do this\
    \ by using the DoubleStream's three-argument collect with a Supplier<int[]> and\
    \ a BiConsumer<int[], int[]> that directly collect the bin counts in a 10-element\
    \ array. Generating and binning the first 100 million van Corput numbers using\
    \ this method takes 0.9 seconds using a single CPU core.\n\nAlternatively, we\
    \ could use boxed() to obtain a Stream<Double> and applied the one-argument collect\
    \ to a predefined collector, as in example 185. The grouping of every double makes\
    \ that a factor of five.\n\n*"
