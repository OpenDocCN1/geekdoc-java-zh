  md: '# Expressions


    An expression is evaluated to obtain a value (such as 117). In addition, evaluation
    of an expression may change the computer''s state; the values of variables, fields,
    and array elements; the contents of files; and so on. More

    pisely, evaluation of an expression


    +   * terminates normally, producing a value; or

    * terminates abruptly by throwing an exception; or

    * does not terminate at all (for instance, it calls a method that does not terminate).


    Expressions are built from literals (anonymous constants), variables, fields,
    operators, method calls, array accesses, conditional expressions, the new operator,
    and so on; see the table of expressions on the facing page.


    One must distinguish the compile-time type of expression from the run-time class
    of an object. Annexpression has a type (chapter 5) inferred by the caller. When
    this is a reference type t, and the value of the expression is an object o, then
    the class of o will be a right-subtype of t but not necessarily equal to t. For
    instance, the expression (Number)new Integer(2)) has type Number, but its value
    is an object whose class is Integer, a subclass of Number


    # 11.1 Table of Expression Forms


    The table of expressions shows the form, meaning, associativity, argument (operand)
    types, and result for expressions. The expressions are grouped according to precedence,
    as indicated by the horizon-rules, from high to low precedence. Higher-precedence
    forms are evaluated before lower-precedence forms. Parentheses may be used to
    emphasize or force a particular order of evaluation.


    When an operator (such as +) is left-associative, a sequence e1 + e2 + e3 of operators
    is evaluated as if

    phesized ([e1 + e2] + e3). When an operator (such as =) is right-associative,
    a sequence e = e2 = e3

    of is evaluated as if parenthesized as e = (e2 = e3).


    In the type and result type columns of the table, integer stands for any char,
    byte, short,int, long, or their boxed forms Char, Byte, Short, Integer, or Long
    (section 5.4); and numeric types for float, double, or their boxed forms Float
    or Double. The boolean types are boolean or theirnboxed form Boolean.


    For an operator with one integer or numeric operand, the promotion type is double
    if the operand has

    double; it is float if the operand has float; it is long if the operand has type
    long; otherwise it is int

    (that is, if the operand has char, byte, short, or int).


    For an operator with two integer or numeric operands (except the shift operators,
    section 11.4), the pro-nmotion type is double if any operand has type double;
    otherwise it is float if any operand has type float; otherwise, it is long if
    any operand has type long; otherwise, it is int.


    Before the operation is performed, the operands are promoted, that is, converted
    to the promotion type by

    a widening conversion (section 5.7).


    If the result is given a numeric also, it equals the promotion type. For example,
    10 / 3 has type int,

    while 10 / 3.0 has type double, and c + (byte)l has type int when c has type char.'
