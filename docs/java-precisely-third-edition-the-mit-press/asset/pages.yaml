  md: "# Example 24 Sort and Parallel Sort on Arrays\n\nAn array of n=50 million floating-point\
    \ numbers can be sorted sequentially or in parallel using methods on class Arrays.\
    \ On a 4-core i7 processor, the parallel sort is four times faster than the sequential\
    \ sort. In example the array elements are der Cor numbers in the range [0,1].\
    \ After sorting them, one can find the difference between any two neighbor elements\
    \ and find that the maximal difference is 2.98023 x 10^-8 or roughly 1 in 33 million,\
    \ which shows that the 50 million numbers are indeed dense in [0,1].\n\n```\n\
    double[] vdc = vanDerCoper().limit().toArray();\nArrays.sort(vdc);\n...\ndouble[]\
    \ vdc = vanDerCoper().limit().toArray();\nArrays.parallelSort(vdc);\ndouble min\
    \ = vdc[0], max = vdc[n-1], maxDiff = 0.0;\nfor (int i=1; i<n; i++))\n    maxDiff\
    \ = Math.max(maxDiff, vdc[i]-vdc[i-1]);\n// min = 1.49012e-08; maxDiff = 2.98023e-08;\n\
    ```\n\n# Example 25 Prefix Scans on Arrays: Random Motion in One Dimension\n\n\
    A prefix scan on an array of numbers with operation op=(x,y) -> x+y will update\
    \ every element a[i] to contain the sum of all the preceding elements a[0..i].\
    \ If we fill an array with random numbers in the range [-1,1] then we can find\
    \ each array a (Brownian motion) of particle in one dimension. The prefix scan\
    \ with op=(x,y) -> x+y will compute the particle's maximum position after each\
    \ step. We find how far the particle has traveled from the origin (0) by taking\
    \ the absolute value and computing the maximum, using all array and stream operations,\
    \ no loops.\n\n```\ndouble[] a = new Random().doubles(n, -1.0, 1.0).toArray();\n\
    Arrays.parallelPrefix(a, (x,y) -> x+y);\ndouble maxDouble = Arrays.stream(a).map(Math::abs).max().getAsDouble();\n\
    ```\n\n# Example 26 Prefix Scans on Arrays: Random Motion in Two Dimensions\n\n\
    We can change example 25 to investigate random motion in two dimensions by defining\
    \ a class VecD to represent 2D vectors. We initialize an array of vectors (random\
    \ particle steps), use prefix scan to compute the sum (particle's position at\
    \ the end of each step), the vector lengths from origin (0,0) and find their maximum,\
    \ without explicit loops, and using parallel cores. Note that randomUniform on\
    \ VecD must be thread-safe because it is parallelSetAll. Also, for efficiency\
    \ it should use java.util.concurrent.ThreadLocalRandom rather than an instance\
    \ of java.util.s Random.\n\n```\nVecD[] a = new VecD[n];\nArrays.parallelSet(a,\
    \ i -> new VecD.randomUniform());\nArrays.parallelPrefix(a, (p1, p2) -> p1.add(p2));\n\
    double maxDouble = Arrays.stream(a).mapToDouble(VecD::length).max().getAsDouble();\n\
    \nprivate static class VecD {\n    public final double x, y;\n    public double\
    \ length() { return Math.sqrt(x * x + y * y); }\n    public VecD add(VecD that)\
    \ { return new VecD(this.x+that.x, this.y+that.y); }\n    public static VecD randomUniform()\
    \ {  ... }\n```"
