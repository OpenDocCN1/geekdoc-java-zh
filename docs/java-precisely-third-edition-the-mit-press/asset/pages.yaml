  md: '# 26.2 Kinds of Input and Output Methods


    The following table summarizes the naming conventions for the input and output
    classes as well as their main characteristics, such as their end-of-stream behavior.


    | Method Name | Effect |

    | --- | --- |

    | read | Inputs characters from a Reader (section 26.4) or inputs bytes from an
    InputStream (section 26.9). It blocks, that is, does not return, until input is
    available; returns -1 on end-of-stream. |

    | write | Outputs characters to a Writer (section 26.5) or outputs bytes to an
    OutputStream (section 26.10). |

    | format | Uses a formatting string to convert values to textual representation
    and outputs that representation to a PrintWriter or OutputStream (section 7.1).
    |

    | print | Converts a value (int, double..., Object) to textual representation
    and outputs it to a PrintWriter or OutputStream (section 7.1). |

    | println | Same as print but outputs a newline after printing. |

    | printf | Same as format (section 7.1). |

    | readt | Inputs a value of primitive type t from a DataInputStream (section 26.11).
    Blocks until input is available; throws EOFException on end-of-stream. |

    | writet | Outputs a value of primitive type t to a DataOutputStream (section
    26.11). Blocks until input is available. |

    | readObject | Deserializes objects from an ObjectInputStream stream (section
    26.2). Blocks until input is available; throws IOException. |

    | writeObject | Serializes objects to an OutputStream stream (section 26.2). |

    | skip(n) | Skips at most n bytes (from InputStream) or n characters (from Readers).
    If n>0, blocks until input is available; if n<0, throws IllegalArgumentException;
    returns 0 on end-of-stream. |

    | flush | Writes any buffered data to the underlying IO stream, then flushes.
    The effect is to make sure that all data has been accurately written to the system
    or network. |

    | close | Closes the IO stream, then flushes all underlying streams. Further operations
    on the IO stream, except close, throws IOException. Buffered writers and output
    streams should be explicitly closed or flushed to make sure that all data have
    been written; otherwise output data may be lost, even in the case of normal program
    termination. |


    # 26.3 Imports, Exceptions, Thread Safety


    A program using the input and output classes may contain the import declaration


    ```

    import java.io.*;

    ```


    Most input and output operations can throw an exception of class IOException or
    one of its subclasses, all of which are checked (chapter 15). Hence method input
    or output must either do so in a try-catch block (section 12.6.6) or have the
    declaration throws IOException (section 9.8).

    The standard implementation of input-output is thread-safe: multiple threads (chapter
    20) can safely read from or write to the same stream without pinpointing contention.
    However, the Java class documentation is not explicit on this point, so one should
    probably avoid using the same IO from multiple threads, or explicitly synchronize
    on the IO stream.'
