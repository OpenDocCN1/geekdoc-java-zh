  md: '# 28 Metadata Annotations


    Annotations are used to attach metadata to a target, where a target may be a constructor
    declaration, a local variable declaration, a method declaration, a package declaration,
    a parameter declaration, a type declaration (class, interface, enum type), or
    the declaration of another annotation type.


    An annotation of type Annotation is attached to its target by writing @Anno(fl=el


    13.4 shows how to define and use annotation types, as well as some meta-annotations
    used when declaring annotation types.


    The most important standard annotation types are:


    | Annotation Type | Target | Meaning | Section |

    |---|---|---|---||

    | @Deprecated | Declaration | Use is discouraged | |

    | @FunctionalInterface | Interface | Is a functional interface | 23 |

    | @Inherited | | Annotation is inherited | 13.4 |

    | @Override | Method | Must be inherited method | |

    | @Retention | Annotation | How long annotation is kept | 13.4 |

    | @Repeatable | | Allow multiple use on target | 13.4 |

    | @SafeVarargs | Declaration | Parameter array T... is safe | |

    | @SuppressWarnings | Declaration | Suppress compiler warnings | |

    | @Target | Annotation | Legal annotation types | 13.4 |


    The standard annotations for the java package have the following:

    @Deprecated is used on program elements that should no longer be used. Any use
    of such a program element causes a compiler warning.

    @FunctionalInterface is used on an interface declaration to indicate that it is
    functional, and has exactly one abstract method (chapter 23). For instance, all
    the interfaces on page 125 superclass or implemented interface have this.


    @Override is used on a method declaration that must be inherited from a superclass
    or implemented interface. If it does not, a compile-time error is produced.

    @SafeVarargs can be used on a static declaration that has a parameter array T...
    whose T is a generic type or type parameter, to indicate that the method or constructor
    uses that safety. (Section 9.9 describes parameters). This suppresses "unchecked"
    warning both at the declaration site and at every call to the method or constructor.
    The annotation should be used only if the method or constructor does not write
    to the array xs and does not leak the array reference xs.


    @SuppressWarnings can be used on a declaration to indicate that the compiler should
    not issue specific kinds of warnings for this particular declaration. A typical
    use is to avoid "unchecked" warnings on generic array creation.'
