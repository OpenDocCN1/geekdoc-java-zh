  md: '# Mathematical Functions


    Class Math provides methods to compute standard mathematical functions. Floating-numbers
    (double and float) include positive and negative infinities as non-numbers (NaN),
    following the IEEE754 standard [4]. There is also a distinction between positive
    zero and negative zero, ignored here.


    The methods return non-numbers (NaN) when applied to arguments, and return infinity
    in case of overflow; they do not throw exceptions. The methods return NaN when
    applied to arguments, except where noted, and behave sensibly when applied to
    positive or negative infinities.


    Angles are given in radians and not degrees. Methods do not round to the nearest
    integer or the nearest even integer in case of a tie. The methods abs, min, and
    max are overloaded over float, int and long arguments. There are also hyperbolic
    functions cos, sinh, and tanh.


    +   * static double E is the constant ~2.71828, the base of the natural logarithm.

    * static double PI is the constant ~3.14159, the circumference of a circle with
    diameter 1.

    * static double abs(double x) is the absolute value if x<0, and -x if x>0.

    * static double acos(double x) is the arc cosine of x, in the range [0,π/2], for
    -1<x<=1.

    * static double asin(double x) is the arc sine of x, in the range [-π,π/2], for
    -1<=x<=1.

    * static double atan(double x) is the arc tangent of x, in the range [-π/2,π/2].

    * static double atan2(double y, double x) is the arc tangent of y/x in the quadrant
    of (x, y), in the range [-π,π]. When x is 0, the result is π/2 with the sign as
    y.

    * static double ceil(double x) is the smallest integer value.

    * static double cbrt(double x) is the cube root x; for negative x, cbrt(x) equals=-cbr(-x).

    * static double cos(double x) is the cosine of x, in the range [-1,1].

    * static double exp(double x) is the exponential of x, that is, e to the power
