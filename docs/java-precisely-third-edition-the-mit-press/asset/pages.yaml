  md: 'Generic Types and Methods


    # Generic Types and Methods


    Generic types and methods provide a way to strengthen type checking at compile-time
    at the same time making programs more expressive, reusable and readable. The ability
    to have generic types and methods is also known as parametric polymorphism.


    # 21.1 Generics: Safety, Generality, and Efficiency


    The original Java language did not support generic types and methods. Therefore
    a library for manipulating arbitrary kinds of values would have to cast those
    values to type Object. For instance, we might use an ArrayList to help Person
    objects, but the add and get methods of the array list would have to accept and
    return values of type Object. This works has several negative consequences that
    could be avoided by using generic types; examples 116 and 117.


    # 21.2 Generic Types, Type Parameters, and Instances


    A generic class declaration class<T1,...,Tn> { ... } has one or more type parameters
    T1,...,Tn. The body of the declaration is an ordinary class body (section 9) in
    which the type parameters T1 can be used almost if they were ordinary types; see
    section 21.6. A generic class is also a parameterized class.


    A generic C<T> is not a class. Rather, it is a mechanism or template for classes
    such as C<Integer> or even C<String> and so on, can be generated, by replacing
    the type parameter T1 by type tl, such as Integer, or C<String>. The resulting
    classes are generic instances. The type T1 used to replace the type parameter
    T1 can be any type expression—a class, an interface—or it can be a type instance.
    However, it cannot be a primitive type such as int, nor the pseudo-type void (which
    can be used only to indicate that a method has no return value).


    Generic interfaces (21.7) can be declared and type instances can be created from
    them. Again, a generic interface is not an interface, but a type instance of a
    generic interface is an interface.


    Generic methods (21.8) can be declared by specifying the type parameters on the
    method declaration in addition to any type parameters specified by the enclosing
    class or interface type.


    Section 21.11 compares the implementation of Java generic types and methods with
    C++ templates and C# generic types and methods.


    # 21.3 How Can Type Instances Be Used?


    A type instance such as C<Integer> can be used anywhere an ordinary reference
    type can be used: as the type of a field, variable, parameter or return type;
    as the element in an array in some contexts; as a constructor name new C<...>;
    and so on. However, there are the following restrictions:


    +   - One can use a type instance in cast expression such as (C<Integer>)e but
    such a case is sometimes reported by the compiler to be unchecked (section 21.6).


    +   - One cannot use a type instance as an instance test expression such as (instanceof
    C<Integer>).


    +   - One cannot use a type instance as the element type of an array in array
    creation expression as new C<Integer>[5]. But new ArrayList<C<Integer>>() is legal,
    see section 21.11.'
