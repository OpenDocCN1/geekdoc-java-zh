  md: '# 24.4 Numeric Streams: DoubleStream, IntStream, and LongStream


    Numeric streams may be represented by primitive-type specialized interfaces {Double,Int,Long}Stream
    for efficiency; see 23.3. They have additional methods average(), max(), min(),
    sum(), and mapToObject. The argument and result types of Stream<T> methods are
    primitive-type specialized. For instance, the iterator() returns PrimitiveIterator.Of<Double,Int,Long>
    objects (see 22.7), and the generate method''s signatures in IntStream and Stream<T>
    look like this:


    ```

    static IntStream generate(Supplier supp)

    static Stream<T> generate(Supplier<T> supp)

