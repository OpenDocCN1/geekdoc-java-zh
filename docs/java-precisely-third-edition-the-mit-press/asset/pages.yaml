  md: '# Reflection


    # 27 Reflection


    Reflection permits a program to inspect and manipulate the classes, interfaces,
    methods, and fields of the program itself. For every non-generic type in a Java
    program, there is an object of class java.lang.Class that represents type t. From
    one can get representation of the members (fields, methods, and nested types)
    of type t, as well as other information. Using reflection, one can create objects
    and arrays, call methods, and get the value of fields, but cannot create new types,
    nor add methods to existing types. There are third-party libraries for creation
    of new types.

    Reflection provides dynamic adaptability but implies that the usages (of argument
    types in a method, instance) cannot be performed at compile-time. They must be
    performed at run-time, and in this time, reflection is slow and may fail, throwing
    exceptions; except in section 27.4.


    # 27.1 Reflective Use of Types: The Class<T>


    If t is a type, the expression t.class evaluates the object that represents type
    t at run-time. The t may be a class C or an interface or an array type as int[]
    or an enum type annotation or a primitive type as int or the pseudo-void. It cannot
    be a generic G<T> or a type instance as G<Integer>; instead use the raw type G,
    as in G.class.

    When o has reference type and is not null, the expression o.getClass() has raw
    class and evaluates the object that represents the run-time type of o. Class<T>
    has the following methods:


    +   * Class.forName(String name) returns the object representing the class name,
    loading it if not already loaded.

    * getModifiers() returns the modifiers of the class; see example 221.

    * newInstance() returns a new object of the class, as if by a call to an anonymous
    constructor.

    * boolean isInstance(Object o) returns true if o is not null and can be assigned
    to a variable of type t, where t is the type represented by the Class object;
    otherwise false.

    * cast(Object o) returns type t if o can be assigned to the variable t represented
    by the Class object; otherwise throws ClassCastException. In particular, if o
    is null.


    This Instance and Class<T> are dynamic versions of instance and type (sections
    18.8 and 11.11).

    In addition, Class<T> has methods to get the fields, methods, constructors, and
    nested types of type t, shown below. The methods on the left return only public
    members, inherited ones, which are nested types on the right return only methods
    declared in the class, not inherited ones


    | Public Members (Including Inherited) | Declared Members (Including Public Ones)
    |

    | :--- | :--- |

    | Single | getField(name) | Field getDeclaredField(name) |

    | | getMethod(name, parTy) | Method getDeclaredMethod(name, parTy) |

    | | Constructor<> getConstructor(parTy) | Constructor<> getDeclaredConstructor(parTy)
    |

    | All | getFields() | Field[] getDeclaredFields() |

    | | getMethods() | Method[] getDeclaredMethods() |

    | | getConstructors() | Constructor[] getDeclaredConstructors() |

    | | getClasses() | Class[] getDeclaredClasses() |


    A field is identified by its name (a String), a method is identified by its name
    and parameter type par(an array[] or a parameter array Class...), and a constructor
    is identified by its parameter type par. The types Field, Method, and Constructor
    are explained in sections 27.2 and 27.3.


    *'
