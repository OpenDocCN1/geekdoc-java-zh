    \ of words into a text with a right-hand margin should produce lines of a specified\
    \ length, unless there is only one word on the line or the line is one. This requirement\
    \ can be expressed and checked using an assert statement. The complete example\
    \ file, available online (the book's preface), gives the details of the algorithm\
