  md: '# 22.5 Interface Map<K,V> and Implementation HashMap<K,V>


    Map<K,V> interface describes the following methods. A map can be considered a
    collection of entries, where an entry is a (k, v) of a key k of type K and a value
    v of type V. Both K and V must be reference types, values of primitive type as
    int must be inserted and unboxed when retrieved; in Java this is done automatically
    (section 5.4). A map can contain no two entries with the same key.


    +   - `clear()` removes all entries from this map.

    - `boolean containsKey(Object k)` returns true if the map has an entry with key
    k.

    - `boolean containsValue(Object v)` returns true if the map has an entry with
    value v.

    - `Set<Map.Entry<K,V>> entrySet()` returns a set of the map''s entries; each entry
    type `Map.Entry<K,V>` (see below).

    - `boolean equals(Object o)` returns true if o is a Map with the same entries.

    - `V get(Object k)` returns the value v in the entry (k, v) if key k; otherwise
    null.

    - `int hashCode()` returns the hash code for the map, computed as the sum of the
    hash of the entries

    - `boolean isEmpty()` returns true if the map contains no entries; that is, if
    size() is zero.

    - `Set<K> keySet()` returns a set of keys in the map.

    - `V put(K k, V v)` modifies the map so that it contains the entry (k, v); returns
    the value previously associated with k, if any; else returns null.

    - `V remove(Object k)` removes the entry with k from the map; returns the value
    previously associated with k, if any; else returns null.

    - `int size()` returns the number of entries, which equals the number of keys,
    in the map.

    - `Collection<V> values()` returns a collection of values in the map.


    The Map<K,V> interface (example 142) describes operations on map entries:


    +   - `K getKey()` returns the key in this entry.

    - `V getValue()` returns the value in this entry.


    The HashMap<K,V> class implements the Map<K,V> interface and has the following
    constructors. On a HashMap it uses the equals and hashCode methods of the keys.


    +   - `HashMap()` creates an empty HashMap.

    - `HashMap(Map<? extends K,? extends V> m)` creates a HashMap<K,V> containing
    the same entries as map.


    The LinkedHashMap<K,V> class is a subclass of HashMap<K,V> and works the same
    but also guarantees that its iterator traverses the entries in insertion order
    (rather than the unpredictable order provided by HashMap).


    The IdentityHashMap<K,V> class implements Map<K,V> but compares keys using reference
    equality (==) instead of the equals method, and computes hash values using System.identityHashCode
    instead of hashCode.'
