    # Example 145 A Class Implementing Comparable<Time>


    A Time object represents the time of day 00:00-23:59. The method t1.compareTo(t2)
    returns a negative number if t1 is before t2, a positive number if t1 is after
    t2, and if they are the same.


    ```

    class Time implements Comparable<Time> {

    public final int hh, mm; // 24-hour clock

    public Time(int hh, int mm) { this.hh = hh; this.mm = mm; }

    public int compareTo(Time t) {

    return hh != t.hh ? hh - t.hh : mm - t.mm;

    }

    public boolean equals(Object o) { ... } // See below

    public int hashCode() { return 60 * hh + mm; }

    }

    ```


