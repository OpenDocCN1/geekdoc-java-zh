    # Example 16 Locale-Specific Formatting of Times


    The formatting of date and time often depends on the locale: language and nationality.
    For instance, this is the case for the formatting specifier %tc The locale is
    in package java.util.


    ```

    Date now = new Date();                               // default locale

    System.out.format("%$tc%n", now);                          // en_US locale

    System.out.format(Locale.US, "%$tc%n", now);                  // en_DE locale

    System.out.format(Locale.GERMANY, "%$tc%n", now);          // de_DE locale

    ```


    # Example 17 Locale-Specific Formatting of Numbers


    Number formatting is locale sensitive: different languages use different decimal
    separators (point or comma). For instance, this example uses 1,234,567.90 and
    1.234.567,90 where the spaces in the latter number are non-breaking spaces (Latin
    1 character ''\u00A0'').


    ```

    double d = 1234567.9;

    System.out.format(Locale.US, "%$2fn%n", d);                    // en_US locale

    System.out.format(Locale.GERMANY, "%$2fn%n", d);          // de_DE locale

    System.out.format(Locale.FRANCE, "%$2fn%n", d);               // fr_FR locale

    ```


    # Some Date and Time Specifiers and Their Effect


    Different languages and countries have very different conventions for writing
    dates, requiring different formatting specifiers with string String.format. In
    general, the locale mechanism is not sufficient to write locale-specific dates,
