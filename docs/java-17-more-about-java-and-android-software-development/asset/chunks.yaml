    will have the entire screen available for the list. If your phone is held horizontally
    or is it a tablet, the program works as before and uses the layout `activity_main_wide.xml`.


    Below is shown the class of the new activity:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_33.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_34.jpg)


    In `onCreate()` the program test if a parameter has been transferred (which is,
    if any, the index on a book), and if so, a `FragmentManager` is used to find a
    reference to the `Fragment` object and the method `setBook()` is called.


    Back there is the class `MainActivity`, where the event handler `onSelectedBookChanged()`
    needs to be updated:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_34.jpg)


    In the same way as previously the program attempts to determine a reference to
    a `BookFragment`. If this is not possible (or such a fragment is not visible),
    the new activity opens with the book’s index as a parameter, and otherwise nothing
