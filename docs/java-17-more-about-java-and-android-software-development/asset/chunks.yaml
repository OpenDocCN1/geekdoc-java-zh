    ## 9 More on services


    In the previous book I have treated services, but there is more to add, and especially
    how an activity can communicate with a service. This is the subject of this chapter.


    If a component starts a service by calling `startService()`, the service will
    run until it stops itself with `stopSelf()` or another component stops it by calling
    `stopService()`. If a component instead starts a service by calling `bindService()`,
    the service will run as long as there are components that are bound to it and
    only when the service is no longer bound to clients, Android will shut it down.
    However, a service can also be stopped if the system is missing memory, and it
    is necessary to obtain resources for the activity that the user is working with.


    If a service is started with `startService()`, there is no direct communication
    between the starting activity and the service. The service carries out its work,
    and it is not possible to send a message to it (in addition to stopping it) and
    the service can not call a method on the starting activity, but you can only get
    to know about it in the form of a toast or a notification. Should there be a direct
    communication, it is necessary to deposit an intermediary called a receiver. If
    the service has to be able to receive messages from the activity, the service
    must instantiate a receiver object, which is a `BroadcastReceiver` object and
    register this object as a receiver who wishes to receive messages with a particular
    ID. The same applies to the activity that wishing to receive messages from the
    service, it must also create and register a receiver object.


    The application `TheServices1` opens the following window:


    ![](image/Image2126.jpg)


    If you click the START button, a service is started as every second sends a message
    (a counter is counted up with 1), and that means that the activity every second
    receives a message from the service. Clicking the STOP button stops the service.
    Finally, the last button is used to send a message to the service, which is the
    text entered in the input field, after which the service sends a message back
    to the activity with the text converted to uppercase letters. This means that
    the activity must also instantiate a receiver object so that it can receive messages
    from the service. When the service converts a received message to uppercase letters,
    it is only to show that the service has done something. Below is the application’s
    window after clicking the START button and after a text has been entered and clicked
    on the SEND button:


    ![](image/Image2137.jpg)


    With regard to the layout, there is nothing new, and it is only about placing
    6 components in a window. The service is called `TheService`, and the code is
    as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_117.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_118.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_119.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_120.jpg)


    Please first note that it is a service as the class inherits `Service`. Then note
    that the class `TheService` has two inner classes. The class starts by defining
    6 constants, which are used to define parameters associated with `Intent` objects,
