    # 7 External storage


    In the previous book on files, I only showed examples of using internal storage,
    which is storage associated with the single application. In this chapter, I will
    show an example that shows how to use external storage, which is storage that
    may contain data that can be used by multiple applications.


    There are actually two types of external storage


    1. `Primary External Storage`, which physically is part of the phone and whose
    size is determined by the phone’s producer.

    2. `Secondary External Storage`, which is typically a SD card, but may also be
    a device connected to the phone with a cable.


    The following example relates only to the first type of external storage, as it
    is the most effective form of external storage, and since the device does not
    necessarily have a SD card. From Android version 6, it is quite simple to use
    external storage on a SD card, but the supplier may not have opened up the possibility.
    The reason is lacking security, and Android actually recommends not using a SD
    card as external storage.


    When I in the following refer to external storage, it means primary external storage,
    but otherwise the use of external storage is in principle similar to that shown
    for internal storage in the previous book. The project `TheStorage` opens a window


    ![](image/Image2094.jpg)


    where at the top there is an `EditText` component for entering a text. Below is
    a `TextView` component to display a text and finally there are three buttons in
    which the first button is used to save the input text into a file in external
    storage, while the next is used to load the content of the file and show it in
    the `TextView` component. Finally, the last button is used to display an information
    about the file system.


    First step is the manifest, where you has to give the right to use external storage:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_100.jpg)


    There are two `uses-permission` elements listed. Here, `WRITE_EXTERNAL_STORAGE`
    permission automatically provides `READ_EXTERNAL_STORAGE` permission, so the last
    one is only necessary if you just want to read external storage.


    Regarding the layout, I will not display the XML code here as only 5 components
    are placed using a `RelativeLayout,`, but in return, the Java code fills a lot:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1001.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_101.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_102.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_103.jpg)


    Initially, two constants are defined which are used in connection with a callback
    method. Next, there are two variables for the two text components in the user
    interface. These variables are initialized in `onCreate()`, but else `onCreate()`
    only consists of associating event handlers with the three buttons where each
    handler calls a method.


    The event handler for the `SAVE` button calls the method `askWritePermission()`.
    From before Android version 23, an application had write permission for external
    storage, as long as it was stated in the manifest, but from version 23 and later,
    the requirements have been sharpened so that the user must now actively grant
    permission in a simple dialog box (this is only the first time, where the user
    performes the program and see also chapter 11).


    In `askPermission()`, first the Android version is tested, and if it is less than
    23, nothing happens and the method returns `true`. Otherwise, the following method
    is used


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_104.jpg)


    to test if you have the required permission and is it not the case, then the method


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_105.jpg)


    is called and `askPermission()` returns `false`. It is the method `requestPermissions()`
    that opens the dialog where the user must actively assign the desired permission.
    The method `requestPermissions()` calls the callback method


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1051.jpg)


    which returns the result of the user’s choice. In this case, if the user has granted
    permission, so the method `writeFile()` is called, which writes to the file, and
    otherwise a simple `Toast` appears indicating that no permission was granted.


    If the method `askPermission()` method returns `true`, the method `askWritePermission()`
    will call `writeFile()`.


    Then there’s the method `writeFile()` that does not really add so much new to
    what I’ve previously treated with internal storage, and the most important thing
    is the call:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1052.jpg)


    which determines the name of a file in external storage. You should note that
    the file is stored in the root of external storage, which obviously does not have
    to be the case. The file name is hard-coded to make it simple, and in practice
    it is of course not appropriate appropriate.

