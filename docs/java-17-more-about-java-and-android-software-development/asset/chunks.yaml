    在你将应用发布到应用商店以便在 Android 设备上下载和安装之前，它必须使用证书进行签名。此类证书必须从 PKI（如 `Verisign` 或 `Thawte`）购买，该证书允许你对项目的
    `.apk` 文件（包含应用组成的所有内容）进行签名。证书存储在 `keystore` 中，为此你可以使用 `JDK` 自带的名为 `keytool` 的工具。如果你开发了一个应用并在手机上测试过它，你实际上已经使用过证书和
    keystore，因为 Android Studio 会创建一个 keystore（`Debug Keystore`）并用所谓的自签名证书对你的应用进行签名。当然，这种证书是无人信任的证书，因此有必要从他人信任的机构（`Verisign`
    或 `Thawte`）购买证书。


    一旦你有了证书，就可以对你的应用（即你的 `.apk` 文件）进行签名，你可以使用另一个名为 `jarsigner` 的工具。然后，你的应用就可以准备上传到
    Google Play 等应用商店了。


    # 12 最后一个示例：WineApp


    书籍 `Java 6` 的最后一个示例是一个用于管理私人酒窖的程序。该程序在功能和能力方面原则上是非常出色的，但在实际使用中存在一个大问题，即它是一个 PC
    程序，这意味着你必须坐在电脑前才能访问（购买）葡萄酒，相应地，每次使用一瓶酒时（尤其是最后一瓶）都是问题。你无法完成它。你会将其推迟到你在电脑前的时候。因此，考虑一个像手机应用这样的解决方案是理所当然的，这意味着你将随身携带这个程序。这样，使用该程序的机会将大得多，以下将关于如何将
    `WineApp` 程序实现为手机应用。因此，你可以将此任务视为程序从一个平台迁移到另一个平台的任务。


    程序基本上应该与之前的版本相同且工作方式一致，但程序必须使用 `SQLite` 代替 `MySQL`。此外，应该考虑是否有需要更改的功能，最后特别是从简化应用程序使用的角度来看。此外，你应该使用手机的摄像头，这样就可以保存酒瓶的照片。


    将应用程序迁移到手机的挑战之一正是小屏幕。应用程序的用户界面必须分别为手机和平板进行定制，但由于用户对话大部分由数据输入组成，且由于手机没有适当的用户界面（由于虚拟键盘），因此决定程序不应支持横屏模式。


    ## 12.1 开发计划


    应用程序的开发计划包括以下迭代，其中每次迭代的结果都是上一次迭代结果的扩展。


    | `MainActivity`。启动活动上应该包含什么，特别是如何在应用程序功能之间导航。 | 2 |

    | 程序架构、设计以及数据库的实现。 | 2 |

    | 葡萄酒属性维护：生产者。 | 1 |

    | 葡萄酒属性维护：供应商。 | 1 |

    | 葡萄酒属性维护：国家。 | 1 |

    | 葡萄酒属性维护：地区。 | 1 |

    | 葡萄酒属性维护：分类。 | 1 |

    | 葡萄酒属性维护：葡萄。 | 1 |

    | 葡萄酒属性维护：酒类型。 | 1 |

    | 葡萄酒属性维护：类别。 | 1 |

    | 葡萄酒属性维护：酒瓶 / 包装。 | 1 |

    | 创建葡萄酒。包括拍照。 | 4 |

    | 维护葡萄酒。包括照片的维护。 | 3 |

    | 购买葡萄酒。 | 3 |

    | 消费葡萄酒。 | 3 |

    | 搜索葡萄酒。 | 4 |

    | 监控可以饮用的葡萄酒。 | 3 |

    | 重构和测试。 | 4 |

    | 部署 | 2 |


    右列的数字表示迭代的复杂度。它们没有指定具体的的时间预估，但表达了程度以及在何处会有特殊挑战。假设 `1` = 半个工作日，这意味着预计工作量约为 20 个工作日。经验表明，总会有事情花费更长的时间，通常建议将预估时间延长例如
    25%，如果是这样，我将时间估计为大约 25 个工作日，如果程序由一个开发者编写，那么大约需要 1 个月。


    最后，在开发过程中可能会出现新功能，如果是这样，非常有必要扩展预估。


    查看上述时间预估，它们并不精确，人们可以预料某些预估的任务可能会比预期的要长，但也可能有其他任务花费的时间比预估的少，部分原因是由于几次迭代是相似的，因此在某种程度上它们是彼此的重复。如果事实是你节省了时间并领先于进度，在原则上是好的，但你应该在项目早期谨慎调整你的预期耗时，因为存在其他迭代可能被低估的风险风险，如果其他迭代留出了时间储备，那是好的，因为你稍后在过程中会有事情可以处理。


    时间估计是软件开发中最困难的决策之一，软件开发者倾向于低估（或出于政治/商业原因故意这样做）。这种方法是将一个任务分解许多许多小的子任务，每个子任务都足够小且复杂度足够，以至于你可以评估任务所需的时间。即使达到了这一步，时间也伴随着巨大的不确定性，因为实践表明总会有任务由于某些原因比比预期的要长。原因有很多，从简单任务突然比预期的要长，到在开发过程中出现新需求。对于后者需要特别注意，必须对新需求进行时间预估并纳入项目计划中。


