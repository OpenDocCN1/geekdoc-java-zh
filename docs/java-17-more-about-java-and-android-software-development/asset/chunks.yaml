    \ 方法。有了这两个类后，我将 `MainActivity` 修改为：\n\n![](img/Java_17_–_More_about_Java_and_Android_28-8-18_109.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_110.jpg)\n\
    \n唯一需要注意的是 `buildHtml()` 方法，它动态构建了一个带有 HTML 的字符串，并且 `WebView` 组件使用 `loadData()`\
    \ 方法显示此文本。如果你运行程序，结果如下：\n\n![](img/Image2117.jpg)\n\n## 8.2 连接到 URL\n\n`WebView`\
    \ 组件可以用于显示网站，但从手机上的应用来看，这远不是互联网的典型用法。更多情况下，你感兴趣的是通过连接到 URL 获取数据到你的手机上。这可能是一个以某种格式返回数据的网络服务，实际上有很多此类服务是公开的，任何想要使用它们的人都可以直接使用。这些许多服务返回\
    \ JSON 数据，这并不重要，而且由于有标准的解析器，所以它们很容易使用。在本节中，我将展示一个连接到此类服务并获取服务数据的应用。该应用没有使用相关数据（不解释数据），但在获取数据后，`Toast`\
    \ 会告诉获取了多少字符。\n\n相关服务的地址为：\n\n![](img/Java_17_–_More_about_Java_and_Android_28-8-18_110.jpg)\
    \ 该服务引用的地址是：\n\n![](img/Java_17_–_More_about_Java_and_Android_28-8-18_111.jpg)\
    \ \n\n它是一个提供免费数据的服务。项目名为 `TheWeb3`，布局是点击按钮连接到上述地址，并获取 JSON 数据，但没有解释它们。`MainActivity`\
    \ 的代码如下：\n\n![](img/Java_17_–_More_about_Java_and_Android_28-8-18_112.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_113.jpg)\n\
    \n按钮的事件处理器创建了一个 `InternetTask` 并执行 `execute()`。`InternetTask` 是一个继承自 `AsyncTask`\
    \ 的内部类，这是一个带有三个参数的泛型类。该类的目标是启动一个在后台线程执行的操作，并更新 UI 线程。你必须重写四个方法，其中 `onPreExecute()`\
    \ 在操作发生前由 UI 线程执行，位于 `InBackground()` 方法之前。类的第一个参数类型指示 `InBackground()` 的参数类型。第三个重写的方法是\
    \ `onProgressUpdate()`，它同样在 UI 线程执行并从 `InBackground()` 间接调用以说明操作进度。类的其他参数类型指示该方法。最后一个重写的方法是\
    \ `onPostExecute()`，它也由 UI 线程执行，但在 `InBackground()` 方法完成后执行。第三个参数类型指示该方法的参数类型，通常是\
    \ `InBackground()` 的返回值。操作从 `execute()` 方法开始，它执行 `onPreExecute()`，创建一个执行 `InBackground()`\
    \ 的线程，在线程结束后 `execute()` 执行 `onPostExecute()` 方法。\n\n在这种情况下，只有两个方法是不简单的。`MainActivity`\
    \ 有一个名为 `fetchUrl()` 的方法，`InBackground()` 调用该方法并返回结果。也就是说，`fetchUrl()` 在后台线程执行，在方法完成后，`Toast`（`onPostExecute()`\
