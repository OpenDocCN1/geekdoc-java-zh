    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_83.jpg)


    Then you must implement the four methods defined by the two interfaces:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_831.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_84.jpg)


    # 6 Preferences


    A phone (and any other Android device) has an application called Settings, which
    is used for the phone’s settings. The settings you choose are still valid after
    the device is restarted and must therefore be stored somewhere. This could be
    done in a database or a file, but it is small amounts of data, and Android saves
    these kind of information as key / value pairs using a special system called *preferences*.
    In the same way as for the device itself, you often need to be able to save settings
    for your own applications, and instead of using files or databases, you can use
    the preference system.'
