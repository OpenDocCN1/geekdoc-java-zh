    ## 9 关于服务的更多内容


    在之前的书中，我已经介绍过服务（services），但还有更多内容可以补充，特别是 activity 如何与服务通信。这是本章的主题。


    如果一个组件通过调用 `startService()` 启动服务，该服务将一直运行直到它通过 `stopSelf()` 停止，或者另一个组件通过调用 `stopService()`
    停止它。如果组件是通过调用 `bindService()` 启动服务的，只要有组件绑定到它，服务就会一直运行，只有当服务不再绑定客户端时，Android 才会将其关闭。然而，如果系统缺少内存且需要为用户正在操作的
    activity 获取资源，服务也可以被停止。


    如果使用 `startService()` 启动服务，则启动 activity 与服务之间没有直接通信。服务执行其工作，无法向它发送消息（除了停止它之外），服务也无法调用启动
    activity 的方法，但你只能通过 toast（吐司）或通知的形式了解它的情况。如果需要直接通信，则有必要放置一个名为“接收器”（receiver）的中间件。如果服务必须能够接收来自
    activity 的消息，服务必须实例化一个接收器对象（这是一个 `BroadcastReceiver` 对象），并将该对象注册为想要接收特定 ID 消息的接收器。想要从服务接收消息的
    activity 也是如此，它也必须创建并注册一个接收器对象。


    应用程序 `TheServices1` 打开了以下窗口：


    ![](img/Image2126.jpg)


    如果你点击 START 按钮，服务将启动并每秒发送一条消息（计数器加 1），这意味着 activity 每秒都会收到来自来自服务的消息。点击 STOP 按钮会停止服务。最后，最后一个按钮用于向服务发送消息（即输入字段中输入的文本），之后服务会将文本转换为大写字母并回传给
    activity。这意味着 activity 也必须实例化一个接收器对象，以便其接收来自服务的消息。当服务将收到的消息转换为大写字母时，仅仅是为了显示服务已经执行了操作。以下是点击
    START 按钮并在输入文本后点击 SEND 按钮后的应用程序窗口：


    ![](img/Image2137.jpg)


    在布局方面，没有新内容，只是关于在窗口中放置 6 个组件。该服务名为 `TheService`，代码如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_117.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_118.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_119.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_120.jpg)


    请先注意这是一个服务，因为该类继承了 `Service`。然后注意 `TheService` 类有两个内部类。该类开始时定义了 6 个常量，用于定义与 `Intent`
    对象相关的参数，以及服务必须执行的操作。唯一的要求是你拥有严格的标识，但实际值并不重要——仅与调试有关。


    在 6 个常量之后，定义了三个变量，第一个表示接收器——类型为 `TheReceiver`——这样应用程序就可以向服务发送消息。下一个代表一个每秒将计数器加
    1 的线程，最后一个变量是计数器。


    接收器对象在 `onCreate()` 中创建，是一个类型为 `TheReceiver` 的对象，它是一个内部类。你应该注意该类继承了 `BroadcastReceiver`，因此你必须实现
    `onReceive()` 方法。它有两个参数，第一个是发送消息的 `Context` 对象，最后一个是封装在 `Intent` 对象中的消息。该方法确定
    Intent 对象中 `getAction()` 的值，如果该值是 6 个常量之一，则确定一个键为 `KEY_MESSAGE_SERVICE` 的参数。该参数的值被转换为大写字母并封装到名为
    `GET_MESSAGE_SERVICE` 的 `Intent` 对象中，之后通过 `sendBroadcast()` 发送。你应该注意它是 `Context`
    中的一个方法。


    程序还实现了 `onStart()`，在其中触发接收器。`IntentFilter` 定义了接收器必须处理的两个动作，之后对其注册。同样注意 `onStop()`
    的实现，它移除了注册。


    然后是 `Mainvity` 类：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1211.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_122.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_123.jpg)


    该类开始定义 3 个变量，用于引用用户界面中的文本字段。此外，有一个接收器变量，类型为 `TheReceiver`，这是一个内部类。最后，有一个 `Intent`
    变量用于启动服务。在 `onCreate()` 中，三个变量初始化为组件，并为三个按钮关联事件处理器。


    START 按钮的事件处理器调用 `startService()`，这与之前的书中一样，启动一个类型为 `TheService` 的服务。该服务在 STOP
    按钮的事件处理器中停止。最后，是最后一个事件处理器发送输入字段中输入的文本。这与上面通过 `sendBroadcast()` 实现的方式相同。在这里你应该注意，如果服务没有启动，则什么都不会发生，因为这仅仅意味着没有该动作的监听器。

