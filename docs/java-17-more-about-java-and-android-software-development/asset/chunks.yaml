  raw: 'I want to start this book with fragments, which was actually something of
    what I lacked in the last example of the previous book. Just like an activity,
    a *fragment* is a layout, which is an XML document, that defines the layout and
    content of a window (part of a window = a fragment) and then a Java class. A window
    (an activity) can thus consist of several fragments, each fragment defining a
    part of the window. The use is that at run time you can replace a fragment with
    another fragment, and the window can thus get a different layout, and fragments
    can therefore often be used as an alternative to having more activities. An even
    more important the application, however, is a better use of the screen, which
    is particularly interested in larger screens like tablets of similar. Here the
    screen can accommodate more activities, and as this is not possible, you can instead
    view multiple fragments side by side. Finally, fragments are used for tabbed displays,
    list displays and better dialog boxes than what is shown in the previous book.


    You should be aware that fragments are by no means an alternative to activities,
    but fragments can simplify design of an application’s layout and facilitate easier
    reuse of a layout in multiple activities. An activity can consist of multiple
    fragments, but a particular fragment object can only be associated with one activity.
    You can also say that fragments group components of the user interface together
    with the associated logic.


    I want to start with a simple example called *TheBooks* that is an application
    that does not use fragments. The program opens the following window:


    ![](image/Image1882.jpg)


    The goal is to show how the program can be modified, so it uses fragments. It
    should be mentioned immediately that fragments are not the solution to everything,
    and if the application should only do what is the case in the application *TheBooks*,
    it makes no sense to use fragments, and in the current example, the goal is thus
    only to show what a fragment is , but first a little about how the application
    is made. The layout consists solely of *activity_main.xml*:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_10.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_11.jpg)


    The layout is extensive as it defines 20 *RadioButton*’s (where I have only shown
    the first  2), but otherwise there is nothing new in the layout. It basically
    consists of two *ScrollView* elements in a vertically oriented *LinearLayout*,
    and the two *ScrollView* elements share the space in the ration 3:2\. Note that
    each *RadioButton* element defines a *tag* attribute used to determine in the
    code which radio button is clicked.


    With regard to the Java code, a class has been added that defines a book with
    two properties:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_111.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_12.jpg)


    and finally there is added a class that creates 20 *Book* objects:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_121.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_13.jpg)


    Finally, there is the class *MainActivity*, where there is nothing to explain:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_131.jpg)


    So far, it’s a simple application that does not add much new, but I want to divide
    the user interface into two fragments so each fragment contains one of the two
    *ScrollView* elements. I have started with a copy of *TheBooks* project and have
    called the copy for *TheBooks1*. As a first step, I’ve added a file *fragment_books.xml*
    to the *res / layout* directory:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_132.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_14.jpg)


    The content is nothing but a copy of the first *ScrollView* element from the *activity_main.xml*
    – with quite a few changes. It is necessary to add a *namespace* element to the
    *ScrollView* element, and then the value of the *width* attribute is changed from
    0 to *wrap_content* just as the *weight* attribute is removed. The reason is that
    it should not be the fragment that determines how much it should fill, but instead
    the layout that uses the fragment.


    Then, in the same way, I’ve added a layout for the last *ScrollView* element,
    which I’ve called *fragment_book.xml*:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_141.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_15.jpg)


    A fragment consists (usually) in the same way as an activity of a layout in the
    form of a XML file and then a Java class. I have therefore added the following
    class for the first fragment:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_151.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_16.jpg)


    Obviously, it’s not easy to guess it should look like this, but initially you
    can notice that it is a class that inherits *Fragment*. When a fragment is created,
    Android will call multiple callback methods, where the most commonly to override
    is *onCreateView()*. This method returns the *View* hierarchy that represents
    the fragment and which Android associates with the current activity. The method
    *onCreateView()* has three parameters, the first being a reference to a *LayoutInflator*,
    an object that reads and uses a layout resource for the current activity. The
    other parameter is a reference to a *ViewGroup* object in the activity in which
    the fragment is to be linked. The last parameter is mentioned later. In this case,
    the method *onCreateView()* does not do much besides performing the method *inflate()*
    on the *LayoutInflater* object, where the parameter is the name of the resource
    as well as the container where the fragment should be inserted.


    There is a corresponding class called *BookFragment*, where the code is almost
    identical to the above except from referring to another resource.


    Then there is the layout *activity_main.xml*, which of course has to be changed.
    Here, most of the code is moved to the two fragments, and these code blocks must
    be replaced by fragment elements:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_161.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_17.jpg)


    Each fragment element has an *id* attribute (which is not used in this example)
    and a *name* attribute that indicates what it is for a *Fragment* to be instantiated
    and associated. Then the new version of the program is complete and can be translated
    and run. The program works exactly the same as before, and the difference is that
    the user interface is now constructed using two fragments. As mentioned, in this
    case, there are no benefits, but you can notice that the layout is divided into
    smaller building blocks, which could then be used in other similar activities.


    ## 2.1 Rotate the phone


    The above program shows two *ScrollView* components below each other, but rotating
    the phone so that it is held horizontally, you get a poor use of the screen as
    the part that contains the titles captures most of the screen:


    ![](image/Image1889.jpg)


    Here it would be better with the following layout:


    ![](image/Image1898.jpg)


    Of course, the solution is to define a different layout, so make sure it is used
    if the phone is held horizontally. Of course, this can be programmed, but since
    the layout is defined as a resource, it is a built in feature in Android that
    the system on runtime selects a resource depending on how the phone is held.


    This is the first example where fragments can be useful. I’m going to write a
    **new** version of *activity_main.xml*, but it’s a very simple layout resource,
    since all the work has been moved into two other resources, and it’s the same
    resources to be used regardless of whether it’s the one or the second layout.
    I start with a copy of *TheBooks1* project, which I have called *TheBooks2*.'
