    In the example above, the web address is hard-coded, and it is of course not so
    often that it is needed. You must therefore write a simple app, which you can
    call `MiniBrowser`, where you can enter the address instead, and the program should
    subsequently display that web page with a `WebView` (see the window below). There
    may be a problem where as the phone for a newer Android will automatically redirect
    to your phone’s browser. If your `WebView` is called `webView`, you can solve
