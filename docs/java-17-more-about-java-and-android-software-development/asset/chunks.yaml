    The program’s code is as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_138.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_139.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_140.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1411.jpg)


    Initially, there are in addition to a constant defined 5 variables, where the
    first one is to a *LocationManager*, while the next two are references to the
    two buttons. The variable *permission* is used to control whether the top button
    is clicked and the user has been given permission to read the location. The variable
    *waitingGps* is set to true when clicking on the bottom button and tells that
    a location reading has started. The goal is to avoid starting a reading again
    before the first has returned.


    *onCreate()* fills a lot, but it is primarily due to the event handlers of the
    two buttons. The event handler for the top button tests the variable *permission*
    and calls the method *hasPermission()* to see if the user already has the permission.
    The method *hasPermission()* uses


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1412.jpg)


    to test if the application already has *ACCESS_FINE_LOCATION* permission and it
    will have it if it is not the first time the application is used. If the user
    already has the desired permission, a *Toast* is displayed and the variable *permission*
    is set to *true*. Otherwise, the method *requestPermission()* is called. Here
    is first called


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_142.jpg)


    to test for *ACCESS_FINE_LOCATION* and the meaning is that you can do something
    to tell the user what this permission means. In this case, a simple Toast appears
    (which does not make much sense, since you can not reach to read it before the
    next *Toast*). Then the method


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1421.jpg)


    is called which opens a dialog box where the user must actively allow or reject
    the requested permission. The dialog performs a callback to *onRequestPermissionsResult()*,
    where the program with a *Toast* shows the result and the variable *permission*
    is initialized.


    The event handler for the second button reads the GPS coordinates, if the application
    is otherwise allowed. First, it is tested whether a reading is already started,
    and if so, nothing happens other than the method returns. Otherwise, the variable
    *permission* is tested, and if it is *false*, showing a *Toast*. Otherwise, the
    variable *watingGps* is set to *true*, and the object *locationManager* is used
    to send a request for reading the coordinates. This happens in the same way as
    shown in the program *TheLocation* and with the object *gpsListener* that is created
    at the end of the program. When the coordinates are returned, the method *onLocationChanged()*
    is called on the *gpsListener* object, which displays a *Toast* with the coordinates
    and uses the *locationManager* object to remove the listener.


    ## 11.3 An app store


    Once an application has been completed and tested, it should usually be placed
    on an app store like *Google Play* for others to download and apply the application.
    I do not want to show here how, as it depends on the current store, but for Google
    Play, I can mention that you need a *Google Play Developer Acount*, which costs
    a smaller start amount, after which you can upload apps by a defined procedure.
    However, the following is generally and applies in practice to any app that needs
    to be uploaded to a store.'
