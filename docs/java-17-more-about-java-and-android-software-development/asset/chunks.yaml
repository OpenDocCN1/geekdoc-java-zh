    After the 6 constants, three variables are defined, the first representing a receiver
    – has the type `TheReceiver` – so the application can send messages to the service.
    The next represents a thread that every second increments a counter with 1 and
    the last variable is the counter.


    The receiver object is created in `onCreate()` and is an object whose type is
    `TheReceiver`, which is an inner class. You should note that the class inherits
