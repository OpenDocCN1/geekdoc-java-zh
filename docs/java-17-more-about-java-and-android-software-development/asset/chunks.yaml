    \ The method `refreshActivity()` fills a part, but apart from reading preferences,\
    \ there is not much new, and the bottom line is that the lower menu item `Clear\
    \ Preferences` resets all settings to default.\n\nThen there is the first menu\
    \ item, and it opens a new activity defined by the class `ChangePreferences`.\
    \ This activity is derived from the class `PreferenceActivity`:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_94.jpg)\n\
    \nThe class does not fill much, as it is all stored in the base class. When the\
    \ activity is opened, the method `onBuildHeaders()` is performed, which initializes\
    \ a list of `Header` objects by loading a resource called `pref_headers.xml` that\
    \ is a XML document created in a directory `xml`:\n"
  raw: 'Preferences can in principle be used for other than settings, as it is just
    a matter of saving key / value pairs, and the only limitation is that the value
    must be a string or a value of a simple data type. Preferences, however, are more
    than just a way to store data, but it also includes components that are used to
    maintain this data, as illustrated in the following example.


    Preferences can be assigned to an *Activity*, and an *Activity* object has a method
    *getPreferences()*, which returns a *SharedPreference* object. Preferences can
    also be associated with the application, and with the method *getSharedPreferences()*,
    you can get a *SharedPreferences* object identified by a name, so there may be
    several preferences attached to the same application. Finally, there are preferences
    pertaining to the entire device and maintained using a *PreferenceManager* object,
    where you can get a *SharedPreferences* object using a method *getDefaultSharedPreferences()*.
    The method has as a parameter a *Context* object and returns preferences for this
    object. You can use which of the three ways you find the most appropriate, but
    in most cases you apply the last way.


    A *SharedPreferences* object has *get* methods that can be used to determine a
    value, that is, methods like


    *   *getString()*


    *   *getInt()*


    and others, and the methods have two parameters, where the first is the key, while
    the other is a default value. You can (naturally) also create and modify values
    for a *SharedPreference* object, which occurs with similarly *set* methods, where
    the parameters are the key and the value. However, it takes a bit different from
    normal, since a *SharedPreference* object has a method *edit()* that returns an
    *Editor* object, and the methods are assigned to this object. For the changes
    to have effect, finish the changes by the *Editor* object and execute the method
    *commit()* (or the method *apply()*). The *Editor* object also has a method *remove()*
    that can be used to remove a single preference, as well as a method *clear()*
    that removes all preferences.


    If an application needs to maintain settings, you can of course define your own
    activities for the purpose, which can be comprehensive. For that reason, Android
    offers a special activity *PreferenceActivity* and a fragment *PreferenceFragment*
    that can be used to implement settings for an application, and in addition to
    making it easier, the most important is, that settings in this way work the same
    to every application. In the following, I will with an example *ThePreferences*
    show you how to do. If you open the application, you get the following window:


    ![](image/Image2057.jpg)


    which is nothing but a simple Hello World activity, but with a menu with two menu
    items. If you select the top one, you will receive a window that shows the headings
    for the program’s settings:


    ![](image/Image2064.jpg)


    There are two things to set, where the first setting concerns colors and how the
    text should appear (see the window below), while the other option is to turn the
    settings on and off. In the first case, you can choose whether that the text should
    be bold or italic (or both), and you can choose the font size. If you select the
    font size, you get a dialog box with radio buttons, and you can click the button
    for the desired font size. You can also choose to enter the text, and the result
    is a dialog box for text entering. Finally, you can choose text color and background
    color, and in both cases you get a dialog box with radio buttons.


    ![](image/Image2072.jpg)


    In the last setting window, two switch components enable you to set the two settings
    on and off:


    ![](image/Image2079.jpg)


    It does not make much sense in this case beyond as an example of typical settings.
    Below is a window after both switch components are on and after selecting values
    in the first setting window:


    ![](image/Image2087.jpg)


    In particular, note that if you close the program and reopen it, then the settings
    will still apply, leaving them saved somewhere – in the device’s repository for
    preferences.


    The starting point is a usual project called *ThePreferences*. There is added
    more resources, and here is *string.xml* updated with two strings:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_90.jpg)


    which will be used for texts in the menu. To the directory *res*, a folder has
    been added with the name *menu* and here again a XML document called *main.xml*,
    which defines a menu with two menu items:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_901.jpg)


    To the directory *values*, a file *arrays.xml* has been added:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_902.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_91.jpg)


    It defines three arrays as resources. The first array defines values to be used
    as the size of a font. The next two defines colors as the color name and color
    code, respectively, and they are used to select text color and background color.


    The layout *activity_main.xml* consists solely of a *TextView* component and is
    not changed from what Android Studio has created except that I have changed the
    name of the component to *txtLine* and then the layout element has a name so I
    can refer it from Java code. The Java parts fill a part and are as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_911.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_92.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_93.jpg)


    The class has only one variable that refers to the component *txtLine*, which
    is initially initialized in *onCreate()*. You should note that the class also
    overrides *onResume()*, which calls a method *refreshActivity()*. As a result,
    this method is performed every time the window must be initialized, for example,
    if the phone is rotated. Otherwise, there are methods that create the menu (based
    on *main.xml*) and process events from the menu.


    If you select the lower menu *Clear Preferences*, the method *setDefault()* is
    performed. It starts by determining a *SharedPreference* object for this activity,
    and for this object, a reference is made to the object’s *Editor*, which is subsequently
    used to initialize 8 preferences. This means that if that preference does not
    exist, it will be created and otherwise overwritten. Before the method is terminated,
    a *commit()* is executed, so all preferences are saved and finally the method
    *refreshActivity()* is called. This method also determines a *SharedPreferences*
    object with preferences for this activity, and it uses these preferences to update
    the user interface with respect to the background color, which text to display,
    and in that context the font, size, and color of the text. Here you should especially
    note how the two *Switch* settings are used to test whether the other settings
    are to be used or if default values are to be used instead. The method *refreshActivity()*
    fills a part, but apart from reading preferences, there is not much new, and the
    bottom line is that the lower menu item *Clear Preferences* resets all settings
    to default.


    Then there is the first menu item, and it opens a new activity defined by the
    class *ChangePreferences*. This activity is derived from the class *PreferencesActivity*:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_94.jpg)


    The class does not fill much, as it is all stored in the base class. When the
    activity is opened, the method *onBuildHeaders()* is performed, which initializes
    a list of *Header* objects by loading a resource called *pref_headers.xml* that
    is a XML document created in a directory *xml*:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_941.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_95.jpg)'
