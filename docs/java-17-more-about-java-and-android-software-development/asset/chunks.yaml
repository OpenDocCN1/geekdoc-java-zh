    在本节中，我想向你展示一个实现了片段（fragments）之间松耦合的程序版本。起点是上一个程序的拷贝，我将其命名为 `TheBooks4`。当你研究代码时，可能不会立即看到它的优势，因为代码量更多且更复杂，但对于具有多个使用相同片段的任务的大型应用程序来说，这种工作是非常值得的，因为结果是一个更易维护的程序。在接下来的中，我将展示了哪些变化，这些变化仅涉及
    Java 代码。


    当 Java 中的对象需要通信且你想要使用松耦合时，通常的模式是定义一个接口（interface）。同样，我在项目中添加了以下接口：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_26.jpg)


    该接口定义了一个方法，其含义是如果点击了单选按钮（radio button），`BooksFragment` 类必须向 `SelectBookListener`发送通知。方法的参数必须是被点击的单选按钮的索引。`BooksFragment`
    类必须进行修改，结果如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_261.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_27.jpg)


    首先，注意该类现在实现了 `RadioGroup.OnCheckeChangeListener` 接口，然后该类必须实现 `onCheckedChanged()`
    方法。首先，使用 `getActivity()` 方法来确定此片段所属的 activity。如果是一个 `SelectBookListener`（这是 `BooksFragment`
    对象无法知道——也不应该知道的），该方法将确定点击了哪一个单选按钮（注意代码是从 `MainActivity` 复制的）。然后，将当前 activity 的类型强制转换为
    `SelectBookListener` 对象，之后调用 `onSelectedBookChanged()` 方法，并将书籍索引作为参数传入。你还应该注意
    `onCreateView()` 也被修改了，它现在会确定对布局中 `RadioGroup` 组件的引用，并使用它将事件处理器关联到 `RadioGroup`
    组件上。


    `BookFragment` 类也被修改了：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_28.jpg)


    注意该类现在有三个变量，它们都是从 `MainActivity` 拷贝的。也就是说，`Book` 对象列表是该类的一部分，这并不自然，但为了解决引用问题，将其设置为
    `static`，这样 `BookFragment` 类的多个实例就不会创建各自的拷贝。更好的选项是将书籍信息放在 `String` 资源中。在其他上下文中，信息将从数据库检索，此时
    `setBook()` 的参数将是一个键。`setBook()` 更新两个 `TextView` 组件，这两个组件在 `onCreateView()` 中创建了对组件的引用。


    这里是 `MainActivity`，它现在被修改为：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_29.jpg)


    所有变量都被删除了，`onCreate()` 变得简单（因为 Android Studio 已经创建了它）。该类实现了 `SelectBookListener`
    接口，因此需要实现事件处理器 `onSelectedBookChanged()`。当点击单选按钮时，它会从 `BooksFragment` 被调用，参数是被点击的书籍索引。当这种情况发生时，你应该调用
    `BookFragment` 类中的 `setBook()` 方法。你不能直接从 activity 引用 `Fragment`，但你可以通过 `FragmentManager`
    对象来实现，任何 activity 都有一个返回此类对象的方法。有了这个对象，你就可以确定片段的引用并成功地调用 `setBook()`。


    在此之后，这些已经已经实现——经过了一段相当漫长的路——但结果是一个类之间耦合更弱的解决方案。


    ## 练习 1:TheBirds


    你必须编写一个可以称为 `TheBirds` 的应用程序。书的源目录包含一个有 7 张图片的子目录。当程序打开时，它必须显示这些图片的概览以及第一张图片。当你点击图片的名称时，该图片将出现在窗口中。界面必须由两个片段组成，一个显示列表，另一个显示图片。此外，程序必须支持手机旋转。你不需要考虑不同的屏幕尺寸。


    ![](img/Image1945.jpg)![](img/Image1953.jpg)


    ## 2.4 Two activities


    上面的应用程序是一个所谓的列表/详情应用程序，并根据手机握持方式或设备是否为平板电脑显示两种不同的布局。这是一个显示多个对象（这里是书名）概览的应用程序，点击书籍将向你显示详情。如果手机竖着握，列表显示在顶部；如果手机横着握或在大屏幕情况下，列表显示在左侧，详情显示在右侧。此类应用程序被广泛使用，但由于空间原因，当手机竖着时，整个屏幕都用于列表通常很有趣，而当你触摸一个对象查看详情时，它们会在另一个
    activity 中出现。在本节中，我想展示让上述应用程序运行所需的内容。


    我从 `TheBooks4` 的拷贝开始，我将其命名为 `TheBooks5`。首先，我添加了一个新的 activity，命名为 `BookActivity`。布局如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_31.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_32.jpg)


    除了按钮外，还需要从 `activity_main` 中移除片段。该元素也必须从 `activity_main.xml` 中移除：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_32.jpg)


    结果是，在手机竖持的情况下，`MainActivity` 将整个屏幕用于列表。如果你的手机横握或是平板电脑，程序像以前一样工作并使用 `activity_wide.xml`。下面显示新
    activity 类：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_33.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_34.jpg)


    在 `onCreate()` 中，程序测试是否传递了参数（如果有，则是书籍索引），如果是，则使用 `FragmentManager` 查找 `Fragment`
    对象的引用并调用 `setBook()` 方法。


    这里是 `MainActivity` 类，需要更新事件处理器 `onSelectedBookChanged()`：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_34.jpg)


    与一样，程序尝试确定 `BookFragment` 的引用。如果不可能（或者该片段不可见），则以书籍索引作为参数打开新的 activity，否则除了片段更新外不会发生其他任何事情。


    当你测试程序时，请注意，如果是平板电脑或你横握手机，它像以前一样工作。


    ## 2.5 The fragment life cycle


    在 Java 16（第 4.4 节）中，我提到了 activity 的生命周期以及与状态切换相结合的回调方法。片段也有类似的内容，由于片段与 activity
    相关，因此当然有密切的联系。这里值得注意的是，经常会出现 activity 被创建、关闭并重新创建的情况，手机旋转就是一个很好的例子。


