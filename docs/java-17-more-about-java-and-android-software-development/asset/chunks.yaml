    The method `askReadPermission()` is called from the event handler for the middle
    button, and it works in principle in exactly the same way as `askWritePermission()`,
    but with the difference that it instead calls the method `readFile()`. In this
    method, there is also not much to explain, and in particular, note that the name
    of the file is determined in the same way as above.


    The last event handler calls the method `showStorage()`. The method shown some
    information about the file system, and android has several methods for that purpose.
    I have encapsulated some of these methods as static methods in a helper class
    `ExternalTools`, and the goal is that the class can be expanded continuously as
    needed. You are encouraged to study the class, which is quite simple.


    # 8 The web


    A mobile phone is not much more than a small computer, but with special features
    like phone calling, sending SMS, built-in GPS, camera, and more specifically,
    you can also go to the Internet. Therefore, Android also has special components
    for that purpose, and the following is an introduction. This is primarily about:


    1. `WebView`, which is a component that can display HTML

    2. `HttpURLConnection`, which is a class to manipulate web services

    3. `DownloadManager`, which is a class to download data


    As a simple start, I will show a program that uses the component `WebView` to
    display a web page. The project is called `TheWeb1`, and if you executes the program,
    it opens the following window:


    ![](image/Image2102.jpg)


    The layout is as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_106.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_107.jpg)


    and as you can see, it’s only a matter of having a `WebView` component. Then there
    is `MainActivity`:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1071.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_108.jpg)


    where there is nothing to explain, it’s almost impossible to write it easier.
    There is, however, one more detail as a permission must be inserted in the manifest:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1081.jpg)


