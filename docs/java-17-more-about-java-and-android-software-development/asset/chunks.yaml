- fmt: "\nI want to start this book with fragments, which was actually something of\
    \ what I lacked in the last example of the previous book. Just like an activity,\
    \ a `fragment` is a layout, which is an XML document, that defines the layout\
    \ and content of a window (part of a window = a `fragment`) and then a Java class.\
    \ A window (an activity) can thus consist of several fragments, each fragment\
    \ defining a part of the window. The use is that at run time you can replace a\
    \ fragment with another fragment, and the window can thus get a different layout,\
    \ and fragments can therefore often be used as an alternative to having more activities.\
    \ An even more important the application, however, is a better use of the screen,\
    \ which is particularly interested in larger screens like tablets of similar.\
    \ Here the screen can accommodate more activities, and as this is not possible,\
    \ you can instead view multiple fragments side by side. Finally, fragments are\
    \ used for tabbed displays, list displays and better dialog boxes than what is\
    \ shown in the previous book.\n\nYou should be aware that fragments are by no\
    \ means an alternative to activities, but fragments can simplify design of an\
    \ application’s layout and facilitate easier reuse of a layout in multiple activities.\
    \ An activity can consist of multiple fragments, but a particular fragment object\
    \ can only be associated with one activity. You can also say that fragments group\
    \ components of the user interface together with the associated logic.\n\nI want\
    \ to start with a simple example called `TheBooks` that is an application that\
    \ does not use fragments. The program opens the following window:\n\n![](image/Image1882.jpg)\n\
    \nThe goal is to show how the program can be modified, so it uses fragments. It\
    \ should be mentioned immediately that fragments are not the solution to everything,\
    \ and if the application should only do what is the case in the application `TheBooks`,\
    \ it makes no sense to use fragments, and in the current example, the goal is\
    \ thus only to show what a fragment is , but first a little about how the application\
    \ is made. The layout consists solely of `activity_main.xml`:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_10.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_11.jpg)\n\
    \nThe layout is extensive as it defines 20 `RadioButton`s (where I have only shown\
    \ the first 2), but otherwise there is nothing new in the layout. It basically\
    \ consists of two `ScrollView` elements in a vertically oriented `LinearLayout`,\
    \ and the two `ScrollView` elements share the space in the ration 3:2. Note that\
    \ each `RadioButton` element defines a `tag` attribute used to determine in the\
    \ code which radio button is clicked.\n\nWith regard to the Java code, a class\
    \ has been added that defines a book with two properties:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_111.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_12.jpg)\n\
    \nand finally there is added a class that creates 20 `Book` objects:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_121.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_13.jpg)\n\
    \nFinally, there is the class `MainActivity`, where there is nothing to explain:\n\
    \n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_131.jpg)\n\nSo far,\
    \ it’s a simple application that does not add much new, but I want to divide the\
    \ user interface into two fragments so each fragment contains one of the two `ScrollView`\
    \ elements. I have started with a copy of `TheBooks` project and have called the\
    \ copy for `TheBooks1`. As a first step, I’ve added a file `fragment_books.xml`\
    \ to the `res / layout` directory:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_132.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_14.jpg)\n\
    \nThe content is nothing but a copy of the first `ScrollView` element from the\
    \ `activity_main.xml` – with quite a few changes. It is necessary to add a `namespace`\
    \ element to the `ScrollView` element, and then the value of the `width` attribute\
    \ is changed from 0 to `wrap_content` just as the `weight` attribute is removed.\
    \ The reason is that it should not be the fragment that determines how much it\
    \ should fill, but instead the layout that uses the fragment.\n\nThen, in the\
    \ same way, I’ve added a layout for the last `ScrollView` element, which I’ve\
    \ called `fragment_book.xml`:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_141.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_15.jpg)\n\
