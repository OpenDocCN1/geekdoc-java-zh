    因此我修改了两个地方：为 `LinearLayout` 元素添加了 `id`（以便在代码中引用），并删除了 `fragment` 元素，布局也变得相当简单。除此之外，更改主要涉及
    `MainActivity` 类，但也有必要修改 `BookFragment` 类，其中添加了两个常量，就像更新 `onCreateView()` 一样：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_54.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_55.jpg)


    目前还不完全清楚这些更改能带来什么收益，但目标是能够向 `onCreateView()` 传递一个参数，该参数必须是用户从列表中选择的书籍索引。第一个常量仅用于标识参数的名称，而另一个是默认值，表示未传递参数。参数或参数被封装在
    `Bundle` 对象中，该对象在 `onCreateView()` 中通过 `getArguments()` 确定，如果存在参数，则尝试将值确定为 `int`。如果成功且不是默认值，则调用
    `setBook()` 并该值作为参数。


    另一方面，`MainActivity` 中的更改更为广泛：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_551.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_56.jpg)


    首先，引入了变量 `isDynamic`，用于控制是否使用碎片的动态更新，这取决于设备是纵向还是横向的。该变量在 `onCreate()` 中通过 `FragmentManager`
    初始化，用于测试 `BookFragment` 碎片是否存在，从而决定使用 `activity_main.xml` 还是 `activity_main_wide.xml`
    布局。如果 `isDynamic` 为 `true`，则必须动态插入碎片。然而，这要求你使用 `transaction`。`FragmentManager`
    可以启动一个作为 `FragmentTransaction` 的事务，你可以对其添加关于碎片的操作。在这种情况下，只添加了一个操作，即 `add()` 操作，它向
    activity 中添加了 `BooksFragment`。这里你应该注意，XML 文档中的 `LinearLayout` 元素现在有一个 `id`。还要注意
    `add()` 方法的最后一个参数，它简单意味着碎片获得了一个名称，以便以后可以引用。结果是，当 `FragmentTransaction` 对象执行 `commit()`
    时，添加到事务中的操作将作为一个单一操作执行。


    此外，事件处理器 `onSelectedBookChanged()` 也发生了更改。如果变量 `isDynamic` 为 `true`（且手机手机竖持），则必须将带有列表的碎片替换为显示详情的碎片。因此，再次创建了一个事务。此外，`BookFragment`
    对象的创建和所选书籍的 `id` 作为参数关联到 `Bundle` 对象中。请注意，这里你使用了在 `BookFragment` 类中定义为常量的名称。在创建并参数初始化
    `BookFragment` 对象后，通过向事务添加 `replace()` 来替换列表碎片。现在，返回键可能仍然有效，因此你必须执行 `addToBackStack()`
    操作，以便当前窗口（当前事务）被压入回栈中。


    之后，一切都应该正常工作了——至少在理论上如此，但如果手机是竖持的，这并不适用于返回键。因此，最后一个方法只在某种程度上解决了问题。寻找更好的解决方案可能是件不错的工作。


    程序测试后，我终于可以删除 `BookActivity.java` 和 `activity_book.xml`，因为这些文件不再被使用。


    # 3 手机


    编写 Android 应用程序时，与通常的 PC 应用程序有些不同，仅仅是因为设备通常提供其他功能，如果设备是手机，你就可以打电话。在本章中，我将展示如何在软件中实现这一点，并编写用户能够拨打电话的应用程序。对于程序员来说，有两种选择：一种情况下是由手机用户拨打电话，而另一种情况来说是编写一个程序，当别人拨打当前电话时可以激活该程序。最后一种并不简单。首先，它需要某些接收通话通知的服务，其中存在一些安全问题，但这里不讨论这些问题。第一种问题（即由应用程序用户拨打电话）非常简单，接下来的示例展示了如何实现。如果你打开
    `ThePhone` 应用程序，你会看到以下窗口：


    ![](img/Image2007.jpg)


    这里有一个输入字段，你可以输入电话号码，并有两个按钮可以用来拨打你输入的号码。如果你点击 `DIAL` 按钮，你会得到普通的窗口，就像你平时拨打电话时一样，你输入的号码已被插入，你仍需要像常一样按下
    `Call` 按钮打电话。如果你点击 `CALL`，手机会在没有用户干预的情况下立即执行通话——在允许的情况下。你必须在 `AndroidManifest.xml`
    中分配权限，但对于最新的手机这是不够的，手机会显示对话框，用户必须接受手机正在通话。在这种情况下，清单更新如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_59.jpg)


    `uses-permission` 元素允许程序打电话而无需用户点击 `Call` 按钮。`uses-feature` 元素用于告知应用程序只能支持通话的设备上使用（运行）。尽管大多数
    Android 设备都是手机，但非手机 Android 设备的数量正在增加，在这些设备上打电话是没有意义的。请注意，如果上述步骤过于严格，你可以在软件中测试设备是否可以打电话：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_591.jpg)


    我不想显示当前应用程序的布局，因为它没有新内容，但 Java 代码如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_592.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_60.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_61.jpg)


