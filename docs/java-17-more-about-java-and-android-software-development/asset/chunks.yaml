    `getCallState()` 方法，用于测试是否正在通话。这并不是绝对必要的，但建议这样做，否则你可能会中断正在进行的对话。如果没有，则确定输入的电话号码，并注意它带有前缀
    `tel:`，这表示这是一个电话号码。接下来，使用 `startActivity()` 和 `Intent` 对象执行通话。`Intent` 对象的第一个参数表示必须以通常方式拨打电话，即用户获得一个输入号码的对话框，而其他参数是号码。

