    Before you can publish an app to an app store so it can be downloaded and installed
    on an Android device, it must be signed with a certificate. Such a certificate
    must be purchased from a PKI (such as `Verisign` or `Thawte`), and this certificate
    allows you to sign the project’s `.apk` file (which contains everything the app
    consists of). A certificate is stored in a `keystore`, and for that purpose you
    can use a tool called `keytool` that comes with `JDK`. If you’ve developed an
    app and tested it on your phone, you’ve actually already used a certificate and
    a keystore, as Android Studio creates a keystore (`Debug Keystore`) and signs
    your apps with a so-called self-signed certificate. Such a certificate is, of
    course, a certificate that no one trusts and therefore it is necessary to purchase
    a certificate from an authority (`Verisign` or `Thawte`), which others trust.


    Once you have the certificate, you can sign your apps (that is your `.apk` files),
    and for that you can use another tool called `jarsigner`. Then your app is ready
    to be uploaded to an app store such as Google Play.


    # 12 A final example: The WineApp


    The final example of the book `Java 6` is a program for managing a private wine
    cellar. The program is in principle excellent in the light of its functions and
    what it can, but for practical use, there is a big problem, namely that it is
    a PC program which means that you have to sit at the computer for access (purchase)
    of the wines, and correspondingly every time you use a bottle of wine, and especially
    the last is a problem. You will not get it done. You postpone it for a time when
    you are at the computer. It is therefore natural to think of a solution like an
    app for a mobile phone, which would mean that you always have the program “on
    you”. Thus, the chance of using the program would be far greater, and the following
    is about implementing a version of the program `WineApp` as an app for a mobile
    phone. You can therefore think of the task of migrating a program from one platform
    to another.


    The program should basically be the same and work in the same way as the previous
    version, but the program must use `SQLite` instead of `MySQL`. In addition, it
    should be considered whether there are functions that need be changed and as the
    last especially with a view on how to simplify the application’s use. In addition,
    you should use the phone’s camera so that you can save a picture of a bottle.


    One of the challenges of migrating the application to a phone is exactly the small
    screen. The application’s user interface must be customized for a phone and a
    tablet, respectively, but since the user dialog largely consists of data entry,
    and since a phone does not have an appropriate user interface (due to the virtual
    keyboard), it has been decided that the program should not support landscape mode.


    ## 12.1 Development plan


    The development of the application is scheduled to include the following iterations,
    where the result of each iteration is an extension of the result of the previous
    iteration.


    | `MainActivity`. What should be on the start activity, and especially how to
    navigate between the application’s features. | 2 |

    | Program architecture and design and implementation of the database. | 2 |

    | Maintenance of wine properties: Producers. | 1 |

    | Maintenance of wine properties: Suppliers. | 1 |

    | Maintenance of wine properties: Countries. | 1 |

    | Maintenance of wine properties: Districts. | 1 |

    | Maintenance of wine properties: Classifications. | 1 |

    | Maintenance of wine properties: Grapes. | 1 |

    | Maintenance of wine properties: Wine types. | 1 |

    | Maintenance of wine properties: Categories. | 1 |

    | Maintenance of wine properties: Bottles / packing. | 1 |

    | Create wine. Also includes taking a picture. | 4 |

    | Maintenance of wines. Also includes maintenance of the picture. | 3 |

    | Purchase wines. | 3 |

    | Consumption of wines. | 3 |

    | Search wines. | 4 |

    | Watch for wines ready to drink. | 3 |

    | Refactoring and test. | 4 |

    | Deployment | 2 |


    The numbers in the right column indicate the complexity of the iteration. They
    do not specify exact time estimates, but express the extent and where to expect
    special challenges. Assuming `1` = a half working day, it means that the expected
    workload is about 20 working days. Experience shows that there is always something
    that takes longer and it is always recommended to extend the estimated time by
    for example 25%, and if so I will estimate the time to approximate 25 working
    days, and if the program is to be written by one developer, it will say about
    1 month.


    Finally, new features may come in during the course of development and if so,
    of course, it is necessary to extend the estimate.


    Looking at the above time estimates, they are not very precise and one can expect
    that some of the estimated tasks may take longer than expected, but there may
    also be others where you spend less than the estimated time, among other things
    because several of the iterations are similar and Therefore, to some extent, will
    be repetitions of each other. If it turns out, you save time and get ahead of
    the schedule, it is in principle good, but you should be careful about adjusting
    your expected time consuming early in the project, as there is a high risk that
    other iterations may be underestimated and if other iterations have resulted in
    a time reserve is good, as you later in the process has something to do with.


    Time estimation is one of the hardest dictations in software development, and
    software developers tend to underestimate (or do so for political / business reasons).
    The method is to break down a task in many small sub tasks, each of which is so
    small and has such a complexity that you can assess how long the task takes. Even
    if you get there, the timing is associated with great uncertainty, as practice
    shows that there are always tasks that for some reason take longer than expected.
    The reasons are many and range from simple tasks that suddenly take longer than
    expected to that during the development process new demands arise. Particular
    attention should be paid to the latter, where new demands must be estimated for
    the time consumed and included in the project plan.


