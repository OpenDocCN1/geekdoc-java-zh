    正如与一组回调方法相关的 Activity 一样，Fragment（片段）也是如此，而且它们在这些方法执行的时机上显然存在联系的。当一个 fragment
    初始化时，会执行以下回调方法，其中左侧的方法与 activity 相关，而右侧的方法与 fragment 相关：


    ![](img/Image1960.jpg)


    最重要的方法是 `onCreateView()`，如之前的示例所示。当一个 fragment 与一个 activity 关联时，会执行 `onAttach()`
    方法，随后 fragment 就能知道该 activity，你可以使用 `getActivity()` 方法。然后 fragment 会向 activity
    发送通知，之后会顺序执行 `onCreate()` 和 `onCreateView()`，在后者中创建布局。这两个方法是最重要的，而且对于很多 fragment
    来说，它们是唯一被重写的回调方法。区别在于，如果初始化操作包含耗费时间的任务（例如连接到数据源、复杂计算和资源分配），则应该在 `onCreate()` 中执行，而其余部分以及布局的主要初始化应该应该在
    `onCreateView()` 中完成。原因在于，通常只有 fragment 的视图层级结构会被销毁，因此没有必要在手机每次发生某些变化时都执行耗时的初始化。


    ### 四个方法


    1. `onAttach()`

    2. `onAttachFragment()`

    3. `onCreate()`

    4. `onCreateView()`


    它们总是一起执行的，如果一个 activity 关联了多个 fragment，这一点非常。当所有 fragment 都执行了这个方法序列后，剩余的回调方法可以单独执行。在这里，`onActivityCreated()`
    通知 fragment activity 已创建，而 `onStart()` 和 `onResume()` 对 fragment 的功能与 activity
    基本相同。


    当 fragment 被隐藏或关闭时，会发生类似的情况：


    ![](img/Image1970.jpg)


    基本上与 activity 是一样的，但在 `onStop()` 之后，每个 fragment 会执行三个方法：


    1. `onDestroyView()`

    2. `onDestroy()`

    3. `onDetach()`


    它们是一起执行的。随后 fragment 不再与 activity 关联，你也无法再执行 `getActivity()`。


    将创建和关闭 fragment 的方式分开有几个原因，其中之一是：如果 fragment 被隐藏，只会执行 `onDestroyView()`，而一旦 fragment
    再次可见，则只会执行 `onCreateView()`。


    你还应该注意 `onSaveInstanceState()` 方法，它的功能与 activity 相同，用于在 fragment 关闭之前持久化其状态。


