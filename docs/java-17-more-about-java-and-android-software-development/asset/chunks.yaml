    \ the text, and the result is a dialog box for text entering. Finally, you can\
    \ choose text color and background color, and in both cases you get a dialog box\
    \ with radio buttons.\n\n![](image/Image2072.jpg)\n\nIn the last setting window,\
    \ two switch components enable you to set the two settings on and off:\n\n![](image/Image2079.jpg)\n\
    \nIt does not make much sense in this case beyond as an example of typical settings.\
    \ Below is a window after both switch components are on and after selecting values\
    \ in the first setting window:\n\n![](image/Image2087.jpg)\n\nIn particular, note\
    \ that if you close the program and reopen it, then the settings will still apply,\
    \ leaving them saved somewhere – in the device’s repository for preferences.\n\
    \nThe starting point is a usual project called `ThePreferences`. There is added\
    \ more resources, and here is `string.xml` updated with two strings:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_90.jpg)\n\
    \nwhich will be used for texts in the menu. To the directory `res`, a folder has\
    \ been added with the name `menu` and here again a XML document called `main.xml`,\
    \ which defines a menu with two menu items:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_901.jpg)\n\
    \nTo the directory `values`, a file `arrays.xml` has been added:\n\n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_902.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_91.jpg)\n\
    \nIt defines three arrays as resources. The first array defines values to be used\
    \ as the size of a font. The next two defines colors as the color name and color\
    \ code, respectively, and they are used to select text color and background color.\n\
    \nThe layout `activity_main.xml` consists solely of a `TextView` component and\
    \ is not changed from what Android Studio has created except that I have changed\
    \ the name of the component to `txtLine` and then the layout element has a name\
    \ so I can refer it from Java code. The Java parts fill a part and are as follows:\n\
    \n![](image/Java_17_–_More_about_Java_and_Android_28-8-18_911.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_92.jpg)\n\
    \n```\n// Java code would be here based on the context, \n// but the text ends\
