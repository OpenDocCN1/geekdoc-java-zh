    原则上，Preferences（偏好）可以用于设置以外的内容，因为它仅仅是存储键/值对，唯一的限制是值必须是字符串或简单数据类型的值。然而，Preferences
    不仅仅是存储数据的方式，它还包含了维护这些数据的组件，如下例所示。


    Preferences 可以被分配给一个 `Activity`，而 `Activity` 对象有一个方法 `getPreferences()`，该方法返回一个
    `SharedPreference` 对象。Preferences 也可以与应用程序关联，通过 `getSharedPreferences()` 方法，你可以获取一个由名称标识的
    `SharedPreferences` 对象，因此同一个应用程序可能关联了多个偏好。最后，还有属于整个设备的偏好，它们使用 `PreferenceManager`
    对象进行维护，其中你可以使用 `getDefaultSharedPreferences()` 方法获取一个 `SharedPreferences` 对象。该方法接受一个
    `Context` 对象作为参数，并返回该对象的偏好。你可以从这三种方法中选择你认为最合适的，但在大多数情况下，你会使用最后一种方法。


    `SharedPreferences` 对象具有 `get` 方法，可以用于确定值，例如如下方法：


    *   `getString()`

    *   `getInt()`


    以及其他方法，这些方法有两个参数，第一个是键，另一个是默认值。你（自然地）也可以创建并修改 `SharedPreference` 标识的值，这通过类似的 `set`
    方法实现，其参数是键和值。然而，这与普通操作有所不同，因为 `SharedPreference` 对象有一个 `edit()` 方法返回一个 `Editor`
    对象，而方法被分配给这个对象。要使更改生效，通过 `Editor` 对象完成更改并执行 `commit()` 方法（或 `apply()` 方法）。`Editor`
    对象还有一个 `remove()` 方法，可以删除单个偏好，以及一个 `clear()` 方法，可以删除所有偏好。


    如果应用程序需要维护设置，你当然可以为此目的定义你自己的活动，而且这些活动可以是全面的。因此，Android 了一个了一个特殊的活动 `PreferenceActivity`
    和一个片段 `PreferenceFragment`，可以用于实现应用程序的设置。除了让变得更容易之外，最重要的是，通过这种方式进行的设置在每个应用程序中工作都是相同的。在接下来，我将通过示例
