    为了让这一切正常工作，必须在清单（manifest）中添加一个元素，它定义了服务，然后可以通过模拟器或物理设备对应用进行测试：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1231.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_124.jpg)


    ## 9.1 一个 IntentService


    在上面的示例中，服务使用定义为内部类的线程来执行工作。相反，你可以将服务定义为 `IntentService`（可以参考之前的书籍），它会自动将工作分发给线程。项目
    `TheServices2` 与上面的示例相同，但服务变成了 `IntentService`。该服务的工作原理基本上相同，但它不再是启动服务并一直运行到停止，而是在启动后执行一个任务，并在运行若干秒钟（该值为一个参数）后停止。服务的用户界面基本相同，但少了一个按钮。服务的代码如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1241.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_125.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_126.jpg)


    现在类继承了 `IntentService`，其他主要区别是 `TheThread` 类已被移除，取而代之的是 `onHandleIntent()` 方法。这里你应该注意，它有一个
    `Intent` 参数，在这种情况下，该参数用于传递一个 `int` 类型参数，指示循环应该迭代的次数，以及该方法应该执行的工作量。对于每次迭代，该方法的执行方式与之前的示例相同，并将计数器的值广播给客户端（在本例中为
    `MainActivity`）。


    `MainActivity` 与上一个示例几乎相同（稍微简单一点），我不想在这里显示代码。


    ## 9.2 一个永不结束的服务


    作为关于服务的最后一部分内容，我将展示一个由两个程序组成的示例：


    1.  一个启动服务后停止的程序。服务仍在运行并生成质数，对于每个质数，服务都会广播该质数。

    2.  一个注册为质数监听器的程序，并在屏幕上显示每个新质数。


    原则上讲，这非常简单，但有一个简单的挑战，即在启动活动完成后保持服务存活。该服务是项目 `TheService3` 的一部分，有三个 Java 文件需要注意。


    第一个是 `PrimesRestarter`，它是一个简单的接收器类：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_127.jpg)


    如你所见，`onReceive()` 中发生的唯一仅仅是启动了一个服务。目前，很难看出这个类在执行什么，但它应该解决这样一个问题：如果应用程序启动了服务，随后应用程序关闭了，那么服务就会被终止。


    服务类名为 `PrimesService`：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1271.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_128.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_129.jpg)


    `onStartCommand()` 创建并启动了一个线程。线程的类型是一个内部类，由一个循环组成，只要变量 `running` 为 `true`，循环就会一直运行（直到执行
    `terminate()` 方法为止）。对于每次迭代，都会确定下一个质数并对该数字进行广播。其理念是，如果允许服务运行很长时间，确定下一个质数将花费时间，从客户端来看，你会发现每个数字显示之间存在时间间隔。


    然后是 `onDestroy()`，它会发送一个值为 `dk.torus.data.RestartPrimes` 的广播。这意味着上述类 `PrimesRestarter`
    中的 `onReceive()` 方法会被执行并重启服务。这确保了在启动活动关闭后，服务仍然在运行。


    然后是 `MainActivity`，这次它非常平易易人：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_130.jpg)


    `onCreate()` 启动了服务，随后活动会自动关闭。你应该注意，这里没有 `content view` ——应用程序没有用户界面。项目有一个 `activity_main.xml`，可以很容易删除。它是由
    Android Studio 自动创建的，可能对测试很有用。


    然后，创建并启动服务的应用程序几乎已经完成。唯一缺失的是将所有内容整合在一起的清单：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_130.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_131.jpg)


    这里是 `PrimesService` 类中最重要的 `onDestroy()` 接收器。最后是客户端。布局是由 Android Studio 自动生成的。`MainActivity`
    是：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_132.jpg)


    ## 10 通知


    作为关于手机应用开发的最后一部分，我想提到一下通知（Notifications），即程序希望让用户意识到某个事件的发生。这通过引起用户的注意来实现，例如通过播放声音或让手机振动，通常还结合在通知栏中显示图标。`TheNotifications`
    程序展示了如何操作，实际上非常简单，因为 Android 有提供所需的 `NotificationManager` 类。程序打开如下窗口：


    ![](img/Image250.jpg)


    顶部按钮发送通知，另一个移除通知（这样图标从应用程序通知栏中消失）。布局非常简单，仅包含两个按钮的 `RelativeLayout`。除了布局外，程序只包含
    `MainActivity` 类：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_133.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_134.jpg,
    135.jpg)

