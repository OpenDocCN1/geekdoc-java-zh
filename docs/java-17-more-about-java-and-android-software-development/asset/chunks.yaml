    `Google Play Services` 的要求以及它是什么，因为这在实践中可能很重要。


    从创建一个名为 `TheLocation` 的新项目开始。在模拟器中翻译并测试项目，确保你有一个正在运行的 `Hello World` 项目。在 `activity_main.xml`
