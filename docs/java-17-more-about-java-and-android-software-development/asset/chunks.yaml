- fmt: "\nPreferences can in principle be used for other than settings, as it is just\
    \ a matter of saving key / value pairs, and the only limitation is that the value\
    \ must be a string or a value of a simple data type. Preferences, however, are\
    \ more than just a way to store data, but it also includes components that are\
    \ used to maintain this data, as illustrated in the following example.\n\nPreferences\
    \ can be assigned to an `Activity`, and an `Activity` object has a method `getPreferences()`,\
    \ which returns a `SharedPreference` object. Preferences can also be associated\
    \ with the application, and with the method `getSharedPreferences()`, you can\
    \ get a `SharedPreferences` object identified by a name, so there may be several\
    \ preferences attached to the same application. Finally, there are preferences\
    \ pertaining to the entire device and maintained using a `PreferenceManager` object,\
    \ where you can get a `SharedPreferences` object using a method `getDefaultSharedPreferences()`.\
    \ The method has as a parameter a `Context` object and returns preferences for\
    \ this object. You can use which of the three ways you find the most appropriate,\
    \ but in most cases you apply the last way.\n\nA `SharedPreferences` object has\
    \ `get` methods that can be used to determine a value, that is, methods like:\n\
    \n*   `getString()`\n*   `getInt()`\n\nand others, and the methods have two parameters,\
    \ where the first is the key, while the other is a default value. You can (naturally)\
    \ also create and modify values for a `SharedPreference` object, which occurs\
    \ with similarly `set` methods, where the parameters are the key and the value.\
    \ However, it takes a bit different from normal, since a `SharedPreference` object\
    \ has a method `edit()` that returns an `Editor` object, and the methods are assigned\
    \ to this object. For the changes to have effect, finish the changes by the `Editor`\
    \ object and execute the method `commit()` (or the method `apply()`). The `Editor`\
    \ object also has a method `remove()` that can be used to remove a single preference,\
    \ as well as a method `clear()` that removes all preferences.\n\nIf an application\
    \ needs to maintain settings, you can of course define your own activities for\
    \ the purpose, which can be comprehensive. For that reason, Android offers a special\
    \ activity `PreferenceActivity` and a fragment `PreferenceFragment` that can be\
    \ used to implement settings for an application, and in addition to making it\
    \ easier, the most important is, that settings in this way work the same to every\
    \ application. In the following, I will with an example `ThePreferences` show\
    \ you how to do. If you open the application, you get the following window:\n\n\
    ![](image/Image2057.jpg)\n\nwhich is nothing but a simple Hello World activity,\
    \ but with a menu with two menu items. If you select the top one, you will receive\
    \ a window that shows the headings for the program’s settings:\n\n![](image/Image2064.jpg)\n\
    \nThere are two things to set, where the first setting concerns colors and how\
