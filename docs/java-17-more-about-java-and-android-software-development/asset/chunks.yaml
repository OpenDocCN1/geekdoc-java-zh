    ## 9.1 An IntentService


    In the above example, the service performs its work using a thread defined as
    an inner class. Instead, you can define the service as an `IntentService` (see
    possibly the previous book) that automatically handouts the work to a thread.
    The project `TheServices2` is the same example as the above, but the service is
    instead an `IntentService`. The service basically works in the same way, but instead
    of starting the service and running it until it stops, the service is started
    after which it performs a job, but stops after running a number of seconds where
    the value is a parameter. The service’s user interface is basically the same,
    but there is a button less. The code for the service is as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1241.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_125.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_126.jpg)


    The class now inherits `IntentService`, and otherwise the main difference is that
    the class `TheThread` has now been removed and instead replaced by the method
    `onHandleIntent()`. Here you should note that it has an `Intent` parameter, that
    in this case is used to transfer a parameter as an `int`, which indicates how
    many times the loop should iterate and thus the amount of work that the method
    should perform. For each iteration, the method performs in the same way as in
    the previous example and broadcast the counter’s value, to a client (and in this
    case, `MainActivity`).


    `MainActivity` is almost identical to the previous example (a bit simpler) and
    I do not want to display the code here.


    ## 9.2 A never ending service


    As the last thing about services, I will show an example consisting of two programs:


    1.  A program, that start a service end then stops. The service is still running
    and generates the primes, and for every prime the service broadcast the prime.

    2.  A program, that is registered as listener for the primes, and shows every
    new prime on the screen.


    In principle, it is quite simple, but there is a simple challenge, which consists
    in keeping the service alive after the starting activity is completed. The service
    is part of the project `TheService3`, and there are three Java files that you
    should notice.


    The first is `PrimesRestarter` and it is a quite simple receiver class:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_127.jpg)


    As you can see, nothing happens in `onReceive()` than a service is started. For
    the time being, it’s not easy to see what’s going on with this class, but it should
    solve the problem that if an application starts a service, and afterwards the
    application closes, then it terminates the service.


    The service class is called `PrimesService`:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1271.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_128.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_129.jpg)


    `onStartCommand()` creates a thread and starts it. The thread’s type is an inner
    class and consisting of a loop that runs for as long as the variable `running`
    is `true` (until the method `terminate()` is performed). For each iteration, the
    next prime is determined and a broadcast of that number is performed. The idea
    is, of course, if the service is allowed to run for a long time, it starts taking
    time to determine the next prime numbers, and from a client you will find that
    there is time between each number is displayed.


    Then there is `onDestroy()` and it sends a broadcast with the value `dk.torus.data.RestartPrimes`.
    This means that the method `onReceive()` in the above class `PrimesRestarter`
    is performed and restarts the service. That is what ensures. that the service
    is still running after the starting activity is closed.


    Then there is `MainActivity`, which this time is trivial:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_130.jpg)


    `onCreate()` starts the service, after which the activity closes itself. You should
    note that there is no content view – the application does not have a user interface.
    The project has an `activity_main.xml` and it could easily be deleted. It is automatically
    created by Android Studio and may be useful for testing.


    Then the application that creates and starts the service is almost complete. All
    that is missing is the manifest that will tie it all together:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_130.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_131.jpg)


    Here is the most important the receiver `onDestroy()` in the class `PrimesService`.


    Finally, there is the client who is normal app. The layout is just created by
    Android Studio. `MainActivity` is:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_132.jpg)


    ## 10 Notifications


    As the last thing about developing applications for mobile phones, I want to mention
    notifications where a program wishes to make the user aware that an event has
    occurred. This happens by invoking the user’s attention and can happen, for example,
    by playing a sound or letting the phone vibrate, and often combining it by displaying
    an icon in the notification bar. The program `TheNotifications` shows how to do
    that and it’s actually quite simple as Android has a class `NotificationManager`
    that providing everything needed. The program opens the following window:


    ![](image/Image250.jpg)


    The top button sends a notification while the other bottom removes the notification
    (so the icon disappears from the application’s notification bar). The layout is
    quite simple and consists only of a `RelativeLayout` with two buttons. In addition
    to the layout, the program only consists of the class `MainActivity`:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_133.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_134.jpg,
    135.jpg)


    ```java

    In `onCreate()`, an object of the type `NotificationManager` is created, which
    is the object used for notifications. Additionally, event handlers are associated
    to the two buttons, the first being the most important and calls the method `notifyUser()`.
    The class `Notification` has a static method `builder()` that is used to instantiate
    a `Notification` object. Values are what should be used for the application’s
    notification bar, and you should especially note the assignment of an icon, which
    is a `drawable` named `alarm.png`. After the object `noti` is created, an audio
    file is assigned, which is also a resource and has the name `sound.mp3` and is
    stored in the directory `raw`. Final is defined that the device should vibrate
    twice. You are instructed to read the documentation for the class `Notification`,
    including the details of the individual values. After the object `noti` is initialized,
    the `NotificationManager` object is used to raise the notification.

    ```

