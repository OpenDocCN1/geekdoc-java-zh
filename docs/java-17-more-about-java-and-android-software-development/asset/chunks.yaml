  trans: '


    作为第一步，你必须添加名为 `res/layout-land` 的新目录。最简单的方法是右键点击 `res` 目录并选择


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_19.jpg)


    然后你会看到以下窗口：


    ![](img/Image1906.jpg)


    其中我作为 `Resource type`（资源类型）选择了 `layout`。接下来，在 `Available qualifiers`（可用限定符）下，我选择了
    `Orientation`（方向），点击 `>>` 按钮后，会出现下面的窗口：


    ![](img/Image1913.jpg)


    在这里，我在 `Screen orientation`（屏幕方向）下选择了 `Landscape`（横屏）。当你点击 `OK` 时，Android Studio
    会 `res` 下创建一个名为 `layout-land` 的目录。


    然后你必须将 `activity_main.xml` 文件复制到新目录中（如果 Android Studio 没有显示新目录，你可以从外部使用 `Files`
    进行操作）。现在项目有两个版本的 `activity_main.xml`，这里的新版本将根据横屏模式进行调整。没有什么需要做的，下面显示了更改的内容：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_20.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_21.jpg)


    之后，程序就可以进行编译和测试了，你会发现如果手机垂直握持，则会使用旧设计；如果水平握持，则会使用新设计。在两种情况下，使用的都是相同的 fragments（片段），并且运行时系统会处理（因为现在有一个
    `layout-land` 目录），确保 `MainActivity` 使用的是正确的设计。


    ## 2.2 屏幕尺寸


    上面我展示了如何让 Android 根据手机的方向应用特定的布局，其中 Android 根据特定的命名约定决定使用哪种资源。你也可以在屏幕尺寸上做相同的操作。然而，这并不简单，因为现在有许多不同的屏幕尺寸，尤其是是因为你还必须考虑平板电脑。


    我将从上述项目的副本开始，我将其命名为 `TheBooks3`。首先，我将以另一种方式实现关于手机旋转的解决方案。我更改了 `layout-land` 目录下的
    `activity_main.xml` 版本名称为 `activity_main_wide.xml`，然后将文件复制到 `layout` 目录，并再次删除了
    `layout-land` 目录。结果是 `layout` 目录现在包含了四个文件：


    ![](img/Image1921.jpg)


    下一步，我按照上面显示的方法（使用相同的向导）添加了一个资源目录：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_22.jpg)


    名称为 `values-land`。对于这个目录，我添加了以下 XML 文件，我将其命名为 `refs.xml`：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_221.jpg)


    它是 `land` 目录中的资源，结果是，如果设备水平握持，Android 会发现运行时系统作为 `activity_main.xml` 引用的布局，必须使用
    `activity_main_wide.xml` 而不是 `activity_main.xml`。现在你尝试运行应用程序，你会发现它一切运行正常，并且手机根据垂直握持还是水平握持使用不同的布局。目前，这种解决方案与上一个示例相比没有优势。这种技术被称为
    `layout aliasing`（布局别名），优点是你可以轻松扩展解决方案以包含具有不同屏幕尺寸的设备。


    正如提到的，现在有许多在物理尺寸和分辨率上都不同的屏幕尺寸。同样，Android 使用了一种名为 `density independent pixel`（密度无关像素）的测量单位，称为
    `dp`，这是我在上一本书中使用的测量单位。`1 dp` 定义为在 `160 dpi` 设备上 `1 pixel` 的物理尺寸，因此它独立于屏幕的物理像素尺寸。例如，如果你考虑
    `160 dpi` 设备上的 7 英寸屏幕，对角线方向有 1120 个像素。如果屏幕格式为 16 × 9，通过略微舍入得到的分辨率为 `1000 × 600
    dp`。


    Android 使用 `resource screen size qualifiers`（资源屏幕尺寸限定符）定义屏幕尺寸，这里有三个使用资源目录定义的选项：


    1. `Smallest width screen size qualifier`（最小宽度屏幕尺寸限定符）。它对应于独立设备方向的屏幕最窄处的 `dp`
    数。资源目录的名称为 `sw`，后跟所需的屏幕尺寸。例如，针对最小宽度至少为 `600 dp` 的设备的布局资源目录名为 `layout-sw600dp`。


    2. `Available width screen size qualifier`（可用宽度屏幕尺寸限定符）。它对应设备当前方向从左到右量的 `dp` 数。如果你更改设备方向，可用宽度也会改变。资源目录的名称为
    `w`，后跟宽度。例如，针对可用宽度至少为 `600 dp` 的设备的布局资源目录名为 `layout-w600dp`。


    3. `Available height screen size qualifier`（可用高度屏幕尺寸限定符）。它对应设备当前方向从上到下量的 `dp`
    数。如果你更改设备方向，可用高度也会改变。资源目录的名称为 `h`，后跟高度。例如，针对可用高度至少为 `600 dp` 的设备的布局资源目录名为 `layout-h600dp`。（注：原文在此处对
    3 点的描述出现了错乱，重复了宽度描述，翻译时已根据逻辑修正）。


    `Available width screen size qualifier`（可用宽度屏幕尺寸限定符）。它对应设备当前方向从左到右量的 `dp` 数。如果你更改设备方向，可用宽度也会改变。资源目录的名称为
    `w`，后跟宽度。例如，针对可用宽度至少为 `600 dp` 的设备的布局资源目录名为 `layout-w600dp`。


    与其使用屏幕尺寸限定符指定资源目录，不如使用旧的方法将设备分为四组：`small`、`normal`、`large` 或 `xlarge`，资源目录名称可以是
    `layout-large`。


    在当前案例中，我以相同的方法添加了资源目录 `values-large`


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_23.jpg)


    在接下来的窗口中，我为 `Resource Type` 选择了 `values` 并选择了 `Size`，当我点击 `>>` 按钮时，将选择 `large`。


    ![](img/Image1930.jpg)


    同样，我创建了另一个资源目录，这次是 `values-v600dp`。区别在于在上面的屏幕中，我将选择宽度名称，而在下面的窗口中将输入名称：


    ![](img/Image1937.jpg)


    创建这两个目录后，必须将 `values-land` 目录中的 `refs.xml` 文件复制到这两个新目录中。


    ## 2.3 Fragments 之间的通信


    上面的程序使用 fragments 解决了 Android 应用的许多挑战，并且程序按预期工作。有两个 fragments，这两个片段之间必须相互通信，以便当在一个片段中点击单选按钮时，另一个片段必须被更新。在程序中，这种通信由
    `MainActivity` 解决，它接收单选按钮被点击的通知，事件处理程序将确定点击了哪个单选按钮，以找到要更新另一个片段的数据，然后更新片段的 `TextView`
    组件。从原理上讲这样做没有问题，但这意味着程序的 activity 和 fragments 之间紧密耦合，使得在其他 activity 中复用单个片段变得更加困难。


    '
- fmt: '

    In this section, I want to show a version of the program that implements a looser
    coupling of the fragments. The starting point is a copy of the previous version
    of the program, which I have called `TheBooks4`, and when you study the code,
    you will not immediately see the benefits, because the code fills more and is
    more complex, but for larger applications with multiple activities that use the
    same fragments the work are done well, as the result is a program that is easier
    to maintain. In the following, I will show what has changed, and the changes only
    concerns the Java code.


    When objects in Java has to communicate and you want to use a loose coupling,
    the usual pattern is to define an interface. Similarly, I have added the following
    interface to the project:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_26.jpg)


    The interface defines a single method and the meaning is that the class `BooksFragment`
    must send a notification to a `SelectBookListener` if a radio button is clicked.
    The parameter of the method must be the index of the radio button that is clicked
    on. The class `BooksFragment` must be changed and the result could be:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_261.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_27.jpg)


    First, note that the class now implements the interface `RadioGroup.OnCheckeChangeListener`,
    and the class then must implement the method `onCheckedChanged()`. First, the
    method `getActivity()` is used to determine the activity to which this fragment
    is associated. If it is a `SelectBookListener` (what a `BooksFragment` object
    can not know – nor should it know), the method determines which radio button is
    clicked (note that the code is copied from `MainActivity`). Then the type of the
    current activity is casted to a `SelectBookListener` object, after which the method
    `onSelectedBookChanged()` is called with the index of the book as a parameter.
    You should also note that `onCreateView()` has been changed so it now determines
    a reference to the layout’s `RadioGroup` component and uses it to associate an
    event handler to the `RadioGroup` component.


    The `BookFragment` class has also been changed:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_28.jpg)


    Note that the class now has three variables, all of which are copied from `MainActivity`.
    That is, the list of `Book` objects is part of this class, which is not natural,
    but to solve the reference problems, it is made `static`, so multiple instances
    of the class `BookFragment` do not create each their copy. A better option would
    be instead to place book information like `String` resources. In other contexts,
    the information would be retrieved from a database, and the parameter to `setBook()`
    would then be a key. `setBook()` updates the two `TextView` components that create
    references to the components in `onCreateView()`.


    Back there is `MainActivity`, which has now been changed to the following:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_29.jpg)


    All variables are removed, and `onCreate()` is trivial (as Android Studio has
    created it). The class implements the interface `SelectBookListener` and therefore
    needs to implement the event handler `onSelectedBookChanged()`. It is called from
    `BooksFragment` when clicking on a radio button and the parameter is the index
    of the book that is clicked. When that happens, you should call the method `setBook()`
    in the class `BookFragment`. You can not immediately refer to a `Fragment` from
    an activity, but you can do it with a `FragmentManager` object, and any activity
    has a method that returns such an object. With this object available, you can
    determine a reference to the fragment and succeed, you can call `setBook()`.


    After that, the changes have been implemented – after a relatively long way –
    but the result is a solution with weaker couplings between the classes.


    ## Exercise 1: TheBirds


    You must write an application that you can call `TheBirds`. The book’s source
    directory contains a sub directory of 7 pictures. When the program opens, it must
    show an overview of these pictures as well as the first picture. When you click
    the name of a picture, it is that picture that will appear in the window. The
    user interface must consist of two fragments, one showing the list, while the
    other shows the picture. Additionally, the program must support the phone’s rotation.
    You do not have to take into account different screen sizes.


    ![](image/Image1945.jpg)![](image/Image1953.jpg)


    ## 2.4 Two activities


    The above application is a so-called list / detail application and shows two different
    layouts depending on how the phone is held or if the device is a-tablet. It’s
    an application that shows an overview of a number of objects (here that is book
