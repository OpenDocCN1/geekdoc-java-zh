- fmt: '

    Just as there is for an activity associated a number of callback methods, the
    same applies to fragments, and of course, there is a connection as to when these
    methods are performed. When a fragment is initialized, the following callback
    methods are performed, where the methods on the left relate to the activity, while
    the methods to the right relate to the fragment:


    ![](image/Image1960.jpg)


    The most important method is `onCreateView()` as illustrated in the previous examples.
    When a fragment is associated with an activity, a method `onAttach()` is performed,
    and then the activity is known in the fragment and you can use the method `getActivity()`.
    Then the fragment sends a notification to the activity, after which `onCreate()`
    and `onCreateView()` are executed, where the layout is created in the last. The
    two methods are the most important and for many fragments they are the only callback
    methods that are overridden. The difference is that if the initialization has
    actions that takes time as connect to a data source, complex calculations and
    allocation of resources it should be performed in `onCreate()` and the rest and
    the primary the initialization of the layout should be done in `onCreateView()`.
    The reason is that it is often only the fragment’s view hierarchy that is shut
    down and therefore it is not necessary to perform time-consuming initialization
    every time something happens to the phone.


    ### The four methods


    1. `onAttach()`

    2. `onAttachFragment()`

    3. `onCreate()`

    4. `onCreateView()`


    are always performed together, which is important if an activity is associated
    with multiple fragments. When this sequence of methods is performed for all fragments,
    the remaining callback methods can be performed individually. Here `onActivityCreated()`
    tells the fragments that the activity is created, while `onStart()` and `onResume()`
    basically have the same function for a fragment as the case is for an activity.


    When a fragment is hidden or is shut down, something similar happens:


    ![](image/Image1970.jpg)


    Basically, it is the same as for an activity, but after `onStop()`, for each fragment
    three methods are performed:


    1. `onDestroyView()`

    2. `onDestroy()`

    3. `onDetach()`


    and they are performed together. Then the fragment is no longer associated with
    an activity and you can no longer perform `getActivity()`.


    There are several reasons for this separation of how to create and how to close
    a fragment and, among other things, be utilized that if a fragment is hidden,
    it is only `onDestroyView()` that is executed and once the fragment is visible
    again, it is only `onCreateView()` that is performed.


    You should also be aware of the method `onSaveInstanceState()`, which has the
    same function as for an activity and is used to persist a fragment’s state before
    it is closed.


    ## 2.6 A ListFragment


    If you look at the example that I have used in this chapter, the overview of books
    are listed with radio buttons. Here it would be more obvious to use a `ListView`
    in the fragment with the overview, and it would also be more flexible if the program
    should be expanded with new books. The subject of this section is to replace the
    radio buttons with a `ListView`. Immediately, it looks simple, but you can not
    just change the fragment_books.xml` layout and replace all `RadioButton` components
    with a `ListView` component. Instead, it is necessary to change the `BooksFragment`
    class to a `ListFragment`, but it is also quite simple.


    I starts with a copy of `TheBooks4` project and I have called the copy `TheBooks6`.
    However, I will start by modifying the data source a bit so that a `Book` object
    gets an additional field:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_37.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_38.jpg)


    Of course, it also requires that the class `Books` is changed, as an additional
    parameter must now be added when creating a `Book` object. In addition, the class
    has been changed to a singleton:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_381.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_39.jpg)


    With these changes, the class `BookFragment` can be updated as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_391.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_40.jpg)


    That is, the variable `book` has been removed, and the method `setBook()` is changed
    a bit.


    In addition, the changes have nothing to do with the fact that I want to use a
    `ListView` instead of `RadioButton` components. These changes take place in the
    class `BooksFragment`. Instead of `Fragment`, the class must inherit `ListFragment`.
    It is a specialization of a `Fragment` that encapsulates a `ListView` component
    and thus a fragment with a specific purpose and layout. The fragment therefore
    does not use a XML file with the layout. The class `BooksFragment` must be changed
    to the following:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_401.jpg)


    Note that the class now inherits `ListFragment` and that there is no `onCreateView()`
    method. Instead, the callback `onActivityCreated()` is overridden, and it usually
    initializes the adapter. You should be aware that `ListFragment` has a method
    `getListView()`, which returns the `ListView` object.


    ## Exercise 2: Kings


    You must write an application similar to the above (`TheBooks6`), but instead,
    the application must show an overview of Danish kings. If you open the application,
    you must get the following windows where `Knud den Store`:


    ![](image/1977.jpg)![](image/1984.jpg)


    Start creating a new project that you can call `TheKings`. In the previous book
    there is a project called `AboutKings`, which contains two classes `King` and
    `Kings`. Copy these classes to your new project. The class `King` should not be
    changed, but you should change the class `Kings` so it’s a singleton.


    ## 2.7 A DialogFragment


    A fragment can also be used to open a dialog box. In the previous book, I have
    discussed dialog boxes, and the class `Dialog` makes much more available for dialog
    boxes, it is easier and better to wrap a `Dialog` object in a fragment and that
    is exactly what the class `DialogFragment` does. For example, it solves a problem
    by rotating the phone. The program `ThePersons` opens the following window:


    ![](image/1992.jpg)


    which shows 4 people in a list. Clicking on a name opens a dialog box (see below),
    where you can edit information about the person and optionally delete the person.
    The program has a menu with a single menu item and clicking on it opens the same
    dialog box where you can create a person instead.


    ![](image/1999.jpg)


    The example actually has some code. Not because it is difficult to use a `DialogFragment`,
    but because there are nevertheless some details that you need to know and how
    to transfer data to the dialog and receive notifications. The program is born
    with 4 people just for the window to show something, but you should note that
    the changes you make (people that are created or modified) are not saved. Of course,
    it would be relatively simple to add this option.


    First, a model class is defined for a person:


    ```

    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_44.jpg)

    ```

