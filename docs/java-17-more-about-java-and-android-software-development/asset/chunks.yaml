- fmt: '

    When writing programs, security plays an increasing role, and it also applies
    to applications for mobile phones and other Android devices, and even more than
    is the case is with PC applications, as you constantly download and install apps
    on your device. Android has a relatively short history and the security issue
    has been a part of Android right from the start, but nevertheless, the security
    of Android devices has always been challenged and that has constantly caused Google
    to strengthen the security requirements, and they has thus all the time changed
    the requirements for the applications that users can download and install on the
    phone. Therefore, I would like to close this book on developing mobile phone applications
    with some remarks about the security requirements and thus what an application
    can do.


    As long as it’s all about developing apps as it has been done in this and the
    previous book, where an app is tested in the emulator, or possibly installed and
    tested on a physical device using a USB cable, there are not many problems, and
    at least it is the developer who takes responsibility for his own programs. If,
    on the other hand, downloading apps from an app store (as is what ordinary users
    do), then there’s a whole different case, because here you allow programs that
    you do not know how is made and what they do in the hidden, being installed and
    running on your own machine. Here is trust not enough, but procedures and controls
    are required to ensure that these apps do not damage the device and the user’s
    data and possibly steal the user’s data – if that is possible and if not, at least
    minimize the risk. All that’s not simple and it complicates the development of
    programs considerably.


    ## 11.1 The AndroidManifest.xml


    As already shown in many examples, an app can not immediately use many of the
    device’s features, such as making a phone call, writing to a file, opening a website,
    and more. Here it is the developer who should give permission using a `permission`
    element in the manifest:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_136.jpg)


    and you can have all the permission elements that are needed. The name is a constant
    defined in a package `android.permission`, and an example could be:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1361.jpg)


    The version number specifies a threshold for the Android version, which is tested
    when the application is installed and an Android release larger than `masSdkVersion`
    will simply ignore a permission request. The intention is not to ignore the permission
    requirements, but to solve the problem that the issue of the permission check
    for requirements change from version to version. For example, an app from version
    19 onwards will no longer require a `WRITE_EXTERNAL_STORAGE` to write to a file
    as security is resolved in another way.


    ## 11.2 Marshmallow and Beyond


    From Android 6.0 Mashmallow, you can solve security in a more flexible way, where
    the user explicitly allows permission to use a particular feature such as the
    phone’s camera, GPS, and so forth. Earlier it happened to all features when the
    application was installed based on the information in the manifest, but it is
    not very flexible. Now, if it is the first time that the feature in question is
    used, where you get a simple dialog box where you can allow or reject it for each
    feature, and you can go back to Settings under Settings | Apps and remove that
    permission. It requires a bit more of the programmer, and although I have already
    shown how, I will illustrate how to do with an example.


    The application `ThePermissions` opens the following window:


    ![](image/Image2157.jpg)


    Clicking on the bottom button lets you know that you do not have rights:


    *You have no permission*


    which means that you are not allowed to read the GPS coordinates. If you click
    on the top button, you get this right, that is, `ACCESS_FINE_LOCATION`, but the
    first time this feature is used, you will be prompted to give the permission,
    but else you will only get a `Toast` that tells that you already has the permission.


    After clicking on the top button, you get a `Toast` with the GPS coordinates every
    time you click the bottom button.


    The program’s code is as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_138.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_139.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_140.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1411.jpg)


    Initially, there are in addition to a constant defined 5 variables, where the
    first one is to a `LocationManager`, while the next two are references to the
    two buttons. The variable `permission` is used to control whether the top button
    is clicked and the user has been given permission to read the location. The variable
    `waitingGps` is set to true when clicking on the bottom button and tells that
    a location reading has started. The goal is to avoid starting a reading again
    before the first has returned.


    `onCreate()` fills a lot, but it is primarily due to the event handlers of the
    two buttons. The event handler for the top button tests the variable `permission`
    and calls the method `hasPermission()` to see if the user already has the permission.
    The method `hasPermission()` uses


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1412.jpg)


    to test if the user already has the permission. If the user already has the permission,
    a `Toast` is displayed and the variable `permission` is set to `true`. Otherwise,
    the method `requestPermission()` is called. Here is first called


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_142.jpg)


    to test for `ACCESS_FINE_LOCATION` and the meaning is that you can do something
    to tell the user what this permission means. In this case, a simple `Toast` appears
    (which does not make sense, since you can not reach it before the next `Toast`).
    Then the method


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1421.jpg)


    is called which opens a dialog box where the user must actively or reject the
    requested permission. The dialog performs a callback to `onRequestPermissionsResult()`,
    where the program with a `Toast` shows the result and the variable `permission`
    is initialized.


    The event handler for the second button reads the GPS coordinates, if the application
    is otherwise allowed. First, it is tested whether a reading is already started,
    and if so, nothing happens other than the method returns. Otherwise, the variable
    `permission` is tested, and if it is `false`, showing a `Toast`. Otherwise, the
    variable `watingps` is set to `true`, and the object `locationManager` is used
    to send a request for reading the coordinates. This happens in the same way as
    shown in the program `TheLocation` and with the object `gpsListener` that is created
    at the end of the program. When the coordinates are returned, the method `onLocationChanged()`
    is called on the `gpsListener` object, which displays a `Toast` with the coordinates
    and uses the `locationManager` object to remove the listener.


    ## 11.3 An app store


    Once an application has been completed and tested, it should usually be placed
    on an app store like *Google Play* for others to download and apply the application.
    I do not want to show here how, as it depends on the current store, but for Google
    Play, I can mention that you need a `Google Play Developer Acount`, which costs
    a smaller start amount, after which you can upload apps by a defined procedure.
    However, the following is generally and applies in practice to any app that needs
    to be uploaded to a store.

    '
