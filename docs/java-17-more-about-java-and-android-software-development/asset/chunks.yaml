    ## 8.1 LoadData()


    The component `WebView` can generally be used to display HTML, and it does not
    need to be the result of a web page from the Internet as above. The applications
    are more and, for example, you can display the content of a file containing HTML,
    and in principle you could define the entire user interface as HTML and display
    it with a `WebView` component. As an example, the project `TheWeb2` shows how.
    The layout is the same as `TheWeb1`. In addition, I have added the two classes
    `King` and `Kings` from the project `TheKings` in the book Java 16, and I have
    modified the method `toString()` in the class `King`. With these two classes available,
    I’ve changed `MainActivity` to:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_109.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_110.jpg)


    The only thing to note is the method `buildHtml()`, which dynamically builds a
    string with HTML, and that the `WebView` component displays this text using the
    method `loadData()`. If you performs application the result is:


    ![](image/Image2117.jpg)


    ## 8.2 Connect to an URL


    A `WebView` component can be used to display a website, but seen in relation to
    apps on a phone it is far from the typical use of the Internet. Far more often,
    you are interested in retrieving data to your phone by connecting to an URL. It
    could be a web service that returns data in some format, and there are actually
    many of those kinds of services that are public and directly available to anyone
    who wants to apply them. Many of these services return JSON data, which does not
    matter a lot, and partly there are standard parsers, so they are easy to use.
    In this section I will show an application that connects to such a service and
    retrieves the service’s data. The application does not use the data in question
    (does not interpret data), but after the data is retrieved, a `Toast` tells how
    many characters are retrieved.


    The service in question has the address:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_1111.jpg)


    which refers to data from an organization that provides Danish data for free.
    The project is called `TheWeb3`, and the layout is trivial with a single button.
    Clicking the button creates a connection to the above address, and the application
    reads the relevant JSON data, but without interpreting them. The code for `MainActivity`
    is:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_112.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_113.jpg)


    The Event handler for the button creates an `InternetTask` and executes the method
    `execute()`. The class `InternetTask` is an inner class that inherits the Android
    class `AsyncTask`, which is a generic class that is parameterized with three parameters.
    The goal of the class is to start an operation that is performed in a background
    thread, and the class will automatic update the UI thread. You must override 4
    methods, where the first `onPreExecute()` is performed by the UI thread before
    the operation itself, which occurs in the method `doInBackground()`. The first
    parameter type for the class indicates the type of parameters for `doInBackground()`.
    The third method to override is `onProgressUpdate()`, which also performs on the
    UI thread and can be indirectly called from `doInBackground()` to illustrate the
    progress of the operation. The other parameter type for the class indicates the
    type for this method. The last method to override is called `onPostExecute()`,
    and it is also executed by the UI thread, but after the method `doInBackground()`
    is performed. The third parameter type indicates the type of the parameter for
    this method, which is often the return value from `doInBackground()`. The operation
    in question starts with the method `execute()` which executes `onPreExecute()`,
    creates a thread that performs `doInBackground()` and after the thread terminates
    `executes()` performs the method `onPostExecute()`.


    In this case, there are only two of the methods that are not trivial. The class
    `MainActivity` has a method called `fetchUrl()`, and `doInBackground()` calls
    this method and returns the result. That is, that `fetchUrl()` is executed in
    a background thread, and after the method is completed, a `Toast` (the method
    `onPostExecute()`) appears, showing how many characters `doInBackground()` has
    returned.


    Then there is `fetchUrl()` which is where everything happens. It has a parameter,
    which is a web address transferred from `doInBackground()` – here hard-coded,
    and in practice it would probably happen in a different way, and at least the
    address could be moved to a resource. The method creates an URL for that address
    and uses this URL to create a `HttpURLConnection` object, which is an object representing
    a connection for the current URL. For this connection, it is defined to be used
    as an HTTP request, after which the connection is created:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_114.jpg)

