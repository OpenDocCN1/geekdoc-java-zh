    So I have changed two things in which the `LinearLayout` element has an `id` (so
    it can be referenced from the code) and the fragment element has been removed,
    and the layout is reasonably trivial. Otherwise, the changes primarily concern
    the class `MainActivity`, but it is also necessary to change the class `BookFragment`,
    where two constants are added, just like `onCreateView()` is updated:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_54.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_55.jpg)


    It is not entirely clear what these changes should benefit from, but the goal
    is that it should be possible to transfer a parameter to `onCreateView()` which
    must be the index of the book selected by the user from the list. The first constant
    is alone a name to identify the parameter while the other is the default value
    indicating that an argument has not been transmitted. A parameter or argument
    is encapsulated in a `Bundle` object, and this object is determined in `onCreateView()`
    with `getArguments()`, and if there is an argument, you try to determine the value
    as an `int`. Is it successful and it is not the default value, `setBook()` is
    called with the value as parameter.


    On the other hand, the changes in `MainActivity` are more extensive:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_551.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_56.jpg)


    First, a variable `isDynamic` is introduced, which is used to control whether
    or not dynamic updating of fragments is used, and that is where the device is
    oriented vertically or horizontally. The variable is initialized in `onCreate()`
    using a `FragmentManager`, which tests whether the `BookFragment` fragment exists,
    and thus where the layout `activity_main.xml` or `activity_main_wide.xml` is used.
    If `isDynamic` is `true`, a fragment must be dynamically inserted. However, it
    requires that you use a `transaction`. A `FragmentManager` can start a transaction
    as a `FragmentTransaction`, for which you can add operations regarding fragments.
    In this case, only one operation is added, which is an `add()` operation that
    adds a `BooksFragment` to the activity. Here you should note that the `LinearLayout`
    element in the XML document now has an `id`. Also note the last parameter for
    the method `add()`, which simply means that the fragment gets a name, so it can
    be referred to later. The result is that when the `FragmentTransaction` object
    performs a `commit()`, then operations that are added to the transaction are performed
    as one single operation.


    Also the event handler `onSelectedBookChanged()` has been changed. If the variable
    `isDynamic` is `true` (and the phone is held vertically) then the fragment with
    the list must be replaced with the fragment showing the details. Therefore, a
    transaction is created again. In addition, the creation of a `BookFragment` object
    and the `id` of the book that is selected is associated as an argument with a
    `Bundle` object. Note that here you use the name defined as a constant in the
    `BookFragment` class. After the `BookFragment` object has been created and initialized
    with an argument, replace the fragment with the list, by adding a `replace()`
    to the transaction. Now, it may be so that the back button still works, so you
    must perform the operation `addToBackStack()` so that the current window (the
    current transaction) is stacked.


    After that everything should work – at least in theory, but it does not apply
    to the back button if the phone is held vertically. Therefore, the last method
    only solves the problem to some extent. It may be a good job to search for a better
    solution.


    After the program has been tested, I can finally delete `BookActivity.java` and
    `activity_book.xml` as these files are no longer used.


    # 3 The phone


    When writing Android applications, it’s a bit different from usual PC applications,
    simply because the devices often makes other facilities available, and if the
    device is a phone, you can make phone calls. In this chapter I will show how to
    do it in software and thus write applications where the user is able to make a
    phone call. From the programmer, there are two options, in which case it is the
    user of the phone that makes a call, while in the other case it is a question
    of writing a program that others can activate if they make a call to the current
    phone. Here is the last not quite simple. Firstly, it requires some service that
    receives notifications regarding calls, and there are some security issues in
    it, and the issues is not discussed here. The first problem, in which case it
    is the user of an application that makes a call is quite simple, and the following
    shows in an example how. If you open the application `ThePhone`, you get the following
    window:


    ![](image/Image2007.jpg)


    Here’s an entry field, so you can enter a phone number, and there are two buttons
    that you can use to make calls to the number you have entered. If you click on
    the `DIAL` button, you get the usual window, like when you else make a phone call,
    and the number you entered has been inserted and you have as usual to press the
    `Call` button to make the phone call. If you click on `CALL`, the phone immediately
    executes a call without the user’s intervention – if otherwise allowed. You must
    assign rights in `AndroidManifest.xml`, but with the latest phones it is not enough
    and the phone shows a dialog box where the user must accept that the phone is
    calling. In this case the manifest is updated as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_59.jpg)


    The element `uses-permission` allows a program to make phone calls, without the
    user having to click the `Call` button. The element `uses-feature` is used to
    tell that the application can only be used (can only run) on a device that supports
    phone calls. Although most Android devices are still phones, the number of Android
    devices that are not grows, and on such devices it makes no sense to make phone
    calls. Note that instead, you can test where the device can make phone calls in
    software if the above procedures are too restrictive:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_591.jpg)


    I do not want to show the layout of the current application as it contains nothing
    new, but the Java code is as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_592.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_60.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_61.jpg)


    The method `onDial()` is the event handler for the `DIAL` button and is quite
    simple. The first thing that happens is that the method determines a `TelephonyManager`
    object. It has a method `getCallState()` that is used to test if there is already
    a phone call in progress. It is not absolutely necessary, but recommended, otherwise
    you may interrupt an already ongoing conversation. If not, determine the phone
    number entered and note that it is preceded by the prefix `tel:` which tells that
    it is a phone number. Next, the call is executed with `startActivity()` and an
    `Intent` object. The first parameter to the `Intent` object indicates that a phone
    call must be made in the usual way, that is where the user get a dialog for entering
    the number while the other parameter are the number.

    '
