    As a first step, you must add a new directory called `res/layout-land`. Doing
    this is easiest by right-clicking on the directory `res` and then selecting


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_19.jpg)


    Then you get the following window:


    ![](image/Image1906.jpg)


    where, as a `Resource type`, I have chosen `layout`. Next, under `Available qualifiers`,
    I have selected `Orientation`, and after I clicked on the button `>>` I get the
    following window:


    ![](image/Image1913.jpg)


    Here I have under `Screen orientation` selected `Landscape`. When you click `OK`,
    then Android Studio creates a directory named `layout-land` under `res`.


    You must then copy the file `activity_main.xml` to the new directory (if Android
    Studio does not display the new directory, you can do it from outside using `Files`).
    The project now has two versions of `activity_main.xml`, and here the new will
    be adjusted as it fits landscape mode. There is not much to do, and below is shown
    what is changed:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_20.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_21.jpg)


    After that, the program can be translated and tested and you will discover that
    if the phone is held vertically, the old design is used and held horizontal, the
    new design is used. In both cases, the same fragments are used and the runtime
    system takes care of (since there is now a `layout-land` directory) that it is
    the right design used for `MainActivity`.


    ## 2.2 The screen size


    Above I have shown how to get Android to apply a particular layout depending on
    the phone’s orientation, where Android, based on a particular name convention,
    decides which resource to use. You can do the same with regard to the screen size.
    However, it is not quite simple as today there are many different screen sizes,
    among other things because you also have to take into account tablets.


    I will start with a copy of the above project, which I have called `TheBooks3`.
    I will first implement the solution with regard to the rotation of the phone in
    a different way. I have changed the name of the version of `activity_main.xml`
    found under the directory `layout-land` to `activity_main_wide.xml`, and then
    I have copied the file to the directory `layout` and then deleted the directory
    `layout-land` again. The result is that the directory `layout` now contains four
    files:


    ![](image/Image1921.jpg)


    As the next step, I have the same way as shown above (with the same wizard) added
    a resource directory:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_22.jpg)


    with the name `values-land`. For this directory, I have added the following XML
    file, which I have called `refs.xml`:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_221.jpg)


    It is a resource in a `land` directory, and the result is that if the device is
    held horizontal, Android will see that the runtime system as layout for references
    to `activity_main.xml` it must use `activity_main_wide.xml` instead of `activity_main.xml`.
    If you try the application now, you will see that it all works again and that
    the phone uses a different layout depending on whether it is held vertical or
    horizontal. For the time being, there is no benefit in this solution compared
    with the previous example. The technique is called `layout aliasing`, and the
    advantage is that you can easily expand the solution to include devices with a
    different screen size.


    Today, as mentioned, there are many screen sizes that vary in terms of physical
    size and resolution. Similarly, Android uses a measurement unit called `density
    independent pixel` and is called `dp`, and it is the unit of measurement that
    I have used throughout the previous book. `1 dp` is defined as the physical size
    of `1 pixel` on a `160 dpi` device and is therefore independent of the screen’s
    physical pixel size. For example, if you consider a 7 inch screen on a `160 dpi`
    device, there are 1120 pixels along the diagonal. Is the screen format 16 × 9
    it gives with a slightly rounding a resolution of `1000 × 600 dp`.


    Android defines screen sizes using `resource screen size qualifiers`, and here
    are three options that are defined using a resource directory:


    1. `Smallest width screen size qualifier`. It corresponds to the number of `dp`
    for the screen’s narrowest point independent of the device orientation. The name
    of a resource directory is `sw`, followed by the desired screen size. For example,
    a layout resource directory for devices with a smallest width of at least `600
    dp` is called `layout-sw600dp`.


    2. `Available width screen size qualifier`. It corresponds to the number of `dp`
    measured left to right for the device’s current orientation. If you change the
    device orientation you also changes the available width. The name of a resource
    directory is `w`, followed the width. For example, a layout resource directory
    for devices with available width of at least `600 dp` is called `layout-w600dp`.


    3. `Available height screen size qualifier`. It corresponds to the number of `dp`
    measured left to right for the device’s current orientation. If you change the
    device orientation you also changes the available width. The name of a resource
    directory is `w`, followed the width. For example, a layout resource directory
    for devices with available width of at least `600 dp` is called `layout-w600dp`.


    `Available height screen size qualifier`. It corresponds to the number of `dp`
    measured top to bottom for the device’s current orientation. It behaves identically
    to the available width size qualifier, except that `h` is used instead of `w`.
    A layout resource directory for a device with available height of at least `600
    dp` is called `layout-h600dp`.


    Instead of specifying resource directories using screen size qualifiers, you use
    an older way of splitting devices into four groups: `small`, `normal`, `large`,
    or `xlarge`, and a resource directory name may, for example, be `layout-large`.


    In the present case, I have added a resource directory `values-large` in the same
    way as above to select


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_23.jpg)


    In the following window I have selected `values` for `Resource Type` and selected
    `Size`, and when I click on the `>>` button I will select `large`.


    ![](image/Image1930.jpg)


    Similarly, I have created another resource directory, this time `values-v600dp`.
    The difference is that in the above screen, I will select the screen width name,
    and in the below window I will enter the name:


    ![](image/Image1937.jpg)


    After creating these two directories, the file `refs.xml` from the `values-land`
    directory must be copied to both of the new directories.


    ## 2.3 Communication between fragments


    The above program solve using fragments a number of challenges regarding Android
    apps, and the program works as desired. There are two fragments and the two fragments
    must communicate with each other so that in one fragment is clicked on a radio
    button, the second fragment must be updated. In the program, this communication
    is solved by `MainActivity`, which receives a notification when a radio button
    is clicked and an event handler will then determine which radio button is clicked
    to find the data that the other fragment is to be updated with and then update
    the fragment’s `TextView` components. In principle, there is nothing wrong with
    it, but it means that the program’s activity and fragments are closely linked,
    and it makes it more difficult to reuse the individual fragments in other activities.

