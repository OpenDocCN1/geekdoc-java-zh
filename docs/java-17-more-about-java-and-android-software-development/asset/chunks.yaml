    3.  *onCreate()*


    4.  *onCreateView()*


    are always performed together, which is important if an activity is associated
    with multiple fragments. When this sequence of methods is performed for all fragments,
    the remaining callback methods can be performed individually. Here *onActivityCreated()*
    tells the fragments that the activity is created, while *onStart()* and *onResume()*
    basically have the same function for a fragment as the case is for an activity.


    When a fragment is hidden or is shut down, something similar happens:


    ![](image/Image1970.jpg)


    Basically, it is the same as for an activity, but after *onStop()*, for each fragment
    three methods are performed:


    1.  *onDestroyView()*


    2.  *onDestroy()*


    3.  *onDetach()*


    and they are performed together. Then the fragment is no longer associated with
    an activity and you can no longer perform *getActivity()*.


    There are several reasons for this separation of how to create and how to close
    a fragment and, among other things, be utilized that if a fragment is hidden,
    it is only *onDestroyView()* that is executed and once the fragment is visible
    again, it is only *onCreateView()* that is  performed.


    You should also be aware of the method *onSaveInstanceState()*, which has the
    same function as for an activity and is used to persist a fragment’s state before
    it is closed.


    ## 2.6 A ListFragment


    If you look at the example that I have used in this chapter, the overview of books
    are listed with radio buttons. Here it would be more obvious to use a *ListView*
    in the fragment with the overview, and it would also be more flexible if the program
    should be expanded with new books. The subject of this section is to replace the
    radio buttons with a *ListView*. Immediately, it looks simple, but you can not
    just change the fragment_*books.xml* layout and replace all *RadioButton* components
    with a *ListView* component. Instead, it is necessary to change the *BooksFragment*
    class to a *ListFragment*, but it is also quite simple.


    I starts with a copy of *TheBooks4* project and I have called the copy *TheBooks6*.
    However, I will start by modifying the data source a bit so that a *Book* object
    gets an additional field:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_37.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_38.jpg)


    Of course, it also requires that the class *Books* is changed, as an additional
    parameter must now be added when creating a *Book* object. In addition, the class
    has been changed to a  singleton:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_381.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_39.jpg)


    With these changes, the class *BookFragment* can be updated as follows:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_391.jpg)![](image/Java_17_–_More_about_Java_and_Android_28-8-18_40.jpg)


    That is, the variable *book* has been removed, and the method *setBook()* is changed
    a bit.


    In addition, the changes have nothing to do with the fact that I want to use a
    *ListView* instead of *RadioButton* components. These changes take place in the
    class *BooksFragment*. Instead of *Fragment*, the class must inherit *ListFragment*.
    It is a specialization of a *Fragment* that encapsulates a *ListView* component
    and thus a fragment with a specific purpose and layout. The fragment therefore
    does not use a XML file with the layout. The class *BooksFragment* must be changed
    to the following:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_401.jpg)


    Note that the class now inherits *ListFragment* and that there is no *onCreateView()*
    method. Instead, the callback method *onActivityCreated()* is overriden, and it
    usually creates an adapter and initializes the fragment’s data source. This happens
    with *setListAdapter()*. Here you should be aware that the class *ListFragment*
    has a method *getListView()*, which returns the encapsulated *ListView* object.
    You can therefore use the *ListView* class methods as usually, with one exception:
    You can not initialize the component’s data with the *ListView* class’s *setListAdapter()*.


    To send a notification when selecting a name in the list, the event handler *onListItemClick()*
    is overridden to send a notification to a listener – if it is a *SelectBookListener*.


    Then the program is complete and works now as before. The layout *fragment_books.xml*
    is no longer used and can be deleted.


