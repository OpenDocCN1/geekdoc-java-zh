    vertically, the list is displayed at the top, and if the phone is held horizontally
    or in the case of a large screen, the list is displayed on the left and the details
    on the right. Such applications are widely used, but for space reasons, it is
    often interesting when the phone is held vertically, that the entire screen is
    used to the list, and when you touch an object to view details they appear in
    another activity. In this section I want to show what is needed for the above
    application to work.


    I start with a copy of `TheBooks4` project, which I have called `TheBooks5`. First,
    I’ve added a new empty activity, which I’ve called `BookActivity`. The layout
    is as follows:


