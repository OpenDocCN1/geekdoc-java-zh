    ### 3. `PASSIVE_PROVIDER`

    这意味着设备本身并不想要确定位置，而是使用由其他应用程序或服务确定的位置。其目的是节省电。


    应用程序 `TheLocation` 使用上述三个提供者中的前两个来确定设备的位置（见下方的窗口）。程序打开了一个用于确定设备位置坐标（经度和纬度）的窗口。该窗口有两个按钮，初始文本都为
    `Start`。点击上方按钮会将文本更改为 `Stop`，程序将使用 `GPS` 提供者定期根据当前位置更新 `Longitude`（经度）和 `Latitude`（纬度）的值。底部按钮的工作原理相同，但使用的是
    `network` 提供者。


    关于应用程序的用户界面，没有新内容，布局由使用 `RelativeLayout` 放置的 8 个小部件组成，我不想在这里显示代码。为了让应用程序使用设备的
    `GPS`，必须在 manifest 中允许：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_73.jpg)


    并且实际上只需要第一个权限元素。


    ![](img/Image2031.jpg)


    然后是 Java 代码，它立即填充了更多内容，其中有许多新内容：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_731.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_74.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_75.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_76.jpg)


    该类除了一个常量外还有 6 个变量，这里是用户界面中需要更新的 4 个 `TextView` 组件的最后 4 个引用。变量 `permission` 用于测试程序是否有权确定位置，最后是一个类型为
    `LocationManager` 的变量，它代表一个用于处理位置的对象，当然，使用这个对象是最重要的。


    在 `onCreate()` 中，当创建 `LocationManager` 对象时，什么都不会发生，并且初始化了 4 个引用用户界面组件的变量。manifest
    定义了程序可以使用 `GPS` 系统，但出于安全考虑，用户必须显式授予权限，这与我在上一个程序所示所示，必要的语句被放置在方法 `requestPermission()`
    中。从这个程序来看，初始化变量 `permission` 是非常重要的。


    `gpsOnOff()` 方法是上方按钮的事件处理器。首先测试变量 `permission`，如果其结果为 `true`，则根据按钮的文本来判断你是否想要开始读取
    `GPS` 位置，反之亦然。最终，从 `LocationManager` 对象中移除事件处理器，否则调用 `requestLocationUpdates()`
    来开始读取位置。在这里，首先说明必须使用 `GPS` 提供者，然后是每次读取之间的最小时间（至少 30 秒）。下一个参数表示执行新读取的最小距离（米），最后一个参数是每次读取时要执行的事件处理器。它被称为
    `gpsListener`，并定义为基于匿名类创建的对象，该匿名类的类型为 `LocationListener`，这是一个定义了 4 个方法的接口。在这种情况下，每次读取只调用其中一个。该方法的参数是一个
    `Location` 对象，它指示了经度和纬度等信息，但该对象实际上还包含其他值。该方法很简单，但你应该注意 `runOnUiThread()` 的使用，因为该方法是从另一个线程调用的。


    其他按钮也有类似的事件处理器和一个关联的监听器类，但我不想在这里显示代码，因为它们在原则上是相同的。


