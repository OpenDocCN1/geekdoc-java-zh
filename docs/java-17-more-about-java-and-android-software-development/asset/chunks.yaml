    在编写程序时，安全性正起着越来越重要的角色，这同样适用于手机和其他 Android 设备的应用程序，甚至比 PC 应用程序更为如此，因为你不断地在设备上下载并安装各种应用。Android
    的历史相对较短，安全问题从一开始开始就是 Android 的一部分，但尽管如此，Android 设备的安全性一直面临挑战，这不断使 Google 加强了安全要求，因此他们一直在不断改变用户可以在手机上下载和安装的应用的要求。因此，在结束关于开发手机应用的这本书时，我想对安全要求以及应用可以做什么做一些说明。


    只要一切都是关于开发应用，并且像在这本书和前一本书中那样完成的（即应用在模拟器中进行测试，或者可能通过 USB 线缆在物理设备上进行安装和测试），那么问题就不多，至少是开发者对自己的程序负责。另一方面，如果是从应用商店下载应用（这是普通用户的做法），那么情况完全是另一了，因为在这里你允许了那些不知道它们是如何制作的以及它们在做什么的程序在你自己的机器上安装并运行。在这里，仅仅有信任是不够的，需要程序和控制来确保这些应用不会损坏设备和用户数据，并可能窃取用户数据——如果这是可能的话；如果不可能，至少要把风险降至最低。这一切并不简单，它极大地复杂了程序的开发。


    ## 11.1 AndroidManifest.xml


    正如在许多示例所示，应用不能立即使用许多设备功能，例如拨打电话、写入文件、打开网站等。在这里，应该由开发者使用清单文件中的 `permission` 元素赋予权限：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_136.jpg)


    你可以拥有所有需要的权限元素。名称（name）是一个在 `android.permission` 包中定义的常量，示例如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1361.jpg)


    版本号指定了 Android 版本的阈值，该版本会在应用安装时进行测试，如果 Android 版本大于 `masSdkVersion`，则将简单忽略权限请求。其意图不是忽略权限要求，而是为了解决权限检查要求随版本变化产生的问题。例如，从版本
    19 开始的应用将不再需要 `WRITE_EXTERNAL_STORAGE` 权限来写入文件，因为安全性通过另一种方式解决了。


    ## 11.2 Marshmallow 及后续


    从 Android 6.0 Marshmallow 开始，你可以以更灵活的方式解决安全问题，即用户显式允许使用特定功能，如手机摄像头、GPS 等。早些时候所有功能都是在应用安装时根据清单文件中的信息被授权的，但这并不灵活。现在，如果是第一次使用相关功能，你将看到一个简单的对话框，在其中你可以对每个功能允许或拒绝，并且你可以回到“设置
    | 应用”（Settings | Apps）下并移除该权限。这对程序员的要求更高，尽管我已经展示了如何做，但我将通过一个示例来说明如何操作。


    应用 `ThePermissions` 打开了以下窗口：


    ![](img/Image2157.jpg)


    点击底部的按钮会让你知道没有权限：


    *你没有权限*（You have no permission）


    这意味着你不被允许读取 GPS 坐标。如果你点击顶部的按钮，你就获得了该权限，即 `ACCESS_FINE_LOCATION`，但在第一次使用该功能时，系统会提示授予权限，否则你只会收到一个告知你已经拥有权限的
    `Toast`。


    点击顶部按钮后，每次你点击底部按钮，都会得到一个带有 GPS 坐标的 `Toast`。


    程序的代码如下：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_138.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_139.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_140.jpg)![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1411.jpg)


    最初，除了定义的常量外，还有 5 个变量，其中第一个指向 `LocationManager`，接下来的两个是对两个按钮的引用。变量 `permission`
    用于控制是否点击了顶部按钮以及用户是否已被授予读取位置的权限。当点击底部按钮时，变量 `waitingGps` 被设置为 true，表示位置读取已开始。目标是避免在第一次读取返回之前再次启动读取。


    `onCreate()` 填充了很多内容，但主要由于两个按钮的事件处理器。顶部按钮的事件处理器测试变量 `permission` 并调用方法 `hasPermission()`
    来查看用户是否已经拥有该权限。`hasPermission()` 方法使用


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1412.jpg)


    来测试用户是否已拥有权限。如果用户已拥有权限，则显示 `Toast` 并将变量 `permission` 设置为 true。否则，调用方法 `requestPermission()`。在这里调用


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_142.jpg)


    测试 `ACCESS_FINE_LOCATION`，这意味着你可以告诉用户该权限的意思。在这种情况下，会出现一个简单的 `Toast`（这在下一个 `Toast`
    出现之前是没有意义的）。然后调用


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_1421.jpg)


    打开一个对话框，用户必须在其中接受或拒绝请求的权限。该对话框会回调 `onRequestPermissionsResult()`，在其中程序通过 `Toast`
    显示结果并初始化变量 `permission`。


    第二个按钮的事件处理器读取 GPS 坐标，前提是应用是被允许的。首先，测试是否已经启动了读取，如果是，则除了方法返回外什么都不会发生。否则，测试变量 `permission`，如果为
    `false`，则显示 `Toast`。否则，将变量 `watingps` 设置为 `true`，并使用 `locationManager` 对象发送读取坐标的请求。这与程序
    `TheLocation` 所示，并使用程序末尾创建的 `gpsListener` 对象。当坐标返回时，会在 `gpsListener` 对象上调用 `onLocationChanged()`
    方法，它会显示带有坐标的 `Toast` 并使用 `locationManager` 对象移除监听。


    ## 11.3 应用商店


    一旦应用完成并测试，通常应该将其放在像 *Google Play* 这样的应用商店中，供他人下载和应用。我不想在这里展示如何操作，因为这取决于当前的商店，但对于
    Google Play，我可以提到你需要一个 `Google Play Developer Account`，这需要支付一小笔初始费用，之后你就可以按照定义的程序上传应用。然而，以下内容是通用的，适用于任何需要上传到商店的应用。


