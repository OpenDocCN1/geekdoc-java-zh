    activity 的一个通知，告知其点击了哪一个项目（索引）。`SelectPersonListener` 是一个只定义了 `personSelected()`
    方法的接口。如果你现在运行程序（带有上述更改），窗口将打开并显示四个人人的列表。


    如果你点击（即手指触摸）某个人员，程序必须打开一个包含该人员数据的对话框，如果你选择程序主菜单中的 `Add` 菜单，也应该执行相同的操作。此时所有字段必须为空。对话框需要一个通常作为资源创建的布局，在这种情况下，必须有三个
    `TextView` 组件、三个 `EditText` 组件和三个 `Button` 组件。该布局占据了大量空间，我不想在这里显示 XML 代码，但它是 `layout`
    目录下一个名为 `dialog_person.xml` 的资源，它仅仅是使用 `LinearLayout` 布局部署的 9 个组件。作为回报，我将显示整个
    Java 代码：


    ![](img/Java_17_–_More_about_Java_and_Android_28-8-18_471.jpg)!(image/Java_17_–_More_about_Java_and_Android_28-8-18_48.jpg)!(image/Java_17_–_More_about_Java_and_Android_28-8-18_49.jpg)


    首先，注意该类继承了 `DialogFragment`。这意味着该类是一个 `Fragment`，并且是一个作为 `Dialog` 对象包装器的 fragment。`DialogFragment`
    拥有的样式如下：


    1. `STYLE_NORMAL`（默认）

    2. `STYLE_NO_TITLE`

    3. `STYLE_NO_FRAME`

    4. `STYLE_NO_INPUT`


    对话框由三部分组成：布局区域本身、标题和框架。第一个样式常量表示必须显示所有三个部分，第二个表示没有标题，第三个既没有标题也没有框架，最后一个既没有标题也没有框架，且对话框不接收输入事件。在这种情况下，样式为
    `STYLE_NORMAL`，你必须在 `onCreate()` 中通过 `setStyle()` 定义它。`setStyle()` 的最后一个参数是 0，表示
    Android 必须决定使用哪个主题，因此你可以设置自己的主题。当对话框打开并执行 `onCreate()` 时，会传输一个 `Person` 对象，你应该注意如何通过
    `getArguments()` 建立该对象的引用。


    然后是 `onCreateView()`，这次它相当详尽。首先，必须与三个按钮关联事件处理器。对于 `Cancel` 按钮，它是一个简单的处理器，除了关闭对话框外不应做其他事情。这通过
    `dismiss()` 方法实现。对于 OK 按钮，分配了一个 `OkHandler` 类型的处理器，即一个内部类。最后是 `Remove` 按钮，其处理器是作为匿名类的对象创建的。处理器测试该人员是否有姓氏（因此它不是新人员）。如果是这种情况，则确定
