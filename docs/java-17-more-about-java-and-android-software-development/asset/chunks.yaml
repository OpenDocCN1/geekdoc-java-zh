    If you click on the `CALL` button, the event handler `onCall()` is performed,
    and it is similar to the above, but the call itself takes place in a method `call()`.
    Here you should note that the method `startActivity()` only can be performed if
    the permission `CALL_PHONE` is specified in `AndroidManifest.xml`. Otherwise,
    you simply get a translation error. The method starts by testing how old the phone
    is and if the manifest has the required permission. If it is a newer phone, it
    means that the phone opens a dialog box where the user must give permission for
    the phone to make a call. If you do so, the event handler will perform `onRequestPermissionsResult()`,
    which then performs `call()` again, but this time, so that’s the `else` part of
    the `if` statement that is performed. The result is that a call is made.


    ## 3.1 Send a SMS


    ![](image/Image2014.jpg)


    Similar to the example above and how to make a phone call, I will in the following
    example show you how to send a SMS, and in principle it happens in the same way.
    The example is called `SendSMS`, and it opens the window above to enter the phone
    number and the message. I do not want to show the layout, but in the same way
    as for the use of the phone, the manifest must allow the application to send a
    SMS:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_63.jpg)


    Sending an SMS is quite simple and happens with the following method:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_64.jpg)


    and here the two variables `phone` and `message` must be initialized with the
    phone number and the message to be send, respectively. However, the conditions
    are a bit the same as for phone calls, although in `AndroidManifest.xml`, it has
    been stated that the application is allowed to send a SMS, it is not sure that
    the device allows it, but it opens a dialog box where the user explicitly accepts
    sending of the message. There must therefore be a little more code:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_641.jpg)


    that is a reminiscent of what you saw in the previous example. The code is not
    so easy to review, so it is recommended to study the documentation, but briefly
    the following happens. The method


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_65.jpg)


    tests whether the application in the manifest has specified the permission `SEND_SMS`,
    and if so the method


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_651.jpg)


    is performed and a dialog box should appear to send a SMS. If that is the case,
    Android opens a dialog box, and when the user here clicks accept (or the opposite)
    the event handler is performed:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_652.jpg)


    ## 4 Using the camera


    In this chapter I will show you how from a program can use the phone’s camera.
    I will only show how to take a picture and save it to a file in external storage.
    In fact, it’s quite simple, and when the code fills a lot, it’s because you can
    not immediately save the image in a file. I want to show an example called `TheCamera`,
    which opens the following window where a picture has been taken:


    ![](image/Image2022.jpg)


    When the picture is a little simple, it is because the picture is taken with the
    emulator. When the window opens, it only shows the button and clicking the button
    starts the phone’s camera and you can take a picture saved in a file named `image.jpg`.
    If you take more pictures, the previous one is overwritten. When you close the
    camera, the image is read from the file and displayed in the `ImageView` as shown
    above. The layout of the window is simple and defines only two components with
    `LinearLayout`:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_66.jpg)!(image/Java_17_–_More_about_Java_and_Android_28-8-18_67.jpg)


    Since the application should be able to write to external storage, you must define
    a permission in the manifest:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_671.jpg)


    Then there’s the Java code, which is harder to understand:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_672.jpg)!(image/Java_17_–_More_about_Java_and_Android_28-8-18_68.jpg)!(image/Java_17_–_More_about_Java_and_Android_28-8-18_69.jpg)!(image/Java_17_–_More_about_Java_and_Android_28-8-18_70.jpg)


    the hardest to figure out is `onCreate()`. The class first defines two constants
    that have no other meaning than to identify two actions (and the values are of
    importance). Next, variables are defined for the two components in the layout,
    and finally a `File` variable is defined. `onCreate()` starts with the two usual
    statements, and then there are the following statements:


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_701.jpg)


    They opens up to refer to a file outside of application’s storage. In fact, it’s
    a bit of a workaround, and the Android documentation recommends doing it in a
    different (and slightly more complex) way. As the next step, the variable `cmdCapture`
    is initialized, and here is the most important of course the association of the
    event handler. The handler must open the device’s camera (if there is a camera,
    the statements are located in a try catch block). This happens by creating an
    `Intent` object, as with the constant


    ![](image/Java_17_–_More_about_Java_and_Android_28-8-18_702.jpg)


    refers to the phone’s camera. To tell where the image is to be saved, the variable
    `file` is sent as a parameter, and finally the camera is opened with the method
    `startActivityForResult()`. This means that when the camera closes (the activity
    that displays the camera), the method `onActivityResult()` is called and whose
    `requestCode` shows that the method is called because it is the camera that closes,
    and then the image is read from the file and displayed in the layout’s `ImageView`.


    After the variable `cmdCapture` is initialized in `onCreate()`, it is necessary
    to test whether the application has write access to external storage and if not
    assign this access. It happens the same way I’ve shown earlier, and if it’s a
    newer device, a dialog box opens, allowing the user to use external storage. Here
    is `onRequestPermissionsResult()` a method called as the result of the user’s
    choice in the dialog, so you can see if you get the permission you want.


    ## 5 Locations


    An important use of phones is to decide where you are and thus the geographical
    location and possibly display this location on a map. A phone is provided by the
    producer with programs that can do that, but it may also be of interest for the
    programmer, either to determine the location in their own apps and to display
    a map, where a given location is shown. Both parts are actually quite easy, at
    least if you use a special API provided by Google (`Google Play Services`). However,
    this API is not part of the Android SDK, so you need to download the API and refer
    to it in the current project. It’s also simple enough, as long as you want to
    decide on your location, but if you also want to use Google Maps, you need a little
    more because you must be registered and have a key from their `Google Account`,
    and you can not freely quote its applications as there is license conditions for
    Google Maps. It should be added that other maps than Google’s are available, but
    here are similar other challenges. Therefore, I would just like to show you how
    to determine the location without using Google Play Services, and for developing
    your own applications it may also be what you typically need.


    You can determine your location from three different location providers:


    1. `GPS_PROVIDER`, which is the provider that delivers the most accurate result
    and uses the device’s built-in GPS receiver.

    2. `NETWORK_PROVIDER`, which determines the location using data collected from
    the phone network or WiFi access points. This provider is not as accurate as the
    previous one, but for most applications exactly enough.

