  ...\npublic HelloWorld() { \n    print(\"Hello, earthling.\"); \n    print(_____);\
  \ \n    print(\"Take me to your leader.\");  \n}\n...\n```\n\n### 关键点与其他\n\n* Java\
  \ 程序由类组成。每个程序都需要在其中一个类中有一个 `main()` 方法。\n* `main()` 方法必须写成 `public static void main(String[]\
  \ args)`。随后的课程将解释所有单词的含义。\n* 多个类通常被组合使用以创建一个程序。\n* 然而，本书中的大多数程序将只由一个类组成。\n* 每个类都必须有一个父类。任何类都可以作为父类。你将在稍后的课程中创建你自己的父类。\n\
  * 具有相同父类的类被认为是同一种类型。例如，你为书中每个程序创建的主类都将使用 `DIYWindow` 类作为其父类。因此，书中每个程序都是 `DIYWindow`\
  \ 的类型。\n\n\n\n\n在现实世界中，你会遇到如人类、狗、汽车和猫等对象。这些对象拥有状态和行为。例如，当你想到一只猫时，它的状态可能包括它的品种、颜色或名字。它的行为可能包括跑步、跳跃或摇摇尾巴。\n\
  \n软件对象在这些特征上与现实对象相似。它的状态存储在字段（fields）中，而它的行为通过方法（methods）表现。\n\n在开发过程中，方法是在对象的内部状态上执行的，并且方法有助于对象之间的通信。\n\
  \n## 类 (Classes)\n\n![](img/image.020.jpeg)\n类用于定义对象的规范。这些规范作为创建对象的蓝图。虽然在创建类时它们不会立即应用，但当类的对象被实例化时，这些定义是可用的。一个对象或类在程序中可以有多个副本或实例。\n\
  \n以下是一个名为 `Cat` 的类的定义示例：\n\n一个类可以包含以下类型的变量：\n\n### 类变量\n类变量是在类内部使用 `static` 修饰符声明且在任何方法之外声明的变量。\n\
  \n### 局部变量\n局部变量是定义在方法、块或构造函数内部的变量。这些变量在方法内部声明并实例化，一旦方法执行完毕就会被销毁。\n\n### 实例变量\n\
  实例变量是位于类内部但在方法之外的变量。它们在类创建的同时进行初始化。可以从该特定类的方法、块或构造函数访问。\n\n一个类可以包含任意数量的方法获取所需的值。例如，`Cat`\
  \ 类有三个方法：`running()`、`sleeping()` 和 `jumping()`。\n\n### 构造函数 (Constructors)\n构造函数是一种用于初始化对象的方法。一个类必须包含至少一个构造函数。\n\
  \n以下是构造函数的重要规则：\n- 构造函数的名称应与类名匹配。\n- 它不有显式的返回类型。\n\n### 构造函数的类型\n- 默认构造函数或无参构造函数\n\
  - 参数构造函数\n- 默认构造函数\n\n没有参数的构造函数称为默认构造函数。\n\n![](img/image.021.jpeg)\n这是语法：\n\n###\
  \ 参数构造函数\n参数构造函数是带有参数的构造函数。它被用于为特定对象提供值。\n\n下面的示例展示了两种构造函数。第一个是默认构造函数，它没有任何参数。第二个构造函数有一个参数\
  \ `name`。\n\n![](img/image.022.jpeg)\n\n### 创建对象 (Creating Objects)\n类提供了对象的模板。对象基本上是从类创建的。要创建新对象，你将使用\
  \ `new` 关键字。\n\n从类创建新对象需要采取以下步骤：\n1. **声明 (Declaration)**：指的是变量声明，你在其中编写变量名及其对象类型。\n\
  2. **实例化 (Instantiation)**：为了创建一个新对象，你将使用 `new` 关键字。\n3. **初始化 (Initialization)**：`new`\
  \ 关键字之后调用构造函数并初始化新对象。\n\n![](img/image.023.jpeg)\n下面的示例展示了从类创建新对象的不同步骤：\n\n以下是输出：\n\
  Passed Name is: spotty\n\n### 如何访问方法和实例变量\n创建的对象用于访问方法和实例变量。访问实例变量，你将使用这些步骤：\n1.\
  \ 首先，你必须创建一个对象：`ObjectName = New Constructor();`。\n2. 接下来，调用变量：`ObjectName.variableName;`。\n\
  3. 调用类方法：`ObjectName.MethodName();`。\n\n### Java 包 (Package)\n包仅仅是接口和类分组的一种方式。Java\
  \ 包作为类的容器。分组的通常依据是功能。包的使用有助于代码的可重用。当接口和类分类到包中时，你可以轻松地访问它们并在其他程序中使用。使用包还有助于防止类和接口之间的命名冲突。\n\
  \n要创建一个包，请在包名之前使用 `package` 语句作为第一条语句。\n\n![](img/image.024.jpeg)\n这是一个示例：\n\n###\
  \ 导入语句 (Import Statement)\n你可能使用 `import` 关键字将包导入到你的源文件中。导入语句使编译器能够轻松找到类或源代码的位置。\n\
  \n你可能只想从包中导入某一个类。你可以使用点运算符 `.` 来指示包和类。例如：\n![](img/image.025.jpeg)\n要从一个包中导入所有类，你可以在点运算符之后使用通配符\
  \ `*`。例如：\n![](img/image.026.jpeg)\n\n### 修饰符 (Modifiers)\n修饰符是改变你代码中定义含义的关键字。Java\
  \ 提供了多种修饰符。\n\n### 访问修饰符 (Access Modifiers)\n访问修饰符用于定义方法、变量、类和构造函数的访问级别。\n\n- **Private**：仅在类内部可见。当方法、变量、类或构造函数被声明为\
  \ `private` 时，意味着它仅在类内部可用。然而，如果该类有公共的 getter 方法，你可能可以在类外部访问私有变量。`private` 关键字表示最高的访问限制。注意，你不能将接口和类声明为\
  \ `private`。\n- **Public**：对世界上可见。被定义为 `public` 的方法、接口、构造函数、类等可以从其他类访问。同样，定义在 `public`\
  \ 类内部的块、方法或字段可以从 Java 类中访问。只要它们在同一个包中，这一点就是成立的。如果你想从另一个包访问公共类，你将必须导入该公共类。\n- **Protected**：对子类和包可见。将方法、变量或构造函数声明为\
  \ `protected` 会使得它仅对所在包内的类或另一个包中的子类可见。这种访问类型用于允许子类使用，并防止无关类使用它们。接口及其字段和方法不应声明为 `protected`，但接口外的字段和方法可以声明为\
  \ `protected`。\n- **Default**（默认）：当未提供修饰符时适用——对包可见。未声明修饰符的方法或变量可以被包内的其他类访问。\n\n\
  下表总结了不同的访问修饰符及其影响：\n\n| 修饰符 | 类内 | 包内 | 包外类 | 包外 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| Private | Y | N | N | N |\n| Public | Y | Y | Y | Y |\n| Protected\
  \ | Y | Y | Y | N |\n| Default | Y | Y | N | N |\n\n### 非访问修饰符 (Non-access Modifiers)\n\
  非访问修饰符可用于访问 Java 中的各种功能。\n\n- **Final**：用于固定变量、方法和类的实现。\n    - **Final 变量**：你只能显式地初始化一次\
  \ final 变量。当你声明变量为 `final` 时，你将永远无法重新赋值为另一个对象。请注意，你仍然可以更改存储在对象内部的数据。这意味着虽然你可以更改对象的状态，但无法更改引用。`final`\
  \ 修饰符通常与 `static` 配合使用，以根据常量值创建类变量。\n    - **Final 方法**：`final` 关键字用于防止子类更改方法。\n\
  \    - **Final 类**：防止类被子类化。\n\n\n\n\n\n`final` 修饰符用于防止其他类继承被声明为 `final` 类的任何特性。\n\
  \n### Static（静态）\n用于创建类方法或变量。\n\n你可以使用此关键字来创建一个唯一的变量（称为 `static variable` 或 `class\
  \ variable`），该变量将独立于该类的其他实例而存在。你不能将局部变量声明为 `static`。\n\n你还可以使用 `static` 关键字来创建一个方法（称为\
  \ `static method` 或 `class method`），该方法将独立于该类的其他实例而存在。`Static` 方法只识别并处理来自所给参数的数据，而不考虑变量。\n\
  \n你可以通过在类名后写一个点（`.`）和变量名或方法名来访问类方法和类变量。\n\n### Abstract（抽象）\n用于创建抽象方法或抽象类。\n\n####\
  \ 抽象类（Abstract class）\n当一个类被声明为 `abstract` 时，意味着你永远无法实例化该类。将一个类声明为 `abstract` 的唯一理由是为了扩展该类。你不能将一个类同时声明为\
  \ `final` 和 `abstract`，因为你就不可能扩展一个 `final` 类。使用了 `abstract` 方法的类必须声明为 `abstract`。不这样做会导致编译错误。\n\
  \n#### 抽象方法（Abstract method）\n由于它在声明时没有实现，`abstract method` 的方法体派生自子类。`Abstract`\
  \ 方法不能声明为严格的或 `final`。除非它本身也是一个 `abstract class`，否则扩展 `abstract class` 的类必须采用父类的\
  \ `abstract methods`。包含至少一个 `abstract method` 的类应该声明为 `abstract class`。另一方面，`abstract\
  \ class` 并不一定要有 `abstract` 方法。示例：\n\n![](img/image.027.jpeg)\n\n### Synchronized（同步）\n\
  `synchronized` 修饰符用于表示在任何给定时间内只有一个线程可以访问该方法。你可以将此关键字与任何访问级别修饰符一起。示例：\n\n![](img/image.028.jpeg)\n\
  \n### Volatile（易变的）\n此关键字用于表示访问 `volatile variable` 的线程应该将其私有副本与存储在内存中的主副本进行合并。实际上，它将变量的所有缓存副本与主内存同步。你只能使用此修饰符来定义\
  \ `private` 或 `object` 类型的实例变量。示例：\n\n![](img/image.029.jpeg)\n\n### Transient（瞬态的）\n\
  `transient` 关键字用于告诉编译器在序列化包含标记变量的对象时跳过该实例变量。示例：\n\n![](img/image.030.jpeg)\n\n##\
  \ 第 8 章：决策与循环控制\n\n![C:\\Users\\Talha\\Downloads\\pexels-jorge-jesus-614117 (1).jpg](img/image.031.jpeg)\n\
  \n决策结构用于此类情况：如果条件为真，则必须执行一组指令；当条件被判定为假时，必须执行另一组指令。Java 中提供了几种结构来用于编程此类场景。这些结构包括––\n\
  \n### If 语句（If statement）\n该语句用于需要测试条件的情况，如果发现条件为真，则需要执行紧随在该语句的代码块。该构造的语法为––\n\n\
  ```java\nif(condition){\n    /*Body*/\n}\n```\n\n该构造的示例实现如下––\n```java\npublic class\
  \ ifDemo { \n    public static void main(String args[]) { \n        int i = 10;\
  \ \n        int j = 1; \n        if(i>j){\n            System.out.print(i);    \
  \      \n        }        \n    }\n}\n```\n\n#### If else 语句（If else statement）\n\
  该语句用于需要测试条件的情况，如果发现条件为真，则执行紧随在该语句的代码块，否则执行 `else` 语句后的代码块。该构造的语法为––\n\n```java\n\
  if(condition){\n    /*Body*/\n}\nelse{\n    /*Body*/\n}\n```\n\n该构造的示例实现如下––\n```java\n\
  public class ifElseDemo { \n    public static void main(String args[]) { \n    \
  \    int i = 1; \n        int j = 0; \n        if(i>j){\n            System.out.print(i);\
  \          \n        } else{        \n            System.out.print(j);         \
  \ \n        }\n    }\n}\n```\n\n#### 嵌套 if 语句（Nested if statement）\n该语句用于需要测试条件的情况，如果发现条件为真，则执行紧随在该语句的代码块，否则测试下一个条件。如果发现此条件为真，则执行与该条件的\
  \ `if` 语句对应的代码块。如果没有任何条件被发现为真，则执行 `else` 语句后的代码块。可以使用嵌套的 `if` 语句测试多个条件。该构造的语法为––\n\
  \n```java\nif(condition1) {\n    /*Body*/\n} else if (condition2) {\n    /*Body*/\n\
  } else {\n    /*Body*/\n}\n```\n\n该构造的示例实现如下––\n```java\npublic class nestedIfDemo\
  \ { \n    public static void main(String args[]) { \n        int i = 0; \n     \
  \   int j = 0; \n        if(i>j){\n            System.out.print(i);          \n\
  \        } else if(j>i) {      \n            System.out.print(j);          \n  \
  \      } else {\n            System.out.print(\"Equal\");          \n        }\n\
  \    }\n}\n\n\n#### Switch\n当你有一个变量并且需要根据该变量的不同值执行不同的代码块时，使用的理想构造是 `switch` 语句。该构造的语法为––\n\
  \n```java\nswitch(variable){\n    case value1: /*body*/ break;\n    case value2:\
  \ /*body*/ break;\n    case value3: /*body*/ break;\n    default: /*body*/ break;\n\
  }\n```\n\n该构造的示例实现如下––\n```java\npublic class switchDemo { \n    public static void\
  \ main(String args[]) { \n        int i = 5;\n        switch (i) { \n          \
  \  case 0: System.out.print(0); break;\n            case 2: System.out.print(2);\
  \ break;\n            case 5: System.out.print(5); break;\n            default:\
  \ System.out.print(999); break;\n        }\n    }\n}\n```\n\n#### 条件运算符（Conditional\
  \ Operator）\nJava 还支持条件运算符，称为 `?:` 运算符。该运算符用于替换 `if else` 构造。它的语法如下\n\n```\nExpression1?Expression2:Expression3\n\
  ```\n\n在这里，`Expression1` 是需要测试的条件。如果条件为真，执行 `Expression2`，否则执行 `Expression3`。\n\n\
  ### 循环控制（Loop Control）\n在某些情况下，你需要迭代执行相同的指令。例如，如果你需要对一组数字排序，你需要多次扫描并重新排列这组数字。这种执行流被称为循环控制。\n\
  \n简单来说，循环是一种允许多次执行代码块的构造。Java 支持多种用于循环的构造。这些包括 `while loop`、`for loop` 和 `do while\
  \ loop`。\n\n`while loop` 迭代执行代码块，直到 `while loop` 指定条件为真。一旦该条件失败，`while loop` 停止。\n\
  \n`for loop` 允许程序员在同一个构造中操作条件和循环变量。因此，你可以初始化循环变量、对其进行增减并运行循环直到该条件为真。\n\n`do while\
  \ loop` 与 `while loop` 相似。但在 `while loop` 中是在执行代码块之前检查条件。而在 `do while loop` 中，先执行代码块，然后检查条件。如果满足条件，则重新启动循环执行，否则终止循环。\n\
  \n#### 循环语句（Loop statements）\n有两个关键字专门用于循环，并被称为控制语句，因为它们允许控制流从代码的一部分转移到另一个部分。\n\n\
  #### Break\n`break` 关键字用于循环内部，此时你希望执行流终止循环并直接从循环后的第一条指令开始执行。\n\n#### Continue\n\
  `continue` 关键字用于循环内部，此时程序员希望跳过循环的剩余部分并将控制转移到循环的第一条语句。\n\n\n\n\n为了帮助你理解循环是如何执行的，让我们来看一个示例，并使用三种循环控制类型来实现它。\n\
  \n### For 循环实现\n\n```java\npublic class forDemo { \n    public static void main(String\
  \ args[]) { \n        int [] numberArray = {100, 300, 500, 700, 900}; \n       \
  \ for(int i=0; i<5; i++) {            \n            System.out.print(numberArray[i]);\
  \          \n            System.out.print(\",\");        \n        }      \n   \
  \     System.out.print(\"\\n\");        \n    }\n}\n```\n\n### While 循环实现\n\n```java\n\
  public class whileDemo { \n    public static void main(String args[]) { \n     \
  \   int [] numberArray = {100, 300, 500, 700, 900}; \n        int i = 0; \n    \
  \    while(i<5) {            \n            System.out.print(numberArray[i]); \n\
  \            System.out.print(\",\"); \n            i++; \n        }      \n   \
  \     System.out.print(\"\\n\");        \n    }\n}\n```\n\n### Do While 循环实现\n\n\
  ```java\npublic class doWhileDemo { \n    public static void main(String args[])\
  \ { \n        int [] numberArray = {100, 300, 500, 700, 900}; \n        int i =\
  \ 0; \n        do {            \n            System.out.print(numberArray[i]); \n\
  \            System.out.print(\",\");\n            i++;      \n        } while (i<5);\n\
  \        System.out.print(\"\\n\");        \n    }\n}\n```\n\n### 增强型 For 循环\n\n\
  Java 还支持一种增强型循环结构，它可以用于数组元素。该循环构造的语法如下：\n\n```java\nfor(declaration : expression)\
  \ { /*Body*/ }\n```\n\n增强型 `for` 循环的声明部分用于声明变量。该变量应该是 `for loop` 局作用的，并且其类型必须与数组元素的类型相同。变量的当前值始终等于循环中正在遍历的数组元素。表达式是一个数组或返回数组的方法调用。\n\
  \n下面是增强型 for 循环的示例实现：\n\n```java\npublic class forArrayDemo { \n    public static\
  \ void main(String args[]) { \n        int [] numberArray = {100, 300, 500, 700,\
  \ 900}; \n        for(int i : numberArray ) {            \n            System.out.print(\
  \ i );          \n            System.out.print(\",\");      \n        }      \n\
  \        System.out.print(\"\\n\");        \n    }\n}\n```\n\n### 异常层次结构\n\nJava\
  \ 内置了一个名为 `java.lang.Exception` 的类，所有异常都属于这个类。所有的异常类都是该类的子类。此外，`Throwable` 类是异常类的父类。`Throwable`\
  \ 类的另一个子类是 `Error` 类。所有如上面描述的栈溢出（stack overflow）错误都属于这个 `Error` 类。\n\n`Exception`\
  \ 类有两个子类，即 `RuntimeException` 类和 `IOException` 类。作为 `Throwable` 类的一部分，Java 中提供的可用定义的方法列表如下：\n\
  \n```java\npublic String getMessage()\n```\n调用时，此消息将返回所遇异常的详细描述。\n\n```java\npublic\
  \ Throwable getCause()\n```\n此方法在调用时会返回一个包含异常原因的消息。\n\n```java\npublic String toString()\n\
  ```\n此方法返回异常的详细描述与类名拼接后的结果。\n\n```java\npublic void printStackTrace()\n```\n通过调用此方法，可以将\
  \ `toString()` 的结果以及栈跟踪（stack trace）打印到标准错误流 `System.err` 中。\n\n```java\npublic\
  \ StackTraceElement [] getStackTrace()\n```\n在某些情况下，你可能需要访问栈跟踪的不同元素。此方法返回一个数组，栈跟踪的每个元素都保存在到数组的不同元素中。数组的第一个元素包含栈跟踪的顶部元素，而栈跟踪的底部被保存到数组的最后一个元素中。\n\
  \n```java\npublic Throwable fillInStackTrace()\n```\n将栈跟踪中的之前信息与当前栈跟踪的内容合并，并返回相同的数组格式。\n\
  \n### 捕获异常\n\n捕获异常的标准方法是使用 `try` 和 `catch` 关键字以及它们的代码实现。此 `try` 和 `catch` 块需要以这种方式实现，以包含可能会抛出异常的代码。这里还需要说明的是，可能会抛出异常的代码被称为受保护代码（protected\
  \ code）。`try` 和 `catch` 块实现的语法如下：\n\n```java\ntry { /*Protected code*/ } catch(ExceptionName\
  \ exc1) { /*Catch code*/ }\n```\n\n可能会抛出异常的代码放置在 `try` 块中。如果抛出了异常，则为异常处理要执行的相应操作将在\
  \ `catch` 块中实现。每个 `try` 块必须要么有一个 `catch` 块，要么有一个 `final` 块。\n\n作为 `catch` 语句的一部分，需要声明预期抛出的异常。一旦发生异常，执行流将转移到\
  \ `catch` 块。如果抛出的异常与 `catch` 块中定义的异常匹配，则执行 `catch` 块。\n\n下面是 `try` 和 `catch` 块的示例实现。该代码实现了一个包含\
  \ 2 个元素的数组。然而，代码尝试访问一个不存在的元素。\n\n```java\nimport java.io.*; \n\npublic class demoException\
  \ { \n    public static void main(String args[]) { \n        try {            \n\
  \            int arr[] = new int[2];          \n            System.out.println(\"\
  Accesing 3rd element of the array:\" + arr[3]);\n        } catch(ArrayIndexOutOfBoundsException\
  \ exp) {\n            System.out.println(\"Catching Exception:\" + exp);\n     \
  \   }\n        System.out.println(\"Reached outside catch block\");\n    }\n}\n\
  ```\n\n### Catch 块\n\n代码可能会导致多个异常。为了应对这种情况，允许实现多个 `catch` 块。语法如下：\n\n```java\ntry\
  \ { /*Protected code*/ } catch(ExceptionType1 exp1) { /*Catch block 1*/ } \ncatch(ExceptionType2\
  \ exp2) { /*Catch block 2*/ } \ncatch(ExceptionType3 exp3) { /*Catch block 3*/ }\n\
  ```\n\n上面的语法说明了三个 catch 块的实现。然而，你可以实现任意数量的 catch 块。\n\n### ADT、数据结构与 Java 集合\n\n\
  抽象数据类型（ADT）是对数据的逻辑描述以及在数据上允许的操作。ADT 是从用户角度定义的。ADT 关注的是数据的可能值及其暴露的接口。ADT 不关心数据结构的具体实现。\n\
  \n例如，用户想要存储一些整数并计算它们的平均值。该数据结构的 ADT 将支持两个函数：一个用于添加整数，另一个用于获取平均值。\n\n数据结构是数据的具体表示，是从程序员角度定义的。数据结构代表了数据在内存中的存储方式。所有数据结构都有自己的优缺点。根据问题的类型，我们选择最合适的数据结构。\n\
  \n注意：在本章中，我们将学习各种数据结构及其 API。这样用户就可以在不了解内部实现的情况下使用它们。\n\nJava Collection Framework\n\
  \nJava 语言提供了一个 Java 集合框架，这是一套高质量、高性能且可重用的数据结构和算法。\n\n使用 Java 集合框架的优势如下：\n\n\n\n\
  1. 程序员不需要重复实现基础的数据结构和算法。这避免了重复造轮子。因此，程序员可以投入更多精力在业务逻辑上。\n2. `JAVA Collection Framework`\
  \ 代码是经过良好测试的、高质量、高性能的代码。使用它们可以提高程序的质量。\n3. 由于 `Collections` 框架中实现的基础数据结构和算法可以被复用，开发成本得以降低。\n\
  4. 其它开发者编写的程序易于审查和理解，因为大多数 Java 开发者都使用 `Collection` 框架。此外，集合框架有完善文档。\n\n## 数组 (Array)\n\
  \n`Array` 表示一组相同数据类型的多个元素的集合。\n\n### 数组 ADT 操作\n\n以下是数组的 API：\n\n1. 在 `kth` 位置添加一个元素。值可以在\
  \ `O(1)` 常数时间内存储在数组的 `Kth` 位置。我们只需要在 `arr[k]` 存储该值即可。\n2. 读取存储在 `kth` 位置的值。访问数组中某个索引处存储的值也是\
  \ `O(1)` 常数时间。我们只需要读取存储在 `arr[k]` 的值即可。\n3. 用新值替换存储在 `kth` 位置的值。时间复杂度：`O(1)` 常数时间。\n\
  \n### 示例：\n\n```java\npublic class ArrayDemo { \n    public static void main(String[]\
  \ args) { \n        int[] arr = new int[10]; \n        for (int i = 0; i < 10; i++)\
  \ {\n            arr[i] = i;\n        }\n    }\n}\n```\n\n`JAVA` 标准数组是固定长度的。有时我们不知道需要多少内存，所以会创建一个更大的数组，从而浪费空间。如果数组已经满满，且我们想要添加的值比剩余容量还多，就需要创建一个足够空间的新数组，然后将旧数组复制到新数组中。为了避免这种手动的重新分配和复制，我们可以使用\
  \ `JAVA Collection` 框架中的 `ArrayList` 或 `Linked Lists`（链表）来存储数据。\n\n### JAVA Collections\
  \ 中的 ArrayList 实现\n\n`JAVA Collections` 中的 `ArrayList<E>` 是一种实现了 `List<E>` 接口的数据结构，这意味着它可以包含重复元素。`ArrayList`\
  \ 是作为动态数组的实现，可以根据需要增长或缩小。（当数组满时，内部使用数组并分配更大的数组，并将旧数组的值复制到其中）。\n\n### 示例：\n\n```java\n\
  import java.util.ArrayList; \npublic class ArrayListDemo {\n    public static void\
  \ main(String[] args) {\n        ArrayList<Integer> al = new ArrayList<Integer>();\n\
  \        al.add(1); // 将 1 添加到列表末尾\n        al.add(2); // 将 2 添加到列表末尾\n        System.out.println(\"\
  Contents of Array: \" + al);      \n        System.out.println(\"Array Size: \"\
  \ + al.size()); \n        System.out.println(\"Array IsEmpty: \" + al.isEmpty());\
  \ \n        al.remove(al.size() - 1); // 移除数组的最后一个元素。\n        al.removeAll(al);\
  \ // 移除数组的所有元素\n        System.out.println(\"Array IsEmpty: \" + al.isEmpty());\n\
  \    }\n}\n```\n\n### 输出：\n\n```\nContents of Array: [1, 2]\nArray Size: 2\nArray\
  \ IsEmpty: false\nArray IsEmpty: true\n```\n\n![](img/image.035.jpeg)\n\n## 链表 (Linked\
