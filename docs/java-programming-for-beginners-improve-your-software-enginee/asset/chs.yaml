- "# Java 编程初学者指南：通过面向对象编程学习来提升软件工程技能。学习虚拟机、Javascript 和机器码 (2022)\n\n\n\n\n通过学习面向对象的程序编程来提高你的软件工程技能。学习虚拟机、Javascript\
  \ 和机器码（2022）\n\n\n\n## 引言\n\n![](img/image.001.png)\n\nJava 是一种在互联网和计算机应用程序中广泛使用的编程语言。它是一个免费下载选项，允许用户获取最新版本并应用更新。这种编程语言可以在当今绝大多数\
  \ Web 应用和计算技术中找到。Java 的扩展性使其适用于各种应用程序，包括手机等小型电子设备的应用程序，以及用于数据中心等大规模运营的软件解决方案。Java\
  \ 日益增长的普及归功于其强大的功能能力和可靠的安全保障。\n\nJava 是由太阳微系统公司（Sun Microsystems）开发的编程语言，后来被甲骨文公司（Oracle\
  \ Corporation）收购。它旨在运行在任何支持 Java 的操作系统上。这正是该语言如此受欢迎的原因：开发者只需要编写一次程序，它就可以在任何操作系统上运行，而无需程序员更改代码。\n\
  \nJava 编程语言用于创建世界上大部分的应用程序。Java 编程语言用于构建大多数应用程序的服务器端和业务逻辑组件。\n\n在本书中，你将学习如何构建像上面那样的程序，以及将让你开始编写完整应用程序的高级概念。\n\
  \nJava 的一些设计目标列如下：\n\n- 该语言的设计目标是只编写一次并在任何操作系统上运行。\n- 该语言应该支持广泛的软件工程原则。产品的可移植性至关重要。这就是为什么\
  \ Java 可以在 Windows、Linux 和 MacOS 操作系统上运行。\n- 国际化需要大量的支持。\n\nJava 设计用于开发既适用于托管系统和嵌入式系统的程序。\n\
  \n接下来将讨论其他设计目标：\n\n### 强类型检查\n\nJava 是一种强类型语言。定义的每个变量都需要关联到一个数据类型。\n\n你现在不需要理解整个程序，但让我们快速看下\
  \ 2 行代码。\n\n```java\nint i=5;\n```\n\n在这里，我们定义了一个被称为变量的东西，它用于存储值。可以存储的值取决于数据类型。在这个例中，我们说\
  \ `i` 的类型是 `int` 或 `Integer`，这是一个数值型数据值。\n\n### 数组边界检查\n\n在运行时，Java 将检查数组是否定义了所需数量的值。如果尝试访问数组边界之外的值，将抛出异常。\n\
  \n你现在不需要理解整个程序，但让我们快速看下以下行代码。\n\n```java\nint[] array1 = new int[2];\n```\n\n在这里，我们声明了一个数组，它是一组整数值。`2`\
  \ 这个值意味着我们只能在数组中存储两个值。\n\n```java\narray1[0] = 1; array1[1] = 2; array1[2] = 3;\n\
  ```\n\n通过这段代码，我们可以看到正在给数组赋值 3 个值。当你运行这个程序时，你将得到一个错误，因为程序会发现数组已经超出了它允许的最大边界（两个）。你将在运行时得到下面的错误。\n\
  \n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 2\
  \ at HelloWorld.main(HelloWorld.java:8)\n```\n\n### 为什么 Java 很重要？\n\n接下来，Java 的语法和特征类似于\
  \ C 和 C++ 等其他编程语言。如果你有任何之前的编程经验，你会发现学习 Java 是轻而易举。即使你对编程完全陌生，你也可以放心，Java 被设计成一门相对容易学习的语言。大多数程序员发现学习\
  \ Java 比学习 C 或 C++ 更容易。\n\nJava 还被设计为与平台无关。正如前面提到的，Java 代码首先被编译成字节码，可以在任何具有 Java\
  \ 虚拟机（JVM）的机器上运行。\n\n因此，通过 Java，你可以编写一次代码并在任何你想的地方运行它。\n\n### 为什么选择 Java？\n\n当然，使用\
  \ Java 的关键原因之一是它对面向对象编程的关注。\n\n面向对象编程（或“OOP”）是一种编程语言模型，它允许程序代码围绕数据组织，而不是围绕函数和逻辑（后者被称为过程化编程）。\n\
  \n这些“数据簇”被组织成被称为“对象”的东西，因此有了“面向对象编程”的别名。\n\n这些“对象”是通过“类”创建的，这里的“类”是指类是某种对象，允许程序员根据两个标准对它们进行“分类”：属性和方法。\n\
  \n类的属性是用于创建对象的原始数据：这些是它的描述符，例如它所拥有的值以及其他相关数据。对象的“方法”是第二个要求。\n\n这种“方法”是行为，即类内部描述如何交互或被交互的逻辑序列。\n\
  \n### Java\n\n使用 Java 的主要原因之一是它对面向对象编程的强调。面向对象编程，也称为“OOP”，是一种编程语言模型，允许程序代码围绕数据组织，而不是围绕函数和逻辑（如过程化编程）。\n\
  \n这些“对象”是由“类”形成的，这里的“类”是指类是某种对象的类型，允许程序员根据两个标准对它们进行“分类”：属性和方法。\n\n类的属性是用于创建对象的原始数据：这些是它的描述符，例如它所拥有的值以及其他用于创建对象的相关数据。对象的“方法”是第二个要求。\n\
  \n这种“方法”是行为，即类内部描述如何交互或被交互的逻辑序列。\n\n## 第 1 章\n\n### Java 基础\n\n![](img/image.002.png)\n\
  \n采用 Java 的主要原因之一是它对面向对象编程的关注。面向对象编程，也称为“OOP”，是一种编程语言模型，允许程序代码围绕数据组织，而不是围绕函数和逻辑（如过程化编程）。\n\
  \n这些“对象”是通过“类”形成的，这里的“类”是指类是某种对象的类型，允许程序员根据两个标准对它们进行“分类”：属性和方法。\n\n类的属性是用于创建对象的原始数据：这些是它的描述符，例如它所拥有的值以及其他用于创建对象的相关数据。对象的“方法”是第二个要求。\n\
  \n为了说明，假设有一个类叫做 `Human`。这个“类”将包括身高、体重、性别和种族特征。“人类”类的方法还可以包括 `run`、`walk` 和 `speak`。\n\
  \n现在类已经定义，程序员可以使用 `human` 类作为蓝图来生成对象。\n\n他们可以使用 `Human` 类来“填充”它的属性，例如身高、体重、性别和种族。此外，该对象已经内置了函数\
  \ `run`、`walk` 和 `talk`，所以当从 `Human` 类中创建一个名为 `Mike` 的对象时，它已经包含了跑步、行走和说话的功能，而无需程序员再次编写这些特定的函数，因为它们已经“固有”于所创建的对象中。\n\
  \n简而言之，这就是面向对象编程旨在达的：一种编程风格，允许程序员利用预定义的类，以便描述它们并利用其内部或内置函数来操作它们。\n\n\n\n\n假设读者并不是编程领域完全的新手，并且已经通过\
  \ `C` 或或其他侧重过程的语言接触过编程世界，那么下一个自然的问题是：为什么要使用面向对象编程呢？\n\n它的主要优点之一是从长远来看它可以节省时间。\n\n\
  在简单的算法和程序中，过程化编程通常要快得多且直接；程序员不需要构造和定义一个 `class`，然后基于该类创建一个对象，他们真正需要做的只是声明必要的变量、编写函数并创建算法来解决代码应该处理的问题。\n\
  \n然而，当涉及到需要更复杂解决方案的复杂应用程序时，面向对象编程就开始大放异彩并展现它的实力。\n\n在许多程序中会出现这种情况：必须将许多“对象”或数据簇分组在一起，并以特定的方式处理这些对象。这正是“类”应该有所帮助的地方。\n\
  \n程序员不需要为每个数据簇声明一组新变量，只需简单地从现有的“类”中提取并产生一个新的“对象”。让我们来看看这在实践中是如何运作的。\n\n如果程序员用过程化的方式编写一个象棋游戏，他们必须手动描述每一个部分——所有的十六个兵、四个主教、四个骑士、四个车、两个皇后和两个王。他们还必须编写允许每个棋子独立移动的程序。\n\
  \n如果程序员使用面向对象编程，而不需要编写 16 个兵、四个主教、四个骑士、四个车、两个皇后和两个王，他们只需要编写六个类：棋盘上的每个棋子一个类。\n\n\
  程序员现在只需将移动程序包含在每个类中，并让属性来解释它们的位置：它们是白王的兵还是黑后的兵，这些都可以通过“兵”类的“属性”组件输入的内容。程序员不需要处理\
  \ 32 个代码簇，只需要处理 6 个即可。\n\n现在这变得容易得多、更短，也更优雅。\n\n### Java 标记 (tokens)\n\nJava 标记（tokens）是比其他整数更小的值。这些数字将落在\
  \ `-32768` 和 `32767` 之间。\n\n我使用的代码将适用于 `shorts`，相反，我将需要使用 `short` 函数，以确保值落在设定的限制范围内。\n\
  \n大值将存储在 `double` 值中，连同浮点数。如果我可以使用浮点数，就不必使用 `double`。由于我正在存储一个浮点变量，我需要在我的数值末尾加上一个字母。这个值应该是\
  \ `f`，因为它是一个浮点数。\n\n### 关键字 (Keywords)\n\n在 Java 中，`Boolean` 类型指的是 `false` 或 `true`\
  \ 值。Java 使用预留关键字来判断它是真是假。因此，一个 `Boolean` 表达式类型将假设为这些值之一。\n\n一个演示示例包括：\n\n关于这个程序有几点需要注意。首先，`println()`\
  \ 显示一个布尔值。其次，布尔值控制 `if` 语句的流。\n\n在编写布尔类型时，不需要写得那么麻烦：`if (b == true)`\n\n运算符（如 `<`）显示的结果是布尔值。这是我们拥有表达式\
  \ `11 > 8` 显示值为 `true` 的原因之一。此外，`11 > 8` 附近的另一对括号也是重要的，因为 `plus` 位于 `>` 之前。\n\n\
  ### 标识符 (Identifiers)\n\n上面图表的顶层是标识符或名称。这个顶层是你赋予给 `class` 的名称。该名称应该具体地识别并描述用户看到或体验到的对象类型。简单来说，名称或标识符应该标识该类。\n\
  \n### 运算符 (Operators)\n\nJava 拥有广泛的运算符环境。如果你好奇运算符是什么，可以将其看作一个符号，向编译器传达特定信息以执行逻辑或数学操作。在\
  \ Java 中，你将与四类运算符进行交互。\n\n这四类包括：\n* 逻辑运算符\n* 位运算符\n* 关系运算符\n* 算术运算符\n\n与其他计算机语言一样，Java\
  \ 有一个定义的额外运算符列表，用于处理某些特定场景。\n\n在学习 `JAVA` 编程语言或任何编程语言时，在开始之前必须理解五个基本概念。这五个基本概念包括：\n\
  * 变量\n* 数据结构\n* 控制结构\n* 语法\n* 工具\n\n这些概念中的每一个将从初学者水平进行彻底解释，以确保它们被理解。\n\n### 分隔符\
  \ (Separators)\n\n它们不适用于高层抽象：注意，许多此类程序使用了低级构建结构，这些结构主要用于低级抽象。这些编程语言的通常方法是它们关注机器——即如何让计算机做某事，而不是这些功能如何帮助解决用户的问题。这些语言处理微小的细节，这已经超出了高层抽象的范围，而高层抽象是我们今天看到的更常见的方法。在低级抽象中，数据结构和算法是分开考虑的，而在高层抽象中它们被作为一个整体考虑。\n\
  \n### 字面量 (Literals)\n\n当涉及到 `Java` 中的字面量时，我们以人类可以阅读的形式出现的固定值。我们可以说数字 `200` 是字面量。大多数时候，字面量可以是常量。\n\
  \n字面量在程序中很重要。事实上，大多数 Java 程序都使用字面量。我们已经讨论的一些程序使用了字面量。`Java` 中的字面量属于各种数据类型。\n\n每个字面量的显示方式由类型决定。正如之前提到的，我们用单引号包含字符常量，例如\
  \ `'c'` 和 `'%'`。我们在不涉及小数的情况下定义整数字面量。例如，`12` 和 `-30` 是整数字面量。浮点字面量应该包含小数点和小数。`12.389`\
  \ 是浮点字。Java 还允许对浮点字应用科学计数法。整数字面量包含 `int` 值，任何人可以使用 `short`、`byte` 和 `char` 变量初始化它们。\n\
  \n### 注释 (Comments)\n\n当这种情况发生时，我们把灰色称为注释。在程序的运行阶段，灰色部分（注释）是无关的。这意味着可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠和注释来实现。这里有一个示例：\n\
  \n```\n//在此处放置你的单行注释\n```\n\n你可以通过以下任一种方式拥有多行注释：\n\n```\n//我们将注释\n// 跨越到两行\n```\n\
  \n或者\n\n```\n/*\n此注释跨越了两行\n*/\n```\n\n如果你查看上面的注释，你会注意到它以 `/*` 开始，以 `*/` 结束。此外，如果你查看之前的图片（图\
  \ 8），你会注意到有些注释以单个正斜杠和两个星号 (`/**`) 开始，但以一个星号和一个正斜杠 (`*/`) 结束；这被称为 Javadoc 注释。\n\n\
  \n\n另一方面，变量是一个具有指定数据类型和已赋值或接收到的值的“对象”。之所以被称为变量，是因为它包含的值可能会取决于它在代码中的利用方式、程序员如何声明其值，甚至取决于程序用户如何与其交互。简而言之，变量是某种数据类型的存储单元。访问变量允许程序员轻松地标记和引用所存储的值。\n\
  \n### Java 中的变量类型\n\nJava 要求程序员使用声明语句，即用于通过指定特定数据类型和名称来声明并定义变量的行代码。Java 变量的处理有其特定的处理方式，即将变量定义为包含特定类型和值信息的容器，这与\
  \ Python 等语言不同，Python 只需要声明变量，且变量可以动态更改其类型；而 Java 变量是静态的，一旦声明后就会保持其类型。\n\n```\n\
  Int number = 20;\nBoolean completed = true;\n\nString hello = “Hello World!”\n```\n\
  \n声明时的语法在之前的示例中可见，变量类型在前，然后是变量名，最后是值。请注意，一个声明语句可以在一行中包含多个声明，例如所示：\n\n```\nInt number\
  \ = 20, Boolean completed = true, string hello = “Hello World!”\n```\n\nJava 变量可以在开始时不赋任何值；在这些情况下，Java\
  \ 选择用一个特定的默认值来声明这些变量，例如：\n\n```\nByte a;\nShort num;\nBoolean answer;\n```\n\n将分别产生值\
  \ 0、0 和 false。更完整的默认值列表如下：`byte`、`short`、`int` 和 `long` 数据类型都将产生默认值 0，而 `float`\
  \ 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘u\\0000’ 值，字符串或任何其他对象具有 null 默认值，所有的\
  \ Boolean 将以 false 默认值开始。\n\n在 Java 中，变量声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量\
  \ `num` 来存储一个数字，我们必须先声明变量：`int num`，然后才能赋值，例如 `num = 10`。\n\n上述过程通常被称为“赋值语句”，其中值按照程序员声明的类型被分配给变量。然而，Java（实际上是绝大多数编程语言）工作方式的一个显著特点是，在赋值语句中（例如我们的示例\
  \ `num = 10`），存储的实际值是等号右侧的值，即值 10，而 `num` 只是调用该存储句的“标记”。这就是为什么许多 Java 程序员倾向于使用“获取”（getting）一个值的术语而不是“赋值”（assigning），尽管在大多数情况下，它们可以互换使用，且在少数特殊情况下，功能也基本相同。\n\
  \n然而，请注意，一旦值被分配给变量，就需要执行函数才能使变量内部的数据更改其数据类型。\n\n### 变量命名\n\n创建变量是一项简单的任务，特别是考虑到\
  \ Java 程序员往往根据数据类型或变量存储内容的用途来创建和命名它们。然而，在命名这些变量时有几个规则，否则 Java 将无法识别它并导致错误信息。变量名的主要限制是它不应以特殊字符开头，例如下划线或数字。但是，变量名可以由字母、数字甚至下划线组成，只要下划线不放在开头。不能使用其他字符，例如\
  \ `#` 甚至 `$`，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会被识别。\n\n虽然这些是主要规则，但在命名变量时这里有一些建议。变量名应该是具有描述性的，因为在较长的代码中，可能可能很难记住“x”是做什么的。使用像“count”或“output”这样的变量名比使用通用的“x”或“y”更容易记忆，并将有助于避免混淆。除了描述性之外，如果变量名保持较短，变量也将更容易使用。虽然像\
  \ banking information account records 这样的变量名非常有描述性，但在程序中需要时反复输入会非常累，而且较长的变量名会增加拼写错误的概率，导致代码出现\
  \ bug，导致运行时错误或代码未按预期运行，或者虽然运行但在过程中引入了 bug。同样注意，Java 变量的习惯一直是使用全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉大小写可能导致变量无法识别，因为\
  \ Java 将大写字母视为与小写字母完全不同的字符。\n\n### Java 基本类型\n\n### 方法命名规范\n\n我们将重新回顾 Java 中的命名规范，因为你将使用成员方法。Java\
  \ 编程中的方法执行操作，它们还接收调用者提供的任何参数，并向调用者返回操作结果。以下是声明方法的语法：\n\n```\n[Access Control Modifier]\
  \ Return Type methodName ([set of parameters]) { // body of the method\n......\n\
  }\n```\n\n在为你编写的方法命名时，请记住以下规则。方法名总是动词，或者具体地说是动词短语（这意味着可以使用多个单词来命名）。方法名的第一个单词应该全小写，而其余单词应遵循驼峰命名法。这是一个示例：`writeMethodNamesThis()`\n\
  \n现在，你应该记住动词用于方法名，它们表示动作；而名词用于变量名，它们表示特定的属性。遵循方法的语法和此 Java 结构的命名规范，这是一个用于计算圆面积的示例代码：\n\
  \n```\npublic double computeCircleArea() {\nreturn radius * radius * Math.PI;\n\
  }\n```\n\n### 在代码中使用构造函数\n\n我们将概述一些关于对象的细节。正如之前提到的，构造函数看起来像方法，你完全可以认为并将其视为 Java\
  \ 编程中的一种特殊方法。\n\n然而，构造函数在许多方面与方法不同。构造函数的名称将与类名相同。使用关键字或运算符 `new` 创建构造函数的新实例并对其进行初始化。这是一个使用\
  \ `Employee` 类以及多种初始化方式的示例：\n\n```\nEmployee payrate1 = new Employee( );\nEmployee\
  \ payrate2 = new Employee(2.0);\nEmployee payrate3 = new Employee(3.0, “regular”);\n\
  ```\n\n构造函数还会隐式返回 void——这意味着它没有返回类型。你不能在构造函数的体中放置返回语句，否则会被编译器标记为错误。你调用构造函数的唯一方法是通过使用\
  \ `new` 语句。我们在上面的示例中已经为你提供了几种调用构造函数的方式。\n\n\n\n\n最后一个区别是构造函数是不能被继承的。让我们回到上面提供的示例––第一行包含了\
  \ `Employee( );`––这被称为默认构造函数。如你所见，它完全没有任何参数。默认构造函数的作用仅仅是将成员变量初始化为特定的默认值。在上面的示例中，成员变量\
  \ `payrate1` 被初始化为它的默认薪率和员工状态。\n\n构造函数也可以重载吗？是的，可以。构造函数的行为也像方法，这意味着你可以像重载方法一样的方式重载构造函数。这里是关于如何重载构造函数的几个示例。我们使用\
  \ `Employee` 类并使用不同的参数对其进行重载。\n\n```\nEmployee( )\nEmployee(int r)\nEmployee(int\
  \ r, String b)\n```\n\n### 如何初始化变量 \n\n现在我们已经知道了如何声明变量，并且知道了我们可以使用的各种变量类型，接要要的任务是学习如何在被称为“表达式（expressions）”的内容中使用到这些变量。表达式是\
  \ Java 程序中最常用的构建块，通常用于产生一个新值，尽管在某些情况下，表达式被用于给变量分配新值。通常，表达式由值、变量、操作符和方法调用等组成。还有一些表达式不产生结果，而是影响另一个变量。一个例子是根据操作更改变量值的表达式：它没有输出新值，也没有对新值的真实“赋值”，而是产生所谓的副作用（side\
  \ effect），导致变量值发生变化。\n\n在“Hello World”打印程序中，我们将原始值引入打印函数，这也称为对输出进行“硬编码（hard coding）”。然而，在此时，我们应该尝试结合我们学到的变量知识。变量的操作方式与原始值非常相似，它们简单地通过计算机引用之前存储的值，因此程序员只需要使用变量名而不是值。为了演示这一点，让我们记住之前的“Hello\
  \ World”程序：\n\n```\nprint (\"Hello World\") ;\ninput (\"\\n\\nPlease press the return\
  \ key to close this window.\") ;\n```\n\n现在，我们不再硬––编码 \"Hello World\" 字符串，而是简单地将其声明为一个变量，并让程序输出该变量。最终结果看起来应该是这样的：`String\
  \ = \"Hello World\" ; print(string) ; input (\"\\n\\nPlease press the return key\
  \ to close this window.\") ;`\n\n它的输出结果与之前的程序相同，看起来类似于：\n\nHello World\nPlease press\
  \ the return key to close this window.\n\n## 第 3 章\n\n### Java 基础\n\n### Java 开发包\
  \ (JDK)\n\n![C:\\Users\\Talha\\Downloads\\boitumelo-phetla-veQfS-T6ROs-unsplash.jpg](img/image.004.jpeg)\n\
  \nJDK 提供了构建、测试和监控健壮 Java 应用所需的工具。它允许开发者在 Java 编程操作期间访问软件组件并编译应用程序。例如，开发者需要一个 JDK\
  \ 驱动的环境来能够编写 applet 或实现方法。\n\n由于 JDK 在多程度上执行了软件开发工具包（SDK）的操作，人们很容易混淆这两项的范围和操作。虽然\
  \ JDK 专门用于 Java 编程语言，但 SDK 具有更广泛的适用性。但在程序开发环境中，JDK 仍然作为 SDK 的组件运行。这意味着开发者仍然需要 SDK\
  \ 来提供具有更广泛操作特性的且在 JDK 领域内无法提供的某些工具。开发者文档、调试工具以及应用程序服务器，是 SDK 为 Java 编程环境提供的一些关键工具。\n\
  \nJDK 的部署范围取决于所处理任务的性质、支持的版本以及正在使用的 Java 版本。例如，Java 平台标准版（Java SE）开发包是为配合 Java 标准版而设计的。\n\
  \nJava 平台企业版（Java EE）和 Java 平台微型版（Java ME）是 JDK 的其他主要子集。这些 Java 版本的每个细节将在下面的子主题中详细描述。自\
  \ 2007 年上传到 OpenJDK 门户以来，JDK 一直是一个免费平台。它的开源状态促进了协作，并允许软件开发者社区克隆、修改或为改进和升级贡献想法。\n\
  \n#### Java SE\n\nJava SE 驱动了各种桌面和服务器应用程序。它支持在这些应用程序的开发环境中对 Java 编程语言进行测试和部署。与最近发布的\
  \ Java SE 相关的文档包括高级管理控制台功能和一套经过的 Java 部署规则。在编写此本书时，Java SE 13.0.1 是 Java SE 平台的最新\
  \ JDK 版本。\n\nJava SE SDK 配备了核心 JRE 能力，以及一组设计用于开发桌面应用程序的工具、类库和实现技术。这些工具范围从用于 Java\
  \ 程序实现的简单对象和类型，到适用于构建具有网络能力和不可破译的安全特性的应用程序的高级类参数。Java 程序员还可以在此特定 JDK 上开发 Java 应用，以简化数据库访问或增强\
  \ GUI 属性。\n\n#### Java EE\n\nJava EE 平台是一个开源产品，通过全球 Java 社区成员的共同努力开发。Java EE 与 Java\
  \ SE 密切相关，因为前者构建在后者之上。这种特定的软件集成了设计用于企业解决方案的转型创新。新版本中引入的功能和进展通常反映了 Java 社区成员的投入、需求和请求。Java\
  \ EE 实际上提供了二十多种符合 Java 编程规范的实现。\n\nJava EE SDK 面用于构建大规模操作的应用程序。正如其名称所示，这种特定的 Java\
  \ SDK 是为了给企业软件解决方案提供支持而创建的。该 JDK 提供了 Java 程序员构建可扩展和网络功能所需的强大 API 和运行时属性。需要开发分层应用的开发者也可以发现此\
  \ JDK 非常有用。\n\n在编写此书时，Java EE 8 是最新发布版本。Java EE 的修订设计为企业解决方案提供了增强的技术，以及用于安全和管理目的现代化应用程序。该版本具有多项进展，包括通过\
  \ Client、JSON Binding、Servlet 和 Security API 提供的更大的 REST API 能力。根据 Oracle 官方网站 2019\
  \ 年 12 月发布的信息，该版本还包含日期时间 API 和流 API。\n\n#### Java ME\n\n\n\n\nJava ME 平台利用其简单性、可移植性和动态性，为小型手设备和设备的应用程序构建提供了多功能的环境。Java\
  \ ME 以其卓越的应用程序开发环境而闻名，这得益于其交互且用户友好的导航界面，以及实现网络概念的内置能力。它与物联网（IoT）密切相关，在构建用于嵌入式技术或连接设备的应用程序时非常有用，这些设备可用于发明或实现未来的概念。Java\
  \ ME 的可移植性和运行时属性使其适用于可穿戴设备、手机手机、相机、传感器和打印机等其他物品和设备的软件应用。\n\nJava ME SDK 备了所需的工具，用于在开发软件应用时在独立环境中使用、进行功能测试以及实施设备仿真。根据\
  \ Oracle 官方网站截至 2019 年发布的信息，此 `JDK` 非常适合用于“连接受限设备配置 (CLDC)”技术以及“连接设备配置 (CDC)”功能。这为开发应用程序提供了一个单一且多功能的环境。\n\
  \n还有其他几种 Java ME 解决方案支持在应用程序中部署 Java 编程语言。Java ME Embedded 为设备中提供了集成了 IoT 能力的运行时环境，而\
  \ Java ME embedded client 则有助于构建运行和优化嵌入式程序的软件解决方案。Java for Mobile 则利用 `CLDC` 和 Java\
  \ ME 开发者工具栈来为移动设备创建创新功能。\n\n### Java 运行时环境\n\n请记住，Java 应用程序要高效运行必须满足某些条件。`JRE` 包含了创建这些必要运行的要素。这包括\
  \ `JVM` 及其对应的文件和类属性。尽管 `JRE` 作为 `JDK` 的组件进行运行，但它能够独立运行，特别是当任务限于运行而非构建应用程序指令时。\n\n\
  `JRE` 为 Java 编程生态系统中的不同程序提供了重要的运行属性。例如，如果一个程序在内部运行独立的 `JRE`，则该程序被认为是自包含的。这意味着程序不依赖于其他程序来访问\
  \ `JRE`。这种独立性使得程序能够与不同的 OS 平台实现兼容。\n\n### Java 虚拟机\n\n`JVM` 是在计算机程序中实现 Java 的规范。它是\
  \ Java 语言平台无关特性背后的驱动力。`JVM` 作为由其他程序执行的程序，这一地位被凸显。用于交互和执行 `JVM` 编写的程序将其视为一台机器。正因如此，Java\
  \ 程序使用相同的集合、库和接口，以便将每一个 `JVM` 实现匹配到特定的 OS。这促进了将 Java 程序翻译或解释为本地 OS 的运行时指令，从而消除了\
  \ Java 编程中对平台的依赖性。\n\n作为开发者，你必须警惕你的开发环境和应用程序对网络攻击和其他威胁的脆弱性。`JVM` 提供了增强的安全功能，保护你免受此类威胁。坚固的安全基础归功于其存在于类文件操作代码中的内置语法和结构限制。但这并不意味着\
  \ `JVM` 容纳的类文件范围有限。`JVM` 实际上接受各种类文件，只要它们可以验证是安全可靠的。因此，`JVM` 是使用其他编程语言开发软件的可行补充替代方案。\n\
  \n`JVM` 通常作为移植功能包含在各种软件应用程序和硬件安装中。它是通过由 Oracle 或其他提供商决定的算法实现的。因此，`JVM` 提供了一个开放的实现平台。`JVM`\
  \ 实际上包含运行时实例作为锚定其命令操作的核心属性。例如，创建一个 `JVM` 实例只需在命令提示符中编写指令，反而运行 Java 的类属性。\n\nJava\
  \ 程序员需要熟悉 `JVM` 的关键领域，例如 `classloader` 和运行时操作的数据段，以及负责执行程序的引擎。还有性能相关的组件，例如 `garbage\
  \ collector` 和 `heap dimension tool`，它们对 `JVM` 的部署同样重要。`JVM` 与字节码之间存在紧密的联系。\n\n\
  ### 字节码\n\n字节码本质上是 `JVM` 命令，包含在类文件中，并伴有包括符号表在内的其他信息。它们作为后台语言程序运行，负责促进 `JVM` 操作的解释和执行。字节码实际上是原生代码的替代品，因为\
  \ Java 不提供后者。`JVM` 寄存器的结构使得它包含方法，这些方法反过来包含了字节码流——即 `JVM` 的指令集。换句话说，每个 Java 类内部都有方法，而类文件加载过程会对任何给方法执行单个字节码流。程序开始运行的瞬间，方法的激活会自动触发字节码。\n\
  \n字节码的另一个重要特性是即时编译（JIT）编译器，它在运行时操作期间运行以编译可以执行的代码。该功能实际上以 `HotSpot JIT compiler`\
  \ 的形式存在于 `JVM` 生系统中。它与 Java 运行时操作并发执行代码，因为它具有在优化水平上执行的能力，以及扩展和适应不断增长的指令流量的灵活性。以前，`JIT`\
  \ 编译器需要频繁调优以消除冗余程序并刷新内存。调优是确保 `JIT` 编译器交付最佳性能的必要程序。然而，Java 新版本中的频繁升级逐渐引入了自动内存刷新机制，消除了对定期调优的需求。\n\
  \n字节码可以是原始类型、灵活类型或基于栈的。根据 Venners (1996) 原始数据有七个参数，包括 `byte`、`char`、`double`、`float`、`int`、`long`\
  \ 和 `short`。`boolean` 参数也是一种广泛使用的原始类型，使总数达到八个。八个参数中的每一个旨在帮助开发者部署供字节码操作的变量。字节码流实际上以操作数的形式表示这些原始类型的参数。这最终将更大、更强大的参数分配给字节层次结构中的高层，而较小的参数按降序排列占据层次结构的低层。\n\
  \n\n\n\n## 在编辑器中编写程序\n\n![C:\\Users\\Talha\\Downloads\\altumcode-FoTs3ntRoIs-unsplash\
  \ (1).jpg](img/image.005.jpeg)\n\n要编写程序，你可以使用简单的编辑器，如记事本（Notepad），也可以使用功能齐全的集成开发环境（IDE）。以下是一些适用于\
  \ Java 的流行 IDE 列表及其相关功能。\n\n### Eclipse\n\n这个 IDE 已经存在很长时间，在 Java 开发社区中非常流行并广泛使用。该\
  \ IDE 的一些核心功能包括：\n\n* 它是免费开源的。因此，有许多开发者不断为该 IDE 贡献代码。\n* 可以用于开发 C++、Ruby、HTML5 和\
  \ PHP 等语言的应用程序。\n* 它拥有丰富的客户端平台。\n* 它提供了重构代码的能力。\n* 它有助于代码自动补全。\n* 它有各种扩展和插件。\n*\
  \ 它还支持大多数源代码版本控制系统。\n\n### IntelliJ IDEA\n\n这是 Java 开发社区使用的另一个流行的 IDE。该 IDE 的一些核心功能包括：‌\n\
  \n* 社区版是免费且开源的。\n* 付费版提供了更多功能，并允许开发者使用 Java 企业版构建企业级应用程序。\n* 它提供了重构代码的能力。\n* 它有助于代码自动补全。\n\
  * 它有各种扩展和插件。\n* 它还支持大多数源代码版本控制系统。\n\n### Netbeans\n\nNetBeans 是 Java 语言初学者非常推荐的\
  \ IDE。它是一个强大且快速的 IDE，支持所有 Java 平台以及移动应用程序。它运行在 Windows、Linux、Mac OS X 和 Solaris\
  \ 等多种平台上。它还支持 HTML5、C/C++ 和 PHP 等语言。\n\n### Java 的优点\n\n* Java 得益于其用于学习、编写、部署和实现的人性友好界面，它体现了编程的简单性。\n\
  * Java 的核心架构设计旨在便于在开发环境中进行集成集成和方便使用。\n* Java 是平台无关且易于移植的，适用于多任务处理和跨软件应用程序的使用。\n\
  * Java 的面向对象特性支持创建具有标准功能和可以重新部署代码的程序。\n* Java 的网络能力让程序员更容易为共享计算环境创建软件解决方案。\n* Java\
  \ 与 C++ 以及 C 语言之间的紧密关系使得任何具备其他两种语言知识的人都更容易学习 Java。\n* Java 的自动垃圾回收提供了持续的内存保护，方便程序员在编写代码时消除安全漏洞。\n\
  * Java 的架构对于多线程程序的实现具有灵活性。\n* 得益于使用接口或继承特性重新部署类的能力，Java 是非常易于复用的。\n\n### Java 的缺点\n\
  \n* 由于 Java 并不是原生应用程序，与其他编程语言相比，它的运行速度较慢。\n* Java 在图形的处理和显示上可能缺乏一致性。例如，基于 Java 的应用程序中图形用户界面（GUI）的普通外观与原生软件应用程序的\
  \ GUI 输出相比大不同且标准较低。\n* Java 的垃圾回收（一种管理内存效率的功能）在作为后台程序运行时，可能会干扰速度和性能。\n\n## 第 5 章\n\
  \n### 对象与类\n\n![C:\\Users\\Talha\\Downloads\\pexels-antonio-batinić-4164418.jpg](img/image.006.jpeg)\n\
  \n最后，我们将查看类和对象；\n\nJava 中的对象必须有一个状态（状态将存储在字段（field）中）以及由方法（method）指示的行为。\n\n类是一种地图，或者说如果你愿意，是一个蓝图，根据它创建对象。类看起来像这样：\n\
  \n```java\npublic class Dog { String breed; int ageC; String color; void barking()\
  \ {\n\n } void whining() {\n\n } void sleeping() {\n\n }\n\n}\n```\n\n类可以拥有以下任何类型的变量：\n\
  \n* 局部变量（Local）：定义在构造函数、块或方法内部。该变量在方法内部声明并初始化，并在方法结束时销毁。\n* 实例变量（Instance）：定义在类中但在方法之外。在类实例化的发生时初始化，并可以从类内部的任何构造函数、块或方法进行访问。\n\
  * 类变量（Class）：声明在类内部，使用 `static` 关键字，且定义在任何方法之外。\n\n类可以有多个方法，数量取决于访问方法中所有不同类型值的需要。在我们上面的示例中，我们有了三个方法——`barking()`、`whining()`\
  \ 和 `sleeping()`。\n\n### 构造函数\n\n每个类都将有一个构造函数；如果你省略了它，编译器将构建一个默认的。当你创建一个新对象时，必须调用一个构造函数。按照规则，构造函数的名称必须与类名相同，并且可以根据类的需要拥有任意数量的构造函数。构造函数看起来如下：\n\
  \n```java\npublic class Puppy { public Puppy() { public Puppy(String name) { } }\n\
  ```\n\n### 创建对象\n\n我们已经知道类是某种用于创建对象的蓝图，所以不用说说对象是会被创建的。要创建一个新对象，我们需要 `new` 关键字。创建一个对象所需的三个步骤是：\n\
  \n* 声明（Declaration）——必须用名称和类型声明变量。\n* 实例化（Instantiation）——使用 `new` 关键字进行创建。\n* 初始化（Initialization）——调用构造函数。\n\
  \n下一个示例显示了如何创建对象：\n\n```java\npublic class Puppy { Puppy(String name) { System.out.println(\"\
  Passed Name is :\" + name); } public static void main(String [] ) { Puppy myPuppy\
  \ = new Puppy(\"fluffy\"); } }\n```\n\n### 访问变量和方法\n\n当我们访问变量和方法时可以使用对象；此示例显示了如何访问实例变量：\n\
  \n```java\n/* 首先创建对象 */\nObjectReference = new Puppy();\n/* 现在这样调用我们的变量 */\nObjectReference.variableName;\n\
  /* 现在这样调用类方法 */\nObjectReference.MethodName();\n```\n\n接下来，我们看到类中的实例变量和方法是如何访问的：\n\
  \n```java\npublic class Puppy { int PuppyAge; Puppy(String name) { System.out.println(\"\
  Name chosen is :\" + name); } public void setAge(int age) { PuppyAge = age; } public\
  \ int getAge() { System.out.println(\"Puppy's age is :\" + PuppyAge); return PuppyAge;\
  \ } public static void main(String[] args) { Puppy myPuppy = new Puppy(\"fluffy\"\
  ); // 现在我们调用类方法设置 Puppy 的年龄 myPuppy.setAge(2); // 接下来，我们调用另一个类方法获取 Puppy 的年龄 myPuppy.getAge();\
  \ // 我们这样访问实例变量 System.out.println(\"Variable Value :\" + myPuppy.PuppyAge); } }\n\
  ```\n\n\n\n\n\n接下来，我们需要创建两个类，一个名为 `Employee`，另一个名为 `EmployeeTest`。我们使用以下代码来实现这一目标——请记住\
  \ `Employee` 是类的名称，它是一个公共类（public class）。\n\n执行此操作并保存文件，命名为 `Employee.java`。\n\n\
  另外注意，这里有四个实例变量——`age`、`name`、`designation` 和 `salary`，以及一个显式定义并带有参数的构造函数：\n\n```java\n\
  public class Employee {\n    String name;\n    int age;\n    String designation;\n\
  \    double salary;\n\n    // 这是名为 Employee 的类的构造函数\n    public Employee(String\
  \ name) {\n        this.name = name;\n    }\n\n    // 我们将 Employee 的 age 赋值给变量 age。\n\
  \    public void empAge(int empAge) {\n        age = empAge;\n    }\n\n    /* 我们将\
  \ designation 赋值给变量 designation。*/\n    public void empDesignation(String empDesig)\
  \ {\n        designation = empDesig;\n    }\n\n    /* 我们将 salary 赋值给变量 salary。*/\n\
  \    public void empSalary(double empSalary) {\n        salary = empSalary;\n  \
  \  }\n\n    /* 打印 Employee  */\n    public void printEmployee() {\n        System.out.println(\"\
  Name:\" + name);\n        System.out.println(\"Age:\" + age);\n        System.out.println(\"\
  Designation:\" + designation);\n        System.out.println(\"Salary:\" + salary);\n\
  \    }\n}\n```\n\n代码处理从 `main` 方法开始，因此你需要确保你的代码有一个 `main` 方法，并且我们需要创建一些对象。我们将首先创建一个名为\
  \ `EmployeeTest` 的类，这将创建 `Employee` 类的几个实例。必须调用每个对象的方法，以便将值赋值给变量。将此代码保存在 `EmployeeTest`\
  \ 中：\n\n```java\npublic class EmployeeTest {\n    public static void main(String\
  \ args[]) {\n        /* 使用构造函数创建两个对象 */\n        Employee empOne = new Employee(\"\
  Bobby Bucket\");\n        Employee empTwo = new Employee(\"Shelley Mary\");\n\n\
  \        // 调用我们创建的每个对象的方法\n        empOne.empAge(28);\n        empOne.empDesignation(\"\
  Senior Software Developer\");\n        empOne.empSalary(1500);\n        empOne.printEmployee();\n\
  \n        empTwo.empAge(22);\n        empTwo.empDesignation(\"Software Developer\"\
  );\n        empTwo.empSalary(850);\n        empTwo.printEmployee();\n    }\n}\n\
  ```\n\n现在需要编译这些类并运行 `EmployeeTest`；执行此操作并查看结果。\n\n你应该会看到：\n\n### 输出\n```\nC:\\>\
