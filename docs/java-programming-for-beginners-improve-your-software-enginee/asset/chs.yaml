  \n### 链表 ADT 操作\n\n以下是链表的 API。\n\n- `Insert(k)`：在列表开头添加 `k`。在列表开头插入元素。只需创建一个新元素并移动指针。\
  \ 使得该新元素成为列表的第一个元素。此操作将需要 `O(1)` 常数时间。\n- `Delete()`：删除列表开头的元素。在列表开头删除元素。我们只需要移动一个指针。此操作也需要\
  \ `O(1)` 常数时间。\n- `PrintList()`：显示列表的所有元素。从第一个元素开始，然后沿着指针移动。此操作将需要 `O(N)` 时间。\n\
  - `Find(k)`：查找值为 `k` 的元素的位置。从第一个元素开始并沿着指针移动，直到找到我们寻找的值或到达列表末尾。此操作将需要 `O(N)` 时间。*注意：二分查找不适用于链表。*\n\
  - `FindKth(k)`：查找位置在 `k` 的元素。从第一个元素开始并沿着链接移动，直到到达第 k 个元素。此操作将需要 `O(N)` 时间。\n- `IsEmpty()`：检查列表中的元素数量是否为零。只需检查列表的头指针，如果为\
  \ `Null`，则列表为空，否则不为空。此操作将需要 `O(1)` 时间。\n\n*(注：由于用户提供的文本存在严重重复，此处翻译已基于原文逻辑进行。)*\n\
  \n\n\n\n\n`Add(K)`: 将新元素 `k` 添加到队列末尾。\n\n`Remove()`: 从队列头部移除一个元素并返回其值。\n\n`Front()`:\
  \ 返回队列头部元素的值。\n\n`Size()`: 返回队列内部的元素数量。\n\n`IsEmpty()`: 如果队列为空则返回 1，否则返回 0。\n\n\
  **注意**: 以上所有队列操作的时间复杂度均为 `O(1)`。\n\n## JAVA Collection 中的队列实现\n\n`ArrayDeque<T>`\
  \ 是双端队列的类实现。如果我们使用 `add()`、`remove()` 和 `peek()`，它的行为将像一个队列。（此外，如果我们使用 `push()`、`pop()`\
  \ 和 `peekLast()`，它的行为将像一个栈。）例如下下：\n\n```java\nimport java.util.ArrayDeque; \npublic\
  \ class QueueDemo {\n    public static void main(String[] args) {\n        ArrayDeque<Integer>\
  \ que = new ArrayDeque<Integer>(); \n        que.add(1); que.add(2); que.add(3);\n\
  \        System.out.println(\"Queue : \"+que);\n        System.out.println(\"Queue\
  \ size : \"+que.size());\n        System.out.println(\"Queue peek : \"+que.peek());\n\
  \        System.out.println(\"Queue remove : \"+que.remove());\n        System.out.println(\"\
  Queue isEmpty : \"+que.isEmpty());\n    }\n}\n```\n\n**输出:**\n```\nQueue : [1, 2,\
  \ 3]\nQueue size : 3\nQueue peek : 1\nQueue remove : 1\nQueue isEmpty : false\n\
  ```\n\n## 第 10 章：文件处理\n\n本章讨论了读取、写入、创建和打开文件的细节。有许多文件 I/O 类和方法可以选择。\n\n### 读取文本文件\n\
  \n读取文本文件是 Java 中的一项关键能力，并在许多实际应用。`FileReader`、`BufferedReader` 和 `Scanner` 是 Java\
  \ 中读取纯文本文件的有用类。每个类都具有特定的特性，使其能够胜任处理特定情况。\n\n### BufferedReader\n\n该技术从字符输入流中读取文本。它缓冲字符、数组和行，以便高效地读取。你可以指定缓冲区类型或使用标准类型。出于大多数原因，默认类型已经足够大。特别是，从\
  \ `Reader` 产生的每个读取操作都会导致基础的人性或字节流执行相应的读取操作。因此，建议对任何读取操作较大的（如 `FileReader` 和 `InputStreamReader`）`Reader`\
  \ 封装一个 `BufferedReader`。例如：\n\n```java\nBufferedReader in = New BufferedReader(Reader\
  \ in, int size)\n```\n\n### FileReader\n\n用于读取字符文档的便利类。该类的构造函数假设默认字符格式和默认字节缓冲区大小合适的。\n\
  \n### Scanner\n\n一种简单的文本扫描器，使用正则表达式来解析原始类型和字符串。`Scanner` 使用分隔符模型将其条目拆分为符合定义空白的标记（tokens）。通过使用不同的\
  \ `next` 技术，可以将生成的标记转换为不同类型的值。\n\n```java\nimport java.io.File; \nimport java.util.Scanner;\
  \ \npublic class ReadFromFileUsingScanner {\n    public static void main(String[]\
  \ args) throws Exception {\n        // filepath 现在设置为参数，以便进行扫描\n        File example\
  \ = new File(\"C:\\\\Users\\\\userName\\\\Desktop\\\\example.txt\"); \n        Scanner\
  \ example1 = new Scanner(file); \n        while (example1.hasNextLine()) System.out.println(example1.nextLine());\n\
  \    }\n}\n```\n\n使用 `Scanner` 类但不使用循环的：\n\n```java\nimport java.io.File; \nimport\
  \ java.io.FileNotFoundException;\nimport java.util.Scanner;\n\npublic class example{\
  \ \n    public static void main(String[] args) throws FileNotFoundException {\n\
  \        File example = new File(\"C:\\\\Users\\\\userName\\\\Desktop\\\\example.txt\"\
  );\n        Scanner example1 = new Scanner(file); // 我们将使用 \\\\Z 作为分隔符 \n      \
  \  sc.useDelimiter(\"\\\\Z\");\n        System.out.println(example1.next());\n \
  \   }\n}\n```\n\n### 在 Java 包 `io;` 中将文本文件读取为 String\n\n```java\npackage io; \n\
  import java.nio.file.*; \npublic class example{\n    public static example(String\
  \ fileName)throws Exception { \n        String example1 = \"\"; \n        example1\
  \ = new String(Files.readAllBytes(Paths.get(fileName))); \n        return example1;\n\
  \    }\n    public static void main(String[] args) throws Exception {\n        String\
  \ example1 = example(\"C:\\\\Users\\\\userName\\\\Desktop\\\\example.java\"); \n\
  \        System.out.println(example1);\n    }\n}\n```\n\n### 写入文本文件\n\n你可以使用其中一个写入方法向文件写入字节或行。写入方法包括：\n\
  * `Write(Path, byte[], OpenOption...)`\n* `Write(Path, Iterable<? extends CharSequence>,\
  \ Charset, OpenOption...)`\n\n### 重命名和删除文件\n\n### 重命名\n\n在 Java 中，`File` 类中有一个名为\
  \ `renameTo(fileName)` 的方法，我们可以用它重命名文件。\n\n#### 删除文件\n\n使用 `java` 程序保存的文件将被永久删除，不会移动到垃圾箱/回收站。使用\
  \ `java.io.File.delete()` 从文件或文件夹中删除此抽象路径。使用 `java.nio.file.files.deleteifexists`\
  \ 如果文件夹存在则将其删除。如果文件夹未打开，它也会删除路径列出的文件夹。\n\n### Java 高级主题\n\n### Generic 型\n\n在任何复杂的软件项目中，Bug\
  \ 都是生活常态。仔细的计划、编程和测试可能有助于减少它们的无处不在，但无论如何它们总会找到进入你系统的某个地方。随着新功能的引入以及代码库规模和复杂性的增加，这一点变得尤为明显。\n\
  \n幸运的是，某些 Bug 比其他 Bug 更容易检测。例如，编译时 Bug 可以很快识别；你可以使用编译器的错误代码来确定问题所在并解决它，对吧。然而，运行时\
  \ Bug 可能困难得多；它们并不总是发生，当它们发生时，可能在远离真实原因的地方。泛型通过使软件在编译时可行来帮助稳定你的软件。\n\n### 泛型类型\n\n\
  泛型形式是类型参数化的泛型类别或接口。可以通过修改一个简单的箱类来展示这一思想。考虑一个适用于任何类型对象的非泛型箱类别。它只需要提供两个技术：`set()`（向柜中添加物品）和\
  \ `get()`（检索它）。由于它们的方法接受或返回对象，你可以自由地传递你想要的内容，只要它不是原始类型之一。在编译时无法检查该类是如何被使用的。\n\n\
  由角括号 `< >` 指定的类型参数部分显示了类别的标题。它指示了形式的参数（也称为排序因子）`T1`、`T2` 直到 `Tn`。通过将文件 `government\
  \ class box` 修改为 `government class box <T >` 来生成泛型类型语句，从而更新箱类别以使用泛型。这引入了类型变量 `T`，它可以在类内部任何地方使用。这把所有的\
  \ `Object` 事件替换为 `T`。\n\n\n\n\n按照约定，类型标识通常是单个大写字母。这与你已经熟悉的变量命名规范形成了鲜明对比，并且有一个充分的理由：如果没有这种约定，很难区分类型变量与普通的类或对象名称。\n\
  \n最常用的类型参数名称有：\n\n* `E` - Element（元素，在 Java 集合框架中广泛使用）\n* `K` - Key（键）\n* `N` -\
  \ Number（数字）\n* `T` - Type（类型）\n* `V` - Value（值）\n* `S`, `U`, `V` 等——第 2、第 3、第 4\
  \ 类型\n\n你将在整个 JDK 和 API 中看到这些名称。\n\n### 调用和实例化泛型类型\n\n为了在你的系统中提到泛型框类别，必须执行一次泛型类型调用，将\
  \ `T` 带入一个特定的具体值，例如 `Integer`：\n\n```\nBox<Integer> integerBox;\n```\n\n你可能认为泛型排序的调用类似于普通的过程调用，但实际上你并不是在过程中添加了断言，而是将一个类型参数——在本例中为\
  \ `Integer`——传递到了框类别本身。\n\n许多设计者交叉使用“类型参数”（type parameter）和“类型语句”（type statement）这两个词，但它们的定义不同。在编码时，为了生成参数化类型，需要提供参数。因此，`Foo\
  \ < T >` 中的 `T` 是类型参数，而 `Foo < String > f` 是类型语句。在使用这些词时，本类遵循这一概念。\n\n与任何其他变量语句一样，此软件并没有生成一个新的框实例。它只是声明\
  \ `integerBox` 将拥有指向“Integer 框”的引用，这就是读取 `Box < Integer>` 的方式。泛型类型调用通常被称为参数化类型。\n\
  \n要实例化此类，请像常一样使用 `new` 关键字，但在类名和括号之间放置 `<Integer>`：\n\n```\nBox<Integer> integerBox\
  \ = new Box<Integer>();\n```\n\n### 菱形语法\n\n在 Java 的最新版本中，只要编译器能够确定或从上下文推断出类型参数，你就可以空类型参数集（`<\
  \ >`）替换调用泛型类构造函数所需的类型参数。这对尖括号 `< >` 被形象地称为“菱形”（The Diamond）。例如，你可以使用之前的声明来生成 `Box\
  \ < Integer>` 的实例：`Box<Integer> integerBox = new Box<>();`\n\n### 泛型方法\n\n泛型技术是实现其自身类型参数的技术。这类似于泛型类型声明，但类型参数的作用范围局限于声明它的方法。除了泛型类构造函数外，还允许静态是非静态泛型方法。\n\
  \n泛型方法的语法涉及一组在过程返回类型之前的尖括号内的类型参数列表。对于静态泛型方法，类型参数段必须出现在方法的返回类型之前。`Util` 类涉及一个比较两个\
  \ `Pair` 项的泛型方法。\n\n```\nPair<Integer, String> ex1 = new Pair<>(49, \"string1\"\
  ); Pair<Integer, String> ex2 = new Pair<>(64, \"string2\"); boolean comparison =\
  \ Util.<Integer, String>compare(ex1, ex2);\n```\n\n### 边界类型参数\n\n有时，你希望限制在参数化类型语句时可以使用类型种类。例如，一个处理数字图形的方法可能只能识别\
  \ `Number` 情况或其子类。这就是限制此类类型参数的用途。\n\n列出类型参数的名称以表示定义的类型参数，并配有扩展关键字 `extends`，随后跟上上界，在本例中为\
  \ `Number`。注意，在此语境下，`extends` 通常用于表示“继承”（如类课程）或“实现”（如接口）。\n\n### 多重边界\n\n类型参数可以有多个边界。具有多个边界的类型变量是边界中列出的所有类型的子类型。如果其中一个边界是类，则必须首先指定。例如：\n\
  \n```\nclass X { /* ... */ } interface Y { /* ... */ } interface Z { /* ... */ }\n\
  \nclass R <T extends X & Y & Z> { /* ... */ }\n```\n\n如果未首先指定边界 `X`，你将得到编译时错误：\n\
  \n```java\nclass R <T extends Y & X & Z> { /* ... */ } // 编译错误\n```\n\n## 第 11 章：集合\n\
  \n![C:\\Users\\Talha\\Downloads\\pexels-thisisengineering-3861943.jpg](img/image.038.jpeg)\n\
  \n### 集合的函数化\n\n当我们外部化代码时，我们展示了代码的每一个阶段。这是命令式编程的一个定义特征。然而，函数式编程的一个反复出现的主题是相反的概念：内部化代码。内部化代码是在函数内部隐藏细节的过程。然而，函数式编程通过将日常编程微模式转换为函数，更进了一步。这些微模式之一就是对数据迭代，无论是通过迭代器、for\
  \ 循环还是 while 循环。函数式编程改变了我们对事物的感知。\n\nJava 的函数化工作在没有重新设计集合库（特别是 `Collection`、`Map`、`List`\
  \ 和 `Set` 接口）之前，将是不完全的。这是因为迭代经常发生在集合上，而集合是 Java 程序的基石。这是函数化尝试发生的自然场所。然而，任何重大的修改（例如向\
  \ `Collection` 接口引入新方法）都会破坏与所有 Java 8 之前项目的后兼容性。这不仅涵盖了扩展 `Collection` 接口 JDK 自身的体系，还涵盖了任何或或源的第三方库和内部类。\n\
  \n现在，我们可以将学到的关于 Java 标准函数接口的知识应用到集合上。让我们看看 Java 8 的集合发生了什么变化。\n\n### Collection\
  \ 接口\n\n我们首先查看适用于列表和集合的 `Collection` 接口中一个全新的默认方法。这是 `forEach()` 方法：\n\n![](img/image.039.jpeg)\n\
  \n该方法遍历整个集合，让 `Consumer` 决定对每个元素做什么。这就是内部迭代的概念，也是声明式编程的一种体现。它没有指定如何迭代。这与外部迭代对立，在外部迭代中，如何迭代的细节以及对每个元素做什么都是在代码中指定的。\n\
  \n\n\n\n`forEach()` 方法具有非常广泛的适用性。它是遍历集合的一种更方便的方式，应该成为你的事实上的标准。然而，作为一种声明式结构，有些事情是你无法完成的。最显著的一是，你不能像在\
  \ `whileloop` 中那样改变本地变量的状态。算法必须以函数式的方式重新思考。目前，只需知道 `forEach()` 适用于不改变状态的迭代即可。\n\n\
  我们现在来看下 `Collection` 中提供的另一个新方法：\n\n![](img/image.041.jpeg)\n\n`removeIf()` 方法将迭代、测试和移除的整个过程内部化。它只需要告诉它移除的条件是什么。\n\
  \n使用现在已经熟悉的 `Predicate` 函数式接口，我们可以很容易地确定要使用什么种类型的 lambda。\n\n![](img/image.042.jpeg)\n\
  \n要替换 `List` 的所有内容，我们可以使用 `replaceAll()`：\n\n![](img/image.043.jpeg)\n\n`replaceAll()`\
  \ 使用 `UnaryOperator` 作为其函数式接口，它是 `Function` 的子接口。\n\n`removeIf()` 和 `replaceAll()`\
  \ 适用于所有子类，但有一个限制：底层类必须支持删除操作，否则将抛出异常。\n\n这些示例展示了函数式编程的紧凑性。大部分工作由函数完成，而 lambda 提供了细节。\n\
  \n### Map 接口\n\n在 map 中将列表作为值时，最大的烦恼之一是在添加、更新或删除元素之前，总是需要检查 map 是否存在。首先，你必须尝试提取列表，如果没有找到则创建它。例如，假设我们有一个通过\
  \ `Map` 实现的更新电影数据库的方法。map 的键是电影的年份，值是该年份的电影列表。在 Java 8 之前，代码看起来如下：\n\n![](img/image.044.jpeg)\n\
  \nJava 8 通过这些默认方法提供了一个更好的替代方案：\n\n![](img/image.045.jpeg)\n\n让我们从 `compute` 方法开始。每个变体都允许通过映射函数来生成\
  \ map 的值。对于 `computeIfPresent()` 和 `computeIfAbsent()`，映射是根据条件执行的。因此，通过这些方法，我们可以重构之前的代码示例：\n\
  \n![](img/image.046.jpeg)\n\n注意，列表的创建是由 `computeIfAbsent()` lambda 处理的。当需要通过 `compute()`\
  \ 方法将电影添加到列表时，`add()` 永远不会抛出 `NullPointerException`，因为保证了列表已经被创建。\n\n在这种情况下，使用 `computeIfAbsent()`\
  \ 方法有点大材小用，我们使用 `putIfAbsent()` 会更好：\n\n![](img/image.047.jpeg)\n\n此方法没有 lambda，并期望给定一个值——而不是计算值。尽管没有使用\
  \ lambda，这仍然是一个函数式风格的方法。它证明了你可以以函数式方式表示代码，而不一定需要使用 lambda。\n\n如果你仍然需要提取数据，可以使用 `getOrDefault()`\
  \ 方法使用更函数式的方法：\n\n![](img/image.048.jpeg)\n\n你也可以使用 `merge()` 方法作为替代方案。它方便了对列表存在性的检查。在下面的示例中，如果键（年份）在\
  \ map 中不存在，它将把值（标题）放入 map 中。如果存在，它允许 `BiFunction` 决定如何处理这两个列表：\n\n![](img/image.049.jpeg)\n\
  \n并且可以这样使用它：\n\n![](img/image.050.jpeg)\n\n`BiFunction` 还可以返回 `null`，这会告诉 `merge`\
  \ 删除该键。\n\n结论是，我们删除了检查元素是否存在的开销代码，现在可以关注真正重要的事情：定义如何创建列表以及如何向列表中添加元素。\n\n`Map` 接口已经丰富了如\
  \ `forEach()`、`replace()` 和 `replaceAll()` 等其他函数式方法，并使用了相同的代码内部化原理。请参阅录获取完整列表。\n\
  \n### Spliterator\n\n`Collections` 库在并发访问方面仍然受到相同的限制。如既往，你必须选择符合你线程安全要求的 `Collections`\
  \ 库类。这是因为上面显示的新方法仅仅是运行在相同底层数据结构之上的函数式抽象。这些方法并不特别适合函数式编程的并行处理方法，因为它们仍然基于多个线程变异集合并同步访问底层数据的概念。然而，存在一种兼容的\
  \ Java 8 新抽象。它是为了并行遍历数据而设计的。其核心理念体现在 `Spliterator` 接口中。该接口的前提是对数据进行分区，并将数据块交给不同的线程。可以从\
  \ `Collection` 接口获取 `Spliterator`，包括子接口 `List` 和 `Set`。\n\n`Spliterator` 接口的核心是这三个方法：\n\
  \n![](img/image.051.jpeg)\n\n`trySplit()` 方法将底层数据一分为二。它创建一个带有一半数据的新 `Spliterator`，并将另一部分留在原始实例中。每个都可以交给一个线程，线程反过来使用\
  \ `forEachRemaining()` 遍历分区的数据。`tryAdvance()` 方法是一种一次处理的变体，返回下一个元素，或者在列表耗尽时返回 `null`。\n\
  \nSpliterators 本身不处理并行处理，而是提供执行它的抽象。以下是该概念的应用：\n\n![](img/image.052.jpeg)\n\n给定一个标题和一个电影列表，`isMovieInList()`\
  \ 方法并行化搜索以确定它是否包含在列表中。如果找到，将 `booleanHolder` 中的标志置为 true。它从列表中获取 `Spliterator` 实例，将其一分为二，并将每一半交给每个线程。如果有更多可用线程，可以重复此拆分过程。\n\
  \nSpliterators 也可以从其他 `Collection` 类型以及其他库中获取。有许多不同的实现用于处理不同的特性，包括有限/无限、有序/无序、已排序/未排序以及可变/不可变。\n\
  \n它们继承了其数据结构的特性。\n\nSpliterators 是一种较低层次的抽象，旨在让你对并行迭代进行细粒度的控制。然而，API 缺乏一些实现函数式友好算法所需的精炼。在上面的示例中，我们需要在\
  \ `BooleanHolder` 中存储搜索所需的状态。\n\n## 总结\n\n这完成了我们对 Java 8 新及改进的 Collections 库以及标准函数式接口的概述。正如标准\
  \ JDK 库为了支持函数式概念发生了许多变化一样，预计第三方 API 发生重大变化。但最大的变革尚未到来。\n\n### 关键点\n\n- 新包 `java.util.function`\
  \ 包含函数式接口。它们被分为四类，每个类由其原型代表：`Consumer`、`Function`、`Predicate` 和 `Supplier`。\n- 每个函数式接口类都定义了针对类型和值的变体。\n\
  - 函数式接口还定义了允许函数式组合的方法。多个不同的 lambda 可以融合为看起来像单一函数的复合函数。\n- `Collections` 库已经过重构和函数化。这是通过在顶层使用默认方法实现的，从而确保了向后兼容。\n\
  - `Collections`、`Lists`、`Sets` 和 `Maps` 中的新函数式方法是针对内部迭代设计的。以 lambda 和方法引用的形式的行为参数被传递给遍历集合并作用于每个元素的方法。\n\
  - 内部迭代是声明式编程的一种形式，是函数式编程的基础。它让开发者无需描述“如何”做，而是关注“做什么”。\n- `Spliterators` 是为集合的并行迭代而设计的。\n\
  \n\n\n\n\n大于 1 的非质数。\n\n### 结论\n\n![C:\\Users\\Talha\\Downloads\\pexels-christina-morillo-1181471.jpg](img/image.053.jpeg)\n\
  \n### Java 开发工具包 (JDK)\nJDK 是编译、文档化和打包 Java 项目的关键工具。与 `JRE` 一，`JDK` 包含了解释器或加载器、名为\
  \ `javac` 的编译器、归档文件 (`JAR`)、`Javadoc` 文档生成器许多对高效 Java 开发至关重要的工具。\n\n### Java 运行环境\
  \ (JRE)\nJava 运行环境缩写 `JRE`。它是执行 Java 字节码的环境，也是运行 Java 虚拟机的程序。`JRE` 还包含了 `JVM` 在运行时所需的所有类库和其他支持文件。本质上，它是一个包含运行\
  \ Java 程序所需的所有内容的软件软件包，以及 Java 虚拟机的物理实现。\n\n### Java 虚拟机 (JVM)\n`JVM` 是 Java Virtual\
  \ Machine 的缩写。`JVM` 是一个抽象机器，是一个为我们提供执行字节码的 `JRE` 的规范。`JVM` 必须遵循以下定义：\n- `Specification`（规范）：描述\
  \ `JVM` 如何实现的文档。\n- `Implementation`（实现）：满足 `JVM` 规范要求的程序。\n- `Runtime Instance`（运行时实例）：每当命令行输入\
  \ Java 命令并启动类时创建的 `JVM` 实例。\n\n这三者紧密相织，其中一个依赖于其他者才能运行。\n\n### 最后的想法\n\n至此，我想感谢你选择我的\
