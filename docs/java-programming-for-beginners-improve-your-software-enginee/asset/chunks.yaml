    \ the project, and why you chose DIYWindow as the superclass for the HelloWorld\
    \ class.\n\n*   Comments are lines that begin with // or a group of lines that\
    \ begin with /* and end with */.\n\nChapter 7\n\nObject-Oriented Programming\n\
    \n ![C:\\Users\\Talha\\Downloads\\pexels-kevin-ku-577585.jpg](image.019.jpeg)\n\
    \nYou have learned earlier that Java is an object-oriented programming language.\
    \ As such, it supports the fundamental principles of this programming paradigm.\n\
    \nAn object refers to real entities such as bag, car, chair, or pen. Object-oriented\
    \ programming languages allow programmers to design programs that use objects\
    \ and classes. They provide and support features that can simplify software development\
    \ and maintenance. The most important concepts of this programming paradigm are\
    \ the following:\n\n*   Objects\n\n*   Classes\n\n*   Method\n\n*   Instance\n\
    \n*   Inheritance\n\n*   Abstraction\n\n*   Polymorphism\n\n*   Message Parsing\
    \ Encapsulation\n\nObjects"
