  trans: "\n5. 点击 `Finish` 创建该类。\n\nEclipse 将为 `HelloWorld` 类创建代码，如下列表所示。\n\n如果你将电子阅读器的字号设置为较小，以最大限度地减少换行，你可能会发现阅读本书中的代码列表变得更容易。列表\
    \ 1-1，自 `HelloWorld.java`\n```java\npackage annette.godtland.helloworld;\nimport\
    \ com.godtsoft.diyjava.DIYWindow;\npublic class HelloWorld extends DIYWindow {\
    \ \n    public HelloWorld() {\n        // TODO Auto-generated constructor stub\n\
    \    }\n\n    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method stub\n    }\n}\n```\n\nEclipse 会添加你不需要的注释代码。注释是以 `//` 开头的行，或者是以 `/*`\
    \ 开始并以 `*/` 结束的行组。\n\n1. 从该类中删除自动生成的注释行，如如下列表所示的 `(Code was removed from here.)`\
    \ 所在。列表 1-2，自 `HelloWorld.java`\n```java\npackage annette.godtland.helloworld;\n\
    import com.godtsoft.diyjava.DIYWindow;\npublic class HelloWorld extends DIYWindow\
    \ { \n    public HelloWorld() {\n        (Code was removed from here.)\n    }\n\
    \n    public static void main(String[] args) {\n        (Code was removed from\
    \ here.)\n    }\n}\n```\n\n在你为本书创建的每个类的程序代码中，删除自动生成的注释。你将在稍后的课程中添加你自己的注释。\n\n\
    点击任何 `Completed` 列表链接以查看如何完成代码。然而，如果你在查看答案之前尝试自己完成代码，你会学到更多。\n\n以 `public static\
    \ void main` 开始的代码块被称为 `main()` 方法。以 `public HelloWorld()` 开始的代码块被称为构造函数。现在，添加你的第一第一行代码：\n\
    \n1. 完全按照此处所示向构造函数和 `main()` 方法中添加代码。代码中的需要更改在列表中始终以**粗体**显示。列表 1-3，自 `HelloWorld.java`\n\
    ```java\npackage annette.godtland.helloworld;\nimport com.godtsoft.diyjava.DIYWindow;\n\
    public class HelloWorld extends DIYWindow { \n    public HelloWorld() { \n   \
    \     print(\"Hello World\");\n    }\n\n    public static void main(String[] args)\
    \ { \n        new HelloWorld();\n    }\n}\n```\n\n1. 按 `Ctrl-S` 保存程序。\n2. 点击 `Run`\
    \ 按钮（如图像所示）来运行程序：\n\n![](img/image.015.jpeg)\n\n发生了什么？\n\n应该会弹出一个窗口显示“Hello World”，如图像所示：\n\
    \n![](img/image.016.jpeg)\n\n1. 你需要对你的类进行什么修改才能让它向你问好？\n\n列表 1-4，自 `HelloWorld.java`\n\
    ```java\n...\npublic HelloWorld() { \n    print(\"Hello\n____________\n\");  \n\
    }\n...\n```\n\n1. 保存程序并运行它。\n\n如果你犯错了会发生什么？\n\n1. 错误地输入单词“print”并保存程序。列表 1-5，自\
    \ `HelloWorld.java`\n```java\n...\npublic HelloWorld() { \n    print ttt\n(\"\
    Hello Annette\");  \n}\n...\n```\n\n发生了什么？\n\n出现了许多错误指示器，如图像所示：\n\n![](img/image.017.jpeg)\n\
    \n1. 双击 `Eclipse` 中 `Problems` 板中的 `Error` 计数查看发现的错误列表。\n2. 双击 `Problems` 板中的\
    \ `Error` 描述将光标移动到错误行。\n3. 将光标悬停在实际错误上（即上方图中显示 `Error right here in the above\
    \ image`的地方）。Eclipse 将列出解决问题的方法，如下图所示。`Eclipse` 的此功能被称为 `Quick Fix`（快速修复）。\n\n\
    ![](img/image.018.jpeg)\n\n4. 点击名为 `Change to \"print(...).\"` 的快速修复。该操作将为你错误。\n\
    \n1. 保存更改。\n\n所有错误指示器都应该消失。\n\n现在，打印更多内容：\n\n1. 修改代码让你的程序输出这些：\nHello, earthling.\n\
    Take me to your leader. 列表 1-6，自 `HelloWorld.java`\n```java\n...\npublic HelloWorld()\
    \ { \n    print(\"_______________________\"); \n    print(\"_______________________\"\
    );\n}\n...\n```\n\n在整个课程中，除非有语法错误，否则在每次代码更改后保存更改并运行程序。\n\n打印了正确的行吗？如果没有，修复代码并重试。\n\
    \n1. 你认为需要打印什么才能在两个句子之间插入一个空行，如下所示。（提示：你不希望在该行打印任何内容。）\nHello, earthling.\nTake\
    \ me to your leader. 列表 1-7，自 `HelloWorld.java`\n```java\n...\npublic HelloWorld()\
    \ { \n    print(\"Hello, earthling.\"); \n    print(_____); \n    print(\"Take\
    \ me to your leader.\");  \n}\n...\n```\n\n### 关键点与其他\n\n* Java 程序由类组成。每个程序都需要在其中一个类中有一个\
    \ `main()` 方法。\n* `main()` 方法必须写成 `public static void main(String[] args)`。随后的课程将解释所有单词的含义。\n\
    * 多个类通常被组合使用以创建一个程序。\n* 然而，本书中的大多数程序将只由一个类组成。\n* 每个类都必须有一个父类。任何类都可以作为父类。你将在稍后的课程中创建你自己的父类。\n\
    * 具有相同父类的类被认为是同一种类型。例如，你为书中每个程序创建的主类都将使用 `DIYWindow` 类作为其父类。因此，书中每个程序都是 `DIYWindow`\
    \ 的类型。\n"
- fmt: "\nIn the real world, you will encounter objects such as humans, dogs, cars,\
    \ and cats. These objects possess state and behavior. For instance, when you think\
    \ of a cat, its state can consist of its breed, color, or name. Its behavior may\
    \ consist of running, jumping, or wagging its tail.\n\nA software object resembles\
    \ a real-world object in terms of these characteristics. Its state is saved in\
    \ fields, and its behavior is exhibited through methods.\n\nIn development, the\
    \ methods are performed on an object’s internal state, and the methods facilitate\
    \ communication between objects.\n\n## Classes\n\n![](image.020.jpeg)\nClasses\
    \ are used to set the definitions for objects. These specifications serve as blueprints\
    \ for creating objects. While they are not immediately applied when classes are\
    \ created, the definitions are available in case an object of the class is instantiated.\
    \ An object or class can have multiple copies or instances within a program.\n\
    \nFollowing is an example of a class definition for a class named `Cat`:\n\nA\
    \ class can have the following types of variable:\n\n### Class variables\nClass\
    \ variables are those that are declared inside a class using the `static` modifier\
    \ and outside any method.\n\n### Local variables\nLocal variables are those that\
    \ are defined within the methods, blocks, or constructors. These variables are\
    \ declared and instantiated inside the method and are destroyed once the method\
    \ had been carried out.\n\n### Instance variables\nInstance variables are those\
    \ that are inside a class but outside of the methods. They are initialized at\
    \ the same time as the class. They can be accessed from a method, block, or constructor\
    \ of that specific class.\n\nA class can contain as many methods as necessary\
    \ to obtain the values it needs. For example, the `Cat` class has three methods:\
    \ `running()`, `sleeping()`, and `jumping()`.\n\n## Constructors\nA constructor\
    \ is a method which is used to initialize an object. A class must contain at least\
    \ one constructor.\n\nThe following are the important rules for constructors:\n\
    - The name of the constructor should match the name of the class.\n- It should\
