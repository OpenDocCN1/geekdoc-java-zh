  trans: "\n\n最后一个区别是构造函数是不能被继承的。让我们回到上面提供的示例––第一行包含了 `Employee( );`––这被称为默认构造函数。如你所见，它完全没有任何参数。默认构造函数的作用仅仅是将成员变量初始化为特定的默认值。在上面的示例中，成员变量\
    \ `payrate1` 被初始化为它的默认薪率和员工状态。\n\n构造函数也可以重载吗？是的，可以。构造函数的行为也像方法，这意味着你可以像重载方法一样的方式重载构造函数。这里是关于如何重载构造函数的几个示例。我们使用\
    \ `Employee` 类并使用不同的参数对其进行重载。\n\n```\nEmployee( )\nEmployee(int r)\nEmployee(int\
    \ r, String b)\n```\n\n### 如何初始化变量 \n\n现在我们已经知道了如何声明变量，并且知道了我们可以使用的各种变量类型，接要要的任务是学习如何在被称为“表达式（expressions）”的内容中使用到这些变量。表达式是\
    \ Java 程序中最常用的构建块，通常用于产生一个新值，尽管在某些情况下，表达式被用于给变量分配新值。通常，表达式由值、变量、操作符和方法调用等组成。还有一些表达式不产生结果，而是影响另一个变量。一个例子是根据操作更改变量值的表达式：它没有输出新值，也没有对新值的真实“赋值”，而是产生所谓的副作用（side\
    \ effect），导致变量值发生变化。\n\n在“Hello World”打印程序中，我们将原始值引入打印函数，这也称为对输出进行“硬编码（hard coding）”。然而，在此时，我们应该尝试结合我们学到的变量知识。变量的操作方式与原始值非常相似，它们简单地通过计算机引用之前存储的值，因此程序员只需要使用变量名而不是值。为了演示这一点，让我们记住之前的“Hello\
    \ World”程序：\n\n```\nprint (\"Hello World\") ;\ninput (\"\\n\\nPlease press the\
    \ return key to close this window.\") ;\n```\n\n现在，我们不再硬––编码 \"Hello World\" 字符串，而是简单地将其声明为一个变量，并让程序输出该变量。最终结果看起来应该是这样的：`String\
    \ = \"Hello World\" ; print(string) ; input (\"\\n\\nPlease press the return key\
    \ to close this window.\") ;`\n\n它的输出结果与之前的程序相同，看起来类似于：\n\nHello World\nPlease\
    \ press the return key to close this window.\n\n# 第 3 章\n\n## Java 基础\n\n### Java\
    \ 开发包 (JDK)\n\n![C:\\Users\\Talha\\Downloads\\boitumelo-phetla-veQfS-T6ROs-unsplash.jpg](img/image.004.jpeg)\n\
    \nJDK 提供了构建、测试和监控健壮 Java 应用所需的工具。它允许开发者在 Java 编程操作期间访问软件组件并编译应用程序。例如，开发者需要一个 JDK\
    \ 驱动的环境来能够编写 applet 或实现方法。\n\n由于 JDK 在多程度上执行了软件开发工具包（SDK）的操作，人们很容易混淆这两项的范围和操作。虽然\
    \ JDK 专门用于 Java 编程语言，但 SDK 具有更广泛的适用性。但在程序开发环境中，JDK 仍然作为 SDK 的组件运行。这意味着开发者仍然需要\
    \ SDK 来提供具有更广泛操作特性的且在 JDK 领域内无法提供的某些工具。开发者文档、调试工具以及应用程序服务器，是 SDK 为 Java 编程环境提供的一些关键工具。\n\
    \nJDK 的部署范围取决于所处理任务的性质、支持的版本以及正在使用的 Java 版本。例如，Java 平台标准版（Java SE）开发包是为配合 Java\
    \ 标准版而设计的。\n\nJava 平台企业版（Java EE）和 Java 平台微型版（Java ME）是 JDK 的其他主要子集。这些 Java 版本的每个细节将在下面的子主题中详细描述。自\
    \ 2007 年上传到 OpenJDK 门户以来，JDK 一直是一个免费平台。它的开源状态促进了协作，并允许软件开发者社区克隆、修改或为改进和升级贡献想法。\n\
    \n#### Java SE\n\nJava SE 驱动了各种桌面和服务器应用程序。它支持在这些应用程序的开发环境中对 Java 编程语言进行测试和部署。与最近发布的\
    \ Java SE 相关的文档包括高级管理控制台功能和一套经过的 Java 部署规则。在编写此本书时，Java SE 13.0.1 是 Java SE 平台的最新\
    \ JDK 版本。\n\nJava SE SDK 配备了核心 JRE 能力，以及一组设计用于开发桌面应用程序的工具、类库和实现技术。这些工具范围从用于 Java\
    \ 程序实现的简单对象和类型，到适用于构建具有网络能力和不可破译的安全特性的应用程序的高级类参数。Java 程序员还可以在此特定 JDK 上开发 Java\
    \ 应用，以简化数据库访问或增强 GUI 属性。\n\n#### Java EE\n\nJava EE 平台是一个开源产品，通过全球 Java 社区成员的共同努力开发。Java\
    \ EE 与 Java SE 密切相关，因为前者构建在后者之上。这种特定的软件集成了设计用于企业解决方案的转型创新。新版本中引入的功能和进展通常反映了 Java\
    \ 社区成员的投入、需求和请求。Java EE 实际上提供了二十多种符合 Java 编程规范的实现。\n\nJava EE SDK 面用于构建大规模操作的应用程序。正如其名称所示，这种特定的\
    \ Java SDK 是为了给企业软件解决方案提供支持而创建的。该 JDK 提供了 Java 程序员构建可扩展和网络功能所需的强大 API 和运行时属性。需要开发分层应用的开发者也可以发现此\
    \ JDK 非常有用。\n\n在编写此书时，Java EE 8 是最新发布版本。Java EE 的修订设计为企业解决方案提供了增强的技术，以及用于安全和管理目的现代化应用程序。该版本具有多项进展，包括通过\
    \ Client、JSON Binding、Servlet 和 Security API 提供的更大的 REST API 能力。根据 Oracle 官方网站\
    \ 2019 年 12 月发布的信息，该版本还包含日期时间 API 和流 API。\n\n#### Java ME\n\n"
