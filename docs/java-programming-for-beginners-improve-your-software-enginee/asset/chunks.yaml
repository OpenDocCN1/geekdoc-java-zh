    \ that while you may change the object’s state, you will not be able to change\
    \ the reference. The `final` modifier is commonly paired with `static` to create\
    \ a class variable out of the constant value.\n    - **Final methods**: The `final`\
    \ keyword is used to prevent a method from being changed by subclasses.\n    -\
    \ **Final classes**: Prevents a class from being subclassed.\n"
