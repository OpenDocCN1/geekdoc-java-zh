    Type designations are single, upper case letters by convention. This contrasts
    sharply with the variable naming conventions you already understand about and
    with an excellent reason: it would be hard to say the distinction between a type
    variable and a normal class or object name without this convention.


    The most commonly used type parameter names are:


    * `E` - Element (used extensively by the Java Collections Framework)

    * `K` - Key

    * `N` - Number

    * `T` - Type

    * `V` - Value

    * `S`, `U`, `V`, etc.––2nd, 3rd, 4th types


    You''ll see these names used throughout the JDK and the API.


    ## Invoking and Instantiating a Generic Type


    To mention the generic box category within your system, a generic type invocation
    must be performed that brings `T` with a certain concrete value, such as `Integer`:


    ```

    Box<Integer> integerBox;

    ```


    You may believe that an invocation of a generic sort is comparable to a normal
    process invocation, but instead of adding an assertion to a procedure, you transfer
    a type argument—`Integer`, in this case––to the box category itself.


    Many designers interchangeably use the words "type parameter" and "type statement,"
    but not the same definitions. When coding, to generate a parameterized type, one
    offers sort arguments. The `T` in `Foo < T >` is, therefore, a type parameter,
    and the `Foo < String > f` is a type contention. In using these words, this class
    follows this concept.


    Like any other statement of variable, this software does not generate a fresh
    item of the box. It merely states that `integerBox` will have a reference to an
    "Integer Box," which is how it reads `Box < Integer>`. A generic type invocation
    is usually referred to as a parameterized type.


    To instantiate this class, use the `new` keyword, as usual, but place `<Integer>`
    between the class name and the parenthesis:


    ```

    Box<Integer> integerBox = new Box<Integer>();

    ```


    ## The Diamond


    In the latest versions of Java, you can replace the type arguments needed to invoke
    a generic class constructor with an empty set of type arguments (`< >`) as long
    as the compiler can determine, or infer from the context, the type arguments.
    This angle bracket couple, `< >`, is called “The Diamond loosely.” For example,
    you can use the previous declaration to generate an instance of `Box < Integer>`:
    `Box<Integer> integerBox = new Box<>();`


    ## Generic Methods


    Generic techniques are techniques which implement parameters of their own sort.
    This is similar to a generic type declaration, but the scope of the type parameter
    is limited to the method in which it is declared. In addition to generic class
    constructors, static and nonstatic generic techniques are permitted.


    The syntax for a generic technique involves a list of parameters of type inside
    angle brackets that appear before the return type of the procedure. The type parameter
    segment must occur before the return type of the method for static generic techniques.
    The `Util` class involves, compare, a generic technique comparing two `Pair` items.


    ```

    Pair<Integer, String> ex1 = new Pair<>(49, "string1"); Pair<Integer, String> ex2
    = new Pair<>(64, "string2"); boolean comparison = Util.<Integer, String>compare(ex1,
    ex2);

    ```


    ## Bounded Type Parameters


    Sometimes you want to limit the kinds that can be used in a parameterized type
    as form statements. For instance, a technique that works on figures could only
    recognize `Number` cases or its subclasses. That''s what limit parameters of the
    sort are for.


    List the name of the type parameter to indicate a defined type parameter, accompanied
    by the extension''s keyword, followed by the upper bound, which is `Number` in
    this instance. Note that `extends` is generally used in this context to mean either
    "extends" (as in courses) or "implements" (as in interfaces).


    ## Multiple Bounds


    Type parameters can have more than one bound. A type variable with multiple bounds
    is a subtype of all the types listed in the bound. If one of the bounds is a class,
    it must be specified first. For example:


    ```

    class X { /* ... */ } interface Y { /* ... */ } interface Z { /* ... */ }


    class R <T extends X & Y & Z> { /* ... */ }

    ```


    If bound `X` is not specified first, you get a compile-time error:


    ```java

    class R <T extends Y & X & Z> { /* ... */ } // compile-time error

    ```


    # Chapter 11: Collections


    ![C:\Users\Talha\Downloads\pexels-thisisengineering-3861943.jpg](image.038.jpeg)


    ## Functionalizing Collections


    We disclose every stage of the code when we externalize it. This is a defining
    feature of imperative programming. However, one of the recurring motifs of functional
    programming is the concept of doing the opposite: internalizing code. Internalizing
    code is the process of hiding details within a function. However, functional programming
    takes this concept a step farther by transforming daily programming micro-patterns
    into functions. One of those micro-patterns is iterating over data, whether via
    iterators, for-loops, or while-loops. Functional programming alters our perceptions
    of things.


    Java''s functionalization work would be incomplete until the Collections library,
    specifically the `Collection`, `Map`, `List`, and `Set` interfaces, were redesigned.
    This is due to the fact that iteration is frequently performed over collections
    which are the foundation of Java programs. It is a natural location for the functionalization
    endeavor to take place. However, any significant modifications, such as introducing
    new methods to the `Collection` interface, will break backward compatibility with
    all pre-Java 8 projects. This covers not just the JDK''s own hierarchy that extends
    the `Collection` interface, but also any open or closed source third-party library
    and in-house classes. Java''s designers have never used, and will never use, such
    a strategy. Nonetheless, adjustments were required; the library had been launched
    in 1998, eons in software industry years before, and was showing its age.


    The necessity to modernize and functionalize the Collections library prompted
    the introduction of default methods. Default methods are the perfect antidote
    since they allow behavior to be implemented at the root without disrupting dependent
    classes. Subclasses have the option of inheriting or overriding the behavior.
    Subclasses, unlike interface methods, can automatically accept new default methods
    without recompilation. There is instant compatibility. Parallelization is a recurring
    theme in functional programming. Simply put, functional programming is a better
    mousrap when it comes to parallel processing. As a result, the Collections library
    has been enhanced to take use of multi-core CPUs when processing collections.
    The Collections library, along with Streams, is in the forefront of bringing functional-style
    parallel processing to Java.


    We can now apply what we''ve learned about Java''s standard functional interfaces
    to Collections. Let''s have a look at what happened to the Collections library
    in Java 8.


    ### Collection interface


    We start by looking at a brand new default method in the `Collection` interface
    available to lists and sets. This is the `forEach()` method:


    ![](image.039.jpeg)


    This method iterates through the entire collection letting the `Consumer` decide
    what to do for each element. This is the concept of internal iteration and a manifestation
    of declarative programming. The details of how to iterate are not specified. This
    is in opposition to external iteration, where the details of how to iterate as
    well as what to do with each element are specified in code.

