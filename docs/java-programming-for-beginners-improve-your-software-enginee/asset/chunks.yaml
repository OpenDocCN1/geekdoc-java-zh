  trans: "\n\n接下来，我们需要创建两个类，一个名为 `Employee`，另一个名为 `EmployeeTest`。我们使用以下代码来实现这一目标——请记住\
    \ `Employee` 是类的名称，它是一个公共类（public class）。\n\n执行此操作并保存文件，命名为 `Employee.java`。\n\
    \n另外注意，这里有四个实例变量——`age`、`name`、`designation` 和 `salary`，以及一个显式定义并带有参数的构造函数：\n\n\
    ```java\npublic class Employee {\n    String name;\n    int age;\n    String designation;\n\
    \    double salary;\n\n    // 这是名为 Employee 的类的构造函数\n    public Employee(String\
    \ name) {\n        this.name = name;\n    }\n\n    // 我们将 Employee 的 age 赋值给变量\
    \ age。\n    public void empAge(int empAge) {\n        age = empAge;\n    }\n\n\
    \    /* 我们将 designation 赋值给变量 designation。*/\n    public void empDesignation(String\
    \ empDesig) {\n        designation = empDesig;\n    }\n\n    /* 我们将 salary 赋值给变量\
    \ salary。*/\n    public void empSalary(double empSalary) {\n        salary = empSalary;\n\
    \    }\n\n    /* 打印 Employee  */\n    public void printEmployee() {\n        System.out.println(\"\
    Name:\" + name);\n        System.out.println(\"Age:\" + age);\n        System.out.println(\"\
    Designation:\" + designation);\n        System.out.println(\"Salary:\" + salary);\n\
    \    }\n}\n```\n\n代码处理从 `main` 方法开始，因此你需要确保你的代码有一个 `main` 方法，并且我们需要创建一些对象。我们将首先创建一个名为\
    \ `EmployeeTest` 的类，这将创建 `Employee` 类的几个实例。必须调用每个对象的方法，以便将值赋值给变量。将此代码保存在 `EmployeeTest`\
    \ 中：\n\n```java\npublic class EmployeeTest {\n    public static void main(String\
    \ args[]) {\n        /* 使用构造函数创建两个对象 */\n        Employee empOne = new Employee(\"\
    Bobby Bucket\");\n        Employee empTwo = new Employee(\"Shelley Mary\");\n\n\
    \        // 调用我们创建的每个对象的方法\n        empOne.empAge(28);\n        empOne.empDesignation(\"\
    Senior Software Developer\");\n        empOne.empSalary(1500);\n        empOne.printEmployee();\n\
    \n        empTwo.empAge(22);\n        empTwo.empDesignation(\"Software Developer\"\
    );\n        empTwo.empSalary(850);\n        empTwo.printEmployee();\n    }\n}\n\
    ```\n\n现在需要编译这些类并运行 `EmployeeTest`；执行此操作并查看结果。\n\n你应该会看到：\n\n### 输出\n```\nC:\\\
    > javac Employee.java\nC:\\> javac EmployeeTest.java\nC:\\> java EmployeeTest\n\
    Name: Bobby Bucket\nAge:28\nDesignation: Senior Software Developer\nSalary:1850.000\n\
    Name: Shelley Mary\nAge:22\nDesignation: Software Developer\nSalary:850.00\n```\n\
    \n# 第 6 章：规范的工作代码示例\n\n![C:\\Users\\Talha\\Downloads\\pexels-thisisengineering-3861958\
    \ (1).jpg](img/image.007.jpeg)\n\n按照传统，每个人的第一个程序上都会打印“Hello World”。第一个程序展示了如何编写、保存和运行程序。它还演示了所有\
    \ Java 程序中使用的基本结构。\n\n这里是 Hello World 程序创建的窗口截图：\n\n![](img/image.008.jpeg)\n\n\
    ## 第 1 节：Java 项目与包\n\nJava 项目用于安排程序，随后 Java 项目中的包（packages）用于组织程序。对于书中的每个程序，你将建立一个\
    \ Java 项目。\n\n包包含通常配合使用的程序文件。因为书中的程序很小，你创建的大多数 Java 项目将只包含一个包。在本节中，你将为你的第一个程序创建一个\
    \ Java 项目和一个包。\n\n### 尝试一下\n创建你的第一个 Java 项目，命名为 `Hello World`：\n\n1. 如果 `Eclipse`\
    \ 没有打开：\n    1. 双击桌面上创建的 `Eclipse` 快捷方式。\n    2. 点击 `OK` 使用你的 Java 工作文件夹作为工作空间。\n\
    2. 在 `Package Explorer`（包管理器）面板中点击右键，并选择 `New/Java Project`（新建/Java 项目）。\n3. 将\
    \ Java 项目命名为 `Hello World`，如果版本是 `1.7` 或更高，则选择 `Use Default JRE`（使用默认 JRE），然后点击\
    \ `next`（下一步），如下图所示。如果默认 `JRE` 低于 `1.7`，选择 `Use an execution environment JRE`（使用执行环境\
    \ JRE）为 `1.7` 或更高。\n![](img/image.009.jpeg)\n4. 点击 `Libraries`（库），然后点击 `Add External\
    \ JARs...`（添加外部 JAR），如下图所示。\n![](img/image.010.jpeg)\n5. 浏览并选择安装在你的 Java 工作文件夹中的\
    \ `DIYJava.jar`，并点击 `Open`（打开）。\n6. 点击 `Finish`（完成）。\n\n`Package Explorer` 面板现在列出了一个项目（`Hello\
    \ World`）以及添加的 JAR 文件（`DIYJava.jar`），如图：\n![](img/image.011.jpeg)\n\n在 `Hello\
    \ World` 项目中为你的 `Hello World` 程序创建一个包：\n\n1. 右键点击 `Hello World` 项目并选择 `New/Package`（新建/包）。\n\
    2. 将包命名为 `____________.____________.helloworld`，如下所示。使用你的名字作为包的一部分。我使用了 `annette.godland.helloworld`\
    \ 作为包名。\n![](img/image.012.jpeg)\n3. 点击 `Finish`（完成）。\n\n`Package Explorer` 面板现在显示你在\
    \ `Hello World` 项目中创建的包，如图：\n![](img/image.013.jpeg)\n\n### 要点与更多\n* 在 `Package\
    \ Explorer`面板中点击右键创建 Java 项目和包。\n* 为每个程序创建一个不同的 Java 项目。\n* 创建项目时，将其命名为文件夹名称。\n\
    * 给你的 Java 项目起一个想要的名字。\n* 每个单词的首字母大写。\n* 包使用全小写且无空格。\n* 包名的不同类别之间使用点。\n* 创建 Java\
    \ 项目时，确保选择 `Use an execution environment JRE of 1.7 or higher`。\n* Java 项目用于 `Eclipse`;包用于\
    \ Java。\n\n## 第 2 节：类、父类与程序\n\nJava 程序由一个或多个类组成。类包含实际的程序代码：按顺序执行以所需的任务。\n\n每个类必须指定另一个类作为其父类（superclass）。例如，要在窗口中运行的程序必须指定某种窗口类作为其父类。\n\
    \n在本节中，你将创建你的第一个类：一个运行在 `DIYWindow` 中的程序。\n\n### 尝试一下\n使用 `DIYWindow` 类作为父类创建你的第一个类：\n\
    \n1. 在 `Package Explorer` 面板中右键点击你的包并选择 `New/Class`（新建/类）。\n2. 将类名命名为 `HelloWorld`，如下所示。（提示：“Hello”和“World”之间没有空格。）\n\
    3. 点击 `Browse for Superclass`（浏览父类）。\n4. 类型中输入 `diy`，选择 `DIYWindow`，如下所示，并点击 `OK`。\n\
    5. 你想创建哪些方法存根？选择这些选项，如下所示：\n    * `Public static void main (String[] args)`\n\
    \    * `Constructors from superclass`（来自父类的构造函数）\n    * 无论是否选择第三选项 `Inherit abstract\
    \ methods`（继承抽象方法）都没有影响。\n![](img/image.014.jpeg)\n"
