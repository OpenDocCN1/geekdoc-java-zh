    \n`ArrayDeque<T>` is the class implementation of a doubly ended queue. If we use\
    \ `add()`, `remove()` and `peek()` it will behave like a queue. (Moreover, if\
    \ we use `push()`, `pop()`, and `peekLast()` it behave like a stack.) Example:\n\
    \n```java\nimport java.util.ArrayDeque; \npublic class QueueDemo {\n    public\
    \ static void main(String[] args) {\n        ArrayDeque<Integer> que = new ArrayDeque<Integer>();\
    \ \n        que.add(1); que.add(2); que.add(3);\n        System.out.println(\"\
    Queue : \"+que);\n        System.out.println(\"Queue size : \"+que.size());\n\
