  trans: "\n\n`final` 修饰符用于防止其他类继承被声明为 `final` 类的任何特性。\n\n### Static（静态）\n用于创建类方法或变量。\n\
    \n你可以使用此关键字来创建一个唯一的变量（称为 `static variable` 或 `class variable`），该变量将独立于该类的其他实例而存在。你不能将局部变量声明为\
    \ `static`。\n\n你还可以使用 `static` 关键字来创建一个方法（称为 `static method` 或 `class method`），该方法将独立于该类的其他实例而存在。`Static`\
    \ 方法只识别并处理来自所给参数的数据，而不考虑变量。\n\n你可以通过在类名后写一个点（`.`）和变量名或方法名来访问类方法和类变量。\n\n### Abstract（抽象）\n\
    用于创建抽象方法或抽象类。\n\n#### 抽象类（Abstract class）\n当一个类被声明为 `abstract` 时，意味着你永远无法实例化该类。将一个类声明为\
    \ `abstract` 的唯一理由是为了扩展该类。你不能将一个类同时声明为 `final` 和 `abstract`，因为你就不可能扩展一个 `final`\
    \ 类。使用了 `abstract` 方法的类必须声明为 `abstract`。不这样做会导致编译错误。\n\n#### 抽象方法（Abstract method）\n\
    由于它在声明时没有实现，`abstract method` 的方法体派生自子类。`Abstract` 方法不能声明为严格的或 `final`。除非它本身也是一个\
    \ `abstract class`，否则扩展 `abstract class` 的类必须采用父类的 `abstract methods`。包含至少一个 `abstract\
    \ method` 的类应该声明为 `abstract class`。另一方面，`abstract class` 并不一定要有 `abstract` 方法。示例：\n\
    \n![](img/image.027.jpeg)\n\n### Synchronized（同步）\n`synchronized` 修饰符用于表示在任何给定时间内只有一个线程可以访问该方法。你可以将此关键字与任何访问级别修饰符一起。示例：\n\
    \n![](img/image.028.jpeg)\n\n### Volatile（易变的）\n此关键字用于表示访问 `volatile variable`\
    \ 的线程应该将其私有副本与存储在内存中的主副本进行合并。实际上，它将变量的所有缓存副本与主内存同步。你只能使用此修饰符来定义 `private` 或 `object`\
    \ 类型的实例变量。示例：\n\n![](img/image.029.jpeg)\n\n### Transient（瞬态的）\n`transient` 关键字用于告诉编译器在序列化包含标记变量的对象时跳过该实例变量。示例：\n\
    \n![](img/image.030.jpeg)\n\n# 第 8 章：决策与循环控制\n\n![C:\\Users\\Talha\\Downloads\\\
    pexels-jorge-jesus-614117 (1).jpg](img/image.031.jpeg)\n\n决策结构用于此类情况：如果条件为真，则必须执行一组指令；当条件被判定为假时，必须执行另一组指令。Java\
    \ 中提供了几种结构来用于编程此类场景。这些结构包括––\n\n#### If 语句（If statement）\n该语句用于需要测试条件的情况，如果发现条件为真，则需要执行紧随在该语句的代码块。该构造的语法为––\n\
    \n```java\nif(condition){\n    /*Body*/\n}\n```\n\n该构造的示例实现如下––\n```java\npublic\
    \ class ifDemo { \n    public static void main(String args[]) { \n        int\
    \ i = 10; \n        int j = 1; \n        if(i>j){\n            System.out.print(i);\
    \          \n        }        \n    }\n}\n```\n\n#### If else 语句（If else statement）\n\
    该语句用于需要测试条件的情况，如果发现条件为真，则执行紧随在该语句的代码块，否则执行 `else` 语句后的代码块。该构造的语法为––\n\n```java\n\
    if(condition){\n    /*Body*/\n}\nelse{\n    /*Body*/\n}\n```\n\n该构造的示例实现如下––\n\
    ```java\npublic class ifElseDemo { \n    public static void main(String args[])\
    \ { \n        int i = 1; \n        int j = 0; \n        if(i>j){\n           \
    \ System.out.print(i);          \n        } else{        \n            System.out.print(j);\
    \          \n        }\n    }\n}\n```\n\n#### 嵌套 if 语句（Nested if statement）\n\
    该语句用于需要测试条件的情况，如果发现条件为真，则执行紧随在该语句的代码块，否则测试下一个条件。如果发现此条件为真，则执行与该条件的 `if` 语句对应的代码块。如果没有任何条件被发现为真，则执行\
    \ `else` 语句后的代码块。可以使用嵌套的 `if` 语句测试多个条件。该构造的语法为––\n\n```java\nif(condition1) {\n\
    \    /*Body*/\n} else if (condition2) {\n    /*Body*/\n} else {\n    /*Body*/\n\
    }\n```\n\n该构造的示例实现如下––\n```java\npublic class nestedIfDemo { \n    public static\
    \ void main(String args[]) { \n        int i = 0; \n        int j = 0; \n    \
    \    if(i>j){\n            System.out.print(i);          \n        } else if(j>i)\
    \ {      \n            System.out.print(j);          \n        } else {\n    \
    \        System.out.print(\"Equal\");          \n        }\n    }\n}\n\n\n####\
    \ Switch\n当你有一个变量并且需要根据该变量的不同值执行不同的代码块时，使用的理想构造是 `switch` 语句。该构造的语法为––\n\n```java\n\
    switch(variable){\n    case value1: /*body*/ break;\n    case value2: /*body*/\
    \ break;\n    case value3: /*body*/ break;\n    default: /*body*/ break;\n}\n\
    ```\n\n该构造的示例实现如下––\n```java\npublic class switchDemo { \n    public static void\
    \ main(String args[]) { \n        int i = 5;\n        switch (i) { \n        \
    \    case 0: System.out.print(0); break;\n            case 2: System.out.print(2);\
    \ break;\n            case 5: System.out.print(5); break;\n            default:\
    \ System.out.print(999); break;\n        }\n    }\n}\n```\n\n#### 条件运算符（Conditional\
    \ Operator）\nJava 还支持条件运算符，称为 `?:` 运算符。该运算符用于替换 `if else` 构造。它的语法如下\n\n```\nExpression1?Expression2:Expression3\n\
    ```\n\n在这里，`Expression1` 是需要测试的条件。如果条件为真，执行 `Expression2`，否则执行 `Expression3`。\n\
    \n### 循环控制（Loop Control）\n在某些情况下，你需要迭代执行相同的指令。例如，如果你需要对一组数字排序，你需要多次扫描并重新排列这组数字。这种执行流被称为循环控制。\n\
    \n简单来说，循环是一种允许多次执行代码块的构造。Java 支持多种用于循环的构造。这些包括 `while loop`、`for loop` 和 `do while\
    \ loop`。\n\n`while loop` 迭代执行代码块，直到 `while loop` 指定条件为真。一旦该条件失败，`while loop` 停止。\n\
    \n`for loop` 允许程序员在同一个构造中操作条件和循环变量。因此，你可以初始化循环变量、对其进行增减并运行循环直到该条件为真。\n\n`do while\
    \ loop` 与 `while loop` 相似。但在 `while loop` 中是在执行代码块之前检查条件。而在 `do while loop` 中，先执行代码块，然后检查条件。如果满足条件，则重新启动循环执行，否则终止循环。\n\
    \n#### 循环语句（Loop statements）\n有两个关键字专门用于循环，并被称为控制语句，因为它们允许控制流从代码的一部分转移到另一个部分。\n\
    \n#### Break\n`break` 关键字用于循环内部，此时你希望执行流终止循环并直接从循环后的第一条指令开始执行。\n\n#### Continue\n\
    `continue` 关键字用于循环内部，此时程序员希望跳过循环的剩余部分并将控制转移到循环的第一条语句。\n\n"
- fmt: "\nIn order to help you understand how loops are executed, let us take an example\
    \ and implement it using all the three types of loop control.\n\n### For Loop\
    \ Implementation\n\n```java\npublic class forDemo { \n    public static void main(String\
    \ args[]) { \n        int [] numberArray = {100, 300, 500, 700, 900}; \n     \
    \   for(int i=0; i<5; i++) {            \n            System.out.print(numberArray[i]);\
    \          \n            System.out.print(\",\");        \n        }      \n \
    \       System.out.print(\"\\n\");        \n    }\n}\n```\n\n### While Loop Implementation\n\
    \n```java\npublic class whileDemo { \n    public static void main(String args[])\
    \ { \n        int [] numberArray = {100, 300, 500, 700, 900}; \n        int i\
    \ = 0; \n        while(i<5) {            \n            System.out.print(numberArray[i]);\
    \ \n            System.out.print(\",\"); \n            i++; \n        }      \n\
    \        System.out.print(\"\\n\");        \n    }\n}\n```\n\n### Do While Loop\
    \ Implementation\n\n```java\npublic class doWhileDemo { \n    public static void\
    \ main(String args[]) { \n        int [] numberArray = {100, 300, 500, 700, 900};\
    \ \n        int i = 0; \n        do {            \n            System.out.print(numberArray[i]);\
    \ \n            System.out.print(\",\");\n            i++;      \n        } while\
    \ (i<5);\n        System.out.print(\"\\n\");        \n    }\n}\n```\n\n### Enhanced\
    \ For Loop\n\nJava also supports an enhanced loop structure, which can be used\
    \ for array elements. The syntax for this loop construct is:\n\n```java\nfor(declaration\
    \ : expression) { /*Body*/ }\n```\n\nThe declaration part of the Enhanced `for`\
    \ loop is used to declare a variable. This variable shall be local to the `for\
    \ loop` and must have the same type as the type of the array elements. The current\
    \ value of the variable is always equal to the array element that is being traversed\
    \ in the loop. The expression is an array or a method call that returns an array.\n\
    \nSample implementation of the enhanced for loop has been given below:\n\n```java\n\
    public class forArrayDemo { \n    public static void main(String args[]) { \n\
    \        int [] numberArray = {100, 300, 500, 700, 900}; \n        for(int i :\
    \ numberArray ) {            \n            System.out.print( i );          \n\
    \            System.out.print(\",\");      \n        }      \n        System.out.print(\"\
    \\n\");        \n    }\n}\n```\n\n### Exception Hierarchy\n\nJava has an inbuilt\
    \ class named `java.lang.Exception` and all the exceptions fall under this class.\
    \ All the exception classes are subclasses of this class. Moreover, the `Throwable`\
    \ class is the superclass of the exception class. Another subclass of the `Throwable`\
    \ class is the `Error` class. All the errors like stack overflow described above\
    \ fall under this `Error` class.\n\nThe `Exception` class has two subclasses,\
    \ namely `RuntimeException` class and `IOException` class. A list of the methods,\
    \ for which definitions are available in Java, as part of the `Throwable` class,\
    \ is given below:\n\n```java\npublic String getMessage()\n```\nWhen called, this\
    \ message returns a detailed description of the exception that has been encountered.\n\
    \n```java\npublic Throwable getCause()\n```\nThis method, when called returns\
    \ a message that contains the cause of the exception.\n\n```java\npublic String\
    \ toString()\n```\nThis method returns the detailed description of the exception\
    \ concatenated with the name of the class.\n\n```java\npublic void printStackTrace()\n\
    ```\nThe result of `toString()`, along with a trace of the stack, can be printed\
    \ to the standard error stream, `System.err`, can be done by calling this method.\n\
    \n```java\npublic StackTraceElement [] getStackTrace()\n```\nThere may be some\
    \ scenarios where you may need to access different elements of the stack trace.\
    \ This method returns an array, with each element of the stack trace saved to\
    \ different elements of the array. The first element of the array contains the\
    \ top element of the stack trace, while the bottom of the stack trace is saved\
    \ to the last element of the array.\n\n```java\npublic Throwable fillInStackTrace()\n\
    ```\nAppends the previous information in the stack trace with the current contents\
    \ of the stack trace and returns the same as an array.\n\n### Catching Exceptions\n\
    \nThe standard method to catch an exception is using the `try` and `catch` keywords\
    \ along with their code implementations. This `try` and `catch` block needs to\
    \ be implemented in such a manner that it encloses the code that is expected to\
    \ raise an exception. It is also important to mention here that the code that\
    \ is expected to raise an exception is termed as protected code. The syntax for\
    \ `try` and `catch` block implementation is as follows:\n\n```java\ntry { /*Protected\
    \ code*/ } catch(ExceptionName exc1) { /*Catch code*/ }\n```\n\nThe code that\
