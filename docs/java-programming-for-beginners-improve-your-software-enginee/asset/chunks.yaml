    \ create an object: `ObjectName = New Constructor();`.\n2. Next, call a variable\
    \ like: `ObjectName.variableName;`.\n3. To call a class method: `ObjectName.MethodName();`.\n\
    \n## Java Package\nA package is simply a way of grouping interfaces and classes.\
    \ A Java package serves as container for classes. The usual basis for grouping\
    \ is functionality. The use of packages facilitates code reusability. When interfaces\
    \ and classes are categorized into packages, you can easily access them for use\
    \ in other programs. The use of packages also helps prevent name conflicts among\
    \ classes and interfaces.\n\nTo create a package, use the `package` statement\
    \ before the package name as the first statement.\n\n![](image.024.jpeg)\nHere’s\
    \ an example:\n\n### Import Statement\nYou may use the `import` keyword to import\
