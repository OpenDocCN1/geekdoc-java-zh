    \ The release features several advancements that included greater REST API capabilities\
    \ provided through the Client, JSON Binding, Servlet, and Security APIs. This\
    \ version also features the Date and Time API as well as the Streams API, according\
    \ to information published in the Oracle Corporate website as of December 2019.\n\
    \n#### Java ME\n"
