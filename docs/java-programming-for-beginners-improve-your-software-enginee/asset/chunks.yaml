    \ programs are made up of classes. Every program requires a main() method in one\
    \ of its classes.              \n\n*   The main() method must be written as public\
    \ static void main(String[] args). Later lessons will explain what all those words\
    \ mean.\n\n*   Multiple classes are often used together to create one program.\n\
    \n*   However, most of the programs in this book will be made of only one class.\n\
    \n*   Every class must have a superclass. Any class can be used as a superclass.\
    \ You'll create your own superclass in a later lesson.\n\n*   Classes with the\
