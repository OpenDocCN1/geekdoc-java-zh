  trans: "\n\n# 在编辑器中编写程序\n\n![C:\\Users\\Talha\\Downloads\\altumcode-FoTs3ntRoIs-unsplash\
    \ (1).jpg](img/image.005.jpeg)\n\n要编写程序，你可以使用简单的编辑器，如记事本（Notepad），也可以使用功能齐全的集成开发环境（IDE）。以下是一些适用于\
    \ Java 的流行 IDE 列表及其相关功能。\n\n## Eclipse\n\n这个 IDE 已经存在很长时间，在 Java 开发社区中非常流行并广泛使用。该\
    \ IDE 的一些核心功能包括：\n\n* 它是免费开源的。因此，有许多开发者不断为该 IDE 贡献代码。\n* 可以用于开发 C++、Ruby、HTML5\
    \ 和 PHP 等语言的应用程序。\n* 它拥有丰富的客户端平台。\n* 它提供了重构代码的能力。\n* 它有助于代码自动补全。\n* 它有各种扩展和插件。\n\
    * 它还支持大多数源代码版本控制系统。\n\n## IntelliJ IDEA\n\n这是 Java 开发社区使用的另一个流行的 IDE。该 IDE 的一些核心功能包括：‌\n\
    \n* 社区版是免费且开源的。\n* 付费版提供了更多功能，并允许开发者使用 Java 企业版构建企业级应用程序。\n* 它提供了重构代码的能力。\n* 它有助于代码自动补全。\n\
    * 它有各种扩展和插件。\n* 它还支持大多数源代码版本控制系统。\n\n## Netbeans\n\nNetBeans 是 Java 语言初学者非常推荐的\
    \ IDE。它是一个强大且快速的 IDE，支持所有 Java 平台以及移动应用程序。它运行在 Windows、Linux、Mac OS X 和 Solaris\
    \ 等多种平台上。它还支持 HTML5、C/C++ 和 PHP 等语言。\n\n## Java 的优点\n\n* Java 得益于其用于学习、编写、部署和实现的人性友好界面，它体现了编程的简单性。\n\
    * Java 的核心架构设计旨在便于在开发环境中进行集成集成和方便使用。\n* Java 是平台无关且易于移植的，适用于多任务处理和跨软件应用程序的使用。\n\
    * Java 的面向对象特性支持创建具有标准功能和可以重新部署代码的程序。\n* Java 的网络能力让程序员更容易为共享计算环境创建软件解决方案。\n*\
    \ Java 与 C++ 以及 C 语言之间的紧密关系使得任何具备其他两种语言知识的人都更容易学习 Java。\n* Java 的自动垃圾回收提供了持续的内存保护，方便程序员在编写代码时消除安全漏洞。\n\
    * Java 的架构对于多线程程序的实现具有灵活性。\n* 得益于使用接口或继承特性重新部署类的能力，Java 是非常易于复用的。\n\n## Java 的缺点\n\
    \n* 由于 Java 并不是原生应用程序，与其他编程语言相比，它的运行速度较慢。\n* Java 在图形的处理和显示上可能缺乏一致性。例如，基于 Java\
    \ 的应用程序中图形用户界面（GUI）的普通外观与原生软件应用程序的 GUI 输出相比大不同且标准较低。\n* Java 的垃圾回收（一种管理内存效率的功能）在作为后台程序运行时，可能会干扰速度和性能。\n\
    \n# 第 5 章\n\n## 对象与类\n\n![C:\\Users\\Talha\\Downloads\\pexels-antonio-batinić-4164418.jpg](img/image.006.jpeg)\n\
    \n最后，我们将查看类和对象；\n\nJava 中的对象必须有一个状态（状态将存储在字段（field）中）以及由方法（method）指示的行为。\n\n类是一种地图，或者说如果你愿意，是一个蓝图，根据它创建对象。类看起来像这样：\n\
    \n```java\npublic class Dog { String breed; int ageC; String color; void barking()\
    \ {\n\n } void whining() {\n\n } void sleeping() {\n\n }\n\n}\n```\n\n类可以拥有以下任何类型的变量：\n\
    \n* 局部变量（Local）：定义在构造函数、块或方法内部。该变量在方法内部声明并初始化，并在方法结束时销毁。\n* 实例变量（Instance）：定义在类中但在方法之外。在类实例化的发生时初始化，并可以从类内部的任何构造函数、块或方法进行访问。\n\
    * 类变量（Class）：声明在类内部，使用 `static` 关键字，且定义在任何方法之外。\n\n类可以有多个方法，数量取决于访问方法中所有不同类型值的需要。在我们上面的示例中，我们有了三个方法——`barking()`、`whining()`\
    \ 和 `sleeping()`。\n\n### 构造函数\n\n每个类都将有一个构造函数；如果你省略了它，编译器将构建一个默认的。当你创建一个新对象时，必须调用一个构造函数。按照规则，构造函数的名称必须与类名相同，并且可以根据类的需要拥有任意数量的构造函数。构造函数看起来如下：\n\
    \n```java\npublic class Puppy { public Puppy() { public Puppy(String name) { }\
    \ }\n```\n\n### 创建对象\n\n我们已经知道类是某种用于创建对象的蓝图，所以不用说说对象是会被创建的。要创建一个新对象，我们需要 `new`\
    \ 关键字。创建一个对象所需的三个步骤是：\n\n* 声明（Declaration）——必须用名称和类型声明变量。\n* 实例化（Instantiation）——使用\
    \ `new` 关键字进行创建。\n* 初始化（Initialization）——调用构造函数。\n\n下一个示例显示了如何创建对象：\n\n```java\n\
    public class Puppy { Puppy(String name) { System.out.println(\"Passed Name is\
    \ :\" + name); } public static void main(String [] ) { Puppy myPuppy = new Puppy(\"\
    fluffy\"); } }\n```\n\n### 访问变量和方法\n\n当我们访问变量和方法时可以使用对象；此示例显示了如何访问实例变量：\n\n```java\n\
    /* 首先创建对象 */\nObjectReference = new Puppy();\n/* 现在这样调用我们的变量 */\nObjectReference.variableName;\n\
    /* 现在这样调用类方法 */\nObjectReference.MethodName();\n```\n\n接下来，我们看到类中的实例变量和方法是如何访问的：\n\
    \n```java\npublic class Puppy { int PuppyAge; Puppy(String name) { System.out.println(\"\
    Name chosen is :\" + name); } public void setAge(int age) { PuppyAge = age; }\
    \ public int getAge() { System.out.println(\"Puppy's age is :\" + PuppyAge); return\
    \ PuppyAge; } public static void main(String[] args) { Puppy myPuppy = new Puppy(\"\
    fluffy\"); // 现在我们调用类方法设置 Puppy 的年龄 myPuppy.setAge(2); // 接下来，我们调用另一个类方法获取 Puppy\
    \ 的年龄 myPuppy.getAge(); // 我们这样访问实例变量 System.out.println(\"Variable Value :\"\
    \ + myPuppy.PuppyAge); } }\n```\n\n"
