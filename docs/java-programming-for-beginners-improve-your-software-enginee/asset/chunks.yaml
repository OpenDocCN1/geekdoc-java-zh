  trans: "\n\n在现实世界中，你会遇到如人类、狗、汽车和猫等对象。这些对象拥有状态和行为。例如，当你想到一只猫时，它的状态可能包括它的品种、颜色或名字。它的行为可能包括跑步、跳跃或摇摇尾巴。\n\
    \n软件对象在这些特征上与现实对象相似。它的状态存储在字段（fields）中，而它的行为通过方法（methods）表现。\n\n在开发过程中，方法是在对象的内部状态上执行的，并且方法有助于对象之间的通信。\n\
    \n## 类 (Classes)\n\n![](img/image.020.jpeg)\n类用于定义对象的规范。这些规范作为创建对象的蓝图。虽然在创建类时它们不会立即应用，但当类的对象被实例化时，这些定义是可用的。一个对象或类在程序中可以有多个副本或实例。\n\
    \n以下是一个名为 `Cat` 的类的定义示例：\n\n一个类可以包含以下类型的变量：\n\n### 类变量\n类变量是在类内部使用 `static` 修饰符声明且在任何方法之外声明的变量。\n\
    \n### 局部变量\n局部变量是定义在方法、块或构造函数内部的变量。这些变量在方法内部声明并实例化，一旦方法执行完毕就会被销毁。\n\n### 实例变量\n\
    实例变量是位于类内部但在方法之外的变量。它们在类创建的同时进行初始化。可以从该特定类的方法、块或构造函数访问。\n\n一个类可以包含任意数量的方法获取所需的值。例如，`Cat`\
    \ 类有三个方法：`running()`、`sleeping()` 和 `jumping()`。\n\n## 构造函数 (Constructors)\n构造函数是一种用于初始化对象的方法。一个类必须包含至少一个构造函数。\n\
    \n以下是构造函数的重要规则：\n- 构造函数的名称应与类名匹配。\n- 它不有显式的返回类型。\n\n### 构造函数的类型\n- 默认构造函数或无参构造函数\n\
    - 参数构造函数\n- 默认构造函数\n\n没有参数的构造函数称为默认构造函数。\n\n![](img/image.021.jpeg)\n这是语法：\n\n\
    ### 参数构造函数\n参数构造函数是带有参数的构造函数。它被用于为特定对象提供值。\n\n下面的示例展示了两种构造函数。第一个是默认构造函数，它没有任何参数。第二个构造函数有一个参数\
    \ `name`。\n\n![](img/image.022.jpeg)\n\n## 创建对象 (Creating Objects)\n类提供了对象的模板。对象基本上是从类创建的。要创建新对象，你将使用\
    \ `new` 关键字。\n\n从类创建新对象需要采取以下步骤：\n1. **声明 (Declaration)**：指的是变量声明，你在其中编写变量名及其对象类型。\n\
    2. **实例化 (Instantiation)**：为了创建一个新对象，你将使用 `new` 关键字。\n3. **初始化 (Initialization)**：`new`\
    \ 关键字之后调用构造函数并初始化新对象。\n\n![](img/image.023.jpeg)\n下面的示例展示了从类创建新对象的不同步骤：\n\n以下是输出：\n\
    Passed Name is: spotty\n\n## 如何访问方法和实例变量\n创建的对象用于访问方法和实例变量。访问实例变量，你将使用这些步骤：\n\
    1. 首先，你必须创建一个对象：`ObjectName = New Constructor();`。\n2. 接下来，调用变量：`ObjectName.variableName;`。\n\
    3. 调用类方法：`ObjectName.MethodName();`。\n\n## Java 包 (Package)\n包仅仅是接口和类分组的一种方式。Java\
    \ 包作为类的容器。分组的通常依据是功能。包的使用有助于代码的可重用。当接口和类分类到包中时，你可以轻松地访问它们并在其他程序中使用。使用包还有助于防止类和接口之间的命名冲突。\n\
    \n要创建一个包，请在包名之前使用 `package` 语句作为第一条语句。\n\n![](img/image.024.jpeg)\n这是一个示例：\n\n\
    ### 导入语句 (Import Statement)\n你可能使用 `import` 关键字将包导入到你的源文件中。导入语句使编译器能够轻松找到类或源代码的位置。\n\
    \n你可能只想从包中导入某一个类。你可以使用点运算符 `.` 来指示包和类。例如：\n![](img/image.025.jpeg)\n要从一个包中导入所有类，你可以在点运算符之后使用通配符\
    \ `*`。例如：\n![](img/image.026.jpeg)\n\n## 修饰符 (Modifiers)\n修饰符是改变你代码中定义含义的关键字。Java\
    \ 提供了多种修饰符。\n\n### 访问修饰符 (Access Modifiers)\n访问修饰符用于定义方法、变量、类和构造函数的访问级别。\n\n-\
    \ **Private**：仅在类内部可见。当方法、变量、类或构造函数被声明为 `private` 时，意味着它仅在类内部可用。然而，如果该类有公共的 getter\
    \ 方法，你可能可以在类外部访问私有变量。`private` 关键字表示最高的访问限制。注意，你不能将接口和类声明为 `private`。\n- **Public**：对世界上可见。被定义为\
    \ `public` 的方法、接口、构造函数、类等可以从其他类访问。同样，定义在 `public` 类内部的块、方法或字段可以从 Java 类中访问。只要它们在同一个包中，这一点就是成立的。如果你想从另一个包访问公共类，你将必须导入该公共类。\n\
    - **Protected**：对子类和包可见。将方法、变量或构造函数声明为 `protected` 会使得它仅对所在包内的类或另一个包中的子类可见。这种访问类型用于允许子类使用，并防止无关类使用它们。接口及其字段和方法不应声明为\
    \ `protected`，但接口外的字段和方法可以声明为 `protected`。\n- **Default**（默认）：当未提供修饰符时适用——对包可见。未声明修饰符的方法或变量可以被包内的其他类访问。\n\
    \n下表总结了不同的访问修饰符及其影响：\n\n| 修饰符 | 类内 | 包内 | 包外类 | 包外 |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| Private | Y | N | N | N |\n| Public | Y | Y | Y | Y |\n| Protected\
    \ | Y | Y | Y | N |\n| Default | Y | Y | N | N |\n\n### 非访问修饰符 (Non-access Modifiers)\n\
    非访问修饰符可用于访问 Java 中的各种功能。\n\n- **Final**：用于固定变量、方法和类的实现。\n    - **Final 变量**：你只能显式地初始化一次\
    \ final 变量。当你声明变量为 `final` 时，你将永远无法重新赋值为另一个对象。请注意，你仍然可以更改存储在对象内部的数据。这意味着虽然你可以更改对象的状态，但无法更改引用。`final`\
    \ 修饰符通常与 `static` 配合使用，以根据常量值创建类变量。\n    - **Final 方法**：`final` 关键字用于防止子类更改方法。\n\
    \    - **Final 类**：防止类被子类化。\n\n"
- fmt: "\nThe `final` modifier is used to prevent other classes from inheriting any\
    \ feature from the class declared as a `final` class.\n\n### Static\nused to create\
    \ class methods or variables.\n\nYou can use this keyword to create a unique variable\
    \ (called a `static variable` or `class variable`) that will exist independently\
    \ from other instances of the class. You cannot declare a local variable as `static`.\n\
    \nYou can also use the `static` keyword to create a method (called a `static method`\
    \ or `class method`) that will exist independently from other instances of the\
    \ class. `Static` methods recognize and work only on data from the arguments given\
    \ without considering variables.\n\nYou may access class methods and class variables\
    \ by writing the variable or method name after the class name and a dot (`.`).\n\
    \n### Abstract\nused to create abstract methods or classes\n\n#### Abstract class\n\
    When a class is declared as `abstract`, it means that you will never be able to\
    \ instantiate the class. The only reason for declaring a class as `abstract` is\
    \ to extend the class. You cannot declare a class to be both `final` and `abstract`,\
    \ as you can’t possibly extend a `final` class. A class that uses `abstract` methods\
    \ will have to be declared as `abstract`. Failure to do so will result in compile\
    \ errors.\n\n#### Abstract method\nAs it is declared with no implementation, an\
    \ `abstract method` derives its methods body from the subclass. `Abstract` methods\
    \ cannot be declared as strict or `final`. Unless it is also an `abstract class`,\
    \ a class extending an `abstract class` must adopt the `abstract methods` of the\
    \ superclass. A class that contains at least one `abstract method` should be declared\
    \ as an `abstract class`. On the other hand, an `abstract class` need not have\
    \ `abstract` methods. Example:\n\n![](image.027.jpeg)\n\n### Synchronized\nThe\
    \ `synchronized` modifier is used to indicate that only one thread can access\
    \ a method at any given time. You can use this keyword with any access level modifier.\
    \ Example:\n\n![](image.028.jpeg)\n\n### Volatile\nThis keyword is used to indicate\
    \ that a thread accessing a `volatile variable` should merge its private copy\
    \ with the master copy stored in memory. In effect, it synchronizes all cached\
    \ copies of the variable with the main memory. You may only use this modifier\
    \ to define instance variables of the `private` or `object` type. Example:\n\n\
    ![](image.029.jpeg)\n\n### Transient\nThe keyword `transient` is used to tell\
    \ the compiler to skip an instance variable when it is serializing the object\
    \ that contains the marked variable. Example:\n\n![](image.030.jpeg)\n\n# Chapter\
    \ 8: Decision Making and Loop Control\n\n![C:\\Users\\Talha\\Downloads\\pexels-jorge-jesus-614117\
    \ (1).jpg](image.031.jpeg)\n\nThe decision making structures are used in situations\
    \ where a set of instructions have to be executed if the condition is true and\
    \ another set of instructions have to be executed when the condition is determined\
    \ to be false. There are several constructs available in Java for programming\
    \ such scenarios. These structures include––\n\n#### If statement\nThis statement\
    \ is used in situations where a condition needs to be tested, and if the condition\
    \ is found true, the block of code that follows this statement needs to be executed.\
    \ The syntax for this construct is––\n\n```java\nif(condition){\n    /*Body*/\n\
    }\n```\n\nSample implementation for this construct is given below––\n```java\n\
    public class ifDemo { \n    public static void main(String args[]) { \n      \
    \  int i = 10; \n        int j = 1; \n        if(i>j){\n            System.out.print(i);\
    \          \n        }        \n    }\n}\n```\n\n#### If else statement\nThis\
    \ statement is used in situations where a condition needs to be tested, and if\
    \ the condition is found true, the block of code that follows this statement needs\
    \ to be executed else the block of code that follows the `else` statement is executed.\
    \ The syntax for this construct is––\n\n```java\nif(condition){\n    /*Body*/\n\
    }\nelse{\n    /*Body*/\n}\n```\n\nSample implementation for this construct is\
    \ given below––\n```java\npublic class ifElseDemo { \n    public static void main(String\
    \ args[]) { \n        int i = 1; \n        int j = 0; \n        if(i>j){\n   \
    \         System.out.print(i);          \n        } else{        \n          \
    \  System.out.print(j);          \n        }\n    }\n}\n```\n\n#### Nested if\
    \ statement\nThis statement is used in situations where a condition needs to be\
    \ tested, and if the condition is found true, the block of code that follows this\
    \ statement needs to be executed else the next condition is tested. If this condition\
    \ is found true, the block of code corresponding to the `if` statement for this\
    \ condition is executed. If none of the conditions are found true, the block of\
    \ code that follows the `else` statement is executed. Multiple conditions can\
    \ be tested using the nested `if` statements. The syntax for this construct is––\n\
    \n```java\nif(condition1) {\n    /*Body*/\n} else if (condition2) {\n    /*Body*/\n\
    } else {\n    /*Body*/\n}\n```\n\nSample implementation for this construct is\
    \ given below––\n```java\npublic class nestedIfDemo { \n    public static void\
    \ main(String args[]) { \n        int i = 0; \n        int j = 0; \n        if(i>j){\n\
    \            System.out.print(i);          \n        } else if(j>i) {      \n\
    \            System.out.print(j);          \n        } else {\n            System.out.print(\"\
    Equal\");          \n        }\n    }\n}\n```\n\n#### Switch\nIf you have a variable\
    \ and different blocks of code need to be executed for different values of that\
    \ variable, the ideal construct that can be used is the `switch` statement. The\
    \ syntax for this construct is––\n\n```java\nswitch(variable){\n    case value1:\
    \ /*body*/ break;\n    case value2: /*body*/ break;\n    case value3: /*body*/\
    \ break;\n    default: /*body*/ break;\n}\n```\n\nSample implementation for this\
    \ construct is given below––\n```java\npublic class switchDemo { \n    public\
    \ static void main(String args[]) { \n        int i = 5;\n        switch (i) {\
    \ \n            case 0: System.out.print(0); break;\n            case 2: System.out.print(2);\
    \ break;\n            case 5: System.out.print(5); break;\n            default:\
    \ System.out.print(999); break;\n        }\n    }\n}\n```\n\n#### Conditional\
    \ Operator\nJava also supports the conditional operator, which is also known as\
    \ `?:` operator. This operator is used to replace the `if else` construct. Its\
    \ syntax is as follows\n\n```java\nExpression1?Expression2:Expression3\n```\n\n\
    Here, `Expression1` is the condition that is to be tested. If the condition is\
    \ true, `Expression2` is executed else `Expression3` is executed.\n\n### Loop\
    \ Control\nThere are several situations that require you to iterate the same set\
    \ of instructions a number of times. For instance, if you need to sort a set of\
    \ numbers, you will need to scan and rearrange the set several times to get the\
    \ desired arrangement. This flow of execution is known as loop control.\n\nSimply,\
    \ a loop is a construct that allows the execution of a block of code many times.\
    \ Java supports several constructs that can be used for loops. These include a\
    \ `while loop`, `for loop`, and `do while loop`.\n\n`while loop` executes a block\
    \ of code iteratively until the condition specified for the `while loop` is true.\
    \ The moment this condition fails, `while loop` stops.\n\n`for loop` allows the\
    \ programmer to manipulate the condition and loop variable in the same construct.\
    \ Therefore, you can initialize a loop variable, increment/decrement it, and run\
    \ the loop until a condition on this variable is true.\n\n`do while loop` is similar\
    \ to `while loop`. However, in the `while loop`, the condition is checked before\
    \ executing the block code. On the other hand, in a `do while loop`, the block\
    \ of code is executed, and then the condition is checked. If the condition is\
    \ satisfied, the loop execution is again initiated else the loop is terminated.\n\
    \n#### Loop statements\nThere are two keywords that are specifically used in connection\
    \ with loops and are also termed as control statements as they allow transfer\
    \ of control from one section of the code to a different section.\n\n#### Break\n\
    The `break` keyword is used inside the loop at a point where you want the execution\
    \ flow to terminate the loop and directly start execution from the first instruction\
    \ that appears after the loop.\n\n#### Continue\nThe `continue` keyword is used\
    \ inside the loop at a point where the programmer wants to overlook the rest of\
    \ the loop and move the control to the first statement of the loop.\n"
  raw: 'The final modifier is used to prevent other classes from inheriting any feature
    from the class declared as a final class.


    Static––used to create class methods or variables.


    You can use this keyword to create a unique variable (called a static variable
    or class variable) that will exist independently from other instances of the class.
    You cannot declare a local variable as static.


    You can also use the static keyword to create a method (called a static method
    or class method) that will exist independently from other instances of the class.
    Static methods recognize and work only on data from the arguments given without
    considering variables.


    You may access class methods and class variables by writing the variable or method
    name after the class name and a dot (.).


    Abstract––used to create abstract methods or classes


    Abstract class


    When a class is declared as abstract, it means that you will never be able to
    instantiate the class. The only reason for declaring a class as abstract is to
    extend the class. You cannot declare a class to be both final and abstract, as
    you can’t possibly extend a final class. A class that uses abstract methods will
    have to be declared as abstract. Failure to do so will result in compile errors.


    Abstract method


    As it is declared with no implementation, an abstract method derives its methods
    body from the subclass. Abstract methods cannot be declared as strict or final.
    Unless it is also an abstract class, a class extending an abstract class must
    adopt the abstract methods of the superclass. A class that contains at least one
    abstract method should be declared as an abstract class. On the other hand, an
    abstract class need not have abstract methods. Example:


    ![](image.027.jpeg)


    Synchronized


    The synchronized modifier is used to indicate that only one thread can access
    a method at any given time. You can use this keyword with any access level modifier.
    Example:


    ![](image.028.jpeg)


    Volatile


    This keyword is used to indicate that a thread accessing a volatile variable should
    merge its private copy with the master copy stored in memory. In effect, it synchronizes
    all cached copies of the variable with the main memory. You may only use this
    modifier to define instance variables of the private or object type. Example:


    ![](image.029.jpeg)


    Transient


    The keyword transient is used to tell the compiler to skip an instance variable
    when it is serializing the object that contains the marked variable. Example:


    ![](image.030.jpeg)


    Chapter 8


    Decision Making and Loop Control


     ![C:\Users\Talha\Downloads\pexels-jorge-jesus-614117 (1).jpg](image.031.jpeg)


    The decision making structures are used in situations where a set of instructions
    have to be executed if the condition is true and another set of instructions have
    to be executed when the condition is determined to be false. There are several
    constructs available in Java for programming such scenarios. These structures
    include––


    If statement


    This statement is used in situations where a condition needs to be tested, and
    if the condition is found true, the block of code that follows this statement
    needs to be executed. The syntax for this construct is–– if(condition){


    /*Body*/


    }


    Sample implementation for this construct is given below–– public class ifDemo
    { public static void main(String args[]) { int i = 10; int j = 1; if(i>j){


    System.out.print(i);         


    }       


    }


    }


    If else statement


    This statement is used in situations where a condition needs to be tested, and
    if the condition is found true, the block of code that follows this statement
    needs to be executed else the block of code that follows the else statement is
    executed. The syntax for this construct is–– if(condition){


    /*Body*/


    }


    else(


    /*Body*/


    }


    Sample implementation for this construct is given below–– public class ifElseDemo
    { public static void main(String args[]) { int i = 1; int j = 0; if(i>j){


    System.out.print(i);         


    } else{       


    System.out.print(j);         


    }


    }


    }


    Nested if statement


    This statement is used in situations where a condition needs to be tested, and
    if the condition is found true, the block of code that follows this statement
    needs to be executed else the next condition is tested. If this condition is found
    true, the block of code corresponding to the if statement for this condition is
    executed. If none of the conditions are found true, the block of code that follows
    the else statement is executed. Multiple conditions can be tested using the nested
    if statements. The syntax for this construct is–– if(condition1) {


    /*Body*/


    } else if (condition2) (


    /*Body*/


    } else {


    /*Body*/


    }


    Sample implementation for this construct is given below–– public class nestedIfDemo
    { public static void main(String args[]) { int i = 0; int j = 0; if(i>j){


    System.out.print(i);         


    } else if(j>i) {       


    System.out.print(j);         


    } else {


    System.out.print("Equal");         


    }


    }


    }


    Switch


    If you have a variable and different blocks of code need to be executed for different
    values of that variable, the ideal construct that can be used is the switch statement.
    The syntax for this construct is–– switch(variable){ case <value1>: /*body*/ break;
    case <value2>: /*body*/ break; case <value3>: /*body*/ break; default: /*body*/
    break;


    }


    Sample implementation for this construct is given below–– public class switchDemo
    { public static void main(String args[]) { int i = 5;


    switch (i) { case 0: System.out.print(0); break; case 2: System.out.print(2);
    break; case 5: System.out.print(5); break; default: System.out.print(999); break;
    }


    }


    }


    Conditional Operator


    Java also supports the conditional operator, which is also known as the?: operator.
    This operator is used to replace the ‘if else’ construct. Its syntax is as follows––


    Expression1? Expression2: Expression3


    Here, Expression1 is the condition that is to be tested. If the condition is true,
    Expression2 is executed else Expression3 is executed.


    Loop Control


    There are several situations that require you to iterate the same set of instructions
    a number of times. For instance, if you need to sort a set of numbers, you will
    need to scan and rearrange the set several times to get the desired arrangement.
    This flow of execution is known as loop control.


    Simply, a loop is a construct that allows the execution of a block of code many
    times. Java supports several constructs that can be used for implementing loops.
    These include a while loop, for loop, and do while loop.


    A while loop executes a block of code iteratively until the condition specified
    for the while loop is true. The moment this condition fails, while loop stops.


    For loop allows the programmer to manipulate the condition and loop variable in
    the same construct. Therefore, you can initialize a loop variable, increment/decrement
    it, and run the loop until a condition on this variable is true.


    Do while loop is similar to while loop. However, in the while loop, the condition
    is checked before executing the block code. On the other hand, in a do while loop,
    the block of code is executed, and then the condition is checked. If the condition
    is satisfied, the loop execution is again initiated else the loop is terminated.
    It would not be wrong to state that the do while loop, once implemented, will
    execute at least once.


    Loop statements


    There are two keywords that are specifically used in connection with loops and
    are also termed as control statements as they allow transfer of control from one
    section of the code to a different section.


    These keywords are––


    Break


    This keyword is used inside the loop at a point where you want the execution flow
    to terminate the loop and directly start execution from the first instruction
    that appears after the loop.


    Continue


    This keyword is used inside the loop at a point where the programmer wants the
    computer to overlook the rest of the loop and move the control to the first statement
    of the loop.'
