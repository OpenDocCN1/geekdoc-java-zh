  raw: 'In order to help you understand how loops are executed, let us take an example
    and implement it using all the three types of loop control.


    For Loop Implementation


    public class forDemo { public static void main(String args[]) { int [] numberArray
    = {100, 300, 500, 700, 900}; for(int i=0; i<5; i++) {         


    System.out.print(numberArray[i]);         


    System.out.print(,”");      


    }      


    System.out.print("\n");       


    }


    }


    While Loop Implementation


    public class whileDemo { public static void main(String args[]) { int [] numberArray
    = {100, 300, 500, 700, 900}; int i = 0; while(i<5) {         


    System.out.print(numberArray[i]); System.out.print(","); i++; 


    }      


    System.out.print("\n");       


    }


    }


    Do While Loop Implementation


    public class doWhileDemo { public static void main(String args[]) { int [] numberArray
    = {100, 300, 500, 700, 900}; int i = 0; do {         


    System.out.print(numberArray[i]); System.out.print(",");


    i++;      


    } while (i<5);


    System.out.print("\n");       


    }


    }


    Enhanced For Loop


    Java also supports an enhanced loop structure, which can be used for array elements.
    The syntax for this loop construct is–– for(declaration : expression) {


    /*Body*/


    }


    The declaration part of the Enhanced for loop is used to declare a variable. This
    variable shall be local to the ‘for loop’ and must have the same type as the type
    of the array elements. The current value of the variable is always equal to the
    array element that is being traversed in the loop. The expression is an array
    or a method call that returns an array.


    Sample implementation of the enhanced for loop has been given below public class
    forArrayDemo { public static void main(String args[]) { int [] numberArray = {100,
    300, 500, 700, 900}; for(int i : numberArray ) {         


    System.out.print( i );         


    System.out.print(",");      


    }      


    System.out.print("\n");       


    }


    }


    Exception Hierarchy


    Java has an inbuilt class named java.lang.Exception and all the exceptions fall
    under this class. All the exception classes are subclasses of this class. Moreover,
    the Throwable class is the superclass of the exception class. Another subclass
    of the Throwable class is the Error class. All the errors like stack overflow
    described above fall under this Error class.


    The Exception class has two subclasses, namely RuntimeException class and IOException
    class. A list of the methods, for which definitions are available in Java, as
    part of the Throwable class, is given below.


    public String getMessage()


    When called, this message returns a detailed description of the exception that
    has been encountered.


    public Throwable getCause()


    This method, when called returns a message that contains the cause of the exception.


    public String toString()


    This method returns the detailed description of the exception concatenated with
    the name of the class.


    public void printStackTrace()


    The result of toString(), along with a trace of the stack, can be printed to the
    standard error stream, System.err, can be done by calling this method.


    public StackTraceElement [] getStackTrace()


    There may be some scenarios where you may need to access different elements of
    the stack trace. This method returns an array, with each element of the stack
    trace saved to different elements of the array. The first element of the array
    contains the top element of the stack trace, while the bottom of the stack trace
    is saved to the last element of the array.


    public Throwable fillInStackTrace()


    Appends the previous information in the stack trace with the current contents
    of the stack trace and returns the same as an array. 


    Catching Exceptions


    The standard method to catch an exception is using the ‘try and catch’ keywords
    along with their code implementations. This try and catch block needs to be implemented
    in such a manner that it encloses the code that is expected to raise an exception.
    It is also important to mention here that the code that is expected to raise an
    exception is termed as protected code. The syntax for try and catch block implementation
    is as follows–– try {   


    /*Protected code*/


    }catch(ExceptionName exc1) {  


    /*Catch code*/


    }


    The code that is expected to raise an exception is placed inside the try block.
    If the exception is raised, then the corresponding action to be performed for
    exception handling is implemented in the catch block. It is imperative for every
    try block to either have a catch block or a final block.


    As part of the catch statement, the exception, which is expected to be raised
    needs to be declared. In the event that an exception occurs, the execution is
    transferred to the catch block. If the raised exception matches the exception
    defined in the catch block, the catch block is executed.


    A sample implementation of the try and catch block is given below. The code implements
    an array with 2 elements. However, the code tries to access the third element,
    which does not exist. As a result, an exception is raised.


    import java.io.*; 


    public class demoException { public static void main(String args[]) { try {         


    int arr[] = new int[2];         


    System.out.println("Accesing the 3rd element of the array:" + arr[3]);


    }catch(ArrayIndexOutOfBoundsException exp) {


    System.out.println("Catching Exception:" + exp);      


    }      


    System.out.println("Reached outside catch block");   


    }


    }


    Implementing Multiple Catch Blocks


    A block of code may lead to multiple exceptions. In order to cater for this requirement,
    implementation of multiple catch blocks is also allowed. The syntax for such implementation
    is given below. try {   


    /*Protected Code*/


    }catch(ExpType1 exp1) {   


    /*Catch block 1*/


    }catch(ExpType2 exp2) {   


    /*Catch block 2*/


    }catch(ExpType3 exp3) {   


    /*Catch block 3*/


    }


    The syntax shown above has illustrated the implementation of three catch blocks.
    However, you can implement as many catch blocks as you want. When this code is
    executed, the protected is executed. If an exception occurs, the type of exception
    is matched with the exception of the first catch block. However, if the exception
    type does not match, the catch block 1 is ignored, and the exception type for
    the second catch block is tried for matching. Whichever catch block has the same
    exception type as that of the raised exception; the corresponding catch block
    is executed.


    Chapter 9


    ADT, Data Structure, and Java Collections


    ![C:\Users\Talha\Downloads\pexels-christina-morillo-1181467 (1).jpg](image.032.jpeg)


    Abstract data type (ADT)


    ![](image.033.jpeg)An abstract data type (ADT) is a logical description of the
    data and the operations that are allowed on it. ADT is defined as a user point
    of view of a data. ADT concerns about the possible values of the data and the
    interface exposed by it. ADT does not concern about the actual implementation
    of the data structure.


    For example, a user wants to store some integers and find their mean value. ADT
    for this data structure will support two functions, one for adding integers and
    other to get mean value. ADT for this data structure does not talk about how exactly
    it will be implemented.


    Data-Structure


    Data structures are concrete representations of data and are defined as a programmer
    point of view of data. Data-structure represents how data will be stored in memory.
    All data-structures have their own pros and cons. Depending upon the type of problem,
    we choose a data-structure that is best suited for it.


    For example, we can store data in an array, a linked-list, stack, queue, tree,
    etc.


    Note: In this chapter, we will be studying various data structures and their API.
    So that the user can use them without knowing their internal implementation.


    JAVA Collection Framework


    JAVA programming language provides a JAVA Collection Framework, which is a set
    of high quality, high performance & reusable data-structures and algorithms.


    ![](image.034.jpeg)


    The following advantages of using a JAVA collection framework:'
