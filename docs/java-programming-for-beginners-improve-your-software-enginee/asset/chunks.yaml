    \ `main()` method will have to be declared `public` before the Java interpreter\
    \ can call it.\n- **Protected**: accessible to all subclasses and package. Declaring\
    \ a method, variable, or constructor as `protected` in a superclass makes it accessible\
    \ only to classes within its package or to its subclasses in another package.\
    \ This access type is used if you want to allow the subclass to use variable or\
    \ helper methods and prevent non-related classes from using them. Interfaces,\
    \ as well as the fields and methods under them, should not be declared `protected`,\
    \ but fields and methods outside the interface can be declared `protected`. Classes\
    \ should not be declared as `protected`.\n- **Default**: Applicable when no modifier\
    \ is provided–accessible to the package. A method or variable that has been declared\
    \ without a modifier is accessible to other classes within the package.\n\nThe\
    \ following table summarizes the different access modifiers and their effect:\n\
    \n| Modifier | Inside class | Inside package | Outside package by subclass | Outside\
    \ package |\n| :--- | :--- | :--- | :--- | :--- |\n| Private | Y | N | N | N |\n\
    | Public | Y | Y | Y | Y |\n| Protected | Y | Y | Y | N |\n| Default | Y | Y |\
    \ N | N |\n\n### Non-access Modifiers\nThe non-access modifiers can be used to\
    \ access various functionalities in Java.\n\n- **Final**: used to finalize implementations\
    \ of variables, methods, and classes.\n    - **Final variables**: You can only\
    \ explicitly initialize a final variable once. When you declare a variable as\
    \ `final`, you will never be able to reassign it to another object. Take note,\
