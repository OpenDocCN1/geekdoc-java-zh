    Assuming the reader is not a complete newcomer to programming and has been introduced
    to the world of programming using `C` or another procedural-heavy language, the
    next natural question is: why use object-oriented programming at all?


    One of its primary benefits is that it saves time in the long run.


    In simpler algorithms and programs, procedural programming is usually much faster
    and more straightforward; rather than having to construct and define a `class`,
    and then create an object based on that class, all the programmer really has to
    do is declare the necessary variables, write the functions, and create the algorithm
    to solve the problem that the code is supposed to address.


    However, when it comes to more sophisticated applications that require more complex
    solutions, object-oriented programming begins to shine and demonstrate its strength.


    There will be occasions in many programs when a number of "objects" or data clusters
    must be grouped together, and the programmer will be treated in a specific way.
    This is what "lessons" are supposed to help with.


    Instead of declaring a new set of variables for each data cluster, they can simply
    draw from a pre-existing "class" and produce a new "object." Let us see how this
    works in practice.


    A programmer would have to manually describe each and every piece, all sixteen
    pawns, four bishops and four knights, four rooks, two queens, and two kings if
    they were to write a chess game in a procedural way. They will also have to write
    the routines that allow each piece to move independently.


    If the programmer uses object-oriented programming, instead of having to code
    sixteen pawns, four bishops, four knights, four rooks, two queens, and two kings,
    they just have to code six classes: one for each piece on the board.


    The programmer may now just include the movement routines within each class, and
    have the attributes explain their position: whether they''re the white king''s
    pawn or the black queen''s pawn, these are all things that can be entered through
    the "pawn" class''s "attributes" component. Instead of thirty-two code clusters,
    the programmer simply needs to do six.


    It''s now a lot easier, a lot shorter, and a lot more elegant.


    ## Java tokens


    Java tokens are the values that are smaller than other integers. These numbers
    are going to fall between the value of `-32768` and `32767`.


    The code that I have been using is not going to work for `shorts`, instead, I
    am going to need to use the `short` function so that I can make sure that the
    values are going to fall between the set limitations.


    Large values are going to be stored inside of a `double` value along with floating-point
    values. A `double` does not have to be used if I can use a floating-point. As
    I am storing a floating variable. I am going to need to put a letter at the end
    of my value amount. This value should be `f` because it is a floating-point number.


    ## Keywords


    In Java, the `Boolean` type refers to `false` or `true` values. Java finds out
    if it is true or false using the reserved keywords. Therefore, a `Boolean` expression
    type will assume one of these values.


    An example to demonstrate include:


    There are a few things to note about this program. First, the `println()`, displays
    a boolean value. Secondly, the boolean values control the flow of an `if` statement.


    You don’t need to go a long way in writing the boolean type this way: `if (b ==
    true)`


    The result shown by the operator, such as `<` is boolean. It is one of the reasons
    why we have the expression `11 > 8` showing the value `true`. In addition, the
    other pair of parentheses near the `11 > 8` is important since `plus` comes before
    the `>`.


    ## Identifiers


    The top layer of the diagram above is for the identifier or name. This top layer
    is the name you give to a `class`. The name should specifically identify and also
    describe the type of object as seen or experienced by the user. In simple terms,
    the name or identifier should identify the class.


    ## Operators


    Java has an extensive list of operator environment. If you are wondering what
    an operator is, you can look at it as a symbol that conveys a specific message
    to the compiler to carry out a logical or mathematical operation. In Java, you
    will interact with four classes of operators.


    The four classes include:

    * Logical operator

    * Bitwise operator

    * Relational operator

    * Arithmetic operator


    Like other computer languages, Java has a defined list of additional operators
    to take care of certain specific scenarios.


    When it comes to learning `JAVA` programming language, or any programming language
    for the matter, there are five basic concepts you must understand before you get
    started. These five basic concepts include:

    * Variables

    * Data Structures

    * Control Structures

    * Syntax

    * Tools


    Each of these concepts will be thoroughly explained on a beginner’s level to ensure
    that they are understood.


    ## Separators


    They are not suitable for high-level abstraction: note that a lot of these programs
    make use of low-level constructs which are primarily used for low-level abstraction.
    The usual approach with these programming languages is that they focus on the
    machine-how to make a computer do something rather than how these functions can
    help solve the issues of a user. These languages deal with the minute details,
    which is already beyond the scope of high-level abstraction, which is the more
    common approach that we see today. In low-level abstraction, data structures and
    algorithms are taken separately, whereas these are taken as a whole in high-level
    abstraction.


    ## Literals


    When it comes to literals in `Java`, we mean the fixed values which appear in
    the form in which human beings can read. We can say the number `200` is literal.
    Most of the time, literals can be constants.


    Literals are important in a program. In fact, most Java programs use literals.
    Some of the programs we have already discussed in this book use literals. Literals
    in `Java` can fall on various data types.


    The manner in which every literal is shown is determined by its type. Like it
    was mentioned some time back, we enclose character constants in single quotes
    such as `''c''` and `''%''`. We define literals in integers without involving
    the fractional part. For instance, `12` and `-30` are integer literals. A floating-point
    literal should contain the decimal point plus the fractional part. `12.389` is
    a floating literal. Java further permits for one to apply the scientific notation
    for the floating-point literals. Integer literals contain `int` value, and anyone
    can initialize them with a variable of `short`, `byte`, and `char`.


    ## Comments


    When this occurs, we call the greys comments. In the running stages of the program,
    the grey’s (comments) are moot. This is to means that you can use the comment
    feature to state or explain what the code you are creating wants to achieve. You
    can achieve this by typing two slashes and then the comment. Here is a sample.


    ```

    //Place your single line comment here

    ```


    You can have more than one comment line by doing either of the following:


    ```

    //We are going to

    //spread the comments into two

    ```


    Or


    ```

    /*

    This comment spreads over two lines

    */

    ```


    If you look at the comment above, you will notice that it starts with `/*` but
    ends with `*/`. Additionally, if you look at the previous image (figure 8, you
    will notice that there are comments that begin with a single forward slash and
    two asterisks (`/**`), but end with one asterisk and one forwards slash; this
    is called a Javadoc comment.

