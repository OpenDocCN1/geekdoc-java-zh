    **注意**: 以上所有队列操作的时间复杂度均为 `O(1)`。\n\n## JAVA Collection 中的队列实现\n\n`ArrayDeque<T>`\
    \ 是双端队列的类实现。如果我们使用 `add()`、`remove()` 和 `peek()`，它的行为将像一个队列。（此外，如果我们使用 `push()`、`pop()`\
    \ 和 `peekLast()`，它的行为将像一个栈。）例如下下：\n\n```java\nimport java.util.ArrayDeque; \n\
    public class QueueDemo {\n    public static void main(String[] args) {\n     \
    \   ArrayDeque<Integer> que = new ArrayDeque<Integer>(); \n        que.add(1);\
    \ que.add(2); que.add(3);\n        System.out.println(\"Queue : \"+que);\n   \
    \     System.out.println(\"Queue size : \"+que.size());\n        System.out.println(\"\
    Queue peek : \"+que.peek());\n        System.out.println(\"Queue remove : \"+que.remove());\n\
    \        System.out.println(\"Queue isEmpty : \"+que.isEmpty());\n    }\n}\n```\n\
    \n**输出:**\n```\nQueue : [1, 2, 3]\nQueue size : 3\nQueue peek : 1\nQueue remove\
    \ : 1\nQueue isEmpty : false\n```\n\n## 第 10 章：文件处理\n\n本章讨论了读取、写入、创建和打开文件的细节。有许多文件\
    \ I/O 类和方法可以选择。\n\n### 读取文本文件\n\n读取文本文件是 Java 中的一项关键能力，并在许多实际应用。`FileReader`、`BufferedReader`\
    \ 和 `Scanner` 是 Java 中读取纯文本文件的有用类。每个类都具有特定的特性，使其能够胜任处理特定情况。\n\n### BufferedReader\n\
    \n该技术从字符输入流中读取文本。它缓冲字符、数组和行，以便高效地读取。你可以指定缓冲区类型或使用标准类型。出于大多数原因，默认类型已经足够大。特别是，从\
    \ `Reader` 产生的每个读取操作都会导致基础的人性或字节流执行相应的读取操作。因此，建议对任何读取操作较大的（如 `FileReader` 和 `InputStreamReader`）`Reader`\
    \ 封装一个 `BufferedReader`。例如：\n\n```java\nBufferedReader in = New BufferedReader(Reader\
    \ in, int size)\n```\n\n### FileReader\n\n用于读取字符文档的便利类。该类的构造函数假设默认字符格式和默认字节缓冲区大小合适的。\n\
    \n### Scanner\n\n一种简单的文本扫描器，使用正则表达式来解析原始类型和字符串。`Scanner` 使用分隔符模型将其条目拆分为符合定义空白的标记（tokens）。通过使用不同的\
    \ `next` 技术，可以将生成的标记转换为不同类型的值。\n\n```java\nimport java.io.File; \nimport java.util.Scanner;\
    \ \npublic class ReadFromFileUsingScanner {\n    public static void main(String[]\
    \ args) throws Exception {\n        // filepath 现在设置为参数，以便进行扫描\n        File example\
    \ = new File(\"C:\\\\Users\\\\userName\\\\Desktop\\\\example.txt\"); \n      \
    \  Scanner example1 = new Scanner(file); \n        while (example1.hasNextLine())\
    \ System.out.println(example1.nextLine());\n    }\n}\n```\n\n使用 `Scanner` 类但不使用循环的：\n\
    \n```java\nimport java.io.File; \nimport java.io.FileNotFoundException;\nimport\
    \ java.util.Scanner;\n\npublic class example{ \n    public static void main(String[]\
    \ args) throws FileNotFoundException {\n        File example = new File(\"C:\\\
    \\Users\\\\userName\\\\Desktop\\\\example.txt\");\n        Scanner example1 =\
    \ new Scanner(file); // 我们将使用 \\\\Z 作为分隔符 \n        sc.useDelimiter(\"\\\\Z\"\
    );\n        System.out.println(example1.next());\n    }\n}\n```\n\n### 在 Java\
    \ 包 `io;` 中将文本文件读取为 String\n\n```java\npackage io; \nimport java.nio.file.*; \n\
    public class example{\n    public static example(String fileName)throws Exception\
    \ { \n        String example1 = \"\"; \n        example1 = new String(Files.readAllBytes(Paths.get(fileName)));\
    \ \n        return example1;\n    }\n    public static void main(String[] args)\
    \ throws Exception {\n        String example1 = example(\"C:\\\\Users\\\\userName\\\
    \\Desktop\\\\example.java\"); \n        System.out.println(example1);\n    }\n\
    }\n```\n\n### 写入文本文件\n\n你可以使用其中一个写入方法向文件写入字节或行。写入方法包括：\n* `Write(Path, byte[],\
    \ OpenOption...)`\n* `Write(Path, Iterable<? extends CharSequence>, Charset, OpenOption...)`\n\
    \n## 重命名和删除文件\n\n### 重命名\n\n在 Java 中，`File` 类中有一个名为 `renameTo(fileName)` 的方法，我们可以用它重命名文件。\n\
    \n#### 删除文件\n\n使用 `java` 程序保存的文件将被永久删除，不会移动到垃圾箱/回收站。使用 `java.io.File.delete()`\
    \ 从文件或文件夹中删除此抽象路径。使用 `java.nio.file.files.deleteifexists` 如果文件夹存在则将其删除。如果文件夹未打开，它也会删除路径列出的文件夹。\n\
    \n## Java 高级主题\n\n### Generic 型\n\n在任何复杂的软件项目中，Bug 都是生活常态。仔细的计划、编程和测试可能有助于减少它们的无处不在，但无论如何它们总会找到进入你系统的某个地方。随着新功能的引入以及代码库规模和复杂性的增加，这一点变得尤为明显。\n\
    \n幸运的是，某些 Bug 比其他 Bug 更容易检测。例如，编译时 Bug 可以很快识别；你可以使用编译器的错误代码来确定问题所在并解决它，对吧。然而，运行时\
    \ Bug 可能困难得多；它们并不总是发生，当它们发生时，可能在远离真实原因的地方。泛型通过使软件在编译时可行来帮助稳定你的软件。\n\n### 泛型类型\n\
    \n泛型形式是类型参数化的泛型类别或接口。可以通过修改一个简单的箱类来展示这一思想。考虑一个适用于任何类型对象的非泛型箱类别。它只需要提供两个技术：`set()`（向柜中添加物品）和\
    \ `get()`（检索它）。由于它们的方法接受或返回对象，你可以自由地传递你想要的内容，只要它不是原始类型之一。在编译时无法检查该类是如何被使用的。\n\n\
    由角括号 `< >` 指定的类型参数部分显示了类别的标题。它指示了形式的参数（也称为排序因子）`T1`、`T2` 直到 `Tn`。通过将文件 `government\
    \ class box` 修改为 `government class box <T >` 来生成泛型类型语句，从而更新箱类别以使用泛型。这引入了类型变量 `T`，它可以在类内部任何地方使用。这把所有的\
    \ `Object` 事件替换为 `T`。\n\n"
