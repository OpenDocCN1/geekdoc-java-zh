- fmt: "\n# Writing Programs in Editors\n\n![C:\\Users\\Talha\\Downloads\\altumcode-FoTs3ntRoIs-unsplash\
    \ (1).jpg](image.005.jpeg)\n\nTo write programs, you use a simple editor such\
    \ as Notepad, or you can use a full-fledged Integrated Development Environment\
    \ (IDE). Below is a list of some of the most popular IDE’s that are available\
    \ for Java and some of their relevant features.\n\n## Eclipse\n\nThis IDE has\
    \ been around for quite a long time and is very popular and widely used amongst\
    \ the Java development community. Some of the core features of the IDE are:\n\n\
    * It’s free and open source. Hence there are many developers who keep contributing\
    \ to the IDE.\n* It can be used to develop applications in other languages such\
    \ as C++, Ruby, HTML5, and PHP.\n* It has a rich client platform.\n* It provides\
    \ the ability of refactoring code.\n* It helps in code completion.\n* It has a\
    \ wide variety of extensions and plugins.\n* It also has support for most source\
    \ code version control systems.\n\n## IntelliJ IDEA\n\nThis is another popular\
    \ IDE used by the Java development community. Some of the core features of this\
    \ IDE are:\n\n* The community edition is free and open source.\n* The paid edition\
    \ provides many more features and allows developers to build enterprise applications\
    \ with the Java Enterprise Edition.\n* It provides the ability of refactoring\
    \ code.\n* It helps in code completion.\n* It has a wide variety of extensions\
    \ and plugins.\n* It also has support for most source code version control systems.\n\
    \n## Netbeans\n\nNetBeans is a highly recommended IDE for beginners in Java language.\
    \ It is a powerful and fast IDE that supports all Java platforms as well as mobile\
    \ applications. It runs on a variety of platforms such as Windows, Linux, Mac\
    \ OS X, and Solaris. It also provides support for languages such as HTML5, C/C++,\
    \ and PHP.\n\n## The Upsides of Java\n\n* Java epitomizes simplicity in programming,\
    \ thanks to its userfriendly interface for learning, writing, deployment, and\
    \ implementation.\n* Java’s core architecture is designed to facilitate ease of\
    \ integration and convenience of use within the development environment.\n* Java\
    \ is platform-independent and readily portable, making it suitable for multitasking\
    \ and use across software applications.\n* The object-oriented characteristics\
    \ of Java support the creation of programs with standard features and codes that\
    \ can be redeployed.\n* Java’s networking capabilities make it easier for programmers\
    \ to create software solutions for shared computing environments.\n* The close\
    \ relationship between Java, the C++, and the C languages makes it easier for\
    \ anyone with knowledge of the other two languages to learn Java.\n* Java’s automated\
    \ garbage collection provides continuous memory protection, making it convenient\
    \ for programmers to eliminate security vulnerabilities while writing codes.\n\
    * Java’s architecture is flexible for the implementation of multithreading programs.\n\
    * Java is readily reusable, thanks to the ability to redeploy classes using the\
    \ interface or inheritance features.\n\n## The Downsides of Java\n\n* Since Java\
    \ is not a native application, it runs at lower speeds compared to other programming\
    \ languages.\n* Java may also lack consistency in the processing and displaying\
    \ of graphics. For example, the ordinary appearance of the graphical user interface\
    \ (GUI) in Java-based applications is quite different and of lower standards compared\
    \ the GUI output of native software applications.\n* Java’s garbage collection,\
    \ a feature that manages memory efficiency, may interfere with speed and performance\
    \ whenever it runs as a background application.\n\n# Chapter 5\n\n## Objects and\
    \ Classes\n\n![C:\\Users\\Talha\\Downloads\\pexels-antonio-batinić-4164418.jpg](image.006.jpeg)\n\
    \nFinally, we are going to look at classes and objects;\n\nAn object in Java has\
    \ got to have a state, which will be stored in a field and a behavior, indicated\
    \ by a method.\n\nA class is a sort of map, a blueprint if you like, from which\
    \ an object is created. This is what a class looks like:\n\n```java\npublic class\
    \ Dog { String breed; int ageC; String color; void barking() {\n\n } void whining()\
    \ {\n\n } void sleeping() {\n\n }\n\n}\n```\n\nA class may have any of these variable\
    \ types:\n\n* Local defined within a constructor, block, or method. The variable\
    \ is declared and then initialized inside a method and destroyed once the method\
    \ has ended.\n* Instance–defined in a class but are outside a method. Initialized\
    \ when instantiation of the class happens and can be accessed from inside any\
    \ constructor, block, or method of the class.\n* Class–declared inside the class,\
    \ uses the static keyword, and are outside any method.\n\nClasses can have multiple\
    \ methods, as many as required to access all the different kinds of values in\
    \ the method. In our example above, we had three methods–`barking()`, `whining()`,\
    \ and `sleeping()`.\n\n### Constructors\n\nEvery class will have a constructor;\
    \ if you omit it, a default one will be built by the compiler. When you create\
    \ a new object, at least one constructor must be invoked. As a rule, the name\
    \ of a constructor must be the same as that of the class, and there can be as\
    \ many constructors as a class requires. This is what a constructor looks like:\n\
    \n```java\npublic class Puppy { public Puppy() { public Puppy(String name) { }\
    \ }\n```\n\n### Creating Objects\n\nWe already know that a class is kind of blueprint\
    \ to create objects from, so it goes without saying that the object is created.\
    \ For a new object to be created, we need the new keyword. These are the three\
    \ steps needed to create an object:\n\n* Declaration–A variable must be declared\
    \ with a name and type\n* Instantiation–The new keyword is used for creating\n\
    * Initialization–The constructor is called.\n\nThe next example shows how objects\
    \ are created:\n\n```java\npublic class Puppy { Puppy(String name) { System.out.println(\"\
    Passed Name is :\" + name); } public static void main(String [] ) { Puppy myPuppy\
    \ = new Puppy(\"fluffy\"); } }\n```\n\n### Accessing Instance Variables and Methods\n\
    \nObjects can be used when we want to access instance variables and methods; this\
    \ example shows how we access an instance variable:\n\n```java\n/* First we create\
    \ the object */\nObjectReference = new Puppy();\n/* Now we call our variable,\
    \ like this */\nObjectReference.variableName;\n/* Now a class method is called,\
    \ like this */\nObjectReference.MethodName();\n```\n\nNext, we can see the instance\
    \ variables and methods in a class are accessed:\n\n```java\npublic class Puppy\
    \ { int PuppyAge; Puppy(String name) { System.out.println(\"Name chosen is :\"\
    \ + name); } public void setAge(int age) { PuppyAge = age; } public int getAge()\
    \ { System.out.println(\"Puppy's age is :\" + PuppyAge); return PuppyAge; } public\
    \ static void main(String[] args) { Puppy myPuppy = new Puppy(\"fluffy\"); //\
    \ Now we call the class method to set the Puppy's age myPuppy.setAge(2); // Next,\
    \ we call another class method to get the Puppy's age myPuppy.getAge(); // We\
    \ access instance variable in this way System.out.println(\"Variable Value :\"\
    \ + myPuppy.PuppyAge); } }\n```\n\n## Import Statements\n\nOne important thing\
    \ to remember is that paths must be fully qualified, and that includes the names\
    \ of the class and the package. If not, the compiler will struggle to load the\
    \ source code and the classes. To qualify a path, we need to use import statements\
    \ and, in this example, we see how a compiler loads the requested classes into\
    \ the directory we specify:\n\n```java\nimport java.io.*;\n```\n"
