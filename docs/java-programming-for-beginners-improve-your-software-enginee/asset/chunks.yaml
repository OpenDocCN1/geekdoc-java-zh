  trans: "\n为了帮助你理解循环是如何执行的，让我们来看一个示例，并使用三种循环控制类型来实现它。\n\n### For 循环实现\n\n```java\n\
    public class forDemo { \n    public static void main(String args[]) { \n     \
    \   int [] numberArray = {100, 300, 500, 700, 900}; \n        for(int i=0; i<5;\
    \ i++) {            \n            System.out.print(numberArray[i]);          \n\
    \            System.out.print(\",\");        \n        }      \n        System.out.print(\"\
    \\n\");        \n    }\n}\n```\n\n### While 循环实现\n\n```java\npublic class whileDemo\
    \ { \n    public static void main(String args[]) { \n        int [] numberArray\
    \ = {100, 300, 500, 700, 900}; \n        int i = 0; \n        while(i<5) {   \
    \         \n            System.out.print(numberArray[i]); \n            System.out.print(\"\
    ,\"); \n            i++; \n        }      \n        System.out.print(\"\\n\");\
    \        \n    }\n}\n```\n\n### Do While 循环实现\n\n```java\npublic class doWhileDemo\
    \ { \n    public static void main(String args[]) { \n        int [] numberArray\
    \ = {100, 300, 500, 700, 900}; \n        int i = 0; \n        do {           \
    \ \n            System.out.print(numberArray[i]); \n            System.out.print(\"\
    ,\");\n            i++;      \n        } while (i<5);\n        System.out.print(\"\
    \\n\");        \n    }\n}\n```\n\n### 增强型 For 循环\n\nJava 还支持一种增强型循环结构，它可以用于数组元素。该循环构造的语法如下：\n\
    \n```java\nfor(declaration : expression) { /*Body*/ }\n```\n\n增强型 `for` 循环的声明部分用于声明变量。该变量应该是\
    \ `for loop` 局作用的，并且其类型必须与数组元素的类型相同。变量的当前值始终等于循环中正在遍历的数组元素。表达式是一个数组或返回数组的方法调用。\n\
    \n下面是增强型 for 循环的示例实现：\n\n```java\npublic class forArrayDemo { \n    public static\
    \ void main(String args[]) { \n        int [] numberArray = {100, 300, 500, 700,\
    \ 900}; \n        for(int i : numberArray ) {            \n            System.out.print(\
    \ i );          \n            System.out.print(\",\");      \n        }      \n\
    \        System.out.print(\"\\n\");        \n    }\n}\n```\n\n### 异常层次结构\n\nJava\
    \ 内置了一个名为 `java.lang.Exception` 的类，所有异常都属于这个类。所有的异常类都是该类的子类。此外，`Throwable` 类是异常类的父类。`Throwable`\
    \ 类的另一个子类是 `Error` 类。所有如上面描述的栈溢出（stack overflow）错误都属于这个 `Error` 类。\n\n`Exception`\
    \ 类有两个子类，即 `RuntimeException` 类和 `IOException` 类。作为 `Throwable` 类的一部分，Java 中提供的可用定义的方法列表如下：\n\
    \n```java\npublic String getMessage()\n```\n调用时，此消息将返回所遇异常的详细描述。\n\n```java\n\
    public Throwable getCause()\n```\n此方法在调用时会返回一个包含异常原因的消息。\n\n```java\npublic String\
    \ toString()\n```\n此方法返回异常的详细描述与类名拼接后的结果。\n\n```java\npublic void printStackTrace()\n\
    ```\n通过调用此方法，可以将 `toString()` 的结果以及栈跟踪（stack trace）打印到标准错误流 `System.err` 中。\n\n\
    ```java\npublic StackTraceElement [] getStackTrace()\n```\n在某些情况下，你可能需要访问栈跟踪的不同元素。此方法返回一个数组，栈跟踪的每个元素都保存在到数组的不同元素中。数组的第一个元素包含栈跟踪的顶部元素，而栈跟踪的底部被保存到数组的最后一个元素中。\n\
    \n```java\npublic Throwable fillInStackTrace()\n```\n将栈跟踪中的之前信息与当前栈跟踪的内容合并，并返回相同的数组格式。\n\
    \n### 捕获异常\n\n捕获异常的标准方法是使用 `try` 和 `catch` 关键字以及它们的代码实现。此 `try` 和 `catch` 块需要以这种方式实现，以包含可能会抛出异常的代码。这里还需要说明的是，可能会抛出异常的代码被称为受保护代码（protected\
    \ code）。`try` 和 `catch` 块实现的语法如下：\n\n```java\ntry { /*Protected code*/ } catch(ExceptionName\
    \ exc1) { /*Catch code*/ }\n```\n\n可能会抛出异常的代码放置在 `try` 块中。如果抛出了异常，则为异常处理要执行的相应操作将在\
    \ `catch` 块中实现。每个 `try` 块必须要么有一个 `catch` 块，要么有一个 `final` 块。\n\n作为 `catch` 语句的一部分，需要声明预期抛出的异常。一旦发生异常，执行流将转移到\
    \ `catch` 块。如果抛出的异常与 `catch` 块中定义的异常匹配，则执行 `catch` 块。\n\n下面是 `try` 和 `catch` 块的示例实现。该代码实现了一个包含\
    \ 2 个元素的数组。然而，代码尝试访问一个不存在的元素。\n\n```java\nimport java.io.*; \n\npublic class demoException\
    \ { \n    public static void main(String args[]) { \n        try {           \
    \ \n            int arr[] = new int[2];          \n            System.out.println(\"\
    Accesing 3rd element of the array:\" + arr[3]);\n        } catch(ArrayIndexOutOfBoundsException\
    \ exp) {\n            System.out.println(\"Catching Exception:\" + exp);\n   \
    \     }\n        System.out.println(\"Reached outside catch block\");\n    }\n\
    }\n```\n\n### Catch 块\n\n代码可能会导致多个异常。为了应对这种情况，允许实现多个 `catch` 块。语法如下：\n\n```java\n\
    try { /*Protected code*/ } catch(ExceptionType1 exp1) { /*Catch block 1*/ } \n\
    catch(ExceptionType2 exp2) { /*Catch block 2*/ } \ncatch(ExceptionType3 exp3)\
    \ { /*Catch block 3*/ }\n```\n\n上面的语法说明了三个 catch 块的实现。然而，你可以实现任意数量的 catch 块。\n\
    \n### ADT、数据结构与 Java 集合\n\n抽象数据类型（ADT）是对数据的逻辑描述以及在数据上允许的操作。ADT 是从用户角度定义的。ADT 关注的是数据的可能值及其暴露的接口。ADT\
    \ 不关心数据结构的具体实现。\n\n例如，用户想要存储一些整数并计算它们的平均值。该数据结构的 ADT 将支持两个函数：一个用于添加整数，另一个用于获取平均值。\n\
    \n数据结构是数据的具体表示，是从程序员角度定义的。数据结构代表了数据在内存中的存储方式。所有数据结构都有自己的优缺点。根据问题的类型，我们选择最合适的数据结构。\n\
    \n注意：在本章中，我们将学习各种数据结构及其 API。这样用户就可以在不了解内部实现的情况下使用它们。\n\nJava Collection Framework\n\
    \nJava 语言提供了一个 Java 集合框架，这是一套高质量、高性能且可重用的数据结构和算法。\n\n使用 Java 集合框架的优势如下：\n"
- fmt: "\n1. Programmers do not have to implement basic data structures and algorithms\
    \ repeatedly. Thereby it prevents the reinvention of the wheel. Thus, the programmer\
    \ can devote more effort in business logic.\n2. The `JAVA Collection Framework`\
    \ code is well-tested, high quality, high-performance code. Using them increase\
    \ the quality of the programs.\n3. Development cost is reduced as basic data structures\
    \ and algorithms are implemented in the `Collections` framework are reused.\n\
    4. Easy to review and understand programs written by other developers as most\
    \ of Java developers uses the `Collection` framework. In addition, the collection\
    \ framework is well documented.\n\n# Array\n\n`Array` represents a collection\
    \ of multiple elements of the same datatypes.\n\n## Array ADT Operations\n\nBelow\
    \ is the API of the array:\n\n1. Adds an element at the `kth` position. Value\
    \ can be stored in an array at `Kth` position in `O(1)` constant time. We just\
    \ need to store value at `arr[k]`.\n2. Reading the value stored at the `kth` position.\
    \ Accessing the value stored at some index in the array is also `O(1)` constant\
    \ time. We just need to read the value stored at `arr[k]`.\n3. Substitution of\
    \ value stored in the `kth` position with a new value. Time complexity: `O(1)`\
    \ constant time.\n\n### Example:\n\n```java\npublic class ArrayDemo { \n    public\
    \ static void main(String[] args) { \n        int[] arr = new int[10]; \n    \
    \    for (int i = 0; i < 10; i++) {\n            arr[i] = i;\n        }\n    }\n\
    }\n```\n\n`JAVA` standard arrays are of fixed length. Sometimes we do not know\
    \ how much memory we need, so we create a bigger size array. Thereby wasting space.\
    \ If an array is already full and we want to add more values to it than we need\
    \ to create a new array, which has sufficient space and then copy the old array\
    \ to the new array. To avoid this manual reallocation and copy, we can use `ArrayList`\
    \ of `JAVA Collection` framework or `Linked Lists` to store data.\n\n## ArrayList\
    \ implementation in JAVA Collections\n\n`ArrayList<E>` in `JAVA Collections` is\
    \ a data structure which implements `List<E>` interface, which means that it can\
    \ have duplicate elements in it. `ArrayList` is an implementation as a dynamic\
    \ array that can grow or shrink as needed. (Internally array is used when it is\
    \ full a bigger array is allocated, and the old array values are copied to it).\n\
    \n### Example:\n\n```java\nimport java.util.ArrayList; \npublic class ArrayListDemo\
    \ {\n    public static void main(String[] args) {\n        ArrayList<Integer>\
    \ al = new ArrayList<Integer>();\n        al.add(1); // add 1 to the end of the\
    \ list\n        al.add(2); // add 2 to the end of the list\n        System.out.println(\"\
    Contents of Array: \" + al);      \n        System.out.println(\"Array Size: \"\
    \ + al.size()); \n        System.out.println(\"Array IsEmpty: \" + al.isEmpty());\
    \ \n        al.remove(al.size() - 1); // last element of array is removed. \n\
    \        al.removeAll(al); // all the elements of array are removed.\n       \
    \ System.out.println(\"Array IsEmpty: \" + al.isEmpty());\n    }\n}\n```\n\n###\
    \ Output:\n\n```\nContents of Array: [1, 2]\nArray Size: 2\nArray IsEmpty: false\n\
    Array IsEmpty: true\n```\n\n![](image.035.jpeg)\n\n# Linked List\n\nLinked lists\
    \ are a dynamic data structure, and memory is allocated at run time. The concept\
    \ of the linked list is not to store data contiguously. Nodes of the linked list\
    \ contain a link that points to the next elements in the list.\n\nPerformance-wise\
    \ linked lists are slower than arrays because there is no direct access to linked\
    \ list elements. Linked list is a useful data structure when we do not know the\
    \ number of elements to be stored ahead of time. There are many types of linked\
    \ lists: linear, circular, doubly, doubly circulare, etc.\n\n## Linked list ADT\
    \ Operations\n\nBelow is the API of Linked list.\n\n- `Insert(k)`: adds `k` to\
    \ the start of the list. Insert an element at the start of the list. Just create\
    \ a new element and move pointers. So that this new element becomes the first\
    \ element of the list. This operation will take `O(1)` constant time.\n- `Delete()`:\
    \ Delete the element at the start of the list. Delete an element at the start\
    \ of the list. We just need to move one pointer. This operation will also take\
    \ `O(1)` constant time.\n- `PrintList()`: Display all the elements of the list.\
    \ Start with the first element and then follow the pointers. This operation will\
    \ take `O(N)` time.\n- `Find(k)`: Find the position of the element with value\
    \ `k`. Start with the first element and follow the pointer until we get the value\
    \ we are looking for or reach the end of the list. This operation will take `O(N)`\
    \ time. *Note: Binary search does not work on linked lists.*\n- `FindKth(k)`:\
    \ Find element at position `k`. Start from the first element and follow the links\
    \ until you reach the kth element. This operation will take `O(N)` time.\n- `IsEmpty()`:\
    \ Check if the number of elements in the list are zero. Just check the head pointer\
    \ of the list, if it is `Null`, then the list is empty otherwise not empty. This\
    \ operation will take `O(1)` time.\n\n## LinkedList implementation in JAVA Collections\n\
    \n`LinkedList<E>` in by `JAVA Collections` is a data structure that also implements\
    \ `List<E>` interface.\n\n### Example:\n\n```java\nimport java.util.LinkedList;\
    \ \npublic class LinkedListDemo { \n    public static void main(String[] args)\
    \ {\n        LinkedList<Integer> ll = new LinkedList<Integer>(); \n        ll.addFirst(2);\
    \ // 8 is added to the list \n        ll.addLast(10); // 9 is added to last of\
    \ the list. \n        ll.addFirst(1); // 7 is added to first of the list. \n \
    \       ll.addLast(11); // 20 is added to last of the list. \n        System.out.println(\"\
    Contents of Linked List: \" + ll); \n        ll.removeFirst(); \n        ll.removeLast();\n\
    \        System.out.println(\"Contents of Linked List: \" + ll);\n    }\n}\n```\n\
    \n### Output:\n\n```\nContents of Linked List: [1, 2, 10, 11] (corrected based\
    \ on logic)\nContents of Linked List: [2, 10]\n```\n\n![](image.036.jpeg)\n\n\
    # Stack\n\n`Stack` is a special kind of data structure that follows Last-In-First-Out\
    \ (`LIFO`) strategy. This means that the element that is last will be the first\
    \ to be removed.\n\nThe various applications of the stack are:\n1. Recursion:\
    \ recursive calls are implemented using system stack.\n2. Postfix evaluation of\
    \ the expression.\n3. Backtracking implemented using stack.\n4. Depth-first search\
    \ of trees and graphs.\n5. Converting a decimal number into binary number.\n\n\
    ## Stack ADT Operations\n\n- `Push(k)`: Adds value `k` to the top of the stack.\n\
    - `Pop()`: Remove element from the top of the stack and return its value.\n- `Top()`:\
    \ Returns the value of the element at the top of the stack.\n- `Size()`: Returns\
    \ the number of elements in the stack.\n- `IsEmpty()`: determines whether the\
    \ stack is empty. It returns true if the stack is empty otherwise return false.\n\
    \nNote: All the above stack operations are implemented in `O(1)`.\n\n## Stack\
    \ implementation in JAVA Collection\n\nThe stack is implemented by calling `push`\
    \ and `pop` methods of `Stack <T>` class.\n\n### Example:\n\n```java\npublic class\
    \ StackDemo { \n    public static void main(String[] args) { \n        Stack<Integer>\
    \ stack = new Stack<>(); \n        int temp; \n        stack.push(1); \n     \
    \   stack.push(2); \n        stack.push(3);\n        System.out.println(\"Stack\
    \ : \"+stack);\n        System.out.println(\"Stack size : \"+stack.size()); \n\
    \        System.out.println(\"Stack pop : \"+stack.pop()); \n        System.out.println(\"\
    Stack top : \"+stack.peek()); \n        System.out.println(\"Stack isEmpty : \"\
    +stack.isEmpty());\n    }\n}\n```\n\n### Output:\n\n```\nStack : [1, 2, 3]\nStack\
    \ size : 3\nStack pop : 3\nStack top : 2\nStack isEmpty : false\n```\n\nJDK provides\
    \ both `ArrayDeque<T>` and `Stack<T>`. We can use both of these classes. But there\
    \ are some advantages of `ArrayDeque<T>`:\n\n1. First reason is that `Stack<T>`\
    \ does not drive from `Collection` interface.\n2. Second `Stack<T>` drives from\
    \ `Vector<T>` so random access is possible, so it breaks abstraction of a stack.\n\
    3. Third `ArrayDeque` is more efficient as compared to `Stack<T>`.\n\n# Queue\n\
    \n`Queue` is a First-In-First-Out (`FIFO`) kind of data structure. The element\
    \ that is added to the queue first will be the first to be removed, and so on.\n\
    \n![](image.037.jpeg)\n\nQueue has the following application uses:\n\n1. Access\
    \ to shared resources (e.g., printer)\n2. Multiprogramming\n3. Message queue\n\
    4. BFS, breadth-first traversal of graph or tree are implemented using queue.\n\
    \n## Queue ADT Operations:\n"
