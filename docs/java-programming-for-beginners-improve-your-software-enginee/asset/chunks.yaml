    ## Renaming and Deleting Files\n\n### Renaming\n\nIn Java, there’s a method called\
    \ `renameTo(fileName)` within the `File` class that we can use to rename a file.\n\
    \n#### Deleting Files\n\nFiles that are saved using the `java` program will be\
    \ permanently removed without moving to the trash/recycle bin. Using `java.io.File.delete()`\
    \ deletes this abstract pathname from the file or folder. Using `java.nio.file.files.deleteifexists`\
    \ will delete a folder, if it occurs. If the folder is not open, it also deletes\
    \ a folder listed in the route.\n\n## Advanced Topics In Java\n\n### Generics\n\
    \nIn any non-trivial software project, bugs are simply a fact of life. Careful\
    \ planning, programming, and testing may help diminish their omnipresence, but\
    \ somehow they will always find a way to enter your system somewhere. This becomes\
    \ especially apparent as new features are introduced, and your code base's magnitude\
    \ and complexity increases.\n\nFortunately, it is easier to detect some bugs than\
    \ others. Compiletime bugs, for instance, can be identified soon; you can use\
    \ the compiler's error codes to determine what the issue is and solve it, right.\
    \ Runtime bugs, however, can be much harder; they do not always occur, and when\
    \ they do, they may be at a point far from the true cause. Generics help stabilize\
    \ your software by creating it feasible at compile time.\n\n### Generic Types\n\
    \nA generic form is a types-parameterized generic category or interface. It is\
    \ possible to modify an easy box class to show the idea. Consider a non-generic\
    \ box category that works on any sort of object. It only requires to provide two\
    \ techniques: `set()` (adding an item to the cabinet, and `get()` (retrieving\
    \ it). Because their methods accept or return an object, you are free to pass\
    \ in whatever you want, as long as it is not one of the primitive types. There\
    \ is no way to check how the class is used at compile time.\n\nThe segment of\
    \ the type parameter, delegated by angle brackets `< >`, displays the title of\
    \ the category. It indicates the parameters of the form (also known as factors\
    \ of the sort) `T1`, `T2`, till `Tn`. You generate a generic type statement by\
    \ altering the file `government class box` to `government class box <T >` to update\
    \ the box category to use generics. This presents the type variable, `T`, which\
    \ can be used inside the class anywhere. This replaces all `Object` events with\
    \ `T`.\n"
