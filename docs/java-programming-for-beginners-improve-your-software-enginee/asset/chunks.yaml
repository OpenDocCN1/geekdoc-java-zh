- fmt: "\nA variable, on the other hand, is a \"object\" that has a specified data\
    \ type and the value that has been assigned or received. It's termed a variable\
    \ because the value it contains might change depending on how it's utilized in\
    \ the code, how the coder declares its value, or even how the program's user interacts\
    \ with it. In a nutshell, a variable is a data type's storage unit. Having access\
    \ to variables allows programmers to easily label and refer to stored values.\n\
    \n## Types of variables in Java\n\nJava requires the programmer to use declaration\
    \ statements, lines of code used to declare variables and define them by specifying\
    \ the particular data type and name. Java has a specific way of treating variables,\
    \ by defining variables as containers that contain a certain type and value of\
    \ information, unlike some languages such as python, which only requires a declaration\
    \ of a variable, and the variable can dynamically change its type; Java variables\
    \ are static, which retain their type once declared.\n\n```\nInt number = 20;\n\
    Boolean completed = true;\n\nString hello = “Hello World!”\n```\n\nThe syntax\
    \ in declaring is seen in the previous examples, with the type of the variable\
    \ coming first, then the name of the variable, then the value. Note as well that\
    \ the declaration statement can be composed of multiple declarations in one line,\
    \ as in the following example:\n\n```\nInt number = 20, Boolean completed = true,\
    \ string hello = “Hello World!”\n```\n\nJava variables can be declared without\
    \ any value at the start; in cases such as these, Java chooses to declare these\
    \ variables with a particular default value, for example:\n\n```\nByte a;\nShort\
    \ num;\nBoolean answer;\n```\n\nWill result in the values 0, 0, and false, respectively.\
    \ A more complete list of default values is as follows: the `byte`, `short`, `int`,\
    \ and `long` data types will all result in a default value of 0, while the `float`\
    \ and `double` data types will have a default 0.0 value, the `char` data type\
    \ will result in ‘u\\0000’ value, a string or any other object will have a null\
    \ default value, and all Booleans will begin with a false default value. \n\n\
    In Java, variables are static when declared, meaning that the programmer must\
    \ define the data type that the variable will be containing. To illustrate, if\
    \ we wish to use a variable `num` to store a number, we would first have to declare\
    \ the variable: `int num`, before we can assign a value, such as `num = 10`. \n\
    \nThe process above is usually known as and referred to as an \"assignment statement,\"\
    \ where a value is assigned to the variable as declared by the programmer. However,\
    \ one prominent thing about how Java, and in fact how most programming languages,\
    \ works is that in the assignment statement, such as in our example of `num =\
    \ 10`, the actual value stored is the one on the right side of the equals sign,\
    \ the value of 10, and `num` is just the \"marker\" to call that stored value.\
    \ This is why there are many Java programmers that tend to prefer the jargon of\
    \ \"getting\" a value rather than \"assigning,\" though for the most part, they\
    \ may be employed interchangeably, and outside of some rare scenario, function\
    \ mostly the same way.\n\nNote, however, that once values have been assigned to\
    \ variables, functions need to be carried out in order for the data inside that\
    \ variable to change its data type. \n\n## Naming a variable\n\nCreating variables\
    \ is an easy task, especially given how Java programmers tend to create and name\
    \ them after the data type or the purpose of what the variable will store. However,\
    \ there are a few rules when it comes to naming these variables, else Java will\
    \ not recognize it, and an error message will result. The main restrictions around\
    \ variable names are that it should not begin with a special character, such as\
    \ an underscore or a number. However, variable names can consist of characters\
    \ such as letters and numbers, and even an underscore, provided that the underscore\
    \ is not placed at the start. No other characters may be used, such as the `#`\
    \ or even `$`, as these special characters have different uses in Java, and thus\
    \ will not be recognized in a variable name.\n\nWhile those are the major rules,\
    \ here are some tips when it comes to naming variables. The variable name should\
    \ be descriptive, as in longer codes it may be difficult to recall just what \"\
    x\" is for. Having a variable name such as \"count\" or \"output\" is much easier\
    \ to recall as compared to having a generic \"x\" or \"y\" and will help in avoiding\
    \ confusion. Addition to being descriptive, variables will also be easier to use\
    \ if their names are kept fairly short. While having a variable name such as banking\
    \ information account records is very descriptive, typing it repeatedly as needed\
    \ in the program will get exhausting, and having longer variable names increase\
    \ the chances of typographical errors, which will lead to bugs in the code, resulting\
    \ in a run - time error or the code not working as intended, or working, but introducing\
    \ bugs along the way. Note as well that it has always been a practice for Java\
    \ variables to be written in all lower––case letters, and while there is no restriction\
    \ on capitalization, keeping things in lowercase simplifies things, as a missed\
    \ capitalization may result in the variable not being recognized, as Java reads\
    \ an upper––case letter as an entirely different character versus a lower––case\
    \ letter.\n\n## Java primitive types\n\n## Method Naming Conventions\n\nWe shall\
    \ revisit the naming conventions in Java since you will be using member methods.\
    \ Methods in Java programming perform operations, they also receive any argument\
    \ provided by a caller, and it can also return a result of an operation to a caller.\
    \ Here’s the syntax for declaring a method:\n\n```\n[Access Control Modifier]\
    \ Return Type methodName ([set of parameters]) { // body of the method\n......\n\
    }\n```\n\nHere are a few rules to remember when you make the names for the methods\
    \ that you will write. Method names are always verbs or more specifically verb\
    \ phrases (which means you can use multiple words to name them). The first word\
    \ of the method name should all be in lower case, while the rest of the words\
    \ should follow a camel case format. Here is an example: `writeMethodNamesThisWay()`\n\
    \nNow, you should remember that verbs are used for method names, and they indicate\
    \ an action while nouns are used for variable names, and they denote a certain\
    \ attribute. Following the syntax for declaring a method and following the name\
    \ conventions for this Java construct, here’s a sample code that can be used to\
    \ compute the area of a circle.\n\n```\npublic double computeCircleArea() {\n\
    return radius * radius * Math.PI;\n}\n```\n\n## Using Constructors in Your Code\n\
    \nWe’ll just go over some additional details as they relate to objectoriented.\
    \ As stated earlier, a constructor will look like a method, and you can certainly\
    \ think of it and treat it like a special kind of method in Java programming.\n\
    \nHowever, a constructor will still be different from a method in several ways.\
    \ The name of a constructor will be the same as the class name. Use the keyword\
    \ or operator `new` to create a new instance of the constructor and also to initialize\
    \ it. Here’s an example using the class `Employee` and a variety of ways to initialize\
    \ it in your code:\n\n```\nEmployee payrate1 = new Employee( );\nEmployee payrate2\
    \ = new Employee(2.0);\nEmployee payrate3 = new Employee(3.0, “regular”);\n```\n\
    \nA constructor will also implicitly return void––that simply means it doesn’t\
    \ have a return type. You can’t put a return statement inside the body of a constructor\
    \ since it will be flagged by compilers as an error. The only way you can invoke\
    \ a constructor is via the use of the `new` statement. We have already given you\
    \ several ways how you can invoke constructors in the samples above.\n"
  raw: "A variable, on the other hand, is a \"object\" that has a specified data type\
    \ and the value that has been assigned or received. It's termed a variable because\
    \ the value it contains might change depending on how it's utilized in the code,\
    \ how the coder declares its value, or even how the program's user interacts with\
    \ it. In a nutshell, a variable is a data type's storage unit. Having access to\
    \ variables allows programmers to easily label and refer to stored values.\n\n\
    Types of variables in Java\n\nJava requires the programmer to use declaration\
    \ statements, lines of code used to declare variables and define them by specifying\
    \ the particular data type and name. Java has a specific way of treating variables,\
    \ by defining variables as containers that contain a certain type and value of\
    \ information, unlike some languages such as python, which only requires a declaration\
    \ of a variable, and the variable can dynamically change its type; Java variables\
    \ are static, which retain their type once declared.\n\nInt number = 20;\n\nBoolean\
    \ completed = true;\n\nString hello = “Hello World!”\n\nThe syntax in declaring\
    \ is seen in the previous examples, with the type of the variable coming first,\
    \ then the name of the variable, then the value. Note as well that the declaration\
    \ statement can be composed of multiple declarations in one line, as in the following\
    \ example:\n\nInt number = 20, Boolean completed = true, string hello = “Hello\
    \ World!”;\n\nJava variables can be declared without any value at the start; in\
    \ cases such as these, Java chooses to declare these variables with a particular\
    \ default value, for example:\n\nByte a;\n\nShort num;\n\nBoolean answer;\n\n\
    Will result in the values 0, 0, and false, respectively. A more complete list\
    \ of default values is as follows: the byte, short, int, and long data types will\
    \ all result in a default value of 0, while the float and double data types will\
    \ have a default 0.0 value, the char data type will result in ‘u\\0000’ value,\
    \ a string or any other object will have a null default value, and all Booleans\
    \ will begin with a false default value. \n\nIn Java, variables are static when\
    \ declared, meaning that the programmer must define the data type that the variable\
    \ will be containing. To illustrate, if we wish to use a variable num to store\
    \ a number, we would first have to declare the variable: \"int num,\" before we\
    \ can assign a value, such as \"num = 10.\" \n\nThe process above is usually known\
    \ as and referred to as an \"assignment statement,\" where a value is assigned\
    \ to the variable as declared by the programmer. However, one prominent thing\
    \ about how Java, and in fact how most programming languages, works is that in\
    \ the assignment statement, such as in our example of num = 10, the actual value\
    \ stored is the one on the right side of the equals sign, the value of 10, and\
    \ num is just the \"marker\" to call that stored value. This is why there are\
    \ many Java programmers that tend to prefer the jargon of \"getting\" a value\
    \ rather than \"assigning,\" though for the most part, they may be employed interchangeably,\
    \ and outside of some rare scenario, function mostly the same way.\n\nNote, however,\
    \ that once values have been assigned to variables, functions need to be carried\
    \ out in order for the data inside that variable to change its data type. \n\n\
    Naming a variable\n\nCreating variables is an easy task, especially given how\
    \ Java programmers tend to create and name them after the data type or the purpose\
    \ of what the variable will store. However, there are a few rules when it comes\
    \ to naming these variables, else Java will not recognize it, and an error message\
    \ will result. The main restrictions around variable names are that it should\
    \ not begin with a special character, such as an underscore or a number. However,\
    \ variable names can consist of characters such as letters and numbers, and even\
    \ an underscore, provided that the underscore is not placed at the start. No other\
    \ characters may be used, such as the # or even $, as these special characters\
    \ have different uses in Java, and thus will not be recognized in a variable name.\n\
    \nWhile those are the major rules, here are some tips when it comes to naming\
    \ variables. The variable name should be descriptive, as in longer codes it may\
    \ be difficult to recall just what \"x\" is for. Having a variable name such as\
    \ \"count\" or \"output\" is much easier to recall as compared to having a generic\
    \ \"x\" or \"y\" and will help in avoiding confusion. In addition to being descriptive,\
    \ variables will also be easier to use if their names are kept fairly short. While\
    \ having a variable name such as banking information account records is very descriptive,\
    \ typing it repeatedly as needed in the program will get exhausting, and having\
    \ longer variable names increase the chances of typographical errors, which will\
    \ lead to bugs in the code, resulting in a run - time error or the code not working\
    \ as intended, or working, but introducing bugs along the way. Note as well that\
    \ it has always been a practice for Java variables to be written in all lower––case\
    \ letters, and while there is no restriction on capitalization, keeping things\
    \ in lowercase simplifies things, as a missed capitalization may result in the\
    \ variable not being recognized, as Java reads an upper––case letter as an entirely\
    \ different character versus a lower––case letter.\n\nJava primitive types\n\n\
    Method Naming Conventions\n\n We shall revisit the naming conventions in Java\
    \ since you will be using member methods. Methods in Java programming perform\
    \ operations, they also receive any argument provided by a caller, and it can\
    \ also return a result of an operation to a caller. Here’s the syntax for declaring\
    \ a method:\n\n[Access Control Modifier] Return Type methodName ([set of parameters])\
    \ { // body of the method\n\n ......\n\n}\n\nHere are a few rules to remember\
    \ when you make the names for the methods that you will write. Method names are\
    \ always verbs or more specifically verb phrases (which means you can use multiple\
    \ words to name them). The first word of the method name should all be in lower\
    \ case letters, while the rest of the words should follow a camel case format.\
    \ Here is an example: writeMethodNamesThisWay( )\n\nNow, you should remember that\
    \ verbs are used for method names, and they indicate an action while nouns are\
    \ used for variable names, and they denote a certain attribute.\n\nFollowing the\
    \ syntax for declaring a method and following the name conventions for this Java\
    \ construct, here’s a sample code that can be used to compute the area of a circle.\
    \ public double computeCircleArea() {\n\nreturn radius * radius * Math.PI;\n\n\
    }\n\nUsing Constructors in Your Code\n\nWe’ll just go over some additional details\
    \ as they relate to objectoriented programming. As stated earlier, a constructor\
    \ will look like a method, and you can certainly think of it and treat it like\
    \ a special kind of method in Java programming.\n\nHowever, a constructor will\
    \ still be different from a method in several ways. The name of a constructor\
    \ will be the same as the class name. Use the keyword or operator “new” to create\
    \ a new instance of the constructor and also to initialize it. Here’s an example\
    \ using the class “Employee” and a variety of ways to initialize it in your code:\n\
    \nEmployee payrate1 = new Employee( );\n\nEmployee payrate2 = new Employee(2.0);\n\
    \nEmployee payrate3 = new Employee(3.0, “regular”);\n\nA constructor will also\
    \ implicitly return void––that simply means it doesn’t have a return type. You\
    \ can’t put a return statement inside the body of a constructor since it will\
    \ be flagged by compilers as an error. The only way you can invoke a constructor\
    \ is via the use of the “new” statement. We have already given you several ways\
    \ how you can invoke constructors in the samples above. "
