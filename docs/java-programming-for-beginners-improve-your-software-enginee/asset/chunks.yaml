    \ HelloWorld constructor.\n\n*   Blocks of code are enclosed in curly brackets,\
    \ { }, and each line of code ends with a semicolon;\n\n*   Every Java program\
    \ runs the main() method first.\n\n*   The main() method calls the class constructor\
    \ in all the programs in this book. Therefore, the main() method will run first,\
    \ followed by the class constructor.              \n\n*   Each statement within\
    \ the curly brackets is run, one at a time, in the order it appears in the code.\n\
    \n*   Blank lines between lines of code have no effect on how the code runs.\n\
    \n*   Blank lines are added to make the code easier for you to read.\n\n*   Print\
