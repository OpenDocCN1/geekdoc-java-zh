    `forEach()` 方法具有非常广泛的适用性。它是遍历集合的一种更方便的方式，应该成为你的事实上的标准。然而，作为一种声明式结构，有些事情是你无法完成的。最显著的一是，你不能像在
    `whileloop` 中那样改变本地变量的状态。算法必须以函数式的方式重新思考。目前，只需知道 `forEach()` 适用于不改变状态的迭代即可。


    我们现在来看下 `Collection` 中提供的另一个新方法：


    ![](img/image.041.jpeg)


    `removeIf()` 方法将迭代、测试和移除的整个过程内部化。它只需要告诉它移除的条件是什么。


    使用现在已经熟悉的 `Predicate` 函数式接口，我们可以很容易地确定要使用什么种类型的 lambda。


    ![](img/image.042.jpeg)


    要替换 `List` 的所有内容，我们可以使用 `replaceAll()`：


    ![](img/image.043.jpeg)


    `replaceAll()` 使用 `UnaryOperator` 作为其函数式接口，它是 `Function` 的子接口。


    `removeIf()` 和 `replaceAll()` 适用于所有子类，但有一个限制：底层类必须支持删除操作，否则将抛出异常。


    这些示例展示了函数式编程的紧凑性。大部分工作由函数完成，而 lambda 提供了细节。


    ## Map 接口


    在 map 中将列表作为值时，最大的烦恼之一是在添加、更新或删除元素之前，总是需要检查 map 是否存在。首先，你必须尝试提取列表，如果没有找到则创建它。例如，假设我们有一个通过
    `Map` 实现的更新电影数据库的方法。map 的键是电影的年份，值是该年份的电影列表。在 Java 8 之前，代码看起来如下：


    ![](img/image.044.jpeg)


    Java 8 通过这些默认方法提供了一个更好的替代方案：


    ![](img/image.045.jpeg)


    让我们从 `compute` 方法开始。每个变体都允许通过映射函数来生成 map 的值。对于 `computeIfPresent()` 和 `computeIfAbsent()`，映射是根据条件执行的。因此，通过这些方法，我们可以重构之前的代码示例：


    ![](img/image.046.jpeg)


    注意，列表的创建是由 `computeIfAbsent()` lambda 处理的。当需要通过 `compute()` 方法将电影添加到列表时，`add()`
    永远不会抛出 `NullPointerException`，因为保证了列表已经被创建。


    在这种情况下，使用 `computeIfAbsent()` 方法有点大材小用，我们使用 `putIfAbsent()` 会更好：


    ![](img/image.047.jpeg)


    此方法没有 lambda，并期望给定一个值——而不是计算值。尽管没有使用 lambda，这仍然是一个函数式风格的方法。它证明了你可以以函数式方式表示代码，而不一定需要使用
    lambda。


    如果你仍然需要提取数据，可以使用 `getOrDefault()` 方法使用更函数式的方法：


    ![](img/image.048.jpeg)


    你也可以使用 `merge()` 方法作为替代方案。它方便了对列表存在性的检查。在下面的示例中，如果键（年份）在 map 中不存在，它将把值（标题）放入 map
    中。如果存在，它允许 `BiFunction` 决定如何处理这两个列表：


    ![](img/image.049.jpeg)


    并且可以这样使用它：


    ![](img/image.050.jpeg)


    `BiFunction` 还可以返回 `null`，这会告诉 `merge` 删除该键。


    结论是，我们删除了检查元素是否存在的开销代码，现在可以关注真正重要的事情：定义如何创建列表以及如何向列表中添加元素。


    `Map` 接口已经丰富了如 `forEach()`、`replace()` 和 `replaceAll()` 等其他函数式方法，并使用了相同的代码内部化原理。请参阅录获取完整列表。


    ## Spliterator


    `Collections` 库在并发访问方面仍然受到相同的限制。如既往，你必须选择符合你线程安全要求的 `Collections` 库类。这是因为上面显示的新方法仅仅是运行在相同底层数据结构之上的函数式抽象。这些方法并不特别适合函数式编程的并行处理方法，因为它们仍然基于多个线程变异集合并同步访问底层数据的概念。然而，存在一种兼容的
    Java 8 新抽象。它是为了并行遍历数据而设计的。其核心理念体现在 `Spliterator` 接口中。该接口的前提是对数据进行分区，并将数据块交给不同的线程。可以从
    `Collection` 接口获取 `Spliterator`，包括子接口 `List` 和 `Set`。


    `Spliterator` 接口的核心是这三个方法：


    ![](img/image.051.jpeg)


    `trySplit()` 方法将底层数据一分为二。它创建一个带有一半数据的新 `Spliterator`，并将另一部分留在原始实例中。每个都可以交给一个线程，线程反过来使用
    `forEachRemaining()` 遍历分区的数据。`tryAdvance()` 方法是一种一次处理的变体，返回下一个元素，或者在列表耗尽时返回 `null`。


    Spliterators 本身不处理并行处理，而是提供执行它的抽象。以下是该概念的应用：


    ![](img/image.052.jpeg)


    给定一个标题和一个电影列表，`isMovieInList()` 方法并行化搜索以确定它是否包含在列表中。如果找到，将 `booleanHolder` 中的标志置为
    true。它从列表中获取 `Spliterator` 实例，将其一分为二，并将每一半交给每个线程。如果有更多可用线程，可以重复此拆分过程。


    Spliterators 也可以从其他 `Collection` 类型以及其他库中获取。有许多不同的实现用于处理不同的特性，包括有限/无限、有序/无序、已排序/未排序以及可变/不可变。


    它们继承了其数据结构的特性。


    Spliterators 是一种较低层次的抽象，旨在让你对并行迭代进行细粒度的控制。然而，API 缺乏一些实现函数式友好算法所需的精炼。在上面的示例中，我们需要在
    `BooleanHolder` 中存储搜索所需的状态。


    ## 总结


    这完成了我们对 Java 8 新及改进的 Collections 库以及标准函数式接口的概述。正如标准 JDK 库为了支持函数式概念发生了许多变化一样，预计第三方
    API 发生重大变化。但最大的变革尚未到来。


    ## 关键点


    - 新包 `java.util.function` 包含函数式接口。它们被分为四类，每个类由其原型代表：`Consumer`、`Function`、`Predicate`
    和 `Supplier`。

    - 每个函数式接口类都定义了针对类型和值的变体。

    - 函数式接口还定义了允许函数式组合的方法。多个不同的 lambda 可以融合为看起来像单一函数的复合函数。

    - `Collections` 库已经过重构和函数化。这是通过在顶层使用默认方法实现的，从而确保了向后兼容。

    - `Collections`、`Lists`、`Sets` 和 `Maps` 中的新函数式方法是针对内部迭代设计的。以 lambda 和方法引用的形式的行为参数被传递给遍历集合并作用于每个元素的方法。

    - 内部迭代是声明式编程的一种形式，是函数式编程的基础。它让开发者无需描述“如何”做，而是关注“做什么”。

    - `Spliterators` 是为集合的并行迭代而设计的。


