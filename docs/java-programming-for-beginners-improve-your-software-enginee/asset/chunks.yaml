- fmt: "\nOne final difference is that constructors can’t be inherited. Let’s go back\
    \ to the examples provided above––the first line includes `Employee( );`––that\
    \ is called a default constructor. As you can see, it has no parameters whatsoever.\
    \ The job of a default constructor is to simply initialize the member variables\
    \ to a specific default value. In the example above, the member variable `payrate1`\
    \ was initialized to its default pay rate and employee status.\n\nCan constructors\
    \ be overloaded too? Yes, they can. Constructors behave like methods too, so that\
    \ means you can overload a constructor just the same way you overload a method.\
    \ Here are a few examples of how you can overload a constructor. We use the `Employee`\
    \ class and overload it using different parameters.\n\n```\nEmployee( )\nEmployee(int\
    \ r)\nEmployee(int r, String b)\n```\n\n### How to initialize a variable \n\n\
    Now that we know how to declare variables, and we know the various types of variables\
    \ that are available to us, the next thing to do is to learn how to make use of\
    \ these variables, in something called “expressions.” Expressions are the most\
    \ used building blocks of a Java program, generally meant to produce a new value\
    \ as a result, though in some cases, expressions are used to assign a new value\
    \ to a variable. Generally, expressions are made up of things such as values,\
    \ variables, operators, and method calls. There are also some expressions that\
    \ produce no result, but rather affect another variable. One example would be\
    \ an expression that changes the value of a variable based on an operation: there\
    \ is no new value output, and there is no true “assignment” of a new value, but\
    \ rather there is what is called a side effect that results in a changed variable\
    \ value.\n\nThe \"Hello World\" printing program, we introduced raw values into\
    \ the print function, also known as \"hard coding\" the output. However, at this\
    \ point, we should try to incorporate what we have learned about variables. Variables\
    \ operate much the same way as raw values, as they simply reference a previously\
    \ stored value by the computer, and as such the programmer can just use the variable\
    \ name instead of the value. In order to demonstrate this, let us remember the\
    \ previous \"Hello World\" program:\n\n```\nprint (\"Hello World\") ;\ninput (\"\
    \\n\\nPlease press the return key to close this window.\") ;\n```\n\nNow, instead\
    \ of hard––coding the \"Hello World\" string, we can simply declare it into a\
    \ variable and have the program output that variable. This should end up looking\
    \ as: `String = \"Hello World\" ; print(string) ; input (\"\\n\\nPlease press\
    \ the return key to close this window.\") ;`\n\nThis should come out with the\
    \ same result as the previous program, looking something similar to:\n\nHello\
    \ World\nPlease press the return key to close this window.\n\n# Chapter 3\n\n\
    ## Java Basics\n\n### Java Development Kit\n\n![C:\\Users\\Talha\\Downloads\\\
    boitumelo-phetla-veQfS-T6ROs-unsplash.jpg](image.004.jpeg)\n\nThe JDK provides\
    \ the tools needed to build, test, and monitor robust Java-anchored applications.\
    \ It allows developers to access software components and compile applications\
    \ during Java programming operations. For example, a developer needs a JDK-powered\
    \ environment to be able to write applets or implement methods.\n\nSince the JDK\
    \ more or less performs the operations of a Software Development Kit (SDK), one\
    \ could easily confuse the scope and operations of the two items. Whereas the\
    \ JDK is specific to the Java programming language, an SDK has broader applicability.\
    \ But a JDK still operates as a component of an SDK in a program development environment.\
    \ This means that a developer would still need an SDK to provide certain tools\
    \ with broader operational characteristics and that are not available within the\
    \ JDK domain. Developer documentation and debugging utilities, as well as application\
    \ servers, are some of the crucial tools that SDK supplies to a Java programming\
    \ environment.\n\nThe scope of JDK deployment depends on the nature of the tasks\
    \ at hand, the supported versions, and the Java edition that is in use. For example,\
    \ the Java Platform, Standard Edition (Java SE) Development Kit is designed for\
    \ use with the Java Standard Edition.\n\nThe Java Platform, Enterprise Edition\
    \ (Java EE), and the Java Platform, Macro Edition (Java ME), are the other major\
    \ subsets of the JDK. Details of each of these Java editions are described in\
    \ detail in the subtopics below. The JDK has been a free platform since 2007,\
    \ when it was uploaded to the OpenJDK portal. Its opensource status facilitates\
    \ collaborations and allows communities of software developers to clone, hack,\
    \ or contribute ideas for advancements and upgrades.\n\n#### Java SE\n\nThe Java\
    \ SE powers a wide variety of desktop and server applications. It supports the\
    \ testing and deployment of the Java programming language within the development\
    \ environment of these applications. Some of the documentations associated with\
    \ the recent releases of Java SE include an advanced management console feature\
    \ and a revamped set of Java deployment rules. Java SE 13.0.1 is the latest JDK\
    \ version for the Java SE platform at the time of writing this book.\n\nThe Java\
    \ SE SDK is equipped with the core JRE capabilities alongside a portfolio of tools,\
    \ class libraries, and implementation technologies that are designed for use in\
    \ the development of desktop applications. These tools range from simple objects\
    \ and types for Java program implementations to advanced class parameters that\
    \ are suited for building applications with networking capabilities and impenetrable\
    \ security characteristics. Java programmers can also apply this particular JDK\
    \ on the development of Java applications used to simplify access to databases\
    \ or to enhance GUI properties.\n\n#### Java EE\n\nThe Java EE platform is an\
    \ open-source product that is developed through the collaborative efforts of members\
    \ of the Java community worldwide. Java EE is closely related to the Java SE because\
    \ the former is built on top of the latter. This particular software is integrated\
    \ with transformative innovations that are designed for use in enterprise solutions.\
    \ The features and advancements that are introduced in new releases often reflect\
    \ the inputs, requirements, and requests of members of the Java community. The\
    \ Java EE actually offers more than twenty implementations that are compliant\
    \ with Java programming.\n\nThe Java EE SDK is meant for use in the construction\
    \ of applications for large-scale operations. Just as its name suggests, this\
    \ particular Java SDK was created to provide support for enterprise software solutions.\
    \ The JDK features a powerful API and runtime properties that Java programmers\
    \ require to build applications with scalable and networkable functionalities.\
    \ Developers in need of developing multi-tiered applications could find this JDK\
    \ useful as well.\n\nThe Java EE 8 is the latest release at the time of writing\
