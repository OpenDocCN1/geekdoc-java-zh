    按照约定，类型标识通常是单个大写字母。这与你已经熟悉的变量命名规范形成了鲜明对比，并且有一个充分的理由：如果没有这种约定，很难区分类型变量与普通的类或对象名称。


    最常用的类型参数名称有：


    * `E` - Element（元素，在 Java 集合框架中广泛使用）

    * `K` - Key（键）

    * `N` - Number（数字）

    * `T` - Type（类型）

    * `V` - Value（值）

    * `S`, `U`, `V` 等——第 2、第 3、第 4 类型


    你将在整个 JDK 和 API 中看到这些名称。


    ## 调用和实例化泛型类型


    为了在你的系统中提到泛型框类别，必须执行一次泛型类型调用，将 `T` 带入一个特定的具体值，例如 `Integer`：


    ```

    Box<Integer> integerBox;

    ```


    你可能认为泛型排序的调用类似于普通的过程调用，但实际上你并不是在过程中添加了断言，而是将一个类型参数——在本例中为 `Integer`——传递到了框类别本身。


    许多设计者交叉使用“类型参数”（type parameter）和“类型语句”（type statement）这两个词，但它们的定义不同。在编码时，为了生成参数化类型，需要提供参数。因此，`Foo
    < T >` 中的 `T` 是类型参数，而 `Foo < String > f` 是类型语句。在使用这些词时，本类遵循这一概念。


    与任何其他变量语句一样，此软件并没有生成一个新的框实例。它只是声明 `integerBox` 将拥有指向“Integer 框”的引用，这就是读取 `Box
    < Integer>` 的方式。泛型类型调用通常被称为参数化类型。


    要实例化此类，请像常一样使用 `new` 关键字，但在类名和括号之间放置 `<Integer>`：


    ```

    Box<Integer> integerBox = new Box<Integer>();

    ```


    ## 菱形语法


    在 Java 的最新版本中，只要编译器能够确定或从上下文推断出类型参数，你就可以空类型参数集（`< >`）替换调用泛型类构造函数所需的类型参数。这对尖括号
    `< >` 被形象地称为“菱形”（The Diamond）。例如，你可以使用之前的声明来生成 `Box < Integer>` 的实例：`Box<Integer>
    integerBox = new Box<>();`


    ## 泛型方法


    泛型技术是实现其自身类型参数的技术。这类似于泛型类型声明，但类型参数的作用范围局限于声明它的方法。除了泛型类构造函数外，还允许静态是非静态泛型方法。


    泛型方法的语法涉及一组在过程返回类型之前的尖括号内的类型参数列表。对于静态泛型方法，类型参数段必须出现在方法的返回类型之前。`Util` 类涉及一个比较两个
    `Pair` 项的泛型方法。


    ```

    Pair<Integer, String> ex1 = new Pair<>(49, "string1"); Pair<Integer, String> ex2
    = new Pair<>(64, "string2"); boolean comparison = Util.<Integer, String>compare(ex1,
    ex2);

    ```


    ## 边界类型参数


    有时，你希望限制在参数化类型语句时可以使用类型种类。例如，一个处理数字图形的方法可能只能识别 `Number` 情况或其子类。这就是限制此类类型参数的用途。


    列出类型参数的名称以表示定义的类型参数，并配有扩展关键字 `extends`，随后跟上上界，在本例中为 `Number`。注意，在此语境下，`extends`
    通常用于表示“继承”（如类课程）或“实现”（如接口）。


    ## 多重边界


    类型参数可以有多个边界。具有多个边界的类型变量是边界中列出的所有类型的子类型。如果其中一个边界是类，则必须首先指定。例如：


    ```

    class X { /* ... */ } interface Y { /* ... */ } interface Z { /* ... */ }


    class R <T extends X & Y & Z> { /* ... */ }

    ```


    如果未首先指定边界 `X`，你将得到编译时错误：


    ```java

    class R <T extends Y & X & Z> { /* ... */ } // 编译错误

    ```


    # 第 11 章：集合


    ![C:\Users\Talha\Downloads\pexels-thisisengineering-3861943.jpg](img/image.038.jpeg)


    ## 集合的函数化


    当我们外部化代码时，我们展示了代码的每一个阶段。这是命令式编程的一个定义特征。然而，函数式编程的一个反复出现的主题是相反的概念：内部化代码。内部化代码是在函数内部隐藏细节的过程。然而，函数式编程通过将日常编程微模式转换为函数，更进了一步。这些微模式之一就是对数据迭代，无论是通过迭代器、for
    循环还是 while 循环。函数式编程改变了我们对事物的感知。


    Java 的函数化工作在没有重新设计集合库（特别是 `Collection`、`Map`、`List` 和 `Set` 接口）之前，将是不完全的。这是因为迭代经常发生在集合上，而集合是
    Java 程序的基石。这是函数化尝试发生的自然场所。然而，任何重大的修改（例如向 `Collection` 接口引入新方法）都会破坏与所有 Java 8 之前项目的后兼容性。这不仅涵盖了扩展
    `Collection` 接口 JDK 自身的体系，还涵盖了任何或或源的第三方库和内部类。


    现在，我们可以将学到的关于 Java 标准函数接口的知识应用到集合上。让我们看看 Java 8 的集合发生了什么变化。


    ### Collection 接口


    我们首先查看适用于列表和集合的 `Collection` 接口中一个全新的默认方法。这是 `forEach()` 方法：


    ![](img/image.039.jpeg)


    该方法遍历整个集合，让 `Consumer` 决定对每个元素做什么。这就是内部迭代的概念，也是声明式编程的一种体现。它没有指定如何迭代。这与外部迭代对立，在外部迭代中，如何迭代的细节以及对每个元素做什么都是在代码中指定的。

