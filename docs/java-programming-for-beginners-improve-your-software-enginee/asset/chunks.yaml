- fmt: '

    The `forEach()` method has a very wide range of applicability. It is a much more
    convenient way to iterate through collections and should be your de-facto standard.
    However, being a declarative construct, there are some things you will not be
    able to do. Most notably, you cannot change the state of local variables like
    you could in a `whileloop`. Algorithms must be re-thought functionally. For now,
    just know that `forEach()` is ideal for iterations that do not mutate state.


    We now look at another new method available in `Collection`:


    ![](image.041.jpeg)


    The method `removeIf()` internalizes the entire process of iterating, testing,
    and removing. It requires only to be told what the condition for removal is.


    Using the now-familiar `Predicate` functional interface, we can easily figure
    out what kind of lambda to use.


    ![](image.042.jpeg)


    To replace all contents of a `List`, we can use `replaceAll()`:


    ![](image.043.jpeg)


    `replaceAll()` uses a `UnaryOperator` as its functional interface, which is a
    `Function` sub interface.


    Both `removeIf()` and `replaceAll()` are available to all subclasses with one
    caveat: the underlying class must support removal, or an exception will be thrown.


    These examples show the compactness of functional programming. Most of the work
    was done by the function with the lambda providing the details.


    ## Map interface


    One of the biggest irritants of using lists as values in maps is the constant
    need to check for the presence of the map before adding, updating, or removing
    an element. First, you must try to extract the list and create it if it is not
    found. For example, say we have a method that updates a movie database implemented
    as a `Map`. The map’s key is the year of the movie, and its value is a list of
    movies for that year. Pre-Java 8, the code would look like this:


    ![](image.044.jpeg)


    Java 8 offers a better alternative with these default methods:


    ![](image.045.jpeg)


    Let’s start with the `compute` methods. Each variant allows the map’s value to
    be generated by the mapping function. For `computeIfPresent()` and `computeIfAbsent()`,
    mapping occurs conditionally. So with these methods, we can refactor the previous
    code example:


    ![](image.046.jpeg)


    Notice that the creation of the list is handled by the `computeIfAbsent()` lambda.
    When it is time to add the movie to the list, via the `compute()` method, the
    `add()` will never throw a `NullPointerException` because the list is guaranteed
    to have been created.


    In this case, using the `computeIfAbsent()` method is overkill, and we would be
    better off with `putIfAbsent()`:


    ![](image.047.jpeg)


    This method is lambda-less and expects a value to be given—not calculated. This
    is still a functional style method even though no lambda was used. It proves the
    point that you can express code functionally without necessarily using lambdas.


    If you still need to extract the data, you can use a more functional approach
    with the `getOrDefault()` method:


    ![](image.048.jpeg)


    You can also use the `merge()` method as an alternative. It facilitates the checking
    of the existence of a list. In the example below, if the key (year) doesn’t exist
    in the map, it puts the value (titles) on the map. If it does exist, it allows
    a `BiFunction` to decide what to do with the two lists:


    ![](image.049.jpeg)


    And it can be used this way:


    ![](image.050.jpeg)


    The `BiFunction` can also return `null`, which tells the `merge` to delete the
    key.


    The takeaway is that we have removed the overhead code of checking for the existence
    of an element and can now focus on what really matters: defining how to create
    the list and how to add an element to the list.


    The `Map` interface has been enriched with other functional methods such as `forEach()`,
    `replace()`, and `replaceAll()` and uses the same principle of code internalization.
    Consult the appendix for the complete listing.


    ## Spliterator


    The `Collections` library is still subject to the same constraints regarding concurrent
    access. As always, you must choose the `Collections` library class that corresponds
    to your thread safety requirements. This is because the new methods shown above
    are just functional abstractions riding above the same underlying data structures.
    These methods are not particularly amenable to functional programming’s take on
    parallel processing because they are still based on the notion of multiple threads
    mutating the collection and synchronizing access to the underlying data. However,
    there exists a new Java 8 abstraction that is compatible. It is designed to iterate
    over data in parallel. The idea is embodied by the `Spliterator` interface. The
    premise of this interface is to partition the data and handoff chunks to different
    threads. `Spliterators can be obtained from the `Collection` interface, including
    subinterfaces `List` and `Set`.


    Central to the `Spliterator` interface are these three methods:


    ![](image.051.jpeg)


    The method `trySplit()` partitions the underlying data in two. It creates a new
    `Spliterator` with half the data and keeps the other half in the original instance.
    Each can be given to a thread which, in turn, iterates over the partitioned data
    using `forEachRemaining()`. The method `tryAdvance()` is a one-at-a-time variant
    that returns the next element or `null` if the list has been exhausted.


    Spliterators do not handle parallel processing themselves but provide the abstraction
    to do so. Here’s the concept in action:


    ![](image.052.jpeg)


    Given a title and a list of movies, the method `isMovieInList()` parallelizes
    the search to determine if it is contained in the list. It sets the flag in `booleanHolder`
    to true if found. It obtains a `Spliterator` instance from the list, splits it
    in half, and handsoff one half to each thread. The splitting process can be repeated
    if further threads are available.


    Spliterators can be obtained from other `Collection` types as well as other libraries.
    There are many implementations designed that deal with different characteristics,
    including finite/infinite, ordered/non-ordered, sorted/non-sorted, and mutable/immutable.


    They inherit the qualities of their data structure.


    Spliterators are a lower-level abstraction designed to give you fine-grained control
    over parallel iteration. However, the API lacks some of the refinements needed
    to implement functionallyfriendly algorithms. In the above example, we needed
    to store the state in `BooleanHolder` for the search.


    ## Wrap up


    This completes our overview of the new and improved Java 8 Collections library
    as well as the standard functional interfaces. Just as there have been many changes
    in the standard JDK libraries to support functional concepts, expect major changes
    from 3rd party APIs. But the biggest change is yet to come.


    ## Key points


    - The new package `java.util.function` contains a set of functional interfaces.
    These are grouped into four families, each represented by their archetypes: `Consumer`,
    `Function`, `Predicate`, and `Supplier`.

    - Each family of functional interfaces defines variants that specialize in types
    and arity.

    - Functional interfaces also define methods that enable functional composition.
    Multiple disparate lambdas can be fused to form super functions that appear as
    one.

    - The `Collections` library has been revamped and functionalized. This has been
    achieved using default methods at top levels of the hierarchy, thereby ensuring
    backward compatibility.

    - The new functional methods in `Collections`, `Lists`, `Sets`, and `Maps` have
    been designed with internal iteration in mind. Behavioral parameters in the form
    of lambdas and method references are given to methods that iterate over collections
    and act upon each element.

    - An internal iteration is a form of declarative programming that is fundamental
    to functional programming. It relieves the developer from having to describe the
    “how” to do it and focuses instead on the “what” to do.

    - `Spliterators` are designed for parallel iteration over collections.

