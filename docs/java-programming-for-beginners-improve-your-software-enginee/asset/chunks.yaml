    \ as its superclass. So every program in this book will be a type of DIYWindow.\n\
    \n*   To create classes, right-click in the Package Explorer pane.\n\n*   Class\
    \ names can contain numbers, letters, dollar signs, and underscores. Dollar signs\
    \ and underscores are usually not used.\n\n*   Blanks or periods aren't allowed\
    \ in class names.\n\n*   Class names cannot start with a number.\n\n*   Class\
