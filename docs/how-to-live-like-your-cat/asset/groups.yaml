    ![](img/33ca6eec857ccf5f12ca203742da1a49_19_0.png)'
  - '[PAGE 20]


    YOUR CAT KNOWS HOW TO


    ASSERT ITSELF


    *‘I love them, they are so nice and selfish. Dogs are TOO good and unselfish.
    They make me feel*


    *uncomfortable. But cats are gloriously human’*


    L . M . M O N T G O M E RY, *A N N E O F T H E I S L A N D*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_20_0.png)


    Many of us find it hard to assert ourselves in front of other people, either


    out of shyness or lack of confidence. We take a step back, we say little, we


    behave as if other people are intellectually superior, or at least sufficiently


    sure of themselves to overpower everyone with their presence, their


    knowledge, often their idiocies if you actually listen to them.


    Who are these ‘other people’? They’re you and me, for we are all


    somebody’s ‘other’. If other people take up more space than you, it’s


    because you let them do so. It’s like cupboards: the more you have, the


    more you fill them.


    Do you find that other people invade your space, sometimes even


    stepping on your toes before walking all over you?


    Think of your cat. Try stepping on your cat’s paw, just to see their


    reaction. You’ll hear them, and possibly even feel them as they dig their


    claws into your calf!'
- md: '

    Stop getting walked all over. ‘Other people’ have no right to assert themselves
    in this way. They have only the space that you grant them; they have only your
    level of tolerance. They won’t stop at crushing your foot. They’ll tread you into
    the dirt, then drown you for good measure!


    There is a real difference between having charisma and a strong personality –
    like your cat – and crushing people in order to impose yourself.


    Cats take the space that is their due, without crushing their neighbour, but they
    do not tolerate any encroachment on that space. They assert themselves quietly.
    They don’t play the tyrant, but neither do they accept a walk-on part.


    **Know how to assert yourself calmly, and defend your space at the first attempt
    at intrusion. You deserve more than a walk-on part!**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_21_0.png)


    ## F O O D F O R T H O U H T


    ‘I wish I could write as mysterious as a cat’

    ED G A R A L L A N P O E


    ![](img/33ca6eec857ccf5f12ca203742da1a49_22_0.png)


    ## YOUR CAT IS WISE


    *I have studied philosophers and cats extensively. The wisdom of cats is infinitely
    superior’*

    H I P P O L Y T E T A I N E


    ![](img/33ca6eec857ccf5f12ca203742da1a49_23_0.png)


    With their attentive attitude – always listening, like some silent psychologist
    – a cat resembles a Buddhist teacher or an old sage. But it’s maybe more than
    just an impression. Perhaps we could learn from the way a cat does not exert itself
    unduly, but sits and contemplates the world.


    As the years pass, and we get older, we all acquire a little wisdom and perspective
    about the world, life and the eternal verities.


    How many of us have said at some point: ‘I’d like to be twenty again, but knowing
    everything I know now’? We acquire wisdom with time, whereas cats – who have no
    school, no books, no great thinkers, no external frame of reference, not even
    a large amount of years or experiences – possess a kind of innate wisdom, a wisdom
    of which we glean just a few snippets, and then only with much reflection, discussion,
    soul-searching and introspection.


    It’s a hard road – in more ways than one – to reach a point where we can calmly
    sit there perusing the horizon with a smile on our face, when a cat has known
    how to do that practically since birth.


    But how can we grasp the ins and outs of this unfathomable, almost mystical, wisdom
    cats exude?


    The truth is that they offer us this wisdom. And if you have a cat, you’ll know
    this. You must have already experienced that moment when, racked with doubts,
    the same thoughts revolving in your mind, unable to take a step back from it all,
    you look your cat straight in the eyes and it stares right back at you, as if
    reading your very soul. And you are filled with a deep conviction that, unlike
    you, your cat KNOWS. Or at least has KNOWN.


    There is something kind in your cat’s gaze, evoking that old legend of a Persian
    emperor who, having gathered his greatest sages, asked them to come up with a
    phrase that would suit all feelings and situations, good or bad, that a person
    might encounter in their life. The sages came back to the emperor some time later
    to deliver the phrase. The message that your cat conveys through its gaze when
    you are lost, that phrase which has come down through the ages is:


    **‘This too shall pass.’**


    Yes, for better or for worse, this too shall pass.


    We can sometimes spend too much time flailing around, and fall deaf to the essentials
    of existence. And maybe this is what your cat is telling you with its stillness,
    its contemplation and benevolent attitude: ‘I am here, keeping watch over you
    and looking out for you. This too shall pass.’


    **Wisdom is not a subject that can be learned or taught. It is a state, a stance
    that requires a step back from the agitation of life in order to comprehend it
    better in its universality. The wise person knows how to sit on the moon in order
    to gaze at the earth, just like the cat sits on the roof to observe the moon.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_25_0.png)


    ## YOUR CAT THINKS ABOUT ITSELF FIRST


    *‘A cat does not stroke us, it strokes itself on us’*

    A N T O I N E D E R I V A R O L


    ![](img/33ca6eec857ccf5f12ca203742da1a49_26_0.png)


    As we have seen, cats devote most of their lives to ensuring their own wellbeing.
    And in order to do that, you sometimes have to know how to be a little selfish
    and think only about yourself.


    That doesn’t mean being a navel-gazer, narcissist or egocentric, but giving yourself
    permission to place your personal happiness above that of others at times.


    You can’t give to others if you don’t know how to give to yourself. Take care
    of yourself, both physically and psychologically, before anything else; the key
    to your happiness depends on it.


    You’ll be able to give and share more, since you’ll be happy and fulfilled in
    your own life.


    Don’t wait for others before creating your own bubble of wellbeing and tenderness
    – it depends on you alone. Nobody will do it for you. Moreover, nobody can know
    what your welfare truly requires.


    So take yourself in hand, and, like your cat, construct your territory, your comfort
    zone and your means of self-fulfilment.


    Cultivate little pleasures every day, and never miss an opportunity to give yourself
    a little gift or an enjoyable moment, because you really do deserve it. Never
    doubt that!


    **Think about yourself and your wellbeing. Look after yourself. Nobody will do
    it better or do more for you than yourself.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_27_0.png)


    ## YOU R CAT’S D AY


    ### 7.45: BREAKFAST


    Water and milk for your cat, in a clean bowl. Kibble and wet food – from cans
    or pouches but always good, fresh stuff – served in a clean spot.


    This might seem obvious, but how many of us really take the time to have a proper
    breakfast? How many of us knock back a quick tea or coffee, leaning against the
    kitchen sink, not even bothering to prepare a nice slice of toast?


    You’ve taken care of your cat, now take care of yourself. Having a proper breakfast
    in a comfortable manner is the best way to start your day, just as it is for your
    cat. Take the time to eat, to make some toast and spread it with that good jam
    that’s been languishing at the back of the fridge. Eat what you like, but take
    your time and enjoy it.


    Breakfast is the most important meal of the day, as nutritionists are so fond
    of telling us. It’s also a way to look after yourself and start the day with a
    smile.


    ## YOUR CAT ACCEPTS IT AS IT IS, YOUR CAT LOVES ITSELF


    *‘Cats are only human; they have their faults’*

    K I N G S L E Y M I S


    ![](img/33ca6eec857ccf5f12ca203742da1a49_29_0.png)


    It’s a fact: we create pain and disappointment for ourselves when we are unable
    to accept ourselves as we. We are all born different, and most of us are dissatisfied
    with our condition, our body, our social standing. Far too many of us don’t love
    ourselves. We would rather be someone else instead of accepting who we are. Accepting
    ourselves also means discovering the riches and abilities that each of us possesses.


    Does your cat ask itself this? Does your cat wonder what it would be like to be
    another cat or a different animal? Such a question clearly enters a cat’s mind,
    because such a question is quite pointless. Cats are proud of what they are, as
    is proven by their almost haughty attitude to other animals – humans too sometimes.
    Your cat has the intelligence not to lumber itself with bogus questions that are
    liable to promote endless ruminations. Consequently, cat loves itself for itself,
    for what it is, and is therefore happy.


    Knowing how to accept yourself shouldn’t be complicated once you adopt the attitude
    of your cat, who considers itself to be great as it is. We love cats first and
    foremost because they love themselves. Why not do as they do, without asking too
    many questions?


    Just try this: stand in front of the mirror in the morning and say ‘You know I
    love you?’ while laughing. Seems simple, but try it. You’ll have no choice but
    to smile. But what does that smile mean? That you love yourself enough or not?
    From the tone of that smile in the mirror – sad or joyful – you will see the path
    you must travel to definitively love and accept yourself in your new cat persona.


    **To be loved, you must start by accepting and loving yourself.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_30_0.png)

