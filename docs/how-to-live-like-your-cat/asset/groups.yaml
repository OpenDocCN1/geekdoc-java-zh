    Cats adore their home, whatever the size. Their home is their domain, and


    they are the sole masters of the place. People who have a cat will often say,


    with a smile: ‘The cat doesn’t live with me. I live with the cat!’


    With a cat’s propensity to be the boss, to ‘delegate’, to get others to serve


    them, to be stubborn and do only that which pleases them, some cat owners


    let themselves – out of love – become overwhelmed by their cat’s needs and


    desires. Everyone needs to set their boundaries in order to live in harmony.


    But what interests us here is the love, attention and protection that a cat


