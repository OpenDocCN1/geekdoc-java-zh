    thing we do, or any changes to their environment, but it is rare that they will
    comment on anything.


    Our propensity to express ourselves about everything all of the time (and being
    a big chatterbox myself, I am more than familiar with what I’m talking about)
    sometimes obscures an important element for our wellbeing: learning to keep quiet.


    And as a big chatterbox I know all too well that sometimes we really do talk a
    lot of rubbish. There are times when we even go too far, or are in a bad mood,
    and what we say is misconstrued. It wasn’t what we meant to say, but it’s too
    late and the words are out there, unfiltered.


    Learning to keep your counsel means controlling your impulsiveness, avoiding talking
    drivel, and reflecting on and weighing up your thoughts before expressing them.
    It also means listening to what others have to say, not monopolising a conversation,
    and not asserting your own opinion as the last word on the matter.


    Learning to keep your counsel means keeping a slight distance, and maintaining
    a little secrecy in your life. Be sincere, but don’t be absolutely transparent
    about everything with everyone all of the time, so as to protect yourself from
    the worst of the backbiters.


    Expressing yourself is not the same as laying it on thick, and while discussion
    is vital, observation and listening are sometimes just as persuasive as any argument.


    **Learn to keep your counsel. Learn to no longer be the centre of everything at
    every moment through talking. Listen in order to learn, and know when to keep
    quiet so as to have more impact when you do speak.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_104_0.png)


    ## FOOD FOR THOUGHT


    ‘If a fish is the movement of water embodied, given shape, then a cat is a diagram
    and pattern of subtle air’


    DORIS LESSISSING


    ![](img/33ca6eec857ccf5f12ca203742da1a49_105_0.png)


    ## YOUR CAT IS A SINCERE FRIEND


    *‘Ne’er shall thy now expiring puss forget*

    *To thy kind care her long-enduring debt,*

    *Nor shall the joys that painless realms decree*

    *Efface the comforts once bestowed by thee’*


    ANNA SEWARD, ‘A OLD CAT’S DYING SOLILOQUY’


    ![](img/33ca6eec857ccf5f12ca203742da1a49_106_0.png)


    If your cat accepts you into its world, it will become your faithful, steadfast
    friend. Consequently, your cat will take care of you each day. It will pad up
    to you, meowing gently, to see how you’re doing, will listen to your complaining
    and will know how to reassure and console you. Your cat will be there for you
    at every moment.


    But are we humans just as present, just as attentive to our own friends? Honestly,
    don’t we occasionally let some relationships slide a bit, even though they have
    taken so long to develop?


    We should follow the example of our cats, and take the loyalty, abnegation, tenderness
    and friendship they show us and apply it to our friends almost to the letter.


    Life’s vicissitudes and changes mean that we often take voluntary or involuntary
    breaks from our nearest and dearest.


    The case of the new romantic relationship is one that we are all familiar with.
    Caught up in the passion of our newly forming couple, we forget the world around
    us for a few weeks, even a few months. It’s quite understandable, and things go
    back to normal after a while – once the heady days of flourishing romance are
    behind us – and we reinforce those relations we’d forgotten for a bit.


    But it also happens that we decide – consciously or not – to change our life completely,
    and we don’t return to those who were always there for us year after year. We
    devote ourselves to our new love instead. It’s a form of brazen selfishness that
    can make our friends feel abandoned, even betrayed.


    ‘I no longer see her any more, ever since she got together with X.’ We have all
    heard or said that phrase, with disappointment, at one time in our life or another.


    We could learn a lot from cats about loyalty in friendship. For a cat is simply
    there, from the first day to the last, with neither games nor calculations.


    Cats can be capable of more humanity than us humans, whereas we are sometimes
    tempted to turn inward and focus on our little lives, forgetting all that has
    been given and all that has been said.


    A friendship can be as powerful as a romantic relationship, if not more so, in
    that it often lasts much longer …


    Sacrificing friendship for the rush of love, on the pretext of adhering to society’s
    codes that dictate we should all ‘settle down’ once we reach a certain age, is
    already in itself a kind of calculation, an attempt to appear to be ‘doing the
    proper thing’. It’s also the best way of ensuring that, if a break-up occurs,
    your friends will no longer be there to support you.


    **Maintain your friendships. They are one of the most precious treasures in your
    life. Never sacrifice them.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_108_0.png)


    ## YOUR CAT FOCUSES ON THE ESSENTIAL


    ‘What I like about the cat is the indifference with which it moves between luxurious
    surroundings and its native gutter’


    CHATEAUUBRIAND


    ![](img/33ca6eec857ccf5f12ca203742da1a49_109_0.png)


    I was observing how my cat Ziggy is so attentive to his personal hygiene and his
    appearance, yet will happily root about in the filthiest dumpster, when the surprising
    realisation came to me that not only does he care not a jot for luxury and material
    things, but in fact he couldn’t give two hoots about his appearance either.


    I also recall a friend’s magnificent white angora cat with green eyes who regularly
    returned from its walks as dirty as could be after rolling around in cellars,
    and would settle down on the sofa cushions to give itself a thorough clean. The
    cat loved both environments and really didn’t care about looking like a dirty
    dishcloth as it strolled down the street, returning from its escapades.


    We could all learn how to detach ourselves from our environment and from material
    things, just for a bit, and try not to give too much importance to them, as well
    as spending a lot less time looking at ourselves in the mirror. It would help
    us to find a little humility, and truth. Cats cultivate neither materialism nor
    social status; their pleasures and desires are all that count. What do others
    think? What about opinions? Cats don’t give a damn, as we have seen. What does
    a cat think when it wants something, or is poised to make a fresh discovery? Now,
    where did that big thing with a long tail go? Ah, that way! I’m going to get dirty,
    so what? Let’s go!


    **Indulge in what. Don’t give too much importance to material things, for you
    know what they say: ‘The things you own end up owning you.’**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_110_0.png)


    ## YOUR CAT’S DAY


    ### 8.30 A RELAXING EVENING


    Cushions, sofa, a delight for any cat looking to relax after a hard day. ‘What
    are they still doing at their desk, bashing away frenetically at the keyboard?’
    your cat surely wonders, before leaping up and walking over the keys, tickling
    your nose with its tail. And you grumble because you have to ‘get this finished’.
    I didn’t listen to Ziggy most of the time when he stretched out on the desk beside
    me after umpteen comings and goings between my lap and the keyboard. It was 10
    or 11 p.m. and I was getting bogged down in my writing without really making much
    progress. I now impose a rule upon myself: 9 p.m. at the latest, I step away from
    my desk. Have a pleasant evening!

