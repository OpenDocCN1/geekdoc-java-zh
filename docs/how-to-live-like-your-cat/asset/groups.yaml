    ## 你家猫的一天


    ### **8.15：洗澡时间！**


    在吃完丰的早餐后，你会看到你的猫开始长时间地舔舔自己。对你来说，也是洗澡的时间了。


    每个人都知道赶时间时洗澡是什么感觉。有时候在你走进水流之前，水还没完全变暖和。快点，快点！你赶时间呢！与此同时，你的猫正缓慢地用舌头舔着一只后爪，然后是另一只。非常从容。


    除了显而易见的卫生益处外，洗澡是你一天中可以、且**应该**照顾自己的时刻之一。这也是一个放松的时刻，是一个绝佳的机会，可以让思绪畅飞，让大脑轻轻地觉醒，面对你日程表上的安排。


    在这方面，女性往往比男性更擅长；沉浸于在浴室里长时间地呵护自己，这是男性难以理解的。但这是一种非常正宗的猫式态度，我们都应该从中学习。


    ## 你的猫天生好奇


    *‘没有不比小猫更勇敢的探险家了’*

    J U L E S C H A M P F L E RY


    ![](img/33ca6eec857ccf5f12ca203742da1a49_41_0.png)


    猫有着天生的好奇心。当它们一从篮子里跳出来，在地板上穿梭时，它们就会四处嗅嗅，闻遍每一个角落，全贯注地检查每一个物体，并探索任何未知的区域。


    与狗不同，猫不会不经思索地扑向每一个新奇事物。你的猫会谨慎地行进，眼睛从不离开过那个新纸袋或未探索的藏身处。


    猫拥有不受抑制的好奇心，这让它们不断地重新探索自己的世界。每一天都是新的发现，是这种无尽好奇心驱动的非凡小惊喜。


    我们都可以从每天学习一点点中获益，并更多地感到惊讶。


    有些人的观察力或多或少，他们的注意力或多或少集中在总是想做出新发现上。新奇感对我们的健康至关重要，它是我们大脑的氧气。我们需要它就像我们需要呼吸一样。没有它，我们会慢慢枯萎。对于那些不知道如何培养这种提升心情好奇心的人，只需坚持这个基本原则：


    **每天学一样新东西。**


    这个新事物的意义、重要性或价值无关紧要，但每天学一些东西，哪怕只是一个单词。你永远记得它。


    重要的是长期坚持这种练习，特别是如果你是一个天生不好奇的人。每天一个时刻的好奇意味着每年有 365 个新知识点，相信我，这会产生巨大的影响，不仅影响到你在智力问答中的表现，最重要的是影响你的幸福。


    **保持好奇！对万事保持好奇！这会让你的生活变得更好。让自己惊叹吧。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_42_0.png)


    ## 你的猫是独立的


    *‘一旦一只猫同意和你住在一起，你和猫在余生中都会不断决定这种安排是否可行’*

