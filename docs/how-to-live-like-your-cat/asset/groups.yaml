    knows it. As the old adage goes: ‘You’re not the best when you think you


    are, but when you know you are.’ It’s a small difference, but an important


    one. And it’s the key to self-confidence.


    As we have seen, self-confidence depends as much on the acceptance of


    who you truly are as it does on the pride you feel in what you are –


    commensurate with your talents or value system.


    For example, when your cat approaches you of its own accord, it’s


    thinking, ‘I know that you love me’, not wondering, ‘Do you still love me


    today?’ This certainty is part and parcel of its aura, its charisma, its charm


    and its beauty. It is one of the reasons why you love your cat.


    Far too many people suffer from a lack of self-confidence, while others


    overflow with it, sometimes for no apparent reason.'
- md: '

    As you may have realised, all the chapters in this book overlap with each other,
    since complete self-confidence depends on an array of abilities – which we have
    deliberately broken down into separate parts in order to explore them better –
    but they all commingle and affect each other.


    Yes, you must love yourself in order to be confident in yourself. You must be
    sufficiently independent and uncompromising, and have freed yourself from always
    wondering ‘What will others think?’


    Self-confidence is not some airy-fairy concept. It’s a set of strengths and abilities
    that your cat possesses. Learn to incorporate them one by one, and you will live
    and perform better each day.


    People who have confidence in themselves are ‘the centre of attention’, ‘free’
    and ‘charismatic’. They are often quite happy. But they have learned over time
    how to cultivate all the attributes that have enabled them to develop this self-confidence.


    Do as your cat does, and you will be you.


    **‘Have confidence in yourself!’ would be a facile phrase for this sort of book.
    But I can promise you that cultivating the various aspects that form it, as your
    cat does, will gift you joys and victories in your life, making confidence grow
    within you naturally.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_48_0.png)


    ## YOUR CAT KNOWS HOW TO DELEGATE


    *‘I gave an order to a cat, and he gave it to his tail’*

    C H I N E S E P R O V E R B


    ![](img/33ca6eec857ccf5f12ca203742da1a49_49_0.png)


    Do you tend always to be at your friends’ or family’s beck and call? Or are you
    of the opinion that everyone should wait on you and pander to your every whim?


    Don’t overdo it, but knowing how to be served like a cat can really take the strain
    out of the everyday.


    It’s a well-known fact that a cat does nothing, and spends its time being served
    by others. The cat is king or queen of all it surveys.


    You don’t have to copy this royal and dominating attitude to the letter, but neither
    should you be everyone’s gopher, always at your family’s service. Meeting every
    expectation, whim and desire of your kids or your partner doesn’t make for the
    most restful existence.


    Learn to be served like your cat, and start by delegating the little everyday
    tasks. You are not your children’s slave or skivvy, and it won’t do them any harm
    to take on a few chores – in fact it will help make them more independent. Plus
    you’ll save time, be more efficient, and less tired and stressed. Knowing how
    to delegate is key. And stop doing tasks yourself just because it’s quicker than
    getting other people to do them.


    This also holds true in the workplace. Many company directors and other managers
    are incapable of trusting others and delegating, so they spend far too much of
    their time checking and validating their employees’ efforts. This creates a culture
    where employees develop a need to be ‘mothered’ and will want every minute detail
    of their work checked and approved. The end result is wasted hours, a loss of
    autonomy for the employees, and an excess of work for the boss – which may well
    be you.


    Above all, learning to delegate means carving out time for yourself, to do what
    you like, rather than being a slave to the everyday needs of your family and friends.


    And here’s another way of seeing things: isn’t delegation proof of the trust you
    have in those closest to you, in your employees, your partner and your children?


    Perhaps it would be going too far to say that it’s for your own good that your
    cat expects you to wait on it hand and foot. Remember though:


    **Be a cat at work and at home: learn to delegate.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_50_0.png)


    ## FOOD FOR R T H O U G H T


    ‘The dog may be wonderful prose, but only the cat is poetry’

    F REN CH H P R O V ER B


    ![](img/33ca6eec857ccf5f12ca203742da1a49_51_0.png)


    ## YOUR CAT’S DAY


    ### 8.45: SOFTLY, SOFTLY IN THE MORNING


    Who really knows what a cat does with its day? What we do know is that, in the
    same way you head off to work in the morning, your cat needs to go out and roam.
    Does your cat rush out of the house at full pelt? No. Your cat shimmies delicately
    over the doorway and sticks its nose out to sniff the air – straddling the threshold
    – which both amuses and annoys you because you can’t close the door.


    Why is it that you’re in such a hurry when you leave, often having to dash back
    indoors to pick up your keys or that file you left on the kitchen table? If you
    were to be a bit more organised, there’d be no need to rush. Look at your cat,
    strolling tranquilly down the path. Running about like a headless chicken only
    ends up wasting time and getting you stressed.


    The key to wellbeing is staying calm. Remain cool and collected all day, proceed
    in a pragmatic, organised manner, and you’ll get just as much done, just as quickly,
    as you would by dashing about in a state of heightened anxiety.


    Follow your cat’s lead and start your day with a sure, steady step, and take a
    few moments to look up to the sky, catch the first rays of sun, and smile.


    ## YOUR CAT KNOWS HOW TO TAKE THE TIME TO LIVE


    *‘Of all animals, the cat alone attains to the contemplative life’*

    A N D R E W L A N G


    ![](img/33ca6eec857ccf5f12ca203742da1a49_53_0.png)


    Judging by the way cats simply lie there, or sit, staring at the world, scrutinising
    the tiniest detail, you might think they’re a bunch of lazybones who do nothing
    all day long. And you wouldn’t be wrong … at least when viewed from a human perspective.


    There is a marked difference between doing nothing and taking the time to live.
    In our current system, doing nothing and filling every minute is considered. We
    are told it is imperative to be constantly moving, that we ‘waste time’.


    Taking the time to live means becoming aware of every moment, not filling your
    schedule. For some people, even holidays have become exhausting than a week at
    work.


    Sit back, relax, and observe the world around you. Imitate your cat and you’ll
    feel a little serenity return to your life.


    **There’s an adage that goes: ‘You took a long time to be born, so take the time
    to live.’**

    **In order to do that, just copy your cat and take the time to live.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_54_0.png)


    ## YOUR CAT ADAPTS TO EVERYTHING QUICKLY


    *‘You can throw a cat however you want; it always falls on its feet’*

    P R O V E R B


    ![](img/33ca6eec857ccf5f12ca203742da1a49_55_0.png)


    Ziggy is a cat like any other, except for one thing: he lost his front paw after
    being run over by a motorbike when he was less than a year old. Back then, we
    lived in the countryside, and he had to defend his territory from other kitties,
    seduce the local lady cats, satisfy his hunting instincts, and of course clean
    properly behind his ears.


    The latter was easy: after scratching behind his right ear with his left paw,
    he would come and rub his other ear on me!


    But as for the rest, I was quite impressed to see how he behaved the same way
    on three paws as he had on four in the space of two weeks – once the bandage had
    been removed, of course.


    Not once did he find himself fazed by any obstacle, be it a wall or a fence to
    climb. Nothing had changed for him, and yet, with one paw less, everything had.

    '
  mdcn: '


    正如你可能察觉到的，书中的所有章节都是相互重叠的，因为完全的自信取决于一系列能力——为了更好地探索这些能力，我们刻意将它们分成了不同的部分——但它们都是交织并相互影响的。


    是的，你必须爱自己，才能对自己充满自信。你必须足够独立且不妥协，并让自己从总是在担心“别人会怎么想？”中解脱出来。


    自信不是什么虚无缥缈的概念。它是你的猫所拥有的一系列优势和能力。学习将它们逐一融入自身，你每天的生活和表现都会变得更好。


    自信自信的人是“焦点所在”、“自由”且“富有魅力的”。他们通常过得很快乐。但随着时间的推移，他们学会了如何培养所有让他们获得这种自信的特质。


    像你的猫那样做，你就会成为你自己。


    **“对自己要有信心！”对于这类书来说可能是一句浅显的话。但我可以向你保证，像你的猫一样培养构成这种自信的各个方面，将为你的生活带来快乐和胜利，让自信在你体内自然生长。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_48_0.png)


    ## 你的猫懂得如何授权


    *“我给猫下了命令，它却给了自己的尾巴”*

    中国谚语


    ![](img/33ca6eec857ccf5f12ca203742da1a49_49_0.png)


    你是否倾向于总是随叫朋友或家人的召唤？或者你认为每个人都应该候着你，迎合你的每一个心愿？


    不要做得过，但知道如何像猫一样被服务，真的可以减轻日常的压力。


    众所周知的事实是，猫什么都不做，花时间享受别人的服侍。猫是它所视一切的国王或王后。


    你不必逐字模仿这种尊贵且主主主地位的态度，但也不应该成为每个人的跑腿，随时为家人服务。满足孩子或伴侣的每一个期待、奇想和欲望，并不能带来最安逸的生活。


    学会像你的猫一样被服务，从授权日常琐事开始吧。你不是你孩子的奴隶或杂役，承担一些家务对他们没有任何伤害——事实上，这有助于他们变得更加独立。此外，你将节省时间，提高效率，并且少那么疲劳和压力大。学会授权是关键。不要仅仅因为自己做比让别人做快就自己承担任务。


    这在职场中同样适用。许多公司董事和其他经理无能力信任他人并授权，因此他们花了太多时间来检查和验证员工的努力。这创造了一种文化，让员工产生了被“妈妈照顾”的需求，并希望工作的每一处细节都得到检查和批准。最终结果是浪费了大量小时，员工失去了自主权，而老板（很可能就是你）却承担了过量的工作。


    最重要的是，学会授权意味着为自己留出时间去做你喜欢的事，而不是成为家人和朋友日常需求的奴隶。


    还有另一种看待问题的方式：授权难道不证明了你对亲近的人——你的员工、你的伴侣和你的孩子的信任吗？


    也许说你的猫期待你对它事膝如备是为了你好好就有些过分了。但请记住：


    **在工作和家里都要像猫一样：学会授权。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_50_0.png)


    ## 思考的食粮


    “狗可能是精彩的散文，但只有猫是诗”

    法国谚语


    ![](img/33ca6eec857ccf5f12ca203742da1a49_51_0.png)


    ## 猫咪的一天


    ### 8.45：清晨，慢慢，慢慢来


    谁真的知道猫的一天在忙什么？我们所知道的是，就像你早晨去上班一样，你的猫也需要出去游荡。你的猫会全速冲出家门吗？不。。你的猫会优雅地挪过门槛，伸出鼻子闻闻空气——跨在门槛上——这既让你觉得好笑又让你恼火，因为你关不上门。


    为什么你离开家时总是那么匆忙，经常得冲回屋子拿钥匙或遗落在厨房桌上的那份文件？如果你能更有组织性，就不用那么赶了。看看你的猫，悠闲地在小路上散步。像无头苍鸡一样乱跑只会浪费时间并让你感到压力。


    健康的关键在于保持冷静。整天保持冷静和镇定，以务实、有组织的方式进行，你就能完成同样的事情，而且速度并不比你在高度焦虑的状态下奔忙忙碌要慢。


    追随猫的引导，以稳健、坚定的脚步开始新的一天，花几分钟仰望天空，捕捉第一缕阳光，并微笑。


    ## 你的猫懂得留时间生活


    *“在所有动物中，唯有猫达到了沉思的生活”*

    安德鲁·兰格


    ![](img/33ca6eec857ccf5f12ca203742da1a49_53_0.png)


    从猫只是那样躺在那里，或者坐着凝视世界、审视最微小的细节的方式来看，你可能会认为它们是一群一整天什么都不做的懒虫。你并没有错……至少从人类的角度来看是这样。


    “无所事事”与“留时间生活”有显著的区别。在我们目前的体系中，无所事事和填满每一分钟被视为常。我们被告诉必须不断移动，否则我们就是在“浪费时间”。


    留时间生活意味着察觉每一个时刻，而不是填满你的日程。对于某些人来说，甚至假期也比工作一周更精疲力竭。


    坐下来，放松，观察你周围的世界。模仿你的猫，你将感到一丝宁静回到你的生活中。


    **有一句谚语说：“你花了很长时间才出生，所以要留时间生活。”**

    **为了这样做，只需模仿你的猫并留时间生活。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_54_0.png)


    ## 你的猫能适应一切


    *“你可以随心所扔猫，它总能用脚着地”*

    谚语


    ![](img/33ca6eec857ccf5f12ca203742da1a49_55_0.png)


