    **And if you’re the boss, a catlike attitude is very well suited to a professional
    context. Take these examples:**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_81_0.png)


    ## CAT SETS


    ![](img/33ca6eec857ccf5f12ca203742da1a49_82_0.png)


    # YOUR CAT IS TENACIOUS


    *‘Never try to outstubborn a cat’*

    R O B E R T . H E I N L I N


    ![](img/33ca6eec857ccf5f12ca203742da1a49_83_0.png)


    Stubborn, yes, tenacious even more so. Your cat is capable of staking out a mouse-hole
    for hours on end, waiting for the rodent to emerge. Patience, tenacity: you can
    watch your cat do this for a good chunk of the day without it getting bored or
    giving up. It’s about perseverance – worthy of respect – until the objective of
    catching that mouse is attained. Your cat won’t count the passing hours or the
    accumulated fatigue, whereas we all too often give up when we’re in sight of our
    goal.


    The patience your cat employs to obtain what it desires is equalled only by its
    tenacity. We can only admire it and strive to act similarly.


    ‘Never give up!’ is your cat’s credo, and it will stick to it, come what may.

