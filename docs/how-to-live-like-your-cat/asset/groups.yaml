    **Taking pleasure in sleeping won’t in any way prevent you from ‘enjoying life’,**


    **particularly in the rather inadequate way we tend to understand this phrase.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_66_0.png)


    ## YOUR CAT KNOWS WHEN TO SAY NO (AND READILY DOES SO)


    *‘I will NOT go away. I do NOT wish to go!’*

    DR. SEUSS, *THE CAT IN THE HAT*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_67_0.png)


    Cats hate being told what to do. Obey orders? Not for them!


    ‘If that’s what you want, get a dog!’ they mutter.


    Stubborn to their paw-tips, cats will seldom undertake an action purely

    because they’ve been ordered to do so.


    Do we humans like obeying orders? Of course not. And yet we put up

    with them all day long, both at work and at home. And that’s not even

    taking into account the many indirect orders conveyed by those social codes

    we ‘must’ follow to the letter.


    Learn to say ‘no’, as a cat does.


    Stop endlessly enduring other people’s needs, and following directives

    that don’t suit you, or you’ll end up living the sort of submissive life where

    you always say ‘yes’ when really you would like to say ‘no’. Whether it be

    for a small act of kindness that then turns into a regular custom you find

    you can no longer stop doing; or taking on tasks that are not part of your job

    description with such regularity that your colleagues and superiors come to

    expect it of you, with no offer of financial compensation for the extra

    workload. Enough!


    Learn to say ‘no’ occasionally to your children, your partner, your boss

    and your friends, not out of pure selfishness but to preserve your freedom of

    action and your time. If you always say ‘yes’ to everyone, how much time

    will you have left for yourself, to carry out your own tasks or to satisfy your

    own pleasures?


    Learning to say ‘no’ means knowing how to preserve your time, your

    capacity for action and your life, as well as winning the respect of your

    family, friends and colleagues, who sometimes take advantage of this

    inability to say ‘no’.


    The balance must be restored between orders and small acts of kindness.

    None of us should be permanently at the service of anyone else.


    **‘NO means no! Is that clear?’**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_68_0.png)


    ## FOOD FOR THOUGHT


    ‘Cats, as a class, have never completely got over the snootiness caused by the
    fact that in Ancient Egypt they were worshipped as gods’

    P. G. WOODHUSE


    ![](img/33ca6eec857ccf5f12ca203742da1a49_69_0.png)


    ## YOUR CAT KNOWS HOW TO AVOID CONFLICT (AS MUCH AS POSSIBLE)


    *‘There were only four dissentients, the three dogs and the cat, who was afterwards
    discovered to have voted on both sides’*

    GEORGE ORWELL, *ANIMAL FARM*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_70_0.png)


    Cats don’t like conflict, except when it comes to defending their territory, ‘courting’
    the neighbour’s puss, or giving an intruding tomcat a good hiding.


    Have you ever seen a pack of cats gather to battle another pack of cats, on the
    false pretext of territorial annexation or protection of natural resources? The
    whole thing orchestrated by two big moggies wearing general’s stripes? Never!


    The older a cat gets, the more it employs stratagems to get its enemy to flee,
    so avoiding conflict.


    Ziggy has an unbeatable trick he uses when a large tomcat enters his territory
    at night. As soon as he senses danger approaching, he hides and waits. The first
    time I heard him growling, low and loud, it was quite terrifying. Upon entering
    the garden, I spied another cat dashing away as fast as it could. Ziggy was nowhere
    to be seen. I called him, but he didn’t come.


    It was only when I went back inside that I realised his technique: he was hiding
    behind a few branches of Virginia creeper in the shadow of the outside window
    ledge, boosting his voice (honestly, he sounded like a tiger), which served to
    warn the intruder of his apparent physical size without him having to show himself.
    If the other cat remained in the vicinity, he would know what to expect in the
    coming fight. Nine times out of ten it worked. The cat fled, and Ziggy remained
    at his hidden sentry post until he was sure that the other had crossed back over
    the border of his territory. Then he came out and continued his patrol. Despite
    his three paws, Ziggy’s nighttime weapons for avoiding conflict were cunning,
    strategy and make-believe.


    Cats are not bellicose scrappers. They are proud, and will always avoid having
    to fight, as long as their territory is not under threat. It’s a precept that
    I read in Sun Tzu’s *The Art of War*. Perhaps Sun Tzu, writing over two and a
    half thousand years ago, was also inspired by a cat? *The Art of War* has become
    a key text for strategists and military leaders, although some of them have clearly
    forgotten its teachings…


    Cats have an interesting way of managing conflicts, compared with the sparring
    that humans still like to indulge in – a practice as old as it is useless.


    In a conflict, there are always two losers. Cats have long known this.


    **Insofar as possible: avoid conflicts.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_72_0.png)


    ## YOUR CAT ADORES ITS HOME, AND MARKS OUT ITS TERRITORY


    *‘Happy is the home with at least one cat’*

    ALIAN PROVERB


    ![](img/33ca6eec857ccf5f12ca203742da1a49_73_0.png)


    Cats adore their home, whatever the size. Their home is their domain, and they
    are the sole masters of it even if it’s just a one-bedroom flat, for it represents
    the very heart of their world. That said, cats are extremely attached to their
    home, even if it’s small. It is worth noting that a cat living in the countryside
    may have a territory covering ten acres, since it spends much of its time keeping
    its domain.


    Have you ever attention to the interior of your friends’ homes, their cleanliness,
    tidiness and decoration? Do they spend much time there? Or are they out most of
    the time? Are you often invited round? If you look closely, can’t you see a link
    between these people’ homes and their emotional state? There is very often a connection
    between a person’s internal happiness and the upkeep of their living space. It’s
    like a mirror effect, a direct visualisation of their state of mind.


    What about you? How do you feel at home? What are the walls and furniture like?
    Do you find it to be a comfortable and relaxing place? Do you enjoy having friends
    round for dinner? Are you proud to show off your home? Have you got a comfy sofa,
    covered in cushions and throws, for those Sundays snuggled up with a film and
    a bottle of wine? Have you created all of the conditions for your wellbeing?


    Unlike your cat, you don’t need to mark your territory (!). Your home should also
    be a sanctuary, somewhere for you to truly relax, take care of yourself, re-centre,
    and cut yourself off from the hustle and bustle outside, just for a while.


    Your cocoon should be a cosy nest you can always return to whenever you need to
    relax, take care of yourself, re-centre, and receive the people you love.

    '
