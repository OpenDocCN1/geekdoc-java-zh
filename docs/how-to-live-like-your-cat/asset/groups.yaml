    ![](img/33ca6eec857ccf5f12ca203742da1a49_84_0.png)


    YOUR CAT IS ALWAYS CAUTIOUS


    *‘The cat loves fish, but hates wet feet’*

    MEDIEVAL PROVERB


    ![](img/33ca6eec857ccf5f12ca203742da1a49_85_0.png)


    Cats are not hotheads, and they always learn from their misadventures. Your cat
    will never approach a new place, a car or an object without first observing it
    for a long time and taking infinite precautions. Cats avoid putting themselves
    in unnecessary danger. Anything new is first inspected, sniffed and analysed in
    minute detail.


    Being cautious often avoids problems, conflicts and accidents. But – no doubt
    from lack of instinct – humans have always accumulated their knowledge and experience
    through seizing the smouldering ember with both hands in order to understand that
    it burns. It’s a weird way of going about things, when you think about it. Humans
    don’t know anything unless they have learned it. Can you imagine your cat walking
    over glowing ashes?


    How many of us have fallen sick after eating spoiled food without realising it?
    And yet, how many times have you seen your cat turn up its nose and not touch
    the food bowl if the contents have dried out a bit, or refuse to eat the piece
    of ham you offer until it has sniffed it from every angle?


    There is little chance of your cat poisoning itself, for your cat uses its senses
    and is cautious, including about what it eats.


    Humans are often intrepid by nature, and therefore imprudent, just like a child
    who must be warned about everything, taught everything and protected from any
    danger. But who taught your cat that fire burns, that water drowns and that big,
    barking dogs should be given a wide berth? Who taught your cat that those large,
    noisy things rolling down the street are cars that can run you over? Cats know
    these things by instinct, they sense danger, unlike a child.


    We have lost many of our instincts, many of our senses, even in our relations
    with people. How many of us have at some point said: ‘I just knew he was going
    to do that to me. I’ve had a funny feeling about him from the start.’


    Your instinct was right. The truth about this person formed your perception of
    them, and yet, did you follow your instinct when this feeling of rejection of
    the other first came upon you? No. We often prefer reason to instinct. It’s such
    a pity when, as time goes by, we realise that our instinct never fails us, and
    that it always guides us, for the good of our wellbeing, towards caution.


    First impressions never lie. For a little more caution in the future, try to reconnect
    with your most primal instincts, listen to yourself and trust yourself. You will
    never regret it.


    **When there is a doubt, there is no doubt. Follow your instinct!**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_87_0.png)


    YOUR CAT’S DAY


    ## 6.30: HOME SWEET HOME, RETURN TO THE FOLD


    A moment of relaxation, hugs, caresses. The laundry and the voicemails can wait.
    Be like your cat and unwind after your working day. There’s no point scrambling
    to do the outstanding household chores. Slip into something more comfortable and
    take half an hour to sit down in peace, maybe putting some music on.


    Breathe a while before joyfully starting the second part of your day, the part
    that’s all about you, your whims and desires, perhaps phone a few friends …


    At this time of day, your cat’s only concern is most probably: ‘Shouldn’t my dinner
    be ready soon?’ It’s a moment of great personal pleasure, since your cat knows
    that you will shortly take the time – unlike this morning – to open a pouch of
    salmon in jelly, the sort your cat loves so much.


    Six thirty in the evening is a little moment of relaxation, both for your cat
    and for you, a point where the day shifts from activity to relaxation. The best
    thing is not to carry your day’s fatigue or stress into your little world of comfort
    for the evening.


    YOUR CAT HAS A HUGE NEED FOR LOVE


    *‘Cats are beings made to accumulate caresses’*

    STEPHANE MALLARMÉ


    ![](img/33ca6eec857ccf5f12ca203742da1a49_89_0.png)


    We all need hugs, kisses, caresses and other gestures of affection. And though
    many of us sometimes find ourselves with a deficiency of love, cats never hesitate
    to come and demand some tenderness from you when they require it.


    Your cat sometimes needs to feel this emotional closeness with you, in the same
    way that we sometimes need to bury ourselves in a deep embrace with our partner
    and hold them tight.


    Freud describes the first trauma in our life as being when the umbilical cord,
    that physical link to our mother and to her love, is severed at birth. Forever
    after, we try to re-establish that emotional link through all our relationships
    with others, be it love or friendship.


    The more we suffer a lack of affection, the more we will seek it from others,
    drawing on it until we’re full, overflowing. Just like the cat, we withdraw physically
    from this source once we’re satiated with love … before returning to it again.


    The frequency of our need for love also depends upon the love we have for ourselves.
    Some people are very cuddly, others not so much, for we don’t all require the
    same ‘dose’ each day. But all of us need tenderness, hugs and emotional warmth
    to a certain extent.


    We draw it from our partner and also from our cat, just like the cat draws it
    from us – think of all those times when your cat buries its head lovingly under
    your arm. That’s its way of drawing some love from you. See how it practically
    drools with need for this tenderness. It’s quite different from an everyday cuddle
    of simple wellbeing. And once that need for love and affection is assuaged, your
    cat will slip off your lap and go about its business.


    We are just the same: needing, expecting, waiting for this vital love that each
    of us requires.


    Just like the cat, or like a flower, we wilt a little more each day when deprived
    of love. It is for that reason that the human heart has never been able to do
    without this driving force called love.


    **We all need love. But you need to know how to give it in order to receive it.
    It’s a key condition for our happiness. What would life be like without love?**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_90_0.png)


    YOUR CAT IS SERENE BY NATURE


    *‘The smallest feline is a own’*

    LEONARDO DA VINCI


    ![](img/33ca6eec857ccf5f12ca203742da1a49_91_0.png)


    Moving, constantly moving, bustling about is what many of us do, as if we were
    incapable of staying still for a single moment, so caught up are we in the incessant
    rhythm of big-city living, which we carry home.


    You’ve barely got back from work, you chuck your coat onto the sofa and you flit
    from dirty laundry to outstanding bills, a broom in one hand and a duster in the
    other.


    Your cat watches you rushing between the kitchen, the lounge and the study. You
    wonder why it is looking at you so strangely. Yes, it’s clear that you’re disturbing
    your cat, but also that it is trying to figure out you’ve had a sudden attack
    of idiocy.


    Pick up the remote control for your DVD player and press ‘Pause’. This is not
    just a figure of speech; do it for real. Take a long breath in, then breathe out
    slowly. You will feel a deep, inner peace, as if you had just placed your baggage
    on the ground. A smile will light up your face, and, through this action and your
    cat’s gaze – which hasn’t left you for a second – you will become aware of having
    switched from the frenzy of a working day into the useless frenzy of another sort
    of working day, made of hyperactivity and nerves.


    Of course household chores need to be done, but there is no reason not to approach
    them in a calmer, stress-free manner.


    If, however, you continue bustling about, you will see your cat calmly stand up
    and pad away to find a calmer place to settle down and clean itself, and maybe
    doze. You might even fancy you see your cat shake its head while saying to itself:
    ‘Incorrigible human! Hardly home, and already it’s stress-central here. I’m off
    to hunker down in that pile of clean sweaters in the bedroom. Should be nice and
    tranquil there for a little while, at least.’


    And, throwing a final meow in your direction before steering a path for those
    soft, sweet-smelling clothes that you’ll only have to clean again later, you might
    comprehend something like: ‘Hey, while you’re at it, don’t forget to fill my bowl
    with kibble and change my litter, it fair stinks in there!’


    **Stop bustling about all over the place: it’s such a waste of energy. Learn to
    be serene.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_92_0.png)

