    我们所做的，或对环境的任何改变，但很少有猫会对它们做出评论。

    我们总是对一切都表达自我的倾向（作为一个话痨，我非常清楚有时我们真的说了很多）掩盖了我们健康的一个重要元素：学会保持沉默。


    而且作为一个话痨，我太清楚了有时我们真的说了很多废话。有些时候我们做得过头了，或者心情不好，我们说的话就会被误解。那并不是我们的本意，但为时已晚，话已经说出口了。


    学会保持沉默意味着控制冲动，避免说废话，并在表达想法之前进行反思。它意味着倾听他人的见解，而不是垄断对话，并且不再自己的意见视为最终定论。


    学会保持沉默意味着保持适当距离，并在生活中保持一点秘密性。要真诚，但不要对所有人都完全透明，以此保护你自己免受背后说闲人的伤害。


    表达自我并不等同于过度表现，虽然讨论至关重要，但观察有时比任何辩论都有说服力。


    **学会保持沉默。学会不再通过话语成为一切的中心。倾听以学习，并并在何时保持沉默，这样当你说话时更有影响力。**


    ![](img/33ca6eec857ccf5f12ca20372da1a49_104.png)


    ## 思考的食物


    “如果鱼是水的具化形态，那么猫就是空气的微妙模式”


    ![](img/33ca6eec857ccf5f12ca20372da1a49_105.png)


    ## 你的猫是一个真诚的朋友


    “它永远不会忘记

    *你持久的关怀*

    *痛苦的领域将无法抹除

    *你曾给予的舒适*

    ——老猫的独白”


    ![](img/33ca6eec857ccf5f12ca20372da1a49_106.png)


    如果你的猫接受了你的世界，它将成为你忠实坚定的朋友。因此，你的猫每天都会照顾你。它会在你身边轻声喵喵叫，看看你过得如何，倾听你的抱怨，并知道如何安慰你。你的猫时刻都会在你身边。


    但我们人类是否也像它们那样时刻关注我们的朋友呢？诚实地说，我们难道偶尔会让某些关系变得疏远吗，尽管它们花了很久才建立？


    我们都应该学习猫的榜样，接受它们向我们展示的忠诚、无和友谊，并字面上将其应用。


    生活的变迁和变化意味着我们经常会自愿或无意地与最亲近的人分开。


    新恋关系的情况我们都很熟悉。沉浸在新关系的激情中，我们会忘记周围的世界几周，甚至几个月。这是完全可以理解的，当那狂热的日子过去后，一切都会恢复正常——我们会强化那些被忽略了一段时间的关系。


    但也经常发生，我们决定（无论是有意无意）彻底改变生活，不再回到那些多年一直守护我们的人身边。我们全心投入到新的爱情中。这是一种无耻的自私，会让朋友感到被遗弃，甚至被背叛。


    “自从她和他在一起后，我就再也没见过她。”我们在生活的某个时刻都失望地听过或说过这句话。


    我们可以从猫身上学到很多关于友谊的忠诚，因为猫从第一天到最后一天都在那里，既没有心机，也没有计算。


    猫比我们人类更有人性，而我们有时会被诱导转向内在，关注自己的小生活，忘记了所给予和所说的一切。


    友谊可以像浪漫关系一样强大，甚至更强，因为它通常持续得得多……


    为了爱情的冲动而牺牲友谊，以此遵循我们达到一定年龄就应该“安定下来”的社会准则，这本身就是一种计算，一种试图看起来在“做正确的事”。这也是最好的方法，以确保如果发生分手，你的朋友将不再留在那里支持你。


    **维护你的友谊。它们是你生命中最宝贵的珍藏之一。永远不要牺牲它们。**


    ![](img/33ca6eec857ccf5f12ca20372da1a49_108.png)


    ## 你的猫关注本质


    “我喜欢猫的一点在于，它在豪华的环境和它出生的水沟之间移动时的那种无所谓的态度”


    ![](img/33ca6eec857ccf5f12ca20372da1a49_109.png)


    我正观察我的猫 Ziggy 如何对自己的个人卫生和外表如此在意，却又乐意在最脏的垃圾桶里翻找，这时一个令我惊讶的发现出现在脑海：它不仅一点不在乎奢侈和物质物品，事实上它也根本不在乎自己的外表。


    我还记得朋友的一只绿眼睛的华丽白色安哥拉猫，它经常在下地下室里打滚后，散步回来时脏得不能了，然后坐在沙发垫上彻底清理自己。这只猫喜欢这两种环境，当它从冒险归来走在街上时，真的不在乎看起来像一条脏抹布。


    我们都可以学习如何从自己的环境和物质物品中抽离出来，哪怕一会儿，并尝试不要给它们太多的重视，同时也减少在镜子前看自己的时间。这会帮助我们找到一点谦卑和真理。猫既不培养物质主义，也不追求社会地位；它们的快乐和欲望才是最重要的。别人怎么想？意见又如何？猫根本不在乎。

