  mdcn: '


    **家最温馨！经营好你那小金宫殿的舒适度与美感，你会感觉好得多。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_75_0.png)


    # 猫咪的一天


    ## 1.15: 强制性午睡


    虽然你的猫肯定会花下午的一半时间在睡觉，但你通常无法做到这一点。


    然而，在午餐和ر次放松的散步之后，在回到办公桌之前，你肯定会有十五分钟，甚至三十分钟的休息。


    为什么不尝试一次十五分钟的微午睡呢？你会感到精力充沛，仿佛你睡了几个小时一样。


    越来越多的公司正在引入这种做法，以提高员工的效率。猫的午睡已经变成了一种商业工具！


    最重要的是，它是从睡眠不足中恢复的手段，用来增强能量，或者为了和朋友出去狂欢做准备。


    ## 你的猫信任你


    *“成为一只愚蠢地崇拜你的狗狗的主人，并不是什么赞美，但被选为哲学家猫的朋友和知己，却是一份非常独特的荣誉。”*

    H . P. L O V E C R A F T, 《猫与狗》


    ![](img/33ca6eec857ccf5f12ca203742da1a49_77_0.png)


    一旦猫咪选择了你作为生活伴侣，它们将完全、绝对、近乎盲目地信任你。例如，当你抚摸你的猫时，它可能会翻身仰在背上，这是一个猫自然情况下不会让自己处于的位置（除非它们处于一个感到完全安全的地方），因为这个位置太脆弱，它们会觉得很难逃跑或自卫。然而，通过一次又一次的抚摸，在许多亲吻和其他亲昵的姿势之后，你将赢得猫的信任，它会坐在你的膝上或你身旁，以最意想不到的姿势等待你再次抚摸、玩耍以及让它挠肚子。


    这种深层次的信任可以通过各种方式表现，但某些行为是它的明确指示。


    我们对他人有多大的信任？


    在爱情或友谊遭遇失望后，我们往往发现很难再次信任。尽管我们相信对方，但我们总是保持警惕，关注任何被我们解读（通常是错误的）为即将到来的失误的细微迹，或是一个在等待中的小谎言。


    这种怀疑的态度会对我们的生活产生极大的负面影响。如果你时刻生活在担心随时被他人背叛中，你怎么可能快乐呢？这是不可能的。


    重新找到宁静和爱情热情的其他方法，就是重新学会信任，盲目地，几乎像猫那样。


    但是，像你的猫一样，你不应该把信任放在任何人身上，也不要立即对你的情感和生活敞开大门。


    对于你遇到的人，遵循你的直觉；它永远不会让你失望。当你感到自己遇到了正确的人时，无论是友谊还是爱情，不要因为保持恐惧和不信任的姿态而将自己隔绝在外。


    打开内心的闸门，放开自我，去信任。如果你想充分享受这次幸福的机会，就没有其他选择或可能的路径了。


    **驯服你的恐惧。带着眼光去爱和信任。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_78_0.png)


    # 你的猫是天生的老板


    *“猫不在，鼠乱欢”*

    谚语 P R O V E R B


    ![](img/33ca6eec857ccf5f12ca203742da1a49_79_0.png)


    猫是出色的经理、完美的老板，因为它们在观察一切的同时，并不真的做任何事情。它们不需要大吼：一个眼神就足以赢得尊重。猫仅仅在那里，它的存在本身就足以威慑老鼠。


    当我写这本书时，Ziggy 伸展在我的纸堆上，紧紧地盯着我，确保我专注于眼下的任务而不做白日。无疑，很大程度上归功于它，手稿才准时交付。


    正如我们已经看到的，在工作中像猫意味着学会授权，这是主要的一。无论是为了公司任务的合理组织，还是为了同事的认可和自主性。但也意味着知道如何存在，如何关注全局，眼观而不形，并树立榜样。


    无论你是否是老板，猫式的态度都非常适合职业背景。参考这些例子：


    - 不要浪费不必要的精力。根据任务的重要性，配额你的工作和完成工作的时间。（猫说：“谁在乎那只蜘蛛？在老鼠来之前我不会动的。”）

    - 不要为了表现出忙得不可交而东忙西乱。这只会给你的同事带来无用的压力。（猫说：“停止拿着你的吸尘器乱晃了，你弄得我头晕！”）

    - 需要时保持高效。立即处理问题。（猫说：“你觉得你在干什么，你这个笨蛋？别动，我会搞定你的。”）

    - 始终保持警觉而不被察觉，以跟进公司发生的最新消息。（猫说：“我知道是你用羽毛挠我。再靠过来一点，你就知道了。”）

    - 需要时做出反应。知道如何付出那份努力。（猫说：“花园里有地鼠入侵了？行吧，我会加班！我们很快就会解决它们的。”）

    - 定期和同事一起喝咖啡，了解办公室八卦并维持你的社交关系。（猫说：“猫粮盆还是满的。我们很快就会解决它们的。”）

    - 不要假装忙不可交。（猫说：“猫粮盆还是满的。我们很快就会解决它们的。”）

    - 不要假装在工作。（猫说：“猫粮盆还是满的。我们很快就会解决它们的。”）


    **而如果你是老板，猫式的态度非常适合职业背景。参考这些例子：**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_81_0.png)


    ## 猫


