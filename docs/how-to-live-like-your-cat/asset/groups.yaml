    ## YOUR CAT ALWAYS REMAINS NATURAL


    *‘A cat may go to a monastery, but she remains a cat’*


    ETHIOPIAN PROVERB


    ![](img/33ca6eec857ccf5f12ca203742da1a49_112_0.png)


    No false seduction, role-play or borrowed style: your cat never puts on a costume
    or assumes a particular attitude when approaching you. Whatever it desires or
    requests, your cat will always do it in line with its personality.


    Your cat is honest, as we have seen, because it’s much simpler that way.


    So why would your cat put on an act in order to be taken for something it is not?
    What good would it do them?


    And what good does it do us when we do it – often out of lack of confidence? Nothing.
    We are lying to ourselves again, and we are lying to others. And the worst is
    that we are convinced that this disguise we’ve just put on, to deal with a particular
    situation or certain individuals, will be more credible than what we are deep
    down inside. What stupidity!


    How can a cardboard-cutout film set replace the majesty of a real mountain or
    a raging ocean?


    When we lie – out of fear of not measuring up – we make ourselves vulnerable to
    being seen through, devoid of either charm or charisma.


    There is nothing plasticky about our natural state. It radiates everything that
    we are. It makes us beautiful, attractive and credible in other people’s eyes.


    Being natural is the pledge of what we are, with no sham or subterfuge. Knowing
    how to remain natural in every situation and accepting who we are remains the
    best way not only to be appreciated but to really impress people. Never underestimate
    yourself.


    **Remain natural in all circumstances.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_113_0.png)


    ## YOUR CAT IS HUMBLE AND INDULGENT


    *‘A cat is not bound to live by the laws of a lion’s nature’*


    SPINOZA


    ![](img/33ca6eec857ccf5f12ca203742da1a49_114_0.png)


    We all have a tendency to sometimes set the bar a little high, to be hard on ourselves
    and even beat ourselves up about things.


    Be ambitious, sure; give the best of yourself, of course; but it’s equally important
    to know how to be kind to yourself in the event of a setback. It’s important to
    be honest and to give your utmost to any job or project, but nobody can expect
    you to excel at everything, all of the time, to the point of making yourself ill.


    What does this all have to do with what you can learn from cat? It’s all summed
    up in the quote from Spinoza on the previous page. Your cat may be feline, like
    the lion, but your cat doesn’t exhaust itself all long trying to be as strong
    and fast as lion. Your cat is not and never will be the king of the jungle. Perhaps
    it isn’t even the boss among the other cats. But so what? Does that prevent your
    cat from living its life to the full and being happy? Does it spend its time wanting
    to attain position or acquire a status it knows will never reach? Does it hold
    itself to blame for things it cannot control?


    Neither a little humility nor a little acceptance of yourself will prevent you
    from being proud of what you are and what you do. Should you stop singing because
    you’re not Mercury? Should you stop painting because you’re not Cézanne? Does
    a lack of those talents make you a less valuable human being? Or just different?


    Do the best with what you are and continue to progress, for even if your cat knows
    it will never be lion, won’t prevent it leaping, hunting and being the king of
    your sofa if it can’t be king of jungle.


    **Be humble in what you do. Be kind to yourself. But whatever you do – Do!**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_115_0.png)


    ## CAT SECRETS


    ![](img/1png)


    *Some of you like sleeping with us, but often, at bedtime, we find ourselves on
    the other side of the bedroom door. It’s true that when we’re young, we move around
    a bit, and since we don’t sleep a lot at night, we feel like playing in the bed.
    But, you know, we calm down after a few years, so open the door to us and we’ll
    doze peacefully at your feet. For if we come to your bed, it’s not just for warm
    cushions and quilt, it’s also to protect you. Who else keeps watch at night to
    stop evil spirits entering your home and disturbing you while you sleep? This
    is also our mission. We sleep with you so we can protect you better. Believe me
    or not, but even if you reckon thats all a bit mystical, think about it.*


    ZIGGY


    ## YOUR CAT KNOWS HOW TO SEE THE FUN IN EVERYTHING


    *‘When I play with my cat, who knows whether it has more fun with me than I do
    with it?’*


    MICHEL DEMTAGNE


    ![](img/117_117_0.png)


    We sometimes wonder if life is serious when we learn the hard way. So it’s important
    to know how to have fun, in order to mitigate its sometimes darker aspects or
    simply to choose to approach a situation from another angle (glass half full or
    half empty?).


    Knowing how to have fun is a key condition for happiness. Overly serious people,
    forever stuck in their fanciful thoughts, sometimes end up incapable of knowing
    how to play, have fun and laugh; they are virtually incapable of smiling.


    Play is one of your cat’s main occupations, and hunting is a part of that, as
    cruel as this can seem when you see it tossing a maimed field mouse about for
    hours, letting the poor thing escape for a few inches before pouncing on it again.
    But it’s your cat’s way of amusing itself, just as we humans have invented myriad
    ways of laughing and having fun.


    Know how to laugh (and above all how to laugh about everything), know how to not
    take yourself too seriously, know how to put your social standing to one side
    – just think of those times when you hear people say something like ‘I’m sure
    you understand that I couldn’t allow myself to do that, it would undermine my
    position.’


    Self-image, cultivated pretences … We must forget everything, all of those human
    traits that prevent us from having fun and laughing.


    **Laugh! At everything! At yourself! All the time!**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_118_0.png)


    ## YOUR CAT IS BEAUTIFUL … AND KNOWS IT


    *‘Cats never strike a pose that isn’t photogenic’*


    LILIAN JACKSON BROWN


    ![](img/33ca6eec857ccf5f12ca203742da1a49_119_0.png)


    All cats are beautiful, which is really quite surprising. It is very rare to come
    across an ugly cat, except if they are never cared for or are old and sick. By
    definition, a cat is beautiful from birth to death, and suffers little ravages
    of time. Do cats get wrinkled? Do cats lose hair? Are we really ‘superior’ in
    that regard?


    That cats are beautiful isn’t at all important in itself. But this confident attitude
    they have all the time is perhaps conditioned by this fact: cat is beautiful and
    is maybe conscious of it.


