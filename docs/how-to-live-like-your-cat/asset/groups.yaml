    # YOU R C AT’S DAY


    ## 1.15: OBLIGATORY SIESTA


    Although your cat will surely spend half the afternoon sleeping, you usually won’t
    be able to do the same.


    However, following lunch and a relaxing stroll, you will surely still have a quarter
    of an hour, maybe even thirty minutes, left before returning to your desk.


    Why not try a fifteen-minute micro-siesta? You will feel re-energised as if you
    had slept for several hours.


    More and more companies are introducing this practice in order to make their staff
    more efficient. The cat’s siesta has become a business tool!


    Above all, it’s a means of recovering from a lack of sleep, to boost your energy
    or in anticipation of a big night out with your friends.


    ## YOUR CAT TRUSTS YOU


    *‘It is no compliment to be the stupidly idolised master of a dog whose instinct
    it is to idolise, but it is a very distinct tribute to be chosen as the friend
    and confidant of a philosophic cat’*

    H . P. L O V E C R A F T, ‘C A T A N D D O G S’


    ![](img/33ca6eec857ccf5f12ca203742da1a49_77_0.png)


    Once a cat has chosen you as a life companion, they will trust you fully, absolutely,
    almost blindly. For example, when you stroke your cat, it may roll over on its
    back, a position that cats will never naturally put themselves in (except when
    they are somewhere they feel entirely safe), because it is much too vulnerable
    a position and they would find it too difficult to flee or defend themselves.
    And yet, caress by caress, and after many kisses and other gestures of affection,
    you will win your cat’s trust and it will sit on your lap or alongside you, in
    the most improbable positions, to be stroked again and again, to play and to have
    its belly scratched.


    This deep trust can be displayed in various ways, but certain behaviours are clear
    indicators of it.


    How much do we trust other people?


    It often happens that we find it hard to trust again, following disappointment
    in love or friendship. As much as we believe the other person, we always remain
    vigilant, attentive to the slightest sign of something we interpret (often wrongly)
    as a false step to come, or a little lie in waiting.


    Such a suspicious attitude can do us a real disservice in our lives. How can you
    be happy if you’re constantly living in fear of being betrayed by someone else
    at any moment? It’s impossible.


    There is no other way of finding tranquillity and zest for love again than by
    relearning to trust, blindly, almost as cats do.


    But, like your cat, you shouldn’t place your trust in just anyone, nor immediately
    open wide the door to your feelings and to your life.


    Follow your instinct with the people you meet; it will never let you down. And
    as soon as you feel you have met the right person, be it in friendship or in love,
    don’t shut yourself off from happiness by remaining in a stance of fear and distrust.


    Open the sluice gates of your heart, let yourself go, and trust. There won’t be
    any other choice or possible path to take, if you want to live this chance at
    happiness to the full.


    **Tame your fears. Love and trust with discernment.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_78_0.png)


    # YOUR CAT IS A NATURAL BOSS


    *‘When the cat’s away, the mice will play’*

    P R O V E R B


    ![](img/33ca6eec857ccf5f12ca203742da1a49_79_0.png)


    Cats are excellent managers, perfect bosses, for they keep an eye on things without
    really doing anything. They don’t need to yell: a look is enough to garner respect.
    A cat simply is, and its presence alone is sufficient to intimidate the mice.


    While I was writing this book, Ziggy lay stretched out on my pile of papers, keeping
    a close eye on me to ensure I remained focused on the task at hand and didn’t
    daydream. It was no doubt largely thanks to him that the manuscript was delivered
    on time.


    As we have already seen, being a cat at work means knowing how to delegate, that’s
    the main thing. Be it for the proper organisation of the tasks and the firm, or
    for your colleagues’ validation and autonomy. But it also means knowing how to
    be present, to keep an eye on things, see without being seen, and set an example.


    Whether or not you are the boss, a catlike attitude is very well suited to a professional
    context. Take these examples:


    - Don’t expend your energies unnecessarily. Ration your work and the time allocated
    to complete it, according to the task’s importance. (Cat says: ‘Who cares about
    that spider? I’m not moving until a mouse comes along.’)

    - Don’t bustle about just to give the impression of being snowed under. It only
    creates useless stress for your colleagues. (Cat says: ‘Stop flailing about with
    your vacuum cleaner, you’re making my head spin!’)

    - Be efficient when necessary. Deal with problems immediately. (Cat says: ‘What
    do you think you’re doing, you lumbering fool? Don’t move, I’ll sort you out!’)

    - Always be watchful without being noticed, in order to stay abreast of the latest
    news about what’s happening in the company. (Cat says: ‘I know it’s you who’s
    tickling me with a feather. Come a little closer, then you will know!’)

    - Be responsive if required. Know how to make that special effort. (Cat says:
    ‘A mole invasion in the garden? Fine, I’ll work a double-shift! We’ll soon get
    them shifted!’)

    - Regularly take a coffee break with colleagues to catch up on the office gossip
    and maintain your social relations. (Cat says: ‘The kibble distributor is still
    full. We’ll soon get them shifted!’)

    - Don’t pretend to be overwhelmed. (Cat says: ‘The kibble distributor is still
    full. We’ll soon get them shifted!’)

    - Don’t pretend to work. (Cat says: ‘The kibble distributor is still full. We’ll
    soon get them shifted!’)


    **And if you’re the boss, a catlike attitude is very well suited to a professional
    context. Take these examples:**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_81_0.png)


