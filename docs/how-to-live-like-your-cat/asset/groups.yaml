    *through’*


    J U L E S V E R N E


    ![](img/33ca6eec857ccf5f12ca203742da1a49_60_0.png)


    ‘Leave me be! Silence! Calm! Fresh air!’ We all dream of saying such


    things sometimes.


    We find ourselves constantly caught up in a whirlwind of noise that


    wears at our nerves: car horns, slamming train doors, mobile ringtones, and


    beeping notifications for appointments, text messages and emails.


    Your cat loves calm, adores it, seeks it. External calm nourishes their


    inner calm. Why don’t we do the same?


    Why not try to take a few moments each day to bathe in absolute calm


    and silence. Listen only to yourself, your inner voice, your heart beating …


    Expand your inner peace in this way, cultivate and nourish it each day to


    find your exterior calm again. Quite simply: live better.


    Do as your cat does, and seek a little calm whenever an opportunity


    presents itself. And if the environment doesn’t lend itself to it, quietly go


    and find a place to be alone, somewhere only you know. Don’t return until


    you have assuaged your need for calm, and have topped up your energy


    reserves.'
