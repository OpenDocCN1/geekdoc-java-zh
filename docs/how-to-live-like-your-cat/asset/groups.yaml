    你猫的一天


    ## 11.00: 在梦境之地


    这是漫长的一天，疲惫不堪，是时候去数数……了。什么比厚实柔软的被子更能缓解你的心理或身体酸痛呢？


    但这时，你的猫……来到你身边，或者睡在你的身上。


    正如我们在“猫的秘密”中所看到的，猫咪并不是无缘无故过来依偎或睡在你肚子上的。


    你听过“呼噜声疗法”吗？关于猫咪治愈能力的研究经常出新。


    为什么不利用它们来到你身边睡觉的这一点呢？毕竟，猫咪什么都不想。


    在你和猫一起睡着后，你常会在早上醒来时发现它在离远一点的地方，就在脚边。


    最后，即使我们可以从猫身上学到很多，但可以说，在这一点上，猫与人类（无论男性还是女性）是相似的，正如这条黎巴嫩谚言所说：“猫的梦充满了……”


    晚安。


    ## 你的猫在任何情况下都从容自若


    “一位先生有一只可爱的猫，他教猫坐在餐桌旁，表现得非常好。他习惯把任何残渣都放在猫的盘子里。一天，猫没有准时出现，而是带着两只老鼠出现了，它把一只放在主人的盘子里，另一只放在它自己的……”


    《贝特里克斯·波特日记》


    ![](img/33caeec857ccf5f12ca03742da1a49_122_png)


    可以说，在我们的一生中，有些处境会让我们感到不从容，尽管随着时间的推移，我们的自信会增长，让我们更轻松地克服这些困境。


    感到不从容通常意味着觉得自己达不到某种标准。但我们达不到的标准是谁？当然是他人，还有我们对自己的认知。


    你见过你的猫感到不从容吗？从未。这是一种如此人类的感觉，以至于人们不会将其归因于猫。


    不，你的猫永远不会感到我们所说的那种不从容，正如我们在书中处处看到的，猫并没有需要保护的形象：猫仅仅是。因此，猫的行为是透明的，任何关于它性格或能力的微小谎言都无法动摇它的自信或自尊。


    这种偶尔的不安感完全归于我们自己人为构建的东西。我们是否面临着被“揭穿”的风险？是否达不到我们所讲述的故事、声称的事，以及构成了他人对我们形象的一切？


    当我们发现自己处于所言之词与实际行为或本质之间的挣扎中时，我们会感到不从容。谎言越大，它们与事实之间的差距就越大，不安感也越强烈。这让你了解了妄言症在最终能够看穿他们自己时所处的心理状态。


    当我们觉得自己达不到标准时，也会感到不从容。这更多是一个自信的问题，但正如我们看到的，当这种感觉并非天生时，自我肯定和信念是可以培养的。而你的猫就在那里引导并帮助你完成这个学习过程。


    要在任何情况下都从容自若，你必须对自己和他人诚实，不要在你传达给他们的形象上投入太多，因为只有当你遵循猫的方式时，那个形象才可能是积极的。


    **总是从容自若吗？并不容易！但这是一场猫会为自豪的胜利。**


    ![](img/33caeec857ccf5f12ca03742da1a49_123_0.png)


    ## 猫展现了共情


    “当你相信世界上没有爱时，看着你膝上猫的眼睛。”

    ——古威尔士谚语


    ![](img/33caeec857ccf5f12ca03742da1a49_124_png)


    养猫的人都知道这一点：它们永远不会拒绝倾听。我们具备这种利他主义吗？具备这种倾听的能力吗？具备像猫看着我们时那种对他人的共情能力吗？


    必须说，在共情方面，我们完全处于它们的阴影之下。即使带着世界上最大的意愿，我们有时也发现很难诚恳地听他人的问题，很难身处处地，因为我们被自己的问题所淹没了。


    猫拥有这种天生的力量，对我们的仁慈，即使在我们不和它们交谈时也能感知到我们的不安，它们对我们采取保护和安抚的态度。


    但在心理治疗师可能提供的静静倾听之外，猫似乎理解我们的问题，通过它们的眼神反复说：“这一切终将过去”，同时填补了我们的情感空虚。


    如果我们能克服自我中心，伸出手并比现在多地向他人倾听，我们就能从猫身上学到关于共情和倾听的知识。


    当我们真正倾听他人时，我们给予的多比接受的多多，有时我们并没有意识到：**学习如何被倾听，以及学习如何去给予。**


    ![](img/33caeec857ccf5f12ca03742da1a49_125_0.png)


    ##思考的食物


    “猫有九条命。它玩耍，它流浪，它留守。”

    ——谚语


    ![](img/33caeec857ccf5f12ca03742da1a49_126_0.png)


    ## 像猫一样生活


    大多数养猫的人羡慕它们运作的方式以及它们对幸福的追求；而我们经常梦想着将猫的行为和哲学应用到日常生活中。


    能够采取它们的方法，只培养那些能带给我们宁静、健康、快乐的品质，并知道如何摆脱我们身上的负担，而不是让自己陷入更多困惑中：这听起来像个梦。


    但对我们所有人来说，这是一个触手可及的梦，只要我们花时间接受猫的一些行为——关乎自尊、与他人的关系，以及区分本质与琐碎的能力。


    猫拥有如何充分生活的与生知识，而我们在这一方面还有很多要学习的。但在哲学著作中找不到这些课程；猫通过它们仅仅存在的方式，直白地教会了我们这些。


    每天从你的猫身上获得启发。

