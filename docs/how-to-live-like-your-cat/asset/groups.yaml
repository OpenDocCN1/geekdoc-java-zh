    *“猫不会摆出不上片的姿势”*


    莉莉安·杰克斯·布朗


    ![](img/33ca6eec857ccf5f12ca203742da1a49_119_0.png)


    所有的猫都是美丽的，这真的非常令人惊讶。丑猫非常罕见，除非它们从未得到照顾，或者老了、病了。根据定义，猫从出生到死亡都是美丽的，很少受时间的侵蚀。猫会长皱纹吗？猫会掉毛吗？我们在这方面真的更“优越”吗？


    猫是美丽的这件事本身并不重要。但它们一直保持的自信态度也许是由这一事实决定的：猫是美丽的，也许意识意识这一点。


