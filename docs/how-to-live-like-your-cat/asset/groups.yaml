    FOOD FOR THOUGHT


    ‘Cats are mysterious folk. There is more passing in their minds than we are aware
    of’


    SIR WALTER SCOTT


    ![](img/33ca6eec857ccf5f12ca203742da1a49_93_0.png)


    ## YOUR CAT KNOWS WHAT IT WANTS, AND IS DIRECT ABOUT IT


    *‘There are many intelligent beings in the universe. Most of them are owned by
    cats’*


    OLD POLISH PROVERB


    ![](img/33ca6eec857ccf5f12ca203742da1a49_94_0.png)


    Cats don’t beat about the bush when they want something from you; they

    will pester you until they get what they want. Cats are demanding, and you

    can’t dupe them with a new brand of kibble if they’re not crazy about it. At

    best, your cat will- sulk, or knock over the bowl, and you’ll be forced to put

    the new pack away in the cupboard and go out and buy the usual brand.


    Your cat knows what it wants and will stick to its guns.


    By the same token, you will never be able to force your cat to come in at

    night if it’s strolling about or happily ensconced in a flowerbed two feet

    away from you.


    Cats are excellent hunters, and when they are pursuing their prey nothing

    can distract them from their objective. This stubborn obstinacy is the cat’s

    great quality. Cats always know what they want. There’s no point even

    trying to negotiate.


    How often should we ourselves have to make compromises according to

    some external factor?


    There’s a saying that goes: ‘I don’t really know what I want, but at least I

    know what I don’t want.’ I only half-like this saying, which often serves to

    cover up true desires which we sweep under the carpet, not believing

    ourselves capable of attaining them.


    ‘What do you really want?’ is a question that we should all ask ourselves

    regularly and with the utmost honesty. All too often we end up settling for

    what our friends and family ‘want’ or ‘expect’ of us, rather than what we

    ‘believe’ we are made for. We forget the motivations and desires that truly

    drive us.


    ‘What do you really want?’ Cats know exactly what they want, and spend

    their whole life focused on that alone.


    Knowing what you want is one thing. The second step is to give yourself

    the means to achieve it, to be demanding and direct in your aspirations.

    Don’t beat about the bush.


    This mania we all have, to a greater or lesser extent, of avoiding saying

    exactly what we wish to say or clearly asking for what we want, is

    exhausting in more ways than one.


    Be straightforward. Don’t be scared to call a spade a spade, to tackle

    subjects directly, to tell the truth as it appears, and to state explicitly what

    you desire. Be direct, and you’ll save both time and energy.


    Finally, although cats know what they want, they do more than merely

    demand it through their attitude or behaviour (at least we humans are

    fortunate to have the power of speech): they act.


    **Be direct, ask. ‘I want, I can, I do!’ should become as natural for you as proud
    whiskers are for a cat.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_96_0.png)


    ## YOUR CAT DARES TO ASK (ALL THE TIME)


    *‘In a cat’s eye, all things belong to cats’*


    PROVERB


    ![](img/33ca6eec857ccf5f12ca203742da1a49_97_0.png)


    As we have seen in the previous chapter, once we have clearly identified,

    formulated and expressed our desires, we sometimes require a lever, a

    trigger, a little help.


    Often we don’t dare ask for help with our work, or if we have issues in

    our personal life. Why not? Shame, perhaps. The fear of seeing this help

    refused. Some reticence in showing our true colours. Or a feeling of

    begging. And the shame is even stronger when there are serious money

    problems. We don’t ask for help out of vanity and also misplaced pride.


    But your cat does ask for things. It will be demanding when it is hungry,

    wants to go out for a walk or feels like a cuddle. Even when you’re

    sleeping, your cat will shamelessly come and wake you up to ensure you

    attend to whatever it wants at that moment.


    We too have everything to gain from asking for help around us when we

    need it. And the most surprising thing is that there is always someone who

    will be delighted to help you … as long as you ask them.


    How often have you heard: ‘But you should have asked! Why didn’t you

    mention this to me then? I could have helped you.’


    Sometimes the simplest solution is just to ask.


    Your cat is always right. It dares to ask.


    **Dare to ask for help. Some people will be delighted to give you a hand, because
    they will feel that you value them.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_98_0.png)


    ## YOUR CAT’S DAY


    ### 7.30: DINNERTIME


    If lunch was a bit rushed, owing to your short break, evening is an opportunity
    to treat

    yourself and cook a nice meal.


    Your cat has persuaded you to serve its favourite finely-chopped salmon in jelly,
    so

    there is no reason why you should content yourself with a tin of ravioli half-warmed
    up

    in the microwave and sprinkled with some grated cheddar you found at the back
    of

    the fridge.


    Cooking with or for someone else is always easier of course, but if you’re on
    your

    own, try to find some simple recipes you can enjoy solo.


    And do bother to get a decent plate out, even if it’s just to eat a Chinese takeaway
    –

    much nicer than picking noodles out of a greasy box. Nurture your wellbeing down
    to

    the smallest detail. And if you’re living with someone, take advantage of this
    moment

    to sip a glass of wine, discuss your day or gently rib them about under-seasoning
    the

    dish or cutting the potatoes wrong. A little banter goes a long way to take the

    drudgery out of cooking at the end of a working day, as well as making for a very

    pleasurable evening.


    ## YOUR CAT IS ALWAYS HONEST


    ‘A cat has absolute emotional honesty. Human beings, for one reason or another,

    may hide their feelings, but a cat does not’*


    ERNEST HEMINGWAY


    ![](img/33ca6eec857ccf5f12ca203742da1a49_100_0.png)


    We all tell fibs, sometimes. And the first person we lie to is ourselves. But

    those little accommodations with the truth never bring us much pleasure.

    On the contrary, we’re embarrassed by them, and not very proud of

    ourselves.


    Cats never hide their qualms, their feelings and desires. They are always

    transparent and consistent in their attitude and with what is in their minds.

    ‘Why do otherwise?’ they might wonder. Observing them, one might

    agree. After all, why act any other than honestly?


    Lying is exhausting. Particularly if you want to keep it up. Indeed, the more

    lie, the harder it is to maintain the accumulating falsehoods, which grow in

    complexity and start feeding into each other. But you can stop with the

    mania by simply telling the truth. Be honest like the cat, and as we

    seen, you will gain in charisma and credibility. Be honest for the sake of the
    trust that others will place in you, for your

    image, your peace of mind and your self-esteem.


    **Be honest, you have everything to gain from.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_101_0.png)


    ## YOUR CAT IS SILENT AND OBSERVANT


    *‘I am as vigilant as a cat to steal cream’*


    WILLIAM SHAKESPEARE, HENRY IV


    ![](img/33ca6eec857ccf5f12ca203742da1a49_102_0.png)


    Feral cats don’t meow, except during periods of reproduction, when they

    produce something more akin to a roar to keep their rivals at bay.

    When a cat is just a kitten, it will meow to assert itself, to be heard, but as

    the months pass, it will become increasingly quieter. The higher-pitched meow
    of an adult cat is aimed solely at us humans. It

    is an attempt to speak to us, and of course we can’t understand a thing. So

    most of the time, cats stop the meowing and turn back to their thoughts,

    their observations and their wellbeing.


    Just like the kitten, we babble away constantly when we’re children in

    order to express ourselves. But as we get older and our language skills

    advance, we talk more and more, even if it’s sometimes a whole load of

    nonsense. Unlike us, cats become ‘old adults’ very quickly, and therefore learn
    to

    keep their counsel much faster. They watch in silence, not missing a single

