    leitmotif of the last few decades, fuelled by fashion, reality television and


    social media.


    Appear to have talent or appear to be honest, until you manage to


    convince yourself the lie is real. For all that matters is the current fashion,


    the latest trend, and acceptance by the majority, so much has the balance


    shifted in favour of what other people think. How we appear has become


    more important than what we really are, and therefore what truly makes us


    happy.


    Far too often we submit to this social tyranny of how we should appear,


    while the cat cares as little for this as it does for its first mouse.


    Whether living ferally or in a more or less domesticated group, a cat


    never adopts the attitude or behaviour of one of its peers. A cat stays true to


    itself, with its desires, its character and its needs, without the slightest


    thought of needing to conform to a particular social construct, or present a


    particular image of itself in order to integrate with the majority – who are


    themselves often lacking in direction.


    Your cat is uncompromising and above all loyal to itself, and you would


    do well to be inspired by that path. Be as uncompromising as your cat, even


    if only to reconnect with your desires, even if only to make yourself happier


    by listening to the still small voice constantly telling you:


    **Emancipate yourself from other people’s views of you. To your own self be true.**'
