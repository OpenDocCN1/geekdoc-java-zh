    ![](img/33ca6eec857ccf5f12ca203742da1a49_11_0.png)'
  - '[PAGE 12]


    YOUR CAT IS FREE


    *‘I am the Cat who walks by himself, and I wish to come into your cave’*


    R U D YA R D K I P L I N G , *J U S T S O S T O R I E S*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_12_0.png)


    Freedom, cherished freedom. Who hasn’t dreamed of making freedom the


    driving force of their life?


    Freedom to come and go, freedom to do only that which pleases you,


    freedom of action, freedom to follow your whims and heart’s desires,


    freedom to be as free in your mind as you are in your body. Freedom!


    Paradoxically, we all have a propensity to hobble ourselves again and


    again, to shackle ourselves, be it to bank loans that oblige us to work ever


    harder, to futile objects that seem so precious in our eyes, to habits that have


    turned into obligations we no longer even see, or to toxic people we force


    ourselves to make time for. Perhaps the moment has come to free yourself


    of these shackles.


    Why not try to retain only that which you love, to preserve those


    relationships which please you, to perform only those activities you enjoy,


    and to work solely at jobs that fulfil you? Heed only your own counsel, and


    pursue your true desires.


    A lovely fantasy, you might think. Not for cats, who have chosen to be


    free, to have what they like, be what they like, and live how they like every


    moment of their lives. Freedom is a constant for cats; it’s much more than'
- md: '

    second nature. Being free is the very heart of their lives. The rest matters

    little to them in the end, whereas we often relegate this ideal to booking

    some time off work when our schedule allows.


    **You want to live like your cat? Be free as the air and do only what you have
    chosen to do.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_13_0.png)


    ## YOUR CAT IS CHARISMATIC


    ‘God created the cat so that humans could experience the pleasure of caressing
    a tiger’

    J O S E P H M É RY


    ![](img/33ca6eec857ccf5f12ca203742da1a49_14_0.png)


    Cats don’t need to meow, leap about all over the place or kick up a song and dance
    in order to stand out from the crowd. You can feel a cat’s presence as soon as
    they enter the room. No fuss is required. The cat’s natural charisma ensures that
    everyone will notice them.


    A cat’s discretion and personality oblige us to look in their direction every
    time they pad into the lounge. Classy, very classy. Who hasn’t dreamed of possessing
    such magnetism?


    What does your cat do to give off such positive vibrations and become the focus
    of so much admiration?


    Nothing. YOUR CAT SIMPLY IS.


    And that’s the cat’s biggest lesson: if you wish to acquire a little more animality
    and charisma, simply be.


    Don’t hide, don’t lie to yourself, don’t play a role, don’t whirl your arms about
    in an attempt to mesmerise the present company. Do nothing, that’s all.


    Radiate your personality as if you were a transmitter, a light source.


    Don’t waffle on during a discussion; don’t hog the floor just to blow your own
    trumpet, you’ll only bore your audience. For they will sense, subconsciously,
    that it’s really yourself you’re trying to convince or reassure through those
    long monologues. That’s not having charisma, it’s merely being omnipresent, invasive
    and, ultimately, oppressive.


    Haven’t you ever noticed that the most charismatic people – such as those actors
    who are said to have ‘great presence’ – never overdo it? Their words are as understated
    as their dress.


    The most charismatic people are not the most extravagant. They are present, yet
    always show a certain restraint.


    Charisma develops the more you are honest with yourself and with other people,
    when you accept yourself for what you are, without resorting to artifices that
    don’t fit your deeper personality.


    An attractive personality has many forms, and each of us can develop one as long
    as we are simply ourselves in all circumstances, just like the cat.


    **Radiate the space around you with your presence and charisma by being sincere,
    discreet, plain and true.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_15_0.png)


    ## YOUR CAT’S DAY


    Follow your cat step by step as they proceed with their daily routine: you’ll
    feel better for it.


    ### 7.30: THE ALARM RINGS


    For many people, waking up in the morning is not always easy. So clear the grogginess
    away by following what your cat does.


    Your cat doesn’t leap out of its basket like a jack-in-the-box: that’s bad for
    both body and mood.


    Cats stretch, relax, slowly open their eyes and take the time they need to wake
    up. Stretch, yawn. There’s no point in jolting yourself. Your cat stretches while
    it’s still lying down, then stands, arches its back, stretches again and yawns
    to fully expose its canines, then sits, blinking.


    I tried this. I began to imitate Ziggy. And it really is much pleasanter than
    leaping out of bed like a pancake being flipped before dragging yourself to the
    kitchen to make a cup of tea.


    This phenomenon – practised by most animals – is called ‘pandiculation’, a reflex
    action that we humans too often tend to overlook. But it is so vital to a proper
    wake-up and to get the day off to a good start.


    ## YOUR CAT IS CALM (MOST OF THE TIME)


    ‘The idea of calm is a sitting cat’

    J U L E S R E N A R D


    ![](img/33ca6eec857ccf5f12ca203742da1a49_17_0.png)


    Stress is the bane of our modern societies. How can we fight it? How can we channel
    it?


    There have been many relaxation practices and techniques developed over the last
    few decades. It’s not a very good sign, since it means that we are increasingly
    stressed, and that more of us are getting stressed.


    Always hard at it, always on edge; anxiety builds, insomnia too, leading to physiological
    effects, such as high blood pressure, then burnout.


    Do we really have to live so badly? How can we change things?


    Observe your cat: is it ever stressed? Rarely. Your cat oozes calm and tranquillity.
    Your cat sits quietly, muscles relaxed, presenting no physical signs of agitation,
    its gaze devoid of tension.


    What we sometimes call ‘stress’ in a cat is in fact a heightened vigilance, an
    alertness to potential danger, to an event that might have disturbed the calm,
    restful continuum of its everyday existence. A cat pricks up its ears, focuses
    its gaze, observes and waits. But once the cause of concern has been identified,
    the cat becomes calm again and lays its head back down after a few seconds.


    Your cat does not cultivate stress once a situation, or danger, has passed, been
    avoided or dealt with. Your cat seems to let go of whatever was bothering it –
    disposing of any residual intellectual traces – as if the event had never occurred.
    That is perhaps your cat’s greatest strength, and one of the keys to its majestic
    calm.


    Your cat’s life is a structured and contemplative one – with an emphasis on comfort
    and wellbeing – which nothing must disturb. Cats dislike major changes to their
    daily routine.


    The only (rare) moments of stress to enter a cat’s life derive from a change to
    this state. If an interloper enters your cat’s territory, they must be swiftly
    chased off. If your cat’s kibble is switched for a different, cheaper, less flavoursome
    variety, then a firm demonstration of displeasure must be made. Likewise, cats
    will let you know in no uncertain terms that any long and repeated absences on
    your part do not meet their need for love and attention.


    **To maintain your inner calm and peace, identify the source of your stress, deal
    with the issue thoroughly, then let go of it for good – don’t ruminate or brood
    – and calm will return.**


    Another phenomenon observed in cats, and also noted by veterinarians, is that
    if a cat is often stressed, the reason frequently lies with their owner. Cats
    are like sponges, they feel everything. They absorb moods, but once a certain
    level of tension, noise and yelling has been exceeded, they can’t digest it all
    with their usual total calm.


    If the domestic atmosphere becomes so unbearable that your cat’s wellbeing is
    at stake, it may well leave the house (if it is able). But whose fault is that?
    If the price of their tranquillity is to leave, cats will do it. Take note.


    ![](img/33ca6eec857ccf5f12ca203742da1a49_19_0.png)


    ## YOUR CAT KNOWS HOW TO ASSERTSELF


    ‘I love them, they are so nice and selfish. Dogs are TOO good and unselfish. They
    make me uncomfortable. But cats are gloriously human’

    L . M . M O N T G O E RY, *A N N E F T H E I S A D*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_20_0.png)


    Many of us find it hard to assert ourselves in front of other people, either out
    of shyness or lack of confidence. We take a step back, we say little, we behave
    as if other people are intellectually superior, or at least sufficiently sure
    of themselves to overpower everyone with their presence, their knowledge, often
    their idiocies if you actually listen to them.


    Who are these ‘other people’? They’re you and me, for we are all somebody’s ‘other’.
    If other people take up more space than you, it’s because you let them do so.
    It’s like cupboards: the more you have, the more you fill them. Do you find that
    other people invade your space, sometimes even stepping on your toes before walking
    all over you?


    Think of your cat. Try stepping on your cat’s paw, just to see their reaction.
    You’ll hear them, and possibly even feel them as they dig their claws into your
    calf!

    '
  mdcn: '

    第二天本能。自由是它们生活的内核。对它们来说，其他一切最终无关紧要，而我们往往将这种理想推迟到日程表允许时的某次休假。


    **你想像你的猫一样生活吗？像空气一样自由，只做你选择要做的事。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_13_0.png)


    ## 你的猫极具魅力


    “上帝创造猫，是为了让人类能够体验抚摸老虎的快乐。”

    J O S E P H M É RY


    ![](img/33ca6eec857ccf5f12ca203742da1a49_14_0.png)


    猫不需要通过喵喵叫、四处乱跳或或是跳一场大闹的舞来脱颖而出。当它们进入房间时，你就能感觉到它们的存在。不需要任何张扬。猫天生的魅力确保了每个人都会注意到它们。


    猫的审慎和性格使我们在每当它们步入客厅时，都会不由自主地望向它们。高雅，非常高雅。谁没有梦想过拥有这样的磁力呢？


    你的猫做了些什么来发出如此正能量的波动，并成为如此瞩目的焦点？


    什么都没做。你的猫仅仅是那里。


    这就是猫教给我们最大的课程：如果你希望获得更多一点动物性和魅力，只需做你自己。


    不要躲藏，不要对自己撒谎，不要扮演角色，不要试图通过挥舞双臂来迷住在场的人。什么都不做，此就了。


    像发射器或光源一样，散发出生你的个性吧。


    在讨论中不要模棱两可；不要为了自吹自擂而霸占话题，那只会让观众感到无聊。因为他们会在潜意识里感觉到，你通过那些长长的独白真正想要说服或安慰的其实是你自己。那不是有魅力，仅仅是无处不在、侵略性，并且最终是压迫性的。


    你难道没有注意到，最有魅力的人——例如那些被认为拥有“大气场”的演员——从不过分吗？他们的言辞像他们的穿着一样内敛。


    最有魅力的人并不是最奢华的人。他们虽然在，却总是表现出某种克制。


    你对自己和他人越诚实，魅力就越容易发展；当你接受真实的自我，而不诉诸于不符合你深层性格的伪装时。


    迷人的个性有许多形式，只要我们在任何情况下都做真实的自己，就像猫一样，我们每个人都能发展出一种。


    **通过真诚、审慎、朴实真实，用你的存在和魅力点亮你周围的空间。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_15_0.png)


    ## 猫的一天


    跟随猫的脚步，观察它们的日常活动：你会因此感觉更好。


    ### 7.30: 闹钟响起


    对许多人来说，早晨醒来并不总是容易的。所以，模仿猫的做法来消除睡意。


    你的猫不会像抽隙盒子里的兔子一样蹦出来：这对身体和心情都没好处。


    猫会伸展、放松，慢慢睁开眼睛，花上它们需要的时间醒来。伸展，打哈欠。猛然自己自己意义。你的猫在躺着时就开始伸展，然后站起来，弓起背，再次伸展并打大哈欠以完全露出犬齿，然后坐下，眨着眼睛。


    我试过这种。我开始模仿 Ziggy。这确实比像翻煎饼一样从床上跳起来，然后拖着沉重的身体走向厨房冲杯茶要愉快得多。


    这种现象——大多数动物都会练习——被称为“伸展屈伸运动”（pandiculation），这是一种我们人类往往容易忽视的反射动作。但它对于适当的醒来和开启良好的一天是至关重要的。


    ## 你的猫是冷静的（大多数时候都是）


    “冷静的概念是一只坐着的猫”

    J U L E S R E N A R D


    ![](img/33ca6eec857ccf5f12ca203742da1a49_17_0.png)


    压力是我们现代社会的祸害。我们该如何对抗它？又如何引导它？


    在过去的几十年里，开发了许多放松练习和技巧。这不是一个好信号，因为它意味着我们的压力越来越大，越来越多的人陷入了压力之中。


    总是忙碌，总是神经紧张；焦虑在积累，失眠也是，导致生理影响，如高血压，然后是精力竭。


    我们真的必须生活得这么糟糕吗？我们该如何改变？


    观察你的猫：它有压力大吗？很少。你的猫流溢着冷静和宁静。你的猫静静坐着，肌肉放松，没有表现出任何焦虑的身体迹象，目光毫无紧张。


    我们有时在猫身上看到的“压力”，实际上是警觉性的提高，是对潜在危险的警觉，是对可能扰乱它日常生活中平静安稳状态的事件的警觉。猫竖起耳朵，聚焦目光，观察并等待。但一旦确定了担忧的原因，猫就会恢复冷静，几秒钟后把头低回去。


    一旦情况或危险过去、被避免或被处理，你的猫就不会再培养压力。你的猫似乎放下了任何困扰它的事情——处理掉任何残留的思维痕迹——仿佛那个事件从未发生过一样。这也许是你猫最大的力量，也是它保持那庄严冷静的关键之一。


    你的猫的生活是结构化且沉思的——强调舒适和健康——任何事都不能打扰它。猫不喜欢日常作息发生重大改变。


    进入猫生活的唯一（罕见）压力时刻源于这种状态的改变。如果入侵者进入了你猫的领地，必须迅速将其赶走。如果你猫的猫粮换成了另一种更廉价、没那么美味的品种，那么必须坚定地表示不满。同样，猫会非常明确地让你知道，你长期且反复的缺席并没有满足它们对爱和关注的需求。


    **为了保持内心的冷静与和平，识别压力的来源，彻底解决问题，然后彻底忘记它——不要反思或苦闷——冷静就会回来。**


    另一个在猫身上观察到的现象（也是兽医注意到的）是，如果猫经常压力，原因通常在主人身上。猫像海绵一样，它们感受一切。但一旦紧张、噪音超过了某个程度，它们就无法完全消化。


    如果家庭氛围变得难以忍受，导致猫的健康受到威胁，它可能会离开（如果它可以的话）。但那是谁的错？如果平静的代价是离开，猫会这么做的。记住。


    ![](img/33ca6eec857ccf5f12ca203742da1a49_19_0.png)


    ## 你的猫懂得如何维护自我


    “我爱它们，它们是如此美好又自私。狗太好、太无私了。它们让我感到不自在。但猫是伟大的人性。”

    L . M M O N T G O E RY, *A N E F T H E S A D*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_20_0.png)


    我们中的许多人发现很难在别人面前维护自我，要么是因为害羞，要么是因为缺乏自信。我们退后一步，说得很少，表现得好像别人在智力上更优，或者至少足够自信能用他们的存在、知识（如果你真的听的话，通常是他们的愚蠢）来压倒所有人。


    这些“别人”是谁？他们就是你和我，因为我们都是某某人的“别人”。如果别人占据了比你更大的空间，是因为你允许他们这样做。这就像柜子：你拥有的，填得就满。你是否发现别人侵犯了你的空间，有时甚至踩到你的脚，然后对你肆意践踏？


    想想你的猫。尝试踩一下你猫的爪子，看看它们的反应。你会听到它们的叫声，可能还会感觉到它们的爪子抓进了你的小腿里！

