  mdcn: "\n它像猫一样，但像兔子一样用后爪蹬地。它的速度快得惊人！\n\n至于那些看到齐吉（Ziggy）断了一条腿，就以为可以轻易溜进花园而不怕被赶走的闯入者：那可大错特错了。在这里，齐吉也采用了一种独属于自己的技巧：他不再去追逐那些来示威的大公猫，而是在花园中央占据一个位置，静静地站着，让对方绕着他以不断收缩的圆圈前进。一旦敌人距离足够近，齐吉就会像袋鼠一样用后腿站立，高举起那只孤独的前爪，就像拳击手一样。另一只猫并不理解这种异常行为，继续靠近，虽然有些警惕但并不多。我目不转睛，被这种冷静、这种拳击手的姿态迷迷了。一旦入侵者进入可及范围，齐吉就挥出一记重重的左勾拳，震了那只大公猫！他那的一只前爪由于长期的使用已经变得非常强壮。感到惊讶的入侵者败逃而逃，这时齐吉才将他赶出了自己的领地。我太吃惊了！他很少需要做到比这更多来赶走任何试图靠近房子的猫。\n\
    \n至于那些母猫，就是另一回事了，因为对于猫来说，诱惑和交配前的嬉戏是一件相当残酷的事情。齐吉在另一只猫背上保持平衡时有些困难……\n\n然而，邻居那只暗恋齐吉的母猫很快明白，如果他们玩通常的游戏，他就无法像其他猫那样咬住她的脖子，并保持在她身上而不掉下来了。所以，当欲望占据了她时，她面对他面前，臀部朝向空中，一动不动！齐吉现在可以舒服地兼顾双方的快乐了。\n\
    \n猫在很多方面超过了我们，包括适应能力，而且在这只母猫身上，还体现在理解力上。\n\n残疾从未阻止他像以前一样生活。没有任何梯子或树木能难倒他和他那只缺失的爪子。\n\
    \n我们离开了那所房子，搬到了里昂老城的中心。这对齐吉来说是一个新的栖息地，新的生活环境。那里没有花园，只有一条窄街——晚上11点后非常安静——那里有一个带猫门的旧工作坊建筑。齐吉很快适应了新地方，并把许多快乐的夜晚时光花在捕老鼠上。\n\
    \n我们搬到了现在居住的船只上——仍然在里昂——那里的情况只需要管理齐吉对路过的鸭子的吸引力，免得他掉进萨恩河。齐吉起初面对眼前这片广阔的水域有些不知所措。但几天后，他就成了这片地方的新主人，在舱顶上走走踱，从他位于最高点的指挥部巡视他的领地，并在栈道上来来去。然后，为了扩大他的领域，他开始下楼梯沿着沿岸散步，在草地上撒个尿，并密切观察任何靠近河岸的离群鸭子。\n\
    \n你的猫是物理适应和适应新环境的专家。尽管他们讨厌生活方式的任何改变，但他们会尽全力在别处重建他们舒适的丝茧，整合所有构成他们快乐生存的习惯。\n\n适应能力是智力的真正标志。\n\
    \n**猫的适应能力来自哪里？是因为猫热爱生活吗？**\n\n**是因为猫爱它的生命吗？是因为它爱自己吗？“三者都是，”齐吉船长说！**\n\n![](img/33ca6eec857ccf5f12ca203742da1a429_058.png)\
    \ \n\n**猫的适应能力来自哪里？是因为猫热爱生活吗？**\n\n**是因为猫爱它的生命吗？是因为它爱自己吗？“三者都是，”齐吉船长说！**\n\n![](img/33ca6eec857ccf5f12ca203742da1a429_059.png)\n\
    \n**猫的适应能力来自哪里？是因为猫热爱生活吗？**\n\n**是因为猫爱它的生命吗？是因为它爱自己吗？“三者都是，”齐吉船长说！**\n\n![](img/33ca6eec857ccf5f12ca203742da1a429_060.png)\n\
