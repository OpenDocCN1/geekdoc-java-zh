    发人深省


    “你怎么知道自己疯了呢？”


    “首先，”猫说道，“狗可没疯。你认同这一点吗？”


    “我想是这样吧，”爱丽丝说。


    “那么，”猫继续说道，“你看到过狗在生气时会低吼，高兴时会摇尾巴。而我高兴时会低吼，生气时会摇尾巴。因此，我是疯的。”


    刘易斯·卡罗罗尔，《爱丽丝漫奇仙境游记》


    ![](img/33ca6eec857ccf5f12ca203742da1a49_31_0.png)


    ## 你的猫自带傲气，你的猫是自豪的


    *‘狗认为自己是人。猫认为自己是神’*


    匿名


    ![](img/33ca6eec857ccf5f12ca203742da1a49_32_0.png)


    我们经常混淆自尊与自信。尽管这两个概念相互重叠且互补，但一个人完全可能很有自信，却并没有多少自尊，反之亦然。


    听起来有点模糊？好吧，比个例子：你是一个出色的销售员，对自己的销售能力充满自信，在外面工作时感到很有底气，但你每天都告诉自己你的工作没有成就感，是毫无意义的，世界上有比这更好的你可以做，但是……缺乏自尊。


    反过来说，为了让你听得更透彻：你告诉自己音乐是你的热情，你是一个有才华的音乐家，从粉丝那里得到的各种反馈让你知道这一点，尽管你发现获得成功很难，因为在舞台上……缺乏自信。


    你为你自己的身份感到自豪吗？为你所做的事情感到自豪吗？


    你在你所做、你所是中的自我形象，与你的自信同样重要。如果你与自己的欲望、需求和梦想保持一致，那么自尊与自信往往会重叠融合，你将达到成就感与幸福感的巅峰。


    至于猫，关于自尊以及对自身和所作之事的这种自豪？猫天生的自尊和对自我的自豪显然是一种我们可以汲取灵感的资产。你的猫为自己是一只猫感到自豪，带着这其中代表的所有优势。


    每只猫都是独一无二的，它们也清楚这一点。猫不需要过分表现来来说服自己或周围的人。你的猫充满自信，自尊心。你的猫不需要向任何人证明什么。你的猫仅仅是存在那里。仅仅是一只猫，就足以傲然行之。


    **为你自己的身份感到自豪：在这上，你将脱颖而出。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_33_0.png)


    发人深省


    “猫的眼睛是向我们展示另一个世界的窗”


    爱尔兰谚语


    ![](img/33ca6eec857ccf5f12ca203742da1a49_34_0.png)


    ## 你的猫是关注焦点


    *‘猫不提供服务。猫提供的是自己’*


    威廉·巴勒鲁斯，《体内的猫》


    ![](img/33ca6eec857ccf5f12ca203742da1a49_35_0.png)


    尽管它们安静冷静，带着一种“别来烦我”的气质，但你的猫总是想成为关注的焦点——只要它们喜欢环境中的那些人类。它们在不同的膝盖间走来走去，甚至会在场场唯一一个并不特别喜欢猫的人腿上蹭——仿佛在接受某种挑战。


    没有人能逃脱你猫的存在，包括那些性格内敛的人。你的猫已经是你家的主宰了；而当你邀请几个朋友聚在一起喝酒时，成为焦点是你的猫非常喜欢的小游戏。


    但你的猫是如何吸引注意的呢？它会为了喵喵来引起注意吗？年轻的小猫在头几个月里可能会因为缺乏经验而这样做。但任何冷静从容的猫只会轻盈地走向你，眨着眼睛，在几秒钟内逐个催化你的客人，通过给他们提供抚摸毛皮的“机会”，提供一点点温柔和关注。即使你第一次见到某只猫，它也会通过它平静地靠近、让自己被触摸，甚至（有时时候）假装享受其中，而迅速成为你关注的焦点。


    从本能上，我们都想通过伸出手来从猫身上汲取某种无形的东西。一点平静与宁静。猫知道这些，只是静静地看着我们。猫允许我们这样做；它们让我们通过它们自我安慰。因为当我们抚摸猫时都会微笑。


    但你的猫到底做了什么才成为焦点呢？你的猫给出了。通过它的存在方式给出了。通过将自己呈现在你面前，作为一份你可以触摸的抚慰礼物给出了。


    几次抚摸，突然，仿佛被催眠了一样，所有人都停止了聊天。为什么？因为猫对他们投入的兴趣，它在那个时刻放在每个人触手可及的生命与宁静之源，远比任何哲学上的反思、形而上学的思考或混乱的辩论更有价值。


    **想要吸引注意力，就要成为你亲人的源泉、引力中心。给予吧！**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_36_0.png)


    ## 你的猫对评判免疫


    *‘至于那只猫，她对人类有自己的看法。她话不多，但你听出的信息足以让你担心自己没听全’*


    杰隆·杰罗姆


    ![](img/33ca6eec857ccf5f12ca203742da1a49_37_0.png)


    这是一个经常令我感到趣的观察：猫完全不在乎是否被欣赏，无论是被人还是被其他猫欣赏。


    猫是独立、孤独的角色。在它们偶尔依附于人类或其他动物的极少数情况下，那是出于选择且带有洞察力的。这意味着它们非常自然地——而且带着不小的快感——忽略了他人对它们的看法，而我们人类倾向于赋予这种看法过多的重要性。


    猫并没有这种需要被“他人”爱、赞赏、崇拜，或至少被接纳的需求。猫仅仅是存在那里。它们对自己的看法才是最重要的。


    当然，我们不能只顾着审视自己的脐脐，那并不是重点。但自尊与他人看法之间的平衡往往会过度地向错误的方向倾斜。


    在我们周围有充足的证据证明我们社会对外貌的痴迷。只要看看媒体吧。个人形象已成为一种崇拜，不是为了自己，而是为了他人。然而，这是我们对自己能犯下的最大的欺骗。


    看起来酷、看起来年轻、看起来富有、看起来聪明、看起来宽容、看起来有趣、看起来开明、看起来、看起来、看起来。这是过去几十年的主旋律，由时尚、真人秀和社交媒体所驱动。


    看起来有才华或看起来诚实，直到你成功说服自己那个谎言是真的。因为唯一重要的是当下的时尚、最新的趋势以及大多数人的接纳，平衡已经极度偏向了他人的看法。我们看起来什么样变得比我们真实的模样更重要，因此不再是真正让我们幸福的东西。


    '
