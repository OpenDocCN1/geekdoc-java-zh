    ## 你的猫始终保持本性


    *“猫可以去修道院，但它依然是一只猫”*


    埃塞俄俄谚


    ![](img/33ca6eec857ccf5f12ca203742da1a49_112_0.png)


    没有虚假的诱惑、角色扮演或借来的风格：你的猫在靠近你时，从不穿上伪装或假装某种特定的态度。无论它渴望或要求什么，你的猫总是会按照自己的性格去执行。


    正如我们所看到的，你的猫是诚实的，因为那样要简单得多。


    那么，为什么你的猫要装戏来让自己看起来不像它原本的样子呢？这对它们有什么好处呢？


    而当我们这样做——往往是因为缺乏自信——时，对我们又有什么好处呢？无一用处。我们又在欺骗自己，也在欺骗别人。最糟糕的是，我们深信这种为了应对特定情况或某些个人而刚刚戴上的伪装，比我们内心深处真实的自己更可信。简直是愚蠢！


    纸板做的电影场景怎么能取代真山或波涛大海的庄严？


    当我们撒谎时——是因为担心自己达不到标准——我们让自己变得容易被看穿，既没有魅力也没有风度。


    我们的自然状态中没有任何塑料感。它散发着我们的一切。它让我们在他人眼中变得美丽、有吸引力且值得信赖。


    保持本性是对我们本质的承诺，没有任何虚假或诡计。知道如何在任何情况下都保持自然并接受自我，不仅是赢得赞赏更是真正给人留下深刻印象的最佳方式。永远不要低估自己。


    **在任何情况下都保持本性。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_113_0.png)


    ## 你的猫谦逊且宽容


    *“猫并不非要按照狮子的本性生活”*


    斯宾莎


    ![](img/33ca6eec857ccf5f12ca203742da1a49_114_0.png)


    我们都倾向于把标准定得太高，对自己很严苛，甚至为了某些事情而自我责备。


    有野心，这很好；付出最好的自己，这当然；但在遇到挫折时，知道如何善待自己同样重要。保持诚实并对任何工作或项目竭尽全力是重要的，但没有人能指望你一直并在所有事情上都表现精异，至于让自己生病。


    这一切与你能从猫身上学到的东西有什么关系？这些都总结在上一页斯宾莎的引文中。你的猫可能是猫科动物，像狮子一样，但你的猫不会为了一直变得像狮子一样强壮快速而精疲力竭。你的猫不是、永远不会是森林之王。也许它甚至不是猫中的老大。但又怎样呢？这能阻止你的猫尽情生活并获得快乐吗？它会花时间想要获得一个它知道永远无法达到的职位或地位吗？它会为自己无法控制的事情而自责吗？


    一点点谦逊或一点点自我接纳并不会阻止你为你自己的所和所为感到自豪。你应该因为自己不是梅尔西就停止唱歌吗？你应该因为自己不是塞尚就停止画画吗？这些天赋的匮乏会让你成为一个价值较低的人吗？还是仅仅是不同？


    用你所拥有的做到并继续进步，因为即使你的猫知道自己永远不会成为狮子，也不会阻止它在无法成为森林之王时跳跃、狩猎并成为你沙发之王。


    **在工作中保持谦逊。善待自己。但无论你做什么——去做吧！**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_115_0.png)


    ## 猫的秘密


    ![](img/1png)


    *“你们中喜欢和我们一起睡觉，但经常在睡觉时，我们发现自己却在卧室门的另一侧。确实，当我们年轻时，我们会到处乱动，而且因为我们晚上睡得不多，所以想在床上玩。但是，你们知道的，几年后我们就安静了，所以给我们开门，我们会在你脚边安静地入睡。因为如果我们来到你的床边，不仅是为了温暖的垫子和被子，也是为了保护你。还有谁会在深夜守卫，防止恶灵进入你的家打扰你的睡眠呢？这也是我们的使命。我们和你一起睡是为了更好地保护你。信不信由，但即使你觉得这有点神神秘，也想想吧。”*


    ZIGGY


    ## 你的猫知道如何在万事中发现乐趣


    *“当我和我的猫一起玩时，谁知道它觉得跟我玩的乐趣是否比我玩它的更有趣？”*


    米歇尔·德塔涅


    ![](img/117_117_0.png)


    当我们通过教训学习时，有时会怀疑生活是严肃的。因此，知道如何娱乐很重要，以减轻它有时阴暗的一面，或者简单地选择从另一个角度看待问题（杯子是半满还是空的？）。


    学会娱乐是快乐的关键条件。过度严肃的人永远困在自己的幻想中，有时会变得不知道如何玩耍、如何快乐和大笑；他们几乎无法微笑。


    玩耍是你猫的主要活动之一，狩猎也是其中一部分，当你看到它把一只受伤的田鼠反复玩弄几个小时，让那只可怜的小东西逃几英寸后再再次扑上去时，这看起来是多么残忍。但这是你的猫娱乐自己的方式，正如我们人类发明了无数大笑和娱乐的方式一样。


    学会大笑（最重要的是学会对一切事大笑），学会不要对自己太严肃，学会如何把社会地位抛在脑后——想想那些你听到人们说类似“我相信你理解，我不能允许自己那样，那会损害我的地位”的时刻。


    自我形象，刻意的伪装……我们必须忘记一切，忘记所有阻碍我们快乐和大笑的人类特质。


    **大笑吧！对一切大笑！对自己笑！一直如此！**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_118_0.png)


