    ## 猫


    ![](img/33ca6eec857ccf5f12ca203742da1a49_82.png)


    # 你的猫是韧性的


    *“永远不要试图比猫更固执”*

    R O B E R T . H E I N L I


    ![](img/33ca6eec857ccf5f12ca203742da1a49_83_0.png)


    固执，是的，韧性更胜。猫能够守着一个鼠洞几个小时，等待鼠类的出现。耐心，韧性：你可以看着猫做这件事很长一段时间，而它不会感到无聊或放弃。这是关于坚持——值得尊重——直到抓到那只老鼠的目标达成。


