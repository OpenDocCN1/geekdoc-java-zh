    **大笑吧！对一切大笑！对自己笑！一直如此！**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_119_0.png)


    所有的猫都是美丽的，这真的非常令人惊讶。丑猫非常罕见，除非它们从未得到照顾，或者老了、病了。根据定义，猫从出生到死亡都是美丽的，很少受时间的侵蚀。猫会长皱纹吗？猫会掉毛吗？我们在这方面真的更“优越”吗？


    猫是美丽的这件事本身并不重要。但它们一直保持的自信态度也许是由这一事实决定的：猫是美丽的，也许意识到了这一点。


    感到美丽是重要的，甚至是必要的。但你不会通过遵循任何旧标准来实现。想要看起来像杂志封面——更不用说纤瘦或其他任何其他标准——意味着不想像自己，最重要的是不接受自己，不爱自己。谁能通过这种伪装真正爱你你呢？


    当你照镜子时真心认为自己美丽，你的魅力、气质以及随之的吸引力将增加十倍。


    目标不是在他人眼中达到特定的外貌，而是让自己对自己的健康感到良好。


    这之间存在着巨大的鸿沟。


    而这正是我们必须利用的鸿沟来感觉更好，一个可以通过我们的举止和着装来努力的空间。


    到头来只有一条美丽规则要遵循，只有一个公正的法官（除非他们根据不是自己的标准进行评判）：你。镜子里的你。仅此而已。


