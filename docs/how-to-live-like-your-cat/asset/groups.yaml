    深思思考


    “猫是神秘的物种。它们脑海中闪过的想法比我们意识到的要多得多。”


    沃尔特·史特爵士


    ![](img/33ca6eec857ccf5f12ca203742da1a49_93_0.png)


    ## 你的猫知道自己想要什么，并且直言不讳


    *“宇宙中有很多聪明的生物。其中大多数都是猫所拥有的”*


    波兰谚语


    ![](img/33ca6eec857ccf5f12ca203742da1a49_94_0.png)


    当猫想要从你那里得到什么时，它们不会拐圈子；它们会

    一直纠缠你，直到得到它们想要的为止。猫是有胃要求的，如果它们对某种新品牌的猫粮并不疯狂，你就无法欺骗它们。最坏的情况下，你的猫会——闹脾气，或者撞掉碗，你也不得把那包新粮收进柜子，然后出去买回常用的那个品牌。


    你的猫知道自己想要什么，并且会坚持自己的立场。


    同样地，如果你的猫在晚上外面散步，或者正快乐地躲在离你两英尺外的花丛里，你永远无法强制它在晚上回来。


    猫是出色的猎手，当它们在追捕猎物时，没有什么能让它们分心。这种固执的执着是猫的伟大特质。猫总是知道自己想要什么。甚至尝试谈判都是没有意义的。


    我们自己多久需要根据某些外部因素做出妥协呢？


    有句话说：“我并不真的自己想要什么，但至少我知道我不想要什么。”我只部分喜欢这句话，因为它往往用来掩盖那些被我们扫到地毯下的真实欲望，因为我们不认为自己能够实现它们。


    “你真正想要什么？”是一个我们都应该经常且极度诚实地问自己的问题。很多时候，我们最终屈从于朋友和家人“想要”或“期待”我们成为什么，而不是我们“相信”自己与生为此的。我们忘记了真正驱动我们的动力和欲望。


    “你真正想要什么？”猫清楚地知道自己想要什么，并且一生都只关注这一点。


    知道自己想要什么是一回事。第二步是给自己提供实现它的手段，在你的抱负中要有要求性且直接。不要拐圈子。


    我们所有人都在某种程度上有这种痴迷，即避免说出确切想说的话，或者清楚地提出我们想要的，这在许多方面都让人精疲力竭。


    坦诚面对。不要害怕直话直说，不要直接处理话题，如实陈述事实，并明确说明你的愿望。直接一点，你将节省既时间又精力。


    最后，尽管猫知道自己想要什么，但它们不仅仅通过态度或行为来索要（至少我们人类很幸运，拥有语言的能力）：它们会行动。


    **直接一点，去问。“我想要，我能，我做！”应该对你来说就像猫那自豪的胡须一样自然。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_96_0.png)


    ## 你的猫敢于开口（一直如此）


    *“在猫的眼里，万物都属于猫”*


    谚语


    ![](img/33ca6eec857ccf5f12ca203742da1a49_97_0.png)


    正如我们在上一章看到的，一旦我们清晰地识别、构思并表达了自己的欲望，我们有时需要一个杠杆、一个触发器，一点小帮助。


    通常我们不敢在工作工作中寻求帮助，或者在个人生活中遇到问题时。为什么呢？也许是因为羞耻。是害怕这种帮助被拒绝。是在展现真面目时的某种顾忌。或者是一种乞求的感觉。当有严重的金钱问题时，这种羞耻感更强烈。我们不是出于虚荣和错位的自尊心而寻求帮助。


    但你的猫确实会要求东西。当它饿了、想出去散步或想抱抱时，它会提出要求。即使在你睡觉时，你的猫也会不颜耻地来醒你，确保你照顾它那一刻想要的任何事情。


    当我们需要时向周围的人寻求帮助，我们也能获益。而最奇的是，总有人乐意帮助你……只要你开口请求。


    你听过多少次：“但你应该问的！你当时为什么没提这件事呢？我本可以帮你的。”


    有时候，最简单的解决方案就是问。


    你的猫总是对的。它敢于开口。


    **敢于寻求帮助。有些人会很乐意帮你一把，因为他们会觉得你看重他们。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_98_0.png)


    ## 猫的一天


    ### 7.30: 晚餐时间


    如果因为休息时间短导致午饭有点匆忙，晚上就是一个款劳自己并做顿好饭的机会。


    你的猫会说服你给它吃冰箱里那些切碎的三文鱼肉，即使在你睡觉时，你的猫也会不颜耻地来醒你，确保你照顾它那一刻想要的任何事情。


    当你独自独处时，尝试做一些简单的菜肴。


    和别人一起做饭总是更容易，但如果你独自独处，为了享受一杯葡萄酒，为了准备一个愉悦的晚餐，顺便聊聊你的一天。


    ## 猫永远是诚实的


    “猫拥有绝对的情感诚实。人类出于某种原因可能会隐藏情感，但猫不会”


    欧内·海明威


    ![](img/33ca6eec857ccf5f12ca203742da1a49_100_0.png)


    我们有时都会撒谎。而我们第一个欺骗的是自己。但那些对真相的妥协并没有带给我们多少快乐。相反，我们为它们感到尴尬，并且并不为此感到自豪。


    猫从不隐藏它们的忧虑、欲望。它们在态度和内心想法上总是透明且一致的。“为什么要这样做呢？”它们可能会想。观察它们，人们可能会同意。


    撒谎是精疲力竭的。特别是你想维持下去时。事实上，谎得越多，维持那些相互关联复杂的谎言就越困难。但你可以通过简单说实话来停止这种痴迷。像猫一样诚实，正如我们所见，你将赢得魅力和信誉。为了他人对你的信任，为了你的形象、内心的平静和自尊。


    **诚实，你将从中获益。**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_101_0.png)


    ## 猫是沉默且敏锐的


    *“我像猫偷奶油一样警觉”*


    威廉·莎士比亚，亨利四世


    ![](img/33ca6eec857ccf5f12ca203742da1a49_102_0.png)


    野外猫不喵叫，除非在繁殖期间，那时它们会发出更像咆哮的声音来驱赶竞争对手。当猫只是一只幼猫时，它会为了主主自己而喵叫，但随着月份推移，它会变得越来越安静。成年猫的高音喵声完全针对我们人类。这是一种试图与我们交流，但我们完全听不懂。所以大多数时候，猫会停止喵叫，回到它们自己的思考、观察和健康中。


    就像幼猫一样，我们小时候会不停念叨来表达自我。但随着年龄的增长和语言能力的提高，我们说得越来越多，即使有时完全是一堆胡言。不像我们，猫很快就变成了“老大人”，因此很快学会了守口如瓶。它们沉默地观察，没有错过任何一个


    '
