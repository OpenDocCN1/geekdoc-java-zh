    ## YOUR CAT’S DAY


    ### **8.15: WASH TIME!**


    After eating its fill for breakfast, you’ll see your cat begin to lick itself
    at length. It’s also shower time for you.


    Everyone knows what it’s like to take a shower when you’re running late. Sometimes
    the water is barely warm before you step into it. Quick, quick! You’re in a rush!
    Meanwhile your cat slowly runs its tongue the length of one rear paw, then the
    other. Quite serene.


    Beyond the obvious hygiene benefits, a shower is one of those moments in the day
    when you can and SHOULD take care of yourself. It’s also a moment of relaxation,
    an excellent opportunity to give free rein to your thoughts and let your mind
    gently wake up to what you have on your schedule.


    Women are often better than men in this regard; luxuriating in long periods spent
    pampering themselves in the bathroom, something men struggle to comprehend. But
    that is an authentic catlike attitude, and we should all learn from it.


    ## YOUR CAT IS CURIOUS BY NATURE


    *‘There is no more intrepid explorer than a kitten’*

    J U L E S C H A M P F L E RY


    ![](img/33ca6eec857ccf5f12ca203742da1a49_41_0.png)


    Cats have an innate curiosity. As soon as they leap from their basket and skitter
    across the floor, they nose about, sniffing every nook and cranny, examining each
    object with great concentration and exploring any unknown areas.


    Unlike dogs, cats don’t throw themselves unthinkingly at every novelty. Your cat
    progresses cautiously without taking its eyes off the new paper bag or the unexplored
    hiding place.


    Cats have an unbridled curiosity which makes them constantly re-explore their
    world. Every day is a new discovery, a little scrap of extraordinary fuelled by
    this boundless curiosity.


    We can all benefit from learning a little each day, and being amazed more often.


    Some people are more or less observant than others, their minds are more or less
    focused on always wanting to make new discoveries. Novelty is integral to our
    wellbeing, it’s a kind of oxygen for our minds. We need it like we need air to
    breathe. Without it, we slowly wither. For those who don’t know how to cultivate
    this mood-lifting curiosity, simply stick to this basic principle:


    **Learn something new every day.**


    The significance, importance or value of this new thing is irrelevant, but learn
    something each day, even if it’s only a single word. You’ll remember it for ever.


    What matters is to practise this exercise long-term, particularly if you’re someone
    who isn’t naturally curious. One moment of curiosity per day means 365 new pieces
    of knowledge per year, and believe me, it makes all the difference, not only to
    your ability to perform well in pub quizzes, but above all to your happiness.


    **Be curious! About everything! You’ll live all the better for it. Amaze yourself.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_42_0.png)


    ## YOUR CAT IS IN-DE-PEN-DENT


    *‘Once a cat agrees to live with you, you and the cat spend the rest of your lives
    together deciding whether or not the arrangement is working out’*

    M I C H A E L C U N N I N G H A M


    ![](img/33ca6eec857ccf5f12ca203742da1a49_43_0.png)


    Independence is one of your cat’s main characteristics. Cats are not subject to
    any hierarchy, they don’t need to build any kind of communal life, or live in
    a tribe, like other animals.


    Your cat’s independence is inalienable. Cats live according to their desires,
    they don’t require the approval of their kind, and of humans even less.


    Why do cats have such an independent existence?


    It means they don’t have to justify themselves, and can act purely according to
    their own wishes, with no outside pressure, social obligation or accusatory gaze.
    This non-negotiable independence is the very foundation of your cat’s freedom.


    Dependence upon others, be it personal or professional, only subjects us to constraints,
    which don’t always fit with our desires.


    Yet, by nature, we cannot be totally independent, as cats are. People have always
    tended towards living in groups. Despite everything, we all have an interest in
    regularly measuring the degree of dependence and independence in our lives, in
    asking ourselves certain questions from time to time:


    - How financially independent am I?

    - Am I capable of putting up with a few months of celibacy without having a compulsive
    need to feel loved and desired at each moment, without needing to have one short-term
    relationship after another to fill the emotional void?

    - Do I alone decide the major directions of my life or are they determined by
    the needs of my partner, parents or children?

    - To what extent am I dependent on my work for the money it brings in?

    - Am I so much in debt that I have no other choice than to rack up overtime, spending
    weekends and holidays working?

    - Am I so dependent on my partner that I am capable of accepting everything, enduring
    everything, even suffering their humiliations in silence?

    - Do my friends and family have such importance in my life that I cannot allow
    myself to contradict them through my actions and opinions, for fear that I will
    offend them and risk losing them?

    - Am I obliged to put up with my boss’s moods in order to keep my job, even though
    there’s a better position waiting for me elsewhere if only I were to allow myself
    to apply for it?

    - What place do my addictions – be they to tobacco, alcohol, drugs, food or sport
    – have in my life? And consequently, to what extent do they influence my actions
    and desires?

    - To what extent am I trapped within these dependencies?

    - To what extent do they dictate my life?

    - To what extent do I still control my own existence?


    These are all questions we should ask ourselves regularly, starting today, in
    order to become aware of our level of dependence.


    All of us have greater or lesser dependencies in our personal and professional
    lives – that’s a given. What’s important is to question these they play major
    or minor roles. In the end, how much weight do I have in own existence? We cannot
    live completely, like cats.


    **Work to reconquer independence in all areas, and you will win.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_45_0.png)


    ## SECRETS


    ![](img/33ca6eec857ccf5f12ca203742da1a49_46_0.png)


    ## YOUR CAT BRIMS WITH SELF-CONFIDENCE


    *‘There is no such thing as an ordinary cat’*

    C O L E T T E


    ![](img/33ca6eec857ccf5f12ca203742da1a49_47_0.png)


    Self-confidence is one of a cat’s principal innate strengths, as we saw in that
    earlier chapter on pride and self-esteem.


    Have you ever seen your cat adopt an introverted attitude, as if a little unsure
    of itself? Of course not. Your cat is proud. Your cat is the best, and knows it.
    As the old adage goes: ‘You’re not the best when you think you are, but when you
    know you are.’ It’s a small difference, but an important one. And it’s the key
    to self-confidence.


    As we have seen, self-confidence depends as much on the acceptance of who you
    truly are as it does on the pride you feel in what you are – commensurate with
    your talents or value system.


    For example, when your cat approaches you of its own accord, it’s thinking, ‘I
    know that you love me’, not wondering, ‘Do you still love me today?’ This certainty
    is part and parcel of its aura, its charisma, its charm and its beauty. It is
    one of the reasons why you love your cat.


    Far too many people suffer from a lack of self-confidence, while others overflow
    with it, sometimes for no apparent reason.

