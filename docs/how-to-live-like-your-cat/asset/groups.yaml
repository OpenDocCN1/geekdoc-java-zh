    FOREWORD


    Some days, you do not feel like going to work, watching the news, taking catastrophe
    to heart or even caring about your own future. You do not feel like having an
    opinion on the government’s latest reforms which make you gnash your teeth, any
    more than you feel like worrying over career trajectory, or knowing if you will
    have much of a pension by the time you retire. You do not want to be constantly
    plagued by your own problems, which are themselves linked to those of family and
    friends, and you do not want to fret about the quality of your diet, or feel guilty
    for destroying the planet every time you draw a bath. You long to switch off and
    unplug from it all, just for a day, just for a moment, and breathe.


    I look round to see that Ziggy, my cat, has padded silently into my study. He
    stares at me, blinking, then leaps onto my desk and lies down on the keyboard.
    It’s a little ritual that we have had years now, stretching back to when I still
    did much of my writing in longhand and he used to bite the pen. It makes me laugh,
    this game we play. It’s as if on one hand he loves that I write, but on the other
    hand he does all he can to prevent me writing. Up until this moment, I considered
    his pawing at me and the keyboard to be nothing more than affectionate games.
    But perhaps he has been trying to tell me something else all these years, something
    as simple as: ‘Hey, don’t you feel like down tools for the day?’


    Down tools. As he nuzzles his nose into my neck, I realise that, today, I do not
    care if I will be able to pay the bills, or whether the stock market is about
    to crash. After all, does he care?


    Maybe this is the secret he has been wanting to communicate all this time: know
    how to let go, focus on the essentials, think about your wellbeing, be like him.
    Live like your cat!


    Cats clearly live much better than we do. So why not follow their example? This
    did by decoding how they operate, their aspirations and lifestyle. It had been
    there right in front of me, all these years, without me realising. We have everything
    to learn from cats, in both our personal and professional lives. I invite you
    to discover their simple secrets, so you can take a step back from your everyday,
    find your wellbeing again, and smile. But what do cats do right? How should we
    take inspiration from them? From this day forward, imagine another way of viewing
    life, by living like your cat.


    YOUR FRIEND, THE CAT

    ‘What greater gift than the love of a cat?’

    C H A R L E S D I C K E N S


    ![](img/33ca6eec857ccf5f12ca203742da1a49_10_0.png)


    Cats have fascinated us since time immemorial. We have observed them and attempted
    to understand their strengths, their qualities, their behaviours, their habits
    and their compulsions. There is a kind of magic in their ability to live serenely
    and to be happy – assets that cats naturally possess, and which we can certainly
    use in our everyday lives, both personal and professional.


    Cats follow a philosophy of life that could be summed up in a few words: eat,
    play, sleep, look out for their comfort, and do only that which pleases them.
    That’s already a lot compared with us. But there is much more, as you will see.


    Cats have a lifestyle that allows them to live without stress, for cats have a
    single priority: their wellbeing. By bringing ourselves closer to their way of
    living, we can open up a fresh perspective, a new world view, while gaining a
    different, deeper understanding of ourselves. So welcome to the cats’ world view,
    their thoughts and their philosophy. Learn to appreciate life as they do.


    ![](img/33ca6eec857ccf5f12ca203742da1a49_11_0.png)


    YOUR CAT IS FREE

    ‘I am the Cat who walks by himself, and I wish to come into your cave’

    R U D Y A R K P L I N G , J U S T O S T O R E S


    ![](img/33ca6eec857ccf5f12ca203742da1a49_12_0.png)


    Freedom, cherished freedom. Who hasn’t dreamed of making freedom the driving force
    of their life? Freedom to come and go, freedom to do only that which pleases you,
    freedom of action, freedom to follow your whims and heart’s desires, freedom to
    be as free in your mind as you are in your body. Freedom!


    Paradoxically, we all have a propensity to hobble ourselves again and again, to
    reason ourselves, be it to bank loans that oblige us to work ever harder, to futile
    objects that seem so precious in our eyes, to habits that have turned into obligations
    we no longer even see, or to toxic people we force ourselves to make time for.
    Perhaps the moment has come to free yourself of these shackles. Why not try to
    retain only that which you love, to preserve those relationships which please
    you, to perform only those activities you enjoy, and to work solely at jobs that
    fulfil you? Heed only your own counsel, and pursue your true desires.

