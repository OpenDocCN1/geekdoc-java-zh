    languishing at the back of the fridge. Eat what you like, but take your time and
    enjoy


    it.


    Breakfast is the most important meal of the day, as nutritionists are so fond
    of telling


    us. It’s also a way to look after yourself and your wellbeing, and start the day
    with a


    smile.'
  - '[PAGE 29]


    YOUR CAT ACCEPTS ITSELF AS


    IT IS, YOUR CAT LOVES ITSELF


    *‘Cats are only human; they have their faults’*


    K I N G S L E Y A M I S


    ![](img/33ca6eec857ccf5f12ca203742da1a49_29_0.png)


    It’s a fact: we only create pain and disappointment for ourselves when we


    are unable to accept ourselves as we are. We are all born different, and most


    of us are dissatisfied with our condition, our body, our social standing. Far


    too many of us don’t love ourselves. We would rather be someone else


    instead of simply accepting who we are. Accepting ourselves also means


    discovering the riches and abilities that each of us possesses.


    Unlike the cat, we have a tendency to deny what we are, and instead


    focus on what we would rather be. That’s guaranteed to make you


    miserable.


    Does your cat ask itself this? Does your cat wonder what it would be like


    to be another cat or a different animal? Such a question clearly never enters


    a cat’s mind, because such a question is quite pointless. Cats are proud of


    what they are, as is proven by their almost haughty attitude to other animals


    – humans too sometimes.


    Your cat has the intelligence not to lumber itself with bogus questions


    that are liable to promote endless sterile ruminations. Consequently, your'
  - '[PAGE 30]


    cat loves itself for itself, for what it is, and is therefore happy.


    Knowing how to accept yourself shouldn’t be complicated once you


    adopt the attitude of your cat, who considers itself to be great just as it is.


    We love cats first and foremost because they love themselves. Why not


    do as they do, without asking too many questions?


    Just try this: stand in front of the mirror in the morning and say ‘You


    know I love you?’ while laughing.


    Seems simple, but try it. You’ll have no choice but to smile.


    But what does that smile mean? That you love yourself enough or not?


    From the tone of that smile in the mirror – sad or joyful – you will see the


    path you must travel to definitively love and accept yourself in your new cat


    persona.


    **To be loved, you must start by accepting and loving yourself.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_30_0.png)'
- md: '

    FOOD FOR THOUGHT


    ‘And how do you know that you’re mad?’


    ‘To begin with,’ said the Cat, ‘a dog’s not mad. You grant that?’


    ‘I suppose so,’ said Alice.


    ‘Well then,’ the Cat went on, ‘you see a dog growls when it’s angry, and wags
    its tail when it’s pleased. Now I growl when I’m pleased, and wag my tail when
    I’m angry. Therefore I’m mad’


    LEWIS CARRILL, *ALICE’S ADVENTURES IN WONDERLAND*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_31_0.png)


    ## YOUR CAT HAS A CERTAIN SWAGGER, YOUR CAT IS PROUD


    *‘Dogs believe they are human. Cats believe they are God’*


    ANON


    ![](img/33ca6eec857ccf5f12ca203742da1a49_32_0.png)


    We often confuse self-esteem and self-confidence. Although these two notions overlap
    and complement each other, a person can very well have self-confidence, yet not
    have much self-esteem, and vice-versa.


    Sounds a bit fuzzy? Well, let’s say, for example, that you’re an excellent salesperson,
    you have total confidence in your sales abilities and feel confident in yourself
    when out in the field, and yet each day you tell yourself that your work isn’t
    fulfilling, that it’s pointless, that there are better things you could be doing
    in this world, but that … Lack of self-esteem.


    The reverse, just to ram it home: you tell yourself that music is your passion,
    that you’re a talented musician, that you know this because of all the feedback
    you get from your fans, even though you’ve found success difficult to achieve
    because on stage … Lack of self-confidence.


    Are you proud of what you are? Of what you do?


    The image you have of yourself in what you do, in what you are, is just as important
    as your self-confidence. If you are in sync with your desires, your needs and
    your dreams, then self-esteem and self-confidence will often overlap and meld,
    and you’ll attain the peak of your fulfilment and your happiness.


    What of the cat, as regards self-esteem and this pride in what they are and what
    they do? A cat’s innate self-esteem and pride in itself is clearly an asset from
    which we may draw inspiration. Your cat is proud to be a cat, with all the advantages
    that represents.


    Each cat is unique, and they know it. Cats don’t have to overdo it to convince
    themselves or those around them. Your cat is confident, with high self-esteem.
    Your cat has nothing to prove. To anyone. Your cat simply is. Simply being a cat
    is reason enough to swagger with pride.


    **Be proud of the person you are: in that, you’ll be exceptional.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_33_0.png)


    FOOD FOR THOUGHT


    ‘A cat’s eyes are windows that show us another world’


    IRISH PROVERB


    ![](img/33ca6eec857ccf5f12ca203742da1a49_34_0.png)


    ## YOUR CAT IS THE CENTRE OF ATTENTION


    *‘The cat does not offer services. The cat offers itself’*


    WILLIAM BURROUGHS, *THE CAT INSIDE*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_35_0.png)


    Despite their quiet calm, and their ‘leave me alone’ airs, your cat always seeks
    to be the centre of attention – as long as they are fond of those humans in their
    environment. They mince from one lap to another, and will even go so far as to
    rub themselves against the legs of the only person present who doesn’t particularly
    like cats – as if undertaking a challenge.


    Nobody escapes your cat’s presence, including the more reticent. Your cat is already
    the sovereign of your home; and being the centre of attention when you have a
    few friends round for a drink is a little game of which your cat is very fond.


    But how does your cat draw focus? Does it meow for attention? A young cat might,
    in its first few months, through lack of experience. But any cool and collected
    cat will merely pad towards you, blinking, hypnotising your guests one by one
    in just a few seconds, by offering them the ‘chance’ of stroking its fur, of a
    little tenderness and attention. Even when you meet a cat for the first time,
    it will soon become the centre of your focus through its sweetness in calmly approaching,
    letting itself be touched and even pretending (sometimes) to enjoy it.


    Instinctively, we all seek to draw something impalpable from a cat by extending
    our hand to it. A little calm and serenity. Cats know this, and simply contemplate
    us. Cats let us do it; they let us soothe ourselves with them. For we all smile
    when we stroke a cat.


    But what has your cat really done to be the centre of attention? Your cat has
    given. Given through its way of being, the simple fact of having presented itself
    to you as a soothing gift you can touch.


    A few caresses and suddenly, as if hypnotised, everyone has stopped listening
    to the conversation. Why? Because the interest your cat has taken in them, the
    source of life and serenity it has placed within everyone’s reach at that moment
    was worth much more than any philosophical reflections, metaphysical considerations
    or muddled debate.


    **To draw attention, be a source, a centre of gravity for your friends and family.
    Give!**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_36_0.png)


    ## YOUR CAT IS IMPENETRABLE TO JUDGEMENT


    *‘Now a cat, she’s got her own opinion about human beings. She don’t say much,
    but you can tell enough to make you anxious not to hear the whole of it’*


    JEROME JEROME


    ![](img/33ca6eec857ccf5f12ca203742da1a49_37_0.png)


    It’s an observation that has often amused me: cats don’t care a jot if they’re
    appreciated or not, be it by people or by other cats.


    Cats are independent, solitary characters. On the rare occasions they attach themselves
    to humans or to other animals, it is by choice and with discernment. This means
    that quite naturally – and with not a little pleasure – they ignore what other
    people think of them, something that we humans tend to accord far too much importance
    to.


    Cats don’t have this need to be loved, appreciated, admired and at the very least
    accepted by ‘other people’. Cats simply are. Their own view of themselves is all
    that matters.


    Of course we cannot live just by contemplating our own navel, that’s not the point.
    But the balance between self-esteem and what other people think often tilts excessively
    in the wrong direction.


    There is abundant proof all around us of the obsession with appearance in our
    society. Just look at the media. Personal image has become a cult, not for oneself
    but for others. Yet it’s the biggest fraud we can commit upon ourselves.


    Appear cool, appear young, appear rich, appear intelligent, appear tolerant, appear
    fun, appear open-minded, appear, appear, appear. It’s the leitmotif of the last
    few decades, fuelled by fashion, reality television and social media.


    Appear to have talent or appear to be honest, until you manage to convince yourself
    the lie is real. For all that matters is the current fashion, the latest trend,
    and acceptance by the majority, so much has the balance shifted in favour of what
    other people think. How we appear has become more important than what we really
    are, and therefore what truly makes us happy.


    Far too often we submit to this social tyranny of how we should appear, while
    the cat cares as little for this as it does for its first mouse. Whether living
    ferally or in a more or less domesticated group, a cat never adopts the attitude
    or behaviour of one of its peers. A cat stays true to itself, with its desires,
    its character and its needs, without the slightest thought of needing to conform
    to a particular social construct, or present a particular image of itself in order
    to integrate with the majority – who are themselves often lacking in direction.


    Your cat is uncompromising and above all loyal to itself, and you would do well
    to be inspired by that path. Be as uncompromising as your cat, even if only to
    reconnect with your desires, even if only to make yourself happier by listening
    to the still small voice constantly telling you:


    **Emancipate yourself from other people’s views of you. To your own self be true.**

    '
