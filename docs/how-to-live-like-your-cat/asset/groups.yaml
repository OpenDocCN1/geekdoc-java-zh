    that regard?


    That cats are beautiful isn’t at all important in itself. But this confident attitude
    they have all the time is perhaps conditioned by this fact: cat is beautiful and
    is maybe conscious of it.


    Feeling beautiful is important, if not essential. But you won’t get there by following
    any old criteria. Wanting to look like a magazine cover – not to mention dubious
    codes governing thinness or anything else – means not wanting to resemble yourself,
    and above all not accepting yourself, not loving yourself. Who could ever truly
    love you through such a masquerade of dissemblance?


    If you sincerely think you’re beautiful when you look in the mirror, then your
    charisma, your aura and consequently your power of seduction will only increase
    tenfold.


    The aim is not to achieve a particular appearance in the eyes of others, but to
    feel good in yourself and in your wellbeing.


    There’s a huge margin between the two.


    And it’s this margin which we all must employ in order to feel better in, a margin
    to be worked on through our bearing and our clothes.


    At the end of the day there is only one beauty rule to follow, and only one judge,
    who is impartial (except if they judge according to codes that are not their own):
    YOU. You in your mirror. That is all.


    **You are beautiful for what you are, and for what you can improve, not for what
    is agreed or displayed by others. Charm is the key.**


