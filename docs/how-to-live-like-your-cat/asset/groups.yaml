    你的猫总是谨慎的


    *“猫喜欢吃鱼，但讨厌湿掉的脚”*

    中世纪谚言


    ![](img/33ca6eec857ccf5f12ca203742da1a49_85_0.png)


    猫并不是鲁莽之脑，它们总是从自己的挫折中吸教训。你的猫在长时间观察并采取无限预防措施之前，绝不会靠近一个新地方、一辆车或物体。猫会让自己陷入不必要的危险中。任何新事物都会先经过仔细的检查、嗅闻和细致入微分析。


    谨慎往往可以避免问题、冲突和事故。但——毫无疑问是因为缺乏本能——人类一直通过用双手去抓燃燃的余烬来积累知识和经验，以此理解它是烫的。仔细想起来，这是一种处理问题的方式非常的方式。除非学习过，否则人类一无所知。你能想象你的猫走在发光的灰烬上吗？


    我们有多少人在没有察觉的情况下吃了变质食物后生病了？然而，你有多少次看到你的猫在食物稍微变干时就不起鼻子不碰饭碗，或者在你从每个角度嗅闻它之前，拒绝吃你递给它的那块火肉？


    你的猫中毒的几很小，因为你的猫会利用感官并且非常谨慎，包括对它们吃的东西。


    人类天生往往无畏，因此也是轻率的，就像一个必须被事事事警告、教学并保护免受任何危险的孩子。但是谁教了你的猫火是烫的、水会淹人、以及大叫的大狗应该远避？是谁教了你的猫那些在街道上滚动的大型嘈闹物体是会撞死你的汽车？猫通过本能知道这些事，它们能察觉到危险，不像孩子。


    我们已经失去了许多本能、许多感官，甚至在人与人的关系中也是如此。我们有多少某一个时刻说过：“我就知道他会对我那样。从一开始我就对他感觉怪怪的。”


    你的直觉是对的。关于这个人的真相形成了你对他们的认知，然而，当这种排斥他人的感觉第一次袭上你头时，你遵循你的直觉了吗？没有。我们往往更倾向于理性而非直觉。随着时间的推移，当我们意识到我们的直觉从未背叛过我们，它总是为了我们的健康而引导我们走向谨慎时，真是太遗憾了。


    第一印象从不说谎。为了未来更谨慎一点，尝试重新与你最原始的本能联系，听听自己 way，信任你自己。你永远不会后悔的。


    **有疑之时即无疑。遵循你的直觉吧！**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_87_0.png)


    猫的一天


    ## 6:30：温馨的家，回到窝穴


    片刻的放松，拥抱，抚摸。待洗衣服和语音邮件可以等等。像你的猫一样，在工作了一天后放松一下。没必要忙着去做那些未完成的家务。换上一件更舒服的衣服，花半小时安静地坐着，也许放些音乐。


    在愉快地开始你一天的第二部分之前，先呼吸一会儿，那部分完全属于你、你的随性与欲望，也许给几个朋友打电话……


    在这一天的这个时候，你的猫最关心的可能是：“我的晚餐不是应该很快准备好吗？”这是一个极大的个人快乐时刻，因为你的猫知道你很快就会花时间——不像今天早上——打开一袋肉冻三文鱼，那是你的猫最喜欢的种类。


    晚上六点半对你的猫和你对来说都是一个小小的放松时刻，是一天从活动转向放松的转折点。最好的事情不要把你一天的疲劳或压力带入你夜晚的小舒适世界。


    你的猫对爱有巨大的需求


    *“猫是为积累抚摸而生的生物”*

    斯特凡·马尔罗梅


    ![](img/33ca6eec857ccf5f12ca203742da1a49_89_0.png)


    我们都需要拥抱、亲吻、抚摸和其他亲爱的动作。尽管我们中的许多人有时发现自己匮乏爱，但猫在需要时从不犹豫地过来向你索要一些温柔。


    你的猫有时需要与你感受这种情感上的亲近，就像我们有时需要沉浸在与伴侣的拥抱中并紧抱住他们一样。


    弗洛伊德描述我们生命中的第一次创伤是出生时脐带——那条连接母亲和她爱的物理纽带——被切断。从以后，我们试图通过与别人的所有关系（无论是爱情还是友谊）来重新建立那种情感联系。


    我们越是痛苦缺乏爱，就越会从他人那里寻求，汲取直到我们饱，溢出来。就像猫一样，一旦我们满足了爱，我们就会在身体上撤离这个源头……然后再再次回来。


    我们对爱的需要的频率也取决于我们对自己的爱。有些人非常喜欢亲热，另一些则没那么，因为我们并不是每天都需要同样的“剂量”。但我们所有人在某种程度上都需要温柔、拥抱和情感的温暖。


    我们从伴侣那里获得，也从我们的猫那里获得，就像猫从我们这里获得一样——想念那些你的猫爱意地把头埋在你手臂下的时刻。那是它从你这里索取一些爱的方式。看它是多么渴望这种温柔而几乎流口水。这与日常为了单纯感到舒服的拥抱完全不同。一旦对爱和情感的需求得到缓解，你的猫就会离开你的大腿去忙它自己的事。


    我们也是一样：需要、期待、等待这种我们每个人都需要的至关重要的爱。


    就像猫一样，或者像花一样，在缺乏爱时，我们每天都会多枯萎一点。正因为如此，人类的心从未能离离开这种被称为爱的驱动力。


    **我们都需要爱。但你需要知道如何给予才能接收。它是我们幸福的关键条件。没有了爱，生活会变成什么样？**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_90_0.png)


    你的猫天生安详的


    *“即使是最小的猫，也是独立的”*

    奥纳多·达·芬奇


    ![](img/33ca6eec857ccf5f12ca203742da1a49_91_0.png)


    移动，不停地移动，忙忙碌碌是我们许多人的状态，仿佛我们无法静止片刻，我们被大城市生活中永不停的节奏所抓住，并将其带回了。


    你刚从工作回来，把外套扔在沙发上，在脏衣服和未付的账单之间穿梭，手里拿着扫帚，另一只手拿着掸子。


    你的猫看着你于厨房、客厅和书房之间奔波。你纳闷它为什么看你那么奇怪。是的，很明显你在打扰你的猫，但它也在试图弄清楚你是不是突然发了呆症。


    拿起 DVD 播放器的遥控器按下“暂停”。这不仅仅是一个比喻；真的去这样做。深吸一口气，然后缓慢地呼出。你会感到一种深层的内心平静，仿佛你刚刚把行李放在了地上。微笑会点亮你的脸，通过这个动作和你的猫的目光——它没有离开你一秒——你会意识到自己从工作日的疯狂切换到了另一种无意义的疯狂，那种由过度活跃和紧张组成的另一个工作日。


    当然，家务必须做，但没有理由不以更冷静、无压力的方式去对待它们。


    然而，如果你继续忙忙碌碌，你会看到你的猫冷静地站起来，轻脚走开去找一个更安静的地方坐下来理毛，也许打个盹。你甚至可能觉得看到你的猫边摇头边自言自语道：“无可救药的人类！没怎么在家里，这里已经是压力中心了。我去卧室那堆干净的毛衣里躲着。至少那里会很安静一会儿。”


    而且，在朝你方向发出最后一声喵喵之前，走向那些柔软、香气扑鼻的衣服（你以后只需要再次清洗它们），你可能会理解到类似的话：“嘿，既然你正忙，别忘了给我的碗装满猫粮并换掉猫砂砂，那儿简直臭极了！”


    **别再到处乱窜了：那太浪费能量了。学会平静。**


