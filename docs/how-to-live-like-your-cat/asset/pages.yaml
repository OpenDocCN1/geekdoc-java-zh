  md: 'YOUR CAT IS FREE


    *‘I am the Cat who walks by himself, and I wish to come into your cave’*


    R U D YA R D K I P L I N G , *J U S T S O S T O R I E S*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_12_0.png)


    Freedom, cherished freedom. Who hasn’t dreamed of making freedom the


    driving force of their life?


    Freedom to come and go, freedom to do only that which pleases you,


    freedom of action, freedom to follow your whims and heart’s desires,


    freedom to be as free in your mind as you are in your body. Freedom!


    Paradoxically, we all have a propensity to hobble ourselves again and


    again, to shackle ourselves, be it to bank loans that oblige us to work ever


    harder, to futile objects that seem so precious in our eyes, to habits that have


    turned into obligations we no longer even see, or to toxic people we force


    ourselves to make time for. Perhaps the moment has come to free yourself


    of these shackles.


    Why not try to retain only that which you love, to preserve those


    relationships which please you, to perform only those activities you enjoy,


    and to work solely at jobs that fulfil you? Heed only your own counsel, and


    pursue your true desires.


    A lovely fantasy, you might think. Not for cats, who have chosen to be


    free, to have what they like, be what they like, and live how they like every


    moment of their lives. Freedom is a constant for cats; it’s much more than'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'second nature. Being free is the very heart of their lives. The rest matters


    little to them in the end, whereas we often relegate this ideal to booking


    some time off work when our schedule allows.


    **You want to live like your cat? Be free as the air and do only what you have
    chosen to**


    **do.**


    ![](img/33ca6eec857ccf5f12ca203742da1a49_13_0.png)'
