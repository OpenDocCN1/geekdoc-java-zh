  md: 'How often should we ourselves have to make compromises according to


    some external factor?


    There’s a saying that goes: ‘I don’t really know what I want, but at least I


    know what I don’t want.’ I only half-like this saying, which often serves to


    cover up true desires which we sweep under the carpet, not believing


    ourselves capable of attaining them.


    ‘What do you really want?’ is a question that we should all ask ourselves


    regularly and with the utmost honesty. All too often we end up settling for


    what our friends and family ‘want’ or ‘expect’ of us, rather than what we


    ‘believe’ we are made for. We forget the motivations and desires that truly


    drive us.


    ‘What do you really want?’ Cats know exactly what they want, and spend


    their whole life focused on that alone.


    Knowing what you want is one thing. The second step is to give yourself


    the means to achieve it, to be demanding and direct in your aspirations.


    Don’t beat about the bush.


    This mania we all have, to a greater or lesser extent, of avoiding saying


    exactly what we wish to say or clearly asking for what we want, is


    exhausting in more ways than one.


    Be straightforward. Don’t be scared to call a spade a spade, to tackle


    subjects directly, to tell the truth as it appears, and to state explicitly what


    you desire. Be direct, and you’ll save both time and energy.


    Finally, although cats know what they want, they do more than merely


    demand it through their attitude or behaviour (at least we humans are


    fortunate to have the power of speech): they act.


    **Be direct, ask. ‘I want, I can, I do!’ should become as natural for you as proud**


    **whiskers are for a cat.**'
