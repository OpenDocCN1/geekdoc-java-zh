    L . M . M O N T G O M E RY, *A N N E O F T H E I S L A N D*


    ![](img/33ca6eec857ccf5f12ca203742da1a49_20_0.png)


    Many of us find it hard to assert ourselves in front of other people, either


    out of shyness or lack of confidence. We take a step back, we say little, we


    behave as if other people are intellectually superior, or at least sufficiently


    sure of themselves to overpower everyone with their presence, their


    knowledge, often their idiocies if you actually listen to them.


    Who are these ‘other people’? They’re you and me, for we are all


    somebody’s ‘other’. If other people take up more space than you, it’s


    because you let them do so. It’s like cupboards: the more you have, the


    more you fill them.


    Do you find that other people invade your space, sometimes even


    stepping on your toes before walking all over you?


    Think of your cat. Try stepping on your cat’s paw, just to see their


    reaction. You’ll hear them, and possibly even feel them as they dig their


    claws into your calf!'
