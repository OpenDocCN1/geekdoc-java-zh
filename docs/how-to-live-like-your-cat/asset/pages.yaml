  md: 'YOUR CAT IS CHARISMATIC


    *‘God created the cat so that humans could experience the pleasure of caressing
    a tiger’*


    J O S E P H M É RY


    ![](img/33ca6eec857ccf5f12ca203742da1a49_14_0.png)


    Cats don’t need to meow, leap about all over the place or kick up a song and


    dance in order to stand out from the crowd. You can feel a cat’s presence as


    soon as they enter the room. No fuss is required. The cat’s natural charisma


    ensures that everyone will notice them.


    A cat’s discretion and personality oblige us to look in their direction


    every time they pad into the lounge. Classy, very classy. Who hasn’t


    dreamed of possessing such magnetism?


    What does your cat do to give off such positive vibrations and become


    the focus of so much admiration?


    Nothing. YOUR CAT SIMPLY IS.


    And that’s the cat’s biggest lesson: if you wish to acquire a little more


    animality and charisma, simply be.


    Don’t hide, don’t lie to yourself, don’t play a role, don’t whirl your arms


    about in an attempt to mesmerise the present company. Do nothing, that’s


    all.


    Radiate your personality as if you were a transmitter, a light source.


    Don’t waffle on during a discussion; don’t hog the floor just to blow your


    own trumpet, you’ll only bore your audience. For they will sense,'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'subconsciously, that it’s really yourself you’re trying to convince or


    reassure through those long monologues. That’s not having charisma, it’s


