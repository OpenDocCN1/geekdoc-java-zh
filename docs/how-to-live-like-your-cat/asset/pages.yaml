  md: 'YOUR FRIEND, THE CAT


    *‘What greater gift than the love of a cat?’*


    C H A R L E S D I C K E N S


    ![](img/33ca6eec857ccf5f12ca203742da1a49_10_0.png)


    Cats have fascinated us since time immemorial. We have observed them


    and attempted to understand their strengths, their qualities, their behaviours,


    their habits and their compulsions. There is a kind of magic in their ability


    to live serenely and to be happy – assets that cats naturally possess, and


    which we can certainly use in our everyday lives, both personal and


    professional.


    Cats follow a philosophy of life that could be summed up in a few words:


    eat, play, sleep, look out for their comfort, and do only that which pleases


    them. That’s already a lot compared with us. But there is much more, as you


    will see.


    Cats have a lifestyle that allows them to live without stress, for cats have


    a single priority: their wellbeing. By bringing ourselves closer to their way


    of living, we can open up a fresh perspective, a new world view, while


    gaining a different, deeper understanding of ourselves.


    So welcome to the cats’ world view, their thoughts and their philosophy.


    Learn to appreciate life as they do.'
