- img_proc: true
  md: 'Stop getting walked all over. ‘Other people’ have no right to assert


    themselves in this way. They have only the space that you grant them; they


    have only your level of tolerance. They won’t stop at crushing your foot.


    They’ll tread you into the dirt, then drown you for good measure!


    There is a real difference between having charisma and a strong


    personality – like your cat – and crushing people in order to impose


    yourself.


    Cats take the space that is their due, without crushing their neighbour, but


    they do not tolerate any encroachment on that space. They assert


    themselves quietly. They don’t play the tyrant, but neither do they accept a


    walk-on part.


    **Know how to assert yourself calmly, and defend your space at the first attempt
    at**


    **intrusion. You deserve more than a walk-on part!**


