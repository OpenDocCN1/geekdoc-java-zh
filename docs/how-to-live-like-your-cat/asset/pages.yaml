    And as a big chatterbox I know all too well that sometimes we really do


    talk a lot of rubbish. There are times when we even go too far, or are in a


    bad mood, and what we say is misconstrued. It wasn’t what we meant to


    say, but it’s too late and the words are out there, unfiltered.


    Learning to keep your counsel means controlling your impulsiveness,


    avoiding talking drivel, and reflecting on and weighing up your thoughts


    before expressing them. It also means listening to what others have to say,


    not monopolising a conversation, and not asserting your own opinion as the


    last word on the matter.


    Learning to keep your counsel means keeping a slight distance, and


    maintaining a little secrecy in your life. Be sincere, but don’t be absolutely


    transparent about everything with everyone all of the time, so as to protect


    yourself from the worst of the backbiters.


    Expressing yourself is not the same as laying it on thick, and while


