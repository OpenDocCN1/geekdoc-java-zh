  md: 'YOUR CAT KNOWS HOW TO


    TAKE THE TIME TO LIVE


    *‘Of all animals, the cat alone attains to the contemplative life’*


    A N D R E W L A N G


    ![](img/33ca6eec857ccf5f12ca203742da1a49_53_0.png)


    Judging by the way cats simply lie there, or sit, staring at the world,


    scrutinising the tiniest detail, you might think they’re a bunch of lazybones


    who do nothing all day long. And you wouldn’t be wrong … at least when


