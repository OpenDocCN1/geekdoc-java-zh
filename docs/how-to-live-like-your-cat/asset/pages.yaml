  merge: -1
  pgno: 53
- img_proc: true
  md: 'Taking the time to live doesn’t mean filling every single moment of our


    lives, urged on by an ever-present fear of death and the need to have seen


    and done everything before its inevitable arrival.


    On the contrary, taking the time to live means becoming aware of each


    passing moment, of taking it into consideration, of appropriating it in order


    to better enjoy it, down to the smallest fraction of a second.


    This is what your cat does. For your cat has no notion of time (at least not


    in the way that we have), nor any notion of eventual death until it occurs –


    leaving aside the hypothesis that cats do in fact have innate knowledge of


    there being another side to the mirror, which might also explain their placid


    attitude in the world of the living, but that’s another story.


    Taking the time to live means knowing how to fully take advantage of


    life, and not seeking to accumulate everything you ‘should’ do/see/visit in a


    minute-by-minute schedule. For some people, even holidays have become


    exhausting sprints of sights and activities, until they become more tiring


    than a week at work.


    Sit back, relax, and observe the world around you. Imitate your cat and


    you’ll feel a little serenity return to your life.


    **There’s an adage that goes: ‘You took a long time to be born, so take the time
