    **7.30: THE ALARM RINGS**


    For many people, waking up in the morning is not always easy. So clear the


    grogginess away by following what your cat does.


    Your cat doesn’t leap out of its basket like a jack-in-the-box: that’s bad for
    both body


    and mood.


    Cats stretch, relax, slowly open their eyes and take the time they need to wake
    up.


    Stretch, yawn. There’s no point in jolting yourself. Your cat stretches while
    it’s still


    lying down, then stands, arches its back, stretches again and yawns to fully expose
    its


    canines, then sits, blinking.


    I tried this. I began to imitate Ziggy. And it really is much pleasanter than
    leaping out


    of bed like a pancake being flipped before dragging yourself to the kitchen to
    make a


    cup of tea.


    This phenomenon – practised by most animals – is called ‘pandiculation’, a reflex


    action that we humans too often tend to overlook. But it is so vital to a proper
    wake-up


    and to get the day off to a good start.'
