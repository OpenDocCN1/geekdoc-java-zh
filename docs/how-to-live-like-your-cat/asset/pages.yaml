  md: 'The case of the new romantic relationship is one that we are all familiar


    with. Caught up in the passion of our newly forming couple, we forget the


    world around us for a few weeks, even a few months. It’s quite


    understandable, and things go back to normal after a while – once the heady


    days of flourishing romance are behind us – and we reinforce those


    relations we’d forgotten for a bit.


    But it also happens that we decide – consciously or not – to change our


    life completely, and we don’t return to those who were always there for us


    year after year. We devote ourselves to our new love instead. It’s a form of


    brazen selfishness that can make our friends feel abandoned, even betrayed.


    ‘I no longer see her any more, ever since she got together with X.’ We


    have all heard or said that phrase, with disappointment, at one time in our


    life or another.


    We could learn a lot from cats about loyalty in friendship. For a cat is


    simply there, from the first day to the last, with neither games nor


    calculations.


    Cats can be capable of more humanity than us humans, whereas we are


    sometimes tempted to turn inward and focus on our little lives, forgetting all


    that has been given and all that has been said.


    A friendship can be as powerful as a romantic relationship, if not more


    so, in that it often lasts much longer …


