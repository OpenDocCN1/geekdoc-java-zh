    In our current system, doing nothing, being contemplative, breathing,


    observing, taking the time to live is almost considered suspect. We are told


    it is imperative to be constantly moving, that we must exploit and fill every


    minute, accumulate tasks and activities, and never ‘waste time’. It has


    become the norm for our society, a golden rule.


    Observing this ceaseless, almost nervous agitation on the part of some of


    my contemporaries, I cannot help but empathise with cats, who seem to find


    it amusing to see us pedalling up a sweat on the exercise bike as we answer


    the phone while watching the TV news … They must think we’re insane to


