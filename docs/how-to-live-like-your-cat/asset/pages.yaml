  md: 'YOU R C AT’ S D AY


    **7.45: BREAKFAST**


    Water and milk for your cat, in a clean bowl. Kibble and wet food – from cans
    or


    pouches but always good, fresh stuff – served in a clean spot.


    This might seem obvious, but how many of us really take the time to have a proper


    breakfast? How many of us knock back a quick tea or coffee, leaning against the


    kitchen sink, not even bothering to prepare a nice slice of toast?


    You’ve taken care of your cat, now take care of yourself. Having a proper breakfast
    in


    a comfortable manner is the best way to start your day, just as it is for your
    cat.


    Take the time to eat, to make some toast and spread it with that good jam that’s
    been


    languishing at the back of the fridge. Eat what you like, but take your time and
    enjoy


    it.


    Breakfast is the most important meal of the day, as nutritionists are so fond
    of telling


    us. It’s also a way to look after yourself and your wellbeing, and start the day
    with a


    smile.'
