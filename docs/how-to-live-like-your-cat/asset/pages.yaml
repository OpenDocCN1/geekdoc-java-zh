    It’s important to be honest and to give your utmost to any job or project,


    but nobody can expect you to excel at everything, all of the time, to the


    point of making yourself ill.


    What does this all have to do with what you can learn from your cat? It’s


    all summed up in the quote from Spinoza on the previous page. Your cat


    may be a feline, like the lion, but your cat doesn’t exhaust itself all day long


    trying to be as strong and as fast as a lion. Your cat is not and never will be


    the king of the jungle. Perhaps it isn’t even the boss among the other cats in


    the neighbourhood. But so what? Does that prevent your cat from living its


    life to the full and being happy? Does it spend its time wanting to attain a


    position or acquire a status it knows it will never reach? Does it hold itself


    to blame for things it cannot control?'
