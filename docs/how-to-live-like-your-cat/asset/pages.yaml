  md: 'YOUR CAT ACCEPTS ITSELF AS


    IT IS, YOUR CAT LOVES ITSELF


    *‘Cats are only human; they have their faults’*


    K I N G S L E Y A M I S


    ![](img/33ca6eec857ccf5f12ca203742da1a49_29_0.png)


    It’s a fact: we only create pain and disappointment for ourselves when we


    are unable to accept ourselves as we are. We are all born different, and most


    of us are dissatisfied with our condition, our body, our social standing. Far


    too many of us don’t love ourselves. We would rather be someone else


    instead of simply accepting who we are. Accepting ourselves also means


    discovering the riches and abilities that each of us possesses.


    Unlike the cat, we have a tendency to deny what we are, and instead


    focus on what we would rather be. That’s guaranteed to make you


    miserable.


    Does your cat ask itself this? Does your cat wonder what it would be like


    to be another cat or a different animal? Such a question clearly never enters


    a cat’s mind, because such a question is quite pointless. Cats are proud of


    what they are, as is proven by their almost haughty attitude to other animals


