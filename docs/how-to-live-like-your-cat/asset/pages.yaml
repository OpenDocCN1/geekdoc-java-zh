    Haven’t you ever noticed that the most charismatic people – such as


    those actors who are said to have ‘great presence’ – never overdo it? Their


    words are as understated as their dress.


    The most charismatic people are not the most extravagant. They are


    present, yet always show a certain restraint.


    Charisma develops the more you are honest with yourself and with other


