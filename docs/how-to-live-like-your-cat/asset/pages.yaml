  md: 'YOUR CAT THINKS ABOUT


    ITSELF FIRST


    *‘A cat does not stroke us, it strokes itself on us’*


    A N T O I N E D E R I VA R O L


    ![](img/33ca6eec857ccf5f12ca203742da1a49_26_0.png)


    As we have seen, cats devote most of their lives to ensuring their own


    wellbeing. And in order to do that, you sometimes have to know how to be


    a little selfish and think only about yourself.


    That doesn’t mean being a navel-gazer, narcissist or egocentric, but


    giving yourself permission to place your personal happiness above that of


    others at times.


    You can’t give to others if you don’t know how to give to yourself.


    Take care of yourself, both physically and psychologically, before


    anything else; the key to your happiness depends on it.


    You’ll be able to give and share more, since you’ll be happy and fulfilled


    in your own life.


    Don’t wait for others before creating your own bubble of wellbeing and


    tenderness – it depends on you alone. Nobody will do it for you. Moreover,


    nobody can know what your welfare truly requires.


    So take yourself in hand, and, like your cat, construct your territory, your


    comfort zone and your means of self-fulfilment.'
