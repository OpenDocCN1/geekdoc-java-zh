    Your cat is honest, as we have seen, because it’s much simpler that way.


    So why would your cat put on an act in order to be taken for something it is


    not? What good would it do them?


    And what good does it do us when we do it – often out of lack of


    confidence? Nothing. We are lying to ourselves again, and we are lying to


    others. And the worst is that we are convinced that this disguise we’ve just


    put on, to deal with a particular situation or certain individuals, will be more


    credible than what we are deep down inside. What stupidity!


    How can a cardboard-cutout film set replace the majesty of a real


    mountain or a raging ocean?


