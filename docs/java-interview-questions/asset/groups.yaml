    ## 4.15 关于 Java 集合框架，有哪些最佳实践？


    -   根据应用需求选择合适的集合类型对性能至关重要。例如，如果元素的大小是固定且预先已知的，我们应该使用 `Array` 而不是 `ArrayList`。


    -   某些集合类允许我们指定其初始容量。因此，如果我们对将要存储的元素数量有估算，可以使用它来避免重新调整大小（resizing）。


    -   始终使用泛型（Generics）来确保类型安全、可读性和健壮性。此外，通过使用泛型，我们可以避免在运行时出现 `ClassCastException`。


    -   使用 Java 开发工具包（JDK）提供的不可变类作为 Map 的键，以避免为我们的自定义类实现 `hashCode` 和 `equals` 方法。


    -   面向接口编程，而不是面向实现编程。


    -   当底层集合实际上为空时，返回长度为零的集合或数组，而不是返回 `null`。


    ## 4.16 Enumeration（枚举）和 Iterator（迭代器）接口的区别是什么？


    Enumeration 的执行速度与 Iterator 相当，且消耗的内存极少。然而，相比 Enumeration，Iterator 要安全得多，因为其他线程无法修改迭代器正在遍历的集合对象。此外，Iterator
    允许调用者从底层集合中删除元素，这在 Enumeration 中是不可能的。


    ## 4.17 HashSet 和 TreeSet 的区别是什么？


    HashSet 是使用哈希表实现的，因此它的元素是无序的。HashSet 的 `add`、`remove` 和 `contains` 方法的时间复杂度为 $O(1)$。相比之下，TreeSet
    是使用树结构实现的。TreeSet 中的元素是有排序的，其 `add`、`remove` 和 `contains` 方法的时间复杂度为 $O(\log n)$。


    JVM 拥有一个堆（heap），它是分配所有类实例和数组的运行时区域。它在 JVM 启动时创建。对象的堆内存由一个称为垃圾回收器（garbage collector）的自动内存管理系统回收。堆内存由活对象和死对象组成。活对象可以被应用程序访问，不会成为垃圾回收的对象。死对象是指那些应用程序永远无法访问但尚未被垃圾回收器回收的对象。这些对象会一直占用堆空间，直到最终被垃圾回收器回收。


    ## 5.6 Serial（吞吐量型）和 Throughput（串行型）垃圾回收器的区别是什么？


    吞吐量垃圾回收器使用了年轻代回收器的并行版本，适用于具有中大数据集的应用。相比之下，串行回收器（serial collector）通常适用于大多数小型应用程序（即在现代处理器上堆内存需求约为
    100MB 的应用）。


    ## 5.7 Java 对象在何时变成可以垃圾回收的对象？


    当一个 Java 对象在当前使用的程序中变得不可达（unreachable）时，它就会被垃圾回收。


    ## 5.8 JVM 的永久代（permanent generation space）会发生垃圾回收吗？


    垃圾回收确实会在 PermGen 空间发生，如果 PermGen 空间满了或超过了阈值，可能会触发全垃圾回收（full garbage collection）。如果你仔细观察垃圾回收器的输出，你会发现
    PermGen 空间也会被垃圾回收。这就是为什么正确设置 PermGen 空间的大小对于避免频繁的全垃圾回收非常重要。此外，请查看我们的文章《Java 8:
