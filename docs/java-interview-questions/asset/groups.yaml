    # Chapter 3


    # Java Threads


    ## 3.1 What is the difference between processes and threads ?


    A process is an execution of a program, while a Thread is a single execution sequence
    within a process. A process can contain multiple threads. A Thread is sometimes
    called a lightweight process.


    ## 3.2 Explain different ways of creating a thread. Which one would you prefer
    and why ?


    There are three ways that can be used in order for Thread to be created:


    - A class may extend the Thread class.

    - A class may implement the Runnable interface.

    - An application can use the Executor framework, in order to create a thread pool.


    The Runnable interface is preferred, as it does not require an object to inherit
    the Thread class. In your application design requires multiple inheritance, only
    interfaces can help you. Also, the thread pool is very efficient and can be implemented
    used very easily.


    ## 3.3 Explain the available thread states in a high-level.


    During its execution, a thread can reside in one of the following states:


    - Runnable: A thread becomes ready to run, but does not necessarily start immediately.

    - Running: The processor is actively executing the thread code.

    - Waiting: A thread is in a blocked state waiting for some external processing
    to finish.

    - Sleeping: The thread is forced to sleep.

    - Blocked on I/O: Waiting for an I/O operation to complete.

    - Blocked on Synchronization: Waiting to acquire a lock.

    - Dead: The thread has finished its execution.


    ## 3.4 What is the difference between a synchronized method and a synchronized
    block ?


    In Java programming, each object has a lock. A thread can acquire the lock for
    an object by using the synchronized keyword. The synchronized keyword can be applied
    in a method level (coarse grained lock) or block level of code (fine grained lock).


    ## 3.5 How thread synchronization occurs inside a monitor ? What levels of synchronization
    can you apply ?


    The JVM uses locks in conjunction with monitors. A monitor is basically a guardian
    that watches over a sequence of synchronized code and ensuring that only one thread
    at a time executes a synchronized piece of code. Each monitor is associated with
    an object reference. The thread is not allowed to execute the code until it obtains
    the lock.


    ## 3.6 What''s a deadlock ?


    A condition that occurs when two processes are waiting for each other to complete,
    before proceeding. The result is that both processes wait endlessly.


    ## 3.7 How do you ensure that N threads can access N resources without deadlock
    ?


    A simple way to avoid deadlock while using N threads is to impose an ordering
    on the locks and force each thread to follow that ordering. Thus, if all threads
    lock and unlock the mutexes in the same order, no deadlocks can arise.


    # Chapter 4


    # Java Collections


    ## 4.1 What are the basic interfaces of Java Collections Framework ?


    Java Collections Framework provides a well designed set of interfaces and classes
    that support operations on collections of objects. The most basic interfaces that
    reside in the Java Collections Framework are:


    - Collection, which represents a group of objects known as its elements.

    - Set, which is a collection that cannot contain duplicate elements.

    - List, which is an ordered collection and can contain duplicate elements.

    - Map, which is an object that maps keys to values and cannot contain duplicate
    keys.


    ## 4.2 Why Collection doesn''t extend Cloneable and Serializable interfaces ?


    The Collection interface specifies groups of objects known as elements. Each concrete
    implementation of a Collection can choose its own way of how maintain and order
    its elements. Some collections allow duplicate keys, while others don''t. The
    semantics and the implications of cloning or serialization come into play when
    dealing with actual implementations. Thus, the concrete implementations of collections
    should decide how they can be cloned or serialized.


    ## 4.3 What is an Iterator ?


    The Iterator interface provides a number of methods that are able to iterate over
    any Java Collection Collection contains the iterator that returns an Iterator
    instance. Iterators are capable of removing elements from the underlying collection
    during the iteration.


    ## 4.4 What differences exist between Iterator and ListIterator ?


    The differences of these elements are listed below:


    - An Iterator can be used to traverse the Set and List collections, while the
    ListIterator can be used to iterate only over Lists.

    - The Iterator can traverse a collection only in forward direction, while the
    ListIterator can traverse a List in both directions.

    - The ListIterator implements the Iterator interface and contains extra functionality,
    such as adding an element, replacing an element, getting the index position for
    previous and next elements, etc.


    ## 4.5 What is difference between fail-fast and fail-safe ?


    The Iterator''s fail-safe property works with the clone of the underlying collection
    and thus, is not affected by any modification in the collection. All the collections
    in java.util package are fail-fast, while the collection classes in java.util.concurrent
    are fail-safe. Fail-fast iterator throws a ConcurrentModificationException, while
    fail-safe iterator never throws such an exception.


    ## 4.6 How HashMap works in Java ?


    A HashMap stores key-value pairs. The HashMap requires a hash function and uses
    hashCode, in order to put and retrieve elements to from the collection respectively.
    When the method is invoked, the HashMap calculates the value of the key and stores
    it in the appropriate index inside the collection. If the key exists, it is updated
    with the new value. Some important characteristics of a HashMap are its capacity,
    load factor and the threshold resizing.


    ## 4.7 What is the importance of hashCode() and equals() methods ?


    In java, a HashMap uses the hashCode and equals methods to determine the index
    of the key-value pair and detect duplicates. More specifically, the hashCode method
    is used in order to determine where the specified key was. Since different keys
    may produce the same value, the equals method is used, in order to determine whether
    the key actually exists in the collection or not. The implementation of both methods
    is crucial for the accuracy and efficiency of the HashMap.


    ## 4.8 What differences exist between HashMap and Hashtable ?


    Both the HashMap and Hashtable class implement the Map interface and thus, have
    very similar characteristics. However, they differ in the following features:


    - HashMap allows the existence of null keys and values, while a Hashtable neither
    allows null keys, nor values.

    - Hashtable is synchronized, while a HashMap is not. HashMap is preferred in single-threaded
    environments, while a Hashtable is suitable for multi-threaded environments.

    - HashMap provides its set of keys and a Java application can iterate over them.
    Thus, a HashMap is fail-fast. On the other hand, a Hashtable provides an Enumeration
    of them.

    - Hashtable is considered to be a legacy class.


    The Array and ArrayList classes differ on the following features:


    - Arrays can contain primitive objects, while an ArrayList can contain.

    - Arrays have fixed size, while an ArrayList is dynamic.

    - ArrayList provides more methods, such as addAll, removeAll, iterator.


    ## 4.10 What is difference between ArrayList and LinkedList ?


    The ArrayList and LinkedList implement the List interface, but they differ on
    the following:


    - An ArrayList is backed by an array. It provides random access to its elements
    with O(1).

    - A LinkedList stores its data as a list. Insertion and removal are faster in
    LinkedList. The search for an element is O(n).

    - LinkedList consumes more memory than ArrayList, because every node stores two
    references, one for its previous and its next.


    ## 4.11 What is Comparable and Comparator interface ?


    Java provides the Comparable interface, which contains only one method, compareTo().
    This method compares two objects, in order to impose an order between them. Specifically,
    it returns a negative integer, zero, or a positive integer to indicate whether
    the input object is less, or greater than the object.


    Java provides the Comparator interface, which contains two methods, compare and
    equals. The first method compares its input arguments and imposes an order between
    them. It returns a negative integer, zero, or a positive integer to indicate that
    the first argument is less than, or greater than the second. The second method
    returns true, only if the specified object is equal.


    ## 4.12 What is Java Priority Queue ?


    The PriorityQueue is an unbounded queue, based on a priority heap and its elements
    are ordered in their natural order. At the time of its creation, we can provide
    a Comparator that is responsible for ordering the elements of the PriorityQueue.
    PriorityQueue doesn''t allow null values, those objects do not provide natural
    ordering, or those objects that don''t have any comparator associated with them.
    Finally, the PriorityQueue is not thread-safe and it O(log(n)) for its enqueuing
    and dequeuing operations.


    ## 4.13 What do you know about the big-O notation and can you give some examples
    with respect to different data structures ?


    The Big-O notation simply describes how an algorithm scales or performs in the
    worst case scenario as the number of elements in a data increases. The Big-O notation
    can also be used to describe other behavior such as memory consumption. Since
    the collection classes are actual data structures, we usually use the Big-O notation
    to choose the best implementation for time, memory and performance.


    ## 4.14 What is the tradeoff between using an unordered array versus an ordered
    array ?


    The major advantage of an ordered array is that the search time has a complexity
    of O(log n), compared to that of an unordered array, the disadvantage of an ordered
    array is that the insertion operation has a complexity of O(n), because the elements
    with higher values must be moved to make room for the new element. Instead, the
    insertion operation for an unordered array takes constant time of O(1).

