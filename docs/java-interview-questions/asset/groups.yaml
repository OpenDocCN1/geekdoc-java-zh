    事件监听器接口定义了事件处理器处理特定事件时必须实现的方法。事件适配器提供了事件监听器接口的默认实现。


    ### 8.13 GUI 组件如何处理它自己的事件？


    GUI 组件可以通过实现相应的事件监听器接口并将其添加为自己的事件监听器来处理它自己的事件。


