    ## 第 6 章


    ### 异常处理


    ## 6.1 Java 中有两种类型的异常？它们之间有什么区别？


    Java 有两种类型的异常：异常（checked exceptions）和未检异常（unchecked exceptions）。如果未检异常可以通过方法或构造函数的执行被抛出，并传播到方法或构造函数的边界之外，则不需要在方法或构造函数的
    `throws` 句中声明。相反，检出异常必须在方法或构造函数的 `throws` 句中声明。在此处查看 Java 异常处理的技巧。


    ## 6.2 Java 中 Exception 和 Error 的区别是什么？


    Error 和 Exception 类都是 `Throwable` 类的子类。`Exception` 类用于用户程序应该捕获的异常情况。`Error` 类定义了用户程序无法预期捕获的异常。


    ## 6.3 `throw` 和 `throws` 的区别是什么？


    `throw` 关键字用于在程序内部显式地抛出异常。相反，`throws` 子句用于指示方法未处理某些异常。每个方法必须指定它不处理哪些异常，以便该方法的调用者可以防范可能的异常。最后，多个异常之间用逗号分隔。


    ## 6.4 `finally` 块在异常处理中的重要性是什么？


    `finally` 块无论是否实际抛出异常，始终会被执行。即使在缺少 `catch` 语句且抛出异常的情况下，`finally` 块也会执行。最后要提到的是，`finally`
    块用于释放 I/O 缓冲区、数据库连接等。


    ## 6.5 异常处理后 Exception 对象会发生什么？


    Exception 对象将在下一次垃圾回收时处理。


    ## 6.6 `finally` 块和 `finalize()` 方法有什么区别？


    `finally` 块无论是否抛出异常都会执行，用于释放应用程序持有的资源。`finalize()` 是 `Object` 类的一个受保护方法，由 Java
    虚拟机（JVM）在对象被垃圾回收之前调用。


    ## 第 7 章


    ### Java Applets


    ## 7.1 什么是 Applet？


    Applet 是一种可以嵌入 HTML 页面并在浏览器中执行的 Java 程序。


    ## 7.2 阐述 Applet 的生命周期。


    Applet 可能会经历以下状态：

    - Init: 初始化 Applet。

    - Start: 开始执行 Applet。

    - Stop: 停止 Applet 的执行。

    - Destroy: 在卸载 Applet 前进行最后的清理工作。


    ## 7.3 Applet 加载时会发生什么？


    首先，创建 Applet 实例。然后，初始化 Applet。


    ## 7.4 Applet 和 Java Application 的区别是什么？


    Applet 在浏览器内部执行，而 Java Application 是在浏览器外执行的独立程序。此外，两者都需要 Java 虚拟机。Applet 通常使用限制性的策略，而
    Application 的策略较为宽松。


    ## 7.5 对 Applet 有哪些限制？


    出于安全考虑，对 Applet 实施以下限制：

    - Applet 不能加载库或定义原生方法。

    - Applet 不能读取某些系统属性。

    - Applet 不能建立来源的网络连接。

    - Applet 不能在执行它的主机上启动任何程序。


    ## 7.6 什么是不可信任的 Applet？


    不可信任的 Applet 是无法访问本地系统文件的程序。默认情况下，所有下载的 Applet 都被认为是不可信任的。


    ## 7.7 网络加载的 Applet 和通过文件系统加载的 Applet 有什么区别？


    对于网络加载的 Applet，它由 Applet 类加载器加载，并受 Applet 安全管理器的限制。对于从磁盘加载的 Applet，它由文件系统加载器加载。通过文件系统加载的
    Applet 允许读取文件、写入文件并在客户端加载库。然而，它们不会通过验证器。


    ## 7.8 什么是 Applet 类加载器，它起什么作用？


    当通过网络加载 Applet 时，它由 Applet 类加载器加载。类加载器强制 Java 命名空间。此外，类加载器保证来自本地文件系统的类具有唯一的命名空间，并确保每个网络源都有唯一的命名空间。当浏览器通过网络加载
    Applet 时，该 Applet 的类被放置在与其相关的私有命名空间中。然后，这些由类加载器加载的类会通过验证器。


    ## 7.9 什么是 Applet 安全管理器，它提供了什么？


    Applet 安全管理器是一种对 Java 应用施加限制的机制。浏览器只能有一个安全管理器。安全管理器在启动时建立，之后无法被替换、重载、覆盖或扩展。


