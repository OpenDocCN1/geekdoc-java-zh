    # Chapter 10


    # Remote Method Invocation (RMI)


    # 10.1 What is RMI ?


    The Remote Method Invocation (Java RMI) is a Java API that performs the object-oriented
    equivalent of remote procedure calls (RPC), with support for direct transfer of
    serialized classes and distributed garbage collection. Remote Method Invocation
    (RMI) can also be seen as the process of activating a method on a remotely running
    object. RMI offers location transparency because a user feels that a method is
    executed on a locally running object. Check some RMI Tips here.


    # 10.2 What is the basic principle of RMI architecture ?


    The RMI architecture is based on a very important principle which states the definition
    of the behavior and the implementation of behavior are separate concepts. RMI
    allows the code that defines the behavior and the code that implements the behavior
    to remain separate and to run on separate JVMs.


    # 10.3 What are the layers of RMI Architecture ?


    The RMI skeleton consists of the following layers:


    +   * Stub and skeleton layer: This layer lies just beneath the view of the developer.
    This layer is responsible for intercepting method calls by the client to the interface
    and redirect these calls to a RMI Service.


    +   * Reference Layer: The second layer of the RMI architecture deals with the
    interpretation of references made from the client to the server''s objects. This
    layer interprets and manages references from clients to the remote service objects.
    The connection is a one-to-one (unicast) link.


    +   * Transport layer: This layer is responsible for connecting the two JVM participating
    in the service. This layer is based on TCP/IP connections between machines in
    the network. It provides basic connectivity, as well as some firewall penetration
    strategies.


    # 10.4 What is the role of Remote Interface in RMI ?


    The Remote interface serves to identify which methods may be invoked from a non-local
    virtual machine. Any object that is a remote object must directly or indirectly
    implement this interface. A class that implements a remote interface should declare
    the remote interfaces being implemented, define the constructor for each remote
    object and provide an implementation for each remote method in all remote interfaces.'
  - '[PAGE 31]


    # 10.5 What is the role of the java.rmi.Naming Class ?


    The java.rmi.Naming class provides methods for storing and obtaining references
    to the remote objects in the remote object registry. Each method of the Naming
    class takes arguments as a name that is a String in URL format.


    # 10.6 What is meant by binding in RMI ?


    Binding is the process of associating or registering a name for a remote object,
    which can be used at a later time, in order to look up that remote object. A remote
    object can be associated with a name using the bind or rebind methods of the Naming
    class.


    # 10.7 What is the difference between using bind() and rebind() methods of Naming
    Class ?


    The bind method is responsible for binding the specified name to a remote object,
    while the rebind method is responsible for rebinding the specified name to a new
    remote object. In a case binding exists for that name, the binding is replaced.


    # 10.8 What are the steps involved to make a RMI program ?


    The following steps must be involved in order for a RMI program to work properly:


    +   * Compilation of all source files.

    * Generation of the stubs using rmic.

    * Start the rmireg.

    * Start the RMISServer.

    * Run the client program.


    # 10.9 What is the role of stub in RMI ?


    A stub for a remote object acts as a client''s local representative or proxy for
    the remote object. The caller invokes a method on the local stub, which is responsible
    for executing the method on the remote object. When a stub''s method is invoked,
    it undergoes the following steps:


    +   * It initiates a connection to the JVM containing the remote object.

    * It marshals the parameters to the remote JVM.

    * It waits for the result of the method invocation and execution.

    * It unmarshals the return value or an exception if the method has not successfully
    executed.

    * It returns the value to the caller.


    # 10.10 What is DGC ? And how does it work ?


    DGC stands for Distributed Garbage Collection. Remote Method Invocation (RMI)
    uses DGC for automatic garbage collection. Since RMI involves remote object references
    across JVM''s, garbage collection can be quite difficult. DGC uses a reference
    counting algorithm to provide automatic memory management for remote objects.'
