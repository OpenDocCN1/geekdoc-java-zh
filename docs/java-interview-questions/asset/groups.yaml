    ## Chapter 8


    ## Swing


    ### 8.1 What is the difference between a Choice and a List ?


    A Choice is displayed in a compact format that must be pulled down, in order for
    a user to be able to see the list of all available choices. Only one item may
    be selected from a Choice. A List may be displayed in such a way that several
    List items are visible. A List supports the selection of one or more List items.


    ### 8.2 What is a layout manager ?


    A layout manager is the used to organize the components in a container.


    ### 8.3 What is the difference between a ScrollPane and a JScrollPane ?


    A Scrollbar is a Component, but not a Container. A ScrollPane is a Container.
    A JScrollPane handles its events and performs its own scrolling.


    ### 8.4 Which Swing methods are thread-safe ?


    There are only three thread-methods: repaint, revalidate, and invalidate.


    ### 8.5 Name three Component subclasses that support painting.


    The Canvas, Frame, Panel, and Applet classes support painting.


    ### 8.6 What is clipping ?


    Clipping is defined as the process of confining paint operations to a limited
    area or shape.


    ### 8.7 What is the difference between a MenuItem and a CheckboxMenuItem ?


    The CheckboxMenuItem extends the MenuItem class and supports a menu item that
    may be either checked or unchecked.


    ### 8.8 How are the elements of a BorderLayout organized?


    The elements of a BorderLayout are organized at the borders (North, South, East,
    and West) and the center of a container.


    ### 8.9 How are the elements of a GridItemLayout organized ?


    The elements of a GridBagLayout are organized according to a grid. The elements
    are of different sizes and may occupy more than one row or column of the grid.
    The rows, and columns may have different sizes.


    ### 8.10 What is the difference between a Window and a Frame?


    The Frame extends the Window class and defines a main application window that
    can have a menu bar.


    ### 8.11 What is the relationship between clipping and repainting?


    When a window is repainted by the AWT painting thread, it sets the clipping regions
    to the area of the window that requires repainting.


    ### 8.12 What is the relationship between an event-listener interface and an event-adapter
    class?


    The event-listener interface defines the methods that must be implemented by an
    event handler for a particular event. An event adapter provides a default implementation
    of an event-listener interface.


    ### 8.13 How can a GUI component handle its own events?


    A GUI component can handle its own events, by implementing the corresponding event-listener
    interface and adding itself as its own event listener.


    ### 8.14 What advantage do Java''s layout managers provide over traditional windowing
    systems?


    Java uses layout managers to lay out components in a consistent manner, across
    all windowing platforms. Since layout managers are not tied to absolute sizing
    and positioning, they are able to accommodate platform-specific differences among
    windowing systems.


    ### 8.15 What is the design pattern that Java uses for all Swing components?


    The design pattern used by Java for all Swing components is the Model View Controller
    (MVC) pattern.


    ## Chapter 9


    ## JDBC


    ### 9.1 What is JDBC ?


    JDBC is an abstraction layer that allows users to choose between databases. JDBC
    enables developers to write database applications in Java, without having concern
    themselves with the underlying details of a particular database.


    ### 9.2 Explain the role of Driver in JDBC.


    The JDBC Driver provides vendor-specific implementations of the abstract classes
    provided by the JDBC API. Each driver must provide implementations for the following
    classes of java.sql package: Connection, Statement, PreparedStatement, CallableStatement,
    ResultSet and Driver.


    ### 9.3 What is the purpose of Class.forName method ?


    This method is used to load the driver that will establish a connection to the
    database.


    ### 9.4 What is the advantage of PreparedStatement over Statement ?


    PreparedStatements are precompiled and thus, their performance is much better.
    Also, PreparedStatement objects can be reused with different input values to their
    queries.


    ### 9.5 What is the use of CallableStatement? Name the method, which is used to
    prepare a CallableStatement.


    A CallableStatement is used to execute stored procedures. Stored procedures are
    stored and offered by a database. Stored procedures may take input values from
    the user and return a result. The usage of stored procedures is highly encouraged,
    because it offers security and modularity. The method that prepares a CallableStatement
    is the following: CallableStatement.prepareCall();


    ### 9.6 What does Connection pooling mean ?


    The interaction with a database can be costly, regarding the opening and closing
    of database connections. Especially, when the number of database clients increases,
    this cost is very high and a large number of resources is consumed. A pool of
    database connections is obtained at start up by the application server and is
    maintained in a pool. A request for a connection is served by a connection residing
    in the pool. In the end of the connection, the request is returned to the pool
    and can be used to satisfy future requests.


    ## Chapter 10


    ## Remote Method Invocation (RMI)


    ### 10.1 What is RMI ?


    The Remote Method Invocation (Java RMI) is a Java API that performs the object-oriented
    equivalent of remote procedure calls (RPC), with support for direct transfer of
    serialized classes and distributed garbage collection. Remote Method Invocation
    (RMI) can also be seen as the process of activating a method on a remotely running
    object. RMI offers location transparency because a user feels that a method is
    executed locally.


    ### 10.2 What is the basic principle of RMI ?


    The RMI architecture is based on a very important principle which states the interface
    and the implementation are separate.


    ### 10.3 What are the layers of RMI ?


    The RMI architecture consists of the following layers:


    - Stub and skeleton layer: This layer lies just beneath the interface.

    - Reference Layer: This layer deals with references from clients to the server.

    - Transport layer: This layer is responsible for connecting the JVMs.


    ### 10.4 What is the role of Remote Interface in RMI ?


    The Remote interface serves to identify which methods may be invoked from a non-local
    virtual machine. Any object that is remote must directly or indirectly implement
    this interface.


    ### 10.5 What is the role of java.rmi.Naming ?


    The java.rmi.Naming class provides methods for storing and obtaining references
    to the remote objects. Each method of the Naming class takes a name in URL format
    as arguments.


    ### 10.6 What is meant by binding in RMI ?


    Binding is the process of associating or registering a name for a remote object,
    which can be used at a later time, in order to look up that remote object. A remote
    object can be associated with a name using the bind or rebind methods of Naming
    class.


    ### 10.7 What is the difference between using bind() and rebind() methods of Naming
    Class ?


    The bind method is responsible for binding the specified name to a remote object,
    while the rebind method is responsible for rebinding the specified name to a new
    remote object. In a case binding exists for that name, the binding is replaced.


    ### 10.8 What are the steps involved to make a RMI program ?


    The following steps must be involved in order for a RMI program to work:


    - Compilation of all source files.

    - Generation of stubs using rmic.

    - Start the rmireistry.

    - Start the RMIServer.

    - Run the client program.


    ### 10.9 What is the role of stub in RMI ?


    A stub for a remote object acts as a client''s local representative or proxy for
    the remote object. The caller invokes a method on the local stub, which is responsible
    for executing the method on the remote object. When a stub''s method is invoked,
    it undergoes the following steps:


    - It initiates a connection to the JVM containing the remote object.

    - It marshals the parameters to the remote JVM.

    - It waits for the result of the method invocation and execution.

    - It unmarshals the return value or an exception if the method has not successfully
    executed.

    - It returns the value to the caller.


    ### 10.10 What is DGC ? And how does it work ?


    DGC stands for Distributed Garbage Collection. Remote Method Invocation (RMI)
    uses DGC for automatic garbage collection. Since RMI involves remote object references
    across JVMs, garbage collection can be quite difficult. DGC uses a reference counting
    algorithm to provide automatic memory management for remote objects.

