    Java 面试题


    ## 10.11 问 RMI 中使用 RMISecurityManager 的目的是什么？


    RMISecurityManager 提供了一个可以供使用下载代码的 RMI 应用程序使用的管理器。如果没有设置安全管理器，RMI 的类加载器将不会从远程位置下载任何类。


    ## 10.12 解释序列化（Marshalling）和反序列化（demmarshalling）。


    当应用程序想要将其内存对象跨网络传递到另一个主机，或将其持久化到存储器时，必须将内存表示转换为合适的格式。这个过程被称为序列化，而还原操作被称为反序列化。


    ## 10.13 解释序列化（Serialization）和反序列化（Deserialization）。


    Java 提供了一种名为对象序列化的机制，其中对象可以被表示为字节序列，并包含了对象的数据、对象的类型信息以及对象中存储的数据类型。因此，序列化可以被视为一种扁平化对象的方法，以便将其存储在磁盘上，稍后读取并重建。反序列化是将对象从扁平化状态转换为存活对象的逆过程。


    ## 第 11 章


    ## Servlets


    ## 11.1 什么是 Servlet？


    Servlet 是一种 Java 编程语言类，用于处理客户端请求并生成动态 Web 内容。Servlet 主要用于处理或存储由 HTML 表单提交的数据，提供动态内容，并管理无状态
    HTTP 协议中不存在的状态信息。


    ## 11.2 解释 Servlet 的架构。


    所有 Servlet 必须实现的抽象类是 `javax.servlet.Servlet` 接口。每个 Servlet 必须直接或间接地通过扩展 `javax.servlet.GenericServlet`
    或 `javax.servlet.http.HttpServlet` 来实现它。最后，每个 Servlet 都能使用多线程并行处理多个请求。


    ## 11.3 Applet 和 Servlet 之间有什么区别？


    Applet 是运行在客户端机器 Web 浏览器内部的客户端 Java 程序。相比之下，Servlet 是运行在 Web 服务器上的服务器端组件。Applet
    可以使用用户界面类，而 Servlet 没有用户界面。相反，Servlet 等待客户端的 HTTP 请求，并在每个请求中生成响应。


    ## 11.4 GenericServlet 和 HttpServlet 之间有什么区别？


    GenericServlet 是一种通用的、与协议无关的 Servlet，它实现了 `ServletConfig` 接口。扩展 GenericServlet
    类的 Servlet 应该重写 `service` 方法。最后，为了开发用于 Web 且使用 HTTP 协议处理请求的 HTTP Servlet，你的 Servlet
    必须扩展 `HttpServlet`。此处有 Servlet 示例。


    ## 11.5 解释 Servlet 的生命周期。


    在每个客户端请求时，Servlet 引擎都会加载 Servlet 并调用其 `init` 方法，以初始化 Servlet。然后，Servlet 对象通过为每个请求单独调用
    `service` 方法来处理来自该客户端的所有后续请求。最后，通过调用服务的 `destroy` 方法移除 Servlet。


    Java 面试题


    ## 11.6 `doGet()` 和 `doPost()` 之间有什么区别？


    GET 方法将键值对添加到请求的 URL 中。因此，客户端请求中的字符数量存在限制，随后导致可以使用的值数量受到限制。此外，请求的值是可见的，因此不能通过它传递敏感信息。


    POST 方法超过了 GET 请求施加的限制，将请求的值发送在请求体（body）中。此外，发送的值数量没有限制。最后，通过 POST 请求传递的敏感信息对外部客户端是不可见的。


    ## 11.7 什么是 Web 应用？


    Web 应用是 Web 或应用程序服务器的动态扩展。Web 应用有两种类型：面向演示的面向面向服务的。面向演示的 Web 应用生成交互式 Web 页面，这些页面包含各种类型的标记语言和针对请求的动态内容。相反，面向服务的
    Web 应用实现了 Web 服务的端点。通常情况下，Web 应用可以被视为安装在服务器命名空间特定子集下的 Servlet 集合。


    ## 11.8 什么是服务端包含（SSI）？


    服务端包含 (SSI) 是一种简单的解释型服务器端脚本语言，几乎专门用于 Web，并嵌入 Servlet 中。SSI 最常用的用法是包含文件内容。通常情况下，Web
    应用可以被视为安装在服务器命名空间特定子集下的 Servlet 集合。


    ## 11.9 什么是 Servlet 链（Servlet Chaining）？


    Servlet 链是指将一个 Servlet 的输出发送给第二个 Servlet 方法。第二个 Servlet 的输出发送给第三个，依此类推。最后浏览器接收响应。


    ## 11.10 你如何发现客户端正在发送请求？


    `HttpServlet` 类有用于查找客户端 IP 地址或主机名的函数。`getRemoteAddr()` 返回 IP 地址，`getRemoteHost()`
    获取名称。


    ## 11.11 HTTP 响应的结构是什么？


    HTTP 响应由三部分组成：


    - 状态码：描述响应的状态。它可以用于检查请求是否成功完成。如果请求失败，默认返回状态码 `SC_OK`。

    - HTTP Header：它们包含更多关于响应的信息。例如，头部可能会指定日期/时间。查看如何在 Servlet 中获取头部。

    - 主体：它包含响应的内容。主体可能包含 HTML 代码、图像等。主体由 HTTP 事务中紧随头部传输的字节组成。


    ## 11.12 什么是 Cookie？Session 和 Cookie 之间有什么区别？


    Cookie 是由 Web 服务器发送给浏览器的部分信息。浏览器在本地文件中存储每个 Web 服务器的 Cookie。在未来的请求中，浏览器会随请求发送所有存储的
    Cookie。Session 和 Cookie 的区别如下：


    - 无论客户端浏览器如何设置，Session 都能工作。客户端可能选择了禁用 Cookie。然而，Session 仍然有效，因为客户端无权禁用它们。

    - Session 和 Cookie 在存储信息量也不同。HTTP Session 能够存储任何对象，而 Cookie 只能存储字符串对象。


    ## 11.13 浏览器和 Servlet 使用什么协议进行通信？


    浏览器通过 HTTP 协议与 Servlet 通信。


    ## 11.14 什么是 HTTP 隧道（HTTP Tunneling）？


    HTTP 隧道是一种将使用各种网络协议的通信封装在 HTTP 或 HTTPS 协议中的技术。因此，HTTP 协议充当了被隧道的网络协议用于通信的通道的封装。


    ## 11.15 `sendRedirect` 和 `forward` 方法有什么区别？


    `sendRedirect` 方法创建一个新请求，而 `forward` 方法只是将请求转发到新目标。重定向后，之前的请求作用域对象不可用，因为产生了一个新请求。


    ## 11.16 什么是 URL 编码和 URL 解码？


    URL 编码过程负责将 URL 中的所有空格以及其他额外的特殊字符转换为它们相应的十六进制表示。相应的，URL 解码是完全相反的过程。


