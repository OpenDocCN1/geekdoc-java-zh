    Java Interview Questions


    ## 10.11 What is the purpose of using RMISecurityManager in RMI ?


    RMISecurityManager provides a security manager that can be used by RMI applications,
    which use downloaded code. The class loader of RMI will not download any classes
    from remote locations, if the security manager has not been set.


    ## 10.12 Explain Marshalling and demmarshalling.


    When an application wants to pass its memory objects across a network to another
    host or persist it to storage, the in-memory representation must be converted
    to a suitable format. This process is called marshalling and the revert operation
    is called demmarshalling.


    ## 10.13 Explain Serialization and Deserialization.


    Java provides a mechanism, called object serialization where an object can be
    represented as a sequence of bytes and includes the object''s data, as well as
    information about the object''s type, and the types of data stored in the object.
    Thus, serialization can be seen as a way of flattening objects, in order to be
    stored on disk, and later, read back and reconstituted. Deserialisation is the
    reverse process of converting an object from its flattened state to a live object.


    ## Chapter 11


    ## Servlets


    ## 11.1 What is a Servlet ?


    The servlet is a Java programming language class used to process client requests
    and generate dynamic web content. Servlets are mostly used to process or store
    data submitted by an HTML form, provide dynamic content and manage state information
    that does not exist in the stateless HTTP protocol.


    ## 11.2 Explain the architecture of a Servlet.


    The abstraction that must be implemented by all servlets is the javax.servlet.Servlet
    interface. Each servlet must implement it directly or indirectly, by extending
    javax.servlet.GenericServlet or javax.servlet.http.HttpServlet. Finally, each
    servlet is able to serve multiple requests in parallel using multithreading.


    ## 11.3 What is the difference between an Applet and a Servlet ?


    An Applet is a client-side java program that runs within a Web browser on the
    client machine. On the other hand, a servlet is a server side component that runs
    on the web server. An applet can use the user interface classes, while a servlet
    does not have a user interface. Instead, a servlet waits for client''s HTTP requests
    and generates a response in every request.


    ## 11.4 What is the difference between GenericServlet and HttpServlet ?


    GenericServlet is a generalized and protocol-independent servlet that implements
    the ServletConfig interfaces. Those servlets extending the GenericServlet class
    shall override the service method. Finally, in order to develop an HTTP servlet
    for use on the Web that serves requests using the HTTP protocol, your servlet
    must extend the HttpServlet instead. Servlet examples here.


    ## 11.5 Explain the life cycle of a Servlet.


    On every client''s request, the Servlet Engine loads the servlet and invokes its
    init methods, in order for the servlet to be initialized. Then, the Servlet object
    handles all subsequent requests coming from that client, by invoking the service
    method for each request separately. Finally, the servlet is removed by calling
    the service''s destroy method.


    Java Interview Questions


    ## 11.6 What is the difference between doGet() and doPost() ?


    The GET method appends the name-pairs to the request''s URL. Thus, there is a
    limit on the number of characters and subsequently on the number of values that
    can be used in a client''s request. Furthermore, the values of the request are
    made visible and thus, sensitive information must not be passed in that.


    The POST method exceeds the limit imposed by the GET request, sending the values
    of the request inside its body. Also, there is no limitations on the number of
    values to be sent across. Finally, the sensitive information passed through a
    POST request is not visible to an external client.


    ## 11.7 What is meant by a Web Application ?


    A Web application is a dynamic extension of a Web or application server. There
    are two types of web applications: presentation-oriented and service-oriented.
    A presentation-oriented Web application generates interactive web pages, which
    contain various types of markup language and dynamic content to requests. On the
    other hand, a service-oriented web application implements the endpoint of a web
    service. In general, a Web application can be seen as a collection of servlets
    installed under a specific subset of the server''s namespace.


    ## 11.8 What is a Server Side Include (SSI) ?


    Server Includes (SSI) is a simple interpreted server-side scripting language,
    used almost exclusively for the Web, and embedded with a servlet. The most frequent
    use of SSI is to include the content of files. In general, a Web application can
    be seen as a collection of servlets installed under a specific subset of the server''s
    namespace.


    ## 11.9 What is Servlet Chaining ?


    Servlet Chaining is the method where the output of one servlet is sent to a second.
    The output of the second servlet is sent to a third, and so on. The browser receives
    the response.


    ## 11.10 How do you find out client is making a request ?


    The HttpServlet class has functions for finding out the IP address or host name
    of the client. getRemoteAddr() returns the IP address and getRemoteHost() gets
    the name.


    ## 11.11 What is the structure of HTTP response ?


    The HTTP response consists of three parts:


    - Status Code: describes the status of response. It can be used to check if the
    request has successfully completed. If the request failed, the status code SC_OK
    is returned by default.

    - HTTP Headers: they contain more information about the response. For example,
    the headers may specify the date/time. See how to retrieve headers in Servlet.

    - Body: it contains the content of the response. The body may contain HTML code,
    an image, etc. The body consists of the bytes transmitted in an HTTP transaction
    immediately following the headers.


    ## 11.12 What is a cookie ? What is the difference between session and cookie
    ?


    A cookie is a bit of information that the Web server sends to the browser. The
    browser stores the cookies for each Web server in a local file. In a future request,
    the browser, along with the request, sends all stored cookies for specific server.
    The differences between session and cookie are the following:


    - The session should work, regardless of the settings on the client browser. The
    client may have chosen to disable cookies. However, the sessions still work, as
    the client has no ability to disable them in the server side.

    - The session and cookies also differ in the amount of information one can store.
    The HTTP session is capable of storing any object, while a cookie can only store
    String objects.


    ## 11.13 Which protocol will be used by browser and servlet to communicate ?


    The browser communicates with a servlet by using the HTTP protocol.


    ## 11.14 What is HTTP Tunneling ?


    HTTP Tunneling is a technique by which communications performed using various
    network protocols are encapsulated using the HTTP or HTTPS protocols. The HTTP
    protocol therefore acts as a wrapper for a channel that the network protocol being
    tunneled uses to communicate. The masking of other protocol requests as HTTP requests
    is HTTP Tunneling.


    ## 11.15 What''s the difference between sendRedirect and forward methods ?


    The sendRedirect method creates a new request, while the forward method just forwards
    a request to a new target. The previous request scope objects are not available
    after a redirect, because it results in a new request. On the other hand, the
    previous request scope objects are available after forwarding.


    ## 11.16 What is URL Encoding and URL Decoding ?


    The URL encoding procedure is responsible for replacing all the spaces and every
    other extra special character of a URL, into their corresponding Hex representation.
    In correspondence, URL decoding is the exact opposite procedure.

