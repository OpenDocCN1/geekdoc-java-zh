    ## 第 12 章


    ## JSP


    ### 12.1 什么是 JSP 页面？


    Java Server Page（JSP）是一种包含两种类型文本的文档：静态数据和 JSP 元素。静态数据可以用任何基于文本的格式表示，例如 HTML 或
    XML。JSP 是一种将静态内容与动态生成内容混合在一起的技术。在此处查看 JSP 示例。


    ### 12.2 如何处理 JSP 请求？


    当 JSP 请求到达时，浏览器首先请求一个扩展名为 .jsp 的页面。然后，Web 服务器读取该请求并使用 JSP 编译器将 JSP 转换为 servlet
    类。请注意，JSP 文件仅在页面的首次请求时或当 JSP 文件发生变化时进行编译。随后会调用生成的 servlet 类来处理浏览器的请求。请求执行完成后，servlet
    就会向客户端发送响应。查看如何在 JSP 中获取请求参数（Request parameters）。


    ### 12.3 JSP 有哪些优势？


    使用 JSP 技术的优势如下所示：


    -   JSP 页面被动态编译为 servlet，开发者可以轻松地对演示代码进行更新。

    -   JSP 页面可以进行预编译。

    -   JSP 页面可以很容易与静态模板（包括 HTML 或 XML 片段）以及生成动态内容的代码结合。

    -   开发者可以提供自定义的 JSP 标签库，页面作者可以使用类似于 XML 的语法访问这些标签库。

    -   开发者可以在组件级别进行逻辑更改，而无需编辑使用应用程序逻辑的单个页面。


    ### 12.4 什么是指令（Directives）？JSP 中提供了哪些类型的指令？


    指令是 JSP 页面编译为 servlet 时由 JSP 引擎处理的指令。指令用于设置页面级指令、从外部文件插入数据以及指定自定义标签库。指令定义在 `<%
    ... %>` 之间。不同类型的指令如下所示：


    -   Include directive（包含指令）：用于包含文件并将文件内容与当前页面合并。

    -   Page directive（页面指令）：用于在 JSP 页面中定义特定属性，例如错误页面（error page）和缓冲区（buffer）。

    -   Taglib：用于声明页面使用的标签库。


    ### 12.5 什么是 JSP 动作（actions）？


    ### Java 面试题


    JSP 动作使用 XML 语法结构来控制 servlet 引擎的行为。JSP 动作在请求 JSP 页面时执行。它们可以动态插入文件、重用 JavaBeans
    组件、将用户转发到另一个页面，或为 Java 插件生成 HTML。某些可用动作列如下：


    -   jsp:include：在请求 JSP 页面时包含一个文件。

    -   jsp:useBean：查找或实例化一个 JavaBean。

    -   jsp:setProperty：设置 JavaBean 的属性。

    -   jsp:getProperty：获取 JavaBean 的属性。

    -   jsp:forward：将请求者转发到新页面。

    -   jsp:plugin：生成特定浏览器的代码。


    ### 12.6 什么是脚本段（Scriptlets）？


    在服务器页面（JSP）技术中，脚本段是嵌入在 JSP 页面中的 Java 代码段。脚本段是标签内的所有内容。在这些标签之间，用户可以添加任何有效的脚本段。


    ### 12.7 什么是声明（Decarations）？


    声明类似于 Java 中的变量声明。声明用于声明变量，供后续在表达式（expressions）或脚本段中使用。要添加声明，必须使用特定的序列来包裹你的声明。


    ### 12.8 什么是表达式（Expressions）？


    JSP 表达式用于将语言表达式的值（转换为字符串）插入到 Web 服务器返回给客户端的数据流中。表达式定义在 `<% = ... %>` 标签之间。


    ### 12.9 什么是隐式对象（implicit objects），它们是什么？


    JSP 隐式对象是 JSP 容器在每个页面中为开发者提供的对象。开发者可以直接调用它们，而无需显式声明。JSP 隐式对象也被称为预定义变量。以下对象在 JSP
    页面中被视为隐式：


    -   application

    -   page

    -   request

    -   response

    -   session

    -   exception

    -   out

    -   config

    -   pageContext


    '
