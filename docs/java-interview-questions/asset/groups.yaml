    ## 4.15 What are some of the best practices relating to the Java Collection framework
    ?


    - Choosing the right type of the collection to use, based on the application''s
    needs, is very crucial for its performance. For example if the size of the elements
    is fixed and known a priori, we shall use an Array, instead of ArrayList.


    - Some collection classes allow us to specify their initial capacity. Thus, if
    we have an estimation of the number of elements that will be stored, we can use
    it to avoid resizing.


    - Always use Generics for type-safety, readability and robustness. Also, by using
    Generics we avoid the ClassCastException during runtime.


    - Use immutable classes provided by the Java Development Kit (JDK) as a key in
    a Map, in order to avoid the implementation of the hashCode and equals methods
    for our custom class.


    - Program in terms of interface not implementation.


    - Return zero-length collections or arrays as opposed to returning a null in case
    the underlying collection is actually empty.


    ## 4.16 What is the difference between Enumeration and Iterator interfaces ?


    Enumeration is voice as fast as compared to an Iterator and uses very less memory.
    However, the Iterator is much safer compared to Enumeration, because other threads
    are not able to modify the collection object that is currently traversed by the
    iterator. Also, Iterators allow the caller to remove elements from the underlying
    collection, something which is not possible with Enumerations.


    ## 4.17 What is the difference between HashSet and TreeSet ?


    The HashSet is implemented using a hash table and thus, its elements are not ordered.
    The add, remove, and contains methods of a HashSet have constant time complexity
    O(1). On the other hand, a TreeSet is implemented using a tree structure. The
    elements in a TreeSet are sorted, the add, remove, and contains methods have time
    complexity of O(log n).


    The JVM has a heap that is the runtime area from which all class instances and
    arrays are allocated. It is created at the JVM start-up. Heap memory for objects
    is reclaimed by an automatic memory management system which is known as a garbage
    collector. Heap memory consists of live and dead objects. Live objects are accessible
    by the application and will not be a subject of garbage collection. Dead objects
    are those which will never be accessible by the application, but have not been
    collected by the garbage collector yet. Such objects occupy the heap space until
    they are eventually collected by the garbage collector.


    ## 5.6 What is the difference between Serial and Throughput Garbage collector
    ?


    The throughput garbage collector uses a parallel version of the young generation
    collector and is meant to be used with applications that have medium to large
    data sets. On the other hand, the serial collector is usually adequate for most
    small applications (those requiring heaps of up to approximately 100MB on modern
    processors).


    ## 5.7 When does an Object becomes eligible for Garbage collection in Java ?


    A Java object is subject to garbage collection when it becomes unreachable to
    the program in which it is currently used.


    ## 5.8 Does Garbage collection occur in permanent generation space in JVM ?


    Garbage Collection does occur in PermGen space and if PermGen space is full or
    cross a threshold, it can trigger a full garbage collection. If you look carefully
    at the output of the garbage collector, you will find that PermGen space is also
    garbage collected. This is the reason why correct sizing of PermGen space is important
    to avoid frequent full garbage collections. Also check our article Java 8: PermGen
    to Metaspace.


    ## Chapter 6


    ### Exception Handling


    ## 6.1 What are the two types of Exceptions in Java ? Which are the differences
    between them ?


    Java has two types of exceptions: checked exceptions and unchecked exceptions.
    Unchecked exceptions do not need to be declared in a method or a constructor''s
    throws clause, if they can be thrown by the execution of the method or the constructor,
    and propagate outside the method or constructor boundary. On the other hand, checked
    exceptions must be declared in a method or a constructor''s throws clause. See
    here for tips Java exception handling.


    ## 6.2 What is the difference between Exception and Error in java ?


    Error classes are both subclasses of the Throwable class. The Exception class
    is used for exceptional conditions that a user''s program should catch. The Error
    class defines exceptions that are not expected to be caught by the user program.


    ## 6.3 What is the difference between throw and throws ?


    The throw keyword is used to explicitly raise a exception within the program.
    On the contrary, the throws clause is used to indicate that exceptions are not
    handled by a method. Each method must specify which exceptions does not handle,
    so the callers of that method can guard against possible exceptions. Finally,
    multiple exceptions are separated by a comma.


    ## 6.4 What is the importance of finally block in exception handling ?


    A finally block will always be executed, whether or not an exception is actually
    thrown. Even in the case where the catch statement is missing and an exception
    is thrown, the finally block will still be executed. Last thing to mention is
    that the finally block is used to release resources I/O buffers, database connections,
    etc.


    ## 6.5 What will happen to the Exception object after exception handling ?


    The Exception object will be garbage collected in the next garbage collection.


    ## 6.6 How does finally block differ from finalize() method ?


    A finally block will be executed whether or not an exception is thrown and is
    used to release those resources held by the application. Finalize is a protected
    method of the Object class, which is called by the Java Virtual Machine (JVM)
    just before an object is garbage collected.


    ## Chapter 7


    ### Java Applets


    ## 7.1 What is an Applet ?


    An applet is a Java program that can be embedded in an HTML page and executed
    within a browser.


    ## 7.2 Explain the life cycle of Applet.


    An applet may undergo the following states:

    - Init: An applet is initialized.

    - Start: Begin the execution of the applet.

    - Stop: Stop the execution of the applet.

    - Destroy: Perform final cleanup before unloading the applet.


    ## 7.3 What happens when an applet is loaded ?


    First of all, an instance of the applet is created. Then, the applet initializes.


    ## 7.4 What is the difference between Applet and Java Application ?


    Applets are executed within a java browser, but a Java application is a standalone
    program that can be executed outside a browser. Furthermore, both require the
    Java Virtual Machine. Javalets typically use restrictive security, while Java
    applications use more relaxed policies.


    ## 7.5 What are the restrictions imposed on Javalets ?


    Mostly by security reasons, the following restrictions are imposed on Javalets:

    - An applet cannot load libraries or define native methods.

    - An applet cannot read certain system properties.

    - An applet cannot make network connections except to the host it came from.

    - An applet cannot start any program on the host that''s executing it.


    ## 7.6 What are untrusted applets ?


    Untrusted applets are Java applets that cannot access local system files. By default,
    all downloaded applets are considered untrusted.


    ## 7.7 What is the difference between applets loaded over the internet and applets
    loaded via the file system ?


    Regarding the case where an applet is loaded over the internet, the applet is
    loaded by the applet classloader and subject to the restrictions enforced by the
    applet security manager. Regarding the case where an applet is loaded from the
    client''s disk, the applet is loaded by the file system loader. Applets loaded
    via the file system are allowed to read files, write files and to load libraries
    on the client. However, they are not passed through the verifier.


    ## 7.8 What is the applet class loader, and what does it do ?


    When an applet is loaded over the internet, the applet is loaded by the applet
    classloader. The class loader enforces the Java namespace. Also, the class loader
    guarantees a unique namespace for classes that come from the local file system,
    and that a unique namespace exists for each network source. When a browser loads
    an applet over the net, that applet''s classes are placed in a private namespace
    associated with the applet''s origin. Then, those classes loaded by the class
    loader are passed through the verifier.


    ## 7.9 What is the applet security manager, and what does it provide ?


    The applet security manager is a mechanism to impose restrictions on Java apps.
    A browser may only have one security manager. The security manager is established
    at startup, and it cannot thereafter be replaced, overloaded, overridden, or extended.

