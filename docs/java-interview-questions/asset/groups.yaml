    # 第3章


    # Java 线程


    ## 3.1 进程和线程之间有什么区别？


    进程是程序的执行，而线程是进程内部的单一执行序列。一个进程可以包含多个线程。线程有时被称为轻量级进程。


    ## 3.2 解释创建线程的不同方式。你更倾向于使用哪种？为什么？


    创建线程有三种方式可以实现：


    -   一个类可以继承 `Thread` 类。

    -   一个类可以实现 `Runnable` 接口。

    -   应用程序可以使用 `Executor` 框架来创建线程池。


    通常优选 `Runnable` 接口，因为它不需要对象继承 `Thread` 类。如果你的应用程序设计需要多重继承，只有接口可以为你提供帮助。此外，线程池非常高效，且非常容易实现和使用。


    ## 3.3 高层地解释可用的线程状态。


    在执行过程中，线程可能处于以下状态之一：


    -   就绪（Runnable）：线程已准备好运行，但并不一定立即启动。

    -   运行（Running）：处理器正在积极执行线程代码。

    -   等待（Waiting）：线程处于阻塞状态，等待某些外部处理完成。

    -   睡眠（Sleeping）：线程被强制休眠。

    -   I/O 阻塞（Blocked on I/O）：等待 I/O 操作完成。

    -   同步阻塞（Blocked on Synchronization）：等待获取锁。

    -   死亡（Dead）：线程已完成执行。


    ## 3.4 同步方法（synchronized method）和同步块（synchronized block）之间有什么区别？


    在 Java 编程中，每个对象都有一个锁。线程可以通过 `synchronized` 关键字获取对象的锁。`synchronized` 关键字可以应用于方法级别（粗粒度锁）或代码块级别（细粒度锁）。


    ## 3.5 监视器（monitor）内部是如何同步？你可以应用哪些级别的同步？


    JVM 使用锁结合监视器工作。监视器本质上是一个守护者，监控一段同步代码并确保同一时间只有一个线程执行同步代码。每个监视器都与一个对象引用关联。在获取锁之前，线程不允许执行代码。


    ## 3.6 什么是死锁？


    当两个进程在继续之前互相等待对方完成时发生的条件。结果是两个进程都无休等待。


    ## 3.7 如何确保 N 个线程可以访问 N 个资源而不产生死锁？


    在使用 N 个线程时避免死锁的一种简单方法是为锁施加顺序，并强制每个线程遵循该顺序。因此，如果所有线程按照相同的顺序锁定和解锁互斥锁，就不会产生死锁。


    # 第4章


    # Java 集合（Collections）


    ## 4.1 Java 集合框架的基础接口有哪些？


    Java 集合框架提供了一组设计良好的接口和类，支持对对象集合进行操作。Java 集合框架中最基础的接口是：


    -   `Collection`：表示一组被称为“元素”的对象。

    -   `Set`：一种不能包含重复元素的集合。

    -   `List`：一种有序集合，可以包含重复元素。

    -   `Map`：一种将键映射到值的对象，不能包含重复的键。


    ## 4.2 为什么 Collection 没有扩展 `Cloneable` 和 `Serializable` 接口？


    `Collection` 接口指定了一组被称为元素的对象。`Collection` 的每个具体实现都可以选择自己的自己的维护和排序元素的方式。某些集合允许重复键，而另一些不允许。在处理实际实现时，克隆或序列化的语义和影响会起作用。因此，集合的具体实现应该决定它们如何可以被克隆或序列化。


    ## 4.3 什么是迭代器（Iterator）？


    `Iterator` 接口提供了许多方法，能够遍历任何 Java `Collection`。集合包含一个返回 `Iterator` 实例的迭代器。迭代器能够在迭代期间从底层集合中删除元素。


    ## 4.4 Iterator 和 ListIterator 之间有什么区别？


    这些元素的区别列举如下：


    -   `Iterator` 可以用于遍历 `Set` 和 `List` 集合，而 `ListIterator` 只能用于遍历 `List`。

    -   `Iterator` 只能正向遍历集合，而 `ListIterator` 可以双向遍历 `List`。

    -   `ListIterator` 实现了 `Iterator` 接口并包含了额外功能，如添加元素、替换元素、获取前一个后续元素的索引位置等。


    ## 4.5 快速失败（fail-fast）和安全失败（fail-safe）有什么区别？


    迭代器的快速失败属性与底层集合的副本一起工作，因此不受受集合中任何修改的影响。`java.util` 包中的所有集合都是快速失败的，而 `java.util.concurrent`
    中的集合类是安全失败的。快速失败迭代器抛出 `ConcurrentModificationException`，而安全失败迭代器永远不会抛此类异常。


    ## 4.6 HashMap 在 Java 中是如何工作的？


    `HashMap` 存储键值对。`HashMap` 需要一个哈希函数并使用 `hashCode` 来分别从集合中放入和检索元素。当调用方法时，`HashMap`
    计算键的值并将其存储在集合内部相应的索引中。如果键存在，则用新值更新。`HashMap` 的一些重要特性是它的容量、负载因子和阈值重置。


    ## 4.7 hashCode() 和 equals() 方法的重要性是什么？


    在 Java 中，`HashMap` 使用 `hashCode` 和 `equals` 方法来确定键值对的索引并检测重复。具体来说，`hashCode` 方法用于确定指定键的位置。由于不同的键可能会产生相同的值，因此使用
    `equals` 方法来确定键是否真实存在于集合中。`HashMap` 的重要性在于。


    ## 4.8 HashMap 和 Hashtable 之间有什么区别？


    `HashMap` 允许空键，而 `Hashtable` 不允许。`HashMap` 不是线程安全的，而 `Hashtable` 是线程安全的。`HashMap`
    允许空值，而 `Hashtable` 不允许。`HashMap` 是非同步的，而 `Hashtable` 是同步的。`HashMap` 的性能通常比 `Hashtable`
    好。


    ## 4.9 ArrayList 和 LinkedList 之间有什么区别？


    `ArrayList` 和 `LinkedList` 的区别如下：


    -   `ArrayList` 是数组支持的，而 `LinkedList` 是链表支持的。

    -   `ArrayList` 提供随机访问，复杂度为 O(1)，而 `LinkedList` 的访问复杂度为 O(n)。

    -   `ArrayList` 在插入和删除操作上较慢，而 `LinkedList` 在这些方面更快。


    ## 4.10 Comparable 和 Comparator 接口是什么？


    Java  `Comparable` 接口包含一个方法 `compareTo()`。该方法比较两个对象以施加顺序。具体来说，它返回一个负整数、零或正整数，指示对象小于或大于。


    Java  `Comparator` 接口包含两个方法 `compare` 和 `equals`。第一个方法比较输入参数并施加顺序。它返回一个负整数、零或正整数，指示第一个参数小于或大于第二个参数。第二个方法在对象相等时返回
    true。


    ## 4.11 什么是 Java 优先级队列（Priority Queue）？


    `PriorityQueue` 是一个无界队列，基于优先级堆，元素按自然顺序排序。在创建时，我们可以提供一个 `Comparator` 来负责 `PriorityQueue`
    元素的排序。`PriorityQueue` 不允许空值、那些未提供自然排序的对象或未关联任何比较器的对象。最后，`PriorityQueue` 不是线程安全的，入队和出队操作复杂度为
    O(log(n))。


    ## 4.12 你对大 O 符号了解多少？可以针对不同的数据结构给出例子吗？


    大 O 符号简单地描述了算法随着数据量增加如何扩展或执行。大 O 符号也可以用于描述其他行为，例如内存消耗。由于集合类是实际的数据结构，我们通常使用大 O
    符号来权衡时间、内存并选择最佳实现。


