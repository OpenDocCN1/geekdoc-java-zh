    # 前言


    在本指南中，我们将讨论 Java 面试中可能使用的不同类型的问题，以便雇主测试你对 Java 以及通用面向对象编程的技能。


    在接下来的章节中，我们将讨论面向对象编程及其特性、关于 Java 及其功能的通用问题、Java 集合（Collections）、垃圾回收器、异常处理、Java
    Applets、Swing、JDBC、远程方法调用（RMI）、Servlets 和 JSP。


    # 关于作者


    Sotirios-Efstathios (Stathis) Maneas 是雅典国立和卡波迪斯特里安大学信息科学与电信系的一名研究生。他的主要兴趣领域包括分布式系统、网络爬虫、模型检查（model
    checking）、操作系统、编程语言和 Web应用程序。


    # 第1 章


    ## 面向对象编程 (OOP)


    Java 是一种并发的、基于类的且面向对象的编程语言。面向对象软件开发的优势如下所示：


    - 代码的模块化开发，易于维护和修改。

    - 代码的可重用性。

    - 提高代码的可靠性和灵活性。

    - 增强了对代码的理解。


    面向对象编程包含许多重要特性，例如**封装、继承、多态**和**抽象**。我们在接下来的章节中分别分析每个特性。


    ### 1.1 封装


    封装提供了对象隐藏其内部特征和行为的能力。每个对象提供若干方法，其他对象可以访问这些方法并更改其内部数据。在 Java 中，有三种访问修饰符：public（公共）、private（私有）和
    protected（保护）。每个修饰符对其他类（无论是在相同包内还是外部包中）施加不同的访问权限。使用封装的一些优点列举如下：


    - 每个对象的内部状态通过隐藏其属性受到保护。

    - 它增加了代码的可用性和可维护性，因为对象的行为可以独立地更改或扩展。

    - 通过防止对象之间以非预期的方式相互作用，提高了模块化程度。


    你可以参考我们的[此处](#)教程来获取有关封装的更多细节和示例。


    ### 1.2 多态


    多态是编程语言为不同的底层数据类型呈现相同接口的能力。多态类型是一种其操作也可以应用于某些其他类型的类型。


    ### 1.3 继承


    继承提供了对象获取另一个类（称为基类）的字段和方法的能力。继承提供了代码的重用性，并可用于在不修改现有类的情况下向其添加额外功能。


    ### 1.4 抽象


    抽象是将思想从特定实例中分离出来的过程，因此根据类自身的功能来开发类，而不是根据其实现细节。Java 支持抽象类的创建和存在，这些类暴露了接口，但不包含所有方法的实际实现。抽象技术旨在将类的实现细节与其行为分离开。


    ### 1.5 抽象与封装之间的区别


    抽象和封装是互补的概念。一方面，抽象侧重于对象的行为。另一方面，封装侧重于对象行为的实现。封装通常通过隐藏对象内部状态的信息来实现，因此可以看作是用于提供抽象的策略。


    # 第2 章


    ## 关于 Java 的通用问题


    ### 2.1 什么是 JVM？为什么 Java 被称为平台无关编程语言？


    虚拟机（JVM）是一个可以执行 Java 字节码的进程虚拟机。每个 Java 源文件都会被编译成字节码文件，然后由 JVM 执行。Java 的设计目的是允许构建可以在任何平台上运行的应用程序，而不需要程序员为每个平台重新编写或重新编译。虚拟机使得这一切成为可能，因为它能够感知底层硬件平台的特定指令长度和其他特性。


    ### 2.2 JDK 和 JRE 有什么区别？


    Java 运行时（JRE）基本上是你的 Java 程序运行的 Java 虚拟机（JVM）。Java 开发工具包（JDK）包含了 JRE 以及其他工具。


    ### 2.3 “static”关键字意味着什么？


    static 关键字表示该成员或方法属于类，而不是实例。在 Java 中可以重写静态方法吗？


    ### 2.4 可以访问静态变量吗？


    静态变量在类加载时进行初始化。在这种情况下，子类也必须被声明为抽象的。


    ### 2.5 Java 支持哪些数据类型？什么是自动装箱和拆箱？


    Java 支持的原始类型包括：


    - byte

    - short

    - int

    - long

    - float

    - double

    - boolean

    - char


    自动装箱是原始类型与其对应的包装类之间的自动转换。例如，将 int 转换为 Integer，反之则称为自动拆箱。


    ### 2.6 Java 中的方法重写和重载有什么区别？


    方法重载发生在同一个类中，多个方法具有相同的方法但参数不同。另一方面，方法重写定义为子类定义了与父类相同的方法。


    ### 2.7 什么是构造函数？Java 中的构造函数重载


    构造函数在创建新对象时被调用。如果没有为类提供构造函数，Java 会创建一个默认构造函数。构造函数重载类似于方法重载。每个构造函数都有自己的参数列表。


    ### 2.8 Java 支持多重继承吗？


    Java 不多重继承。每个类只能扩展一个类，但可以实现多个接口。


    ### 2.9 接口（Interface）和抽象类（Abstract class）的区别是什么？


    Java 提供并支持抽象类和接口。两者共享某些特性，但在以下方面不同：


    - 接口中的所有方法都是隐式抽象的。


    # Java 面试题


    - 类可以实现多个接口，但只能扩展一个抽象类。

    - 为了让类实现接口，必须实现其所有声明的方法。然而，类也可以不实现抽象类的所有声明方法，在这种情况下，子类也必须被声明为抽象的。

    - 抽象类可以实现接口而无需提供方法的实现。

    - Java 接口中的变量默认是 final 的。抽象类可以包含非 final 变量。

    - Java 接口的成员默认是 public 的。抽象类的成员可以是 private、protected 或 public。

    - 接口是绝对抽象的，不能实例化。抽象类也不能实例化，但如果它包含 main 方法则可以调用。


    另查看 JDK 8 中抽象类和接口的差异。


    ### 2.10 什么是引用传递和按值传递？


    当对象按值传递时，意味着传递的是对象的副本。因此，即使对该对象进行更改，也不会影响原始值。当对象按引用传递时，传递的不是实际对象，而是对象的引用。因此，外部方法所做的任何更改都会反映在所有地方。


