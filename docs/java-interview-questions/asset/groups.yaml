    - 2.4 可以在静态环境中访问非静态变量吗？ 3

    - 2.5 Java 支持哪些数据类型？什么是自动装箱和自动拆箱？ 4

    - 2.6 Java 中的方法重写（Overriding）和重载（Overloading）是什么？ 4

