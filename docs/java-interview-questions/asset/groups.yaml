    - 2.8 Java 支持多继承吗？ 4

    - 2.9 接口（Interface）和抽象类（Abstract class）之间的区别是什么？ 4

    - 2.10 引用传递和值传递是什么？ 5

    - 3 Java 线程 6

    - 3.1 进程和线程之间有什么区别？ 6

    - 3.2 解释创建线程的不同方式。你更倾向于哪种？为什么？ 6

    - 3.3 高层次解释可用的线程状态。 6

    - 3.4 同步方法（synchronized method）和同步块（synchronized block）之间有什么区别？ 7

    - 3.5 监视器（monitor）内部是如何发生同步的？你可以应用哪些级别的同步？ 7

    - 3.6 什么是死锁？ 7

    - 3.7 你如何确保 N 个线程可以访问 N 个资源而不产生死锁？ 7


    # 8 Java 集合


    - 4.1 Java 集合框架的基础接口有哪些？ 8

    - 4.2 为什么 Collection 没有继承 Cloneable 和 Serializable 接口？ 8

    - 4.3 什么是 Iterator？ 8

    - 4.4 Iterator 和 ListIterator 之间有什么区别？ 9

    - 4.5 快速失败（fail-fast）和安全失败（fail-safe）之间的区别是什么？ 9

    - 4.6 HashMap 在 Java 中是如何运作的？ 9

    - 4.7 hashCode() 和 equals() 方法的重要性是什么？ 9

    - 4.8 HashMap 和 Hashtable 之间有什么区别？ 9

    - 4.9 Array 和 ArrayList 之间有什么区别？你会在什么情况下用 Array 而不是 ArrayList？ 9

    - 4.10 ArrayList 和 LinkedList 之间有什么区别？ 10

    - 4.11 什么是 Comparable 和 Comparator 接口？列出它们的区别。 10

    - 4.12 什么是 Java Priority Queue（优先级队列）？ 10

    - 4.13 你对大 O 表示法了解多少？能针对不同的数据结构给出一些例子吗？ 10

    - 4.14 使用无序数组相比无序数组的权衡是什么？ 10

    - 4.15 关于 Java 集合框架的一些最佳实践有哪些？ 11

    - 4.16 Enumeration 接口和 Iterator 之间有什么区别？ 11

    - 4.17 HashSet 和 TreeSet 之间有什么区别？ 11


    # 12 垃圾回收器


    - 5.1 Java 中垃圾回收的目的是什么？什么时候使用？ 12

    - 5.2 System.gc() 和 Runtime.gc() 方法的作用是什么？ 12

    - 5.3 finalize() 什么时候被调用？最终化的目的是什么？ 12

    - 5.4 如果一个对象被置为 null，垃圾回收器会立即释放该对象占用的内存吗？ 12

    - 5.5 Java 堆（Heap）的结构是什么？堆中的 Perm Gen space（永久代空间）是什么？ 12

    - 5.6 序列化（Serial）垃圾回收器和吞吐量（Throughput）垃圾回收器有什么区别？ 13

    - 5.7 Java 中的对象何时会变成可垃圾回收的状态？ 13

    - 5.8 JVM 的永久代（permanent generation space）中会发生垃圾回收吗？ 13


    # 14 异常处理


    - 6.1 Java 中哪两种类型的异常？它们之间有什么区别？ 14

    - 6.2 Java 中 Exception 和 Error 之间有什么区别？ 14

    - 6.3 throw 和 throws 之间有什么区别？ 14

    - 6.4 finally 块在异常处理中的重要性是什么？ 14

    - 6.5 异常处理后，异常对象会发生什么？ 14

    - 6.6 finally 和 finalize() 方法有什么不同？ 15


