  md: '# Chapter 10


    # Remote Method Invocation (RMI)


    # 10.1 What is RMI ?


    The Remote Method Invocation (Java RMI) is a Java API that performs the object-oriented
    equivalent of remote procedure calls (RPC), with support for direct transfer of
    serialized classes and distributed garbage collection. Remote Method Invocation
    (RMI) can also be seen as the process of activating a method on a remotely running
    object. RMI offers location transparency because a user feels that a method is
    executed on a locally running object. Check some RMI Tips here.


    # 10.2 What is the basic principle of RMI architecture ?


    The RMI architecture is based on a very important principle which states the definition
    of the behavior and the implementation of behavior are separate concepts. RMI
    allows the code that defines the behavior and the code that implements the behavior
    to remain separate and to run on separate JVMs.


    # 10.3 What are the layers of RMI Architecture ?


    The RMI skeleton consists of the following layers:


    +   * Stub and skeleton layer: This layer lies just beneath the view of the developer.
    This layer is responsible for intercepting method calls by the client to the interface
    and redirect these calls to a RMI Service.


    +   * Reference Layer: The second layer of the RMI architecture deals with the
    interpretation of references made from the client to the server''s objects. This
    layer interprets and manages references from clients to the remote service objects.
    The connection is a one-to-one (unicast) link.


    +   * Transport layer: This layer is responsible for connecting the two JVM participating
    in the service. This layer is based on TCP/IP connections between machines in
    the network. It provides basic connectivity, as well as some firewall penetration
    strategies.


    # 10.4 What is the role of Remote Interface in RMI ?


    The Remote interface serves to identify which methods may be invoked from a non-local
    virtual machine. Any object that is a remote object must directly or indirectly
    implement this interface. A class that implements a remote interface should declare
    the remote interfaces being implemented, define the constructor for each remote
    object and provide an implementation for each remote method in all remote interfaces.'
