  md: '# Chapter 7


    # Java Applets


    # 7.1 What is an Applet ?


    A java applet is program that can be included in a HTML page and be executed in
    a java enabled client browser. Applets are used for creating dynamic and interactive
    web applications.


    # 7.2 Explain the life cycle of an Applet.


    An applet may undergo the following states:


    +   - Init: An applet is initialized each time it is loaded.

    - Start: Begin the execution of an applet.

    - Stop: Stop the execution of an applet.

    - Destroy: Perform a final cleanup, before unloading the applet.


    # 7.3 What happens when an applet is loaded ?


    First of all, an instance of the applet''s controlling class is created. Then,
    the applet initializes itself and finally, it starts running.


    # 7.4 What is the difference between an Applet and a Java Application ?


    Applets are executed within a java enabled browser, but a Java application is
    a standalone Java program that can be executed outside of a browser. However,
    they both require the existence of a Java Virtual Machine (JVM). Furthermore,
    a Java application requires a main method with specific signature, in order to
    start its execution. Finally, Java applets don''t need such a method to start
    their execution. Java applets typically use a restrictive security policy, while
    Java applications usually use more relaxed security policies.


    # 7.5 What are the restrictions imposed on Java applets ?


    Mostly by security reasons, the following restrictions are imposed on Java applets:


    +   - An applet cannot load libraries or define native methods.'
