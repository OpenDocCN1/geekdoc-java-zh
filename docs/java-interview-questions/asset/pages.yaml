  md: 'Java Interview Questions


    # 11.6 What is the difference between doGet() and doPost() ?


    The GET method appends the name-pairs to the request''s URL. Thus, there is a
    limit on the number of characters and subsequently on the number of values that
    can be used in a client''s request. Furthermore, the values of the request are
    made visible and thus, sensitive information must not be passed in that.


    The POST method exceeds the limit imposed by the GET request, sending the values
    of the request inside its body. Also, there is no limitations on the number of
    values to be sent across. Finally, the sensitive information passed through a
    POST request is not visible to an external client.


    # 11.7 What is meant by a Web Application ?


    A Web application is a dynamic extension of a Web or application server. There
    are two types of web applications: presentation-oriented and service-oriented.
    A presentation-oriented Web application generates interactive web pages, which
    contain various types of markup language and dynamic content to requests. On the
    other hand, a service-oriented web application implements the endpoint of a web
    service. In general, a Web application can be seen as a collection of servlets
    installed under a specific subset of the server''s namespace.


    # 11.8 What is a Server Side Include (SSI) ?


    Server Includes (SSI) is a simple interpreted server-side scripting language,
    used almost exclusively for the Web, and embedded with a servlet. The most frequent
    use of SSI is to include the contents of one or more files into a Web page on
    a Web server. When a Web page is accessed by a browser, the Web server replaces
    the servlet tag in that Web page with the hyper text generated by the corresponding
    servlet.


    # 11.9 What is Servlet Chaining ?


    Servlet Chaining is the method where the output of one servlet is sent to a second
    servlet. The output of the second servlet can be sent to a third servlet, and
    so on. The last servlet in the chain is responsible for sending the response to
    the client.


    # 11.10 How do you find out client machine is making a request to your servlet
    ?


    The HttpServlet class has functions for finding out the IP address or host name
    of the client machine. getRemoteAddr() returns the IP address of the client machine
    and getRemoteHost() gets the name of the client machine. See example here.


    # 11.11 What is the structure of the HTTP response ?


    The HTTP response consists of three parts:


    +   * **Status Code**: describes the status of the response. It can be used to
    check if the request has been successfully completed. If the request failed, the
    status code can be used to find out the reason behind the failure. If your servlet
    does not return a status code, the success status code, HttpServletResponse.SC_OK,
    is returned by default.

    * **HTTP Headers**: they contain more information about the response. For example,
    the headers may specify the date/time after the response is stated, or the form
    of encoding used to safely transfer the entity to the user. See how to retrieve
    headers in Servlet here.

    * **Body**: it contains the content of the response. The body may contain HTML
    code, an image, etc. The body consists of the bytes transmitted in an HTTP transaction
    message immediately following the headers.'
