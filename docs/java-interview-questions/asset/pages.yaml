  md: The JVM has a heap that is the runtime area from which all class instances and
    arrays are allocated. It is created at the JVM start-up. Heap memory for objects
    is reclaimed by an automatic memory management system which is known as a garbage
    collector. Heap memory consists of live and dead objects. Live objects are accessible
    by the application and will not be a subject of garbage collection. Dead objects
    are those which will never be accessible by the application, but have not been
    collected by the garbage collector yet. Such objects occupy the heap space until
    they are eventually collected by the garbage collector.
