  md: '# Java Interview Questions


    +   - Include directive: it is used to include a file and merges the content of
    the file with the current page.

    - Page directive: it is used to define specific attributes in the JSP page, like
    error page and buffer.

    - Taglib: it is used to declare a tag library which is used in the page.


    # 12.5 What are JSP actions ?


    JSP actions use constructs in XML syntax to control the behavior of the servlet
    engine. JSP actions are executed when a JSP page is requested. They can be dynamically
    inserted into a file, re-use JavaBeans components, forward the user to another
    page, or generate HTML for the Java plugin. Some of the available actions are
    listed below:


    +   - jsp:include includes a file, when the JSP page is requested.

    - jsp:useBean finds or instances a JavaBean.

    - jsp:setProperty sets the property of a JavaBean.

    - jsp:getProperty gets the property of a JavaBean.

    - jsp:forward forwards the requester to a new page.

    - jsp:plugin - generates browser-specific code.


    # 12.6 What are Scriptlets ?


    In Server Pages (JSP) technology, a scriptlet is a piece of Java-code embedded
    in a JSP page. The scriptlet is everything inside the tags. Between these tags,
    a user can add any valid scriptlet.


    # 12.7 What are Decarations ?


    Declarations are similar to variable declarations in Java. Declarations are used
    to declare variables for subsequent use in expressions or scriptlets. To add a
    declaration, you must use the sequences to enclose your declarations.


    # 12.8 What are Expressions ?


    A JSP expression is used to insert the value of a language expression, converted
    into a string, into the data stream returned to the client, by the web server.
    Expressions are defined between <% = %> tags.


    # 12.9 What is meant by implicit objects and what are they ?


    JSP implicit objects are those objects that the JSP Container makes available
    to developers in each page. A developer can call them directly, without being
    explicitly declared. JSP Implicit Objects are also called pre-defined variables.The
    following objects are considered implicit in a JSP page:


    +   - application

    - page

    - request

    - response'
