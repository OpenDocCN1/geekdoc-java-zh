  md: '# 10.5 What is the role of the java.rmi.Naming Class ?


    The java.rmi.Naming class provides methods for storing and obtaining references
    to the remote objects in the remote object registry. Each method of the Naming
    class takes arguments as a name that is a String in URL format.


    # 10.6 What is meant by binding in RMI ?


    Binding is the process of associating or registering a name for a remote object,
    which can be used at a later time, in order to look up that remote object. A remote
    object can be associated with a name using the bind or rebind methods of the Naming
    class.


    # 10.7 What is the difference between using bind() and rebind() methods of Naming
    Class ?


    The bind method is responsible for binding the specified name to a remote object,
    while the rebind method is responsible for rebinding the specified name to a new
    remote object. In a case binding exists for that name, the binding is replaced.


    # 10.8 What are the steps involved to make a RMI program ?


    The following steps must be involved in order for a RMI program to work properly:


    +   * Compilation of all source files.

    * Generation of the stubs using rmic.

    * Start the rmireg.

    * Start the RMISServer.

    * Run the client program.


    # 10.9 What is the role of stub in RMI ?


    A stub for a remote object acts as a client''s local representative or proxy for
    the remote object. The caller invokes a method on the local stub, which is responsible
    for executing the method on the remote object. When a stub''s method is invoked,
    it undergoes the following steps:


    +   * It initiates a connection to the JVM containing the remote object.

    * It marshals the parameters to the remote JVM.

    * It waits for the result of the method invocation and execution.

    * It unmarshals the return value or an exception if the method has not successfully
    executed.

    * It returns the value to the caller.


    # 10.10 What is DGC ? And how does it work ?


    DGC stands for Distributed Garbage Collection. Remote Method Invocation (RMI)
    uses DGC for automatic garbage collection. Since RMI involves remote object references
    across JVM''s, garbage collection can be quite difficult. DGC uses a reference
    counting algorithm to provide automatic memory management for remote objects.'
