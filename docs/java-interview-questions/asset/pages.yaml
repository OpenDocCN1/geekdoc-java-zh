  md: '# # Chapter 12


    # ## JSP


    # ### 12.1 What is a JSP Page ?


    A Java Server Page (JSP) is a text document that contains two types of text: static
    data and JSP elements. Static data can be expressed in any text-based format,
    such as HTML or XML. JSP is a technology that mixes static content with dynamically-generated
    content. See JSP example here.


    # ### 12.2 How are the JSP requests handled ?


    On the arrival of a JSP request, the browser first requests a page with a .jsp
    extension. Then, the Web server reads the request and using the JSP compiler,
    the Web server converts the JSP into a servlet class. Notice that the JSP file
    is compiled only on the first request of page, or if the JSP file has changed.
    The generated servlet class is invoked, in order to handle the browser''s request.
    Once the execution of the request is over, the servlet sends a response back to
    the client. See how to get Request parameters in a JSP.


    # ### 12.3 What are the advantages of JSP ?


    The advantages of using the JSP technology are shown below:


    +   - JSP pages are dynamically compiled into servlets and, the developers can
    easily make updates to presentation code.

    - JSP pages can be pre-compiled.

    - JSP pages can be easily combined to static templates, including HTML or XML
    fragments, with code that generates dynamic content.

    - Developers can offer customized JSP tag libraries that page authors access using
    an XML-like syntax.

    - Developers can make logic changes at the component level, without editing the
    individual pages that use the application''s logic.


    # ### 12.4 What are Directives ? What are the different types of Directives available
    in JSP ?


    Directives are instructions that are processed by the JSP engine, when the page
    is compiled to a servlet. Directives are used to set page-level instructions,
    insert data from external files, and specify custom tag libraries. Directives
    are defined between <% and %>. The different types of directives are shown below:'
