  md: '# Java Interview Questions


    +   - An applelet cannot ordinarily read or write files on the execution host.

    - An applelet cannot read certain system properties.

    - An applelet cannot make network connections except to the host that it came
    from.

    - An applelet cannot start any program on the host that''s executing it.


    # 7.6 What are untrusted applets?


    Untrusted applets are Java applets that cannot access or execute local system
    files. By default, all downloaded applets are considered untrusted.


    # 7.7 What is the difference between applets loaded over the internet and applets
    loaded via the file system ?


    Regarding the case where an applet is loaded over the internet, the applet is
    loaded by the applet classloader and subject to the restrictions enforced by the
    applet security manager. Regarding the case where an applet is loaded from the
    client''s disk, the applet is loaded by the file system loader. Applets loaded
    via the file system are allowed to read files, write files and to load libraries
    on the client. Also, applets loaded via the file system are allowed to execute
    processes and finally, applets loaded via the file system are not passed through
    the byte verifier.


    # 7.8 What is the applet class loader, and what does it do ?


    When an applet is loaded over the internet, the applet is loaded by the applet
    classloader. The class loader enforces the Java name space hierarchy. Also, the
    class loader guarantees a unique namespace for classes that come from the local
    file system, and that a unique namespace exists for each network source. When
    a browser loads an applet over the net, that applet''s classes are placed in a
    private namespace associated with the applet''s origin. Then, those classes loaded
    by the class loader are passed through the verifier.The verifier checks that the
    class file conforms to the Java language specification . Among other things, the
    verifier ensures that there are no stack overflows or underflows and that the
    parameters to all bytecode instructions are correct.


    # 7.9 What is the applet security manager, and what does it provide ?


    The applet security manager is a mechanism to impose restrictions on Java apps.
    A browser may only have one security manager. The security manager is established
    at startup, and it cannot thereafter be replaced, overloaded, overridden, or extended.'
