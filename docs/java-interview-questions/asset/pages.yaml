  md: '# Java Interview Questions


    # 4.10 What is difference between ArrayList and LinkedList ?


    The ArrayList and LinkedList classes implement the List interface, but they differ
    on the following features:


    +   - An ArrayList is an index data structure backed by an Array. It provides
    random access to its elements with a performance equal to O(1). On the other hand,
    a LinkedList stores its data as a list of elements and each element is linked
    to its next and previous element. In this case, the search for an element has
    execution time equal to O(n).


    +   - The Insertion and removal of elements are faster in a LinkedList compared
    to an ArrayList, because there is no need of resizing an array or updating the
    index when an element is added in some array position inside the collection.


    +   - A LinkedList consumes more memory than an ArrayList, because every node
    in a LinkedList stores two references, one for its previous and for its next.


    Check out our article ArrayList vs. LinkedList.


    # 4.11 What is Comparable and Comparator interface ? Let us their differences.


    Java provides the Comparable interface, which contains only one method, compareTo().
    This method compares two objects, in order to impose an order between them. Specifically,
    it returns a negative integer, zero, or a positive integer to indicate whether
    the input object is less, or greater than the object. Java provides the Comparator
    interface, which contains two methods, compare and equals. The first method compares
    its input arguments and imposes an order between them. It returns a negative integer,
    zero, or a positive integer to indicate that the first argument is less than,
    or, or greater than the second. The second method returns true, only if the specified
    object is a comparator and it imposes the same ordering as the comparator.


    # 4.12 What is Java Priority Queue ?


    The PriorityQueue is an unbounded queue, based on a priority heap and its elements
    are ordered in their natural order. At the time of its creation, we can provide
    a Comparator that is responsible for ordering the elements of the PriorityQueue.
    PriorityQueue doesn''t allow null values, those objects do not provide natural
    ordering, or those objects that don''t have any comparator associated with them.
    Finally, the PriorityQueue is not thread-safe and it O(log(n)) for its enqueuing
    and dequeuing operations.


    # 4.13 What do you know about the big-O notation and can you give some examples
    with respect to different data structures ?


    The Big-O notation simply describes how an algorithm scales or performs in the
    worst case scenario as the number of elements in a data increases. The Big-O notation
    can also be used to describe other behavior such as memory consumption. Since
    the collection classes are actual data structures, we usually use the Big-O notation
    to choose the best implementation for time, memory and performance. Big-O notation
    can give a good indication about performance for large amounts of use,


    # 4.14 What is the tradeoff between using an unordered array versus an ordered
    array ?


    The major advantage of an ordered array is that the search time has a complexity
    of O(log n), compared to that of an unordered array, the disadvantage of an ordered
    array is that the insertion operation has a complexity of O(n), because the elements
    with higher values must be moved to make room for the new element. Instead, the
    insertion operation for an unordered array takes constant time of O(1).'
