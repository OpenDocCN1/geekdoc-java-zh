  md: '# 11.12 What is a cookie ? What is the difference between session and cookie
    ?


    A cookie is a bit of information that the Web server sends to the browser. The
    browser stores the cookies for each Web server in a local file. In a future request,
    the browser, along with the request, sends all stored cookies for specific Web
    server.The differences between session and cookie are the following:


    +   - The session should work, regardless of the settings on the client browser.
    The client may have chosen to disable cookies. However, the sessions still work,
    as the client has no ability to disable them in the server side.

    - The session and cookies also differ in the amount of information the an can
    store. The HTTP session is capable of storing any Java object, while a cookie
    can only store String objects.


    # 11.13 Which protocol will be used by browser and servlet to communicate ?


    The browser communicates with a servlet by using the HTTP protocol.


    # 11.14 What is HTTP Tunneling ?


    HTTP Tunneling is a technique by which, communications performed using various
    network protocols are encapsulated using the HTTP or HTTPS protocols. The HTTP
    protocol therefore acts as a wrapper for a channel that the network protocol being
    tunneled uses to communicate. The masking of other protocol requests as HTTP requests
    is HTTP Tunneling.


    # 11.15 What''s the difference between sendRedirect and forward methods ?


    The sendRedirect method creates a new request, while the forward method just forwards
    a request to a new target. The previous request scope objects are not available
    after a redirect, because it results in a new request. On the other hand, the
    previous request scope objects are available after forwarding. Finally, in general,
    the sendRedirect method is considered to be slower compare to the forward method.


    # 11.16 What is URL Encoding and URL Decoding ?


    The URL encoding procedure is responsible for replacing all the spaces and every
    other extra special character of a URL, into their corresponding Hex representation.
    In correspondence, URL decoding is the exact opposite procedure.'
