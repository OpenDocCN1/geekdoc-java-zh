  md: '# 4.15 What are some of the best practices relating to the Java Collection
    framework ?


    +   - Choosing the right type of the collection to use, based on the application''s
    needs, is very crucial for its performance. For example if the size of the elements
    is fixed and known a priori, we shall use an Array, instead of ArrayList.


    +   - Some collection classes allow us to specify their initial capacity. Thus,
    if we have an estimation of the number of elements that will be stored, we can
    use it to avoid resizing.


    +   - Always use Generics for type-safety, readability and robustness. Also, by
    using Generics we avoid the ClassCastException during runtime.


    +   - Use immutable classes provided by the Java Development Kit (JDK) as a key
