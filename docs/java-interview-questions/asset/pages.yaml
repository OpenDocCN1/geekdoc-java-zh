    # 4.5 What is difference between fail-fast and fail-safe ?


    The Iterator''s fail-safe property works with the clone of the underlying collection
    and thus, is not affected by any modification in the collection. All the collections
    in java.util package are fail-fast, while the collection classes in java.util.concurrent
    are fail-safe. Fail-fast iterator throws a ConcurrentModificationException, while
    fail-safe iterator never throws such an exception.


    # 4.6 How HashMap works in Java ?


    A HashMap stores key-value pairs. The HashMap requires a hash function and uses
    hashCode, in order to put and retrieve elements to from the collection respectively.
    When the method is invoked, the HashMap calculates the value of the key and stores
    it in the appropriate index inside the collection. If the key exists, it is updated
    with the new value. Some important characteristics of a HashMap are its capacity,
    load factor and the threshold resizing.


    # 4.7 What is the importance of hashCode() and equals() methods ?


    In java, a HashMap uses the hashCode and equals methods to determine the index
    of the key-value pair and detect duplicates. More specifically, the hashCode method
    is used in order to determine where the specified key was. Since different keys
    may produce the same value, the equals method is used, in order to determine whether
    the key actually exists in the collection or not. The implementation of both methods
    is crucial to the accuracy and efficiency of the HashMap.


    # 4.8 What differences exist between HashMap and Hashtable ?


    Both the HashMap and Hashtable class implement the Map interface and thus, have
    very similar characteristics. However, they differ in the following features:


    +   * HashMap allows the existence of null keys and values, while a Hashtable
    neither allows null keys, nor values.

    * Hashtable is synchronized, while a HashMap is not. HashMap is preferred in single-threaded
    environments, while a Hashtable is suitable for multi-threaded environments.

    * HashMap provides its set of keys and a Java application can iterate over them.
    Thus, a HashMap is fail-fast. On the other hand, a Hashtable provides an Enumeration
    of them.

    * Hashtable is considered to be a legacy class.


    The Array and ArrayList classes differ on the following features:


    +   * Arrays can contain primitive objects, while an ArrayList can contain only
    objects.

    * Arrays have fixed size, while an ArrayList is dynamic.

    * ArrayList provides more methods and features, such as addAll, removeAll, iterator,
    etc.

    * For a list of primitive data types, the collections use autoboxing to reduce
    the coding effort. However, this approach makes them slower when working on fixed
    size primitive data types.'
