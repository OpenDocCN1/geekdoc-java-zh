    to maintain in this type of country’. Leggatt recognized this control issue. Partly
    for this reason, he wanted to fight it out in the open area near Tjamplong. He
    also deployed his troops on 21 and 22 February 1942 in a fragmented manner, thus
    losing valuable time – time that Leggatt did not have in view of the Japanese
    advance in his rear from Kupang. He could have kept a large reserve against this
    anticipated threat. The troops showed a lack of willingness to fight on 20 and
    21 February 1942: at this stage, they ‘were not very confident and were apt to
    withdraw when single shots were fired in their vicinity’. This could be attributed
    to a lack of combat experience. On 22 February 1942, nervousness resulted in panic.
    Despite these shortcomings, Sparrow Force had stood firm. Its casualties amounted
    to 150 men killed or wounded, while 200 were missing. The 3rd Yokosuka SLF suffered
    38 killed and 40 to 50 wounded. The Eastern Detachment reported 67 killed and
    56 wounded. The Japanese imprisoned 1,136 men: 179 British, 934 Australians and
    23 Dutch.


    At the same time as the attack on Kupang, the Eastern Detachment also attacked
    Dilly, the capital of Portuguese Timor. Dilly had been occupied on 17 December
    1941 by a combined NEI-Australian detachment under Dutch leadership. The RNEI
    Army had urged this step to prevent Japan from establishing an air base there,
    from which it would be able to reach the airfields at Makassar and Kendari, directly
    threaten Ambon and Darwin, and control the lines of communication between the
    Netherlands East Indies and Australia.


    The NEI-Australian expedition consisted of the so-called NEI Detachment Q of the
    reinforced Menadonese 3rd Company, 8th Infantry Battalion from Java, a battery
    of four 7.5cm L30 field guns, a detachment of engineers and some service personnel.
    It was reinforced by six brigades from the Kupang Garrison Battalion. The Australians
    detached the 2nd Independent Company, a commando unit (270 men). The Dutch contingent
    totalled 604 men. The expedition’s commander was Lieutenant-Colonel N.L.W. van
    Straten. The NEI detachment defended the port of Dilly and the airfield in positions
    without depth. As a commando unit, the 2nd Independent Company was not suited
    to static defence. It was designated as the reserve and located in the mountains
    4km south-west of Dilly. One section was stationed at the airfield.


    The presence of NEI and Australian troops in Portuguese Timor made Japan question
    how it would deal with this neutral territory. The Imperial General HQ wanted
    to avoid conflict with Portugal. However, the Southern Army (IJA) and Southern
    Task Force (IJN) agreed that Allied forces in Dilly posed a threat to the attack
    on Kupang. They had to be driven out. Dilly thereafter had to remain in Japanese
    hands as an important base for operations against Darwin. The Sixteenth Army objected
    to the simultaneous actions on Timor. It wanted to concentrate its forces on the
    conquest of Kupang. It referred to the unsuccessful attack on Laha in the operation
    against Ambon. The Imperial General HQ ended this discussion.


    On 20 February 1942, the Eastern Detachment with the reinforced 2nd Battalion,
    228th Infantry Regiment (led by regimental commander Colonel Sadashichi Doi) planned
    a direct surprise attack on Dilly. This failed due to NEI artillery and machine-gun
    fire. Colonel Doi modified his plan and landed just under a kilometre to the west.
    The amphibious landing took place at 0218hrs. The main force started a frontal
    attack on the airfield, with the 5th Company conducting an envelopment and the
    7th Company (reinforced) a turning movement to the south of Dilly. Lieutenant-Colonel
    Van Straten reinforced the airfield defences. His retreat route was, however,
    threatened. Some of the NEI troops had fled. In addition, he could not call in
    the 2nd Independent Company because of a breakdown in communications. The Australians
    would not learn of the Japanese landing until around 0900hrs. On seeing the Japanese
    fleet, Van Straten estimated the Japanese strength to be 4,000–5,000 men. At around
    0800hrs, he decided to make a general retreat towards 2nd Independent Company.
    By the end of the morning, Dilly was in Japanese hands.


    The IJA’s losses amounted to seven killed. On the Allied side, 24 soldiers lost
    their lives: eight NEI men and 16 Australians. The number of Allied prisoners
    of war was 33.


    The defeated Australian and NEI troops from Dutch and Portuguese Timor retreated
    into the mountains. They eventually started a guerrilla campaign. However, that
    story is beyond the scope of this book.


    With the capture of Timor, and the Carrier Task Force in the waters south of Java,
    the island’s encirclement was complete. It was now cut off from reinforcements
    from Australia. Within a week, Japanese troops would land on Java.


    ### JAVA (OPERATION *H*)


    On 19 February 1942, on Wavell’s advice, the Combined Chiefs of Staff decided
    to stop sending ground troops to Java as reinforcements. These would be sent to
    Australia and Burma instead. The Australian army corps on its way to Java was
    therefore no longer to be shipped to Java. The island was thus, to all intents
    and purposes, given up. Wavell resigned as Supreme Commander, closed his personal
    headquarters and left Java on 25 February 1942\. Dutch officers took command.
    Lieutenant-General H. ter Poorten, already the commander ABDA-ARM, also became
    the commander-in-chief for the ABDA area. On Java, ABDA-AIR was renamed Java Air
    Command (JAC) with Major-General L.H. van Oijen at its head. Vice Admiral C.E.L.
    Helfrich was from 14 February the commander of ABDA-FLOAT.


    On 22 February 1942, the RNEI General HQ decided to adjust the operation plan
    for Java in the absence of further Allied support. This was a week before the
    Japanese landings on Java. In order to achieve some success against the expected
    superior numbers of Japanese troops, it was decided to concentrate on West Java
    with the simultaneous formation of a strategic reserve. The transfer of troops
    from East Java was vetoed by order of the governor general. The Commander of the
    Navy found the Surabaya fleet base indispensable for supporting the navy. Central
    Java, however, was abandoned. With the 3rd Division in East Java, a certain fragmentation
    of forces remained.


    ![9781472843524_Map006.jpg](img/9781472843524_Map006.jpg)


    Operation *H*: the conquest of Java


    Java was the main island and administrative centre of the Netherlands East Indies.
    It was a long (*c*. 1,060km) and narrow (200km) island with a population of about
    42 million. A mountainous volcanic area extends the length of the island. The
    north coast consists of lowland terrain with many rivers flowing down from the
    mountains. The south coast terrain, on the other hand, is frequently mountainous.
    Any primary forest had largely been cleared. The Priangan is a high plateau in
    West Java, containing the city of Bandung (Bandoeng), surrounded by middle and
    high mountains. The island had three modern ports: Tanjung Priok (West Java),
    Surabaya (East Java) and Cilacap (Tjilatjap, on the south coast in Central Java).
    The road network was well developed with metalled west–east connecting roads and
    railways along the north and south coasts. At Cepu (Tjepoe) in Central Java there
    was an oil refinery.'
