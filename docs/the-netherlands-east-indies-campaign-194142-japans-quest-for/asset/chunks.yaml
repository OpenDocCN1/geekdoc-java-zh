- fmt: '

    The defenders’ intelligence position on Java was unequivocally terrible. On 1
    March 1942, it was estimated that the Japanese had landed two to three divisions
    in West Java. At least two divisions would have landed at Kragan. On 4 March 1942,
    this number was adjusted upwards: four in Bantam, one near Indramayu (Eretan Wetan)
    and in East Java probably between two and four divisions. In fact, the Java Army
    and the Sixteenth Army were numerically about the same strength, as indicated
    in [Table 10](#9781472843531-8.xhtml_tab10).[14](#9781472843531-8.xhtml_footnote-011)


    ![table_p73.jpg](img/table_p73.jpg)


    ## West Java


    During the landing in Bantam Bay, the Japanese ships were fired upon by the Allied
    ships USS `Houston` and HMAS `Perth`, who wanted to escape to the west. In the
    following confusing battle, both ships were sunk. A Japanese transport ship was
    sunk by friendly fire and three transport ships were severely damaged, ran aground
    and heeled over. Nor were the Japanese spared from air strikes. Between 27 February
    and 1 March 1942, Allied air forces switched from counter-air against the Palembang
    area to harassing attacks on Japanese landing operations. The transport fleets,
    the landings themselves and the disembarkation of supplies were bombed and strafed.


    ![CAM364_040.jpg](img/CAM364_040.jpg)


    Throughout their offensive in the NEI, the Japanese made extensive use of tanks,
    although they were not as decisive on the battlefield as at Malacca. At the front
    of this mechanized and motorized column on the road to Serang, West Java, we see
    two light tanks of the battalion-size 2nd Tank Regiment. There are no civilians
    looking on. The tanks are Type 95 Ha-Go light tanks, armed with a Type 94 (1934)
    37mm gun in the turret and 7.7mm Type 97 MG in the front hull. The tank commander
    can be seen in the turret. Instead of a tank helmet, he wears his fieldcap backwards.
    A wooden frame has been added to the tank, to attach camouflage material, as shown
    on the second tank that follows. (Mainichi Newspapers)


    At Merak the small NEI coastal detachment (*c*. 40 men) opposed the landing, but
    was soon forced to retreat. The Nasu Detachment that landed at Merak consisted
    of the 16th Infantry Regiment (reduced) and 2nd Reconnaissance Regiment. This
    detachment had to carry out the supporting attack towards Bogor. With the motorized
    2nd Reconnaissance Regiment, a unit of battalion strength, in the vanguard, Serang
    was occupied that same morning at 0700hrs. The city was an important crossroads.
    The unit turned south and took Rangkasbitoeng by surprise at 1230hrs. The NEI
    detachment at Rangkasbitoeng, consisting of 10th Battalion, 2nd Infantry Regiment,
    1st Mountain Artillery Battalion and two armoured cars, failed. It hastily retreated,
    with little of the intended delaying actions coming to pass. The Fukushima Detachment
    also landed at Merak. It was made up of the 4th Infantry Regiment (reduced). It
    took the bridge and lock at Pamarajan over the Ciujung River by surprise. The
    Sato Detachment, consisting of the reinforced 29th Infantry Regiment, landed in
    Bantam Bay. Together with the Fukushima Detachment, the Sato Detachment formed
    the main force with Jakarta as its objective. However, Sato’s advance along the
    northern route progressed very slowly due to felled trees blocking the road and
    destroyed bridges. Deep rivers and high banks in combination with swollen rivers
    after heavy rainfall made bridge restoration difficult. The detachment did not
    reach the Ciujung River until 3 March 1942.


    ![CAM364_041.jpg](img/CAM364_041.jpg)


    Kalidjati Airfield was one of the main Military Aviation Service operating bases.
    In February 1942, ABDA-AIR allocated two squadrons to Kalidjati: No. 84 (Bomber)
    Squadron RAF and No. 1 (General Reconnaissance) Squadron RAAF. The Dutch 1st Aircraft
    Group also operated from the airfield. Ground-based air defence was provided by
    49th Battery, 48th Light Anti-Aircraft Regiment (RA) and units from 3rd Anti-Aircraft
    Battalion. On the morning of the Japanese landing, the RNEI Army 3rd Company,
    2nd Infantry Battalion was relieved by 12th Battery, 6th Heavy Anti-Aircraft Regiment
    (RA) deployed in a ground-defence roll. The Australian and NEI air units managed
    to evacuate the airfield in time. The British, however, were too slow. This photo
    of the airfield was taken between 1930 and 1932\. By 1942, the airfield had been
    extended to include two runways west of the lake at the bottom of the picture.
    To the right lies the road to Subang, the direction from which the Japanese approached
    the airfield. (Leiden University Libraries, KITLV 49427)


    For West Group’s commander, Major-General Schilling, the landings in Bantam Bay
    certainly came as no surprise. However, the Japanese advance along the southern
    route was considerably faster than expected. The two roads from Serang to Jakarta
    and Bogor diverged. An advance along both routes would only increase the distance
    between the enemy axes of advance. The rapid Japanese southern advance further
    increased the distance. According to Schilling, this offered an opportunity to
    achieve a limited success.

