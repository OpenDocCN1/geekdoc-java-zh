- fmt: "\n# Battle of West Java Overview\n\nA Japanese war painting by Kenji Yoshioka,\
    \ ‘Bombing West Area of Kalidjati Airfield, Java’. The scene shows destroyed vehicles\
    \ and abandoned weapons of the RNEI Army’s 2nd Infantry Regiment (reinforced)\
    \ after the bombing by the 3rd Air Division on 3 March 1942. Fallen soldiers lie\
    \ between the wreckage. The destroyed materiel is still smoking in the background.\
    \ Two Japanese planes, probably twin-engine Mitsubishi Ki-51 Army 99 attack aircraft,\
    \ are circling in the sky. (NARA, public domain)\n\n## The Strategic Situation\n\
    \nThe Sixteenth Army identified Jakarta as its operational target and remained\
    \ prepared for a NEI counter-offensive in West Java. On 3 and 4 March 1942, it\
    \ became clear that the NEI troops in West Java had adopted a defensive attitude.\
    \ Conversely, they made an offensive stand against the Shoji Detachment. The Sixteenth\
    \ Army was concerned about the predicament of the Shoji Detachment. On 4 March,\
    \ it asked the Southern Army to reinforce the Shoji Detachment with two companies\
    \ flown in from Palembang to Kalidjati. This request was denied. \n\nThe Sixteenth\
    \ Army then decided to shift the centre of gravity of the 2nd Division to the\
    \ southern axis of advance. The Fukushima Detachment was shifted to the southern\
    \ route and the Nasu Detachment received reinforcements from the Sato Detachment.\
    \ The aim was to quickly force a breakthrough at Leuwiliang and then attack Bandung\
    \ via Bogor to support the Shoji Detachment.\n\nThe RNEI Army had used up its\
    \ strategic reserve in the failed major counter-attack against the Shoji Detachment.\
    \ There was no longer any question of further large-scale offensive operations.\
    \ The RNEI General Headquarters therefore decided on 4 March to focus on the defence\
    \ of the Bandung plateau. West Group was ordered to withdraw to the plateau as\
    \ soon as possible. The retreat and preparation would certainly take several days.\
    \ In the meantime, Bandung Group had to defend the entrances to the plateau on\
    \ its own. The remaining Allied air forces were made available to the Bandung\
    \ Group. West Group retreated from the vicinity of Jakarta via Bogor by road and\
    \ rail to Bandung, covered by Blackforce holding out at Leuwiliang. Blackburn\
    \ withdrew on 5 March 1942. His losses were `c`. 150 men.\n\n## The Defense for\
    \ Bandung\n\nColonel Shoji estimated the strength of the RNEI Army troops around\
    \ Bandung at first to be between 30,000 and 35,000. At Subang he had narrowly\
    \ escaped a heavy blow. He feared that his widely deployed detachment would be\
    \ surrounded and destroyed. Therefore, he wanted to seize and hold a position\
    \ on the high ground. After repulsing the counter-attacks of 2 and 3 March, Colonel\
    \ Shoji changed his mind on 4 March after reassessing the military situation.\
    \ He decided, in contradiction to Imamura’s orders, to abandon his defensive posture,\
    \ and shift to the offensive and a full-scale attack to take Bandung. Shoji received\
    \ full backing from Major-General Endo, commander of 3rd Air Division. Endo moved\
    \ the centre of gravity of his 3rd Air Division’s air support to the Shoji Detachment.\
    \ He had arrived from Palembang with the 59th and 75th Air groups on 2 March 1942.\n\
    \n![img/9781472843524Art003_battlescene.jpg](img/9781472843524Art003_battlescene.jpg)\n\
    \n# THE NEI MOBILE UNIT ATTACKS INTO SUBANG, 2 MARCH 1942\n\nOn the first day\
    \ of the Japanese landing on Java, the Shoji Detachment captured Kalidjati Airfield.\
    \ The RNEI Army responded with various counter-attacks, one of which was by a\
    \ team of tanks and armoured infantry with artillery support. The Shoji Detachment\
    \ was widely dispersed with its HQ at Subang, its 2nd Battalion (reduced) and\
    \ airfield units at Kalidjati, 1st Battalion (reduced) to the north and 6th Company\
    \ securing its landing site. At Subang, Colonel Shoji’s HQ was secured by 4th\
    \ Company, 1st Battalion (100 men in total) equipped with a mountain gun, an anti-tank\
    \ gun and two MGs.\n\nOn Monday 2 March 1942, at 0810hrs (Java Time), the NEI\
    \ Mobile Unit, commanded by Captain G.J. Wulfhorst, attacked Subang. It was made\
    \ up of its HQ, a reconnaissance section, a tank company, an armoured infantry\
    \ company, one AT gun section and a supply train. It was reinforced with the 2nd\
    \ Battery, 2nd Mountain Artillery Battalion. What followed was the first tank\
    \ attack in Dutch military history.\n\n## The Battle at Subang\n\nThis scene show\
    \ the moments after the attacking NEI armoured column forced its way through a\
    \ road obstacle just south of Subang, and became pinned down in a firefight with\
    \ Japanese defenders. We see a broken steel-wire cable (`1`) emplaced by the Japanese\
    \ to block the road, hidden by two (now pushed aside) carts (`2`). The Dutch Marmon\
    \ Herrington armoured car Mk III that broke the cable lies overturned on the right\
    \ of the road (`3`). The lead NEI tank platoon (comprising seven Marmon Herrington\
    \ CTLS-4TA tanks) has advanced in single file (`4`) up the road and is pushing\
    \ on towards Subang. On either side of the road, Japanese troops have taken up\
    \ positions in civilian-built air-raid trenches, ditches, inside the houses and\
    \ behind trees (`5`). They have opened fire on the following NEI infantry as they\
    \ disembark from the APCs (`6`). The Ambonese 1st Platoon infantry are moving\
    \ into the rubber plantation to the left of the road (`7`), while the Menadonese\
    \ 2nd Platoon are deploying to the right (`8`). The company commander is standing\
    \ in the road with a LMG gunner lying alongside him (`9`). A LMG gunner, in a\
    \ forward position camouflaged with suffered a firing malfunction (`10`).\n\n\
    Although the Japanese were taken by surprise, the Mobile Unit failed to exploit\
    \ this tactical success. The terrain prevented deployment and the tanks had to\
    \ fight in a single file in built-up area. The armoured infantry company, pinned\
    \ down in fire fight, could not follow the tanks. Without infantry support, a\
    \ dash towards the airfield was meaningless. The tank platoon turned and forced\
    \ its way back.\n\nTo get the NEI infantry further into Subang, a second attack\
    \ by another tank platoon was mounted at 0915hrs. At 1000hrs, the Japanese threatened\
    \ the right and left flanks of the infantry. A third NEI tank attack was launched,\
    \ allowing the NEI infantry to break off the fight and retreat. The Mobile Unit\
    \ withdrew. The engagement, which lasted for almost two hours, was over.\n\nThe\
    \ Mobile Unit had suffered heavy casualties: 15 killed and 13 wounded (one of\
    \ whom died later). Materiel losses included 13 tanks, an armoured car, three\
    \ APCs and one anti-tank gun. During the assault, the unit did not receive fire\
    \ support. Japanese losses were 20 killed and an unknown number of wounded.\n\n\
    ## The Ciater Defense\n\nThe Ciater defensive position (`Tjaterstelling`) guarded\
    \ the access road from Subang to the Priangan Plateau. The position was built\
    \ for a regiment in the middle of a tea plantation. It was to be replaced by a\
    \ new position higher up the mountain and was greatly neglected. The fields of\
    \ fire were poor, and numerous footbridges had been placed over the wire fence\
    \ and trenches. The position was guarded until February by a Home Guard brigade\
    \ (15 men), police and the crew of a 5cm naval gun. On 26/27 February 1942, the\
    \ (European) 2nd Company, 1st Infantry Battalion (reinforced) arrived. On 1 March,\
    \ the 3rd Battery, 2nd Mountain Artillery Battalion followed. With these troops,\
    \ however, only part of the position could be occupied. The Subang–Bandung road\
    \ passed straight through the position. On the morning of 5 March, the Left-Half\
    \ 21st Infantry Battalion arrived from Central Java. However, this battalion remained\
    \ about 2km behind the front. Only around 1800hrs did this unit move into position\
    \ directly behind the Ciater position.\n"
