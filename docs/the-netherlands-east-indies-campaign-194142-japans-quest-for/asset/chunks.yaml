    在巴厘巴板（Balikpapan），有一个炼油厂和一个储油库，用于处理和储存来自 Sambodja 和 Sanga-Sanga 钻场的石油。1942 年 1
    月 20 日，荷兰荷属东印度陆（RNEI）军队司令决定摧毁石油设施和曼加（Manggar）机场。在过去的几天里，浓烟笼罩着整个城市和海湾，导致了黑雨。在这种末日般的背景下，我们看到坂口队（Sakaguchi
    Detachment）的五名士兵在 1941 年 1 月 24 日登陆后正在前进。（每日新闻）


    1942 年 1 月 23 日，日本军通过空中侦察发现了秘密机场 `Samarinda II`。在遭到多次空袭后，剩余的军用航空队飞机已从 `Samarinda
    II` 撤离。该基地暂时保持运行。军用航空司令部决定位于位于则马辛（Bandjermasin）的 `Oelin Airfield`，从爪哇岛对巴厘巴板进行袭扰攻击。1942
    年 1 月 27 日，一个中队在地面遭到空袭并被摧毁。在此次攻击中总共损失了九架 `Glenn Martins` 飞机。这标志着军用航空队在婆罗洲岛上方部署的结束。


    ### 肯达里（KENDARI）


    在进攻巴厘巴板的同时，位于望纳多（Menado）的东进攻部队袭击了苏拉威西东南部重要的 `Kendari II Airfield`。在这里，细保联合陆战登陆部队（Sasebo
    Combined SLF）的登陆也发生在清晨（`0422hrs`）。当天，城市和机场（`1700hrs`）几乎完好地被占领。肯达里的荷印陆守军约 500 人。由于领导无力导致战斗意愿不足，计划中的机场强力防御并未实施。荷印军队撤退到内陆，大部分人逃跑甚至被允许休假。1942
    年 1 月 24 日，至少有六名荷印士兵被杀害。


    1942 年 1 月 24 日，日本海军转入第三阶段行动。随着巴厘巴板和肯达里的征服，爪哇岛进入了日本陆基轰炸机和战斗机的飞行范围。


    ### 辛加瓦（SINGKAWANG）


    由于 `Kuching Airfield` 未符合日本人的预期，海军将希望寄托于 1941 年 12 月 20 日发现的秘密机场 `Singkawang II`（日文文献称为
    `Ledo`）。1941 年 12 月 28 日，南部军命令川口队（Kawaguchi Detachment）准备夺取该基地。然而，令南部军懊恼的是，川口认为对
    `Singkawang II` 执行行动意义不大。1942 年 1 月 6 日，愤怒的南部军领导层命令川口尽快征服辛加瓦。


    ### 日本军对望纳多的进攻，1942 年 1 月 11 日–12 日


    日本军通过海军陆陆部队和空降部队的同步两栖和空降进攻，攻占了 `Menado Langoan (II)` 机场和水上飞机基地。荷印军队陷入了包围圈势，西侧来自望纳多，东侧来自肯马（Kema），日本伞兵在机场附近的中心位置发动进攻。溃散且人数处于劣势的荷印军队通过从准备阵地的阻击行动成功减缓了日本两栖部队的内陆推进。然而，他们未能阻止日军与伞兵建立陆地联系。机场遭到了激烈的防御，但在短暂战斗后落入日军手中。荷印军队的反击缺乏协调，力量太弱并以告终，随后守军残部退缩到山中，开始了一场注定失败的游击战。


    注：网格线每隔 5 公里（3.1 英里）显示一次。


    ![CAM364_BEV001.jpg](img/CAM364_BEV001.jpg)


    #### 日本军


    **细保联合陆战登陆部队：**


    - **A.** 第 1 细保陆战登陆部队

    - **B.** 第 2 细保陆战登陆部队

    - **C.** 第 1 横须陆战登陆部队


    #### 荷印（荷属东印度军队）


    **望纳多部队指挥部**


    - **1.** 望纳多连队和两门 7.5 厘米火炮

    - **2.** A 连，老兵预备队

    - **3.** E 队，老兵预备队（45 人）；驻守在西海岸的海岸卫（地图范围外）

    - **4.** 欧洲民兵和民卫连

    - **5.** 望纳多民兵连（地图范围外，未参与战斗）

    - **6.** 镇队


    **卡卡斯（Kakas）战术指挥部：**


    - **7.** C 连，老兵预备队，以及车上的三门 3.7 厘米火炮

    - **8.** D 连，老兵预备队

    - **9.** 机动队（三辆装甲车内 45 人）


    **预备队：**


    - **10.** KV 连（短期役）

    - **11.** B 连，老兵预备队


    ![image](img/common.jpg)


    #### 事件


    除非另有说明，时间均为日本标准时间（JST – UTC+09:00）。望加锡时间（CBT）为 UTC+08:00。


    **1942 年 1 月 11 日**


    1. `0400hrs`：细保联合陆战登陆部队总部连同支援部队和第 1 细保陆战登陆部队（约 1,800 人）在望纳多南北两侧进行两栖夜间登陆。人数处于劣势的荷印守卫者猝不及防，很快被切断。日军在`0830hrs`
    占领城市。

    2. `0420hrs`：第 2 细保陆战登陆部队（约 1,800 人）在望纳多南北两侧进行两栖夜间登陆。

