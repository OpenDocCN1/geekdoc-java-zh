- fmt: "\nAt Balikpapan there was an oil refinery with an oil tank farm to process\
    \ and store oil from the drilling sites at Sambodja and Sanga-Sanga. On 20 January\
    \ 1942, the RNEI Army troop commander opted to destroy the oil facilities and\
    \ Manggar Airfield. Over the following days, a thick smokescreen hung over the\
    \ city and the bay, causing black rain. Against this apocalyptic background, here\
    \ we see five soldiers of the Sakaguchi Detachment advancing after their landing\
    \ on 24 January 1941. (Mainichi Newspapers)\n\nOn 23 January 1942, the Japanese\
    \ discovered the secret airfield `Samarinda II` using air reconnaissance. After\
    \ several air attacks, the remaining Military Aviation Service aircraft were withdrawn\
    \ from `Samarinda II`. The base remained operational for the time being. The Military\
    \ Aviation Service command decided to use `Oelin Airfield` at Bandjermasin for\
    \ hit-and-run attacks from Java on Balikpapan. On 27 January 1942, a squadron\
    \ was surprised on the ground by an air raid and was destroyed. In total, nine\
    \ `Glenn Martins` were lost in this attack. This marked the end of any deployment\
    \ by the Military Aviation Service above Borneo.\n\n### KENDARI\n\nSimultaneously\
    \ with the attack on Balikpapan, the Eastern Attack Unit based on Menado struck\
    \ the important `Kendari II Airfield` in South-East Sulawesi. Here, too, the landing\
    \ by the `Sasebo Combined SLF` took place in the early morning (`0422hrs`). The\
    \ same day, the city and (at `1700hrs`) the airfield were occupied almost undamaged.\
    \ The RNEI Army garrison at Kendari had about 500 men. The planned robust defence\
    \ of the airfield did not take place due to weak leadership and a resultant lack\
    \ of willingness to fight. The NEI troops withdrew to the interior, where a large\
    \ part deserted or were even sent on leave. At least six NEI soldiers were killed\
    \ on 24 January 1942.\n\nThe IJN switched to Phase III operations on 24 January\
    \ 1942. With the conquest of Balikpapan and Kendari, Java came within flying range\
    \ of the Japanese land-based bombers and fighters.\n\n### SINGKAWANG\n\nBecause\
    \ `Kuching Airfield` did not meet Japanese expectations, the IJN put its hopes\
    \ on the secret airfield discovered on 20 December 1941, `Singkawang II` (referred\
    \ to as `Ledo` in Japanese sources). On 28 December 1941, the Southern Army ordered\
    \ the `Kawaguchi Detachment` to prepare for the capture of this base. To the chagrin\
    \ of the Southern Army, however, Kawaguchi saw little point in an operation against\
    \ `Singkawang II`. On 6 January 1942, the annoyed leadership of Southern Army\
    \ ordered Kawaguchi to conquer Singkawang as soon as possible.\n\n### THE JAPANESE\
    \ ASSAULT ON MENADO, 11–12 JANUARY 1942\n\nThe Japanese captured `Menado Langoan\
    \ (II)` airfield and the seaplane base with a simultaneous amphibious and airborne\
    \ assault by naval landing and airborne forces. The NEI forces were caught in\
    \ a pincer movement, from Menado in the west and Kema in the east, with Japanese\
    \ paratroopers attacking in the centre near the airfield. The scattered and outnumbered\
    \ NEI forces managed to slow the inland advance of the Japanese amphibious forces\
    \ by delaying actions from prepared positions. They could not, however, prevent\
    \ them from establishing overland contact with the paratroopers. The airfield\
    \ was fiercely defended, but fell into Japanese hands after a brief fight. NEI\
    \ counter-attacks lacked coordination, were too weak, and failed, whereupon remnants\
    \ of the garrison retreated into the mountains to begin an ill-fated guerrilla\
    \ campaign.\n\nNote: gridlines are shown at intervals of 5km (3.1 miles)\n\n![CAM364_BEV001.jpg](img/CAM364_BEV001.jpg)\n\
    \n#### JAPANESE\n\n**Sasebo Combined Special Landing Force:**\n\n- **A.** 1st\
    \ Sasebo SLF\n- **B.** 2nd Sasebo SLF\n- **C.** 1st Yokosuka SLF\n\n#### NEI\n\
    \n**Menado Troops Command**\n\n- **1.** Menado Company and two 7.5cm guns\n- **2.**\
    \ A Company, Veteran Reserve Corps\n- **3.** Detachment E, Veteran Reserve Corps\
    \ (45 men); coastal guard stationed on the west coast (beyond map confines)\n\
    - **4.** European Militia and Homeguard Company\n- **5.** Menadonese Militia Company\
    \ (beyond map confines, took no part in the fighting)\n- **6.** Town Guard\n\n\
    **Kakas Tactical Command:**\n\n- **7.** C Company, Veteran Reserve Corps, and\
    \ three 3.7cm guns on trucks\n- **8.** D Company, Veteran Reserve Corps\n- **9.**\
    \ Mobile Column (45 men in three armoured cars)\n\n**Reserve:**\n\n- **10.** KV\
    \ Company (Short Service)\n- **11.** B Company, Veteran Reserve Corps\n\n![image](img/common.jpg)\n\
