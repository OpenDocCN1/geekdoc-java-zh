    一队日本摩托化纵队正在横跨吉里（Kediri）布兰塔河大桥。该大桥被完整地占领了。在前面的是一辆在菲律宾缴获的美国半履带坦克，随后是经过深度伪装的日产 80
    卡车。第 48 师长陆军中将桥（Tsuchihashi）多次坚持占领吉里大桥。然而，他的先遣队集中于攻占克尔托索诺（Kertosono）大桥，最初并未按计划派遣部队前往吉里。（Beeldbank
    WW2 – NIOD）


    当泗水泗的破坏行动几乎完成时，1942 年 3 月 4 日，伊尔根（Ilgen）的部队得以出来进行进攻。根据伊尔根的，只有位于恩加维（Ngawi）和博志尼戈罗（Bodjonegoro）的日本前方侦察部队处于活跃状态。他利用机动集团进行包抄，试图夺回哲普（Cepu）。他的机动部队的一部分在布兰塔河后方形成了阻击阵地。由于对敌军部队的评估错误，进攻计划注定失败。部队缺乏火力支持，特别是南部包围圈兵力过弱，更不用说下达的命令性质模糊。荷属东印度群（NEI）反攻的北部轴线与北村部队（第
    48 侦察团）的支援攻击发生冲突并被击退。在南部轴线上，龙（De Iongh）遣队（第 3 骑兵队和第 6 步兵团第 10 营）与阿部（Abe）部队的先遣队进行阻战，在海军营到达之前就被击退。阿部部队于
    1942 年 3 月 5 日到达克尔托索诺。布兰塔河大桥被毁。由于日本军迅速而强大的推进，伊尔根命令的反攻在尚未开始前就已经结束了。


    ![CAM364_056.jpg](img/CAM364_056.jpg)


    一支荷兰海军轻机枪小组，由一名射手和一名助手组成。武器是布雷达 M30 型 7.35mm 轻机枪，是从非洲从意大利士兵手中缴获并由英国提供的。（鹿特丹海军博物馆收藏，45789）


    在克尔托索诺，日本人成功在同一天强行通过布兰塔河。吉里的大桥在当天完好无损地落入日本人手中。布兰塔河后的阻击阵地因此暴露。阿部部队迅速向崩廊（Porong）推进。1942
    年 3 月 6 日，阿部部队由步兵、坦克和飞机支持的先遣队发起了进攻。荷属东印度的防线迅速被突破，崩廊被占领。泗水因此被包围。第 48 师准备于 1942
    年 3 月 9 日进攻泗水。然而，在 3 月 8 日，白旗升起。来自第 17 重野兵兵、配备有 15 厘米榴弹并专为进攻泗水而从满洲运来的炮兵，无需采取行动。


    在计划中的反攻失败以及日本向泗水的包围后，伊尔根做了转向游击战的准备。但投降使得这变得没有必要。1942 年 3 月 8 日下午，日本人进入了泗水。


    ### 投降


    在荷属东印度军队（RNEI）瓦解和殖民政府崩溃的背景下，佩斯曼（Pesman）少将于 1942 年 3 月 7 日至 8 日晚间提出局部投降。然而，今村（Imakura）中将想利用这一机会强制实行全面投降。谈判于
    3 月 8 日在卡里达加提（Kalidjati）举行，一方是今村，另一方是总督范斯塔肯博格-斯塔霍维尔（Van Starkenborgh Stachouwer）和特波滕（Ter
    Poorten）中将。荷方代表团不得不接受不可避免的结果。此外，日本人威胁要轰炸万隆。荷属东印度军队于 1942 年 3 月 9 日投降。


    ![CAM364_060.jpg](img/CAM364_060.jpg)


    这幅由小矶亮（Koiso Ryohei）创作的画描绘了 1942 年 3 月 8 日晚在卡里达加提机场官邸内，日本第十六军司令官与荷属东印度军队指挥官之间的首次会面。日本代表坐在桌子右侧，荷方军事代表坐在左侧。（KTOMM
    Bronbeek）


    英国、澳大利亚和美国军队于 1942 年 3 月 12 日在万隆签署了投降协议。布莱克本（Blackburn）准将希望在荷属东印度军队投降后在万隆南部继续战斗，希望逃往澳大利亚。然而，他无法与澳大利亚取得联系。在没有食物、弹药和药品的情况下，投降只是时间问题。他也接受了不可避免的结果。


    从 1941 年 12 月 7 日至 1942 年 3 月 8 日，约有 1500 名荷属东印度军队的欧洲和印度尼西亚士兵战战死亡。由于荷兰战争坟墓委员会的数据不完整，真实数字可能更高。荷兰海军遭受了
    1650 名伤亡。战俘人数见表 11：


    ![table_p90.jpg](img/table_p90.jpg)


    缺少印度尼西亚战俘的数据。印度尼西亚穆斯林战俘从 1942 年 4 月起开始释放。基督徒安布西人和门纳多人战俘被排除在外。


    日本第十六军的损失为 311 人死亡，832 人受伤。日本海军荷属东印度舰队的损失总计为 285 人死亡，361 人受伤。


    ### *T* 行动（苏门答北部）


    在攻占亚胆并推进至万达矶（Bandar Lampung）后，日本陆军第 38 师也于 2 月 24 日和 3 月 4 日分别占领勿胶鲁（Bengkulu）和占碑（Djambi）。苏门答中北部仍处于荷兰手中。


    ![CAM364_061.jpg](img/CAM364_061.jpg)


    1942 年 3 月 9 日，特波滕（H. terorten）中将与今村中将再次会面，确定细节并签署投降协议。之后，在房屋廊台上拍了合照。中间是手持热带帽的今村中将，随从人员。在他左侧后排，戴着眼镜的是藤三郎（Saburo
    Endo）少将。在今村右侧站着巴克斯尔（R. Bakkers）少将、特波滕中将、曼特尔（P.G. Mantel）中校以及（第二排，曼特尔身后）翻译提斯（J.D.
    Thijs）上尉。（Beeldbank WW2 – NIOD）


    苏门答北部和中部的荷军由轻武装守守步兵、民兵、本土卫队和城镇卫队组成。战术单位不超过一个或多个旅级。在日本人进攻之前，1942 年 2 月亚齐就爆发了反对荷兰殖民当局的武装抵抗。亚地的荷属东印度军队随后被用于平定这一局面，并在日本人登陆后还保护了欧洲人口和印度尼西亚士兵家属的疏散。


    1942 年 3 月 12 日，日本陆军皇卫师团按计划在苏门答北部和东部的四个地点登陆。登陆未遇抵抗。荷属东印度部队遭受了印度尼西亚士兵的大规模逃亡。欧洲士兵维持了凝聚，但缺乏战斗精神。1942
    年 3 月 28 日，剩余的荷属东印度部队投降。


    ### 后续


    在爪哇战役结束后，荷属东印度群岛大部分地区未被占领。在三次行动中，3 月至 5 月之间，新几亚和小松群岛未经战斗被占领。位于新几亚和澳大利亚之间的岛屿随后在
    1942 年 7 月底至 9 月被占领。7 月，这些岛屿由来自澳大利亚的小部队占据（*Plover*行动）。只有新几亚最南部的默劳克（Merauke）仍留在荷兰手中。


