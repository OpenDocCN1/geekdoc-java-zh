    Passo 阵地是一个准备就绪但尚未完全完成的东北方向阵地。该阵地受到右翼攻击部队——`第 228 步兵团第 2 营（减员后）`的从东南方向的进攻。日军再次令防守者感到惊讶。这次攻击是在恶劣天气下进行的，并于
    `1000hrs` 左右将日军带入阵地后方深度。一次缺乏协调的反击很快在日军的火力下陷入停滞。随之而来，Passo 阵地失守。那天晚上，卡皮茨（Kapitz）决定投降。


    `第 1 吴仓陆战部队`（750 人）在`228 步兵团第 3 营第 10 连`的增援下从曼纳多（Menado）抵达，并于`0200hrs`在`Hitulama`附近进行两栖登陆，目标是`Laha
    机场`。在了一个多小时的时间里，登陆行动遭到来自`守卫团第 4 连`一个步兵排的争夺，该部队在掩堡内配备了机枪和迫击炮。此后，日军向内陆的推进由于撤退的荷属（NEI）部队的阻击、极恶劣的天气以及道路网的糟糕状况而缓慢。到达内湾后，陆战部队还遭到了另一侧荷属荷兰电池的炮火攻击。下午结束前，对机场的最初进攻在防守的`2/21
    步团` `B` 连和 `C` 连澳大利亚士兵的枪火和迫击炮火下陷入停滞。`Nona 炮兵连`提供了火力支持。`日本陆军第 10 连`被派入丛林执行包抄。此外，还获得了空中支援。连续两个晚的两次进攻均告失败。`1942
    年 2 月 3 日`早晨，日军进攻者成功渗透了盟军阵地。当天早晨，`第 10 连`在穿越丛林艰难行军后，从后方对防守者发动进攻。Laha 陷落。


    伊藤武雄（Takeo Ito）少将预计在卡皮茨投降的同一天（`1942 年 2 月 1 日`）攻占莱蒂莫尔（Laitimor）南部。当天，左翼攻击部队以两个营并肩转向南方。在安汶市南部，海鸥部队（Gull
    Force）的剩余部分位于：`2/21 步团`的 `A` 和 `D` 连以及大部分支援部队，他们的临时工事并非如预期那样面向海岸，而是面向北方。在斯考特（Scott）的紧急请求下，他在`1942
    年 1 月 31 日`获得了`荷属荷兰守卫团第 2 连`的增援。日军在炮兵和迫击炮火力的掩护下逐渐将澳大利亚和荷属部队驱回。`1942 年 2 月 3 日`早晨，盟军防守者相继投降并被俘。


    `东部遣队`遭受 55 人死亡、135 人受伤，`第 1 吴仓陆战部队`遭受 40 人死亡、50 人重伤。日军声称击杀 340 名盟军士兵，俘虏 2,182
    人（其中包括 782 名澳大利亚人、334 名荷兰人和 1,066 名印尼士兵）。根据澳大利亚方面的报告，有 49 名澳大利亚士兵丧生。`1942 年 2
    月 6 日、15 日和 20 日`，在 Laha 被俘的澳大利亚战俘被`日本海军（IJN）`处决。


    ### 马加锡


    日军想要攻取苏拉威西岛的望加锡（Makassar），并将其作为进攻爪哇的基地。该行动完全是荷属荷兰海军部队的海军事务，由`第 1 基地部队`执行，并由`第
    2 航空队`提供空中。考虑到盟军在望加锡海峡的活动，这次进攻并非从苏拉威岛西部的曼纳多出发，而是通过苏拉威岛东南部的`肯达里（Kendari）`。这种顺时针作战的额外优势是可以分配来自安汶行动的部队。进攻计划于`1942
    年 2 月 9 日`进行。两栖登陆将由`佐保联合陆战部队`执行。


    除了望勒伯斯和曼纳多领地司令部外，望加锡还设有`望加锡部队司令部`。M. 沃伦（M. Vooren）上校指挥苏拉威西岛的所有部队，但在日军登陆后，他缺乏控制分散支队的手段。`望加锡部队司令部`由约
    1,000 名`望勒伯斯和曼纳多守卫团`士兵组成。沃伦上校根据马来战役制定了他的防御理念。他设定的目标是尽可能造成巨大损失，并尽可能长时间牵制敌军。为此，他将通常遵循的直接海岸防御作战理念转变为间接防御：减缓敌人的推进以实施对`Mandai
    机场`的计划破坏，并最终位于山区内陆的`Tjamba 阵地`。整个计划都是防御性的。


    日本海军护卫队遭到潜艇袭击。尽管一艘日本驱逐舰受损，一艘被沉没，但这并未阻止两栖登陆。`1942 年 2 月 8 日（周日至 9 日（周一）`午夜，`佐保联合陆战部队`在望加锡南部
    3 公里两个区域进行了两栖登陆。该市在中午左右被占。荷属防守者成功摧毁了`Mandai 机场`。当天结束时，`日本海军`的行动进攻阶段结束，仅剩清剿行动。`日本海军`声称击杀
    77 名敌军并俘虏 85 名战俘。日方损失为：陆战部队 4 人阵亡、5 人受伤，沉没驱逐舰上有 5 人死亡、6 人重伤。


    荷属守卫队退守到`Tjamba 阵地`。该阵地直到`1942 年 2 月 27 日`才遭到攻击，并在次日被占。剩余的荷属荷兰军队通过逃散瓦解。`1942 年
    3 月 7 日`，荷属投降。


    ### 班杰马辛


    在`1 月 21 日至 23 日`期间的会议上，`日本陆军`建议将行动计划延长十天。准备机场需要一些时间。考虑到距离爪哇的距离，在风险方面将更有效地利用`班杰马辛`。


