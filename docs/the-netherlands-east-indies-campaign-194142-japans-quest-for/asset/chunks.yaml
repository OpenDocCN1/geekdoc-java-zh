    ### MOVING SOUTH


    The Japanese occupation of southern Chinese island of Hainan in 1939 and the deployment
    of troops in northern Indochina in 1940 brought the British possessions of Malaya
    and Singapore, and the Netherlands East Indies, within reach of Japanese land-based
    aircraft. It also put further pressure on the Netherlands to meet the Japanese
    requirements. However, this move southwards sparked a fierce response from the
    United States. It froze Japanese assets on 26 July 1941. (Wait, the text says
    the response from the US). It froze Japanese assets on 26 July 1941. A total shutdown
    of oil supplies was not intended, but in fact the American response boiled down
    to that. Great Britain agreed to it, and the Netherlands reluctantly followed,
    aware that taking part in the embargo meant war with Japan. Japan was faced with
    the oil embargo, and its attempt to peacefully create an alternative in the form
    of increased supplies from the Netherlands East Indies had also failed. For Japan,
    in light of the US stranglehold, only two choices remained open: to yield to US
    demands, or to acquire the necessary raw materials by force. Japan chose the latter.
    The American policy to keep Japan from further expansion in South- Asia through
    economic and military pressure had failed. For Japan to have a chance to win a
    military conflict at all, it would need to act in 1940–41. The war in Europe had
    severely weakened its potential opponents and/or tied down their forces elsewhere.
    The balance of power had shifted in favour of Japan. With the Two-Ocean Navy Act
    of July 1940, the US had initiated a major naval construction programme. Japan
    saw a window of opportunity. It was now or never.


    ![CAM364_003.jpg](img/CAM364_003.jpg)


    Tarakan is a small, hilly and jungle-covered island off the east coast of Borneo.
    The crude oil that was extracted from the island was sold directly as fuel without
    refining. Tarakan accounted for 9 per cent of total NEI petroleum production.
    The island had two drilling sites and an oil tank farm for storage. The image
    shows derricks probably at Pamusian c. 1940. (Leiden University Libraries, KITLV
    176800)


    ## CHRONOLOGY


    1941


    1 December


    Military Aviation Service of the Royal Netherlands East Indies (RNEI) Army (`Wapen
    der Militaire Luchtvaart van het Koninklijk Nederlands-Indisch Leger`, ML-KNIL)
    is mobilized.


    7/8 December


    Japanese attacks on Pearl Harbor, Malaya, Hong Kong and the Philippines.


    8 December


    The Netherlands declares war on Japan.

