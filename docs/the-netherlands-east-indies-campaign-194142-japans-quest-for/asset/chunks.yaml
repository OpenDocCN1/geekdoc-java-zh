    # 爪哇岛防御


    爪哇岛的防御是基于间接沿岸防御，并在三个主要港口实施直接沿岸防御。这三个关键要点主要通过直接沿岸防御以及可能的进攻路线上的阵地进行防御。在从西爪哇岛通往加达的道路上、在连接普里让高原与万隆市的所有通达道路上、在井勒汶与三宝汶之间爪哇岛狭窄地带的南北道路上，以及通往泗水的道路上，都建造了适用于全方位防御的反坦克防御阵地。泗水周围建造了一个延伸阵地。其次，上述关键要点的机动防御将由四个配备辅助武器的团执行。依托当地的防御，机动部队将尽可能采取进攻姿态进行行动，并通过对任何登陆的敌军进行反击来保卫关键要点。


    1940 年后，直接沿岸防御系统得到了扩展，在三宝汶、佩卡农和德加尔港口增加了火炮和沿岸阵地。然而，为此能提供的资源非常有限。


    在爪哇岛，还计划在常规战斗失败后执行游击战。然而，对此并未做多少准备。


    ## 盟国


    ### 1940–41 年参谋会议


    随着来自日本威胁的增加，西方强国对相互咨询的需求也随之增加。1940 年底和 1941 年，这导致在新加坡、雅加达和马尼举行了英荷、英美以及英荷澳多国参谋长级会议。这些会议仅限于军事层面的讨论。美国当时处于中立地位，且不愿或无法做出任何具体的承诺。英国和荷兰在
    1940 年成为盟友，但英国并未保证在遭受日本攻击时援助荷兰荷属印度群岛。荷兰本身在 1940 年后在亚洲也采取了中立路线。这一切都解释了为什么西方强国未能未能达成政治协议。


    在参谋会议上，双方达成协议，将在遭受日本攻击时在作战层面进行合作。西方强国在缺乏海事资源的情况下，规划了远东地区的主要防御行动。他们认为不太可能同时发生日本的大规模行动。针对日本，确定了四种方案。在方案
    B 下，英国人在遭受马来亚攻击后将获得荷兰的军事支持。荷兰强调了新加坡的战略意义，并提供了海军和空军用于防御。军事航空队将提供一个三个轰炸机中队（27 架飞机）和一个战斗机中队，而荷兰皇家海军将提供六至八艘潜艇为此。荷兰水面舰队将用于往返新加坡的护队保护。双方同意，为了阻止日本进入婆罗洲岛和荷属印度群岛，将守住北婆罗洲、北苏拉威西和安曼汶。针对荷兰的这些承诺，澳大利亚表示将为安曼汶和帝汶提供空袭部队和陆军部队。


    并未建立联合多国总部。最多只是交换了联络官。不存在进行大规模多国演习的问题。


    ### 统一指挥部（ABDACOM）1942 年


    太平洋战争爆发后，新结盟的首相温斯顿·丘吉尔和总统富兰克林·D·罗斯福于 1941 年 12 月 22 日至 1942 年 1 月 1 日在华盛顿特区的阿拉卡迪会议上会面。在此期间，盟国在欧洲和亚洲的战争达成了基本协议。战争目标在《国家宣言》中得以制定。政府首脑进一步承诺遵循“德国优先”原则。丘吉尔和罗斯福决定建立一个共同的英美军事咨询机构：联合参谋长会议（CCS）。


    ![../CAM364_019](img/CAM364_019.jpg)


    ABDACOM 的第一次会议于 1942 年 1 月 10 日在雅加达的荷兰海军指挥官（`Commandant Zeemacht`）的正式官邸举行。桌子顶端是
    E.T. Kengen 上校（军事航空队）。他的右侧是 A.H.W. von Freytag Drabbe 中将（荷兰皇家海军，站立）、L. Darvall
    飞行群队长（英国皇家空军）、I.S. Playfair 少将（印度陆军）、H.R. Pownall 中将、A.P. Wavell 将军、G.H. Brett
    中将（美国陆）、L.H. Brereton 少将（美国陆军航空队）、J.E. Hewitt 空军准将（澳大利亚皇家空军）、C.S. Burnett 空军上将（澳大利亚皇家空军）、J.J.A.
    van Staveren 少将（荷兰皇家海军）、A.F. Palliser 少将（英国海军）、G. Layton 中将（英国海军）、C.E.L. Helfrich
    海中将（荷兰皇家海军）、T.C. Hart 海将（美国海军）、W.R. Purnell 少将（美国海军）、H. ter Poorten 中将（荷属印度群岛陆军）和
    P.G. Mantel 上校（荷属印度群岛陆军）。在这次会议上做出了战略和组织决策。（Beeldbank WW2 – NIOD）


    太平洋被视为次要战场。那里的原则变成了“守住领土”。美国陆军参谋长乔治·C·马歇尔将军提议，以联合多国（联合）总部的形式在西南太平洋地区实行统一指挥。考虑到作战区域的广阔，英国人对这种总部的有效性表示怀疑。然而，他们最终不情愿地同意了。英国将阿奇伯·P·韦尔被美国人推荐为最高司令官。


    联合总部命名为 ABDA 司令部（ABDACOM），也称为统一指挥部。11


    ABDACOM 的使命是防御马来屏障（马来亚、爪哇岛、苏门腊），留住缅甸和澳大利亚，恢复与吕宋（菲律宾）的联系。


    ABDACOM 在现有的军种指挥之上建立了一个国际指挥链。ABDACOM 按照英国模式组织，设有多国（联合）空军、海军和陆军总部：`ABDA-AIR`、`ABDA-FLOAT`和`ABDA-ARM`。这意味着荷属印度群岛陆军和荷兰皇家海军失去了具有战略侦察能力的空军。相反，情报集中在联合作战情报中心（COIC）。由于指挥部内各个陆地块的位置分散，`ABDA-ARM`意义不大。各军自顾自为。ABDACOM
    并未实际控制菲律宾。最高司令官本人关注的是保卫新加坡。他很少考虑管辖区域中部和东部的发展。


    ![..CAM364_020](img/CAM364_020.jpg)


    A.P. Wavell 将军于 1942 年 1 月 10 日抵达雅加达。左侧是英国领事长 H.F.C. Walsh，右侧（背对镜头）是 H. ter Poorten
    中将，而面向镜头的是 T.C. Hart 海将（美国海军）。韦尔是一位经验丰富的军官和指挥官，曾任中东司令部总司令，现任印度总司令。作为 ABDACOM 的最高司令官，他的决策并不顺利。他在新加坡消耗了宝贵的资源，并在需要空军增援的地方派遣了陆军。由于他关注新加坡，他几乎没有使用任何资源来应对日本在印度尼西亚群岛中部和东部的扩张。（Beeldbank
    WW2 – NIOD）


