    `H`行动，即对东印度群岛（NEI）的征服，是基于几乎同时从三个方向快速且有计划地进攻爪哇主岛：从西部通过苏门答南部，从中部通过马甲沙海峡，从东部通过班达海。占领并准备苏门答南部、婆罗洲和苏里威的空基地对针对爪哇的空行动至关重要。必须占领提汶岛上的安汶和库巴当，以确保进攻爪哇的左翼安全并切断盟军与澳大利亚之间的联系。


    ![CAM364_022.jpg](img/CAM364_022.jpg)


    位于塔拉干被摧毁的东印度群岛陆军装甲车。由 80 人和 7 辆装甲兵车（`overvalwagen`）组成的移动小组是守军的一部分。这些装甲兵车是在爪哇岛在商业卡车底盘上增加装甲当地制造的。一名军官将这种装甲兵车标记为“垃圾”。装甲需要抵抗小口径火力。然而，一名车辆指挥官报告，他在战斗后能看穿装甲上的弹孔。这辆车在道路上也很转向。此图中装甲兵车上的标志不是荷兰语，而是日军步兵旅司令部的标志。道路右侧，装甲兵车旁躺着两名死去的东印度群岛船员。（每日新闻报）


    ### 塔拉干


    1941 年 12 月底，日本海军开始了空战，旨在消灭塔拉干和曼纳多的盟军空军。1942 年 1 月 4 日，东印度群岛军事航空队撤离了塔拉干机场。海军航空队六天后撤离。由于缺乏预警系统和足够的地面防空，这座先进的机场被证明太容易受到空袭。1941
    年 12 月 26 日，对苏里威北部的丹丹诺海军航空基地发动了空袭。该海军航空基地随后被关闭。


    1942 年 1 月 11 日，日本军同时登陆塔拉干和曼纳多。坂口支队和第 2 久别陆战战斗部队进攻了塔拉干。塔拉干由东印度群岛陆军第 7 步兵团（一支武装增强的野战团）和第
    3 海岸防空炮兵队守卫。守军总人数为 1,365 人。指挥官 S.德·瓦尔中校于 1942 年 1 月 10 日下令摧毁油田和油罐储备。


    日本军在午夜到 04:30 之间在几乎毫无防御的东岸三个地点登陆。12 由于主力部队登陆了错误的海滩，进攻被推迟了。随后，由于荷兰人的抵抗，步兵进攻陷入停滞。一次夜袭成功渗透了防线。两次计划中的荷兰反击未能实施。东印度群岛陆军指挥认为防线已被突破，且没有预备队来填补缺口。12
    日早晨，守军提议投降。


    在不知投降的情况下，东印度群岛卡鲁甘炮兵在投降后击沉了两艘日本扫雷舰——`W13`和`W14`；159 名水员牺牲。日本海军随后于 1942 年 1 月 19
    日处决了该炮兵队的 215 名战俘。坂口支队报告 7 人阵亡，35 人受伤。第 2 久别陆战战斗部队报告 3 人受伤，并声称杀了约 300 名东印度群岛陆军士兵，伤
    40 人，俘 871 人。根据荷兰报告，塔拉干有 33 士兵死亡。这个数字不包括 1942 年 1 月 19 日处决的军事人员。


    ![CAM364_023.jpg](img/CAM364_023.jpg)


    塔拉干林加斯起火的油罐区。在接到日本舰队接近的通知后，摧毁计划于 1942 年 1 月 10 日的下午和晚上开始实施。钻井场和油罐区被摧毁。（每日新闻报）


    ### 曼纳多


    1942 年 1 月 11 日上午，东部攻击部队联合佐保联合陆战战斗部队和第 1 横须陆战战斗部队进行了两栖和空降作战，从西部的曼纳多和东部的肯马对分散的东印度群岛部队实施包围圈击，同时日本伞兵队通过曼纳多二号机场（朗安）从中心进攻。曼纳多由
    B.F.A.希尔穆勒少校领导的苏里威和曼纳多领地司令部属曼纳多部队司令部的守军守卫。人数约为 1,500 人，分布在若干战斗价值迥异且互不联系的单位中。


    ![CAM364_025.jpg](img/CAM364_025.jpg)


    日本海军伞兵队对苏里威岛曼纳多二号机场（朗安）的进攻是亚洲的首次空降作战。第 1 横须陆战战斗部队从第 1 航空群的 27 架运输机上跳下。其中一架飞机被友军误击落。武器将在人员跳出后
    150 米处投掷。唯一的 37 毫米毫米反坦克炮是由水上飞机运送的，降落在丹丹诺湖上。（每日新闻报）


    曼纳多部队的沿海防御很快被对苏里威岛曼纳多二号机场（朗安）的日本海军伞兵袭击攻破，城市被占领。曼纳多海军基地在下午由东印度群岛部队发动了反击，但缺乏协调且力量薄弱。伞兵占领了机场。经过短暂但激烈的战斗后，伞兵队占领了机场。从曼纳多内陆的进攻被拖延行动阻挡。随后，东印度群岛的抵抗瓦解了。占领曼纳多让陆战战斗部队损失了
    44 人阵亡，184 人受伤。伞兵运输机被战斗机击落。日军声称俘虏 140 人。根据荷兰记录，20 名士兵死亡，其中 11 人被处决。随着塔拉干和曼纳多的陷落，北方防线已被突破。对于韦尔来说，由于他强调新加坡，东印度群岛北部和东部基地的防御并非首要任务。他希望为后续战斗保留稀缺的空军。荷兰人和美国人显然如此。他们共同部署空军对抗日本的进攻。


    海军航空队和陆军对塔拉干的日本登陆舰队发动了任务。机场受损，但总体结果有限。日本战斗机造成了沉重打击。海军航空队共损失了 6 架轰炸机和 23 名机员。1942
    年 1 月 13 日，海军航空队结束了对岛的攻击。


    海军航空队缺乏进攻曼纳多的手段，因此针对当地的任务由澳洲空军（RAAF）和美国空军（FEAF）执行。结果很糟糕。日本海军在曼纳多提到“敌机的激烈反击”。幸运的是，攻击是由单机进行的，而且他们的技术并不高。我们观察到，如果我们被大量敌机编队攻击，我们的损失将是灾难性的。”这种评估同样适用于塔拉干。


    ### 巴里巴干


    两周后，日本军于 1942 年 1 月 24 日进行了第二次跃进。同样，同时进行了两次两栖作战。坂口支队登陆了巴里巴干，而日本海军进攻了苏里威的肯达里。


    ![CAM34_026.jpg](img/CAM364_026.jpg)


