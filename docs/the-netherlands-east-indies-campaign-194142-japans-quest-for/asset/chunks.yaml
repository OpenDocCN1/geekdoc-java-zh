    1942 年 2 月 14 日（周六上午 11:26，`第 2 突击团`的伞兵从`突击航空队`的 25 架运输机上跳下。在巴胆勿一机场（Palembang
    I），第一梯队由团部总部、信号连、`第 4 连`和`第 2 连`的一半人员（180 人）组成，降落在东南方向约 3 公里处；`第 2 连`的两个排（60 人）立即降落在巴胆勿一的西侧。机场防守军受到空中轰炸和机扫射的压制，这为伞兵降落后提供了足够的时间进行武装和重组。这次空降行动并非完美。英国战斗机发动了两次攻击，但均被击退。伞兵在跳伞时并未携带武器弹药；这些物资是单独装在容器中投放的。由于地形复杂，伞兵往往未能找回这些集箱。他们通常只配备手枪和手榴弹，无法产生足够的火力来迅速克服抵抗并夺取机场。一些配备`LMG`（轻型机枪）的伞兵在通往机场的离市
    8 公里处建立了路障，从而阻碍了巴胆勿与机场之间的交通。


    巴胆勿一机场的驻守部队由`第 15 重防空团`的一个连（配备 8 门 3.7 英寸高射）、`第 78 连`的一个排以及`第 89 连`的一个排（均属于`第
    35 轻防空团`，配备 8 门 40 毫米波福斯炮）、150 名荷属东印度陆（RNEI）士兵（配备两辆装甲运兵车）以及`258`和`605`战斗中队的地面防御小组（约
    60 人）组成。由于高级军官病假，H.G. Maguire 指挥官在周六担任基地指挥。英国防空兵通过组成地面防御队和反伞兵巡逻，能够负责自己阵地的安全。这些人员接受过武器和地面防御训练，并熟悉了炮位周围广泛的环境。机场防守军全天都在激烈抵抗进攻的伞兵。当防空炮对空中和地面目标耗尽了有限的弹储备后，在地面防御小组的掩护下，部分火力撤离到巴胆勿。在剩下约
    70 人后，Maguire 指挥官认为没有办法抵御夜间攻击。他和部下在夜幕前不久乘卡车向西北撤退。跑道虽然布了地雷，但并未被毁，因为装有火机的仓库在攻击中烧毁了。机场完好无损地落入日本人手中。


    11:30，`第 2 突击团``第 1 连`攻击了炼油厂。60 人落在普拉朱（Plaju），`第 3 排`（39 人）落在双格戎（Sungei Gerong）东南侧。因此，日本人不知道的巴胆勿二机场（Palembang
    II）未受攻击。中午左右，对伞兵部队的空中支援停止了。


    ![CAM364_032.jpg](img/CAM364_032.jpg)


    巴胆勿`第 10 步兵团`第 2 连`的五名曼纳多岛步兵。该连发起了反击，将日本伞兵从普拉朱炼油厂驱出。背景中可以看到正在燃烧的炼油厂。士兵们配备了`M95`重复步枪、`klewang`短刀和手榴弹。他们穿着
    1937 型灰绿色野战服，配有护腿，戴着带皮质护颈的钢盔（防晒）。布隆贝克博物馆）


    炼油厂采取了全方位防御，每个炼油厂约有 150 人的驻守部队。防御重点是抵御来自望夷河的进攻。然而，日本人的进攻是从南方发起的。在普拉朱炼油厂，大部分伞兵降落在西南侧，部分人落在炼油厂内部。他们在现场建立了据地。荷印防御者收到了来自英国反伞兵防空小组（20
    人）的援军，并开始搜索。民兵排清扫了炼油厂西侧的居住区。下午初，加强后的曼纳多`第 10 步兵团`第 2 连（减员后）从普拉博穆利（Praboemoelih）赶。到傍晚，该连已几乎清完了整个区域，第二天准备清理最后的一个约
    15 人小组。日本排对双格戎炼油厂的进攻立即被击回。1942 年 2 月 14 日，日军报告在跳伞的 329 人中，有 39 人战死，48 人受伤。


    Vogelesang 中校带领一支由两辆装甲车的领地部队排（减员）以及加强后的`第 10 步兵团``第 1 连`向巴胆勿一进发。民兵被命令在市北建立阻击位置。`第
    10 步兵团``第 1 连`的反击直到 16:30 左右才开始。普拉博穆利的`第 10 步兵团`核心和普拉朱的部分驻守部队当天上午正在演习。因此，响应开始得晚了。在巡视苏门答腊的澳洲第一军团总工程师
    C.S. Steele 将的建议下，英国空军（RAF）在望夷渡口组织了一个由武装英国空军人员组成的桥头堡。几次到达巴胆勿一的不协调行动在日本人路障处失败了。`第
    10 步兵团``第 1 连`执行的反击并不顺利，但在下午清理了路障。然而，由于夜幕降临，其推进被停止。


    ### 空军总部状况


    那天上午，巴胆勿空军总部一片混乱。Hunter 空运司令下令撤离巴胆勿一并将战斗机移回巴胆勿二。随后命令将飞机移往雅加达。该命令在中午左右被 ABDA-AIR
    取消，飞机返回。巴胆勿的英国空军总部被清空，并在下午重新占领。然而，其发射器和密码已被毁。


    ABDA 联合司令部海上做出了反应。前往南门答腊的日本船队于 1942 年 2 月 9 日至 10 日从占兰湾出发，并在 2 月 13 日上午接受了侦察。随后，在当天晚上和第二天早晨受到了来自巴胆勿英国飞机的攻击。日本人没有遭受损失。盟军海军舰队——“联合打击群”也被部署用于对抗日本舰队。小泽次长部署其航空部队应对这一威胁。由于失去了空中掩护且失去了突然性优势，Doorman
    决定取消行动。


    ![../img/9781472843524Art002_battlescene.jpg](img/9781472843524Art002_battlescene.jpg)


    ### 1942 年 2 月 14 日巴胆勿普拉朱炼油厂的反击


    针对 1942 年 2 月 14 日日军对巴胆勿普拉朱和双格戎两个炼油厂的空降攻击，团级`第 2 突击团`只能分配`第 1 连`（人数较少，99 人）。


    日军伞兵在中尉中尾的带领下，于当地时间 09:30（南门答腊）跳伞炼油厂。60 人落在普拉朱炼油厂，大部分在西南侧，部分人落在炼油厂内部。他们成功在场内建立了据点，并在油罐周围土堤后的掩体壕内、油罐顶部以及炼油厂上层平台上建立了防御。


