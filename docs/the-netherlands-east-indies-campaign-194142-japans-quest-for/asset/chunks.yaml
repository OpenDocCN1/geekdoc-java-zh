    approach consisting of an air campaign aimed at gaining air superiority by taking
    out enemy airpower at the landing site, but also in the hinterland. Only then
    could the amphibious landings take place. The IJN reported overly optimistic results
    from their air campaign. Partly as a result of this, their amphibious landings
    regularly faced Allied air strikes and attacks by naval units. Despite the previous
    air campaign, these turned out to be insufficiently disabled, if at all.


    The Netherlands East Indies campaign took place in an extremely unfavourable period
    of the year: the wet monsoon. The Japanese air operations suffered from bad to
    very bad weather. It was not always possible to fly and provide air cover to the
    land and naval forces. In addition, heavy rainfall rendered airfields virtually
    unusable. The sodden airfields and runways that were too short had a negative
    impact on the effectiveness of the air branch. The Japanese had underestimated
    this point in their planning. On the other hand, Japanese ground troops regularly
    used rain and mist to surprise the NEI defenders.


    The RNEI Army, in terms of operations, tactics and command, turned out to be qualitatively
    inferior to its Japanese opponent. The NEI was committed to a defensive struggle
    in an alliance. However, it had no influence over these allies. The interests
    with and between the Allies were not parallel ones. Great Britain and the United
    States were also too weak at this stage of the war to slow the Japanese advance,
    let alone stop it. A combined (multinational) headquarters was set up only a month
    after the outbreak of the war. This was too late. Operationally, the concept of
    indirect defence with horizontal bombers failed. The Military Aviation Service
    had too few bombing and combat aircraft to successfully implement it. Horizontal
    bombers were also rather unsuccessful against ships. The Japanese often achieved
    tactical surprise against the NEI defenders. On Ambon and Timor, they made amphibious
    landings on coasts that were considered unsuitable.


    ![CAM364_062.jpg](img/CAM364_062.jpg)


    Three of the four NEI static coastal batteries were located on the south-west
    coast of Tarakan. At Peningki these were two batteries each of 3 x 7.5cm L/40
    guns and the Karoengan Battery of 4 x 12cm L/40 guns to guard the mine barriers
    in front of the Lingkas Front. The batteries are still partly intact including
    the guns. This picture dates from around 2010 and shows a rusty, rapid-fire 12cm
    L/40 No. 2 gun on a concrete foundation of Karoengan Battery. The gun had a cradle
    gun carriage on a pivot mounting with an armoured shield. It was a naval artillery
    piece made by Krupp in 1901\. The gun was operated by a gun crew comprising gun
    commander and five gunners plus an assistant and ammunition carriers. (Private
    collection)


    Tactically, the aggressive and mobile Japanese put the RNEI Army on the wrong
    track. Japanese air superiority was paralyzing to the NEI units. When aircraft
    approached, troops immediately sought cover and remained there for long periods
    of time. Against such an opponent, the NEI troops and in particular the Indonesian
    components showed insufficient willingness to fight. The RNEI Army faltered psychologically
    in terms of military capability. Combat intelligence was often lacking. As a result,
    the strength and direction of Japanese attacks were unknown. This made realistic
    counter-measures extremely difficult. The RNEI Army failed to demonstrate sufficient
    control when attacking. Planning and coordination were moderate to poor. As a
    result, counter-attacks took place in a fragmented manner and with forces that
    were too weak. In the counter-attack of the 2nd Infantry Regiment and Teerink
    Group, the advance to contact was started according to the rules, i.e. when the
    attackers were within range of their artillery – *c*. 15km. As a result, troops
    jumped off kilometres ahead of the attack target and had to advance in battle
    formation for hours through tough terrain under tropical temperatures. The result
    was the loss of the element of surprise and exhaustion among the attacking troops
    – and all this in the face of enemy air superiority. Artillery was deployed in
    a hesitant and fragmented manner. Australian Major J.H. Brown had pointed out
    the shortcomings in an exercise in November 1941: ‘No coordinated fire plan had
    been prepared nor had any recce been made by battalion commanders … Three hours
    after daylight the two attacking battalions had moved forward about a mile and
    still well behind the front line were having breakfast. The impression was that
    the attack suffered from lack of drive from above and would have been fatal in
    practice.’ Brown saw the main weakness ‘in the battalion and regimental commanders
    who lack practical experience’. Based on his findings, the Australian Director
    of Military Intelligence stated that ‘the army is well equipped. Their training
    is mainly defensive and their knowledge of offensive tactics is more theoretical
    than practical.’[15](#9781472843531-9.xhtml_footnote-015)


    Command was sometimes chaotic. Division commanders had direct contact with company-level
    commanders and vice versa, bypassing the hierarchical command lines.


    With the conquest of the Netherlands East Indies, Japan had seized coveted petroleum
    production and refining capacity and other strategic raw materials. Limiting ourselves
    to petroleum, the wells and installations in the Netherlands East Indies had been
    largely destroyed. These demolitions were aimed at preventing their use for six
    months. The Japanese managed to restart extraction and refining relatively quickly,
    although pre-war production figures were not achieved. Palembang accounted for
    78 per cent of Japan’s aviation fuel consumption and 22 per cent of crude oil.


    ![table_p93.jpg](img/table_p93.jpg)


    The transport of extracted and refined petroleum to Japan turned out to be a bottleneck.
    Japan lacked a tanker fleet with sufficient capacity. In 1939, the Japanese tanker
    fleet comprised 38 ships with a total capacity of 3,124 million barrels. That
    was less than 10 per cent of annual imports. Oil imports were largely transported
    by ships from other countries, ones with which Japan came into conflict. This
    presented the country with an almost unsolvable problem.


    The US submarine offensive and aircraft attacks played havoc among the Japanese
    tanker fleet. ‘Japan ended up continuing the war, again suffering from an extreme
    shortage of fuel’.[16](#9781472843531-9.xhtml_footnote-014)'
