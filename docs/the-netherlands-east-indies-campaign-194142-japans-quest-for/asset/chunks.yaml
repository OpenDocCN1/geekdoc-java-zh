    # 第 4 连岸防与防空炮


    ## 8. Nona 营 (4 x 15cm L 40 海军炮)

    ## 9. Galala 营 (2 x 3.7cm 海军炮)

    ## 10. Halong 营 (1 x 7.5cm L 55 海军炮)


    ### Gull Force（Gull Force）部队：

    * 2/21 营（加强），澳大利亚澳大利亚帝国陆军（AIF）

    * 2/21 营 B 连（减员）和 C 连

    * 2/21 营 A 连

    * 2/21 营 D 连，连同第 5 排驻守在 Nona 山

    * 14 第 6 排及支援部队

    * 15 步兵排


    ![image](img/common.jpg)


    ## 事件


    除非另有说明，时间均采用日本标准时间（`JST` – `UTC+09:00`）。马鲁古时间（`MCT`）为 `UTC+08:30`。


    ### 1942 年 1 月 31 日，星期六


    1. 0240 和 0250：东部分遣队在 Laitimor 东南岸进行无阻夜间水上登陆。右侧攻击部队向 Passo 行军，左侧在恶劣天气下通过两条陡峭的山径向安汶市行进。

    2. 位于 Rutung 和 Sojadiattas 的荷兰属印度尼（NEI）民兵排阻了日军西侧进攻。

    3. 0100：加强后的第 1 久世陆上登陆部队（`约 1,000` 人）在 Hitoelama 进行夜间水上登陆。来自守卫营第 4 连（加强）的荷兰属印度尼排在预设阵地给予了顽强抵抗。

    4. 0320：Hitoelama 的荷兰属印度尼对手被击溃，登陆完成。荷兰属印度尼分遣队撤退并在进路上进行阻击行动。

    5. `约 0800 (MCT)`：荷兰属印度尼援军被分批送到 Rutung 和 Sojadiattas 山区分遣队。他们遭遇了两个推进的日军左侧攻击列，大部分被击散。Kapitz
    上校已耗尽了预备队。

    6. `0730 (MCT)`：日军右侧部队进攻侧翼的 Passo 位置，击溃了 Batoegong 的侧翼阵地并占据了东部据点。`0830 (MCT)`
    和 `0930 (MCT)`：两次连续的反击几乎没有进展，Passo 位置几乎被攻占。

    7. 在大雨中沿着狭窄的道路行进时，第 1 久世陆上登陆部队遭到对岸荷兰属印度尼岸防电池的猛烈炮火。第 1 久世陆上登陆部队第 2 连和第 228 兵团第
    3 营第 10 连在下午对 Laha 空场的进攻被击回。

    8. 1700：日军左侧攻击部队进入安汶市。

    9. 第 228 兵团第 3 营第 10 连进入丛林，从北侧高地包围空场。


    ### 1942 年 2 月 1 日，星期日


    10. 0130：Kapitz 上校和 Passo 位置的荷兰属印度尼部队投降。

    11. 1100：日军左侧进攻从安汶市向南推进。Gull Force 在西南方向构筑了深度防御，但在白天该阵地被包围。

    12. 位于 Amahoesoe 的澳大利亚第二道线遭到攻击。该位置由营部、2/21 营 D 连以及 Gull Force 的服务和支持部队防守。


    ### 1942 年 2 月 1 日/2 月 2 日，深夜


    13. 2200：日军第 2 连成功渗透 2/21 营 B、C 连之间的东侧阵地，但防线守住了，日军攻击者被钉在原地。

    14. Gull Force 指官 Scott 上校误认为 Nona 山已被日军占据。他下令从 Amahoesoe 线撤退到 Eri。


    ### 1942 年 2 月 2 日，星期一


    15. 1200：取消对 Laha 的进攻，转而请求空中空袭和海军舰射支援，并请求援军。

    16. 0630：东部分遣队占据了 Nona 山（514 高）。

    17. 上午：由第 15 驱逐舰队护航的第 21 扫队开始清理外湾海雷。 11 号和 12 号扫雷艇撞中海雷并受严重损坏， 9 号沉没。


    ### 1942 年 2 月 3 日，星期二


    18. 0115：第 1 久世陆上登陆部队对 Laha 发起第二次夜间进攻，突破了澳大利亚人的防御。`0615`，空场被攻占。日军援军在澳大利亚投降后到达。

    19. 在炮击轰炸下，由于食物、水和士气耗尽，Gull Force 于 `1530` 投降。


    动员后，东南婆罗洲守卫营人数为 `1,250` 人。它被分配负责两个空场——Kotawaringin 和 Oelin 的防御。2 月 10 日上午，日军占领了打腊（Palembang）。（注：提供的文本此处有缺失/重叠）。


    ## L 行动：进攻打腊


    南苏门答腊由打腊和望加地区指挥部防御。该指挥部由一个地区总部、六连组成的打腊和望加守卫营、一个破坏团、打腊民兵团和望加民团组成。为了防御空场和油田设施，领地部队加强了一个机枪连和一个由八
    门 `7.5cm` 炮和两 门 `4cm` 防空炮组成的炮兵连。守卫营还配备了五辆 `APC`：两辆位于打腊 I，三辆位于打腊 II。总人数为约 `1,300`
    人。领地指挥官为 `L.N.W. Vogelesang` 上校。


