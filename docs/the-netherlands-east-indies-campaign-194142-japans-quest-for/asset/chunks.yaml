    \nRemmelink, Willem (ed. and trans.), *The Invasion of the Dutch East Indies,*\
    \ The Corts Foundation/Leiden University Press, 2015\n\n——, *The Operations of\
    \ the Navy in the Dutch East Indies and the Bay of Bengal,* The Corts Foundation/Leiden\
    \ University Press, 2018\n\nStille, Mark, *Java Sea 1942: Japan’s Conquest of\
