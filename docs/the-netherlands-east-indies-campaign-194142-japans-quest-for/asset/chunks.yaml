    **19.** Under shelling and bombardment, and with dwindling food, water and morale,
    Gull Force surrenders at 1530hrs.


    After mobilization, the South-Eastern Borneo Garrison Battalion numbered 1,250
    men. It was assigned to the defence of two airfields, Kotawaringin and Oelin.
    On the morning of 10 February 1942, the Japanese overland task force occupied
    Oelin. The airfield had been destroyed and the NEI defenders had partly withdrawn
    to Java. Bandjermasin was also occupied that day. The at times highly challenging
    advance through the jungle took its toll: 80 per cent contracted malaria, and
    nine men died of this. On 25 February 1942, Oelin was commissioned by the IJN
    23rd Air Flotilla as a relay base.


    ### PALEMBANG (OPERATION *L*)


    The main focus of the Japanese offensive against the Netherlands East Indies was,
    until the first half of February 1942, in the Makassar Strait and the eastern
    part of the Indonesian archipelago – the clockwise IJN operation. This would change
    in mid-February with the attack on Palembang, South Sumatra. The Japanese also
    significantly increased the pace of their offensive. On 14 February 1942, they
    attacked Palembang, followed on 19 February by the landing on Bali and the next
    day a landing on Timor. In less than a week, three landing operations and an air
    raid on Port Darwin severed the last lines of communication between Java and the
    outside world.


    Sumatra is an elongated island (1,750km by 400km) with a central mountain range
    along the west coast, many volcanoes and on the east coast deep rivers cutting
    across a wide, swampy coastal plain. The island is covered with old-growth forest.
    Palembang was the primary city of South Sumatra, with over 109,000 inhabitants
    in the early 1930s. It lay 105km inland on the Musi River. The main oil wells
    were at Djambi. The road network was limited. A railway line ran from Palembang,
    and a partly asphalted, partly gravelled main road featuring several concrete
    bridges connected it to Bandar Lampung (Oosthaven), some 483km distant. This line
    of communication was accessible in many places from the east coast via navigable
    rivers, and was thus vulnerable. The roads around Palembang were mostly causeways
    through swamps. In Palembang there was no permanent crossing over the Musi River.
    This crucial connection was maintained by several ferries. The river was navigable
    by sea-going vessels to Palembang.


    Palembang was not only an extremely important springboard for the Japanese advance
    towards Java, but also an important oil production area. East of the city lay
    two refineries: Plaju and Sungei Gerong. These refineries jointly processed one-third
    of total NEI oil production. This was the only source of high-quality jet fuel
    (100 octane) in the NEI. Palembang I Airfield, also known as Talangbetutu, was
    15km north of the city. It was the city’s civilian airfield with an L-shaped,
    paved runway. Palembang II military airfield, still under construction, was *c*.
    75km south-west of Palembang. It was brought into use in late December 1941 and
    early January 1942, and consisted of a large clearing in the jungle. Partly because
    of this, this airfield remained unknown to the Japanese.


    ![9781472843524_Map005.jpg](img/9781472843524_Map005.jpg)


    Operation *L*: the attack on Palembang


    South Sumatra was defended by Palembang and Djambi Territorial Command. The command
    consisted of a regional headquarters, the Palembang and Djambi Garrison Battalion
    of six companies, a Demolition Corps, Palembang Town Guard and Djambi Town Guard.
    For the defence of the airfield and the oil installations, the territorial troops
    were reinforced with a machine-gun company and a detachment of artillery of eight
    7.5cm guns and two 4cm AA guns. The garrison was also given five APCs: two at
    Palembang I and three at Palembang II. The total strength was *c*. 1,300 men.
    The Territorial Commander was Lieutenant-Colonel L.N.W. Vogelesang.'
