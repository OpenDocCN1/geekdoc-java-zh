    South Sumatra. To the left is the Musi River. The refineries jointly accounted
    for one-third of total NEI oil production. This was the only source of high-quality
    aviation fuel (100 octane) in the NEI. The main oil wells were at Djambi. `NKPM`
    was a subsidiary of the American Standard Oil Company. `BPM` was owned by Royal
    Dutch Shell. (Leiden University Libraries, KITLV 2790)


    Japan looked at ways of peacefully accessing strategic raw materials that the
    US was denying it, and its gaze fell upon the Netherlands East Indies.


    ### OIL: FUEL FOR SHIPS, PLANES AND WAR


    Oil was the Achilles’ heel of the Japanese Empire. It depended almost entirely
    on imports for its consumption, as shown in [Table 1](#9781472843531-2.xhtml_tab1).
    The United States supplied more than half of Japan’s oil consumption, and thus
    an American oil embargo would hit Japan hard. The Netherlands East Indies provided
    a logical, if not sole, alternative to American oil, one that could meet Japan’s
    needs.


    ![table_p6a.jpg](img/table_p6a.jpg)


    In addition to oil, the Netherlands East Indies was also an important source of
    natural rubber, tin and bauxite. In 1938, worldwide demand for natural rubber
    was 933,000 tons: the Netherlands East Indies accounted for 302,872 tons, or 32
    per cent of the world market. In 1938, 27,737 kilotonnes of tin was extracted
    there out of the `c`. 148,100 long tons worldwide, in third place after Malaya
    and Bolivia. The Netherlands East Indies also quarried 245,354 tons of bauxite
    in 1938. It also produced 90 per cent of the cinchona plant, and thus had a monopoly
    on the main anti-malarial drug: quinine.


    ![table_p6b.jpg](img/table_p6b.jpg)


    Given the importance of the Netherlands East Indies as a supplier of strategic
    raw materials, Japan was committed to bringing the area within its sphere of influence:
    the Greater East Asian Co-Prosperity Sphere. Between 1940 and 1941, Japan began
    negotiations to increase its influence in the Netherlands East Indies and to acquire
    the necessary strategic raw materials by peaceful means. However, Japan complicated
    these negotiations by establishing an alliance with Germany and Italy in September
    1940: the Tripartite Pact. The Netherlands had been at war with and subsequently
    occupied by Germany since May that year. The Japanese threat was clearly felt.
