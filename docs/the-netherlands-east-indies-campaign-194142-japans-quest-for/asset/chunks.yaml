    The Netherlands and Australia had been important partners during the staff conferences.
    This immediately ended with the outbreak of war in Asia. Strategic policy became
    an Anglo-American affair, with the Americans in the lead. The Dutch, Australian
    and also the New Zealand governments were deliberately not consulted and instead
    presented with a `fait accompli`. This not only applied to the institution, but
    also to appointments. British or American officers were appointed to all major
    command positions. Only `ABDA-ARM` was reserved for a Dutchman: the Army Commander
    `H. ter Poorten`. This clearly indicates the importance of that command. This
    state of affairs led to tensions with Australia and the Netherlands.


    In early January 1942, upon British request, it was decided to move the Australian
    I Corps, consisting of the Australian 6th and 7th divisions, and the British 7th
    Armoured Brigade from the Middle East to the Netherlands East Indies. `Wavell`
    assigned a division to South Sumatra and a division along with the tank brigade
    to Central Java. With the fall of Singapore in sight, `Wavell` decided to divert
    these reinforcements to Burma. It was clear that with the fall of Singapore, the
    defence of India was his new priority. Australian political and military leadership
    no longer supported this British intention. Australian troops were needed in Australia.
    On 19 February 1942, the `CCS` decided to send no further land reinforcements
    to Java. Some Australian and British units, however, still disembarked there.


    The question was whether the planned reinforcement of Java with ground troops
    could stop the Japanese advance – not to mention whether these would be operational
    in time. Given Japanese sea and airpower, a successful defence of the Netherlands
    East Indies was only possible with a large-scale reinforcement of Allied air and
    naval assets. However, sufficient aircraft were not available, while the Americans
    were unwilling to risk the US Pacific Fleet in the Western Pacific.


    ![9781472843524_Map004.jpg](img/9781472843524_Map004.jpg)


    ## Japanese Southern Offensive


    The Japanese Southern Offensive took place during the rainy season with a high-pressure
    system above the Asian mainland and the resulting North-East Monsoon in the Northern
    Hemisphere and the North-West Monsoon in the Southern Hemisphere. The wet monsoon
    brings moist air from the South China Sea and Pacific with heavy rain showers
    in the afternoon. Rain and poor visibility made air operations difficult. Atmospheric
    disturbances hindered flight movements and led to poor radio communications. The
    vegetation mostly consisted of tropical jungle. The few larger cities formed,
    as it were, islands in the jungle. The road network was limited in the extreme.
    Java was an exception. The main island was well connected with a modern road network
    and with rail and tramways.


    ## THE CAMPAIGN


    ### PHASE I OPERATIONS


    On 7/8 December 1941, Japan launched `Operation A-Go` with a simultaneous, broad-front
    offensive against assets of the United States and Great Britain. Although not
    directly attacked, the Netherlands declared war on Japan on 8 December 1941. In
    accordance with the agreements at the staff conferences, the `NEI Military Aviation
    Service` moved an aircraft group (wing) and a squadron of fighters to Malaya.
    The Royal Netherlands Navy dispatched a light cruiser and submarines. These units
    were placed under British operational command. In addition to the significant
    contribution of the Military Aviation Service and Royal Netherlands Navy, the
    `RNEI Army` sent four brigades (equivalent to sections) of the `Marechaussee Corps`,
    an infantry unit from Aceh specializing in anti-guerrilla operations. They were
    deployed behind the Japanese lines in Malaya in January and February 1942. Its
    strength was `c`. 142 men, including the Indonesian porters. After some successful
    actions, part of the detachment managed to return to Sumatra in March 1942.


    After the Japanese landings in Siam and northern Malaya, shipping became available
    for `Operation B`: the conquest of British Borneo. `Detachment F (Kawaguchi Detachment)`
    landed from Indochina on 16 December 1941 at Miri and on 24 December 1941 at Kuching.
    The `RNEI Army` saw this as a serious threat and responded with bombing by the
    Military Aviation Service. The Royal Netherlands Navy deployed submarines against
    the Japanese amphibious operations at Kuching. These attacks inflicted considerable
    damage, but failed to halt the Japanese advance.


    Davao, a port city on Mindanao in the Philippines, was occupied on 20 December
    1941, with southern Jolo following suit on 25 December 1941. With the occupation
    of Kuching, Davao and Jolo, the bases for the attack on the Netherlands East Indies
    were in Japanese hands. Instead of the initially planned Palau, the geographically
    favourable and larger Davao became the assembly point for `Operation H`. While
    the operations against Malaya and the Philippines were still in full swing, the
    `IJN` switched to Phase II operations, the attack on the NEI, on 26 December 1941.
    The oil island of Tarakan off the coast of Borneo and Menado on North Sulawesi
    were the first targets to be attacked.


    The state of the airfields at Kuching, Davao and Jolo turned out to be far worse
    than expected. The naval construction units needed more time to prepare these
    bases. Davao and Jolo were only fully available from 8 January 1942. Despite these
    delays, the Japanese Southern Army wanted to bring forward the attack on Java
    by a month. It sought to capitalize on the favourable development of operations,
    maintain momentum and to be ahead of possible reinforcements of the US Navy and
    British Royal Navy. Given the delays in the commissioning of captured air bases,
    and the limited number of transport and naval escort ships available, the `IJN`
    argued against the bringing forward. Under great pressure from the `IJA`, the
    `IJN` finally agreed, in the `Cam Ranh Agreement` of 1 January 1942.


    ![CAM364_021.jpg](img/CAM364_021.jpg)


    From 1937, the `NEI Aviation Service` reorganized the existing three reconnaissance
    and fighter squadrons into horizontal squadrons. To this end, it purchased the
    American-built `Glenn Martin B-10 Model 139` and `Model 166` twin-engine bomber
    in 1936. The aircraft in the photo are the `WH-2 (Wright Holland-2)` version with
    registration numbers `M-514` and `M-539`. Three of the crew members are visible.
    The aircraft bear the national markings introduced on 15 November 1939. Both aircraft
    were assigned to `2/3rd Aircraft Group` in December 1941 and were lost at Sembawang
    (Singapore) or later at Kalidjati. (Museum Bronbeek)


    ![CAM364_024.jpg](img/CAM364_024.jpg)


    An Ambonese gunner with a magazine-fed 20mm `Solothurn S18-1000` anti-tank rifle
    (`tankbuks` M38). In total, only 72 such rifles were available. The `S18-1000`
    provided the infantry battalion with a portable anti-tank weapon. An anti-tank
    rifle group (ten men) with two anti-tank rifles was allocated to the `4th Company
    (heavy weapons)` of each infantry battalion. (Bedbank WW2 – NIOD)


    ![table_p38.jpg](img/table_p38.jpg)


    The Allies recognized the importance of Davao and Jolo, and both locations were
    attacked from the air by Dutch and American units.


    ### PHASE II OPERATIONS: THE CONQUEST OF THE NEI


    The Empire of Japan had on 8 December 1941 not declared war on the Netherlands.
    It was still attempting via Switzerland to bring the Netherlands East Indies peacefully
    within its sphere of influence as a protectorate, following the Indochina model.
    However, the Netherlands did not respond to this. Japan subsequently declared
    war on the Netherlands on 11 January 1942.

