    Colonel Toshishige Shoji was an old acquaintance of Imamura’s. They had served
    together in various units for quite some time. On 2 March 1942, at Subang, Shoji
    was surprised by the counter-attack of the NEI Mobile Unit. The Dutch were unaware
    of the presence of his headquarters and drove on. In September 1942, the 230th
    Infantry Regiment, 38th Division was moved to Rabaul and deployed to Guadalcanal.
    There it suffered heavy casualties against American troops. The failure on Guadalcanal
    resulted in Shoji being transferred from a front-line unit to a depot and garrison
    unit. At the end of the war, he was the commanding officer of the Sendai Area
    Command, Japan. This photo was taken after his promotion to major-general in March
    1944. (Public domain)


    ![CAM364_006.jpg](img/CAM364_006.jpg)


    Major-General Saburo Endo commanded the 3rd Air Division. This unit was involved
    in the Malaya, South Sumatra and the Java campaigns. He was an experienced staff
    officer. On 3 March 1942, he flew to Kalijdati. His aircraft smashed the major
    NEI counter-attack on the airfield. Endo then supported Shoji’s attack against
    Ciater. On his own initiative, he shifted the focus from providing air support
    for the advance in West Java to the attack on Bandung. It was also Endo who, before
    the capitulation meeting, explicitly threatened the Dutch delegation with the
    bombing of Bandung. He subsequently became Chief of the General Affairs Department
    of the Army Air Force HQ. In 1945, Endo was President of the Aeronautical Ordnance
    Bureau and President of the Council of Aeronautical Industry. The photo shows
    Endo after his promotion to lieutenant-general, wearing service dress M1943 (Type
    3). (Mainichi Newspapers)


    Major-General Shoji was sentenced to death in 1949 by the Temporary Courts-Martial
    at Jakarta for war crimes at Kalidjati, Subang and the Ciater Pass. However, this
    sentence was converted into a ten-year prison term following an appeal.


    ### Major-General Saburo Endo (1893–1984)


    Major-General Saburo Endo was the commander of the Imperial Japanese Army Air
    Service (IJAAS) 3rd Air Division. Endo graduated from the Military Officers School
    in 1914 and from the Military Staff College in 1922. He became an artillery officer.
    He gained international experience at the disarmament conference in Geneva in
    1927 and the disarmament conference of the League of Nations in 1931. As a staff
    officer, he was assigned to the North China Area Army in 1937. Endo made the switch
    to the air force late in his career. He was an aggressive commander. In Java,
    Endo became annoyed by the slow progress of the 2nd Division and therefore wholeheartedly
    supported Shoji’s decision to attack Bandung. On his own initiative he moved the
    centre of gravity of the air support given by his 3rd Air Division from the 2nd
    Division to the Shoji Detachment. He was praised by the Twenty-Fifth Army and
    the Third Air Force for the conduct of the 3rd Air Division during the Malaya
    and NEI campaigns.


    ### Major-General Shizuo Sakaguchi (1887–1947)


    Major-General Shizuo Sakaguchi became commander of the infantry group of the 56th
    Division in 1941. For the Southern Offensive, this group was reorganized into
    the 56th Mixed Infantry Group or Detachment A (Sakaguchi Detachment). Major-General
    Sakaguchi took part in the entire campaign against the Netherlands East Indies,
    from Tarakan to Java. In addition to air bases, his unit captured important oil
    wells and installations. To reach his goal, Sakaguchi was ruthlessly inventive
    as well: ruthless, because he partially executed his threat to kill the RNEI Army
    garrison and Dutch civilians at Balikpapan when the oil installations were destroyed;
    and inventive on account of his ability to improvise, as evidenced by the last-minute
    adjustment of the attack plan at Balikpapan on the basis of new information and
    the deployment of Indonesian police officers who had defected. For the attack
    on Bandjermasin, after naval support ceased, he formed a flotilla consisting of
    small vessels to attack the city from the sea as well. His ambition is evidenced
    by offering his unit for the invasion of Java, despite it not being part of what
    was planned.


    ![CAM364_007.jpg](img/CAM364_007.jpg)


    Major-General Shizuo Sakaguchi was the commander of the Infantry Group of 56th
    Division. He led the Sakaguchi Detachment during the NEI campaign. He was ambitious
    and inventive, but also ruthless. In 1943, he became a divisional commander in
    China with promotion to lieutenant-general. He retired from active duty in April
    1945. (Public domain)


    ### ALLIED


    ### Hein ter Poorten (1887–1968)


    Hein ter Poorten was Chief of the General Staff of the RNEI Army from 1939 to
    1941. After the fatal plane crash that killed his predecessor, he became commander
    of the army in the Netherlands East Indies and head of the Department of War (Army
    Commander) on 23 October 1941. He was promoted to lieutenant-general. Ter Poorten
    also became ABDA-ARM (i.e. ABDA land forces) commander with the establishment
    of ABDACOM.


    Ter Poorten was born in Buitenzorg (Bogor) in Java in 1887 and was appointed an
    officer in the artillery of the colonial army in 1908. Ter Poorten was a pioneer
    in the field of military aviation. He was the first Dutch professional officer
    to obtain an international flying licence (1911). From 1915 to 1917, he served
    with the Experimental Flight Unit. Between 1919 and 1922, he attended war studies
    at the Netherlands Staff College (*Hogere Krijgsschool*). Ter Poorten became inspector
    of the artillery in 1937. In 1939, the former Army Commander referred to him as
    ‘a particularly gifted officer, a man of original ideas, broad gaze and clear
    insight … A powerful chief, smooth and yet deliberate in his decisions’. He was
    a strong supporter of cooperation with the British in Malaya and Australia, and
    with the Americans in the Philippines. Ter Poorten wanted to hold onto Singapore
    and retain Java as the main base for an Allied counter-offensive.


    Two months after the outbreak of the war, 54-year-old Ter Poorten was exhausted
    and had to seek medical attention. As a result, he was not physically and mentally
    at his best in the period under discussion. Far from being a general optimist,
    he held no illusions about the chances of victory, and was therefore criticised
    for being negative. The Army Commander is said not to have shown leadership during
    the fighting. He heavily depended on his chief of staff, Colonel (later Major-General)
    Bakkers.


    Relations with the NEI governor general and commander-in-chief Jhr. Starkenborgh
    Stachouwer, an aristocratic diplomat, were difficult. This was apparent even in
    the capitulation negotiations with the Japanese in Kalidjati. It was clear to
    Ter Poorten that Java was lost and that the Japanese expected a general capitulation.
    The governor general, who was also present at the initial discussions, wished
    to negotiate a partial capitulation and reach an agreement on the continuation
    of civil administration. He reproached Ter Poorten for defeatism.


    ![CAM364_008.jpg](img/CAM364_008.jpg)


    Lieutenant-General H. ter Poorten had been the chief of staff for two years when
    he was appointed RNEI Army commander early in October 1941, following the death
    of his predecessor. He also became ABDA-ARM commander in January 1942. The land
    areas of operation were spread far apart, so that this command actually embraced
    little. The burden of the command turned out to be heavy. Ter Poorten looks robust
    in this photo. However, he became exhausted and was anything but fit when the
    Japanese Sixteenth Army set foot on Javanese soil. Ter Poorten is dressed in the
    September 1941 new field dress, but with short sleeves. As an artillery officer,
    he wears the badge of the artillery on the shoulders of his shirt. (Private collection)


    ![CAM364_010.jpg](img/CAM364_010.jpg)

