    位于苏拉威西岛的甘达里二号机场被描述为印尼群岛最好的机场之一；它拥有三条跑道（1,000 米 x600 米），且易于延伸。与其他大多数被攻占的机场不同，它可以立即投入使用。一个缺点是该机场远离海岸，位于内陆
    25 公里处。1942 年 2 月 27 日，第 21 航空飞行队总部从曼纳多转移到该机场。甘达里为日本军提供了针对安汶本和提汶进行行动的重要基地，从而切断了通往爪哇锡与澳大利亚的通信线。这张照片拍摄于
    1947 年。（莱顿大学图书馆，[CC BY 4.0](https://creativecommons.org/licenses/by/4.0/））


    到 1942 年 1 月底，川口支队已开始大规模的包围攻势。陆路上，一支部队向新加万移动，并于 1942 年 1 月 27 日占领了被彻底破坏的机场。第二支部队通过临时海运进入，相继落在西婆里洲西岸的四个地点。荷兰荷属印度尼陆（RNEI）西婆里守备团兵力约
    1,000 人，士气已受挫，他们负责防御西婆里。英国印度军第 15 普遮团第 2 营为其增援，该部队从古晋撤出，剩余兵力 783。这支力量只能减慢日本人的推进。在
    1942 年 3 月总投降后，剩余的荷印尼军队投降了。少数人继续进行游击战。第 15 普遮团第 2 营撤退到南婆里，并于 3 月 31 日投降。日方损失为：19
    人死亡，2 人重伤，31 人受伤。他们报告击杀敌人 270 人，俘获战俘 182 人。


    由于遭到破坏、地面潮湿以及长期被毁的陆路供应线，新加万二号机场无法用于进攻爪哇的登陆行动。因此，日本海军第 22 航空飞行队于 1942 年 2 月 8 日将总部迁往古晋。由于古晋条件恶劣，飞机无法加满燃油。这使得对爪哇的空袭变得异常困难。


    随着新加万二号、巴厘巴帕潘的芒加、甘达里二号以及萨马林达二号的消失，战略机场的第二线已被打破。


    ### 安汶


    安汶是一个形状不规则的岛屿，海岸线长，面积仅为 716 平方公里。它由两个陆地组成：希图和莱蒂莫，之间被一个巨大的内湾隔开。岛上有中低山，山峰高度在 460
    米至 1,000 米之间。这些山非常陡峭，密密茂着次生森林。建筑区外很少道路，只有动物小径和步行路径。


    1936 年后，安汶岛被开发为荷兰皇家海军的辅助支持基地。该岛位于印尼群岛东部的中心位置。内湾提供了一个避风的天然港口。它有两个空军：哈龙海军航空基地和拉哈机场，后者有一条长
    1,700 米的混凝土跑道。


    守备军由马鲁库群守备团和第 4 岸防高空炮连组成。守备团由一个总部、三个连、一个机枪连、一个`kortverband`（短期役）连、一个（欧洲）民兵连、一个老兵预备队以及位于安汶外的支队组成。此外，还有四辆装甲车被送到安汶。守备军还包括印尼民兵营和城乡守卫队。总兵力约
    2,600 人。除了这些陆军外，军事航空队在拉哈驻留了一支三架战斗机的巡逻队。荷兰皇家海军在安汶驻留了一个水上机中。


    为了加强拉哈的防御，澳大利亚鸥兵军（Gull Force）于 1941 年 12 月 17 日抵达，由鸥兵军总部、加强后的第 2/21 营、第 18 反坦克炮
    C 连、来自 2/11 野战连的一个工程师排以及一些支援要素组成，总兵力约为`c`.1,170 人。建立了一个地区联合总部来指挥荷印尼军队和澳大利亚部队。在拉哈，鸥兵军特别受到疟疾和痢疾的困扰。在日本登陆前两周，鸥兵军指挥官更换为
    W.J.R. Scott 中校。后者与荷印尼地区指挥官之间的协作不尽如人意。


    日本海军想要切断盟军的安汶–古甲通信线。作为进攻曼纳多前消除盟军空军的一部分，日本海军第 21 航空飞行队轰炸了安汶。这是一系列空袭的开始，随后是武装侦察。在登陆前不久，又发生了新的空袭，这次是母舰飞机。在日本的压力和已被侦察的入侵舰队面前，盟军总部（ABDACOM）于
    1942 年 1 月 27 日命令撤出剩余的航空单位。


    荷印尼地区指挥官 J.L.R. Kapitz 中校遵循一项计划：由荷印尼军队对海岸位置进行固定防御，鸥兵军的一部分防御拉哈机场，其余鸥兵军和部分荷印尼军队组成掩护力量或总预备队。1942
    年 1 月 10 日，根据 Kapitz 的提议，决定鸥兵军防御南部。预计莱蒂莫岛东南岸不会登陆。考虑到地形，荷印尼-澳计划本质上是防御性的。当 1942
    年 1 月 30 日明确日本人将在南部登陆时，Kapitz 将防御重心转移到帕索位置：那里有三个连、一个机枪连和一个民兵排。该位置位于安汶市以北，处于希图和莱蒂莫之间的地峡上。借此，Kapitz
    拉开了与南部鸥兵军的距离。盟军力量因此进一步碎片化，可能被一个已经强大的对手逐个击败。


    南方特遣队的攻击单位和航空任务遣队对安汶发动了进攻。第 2 航空母战斗师听归攻击单位指挥。这是一支规模相当大的力量。1942 年 1 月 31 日（周六）凌晨
    0240 至 0250 之间，日本东部支队（伊藤支队，由第 228 步兵团和第 38 师组成）从香港经由达沃，登陆在安汶毫无守备的东南岸的两个海滩。这威胁了安汶要要固海湾的后方。在成功登陆后，左侧攻击单位（主力）在倾盆如雨和暴风般的西风（蒲福特
    8 级）下，沿着丛林小径分两列纵队横过山脊。天气在中午左右放晴。加强后的荷印尼防守者被击退。下午，日本人进入了安汶市。荷印尼陆军和澳大利亚士兵被隔离开。


    ![CAM364_030.jpg](img/CAM364_030.jpg)


    拉哈机场的防御示意图，位于安汶岛内湾的沿海平原上。它是荷属印度尼西亚少数拥有混凝土跑道的机场之一。营房、仓库和避难所没有分散或伪装，而是就在机场附近，这使得机场特别脆弱——更何况地面防空火力很薄弱，只有荷印尼陆军的两门
    4cm 高空炮和三门 M.30（柯尔特-布朗宁）12.7mm 高空炮。（荷兰军事史研究所）

