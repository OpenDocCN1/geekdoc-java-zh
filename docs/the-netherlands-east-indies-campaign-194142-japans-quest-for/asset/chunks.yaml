    克拉根（Krag）是一个理想的登陆点，拥有一个长 35 公里的海滩，附近有主要的连接道路。坂口支队的先锋——金浦营于`1942 年 3 月 1 日``0700
    时`在克拉根东南方向 6 公里处上陆。另外两个单位——松本营和山本营——直到次日才登陆。它们的运输船速度缓慢，因为在入侵巴厘岛期间遭受了损坏。坂口支队（不包括留在婆罗尼岛的熊部支队）由第
    146 步兵团第 2、3 步营、两个野战炮营、一个装甲车队以及附属`第 259 独立运输连`组成。`坂口的目标是位于南部港口的城市齐拉塔榜（Cilacap），攻占该地将切断从雅加达和万隆的逃跑路线。在第二阶段，它将清扫中爪哇剩余的敌军部队。


    驻守中爪哇的印尼荷兰共和国军（RNEI）第 2 师在 P.A.Cox 少将指挥下，于`1942 年 2 月 22 日`因`第 4 步兵团`迁往西爪哇而减员。剩余的是南方集团、两个机械骑兵队（第
    4 骑兵队和卫队骑兵队）以及`齐拉塔榜支队`。南方集团是一个薄弱的步兵团，于 1942 年 1 月通过合并三个兵员和装备不足的步兵营和一个新组的、由半训练印尼兼职士兵组成的机枪连而形成。该部队几乎完全机械化。南方集团的任务是“通过在塞拉尤河后方部署确保安全和保护[齐拉塔榜港]”。`1942
    年 3 月 2 日`，Cox 少将不得不将其最精锐的——第 21 步兵团左半部分移交给万隆集团。


    ## 1942 年 3 月 5 日至 7 日恰特尔关的日军突破


    在日军在爪哇岛成功实施两栖登陆后，卡里达加蒂机场在当天上午被完好地占领。印尼荷兰军反复的反击均被击退。`3 月 5 日`，庄司支队从苏邦（Subang）出发，带一个步兵营和`第
    3 航空师`的充足空中支持进攻了恰特尔阵地。万隆市北部的恰特尔阵地由万隆集团的一个加强步兵连进行守卫。在主防御线被突破后，急赶的印尼荷兰军援军试图制止日军推进。一旦这些力量也被消灭，通往万隆的路就敞开了。


    地图网格每隔 1 公里（0.62 英里）显示一次


    ![CAM364_BEV003.jpg](img/CAM364_BEV003.jpg)


    ### 日军


    #### 庄司支队 (Shoji Butai)


    **A.** 第 230 步兵团第 2 营（若松）


    **B.** 第 230 步兵团第 1 营（笠头）


    ### 印尼荷兰军 (NEI)


    #### 万隆集团


    **1.** 第 1 步兵团第 2 连

    **2.** 第 5 步兵团第 1 连

    **3.** 第 2 步兵团第 2 连

    **4.** 第 21 步兵团左半部分

    **5.** 第 2 山地炮营第 2、3 炮

    **6.** 前线救护站

    **7.** Paardekooper 支队 (Van Altena 支队)

    **8.** Siahaya 支队 (Van Altena 支队)

    **9.** 装甲步兵连（来自机动部队）

    **10.** 苏门答腊西岸支队（两个连）

    **11.** 第 4 步兵团

    **12.** 第 9 步兵团

    **13.** 第 15 步兵团

    **14.** De Vries 营

    **15.** 第 2 山地炮营第 1 炮


    ![image](img/common.jpg)


    ## 事件


    除非另有说明，时间均采用爪哇哇标准时间（JBBT – UTC+07:30）。


    #### 1942 年 3 月 5 日，星期四


    **1.** `1600 时 (JST)`：日军第 230 步兵团第 2 营（若松）由三个连组成，在第 4 坦克团第 1 连和第 38 山地炮团第 3 营两个炮连的支持下，沿苏邦–万隆路推进，意外遭遇了恰特尔阵地。该营展开部署并接到命令进攻。山脊上的阵地由（欧洲人的）加强后的第
    1 步兵团第 2 连守卫，并有第 2 山地炮营第 3 炮提供支持。日军利用崎岖的地形和阻挡掩堡射击视线的树木、地面雾和大大雨，成功突破了该阵地。傍晚时分，日军的推进停止。部队没有撤退，而在野外露宿了一夜。


    **2.** `1630 时`：印尼荷兰军在苏邦–万隆路上路上使用六辆装甲车进行侦察。三辆装甲车被毁。


    **3.** 临夜，印尼荷兰军援军到达，但第 1 步兵团第 2 连撤退。第 4 步兵团团长 De Veer 上校兼任恰特尔防御指挥官，组织了深度防御。夜间，日军派出了侦察队。


    #### 1942 年 3 月 6 日，星期五


    **4.** 凌晨，日军步兵突然进攻了第 2 步兵团第 2 连和第 5 步兵团第 1 连的左侧翼。。随后的第二波进攻方直接从道路形成。受三辆坦克支持的日军进攻（若松）被挡，损失惨重。印尼荷兰军被迫撤退。战斗开始，第
    21 步兵团左半部分大部分溃散撤退。恰特尔阵地被破。若松并未立即追击印尼荷兰军，而是巩固了自己的阵地。白天，日军第 3 航空师的飞机轰炸并扫射了印尼荷兰军的阵地交通线


    **5.** De Veer 上校将第二道线移至三路交汇处。`1700 时`，期待已久的日军进攻。De Veer 命令反击，并战死。日军进攻被击退。在托赫克建立了圆形防御。下午或
    3 月 7 日凌晨，日军处决了 74 名印尼荷兰俘。


    #### 1942 年 3 月 7 日，星期六


    **6.** `0200 时`：由 Paardekooper 上尉指挥的托赫克守军被命令撤往万隆。


    **7.** 万隆集团命令 Van Altena 中校在万隆北部建立新的防御线，兵力包括第 2 步兵团的三个减员兵营、第 4 步兵团和苏门答腊西岸支队。然而，几乎所有部队都表现出疲劳且缺乏凝聚力。


    **8.** `1300 时 (JST)`：日军第 230 步兵团第 2 营（若松）从主路西部开始推进。沿小径和崎岖地形的进展自然缓慢。利用黑暗降临和持续的降雨，其进攻部队进攻并袭击了万隆西部的第
    9 步兵团总部，瓦解了分散的印尼荷兰军营。第 3 航空师继续空中拦截


    **9.** 日军第 230 步兵团第 1 营（笠头）通过汽车运输从卡旺出发，稍随沿主路。`1600 时`左右，它试探了万隆北部印尼荷兰军第 4 步兵团的部署位置。


    **10.** 在日军第一次进攻后，印尼荷兰军第 4 步兵团有序地向万隆撤退。日军第 2 营于傍晚进入万隆。万隆集团指挥官 Pesman 少将派遣一名军官谈判局部投降。

