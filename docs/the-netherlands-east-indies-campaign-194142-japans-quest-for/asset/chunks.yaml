    随着被日本败，荷属东印度岛也于 1942 年 3 月 8 日解体。随后是三年的严酷占领。欧洲在荷属东印度岛的影响几乎被完全抵消。战俘部分被派往爪哇岛之外，例如在弗洛斯岛修建机场，在缅甸和泰国之间修建铁路，或在苏门答腊以及日本矿区工作。在被俘的
    42,233 名欧洲战俘中，有 8,200 人（19.4%）死亡。欧洲人部分被关押在平民营中，估计涉及 100,000 人。其中 16,800 人死亡。约有
    120,000 名欧洲人留在营外。


    日本人被视为“解放者”并受到欢迎，却给印尼人造成了沉重的代价。据报道，饥荒导致了 250 万印尼人的死亡。日本雇佣了大量主要是爪哇人作为工人。其中一些`romusha`（强迫劳工）被临时雇佣。估计有
    16 万至 20 万人在部署在爪哇岛之外。许多人在此过程中死亡。


    日本的占领成为了印尼独立运动的催化剂。其占领政策并非旨在向“大东亚共荣圈”内赋予独立。印尼必须为日本的战争努力提供服务。随着战争局势的改变，日本逐渐改变了其态度。1944
    年 9 月，日本宣布将在近期内给予印尼独立。1945 年 8 月，它更进了一步，承诺独立。然而，在 1945 年 8 月 15 日，日本被迫投降，取消了进一步就印尼独立合作的可能性。


    在日本投降后的后的第二天，印尼领袖穆哈默德·哈塔（Mohammad Hatta）和苏加诺（Sukarno）采取了主动，于 1945 年 8 月 17 日宣布印尼独立。在经历了另外四年的谈判与战争后，荷兰才承认了这一点。


