    the results were relatively limited. Japanese Zeke fighters inflicted a heavy
    toll. The Military Aviation Service lost a total of six bombers and 23 crew members.
    On 13 January 1942, the Military Aviation Service ended attacks on the island.


    The Military Aviation Service lacked any means of attacking Menado, and so missions
    against the latter were flown by the RAAF and FEAF. The results were poor. The
    IJN spoke at Menado of ‘fierce counter-attacks by enemy aircraft. It was fortunate
    that [the enemy] caused no [major] damage to us because their attacks were carried
    out by single planes, and, moreover, their skill was not very great. We observe
    that our losses must have been disastrous should we have been attacked by a considerable
    number of [enemy planes] in formation.’[13](#9781472843531-8.xhtml_footnote-012)
    Such an evaluation could apply equally to Tarakan.


    ### BALIKPAPAN


    After two weeks, the Japanese made their second leap forward on 24 January 1942\.
    Again, two amphibious operations were performed simultaneously. The Sakaguchi
    Detachment landed at Balikpapan, while the IJN attacked Kendari on Sulawesi.


    ![CAM364_026.jpg](img/CAM364_026.jpg)


    The Menado II Airfield (Lagoan) under airborne attack by the 1st Yokosuka SLF.
    The Japanese paratroopers jumped directly onto the target from an altitude of
    150m. The airfield was still under construction, but the runway could support
    fighter aircraft. The Japanese put the airfield into operation immediately. On
    16 January 1942, the HQ of the 21st Air Flotilla moved in from Davao. (Mainichi
    Newspapers)


    ![CAM364_027.jpg](img/CAM364_027.jpg)'
