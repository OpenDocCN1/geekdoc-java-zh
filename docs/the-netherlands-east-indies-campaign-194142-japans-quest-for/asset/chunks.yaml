    # The Netherlands East Indies


    ## ORIGINS OF THE CAMPAIGN


    In December 1941, Japan took up arms against the Western Powers in what it claimed
    to be a struggle of self-defence and self-preservation. In just a few months,
    Japan subdued South-East Asia and created a Greater East Asian Co-Prosperity Sphere.
    It took the Allies nearly four years to defeat Japan and retake the area.


    The Japanese Southern Offensive, Operation `A-Go`, consisted of three major campaigns:
    Malaya, the Philippines and the Netherlands East Indies. This work describes the
    attack on and conquest of the Netherlands East Indies. Among the questions it
    will seek to answer are: What place did the Netherlands East Indies (NEI, present-day
    Indonesia) occupy in the Japanese war goals? How did Japan intend to achieve this?
    What were the defensive plans of the Netherlands East Indies? And how did the
    campaign progress at the operational and tactical level?


    ### JAPANESE EXPANSION


    Japan’s expansion into China brought it into conflict with the other major powers
    in Asia. Border fighting even took place with the Soviet Union in 1938 and 1939.
    Great Britain could do little to counter this expansion. Even prior to World War
    I, it lacked the means to simultaneously maintain battle fleets in European and
    Asian waters. It was the United States that took the lead in curbing Japan’s drive
    to expand. The US wished not only to halt the Japanese expansion of power, but
    also to curb it. To this end, it imposed ever more stringent economic sanctions
    and military pressure by moving, in 1940, most of the US fleet from the US Pacific
    coast to Hawaii, and stationing `B-17` long-range bombers in the Philippines.
    The sanctions would be lifted if Japan withdrew from China and French Indochina.
    Japan thus would not only have to give up its empire and aspirations to become
    a great power, but also would have to submit to the economic supremacy of the
    United States.


    ![CAM364_002.jpg](img/CAM364_002.jpg)


    In this 1930s aerial photo, the Bataafsche Petroleum Maatschappij (`BPM`) oil
