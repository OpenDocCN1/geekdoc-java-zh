    \ H.P., *Empires in the Balance: Japanese and Allied Pacific Strategies to April\
    \ 1942,* Orbis Publishing, London, 1982\n\nWomack, Tom, *The Allied Defence of\
    \ the Malay Barrier 1941–1942*, McFarland and Company, Jefferson, 2016\n\n## ABOUT\
    \ THE AUTHOR\n\nMarc Lohnstein holds an MA in history; his main focus is the former\
    \ Dutch colonies in Indonesia and Surinam. He specializes in colonial army and\
    \ police organization, equipment, uniforms and tactics, and has published several\
    \ studies on these subjects. He is currently assistant curator at The Royal Home\
    \ for Retired Military Personnel and Bronbeek Museum, at Arnhem in The Netherlands.\n\
    \n## ILLUSTRATOR\n\nGraham Turner is a leading historical artist, specializing\
    \ in the medieval period. He has illustrated numerous titles for Osprey, covering\
    \ a wide variety of subjects from the dress of the 10th-century armies of the\
    \ Caliphates, through the action of bloody medieval battles, to the daily life\
