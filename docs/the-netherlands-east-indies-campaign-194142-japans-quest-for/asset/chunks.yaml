  trans: '


    爪哇、马杜拉、巴厘岛和龙目岛等外地区以及海岸、防空炮和搜照灯人员的荷属东印度群（NEI）部分动员。


    ## 1942 年


    ### 12 月 9 日

    NEI 军队进行部分动员。


    航空群（`Vliegtuiggroep`，`Vl.G.`）和 RNEI 陆军军事航空队的一个战斗机中队驻守新加坡。


    ### 12 月 10 日

    英国海军 Z 支队被毁：`威尔士王子号`战舰和`复仇号战舰被日本飞机击沉。


    ### 12 月 11 日

    RNEI 陆军进行总动员。


    ### 12 月 12 日

    NEI 军队参加总动员。

    雀击部队（Sparrow Force）在提汶岛登陆。


    ### 12 月 16 日

    日本军登陆并占领英属婆罗洲的美里。


    ### 12 月 17 日

    海鸥部队（Gull Force）在安汶岛登陆。

    荷兰-澳远征军在荷属提汶的迪利登陆。


    ### 12 月 24 日

    日本军登陆英属婆罗洲的古晋市。


    ### 12 月 27 日

    日本军队占领位于南海的 NEI 丹巴马兰群岛。


    ### 12 月 29 日

    第 19 轰炸群（`USAAF`）从澳大利亚转移至爪哇的马兰。


    ### 1 月 10 日

    A.P. 韦维尔将军及其随从抵达巴达维（雅加达）。


    ### 1 月 11 日

    日本对荷兰宣战。

    日本军登陆塔拉干岛和曼纳多。曼纳多被攻占。

    第 26 野战炮兵旅总部和第 131 野战兵团第 2 营（均为美国陆军）在爪哇泗水登陆。


    ### 1 月 12 日

    塔拉干岛的 RNEI 陆军守军投降，并于次日正式生效。


    ### 1 月 15 日

    美英荷澳共同盟军司令部（`ABDACOM`）成立。


    ### 1 月 18 日

    第 225 号轰炸机群总部（`RAF`）从新加坡转移至苏门答腊的巴胆陆。


    ### 1 月 24 日

    日本军水上登陆并攻占巴厘巴板盆（东属婆罗洲）和肯达里（苏拉威锡）。

    在巴厘巴板盆发生海战。


    ### 1 月 27 日

    日本军攻占西属婆罗洲的醒加万二机场。


    ### 1 月 30 日

    日本军占领西属婆罗洲的坤甸打市。


    ### 1 月 31 日

    日本军水上登陆安汶岛并攻占安汶市。


    ### 2 月 1 日

    RNEI 陆军主力部队在安汶岛投降。

    在苏门答腊巴胆陆成立第 226 号战斗机群总部（`RAF`）。


    ### 2 月 2 日

    英国第 6 重防空团（减员制）和第 35 轻防空团第 78 炮队（`RA`）抵达巴胆陆。


    ### 2 月 3 日

    海鸥部队在安汶投降。


    ### 2 月 4/5 日

    望加斯锡海峡发生海战。日本飞机对联合打击部队进行空袭。


    ### 2 月 4 日

    英国第 77 重防空团（`RA`）、第 21 和第 48 轻防空团（`RA`）以及第 16 防空旅总部在雅加达登陆。


    ### 2 月 7 日

    日本军占领三马�林达（东属婆罗洲）。


    ### 2 月 9 日

    日本军水上登陆并攻占望加斯锡。


    ### 2 月 10 日

    日本军占领万井加尔马辛。


    ### 2 月 14 日

    日本军空降于巴胆陆并攻占巴胆陆一机场。

    英国隶属国王皇家骑兵猎团第 3 团 B 连在南苏门答腊登陆。


    ### 2 月 15 日

    日本军登陆邦加岛（Bangka）。

    在加斯帕尔海峡发生海战。

    日本军占领巴胆陆。

    新加坡陷落。

    `ABDACOM`决定撤离南苏门答腊。


    ### 2 月 19 日

    日本军登陆并攻占巴厘岛。

    日本飞机对澳大利亚北部达尔文进行空袭。

    联合参谋长本部决定不派遣澳大利亚第一军团前往爪哇。

    澳大利亚第 7 师先遣部队部分在雅加达登陆并组建了“黑部队”（Blackforce）。


    ### 2 月 19/20 日

    巴东群海峡海战（巴厘岛）。


    ### 2 月 20 日

    日本军登陆提汶岛并攻占古巴当和迪利。


    ### 2 月 22 日

    决定从爪哇撤出美国陆军航空（`USAAF`）部队。


    ### 2 月 23 日

    雀击部队在荷属提汶投降。

    `ABDACOM`解散。


    ### 2 月 27 日

    美国“兰格利号”（USS `Langley`，载有战斗机）在爪哇岛南部沉没。


    ### 2 月 27/28 日

    爪哇海战。


    ### 2 月 28 日/3 月 1 日

    日本军登陆爪哇岛。

    在万丹湾发生海战（巽德海峡海战）。


    ### 3 月 1 日

    日本庄司队（Shoji Detachment）夺取卡里加提机场。

    东群（`USAAF`）开始从爪哇撤离返回澳大利亚。


    ### 3 月 2 日

    RNEI 陆军机部队（`Mobiele Eenheid`）在苏邦进行反击。


    ### 3 月 3/5 日

    日本第 2 师部队与“黑部队”在勒乌利亚昂发生战斗。


    ### 3 月 3 日

    第 2 步兵团（加强后）和 RNEI 陆军 Teerink 小组对卡里加提机场的反击因空袭而失败。


    ### 3 月 5 日

    日本庄司队攻击西亚特防御阵地。

    RNEI 陆军撤离雅加达，随后被日本占领。


    ### 3 月 6 日

    日本军突破西亚特防御阵地。


    ### 3 月 7 日

    RNEI 陆军万隆群组提出局部投降。


    ### 3 月 8 日

    关于 RNEI 陆军完全投降的谈判在卡里加提进行。

    日本军占领芝拉恰普和泗水。


    ### 3 月 9 日

    RNEI 陆军投降。


    ### 3 月 12 日

    爪哇岛盟军武装部队投降。

    日本皇卫师团登陆苏门答腊北部。


    ### 3 月 28 日

    位于北部和中部爪哇的 RNEI 陆军投降。


    ## 敌指挥官


    ### 日本方面


    **今村义须中将（Lieutenant-General Hitoshi Imamura，1886–1968）**是 1942 年第十六军的司令官。他于 1907
    年任官。除了这些海外派遣地外，他还曾担任总参谋部参谋。1940 年至 1941 年期间，他担任训练副监察总。1941 年 11 月 6 日，他被天皇任命为第十六军司令官。由于以及设备等问题，他在爪哇战役期间对第十六军拥有指挥权和指挥权。


    今村在日本军中以“作为一名拥有果敢和不屈战斗精神的指挥官的勇敢”而闻名。他是一位高明的组织者，并愿意承担巨大的作战风险。战后，他被澳大利亚政府指控战争罪。他被判定有罪并判处十年监禁。1948–49
    年，雅加达的临时军事法庭也就婆罗洲和爪哇的战争罪对其进行了审判。但他被判无罪。


    **庄司寿志佐（Colonel Toshishige Shoji，1890–1974）**是 1941 年第 38 师第 230 步兵团团长。该团参加了 1941
    年 12 月的征服香港战役和 1942 年 3 月的进攻爪哇战役。今村亲自挑选庄司率领一支小规模的团级战斗群在爪哇执行一项重要的次要行动。他信任庄司会独立行动并在必要时表现出适当的主动性。庄司确实做到了这些，但并非如今村预期的那样。事实上，他违反明确命令，自行攻击了西亚特防御阵地，这一大胆的行动赢得了成功：他在两天内突破了荷属防御的核心，并决定了战役。


