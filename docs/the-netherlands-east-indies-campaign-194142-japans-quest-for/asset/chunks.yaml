    A light machine-gun section of the 1st Yokosuka SLF led by an officer, in position
    at Menado II Airfield (Langoan). The group weapon is a `Type 96 (1936)` 6.5mm
    Nambu light machine gun. The machine gunner wears the trade badge of seaman 2nd
    class. (Public domain)


    ### The Preparation of Tarakan Airfield


    The preparation of Tarakan Airfield was seriously delayed. As a result, the `IJA`
    and `IJN` were not only forced to postpone the attack on Balikpapan for three
    days, but also to cancel the planned deployment of paratroopers. To take the oil
    installations (almost) intact, Sakaguchi sent two Dutch prisoners of war with
    an ultimatum to Balikpapan. Destruction of natural resources and facilities would
    be punished with death for the Dutch military. In addition, Sakaguchi adjusted
    the operation plan. Using surprise, a strong unit would infiltrate the hinterland
    via the river, and cut off the retreat route. The garrison would soon be forced
    to surrender. Two Indonesian police officers from Tarakan were said to have acted
    as guides. On 16 January 1942, nine Japanese fighters were stationed at Tarakan.
    Two days later, they began air strikes against Balikpapan.


    ### Defense of Balikpapan


    Balikpapan was an important oil port in eastern Borneo, and contained an oil refinery
    with a large tank park (160 tanks). The city was located on a large bay surrounded
    by swamp and heavily overgrown hill country. The `NEI` garrison, numbering 1,200
    men, consisted of the `6th Infantry Battalion`, a field battalion (reduced) with
    two infantry companies and a machine-gun company, and the `2nd Coastal and AA
    Artillery Company`. The garrison was ordered to defend Balikpapan against a `coup
    de main`, and to conduct a delaying action to gain time to carry out the destruction
    of the facilities. If Balikpapan fell into enemy hands, the order was to wage
    guerrilla war.


    The commander of the `NEI` troops, Lieutenant-Colonel `C. van den Hoogenband`,
    did not respond to Sakaguchi’s ultimatum and immediately began destroying the
    infrastructure. Once the oil facilities had been put out of use, the `RNEI` General
    Headquarters thought of withdrawing most of the garrison, chiefly to Bandjermasin.
    However, at the time of the Japanese landing, a decision was yet to be made.


    ### The Sakaguchi Detachment


    The Sakaguchi Detachment landed at 0240hrs on 24 January 1942 at three locations
    outside the defended coastal areas. The destroyed and vacated `Manggar Airfield`
    and the `Samboja` drilling site were captured without resistance. The advance
    towards the city was severely affected by road demolitions. The landing in the
    bay north of the city threatened the garrison in the rear. Given the progress
    in destroying the oil infrastucture and the threat of being cut off, `Van den
    Hoogenband` decided not to defend Balikpapan. He broke off the fight and retreated
    inland with 700 men. In view of the destruction carried out, Sakaguchi fulfilled
    his threat. On 20 February 1942, 78 civilians and prisoners of war were executed
    on the beach. The losses among Sakaguchi’s force amounted to eight casualties
    on land and 39 at sea.


    ![../img/9781472843524Art001_battlescene.jpg](img/9781472843524Art001_battlescene.jpg)


    ### ATTACK ON NEI STRONGPOINT NO.10, EASTERN FRONT, TARAKAN, 11 JANUARY 1942


    On 11 January 1942, the Sakaguchi Detachment and the `2nd Kure SLF` began their
    amphibious attack on Tarakan at three points on the east coast. The Right Wing
    Unit – comprising `1st Battalion` and two companies from `3rd Battalion`, `146th
    Infantry Regiment`, half the regimental artillery and `1st Engineer Company` (reduced)
    – and the `2nd Kure SLF` landed at 0000hrs and 0030 hrs (JST). According to the
    plan, the drilling site (in the centre of the island), `Lingkas` and the `Karungan`
    batteries (on the west coast) would be in Japanese hands by dawn. The airfield
    would then be captured.


    From the start, the operation did not go according to plan. The Right Wing Unit
    landed 4–6km north of the planned landing point, delaying the start of the attack
    considerably, and surprise was lost. Then the Left Wing Unit became disoriented
    in the dense jungle and did not reach, let alone capture, their objective of the
    `Karungan` batteries.


    The Right Wing Unit marched through flooded forests to reach the intended landing
    point, and then, at daybreak, they stormed and overwhelmed the `NEI` strongpoint
    at `Amal`. The attack on the `NEI` Eastern Front began around 0930hrs local time.
    The Eastern Front consisted of five mutually supporting strongpoints, numbered
    8 to 12. Only strongpoints 10 and 11 were occupied by the `NEI` defenders, which
    weakened the firing line. These strongpoints lay directly on the Japanese axis
    of advance.


    Here we see the Japanese infantry attack on Strongpoint No. 10 (1). In the background
    oil-drilling towers (2) can be seen. Strongpoint 10 was under the command of Sergeant
    `Terbrugge`, while No. 11 was manned by 1st Lieutenant `J.C. den Hond`, his staff,
    a section of `MMGs` and two `LMG` groups (totalling 23 men). Each strongpoint
    consisted of six concrete pillboxes (3): one command post with observation post,
    four pillboxes for the `MGs` and a reserve position for one of the automatic weapons
    in the rear. Each pillbox had room for two men. The other troops (ammunition handlers)
    were located in trenches protected by an earth rampart. The `MMG` provided flanking
    fire. The two `LMGs` gave frontal protection. The strongpoints were protected
    by a double barbed-wire obstacle (4) approximately 30m in front of the pillboxes.
    The whole position was protected by a double wire obstacle 40–50m to its front.
    All obstacles were covered by flanking fire from the `MGs`. The fields of fire
    were hindered by the fast-growing tropical vegetation (5). The Japanese advance
    was halted by mortar and 7.5cm artillery fire (6), and intense `NEI` small-arms
    fire. Around 1000hrs, Strongpoint 10 was finally captured after Sergeant `Terbrugge`
    was killed and the rest of the defenders withdrew.


    The `NEI` commander, Lieutenant-Colonel `De Waal`, had established a second defensive
    line manned by improvised units and held the `Ambonese 1st Company`, `7th Infantry
    Battalion` from the `Linkasfront` in reserve. However, when ordered to counter-attack,
    the company refused to move forward under fire.


    The Japanese planned to break the defences using a night attack. They managed
    to penetrate the `NEI` positions and even occupy the two Dutch barracks, but the
    second `NEI` line held. `IJN` air support was called in to bomb the `NEI` batteries
    in the morning. Lieutenant-Colonel `De Waal` ordered a second Dutch counter-attack
    in the morning to reestablish the front line. In the chaos following the Japanese
    night attack, however, the assigned troops instead withdrew to the airfield. `De
    Waal` now considered his line breached, and he had no reserves to plug the gap.
    That same morning, the `NEI` troops surrendered.


    `ABDACOM` became operational on 15 January 1942, and was now facing its first
    test. It deployed air and naval forces against the Japanese landing fleet heading
    for Balikapan. The Military Aviation Service flew missions against the Japanese
    ships. From Java, `FEAF` conducted several missions in January. Air strikes caused
    the Japanese landing fleet to lose two transport ships and damaged three transport
    ships, a seaplane tender and a destroyer. The Japanese convoy had already been
    attacked en route on 23 January 1942 by Dutch submarines; a transport ship was
    sunk. Shortly after the landing boats departed, the anchored Japanese transport
    ships were unexpectedly attacked by the four American destroyers of `Destroyer
    Division 59` at around 0300hrs. In a ‘hit-and-run’ attack, these ageing warships
    sank four transport ships, damaging two others and a patrol boat. At least 121
    Japanese sailors lost their lives. Despite a massive Japanese air and naval presence,
    the Allies had inflicted significant losses on the Japanese transport fleet heading
    for Balikpapan.


    ![CAM364_028.jpg](img/CAM364_028.jpg)

