- fmt: '

    Operation `H`, the conquest of the NEI, was based on a rapid and methodical advance
    almost simultaneously over three axes towards the main island of Java: via South
    Sumatra from the west, through the Makassar Strait in the centre and via the Banda
    Sea from the east. The capture and preparation of air bases in South Sumatra,
    Borneo and Sulawesi was essential for the air operation against Java. Ambon and
    Kupang on Timor were to be occupied, to secure the left flank of the advance to
    Java and to sever Allied communcations with Australia.


    ![CAM364_022.jpg](img/CAM364_022.jpg)


    Destroyed RNEI armoured cars on Tarakan. A mobile group of 80 men with seven APCs
    (`overvalwagen`) formed part of the garrison. The APCs were locally manufactured
    in Java by adding armour to a commercial truck chassis. One officer labelled the
    resultant APCs ‘no good’. The armour needed to be resistant to small-arms fire.
    One vehicle commander reported, however, that he could see through the bullet
    holes in the armour after an engagement. The car was also difficult to turn on
    the road. The sign on the APC in this image is not Dutch, but the Japanese sign
    for an infantry brigade headquarters. To the right side of the road, alongside
    the APC, lie two dead NEI crew members. (Mainichi Newspapers)


    ### TARAKAN


    At the end of December 1941, the IJN started the air campaign to eliminate Allied
    airpower on Tarakan and at Menado. On 4 January 1942, Tarakan Airfield was evacuated
    by the NEI Military Aviation Service. The Naval Aviation Service followed six
    days later. Without an early warning system and adequate ground-based air defence,
    the advanced airfield proved to be too vulnerable to air attacks. On 26 December
    1941, an air strike followed on the Tondano naval air base, North Sulawesi. The
    naval air base was then closed down.


    On 11 January 1942, the Japanese landed simultaneously on Tarakan and at Menado.
    The Sakaguchi Detachment and the 2nd Kure SLF attacked Tarakan. Tarakan was defended
    by the RNEI 7th Infantry Battalion, a field battalion with increased armament,
    and the 3rd Coastal and AA Artillery Company. The total strength of the garrison
    was 1,365 men. The commander, Lieutenant-Colonel S. de Waal, ordered the destruction
    of the oilfields and oiltank supplies on 10 January 1942.


    The Japanese landed between midnight and 0430hrs at three points on the virtually
    undefended east coast.[12](#9781472843531-8.xhtml_footnote-013) The attack was
    delayed because the main force landed on the wrong beach. Thereafter, the infantry
    assault stalled due to Dutch resistance. A night attack managed to penetrate the
    defence. Two planned Dutch counter-attacks failed to materialize. The RNEI commander
    considered his defence to have been breached and had no reserves to plug the gap.
    The morning of the 12th, the garrison offered to surrender.


    Unaware of the capitulation, the RNEI Karugan battery sank two Japanese minesweepers,
    the `W13` and `W14`, after the surrender; 159 sailors were killed. The IJN subsequently
    executed 215 prisoners of war from the battery on 19 January 1942\. The Sakaguchi
    Detachment reported losses of seven killed and 35 injured. The 2nd Kure SLF reported
    three injured, and claimed to have killed some 300 soldiers of the RNEI Army,
    wounded 40 and taken 871 prisoner. According to Dutch reports, 33 soldiers died
    on Tarakan. This number does not include the military personnel executed on 19
    January 1942.


    ![CAM364_023.jpg](img/CAM364_023.jpg)


    The oil tank farm ablaze at Lingkas on Tarakan. Upon notification of the approach
    of the Japanese fleet, the destruction plan was put into effect in the afternoon
    and evening of 10 January 1942\. The oil-drilling sites and the oil tank farm
    were destroyed. (Mainichi Newspapers)


    ### MENADO


    On the morning of 11 January 1942, the Eastern Attack Unit with the Sasebo Combined
    SLF and the 1st Yokosuka SLF conducted an amphibious and airborne operation that
    caught the scattered NEI forces in a pincer movement from Menado in the west and
    Kema in the east, with Japanese paratroopers attacking in the centre by the Menado
    II Airfield (Langoan). Menado was defended by garrison troops of the Menado Troops
    Command, part of the Celebes and Menado Territorial Command, under Major B.F.A.
    Schilmöller. The strength was `c`. 1,500 men in a number of separate, unconnected
    units of widely differing combat value.


    ![CAM364_025.jpg](img/CAM364_025.jpg)


    The assault by Japanese naval paratroopers on the Menado II Airfield (Lagoan)
    on Sulawesi was the first airborne operation in Asia. The 1st Yokosuka SLF jumped
    from 27 transport aircraft of the 1st Air Group. One aircraft was shot down by
    friendly fire. The weapons were to be dropped 150m after the personnel had jumped
    out. The only 37mm anti-tank gun was flown in by flying boat, landing on Lake
    Tondano. (Mainichi Newspapers)


    The coastal defence by the Menado Company was quickly overcome and the city was
    occupied. After a short but fierce battle, the paratroopers managed to capture
    the airfield. Two counter-attacks were launched by RNEI troops, but lacked coordination
    and were too weak. The paratroopers also captured the abandoned naval air base
    in the afternoon. The advance from Menado inland was held up by a delaying action.
    After this, RNEI coordinated resistance disintegrated.


    The capture of Menado cost the Special Landing Forces 44 killed and 184 injured.
    Among the fallen were 12 paratroopers whose transport aircraft was shot down by
    their own fighter aircraft. Japan claimed 140 killed and 48 prisoners of war from
    the RNEI Army. According to Dutch records, 20 soldiers died, 11 of whom were executed.


    The northern line of defence had been breached with the fall of Tarakan and Menado.
    For Wavell, with his emphasis on Singapore, the defence of bases in the northern
    and eastern periphery of the Netherlands East Indies was not a priority. He wanted
    to preserve his scarce air forces for the later battle. The Dutch and Americans
    clearly thought otherwise. Together, they deployed their airpower against the
    Japanese advance.


    The Military Aviation Service and FEAF flew missions against the Japanese landing
    fleet at Tarakan and against its airfield. The latter was damaged, but overall
    the results were relatively limited. Japanese fighters inflicted a heavy toll.
    The Military Aviation Service lost a total of six bombers and 23 crew members.
    On 13 January 1942, the Military Aviation Service ended attacks on the island.


    The Military Aviation Service lacked any means of attacking Menado, and so missions
    against the latter were flown by the RAAF and FEAF. The results were poor. The
    IJN spoke at Menado of ‘fierce counter-attacks by enemy aircraft. It was fortunate
    that `the enemy` caused no `major` damage to us because their attacks were carried
    out by single planes, and, moreover, their skill was not very great. We observe
    that our losses must have been disastrous should we have been attacked by a considerable
    number of `enemy planes` in formation.’[13](#9781472843531-8.xhtml_footnote-012)
    Such an evaluation could apply equally to Tarakan.


    ### BALIKPAPAN


    After two weeks, the Japanese made their second leap forward on 24 January 1942\.
    Again, two amphibious operations were performed simultaneously. The Sakaguchi
    Detachment landed at Balikpapan, while the IJN attacked Kendari on Sulawesi.


    ![CAM34_026.jpg](img/CAM364_026.jpg)


    The Menado II Airfield (Lagoan) under airborne attack by the 1st Yokosuka SLF.
    The Japanese paratroopers jumped directly onto the target from an altitude of
    150m. The airfield was still under construction, but the runway could support
    fighter aircraft. The Japanese put the airfield into operation immediately. On
    16 January 1942, the HQ of the 21st Air Flotilla moved in from Davao.


    ![CAM364_027.jpg](img/CAM364_027.jpg)

    '
