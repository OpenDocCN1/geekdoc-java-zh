    防守方对爪哇岛的情报工作简直糟糕透极。1942 年 3 月 1 日，估计日本人已在西爪哇岛登陆了两个到三个师。至少有两个师登陆在克拉根（Kragan）。1942
    年 3 月 4 日，这一数字被上调：万丹地区四个师，印德拉马亚尤（Eretan Wetan）附近一个师，东爪哇岛可能有两到四个师。事实上，爪哇岛军与第十六军在人数上大致相当，如表
    10 所示。14


    ![table_p73.jpg](img/table_p73.jpg)


    ## 西爪哇岛


    在万丹湾登陆期间，日本军舰遭到了盟军船只 USS `Houston` 号和 HMAS `Perth` 号的射击，它们正试图向西逃离。在随后的混乱战斗中，这两艘船均被击沉。一艘日本运输船被友军误击沉，三艘运输船严重受损、搁浅并倾斜。日本人也没有免受空袭之苦。1942
    年 2 月 27 日至 3 月 1 日之间，盟军空军从针对打捞（Palembang）地区的反空作战，转变为对日本登陆行动的骚扰攻击。运输舰队、登陆本身以及物资卸载均遭到了轰炸和机枪扫。


    ![CAM364_040.jpg](img/CAM364_040.jpg)


    在整个荷属东群岛（NEI）进攻期间，日本人大量使用了坦克，尽管它们在战场上的决定性作用不如在马六甲时那样大。在通往西爪哇岛色浪（Serang）的道路上，这支机械化机化纵队的前，我们看到团规模的第
    2 坦克团的两辆轻型坦克。没有平民观看。坦克是 95 式“甲号”（Ha-Go）轻型坦克，炮塔内装备有 94 式（1934 年）37 毫米炮，前车体配备 7.7
    毫米 97 式机枪。可以看到炮塔内有坦克长。他没有戴坦克头，而是反过来戴着野战帽。坦克上增加了一个木架用于固定伪装材料，如随其后的第二辆坦克所示。（每日新闻报）


    在梅拉克（Merak），规模较小的荷属东群岛沿岸支队（约 40 人）反对了登陆，但很快被迫撤退。在梅拉克登陆的纳须（Nasu）支队由第 16 步兵团（缩编）和第
    2 侦察团组成。该支队必须向博戈尔（Bogor）发动支援进攻。由于营规模的摩托化第 2 侦察团作为先锋，色浪在当天上午 0700 被占领。该市是一个重要的十字路口。该部队向南转，并于
    1230 奇袭了兰卡斯比托滕（Rangkasbitoeng）。位于兰卡斯比托滕的荷属东群岛支队由第 2 步兵团第 10 营、第一山炮营和两辆装甲车组成，行动失败了。他们匆忙撤退，预想中的阻击行动几乎没有实现。福岛（Fukushima）支队也于梅拉克登陆。它由第
    4 步兵团（缩编）组成。他们奇袭了跨越朱容江（Ciujung River）的帕马让桥和闸。佐藤（Sato）支队由加强后的第 29 步兵团组成，登陆在万丹湾。佐藤支队与福岛支队共同构成了以雅加达为目标的主力。然而，由于倒木封锁道路和桥梁被毁，佐藤沿北部路线的推进进展非常缓慢。深水和高岸加上大雨后的洪水上涨，使得桥梁修复变得困难。该支队直到
    1942 年 3 月 3 日到达朱容江。


    ![CAM364_041.jpg](img/CAM364_041.jpg)


    卡里贾蒂机场（Kalidjati）是主要的军事航空队运行基地之一。1942 年 2 月，ABDA-AIR 为卡里贾蒂分配了两个中队：英国皇家空军（RAF）第
    84 轰炸中队和澳大利亚皇家空军（RAAF）第 1 通用侦察中队。荷兰第 1 航空群也从该机场行动。地面防空由皇家陆军（RA）第 48 高空团第 49 炮以及第
    3 防空营的单位提供。在日本登陆当天上午，荷属东群岛（RNEI）陆军第 2 步兵团第 3 连被执行地面防御任务的第 6 重高空团第 12 炮取代。澳大利亚和荷属东群岛航空单位及时撤离机场。然而，英国人太慢了。这张机场照片拍摄于
    1930 年至 1932 年间。到 1942 年，机场已扩建了照片底部湖泊西侧的两跑道。右侧是通往苏邦（Subang）的道路，日本人从该方向接近机场。（莱顿大学图书馆，KITLV
    49427）


    对于西部司令官希林（Schilling）少将来说，万丹湾的登陆完全并不意外。然而，日本人沿南部路线的推进比预期快得多。从色浪到雅加达和博戈尔的两路分开了。沿两条路线推进只会增加敌方进攻轴之间的距离。日本人的快速南部推进进一步拉开了距离。根据希林的说法，这提供了一个取得有限成功的机会。


