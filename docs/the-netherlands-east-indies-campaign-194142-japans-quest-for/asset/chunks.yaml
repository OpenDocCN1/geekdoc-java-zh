- fmt: '

    The Japanese 2nd Division’s infantry regiments were standardly equipped with bicycles
    for one-third of its companies. Due to the destroyed roads, bicycles proved to
    be the ideal means of transport. These Japanese troops are on their way to Jakarta.
    According to the Japanese *Mainichi* newspaper, enthusiastic Indonesians watch
    from the roadside. Imamura in part attributed the defeat of the NEI to ‘the defection
    of the indigenous people from the Dutch side’. (Mainichi Newspapers)


    Shoji assigned the three companies of Wakamatsu’s 2nd Battalion, the 1st Company,
    4th Tank Regiment and two batteries of mountain artillery for the attack on the
    position in the Ciater Pass. The Egashira Unit, delayed by NEI destruction and
    resistance, had finally reached the Citarum River, but found the bridge destroyed.
    Shoji recalled the unit to Subang. Wakamatsu launched his assault around 1600hrs
    in the afternoon of Thursday, 5 March 1942\. Wakamatsu deployed his battalion
    and, using the terrain, the vegetation, ground fog and a brief heavy rain shower,
    a number of pillboxes were taken in the first and second line. He decided to spend
    the night on the battlefield and continue the attack the next day. According to
    Shoji, only the outposts had been captured and the main line of resistance on
    the ridge still had to be taken. On the morning of 6 March, it became clear to
    Wakamatsu that he had already broken through the main defences.


    In the afternoon of 5 March, Colonel W.J. de Veer, commanding officer of 4th Infantry
    Regiment, was put in charge of the troops at the Ciater position. De Veer organized
    a defence in depth during the night of 5/6 March 1942, reinforcements feeding
    in slowly behind the Ciater position. He placed the (Javanese) 2nd Company, 2nd
    Infantry Battalion and (European) 1st Company, 5th Infantry Battalion behind barbed-wire
    fences in holes and ditches to the left, and the Left-Half 21st Infantry Battalion
    to the right of the Subang–Bandung road directly behind the Ciater position. A
    second line was formed with the Paardekooper Detachment (comprising cadets and
    reserve officer candidates) in the Wates position under construction. The third
    line was an all-round defence at the three-way Tolhek crossroads by the Siahaya
    Detachment (Ambonese recruits). The 3rd Battery, 2nd Mountain Artillery Battalion
    received reinforcement from the 2nd Battery. Despite reinforcements having arrived,
    the 2nd Company, 1st Infantry Battalion had withdrawn from the position that evening.


    ![CAM364_049.jpg](img/CAM364_049.jpg)


    In 1940, a position for a regimental-size unit was built in the Ciater Pass on
    the Subang–Bandung road. The position was located in a tea plantation. An anti-tank
    obstacle of logs and rails covered by a 5cm naval gun in a pillbox with trenches
    formed the outpost line. Behind a bridge over a ravine, higher up the slope, lay
    two lines of pillboxes connected by trenches. The position was originally abandoned
    and neglected, but was occupied and defended in 1941/42\. This grainy photo shows
    one of the Ciater pillboxes; note the heavily sloping and overgrown terrain, and
    the limited field of fire. (Public domain)


    ![CAM364_050.jpg](img/CAM364_050.jpg)


    A 7.5cm mountain gun (*Bergartillerie*) in position in a bamboo bush. This gun
    still has metal wheels, while most pieces were converted to pneumatic rubber tyres.
    The guns were loaded onto a truck for transport. Two batteries of four guns each
    saw action at the Ciater Pass. The guns were used as infantry support weapons.
    Artillery battalion batteries were allocated to infantry units. However, at the
    Ciater Pass, the NEI infantry company commander said that he needed infantry,
    not artillery. (Beeldbank WO2-NIOD)


    On the northern axis of advance, in the 2nd Division area, the Sato Detachment,
    reduced to just two battalions, entered evacuated Jakarta in the late evening
    of 5 March 1942\. Due to the NEI troops having retreated, it encountered no resistance
    to the west of Jakarta. The rapid occupation of the capital was something of a
    surprise to Sixteenth Army. After Blackforce’s retreat at Leuwiliang, the main
    force of the 2nd Division attacked Bogor in a pincer movement. The city fell into
    Japanese hands on the morning of 6 March 1942\. The next target was Bandung.


    On the morning of Friday 6 March, Major Wakamatsu launched his attack on the left
    flank of the makeshift defences. The two companies left of the road were surprised
    as they were receiving the bread distribution; no outposts had been set. However,
    the companies quickly recovered and repelled two infantry assaults. The third
    attack was supported by cannon and machine-gun fire from three Japanese tanks
    at the Subang–Bandung junction, but this attack was also repulsed. However, the
    position was threatened with being overrun. The battered companies broke off the
    fight and retreated to the right. The units were scattered during this retreat.
    Although not attacked, the entire Left-Half 21st Infantry Battalion, save one
    platoon, withdrew when the first shots were fired. The Ciater position had been
    definitively breached. After this success, Wakamatsu did not pursue the retreating
    Dutch troops, but consolidated his position pending the arrival of Egashira.


    During these battles, about 74 NEI soldiers were captured by the Japanese. In
    the afternoon of 6 March, or the morning of 7 March, almost all these prisoners
    were executed by the Japanese, with only a handful surviving the massacre.


    In the afternoon of 6 March, Colonel De Veer decided to give up the Wates position
    and concentrate his defence on the three-way crossroads at Tolhek. A major Japanese
    infantry attack on the triple junction was beaten back with a spoiling attack.
    Colonel De Veer was killed. In the morning of 7 March 1942, the troops at the
    Tolhek crossroads received orders to withdraw to Lembang.


    North of Lembang, a resistance line was improvised with 9th Infantry Battalion,
    15th Infantry Battalion and De Vries Battalion (formed from remnants of 2nd Infantry
    Regiment). To this were added two West Coast of Sumatra companies, garrison infantry
    from West Sumatra, and 4th Infantry Battalion. On paper it seemed a decent fighting
    force, but morale was often very low and its combat value was therefore questionable.
    Moreover, the RI Army was showing signs of disintegration. With the breakthrough
    at the Ciater position, the fight seemed like it was over.


    ![CAM364_051.jpg](img/CAM364_051.jpg)


    A Japanese war painting of a ground attack by IJA Type 99 assault aircraft (Mitsubishi
    Ki-51), Allied codename Sonia, from 27th Air Group, 3rd Air Division on an NEI
    motorized column. Airpower was a decisive factor in the Southern Offensive. With
    attacks on Allied airfields and the breaking of the aerial line of communication
    between Java and the outside world, Japan had secured air superiority. This dominance
    was used against Allied ships and ground troops. The nearly constant Japanese
    air activity with reconnaissance, strafing and bombing paralyzed NEI troop movements
    and sapped morale. (Netherlands Institute of Military History)

