    从历史上看，日本海军关注的是决战海战。然而，在南方攻势中，日本海军利用先进的空基地将对手逼入绝角。这种作战模式对日本海军来说是新颖。针对新的两栖登陆和建设任务，到
    1941 年底，日本海军已组建了九个营规模的特殊登陆部队（SLFs），其中包括两个经过跳伞训练的特殊登陆部队，以及六个用于扩张机场的作战建设单位。


    这些先进的空基地必须从敌人手中夺取并使其适用于日本的作战部队。事实证明，后者比预期的要困难。机场通常由草地组成，由于雨季降雨量大，土壤过度潮湿，无法承受飞机的重量。此外，跑道往往太窄且太短。对于日本战斗机而言，跑道宽度至少需要
    100 米，长度需要 1,000 米，并能够支撑三吨重量。对于中型陆基攻击机，则需要 1,200 米的长度。新的建设单位由 10 名军官、20 名行政人员以及根据任务需要的多达
    3,000 名军事工人组成。然而，这些单位缺乏现代建筑材料。夺取机场的交付时间比预期要长。此外，飞机在全副武装时无法加油和/或起飞。这对空中力量的部署产生了负面影响。这一切导致了严格的时间表延误。


    ![CAM364_014.jpg](img/CAM364_014.jpg)


    日本陆军和日本海军在`A-Go`行动期间犯了大量战争罪。在安汶岛的拉哈机场，1942 年 2 月 1 日至 9 日期间，约 340 名澳大利亚和荷兰战俘在四场大屠杀中被杀。他们的墓在
    1945 年被挖掘。遗体在确认身份后用毯子包裹，并以充分军礼重新安葬。（荷兰军事史学会）


    在短时间内执行多次海军行动给日本海军带来了沉重负担。它面临舰只和飞机短，无法为所有行动提供足够的护卫舰、扫雷舰和空中支援。日本海军也缺乏海军登陆部队。通过对单位分配进行调整，日本海军在很大程度上能够满足这些多样的需求。


    日本陆军和日本海军在`A-Go`行动期间表现得残忍。战争罪频繁发生。平民和战俘（包括伤员）在不同地点被故意杀害。


    ### 荷兰东印度属军队 (RNEI ARMY)


    荷兰东印度属军队是一支殖民部队，承担着双重任务：内部安全和防御外敌。这种双重性体现在其组织、战术和装备中。小型孤立的驻守步兵连部署在“外地”（`Buitengewesten`）——爪哇岛和马杜拉岛之外的岛屿。他们经过训练以对付内部敌人：负责维持秩序和权威。装备包括
    6.5mm M95 半自动卡宾枪和`klewang`（一种军刀）。爪哇军（`Javaleger`）驻扎在爪哇岛。它主要履行防御作用，因此旨在对付可能的外敌。其核心由四个步兵团团、两个炮兵团团和一个骑兵团团组成。


    荷兰东印度属军队是一支由长期志愿者组成的常备职业军队。来自荷兰的志愿者构成了陆军的核心，并抵消了非欧洲人在人数上的优势。非欧洲人（即印度尼西亚人）并非从所有人群中招募，而是仅从印度尼西亚群岛的少数特定族群中招募。战争期间通过欧洲征兵增加了欧洲人的比例。在外部威胁的压力下，印度尼西亚人的征兵直到
    1941 年才引入。预计每年配额为 3,000 人。事实上，印度尼西亚征兵仅限于爪哇岛、米纳哈萨半岛（北苏拉威锡）和安汶岛，到那时已经是太少且太晚了。


    在和平和平时期，荷兰东印度属地没有陆军和海军的联合总部。两条指挥线仅在总督作为陆军和舰队总司令官处汇合。陆军和海军在陆军指挥官（`Legercommandant`）和海军指挥官（`Commandant
    Zeemacht`）下拥有各自的指挥链。这些指挥官分别领导战争部和海军部。这些行政部门结合了国防部、总司令部、作战指挥和支持组织的功能。战争期间，战争部的作战任务转交给陆军指挥官下的总司令部（`Algemeen
    Hoofdkwartier`）。野战陆军总部（`Hoofdkwartier Veldleger`）将由参谋部的作战分支（战争部的一部分）组成，以指挥野战陆军。


    ![CAM364_015.jpg](img/CAM364_015.jpg)


    1941 年底，荷兰东印度属军队的骑兵重组为一个骑兵连和四个摩托化连。一个摩托化连由一个指挥小组、两个装备有福特 GP 吉普车和摩托车的吉普车队、一个拥有四辆
    M3A1 (pau W)白色侦察车和三辆 AC3D (pau S)阿尔维斯-斯特劳斯车的装甲车排，以及一个战斗和行李辎组成。吉普车队各包含一个配备 12.7mm
    M30 柯特机枪的小组。照片可能显示了万隆的第 2 骑兵连，包括两个吉普车队、中心前景的指挥小组，右侧是装甲车排和指挥小组的无线电车。（国家档案馆，DLC
    收藏，公有领域）


    荷兰皇家海军（`Koninklijke Marine`）的地位使得指挥链变得更加复杂。它不是一个东印度属地的机构，而是属于荷兰国防部。尽管海军指挥官在作战上受总督管辖，他在行政政策上对荷兰国防部长负责。海军的资金来自荷兰和东印度属地的预算。武装部队在物理上也保持分离。总司令部位于万隆。荷兰皇家海军总部位于雅加达。


    1942 年 3 月 5 日，总督被伦敦的荷兰政府免除最高指挥权。因此，总督将获得自由继续管理被日占领地区的权力。事实证明这是痴人说梦。


    在两次大战期间，荷兰东印度属军队经历了三轮紧缩调整：1922-23 年、1927 年和 1930-35 年。从 1936 年开始，由于欧洲和亚洲国际局势紧张，国防预算再次增加。陆军指挥部制定了
    1936 年强化计划。这项八项计划规定进一步加强空军力量、步兵机械化、增加步兵和（岸防）炮兵的火力以及填补人员缺口。

