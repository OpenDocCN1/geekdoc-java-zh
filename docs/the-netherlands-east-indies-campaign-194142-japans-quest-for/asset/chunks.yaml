    # 4th Company Coastal and Anti-Aircraft Artillery


    ## 8. Nona Battery (4 x 15cm L 40 Navy gun)

    ## 9. Galala Battery (2 x 3.7cm Navy)

    ## 10. Halong Battery (1 x 7.5cm L 55 Navy gun)


    ### Gull Force units:

    * 2/21st Battalion (reinforced), 2nd AIF

    * 11. B (reduced) and C Company, 2/21st Battalion

    * 12. A Company, 2/21st Battalion

    * 13. D Company, 2/21st Battalion with 5th Platoon on Mount Nona

    * 14. 6th Platoon and support units

    * 15. Rifle section


    ![image](img/common.jpg)


    ## EVENTS


    Times are given in Japan Standard Time (`JST` – `UTC+09:00`) unless otherwise
    stated. Moluccas Time (`MCT`) was `UTC+08:30`.


    ### Saturday, 31 January 1942


    1. 0240hrs and 0250hrs: Unopposed amphibious night landing of Eastern Detachment
    on the south-east coast of Laitimor. The right attack unit marches towards Passo,
    the left via two steep mountain tracks towards Ambon City in poor weather.

    2. The NEI militia platoons at Rutung and Sojadiattas delay the Japanese western
    attack.

    3. 0100hrs: Amphibious night landing by the reinforced 1st Kure SLF (`c. 1,000`
    men) at Hitoelama. NEI platoon from 4th Company, Garrison Battalion (reinforced)
    offers stiff resistance from prepared positions.

    4. 0320hrs: NEI opposition at Hitoelama is overrun and the landing completed.
    The NEI detachment withdraws and conducts delaying actions on the route of advance.

    5. `c. 0800hrs (MCT)`: NEI reinforcements are sent piecemeal to the Rutung and
    Sojadiattas mountain detachments. They run into the two advancing Japanese left-attack
    columns and are mostly scattered. Lieutenant-Colonel Kapitz has expended his reserves.

    6. `0730 hrs (MCT)`: The Japanese right attack assaults the Passo position in
    the right flank, overruns the flanking position at Batoegong and occupies the
    eastern strongpoints. `0830hrs (MCT)` and `0930hrs (MCT)`: Two successive counter-attacks
    make almost no headway, and the Passo position is almost taken.

    7. Advancing along poor roads in heavy rain, the 1st Kure SLF comes under heavy
    artillery fire from NEI coastal batteries on the opposite shore. The late-afternoon
    assault on Laha Airfield by the 2nd Company, 1st Kure SLF and 10th Company, 3rd
    Battalion, 228th Infantry Regiment is repulsed.

    8. 1700hrs: The Japanese left attack unit enters Ambon City.

    9. The 10th Company, 3rd Battalion, 228th Infantry Regiment is sent into the jungle
    to envelop the airfield from the high ground to the north.


    ### Sunday, 1 February 1942


    10. 0130hrs: Lieutenant-Colonel Kapitz and the NEI troops in the Passo position
    surrender.

    11. 1100hrs: The Japanese left attack pushes south from Ambon City. Gull Force
    has improvised a defence in depth to the south-west, but during the day the position
    is surrounded.

    12. The Australian second line at Amahoesoe comes under attack. This position
    is defended by the Battalion HQ, D Company of 2/21st Battalion and service and
    support units Gull Force.


    ### Night, 1/2 February 1942


    13. 2200hrs: Japanese 2nd Company manages to penetrate the eastern position between
    B and C companies, 2/21st Battalion, but the line holds and the Japanese attackers
    are pinned down.

    14. Lieutenant-Colonel Scott, CO Gull Force, incorrectly believes Mt Nona has
    been occupied by the Japanese. He orders a withdrawal from the Amahoesoe line
    to Eri.


    ### Monday, 2 February 1942


    15. 1200hrs: The Japanese attack on Laha is called off and air stikes and naval
    gunfire support are called in, and reinforcements requested.

    16. 0630hrs: The Eastern Detachment occupies Mt Nona (Hill 514).

    17. Morning: The 21st Minesweeper Division covered by the 15th Destroyer Division
    starts to clear the outer bay of mines. Minesweepers No. 11 and No. 12 strike
    mines and are badly damaged, and No. 9 sinks.


    ### Tuesday, 3 February 1942


    18. 0115hrs: A second night assault takes place by the entire 1st Kure SLF on
    Laha, and breaks through the Australian defences. At `0615hrs`, the airfield is
    captured. IJA reinforcements arrive after the Australian surrender.

    19. Under shelling and bombardment, and with dwindling food, water and morale,
    Gull Force surrenders at `1530hrs`.


    After mobilization, the South-Eastern Borneo Garrison Battalion numbered `1,250`
    men. It was assigned to the defence of two airfields, Kotawaringin and Oelin.
    On the morning of 10 February, the Japanese [Palembang] was occupied. (Note: The
    text provided had a gap/overlap here, but context is maintained).


    ## Operation L: the attack on Palembang


    South Sumatra was defended by Palembang and Djambi Territorial Command. The command
    consisted of a regional headquarters, the Palembang and Djambi Garrison Battalion
    of six companies, a Demolition Corps, Palembang Town Guard and Djambi Town Guard.
    For the defence of the airfield and the oil installations, the territorial troops
    were reinforced with a machine-gun company and a detachment of artillery of eight
    `7.5cm` guns and two `4cm` AA guns. The garrison was also given five `APCs`: two
    at Palembang I and three at Palembang II. The total strength was `c. 1,300` men.
    The Territorial Commander was Lieutenant-Colonel `L.N.W. Vogelesang`.

