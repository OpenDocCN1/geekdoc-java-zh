    英国空军（RAF）撤退至胆民二。空军准将官亨特（Hunter）很快也清扫了胆民二。随后，英国空军通过陆路和铁路撤回到民兰腊（Bandar Lampung）。这次撤退非常混乱，装备和部队凝聚力都部分丧失。相比之下，第
    6 重防空团和第 10 步兵团连同 400–500 名民兵有组织地撤退了，尽管第 6 重防空团随后不得不留下了剩余的大炮。第 10 步兵团于 1942 年
    2 月 18 日在马塔普拉（Martapura）对渊口部队（Iwabuchi Unit）进行了阻击战。日本军未能及时切断撤退路线。在短暂的交火后，第 10
    步兵团结束了战斗。


    与报告相反，日本沿上上部队直到 1942 年 2 月 15 日傍晚才抵达胆民丹。当晚，他们与位于胆民一的第 2 袭击团建立了陆上接触。16 日，他们与油厂的伞兵取得了了联系。2
    月 16 日傍晚，第 38 师的主力锚定在穆西河口，但在但在 20 日之前未抵达胆民丹。日本军直到 2 月 16 日才发现胆民二。


    在胆民丹战进行期间，首批英联邦援军抵达了民兰腊。1942 年 2 月 14 日，载有英国第 7 装甲旅旅的 JS 1 船队抵达。第二天，JS 2 船队锚定在民兰腊。该船队由一艘船“奥凯德斯号”（`Orcades`）组成，载有澳大利亚第
    7 师的前卫部队。尽管这些部队缺少一些重型装备，但大部分部队立即登了陆。澳大利亚准将 C.S.斯蒂尔（C.S. Steele）于 1942 年 2 月 15
    日早晨从胆民丹抵达民兰腊。利用可用力量，他组建了一个保卫民兰腊的临时部队：`布斯特部队`（Boost Force）。该部队由第 3 国王皇家骑兵团 B 连、英国陆空军第
    48 轻防空团（皇家空军）第 95 炮连，以及五个规模约 100 人的临时英国空军步兵连组成。


    1942 年 2 月 15 日下午晚晚，新加坡盟军投降。根据 ABCD 司令部（ABDACOM）的电报，新加坡的落导致了“计划变更”。抵达民兰腊的部队被命令不要登陆。JS
    1 和 JS 2 船队不得不前往丹绒普里奥（Tanjung Priok）并在那里等待进一步指示。ABCD 空军（ABDA-AIR）命令通过民兰腊撤离英国空军人员。部队重新登船。因此，南苏门腊很快就被
    ABCD 司令部放弃了。


    在胆民丹的战斗以及撤退过程中，荷属印度尼（NEI）军队，特别是民兵，表现出某种“不愿被部署”。在普拉朱（Plaju）的反击战中，第 10 步兵团第 3 连的一个排拒绝向前。这被归因于排官的指挥失误。


    ![CAM364_038.jpg](img/CAM364_038.jpg)


    “奥凯德斯号”（`Orcades`）于 1942 年 2 月 16 日载着澳大利亚第 7 师的 3391 名士兵从中东抵达丹绒普里奥。该师的部分士兵于 2
    月 18 日登陆；韦威尔（Wavell）将军计划利用他们进行机场防御。图中在“奥凯德斯号”甲板上的士兵可能来自 2/2 先遣团；前景中的两名士兵携带着一支箱装的布伦轻机枪。他们与其他澳大利亚部队和士兵一起组成了`黑色部队`（Blackforce）。“奥凯德斯号”于
    1942 年 3 月 21 日作为 SJ 6 船队（巴达维亚–科伦坡）出发，载有 3500 人。1942 年 10 月 10 日，“奥凯德斯号”被德国潜艇击沉。（澳大利亚战争纪念馆）


    南苏门腊两天内丢失。来自西侧的钳攻已经合围爪哇。几天后，来自东侧的钳攻也将将其包围。荷属印度的主岛被包围，已无法守卫。


    ### 巴厘（BALI）


    1942 年 2 月 19 日 0100，第 48 师的第 1 福摩森步兵团第 3 营（减员后）、一个山炮排以及一个独立工兵排登陆了巴厘岛南岸。日本海军（IJN）第一基地部队提供了护护。在达拉干（Tarakan）发现的文件显示巴厘岛的机场状况良好。此外，该位置极其有利。从巴厘岛不仅可以对东爪哇进行空战，还能切断来自澳大利亚的补给路线。日本海军第
    23 航空飞行队随后强烈建议将巴厘岛再次纳入作战计划。双方于 1942 年 1 月 28 日在马尼拉的会议上达成一致。


    巴厘岛由普拉约达军（Prajoda Corps）防御，这是一支由一些欧洲军官和士官组成的印尼辅助营团级部队。日军登陆后，该军由于大规模逃散而瓦解。登帕萨尔（Den
    Pasar）机场很快就几乎完好地落入日本人手中。第二天就被投入使用。1942 年 2 月 26 日，第 23 航空飞行队总部从巴厘巴板（Balikpapan）迁往巴厘岛。


    ABCD 司令部对登陆士兵和物资期间的两艘日本运输船进行了猛烈空袭。两艘船均受损，其中一艘受损严重。联合打击群也被部署在东侧应对这一严峻威胁。日本军已经达到了地面目标。最重要的是，行动太晚了（2
    月 19/20 日）。


    ### 帝汶（TIMOR）


    帝汶岛在政治上被分为荷兰部分和葡萄牙部分。东部是葡萄牙的，首都是迪利（Dilly）。西部是荷兰的，在西北岸有一个小葡萄牙亚飞地，首都是库邦（Kupang）。该岛长
    476 公里，宽 102 公里。岛上山山崎岖，覆盖着热带森林。道路网络有限。在荷兰部分，有一条未铺装的主路（宽约 4–5 米）从库邦延伸到葡萄牙边境。由于珊瑚和沼泽，路边地形不适合机动车辆。彭诺伊（Penfoei）机场位于库邦东北方向约
    4 公里处。


    帝汶及属地民兵司令部由一个地区总部和由 27 个旅（每旅 19 人）组成的帝汶及属地守备团组成，其中 21 个旅驻在帝汶。民兵指挥官是 W.E.C. 德蒂尔（Detiger）中校。此外，守备队配备了标准的三辆甲兵车。其任务是维持中立并防止日军登陆。总人数为
    500 人。民兵仍组织为内部安全部队，面对现代有组织的武装力量缺乏打击能力和火力。


    ![CAM364_045.jpg](img/CAM364_045.jpg)


    荷属印度（NEI）半机械化机枪和步兵炮连于 1940 年重组为完全机械化和摩托化的反坦克防空连（`afdeling Pantser-en Luchtafweer`）。后者为团级提供反坦克和移动防空防御。防空排（57
    人）配备了九支安装在轻型敞空雪佛兰车后部旋转支架上的 M30 柯特 12.7mm（.50 口径）重防空机枪。机组不受来袭火力保护。在这张照片中，可以看到三辆带有防空机枪的卡车和一辆弹药车。1938
    年底，荷兰东印度陆军（RNEI）认为 12.7mm 防空机枪已过时。它们应被 2cm 炮取代，但在日军进攻期间，旧的防空机枪仍被广泛使用。（荷兰军事历史）


