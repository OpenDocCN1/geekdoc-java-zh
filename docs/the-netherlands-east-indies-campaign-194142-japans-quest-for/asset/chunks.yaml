    ![CAM364_035.jpg](img/CAM364_035.jpg)


    Bandar Lampung (Oosthaven), south Sumatra. On 14 February 1942, the day the Japanese
    attacked Palembang, the first reinforcements of ground troops from the Middle
    East destined for Sumatra and Java arrived at Oosthaven. A `Mk V1B` light tank
    from the British `B Squadron`, `3rd King’s Own Hussars` is seen here on the wharf,
    while in the background are destroyed trucks, a bus and collapsed buildings. In
    the late afternoon of 15 February 1942, orders were received to re-embark the
    `3rd King’s Own Hussars`. The unit was shipped to Java and saw action as part
    of Blackforce. (Australian War Memorial)


    From 16 January 1942, Palembang developed into a major British air base. The bomber
    squadrons were reorganized into `No. 225 (Bomber) Group`, stationed at Palembang
    II. On 1 February 1942, `No. 226 (Fighter) Group` was formed, based at Palembang
    I. Ground-based air defence was supplied by: `6th Heavy Anti-Aircraft Artillery
    Regiment (RA)` (reduced), `78th Battery`, `35th Light Anti-Aircraft Regiment (RA)`
    and a troop from `89th Light Anti-Aircraft Artillery Battery (RA)`. Air Commodore
    Henry J.F. Hunter, commander of `No. 225 (Bomber) Group`, acted as Air Officer
    Commanding Palembang.


    A small advance party of Australian `I Corps` had arrived on 26 January 1942 by
    plane at Jakarta. The GOC, Lieutenant-General `J.D. Lavarack`, and his chief of
    staff, Brigadier `F.H. Berryman`, explored the future deployment area. In South
    Sumatra, they expected that the Japanese would first occupy Bangka to use as a
    forward base to gain local maritime and air superiority. Then they would attack
    the oil refineries using paratroopers. This airborne operation would be combined
    with an upstream riverine operation. Lavarack therefore advised Wavell to immediately
    strengthen the defences of the oil refineries and the airfield with an infantry
    battalion and to hand out rifles to `RAF`, `RAAF` and `AA` gunners. It was decided
    to send one infantry battalion to the oil refineries and one to the islands of
    Bangka and Belitung. After the arrival of Australian reinforcements, the defence
    of Palembang I and Palembang II would be reinforced with a squadron of light tanks.


    On 5 February 1942, two `RNEI Army` field battalions temporarily left Java for
    Sumatra: the `10th Infantry Battalion` went to Palembang, `9th Infantry Battalion
    (reduced)` moved to Bangka island and the reinforced `2nd Company`, `12th Infantry
    Battalion` headed to Belitung. Once Australian reinforcements arrived, these battalions
    would return to Java. The `10th Infantry Battalion`s headquarters and three companies
    were stationed in Praboemoelih. The `1st Company`, `10th Infantry Battalion (Javanese)`
    was stationed in Palembang. The choice of Praboemoelih was not ideal. Lying 90km
    south of Palembang, it was too far from the protected locations to be able to
    counter-attack quickly. The battalion was provisionally motorized with buses and
    trucks driven by called-up Indonesian drivers. The `10th Infantry Battalion` became
    available to the Territorial Commander.


    Operation `L`, targetting Bangka island and Palembang, had to be postponed twice
    due to the poor condition of Kuching Airfield and the unavailability of `Singkawang
    II`. Kuantan in Malaya should have taken over this role, but this airfield was
    not made ready in time. Eventually, Operation `L` was scheduled to commence 15
    February 1942.


    ![CAM364_031.jpg](img/CAM364_031.jpg)


    A Japanese postcard published by the Army Art Association based on a war painting
    by Goro Tsuruta, ‘The Warrior God descended in Palembang’. The `IJA` and `IJN`
    engaged renowned Japanese artists to lay down the Sino-Japanese War and the Pacific
    War in monumental realistic paintings in Western style (`yoga`) as opposed to
    Japanese style (`nihonga`). These paintings of the war campaigns were shown to
    the Japanese public in large-scale exhibitions. (NARA, public domain)


    To destroy Allied airpower in Sumatra and also to suppress it on Java, the `IJA`
    and `IJN` divided the operating area across the line `Muntok–Palembang` on 28
    January 1942. The `IJA` would operate to the west and the `IJN` to the east of
    this line. Following preliminary attacks, the `3rd Air Division` launched a major
    offensive over South Sumatra from 6 February to 13 February 1942 to gain local
    air superiority. The `22nd Air Flotilla` flew missions over Bangka and Belitung.
    The Japanese subsequently believed that the bulk of the Allied aircraft had been
    destroyed. This turned out to be premature.


    Despite the losses suffered, the British still had the following aircraft available
    on the day of the Japanese landings: `24 Hurricane fighters`, `31 Lockheed Hudson
    light bombers` and `36 Bristol Blenheim Mk I` and `Mk IV` light bombers. Many
    of the Blenheims were unserviceable. Palembang II was not discovered by the Japanese
    as a base, and was therefore available for the deployment of fighter aircraft
    and bombers. All in all, there was no question of Japanese air supremacy.


    Operation `L`, as predicted by Lieutenant-General Lavarack, was a combined airborne
    and amphibious/riverine attack. The `IJA` had specifically trained the `1st Raiding
    Group` (an airborne unit) for the conquest of Palembang. The `1st Raiding Regiment`
    turned out to be unavailable because it had lost armament and equipment in a shipping
    accident early January 1942 and had also been struck by paratyphoid fever. As
    a result, the `2nd Raiding Regiment`, still in training, was deployed. A raiding
    regiment consisted of four companies of 160 men and thus had the strength of a
    battalion.


    The `1st Raiding Group` was not strong enough to simultaneously attack and hold
    the three objectives, the airfield and the two refineries. If possible, the refineries
    were to be captured before the Allies could destroy them. But even, the available
    forces were too small for three objectives. Moreover, the group had to hold the
    objectives until the arrival of the main force of `38th Division` (scheduled for
    L+2, Day L marking the amphibious landing on Bangka). The airborne landing was
    scheduled for L-1.


    The 38th Division was tasked with capturing Palembang city. The losses it suffered
    during the taking of Hong Kong had since been made good. Nevertheless, the division
    was not at full strength. Two detachments were formed from its ranks, to be deployed
    elsewhere: the `Eastern Detachment` and `Shoji Detachment`. For the Palembang
    operation, the 38th Division therefore consisted of a core of four infantry battalions
    of the `229th Infantry Regiment`. An independent transport battalion, a shipping
    engineer regiment and other specialist units, including an oil-drilling unit,
    were placed under its control.


    Under Vice Admiral Jisaburo Ozawa, the `IJN` provided large-scale maritime support
    to Operation `L`. Ozawa’s `Malaya Unit` (First Southern Expeditionary Fleet) provided
    the Main Unit and two Escort units. The `1st Air Unit` and `22nd Air Flotilla`
    provided air support to the transport fleet. The `2nd Air Unit` provided air support
    to the transport fleet, guarded the Bangka and Palembang anchorage, and supported
    the operation upstream of the rivers. The `4th Carrier Division` formed the `3rd
    Air Unit` and had to guard against Allied ships. The `9th Base Force` delivered
    the river-ascending unit.


    ![CAM364_033.jpg](img/CAM364_033.jpg)


    Japanese paratroopers jumping from `Army Type 100 Transport Model 1 (Mitsubishi
    Ki-57)` planes, Allied codename `Topsy`. This aircraft had a crew of four and
    could carry 11 paratroopers. This is probably the `3rd Company`, `2nd Raiding
    Regiment` (totalling 90 men) that jumped on 15 February 1942 onto Palembang I
    Airfield. (Keystone-France\Gamma-Rapho via Getty Images)

