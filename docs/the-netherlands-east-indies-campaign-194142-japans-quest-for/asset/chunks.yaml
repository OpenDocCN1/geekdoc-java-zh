    # 雀雀部队与战斗行动


    雀雀部队的战斗力受到士气下降和发病率上升（30%）的影响。在日军空袭、日本人在其他地区的取得成功、缺乏空中支持以及援军不会抵达的背景下，士气随之下降。从战术上讲，“在这种类地形中，通信非常难以维持”。`Leggatt`
    意识到了这一控制问题。部分由于这个原因，他希望在 `Tjamplong` 附近的开阔地区进行决战。他于 1942 年 2 月 21 日和 22 日以碎片化的方式部署部队，浪费了宝贵的时间——考虑到日本从
    `Kupang` 的后方推进，`Leggatt` 并没有多少时间。他本可以针对这一预料的威胁留出大量预备队。部队在 1942 年 2 月 20 日和 21
    日表现出战斗意愿不足：在此阶段，他们“并不自信，当附近发生单枪射时往往撤退”。这可以归因于战斗经验的缺乏。1942 年 2 月 22 日，紧张导致了恐慌。尽管有这些缺点，雀雀部队仍然坚守。其伤亡人数达
    150 人死伤，另有 200 人失踪。`第三横须陆战陆队`遭受了 38 人死、40 至 50 人伤。`东部支队`报告 67 人死、56 人伤。日本人俘了 1,136
    人：其中 179 名英国人、934 名澳大利亚人和 23 名荷兰人。


    在进攻 `Kupang` 的同时，`东部支队` 也进攻了`葡属帝汶汶`的首府 `Dilly`。`Dilly` 已于 1941 年 12 月 17 日由荷兰领导的`荷东印-澳大利亚联合支队`占领。`荷兰东印度陆军`曾敦促采取此行动，以防止日本在那里建立空军基地，从该基地可以到达
    `Makassar` 和 `Kendari` 的机场，直接威胁 `Ambon` 和 `Darwin`，并控制`荷属东印度`与澳大利亚之间的通信线。


    `荷东-澳大利亚远征军`由所谓的增援后的`门纳多第三连`、来自`爪哇`的`第 8 步兵团`、一个四门`7.5cm L30`野战炮连、一个工程师和一些勤务人员组成。它由来自`Kupang
    守备团`的六个旅加强。澳大利亚人抽出了`第二独立连`，这是一支突击部队（270 人）。荷兰人队伍总计 604 人。远征军指挥是 `N.L.W. van Straten
    中校`。`荷东支队`在缺乏深度的阵地上守卫 `Dilly` 港和机场。作为一个突击部队，`第二独立连`并不适合静态防御。它被指定为预备队，位于 `Dilly`
    南西 4 公里的山地中。一个排驻守在机场。


    `葡属帝汶`中`荷东`和澳大利亚军队的存在，让日本开始考虑如何处理这片中立领土。`大本营`希望避免与`葡萄`发生冲突。然而，`南方军（日本陆军）`和`南方作战群（日本海军）`均认为
    `Dilly` 的盟军力量对进攻 `Kupang`构成了威胁。他们必须将他们赶出去。此后 `Dilly` 必须留在手中，作为反对 `Darwin` 作战的重要基地。`第十六军`反对在`帝汶`上同时进行行动。它希望集中力量征服
    `Kupang`。它曾提到了在针对 `Ambon` 的行动中对 `Laha` 的失败进攻。`大本营`结束了这场讨论。


    1942 年 2 月 20 日，`东部支队`连同加强后的`第 228 步兵团第 2 营`（由团长`井井诚三一上校`带领）计划对 `Dilly` 发起直接奇袭。这由于`荷东`的炮兵和机枪火力而失败了。`井井上校`修改了计划，在西侧不到一公里处登陆。两水登陆发生在
    `0218 时`。主力军开始对机场发动正面进攻，`第 5 连`进行包抄，`第 7 连（加强后）`向 `Dilly` 南方进行迂护运动。`Van Straten
    中校`加强了机场防御。然而，他的撤退路线受到了威胁。一些`荷东`士兵已经逃了。此外，由于通信中断，他无法召集`第二独立连`。澳大利亚人直到 `0900 时`
    左右才知道日本人的登陆。看到日本舰队后，`Van Straten` 估计日军实力为 4,000–5,000 人。在 `0800 时` 左右，他决定向`第二独立连`进行总撤退。早晨结束时，`Dilly`
    已入日本人手中。


    `陆军`的损失为 7 人死亡。在盟军一方，有 24 名士兵牺牲：8 名`荷东`士兵和 16 名澳大利亚人。盟军战俘人数为 33 人。


    来自`荷兰`和`葡属帝汶`的战败澳大利亚和`荷东`部队退到了山里。他们最终发起了游击战。然而，那个故事超出了本书的范围。


    随着`帝汶`被攻占，以及`航母任务队`位于`爪哇`南方的海域，该岛的包围已经完成。它现在失去了来自`澳大利亚`的援军。一周内，日本人将登陆`爪哇`。


    ## 爪哇（行动 H）


    1942 年 2 月 19 日，根据`Wavell`的建议，联合参谋部在缺乏进一步盟军支持的情况下决定调整对爪哇的行动计划。这是在日本登陆`爪哇`的一周前。为了对预期的日军部队取得某些成功，决定集中力量在西爪哇并建立战略预备队。从`东爪哇`转移部队的建议被总督否决了。`海军指挥官`发现`泗水舰队基地`对支持海军是不可缺的。然而，`中爪哇`被放弃了。由于`第
    3 师`在`东爪哇`，部队处于碎片化状态。


    ![978172843524_Map006.jpg](img/978172843524_Map006.jpg)


    ### 行动 H：征服爪哇


    `爪哇`是`荷属东印度`的主要岛和行政中心。它是一座长（约 1060 公里）窄（200 公里）的岛屿，人口约 4200 万。火山山区纵贯全岛。北岸由低地地形组成，许多河流从山中流下。相比之下，南岸地形多为山区。原始森林大部分已被清除。`普里南根`是西爪哇的一个高高原，拥有`望登`市，被中高山环绕。该岛有三个现代港口：`丹绒港`（西爪哇）、`泗水`（东爪哇）和`井拉恰普`（Tjilatjap，位于中爪哇南岸）。道路网发达，有东西东西连接的铺装道路以及沿南北岸的铁路。在中爪哇的`切普`（Tjepoe）有一座油炼厂。


