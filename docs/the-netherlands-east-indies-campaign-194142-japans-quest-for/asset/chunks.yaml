    At around 1230hrs, the reinforced Menadonese 2nd Company, 10th Infantry Battalion
    under Captain J.H.M.U.L.E. Ohl arrived. He also had at his disposal from 4th Company,
    10th Infantry Battalion; two MMG platoons (eight Vickers 6.5mm MGs); one mortar
    section (two 81mm mortars); and an AT rifle group (two 20mm AT rifles). Along
    the Moesi River, Ohl formed a fire base of one MMG platoon and one AT rifle to
    cover his rear and left flank. His right flank was covered by a platoon of Town
    Guards. Upon the arrival of a platoon from the Javanese 3rd Company, 10th Infantry
    Battalion, Ohl reorganized his attack force into three reinforced platoons. His
    total strength was now 312 men (excluding the Town Guards).


    Capt Ohl began his sweep at 1320hrs. Initially, the advance was slow due to Japanese
    sniper fire. With the arrival of reinforcements, his attack gained momentum, and
    the Japanese were expelled from an oil tank park.


    This scene shows the NEI assault at the end of the afternoon on the Plaju distillation
    unit by the right forward platoon under 2nd Lieutenant E.J. van Blommestein with
    `klewangs` drawn. The assault was covered by mortar fire, and MMG fire aimed at
    the Japanese positions in the towers and among the oil tanks. Further cover was
    provided by smoke from a burning solar tank. On Van Blommestein’s left was the
    reserve platoon commanded by Captain Ohl.


    The assaulting Menadonese soldiers (**1**) are armed with M.95 carbines (**2**)
    and `klewangs` (**3**). In the background, a soldier throws a hand grenade (**4**).
    When thrown, the grenade’s 2m-long safety band unravelled, causing the safety
    pin to be pulled out in flight. The grenade would explode on impact. In the centre
    of our scene, a gunner carries the standard RNEI Army LMG (**5**), the magazine-fed
    6.5 x 53.5mm M.15 Madsen (`karabijnmitrailleur*). The Japanese paratroopers are
    beginning to retreat (**6**).


    After the recapture of the refinery, Lieutenant Van Blommestein, Menadonese Private
    1st Class Pelealuw and Menadonese Private Buntua each climbed a tower of the refinery
    and lowered the three Japanese flags (**7**) under intense Japanese fire.


    That evening, at 2100hrs, an NEI attempt to extinguish the last Japanese resistance
    of about 15 men using hand grenades failed. The attack left the 10th Infantry
    Battalion with at least one NCO killed and one man seriously injured.


    A number of oil tanks caught fire at the refinery on account of the mortar fire.
    The fire quickly spread due to the strong wind. By midnight, the tank site was
    ablaze. The troops prepared to mop up the paratroopers in the swamp forest in
    the early morning, but at 0330hrs Captain Ohl received orders to withdraw. The
    refinery and its extensive supplies fell into Japanese hands, with only minor
    damage to the installations.


    After midnight on 15 February 1942, the amphibious/riverine part of Operation
    `L` commenced with the arrival of the Japanese transport ships at the anchorage
    at Muntok, Bangka. The Muntok landing unit of 1st Battalion (reduced), 229th Infantry
    Regiment landed at Muntok at 0225hrs and quickly took the city and Muntok Airfield.
    The latter was immediately expanded by the 33rd Airfield Company. The NEI units
    on Bangka and Belitung were ordered to withdraw to Java. The river-ascending units
    left for the Musi Delta and reached the mouth of the river by morning. The Iwabuchi
    Unit on the left wing advanced by the Saleh River past Palembang towards Martapura.
    The IJN supported this advance with minesweeping operations in the rivers. The
    river-ascending units were repeatedly attacked by RAF planes from Palembang II.
    The Japanese suffered only minor losses. Japanese air coverage was limited that
    day due to commitments elsewhere. The IJN was in action against the Combined Striking
    Force, while the Third Air Force supported the second airborne landing. The Military
    Aviation Service and FEAF flew bomber missions against the Japanese landing fleet
    near Muntok, but enjoyed little success.


    ![CAM364_063.jpg](img/CAM364_063.jpg)


    An IJA Type 99 Kawasaki Ki-48 twin-engined light bomber. During the fighting around
    Palembang, some Japanese troops were taken prisoner. On 13 February 1942, in a
    last major preparatory air raid on Palembang, the Japanese 3rd Air Division lost
    three aircraft to British planes: two IJA Type 1 fighters and one IJA Type 99
    Kawasaki Ki-48 from Ipoh Airfield (Malaya). Of the latter, three of the four crew
    members were captured, all wounded. The first pilot was killed. The second pilot,
    probably the navigator, was interrogated by the Dutch. The next day, the same
    interpreter questioned a (hospitalized) Japanese paratrooper prisoner. Captured
    Japanese documents and interrogation reports were sent to Java. The fate of the
    Japanese prisoners of war is unknown. (Public domain)


    The repeated air strikes could not halt the Japanese river-ascending units. This
    eventually made Palembang untenable. During the night of 15 February, Palembang
    received reports from coastguards about the Japanese fleet approaching the Musi,
    the disembarkation in landing craft and the advance up the Musi. The NEI territorial
    commander then ordered the destruction of the oil refineries and the withdrawal
    of troops to Palembang at approximately 0300hrs. The artillery battery located
    at Pradjen on the Musi had to be destroyed and evacuated. Lieutenant-Colonel Vogelesang
    himself moved his command post to the east bank. Sungei Gerong Refinery was thoroughly
    destroyed, but Plaju, on the other hand, fell into Japanese hands with large stocks
    of oil and aviation fuel and only minor damage to its installations. A thorough
    destruction of Plaju had been prepared but not carried out, as the destruction
    troops were not on site on 15 February 1942: the territorial commander had forbidden
    its destruction on 14 February and recalled the unit to Palembang. At 1100hrs,
    the territorial commander prematurely ordered the telephone exchange to be destroyed,
    and retreated to Lahat. The Territorial Command fell apart.


    The withdrawal order applied to troops south-east of the Musi, not to the north
    of Palembang. The order to recapture Palembang I Airfield using 1st Company, 10th
    Infantry Battalion was confirmed by the territorial commander on the morning of
    15 February 1942\. Shortly after noon, the Japanese third echelon, comprising
    3rd Company, 2nd Raiding Regiment (90 men), jumped over Palembang I. The 10th
    Infantry Battalion’s commander, Major B.P. de Vries, was also informed that the
    Japanese landing troops had approached up to 8km via the Palembang River. He then
    decided to call off the counter-attack and withdrew his troops to the east bank
    of the Musi.


    ![CAM364_036.jpg](img/CAM364_036.jpg)


    Japanese paratroopers of the 1st Company, 2nd Raiding Regiment placed flags on
    three of the four distillation towers of Reformplant II at the Plaju Refinery
    near Palembang. In the NEI counter-attack, these flags were removed by an officer
    and two Menadonese soldiers of 2nd Company, 10th Infantry Battalion. Here, Indonesian
    and European soldiers of this unit proudly display one of these flags, having
    returned to Jakarta (Java) from Sumatra, February 1942\. (Beeldbank WW2 – NIOD)


    ![CAM364_034.jpg](img/CAM364_034.jpg)


    The riverine component of the assault on Palembang comprised an advance by three
    units up three rivers, two of which were ordered to make contact with the paratroopers.
    The burning oil refineries along the Musi River can be seen here. This unit is
    most likely the one that ascended the Musi River (the central column), or the
    follow-on 38th Division troops. (ullstein bild via Getty Images)

