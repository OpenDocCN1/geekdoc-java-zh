    # The Defense of Timor


    Australia stationed a flight (four Hudsons) of No. 2 Squadron RAAF and Sparrow
    Force on Timor. Sparrow Force consisted of `2/40th Battalion`, `2/1st Heavy Battery
    (RAA)` and some support and service units under Lieutenant-Colonel `W.W. Leggatt`.
    He also had four `RAAF` armoured vehicles at his disposal. The strength was about
    1,250 men. In the American-Dutch-British discussions in 1941, it was agreed that
    land forces would be commanded by the countries in which they would operate. Timor
    was an exception to this. The island would come under Australian command at the
    outbreak of hostilities.


    ## Initial Defense Strategy


    The Dutch believed that a large-scale landing was only possible in Kupang Bay.
    Lieutenant-Colonel Leggatt questioned this. Nevertheless, he based his defence
    on a direct coastal defence with the NEI troops and `A` and `B` companies, `2/40th
    Battalion` west and east of Kupang respectively and a static coastal battery of
    two `6in.` naval guns. `C Company`, `2/40th Battalion` was located at `Penfoei
    Airfield`, and the motorized `D Company` served as a mobile defence at `Babaoe`,
    on the connecting road 10km east of Kupang.


    Penfoei was attacked from the air from 26 January 1942. As a result, the airfield
    was no longer operational by the end of January. It was subsequently used as a
    stopover point. The rationale for the presence of Australian ground forces had
    thus been invalidated. However, `ABDACOM` decided not to evacuate Timor, but to
    strengthen it with air and ground forces. Of these, only an Australian brigade
    HQ with Brigadier `W.C.D. Veale` and the British `79th Battery` (reduced), `21st
    Light Anti-Aircraft Regiment (RA)` arrived. The rest of the reinforcements were
    attacked by Japanese planes at sea en route and returned to `Port Darwin`.


    ## Japanese Operational Plan


    The Japanese operational plan for Timor consisted of an amphibious landing on
    the south coast at Kupang and near `Dilly` (East Timor) by the `Ito (Eastern)
    Detachment`. This detachment would sail out from Ambon in five transport ships.
    Protection was provided by the `Eastern Attack Unit` consisting of the `5th Cruiser
    Division` as Support Unit, and the `2nd Escort Unit` consisting of the `2nd Destroyer
    Squadron`. The `1001 Unit`, or `3rd Yokosuka SLF` (an IJN paratrooper unit), would
    carry out an airborne assault at `Penfoei`. The `3rd Yokosuka SLF` was originally
    intended for the operation against `Balikpapan`, but its jump was cancelled.


    Admiral `Isoroku Yamamoto`, Commander-in-Chief Combined Fleet, placed the core
    of the `IJN`, the `Carrier Task Force`, less the `5th Carrier Division`, at the
    disposal of the `Southern Task Force` as part of the `Phase III` operations on
    8 February 1942. The `Southern Task Force` deployed the aircraft carriers for
    an air strike on `Port Darwin` (`Mobile Operation I`) and for operations south
    of Java (`Mobile Operation II`). On Thursday morning, 19 February 1942, 188 planes
    from the four `Carrier Task Force` aircraft carriers supported by 54 planes from
    the `21st Air Flotilla` of `Kendari` and `Ambon` attacked the north Australian
    port city of `Darwin`. The latter was an important but poorly equipped base for
    operations in the Netherlands East Indies. With the devastating air strike, it
    was put out of action for the time being.


    ![CAM364_037.jpg](img/CAM364_037.jpg)


    This Japanese SLF petty officer is dressed in the special two-piece uniform with
    extra pockets worn by `IJN` paratroopers. Instead of jump boots, however, he wears
    field shoes with puttees. On the upper right sleeve can be seen his trade badge/rank
    insignia in red on dark blue. This model of trade badge was officially worn until
    November 1942. The paratrooper also wears a leather belt and two canvas ammunition
    bandoleers. Around his neck he wears a bag containing the ashes of a killed comrade.
    He is armed with a `6.5mm Model 38 (1905)` Arisaka repeating carbine with `Model
    30 (1897)` bayonet mounted. (Public domain)


    ## The Landing and Battle


    In the early hours (0235 and 0315) of Friday, 20 February 1942, troops from the
    `Eastern Detachment` landed in three areas on the undefended south coast of Timor.
    `Eastern Detachment` consisted of the `1st` and `3rd` battalions, `228th Infantry
    Regiment`; the `2nd Battalion`, `38th Mountain Artillery Regiment`; and a light
    tank company. The `IJN` delivered two platoons of the `1st Sasebo SLF` and the
    118 remaining troops of the `3rd Yokosuka SLF`. In three columns operating side
    by side, the detachment used trails, tracks and an improved motor road to cross
    the mountain range northwards towards `Kupang` and `Penfoei`. It was like a repeat
    of the attack on Ambon. On 22 February 1942, a fourth landing took place at `Tenau`,
    which included tanks, among other things.


    After the amphibious landing, Leggatt decided to vacate and destroy the airfield.
    `D Company` took up a blocking position south of Kupang on the road to `Baoen`
    to slow the Japanese advance. Along the main connecting road, his line of communication,
    Leggatt wanted to instigate a delaying action. In the open terrain behind `Tjamplong`
    (45km east of Kupang), he intended to make a final stand. This was where his firepower,
    in the form of `.303-cal.` machine guns and `3in. mortars`, would come into its
    own.


    The `NEI Kupang Detachment` cleared their positions on the coast and assembled
    south of Kupang. Part of it had to take up a blocking position on the `Baoen–Kupang`
    road and liaise with `D Company`. No further orders from the territorial commander
    were forthcoming. At the end of the afternoon, Captain `A.L. van Mastrigt` took
    command of the `Kupang Detachment` (189 men) and moved towards `Penfoei`. In the
    morning of 21 February 1942, he and his second-in-command were, however, wounded
    by friendly fire, and dropped out of the line. Their successor, a youthful, nervous
    ensign, did not join the Australians but dissolved the detachment. The `RNEI Army`’s
    role had been played out before it had even started.


    ## Final Assault


    At 1045hrs, the airborne landing by 450 paratroopers from the `HQ`, `1st` and
    `3rd` companies, `3rd Yokosuka SLF` took place on a meadow about 12km from their
    objective: the airfield. This drop zone was chosen because of the heavy losses
    at `Menado`, where the paratroopers jumped directly above the objective. The paratroopers
    blocked the main road at `Babaoe`. This unexpectedly threatened `Sparrow Force`
    in its rear, and cut off its intended retreat route. Leggatt responded by concentrating
    his troops west of `Babaoe` and trying to force his way through. Meanwhile, he
    failed to establish radio communications with Australian troops under Brigadier
    `Veale` in `Tjamplong`. As a result, there was no coordinated joint action against
    the Japanese.


    The next day, at 1024hrs, the second echelon of some 250 men from `2nd Company`,
    `3rd Yokosuka SLF` jumped onto the same drop zone. Leggatt counter-attacked and
    succeeded in recapturing `Babaoe`. However, the `Eastern Detachment`’s right attack
    unit, the reinforced `2nd Company`, `1st Battalion` (206 men), reached the main
    road at the end of the day and formed a new roadblock east of `Babaoe`. Once again,
    the Australian retreat route had been cut.


    In the afternoon of 22 February 1942, `Sparrow Force` managed to finally open
    the road, having attacked several times during the morning. The Japanese vanguard
    from `Kupang` had, however, caught up, followed the next morning by the reinforced
    `1st Battalion`, `228th Infantry Regiment` with light tanks. Lieutenant-Colonel
    `Leggatt` was forced to surrender.

