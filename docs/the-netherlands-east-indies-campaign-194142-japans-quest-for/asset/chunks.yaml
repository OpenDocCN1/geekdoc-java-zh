    鲁道尔夫·亨德里克·范·奥延（Ludolph Hendrik van Oijen，1889–1953）曾担任军事航空队司令官。在皇家军学院毕业后，他于 1911
    年被任命为荷兰东印度陆军（RNEI）的步兵官。1920 年至 1922 年间，他回到皇家军学院担任教师。1922 年至 1925 年，他在参谋学院学习了战争。回到荷兰东印度后，时任参谋部少将范·奥延于
    1934 年 10 月 29 日执掌航空局（`Luchtvaartafdeling`）。他并非飞行员，此前也从未在该兵种服役。然而，在荷兰东印度陆军内部，参谋军官指挥航空局是一个惯例。范·奥延领导了小型航空局转型为装备现代的独立兵种：军事航空局。1939
    年，他成为军事航空局监察员。范·奥延在 1941 年 12 月 7 日目睹了日本对珍珠港的空袭。


    范·奥延在荷兰东印度陆军在爪哇投降前不久撤往澳大利亚。他担任美国荷兰军事飞行学校司令。1943 年，他晋升为中将并任命为副军司令。范·奥延于 1946 年
    1 月从军退役。


    亚瑟·西福斯·布莱克恩（Arthur Seaforth Blackburn，1892–1960）是维多利亚十字勋勋者。他曾指挥爪哇岛一支名为“黑力”（Blackforce）的临时战斗部队。布莱克恩出生于澳大利亚。第一次世界大战期间，他作为澳大利亚帝国军（AIF）的官兵参加了加里波利战役和西线，并在那里获得了
    VC。他于 1917 年因伤退伍回到澳大利亚回归生活，但保留了预备役。1940 年，他以中校身份重新参军。布莱克恩指挥一个机枪营，并在叙利亚参加过战斗。


    他的营级是澳大利亚第 7 师登陆荷兰东印度的先遣部队之一。1942 年 2 月 21 日，布莱克恩获得爪哇岛所有 AIF 人员的指挥权。他在短时间内将他多样化的指挥目标编制成了一支（减员后的）步兵旅。在防御勒武利亚（Leuwiliang）时，他将马来地区的教训铭记在心。他深度部署部队，并形成了反包围机预备队。布莱克恩证明自己是一个精力充沛且富有创造力的指挥。


    ## 敌


    ### 日本


    日本帝国陆军（IJA）和日本帝国海军（IJN）在帝国总总部（IGHQ）共同工作。总总部由皇帝主持，是陆海军的军事和政治最高会议。总总部并非一个伞型总部。武装力量并非隶属关系，而是拥有各自平行的组织。对于联合行动，必须在两个军种之间寻求一致。产生的妥协记录在书面协议中。总总部与政府之间的磋商在总总部—政府联络会议上进行。我们在陆军和海军的作战层面上也发现了这种磋商结构。军种之间的竞争尤为激烈。


    在其所有的 51 个步兵师中，陆军抽出了 11 个用于南方进攻（“A-号”行动），由新成立的南方军（`Nampo Gun`）控制的四个军组成。有三个师被指定用于进攻荷兰东印度。为此，第十六军在今村仁（Hitoshi
    Imamura）中将指挥下于 1941 年 11 月 6 日成立。该军由第 2 师和第 56 师的第 56 混合兵团（坂口支队）组成。在行动后期，又加入了第
    38 师和第 48 师。除第 38 师外，这些都是 A1 型师，是为眼前的任务而挑选的。第 38 师具有中国南方沼泽地带的作战经验，而第 48 师不仅是机械化的，还经过了两栖训练。陆军于
    1940 年 12 月建立了跳伞训练。空降第 1 突击群在荷兰东印度见证了他们的首次战斗。


    由于可用运兵工具的问题，这 11 个师在南方进攻前的兵力从约 24,000 人大幅减少到 13,000–14,000 人。其中三个师实现了机械化。尽管规模缩减，由于船只短缺，第
    2 师不得不留在日本的第 2 野战炮团第 3 营。被分配的师均为三角形编制，由一个标准的步兵团司令部带三个步兵团、一个野战或山炮团、一个侦察团、一个工兵团、一个运输团以及其他支援单位组成。侦察、工兵和运输团实际上是营级单位。


    ![CAM364_013.jpg](img/CAM364_013.jpg)


    这名特种登陆部队（SLF）的日本青年穿着 SLF1937 型制服。他的武器包括一支 6.5mm38 式（1905 年）石坂步复步枪，配有 30 式（1897
    年）安装刺刀。他携着一套 99 式弹药袋。他的右肩挂着一个水壶，左肩挎着一个背囊。他的头盔覆盖着带有迷彩网的布罩。日本人并未将 SLF 士兵视为精英部队，而是视为驻守岸边的海员。（公有领域）


    日本陆军成功进行了一场大胆的军事进攻。由于采取了进取且机动的行动，陆军在整个战役期间掌握并保持了主动权。对手没有获得建立有效防御或部署足够援军的机会。南方进攻在作战层面上按照既定流程进行：获取制空权；进行两栖登陆，有时与空降作战结合；夺取机场；并让陆海军空军部署机场。这一过程随后被重复。通过这种方法，日本确保了其空海优势。各个攻击单位在必要时可以相互支援。这使盟军失去了平衡，并增加了反击的难度。两栖登陆发生在午夜后不久，且往往在多地同时执行。避开了有防御的海岸地带。登陆后，没有花费大量时间巩固阵地，部队大多直接向陆陆。重点是速度，通过道路推进。在爪哇，各师和坂口支队沿两条平行轴作战。坦克领路，步兵在卡车后方。


    联合舰队是帝国海军的作战元素。舰队被组织成若干舰队。任务若干由舰队组成以执行作战任务。南方任务舰队为“A-号”行动成立，是对应南方军的海力量。在进攻马来亚和菲律宾期间（第一阶段行动），它由本队、菲律宾队、马来亚队、航空队和潜水队组成。在进攻荷兰东印度期间（第二阶段行动），菲律宾队的大部分被转移到新成立的荷兰东印度队。

