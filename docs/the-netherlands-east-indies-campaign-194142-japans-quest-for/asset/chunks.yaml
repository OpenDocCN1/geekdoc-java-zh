    # Southern Army operational plan and the Iwakuni Agreement


    ## Notes


    ## OPPOSING PLANS


    ### JAPANESE


    The Netherlands East Indies did not attract the interest of Japan’s armed forces
    until the second half of the 1930s. After the occupation of the Netherlands by
    Germany in May 1940, the `IJA` and `IJN` began a joint study into simultaneous
    operations against four enemies: the United States, Great Britain, the Netherlands
    and China. After a slow start, this accelerated from April 1941. It was now clear
    that a peaceful submission of the Netherlands East Indies was not possible. In
    mid-1941, concrete plans had already been formed.


    The `IJN` planned a ‘clockwise advance’. This plan envisioned the conquest of
    the Philippines from the north by two divisions in two months. Java would then
    also be taken with two divisions. Next, Singapore would be captured in an envelopment
    from Sumatra to the south, and from Malaya to the north. The `IJA`, on the other
    hand, favoured a ‘counter-clockwise advance’. It wished to capture Singapore with
    a rapid advance. It would block British reinforcements and significantly shorten
    the turnaround time of the entire operation. This attack would take place simultaneously
    with the offensive against the Philippines. This meant an attack on both flanks,
    Malaya and the Philippines, which would then meet on Java.


    In the Tokyo Agreement of 10 November 1941, the Southern Army on the one hand,
    and the Combined Fleet and Southern Task Force on the other, laid down their plans
    on paper. In the Iwakuni Agreement, both armed forces reached agreement about
    the Philippines and the Netherlands East Indies. The `IJN` was allocated the clockwise
    advance, and the `IJA` the counter-clockwise one.


    ![table_p27.jpg](img/table_p27.jpg)


    Previously, on 10 October 1941, the `IJA` informed Emperor Hirohito that the capture
    of most of the key areas in the south was possible in about five months (150 days).
    This date was then finalized. The `IJA` and `IJN` agreed the timeframe given in
    [Table 7](#9781472843531-7.xhtml_tab7) for the attack on the Netherlands East
    Indies: codename `Operation H`.


    The main objective and capstone of the Southern Offensive, `Operation A-Go`, was
    the conquest of oil wells and the oil refineries in the Netherlands East Indies.
    The `NEI` campaign depended heavily on the success of Japanese operations elsewhere
    in South-East Asia. This was primarily based on the results of the surprise attack
    on the US fleet in Hawaii. The relocation of the US Battle Force (reorganized
    into the US Atlantic Fleet and US Pacific Fleet on 1 February 1941) to Hawaii
    was considered a significant deterrent by the Americans, but had also brought
    this fleet within reach of the Japanese fleet. The attack was supposed to disable
    the Pacific Fleet for at least six months. The Pacific Fleet would no longer be
    able to thwart the conquest of South-East Asia. The operational plan subsequently
    provided for the conquest and use of Malaya, British Borneo and the Philippines
    as a springboard for the attack on the Netherlands East Indies. The success of
    the Japanese attack on these areas was therefore a precondition for the conquest
    of the `NEI`. These operations affected the Netherlands East Indies campaign in
    a further way. A large part of the `IJN` and `IJA` units destined for the Netherlands
    East Indies were deployed in previous operations in China and the Philippines.
    These only became available after Hong Kong and Manila were conquered. The entire
    outcome of the Southern Offensive would depend on widespread coordination between
    land, sea and air units.


    There was no question of the element of surprise in the operations against the
    Netherlands East Indies. After all, this had evaporated with the operations against
    Malaya, British Borneo and the Philippines. In addition, Java might have in the
    meantime received American and British reinforcements. The enormous distances
    were a further complicating factor. The many dependencies made the Southern Offensive
    an extremely risky operation. A further risk was the often faulty intelligence
    on which the Japanese were forced to base their operational plans.


    The Japanese did not think highly of the combat power of the `RNEI` Army. The
    indigenous troops in particular were considered to lack fighting spirit. They
    expected to conquer Java in about a week.


    **Table 8: Japanese operational codenames**


    | `Operation A-Go` | Southern Offensive |

    | :--- | :--- |

    | `Operation B` | British Borneo |

    | `Operation E` | Malaya |

    | `Operation H` | Java |

    | `Operation L` | Bangka and Palembang |

    | `Operation M` | Philippines |

    | `Operation Q` | landing at Kuantan, cancelled |

    | `Operation S` | landing at Endau, cancelled |

    | `Operation T` | northern Sumatra invasion |

    | `Operation Z` | air campaign against Java |


    ### NETHERLANDS EAST INDIES


    From 1913 onwards, the Netherlands considered Japan as a potential enemy. Japan
    pursued political and economic expansion, and it had the means – a powerful fleet
    and army – to do so. The Netherlands expected that Japan’s striving for an extension
    of its authority could not be achieved on the Asian mainland. It therefore had
    already taken into account that ‘Japan will turn to the South’.


    The Netherlands East Indies consisted of a long chain of many islands. For the
    defence of this archipelago, the preservation of air superiority and control of
    the sealanes was essential. A significant air force and fleet could prevent an
    enemy from acquiring the air and naval bases. The great distances and fragmented
    shape of the archipelago prevented coordinated land defence. It gave an attacker
    with air and naval superiority the opportunity to neutralize a strongly defended
    island by capturing a supporting location on another island. Java was the main
    island and the `NEI` administrative centre, and had by far the most inhabitants.
    Its island form was narrow and elongated. Its strategic locations were also spread
    throughout the island. The administrative centre was in West Java, and the naval
    base in East Java. This called for a robust defence, but at the same time made
    a concentrated defence of the main island extremely difficult.


    Until around 1900, the defence of the `NEI` was based on the defence of Java.
    New Principles of Defence (`Defensiegrondslagen`) were established in 1927. This
    new defensive doctrine broke with the previous one in two key areas. Protecting
    the Netherlands East Indies no longer focused on defence, but instead on maintaining
    neutrality. The Netherlands East Indies was no longer to fear an attack aimed
    at conquest; rather, it was to guard against a `coup de main`. The defensive plan
    was therefore primarily aimed at maintaining Dutch authority in the `NEI` colony.
    The second point of divergence from the former plan was that the defence was no
    longer limited to Java. The Outer Regions were included in the doctrine. Tarakan
    and Balikpapan were identified as particularly vulnerable points due to the extraction
    and refining of petroleum there. The `RNEI` Army was responsible for maintaining
    neutrality in Java with the support of the Royal Netherlands Navy. In the Outer
    Regions, this task was assigned to the navy, with support in some locations from
    the army. If the `NEI` unexpectedly became involved in an armed conflict between
    the major powers, resistance was to be offered until help from a foreign ally
    or allies was forthcoming. In fact, with the Principles of Defence 1927, the Netherlands
    acknowledged that it did not have the means to successfully defend the Netherlands
    East Indies independently against Japanese aggression.

