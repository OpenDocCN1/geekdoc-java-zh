    and a militia section. This position was north of Ambon City on the isthmus between
    Hitu and Laitimor. With this, Kapitz increased the distance from Gull Force in
    the south. The Allied forces were further fragmented by this, and could be defeated
    piecemeal by an already powerful opponent.


    The Eastern Attack Unit and the Air Task Force of the Southern Task Force carried
    out the attack on Ambon. The 2nd Carrier Division was placed under the command
    of the Air Unit. It was a considerable force. Between 0240 and 0250hrs on Saturday,
    31 January 1942, Japan’s Eastern Detachment (Ito Detachment), consisting of the
    228th Infantry Regiment, 38th Division, landed from Hong Kong via Davao on two
    beaches on the undefended south-east coast of Ambon. This threatened the rear
    of the heavily fortified bay at Ambon. After the successful landing, the left
    attack unit, the main force, crossed the mountain ridge in two parallel columns
    over jungle trails under heavy rainfall and a stormy westerly wind (Beaufort Force
    8). The weather cleared around noon. The reinforced NEI defenders were pushed
    aside. In the afternoon, the Japanese entered Ambon City. The RNEI Army and Australian
    troops were thus separated.


    ![CAM364_030.jpg](img/CAM364_030.jpg)


    A sketch of the defence of Laha Airfield, located on a coastal plain at the inner
    bay of the island of Ambon. It was one of the few airfields in the Netherlands
    East Indies with a concrete runway. Quarters, stores and shelters were not dispersed
    or camouflaged, and were in the immediate vicinity of the airfield, which made
    the airfield particularly vulnerable – the more so because the ground-based air
    defence was weak, with two 4cm AA guns and three M.30 (Colt-Browning) 12.7mm AA
    guns from the RNEI Army. (Netherlands Institute of Military History)'
