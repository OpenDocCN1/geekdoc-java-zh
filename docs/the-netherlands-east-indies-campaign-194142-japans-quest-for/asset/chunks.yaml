    ### KENDARI


    Simultaneously with the attack on Balikpapan, the Eastern Attack Unit based on
    Menado struck the important Kendari II Airfield in South-East Sulawesi. Here,
    too, the landing by the Sasebo Combined SLF took place in the early morning (0422hrs).
    The same day, the city and (at 1700hrs) the airfield were occupied almost undamaged.
    The RNEI Army garrison at Kendari had about 500 men. The planned robust defence
    of the airfield did not take place due to weak leadership and a resultant lack
    of willingness to fight. The NEI troops withdrew to the interior, where a large
    part deserted or were even sent on leave. At least six NEI soldiers were killed
    on 24 January 1942.


    The IJN switched to Phase III operations on 24 January 1942\. With the conquest
    of Balikpapan and Kendari, Java came within flying range of the Japanese land-based
    bombers and fighters.


    ### SINGKAWANG


    Because Kuching Airfield did not meet Japanese expectations, the IJN put its hopes
    on the secret airfield discovered on 20 December 1941, Singkawang II (referred
    to as Ledo in Japanese sources). On 28 December 1941, the Southern Army ordered
    the Kawaguchi Detachment to prepare for the capture of this base. To the chagrin
    of the Southern Army, however, Kawaguchi saw little point in an operation against
    Singkawang II. On 6 January 1942, the annoyed leadership of Southern Army ordered
    Kawaguchi to conquer Singkawang as soon as possible.


    **THE JAPANESE ASSAULT ON MENADO, 11–12 JANUARY 1942**


    The Japanese captured Menado Langoan (II) airfield and the seaplane base with
    a simultaneous amphibious and airborne assault by naval landing and airborne forces.
    The NEI forces were caught in a pincer movement, from Menado in the west and Kema
    in the east, with Japanese paratroopers attacking in the centre near the airfield.
    The scattered and outnumbered NEI forces managed to slow the inland advance of
    the Japanese amphibious forces by delaying actions from prepared positions. They
    could not, however, prevent them from establishing overland contact with the paratroopers.
    The airfield was fiercely defended, but fell into Japanese hands after a brief
    fight. NEI counter-attacks lacked coordination, were too weak, and failed, whereupon
    remnants of the garrison retreated into the mountains to begin an ill-fated guerrilla
    campaign.


    Note: gridlines are shown at intervals of 5km (3.1 miles)


    ![CAM364_BEV001.jpg](img/CAM364_BEV001.jpg)


    JAPANESE


    **Sasebo Combined Special Landing Force:**


    **A.** 1st Sasebo SLF


    **B.** 2nd Sasebo SLF


    **C.** 1st Yokosuka SLF


    NEI


    **Menado Troops Command**


    **1.** Menado Company and two 7.5cm guns


    **2.** A Company, Veteran Reserve Corps


    **3.** Detachment E, Veteran Reserve Corps (45 men); coastal guard stationed on
    the west coast (beyond map confines)


    **4.** European Militia and Homeguard Company


    **5.** Menadonese Militia Company (beyond map confines, took no part in the fighting)


    **6.** Town Guard


    Kakas Tactical Command:


    **7.** C Company, Veteran Reserve Corps, and three 3.7cm guns on trucks


    **8.** D Company, Veteran Reserve Corps


    **9.** Mobile Column (45 men in three armoured cars)


    Reserve:


    **10.** KV Company (Short Service)


    **11.** B Company, Veteran Reserve Corps


    ![image](img/common.jpg)**EVENTS**


    Times are given in Japan Standard Time (JST – UTC+09:00) unless otherwise stated.
    Celebes Time (CBT) was UTC+08:00.


    **11** **January 1942**


    **1.** 0400hrs: Amphibious night landing of Sasebo Combined SLF HQ with support
    units and 1st Sasebo SLF (*c*. 1,800 men) north and south of Menado. The outnumbered
    NEI defenders are caught off-guard and soon cut off. The Japanese seize the city
    at 0830hrs.


    **2.** 0420hrs: Amphibious night landing of 2nd Sasebo SLF (*c*. 1,400 men) at
    Kema. The small NEI coastal guard detachment (two sections) of A Company is driven
    off. The Japanese force moves inland by road, spearheaded by three light tanks.


    **3.** 0952–1020hrs: First drop of 1st Yokosuka SLF consisting of battalion HQ,
    signal unit and 1st and 2nd companies (334 men) at Langoan Airfield. The NEI defenders
    lay down heavy cross-fire, but are forced to retreat. By 1125hrs, the airfield
    is in Japanese hands.


    **4.** 0945hrs: 1st Sasebo SLF, spearheaded by four light tanks, heads for Tomohon,
    but is slowed by successful NEI delaying actions using the prepared defensive
    position at Tinoör and an ambush at Kakaskasen. The numerically superior Japanese
    push forward and seize Tomohon at 1930hrs.


    **5.** To block the route from Kema inland, A Company issues orders to concentrate
    at Ajermadidih. Only one section (20 men), reinforced with a section from Menado
    Company, manages to reach the prepared position to fight a delaying action around
    1300hrs. The 2nd Sasebo SLF occupies Ajermadidih at 1400hrs.


    **6.** At Kakas, the Mobile Column (two armoured cars) is sent to support the
    airfield defenders. It runs into a Japanese reconnaissance squad. Only the crew
    of one armoured car manages to reach Kakas, on foot, in a fighting retreat.


    **7.** During the morning, the Officer Commanding Menado moves most of his reserves
    from Kakas to stop the Japanese advance inland. A counter-attack by the two remaining
    sections of KV Company in the direction of the airfield from the south fails.


    **8.** 1300hrs: Having secured the airfield, 1st Yokosuka SLF heads towards the
    secondary objective of Tasoeka seaplane base. C Company (reduced), west of Kakas,
    fails to block the Japanese advance. At 1450hrs, Kakas is taken followed at 1800hrs
    by the seaplane base. The main body of 1st Yokosuka SLF returns to the airfield.


    **9.** 1450hrs: Two Japanese flying boats, carrying the 1st Yokosuka SLF’s paymaster,
    medical and AT units, land on Lake Tondano.


    **12 January 1942**


    **10.** In the morning, the Japanese 3rd Company jumps onto Langoan Airfield.
    The 1st Yokosuka SLF then launches a full-scale attack on Langoan city; it is
    taken at 1125hrs, followed by Tompaso at 1230hrs. Paso is seized at 1100hrs.


    **11.** 0810hrs: Sasebo Combined SLF captures Tondano. The 1st Sasebo SLF heads
    for the airfield along the road from Tomohon to Tompaso. The 2nd Sasebo SLF moves
    by road along the western and eastern shores of the lake.


    **12.** 1100hrs: 2nd Sasebo SLF makes contact with 1st Yokosuka SLF near Paso.
    1st Sasebo SLF establishes contact at 1230hrs near Tompaso. They reach Langoan
    and Kakas by 1400hrs. The operation is over.


    **12 January–20 February 1942**


    **13.** Remnants of the NEI garrison begin a planned-for guerrilla war, but the
    lack of popular support and resources, and the unsuitable terrain, dooms it to
    failure. After the fall of the major towns, desertion is high in almost all the
    remaining NEI units. By the end of February, all is over.


