    #### Central Java'
  toc: []
  trans: '

    日本第 2 师的步兵团通常为其三分之一的连队配备自行车。由于道路被毁，自行车被证明是理想的交通工具。这些日本军队正前往雅加达。根据日本《每日新闻》（*Mainichi*）报的报道，热情的印度尼西亚人在路旁观看。今村将军将荷兰东印度群岛（NEI）的失败部分归因于“当地人背叛荷兰人”。（每日新闻报）


    小司（Shoji）指派若松所属第 2 营的三个连队、第 4 坦克团第 1 连以及两个山炮营去进攻齐亚特尔关口（Ciater Pass）的阵地。枝仓部队因荷兰东印军的破坏和抵抗而延迟，最终到达了齐塔鲁姆河，但发现桥梁已被毁。小司将该部队召回到苏邦。若松于
    1942 年 3 月 5 日（周四）下午 1600 左右发起了进攻。若松部署了他的营，并利用地形、植被、地面雾和一场短暂的大雨，夺取了第一、第二道防线的若干处碉堡。他决定在战场过夜，并在第二天继续进攻。根据小司的，只有前哨站被占领，脊上的主抵抗线仍需攻克。3
    月 6 日早晨，若松明确了自己已经突破了主防御体系。


    3 月 5 日下午，第 4 步兵团指挥官德维尔（W.J. de Veer）上上接了齐亚特尔阵地的部队。德维尔在 1942 年 3 月 5 日至 6 日夜间组织了深层防御，援军缓慢地在后方汇集到齐亚特尔阵地后。他将（爪哇人的）第
    2 步兵营第 2 连和（欧洲人的）第 5 步兵团第 1 连部署在左侧铁丝网后的坑道和战壕中，并将苏邦—万隆路右侧的第 21 步兵团左半部分直接部署在齐亚特尔阵地后。第二道线是由正在建设的瓦特斯（Wates）阵地的帕德库珀部队（Paardekooper
    Detachment，包括学员和预备军官候选人）组成的。第三道线是由希哈亚部队（Siahaya Detachment，安布隆斯新兵）在托尔赫克（Tolhek）三岔路口的全方位防御。第
    2 山炮营第 3 射收到第 2 射的加强。尽管援军已到达，第 1 步兵团第 2 连在当晚撤离了阵地。


    ![CAM364_049.jpg](img/CAM364_049.jpg)


    1940 年，在苏邦—万隆路的齐亚特尔关口建立了一个团级作战阵地。该阵地位于一片茶园内。由木桩和铁轨组成的反坦克障碍物由碉堡内的 5 厘米海军炮覆盖，战壕构成了前哨线。在跨越山谷的桥后面，坡度较高处，有两排由战壕连接的碉堡。该阵地最初被遗弃和忽视，但在
    1941/42 年被占领并防御。这张模糊的照片显示了齐亚特尔碉堡之一；请注意其坡度陡峭且杂草丛生的地形，以及有限的射界。（公有领域）


    ![CAM364_050.jpg](img/CAM364_050.jpg)


    一门位于竹林中的 7.5 厘米山炮（*Bergartillerie*）。这门炮仍带有金属轮子，而大部分装备已改为橡胶轮胎。大炮被装在卡车上运输。两个各四门炮的营在齐亚特尔关口参加了战斗。大炮被用步兵支援武器。炮兵营分配给步兵单位。然而，在齐亚特尔关口，荷兰东印军步兵连长说他需要步兵而不是炮兵。（Beeldbank
    WO2-NIOD）


    在第 2 师区域北方轴线上，仅剩两个营的佐藤部队（Sato Detachment）于 1942 年 3 月 5 日晚晚进入了抽空的雅加达。由于荷兰东印军已撤退，他们在雅加达以西没有遇到抵抗。迅速占领首都是令第十六军感到意外。在黑色部队（Blackforce）从勒乌利亚斯（Leuwiliang）撤退后，第
    2 师的主力采取包围运动进攻布哥尔。该城市于 1942 年 3 月 6 日早晨落入日本人手中。下一个目标是万隆。


    3 月 6 日周五早晨，若松少对临时防御的左翼发起进攻。道路左侧的两个连在领取面包时措手不及，因为他们没有设置前哨。然而，连队很快恢复了战斗并击退了两次步兵进攻。第三次进攻得到了苏邦—万隆交汇处三辆日本坦克的大炮和机枪火力支持，但这次进攻也被击退了。然而，阵地面临被攻破的威胁。伤痕累累的连停止了战斗向右侧撤退。部队在撤退过程中四散了。虽然没有受到攻击，但第
    21 步兵团左半部分（除一个排外）在未受攻击的情况下，在第一声枪响起时就撤退了。齐亚特尔阵地被彻底突破。获得成功后，若松没有追击撤退的荷兰军队，而是巩固阵地以等待枝仓的到达。


    在这些战斗中，约 74 名荷兰东印士兵被日俘。3 月 6 日下午或 3 月 7 日早晨，几乎所有的俘虏都被日本人处决，只有少数人从屠杀中幸存。


    3 月 6 日下午，德维尔上校决定放弃瓦特斯位置，将防御集中在托尔赫克的三岔路口。日本步兵对三路口的主要进攻被一次袭性攻击击回。德维尔上校被杀。1942 年
    3 月 7 日早晨，托尔赫克路口的部队接到命令撤往兰邦（Lembang）。


    兰邦北方，用第 9 步兵团、第 15 步兵团和德弗里斯营（由第 2 步兵团残部组成）建立了临时防御线。此外还有两个苏门答西西部连、西苏门答驻守兵以及第 4
    步兵团。从纸面上看，这是一支不错的战斗力量，但士气通常很低，因此战斗价值存疑。此外，印尼共和国军（RI Army）显示出瓦解迹象。随着齐亚特尔阵地的突破，战斗似乎已经结束了。


    ![CAM364_051.jpg](img/CAM364_051.jpg)


    一幅日本战争画，描绘了日本陆军第 99 式攻击机（三菱 Ki-51 型，盟军代号 Sonia）来自第 27 空群、第 3 航空师对荷兰东印军摩托化纵队的攻击。空中力量是南方进攻的决定性因素。通过对盟军机场的攻击以及切断爪哇与外界之间的空中通信线，日本确保了空优。这种支配地位被用于盟军船只和地面部队。日本几乎不断的侦察、扫射和轰炸活动瘫痪了荷兰东印军的移动并削弱了士气。（荷兰军事史研究所）

