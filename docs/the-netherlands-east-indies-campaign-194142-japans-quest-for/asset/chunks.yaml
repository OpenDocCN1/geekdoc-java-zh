  raw: 'A Japanese motorized column crossing the bridge over the Brandas River at
    Kediri. The bridge was seized intact. Leading the columns is an American half-track
    captured on the Philippines, followed by heavily camouflaged Nissan 80 trucks.
    Lieutenant-General Tsuchihashi, GOC of the 48th Division, had insisted more than
    once on the capture of the bridge at Kediri. However, his vanguard had focused
    on capturing the bridge at Kertosono and initially had not sent a unit to Kediri
    as planned. (Beeldbank WW2 – NIOD)


    When the destruction in Surabaya was almost complete, on 4 March 1942 Ilgen’s
    forces were freed up to conduct an offensive action. According to Ilgen, only
    forward-reconnaissance Japanese units at Ngawi and Bodjonegoro were active. Using
    his Mobile Group in a pincer move, he sought to recapture Cepu. Part of his mobile
    forces formed a blocking position behind the Brantas River. The plan of attack,
    based on an incorrect assessment of the enemy troops, could only end in failure.
    The troops lacked fire support and the southern pincer in particular was numerically
    too weak, not to mention the ambiguous nature of the orders issued. The northern
    axis of the NEI counter-attack clashed with the supporting attack of the Kitamura
    Unit (48th Reconnaissance Regiment) and was driven back. On the southern axis
    of advance, the De Iongh Detachment (3rd Cavalry Squadron and 10th Battalion,
    6th Infantry Regiment) fought a delaying action against the vanguard of the Abe
    Unit and was driven back even before the Naval Battalion arrived. The Abe Unit
    reached Kertosono on 5 March 1942\. The bridge over the Brantas was destroyed.
    Due to the rapid and powerful Japanese advance, the counter-attack ordered by
    Ilgen had come to an end before it had even started.


    ![CAM364_056.jpg](img/CAM364_056.jpg)


    A Dutch Naval Battalion LMG team, consisting of gunner and assistant. The weapon
    is a Breda M30 7.35mm LMG, captured from Italian troops in Africa and suplied
    by the British. (Collectie Mariniersmuseum, Rotterdam, 45789)


    At Kertosono, the Japanese managed to force a passage over the Brandas the same
    day. The bridge at Kediri fell into Japanese hands undamaged that day. The blocking
    position behind the Brandas was thus compromised. The Abe Unit quickly advanced
    towards Porong. On 6 March 1942, the vanguard of the Abe Unit, comprising infantry
    supported by artillery, tanks and aircraft, launched an attack. The NEI defence
    was quickly broken and Porong occupied. Surabaya was thus surrounded. The 48th
    Division prepared to attack Surabaya on 9 March 1942\. However, on 8 March, the
    white flag was raised. The battery from 17th Heavy Field Artillery, armed with
    15cm howitzers and brought in especially from Manchuria for the attack on Surabaya,
    did not have to take action.


    After the failure of the planned counter-attack, and the Japanese pincer movement
    towards Surabaya, Ilgen made preparations for the transition to guerrilla warfare.
    But the capitulation rendered this unnecessary. In the afternoon of 8 March 1942,
    the Japanese entered Surabaya.


    ### SURRENDER


    Against the background of a disintegrating RNEI Army and a crumbling NEI colonial
    administration, Major-General Pesman offered a local surrender in the evening
    of 7–8 March 1942\. However, Lieutenant-General Imamura wanted to take the opportunity
    to enforce an overall capitulation. Negotiations took place on 8 March in Kalidjati
    between Imamura on the one hand, and Governor General Van Starkenborgh Stachouwer
    and Lieutenant-General Ter Poorten on the other. The NEI delegation had to accept
    the inevitable. Moreover, the Japanese were threatening to bomb Bandung. The RNEI
    Army capitulated on 9 March 1942.


    ![CAM364_060.jpg](img/CAM364_060.jpg)


    This war painting by Koiso Ryohei shows the first meeting, in the evening of 8
    March 1942 in an officers’ house at Kalidjati Airfield, between the commanders
    of the Japanese Sixteenth Army and the RNEI Army. The Japanese delegation is seated
    to the right of the table, and the NEI military delegation to the left. (KTOMM
    Bronbeek)


    The British, Australian and American troops in Java signed a capitulation agreement
    in Bandung on 12 March 1942\. Brigadier Blackburn had wanted to continue the battle
    south of Bandung after the capitulation of the RNEI Army in hopes of diverting
    to Australia. However, he could not make contact with Australia. Without supplies
    of food, ammunition and medicine, surrender would have just been a matter of time.
    He, too, thus accepted the inevitable.


    Between 7 December 1941 and 8 March 1942, approximately 1,500 European and Indonesian
    soldiers of the RNEI Army were killed in action. Because the data of the Dutch
    War Graves Commission is incomplete, the true number is probably higher. The Royal
    Netherlands Navy suffered 1,650 casualties. Prisoner-of-war numbers are given
    in [Table 11](#9781472843531-8.xhtml_tab11):


    ![table_p90.jpg](img/table_p90.jpg)


    Figures are missing for Indonesian prisoners of war. Indonesian Muslim prisoners
    of war were released from April 1942 onwards. Christian Ambonese and Menadonese
    prisoners of war are excluded.


    The losses for Japanese Sixteenth Army amounted to 311 killed and 832 wounded.
    Losses for the IJN’s Netherlands East Indies Unit totalled 285 killed and 361
    wounded.


    ### OPERATION *T* (NORTHERN SUMATRA)


    After the conquest of Palembang and the advance to Bandar Lampung, the IJA 38th
    Division had also captured Bengkulu and Djambi respectively on 24 February and
    4 March 1942\. Central and North Sumatra were still in Dutch hands.


    ![CAM364_061.jpg](img/CAM364_061.jpg)


    On 9 March 1942, Lieutenant-General H. ter Poorten and Lieutenant-General Hitoshi
    Imamura met once again to finalize details and to sign the surrender agreement.
    Afterwards, a group photo was taken on the veranda of the house. In the middle
    is Lieutenant-General Hitoshi Imamura, with tropical helmet in hand, accompanied
    by staff members. To the left of him, in the back row, wearing spectacles is Major-General
    Saburo Endo. To the right of Imamura stands Major-General R. Bakkers, Lieutenant-General
    H. ter Poorten, Lieutenant-Colonel P.G. Mantel and (in the second row, behind
    Mantel) interpreter Captain J.D. Thijs. (Beeldbank WW2 – NIOD)


    The NEI troops in North and Central Sumatra consisted of lightly armed garrison
    infantry supplemented with militia, Home Guard and Town Guards. Tactical units
    did not exceed one or more brigades of 20 men. Even before the Japanese attacked,
    armed resistance against Dutch colonial authority erupted in Aceh in February
    1942\. The RNEI Army troops in Aceh were then largely deployed to quell this,
    and after the Japanese landings also protected the evacuation of the European
    population and relatives of Indonesian soldiers.


    On 12 March 1942, the IJA Imperial Guard Division landed in four locations on
    North and East Sumatra as planned. The landings were uncontested. The NEI units
    suffered from large-scale desertion among Indonesian soldiers. European troops
    maintained their cohesion, but lacked any fighting spirit. On 28 March 1942, the
    remaining NEI units capitulated.


    ### Notes


    ## AFTERMATH


    After the Java Campaign had ended, large parts of the Netherlands East Indies
    remained unoccupied. In three operations, New Guinea and the Lesser Sunda Islands
    were occupied without a fight between March and May. The islands located between
    New Guinea and Australia followed between late July and September 1942\. In July,
    these islands were occupied by small NEI detachments from Australia (Operation
    *Plover*). Only Merauke in the far south of New Guinea remained in Dutch hands.'
