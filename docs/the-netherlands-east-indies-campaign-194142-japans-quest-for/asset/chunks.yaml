    庄司寿志（Toshishige Shoji）佐是今村的老相。他们曾在多个部队中共役过一段时间。1942 年 3 月 2 日，在士邦（Subang），庄司对荷属东印度（NEI）移动部队的反击感到吃惊。荷兰人并未意识到他司令部的存在并继续向前推进。1942
    年 9 月，第 38 师第 230 步兵被转移到拉包尔并部署在关岛加纳尔。在那里与美军的战斗中遭受了惨重伤亡。关岛战役失败导致庄司从前线部队调往军团和守备部队。战争结束时，他担任日本仙台地区司令。这张照片拍摄于他
    1944 年 3 月晋升为少将之后。（公有领域）


    ![CAM364_006.jpg](img/CAM364_006.jpg)


    远藤三郎（Saburo Endo）少将指挥第 3 航空军。该部队参与了马来亚、苏门答腊和爪哇战役。他是一位经验丰富的谋长。1942 年 3 月 3 日，他飞往加里加提（Kalijdati）。他的飞机在机场击退了荷属东印度的主要反击。随后，远藤支持了庄司对齐亚特（Ciater）的进攻。他根据自己的主，将重点从为西爪哇的推进提供空中支持转为对万隆的进攻。也是远藤在投降会议前，明确威胁荷兰代表团将轰炸万隆。此后，他出任陆军航空军总部总务部部长。1945
    年，远藤担任航空兵器局局和航空工业委员会主席。照片显示了远藤晋升为中将后，穿着 M1943 式（3 型）军服。（每日新闻报）


    庄司少将于 1949 年被雅加达的临时军事法庭因其在加里加提、士邦和齐亚特山口的战争罪行判处死刑。然而，这一判决在上诉后被改为十年有期徒禁。


    ### 远藤三郎少将 (1893–1984)


    远藤三郎少将是日本帝国陆军航空军（IJAAS）第 3 航空军司令官。远藤于 1914 年毕业于军官学校，1922 年毕业于军参谋学校。他成为一名炮兵官。他在
    1927 年日内瓦裁军会议和 1931 年联盟国裁军会议上获得了国际经验。作为参谋官，他于 1937 年被分配到北华方面军。远藤在职业生涯后期转入空军。他是一位激进的指挥官。在爪哇，远藤对第
    2 师缓慢的进展感到恼火，因此全心支持庄司进攻万隆的决定。他根据自己的主意，将第 3 航空军提供的空中支持重心从第 2 师转移到了庄司支队。他因第 3 航空军在马来亚和荷属东印度战役中的表现受到了第
    25 军和第三空军的赞扬。


    ### 坂口静雄少将 (1887–1947)


    坂口静雄（Shizuo Sakaguchi）少将于 1941 年成为第 56 师步兵团司令官。为了南方攻势，该团被重组为第 56 混合步兵团或 A 支队（坂口支队）。坂口少将参加了从打拉干到爪哇的反对荷属东印度的整个战役。除了机场基地，他的部队还占了重要的油井和设施。为了实现目标，坂口也极其残忍且富有：残忍是因为当油井设施被毁时，他部分执行了巴里巴板（Balikpapan）处决荷属东印度军队守军和荷兰平民的威胁；富有是因为他具备临变能力，这从他根据新信息最后调整巴里巴板的进攻计划，以及部署叛变的印度尼警察中可见。在进攻万加锡（Bandjermasin）战中，在海军支援停止后，他组织了一个由小船组成的船队从海面进攻了该城市。他的野心体现在他主动请出自己的部队参加入侵爪哇，尽管这并不在计划之内。


    ![CAM364_007.jpg](img/CAM364_007.jpg)


    坂口静雄少将是第 56 师步兵团司令官。他在荷属东印度战役期间领导坂口支队。他充满野心且富有创意，但也十分残忍。1943 年，他晋升中将并在中国担任师长。他于
    1945 年 4 月退役。（公有领域）


    ### 盟军


    ### 海因·特·波滕（Hein ter Poorten） (1887–1968)


    海因·特·波滕（Hein ter Poorten）于 1939 年至 1941 年担任荷属东印度陆军参谋长。在前任死于致命空机事故后，他于 1941 年 10
    月 23 日成为荷属东印度陆军兼战争部部长（陆军司令）。他被晋升为将。随着 ABDA 司令部（ABDACOM）的建立，特·波滕还成为了 ABDA-ARM（即
    ABDA 陆军）司令。


    特·波滕于 1887 出生于爪哇的布滕佐（（博哥），1908 年被任命为殖民军炮兵官。特·波滕是军事航空领域的先驱。他是第一位获得国际飞行执的荷兰职业军官（1911
    年）。1915 年至 1917 年，他在飞行飞行服役。1919 年至 1922 年间，他在荷兰参谋学院（*Hogere Krijgsschool*）学习战争研究。特·波滕于
    1937 年成为炮兵监察。1939 年，这位前陆军司令称他为“一位特别有天赋的军，一个想法独特、见识广博且洞察力敏锐的人……一位强大的领导，决策流畅而谨慎”。他是马来亚、澳洲以及菲律宾美国合作的支持者。特·波滕希望守住新加坡并保留爪哇作为盟军反攻的主要基地。


    战争爆发两个月后，54 岁的特·波滕精疲力竭不得不寻求治疗。结果，在所讨论期间，他的身心状态并非最佳。他远非一个大乐观主义者，对胜利的机会没有幻想，因此被批评为消极。据说这位陆军司令在战斗中没有表现出领导力。他非常依赖他的参谋长巴克斯（Bakkers，后升少将）校。


    与荷属东印度总督兼总司令贵族外交官斯塔肯博格·斯塔丘韦（Jhr. Starkenborgh Stachouwer）的关系困难。这即使在加里加提与日本人的投降谈判中也显而易见。特·波滕清楚爪哇已经失守，日本人期望全面投降。参加了最初讨论的总督希望谈判部分投降，并就继续民政达成协议。他指责特·波滕具有失败主义。


    ![CAM364_008.jpg](img/CAM364_008.jpg)


    H·特·波滕中将在担任参谋长两年后，由于继任，在前任去世后，于 1941 年 10 月初被任命为荷属东印度陆军司令。他于 1942 年 1 月也成为了 ABDA-ARM
    司令。作战陆地区域分散，以至于这个指挥权实际上涵盖很少。指挥负担被证明是沉重的。在这张照片中特·波滕看起来很健壮。然而，当日本第十六军踏上爪哇土地时，他已精疲力竭，状态远非最佳。特·波滕穿着
    1941 年 9 月的新野战，但是短袖的。作为炮兵官，他在衬衫肩部佩戴着炮兵章。（私人收藏）

