    Partial NEI mobilization in outlying areas, and of coastal, anti-aircraft artillery
    and searchlight personnel, on Java, Madura, Bali and Lombok.


    ## 1942


    ### 9 December

    NEI troops turn out for the partial mobilization.


    Aircraft Group (`Vliegtuiggroep`, `Vl.G.`) and a fighter squadron of the RNEI
    Army Military Aviation Service are stationed in Singapore.


    ### 10 December

    Destruction of British naval Force Z: HMS `Prince of Wales` and HMS `Repulse`
    are sunk by Japanese aircraft.


    ### 11 December

    General mobilization of the RNEI Army.


    ### 12 December

    NEI troops turn out for the general mobilization.

    Sparrow Force disembarks on Timor.


    ### 16 December

    Japanese landing and capture of Miri, British Borneo.


    ### 17 December

    Gull Force disembarks on Ambon.

    Netherlands–Australian expedition disembarks at Dilly, Portuguese Timor.


    ### 24 December

    Japanese landing at Kuching, British Borneo.


    ### 27 December

    Japanese forces occupy the NEI Tambelan Islands in the South China Sea.


    ### 29 December

    19th Bombardment Group (`USAAF`) transfers from Australia to Malang, Java.


    ### 10 January

    General A.P. Wavell and his staff arrive at Batavia (Jakarta).


    ### 11 January

    Japan declares war on the Netherlands.

    Japanese landings on Tarakan and at Menado. Menado is taken.

    HQ 26th Field Artillery Brigade and 2nd Battalion, 131st Field Artillery Regiment
    (both US Army) disembark at Surabaya, Java.


    ### 12 January

    RNEI Army garrison in Tarakan surrenders, formalized the following day.


    ### 15 January

    American-British-Dutch-Australian Command (`ABDACOM`) is activated.


    ### 18 January

    Transfer of HQ No. 225 (Bomber) Group (`RAF`) from Singapore to Palembang, Sumatra.


    ### 24 January

    Japanese amphibious landings at, and capture of, Balikpapan (East Borneo) and
    Kendari (Sulawesi).

    Naval engagement at Balikpapan.


    ### 27 January

    Japanese capture of Singkawang II Airfield (West Borneo).


    ### 30 January

    Japanese occupation of Pontianak, West Borneo.


    ### 31 January

    Japanese amphibious landings on Ambon and conquest of Ambon City.


    ### 1 February

    Main body of RNEI Army troops surrenders on Ambon.

    Formation of HQ No. 226 (Fighter) Group (`RAF`) in Palembang, Sumatra.


    ### 2 February

    Arrival of British 6th Heavy Anti-Aircraft Regiment (reduced) and 78th Battery,
    35th Light Anti-Aircraft Regiment (`RA`) in Palembang.


    ### 3 February

    Surrender of Gull Force on Ambon.


    ### 4/5 February

    Naval action in the Makassar Strait. Japanese air attacks on the Combined Striking
    Force.


    ### 4 February

    British 77th Heavy Anti-Aircraft Regiment (`RA`), 21st and 48th Light Anti-Aircraft
    regiments (`RA`) and HQ 16th Anti-Aircraft Brigade disembark at Jakarta.


    ### 7 February

    Japanese occupation of Samarinda (East Borneo).


    ### 9 February

    Japanese amphibious landing at, and conquest of, Makassar.


    ### 10 February

    Japanese occupation of Bandjermasin.


    ### 14 February

    Japanese airborne landings at Palembang and capture of Palembang I Airfield.

    British B Squadron, 3rd The King’s Own Hussars disembark in South Sumatra.


    ### 15 February

    Japanese landing on Bangka.

    Naval action in the Gaspar Strait.

    Japanese occupation of Palembang.

    The fall of Singapore.

    `ABDACOM` decides to evacuate South Sumatra.


    ### 19 February

    Japanese landing on and conquest of Bali.

    Japanese air raid on Darwin, northern Australia.

    Combined Chiefs of Staff decide not to send Australian I Corps to Java.

    Disembarkation at Jakarta of part of the Australian 7th Division advance guard
    and formation of ‘Blackforce’.


    ### 19/20 February

    Naval Battle of Badung Strait (Bali).


    ### 20 February

    Japanese landings on Timor and conquest of Kupang and Dilly.


    ### 22 February

    Decision to withdraw United States Army Air Forces (`USAAF`) units from Java.


    ### 23 February

    Surrender of Sparrow Force on Dutch Timor.

    `ABDACOM` is dissolved.


    ### 27 February

    USS `Langley` (carrying a cargo of fighters) is sunk south of Java.


    ### 27/28 February

    Battle of the Java Sea.


    ### 28 February/1 March

    Japanese landings on Java.

    Naval action in Bantam Bay (Battle of Sunda Strait).


    ### 1 March

    Japanese Shoji Detachment takes Kalidjati Airfield.

    East Group (`USAAF`) begins evacuating from Java to Australia.


    ### 2 March

    Counter-attack by the RNEI Army Mobile Unit (`Mobiele Eenheid`) at Subang.


    ### 3/5 March

    Battle at Leuwiliang between units from the Japanese 2nd Division and Blackforce.


    ### 3 March

    Counter-attacks by 2nd Infantry Regiment (reinforced) and RNEI Army Teerink Group
    on Kalidjati fail due to air attacks.


    ### 5 March

    Japanese Shoji Detachment attacks the Ciater defensive position.

    Jakarta is evacuated by the RNEI Army and occupied by the Japanese.


    ### 6 March

    Ciater defensive position breached by the Japanese.


    ### 7 March

    RNEI Army Bandung Group offers local surrender.


    ### 8 March

    Negotiations concerning the RNEI Army’s complete surrender take place in Kalidjati.

    Cilacap and Surabaya are occupied by the Japanese.


    ### 9 March

    The RNEI Army surrenders.


    ### 12 March

    Surrender of Allied armed forces in Java.

    Japanese Imperial Guard Division lands in North Sumatra.


    ### 28 March

    Surrender of RNEI Army in North and Central.


    ## OPPOSING COMMANDERS


    ### JAPANESE


    **Lieutenant-General Hitoshi Imamura (1886–1968)** was the commander of the Sixteenth
    Army in 1942. He became an officer in 1907. In addition to these foreign postings,
    he served as staff of the of General Staff. From 1940 to 1941, he served as deputy
    Inspector General of of Training. On 6 November 1941, his appointment by the emperor
    as commander of the Sixteenth Army followed. Due to the and and of of, equipment,,
    had had and command over the Sixteenth Army during the campaign in Java.


    Imamura was known in the Japanese military for his ‘bravery as a commander with
    a resolute and indomitable fighting spirit’. He was a skilled organizer and willing
    to take great operational risks. After the war, he was charged with war crimes
    by the Australian government. He was found guilty and sentenced to ten years’
    imprisonment. In 1948–49, the Temporary Courts-Martial in Jakarta also brought
    him to trial for war crimes in Borneo and Java. However, he was acquitted.


    **Colonel Toshishige Shoji (1890–1974)** was commander of the 230th Infantry Regiment,
    38th Division in 1941. This regiment took part in the conquest of Hong Kong in
    December 1941 and the attack on Java in March 1942. Imamura personally chose Shoji
    to lead an important secondary operation in Java with a small regimental battle
    group. He trusted that Shoji would act independently and would demonstrate appropriate
    initiative if necessary. Shoji did indeed do this, but not as anticipated by Imamura.
    In fact, he acted against explicit orders by attacking the Ciater defensive position
    on his own, a bold action that was rewarded with success: he breached the heart
    of the NEI defence in two days and decided the campaign.

