  trans: "\n\n1942 年 2 月，一支由爪哇的澳大利亚部队和散兵组成的临时步兵旅团成立了：`Blackforce`（黑力部队）。`A.S. Blackburn`\
    \ 准将重组了三个步兵营和一个后勤营（约 2,800 人），并增援了来自`美国第 131 野战兵团第 2 营`的两个炮连，以及英国`第 3 皇家自己的冲骑兵团\
    \ B 连`（`B Squadron）`，后者配备了 16 辆`Vickers-Armstrongs Mk VI`轻型坦克。这些营仅配备了轻型步兵武器，拥有三门弹药储备有限的迫击炮以及一些反坦克步枪。`Blackforce`缺乏反坦克炮和反坦克地雷，还缺少野战救护车。相比之下，增加了一支英国信号连。该部队的核心成员曾在叙利亚获得过战斗经验。\n\
    \n直到新加坡沦落不久前，英国才派遣兵力。荷属东印度群的英国军队大部分并非援军，而是从马来亚撤回的部队。由于日本军进攻马来亚以及对新加坡周边机场的空袭，`RAF`英国空军）和`RAAF`澳洲空军）中队从\
    \ 1942 年 1 月 16 日起撤往苏门腊和爪哇。英国防空炮被部署用于地面防空。\n\n在失去苏门腊后，剩余的英国军队在爪哇进行了重组。他们由作为`West\
    \ Group`或`BRITAIR`及侦小组部分的`RAF`和`RAAF`中队，以及英国`第 16 防空旅`和`第 3 皇家自己的冲骑兵团 B 连组成。2\
    \ 月底，四个个配备雷达设施的`航空部实验站 (AMES)`单位投入了运行。2 月下旬，皇家海军贡献了联合打击部队。\n\n美国提供了从菲律宾撤离的`美国陆军远东空军\
    \ (FEAF)`和`亚洲舰队`。`FEAF`首先被撤到澳大利亚北部的达文，但随后在 12 月部署到东爪哇。在爪哇的`FEAF`最终将由配备现代飞机的`第\
    \ 5 轰炸机司令`和`拦截机司令`组成。`拦截机司令`负责东爪哇的防空。\n\n`亚洲舰队`的舰船成功参与了该群岛的海上防御。1941 年 12 月 23\
    \ 日 24 日，`第 10 巡逻队`从菲律宾撤回，八架`美国海军卡提娜`水上飞机移往下龙和安汶。\n\n1942 年 1 月 11 日，`第 26 野战兵团司令部`和`第\
    \ 131 野战兵团第 2 营`从美国抵达泗水（作为`彭萨拉护队`的一部分）。后者是`德克萨斯州国民卫队`的一个野战兵团，于 1940 年底动员。他们满员抵达爪哇，但机动运输工具只有一半，且没有\
    \ 14 挺直属的`.50 口径`重型机枪。该部队在离开美国前不久还配备了 12 门`M2A2 75mm`牵引炮。新火炮尚未进行过射击演习。在送来的 8 套美国`SCR-268`雷达仪中，有两套在\
    \ 1942 年 1 月底处于工作状态。\n\n# 战斗序列\n\n## 日本军\n\n### 南方军（竹内支一大将）\n\n#### 第十六军（今村直志中将）\n\
