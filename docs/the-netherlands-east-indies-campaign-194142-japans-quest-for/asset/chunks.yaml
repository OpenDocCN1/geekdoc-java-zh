  trans: '

    这一决定对爪哇岛西部和中部的指挥线和部队位置产生了影响。在西爪哇，`1st Division` 的作战区域被重组为独立的指挥部：西部小组、万隆小组和东部小组。最终未建立独立的东部小组部。西部小组、万隆小组和
    `3rd Division`（东爪哇）各由一个带有支援武器的步兵团组成。`2nd Infantry Regiment` 与 `1st Mountain Artillery
    Battalion` 成为西爪哇的战略预备队。为了配合这些作战计划的变更，必要的部队从中爪哇转移到西爪哇及其他们新且大多不熟悉的作战区域。他们没有时间在那里适应，因为日本在爪哇岛的陆上进攻已全面爆发。


    ### 针对爪哇岛的空攻


    针对爪哇岛的空攻由 `IJN 11th Air Fleet` 在东爪哇进行，由 `IJA` 联合 `Third Air Force` 和 `IJN 11th
    Air Fleet` 在西爪哇进行。`IJN` 和 `IJA` 面临合适机场的短缺和后勤问题。此外，`IJN` 的空中行动受到恶劣天气的严重影响。针对爪哇岛的预备空攻于
    1942 年 2 月 3 日随着 `Operation Z` 开始，这是一场为期三天的旨在消除东爪哇盟军空权的空攻。目标是泗水、马迪恩和马兰贡。在经历了 1942
    年 2 月 3 日和 5 日两天的行动后，`IJN` 确信东爪哇的盟军空权已基本被消除。随后在 2 月 7 日、8 日和 9 日发起了新的攻击。由于天气恶劣，下一次攻击直到
    1942 年 2 月 18 日才发生。天气也干扰了 `IJN` 针对西爪哇的空中行动，重点转向了攻击邦加岛附近的盟军船只。`IJA` 直到 2 月 19 日才从巴乐望开始其对西爪哇的空战活动。当
    `Western Landing Unit` 于 2 月 18 日出发时，针对爪哇岛的空攻尚未开始。在爪哇岛获得空中优势权是不可能的。在 `IJN` 看来，针对西爪哇的空攻果实不足。盟军海军和空军依然保持活跃。为此，`IJN`
    提议将爪哇登陆推迟两天，直到 1942 年 2 月 28 日。`Southern Task Force` 得到了加强，针对西爪哇的空战之升级。


    在 `Operation Z` 期间，`IJN` 空军部队偶然接触了盟军海军的 `Striking Force`。人们认为在两天的空中攻击中盟军舰只遭受了严重损失。事实上，只有两艘美国巡洋舰受损；`USS
    Houston` 上 48 人死亡，20 人受伤。


    ### 盟军反攻


    `ABDA-AIR` 对南苏门腊的损失做出了反应性反空行动，通过轰炸 `Plaju Refinery` 的油库、`Musi River` 上的船只、`Muntok
    anchorage` 锚地以及 `Palembang Airfield`，旨在尽可能损害日本的飞行能力。这次反攻取得了部分成功，但证明不足以阻止日本的进攻。`FEAF`
    则在巴厘岛沦落后，对巴厘岛执行了独立的进攻性反空行动。除了进攻性反空行动外，盟军战斗机部分配合防空炮被部署在防御性反空行动中：负责机场、主要港口和海军的防空。到
    1942 年 2 月底，飞机援军正乘船前往爪哇岛。然而，水上飞机母舰 `USS Langley` 被击沉，`MS Sea Witch` 上的飞机被装在箱子里，尚未组装。最终，没有时间完成组装。其货物不得不销毁。


    ![CAM364_039.jpg](img/CAM364_039.jpg)


    ### 两栖登陆


    `Sato Detachment` 在位于斯圣尼古拉斯角附近的万丹湾 1 号区域 C 区进行两栖登陆。区域 A 区和 B 区位于巽他海峡默拉克的南北两侧。日本人在准备在完全黑暗中进行两栖登陆，并在月亮起后执行，最好选在黎明潮汐最高的日子。在塔拉坎岛，登陆是在半退潮时进行的。他们使用了特殊的登陆艇。卸货由部队完成。事实证明万丹湾不适合卸货。在
    1942 年 3 月 4 日默拉克的船只完成任务后，运输船从万丹湾驶向默拉克继续卸货。（每日新闻报）


    第十六军从 1942 年 2 月中旬开始的计划规定，于 2 月 26 日黎明在西爪哇和东爪哇同时登陆。`48th Division` 在克拉根登陆并占领了泗水。`Sakaguchi
    Detachment` 也登陆在克拉根并占了中爪哇的西拉恰普。`2nd Division` 在万丹湾登陆。首要目标是征服雅加达。一支强大的次要力量进军博哥夺取这座城市。`Shoji
    Detachment` 登陆 Eretan Wetan，意外占领了 `Kalidjati Airfield` 并占据了锡塔鲁河上的桥梁，封锁雅加达与万隆之间的道路。占领雅加达后，`2nd
    Division` 主体和 `Shoji Detachment` 将从北方共同进攻万隆据点。因此，万隆是次要目标。根据情况，来自博哥的辅助部队和 `Shoji
    Detachment` 将一举占领万隆。1942 年 2 月，南方军考虑部署 `1st Raiding Group` 进攻西拉恰普。这将切断爪哇岛的返回供应路线。最终，该计划被取消了。


    1942 年 2 月 26 日，两支日本入侵舰队从金兰湾等基地接近爪哇岛。`Western Landing Unit` 包括 56 艘运输船和 27 艘军舰。`Eastern
    Landing Unit` 包括 `48th Division` 的 38 艘运输船和 `Sakaguchi Detachment` 的 2 艘。该部队于
    1942 年 2 月 25 日在巴西板望锚地被发现。盟军 `Striking Force` 从泗水出发并攻击运输舰队。并未找到运输船。然而，中队遭遇了日本护卫部队。随后的
    `爪哇海战`发生在 1942 年 2 月 27 日和 28 日，`Striking Force` 被击败。凭借这一胜利，`IJN` 控制了爪哇周围的海域。登陆仅推迟了一天。


    在 1942 年 2 月 28 日（周六）至 3 月 1 日（周日）夜间，十六军在爪哇海岸执行了两栖登陆。`Operation H` 开始。`Western
    Landing Unit` 在西爪哇的两个登陆区上岸。十六军司令部和 `2nd Division` 登陆在 1 号区域，主力于 00:30 进入万丹湾，分遣于
    02:00 进入默拉克。`Shoji Detachment` 在东约 200 公里的 Eretan Wetan 登陆。由 `48th Division` 和
    `Sakaguchi Detachment` 组成的东方突击队在东爪哇附近的克拉根登陆。


    登陆区之间距离遥远。这意味着爪哇战役将由广泛分散的作战区域组成。这使得十六军难以指挥中爪哇和东爪哇的部队。为了让这些部队独立作战，增加了特殊部队和设备，提供了清晰的作战指示，并在总部任命了一名特种参谋。这种指挥问题因登陆后丢失十六军的通信设备和密码本而加剧。由于失去了通信手段，今田将军在爪哇战役期间失去了对十六军的指挥和控制。

