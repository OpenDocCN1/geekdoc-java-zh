    # 荷属东印度岛


    ## 战役起源


    1941 年 12 月，日本对西方列强发起了进攻，声称这是一场自卫和自保的斗争。在短短几个月内，日本就征服了东南亚，并建立了“大东亚共荣圈”。同盟国花了近四年的时间才击败日本并夺回了该地区。


    日本南方进攻战，“甲号作战”（Operation `A-Go`）由三场战战组成：马来亚、菲律宾和荷属东印度岛。本书描述了对荷属东印度岛的进攻与征服。它试图回答的问题包括：荷属东印度岛（NEI，现印度尼西亚）在日本的战争目标中占据什么位置？日本打算如何实现这一目标？荷属东印度岛的防御计划是什么？这场战役在作战和战术层面是如何进展的？


    ### 日本的扩张


    日本向中国的扩张使其与亚洲的其他主要大国发生冲突。1938 年和 1939 年，它甚至与苏联爆发了边境战斗。英国在应对这种扩张方面无能为力。甚至在第一次世界大战之前，它就缺乏同时在欧洲和亚洲水域维持战斗舰队的手段。是美国领导了遏制日本扩张的动力。美国不仅希望停止日本权力的扩张，还希望遏制它。为此，美国在
    1940 年实施了日益严厉的经济制裁和军事压力，将大部分美国舰队从美国太平洋沿岸移到夏威夷，并在菲律宾部署了`B-17`远程轰炸机。如果日本从中国和法属印度支撤出，制裁将被解除。因此，日本不仅必须放弃它的帝国和成为大国的理想，还必须屈服美国的经济霸权。


    ![CAM364_002.jpg](img/CAM364_002.jpg)


    在这张 20 世纪 30 年代的航空照片中，前景中心可以看到普拉朱（Plaju）的荷兰石油公司（`BPM`）炼油厂（右侧为居住区），而左侧背景是位于苏门答腊东部靠拢（Sungai
    Gerong）的荷兰皇家石油公司（`NKPM`）炼油厂。左侧是穆西河。这些炼油厂共占荷属东印度岛总产量的三分之一。这是该地区唯一的高质量航空燃油（100 号汽烷）来源。主要的油井位于占碑（Djambi）。`NKPM`是美国标准石油公司的子公司。`BPM`由荷兰皇家壳拥有。（莱登大学图书馆，KITLV
    2790）


    日本寻找着和平获取美国拒绝提供的战略性原材料的方法，其目光投向了荷属东印度岛。


    ### 石油：船只、飞机和战争的燃料


    石油是日本帝国的阿喀琉斯之踵。它的消耗几乎完全依赖进口，如表 1 所示。美国供应了日本一半以上的石油消耗，因此美国的石油禁运将对日本造成沉重打击。荷属东印度岛提供了一个逻辑上的（并非唯一的）美国石油替代方案，能够满足日本的需求。


    ![table_p6a.jpg](img/table_p6a.jpg)


    除了石油，荷属东印度岛还是天然橡胶、锡和铝土矿的重要来源。1938 年，全球对天然橡胶的需求为 933,000 吨：荷属东印度岛占 302,872 吨，占全球市场的
    32%。1938 年，从该地区开采了 27,737 千吨锡，在全世界 148,100 长吨中位居第三，仅次于马来亚和玻利维亚。荷属东印度岛在 1938 年还开采了
    245,354 吨铝土矿。它还生产了 90%的金鸡纳树植物，因此对主要的抗疟药物——奎宁具有垄断地位。


    ![table_p6b.jpg](img/table_p6b.jpg)


    考虑到荷属东印度岛作为战略原材料供应商的重要性，日本致力于将该地区纳入其势力范围：即大东亚共荣圈。1940 年至 1941 年间，日本开始谈判以增加其在荷属东印度岛的影响力，并通过和平手段获取必要的战略原材料。然而，日本在
    1940 年 9 月与德国、意大利建立同盟使这些谈判复杂化：即三轴协约。荷兰从当年 5 月起一直与德国处于并随后被占领。日本的威胁显而易见。荷属东印度岛在新加坡与英国、澳大利亚参加军事参谋会议，以协调在与日本发生时的联合行动。美国以观察员身份出席。荷兰认为这些针对日本的参谋会议增强了他们的实力。（注：此处原文存在多处重复句子，译文已去重并保持逻辑连贯）。


    考虑到荷属东印度岛作为战略原材料供应商的重要性，日本致力于将该地区纳入其势力范围：即大东亚共荣圈。1940 年至 1941 年间，日本开始谈判以增加其在荷属东印度岛的影响力，并通过和平手段获取必要的战略原材料。然而，日本在
    1940 年 9 月与德国、意大利建立同盟使这些谈判复杂化：即三轴协约。荷兰从当年 5 月起一直与德国处于战争并随后被占领。日本的威胁显而易见。荷属东印度岛在新加坡与英国、澳大利亚参加军事参谋会议，以协调在与日本发生时的联合行动。美国以观察员身份出席。荷兰认为这些针对日本的参谋会议增强了他们的实力。


    ### 南下


    日本 1939 年占领中国海南岛以及 1940 年向法属印度支派遣军队，使其英国领的马来亚、新加坡以及荷属东印度岛进入了日本陆基飞机的攻击范围。这种南下行动引发了美国的强烈反应。美国在
    1941 年 7 月 26 日冻结了日本资产。（注：此处原文存在重复句子）。美国在 1941 年 7 月 26 日冻结了日本资产。完全停止石油供应并非其本意，但事实上的反应等于此。英国同意了这一点，荷兰也无奈加入，意识到参与禁运意味着与日本开。日本面临石油封锁，而其通过增加荷属东印度岛供应来创造和平替代方案的尝试也失败了。对于日本来说，面对美国的枷锁，仅有两个选择：屈从美国要求，或通过武力获取必要的原材料。日本选择了后者。美国通过经济和军事压力阻止日本在亚洲进一步扩张的政策已经失败。如果日本有机会赢得军事冲突，必须在
    1940-41 年间采取行动。欧洲战争严重削弱了其潜在对手或将他们牵制在其他地区。权力平衡已向日本倾斜。随着 1940 年 7 月《两洋海军法案》的通过，美国启动了一项巨大的海军建设计划。日本看到了机会窗口。现在是成败关键。


    ![CAM364_003.jpg](img/CAM364_003.jpg)


    达拉干是婆罗洲东岸的一个丘陵起伏、丛林覆盖的小岛。从该岛开采的原油直接作为燃料销售，无需精炼。达拉干占了荷属东印度岛总石油产量的 9%。该岛有两个钻井和一个用于储存的储罐区。照片中的钻井很可能位于帕穆申，约
    1940 年。（莱登大学图书馆，KITLV 176800）


    ## 年表


    1941 年


    12 月 1 日


    荷属东印度陆军军事航空队（`Wapen der Militaire Luchtvaart van Konink Konink Nederlands-Indisch
    Leger`, ML-KNIL）动员。


    12 月 7/8 日


    日本袭击珍珠港、马来亚、香港和菲律宾。


    12 月 8 日


    荷兰对日本宣战。


