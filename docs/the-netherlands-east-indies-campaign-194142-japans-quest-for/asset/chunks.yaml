  raw: '**Major-General Ludolph Hendrik van Oijen (****1889–1953****)** was commander
    of the Military Aviation Service. After studying at the Royal Military Academy,
    he was appointed as an infantry officer in the RNEI Army in 1911\. Between 1920
    and 1922, he returned to the Royal Military Academy as a teacher. From 1922 to
    1925, he took war studies at the Staff College. Back in the Netherlands East Indies,
    Van Oijen, now a major on the General Staff, took command of the Aviation Service
    (*Luchtvaartafdeling*) on 29 October 1934\. He was not a pilot and had never previously
    served with this branch. Within the RNEI Army, however, it was customary for an
    officer of the General Staff to command the Aviation Service. Van Oijen led the
    transformation of the small Aviation Service into a modernly equipped independent
    weapon: the Military Aviation Service. He became an inspector of the Military
    Aviation Service in 1939\. Van Oijen witnessed the Japanese air attack on Pearl
    Harbor on 7 December 1941.


    Van Oijen was evacuated to Australia shortly before the RNEI Army in Java surrendered.
    He became commander of the Netherlands Military Flying School in the United States.
    In 1943, he was promoted to lieutenant-general and appointed deputy army commander.
    Van Oijen retired from the military in January 1946.


    **Brigadier Arthur Seaforth Blackburn (****1892–1960****)** was a Victoria Cross
    holder. He commanded an improvised combat unit on Java known as Blackforce. Blackburn
    was born in Australia. He fought in World War I as an officer of the Australian
    Imperial Force (AIF) at Gallipoli and on the Western Front, where he earned his
    VC. He was discharged in 1917 on medical grounds and returned to civilian life
    in Australia, but remained on the reserve. In 1940, he rejoined the army as a
    lieutenant-colonel. Blackburn commanded a machine-gun battalion and saw action
    in Syria.


    His battalion was among the lead elements of the Australian 7th Division to disembark
    in the Netherlands East Indies. On 21 February 1942, Blackburn was given command
    of all AIF personnel in Java. He organized his diverse command in a short time
    into an infantry brigade (reduced). He took the lessons from Malaya to heart when
    defending Leuwiliang. He deployed his troops in depth and formed a mobile reserve
    in a counter-encirclement role. Blackburn proved to be an energetic and inventive
    commander.


    ## OPPOSING FORCES


    ### JAPANESE


    The Imperial Japanese Army (IJA) and the Imperial Japanese Navy (IJN) worked together
    in the Imperial General Headquarters (IGHQ). The IGHQ was chaired by the emperor
    and formed the military and political summit of the army and navy. The IGHQ was
    not an umbrella headquarters. The armed forces were not subordinated, but had
    their own parallel organizations. For joint operations, agreement had to be sought
    between the two armed forces. The resulting compromises were recorded in a written
    agreement. Consultation between the IGHQ and the government took place in the
    IGHQ–government liaison conferences. We also find this consultation structure
    between the IJA and IJN at an operational level. Inter-service competition was
    particularly strong.


    Of its 51 infantry divisions, the IJA made 11 available for the Southern Offensive
    (Operation *A-Go*), organized into four armies controlled by the new Southern
    Army (*Nampo Gun*). Three divisions were earmarked for the attack on the Netherlands
    East Indies. For this purpose, Sixteenth Army was formed under Lieutenant-General
    Hitoshi Imamura on 6 November 1941\. This army consisted of the 2nd Division and
    the 56th Mixed Infantry Group (Sakaguchi Detachment) of the 56th Division. At
    a later stage of operations, the 38th Division and 48th Division would be added.
    With the exception of the 38th, these were Type A1 divisions and handpicked for
    the task ahead. The 38th Division had experience of swampy terrain in southern
    China, while the 48th Division was not only motorized but also amphibious-trained.
    The IJA set up parachute training in December 1940\. The airborne 1st Raiding
    Group witnessed its first combat in the Netherlands East Indies.


    Given problems with available shipping, the 11 divisions were significantly reduced
    in strength before the Southern Offensive from approximately 24,000 to 13,000–14,000
    men. Three divisions were motorized. Even with the force reduction, the 2nd Division
    had to leave the 3rd Battalion, 2nd Field Artillery Regiment in Japan due to a
    shortage of ships. The assigned divisions were triangular, consisting of the standard
    infantry group headquarters with three infantry regiments, a field or mountain
    artillery regiment, a reconnaissance regiment, an engineer regiment, a transport
    regiment and further support units. The reconnaissance, engineer and transport
    regiments were actually battalion-size units.


    ![CAM364_013.jpg](img/CAM364_013.jpg)


    This youthful Japanese member of the Special Landing Forces is dressed in the
    SLF Model 1937 uniform. His weapons comprise the 6.5mm Type 38 (1905) Arisaka
    repeating rifle with mounted bayonet Model 30 (1897). He carries a set of Model
    99 cartridge pouches. Over his shoulders he carries on his right a canteen and
    on his left a haversack. His helmet has a fabric cover with a camouflage net.
    The SLF soldiers were not seen by the Japanese as elite troops, but as sailors
    with a shore posting. (Public domain)


    The IJA successfully conducted a daring military offensive. Due to the aggressive
    and mobile action undertaken, the IJA seized the initiative and kept it for the
    duration of the entire campaign. Its opponents were not given the opportunity
    to build an effective defence or to deploy sufficient reinforcements. The Southern
    Offensive was carried out on an operational level according to the agreed process:
    acquiring air superiority; conducting an amphibious landing, sometimes in combination
    with an airborne operation; capturing an airfield; and preparing the airfield,
    into which army and navy air forces deployed. This process was then repeated.
    Using this approach, Japan secured its air and naval advantage. The various attack
    units could support each other if necessary. It kept the Allies off-balance and
    complicated concentrated counter-action. Amphibious landings occurred shortly
    after midnight, and were often executed in several places simultaneously. Fortified
    coastal strips were avoided. After the landing, little time was spent on consolidating
    the position, with units mostly pushing directly inland. The emphasis was on speed,
    with advances by road. On Java, the divisions and Sakaguchi Detachment operated
    along two parallel axes. Tanks led the way, with the infantry behind in trucks.
    Tactically, the troops were highly disciplined and quick to act. The infantry
    deployed only after fire contact. In such an event, an attempt was made to immediately
    eliminate the opponent. If that did not work, an envelopment followed. Threatened
    with encirclement, the enemy usually broke contact. Cohesion was strictly maintained.
    Japan’s military was well trained. This operational and tactical performance proved
    to be extremely effective.


    The Combined Fleet formed the operational element of the IJN. The fleet was organized
    into several subfleets. Task forces were formed from the fleets for operational
    missions. The Southern Task Force was formed for Operation *A-Go* and was the
    naval equivalent of the Southern Army. During the attack on Malaya and the Philippines
    – the Phase I operations – it consisted of the Main Unit, Philippines Unit, Malaya
    Unit, Air Unit and Submarine Unit. During the Phase II operations – the attack
    on the Netherlands East Indies – most of the Philippines Unit was transferred
    to the newly formed Netherlands East Indies Unit.'
