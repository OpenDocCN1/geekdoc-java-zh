    The RAF retreated to Palembang II. Air Commodore Hunter soon also had Palembang
    II cleared. The RAF then withdrew to Bandar Lampung by road and rail. This retreat
    was chaotic. Equipment and unit cohesion were both partly lost. In contrast, the
    6th Heavy Anti-Aircraft Regiment and 10th Infantry Battalion, with 400–500 territorial
    troops, withdrew in an orderly manner, although 6th Heavy Anti-Aircraft Regiment
    subsequently had to leave behind the remaining guns. The 10th Infantry Battalion
    conducted a rearguard action against the Iwabuchi Unit on 18 February 1942 in
    Martapura. The Japanese failed to cut off the retreat route in time. After a short
    firefight, 10th Infantry Battalion broke off the action.


    Contrary to reports, Japanese river-ascending units did not reach Palembang until
    the early evening of 15 February 1942. That evening, overland contact with the
    2nd Raiding Regiment at Palembang I was established. On the 16th, contact was
    made with the paratroopers at the oil refineries. In the early evening of 16 February,
    the Main Unit of 38th Division anchored at the mouth of the Musi River, but did
    not reach Palembang before the 20th. Palembang II was only discovered by the Japanese
    on 16 February.


    While the Battle of Palembang was progressing, the first Commonwealth reinforcements
    arrived in Bandar Lampung. On 14 February 1942, Convoy JS 1, bearing the British
    7th Armoured Brigade, arrived. The next day, Convoy JS 2 anchored in Bandar Lampung.
    It consisted of one ship, the HMT `Orcades`, with the advance guard of the Australian
    7th Division. Although these units were missing some of their heavy equipment,
    a large proportion of the troops were immediately disembarked. Australian Brigadier
    C.S. Steele had arrived from Palembang in Bandar Lampung on the morning of 15
    February 1942. Using the available forces, he formed an ad hoc unit for the defence
    of Bandar Lampung: `Boost Force`. It consisted of B Squadron, 3rd King’s Own Hussars;
    95th Battery, 48th Light Anti-Aircraft Regiment (RA); and five improvised RAF
    rifle companies each approximately 100 men strong.


    In the late afternoon of 15 February 1942, Allied forces in Singapore surrendered.
    The fall of Singapore, as ABDACOM wired, led to a ‘change in programme’. The troops
    that had arrived at Bandar Lampung were ordered not to disembark. Convoys JS 1
    and JS 2 had to sail to Tanjung Priok and await further orders there. ABDA-AIR
    ordered the evacuation of RAF personnel via Bandar Lampung. The troops reboarded
    their ships. South Sumatra was thus given up relatively quickly by ABDACOM.


    During the fighting at Palembang and also in the retreat, the NEI troops, in particular
    the territorial ones, showed a certain ‘reluctance to be deployed’. In the counter-attack
    at Plaju, a platoon of 3rd Company, 10th Infantry Battalion refused to advance.
    The latter was attributed to the failures of the platoon commander.


    ![CAM364_038.jpg](img/CAM364_038.jpg)


    HMT `Orcades` arrived from the Middle East with 3,391 troops of the Australian
    7th Division in Tanjung Priok on 16 February 1942. Only part of the division disembarked
    on 18 February; General Wavell planned to use them for airfield defence. The troops
    shown here on the gangplank of HMT `Orcades` may be from 2/2nd Pioneer Battalion;
    the two soldiers in the foreground are carrying a cased Bren LMG. They formed
    `Blackforce` with other Australian units and troops. The `Orcades` departed on
    21 March 1942 as Convoy SJ 6 (Batavia–Colombo) with 3,500 personnel. On 10 October
    1942, the `Orcades` was sunk by a German submarine. (Australian War Memorial)


    South Sumatra was lost in two days. The pincer from the west had closed around
    Java. Within a few days, the pincer from the east would encircle it, too. The
    main island of the Netherlands East Indies was surrounded and no longer tenable.


    ### BALI


    At 0100hrs on 19 February 1942, the 3rd Battalion (reduced), 1st Formosan Infantry
    Regiment, a mountain artillery section and an independent engineers platoon of
    the 48th Division landed on the south coast of Bali. The 1st Base Unit of the
    IJN provided the escort. Documents were found on Tarakan indicating that Bali’s
    airfield was in good condition. In addition, the location was extremely favourable.
    From Bali it was not only possible to conduct the air campaign against East Java,
    but also to cut off the supply route from Australia. The IJN 23rd Air Flotilla
    then made a strong case to include Bali again in the operation plan. It was agreed
    to do so at the conference in Manila on 28 January 1942.


    Bali was defended by the Prajoda Corps, an Indonesian auxiliary battalion-sized
    unit with some European officers and NCOs. After the Japanese landing, this corps
    disintegrated due to widespread desertion. Den Pasar Airfield fell quickly, almost
    intact, into Japanese hands. It was already in use the next day. The 23rd Air
    Flotilla headquarters was moved from Balikpapan to Bali on 26 February 1942.


    ABDACOM reacted with violent air raids on the two Japanese transport ships during
    the disembarkation of troops and supplies. Both ships were damaged, one heavily.
    The Combined Striking Force was also deployed against this serious threat on the
    eastern flank. The Japanese troops had already reached their ground objectives.
    Above all, the action came too late (19/20 February).


    ### TIMOR


    The island of Timor was politically divided into Dutch and Portuguese parts. The
    eastern part was Portuguese and its capital was Dilly. The western part was Dutch,
    with a small Portuguese enclave on the north-west coast, and its capital was Kupang.
    The island has a length of 476km and is 102km wide. It is very mountainous and
    covered with tropical forests. The road network was limited. In the Dutch part,
    one unpaved main road (about 4–5m wide) ran from Kupang to the Portuguese border.
    The roadside terrain was unsuitable for motor vehicles due to coral and swamps.
    Penfoei Airfield was located about 4km north-east of Kupang.


    The Timor and Dependencies Territorial Command consisted of a regional headquarters
    and the Timor and Dependencies Garrison Battalion of 27 brigades (19 men per brigade),
    of which 21 brigades were stationed on Timor. The territorial commander was Lieutenant-Colonel
    W.E.C. Detiger. In addition, the garrison had the standard three APCs. Its mission
    was to maintain neutrality and prevent a Japanese landing. Its total strength
    was 500 men. The territorial troops were still organized as internal security
    troops and lacked striking power and firepower against a modern organized armed
    force.


    ![CAM364_045.jpg](img/CAM364_045.jpg)


    The NEI semi-motorized MG and Infantry Gun companies were reorganized in 1940
    into fully mechanized and motorized AT and AA companies (`afdeling Pantser-en
    Luchtafweer`). The latter provided anti-tank and mobile anti-aircraft defence
    for the regiments. The AA platoon (57 men) was equipped with nine M30 Colt 12.7mm
    (.50-cal.) heavy AA MGs each on a pivot gun carriage on the back of a light open
    Chevrolet truck. The gun crew was not protected against incoming fire. In this
    photo, a section of three trucks with AA MGs and an ammunition truck can be seen.
    By late 1938, the RNEI Army regarded the 12.7mm AA MG as obsolete. They were to
    be replaced by 2cm guns, but during the Japanese offensive the old AA MGs were
    still widely used. (Netherlands Institute of Military History)

