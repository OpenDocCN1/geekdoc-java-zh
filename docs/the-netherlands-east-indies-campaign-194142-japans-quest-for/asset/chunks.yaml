  trans: '


    ![CAM364_035.jpg](img/CAM364_035.jpg)


    楠榜（Oosthaven），位于苏门答腊南部。1942 年 2 月 14 日，即日军进攻占胆当天，第一批从中东出发前往苏门答腊和爪哇的陆军增援抵达了 Oosthaven。图中码头上有一辆来自英国`第
    3 皇家皇家骑兵团``B 连队`的`Mk V1B`轻型坦克，背景是被摧毁的卡车、一辆公共汽车和坍塌的建筑。1942 年 2 月 15 日傍晚，收到重新装船`第
    3 皇家皇家骑兵团`的命令。该部队被运往爪哇，并作为黑力（Blackforce）的一部分参加战斗。（澳大利亚战争纪念）


    从 1942 年 1 月 16 日起，占胆发展成为英国主要的空军基地。轰炸机群被重组为`第 225（轰炸）群`，驻扎在占胆二机场。1942 年 2 月 1
    日，`第 226（战斗机）群`成立，总部位于占胆一机场。地面防空由以下部队提供：`第 6 重防空炮团（皇家）`（减员）、`第 78 炮队`、`第 35 轻防空团（皇家）`以及来自`第
    89 轻防空炮兵（皇家）`的一个连。`第 225（轰炸）群`指挥官亨 ry J.F. Hunter 空军准将担任占胆空军指挥官。


    1942 年 1 月 26 日，一支澳大利亚`第 1 军`的小先遣队乘飞机抵达雅加达。军官`J.D. Lavarack`中将和参谋长`F.H. Berryman`准将考察了未来的部署区域。在苏门答腊南部，他们预计日军将首先占领邦加作为前方基地，以获得当地的海空和空中优势。然后，他们将派遣伞兵进攻炼油厂。这次空降行动将与上游河流作战相结合。因此，Lavarack
    建议韦塞尔（Wavell）立即用一个步兵营加强炼油厂和机场的防御，并向`RAF`、`RAAF`和`AA`防空兵发放步枪。决定派遣一个步兵营去炼油厂，另一个去往邦加岛和勿打登岛。在澳大利亚增援到达后，占胆一机场和占胆二机场的防御将由一个轻坦克中队加强。


    1942 年 2 月 5 日，两个`RNEI 陆军`野营临时离开爪哇前往苏门答腊：`第 10 步兵团`前往占胆，`第 9 步兵团（减员）`移往邦加岛，加强后的`第
    12 步兵团第 2 连`开往勿打登。一旦澳大利亚增援到达，这些兵团将返回爪哇。`第 10 步兵团`总部和三个连驻在普拉博穆利（Praboemoelih）。`第
    10 步兵团第 1 连（爪哇人兵）`驻扎在占胆。选择普拉博穆利并不理想。它位于占胆南部 90 公里处，距离受保护地点太远，无法快速反击。该兵团临时由由征召的印尼司机驾驶的巴士和卡车进行机械化。`第
    10 步兵团`供领地指挥官调用。


    针对邦加岛和占胆的`L 行动`由于古井机场状况不佳以及`新加望二`不可用推迟了两次。马来的关丹（Kuantan）本应承担这一角色，但该机场未能及时准备就。最终，`L
    行动`计划于 1942 年 2 月 15 日开始。


    ![CAM364_031.jpg](img/CAM364_031.jpg)


    一张由陆军美术协会根据鹤田五（Goro Tsuruta）的战争画作出版的日本明信片，名为《战神降临占胆》。日本陆军（IJA）和日本海军（IJN）聘请了著名的日本艺术家，用西方风格（洋画）的纪念碑式写实绘画来描绘中日战争和太平洋战争，而非日本风格（日本画）。这些战争战役画作在大型展览中向日本公众展示。（美国国家档案馆
    NARA，公共领域）


    为了摧毁苏门答腊的盟军空力并同时在爪哇进行压制，日陆和日海于 1942 年 1 月 28 日在`蒙托克–占胆`沿线划分了作战区域。日陆将在该线以西作战，日海在该线以东作战。在初步进攻后，`第
    33 航空团`于 1942 年 2 月 6 日至 13 日在苏门答腊南部发起了大规模攻势，以获得当地空中优势。`第 22 航空飞行队`在邦加和勿打登上方执行了任务。日本人随后认为盟军的大部分飞机已被摧毁。事实证明这为过早了。


    尽管遭受了损失，但在日军登陆当天，英国仍拥有以下可用飞机：`24 架风暴战斗机`、`31 架洛克希德哈逊轻型轰炸机`以及`36 架布里斯托黑姆 Mk I`和`Mk
    IV`轻型轰炸机。许多黑姆无法使用。日军并未发现占胆二机场是一个基地，因此它可以部署战斗机和轰炸机。总而言之，日本方面并不存在空中优势。


    正如 Lavarack 中将预料的那样，`L 行动`是一场空降与两栖/河流联合攻击。日陆专门训练了`第 1 突击团`（一支空降部队）以征服占胆。`第 1 突击团`事实证明无法使用，因为它在
    1942 年 1 月的一次运输事故中损失了武器装备，并遭受了伤寒袭击。结果，仍在训练中的`第 2 突击团`被部署。该突击团由四个连组成，总兵力相当于一个兵团。


    `第 1 突击团`没有足够的力量同时进攻并守住三个目标：机场和炼油厂。如果可能，要在盟军摧毁它们之前占领炼油厂。但可用力量太小无法应对三个目标。此外，该小组必须坚守目标，直到`38
    军`的主力到达（L+2，登陆当天）。空降计划在 L-1 进行。


    第 38 军的任务是占占胆市。它在占领香港期间遭受的损失已经得到恢复。然而，该军并未满员。该军组建了两个支队部署在其他地方：`东支队`和`庄司支队`。对于占胆行动，第
    38 军因此由`第 229 步兵团`的四个步兵团组成。一个独立运输营、一个运输工程师兵团以及包括钻井部队在内的其他专家部队归其指挥。


    在泽渊三郎将的指挥下，日海为`L 行动`提供了大规模海上支持。泽渊的`马来部队`（南方远征舰队）提供了主力部队和两个护卫单位。`第 1 航空团`和`第 22
    航空飞行队`为运输舰队提供了空中支持。`第 2 航空团`为运输舰队提供空中支持，守卫邦加和占胆锚地，并支持上游作战。`第 4 航战队形成了`第 3 航空团`，负责防御盟军舰只。`第
    9 基地部队`运送了河流部队。


    ![CAM364_033.jpg](img/CAM364_033.jpg)


    日本伞兵从`陆军一 100 型运输机（三菱 Ki57）`跳下，盟军代号为“兔子”。这种飞机有四名机员，可以携带 11 名伞兵。这可能是 1942 年 2 月
    15 日跳伞占胆一机场的`第 2 突击团第 3 连`（总共 90 人）。（Keystone-France\Gamma-Rapho via Getty Images）


