    # 南方面军作战计划与岩国协定


    ## 注意事项


    ## 敌计划


    ### 日本方面


    直到 20 世纪 30 年代后半叶，荷属东印度群才引起日本武装力量的兴趣。1940 年 5 月德国占领荷兰后，日本陆军（`IJA`）和日本海军（`IJN`）开始研究针对美国、英国、荷兰和中国四个敌人的同步作战。在缓慢起步后，这一进程在
    1941 年 4 月开始加速。现在很清楚，荷属东印度群的和平投降是不可能的。到 1941 年中，具体的计划已经形成。


    `IJN`计划了“顺时针进军”。该计划设想用两个师团在两个月内从北部征服菲律宾。随后用两个师团夺取爪哇岛。接着，将从苏门答腊向南、从马来亚向北进行包围，攻取新加坡。另一方面，`IJA`倾向于“逆时针进军”。他们希望通过快速推进夺取新加坡。这将阻挡英国的援军，并显著缩短整个行动的周转时间。这次攻击将与对菲律宾的进攻同时进行。这意味着将对马来亚和菲律宾两个侧翼同时进攻，随后在爪哇岛会合。


    在 1941 年 11 月 10 日的东京协定中，南方军一方面，联合舰队和南方作战另一方面，在纸面上制定了他们的计划。在岩国协定中，双方武装力量就菲律宾和荷属东印度群达成了共识。`IJN`分配负责顺时针进军，`IJA`负责逆时针进军。


    ![table_p27.jpg](img/table_p27.jpg)


    在此之前，1941 年 10 月 10 日，`IJA`告知昭和天皇，大约在五个月（150 天）内可以夺取南部大部分关键地区。这一日期随后被确定。`IJA`和`IJN`同意了表
    7 中给出的进攻荷属东印度群的时间表：代号为`H 作战`。


    南方进攻（`A 号作战`）的主要目标和核心是征服荷属东印度群的油井和炼油厂。荷属东印度战役很大程度上取决于日本在东南亚其他地区行动的成功。这主要基于对夏威夷美国舰队的奇袭攻击的结果。美国战斗群（1941
    年 2 月 1 日重组为美国大西洋舰队和太平洋舰队）迁往夏威夷被美国人认为是一个巨大的威慑，但也使这支舰队进入了日本舰队的攻击范围。这次攻击本应使太平洋舰队至少瘫痪六个月。太平洋舰队将无法再阻止对东南亚的征服。作战计划随后规定征服并利用马来亚、英属波罗洲和菲律宾作为进攻荷属东印度群的跳板。因此，日本对这些地区攻击的成功是征服`NEI`的前提条件。这些行动以进一步的方式影响了荷属东印度战役。大部分派遣荷属东印度群的`IJN`和`IJA`单位被部署在之前在中国和菲律宾的任务中。只有在攻占香港和马尼拉后，这些部队才能投入使用。整个南方进攻的结果将取决于陆、海、空部队之间的广泛协调。


    在针对荷属东印度群的行动中，不存在奇袭的问题。毕竟，这种可能性已经随着对马来亚、英属波罗洲和菲律宾的行动而消失殆尽。此外，爪哇在此期间可能收到了美的援军。巨大的距离是另一个复杂因素。许多依赖关系使得南方进攻成为一项极具风险的行动。另一个风险是日本经常根据错误的情报制定作战计划。


    日本并不看好`RNEI`陆的战斗力。特别是土著部队被认为缺乏战斗精神。他们预计将在大约一周内征服爪哇岛。


    **表 8：日本作战行动代号**


    | `A 号作战` | 南方进攻 |

    | :--- | :--- |

    | `B 作战` | 英属波罗洲 |

    | `E 作战` | 马来亚 |

    | `H 作战` | 爪哇岛 |

    | `L 作战` | 万邦加岛和民雳榜 |

    | `M 作战` | 菲律宾 |

    | `Q 作战` | 关打丹登陆，已取消 |

    | `S 作战` | 登咬（Endau）登陆，已取消 |

    | `T 作战` | 入侵苏门答腊 |

    | `Z 作战` | 针对爪哇的空战 |


    ### 荷属东印度


    从 1913 年开始，荷兰就将日本视为潜在敌人。日本追求政治和经济扩张，并拥有为此的手段——强大的舰队和军队。荷兰预计，日本扩大势力范围的企图无法在亚洲大陆实现。因此，他们已经考虑到“日本将转向南方”。


    荷属东印度群岛由许多岛屿组成的长链组成。为了防御这个群岛，保持制空权和控制海路至关重要。强大的空军和舰队可以防止敌人获得空海基地。群岛巨大的距离和破碎的形状阻了协调的陆地防御。这为具有海空优势的攻击者提供了夺取另一个岛屿上的支撑地点来中化防御严密的岛屿的机会。爪哇是主岛也是`NEI`的行政中心，拥有的人最多。它的岛屿形状狭窄细长。其战略位置遍布整个岛屿。行政中心在西爪哇，海军基地在东爪哇。这要求坚实的防御，但同时也使得对主岛的集中防御变得极其困难。


    直到 1900 年左右，`NEI`的防御一直基于爪哇岛的防御。1927 年建立了新的《防御原则》（`Defensiegrondslagen`）。这一新的防御理论在两个关键领域与之前的理论相决裂。保护荷属东印度群不再侧重于防御，而是维持中立。荷属东印度群不再担心旨在征服的攻击；而是要防范“致命击”（`coup
    de main`）。因此，防御计划的主要目的是维持荷兰在`NEI`殖民地的权威。与旧计划相比的第二点是防御不再局限于爪哇岛。外围地区也被纳入理论中。由于达拉干（Tarakan）和巴西里巴板（Balikpapan）的石油开采和精炼，那里被确定为特别脆弱的地点。`RNEI`陆军负责在荷兰皇家海军的支持下维持爪哇岛的中立。在外围地区，这项任务分配给海军，并在某些地点由陆军支持。如果`NEI`意外卷入大国之间的武装冲突，将进行抵抗，直到获得外国盟友或盟友的援助。事实上，通过
    1927 年《防御原则》，荷兰承认了他们没有手段独立对抗日本侵略成功防御荷属东印度群。


