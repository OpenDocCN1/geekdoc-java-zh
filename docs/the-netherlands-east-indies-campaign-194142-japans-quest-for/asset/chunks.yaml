    一支由军官带领的第 1 横须贺陆战陆队（SLF）轻型机枪小组，驻守在纳多二号机场（兰戈安）。该小组使用的武器是一支`96 式（1936 年）`6.5 毫米南制轻型机枪。机枪手佩戴二等水兵职业勋章。（公有领域）


    ### 塔拉坎机场的准备


    塔拉坎机场的准备工作被严重延误。结果导致日本陆军（IJA）和日本海军（IJN）不仅被迫推迟了三天对巴厘巴板的进攻，还被迫取消了计划中的伞兵部署。为了（几乎）完整地夺取石油设施，坂口派遣了两个荷兰战俘，并带着最后通牒前往巴厘巴板。如果自然资源和设施遭到破坏，荷兰军方将将处以死刑。此外，坂口调整了作战计划。利用奇袭之势，一支精锐部队将通过河流渗透后方，切断撤退路线。守军很快就会会被迫投降。据报道，两名来自塔拉坎的印尼警察官担任了向导。1942
    年 1 月 16 日，九架日本战斗机驻扎塔拉坎。两天后，他们开始对巴厘巴板进行空袭。


    ### 防守巴厘巴板


    巴厘巴板是婆罗洲东部重要的石油港，拥有一个带大型油罐区（160 个油罐）的炼油厂。该市位于一个巨大的海湾，周围是沼泽和植被茂密的山丘。东印度（NEI）守军人数为
    1200 人，由`第 6 步兵团`（一个减编的野团，下辖两个步兵连和一个机枪连）和`第 2 岸防防空炮队`组成。守军接到命令防守巴厘巴板以受敌方的`突袭`，并进行阻击行动，为破坏设施争取时间。如果巴厘巴板落入敌手，命令是进行游击战。


    荷兰东印度部队指挥官`C. van den Hoogenband`中校没有回应坂口的最后通牒，并立即开始破坏基础设施。一旦石油设施无法使用，荷兰东印度陆军（RNEI）总部考虑撤走大部分守军，主要前往万井马섯。然而，在日本人登陆时，决定尚未做出。


    ### 坂口支队


    坂口支队于 1942 年 1 月 24 日 02:40 登陆在受防守沿海区域外的三个地点。被破坏和撤空的的`曼加尔机场`和`Samboja`钻井场在未遇抵抗的情况下被占领。向城市的推进受到道路破坏的严重影响。城市北侧海湾的登陆威胁了后方的守军。考虑到破坏石油基础设施的进展以及被切断的威胁，`Van
    den Hoogenband`决定不防守巴厘巴板。他停止战斗并率 700 人向内陆撤退。考虑到已实施的破坏，坂口实现了他的威胁。1942 年 2 月 20
    日，78 名平民和战俘在滩上被处决。坂口部队的损失在陆地上 8 人伤亡，海上 39 人。


    ![../img/9781472843524Art001_battlescene.jpg](img/9781472843524Art001_battlescene.jpg)


