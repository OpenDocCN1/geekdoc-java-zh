    north-east. The position was attacked by the right attack unit, the 2nd Battalion
    (reduced) of the 228th Infantry Regiment, from the south-east. Once again, the
    Japanese surprised the defenders. This attack was carried out during poor weather
    and brought the Japanese deep into the rear of the position around 1000hrs. An
    uncoordinated counter-attack soon stalled under Japanese fire. With that, the
    Passo position fell. That evening, Kapitz decided to surrender.


    The 1st Kure SLF (750 men) reinforced with the 10th Company, 3rd Battalion, 228th
    Infantry Regiment arrived from Menado and performed an amphibious landing near
    Hitulama at 0200hrs, aiming for Laha Airfield. For more than an hour, the landing
    was contested by an infantry section from 4th Company of the Garrison Battalion
    reinforced with machine guns and mortars in pillboxes. Afterwards, the Japanese
    advance inland was slowed by a delaying action of the retreating NEI troops, the
    very poor weather and the bad state of the road network. Arriving at the inner
    bay, the SLF also took artillery fire from the NEI batteries on the other side.
    An initial attack on the airfield by the end of the afternoon stalled in gunfire
    and mortar fire from the defending Australians of B and C companies, 2/21st Battalion.
    Support was given by artillery fire from the Nona battery. The IJA 10th Company
    was sent into the jungle to conduct an envelopment. Furthermore, air support was
    received. Two further attacks on consecutive nights failed. On the morning of
    3 February 1942, the Japanese attackers managed to penetrate the Allied positions.
    That morning, the 10th Company attacked the defenders in their rear after a difficult
    trek through the jungle. Laha capitulated.


    Major-General Takeo Ito expected to capture the south of Laitimor the same day
    that Kapitz surrendered, 1 February 1942\. The left attack unit turned south that
    day with two battalions abreast. South of Ambon City, the rest of Gull Force had
    dug in: A and D companies, 2/21st Battalion and most of the support units, with
    their improvised positions not facing the coast as expected, but north. At the
    urgent request of Scott, he was reinforced on 31 January 1942 with the NEI 2nd
    Company, Garrison Battalion. The Japanese gradually drove the Australian and NEI
    troops back under cover of artillery and mortar fire. In the morning of 3 February
    1942, surrender and captivity followed for the Allied defenders.


    The Eastern Detachment had suffered 55 killed and 135 injured, and the 1st Kure
    SLF 40 killed and 50 seriously injured. The Japanese claimed 340 Allied soldiers
    killed and 2,182 taken prisoner (782 Australians, 334 Dutch and 1,066 Indonesian
    troops). According to Australian reports, 49 Australian soldiers lost their lives.
    On 6, 15 and 20 February 1942, the majority of Australian prisoners of war taken
    at Laha were executed by the IJN.


    ### MAKASSAR


    The Japanese wanted to take Makassar on Sulawesi and establish it as a base for
    the air offensive against Java. The operation was purely a naval affair of the
    Netherlands East Indies Unit and was carried out by the 1st Base Unit with air
    support from the 2nd Air Unit. Given the activities of the Allies in the Makassar
    Strait, this attack was not carried out from Menado around the west of Sulawesi,
    but via Kendari around the east and south of Sulawesi. An additional advantage
    of this clockwise operation was the possibility of assigning units from the Ambon
    operation. The attack was scheduled for 9 February 1942\. The amphibious landing
    was to be conducted by the Sasebo Combined SLF.


    In addition to the Celebes and Menado Territorial Command, Makassar also housed
    the Makassar Troops Command. Colonel M. Vooren was in command of all troops on
    Sulawesi, but he lacked the means to control the scattered detachments after the
    Japanese landings. The Makassar Troops Command consisted of *c*. 1,000 men of
    the Celebes and Menado Garrison Battalion. Colonel Vooren based his defence concept
    on the Malaya campaign. He set the goal of inflicting as greater losses as possible
    and tying down enemy units for as long as could be achieved. To this end, he traded
    the generally followed operational concept of direct coastal defence for an indirect
    defence: slowing down the enemy advance to carry out the planned destruction of
    Mandai Airfield, and ending in the defence of the Tjamba position in the mountainous
    interior. The entire plan was defensive.


    The Japanese naval convoy was attacked by submarines. Although one Japanese destroyer
    was damaged and one was sunk, this did not hinder the amphibious landing. At around
    midnight Sunday 8–Monday 9 February 1942, the Sasebo Combined SLF made an amphibious
    landing in two areas 3km south of Makassar. The city was occupied around noon.
    The NEI defenders succeeded in destroying Mandai Airfield. At the end of the day,
    the offensive phase of the operation had ended for the IJN, leaving only mopping-up
    operations. The IJN claimed to have killed 77 enemy troops and taken 85 prisoners
    of war. Japanese losses were four killed in action and five injured from the SLF,
    and five killed and six seriously injured on board the sunken destroyer.


    The NEI garrison had fallen back on the Tjamba position. The latter was only attacked
    on 27 February 1942, and taken the following day. The remaining RNEI Army troops
    melted away through desertion. In addition, the population had openly adopted
    an anti-Dutch attitude. On 7 March 1942, the NEI territorial commander surrendered.
    Little had come of his goal of tying down the Japanese.


    ### BANDJERMASIN


    At a conference in Manila held between 21 and 23 January 1942, the IJN proposed
    extending the operating schedule by ten days and dropping the planned conquest
    of Bandjermasin. Preparing the airfield would probably take some time. Given the
    proximity to Java, supplying it was a major risk. Instead, it would be more effective
    in terms of risks to take Bali. However, the IJA adhered to the Cam Ranh Agreement.
    The capture of Bandjermasin was important as a base for air operations against
    Java. The planned occupation would continue, but the attack from the sea was cancelled.
    The Sakaguchi Detachment would occupy the city mainly overland, while the IJN
    would support a small-scale maritime operation along the coast.


    **THE JAPANESE ASSAULT ON AMBON, 31 JANUARY–3 FEBRUARY 1942**


    The island of Ambon was centrally located in the eastern part of the Indonesian
    archipelago. It had a natural harbour and a well-equipped airport. The Japanese
    attack on the island comprised a joint army and naval amphibious assault at two
    separate landing zones, culminating in two separate operations: one on the southern
    peninsula by the IJA against the rapidly defeated NEI troops and the more resilient
    Australian Gull Force; and the other by the IJN on the northern peninsula, which
    attacked and ultimately took Laha Airfield.


