    Kendari II Airfield on Sulawesi was described as one of the best airfields in
    the Indonesian archipelago; it had three runways (1,000m by 600m), and was easy
    to extend. Unlike most other captured airfields, it could be put into use immediately.
    One drawback was that the airfield was far from the coast, lying 25km inland.
    On 27 February 1942, the 21st Air Flotilla HQ moved from Menado to the airfield.
    Kendari provided the Japanese with an important base for operations against Ambon
    and Timor, and thus against the Java–Australia line of communication. This picture
    was taken in 1947. (Leiden University Libraries, [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/))


    By the end of January 1942, the Kawaguchi Detachment had begun a large pincer
    movement. Overland, a force moved towards Singkawang and captured the thoroughly
    destroyed airfield on 27 January 1942. A second force moved in improvised sea
    transport and landed successively in four locations along the west coast. The
    RNEI West Borneo Garrison Battalion, with a strength of approximately 1,000 men
    and already compromised morale, was tasked with the defence of West Borneo. It
    was reinforced with the 2nd Battalion, 15th Punjab Regiment of the British Indian
    Army, that had been withdrawn from Kuching with a remaining strength of 783 men.
    This force could only slow the Japanese advance. After the general capitulation
    in March 1942, the remaining NEI troops surrendered. A few continued to conduct
    guerrilla warfare. The 2nd Battalion, 15th Punjab Regiment withdrew to South Borneo,
    and then surrendered on 31 March. Japanese losses were 19 men killed, two fatally
    injured and 31 wounded in action. They reported 270 enemy killed and 182 prisoners
    of war taken.


    Due to the destruction, the wet ground and the long-destroyed supply route over
    land, Singkawang II could not be used for the landing operation on Java. The IJN
    22nd Air Flotilla therefore transferred its headquarters to Kuching on 8 February
    1942. Due to the poor conditions at Kuching, aircraft could not be fuelled with
    a full load. This made carrying out air strikes on Java difficult.


    With the loss of Singkawang II, Manggar at Balikpapan, Kendari II and the elimination
    of Samarinda II, the second line of strategic airfields had been broken.


    ### AMBON


    Ambon is an irregularly shaped island with a long coastline and a small surface
    of 716km2. It consists of two land masses, Hitu and Laitimor, separated by a large
    inner bay. It has low and medium mountains with peaks rising to between 460m and
    1,000m. These are very steep and densely covered with secondary forest. There
    are few roads outside built-up areas, only animal trails and footpaths.


    After 1936, the island of Ambon was developed into an auxiliary support base for
    the Royal Netherlands Navy. The island was centrally located in the eastern part
    of the Indonesian archipelago. The inner bay provided a sheltered natural harbour.
    It had two air bases: Halong Naval Air Base and Laha Airfield with a 1,700m-long
    concrete runway.


    The garrison consisted of the Moluccas Garrison Battalion and the 4th Coastal
    and AA Artillery Company. The Garrison Battalion was made up of a headquarters,
    three companies, a machine-gun company, a `kortverband` (short service) company,
    a (European) militia company, a Veteran Reserve Corps and detachments outside
    Ambon. In addition, four APCs were also sent to Ambon. The garrison also featured
    the Indonesian Militia Depot Battalion and Town and Country Guards. In total,
    it was about 2,600 men strong. In addition to these ground troops, the Military
    Aviation Service stationed a patrol of three fighter aircraft on Laha. The Royal
    Netherlands Navy stationed a squadron of seaplanes on Ambon.


    To bolster the defence of Laha, the Australian Gull Force arrived on 17 December
    1941, consisting of HQ Gull Force; the reinforced 2/21st Battalion; C Troop, 18th
    Anti-Tank Battery; a section of engineers from 2/11th Field Company; and some
    support elements, with a total strength of `c`. 1,170 men. An Area Combined Headquarters
    was established for the command of RNEI and Australian forces. On Laha, Gull Force
    suffered particularly from malaria and dysentery. Two weeks prior to the Japanese
    landing, the commanding officer Gull Force was replaced with Lieutenant-Colonel
    W.J.R. Scott. The collaboration between the latter and the NEI territorial commander
    left much to be desired.


    The IJN wanted to sever the Allied Ambon–Kupang line of communication. As part
    of the elimination of Allied airpower in preparation for the attack on Menado,
    the IJN 21st Air Flotilla bombed Ambon. This was the beginning of a series of
    air strikes, followed by armed reconnaissance. Shortly before the landings, new
    air raids followed, this time by carrier-based aircraft. Under Japanese pressure
    and the now-reconnoitered invasion fleet, ABDACOM ordered the withdrawal of the
    remaining air units on 27 January 1942.


    The NEI territorial commander, Lieutenant-Colonel J.L.R. Kapitz, followed a plan
    based on the fixed defence of coastal positions by the NEI troops, the defence
    of Laha Airfield by part of Gull Force and the formation of a covering force or
    general reserve by the rest of Gull Force and part of the NEI troops. On 10 January
    1942, as proposed by Kapitz, it was decided that Gull Force would defend the south.
    Landings on the south-east coast of Laitimor were not expected. In view of the
    terrain, the NEI–Australian plan was mainly defensive in nature. When it became
    clear on 30 January 1942 that the Japanese would land in the south, Kapitz moved
    the centre of gravity of the defence to the Passo position: three companies, the
    machine-gun company and a militia section. This position was north of Ambon City
    on the isthmus between Hitu and Laitimor. With this, Kapitz increased the distance
    from Gull Force in the south. The Allied forces were further fragmented by this,
    and could be defeated piecemeal by an already powerful opponent.


    The Attack Unit and the Air Task Force of the Southern Task Force carried out
    the attack on Ambon. The 2nd Carrier Division was placed under the command of
    the Air Unit. It was a considerable force. Between 0240 and 0250hrs on Saturday,
    31 January 1942, Japan’s Eastern Detachment (Ito Detachment), consisting of the
    228th Infantry Regiment, 38th Division, landed from Hong Kong via Davao on two
    beaches on the undefended south-east coast of Ambon. This threatened the rear
    of the heavily fortified bay at Ambon. After the successful landing, the left
    attack unit, the main force, crossed the mountain ridge in two parallel columns
    over jungle trails under heavy rainfall and a stormy westerly wind (Beaufort Force
    8). The weather cleared around noon. The reinforced NEI defenders were pushed
    aside. In the afternoon, the Japanese entered Ambon City. The RNEI Army and Australian
    troops were thus separated.


    ![CAM364_030.jpg](img/CAM364_030.jpg)


    A sketch of the defence of Laha Airfield, located on a coastal plain at the inner
    bay of the island of Ambon. It was one of the few airfields in the Netherlands
    East Indies with a concrete runway. Quarter, stores and shelters were not dispersed
    or camouflaged, and were in the immediate vicinity of the airfield, which made
    the airfield particularly vulnerable – the more so because the ground-based air
    defence was weak, with two 4cm AA guns and three M.30 (Colt-Browning) 12.7mm AA
    guns from the RNEI Army. (Netherlands Institute of Military History)

