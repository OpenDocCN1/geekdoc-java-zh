  trans: '

    荷兰和澳大利亚在参员会议期间曾是重要的伙伴。这种关系随着亚洲战争的爆发而立即结束。战略政策变成了英美之间的事务，由美国人领导。荷兰、澳大利亚以及新西兰政府被刻意地未征求意见，而是被告知一个**既成事实**（`fait
    accompli`）。这不仅适用于该机构，也适用于人事任命。所有主要指挥职位都由英国或美国军官担任。只有 `ABDA-ARM` 留给了一个荷兰人：陆军司令官
    `H. ter Poorten`。这显然表明该指挥部的重要性。这种局面导致了与澳大利亚和荷兰之间的紧张局势。


    1942 年 1 月初，应英国要求，决定将澳大利亚第 1 军团（由澳大利亚第 6 陆师和第 7 陆师组成）和英国第 7 装甲旅团从中东调往荷兰东属群岛。`Wavell`
    将一个师部署在南苏门答腊，一个师连同坦克旅部署在爪哇中爪。随着新加坡陷落在即，`Wavell` 决定将这些援军转移到缅甸。显而易见，随着新加坡的陷落，保卫印度成为他的首要任务。澳大利亚的政治和军事领导层不再支持英国的这一意图。澳大利亚需要自己的军队。1942
    年 2 月 19 日，`CCS` 决定不再向爪哇派遣进一步的陆陆援。然而，一些澳大利亚和英国部队仍在那里登陆。


    问题在于，计划中向爪哇增援的陆军是否能阻止日本人的进军——更不用说这些部队是否能及时作战。鉴于日本的海空力量，只有通过大规模增援盟军的空海资产才可能保卫荷兰东属群岛。然而，足够的飞机并不可用，而美国人又不愿在西太平洋冒险其美国太平洋舰队。


    ![9781472843524_Map004.jpg](img/9781472843524_Map004.jpg)


    ## 日本南方攻势


    日本南方攻势发生在雨季，当时亚洲大陆上空存在高压系统，导致北半球出现东北风和南半球出现西北风。湿季风带来了来自南中国海和太平洋的潮湿空气，并在下午带来强降阵雨。雨水和低能见度使航空行动变得困难。大气干扰阻碍了飞行移动并导致无线通信不良。植被主要由热带丛林组成。少数大城市就像是丛林中的岛屿。道路网络极其有限。爪哇是一个例外。主岛拥有完善的现代道路网以及铁路和电车线，连接十分良好。


    ## 战役


    ### 第一阶段行动


    1941 年 12 月 7 日至 8 日，日本发起了“**甲号作战**”（`Operation A-Go`），对美国和英国的资产发动了同步的大范围进攻。尽管没有受到直接攻击，荷兰仍于
    1941 年 12 月 8 日对日本宣战。根据参员会议的协议，`NEI Military Aviation Service` 将一个航空机群（联队）和一个战斗战斗机中队派往马来亚。荷兰皇家海军派遣了一艘轻巡洋舰和潜艇。这些部队被置于英国的作战指挥之下。除了军事航空局和荷兰皇家海军的重大贡献外，`RNEI
    Army` 还派遣了四支旅（等同于营）的 `Marechaussee Corps`，这是一支来自亚齐、专攻反游击战的步兵单位。他们于 1942 年 1 月和
    2 月部署在马来亚日军后方。其规模约为 `c`. 142 人，包括印度尼挑夫。在采取一些成功行动后，部分遣队于 1942 年 3 月成功返回苏门答腊。


    在日本在泰国和北马来亚登陆后，船运资源开始用于“**乙号作战**”（`Operation B`）：征服英属婆罗洲。`F 支队（川河口支队）`于 1941 年
    12 月 16 日从印度支那在美里登陆，并于 1941 年 12 月 24 日在古晋登陆。`RNEI Army` 将此视为严重威胁，并用军事航空的轰炸做出回应。荷兰皇家海军派遣潜艇对抗日本在古晋的两栖作战。这些攻击造成了相当损失，但未能阻止日本人的进军。


    菲律宾民兰老岛的港口城市达沃于 1941 年 12 月 20 日被占领，南部的若洛也于 1941 年 12 月 25 日跟进。随着古晋、达沃和若洛被占领，进攻荷兰东属群岛的基地已落入日本人手中。最初计划的帕拉奥，地理位置优越且更大的达沃成为了“**丙号作战**”（`Operation
    H`）的集结点。当针对马来亚和菲律宾的行动仍在进行之际，`IJN` 于 1941 年 12 月 26 日转向第二阶段行动，即进攻荷兰东属群岛。婆罗洲岸边的石油岛塔拉干和北苏门答腊的望加是首批攻击的目标。


    古晋、达沃和若洛机场的状况远比预期。海军建设部队需要更多时间来准备这些基地。达沃和若洛直到 1942 年 1 月 8 日才完全可用。尽管有这些延迟，日本南方军仍希望将爪哇的进攻提前一个月。它试图利用行动的有利进展，保持势头，并领先于美国海军和英国皇家海军可能的援军。鉴于被占领机场投入使用的的延迟，以及可用运输舰和海军护卫舰的数量有限，`IJN`
    反对提前进攻。在 `IJA` 的巨大压力下，`IJN` 最终在 1942 年 1 月 1 日的“**金兰协议**”（`Cam Ranh Agreement`）中同意。


    ![CAM364_021.jpg](img/CAM364_021.jpg)


    从 1937 年起，`NEI Aviation Service` 将现有的三个侦察和战斗机中队重组为水平中队。为此，他们于 1936 年购买了美国制造的 `Glenn
    Martin B-10 Model 139`和`Model 166`双发轰炸机。照片中的飞机是 `WH-2 (Wright Holland-2)`版本，注册号为
    `M-514`和`M-539`。可以看到三名机员。飞机上载有 1939 年 11 月 15 日引入的国家标记。两架飞机均于 1941 年 12 月分配给 `2/3rd
    Aircraft Group`，并在义巴西旺（新加坡）或稍后在卡里达蒂失踪。（Bronbeek 博物馆）


    ![CAM364_024.jpg](img/CAM364_024.jpg)


    一名安汶族射击手配备了弹匣式的 20mm `Solothurn S18-1000`反坦克枪。总共只有 72 支这样的枪。`S18-1000`为步兵团提供了一种便携式反坦克武器。每个反坦克枪小组（十人）配备两支反坦克枪，分配给每个步兵团的`第四连（重武器）`。（Bedbank
    WW2 – NIOD）


    ![table_p38.jpg](img/table_p38.jpg)


    盟军意识到达沃和若洛的重要性，这两个地点都遭受了荷兰和部队的空袭。


    ### 第二阶段行动：征服荷兰东属群岛


    日本帝国在 1941 年 12 月 8 日尚未对荷兰宣战。它仍在试图通过瑞士按照印度支那模式，将荷兰东属群岛作为保护国和平地纳入其势力范围。然而，荷兰方面对此未做出回应。日本随后于
    1942 年 1 月 11 日对荷兰宣战。

