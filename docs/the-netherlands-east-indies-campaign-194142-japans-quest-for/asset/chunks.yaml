    Alongside the defeat by Japan, the Netherlands East Indies also disintegrated
    on 8 March 1942. Three years of heavy occupation followed. European influence
    in the Netherlands East Indies was almost completely nullified. The prisoners
    of war were partly employed outside Java for the construction of airfields on,
    for example, the island of Flores and railway lines in Burma–Siam or on Sumatra
    and in mines in Japan. Of the 42,233 European prisoners of war taken, 8,200 (19.4
    per cent) died. The European population was partly interned in civilian camps.
    This involved an estimated 100,000 persons. Of these, 16,800 died. About 120,000
    Europeans remained outside the camps.


    The Japanese, greeted as liberators, inflicted a heavy toll on Indonesia. Hunger
    is said to have killed 2.5 million Indonesians. Japan employed a large number
    of mainly Javanese as workers. Some of these `romusha` (forced labourers) were
    employed on a temporary basis. It is estimated that between 160,000 and 200,000
    were deployed outside Java. Many died in the process.


    The Japanese occupation served as a multiplier for the Indonesian independence
    movement. The occupation policy was not aimed at granting independence within
    the Greater East Asian Co-Prosperity Sphere. Indonesia had to be made serviceable
    to the Japanese war effort. Japan gradually changed its attitude as the war changed
    course. In September 1944, Japan declared that it would grant Indonesia independence
    in the near future. In August 1945, it went a step further and promised independence.
    However, on 15 August 1945, Japan was forced to surrender, negating further cooperation
    over Indonesian independence.


    Two days after the Japanese capitulation, the Indonesian leaders Mohammad Hatta
    and Sukarno took the initiative, declaring Indonesian independence on 17 August
    1945. It would take four more years of negotiation and warfare before the Netherlands
    recognized this.


