    Subang to the Priangan Plateau. The position was built for a regiment in the middle
    of a tea plantation. It was to be replaced by a new position higher up the mountain
    and was greatly neglected. The fields of fire were poor, and numerous footbridges
    had been placed over the wire fence and trenches. The position was guarded until
