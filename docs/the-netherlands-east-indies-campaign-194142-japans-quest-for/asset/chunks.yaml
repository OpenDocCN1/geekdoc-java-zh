    许多道路被荷兰属东印度（NEI）部队用倒下的柚木树或装满碎石的板箱等障碍物封锁，桥梁也被破坏。这些障碍显著减缓了日军的推进。NEI 领土部队没有提供多少抵抗。1942
    年 2 月最后一周，中爪爪地区已清除了常规 NEI 部队。这支`坂口支队`(Sakaguchi Detachment)机化纵队正从克拉根（Kragan）行进；一辆`1
    型`四轮 2.72 吨`丰田 KB 卡车`走在队首。（每日新闻）


    日军的进攻进展顺利，仅因道路状况造成了延误。没有遇到 NEI 领土部队的显著抵抗。坂口于 1942 年 3 月 5 日将他的主力部队`山本梯队`(Yamamoto
    Echelon，包括第 146 步兵团司令部及三个连）连同`金纳地梯队`(Kanauji Echelon)从雅加加塔沿沿海路直指齐拉恰普（Cilacap）。他指挥`松本梯队`(Matsumoto
    Echelon，缩减的第 3 营)朝马格朗（Magelang）进。在梭梭（Surakarta）和马格朗，大量 NEI 领土部队被俘。`金纳地梯队`于 3 月
    6 日到达瑟留河（Serayu River）。然而，所有桥梁已被毁。


    南方小组收到了援军，但也因逃兵损失了人员。一天，几乎整个`芒库内戈罗团`(Mangku Negoro Battalion)都逃散了。1942 年 3 月 7
    日晚晚，日军从南部过河。南方小组几乎没有抵抗，并被命令撤退。1942 年 3 月 8 日早晨，齐拉恰普被占领。中爪哇的战斗结束。


    ## 东爪哇


    征服东爪哇的任务分配给了日本陆军第 48 师（IJA 48th Division）。这支机化师最初作为第十四军的一部分参加了菲律宾战役。在攻占马尼拉后，该部队撤出前线准备装运。根据在菲律宾的经验，第
    48 师领导层说服`第十六军`(Sixteenth Army)修改了爪哇作战计划，将登陆点从两个减少到一个，并集中于一个目标：泗水（Surabaya）。登陆后，第
    48 师指挥官土桥通（Yuitsu Tsuchihashi）中将希望迅速确保索罗河（Solo River）渡口和芝普（Cepu）的石油设施。充分利用机动性，他随后计划率领从芝普向布兰达斯河（Brandas
    River）快速推进。他预计决战将在那里发生。在击败敌军后，他将占领崩廊（Porong）并从南部进攻泗水。计划在索罗河沿线进行佯攻或吸引性攻击。该师有机配备了充足的车辆，可以运输三分之一的步兵。然而，在菲律宾，缴获的车辆足以运输整个师。


    ![CAM364_055.jpg](img/CAM364_055.jpg)


    1942 年 3 月，一名海军营的荷兰海军陆战下士。他穿着 1940 年引入的灰绿色常服。这与`NEI 陆军 1937 型`野服几乎完全相同。他手持一把`汤普森冲锋枪`摆姿。海军营超过四分三的干部配备了这种武器。（荷兰军事史研究所）


    ![CAM364_053.jpg](img/CAM364_053.jpg)


    第 48 师的`田中中队`(Tanaka Unit，包括第 2 台湾步兵团两个营和一个炮兵营）作为第二梯队在克拉根（3 号登陆区）上岸。该师通过自有和缴获（在菲律宾缴获）的车辆实现了完全机化。一辆可能是
    2.88 吨的`日产 80`卡车被人工拖上岸。约 700 名当地人被迫协助卸货。`田中中队`的目标是芝普、那里的炼油厂以及索罗河上的桥梁。（Collectie
    Stichting Nationaal Museum van Wereldculturen, Coll.nr. TM-10001990; [CC BY-SA
    4.0](https://creativecommons.org/licenses/by-sa/4.0/))


    东爪哇和巴厘岛属于 G.A.伊尔根（G.A. Ilgen）少将管理的`NEI 第 3 军事区`，他也兼指挥第 3 师。该师也被称为`泗水支队`(Surabaya
    Detachment)，其任务是保卫泗水海军基地。该基地的静态防御分配给了`泗水安全部队`(Veiligheidsbezetting Soerabaja)。机动小组——由第
    6 步兵团、第 3 骑兵队、第 1 野炮兵营和第 131 野炮兵团第 2 营的`美国 E 连`组成——负责海军基地的移动防御。1942 年 3 月 1 日，泗水的`RNN
    司令官`(RNN Commander)为伊尔根提供了一些海军陆军。组建了`海军营`(Naval Battalion)，由一个司令部、四个陆战队和海军守卫连、一个机枪排和一个后勤队组成，总人数约
    400 人。


    在舰队被毁后，泗水已失去了其作为海军基地的意义。正如新加坡一样，伊尔根少将及其部队正在保卫一个空基地。


    1942 年 3 月 1 日，日军入侵舰队锚泊在克拉根。盟军空袭击沉了一艘船，另一艘船被困在岸边。共有 62 人死亡，210 人受伤。然而，这些损失并没有阻止在
    0345 和 0400 继续登陆。彭姆邦（Rembang）很快被作为补给基地占领。尽管有路障，部队在 3 月 2 日下午到达了索罗河。该师发现所有桥梁和芝普炼油厂已被毁，油井正在燃烧。跨越暴涨的索罗河耗费了多一天。3
    月 4 日傍晚，`阿部中队`(Abe Unit，主力）开始向布兰达斯河边的克尔托索诺（Kertosono）推进。在推进过程中，第 48 师获得了全方空中支持。


    在对克拉根日军登陆舰队进行空袭后，`远东陆军军`(FEAF)于 1942 年 3 月 1 日和 2 日将设备和人员撤往澳大利亚。爪哇航空司令部未授权此举并提出了抗议。军事航空队还必须撤离中爪哇和东爪哇的机场前往安迪（Andir）。


    ![CAM364_054.jpg](img/CAM364_054.jpg)


    东爪哇的 NEI 指挥官是 G.A.伊尔根少将，第 3 师和第 3 军事区司令官。伊尔根被描述为非常优秀的师长，一个精力充沛且技术高明的领导，但倾向于急躁。在战期间，他的领导缺乏一致性。这以及他直接且详细的领导风格导致了混乱和模糊。伊尔根穿着战前不久引入的制服，穿着灰绿色短袖衫和短裤。（国家档案馆，公领域）


    ![CAM364_057.jpg](img/CAM364_057.jpg)


    当东爪哇索罗河上的桥梁被毁后，`日陆第 48 工兵团`和附属的`第 3 独立工兵团`不得不建造临时桥以继续向布兰达斯河推进。芝普的筑桥工作推迟了，因为新桥的一部分被涨的河水冲走。第二天，修复的桥梁再次受损，这次是因为一辆在菲律宾缴获的美国`M3
    斯图亚轻坦克`重量造成的。（每日新闻）


    伊尔根少将计划于 1942 年 2 月 28 日动用他的机动小组针对预期的日军登陆发动进攻行动。然而，他很快反回了这一决定。相反，伊尔根决定转为防御，目的是为摧毁海军基地争取时间。他希望在索罗河后进行阻击战来实现这一目标。


