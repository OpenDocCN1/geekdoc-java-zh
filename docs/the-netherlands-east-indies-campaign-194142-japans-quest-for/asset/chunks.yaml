    # 西爪哇战斗概述


    这是一幅由吉冈健治（Kenji Yoshioka）创作的日本战争画，名为《轰炸爪哇加里加提机场西部地区》。画面展示了 1942 年 3 月 3 日第 3 航空军轰炸后，荷兰东印度军队（RNEI）第
    2 步兵团（加强后）被毁的车辆和遗弃的武器。士兵倒在残骸之间。背景中被毁的物资仍在冒烟。两架日本飞机（可能是双引擎的三菱 Ki-51 陆军攻击机）在天空中盘旋。（NARA，公有领域）


    ## 战略形势


    第十六军将雅加达确定为作战目标，并对西爪哇印尼的反攻做了准备。1942 年 3 月 3 日至 4 日，事实证明西爪哇印尼军队采取了防御态势。相反，他们对庄司支队（Shoji
    Detachment）发起了进攻性防御。第十六军担心庄司支队的困境。3 月 4 日，它请求南方军从万胆腊飞往加里加提增援两个连来加强庄司支队。这一请求被拒绝了。


    第十六军随后决定将第 2 师的重心转移到南方推进轴。福岛支队（Fukushima Detachment）转移到南方路线，须津支队（Nasu Detachment）接受了佐藤支队（Sato
    Detachment）的增援。其目标是迅速突破勒乌壤，然后通过博哥进攻班隆以支援庄司支队。


    印尼军队在针对庄司支队的失败大反攻中已耗尽了战略预备队。不再存在进一步大规模进攻行动的问题。因此，印尼陆军总部于 3 月 4 日决定重点防守班隆高原。西群被命令尽快撤回到该高原。撤退和准备无疑需要几天时间。在此，班隆群必须独自防守高原的入口。剩余的盟军空军分配给了班隆群。西群通过博哥经陆路和铁路从雅加达附近撤往班隆，并由在勒乌壤坚守的黑部队（Blackforce）掩护。布莱克本于
    1942 年 3 月 5 日撤退。他的损失大约为 150 人。


    ## 班隆防御战


    庄司上校最初估计班隆附近的印尼军队兵力在 3 万到 3.5 万之间。在苏邦（Subang），他曾险些躲过了一次重击。他担心自己广泛部署的支队会被包围并歼灭。因此，他想夺取并占据一个高地。在击退
    3 月 2 日和 3 日的反击后，庄司上校在 3 月 4 日重新评估军事形势后改变了主意。他决定违背今村命令，放弃防御态势，转为进攻并全面进攻夺取班隆。庄司获得了第
    3 航空军司令官藤（Endo）的全力支持。藤将其第 3 航空军空中支持的重心转移到了庄司支队。他于 1942 年 3 月 2 日带着第 59 和第 75 航空从万胆腊抵达。


    ![img/9781472843524Art003_battlescene.jpg](img/9781472843524Art003_battlescene.jpg)


    # 印尼机动部队于 1942 年 3 月 2 日进攻苏邦


    在日本军登陆爪哇的第一天，庄司支队占领了加里加提机场。印尼军队以各种反击予以回应，其中一次是由坦克和装甲步兵队在炮兵支持下进行的。庄司支队分散，其总部位于苏邦，第
    2 营（减员后）和机场单位位于加里加提，第 1 营（减员后）位于北部，第 6 公司守卫其着陆点。在苏邦，庄司上校的总部由第 1 营第 4 公司（总共 100
    人）守卫，他们装备有一门山炮、一门反坦克炮和两挺机枪。


    1942 年 3 月 2 日（周一）当地时间 0810，由 G.J. 沃尔斯特（Wulfhorst）上尉指挥的印尼机动部队进攻了苏邦。它由总部、一个侦察排、一个坦克连、一个装甲步兵连、一个反坦克炮组和一个补给队组成。它接受了第
    2 山地兵团第 2 炮的增援。随之的是荷兰军事史上的第一次坦克攻击。


    ## 苏邦战斗


    这一场景展示了进攻的印尼装甲纵队在强行通过苏邦南的一个道路障碍后，被与日本守军的火战困住的时刻。我们看到日本人设置用来阻塞道路的断裂钢缆（`1`），隐藏在两辆（现已推开）推车后面（`2`）。撞断电缆的荷兰产马顿-赫林顿
    Mk III 型装甲车翻覆在道路右侧（`3`）。领先的印尼坦克排（由七辆马顿-赫林顿 CTLS-4TA 坦克组成）沿路单排行进（`4`），并向苏邦推进。在道路两侧，日本士兵在平民建造的防空壕、沟、房屋内和树后占据了阵地（`5`）。他们对从装甲运兵车上下的后续印尼步兵开了火（`6`）。安汶人第
    1 排步兵正进入道路左侧的橡胶园（`7`），而望加锡第 2 排则向右侧部署（`8`）。连官站在路中央，一名轻机枪手躺在他身边（`9`）。一名在伪装前沿位置的轻机枪手遭遇了射击故障（`10`）。


    尽管日本人出其不意，但机动部队未能利用这一战术成功。地形限制了部署，坦克必须在建筑区内单排战斗。被火力火力困住的装甲步兵连无法跟上坦克。在没有步兵支持的情况下，冲向机场是毫无意义的。坦克排掉头并强行退回。


    为了让印尼步兵进一步进入苏邦，另一个坦克排于 0915 发起了第二次攻击。1000 时，日本人威胁了步兵的右翼和左翼。印尼发起了第三次坦克攻击，使印尼步兵能够脱离战斗并撤退。机动部队撤退了。这场持续了近两个小时的战斗结束了。


    机动部队遭受了严重伤亡：15 人死亡，13 人受伤（其中一人后去世）。物资损失包括 13 辆坦克、一辆装甲车、三辆装甲运兵车和一门反坦克炮。在进攻期间，该部队没有获得火力支援。日本人损失为
    20 人死亡，人数未知。


    ## 恰特防御


    恰特防御阵地（`Tjaterstelling`）守卫从苏邦到望加里高原的通道。该阵地是为茶园中的一个团而建造的。它本应由更高处的新阵地取代，但被严重忽视。火力差，铁丝网和战壕上方架了许多小桥。2
    月之前，该阵地由民兵队（15 人）、警察和一门 5 厘米海军炮的乘员守卫。1942 年 2 月 26/27 日，欧洲第 1 营第 2 公司（加强后）抵达。3
    月 1 日，第 2 山地兵团第 3 炮随之到达。然而，由于这些部队只能占据部分阵地。苏邦—班隆路直接通过该阵地。3 月 5 日上午，第 21 步兵团左半从中爪哇抵达。然而，该营一直留在后方
    2 公里处。直到 1800 左右，该部队才移动到恰特阵地的正后方。


