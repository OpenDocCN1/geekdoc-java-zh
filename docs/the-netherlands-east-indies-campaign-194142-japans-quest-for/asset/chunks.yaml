    1 营`和`第 3 营`的两个连组成。`第 2 岸防防空炮队`和`第 2 吴仓陆战队`（减编的野团，下辖两个步兵连以及一个机枪连）在 00:00 登陆。被破坏和撤空的`曼加尔机场`和`Samboja`钻井场在未遇抵抗的情况下被占领。向城市的推进受到道路破坏的严重影响。海湾的登陆威胁了后方的守军。考虑到破坏石油基础设施的进展以及被切断的威胁，`Van
