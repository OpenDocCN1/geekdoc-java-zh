    THE NEI MOBILE UNIT ATTACKS INTO SUBANG, 2 MARCH 1942


    On the first day of the Japanese landing on Java, the Shoji Detachment captured
    Kalidjati Airfield. The RNEI Army responded with various counter-attacks, one
    of which was by a team of tanks and armoured infantry with artillery support.
    The Shoji Detachment was widely dispersed with its HQ at Subang, its 2nd Battalion
    (reduced) and airfield units at Kalidjati, 1st Battalion (reduced) to the north
    and 6th Company securing its landing site. At Subang, Colonel Shoji’s HQ was secured
    by 4th Company, 1st Battalion (100 men in total) equipped with a mountain gun,
    an anti-tank gun and two MGs.


    On Monday 2 March 1942, at 0810hrs (Java Time), the NEI Mobile Unit, commanded
    by Captain G.J. Wulfhorst, attacked Subang. It was made up of its HQ, a reconnaissance
    section, a tank company, an armoured infantry company, one AT gun section and
    a supply train. It was reinforced with the 2nd Battery, 2nd Mountain Artillery
    Battalion. What followed was the first tank attack in Dutch military history.


    This scene show the moments after the attacking NEI armoured column forced its
    way through a road obstacle just south of Subang, and became pinned down in a
    firefight with Japanese defenders. We see a broken steel-wire cable (**1**) emplaced
    by the Japanese to block the road, hidden by two (now pushed aside) carts (**2**).
    The Dutch Marmon Herrington armoured car Mk III that broke the cable lies overturned
    on the right of the road (**3**). The lead NEI tank platoon (comprising seven
    Marmon Herrington CTLS-4TA tanks) has advanced in single file (**4**) up the road
    and is pushing on towards Subang. On either side of the road, Japanese troops
    have taken up positions in civilian-built air-raid trenches, ditches, inside the
    houses and behind trees (**5**). They have opened fire on the following NEI infantry
    as they disembark from the APCs (**6**). The Ambonese 1st Platoon infantry are
    moving into the rubber plantation to the left of the road (**7**), while the Menadonese
    2nd Platoon are deploying to the right (**8**). The company commander is standing
    in the road with a LMG gunner lying prone alongside him (**9**). A Japanese LMG
    gunner, in a forward position camouflaged with a net has suffered a firing malfunction
    (**10**). The two NEI AT guns have taken up position on the road (**11**).


    Although the Japanese were taken completely by surprise, the Mobile Unit failed
    to exploit this tactical success. The terrain prevented deployment and the tanks
    had to fight in a single file in a built-up area. The armoured infantry company,
    pinned down in the fire fight south of Subang, could not follow the tanks. Without
    infantry support, a dash towards the airfield was meaningless. The tank platoon
    turned and forced its way back through.


    To get the NEI infantry further into Subang, a second attack by another tank platoon
    was mounted at 0915hrs. At 1000hrs, the Japanese threatened the right and left
    flanks of the infantry. A third NEI tank attack was launched, allowing the NEI
    infantry to break off the fight and retreat. The Mobile Unit withdrew. The engagement,
    which lasted for almost two hours, was over.


