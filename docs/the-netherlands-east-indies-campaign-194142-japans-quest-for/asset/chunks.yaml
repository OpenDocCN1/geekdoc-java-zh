    The Aviation Service was converted from two reconnaissance squadrons and a fighter
    squadron with a first-line strength of 18 aircraft in 1936 into the Military Aviation
    Service, with seven medium bomber squadrons, four fighter squadrons and two reconnaissance
    squadrons. It had 95 bombers, 99 fighters, 34 reconnaissance aircraft and 155
    other aircraft. The mid-level horizontal `Glenn Martin B-10/139 WH` bomber purchased
    between 1936 and 1939 was modern at that point, but was considered obsolete by
    1941. The `WH-3` and `WH-3A` (61 aircraft) planes still offered decent performance,
    but their armour and defensive armament was too weak against attacks from Japanese
    fighters. Instead, 162 `North American B-25C-5-NA Mitchell` medium bombers were
    ordered. These aircraft were delivered from February 1942 – too late to join the
    fight. The RNEI Army’s main fighter, the `Brewster B-339D` (63 aircraft), was
    in no way inferior to the `Nakajima Ki-43-Ia` (Oscar), the IJA fighter plane.
    The `Mitsubishi A6M2` (Zeke/Zero), the IJN fighter, was, however, more heavily
    armed and had tracer ammunition.


    In addition to partly obsolete materiel, a lack of trained (technical) personnel
    was the second weakness of the RNEI Army’s air arm. For example, there was no
    formal combat flight training for fighter pilots. This was due to a shortage of
    experienced instructors and the lack of effective combat tactics.


    The prioritization of the air arm led to a delay in the material modernization
    of the army. The emphasis was on increasing firepower and mobility. The former
    was increased with imports of plunging-fire weapons, anti-tank and anti-aircraft
    weapons and machine pistols. Mobility was increased by purchasing jeeps, trucks
    and armoured cars. Some of the vehicles were civilian vehicles that are requisitioned
    upon mobilization. Tanks (`vechtwagens`) were also brought into the RNEI Army.
    In 1939, orders were placed to supply 118 `Vickers-Carden-Loyd` light tanks and
    command tanks. When Great Britain blocked the supply of most tanks in 1940, a
    replacement supplier was found in the `Marmon-Herrington Company` in the United
    States. A total of 653 tanks were ordered from there. Only a few tanks were delivered
    from this order in early 1942. Due to the influx of new weapons and equipment,
    the RNEI Army was in a permanent state of reorganization between 1936 and 1942.


    ![CAM364_016.jpg](img/CAM364_016.jpg)


    In 1937, the RNEI Army cavalry received 12 `Alvis-Straussler AC3D` armoured cars.
    The `Alvis-Straussler` had a crew of four, and was protected by 5–10mm of armour.
    Its weaponry consisted of a 12.7mm `Colt-Browning` machine gun in the turret,
    a 6.5mm `Vickers` machine gun for the driver and another 6.5mm `Vickers` in the
    vehicle. Four platoons were formed from the 12 armoured cars. In 1941, the platoons
    were divided among four motorized squadrons. (Beeldbank WW2 – NIOD)


    In terms of personnel strength and armament, a RNEI Army infantry regiment could
    stand comparison with its Japanese counterpart on most points. However, the RNEI
    Army was significantly weaker with regard to grenade dischargers and battalion
    and regimental artillery (see [Table 3](#9781472843531-5.xhtml_tab3)). The strengths
    of an RNEI Army and an IJA artillery regiment did not differ much from one another.
    An NEI regiment of mobile artillery was equipped with 24 7.5cm guns and 12 10.5cm
    howitzers. A Japanese artillery regiment had 36 7.5cm pieces. With regard to tanks,
    the Japanese clearly held an advantage. On Java, they deployed 91 medium and light
    tanks, compared to 40 light tanks for the Allies, comprising seven `Marmon-Herrington
    CTLS-4TA` tanks and 17 `Vickers-Carden-Loyd M1936` light tanks of the RNEI Army
    and 16 `Vickers-Armstrongs Mk VIB` light tanks of the British Army.


    ![table_p20.jpg](img/table_p20.jpg)


    In 1927, a minimum strength of two cruisers, eight destroyers and 12 submarines
    was established for the Royal Netherlands Navy in the Netherlands East Indies.
    Plans to strengthen the fleet with battleships, battlecruisers or heavy cruisers
    led to fierce discussion within the navy. There was no unanimity. In 1938, a fleet
    plan was submitted for the construction of three battlecruisers, among others,
    but it was not implemented. In 1941, in the Netherlands East Indies the following
    vessels were present: two light cruisers, a flotilla leader, seven destroyers
    and 15 submarines. The Naval Aviation Service (`Marine Luchtvaart Dienst`) had
    59 flying boats (`Dornier Do24K` and `Consolidated PBY Catalina`) and eight tactical
    reconnaissance planes.


    ![CAM364_017.jpg](img/CAM364_017.jpg)


    Five heavily armed NEI soldiers in firing positions. In the upper right is an
    LMG team, comprising gunner and assistant, operating the short-barrelled 6.5mm
    `Madsen M15` ‘carbine machine gun’ (`karabijnmitrailleur`). The two soldiers in
    the foreground are armed with the 9mm `Schmeisser MP28/II` (`KNIL M39`) sub-machine
    gun. The soldier at upper right is wearing gas mask. (Beeldbank WW2 – NIOD)


    The defence of the Netherlands Indies against a foreign enemy suffered from structural
    weaknesses. In 1930, indigenous population of 60 million was dominated politically,
    administratively and economically by 240000 Europeans. The position of European
    top layer was weakened after May 1940 as support from Netherlands fell away. The
    US Chief of Operations Harold R. Stark stated in his 12 November 1940 `Memorandum`:
    ‘This political situation cannot be viewed as permanent equilibrium. The rulers
    are unsupported by home country or by alliance. Native rebellions have occurred
    in the past, and may recur in the future.’ A retired colonel expressed in a Netherlands
    East Indies newspaper on 23 July 1940 the idea that ‘the vast mass of the population,
    especially those in Java, may be considered as completely loyal and even attached
    to the existing authority, as it is now established and organized’. This view
    turned out to be *idée fixe*. The Dutch colonial state and thus its army were
    essentially an occupation force with little support from within society. On a
    relatively broad scale, in the other regions and in Java, the collapse of colonial
    rule led to serious looting and arson on occasion, as the Indonesian people seized
    the opportunity.


    ### Allies


    As agreed in the Anglo-Dutch-Australian staff conference in February 1941 and
    recorded in the Plans for the Employment of Naval and Air Forces (`PLENAPS`) of
    12 November 1941, after the outbreak of hostilities Australia sent air units to
    the islands of Ambon and Timor in the Netherlands East Indies. No. 13 Squadron
    RAAF stationed light bomber and coastal reconnaissance aircraft on Ambon and at
    Namlea on the island of Buru. At Penfoei Airfield on Timor, a flight from No.
    2 Squadron RAAF was stationed. For security purposes, three battalion battle groups
    were formed from the 23rd Infantry Brigade, Australian 8th Division: Lark Force
    (for Rabaul, New Britain), Gull Force (Ambon) and Sparrow Force (Timor). With
    these units Australia formed a ‘forward observation line’.


    These Australian units were part of the all-volunteer Second Australian Imperial
    Forces (`2nd AIF`). In their deployment in the Netherlands East Indies, they lacked
    heavy weapons. Moreover, they were neither trained nor equipped for jungle warfare.
    The soldiers were dressed in shorts, which were unsuitable for duty in thickly
    vegetated terrain under tropical conditions. Scratches and cuts on the knees and
    lower legs led to tropical sores. Malaria prevention was virtually unknown. The
    result was a high sickness rate and a decline in fighting power. Command relations
    with the local RNEI Army commanders left much to be desired.

