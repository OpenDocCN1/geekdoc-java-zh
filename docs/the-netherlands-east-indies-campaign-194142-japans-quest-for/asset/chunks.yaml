    A number of roads were blocked by NEI troops using obstacles such as felled teak
    trees or crates packed with rubble, and bridges were destroyed. These barriers
    slowed the Japanese advance down significantly. The NEI territorial troops did
    not offer much resistance. In the last week of February 1942, Central Java was
    largely cleared of regular NEI troops. This motorized column of the Sakaguchi
    Detachment is shown on the march from Kragan; a Type 1 four-wheeled, 2.72-ton
    Toyota KB truck heads the column. (Mainichi Newspapers)


    The Japanese advance progressed smoothly, and was only delayed by the state of
    the roads. No significant opposition was encountered from the NEI territorial
    troops. Sakaguchi sent his main force, the Yamamoto Echelon (HQ 146th Infantry
    Regiment and three companies) along with the Kanauji Echelon, from Yogyakarta
    along the coastal road directly towards Cilacap on 5 March 1942\. He directed
    the Matsumoto Echelon (3rd Battalion, reduced) towards Magelang. At Surakarta
    and Magelang, a large number of NEI territorial troops were captured. The Kanauji
    Echelon reached the Serayu River on 6 March. However, all bridges had been destroyed.


    South Group received reinforcements, but also lost men through desertion. One
    night, virtually an entire company of the Mangku Negoro Battalion deserted. In
    the evening of 7 March 1942, the Japanese crossed the river in the south. Group
    South offered little resistance and was ordered to withdraw. Cilacap was occupied
    in the morning of 8 March 1942\. The fight for Central Java was over.


    #### East Java


    The conquest of East Java was assigned to the IJA 48th Division. This motorized
    division was first deployed as part of the Fourteenth Army in the attack on the
    Philippines. After the capture of Manila, the formation was taken out of the line
    and prepared for shipment. Based on its experience in the Philippines, the 48th
    Division’s leadership convinced Sixteenth Army to amend the operational plan for
    Java by reducing the number of landing points from two to one and concentrating
    on one objective: Surabaya. After the landings, Lieutenant-General Yuitsu Tsuchihashi,
    the commanding officer of 48th Division, wanted to quickly secure the crossing
    points over the Solo River and the oil installations at Cepu. Making the most
    of his mobility, he then planned a rapid advance from Cepu with his main force
    toward the Brandas River. He expected the decisive battle to take place there.
    After the defeat of the enemy forces, he would capture Porong and attack Surabaya
    from the south. A diversionary or fixing attack was planned along the Solo River.
    The division was organically equipped with sufficient motor vehicles to transport
    one-third of the infantry. In the Philippines, however, enough vehicles were seized
    to transport the entire division.


