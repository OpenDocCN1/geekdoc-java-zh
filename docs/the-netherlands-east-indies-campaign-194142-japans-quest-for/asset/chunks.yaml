    ![CAM364_052.jpg](img/CAM364_052.jpg)


    A number of roads were blocked by NEI troops using obstacles such as felled teak
    trees or crates packed with rubble, and bridges were destroyed. These barriers
    slowed the Japanese advance down significantly. The NEI territorial troops did
    not offer much resistance. In the last week of February 1942, Central Java was
    largely cleared of regular NEI troops. This motorized column of the `Sakaguchi
    Detachment` is shown on the march from Kragan; a `Type 1` four-wheeled, 2.72-ton
    `Toyota KB truck` heads the column. (Mainichi Newspapers)


    The Japanese advance progressed smoothly, and was only delayed by the state of
    the roads. No significant opposition was encountered from the NEI territorial
    troops. Sakaguchi sent his main force, the `Yamamoto Echelon` (HQ 146th Infantry
    Regiment and three companies) along with the `Kanauji Echelon`, from Yogyakarta
    along the coastal road directly towards Cilacap on 5 March 1942. He directed the
    `Matsumoto Echelon` (3rd Battalion, reduced) towards Magelang. At Surakarta and
    Magelang, a large number of NEI territorial troops were captured. The `Kanauji
    Echelon` reached the Serayu River on 6 March. However, all bridges had been destroyed.


    South Group received reinforcements, but also lost men through desertion. One
    night, virtually an entire company of the `Mangku Negoro Battalion` deserted.
    In the evening of 7 March 1942, the Japanese crossed the river in the south. Group
    South offered little resistance and was ordered to withdraw. Cilacap was occupied
    in the morning of 8 March 1942. The fight for Central Java was over.


    ## East Java


    The conquest of East Java was assigned to the `IJA 48th Division`. This motorized
    division was first deployed as part of the Fourteenth Army in the attack on the
    Philippines. After the capture of Manila, the formation was taken out of the line
    and prepared for shipment. Based on its experience in the Philippines, the 48th
    Division’s leadership convinced `Sixteenth Army` to amend the operational plan
    for Java by reducing the number of landing points from two to one and concentrating
    on one objective: Surabaya. After the landings, Lieutenant-General Yuitsu Tsuchihashi,
    the commanding officer of 48th Division, wanted to quickly secure the crossing
    points over the Solo River and the oil installations at Cepu. Making the most
    of his mobility, he then planned a rapid advance from Cepu with his main force
    toward the Brandas River. He expected the decisive battle to take place there.
    After the defeat of the enemy forces, he would capture Porong and attack Surabaya
    from the south. A diversionary or fixing attack was planned along the Solo River.
    The division was organically equipped with sufficient motor vehicles to transport
    one-third of the infantry. In the Philippines, however, enough vehicles were seized
    to transport the entire division.


    ![CAM364_055.jpg](img/CAM364_055.jpg)


    A Dutch Marine corporal of the Naval Battalion, March 1942. He wears the grey-green
    service dress, introduced in 1940. This was almost identical to the `RNEI Army
    Model 1937` field dress. He poses with a `Thompson sub-machine gun`. More than
    three-quarters of the Naval Battalion’s cadre was equipped with this firearm.
    (Netherlands Institute of Military History)


    ![CAM364_053.jpg](img/CAM364_053.jpg)


    The `Tanaka Unit` (two battalions of the 2nd Formosan Infantry Regiment and an
    artillery battallion) of the 48th Division comes ashore at Kragan (landing area
    No. 3) as the Second Echelon. The division was fully motorized with both organic
    and captured (on the Philippines) motor vehicles. A truck, probably a 2.88-ton
    `Nissan 80`, is hauled ashore manually. Some 700 locals were forced to help with
    the unloading. The `Tanaka Unit`’s objective was Cepu, with its oil refinery and
    the bridges over the Solo River. (Collectie Stichting Nationaal Museum van Wereldculturen,
    Coll.nr. TM-10001990; [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/))


    East Java and the island of Bali were part of the `NEI 3rd Military Department`
    under Major-General G.A. Ilgen, who also commanded the 3rd Division. This division,
    also known as the `Surabaya Detachment`, was tasked with defending Surabaya naval
    base. The static defence of the base was assigned to the `Surabaya Security Force`
    (`Veiligheidsbezetting Soerabaja`). The Mobile Group – consisting of 6th Infantry
    Regiment, 3rd Cavalry Squadron, 1st Field Artillery Battalion and the `US Battery
    E`, 2nd Battalion, 131st Field Artillery Regiment – was tasked with the mobile
    defence of the naval base. On 1 March 1942, the `RNN Commander` at Surabaya made
    some naval ground forces available to Ilgen. The `Naval Battalion` was formed,
    consisting of a HQ, four companies of marines and naval guards, a machine-gun
    section and logistics train, with a total strength of approximately 400 men.


    After the destruction of the fleet, Surabaya had lost its significance as a naval
    base. As at Singapore, Major-General Ilgen and his troops were defending an empty
    base.


    On 1 March 1942, the Japanese invasion fleet anchored at Kragan. Allied air raids
    sank one ship while a second ship was left stranded. A total of 62 personnel were
    killed and 210 wounded. However, these losses did not stop the landing going ahead
    at 0345 and 0400hrs. Rembang was quickly captured as a supply base. Despite roadblocks,
    the Solo River was reached in the afternoon of 2 March. The division found all
    the bridges and the Cepu Refinery destroyed, and the oil wells were on fire. The
    bridging of the swollen Solo River took more than a day. In the evening of 4 March,
    the `Abe Unit` (the main force) began to advance towards Kertosono on the Brandas
    River. As it advanced, the 48th Division received full air support.


    Following the air strikes on the Japanese landing fleet at Kragan, `FEAF` ceased
    operations and evacuated equipment and personnel to Australia on 1 and 2 March
    1942. The Java Air Command had not authorized this and lodged a protest. The Military
    Aviation Service also had to evacuate the airfields in Central and East Java for
    Andir.


    ![CAM364_054.jpg](img/CAM364_054.jpg)


    The NEI commanding officer in East Java was Major-General G.A. Ilgen, GOC of 3rd
    Division and 3rd Military Department. Ilgen was described as a very good divisional
    commander, an energetic and skilled leader, but prone to haste. During the campaign,
    his leadership lacked consistency. This, and his direct and detailed leadership
    style, led to confusion and ambiguity. Ilgen wears the uniform introduced shortly
    before the war with grey-green short-sleeved shirt and shorts. (Nationaal Archief,
    public domain)


    ![CAM364_057.jpg](img/CAM364_057.jpg)


    When the bridges over the Solo River in East Java were destroyed, the `IJA 48th
    Engineer Regiment` and the attached `3rd Independent Engineer Regiment` had to
    construct a temporary bridge to continue the advance towards the Brantas River.
    The bridge-building at Cepu was delayed because part of the new bridge was swept
    away by the swollen river. The next day, the repaired bridge was damaged once
    again, this time by the weight of an American `M3 Stuart light tank` captured
    in the Philippines. (Mainichi Newspapers)


    Major-General Ilgen planned an offensive action by his Mobile Group on 28 February
    1942 against the expected Japanese landing. However, he soon reneged on this decision.
    Instead, Ilgen decided to move to the defensive with the aim of gaining time for
    the destruction of the naval base. He wanted to fight a delaying action behind
    the Solo River to achieve this.


    ![CAM364_059.jpg](img/CAM364_059.jpg)

