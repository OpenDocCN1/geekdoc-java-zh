    ### RAF HQ Situation


    Confusion reigned at RAF Palembang that morning. Air Commodore Hunter gave the
    order to evacuate Palembang I and move the fighters back to Palembang II. This
    was then ordered to move the aircraft to Jakarta. This order was revoked by ABDA-AIR
    around noon, and the aircraft returned. The RAF HQ in Palembang was cleared, and
    in the afternoon reoccupied. However, its transmitter and the codes had been destroyed.


    ABDACOM also responded at sea. The Japanese convoy destined for South Sumatra
    left Cam Ranh Bay on 9 10 February 1942 and was reconnoitred on the morning of
    13 February. It was then attacked by British aircraft from Palembang in the evening
    of the same day and the following morning. The Japanese suffered no losses. The
    Allied naval squadron, the Combined Striking Force, was also deployed against
    the Japanese fleet. Vice Admiral Ozawa deployed his air units against this threat.
    Without air cover and with the element of surprise lost, Doorman decided to cancel
    the action.


    ![../img/9781472843524Art002_battlescene.jpg](img/9781472843524Art002_battlescene.jpg)


    ### NEI COUNTER-ATTACK AT PLAJU REFINERY, PALEMBANG, 14 FEBRUARY 1942


    For the IJA airborne attack on the two refineries of Plaju and Sungei Gerong at
    Palembang on 14 February 1942, the battalion-sized airborne `2nd Raiding Regiment`
    could only allocate the `1st Company` (less elements, 99 men).


    The IJA paratroopers, led by company commander 1st Lieutenant Nakao, jumped at
    the refineries at 0930hrs local (South Sumatra) time. Sixty men landed at Plaju
    Refinery, the majority to its south-west while some did land in the refinery itself.
    They manage to establish themselves on the site and set up a defence in shelter
    trenches, behind the earth banks around the oil tanks, on top of the oil tanks
    and in the refinery upper platforms.

