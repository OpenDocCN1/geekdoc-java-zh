  raw: 'Kragan was an ideal landing point with a 35km-long beach and major connecting
    roads in the proximity. The vanguard of the Sakaguchi Detachment, the Kanauji
    Echelon, set foot ashore 6km south-east of Kragan on 1 March 1942 at 0700hrs.
    The other two units, the Matsumoto and Yamamoto echelons, did not land until the
    following day. Their transport ship was slow because it had been damaged during
    the invasion of Bali. The Sakaguchi Detachment (less the Kume Detachment left
    on Borneo) consisted of the 2nd and 3rd Infantry battalions, 146th Infantry Regiment,
    two field artillery batteries, an armoured car unit and 2nd Transport Company
    with 259th Independent Transport Company attached. Sakaguchi’s objective was the
    southern port city of Cilacap, the capture of which would cut off the escape route
    from Jakarta and Bandung. In the second phase, it would mop up remaining enemy
    units in Central Java.


    The RNEI Army’s 2nd Division, based in Central Java, under Major-General P.A.
    Cox, was reduced on 22 February 1942 by the relocation to West Java of 4th Infantry
    Regiment. South Group, two motorized cavalry squadrons (4th Cavalry Squadron and
    Life Guards Cavalry Squadron) and the Cilacap Detachment remained. South Group
    was a weak infantry regiment formed in January 1942 by merging three understrengh
    and underarmed infantry battalions and a newly formed machine-gun company of mostly
    semi-trained Indonesian part-time auxiliary soldiers. The unit was almost fully
    motorized. South Group was tasked with ‘security and protection [of Cilacap port]
    by positioning itself behind the Serayu River’. On 2 March 1942, Major-General
    Cox had to give up his best battalion, the Left-Half 21st Infantry Battalion,
    to Bandung Group.


