    Its core comprised four infantry regiments, two artillery regiments and one cavalry
    regiment.


    The RNEI Army was a standing professional army of long-term volunteers. Volunteers
    from the Netherlands formed the core of the army and counter-balanced the numerical
    predominance of non-Europeans. The non-Europeans (i.e. Indonesians) were not recruited
    from all population groups, but from only a few select ethnic groups from the
    Indonesian archipelago. The proportion of Europeans was increased in wartime by
    European conscripts. Conscription for Indonesians was only introduced in 1941
    under pressure from the external threat. Annual quotas of 3,000 people were expected.
    In fact, Indonesian conscription was limited to Java, the Minahassa Peninsula
    (North Sulawesi) and Ambon, and by this point it was a case of too little, too
    late.


    In peace and wartime, the Netherlands East Indies did not have a joint headquarters
    for land and naval forces. The two lines of command only converged at the governor
    general as commander-in-chief of the army and fleet. The army and navy had their
    own chain of command under the Commander of the Army (*Legercommandant*) and the
    Commander of the Navy (*Commandant Zeemacht*). These commanders headed the Department
    of War and the Department of Navy respectively. These administrative departments
    combined the functions of a department of defence, general headquarters, operational
    command and support organization. During wartime, the operational tasks of the
    War Department were transferred to the General Headquarters (*Algemeen Hoofdkwartier*)
    under the Army Commander. The Field Army Headquarters (*Hoofdkwartier Veldleger*)
    would be formed from the Operations Branch of the General Staff (part of the Department
    of War) to command the field army.


    ![CAM364_015.jpg](img/CAM364_015.jpg)


    At the end of 1941, the RNEI Army’s cavalry was reorganized into a mounted squadron
    and four motorized squadrons. A motorized squadron had a command group, two jeep
    platoons equipped with Ford GP jeeps and motorcycles, a platoon of armoured cars
    with four M3A1 (pau W) White Scout Cars and three AC3D (pau S) Alvis-Strausslers
    and a combat and baggage train. The jeep platoons each included a section of 12.7mm
    M30 Colt machine guns. The photo probably shows the 2nd Cavalry Squadron at Bandung
    with the two jeep platoons, the command group in the centre foreground, and to
    the right the platoon of armoured cars and the radio car of the command group.
    (Nationaal Archief, Collectie DLC, public domain)


    The chain of command was further complicated by the position of the Royal Netherlands
    Navy (*Koninklijke Marine*). It was not an NEI institute, but came under the Ministry
    of Defence in the Netherlands. Although the Commander of the Navy was operationally
    under the governor general, he was accountable to the Minister of Defence in the
    Netherlands for his administrative policy. The navy was funded from the Netherlands
    and NEI budgets. The armed forces also remained physically separate. The General
    Headquarters was based in Bandung. The HQ of the Royal Netherlands Navy was in
    Jakarta.


    On 5 March 1942, the governor general was released from supreme command by the
    Netherlands government in London. The governor general would thus be given free
    reign to continue to administrate the area under the Japanese. This turned out
    to be wishful thinking.


    In the interbellum, the RNEI Army underwent three rounds of austerity cuts: 1922–23,
    1927 and 1930–35. From 1936, defence budgets increased again due to the rising
    international tension in Europe and Asia. The army command formulated the 1936
    reinforcement plan. This eight-point programme provided for further reinforcement
    of the air arm, mechanization of the infantry, increase of firepower for infantry
    and (coastal) artillery and the filling of gaps in personnel.'
