    assessment and the eventual dependence on foreign (viz. British and American)
    support. The support from a supposed alliance lay beyond the Netherlands’ control.
    The Washington Conference of 1921–22 was said to have relaxed tensions in the
    Pacific. According to the RNEI Army, nothing could be further from the truth.
    The agreed partial ban on the construction of maritime bases and the development
    of the naval base in Singapore had only increased the strategic importance of
    the Netherlands East Indies. However, preservation of the NEI was a priority for
    neither Great Britain nor the United States. Firstly, Britain’s priorities lay
    in the Far East with India and Singapore. Secondly, Britain lacked the required
    resources. Due to the war in Europe, it was unable to send a significant naval
    force to Singapore. With that, the cornerstone of British defence in the Far East
    was removed. Britain’s position was so weak that, according to the historian H.P.
    Willmott, ‘the British regarded the Dutch not so much as a weak ally facing a
    common threat, an ally that should be helped, but as a force of support that could
    be tapped in an effort to buttress Britain’s own position’ (1982, p. 121). On
