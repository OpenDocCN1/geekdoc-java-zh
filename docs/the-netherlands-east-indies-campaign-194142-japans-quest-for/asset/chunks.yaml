  raw: 'The defence of Java was based on indirect coastal defence with direct coastal
    defence at the three main ports. The three key points were primarily defended
    by a direct coastal defence and by positions on the possible advance routes. On
    the roads leading from West Java to Jakarta, on all access roads linking the Priangan
    Plateau with the city of Bandung, on the north–south roads in the narrow part
    of Java between Cirebon and Semarang and on the roads leading to Surabaya, anti-tank
    defensive positions were built suitable for an all-round defence. An extended
    position was constructed around Surabaya. Secondly, the mobile defence of the
    above-mentioned key points would be conducted by four regiments with auxiliary
    weapons. Relying on local defences, the mobile forces would operate as offensively
    as possible and defend the key points with counter-attacks against any enemy troops
    that landed.


    After 1940, the system of direct coastal defence was expanded by adding artillery
    and coastal positions at the ports of Semarang, Pekalongan and Tegal. However,
    only limited resources could be made available for this.


    On Java, it was also planned to execute guerrilla warfare after defeat in a conventional
    battle. However, few preparations were made for this.


    ### ALLIES


    #### Staff conferences 1940–41


    As the threat from Japan increased, so did the Western Powers’ need for mutual
    consultation. At the end of 1940 and 1941, this resulted in Anglo-Dutch, Anglo-American
    and Anglo-Dutch-Australian and multinational staff conferences in Singapore, Jakarta
    and Manila. These conferences were limited to military-level discussions. The
    United States was neutral and was unwilling or unable to make any concrete commitments.
    Great Britain and the Netherlands became allies in 1940, but Great Britain did
    not guarantee to come to the aid of the Netherlands East Indies in the event of
    a Japanese attack. The Netherlands itself followed a neutral course in Asia after
    1940\. All this explains why the Western Powers failed to reach a political agreement.


    At the staff conferences, agreements were made to cooperate on a military operational
    level in the event of a Japanese attack. The Western Powers planned primary defensive
    operations in the Far East with a lack of maritime resources. Two simultaneous
    Japanese large-scale operations were considered unlikely. Four scenarios were
    identified for Japan. Under Scenario B, the British would receive military support
    from the Dutch following an attack on Malaya. The Dutch underlined the strategic
    importance of Singapore and made naval and air forces available for its defence.
    The Military Aviation Service would supply a group of three bomber squadrons (27
    aircraft) and one fighter squadron, while the Royal Netherlands Navy made six
    to eight submarines available for this purpose. The Dutch surface fleet would
    be used for convoy protection to and from Singapore. It was agreed that, in order
    to deny the Japanese access to Borneo and the Netherlands East Indies, North Borneo,
    North Sulawesi and Ambon would be held. Against these Dutch commitments, Australia
    stated that they would supply an air strike force and army units for Ambon and
    Timor.


    A joint and multinational headquarters was not set up. At most, liaison officers
    were exchanged. There was no question of large-scale multinational exercises.


    #### Unified Command (ABDACOM) 1942


    Following the outbreak of war in the Pacific, the newly allied Prime Minister
    Winston Churchill and President Franklin D. Roosevelt met between 22 December
    1941 and 14 January 1942 in Washington, DC at the Arcadia Conference. Here, fundamental
    agreements were reached about Allied warfare in Europe and Asia. The war goals
    were formulated in the Declaration of Nations. The heads of government further
    committed themselves to the ‘Germany First’ principle. Churchill and Roosevelt
    decided to establish a common Anglo-American military consultative body: the Combined
    Chiefs of Staff (CCS).


    ![../CAM364_019](img/CAM364_019.jpg)


    The first meeting of ABDACOM, 10 January 1942, in the official residence of the
    Dutch Commander of the Navy (*Commandant Zeemacht*) in Jakarta. At the head of
    the table is Colonel E.T. Kengen (Military Aviation Service). To the right of
    him are Lieutenant-Commander A.H.W. von Freytag Drabbe (RNN, standing), Group
    Captain L. Darvall (RAF), Major-General I.S. Playfair (Indian Army), Lieutenant-General
    Sir H.R. Pownall, General A.P. Wavell, Lieutenant-General G.H. Brett (USA), Major-General
    L.H. Brereton (USAAF), Air Commodore J.E. Hewitt (RAAF), Air Marshal Sir C.S.
    Burnett (RAAF), Rear Admiral J.J.A. van Staveren (RNN), Rear Admiral A.F. Palliser
    (RN), Vice Admiral Sir G. Layton (RN), Vice Admiral C.E.L. Helfrich (RNN), Admiral
    T.C. Hart (USN), Rear Admiral W.R. Purnell (USN), Lieutenant-General H. ter Poorten
    (RNEI Army) and Lieutenant-Colonel P.G. Mantel (RNEI Army). At this meeting, strategic
    and organizational decisions were taken. (Beeldbank WW2 – NIOD)


    The Pacific was considered a secondary theatre. The principle there became ‘hold
    territory’. The US Army Chief of Staff, General George C. Marshall, proposed unity
    of command in the South-West Pacific in the form of a joint, multinational (combined)
    headquarters. Given the vastness of the area of operations, the British doubted
    the effectiveness of such a headquarters. However, eventually they reluctantly
    agreed. British General Archibald P. Wavell was put forward by the Americans to
    be the Supreme Commander.


    The joint and combined headquarters was named ABDA Command (ABDACOM), also known
    as Unified Command.[11](#9781472843531-7.xhtml_footnote-009) ABDACOM’s mandate
    was to defend the Malay Barrier (Malaya, Sumatra, Java, northern Australia), retain
    Burma and Australia, restore communications with Luzon (the Philippines) through
    the Netherlands East Indies, support the garrison in the Philippines and maintain
    essential communication lines in the area.


    ABDACOM formed an international chain of command on top of the already existing
    national service commands. ABDACOM was organized along British lines with headquarters
    for the multinational (combined) air forces, naval forces and land forces: ABDA-AIR,
    ABDA-FLOAT and ABDA-ARM. This meant that the RNEI Army and Royal Netherlands Navy
    were deprived of their air forces with their strategic reconnaissance capabilities.
    Instead, intelligence was centralized in the Combined Operations and Intelligence
    Centre (COIC). Due to the separate locations of the various land masses within
    the command, ABDA-ARM meant little. It was everyone for themselves.


    ABDACOM did not actually control the Philippines. The Supreme Commander himself
    was focused on preserving Singapore. He had little regard for developments in
    the middle and eastern part of his area of authority.


    ![..CAM364_020](img/CAM364_020.jpg)


    General A.P. Wavell on his arrival in Jakarta on 10 January 1942\. On the left
    is the British Consul-General H.F.C. Walsh, while to the right (with back towards
    viewer) is Lieutenant-General H. ter Poorten and (facing the viewer) Admiral T.C.
    Hart (USN). Wavell was an experienced officer and commander, formerly the commander-in-chief
    Middle East Command and the current commander-in-chief India. As Supreme Commander
    ABDACOM, his decision-making was less fortunate. He used up scarce resources at
    Singapore, and sent in ground troops where air and naval reinforcements were needed.
    Because of his focus on Singapore, he hardly used any resources to counter the
    Japanese advance in the centre and east of the Indonesian archipelago. (Beeldbank
    WW2 – NIOD)'
