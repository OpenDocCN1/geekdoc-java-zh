    # 提汶岛防御战


    澳大利亚在提汶岛部署了来自澳大利亚空军第 2 中队的飞行队（四架猎逊式）和雀鸟部队（Sparrow Force）。雀鸟部队由`2/40 营`、`2/1 重炮兵团(RAA)`以及在`W.W.Leggatt`中校领导下的若干支援和后部队组成。他还可以调动四辆`RAAF`装甲车。兵力规模约为
    1,250 人。在 1941 年的美荷英三国讨论中，双方同意陆军将由其作战所在的国家指挥。提汶岛是一个例外。在战争爆发时，该岛将由澳大利亚负责指挥。


    ## 初始防御策略


    荷兰人认为，大规模登陆只在古邦湾有可能。Leggatt 中校对此表示怀疑。尽管如此，他的防御基于直接的岸防御，由荷兰东印度（NEI）部队以及分别位于古邦以东两侧的`2/40
    营``A`连和`B`连组成，以及一个由两门`6 英寸`海军炮组成的静态岸炮兵阵。`2/40 营`的`C`连位于`Penfoei 机场`，而机动的`D`连则驻守在古邦以东
    10 公里的连接道路`Babaoe`，作为机动防御。


    Penfoei 机场于 1942 年 1 月 26 日开始遭到空袭。结果是该机场到 1 月底已无法运行。随后它被用作中转站。因此，澳大利亚陆军留的理由已不复存在。然而，`ABDACOM`决定不撤离提汶岛，而是通过陆空力量对其加强。在这些力量中，只有一个由`W.C.D.Veale`准将率领的澳大利亚旅团总部以及英国`第
    79 炮队（减员）、`第 21 轻高空团(RA)`抵达。其余援军在途中途中遭到日本飞机的攻击，返回了`达文港`。


    ## 日本的作战计划


    日本对提汶岛的作战计划包括由“东遣支队”在南岸古邦和靠近东提汶迪利进行登陆。该支队将乘坐五艘运输船从安汶出发。护卫力量由`第 5 巡洋舰队`作为支援单位的“东方攻击部队”以及由`第
    2 驱逐舰队`组成的“第 2 护卫部队”提供。`1001 部队`或`第 3 横须陆战兵队`（一支日本海军伞兵部队）将在`Penfoei`执行空降进攻。`第
    3 横须陆战兵队`原计划针对巴厘望板执行行动，但其跳伞任务被取消了。


    联合舰队司令长山本五郎海军大将在 1942 年 2 月 8 日将日本海军的核心——除`第 5 航母战斗群`以外的航母战斗群，作为“第三阶段”行动的一部分交给“南方任务群”。“南方任务群”部署航空母舰对`达文港`进行空袭（“移动行动
    I”），并对爪哇岛以南进行作战（“移动行动 II”）。1942 年 2 月 19 日周四早晨，来自四艘航母战斗舰的 188 架飞机在来自肯达里`和安汶的`第
    21 飞行队`54 架飞机的支持下，袭击了澳大利亚北部的港口城市达文。后者是用于荷属东印度群岛作战的一个重要但装备简的基地。在毁灭性的空袭后，该基地暂时丧失了功能。


    ![CAM364_037.jpg](img/CAM364_037.jpg)


    这名日本海军陆战兵下士穿着日本海军伞兵穿的带有额外口袋的特殊两件式制服。然而，他穿的不是伞靴，而是配有绑腿裤的野战鞋。在右上方可以看到他深蓝底红色的职业兵章/军衔标志。这种型号的兵章一直正式使用到
    1942 年 11 月。伞兵还戴着一条皮带和两个布制弹药带。他脖子上挂着一个装有牺牲战友骨灰的袋。他配备了一支`6.5mm 38 式(1905 年)`八坂步兵枪，并装有了`30
    式(1897 年)`刺刀。（公有领域）


    ## 登陆与战斗


    1942 年 2 月 20 日周五凌晨（0235 和 0315），“东遣支队”的部队在提汶岛毫无防御的南岸三个区域登陆。“东遣支队”由`第 228 步兵团`的`第
    1`和`第 3`营、`第 38 山地兵团`的`第 2`营以及一个坦克连组成。日本海军派遣了`第 1 佐濑陆战队`的两个班以及`第 3 横须陆战兵队`剩余的
    118 名士兵。支队以三列并行作战，利用小径、路径和改良后的机道向北穿越山脉到达`古邦`和`Penfoei`。这就像是进攻安汶的重演。1942 年 2 月
    22 日，在`Tenau`发生了第四次登陆，其中包括坦克在内的部队。


    两栖登陆后，Leggatt 决定撤离并摧毁机场。`D`连在古邦通往`Baoen`的道路南部占据了阻击位置，以减缓日本人的进军。在主连接道路上，他的防线是为了阻碍日本人的进攻。在位于占隆以东的开阔地带，他试图发起阻击行动。这里他的`.303
    口径`机枪和`3 英寸`迫击炮火力将发挥作用。


    `荷属东印度古邦支队`清理了沿岸阵地，并在古邦南部集结。部分部队在`Baoen–古邦`道路上占据了拦截位置，并与`D`连会合。指挥官没有下达进一步指令。下午末，`A.L.van
    Mastrigt`上尉接管了支队指挥（189 人）并向`Penfoei`移动。1942 年 2 月 21 日早晨，他和副指挥官因误火受伤，离开了战线。他们的继任者是一个紧张的少尉，并没有加入澳大利亚人而是解散了支队。荷属东印度军队的角色在开始之前就已经结束了。


    ## 最后进攻


    在 10:45，来自`第 3 横须陆战兵队`总部的`第 1`和`第 3`连的 450 名伞兵在距离目标——机场约 12 公里的一片草地上进行了空降。选择这个跳伞点是因为此前在门纳多遭遇了惨重损失。伞兵封锁了`Babaoe`的主干道。这意外威胁了后方的雀鸟部队，并切断了预定的撤退路线。Leggatt
    通过在`Babaoe`西部集结部队并试图突破。与此同时，他未能与`Veale`准将率领的澳大利亚部队建立无线电通信。结果是，没有针对日本人的协同行动。


    第二天 10:24，来自`第 3 横须陆战兵队``第 2`连的约 250 人的第二梯队降落在同一个跳伞点。Leggatt 发起了反击并成功夺回了`Babaoe`。然而，“东遣支队”的右翼攻击部队——加强后的`第
    1 营第 2 连`（206 人）在当天结束到达了主干道，并在`Babaoe`以东形成了新的路障。澳大利亚人的撤退路线再次被切断。


    1942 年 2 月 22 日下午，雀鸟部队在早晨多次进攻后，终于打开了道路。然而，来自古邦的日本先遣队已经赶到，第二天早晨，加强后的`第 228 步兵团第
    1 营`携带着坦克也随而至。Leggatt 中校被迫投降。


