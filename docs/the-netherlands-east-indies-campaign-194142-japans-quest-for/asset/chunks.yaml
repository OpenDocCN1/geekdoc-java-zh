  trans: "\n\n# 军事领导\n\n在这张照片中，W·席林（W. Schilling）少将当时还是一名上校。他被任命为少将是在 1941 年 4 月 30\
    \ 日。52 岁的席林是第 1 师/西部小组的指挥官。他被视为一名能干的军官，但他错过了几次晋升。他的名字曾被提到为特·波滕（Ter Poorten）总参谋的潜在继任人。然而，这个职位与他擦肩。席林拒绝了领导卡里达加蒂-苏邦（Kalidjati–Subang）反攻的建议。在\
    \ 1942 年 3 月从普里亚让高原（Priangan Plateau）撤退后，他是西部小组和万隆小组联合部队的预定指挥官。1945 年获释后，席林曾是陆军司令官的人选，但再次未被选中。相反，他以中将衔担任荷兰驻日本军事团团长。1949\
    \ 年，他被荣誉退役并返回荷兰。（布龙贝克博物馆）\n\n特·波滕与总督一同被俘。他于 1945 年 8 月 17 日在中国沈阳获释。他认为自己成了荷荷陆军（RNEI\
    \ Army）失败和荷兰属东印度沦失的替罪羊。尽管如此，他仍获得了荣誉退役。特·波滕于 1968 年在荷兰去世。\n\n## 鲁道夫·巴克斯斯少将\n\n\
    **鲁道夫·巴克斯斯少将（Rudolph Bakkers，1894–1967）**是一位欧洲父亲和印度尼西亚母亲的儿子，于 1941 年 10 月 27 日成为荷荷陆军总参谋长。巴克斯斯于\
    \ 1914 年成为军官。1922 年至 1925 年间，他在参谋学院学习战争研究。1933 年至 1936 年，他还在该机构任教。作为一名印欧人，他在种族主义的殖民社会中创造了辉煌的职业生涯。然而，他也经历了歧视。例如，他没有被邀请代替陆军司令官参加澳盟联司令部（ABDACOM）的日常讨论，而是派了一名首席参谋官。\n\
    \n47 岁的巴克斯斯被描述为一个“素质极高且心慈软的人”。后者可能阻碍了他做出艰难的决定。他的妻子在战争爆发前不久去世，无疑这对他留下了阴影。是巴克斯斯在\
    \ 1941 年提出了建立一支由西方组织并武装的摩托化和机械化爪哇军队的建议。这些计划证明了他的远见，但对荷荷陆军来说过于野心勃勃。陆军司令官总是采纳他的建议。\n\
    \n## 维雅布鲁杜斯·席林少将\n\n**维雅布鲁杜斯·席林少将（Wijbrandus Schilling，1890–1958）**从 1941 年 3\
    \ 月起担任第 1 师和第 1 军区指挥官，从 1942 年 2 月底起担任西部小组指挥官。席林（1942 年 1 月时 52 岁）没有在皇家军学院参加为期三年的军官培训课程，而是作为士官。随后，他参加了为期两年的军官课程。席林曾就参谋学院，并在\
    \ 1929 年至 1935 年间在那里教授战术以及战术地图绘制。1937 年起，席林在西爪哇担任参谋和作战职务。因此，他对自己的作战区域非常熟悉。日本人的快速进军也让他感到惊讶。然而，他认为在面对日本人在西爪哇的南部进军轴时可以取得部分成功。\n\
    \n席林是一个分析能力强且知识渊的军官，将实战经验与战术理论相结合。然而，与他的同事一样，他缺乏对抗现代组织武装对手的战斗经验。\n\n![CAM364_009.jpg](img/CAM364_009.jpg)\n\
    \n1941 年，J·J·佩斯曼（J.J. Pesman）少将提早退休，据称是因为酗酒。尽管如此，他仍被任命组织自愿性的国土卫队（*landwachten*）。54\
    \ 岁、身材肥胖的佩斯曼（右）于 1942 年 2 月恢复现役，指挥新成立的万隆小组。当席林少将（左）在从普里亚让高原撤退后被任命指挥西部小组和万隆小组联合部队时，佩斯曼辞职了。（荷兰军事史研究所）\n\
    \n## 雅各布·詹·佩斯曼少将\n\n**雅各布·詹·佩斯曼少将（Jacob Jan Pesman，1888–1950）**被召回现役。1910 年，佩斯曼毕业于皇家军学院成为一名步兵。1921\
    \ 年至 1924 年间，他还在参谋学院学习。1926 年和 1927 年，佩斯曼担任廖廖副官。1939 年，他成为第 1 师和第 1 军区指挥官。由于健康原因，他申请退役并于\
    \ 1941 年 4 月获得批准。在荷荷陆军主要后勤所在的西爪哇，他还被赋予了对卡里达加蒂的反攻任务。在 1945 年获释后，他从军中退役。\n\n据说佩斯曼为万隆小组提供了“卓越”的领导力。他与特·波滕的关系似乎很困难。他的部队组建仓促，缺乏凝聚力。单位以连队的形式分布在机场和封锁通往普里亚让高原路径的位置。夺回卡里达加蒂的反攻和齐亚特（Ciater）的防御缺乏协调和力量。1942\
    \ 年 3 月 5 日早晨起，佩斯曼几乎没有利用他手中的剩余飞机。\n\n![CAM364_011.jpg](img/CAM364_011.jpg)\n\n\
    ## 尔·H·范延\n\n 尔·H·范延（L.H. van Oijen）于 1940 年 6 月 15 日晋升为少将。1933 年，他成为常服期间的女王副官。次年，他成为非常服的副官。从\
    \ 1934 年起（尽管不是飞行员），他担任了直到 1939 年的航空部队指挥官。52 岁的范延在 1941 年 12 月 7 日目睹了日本对珍珠港的空袭，当时他正在从美国和加拿大为期两个月的出差回途中。他直到\
    \ 1941 年 12 月 17 日才到达爪哇，经历了一段冒险的旅程。在照片中，他穿着航空部队的特殊制服，右肩挂着女王副官的流苏。（荷兰国家档案馆，公领域）\n\
    \n![CAM364_012.jpg](img/CAM364_012.jpg)\n\n## A·S·布莱克恩准将\n\nA·S·布莱克恩（A.S. Blackburn）准将是第一次世界大战的维多利亚十字勋章获得者。在两次大战期间，他是一名律师并在民兵中服役。1940\
    \ 年，他重新入伍，在叙利亚的澳大利亚第 7 师第 2/3 机枪营担任中校。1942 年 2 月 21 日，布莱克恩成为爪哇所有澳大利亚远征军（AIF）人员的指挥官，并晋升准将。他将负责雅加达周边五个机场地面防御的各种澳大利亚部队重新组织为一个集中在波哥尔（Bogor）的摩托化旅。他是一个激进的指挥官，对新战术持开放态度。他从马来人的经验中学习，并利用这些知识在莱利亚（Lewiliang）进行了顽强的防御。（澳大利亚战争纪念馆）\n\
    \n"
- fmt: "\nMajor-General Ludolph Hendrik van Oijen (1889–1953)  was commander of the\
    \ Military Aviation Service. After studying at the Royal Military Academy, he\
    \ was appointed as an infantry officer in the RNEI Army in 1911. Between 1920\
    \ and 1922, he returned to the Royal Military Academy as a teacher. From 1922\
    \ to 1925, he took war studies at the Staff College. Back in the Netherlands East\
    \ Indies, Van Oijen, now a major on the General Staff, took command of the Aviation\
    \ Service (`Luchtvaartafdeling`) on 29 October 1934. He was not a pilot and had\
    \ never previously served with this branch. Within the RNEI Army, however, it\
    \ was customary for an officer of the General Staff to command the Aviation Service.\
    \ Van Oijen led the transformation of the small Aviation Service into a modernly\
    \ equipped independent weapon: the Military Aviation Service. He became an inspector\
    \ of the Military Aviation Service in 1939. Van Oijen witnessed the Japanese air\
    \ attack on Pearl Harbor on 7 December 1941.\n\nVan Oijen was evacuated to Australia\
    \ shortly before the RNEI Army in Java surrendered. He became commander of the\
    \ Netherlands Military Flying School in the United States. In 1943, he was promoted\
    \ to lieutenant-general and appointed deputy army commander. Van Oijen retired\
    \ from the military in January 1946.\n\nBrigadier Arthur Seaforth Blackburn (1892–1960)\
    \ was a Victoria Cross holder. He commanded an improvised combat unit on Java\
    \ known as Blackforce. Blackburn was born in Australia. He fought in World War\
    \ I as an officer of the Australian Imperial Force (AIF) at Gallipoli and on the\
    \ Western Front, where he earned his VC. He was discharged in 1917 on medical\
    \ grounds and returned to civilian life in Australia, but remained on the reserve.\
    \ In 1940, he rejoined the army as a lieutenant-colonel. Blackburn commanded a\
    \ machine-gun battalion and saw action in Syria.\n\nHis battalion was among the\
    \ lead elements of the Australian 7th Division to disembark in the Netherlands\
    \ East Indies. On 21 February 1942, Blackburn was given command of all AIF personnel\
    \ in Java. He organized his diverse command in a short time into an infantry brigade\
    \ (reduced). He took the lessons from Malaya to heart when defending Leuwiliang.\
    \ He deployed his troops in depth and formed a mobile reserve in a counter-encirclement\
    \ role. Blackburn proved to be an energetic and inventive commander.\n\n## OPPOSING\
    \ FORCES\n\n### Japanese\n\nThe Imperial Japanese Army (IJA) and the Imperial\
    \ Japanese Navy (IJN) worked together in the Imperial General Headquarters (IGHQ).\
    \ The IGHQ was chaired by the emperor and formed the military and political summit\
    \ of the army and navy. The IGHQ was not an umbrella headquarters. The armed forces\
    \ were not subordinated, but had their own parallel organizations. For joint operations,\
    \ agreement had to be sought between the two armed forces. The resulting compromises\
    \ were recorded in a written agreement. Consultation between the IGHQ and the\
    \ government took place in the IGHQ–government liaison conferences. We also find\
    \ this consultation structure between the IJA and IJN at an operational level.\
    \ Inter-service competition was particularly strong.\n\nOf its 51 infantry divisions,\
    \ the IJA made 11 available for the Southern Offensive (Operation `A-Go`), organized\
    \ into four armies controlled by the new Southern Army (`Nampo Gun`). Three divisions\
    \ were earmarked for the attack on the Netherlands East Indies. For this purpose,\
    \ Sixteenth Army was formed under Lieutenant-General Hitoshi Imamura on 6 November\
    \ 1941. This army consisted of the 2nd Division and the 56th Mixed Infantry Group\
    \ (Sakaguchi Detachment) of the 56th Division. At a later stage of operations,\
    \ the 38th Division and 48th Division would be added. With the exception of the\
    \ 38th, these were Type A1 divisions and handpicked for the task ahead. The 38th\
    \ Division had experience of swampy terrain in southern China, while the 48th\
    \ Division was not only motorized but also amphibious-trained. The IJA set up\
    \ parachute training in December 1940. The airborne 1st Raiding Group witnessed\
    \ its first combat in the Netherlands East Indies.\n\nGiven problems with available\
    \ shipping, the 11 divisions were significantly reduced in strength before the\
    \ Southern Offensive from approximately 24,000 to 13,000–14,000 men. Three divisions\
    \ were motorized. Even with the force reduction, the 2nd Division had to leave\
    \ the 3rd Battalion, 2nd Field Artillery Regiment in Japan due to a shortage of\
    \ ships. The assigned divisions were triangular, consisting of the standard infantry\
    \ group headquarters with three infantry regiments, a field or mountain artillery\
    \ regiment, a reconnaissance regiment, an engineer regiment, a transport regiment\
    \ and further support units. The reconnaissance, engineer and transport regiments\
