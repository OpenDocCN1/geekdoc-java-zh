    大约 1230 时，由 J.H.M.U.L.E. Ohl 上尉指挥的第 10 步兵团曼纳多（Menado）加强第 2 公司抵达。他当时调动了来自第 10 步兵团第
    4 连的兵力：两个机枪排（八支维克斯士 6.5 毫米机枪）、一个迫击炮组（两门 81 毫米迫击炮）以及一个反坦克步枪小组组（两支 20 毫米反坦克步枪）。在莫西河沿岸，Ohl
    由一个机枪排和一个反坦克步枪组成了一个火力点，以掩护后方和左侧翼。他的右侧翼由一个城镇卫兵排负责。在爪哇第 10 步兵团第 3 连的一个排到达后，Ohl 将他的进攻力量重组为三个加强排。此时，他的总人数为
    312 人（不包括城镇卫兵）。


    Ohl 上尉于 1320 时开始扫荡。最初，由于日本军狙击手的火力，推进进展十分缓慢。随着援军的抵达，他的进攻势头逐渐增强，并将日本人从一个储油罐区逐出去。


    这一场景展示了下午晚些时候，由 E.J. van Blommestein 中尉指挥的右侧前排对普拉朱（Plaju）蒸馏装置进行的进攻，士兵们已经拔出了`klewangs`短刀。进攻在迫击炮的掩护下进行，机枪火力针对塔楼和储油罐之间的日军位置。燃烧太阳能油罐产生的烟雾提供了进一步的掩护。Van
    Blommestein 的左侧是由 Ohl 上尉指挥的预备排。


    进攻的曼纳多士兵（**1**）配备了 M.95 卡宾枪（**2**）和`klewangs`短刀（**3**）。背景中，一名士兵正掷出手手榴弹（**4**）。手榴弹掷出时，其长
    2 米的安全带展开，导致插销在飞行过程中被拉出。手榴弹撞击时会爆炸。在画面中心，一名枪手携带着标准的荷兰东印度陆军（RNEI）型机枪（**5**），这是一种弹匣式的
    6.5 x 53.5 毫米 M.15 麦森机枪（`karabijnmitrailleur`）。日本伞兵开始撤退（**6**）。


    在夺回炼油厂后，Van Blommestein 中尉、曼纳多一等兵 Pelealuw 和曼纳多二兵 Buntua 分别在日军的猛烈火力下爬上炼油厂塔，降下了三面日本旗（**7**）。


    当天晚上 2100 时，荷兰东印度陆军（NEI）试图用手榴弹消灭约 15 名最后的最后的抵抗，但失败了。这次进攻导致第 10 步兵团至少有一名士官牺牲，一人重伤。


    由于迫击炮火影响，炼油厂若干油罐起火。由于强风，火势迅速蔓延。到午夜，储罐区已一片火海。部队准备在清晨清理沼泽森林中的伞兵，但在 0330 时，Ohl 上尉收到了撤退命令。炼油厂及其大量的物资落入日本人手中，设施仅受到轻微损坏。


    1942 年 2 月 15 日午夜后，随着日本运输船抵达邦加岛（Bangka）蒙托克（Muntok）锚地，“L”行动的两栖/河流作战阶段开始。第 229 步兵团第
    1 营（缩编）的蒙托克登陆部队于 0225 时登陆蒙托克，并迅速占领了市和蒙托克机场。后者立即由第 33 机场公司进行扩建。邦加岛和白井岛的 NEI 部队被命令撤退至爪哇岛。逆流而上的部队前往穆西河三角洲，并在早晨抵达河口。左翼的
    Iwabuchi 部队沿萨莱河通过胆雳（Palembang）向马塔普拉拉（Martapura）推进。日本海军在河流中通过扫雷行动支持这一推进。逆流的部队反复遭到来自胆雳二机场的英国空军（RAF）飞机的攻击。日方损失较小。由于其他地区的任务，当天日方覆盖有限。日本海军正在与联合打击部队作战，而第三空军则支持第二次空降着陆。军事航空队和远东南航空军军（FEAF）对蒙托克附近的日本登陆舰队进行了轰炸任务，但几乎没有取得成功。


    ![CAM364_063.jpg](img/CAM364_063.jpg)


    一架日军 99 式川崎 Ki-48 双发轻轰炸机。在胆雳周边的战斗中，一些日本士兵被俘。1942 年 2 月 13 日，在对胆雳进行的最后一次大规模准备空袭中，日本第
    3 航空队因英国飞机的损失了三架飞机：两架日军 1 式战斗机和一架从怡保机场（位于马来亚）出发的日军 99 式川崎 Ki-48 轰炸机。后者四名机组成人员中有三名被俘，均已受伤。第一名飞行员牺牲。第二名飞行员（可能是导航员）被荷兰人审问。第二天，同一名翻译审问了一名（住院的）日本伞兵俘。捕获的日本文件和审讯报告被送往爪哇。日本战俘的命运尚不明。（公有领域）


    反复的空袭未能阻止日军的逆流而上部队。这最终导致胆雳无法守住。2 月 15 日夜间，胆雳收到海岸卫队的报告，称日本舰队正接近穆西河，并在登陆艇登陆并沿穆西河向上推进。随后，NEI
    领土指挥官于约 0300 命令摧毁炼油厂并将部队撤回胆雳。位于穆西河普拉真（Pradjen）的炮兵营必须摧毁并撤离。Vogelesang 上校本人将指挥部移至东岸。松盖格龙（Sungei
    Gerong）炼油厂被彻底摧毁，但普拉朱却落入日本人手中，拥有大量的石油和航空燃料，设施仅受轻微损坏。此前曾准备彻底摧毁普拉朱，但未执行，因为破坏部队在 1942
    年 2 月 15 日并未现场：领土指挥官在 2 月 14 日禁止了破坏并将部队召回胆雳。1100 时，领土指挥官过早命令摧毁电话交换机并撤往拉特（Lahat）。领土指挥部陷入瓦解。


    撤退命令适用于穆西河东南方的部队，而不适用于胆雳以北地区。领土指挥官于 1942 年 2 月 15 日上午确认了使用第 10 步兵团第 1 公司夺回胆雳一号机场的命令。午后不久，由第
    2 突击团第 3 连（90 人）组成的日军第三梯队跳跃了胆雳一号机场。第 10 步兵团指挥官 B.P. de Vries 少将也获悉日本登陆部队已沿胆雳河推进了
    8 公里。他随后决定取消反击并将部队撤至穆西河东岸。


    ![CAM364_036.jpg](img/CAM364_036.jpg)


