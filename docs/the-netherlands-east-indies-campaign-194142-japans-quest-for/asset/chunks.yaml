    The decision had repercussions on command lines and troop positions in West and
    Central Java. In West Java, the area of operations of `1st Division` was reorganized
    into separate commands: West Group, Bandung Group and East Group. A separate East
    Group command was ultimately not instituted. West Group, Bandung Group and `3rd
    Division` (East Java) consisted of an infantry regiment with support weapons.
    The `2nd Infantry Regiment` became the strategic reserve for West Java with the
    `1st Mountain Artillery Battalion`. To comply with these changes in the operational
    plan, the necessary troops were moved from Central to West Java to their new and
    mostly unfamiliar operating areas. They did not have time to settle in there,
    because the Japanese ground offensive in Java had now erupted in all its intensity.


    ### The Air Offensive against Java


    The air offensive against Java was carried out in East Java by the `IJN 11th Air
    Fleet` and in West Java by the `IJA` with the `Third Air Force` and the `IJN 11th
    Air Fleet`. The `IJN` and `IJA` faced a shortage of suitable air bases and logistical
    problems. In addition, the `IJN`’s air operations were severely affected by bad
    weather. The preparatory air offensive against Java had begun on 3 February 1942
    with `Operation Z`, a three-day air offensive to eliminate Allied airpower in
    East Java. The targets were Surabaya, Madioen and Malang. After two days of action,
    3 and 5 February 1942, the `IJN` was convinced that Allied airpower in East Java
    had been virtually eliminated. New attacks followed on 7, 8 and 9 February. Due
    to bad weather, the next attack did not take place until 18 February 1942. The
    weather also interfered with `IJN` air operations against West Java, and the focus
    was shifted to attack Allied shipping around Bangka. The `IJA` was only able to
    start its air campaign against West Java on 19 February from Palembang. When the
    `Western Landing Unit` departed on 18 February, the air offensive against Java
    had yet to begin. There was no question of air superiority over Java. In the eyes
    of the `IJN`, the air offensive against West Java did not bear enough fruit. The
    Allied naval and air forces remained active. For this reason, the `IJN` proposed
    postponing the landing on Java by two days until 28 February 1942. The `Southern
    Task Force` was reinforced and the air campaign against West Java intensified.


    During `Operation Z`, the `IJN` air units by chance also engaged the Allied naval
    `Striking Force`. It was thought that heavy losses had been inflicted on the Allied
    ships during two days of air attacks. In fact, only two American cruisers were
    damaged; aboard the `USS Houston`, 48 men died and 20 were injured.


    ### Allied Counter-Offensive


    `ABDA-AIR` responded to the loss of South Sumatra with an offensive counter-air
    operation aimed at impairing Japanese flight capacity as far as possible by bombing
    attacks on the oil tank farm at `Plaju Refinery`, shipping on the `Musi River`,
    the `Muntok anchorage` and `Palembang Airfield`. This counter-offensive was partly
    successful, but proved insufficient to stop the Japanese offensive. `FEAF`, in
    turn, carried out an independent offensive counter-air operation against Bali
    after its fall. In addition to the offensive counter-air action, Allied fighter
    aircraft, partly in conjunction with anti-aircraft artillery, were deployed in
    a defensive counter-air operation: the air defence of the airfields, the main
    ports and the navy. By the end of February 1942, aircraft reinforcements were
    en route by ship to Java. However, the seaplane tender `USS Langley` was sunk
    and the aircraft on the `MS Sea Witch` were packed in crates and were yet to be
    assembled. In the end, there was not enough time for that. Its cargo had to be
    destroyed.


    ![CAM364_039.jpg](img/CAM364_039.jpg)


    ### Amphibious Landings


    The amphibious landing of the `Sato Detachment` in Area No. 1, Sector C, Bantam
    Bay near St Nicholas Point. Sectors A and B were north and south of Merak on the
    Sunda Strait. The Japanese prepared amphibious landings to take place in complete
    darkness and carried them out after moonrise, preferably on days when the tide
    was highest at daybreak. On Tarakan, the landing was on a half-ebb tide. They
    used special landing craft. The unloading was done by troops. Bantam Bay turned
    out to be inappropriate for unloading. After the ships at Merak had finished on
    4 March 1942, the transport ships sailed from Bantam Bay to Merak to continue
    with unloading. (Mainichi Newspapers)


    The Sixteenth Army’s operation plan from mid-February 1942 provided for simultaneous
    landings at dawn on 26 February in West and East Java. The `48th Division` landed
    at Kragan and captured Surabaya. The `Sakaguchi Detachment` also landed at Kragan
    and captured Cilacap in Central Java. The `2nd Division` landed in Bantam Bay.
    The primary goal was the conquest of Jakarta. A powerful secondary force advanced
    to Bogor to capture this city. The `Shoji Detachment` landed at Eretan Wetan,
    captured `Kalidjati Airfield` by surprise and occupied the bridge over the Citarum
    River to block the road between Jakarta and Bandung. After the capture of Jakarta,
    the main body of the `2nd Division` and the `Shoji Detachment` were to jointly
    attack the Bandung stronghold from the north. Bandung was therefore the secondary
    goal. Depending on the circumstances, the ancillary forces from Bogor and the
    `Shoji Detachment` would occupy Bandung in one go. In February 1942, Southern
    Army considered deploying the `1st Raiding Group` to take Cilacap. This would
    cut off the return and supply route on Java. In the end, this was cancelled.


    On 26 February 1942, the two Japanese invasion fleets approached Java Island from
    the bases at Cam Ranh Bay and Jolo. The `Western Landing Unit` comprised 56 transport
    ships and 27 warships. The `Eastern Landing Unit` counted 38 transport ships for
    the `48th Division` and two for the `Sakaguchi Detachment`. This unit was spotted
    on 25 February 1942 at the `Balikpapan anchorage`. The Allied `Combined Striking
    Force` sailed from Surabaya to search for and attack the `Eastern Transport Fleet`.
    The transport ships were not found. However, the squadron did encounter the Japanese
    escort unit. The resulting `Battle of the Java Sea` followed on 27 and 28 February
    1942, with the `Combined Striking Force` finally defeated. With this success,
    the `IJN` controlled the waters around Java. The invasion was postponed for just
    one day.


    On the night of Saturday 28 February to Sunday 1 March 1942, the Sixteenth Army
    conducted amphibious landings on the Java coast. `Operation H` had begun. The
    `Western Landing Unit` came ashore at two landing zones in West Java. The Sixteenth
    Army HQ and the `2nd Division` landed in Area No. 1 with the main force in the
    Bay of Bantam from 0030hrs and a detachment at Merak from 0200hrs. The `Shoji
    Detachment` landed in Area No. 2 about 200km east at Eretan Wetan. The `Eastern
    Assault Force`, consisting of the `48th Division` and the `Sakaguchi Detachment`,
    landed near Kragan in East Java.


    The landing zones were far apart. This meant that the Java campaign would consist
    of widely separated operational areas. This made it difficult for the Sixteenth
    Army to direct the troops in Central and East Java in particular. To allow these
    troops to operate independently, special units and equipment were added, clear
    operational instructions were provided, and a special staff officer was posted
    to the headquarters. This control problem was exacerbated by the loss of Sixteenth
    Army communications equipment and codebooks upon landing. Without his means of
    communication, General Imamura lacked command and control over his Sixteenth Army
    during the campaign in Java.

