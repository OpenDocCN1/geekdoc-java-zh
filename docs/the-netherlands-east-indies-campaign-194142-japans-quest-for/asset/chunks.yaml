    A platoon of seven newly arrived Marmon-Herrington `CTLS-4TA` tanks was assigned
    to the Mobile Unit. The two-man 7.2-ton tank proved unsuccessful. The turret,
    which mounted a `.30-cal. Browning `M1919` machine gun, could only rotate 270
    degrees. Its armour was not resistant to machine-gun fire and the tracks were
    unreliable. Radios were not yet installed. The first three tanks in the photo
    are `CTLS-4TAY` variants with the turret on the left. The following tanks are
    `CTLS-4TAC` variants with the turret on the right. Most of the new tanks were
    not ready in time for the NEI campaign, and some were shipped to the Dutch colony
    of Surinam. This photo was taken there in 1942. (Museum Bronbeek)


    Kalidjati Airfield was located in the coastal plain at the foot of the Priangan,
    only 40km from the Bandung army base. If this operational airfield fell into Japanese
    hands, it would pose a very serious threat. The RNEI General Headquarters decided
    to concentrate its forces against the isolated and scattered Shoji Detachment.
    The operational plan provided for the reconquest of Subang and Kalidjati by deploying
    the strategic reserve (2nd Infantry Regiment and 1st Mountain Artillery Battalion)
    from the south-west on 3 March 1942. On 2 March, a reconnaissance in force by
    three infantry-heavy teams was ordered against the Japanese beachhead. Each team
    included an infantry battalion and an artillery battery, and two of the teams
    also had a squadron of motorized cavalry. The next day, these teams (De Vries
    Group, Teerink Group and Vriesman Group) had to support the main attack.


    On 1 March 1942, Java Air Command deployed the remaining Military Aviation Service
    and RAF aircraft against the transport ships and the landing site at Eretan Wetan,
    and from 2 March also against captured Kalidjati to delay the operational launch
    as much as possible. On 1 March, fighter aircraft also strafed Japanese columns
    inland. They were relatively successful in this. On 28 February, 29 bombers, 22
    fighters and ten reconnaissance aircraft were available exclusively for Reconnaissance
    Group and East Group.


    The Mobile Unit (`Mobiele Eenheid`), a tank and armoured infantry company, was
    transferred to Bandung Group. Major-General Pesman was convinced that the airfield
    was only occupied by a small Japanese advance guard. He ordered the Mobile Unit
    to retake Kalidjati Airfield. Follow-on forces would then hold the airfield. On
    2 March, in the morning, the Mobile Unit (under Captain G.J. Wulfhorst), reinforced
    with the 2nd Battery, 2nd Mountain Artillery Battalion, attacked Subang. In the
    town was the HQ of the Shoji Detachment protected by an infantry company. Although
    the Japanese were taken completely by surprise, the Mobile Unit failed to break
    through to the airfield and had to withdraw with heavy losses of men and materiel.
    During the retreat, it converged with Teerink Group, a battalion-size unit reinforced
    with 1st Battery, 2nd Mountain Artillery Battalion. Captain Wulfhorst and Major
    Teerink, however, were not aware of each other’s positions. A golden opportunity
    was lost due to a lack of coordination and communication. The three teams tasked
    with the reconnaissance in force probed the beachhead as ordered.


    The Japanese also suffered from communication problems. The 3rd Air Division did
    not begin operations over Kalidjati with most of the 27th Air Group until the
    afternoon of 2 March 1942. It flew air defence over Kalidjati and launched attacks
    against Andir Airfield at Bandung. Lieutenant-General Imamura did not hear of
    the capture of Kalidjati until 4 March.


    ![CAM364_044.jpg](img/CAM364_044.jpg)


    Brigadier Blackburn formed a brigade on 21 and 22 February 1942 from Australian
    units and troops on Java: Blackforce. This force was only equipped with small
    arms. It could, however, be supplied from stores diverted from Singapore to Batavia.
    These included vehicles, some MG carriers and a ‘considerable number’ of light
    armoured cars. Blackforce was first used for the protection of five airfields.
    On 27 February 1942, the force was relocated and concentrated on the Tjampea tea
    plantation outside Bogor. It moved on 2 March 1942 to Leuwiliang to counter the
    advancing Japanese. (Australian War Memorial)


    The battle in West Java on the southern axis was quite different. At Leuwiliang,
    the rapid advance of the Nasu Detachment was halted. There, a company support
    position was built by the Dutch on the eastern bank of the Cianten River. In the
    early hours of 2 or 3 March 1942, this was occupied by the Australian Blackforce
    under Brigadier A.S. Blackburn. After cancelling the planned counter-attack in
    West Java, Blackforce was tasked with defending the Bogor area. Based on information
    about Japanese tactics in Malaya, Blackburn organized his defence in depth. One
    company occupied the fortified position, with a second company held in reserve.
    Blackburn kept the main force back as a mobile reserve.


    The first troops in contact in Leuwiliang comprised the advanced guard of the
    Nasu Detachment, the 2nd Reconnaissance Regiment under Lieutenant-Colonel Kinichi
    Noguchi, at 1330hrs on 3 March 1942. Several attempts to cross the Cianten River
    further southwards and attack Blackforce in the flank failed. After midnight on
    4 March, Major-General Yumio Nasu, commander of 2nd Division infantry group and
    the Nasu Detachment, took control of the battle. While the 2nd Reconnaisance Regiment
    contained Blackforce to the front, the 3rd Battalion, 16th Infantry Regiment followed
    in reserve. However, this envelopment was blocked east of the river by a determined
    company from 2nd Battalion.


    The reinforced 2nd Infantry Regiment under Colonel C.G. Toop launched the delayed
    counter-attack on 3 March 1942 at 1000hrs. The advance to contact took place in
    battle formation over open ground and more than 10km on foot. (Wait, let me re-align
    with the specific flow of the provided text).


    *Correction based on provided text flow for the final paragraphs:*


    The reinforced 2nd Infantry Regiment under Colonel C.G. Toop launched the delayed
    counter-attack on 3 March 1942 at 1000hrs. (Text text says...) At 0715hrs, an
    armoured car platoon of 1st Cavalry Squadron made it to the airfield, probably
    by mistake. The advance route was not blocked and free of Japanese outposts. The
    element of surprise was, however, lost due to reconnaissance by aircraft and the
    premature appearance of 1st Cavalry Squadron. Air support was not available, because
    the main Andir Airfield at Bandung was temporarily put out of action after a major
    air attack in the morning. From 1300 to 1730hrs, the 2nd Infantry Regiment was
    subject to repeated air strikes involving bombers and fighter aircraft from the
    3rd Air Division from Kalidjati. Not only did the advance come to a halt, but
    the 2nd Infantry Regiment was also dispersed and thrown back in confusion. The
    flank attack of Group Teerink south of Subang was also spotted and suffered a
    similar fate. An attack on the landing site at Eretan Wetan by Vriesman Group
    was also repelled by the Japanese with the support of naval gun fire.


    ![CAM364_047.jpg](img/CAM364_047.jpg)


    On 3 March 1942, the IJA 3rd Air Division bombed and strafed the attacking columns
    of the NEI 2nd Infantry Regiment (reinforced) for four hours in six missions with
    27 aircraft. The NEI infantry had left the vehicles east of Sadang on the Sadang–Kalidjati–Subang
    road around 1000hrs and advanced through the terrain. The disembarked troops and
    vehicles were continuously bombed from the air in the afternoon. This meant the
    end of any hope of recapturing Kalidjati Airfield. This grainy photograph was
    probably taken on the aforementioned road. Two trucks and a bus can be made out
    among the wreckage, along with a Japanese soldier at centre. (Public domain)


    ![CAM364_046.jpg](img/CAM364_046.jpg)

