    一个由七辆新抵达的 Marmon-Herrington `CTLS-4TA` 坦克组成的排被分配给机动部队。这种双人 7.2 吨坦克被证明是失败的。炮塔安装有
    .30 口径的勃勃宁 `M1919` 机枪，只能旋转 270 度。其装甲无法抵抗机枪火力，坦克不可靠。尚未安装无线电。照片中的前三辆坦克是 `CTLS-4TAY`
    变体，炮塔位于左侧。后续坦克是 `CTLS-4TAC` 变体，炮塔位于右侧。大多数新坦克未能及时投入荷属东印度（NEI）战役，其中一些被运往了荷兰殖民地苏里南。这张照片是
    1942 年在那里拍摄的（Bronbeek 博物馆）。


    卡里达加蒂（Kalidjati）机场位于普里让山脚下的沿海平原，距离万隆陆军基地仅 40 公里。如果这个战用机场落入日本人手中，将构成非常严重的威胁。荷兰荷属东印度总司令（RNEI
    HQ）决定集中力量对付孤立分散的庄司支队（Shoji Detachment）。作战计划规定 1942 年 3 月 3 日从南部部署战略预备队（第 2 步兵团和第
    1 山地炮营），重新夺回苏邦和卡里达加蒂。3 月 2 日，命令三个以步兵为主的小组对日本人的滩头堡进行强力侦察。每个小组包括一个步兵营和一个炮兵连，其中两个小组还配备了一个机化骑兵队。第二天，这些小组（De
    Vries 小组、Teerink 小组和 Vriesman 小组）必须支持主攻。


    1942 年 3 月 1 日，爪哇航空司令部部署剩余的军事航空队和皇家空军（RAF）飞机攻击埃雷塔万丹（Eretan Wetan）的运输船和登陆点，并从 3
    月 2 日起也针对被占的卡里达加蒂，以尽可能推迟作战的启动。3 月 1 日，战斗机还对内陆的日本纵队进行了扫射，在这方面取得了相对成功。2 月 28 日，有
    29 架轰炸机、22 架战斗机和 10 架侦察机专门供侦察小组和东部小组使用。


    机动部队（`Mobiele Eenheid`）是一个坦克和装甲步兵连，被转移到万隆小组。Pesman 少将坚信该机场仅被一小队日本先遣队占据。他命令机动部队夺回卡里达加蒂机场。随后后续部队将守住机场。3
    月 2 日晨，机动部队（在 G.J. Wulfhorst 上尉指挥下）在第 2 山地炮营第 2 连的增援下，进攻了苏邦。镇上有庄司支队的司令部，由一个步兵连保护。尽管日本人完全出乎其意料，但机动部队未能突破到达机场，在人员和物资遭受重损失后不得不撤退。撤退期间，他们与由第
    2 山地炮营第 1 连增援的营级单位——Teerink 小组会合。然而，Wulfhorst 上尉和 Teerink 少将并不知道对方的位置。由于缺乏协调和通信，失去了一个黄金机会。受命进行强力侦察的三个小组按命令探测了滩头。


    日本人也面临着通信问题。第 27 航空团的大部分兵力直到 1942 年 3 月 2 日下午才开始在卡里达加蒂上方行动。它对卡里达加蒂进行防空，并对万隆的安迪机场发动进攻。Imamura
    中将直到 3 月 4 日听到卡里达加蒂被占的消息。


    ![CAM364_044.jpg](img/CAM364_044.jpg)


    Blackburn 准将于 1942 年 2 月 21 日至 22 日由爪哇上的澳大利亚部队和士兵组成了一个旅团：黑力部队。这支部队仅装备了轻武器。但它可以从从新加坡调往巴达维（Batavia）的物资中获得供应。这包括车辆、一些机枪载具和“大量”轻型装甲车。黑力部队首次用于保护五个机场。1942
    年 2 月 27 日，该部队转移并集中在博哥尔外的詹姆佩亚（Tjampea）茶园。他们于 1942 年 3 月 2 日移动到勒乌利亚昂（Leuwiliang），以对抗进军的日本人。（澳大利亚战争纪念馆）


    爪哇西部南部轴线的战斗完全不同。在勒乌利亚昂，纳津支队（Nasu Detachment）的快速推进被停止。在那里，荷兰人在齐安河（Cianten River）东岸建立了一个连级支援位置。1942
    年 3 月 2 日或 3 日凌晨，这里由 A.S. Blackburn 准将指挥的澳大利亚黑力部队占据。在取消了计划中的爪哇西部反击后，黑力部队被赋予守卫博哥地区的任务。根据关于日本人在马来亚战术的信息，Blackburn
    组织了深度防御。一个营占据要要位置，另一个营留守。Blackburn 将主力作为作为机动预备队留在后。


    勒乌利亚昂接触的第一批部队是 1942 年 3 月 3 日 13:30 纳津支队的先遣队——由野口宪一（Kinichi Noguchi）中校指挥的第 2 侦察团。随后几次尝试向南跨越齐安河并从侧翼攻击黑力部队的尝试均告失败。3
    月 4 日午夜后，第 2 师步兵群和纳津支队司令官纳津优雄（Yumio Nasu）将接管了战斗。当第 2 侦察团在正面牵制黑力部队时，第 16 步兵团第 3
    营作为预备队随后进入。然而，这种包围在河东被第 2 营的一个勇敢连阻挡。


    由 C.G. Toop 上校指挥的增援第 2 步兵团于 1942 年 3 月 3 日 10:00 发起了延迟反击。


    *根据提供的文本流对最后几段进行修正：*


    由 C.G. Toop 上校指挥的增援第 2 步兵团于 1942 年 3 月 3 日 10:00 发起了延迟反击。（原文显示……）在 07:15，第 1 骑兵队的一个装甲车排到达了机场，可能是由于失误。推进路线没有被封锁，且没有日本人的哨所。然而，由于飞机的侦察和第
    1 骑兵队过早出现，惊喜元素消失了。由于没有获得空中支持，因为万隆的主安迪机场在早晨遭受重大空袭后暂时失去了作用。从 13:00 到 17:30，第 2 步兵团遭受了来自卡里达加蒂的第
    3 航空团轰炸机和战斗机的反复打击。进展不仅停滞了，第 2 步兵团还溃散并混乱地撤退。苏邦南方 Teerink 小组的侧翼攻击也被发现并遭遇了类似的命运。Vriesman
    小组对埃雷塔万丹登陆点的攻击在日本人海军舰火的支持下也被击退了。


    ![CAM364_047.jpg](img/CAM364_047.jpg)


    1942 年 3 月 3 日，日陆军第 3 航空团派出 27 架飞机在六次任务中，对荷印第 2 步兵团（增援）的进攻纵队进行了持续 4 小时的轰炸和扫射。荷印步兵于
    10:00 左右在沙当—卡里达加蒂—苏邦路的沙当东部离开了车辆，并通过地形推进。下地的部队和车辆在下午遭了持续的空中轰炸。这意味着夺回卡里达加蒂机场的希望彻底破灭。这张模糊的照片可能就是在上述道路上拍摄的。在残骸中可以看到两辆卡车和一辆公共汽车，中心一名日本士兵。（公有）


