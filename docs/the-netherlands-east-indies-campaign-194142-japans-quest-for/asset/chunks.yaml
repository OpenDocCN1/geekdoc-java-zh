    destroyed bridges. Deep rivers and high banks in combination with swollen rivers
    after heavy rainfall made bridge restoration difficult. The detachment did not
    reach the Ciujung River until 3 March 1942.


    ![CAM364_041.jpg](img/CAM364_041.jpg)


    Kalidjati Airfield was one of the main Military Aviation Service operating bases.
    In February 1942, ABDA-AIR allocated two squadrons to Kalidjati: No. 84 (Bomber)
    Squadron RAF and No. 1 (General Reconnaissance) Squadron RAAF. The Dutch 1st Aircraft
    Group also operated from the airfield. Ground-based air defence was provided by
    49th Battery, 48th Light Anti-Aircraft Regiment (RA) and units from 3rd Anti-Aircraft
    Battalion. On the morning of the Japanese landing, the RNEI Army 3rd Company,
    2nd Infantry Battalion was relieved by 12th Battery, 6th Heavy Anti-Aircraft Regiment
    (RA) deployed in a ground-defence roll. The Australian and NEI air units managed
    to evacuate the airfield in time. The British, however, were too slow. This photo
    of the airfield was taken between 1930 and 1932\. By 1942, the airfield had been
    extended to include two runways west of the lake at the bottom of the picture.
    To the right lies the road to Subang, the direction from which the Japanese approached
    the airfield. (Leiden University Libraries, KITLV 49427)


    For West Group’s commander, Major-General Schilling, the landings in Bantam Bay
    certainly came as no surprise. However, the Japanese advance along the southern
    route was considerably faster than expected. The two roads from Serang to Jakarta
    and Bogor diverged. An advance along both routes would only increase the distance
    between the enemy axes of advance. The rapid Japanese southern advance further
    increased the distance. According to Schilling, this offered an opportunity to
    achieve a limited success. He decided to concentrate his force against this southern
    axis of advance. However, because of developments at Kalidjati, he had to cancel
    his counter-attack.


    The Shoji Detachment was landed from seven transport ships under cover of a light
    cruiser and four destroyers at Eretan Wetan between 0330 and 0430hrs on 1 March
    1942\. Instead of using infantry to secure the beachhead, Shoji immediately put
    the tanks and trucks ashore. The Wakamatsu Raiding Unit – 2nd Battalion, 230th
    Infantry Regiment with the 1st Company, 4th Tank Regiment (less elements, comprising
    ten Type 95 Ha-Go light tanks) and with the transport company attached – landed
    and immediately rushed towards Kalidjati. The Egashira Raiding Unit (1st Battalion,
    230th Infantry Regiment) was assigned the seizure of the bridge over the Citarum
    River. The Ono Unit had to secure the landing zone and served as a reserve for
    the detachment. Even before landing, Allied planes attacked the convoy, but without
    success. In the morning, more air raids followed on the landing beach and on the
    ships. The Japanese losses amounted to about 100 men. The air cover, in the form
    of four seaplanes from the auxiliary seaplane tenders *Sanyo Maru* and *Kamikawa
    Maru*, was driven off.


    En route to the airfield, Wakamatsu dealt with several small NEI Country Guards
    surveillance detachments, Home Guard troops and an improvised roadblock east of
    Kalidjati manned by a regular infantry platoon. The way was clear. The airfield
    garrison at Kalidjati was caught off-guard. That same morning, the ground defence
    had been taken over by 12th Battery, 6th Heavy Anti-Aircraft Regiment. This unit
    had lost its anti-aircraft guns in South Sumatra and was deployed as infantry
    for airfield defence. By 1230hrs, the intact airfield was in Japanese hands. In
    addition, of the remaining RAF and RAAF bomber fleet of 33 aircraft, 26 (including
    the last eight serviceable Blenheims) were lost. The airfield had been kept operational
    for as long as possible. On 28 February 1942, Java Air Command took evacuation
    and destruction measures. However, these were not yet implemented.


    ![CAM364_042.jpg](img/CAM364_042.jpg)


    A Vickers-Carden-Loyd Light Tank Model 1936\. This two-man tank weighed 3.8 tons,
    had a maximum armour thickness of 9mm and was armed with a Vickers .303 machine
    gun in the turret. This photo dates from before the NEI mobilization. After the
    outbreak of war, an orange triangle with a black border was painted on the turret,
    pointing downwards. On the side, the unit code ‘QC’ (15cm tall) of the NEI Mobile
    Unit was applied in white paint. (Netherlands Institute of Military History)


