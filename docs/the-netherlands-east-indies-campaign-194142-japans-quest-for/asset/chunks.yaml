- fmt: "\nIn February 1942, an ad hoc infantry brigade was formed from Australian\
    \ units and stragglers in Java: `Blackforce`. Brigadier `A.S. Blackburn` reorganized\
    \ three infantry battalions and a supply company (approximately 2,800 men), reinforced\
    \ with two batteries of the `US 2nd Battalion, 131st Field Artillery Regiment`\
    \ and the British `B Squadron, 3rd King’s Own Hussars` with 16 `Vickers-Armstrongs\
    \ Mk VI` light tanks. The battalions had only light infantry armament, with three\
    \ mortars with limited ammunition stocks, and some anti-tank rifles. `Blackforce`\
    \ lacked anti-tank guns and anti-tank mines, and a field ambulance was also missing.\
    \ In contrast, a British signals platoon was added. The core of this unit had\
    \ gained combat experience in Syria.\n\nGreat Britain did not contribute forces\
    \ until shortly before the fall of Singapore. The British forces in the Netherlands\
    \ East Indies were mostly not reinforcements but troops withdrawn from Malaya.\
    \ As a result of the Japanese advance through Malaya and air raids at airfields\
    \ around Singapore, the `RAF` and `RAAF` squadrons were withdrawn to Sumatra and\
    \ Java from 16 January 1942. British anti-aircraft artillery was deployed for\
    \ ground-based air defence.\n\nAfter the loss of South Sumatra, the remaining\
    \ British forces were reorganized on Java. They consisted of `RAF` and `RAAF`\
    \ squadrons as part of `West Group` or `BRITAIR` and `Recc Group`, the British\
    \ `16th Anti-Aircraft Brigade` and `B Squadron, 3rd King’s Own Hussars`. Four\
    \ `Air Ministry Experimental Station (AMES)` units with radar installations were\
    \ operational at the end of February. In the second half of February, the Royal\
    \ Navy contributed to the Combined Striking Force.\n\nThe United States provided\
    \ the `USAAF’s Far East Air Force (FEAF)` and the `Asiatic Fleet` evacuated from\
    \ the Philippines. The `FEAF` was first withdrawn to Darwin, northern Australia,\
    \ but later in December deployed to East Java. The `FEAF` in Java would eventually\
    \ consist of `5th Bomber Command` and `Interceptor Command` equipped with modern\
    \ aircraft. `Interceptor Command` deployed for the air defence of East Java.\n\
    \nShips from the `Asiatic Fleet` participated with success in the maritime defence\
    \ of the archipelago. On 23 and 24 December 1941, `Patrol Wing 10` was withdrawn\
    \ from the Philippines with eight `Catalina US Navy` flying boats relocated to\
    \ Halong, Ambon.\n\nOn 11 January 1942, the `HQ 26th Field Artillery Brigade`\
    \ and `2nd Battalion, 131st Field Artillery Regiment` arrived in Surabaya from\
