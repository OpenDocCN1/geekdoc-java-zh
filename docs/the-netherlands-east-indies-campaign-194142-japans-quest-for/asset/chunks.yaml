    The 1927 Principles of Defence were particularly flawed regarding the threat assessment
    and the eventual dependence on foreign (viz. British and American) support. The
    support from a supposed alliance lay beyond the Netherlands’ control. The Washington
    Conference of 1921–22 was said to have relaxed tensions in the Pacific. According
    to the `RNEI Army`, nothing could be further from the truth. The agreed partial
    ban on the construction of maritime bases and the development of the naval base
    in Singapore had only increased the strategic importance of the Netherlands East
    Indies. However, preservation of the NEI was a priority for neither Great Britain
    nor the United States. Firstly, Britain’s priorities lay in the Far East with
    India and Singapore. Secondly, Britain lacked the required resources. Due to the
    war in Europe, it was unable to send a significant naval force to Singapore. With
    that, the cornerstone of British defence in the Far East was removed. Britain’s
    position was so weak that, according to the historian H.P. Willmott, ‘the British
    regarded the Dutch not so much as a weak ally facing a common threat, an ally
    that should be helped, but as a force of support that could be tapped in an effort
    to buttress Britain’s own position’ (1982, p. 121). On the list of priorities
    of the United States were Pearl Harbor, Australia, the Philippines and keeping
    nationalist China at war. For both these allies, Australia was essential for the
    reconquest of South-East Asia. Ultimately, the Netherlands East Indies was left
    to fend for itself.


    ![9781472843524_Map003.jpg](img/9781472843524_Map003.jpg)


    ## RNEI Army locations


    The `RNEI Army` leadership disagreed with the underlying assumption of the 1927
    Principles of Defence. In the event of a war in the Pacific, the `RNEI Army` expected
    to face a targeted attack of conquest against Java, on account of its naval base
    and oil sites. Given the size of the archipelago and the available resources,
    the `RNEI Army` leadership opted for the territorial defence of:


    1. Java with the seat of government, naval base and key army and navy institutions;

    2. Naval and aircraft support centres in the Outer Regions;

    3. The major areas involved in the extraction of strategic raw materials.


    The `RNEI Army` developed an operational doctrine of indirect coastal defence
    in breadth and depth using horizontal bombers. The air arm was the first line
    of defence, seeking to prevent an enemy transport fleet from reaching Java. The
    navy formed the second line of defence, and the army the third. The bombers were
    intended to attack transport ships ferrying landing troops, not Japanese warships.
    ‘Only landing troops can occupy a support point in our Archipelago. Warships never!
    … A warship is fought with a warship, not an airplane.’[10](#9781472843531-7.xhtml_footnote-010)
    This demonstrates that the full potential of the air arm had yet to be realized.


    The required airfields were constructed in the Outer Regions. These airfields
    formed three lines of resistance. The outer one ran from Sabang and Medan in Sumatra
    over Tarakan in Borneo and Langoan (Menado) in Sulawesi to Babo in Western New
    Guinea. The second line was formed by the airfields `Pakan Baroe` on Sumatra,
    `Singkawang II` and `Samarinda II` on Borneo, `Kendari II` on Sulawesi, `Ambon
    II` and ending at Kupang on Timor. `Palembang I Airfield` in Sumatra, the airfields
    in Java and `Den Pasar` in Bali formed a final resistance line. In peacetime,
    the aircraft groups were stationed in Java. Allocation of aircraft to the Outer
    Regions was temporary and on a secondment basis.


    The Royal Netherlands Navy considered the new role of the Military Aviation Service
    to be in contradiction with the 1927 principles. It pointed to the risk that the
    airfields could be captured by the enemy and used for an attack on Java. The `RNEI
    Army` planned to reduce this risk by constructing the airfields inland and not
    on the coast, and by preparing for their destruction if need be. Some of the airfields
    were constructed in secret. For a long time, the Japanese were unaware of the
    existence of `Singkawang II`, `Samarinda II` and `Palembang II` airfields. However,
    the navy would be proved correct.


    After 1940, the primary task of a number of detachments in the Outer Regions became
    the defence of the airfields and/or oil ports and oil installations. Maintaining
    order and peace became a secondary priority. Numerous detachments were disbanded
    or downsized. The direct defence of airfields was organized in a uniform manner
    following the 1941 mobilization. This comprised two to three pillboxes with machine
    guns for covering the airfield and light machine guns to counter air targets;
    three armoured personel carriers (`overvalwagen`) with light machine guns; and
    three to four infantry brigades (each comprising a section of 15 men). The airfields
    were to serve as final redoubts. In 1935, field battalions, albeit with modified
    organizations and armaments, were transferred from Java to the oil island of Tarakan
    (`7th Infantry Battalion`) and the oil port of Balikpapan (`6th Infantry Battalion`).
    If called for, these key sites were to be destroyed to prevent them falling into
    an attacker’s hands. Following that, the infantry were to engage in guerrilla
    warfare. The numerous small, scattered and isolated garrisons had no chance of
    outside help. They would be bypassed or overwhelmed by superior Japanese forces.


    ![../CAM364_018](img/CAM364_018.jpg)


    The `RNEI Army` Chief of the General Staff, Colonel R. Bakkers, seated at his
    desk in the War Department in December 1941, with from left to right Lieutenant-Colonel
    W.P. van Veen, Deputy, and Lieutenant-Colonel P.G. Mantel, Head of Section III
    (Defence). Colonel Bakkers was promoted to major-general on 19 February 1942.
    For office work, following the mobilization, the white undress uniform was replaced
    with the grey-green field uniform. (Museum Bronbeek)


    In accordance with the 1927 Principles of Defence, in 1935 the `RNEI Army` planned
    to concentrate most of the field army on Java following the outbreak of war, in
    order to defend Surabaya naval base in the east of the island. However, in 1941,
    the `RNEI Army` decided against this. The manner of warfare in 1939 and 1940 in
    Europe led the `RNEI Army` command to conclude that ‘rapid operations should be
    reckoned with, carried out in several places simultaneously, whereby one (or more)
    point(s) chosen by the opponent is being pushed through powerfully and quickly
    with the help of motorized and mechanized forces’. The Java Army therefore had
    to consist of rapidly deployable units in West, Central and East Java to execute
    quick, decisive counter-actions. This required extensive motorization and mechanization
    of the field army. Secondly, significant reinforcement of territorial forces on
    the coast and inland was deemed necessary for security.


    The `RNEI Army` army command identified three key locations in the defence of
    Java:


    1. The army and navy operating bases, namely Bandung and Surabaya;

    2. The capital and seat of government Jakarta, and the port of Tanjung Priok;

    3. Cilacap, the main port on the south coast.

