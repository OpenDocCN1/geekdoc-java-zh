- fmt: '

    Kragan was an ideal landing point with a 35km-long beach and major connecting
    roads in the proximity. The vanguard of the Sakaguchi Detachment, the Kanauji
    Echelon, set foot ashore 6km south-east of Kragan on `1 March 1942` at `0700hrs`.
    The other two units, the Matsumoto and Yamamoto echelons, did not land until the
    following day. Their transport ship was slow because it had been damaged during
    the invasion of Bali. The Sakaguchi Detachment (less the Kume Detachment left
    on Borneo) consisted of the 2nd and 3rd Infantry battalions, 146th Infantry Regiment,
    two field artillery batteries, an armoured car unit and `2nd Transport Company`
    with `259th Independent Transport Company` attached. `Sakaguchi’s objective was
    the southern port city of Cilacap, the capture of which would cut off the escape
    route from Jakarta and Bandung. In the second phase, it would mop up remaining
    enemy units in Central Java.


    The RNEI Army’s 2nd Division, based in Central Java, under Major-General P.A.
    Cox, was reduced on `22 February 1942` by the relocation to West Java of `4th
    Infantry Regiment`. South Group, two motorized cavalry squadrons (4th Cavalry
    Squadron and Life Guards Cavalry Squadron) and the `Cilacap Detachment` remained.
    South Group was a weak infantry regiment formed in January 1942 by merging three
    understrengh and underarmed infantry battalions and a newly formed machine-gun
    company of mostly semi-trained Indonesian part-time auxiliary soldiers. The unit
    was almost fully motorized. South Group was tasked with ‘security and protection
    [of Cilacap port] by positioning itself behind the Serayu River’. On `2 March
    1942`, Major-General Cox had to give up his best battalion, the Left-Half 21st
    Infantry Battalion, to Bandung Group.


    ## JAPANESE BREAKTHROUGH AT CIATER PASS, 5–7 MARCH 1942


    After the successful Japanese amphibious landings on the island of Java, Kalidjati
    Airfield was captured the same morning intact. Repeated NEI counter-attacks were
    repulsed. On `5 March`, the Shoji Detachment attacked the Ciater position from
    Subang with one infantry battalion and ample air support from the `3rd Air Division`.
    The Ciater position north of the city of Bandung was defended by Group Bandung
    with a single reinforced infantry company. After the main defensive line was breached,
    rushed-in NEI reinforcements tried to halt the Japanese advance. Once these forces
    were also eliminated, the road to Bandung lay open.


    Note gridlines are shown at intervals of 1km (0.62 miles)


    ![CAM364_BEV003.jpg](img/CAM364_BEV003.jpg)


    ### JAPANESE


    #### Shoji Detachment (Shoji Butai)


    **A.** 2nd Battalion, 230th Infantry Regiment (Wakamatsu)


    **B.** 1st Battalion, 230th Infantry Regiment (Egashira)


    ### NEI


    #### Group Bandung


    **1.** 2nd Company, 1st Infantry Battalion

    **2.** 1st Company, 5th Infantry Battalion

    **3.** 2nd Company, 2nd Infantry Battalion

    **4.** Left-Half 21st Infantry Battalion

    **5.** 2nd and 3rd batteries, 2nd Mountain Artillery Battalion

    **6.** Advanced dressing station

    **7.** Detachment Paardekooper (Detachment Van Altena)

    **8.** Detachment Siahaya (Detachment Van Altena)

    **9.** Armoured Infantry Company (from the Mobile Unit)

    **10.** West Coast of Sumatra Detachment (two companies)

    **11.** 4th Infantry Battalion

    **12.** 9th Infantry Battalion

    **13.** 15th Infantry Battalion

    **14.** Battalion De Vries

    **15.** 1st Battery, 2nd Mountain Artillery Battalion


    ![image](img/common.jpg)


    ## EVENTS


    Times are given in Java Time (JBBT – UTC+07:30) unless otherwise stated.


    #### Thursday, 5 March 1942


    **1.** `1600hrs (JST)`: Japanese 2nd Battalion, 230th Infantry Regiment (Wakamatsu)
    consisting of three companies supported by 1st Company, 4th Tank Regiment and
    two batteries from the 3rd Battalion, 38th Mountain Artillery Regiment advance
    along the Subang–Lembang road and unexpectedly encounter the Ciater position.
    The battalion deploys and is ordered to attack. The position on the ridge is defended
    by the (European) reinforced 2nd Company, 1st Infantry Battalion with 3rd Battery,
    2nd Mountain Artillery Battalion in support. Making use of the rugged terrain
    and the trees hindering the field of fire from the pillboxes, ground mist and
    a heavy shower, the Japanese manage to break through the position. In the evening,
    the Japanese advance halts. The troops do not withdraw, but remain overnight in
    the field.


    **2.** `1630hrs`: NEI forces conduct reconnaissance using six armoured cars on
    the Subang–Lembang road. Three armoured cars are put out of action.


    **3.** By nightfall, NEI reinforcements arrive, but 2nd Company, 1st Infantry
    Battalion pulls back. Colonel De Veer, CO 4th Infantry Regiment and in command
    off the Ciater defence, organizes a defence in-depth. During the night, the Japanese
    send out patrols.


    #### Friday, 6 March 1942


    **4.** In the early morning, the Japanese infantry suddenly attack the left flank
    of 2nd Company, 2nd Infantry Battalion and 1st Company, 5th Infantry Battalion.
    The assault party, followed by a second one, forms directly from the road. The
    Japanese assault (Wakamatsu) supported by three tanks is stopped with heavy losses.
    The NEI are forced to retreat. At the beginning of the fight, Left-Half 21st Infantry
    Battalion is mostly broken and withdraws. The Ciater position and De Veer’s first
    line is broken. Wakamatsu does not immediately pursue the NEI troops, but consolidates
    his position. During the day, aircraft of the Japanese 3rd Air Division bomb and
    strafe the NEI positions and lines of communication


    **5.** Colonel De Veer moves his second line back to the triple junction. At `1700hrs`,
    the long-awaited Japanese attack materializes. De Veer orders a counter-attack,
    and is killed in action. The Japanese attack is repulsed. An all-round defence
    at Tolhek is set up. In the afternoon, or early morning of 7 March, the Japanese
    execute 74 NEI prisoners.


    #### Saturday, 7 March 1942


    **6.** `0200hrs`: The defenders at Tolhek commanded by Captain Paardekooper are
    ordered to withdraw to Lembang.


    **7.** Group Bandung orders Lieutenant-Colonel Van Altena to form a new line of
    defence north of Lembang with three depleted battalions of the 2nd Infantry Regiment,
    4th Infantry Battalion and West Coast of Sumatra Detachment. However, almost all
    units are showing signs of fatigue and lack cohesion.


    **8.** `1300hrs (JST)`: The Japanese 2nd Battalion (Wakamatsu) starts its advance
    west of the main road. The advance along a footpath and rough terrain is naturally
    slow. Using the onset of darkness and persistent rainfall, his advance units attack
    and surprise the HQ of 9th Infantry Battalion west of Lembang and break up the
    spread-out NEI battalion. The 3rd Air Division continues its air interdiction


    **9.** The Japanese 1st Battalion (Egashira), brought from Krawang by motor transport,
    follows along the main road slightly after. Around `1600hrs`, it probes the spread-out
    positions of the NEI 4th Infantry Battalion north of Lembang.


    **10.** After the first Japanese attack, the NEI 4th Infantry Battalion retreats
    in an orderly manner towards Bandung. The Japanese 2nd Battalion enters Lembang
    in the evening. Major-General Pesman, CO Group Bandung, dispatches an officer
    to negotiate a local surrender.


    The remaining units of the 2nd Division consisted of Home Guard, Town and Rural
    Guards and Veteran Reserve Corps elements with a low combat value. These were
    tasked with offering resistance on the outskirts of the built-up areas of Surakarta,
    Yogyakarta, Semarang and Magelang, without this developing into sustained fighting,
    and then surrendering. The aim was to slow the Japanese advance. The roads running
    from the north coast to the south coast had their bridges destroyed and were partly
    blocked with felled trees.

