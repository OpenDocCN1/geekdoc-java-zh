  trans: '

    航空队在 1936 年由两个侦察中队和一个兵力为 18 架飞机的战斗机中队改为军事航空队，拥有七个中型轰炸机中队、四个战斗机中队和两个侦察中队。它拥有 95
    架轰炸机、99 架战斗机、34 架侦机和其他 155 架飞机。1936 年至 1939 年间购买的中型水平`Glenn Martin B-10/139 WH`轰炸机在当时是先进的，但在
    1941 年被认为过时。`WH-3`和`WH-3A`（61 架）飞机仍具有相当可的性能，但其装甲和防御武器面对日本战斗机的攻击时过于薄弱。相反，订购了 162
    架`North American B-25C-5-NA Mitchell`中型轰炸机。这些飞机于 1942 年 2 月交付——此时已太晚无法加入战斗。荷兰荷民印度军（RNEI
    Army）的主战机`Brewster B-339D`（63 架）性能完全不逊于日本陆军（IJA）战斗机`Nakajima Ki-43-Ia`（隼）。然而，日本海军（IJN）的战斗机`Mitsubishi
    A6M2`（零式）火力更大并配备曳弹。


    除了部分过时的装备外，缺乏经过训练（技术）人员是荷兰荷民印度军航空队的第二个弱点。例如，战斗机员没有正式的战斗训练。这是由于缺乏经验丰富的教员以及缺乏有效的战斗战术。


    对空军的优先考虑导致了军队装备现代化的滞后。重点在于增加火力和机动性。前者通过进口倾射武器、反坦克和防空武器以及机手枪来增加。通过购买吉普车、卡车和装甲车增加了机动性。部分车辆是动员时征用的民用车辆。荷兰荷民印度军也引入了坦克（`vechtwagens`）。1939
    年，下订单供应了 118 辆`Vickers-Carden-Loyd`轻坦克和指挥坦克。当英国在 1940 年封锁大部分坦克的供应时，在美国的`Marmon-Herrington
    Company`找到了替代供应商。从那里总共订购了 653 辆坦克。1942 年初该订单仅了少数坦克。由于新武器装备的涌入，荷兰荷民印度军在 1936 年至
    1942 年间处于永久的重组状态。


    ![CAM364_016.jpg](img/CAM364_016.jpg)


    1937 年，荷兰荷民印度军骑兵收到了 12 辆`Alvis-Straussler AC3D`装甲车。`Alvis-Straussler`配备四人，由 5–10
    毫米装甲保护。其武器包括座塔上的 12.7mm`Colt-Browning`机枪、驾驶员配备的 6.5mm`Vickers`机枪以及车内的另一把 6.5mm`Vickers`机枪。由这
    12 辆装甲车组成了四个排。1941 年，这些排被分配到四个摩托化中队。（Beeldbank WW2 – NIOD）


    在人员兵力和武器装备方面，荷兰荷民印度军的一个步兵团在大多数方面都可以与其日本对手相提。然而，荷兰荷民印度军在榴弹发射器以及营级和团级 artillery
    方面明显弱得多（参见表 3）。荷兰荷民印度军和日本陆军炮兵团的实力差别并不大。一个荷兰荷民印度机炮兵团配备了 24 门 7.5 厘米炮和 12 门 10.5
    厘米榴臼。一个日本炮兵团有 36 门 7.5 厘米炮。至于坦克，日本方面明显占据优势。在爪哇岛，他们部署了 91 辆中型和轻型坦克，而同盟军仅有 40 辆轻坦克，其中包括荷兰荷民印度军的
    7 辆`Marmon-Herrington CTLS-4TA`坦克和 17 辆`Vickers-Carden-Loyd M1936`轻坦克，以及英国军的 16
    辆`Vickers-Armstrong Mk VIB`轻坦克。


    ![table_p20.jpg](img/table_p20.jpg)


    1927 年，荷兰皇家海军在荷兰荷民印度建立了一个至少两艘巡洋舰、八艘驱逐舰和 12 艘潜艇的实力。用战列舰、战巡或重巡洋舰加强舰队的计划在海军内部引发了激烈讨论。并没有共识。1938
    年，提交了一份建造三艘战巡等在舰队计划，但未实施。1941 年，荷兰荷民印度存在以下船只：两艘轻巡洋舰、一个驱逐队长、七艘驱逐舰和 15 艘潜艇。海军航空（`Marine
    Luchtvaart Dienst`）拥有 59 架飞艇（`Dornier Do24K`和`Consolidated PBY Catalina`）和八架战术侦察机。


    ![CAM364_017.jpg](img/CAM364_017.jpg)


    五名处于射击位置的重武装荷民印度士兵。右上角是一个机枪小组，由射手和助手组成，操作着短管 06.5mm`Madsen M15`步兵机枪（`karijnmitilleur`）。前景的两名士兵配备了
    9mm`Schmeisser MP28/II`（KNIL M39`）冲锋枪。右上角的士兵戴着防毒面具。（Beeldbank WW2 – NIOD）


    荷兰荷民印度群对外敌的防御存在结构性弱点。1930 年，6000 万当地人口在政治、行政和经济上由 24 万欧洲人支配。1940 年 5 月由于荷兰的支持，欧洲人的地位被削弱。美国作战司令长哈尔德·R·斯塔在
    1940 年 11 月 12 日的备录中表示：“这种局势不能被视为稳定的。统治者没有母国或盟友的支持。土著叛乱过去发生过，未来可能再次发生。”一位退役校在
    1940 年 7 月 23 日的荷兰荷民印度报纸上表示，“大多数人口，尤其是爪哇岛的，可以被认为是完全忠诚并依附现有当局的，正如它现在被建立和组织的那样。”这种观点被证明是*执念*。荷兰殖民国家及其军队本质上是一支缺乏内部社会支持的占领军。在较大范围内，其他地区以及爪哇岛，殖民统治的崩溃导致了严重的抢劫和纵火，印尼人趁机而动。


    ### 盟友


    正如 1941 年 2 月英-荷-澳参谋会议达成的共识并记录在 1941 年 11 月 12 日的《海军空军部署计划》（`PLENAPS`）中一样，战争爆发后澳大利亚向荷兰荷民印度的望汶岛和提汶岛派遣了航空部队。澳大利亚皇家空军第
    13 中队在望汶岛和布鲁岛的纳姆莱部署了轻型轰炸机和岸基侦察机。在提汶岛的 Penfoei 机场驻扎了皇家空军第 2 中队的一个飞行队。出于安全考虑，由澳大利亚第
    8 师第 23 步兵旅组成了三个营级战斗群：拉克部队（负责拉巴尔、新不列丹岛）、鸥部队（负责望汶岛）和雀雀部队（负责提汶岛）。通过这些部队，澳大利亚形成了一条“前哨观察线”。


    这些澳大利亚部队是全自愿第二澳大利亚帝国军（`2nd AIF`）的一部分。在荷兰荷民印度的部署中，他们缺乏重武器。此外，他们既没有经过丛林战的训练，也没有相应的装备。士兵穿着短裤，这在热带条件下植被茂密的地形中是不适的。膝盖和腿部的擦伤会导致热带溃。疟疾预防几乎无从谈起。结果是病率极高，战斗力下降。与当地荷兰荷民印度军指挥的指挥关系不尽如人意。

