    # Military Leadership


    In this photo, Major-General W. Schilling is still a colonel. His appointment
    as major-general followed on 30 April 1941. The 52-year-old Schilling was commander
    of the 1st Division/West Group. He was seen as a competent officer, but he missed
    several promotions. His name was mentioned as a potential successor to Ter Poorten
    as chief of the general staff. However, this position passed him by. Schilling
    declined the offer to lead the counter-attack at Kalidjati–Subang. After the withdrawal
    from the Priangan Plateau in March 1942, he was the intended commander of the
    combined West Group and Bandung Group. After his release from captivity in 1945,
    Schilling was a candidate for army commander, but again was not selected. Instead,
    he became head of the Netherlands Military Mission in Japan with the rank of lieutenant-general.
    In 1949, he was given an honourable discharge and returned to the Netherlands.
    (Museum Bronbeek)


    Ter Poorten went into captivity alongside the governor general. He was liberated
    on 17 August 1945, in Mukden, China. He felt that he had been made a scapegoat
    for the defeat of the RNEI Army and the loss of the Netherlands East Indies. Nevertheless,
    he received an honourable discharge. Ter Poorten died in the Netherlands in 1968.


    ## Major-General Rudolph Bakkers


    **Major-General Rudolph Bakkers (1894–1967)**, the son of a European father and
    an Indonesian mother, became chief of the general staff of the RNEI Army on 27
    October 1941. Bakkers became an officer in 1914. Between 1922 and 1925 he attended
    war studies at the Staff College. He also taught at this institute from 1933 to
    1936. As an Indo-European, he forged a brilliant career in a racist colonial society.
    However, he also experienced discrimination. For example, he was not welcomed
    into the daily discussions of ABDACOM in lieu of the Army Commander; instead,
    a chief staff officer was sent.


    The 47-year-old Bakkers was described as a ‘very high-quality person and tender-hearted’.
    The latter may have hindered him in taking tough decisions. The death of his wife
    shortly before the outbreak of war no doubt left its mark on him. It was Bakkers
    who, in 1941, came up with proposals for a Western organized and armed motorized
    and mechanized Java army. These plans testify to a sense of vision, but turned
    out to be too ambitious for the RNEI Army. His advice was always acted on by the
    Army Commander.


    ## Major-General Wijbrandus Schilling


    **Major-General Wijbrandus Schilling (1890–1958)** was commander of the 1st Division
    and 1st Military District from March 1941, and West Group commander from late
    February 1942. Schilling (aged 52 in January 1942) did not undertake the three-year
    officer-training course at the Royal Military Academy, but was trained as a non-commissioned
    officer. Later, he followed a two-year officer’s course. Schilling attended the
    staff college, and from 1929 to 1935 also taught tactics there, along with tactical
    mapwork. From 1937, Schilling served in staff and operational positions in West
    Java. As a result, he was highly familiar with his area of operation. The rapid
    Japanese advance also surprised him. However, he believed that a partial success
    could be achieved against the Japanese southern axis of advance in West Java.


    Schilling was an analytically skilled and knowledgeable officer who combined practical
    experience in the field with tactical theory. Like his colleagues, however, he
    lacked combat experience against a modern organized and armed opponent.


    ![CAM364_009.jpg](img/CAM364_009.jpg)


    In 1941, Major-General J.J. Pesman retired early, allegedly due to alcohol dependency.
    Nevertheless, he was tasked with organizing the voluntary territorial Country
    Guards (*landwachten*). The 54-year-old, corpulent Pesman (right) was restored
    to active service in February 1942 to command the newly formed Bandung Group.
    When Major-General Schilling (left) was appointed to command the combined West
    Group and Bandung Group after the withdrawal on the Priangan Plateau, Pesman resigned.
    (Netherlands Institute of Military History)


    ## Major-General Jacob Jan Pesman


    **Major-General Jacob Jan Pesman (1888–1950)** was recalled to active duty. In
    1910, Pesman graduated from the Royal Military Academy as an infantry officer.
    From 1921 to 1924, he also studied at the Staff College. In 1926 and 1927, Pesman
    became adjutant of Riau. In 1939, he became commanding officer of 1st Division
    and 1st Military District. For health reasons, he requested a discharge, granted
    in April 1941. In West Java where the RNEI Army’s main support services were located.
    He was also tasked with the counter-attacks on Kalidjati. After his release from
    captivity in 1945, he retired from military service.


    Pesman is said to have given ‘excellent’ leadership to Bandung Group. His relationship
    with Ter Poorten was apparently difficult. His command was hurriedly formed and
    lacked cohesion. The units were distributed in companies across airfields and
    positions that blocked access to the Priangan Plateau. The counter-attacks to
    retake Kalidjati and the defence of Ciater lacked coordination and strength. Pesman
    made hardly any use of the remaining aircraft available to him during daylight
    hours from the morning of 5 March 1942.


    ![CAM364_011.jpg](img/CAM364_011.jpg)


    ## L.H. van Oijen


    L.H. van Oijen followed his promotion on 15 June 1940 to major-general. In 1933,
    he became adjutant of Her Majesty the Queen in ordinary service. The following
    year he became adjutant in extraordinary service. From 1934, (although not a pilot)
    he was commander of-1939 Aviation Service. The 52-year-old Van Oijen witnessed
    the Japanese air attack on Pearl Harbor on 7 December 1941, while staying there
    on the return flight from a two-month business trip to the United States and Canada.
    He did not reach Java until 17 December 1941, after an adventurous journey. In
    the photo he wears the special uniform of Aviation Service with, on his right
    shoulder, the aiguillettes of adjutant of Her Majesty the Queen. (Nationaal Archief,
    public domain)


    ![CAM364_012.jpg](img/CAM364_012.jpg)


    ## Brigadier A.S. Blackburn


    Brigadier A.S. Blackburn was a Victoria Cross holder from World War I. In the
    interwar years, he was a lawyer and served in the militia. In 1940, he rejoined
    the army and served as a lieutenant-colonel in the 2/3rd Machine-Gun Battalion,
    Australian 7th Division in Syria. On 21 February 1942, Blackburn became GOC of
    all AIF personnel on Java and was promoted to brigadier. He reorganized the various
    Australian units allotted to ground defence of five airfields around Jakarta into
    a motorized brigade concentrated at Bogor. He was an aggressive commander and
    was open to new tactics. He learned from the experience of others in Malaya, and
    used that knowledge to put up a stubborn defence at Lewiliang. In this photo,
    Blackburn is a captain. (Australian War Memorial)

