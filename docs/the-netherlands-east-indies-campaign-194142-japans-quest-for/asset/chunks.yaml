    1927 年的《防御原则》在威胁评估以及最终对外国（即英国和美国）支持的依赖方面存在严重缺陷。来自所谓联盟的支持超出了荷兰东群岛的控制范围。据说 1921–1922
    年的华盛顿会议缓解了太平洋地区的紧张局势，但根据`RNEI Army`的说法，事实远非如此。双方同意的对海上基地建设以及新加坡海军基地开发的限制性部分禁令，反而增加了荷兰东群岛的战略重要性。然而，保护荷兰东群岛对英国和美国来说都不是首要任务。首先，英国的重点在远东的印度和新加坡；其次，英国缺乏所需的资源。由于欧洲爆发了战争，它无法向新加坡派遣一支大规模海军力量。至此，英国在远东的防御基石被移除了。英国的地位如此虚弱，根据历史学家
    H.P. Willmott 的说法，“英国人并不认为将荷兰人视为面对共同威胁的弱小盟友（即一个需要帮助的盟友），而是将其视为一种在巩固英国自身地位时可以被利用的支持力量”（1982，p.
    121）。美国的优先事项清单上包括珍珠港、澳大利亚、菲律宾以及让民族主义的中国处于战争状态。对于这两个盟友来说，澳大利亚对于收复东南亚至关重要。最终，荷兰东群岛被留自自为生。


    ![9781472843524_Map003.jpg](img/9781472843524_Map003.jpg)


    ## RNEI Army 所在地


    `RNEI Army`领导层不同于 1927 年《防御原则》的假设。如果太平洋爆发战争，由于海军基地和油田的存在，`RNEI Army`预计将面临针对爪哇的征服进攻。考虑到群岛规模和可用资源，`RNEI
    Army`领导层选择对以下地区进行领土防御：


    1. 政府所在地、海军基地以及陆海军关键机构的爪哇；

    2. 外岛的海军和航空支援中心；

    3. 涉及战略原材料提取的主要区域。


    `RNEI Army`制定了一套利用水平轰炸机在宽度和深度上进行间接海岸防御的作战理论。空军是第一道防线，旨在阻止敌方运输舰队到达爪哇。海军形成第二道防线，陆军则是第三道。轰炸机旨在攻击运送登陆部队的运输船，而非日本军舰。“只有登陆部队才能占领我们群岛的支撑点。军舰绝不行！……军舰要用军舰作战，而不是用飞机。”10
    这表明，空军的全部潜力尚未完全实现。


    所需的机场建设在外岛地区。这些机场形成了三道防线。外防线从苏门答腊的望邦和棉目腊，跨越婆罗洲的打拉干和苏拉威岛的兰戈安（曼纳多），一直到西新几内亚的巴博。第二道防线由苏门答腊的`Pakan
    Baroe`机场、婆罗洲的`Singkawang II`和`Samarinda II`、苏拉威岛的`Kendari II`、`Ambon II`以及结束于提汶尔岛库班的机场组成。苏门答腊的`Palembang
    I Airfield`、爪哇的机场以及巴厘岛的`Den Pasar`形成了最后的抵抗线。在和平时期，机群驻扎在爪哇。向外岛分配飞机是临时性的，且基于借调原则。


    荷兰皇家海军认为，军事航空局的新角色与 1927 年的原则相矛盾。它指出机场可能被敌军占领并用于进攻爪哇的风险。`RNEI Army`计划通过在内陆而非沿岸建设机场来降低这种风险，并在必要时为摧毁它们做准备。部分机场是秘密建设的。很长一段时间，日本人并不知道`Singkawang
    II`、`Samarinda II`和`Palembang II`机场的存在。然而，事实证明海军的判断是正确的。


    1940 年后，外岛许多支队的首要任务变成了防御机场和或油港及石油设施。维持秩序和和平变成了次要任务。许多支队被解散或缩小了规模。在 1941 年动员后，对机场的直接防御以统一的方式组织。这包括两个到三个配备机枪的掩体，用以覆盖机场并用轻机枪对付空中目标；三辆配备轻机枪的装甲人员运兵车（`overvalwagen`）；三到四个步兵旅（每个由
    15 人的小组组成）。机场将作为最后的堡垒。1935 年，野战团尽管编制和装备经过了调整，但从爪哇转移到了石油岛打拉干（第 7 步兵团）和石油港巴里木巴板（第
    6 步兵团）。如果需要，这些关键地点要点将被摧毁，以防止它们落入进攻者手中。随后，陆军将进行游击战。众多小型、分散且孤立的守军没有获得外部援助的机会。他们将被优势的日本军队绕过或击溃。


    ![../CAM364_018](img/CAM364_018.jpg)


    `RNEI Army`总参谋 R. Bakkers 上校于 1941 年 12 月坐在战争部的办公桌前，从左到右是副长 W.P. van Veen 中校和第三处长
    P.G. Mantel 中校。Bakkers 上校于 1942 年 2 月 19 日被升为少将。动员后，办公期间的白色便服被灰绿色野战服取代。（布贝克博物馆）


    根据 1927 年《防御原则》，1935 年`RNEI Army`计划在战争爆发后将大部分陆军集中在爪哇岛，以防御该岛东部的泗水海军基地。然而，在 1941
    年，`RNEI Army`拒绝了这一做法。1939 年和 1940 年欧洲的战争模式导致`RNEI Army`指挥部得出结论：“必须考虑到快速行动，在多个地点同时进行，通过机械化和机械化力量有力且快速地突破对手选择的一个（或多个）点”。因此，爪哇陆军必须由部署在爪哇西部、中部和东部队组成，以执行快速、决定性的反击。这需要陆军进行大规模的机械化和机械化。其次，对海岸和内陆的领土力量进行重大加强是必要的。


    `RNEI Army`军指挥部确定了防御爪哇的三个关键地点：


    1. 陆海军基地，即万隆和泗水；

    2. 首都和政府所在地雅加达以及丹绒奥克港；

    3. 南岸的主要港口井拉恰普。


