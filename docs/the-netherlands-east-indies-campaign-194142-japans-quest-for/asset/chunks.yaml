    ## About the Author


    Marc Lohnstein holds an MA in history; his main focus is the former Dutch colonies
    in Indonesia and Surinam. He specializes in colonial army and police organization,
    equipment, uniforms and tactics, and has published several studies on these subjects.
    He is currently assistant curator at The Royal Home for Retired Military and Bronbeek
    Museum, at Arnhem in The Netherlands.


    ## Illustrator


    Graham Turner is a leading historical artist, specializing in the medieval period.
    He has illustrated numerous titles for Osprey, covering a wide variety of subjects
    from the dress of the 10th-century armies of the Caliphates, through the action
    of bloody medieval battles, to the daily life of the British Redcoat of the late
    18th century. The son of the illustrator Michael Turner, Graham lives and works
    in Buckinghamshire, UK.


