    `IJA` 和 `IJN` 已将西方列强驱逐出亚洲并夺取了巨大的地区。为了维持这些成果，行动的第二阶段将从进攻转向防御，以稳固周边界。西方列强的反击将会失败。战争将以一种妥协性的和平结束，即西方列强不得不接受日本在东南亚的主导地位。在第二阶段，日本将对规模最大的工业化大国
    `United States` 爆发一场消耗战。作为弱势方，日本无法希望在这场消耗战中胜利。因此，预期的有限战争变成了全面战争，导致了日本帝国不可避免的灭亡。


    ## 南方进攻


    在南方进攻行动期间，`IJA` 和 `IJN` 在执行方案和时间表上经常发生冲突。双方在作战术语上存在根本差异。`IJA` 想要迅速占领战略要点并进行战斗，让敌人没有时间组织防御。`IJN`
    则主张一种系统方法，包括一场空战行动，旨在通过消灭登陆点及后方的敌方空军来获得制空权。只有这样，才能进行两栖登陆。`IJN` 报告的空战行动结果过于乐观。部分由于此原因，他们的两栖登陆经常面临盟军的空袭和海军部队的攻击。尽管此前进行过空战，但这些目标被破坏得不足，甚至根本没有破坏。


    荷兰东印度群岛战役发生在一年中极不利的时期：雨季。日本的航空行动遭受了从恶劣到非常糟糕的天气。并非总是能够飞行并为陆军和海军提供空中覆盖。此外，大雨导致机场几乎无法使用。潮湿的机场和过短的跑道对航空兵种的效能产生了负面影响。日本人在计划中低估了这一点。另一方面，日本陆军经常利用雨雾对
    `NEI` 守卫者进行奇袭。


    ## 荷属东印度群岛陆军


    `RNEI` 军在作战、战术和指挥方面，事实证明其质量劣于日本对手。`NEI` 致力于在联盟中进行防御性斗争。然而，它对这些盟友并没有影响力。盟国内部及盟国之间的利益并不一致。`Great
    Britain` 和 `United States` 在战争的这一阶段也太弱了，无法减缓日本的推进，更不用阻止它。在战争爆发一个月后才建立了一个联合（多国）司令部。这已经太晚了。在作战上，利用水平水平轰炸机进行间接防御的概念失败了。`Military
    Aviation Service` 拥有的轰炸机和战斗机太少，无法成功实施。水平轰炸机对付舰只也相当不成功。日本人经常对 `NEI` 守卫者取得战术突袭。在
    `Ambon` 和 `Timor`，他们在被认为不适宜的海岸进行了两栖登陆。


    ![CAM364_062.jpg](img/CAM364_062.jpg)


    四个 `NEI` 静态岸防电池中有三个位于 `Tarakan` 的西南海岸。在 `Peningki`，这里有两座各拥有 `3 x 7.5cm L/40` 炮的炮台，以及一座拥有
    `4 x 12cm L/40` 炮的 `Karoengan Battery`，用于守卫 `Lingkas Front` 前方的雷障。这些炮台仍部分完好，包括大炮。这张照片拍摄于
    2010 年左右，显示了 `Karoengan Battery` 混凝土底座上的一门生锈的快速射 `12cm L/40 No. 2` 大炮。该炮有一个安装在转座上的摇篮架和装甲盾。这是由
    `Krupp` 在 `1901` 年制造的海军炮。它由一名炮长、五名炮手以及一名助理和弹药运员组成的炮组操作。（私人收藏）


    ## 战术与指挥挑战


    在战术上，进取且机动的日本人将 `RNEI` 军引向了错误的道路。日本的制空权对 `NEI` 部队是瘫痪性的。当飞机接近时，部队立即寻找掩护并在那里停留长时间。面对这样的对手，`NEI`
    部队特别是印度尼籍成分表现出战斗意愿不足。`RNEI` 军在军事能力上心理上动摇。战斗情报经常匮乏。因此，日本攻击的力量和方向均未知。这使得采取现实的反击措施变得极其困难。`RNEI`
    军在进攻时未能表现出足够的控制。计划和协调处于中等偏差水平。因此，反击以碎片化的方式进行且力量过弱。在 `2nd Infantry Regiment` 和
    `Teerink Group` 的反击中，接触推进是按照规则开始的，即攻击者进入火炮射程时——`c. 15km`。结果是部队在攻击目标前方公里处跳出，必须在热带温度下以战斗队形在艰难地形中行进数小时。结果是失去了突然性，且进攻部队精疲力竭——而这一切是在面对敌人制空权的情况下。炮兵的部署方式犹豫且碎片化。澳大利亚少校
    `J.H. Brown` 曾在 1941 年 11 月的一次演习中指出缺点：“没有准备任何协调的火力计划，营长们也没有进行任何侦察……天亮三小时后，两个进攻营向前移动了约一英里，仍在前线后方吃早餐。给人的印象是攻击缺乏上级的动力，在实践中将是致命的。”
    Brown 认为主要弱点在于“缺乏实践经验的营级和团级指挥官”。根据他的发现，澳大利亚军事情报局长表示，“军队装备良好。他们的训练主要是防御性的，对进攻战术的知识多于理论。”15


    指挥有时是混乱的。师指挥官直接联系连指挥官，反之亦然，跳过了层级指挥链。


    ## 后勤与资源


    通过征服荷兰东印度群岛，日本夺取了渴望的石油产量和炼油能力以及战略原材料。限于石油，荷兰东印度群岛的油井和设施已被大部分破坏。这些破坏的目的是防止其在六个月内被使用。日本人很快地恢复了开采和炼油，尽管没有达到战前产量。`Palembang`
    占了日本航空燃料消耗量的 78%和原油的 22%。


    ![table_p93.jpg](img/table_p93.jpg)


    将开采和炼油的石油运输到日本证明是一个瓶颈。日本缺乏容量足够的油船队。1939 年，日本油船队由 38 艘船组成，总容量为`3124 万桶`。这仅占进口量的
    10%。石油进口主要通过其他国家的船舶运输，而这些国家与日本发生了冲突。这给国家带来了一个几乎无法解决的问题。


    美国潜艇进攻和飞机攻击对日本油船队造成了破坏。“日本最终继续了战争，再次面临燃料的极端短缺。”16


