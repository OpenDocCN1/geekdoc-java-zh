    On Saturday morning, 14 February 1942 at 1126hrs, the paratroopers of the `2nd
    Raiding Regiment` jumped out of 25 transport aircraft of the `Raiding Air Unit`.
    At Palembang I the first echelon, consisting of the regimental headquarters, signal
    unit, `4th Company` and half the `2nd Company` (180 men), landed c. 3km to the
    south-east, and two platoons of `2nd company` (60 men) landed immediately west
    of Palembang I. The airfield defenders were kept in check by an aerial bombardment
    and strafing, which would give the paratroopers enough time to arm and regroup
    after landing. The airborne operation was not flawless. British fighter planes
    attacked twice, but were driven off on both occasions. The paratroopers did not
    jump with their weapons and ammunition; these were dropped separately in containers.
    Due to the difficult terrain, the paratroopers often failed to recover these containers.
    Often armed only with pistols and grenades, they could not develop enough firepower
    to overcome the resistance quickly and take the airfield. Some paratroopers armed
    with an `LMG` erected a roadblock 8km from the city on the way to the airfield,
    thereby hindering communications between Palembang and the airfield.


    The Palembang I garrison consisted of a battery from `15th Heavy Anti-Aircraft
    Regiment` with eight 3.7in. guns, a section from `78th Battery` and a troop from
    `89th Battery` (both from `35th Light Anti-Aircraft Regiment`) with eight 40mm
    Bofors, 150 RNEI Army men with two APCs and the defence sections (ground defence
    detachments) of `Nos. 258` and `605` (Fighter) squadrons (about 60 men). Wing
    Commander H.G. Maguire acted as base commander on Saturday due to the senior officer
    being ill. The British AA gunners were able to take on the security of their own
    positions by forming ground defence squads and anti-paratroop patrols. The personnel
    had received weapons and ground defence training and had familiarized themselves
    with the wider environment of their gun positions. The airfield defenders fiercely
    opposed the attacking paratroopers all day. Once the AA artillery had almost used
    up its limited ammunition stocks against air and ground targets, it was partially
    evacuated to Palembang under cover of the ground defence squads. With about 70
    men left, Wing Commander Maguire saw no way of defending the airfield against
    night attacks. He and his men withdrew north-west in trucks shortly before nightfall.
    The runways, although mined, were not destroyed, as the store containing the detonators
    had burnt down during the attack. The airfield fell into Japanese hands undamaged.


    The refineries were attacked by the `1st Company`, `2nd Raiding Regiment` at 1130hrs.
    Sixty men landed at Plaju, and the `3rd Platoon` (39 men) jumped south-east of
    Sungei Gerong. Palembang II, unknown to the Japanese, was therefore not attacked.
    Around noon, air support for the airborne troops ceased.


    ![CAM364_032.jpg](img/CAM364_032.jpg)


    Five Menadonese riflemen of the `2nd Company`, `10th Infantry Battalion` at Palembang.
    This company counter-attacked and expelled the Japanese paratroopers from Plaju
    Refinery. In the background, the burning oil refinery can be seen. The soldiers
    are armed with the `M95` repeating carbine, `klewang` swords and grenades. They
    wear the grey-green field dress Model 1937 with puttees, and the steel helmet
    with leather neck flap (for protection against the sun). (Museum Bronbeek)


    The refineries were arranged for all-round defence with a garrison of approximately
    150 men at each of them. The focus was on repelling an attack from the Musi River.
    However, the Japanese attack came from the south. At Plaju Refinery, the majority
    of the paratroopers landed to the south-west, while some landed in the refinery.
    They established themselves at the site. The NEI defenders received reinforcements
    from a British anti-paratroop squad (20 men) of AA gunners, and started a sweep.
    The Town Guard platoon cleared the residential area west of the refinery. At the
    beginning of the afternoon, the reinforced Menadonese `2nd Company`, `10th Infantry
    Battalion` (reduced) arrived from Praboemoelih. By evening, this company had almost
    cleared the complex, and the next day prepared to mop up the last remaining group
    of about 15 men. The Japanese platoon attack on Sungei Gerong Refinery was immediately
    repelled. On 14 February 1942, the Japanese reported losses of 39 paratroopers
    killed in action and 48 wounded out of the 329 men who jumped.


    Lieutenant-Colonel Vogelesang directed one platoon (reduced) of territorial troops
    in two armoured cars and the reinforced `1st Company`, `10th Infantry Battalion`
    towards Palembang I. The Town Guard was ordered to take up a blocking position
    north of the city. The counter-attack by `1st Company`, `10th Infantry Battalion`
    only started at around 1630hrs. The core of `10th Infantry Battalion` at Praboemoelih
    and part of Plaju’s garrison was on exercise that morning. As a result, the response
    started late. On the advice of Brigadier C.S. Steele, Chief Engineer of Australian
    I Corps, who was touring South Sumatra, the RAF organized a bridgehead with armed
    RAF personnel at the Musi ferry. Several uncoordinated actions to reach Palembang
    I failed at the Japanese roadblock. The counter-attack executed by `1st Company`,
    `10th Infantry Battalion` did not go smoothly, but in the afternoon it cleared
    the roadblock. Its advance was, however, halted due to nightfall. Its advance
    was, however, halted due to nightfall. Its advance was, however, halted due to
    nightfall. Its advance was, however, halted due to nightfall. Its advance was,
    however, halted due to nightfall. Its advance was, however, halted due to nightfall.
    Its advance was, however, halted due to nightfall. Its advance was, however, halted
    due to nightfall. Its advance was, however, halted due to nightfall. Its advance
    was, however, halted due to nightfall. Its advance was, however, halted due to
    nightfall. Its advance was, however, halted due to nightfall. Its advance was,
    however, halted due to nightfall. Its advance was, however, halted due to nightfall.
    Its advance was, however, halted due to nightfall. Its advance was, however, halted
