    ***


    In this chapter I have looked closely at a range of teachers, students, and volunteers
    at different Al-Huda teaching sites, including the online one. Two key points
    that emerge from this examination are: the continuous nature of the learning experience
    for students at Al-Huda and the way in which course material—the Qur’anic text
    that is at the heart of it all—is ‘translated’ into action. The word must become
    embodied action in the world for Al-Huda’s purpose to be fulfilled. I have tried
    to encapsulate the concept of continuous learning by using the term ‘teacher-learner’,
    for many students who complete the 18-month diploma course go on enroll in other
    Al-Huda courses to deepen their knowledge and love of the Qur’an by continuous
    exposure and study. Simultaneously they might volunteer in some capacity at an
    Al-Huda centre if they are within driving distance of one or start a small study
    circle of their own at home with the aid of recorded lectures, visual materials
    available on YouTube and other media, and traditional written texts. In the next
    chapter I turn to students’ teachers’ narratives, drawn largely from people I
    came to know, meet, or correspond with over the four years that I was an active
    listener and online student.'
