    They too had to embody these ideals, and be able to transmit them to their children.¹18


    Gradually, support for women''s schools grew, though the possible breakdown of
    the norms of pardah society was constantly on people''s minds, leading to considerable
    opposition. Among the pioneers of schools for girls were the remarkable husband-and-wife
    team, Shaikh and Begum Abdullah of Aligarh, despite considerable opposition from
    sections of the ''Aligarh establishment'', opened the Aligarh Zen Madrasa (Aligarh
    Girls'' School) in 1906 with funding from Sultan Jahan Begam of Bhopal and Badruddin
    Tyabji and members of his family in Bombay, as well as the promise of a UP government
    grant once it had opened.¹⁹ With about 50 students in the first year, opposition
    to the school quickly abated in light of the students'' enthusiasm, the school''s
    enforcement of pardah rules, and the quality of education imparted. The school
    grew, and by 1909 moved to a larger house.


