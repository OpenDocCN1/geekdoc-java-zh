  md: '# ABOUT THE AUTHOR


    Usha Sanyal is visiting assistant professor at Wingate University, North Carolina,
    USA. Her previous research focused on the history of the Barelwi or Ahl-i Sunnat
    at Jama''at movement in British India. She is the author of Devotional Islam and
    Politics in British India: Ahmad Riza Khan Barelwi and His Movement, 1880–1920
    (2010), which has also been published in Urdu; Ahmad Riza Khan Barelwi: In the
    Path of the Prophet (2005); and numerous articles about South Asian Muslims both
    in the past and contemporaneously. Sanyal has co-edited the book Food, Faith and
    Gender in South Asia: The Cultural Politics of Women’s Food Practices (with Nita
    Kumar [2020]).'
