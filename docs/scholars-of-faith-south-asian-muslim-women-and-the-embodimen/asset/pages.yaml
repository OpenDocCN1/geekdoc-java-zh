  md: '# Introduction


    In order to help one walk on this path, both Barelwis and Al-Huda followers follow
    strong moral leaders to provide guidance. Whether the leader is a Sufi pir, a
    teacher at a madrasa, or a layperson, strong moral leaders provide the glue that
    brings communities together in worship, study, and mutual service. Among both
    Barelwis and Al-Huda followers, the leader is recognized as one who is sincere,
    pious, and has a simple lifestyle with few personal needs. These moral attributes
    must shine through, such that there can be no question of duplicity or cheating—of
    saying one thing but another. In terms of practical, organizational skills, the
    leader should speak from the heart, but also be a powerful speaker, an effective
    communicator with those around him or her, and have the ability to raise funds
    for the organization. In addition, I hope to show that the leader performs the
    all-important task of cultural ''translation'', that is, of making relevant to
    him or her followers the principles that revered religious texts embody, so that
    they speak to the person and urge him or her to act accordingly. In Starrett''s
    terms, the leader must make possible the ''objectification'' and ''functionalization''
    of Islamic education.


    For this to happen, knowledge—by which is meant knowledge of din, religious knowledge—and
    the search for it must be acquired, internalized, and effectively ''performed''
