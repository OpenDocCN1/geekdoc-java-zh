  md: '# Introduction


    Madani (d. 1957), engaged in an array of anti-British activities, which earned
    him a prison sentence and exile. Since Independence and Partition, however, the
    Deobandi ''ulama in India (like other Indian ''ulama) have focused far more on
    ''cultural preservation'' than on politics, particularly since the rise of the
    Bharatiya Janata Party in state and national elections. Muhammad Qasim Zaman,
    who has written extensively on the twentieth-century Deobandi (and other) ''ulama
    in South Asia, shows us a different history: while there have been a number of
    scholars and thinkers of high intellectual calibre in Pakistan, as evidenced especially
    by their Hadith commentaries, Deobands have also been been at the forefront of
    political activity and national protest in that country. These activities include
    the anti-Hahmadi agitation in the 1970s, anti-Soviet warfare in Afghanistan in
    the 1980s, the rise of the Taliban, and more recently, anti-Shi''i activities.
    As Zaman notes, the radicalization of particular Pakistani madrasas is inconceivable
    in a context other than that provided by the Pakistani state, although this has
    not meant that the state and different groups of ''ulama have seen eye to eye
    on major national issues.


    > Barbara D. Metcalf, Islamic Revival in British India: Deoband, 1860–1900 (Princeton:
    Princeton University Press, 1982); Maulana Husayn Ahmad Madani, The Jihad for
    Islam and India''s Freedom (London: Online, 2009); and Muhammad Qasim Zaman, The
    Ulama in Contemporary Islam: Custodians of Change (Princeton: Princeton University
    Press, 2002), and passim. pp. 32–44. Zaman also examines the views of Deobandi
    ''ulama such as Mawlana Ahmad ''Uthmani, who argued against Madani''s position.
    Zaman, The Ulama in Contemporary Islam, pp. 42–7.


