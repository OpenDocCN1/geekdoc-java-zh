  md: '# Introduction


    debate about who has the authority to be purveyors of shari’a inter-interpretation
    among Muslims today. Do the ‘ulama have the authority to interpret the shari’a
    in the contemporary world, as they have over the centuries, or do they now share
    this authority with ‘new Islamic intellectuals’?8 Each of these questions has
    a direct bearing on the present study.


    The concepts of the ‘objectification'' and ‘functionalization’ of Islamic education
    were coined by Gregory Starrett with reference to state-sponsored mass education
    in Egypt.9 The objectification of Islam refers to the ‘growing consciousness on
    the part of Muslims that Islam is a coherent system of practices and beliefs,
    rather than merely an unexamined and unexaminable way of life. This is a pervasive
    process throughout the Muslim world.’10 By ‘functionalization’, he refers to ‘processes
    of translation within one discourse to serve the strategic or utilitarian ends
    of another discourse. This translation not only places intellectual objects in
    new fields of significance, but radically shifts the meaning of their initial
    context.’11


    The concept of ‘objectification’, or the idea that ‘Islam’ is a ‘religion’ that
    can be taught as for-granted assumption in state-sponsored secular mass education
    in postcolonial states since the twentieth century, having been part and parcel
    of British colonial policy in India and elsewhere. Both the madrasa and the online
    classes reflect this modern idea, although they are private initiatives rather
    than state institutions. Francis Robinson refers to it as the ‘rationalization
    of religious belief and practice’, and identifies it as one of the several outcomes
    of Islamic reform movements in South Asia since the eighteenth century.’12 As
    for the concept


