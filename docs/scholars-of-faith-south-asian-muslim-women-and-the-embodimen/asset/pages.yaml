    there were two competing centres of power in Bareilly, as well as a number of
    ''satellites''.^9 One of the main centres was Maulana Akhtar Raza Khan (known
    as Azhari Miyan), who held the office of mufti (jurist who issues fatwas), and
    was the only one of Ahmad Raza''s descendants with a reputation for scholarship.
