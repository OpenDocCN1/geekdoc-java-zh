  md: '# INTRODUCTION


    Whether identified as ‘orthodox,’ ‘orthoprax’, or ‘scripturalist’, the tradition
    of the ‘*ulama* [Islamic religious scholars] has always been characterized by
    reliance on the ‘the two sources’ of [Kur‘anic] scripture and sunnah...


    What is crucial here is the fundamental presupposition that truth does not reside
    in documents, however authentic, ancient, or well-pre-served, in authentic human
    beings and their personal connections with one another. Documents alone, without
    a line of *persons* possessed of both knowledge and righteousness to teach and
    convey them across the years, are useless as instruments of authoritative transmission.


    > —William A. Graham, ‘Traditionalism in Islam’, pp. 504, 507¹


    This is a book about new institutions of religious learning that caters to South
    Asian Muslim girls and women, that have risen across South Asian cities and towns,
    and in the South Asian diaspora, starting in the second half of the twentieth
    century, and accelerating in the 1990s and thereafter. I examine two institutions
    in particular, belonging to different schools of thought and differing from one
    another in terms of social class, geography, and access to technology. The comparative
    focus of my study necessarily broadens the questions that we must ask regarding
    the increased


    ¹ William A. Graham, ‘Traditionalism in Islam: An Essay in Interpretation’, Journal
    of Interdisciplinary History (1993), 23: 495–522.


    Scholars of Faith. Usha Sanyal, Oxford University Press (2020).

    Oxford University Press. DOI: 10.1093/oso/9780190120801.001.'
