    common. As I noted at the outset, both groups of women share a worldview grounded
    in belief in an afterlife after moral choices made in the here and now. How one
    lives one''s life today will lead inelasticably to reward or punishment in the
    hereafter; the moral choices one makes in the course of one''s life therefore
    assume an importance far beyond one''s immediate mundane context.


