    # Adab and Tajdid, Etiquette and Reform


    Sayyid Sahib had begun to teach his daughters dars-i nizami syllabus at home before
    he founded the girls'' madrasa. They completed the course in the madrasa all to
    the advanced (fazila) level. Since then, both daughters had been teaching a variety
    of subjects at the madrasa. As noted earlier in the chapter, they exercised personal
    authority in the classroom and during afterwards hours on the strength of their
    knowledge of the curriculum and several years of teaching experience. Moreover,
    they embodied a number of key Islamic virtues—piety, humility, self-restraint,
    and self-effacement, among others—outside the classroom. These qualities conferred
    great authority in and of themselves, enhancing the respect they enjoyed by virtue
    of their Sayyid descent.


