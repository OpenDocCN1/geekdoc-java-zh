    gratitude and awareness of one’s human frailty and moral imperfections—must therefore
    be expressed in the course of the day through prayer, an activity distinct and
    from other preoccupations. For the madrasa, the task is to heighten the student’s
    awareness of God’s presence in life to the point where it becomes real to her
    as her own companions, teachers, and family, the guiding light in the decisions
    she makes in life. Ideally, as the student goes through her day, she will live
    fully in the moment, fully focused whether she is at prayer or in the midst of
    study, fulfilling her responsibilities to those around her, or enjoying time with
    her friends.


