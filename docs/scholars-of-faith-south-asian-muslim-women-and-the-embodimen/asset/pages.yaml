    number of such classes has grown every year, and they continue to expand. From
    their Canadian headquarters in Mississauga, a Toronto suburb, where Farhat Hashmi
    and her family have been living since 2005,³² Al-Huda manages a complex and sophisticated
    network of classes which are partly live and based on taped lectures of their
