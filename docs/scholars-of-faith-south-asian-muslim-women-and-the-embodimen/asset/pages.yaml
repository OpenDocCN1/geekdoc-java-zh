    2. The checking team graded the tests using the keys provided, and if necessary
    revised the key.

    3. The checking team returned the tests, which went to the ''re-checking team''.
    This team rechecked the graded tests and calculated the student''s total grade.

    4. The volunteers noted which students repeatedly answered incorrectly, whether
    in translation or ''fahm'' (understanding, exegesis) assignments, and reported
    their findings to the ''course in-charges''.

    5. After rechecking, all the tests were given to the regional coordinator for
    ''final approval''.


    +   6. An additional grade was added for students'' participation in group discussions
    (which occurred once a week), and a final grade for each student was entered on
    a grade sheet.

    7. Address labels were made, each test was folded and put into a white envelope,
    and the tests were mailed after making a record of this final step.58


    As is apparent from this email, there was a clear hierarchy of functions and roles
    at the Al-Huda Testing Center, ranging from the regional coordinator at the top,
    to the course in-charges (responsible for specific parts of the daily teaching
    schedule), and volunteers working in the office or grading at home. The thoroughness
    of the work done, most of it on volunteer basis, spoke volumes about the high
    morale, motivation, and dedication of all involved. The efficiency with which
