    Education’, in Robert W. Hefner and Muhammad Qasim Zaman, eds, Schooling Islam:
    The Culture and Politics of Modern Muslim Education (Princeton: Princeton University
    Press, 2007), pp. 32–44.

    9 Gregory Starrett, Putting Islam to Work: Education, Politics, and Religious
    Transformation in Egypt (Berkeley: University of California Press, 1998).

    10 Starrett, Putting Islam to Work, p. 9.

    11 Starrett, Putting Islam to Work.

    12 Francis Robinson, ‘Islamic Reform and Modernities in South Asia’, in Filippo
    Osella and Caroline Osella, eds, Islamic Reform in South Asia (Cambridge: Cambridge
