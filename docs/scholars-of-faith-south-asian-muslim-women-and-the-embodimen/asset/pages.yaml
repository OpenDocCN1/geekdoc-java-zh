    # Ghazala and Hajira


    Ghazala was a graduate of Jami’a Nur and a teacher at Jami’a Umm—like the previous
    interviewees—when Farah met her in 2014. She was a work colleague of Naghma’s.
    Alongside, Ghazala was pursuing further studies, though Farah does not tell us
    what she was studying. Ghazala came from a village called Manpuriya outside Bareilly.
    She had three brothers and a sister, none of them formally educated. She was the
    only one of her siblings to be educated. As Nayla and Khushob, her younger sister
    also attended Jami’a Nur, but she fell sick often and was unable to adjust to
    life at the madrasa. Her parents pulled her out and by the time Farah met Ghazala,
    she was happily married, according to Ghazala. Two of Ghazala’s older brothers
    had wives and children; they all lived in the same household. Their was a joint
    family consisting of the parents, two married sons and their families, and one
    unmarried daughter, Ghazala.


