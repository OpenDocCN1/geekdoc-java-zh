    Winkelmann classifies madrasas in India into three categories on the basis of
    their curriculum. These are: Urdu-modern schools with some Islamic content, which
    are strictly speaking, not madrasas at all; madrasas which follow some version
    of the dars-i nizami syllabus; and ‘dual type’ madrasas which teach the religious
    subjects as well as ‘non-Islamic subjects ...such as mathematics, English, Hindi,
    and computer skills.³⁹ According to Winkelmann’s informants, madrasa education
    for girls in India received a big impetus as a result of a 1975 conference in
    Jeddah in the Islamization of education. In the aftermath of that conference,
    Maulana Mukarram al-Nadwi founded the Muhammadiyya Education Society in Mumbai:those
    associated with the Muhammadiyya Education Society advocated the integration of
    Islamic and non-Islamic subjects in the madrasa curriculum. In addition to introducing
    “dual” curriculum in madrasas, a second idea that found enthusiastic following
    was promoting madrasa education for girls⁴⁰ These claims are supported by Mumtas
    Begum’s story that surveys a number of girls’ madrasas throughout India. It finds
    that the Kulliya Aisha Madrasa in Malgaon, Maharashtra, run by the Jami’a Muhammadiyya
    Education Society of Mumbai, combines modern education (following the Maharashtra
    government’s guidelines) with the teaching of Arabic and Islamic Studies.³⁴¹


