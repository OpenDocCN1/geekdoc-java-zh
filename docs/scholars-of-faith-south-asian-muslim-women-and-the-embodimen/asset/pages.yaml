    culture, Hindi films, and the like. In these and other ways, the madrasa students
    were much enmeshed in the geographical and cultural context of the school.⁶⁰


    Returning to the madrasa’s ‘civilizing mission’, clearly one of the central mechanisms
    by which it was absorbed by disciplining the body. There were many examples of
    this throughout the day. The following image is familiar to those who have observed
    madrasa students: ‘the teachers’ control over the students’ bodies showed whenever
    they began to recite a text during class, as any further the students ceased their
    activities, adjusted their posture, fidgeted with the scarves covering their heads,
    and started moving their upper bodies along with the rhythm of the teachers’ voice’.⁶¹
    As Winkelmann, discipline of the body was particularly necessary that space was
    tight at the Madrasatul Niswan, as students ate, slept, and studied in the same
    physical space at different times of the day. The teachers’ and senior students’
    authority ensured the students’ smooth transition from one activity to the next.⁶²


