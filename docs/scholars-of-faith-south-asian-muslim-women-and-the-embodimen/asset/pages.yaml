    Once he had obtained the ijazas, Al-Silafi was very ‘generous’ in passing them
    on to ‘other people’.


    In the second part of the thesis, which consists of an English translation (critical
    edition) of Al-Silafi’s book, one encounters passages which clearly explain the
    reasons for Al-Silafi’s position. Travel was not possible for everyone, he argued.
    Many could not afford to travel for one reason or another, and therefore face-to-face
    transmission through sama’ ‘a matter of fortune’, only possible for a few. In
    order to make sure that no Prophet were lost to posterity, other methods must
    also be used. The Prophet himself had shown the way by writing letters to leaders
    in distant places through emissaries.


    Furthermore, Al-Silafi argued, what mattered was ‘the transmitter’s knowledge,
    carelessness and precision, however the transmission takes place, whether by sama’,
    munawalah or ijazah, since all these are permissible.’²³ As long as the transmitter
    was reliable, it was unimportant how the Hadith was transmitted. More important
    was the fact that by transmitting the ‘material’ by ijazah [through stringent
    standards], the sunna was strengthened and thereby a sound basis was lost for
    the shari’a. He suggested that Hadith scholars should indicate how they had learned
    the Hadith they were transmitting by phrases such as ‘I heard’ (anba’ani) or ‘we
    heard’ (anba’ana)


