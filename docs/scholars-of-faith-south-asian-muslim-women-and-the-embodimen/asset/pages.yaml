    # Learning and Teaching


    Jami''a Nur al-Shari’at confers the ‘Alima and Fazila certificates on its graduates.
    The ‘Alima certificate can take up to six years of study, depending on the educational
    level of the student when she joins, and the Fazila takes another two years. The
    course of studies is broadly in keeping with the dars-i nizami syllabus, though
    it incorporates variations that reflect its dual focus on girls and imparting
    Barewi teachings.² A noticeable difference in its syllabus from that of a Deobandi
    or ‘Tablighi girls’ madrasa lies in the fact that the well-known book of ‘advice
    literature’ for women, Bhiis Zawar by Mawlana Ashraf ‘Ali Thanawi, is not used
    because Mawlana Thanawi was a leading scholar of the Deobandi school, while the
    Barewi are opposed.³ Rather, it uses its own books, known as Jannati Zawar


