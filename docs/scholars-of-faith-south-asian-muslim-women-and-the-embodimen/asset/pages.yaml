    The next class is one of the most intense, requiring that one pay close attention
    and take rapid notes on what the teacher says. This teacher, Taimiyah Zubair,
    is also in Canada (as before, this lesson is taped) and is a daughter of the Al-Huda.
    The lesson consists of word-to-word translation of the Qur’an. Over a period of
    three-and-a-half years (the length of this online course), the Qur’an will be
    translated word-by-word from beginning to end—starting with the Fatiha (Chapter
    1) on the first day, to the 114th or last chapter in Juz 30 of the era. The number
    of verses dealt with in each class varies, depending on their length and complexity,
    as time goes by, the speed of translation and exegesis picks up. On average about
    10 juz pages are translated every class. Careful attention is paid to every detail
    of the Arabic—its literal and figurative meanings, its contextual meaning, the
    way meaning can change depending on the preposition that follows, the association
    of meanings that appear unrelated, and so on.


    To give an example, when studying Chapter 4, ‘The Women’ (Al-Nisa), verse 34,
    which discusses the conditions under which a husband may strike his wife, the
    word ‘daraba’ (wa-idribhunna) was translated as ‘strike’, as in tapping lightly,
    rather than ‘beat’, and the teacher discussed the change in meaning of daraba
    when it is followed by the preposition *fi* (in) and when it is followed by *ala*
    (upon). Thus, *daraba fi* means to travel, and is related to striking because
    one strikes the earth with one’s foot as one walks. One would not say that the
    foot beat the earth, but that it strikes it. But daraba can mean ‘cite’ or strike
    in a figurative sense, as in verses where God is said to ‘strike a similitude’,
    or give an example to illustrate a point. The long-term effect of this kind of
    analytical dissection of the Arabic is to give students an appreciation of the
    linguistic nuances of the Qur’anic text, while also encouraging them to accept
    the interpretation of the teacher. Her authority, based on her erudition, makes
    the students eager to learn and follow, while despairing of how far behind they
    are in their own mastery of the text.


    Another aspect of the word-for-word translation class is its constant reference
    to the students’ own day-to-day lives, and the connections'
