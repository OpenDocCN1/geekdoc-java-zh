    The two groups share a considerable moral vocabulary rooted in belief in core
    Islamic principles and ideals. They adhere not to the so-called ‘pillars’ of Islamic
    monotheism, accepting the Prophet Muhammad as last prophet and as required in
    ritual practices on a daily and periodic basis, but more importantly, they share
    an eschatological view of Judgment Day, followed by eternal bliss or damnation
    in the hereafter (akhirat) depending on their actions in this life. They both
    believe that the soul (nafs) is constantly prone to selfishness and wickedness,
    falling prey to the wills of Satan who is always trying to trip people up so they
    end up in hellfire. In order to prevail against Satan, the individual must constantly
    engage in supplication (du’a) to God and good works in the worldly life (dunya),
    including giving to others, fulfilling one’s obligations to God and one’s fellow
    humans, and living a simple life without too many material attachments or excessive
    to one’s family. This must be done in the context of heterosexual marriage and
    raising children, taking care of one’s family, and recognizing that other people
    in society have claims or rights (huquq) over oneself, rather than in a context
    of celibacy and the renunciation of family ties. This is, both groups would say,
    a middle path—a concept greatly valued in the Qur’an, as I noted earlier—between
    celibacy (or Muslims might say, the ‘monkishness’ of Christian priests) and licentiousness.
