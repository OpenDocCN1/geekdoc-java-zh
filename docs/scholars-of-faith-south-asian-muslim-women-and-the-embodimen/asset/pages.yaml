    with their spouses, among other things. The sample of student interviews is small,
    Farah’s data throw light on the transformative potential of Jami’a Nur, and doubtless
    that of countless other girls’ madrasas similar to this throughout India and South
    Asia.¹


    Before I present Farah’s research findings and comment on how they illuminate
    my own research on the students at the Jami’a Nur madrasa, a brief word about
    my fieldwork experience is in order here.

    In 2011, I asked Farah to help me find a Bareli girls’ madrasa in West Uttar Pradesh
    (UP) whose management would agree to the madrasa being the site of my ethnography.
    Her own Barewiki background and PhD research on everyday Bareli practices and
    around the Sufi shrines (khangahs) gave me a unique vantage point and access to
    community sources and resources. After some time, she came up with a short list
    of madrasas near Bareilly that seemed promising sites and I visited a couple of
    them, accompanied by my father, a respected and well-known doctor in Bareilly
    and a practising Sunni Muslim of the Barewiki school himself Farah recommended
    the madrasa Jami’a Nur because of its proximity to Bareilly and the willingness
    of Sayyid Sahib to host me for the duration of my fieldwork. For its attraction
    was enhanced by the fact that Shahjahanpur is accessible by train from Delhi,
    my home of origin. Thus began my association with Jami’a Nur.


    However, when I arrived in Delhi in June 2012 to begin my fieldwork, I learned
    that Sayyid Sahib was having second thoughts. His prime concern, he told Farah
    and later me well, was that conditions at the madrasa were difficult and I would
    not be comfortable, being accustomed to much more luxurious living conditions
    in the United States. It took considerable effort on the part of several people,
    including myself, to persuade him to change his mind. Eventually he relented,
    telling me I should come and see him at the madrasa for a preliminary visit. This
    initial visit led to an invitation to stay, and subsequently to permission to
    make several visits.


