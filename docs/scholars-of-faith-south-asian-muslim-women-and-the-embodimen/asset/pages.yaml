    Scholars of Faith


    ***


    The Al-Huda students whose narratives I have presented in this chapter, like the
    students described by Zine, are living in an environment which subjects them to
    contrary pressures, many of them negative. Being for the most part older than
    the school-goers Zine studied, they are likely first-generation or second-generation
    immigrants to Canada, North America, and Europe. As my interlocutors indicated,
    they came to Al-Huda with anxieties and stress in their personal lives. These
    included the loss of a husband and having to raise several children by oneself,
    social isolation after a job loss in the IT industry and having to adjust to living
    in a new city without any kin or friends, and the experience of immigration to
    an environment where, especially after 9/11, they were ''outsiders'' in multiple
    senses of the word. Many were searching for community and overall meaning.


    Given the possibilities that opened up in the information age, online classes
    offer an avenue for community building that not not been imagined even 20 years
    ago. Many of the people who told their stories learned of Al-Huda online classes
    through word of mouth, through friends or family members. Once they had explored
    the site and heard Farhat Hashmi''s lectures, they were captivated by the new
    worlds that Al-Huda classes opened up to them. It gave them knowledge of pride
    in their religious tradition through study of the Qur''an at a time when around
    them, one that affirmed their Muslim identities at a time all around them, they
    were being bombarded with negative, Islamophobic messages in the media and in
    society at large. Al-Huda online classes challenged them to find time for religious
    study in the midst of their busy lives taking care of husbands and children, and
    in some cases paid jobs, and gave them a sense of purpose that had been lacking
    before.


    Yet, as some of the narratives clearly indicated, the students'' orthodoxy lifestyles
    after joining Al-Huda created new problems. Many found that their husbands or
    other family members were not supportive. The task of personal transformation
    thus had to become a community endeavour for it to be successful. As their teacher
    had told them, it was not enough for them to become personally pious. They had
    to take others along with them, starting with members of their own families. They
    had to do *dawa*.'
