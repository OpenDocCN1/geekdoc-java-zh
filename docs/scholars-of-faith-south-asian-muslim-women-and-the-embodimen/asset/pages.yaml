    absent (ghayb); between the sensual human and the psychic divine''. The simple
    acts of eating, sleeping, and using the toilet since the last prayer from the
    night before require that the believer enter that portal in order to re-enter
    sacred space and time. There are five prayers through the course of the day, sacred
    time and space are thus throughout the day with the human sphere. Maghen suggests
    that this is not because the latter is less laudable but the devotee should turn
