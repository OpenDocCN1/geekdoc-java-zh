    of the same process. The challenges facing the Muslims in South Asia are different
    today. Their socioeconomic status has altered (with fewer ashraf Muslims than
    before), and once again the ‘ulama—and the Muslim community more generally—are
    responding with a concerted effort to educate the young.


    # The Contemporary Context of Indian Girls’ Madrasas


    A key difference at the present moment seems to be the focus of mada education
    in many parts of India has shifted from boys to girls. Jeffery, Jeffery, and Jeffrey’s
    research indicates that in 2000 there were fewer female students in madrasas in
    Bijnor, west UP, than girls. They report that female boys stayed at the madrasa
    the way to the end of their educations, preferring to switch to a secular government
    school at some point, as was a better avenue to getting productive in the future.45
    My observations of the Jami’a Nur revealed that the boys’ madrasa next to the
    girls’ madrasa was not expanding, while the latter was expanding rapidly. Moreover,
    Sayyad Sahib’s son was pursuing both a madrasa education and a secular one (in
    a Hindi-medium government school) simultaneously.


    Borker’s study of a girls’ madrasa in Delhi, and Zoya Hasan and Ritu Menon’s work
    comparing Muslim girls in five different Indian cities provide valuable data,
    allowing us to assess the overall applicability of my findings in Shahjahanpur.
    Borker refers to the ‘increasing feminization of madrasol elements documented
