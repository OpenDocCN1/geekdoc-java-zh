  md: '# The Context of Precarity


    My two case studies share another characteristic, namely, their contemporary sociopolitical
    context, following Judith Butler and particularly Attiya Ahmad, I will call ‘precarity’.
    In Precarious Life, Butler explores how people make moral claims on us. Analysing
    Levinas, she asks how the face—our own and that of others (including a nonhuman
    one)—is framed, and interpreted:


    To respond to the face, to understand its meaning, is to be awake to what is precarious
    in another life or, rather, the precariousness of life itself.... This is what
    makes the face belong to the sphere of ethics. Levinas writes, ‘the face of the
    other in its precariousness and defenselessness, is for me at once the temptation
    to kill and to call the peace, ‘You shall not kill!’88


    Butler proves this paradox in many ways, including how Western media manipulate
    images of the human face and deliberately withhold images of violent death in
    modern-day conflicts across the world, as a result of which the viewer is distanced
    from the human suffering involved and is indifferent to it. Other times the media
    hone on a particular face, thereby humanizing it and drawing it close to us. Butler
    shows how in 2003 and thereafter, the US media used images of the war in Iraq
    and elsewhere in the Middle East to glorify the US effort and to dehumanize the
    Muslim Other. This dehumanization of the Muslim Other has become widespread in
    the US, especially since 11 September 2001, and is experienced as a constant sense
    of low-level hostility or menace in Muslims’ everyday lives, as even as a cursory
    glance at media reports from around the country shows.89 Anti-Muslim sentiment
