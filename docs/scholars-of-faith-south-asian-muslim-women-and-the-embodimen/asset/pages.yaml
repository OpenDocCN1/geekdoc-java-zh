    Scholars of Faith


    The book concludes by asking ‘Why Now?’ How do we make sense of the contemporary
    surge in Muslim women’s religious education across South Asia and elsewhere in
    the world? To start, we must recognize the growth of Muslim women’s education
    is part of a wider phenomenon that crosses religious boundaries. This is not an
    exclusively Muslim phenomenon. Beyond that, I situate the ethnographies presented
    here in their national contexts, both Indian and Pakistani, to illustrate the
    growing trend of South Asian Muslim women’s religious education across all social
    classes. The comparative focus of this book, I argue, to discard unhelpful binaries
    such as ‘Sufi’ and ‘Wahhabi’, and to think of the efforts of Muslims across different
    ideological and class categories as shared, albeit different, responses to the
    precarious conditions of modernity.


    # Note on Transcription and the Use of Diacritics


    I have transcribed Arabic and Urdu words using the letter ‘y’ rather than ‘i’
    in words as ‘Husayn’. I have opted to transcribe some words, such as Hadith, using
    Arabic rather than Urdu pronunciation. Likewise, when using the possessive ‘of’,
    as in ‘Ahl-i Sunnat’, I use ‘-i rather than the South Asian ‘e’. Words such as
    Ashrafiya have been spelled with a single ‘y’ rather than the usual ‘yy’, with
    occasional exceptions chosen by Taymiyya. Proper names are spelled in the manner
    chosen by the person whose name it is. Thus, I use ‘Raza’ rather than ‘Riza’ for
    members of Ahmad Raza’s family, as that is their preferred pronunciation. However,
    many people use ‘Rizvvi’ rather than ‘Razvi’ when using the adjective form of
    name. I follow their usage.


    I have indicated only two diacritics throughout, namely, the hamza, as in Qur’an,
    and the ayn, as in ‘ulama’. In the interests of simplicity, no other diacritics
    have been used.


    Arabic and Urdu words are italicized on first occurrence and romanized thereafter.'
