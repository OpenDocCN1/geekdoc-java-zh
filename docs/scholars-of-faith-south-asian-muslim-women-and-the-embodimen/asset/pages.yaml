    # Farhat Hashmi as Teacher: Challenging Students to Become ‘Rabbani’, ‘Servants
    of God’


    Although I have never met Farhat Hashmi in person, like many others I have heard
    a number of her taped lectures and listened to them carefully. I have listened
    in particular to her 2005 lectures on the first part (juz) of the Qur’an, delivered
    to a class of female students in Mississauga, Canada. Although this is admittedly
    a small part of a very large corpus of orally delivered lectures in a variety
    of electronic formats (for MP3 players, iPods, iPhones, and a number of others),
    it allows me to draw some valuable lessons on the content and style of her teaching,
    and on the relationships she builds with her students through person-to-person
    interaction and online interaction.


    The lectures follow a methodical structure: word-for-word translation from Arabic
    to Urdu of a given number of Qur’anic verses; discussion of basic grammatical
    principles, especially the root letters of individual words studied; and most
    importantly, exegesis (tafsir) of the Qur’an. Within this format, Farhat Hashmi
    brings in an array of topics including history, psychology, science, religious
    and social etiquette, and advice on time management and interpersonal skills,
    among others, peppering her lecture with Qur’an and Hadith references in fluent
    Arabic. The style is erudite but personal, making constant connections between
    the verses being studied and the lives of the students before her. Her address
    to her students combines respect for the effort they are making with constant
    admission to expect more of themselves, to push themselves harder, to remember
