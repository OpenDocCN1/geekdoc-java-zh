    As this brief survey of girls'' education in the colonial period, starting in
    the late 1800s and leading up to Partition, indicates, efforts to educate Muslim
    girls were only gradually seen as central to the rejuvenation of the Muslim community,
    having to overcome heavy obstacles in terms of public sentiment, financial resources,
    and the lack of availability of female teachers. Where they succeeded, they did
    so because of the determination of a very remarkable individuals, often with the
    support of family members. In fact, the commitment of not only the wives of founders
    such as Sheikh Abdullah but also their daughters, daughters-in-law, and further
    generations of women in the family, is a notable characteristic of many of the
    earliest girls'' schools. It is also characteristic of the Barelwi girls'' madrasa
    that is the subject of the next few chapters.


    # A Brief History of Girls'' Literacy in Uttar Pradesh


    Literacy rates in this most popular state of India, for both boys and girls, have
    been growing steadily—as in most parts of the country—throughout the twentieth
    century, and into the present. The picture at the beginning of the twentieth century
    was abysmal. In 1901, according to the Imperial Gazetteer of India of 1907, female
    literacy in the west UP district of Shahjahanpur was close to zero, while male
    literacy was at a dismal 2.6 per cent (Figure 1.1).


    In 1911, the situation was hardly any better: the census reported male literacy
    rates at 4 per cent and female literacy rates at 0.4 per cent, while the all-India
    male literacy rate was 6.1 per cent.^24 Jumping forward 60 years, the rates were
    still even in 1971—24 per cent for males and only 8.3 per cent for females, according
    to the Gazette of India for UP.^25 Thirty years later, however, the literacy rates,
