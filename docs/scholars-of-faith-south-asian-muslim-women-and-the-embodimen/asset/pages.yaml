  md: '# 2


    JAMI’A NUR AL-SHARI’AT, A

    BARELWI GIRLS’ MADRASA IN

    UTTAR PRADESH, INDIA


    A Muslim has to follow the shari’a, the first step of which is to offer prayer
    (namaz) regularly. If you don’t take the first step, how can you climb the ladder?


    > —Sayyad Sahib, December 2014


    # Jami’a Nur al-Shari’at and Its Founder


    Located in the small, west Uttar Pradesh (UP) town of Shahjahanpur, the madrasa
    Jami’a Nur al-Shari’at, as I am calling it (this is not its real name), in October
    2013 had about 300 girls in the boarding school, in addition to a handful of girls
    who studied during the day returned home at the end of classes. Two distinctive
    features of the madrasa are its denominational affiliation and its rural, largely
    working-class background. In denominational terms, the founder and students self-identify
    as Barelwi Sunni Muslims. Also noteworthy is the fact that most the students of
    this madrasa come from either rural families in west UP and neighbouring Indian
    states or from small towns such as Shahjahanpur, with a small number coming from
    larger cities. In many cases, the girls’ parents have not studied beyond primary
    school. However, as I discuss in this book, they have invested heavily in the
    education of their children, both boys and girls.


    Scholars of Faith. Usha Sanya, Oxford University Press (2020).

    Oxford University Press. DOI: 10.1093/oso/97801910120801.001.'
