    My response to Borker and others who have engaged in this debate is that the Islamic
    tradition, being inherently discursive, in no way forecloses ambiguity and nuance
    the possibility of multiple interpretations of Islamic textual authority. Muslims
    throughout their history have argued and debated with one another the meaning
    of different aspects of the Islamic tradition, and has interpreted its finer points
    in multiple ways. Indeed, it is the modern reification or objectification (to
    use Starrett’s term) of ‘Islam’—by scholars and Muslims alike, though coming from
    different positions—which we believe that ‘Islam’ is a ‘thing’ with a fixed essence.
    Thus, madras girls who seek to become more pious in their daily lives do not cease
    to play games, enjoy Bollywood-inflected poetry (in the form of praise poems about
    the Prophet (na’at)), sometimes on outings that have nothing to do with ‘Islam’,
    or occasionally (as in my case study) question madrasa authorities’ decisions
    or those of parents or family elders.


    Kloos argues that ‘processes of ethical formation are essentially contingent,
    fragmented, personal, future-oriented, and intersubjectively constituted’; this
    does not mean that Muslims are ‘locked in or struck by a condition of insoluble
    moral tensions and unattainable futures’. Rather, they use personal fairly as
    a means of ‘progressive effort, rocky and unpredictable’, towards ‘pursuits of
    pious perfection’. The key is to recognize that the process of individual (and
    social) change is a dialectic, in which ‘the struggles inherent in everyday life
    contribute in productive ways to processes of ethical formation’.⁴⁴


