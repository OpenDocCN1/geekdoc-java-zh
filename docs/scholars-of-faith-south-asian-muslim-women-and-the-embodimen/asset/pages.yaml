    # Analysis


    Of the two classes I have presented above, the format of the first is typical
    of the madrasa classes I observed, while the second is more fluid and raises a
    different set of issues. Structurally, the first class had a tripartite structure,
    as did all the ''Alima and Fazila classes I observed. During the first 10 minutes
    of the 35–40-minute class, the teachers of classes at all levels called upon one
    or a few randomly selected students by name to answer questions relating to the
    previous day''s class material. The student would stand up, respond to the question
    from memory and when the teacher asked her to explain in her own words the meaning
    of the words she had just read or recited, she was required to show her understanding
    of the text by doing so.'
