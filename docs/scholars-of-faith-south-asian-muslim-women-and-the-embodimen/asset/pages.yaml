  md: '# Attachment to School 169


    of nationalism in schoolchildren.¹ Where studies on Muslim wom-ens education as
    Minault’s Secluded Scholars and Winkelmann’s ‘From Behind the Curtain’ emphasize
    self-control and the restraint of passion, this work focuses on how passion is
    channeled in certain directions to produce a certain kind of citizen. Beni uses
    the concepts of sensorium and embodiment to understand how schoolchildren come
    to feel Maharashtrian and Indian, where these identities are implicitly identified
    as Hindu and the nation is gendered feminine. She examines the patriotic songs
    by schoolchildren during morning assembly, the use of standardized Marathi at
    school, school textbooks, fieldtrips to historic sites that evoke Shivaji’s defence
    of the ‘Maratha nation’, and, most tellingly, student drawings, to show how attachment
    to a Hindu Indian nation is constructed.


    In this chapter, I draw on Beni’s insights as well as on Gennep’s concept of incorporation²
    to examine how the madras creates a sense of belonging in its students. I do this
    by looking closely at the daily prayer ritual and morning assembly or du’a, the
    latter a daily event on any school day, and at the weekly anuman, a student programme
    to which reference was made in Chapter 2.³ What emotions do these rituals evoke
    the students, and how do these emotions bind them more closely to the school?
