  md: '# Rites of Incorporation at the Madrasa: The Fajr Namaz, Du’a, and Anjuman


    In the previous chapter, I portrayed the course of a regular school day at the
    madrasa, starting with early morning prayer, morning assembly, and a few sample
    classes. Here I will to convey the subjective experience of the first two of these
    daily rituals, namely, the morning prayer and assembly, as I observed in 2015
    and 2016 after the madrasa had transferred to its more spacious new location.
    I was able to witness these everyday events from my vantage point in the teachers''
    staff room, which doubles up as their dormitory at night. The teachers had made
    space for me to sleep and set down my small suitcase in a corner of their large
    room.


    Every morning, the muezzin calls the Muslim faithful to perform the dawn (fajr)
    prayer. His voice rings out in melodious Arabic over a loudspeaker from a noisy
    mosque. It comes across loud and clear in the dark, about 5:30 a.m. in the morning.
    All is quiet, everyone is asleep in the teachers'' staff-room-cum-dormitory. Soon
    someone stirs, adjusts her scarf over her head, silently stands and straightens
    her kameez, and steps into her flip flops. Unlatching the locked door which leads
    into a wide well-lit hallway outside, she steps out and walks down, knocking loudly
    and urgently on each classroom door to wake up the sleeping students. This duty
    falls to a different teacher each morning. She has to go upstairs to the first
    floor and repeat the process. Then, coming back, she wakes anyone still sleeping
    in the staff room, and toothbrush and toothpaste in hand, makes her way to the
    bathrooms on the other side of the hall from the classrooms, to brush her teeth
    and do her ablutions (wudu). Not a word is spoken as others follow suit. After
    the shuffling of feet and the sound of splashing water from the direction of the
    bathrooms become loud and insistent. Some use the hand pump in the open courtyard
    in front of the building, under a dimly lit sky, and pump out water for each other.
    Cupping their hands under the tap, they splash the cool water over their faces
    and the tops of their heads, and their arms, legs, and bare feet in the prescribed
    manner. Then, the dampness still clinging to their hands and feet—for they do
    not towel themselves dry—they return to their classrooms where each have their
    own small rectangular prayer'
