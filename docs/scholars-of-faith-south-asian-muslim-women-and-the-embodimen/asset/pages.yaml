    hear one another talk, except briefly as described earlier, and again in the small
    groups which they participated on a regular basis once a week through Skype. Although
    students quickly learned to recognize the voices of the teachers, they were almost
    completely unfamiliar with those of their fellow students. The way one ‘knew’
    one’s students in this online environment was quite different from the way one
    gets to know other people in a physical classroom. Yet—given that this was a long
    course, lasting three-and-a-half years (or one-and-a-half for full-time students)—people
    did of course form close relationships.


    During the four hours of class, students and teachers communicated almost always
    by typing comments, responses, or questions on the computer screen. These hastily
    typed messages—the subject of which was almost always occasioned by the circumstances
    at hand—were the means for the creation of a new kind of community among the students,
    and between them and the onsite teachers and moderator, former students of Al-Huda’s
    Taleem Al-Quran course, a few years senior to them in terms of their association
    with Al-Huda. As time went, some students took a more active role in the class
    and emerged as leaders, helping others who, having joined after the start of the
    course, were struggling to catch up, or those who were less knowledgeable than
    they. Friendships also formed, particularly among students who lived in the same
    city or geographically close to one another.


    All the students were women, and almost all of them were South Asian origin. Their
    families’ first language was either Urdu or one of the other South Asian languages,
    such as Punjabi, Kashmiri, Sinhala, or Telugu. For none of them was Arabic their
    native language. The need to master the intricacies of Arabic in order to fully
    understand the Quranic text gave rise, to a deepening sense of appreciation for
