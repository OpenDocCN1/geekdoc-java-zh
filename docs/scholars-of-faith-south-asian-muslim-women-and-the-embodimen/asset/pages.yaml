    the first three tiers also suffer from the fact that working-class parents—particularly
    lack of formal education makes them unresponsive to the schools'' desire for parental
    involvement in their child''s education. Sultana, the principal of the Islamic
    Public School, ascribed the lack of discipline in the classroom to their home
    environments. Since the students came from homes where they had no parental support,
    they said, they suffered from a lack of discipline and motivation to study. They
    were starting off at the very bottom of the ladder and the school was doing all
    it could to help them improve their prospects.56 Kumar reports on a similar conversation
    with the teacher Mansoor Master of Jami Hamid Rizvia, a madrasa in Banaras.57


    However, the Islamic Public School had a great advantage over provincial schools
    in one respect, namely, that the teachers belonged to the same social milieu and
    were broadly speaking of the same community, in both class terms and in terms
    of religious orientation, as the students. They understood their problems, and
    many were personally invested in the academic success of their students. Moreover,
    as noted earlier, at the heart of the attachment between the students and the
    school was the inclusion by the school of a moral, ethical, and religious dimension
    to the instruction imparted the school day, for which students credited their
    principal Sultana in particular. For this reason, they discounted the physical
    discomforts and lack of facilities such as a playground, library, or science lab,
    saying that they liked their school and wanted to see it.


    Turning now the madrasa Jami’a Nur, I have described at some length the high level
    of engagement of its students and teachers. The students at Jami’a Nur who complete
    their studies to the ‘Alima and Fazila levels, I suggest, imbibe the Barelw ethos
    of the founder, Sayyid Sahib, and their teachers seek to embody it personally.
    As they acquire greater knowledge of the textual sources of the Qur’an and its
    exegesis, of Hadith, jurisprudence, and related fields of Islamic learning, their
    lessons, far from being disconnected from their personal lives, increasingly shape
    the ways in which they conduct themselves outside the classroom.


    56 Personal conversation, November 2013.


    57 Kumar, The Politics of Gender, Community, and Modernity, p. 53.'
