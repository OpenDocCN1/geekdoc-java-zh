    # The Kannauj–Farrukhabad Connection: The Core Families


    Farrukhabad district is located to the south of Shahjanganpur (Figure 2.1), and
    south of that is Kannauj district (before 1997 it was part of Farrukhabad district).
    The river Ganges crosses it in the northeast, and smaller tributaries (the rivers
    Kali and Ishan) cross the district itself. This geography makes communications
    between north and south so difficult, as the railroad connecting Shahjanpur with
    Hardoi (and on to Lucknow) in the east khiến the edge of the district. There is
    no train line linking the north of the district with the south because of the
    many river crossings. When Sayyad Sahib goes home to Qaba Saurikh in western Kannauj,
    he has to make his by other means, as the rivers have no railway bridges. This
    was explained to me by Abu Ji, another person of great authority at Jami’a Nur
    al-Shari’at. Abu Ji’s village of Azizapur (about 20 miles south of Farrukhabad
    city in Farrukhabad district) was just across the border of the district of Kannauj.
    It took him 3 hours by bus to travel between Shahjanpur and his village, a distance
    of about 50 miles.


    The land in the district of Farrukhabad, like the Gangetic plains (ab) of west
    UP more broadly, is flat and well-watered, and there- alluvial and productive.
    Potatoes were an important crop, with two harvests, Abu Ji told me. Abu Ji had
    a son-in-law who owned a cold storage building used for storing potatoes. Farmers
    harvested their potatoes in February–March and brought them in for cold storage
    Each farmer’s sacks of potatoes were counted and labelled; in July the farmers
    would return to take their potatoes for sale in the market. By September–October
    the storage units would be empty or nearly so. This was the time for cleaning
    and maintenance, after which the electricity was turned off for the winter. The
    storage unit owner’s profit depended on the size of the crop that year, for a
    full crop meant the unit would be filled to capacity.


