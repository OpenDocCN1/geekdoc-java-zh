    madrasa had taught them. Indeed, as many studies have noted, teaching in general
    is a popular profession among South Asian women of all religious communities as
    it offers a mode of paid employment which does not require them to make a radical
    break from societal norms for women. Instead, it offers them a means of working
    outside the home in a safe environment while keeping them connected to caretaking
    and domestic roles that they and their families expect them to fulfill. In addition,
    Latika Gupta points to the aspirational aspect of a girl’s expressed desire to
    teach. It allows her to think of herself as becoming a different kind of person
    from her mother, and of being special in a way she is not. But it is an ‘accommodated
    distinction’, to use Gupta’s phrase, because it allows her to stretch the family’s
    norms of what it considers appropriate female behaviour, and not too much, beyond
    what society will permit.


    Gupta’s fieldwork was conducted in a secular government-aided school for Muslim
    girls in Old Delhi, similar in some respects to the Islamic Public School I discussed
    in Chapter 4. As I noted, many students at the Islamic Public school felt disconnected
    from the formal curriculum of which many appreciated the most was the school’s
    instruction in matters related to religion and morality, which is a class offered
    at the Islamic Public School but not required by the UP state government. However,
    the students and teachers at Jam’a Nur displayed a high level of motivation and
    self-discipline for the reasons I explored in Chapter 4. I suggested that the
    subjects of the madrasa curriculum and ethos of the madrasa itself connected them
    with something larger than themselves, namely, the Islamic tradition and the Islamic
    past, which gave them a sense of pride in their identity as Muslim girls. The
    motivation for their desire to teach was somewhat different as well. While at
    one level it could have been linked to a desire to postpone marriage by a few
    years and chart a path that would be different from that of their mothers, I believe
    it also has a strong moral component centred on individual ethics, reform, and
    self-fashioning.


