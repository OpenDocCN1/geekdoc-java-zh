    Attendance is taken soon after the exchange of greetings, with each student’s
    name being called out in quick succession. Each student responds by typing a ‘1’
    to indicate that she is present. Sometimes she also types in her ‘group name’
    after the 1. All students are divided into groups of about six or seven and meet
    with their group mates under the supervision of a group leader later in the week
    to review the previous week’s lessons. The group meeting is a smaller, more intimate
    setting than the regular class, and schedules are more flexible as well, accommodation
    readily made for students who have urgent family obligations to attend to. (This
    is, in fact, a good way to make friends and get to know one another.) Almost all
    the groups are named after one of the wives of Prophet Muhammad: thus, there is
    a Group Khadija, Group Sauda, Group Aisha, and so on (Group Fatima is the exception,
    being named after the Prophet’s daughter.)


    The first class of the day, Qur’an recitation (tajwid), in which students listen
    to Arabic recitation of the current lesson, is usually conducted by a coordinator
    (or moderator) located in the US. When the course began, a teacher from India,
    soft-spoken but firm in her, would recite each verse herself, twice over, in real
    time, asking students to listen the first time and recite with the second round.
    However, after several months she switched to having students listen to a well-known
    Qur’an reciter (qari) instead. This part of the class lasts 15–20 minutes.


    The recitation might be followed by a class on how to write. At the beginning
    of the course, students learned Arabic pronunciation (makhari) of the different
    letters of the alphabet, with an emphasis on correct vocalization techniques.
    Midway through the course, though, the teacher introduced a new class, rules of
    Qur’anic recitation, a rather technical and difficult subject. Periodically she
    tests students’ recitation skills, asking them to come up to the microphone and
    recite ‘in front of’ the rest of the class. Everyone listens carefully, and at
    the end of the short recitation the teacher corrects her mistakes, though she
    is also careful to praise her for her overall performance. These tests are graded.


    The first part of the class usually lasts about 45 minutes, after which the tajwid
    teacher bids the students good-bye and signs off after saying a short prayer.
    Since she is in India, it is close to midnight for her. She also has a three-year-old
    baby girl. It is time for them to go to bed.'
