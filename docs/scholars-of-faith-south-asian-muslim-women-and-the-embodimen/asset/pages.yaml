    # Continuities between the Madrasa and the Home


    In our article ‘Discipline and Nurture'', Farah and I argue that the madrasa is
    a place not of discipline but also of nurture, which encourages students to develop
    a habitus through predictable routines and responsibilities throughout the day.
    The students'' relationships with Sayyid Sahib and the wardens are touched in
    terms of festive kinship, and the titles Abba Huzoor, Khala Ammi and Baji, among
    others, indicate. These kinship terms capture the dual aspects of respect authority
    figures—ordiscipline''—on the one hand, and affection and trust—or ''nurture''—on
    the other. The institution of the madrasa thus creates new relationships between
    students and their teachers and elders, who, by coaching them in familial terms.
    As Minault notes, the ‘Indian extended family [has the] ability to expand indefinitely
