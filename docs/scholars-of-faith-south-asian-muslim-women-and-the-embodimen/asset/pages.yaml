    In Chapter 8, I ask how, concretely, social change occurs at the level of the
    everyday among a geographically dispersed set of Muslim women studying the Qur’an.
    I try to answer the question by closely analysing Al-Huda’s messages for women
    in terms of family and community relationships through examination of Farhat Hashmi’s
    use of language over an extended period (the mid-1990s to 2005). Seeing Hashmi
    as a leader who engages in ‘cultural translation’, I try to understand how she
    makes the seventh-century Qur’anic content relevant to the lives of twenty-first-century
    South Asian women in the diaspora. The chapter then examines onsite classes in
    Mississauga, Toronto, and online classes through the lens of other teachers—referring
    to them as teacher-learners, to highlight their continuing engagement in Islamic
    learning—especially Taimiyyah Zubair, and the work of Shazia Nawaz at the Testing
    Center in Hurst, Texas, without which the online classes would not be possible.


    Chapter 9 turns to the students of Al-Huda classes, both onsite and online. Most
    of those who spoke with me were young adults, some married with children, some
    college students, and some professional women. Whether living in North America,
    Europe, or South Asia, they were drawn to deepening their engagement with the
    Qur’an on account lifecycle changes such as the birth of children and the desire
    to give them a religious education, or social isolation resulting from family
    migration, or simply out of curiosity. They all reported deriving strength from
    their deepening engagement with the Qur’an. Bilingual in English and a South Asian
    language, they were educated middleclass women discovering the Qur’an through
    Al-Huda classes. All had chosen to live a more orthodox lifestyle in accordance
    with what they learned in Al-Huda classes. But in order to succeed, I argue, they
    had to get their families’ support. They had to da’wa. In this chapter, I examine
    their life stories in the light of ‘precarity’ and gendered Islamophobia as articulated
