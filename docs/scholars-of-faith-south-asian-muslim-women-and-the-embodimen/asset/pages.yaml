    rug. Spreading it out on the bare cement floor (or, for teachers in the staff
    room, one of the wooden beds on which the teachers sleep), each student and teacher
    starts their prayer while facing the qibla, the direction of Mecca.


    The morning prayer, preparations for which are largely conducted in silence or
    in muted voices, is an individual ritual among teachers and students, no one leading
    the others, though they may choose to spread out their prayer rugs next to one
    another. As they do not all begin at the same time, they complete the ritual at
    different times during the course of the next half hour. The only ones who exempt
    themselves are those who are menstruating; they may sleep little longer than the
    others, brush their teeth and use the extra time to straighten out their clothes,
    comb their hair, and get ready for the day. In the staff room, once the prayer
    has been offered, each teacher reaches for a copy of the Qur’an and for the next
    10 minutes or so, reads a section of it to herself in a low voice, opening to
    whichever chapter she left off at the day before, and rocking gently and forth
    as she seeks. Only after this is done and she has the book back on the shelf she
    turns to the others in the room and engage in conversation.


    One of the teachers squats down on the floor of the little stove in the staff
    room and puts a cup of hot tea in her hands. She gives me a big smile, then hurries
    to prepare for the day. These preparations include personal grooming and hygiene,
    having a light breakfast, and on occasion reviewing the text to be taught in the
    first class period, before the bell rings for morning assembly in the open courtyard.
    Unlike the transition to prayer readiness through wudu’, however, the transition
    to the preoccupations of the day is seamless, unmarked by ceremony.


    This predictable daily cycle of activities sets the tone for the school day. The
    prayer is notable for its relative silence and the inward focus of each person
    on their ritual responsibilities, communicating with God in full awareness of,
    but distance from, the others around her. The entrance into a state of ritual
    purity follows prescribed rules. The wudu’, as Maghen writes, is a portal, a ‘door
    through which the believer passes many times daily between a condition appropriate
    to the bodily and a condition appropriate to the disembodied; between awareness
    of the tangible present and awareness of the incorporeal'
