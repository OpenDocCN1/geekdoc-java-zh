    fiqh; Arabic grammar and literature; and secondarily, Persian, Urdu, rhetoric,
    logic, and philosophy. In addition, English, maths, and computer science have
    become standard modern additions at a number of South Asian madrasas, as doing
    so them to gain Government of India recognition of their degrees and facilitates
    the transition of some madras students into the educational mainstream.


    The differences are also notable, as may be seen by comparing the books used in
    the Jami’at al-Salehat and those used in the Madrasatul Niswan—and in the next
    chapter, those in the Jami’a Nur al-Shari’at—because of their different maslak
    identities. Thus, the Jami’at al-Salehat wants its students to be well-versed
    in the writings of Maulana Abul A’la Mawdudi, the founder of the Jama’at-Islami,
    while the Madrasatul Niswan teaches the Faza’li ‘Amal, a Tablighi text, and to
    a more limited extent the Bihis Zewar, an important Deobandi book meant primarily
    for women, who also read by them. When we look at the syllabus of the Jami’a Nur
    al-Shari’at in the following chapter, we will see that they use the Sunni Bihis
    Zewar and the Jannati Zewar, which are Barel texts for women. Likewise, the Urdu
    translations of the Qur’an used by the different madaras are also different, and
    are indicative of the ideological positioning of the authors.


    It should also be noted, however that that there is some overlap between the different
    groups. Thus, in the cases examined here, the Jami’at al-Salehat and the Madrasatul
    Niswan use books written by Maulana Abul Hasan ‘Ali Nadwi. This would indicate
    that the Jami’at al-Shari’at and extension they feel share common ground with
    the Nadwa, despite differences on particular issues such as the acceptance (taqlid)
    or nonaceptance of rulings by the Hanafi school.65 Likewise, the omission by the
    Jami’at al-Salehat of the Deobandi work Bihishti Zewar is indicative of the Jama’at-Islami’s
    perceived ideological distance from the Deobandi school of thought. The fact that
    the Madrasatul Niswan, with its Tablighi ties, would use the Bihishti Zewar comes
    as no surprise, as the Tablighi Jama’at has close ties with Deoband. However,
    its use of Mawana


