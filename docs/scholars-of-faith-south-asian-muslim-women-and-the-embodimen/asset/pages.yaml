    But realistic were their expectations? Nita Kumar has written insightfully on
    Indian public and private education in Banaras and Kolkata in her book The Politics
    of Gender, Community, and Modernity (2011). She places all the Banaras schools
    in four tiers: at the lowest rung, in her view, the government municipal schools;
    then follow the English-language schools, which have the ‘outward tracing[s] and
    paraphernalia’ of ‘convent schools’ but none of their educational philosophy or
    teacher training, and more marginally better; then the madrasas, themselves internally
    distinguished by maslaki orientation (Barelwi, Deobandi, and so on) by their affiliation
    with the Basic Shiksha Parish and the UP Madrasa Board:for every hundred students
    educated in the latter, religious system, some thousand are educated in the secular,
    nationalist system’.⁵¹Schools in the fourth tier, that of the elite missionary
    or English-public schools, which opens doors to professional middle-class jobs,
    are only available in the metropolitan cities. Jami’a Nur and the Islamic Public
    School, in light of this analysis, belong to the second and third tiers, respectively.


    Judging by Kumar’s diagnosis of the problems of Indian education, the bulk of
    Indian schools—largely those of the first three tiers—suffer from the structural
    limitations of what she calls ‘provincialism’.⁵²These schools are characterized
    by ‘incompleteness’ at several levels. In terms of the physical space they occupy,
    they are often located in repurposed private homes rather than in buildings constructed
    as schools, and are characterized by ‘overcrowded rooms with inadequate light
    and air’. Not only does the child have to suffer the pain of sitting in such rooms
    through the school day, but he or she is subjected to a meaningless curriculum
    as well as ‘a] body trapped in synthetic uniforms and badges, threatened by the
    ogres of homework and


    > ⁵¹ Nita Kumar, The Politics of Gender, Community, and Modernity: Essays on Education
    in India (New Delhi: Oxford University Press, 2011). The quotas are from pp. 62
    and 90.


    > ⁵² On this term and its ramifications, see Kumar, The Politics of Gender, Community,
    and Modernity, Chapter 1.'
