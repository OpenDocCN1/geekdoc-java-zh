    examinations, altogether victim to overdisciplining’.53 The tragedy of it all
    is that *this disciplining is for nothing* because the ‘students of provincial
    schools are denied the rewards of the national–global’. And in a circular loop
    that appears to justify their exclusion, the products of these schools fail to
    become the ‘inwardly directed’ modern citizens and embodiments of the ‘minimal
    virtues of punctuality, uprightness, and masculinity’ that the system intended
    to become.54


    If on the one hand, the Islamic Public School may be raising some students’ expectations
    unduly high, the greater problem seems to be that most students are not engaged
    and motivated to learn. Kumar, who describes Banaras schools in his ethnography,
    agrees this problem to the schools’ failure to connect the formal educational
    syllabus with the lives of the students and their families, and the exclusion
    of their local histories from the national historical narrative. This is where
    Kumar’s observations and mine converge strongly. My conversations with students
    and teachers observed classroom interaction suggested apathy on the part of many
    teachers—and a sense of frustration from wanting to do more—and lack of interest
    on the part of many students at the Islamic Public School. Similar observations
    have been made by others. Latika Gupta’s ethnography of a Muslim girls’ school
    in Darya Ganj, Delhi, also speaks of apathy and students’ lack of interest in
    their school work, although home the girls defended their right to go to school
    when their parents questioned the utility of educating girls beyond the eighth
    grade. Going to school gave them a precious means of escaping the surveillance
    of parents, making friends with other girls their age, and most importantly, postponing
    marriage by a few years.55


    As Kumar notes, there is much blame to go around in the state–family–school triad,
    beginning with the fact that most state and local schools, whether public or private,
    are chronically underfunded and understaffed, and have been since colonial times.
