    # A Morning at the Madrasa: Going to Class


    In June 2012, many madrasa students slept outdoors on the flat, open rooftop of
    the madrasa building. As always, their day started with the first sounds of the
    call to prayer:


    +   4:45 a.m.: Flip-flops shuffle down the steps from the rooftop of the school
    building as the girls make their way downstairs to their rooms. Flip-flop, flip-flop
    ... over a hundred pairs of feet.


    +   5 a.m.: The muezzin intones the morning azan from a mosque close by.


    Flies begin to make it impossible to sleep outside anywhere; beds and bedding
    need to be move indoors and try to catch a little more sleep.


    +   6 a.m.: The public address system comes to life: ''Sadia, your parents are
    on the line'', and Sadia make her way to the warden'' room. And so on, for the
    next hour or so again in the evening. Students are not allowed to use individual
    cell phones at school.


    +   6:30 a.m.: The whole building is abuzz with morning activity as students roll
    their bedding, stacking by the walls of their classrooms; wash their faces; brush
    their hair; wear their uniforms; and eat breakfast.


