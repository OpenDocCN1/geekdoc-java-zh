  md: '# Scholars of Faith


    of ''functionalization'', I see this clearly at work in Al-Huda. Chapter 8, which
    explores Farhat Hashmi’s use of language, shows how the process of functionalization
    unfolds in his discourse. A notable example is in his discussions of science and
    scientific knowledge, which believes are implicitly hinted at specific verses
    in the Qur’an.


    The internal dynamics of the two institutions take us to the local contexts in
    which they arise and are currently functioning. Here, the Muslim concept of ''being
    in the moderate middle'' is helped as. As Neal Robinson points out, ''the numerical
    centre'' (in verse 143) of the second chapter of the Qur’an—the longest of all
    114 chapters—is a reference to the Muslims as a ''middle nation'' (ummatan wasatan).
    For Muslims there could of course no greater source of authority than the Qur’an,
    and thus it is no surprise that many Muslim groups claimed the voted ''middle''
    ground for themselves, while denying it to others around. The Sunni denomination
    of which the madrasa explored in this book belongs is that of the Barelwis (more
    formally known as the Ahl-i Sunnat Jama’at [people of the prophetic way and the
    community]). Madrasa’s director sees his denomination as being between extremes:
    those who belittle the Prophet Muhammad on the one hand (the reference to other
    South Asian denominations) whom the Barelwis generically label as¹). Madrasa students
    at a girls’ madrasa in Delhi, according to Booker, position themselves as being
    in a different kind of ''middle'': between women who like their mothers, are uneducated
    (jahil, unparh) and modern, secular schoolgirls who do not observe the rules of
    female secular (pardah).¹⁴ They regard themselves as embodying the ideal between
    these extremes. Al-Huda International, which has been offering onsite and online
    Qur’an classes for women in Pakistan and internationally since the early 1990s,
    likewise thinks of itself as being in the middle, in this case self-identifying
    with the


    > ³ Neal Robinson, Discovering the Qur’an: A Contemporary Approach to a Veiled
    Text (2nd edn, Washington: Georgetown University Press, 2003), p. 201.


    > ⁴ Hem Booker, Madrasas and the Making of Islamic Womanhood (New Delhi: Oxford
    University Press, 2018), p. 192. Booker points out, though, that the madrasa students
    criticized the ‘modern, secular’ students, they also envied them and wished to
    be like them.'
