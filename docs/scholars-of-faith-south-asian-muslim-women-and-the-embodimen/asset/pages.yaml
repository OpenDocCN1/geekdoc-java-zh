    Usha Sanyal (US): Who asked you to do it? The ‘ulama’ or the people?


    SS: You know the ‘alama’. They don''t like me. It was the ordinary people. With
    the ‘ulama, it’s all about desire for fame, wealth, and power. Although I get
    along with them, I don''t have close relations with them.


    As a Sayyid, I was not allowed to take zakat money. So, I used to spend a lot
    of time travelling to raise money for the madrasas. Sayyid give a [donation] when
    they see you, but if they don''t see you, they don''t give you. I am talking of
    poor people who give small donations. Rich people, and government and public officials,
    are willing to give, but they want to take a commission.


    Although Sayyid Sahib distanced himself from the Barelwi ‘ulama in the conversation,
    his own background and occupation—teaching Hadith, Qur exeegesis, and Sufism (tasawwuf)
    in his boys madrasa—was much more that of an Islamic scholar (‘alim). Rather than
    excluding himself from the category, he was drawing a line between Barelwi ‘ulama
    with whom he had differences, and himself. In his characteristically understated
    way, he was indicating to where he stood in the intra-Barelwi politics centered
    on Bareilly, not far from Shahjahanpur.


    Sayyid Sahib’s other distancing in this conversation, less surprisingly, an inter-denominational
    (maslaki) indicating his differences with the Deobands. It is, therefore, particularly
    noteworthy that a Deobandi scholar writing a history of the ‘ulama of Shahjahanpur,
    writes about Sayyid Sahib in the following terms:


    He is a man of great intelligence and integrity. the mawlana is a-penetrating
    intellect, and the point is to ritual purity, kind of good character, a follower
    of the sunna, and conciliatory in every respect. In the field of knowledge, his
    efforts and service are most praeworthy. He has made the spread of knowledge goal
    and purpose, and has already done a lot in this field. He established a madrasa
    in Qasba Nariya in Pilibhit, and built an impressive two-storey building in [Shahjahanpur]
    for his boys’ madrasa. But his thirst for knowledge was not satisfied. After a
    few years he laid the foundation for a girls’ madrasa, today is operating with
    great success.


    > Shah Mahmud ‘Ali Khan, Sar-zamin-in Shahjahanpur ke ‘Ulama-i Fuhul, Huffaz,
    o Qura’ (Shahjahanpur: n.p., 2014), pp. 168–9 (my translation).'
