    own. Thus, the founders of the Dar al-‘Ulum madrasa in the 1860s changed the original
    Farangi Mahal emphasis on ‘rational’ sciences to one on Hadith and fiqh.68 Likewise,
    other ‘ulama have changed the weight given to different subjects and the assigned
    texts for these subjects as well.


    Borker’s work on Madrasa Jamiatul Mominat, a Tablighi Jama’at madrasa near Jamia
    Millia Islamia in Delhi, largely confirms Winkelmann’s findings—and mine in this
    study. However, there are two features in Borker’s ethnography which are not absent
    in Winkelmann’s work and mine. The first of these is her documentation of student
    performances through skits at the madrasa during Republic Day (26 January) celebrations,
    seeking to show the relevance of pardah in the aftermath of the gang rape of a
    young woman on a bus in Delhi in December 2012. Such discourse, connecting the
    practice of pardah with contemporary issues around the safety risks to women in
    urban spaces in India in an effort to demonstrate the value and relevance of pardah,
    is a powerful counterargument by these girls’ madrasa to the stereotype of pardah
    as a signifier of backwardness.


    The second is Borker’ chapter on madrasa girls who choose to go on to university
    by enrolling in Jamia Millia Islamia. This chapter is valuable for its insights
    into students’ and students’ parents’ perception of university education as a
    very different kind of space, one which parents in particular view with considerable
    unease. Borker’s ethnography illustrates the sharp contrast students draw between
    their experience of studying in a madrasa versus a university, and cautions against
    assuming a single trajectory for Muslim girls with a madrasa education. A few
    madrasa students aspire for a university education and the expanded horizons it
    promises, as Borker shows. Her exploration of the difficulties these students
    encountered at a number of levels—with parents, faculty, and male students—and
    their stoic and patient endurance of bullying in the classroom by many students,
    some of whom were former madrasa students, illustrates the strength of girls’
    madrasa education


