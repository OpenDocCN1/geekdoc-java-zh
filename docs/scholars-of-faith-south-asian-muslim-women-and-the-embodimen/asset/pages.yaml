    It is characteristic of Farhat Hashmi’s pedagogical style that in explaining a
    set of Quranic verses like the ones cited earlier in the chapter, she would bring
    in information from the fields of science, technology, and psychology, and would
    use them to raise moral and spiritual questions of direct relevance to the students.
    This approach, I would argue, accounts in large part for the appeal she has for
    students, in that she is able to show how the Qur’an speaks to all aspects of
    life and can guide contemporary Muslims through life if they heed its lessons.
    Farhat Hashmi’s own interest in and embrace of the world of science and technology
    in the service of a life lived in accordance with the teachings of the Qur’an
    also shows students that they can be orthopra Muslims and modern, tech-savvy women
    at the time.


    Indeed, taking this step further, one might argue that Farhat Hashmi as a practicing
    Muslim seeks to identify herself as fully as she can of new discoveries and research
    in the sciences, no matter what their specific discipline, because by doing so
    she can better understand what the Qur’an says about different subjects, particularly
    those relating to the natural world. Maurice Bucaille, whose work Hashmi approves,²
    argues not only that the Qur’an contains accurate information about the natural
    world which predates scientific knowledge by several centuries, but in order to
    understand the Qur’an fully, one needs to be a scientist:


    It is easy to see ... for centuries commentators on the Qur’an (including those
    writing at the height of Islamic culture) have inevitably made errors of interpretation
    in the case of certain verses whose exact meaning could not have been grasped.
    It was not until much later, at a period far from our own, that it was possible
