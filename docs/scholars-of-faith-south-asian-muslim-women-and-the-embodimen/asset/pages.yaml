    Scholars of Faith


    If discipline is central to the madrasa''s purpose, it is the girls’ ‘will-ingness
    to be taught’, to use Saba Mahmood’s apt phrase, that allows that purpose to be
    realized.⁶³ As Winkelmann notes, the students’ very ‘docility’ and acquiescence
    to authority should therefore be seen as a form of agency. Likewise, the pardah-observing
    woman moving about in public space is also actively ‘participating’ in the public
    sphere, even though such participation is not her primary purpose. Some scholars
    would say that they constitute a ‘subaltern counterpublic’, that is, a ‘parallel
    discourse arena where subordinated groups invent and circulate counterdiscourses
    to formulate oppositional interpretations of their identities, interests and needs’⁶⁴


    # Some Thoughts on the Curriculum of Girls’ Madrasas


    This chapter has looked at a number of different kinds of education for Muslim
    girls in South Asia over the course of the twentieth century, beginning with home
    schooling at the start of the period to the tentative move towards institutional
    forms of learning in the 1920s and 1930s. Let me conclude with a few observations
    about the syllabus of girls’ madrasas. First, the syllabus of two very different
    girls’ madrasas, as indicated later in the chapter, show that the textbooks chosen
    for inclusion are at one level the same and at another level, depending on the
    denomination (maslak) of the madrasa. The similarity in the overall syllabus derives
    from the fact that girls’ madrasas are modelled on those for boys, and therefore
    follow in large part the d-ars-ni syllabus that dates back to the eighteenth century.
    The major subject areas of the d-ars-ni are primary; the Qur’an and sciences associated
    with Qur’anic study (recitation, exegesis, principles of exegesis), prophetic
    traditions (Hadith), Islamic law and its principles (fiqh and usul-


