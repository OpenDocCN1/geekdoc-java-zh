    While recognizing that the different aspects of Hashmi’s scholarship are closely
    related, perhaps we could summarize their respective studies by saying that Hashmi’s
    deals primarily with the transmission of Hadith—its many forms and methods, and
    their respective strengths and weaknesses in the eyes of her subject, al-Safi—while
    Zubair’s focuses on the accuracy of transmission one part of the Hadith, that
