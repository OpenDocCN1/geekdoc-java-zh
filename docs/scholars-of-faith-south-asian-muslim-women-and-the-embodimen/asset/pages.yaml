    Egypt, settled in Hamah and became, by royal appointment, the khatib (person who
    gives the sermon during the Friday congregational prayer) at the Jami’i al-Dahshah
    mosque in Hamah. This was a mosque with outstanding architectural features and
    a major library containing 7,000 volumes.³⁶ After the completion of his elementary
    education, Ibn Khatib, contemporary Hadith scholars, travelled ‘extensively’ in
    Syria and Egypt in order to study and ‘receive’ specific Hadith collections face-to-face
    from different scholars.³⁷ In time he acquired a scholarly reputation of his own,
    the result of teaching, issuing fatwas, and becoming an authority in Hadith, fiqh,
    and nahw (grammar). He was also a cultured man who wrote letters in verse to various
    scholars. For about 10 years he held the powerful position of qadi (judge) of
    Hamah, until his ousted when a new ruler came to power in 824 AH (1421 CE).³⁸
    died about 10 years later.


