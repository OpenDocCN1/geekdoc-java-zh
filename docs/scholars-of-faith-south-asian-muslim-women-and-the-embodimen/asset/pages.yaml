    In the context of Jami’a Nur and other girls’ madrasas, taharat deals with personal
    matters such as menstruation and sexuality, and their connection with ‘prayer-readiness’,
    to use Maghen’s term. According to Maghen, ‘Tahara, despite its prominent place
    in the Muslim ethos and considerable gift in the faq literature, is probably the
    single most neglected area in Western Islamic studies’.10 Yet he argues that in
    the legal literature, discussion of sexual issues is ‘never far removed’ from
    the discussion of religious ones, for the two are ‘integrally connected’. In order
    to pray, one must be ritually pure, performing the greater or the lesser of the
    two ablutions, either a full bath (ghusl) or washing of the face and limbs (wudu),
    depending on the state of one’s ritual impurity. Failure to perform the correct
    purity-restoring ablution threatens to invalidate one’s prayer. The Sunni Bihishti
    Zewar starts saying:


