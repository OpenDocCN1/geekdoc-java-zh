    Al-Huda International is a relatively new Muslim organization to have emerged
    in South Asia, having been founded in 1994 in Pakistan by Dr Farhat Hashmi and
    Dr Idris Zubair. It began modestly when, after giving birth to her son in 1994,
    Farhat Hashmi took maternity leave from her teaching job at the International
    Islamic University. While at home, she started teaching her children and their
    friends the Qur’an. According to one of her daughters, other people liked her
    lessons so much they asked her to teach them too. She decided to take a full year’s
    maternity leave and try teaching the Qur’an at home as an experiment. When the
    year was, instead of going back to her job at the university, she resigned and
    expanded her Qur’an classes. Al-Huda was born when Hashmi moved her classes to
    a building in Nazimabad, Islamabad.¹


    Since then, Al-Huda has spread rapidly to other parts of Pakistan and elsewhere
    in the world where the Pakistani diaspora is wellestablished, notably in Great
    Britain, Canada, and the United States, and parts of the Middle East. It is thus
    no surprise that it has attracted two book-length works already, Sadaf Ahmad’s
    Transforming Faith (2009) and Faiza Mushtaq’s PhD dissertation, ‘New Claimants
    to Religious Authority’ (2010).


    Al-Huda (literally, ‘the guidance’) is an organization for Muslim women with a
    straightforward and simple goal, namely, to teach Muslim women the Qur’an in the
    original Arabic and to understand its meaning, and beyond that, to encourage them
    to internalize its message and use it as a guide for personal ethical transformation.
    This goal may sound quite remarkable to outside observers—given that the Qur’an
    is the pre-eminent source of religious guidance for all Muslims everywhere and
    that its authority as the literal word of God is the bedrock of Muslim faith—the
    goal of teaching Pakistani women how to read it in Arabic is in both innovative
    and highly ambitious. Deed, as the vast majority of Muslims in non-Arabic speaking
    countries are unacquainted with Arabic and know only parts of the holy book by
    heart, the implications of such a movement for wider social change are immense.
    In the view of the founders of Al-Huda, if Muslim women (and all Muslims eventually)
    could read the Qur’an


    > ¹ This information is based on my personal conversation with Taiimiyah Zubair,
