    A little further, Shah Mahmud ''Ali Khan says:


    Ehsan Miyan has never made the Prophet''s pulpit (minbar) a wrestling arena (akhara).
    Rather, he has always protected its honour (htiram). He has never asked for a
    predetermined delivery for a speech, nor made it [the speech] an instrument with
    which to speak against people of other denominations (maslak). The purpose of
    his life is religious knowledge, the advancement of tawhid and the sunna, ...
    the rebuttal of reprehensible innovation (bid''a''). Despite the maslak-related
    differences (tazadd) between us, I have never felt that I was talking to an ''alim
    of opposing (mukhhalif) maslak. Because of his love of truth, misguided (be-rah)
    people of his own maslak don''t like him. And how could, when Sayyid Sahib is
    neither given cursing his opponents nor writing fatwas against them? ... Indeed,
    he is a man of Allah.


    This is a remarkable tribute to a Barelwi scholar by a Deobandi one. The last
    few sentences refer to the fact that Sayyid Ehsan Miyan has been criticized by
    the descendants of Maulana Ahmad Raza Khan. I will explore these internal politics
    later in this chapter.


    Sayyid Sahib is also pragmatic in his approach to politics, favouring the Bharatiya
    Janata Party candidate Suresh Khanna in Shahjahanpur, for example, the Congress
    Party''s Muslim one, Azam Khan, in the 2012 elections because the former responded
    positively when Sayyid Sahib and other Muslims had approached him on specific
    issues in the past. I learned that Sayyid Sahib had gone out of his way to help
    women whose families were unable or unwilling to provide for them, by employing
    them as servants in the madrasa. Although he was not involved in the day-to-day
    management of the girls'' madrasa, his leadership was key in terms of setting
    the tone and ensuring that the school operated on an even keel, with teachers
    and managers being on good terms with one another and knowing that they could
    turn to him for advice at any time cell phone.


    In the course of time, I came to learn something of the importance both of the
    geographical connection of the school management with the districts of Kannauj
    and Farrukhabad, and of Sufi networks in Sayyid Sahib''s fund-raising and school-building
    efforts. Both sets of relationships were strengthened by kinship terms: familial
    terms referring


