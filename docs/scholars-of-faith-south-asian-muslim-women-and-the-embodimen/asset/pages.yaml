    A further issue that greatly concerned al-Silafi—and Hadith scholars generally—was
    the nature of the isnnad, or chain of transmission, this being another important
    factor in determining the reliability of the Hadith. Even a Hadith that had been
    acquired by ijjaz to have a known is, for it was ‘the isnnad ... that connected
    a scholar to the Prophet and allowed him to act as an authoritative interpreter
    of Islam.’25 Further complexity was added over time, as books of Hadith were handed
    down rather than individual Hadith. These too came to chains of transmission from
    teacher to student, initially passed on orally but later in writing. By al-Silafi’s
    time, Hadiths with short chains of transmission, with fewer rather than more transmitters,
    had become particularly prized. Where initially the desire for short chains sprang
    from concerns with accuracy and authenticity (if there were fewer transmitters,
    the chances of error were reduced), over time the reason for wanting short chains
    was that the number of intermediaries oneself and the Prophet was smaller and
    therefore one closer to the Prophet both in authority and blessing.26 Al-Silafi
    notes in several of the Hadiths that they had an ‘elevated’ chain.27


    To conclude, Farhat Hashmi’s research on al-Silafi’s book establishes her mastery
    of a complex Arabic textual tradition. While al-Silafi is not well known in scholarly
    circles today, this unpublished manuscript raises issues that are important in
