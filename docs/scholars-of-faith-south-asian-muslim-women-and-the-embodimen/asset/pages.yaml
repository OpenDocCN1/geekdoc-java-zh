    # Classroom Discussions of the Fiqh of Taharat as It Relates to Women


    No discussion of the madrasa students'' education at Jami’a Nur would be complete
    without consideration of the central role played in it the fiqh of taharat, the
    jurisprudence of ritual purification, insofar as it relates to women. Taharat
    is discussed at every level of the madrasa curriculum, from the first year (‘Ula)
    through the sixth (Sadisa), with increasing levels of complexity. I found it discussed
    when I attended a second-year (Saniya) class on the Sunni Bihishti Zawar, as I
    had fully expected, but also in a fifth-year (Khamsa) class on the book of jurisprudence
    Hidaya, and a lesson on Quduri, another book of jurisprudence, among others. A
