    It being exam time when I did my first round of fieldwork in June 2012, students
    were no longer taking classes. In fact, they had two separate sets of exams: the
    first were state-mandated exams which students had to pass in order to satisfy
    UP state madarsa board requirements. These over, students had about two weeks''
    break before they gave a second set of exams, which teachers said were harder,
    set by them and graded in-school. The exam results would be given to each student
    before she left for her month-long Ramadan break. Students spent the fortnight
    reviewing the material with their teachers during the day and doing group study
    in the evenings. The teachers made up the exams and then spent several hours a
    day over the course of two or three days preparing detailed lists of where each
    student would be seated. The reason for this was that space being so tight, the
    teachers wanted to make sure that no one could look at her neighbour''s work while
    she was taking her test. So they scrambled the entire body in a way that students
    would sit next to other students from different classes, entirely different tests
    at the same time. Seniors and juniors would be seated side by side in accordance
    with the plan worked out by the teachers ahead of time.


    In the next section of this chapter, I turn the focus on the students themselves,
    so we can hear their voices directly and see the madarsa from their perspective.


    # Students and Student Life


    The girls who attended the madarsa were largely rural and many were from poor
    families. Their monthly fees in 2012 were low, at INR 500 per month (equivalent
    to less than USD 10 at the time of writing), which covered board and lodging,
    as well as tuition. Since some students'' parents could not afford even much,
    the school had reduced fees for some, and yet others paid no fees whatsoever.
    The school was constantly stretched for funds. Administrators made up some of
    the shortfall by drawing funds from the English-language school, which had higher
    fees even though it was a day school.


    As mentioned, space was very tight at the madarsa. All the classrooms were on
    the second floor of the building. Students stored their personal belongings in
    trunks arranged in neat rows along the four'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'walls of their classrooms. In the summer months, they had the option of taking
    their bedding up to the flat roof of the building and sleeping rather than in
    their hot, stuffy classrooms—this was a valuable space with many uses during the
    day as well. Every evening, students assembled for evening (maghrib) prayers,
    forming neat rows and praying in unison. The space also had domestic uses, a section
    of it being used to hang laundry. Backstairs, outside the classrooms was a large
    hall where the morning assembly was held, and students formed informal study groups
    after school hours. One part of this open space had been cordoned off to create
    a makeshift sick room for students. Great discipline was required to ensure that
    each student had a clean uniform for the school day and a change of clothes for
    the rest of the day, not to mention sharing water for bathing and ablutions before
    prayer time.


