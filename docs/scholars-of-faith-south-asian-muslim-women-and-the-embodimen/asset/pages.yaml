  md: 'Ironically, Mawlana Taqi ‘Uthmani himself has BA ‘degrees in arts and in law
    from the University of Karachi and a master’s in Arabic from the University of
    the Punjab in Lahore’, and is a prominent figure in Pakistan, having ‘served as
    a judge on the Shari’at Appellate Bench of the Supreme Court’ for two decades,
    from 1982 to 2002. He has also published in English the book Introduction to Islamic
    Finance, thereby addressing not just ‘ulama audience but a wider, Western-educated
    one as well.¹ Zaman explains that he exemplifies a new phenomenon in Pakistani
    education, namely, the creation of new opportunities for the ‘ulama to seek academic
    degrees in the university system after receiving a madrasa education. This was
    made possible by government reforms in the early 1980s which recognized madrasa
    degrees as ‘the equivalent of university degrees’, provided the madrasas offered
    some subjects taught in the ‘general curriculum’. Even so, the fact that Dr Farhat
    Hashmi is a Western-educated intellectual (whose earlier education took place
    in Punjab University in Pakistan) and a woman who is prominent on the national
    and international stage, has caused considerable dismay among the Pakistani ‘ulama,
    particularly the Deobandis.


    These currents of change in modern Muslim education are taking place throughout
    the world. Contrary to modernization theory in the 1960s, which had assumed that
    the ‘ulama were becoming irrelevant in the twentieth-century Muslim world because
