    of the madrasa at work, which wants to reform the daily practices of Muslims in
    rural, semi-urban, and urban India to bring them into greater conformity with
    textual shari norms.


    # Mapping a New Religious Habitus onto South Asian Gendered Norms


    Attiya Ahmad''s work among migrant South Asian domestic workers in Kuwait (all
    non-Muslim) in the early 2000s brings to the fore how gender norms informed the
    choices and decisions they made, including the decision to convert to Islam, during
    their long sojourn there. In her chapter ''Naram'' (soft, malleable), Ahmad discusses
    the unvoiced cultural expectation shared by the domestic workers, their employers,
    and their families in South Asia that they would adapt to the lifestyle of the
    household of which they were a part. Apart from learning to use unfamiliar gadgets,
    make different kinds of food, speak a new language (Arabic), and understand a
    family''s religious practices, they had create new affective bonds with their
    employers. Ahmad describes domestic work as a realm requiring ''too much of the
    self rather than too little''. Through their labour, they became ''dual agents
    of reproduction'', reproducing both their'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'family and work households.30 Only age and length of service conferred privileges
    and the relaxation of these gendered expectations. Furthermore, when they returned
    to their natal families, too they had to fit into existing hierarchies based on
    age and gender. Their financial contributions to their families were verbally
    unacknowledged so that social relations could continue as before, undisturbed
    by their presence.


    Despite the obvious differences between the contexts and life histories of the
    domestic workers and the madrasa students in my ethnography, I found surprisingsemblances
    between the two populations—semblances I believe have analytical value. Being
    domestic employees, the women had to adjust (to be naram) so as to fulfil their
    employers'' expectations. However, these expectations were not carried over to
    male domest: the latter were expected to be unchanged by their Kuwaiti migration
    experiences.31 After many years of service with a single family and emotional
    integration into it, some of the women chose to become Muslim despite the discouragement
    of many employers and the hostility of their natal families.


    As Ahmad notes, in South Asia the gendered expectation that women are ''naram''
    is articulated in the context of marriage, whereupon girls leave their natal families
    and begin to reside with their husband''s family:


    Studies have highlighted how women''s malleability is channeled toward, and considered
    essential to, their marriageability and ability to adjust to married life. Marriage
    involves significant transformation, most notably, the remaining of women''s subjectivities
    and social belongings that they accommodate themselves to, and come to be identified
    with, their husband''s household.32


