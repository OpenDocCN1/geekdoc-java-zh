  md: '# ACKNOWLEDGEMENTS


    This project has been many years in the making. It began modestly when, in 2009,
    I first heard of Al-Huda online classes and decided to register as a student.
    I was not teaching at the time, had a high schooler and a middle schooler at home,
    and relinquished the idea of reading and studying the Qur’an with knowledgeable
    teachers. Thus began my four-year association as a student with Al-Huda. Many
    years later, in 2015, I published a paper about my ‘virtual ethnography’, a modified
    version of which appears as Chapter 6 in this volume.*


    The project grew in large part to the encouragement of Sandra Freitag and David
    Gilmartin of North Carolina State University, USA. At their invitation, I attended
    a monthly South Asia colloquium in the Research Triangle area of North Carolina
    from 2010 to 2017. Simultaneously, my receipt of an American Institute of Indian
    Studies (AIIS) Senior Short-Term Research Fellowship in 2012–13 gave my project
    its comparative character. My warm thanks to Sandy and David for their intellectual
    inspiration and support, to the many participants of the colloquia for feedback
    on individual papers and chapters, and to the AIIS for the grant that allowed
    me to begin fieldwork at the madrasa in Shahjahanpur, Uttar Pradesh, India


    * Republished with permission of Brill Academic Publishers from: Usha Sanyal.
    2015. ‘Al-Huda International: How Muslim Women Empower Themselves through Online
    Study of the Qur’an’. Hawwa: Journal of Women of the Middle East and the Islamic
    World 13(3): 440–60. Permission conveyed through Copyright Clearance Center, Inc.'
