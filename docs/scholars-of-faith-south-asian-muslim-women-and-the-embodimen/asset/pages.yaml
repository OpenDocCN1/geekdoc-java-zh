  md: '# Scholars of Faith


    Similarly, we see the close connection between religious movements and political
    context in the case of the Jama''at-i Islami, a very different kind of religious
    organization founded in the early 1940s by Mawlana Mawdudi.5 Characterizing the
    Jama''at-i Islami as an Islamist organization, Irfan Ahmad''s research on the
    Jama''at-i Islami madrasa jamatul Falah in Azamgarh district, east UP, reveals
    the degree to which the politics of this institution differs from that of the
    Jama''at-i Islami in Pakistan, where Mawdudi moved after Partition.6 Ahmad writes:


    Whereas in the past Jamaat called secularism and democracy haram [forbidden],
    it fights to safeguard these principles. Western-Muslim colleges were previously
    considered ''slaughterhouse[s],'' but now the Jamaat seeks their minority status.
    Its schools affiliated with the government earlier had been seen as an approval
    of taghut (idolatry), but now it has no qualms about getting that affiliation.
    Similarly, whereas it accepts them...The pursuit of Islamic state has also ceased
    to be centered on the Jamaat''s agenda.7


    The complexities of this history are not concern me here. Rather, I wish to make
    the point that the Deobands and Jama''at-i Islami in Pakistan and India (to two
    examples out of many) have had very different relationships with the state and
    hence, while different public roles in their respective societies. This becomes
    clear in the course of my examination of the two case studies discussed in this
    book, as the first is located in a small town in west UP, India, while the second
    began in Islamabad, Pakistan, in the 1990s, and now has branches in North America
    which both onsite and online classes for women. I have focused on its online classes,
    headquartered in Canada.


    This work argues that Islamic education today, in the early twenty-first century—particularly
    for women—is thoroughly modern. This is a loaded term. What do we mean by a ''modern
    Islamic education?'' Robert Hefner us three important criteria: the functionalization
    of Islamic education, its internal dynamics, and


