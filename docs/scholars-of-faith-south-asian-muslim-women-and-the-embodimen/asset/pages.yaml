    # LIFE AFTER THE MADRASA


    Education finds its fulfillment in teaching. When I was a student, I did not realize
    the importance of all that I was learning. But when I began to teach, I became
    like a sooty pot that is scrubbed clean and shiny (main bartan ki tarah manhjati
    chali gayi).


    > —Ghazala, Jami''a Nur madrasa graduate, 2015, speaking to Farah


    Expressed in an affective register, the interlocutors were referring to their
    ability to adjust to their newfound circumstances, an adjustment hinging upon
    a gendered characteristic they associated with proper womanhood. Women, they repeatedly
    indicated, are naram.


    > —Attiya Ahmad, Everyday Conversions, p. 109


    What impact does students'' education have on their lives after they leave the
    madrasa and rejoin their natal families, and then marry and become wives mothers?
    This is a critical question in assessing the long-term impact of the madrasa.
    Here I draw on the research of Sumbul Farah who followed a few Jami''a Nur graduates
    to their homes and talked to them for extensive periods, sometimes making multiple
    visits to learn about their home lives. We learn from the continuity between the
    school and the home, the prestige accorded by family members and neighbours to
    the madrasa students'' religious knowledge and their consequent increase in authority
    vis-à-vis other members of the family, their eagerness to hold classes for women
    and children in their neighbourhoods, and their relations


