  md: '# Conclusion


    Al-Huda students in North America and elsewhere in the South Asian diaspora occupy
    place of social privilege compared to the madrasa students at Jami’s Nur. Nevertheless,
    they have to know how to balance societal expectations in order to be successful.
    Al-Huda has attracted considerable media and scholarly attention, in part due
    to its success in attracting upper-class Pakistani women in the 1990s and middle-class
    women from the South Asian diaspora in the West since the early 2000s. In Pakistan
    it has been the target of both religious and secular critics. Religious scholars,
    the ‘lama, have questioned Al-Huda founder Farhat Hashmi’s authority to teach
    the Qur’an and its exegesis in view of the fact that she is no madrasa graduate
    but has a PhD in Islamic Studies from the University of Glasgow. On the other
    hand, secular Pakistanis have been troubled by the personal transformation of
    thousands of upper-class Pakistani women who, after studying at Al-Huda schools,
    have become observant Muslims who wear the *niqab* in public and frown upon mixedgender
    parties and the consumption of alcohol, among other things. Clearly, Al-Huda has
    created a new and controversial public space for orthoprax Muslim women in Pakistan,
    especially in urban areas.


    Why now? This is a question I asked myself at the beginning of this study and
    it has stayed with me throughout my research. The answers are multiple: the post-9/11
    context in South Asia and the West created a crisis for Muslims the world over.
    They were being held collectively responsible for the actions of a few. But the
    trend had begun before, in the 1970s and 1980s, in the context of the geopolitics
    of Egyptian Nasserism and the rise of Palestinian secular nationalism, and the
    rise of religio-political Islamism in the wake of the Iranian Revolution of 1979.


    As Zaman’s study of Islam in Pakistan makes clear,¹15 the political context in
    Pakistan between the 1970s and the early 2000s was influenced by both external
    and internal factors. In terms of developments in the wider Muslim world, the
    most important one were


    > 15 Muhammad Qasim Zaman, *Islam in Pakistan: A History* (Princeton: Princeton
