  md: '# Conclusion


    We might view this turn towards appropriation as an act of mirroring. Around the
    world many Muslim women are dealing with gendered Islamophobia'', to use the term
    coined by Zine, deliberately returning to their Islamic roots and re-interpreting
    the Islamic tradition in ways that provide a counterargument to the image of Islam
    as a misogynistic faith tradition. The act of appropriation is a powerful means
    of self-affirmation and assertion of self-control, in relation to the wider non-Muslim
    environment in which they live and also, more immediately, in relation to the
    westernized or ''lax'' lifestyles of their own family members.


    Whether we are talking about students at a small-town madrasa like Jami''s Nur
    or a worldwide organization like Al-Huda, the implications of Muslim women''s
    religious education for social change have to be understood through the nexus
    between women''s education, the domestic realm, and the community at large. I
    hope that the comparative framework of this study opens up new questions and encourages
    us to discard binaries such as those between Sufis and Wahabis, or rural Muslims
    and urban ones. I also hope that it allows us to see fluidities and connections
    in the way South Asian Muslims actually live out their lives in a context characterized
    by interconnectedness, disjunctures, precarity, and cultural constraints on Muslim
    women, regardless of social class or geographical location.'
