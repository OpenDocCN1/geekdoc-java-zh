    To return to the modernity of the educational institutions described in this book,
    another aspect of their situation merits merit is not only their growing occupation
    of public space, but their creation of a new kind of ‘intermediate’ space, part
    of both public and private characteristics. Jami’a Nur enabled students to meet
    girls from other parts of India; while, they also interacted with male teachers,
    using intermediate forms of veiling as the nose-piece. All this enlarged their
    vision of the world, making them aware of the wider Islamic community (umma) through
    the discipline of the madrasa.


    The act of appropriation of the Islamic tradition, or simply of ‘Islam’, is yet
    another aspect of the modernity of the educational institutions documented in
    this book. Once at the madrasa, students learned of the rights they did not know
    they had as Muslim women. Thus, a student told me that a Muslim girl had the right
    to refuse a marriage proposal if she did not like it, if she did not shake her
    head in a ‘no’. This knowledge gave madrasa students her tremendous pride in being
    Muslim women. This sense of ownership of the Islamic tradition validates, in my
    view, Mahmood’s argument that Muslim women’ turn to ‘Islam’ in the contemporary
    world is a source of empowerment.


    Al-Huda students also expressed their pride of discovery of what ‘Islam’ is or
    in ways that reflect their appropriation of the Islamic tradition. Thus, an Al-Huda
    student told me that as a child her parents had taught her that one should not
    open the door to one’s bedroom without knocking. It was a message she had assumed
    to be based on Western notions of privacy. How surprised she was, said, when she
    began to study the Qur’an, she learned that this message was conveyed in a Qur
    verse! This was an Islamic teaching going back to the seventh century, she discovered,
    that no recent Western one. Likewise, Al-Huda students told me that the ritual
    of wudu which must be performed before starting one’s prayer if one had broken
    wudu’ since the previous prayer, is conducive to mental health because at the
    heart of this ritual is the exposure of one’s face and limbs to flowing water.
    The therapeutic qualities of flowing water, they said, have been proven by Western
    scientific research.'
