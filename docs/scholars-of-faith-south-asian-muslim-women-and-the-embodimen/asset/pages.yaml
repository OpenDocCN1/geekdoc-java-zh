    But there is more to it than this. The madras succeeds in large part because it
    connects the students to the Islamic scholarly tradition at large. It is much
    more than just Barewi madras. By drawing young Muslim girls from families with
    little prior knowledge of Islamic history the Islamic scholarly tradition and
    giving them direct access to the medieval texts which make the backbone of this
    tradition, the madras opens her horizons to worlds they had never known and which
    they can proudly call their own. The experience of sitting in a study circle with
    other girls of ones age—sometimes outside in the open playground on a sunny winter''s
    day, but more likely in a big, well-lit classroom with windows—moving one finger
    on the line is reading, and turning the pages of a gigantic, heavy book of Tirmidhi,
    for example, is a real, tactile one, not merely a passive act of absorbing received
    knowledge. The book, placed reverentially on a pillow, is shared by two students
    sitting side by side. They lean their heads together fully concentrating on the
    page, so as not to lose their place as students take turns reading at a rapid
    pace. Likewise, as they read and distinguish the text (main) from the commentary
    (shari) written in tiny print at an angle in the margins on the left, right, and
    bottom of the page in a Hadith book like Tirmidhi, or a book of Quran''ic exegesis
    like Jalayn, they are traversing a well-known path, whose markers—made of different
    kinds, sizes, and physical placement—they have grown familiar with over their
    years at the madrasa. Their success in reading, understanding, and mastering these
    texts also constitutes a visible and tangible link between them and the Islamic
    scholarly tradition.


    Likewise, for younger students, the pleasure of copying lines of Urdu calligraphy
    in learn how to connect the letters of the Arabic alphabet correctly, is a means
    of participating actively in a new world of learning. The children''s brows are
    furrowed in concentration


