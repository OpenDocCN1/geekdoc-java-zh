    97


    The madrasa was founded in 2003 by Sayyad Ehsan Miyan, affectionately addressed
    as Abba Huzur (respected father) by the madrasa students. Staff and teachers called
    him Sayyid Sahib.¹ Sayyid Sahib is a tall spectacled man with a wiry frame, energetic
    manner, and excellent posture. He wears a white tunic (kurta) with loose white
    pants (pyjama), and on his head is a white turban. His manner is direct, informal,
    and open, with a touch of humour, and his language is simple, even colloquial.
    He speaks with verse, emphasizing his words with a gleeful slap on the thigh and
    a glint in his eye when he makes a point that seems logical and self-evident to
    him.


    In response to his questions, he gave me the information about himself:


    Sayyid Sahib (SS): I was born in Qasba Saurikh [in the south-western corner of]
    district Kannauj, 1960. I grew up in the village of Kabirpur. My father died when
    I was a year and a half old, and I was one of five children.


    I come from a wealthy family with business interests. But I rejected the life
    of a businessman, I live simply.


    I studied in Pilibhit to the 4th or 5th standard and stayed in my village until
    18. Then I went to Bareilly to study at [Madrasa] Manzar-Islam. I was there for
    two years. Then I went to teach in Pilibhit, in Qasa Nariya. The name of the madrasa
    Dar al-Shamsiya. It had about 100–125 resident students, all boys. I was a teacher
    and overall manager of this school for fifteen years.


    In 1999, I opened a school for boys. Even back then, I planned to open a girls''
    school one day. I opened this madrasa in 2006² in response to popular demand.
    All the Sunni girls in this community were attending Deobandi schools because
    there was no alternative, and when they graduated they like Deobands. When I opened
    the madrasa in 2006,


    > ¹ There is vast literature on the role of Sayyids in South Asian Islam. See,
