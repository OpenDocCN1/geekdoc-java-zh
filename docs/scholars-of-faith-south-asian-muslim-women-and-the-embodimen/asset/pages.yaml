    madrasa emphasized practical virtues (faza’il) rather than theoretical legal issues
    (masa’il). Even though the men in charge claimed that the curriculum was ‘the
    same as the dars-e-nizam taught in madrasas for boys’, in fact it was ‘substantially
    different, and in practice often differed from the official curriculum’.⁵⁷ For
    example, the two volumes of Qira’at al-Rashida, mentioned earlier, were not listed
    in the syllabus.


    However, in other respects the syllabus reflected the reality on the ground, as
    a contrary finding seems to be that the study of Hadith (prophetic traditions)
    was emphasized, particularly in the fifth and final year. Study of the Qur’an
    began in the first year and continued throughout, with the addition of related
    subjects as exegesis.


    In addition to the formal syllabus, Winkelmann points to the importance of what
    she calls the ‘informal syllabus’, namely, the ‘subtle and ... all-pervading impact
    of adab’ which manifests itself in ‘rules governing discipline, body control,
    and behavioural expectations’.⁵⁸ She illustrates this by giving the example of
    twin girls, about six years old, who were shabby dressed when they first came
    to the madrasa, had an unkempt appearance, and carried their Qur’an in a plain
    cloth cover, whose appearance, demeanour, sense of confidence, and pride in the
    way they carried their Qur’an, seemed to improve and grow after they had been
    at the madrasa for a short time. As she writes, the girls had quickly imbued not
    only their formal lessons, but also the ‘moral undertone of the madrasa. The case
    of the young sweeper girl is even more illuminating, as it shows the potential
    for upward social mobility implicit in the cultivation of personal modesty; appropriate
    modes of dress, particularly veiling (pardah); and attempts to acquire religious
    learning. Not only did the sweeper’s personal behaviour change over time, but
    the teachers began to show her increased respect.⁵⁹


    In the concluding chapters of ‘From Behind the Curtain’, Winkelmann offers some
    theoretical insights into the wider significance of her work. Following Foucault,
    she notes that being residential, the madrasa was a ‘total institution’ which
    was both removed from and enmeshed in its physical environment near the Nizamuddin


