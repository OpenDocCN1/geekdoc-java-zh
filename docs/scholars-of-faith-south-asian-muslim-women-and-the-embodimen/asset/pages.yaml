    # The Students: Online Relationships and Dynamics, and Their Responses to the
    Course


    As online students, it goes without saying that the teachers and students could
    not see one another directly. This fact, unremarkable because it was so basic,
    appeared to have a significant impact on the way the class interacted. Thus, students
    could not, and therefore did not look around and observe how the others were dressed,
    what they looked like, where their friends were sitting, or anything else at a
    visual level. Notably, for some time I observed that none of the informal discussions
    among the students dealt with matters to dress, unless specifically brought up
    by the teacher or the Qur’anic text itself. (This is not to say, however, that
    audiovisual aids were not used, for Al-Huda utilizes all the latest technology.
    It is simply to say that the students did not see each other.)


    Almost all the work of teaching and learning was aural, emphasizing the capacity
    to listen carefully. However, the students did not'
