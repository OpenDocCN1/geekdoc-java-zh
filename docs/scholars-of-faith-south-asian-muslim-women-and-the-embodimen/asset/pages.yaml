    # Islamic Sources Cited in Al-Huda Classes


    In this examination of Al-Huda’s intellectual formation, another aspect that deserves
    our attention is its use of Islamic sources in the classroom, particularly Hadith
    and tafsir or Qur’anic exegetis. Given Al-Huda’s inclination towards the Ahl-i
    Hadith perspective, it is not surprising that teachers refer generally to the
    corpus of Hadith literature in Arabic, some of which is also taught by the Sunni
    ‘ulama of different schools of thought in their madrasas in South Asia. In addition,
    certain works of tafsir are used regularly.


    Reference to the Hadith collections of Al-Bukhari and Muslim, to the two most
    accepted Sunni collections, is interwoven within Al-Huda-classes. These books
    are readily available without charge and are therefore easily accessible to students.
    Teachers also refer to Hadiths from the other well-known collections of al-Tirmidhi,
    Al-Nasa’i, Abu Dawad, and Ahmad Ibn Hanbal. Most however, reference is made not
    to a particular book but to the person(s) who related the Hadith. One of the names
    that crops up frequently during translation classes is of Ibn ‘Abbas (d. an Medina
    Companion (sahaba) who says to have been either 10 or 15 years old when the Prophet
    died. 64 Ibn ‘Abbas was both a major transmitter of Hadith and an early exegete
    of great importance—he is described as the ‘father of qur’anic exegesis’ because
    he is among the exegetes in the next generation, that of the Followers (tabi’un),
    his disciples. Their names too are frequently mentioned in translation classes
