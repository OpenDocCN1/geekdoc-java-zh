    have finished their madrasa educations or have had to leave the madrasa early
    for personal reasons, the madrasa experience continues to shape their lives at
    home. Following Moosa''s distinction between three aspects of madrasa learning—ta‘lim,
    or the acquisition of religious knowledge, particularly knowledge of shari’a;
    ta‘dib or the acquisition of adab, etiquette; and tarbiya, or the cultivation
