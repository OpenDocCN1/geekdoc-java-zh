    # A Typical Day at a Taleem al-Q’an Online Class, 2010


    It is a Monday, about noon Eastern Standard Time in the US and Canada. Class begins
    promptly at 12:15. You put on your headphones and log on to the website on PalTalk
    a few minutes beforehand, prepared for computer glitches, as often happens on
    a Monday. Over the weekend, the course administrator will have emailed you the
    password, which often changes from week to prevent unauthorized persons from accessing
    the site. Students also have access to a secondary site, called WizIQ, which runs
    in tandem with PalTalk and is specifically used to hold a class called ‘Reflections
    from the Qur’an’, using PowerPoint presentations, most of the classes are conducted
    on PalTalk.


    While wait for the course administrator to come online, students listen to recorded
    Qur’anic verses and greet each other by typing in ‘As-salam alaikum, sisters’
    and the appropriate response in various abbreviated formats. Some students chat
    with one another directly, exchanging news. On the right of the computer screen,
    the students’ names and IDs show up as soon as they ‘enter’ the ‘room’. By looking
    at the last two letters of the ID, you can tell where the person is located geographically.
    Apart abbreviations such as CA, FL, KY, MI, and so on, which tell you that the
    person is in the US, you also see UK (for the United Kingdom), SL (for Sri Lanka),
    UAE (for the United Arab Emirates), AB (for Alberta, Canada), and so on. You quickly
    realize that everyone is dealing with different time zones. For some people, particularly
    the ones in India and Sri Lanka, it is late at night. In fact, it is already about
    10 p.m. when the class starts—and it will go on for a little over four hours.
    However, most of the students are based in different parts of the US.'
