    # Genesis of This Study


    This book emerged from my growing curiosity about the lives of Barelw women, who
    were absent from my previous work on the history of the Barelw or Ahl-i Sunnat
    wa Jama’at movement.27 What was distinctive about the lives of Barelw women; what
    set them apart from other South Asian Muslim women? Did the belief system that
    had been articulated by leaders such as Mawlana Raza Khan Barewi (1856-1921) in
    the late-nineteenth and early-twentieth centuries, and subsequently debunked itself
    in the lives of women who belonged to families that adhered to this?


    As I historian rather than an anthropologist by training, I began with a historical
    lens, looking for twentieth-century Barelw texts for women. The earliest texts
    I found belong to the genre of ‘advice literature’, well-known among Deobands
    on account of Mawlana Ashraf ‘Ali Thanawi Bihisti Zewar and ‘Heavenly Ornaments’.28
    Not surprisingly, given the history of competition and rivalry that marked the
    Barelw–Deobandi relationship, the two Barelw books have similar titles, though
    with a slight twist: one of the Barelw texts is called Sunni Bihisti Zewar (''Sunni
    Heavenly Ornaments'') while the other is called Jannati Zewar, also translates
    as ‘Heavenly Ornaments’. The implication of the first title is hard to miss, namely,
    that—rather than the earlier and much better known Deobandi work—is the definitive
    guide for Sunni Muslim women.


