  md: '# 70 Scholars of Faith


    At the Fazila level, students also study the psychology of education. This feature
    of the curriculum be unique to the Jami''at al-Salehat, or may be found in select
    Indian madrasas.⁴ Its purpose is clearly to produce more effective teachers, as
    teaching is the most popular profession sought by female madrasa graduates. Students
    were also encouraged—or perhaps required—to study and read on their own, using
    the extensive resources of the library, including newspapers. The syllabus lists
    a number of books by Mawlana Maududi and other scholars of Jamaa''at-Islami affiliation
    for general study, not included in the regular class syllabus. It is also noteworthy
    that an anthology of Sayyad Ahmad Khan''s essays is taught at the Fazila level.
    This once again corroborates Ahmad''s argument that the Indian Jami''at-i Islami
    has embraced a more open-minded ideology than did Maulana Maududi.


    According to the vice principal of the madrasa, after the students graduate they
    go on study further. They have four preferences. In descending order of importance,
    these are: Aligarh (BA or MA level); Jamia Millia, Delhi; Hamdard University,
    Delhi; and Lucknow, UP. She said that graduates occupy positions in other institutions
    of learning after they finish their studies at the Jami''at al-Salehat. Many have
    become teachers at Jami''at al-Banaat in Azamgarh. Over time, students had set
    up affiliated schools in their places of origin. Because of this few students
    at the Rampur madrasa now came from geographically distant places than before.
    Some students had also gone to the Middle East after marriage and starting there.⁵


    Clearly, the Jami''at al-Salehat''s high academic expectations and impressive
    student achievement are associated with middle-class status and aspirations. The
    financial cost to the madrasa in providing good healthcare, attending to the students''
    nutritional needs and housing, and providing the onsite facilities of the library,
    conference rooms, sick room, year-round electricity, and hot and cold water, and
