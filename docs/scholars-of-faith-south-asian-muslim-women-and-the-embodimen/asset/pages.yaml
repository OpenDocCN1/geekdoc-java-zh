    Hadith scholars,11collecting Hadith from each of them, and writing numerous books.
    Most of these have remained unpublished and unknown to the scholarly world. Hashmi
    lists and briefly describe the content of his works, both published and unpublished,
    indicating where copies of the latter are still to be found. For the most part,
    they are housed in libraries in Istanbul, Baghdad, Damascus, Rabat, or European
