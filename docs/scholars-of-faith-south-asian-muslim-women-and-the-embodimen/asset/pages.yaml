    # Performing Identity


    As interest in the everyday has grown, scholars have also asked how identities
    are performed in everyday contexts. Sumbul Farah, an anthropologist, argues that
    Barelwi identity and ethics—or ‘Barelwiyat’—must be publicly ‘performed’ in a
    variety of ways in order for a person to be seen by others to be a Barelwi Muslim:
    “To be” a Barelwi, it is necessary to owe allegiance to a particular worldview
    in a way that one’s faith is inscribed onto one’s self, both within and without.
    An ineluctable relationship is thus forged between ‘doing’ and ‘being,’ wherein
    affirmation and denunciation emerge as as incumbent upon those who claim to be
    Barelwi. ‘Performance’ in this case embraces not just the outward manifestations
    of Barelwi religious identity, which distinguish a Barelwi from a Deobandi (as,
