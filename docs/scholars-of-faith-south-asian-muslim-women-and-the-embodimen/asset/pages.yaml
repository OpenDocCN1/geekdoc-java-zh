    take somewhat distinct stances on some issues 66 Similarly, as I noted earlier
    in the chapter, the inclusion of an anthol-ogy of Sayyid Ahmad Khan’s essays in
    the Jami’at-al-Salehat syllabus is remarkable, and points to a rapprochement between
    the Indian Jama’at and the secular Ahmad Muslim University founded by Sayyid Ahmad
    Khan in the nineteenth century.


    A second point that emerges is that the syllabus at the Madrasatul Niswan, is
    definitely different from that of boys’ madrasas. She shows how this is by listing
    the books of a representative sample of the dars-i nizami syllabus in an appendix
    to her book. In general, the girls’ syllabus is shorter by a year than the boys’
    syllabus and where the same texts are taught, the girls study different sections
    of those texts, which are thought to be rel-evance to them as future wives and
    mothers. Furthermore, as one of Winkelmann’s informants noted, there was no mufti
    course for girls anywhere in India at the time she did fieldwork, as women are
    not allowed to issue fatwas. Thus the religious authority of women can never be
    public, as that of men. However, there are signs of change. A madrasa in Hyderabad,
    Jamiat-ul-Mominath, reported on its web-site in 2019 that 70 girls had received
    a muft’s certificate and were ‘spreading din (isha’at-i din) not only in India
    but abroad as well. 67


    These observations on the syllabus are borne out by my research on the Barelwi
    girls’ madrasa that I explore in the follow-ing chapters. The feminization of
    the syllabus, by my mind, makes sense in view of the purpose of girls’ madrasa
    education, which is not employment-oriented so much as it is to ensure the educational
    and religious uplift of the Muslim community as a whole. Unlike Winkelmann, however,
    I believe that there never was a standard dars-i nizami syllabus for each, as
    of the Sunni Muslim groups—Deobandi, Barelwi, Nadwi, and others—have changed it
    to since they began to establish madrasas of their


