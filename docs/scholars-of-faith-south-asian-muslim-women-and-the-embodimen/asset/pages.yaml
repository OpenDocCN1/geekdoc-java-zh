  md: '# Introduction


    first of the three groups referred to in verses 2–20 in Chapter 2 of the Qur’an.
    This group is described as ‘the godearing’, those who perform the prayer and fulfil
    the other duties required of them by God. The second group, in contrast, consists
    of non-believers, while the third—the worst—is made up of people who claim to
    be Muslim, but are in fact secretly engaged in undermining them. This provides
    the framework for Al-Huda’s self-definition and its definition of its’—both Muslim
    and non-Muslim. Al-Huda has much to say about Muslims who consider other humanity
    worthy of worship, a notveiled reference to Muslims such as the Barelwis, who
    are both ‘ulama and Sufis. Al-Huda, whose affiliation is with the Ahl-li Hadith,
    frowns upon Sufism.


    The founders of Al-Huda International, a husband-and-wife team from Pakistan who
    obtained their PhDs in Islamic Studies from Glasgow University in the 1990s, and
    which Qur’an and Hadith classes at Al-Huda, are case in point. A prominent Deobandi
    scholar in Pakistan, Mawlana Taqi ‘Uthmani, specifically asked on what authority
    Dr Farhat Hashmi, the leading for Al-Huda, could engage in interpretation of the
    Qur’an, given that she is not the product of a madarsa education but has a degree
    from a Western university.17


