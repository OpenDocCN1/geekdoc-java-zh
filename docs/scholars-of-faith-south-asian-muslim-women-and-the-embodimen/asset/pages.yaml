  md: '# Scholars of Faith


    access of Muslim girls and women to education and the purposes to which they seek
    to put their educations. Why are South Asian Muslim girls and women seeking opportunities
    to acquire religious learning today, and what do they wish to accomplish with
    newfound knowledge? What is the social impact of women''s greater access to education
    in South Asia; what societal changes does this exemplify and pretend? How important
    are intra-Muslim debates about interpretive differences among South Asian Muslims,
    and what impact—if any—do these internal divisions have on relations between Muslims
    and the wider non-Muslim society in South Asia, particularly Hindu in India, and
    in the western diaspora?


    South Asian Muslims today are heirs to the twentieth-century history of nationalist
    struggle for freedom from the British colonial rule, which led to Independence
    in 1947, but also the Partition on both sides of the subcontinent, with the provinces
    of Punjab and Bengal being divided between the new nation states of India and
    Pakistan. Muslims, who had numbered about 25 per cent of the Indian population
    prior to 1947, were now a mere 13 per cent of the Indian population, whereas West
    and East Pakistan were wings of a Muslim-majority nation with small non-Muslim
    population. In 1971, a further act of partition took place, after a brutal war,
    the two wings separated into Pakistan (to India''s west) and Bangladesh (to India''s
    east). Since then, the national contexts of these three countries have set the
    stage for very different life experiences for their respective Muslim populations.


    As scholars have noted, Muslim religious movements or organizations that began
    in the British colonial period had distinct histories in India and Pakistan. Thus,
    to take the example of the most prominent ‘ulama-led Sunni Muslim movement in
    colonial India, that centred on the Dar al-‘Ulum in Deoband, Uttar Pradesh (UP),
    Metcalf’s work shows that during the colonial period, the activities of Deobandi
    ‘ulama followed a dual track. On one hand, they were scholars, teachers, and Sufis
    who were religious and cultural leaders of the Muslim community; on the other,
    they were Indian nationalists who formed the Jam’iyat al-‘Ulama-i Hindi party
    of ‘ulama, allied with the Indian National Congress in the anti-British struggle
    for Independence. Some, notably Mawlana Husayn Ahmad'
