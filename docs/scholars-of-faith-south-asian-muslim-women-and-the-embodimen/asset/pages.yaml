    The visual experience of recognizing text and being able to write fluently in
    Urdu and Arabic is of course but one dimension of the larger madrasa ''sensorium'',
    to recall Beni. The equally, if not important, auditory aspect, has been frequently
    commented on public media and the scholarly literature, often to cast doubt on
    the practice of memorization. Charles Hirschkind, in The Ethical Soundscape, Hirschkind''s
    use of phrases such as ‘a listening that is a doing, ‘the tradition of active
    listening’, ‘ethical listening’ indicates that listening in the Islamic context
    is an act, embodied response to oral speech. In the Islamic ‘soundscape’, the
    listener must do more than passively hear the utterance. She must be actively
    engaged, fully attentive, and respond with the appropriate bodily gestures and
    speech.59


    Studying the Qur''an has its distinct and well-known rules of adab and set of
    practices. When during the day younger students learn the rules of tajwid, with
    its complex and precise methods of sounding out the words of the Qur''an, they
    practise the articulation of Arabic sounds difficult for a native Urdu speaker,
    to be corrected repeatedly by their teacher. How they handle the Quranic text
    and under what conditions are issues of lively debate between different maslaks.
    At the madrasa, students are meticulous in their observance of the directive of
    textual guides such as the Sunni Bihisti Dewar, and their young teachers, who
    embody their feminine ideal. Other verbal and bodily responses constitute micropractices
