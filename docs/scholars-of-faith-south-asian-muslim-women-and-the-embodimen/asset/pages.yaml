    true kind, Sayyid Sahib, who was spiritually pure and did not seek fame and glory.
    Implicitly he was contrasting Mawlana Mustafa Raza Khan with other descendants
    of Ahmad Raza Khan. While never criticizing them directly, he often expressed
    his frustration with the state of the Muslim community, saying that the Muslims
    were their own worst enemies. Blaming the Barelwi specifically for many practices
    which amounted to ''the *dunya*'' entering the *din* (religion), instead of *din*
    coming into the *dunya*.^8 he laid the responsibility on the Barelwi ''alama,
    who had made a ''business'' out of their religion. In one occasion, he said:


    A Muslim has to follow the shari''a, the first step of which is to offer prayer
    (namaz) regularly. If you do not take the first, how can you climb the ladder?
    Likewise, Sufism (pir-muridi) also has to be conducted within limits. They have
