    The Madrasatul Niswani’s Tablighi connections—and beyond them, with the Nadwat
    al-Ulama in Lucknow—manifested themselves in a number of ways, though most especially
    perhaps in the madrasa’s syllabus. Winkelmann emphasizes the importance of one
    book in particular, namely, the Faza’il-i ‘Amal (Virtues of [Everyday] Deeds),
    which students were required to read and study every day. The teaching of this
    Tablighi manual is that one’s daily actions are a matter of gaining merit in the
    hereafter and therefore one should cultivate the virtues that will lead to heaven
    rather than hell. Among other things, idleness and frivolous or extravagant excess
    are strongly discouraged, while behaviour associated with a deeply pious, restrained
    way of life is encouraged. The book thereby promotes the sanctification of everyday
    life.54 In addition, students also had lessons in Islamic upbringing (elsewhere
    classified as adab), in which a variety of books were used, many of them by the
    Nadwi scholar Sayidid Hasan ‘Ali Nadwi. One of them, the Qira’at al-Rashida, uses
    exemplary stories from the early history of Islam to teach students how to engage
    in everyday acts such as eating and drinking, dressing appropriately, and so on.55
    The Deobandi work written by Mawlana Ashraf ‘Ali Thanawi, which is listed in the
    syllabus for the first year of the Alima course under the category of jurisprudence
    (*fiqh*), conveys similar lessons in daily comportment while teaching practical
    skills like writing.


    An important insight of Winkelmann’s ethnography is the fact that in practice
    the madrasa departed in several ways from the printed syllabus that was made available
    to parents and students at the beginning of the school year.56 Though, many books
    in the field of Islamic law were studied selectively, limited to ‘questions related
    to marriage, divorce, child custody, and inheritance’, subjects deemed important
    for an educated Muslim woman to know. As Winkelmann puts it,


