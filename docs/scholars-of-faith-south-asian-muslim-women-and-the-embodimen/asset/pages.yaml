    You will write books, you will die, your efforts will be forgotten. What’s the
    point of working for the dunya? The only thing that endures is the akhira, and
    that’s what I have dedicated myself to my life.


    —My conversation with an Al-Huda teacher, July 2012


    For most Muslims the story of Lot in the Quran’an is an illustration of the punishment
    visited upon those who disobey God’s commands.¹ This is also how Al-Huda interprets
    the story. However, as with many verses in the Quran’an, Al-Huda teachers draw
    more than a single lesson from it. In studying the story of Lot in Sura al-Hijr
    (Q 15), verses 51–77 in class, the teacher pointed out, for example, when the
    angels told Lut to take his family (all except his wife) to safety in the middle
    of the night because God was going to destroy the city in the


