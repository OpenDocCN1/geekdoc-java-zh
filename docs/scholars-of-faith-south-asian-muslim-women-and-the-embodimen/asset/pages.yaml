    According to Waines, a characteristic of Ibn Kathir’s exegesis is his emphasis
    on the absolute sovereignty of God, and a second is his view that ‘divine existence
    and unity are mirrored in the multiplicity of God’s creation’.74 A simple example
    of both points (and there are many in the Qur’an) is the phrase al-rabb al-''alam
    or ‘Lord of the worlds’, in the opening chapter, the ‘Fatiha’. Ibn Kathir explains
    the worlds’ by saying, the word *alam is itself a plural word, having no singular
    form. The *alam* are different creations that exist in the heaven and the earth,
    on land and on sea.75 In other words, God’s sovereignty encompasses all of creation,
    including everything in our galaxy and beyond.76 In Farhat Hashmi’s exegesis of
