    Using this yardstick, the Jami''at al-Salehat belongs to the third category, namely,
    a dual-type madrasa. The syllabus of the Jami''at al-Salehat has a number of interesting
    features not found in the madrasa studied by Winkelmann and the Barelw madrasa
    with which I am familiar. First, it promotes knowledge of Arabic at an early age.
    The ‘Almina (secondary) and Fazila (undergraduate) syll list number classes on
    Arabic grammar, literature, and language. Moreover, the books prescribed are a
    combination of classical texts found in the dars-i nizami syllabus of madrasas
    of all denominations, for boys or girls, and never works by authors such as the
    well-known Nadwi scholar Mawlana Sayyid Ab Hasan ‘Ali Nadwi (d. 1999), who was
    widely respected in the Arab world as well as South Asia.⁴² Students develop an
    impressive level of Arabic reading, writing, and possibly spoken proficiency.
    The annual college magazine, As-Sahwah, contains a number of student essays in
    Arabic (as well as Urdu, Hindi, and English).


    On the other side of the ledger, reflecting ‘modern education’ at the ‘Alima level
    are classes in civics, in which students study the Indian constitution in Urdu,
    as well as English, using NCERT (National Council of Educational Research and
    Training) student readers for Classes X, XI, and the intermediate level (see Appendix
    1.1a).⁴³ The fact that students study the Indian constitution at the madrasa is
    remarkable. I have not observed this being part of the curriculum of the Barelw
