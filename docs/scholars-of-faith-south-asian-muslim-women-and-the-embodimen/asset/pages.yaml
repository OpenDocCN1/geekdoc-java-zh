    The Al-Huda women I write about here, like the Egyptian women Mahmood studied,
    had chosen to study the Qur''an and the traditions of the Prophet (Hadith) in
    order to apply the teachings of these foundational Islamic texts to their lives
    in the here and now. They focused on certain key concepts, such as fear of God
    (taqwa, also translated as piety), patience (sabr), and spreading the faith to
    others, mainly other Muslims (da''wa). Although their goals did not challenge
    the patriarchal order and were not what we would recognize as ‘feminist’, yet
    what they were doing was nonetheless radical, new, and potentially subversive
    of the order.$^{42}$ In this sense Al-Huda was also political. The very act of
