  md: '# Life after the Madrasa


    ***


    This chapter concludes my ethnography of the Jami’a Nur madrasa students, and
    the examination of the transformative role of the madrasa in their lives. By juxtaposing,
    in Chapter 4, the daily lives of the madrasa students with a glimpse of student
    life in the Islamic Public School with which the madrasa shared a building until
    2014, and by taking a brief look at the lives of a handful of madrasa graduates
    in their home environments in this chapter, I have tried to show what distinguished
    the students of Jami’a Nur from their secular counterparts, and also students’
    families negotiated many variables in deciding whether to send their daughters
    to the madrasa, which is often far from home and entails long periods of separation
    between parents and their daughters.


    How the madrasa changed and what lasting impact their educations had on their
    subsequent family lives can only be glimpsed from a distance. The outlines clear:
    the students return home imbued with a strong desire to adhere to the dictates
    of the shari’a in their lives, as the madrasa authorities interpret it, and abide
    by the duties of a practising Muslim. The reformist impulse of the madrasa carries
    over into the community at large through the students, who undoubtedly will have
    to adjust in practical ways to the particular circumstances of the families into
    which they marry. The process of change is thus a negotiation over a lengthy period
    of time, perhaps throughout adulthood, between community expectations of women’s
    roles, or the debate of social relations in daily life, and the textually based
    knowledge of shari’a norms that the madrasa students imbibse and embody through
    ritual practice and personal demeanour.


    The broader question of what impact the spread of girls’ madrasas in South Asia
    will have on society at large is the subject of vigorous academic debate. In the
    current political climate in India, Muslims find themselves on the defensive politically,
    socially, and economically. By all measures, Indian Muslims are less well-to-do,
    live in poorer neighborhoods, and are less educated than their Hindu counterparts,
    as the Sachar Report and other studies have documented. There are some who argue
    that in view of this replication of the colonial imbalance of power—in which Hindus
    occupy the role of former British colonialists and Muslims and other Indians in
    the'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 234 Scholars of Faith


    colonial period—madrasas as Jami''a Nur merely reinforce the cultural isolation
    of Muslims by separating Muslim girls from the Indian mainstream. It is thus a
    defensive posture that can do nothing to help the Muslim community overcome its
    marginalized status in society. In fact, in the long run, it reinforces social
    marginalization.


    On the other side of the debate, there are those who point out that the Indian
    state has failed in its constitutional duty to provide Muslim communities an affordable
    education and to ensure the availability of adequately paid jobs in their neighbourhoods.
    Since the liberalization of the Indian economy in 1991, state schools have been
    virtually absent in rural and semi-rural India, where millions of Muslims live.
    Private schools have had to fill the gap. Given this reality, madrasas are performing
    a valuable and much-needed service by providing Muslim parents an inexpensive
    education and giving them a hot meal during the school day.


    I would argue that this service role of madrasas in South Asia is only part of
    the story. The efflorescence of girls'' education today must be seen in historical
    context, as a logical extension of the educational efforts of the Muslim reform
    movements in South Asia that began in the late-nineteenth century. It is significant
    that girls'' madrasas are associated with the major South Asian maslaks—Deobandi,
    Barelw, and Ahl-i Hadith, to name the largest ones, which to we must add the Jama''a-i
    Islami and the Shi''a. These girls'' madrasas are therefore part of the maslaki
    competition for influence that has infused intra-Sunni politics in South Asia
    since the late-nineteenth century, and continues to do so today. Although Jami''a
    Nur does not actively participate in inter-maslaki competition, the madrasa curriculum
    and students'' micropractices at the却是 level speak to Barelw worldview. In this
    sense, it participates in the competitive marketplace of ideas that South Asian
    Sunni Muslims have had to choose from since the late-nineteenth century. Given
    the future influence of the female graduates on their home communities after they
    marry and have their own children, I expect each of the maslaks to continue to
    expand madrasa education for girls. At present there is no evidence that the current
    anti-Muslim climate in India is leading the maslaks to come together in the interests
    of Muslim self-preservation.


    In Part II of this book I turn to the very different context of Al-Huda International,
    which takes us to Pakistan and the South Asian diaspora in North America.'
