    # The Teachers


    As I have indicated earlier in the chapter, the day-to-day teaching and on-the-spot
    troubleshooting at the madrasa were largely in the hands of female authority figures,
    namely, the wardens and the teachers. When I first visited the school in June
    2012, there were three wardens and nine teachers. Four of the teachers were former
    alumni of the school. Three of them had studied up to the highest level of Fazila,
    while one had studied up to the ‘Alima level. All four teachers lived with the
    students at the school. The three with Fazila degrees were Sufi disciples (murids)
    of Sayyid Sahib. Two of them—Maryam and Hafsa—were daughters.³ The fourth teacher
    was a Sufi disciple of one of Mawlana Ahmad Khan’s descendants, Tahsin Raza Khan.
    In addition, the Hindi teacher (Khala Ammi’s niece, who subsequently got married
    and left the madrasa) had an MA from a college in Bareilly. She too lived in the
    school. Since their educational qualifications were higher than those of the wardens,
    the Fazila teachers were in the highest tier in terms of salary, despite their
    relative youth compared to the wardens—a fact which supports the point earlier
    in the chapter about their authority being greater than the warden.³⁴ In terms
    of social class background, there was a mix of castes. Sayyid Sahib’s daughters
    were the highest in terms of social status, being Sayyids or descendants of the
    Prophet. At the other end of the social scale, one of the teachers was the daughter
    of a bangle seller and lived in a village in a neighbouring district. Her father
    had a little land but seemed to be poor and of low status. And Sayyid Sahib’s
    older daughter Maryam were good friends and stayed in touch even after her departure
    from the school. Other friendships also seemed to transcend class and status identities.


