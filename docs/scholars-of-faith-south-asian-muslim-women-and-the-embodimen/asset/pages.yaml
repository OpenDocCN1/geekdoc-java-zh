    # Nida and Naghma


    Nida was one of the first girls in her part Bareilly—a village called Umariya
    on the outskirts of town—to attend Jami’s Nur. Her younger sister Naghma and a
    cousin Shabeena also joined the madrasa after her. When Farah met her in 2014,
    she was a newly bride. Farah had to get her husband’s consent before being allowed
    to visit her.


    Nida told Farah that she had had a hard time adjusting to madrasa life. She did
    not know anyone. The experience of uprooted from her familiar surroundings and
    having to stay with people who she did not know was difficult for her initially.
    When she cried and longed for home, old girls who had been at the madrasa for
    some time would comfort her. Before she knew it, she had got used to the place
    and she was too comforting newcomers.


    In fact, Nida thought that going to the madrasa was a turning point in her life
    because of what she had learned. The madrasa taught students the reason for their
    lives as well as their rights and duties in the world, she told Farah. Most parents,
    teachers, husbands, wives, and children did not know the rights and responsibilities
    entailed by these roles. Now that she was married, she clearly recognized both
    her responsibilities and rights as a wife. After her marriage, Nida had continued
    to read books about religion and she often spoke about religious matters to her
    husband. For his part he took pride in his wife’s knowledge of religion and encouraged
    her not to stop reading. In practice, however, she confessed that married life
    left her with little time for such pursuits.


