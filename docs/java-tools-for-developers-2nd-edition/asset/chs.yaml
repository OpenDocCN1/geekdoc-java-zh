  \n### 步骤 1\n首先，我们需要数据来绘制图表。你可以从现有的 Excel 文档中加载数据，或者从某些数据源检索数据并创建一个新的 Excel 文档。\n\
  \n### 步骤 2\n现在，我们通过创建一个绘图父级（drawing patriarch）来定义在工作表中绘制图表的位置。\n\n绘图父级是绘制的顶层容器。可以通过\
  \ `Sheet` 中的 `createDrawingPatriarch()` 方法创建。它将返回一个 `Drawing` 对象（代表绘图父级）。要定义图表的位置和大小，你可以使用\
  \ `Drawing` 中定义的以下方法创建客户端锚点（client anchor）：`ClientAnchor createAnchor(int dx1, int\
  \ dy1, int dx2, int dy2, int col1, int row1, int col2, int row2)`：创建一个以 `(dx1, dy1)`\
  \ 或 `(col1, row1)` 为左上坐标，`(dx2, dy2)` 或 `(col2, row2)` 为右下坐标的客户端锚点。`dx1`、`dy1`、`dx2`\
  \ 和 `dy2` 使用 EMU（英文制单位）。914400 EMU 等于英寸。`col1`、`col2`、`row1` 和 `row2` 从 0 开始计数。\n\
  \n要在磅和 EMU 之间进行转换，你可以使用实用类 `Units`。\n\n### 步骤 3\n一旦定义了客户端锚点，就可以使用 `Drawing` 中定义的\
  \ `createChart(ClientAnchor anchor)` 方法在绘图父级中创建图表。将返回一个 `Chart` 对象。\n\n在绘制图表之前，你可以使用\
  \ `Chart` 中定义的以下方法定义图表属性：\n\n- `ChartAxisFactory getChartAxisFactory()`：`ChartAxisFactory`\
  \ 是图表轴的工厂。通常一个图表有两个轴。图表轴由 `ValueAxis` 表示。你可以通过 `ChartAxisFactory` 的 `createValueAxis(AxisPosition\
  \ pos)` 方法创建 `ValueAxis`。可用位置定义在 `AxisPosition` 中。它们是 `BOTTOM`（底部）、`LEFT`（左侧）、`RIGHT`（右侧）和\
