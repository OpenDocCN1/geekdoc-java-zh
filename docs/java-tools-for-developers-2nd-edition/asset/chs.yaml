  \n以下是输出：\n\nJFreeChart 是一个帮助你在 Swing 应用中创建各种类型图表的库。它支持许多输出类型，如 JPEG 或 PNG。JFreeChart\
  \ 不仅限于桌面应用，它也可以用于服务器端，如 servlet 或 JSP。\n\n你可以从 [`www.jfree.org/jfreechart`](http://www.jfree.org/jfreechart)\
  \ 下载 JFreeChart。在写作时，最新版本为 1.0.14。\n\n## 创建一个简单的图表\n\n我们从一个简单的示例开始，演示如何在 Swing 应用中使用\
  \ JFreeChart 创建图表。以下是基本步骤：\n\n### 第 1 \n\n对于 Swing 应用，它包含一个顶层容器来包含其他组件。共有四种顶层容器：`JFrame`、`JDialog`、`JWindow`\
  \ 和 `JApplet`。\n\n每个顶层容器都有一个内容面板，用于包含顶层容器的可见子组件。通常，顶层容器是 `JFrame`。\n\n### 第 2 \n\
  \n你需要为图表提供数据集。至于使用哪个数据集类，取决于图表的类型。以下是主要的类型类型（基于 `Dataset` 接口）：\n\n*   `PieDataset`：这是一个包含键值对列表的数据集。键应该是唯一的且不能为空。你可以使用\
  \ `DefaultPieDataset` 类为饼图或环形图创建数据集。\n*   `CategoryDataset`：这是一个包含一个或多个数据系列的数据集。\n\
  \n\n\n\n每个数据系列都有与类别相关联的值。你可以使用 `DefaultCategoryDataset` 类为面积图、柱状图、折线图、多饼图或瀑布图创建数据集。\n\
  \n`XYDataset`：这是一个包含以 `(x, y)` 形式数据的数据集接口。你可以使用 `DefaultXYDataset` 类为极坐标图、散点图或时间序列图创建数据集。\n\
  \n### 步骤 3\n\n现在，你可以使用上一步的数据集来创建图表。你可以使用 `JFreeChart` 类来构建图表。但是，创建图表更简单的方法是使用工具类\
  \ `ChartFactory`。例如，要创建一个饼图，你可以使用：`JFreeChart ChartFactory.createPieChart(String\
  \ title, PieDataset dataset, boolean legend, boolean tooltips, boolean urls)`\n\n\
  `JFreeChart` 类表示一个 `JFreeChart` 图表，它协调各个对象基于 Java 2D API 来绘制图表。这些对象包含了上面提到的 `Dataset`。它还包含一个\
  \ `Plot`，负责使用来自 `Dataset` 的数据进行绘图。`Plot` 类是所有图表的父类。根据上述提到的这些数据集，`PiePlot` 类用于 `PieDataset`，`CategoryPlot`\
  \ 类用于 `CategoryDataset`，而 `XYPlot` 类用于 `XYDataset`。你可以使用 `getPlot()` 方法从 `JFreeChart`\
  \ 对象获取图表的 `Plot`。\n\n一个 `JFreeChart` 还包含一个 `Title` 对象的列表（主标题和包括图例在内的子标题）。`Title`\
  \ 类是所有标题的父类。允许定义标题属性，例如对齐方式（垂直或水平）或位置（顶部、底部、左侧或右）。你可以使用 `TextTitle` 或 `CompositeTitle`\
  \ 类来渲染文本（或多个文本），或使用 `ImageTitle` 类来渲染图像。图例由 `LegendTitle` 类表示。\n\n你可以通过 `addSubtitle(Title\
  \ title)` 方法添加子标题。\n\n### 步骤 4\n\n为了在 Swing 应用中显示图表，你可以使用 `ChartPanel` 类为 `JFreechart`\
  \ 对象创建一个面板。`ChartPanel` 类继承自 `JPanel` 类。要构建 `ChartPanel`，你可以使用以下方法：\n\n`ChartPanel(JFreeChart\
  \ chart)`\n\n`ChartPanel(JFreeChart chart, boolean properties, boolean save, boolean\
  \ print, boolean zoom, boolean tooltips)`：这允许你控制弹出菜单中可以使用哪些菜单项。所有菜单项默认均可用。\n\n###\
  \ 步骤 5\n\n你将图表面板添加到容器中，其余部分只需按照通常编写 Swing 应用的方法即可。\n\n以下是一个示例，演示了如何使用 Java Swing\
  \ 创建饼图。要编译并运行此示例，你需要将 JFreeChart `lib` 目录下的 `jfreechart-1.0.14.jar` 和 `jcommon-1.0.17.jar`\
  \ 添加到类路径中：\n\n```java\nimport java.awt.Color;\nimport java.awt.Container;\nimport\
  \ java.awt.event.WindowAdapter;\nimport java.awt.event.WindowEvent;\nimport java.text.NumberFormat;\n\
  import javax.swing.JFrame;\nimport org.jfree.chart.ChartFactory;\nimport org.jfree.chart.ChartPanel;\n\
  import org.jfree.chart.JFreeChart;\nimport org.jfree.chart.labels.StandardPieSectionLabelGenerator;\n\
  import org.jfree.chart.plot.PiePlot;\nimport org.jfree.chart.title.LegendTitle;\n\
  import org.jfree.chart.title.TextTitle;\nimport org.jfree.chart.data.DefaultPieDataset;\n\
  import org.jfree.chart.data.PieDataset;\nimport org.jfree.chart.ui.RectangleEdge;\n\
  \npublic class PieChart {\n    public static void main(String[] args) {\n      \
  \  PieChart example = new PieChart();\n        JFrame frame = new JFrame();\n  \
  \      Container content = frame.getContentPane();\n        DefaultPieDataset dataset\
  \ = example.createDataset();\n        JFreeChart chart = ChartFactory.createPieChart(\"\
  Pie Chart\", dataset, true, true, false);\n        ChartPanel chartPanel = new ChartPanel(chart);\n\
  \        content.add(chartPanel);\n        frame.addWindowListener(new WindowAdapter()\
  \ {\n            public void windowClosing(WindowEvent e) {\n                System.exit(0);\n\
  \            }\n        });\n        frame.pack();\n        frame.setVisible(true);\n\
  \    }\n\n    public PieDataset createDataset() {\n        DefaultPieDataset dataset\
  \ = new DefaultPieDataset();\n        dataset.setValue(\"Section 1\", 10);\n   \
  \     dataset.setValue(\"Section 2\", 20);\n        dataset.setValue(\"Section 3\"\
  , 30);\n        dataset.setValue(\"Section 4\", 40);\n        return dataset;\n\
  \    }\n\n    public JFreeChart createChart() {\n        JFreeChart chart = ChartFactory.createPieChart(\"\
  Pie Chart\", createDataset(), true, true, false);\n        PiePlot plot = (PiePlot)\
  \ chart.getPlot();\n        plot.setLabelGenerator(new StandardPieSectionLabelGenerator());\n\
  \        plot.setStartAngle(90);\n        plot.setDirection(Rotation.CLOCKWISE);\n\
  \        return chart;\n    }\n}\n```\n\n\n\n接下来，我们将讨论使用第二种数据集 `CategoryDataset`。使用\
  \ `CategoryDataset` 的图表类型之一是柱状图。要创建柱状图，可以使用：`JFreeChart ChartFactory.createBarChart(String\
  \ title, String categoryAxisLabel, String valueAxisLabel, CategoryDataset dataset,\
