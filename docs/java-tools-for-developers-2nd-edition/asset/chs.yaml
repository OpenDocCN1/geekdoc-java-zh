  \ 下载。James 2.3.2 随附了 2.3 `Mailet API`。\n\n## Apache James\n\nApache James (Java\
  \ Apache 企业级邮件服务器) 是 Apache James 项目的一部分。James Server 是一个基于 Java 的邮件服务器（技术上讲是一个邮件传输代理\
  \ MTA），支持 SMTP 和 POP3 协议。此外，它还可以作为 NNTP 新闻服务器。James Server 的特殊之处在于它提供了一个 mailet\
  \ 容器（mailet container）。\n\n就像 servlet 用于处理 servlet 容器的 HTTP 请求一样，mailets 则用于处理 mailet\
  \ 容器的邮件。通过配置，你可以使用 mailets 执行复杂的邮件处理任务。这正是 James Server 灵活且强大之处所在。James Server 提供了一些标准的\
  \ mailets。此外，你还可以使用 Apache James 项目一部分的 `Mailet API` 构建自己的 mailets。这允许你开发并部署自定义应用程序到\
  \ James Server 上进行邮件处理。\n\n对于 James Server，写作时当前的稳定版本为 2.3.2（目前有 3.0 beta 版本，但仍不稳定）。你可以从\
  \ [`james.apache.org/server`](http://james.apache.org/server) 下载。\n\n对于 `Mailet\
  \ API`，写作时当前的稳定版本为 2.5.0。你可以从 [`james.apache.org/mailet`](http://james.apache.org/mailet)\
  \ 下载。James 2.3.2 随附了 2.3 `Mailet API`。\n\n### 安装 JAMES SERVER\n\nJames Server 的二进制发行版带有\
  \ Phoenix 服务器。James 是一个邮件服务器，它与 Phoenix 服务器配合工作。James 就像 servlet 用于 servlet 容器的\
  \ HTTP 请求一样，mailets 用于处理 mailet 容器的邮件。通过配置，你可以使用 mailets 执行复杂的邮件处理任务。这正是 James Server\
  \ 灵活且强大之处所在。James Server 提供了一些标准的 mailets。此外，你还可以使用 Apache James 项目一部分的 `Mailet\
  \ API` 构建自己的 mailets。这允许你开发并部署自定义应用程序到 James Server 上进行邮件处理。\n\n（注：由于原始文本中存在大量重复的段落，根据“一定不要重复输出原文”的原则，此处译文仅保留了核心内容的逻辑翻译。）\n\
  \n\n\n\n\n`<mailetpackage>org.apache.james.transport.mailets.smime</mailetpackage>`\
  \ 以下是 James 提供的匹配器（matchers）：\n\n`<matcherpackage>org.apache.james.transport.matchers</matcherpackage>`\n\
  \n`<matcherpackage>org.apache.james.transport.matchers.smime</matcherpackage>` 对于自定义的\
  \ mailets 和匹配器，你也可以在这里定义包名。队列管理器（spool manager，由 `<spoolmanager>` 元素表示）拥有许多子级处理器（由\
  \ `<processor>` 元素表示）。每个处理器都有唯一的名称。但是，不能使用“ghost”名称，因为它被用于不再需要进一步处理的消息。每个处理器包含零或多个\
  \ mailets（由`<mailet>` 元素表示）。mailets 的顺序非常重要。\n\n在 `config.xml` 中已经定义了一些处理器。但是，只需要根处理器（root\
  \ processor）和错误处理器（error processor）。不过，你可以复用其中一些。James 将队列中的所有邮件首先路由到根处理器。队列（spool）是等待处理的传入邮件消息的临时位置。队列仓库（spool\
  \ repository）定义在 `<spoolrepository>` 元素中。默认情况下，它位于 James 根目录下的 `var/mail/spool`。如果邮件处理过程中发生任何错误，导致错误的邮件将会被重定向到错误处理器。默认情况下，错误处理器会将邮件存储在\
  \ `var/mail/error`。\n\n队列管理器是多线程的。线程总数可以通过 `<threads>` 元素定义。\n\n## 仓库 (Repositories)\n\
  \n在 James 中，仓库用于存储邮件、新闻消息以及用户信息。根据存储类型（定义在 `<mailstore>` 元素中），共有三种类型的仓库：\n\n- **文件仓库（File\
  \ repository）**：这是默认存储类型。它以“file”开头。格式为：`file://<path_to_application_root>`。例如，要向\
  \ James 根目录下的 `var/mail/spool` 存储数据，你可以使用 `file://var/mail/spool`。\n- **数据库仓库（Database\
  \ repository）**：这是一种更高效的数据存储方式。它以“db”开头。格式为：`db://<data source>/<table>/<repository>`。James\
  \ 随带了 Apache Derby 数据库。但也支持所有主要的数据库系统。你可以检查 `conf/sqlResources.xml` 来查找支持的数据库系统。数据源定义在\
  \ `<database-connections>` 元素中。\n- **DBFile 仓库**：这是文件仓库和数据库仓库的混合体。邮件消息的正文存储在文件系统中，而头信息存储在数据库中。它以“dbfile”开头。格式与数据库仓库相同。文件存储的默认位置为\
  \ `var/dbmail`。\n\n## 通用设置 (General settings)\n\n- `<James>`：定义管理员的邮箱地址、此 James\
  \ 实例的主机名/IP 地址以及用户收件箱的位置。\n- `<dnsserver>`：定义 James 使用的 DNS 服务器列表。\n\n你可以在以下元素中定义连接属性：\n\
  \n- `<connections>`：定义空闲客户端超时的时间（毫秒）和最大连接数。\n- `<thread-manager>`：定义可用的线程池。需要一个名为“default”的线程池。\n\
  \n## 用户账户 (User accounts)\n\n用户仓库定义在 `<users-store>` 元素中。默认位置是 `var/users`。要管理用户账户，可以通过\
  \ `<remotemanager>` 元素进行。远程管理器定义在 `<remotemanager>` 元素中。要连接到远程管理器，可以使用任何支持 Telnet\
  \ 协议的工具（如 PuTTY）。默认端口号为 4555。管理员登录名为 root，密码也相同。要添加用户，使用 `adduser <username> <password>`。要删除用户，使用\
  \ `deluser <username>`。\n\n## environment.xml\n\n`environment.xml` 位于 `INF` 目录下。这里定义了两个元素。一个是用于类加载，另一个用于日志记录。默认情况下，`INF`\
  \ 下的 `lib` 和 `classes` 目录用于自定义邮件应用程序。要在 James 之上创建自定义邮件应用程序，可以覆盖现有的配置，并将 JAR 或类文件放在\
  \ `lib` 或 `classes` 目录下。你也可以在这里放置你所用数据库的 JDBC 驱动。对于日志记录，James 中有很多日志文件。但它们大多数是空的。你可以更改其中一些日志的日志级别，或更改文件名模式以减少日志文件的数量。那么，如果发生任何错误，你应该检查哪一个呢？通常，你可以先查看以下文件：\n\
  \n- `mailet*.log`：此文件记录 mailets 的活动。通常这是你将检查的第一个。\n- `smtpserver*.log`：这是 SMTP 服务的日志文件。如果邮件无法递送到队列，你可以查看此文件。\n\
  - `spoolmanager*.log`：这是队列管理器的日志文件。它记录了匹配器和 mailets 初始化信息。如果你在进行任何更改后 James 无法正常启动，请检查此文件。\n\
  \n如果你想使用 log4j 替换现有的日志框架，只需遵循以下步骤：\n\n```xml\n<logs version=\"1.1\" xmlns:log4j=\"\
  http://jakarta.apache.org/log4j/\" debug=\"false\">\n  <appender name=\"CONSOLE_LOG\"\
  \ class=\"org.apache.log4j.ConsoleAppender\">\n    <param name=\"Threshold\" value=\"\
  ERROR\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"\
  ConversionPattern\" value=\"%d %-5p\"/>\n    </layout>\n  </appender>\n  <appender\
  \ name=\"FILE_LOG\" class=\"org.apache.log4j.RollingFileAppender\">\n    <param\
  \ name=\"File\" value=\"${phoenix.home}/../../logs/james.log\"/>\n    <param name=\"\
  MaxBackupIndex\" value=\"5\"/>\n    <param name=\"MaxFileSize\" value=\"10240KB\"\
  />\n    <layout class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"\
  ConversionPattern\" value=\"%d %-5p [%t]%c{1}:%L - %m\"/>\n    </layout>\n  </appender>\n\
  \  <logger name=\"smtpserver\">\n    <level value=\"INFO\"/>\n  </logger>\n  <logger\
  \ name=\"spoolmanager\">\n    <level value=\"INFO\"/>\n  </logger>\n  <logger name=\"\
  James.Mailet\">\n    <level value=\"INFO\"/>\n  </logger>\n  <!-- default 日志级别 -->\n\
  \  <root>\n    <level value=\"WARN\"/>\n    <appender-ref ref=\"FILE_LOG\"/>\n \
  \   <appender-ref ref=\"CONSOLE_LOG\"/>\n  </root>\n</logs>\n```\n\n所有内容将记录在 Phoenix\
  \ `logs` 目录下的 `james.log` 中。所有组件的默认日志级别为 WARN。由于 `smtpserver`、`spoolmanager` 和 `mailet`\
  \ 是最重要的组件，日志级别为 INFO。\n\n## james-fetchmail.xml\n\n`james-fetchmail.xml` 位于 `conf`\
  \ 目录下。fetchmail 可以从外部邮件服务器（IMAP 或 POP3）获取邮件并将其注入 James 队列进行处理。这允许你使用 James 的邮件处理功能处理来自其他服务器的邮件。\n\
  \n要设置 fetchmail，首先需要通过将属性从 `false` 改为 `true` 来启用它：\n\n```xml\n<fetchmail enabled=\"\
  true\">\n```\n\n每个 fetch 任务定义在 `<fetch>` 元素中。只要名称唯一，你可以定义尽可能多的 fetch 任务。基本上，fetch\
  \ 任务按域名定义。\n\n要获取的账户定义在 `<accounts>` 元素中。每个账户定义在 `<account>` 元素中。允许多个账户，它们将并行运行。\n\
  \n例如，从同一域名的两个账户获取邮件：\n\n```xml\n<accounts>\n  <account user=\"account1@fakedomain.com\"\
  \ password=\"password1\" recipient=\"tester1@localhost\" ignorercpt-header=\"true\"\
  />\n  <account user=\"account2@fakedomain.com\" password=\"password2\" recipient=\"\
  tester2@localhost\" ignorercpt-header=\"true\"/>\n</accounts>\n```\n\n由于指定了收件者，`ignorercpt-header`\
  \ 属性被设置为 true。现在，你可以指定用于获取邮件的服务器：\n\n```xml\n<host>pop.mail.fakedomain.com</host>\n\
  ```\n\n以及检查服务器的频率（毫秒）：\n\n\n\n\n\n<interval>600000</interval>\n\n这些就是设置 fetchmail\
  \ 所需的基础设置。但你可以通过更改其他设置来进行微调。`james-fetchmail.xml` 是自文档的。此外，你可以在 `samples` 目录下找到一些示例。\n\
  \n## 快速测试\n\n现在，我们将创建一个简单的 SMTP 客户端来测试 James 的安装情况。该 SMTP 客户端能够发送存储在文件中的邮件。关于 SMTP\
  \ 规范的详细信息，你可以查看 [http://tools.ietf.org/html/rfc821] 和 [http://www.ietf.org/rfc/rfc2821.txt]。同样，关于邮件格式的详细信息，你可以查看\
  \ [http://www.ietf.org/rfc/rfc822.txt] 和 [http://www.ietf.org/rfc/rfc2822.txt]。\n\
  \n```java\nimport java.io.BufferedReader;\nimport java.io.File;\nimport java.io.FileReader;\n\
  import java.io.InputStreamReader;\nimport java.io.IOException;\nimport java.io.PrintStream;\n\
  import java.io.Reader;\nimport java.net.Socket;\nimport java.net.UnknownHostException;\n\
  \npublic class SendMessage {\n    private static int SMTP_PORT = 25;\n    private\
  \ static int retry = 5;\n    private static String EOL = \"\\r\\n\";\n\n    public\
  \ static void main(String[] args) {\n        if(args.length < 4) {\n           \
  \ System.out.println(\"usage: SendMessage <message file> <smtp server> <sender>\
  \ <recipient>\");\n            System.exit(1);\n        }\n        String messageFile\
  \ = args[0];\n        String smtpServer = args[1];\n        String sender = args[2];\n\
  \        String recipient = args[3];\n\n        try {\n            File file = new\
  \ File(messageFile);\n            sendMessage(sender, recipient, file, smtpServer);\n\
  \            System.out.println(\"Message sent: \" + file);\n        } catch(Exception\
  \ ex) {\n            System.out.println(ex);\n        }\n    }\n\n    public static\
  \ void sendMessage(String sender, String recipient, File messageFile, String smtpServer)\n\
  \    throws IOException, UnknownHostException {\n        Socket socket = null;\n\
  \        BufferedReader socketReader = null;\n        PrintStream socketWriter =\
  \ null;\n        BufferedReader reader = null;\n\n        try {\n            socket\
  \ = new Socket(smtpServer, SMTP_PORT);\n            socketReader = new BufferedReader(new\
  \ InputStreamReader(socket.getInputStream()));\n            socketWriter = new PrintStream(socket.getOutputStream());\n\
  \            int num = 0;\n            // initiate a conversation with the mail\
  \ server\n            while(true) {\n                num++;\n                sendCommand(socketWriter,\
  \ \"HELO \" + smtpServer);\n                String response = getResponse(socketReader,\
  \ 100);\n                if(response.startsWith(\"250\")) // completed\n       \
  \             break;\n                else if(num == retry) {\n                \
  \    throw new IOException(\"Failed in HELO\");\n                }\n           \
  \ }\n            // read mail content\n            reader = new BufferedReader(new\
  \ FileReader(messageFile));\n            String line = null;\n            // sender\n\
  \            sendCommand(socketWriter, \"MAIL FROM:<\" + sender + \">\"); \n   \
  \         verifyResponse(getResponse(socketReader, 50));\n            // receiver\n\
  \            sendCommand(socketWriter, \"RCPT TO:<\" + recipient + \">\"); \n  \
  \          verifyResponse(getResponse(socketReader, 50));\n            // beginning\
  \ of mail data\n            sendCommand(socketWriter, \"DATA\");\n            getResponse(socketReader,\
  \ 50);\n            while((line = reader.readLine()) != null) {\n              \
  \  sendCommand(socketWriter, line);\n            }\n            // end of mail data\n\
  \            sendCommand(socketWriter, \".\");\n            getResponse(socketReader,\
  \ 50);\n        } finally {\n            try {\n                if(reader != null)\n\
  \                    reader.close();\n                if(socketReader != null) {\n\
  \                    sendCommand(socketWriter, \"QUIT\");\n                    socketReader.close();\n\
  \                }\n                if(socketWriter != null)\n                 \
  \   socketWriter.close();\n                if(socket != null)\n                \
  \    socket.close();\n            } catch(IOException ex) {}\n        }\n    }\n\
  \n    public static void sendCommand(PrintStream socketWriter, String command) throws\
  \ IOException {\n        socketWriter.print(command);\n        socketWriter.print(EOL);\n\
  \        socketWriter.flush();\n    }\n    public static String getResponse(BufferedReader\
  \ socketReader, long delay) throws IOException {\n        try {\n            Thread.sleep(delay);\n\
  \        } catch(Exception e) {}\n        return socketReader.readLine();\n    }\n\
  \n    public static boolean verifyResponse(String response) throws IOException {\n\
  \        if(response.startsWith(\"250\")) // requested action was completed \n \
  \           return true;\n        else\n            throw new IOException(response);\n\
  \    }\n}\n```\n\n例如，要向 James 中的用户 `tester1` 发送消息，你可以运行：`Java SendMessage mail.txt\
  \ dell530 tester@dell530 tester1@dell530`\n\n以下是 `mail.txt` 的内容：\n```\nFrom: tester@dell530\n\
  Subject: Test\nTo: tester1@dell530\nThis is a test.\n```\n\n假设 `tester1` 存在。如果不存在，邮件将位于\
  \ `var/mail/error` 中。现在，你可以检查 `var/mail/inboxes/tester1`。这是用户 `tester1` 的收件箱。与之关联有两个文件。（注意：原文在此处包含许多乱码字符/重复，为了可读性已清理)。\n\
  \n## MAILETS 和 MATCHERS\n\n处理器（Processors）在 James 中起着至关重要的作用。处理器依赖 mailets 来处理邮件。以下是处理器的结构：\n\
  \n```xml\n<processor name=\"processorName\">\n  <mailet match=\"MatcherClass=parameter\"\
  \ class=\"MailetClass\">\n    <parameter>mailet parameter</parameter>\n  </mailet>\n\
  \  ...\n</processor>\n```\n\n对于每个 mailet，有两个属性：`class` 属性中定义了代表 mailet 的类。通常，mailet\
  \ 需要满足某些条件才能执行。`match` 属性允许你指定一个定义条件的匹配器（matcher）。匹配器的参数是可选的（用等号分隔）。\n\n同样，mailet\
  \ 也可以拥有参数（mailet 元素的子节点）。\n\n在以下示例中，原始根处理器被替换为了简单的处理器：\n\n```xml\n<processor name=\"\
  root\">\n  <mailet match=\"SubjectStartsWith=Unsubscribe\" class=\"ToProcessor\"\
  >\n    <processor>unsubscribe</processor>\n  </mailet>\n  <mailet match=\"All\"\
  \ class=\"Null\"/>\n</processor>\n\n<processor name=\"unsubscribe\">\n  <mailet\
  \ match=\"All\" class=\"ToRepository\">\n    <repositoryPath>file://var/mail/unsubscribe</repositoryPath>\n\
  \  </mailet>\n</processor>\n```\n\n邮件处理从根处理器开始。要将邮件处理从一个处理器重定向到另一个，可以使用 `ToProcessor`\
  \ mailet。在示例中，主题以“Unsubscribe”开头的邮件将被重定向到 `unsubscribe` 处理器。所有其他邮件将被丢弃（自动删除）。`Null`\
  \ mailet 用于表示一封邮件处理的结束。\n\n\n\n\n需要到达目的地或被丢弃（ghosted）。否则，你将在 `spoolmanager-*.log`\
  \ 中收到一条警告消息，告知你该邮件消息将被自动删除。\n\n若要在存储库中存储邮件的副本，可以使用 `ToRepository`。你不需要手动创建 `unsubscribe`\
  \ 目录，它会在 `James` 启动时自动创建。默认情况下，原始邮件在复制后会被自动删除。\n\n你可以将可选参数 `passThrough` 设置为 `true`\
  \ 以继续处理。\n\n你可以运行 SMTP 客户端再次发送相同的邮件消息。这次它不会到达收件箱，因为不存在用于发送邮件到传输处理器的 mailet。你可以将该邮件的主题修改为“Unsubscribe”并再次发送。你将在\
  \ `unsubscribe` 目录中找到它。\n\n`James` 自带了一些 mailets 和 matchers。它们非常实用，可以为你节省大量的代码编写时间。若需\
  \ mailets 的完整列表，可以查看 [`james.apache.org/server/2/provided_mailets.html`](http://james.apache.org/server/2/provided_mailets.html)。若需\
  \ matchers 的完整列表，可以查看 [`james.apache.org/server/2/provided_matchers.html.`](http://james.apache.org/server/2/provided_matchers.html)\n\
  \n## 创建自定义 MATCHER\n\n`James` 的特殊特性之一是 `Mailet API`。它允许我们通过自定义的 matchers 和 mailets\
  \ 创建自定义的邮件应用程序。尽管 `James` 提供了一些 mailets 和 matchers，但有时我们仍然需要创建自定义的。\n\n首先，我们将讨论如何创建一个自定义\
  \ matcher。matcher 由 `Matcher` 接口表示。matcher 的生命周期涉及以下三个方法：\n\n- `void init(MatcherConfig\
  \ config)`：该方法在 matcher 实例化后立即恰好被调用一次。此方法用于初始化共享资源。\n- `Collection match(Mail mail)`：所有对\
  \ matcher 的调用都由此方法处理。邮件消息由 `Mail` 接口表示。它返回邮件消息中符合标准的收件者（`MailAddress` 对象）的 `Collection`。如果没有匹配到任何，则返回\
  \ `null`。\n- `void destroy()`：当 matcher 退出服务时（在所有调用该 matcher 的线程都退出后），该方法恰好被调用一次。此方法用于释放共享资源。\n\
  \n由于 mailet 容器是多线程的，matchers 可以并发处理调用。这类似于在 servlet 容器中运行的 servlet。你需要确保 `match`\
  \ 方法中的共享资源是线程安全的。\n\n`Mailet API` 提供了两个抽象类（`GenericMatcher` 和 `GenericRecipientMatcher`），它们实现了\
  \ `Matcher` 和 `MatcherConfig` 接口。通过扩展其中一个类来创建自定义 matcher 更容易。\n\n获取 matcher 的可选参数，可以使用\
  \ `getCondition()` 方法。如果参数不存在，则返回 `null`。\n\n`Mailet API` 提供了日志记录功能。但你无法指定日志级别。要将消息记录到\
  \ mailet 日志文件中，可以使用 `log(String message)` 或 `log(String message, Throwable t)`。\n\
  \n### GenericMatcher\n\n在接下来的示例中，我们创建一个 matcher 来改进现有的 `SubjectStartsWith` matcher。该\
  \ matcher 尝试使用正则表达式匹配主题，并忽略大小写敏感。例如，要匹配以“Unsubscribe”单词开头的主题，你可以：\n\n`match=“HasSubjectRegex=^\\\
  bUnsubscribe\\b”`\n\n`HasSubjectRegex` 类继承自 `GenericMatcher`。`GenericMatcher` 类实现了\
  \ `init` 和 `destroy` 方法。此外，它还提供了一个便利方法 `init()`，可以在不调用 `super.init(config)` 的情况下对其重写。\n\
  \n```java\npackage matcher;\n\nimport java.util.Collection;\n\nimport java.util.regex.Matcher;\n\
  \nimport java.util.regex.Pattern;\n\nimport javax.mail.MessagingException;\n\nimport\
  \ org.apache.mailet.GenericMatcher;\n\nimport org.apache.mailet.Mail;\n\npublic\
  \ class HasSubjectRegex extends GenericMatcher {\n\n    private static Pattern pattern;\n\
  \n    @Override\n    public void init() throws MessagingException {\n        String\
  \ condition = getCondition();\n        if(condition == null || condition.trim().length()\
  \ == 0) {\n            throw new MessagingException(“Condition is missing”);\n \
  \       }\n        pattern = Pattern.compile(condition, Pattern.CASE_INSENSITIVE);\n\
  \    }\n\n    @Override\n    public Collection match(Mail mail) throws MessagingException\
  \ {\n        String subject = mail.getMessage().getSubject();\n        if(subject\
  \ != null) {\n            subject = subject.trim();\n            Matcher matcher\
  \ = pattern.matcher(subject);\n            if(matcher.find())\n                return\
  \ mail.getRecipients();\n        }\n        return null;\n    }\n}\n```\n\n要编译它，你需要以下\
  \ JAR 文件：来自 Mailet API 的 `mailet-2.3.jar` 和 `mailet-api-2.3.jar`，来自 JavaMail API\
  \ 的 `mail-1.4.1.jar`。你可以在工作目录找到它们。\n\n部署此 matcher 涉及以下两个步骤：\n\n1. 将 `HasSubjectRegex.class`\
  \ 添加到 `SAR-INF/classes/matcher`\n2. 在 `<matcherpackages>` 中添加 `<matcherpackage>matcher</matcherpackage>`\n\
  \n现在，你可以重启 `James`。如果 `James` 无法启动，可以先检查 `logs/phoenix.log` 查看是否有任何错误。下一个可以检查的文件是\
  \ `spoolmanager-*.log`。\n\n### GenericRecipientMatcher\n\n`GenericRecipientMatcher`\
  \ 类继承自 `GenericMatcher`。它重写了 `match` 方法遍历遍历收件者并调用以下抽象方法：`abstract boolean matchRecipient(MailAddress\
  \ recipient)`\n\n当收件者匹配成功时，该收件者会被添加到返回的收件者 `Collection` 中。因此，不需要重写 `match` 方法，`GenericRecipientMatcher`\
  \ 的子类需要重写 `matchRecipient`。\n\n\n\n\n\n要获取 mailet 的可选参数，你可以使用以下方法：\n\n`String getInitParameter(String\
  \ name)`\n\n`String getInitParameter(String name, String defaultValue)`\n\n`Iterator\
  \ getInitParameterNames()`\n\n当 `Mail` 正在处理时，你如何在整个过程中跨 mailet 持久化某些数据？这可以通过 mail\
  \ 会话属性（mail session attributes）来实现。对于一个 `Mail`，你可以使用以下方法操作会话属性。该属性需要实现 `Serializable`\
  \ 接口：\n\n`boolean hasAttributes()`\n\n`Serializable getAttribute(String name)`\n\
  \n`Iterator getAttributeNames()`\n\n`Serializable setAttribute(String name, Serializable\
  \ object)`\n\n`void removeAllAttributes()`\n\n`Serializable removeAttribute(String\
  \ name)`\n\n正如我们之前提到的，`Mail` 对象还包含状态信息。在 mailet 完成对邮件的处理之前，你可以选择更改它的当前状态。以下是相关的方法：\n\
  \n`String getState()`\n\n`void setState(String state)`\n\n如果你什么都不做，它将通过并移动到下一个 mailet。如果状态为\
  \ `Mail.GHOST`，它将被丢弃。\n\n在下面的示例中，我们创建了一个自定义的 mailet，用于计算邮件正文的行数。当行数超过 mailet 参数中指定的阈值时，邮件将被丢弃。否则，邮件将移动到文件仓库（file\
  \ repository）。\n\n在这里，在 mailet `MessageSorter` 中设置了 mail 会话属性 `MESSAGE_SIZE`。James\
  \ 提供的匹配器 `HasMailAttributeWithValue` 用于验证下一个 mailet 中的属性值。以下是 `config.xml` 中修改后的根处理器：\n\
  \n```xml\n<processor name=\"root\">\n<mailet match=\"All\" class=\"MessageSorter\"\
  >\n  <threshold>25</threshold>\n</mailet>\n<mailet match=\"HasMailAttributeWithValue=MESSAGE_SIZE,small\"\
  \ class=\"ToProcessor\">\n  <processor>small</processor>\n</mailet>\n<mailet match=\"\
  All\" class=\"Null\"/>\n</processor>\n<processor name=\"small\">\n<mailet match=\"\
  All\" class=\"ToRepository\">\n  <repositoryPath>file://var/mail/small</repositoryPath>\n\
  </mailet>\n</processor>\n```\n\n为了让 `MessageSorter` 处理 MIME 消息，它需要检查内容是否为多部分消息（multipart\
  \ message）。但是，我们需要进一步检查它是否为嵌套的多部分消息（nested multipart message）。一旦到达层次结构的底部，我们可以获取消息正文的输入流来获取内容。我们只第一个组件感兴趣，因为它包含了纯文本邮件正文：\n\
  \n```java\npackage mailet;\n\nimport java.io.BufferedReader;\nimport java.io.IOException;\n\
  import java.io.InputStream;\nimport java.io.InputStreamReader;\nimport javax.mail.BodyPart;\n\
  import javax.mail.MessagingException;\nimport javax.mail.Multipart;\nimport javax.mail.internet.MimeMessage;\n\
  import org.apache.mailet.GenericMailet;\nimport org.apache.mailet.Mail;\n\npublic\
  \ class MessageSorter extends GenericMailet {\n    private static int threshold;\n\
  \n    @Override\n    public void init() throws MessagingException {\n        String\
  \ thresholdParam = getInitParameter(\"threshold\");\n        if(thresholdParam ==\
  \ null || thresholdParam.trim().length() == 0) {\n            throw new MessagingException(\"\
  The threshold parameter is required.\");\n        }\n        try {\n           \
  \ threshold = Integer.parseInt(thresholdParam);\n        } catch(NumberFormatException\
  \ ex) {\n            throw new MessagingException(ex.getMessage());\n        }\n\
  \    }\n\n    @Override\n    public void service(Mail mail) throws MessagingException\
  \ {\n        MimeMessage message = mail.getMessage();\n        Object content =\
  \ null;\n        try {\n            content = message.getContent();\n        } catch(IOException\
  \ ioex) {\n            throw new MessagingException(ioex.getMessage());\n      \
  \  }\n        BufferedReader reader = null;\n        try {\n            InputStream\
  \ in = null;\n            if(content instanceof Multipart) {\n                //\
  \ a multipart message\n                Multipart multiPart = (Multipart)content;\n\
  \                int count = multiPart.getCount();\n                if(count >=\
  \ 1) {\n                    // check the 1st component of the multipart\n      \
  \              BodyPart body = (BodyPart)multiPart.getBodyPart(0);\n           \
  \         Object nestedContent = body.getContent();\n                    if(nestedContent\
  \ != null && nestedContent instanceof Multipart) {\n                        // for\
  \ a nested multipart, body.getInputStream()\n                        // returns\
  \ all parts (including headers) without decoding\n                        multiPart\
  \ = (Multipart)nestedContent;\n                        count = multiPart.getCount();\n\
  \                        if(count >= 1) {\n                            // check\
  \ the 1st component of the multipart\n                            body = (BodyPart)multiPart.getBodyPart(0);\n\
  \                            // get decoded content (no headers)\n             \
  \               in = body.getInputStream();\n                        }\n       \
  \             } else {\n                        in = body.getInputStream();\n  \
  \                  }\n                }\n            } else {\n                //\
  \ not a multipart message\n                in = message.getInputStream();\n    \
  \        }\n            // message body only (no headers)\n            reader =\
  \ new BufferedReader(new InputStreamReader(in));\n            String line;\n   \
  \         int lineCount = 0;\n            mail.setAttribute(\"MESSAGE_SIZE\", \"\
  small\");\n            while((line = reader.readLine()) != null) {\n           \
  \     lineCount++;\n                if(lineCount > threshold) {\n              \
  \      mail.setAttribute(\"MESSAGE_SIZE\", \"large\");\n                    break;\n\
  \                }\n            }\n        } catch(IOException ioex) {\n       \
  \     throw new MessagingException(ioex.getMessage());\n        } finally {\n  \
  \          try {\n                if (reader != null) reader.close();\n        \
  \    } catch (IOException e) {}\n        }\n    }\n\n    @Override\n    public String\
  \ getState() {\n        return \"MessageSorter\";\n    }\n}\n```\n\n### 读取序列化对象文件\n\
