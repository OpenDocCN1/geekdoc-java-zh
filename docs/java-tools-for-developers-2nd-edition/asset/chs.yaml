  \ listener)` 方法向 `ChartPanel` 注册一个 `ChartMouseListener`。\n\n当图表被点击时，`ChartPanel`\
  \ 会向注册的监听器发送 `ChartMouseEvent` 通知。\n\n以下代码段展示了如何让饼图变为可点击。点击任何扇区时，会弹出一个显示扇区名称的对话框：\n\
  \n```java\nfinal ChartPanel chartPanel = new ChartPanel(chart);\nchartPanel.addChartMouseListener(new\
  \ ChartMouseListener() {\n    public void chartMouseClicked(ChartMouseEvent event)\
  \ {\n        PieSectionEntity entity = (PieSectionEntity)event.getEntity();\n  \
  \      JOptionPane.showMessageDialog(chartPanel, entity.getSectionKey());\n    }\n\
  \    public void chartMouseMoved(ChartMouseEvent event) {\n\n    }\n});\n```\n\n\
  你可以通过 `getEntity()` 方法获取与此鼠标事件相关的实体信息。它返回一个 `ChartEntity`。`ChartEntity` 类是图表实体类的父类。实际的实体类取决于图表类型。对于饼图，它是\
  \ `PieSectionEntity` 类。\n\n你可以启用的其他有用鼠标行为是鼠标轮行为。要启用它，你可以使用 `setMouseWheelEnabled(boolean\
  \ flag)` 方法。对于饼图，启用后可以旋转图表。对于带有坐标轴的图表，如果图表支持缩放，你可以进行放大或缩小。\n\n### 在网页中显示图表\n\n使用\
  \ JFreeChart 并不需要 GUI。你可以直接生成图表并将其输出，而无需将其显示在屏幕上。JFreeChart 提供了一个工具类 `ChartUtilities`，它可以将图表转换为特定的图像格式（JPEG\
  \ 或 PNG）。将图表保存为图像文件，可以使用以下静态方法：`saveChartAsJPEG(File file, float quality, JFreeChart\
  \ chart, int width, int height)`：质量范围在 0.0f 到 1.0f 之间。\n\n`saveChartAsJPEG(File\
  \ file, JFreeChart chart, int width, int height)`\n`saveChartAsPNG(File file, JFreeChart\
  \ chart, int width, int height)`\n\n你也可以将其写入到 `OutputStream`：\n\n`saveChartAsJPEG(OutputStream\
  \ out, float quality, JFreeChart chart, int width, int height)`\n`saveChartAsPNG(File\
  \ out, width, height)`\n\n在网页中使用 JFreeChart，以下是 servlet 的代码段：\n\n```java\npublic\
  \ void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException\
  \ {\n    response.setContentType(“image/png”);\n    OutputStream out = response.getOutputStream();\n\
  \    ChartUtilities.saveChartAsPNG(out, chart, 680, 48);\n    \n    ();\n}\n```\n\
