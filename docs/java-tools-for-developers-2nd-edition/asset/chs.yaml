  \ PDF 文档或生成个性化内容，则你需要使用不同的方法。`iText` 是一个 API，帮助帮助人员程序化地生成或更新 PDF 文档，而无需手动操作。\n\n\
  你可以从 [`itextpdf.com`](http://itextpdf.com) 下载 `iText`。本文编写时的最新版本为 5.4.0。\n\n## 创建\
  \ PDF 文档\n\n使用 `iText` 创建 PDF 文档涉及以下五个步骤：\n\n### 步骤 1\n首先，需要创建一个 `Document` 对象。默认页面大小为\
  \ A4。可用的预定义页面大小位于 `PageSize` 类中。例如，你可以使用 `PageSize.LETTER` 来设置信纸大小。如果你需要将方向从纵向改为横向，可以使用\
  \ `PageSize.LETTER.rotate()` 或 `PageSize.LETTER_LANDSCAPE`。你也可以创建一个 `Rectangle`\
  \ 对象作为自定义页面大小。`Rectangle` 类（注意不是核心 Java API 中的 `Rectangle` 类）也支持背景颜色、边框宽度/颜色。要创建一个指定页面大小或页边距（或两者都有）的\
  \ `Document`，你可以使用以下构造函数：`Document(Rectangle pageSize)`：构建具有特定页面大小和默认页边距的 `Document`。每个边距的默认值为\
  \ 36 点。由于每英寸有 72 点，因此相当于 0.5 英寸。\n\n`Document(Rectangle pageSize, float marginLeft,\
  \ float marginRight, float marginTop, float marginBottom)`\n\n### 步骤 2\n为了生成文档的输出，你需要指定一个监听特定文档的写入器\
  \ (`PDFWriter`)）。添加到文档的每个元素都会写入输出流。在这里，文档将被写入文件。通常，每个文档对应一个 `PdfWriter`。但你可以让多个\
  \ `PdfWriter` 监听同一个文档以创建略有不同的文档。例如，可以通过调用 `pause()` 方法暂停写入，通过调用 `resume()` 方法恢复写入。\n\
  \n### 步骤 3\n在向文档正文添加任何内容之前，需要将其打开。一旦文档被打开，你就无法向该文档添加任何元数据（文档描述和自定义属性）。你可以通过 `Document`\
  \ 类提供的以下方法为文档添加一些元数据：\n\n`boolean addAuthor(String author)`\n\n`boolean addKeywords(String\
  \ keywords)`\n\n`boolean addSubject(String subject)`\n\n`boolean addTitle(String\
  \ title)`\n\n`boolean addHeader(String name, String content)`：添加自定义属性。\n\n你可以通过\
  \ Adobe Reader 打开 PDF 文档来查找其元数据。点击顶部菜单栏上的“文件” -> “属性”。你可以在“描述”和“自定义（用于自定义属性）”选项卡下找到元数据。\n\
  \n一旦设置了元数据，就可以调用 `open()` 方法打开文档进行写入。\n\n### 步骤 4\n现在，你可以使用 `add(Element element)`\
  \ 方法开始向文档添加内容。你可以使用此方法向文档添加任何文本元素（`Element` 类型）。当元素被添加到文档时，其内容也会被写入监听该文档的写入器。一旦添加，你就无法再更改它。例如，`Paragraph`\
  \ 类就是文本元素之一。\n\n### 步骤 5\n最后一步是调用 `close()` 方法关闭文档写入，以刷新并关闭输出流。一旦文档关闭，就无法再向正文写入任何内容。\n\
  \n要使用 `iText` API 构建并运行程序，你需要在类路径中包含正确的 `iText` JAR 文件（例如用于 `iText` 5.4.0 的 `itextpdf-5.4.0.jar`）。\n\
  \n以下示例创建了一个 PDF 文档 `simple.pdf`，文档中只包含一个段落：\n\n```java\nimport java.io.File;\nimport\
  \ java.io.FileOutputStream;\nimport java.io.IOException;\nimport com.itextpdf.text.Document;\n\
  import com.itextpdf.text.DocumentException;\nimport com.itextpdf.text.Paragraph;\n\
  import com.itextpdf.text.pdf.PdfWriter;\n\npublic class SimpleExample {\n\n    public\
  \ static void main(String args[]) {\n        try {\n            File file = new\
  \ File(\"simple.pdf\");\n            new SimpleExample().generatePdf(file);\n  \
  \      } catch(Exception ex) {\n            System.out.println(ex);\n        }\n\
  \    }\n\n    public void generatePdf(File file) throws DocumentException, IOException\
  \ {\n        // 1. 为 PDF 创建一个文档对象\n        Document doc = new Document();\n    \
  \    // 2. 创建一个监听此文档的 PDF 写入器\n        PdfWriter.getInstance(doc, new FileOutputStream(file));\n\
  \        // 3. 打开此文档\n        doc.open();\n        // 4. 添加一个段落\n        Paragraph\
  \ par = new Paragraph(\"My first PDF document.\");\n        doc.add(par);\n    \
  \    // 5. 关闭此文档\n        doc.close();\n    }\n}\n```\n\n## 基础文本元素\n\n之前，我们创建了一个仅包含段落的\
  \ PDF 文档。一个段落包含一系列块（chunks）/短语（phrases）。块是可以添加到文档的最小有意义文本单元。块包含一个带有特定字体的字符串或一张图像。短语包含一组块。块由\
  \ `Chunk` 类表示，短语由 `Phrase` 类表示。`Chunk` 和 `Phrase` 类都是文本元素。`Paragraph` 与 `Phrase`\
  \ 非常相似，区别在于 `Paragraph` 有额外的布局参数：缩进和对齐。当 `Paragraph` 被添加到文档时会另起行。`Paragraph` 是 `Phrase`\
  \ 的子类。\n\n### Paragraph\n要构建 `Paragraph`，可以使用以下构造函数：\n`Paragraph(float leading)`\n\
  `Paragraph(Chunk chunk)`\n`Paragraph(Phrase phrase)`\n`Paragraph(String string)`\n\
  `Paragraph(String string, Font font)`\n\n此外，你可以使用 `add(Element element)` 或 `add(int\
  \ index, Element element)` 方法添加文本元素。`Paragraph` 提供了以下方法更改布局参数：\n\n`void setAlignment(int\
  \ alignment)`：设置段落对齐方式（例如 `Element.CENTER`）。\n\n`void setLineIndent(float indentation)`：设置首行缩进。\n\
  \n`void setIndentationLeft(float indentation)`：设置左缩进。\n\n`void setIndentationRight(float\
  \ indentation)`：设置右缩进。\n\n`void setLeading(float leading)`：设置行距。默认值为 16 点。\n\n`void\
  \ setSpacingBefore(float spacing)`：设置段落之前的间距。\n\n`void setSpacingAfter(float spacing)`：设置段落后的间距。\n\
  \n### Phrase\n要构建 `Phrase`，可以使用以下构造函数：\n`Phrase(Chunk chunk)`\n`Phrase(Phrase phrase)`\n\
  `Phrase(String string)`\n`Phrase(String string, Font font)`\n\n同样，你可以使用 `add` 方法向\
  \ `Phrase` 添加 `Chunk` 或 `Phrase`。\n\n### Chunk\n要构建 `Chunk`，可以使用以下构造函数：\n`Chunk(Chunk\
  \ chunk)`\n`Chunk(String string)`\n`Chunk(String string, Font font)`\n`Chunk(Image\
  \ image, float offsetX, float offsetY)`\n\n`Chunk` 不仅包含文本，还可以包含图像。`Image`（不是核心 Java\
  \ API 中的 `Image` 类）表示图形元素（例如 JPEG 或 PNG）。你可以通过 `Image.getInstance(URL url)` 或 `Image.getInstance(String\
  \ filename)` 获取图像。你可以通过 `scalePercent(int percent)` 或 `scaleToFit(int width, int\
  \ height)` 缩图像。\n\n要旋转图像，可以使用 `setRotationDegrees(float degree)`。以下是 `Chunk` 提供的一些实用方法：\n\
  \n`Chunk setAnchor(String url)`：设置链接。点击后将在浏览器中打开链接。\n\n`Chunk setAnchor(URL url)`\n\
  \n`Chunk setBackground(BaseColor color)`：设置背景颜色。\n\n`Chunk setHorizontalScaling(float\
  \ scale)`：设置文本水平缩放。你可以使用小于 1 的值来缩小宽度，或使用大于 1 的值来扩展。\n\n`Chunk setTextRenderMode(int\
  \ mode, float strokeWidth, BaseColor strokeColor)`：设置文本渲染模式。可用的文本渲染模式定义在 `PdfContentByte`\
  \ 类中。例如，`TEXT_RENDER_MODE_STROKE` 是描轮文本。\n\n\n\n\n`Chunk setTextRise(float rise)`：设置文本相对于基线的位移。正数具有上标效果，负数具有下标效果。\n\
  \n这些方法返回一个 `Chunk` 对象。这允许方法链式调用。因此，你可以以描述性的方式定义一个 `Chunk`。例如，你可以使用\n\n`chunk.setHorizontalScaling(1.5f).setBackground(BaseColor.LIGHT_GRAY)`。以下是使用这些方法的示例输出：\n\
  \n接下来的示例展示了如何使用 `Paragraph`、`Phrase` 和 `Chunk` 类创建 PDF 文档，并演示了字体样式如何在文本元素之间进行传播：\n\
  \n```java\nimport java.io.File;\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
  import com.itextpdf.text.Chunk;\nimport com.itextpdf.text.Document;\nimport com.itextpdf.text.DocumentException;\n\
  import com.itextpdf.text.Font;\nimport com.itextpdf.text.FontFactory;\nimport com.itextpdf.text.Font.FontFamily;\n\
  import com.itextpdf.text.Paragraph;\nimport com.itextpdf.text.Phrase;\nimport com.itextpdf.text.pdf.PdfWriter;\n\
  \npublic class ParagraphExample {\n    public static void main(String args[]) {\n\
  \        try {\n            File file = new File(“paragraph.pdf”);\n           \
  \ new ParagraphExample().generatePdf(file);\n        } catch(Exception ex) {\n \
  \           System.out.println(ex);\n        }\n    }\n\n    public void generatePdf(File\
  \ file) throws DocumentException, IOException {\n        // 1\\. 为 PDF 创建一个文档对象\n\
  \        Document doc = new Document();\n        // 2\\. 创建一个监听此文档的 PDF 写入器\n  \
  \      PdfWriter.getInstance(doc, new FileOutputStream(file));\n        // 3\\.\
  \ 打开文档\n        doc.open();\n        // 4\\. 添加段落\n        Paragraph par1 = new\
  \ Paragraph(“This is paragraph 1 with TIMES_ROMAN NORMAL.\",\n            new Font(FontFamily.TIMES_ROMAN,\
  \ 10));\n        par1.add(new Chunk(“This is chunk 1 with COURIER BOLD.”,\n    \
  \        new Font(FontFamily.COURIER, 10, Font.BOLD)));\n        par1.add(new Chunk(“This\
  \ is chunk 2 with paragraph default.”)); doc.add(par1);\n\n        // 字体样式的传播\n\
  \        Paragraph par2 = new Paragraph(“This is paragraph 2 with TIMES_ROMAN ITALIC.\"\
  ,\n            new Font(FontFamily.TIMES_ROMAN, 10, Font.ITALIC));\n        par2.add(new\
  \ Chunk(“This is chunk 1 with COURIER BOLD.”,\n            new Font(FontFamily.COURIER,\
  \ 10, Font.BOLD)));\n        par2.add(new Chunk(“This is chunk 2 with paragraph\
  \ default.”)); doc.add(par2);\n\n        // 字体样式不传播\n        Paragraph par3 = new\
  \ Paragraph(“This is paragraph 3 with TIMES_ROMAN ITALIC.\",\n            FontFactory.getFont(FontFactory.TIMES_ROMAN,\
  \ 10, Font.ITALIC)); par3.add(new Chunk(“This is chunk 1 with COURIER BOLD.”,\n\
  \            FontFactory.getFont(FontFactory.COURIER, 10, Font.BOLD)));\n      \
  \  par3.add(new Chunk(“This is chunk 2 with paragraph default.”)); doc.add(par3);\n\
  \n        // 使用 phrase 隔离字体样式\n        Paragraph par4 = new Paragraph(“This is paragraph\
  \ 4.”);\n        Phrase phrase1 = new Phrase(“This is phrase 1 with TIMES_ROMAN\
  \ ITALIC.\", new Font(FontFamily.TIMES_ROMAN, 10, Font.ITALIC));\n        phrase1.add(new\
  \ Chunk(“This is chunk 1 with COURIER BOLD.”,\n            new Font(FontFamily.COURIER,\
  \ 10, Font.BOLD)));\n        phrase1.add(new Chunk(“This is chunk 2 with default.”));\n\
  \        par4.add(phrase1);\n\n        Phrase phrase2 = new Phrase(“This is phrase\
  \ 2 with TIMES_ROMAN UNDERLINE.\", new Font(FontFamily.TIMES_ROMAN, 10, Font.UNDERLINE));\n\
  \        phrase2.add(new Chunk(“This is chunk 1 with COURIER BOLD.”,\n         \
  \   new Font(FontFamily.COURIER, 10, Font.BOLD)));\n        ![Image 3](img/index-78_1.jpg\n\
  \        phrase2.add(new Chunk(“This is chunk 2 with default.”));\n        par4.add(phrase2);\n\
  \        par4.add(new Chunk(“This is end of paragraph 4.”));\n        doc.add(par4);\n\
  \n        // 5\\. 关闭文档\n        doc.close();\n    }\n}\n```\n\n以下是输出：\n\n此示例中有四个段落。第一个段落中没有指定字体样式。该段落有两个子元素（两个\
  \ chunks）。由于父元素的默认字体样式为 `NORMAL`，没有任何样式传播到子元素。`Chunk 1` 和 `chunk 2` 按照定义显示。\n\n\
  在第二个段落中，字体样式被更改为 `ITALIC`。它传播到了子元素。由于 `chunk 1` 的字体样式被定义为 `BOLD`，结果字体样式为 `ITALIC`\
  \ + `BOLD`。\n\n在第三个段落中，我们使用 `FontFactory` 类创建字体。`FontFactory` 使用不同的技术来构建字体。字体样式不会传播。\n\
  \n为了更好地控制字体样式的传播，你可以使用 `Phrase` 对象作为 `Paragraph`（顶层）和 `Chunk`（底层）之间的中间层。你不在段落中指定字体样式。如果需要，在\
  \ phrase 中定义字体样式。这样一来，它只会影响子元素。[提示词中的剩余文本似乎是一段损坏或重复的技术术语字符串，但我已经对所提供示例的核心逻辑进行了处理。]\n\
  \n*注：提供的源文本后半部分包含大量重复且无意义的短语（例如，“To have better control...”, “Encoding is is...\
