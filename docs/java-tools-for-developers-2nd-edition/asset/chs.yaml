  \ 使用 EMU（英文制单位）。914400 EMU 等于英寸。`col1`、`col2`、`row1` 和 `row2` 从 0 开始计数。\n\n要在磅和\
  \ EMU 之间进行转换，你可以使用实用类 `Units`。\n\n### 步骤 3\n一旦定义了客户端锚点，就可以使用 `Drawing` 中定义的 `createChart(ClientAnchor\
  \ anchor)` 方法在绘图父级中创建图表。将返回一个 `Chart` 对象。\n\n在绘制图表之前，你可以使用 `Chart` 中定义的以下方法定义图表属性：\n\
  \n- `ChartAxisFactory getChartAxisFactory()`：`ChartAxisFactory` 是图表轴的工厂。通常一个图表有两个轴。图表轴由\
  \ `ValueAxis` 表示。你可以通过 `ChartAxisFactory` 的 `createValueAxis(AxisPosition pos)`\
  \ 方法创建 `ValueAxis`。可用位置定义在 `AxisPosition` 中。它们是 `BOTTOM`、`LEFT`、`RIGHT` 和 `TOP`。\n\
  - `ChartDataFactory getChartDataFactory()`：`ChartDataFactory` 是不同图表类型的工厂。到目前为止仅支持散点图。你可以通过\
  \ `createScatterChartData()` 方法获取 `ScatterChartData`。\n- `ChartLegend getOrCreateLegend()`：图图例由\
  \ `ChartLegend` 表示。你可以使用 `setPosition(LegendPosition position)` 方法指定图例的位置。可用位置定义在\
  \ `LegendPosition` 中。它们是 `BOTTOM`、`LEFT`、`RIGHT`、`TOP` 和 `TOP_RIGHT`。\n\n### 步骤\
  \ 4\n散点图需要两组数据。一组用于 X 轴值，另一组用于 Y 轴值。使用 `addSerie(ChartDataSource<?> xs, ChartDataSource<?\
  \ extends Number> ys)` 方法将分别代表 X 轴值和 Y 轴值的两个 `ChartDataSource` 对象添加到 `ScatterChartData`\
  \ 中。\n\n### 步骤 5\n一旦定义了图表数据和轴，你就可以调用 `Chart` 中定义的 `plot(ChartData data)` 来绘制图表。以下示例展示了如何从具有两列的\
  \ Excel 文档读取数据并绘制散点图：\n\n```java\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\n\
