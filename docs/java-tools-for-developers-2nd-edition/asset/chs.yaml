  \n### 公式求值\n\n我们已经讨论了如何创建一个 Excel 文档。关于现有的 Excel 文档呢？通过 `InputStream` 创建。要访问工作表，可以使用\
  \ `getSheet(String)` 或 `getSheetAt(int)`。以下示例显示了如何加载之前的 Excel 文档并获取单元格的值：\n\n```java\n\
