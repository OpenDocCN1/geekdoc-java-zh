  \ 或 `CustomXYURLGenerator` 类）。\n\n## EasyMock, JUnit, 和 PowerMock\n\n单元测试由程序员编写，用于从程序员的角度对类或方法进行测试。每个测试应该是相互独立的，并且在没有任何依赖的情况下进行测试。但对象并不是孤立工作的。在真实系统中，对象是协同工作的。而且，某些场景很难创建或重现，可能涉及与数据库或网络的交互。设置整个环境可能是复杂的。如果我们不进行集成测试，如何在没有任何依赖的情况下进行隔离单元测试呢？我们需要在单元测试中引入存根（stub）或模拟（mock）对象来处理依赖。这两类对象与真实具有相同的接口。存根对象是简单返回预设响应的对象。模拟对象是在不同场景下，以受控的方式模拟真实的对象。它们可以帮助判断测试是失败还是通过。无论你要创建什么类型的对象，这都是一项繁琐的工作。\n\
  \n`EasyMock` 是一个可以节省你手动接线模拟对象时间并在运行时创建模拟对象的框架。`JUnit` 是一个单元测试框架。`JUnit` 和 `EasyMock`\
  \ 可以轻松协同工作。`PowerMock` 是一个扩展了其他模拟框架的模拟框架。`PowerMock` 扩展了 `EasyMock`，具有诸如对私有、静态或最终方法进行模拟等功能。目前，它支持\
  \ `EasyMock` 和 `Mockito`。\n\n你可以从 [`easymock.org`](http://easymock.org) 下载 `EasyMock`。编写时对应的最新版本为\
  \ 3.4。\n\n你可以从 [`junit.org.`](http://junit.org) 下载 `JUnit`。编写时最新的稳定版本为 4.12。\n\n\
  你可以从 [`github.com/jayway/powermock.`](https://github.com/jayway/powermock) 下载用于\
  \ `EasyMock` 和 `JUnit` 的 `PowerMock`。编写时最新版本为 1.6.4。\n\n## JUNIT 简介\n\n`EasyMock`\
  \ 与 `JUnit` 使用使用。在我们开始学习如何使用 `EasyMock` 之前，让我们先讨论如何使用 `JUnit` 创建单元测试。一个 `JUnit`\
  \ 测试用例（或测试类）通过 Java 类定义。一个测试用例包含许多测试。你也可以将测试用例组合成测试套件。\n\n### 注解\n\n从 `JUnit` 4\
  \ 开始（需要 JSE 5.0 及以上版本），支持注解：\n\n- `@BeforeClass`：表示该方法在所有测试开始之前执行一次。被注解的方法需要是 `public\
  \ static void` 且没有参数。`@BeforeClass` 破了测试之间应该是相互独立的概念。然而，你可以使用它来初始化昂贵的资源，例如数据库连接。你不希望为每个测试都这样做。\n\
  - `@AfterClass`：表示该方法在所有测试结束后执行一次。通常，用于释放在 `@BeforeClass` 中创建的资源。被注解的方法需要是 `public\
  \ static void` 且没有参数。即使任何 `@BeforeClass` 方法抛出异常，它们也能保证运行。\n- `@Before`：表示该方法在每个\
  \ `@Test` 方法之前执行。被注解的方法需要是 `public void` 且没有参数。\n- `@After`：表示该方法在每个 `@Test` 方法之后执行。被注解的方法需要是\
  \ `public void` 且没有参数。\n- `@Test`：表示该方法是一个测试。测试方法需要声明为 `public void` 且没有参数。`@Test`\
  \ 有两个可选参数：第一个是 `timeout`，指定超时毫秒数。如果超时，将抛出 `TimeoutException`。第二个是 `expected`，指定预期的异常。如果没有抛出异常或抛出了不同的异常，测试将失败。例如，要指定\
  \ `IllegalArgumentException`，可以使用 `@Test(expected=IllegalArgumentException.class)`。\n\
  - `@Ignore`：要忽略某个测试，可以移除 `@Test` 或将其注释掉。如果你需要运行器报告忽略测试的数量，可以在 `@Test` 之前或之后添加 `@Ignore`。`@Ignore`\
  \ 可以用于类以忽略整个测试用例。如果你想对忽略的测试添加注释，可以使用 `@Ignore(\"string\")`。\n- `@FixMethodOrder`：测试之间不应假设任何执行顺序。在\
  \ `JUnit` 中执行顺序是未定义的。尽管不鼓励依赖顺序的测试，但在 11 版本中，可以使用 `@FixMethodOrder` 更改测试用例的执行顺序。可选选项：`MethodSorters.DEFAULT`（更具预测性的默认行为）、`MethodSorters.JVM`（11\
  \ 版本之前的行为）、`MethodSorters.NAME_ASCENDING`。\n\n以下是测试用例的基本结构：\n\n```java\npublic class\
  \ MyTestCase {\n\n    @BeforeClass\n    public static void setUpClass() {\n    \
  \    …\n    }\n\n    @AfterClass\n    public static void tearDownClass() {\n   \
  \     …\n    }\n\n    @Before\n    public void setUp() {\n        …\n    }\n\n \
  \   @After\n    public void tearDown() {\n        …\n    }\n\n    @Test\n    public\
  \ void testMethod1() {\n        …\n    }\n\n    @Test\n    public void testMethod2()\
  \ {\n        …\n    }\n\n}\n```\n\n以下是上述测试用例的执行顺序：\n\n`setUpClass()` -> `setUp()`\
  \ -> `testMethod1()` -> `tearDown()` -> `setUp()` -> `testMethod2()` -> `tearDown()`\
  \ -> `tearDownClass()`\n\n测试固件包含测试用例中使用的常用对象集。它就像测试的初始化。你使用测试固件作为测试用例的基准，以确保测试在固定环境中运行，从而使结果可重复。你可以在测试用例中使用固件注解，而无需为每个测试重复相同的代码。共有四个固件注解：`@BeforeClass`、`@AfterClass`、`@Before`\
  \ 和 `@After`。\n\n\n\n\n断言用于检查测试结果是否符合预期。当断言失败时，会抛出一个 `AssertionError`。断言方法定义在 `Assert`\
  \ 类中，并可以为 `AssertionError` 提供一个可选的消息。由于断言方法被声明为 `static void`，你可以直接使用它们，例如 `Assert.assertFalse(..)`。但是，你可以使用静态导入（例如\
  \ `import static org.junit.Assert.*`）让它们在代码中看起来更简洁，而无需包含类名。以下是一些断言方法：\n\n- `fail([String\
  \ message])`：无条件地失败测试。\n- `assertFalse([String message, ]boolean condition)`：断言条件为假。\n\
  - `assertTrue([String message, ]boolean condition)`：断言条件为真。\n- `assertNotNull([String\
  \ message, ]Object object)`：断言对象不为空。\n- `assertNull([String message, ]Object object)`：断言对象为空。\n\
  - `assertNotSame([String message, ]Object expected, Object actual)`：断言 `expected`\
  \ 和 `actual` 没有引用同一个对象。\n- `assertSame([String message, ]Object expected, Object\
  \ actual)`：断言 `expected` 和 `actual` 引用同一个对象（对象引用相等性）。\n- `assertEquals([String message,\
  \ ]Object expected, Object actual)`：断言 `expected` 和 `actual` 相等（通过实现 equals 方法实现的对象值相等性）。\n\
  - `assertEquals([String message, ]double expected, double actual, double delta)`：断言\
  \ `expected` 和 `actual` 在正数 delta 范围内相等。\n- `assertArrayEquals([String message,\
  \ ]Object[] expecteds, Object[] actuals)`：断言 `expects` 和 `actuals` 相等。\n\n## 测试运行器\
  \ (Test Runners)\n\n你可以通过测试运行器运行 JUnit 测试。要在 Java 程序中运行测试（或测试套），你可以使用：\n\n```java\n\
  org.junit.runner.Result org.junit.runner.JUnitCore.runClasses(java.lang.Class<?>…classes)\n\
  ```\n\n要在命令行运行测试，可以使用：\n\n```bash\norg.junit.runner.JUnitCore {test case class 1}[\
  \ test case class 2…]\n```\n\n默认的测试运行器是 `BlockJUnit4ClassRunner`。它可以使用以下注解进行替换：`@RunWith`。\n\
  \n例如，为了在套集中组合测试用例，你可以在类声明之前在类中使用以下注解：\n\n```java\n@RunWith(Suite.class)\n@Suite.SuiteClasses({TestCase1.class,\
  \ TestCase2.class, …})\n```\n\n例如：\n\n```java\nimport org.junit.AfterClass;\nimport\
  \ org.junit.BeforeClass;\nimport org.junit.runner.RunWith;\nimport org.junit.runners.Suite;\n\
  \n@RunWith(Suite.class)\n@Suite.SuiteClasses({MyTestCase.class, PurchaseManagerTest.class})\
  \ \npublic class MyTestSuite {\n\n    @BeforeClass\n    public static void setUpClass()\
  \ {\n        …\n    }\n\n    @AfterClass\n    public static void tearDownClass()\
  \ {\n        …\n    }\n}\n```\n\nJUnit 将使用 `@RunWith` 中指定的类来运行测试，而不是内置的运行器。你仍然可以在测试套件中使用\
  \ `@BeforeClass` 或 `@AfterClass`。`@BeforeClass`将在所有测试用例的 `@BeforeClass` 之前运行，而 `@AfterClass`\
  \ 将会在所有测试用例的 `@AfterClass` 之后运行。启动套件运行器通过前面提到的 `JUnitCore` 完成。\n\n要对通过 Spring 应用上下文构建和初始化的对象提供单元测试，你可以使用\
  \ `SpringJUnit4ClassRunner`。例如，你可以为测试类创建一个具有以下基本结构的基类：\n\n```java\n@RunWith(SpringJUnit4ClassRunner.class)\n\
  @ContextConfiguration(locations = {\n    …\n}\n)\npublic abstract class MyTestBase\
  \ implements ApplicationContextAware {\n    private ApplicationContext applicationContext;\n\
  \n    @Override\n    public void setApplicationContext(ApplicationContext applicationContext)\
  \ throws BeansException {\n        this.applicationContext = applicationContext;\n\
  \    }\n}\n```\n\n通过实现 `ApplicationContextAware`，将为测试实例提供一个 `ApplicationContext`\
  \ 的引用。\n\n有关 JUnit 的更多信息，你可以检查来自 http://junit.org/javadoc/latest/index.html 的 JUnit\
  \ API 文档。\n\n## 一个 JUnit 测试用例范例\n\n我们已经对 JUnit 有了基本的了解。现在，让我们用一个简单的例子来解释如何创建一个测试用例。以下示例包含一个管理类，负责通过数据提供者获取产品信息（如价格或库存）。数据提供者由\
  \ `DataProvider` 接口表示。它可以基于各种数据源进行实现。\n\n```java\npublic interface DataProvider\
  \ {\n    public double getPrice(String productNo);\n    public int getInventory(String\
  \ productNo);\n    public boolean exists(String productNo);\n}\n\npublic class PurchaseManager\
  \ {\n    private DataProvider dataProvider;\n\n    public PurchaseManager(DataProvider\
  \ dataProvider) {\n        this.dataProvider = dataProvider;\n    }\n\n    public\
  \ double getPrice(String productNo) throws ProductNotFoundException {\n        if(!existsProduct(productNo))\n\
  \            throw new ProductNotFoundException(\"Cannot find product # \" + productNo);\
  \ \n        return dataProvider.getPrice(productNo);\n    }\n\n    public int getInventory(String\
  \ productNo) throws ProductNotFoundException {\n        if(!existsProduct(productNo))\n\
  \            throw new ProductNotFoundException(\"Cannot find product # \" + productNo);\
  \ \n        return dataProvider.getInventory(productNo);\n    }\n\n    public double\
  \ getTotal(String productNo) throws ProductNotFoundException {\n        // ...实现\n\
  \    }\n\n    private boolean existsProduct(String productNo) {\n        return\
  \ dataProvider.exists(productNo);\n    }\n}\n```\n\n\n\n\n```java\npurchaseMgr.existsProduct(null);\n\
  \n}\n\n@Test\npublic void nullProductException() {\n    try {\n        purchaseMgr.existsProduct(null);\n\
  \        fail();\n    } catch(Exception ex) {\n    }\n}\n\n@Test\npublic void existsProduct()\
  \ {\n    boolean actual = purchaseMgr.existsProduct(“A0001”); assertTrue(actual);\n\
  }\n\n@Test(expected=ProductNotFoundException.class)\npublic void notFound() throws\
  \ ProductNotFoundException {\n    purchaseMgr.getPrice(“B0001”);\n}\n\n@Test\npublic\
  \ void getPrice() throws ProductNotFoundException {\n    double expected = 150;\n\
  \    double price = purchaseMgr.getPrice(“A0001”);\n    assertEquals(expected, price,\
  \ 0);\n}\n\n@Test\npublic void getInventory() throws ProductNotFoundException {\n\
  \    int expected = 10;\n    int inventory = purchaseMgr.getInventory(“A0001”);\n\
  \    assertEquals(expected, inventory);\n}\n\n@Test\npublic void getTotal() throws\
  \ ProductNotFoundException, NotEnoughInventoryException {\n    double expected =\
  \ 150*8;\n    double total = purchaseMgr.getTotal(“A0001”, 8);\n    assertEquals(expected,\
  \ total, 0);\n}\n\n@Test(expected=NotEnoughInventoryException.class)\npublic void\
  \ notEnoughInventory() throws ProductNotFoundException, NotEnoughInventoryException\
  \ {\n    purchaseMgr.getTotal(“A0002”, 8);\n}\n\n}\n```\n\n现在，你可以运行：\n\n```\njava\
  \ org.junit.runner.JUnitCore PurchaseManagerTest\n```\n\n以下是输出：\n\n```\nJUnit version\
  \ 4.12\n……..\nTime: 0.016\nOK (8 tests)\n```\n\n如果有任何失败的用例，你会看到类似的错误信息，例如：有 1 个失败：\n\
  \n1) getTotal(PurchaseManagerTest)\njava.lang.AssertionError: expected:<1200.0>\
  \ but was:<1120.0> at org.junit.Assert.fail(Assert.java:88)\nat org.junit.Assert.failNotEquals(Assert.java:834)\n\
  at org.junit.Assert.assertEquals(Assert.java:553)\nat org.junit.Assert.assertEquals(Assert.java:683)\n\
  at PurchaseManagerTest.getTotal(PurchaseManagerTest.java:77)\nat sun.reflect.NativeMethodAccessorImpl.invoke0(Native\
  \ Method)\n…\nFAILURES!!!\nTests run: 8, Failures: 1\n```\n\n## EASYMOCK 简介\n\n\
  我们刚刚使用 mock 对象（一个虚拟数据提供者）创建了第一个 JUnit 测试用例。这种方法的缺点是你有额外的代码需要创建和维护它。\n\n现在，我们想通过引入\
  \ EasyMock 和 JUnit 来摆脱那个手动手工接线的步骤。使用 EasyMock 创建和使用 mock 对象涉及以下步骤： \n\n### 步骤 1\n\
  你需要使用 `EasyMock.createMock(Class<T> toMock)` 创建一个实现给定接口的 mock 对象。\n\n### 步骤 2\n\
  记录 mock 对象的预期行为。这被称为记录状态（record state）。在记录状态下，它记录预期的方法调用（或 mock 方法）。\n\n### 步骤 3\n\
  通过调用 `EasyMock.replay(Object… mocks)` 从记录状态切换到重放状态（replay state）。在此状态下，它会检查预期的方法是否被调用。\n\
  \n**注意**：你不能对 `equals()`、`toString()`、`hashCode()` 和 `finalize()` 记录你自己的行为。EasyMock\
  \ 为它们提供了内置行为。\n\n**注意**：如果你想复用一个 mock 对象，可以使用 `reset(Object… mocks)` 方法将其重置回期望设置模式。这对于创建成本昂贵的\
  \ mock 对象非常很有用。你可以在 `@BeforeClass` 方法中创建它们，并在 `@Before` 或 `@After` 方法中重置它们。\n\n\
  ## 验证行为\n\n默认情况下，EasyMock 只检查带有正确参数的预期方法是否被调用。\n\n如果你需要验证行为，可以在测试结束时使用 `EasyMock.verify(Object…\
  \ mocks)`。`verify()` 执行何种检查取决于 mock 对象是如何创建的：\n\n- 对于由 `EasyMock.createMock()` 创建的\
  \ mock 对象，不检查方法调用的顺序。但所有指定参数的预期方法都应该被调用。任何意外的调用都会抛出 `AssertionError`。\n- 对于由 `EasyMock.createStrictMock()`\
  \ 创建的 mock 对象，会检查方法调用的顺序。并且所有指定参数的预期方法都应该被调用。任何意外的调用都会抛出 `AssertionError`。\n- 对于由\
  \ `EasyMock.createNiceMock()` 创建的 mock 对象，不检查方法调用的顺序。但所有指定参数的预期方法都应该被调用。允许意外的方法调用。根据返回值的数据类型，意外的方法调用将返回\
  \ `0`（非布尔原始数据类型）、`false`（布尔类型）或 `null`（Object 及其子类）。\n\n你可以通过 `EasyMock.checkOrder(Object\
  \ mock, boolean flag)` 来开启或关闭顺序检查。\n\n## 期望\n\n在记录状态下，你可以记录的不只是预期的方法调用。你可以将预期方法调用封装在\
  \ `EasyMock.expect(T value)` 中以为方法调用设置期望，或者使用 `EasyMock.expectLastCall()` 为上一次预期的方法调用设置期望。这两个方法调用都返回一个\
  \ `IExpectationSetters` 对象。期望设置被定义在 `IExpectationSetters` 接口中。\n\n要指定调用次数，可以使用以下期望：\n\
  - `times(int count)`\n- `times(int min, max)`\n- `atLeastOnce()`\n- `once()`\n-\
  \ `anyTimes()`\n\n`once()` 是预期方法调用的默认值。例如，为了允许...\n\n要指定返回值，可以使用 `andReturn(T value)`。要指定要抛出的异常，可以使用\
  \ `andThrow(Throwable)`。\n\n除了在方法参数上使用精确匹配（原始值）外，你还可以使用参数匹配器（argument matchers）来为方法调用指定期望。以下是\
  \ `EasyMock` 类定义的一些匹配器：\n- `eq(X value)`：期望某个值。\n- `same(T value)`：期望相同的对象。\n- `anyXXX()`：匹配任何值。例如，`anyDouble()`、`anyObject()`。\n\
  - `isNull(Class<T> clazz)`：期望空。\n- `notNull(Class<T> clazz)`：期望非空。\n- `isA(Class<T>\
  \ clazz)`：期望某种类型的对象。\n- `not(X value)`：期望不匹配的值。\n- `and(X first, X second)`：期望两个值都匹配。\n\
  - `or(X first, X second)`：期望其中一个值匹配。\n- `lt`、`leq`、`geq`、`gt`：适用于数值原始类型和 Comparable\
  \ 类型。\n- 字符串操作：`startsWith(String prefix)`、`contains(String substring)`、`endsWith(String\
  \ suffix)`。\n\n\n\n\n\n参数匹配器（Argument matchers）可以通过 `and()`、`or()`、`not()` 组合。你可以通过实现\
  \ `IArgumentMatcher` 接口来定义自己的参数匹配器。\n\n如果方法中的任何一个参数使用了参数匹配器，那么该方法中的所有参数都必须使用参数匹配器。如果一个方法中混合了匹配器和原始值，你可以在原始值上使用\
  \ `eq()` 参数匹配器以防止错误的发生。\n\n### EasyMockSupport\n\n`EasyMockSupport` 是一个辅助类，它可以跟踪所有的模拟对象（mock\
  \ objects）。如果一个测试用例中有多个 mock 对象，可以扩展 `EasyMockSupport` 类。\n\n你可以在所有 mock 对象可以使用\
  \ `replayAll()`、`verifyAll()` 或 `resetAll()`，而不是一个一个地对 mock 对象使用 `replay()`、`verify()`\
  \ 或 `reset()`。\n\n在扩展 `EasyMockSupport` 时，你不要使用 `EasyMock` 类中的静态方法 `createMock()`。你应该使用继承自\
  \ `EasyMockSupport` 的 `createMock()`。对于 `createStrictMock()` 和 `createNiceMock()`\
  \ 也是如此。\n\n### 类模拟 (Class mocking)\n\nEasyMock 同时支持接口模拟和类模拟。要执行类模拟，你需要在路径中包含 `Objenesis`\
  \ ([`objenesis.org`](http://objenesis.org))。最后的（final）和私有的（private）方法无法被模拟。如果调用，将执行它们的普通代码。对于抽象类，抽象方法会被自动模拟。\n\
  \n### 部分模拟 (Partial mocking)\n\n要为接口或类创建部分模拟，你可以使用 `createMockBuilder` 方法。\n\n将返回一个类型为\
  \ `IMockBuilder` 的部分模拟构建器。例如：\n\n```\ncreateMockBuilder(SomeClass.class)\n  .addMockedMethod(\"\
  method1\")\n  .addMockedMethod(\"method2\")\n  .createMock();\n```\n\n这创建了一个模拟两个方法（`method1`\
  \ 和 `method2`）的部分模拟构建器。不允许重载方法。对于重载方法，你可以通过 `addMockMethod(String methodName, Class<?>…\
  \ parameters)` 显式地定义方法参数。\n\n私有的、静态或最后的方法无法被模拟。\n\n在 EasyMock 3.4 中，可以使用 `createMockBuilder`\
  \ 方法的新版本 `partialMockBuilder` 来替代。\n\n### 在 JUNIT 中使用 EASYMOCK\n\n现在，我们可以通过 EasyMock\
  \ 为数据提供者创建 mock 对象。在这个例中，我们使用接口模拟。EasyMock 适用于 JSE 5.0 及以上版本。此外，除了 JUnit 的 JAR 包外，你还需要路径中添加\
  \ `easymock-3.4.jar`。\n\n```java\nimport static org.easymock.EasyMock.*;\nimport\
  \ static org.junit.Assert.*;\nimport org.junit.After;\nimport org.junit.Before;\n\
  import org.junit.Test;\n\npublic class PurchaseManagerTest1 {\n    private DataProvider\
  \ provider;\n    private PurchaseManager purchaseMgr;\n\n    @Before\n    public\
  \ void setUp() {\n        provider = createMock(DataProvider.class);\n        purchaseMgr\
  \ = new PurchaseManager(provider);\n    }\n\n    @After\n    public void tearDown()\
  \ {\n        provider = null;\n        purchaseMgr = null;\n    }\n\n    @Test(expected=IllegalArgumentException.class)\n\
  \    public void nullProduct() {\n        purchaseMgr.existsProduct(null);\n   \
  \ }\n\n    @Test\n    public void nullProductException() {\n        try {\n    \
  \        purchaseMgr.existsProduct(null);\n            fail();\n        } catch(Exception\
  \ ex) {\n        }\n    }\n\n    @Test\n    public void existsProduct() {\n    \
  \    String productNo = \"A0001\";\n        expect(provider.exists(productNo)).andReturn(true);\n\
  \        replay(provider);\n        boolean actual = purchaseMgr.existsProduct(productNo);\n\
  \        assertTrue(actual);\n    }\n\n    @Test(expected=ProductNotFoundException.class)\n\
  \    public void notFound() throws ProductNotFoundException {\n        String productNo\
  \ = \"B0001\";\n        expect(provider.exists(productNo)).andReturn(false);\n \
  \       replay(provider);\n        purchaseMgr.getPrice(productNo);\n    }\n\n \
  \   @Test\n    public void getPrice() throws ProductNotFoundException {\n      \
  \  String productNo = \"A0001\";\n        double expected = 150;\n        expect(provider.exists(productNo)).andReturn(true);\n\
  \        expect(provider.getPrice(productNo)).andReturn(expected);\n        replay(provider);\n\
  \        double price = purchaseMgr.getPrice(productNo);\n        assertEquals(price,\
  \ expected, 0);\n    }\n\n    @Test\n    public void getInventory() throws ProductNotFoundException\
  \ {\n        String productNo = \"A0001\";\n        int expected = 10;\n       \
  \ expect(provider.exists(productNo)).andReturn(true);\n        expect(provider.getInventory(productNo)).andReturn(expected);\n\
  \        replay(provider);\n        int inventory = purchaseMgr.getInventory(productNo);\n\
  \        assertEquals(inventory, expected);\n    }\n\n    @Test\n    public void\
  \ getTotal() throws ProductNotFoundException, NotEnoughInventoryException {\n  \
  \      String productNo = \"A0001\";\n        int quantity = 8;\n        double\
  \ price = 150;\n        double expected = price * quantity;\n        expect(provider.exists(productNo)).andReturn(true);\n\
  \        expect(provider.getInventory(productNo)).andReturn(10);\n        expect(provider.getPrice(productNo)).andReturn(price);\n\
  \        replay(provider);\n        double total = purchaseMgr.getTotal(productNo);\n\
  \        assertEquals(total, expected);\n    }\n\n    @Test(expected=NotEnoughInventoryException.class)\n\
  \    public void notInventory() {\n        String productNo = \"A0002\";\n     \
  \   int quantity = 8;\n        expect(provider.exists(productNo)).andReturn(true);\n\
  \        expect(provider.getInventory(productNo)).andReturn(5);\n        replay(provider);\n\
  \    }\n}\n```\n\n如果测试失败，你将看到输出：\n`There was 1 failure: PurchaseManagerTest1.notInventory()\
  \ expected: NotInventoryException but was DataProvider.exists(\"A0002\") org.easymock.internal.MockHandler:44)`\n\
  \n### 使用注解\n\n你也可以使用注解创建 mock 并将其注入到测试对象中。这是从 EasyMock 3.2 开始的。`@Mock` 等同于 `createMock()`\
  \ 方法。要指定 mock 类型，可以在 `@Mock` 中使用可选元素 `type` 来创建 nice 或 strict mock。`@TestSubject`\
  \ 用于将通过 `@Mock` 创建的 mock 注入字段中。测试类不需要 setter。因为测试运行器负责初始化，所以不需要 `setUp()` 方法。之前的示例可以修改为：\n\
  \n```java\n@RunWith(EasyMockRunner.class)\npublic class PurchaseManagerTest2 {\n\
  \    @Mock\n    private DataProvider provider;\n    @TestSubject\n    private PurchaseManager\
  \ purchaseMgr = new PurchaseManager();\n}\n```\n\n如果测试使用了其他的运行器，那么可以使用 JUnit 规则。这是从\
  \ EasyMock 3.3 开始提供的。例如：\n\n```java\npublic class PurchaseManagerTest2 {\n    @Rule\n\
  \    public EasyMockRule mocks = new EasyMockRule(this);\n    @Mock\n    private\
  \ DataProvider provider;\n    @TestSubject\n    private PurchaseManager purchaseMgr\
  \ = new PurchaseManager();\n}\n```\n\n### 使用期望 (EXPECTATIONS)\n\n在 EasyMock 中，期望在测试过程中验证行为起着重要作用。在这里，我们将更多地讨论\
  \ EasyMock 中的期望。在以下示例中，使用了 `MessageBuilder` 类来构建消息。\n\n```java\npublic interface\
  \ MessageBuilder {\n    public void setGreeting(int style, StringBuilder message);\n\
  \    public void addParagraph(String paragraph, StringBuilder message);\n    public\
  \ void setSignOff(int style, StringBuilder message);\n}\n\npublic class MyMessage\
  \ {\n    private MessageBuilder builder;\n\n    public MyMessage(MessageBuilder\
  \ builder) {\n        this.builder = builder;\n    }\n\n    public String generate(int\
  \ style, String[] paragraphs) {\n        if(paragraphs == null)\n            throw\
  \ new IllegalArgumentException(\"paragraphs is null.\");\n        StringBuilder\
  \ message = new StringBuilder();\n        builder.setGreeting(style, message);\n\
  \        for(String paragraph : paragraphs)\n            builder.addParagraph(paragraph,\
  \ message);\n        builder.setSignOff(style, message);\n        return message.toString();\n\
  \    }\n}\n```\n\n在以下测试用例中，只有一个测试。在测试中，我们假设 `MessageBuilder` 提供了两种样式（值分别为 1 和 2）。\n\
  \n\n\n\n```java\nimport static org.easymock.EasyMock.*;\n\nimport org.junit.After;\n\
  \nimport org.junit.Before;\n\nimport org.junit.Test;\n\npublic class MyMessageTest\
  \ {\n\n    private MessageBuilder builder;\n\n    private MyMessage message;\n\n\
  \    @Before\n    public void setUp() {\n        builder = createMock(MessageBuilder.class);\n\
  \        message = new MyMessage(builder);\n    }\n\n    @After\n    public void\
  \ tearDown() {\n        builder = null;\n        message = null;\n    }\n\n    @Test\n\
  \    public void generate() {\n        String[] paragraphs = new String[]{“p1”,\
  \ “p2”};\n        builder.setGreeting(and(geq(1), leq(2)), isA(StringBuilder.class));\
  \ \n        builder.addParagraph(isA(String.class), isA(StringBuilder.class)); \n\
  \        expectLastCall().times(paragraphs.length);\n        builder.setSignOff(and(geq(1),\
  \ leq(2)), isA(StringBuilder.class)); \n        replay(builder);\n        String\
  \ result = message.generate(1, paragraphs); \n        verify(builder);\n    }\n\
  }\n```\n\n你可能注意到上面的测试用例缺少了一些东西。它确实测试了 `generate()` 方法的行为，但它没有验证结果。由于 `MessageBuilder`\
  \ 类中的方法是 `void` 类型的，我们显然无法使用 `andReturn()` 方法。对于返回 `void` 的方法，我们该怎么办？答案是使用期望设置器和\
  \ `answer(IAnswer<? extends T> answer)`，它允许你为预期的方法调用计算答案或抛出异常。这允许你模拟外部操作。我们做的就是实现\
  \ `IAnswer` 接口。`IAnswer` 只有一个方法：\n\n```\nT answer() throws Throwable\n```\n\n在该方法内部，你可以使用\
  \ `EasyMock.getCurrentArguments()` 来获取预期方法调用中的参数数组。对于 `void` 方法，将返回 `null`。返回的值（要生成的消息）通过一个可变类\
  \ `StringBuilder` 在方法之间进行传递。以下是修改后的 `MyMessageTest` 版本：\n\n```java\nimport static\
  \ org.easymock.EasyMock.*;\n\nimport static org.junit.Assert.*;\n\nimport org.easymock.IAnswer;\n\
  \nimport org.junit.After;\n\nimport org.junit.Before;\n\nimport org.junit.Test;\n\
  \npublic class MyMessageTest1 {\n\n    private MessageBuilder builder;\n\n    private\
  \ MyMessage message;\n\n    @Before\n    public void setUp() {\n        builder\
  \ = createMock(MessageBuilder.class);\n        message = new MyMessage(builder);\n\
  \    }\n\n    @After\n    public void tearDown() {\n        builder = null;\n  \
  \      message = null;\n    }\n\n    @Test\n    public void generate() {\n     \
  \   String[] paragraphs = new String[]{“p1”, “p2”};\n        String expected = “greeting1p1p2signoff1”;\n\
  \        builder.setGreeting(and(geq(1), leq(2)), isA(StringBuilder.class)); \n\
  \        expectLastCall().andAnswer(new GreetingAnswer<Object>()); \n        builder.addParagraph(isA(String.class),\
  \ isA(StringBuilder.class)); \n        expectLastCall().andAnswer(new ParagraphAnswer<Object>()).times(paragraphs.length);\n\
  \        builder.setSignOff(and(geq(1), leq(2)), isA(StringBuilder.class)); \n \
  \       expectLastCall().andAnswer(new SignOffAnswer<Object>()); \n        replay(builder);\n\
  \        String actual = message.generate(1, paragraphs);\n        assertEquals(actual,\
  \ expected);\n        verify(builder);\n    }\n\n    private class GreetingAnswer<T>\
  \ implements IAnswer<T> {\n        public T answer() throws Throwable {\n      \
  \      Integer style = (Integer)getCurrentArguments()[0];\n            StringBuilder\
  \ str = (StringBuilder)getCurrentArguments()[1];\n            str.append(“greeting”\
  \ + style);\n            return null;\n        }\n    }\n\n    private class ParagraphAnswer<T>\
  \ implements IAnswer<T> {\n        public T answer() throws Throwable {\n      \
  \      String para = (String)getCurrentArguments()[0];\n            StringBuilder\
  \ str = (StringBuilder)getCurrentArguments()[1];\n            str.append(para);\n\
  \            return null;\n        }\n    }\n\n    private class SignOffAnswer<T>\
  \ implements IAnswer<T> {\n        public T answer() throws Throwable {\n      \
  \      Integer style = (Integer)getCurrentArguments()[0];\n            StringBuilder\
  \ str = (StringBuilder)getCurrentArguments()[1];\n            str.append(“signoff”\
  \ + style);\n            return null;\n        }\n    }\n}\n```\n\n在上面的示例中，我们使用\
  \ `andAnswer()` 方法从 `void` 方法获取返回值。另一种方法是使用参数匹配器 `EasyMock.capture(Capture<T> captured)`。在对象在方法中被更新的情况下，你可以使用\
  \ `EasyMock.capture` 捕获它以便稍后在方法外部使用。捕获的对象（由 `Capture` 表示）包含了更新后的值。你可以使用 `Capture`\
  \ 中的 `getValue()` 或 `getValues()` 方法来获取捕获的值或多个值。以下是使用 capture 修改后的版本：\n\n```java\n\
  import static org.easymock.EasyMock.*;\n\nimport static org.junit.Assert.*;\n\n\
  import org.easymock.Capture;\n\nimport org.easymock.IAnswer;\n\nimport org.junit.After;\n\
  \nimport org.junit.Before;\n\nimport org.junit.Test;\n\npublic class MyMessageTest2\n\
  \n\n    private MessageBuilder builder;\n\n    private MyMessage message;\n\n  \
  \  @Before\n    public void setUp() {\n        builder = createMock(MessageBuilder.class);\n\
  \        message = new MyMessage(builder);\n    }\n\n    @After\n    public void\
  \ tearDown() {\n        builder = null;\n        message = null;\n    }\n\n    @Test\n\
  \    public void generate() {\n        String[] paragraphs = new String[]{“p1”,\
  \ “p2”};\n        String expected = “greeting1p1p2signoff1”;\n        Capture<StringBuilder>\
  \ capStr = new Capture<StringBuilder>(); \n        builder.setGreeting(and(geq(1),\
  \ leq(2)), isA(StringBuilder.class)); \n        expectLastCall().andAnswer(new GreetingAnswer<Object>());\
  \ \n        builder.addParagraph(isA(String.class), isA(StringBuilder.class)); \n\
  \        expectLastCall().andAnswer(new ParagraphAnswer<Object>()).times(paragraphs.length);\n\
  \        builder.setSignOff(and(geq(1), leq(2)), isA(StringBuilder.class)); \n \
  \       expectLastCall().andAnswer(new SignOffAnswer<Object>()); \n        replay(builder);\n\
  \        String actual = message.generate(1, paragraphs);\n        assertEquals(actual,\
  \ expected);\n        verify(builder);\n    }\n\n    private class GreetingAnswer<T>\
  \ implements IAnswer<T> {\n        public T answer() throws Throwable {\n      \
  \      Integer style = (Integer)getCurrentArguments()[0];\n            StringBuilder\
  \ str = (StringBuilder)getCurrentArguments()[1];\n            str.append(“greeting”\
  \ + style);\n            return null;\n        }\n    }\n\n    private class ParagraphAnswer<T>\
  \ implements IAnswer<T> {\n        public T answer() throws Throwable {\n      \
  \      String para = (String)getCurrentArguments()[0];\n            StringBuilder\
  \ str = (StringBuilder)getCurrentArguments()[1];\n            str.append(para);\n\
  \            return null;\n        }\n    }\n\n    private class SignOffAnswer<T>\
  \ implements IAnswer<T> {\n        public T answer() throws Throwable {\n      \
  \      Integer style = (Integer)getCurrentArguments()[0];\n            StringBuilder\
  \ str = (StringBuilder)getCurrentArguments()[1];\n            str.append(“signoff”\
  \ + style);\n            return null;\n        }\n    }\n}\n```\n\n### **POWERMOCK**\n\
  \n如开头所述，EasyMock 无法 mock 私有方法。PowerMock 是一个扩展了 EasyMock 功能（如 mock 私有方法）的框架。在下面的示例中，有一个类代表提交器，它根据\
  \ `getCount()` 方法的返回值提交任务到队列 1 或 2。\n\n```java\nPublic class JobSubmitter {\n  \
  \  public void submit() {\n        if(getCount() <= 10000) {\n            submitToQueue1();\n\
  \        } else {\n            submitToQueue2();\n        }\n    }\n\n    private\
  \ int getCount() {\n        // 假设此方法有复杂的操作\n        return 0;\n    }\n\n    private\
  \ void submitToQueue1() {\n        System.out.println(“Submitting to queue 1…”);\n\
  \    }\n\n    private void submitToQueue2() {\n        System.out.println(“Submitting\
  \ to queue 2…”);\n    }\n}\n```\n\n因为 PowerMock 扩展了 EasyMock，基本上和使用 EasyMock 一样。正如你所见，PowerMock\
  \ 也简化了部分 mock。你不能使用 `expect()` 方法，因为私有方法无法在类外部访问。相反，你需要使用 `expectPrivate()` 方法。\n\
  \n```java\nimport static org.powermock.api.easymock.PowerMock.*; import org.powermock.core.classloader.annotations.PrepareForTest;\
  \ import org.powermock.modules.junit4.PowerMockRunner;\n\nimport org.junit.Before;\n\
  \nimport org.junit.Test;\n\nimport org.junit.runner.RunWith;\n\n@RunWith(PowerMockRunner.class)\n\
  @PrepareForTest(JobSubmitter.class)\npublic class JobSubmitterTest1 {\n\n    private\
  \ JobSubmitter submitterMock;\n\n    @Before\n    public void setUp() {\n      \
  \  submitterMock = createPartialMock(JobSubmitter.class, “getCount”);\n    }\n\n\
  \    @Test\n    // ... 测试实现继续根据逻辑\n}\n```\n\n\n\n\n```java\npublic void testToQueue1()\
  \ throws Exception {\n    expectPrivate(submitterMock, “getCount”).andReturn(9000);\n\
  \    replay(submitterMock);\n    submitterMock.submit();\n}\n\n@Test\npublic void\
  \ testToQueue2() throws Exception {\n    expectPrivate(submitterMock, “getCount”).andReturn(11000);\n\
  \    replay(submitterMock);\n    submitterMock.submit();\n}\n```\n\n要 mock 一个带有静态方法的类，你可以使用\
  \ `mockStatic(Class<?> type)` 来 mock 整个类，或者使用部分 mock 方法如 `mockStaticPartial(Class<?>\
  \ type, String… methodNames)` 来 mock 某些方法。\n\n与其使用 `@RunWith(PowerMockRunner.class)`，你可以通过\
  \ JUnit 规则 `PowerMockRule` 来启动 PowerMock。它包含在 `powermock-module-junit4-rule` 中。\n\
  \n例如，\n\n```java\n@PrepareForTest(JobSubmitter.class)\npublic class JobSubmitterTest1\
  \ {\n    @Rule\n    public PowerMockRule mocks = new PowerMockRule();\n    …\n}\n\
  ```\n\n## 测试覆盖率分析\n\nCobertura 是一个用于 Java 程序的测试覆盖率工具。它可以生成报告，帮助你发现软件在哪里进行了测试。你可以从\
  \ [`cobertura.sourceforge.net.`](http://cobertura.sourceforge.net) 下载 Cobertura。Cobertura\
  \ 可以通过命令行或 Apache Ant 任务使用。以下是通过命令行生成 Cobertura 覆盖率报告的步骤：\n\n### 第一步\n\nCobertura\
  \ 直接在字节码中添加插桩指令。首先，你通过向类添加插桩指令来创建类的插桩版本，并将它们放在不同的目录。你可以通过 Cobertura 目录下的命令行工具 `cobertura-instrument`\
  \ 来实现：\n\n```\ncobertura-instrument [—datafile datafile] [—destination directory]\
  \ classes […]\n```\n\n默认情况下，覆盖率数据文件 `cobertura.ser` 位于当前目录。可以单独指定类或指定一个目录。例如，要对\
  \ `classes` 目录下的类进行插桩并将它们存储在 instrumented 目录中，你可以运行：`cobertura-instrument —destination\
  \ instrumented classes`\n\n将创建一个存储类元数据的覆盖率数据文件 `cobertura.ser`。\n\n 第二 第二步\n\n在运行测试之前，你需要进行一些更改。你需要做的是：将\
  \ Cobertura JAR（例如 `cobertura-2.1.1 .jar`）和 `lib` 目录添加到类路径中。\n\n在类路径中，将包含插桩类的目录放在包含原始类的目录之前。\n\
  \n使用系统属性 `net.sourceforge.cobertura.datafile` 指定数据文件的位置。例如，`-Dnet.sourceforge.cobertura.datafile=cobertura.ser`。\n\
  \n### 第三步\n\n一旦你运行了测试，就可以开始生成报告。要生成 Cobertura 覆盖率报告，你可以使用 `cobertura-report`：\n\n\
  ```\ncobertura-report [—format (html|xml)] [—datafile datafile] [—destination directory]\
  \ source code directory […]\n```\n\n例如，\n\n`cobertura-report —format html —datafile\
  \ cobertura.ser —destination reports ..`\n\n以下是基于 `PurchaseManagerTest1` 测试用例的 `PurchaseManager`\
  \ 类及相关类的覆盖率报告：\n\n![Image 19](img/index-202_1.jpg)\n\n![Image 20](img/index-202_2.jpg)\n\
  \n你可以进一步深入某个类以获取详细的覆盖率报告：\n\n## JMeter\n\nApache JMeter 是一个基于 Java 的桌面应用程序，可用于负载测试以测量系统性能，或用于压力测试以查看系统是否能优雅地崩溃。它可以生成报告来帮助消除系统瓶颈，或查看其在重负载下的性能。除了负载测试，你还可以将\
  \ JMeter 用于功能测试。JMeter 提供了多种测试元素。它们非常方便，可以节省你编写自己的测试 Java 程序的时间。使用 JMeter 非常直观，因为它提供了一个很友好的\
  \ GUI 来创建和运行测试。你还可以在非 GUI 模式下运行 JMeter 测试。测试可以在本地或远程运行。JMeter 采用插件化设计，以便以自定义插件的形式灵活地添加新功能（测试元素）。\n\
  \n你可以从 [`jmeter.apache.org.`](http://jmeter.apache.org) 下载 JMeter。编写时最新版本为 2.9。\n\
  \n## 构建 JMETER 测试计划\n\n要使用 JMeter 进行测试，你可以加载现有的测试计划或创建一个新的。\n\n基本上，测试计划具有树形结构，其中包含描述测试如何运行的元素。\n\
  \n### 启动 JMeter\n\n首先，我们需要启动 JMeter（需要 JSE 6.0 或更高）。你可以通过运行 `bin` 目录下的 `jmeter.bat`（Windows）或\
  \ `jmeter.sh`（Unix/Linux）从命令行启动 JMeter。\n\n要在非 GUI 模式下运行 JMeter，可以使用以下命令行选项：\n\n\
  - `-n` 非 GUI 模式\n- `-t` 测试计划文件（扩展名为 jmx）\n- `-l` 结果日志文件（扩展名为 jtl）\n- `-j` 日志文件\n\
  \n![Image 21](img/index-207_1.jpg)\n\n![Image 22](img/index-207_2.jpg)\n\n### 添加测试元素\n\
  \nJMeter 屏幕上有两个面板。左侧是测试树，右侧是配置面板。\n\n在 JMeter GUI 界面中，有两个面板。左侧的面板是测试树，是测试计划的测试树，右侧的面板是所选元素的配置。一个新的测试计划启动时包含两个元素：测试计划（Test\
  \ Plan）和工作台（WorkBench）。测试计划是根节点。\n\n工作台是存储测试元素的临时位置。工作台会自动保存测试计划。\n\n要在测试树中添加元素，你可以右键点击元素并选择添加（Add），或者从顶部菜单栏选择“添加”。你也可以从同一个菜单中删除或禁用元素。\n\
  \n在此示例中，我们通过选择菜单来添加一个线程组（Thread Group）。测试计划至少包含一个线程组。测试用例在线程组中定义。线程组允许定义测试用例的线程数、运行次数以及通过调度器定义的启动和停止时间。\n\
  \n接下来，我们在线程组下通过选择 Add -> Sampler -> Java Request 添加采样器。这允许你放置自己的 Java 类（或自定义采样器），只要它们实现了\
  \ `SamplerClient` 接口或扩展了 `AbstractSamplerClient` 类。JMeter 提供了两个 Java 示例类。我们使用 `JavaTest`\
  \ 类进行演示。`JavaTest` 不访问网络，适用于测试本地机器的性能。\n\n为了显示测试结果，我们添加了一个图表结果（Graph Results）监听器。图表结果监听器为所有样本绘制测试结果。它对于可视化地显示测试进度很有帮助。但它会消耗更多资源。通常用于测试或调试小负载的测试计划。\n\
  \n以下是我们的第一个 JMeter 测试计划：\n\n注意：当你在测试计划中指定运行的线程组/线程时，你需要考虑运行 JMeter 机器的能力。给机器施的负载越大，获取的时间信息可能越不准确。使用非\
  \ GUI 模式并将结果写入文件会有帮助。你甚至可以考虑在多台机器上（远程测试）运行你的重负载测试。\n\n![Image 23](img/index-209_1.jpg)\n\
  \n### 运行测试计划\n\n一旦你定义了测试计划，就可以运行它。运行测试计划可以通过“运行”（Run）菜单或工具栏来实现。当测试计划运行时，你可以从右上角检查当前状态：\n\
  \n绿色正方形图标表示测试计划正在运行。带有数字的黄色三角形图标是错误/致命计数器。默认情况下，JMeter 日志文件 `jmeter.log` 位于 `bin`\
  \ 目录（或使用 `-j` 选项指定它）。要在 GUI 中查看日志界面，你可以通过点击黄色三角形图标来开启或关闭，或者选择选项（Options）-> 日志查看器（Log\
  \ Viewer）。5/5 表示总线程数为五个，五个线程都在运行。\n\n\n\n\n要清除整个测试计划中的结果，你可以从 `Run` 菜单中选择 `Clear\
  \ All`。或者，你可以选择 `Clear` 来清除所选元素的结果。\n\n你可以通过 `Run` 菜单或工具栏停止或关闭正在运行的测试。`stop` 和 `shutdown`\
  \ 的区别在于：`stop` 会让线程立即停止，而 `shutdown` 则让线程在完成当前工作后停止。对于非 GUI 模式，你可以使用 `shutdown.cmd`（或\
  \ `shutdown.sh`）或 `stoptest.cmd`（或 `stoptest.sh`）。\n\n### 保存测试计划\n\n你可以通过 `File`\
  \ 菜单或工具栏保存测试计划。测试计划以扩展名 `jmx` 格式保存。你可以通过 `File` 菜单或弹出菜单中的 `Save Selection As` 来保存部分测试计划。\n\
  \n### 调试测试计划\n\n启用调试日志对于在创建测试计划时很有帮助。大多数测试元素都支持调试日志。要在测试元素上启用调试日志，请选择该测试元素并选择 `Help`\
  \ 菜单 -> `Enable debug`。你可以通过选择 `Disable debug` 来将其禁用。要查看调试日志，可以打开 `bin` 目录下的 `jmeter.log`\
  \ 或在运行之前启用 Log Viewer。\n\n### 远程测试\n\n你可以使用 JMeter 进行远程（或分布式）测试。使用远程测试可以避免将测试计划复制到每台机器的麻烦，并允许你使用更多用户模拟更大的负载。在远程测试中，一个\
  \ JMeter 客户端作为主，控制作为远程服务器运行的其他 JMeter 实例（作为从）。数据将由客户端收集。你可以通过运行 `jmeter-server.bat`（Windows）或\
  \ `jmeter-server`（Unix/Linux）来启动 JMeter 服务器。所有 JMeter 实例应使用相同版本的 JMeter。在 JMeter\
  \ 客户端中，你将远程服务器添加到 `jmeter.properties` 中的属性 `remote_hosts` 中。然后你就可以启动 JMeter 客户端并加载测试计划。要启动远程服务器，选择\
  \ `Run` 菜单 -> `Remote Start` 或 `Remote Start All`。如果你使用的是非 GUI 客户端，可以运行：\n\n```\n\
  jmeter -n -t {test script} -R server1, server2, …\n```\n\n### 测试元素\n\nJMeter 测试计划通过测试元素以树形结构构建（在\
  \ `WorkBench` 中你可以添加极少数非测试元素）。JMeter 提供了丰富的测试元素。\n\n这些元素使得 JMeter 成为一个强大的工具。大多数测试元素按照它们在测试树中出现的顺序进行处理。基本上，你使用采样器（samplers）对服务器进行测试，使用逻辑控制器（logic\
  \ controllers）控制测试运行的流程，并使用监听器（listeners）收集或查看来自服务器的测试结果。\n\n以下按类型分类的测试元素：\n\n####\
  \ 采样器\n\n有两种控制器。采样器就是一种。采样器生成请求（或样本）并在 JMeter 中执行实际测试任务。大多数情况下，采样器用于向服务器发送请求并等待响应。\n\
  \nJMeter 有支持以下协议的采样器：`HTTP`（`HTTP Request` 采样器）、`FTP`（`FTP Request` 采样器）、`TCP`（`TCP`\
  \ 采样器）、`SMTP`（`SMTP` 采样器）、`POP3`（`Mail Reader` 采样器）和 `IMAP`（`Mail Reader` 采样器）。你甚至可以在本地上执行命令（`OS\
  \ Process` 采样器）或向数据库发送 SQL 查询（`JDBC Request` 采样器）。要使用你自己的 Java 类，可以使用 `Java Request`\
  \ 采样器或 `JUnit Request` 采样器（针对 `JUnit` 测试类）。要使用脚本语言，可以使用 `JSR223` 采样器（Java 平台的脚本）或\
  \ `BSF` 采样器（Apache Bean Scripting Framework）。\n\n有一个特殊的采样器叫做 `Test Action` 采样器。它不会向服务器发送任何请求。相反，它可以暂停或停止目标线程或所有线程。`Test\
  \ Action` 采样器配合条件控制器使用。\n\n#### 逻辑控制器\n\n逻辑控制器也是控制器。逻辑控制器可以中断执行流并允许你控制采样器处理的顺序。\n\
  \n对于循环，你可以使用 `Loop Controller`、`While Controller` 或 `ForEach Controller`。对于决策，你可以使用\
  \ `If Controller`。对于执行一组元素，你可以使用 `Simple Controller` 或 `Random Order Controller`。区别在于\
  \ `Simple Controller` 按顺序执行内部的元素，而 `Random Order Controller` 按随机顺序执行。若要在每次迭代中执行元素中的一个，可以使用\
  \ `Interleave Controller`（在每次迭代中于元素间交替）或 `Random Controller`（每次迭代中随机选取一个）。你还可以使用\
  \ `Once Only Controller` 告诉 JMeter 每个线程只处理一次内部的元素。\n\n为了更好地组织测试，你可以将其拆分为片段（或模块）。要包含\
  \ `Test Fragment`（通过 `Test Fragment` 元素创建），可以使用 `Include Controller` 通过外部 `jmx`\
  \ 文件包含它。或者，你可以使用 `Module Controller` 包含位于任何 `Thread Group` 或 `WorkBench` 中的测试片段。\n\
  \n即使元素被禁用，你也可以在逻辑控制器下包含任何片段。\n\n采样器和逻辑控制器都是按照它们在测试树中定义的顺序处理的。\n\n#### 监听器\n\n监听器从测试中收集信息。它们提供了让你查看\
  \ GUI 模式结果的方法，并可选地将结果保存为 XML 或 CSV 格式的文件。你可以通过点击配置项来配置保存到文件中。\n\n要查看详细结果，可以使用 `Graph\
  \ Results`、`View Results Table` 或 `View Results Tree` 监听。要查看聚合数据，可以使用 `Aggregate\
  \ Report`、`Aggregate Graph` 或 `Summary Report`。如果你只想将结果保存到文件而不查看，可以使用 `Simple Writer`。同样，如果你想将响应保存到文件，可以使用\
  \ `Save Responses to file` 监听器。\n\n监听器可以添加到测试树的任何位置。但它们只收集相同分支（及其下方）元素的数据。为了避免混淆，良好的做法是将监听器放在它们所在分支的末尾。\n\
  \n#### 配置元素\n\n配置元素用于设置采样器的配置。配置元素仅供相同分支内的元素（包括后分支）访问。无论它们位于何处，都会在分支开始时处理。一个例外是\
  \ `User Defined Variables`。无论它位于哪里，都会在测试运行开始时处理。\n\n对于 `HTTP Request` 采样器，可以使用 `HTTP\
  \ Authorization Manager`、`HTTP Cache Manager`、`HTTP Cookie Manager`、`HTTP Request\
  \ Defaults` 或 `HTTP Header Manager` 来。对于 `JDBC Request` 采样器，可以使用 `JDBC Connection\
  \ Configuration`。如果你需要使用计数器，可以使用 `Counter` 配置元素。\n\n要定义自定义变量，可以使用 `User Defined\
  \ Variables`（或在 `Test Plan` 中定义）。自定义变量可以被引用为 `${variable_name}`。变量是线程局部的。为了在线程或线程组之间共享值，可以使用\
  \ JMeter 属性，因为它们是全局的。属性定义在 `jmeter.properties` 中。或者，你可以使用额外文件来定义属性：`user.properties`\
  \ 和 `system.properties`。\n\n属性可以被引用为 `${__P(property_name)}` 或 `${__P(property_name,default_value)}`。变量和属性都是区分大小写的。\n\
  \n你可以通过 `Debug Sampler` 调试变量和属性。你可以在 `View Results Tree` 的 `Response data` 选项页中看到值。\n\
  \n#### 断言\n\n断言配合采样器工作以检查服务器响应。断言的作用范围仅限于定义它的当前分支。除非指定，否则它无法被后分支访问。断言在相同范围内的每个采样器之后处理。如果你希望断言仅适用于某个采样器，可以将其作为该采样器的子元素。\n\
  \n\n\n\n你可以使用`Response Assertion`响应断言来检查响应。模式匹配采用 Perl5 风格的正则表达式。要断言每个响应是否在特定时间内接收，可以使用`Duration\
  \ Assertion`时长断言。要断言每个响应的大小，可以使用`Size Assertion`大小断言。要查看断言结果，可以使用`Assertion Results`断言结果监听器。\n\
  \n### 定时器 (Timers)\n定时器配合采样器使用，在每个请求之间产生延迟。定时器在相同范围内的每个采样器之前被处理。\n\n`Constant Timer`常量定时器用于在每个请求之间暂停相同的时间。如果你需要随机时间，可以使用`Gaussian\
  \ Random Timer`高斯随机定时器、`Uniform Random Timer`均匀随机定时器或 `Poisson Random Timer`泊松随机定时器。\n\
  \n### 预处理器 (Pre-processors)\n预处理器在同一层级的采样器之前执行。你可以将处理器作为采样器的子节点，以便在将信息输入采样器之前对其进行预处理。通常，它们用于在采样器运行之前修改设置。处理器在定时器之前、在配置元素之后执行。\n\
  \n为了处理 HTML 响应，可以使用`HTML Link Parser`HTML 链接解析器或`HTML URL Rewriting Modifier`HTML\
  \ URL 重写修改器。\n\n### 后处理器 (Post-processors)\n后处理器在同一层级的采样器之后立即执行。通常，它们用于处理响应。后处理器在断言和监听器之前执行。\n\
  \n要从响应中提取值并将结果赋值给变量供以后使用，可以使用`Regular Expression Extractor`正则表达式提取器。\n\n![Image\
  \ 24](img/index-222_1.jpg)\n\n### 测试 Web 应用\n现在，我们将学习如何创建一个 JMeter 测试计划来测试 Web 应用。要发送\
  \ HTTP（或 HTTPS）请求，你可以使用`HTTP Request`采样器。`HTTP Request`采样器并不是浏览器。但它可以完成浏览器能做的大部分工作，除了渲染页面或运行脚本等操作。可选情况下，它甚至允许你从网页中检索嵌入资源。对于`HTTP\
  \ Request`采样器之间共享的常用设置（例如服务器名称或 IP），你可以在`HTTP Request Defaults`中定义它们。其他采样器将继承`HTTP\
  \ Request Defaults`中定义的值。例如，你可以使用`HTTP Request Defaults`中的“Server Name or IP”字段来指定要测试的服务器。然后，在其他\
  \ `HTTP Request`采样器中留空该字段即可。`HTTP Request Defaults`的范围在当前分支（及其后代）内。通常，Web 应用需要 cookie\
  \ 支持。我们可以使用`HTTP Cookie Manager`，以防应用可能需要 cookie 支持。\n\n在接下来的示例中，每个线程将随机顺序访问四个页面。我们使用`Random\
  \ Order Controller`来模拟这种行为。JMeter 测试计划所示：\n\n在运行此测试计划后，你可以通过其中定义的两个监听器查看结果。\n\n\
  以下截图来自`View Results Tree`（查看结果树）：\n\n![Image 25](img/index-223_1.jpg)\n\n![Image\
  \ 26](img/index-223_2.jpg)\n\n在结果树上，它包含一个正在访问的页面列表。对于失败的请求，如果有任何失败的话，颜色将为红色。你可以选择一个页面来查看请求和响应。如果响应数据是\
  \ HTML 格式，你可以通过选择树底部下拉菜单中的`HTML`来查看渲染后的页面。渲染后的页面只能让你对页面有一个大致了解，与浏览器相比效果并不理想。JMeter\
  \ 还可以处理不同类型的文档（例如 PDF、MS Office）。你可以通过选择`Document`来查看文档中的文本。由于`View Results Tree`记录了所有访问页面的请求和响应，因此非常适合检查\
  \ Web 应用的行为或调试 Web 应用。此外，你也可以用它测试你的 JMeter 测试计划。但在负载测试期间使用它并不是好主意，因为它会消耗大量资源。\n\n\
  测试计划中的另一个监听器是`Summary Report`摘要报告。`Summary Report`为你提供了结果的表格视图。它提供了按页面（作为表格行）排列的摘要报告。\n\
  \nAverage、`Min` 和 `Max` 是以毫秒为单位的运行时间。\n\n在上一个示例中，测试期间将访问四个页面（随机顺序）。现在，我们想在测试中包含更多页面。手动添加页面非常痛苦。我们可以使用`HTML\
  \ Link Parser`来为我们完成。`HTML Link Parser`是一个预处理器，可以从上一个 HTML 响应中提取链接。紧随其后的`HTTP Request`采样器并包含在循环中可以使整个过程变得像一个网络爬虫。我们将此过程添加到之前的示例中。每个线程将随机选择之前示例中的四个页面之一作为起始页，并爬取整个网站。在`HTTP\
  \ Request`采样器中，`Path`字段使用正则表达式 `(?i).*.html`来匹配任何 HTML 页面。`(?i)`表示不区分大小写。关于在 JMeter\
  \ 中使用正则表达式的详细信息，你可以检查[`jmeter.apache.org/usermanual/regular_expressions.html.`](http://jmeter.apache.org/usermanual/regular_expressions.html)。\n\
  \n为了继续爬取网站，我们在以下内部添加`HTTP Request`采样器：\n\n![Image 27](img/index-224_1.jpg)\n\n`While\
  \ Controller`，并将`Condition`字段设置为 true。为了限制`While Controller`的运行时间，将`While Controller`作为`Runtime\
  \ Controller`的子节点添加。你可以在`Runtime`字段中定义所需的运行时间。\n\n以下是修订后的版本：\n\n![Image 28](img/index-225_1.jpg)\n\
  \n![Image 29](img/index-225_2.jpg)\n\n### 认证测试 (WITH AUTHENTICATION)\n有些 Web 应用需要身份验证才能访问特定页面。表单认证是保护\
  \ Web 应用资源的流行方法。对需要身份验证的网站进行测试，你需要在执行任何操作之前在测试计划中添加自动登录的步骤。\n\n首先，你需要访问一个页面以获取网站的\
  \ cookie。通常它是用于会话跟踪的 ID。下一步是通过提供用户名和密码通过安全检查。要找到提交给服务器进行认证的表单动作和查询参数，可以使用浏览器页面的“查看源代码”功能。以下是一个用于认证的`HTTP\
  \ Request`采样器：它使用 HTTP POST 方法。表单动为`j_security_check`。路径为`/aediserver/j_security_check`。包含了\
  \ Web 应用 aediserver` 的上下文根。用户名表单字段为`j_username`，密码表单字段为`j_password`。用户名和密码都定义在`User\
  \ Defined Variables`中。\n\n同样，你可以从“查看源代码”中找到注销动作。这取决于实现方式。\n\n以下是如何在测试计划中添加认证的简单示例。它包含了以下步骤：访问登录页面以与服务器连接、登录然后注销。\n\
  \n在示例中，我们只存储了一组用户信息用于认证。如果你想模拟不同用户同时登录的情况，可以使用`User Parameters`预处理器来存储多个用户账户。例如，对于四个线程的测试，每个线程一个用户账户，你可以为用户名和密码定义四组参数：\n\
  \n![Image 30](img/index-226_1.jpg)\n\n如果线程数多于组数，它们将被重用。\n\n![Image 31](img/index-227_1.jpg)\n\
  \n**使用正则表达式**\n\n\n\n\n\n如果遇到连接问题（例如服务器拒绝连接）导致需要停止测试怎么办？在这种情况下，没有理由继续测试。以下是替换上一个示例中\
  \ `Login Page`（登录页面）节点的片段：我们添加 `Regular Expression Extractor`（正则表达式提取器）后处理器，在连接到登录页面时解析服务器的响应。如果出现任何连接问题，响应码中将抛出异常。你可以检查\
  \ `View Results Tree`（查看结果树）中的 Sample 选项卡，查看失败时会返回什么。在 `Regular Expression Extractor`\
  \ 内部，字段值的设置如下：\n\n- 引用名称：`Exception`\n- 正则表达式：`\\.([a-zA-Z0-9]*Exception)`\n- 模板：`$1$`\n\
  - 匹配编号（Match No）：`1`\n- 默认值：`NO_EXCEPTION`\n\n我们使用正则表达式在响应中搜索任何与异常相关的文本（例如 `HttpHostConnectException`）。括号\
  \ `(` 和 `)` 表示正则表达式中的一个组。它用于获取匹配字符串的一部分。在本例中，它用于移除异常类名前的点。`Template` 字段中的 `$1$`\
  \ 表示第 1 组，`Match No.` 字段中的 `1` 表示第一次匹配。如果没有匹配，则返回默认值 `NO_EXCEPTION`。该值被赋值给名为 `Exception`\
  \ 的变量。\n\n在 `If Controller`（如果控制器）中，`Condition`（条件）设置为：\n`\"${Exception}\" != \"\
  NO_EXCEPTION\"`\n\n变量需要加双引号。在 `Test Action`（测试动作）中，动作设置为 `Stop Now`（立即停止）。\n\n使用正则表达式处理响应的一个棘手部分是如何验证结果。验证正则表达式的一种简单方法是通过\
  \ `View Results Tree`。\n\n你可以在 `Response` 数据选项卡的底部找到一个 `Search`（搜索）字段。输入一个正则表达式并勾选\
  \ `Regular exp.` 复选框。点击 `Find` 按钮。如果有匹配字符串，你可以看到它被高亮。点击 `Find next` 按钮查找下一个匹配项。\n\
  \n![Image 32](img/index-228_1.jpg)\n\n## 使用 HTTP 代理服务器\n\n当表单字段过多时，手动输入它们非常耗时。或者，你无法从浏览器的源代码中查看表单字段名称。\n\
  \n你可以使用 `Recording Controller`（录制控制器）来录制测试样本。通过 `HTTP Proxy Server` 进行录制。所有录制的样本都将保存在\
  \ `Recording Controller` 下。你可以在测试计划中使用它们。以下是使用 `HTTP Proxy Server` 进行录制的步骤步骤：\n\n\
  ### 步骤 1\n首先，添加一个 `Thread Group`（线程组）。\n\n### 步骤 2\n接下来，添加 `Recording Controller`。`Recording\
  \ Controller` 是一个逻辑控制器。可选地可以在 `Recording Controller` 下添加 `HTTP Request Defaults`（HTTP\
  \ 请求默认）。如果在 `HTTP Request Defaults` 中指定了这些字段，则录制元素中的相应字段将留为空。\n\n### 步骤 3\n现在，可以在\
  \ `WorkBench` 下添加 `HTTP Proxy Server`。`HTTP Proxy server` 是非测试元素。你为代理服务器指定端口号（例如\
  \ `8088`）。如果你不想在录制的页面中嵌入 URL，可以将 `Grouping` 设置为 `Store 1st sampler of each group\
  \ only`（仅存储每组第一个采样器）。要包含或排除某些资源，可以使用 `URL Patterns to Include`（包含的 URL 模式）或 `URL\
  \ Patterns to Exclude`（排除的 URL 模式）。如果未指定，所有内容都将被记录。通常，你可以排除图像文件，或简单点击 `Add suggested\
  \ Excludes`（添加建议排除）按钮使用建议模式。如果你想查看响应，可以添加 `View Results Tree` 监听器。\n\n### 步骤 4\n\
  我们需要更改使用的浏览器以设置代理服务器信息。对于 `Internet Explorer 9`，选择 `Tools` 菜单 -> `Internet Options`\
  \ -> `Connections`。点击底部的 `LAN settings` 弹出对话框。在对话框中，勾选 `Proxy server` 复选框并输入代理服务器的端口号。确保没有绕过本地地址。点击\
  \ `OK` 按钮更新。对于 `Firefox`，选择 `Tools` 菜单 -> `Options` -> `Network` -> `Settings` ->\
  \ `Manual proxy configurations`。\n\n验证你的设置的一种方法是连接到一个网站。除非代理服务器启动，否则你无法连接到它。\n\n\
  ### 步骤 5\n切换回 JMeter。点击 `HTTP Proxy Server` 底部的 `Start` 按钮启动它。\n\n### 步骤 6\n![Image\
  \ 33](img/index-230_1.jpg)\n![Image 34](img/index-230_2.jpg)\n\n现在，你可以从浏览器打开服务器的链接并像往常一样浏览。每一步操作都会被记录。录制完成后停止代理服务器。还要记得改回浏览器设置。\n\
  \n以下是一个使用 `Grouping` 设置为 `Store 1st sampler of each group only` 且未勾选 `Capture HTTP\
  \ Headers` 复选框的录制元素测试计划。`HTTP Request Defaults` 下方的元素是录制元素。\n\n在运行它之前，你至少需要添加一个\
  \ `HTTP Cookie Manager`，因为需要 cookie 支持。当然，更好的方法是创建一个新的测试计划并从录制测试计划中复制元素。你允许在不同的\
  \ JMeter 实例之间进行复制粘贴。\n\n以下是一个包含更新表单查询参数的 `HTTP Request`。你可以在 `Parameters` 选项卡查看表单字段的查询参数：\n\
  \n![Image 35](img/index-231_1.jpg)\n\n## 使用 GWT 测试应用程序\n\n使用 GWT 测试应用程序的一个棘手部分是验证结果。使用\
  \ GWT 测试应用程序的一种简单方法是查看浏览器源代码。\n\n![Image 35](img/index-231_1.jpg)\n![Image 36](img/index-231_2.jpg)\n\
  \n（注：此处根据原文逻辑进行了整合翻译，原文该部分存在重复和乱码，译文已按技术逻辑进行优化）\n\n\n\n\n\nJUnit Request 采样器允许你将\
  \ JUnit 测试类包含到测试计划中。包含 JUnit 测试类有两种操作方式：\n\n### 选项 1\n将类打包成 JAR 文件并将其放置在 `lib/junit`\
  \ 目录下。\n\n### 选项 2\n将 JUnit 类所在的目录添加到 `bin` 目录下 `user.properties` 文件的 `user.classpath`\
  \ 属性中。\n\n现在，在 JUnit Request 采样器中，你应该能够从 `Classname` 下拉菜单看到这些测试类。如果 JUnit 测试类使用的是\
  \ JUnit 4 注解，你需要勾选“Search for JUnit 4 annotations”才能看到它们。你可以从 Test Method 下拉菜单中选择一个测试方法。一个\
  \ JUnit Request 采样器对应一个测试方法。\n\n在接下来的示例中，它包含了上一章节中 `PurchaseManagerTest` 的测试方法。你需要在测试计划中包含标记了\
  \ `@BeforeClass`（`setupClass` 方法）和 `@AfterClass`（`tearDownClass` 方法）的方法。它们不会被自动调用。\n\
  \n### Java Request\n与 JUnit Request 采样器相比，Java Request 采样器的限制较少，因为它允许你添加任何 Java\
  \ 类，前提是这些类实现了 `JavaSamplerClient` 接口或继承了 `AbstractJavaSamplerClient` 类。鼓励开发者扩展 `AbstractJavaSamplerClient`\
  \ 类。`AbstractJavaSamplerClient` 类中有五个方法：\n\n- `Logger getLogger()`：获取一个可以用于记录消息的\
  \ `Logger`。\n- `Arguments getDefaultParameters()`：定义由此测试提供的参数列表，以及在 GUI 中显示的内容。参数由\
  \ `Arguments` 类表示。通过 `addArgument(Argument arg)` 或 `addArgument(String name, String\
  \ value)` 方法添加参数。\n- `void setupTest(JavaSamplerContext context)`：执行此测试的初始化。每个线程只被调用一次。\n\
  - `void teardownTest(JavaSamplerContext context)`：执行此测试的清理。每个线程只被调用一次。\n- `SampleResult\
  \ runTest(JavaSamplerContext context)`：定义测试中的实际操作。这是一个你需要重写的抽象方法。该方法会在每次迭代时被调用。\n\
  \n`JavaSamplerContext` 类用于获取参数值。你可以通过 `getParameter(String name)` 或 `getParameter(String\
  \ name, String defaultValue)` 方法获取 String 参数的值。对于整数，可以使用 `getIntParameter(String\
  \ name)` 或 `getIntParameter(String name, int defaultValue)` 方法。对于 long，可以使用 `getLongParameter(String\
  \ name)` 或 `getLongParameter(String name, long defaultValue)` 方法。\n\n`SampleResult`\
  \ 类用于包含返回的结果。要计算已时间，你可以使用 `sampleStart()` 方法开始记录，使用 `sampleEnd()` 方法结束记录。要将此测试标记为成功，可以使用\
  \ `setSuccessful(boolean success)` 方法。\n\n有关详细信息，你可以检查 `docs/api` 目录下的 JMeter API\
  \ 文档。\n\n要编译它，你需要在类路径下的 `lib/ext` 目录包含 `ApacheJMeter_core.jar` 和 `ApacheJMeter_java.jar`。要部署它，你可以将其打包成\
  \ JAR 文件并放在 `lib/ext` 目录下。\n\n### JAVACC\nJavaCC（Java 编译器）是一个开源的词法分析器生成器和解析器生成器，用于\
  \ Java 。它接受语法规范（例如 EBNF）并生成词法分析器和解析器的 Java 源代码。词法分析器将字符序列分解为标记（tokens）并识别每个标记的类型。解析器从词法分析器获取标记序列，然后对其进行分析以确定结构并根据需要生成输出。对于解释器，它是直接执行的（例如带有算术表达式作为输出的计算器）。对于编译器，输出可以是编译后的代码。此外，你可以使用\
  \ JavaCC 创建一个文本处理器，根据文件中的某些词法标记提取文本。\n\n你可以从 [`javacc.java.net/`](http://javacc.java.net/)\
  \ 下载 JavaCC。本文编写时最新版本为 5.0。\n\n### 语法文件的结构\nEBNF（扩展巴科斯-诺尔范式）包含了一类用于表示正式语言（不一定是编程语言）语法的符号。语法由（无序的）产生式规则定义，这些规则规定了符号如何组合在一起。例如，以下是定义简单数字的\
  \ EBNF 产生式：\n\n```\n<dot> ::= “.”\n<digits> ::= ([“0” – “9”)+\n<number> ::= <digits>\
  \ | <digits> <dot> <digits> | <digits> <dot> | <dot> <digits>\n```\n一个 EBNF 规则包含两个部分（由\
  \ `::=` 符号隔开）：LHS（左侧）是规则名称，RHS（右侧）是与规则名称相关的定义。\n\n选项（由逗号隔开）包含在括号 `[` 和 `]` 之间。最多选择其中一个。若要在选项中放入字符范围，可以在两个字符之间使用连字符\
  \ `-`。选择用竖线 `|` 隔开。选择其中一个。它们可以用 `(` 和 `)` 括起来，并用后缀 `+`（一个或多个）、`*`（零或多个）或 `?`（零或一个）表示重复。\n\
  \nJavaCC 允许我们定义类似于 EBNF 的语法。但它将语法分为标记和产生式规则。JavaCC 语法定义在以 `.jj` 为扩展名的语法文件中。你可以使用\
  \ JavaCC 命令行 `javacc.bat`（Windows）或 `javacc`（Unix）来生成 Java 文件，然后使用 Java 编译器编译它们。\n\
  \n以下是 JavaCC 语法文件的基本结构：\n\n```java\n/* 此部分定义语法的 set 选项 */\noptions {\n…\n}\n\n/*\
  \ 此部分定义要生成的解析器类并包含 Java 代码 */\nPARSER_BEGIN(parser_class)\npublic class parser_class\
  \ {\n…\n}\nPARSER_END(parser_class)\n\n/* 此部分定义词法规范。在这里，你指定标记名称和对应的正则表达式。词法分析器将字符序列分解为标记并分类标记。\
  \ */\n/* 包含在生成的词法管理器中的 Java 代码 */\nTOKEN_MGR_DECLS: {\n// Java 代码\n}\n\n/* 定义不传递给解析器的字符\
  \ */\nSKIP [[IGNORE_CASE]]: {\n…\n}\n\n/* 定义语法中的标记 */\nTOKEN [[IGNORE_CASE]]: {\n\
  …\n}\n\n/* 此部分定义语法中的产生式规则。产生式可以包含 Java 代码。它们看起来像 Java 方法。这是你定义解析器动作的地方 */\n…\n```\n\
  \n### 选项\noptions 部分允许你提供控制生成的 Java 代码行为的选项。可以在语法文件中指定，也可以通过命令行 `javacc` 指定。从 `javacc`\
  \ 设置的选项会覆盖文件中的选项。options 部分是可选的，且选项名称不区分大小写。例如：\n\n```javaoptions {\nSTATIC = false;\n\
  IGNORE_CASE = true;\n}\n```\n当 `STATIC` 为 `false` 时，生成的解析器和词法管理器中的方法不是静态的。这允许存在多个解析器实例。默认情况下，`STATIC`\
  \ 为 `true`。\n\n当 `IGNORE_CASE` 为 `true` 时，生成的词法管理器忽略标记和输入数据的大小写。默认情况下，`IGNORE_CASE`\
  \ 为 `false`。\n\n如果你需要获取词法管理器的调试信息，可以将 `DEBUG_TOKEN_MANAGER` 设置为 `true`。可用选项的更多信息可以在\
  \ `doc` 目录下的 `javaccgrm.html`。\n\n### 类声明\n`PARSER_BEGIN` 和 `PARSER_END` 的名称必须相同，这是生成的解析器\
  \ Java 类名。部分生成的 Java 文件将以此处声明的类名为名前缀。\n\n\n\n\n你可以在内部包含任何 Java 代码（就像创建一个 Java 类一样），只要它包含一个与生成的解析器同名的类。如果你需要将生成的文件放在包中，可以在\
  \ `PARSER_BEGIN` 之后直接放入包名。如果你有任何可以在其他产生规则使用的变量（或方法），也可以将它们放在这里。由于 `JavaCC` 只生成 Java\
  \ 源代码且不检查 Java 语法，即使存在错误，你也不会看到任何错误。你需要等待直到它们被编译成类文件。\n\n### 令牌管理器声明 (Token manager\
  \ declarations)\n\n令牌管理器声明部分包含要包含在生成的令牌管理器中的 Java 代码，这里的任何声明都可以被词法规范中的任何词法动作访问。\n\
  \n### 词法规范 (Lexical specifications)\n\n词法规范（或正则表达式产生）定义了由令牌管理器处理的词法实体（语法标记）。令牌管理器是根据这里的信息生成的。词法规范包含一个由垂直竖线\
  \ `|` 分隔的正则表达式规格列表：\n\n```\n[lexical state list] {SKIP|TOKEN|MORE} [IGNORE_CASE]\
  \ : {\n\nregular_expression [Java block][:lexical_state]\n\n| regular_expression\
  \ [Java block][:lexical_state]\n\n…\n\n}\n```\n\n词法状态列表包含一组用角括号 `<` 和 `>` 包围的词法状态（用逗号分隔），或者你可以使用\
  \ `<*>` 表示所有状态。这是可选的。默认状态是 `DEFAULT`。当匹配到正则表达式时，会执行一个 Java 块（一个可选的词法动作），如果指定了状态，将移动到下一个词法状态进行进一步处理。\n\
  \n令牌管理器初始处于 `DEFAULT` 状态。Java 块是一个用花括号 `{` 和 `}` 包围的 Java 代码块。词法状态是一个 Java 标识符。\n\
  \n`[IGNORE_CASE]` 是可选的。它的效果与选项中的 `IGNORE_CASE` 相同，但 `[IGNORE_CASE]` 局部作用。\n\n`SKIP`\
  \ 定义了令牌管理器可以忽略的标记。例如，为了跳过某些空白字符，你可以使用：\n\n```\nSKIP : {\n\n” ”\n| “\\r”\n| “\\t”\n\
  }\n```\n\n`TOKEN` 定义了语法中的标记。每个标记被视为在令牌管理器中匹配正则表达式的 `Token` 类实例。每个标记都用角括号 `<` 和 `>`\
  \ 包围，并用垂直竖线 `|` 分隔。标记定义包含两个部分：标记名称和正则表达式（带有可选的 Java 代码和词法状态）。格式为 `<[#]{token_name}:{regular\
  \ expression}>`。\n\n#### 标记名称 (Token name)\n你可以为标记标记名称。标记名称遵循 Java 标识符的惯例。如果标记名称前面有\
  \ `#` 符号，它被视为一个私有正则表达式，不会被令牌管理器匹配为标记。但它仍然可以从其他正则表达式引用。这是一种在其他地方复用相同正则表达式的方便方法。\n\
  \n#### 正则表达式 (Regular expression)\n正则表达式可以包含字符串字面量（遵循 Java 字符串惯例）或由垂直竖线 `|` 分隔的复杂正则表达式列表。正则表达式还可以引用其他已标记的标记（用角括号\
  \ `<` 和 `>` 包围标记名称）。复杂正则表达式包含以下项的序列：字符串字面量、标记、选项、选择。这些项可以用圆括号 `(` 和 `)` 包围，并以后缀\
  \ `+`（一次或多次）、`*`（零或多次）或 `?`（零或一次）表示重复。选项可以用波浪号 `~` 前缀来排除某些字符。\n\n`[IGNORE_CASE]`\
  \ 是可选的。它的效果与选项中的 `IGNORE_CASE` 相同，但 `[IGNORE_CASE]` 局部作用。一个语法文件可以有多个 `Token` 部分。\n\
  \n以下是计算器中定义的标记示例：\n\n```\nTOKEN: {\n\n< PLUS: “+” >\n| < MINUS: “-” >\n| < MULTIPLY:\
  \ “*” >\n| < DIVIDE: “/” >\n| < COMMA: “,” >\n| < #DOT: “.” >\n| < OPEN_PAR: “(”\
  \ >\n| < CLOSE_PAR: ”)” >\n| < #DIGITS: ([“0”-“9”])+ >\n| < NUMBER: (<DIGITS> |\
  \ <DIGITS> <DOT> <DIGITS> | <DIGITS> <DOT> |\n<DOT> <DIGITS>) >\n| < EOL: “\\n”\
  \ >\n}\n\nTOKEN [IGNORE_CASE]: {\n\n< SUM: “SUM” <OPEN_PAR> >\n| < AVG: “AVG” <OPEN_PAR>\
  \ >\n}\n```\n\n`MORE` 用于逐步构建标记。匹配到 `MORE` 正则表达式的字符继续存储在缓冲区中，直到匹配到 `TOKEN` 或 `SKIP`\
  \ 正则表达式。对于匹配到 `TOKEN` 正则表达式，将用缓冲区中的内容结合当前匹配项形成一个标记，然后传递给解析器。对于 `SKIP`，整个内容将被丢弃。\n\
  \n### 产生规则 (Production rules)\n\n每个产生规则（或产生）包含两个部分。一个是包含声明和 Java 代码的 Java 块。该部分声明了要生成的\
  \ Java 方法，并且可以在产生规则中使用变量。生成的代码中会抛出一个受检的异常 `ParseException`。如果需要抛出其他异常，可以将它们添加到这里。另一个部分是用于\
  \ EBNF 规则扩展的扩展部分。每个扩展部分包含扩展单元。每个扩展单元可以包含一个用花括号 `{` 和 `}` 包围的 Java 代码块。这是在解析过程中执行动作的地方。\n\
  \n以下是产生规则的基本结构：\n\n```\n{void or data type} {rule name()} [throws exception] :\n\
  \n{\n}\n\n// 包含嵌套扩展单元的扩展部分\n}\n```\n\n以下示例显示了用于加法减法运算的 EBNF 产生规则和对应的 JavaCC 产生规则：EBNF\
  \ 产生规则为 `<expression> ::= <term> ( <plus> | <minus> )*`。JavaCC 规则：\n\n```\n<expression>\n\
  \n{\nDouble a;\nDouble b;\na = term();\n}\n\n<PLUS>:\n{\nif(a == null && b != null)\n\
  a = new Double(a + b);\n}\n\n<MINUS>:\n{\nif(a == null && b != null)\na = new Double(a\
  \ - b);\n}\n```\n\nEBNF 中对应的部分已加粗。`term()` 是产生规则。\n\n### 简单计算器 (A SIMPLE CALCULATOR)\n\
  \n现在，我们将使用 JavaCC 创建一个支持以下内容的简单计算器：二元运算符：+、、*/；一元运算符：-（负）、+（正）；函数：sum（求和）、avg（平均）；分组：(\
  \ )）。函数名称不区分大小写，函数参数用逗号分隔。例如，sum(1,2,3), sum(1+2,3)。\n\n### EBNF 语法 (EBNF grammars)\n\
  \n良好的做法是从 EBNF 语法开始，然后将其转换为 JavaCC 语法。EBNF 语法所示：\n\n```\n<expression> ::= <term>\
  \ ( <plus> | <minus> )*\n\n<term> ::= <unary> (<multiply> <element> | <divide> <element>)*\n\
  \n<element> ::= <number> | <open par> <expression> <close par> | <function>\n\n\
  <unary> ::= (<plus> | <minus>) <element>\n\n<function> ::= (<sum> | <avg>) <open\
  \ par> (<comma> <expression>]*)\n\n<close par>\n\n<sum> ::= “SUM”\n\n<avg> ::= “AVG”\n\
  ```\n\n### JavaCC 语法 (JavaCC grammars)\n\n一旦定义了语法，就可以将其转换为 JavaCC 语法。以下是语法文件（Calculator.jj）的内容：\n\
  \n```\noptions {\n\nSTATIC = false;\n\n}\n\nPARSER_BEGIN(Calculator)\n\n/**\n\n\
  * 这是一个用于计算器的词法分析器和解析器。\n\n*/\n\npublic class Calculator {\n\npublic static void\
  \ main(String args[]) throws ParseException {\n```\n\n\n\n```java\nCalculator parser\
  \ = new Calculator(System.in);\n\nwhile(true) {\n    System.out.println(parser.parseOneLine());\n\
  }\n\n}\n\n}\n\nPARSER_END(Calculator)\n\nSKIP : {\n    ” “\n    | “\\r”\n    | “\\\
  t”\n}\n\nTOKEN: {\n    < PLUS: “+” >\n    | < MINUS: “-” >\n    | < MULTIPLY: “*”\
  \ >\n    | < DIVIDE: “/” >\n    | < COMMA: “,” >\n    | < #DOT: “.” >\n    | < OPEN_PAR:\
  \ “(” >\n    | < CLOSE_PAR: “)” >\n    | < #DIGITS: ([“0”-“9”])+ >\n    | < NUMBER:\
  \ (<DIGITS> | <DIGITS> <DOT> <DIGITS> | <DIGITS> <DOT> | <DOT> <DIGITS>) >\n   \
  \ | < EOL: “\\n” >\n}\n\nTOKEN [IGNORE_CASE]: {\n    < SUM: “SUM” <OPEN_PAR> >\n\
  \    | < AVG: “AVG” <OPEN_PAR> >\n}\n\nDouble parseOneLine():\n{\n    Double a;\n\
  }\n{\n    a = expression() (<EOF> | <EOL>)\n    {\n        return a;\n    }\n}\n\
  \nDouble sum():\n{\n    Double result = null;\n    Double param;\n}\n{\n    <SUM>\
  \ result = expression()\n    (\n        <COMMA> param = expression()\n        {\n\
  \            if(result == null && param != null)\n                result = param;\n\
  \            else if(result != null && param != null)\n                result =\
  \ new Double(param.doubleValue() + result.doubleValue());\n        }\n    )* <CLOSE_PAR>\n\
  \    {\n        return result;\n    }\n}\n\nDouble avg():\n{\n    int i = 1;\n \
  \   Double result;\n    Double param;\n}\n{\n    <AVG> result = expression()\n \
  \   (\n        <COMMA> param = expression()\n        {\n            if(result ==\
  \ null && param != null)\n                result = param;\n            else if(result\
  \ != null && param != null)\n            {\n                result = new Double(result.doubleValue()\
  \ + param.doubleValue());\n                i++;\n            }\n        }\n    )*\
  \ <CLOSE_PAR>\n    {\n        if(result != null && i != 0)\n            return new\
  \ Double(result.doubleValue()/(double)i);\n        return null;\n    }\n}\n\nDouble\
  \ expression():\n{\n    Double a;\n    Double b;\n}\n{\n    a = term()\n    (\n\
  \        <PLUS> b = term()\n        {\n            if(a == null && b != null)\n\
  \                a = b;\n            else if(a != null && b != null)\n         \
  \       a = new Double(a.doubleValue() + b.doubleValue());\n        }\n        |\
  \ <MINUS> b = term()\n        {\n            if(a == null && b != null)\n      \
  \          a = new Double( b.doubleValue()* (-1));\n            else if(a != null\
  \ && b != null)\n                a = new Double(a.doubleValue() - b.doubleValue());\n\
  \        }\n    )*\n    {\n        return a;\n    }\n}\n\nDouble term():\n{\n  \
  \  Double a;\n    Double b;\n}\n{\n    a = element()\n    (\n        <MULTIPLY>\
  \ b = element()\n        {\n            if(a == null || b == null)\n           \
  \     a = null; // 如果一个数字乘以 NULL，则返回 NULL。\n            else\n                a\
  \ = new Double(a.doubleValue() * b.doubleValue());\n        }\n        | <DIVIDE>\
  \ b = element()\n        {\n            if(a == null || b == null)\n           \
  \     a = null; // 如果存在任何 NULL 值，将返回 NULL。\n            else if(b.doubleValue()\
  \ == 0)\n                a = new Double(Double.NaN); // 除以零\n            else\n\
  \                a = new Double(a.doubleValue() / b.doubleValue());\n        }\n\
  \    )*\n    {\n        return a;\n    }\n}\n\nDouble unary():\n{\n    Double a;\n\
  }\n{\n    <MINUS> a = element()\n    {\n        return new Double(-a.doubleValue());\n\
  \    }\n    | <PLUS> a = element()\n    {\n        return a;\n    }\n}\n\nDouble\
  \ element():\n{\n    Token t;\n    Double a;\n}\n{\n    t = <NUMBER>\n    {\n  \
  \      return new Double(t.toString());\n    }\n    | a = sum()\n    {\n       \
  \ return a;\n    }\n    | a = avg()\n    {\n        return a;\n    }\n    | <OPEN_PAR>\
  \ a = expression() <CLOSE_PAR>\n    {\n        return a;\n    }\n    | a = unary()\n\
  \    {\n        return a;\n    }\n}\n```\n\n### 生成代码\n\n接下来，我们可以使用 `javacc`（位于 JavaCC\
  \ 安装的 bin 目录下）通过运行以下命令来生成 Java 代码：\n\n```bash\njavacc Calculator.jj\n```\n\n生成的\
  \ Java 文件如下：\n\n- `Calculator.java`: 生成的解析器。\n- `CalculatorConstants.java`: 标记常量列表。\n\
  - `CalculatorTokenManager.java`: 生成的标记管理器（或词法分析器）。\n- `ParseException.java`: 用于解析错误时抛出的异常。\n\
  - `SimpleCharStream.java`: 词法分析器处理字符的类。\n- `Token.java`: 代表标记的类。\n- `TokenMgrError.java`:\
  \ 词法错误时抛出的错误。\n\n### 实现细节\n\n在 `Calculator.java` 中，JavaCC 会自动生成以下构造函数：\n`public\
  \ Calculator(java.io.InputStream stream)`\n`public Calculator(java.io.InputStream\
  \ stream, String encoding)`\n\n\n\n\n```\nPARSER_END(CommentsRemover)\n\nSKIP :\
  \ {\n  “/*” : MultiLineComment\n}\n\n<MultiLineComment> SKIP : {\n  “*/” : DEFAULT\n\
  }\n\nSKIP : {\n  “//” : SingleLineComment\n}\n\n<SingleLineComment> SKIP : {\n \
  \ “\\n” { input_stream.backup(1); } : DEFAULT\n}\n\n<MultiLineComment,SingleLineComment>\
  \ MORE : {\n  <~[]>\n}\n\nTOKEN : {\n  <OTHER: ~[]>\n}\n\nvoid parse():\n{\n  Token\
  \ t;\n}\n\n{\n  (t = <OTHER>\n  {\n    buffer.append(t.image);\n  })*\n  <EOF>\n\
  }\n```\n\n`input_stream` 字段表示标记管理器中 `SimpleCharStream` 的实例。通过调用 `input_stream.backup(1)`，它会将当前位置回退一个字符，以免跳过换行符。\n\
  \n## Apache Solr\n\nApache Solr 是一个基于 Apache Lucene 的开源搜索平台，作为独立服务器运行（从 Solr 5.0\
  \ 开始，Solr 不再以 WAR 形式分发）。Lucene [(http://lucene.apache.org](http://lucene.apache.org))提供了基于\
  \ Java 的全文索引和搜索技术。\n\nSolr 提供了全文索引、命中高亮、分面搜索（faceted search）、富文档（例如 PDF、MS Word）索引以及数据库集成等功能。Solr\
  \ 提供了 REST 类的 API，可以通过 HTTP 调用，易于使用。Solr 允许通过配置和插件架构进行自定义。还有一些项目提供了库或插件，用于将 Solr\
  \ 与许多编程语言或应用程序集成。例如`SolrJ` 是一个通过 API 调用访问 Solr 的 Java 客户端。\n\n你可以从 [`lucene.apache.org/solr.`](http://lucene.apache.org/solr)\
  \ 下载 Apache Solr。编写本文时最新版本为 5.4（需要 Java 7 或更高版本）。\n\n![Image 39](img/index-266_1.jpg)\n\
  \n## 开始使用\n\nSolr 二进制分发版包含一个自包含的 Solr Web 应用程序，该程序使用了安装好的 Jetty（Eclipse Foundation\
  \ 的一部分，基于纯 Java 的 HTTP 服务器和 servlet 容器）。你可以使用 `bin` 目录下的脚本启动独立的 Solr 服务器：`solr start`\n\
  \n这将在后台通过端口 8983 启动带有 Solr Web 应用程序的 Jetty。要访问 Solr Admin UI（Solr 管理界面），你可以在浏览器中打开链接\
  \ [`localhost:8983/solr`](http://localhost:8983/solr)。\n\n要停止绑定到端口 8983 的 Solr 服务器，你可以运行：\n\
  ```\nsolr -stop -p 8983\n```\n\n## 基础目录结构\n\nSolr 二进制分发版包含一个带有 Solr Web 应用程序的 Jetty\
  \ 实例（位于 `server` 目录下）。Solr 5.4 使用 Jetty 9.2，包含以下目录：\n\n- **contexts**: 该目录包含部署在\
  \ Jetty 中的 Web 应用程序的额外配置。在这里，`solr-jetty-context.xml` 定义了上下文以及 Solr Web 应用程序的位置。\n\
  - **etc**: 该目录包含 Jetty 的配置文件。\n- **lib**: 该目录包含 Jetty 的运行时 JAR 文件。\n- **logs**:\
  \ 如果配置了日志记录，该目录包含日志文件。\n- **solr-webapp**: Solr Web 应用程序部署在此目录的 webapp 下。\n- **solr**:\
  \ 默认的 Solr 主目录。\n\n默认的 Solr 主目录为“solr”。要使用除默认配置以外的配置，你可以在启动 Solr 服务器时通过 `solr.solr.home`\
  \ 属性指定。例如，如果你想使用“mysolr”作为主目录，可以使用以下命令启动 Solr：`solr start -s mysolr`\n\n要了解更多关于\
  \ Jetty 的信息，可以查看 [`www.eclipse.org/jetty/`](http://www.eclipse.org/jetty/) 上的 Jetty\
  \ Wiki。\n\n## Solr 主目录\n\n典型的 Solr 主目录包含以下项：\n\n- **solr.xml**: 这是所有核心（cores）的主配置文件。在\
  \ Solr 4 中，此文件指定了它应该加载的 Solr 核心列表。从 Solr 5 开始，不再支持 `<cores>` 部分，自动核心发现取代了手动列出核心。每个\
  \ `<core>` 部分现在由每个 Solr 核心目录下的 `core.properties` 取代。自动核心发现将尝试在 Solr 主目录子目录的任何深度查找\
  \ `core.properties`。\n- **configsets**: 这是配置集（configsets）的基目录。配置集通过目录名称标识。这允许核心在创建新核心时通过指定配置集来共享配置。可以在\
  \ `solr.xml` 中使用 `configSetBaseDir` 元素配置路径。\n- **各个独立的 Solr 核心目录**: 对于每个 Solr 实例，它可以有多个核心。多个核心允许一个\
  \ Solr 实例拥有单独的配置和索引，但仍然保持了作为一个单一应用程序进行管理的便利性。这是在单个 servlet 容器下管理多个索引的策略之一。\n- **所有核心共享的库目录**:\
  \ 这是可选的。可以在 `solr.xml` 中使用 `sharedLib` 元素配置路径。\n\n## Solr 核心目录\n\n典型的 Solr 核心目录包含以下项：\n\
  \n- **core.properties**: Solr 核心通过 Java 属性文件进行配置。例如，要指定名称，你可以使用：\n```\nname=core1\n\
  ```\n此文件可以为空。这种情况下是核心所在的位置。\n- **conf**: 该目录是强制的，必须包含 `solrconfig.xml`。[(http://wiki.apache.org/solr/solrconfig.xml)](http://wiki.apache.org/solr/solrconfig.xml)\n\
  - **data**: 这是索引的默认位置。如果不存在将创建。你可以在 `solrconfig.xml` 中覆盖此位置。\n- **lib**: 该目录是可选的。如果存在，Solr\
  \ 将加载其中的 JAR。你可以在 `solrconfig.xml` 中覆盖此位置。\n- **schema.xml**: [`cwiki.apache.org/confluence/display/core.properties`](https://cwiki.apache.org/confluence/display/core.properties)\n\
  \n![Image 40](img/index-270_1)\n\n## 创建新核心\n\n你可以通过命令行使用内置配置集创建一个新核心。例如，要创建一个配置简单的核心\
  \ `basic_core`，你可以使用：\n```\nsolr create_core -c basic_core -d basic_configs\n```\n\
  `basic_configs` 为在 Solr 中创建核心提供了起点。\n\n从 Admin UI，你可以看到新的核心。你可以从核心选择器切换到它。\n\n除了使用命令行通过复制现有配置集来创建核心外，你也可以直接将整个目录结构创建到\
  \ Solr 主目录。\n\n除了内置配置集，Solr 二进制分发版在 `example` 目录下还包含一些示例。要启动如 `techproducts` 这样包含综合示例的示例，可以使用以下命令启动\
  \ Solr 实例：\n```\nsolr start -e techproducts\n```\n将创建一个带有数据的核心 techproducts。\n\n\
  ## SolrCloud\n\n为了高可用性和容错性，你可以配置 Solr 服务器集群通过 SolrCloud 处理分布式搜索和索引。为了分布式索引，索引（或逻辑索引）被分成若干部分（分片）。为了分布式搜索，每个分片可以有多个副本（副本）。每个副本作为\
  \ Solr 服务器中的一个核心存在。\n\n 在集群中，集合（collection）是一个跨多个机器的分片逻辑索引。\n\n## 文档架构\n\nSolr 的基本单元是文档。每个文档包含字段。字段类型定义了字段如何被索引以及如何被查询。对于熟悉数据库的人来说，文档就像表格行，字段就像表格列。在架构中添加新字段不会影响现有数据。所有现有文档都不会具有新添加的字段。从架构中删除字段也是如此。它不会影响现有数据。但是更新字段需要重新索引所有文档。或者，可以通过原子更新更新部分文档。这是\
  \ Solr 4.0 中引入的功能，要求除 `<copyField>` 目标字段外的所有字段都配置为 `stored=\"true\"`。\n\n\n\n\n\
  Solr 的核心概念是对文档进行索引并运行查询以返回匹配的文档。Solr 使用的是倒排索引（inverted indexing）。倒排索引存储了每个术语出现的文档列表（术语到文档），这对于按术语查询非常有用。在某些情况下（如排序、分面和分组），术语到文档的映射并不高效。通过为字段添加\
  \ `docValues=”true”` 可以启用字段的 `docValues`。这将对该字段使用正向索引（文档到术语）。\n\n要创建你自己的 schema，一个很好的起点是从内置的\
  \ configset。文档 schema 的基本结构所示：\n\n```xml\n<schema>\n  <fields>\n    <field/>\n \
  \   …\n    <dynamicField/>\n    …\n  </fields>\n  <uniqueKey>field name</uniqueKey>\n\
  \  <copyField/>\n  …\n  <types>\n    <fieldType/>\n    …\n  </types>\n</schema>\n\
  ```\n\n### 文档字段 (Document fields)\n`<fields>` 是声明字段的地方。`<fields>` 包含 `<field>` 和\
  \ `<dynamicField>` 元素的列表。`<field>` 元素包含许多属性。Name（名称）和 type（类型）是必须的。Name 由字母或下划线组成，且不能以数字开头。Type\
  \ 是 `<types>` 元素中 `<fieldType>` 元素的字段类型名称。例如，id 字段定义为：\n\n```xml\n<field name=\"\
  id” type=\"string” indexed=\"true” stored=\"true” required=\"true” multiValued=“false”\
  \ />\n```\n\n- **type**: 字段类型会影响搜索时的大小写敏感性。string 类型（`StrField` 类）不经过分析（输入数据不进行预处理）。你精确匹配字符串。`text_general`（`TextField`\
  \ 类）会执行分词和转小写。因此，它允许部分匹配和不区分大小写的匹配。\n- **indexed**: 如果此字段应被索引以便进行搜索、排序和分面，则设置为 true。\n\
  - **stored**: 如果在搜索中应返回此字段的原始值，则设置为 true。\n- **required**: 如果此字段是必填的，则设置为 true。如果值不存在，将抛出错误。\n\
  - **multiValued**: 如果此字段每个文档可以包含多个值，则设置为 true。\n\n默认情况下，新文档将替换具有相同唯一键（在 `schema.xml`\
  \ 中定义为 `uniqueKey` 的字段）的现有文档。\n\n`<dynamicField>` 允许你声明动态字段。这提供了灵活性，无需显式声明每个要被索引的字段。字段名通过开头或结尾带有通配符\
  \ `*` 的模式进行匹配。例如：\n\n```xml\n<dynamicField name=”*_i” type=\"int” indexed=\"true”\
  \ stored=\"true\"/> own\n```\n\n一旦字段被索引，它就会被添加到 schema 中。之后，它就像普通字段一样。这意味着你不能添加数据类型冲突的字段值。此外，在查询中，你需要提供精确的字段名。动态字段提供了灵活性，但由于文档中字段名的拼写错误，可能会意外创建新字段。在生产环境中需要特别注意。\n\
  \n`<copyField>` 在文档添加到索引时将一个字段复制到另一个字段。这是在不同字段中以不同方式索引相同数据的方便方法。例如，一个字段用于搜索（经过分词、转小写和去除标点符号），另一个字段用于排序（不分词、转小写）。\n\
  \n你也可以向同一个字段添加多个字段。例如：\n\n```xml\n<copyField source=\"cat” dest=\"text”/>\n<copyField\
  \ source=\"name” dest=\"text”/>\n```\n\n在这里，`text` 字段需要是一个多值字段。要查看 schema 中定义的字段，你可以使用\
  \ Admin UI 中的 Schema Browser：\n\n![Image 41](img/index-274_1.jpg)\n\n### 字段类型 (Field\
  \ types)\nSolr 字段类型是 `FieldType` 类的子类，例如 `TextField`、`StrField`。schema 中的字段类型定义可以基于这些类创建。以下是\
  \ Solr 示例 schema 中的一些基本类型定义：\n- boolean\n- int (or `tint`)\n- float (or `tfloat`)\n\
  - long (or `tlong`)\n- double (or `tdouble`)\n- date (or `tdate`)\n- string\n- text_general\n\
  \n以下是两个数值类型（整数）的字段定义：\n\n```xml\n<fieldType name=\"int” class=\"solr.TrieIntField\"\
  \ precisionStep=\"0\" positionIncrementGap=\"0\"/>\n<fieldType name=\"tint” class=\"\
  solr.TrieIntField\" precisionStep=\"8\" positionIncrementGap=\"0\"/>\n```\n\n较小的\
  \ `precisionStep` 值（位为单位）会为每个值生成更多的索引 token，并可以更快的范围查询。但索引尺寸也会更大。`precisionStep`\
  \ 为 0 则禁用不同精度层级的索引。`positionIncrementGap` 可用于在多值字段的术语之间添加空格，以防止错误的短语匹配。\n\n`TextField`\
  \ 类型的字段通常包含一个分析器（analyzer）。分析器负责分析文本内容并生成 token。在索引时，输出被用于构建索引。在查询时，输出被用于匹配查询结果。分析器包含一系列分词器（tokenizers）和过滤器（filters）。分词器可以将文本拆分为\
  \ token，过滤器可用于过滤这些 token。相同的操作可以在索引时和查询时均使用。或者，它们也可以包含不同的操作。以下是示例 schema 中定义的文本类型\
  \ `text_general`：\n\n```xml\n<fieldType name=\"text_general\" class=\"solr.TextField\"\
  \ positionIncrementGap=\"100\">\n  <analyzer type=\"index\">\n    <tokenizer class=\"\
  solr.StandardTokenizer\"/>\n    <filter class=\"solr.StopWordFilter\" words=\"stopwords.txt\"\
  \ />\n    <filter class=\"solr.LowerCaseFilter\"/>\n    <filter class=\"solr.PosFilterFactory\"\
  />\n  </analyzer>\n  <analyzer type=\"query\">\n    <tokenizer class=\"solr.StandardTokenizer\"\
  />\n    <filter class=\"solr.StopWordFilter\" words=\"stopwords.txt\" />\n    <filter\
  \ class=\"solr.LowerCaseFilter\"/>\n    <filter class=\"solr.PosFilterFactory\"\
  />\n  </analyzer>\n</fieldType>\n```\n\n如果你需要定义一个不分词且不区分大小写的字段，可以将其定义为：\n\n```xml\n\
  <fieldType name=\"text_ci” class=\"solr.TextField\" sortMissingLast=\"false\" omitNorms=\"\
  true\">\n  <analyzer>\n    <!-- KeywordTokenizer 不进行任何分词。整个输入字符串保留为一个 token。 -->\n\
  \    <tokenizer class=\"solr.KeywordTokenizerFactory\"/>\n    <filter class=\"solr.LowerCaseFilter\"\
  />\n    <!-- 移除开头或结尾的空格 -->\n    <filter class=\"solr.TrimFilterFactory\"/>\n  </analyzer>\n\
  </fieldType>\n```\n\n![Image 42](img/index-277_1.jpg)\n\n### 字段分析 (Field analysis)\n\
  查看字段值在索引或查询时如何被分析，可以使用 Admin UI 中的 Analysis。\n\n### 更新数据 (UPDATING DATA)\n到目前服务器不包含任何数据。要向\
  \ Solr 索引添加/更新数据，你需要向服务器发布命令。你可以使用注册在 `solrconfig.xml` 中的请求处理器：\n\n```xml\n<requestHandler\
  \ name=\"/update” class=\"solr.UpdateRequestHandler\"/>\n```\n\n`UpdateRequestHandler`\
  \ 支持多种格式的命令：XML、CSV、JSON 或 JAVABIN。可以使用以下方法发布命令：\n- **post.jar**: 这是 example/exampledoc\
  \ 目录下的一个简单命令行工具（使用 HTTP POST 方法）。它允许从各种格式的文件发布数据。你可以带 `-h` 参数运行 post.jar 以查看详细用法和示例。\n\
  - **cURL**: 这是一个使用 URL 语法传输数据的命令行工具。它支持多种操作系统。你可以从 [`curl.haxx.se.`](http://curl.haxx.se)\
  \ 下载它。\n- **HTTP GET 方法**: HTTP 规范没有对 URL 长度的限制。但许多客户端和服务器都有这样的长度限制。不要使用它来发送大量数据。它只适用于短请求。GET\
  \ 请求需要 URL 编码。\n\n\n\n\nXML 是一种存储结构化数据和在位置之间传输数据的流行且简单的方法。Solr 允许发布 XML 消息来更新 Solr\
  \ 索引。可以在一个 XML 消息中组合多个命令。由于 XML 文档只有一个根元素，你需要将命令封装在 `<update>` 元素中。XML 消息中的所有命令将按顺序执行。如果任何命令失败，其后的所有内容将不会执行。有关\
  \ XML 消息的元素和属性的更多信息，请参阅 [`wiki.apache.org/solr/UpdateXmlMessages.`](http://wiki.apache.org/solr/UpdateXmlMessages)。\n\
  \n## add\n\n你可以使用 `<add>` 命令添加/替换文档。默认情况下，现有文档将被具有与 schema 中定义的相同唯一键（unique key）的新加文档替换。通过将\
  \ `<add>` 的可选属性 `override` 设置为 `false` 可以禁用此功能。可以在单个 `<add>` 命令中指定多个文档。每个文档可以有多个字段。多值字段可以在文档中出现多次。以下是基本结构：\n\
  \n```xml\n<add>\n  <doc>\n    <field name=\"field1\">value1</field>\n    <field\
  \ name=\"field2\">value2</field>\n    …\n  </doc>\n  <doc></doc>\n  …\n</add>\n\
  ```\n\n接下来，你可以使用 `post.jar` 并使用“example/exampledoc”目录中的示例文件来添加文档。在操作之前，你需要运行以下命令：`solr\
  \ create_core -c sample_core -d sample_techproducts_configs`，通过内置配置集 `sample_techproducts_configs`\
  \ 创建一个可以处理这些示例文档的内核（core）。现在，我们准备好通过运行 `java -Dc=sample_core -jar post.jar solr.xml`\
  \ 向该核心发布第一个文档了。\n\n`solr.xml` 只包含一个文档。你将获得以下响应：\n\n```\nSimplePostTool version 5.0.0\n\
  Posting files to [base] url http://localhost:8983/solr/sample_core/update using\
  \ content-type application/xml…\nPOSTing file solr.xml to [base]\n1 files indexed.\n\
  COMMITting Solr index changes to http://localhost:8983/solr/sample_core/update…\n\
  Time spent: 0:00:00.458\n```\n\n你刚刚将第一个文档索引到 Solr。默认情况下，主机名是 `localhost`，端口号是 `8983`。你可以使用\
  \ `-Dhost` 指定主机名，并使用 `-Dport` 指定端口号。由于默认内容类型为 `application/xml`，因此你不需要使用 `-Dtype`\
  \ 来指定内容类型。\n\n要通过 `cURL` 执行相同的操作，你可以运行：\n\n```bash\ncurl http://localhost:8983/solr/sample_core/update\
  \ -H \"Content-Type: text/xml\" —data-binary @solr.xml\n```\n\n你将获得以下 XML 格式的响应：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<response>\n  <lst name=\"\
  responseHeader\">\n    <int name=\"status\">0</int>\n    <int name=\"QTime\">13</int>\n\
  \  </lst>\n</response>\n```\n\n`QTime` 表示执行查询所需的时间。单位是毫秒。使用 HTTP POST 需要有效的内头。如果是\
  \ UTF-8，请使用 `-H \"Content-Type: text/xml; charset=utf-8\"`。你可以使用 `--data-binary`\
  \ 选项包含 XML 消息（用双引号括）或文件（以“@”符号开头的文件）。如果你需要立即发生式提交（commit），可以使用 `update?commit=true`。\n\
  \n原子文档更新（Atomic document updates）允许在不向 Solr 发送整个文档的情况下更新单个字段。这可以通过字段 元素中的 `update`\
  \ 属性来实现。可用选项有 `add`、`set` 和 `inc`。如果你需要将字段的值设为空，可以在字段元素中使用 `update=\"set\" null=\"\
  true\"`。例如，要用新值替换文档的价格字段，你可以运行：\n\n```bash\ncurl http://localhost:8983/solr/sample_core/update?commit=true\
  \ -H \"Content-Type: text/xml\" —data-binary \"<add><doc><field name=\\\"id\\\"\
  >SOLR1000</field><field name=\\\"price\\\" update=\\\"set\\\">200</field></doc></add>\"\
  \n```\n\n对于多值字段，你可以使用 `update=\"add\"` 向其添加一个新值。要增加字段的值，可以使用 `update=\"inc\"`。要原子化地更新文档，请确保在\
  \ `solrconfig.xml` 中配置了 `<updateLog>`。例如：\n\n```xml\n<updateHandler class=\"solr.DirectUpdateHandler2\"\
  >\n  <updateLog>\n    <str name=\"dir\">${solr.ulog.dir:}</str>\n  </updateLog>\n\
  </updateHandler>\n```\n\n这启用了用于恢复的事务日志。\n\n## commit\n\n在发送提交命令之前，索引的更改对新的搜索请求是不可见的。提交有两种类型：硬提交（hard\
  \ commit）和软提交（soft commit）。硬提交会将更改同步到索引并滚动日志（如果启用了 `updateLog`）。在系统故障情况下数据不会丢失。这可以防止日志过大（对于未提交的更新）。软提交仅使更改可见，而不会将更改同步到持久化存储。在系统故障情况下，上一次硬提交之后发生的更改可能会丢失。\n\
  \n软提交比硬提交快得多。你可以使用 `softCommit=\"true\"` 执行软提交。你可以在 `solrconfig.xml` 的 `updateHandler`\
  \ 下配置它们。例如：\n\n```xml\n<updateHandler>\n  <autoCommit>\n    <maxDocs>10000</maxDocs>\n\
  \    <maxTime>15000</maxTime>\n    <openSearcher>false</openSearcher>\n  </autoCommit>\n\
  \  <autoSoftCommit>\n    <maxTime>1000</maxTime>\n  </autoSoftCommit>\n</updateHandler>\n\
  ```\n\n另一种提交策略是使用 `commitWithin` 请求 Solr 在特定时间内提交 `<add>` 命令。例如，`commitWithin=\"\
  1000\"` 是请求 Solr 在 1000ms 内进行提交。以下示例是通过 HTTP GET 发送 `<commit>` 命令。你可以直接使用浏览器运行。请求需要\
  \ URL 编码：`http://localhost:8983/solr/sample_core/update?stream.body=%3Ccommit%3E`。\n\
  \n## delete\n\n你可以使用 `<delete>` 删除删除。你可以在删除 XML 消息中指定唯一键的值（按 ID 删除）。例如：\n\n```xml\n\
  <delete><id>SOLR1000</id></delete>\n```\n\n或者，你可以通过查询删除文档（按查询删除）。例如：\n\n```xml\n\
  <delete><query>name:Solr</query></delete>\n```\n按删除使用 Lucene 查询解析器。我们稍后会讨论查询语法。你可以在同一个\
  \ `<delete>` 部分包含多个删除操作（按 ID 删除、按查询删除）。\n\n如果你想清空 Solr 索引，可以使用：\n\n```xml\n<delete><query>*:*</query></delete>\n\
  ```\n\n例如：\n\n```bash\njava -Dc=sample_core -Ddata=args -jar post.jar \"<delete><query>*:*</query></delete>\"\
  \ncurl http://localhost:8983/solr/sample_core/update?commit=true -H \"Content-Type:\
  \ text/xml\" —data-binary \"<delete><query>*:*</query></delete>\"\nhttp://localhost:8983/solr/sample_core/update?stream.body=<delete><query>*:*</query></delete>&commit=true\n\
  ```\n\n## CSV\n\nSolr 接受 CSV（逗号分隔值）格式的数据。这包括从 Excel 或 MySQL 出的文件。此外，分隔符或转义等参数是可配置的。你可以使用\
  \ `/update/csv` 或 `/update` 发布 CSV 数据。内容类型为 `application/csv` 或 `text/csv`。以下是示例\
  \ CSV 数据：\n\n```csv\nid,cat,name\n00001,book,Java,Effective Java\n00002,book,C,Programming\
  \ in C\n```\n\n\n\n\n默认情况下，第一行是 CSV 数据的表头。它包含一个逗号分隔的字段名列表。如果你需要在字段值中保留分隔符或空白等字符，可以使用封装器将其包围起来。默认的封装器是双引号\
  \ `“`。如果封装器本身需要出现在被封装的值中，你可以使用两个封装器对其进行转义。CSV 数据支持多值字段。要处理多值字段，你可以将该字段的 `split`\
  \ 参数设置为 `true`。一旦设置为 `true`，该字段值将由另一个 CSV 解析器拆分为多个值。例如，上述示例中的 `cat` 字段就是一个多值字段。你可以在请求\
  \ URL 中使用 `f.cat.split=true` 将它们索引为相互独立的值：\n\n```bash\ncurl “http://localhost:8983/solr/update?commit=true&f.cat.split=true”\
  \ -H “Content-Type: text/csv” —data-binary @books.csv\n```\n\n默认情况下，多值字段的分隔符与字段分隔符相同。你可以通过\
  \ `f.<field name>.separator=value` 来更改它（例如 `f.cat.separator=|`）。\n\n注意：URL 被双引号包围是因为查询字符串中有多个参数。查询字符串中的分隔符\
  \ `&` 在命令行模式下可能会被视为命令的一部分（例如，命令分隔符或在后台运行先前的命令）。如果 `post.jar` 的 `-Dparams` 选项存在多个查询参数，可能会发生类似的问题。如果发生这种情况，你可以用双引号包围整个选项。\n\
  \n## 查询数据\n\n### 请求处理器\n\n为了提供灵活性，Solr 允许使用可插的自定义代码。这被称为插件（plugin）。Solr 中有许多类可以被视为插件。例如，请求处理器（request\
  \ handlers）用于处理查询请求。请求处理器实现了 `SolrRequestHandler` 接口。`SearchHandler` 类是 Solr 提供的处理搜索请求的主要请求处理器。\n\
  \n在 Solr 中，请求根据请求 URL 中指定的路径分发到特定的请求处理器。所有的请求处理器都定义在 `solrconfig.xml` 中。Solr 中有不同的内置请求处理器。例如，搜索请求处理器的定义如下：\n\
  \n```xml\n<requestHandler name=\"/select” class=\"solr.SearchHandler\">\n  <lst\
  \ name=\"defaults\">\n    <str name=\"echoParams\">explicit</str> <!--指示响应中应该包含什么种的请求参数。“explicit”意味着只包含请求中指定的参数。\
  \ -->\n    <int name=\"rows\">10</int> <!-- 每个请求返回的最大文档数量 -->\n    <str name=\"\
  df\">text</str> <!-- 默认搜索字段 -->\n  </lst>\n</requestHandler>\n```\n\n查询参数的默认值可以在\
  \ `<requestHandler>` 元素下的、名为 `defaults` 的 `<lst>` 元素中指定。除了 `defaults` 之外，还有两组额外的查询参数：`appends`\
  \ 和 `invariants`。`“appends” 定义了将要包含的额外参数值。`“invariants” 定义了不会被覆盖的参数值。\n\n默认值可以在请求\
  \ URL 中被覆盖。要访问某个处理器，你可以使用以下格式的请求 URL：\n\n`http://{host:port}/{context root}/{core}/{handler\
  \ name}`\n\n例如，要访问 `sample_core` 中上述的搜索请求处理器，可以使用：\n\n`http://localhost:8983/solr/sample_core/select`\n\
  \n同一个请求处理器的多个实例可以用不同的名称（以及不同的参数）注册多次。\n\n### 查询参数\n\n搜索处理器是处理搜索查询并返回结果列表的处理器。Solr\
  \ 提供的主要搜索处理器是 `SearchHandler` 类。在 `solrconfig.xml` 中注册了多个具有不同名称的 `SearchHandler`\
  \ 实例。以下是支持的主要查询参数：\n\n- **q**: 搜索查询。这是必需的参数。Solr 支持通配符、范围和布尔逻辑。它支持两种类型：单词和短语（双引号包围的词组）。\n\
  - **df**: 默认搜索字段。\n- **fl**: 指定返回的字段集。\n- **fq**: 过滤查询。可以多次使用，以缩小搜索范围。\n- **start**:\
  \ 结果的偏移量。\n- **rows**: 每个请求返回的最大文档数量。\n- **sort**: 定义排序的字段和方向（`asc` 或 `desc`）。\n\
  - **defType**: 指定查询解析器。\n- **debugQuery**: 如果需要在响应中添加额外的调试信息，可以使用此参数。\n\n默认情况下，Solr\
  \ 使用 Lucene 查询解析器。\n\n### 字段\n\n你可以通过 `<field>:<term>` 任意字段。`<field>` 是区分大小写的。如果字段名缺失，将使用默认搜索字段。术语有两种类型：单词和短语。单词是一个单词。例如，在\
  \ name 字段中搜索 `Solr`，可以使用 `name:Solr`。短语是一组被双引号包围的词。例如，在 name 字段中搜索 `phone features`，可以使用\
  \ `:\"phone features\"`。\n\n### 布尔运算符\n\n如果涉及多个术语，可以通过布尔运算符将它们组合。Lucene 支持以下运算符：\n\
  \n- **OR (||)**: 匹配存在任意一个术语的。这是两个术语之间没有运算符时的默认。\n- **AND (&&)**: 匹配两个术语都存在的。\n-\
  \ **+**: 要求文档包含 '+' 符号后的术语。\n- **NOT (!)**: 排除包含 NOT 后术语的文档。\n- **-**: 排除存在的术语。\n\
  \n布尔运算符必须全大写。例如，`“name:Solr or name:One”` 匹配 name 字段为“Solr”，或匹配默认搜索字段为“or”，或匹配 name\
  \ 字段为“One”。这与 `name:Solr OR name:One` 不同。\n\n### 分组搜索\n\n你可以使用括号将子分组形成子查询。例如，`(name:Solr\
  \ OR name:One) AND inStock=true`。此外，你可以使用括号将多个子组合到单个字段。例如，`name:(+Solr +One)`。\n\
  \n### 通配符搜索\n\n允许在单词内（非短语内）使用单字符通配符 `?` 和多字符通配符 `*`。但你不能将 `*` 或 `?` 作为搜索的起始字符。它们只允许出现在的中间或结尾。\n\
  \n### 正则表达式搜索\n\n从 4.0 版本开始支持正则表达式。要进行正则表达式搜索，请使用由 `/` 包围的模式。请查看 Lucene 中的 `RegExp`\
  \ 类以支持的语法。例如，在 name 字段中搜索包含 iPod 或 iPad 的文档，可以使用 `name:/iP[ao]d/`。\n\n\n\n\n## 邻近搜索\
  \ (Proximity searches)\n\n如果你需要查找特定距离内的词，可以使用邻近搜索。\n\n精确匹配的邻近度为 0。要进行邻近搜索，请在短语末尾使用\
  \ `~` 符号加一个数字。例如，要搜索“power”和“iPod”之间隔 2 个词以内的文档，可以使用“power iPod”~2。\n\n## 范围搜索 (Range\
  \ searches)\n\n要匹配字段值在下限和上限之间的文档，可以使用范围搜索。范围查询可以包含边界值（使用 `[` 或 `]`）或不包含边界值（使用 `{`\
  \ 或 `}`）。例如，`price: [100 TO 1000]`。在范围搜索中允许使用 `*`。例如，`price:[100 TO *]` 用于查找价格大于或等于\
  \ 100 的价格值。\n\n要查找所有某个字段具有值的文档，可以使用 `[* TO *]`。\n\n## 词项加权/提升 (Boosting terms)\n\
  \n你可以通过提升权重（boosting）使某个词比其他词更重要。要提升某个词的权重，请在词后使用 `^` 加上一个数字（提升因子）。提升因子越高，该词的相关性越高。因此，提升词权重可以控制相应文档的相关性（以及排序顺序）。默认情况下，提升因子为\
  \ 1，且必须为正数。\n\n## 特殊字符 (Special characters)\n\n如果你需要使用查询语法中的任何特殊字符，需要对它们进行转义。以下是特殊字符：\n\
  \n`+ - && || ! ( ) { } [ ] ^ “ ~ * ? : \\ /`\n\n要转义这些特殊字符，需要在字符前使用 `\\`。\n\n要查询数据，你可以在\
  \ `/select` 上使用 HTTP GET 方法以及上述参数。假设你已经发布并提交了 `exampledocs` 目录下所有的 XML 文档。现在，你可以运行以下查询在\
  \ name 字段上搜索“Solr”，并请求返回 name 和 price 字段：\n\n```http\nhttp://localhost:8983/solr/sample_core/select?q=name:Solr&fl=name,price\n\
  ```\n\n响应为：\n\n```xml\n<?xml version=“1.0” encoding=“UTF-8”?>\n<response>\n  <lst\
  \ name=“responseHeader”>\n    <int name=“status”>0</int>\n    <int name=“QTime”>52</int>\n\
  \    <lst name=“params”>\n      <str name=“fl”>name,price</str>\n      <str name=“q”>name:Solr</str>\n\
  \    </lst>\n  </lst>\n  <result name=“response” start=“0” numFound=“1”>\n    <doc>\n\
  \      <str name=“name”>Solr, the Enterprise Search Server</str>\n      <float name=“price”>0.0</float>\n\
  \    </doc>\n  </result>\n</response>\n```\n\n默认情况下会返回所有字段。你可以使用 `fl` 参数指定要返回的字段。默认情况下响应为\
  \ XML 格式。可用的格式类型由 `solrconfig.xml` 中的 `<queryResponseWriter>` 元素定义。你可以在查询中包含 `wt`\
  \ 参数生成不同的格式。例如，通过使用 `wt=csv` 将响应格式改为 CSV：\n\n![Image 43](img/index-295_jpg)\n\n\
  ```http\nhttp://localhost:8983/solr/sample_core/select?q=name:Solr&fl=name,price&wt=csv\n\
  ```\n\n响应为：\n\n```csv\nname,price\n“Solr, the Enterprise Search Server”,0.0\n```\n\
  \n除了使用命令行查询数据外，你也可以在 Solr Admin UI 的 Query 标签页中查询数据：\n\n## 排序\n\n默认情况下，查询结果按分数（score）降序排列。如果你需要对索引字段进行排序，可以使用\
  \ `sort` 参数。格式为：`sort=<字段名> <方向>[,<字段名> <方向>]\n\n方向可以是 `asc`（升序）或 `desc`（降序）。排序仅允许在\
  \ `multiValued=\"false\"` 且 `indexed=\"true\"` 的字段上进行。例如：\n\n```http\nhttp://localhost:8983/solr/sample_core/select?q=name:Solr&inStock=true&sort=price\
  \ asc\n```\n\n查询字符串需要经过 URL 编码。如果你使用 `curl`，可以使用 `--data-urlencode` 为你对查询字符串进行编码。例如：\n\
  \n```bash\ncurl --data-urlencode “q=name:CORSAIR AND inStock:true&sort=price asc,popularity\
  \ desc” http://localhost:8983/solr/sample_core/select\n```\n\n## 命中高亮 (Hit highlighting)\n\
  \nSolr 命中高亮功能，返回字段值中的高亮片段。\n\n要启用高亮，你需要将 `hl` 参数设置为 `true`，并使用 `hl.fl` 指定要高亮的字段列表。字段之间用逗号或空格分隔。可以使用符号\
  \ `*`。例如，要在匹配文档的 features 字段上高亮“GPU”，可以使用：\n\n```http\nhttp://localhost:8983/solr/sample_core/select?q=GPU&wt=xml&hl=true&hl.fl=features\n\
  ```\n\n响应包含两个部分。第一部分包含匹配文档，第二部分包含高亮字段。如果不需要匹配文档，可以在查询中包含 `rows=0` 以提高性能。高亮单词被 `<em>`\
  \ 元素包围。例如：\n\n```xml\n<result name=“response” numFound=“2” start=“0”>\n  <doc>…</doc>\n\
  \  <doc>…</doc>\n</result>\n<lst name=“highlighting”>\n  <doc>\n    <str name=“features”...<em>GPU</em>...</str>\n\
  \  </doc>\n</lst>\n```\n\n\n\n\n\n`facet.range`: 此参数指定用于创建范围聚合（range facet）的字段。可以多次使用以创建多个范围。\n\
  \n`facet.range.start`: 此参数定义范围的下界。默认情况下，下界是包含的（inclusive）。如果有多个字段，可以使用格式 `f.<field\
  \ name>.facet.range.start` 按字段使用该参数。\n\n`facet.range.end`: 此参数定义范围的上界。默认情况下，上界是不包含的（exclusive）。此参数可以按字段使用。\n\
  \n`facet.range.gap`: 此参数定义值之间的间距。此参数可以按字段使用。允许使用逗号分隔的值列表来允许变宽间距。\n\n例如，\n\n`http://localhost:8983/solr/sample_core/select/?q=price:[0\
  \ TO *]&rows=0&facet=true&facet.range=price&facet.range.start=0&facet.range.end=500&facet.range.gap=100&facet.range.other=all`\n\
  \n响应为：\n\n```xml\n<result name=\"response\" numFound=\"16\" start=\"0\"/>\n<lst\
  \ name=\"facet_counts\">\n  ….\n  <lst name=\"facet_ranges\">\n    <lst name=\"\
  price\">\n      <lst name=\"counts\">\n        <int name=\"0.0\">7</int>\n     \
  \   <int name=\"100.0\">2</int>\n        <int name=\"200.0\">1</int>\n        <int\
  \ name=\"300.0\">3</int>\n        <int name=\"400.0\">1</int>\n      </lst>\n  \
  \    <float name=\"gap\">100.0</float>\n      <int name=\"before\">0</int>\n   \
  \   <int name=\"after\">2</int>\n      <int name=\"between\">14</int>\n      <float\
  \ name=\"start\">0.0</float>\n      <float name=\"end\">500.0</float>\n    </lst>\n\
  \  </lst>\n  ….\n</lst>\n```\n\n`numFound` 表示查询中有 16 个匹配的文档。但在范围聚合的结果中只有 14 个文档。这是因为有\
  \ 2 个文档的字段值大于最后一个范围的上界。你可以通过 `facet.range.other=all` 获取此类信息信息。\n\n### 枢纽聚合 (Pivot\
  \ Faceting)\n\n字段聚合允许你仅在一个层级进行聚合。为了处理数据的分级结构，你可以使用 `facet.pivot` 参数来指定一个用于枢纽处理的字段列表，并为可能的排列生成聚合计数。它可以多次使用以实现多个枢纽聚合。接下来的示例显示了双层枢纽聚合：`http://localhost:8983/solr/sample_core/select?q=*:*&rows=0&facet=true&facet.pivot=cat,inStock`\n\
  \n```xml\n<lst name=\"facet_pivot\">\n  <arr name=\"cat,inStock\">\n    <lst>\n\
  \      <str name=\"field\">cat</str>\n      <str name=\"value\">electronics</str>\n\
  \      <int name=\"count\">12</int>\n      <arr name=\"pivot\">\n        <lst>\n\
  \          <str name=\"field\">inStock</str>\n          <bool name=\"value\">true</bool>\n\
  \          <int name=\"count\">8</int>\n        </lst>\n        <lst>\n        \
  \  <str name=\"field\">inStock</str>\n          <bool name=\"value\">false</bool>\n\
  \          <int name=\"count\">4</int>\n        </lst>\n      </arr>\n    </lst>\n\
  \    <lst>\n      <str name=\"field\">cat</str>\n      <str name=\"value\">currency</str>\n\
  \      <int name=\"count\">4</int>\n      <arr name=\"pivot\">\n        <lst>\n\
  \          <str name=\"field\">inStock</str>\n          <bool name=\"value\">true</bool>\n\
  \          <int name=\"count\">4</int>\n        </lst>\n      </arr>\n    </lst>\n\
  \    …\n  </arr>\n</lst>\n```\n\n关于聚合搜索的更多参数，请参阅 [`wiki.apache.org/solr/SolrFacetingOverview.`](http://wiki.apache.org/solr/SolrFacetingOverview)\n\
  \n### 结果分组 (Result Grouping)\n\n对于匹配的文档，可以通过结果分组根据共同字段（不能是多值字段）进行分组。要启用结果分组，你需要设置\
  \ `group=true`并通过 `group.field` 参数指定用于分组的字段。下面的示例显示了基于 `inStock` 字段值的的结果分组：`http://localhost:8983/solr/sample_core/select?q=inStock:[*%20TO%20*]&fl=name,inStock&group=true&group.field=inStock&group.ngroups=true`\n\
  \n```xml\n<lst name=\"grouped\">\n  <lst name=\"inStock\">\n    <int name=\"matches\"\
  >21</int>\n    <int name=\"ngroups\">2</int>\n    <arr name=\"groups\">\n      <lst>\n\
  \        <bool name=\"groupValue\">true</bool>\n        <result name=\"doclist\"\
  \ numFound=\"17\" start=\"0\">\n          <doc>\n            <str name=\"name\"\
  >Test with some GB</str>\n            <bool name=\"inStock\">true</bool>\n     \
  \     </doc>\n        </result>\n      </lst>\n      <lst>\n        <bool name=\"\
  groupValue\">false</bool>\n        <result name=\"doclist\" numFound=\"4\" start=\"\
  0\">\n          <doc>\n            <str name=\"name\">Belkin Power Cord for iPod/Dock</str>\n\
  \            <bool name=\"inStock\">false</bool>\n          </doc>\n        </result>\n\
  \      </lst>\n    </arr>\n  </lst>\n</lst>\n\n默认情况下，`group.limit` 为 1。这就是为什么每个组只返回一个文档。按查询分组可以使用\
  \ `group.query`。对于分组聚合，可以设置 `group.facet=true`。分组聚合基于 `facet.field` 计算。如果有多个组，将使用第一个组。例如，通过唯一\
  \ ID 获取类别的聚合计数，可以使用：`http://localhost:8983/solr/sample_core/select?q=manu_id_s:[*%20TO%20*]&fl=name,manu_id_s,group=true&group.field=manu_id_s&facet=true&facet.field=cat<int\
  \ name=\"electronics\">8</int><int name=\"currency\">4</int><int name=\"graphics\"\
  >2</int><int name=\"hard drive\">2</int><int name=\"camera\">1</int>`\n\n关于结果分组的更多参数，请参阅\
  \ [`wiki.apache.org/solr/FieldCollapsing`](http://apache.org/FieldCollapsing)。\n\
  \n### 索引富文档 (INDEXING RICH DOCUMENTS)\n\n要索引富文档，你可以使用 Solr cell 更新处理器（`ExtractRequestHandler`）。URL\
  \ 为 `/update/extract`。`ExtractRequestHandler` 使用 Apache Tika 从文档中提取文本并索引。Apache\
  \ Tika ([http://tika.apache.org/]) 是一个内容分析工具包，使用 HTML、MS Office 或 PDF 等各种解析器检测并提取元数据和结构化文本。`ExtractRequestHandler`\
  \ 位于 `solr-cell-5.4.jar` 中。你需要确保 `solrconfig.xml` 中配置了以下两行：\n\n```xml\n<lib dir=\"\
  ${solr.install.dir:../../../..}/extraction/lib\" regex=\".*.jar\" />\n<lib dir=\"\
  ${solr.install.dir:../../../..}/dist/\" regex=\"solr-cell-\\d.*.jar\" />\n```\n\n\
  例如，使用 `post.jar` 向 Solr 发送文件：\n\n```bash\njava -Du=http://localhost:8983/solr/sample_core/update/extract\
  \ -Dparams=literal.id=solr_sample -Dtype=text/html -jar post.jar sample.html\n```\n\
  \n或者使用 `curl`：\n\n```bash\ncurl \"http://localhost:8983/solr/sample_core/update/extract?literal.id=solr_sample&commit=true\"\
  \ -H \"Content-type:text/html\" --data-binary @sample.html\n```\n\n你可以使用 `literal.<field\
  \ name>` 参数使用指定的值创建自己的字段。这里，`literal.id` 创建了一个 `id` 字段，因为 `id` 字段在 `schema.xml`\
  \ 中定义为唯一字段。提取的文本（已删除 HTML 标签）被添加到 `content` 字段。根据 `schema.xml`，该字段定义为 `index=\"\
  false\" stored=\"true\"`。这是因为该字段用于返回和高亮文档内容。该字段通过 `<copyField>` 复制到文本字段。文本字段定义为\
  \ `index=\"true\" stored=\"false\"`。这是因为文本字段用于搜索。使用 `stored=\"false\"`是为了节省空间。以下是文档：\n\
  \n```xml\n<doc>\n  <arr name=\"links\">\n    <str>rect</str>\n    <str>http://www.apache.org</str>\n\
  \  </arr>\n  <str name=\"id\">solr_sample</str>\n  <arr name=\"title\">\n    <str>Welcome\
  \ to Solr</str>\n  </arr>\n  <arr name=\"content_type\">\n    <str>text/html; charset=windows-1252</str>\n\
  \  </arr>\n  <arr name=\"content\">\n    <str>Welcome to Solr...</str>\n  </arr>\n\
  \  <long name=\"_version_\">1524764848508895232</long>\n</doc>\n```\n\n现在，你可以执行以下查询在默认搜索字段（文本字段）上搜索并对内容字段进行高亮：\n\
  \n`http://localhost:8983/solr/sample_core/select?q=solr&hl=true&hl.fl=content&hl.fragsize=500`\n\
  \n如果你需要存储所有元数据（例如 `stream_size`、`stream_content_type`），由 Tika 生成或由 Solr 添加，可以使用\
  \ `upprefix=<prefix>` 参数。例如，`upprefix=attr_` 会导致所有在 schema 中未定义的生成字段以 `attr_` 为前缀（`attr_`\
  \ 是 `schema.xml` 中定义的动态字段）。元数据随文档类型而异。你可以将 `extractOnly` 参数设置为 true，以便在不索引文档的情况下查看实际值。\n\
  \n\n\n\n\n对于受密码保护的，如果文件名模式到密码的映射存储在文件中，你可以通过 `resource.password` 或 `passwordsFile`\
  \ 参数提供密码。\n\n例如，要发送 PDF 文档，可以使用以下命令：\n\n```\njava -Durl=http://localhost:8983/solr/sample_core/update/extract\
  \ “-Dparams=literal.id=solr_word&uprefix=attr_” -Dtype=application/pdf -jar post.jar\
  \ solr-word.pdf\n```\n\n你可以发现 PDF 具有不同的元数据，如下所示：\n\n```xml\n<doc>\n<arr name=\"\
  attr_meta\">\n<str>meta:save-date</str>\n<str>2008-11-13T13:35:51Z</str>\n….\n</arr>\n\
  <str name=\"id\">solr_word</str>\n<arr name=\"attr_meta_save_date\">\n<str>2008-11-13T13:35:51Z</str>\n\
  </arr>\n<arr name=\"attr_dc_subject\">\n<str>solr, word, pdf</str>\n</arr>\n<str\
  \ name=\"subject\">solr word</str>\n…\n<arr name=\"content_type\">\n<str>application/pdf</str>\n\
  </arr>\n<arr name=\"content\">\n<str>…</str>\n</arr>\n<long name=\"_version_\">1524766191217803264</long>\n\
  </doc>\n```\n\n## 通过编程方式访问 SOLR\n\nSolrJ 是一个通过 API 调用访问 Solr 的 Java 客户端。SolrJ 使用了几个\
  \ JAR 包。在 Solr 的安装目录下，你可以在 `dist` 目录下找到 `solr-solrj-5.4.0.jar`，并在 `dist/solrj-lib`\
  \ 目录下找到几个 JAR 包。SolrJ 的 API 文档，你可以在 `docs/solr-solrj` 下找到。\n\n## 更新数据\n\n以下使用 SolrJ\
  \ API 在 Solr 服务器中更新数据的基本步骤：**步骤 1**\n\n### 步骤 1\n\n要连接到 Solr 服务器，你需要使用 `HttpSolrClient`\
  \ 类构造一个 `SolrClient` 对象。Solr 服务器的基础 URL URL 在构造函数中指定。基础 URL 包含 Solr Core 的路径，不包含请求处理器的路径。\n\
  \n你稍后会指定。`HttpSolrClient` 类允许设置连接属性，例如 `max retries` 或连接超时。由于 `HttpSolrClient` 类是线程安全的，你只需要为每个\
  \ Solr 服务器创建一个（静态）实例，并在所有请求中复用它。\n\n### 步骤 2\n\n下一步是创建用于提交的文档。你可以使用 `SolrInputDocument`\
  \ 类来创建 Solr 文档。文档字段使用 `addField(String name, Object value)` 方法定义。字段名和值的数据类型应与 `schema.xml`\
  \ 中定义的匹配。\n\n### 步骤 3\n\n要创建一个更新请求，你可以使用 `UpdateRequest` 类。在这里，你可以指定更新请求处理器的路径。你可以使用\
  \ `setAction(AbstractUpdateRequest.ACTION action, boolean waitFlush, boolean waitSearcher)`\
  \ 方法为给的操作（commit 或 optimize）设置参数，并使用 `add(SolrInputDocument doc)` 方法添加要提交的文档。最后，你使用\
  \ `process(SolrClient client)` 方法将文档提交到 Solr 服务器，并获取 `UpdateResponse` 对象作为返回值。如果你有任何额外的请求参数，可以使用\
  \ `setParam(String param, String value)` 或 `setParams(ModifiableSolrParams params)`\
  \ 方法。\n\n在下面的示例中，创建了两个文档并提交到 Solr 服务器：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Collection;\nimport java.io.IOException;\nimport org.solr.common.SolrInputDocument;\n\
  import org.solr.client.solrj.SolrClient;\nimport org.solr.client.solrj.SolrServerException;\n\
  import org.solr.client.solrj.impl.HttpSolrClient;\nimport org.solr.client.solrj.request.AbstractUpdateRequest;\n\
  import org.solr.client.solrj.request.UpdateRequest;\nimport org.solr.client.solrj.response.UpdateResponse;\n\
  \n public class SolrPostDocExample {\n\n    public static void main(String[] args)\
  \ {\n        try {\n            SolrPostDocExample example = new SolrPostDocExample();\n\
  \            String coreUrl = “http://localhost:8983/solr/sample_core”;\n      \
  \      HttpSolrClient client = new HttpSolrClient(coreUrl);\n            // connection\
  \ timeout 定义建立连接的时间\n            client.setConnectionTimeout(20000);\n         \
  \   // socket timeout 定义等待响应的时间\n            client.setSoTimeout(10000);\n     \
  \       example.postDocuments(client);\n        } catch(Exception ex) {\n      \
  \      System.out.println(ex);\n        }\n    }\n\n    public void postDocuments(SolrClient\
  \ client)\n    throws IOException, SolrServerException {\n        // 构造文档\n    \
  \    SolrInputDocument doc1 = new SolrInputDocument();\n        doc1.addField(“id”,\
  \ “1001”);\n        doc1.addField(“name”, “Kindle Fire”);\n        doc1.addField(“price”,\
  \ 270);\n        doc1.addField(“cat”, “Electronics”);\n\n        SolrInputDocument\
  \ doc2 = new SolrInputDocument();\n        doc2.addField(“id”, “1002”);\n      \
  \  doc2.addField(“name”, “ASUS VivoBook”);\n        doc2.addField(“price”, 485);\n\
  \        doc2.addField(“cat”, “Laptop”);\n\n        Collection<SolrInputDocument>\
  \ docs = new ArrayList<>();\n        docs.add(doc1);\n        docs.add(doc2);\n\n\
  \        // 提交并接收响应\n        UpdateRequest req = new UpdateRequest(“update”);\n\
  \        req.setAction(AbstractUpdateRequest.ACTION.COMMIT, false, false);\n   \
  \     UpdateResponse rsp = req.process(client);\n        System.out.println(rsp);\n\
  \    }\n}\n```\n\n\n\n\n\n`SolrDocument{name=Canon PowerShot SD500, price=329.95}`\n\
  \n### 字段分面 (Field faceting)\n\n```java\npublic void fieldFacets(SolrClient client)\n\
  throws IOException, SolrServerException {\n    SolrQuery query = new SolrQuery();\n\
  \    query.setQuery(\"*:*\");\n    query.setRows(0);\n    query.setFacet(true);\n\
  \    query.addFacetField(\"cat\", \"inStock\");\n    QueryResponse rsp = client.query(query);\n\
  \    SolrDocumentList docList = rsp.getResults();\n    System.out.println(\"# of\
  \ documents: \" + docList.getNumFound()); \n    List<FacetField> facetFields = rsp.getFacetFields();\n\
  \    for(FacetField facetField : facetFields) {\n        System.out.println(facetField);\n\
  \    }\n}\n```\n\n以下是响应：\n文档数量: 34\n\n`cat:[electronics (12), currency (4), memory\
  \ (3), connector (2), graphics card (2), hard drive (2), search (2), software (2),\
  \ camera (1), copier (1), electronics and computer1 (1), electronics and stuff2\
  \ (1), multifunction printer (1), music (1), printer (1), scanner (1)]`\n\n`inStock:[true\
  \ (17), false (4)]`\n\n### 结果分组 (Result grouping)\n\n```java\npublic void groupedByField(SolrClient\
  \ client)\nthrows IOException, SolrServerException {\n    SolrQuery query = new\
  \ SolrQuery();\n    query.setQuery(\"inStock:[* TO *]\");\n    query.addFacetField(\"\
  name\", \"inStock\");\n    query.add(\"group\", \"true\");\n    query.add(\"group.ngroups\"\
  , \"true\");\n    query.add(\"group.field\", \"inStock\");\n    QueryResponse rsp\
  \ = client.query(query);\n    List<GroupCommand> groupCommandList = rsp.getGroupResponse().getValues();\
  \ \n    for(GroupCommand groupCommand : groupCommandList) {\n        System.out.println(\"\
  Grouped by: \" + groupCommand.getName() + \", # of groups: \" + groupCommand.getNGroups());\n\
  \        List<Group> groups = groupCommand.getValues();\n        for(Group group\
  \ : groups) {\n            SolrDocumentList docList = group.getResult();\n     \
  \       System.out.println(\"Group: \" + group.getGroupValue() + \", # of documents:\
  \ \" + docList.getNumFound());\n            for(SolrDocument doc : docList) {\n\
  \                System.out.println(doc);\n            }\n        }\n    }\n}\n\
  ```\n\n以下是响应：\n分组依据：inStock, 分组数量: 2\n\n分组: true, 文档数量: 17\n`SolrDocument{id=GB18030TEST,\
  \ name=Test with some GB18030 encoded characters, features=[No accents here, ? 是一\
  \ ? 功能 , This is a feature (translated), ? 份文件是很有光 ?, This document is very shiny\
  \ (translated)], price=0.0, price_c=0.0,USD, inStock=true, _version_=1524195539913015296}`\n\
  \n分组: false, 文档数量: 4\n\n`SolrDocument{id=F8V7067-APL-KIT, name=Belkin Mobile Power\
  \ Cord for iPod w/ Dock, manu=Belkin, manu_id_s=belkin, cat=[electronics, connector],\
  \ features=[car power adapter, white], weight=4.0, price=19.95, price_c=19.95,USD,\
  \ popularity=1, inStock=false, store=45.18014,-93.87741, manufacturedate_dt=Mon\
  \ Aug 01 12:30:25 EDT 2005, _version_=1524195540386971648}`\n\n## Apache James\n\
  \nApache James (Java Apache 企业级邮件服务器) 是 Apache James 项目的一部分。James Server 是一个基于 Java\
  \ 的邮件服务器（技术上讲是一个邮件传输代理 MTA），支持 SMTP 和 POP3 协议。此外，它还可以 NNTP 新闻服务器。James Server 的特殊之处在于它提供了一个\
  \ mailet 容器（mailet container）。\n\n就像 servlet 用于处理 servlet 容器的 HTTP 请求一样，mailets\
  \ 则用于处理 mailet 容器的邮件。通过配置，你可以使用 mailets 执行复杂的邮件处理任务。这正是 James Server 灵活且强大之处所在。James\
  \ Server 提供了一些标准的 mailets。此外，你还可以使用 Apache James 项目一部分的 `Mailet API` 构建自己的 mailets。这允许你开发并部署自定义应用程序到\
  \ James Server 上进行邮件处理。\n\n对于 James Server，在本文时当前的稳定版本为 2.3.2（目前有 3.0 beta 版本，但仍不稳定）。你可以从\
