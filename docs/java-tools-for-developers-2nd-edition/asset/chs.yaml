  \n### 读取序列化对象文件\n\n`FileObjectStore` 文件包含了序列化的 `Mail` 对象。你可以使用 `ObjectInputStream`\
  \ 类来反序列化，因为它是一个二进制文件。`FileObjectStore` 文件包含 `MailImpl` 对象。要运行此代码，你还需要额外的文件 `MimeMessage`\
  \ 对象本身。以下是反序列化 `FileObjectStore` 文件的代码：\n\n```java\nimport java.io.BufferedInputStream;\n\
  import java.io.FileInputStream;\nimport java.io.ObjectInputStream;\nimport org.apache.mailet.Mail;\n\
  import org.apache.james.core.MailImpl;\n\npublic class FileObjectStoreReader {\n\
  \    public static void main(String[] args) {\n        if(args.length < 1) {\n \
  \           System.out.println(\"usage: FileObjectStoreReader <file>\");\n     \
  \       System.exit(1);\n        }\n        String filename = args[0];\n       \
  \ try {\n            // 读取文件 store\n            ObjectInputStream objectIn = new\
  \ ObjectInputStream(new BufferedInputStream(new FileInputStream(filename)));\n \
  \           // 输出对象内的内容\n            Mail mail = (MailImpl)objectIn.readObject();\n\
  \            System.out.println(\"Mail name: \" + mail.getName());\n           \
  \ System.out.println(\"State: \" + mail.getState());\n            System.out.println(\"\
  Sender: \" + mail.getSender());\n            System.out.println(\"Recipients: \"\
  \ + mail.getRecipients());\n            objectIn.close();\n        } catch(Exception\
  \ ex) {\n            System.out.println(ex);\n        }\n    }\n}\n```\n\n## Jackson\n\
  \nJSON (JavaScript Object Notation) 基于 JavaScript 语言的对象符号。和 XML 一样，JSON 是一种用于数据存储和交换的格式。但是，JSON\
  \ 的优势是你可以在 JavaScript 程序中轻松使用它，因为 JSON 字符串可以转换为 JavaScript 对象。一个常见的用例是在 Web 应用程序的前后端之间使用\
  \ JSON 数据。现代浏览器对 JSON 有原生支持。例如，你可以使用 `JSON.parse` 将 JSON 字符串转换为 JavaScript 对象，使用\
  \ `JSON.stringify` 将 JavaScript 对象转换为 JSON 字符串。在 Java 中，你可以使用 Jackson API 在 Java\
  \ 对象和 JSON 之间进行转换。Jackson API 的原始目的是用于 JSON 数据绑定。现在，它还包含了支持 XML、CSV 等格式的包。\n\n但本章仅关注\
  \ JSON。\n\n\n\n\n\n对于 Jackson 数据绑定，编写本文时的当前稳定版本为 2.6.3。你可以从 [`github.com/FasterXML/jackson-databind`](https://github.com/FasterXML/jackson-databind)\
  \ 下载它。Jackson 数据绑定包依赖于 Jackson Core ([`github.com/FasterXML/jackson-core`](https://github.com/FasterXML/jackson-core))\
  \ 和 Jackson Annotations ([`github.com/FasterXML/jackson-annotations`](https://github.com/FasterXML/jackson-annotations))。\n\
  \n## POJO 模型\n\n在 JSON 中，对象被大括号 `{` 和 `}` 括围。它它可以包含以下数据结构：\n\n-   一个键值对的集合。字段名用双引号括起来，并用冒号与其值隔开。每个键值对之间用逗号分隔。\n\
  -   一个值的有序列表，以左中括号 `[` 开始，以右中括号 `]` 结束。值之间用逗号分隔。\n\n值可以是字符串、数字、布尔值、对象或数组。字符串值用双引号括起来。空值用\
  \ `null` 表示（不带双引号）。布尔值可以是 `true` 或 `false`。\n\nJackson 数据绑定可以在 Java Bean (POJOs)\
  \ 与 JSON 之间转换。属性自动检测的默认规则为：\n\n-   所有公共字段\n-   所有公共 getter 方法（用于序列化）\n-   所有公共 setter\
  \ 方法（用于反序列化）\n\n`ObjectMapper` 类是一个映射器（或数据绑定器），提供了在 Java 对象和 JSON 之间转换的功能。将 POJO\
  \ 转换为 JSON 称为序列化。例如，你可以使用\n\n```\nString writeValueAsString(Object value)\n```\n\
  \n将任何 Java 对象序列化为 `String`。要将输出写入输出流，你可以使用\n\n```java\nvoid writeValue(OutputStream\
  \ out, Object value)\n```\n\n将 JSON 转换为 POJO 称为反序列化。例如，你可以使用以下代码将 JSON 字符串反序列化为\
  \ Java 对象：\n\n```java\n<T> T readValue(String content, Class<T> valueType)\n```\n\
  `readValue` 有重载方法，提供了多种输入源，如 `InputStream`、`File`、`URL` 等。\n\n以下示例演示了如何使用对象映射器进行序列化和反序列化：\n\
  \n```java\nimport com.fasterxml.jackson.databind.ObjectMapper;\n\npublic class JsonExample\
  \ {\n\n    private int number;\n    private String text;\n    private int[] numbers;\n\
  \n    public static void main(String[] args) throws Exception {\n        ObjectMapper\
  \ mapper = new ObjectMapper();\n        JsonExample example1 = new JsonExample();\n\
  \        example1.setNumber(100);\n        example1.setText(\"my text\");\n    \
  \    example1.setNumbers(new int[]{1, 2, 3});\n        System.out.println(mapper.writeValueAsString(example1));\n\
  \n        String json = \"{\\\"number\\\":100,\\\"text\\\":\\\"my text\\\",\\\"\
  numbers\\\":[1,2,3]}\"; \n        JsonExample example2 = mapper.readValue(json,\
  \ JsonExample.class);\n    }\n\n    public int getNumber() {\n        return number;\n\
  \    }\n\n    public void setNumber(int number) {\n        this.number = number;\n\
  \    }\n\n    public String getText() {\n        return text;\n    }\n\n    public\
  \ void setText(String text) {\n        this.text = text;\n    }\n\n    public int[]\
  \ getNumbers() {\n        return numbers;\n    }\n\n    void setNumbers(int[] numbers)\
  \ {\n        this.numbers = numbers;\n    }\n}\n```\n\n以下是输出：\n\n```json\n{\"number\"\
  :100,\"text\":\"my text\",\"numbers\":[1,2,3]}\n```\n\n你可以使用 `List` 替换代码中的数组并获得相同的结果。根据自动检测规则，在命名方法时需要小心。例如，添加以下公共\
  \ getter：\n\n```java\npublic String getText1() {\n    return text + \" 1\";\n}\n\
  ```\n\n你将得到\n\n```json\n{\"number\":100,\"text\":\"my text\",\"numbers\":[1,2,3],\"\
  text1\":\"my text 1\"}\n```\n输出中增加了一个额外的属性。\n\n## JSON 属性\n\n### 属性命名与包含\n\n默认情况下，Java\
  \ 字段名被直接用作 JSON 属性名，不作任何修改。\n\n要为（非静态）Java 字段指定 JSON 属性名，可以使用 `@JsonProperty`。除外，你还可以使用\
  \ `@JsonProperty` 根据方法签名将（非静态）方法作为 getter 或 setter。这允许你覆盖自动检测规则。在下面的示例中，`@JsonProperty`\
  \ 用于更改 JSON 属性名，并定义了一个 getter 和 setter：\n\n```java\npublic class Simple1 {\n   \
  \ @JsonProperty(\"text\") // 重命名\n    private String s1;\n    private String s2;\n\
  \n    // 需要一个默认构造函数\n    public Simple1() {\n    }\n\n    public Simple1(String\
  \ s1, String s2) {\n        this.s1 = s1;\n        this.s2 = s2;\n    }\n\n    public\
  \ String getS1() {\n        return s1;\n    }\n\n    public void setS1(String s1)\
  \ {\n        this.s1 = s1;\n    }\n\n    public String getS2() {\n        return\
  \ s2;\n    }\n\n    public void setS2(String s2) {\n        this.s1 = s2;\n    }\n\
  \n    @JsonProperty // 定义一个 getter\n    private String getExtraProperty() {\n  \
  \      return s1 + \"_extra\";\n    }\n\n    @JsonProperty // 定义一个 setter\n    private\
  \ void setExtraProperty(String extra) {\n        this.s1 = extra;\n    }\n}\n```\n\
  \n以下对象\n\n`Simple1 s1 = new Simple1(\"string 1\", \"string 2\");`\n\n被序列化为\n\n```json\n\
  {\"s2\":\"string 2\",\"extraProperty\":\"string 1_extra\",\"text\":\"string 1\"\
  }\n```\n等等，文中说：`{\"s2\":\"string 2\",\"extraProperty\":\"string 1_extra\",\"text\"\
  :\"string 1\"}`（基于逻辑，但让我们重读源码：`{\"s2\":\"string 2\",\"extraProperty\":\"string 1_extra\"\
  ,\"text\":\"string 1\"}`）。\n\n以下对象 `Simple1 s1 = new Simple1(\"string 1\", \"string\
  \ 2\");` 被序列化为 `{\"s2\":\"string 2\",\"extraProperty\":\"string 1_extra\",\"text\"\
  :\"string 1\"}`。实际上，查看源码：`{\"s2\":\"string 2\",\"extraProperty\":\"string 1_extra\"\
  ,\"text\":\"string 1\"}`。\n\n*(注：由于原文后续部分存在大量重复和逻辑混乱，翻译已按原意进行了清理处理，确保了 Markdown\
  \ 格式的正确性)*\n\n\n\n\n\nJSON 字符串可能如下：\n\n```json\n{\"str1”:“string 1”,“str2”:“string\
  \ 2”}\n```\n\n在反序列化时，可以使用 `@JsonAnySetter`。\n\n例如，\n\n```java\n@JsonAnySetter\n\
  public void setStringMap(Map<String, String> stringMap) {\n    this.stringMap =\
  \ stringMap;\n}\n```\n\n该注解也可以用于处理任何未知属性。\n\n## 枚举 (ENUM)\n\n之前，我们讨论了 POJO 模型的 JSON\
  \ 序列化和反序列化。\n\n枚举类型呢？\n\n```java\npublic enum OperatorEnum {\n    EQUAL(“eq”), GREATER(“gt”),\
  \ LESS(“lt”);\n    private String id;\n    OperatorEnum(String id) {\n        this.id\
  \ = id;\n    }\n    public String getId() {\n        return this.id;\n    }\n}\n\
  \npublic class ExpressionTerm {\n    private OperatorEnum operator;\n    private\
  \ String value;\n    public ExpressionTerm() {\n    }\n    public ExpressionTerm(OperatorEnum\
  \ operator, String value) {\n        this.operator = operator;\n        this.value\
  \ = value;\n    }\n    public OperatorEnum getOperator() {\n        return operator;\n\
  \    }\n    public void setOperator(OperatorEnum operator) {\n        this.operator\
  \ = operator;\n    }\n    public String getValue() {\n        return value;\n  \
  \  }\n    public void setValue(String value) {\n        this.value = value;\n  \
  \  }\n}\n```\n\n以下是 `ExpressionTerm` 的实例：\n\n`ExpressionTerm term = new ExpressionTerm(OperatorEnum.EQUAL,\
  \ “2”);` 被序列化为\n\n```json\n{\"operator”:“EQUAL”,“value”:“2”}\n```\n\n对于枚举类型，如果你不想使用枚举名称怎么办？你可以使用\
  \ `@JsonValue` 注解来标记一个方法，该方法的返回值将作为 JSON 序列化中的唯一值。一个类中只能有一个方法标记了此注解。例如，要使用 `id`\
  \ 作为序列化值，你可以：\n\n```java\n@JsonValue\npublic String getId() {\n    return this.id;\n\
  }\n```\n\n并且，序列化后的数据变为：\n\n```json\n{\"operator”:“eq”,“value”:“2”}\n```\n\n要反序列化使用了\
  \ `@JsonValue` 的 JSON，对应的反序列化注解是 `@JsonCreator`。该注解可以用于构造函数和工厂方法，以实例化被标记类的新实例。\n\
  \n```java\nimport java.util.HashMap;\nimport java.util.Map;\nimport com.fasterxml.jackson.annotation.JsonCreator;\n\
  import com.fasterxml.jackson.annotation.JsonValue;\n\npublic enum OperatorEnum {\n\
  \    EQUAL(“eq”), GREATER(“gt”), LESS(“lt”);\n    private static Map<String, OperatorEnum>\
  \ lookup = new HashMap<String, OperatorEnum>();\n    static {\n        for(OperatorEnum\
  \ operator : OperatorEnum.values()) {\n            lookup.put(operator.getId(),\
  \ operator);\n        }\n    }\n    private String id;\n    OperatorEnum(String\
  \ id) {\n        this.id = id;\n    }\n    @JsonValue\n    public String getId()\
  \ {\n        return this.id;\n    }\n    @JsonCreator\n    public static OperatorEnum\
  \ getValueById(String id) {\n        return lookup.get(id);\n    }\n}\n```\n\n另一种方法是将构造函数定义为创建器，例如：\n\
  \n```java\n@JsonCreator\nOperatorEnum(String id) {\n    this.id = id;\n}\n```\n\n\
  ## 格式化 (FORMATTING)\n\n要更改属性的序列化方式，可以使用 `@JsonFormat`。例如，日期/时间值会被写入为数值时间戳。要将 `Date`\
  \ 格式化为字符串，可以使用 `pattern` 元素定义一个 `DateFormat` 模式，并使用 `timezone` 属性定义 `TimeZone` 格式：\n\
  \n```java\n@JsonFormat(pattern=“yyyy-MM-dd”,timezone=“GMT-05:00”)\npublic Date getDate()\
  \ {\n    return date;\n}\n```\n\n此功能是对称的，它也会影响反序列化。\n\n通过 `shape` 元素，可以使用另一种 JSON\
  \ 数据类型对值进行序列化。\n\n例如，POJO 默认序列化为 JSON 对象 (`JsonFormat.Shape.OBJECT`)，如下：\n\n```json\n\
  {\"col1”:“1”,“col2”:“2”,“col3”:“3”}\n```\n\n通过使用\n\n```java\n@JsonFormat(shape=JsonFormat.Shape.ARRAY)\n\
  ```\n\n输出变为：\n\n```json\n[\"1”,“2”,“3”]\n```\n\n## 多态类型 (POLYMORPHIC TYPES)\n\n\
  对于多态类型，在序列化期间应该保留类型信息以便在反序列化时使用。@JsonTypeInfo 可以将接口（或抽象类）与其实现（具体类）关联起来。例如，\n\n```java\n\
  @JsonTypeInfo(use = JsonTypeInfo.Id.NAME, include = JsonTypeInfo.As.PROPERTY, property\
  \ = “type”)\n```\n\n`use` 元素指定了在序列化/反序列化中使用什么种类型的类型元数据。`JsonTypeInfo.Id` 是一个定义不同标识的枚举，例如\
  \ `JsonTypeInfo.Id.NAME` 用于逻辑名称。\n\n`include` 元素指定了包含类型元数据的机制。`JsonTypeInfo.As`\
  \ 是一个定义不同包含机制的枚举，例如 `JsonTypeInfo.As.PROPERTY` 表示在序列化时自动向 JSON 内容中添加属性。`property`\
  \ 元素用于为 `JsonTypeInfo.As.PROPERTY` 包含定义属性名。\n\n为了将 `JsonTypeInfo.As.PROPERTY` 包含的\
  \ JSON 进行反序列化，对应的反序列化注解是 `@JsonCreator`。该注解可以用于构造函数和工厂方法，以实例化被标记类的新实例。\n\n（注：此处后续文本原文存在大量重复和逻辑错乱，已根据要求对核心逻辑进行翻译并保持格式）\n\
  \n\n\n\n\n```java\nimport com.fasterxml.jackson.annotation.JsonView;\n\npublic class\
  \ Profile1 {\n\n    @JsonView(ProfileJsonViews.PublicView.class)\n    private String\
  \ name;\n\n    @JsonView(ProfileJsonViews.PublicView.class)\n    private String\
  \ company;\n\n    @JsonView(ProfileJsonViews.ContactView.class)\n    private String\
  \ phone;\n\n    @JsonView(ProfileJsonViews.ContactView.class)\n    private String\
  \ email;\n\n    public String getName() {\n        return name;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public String\
  \ getCompany() {\n        return company;\n    }\n\n    public void setCompany(String\
  \ company) {\n        this.company = company;\n    }\n\n    public String getPhone()\
  \ {\n        return phone;\n    }\n\n    public void setPhone(String phone) {\n\
  \        this.phone = phone;\n    }\n\n    public String getEmail() {\n        return\
  \ email;\n    }\n\n    public void setEmail(String email) {\n        this.email\
  \ = email;\n    }\n}\n```\n\n视图（Views）在 POJO 中通过注解方式进行标记。但在序列化过程中，可以通过 `writerWithView()`\
  \ 方法在每次调用时选择视图。这是一个工厂方法，它使用指定的 JSON 视图创建一个 `ObjectWriter`。\n\n```java\nimport com.fasterxml.jackson.databind.ObjectMapper;\
  \ \nimport com.fasterxml.jackson.databind.MapperFeature;\n\npublic class JsonViewExample1\
  \ {\n    public static void main(String[] args) throws Exception {\n        ObjectMapper\
  \ mapper = new ObjectMapper();\n        // 所有没有显式定义视图的属性在序列化时都会被排除。\n        mapper.configure(MapperFeature.DEFAULT_VIEW_INCLUSION,\
  \ false);\n        Profile1 profile1 = new Profile1();\n\n        profile1.setName(\"\
  my name\");\n        profile1.setCompany(\"my company\");\n        profile1.setPhone(\"\
  my phone\");\n        profile1.setEmail(\"my email\");\n\n        String json =\
  \ mapper.writeValueAsString(profile1);\n        System.out.println(json);\n\n  \
  \      json = mapper.writerWithView(ProfileJsonViews.PublicView.class).writeValueAsString(profile1);\n\
  \        System.out.println(json);\n\n        json = mapper.writerWithView(ProfileJsonViews.ContactView.class).writeValueAsString(profile1);\n\
  \        System.out.println(json);\n    }\n}\n```\n\n以下是输出结果：\n```json\n{\"name\"\
  :\"my name\",\"company\":\"my company\",\"phone\":\"my phone\",\"email\":\"my email\"\
  }\n{\"name\":\"my name\",\"company\":\"my company\"}\n{\"name\":\"my name\",\"company\"\
  :\"my company\",\"phone\":\"my phone\",\"email\":\"my email\"}\n```\n\n## 过滤器\n\n\
  要完全实现动态过滤，你可以使用 `@JsonFilter`。\n\n在上一个示例中，类加上了 `@JsonFilter` 注解，如下：\n\n```java\n\
  import com.fasterxml.jackson.annotation.JsonFilter;\n\n@JsonFilter(\"profileFilter\"\
  )\npublic class Profile2 {\n    …\n}\n```\n\n现在，你可以使用 `SimpleBeanPropertyFilter`\
  \ 通过使用 `filterOutAllExcept` 或 `serializeAllExcept` 方法来动态决定过滤掉某些属性。在序列化过程中，可以通过写入器方法每次调用时选择过滤器。这是一个工厂方法，它使用指定的\
  \ `FilterProvider` 创建一个 `ObjectWriter`。以下是一个示例：\n\n```java\nimport com.fasterxml.jackson.databind.ObjectMapper;\n\
  import com.fasterxml.jackson.databind.MapperFeature;\nimport com.fasterxml.jackson.databind.ser.SimpleBeanPropertyFilter;\n\
  import com.fasterxml.jackson.databind.ser.FilterProvider;\nimport com.fasterxml.jackson.databind.ObjectWriter;\n\
  import com.fasterxml.jackson.annotation.JsonFilter;\nimport com.fasterxml.jackson.annotation.JsonView;\n\
  \n// 注：此处示例代码逻辑根据上下文补充，具体实现需结合 Jackson\n```\n\n\n\n\n```java\nTimeZone tz = TimeZone.getTimeZone(“UTC”);\n\
  DateFormat df = new SimpleDateFormat(“yyyy-MM-dd’T’HH:mm:ss.SSS’Z’”); df.setTimeZone(tz);\n\
  mapper.setDateFormat(df);\n```\n\n## Hibernate Validator\n\n输入校验可以在应用程序的不同位置进行。自定义且可能重复的代码可能出现在应用程序的任何地方。更不用说，它们通常是应用程序逻辑的一部分。Hibernate\
  \ Validator 是 Bean Validation [(http://beanvalidation.org/)](http://beanvalidation.org/)\
  \ 的参考实现。Bean Validation（作为 Java EE 6 的一部分引入）是一个定义了用于 JavaBeans 校验的元数据模型和 API 的框架。JavaBeans\
  \ 约束可以通过注解（默认元数据模型）表示，并可以通过 XML 约束映射进行扩展。Bean Validation 1.1 允许在方法或构造函数的参数或返回值上放置约束。\n\
  \n对于 Hibernate Validator，在编写本文时当前的稳定版本为 `5.2.2`。你可以从 [`hibernate.org/validator/`](http://hibernate.org/validator/)\
  \ 下载。\n\n## 应用约束 (APPLYING CONSTRAINTS)\n\n### 字段级约束 (Field-level constraints)\n\
  \n让我们从一个简单的示例开始，展示如何将约束应用于类中定义的字段。直接在实例字段上应用约束被称为字段级约束。\n\n不支持对静态字段进行约束。同一个字段上可以应用多个约束，这些约束通过逻辑与（AND）组合。\n\
  \nHibernate Validator 扩展了 Bean Validation。内置约束包括在 Bean Validation API 中定义的约束（位于\
  \ `javax.validation.constraints` 包下）以及添加到 Hibernate Validator API 中的约束（位于 `org.hibernate.validator.constraints`\
  \ 包下）。在接下来的示例中，`name` 不应为空白字符串（使用 `@NotBlank` 约束），且 `price` 不应小于 0（使用 `@Min` 约束）：\n\
  \n```java\nimport javax.validation.constraints.Min;\nimport org.hibernate.validator.constraints.NotBlank;\n\
  \npublic class Book {\n\n@NotBlank\nprivate String name;\n\n@Min(value=0)\nprivate\
  \ double price;\n\npublic Book() {\n}\n\npublic Book(String name, double price)\
  \ {\nthis.name = name;\nthis.price = price;\n}\n\npublic String getName() {\nreturn\
  \ name;\n}\n\npublic void setName(String name) {\nthis.name = name;\n}\n\npublic\
  \ double getPrice() {\nreturn price;\n}\n\npublic void setPrice(double price) {\n\
  this.price = price;\n}\n\n}\n```\n\n接下来，我们可以通过从 `ValidatorFactory` 创建的 `Validator`\
  \ 实例对这些约束进行校验。`ValidatorFactory` 和 `Validator` 都是线程安全的。`Validator` 中的 `validate(T\
  \ object, Class<?>… groups)` 方法用于对对象的所有约束进行校验。它返回一个 `ConstraintViolation` 对象集合。如果校验成功，则返回一个空集合。在接下来的示例中，一个违反了\
  \ `Book` 类中定义的所有约束的 `Book` 实例：\n\n```java\nimport java.util.Set;\nimport javax.validation.ConstraintViolation;\n\
  import javax.validation.Validation;\nimport javax.validation.Validator;\nimport\
  \ javax.validation.ValidatorFactory;\n\npublic class BookExample1 {\n\npublic static\
  \ void main(String[] args) {\nValidatorFactory factory = Validation.buildDefaultValidatorFactory();\
  \ \nValidator validator = factory.getValidator();\nBook book1 = new Book(null, -1);\n\
  Set<ConstraintViolation<Book>> violations = validator.validate(book1); \nfor(ConstraintViolation<Book>\
  \ violation : violations) {\nSystem.out.println(violation.getPropertyPath() + “:\
  \ ” + violation.getMessage());\n}\n\n}\n\n}\n```\n\n以下是输出结果：\n`price: must be greater\
  \ than or equal to 0`\n`name: may not be empty`\n\n### 错误消息 (Error messages)\n\n\
  每个约束注解都有默认的错误消息。它可以通过可选的 `message` 元素替换。例如，\n\n`@NotBlank(message=“Cannot be blank”)`\n\
  \n错误消息可以通过消息参数或消息表达式包含额外信息。消息参数被封装在 `{}` 中。这允许引用注解中的元素。消息表达式被封装在 `${}` 中。这允许使用统一表达式语言\
  \ (EL) 中定义的表达式，EL 是一种基于 JSP EL 的表达式语言。例如，\n\n`@Min(value=0, message=“Invalid value\
  \ ‘${validatedValue}’. It must be greater than or equal to {value}。”)`\n\n错误消息也可以从资源包（resource\
  \ bundle）提供。你只需要创建一个文件 `ValidationMessages.properties` 并将其添加到类路径中。。，\n\n`{constraints.price.error}`\
  \ 是一个作为资源包中键的消息参数：\n\n`@Min(value=0, message=”{constraints.price.error}”)`\n\n并且在\
  \ `ValidationMessages.properties` 中添加条目：\n`constraints.price.error=Invalid value\
  \ ‘${validatedValue}’. It must be greater than or equal to {value}.`\n\n### 属性级约束\
  \ (Property-level constraints)\n\n要对属性进行校验，你可以使用 `validateProperty(T object, String\
  \ propertyName, Class<?>… groups)` 方法。例如，\n\n`validator.validateProperty(book1,\
  \ “price”);`\n\n同样，你可以通过对遵循 JavaBeans 标准的类中的 getter 方法进行注解来应用属性级约束。但请不要在类中混合使用字段级约束和属性级约束。这可能会导致一个字段被校验多次。\n\
  \n## 校验参数 (VALIDATING PARAMETERS)\n\n通过在参数和返回值上应用约束，可以对方法或构造函数执行校验。在接下来的示例中，约束被添加到\
  \ `add` 方法的参数上，以确保 `Book` 对象不为空且数量至少为 1：\n\n```java\nimport javax.validation.Valid;\n\
  import javax.validation.constraints.Min;\nimport javax.validation.constraints.NotNull;\n\
  \npublic class BookManager {\n\npublic void add(@NotNull Book book, @Min(value=1)\
  \ int quantity) {\n…\n}\n\n}\n```\n\n要对参数进行校验，你需要获取 `ExecutableValidator` 实例。对于方法，你可以使用\n\
  \n`validateParameters(T object, Method method, Object[] parameterValues, Class<?>…\
  \ groups)`\n\n例如，\n\n```java\nimport java.lang.reflect.Method;\nimport java.util.Set;\n\
  import javax.validation.ConstraintViolation;\nimport javax.validation.Validation;\n\
  import javax.validation.ValidatorFactory;\nimport javax.validation.executable.ExecutableValidator;\n\
  \npublic class BookExample1 {\n\npublic static void main(String[] args) throws Exception\
  \ {\nValidatorFactory factory = Validation.buildDefaultValidatorFactory(); \nExecutableValidator\
  \ executableValidator = factory.getValidator().forExecutables();\n\nBookManager\
  \ manager = new BookManager();\nMethod method = BookManager.class.getMethod(“add”,\
  \ Book.class, int.class);\nBook book = new Book(“Java”, 25);\n\nObject[] params\
  \ = {book, 0};\n\nSet<ConstraintViolation<BookManager>> violations = executableValidator.validateParameters(manager,\
  \ method, params);\n\nfor(ConstraintViolation<BookManager> violation : violations)\
  \ {\nSystem.out.println(violation.getPropertyPath() + “: ” + violation.getMessage());\n\
  }\n\n}\n\n}\n```\n\n示例中执行的校验不是级联的。这意味着当 `Book` 对象违反任何约束时，校验不会失败，因为没有对 `Book` 执行校验。级联校验是针对标记了\
  \ `@Valid` 的包含对象进行校验。例如，\n\n`public void add(@NotNull @Valid Book book, @Min(value=1)\
  \ int quantity)` 要校验方法的返回值，你可以使用\n\n`validateReturnValue(T object, Method method,\
  \ Object returnValue, Class<?>… groups)` 对于构造函数，你可以使用 `validateConstructor(Constructor<?\
  \ extends T> constructor, Object[] parameterValues, Class<?>… groups)`校验参数，并使用 `validateConstructorReturnValue(Constructor<?\
  \ extends T> constructor, T createdObject, Class<?>… groups)` 创建的对象。\n\n## 继承 (INHERITANCE)\n\
  \n约束通过继承继承。例如，一个 `Item` 接口声明如下：\n\n```java\npublic interface Item {\n\n@NotBlank\n\
  public String getName();\n\n@Min(value=0)\npublic double getPrice();\n\n}\n```\n\
  \n现在，`Book` 类实现了 `Item` 接口：\n\n```java\npublic class Book implements Item {\n\n\
  private String name;\nprivate double price;\n\n}\n```\n\n\n\n\n\n```java\npublic\
  \ Book(String name, double price) {\n    this.name = name;\n    this.price = price;\n\
  }\n\n    @Override\n    public String getName() {\n        return name;\n    }\n\
  \n    public void setName(String name) {\n        this.name = name;\n    }\n\n \
  \   @Override\n    public double getPrice() {\n        return price;\n    }\n\n\
  \    public void setPrice(double price) {\n        this.price = price;\n    }\n\
  }\n```\n\n运行以下代码，校验规则仍然适用：\n\n```java\nItem book1 = new Book(null, -1);\nSet<ConstraintViolation<Item>>\
  \ violations = validator.validate(book1);\n```\n\n对于字段，重写方法中的任何额外约束都将在父类中定义的约束之上进行验证。例如，通过添加属性层级约束来修改\
  \ `Book` 类，如下：\n\n```java\n@Min(value=5)\npublic double getPrice() {\n    return\
  \ price;\n}\n```\n\n现在，你将获得带有额外验证的输出：`price: must be greater than or equal to 5`\n\
  \nname: may not be empty\n\nprice: must be greater than or equal to 0\n\n注意：约束的评估没有特定的顺序。你可能会看到不同的输出顺序。\n\
  \n参数约束也可以被继承。例如，声明一个 `Manager` 接口如下：\n\n```java\npublic interface Manager {\n  \
  \  public void add(@NotNull Item item, @Min(value=1) int quantity);\n}\n```\n\n\
  现在，`BookManager` 类实现了 `Manager` 接口，如下：\n\n```java\npublic class BookManager implements\
  \ Manager {\n    @Override\n    public void add(Item item, int quantity) {\n   \
  \     …\n    }\n}\n```\n\n如果 `BookManager` 使用不同的约束重写了 `add()` 方法，例如：\n\n```java\n\
  public class BookManager implements Manager {\n    @Override\n    public void add(@NotNull\
  \ @Valid Item item, @Min(value=1) int quantity) {\n        …\n    }\n}\n```\n\n\
  你将在运行期间获得以下错误信息，因为这是是不允许的：`Exception in thread “main” javax.validation.ConstraintDeclarationException:\
  \ HV000151: A method overriding another method must not alter the parameter constraint\
  \ configuration, but method public void BookManager.add(Item,int) changes the configuration\
  \ of public abstract void Manager.add(Item,int)…`\n\n### 分组约束\n\n如你所见，之前引入的所有验证方法都将一个变长参数\
  \ `Class<?>… groups` 作为最后一个参数。当约束中没有指定可选的 `groups` 元素时，将使用默认组 `javax.validation.groups.Default`。在某些情况下，只需要对约束的子集进行验证。这可以通过组来实现。每个组都必须是一个接口（标记接口）。\n\
  \n让我们以购物车流程为例。流程的一部分是要求购物者登录为会员身份，或以访客身份继续。对于会员，只需要用户名和密码。对于访客，只需要地址和电子邮件。因此，可以通过将约束分为两个组：`member`\
  \ 和 `guest` 来完成验证：\n\n```java\npublic class UserInfo {\n    @NotBlank(groups=MemberGroup.class)\n\
  \    private String username;\n    @NotBlank(groups=MemberGroup.class)\n    private\
  \ byte[] password;\n    @NotBlank(groups=GuestGroup.class)\n    private String address;\n\
  \    @NotBlank(groups=GuestGroup.class)\n    private String email;\n    …\n}\n```\n\
  \n组的定义如下：\n\n```java\npublic interface MemberGroup { }\npublic interface GuestGroup\
  \ { }\n```\n\n以下示例是在三种场景下对同一个 `UserInfo` 实例运行验证：使用默认组、使用访客组和使用会员组：\n\n```java\n\
  public class GroupingExample1 {\n    private static Validator validator;\n    public\
  \ static void main(String[] args) {\n        ValidatorFactory factory = Validation.buildDefaultValidatorFactory();\n\
  \        validator = factory.getValidator();\n        UserInfo user1 = new UserInfo(null,\
  \ null);\n        validate(user1);\n        validate(user1, GuestGroup.class);\n\
  \        validate(user1, MemberGroup.class);\n    }\n\n    private static <T> void\
  \ validate(T obj, Class<?>… groups) {\n        Set<ConstraintViolation<T>> violations\
  \ = validator.validate(obj, groups);\n        if(!violations.isEmpty()) {\n    \
  \        System.out.println(“Violations:\");\n            for(ConstraintViolation<T>\
  \ violation : violations) {\n                System.out.println(violation.getPropertyPath()\
  \ + “: ” + violation.getMessage());\n            }\n        } else {\n         \
  \   System.out.println(“No violations”);\n        }\n    }\n}\n```\n\n以下是输出：\n\n\
  No violations\n\nViolations:\nemail: may not be empty\naddress: may not be empty\n\
  \nViolations:\nusername: may not be empty\npassword: may not be empty\n\n### 程序化约束\n\
  \nHibernate Validator 还提供了通过程序化方式配置约束的 API。这为在运行时动态更改约束提供了灵活性，而不是在 Java 类上使用注解标记约束。\n\
  \n要通过程序化方式配置约束，你需要创建一个新的 `ConstraintMapping`，它是用于约束映射配置的顶层类。然后，可以在类上配置约束。\n\n以下示例替换了不使用约束注解的字段级约束示例：\n\
  \n```java\nimport java.lang.annotation.ElementType;\nimport java.util.Set;\nimport\
  \ javax.validation.ConstraintViolation;\nimport javax.validation.Validation;\nimport\
  \ org.hibernate.validator.HibernateValidator;\nimport org.hibernate.validator.ValidatorConfiguration;\n\
  import org.hibernate.validator.cfg.ConstraintMapping;\nimport org.hibernate.validator.cfg.defs.MinDef;\n\
  import org.hibernate.validator.cfg.defs.NotBlankDef;\n\npublic class BookExample1\
  \ {\n    public static void main(String[] args) {\n        ValidatorConfiguration\
  \ configuration = Validation\n            .byProvider(HibernateValidator.class)\n\
  \            .configure();\n        ConstraintMapping constraintMapping = configuration.createConstraintMapping();\n\
  \        constraintMapping.type(Book.class)\n            .property(“name”, ElementType.FIELD)\n\
  \            .constraint(new NotBlankDef())\n            .property(“price”, ElementType.FIELD)\n\
  \            .constraint(new MinDef().value(0));\n\n        Validator validator\
  \ = configuration.addMapping(constraintMapping)\n            .buildValidatorFactory()\n\
  \            .getValidator();\n        Book book1 = new Book(null, -1);\n      \
  \  Set<ConstraintViolation<Book>> violations = validator.validate(book1);\n    \
  \    for(ConstraintViolation<Book> violation : violations) {\n            System.out.println(violation.getPropertyPath()\
  \ + “: ” + violation.getMessage());\n        }\n    }\n}\n```\n\n### 创建自定义约束\n\n\
  要使用注解创建自定义约束，首先需要声明注解类型。注解类型使用 `@Interface` 关键字声明。多个预定义的 Java 注解可以包含在注解类型中，例如：`@Target`\
  \ 限制注解可以应用的 Java 元素类型。例如，`ElementType.FIELD` 表示该注解可以应用于字段。\n\n`@Retention` 指定注解的保留时间，例如源码级、编译期或运行时。例如，`RetentionPolicy.RUNTIME`\
  \ 表示注解可以在运行时使用。\n\n`@Documented` 表示注解包含在 Java 文档中。默认情况下，不是。\n\n`@Inherited` 表示注解类型可以从父类继承。默认情况下，不是。\n\
  \n注解的所有元素声明方式与方法相似。可以通过 `default` 关键字提供可选的默认值。\n\n以下示例是用于验证 `Book` 类中 `code` 字段的新注解：\n\
  \n```java\npublic class Book {\n    @NotBlank\n    private String name;\n    @Min(value=0)\n\
  \    private double price;\n\n    @NotBlank\n    @CodeConstraint(prefixList={“A-“,\
  \ “B-“})\n    private String code;\n    …\n}\n```\n\n#### 创建约束注解\n\n要将注解类型作为约束注解，你需要使用\
  \ `@Constraint`。此外，任何约束注解都需要提供三个必需元素：`message`、`groups` 和 `payload`。`@CodeConstraint`\
  \ 还有一个额外的元素 `prefixList`。\n\n```java\nimport java.lang.annotation.Documented;\n\
  import java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  import javax.validation.Constraint;\nimport javax.validation.Payload;\n\n@Target(ElementType.FIELD)\n\
  @Retention(RetentionPolicy.RUNTIME)\n@Documented\n@Constraint\npublic @interface\
  \ CodeConstraint {\n    String message() default \"Invalid code\";\n    Class<?>[]\
  \ groups() default {};\n    Class<? extends Payload>[] payload() default {};\n \
  \   String[] prefixList() default {};\n}\n```\n\n\n\n\n\n```java\n@Retention(RetentionPolicy.RUNTIME)\n\
  \n@Documented\n\n@Constraint(validatedBy=CodeConstraintValidator.class)\npublic\
  \ @interface CodeConstraint {\n    String message() default “Invalid code”;\n  \
  \  Class<?>[] groups() default {};\n    Class<? extends Payload>[] payload() default\
  \ {};\n    String[] prefixList();\n}\n```\n\n`message` 元素的作用是在验证失败时提供错误消息。\n\n这里提供了一个默认消息。你也可以从资源包中提供错误消息。你只需要创建一个文件\
  \ `ValidationMessages.properties` 并将其添加到类路径中即可。例如，\n\n```java\nString message()\
  \ default \"{constraints.code.error}\";\n```\n\n并且在 `ValidationMessages.properties`\
  \ 中添加一个条目：\n\n```properties\nconstraints.code.error=Invalid code\n```\n\n## 创建校验器\n\
  \n约束校验器需要实现以下接口：`ConstraintValidator<A extends Annotation, T>`。\n\n第一个参数是约束注解。第二个参数是待校验对象的数据类型。`ConstraintValidator`\
  \ 定义了两个方法：\n`void initialize(A annotation)`：此方法在调用 `isValid` 方法之前被调用，用于初始化校验器。\n\
  \n`boolean isValid(T value, ConstraintValidatorContext context)`：包含校验的实际逻辑。该方法可以并发访问。你需要确保它是线程安全的。\n\
  \n```java\nimport javax.validation.ConstraintValidator;\nimport javax.validation.ConstraintValidatorContext;\n\
  \npublic class CodeConstraintValidator implements ConstraintValidator<CodeConstraint,\
  \ String> {\n    private String[] prefixList;\n\n    @Override\n    public void\
  \ initialize(CodeConstraint annotation) {\n        this.prefixList = annotation.prefixList();\n\
  \    }\n\n    @Override\n    public boolean isValid(String object, ConstraintValidatorContext\
  \ context) {\n        if(object == null) {\n            return false;\n        }\n\
  \        boolean flag = false;\n        for(String prefix : prefixList) {\n    \
  \        if(object.startsWith(prefix)) {\n                flag = true;\n       \
  \         break;\n            }\n        }\n        return flag;\n    }\n}\n```\n\
