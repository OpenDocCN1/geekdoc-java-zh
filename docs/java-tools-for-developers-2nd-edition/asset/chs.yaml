  \n注意：当你在 Java 源码中包含任何多字节字符时，你需要使用 UTF-8 编码保存，并使用 `-encoding utf8` 进行编译。\n\n## 创建表格\n\
  \n要在文档中创建表格，你可以使用 `PdfPTable` 类。表格是由单元格构建的。通常，你会指定表格的列数。行会自动添加。\n\n### PdfPTable\n\
  \n要构造一个 `PdfPTable`，你可以使用以下构造函数： \n- `PdfPTable(float[] columnWidths)`：构建一个指定相对列宽的\
  \ `PdfPTable`。\n- `PdfPTable(int numColumns)`：构建一个指定列数的 `PdfPTable`。\n\n表格单元格通过\
  \ `addCell` 方法添加。支持以下类型的参数：`String`、`Phrase`、`Image`、`PdfPCell`、`PdfPTable`（嵌套表格）。以下是可以在表格中使用的有用方法：\n\
  - `void setWidthPercentage(float width)`：定义表格在页面上占用的宽度百分比。值 100 表示 100%。\n- `void\
  \ setHorizontalAlignment(int alignment)`：定义相对于页面的水平对齐。仅当宽度百分比小于 100% 时才有意义。例如，`Element.ALIGN_CENTER`。\n\
  \n### PdfPCell\n\n正如我们之前提到的，五种类型的对象可以作为表格单元格添加。并不强制使用 `PdfPCell`。如果你需要自定义单元格属性，可以使用\
  \ `PdfPCell`。要构造一个 `PdfPCell`，你可以使用以下构造函数：\n- `PdfPCell(Image image)`\n- `PdfPCell(Image\
  \ image, boolean fit)`\n- `PdfPCell(PdfPCell cell)`\n- `PdfPCell(PdfPTable table)`\n\
  - `PdfPCell(Phrase phrase)`\n\n以下是在单元格中使用的有用方法：\n- `void setHorizontalAlignment()`：设置单元格的水平对齐。例如，`Element.ALIGN_CENTER`。\n\
  - `void setVerticalAlignment()`：设置单元格的垂直对齐。例如，`Element.ALIGN_MIDDLE`。\n- `void setColspan(int\
  \ colspan)`：设置列跨度（此单元格可以占据的列数）。\n- `void setRowspan(int rowspan)`：设置行跨度（此单元格可以占据的行数）。\n\
  - `void setPadding(float padding)`：设置内容与单元格边界之间的空间。\n- `void setRotation(int rotation)`：设置单元格的旋转（逆时针方向）。旋转角度必须是\
  \ 90 的倍数并可以是负数。\n\n由于 `PdfPCell` 是 `Rectangle` 类的子类，你可以使用 `Rectangle` 支持的方法来更改背景颜色或边框等属性。现在，我们使用以下示例来演示如何在文档中创建表格：\n\
  \n```java\nimport java.io.File;\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
  import com.itextpdf.text.Anchor;\nimport com.itextpdf.text.Chunk;\nimport com.itextpdf.text.Document;\n\
  import com.itextpdf.text.DocumentException;\nimport com.itextpdf.text.Element;\n\
  import com.itextpdf.text.Font;\nimport com.itextpdf.text.Font.FontFamily;\nimport\
  \ com.itextpdf.text.PageSize;\nimport com.itextpdf.text.Paragraph;\nimport com.itextpdf.text.pdf.BaseFont;\n\
  import com.itextpdf.text.pdf.PdfPCell;\nimport com.itextpdf.text.pdf.PdfPTable;\n\
  import com.itextpdf.text.pdf.PdfWriter;\n\npublic class TableExample {\n    public\
  \ static void main(String args[]) {\n        try {\n            File file = new\
  \ File(“table.pdf”);\n            new TableExample().generatePdf(file);\n      \
  \  } catch (Exception ex) {\n            System.out.println(ex);\n        }\n  \
  \  }\n\n    public void generatePdf(File file) throws DocumentException, IOException\
  \ {\n        Document doc = new Document(PageSize.LETTER);\n        PdfWriter.getInstance(doc,\
  \ new FileOutputStream(file));\n        doc.open();\n\n        Paragraph title =\
  \ new Paragraph(\"Purchase Order\");\n        title.setAlignment(Element.ALIGN_CENTER);\n\
  \        doc.add(title);\n\n        float[] widths = {0.5f, 0.2f, 0.1f, 0.1f};\n\
  \        PdfPTable table = new PdfPTable(widths);\n        table.setWidthPercentage(100);\n\
  \n        table.addCell(\"Name\");\n        table.addCell(\"Company\");\n      \
  \  table.addCell(\"Price\");\n        table.addCell(\"Quantity\");\n\n        //\
  \ Row 1\n        table.addCell(\"Acer A700\");\n        Anchor anchor1 = new Anchor(\"\
  Acer\");\n        anchor1.setURL(\"http://www.acer.com\");\n        table.addCell(anchor1);\n\
  \        table.addCell(\"429.00\");\n        table.addCell(\"2\");\n\n        //\
  \ Row 2\n        table.addCell(\"ASUS TF700\");\n        Anchor anchor2 = new Anchor(\"\
  ASUS\");\n        anchor2.setURL(\"http://www.asus.com\");\n        table.addCell(anchor2);\n\
  \        table.addCell(\"800.00\");\n        table.addCell(\"1\");\n\n        //\
  \ Total Row\n        PdfPCell totalCell = new PdfPCell(new Phrase(\"Total 1229.00\"\
  ));\n        totalCell.setHorizontalAlignment(Element.ALIGN_RIGHT);\n        totalCell.setColspan(3);\n\
  \        table.addCell(totalCell);\n\n        doc.add(table);\n        doc.close();\n\
  \    }\n}\n```\n\n公司列中的单元格包含公司网站的链接。一旦点击，它将在浏览器中打开链接。`Anchor` 类可以创建链接。由于 `Anchor`\
  \ 是 `Phrase` 的子类，你可以直接将其添加到单元格中。\n\n\n\nAdobe Acrobat 允许用户通过 `Advanced -> Security`\
  \ 为 PDF 文档添加安全权限。你可以使用密码或证书来限制用户访问某些功能。你可以在 `Document Properties`（`File -> Properties`）的\
  \ `Security` 选项卡中找到文档的安全属性。要通过程序对文档进行加密，你可以使用 `PdfEncryptor` 类或使用 `PdfWriter` 类中的\
  \ `setEncryption()` 方法：\n\n```java\nvoid setEncryption(byte[] userPassword, byte[]\
  \ ownerPassword, int permissions. int encryptionType): 设置密码加密。如果设置了用户密码，则它是移除安全的密码。如果设置了所有者密码，则它是打开文档的密码。两个密码都可以为空或空。你可以通过竖线\
  \ | | 组合多个权限。\n\nvoid setEncryption(Certificate[] certs, int[] permissions. int\
  \ encryptionType): 设置证书加密。提供一个公证书数组，并同时提供一个与每个证书大小相同的权限数组。\n```\n\n要对 PDF 文档进行加密，你需要先读取它。要读取\
  \ PDF 文档，可以使用 `PdfReader`。要修改 PDF 文档，可以使用 `PdfStamper`。接下来，你从该 `PdfStamper` 获取一个\
  \ `PdfWriter`，然后调用 `setEncryption()` 方法进行加密。对于加密文档，要移除安全性，你需要通过 Adobe Acrobat（`Advanced\
  \ -> Security -> Remove Security`）进行。\n\n运行以下示例，你需要在类路径中包含 Bouncy Castle Crypto\
  \ 程序包 [(http://www.bouncycastle.org/latest_releases.html)](http://www.bouncycastle.org/latest_releases.html)（例如\
  \ `bcprov-jdk15on-1.48.jar`）。以下示例显示了如何对现有 PDF 文档进行密码加密：\n\n```java\nimport java.io.BufferedOutputStream;\n\
  import java.io.FileOutputStream;\nimport com.itextpdf.text.pdf.PdfReader;\nimport\
  \ com.itextpdf.text.pdf.PdfStamper;\nimport com.itextpdf.text.pdf.PdfWriter;\n\n\
  public class EncryptionExample {\n\n    public static void main(String[] args) {\n\
  \        try {\n            PdfReader reader = new PdfReader(“paragraph.pdf”);\n\
  \            BufferedOutputStream outStream = new BufferedOutputStream(new FileOutputStream(“paragraph.tmp.pdf”));\n\
  \            PdfStamper stamper = new PdfStamper(reader, outStream);\n         \
  \   PdfWriter writer = stamper.getWriter();\n            PdfSecurity security =\
  \ new PdfSecurity();\n            security.encrypt(writer, “mypassword”.getBytes());\n\
  \            stamper.close();\n        } catch(Exception ex) {\n            System.out.println(ex);\n\
  \        }\n    }\n}\n\nimport java.io.IOException;\nimport com.itextpdf.text.DocumentException;\n\
  import com.itextpdf.text.pdf.PdfWriter;\n\n/**\n* PdfSecurity 负责更改 PDF 文档的安全设置。\n\
  */\npublic class PdfSecurity {\n    private static int LIMITED_PERMISSIONS = PdfWriter.ALLOW_COPY;\n\
  \n    private static int ALL_PERMISSIONS = PdfWriter.ALLOW_PRINTING |\n        \
  \    PdfWriter.ALLOW_MODIFY_CONTENTS |\n            PdfWriter.ALLOW_COPY |\n   \
  \         PdfWriter.ALLOW_MODIFY_ANNOTATIONS |\n            PdfWriter.ALLOW_FILL_IN\
  \ |\n            PdfWriter.ALLOW_SCREENREADERS |\n            PdfWriter.ALLOW_ASSEMBLY\
  \ |\n            PdfWriter.ALLOW_DEGRADED_PRINTING;\n\n    /**\n    * 加密 PDF 文档以禁用编辑能力。\n\
  \    * 仍然允许打印。\n     */\n    public void encrypt(PdfWriter writer, byte[] password)\
  \ throws IOException, DocumentException {\n        sign(writer, password, null,\
  \ LIMITED_PERMISSIONS);\n    }\n\n    /**\n    * 解密 PDF 文档以恢复编辑能力。\n     */\n  \
  \  public void decrypt(PdfWriter writer, byte[] password) throws IOException, DocumentException\
  \ {\n        sign(writer, password, null, ALL_PERMISSIONS);\n    }\n\n    /**\n\
  \    * 签名文档并更改安全设置。\n    *\n    * @param writer 一个 PDF 写入器\n     * @param ownerPassword\
  \ 用于更改安全设置的所有者密码\n     * @param userPassword 打开文档的用户密码\n     * @param permissions\
  \ 文件权限\n     * @throws IOException\n     * @throws DocumentException\n     */\n\
  \    private void sign(PdfWriter writer, byte[] ownerPassword, byte[] userPassword,\
  \ int permissions) throws IOException, DocumentException {\n        writer.setEncryption(userPassword,\
  \ ownerPassword, permissions, PdfWriter.STANDARD_ENCRYPTION_128);\n    }\n}\n```\n\
  \n以下是使用 `PdfEncryptor` 加密现有文档的代码片段：\n```java\nPdfReader reader = new PdfReader(file.toString());\n\
  BufferedOutputStream outStream = new BufferedOutputStream(new FileOutputStream“paragraph.tmp.pdf“));\n\
  PdfEncryptor.encrypt(reader, outStream, userPassword, ownerPassword, permissions,\
  \ true);\noutStream.close();\n```\n\n你还可以在文档创建之前对其进行加密。这是一个相似的过程。但正如下面的代码所示，加密只能在文档打开之前添加：\n\
  \n```java\nDocument doc = new Document();\nFile file = new File(“encrypted.pdf”);\n\
  PdfWriter writer = PdfWriter.getInstance(doc, new FileOutputStream(file));\nPdfSecurity\
  \ security = new PdfSecurity();\nsecurity.encrypt(writer, “mypassword”.getBytes());\n\
  doc.open();\n…\ndoc.close();\n```\n\n## 添加水印\n\nPDF 文档具有分结构。之前提到的元素位于中间层。一个是文本层，另一个是图形层（例如边界）。文本层位于图形层之上。对于文本的绝对定位等低级操作，需要访问直接内容（由\
  \ `PdfContentByte` 表示）。\n\n`PdfStamper` 类提供了访问文档特定页面直接内容的方法。`getUnderContent()`\
  \ 用于底层，`getOverContent()` 用于顶层，以绘制图形、定位文本。\n\n以下示例使用这两个层来演示如何在文档中添加水印：\n\n```java\n\
  import java.io.BufferedOutputStream;\nimport java.io.FileOutputStream;\nimport com.itextpdf.text.Image;\n\
  import com.itextpdf.text.Rectangle;\nimport com.itextpdf.text.pdf.BaseFont;\nimport\
  \ com.itextpdf.text.pdf.PdfContentByte;\nimport com.itextpdf.text.pdf.PdfReader;\n\
  import com.itextpdf.text.pdf.PdfStamper;\n\npublic class WatermarkExample {\n  \
  \  public static void main(String[] args) {\n        try {\n            Image logo\
  \ = Image.getInstance(“logo.png”);\n            logo.scalePercent(50);\n       \
  \     BaseFont bf = BaseFont.createFont(BaseFont.HELVETICA, BaseFont.WINANSI, BaseFont.EMBEDED);\n\
  \            PdfReader reader = new PdfReader(“table.pdf”);\n            BufferedOutputStream\
  \ outStream = new BufferedOutputStream(new FileOutputStream(“watermark.pdf”));\n\
  \            PdfStamper stamper = new PdfStamper(reader, outStream);\n         \
  \   for(int i = 1; i <= reader.getNumberOfPages(); i++) {\n                Rectangle\
  \ pageSize = reader.getPageSize(i);\n                // 在底层添加图像\n              \
  \  logo.setAbsolutePosition((pageSize.getWidth()-logo.getScaledWidth())/2, pageSize.getHeight()-200);\n\
  \                PdfContentByte content = stamper.getUnderContent(i);\n        \
  \        content.addImage(logo);\n                // 在顶层添加文本\n                content\
  \ = stamper.getOverContent(i);\n                content.beginText();\n         \
  \       content.setTextRenderingMode(PdfContentByte.TEXT_RENDER_MODE_FILL_STROKE);\
  \ content.setLineWidth(2.0f);\n                content.setRGBColorStroke(0xC0, 0xC0,\
  \ 0xC0);\n                content.setRGBColorFill(0xFF, 0xFF, 0xFF);\n         \
  \       content.setFontAndSize(bf, 48);\n                content.showTextAligned(PdfContentByte.ALIGN_CENTER,“Just\
  \ a Sample”, pageSize.getWidth()/2, pageSize.getHeight()-120, 0);\n            \
  \    content.endText();\n            }\n            stamper.close();\n        }\
  \ catch(Exception ex) {\n            System.out.println(ex);\n        }\n    }\n\
  }\n```\n\n以下是输出：\n\n![Image 6](img/index-95_1.jpg)\n\n\n\n要向直接内容写入文本，你从 `beginText()`\
  \ 方法开始并以 `endText()` 方法结束。当图形对象的渲染方式发生变化时，意味着内容中的图形状态发生了变化。如果你不小心地维护图形状态，可能会在无想不到的情况下影响后续的图形对象。为了防止这种情况发生，可以使用\
  \ `saveState()` 方法在进行任何更改之前保存图形状态，并在更改后使用 `restoreState()` 方法将其恢复。\n\n除了通过 `PdfStamper`\
  \ 获取 `PdfContentByte` 之外，你还可以从 `PdfWriter` 的 `getDirectContent()` 方法获取顶层的 `PdfContentByte`，或者从\
  \ `getDirectContentUnder()` 方法获取底层的 `PdfContentByte`。\n\n## 创建多列\n\n如果你需要创建一个包含多列的文档，可以使用\
  \ `ColumnText` 类。这涉及以下步骤：\n\n### 步骤 1\n\n首先，你需要使用以下构造函数创建一个 `ColumnText` 对象：`ColumnText(PdfContentByte\
  \ content)`。\n\n你可以通过调用 `PdfWriter` 的 `getDirectContent()` 方法来获取 `PdfContentByte`。\n\
  \n### 步骤 2\n\n现在，你可以使用 `addText(Phrase phrase)` 或 `addText(Chunk chunk)` 方法开始向 `ColumnText`\
  \ 加载文本。\n\n### 步骤 3\n\n在 `ColumnText` 开始向文档写入文本之前，你需要先定义列。较简单的方法是使用以下方法定义矩形列：`void\
  \ setSimpleColumn(float llx, float lly, float urx, float ury, float leading, int\
  \ alignment)`：`llx` 和 `lly` 定义左下角。`urx` 和 `ury` 定义右上角。\n\n你还需要使用 `void setYLine(float\
  \ yLine)` 来定义列的起始位置。\n\n除了使用上述 `setSimpleColumn` 方法来定义行距（leading）和对齐方式（alignment）之外，你还可以使用\
  \ `ColumnText` 类提供的以下方法：`void setAlignment(int alignment)` 和 `void setLeading(float\
  \ leading)`。\n\n### 步骤 4\n\n要从 `ColumnText` 向你刚刚定义的列开始写入文本，调用 `go()` 方法。将返回 `NO_MORE_COLUMN`\
  \ 或 `NO_MORE_TEXT` 状态。如果状态为 `NO_MORE_COLUMN`，则意味着需要定义新列。因此，回到步骤 3 定义另一列。这取决于每页的列数。一旦页面上的所有列都写完且仍有文本，则需要创建一个新页面。你继续这个过程，直到没有更多文本为止。\n\
  \n在下面的示例中，它读取一个文本文件并在文档中每页创建两列，将两页写入一页：\n\n```java\nimport java.io.BufferedReader;\n\
  import java.io.File;\nimport java.io.FileOutputStream;\nimport java.io.FileReader;\n\
  import java.io.IOException;\nimport com.itextpdf.text.Document;\nimport com.itextpdf.text.DocumentException;\n\
  import com.itextpdf.text.Element;\nimport com.itextpdf.text.PageSize;\nimport com.itextpdf.text.Phrase;\n\
  import com.itextpdf.text.Rectangle;\nimport com.itextpdf.text.pdf.ColumnText;\n\
  import com.itextpdf.text.pdf.PdfContentByte;\nimport com.itextpdf.text.pdf.PdfWriter;\n\
  \npublic class ColumnTextExample {\n    public static void main(String[] args) {\n\
  \        try {\n            File pdfFile = new File(\"columntext.pdf\");\n     \
  \       File file = new File(\"ColumnText.java\");\n            new ColumnTextExample().generatePdf(pdfFile,\
  \ file);\n        } catch (Exception ex) {\n            System.out.println(ex);\n\
  \        }\n    }\n\n    public void generatePdf(File pdfFile, File file) throws\
  \ DocumentException, IOException {\n        // 横向模式\n        Rectangle pageSize\
  \ = PageSize.LETTER.rotate();\n        Document doc = new Document(pageSize);\n\
  \        PdfWriter writer = PdfWriter.getInstance(doc, new FileOutputStream(pdfFile));\n\
  \        doc.open();\n        PdfContentByte content = writer.getDirectContent();\n\
  \        ColumnText columnText = new ColumnText(content);\n        BufferedReader\
  \ reader = new BufferedReader(new FileReader(file));\n        String line;\n   \
  \     while ((line = reader.readLine()) != null) {\n            columnText.addText(new\
  \ Phrase(line + \"\\n\"));\n        }\n        reader.close();\n        // 第一列\n\
  \        boolean isFirstColumn = true;\n        setColumn(columnText, pageSize);\n\
  \        // 设置起始位置\n        columnText.setYLine(pageSize.getHeight());\n       \
  \ int status = ColumnText.START_COLUMN;\n        while (ColumnText.hasMoreText(status))\
  \ {\n            status = columnText.go();\n            isFirstColumn = !isFirstColumn;\n\
  \            // 写入下一列\n            setColumn(columnText, pageSize);\n          \
  \  // 设置下一列的起始位置\n            columnText.setYLine(pageSize.getHeight());\n     \
  \       if (isFirstColumn) {\n                // 当所有列写完时创建新页\n                doc.newPage();\n\
  \            }\n        }\n        doc.close();\n    }\n\n    private void setColumn(ColumnText\
  \ columnText, boolean isFirstColumn, Rectangle pageSize) {\n        if (isFirstColumn)\
  \ {\n            columnText.setSimpleColumn(0, 0, pageSize.getWidth() - 3, pageSize.getHeight(),\
  \ 16, Element.ALIGN_JUSTIFIED);\n        } else {\n            columnText.setSimpleColumn(pageSize.getWidth()\
  \ / 2 + 3, 0, pageSize.getHeight(), 16, Element.ALIGN_JUSTIFIED);\n        }\n \
  \   }\n}\n```\n\n以下是输出：\n`setSimpleColumn` 方法允许你定义矩形列。但 `ColumnText` 类允许通过 `void\
  \ setColumns(float[] leftLine, float[] rightLine)` 定义任意形状的列：`leftLine` 定义列的左边界，`rightLine`\
  \ 定义列的右边界。每个数组包含如 `{x1, y1, x2, y2}` 的点以形成任意形状。在每个数组中，至少两个点（四个元素）可以形成直线。\n\n因此，如果你想在此示例中使用\
  \ `setColumns` 方法，可以使用以下数组作为列边界：\n\n```java\nfloat[][] leftLines = new float[][]{\n\
  \    {0, 0, 0, pageSize.getHeight()},\n    {pageSize.getWidth() / 2 + 3, 0, pageSize.getWidth()\
  \ / 2 + 3, pageSize.getHeight()}\n};\nfloat[][] rightLines = new float[][]{\n  \
  \  {pageSize.getWidth() / 2 - 3, 0, pageSize.getWidth() / 2 - 3, pageSize.getHeight()},\n\
  \    {pageSize.getWidth(), 0, pageSize.getWidth(), pageSize.getHeight()}\n};\n```\n\
  \n然后，用 `setColumns` 替换 `setSimpleColumn`：\n\n```java\nif (isFirstColumn) {\n   \
  \ columnText.setColumns(leftLines[0], rightLines[0]);\n} else {\n    columnText.setColumns(leftLines[1],\
  \ rightLines[1]);\n}\n```\n\n由于 `leading` 和 `alignment` 已经在 `setSimpleColumn` 方法中定义过，你可以通过\
  \ `ColumnText` 定义它们：\n\n```java\ncolumnText.setLeading(16);\ncolumnText.setAlignment(Element.ALIGN_JUSTIFIED);\n\
  ```\n\n## 合并文档\n\n由于 `PdfStamper` 类允许向现有文档添加额外内容，它提供了更好的合并文档的方法。你通过构建 `PdfStamper`\
  \ 开始处理原始文档，并读取要合并的文档作为额外内容。通过使用 `insertPage()` 方法，可以在特定页面之前插入空白页，或者如果页码大于总页数则追加。下一步是使用\
  \ `getImportPage()` 方法从另一个文档导入页面，然后将该页面添加到新建空白页的直接内容。以下示例演示了如何合并两个文档：\n\n```java\n\
  import java.io.BufferedOutputStream;\nimport java.io.FileOutputStream;\nimport com.itextpdf.text.pdf.PdfContentByte;\n\
  import com.itextpdf.text.pdf.PdfImportedPage;\nimport com.itextpdf.text.pdf.PdfReader;\n\
  import com.itextpdf.text.pdf.PdfStamper;\n\npublic class MergeExample {\n    public\
  \ static void main(String[] args) {\n        try {\n            PdfReader origReader\
  \ = new PdfReader(\"table.pdf\");\n            PdfReader otherReader = new PdfReader(\"\
  paragraph.pdf\");\n            BufferedOutputStream outStream = new BufferedOutputStream(new\
  \ FileOutputStream(\"merge.pdf\"));\n            PdfStamper stamper = new PdfStamper(origReader,\
  \ outStream);\n            int pageNum = origReader.getNumberOfPages();\n      \
  \      for (int i = 1; i <= otherReader.getNumberOfPages(); i++) {\n           \
  \     stamper.insertPage(++pageNum, otherReader.getPageSize(i));\n             \
  \   PdfImportedPage page = stamper.getImportedPage(otherReader, i);\n          \
  \      PdfContentByte content = stamper.getUnderContent(pageNum);\n            \
  \    content.addTemplate(page, 0, 0);\n            }\n            stamper.close();\n\
  \        } catch (Exception ex) {\n            System.out.println(ex);\n       \
  \ }\n    }\n}\n```\n\n\n\n如果你在创建新 PDF 文档的过程中需要插入现有的 PDF 文档，可以使用现有 `PdfWriter` 的\
  \ `getDirectContent()` 方法来获取一个 `PdfContentByte`。以下是代码段：\n\n```java\nPdfReader reader\
  \ = new PdfReader(\"appendix.pdf\");\nPdfContentByte content = writer.getDirectContent();\n\
  for(int i = 1; i <= reader.getNumberOfPages(); i++) {\n    doc.newPage();\n    PdfImportedPage\
  \ page = writer.getImportedPage(reader, i)\n    content.addTemplate(page, 0, 0);\n\
  }\n```\n\n![Image 8](img/index-103_1.jpg)\n![Image 9](img/index-103_2.jpg)\n\n##\
  \ 填充表单\n\n交互式 PDF 表单允许用户通过免费提供的 Adobe Reader 填写表单数据。PDF 表单有两种类型：`AcroForm`（Acrobat\
  \ 表单）和 `XFA` 表单（Adobe XML 表单架构表单）。我们如何通过程序手段填充表单数据呢？\n\n难点在于如何正确获取字段名。首先，我们可以用从\
  \ 1 开始的值的虚拟数据填充表单。如果你有 Adobe Acrobat，可以将表单数据导出为 XML 文件（`表单 -> 管理表单数据 -> 导出数据`）。我们以\
  \ IRS W-4 表单为例。它是一个 `XFA` 表单。为了简单起见，我们只对表单中的某些字段感兴趣：\n\n以下是从 Adobe Acrobat 导出的部分数据\
  \ XML：现在，我们运行以下 Java 程序来获取表单字段和字段值：\n\n```java\nimport java.io.BufferedOutputStream;\n\
  import java.io.FileOutputStream;\nimport java.util.Set;\nimport com.itextpdf.text.pdf.AcroFields;\n\
  import com.itextpdf.text.pdf.PdfReader;\nimport com.itextpdf.text.pdf.PdfStamper;\n\
  import com.itextpdf.text.pdf.XfaForm;\n\npublic class ReadFormExample {\n    public\
  \ static void main(String[] args) {\n        try {\n            PdfReader reader\
  \ = new PdfReader(\"fw4_tmp.pdf\");\n            AcroFields form = reader.getAcroFields();\n\
  \            XfaForm xfa = form.getXfa();\n            System.out.println(xfa.isXfaPresent()\
  \ ? \"XFA form\" : \"AcroForm\");\n            Set<String> fields = form.getFields().keySet();\n\
  \            for(String key : fields) {\n                System.out.println(\"field:\"\
  \ + key + \" value:\" + form.getField(key));\n            }\n            reader.close();\n\
  \        } catch(Exception ex) {\n            System.out.println(ex);\n        }\n\
  \    }\n}\n```\n\n以下字段是输出的一部分：\n- `field:topmostSubform[0].Page1[0].Line1[0].f1_09_0_[0]\
  \ value:1`\n- `field:topmostSubform[0].Page1[0].Line1[0].f1_10_0_[0] value:2`\n\
  - `field:topmostSubform[0].Page1[0].c1_01[0] value:2`\n- `field:topmostSubform[0].Page1[0].f1_16_0_[0]\
  \ value:6`\n\n你可以看到，字段名与数据 XML 中的并不完全相同。通过与填充了虚拟数字的 W-4 表单进行比较，你可以获得表单中对应字段的字段名。下面的示例展示了如何在某些字段填充数据：\n\
  \n```java\nimport java.io.BufferedOutputStream;\nimport java.io.FileOutputStream;\n\
  import com.itextpdf.text.pdf.AcroFields;\nimport com.itextpdf.text.pdf.PdfReader;\n\
  import com.itextpdf.text.pdf.PdfStamper;\n\npublic class FillFormExample {\n   \
  \ public static void main(String[] args) {\n        try {\n            PdfReader\
  \ reader = new PdfReader(\"fw4.pdf\");\n            BufferedOutputStream outStream\
  \ = new BufferedOutputStream(new FileOutputStream(\"fw4_filled.pdf\"));\n      \
  \      // 保留原始版本并追加模式\n            PdfStamper stamper = new PdfStamper(reader, outStream,\
  \ '\\0', true); \n            AcroFields form = stamper.getAcroFields();\n     \
  \       // 名字\n            form.setField(\"topmostSubform[0].Page1[0].Line1[0].f1_09_0_[0]\"\
  , \"Cheng-Hung\");\n            // 姓\n            form.setField(\"topmostSubform[0].Page1[0].Line1[0].f1_10_0_[0]\"\
  , \"Chou\");\n            // 复选框\n            form.setField(\"topmostSubform[0].Page1[0].c1_01[0]\"\
  , \"2\");\n            // 扣除额\n            form.setField(\"topmostSubform[0].Page1[0].f1_16_0_[0]\"\
  , \"10\"); \n            stamper.close();\n        } catch(Exception ex) {\n   \
  \         System.out.println(ex);\n        }\n    }\n}\n```\n\n在这个示例中，`PdfStamper`\
  \ 的构造方式如下：\n`PdfStamper stamper = new PdfStamper(reader, outStream, '\\0', true);`\n\
  第三个参数 `'\\0'` 表示保留与原始文档相同的版本。第四个参数设置为 `true` 以使用追加模式。这是非常重要的。\n\n## SERVLET\n\n\
  如果你需要在创建新 PDF 文档的过程中插入现 PDF 文档，可以使用现有 `PdfWriter` 的 `getDirectContent()` 方法来获取一个\
  \ `PdfContentByte`。以下是代码段：\n\n```java\npublic void doPost(HttpServletRequest request,\
  \ HttpServletResponse response) throws IOException {\n    response.setContentType(\"\
  application/pdf\");\n    response.setHeader(\"Content-Disposition\", \"attachment;filename=file.pdf\"\
  );\n    Document doc = new Document(PageSize.LETTER);\n    // 创建 writer\n    ByteArrayOutputStream\
  \ buffer = new ByteArrayOutputStream();\n    PdfWriter.getInstance(doc, buffer);\n\
  \    // 打开文档\n    DataOutputStream output = new DataOutputStream(response.getOutputStream());\n\
  \    byte[] bytes = buffer.toByteArray();\n    response.setContentLength(bytes.length);\n\
  \    output.write(bytes);\n    output.flush();\n    doc.close();\n}\n```\n\n## Apache\
  \ POI\n\nApache POI（混淆）是 Microsoft 文的 Java API，允许你使用 Java 读取和写入。POI 包含以下主要组件：\n\n\
  - **Excel**: `HSSF`（电子表格格式）用于 `XLS` 以及 `XSSF`（XML 电子表格格式）用于 `XLSX`\n- **Word**:\
  \ `HWPF`（文字处理格式）用于 `DOC` 以及 `XWPF`（XML 文字处理格式）用于 `DOCX`\n- **PowerPoint**: `HSLF`（幻灯片布局格式）用于\
  \ `PPT` 以及 `XSLF`（XML 幻灯片布局格式）用于 `PPTX`\n\n除了上述文档格式，POI 还支持 Visio、Publisher 和 Outlook\
  \ 。你可以从 [`poi.apache.org`](http://poi.apache.org) 下载 POI。编写时的最新版本为 3.9。\n\n## 创建\
  \ Excel 文档\n\n首先，从创建 Excel 文档开始。使用 POI 创建 Excel 文档，我们将过程分解为以下步骤：\n\n### 步骤 1\n首先，你需要创建一个\
  \ Excel 工作簿（workbook）。工作簿包含一个或多个工作表（sheet）。你可以通过 `Workbook` 接口创建工作簿，使用 `HSSFWorkbook`\
  \ 或 `XSSF` 类。创建工作簿时，可以使用默认构造函数。例如：\n`Workbook wb = new HSSFWorkbook();`\n\n注意：你应该始终尝试使用接口作为返回类型，而不是使用具体类。\n\
  \n### 步骤 2\n工作簿可以包含多个工作表。工作表由 `Sheet` 接口表示。有不同类型的工作表，例如工作表和图表。你主要处理的是包含单元格矩阵的工作表。`Sheet`\
  \ 对象通过 `Workbook` 的 `createSheet(String name)` 方法创建。例如，要创建一个名为“my worksheet”的工作表，可以使用：\n\
  `Sheet sheet = wb.createSheet(\"my worksheet\");`\n\n工作表名称在工作簿中必须唯一，且长度不超过 31 个字符。此外，你可以使用\
  \ `WorkbookUtil.createSafeSheetName(String nameProposal)` 创建可以安全用于 `createSheet()`\
  \ 方法的名称。\n\n### 步骤 3\n一旦创建了工作表，你就可以使用 `createRow(int row)` 方法开始创建行。\n\n\n\n行号从 0\
  \ 开始计数。例如，要在工作表的第二行创建行，你可以使用：\n\n```\nRow row = sheet.createRow(1);\n```\n\n###\
  \ 第 4 步\n\n现在，你可以使用 `createCell(int column)` 方法向行中添加单元格。单元格是工作表中最重要的组件。在创建 Excel\
  \ 文档时，你会花费大部分时间来定义它们。列号从 0 开始计数。例如，要在工作表的第二个单元格创建单元格，你可以使用：\n\n```\nCell cell =\
  \ row.createCell(1);\n```\n\n单元格是存储数据的地方。单元格有很多类型。单元格值可以是数字、字符串、日期、超链接或公式。你可以使用以下方法设置单元格值：\n\
  \n```\nvoid setCellValue(boolean value)\nvoid setCellValue(Calendar value)\nvoid\
  \ setCellValue(Date value)\nvoid setCellValue(double value)\nvoid setCellValue(RichTextStringValue\
  \ value)\nvoid setCellValue(String value)\nvoid setCellValue(Hyperlink value)\n\
  ```\n\n对于包含公式的单元格，你可以使用以下方法定义公式：`void setCellFormula(String formula)`\n\n单元格样式（由\
  \ `CellStyle` 接口表示）定义了单元格的布局、字体和格式。可以通过 workbook 的 `createCellStyle()` 方法创建单元格样式，然后使用\
  \ `Cell` 类提供的 `setCellStyle(CellStyle style)` 方法为单元格设置样式。\n\n### 第 5 步\n\n最后一步是将工作簿写入\
  \ `OutputStream`。例如，要将其写入文件，你可以使用：\n\n```\nFileOutputStream out = new FileOutputStrean(“po.xls”);\n\
  wb.write(out);\nout.close();\n```\n\n或者，要在 servlet 中生成 Excel 文档并作为文件下载，你可以使用以下代码段：\n\
  \n```\nresponse.setContentType(“application/excel;”);\nresponse.setHeader(“Content-Disposition”,\
  \ “attachment;filename=po.xls”); ByteArrayOutputStream buffer = new ByteArrayOutputStream();\n\
  wb.write(buffer);\nDataOutput output = new DataOutputStream(response.getOutputStream());\
  \ byte[] bytes=buffer.toByteArray();\nresponse.setContentLength(bytes.length);\n\
  output.write(bytes);\noutput.flush();\noutput.close();\n```\n\n以下是一个展示如何创建 Excel\
  \ 文档的示例。要编译并运行此示例，你需要在类路径中包含 POI 3.9 的 `poi-3.9-20121203.jar`\n\n对于 `XSSF`，你需要 `poi-3.9-20121203.jar`\
  \ 和 `poi-ooxml-3.9-20121203.jar` 来进行编译。\n\n运行时，除了这两个 JAR 包外，你还需要 `poi-ooxml-schemas-3.9-20121203.jar`、`ooxml-lib\
  \ /xmlbeans-2.3.0.jar` 以及 `ooxml-lib/dom4j-1.6.1.jar`。\n\n```java\nimport java.io.FileOutputStream;\n\
  import org.apache.poi.hssf.usermodel.HSSFWorkbook;\n//import org.apache.poi.xssf.usermodel.XSSFWorkbook;\n\
  import org.apache.poi.ss.usermodel.Cell;\nimport org.apache.poi.ss.usermodel.CellStyle;\n\
  import org.apache.poi.ss.usermodel.CreationHelper;\nimport org.apache.poi.ss.usermodel.Font;\n\
  import org.apache.poi.ss.usermodel.Row;\nimport org.apache.poi.ss.usermodel.Sheet;\n\
  import org.apache.poi.ss.usermodel.Workbook;\n\npublic class SimpleExcel {\n   \
  \ public static CellStyle numberStyle;\n    public static void main(String[] args)\
  \ {\n        try {\n            Workbook wb = new HSSFWorkbook();\n            //Workbook\
  \ wb = new XSSFWorkbook();\n            Sheet sheet = wb.createSheet(“purchase order”);\n\
  \            CreationHelper createHelper = wb.getCreationHelper();\n           \
  \ numberStyle = wb.createCellStyle();\n            numberStyle.setAlignment(CellStyle.ALIGN_RIGHT);\n\
  \            numberStyle.setDataFormat(createHelper.createDataFormat().getFormat(“##,###.00”));\n\
  \            int startRow = 1;\n            short startCol = 1;\n            SimpleExcel\
  \ simple = new SimpleExcel();\n            // 表头行\n            simple.createHeaderRow(wb,\
  \ sheet, startRow, startCol);\n            // 数据行\n            simple.createDataRow(wb,\
  \ sheet, startCol, “Acer ICONIA TAB A700”, 399.95, 2);\n            simple.createDataRow(wb,\
  \ sheet, startCol, “ASUS TF700T”, 425, 5);\n            // 输出\n            FileOutputStream\
  \ out = new FileOutputStream(“po.xls”);\n            //FileOutputStream out = new\
  \ FileOutputStream(“po1.xlsx”);\n            wb.write(out);\n            out.close();\n\
  \        } catch(Exception ex) {\n            System.out.println(ex);\n        }\n\
  \    }\n\n    public void createHeaderRow(Workbook wb, Sheet sheet, int startRow,\
  \ short startCol) {\n        short col = startCol;\n        Row headerRow = sheet.createRow(startRow);\n\
  \        sheet.setColumnWidth(col++, (short)5120);\n        sheet.setColumnWidth(col++,\
  \ (short)2560);\n        sheet.setColumnWidth(col++, (short)2560);\n        sheet.setColumnWidth(col++,\
  \ (short)2560);\n        Font headerFont = wb.createFont();\n        headerFont.setBoldweight(Font.BOLDWEIGHT_BOLD);\n\
  \        headerFont.setFontHeightInPoints(12);\n        CellStyle headerStyle =\
  \ wb.createCellStyle();\n        headerStyle.setFont(headerFont);\n        col =\
  \ startCol;\n        Cell cell = headerRow.createCell(col++); \n        cell.setCellValue(“Product”);\n\
  \        cell.setCellStyle(headerStyle);\n        cell = headerRow.createCell(col++);\n\
  \        cell.setCellValue(“Price”);\n        cell.setCellStyle(headerStyle);\n\
  \        cell = headerRow.createCell(col++);\n        cell.setCellValue(“Quantity”);\n\
  \        cell.setCellStyle(headerStyle);\n    }\n\n    public void createDataRow(Workbook\
  \ wb, Sheet sheet, short startCol, String name, double price, int quantity) {\n\
  \        int rowNum = sheet.getLastRowNum() + 1;\n        Row dataRow = sheet.createRow(rowNum);\n\
  \        short col = startCol;\n        Cell cell = dataRow.createCell(col++);\n\
  \        cell.setCellValue(name);\n        cell = dataRow.createCell(col++);\n \
  \       cell.setCellValue(price);\n        cell = dataRow.createCell(col++);\n \
  \       cell.setCellValue(quantity);\n        cell.setCellStyle(numberStyle);\n\
  \    }\n}\n```\n\n\n\n\n`void setVerticalAlignment(short alignment)`: 设置单元格的垂直对齐方式。例如，`CellStyle.VERTICAL_CENTER`。\n\
  \n`void setWrapText(Boolean wrapped)`: 如果文本应该换行，则设置为 true。\n\n你可以从 `Workbook` 获取一个\
