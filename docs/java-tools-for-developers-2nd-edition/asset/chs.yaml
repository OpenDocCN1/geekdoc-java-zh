  \n你可以使用 `PlotOrientation.VERTICAL` 创建垂直柱状图，或使用 `PlotOrientation.HORIZONTAL` 创建水平柱状图。对于垂直柱状图，值轴位于\
  \ y 轴方向，类别轴位于 x 轴方向。值轴（范围轴）由 `ValueAxis` 类（或其子类 `NumberAxis`）表示，用于显示数值数据的轴。通过该类，你可以定义轴属性，如刻度或值范围。类别轴（或域轴）由\
  \ `CategoryAxis` 类表示，用于显示类别的轴。通过该类，你可以定义轴属性，如类别标签的位置。\n\n柱状图可以包含多个数据系列。你可以使用 `DefaultCategoryDataset`\
  \ 类通过以下方法为柱状图创建数据集：\n\n`void addValue(double value, Comparable rowKey, Comparable\
  \ columnKey)` `rowKey` 是数据系列的名称。`columnKey` 是类别名称。\n\n要在图表中添加标记，可以使用 `addRangeMarker(Marker\
  \ marker, Layer layer)` 方法。你可以使用 `Layer.FOREGROUND` 或 `Layer.BACKGROUND`。要标记一个值范围，可以使用\
  \ `IntervalMarker` 类。要标记一个特定值，可以使用 `ValueMarker` 类。如果你需要标记类别，可以使用 `addDomainMarker(CategoryMarker\
