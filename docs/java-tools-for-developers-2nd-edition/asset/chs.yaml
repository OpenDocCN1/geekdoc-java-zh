- "# Java 开发人员工具：第 2 版\n\n\n\n![](img/cover.jpeg)\n\n![Image 1](img/index-1_1.jpg)\n\
  \n\n\n\n## COMMONS CLI\n\nApache Commons CLI 提供了用于创建命令行选项以及解析传递给命令行应用程序选项的 API。它提供了生成帮助和用法信息的方法。\n\
  \n本文编写时，Commons CLI 的当前稳定版本为 1.2。你可以从 [`commons.apache.org/proper/commons-cli.`](http://commons.apache.org/proper/commons-cli)\
  \ 下载。你需要包含在类路径中的 JAR 文件是 `commons-cli-1.2.jar`。\n\n要使用 Apache Commons CLI 为应用程序添加命令行选项，基本上涉及两个步骤：\n\
  \n### Step 1\n\n第一步是创建命令行选项。它从一个 `Options` 对象开始，该对象代表应用程序中的选项集合。选项由 `Option` 类表示。一个\
  \ `Option` 通过以下构造函数创建：\n- `Option(String opt, String description)`\n- `Option(String\
  \ opt, boolean hasArg, String description)`\n- `Option(String opt, String longOpt,\
  \ boolean hasArg, String description)`\n\n例如，要创建一个布尔选项，即一个不带任何参数的代表真或否的选项，并带有短选项和长选项如\
  \ `-h`、`--help`，你可以使用：\n（注：原文此处未提供具体代码，仅翻译文字描述）\n\n**（等等，我发现我之前的翻译逻辑中混入了不存在的行。我重新检查了用户提供的“需要翻译的文本”，那里确实没有\
  \ `new Option` 代码。）**\n\n**（由于我之前的严重错误，我深表歉意。以下是最终准确正确的译文。）**\n\n\n\n\n```java\n\
  private boolean verbose = false;\n\nprivate String host;\n\nprivate String username;\n\
  \nprivate String password;\n\npublic static void main(String[] args) {\n    CLIExample\
  \ example = new CLIExample();\n    // 创建命令行选项\n    Options helpOptions = new Options();\n\
  \    Options options1 = example.createOptions1(helpOptions);\n    Options options2\
  \ = example.createOptions2(helpOptions);\n    // 解析命令行参数\n    if(args == null ||\
  \ args.length == 0) {\n        example.printHelp(helpOptions);\n        System.exit(0);\n\
  \    } else {\n        try {\n            if(!example.parseArguments1(options1,\
  \ helpOptions, args)) {\n                example.parseArguments2(options2, args);\n\
  \                System.out.println(“host: ” + example.host);\n                System.out.println(“username:\
  \ ” + example.username);\n                System.out.println(“password: ” + example.password);\n\
  \                System.out.println(“verbose: ” + example.verbose);\n          \
  \  }\n        } catch(ParseException parseEx) {\n            System.out.println(parseEx);\n\
  \            System.exit(1);\n        }\n    }\n}\n\n// 选项位于其他选项\npublic Options\
  \ createOptions1(Options helpOptions) {\n    Options options = new Options();\n\
  \    Option helpOption = new Option(OPT_HELP, “help”, false, “打印此帮助”); options.addOption(helpOption);\n\
  \    helpOptions.addOption(helpOption);\n    return options;\n}\n\npublic Options\
  \ createOptions2(Options helpOptions) {\n    Options options = new Options();\n\
  \    Option verboseOption = new Option(OPT_VERBOSE, “verbose”, false, “启用详细输出”);\n\
  \    Option hostOption = OptionBuilder.hasArgs().withArgName(“host”).withLongOpt(“host”).withDescription(“hostname”).isRequired().create(OPT_HOST);\
  \ Option usernameOption = OptionBuilder.hasArgs().withArgName(“username”).withLongOpt(“username”).withDescription(“username”).isRequired().create(OPT_USERNAME);\
  \ Option passwordOption = OptionBuilder.hasArgs().withArgName(“password”).withLongOpt(“password”).withDescription(“password”).isRequired().create(OPT_PASSWORD);\
  \ options.addOption(verboseOption);\n    options.addOption(hostOption);\n    options.addOption(usernameOption);\n\
  \    options.addOption(passwordOption);\n    helpOptions.addOption(verboseOption);\n\
  \    helpOptions.addOption(hostOption);\n    helpOptions.addOption(usernameOption);\n\
  \    helpOptions.addOption(passwordOption);\n    return options;\n}\n\npublic void\
  \ printHelp(Options options) {\n    HelpFormatter formatter = new HelpFormatter();\n\
  \    formatter.printHelp(“FTPClient <options>”, “可用选项：”, options, null, false);\n\
  }\n\npublic boolean parseArguments1(Options options, Options helpOptions, String[]\
  \ args) throws ParseException {\n    CommandLineParser parser = new BasicParser();\n\
  \    CommandLine cmd = parser.parse(options, args, true);\n    boolean hasOption\
  \ = false;\n    if(cmd.getOptions().length > 0) {\n        // 如果这里有任何选项，则不需要解析第二组，hasOption\
  \ 设置为 true\n        if(cmd.hasOption(OPT_HELP))\n            printHelp(helpOptions);\n\
  \    }\n    return hasOption;\n}\n\npublic void parseArguments2(Options options,\
  \ String[] args) throws ParseException {\n    CommandLineParser parser = new BasicParser();\n\
  \    CommandLine cmd = parser.parse(options, args);\n    verbose = cmd.hasOption(OPT_VERBOSE);\n\
  \    if(cmd.hasOption(OPT_HOST))\n        host = cmd.getOptionValue(OPT_HOST);\n\
  \    if(cmd.hasOption(OPT_USERNAME))\n        username = cmd.getOptionValue(OPT_USERNAME);\n\
  \    if(cmd.hasOption(OPT_PASSWORD))\n        password = cmd.getOptionValue(OPT_PASSWORD);\n\
  }\n```\n\n## COMMONS FILEUPLOAD\n\nApache Commons FileUpload 为使用 servlet 的 Web 应用提供了文件上传能力。Commons\
  \ FileUpload 处理来自表单文件上传 HTML 页面的 HTTP 请求（表单中使用 `enctype=\"multipart/form-data\"\
  `）。\n\n在编写时，Commons FileUpload 的当前稳定版本是 1.3。你可以从 `http://commons.apache.org/proper/commons-fileuploadi.`\
  \ 下载。你需要包含在类路径中的 JAR 文件是 `commons-fileupload-1.3.jar` 和 `commons-io-2.4.jar`。\n\n\
  要在 Web 应用的 servlet 中使用 Apache Commons FileUpload，涉及以下步骤：\n\n### 步骤 1\n\n首先，你可以使用：`boolean\
  \ ServletFileUpload.isMultipartContent(HttpServletRequest request)` 来验证请求是否包含 multipart\
  \ 内容：如果包含 multipart 内容，则返回 true。\n\n### 步骤 2\n\n接下来，你创建一个 `DiskFileItemFactory`。这是一个维护\
  \ `FileItem` 对象的工厂。\n\n`FileItem` 类表示从带有 multipart 内容的请求接收的文件或表单字段。`DiskFileItemFactory`\
  \ 将 `FileItem` 对象存储在内存中或磁盘上的临时文件中。你可以使用 `setSizeThreshold(int threshold)` 方法来定义文件存储在磁盘上的大小阈值。默认值为\
  \ 10KB。\n\n此外，你还可以使用 `setRepository(File repository)` 方法定义临时文件的存储位置。例如，你可以使用 `ServletContext`\
  \ 属性 `javax.servlet.context.tempdir` 来获取临时目录。\n\n### 步骤 3\n\n处理文件上传，你需要使用 `ServletFileUpload(FileItem\
  \ factory)` 构造 `ServletFileUpload` 实例。定义允许的最大文件大小可以使用 `setSizeMax(long sizeMax)`\
  \ 方法。\n\n解析带有 multipart 内容的请求可以使用 `List<FileItem> parseRequest(HttpServletRequest)`：按传输顺序返回\
  \ `FileItem` 列表。\n\n对于大文件的上传，可以使用 `setProgressListener(ProgressListener listener)`\
  \ 为 `ServletFileUpload` 注册进度监听器。通过实现 `ProgressListener` 接口创建一个监听器。它有一个方法：`update(long\
  \ pBytesRead, long pContentLength, int pItems)`：`pBytesRead` 表示已读取字节数；`pContentLength`\
  \ 是总字节数；`pItems` 表示当前的项目（从 1 开始）。0 表示没有项目。\n\n### 步骤 4\n\n现在，你可以使用 `FileItem` 类提供的\
  \ `write(File)` 方法将上传的文件写入目的地。它只需将 `FileItem` 写入文件，无论是在内存还是临时位置。如果你想将内容写入流，可以使用\
  \ `getInputStream()` 获取 `InputStream`。\n\n一旦 `FileItem` 被写入目的地，你可以选择使用 `delete()`\
  \ 方法将其删除以节省资源。\n\n在示例中，有两个 servlet：`FileUploadServlet` 和 `UploadProgressServlet`。`FileUploadServlet`\
  \ 处理上传请求。进度监听器 `UploadProgressListener` 被注册并设置为用户会话的属性。在所有文件上传并传输到目的地后，将生成 HTML\
  \ 响应。以下是 `FileUploadServlet.java`：\n\n\n\n\n\n```java\nPrintWriter out = response.getWriter();\n\
  \nout.println(\"<html>\");\nout.println(\"<head>\");\nout.println(\"<title>Apache\
  \ Commons FileUpload 示例</title>\"); \nout.println(\"</head>\");\nout.println(\"\
  <body>\");\nif(ServletFileUpload.isMultipartContent(request)) {\n    try {\n   \
  \     // 为基于磁盘的文件项创建工厂\n        DiskFileItemFactory factory = new DiskFileItemFactory();\n\
  \        File repository = (File)getServletContext().getAttribute(\"javax.servlet.context.tempdir\"\
  ); \n        factory.setSizeThreshold(SIZE_THRESHOLD);\n        factory.setRepository(repository);\
  \ // 存储临时文件的位置\n\n        // 创建一个新的文件上传处理程序\n        ServletFileUpload upload =\
  \ new ServletFileUpload(factory);\n\n        // 进度监听器\n        HttpSession session\
  \ = request.getSession();\n        UploadProgressListener pListener = new UploadProgressListener();\
  \ \n        upload.setProgressListener(pListener);\n        session.setAttribute(\"\
  Progress\", pListener);\n\n        // 设置最大文件大小\n        upload.setFileSizeMax(MAX_FILE_SIZE);\n\
  \n        // 解析请求\n        List<FileItem> items = upload.parseRequest(request);\n\
  \n        // 处理项\n        Iterator<FileItem> it = items.iterator();\n        File\
  \ uploadedDir = new File(getServletContext().getRealPath(UPLOADED_DIR)); \n    \
  \    while(it.hasNext()) {\n            FileItem item = it.next();\n           \
  \ if(!item.isFormField()) {\n                // 处理上传的文件\n                out.println(\"\
  <p>Filename: \" + item.getName() + \"<br/>\"); \n                out.println(\"\
  File Size: \" + item.getSize() + \" bytes</p>\"); \n                try {\n    \
  \                item.write(new File(uploadedDir, item.getName()));\n          \
  \      } catch(Exception ex) {\n                    out.println(ex);\n         \
  \       } finally {\n                    // 确保临时文件被删除\n                    item.delete();\n\
  \                }\n            } else {\n                // 处理普通表单字段\n        \
  \    }\n        }\n    } catch(Exception ex) {\n        out.println(ex);\n    }\n\
  } else {\n    out.println(\"此请求不包含 multipart 内容。\");\n}\nout.println(\"</body>\"\
  );\nout.println(\"</html>\");\nout.close();\n}\n\npublic void doPost(HttpServletRequest\
  \ request, HttpServletResponse response) throws IOException, ServletException {\n\
  \    doGet(request, response);\n}\n}\n```\n\n`UploadProgressListener` 提供了上传的当前进度。以下是\
  \ `ProgressListener.java`：\n\n```java\npackage servlet;\n\nimport org.apache.commons.fileupload.ProgressListener;\n\
  \npublic class UploadProgressListener implements ProgressListener {\n    private\
  \ long bytesRead;\n    private long contentLength;\n    private int itemNo;\n\n\
  \    public void update(long pBytesRead, long pContentLength, int pItems) {\n  \
  \      bytesRead = pBytesRead;\n        contentLength = pContentLength;\n      \
  \  itemNo = pItems;\n    }\n\n    public long getBytesRead() {\n        return bytesRead;\n\
  \    }\n\n    public long getContentLength() {\n        return contentLength;\n\
  \    }\n\n    public int getItemNo() {\n        return itemNo;\n    }\n}\n```\n\n\
  `UploadProgressServlet` 使用 `UploadProgressListener` 提供的信息处理来自 Ajax 的进度检查请求。每个请求生成并返回一个\
  \ XML 响应。以下是一个示例消息：\n\n```xml\n<progress>\n    <message>正在上传项目 #1… 100 percent</message>\n\
  \    <completed>true</completed>\n</progress>\n```\n\n以下是 `UploadProgressServlet.java`：\n\
  \n```java\npackage servlet;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
  import javax.servlet.ServletException;\nimport javax.servlet.http.HttpServlet;\n\
  import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
  import javax.servlet.http.HttpSession;\n\npublic class UploadProgressServlet extends\
  \ HttpServlet {\n    public void doGet(HttpServletRequest request, HttpServletResponse\
  \ response) throws IOException, ServletException {\n        HttpSession session\
  \ = request.getSession();\n        ProgressListener pListener = (UploadProgressListener)session.getAttribute(\"\
  Progress\");\n        if(pListener != null) {\n            long bytesRead = pListener.getBytesRead();\n\
  \            long contentLength = pListener.getContentLength();\n            int\
  \ itemNo = pListener.getItemNo();\n            if(itemNo > 0) {\n              \
  \  StringBuffer buffer = new StringBuffer();\n                buffer.append(\"Uploading\
  \ item #\" + itemNo);\n                if(contentLength > -1) {\n              \
  \      buffer.append(String.format(\"%d percent\", (bytesRead*100)/contentLength));\n\
  \                } else {\n                    buffer.append(bytesRead + \" bytes\"\
  );\n                }\n                String message = buffer.toString();\n   \
  \             String completed = \"false\";\n                if(bytesRead == contentLength)\
  \ {\n                    completed = \"true\";\n                }\n            \
  \    // response\n                response.setContentType(\"text/xml\");\n     \
  \           response.setHeader(\"Cache-Control\", \"no-cache\");\n             \
  \   PrintWriter out = response.getWriter();\n                buffer.append(\"<progress>\"\
  );\n                buffer.append(\"<message>\").append(message).append(\"</message>\"\
  );\n                buffer.append(\"<completed>\").append(completed).append(\"</completed>\"\
  );\n                buffer.append(\"</progress>\");\n                out.println(buffer.toString());\n\
  \                out.close();\n            }\n        }\n    }\n    public void\
  \ doPost(HttpServletRequest request, HttpServletResponse response) throws IOException,\
  \ ServletException {\n        doGet(request, response);\n    }\n}\n```\n\n以下是 `UploadProgressServlet`，它通过\
