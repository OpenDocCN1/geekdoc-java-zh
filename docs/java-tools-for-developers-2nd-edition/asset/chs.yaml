  \ MS Excel 默认将工作簿计算设置为了 `Automatic`（自动）。你可以通过点击左上角的 Office 按钮 -> Excel 选项 -> 公式来验证这一点。这就是为什么公式会自动重新计算的原因。在上节的示例中，我们只创建了一个定义了公式的\
  \ Excel 文档，完全没有对公式进行求值。除非在 MS Excel 中打开并保存（带有计算结果），否则你无法从公式单元格获取正确的值。\n\n要在代码中修复这个问题，你可以使用\
