    prepare for eventualities one has no reason to anticipate, must keep one’s dwelling
    and grooming spartan in case of emergencies, must undertake defensive projects
    that have no connection to the actual day-to-day flourishing of the people one
    loves. We’ve all known families in which the men putter away at Rube Goldberg
    schemes for “securing” the family’s financial or physical safety while the women
    carry everyone through every day, anticipating every emergency, meeting every
    contingency. We’ve all known families in which such a man exhausts himself in
    this way that he constantly increases the burden he places on those same beleaguered
    women, whom he then blames, perhaps, for not being “supportive.”


    And we’ve all noticed the way many men live our lives on patrol, whether or not
    there’s anything to patrol against. In Self-Made Man (2006), her memoir about
    cross-dressing as a man for a year, Norah Vincent immediately notices the way
    men don’t meet each other’s eyes, how we pointedly refuse to look at each other.
    “For them, to look away was to decline a challenge, to adhere to a code of behavior
    that kept the peace among human males in certain spheres just as surely as it
    kept the peace and the pecking order among male animals.”


    To put it simply, Every social encounter between men is potentially a fistfight.
    You learn this in elementary school and never forget it. No wonder, as we age,
    that we ignore each other, let our friendships wither, cancel plans. No wonder
    there are recurring expressions of concern about a “male bonding crisis.” (Why
    spend your precious leisure hours among possible enemies?) And no wonder many
    of us have failed to see grabby men as a serious social problem for women, when
    an American boyhood consists of little else but unorganized combat drills, unwanted
    invasions of personal territory. It’s all grabs, punches, towel flicks, fake homoerotic
    aggression, threats of unspecified but grim and—as one ages—increasingly sexualized
    violence. One night in my teenage years, as I was clocking out of my shift at
    McDonald’s, a guy flicked my balls, decisively and painfully. We weren’t on bad
    terms. It was a greeting.


    The proponents of traditional masculinity scorn many traits in modern men—our
    failure to do enough manual labor, hold back tears, grip things, stand up straight
    with our shoulders back, and any number of other failings. But most of all, they
    lament our failure to embrace this protective role, which further suggests its
    centrality to the whole construct. Political theorist and pundit Harvey Mansfield
    gives us a summation that is, by the low standards of our cultural conversation
    on masculinity, relatively straightforward: “A man protects those whom he has
    taken in his care against dangers they cannot face or handle without him. He makes
    an issue of some matter, engages his honor, and takes charge of the situation
    either as a routine or in an emergency. . . . The willingness to take on risk
    is the primary protection enveloping all other ways of providing for someone.”


    The merit of taking on risk is self-evident—it sounds, again, like mere adulthood,
    or mere goodness. Yet culture whispers to us that a too-narrow concern with securing
    a future for one’s family or one’s lover can go badly wrong. We have the two Godfather
    films (the only ones that exist), in which Michael Corleone is led, with nightmarish
    inevitability, to murder his brother—the brother most in need of protection—and
    destroy his marriage, precisely because he “loves family.” We have the television
    series Breaking Bad, which takes the Godfather films’ insight a step further.
    Intended as a show about a schoolteacher who becomes a meth dealer, it turned,
    under the pressure of Bryan Cranston’s attempt to make the main character psychologically
    believable, into the story of a man who relishes the role of drug kingpin. “I
    did it for me. I was good at it,” he tells his wife, then leaves. There is a multigenerational
    family of such stories, its lineage running from Othello to Knew He Was Right
    to Dom Casmurro to Black Mirror to, God help us, the current season of the Archie
    Comics–derived series, Riverdale, in which men destroy their households in order
    to save them. Securing your family’s future: You can’t even talk about this urge,
    as I’ve discovered in writing this paragraph, without coming uncomfortably close
    to the “Fourteen Words” that define the neo-Nazi creed. Just add “white.” Or just
    acknowledge, perhaps, that it’s already there.


    Without quite meaning to, Harvey Mansfield also offers a useful explanation of
    how the mere desire to bear risks for a loved one often drives a person willy-nilly
    into an ugly politics of dominance. “Honor is an asserted claim to protect someone,”
    he writes, “and the claim to protect is a claim to rule. How can I protect you
    properly if I can’t tell you what to do?” He judges the “entire enterprise of
    modernity,” with its emphasis on Machiavellian foxiness over lionhearted classical
    courage, as “a project to keep manliness unemployed,” and sees some limited hope
    for its revival in the war on terror, still fairly new at the time he wrote these
    words, which we now call, with fatalistic humor, the forever war. Talk about a
    claim to rule! But the destructive logic that Mansfield identifies here most often
    works itself out closer to home than Iraq or Afghanistan. It works itself out
    in those men who have lived mutely at the center of stage for so long, providing,
    or believing, for a family that falls apart or fails to materialize whereupon
    they pick up a gun and bring the curtain down on the whole play. How can they
    protect you properly if you won’t let them what to do? For the anthropologist
    Peter McAllister, meanwhile, the rot set in earlier than Machiavelli. In his 2009
    book regrettably titled Manthropology, he cites studies of bone density, suggesting
    that average Bronze Age men were so fitter and fleeter than today’s athletes that
    the physical condition can be quantified as “the worst . . . in history.” Oddly
    enough, McAllister reserves his jocular tone for men only, though his own findings
    regarding Bronze Age women—also stronger, or at least thicker in wrists, than
    today’s humans—Mansfield and McAllister are conventional in seeing manliness as
    a deep biological necessity threatened by modernity. But human nature and male
    nature, if either exists at all, are Kantian unknowables, apprehensible only secondarily
    in their manifestations as culture. Our species’ single most predictable characteristic
    is our refusal to be defined by instinct, to let evolutionary history answer all
    our questions. Lions can no more tell men to be aggressive than bonobos can tell
    us to be polyamorists or cats tell us to be orange. Nor am I convinced that this
    crisis is new, brought on by feminism or reduced male-bonding opportunities or
    the shift to agriculture. Our desire to project animal simplicity onto the human
    past has been refuted again and again by anthropology, history, and folklore,
    yet it survives, precisely because it meets our emotional needs. Conan the Barbarian
    is a modern invention, like radio and Leopold Bloom. One of the only things we
    know for sure about those dense-boned paleolithic supermen is that they used their
    enormous wrists to paint some of the most exquisitely observed art ever made.
    There are two senses, both more meaningful than the Mansfields of the world can
    afford to realize, in which men are failing to protect the people around them.
    One, many of us commit violence against women and each other, stand accused of
    letting those guys get away with it. Feminists sometimes exaggerate the amount
    of restraining influence men have over each other. If you’ve marked yourself as
    the sort of man who objects to casual rape or wife beating, the men likeliest
    to do those things tend not to invite you.

