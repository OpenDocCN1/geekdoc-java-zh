    HOW TO BE CULTURED (II)


    MIDDLEBROW


    It is odd that anyone still uses the word middlebrow. Like its complements


    lowbrow and highbrow, it reeks of antique beliefs, specifically the English


    notion that the brow ridges of pure-blooded Anglo-Saxon gentlemen jut out


    and up in a lordly fashion (as befits a ruler of subject populations). It is ill-


    defined, sometimes insulting, sometimes complimentary, sometimes ostensibly


    neutral. The clumsy rhythm of its syllables, the physicality of the image it


    describes combined with the difficulty of actually picturing it—we have to


    quickly imagine a whole range of brow placements, then select a spot within


    that range—leave the impression of something absurd and not quite real.


    But what is strangest about the term’s survival is that it has no obvious


    purpose. We use the three –brow suffixes to rank cultural products somewhere


    in the middle of an agreed-upon hierarchy of taste. It is far from clear that
    such


    a hierarchy still exists. In my experience, teachers of the humanities, museum


    curators, arts journalists, and artists themselves—the people whose job it


    would be to maintain such a hierarchy—are far likelier to disclaim it than


    affirm it. There are still reputations, in the simple sense that many people have


    heard the name Shakespeare, somewhat fewer have heard the name August


    Wilson, and very few have heard the name Paul Green. (He won the Pulitzer


    Prize for drama in 1927.) So local theater companies continue to present A


    Midsummer Night’s Dream and, less often, Fences, just as regional orchestras


    continue to program Beethoven’s Symphony No. 5 and Barber’s Adagio for


    Strings. But what happens if you ask the director of one of those local theater


    companies, or the percussionist of one of those regional orchestras, whether


    tragedy or classical music is an “inherently” worthier form than, say, comic


    strips? Whatever their feelings, they will remember that scrap of Pierre'
  - '[PAGE 69]


    Bourdieu that someone forced them to read in college—for he, too, is


    canonical—and say “no.” (We will leave aside, as this conversation generally


    does, the vexing questions of what inherent and great mean in this context.) If


    pressed, they will say that the works that embody these traditions remain


    important because, due to a once common but mistaken belief in their


    inherent worth, they have influenced the culture. In other words, these works’


    value comes from the fact that misguided people once valued them. Not a


    ringing defense. The most eloquent and thoughtful such culture workers might


    begin to make a case based on their aesthetic responses to the works in


    question—a mode of defense that somewhat embarrasses us, “subjective” as we


    are told it is. As they speak, a bureaucrat somewhere is eyeing a line item and


    reaching for a black marker.


    Everything that was once considered lowbrow is now triumphant. It is still


    common for people to talk of “guilty” cultural pleasures—TV, dance music—


    about which no one has felt guilty in decades and to apologize for them with


    an enthusiasm that looks a lot like pride. But the pretense of guilt is merely


    there to increase our pleasure; it adds the excitement of transgression to an


    otherwise banal activity. Successful artists in lowbrow forms now live in the


    perpetual snit of offended dignity that used to mark a person as a member of


    the highbrow avant-garde. In 2019, a pop star—a rich person, her work


    fawned over by critics—publicly attacked a well-respected reviewer over a


    (positive) review of her new record. Also in 2019, a wealthy, famous author of


    books for teenage girls engaged in a public feud with a woman student who


    had, in a college newspaper, described that author’s books, accurately, as books


    for teenage girls. Several other wealthy, famous authors joined in—to further


    humiliate the offending student. Artists used to have the decency to conduct


    such bullying via back channels: an agent makes a discreet phone call to the


    offices of Rolling Stone and a freelancer disappears from its roster. Today’s'
  - '[PAGE 70]


    popular artists don’t scruple to perform these offenses to their own dignity in


    public. They think that unquestioned deference is simply due them. One can


    imagine Picasso throwing such fits. This is our culture’s face. Its features are
    too


    jumbled for anyone to pinpoint where its middlebrow might be. Yet we go on


    using the term, often with an affection that its cousins don’t receive. As with


    “popular artist,” as used in this paragraph, it’s a ghost-term to which we turn
    in


    the absence of a vocabulary adequate to our situation.


    Early in the pandemic, a writer named Stephen Daisley took to the pages of


    the Spectator to credit COVID-19 with giving “new life to the middlebrow


    sensibility”:


    Quarantine culture is a sort of reverse-engineered middlebrow, that lists


