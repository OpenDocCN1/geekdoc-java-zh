    wounded masculinity chooses only to make a farce of itself.


    As for my own masculinity, it has never recovered from the defeat it was


    handed one night by my wife, the very person for whom I had been, I


    thought, patiently preparing it. We’d had a conversation about chivalry. I


    thought I could save the idea by retaining the bits of it that offered the least


    advantage to men and jettisoning the rest. In everyday circumstances, I


    insisted, men and women must be understood as interchangeable equals—no


    more pay gaps, no more devaluing of women’s work as such—but in the world


    of lurid, bad-movie scenarios, it had to be my job, as the man, to die for her.
    If


    we were on a sinking ship, she’d get the last seat on the lifeboat. (She hates


    sailing.) If we were attacked by terrorists, I would get myself killed stalling


    them so she could run away. (Terrorist attacks are not frequent in Ann Arbor.)


    She laughed this off, but later she grew thoughtful. She asked me, very


    earnestly, why she should want to live with the grief and shame of having failed


    to save my life? Why should she be automatically drafted for those forms of


    suffering? If her love for me meant the same thing to her that my love for her


    did to me, then even my watered-down, break-glass-in-emergencies chivalry


    was still an insult to that love. It was still, as she put it, “hierarchical bullshit.”
    I


    cannot quite accept the emotional consequences of this, but I know she is


    right.


    Nevertheless, I still have moments when I start to wonder whether I should


    take up bowhunting or woodchopping or doomsday prep. My wife will, at


    these times, remind me of an incident, early in our relationship, in which I did


    act as her manly protector. We were walking back to that same tiny, pillowless


    Milwaukee room when a teenage boy, part of a group of three passing in the


    other direction, yanked her purse out of her hand. They took off. I ran after'
  - '[PAGE 25]


    them into a dark alley, where, of course, one of them brandished a gun and


    relieved me of my wallet.


    In other words, my wife reassures me of masculinity by reminding me of the


    stupidest thing I ever did. What purse is worth a human life? And what did I


    intend to do to these drug-addled latchkey children—over, again, a purse?


    And, worst of all, what of the woman for whose sake I had undertaken the


    whole pointless exercise, whom I had left defenseless, unprotected, and alone,


    now too many yards away from where I stood, already cursing my blunder,


    tossing my wallet to the ground? How lucky, in that moment, to be nothing


    worse than a joke.'
  - '[PAGE 26]


    HOW TO BE WHITE


    It is not enough to be against racism; we must abolish whiteness itself. On our


    way to doing so, we can abandon, unlearn, undo, undermine, divest from, or


    dismantle it. If we do not, at the moment, feel up to those projects, we might


    at least interrupt, interrogate, or dream of a self beyond it. This all sounds
    like it


    would involve paying whiteness a great deal of attention, but hold on. We


    must also decenter it, while not forgetting to see it, address it, own it, and
    watch


    it work. (The author who wishes us to decenter it remarks, perhaps helpfully,


    that decentering it means focusing on it.) If, after all this, we find ourselves
    too


    winded to abolish whiteness, we might turn ourselves to the more modest


    projects of defining and reinventing it—this time in a nice way. Having done


    so, we could then be pardoned if we wished to embrace and steward it. In any


    case, we had better form a study group.


    It is always easy to be snarky about activist language, especially when, as


    today, that language is so deeply influenced by a style of portentous


    inexactitude indebted, I take it, to the postwar French academic left. And I am


    sympathetic to at least some idea held by each of the authors I just alluded to.


    Even an intelligent discussion of social processes can find itself chasing its
    tail;


    a thing in motion is hard to draw. So the constant injunctions, in recent left-


    of-center discourse, to \[verb\] whiteness make me smile sometimes, but it’s not


    usually a smile of contempt.


    Sometimes it is a smile of puzzlement. Ending racism, a vast set of


    institutionalized practices, is hard enough, but “destroy whiteness” hits my ears


    as though it were a koan or aporia—a thing you say because you want, for


    some spiritual or other purpose, to make thinking itself grind its gears. What


    even is “whiteness,” and how would you destroy it? How do you kill an ill


    wind?'
  - '[PAGE 27]


    We’re all familiar enough with the common distinction between ethnicity


    (what we can’t help having, insofar as we come from somewhere and were born


    to somebody) and race (a larger category that subsumes various ethnicities into


    a suprahistorical, quasi-mystical unity). Some of America’s finest minds—W. E.


    B. Du Bois, Theodore Allen, Edmund S. Morgan, Nell Irvin Painter, Ta-Nehisi


    Coates, Toni Morrison—have devoted whole careers to examining or


    documenting or dramatizing how the fiction known as “race” came to be


    inscribed over the far more particular realities of ethnicity or nationality.
    Once


    upon a time, when human beings wanted to make smart or stupid


    generalizations about other, further-away human beings, they did so based on


    ethnicity, religion, or place. Thus, Strabo thought that every day, Ethiopians


    cursed the sun that had so blackened their bodies, and Sir Thomas Browne,


    that humane man, explained at great length, to countrymen confused on the


    point, that Jews did not invariably stink. Under these systems of classifications,


    world-historical depredations took place—the beginnings of the slave trade


    and colonialism, pogroms, the entirety of recorded and unrecorded history. We


    are talking about the origins of a new way to justify evil, not evil itself.¹


    During the Enlightenment and Industrial Revolution, as local habits of


    production and livelihood were melted down and recast as global capitalism, so


    were these quaint methods of generalization liquefied and remade into the new


    scientific discourse of “race.” In this way of thinking, scientists scrutinized


    body pigmentation and skull shapes—not place or family—for evidence of


    transhistorical, trans-local group memberships. The anthropologist and skull


    collector Johann Friedrich Blumenbach was, for example, particularly taken by


    one of the items in his collection, which had formerly belonged to a sex slave


    of Georgian origin. He thought it the prettiest skull he’d ever seen. The


    Caucasus Mountains stretch through Georgia, and so, on this extremely solid


    foundation, we call people “Caucasian” to this day. For a long time, this'
  - '[PAGE 28]


    Caucasian race was also thought to consist of various subtypes, some of which


    —the Celt, the Jew, the people so permeated by the miasma of the Great


    Dismal Swamp that it turned them sallow—faced race hatred of their own.


    After World War II, an embarrassed world reshuffled its categories, reducing


    them to whites, Blacks, and Asians.


    This is the story that Nell Irvin Painter tells in The History of White People.


    To it, we could add the story that Theodore Allen told over the course of his


    life’s work, which Painter herself draws upon. Allen points out the startling
    fact


    that colonial law made no racial distinction between Black slaves and white


    indentured servants in the early seventeenth century; the legal categories


    “Black” and “white” took most of those hundred years to emerge. (Indentured


    servitude was not necessarily a better deal, in the early years, than chattel


    slavery. Many workers weren’t expected to survive the seven years of their term,


    and quite a few didn’t. On this point, Eric Williams, early in his classic


    Capitalism and Slavery, devotes a revealing passage to the similarities between


    the seventeenth-century slave ship and the conditions in which Irish servants


    traveled.) For Allen, the history of “whiteness” pivots on Bacon’s Rebellion in


    1676, when indentured servants, free Blacks, and enslaved Blacks fought


    alongside each other.


    The colonial upper classes saw a threat here. They thwarted it in the same


    way that, today, a cop might force a wedge between two men falsely arrested to


    induce the one to testify against the other: admit the one to certain privileges


    and confidences while threatening him with terrifying punishments. Treat the


    other guy worse, and be theatrical about it. Whip him, pour vinegar on the


    wounds, and whip him again. Thus the eeriness, the sense of a limitless horror


    lurking under everything, that reading about the history of American slavery


    often induces: this strategy requires the elaboration of endless new refinements


    of suffering. If hell is a misery that has no limits, men truly built hell here.'
