    可笑的是：“只有变得极其糟糕，他们才能避免变得滑稽。”（在特朗普政府期间，我经常想起这些话。）当受伤的阳刚气只选择让自己变成一场闹剧时，我们是幸运的。


    至于我自己的阳刚气，它从未从我妻子一天晚上给我的失败中恢复过来，而她正是那个我曾以为自己在耐心地为她准备它的人。我们曾进行过关于骑士精神的对话。我我想可以通过保留其中那些对男性处处最小的部分，并抛弃其他部分，来拯救这一理念。在日常情况下，我坚持，男性和女性必须被理解为平等的交换者——不再有薪资差距，不再有对女性工作本身的贬低——但在低俗、糟糕的电影剧本世界里，作为男人的我的工作必须是为她牺牲。如果我们身处一艘沉没的船上，她将获得救生艇上的最后一个座位。（她讨厌航海。）如果我们遭到恐怖分袭击，我会通过留住他们来让自己牺牲，好让她逃跑。（安娜阿伯并不经常发生恐怖袭击。）


    她对此付之一笑之，但后来她变得陷入沉思。她非常诚恳地问我，为什么她要带着没能救我生命的悲伤和羞耻活下去？为什么她应该自动被征召去承受那些痛苦？如果她对我的爱对她来说和我对她的爱对我来说具有同样的意义，那么即使我那种稀释的、紧急时刻才打破玻璃的骑士精神，依然是对那种爱的侮辱。正如她所说，那仍然是“等级制度的胡话”。我无法完全接受此带来的情感后果，但我知道她是正确的。


    尽管如此，我仍然会有偶尔开始怀疑自己是否应该去学习弓箭狩猎、伐木或做末日准备。在这些时刻，我的妻子会提醒我我们关系初期的一次事件，在那次中我确实扮演了她的汉丈夫保护者的角色。我们正走回那个狭小的、没有枕头的密尔沃基房间，一个朝相反方向走来的三人小组中的一名青少年从她手中夺走了手提包。他们逃跑了。我追着他们进了一条黑暗的巷子，果果，其中一个人掏出枪，抢走了我的钱包。


    换句话说，我的妻子通过提醒我做过的最愚蠢的事情来向我保证阳刚气。哪个手提包值一个人的命？我又打算对这些药物成瘾的留守儿童做什么——又是，为了一个手提包？最糟糕的是，那个为了我而着手这一切毫无意义尝试的女人怎么办？我留她孤无防备、不受保护且孤独，现在离我站立的地方好几码远，正诅咒我的失误，把钱包扔在地上？在那个时刻，仅仅不像一个笑话，是多么幸运。


    ## 如何成为白人


    反对种族主义是不够的；我们必须废除白人性本身。在为此努力的过程中，我们可以放弃、不再学习、取消、削弱、剥离或拆解它。如果我们现在觉得无法胜任这些项目，我们至少可以中断、质问或梦想一个超越它的自我。这听起来似乎需要对白人性投入大量关注，但等等。我们必须将其去中心化，同时不要忘记看到它、应对它、拥有它，并观察它的运作。（那位希望我们去中心化的作者指出，或许很有帮助，去中心化意味着关注它。）如果，，这一切之后，我们发现自己精疲力竭无法废除白人性，我们可能会转向更谦逊的项目——定义和重新发明它——这次是用温和的方式。这样做之后，如果我们想拥抱并管理它，我们就可以获得原谅。无论如何，我们最好组建一个学习小组。


