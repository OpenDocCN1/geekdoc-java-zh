    aspect of the New Deal, seen at the time of its passage as a breakthrough for


    Black people even with its racist exclusions of them, became a thing you’d only


    do if you were blinded by privilege. I have had actual conversations in which

    the claim that the working class often “gets coded” white meant that any

    discussion of said class secretly “centered” white workers—even when the

    interlocutors pointedly did not modify the phrase “working class” with

    “white.” (I sometimes feel that if the CIA did not invent such maddeningly

    vague phrases as “centering” and “coding” as a way to keep activists uselessly

    busy, it is only further evidence of American imperial decline.) People can use

    “working class” in a cynical or racist way, but it’s simple enough to point out

    that this is happening in a way that doesn’t effectively forbid all discussions
    of

    workers.


    And so now the Left is riven by a pointless debate between a supposed

    “class-only” Left and an “identity” Left. There are valid criticisms to make of

    “identity politics,” the most obvious of which is that it tends to toggle between

    being a theory of everything and being a set of simple commonsense

    observations. But no sensible person should seek to altogether do away with

    identity politics in a society as riddled with invented divisions as this one;
    it

    would be like asking every country to disarm except the biggest one. And while

    it’s true that the accusation of “class-only” leftism befalls anyone who talks

    about class, that is no reason to lean into the stereotype. Many on the left

    point out that identity politics is often used by “capital” to keep the working

    class apart; when critics of capitalism become hostile to the mere discussion
    of

    racism, though, they are playing out the other side of capital’s little plan.


    Most people who are not simply saying indefensible things to build their

    brand will agree that racism originated in class exploitation but that it now

    operates somewhat independently. The question is how much, and as this is

    not a question that can be answered in the abstract—it can only usefully be

    assessed about particular situations—the general “class vs. identity” question

    should be given a wide berth. Suffice to say that if you are truly worried about

    workers, you will always try to notice who they are and which of them is worst

    off. You will, if you do this, find yourself fighting racism, and also sexism,

    transphobia, homophobia, ableism—every systematized cruelty.


    To me, the useful idea is not “whiteness.” It’s not race at all, but—and here
    I

    am drawing on, or simply parroting, Karen and Barara Fields’s Racecraft—

    racism. Thinking about “racism” helps me to reach all the useful conclusions;
    it

    only spares me the useless ones. I can reach, for example, the conclusion, “I

    should be willing to pay reparation taxes,” simply by acknowledging that

    racism is an ongoing crime whose victims deserve, and, more to the point, need

    compensation to help them live well in the aftermath of that crime—just as

    would a raped woman, or an Asian man hit by a car, or a white man poisoned

    by the materials his boss forces him to work with. “Whiteness” adds nothing to

    my ability to reach this conclusion, nor to the way I live it out. All it gives
    me

    is a guilty look and a heightened self-consciousness around Black people. This

    struck me as an elegant solution when I first read Racecraft several years ago,

    and it still does, though the Fields sisters have unfortunately been taken up
    by

    some prominent thinkers who wish to discuss neither race nor racism. (Again,

    good ideas make the best pretexts.)


    The Racecraft move simplifies our thinking. And we need it to do so,

    precisely because racism is such a vast, powerful, complex system. It can even

    turn good deeds into bad ones, can make what a whitened person intended for

    good into a source of evil. I mentioned earlier that I had watched and tried to

    prevent the railroading of a Black friend. After that friend’s brief time in jail,

    my wife and I agreed that we would allow him to stay in our guest room for

    free, if he wanted, while he tried to resume life. (He ultimately insisted on

    paying rent, so we set it at the lowest amount he’d agree to and then never

    asked him for it.)


    The problem was that we lived in a whitened neighborhood. We had not set

    out to do so—my wife and I have both lived in poor and predominantly Black

    or Latinx neighborhoods without encountering the mythical dragons said to

    haunt those parts of the map. But we were both making grown-up money for the

    first time, and so we chose a few amenities—walkability and a decent

    kitchen. History, housing covenants, and employment discrimination did the

    rest.


    We were not naive, we thought. We made a point of telling our neighbors

    who our friend was and what he looked like. In effect, we were telling them

    that he had a right to be on “our” territory so that if they saw him coming and

    going at odd hours, they would not harm him or call the police. We did not

    assume that any of our neighbors in particular were racists; we just knew that

    it only took one. We must have forgotten to tell one neighbor—a nice man, with

    good politics, himself multiracial. He called the cops on our friend one night

    when neither of us were home. Our friend was simply sitting in his car.

    Nothing catastrophic ensued, but we worried that in trying to help our

    friend—to cast our privilege itself over him like a cloak—we had set

    him up. We could undo the situation only by kicking him out, which hardly

    seemed like the right choice. That is the power of racism: it can make even

    the truest friendship between people a trap. It can make even kindness, even

    so attempt to use one’s privileges to help those who don’t

    have them, into harm. Our friend, who moved out a few ago, has becoming

    another statistic. But that’s mostly just hard work and all of our luck.


    So, I am not downplaying the fiendishness or embeddedness of racism,

    the necessity of antirist struggle, the need for whitened people to lose some

    sleep and comfort, when I say that I think whiteness as a concept is

    useless except as a name for a powerful and ubiquitous misdescription. Racism

    is a labyrinth. Some of the sections have skylights and granite countertops.

    Most of them are dungeons. The minotaur has his habits, his favorite hunting

    grounds, but ultimately, he reserves the right to eat you in any of his rooms.

    What we must realize is that, whatever our different names, we are all in it.

    And we are all responsible for ensuring that every single person gets out.


    The theft of America from the peoples native to it might strike you as a bit of
    a lacuna in this story, as it struck me. From my limited research, it appears
    that the plunder of Native Americans was initially justified early on in terms
    more redolent of ethnicity (tribes, lineages, kingdoms) than of what people came
    to call “race,” though there are reports of Natives initially taking Europeans
    to be strange and monstrous animals because of their white skin. King James I,
    according to one story, didn’t want John Smith to marry Pocontas because he was
    afraid that Smith would then claim royal blood. (She was, after all, a princess.)
    It’s as though he thought of this people, to whom Europeans collectively constituted
    a great curse, as though they were just another rival power. Obviously, as the
    idea of “race” came together, Indians too became “raced.”


    There is a longrunning argument over whether we should call this sort of racism
    “prejudice” instead of racism. This strikes me as an attempt to legitimize such
    beliefs, however slightly, but it’s also true that such ideas tend only to have
    interpersonal force, if they have any force at all, while anti-Blackness has whole
    institutions on its side. So here I leave the reader to their own judgment.

