    terms hopelessly muddled. Meanwhile, I kept watching bad movies. I drove across
    town to see a revival screening of King Kong Lives (1986), a film so ridiculous
    that the distributors refused to allow Siskel and Ebert to show clips of it on
    their television program. I stayed up late, finding and downloading the bits and
    pieces of a torrent file of the 1982 Turkish fantasy film Dünyayı Kurtaran Adam
    (The Man Who Saved the World), known in Anglophone countries as “Turkish Star
    Wars” because of its unauthorized and awkward splicing-in of actual Star Wars
    footage. I lost my wallet, not inappropriately, at a showing of The Dragon Lives
    Again (1979), a surreal festival of copyright infringement in which an actor playing
    (though not resembling) a resurrected Bruce Lee fights characters named the Godfather,
    the Exorcist, Popeye, James Bond, and Dracula, among others. I came to love Twilight
    (2008), with its hermetic vision of human psychology and conversation, its endearingly
    transparent wish-fulfillment aspects, its inexplicable baseball game. After it
    left theaters, I marveled at Batman v. Superman: Dawn of Justice (2016), that
    filmic analogue of a moody teenager hilariously incapable of remembering why he’s
    moody.


    “Bad” can also mean “morally coarsening”—which “trash film,” in the Bangs/Kael
    sense, often is. For that reason, I am not that interested in trash as such, though
    I admire some films thus labeled. Nor do I care, except sociologically, about
    the values assigned to varying brow placements. A lowbrow good movie is just a
    good movie. (Dawn of the Dead, the 1979 version, is a good movie.) The particular
    kind of badness I like is the film that is childish or incompetent—what it does,
    it does inadvertently.


    Some bad movies, for example, reveal through sheer lack of self-awareness the
    incoherencies and solecisms of the culture that produces them. These sorts of
    movies fascinate me in the way a too-honest idiot does after he’s had three or
    four drinks. Red Dawn (1984) is notoriously enjoyable in this way. More recently,
    Ava DuVernay’s adaptation of A Wrinkle in Time exemplifies this sort of badness.
    (DuVernay has done good work before and after this film, particularly in her studies
    of the prison-industrial complex, so I attribute the rich and extravagant lousiness
    of A Wrinkle in Time to its screenwriters and its rumored short production schedule.)
    Like many bad movies, A Wrinkle in Time is full of moments that, if done in a
    self-aware spirit, would constitute unanswerable satire. Passing this test are
    the scenes in which Oprah Winfrey, as magical Mrs. Which, stands two stories tall,
    shimmering like a hologram and smiling benignantly upon heroic young Meg Murray.
    What a brilliantly sly commentary this almost is on Oprah’s odd place in American
    life, how she patronizes us from her billionaire height while remaining trapped
    in the thankless, dehumanizing role of white femininity’s wise, bodiless, never-quite-real
    cosmic Black friend. (I am less sure what it says about our culture when Reese
    Witherspoon, early in the film, turns into a giant flying lettuce.)


    Where the film does its greatest service, however—and where it provides a glimpse
    into American culture that is so dark, so total, that its badness lingers in the
    mind like greatness—is in the way it foregrounds the unconscious nihilism of the
    American worship of self-esteem. At one point, Mrs. Which says to Meg, “Do you
    realize how many events, choices, that had to occur since the birth of the universe
    leading up to the making of you? Just exactly the way you are.” She could say
    the same thing to Charles Manson or to Henry Kissinger or to a leaf blower, and
    be equally correct. (Manson would bob his weird little head in agreement: What
