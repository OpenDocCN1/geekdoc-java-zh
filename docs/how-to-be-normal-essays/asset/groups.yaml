    Like other languages, each of these allows certain statements as it disallows


    others. None of them are adequate to every occasion, but neither would the


    Greek epics or the Four Classical Novels of China or the Harvard Classics be if


    we could somehow make the knowledge of any of these universal. These are all


    great bodies of art, but some of us would argue the same about the oeuvre of


    Bob Dylan or The Simpsons, or the rhymes of Jay-Z, if not memes.


    American intellectuals’ persistent attraction to the idea of a synthetic


    common culture, pulled together from the best bits of everything everywhere,


    seems to me like a displaced form of artistic ambition. It is Richard Wagner’s


    dream of the Gesamtkunstwerk that unites every art into an unanswerable,


    unignorable synthesis, or the modernist dream of an all-powerful new symbolic


    language formed from the synthesis of new and old, the reblooding of the past.


    The intellectual wants to compile and curate this language while the artist


    wants to invent it. Each wishes for something that cannot be. Precisely because


    we can use them to talk to each other, common languages can leave us feeling


    more fragmented; they let us state our differences more clearly. Language


    consolidates and it splits. We live among fragments and see through various


    glasses darkly.


    Contemporary American mass culture blends many of the elements of the


    lowbrow with the dutiful, striving, effortful qualities of middlebrow. Our true-


    crime podcasts combine the traditional sensationalist appeal of that genre with


    sophisticated social ideas borrowed from academic feminism. Novels come to


    us bearing words like urgent and necessary on their covers. If writers once


    gloried in their superfluity—“Poetry makes nothing happen,” W. H. Auden


