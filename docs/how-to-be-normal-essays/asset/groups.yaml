    (I would argue that Paul himself doesn’t always grasp its full implications.)
    I


    have, in this essay, left some readers, I think, with the impression that my'
  - '[PAGE 103]


    parents were graceless and strict. In fact, their religious views interacted with


    their circumstances and basic dispositions in a way that produced an


    unclassifiable parenting regime, a combination of consumer indulgence and


    Protestant moral seriousness and American work-worship and strange


    Victorian pruderies that I remember with the affection that we feel for all


    unrepeatably strange things. I was not allowed to say “butt,” but I saw the


    same number of onscreen murders as any other TV-watching American. (I am


    not sure that art should ever be banned, but if I were to start anywhere, it’d
    be


    there.) I was not allowed to listen to Black Sabbath, but my father once spent
    a


    week watching Wagner’s Ring cycle on PBS. (Sabbath’s first three albums are


    more Christian than Parzival.) My joy in life was constantly shadowed by the


    possibility of my or other people’s damnation, but I never suffered the deep


    violence that is often done to the soul of the irreligious middle-class child
    who


    is raised to really believe in American meritocracy. When I lost my virginity,


    and the fact became known—the evidence was my then-girlfriend’s swelling


    belly—I was made to apologize to the entire congregation of my church. And


    yet my parents, to whom, along with my girlfriend, I actually did owe an


    apology—the upshot of my irresponsibility was that her first child, and their


    first grandchild, went to live with kind strangers in Canada—were never really


    angry with me in the first place. (As for the girlfriend, she was psychologically


    unwell and deeply abusive, which complicates an otherwise unbroken


    monologue of self-recrimination that I subvocalize as though it were a mantra.


    Nor can I simply lament the entire episode, as it led to the existence of a


    person I am glad to know. In this life, one can’t even have simple regrets.)


    I heard a lot from my parents, growing up, about God’s mercy and God’s


    justice, which were like His left and right arms. His justice caused him to


    rightfully damn a large number of people, likely the majority, to hell for their


    sins. His mercy caused him to save some of those people for no reason at all,'
  - '[PAGE 104]


    gratuitously.³ One was enjoined to trust in the mercy, for one’s own part,


    absolutely, and to expect the wrath of the judgment on any other person,


    equally absolutely. It may be due to my lack of Keatsian negative capability,
    my


    yokelish desire to make sense of things, that I can’t imagine how this schema


    works for anyone. A person with the slightest imagination will easily construct


    a scenario in which God foreordains, as the term of art has it, a person to


    experience all the usual accoutrements of salvation—a powerful conversion


    experience, a conviction that Christ has died to save one’s soul, etc.—but in
    a


    fake way, one that somehow doesn’t count so that God can be “glorified” by


    your damnation, just as He is thought to be glorified by all the other


    damnations. Why wouldn’t God do this? Obviously nothing is off the table for


    a God who makes souls just to damn them. (I did, of course, construct exactly


    this scenario and scraped my flesh with it like Job with his potsherd.)


    Yet when it came to parenting, my mother and father were almost all mercy


    to a frankly scandalous degree. They parented as though God were the kind of


    being who would grant not one, but an infinity of chances for salvation, the


    kind of being who would keep the question of His child’s salvation open until


    that child was ready or desperate enough to resolve it in the affirmative. Given


    the harshness of some of their on-paper beliefs, and the intensity with which


    my father was abused by his parents and the anger this abuse left him with,


    this is not to be taken for granted. It is, for all their gaping flaws, a miracle.


    Perhaps that is another reason why so much of my youthful struggle with them


    centered on music: for only music is powerful enough to resolve such tensions.


    I think of myself—perhaps inevitably after all that confusion—as religious


    these days but not spiritual. I am content to hold my beliefs rather than feel


    them, and to hold them, even, at an ironic distance. Spirituality poses the last


    and scariest tension that runs through fundamentalism as it does through


    many kinds of religion: that between an infinite God and the self. No thanks.'
  - '[PAGE 105]


    Avoiding active spirituality seems to work for months at a time, but then I


    dream, and the dream always involves music. Lester Bangs once wrote that he


    was pretty sure Van Morrison’s Astral Weeks was a mystical document, and in


    his essay about it, he comes as close as a person probably can to


    communicating a purely private epiphany. The thing about mystical


    experiences is that everybody doesn’t have the same ones. This makes them


    hard to trust, in the same way that all the feelings we call “religious,” in their


    very variety, become hard to trust. If it’s cold or hot over there, we should
    all


    be able to feel it, rather than some of us yelling “Hot! Hot!” or “Cold! Cold!”


    while the others scratch their heads. I am already exhausted from a lifetime of


    adding up all the reports, tabulating them, weighing them against each other.
    I


    am already exhausted from trying to resolve, for example, the contradiction


    between my parents’ practice and their loveless theology, or my father’s total


    certainty that I would find no grace or goodness in the music that I loved, and


    my hourly experience of that music; or the radical possibilities inherent in


    fundamentalism’s rejection of the world with its smug presence at the center of


    the empire that now bestrides that world.


    Not long ago, in the Christianity and Radical Social Thought group that I


    lead, we read “Prayer as Crucible,” an essay by the theologian Sarah Coakley.
    It


    details her time leading a silent prayer group in a men’s prison. Coakley is


    reflective enough to ask herself about the politics of teaching silence to a group


    of the silenced, but she soon realizes that there is nothing more radical in a


    prison than asserting control over noise and silence. Prisons are oppressively


    noisy spaces by design. My father-in-law came home from his long sentence


    desperately needing to have the television on many hours a day, to be talked


    over or narrated ad lib, as though he had to take the prison dayroom with him,


    as though that atmosphere were a bullet that had been fired into his body and


    now couldn’t be removed without damaging vital organs.'
