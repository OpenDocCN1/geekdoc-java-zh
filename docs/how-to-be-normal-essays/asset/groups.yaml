    lowbrows, menaced only by the “busy-bodies” in the middle. A Woolfian


    highbrow, who “rides his mind at a gallop across country in pursuit of an idea,”


    needs the lowbrow, who “rides his body in pursuit of a living at a gallop across


    life.” Who else will press the highbrow’s suits, drive his car, fight his wars?
    And


    the lowbrows in turn need the highbrows, for without highbrows they will not


    have movies to go to. “It is one of the prime necessities of life to \[lowbrows\],”


    Woolf writes, “to be shown what life looks like” via art. She treats this


    arrangement as one of mutual satisfaction, even love. “I love lowbrows,” she


    writes. (To a reader of Woolf’s journals, which endlessly record her


    exasperation with various servants, this announcement comes as a surprise.)


    Woolf blames middlebrow people—“the man, or woman, of middlebred


    intelligence who ambles and saunters now on this side of the hedge, now on


    that, in pursuit of no single object, neither art itself nor life itself”—for


    introducing disharmony to this once cozy relationship. She condemns them in


    terms that any student of social movements will recognize:


    Have I then made my point clear, sir, that the true battle in my opinion


    lies not between highbrow and lowbrow, but between highbrows and


    lowbrows joined together in blood brotherhood against the bloodless and


    pernicious pest who comes between? If the B.B.C. stood for anything but


    the Betwixt and Between Company they would use their control of the air


    not to stir strife between brothers, but to broadcast the fact that highbrows


    and lowbrows must band together to exterminate a pest which is the bane


    of all thinking and living.


    This is how factory owners talk about labor organizers, how southern


    gentlemen talk about “outside agitators.” It has that unmistakable note of a


    person who mistakes an exploitative stalemate for an ecological balance.


    What does Woolf find so objectionable about these people in the middle?


    She writes with such an aristocratic high-handedness—that air of “If you have'
