    **对***中西部未来》(Midwest Futures)***——MIPA 和 IPPY 奖得主，以及2020年《共同》(Commonweal) 入选书籍的赞誉：**


    “克里斯特曼在日益增长的新中西部经典中占据了自己的之地，与莎拉·斯马什（Sarah Smarsh）的《故乡》以及哈尼夫·阿布杜拉齐布（Hanif Abdurraqib）作为纪录片的诗歌并列。”——Aarik·丹尼尔森，《雨中出租书评》


    “历史、回忆、实地报道和文学评论的结合，让我对我报道过的一个地区有了许多新的认识。”——詹姆斯·法洛斯（James Fallows），《大西洋月》


    “描写中西部意味着冒着加入一系列不断重复、原地踏步陈词滥调风险。[克里斯特曼]并没有试图将该地区固定在单一的论点或叙事上，而是将其多样性构成了一幅马赛克。”——梅根·马兹（Megan
    Marz），《华盛顿邮报》


    “这是我这一中最被低估的作家之一的佳作，探讨了一个并不容易写作的话题。读起来太快乐了，我一天就读完了。”——斯科特·博尚（Scott Beauchamp），《华盛顿审查者报》


    “克里斯特曼邀请读者和其他进入一个对我们未来负责的‘我们’之中。他拒绝了极化话语中那种只会指责对方的最糟糕的本能。”——诺亚·托利（Noah Toly），《刺猬球评论》


    致 B. D. 麦克莱，他给了我灵感；


    致亚当·佩蒂蒂（Adam Petty），他给了我标题；


    以及我的父亲，他给了我故事。


