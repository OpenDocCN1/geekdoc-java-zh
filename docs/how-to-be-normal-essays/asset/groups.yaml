    HOW TO BE A MAN


    At the time my wife and I were beginning to date, I owned a broken bed. The

    box spring had a biggish crack on one side, which caused you to feel like you

    were being gradually swallowed in the night—an effect that was seriously

    exacerbated by the presence of a second person. I had not bothered to buy

    pillows when I moved to Milwaukee, reasoning that old pants stuffed in a

    pillowcase could not possibly feel that different. I did, however, have a desk,

    which I had carried a mile and a half from the Salvation Army, on my

    shoulders, in August. I should mention here that I have never been what

    anyone would consider macho. It simply hadn’t occurred to me that I was

    allowed to live any other way.


    My wife now amuses guests by narrating this period in our lives in the

    sitcom, gender-essentialist mode: the silly, uncivilized man; the patiently

    exasperated woman. I defend myself by citing my actual poverty at the time—I

    was a graduate student with no savings, from a working-class family, for whom

    a $12,000 yearly stipend was a massive windfall. But she and I are both right:

    My choices rested on many years of socialization, as much as they unfolded

    against a background of economic precarity. Were there not buses? Could I not

    have asked a friend with a car to help me move the desk? Who purchases a

    Riverside Chaucer and a copy of the Go-Betweens’ 16 Lovers Lane before he

    gets around to pillows? I would never have put myself through all of that if I

    hadn’t spent my life believing that it was my job to be, precisely, a man.


    As real as I know male privilege to be—if I forget it for a moment, I have the

    newspapers to remind me—it is surreal to find maleness, an aspect of my life

    that I associate mainly with chosen discomfort, equated now, by so many

    people, with bovine self-complacency. A woman coworker, explaining the

    different ways men and women move through the world, says to me, “As a

    man, you never think about how much space you take up.” I nod, because I

    agree with the point she intends to make, even if the wording of the statement

    is so literally false in my case. “Men don’t have to think about how they look,”

    says another coworker, also a woman, and I nod again. For some reason, these

    trivial exchanges stick with me. I realize, days later even that the reason these

    statements are still bugging me is that I have fretted about the physical space
    I

    occupy for most of my clumsy, in-the-way, yo-yo-dieting life. I am literally

    never not sore from the gym because I am so concerned with looking a certain

    way.


    “What is it like to be a cis-gendered, heterosexual man?” a friend, a trans

    man, asks on Facebook. “What is it like to feel at home in your body?” The

    only answer I can come up with is that I never feel at home in my body. I live

    out my masculinity most often as a perverse avoidance of comfort: the refusal

    of good clothes, moisturizer, painkillers; hard physical training, pursued for
    its

    own sake and not because I enjoy it; a sense that there is a set amount of

    physical pain or self-imposed discipline that I owe the universe.


    Examples are easy enough to list. I ran cross-country for all four years of

    high school. I wasn’t good at it, I didn’t get along with my teammates, and I

    found almost every moment of every race or practice excruciating. (I was still
    a

    fundamentalist Baptist at that point and wondered, during races, whether the

    literal hell that awaited the unsaved might feel like this.) Yet I never thought
    of

    quitting. I had found the little niche where I could contribute my little tithe
    of

    unnecessary pain to the universe, and this, I somehow understood, could give

    me some sort of purchase on manhood that I was too small and uncoordinated

    to get by winning fights. I still remember the aggrieved scorn with which my

    cross-country teammates and I responded to the guy who did quit, after

    two years, for the perfectly sane and healthy reason that he preferred watching

    cartoons. He wasn’t on the varsity squad; his absence had no effect on our

    team’s standing in the state rankings. But we acted as though he’d cheated us
    in

    some way—as though he’d left us to do some terrible group project alone.


    For years, as an adult, I was obsessed with learning to box. (An anarchist

    friend of mine was going to teach me, until he left town for vague but

    important-sounding reasons, as one’s anarchist friends are prone to do.) For a

    while, I gardened, and when my wife and I first moved to Ann Arbor, I’d

    spend hours working in the yard, always finding the costliest, least productive,

    most epic way of doing everything. I tried to remove a tree stump with my

    hands, a saw, and a shovel. I cleaned the gutters with a ladder so short that
    I

    pulled a shoulder muscle reaching overhead to dig out the muck. I’d purchased

    that ladder, too, at a nearby Salvation Army and had walked home carrying it

    on my head like a canoe. I mowed the lawn with a series of Nixon-era push

    reel mowers I’d rolled home from the same place. I enjoyed none of these

    activities. I did them out of fear of what would happen if I didn’t become, or

    continue to be, the kind of person who did them.


