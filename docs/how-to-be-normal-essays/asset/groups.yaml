    I love Coakley’s essay, but I hate meditating. Meditation has always made me anxious,
    has always triggered the feeling that I’m about to miss something. It reminds
    me of being in rooms full of evangelicals or Pentecostals (a group with which
    my family had serious theological disagreements, but in a small town, the various
    flavors of fundie tended to mix) and hearing someone yell “Can’t you feel the
    spirit of Jesus?” and everyone else yelling, “yes,” and feeling: “No, I’m mostly
    hungry and kind of nervous,” and wondering why Jesus liked everybody else better
    than me. It is yet another subject about which other people say, “You’re getting
    warmer! You’re getting warmer!” while my own temperature stays the same or drops.
    Why would God give me a noisy brain would God give me a noisy brain and then ask
    me to silence it? My noisy brain feels like all I have to offer the world most
    of the time.


    So we read Coakley and we talked and I said how ironic it is that I like this
    article and then went on to revile meditation and mindfulness with my usual intensity,
    outlining my frustrations with mysticism in general and concluding with my beloved
    catchphrase, “I guess I’m religious but not spiritual.” Then a young man who had
    never attended the group before said: “That’s fascinating, because meditation
    is the only thing that has made me even somewhat open to the existence of God.”
    I asked him to say more, both because I wanted someone to challenge my point of
    view for the good of the group and because, as I suppose I always do when this
    subject comes up, I secretly hoped he’d be able to explain the trick. The young
    man said a number of helpful and intelligent things. He did not reveal the trick.
    I don’t think the trick can be revealed.


    He said, among other things, that meditation made a person more fully present.
    I have always wondered whether being fully present even has any spiritual value.
    Isn’t the point that you want more of God and less of your sorry ass?


    And then, a few mornings later, I woke up thinking about “Bothered,” a song by
    the little-known Cincinnati group Over the Rhine. Along with “Latter Days,” by
    the same group, that song is one of maybe two or three mystical experiences I
    have ever had. With “Latter Days,” the vision arrived all at once, the first time
    I ever heard it. I was an extremely emotional young man in a relationship that
    was important to me, and the song reassured me that the thing was going to end
    in an incredibly painful way, just as I suspected it would, and that that intense
    sadness—weeks and weeks of being so upset I couldn’t sleep, could barely breathe,
    was just a sucking wound on legs—was part of a beautiful and significant and joyful
    fabric and could not be removed from it. (This has, it occurs to me now, turned
    out to be true.)


    With “Bothered,” on the other hand, the experience sort of spread out gradually
    through my life, for after that relationship, my body seemed to swap out depression
    for anxiety without asking me and I became a terribly nervous and irritable young
    man instead of a terribly emo one. At every moment of every day, I felt that there
    was some point I was missing, some essential spiritual sense in which I had already
    failed, and I could not stop unstitching the garment of my life, trying to figure
    out where I’d gotten it wrong. I would ask myself, all the time, with prosecutorial
    intensity, what I was “really” feeling or why I wasn’t feeling something else,
    which is like shaking a snow globe really hard and then trying to see what’s in
    it. Your feelings get too jumbled and massed to look like anything in particular,
    which makes you think there’s nothing in there at all, that you’re an evil blank
    the world would be well rid of. You try to shock yourself into feeling something.
    You tell yourself, again and again, in a final, I’m-dumping-you-for-real-this-time
    voice, “You don’t feel anything, you son of a bitch,” hoping for the sudden breakdown
    that such speeches always provoke in soap opera characters because then you’d
    know you do feel after all, you are human.


    I spent about seven years like this. Essential pieces of myself seemed to have
    gone missing; I experienced only 10 percent of what was happening to me, while
    the rest of me went around the world like misdelivered mail, and I had to go find
    it and couldn’t figure out how to begin. “Bothered” was always a kind of beacon
    in all that noise; it gathered and symbolized something. (Over the Rhine recorded
    the song at least three times; only the 1997 piano-led version has that intensity
    for me.) Perhaps, for the experience of God to begin, you have to pull a little
    more of yourself together, unappealing as that task is. You have to gather your
    selves like sheaves and offer them.


    3 Not all fundamentalists are Calvinists, nor are all Calvinists fundamentalist.
    (On one side, consider the “freewill” Baptist. On the other, consider Marilynne
    Robinson or Karl Barth.) However, the idea of inerrancy arose in a Calvinist context,
    and the history of the two groups involves considerable overlap.


    ## HOW TO CARE: ON MARK FISHER


    Mark Fisher committed suicide on Friday the 13th of January 2017, a cursed day
    in a cursed year. Yet his students showed up for class as usual the following
    Monday, joined by some of Fisher’s former students and many friends. “A class
    of twenty doubled, perhaps trebled,” writes Matt Colquhoun in his introduction
    to Postcapitalist Desire, a collection of Fisher’s final lectures published in
    September. “[F] familiar and unfamiliar . . . gathered together on an abjectly
    miserable Monday morning, waiting for Fisher himself to walk through the door
    and reveal his hoax.” They reminisced and grieved and gathered again the following
    Monday and the Monday after that. They read their way through the remainder of
    Fisher’s syllabus and beyond it. The group called itself Nothings Into Somethings.
    (Colquhoun takes up their story in more detail in Egress: Mourning, Melancholy,
    and Mark Fisher, also published this year.)


    As it happens, Fisher had long ago written the perfect phrase to describe what
    these students and friends were doing and tossed it into a blog post about someone
    else’s book. He wrote it in 2005, when most people who knew of him at all knew
    him as a sort of recherché blogger with a university teaching job, a writer steeped
    in the cultural-theory jargon of the 1990s and in the coruscating hyper-referential
    style of early-eighties British critics such as Ian Cox and Paul Morley. (The
    closest American analogue to these figures might be Greil Marcus.) In an entry
    on his blog, he wrote: “More or less everything I’ve written or participated in
    has been some sense an attempt to keep fidelity with the post-punk event. Post-punk”:
    Not the loud, colorful, simple, proudly incompetent, and often nihilistic music
    known then and now as punk rock, but the strange and often foreoding music that
    came immediately after it, the artists who occupied the space of possibility punk
    had created—Joy Division, the Mekons, the Fall, the Raincoats, Wire—turned punk’s
    nothing into something, or many somethings. And just as Fisher attempted to keep
    fidelity with that brief opening in cultural history, that moment a person could
    turn on the radio and instantly feel that the world of the possible had expanded,
    his students and friends what sort of event was he that his students should respond
    so fully to his presence and to his absence? The three short books of cultural
    criticism that Fisher wrote during his lifetime, Capitalist Realism (2009), Ghosts
    of Life (2014), and The Weird and the Eerie (2016), probably remain the best way
    into his thought. Capitalist Realism is a serious work of cultural theory, but
    its power comes from the wounding accuracy with which it describes the ways we
    feel (or felt) trapped by such a post-political world. The result is an ongoing
    state of what Fisher calls “depressive hedonia”: restlessly toying with your phone
    because you can’t believe there’s really anything else to do. His two books that
    followed explore the alternative futures and unexpressed possibilities embodied
    in the strange pop culture of the mid to late twentieth century, an era, at least
    in England, of daring experimentation carried out via mass-media forms. (Fisher,
    a master of the two-word descriptive phrase, called the latter “pop modernism.”)

